  \n**A.** 紧迫性 (Urgency)\n**B.** 熟悉感/好感 (Familiarity/liking)\n**C.** 社会认同 (Social\
  \ proof)\n**D.** 信任 (Trust)\n\n## 13. 当你准备在 ATM 机上输入密码时，注意到身后闪过光。。身后只有一个人，他们拿着手机。他们正疯狂地点击屏幕上的按钮，并避开与你的任何眼神交流。这个人可能在尝试哪种攻击？\n\
  \n**A.** 尾随 (Tailgating)\n**B.** 冒充 (Impersonation)\n**C.** 窥视偷窃 (Shoulder surfing)\n\
  **D.** 语音钓骗 (Vishing)\n\n## 14. 你收到一个你不认识的人的 Facebook “朋友”请求，但你们似乎有很多共同朋友。你接受了请求。几周后，你收到了同同一个人的请求，要求你点击一个链接并参加调查。你注意到不少同事已经做过同样的测试。当你注意到你的很多同事已经做过同样的测试时，点击了链接。这可能使用了哪种社会工程学原理？\n\
  \n**A.** 紧迫性\n**B.** 信任\n**C.** 共识\n**D.** 稀缺性\n\n\n\n\n\n# 15. C. 报价限时性/必须立即行动的特性是利用紧迫性原理诱骗你点击下一个链接。该网页正试图迫使你在尚未得及检查链接并考虑该链接是否合法之前点击该链接。\n\
  \n# 第 14 章\n\n* * *\n\n## 应用攻击与无线攻击\n\n在本章中，你将：\n\n* 解释无线攻击的类型\n* 解释应用攻击的类型\n\n\
  * * *\n\n攻击利用系统中的漏洞使攻击者能够获得系统的访问权限。两种常见的攻击模式是：通过无线网络，利用无需物理连接即可连接的能力隐蔽地发起攻击；通过系统中运行的应用程序进行攻击。应用程序代表了一种攻击途径，因为它们通常比现代已打补丁的操作系统具有更多的漏洞。\n\
  \n### 无线攻击\n\n随着无线使用的增加，无线协议的安全性已成为整个网络安全中一个更重要的因素。作为一名安全专业人员，你需要理解无线网络应用，因为广播网络信号存在固有的风险，任何人都可以截获它。在公共无线电波上传输不安全的信息等同于将公司的密码贴在大大正门口。\n\
  \n本章将介绍无线攻击的类型以及管理无线技术使用相关风险的防御措施。\n\n### 恶意接入点\n\n如果设置了未经授权的无线接入点，它被称为 `rogue access\
  \ point`（恶意接入点）。这些接入点可能由好员工设置，也可能由具有物理访问权限的攻击者隐藏。如果攻击者能够获得组织的有限物理访问权限（例如短暂潜入建筑），他们可能会设置一个恶意接入点。攻击者随后可以在网络上设置一个\
  \ AP，通过将其放置在外部防火墙或网络入侵检测系统 (`NIDS`) 类安全措施之后，可以在日后从容地连接到无线网络。这种方法降低了被物理安保人员发现的风险，而且如果发现了\
  \ AP，它也不会直接指向任何可追溯的地址。\n\n### 干扰/妨涉\n\n无线网络需要通过无线电链路建立连接。无线信号容易受到阻塞和干扰，这会对无线网络构成拒绝服务类型的攻击。并非所有的阻塞和干扰都是故意的。无线网络接入点与其他\
  \ RF 设备的布局可能会导致信号不良区域或干扰，从而引发网络连接问题。\n\n### 恶性孪生\n\n`evil twin`（恶意孪生）攻击是指使用攻击者拥有的接入点，该接入点通常经过高功率和高增益天线的增强，使其对连接它的用户和计算机看起来像是一个更好的连接。通过让用户连接到恶性接入点，攻击者可以更容易地分析流量并执行中间人攻击的攻击。对于简单的拒绝服务，攻击者可以使用干扰来阻塞无线信号，使任何计算机无法成功连接到接入点。\n\
  \n### 拨盘拨号与战争驱动\n\n`War dialing`（拨盘拨号）用于描述攻击者尝试发现计算机系统和网络中不受保护的调制调器连接。该术语源于 1983\
  \ 年的电影《游戏入侵》（WarGames），电影主角使用电脑拨打各种电话号码以寻找连接的调制调器。\n\n`War driving`（战争驱动）被指代攻击者带着具有无线功能的计算机（通常在车里）在某个区域游荡，寻找他们可以访问的无线网络的活动。某些安全措施可以限制攻击者成功此类活动的能力，但与拨盘拨号一样，设置无线网络的人并不总是激活这些机制。在大多数情况下，运行无线网络的人甚至不会注意到有人在使用在使用他们的网络。当未经授权方执行违反网络所有者与其\
  \ ISP 之间服务条款的行为时（例如非法共享音乐、视频和软件），就会导致问题。在这种情况下，ISP 和内容所有将指向网络所有者，而不是那个开车并借用带宽的人。\n\
  \n当无线技术仍然“稀少”时，某些地区的路缘和其他地方开始出现符号，指示存在开放或未保护的 Wi-Fi 网络。就像上个世纪的流浪汉标记（hobo markings）一样，这些标记被称为\
  \ `war chalking`（战争粉笔），在全球各地的市中心和各类社区仍然可见。随着 Wi-Fi 变得无处不在，战争粉笔的需求和使用正在消失，就像过去的流浪汉符号一样。\n\
  \n\n\n\n\n随着蓝牙的普及，人们开始尝试寻找其漏洞。蓝牙功能允许设备进行易于配置以实现通信，而无需网络地址或端口。蓝牙通过配对来建立设备之间的信任关系。为了建立这种信任，设备会广播其功能，并要求输入密钥（passkey）。为了帮助维护安全性，大多数设备要求在两台设备上都输入密钥；这可以防止默认密钥密钥的攻击。蓝牙协议对服务和配对属性的广播，正是某些安全问题开始的源头。\n\
  \n### 蓝光劫持 (Bluejacking)\n\n`Bluejacking` 是一个用于向另一个蓝牙设备发送未经授权消息的术语。这涉及到以电话录联系人的形式发送消息：\n\
  \n![image](img/f0250-01.jpg)\n\n然后，攻击者通过蓝牙将消息发送给可能的接收者。最初，这涉及发送短信，但较现代的手机还可以发送图像或音频。这种行为的一种流行变体是传输“冲击性”图像，其特征是令人不安或粗俗的照片。由于蓝牙是一种短距离协议，攻击者和受害者之间的距离必须在\
  \ 10 英尺（约 3 米）左右。受害者的手机也必须开启蓝牙，并且必须处于可发现模式。在某些早期手机上，这是默认配置，虽然这使得连接外部设备变得更容易，但也允许了针对手机的攻击。如果关闭蓝牙，或将设备设置为不可发现模式，就可以避免蓝光劫持。\n\
  \n### 蓝光盗取 (Bluesnarfing)\n\n`Bluesnarfing` 与蓝光劫持类似，它们使用相同的联系人传输协议。不同之处在于，攻击者不是向受害者的手机发送未请求的消息，而是复制受害者的信息，这些信息包括电子邮件、联系人列表、日历以及该设备上的任何其他内容。具有媒体功能的较现代手机可能会被窃取私密照片和视频。蓝光盗取过去需要一台带有蓝牙适配器的笔记本电脑，这使得识别可能的攻击者变得相对容易，但现在移动设备上也有可用的蓝光盗取应用程序。`Bloover`\
  \ 是蓝牙和 Hoover 的合成词，是这样一个作为 Java Applet 运行的程序之一。大多数蓝牙手机需要处于可发现状态，蓝光盗取攻击才能生效，但并不一定需要进行配对。理论上，攻击者还可以暴力破解设备的唯一\
  \ 48 位名称。一个名为 `RedFang` 的程序尝试通过发送所有可能的名称并查看哪些有响应来执行这种暴力攻击。这种方法在蓝牙 1.2 中通过匿名模式得到了解决。\n\
  \n### 蓝光入侵 (Bluebugging)\n\n`Bluebugging` 是一种比蓝光劫持或蓝光盗取严重得多的攻击。在蓝光入侵中，攻击者使用蓝牙与设备建立串行连接。这允许访问完整的\
  \ AT 命令集——GSM 手机使用的 AT 命令类似于 Hayes 兼容调制调器。这种连接允许对手机进行完全控制，包括在手机所有者不知情的情况下拨打任何号码。幸运的是，这种攻击需要设备配对才能完成，而最初容易此类攻击的手机已经更新了固件来修复此问题。现在要实施这种攻击，手机主人需要交出手机并允许攻击者物理上建立连接。这种攻击提醒了技术可能会产生重大的隐藏风险。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示**：除非你刻意配对设备，否则应始终关闭可发现模式。\n\n## 数据包嗅探\
  \ (Packet Sniffing)\n\n无线网络的特征是通过无线电波进行连接。范围内的发射器所有接收器都可以截获 RF 信号，这被称为`数据包嗅探`。无论是在咖啡馆、机场还是工作环境，范围内的任何机器都可以拦截设备与访问点之间的大量的对话。解决方案非常简单，但经常没有被采用——加密。如第\
  \ 4 章 讨论的那样，使用 `WPA2` 将防止其他设备拦截通信。\n\n### 近场通信 (NFC)\n\n近场通信 (NFC) 是一种在短距离（小于 1\
  \ 英尺）内使用的低功耗非接触式通信方法。NFC 使用磁感应来触发 NFC 设备之间的通信。其中一个设备可以是被动式标签，例如 RFID 标签。NFC 具有若干潜在的安全问题，从窃听到数据损坏、拦截和设备被窃等应有。NFC\
  \ 通道本身的范围使得大多数截获和窃听攻击难以实施。对于敏感数据，可以采用涉及加密的安全通道模式，这使得实际的截获变得毫无意义。\n\n安全通道模式的通信还可以减少攻击者操纵数据传输的能力。仍然可能创建中断或拒绝服务，但在使用安全模式时，可以确保成功传输的完整性。\n\
  \n由于 NFC 经常与移动设备相关，一种安全威胁是设备本身的丢失。如果设备没有基本的安全措施（例如未启用密码），那么通常通过 NFC 传输的信息（如信用卡信息）可能会被获得设备的人获取。锁定设备的移动移动安全做法可以降低这种风险。\n\
  \n### 重放攻击 (Replay Attacks)\n\n当攻击者捕获双方之间通信的一部分，并在稍后重新发送该部分时，就会发生`重放攻击`。例如，攻击者可能会重放财务交易中使用的系列命令和代码，导致交易被执行多次。通常，重放攻击与尝试绕过验证机制有关，例如对证书或票据的捕获和重复。在无线系统中，重放更容易，因为其他信号可以在空中被复制。\n\
  \n防止重放攻击的最佳方法是使用加密、密码身份验证和时间戳。如果证书或票据的一部分包含日期/时间戳或过期日期，时间，并且该部分作为票据或证书的一部分被加密，那么在稍后重放它将是徒劳的，因为它将因为过期而被拒绝。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示**：无线连接特别容易受到重放攻击。防御重放攻击的最佳方法是通过使用加密和合法交易的短时间帧。\n\
  \n### IV 攻击\n\nWEP 和 WPA 都依赖于初始化向量 (`IV`）来形成加密密钥，如第 4 章 所示。在 WEP 中，使用了较短的 24 位 IV，导致在相同的加密密钥下出现\
  \ IV 重用。这为针对密钥的攻击打开了大门，导致 WEP 被被破解。WPA 使用了较长但仍然不足的 IV 机制。\n\n### WEP/WPA 攻击\n\n\
  WEP 依赖于 RC4 实现，现在已知该实现实施不当，并且在协议的各个方面存在严重缺陷。这些问题使得破解 WEP 变成一项几乎轻而易举的练习。一种攻击涉及发送特殊的取消验证包，导致合法客户端重新与\
  \ AP 进行身份验证。攻击者随后捕获这些重新验证包中的初始化向量，并利用它们在几分钟内破解 WEP 密钥。另一种攻击是 chopchop 攻击，其中校验和使用的弱点允许攻击者操纵数据包并将其返回\
  \ WAP，并根据结果通过多次迭代确定加密数据包的内容。\n\n\n\n\nWPA 使用临时密钥完整性协议（`TKIP`）实现替换了弱弱的 IV 实现，解决了所有针对\
  \ WEP 的已知攻击。但在 WPA 中也发现了其他漏洞，因为它在设计时为了与 WEP 系统具有某种程度的兼容性。通过使用具有已知结构的短包（例如本地 DNS\
  \ 请求），可以对数据包进行暴力破解而不会触发某些保护机制，例如消息完整性码（`MIC`）。这不会泄露密钥，但允许对本应受加密方法保护的数据包进行操纵。今天，带有\
  \ `AES` 的 WPA2 通常被用于解决 WPA/TKIP 的问题。\n\n### WPS 攻击\n\nWi-Fi 保护设置（`WPS`）是一种简化无线网络安装和设置的辅助。开发该标准的初衷是创建一种方法，让没有接受过无线安全原理特定培训的用户也能轻松地设置\
  \ WPA 并向网络添加新设备。WPS 提供了一种轻松将新设备连接到网络的方法，可以通过按下访问点和新设备上的按钮，或者使用 `PIN`。`PIN` 既可以用在新设备上，也可以用在访问点。\n\
  \n2011 年，人们发现 `PIN` 方法最快可以在几小时内被暴力破解。一旦 `PIN` 被破解，就可以发现 WPA/WPA2 预共享密钥。由于 WPS 默认在大量设备上出厂，因此在设置期间，禁用此功能非常重要。\n\
  \n### 应用程序攻击\n\n针对系统的攻击可能发生在网络层、操作系统层、应用层或用户层（社会工程学）。早期的攻击模式针对网络，但今天大多数攻击都指向应用程序，这主要是因为大多数攻击的目标就在那里；正如臭名昭著的匪威利·萨顿那句名言所说：“因为那里有钱。”事实上，今天许多针对系统的攻击结合了网络、操作系统和应用程序中的漏洞，所有这些手段都是为了获取攻击的预期目标，该目标通常是某种形式的数据。\n\
  \n应用层攻击利用了与计算机应用程序相关的几个事实。首先，大多数应用程序是由一群程序员编写的大型程序，其本质决定它们在设计和编码上存在错误，从而产生漏洞。典型漏洞的列表请参阅\
  \ MITRE 维护的常见漏洞与披露（`CVE`）列表，`http://cve.mitre.org`。其次，即使软件供应商发现并修复了漏洞，终端用户应用补丁的速度也很缓慢，2003\
  \ 年 1 月份的 `SQL Slammer` 事件就证明了这一点。被利用的漏洞是缓冲区溢出，供应商在爆发前六个月就已提供了补丁，但由于大量未打补的系统，蠕虫仍然迅速传播。\n\
  \n### 跨站脚本\n\n### 跨站脚本 (XSS)\n\n跨站脚本缩写为 `XSS`，以区分于层叠样式表（`CSS`）。跨站脚本攻击是一种代码注入攻击，攻击者响应输入请求发送代码。这些代码随后由\
  \ Web 服务器渲染，导致代码被 Web 服务器执行。跨站脚本攻击利用了基于 Web 的系统的几个常见元素。首先是未能进行完全的输入验证。`XSS` 在响应输入请求时发送脚本，即使脚本不是预期的。\n\
  \n### 注入\n\n### SQL 注入\n\nSQL 注入攻击是一种针对任何基于结构化查询语言（`SQL`）数据库的注入形式，无论供应商为何。这种攻击的主要方法目的是将\
  \ `where` 子句更改为提供错误答案的子句。假设目标 SQL 语句是\n\n`select count(*) from users_table where\
  \ username = 'JDoe' and password = 'newpass'`\n\n值 `JDoe` 和 `newpass` 由用户提供并简单地插入到字符串中。虽然在功能上看似安全，但通过使用序列\n\
  \n`' or 1=1 --` 很容易被破坏，\n\n因为添加了 `or` 子句、配合始终为真的语句以及注释行的开头（用于阻止末尾的单引号），会将 SQL 语句更改为\
  \ `where` 子句失效的状态。这会返回所有记录：\n\n`' or 1=1 --`\n\n### LDAP 注入\n\n基于 LDAP 的系统也会受到注入攻击。当应用程序根据用户输入构建\
  \ LDAP 请求时，未能验证输入会导致不良的 LDAP 请求。正如 SQL 注入可以用于在数据库中执行任意命令，LDAP 注入可以在目录系统中执行的操作。搜索框中一个简单的通配符（`*`）就能返回通常超出查询范围的结果。\n\
  \n### XML 注入\n\nXML 也可以通过注入进行篡改。XML 注入可用于操纵基于 XML 的系统。由于 XML 在 Web 应用世界几乎无处不在，这种形式的攻击具有广泛的目标。\n\
  \n\n\n目录遍历攻击（Directory traversal attack）是指攻击者利用特殊输入来绕过文件系统的目录树结构。在未验证的输入框中添加 `../..`\
  \ 的编码符号，可能会导致解析器将编码解析为遍历代码，从而绕过许多检测元素，并将输入传递给文件系统，导致程序在与设计不同的位置执行命令。当它与命令注入（command\
  \ injection）结合时，输入可能导致未经授权的执行执行。此类问题被归类为输入验证错误，如果不进行代码走读并针对性地查找，将很难检测。这说明了在代码审查中使用“前\
  \ 25 种编程错误清单”的用处，因为它可以在开发期间提醒开发人员此类问题。\n\n目录遍历可以通过对输入流进行编码来掩盖。如果安全检查在系统解析器解码字符串之前完成，那么对攻击形式的识别可能会受到影响。表示特定输入形式有许多方法，最简单的被称为“规范形式”（`canonical\
  \ form`）。解析器被用于为操作系统渲染规范形式，但这些嵌入式解析器可能会在输入验证之后运行，使得仅通过字符串匹配更难检测某些攻击。\n\n### 缓冲区溢出\
  \ (Buffer Overflow)\n\n攻击者经常利用的一个常见弱点是缓冲区溢出。当程序提供的输入数据量超过其设计处理的能力时，就会发生 `buffer\
  \ overflow`（缓冲区溢出）。例如，如果一个要求输入 7 到 10 个字符电话号码的程序接收到了 150 个字符的字符串，会发生什么？许多程序会提供一些错误检查以确保这不会引起问题。然而，某些程序无法处理此错误，额外的字符将继续填充内存，覆盖程序的其他部分。这可能导致许多问题，包括导致程序终止或系统崩溃。在某些情况下，程序可以执行攻击者提供的命令。缓冲区溢出通常会继承被利用程序所享有的权限级别。这就是为什么使用\
  \ root 级访问权限的程序在受到缓冲区溢出攻击时如此危险，因为将执行的代码是在 root 级权限下运行的。\n\n事实证明，缓冲区溢出在各种程序中都可以被利用，从\
  \ UNIX 到 Windows，再到 Internet Explorer、Firefox (Mozilla) 等许多应用程序。从历史来看，按类型划分，超过 50%\
  \ 的安全事件是由于缓冲区溢出攻击引起的。它是最常用的黑客手段之一，用户主要的防御措施是让机器保持软件制造商提供的补丁更新。遗憾的是，补丁并未证明是一种非常有效的保护方法。许多人没有更新补丁，正如\
  \ Slammer 蠕虫攻击所示的那样，该攻击发生在微软发布针对该漏洞的特定补丁近六个月之后。即使补丁已通过热修复和服务程序包的形式广泛可用，许多 SQL 服务器仍未收到补丁，并受到了这种利用缓冲区溢出传播的蠕虫的影响。\n\
  \n![image](img/examtip.jpg)\n\n**考试提示 (EXAM TIP)** 缓冲区溢出可能发生在任何代码中，而带有特权运行的代码具有更大的风险。2014\
  \ 年，OpenSSL 库中一个名为 Heartbleed 的缓冲区溢出导致数十万系统处于易受状态，并暴露了全球数千万到数亿用户的关键数据。\n\n缓冲区溢出是输入验证攻击，旨在利用那些不验证输入长度的输入例程。惊讶的是，解决这个问题非常简单，只需要在写入内存之前验证所有输入长度即可。这可以通过多种方式实现，包括对输入使用安全的库函数。这是已被证明可以解决的漏洞之一，事实上，在在关注安全的安全的软件公司中，这种漏洞的流行程度正在大幅下降。\n\
  \n### 整数溢出 (Integer Overflow)\n\n`integer overflow`（整数溢出）是一种编程错误状态，当程序尝试将一个数值（整数）存储在无法容纳它的变量中时，就会发生。结果因语言和数值类型而异。在某些情况下，该值会饱和变量，假设定义类型的最大值。在其他情况下，特别是对于符号整数，它可能会溢变为负值，因为最高位通常预留给符号。这可能会导致程序出现严重的逻辑错误。\n\
  \n整数溢出很容易测试，静态代码分析器可以指出它们可能发生的地方。鉴于此，生产代码中不允许这些错误。\n\n### 零日漏洞 (Zero-day)\n\n`zero-day`（零日）是一个术语，用于定义新发现尚未修复的漏洞。大多数漏洞在研究人员或开发人员发现之前处于未知状态。如果研究人员或开发人员发现了漏洞但不共享信息，该漏洞可以在主机无法修复的情况下被利用，因为除了发现者之外，该问题是未知的。从发现到修复或补丁发布，该漏洞被称为零日，意味着它尚未被处理。零日漏洞最令人担忧的是未知因素——其能力的影响是未知的。\n\
  \n### Cookie 与附件 (Cookies and Attachments)\n\n`Cookies` 是在 HTTP 流中传递的小型 ASCII 文本，用于在网络浏览器中临时存储数据。Netscape\
  \ 发明的 Cookie 在 Web 服务器和浏览器之间传递，作为在无状态世界中维护状态的机制。`状态` 是描述依赖之前操作的术语。根据定义，Web 服务器提供的\
  \ HTTP 流量是 `stateless`（无状态的）——每个请求都与之前的请求完全独立，服务器没有之前请求的记忆。这极大简化了 Web 服务器的功能，但也使提供超出基本功能的功能变得异常复杂。Cookie\
  \ 的出现是为了弥补这一空白。Cookie 通过 HTTP 消息头部部分的 Set-Cookie 消息传递。\n\nCookie 实际上是浏览器实例期间存储在内存中的系列键值对。Cookie\
  \ 规范为特定用途建立了几种特定的键值对。开发人员可以根据定义额外的键值对。\n\n\n\n\n\n- **Path**：此键值对将 cookie 的适用范围进一步解析为域名内的特定路径。如果\
  \ `path = /directory`，则 cookie 仅会在针对给定域名内 `/directory` 路径的请求时发送。这允许对浏览器和服务器之间传递的信息进行细粒度的控制，并限制了不必要的数据交换。\n\
  - **Secure**：cookie 中存在 `[secure]` 关键字表示 cookie 仅在通过 SSL/TLS 会话连接时使用。这并不表示任何其他形式的安全性，因为\
  \ cookie 是以明文形式存储在客户端机器上的。事实上，一种基于浏览器的安全问题是能够从浏览器缓存中读取另一个网站的 cookie 并使用脚本确定其值。\n\
  \n在浏览器上的 cookie 管理通常是一个不可见的过程，但大多数浏览器都提供了让用户在客户端检查和操作 cookie 的方法。Chrome 用户可以通过图\
  \ 14-1 所示的界面检查、删除和阻止单个 cookie。\n\n![image](img/f0258-01.jpg)\n\n**图 14-1** Chrome\
  \ cookie 管理\n\nInternet Explorer 具有类似的界面，仅在浏览器的“历史记录”下有一个“删除”选项（参见图 14-2）。可以通过文件处理系统进行额外的\
  \ cookie 操作，因为 cookie 是作为单独文件存储的，如图 14-3 所示。这种组合允许更方便的批量操作，这是一个非常有用的选项，因为 cookie\
  \ 在短时间内可能会变得非常多。\n\n![image](img/f0259-01.jpg)\n\n**图 14-2** Internet Explorer 11\
  \ cookie 管理\n\n![image](img/f0259-02.jpg)\n\n**图 14-3** Internet Explorer 11 cookie\
  \ 存储器\n\n那么 cookie 有什么用呢？在浏览器中禁用 cookie 并访问你经常的一些常用网站，你就能很快学会 cookie 的用处。cookie\
  \ 存储了各种信息，从客户 ID 到以前访问过的网站数据等。由于 cookie 以允许进行简单操作的形式存储在用户的机器上，因此必须始终被视为可疑的，且不适合作为安全机制。然而，它们可以允许浏览器向\
  \ Web 服务器提供关键信息。广告商可以使用它们根据你以前看过的广告来控制向你展示哪些广告，无论广告在网站的位置如何。特定网站可以使用 cookie 在页面之间传递状态信息，从而实现用户所需级别的功能。cookie\
  \ 还可以记住你在天气网站的邮政编码、你在股票跟踪网站的 ID、你购物购物车中的物品——这些都是典型的 cookie 用法。最后分析认为，cookie 是日常\
  \ Web 体验的一部分，它们将一直存在，只要不被误用（例如用于存储安全数据以及提供 ID 和身份验证），它们就是有用的。\n\n#### 禁用 Cookie\n\
  \n如果用户在浏览器中禁用了 cookie，那么 Web 服务器将无法使用此类信息。IETF RFC 2109 描述了 HTTP 状态管理系统（cookie），并规定了必须在浏览器中启用的若干\
  \ cookie 功能，具体包括：\n\n- 开启和关闭 cookie 使用的能力\n- 关于 cookie 是否正在使用的指示器\n- 指定 cookie 域值和生命周期的方法\n\
  \n这些功能中的几个已经讨论过了，但要实现无 cookie 浏览并不需要一个简单的步骤。告诉浏览器停止接受 cookie 是通过“选项”菜单提供的提供的设置选项，但它对已经接收并存储在系统中的\
  \ cookie 没有影响。为了防止浏览器发送已接收的 cookie，用户必须从系统中删除这些 cookie。这种批量操作很容易完成，然后浏览器就可以在无 cookie\
  \ 的情况下运行。若干第三方工具可以实现更细粒度的 cookie 控制。\n\n#### 附件\n\n附件也可以用作攻击向量。例如，如果用户输入图形文件（例如\
  \ JPEG 文件），并且该文件被修改为包含如 Java 等可执行代码，那么当图像渲染时，代码就会执行。这可以启用某些功能。\n\n#### 本地共享对象\n\n\
  本地共享对象（LSOs）是存储在用户机器上以保存信息的数据段。通常，这些是 Flash 使用的 cookie，因为这些可以在应用程序之外进行操纵，所以它们可能构成安全或隐私威胁。\n\
  \n#### 恶意插件\n\n插件是分发以允许现有程序提供附加功能的代码。这些插件的一个例子是浏览器辅助对象（BHOs），它们随 Internet Explorer\
  \ 加载。BHO 对 Internet Explorer 事件模型有无限制的访问，并可以执行如捕获击键等的操作。你应该只使用来自信任源的插件，并且你需要理解它们可能带来的交互级别。ActiveX\
  \ 是微软实现的一项技术，通过添加用户控件来增强支持 Web 的系统。除非经过信任机构的签名，否则不应允许浏览器运行 ActiveX 内容。\n\n#### 会话劫持\n\
  \n在 Web 上进行通信时，通常会创建一个会话来控制通信流。可以使用多种方法（包括 SSL/TLS 和 cookie）建立并控制会话。安全地实现会话的建立和销毁非常重要，因为如果一方结束通信而没有正确销通信会话，入侵者就可以接管该会话，在一方离开后继续操作并冒充该方。如果你登录银行进行交易，但允许会话劫持者进入，那么劫持者就可以在你离开后使用你的账户继续操作。这就是为什么从银行和财务网站注销而不是仅仅关闭浏览器是非常重要的原因之一。\n\
  \n会话劫持的方法有很多，从中间人攻击到侧持攻击（sidejacking）和浏览器接管。侧持攻击是指使用数据包嗅探来窃会话 cookie。仅保护登录过程然后切换回标准\
  \ HTTP 就会启用这种攻击方法。\n\n最好的防御是正确使用加密（不使用 SSL 2.0 或之前的版本），并在完成后注销并关闭应用程序。在使用多标签页浏览器时，最好关闭整个浏览器实例，而不仅仅是标签页。\n\
  \n### 客户端攻击\n\nWeb 浏览器已成为用户访问网络资源的主要应用程序。该界面的流行性和实用使得 Web 浏览器成为攻击者获取访问权限和控制系统的主要目标。多种攻击可以通过浏览器发生，通常是由于在使用输入之前未对其进行适当验证。\n\
  \n\n\n\n\n当用户输入在未经过验证的情况下被使用时，为攻击者提供了一个机会，通过构造输入，在应用程序解析和使用输入时触发特定的事件。`SQL injection`\
  \ 攻击涉及对输入的操纵，导致产生与设计者意图不符的 `SQL statement`。`XML` 和 `LDAP injections` 是以相同的方式实施的。由于\
  \ `SQL`、`XML` 和 `LDAP` 被用于存储数据，这可能允许攻击者访问违反业务规则的数据。当输入以一种允许命令行操纵的方式使用时，就会发生 `Command\
  \ injection` 攻击。这可以让攻击者以应用程序的权限级别获得命令行访问权限。\n\n## 头部操控\n\n当通过用户输入动态生成 HTTP 时，未验证的输入可能给攻击者更改\
  \ HTTP 元素的机会。当用户提供的信息被用于标头时，可能会创建多种攻击，包括缓存污染、跨站脚本、跨用户篡改、页面劫持、cookie 操纵或开放重定向。\n\n\
  ![image](img/examtip.jpg)\n\n**考试提示** 针对客户端机器可以使用多种攻击向量，包括缓存污染、跨站脚本、跨用户篡改、页面劫持、cookie\
  \ 操纵和开放重定向。考试中应掌握所有攻击类型。\n\n### 任意/远程代码执行\n\n在获取用户输入并将其用于创建在系统中执行的命令时涉及的风险之一是任意或远程代码执行。这种攻击涉及攻击者准备一个输入来改变程序的格式或功能。作为\
  \ `command injection` 的形式，这种攻击允许用户在系统上插入并远程执行任意代码。这是一种输入验证失败的形式，因为用户不应具有在定义之外与操作系统交互的能力。\n\
  \n## 章节复\n\n在本章中，我们探讨了应用程序攻击和无线攻击。章节从无线攻击讨论开始，包括非法接入点、阻塞和干扰、恶意孪生攻击、蓝牙攻击（`bluejacking`、`bluesarfing`\
  \ 和 `bluebugging`）以及钓鱼。随后涵盖了针对加密的攻击，包括 `IV attacks`、`WEP/WPA attacks` 和 `WPS attacks`。考试要求你能够解释这些攻击类型。\n\
  \n章节的后半部分介绍了应用程序攻击，从跨站脚本开始。注入攻击包括 `SQL`、`LDAP`、`XML` 和目录遍历。溢出攻击包括缓冲区和整数溢出。本章 cookie、恶意插件、会话劫持和头部操控。任意代码执行和远程代码执行完成了本章。\n\
  \n## 问题\n\n为了帮助你准备 CompTIA Security+ 考试并测试你的准备水平，请回答以下问题并与章节末的正确答案进行对比。\n\n**1**.\
  \ 什么是攻击？\n\nA. 弱 SSID\nB. 用户身份验证\nC. Wi-Fi\nD. 加密\n\n**2**. 什么使得网站易受到 `SQL injection`\
  \ 攻击？\n\nA. 输入字段过滤不当\nB. 使用 Microsoft SQL 数据库\nC. 输入框过长\nD. 密码强度低\n\n**3**. 区域 Wi-Fi\
  \ 接入点最可能是由什么生成的？\n\nA. `WEP cracking attacks`\nB. 非法接入点\nC. 钓鱼\nD. 欺骗\n\n**4**.\
  \ 为什么 `buffer overflow` 是一种流行的攻击？\n\nA. 它在互联网上很容易实现\nB. 攻击者可以使用它破解任何加密\nC. 相同的代码会在任何系统上运行\n\
  D. 它可以提供任意代码执行\n\n**5**. 如何防止 `bluesning`？\n\nA. 使用 `WPA2`。\nB. 在添加设备时关闭配对。\nC.\
  \ 不要使用耳机。\nD. 更改手机的 `MAC address`。\n\n**6**. 为什么 `cross-site scripting` 是成功的\n\n\
  A. 它每次都使用不同的注册\nB. 它的代码在加密状态下运行\nC. 它利用零日漏洞\nD. 它包含来自受损网站的恶意代码\n\n**7**. 近场通信（如\
  \ `Ethernet`）是如何？\n\nA. 它不强制执行，而是依赖于高层协议如 `SSL`。\nB. 它强制每个终端通过交换机通信。\nC. 它提供了冲突避免。\n\
  D. 以上所有。\n\n**8**. 为什么像咖啡店那免费 Wi-Fi 是会话劫持的热点？\n\nA. 不安全的 Wi-Fi 允许攻击者在用户机器上放置恶意文件。\n\
  B. 网站使用 `captive portal`。\nC. 不安全的 Wi-Fi 允许攻击者嗅探用户的 `cookie`。\nD. 用户未使用 `VPN`。\n\
  \n**9**. 什么使得非法接入点成为威胁？\n\nA. 它们加载了恶意软件。\nB. 它们允许任何人访问公司网络。\nC. 它们仅支持容易破解的 `WEP`。\n\
  D. 无线信号范围短，额外的接入点不是威胁。\n\n**10**. 为什么 `integer overflow` 会成为安全问题？\n\nA. 它会导致应用程序崩溃。\n\
  B. 它可能导致应用程序损坏数据。\nC. 它可以创建缓冲区溢出机会。\nD. 以上所有。\n\n对于问题 11-15，假设如下：你正在管理公司网站，该网站包含电子商务功能，并被赋予了网站安全的责任。\n\
  \n**11**. 你将通过输入清理尝试消除哪些威胁？（为 Web 服务器选择两个最佳答案。）\n\nA. 缓冲区溢出\nB. `SQL injection`\n\
  C. 跨站脚本\nD. `LDAP injection`\nE. 头部操控\nF. 钓鱼\n\n**12**. 你应该进行什么更改来防止会话劫持？\n\nA.\
  \ 加密 `cookie files`。\nB. 清理所有输入字段。\nC. 将你的网站外包到云端。\nD. 对整个网站应用 `SSL`，而不只是登录页面。\n\
  \n**13**. 你看到几个用户试图对你的网站进行目录遍历攻击。你会采取什么行动？\n\nA. 添加防火墙规则阻止这些用户。\nB. 检查 Web 控制列表并验证所有目录权限。\n\
  C. 将 Web 服务器软件更新到最新版本。\nD. 对所有会话流量使用 `SSL`，而不只是登录流量。\n\n\n\n\n\n# 14. 得于你在网站工作上的出色表现，首席信息安全官（CISO）请求你协助处理\
  \ Wi-Fi 系统上发生的异常行为。在建筑的某些区域，无线信号可用但不允许任何流量通过。哪些措施有助于解决这个问题？（选择所有适用项。）\n\n**A.**\
  \ 进行场地调查。\n**B.** 启用 `WPA2`。\n**C.** 寻找非法接入点。\n**D.** 寻找干扰源。\n**E.** 执行容量规划。\n\n\
  # 15. 你的场地调查在天花板上发现了一个外形形像烟雾报警器的非法接入点。这可能是什么种类型的设备？\n\n**A.** 一个在办公用品商店购买的 AP，用于增强销售部门工位附近的\
  \ Wi-Fi 信号\n**B.** 正常企业无线局域网的一部分，设计初是为了融入办公室环境\n**C.** 一个自定义的无线恶意孪生设备（evil twin），试图收集用户信息\n\
  **D.** 一个蓝牙嗅探者（bluesnarfer）\n\n### 答案\n\n- **D.** 初始化向量 (`IV`) 攻击旨在对密码初始化方式的加密实现进行攻击。这是\
  \ Wi-Fi 网络 `WEP` 加密标准中的已知漏洞。\n- **A.** SQL 注入是通过在输入过滤不佳的字段内部使用分隔符或其他 SQL 命令结构来实现的。网页随后将该字段传递给数据库，然后由数据库执行注入的命令。\n\
  - **C.** 战争夺车（War driving）是指携带无线扫描仪和 `GPS` 开车行驶，并记录 Wi-Fi 接入点的位置。\n- **D.** 缓冲区溢出是一种流行的攻击，因为它可以通过直接将代码插入内存来提供任意代码执行。\n\
  - **B.** 蓝牙嗅探（Bluesnarfing）取决于与移动设备的配对，因此关闭配对可以停止蓝牙嗅探攻击。\n- **D.** 跨站脚本（XSS）将恶意内容（通常来自第三方网站）折叠到从服务器正确交付的验证内容部分中。\n\
  - **A.** 近场通信（NFC）没有集成加密功能，依赖高层协议来提供安全性。\n- **C.** 经常，`SSL` 仅用于网站的登录页面，因此嗅探 Wi-Fi\
  \ 的攻击者可以捕获用户的会话 Cookie 并用它来冒充用户。\n- **B.** 建立在 IT 控制之外的非法接入点通常会允许任何检测到该接入点的人连接到企业内部网络。\n\
  - **D.** 所有答案都是正确的。当两个大数相加超出指定的整数位数时就会发生整数溢出，导致一个非常小的数字。这会导致意外的应用程序行为。\n- **B**\
  \ 和 **D**（SQL 注入和 `LDAP` 注入）是最佳答案。清理输入有助于确保没有原始命令直接传递给支持程序。\n- **D.** 通过对整个站点进行加密可以防止会话劫持，防止攻击者盗取已建立的用户会话。\n\
  - **B.** 目录遍历攻击集中于执行外部用户不应能够访问的项目。适当的权限和移除所有不必要的执行权限有助于缓解攻击。\n- **14.** **A**、**C**\
  \ 和 **D**。这些措施有助于识别可能的原因。\n- **15.** **C.** 无线恶意孪生设备可能被检测到。\n\n# 第 15 章\n\n## 缓解技术\n\
  \n在本章中，你将：\n- 选择合适的日志类型\n- 学习系统监控如何缓解风险\n- 学习加固如何缓解风险\n- 学习采用网络安全如何缓解风险\n\n任何安全策略的一个部分都是缓解风险。目前使用一些方法。本章将探讨：\n\
  \n### 监控系统日志\n\n日志文件是活动的记录：发生了什么、何时发生、谁做的、来自哪里等。尽管许多管理员对日志文件的审计和分析感到畏惧，但简单的事实是，有效的日志和分析可以是极佳的工具。第一步也是最关键的一步是在系统和网络设备上启用日志。记录失败的登录是有益的，但记录每次成功访问文件可能过度了。决定记录什么、如何记录以及维护审计日志多长时间，是系统管理员之间讨论不完的话题。\n\
  \n决定应该记录什么的某一个关键决定因素之一，是检查需要将哪些信息作为取证记录的记录。在事件发生时记录日志允许调查人员在事后检查活动情况。日志本身并不是万灵药，因为它们需要经过检查和解释才能发挥作用，这需要持续的努力和资源。这是决定应该记录什么的第二个关键决定因素——记录从不被审查的项目是一个常见问题。\n\
  \n### 常见日志\n\n计算机系统中的许多事件都可以被记录。来自 `OSI` 模型不同层次的事件都可以记录在通用日志方案中。在远程服务器上维护日志提供了安全性，并在维护集中日志解决方案方面具有简单性。以下是日志记录有效且必要的某些区域的示例：\n\
  \n- **安全应用**：泛而言，“安全应用”可以是任何有助于评估或保护网络的程序。任何具有生成日志文件能力的安全应用都应配置为生成，并定期分析生成的日志。\n\
  - **DNS**：`DNS` 服务器可以配置为记录事务——解析请求、已执行或尝试执行的更新、转发解析的请求等。应该审计 `DNS` 日志文件以帮助识别尝试的入侵、攻击、欺诈更新、中毒尝试等。\n\
  - **性能**：性能日志跟踪内存使用率、CPU 使用率、磁盘使用率、网络流量等项目。性能日志可以是恶意活动的另一个良好指标，因为与正常水平相比，系统可能异常地“忙碌”或异常“安静”。\n\
  \n\n\n\n\n- **事件**：事件日志是应用程序日志的一种，用于跟踪系统上发生的事件。\n- **访问**：跟踪哪个用户访问了特定资源、他们如何使用该资源、对该资源做了什么或使用了什么以及访问何时发生是一项至关重要的日志活动。审计访问日志是检测恶意活动、用户管理疏漏和其他活动的极佳方法。\n\
  - **防火墙**：防火墙活动日志跟踪尝试的连接、网络流量、源地址、目的地址、所用端口等。应定期对防火墙日志进行审计，以确保防火墙按预期运行，帮助识别常见的攻击流量源，识别常见的受攻击目标系统和服务等。\n\
  - **杀毒软件**：杀毒软件日志通常跟踪受感染的电子邮件或文件、违规邮件或文件的来源、更新状态、扫描活动等。需要定期进行审计，以确保杀毒软件程序提供了预期的保护水平，并有效地扫描了电子邮件流量和系统。\n\
  - **IDS/IPS**：入侵检测系统和入侵预防系统的日志也是跟踪可疑、不良或恶意活动的极佳来源。这些日志可以识别攻击流量、攻击流量源、目标资源、可能及实际的攻破、数据丢失和其他信息。\n\
  \n### 安全设置的定期审计\n\n作为任何良好安全计划的一部分，管理员必须执行定期审计，以确保用户、系统、策略和流程方面“一切符合预期”。安装和配置安全机制固然重要，但必须按照定期计划定期对其进行审查，以确保其有效性、时效性并发挥预定功能。以下是一些应定期审计的项目示例，但绝不是完整列表：\n\
  \n- **用户访问**：管理员应检查哪些用户正在访问系统、他们何时访问、他们正在使用哪些资源等。管理员应密切留查是否存在用户不当地访问资源，或在异常时间访问合规资源的情况。\n\
  - **用户权限**：当用户更换工作或职责时，她可能需要分配不同的访问权限；她可能会获得新资源的访问权限并失去对其他资源的访问。为了确保用户仅拥有其当前职位所需的资源和能力，应定期对所有用户权限进行审计。\n\
  - **存储**：许多组织拥有策略，规定了“公司”资源上可以存储什么内容，以及特定用户或组可以使用多少空间。定期审计有助于确保组织资源上不存在任何不良或非法的材料。\n\
  - **保留**：在某些组织中，存储特定文档或记录持续的时间可能与存储的内容本身一样重要。记录保留政策有助于定义存储什么、如何存储、存储多久以及在到期时如何处理。定期审计有助于在记录或文档不再需要时将其移除。\n\
  - **防火墙规则**：对防火墙规则进行定期审计非常重要，这可以确保防火墙正在按预期过滤流量，并帮助确保“临时”规则不会变成规则集中的永久添加项。\n\n![image](img/examtip.jpg)\n\
  \n**考试提示** 记录日志、审查日志和执行审计是标准的安全任务，你应该熟悉考试中的标准日志类型。\n\n### 系统加固\n\n在维护企业安全方面，关键要素是企业基础设施中所用硬件和软件的安全态势。确保系统配置恰当且所有系统都安装了补丁并保持最新状态，是安全企业的关键组成部分。系统和操作系统的多种用途需要灵活的组件，允许用户设计、配置和实施他们所需的系统。然而，正是这种灵活性导致了计算机系统中一些最大的薄弱点。计算机和操作系统的开发者经常以“默认”模式构建和交付系统，这种模式几乎无法保护系统免受外部攻击。从开发者的角度来看，这是效率最高的交付模式，因为他们无法预判每个用户在每情况下需要什么。然而，从用户的角度来看，这意味着在系统投入使用之前必须投入大量精力来保护和安全系统。为生产环境保护并准备系统的过程被称为\
  \ `hardening`（加固）。遗憾的是，许多用户并不理解有效保护其系统所需的步骤，导致每天都有数百个系统被攻破。\n\n![image](img/examtip.jpg)\n\
  \n**考试提示** 系统加固是准备和保护系统的过程，涉及移除所有必要的软件和网络服务。\n\n### 禁用未使用的接口和未使用的应用程序服务端口\n\n运行安全系统设置的关键管理问题是识别系统正常运行的特定需求，并仅启用这些功能所需的项目。保持系统关闭所有其他服务和服务用户可以提高系统吞吐量并增加安全性。减少与服务器相关的攻击面，可以减少现在和未来由于需要更新而产生的漏洞。\n\
  \n![image](img/examtip.jpg)\n\n**考试提示** 特定的安全需求取决于服务器的具体用途，但至少采取以下预防措施是有有益的：\n\n\
  - 移除不必要的协议，如 `Telnet`、`NetBIOS`、`Internetwork Packet Exchange (IPX)` 和 `File Transfer\
  \ Protocol (FTP)`。\n- 移除所有不必要的共享。\n- 禁用所有不需要的服务和端口；在任何加固过程中，通常应禁用 `ECHO`、`CHARGEN`\
  \ 等简单的 TCP 服务。\n- 重命名管理员账户并使用强密码进行保护。\n- 移除不必要的用户账户。\n- 保持 `OS` 已修补并保持最新。\n- 控制对服务器的物理访问。\n\
  \n### 保护管理接口和应用程序\n\n某些机器具有“管理接口”，允许远程管理设备本身。管理接口允许连接到管理应用程序、`SSH` 服务，甚至是基于 Web\
  \ 的配置 GUI，而这些在其他接口上是不被允许的。由于这种高访问权限，必须保护管理接口和应用程序不受授权的访问。它们不应连接到公共网络连接（即互联网）或 DMZ\
  \ 连接。在可能的情况下，在组织内部限制对管理接口和应用程序的访问，使得没有相应访问权限和权利的员工无法连接到这些接口和应用程序。\n\n### 密码保护\n\n\
  \n\n\n密码保护是良好安全基准中经常被忽视的关键活动之一。该问题的核心在于，当今的大多数系统仅受简单用户 ID 和密码的保护。如果攻击者发现了正确的用户 ID\
  \ 和密码的组合——无论是通过手动尝试，还是使用任何许多免费提供的暴力破解攻击工具——他们就能进入系统，并完全绕过了为保护系统安全而采取的所有正常步骤。更糟糕的是，在支持多用户的服务器系统上，攻击者只需要猜中一个正确的用户\
  \ ID 和密码组合即可获得访问权限。\n\n从操作系统到应用程序，我们在本章中检查的每一个主题都存在这种基础的安全挑战。为所有用户账户选择一个良好的密码对于保护信息系统至关重要。什么是好密码？是一个既相对容易记忆又难以被猜到的密码吗？遗憾的是，没有一个魔术答案可以涵盖所有情况，但如果你在选择密码时遵循一些基本的指南和原则，就可以确保系统上使用的密码能够保护你的资产。\n\
  \n## 密码策略指南\n\n要求使用用户名和密码进行身份验证无疑是目前最流行的安全机制。遗憾的是，它也是配置最不当、最被忽视且最容易被绕过的系统。解决密码问题的第一步是创建一个有效且易于管理的\
  \ `password policy`，让系统管理员和用户都能执行。在创建策略时，你应该仔细检查你的业务和安全需求。什么程度的风险是可以接受的？系统需要多大的安全性？用户应该多久更改密码？是否应该锁定账户？用户在选择密码时应该遵循哪些指南？你的问题列表会有很大差异，但关键是要花时间识别你的担忧并在密码策略中针对性地解决它们。\n\
  \n一旦你创建了密码策略，就要让大家知道。确保每个用户都有一份。将其发布在公司内网首页。在为新用户创建账户之前，让他们阅读一遍策略副本。定期发送电子邮件提醒，强调密码策略中的要点。在公司聚会上发布公告。方法并不比目标重要，目标仅仅是确保每一位用户都理解并遵循该策略。\n\
  \n一旦你向大家教授了该策略，就必须执行它以使其生效。为密码设置一个最小字符长度，并且永远不要接受短于该长度的密码。实施密码老化（稍后会讨论）并提示用户定期更改密码。不要接受基于词典单词的密码。不要允许用户反复使用同一个密码。许多操作系统都有内置的实用或插件，允许管理员强制执行良好的密码选择、强制密码老化并防止密码重用。\n\
  \n花时间运行一些流行的密码破解工具来审计你自己的密码文件。在拥有许多用户账户（超过一千个）的大型组织中，这将消耗时间和计算资源，但这是非常值得的。尽可能频繁地进行这些审计——每月、每两个月或每季度一次。如果你发现密码易被破解的账户，让用户重新查看密码策略并立即更改密码。\n\
  \n大多数密码审计/破解工具可以使用以下任一或所有技术来检查密码文件：\n\n*   `Dictionary attack`：使用单词列表作为潜在密码。工具读取列表中的每个单词，对其进行加密，然后尝试将加密结果与文件中的密码进行匹配。\n\
  *   `Hybrid attack`：结合单词并将字母替换为字符。例如，用 `3` 替换 `e`。\n*   `Brute force`：工具尝试所有可能的字符组合（`A–Z`、`a–z`、`0–9`）。\n\
  *   `Rainbow table`：预计算 `hashes` 的查找表。攻击者不需要实时计算 `hash`；他们只需读取即可。\n\n### 选择密码\n\n\
  选择密码的多种方法从随机生成到一次性使用不等。每种方法都有其优缺点，但通常当安全性增加时，易用性往往会降低。例如，随机生成往往难以记忆，用户经常会将密码写在机器附近，从而违背了密码的初衷。安全与易用之间的最佳折中方案在于教用户如何根据易于记忆的短语（passphrase）来选择自己的密码。\n\
  \n基于短语的密码可以用许多方式形成：使用句子中每个单词的首字母；使用第一个单词的第一个字母、第二个单词的第二个字母，以此此类推；组合单词；或将字母替换为其他字符。以下是一些短语示例以及生成的密码：\n\
  \n*   使用句子中每个单词的首字母：\n    句子：`I love to drive my 1969 Mustang!`\n    密码：`Iltdm69M!`\n\
  *   组合单词并将字母替换为字符：\n    句子：`Bad to the Bone`\n    密码：`Bad2theB`\n\n短语可以几乎是任何内容——你喜欢的电影台词、你喜欢的歌曲歌词，或者你随口编造的内容。使用你选择的任何方法，但最终结果应该是一个难以猜、容易记的密码。\n\
  \n### 好密码的组成\n\n通过使用短语法，用户应该能够创建自己的易记的密码。然而，由于密码的目的是保护访问和资源免受入侵者侵害，它不应该让人们使用 `John\
  \ the Ripper` 或 `Crack` 等密码破解工具猜测或获取。为了让密码难以猜测或获取，它应该满足以下指南：\n\n*   长度应至少为八个字符（某些操作系统默认要求长密码）\n\
  *   应包含以下四个元素中的至少三个：\n    *   一个或多个大写字母（`A–Z`）\n\n\n\n\n-   一个或多个小写字母 (a–z)\n- \
  \  一个或多个数字 (0–9)\n-   一个或多个特殊字符或标点符号 (!@#$%^&*,.:;?)\n-   不应由字典单词组成\n-   绝不能与用户的登录名相同，或包含登录名\n\
  -   不应包含用户的姓、名、家庭成员姓名、出生日期、宠物名称或其他任何易于识别用户的项目\n\n## 密码老化\n\n在有足够的时间和计算能力的情况下，几乎任何密码都可以通过简单的暴力破解法测试所有可能的密码来破解。如果永久使用同一个密码，在大多数情况下，攻击者最终将能够获取密码并访问用户的账户。定期更改密码有助于防止暴力破解攻击，因为当密码发生变化时，攻击者必须从头开始重新启动启动攻击。如果密码更改得足够频繁，攻击者将永远无法在下一次密码更改之前遍历完所有可能的组合。\n\
  \n由于几乎任何密码最终都能被破解，因此防止用户“循环利用”密码（反复使用同一个密码）也同样重要。频繁更改密码还可以减少密码泄露时对系统造成的潜在损害，以及攻击者可能获得的访问权限。如果攻击者访问了用户账户且密码被更改，攻击者可能会失去对该账户的访问，并必须重新尝试破解新密码。许多操作系统提供了选项，允许系统管理员强制密码老化并防止密码重复。考虑使用以下指南：\n\
  \n-   让用户每 60 到 90 天更改一次密码（非常安全的设施可能希望每 30 到 45 天更改一次密码）。\n-   让系统“记住”每个用户最后五到十个密码，不允许用户再次使用这些密码。\n\
  \n虽然确保每个账户都有良好的密码至关重要，但简单禁用或删除不必要的账户也是一个很好的主意。如果你的系统不需要支持来或匿名账户，请禁用它们。当不再需要用户或管理员账户时，将其删除或禁用。作为最佳实践，应定期对所有用户账户进行审计，以确保系统中没有必要的、过时的或需要的账户。\n\
  \n### 禁用未使用账户\n\n向系统中添加新用户时，添加新用户账户是一项必要任务。维护一份哪些用户以后仍需要访问的良好列表是一项更有挑战性的任务。用户账户维护是一项重要的加固任务。所有添加的新账户或增加的权限都应该被记录并监控。每当员工离开公司时，应禁用所有相关账户以防止进一步访问。禁用优于删除，因为删除可能会导致权限和所有权问题。定期对用户账户进行审计以确保它们仍需要访问权限也是一种良好的安全措施。\n\
  \n### 网络安全\n\n在考虑系统基线安全性的同时，你必须考虑网络连接在整体安全概况中扮演的角色。互联网的巨大增长以及多台 PC 和以太网网络的廉价化，导致几乎每台计算机都连接到了某种网络，而一旦计算机连接到网络，它们就会受到该网络上任何其他用户的访问。必须通过控制计算机上运行的服务和为网络访问而开放的端口，在计算机上建立适当的网络访问控制。然而，除了服务器和工作站，还必须检查网络设备：路由器、交换机、调制解调器以及其他各种组件。\n\
  \n今天的网络基础设施组件与网络上的其他计算设备类似——它们拥有运行 `OS` 的专用硬件，通常带有一个或多个用于直接连接到 `OS` 的开放端口，以及支持各种网络服务的端口。`OS`\
  \ 编码中的任何缺陷都可以被用来利用以获取访问权限，就像任何“普通”计算机一样。这些网络设备应配置非常严格的参数以维护网络安全。就像普通计算机 `OSs` 需要补丁和更新一样，运行网络基础设施组件的软件也需要定期更新。最后，应通过实施防火墙规则增加外层防护。\n\
  \n今天的网络基础设施组件与网络上的其他计算设备类似——它们拥有运行 `OS` 的专用硬件，通常带有一个或多个用于直接连接到 `OS` 的开放端口，以及支持各种网络服务的端口。`OS`\
  \ 编码中的任何缺陷都可以被用来利用以获取访问权限，就像任何“普通”计算机一样。这些网络设备应配置非常严格的参数以维护网络安全。就像普通计算机 `OSs` 需要补丁和更新更新一样，运行网络基础设施组件的软件也需要定期更新。最后，应通过实施防火墙规则增加外层防护。\n\
  \n### 网络软件更新\n\n在维护安全的同时，保持软件处于当前的补丁水平是你可以做的最重要的事情之一。对于运行网络的设备也是如此。虽然有些设备是非托管的，通常没有网络存在且风险较低，但任何响应网络端口的托管设备都有软件或固件控制。这些软件或固件需要定期更新。\n\
  \n连接互联网最常见的设备是网络路由器。市场上上有几十种路由器品牌，但 `Cisco` 产品占据主导地位。流行的网络操作系统 (`IOS`) 运行在许多 `Cisco`\
  \ 设备上，并安装在无数地点。它的流行促进了对其代码漏洞的研究，在过去的几年里，报告了许多漏洞。这些漏洞以多种形式存在，因为路由器发送和接收各种流量，从标准的\
  \ `Telnet` 远程终端，到路由协议 (`RIP`) 或开放路径优先 (`OSPF`) 数据包，到简单网络管理协议 (`SNMP`) 数据包。这凸显了定期更新\
  \ `IOS` 软件的必要性。\n\nCisco IOS 也运行在许多 `Cisco` 以太网交换产品上。像路由器一样，它们具有接收和处理 `Telnet` 和\
  \ `SNMP` 等协议的能力。较小的网络组件通常不运行大型软件包，并在内部 `NVRAM` 中加载较小的软件。虽然这类软件的更新过程通常被称为固件更新，但这并没有改变保持最新状态的安全影响。在拥有多个设备的公司网络中，必须有人负责更新设备，并根据安全和管理策略执行更新。\n\
  \n## 网络设备配置\n\n保持软件更新固然重要，正确配置网络设备同样重要，甚至更为重要。许多网络设备（如路由器和交换机）现在具有先进的远程管理功能，拥有多个接受网络连接的开放端口。正确的配置对于确保设备安全是必要的。选择良好的密码对于维护内外安全非常重要，关闭或限制对任何开放端口的访问也是保护设备的良好措施。在更高级的设备上，你必须仔细考虑设备运行的服务，就像考虑计算机一样。\n\
  \n* * *\n\n**考试提示** 记住，路由器本质上只是一个在网络之间转发数据包的设备，但它也可以通过控制流入和出网络的流量来帮助保护网络。\n\n\n\n\
  \n\n在许多情况下，网络设备的主要保护方法是密码。良好的密码是最有效的安全工具之一，因为一个好的密码可以抵抗多种形式的攻击。这种抵抗性迫使攻击者使用简单的暴力破解方法，这会消耗大量的时间并产生大量的网络流量，从而增加了攻击者行为被检测到的概率。遗憾的是，良好的密码通常很难记忆，因此通常会使用较弱的密码。\n\
  \n为了认识坏密码对安全造成的影响，请考虑这样一个事实：一个典型的暴力破解程序可以在一天内尝试未删版英语词典中的每一个单词，但要暴力破解一个八位密码可能需要几千年。这是基于不仅使用了标准的\
  \ 26 个字母字母表，还添加了 26 个大写字母、10 个数字以及另外 32 种不同的特殊字符。这总共提供了 94 种可用的字符，使得 1 到 8 位的密码拥有\
  \ 6,704,780,954,517,120 种（或 6700 万亿种）不同的可能性。这与英语中估计的 200 万个单词，或者简单的小写字母提供的 2170\
  \ 亿种可能性形成了鲜明对比。\n\n最好的密码类型与实际单词没有任何相似之处，例如“AvhB42^&nFh”。然而，尽管此类密码提供了更高的安全性，但它们很难记忆，导致用户选择基于普通字典单词的密码。虽然这对于任何系统的任何密码都是一个问题，但在网络基础设施设备上，这个问题更为突出，因为许多网络设备访问时仅需要密码验证——通常不需要用户名。\n\
  \n许多管理员忽略的与密码相关的问题之一是 `SNMP`，它开发于 1988 年，已实现在各种网络设备上。它的广泛实现与其与其简单性和扩展性直接相关。由于每个制造商都可以向管理信息库（`MIB`）添加对象，因此一个制造商可以添加功能，而不会干扰其他其他制造商在\
  \ `MIB` 树中的部分。该协议的这一特性让制造商能够使 `SNMP` 在配置和监控方面变得非常强大。缺点是许多设备默认开启了 `SNMP`。不使用 `SNMP`\
  \ 的网络管理员经常忘记禁用 `SNMP`，或者忘记更改众知的默认密码——通常只读访问为“public”，读写访问为“private”。如果 `SNMP` 服务激活并使用默认密码，攻击者可以从网络设备中获取大量有趣的信息，并更改任何支持\
  \ `SNMP` 的设置。如果采用 `SNMP`，应该使用深思熟虑的密码，并制定密码更新计划。\n\n***\n\n![image](img/examtip.jpg)\n\
  \n**考试要点** 使用“public”作为公共 `SNMP` 团体字符串是一个广为人知的漏洞。任何使用“public”作为 `SNMP` 团体字符串的系统都应立即更改。\n\
  \n记住，`SNMP` 密码通常以明文传输，因此永远不应将其视为受信协议。`SNMP` 服务也应仅限制为来自管理站 IP 地址的连接。如果不使用 `SNMP`，应尽可能禁用该服务。否则，`SNMP`\
  \ 端口不应从外部或内部网络的任何地方访问。\n\n网络设备的另一个最佳实践是消除对 `Telnet` 等明文协议的使用，并实施更安全的替代方案如 `SSH`。`SSH`（Secure\
  \ Shell）是一种加密协议，可用于创建到远程网络设备和服务器的命令行连接。与 `Telnet` 不同，`SSH` 是端到端加密的，因此在 `SSH` 会话中输入的任何内容都不会被潜在攻击者轻易拦截和查看。\n\
  \n与任何系统一样，安全性在很大程度上取决于系统本身的正确配置。路由器可以通过适当配置来实现安全，这与通过糟糕配置使其变得不安全一样容易。良好的密码以及对设备运行哪些服务的了解，对于维护这些设备的安全性至关重要。\n\
  \n#### 802.1x\n\n如第 2 章所示，`802.1x` 可作为一种限制网络访问仅供授权用户的方法。它被称为*基于端口的网络访问控制*（port-based\
  \ network access control），`802.1x` 是一种 IEEE 标准，是 IEEE 802.1 网络协议集的一部分。对所有系统采用基于边缘的访问控制可以提高安全态势。`802.1x`\
  \ 是基于端口的安全。\n\n***\n\n![image](img/examtip.jpg)\n\n**考试要点** `802.1x` 是一种认证方法，用于控制对端口的访问，称为基于端口的网络访问控制。\n\
  \n### MAC 限制与过滤\n\n使用 MAC 地址进行端口级安全为系统增加了一层安全。这确保了与网络相关的硬件是经过批准使用的。这防止了进入网络的未经许可的通信通道。MAC\
  \ 过滤对于确保网络连接不被重定向非常有用。\n\nMAC 限制是指设置交换机或端口可以学习的 MAC 地址数量限制。这可以防止各种攻击。端口还可以被限制在特定的\
  \ MAC 或 MAC 组中，以限制攻击者的能力。\n\n### 禁用未使用的接口和未使用的应用程序端口\n\n与服务器一样，运行安全系统的一项重要管理问题是识别系统正常运行所需的特定需求，并仅启用这些功能必需的项目。保持系统其他其他和服务和用户可以提高系统吞吐量并增加安全性。网络中有某些在不需要时需要禁用的端口和连接。如果交换机连接到未使用的房间，这些端口在需要之前应被禁用。同样，管理接口和其他选项在未实际使用时应被限制并禁用。如果开放的管理接口，获取网络设备的攻击者就可以重新配置设备。减少与网络配置相关的攻击面可以减少现在和未来的漏洞。\n\
  \n### 非法设备检测\n\n渗透网络的一种方法是安装非法设备。另一种情况是用户为了某些未经授权的目的添加设备，例如本地无线访问点。这些设备和网络变化构成了各种安全问题，因此检测非法或未经授权的设备是关重要的。自带设备（BYOD）的概念增加了非法设备的风险，因此在企业网络的关键区域，建立检测和隔离这些设备的机制是重要的。\n\
  \n### 安全态势\n\n\n\n\n\n系统的安全态势取决于其配置、设置，以及拥有修改这些设置权限的用户集合。正确配置系统并确保只有经过授权的用户才能更改这些设置，是建立安全系统的重要步骤。\n\
  \n### 初始基线配置\n\n为了有效且一致地加固系统，你必须采取结构化且逻辑化的方法。这首先要检查系统预期的功能和能力，以确定哪些进程和应用程序将运行在系统上。作为最佳实践，任何运行上并非必需的内容都应该在系统上将其移除或禁用；然后应用所有适当的补丁、热修复和设置来对其进行保护和加固。\n\
  \n这种建立系统安全状态的过程被称为 `baselining`（基线），其产物是一个安全 `baseline`（基线），允许系统安全可靠地运行。一旦针对特定的硬件和软件组合完成了该过程，任何类似的系统都可以使用相同的\
  \ `baseline` 进行配置，并达到相同的安全和保护水平及深度。统一的基线在大规模运营中至关重要，因为为数百或数千个系统维护独立的配置和安全级别成本太高了。\n\
  \n在管理员完成系统的补丁、加固和准备工作后，他们通常会创建一个初始基线配置。这代表了系统或网络设备的安全状态，以及可以用于帮助保持系统安全的参考点。如果这个初始的\
  \ `baseline` 可以被复制，那么它也可以在部署类似的系统和网络设备时作为模板。\n\n### 更新（即热修复、服务包和补丁）\n\n操作系统是大型且复杂的混合体，由几十甚至几千个独立个人编写的相互关联的软件模块组成。随着过去几年向基于\
  \ GUI 的功能和增强能力的推行，操作系统不断增长和扩展。随着操作系统的不断增长和引入新功能，代码出现问题的可能性也随之增加。操作系统供应商几乎不可能在每可能的平台和每种情况下对其产品进行测试，因此在操作系统发布后确实会出现功能和安全问题。对于普通用户或系统管理员来说，这意味着会有持续不断的更新流，旨在纠正问题、替换代码段，甚至为已安装的操作系统添加新功能。\n\
  \n供应商通常遵循软件更新的层级：\n\n- **Hotfix (热修复)**：该术语指的是（通常是）小型软件更新，旨在解决特定问题，例如应用程序中导致系统遭受攻击的缓冲区溢出。热修复通常是针对发现的问题而开发的，并迅速生产和发布。\n\
  - **Patch (补丁)**：该术语指的是更正式、规模更大的软件更新，可以解决几个或多个软件问题。补丁通常包含增强或额外功能，以及对已知漏洞的修复。补丁的开发周期通常较长。\n\
  - **Service pack (服务包)**：这指的是将大量的补丁和热修复合并成一个单一且庞大的包。服务包旨在一次性将系统提升到最新已知的良好水平，而不是要求用户或系统管理员分别下载几十个或上百个更新。\n\
  \n从 Linux 到 Solaris 再到 Windows，每个操作系统都需要软件更新，并且每种操作系统都有不同的方法帮助用户保持系统更新。\n\n\n\n\n\
  存在两类不同的缓解措施：检测和预防。检测控制能够识别不利状况，使企业能够采取适当的应对措施。预防控制旨在通过采取特定行动来改变连接关系。例如，可以通过发送重置命令来重置\
  \ `TCP` 连接。虽然威胁无法被完全，但根据企业内部对检测和预防原则的应用，可以改变与之相关的风险。这两类不同控制措施的两个主要例子是：`IDSs`（检测）对比\
  \ `IPSs`（预防），以及摄像头（检测）对比安保（预防）。\n\n正如第 1 章介绍的，入侵检测系统（`IDS`）的核心是一种检测系统，旨在向企业警报与定义规则相关的特定状况。然后，由分析师对警报的真假做出判断，并决定适当的响应。入侵预防系统（`IPS`）的核心包含一个执行检测步骤的\
  \ `IDS`。`IPS` 不仅仅发出警报，还能根据特定的检测条件采取特定的预定义行动。这种闭环机制提供了比使用分析师更快的响应，但它没有处理误报的直接方法。\n\
  \n基于视频的监控（通常通过闭路电视 `CCTV` 摄像头）为监控大区域的物理安全违规提供了实用的工具。摄像头可以作为检测设备，但响应时间取决于监控时间以及后续来自物理干预（安保人员或警察）的响应。如果摄像头系统没有被主动监控，检测可能会推迟到查看录像时。使用安保服务进行物理安全管理可以缩短监控延迟，对各种状况提供更快的响应。与\
  \ `IDS/IPS`的情况一样，如果响应足够快，它就可以在造成严重损害之前中断攻击，从而起到防止损失的作用。\n\n### 章末总结\n\n在本章中，你熟悉了如何针对各种攻击选择适当的缓解和威慑技术。本章从讨论监控系统日志开始，常见的日志包括安全日志、`DNS`、`system`、`performance`、`event`、`access`、`firewall`、`antivirus`\
  \ 和 `IDS/IPS` 日志。本章继续介绍了对安全设置的定期审计。书书中还介绍了系统加固和管理接口的保护，相关章节包括禁用不必要的服务、保护管理接口和应用程序、密码保护以及禁用不必要的账户。\n\
  \n随后，回顾了密码选择标准、密码策略指南、良好密码的组成部分以及密码过期。本章继续介绍了网络安全，涵盖了 `MAC` 限制与过滤、`802.1x`、禁用未使用的接口和未使用的应用程序服务端口，以及非法设备检测。下一个主题是安全态势，介绍了系统基线初始化与更新、持续安全监控和修复。\n\
  \n本章以回顾检测控制与预防控制之间的差异而结束。\n\n### 习题\n\n为了帮助你进一步准备参加 CompTIA Security+ 考试，并测试你的准备程度，请回答以下问题，然后与章末的正确答案进行比对。\n\
  \n**1**.](#ch15.html#ch15q1) 一名用户的域账户在一天中多次被锁定。她怀疑有人正试图对她的账户进行暴力破解，或者故意将她锁定在外面。以下哪种日志最可能显示其他登录尝试的源头？\n\
  \n**A.** 事件日志（Event logs）\n**B.** Syslogs\n**C.** 安全日志（Security logs）\n**D.** 访问日志（Access\
  \ logs）\n\n**2**.](#ch15.html#ch15q2) 你的老板希望你为组织中所有的 `Windows 8` 工作站制定一个“起始点”。他希望你构建一个既安全又能用于在加载任何部门特定软件之前加载所有其他桌面的黄金镜像（golden\
  \ image）。你老板要求你创建的是什么？\n\n**A.** 黄金镜像点（Gold image point）\n**B.** 初始快照（Initial snapshot）\n\
  **C.** 初始基线配置（Initial baseline configuration）\n**D.** 安全基线（Security baseline）\n\n\
  **3**.](#ch15.html#ch15q3) 你的组织在门厅处有一个开放的网络插座。有人正试图通过这个插座上网。组织已经有了相关规定。以下哪种缓解技术可以阻止这种未经授权的使用？\n\
  \n**A.** `MAC` 过滤\n**B.** 预防（Prevention）\n**C.** 审计（Auditing）\n**D.** 进程跟踪（Process\
  \ tracking）\n\n**4**.](#ch15.html#ch15q4) 你的同事告诉你他已经为生产环境打了补丁，确保了所有账户都有强密码，并删除了不必要的开发。当你扫描服务器时，发现大量端口开启状态。他在加固服务器时忘记了什么？\n\
  \n**A.** 安装反病毒软件\n**B.** 禁用不必要的服务\n**C.** 开启审计\n**D.** 禁用 `MAC` 过滤\n\n**5**.](#ch15.html#ch15q5)\
  \ 你的老板试图寻找有关基于端口的网络访问信息。她应该查看以下哪些 `IEEE` 标准？\n\n**A.** `802.1x`\n**B.** `802.11`\n\
  **C.** `802.x`\n**D.** `801.2x`\n\n**6**.](#ch15.html#ch15q6) 组织面临人们从家里带来笔记本电脑和平板并连接到公司网络的问题。组织已有相关政策，但似乎不起作用。以下哪种缓解技术可能解决这个问题？\n\
  \n**A.** 禁用不必要的服务\n**B.** 非法设备检测（Rogue machine detection）\n**C.** `Syslog` 审计\n\
  **D.** 密码保护\n\n**7**.](#ch15.html#ch15q7) 你的老板希望有一种设备能够在恶意流量发生时阻止其进入你的网络内部。她要求你准备几种不同的方案并在明天向她汇报。你应该开始研究以下哪种？\n\
  \n**A.** 入侵检测系统（IDS）\n**B.** 入侵预防系统（IPS）\n**C.** 防火墙（Firewalls）\n**D.** 持续审计系统\n\
  \n**8**.](#ch15.html#ch15q8) 以下哪一项不是在加固生产系统时执行的步骤？\n\n**A.** 禁用不必要的服务\n**B.** 禁用不必要的账户\n\
  **C.** 开启简单的 `TCP` 服务\n**D.** 配置审计\n\n**9**.](#ch15.html#ch15q9) 一台基于 `Windows`\
  \ 的 Web 服务器遭受了缓冲区溢出攻击。你想知道服务器本身哪个进程受到了影响。你可以在哪里寻找关于哪个进程受影响的线索？\n\n**A.** 访问日志（Access\
  \ log）\n**B.** 应用日志（Application log）\n**C.** 安全日志（Security log）\n**D.** 设置日志（Setup\
  \ log）\n\n**10**.](#ch15.html#ch15q10) 入侵检测系统与以下哪种安全措施最相似？\n\n**A.** 锁上的门\n**B.**\
  \ 带电围栏\n**C.** 监控摄像头\n**D.** 人防门禁区（Mantrap entry）\n\n**11**.](#ch15.html#ch15q11)\
  \ 以下哪些项可以协助加固网络？（选择所有适用）\n\n**A.** `MAC` 限制\n**B.** `802.11`\n**C.** 非法用户检测\n**D.**\
  \ 禁用未使用的端口\n\n\n\n\n**12**. 你的老板正在考虑将组织的网络安全任务外包。目前有几个方案待审，其中许多方案声称能够“从安全控制中收集信息并根据预设指标进行分析”。这些供应商指的是哪种能力？\n\
  \n**A.** 全球监控服务\n\n**B.** 持续安全监控\n\n**C.** 侵入防御系统\n\n**D.** 基于指标的安全分析\n\n**13**.\
  \ 在 Windows 安全日志中，你不会发现以下哪种类型的日志条目？\n\n**A.** 账户登录事件\n\n**B.** 对象访问事件\n\n**C.**\
  \ 策略更改事件\n\n**D.** 系统关机事件\n\n**14**. 哪些是与系统常见的日志？（选择所有适用项。）\n\n**A.** 安全 (Security)\n\
  \n**B.** 失败 (Failure)\n\n**C.** 系统 (System)\n\n**D.** 数据完整性 (Data integrity)\n\n\
  **15**. 密码策略应该解决以下问题：\\_\\_\\_\\_\\_\\_\\_\\_\\_, \\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
  _, 和 \\_\\_\\_\\_\\_\\_\\_\\_\\_。\n\n### 答案\n\n**1**. **C.** 这种情况下最佳信息来源是安全日志。由于这是一个域账户且很可能运行在\
  \ Windows 系统上，你希望查看与该账户相关的所有失败登录记录。这些记录存储在安全日志中。\n\n**2**. **C.** 你的老板刚刚要求你创建一个初始基准配置。你开发的配置将成为所有\
  \ Windows 8 桌面电脑的起点。虽然在加载部门特定的软件包后，桌面电脑看起来可能不同，但它们都将从该初始基准开始，具有相同的属性和安全配置。\n\n**3**.\
  \ **A.** MAC 过滤技术可以控制哪些 `MAC` 地址允许跨特定的交换机端口发送或接收流量。如果你将该网络插锁定在锁定柜内 PC 的 `MAC` 地址上，将有助于防止其他人未经许可使用该网络插口。\n\
  \n**4**. **B.** 如果一台服务器有大量活动端口，它很可能运行着大量的服务。禁用不必要的的服务应该是所有生产（及开发）系统构建过程的一部分。禁用或移除不必要的服务可以减少系统的攻击面。\n\
  \n**5**. **A.** 如果你的老板正在研究基于端口的网络访问控制，那么她应该查看 `IEEE 802.1x`。\n\n**6**. **B.** 违规设备检测是一种缓解技术，用于发现网络中不受需要的、未经授权的设备和系统。一旦检测到它们，你就可以将其将其移除。\n\
  \n**7**. **B.** 违规设备检测是一种缓解技术，用于发现网络中不受需要的、未经授权的设备和系统。一旦检测到它们，你就可以将其移除。\n\n**8**.\
  \ **C.** 在加固系统时，目标之一是禁用不必要的服务。禁用或移除不必要的服务可以减少 `system` 的攻击面。\n\n**9**. **B.** 在基于\
  \ Windows 的服务器上，查找攻击信息的最佳位置是安全日志。\n\n**10**. **C.** 入侵检测系统就像摄像头。IDS 具有监控所见内容的能力。\n\
  \n**11**. **A.** 和 **D.** `MAC` 限制和禁用禁用端口是宝贵的安全功能。802.1 是以太网的标识。\n\n**12**. **B.**\
  \ 持续安全监控试图回答那个古老的问题：“我们安全吗？”通过从防火墙、`IDS/IPS` 等安全控制措施中收集数据，组织希望能够更好地了解其安全状况。例如，如果边界防火墙记录到端口\
  \ `33456` 的出站流量激增，这可能是僵尸网络感染的早期迹象。\n\n**13**. **D.** 系统关机事件会记录在系统日志中，而不是安全日志。\n\n\
  **14**. **A** 和 **C.** 安全日志和系统日志是常见日志的示例。\n\n**15**. 密码策略应该解决：可风险水平是多少？系统需要什么样的安全性？用户多久更改一次密码？应该使用什么样的账户锁定策略？\n\
  \n\n\n\n正如第 1 章中介绍的，`protocol analyzer`（协议分析器）仅仅是一种工具（硬件或软件），用于捕获和分析通过通信通道（如网络）的流量。虽然协议分析器存在许多类型的通信通道（例如电信流量和系统总线），但\
  \ `protocol analyzer` 最常用的用途是捕获和检查网络流量。在网络领域，这通常有多种名称，如 `packet sniffer`（数据包嗅探）、`network\
  \ analyzer`（网络分析器）或 `network sniffer`（网络嗅探）。嗅探器可用于捕获和分析有线或无线流量，可以是基于软件的（最常见），也可以是专用硬件/软件平台。有效的嗅探器必须能够将网络接口设置为混杂模式（promiscuous\
  \ mode），这会指示接口接受并处理它看到的每一个数据包——而不仅仅是针对该特定系统或发送到广播、组播或单播地址的数据包。在交换式网络中，嗅探器通常插在 `SPAN`（下一节讨论）或监控端口，这些端口被配置为接收通过同一交换机上一个或多个接口的数据包副本。数据包分析器的能力差异很大——有些只能进行简单的数据包捕获，而另一些则尝试通过解码后的数据包和颜色标记流量流重建整个\
  \ TCP/IP 会话。\n\n从安全的角度来看，协议分析器是非常有用且有效的工具。想看你的网络上是否有系统正在通过特定端口传输流量吗？想看是否有数据包被发送到竞争对手公司的地址吗？想看哪些员工整天都在逛\
  \ eBay 吗？想找到那个用广播流量淹没本地网络的系统吗？`protocol analyzer` 可以帮助你解决所有这些以及更多问题——只要你将分析器插在网络的正确位置，并能够“看到”你关心的流量。大多数组织在网络中都有多个可以嗅探流量的节点——核心交换机处、在用户群和服务器群之间、在远程用户和核心网络之间、在组织与任何互联网链路之间等。知道如何确保嗅探器能“看到”你想要分析的流量、知道将分析器放置在何处以及如何使用分析器，都是从\
  \ `protocol analyzer` 获得最佳结果的关键。\n\n### 交换端口分析器\n\n`Switched Port Analyzer (SPAN)`（交换端口分析器）这一术语通常与\
  \ Cisco 交换机相关——其他供应商将相同的功能称为 `port mirroring`（端口镜像）或 `port monitoring`（端口监控）。`SPAN`\
  \ 具有复制通过交换机上一个或多个端口或交换机上一个或多个 VLAN 的网络流量的能力，并将复制的流量转发到指定的用于流量捕获和分析的端口（如图 16-1 所示）。`SPAN`\
  \ 端口或镜像端口为流量创建收集点，这些流量将馈入 `protocol analyzer` 或 IDS/IPS。`SPAN` 或镜像端口通常可以配置为监控进入接口、离开接口或双向通过接口的流量。在配置端口镜像时，你需要意识到你正在使用的交换机的能力。它能处理这些数量的流量吗？它能成功镜像所有流量吗，还是会在流量量过高时最终向\
  \ `SPAN` 丢弃数据包？\n\n![image](img/f0291-01.jpg)\n\n* * *\n\n**图 16-1** 一个 SPAN\n\n\
  * * *\n\n### 漏洞扫描器\n\n（注：原文后续部分为重复内容，根据高级文档工程师规范，此处保留核心结构翻译）\n\n\n\n\n`应用程序漏洞扫描器`\
  \ 旨在寻找应用程序或特定类型应用程序中的漏洞。应用程序扫描器是最专门的扫描器之一——尽管它们包含了成百甚至数千项检查，但它们只针对特定类型应用程序的配置错误或漏洞。可以说，最流行的应用程序扫描器是用于测试\
  \ Web 应用程序的缺陷和漏洞的。Web 应用程序的设计目标是可见的、与用户交互并接收和处理用户输入——这些特性都使其成为攻击者极具吸引的目标。因此，市场上存在大量的\
  \ Web 应用程序扫描器，从开源到订阅制不等。要成为一个有效的 Web 应用程序扫描器，该工具必须能够对漏洞、配置错误、默认内容、设置、问题等进行数千次检查，并涵盖从\
  \ `IIS` 到 `Apache` 再到 `PHP`、`ASP` 以及其之间的所有 Web 技术。应用程序扫描器通常能够执行高级检查，例如 `SQL 注入`\
  \ 或 `JavaScript 注入`，这些检查需要与被检测的 Web 应用程序进行交互，并根据应用程序的反馈修改请求和响应。图 16-4 显示了 `Acunetix\
  \ WVS`（网络漏洞扫描器）的截图，这是一种专门针对 Web 技术的应用程序扫描器。\n\n![image](img/f0294-01.jpg)\n\n* *\
  \ *\n\n**图 16-4** `Acunetix WVS`\n\n* * *\n\n![image](img/examtip.jpg)\n\n**提示**\
  \ 如果你想检查特定的应用程序或同一类型程序的多个实例（例如网站），应用程序扫描器是首选工具。\n\n### 蜜罐 (Honeypots)\n`蜜罐` 是一个被设计成表现像企业网络中真实服务器的服务器，但它并不拥有真实数据，其包含的数据是伪造。蜜罐是攻击者极具吸引力的目标。蜜罐充当了攻击者的陷阱，因为蜜罐中的流量可以假设是恶意的。\n\
  \n### 蜜罐网 (Honeynets)\n`蜜罐网` 是被设计成像企业网络，但对攻击者具有吸引力的网络。`蜜罐网` 是多个蜜罐的集合。它看起来像企业网络，但由于已知它是虚假的副本，因此所有流量都被认为是非法的。这使得刻画攻击者的流量变得容易，并有助于了解攻击源自何处。\n\
  \n### 端口扫描器 (Port Scanner)\n`端口扫描器` 是一种用于探测系统或系统开放端口的工具。它的工作是探测开放（或监听）端口，并向用户报告哪些端口是关闭的、哪些是被过滤的、哪些是开放的。端口扫描器几乎适用于所有的操作系统和几乎所有流行的移动计算平台——从平板电脑到手机。在工具箱中拥有良好的端口扫描工具并知道如何使用它将非常有益。关于端口扫描器的消息/坏消息是，“坏人”使用它们的原因与好人使用它们的原因基本上相同。端口扫描器可以执行以下操作：\n\
  \n* **搜索网络上的“活动”主机。** 大多数端口扫描器允许你使用 `ICMP`、`TCP` 或 `UDP` 包进行快速扫描，以搜索给定网络或网段上的活动主机。`ICMP`\
  \ 在此任务中仍然流行，但由于许多现代操作系统（如 `Windows 7` 及更高版本）默认拦截了 `ICMPv4`，用户越来越多地转向 `TCP` 或 `UDP`\
  \ 扫描来完成这些任务。\n* **搜索网络上的任何开放端口。** 端口扫描器最常用于识别主机、主机组或网络上的任何开放端口。通过在大量主机上扫描大量端口，端口扫描器可以向你（或攻击者）提供关于你的网络中哪些主机运行着哪些服务的极佳图景。扫描可以针对“默认”的热门端口集、大范围端口或每一个端口进行。\n\
  * **搜索特定的端口。** 端口扫描器也可以针对热门端口集、大范围端口或每一个端口进行扫描。Web 服务器？邮件服务器？端口扫描器也可以配置为只查找特定的端口。\n\
  * **识别端口上的服务。** 某些端口扫描器可以根据服务或返回的信息帮助识别在开放端口上运行的服务。\n* **查找 TCP/UDP 服务。** 大多数端口扫描器可以扫描两者，尽管某些工具不允许同时扫描两者。\n\
  \n作为安全专业人员，你将以与攻击者相同的方式使用端口扫描器：探测系统的开放端口。端口扫描器实际上是如何工作的？这很大程度上取决于你在配置扫描时选择的选项，但为了便于说明，假设你正在对\
  \ `192.168.1.20` 运行扫描。当扫描器发送 `SYN` 包时，它会等待响应的 `SYN/ACK`。如果收到 `SYN/ACK`，扫描器将尝试完成三次握手并将端口标记为`开放`。如果发送的数据超时或收到\
  \ `RST` 包，扫描器可能会将该端口标记为`关闭`。如果返回“管理禁止”或类似的消息，扫描器可能会将该端口标记为`过滤`。扫描完成后，扫描器将摘要格式显示结果——列出开放、关闭、过滤的端口。通过检查每个端口的响应，你通常可以推断出关于所扫描系统的更多信息，详细如下：\n\
  \n* **开放**端口接受连接。如果你能通过端口扫描器连接到这些端口，说明端口没有在网络层被过滤。然而，在某些情况下，你可能会发现一个被端口扫描器标记为`开放`的端口，当你以其他方式连接它时，它会立即丢弃连接。例如，`SSH`\
  \ 的 22 端口在端口扫描器看来可能是开放的的，但它会立即丢弃你的 `SSH` 连接。在这种情况下，服务可能被主机防火墙或服务本身的防火墙功能过滤。\n* **关闭**\
  \ 当扫描目标返回 `RST` 包时，你通常会看到这种响应。\n * **过滤** 当返回 `ICMP` 不可用错误时，你通常会看到这种响应。这通常表明端口被防火墙或其他设备过滤。\n\
  \ * **其他类型** 某些端口扫描器会尝试对响应进行进一步分类，例如丢弃、阻塞、拒绝、超时等。这些具有特定的工具属性，你应该参考随附该端口扫描器的任何文档或帮助文件以获取更多信息。\n\
  \n\n\n\n通常情况下，你可能希望使用不同的选项多次运行扫描，以确保获得更全面的视图。`SYN` 扫描返回的结果可能与 `NULL` 扫描或 `FIN` 扫描不同。你可能还需要同时运行\
  \ `TCP` 和 `UDP` 扫描。你可能需要调整扫描方法，在一天中夜晚的不同时段使用多种技术，以确保完全覆盖。坏人现在正对你的网络进行这些操作，所以你也可以使用与他们相同的工具来查看他们所看到的内容。端口扫描器在测试防火墙配置时也非常有用，因为端口扫描的结果可以精确地显示你哪些端口是开放的、哪些端口是你允许通过的、哪些端口正运行着服务等等。\n\
  \n那么，你该如何防御端口扫描呢？嗯，这很困难。端口扫描现在几乎是互联网流量格局的一部分。尽管你可以阻止扫描扫描的 IP 地址，但大多数组织并不会这样做，因为你面临着攻击者伪造源地址以作为其他扫描活动诱饵的风险。最好的防御方法是使用防火墙、网络过滤器和主机过滤器来仔细控制进出你网络的流量。然后仔细监控任何你允许进入的流量。\n\
  \n#### 被动式与主动式工具\n\n工具可以分为主动式或被动式。`主动式工具`与目标系统的交互方式使得其使用可以被检测到。使用 `Nmap`（网络映射）扫描网络是一种可以被检测的主动行为。在\
  \ `Nmap` 的情况下，该工具本身可能无法被专门检测，但它的使用以及数据包的发送是可以被检测到的。当你需要映射网络或查找一个或多个主机上的开放服务时，端口扫描器可能是完成此任务最高效的工具。图\
  \ 16-5 显示了 `Zenmap` 的截图，它是流行的 `Nmap` 端口扫描器的跨平台版本，从 [insecure.org](http://www.insecure.org)\
  \ 获取。\n\n![image](img/f0297-01.jpg)\n\n* * *\n\n**图 16-5** `Zenmap`——一个基于 `Nmap`\
  \ 的端口扫描器\n\n`被动式工具`是指不会以允许检测的方式与系统交互的工具，例如发送数据包或更改流量。被动工具的一个示例是 `Tripwire`，它可以根据哈希值检测文件的更改。另一个被动示例是通过使用\
  \ `wireshark` 等工具分析 `TCP/IP` 轨迹来获取操作系统映射。被动传感器可以使用现有流量为分析提供数据。\n\n* * *\n\n![image](img/examtip.jpg)\n\
  \n**考试提示** `被动式工具`仅接收流量，不对流量流不做任何可能让其他人知道它们正在与网络交互的操作。`主动式工具`会修改或发送流量，因此可以通过其流量模式被发现。\n\
  \n#### 横幅抓取（Banner Grabbing）\n\n`横幅抓取`（Banner grabbing）是一种用于从通过横幅发布信息的服务收集信息的技术。横幅可用于许多；例如，它们可以根据类型、版本等识别服务，并允许管理员在用户登录时向其发布信息（包括警告）。攻击者可以使用横幅来确定运行着哪些服务，并且通常会对常见的发布横幅的服务操作，如\
  \ `HTTP`、`FTP`、`SMTP` 和 `Telnet`。图 16-6 显示了从 `Telnet` 客户端对 Web 服务器进行的两次横幅抓取。在此示例中，`Telnet`\
  \ 向两个不同的 Web 服务器发送信息并显示了响应（横幅）。顶部的响应来自 `Apache` 实例（`Apache/2.0.65`），底部来自 `Microsoft\
  \ IIS`（`Microsoft-HTTPAPI/2.0`）。\n\n![image](img/f0298-01.jpg)\n\n* * *\n\n**图 16-6**\
  \ 使用 `Telnet` 进行横幅抓取\n\n#### 风险计算\n\n评估系统安全态势的要素是确定系统面临的风险。尽管存在许多潜在的威胁和漏洞，但对代表最大风险的攻击向量优先采取行动和防御措施是非常关重要的。风险通过发生的概率和威胁的严重性来衡量。这两个衡量标准刻画了风险，并可以根据对系统的影响做出适当决策。\n\
  \n正如第 5 章中详细所示所示，风险计算中用的一种常用方法是：\n\n`风险 = 威胁 × 漏洞（影响）× 资产价值`\n\n```\n\n你必须为威胁、影响和资产价值确定合适的值以计算风险。\n\
  \n#### 威胁 vs. 可能性\n\n系统受到的威胁的严重性是一个重要的衡量标准。如果攻击成功但结果没有重大影响，那么这种攻击可能不构成太真正的风险。另一种攻击可能具有破坏性，以至于系统无法使用，这显然需要缓解。另一个衡量标准是攻击成功的可能性。如果可能性较低，则风险就会降低。如果可能性很高，则风险更高。真正的衡量标准是严重性和可能性的结合，通常通常将两者相乘。高可能性和高严重性的组合尤为危险，比低水平的组合值得多得多的关注。\n\
  \n攻击者也使用相同的衡量标准，因为他们会花费更多时间在成功率更高的方法上。在所有其他方面都相等的情况下，这提供了一种优先考虑防御措施的方法。\n\n####\
  \ 评估类型\n\n可以进行几种类型的评估。`评估`（assessment）是针对一组特定条件对系统进行的检查。评估可以针对威胁、漏洞和风险。这些评估每种输出都侧重于提供有关实际评估内容的信息。因此，虽然各种类型的评估可以互换使用，但它们的结果不同。\n\
  \n#### 风险\n\n`风险分析`（risk analysis）和`漏洞评估`（vulnerability assessment）有时互换使用，但这并不准确。分析和评估这两个词可以无缝替换，但风险不同于漏洞。漏洞将在本章后面的部分介绍。\n\
  \n风险分析通常从定量视角或定性视角进行。量化风险分析试图为坏情况发生的概率和该事件造成的损失设定数值（通常以美元为单位）。定性风险分析更多地依赖于估计的潜在损失以及相关的风险等级。\n\
  \n* * *\n\n![image](img/examtip.jpg)\n\n**考试提示** 量化风险分析试图为坏情况发生的概率和该事件造成的损失设定数值，而定性风险分析则依赖于发生和影响的相对水平。\n\
  \n#### 威胁\n\n`威胁评估`（threat assessment）是对企业面临的威胁的结构化分析。理解威胁很重要，因为你通常无法改变威胁——你只能改变它如何影响你。威胁评估首先是列举所有存在的威胁，然后对每个威胁的成功可能性进行估计。分析每个威胁对企业的潜在影响，可以提供一个优先关注的威胁列表。\n\
  \n#### 漏洞\n\n\n\n\n`vulnerability assessment`（漏洞评估）对于评估网络及其关键系统的安全态势非常有益。所有系统都存在漏洞，因此了解系统中存在哪些特定漏洞是确保系统的关键。识别已存在的漏洞并量化其影响可以帮助你决定采取何种缓解/保护策略。漏洞评估可以帮助确定在何方面投入安全预算，以及在何方面投入人力，甚至可以用于帮助获取额外资源。通常，保护网络或系统的第一步是找出它们损坏得有多严重。\n\
  \n## 评估技术\n\n可以采用多种技术对系统进行评估。每种技术都有其自身的优势，并旨在详细说明系统的某些特定方面。基准报告（Baseline reporting）可以衡量系统在基准配置下的安全态势。代码审查（Code\
  \ reviews）作为检查可审查代码库应用程序的评估工具是非常有用的。检查攻击面和审查架构是确定安全态势的其他方法。\n\n## 基准报告\n\n对系统的基准报告可以提供有关系统安全方面状态的信息。正如本节前面讨论的，存在诸如\
  \ `Microsoft Baseline Security Analyzer`（微软基准安全分析器，见图 16-3）之类的工具，用于衡量系统的基准安全配置。虽然之前的示例侧重于操作系统的安全态势，但存在独立的工具可以对安装的应用程序基础执行相同的分析。图\
  \ 16-7 显示了 `Secunia Personal Software Inspector (PSI)` 对系统进行扫描的结果。`Secunia PSI`\
  \ 是一个设计用于监控应用程序更新并帮助用户保持应用程序最新状态的程序。\n\n![image](img/f0301-01.jpg)\n\n**图 16-7**\
  \ 应用程序监控\n\n## 代码审查\n\n`Code review`（代码审查）本质上是对源代码的校对。代码审查旨在发现编程错误和糟糕的编码实践，这些因素可能导致缓冲区溢出、内存泄漏、未处理的异常等漏洞。代码审查可以通过多种方式进行，从非正式的（一名程序员在另一位开发者身后查看）到极其正式的（例如团队对整个代码库进行走读）。代码审查可以手动进行，但也存在提供自动化代码审查能力的工具。这些自动化审查工具可用于扫描大型代码库，并识别潜在问题或可能存在问题的区域。开发者就可以关注这些区域，而无需手动扫描整个代码库。自动化扫描后进行手动审查是一种广泛接受的通用做法，与手动审查整个代码库相比，它以低得多的“成本”提供了良好的覆盖率。\n\
  \n代码审查的主要益处是尽快发现并解决漏洞和安全问题——最好在软件进入正式测试之前。在开发过程中越早发现并解决漏洞，修复成本就越低。以 `Microsoft Word`\
  \ 为例——如果在开发阶段发现了一个漏洞，那么在那里纠正它比在发布产品中修复该漏洞要便宜得多。在开发阶段解决该漏洞可能涉及几名开发者和几行带注释的代码。而在已发布的产品中解决同一个漏洞则涉及代码修订、配置管理、回归测试、补丁开发、补丁说明开发等。如你所见，生产后解决漏洞所需的巨大工作促使许多组织在开发周期内早期且频繁地进行代码审查。\n\
  \n![image](img/examtip.jpg)\n\n**考试贴士** 代码审查是开发过程中一种强大的安全工具。代码审查涉及在进入开发生命周期的下一阶段之前，对代码进行漏洞或弱点的检查。\n\
  \n## 确定攻击面\n\n软件的 `attack surface`（攻击面）是指系统中可被未经授权的方访问的代码。这不仅包括代码本身，还包括与代码相关的广泛资源，如用户输入字段、协议、接口、资源文件和服务。攻击面的一个衡量标准是可访问项目的总数或加权数量。根据严重程度进行加权可能会改变某些决策点，但底线很简单：可攻击元素越多，风险就越大。攻击面的大小并不代表代码的质量——它仅仅衡量了可攻击项的数量。一项长久的安全实践是不启用不需要的功能。通过关闭不需要的功能，可以缩小攻击面并减少安全风险。在开发过程中理解攻击面是一个重要的安全功能。定义攻击面并记录更改有助于做出更好的安全决策。\n\
  \n无论软件是什么或功能如何，它都会受到攻击，且通过非常常见的方式进行。例如，薄弱的访问控制列表（ACLs）是一个常见的攻击点，无论操作系统如何都可以被利用。针对操作系统的攻击也可以用于许多原本安全的应用程序。攻击面评估是衡量和确定与设计相关的风险的方法。\n\
  \n要了解产品的攻击面，你需要衡量它被“访问”的方法。每个软件产品可能不同，但它们也会共享元素。与其他许多安全项目一样，团队首次构建攻击面元素列表时会比较困难。但随着时间的推移，增进式的检查将详细更多项目，使未来的列表更容易制定。在此背景下，以下是微软发布的与\
  \ Windows 相关的攻击面元素列表。虽然此列表并不完全适用，但它提供了一个起点，并作为攻击面元素类型的指南。\n\n- 打开的套接\n- 打开的远程过程调用\
  \ (RPC) 端\n- 打开的命名管道\n- 服务\n- 默认运行的服务\n- 以 `SYSTEM` 身份运行的服务\n- 活动的 Web 处理程序（ASP\
  \ 文件、HTR 文件等）\n- 活跃的 Internet 服务器应用程序接口 (ISAPI) 过滤器\n- 动态网页（ASP 等）\n- 可执行的虚拟目录\n\
  - 已启用的账户\n- 管理员组中的已启用账户\n- 对管道和共享的空会\n- 访客账户启用\n- 文件系统中的薄弱 ACLs\n- 注册表中的薄弱 ACLs\n\
  - 共享的薄弱 ACLs\n\n另一个信息来源是与之前的开发相关的已知漏洞历史。确定旧漏洞的根源有助于修复它们并防止未来发生，这也是用于确定攻击面的宝贵信息。\n\
  \n\n\n\n\n构成攻击面的特征列表，与攻击者用于攻击特定软件的列表是同一个列表。列表中的项目并不一定是漏洞，但它们是攻击者会尝试破坏的项。这些元素是所有漏洞的基础，因此对于某个特定的攻击面元素，可能存在也可能不存在漏洞，但每个漏洞下都会有一个未被发现的。这使得对攻击面的衡量成为对潜在漏洞表面的可靠估计。\n\
  \n## 审查架构\n\n对系统架构进行审查可以为系统的弱点和漏洞提供重要线索。架构审查应涵盖组件、数据如何在组件之间传输、组件的访问控制列表、数据传输以及用户连接。有许多安全架构框架可以帮助正确地设计系统。Web\
  \ 应用的一种常用框架是开放 Web 应用程序安全项目（OWASP），这是一个专注于 Web 应用程序安全的社区驱动型开源活动。其他架构指南可以在信息和相关技术控制目标（COBIT）和信息技术基础库（ITIL）中找到。\n\
  \n## 审查设计\n\n需要根据安全需求对设计进行审查，包括访问控制需求、数据安全和系统配置需求。利用攻击面区域文档和威胁模型的结果，安全团队能够适当评估应用程序中的安全功能。代码走查、设计审查、攻击面区域检查以及针对完整性的威胁建模文档是这些审查的关键元素。\n\
  \n## 渗透测试\n\n`penetration test`（或 `pentest`）模拟来自恶意外部人员的攻击——探测你的网络和系统以寻找进入方式（通常是任何进入方式）。渗透测试通常是最侵略性的安全测试形式，可以采取多种形式，取决于什么被视为“范围之内”或“范围之外”。例如，某些渗透测试仅仅是寻找进入网络的方法——任何进入方法。这可以从跨网络链路的攻击到社会工程，再到让测试人员物理闯入建筑。其他渗透测试则受到限制——仅允许跨网络链路的攻击，而不允许任何物理攻击。\n\
  \n无论范围和允许的方法如何，渗透测试的目标都是：确定攻击者是否可以绕过你的安全措施并访问你的系统。与漏洞评估不同（漏洞评估通常只是列出漏洞），渗透测试尝试利用漏洞以查看该漏洞允许多大的访问。渗透测试非常有用，体体现在：\n\
  \n*   可以显示一系列“低风险”项目之间的关系，这些项目可以被顺序利用以获得访问权限（使其在总体上成为一个“高风险”项）。\n*   可以用于测试员工的培训、安全措施的有效性，以及员工检测和响应潜在攻击者的能力。\n\
  *   通常可以识别并测试传统扫描工具难以甚至无法检测的漏洞。\n\n![image](img/examtip.jpg)\n\n**考试提示** 渗透测试专注于确定保护系统所使用的安全控制措施的有效性。\n\
  \n## 验证威胁是否存在\n\n渗透测试的一个方面是演示现实世界中遇到的威胁向量。由于渗透测试旨在提供可以增强系统的信息，潜在攻击的范围源于环境。\n\n##\
  \ 绕过安全控制\n\n渗透测试人员执行的关键测试之一是绕过安全控制。如果安全控制缺失、无效或配置不当，发现这种情况就是渗透测试人员的任务。\n\n## 主动测试安全控制\n\
  \n安全控制的存在是为了缓解威胁带来的风险。渗透测试可以在现实条件下主动攻击这些控制措施。\n\n## 利用漏洞\n\n渗透测试的关键元素是对漏洞的实际利用。利用遇到的漏洞有两个目的：首先，它证明了存在的风险水平；其次，它证明了攻击向量的可行性。在渗透测试期间，利用不会达到破坏性活动的程度。\n\
  \n## 漏洞扫描\n\n帮助管理员保护系统的一种非常有价值的方法是漏洞扫描。漏洞扫描是检查系统和网络设备中的漏洞、弱点和问题的过程，并在攻击者发现之前找到它们。名为\
  \ `vulnerability scanners` 的专用工具旨在管理员发现并解决漏洞。但漏洞扫描远不止于简单运行工具和检查结果——管理员必须能够分析任何发现的漏洞并确定其严重性、如何处理它们，以及是否会对任何业务流程产生影响。漏洞扫描还可以帮助识别账户设置、补丁级别和操作系统中的常见配置错误。大多数组织将漏洞扫描视为一个持续的过程，因为仅仅扫描一次系统并假设从那个时候起它们是安全的是不够的。\n\
  \n## 被动测试安全控制\n\n当使用自动漏洞扫描器检查系统漏洞时，其副作用之一是对安全控制措施的被动测试。这被称为 `passive testing`，因为漏洞扫描器的目标是系统而不是控制措施。如果安全控制是有效的，那么漏洞扫描可能无法正确识别漏洞。\n\
  \n## 识别漏洞\n\n漏洞是已知实体；否则扫描器将没有扫描它们的能力。当扫描器发现系统中存在漏洞时，它会记录这一事实。最后，发现的漏洞的枚举是漏洞分析报告的一部分。\n\
  \n漏洞方面的一个失败来源是系统配置不当。常见的配置错误包括访问控制失败和未能保护配置参数。漏洞扫描器可以编写为测试这些特定条件并进行报告。\n\n\n\n\n\
  漏洞扫描器需要一种方法来检测是否存在以及是否可以利用漏洞。一种方法是执行一种改变系统状态的测试，即侵入式测试。另一种方法是以一种不直接与特定漏洞交互的方式进行测试。这种非侵入式方法在实际确定漏洞时，准确性可能会低得多。如果漏洞扫描涉及大量检查，那么非侵入式方法可能具有优势，因为服务器可能不需要频繁重启。\n\
  \n## 有凭据扫描与无凭据扫描\n\n漏洞扫描器可以被录入系统的凭据，使其拥有与授权用户相同的访问权限。这被认为比在没有凭据的情况下运行相同测试要容易，而后者被广泛认为是更符合现实世界的攻击尝试。运行这两种扫描都是非常重要的，因为如果攻击者能够攻破账户，他们很可能拥有内部凭据。有凭据扫描在确定漏洞是否存在时会更准确，因为它们不受访问控制的限制。\n\
  \n## 误报\n\n工具并非完美。有时，它们会将某些事情错误地报告为问题，但实际上它们并不是问题；而在另时候，它们完全不会报告某个问题。`false positive`（误报）是一个错误的发现——即被错误报告为漏洞的内容。扫描器告诉你存在某个问题，但实际上什么问题也没有。`false\
  \ negative`（漏报/假阴性）则是指扫描器未能报告一个实际上存在的漏洞——扫描器简单地遗漏了该问题，或者没有将其报告为问题。\n\n## 测试\n\n\
  在描述漏洞测试和渗透测试的环境时，可以使用不同的测试方法论。就像在测试环境中一样，黑盒、白盒和灰盒测试术语被用于识别与测试相关的系统知识水平。\n\n### 黑盒\n\
  \n`Black-box testing`（黑盒测试）是一种软件测试技术，通过自动化方式注入畸形/半畸形数据来发现实现层漏洞。黑盒技术测试软件的功能，通常从外部或用户的角度进行。使用黑盒技术的测试人员通常对他们正在测试的软件的内部运行机制一无所知。他们将整个软件包视为一个“黑盒”——输入数据并观察输出。他们无法看到应用程序内部如何处理数据，只能看到返回给他们的输出。黑盒测试的测试用例通常围绕预期功能（软件应该执行的操作）构建，并侧重于提供有效和无效的输入。\n\
  \n黑盒软件测试技术对于检查任何基于基于 Web 的应用程序非常有用。基于 Web 的应用程序从暴露在公共流量的一刻起，通常会受到大量有效、无效、畸形和恶意输入的攻击。通过在应用程序发布之前进行黑盒测试，开发者可能可以在开发或测试阶段发现并纠正错误。\n\
  \n黑盒测试也可以应用于网络或系统。渗透测试和漏洞评估通常从纯粹的外部视角进行，测试人员对他们正在检查的网络或系统没有内部知情。\n\n### 白盒\n\n`White-box\
  \ testing`（白盒测试）几乎是黑盒测试的对立面。它也被称为透明盒测试，白盒技术测试应用程序内部结构和处理过程，以寻找漏洞、缺陷等。白盒测试人员将对他们正在检查的应用程序有详细了解——他们将开发旨在执行应用程序每个路径、决策树、输入字段和处理例程的测试用例。\n\
  \n白盒测试通常用于测试应用程序内部路径（如果 X，则执行此；如果 Y，则执行彼）、数据流、决策树等。有时 `white-box testing` 一术也应用于网络评估，此时测试人员将对网络有详细了解，包括但不限于\
  \ IP 地址、网络路由、有效用户凭据等。在这些情况下，测试人员通常被称为“白帽”。\n\n### 灰盒\n\n那么，当把一点黑盒测试和一点白盒测试混合时会发生什么？你得到了灰盒测试。在灰盒测试中，测试人员通常对他们正在测试的软件、网络或系统有一定的了解。由于由于原因，灰盒测试可以非常高效有效，因为测试人员通常可以快速排除整个测试路径、测试用例和工具集，并排除那些根本无效且不值得尝试的东西。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 黑盒测试与白盒测试的主要区别在于视角和知识。黑盒测试人员对内部机制一所不知，从外部视角进行测试。白盒测试人员对内部机制有详细了解，从内部视角进行测试。\n\
  \n## 章节复\n\n在本章中，你熟悉了威胁和发现。章节从各种工具以及如何解释其结果开始。这些工具包括漏洞扫描器、蜜罐和蜜罐网络、端口扫描器和横幅抓取（banner\
  \ grabbing）。\n\n章节接着介绍了风险计算。使用风险计算和评估设计（包括风险、威胁和漏洞）可以提供允许安全操作优先排序的信息。下一节关于评估技术，涵盖了基线报告、代码审查、攻击面确定和设计审查。\n\
  \n该章节随后讨论了渗透测试和漏洞扫描。它涵盖了渗透测试的步骤、漏洞扫描的过程、误报和漏报的情况，最后是白盒测试。\n\n## 练习\n\n1. 你的老板承诺帮助审计部门并指派了你。他们正在寻找列出服务器机房中每个系统的列表，以及每个系统上响应的服务列表。你可能会使用哪种工具来创建这样一份列表？\n\
  A. 漏洞扫描器\nB. 端口扫描器\nC. 代理工具\nD. 协议分析器\n\n2. 你想雇佣人员测试公司刚刚开发的一个应用程序。该程序处理敏感数据，因此你想限制向公司以外的人发布有关应用程序的信息。你正在寻找哪种测试类型？\n\
  A. 白盒测试\nB. 灰盒测试\nC. 闭盒测试\nD. 黑盒测试\n\n3. 用于识别潜在危险并评估其影响的过程被称为什么？\nA. 风险评估\nB. 业务连续性计划\n\
  C. 架构审查\nD. 过程跟踪\n\n\n\n\n### 4. 你的老板刚刚读了一篇关于公司如何建立虚假网站来诱骗攻击者关注虚假网站而非实际生产系统的文章。现在他想让你为你的\
  \ DMZ（非军事区）构建一个类似的东西。他告诉你要对攻击者看起来“具有诱惑力”。你的老板实际上是在要求你建立什么？\n\nA. 入侵检测系统\nB. 漏洞评估\n\
  C. 蜜罐\nD. 灰盒\n\n### 5. 在一名测试人员发现一个重大漏洞后，某个应用程序的开发被推迟。现在开发人员被要求逐行检查彼此的代码并寻找任何剩余漏洞。这些开发人员正在做什么？\n\
  \nA. 质量保证\nB. 代码审查\nC. 风险评估\nD. 代码分析\n\n### 6. 列出三个对于确定风险重要的项目：\\_\\_\\_\\_\\_\\\
  _\\_\\_\\_\\_, \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_, \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_.\n\
  \n### 7. 你需要一种能够帮助你更有效地分析网络流量的工具，这种工具能够在数据包级别记录流量，以便你查找 ARP 风暴、重复 MAC 地址等问题。你应该购买哪种工具？\n\
  \nA. 白盒分析器\nB. 网络扫描器\nC. 被动扫描器\nD. 协议分析器\n\n### 8. 你的组织希望有人检查你的内网门户，以评估来自恶意内部人员的威胁。在这种情况下，哪种测试最合适？\n\
  \nA. 凭证测试\nB. 代码审查\nC. 活跃测试\nD. 风险评估\n\n### 9. 下列哪些工具或方法最可能向你展示服务器场中的哪些服务器允许匿名访问共享、开启了\
  \ TCP 端口 80 并运行旧版本的 PHP？\n\nA. 协议分析器\nB. 端口扫描器\nC. 漏洞扫描器\nD. 基线审查\n\n### 10. 你发现了一份打印列表，上面有一堆\
  \ IP 地址，旁边带有描述，例如“220 Microsoft ESMTP MAIL Service ready”和“220 Microsoft FTP Service”。哪种活动可能生成了这种列表？\n\
  \nA. 风险评估\nB. 标标识抓取 (Banner grabbing)\nC. Telnet 映射\nD. 黑盒测试\n\n### 11. 你的漏洞扫描工具报告说，你的网站容易受到\
  \ SQL 注入攻击，该攻击可以操纵隐藏参数的值。你已经通过手动对其进行了彻底测试，但无法验证该发现。你每次尝试时，都会得到一个非标准的错误消息，指示查询已终止。你的漏洞扫描器最可能报告的是：\n\
  \nA. 无效的重定向\nB. 用户错误\nC. 假性阴性 (False negative)\nD. 安全控制\n\n### 12. 你被要求对组织开发的一个新\
  \ Web 应用程序进行测试。CEO 希望你进行灰盒测试。为了进行这种测试，你需要什么？\n\nA. 只需要应用程序的 URL\nB. 应用程序的 URL 以及数据结构和算法的文档\n\
  C. 关于应用程序的所有知识，包括 URL、数据结构和算法的文档以及通过应用程序进行的所有功能列表\nD. 对应用程序一无所知\n\n### 13. 下列哪项最能描述应用程序的攻击面？\n\
  \nA. 所有登录界面和用户输入\nB. 所有登录、用户输入和数据字段\nC. 所有登录、用户输入、数据字段以及正在使用的证书\nD. 所有登录、用户输入、数据字段、应用程序的进出数据路径以及保护数据路径的代码\n\
  \n### 14. 你想在网络上放置一个工具，持续寻找你网络上的漏洞。你的网络管理员拒绝允许任何可能干扰网络流量的工具。你可以使用哪种工具作为这两种立场之间的折中方案？\n\
  \nA. 活跃网络漏洞扫描器\nB. 被动漏洞扫描器\nC. 入侵预防系统\nD. 被动防火墙\n\n### 15. 你正在进行渗透测试，并发现了一个容易受到\
  \ SQL 注入攻击的 Web 服务器。你的团队负责人允许你在登录字段检查是否可以使用 SQL 注入攻击进入系统。这可行了。你刚刚执行了哪种渗透测试步骤？\n\n\
  A. 安全控制的被动测试\nB. 白盒测试\nC. 漏洞识别\nD. 漏洞利用\n\n### 答案\n\n1. 如果审计部门需要一份系统及其上开放服务的列表，端口扫描器就是你需要的。任何好用的端口扫描器（如\
  \ `nmap`）都能检测这些系统。\n2. 如果你想在不了解软件内部原理或构建方式的情况下对其进行测试，那么你寻找的是黑盒测试。黑盒测试在不了解数据结构的情况下检查软件的功能。\n\
  3. 风险评估是识别潜在危害并分析这些危害实际发生时影响的过程。\n4. 你的老板实际上在寻找一个蜜罐——一个故意设置了漏洞和配置错误的系统，使其对攻击者产生吸引力。蜜罐通常用于研究攻击者的方法和工具。\n\
  5. 开发人员正在进行代码审查——对源代码进行系统的检查，以发现并消除错误、拼写错误等。\n6. 确定风险三个要素是威胁的可能性、漏洞的可发现性和资产的影响价值。你必须考虑威胁、影响和资产价值来计算风险。\n\
  7. 如果你在寻找一种帮助你分析网络流量的工具，你应该购买协议分析器。协议分析器用于捕获和检查通信通道中的信号和数据的工具。几乎每种通信通道都有协议分析器。\n\
  8. 如果你想评估来自恶意内部人员的威胁，你最可能使用凭证测试。凭证测试在进行测试时使用一组有效的用户凭据。这允许测试人员以与用户相同的视角和权限检查应用程序。\n\
  9. 漏洞扫描器是列出的工具唯一能提供这三项信息的。端口扫描器可以告诉你端口 80 是否开启，但无法测试共享访问或脆弱的 PHP 版本。大多数漏洞扫描器（如 `Nessus`）都会执行基本的\
  \ TCP 端口扫描，还会扫描配置错误、不软件版本等。\n\n\n\n\n\n## 10. B. 显示如“220 Microsoft FTP Service”等服务“横幅”（banners）的列表通常是通过获取横幅创建的。有很多专门用于获取横幅的工具，但你可以简单地使用\
  \ `Telnet` 客户端连接到服务来实现相同的功能。在大多数情况下，服务会返回一个包含该服务各种细节的 banner。\n\n## 11. B. 测试中一定存在用户错误。当任何扫描工具报告一个实际上并不存在且真实不存在的“发现”时，这被称为\
  \ `false positive`（误报）。\n\n## 12. B. 灰盒测试是白盒测试和黑盒测试的结合。测试人员对所检查的系统或应用程序有一定的了解，例如数据结构和算法，但并不像白盒测试那样完全了解该应用程序。\n\
  \n## 13. D. 应用程序的攻击面实际上是对攻击者可能渗透或破坏应用程序的所有不同位置的描述。这包括进入和离开应用程序的所有数据路径、应用程序使用的所有数据，以及保护和处理数据及数据路径的代码。\n\
  \n## 14. B. 如果你需要一个既能寻找漏洞又不会干扰网络流量的工具，最好的折中方案是某种类型的被动网络漏洞扫描器。“被动”扫描器等待数据传输给它——它不会自行执行任何扫描或探测，也不会与其观察到的流量进行交互。\n\
  \n## 15. D. 每当你发现一个漏洞并使用工具或技术利用该漏洞获取访问权限或操纵数据时，你就执行了漏洞利用。识别漏洞止于对发现的漏洞进行任何操作。使用 `SQL\
  \ injection` 攻击获取系统的访问权限绝对符合漏洞利用。\n\n# 第四部分\n\n## 应用程序、数据与主机安全\n\n- 第 17 章：应用程序安全控制\n\
  - 第 18 章：移动设备安全\n- 第 19 章：基于主机的安全\n- 第 20 章：替代环境的安全\n\n## 第 17 章\n\n## 应用程序安全控制\n\
  \n在本章中，你将：\n\n- 发现安全编码概念的重要性\n- 理解应用程序安全控制和技术的重要性\n- 发现输入处理的重要性\n- 学习用于安全编码的工具和技术\n\
  - 学习应用程序加固技术\n\n应用程序安全控制和技术对于确保部署的应用程序尽可能安全至关重要。从安全编码技术开始，通过添加安全控制提供深度防御，从而建立应用程序的安全性。使用应用程序加固技术以及适当的配置和变更控制，提供了一种流程驱动的方法，以确保根据定义的风险状况持续安全性。\n\
  \n### 安全编码概念\n\n应用程序安全始于安全且无漏洞的代码。遗憾的是，所有代码都有弱点和漏洞，因此以一种具有有效防御防止漏洞被利用的方式实例化代码，可以维持预期的安全水平。对配置、错误、异常和输入进行适当处理有助于创建安全应用程序。在整个系统生命周期内对应用程序进行测试可以确定系统的实际安全风险状况。\n\
  \n软件开发生命周期（`SDL`）中有许多单独元素可以帮助团队开发安全代码。正确的 `SDL` 流程，如输入验证、适当的错误和异常处理，以及跨站脚本和跨站请求伪造缓解，可以提高代码的安全性。安全测试、模糊测试（fuzzing）和补丁管理等流程元素也有助于确保应用程序符合预期风险状况。\n\
  \n常见的错误有两个主要的分类：由 `MITRE` 维护的 `Top 25` 列表以及针对 Web 应用程序的 `OWASP Top Ten` 列表。根据评估的应用程序类型，这些列表为已知错误类型的安全分析提供了一个坚实的起点。`MITRE`\
  \ 是标准程序标准列表的库，`OWASP` 是 Web 应用程序的库。由于常见错误的产生变化并不快，这些列表并非每年更新。\n\n### 错误与异常处理\n\n\
  每个应用程序都会遇到错误和异常，这些需要以安全的方式进行处理。一种攻击方法包括强制错误使应用程序从正常运行切换到异常处理。在发生异常期间，通常的做法是记录/报告该状态，包括支持性信息，例如导致错误的数据。这些信息对于诊断错误原因可能是无价的。挑战在于在哪里捕获这些信息。最好的方法将其捕获到日志文件中，并通过\
  \ ACL 进行安全保护。最糟糕的情况是回显给用户。当攻击者故意制造错误时，向用户回显错误状态细节可以提供价值信息。\n\n**考试提示**：所有的错误/异常都应该在生成例程中捕获并处理。\n\
  \n不当的异常处理会导致各种泄露。与 `SQL` 语句相关的错误可能会暴露数据结构和数据元素。远程过程调用（`RPC`）错误可能会提供敏感信息，如文件名、路径和服务器名称。程序错误可能会提供发生异常的行号、被调用的方法以及堆栈元素等信息。\n\
  \n### 输入验证\n\n随着 Web 应用程序的普及，错误已缓冲区溢出转向输入处理问题。用户具有操纵输入的能力，因此开发者需要适当处理输入以防止恶意输入产生影响。缓冲区溢出可以被视为不当输入的一类，但新的攻击包括规范化攻击和算术攻击。可能采用的最重要的防御机制是输入验证。将所有输入在经过妥当验证之前视为敌性的，可以缓解许多基于常见漏洞的攻击。这是一个挑战，因为验证工作需要在所有解析器完成对输入流的操作之后进行，这在使用\
  \ Unicode 和其他国际字符集的 Web 应用程序中是一个常见功能。\n\n输入验证特别适用于以下漏洞：缓冲区溢出、安全决策中依赖不可信输入、跨站脚本（`XSS`）、跨站请求伪造（`XSRF`）、路径遍历和缓冲区大小计算错误。输入验证似乎适用于各种注入攻击，但考虑到输入的复杂性以及合法但不当输入流带来的后果，这种方法对于大多数注入攻击都显得不从心。有效的方法是一种识别和白名单方法，即输入经过验证后解析为标准结构，然后执行。这把攻击面限制在不仅是合法输入，还包括预期的输入之内。\n\
  \n\n\n\n\n**考试提示** 认为所有输入都是敌对性的。输入验证是所采用的最安全编码技术之一，它可以缓解许多潜在的漏洞。\n\n在许多情况下，输出验证与输入验证同样重要。如果查询数据库以匹配用户名和密码，则\
  \ `match` 函数预期的输出形式应该是有一个匹配项或一个匹配项都没有。如果使用记录数来指示匹配程度（这是一种常见做法），那么除 `0` 或 `1` 以外的值都应视为错误。使用输出验证进行防御性编码时，应对应对\
  \ `>1` 的值执行操作，因为这些值显然是错误，应被处理为失败。\n\n### 模糊测试 (Fuzzing)\n\n测试中可以使用的最强大的工具之一是 `fuzzing`（也称为模糊测试），它通过系统地应用一系列畸形输入来测试程序的如何响应的。多年来，黑客一直利用模糊测试寻找可能被利用的缓冲区溢出漏洞，而无需任何特定的编码知识。无论是白盒测试还是黑盒测试，模糊测试都能完美工作。模糊测试是发现意外输入验证错误的最佳实践。\n\
  \n测试人员可以使用模糊测试框架来自动生成大量的输入序列。在检查某个函数是否会受到缓冲区溢出的攻击时，测试人员可以运行大量输入，测试长度和最终的有效负载交付选项。如果特定的输入字符串导致了可以被利用的崩溃，测试人员将详细检查此输入。模糊测试在开发领域仍然相对较新，但正在迅速成熟，并将很快与其他自动化代码检查工具并驾竞争。\n\
  \n### 跨站脚本攻击防护 (Cross-site Scripting Prevention)\n\n跨站脚本 (XSS) 是常见的网络攻击方法之一。该漏洞产生由于用户输入验证薄弱。如果输入没有经过适当验证，攻击者可以在输入中包含脚本并使其作为\
  \ Web 过程的一部分被渲染。有不同类型的 XSS 攻击，根据脚本的效果进行区分：\n\n*   **非持久性 XSS 攻击**：注入的脚本不会持久化或存储，而是立即执行并通过\
  \ Web 服务器传回。\n*   **持久性 XSS 攻击**：脚本被永久存储在 Web 服务器或某些后端存储中。这使得脚本可以用于攻击系统的其他用户。\n\
  *   **基于 DOM 的 XSS 攻击**：脚本通过文档对象模型 (DOM) 过程在浏览器中执行，而不是通过 Web 服务器。\n\n跨站脚本攻击可能导致广泛的后果，在某些情况下，列表可以是任何聪明的脚本编写者能设计的。。在现实中看到的常见用途包括：\n\
  \n*   从 Web 应用程序中窃取身份信息\n*   会话劫持\n*   部署敌性内容\n*   更改用户设置（包括未来的用户）\n*   冒充用户\n\n\
  保护设置至关重要，保护这些设置的最常用机制包括访问控制列表和受保护目录。所需设置的文档是一份重要的安全文档，有助于管理员确保在更新后维持适当的配置。\n\n###\
  \ 跨站请求伪造 (Cross-site Request Forgery)\n\n跨站请求伪造 (CSRF) 是一种漏洞，恶意站点欺骗用户在他们当前已验证的另一个应用程序上执行不希望的操作。之所以可能，是因为浏览器在向目标域发送每个请求时都会自动包含如会话\
  \ Cookie 等凭据。为了防止 CSRF，开发者通常使用反 CSRF 令牌，这是为每个会话或请求生成的唯一且不可预测的值。服务器在处理请求之前会验证令牌，以确保其源自合法应用程序。\n\
  \n### 应用程序加固 (Application Hardening)\n\n应用程序加固的工作方式与系统加固（下文讨论）相同。第一步是移除不必要的组件或选项。第二步是系统的正确配置。每次更新或补丁都可能导致这些条件发生变化，应在每次更新后进行确认。\n\
  \n确保系统加固的主要工具是安全应用程序配置基准和补丁管理流程。当合理使用时，这些工具可以带来最安全的系统。\n\n### 应用程序配置基准 (Application\
  \ Configuration Baseline)\n\n*基准* (baseline) 是计算机系统的一组适当设置。*应用程序配置基准*概述了一个或一组应用程序的适当设置和配置。这些设置包含了许多元素，从应用程序设置到安全设置。\n\
  \n### 应用程序补丁管理 (Application Patch Management)\n\n应用程序补丁管理是应用程序和系统加固的基础组成部分。目标是运行最安全的应用程序版本，在极少数情况下，这应该是软件的当前版本（包括补丁）。大多数更新和补丁都包含修复安全问题和关闭漏洞。当前的补丁也是许多合规性方案的要求。\n\
  \n补丁并不总是按计划进行，某些补丁可能会导致生产系统出现问题。需要一个正式的补丁管理系统，以变更控制的方式测试并实施补丁。\n\n### NoSQL 数据库与\
  \ SQL 数据库\n\n当前的编程趋势包括如使用 SQL 数据库还是 NoSQL 数据库等话题。SQL 数据库是指使用结构化查询语言 (SQL) 来处理以表的形式关系地引用的项。NoSQL\
  \ 指既不使用 SQL 使用关系表结构的数据存储。每个系统都有其优缺点，两者都可以用于广泛的数据存储需求。\n\n\n\n\nSQL 数据库是目前最常见的数据库，其中\
  \ IBM、Microsoft 和 Oracle 的实现是主要的参与者。NoSQL 数据库倾向于使用低级语言进行自定义构建，并且缺乏现有数据库的许多标准。但这并没有阻止\
  \ NoSQL 数据库在大规模、资源充足的环境中的增长。\n\n以安全方式访问数据的重要因素在于正确地使用编程结构和框架来抽象访问过程。诸如内联 SQL 生成结合输入验证错误的方法，是导致\
  \ SQL 注入攻击形式的灾难的祸源。\n\n## 服务端验证 vs. 客户端验证\n\n在现代的客户端-服务器环境中，可以在服务器端或客户端检查数据是否符合输入/输出要求。在将数据发送到服务器之前在客户端验证数据元素具有优势，即效率。在客户端上进行检查可以节省一次往返及其延迟，从而在用户发现问题之前对其发出警告。这可以提高软件界面的易用性。\n\
  \n客户端不是执行任何关键值检查或安全检查的合适位置。原因有两点：第一，客户端可以在检查后更改任何内容；其次，数据在传输过程中或在中间代理处可能会被篡改。对于所有出于业务原因或安全考虑而至关重要的检查，验证步骤应在服务端执行，因为那里的数据没有未经授权的更改。输入验证检查只能在服务端安全地执行。\n\
  \n![imageimage](img/examtip.jpg)\n\n**考试提示** 所有的输入验证都应该在客户端-服务器关系的服务端执行，因为那里不受外部影响和更改。\n\
  \n## 章节复\n\n在本章中，你熟悉了应用安全控制的原理。可测试的控制措施包括模糊测试（fuzzing）、跨站脚本防护（XSS）、跨站请求伪造防护（XSRF）以及错误与异常处理、输入验证的安全编码概念。介绍了补丁管理和基准配置设置等应用加固过程。本章通过对\
  \ NoSQL 与 SQL 数据库的比较，以及客户端验证与服务端验证工作的角色分析作为结束。\n\n## 问题\n\n为了帮助你进一步准备 CompTIA Security+\
  \ 考试，并测试你的准备程度，请回答以下问题，然后与章节末尾的答案进行比对。\n\n**1**. 下列哪项描述了模糊测试（fuzzing）？\nA. 迭代开发\n\
  B. 移除不再使用的旧代码\nC. 系统地应用畸形输入\nD. 缓冲区溢出\n\n**2**. 下列哪项正确定义了 SQL 注入？\nA. 通过向函数传递虚假输入修改数据库查询语句\n\
  B. 应用程序处理字符串到基本形式的过程\nC. 由不同解析器处理的 Web 应用程序输入\nD. 允许多语言能力的字符集\n\n**3**. 下列哪项是最常见的网络攻击方法之一？\n\
