  \n**15. C.** 社区云 (Community cloud)\n\n# 第 4 章\n\n***\n\n## 安全无线网络\n\n在本章中，你将：\n\
  * 根据给定场景，排错与无线网络相关的安全问题\n* 学习无线网络的安全影响\n* 学习不同版本中内置的安全功能\n* 识别不同的 802.11 版本\n\n\
  无线接入日益成为人们访问 Internet 的方式。由于无线接入被视为一种消费者福利，许多企业增加了无线接入点以吸引顾客。随着第三代 (3G) 和第四代 (4G)\
  \ 移动蜂窝网络的推出，人们越来越多地通过手机访问 Internet。非传统电脑（如笔记本电脑、电子阅读器和平板电脑）普及度的巨大增长也推动了无线接入的流行。\n\
  \n随着无线使用的增加，无线协议的安全性已成为整个网络安全中更重要的因素。作为安全专业人员，你需要理解无线网络应用，因为在广播任何人都可以截获的网络中存在固有风险。在公共波上发送未加密的信息等同于在公司大门上贴出密码。\n\
  \n本章将介绍几种当前的无线协议及其安全特性。\n\n### 无线网络\n\n无线网络是通过不使用直接物理链路的物理拓扑传输分组数据的方式。该定义可以缩小为适用于使用无线电波在公共或私有频段传输信号的网络，而不是使用标准的网络电缆。\n\
  \n802.11 协议已由 IEEE 为无线局域网 (WLAN) 标准化。目前有五个版本在投产——802.11a、802.11b、802.11g、802.11n\
  \ 和 802.11ac。802.11n 是最新标准，但提供了与 802.11g 硬件的兼容。\n\n### SSID\n\n802.11 协议设计者预见到了一些安全问题，并尝试在\
  \ 802.11 协议中构建机制以确保足够的安全性。802.11 标准包含了对基础身份验证和机密性控制的尝试。身份验证由 802.11 接入点 (AP) 以最基本的形式处理，强制客户端在尝试“关联”到\
  \ AP 时执行握手。关联是 AP 允许客户端跨越 AP 连接到网络之前所需要的过程。\n\n\n\n\n认证功能被称为 `服务集标识符 (SSID)`。这个唯一的\
  \ 32 字符标识符被附加在数据包的头部。只有当客户端拥有握手过程中所需的所有正确参数（其中 `SSID`）时，才会发生关联。此 `SSID` 设置应将访问限制仅限无线网络的授权用户。`SSID`\
  \ 默认作为网络名称广播，但可以禁用此信标帧（beacon frame）。许多接入点（AP）也使用默认的 `SSID`；例如，对于许多版本的 Cisco AP，此默认值为\
  \ `tsunami`，这可能表示该 AP 未配置任何安全防护措施。重命名 `SSID` 并禁用 `SSID` 广播都是好主意；然而，由于 `SSID` 是每个数据帧的一部分，这些措施不应被视为保护了网络。由于\
  \ `SSID` 理论上是一个唯一标识符，只有知道标识符的人才能完成与 AP 的关联。\n\n虽然 `SSID` 在理论上是一个好主，但它在数据包中是以明文传输的，因此在实践中，`SSID`\
  \ 提供的安全性意义不大——任何嗅探器都能确定 `SSID`，并且许多操作系统（例如 Windows XP 及更高版本）会显示区域内活跃的 `SSIDs` 列表，并提示用户选择连接哪一个。这种弱性由于大多数\
  \ AP 默认传输信标帧的设置被放大了。信标帧的目的是发布无线网络的存在和能力，以便 WLAN 卡能够尝试与其关联。在许多 AP 中，这可以在软件中禁用此功能，特别是那些功能更复杂的\
  \ AP。从安全角度来看，信标帧是有害的，因为它包含了 `SSID`，而且此信标帧按固定的间隔传输（默认为每秒十次）。由于一个没有任何其他流量的默认 AP 每秒发送十次明文\
  \ `SSID`，你可以看出为什么 `SSID` 无法提供真正的认证。诸如 `NetStumbler` 的扫描程序是通过捕获所有 AP 的信标帧并从而获取其 `SSIDs`\
  \ 来工作的。\n\n***\n\n![image](img/examtip.jpg)\n\n**考试贴士**尽管不被认为是最强大的安全措施，但重命名 `SSID`\
  \ 和禁用 `SSID` 广播是考试中需要掌握的概念。\n\n### WEP\n\n802.11 协议的设计者还尝试通过引入有线等隐私 (`WEP`) 来维护机密性，它使用加密算法对在空气中传输的数据进行加密。`WEP`\
  \ 已被证明存在实现问题，可以利用这些问题来破坏安全性。`WEP` 使用 `RC4` 流加密器对跨网络传输的数据进行加密，以确保机密性。（`RC4` 加密器的细节请参见第\
  \ 24 节）。这种同步加密方法确保了某种认证机制。该系统依赖于客户端和 AP 之间拥有共享密钥，确保只有持有正确密钥的授权人员才能访问无线网络。`WEP` 支持两种密钥长度：40\
  \ 位和 104 位，尽管这些通常被称为 64 位和 128 位。在 802.11a 和 802.11g 中，制造商将其扩展到 152 位的 `WEP` 密钥。这是因为在所有情况下，总密钥长度的\
  \ 24 位被用于初始化向量 (`IV`)。\n\n`IV` 是 `WEP` 弱性的主要原因。`IV` 在消息的明文部分发送，因为 `IV` 在消息的明文部分发送……（注：输入文本后半部分存在大量重复/损坏，我已保留了提供的核心技术描述）。\n\
  \n\n\n\n如果 WPS 不安全，该如何设置 WPA2 呢？要设置 WPA2，你需要几个参数。图 4-1 显示了 Windows 7 中设置 WPA2 的界面。\n\
  \n![image](img/f0067-01.jpg)\n\n**图 4-1** Windows 7 中的 WPA2 设置选项\n\n第一个元素是选择安全框架。在配置适配器连接到现有网络时，你需要与网络的选择相匹配。在设置自己的网络时，你可以选择任何你喜欢的选项。虽然有许多选择，但出于安全考虑，你应该选择\
  \ `WPA2-Personal` 或 `WPA2-Enterprise`。这两种者都需要选择一种加密类型，即 `TKIP` 或 `AES`。`TKIP` 已被弃用，因此选择\
  \ `AES`。最后一个元素是选择网络安全密钥——所有用户共享的密钥。`WPA2-Enterprise` 设计用于与 `802.1x` 认证服务器配合使用，该服务器为每个用户分配不同的密钥，通常用于业务环境。\n\
  \n### EAP\n\n扩展身份验证协议（`EAP`）定义在 `RFC 2284` 中（被 `3748` 取代）。`EAP-TLS` 依赖于传输层安全（`TLS`），这是一种尝试标准化\
  \ SSL 结构以传递凭据的方法。`EAP-TTLS`（缩名为 `EAP–Tunneled TLS Protocol`）是 `EAP-TLS` 协议的变体。`EAP-TTLS`\
  \ 的工作方式与 `EAP-TLS` 基本相同，服务器通过证书验证客户端，但该协议对客户端认证进行了隧道处理，允许使用传统的认证协议，如密码认证协议（`PAP`）、挑战握手认证协议（`CHAP`）、`MS-CHAP`\
  \ 或 `MS-CHAP-V2`。\n\n### PEAP\n\n`PEAP` 或受保护的 EAP 的开发目的是通过 `TLS` 封装来保护 `EAP` 通信。这是由思科、微软和\
  \ RSA 共同开发的标准。`EAP` 的设计假设存在安全的通信信道。`PEAP` 通过 `TLS` 隧道作为协议的一部分提供这种保护。`PEAP` 被许多供应商广泛支持用于无线网络。\n\
  \n### LEAP\n\n思科设计了一种名为轻量扩展身份验证协议（`LEAP`）的专用 `EAP`；然而，它正在逐渐被 `PEAP` 或 `EAP-TLS`\
  \ 等新协议取代。由于容易受到离线密码破解，且已有可以主动破解 `LEAP` 安全性的工具，该协议已被弃用，转而采用更强的 `EAP` 方法。\n\n### CCMP\n\
  \n正如之前讨论 `WPA2` 时提到的，`CCMP` 代表计数模式密码分组链消息认证码协议（或 CBC-MAC 计数模式协议）。`CCMP` 是一种用于无线环境的数据封装加密机制。`CCMP`\
  \ 实际上是使用 `AES` 算法提供消息完整性的模式。与 `WPA` 不同，`CCMP` 需要新硬件来执行 `AES` 加密。\n\n### 无线操作\n\n\
  无线安全由之前讨论过的协议和操作特性管理。多种操作要素都可以提高无线网络的安全性。`MAC` 过滤、天线类型、放置和功率水平，以及根据现场调查结果布局都可以增强安全性。\n\
  \n### MAC 过滤器\n\n`MAC` 过滤是基于批准的媒体访问控制（`MAC`）地址列表选择性通过数据包。这种方法应用于交换机上，用于提供机器认证的手段。在有线网络中，它受到线路的保护，使得截获信号以确定其\
  \ `MAC` 地址变得困难。在无线网络中，这种机制面临一个问题：攻击者可以看到进出接入点所有流量的 `MAC` 地址，然后就可以伪造允许通过接入点通信的 `MAC`\
  \ 地址。\n\n![image](img/examtip.jpg)\n\n**考试提示** `MAC` 过滤可以应用于无线接入点，但攻击者可以通过观察允许的\
  \ `MAC` 地址并为无线网卡伪造允许的 `MAC` 地址来绕过它。\n\n### 天线放置\n\nWi-Fi 本质上是一种基于无线电的方法，因此使用天线传输和接收信号。天线的实际设计和放置对射频（`RF`）媒介传输流量可用性有显著影响。天线有多种类型，每种都有自己的传输模式和增益因子。高增益天线可以处理较弱的信号，但覆盖有限。宽覆盖全向天线可以覆盖更广泛的区域，但增益水平较低。天线放置的目标是最大化物理区域的覆盖并减少低增益区域。这在有墙壁、电气干扰和其他干扰源的建筑中可能非常复杂，通常需要现场调查来确定合适的放置位置。\n\
  \n![image](img/examtip.jpg)\n\n**考试提示** 由于无线天线可以传输到设施外，天线的调优和放置对安全至关重要。通过功率水平控制调整辐射功率将有助于防止无线信号广播到物理访问控制区域之外。\n\
  \n### 功率水平控制\n\n出于多种原因，硬件可以控制 Wi-Fi 功率。使用的功率越低，干扰的机会越少。但如果功率水平太低，信号强度就会限制范围。接入点可以通过手动或编程控制设置功率水平。对于大多数用户来说，功率水平控制并不有用，保持默认模式是最佳选择。在复杂的企业环境中，通过现场调查和计划的叠加区域，这种信号控制方面可以增加网络的容量和控制。\n\
  \n### 天线类型\n\n标准接入点配备有全向天线。全向天线向所有方向工作，使得设备之间的相对方向不那么重要。全向天线每个天线的覆盖面积最大。弱点出现在墙角和难以到达的区域以及设施的边界，在这些地方需要方向性天线来完成覆盖。图\
  \ 4-2 显示了常见 Wi-Fi 天线的示例：4-2(a) 是常见的家用无线路由器，(b) 是商业室内无线接入点，(c) 是室外方向性天线。室内 `WAPs`\
  \ 可以如所示可见，也可以隐藏在天花板吊上方。\n\n![image](img/f0070-01.jpg)\n\n**图 4-2** 无线接入点天线\n\n由信号强度弱引起的无线网络问题有时可以通过在接入点安装升级的\
  \ Wi-Fi 无线天线来解决。在业务网络中，多个接入点的复杂性通常需要全面的现场调查，以绘制办公楼内外的 Wi-Fi 信号强度地图。然后可以在需要的地方策略性地放置额外的无线接入点以解决死角。对于只需要单个接入点的小企业和家庭，升级天线可能是解决\
  \ Wi-Fi 信号问题的更简单、更具效益的选择。\n\n\n\n\n\n升级天线的两种常见形式是八角天线（Yagi antenna）和面板天线。如图 4-2(c)\
  \ 所示。八角天线和面板天线本质上都是方向性的，在更有限的范围内扩散 `RF` 能量，增加一个方向的有效范围，同时限制其他方向的范围。面板天线可以提供良好的室内性能，同时防止信号向天线背面泄露。这在站点边缘效果良好，可以限制可能在场外采集到的杂散发射。八角天线的作用更像步枪，将能量沿着波束汇聚。这使得标准功率即可实现更远的通信距离。此外，由于天线本身提供的增益，窃听者也可以从更远的距离捕获信号。\n\
  \n### 强制门户 (Captive Portals)\n\n`Captive portal`是指使用 `HTTP` 客户端处理无线网络身份验证的特定技术。强制门户经常用于公共热点，它会打开网页浏览器并跳转到身份验证页面。这发生在用户被允许接入网络之前。接入点通过拦截所有数据包并返回登录网页来使用这种简单机制。提供身份验证页面的实际\
  \ Web 服务器可以位于网络的隔离区域，在用户成功身份验证之前，阻止其访问互联网。\n\n### 现场勘测 (Site Surveys)\n\n在为复杂的建筑站点开发覆盖地图时，你需要考虑多种因素，特别是墙壁、干扰源和平面图。现场勘测涉及几个步骤：绘制平面图、测试\
  \ `RF` 干扰、测试 `RF` 覆盖，以及通过软件分析材料。软件可以建议接入点的位置。在部署 `APs` 后，会对比站点进行再次勘测，将结果与预测进行对比，观察信号强度和信噪比。图\
  \ 4-3 展示了现场勘测的样子。不同的深浅表示信号强度，显示了哪里接收强，哪里接收弱。现场勘测可确保无线网络的可用性，特别是当连接对用户至关重要时。\n\n\
  ![image](img/f0071-01.jpg)\n\n***\n\n**图 4-3** 现场勘测示例\n\n***\n\n![image](img/examtip.jpg)\n\
  \n**考试提示** 无线网络的功能取决于无线信号。进行现场勘测并选择合适的天线类型和位置，是确保站点良好覆盖的重要步骤，包括被墙壁、干扰信号和回声阻塞的区域。\n\
  \n### VPN（通过开放无线网络）\n\n无线连接通常建立在不应信任通信安全性的环境中，例如机场和公共热点（咖啡馆、图书馆等）。同样，无线网络经常被用于连接未通过\
  \ `SSL` 等安全通道保护的站点。在所有这些情况下，无线网络连接都应被认为是可疑的，并应采取额外的安全措施以实现所需的通信安全级别。\n\n强制门户被广泛用于在允许连接无线网络之前强制用户接受条款和/或支付方式。由于强制门户本质上要求用户在连接网络之前执行特定的行为，它们也被用于网络访问控制\
  \ (`NAC`) 的实现中，强制在连接之前进行 `NAC` 检查。它们还被用于在允许连接之前发布特定消息，例如紧急公告或安全警报。在许多酒店和其他类型的公共\
  \ Wi-Fi 热点中，一旦用户满足强制门户页的要求，他们通常会被重定向到其连接的实体的网页，例如酒店或咖啡馆。\n\n### 本章总结\n\n在本章中，你学习了安全无线网络知识。通过检查无线网络的安全问题，你探索了基于加密的\
  \ `WEP`、`WPA`、`TKIP`、`CCMP` 和 `WPA2` 方法。涵盖了基于身份验证的 `EAP`、`LEAP` 和 `PEAP` 方法，以及 `MAC`\
  \ 过滤和 `SSID` 广播。你了解到天线类型和位置结合现场勘测和功率控制有助于企业级无线部署的设计。最后，涵盖了强制门户和 `VPN`（通过开放无线网络）的使用。\n\
  \n### \n\n为了帮助你进一步准备 CompTIA Security+ 考试并测试你的准备程度，请回答以下问题，然后与章节末尾的答案进行比对。\n\n**1**。\
  \ 在什么情况下禁用 `SSID` 广播最合理？\n\n**A.** 当靠近拥有大型免费 Wi-Fi 设施的机场时\n\n**B.** 当由于不合规客户端机器无法加密\
  \ Wi-Fi 信号时\n\n**C.** 当运行酒店网络并担心来自停车场的访问时\n\n**D.** 当在防火墙之外提供不面向公众的访客无线网络时\n\n**2**。\
  \ 为什么现场勘测对无线安全很重要？\n\n**A.** 更强度的无线信号会增加 Wi-Fi 加密密钥的有效性。\n\n**B.** 最小化发送到建筑物理墙外的信号强度可以减少攻击风险。\n\
  \n**C.** 配置的接入点意味着目标最少。\n\n**D.** Wi-Fi 信号可以被限制。\n\n**3**。 `WPA2` 相比 `WEP` 的主要增强是什么？\n\
  \n**A.** `WPA2` 使用更长的密钥。\n\n**B.** `CCMP`。\n\n**C.** `TKIP`。\n\n**D.** `WPA2` 支持\
  \ `802.1x` 身份验证。\n\n**4**。 为什么 `MAC` 过滤很少使用？\n\n**A.** 它非常繁琐。\n\n**B.** 攻击者可以克隆\
  \ `MAC` 地址。\n\n**C.** `802.1x` 的使用取代了它。\n\n**D.** 以上所有情况。\n\n**5**。 `LEAP` 是什么？\n\
  \n**A.** 使用新加密算法更新 Wi-Fi\n\n**B.** 在 Windows 下提供 `TLS` 身份验证\n\n**C.** 为客户端提供双方身份验证\n\
  \n**D.** 强制设备使用 `WPA`\n\n**6**。 什么时候使用方向性天线？\n\n**A.** 当你需要覆盖整个仓库楼时。\n\n**B.** 当只想覆盖客房时。\n\
  \n**C.** 当允许以更高的功率传输时。\n\n**D.** 当你想与单个客户端通信时。\n\n**7**。 `TKIP` 如何提供安全优势？\n\n**A.**\
  \ 在短时间内使用单个 `WEP` 密钥强制安全。\n\n**B.** 在客户端和接入点之间强制 `TLS` 身份验证。\n\n**C.** 基于共享密钥提供会话密钥。\n\
  \n**D.** 以上所有情况。\n\n**8**。 当无线网络允许你连接但仅允许访问单个网站时，它被称为 \\_\\_\\_\\_\\_\\_\\_\\_\\\
  _\\_\\_\\_\\_\\。\n\n**A.** 访客无线网络\n\n**B.** `802.1x`\n\n**C.** 通过开放无线网络的 `VPN`\n\
  \n**D.** 强制门户\n\n**9.** 通过开放无线网络的 `VPN` 威胁是什么？\n\n**A.** 黑客可以嗅探所有 `VPN` 数据包并对其解密。\n\
  \n\n\n\n\n**B.** 用户在启动 VPN 之前必须连接到开放的无线网络，这为攻击者留下了潜在的时间窗口来入侵机器。\n\n**C.** 证书可能被伪造，从而允许访问服务器。\n\
  \n**D.** 以上所有。\n\n#### [10]](#ch4.html#ch4q-10). `WPA2` 在哪两种模式下运行？它们之间的主要区别是什么？\n\
  \n**A.** 公共和工作模式；加密\n**B.** 企业版和个人版；身份验证\n**C.** 企业版和游客版；完整性\n**D.** `AES` 和 `WEP`；密钥长度\n\
  \n对于问题 11–14，请使用以下场景：你被聘用于一家小型地区酒店连锁的 IT 部门，该连锁计划为所有客人提供无线访问，并创建一个所有员工都可以使用的系统。酒店连锁需要该系统安全性最大化，同时为所有员工提供良好的可用性。客人将使用各种\
  \ Wi-Fi 设备，而员工将结合大堂的台式机和移动平板电脑来自动更新房间状态。\n\n#### [11]](#ch4.html#ch4q-11). 哪些安全实践对于客人使用的网络最合适？（选择所有项）\n\
  \n**A.** MAC 地址过滤\n**B.** `WPA2`\n**C.** 强制性门户 (Captive portal)\n**D.** `LEAP`\n\
  **E.** 场地调查\n**F.** 禁用 SSID 广播\n\n#### [12]](#ch4.html#ch4q-12). 哪些安全实践对于员工使用的网络最合适？（选择所有项）\n\
  \n**A.** MAC 地址过滤\n**B.** `WPA2`\n**C.** 强制性门户\n**D.** `LEAP`\n**E.** 场地调查\n**F.**\
  \ 禁用 SSID 广播\n\n#### [13]](#ch4.html#ch4q-13) 你的老板要求你重新配置网络，以支持“自备设备” (BYOD) 计划。公司网络上的哪种安全措施将不兼容？\n\
  \n**A.** `WPA2`\n**B.** 强制性门户\n**C.** 场地调查\n**D.** MAC 地址过滤\n\n#### [14]](#ch4.html#ch4q-14).\
  \ 客人能够连接到无线网络，但无法访问任何网页。这最可能是 `__________` 失败。\n\n**A.** 接入点功率控制\n**B.** 强制性门户\n\
  **C.** 天线放置\n**D.** 容量规划\n\n#### [15]](#ch4.html#ch4q-15). 将相关术语匹配，使用一对一映射：\n\n\
  **A.** `802.11i`\n**B.** 强制性门户\n**C.** `TLS`\n**D.** `WPS`\n1. `EAP`\n2. `LEAP`\n\
  3. `CCMP`\n4. `PEAP`\n5. `HTTP`\n\n### 答案\n\n**[1]](#ch4.html#ch4q1). **D.** 禁用\
  \ SSID 广播不是一种有效的安全措施，因此它只应该在防火墙外的客人系统上使用。\n\n**[2]](#ch4.html#ch4q2). **B.** 减少传输到建筑以外区域的信号可以帮助防止对无线系统的简单的“路过攻击”（drive-by\
  \ attacks）。\n\n**[3]](#ch4.html#ch4q3). **B.** `AES` 和 `CCMP` 消除了 `RC4` 算法中错误的 `WEP`\
  \ 实现并提供了临时密钥。\n\n**[4]](#ch4.html#ch4q4). **D.** 以上所有。A. MAC 地址过滤实施起来繁琐，因为大多数 MAC\
  \ 地址都必须手动添加到接入点系统中。B. 通过使用混杂模式下的网卡，攻击者可以识别授权的 MAC 地址并将其克隆到自己的 `NIC` 中。C. `802.1x`\
  \ 可以强制网络用户在允许访问网络之前进行身份验证，从而减少对 MAC 过滤的需求。\n\n**[5]](#ch4.html#ch4q5). **C.** `LEAP`\
  \ 是思科的一种专用协议，用于提供身份验证和动态 `WEP` 密钥。\n\n**[6]](#ch4.html#ch4q6). **D.** 方向天线有利于将信号束狭窄地聚焦到单个远程点。\n\
  \n**[7]](#ch4.html#ch4q7) **A.** `TKIP` 在生成新的 `WE` 密钥之前强制短期使用 `WEP` 密钥。\n\n**[8]](#ch4.html#ch4q8).\
  \ **D.** 场地调查将允许流量直达用户处。\n\n**[9]](#ch4.html#ch4q9). **B.** `WPA2` 可以在企业模式或个人模式下运行。\n\
  \n**[10]](#ch4.html#ch4q10). **B.** 企业模式需要 `802.11i` 进行身份验证。\n\n**[11]](#ch4.html#ch4q11).\
  \ **C** 和 **D.** 使用强制性门户进行身份验证。\n\n**[12]](#ch4.html#ch4q12). **B**, **E**, 和 **F.**\
  \ 应该使用 `WPA2`。\n\n**[13]](#ch4.html#ch4q13). **D.** MAC 地址过滤将不起作用。\n\n**[14]](#ch4.html#ch4q14).\
  \ **B.** 这最可能是强制性门户失败了。\n\n**[15]](#ch4.html#ch4q15). **A. 3.** `802.11i` 可以利用 `CCMP`。\n\
  **B. 5.** `HTTP` 上的强制性门户。\n**C. 4.** `TLS` 可以利用 `PEAP`。\n**D. 1.** `WPS` 可以利用 `EAP`。\n\
  \n\n\n\n风险管理是从企业层级到个人项目管理的不可或缺的要素。风险管理涵盖了为了降低复杂性、增加客观性以及识别重要决策因素而采取的所有行动。关于风险管理的复杂性以及是否值得投入努力过去一直存在，未来也将继续。然而，企业必须承担风险以保持其竞争优势，因此风险管理必须作为管理任何业务、计划或项目的一部分。\n\
  \n![image](img/note.jpg)\n\n**注意** 风险管理是关于管理未来的风险，而不是解释过去的风险。\n\n风险管理既是一项技能也是一项任务，由所有管理者执行，无论是刻意的还是直觉的。它可以是简单也可以复杂的，取决于项目或业务的大小以及活动中固有的风险程度。每个级别的经理都必须学会管理风险。所需的技能是可以学习的。\n\
  \n![image](img/examtip.jpg)\n\n**考试贴士** 本章包含几个项目列表。这些列表旨在便于在准备 CompTIA Security+\
  \ 考试时进行记忆。\n\n### 理解风险管理的关键术语\n\n要成功管理风险，你需要理解许多关键术语。其中一些术语在这里被定义，因为它们在整个章节中都会反复使用。此列表在某种程度上根据本章的结构进行了排序。更全面的定义和其他相关术语在书末的术表中按字母顺序列出。\n\
  \n![image](img/examtip.jpg)\n\n**考试贴士** 这些术语非常重要，你应该在参加 CompTIA Security+ 考试之前完全记忆它们的含义。\n\
  \n**风险 (Risk)**：遭受损害或损失的可能性。\n\n**风险管理**：识别威胁、漏洞及其潜在影响的决策过程，确定减轻此类事件的成本，并决定哪些行动对于控制这些风险是具有成本效益的。\n\
  \n**风险评估（或风险分析）**：分析环境以识别风险（威胁和漏洞）以及减轻措施的过程，以确定（通过定量或定性方法）影响项目、计划或业务的事件的影响。\n\n\
  **资产 (Asset)**：组织开展业务所需的资源或信息。\n\n**减轻 (Mitigate)**：为减少威胁发生的概率而采取的行动。\n\n### 控制类型\n\
  \n安全控制是用于降低与安全故障相关的风险的要素。可以使用多种工具；`NIST SP 800-53` 列出了数百种可用在系统中以改进安全态势的控制措施。\n\n\
  ## 技术控制\n\n技术控制是通过系统中的技术干预运行的控制措施。示例包括用户身份验证（密码）、逻辑访问控制、防病毒/恶意软件软件、防火墙、入侵检测和防御系统等。\n\
  \n#### 管理控制\n\n管理控制是运行在组织管理上的控制措施。它们包括策略、法规和法律等控制措施。计划和风险评估等管理活动是常用的示例。\n\n####\
  \ 控制类型\n\n控制可以根据其执行的行动类型进行分类。控制分为三类：\n\n* 技术控制\n* 管理控制（或行政管理控制）\n* 运营控制（或物理控制）\n\
  \n对于其中的每一类，都有四种类型的控制：\n\n* 预防性（威慑性）\n* 检测性\n* 纠正性（恢复性）\n* 补偿性\n\n#### 运营控制\n\n运营控制是通过组织的运行生效，通常通过人员采取的行动来实现。示例包括运营流程，如事件响应、配置管理、个人安全以及培训和意识教育。\n\
  \n### 假报 (False Positives)\n\n指示实际不存在的情况的测试结果被称为假报。如果安全系统检测到攻击事件，但实际上并没有攻击，这就是假报结果。假报错误的另一个名称是虚假报警。假报会增加工作量，迫使分析师检查比需要更多的数据以寻找真实的事件。\n\
  \n### 漏报 (False Negatives)\n\n系统未能检测到正在发生的情况是漏报的示例。例如，`IDS` 未检测到实际攻击就是漏报。漏报的危害可能与假报一样大，在某些情况下破坏性更大。如果安全系统未能按预期运行，由于事件未被检测到可能会导致严重后果。\n\
  \n### 策略在降低风险中的重要性\n\n安全计划（组织应对安全问题方法包含的所有技术、流程、程序、指标、培训和人员的总和）应基于组织记录的安全策略、程序、标准和指南，这些文件规定了用户和管理员应该做什么来维护系统和网络的安全。这些文档共同提供了确定如何在组织内实施安全措施所需的指导。鉴于这些指导，可以据此进行规划所需的特定技术和安全机制。\n\
  \n`策略 (Policies)` 是关于组织想要实现的目标的高层、广泛的陈述。\n\n标准 (Standards)` 是关于策略实施的强制性要素。某些标准可以由外部驱动。例如，银行和金融机构的政府法规要求采取某些安全措施。其他标准可能由组织制定以满足其自身的安全目标。`指南\
  \ (Guidelines)` 是与策略相关的建议。在这种情况下的关键术语是`建议`——指南不是强制性的。`程序 (Procedures)` 是关于如何在组织内实施策略的逐步操作说明。\n\
  \n正如网络本身在不断变化一样，策略、标准、指南和程序应该包含在活文档中，并定期进行评估，在必要时进行更改。对网络的持续监控和对相关文档的定期审查是运营模型过程的一部分。该运营过程由四个基本步骤组成：\n\
  \n1. 规划（调整）安全。\n2. 实施计划。\n3. 监控实施情况。\n4. 评估有效性。\n\n在第一步中，你开发将要实施的策略、程序和指南，并设计保护网络的安全组件。一旦完成设计和开发，你就可以实施计划。接下来，通过监控来确保硬件、软件以及策略、程序和指南都能有效保障系统安全。最后，你评估所采取的安全措施的有效性。评估步骤可以包括对你的系统进行`漏洞评估`（尝试识别并优先考虑系统或网络中的漏洞）和`渗透测试`（通过模拟恶意人员攻击来检查系统安全的方法），以确保安全足够。在评估了安全态势后，你再次从第一步开始，这次是调整你现有的安全机制，然后继续这一循环过程。\n\
  \n#### 隐私政策 (Privacy Policy)\n\n\n\n\n\n客户对他们提供个人信息的组织付有极大的信任。这些客户期望他们的信息得到安全保护，以确保未经授权的个人无法访问，并确保授权用户不会以非预期的方式使用这些信息。组织应该有一份\
  \ `privacy policy`（隐私政策），解释它们在保护所获取的个人数据时将遵循哪些指导原则。在许多地方，客户有权期望其信息保持保密，违反这种信任的组织可能会发现自己陷入了诉讼。在某些行业（如医疗保健），联邦法规已经建立，这些法规对私密信息规定了严格的安全控制。\n\
  \n大多数组织的通用做法是制定一项政策，明确描述向组织提供的信息将如何被使用（例如，不会将其出售给其他组织）。监察机构会监控组织对个人信息的使用，企业可以订阅某些服务，由消费者为该组织背书，声明公司已同意保护并保密其提供的任何信息。随后，该组织将获得许可在其网站上显示印章或认证，客户可以在那里看到。滥用其承诺保护的信息的组织将面临来自监察机构的惩罚。\n\
  \n今天日益重要的一类特殊私密信息是个人身份识别信息 (`PII`)。这类信息包括任何可用于唯一识别个人的数据。这包括个人的姓名、地址、驾执照号码和其他细节。随着互联网电子商务的激增，这些信息被广泛使用，其保护变得越来越重要。你不需要远看就能在媒体上找到数据泄露的报告，这些泄露导致信息丢失，并引发身份盗窃等问题。对员工和客户收集\
  \ `PII` 的组织必须确保采取所有必要措施保护数据免受泄露。\n\n## Acceptable Use\n\n可接受使用政策 (`AUP`) 概述了组织认为的资源（如计算机系统、电子邮件、互联网和网络）的适当使用方式。组织应该关注任何对公司没有利益的组织资产个人用途。\n\
  \n该政策的目标是在确保员工生产力的同时，限制因不当使用组织资产而导致的潜在组织责任。政策应清晰地界定哪些活动是不允许的。`AUP` 应涵盖诸如使用资源进行个人业务、硬件或软件的安装、对系统和网络的远程访问、对公司所有软件的复制，以及用户保护公司资产（包括数据、软件和硬件）的责任。还应该包含关于忽略任何政策可能面临的惩罚（如解雇）的声明。\n\
  \n员工对组织计算机系统和网络的适当使用与组织的适当使用相关。这些问题中最重要的一个问题是，组织是否认为监控员工对系统和网络的使用是适当的。如果认为监控是适当的，组织应该在登录时显示的横幅中包含此类此类声明。这会反复警告员工以及可能的入侵者，他们的行为正受到监控，且对系统的任何滥用都将不被容忍。如果组织需要在民事或刑事案件中使用监控期间收集的任何信息，如果组织能够指出其反复显示的声明（即使用系统意味着同意监控），那么关于员工是否具有隐私预期、或者组织进行监控是否合法的问题就会变得简单。在进行任何监控之前或在创建警告消息的实际措辞之前，应咨询组织的法律顾问，以确定处理此问题的适当方法。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**EXAM TIP** 确保你理解可接受使用政策概述了计算机系统用户什么被认为是可接受的行为。该政策通常与组织的互联网使用政策相辅相成。\n\
  \n## Security Policy\n\n由于政策的高层次性质，`security policy` 是由高级管理层制定的一个高层次声明，概述了安全对组织的意义以及组织的安全目标。主安全策略随后可以分解为涵盖特定主题的其他策略。诸如“本组织在处理客户信息时将遵循最小权限原则”之类的声明就是安全策略的示例。安全策略还可以描述从组织的角度来看如何处理安全（例如描述由哪个办公室以及公司高管或经理监督组织的安全计划）。\n\
  \n除了与访问控制相关的策略外，组织的安全策略还包括后续章节中描述的具体策略。所有政策都应定期审查并根据需要进行更新。通常，政策的更新频率应低于实施这些程序的频率，因为高层次的目标不会像其实施的环境那样频繁变化。所有政策都应由组织的法律顾问审查，并概述一个描述组织将如何确保员工了解这些政策的计划。通过引用制定政策的权威（无论该政策是来自\
  \ CEO 还是部门级政策）也可以加强政策的效力，并引用适用于特定策略和环境的任何法律或法规。\n\n## Mandatory Vacations\n\n多年来，组织一直在为员工提供休假。然而，直到最近，很少有组织在员工不愿的情况下强制他们休息这段时间。某些员工被允许“使用或失去”他们的休假时间，如果他们没有用完所有时间，就会失去至少一部分。关于休假的益处可以有很多论点，但更重要的是，从安全的角度来看，从不休假的员工可能是潜在的活动指标。从不休假的员工可能参与了欺诈或挪用资金等活动，并可能担心如果他们去休假，组织就会发现他们的非法活动。因此，通过强制休假政策要求员工使用休假时间，可以作为一种安全保护机制。将强制休假作为检测欺诈的工具需要另一个人也对休假员工的职能进行培训。\n\
  \n## Job Rotation\n\n\n\n\n\n另一种提供多重益处的政策是`job rotation`（轮岗）。轮岗可以为个人提供更好的视角，了解组织的各个部分如何增强（或阻碍）业务。由于人们在工作中通常将安全视为次要考虑的因素，让人员轮换到安全岗位可以使其对组织的安全问题产生更广泛的理解。另一个次要益处是，它还消除了对个人安全专业知识的依赖。如果所有安全任务都由一名员工负责，那么当该人员离开组织时，安全工作将受到影响。此外，如果只有一个人了解安全领域，而这个人又产生了不满情绪并决定伤害组织，那么从其攻击中恢复可能会非常困难。\n\
  \n### 职责分工\n\n职责分工是许多组织采用的一项原则，以确保没有个人个人能够独立执行交易的能力。这意味着对任何一个个人的信任度降低了，而且任何个人对组织造成灾难性损害的能力也随之降低。例如，某个组织中，一个人有权订购设备，但另一个人负责付款。想要为了个人利益进行未经授权购买的个人，必须说服另一个人参与该交易。\n\
  \n将职责分工作为一种安全工具是一种良好的做法，但也有可能过头，将交易拆分为过多的碎片或要求过多的监督。这会导致效率低下，实际上可能更不安全，因为个人可能由于知道其他人也会审查这些交易，他们不会详尽地审查交易。这种诱惑是会促成某事的完成，并假设别人会检查它或者别人已经检查过了。\n\
  \n![image](img/examtip.jpg)\n\n**考试贴士** 职责分工原则的另一个方面是，它将责任分散到整个组织中，使得没有一个个人会成为掌握所有“王国钥匙”或拥有如何让一切运行的独特知识的不可或缺的人。如果分配了足够的任务，为每项任务指定一个主负责人和一个备份人员，将确保任何一个个人的流失都不会对组织产生灾难性影响。\n\
  \n### 最小权限原则\n\n另外两个常见的安全原则是`need to know`（知情需要）和`least privilege`（最小权限原则）。这里的指导因素是组织中的每个个人仅获得执行所分配工作任务所需的绝对最少的信息和权限。为了访问任何信息，个人必须具有正当的知情需求。此外，员工仅被授予执行工作所需的极少权限。\n\
  \n应该制定一项将这两个原则阐明为组织指导哲学的政策。政策还应该说明组织中谁可以授予信息访问权限或可能为员工分配权限。\n\n### 定性风险评估\n\n定性风险评估是主观确定影响项目、程序或业务的事件影响的过程。定性风险评估通常涉及利用专家判断、经验或小组共识来完成评估。要进行定性风险评估，你必须将威胁的影响与发生的概率进行比较。例如，如果一个威胁的影响很大且发生的概率很高，则风险敞口很高，可能需要采取某些行动来减少这种威胁（参见`Figure\
  \ 5-1](#ch5.html#ch5fig1)`中的深色方框）。相反，如果影响低且概率低，则风险敞口较低，可能不需要采取任何行动来减少这种威胁（参见`Figure\
  \ 5-1](#ch5.html#ch5fig1)`中的白色方框）。\n\n![image](img/f009-01.jpg)\n\n**考试贴士** 职责分工原则的另一个方面是，它将责任分散到整个组织中，使得没有一个个人会成为掌握所有“王国钥匙”或拥有如何让一切运行的独特知识的不可或缺的人。如果分配了足够的任务，为每项任务指定一个主负责人和一个备份人员，将确保任何一个个人的流失都不会对组织产生灾难性影响。\n\
  \n![image](img/f009-02.jpg)\n\n**考试贴士** 职责分工原则的另一个方面是，它将责任分散到整个组织中，使得没有一个个人会成为掌握所有“王国钥匙”或拥有如何让一切运行的独特知识的不可或缺的人。如果分配了足够的任务，为每项任务指定一个主负责人和一个备份人员，将确保任何一个个人的流失都不会对组织产生灾难性影响。\n\
  \n\n\n\n\n使定性评估变得更加客观，只需为图 5-1 到图 5-4 所示的任一表格分配数值即可。例如，图 5-4 中列出的影响可以从高到低进行优先级排序，然后进行加权，如表\
  \ 5-1 所示，其中业务影响权重最高，而修复难度权重最低。\n\n![image](img/t0088-01.jpg)\n\n**表 5-1** 为潜在影响添加权重和定义\n\
  \n接下来，可以分配数值来反映对每个风险的评估情况。因此，通过为代表评估结果的每种颜色分配值，可以使图 5-4 显示了使用红、黄、绿进行评估时可以分配的值。\n\
  \n![image](img/t0089-01.jpg)\n\n**表 5-2** 为评估添加数值\n\n最后一步是计算每个风险区域（图 5-4 中的每一行）的总体风险值，方法是将表\
  \ 5-1 所示的权重乘以表 5-2 中的评估值，并对乘积求和：\n\n`Risk = *W*[1] × *V*[1] + *W*[2] × *V*[2]+…*W*[4]\
  \ × *V*[4]`\n\n图 5-4 列出的每个风险区域的风险计算和最终风险值已整合到图 5-5 中。然后可以根据计算出的风险值对评估区域从从到低进行排序，以帮助管理层关注潜在影响最大的风险区域。\n\
  \n![image](img/f0089-01.jpg)\n\n* *\n\n**图 5-5** 结果的最终定量评估\n\n理解任何模型底层的关键假设是重要的，即使在给定相同输入数据的情况下，不同的模型也会产生不同的结果。尽管在改进和完善各种风险分析模型方面投入了大量的研发，但专家判断和经验仍然被认为是任何风险评估过程中不可或缺的一部分。模型永远无法取代判断和经验，但它们可以显著增强决策过程。\n\
  \n### 风险计算\n\n更复杂的模型允许基于统计和数学模型进行分析。常用方法是计算年化损失预期（ALE）。计算 ALE 为影响产生了货币价值。这种计算从计算单次损失预期（SLE）开始。\n\
  \n#### SLE\n\n单次损失预期使用以下公式计算：\n\n`SLE = asset value × exposure factor`\n\n影响因子是资产损失规模的衡量。\n\
  \n例如，为了计算影响因子，假设该资产的价值。\n\n#### ALE\n\n年化损失预期产生了影响的货币价值。这种计算通常表示为：\n\n`ALE = SLE\
  \ × ARO`\n\n#### ARO\n\n年化发生率是预计一年内威胁发生的频率。\n\n#### MTTR\n\n平均修复时间是指系统故障后恢复系统所需的平均时间。\n\
  \n#### MTBF\n\n平均故障间隔时间是衡量可靠性的常用指标，是系统故障之间的平均时间。\n\n`MTBF = MTTF + MTTR`\n\n####\
  \ MTTF\n\n平均失效时间是 MTBF 的变体，用于系统被更换而非修复的情况。\n\n### 定量与定性\n\n业界公认的是，进行纯定量的风险管理是不可能的。通常，风险管理包含定性和定量两个元素，需要分析也需要判断。与定量评估相比，完成纯定性的风险管理是可能的。\n\
  \n\n\n\n\n![image](img/examtip.jpg)\n\n**考试提示** 数量风险管理涉及为风险分配特定的绝对值，而定性风险管理则是通过相对值实现的。\n\
  \n### 漏洞 (Vulnerabilities)\n\n漏洞是资产的特征，可以被威胁利用造成危害。例如，如果你没有安装补丁来修复网站上的跨站脚本（`XSS`）错误，那么你的系统就存在安全漏洞。并不是所有的错误或缺陷都是漏洞。要将一个错误或缺陷归类为漏洞，它必须是可利用的，这意味着攻击者能够利用该漏洞产生预期的结果。漏洞的发生需要三个要素：\n\
  \n* 系统必须存在缺陷。\n* 缺陷必须能被攻击者访问。\n* 攻击者必须具备利用该缺陷的能力。\n\n漏洞存在于多个层次，由多种原因引起。从设计错误、编码错误到复杂系统中无意（且未经测试）的组合，漏洞有许多形式。漏洞可以存在于软件、硬件和程序中。无论是在底层系统、旨在保护系统的安全控制，还是在系统运行过程中采用的程序中，结果都是一样的：漏洞代表了一个可以被利用的弱点，增加了与系统相关的风险水平。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 漏洞可以被修复、消除和缓解。它们是任何系统的一部分，代表了可能被利用的弱点。\n\
  \n### 威胁向量 (Threat Vectors)\n\n威胁是指任何可能对资产造成危害的状况或事件。例如，恶意的黑客可能会选择使用现成的黑客工具来入侵你的系统。威胁可以分类分组，“威胁向量”一词描述了这些组包含的元素。威胁向量是攻击者用于攻击目标时使用的路径或工具。安全专业人员需要理解的威胁向量范围广泛：\n\
  \n* `Web`（虚假网站、会话劫持、恶意软件、水坑洞攻击）\n* 无不安全的无线热点\n* 移动设备（`iOS`/`Android`）\n* `USB`（可移动式）介质\n\
  * `E-mail`（链接、附件、恶意软件）\n* `社会工程学`（欺骗、骗局、诈骗和欺诈）\n\n此列表仅为威胁的示例。从防御的角度来看，重要的是不要固着于特定的威胁，而是要关注威胁向量。如果用户访问了带有恶意代码的网站，那么代码的性质虽然在技术角度上很重要，但并不是首要考虑的问题。首要问题是恶意网站，因为这就是威胁向量。\n\
  \n### 概率/威胁可能性 (Probability/Threat Likelihood)\n\n事件的概率或可能性是衡量其预期发生频率的度量。从使用“频繁”、“偶尔”和“罕见”等术语的定性评估，到定量衡量的\
  \ `ARO`，其目的是允许根据事件发生的频率进行缩放。要准确地确定安全事件的特定概率是一项几乎不可能的任务。在使用概率和可能性时，重要的是它与确定相对风险之间的关系。正如保险公司无法预判你何时会发生事故一样，也没有能预测安全事件何时会发生。可以确定的是，在一段时间内（例如明年），将大量用户点击电子邮件中的恶意链接。不同类型攻击的威胁可能性会随着时间的推移而变化。几年前，网页破坏曾风靡；今天，鱼叉式网络钓鱼更加流行。\n\
  \n### 风险规避、转移、接受、缓解、威慑 (Risk Avoidance, Transference, Acceptance, Mitigation, Deterrence)\n\
  \n风险是绝对的——它们无法被移除或消除。可以采取行动来改变风险对系统造成的影响，但无论采取什么缓解风险的行动，风险本身并不会改变。高风险始终是高风险。然而，可以采取行动来减少该风险的影响。可以使用有限的策略来管理风险。风险可以被规避、转移、接受或缓解。规避风险可以通过多种方式实现。不部署增加风险的模块是规避风险的一种方式。这减少了环境风险。当发生超出接受风险范围的操作时，可以应用第二套规则。管理风险的另一种方法是转移。风险的常用方法是购买保险。保险允许风险转移给第三方，从而降低个人成本。\n\
  \n风险也可以通过应用减少影响的控制来缓解。此类控制可以提醒操作人员，从而通过干预降低暴露水平。这减少了与操作相关的风险。除了缓解风险或转移风险外，经理也可以接受风险，尽管存在风险的成本及其相关概率。例如，经理可能会选择允许程序员对生产系统进行“紧急”更改（这违反了职责分离原则），因为系统在特定段时间内不能宕机。经理接受程序员可能做出未经授权更改的风险大于该系统的高可用性需求。\n\
  \n理解风险无法被完全消除。实施控制后剩余的风险被称为`残留风险`。在这一步中，你进一步评估`残留风险`，以识别何时需要额外的控制来进一步降低风险。这让我们回到我们在章节引言中的陈述：风险管理过程是迭代的。\n\
  \n### 云计算 (The Cloud)\n\n`云计算`是一个用于描述通过网络提供的计算服务的常用术语。这些计算服务是通过 IP 协议提供的计算、存储、应用程序和服务。云计算的一个特征是对终端用户透明的。这改进了这种服务提供形式的易用性。云计算为用户提供了许多好处：性能、扩展性、灵活性、安全性和可靠性的提高。这些改进是与云服务实施相关的特定属性的直接结果。云计算的承诺是提高效用性，并以`平台即服务`、`软件即服务`和`基础设施即服务`的概念进行营销。云风险风险的挑战在于预先确定谁承担什么种的安全责任——云提供商、服务提供商还是用户？\n\
  \n### 与云计算和虚拟化相关的风险\n\n\n\n\n\n从风险的角度检查云端或虚拟计算环境等复杂系统时，始终需要观察几个基本考虑因素。首先，系统是处于云端还是虚拟化，这一事实并不会改变风险运作的方式。风险无处不在，将系统迁移到新环境也不会改变存在风险这一事实。其次，复杂性会增加风险暴露。云和/或虚拟化的引入简单地通过增加系统的复杂性来增加风险。\n\
  \n虚拟化和云环境都与特定的风险相关。在不属于数据所有者直接控制的环境中进行数据处理和计算，会同时增加复杂性和风险程度。随着对环境直接控制的丧失，机密性、完整性和可用性方面的潜在问题随之增加。虚拟化层和云层还提供了新的攻击途径。当数据由远程方处理（如云计算所示）时，安全是一项特别的挑战。具体的挑战在于如何允许使用数据。通过在数据离开企业之前妥善使用加密技术，仍然可以安全地进行外部存储。与机密性、完整性和可用相关的要求仍然是数据所有者的责任，必须采取措施来确保满足这些要求。另一层保护是通过与云服务供应商签署服务水平协议（`SLAs`），尽管这些协议通常在数据丢失时提供补救。\n\
  \n### 虚拟化\n\n虚拟化是创建虚拟系统而非实际硬件和软件。硬件与软件的分离使得企业具有灵活性。在实际硬件之上，虚拟化层允许将完整的系统（包括计算机和网络设备）创建为虚拟机。这使得改进成为可能。尽管存在可能允许一个虚拟环境中的进程访问主机的漏洞，但这些漏洞非常罕见且极难利用。必须解决一种新形式的漏洞——复制整个系统的能力，因为这可能导致财产损失。虚拟化系统应该像非虚拟化系统一样进行更新/补丁。虚拟系统仍然需要安全服务，以防范恶意软件和普通系统面临的相同威胁。\n\
  \n### 恢复时间目标和恢复点目标\n\n`恢复时间目标 (RTO)` 术语用于描述事故发生后恢复运营的目标时间。这是由业务根据企业定义的一段时间。较短的 `RTO`\
  \ 会导致更高的成本，因为它需要更多的协调和资源。该术语通常用于业务连续性和灾难恢复操作。\n\n`恢复点目标 (RPO)` 是一个与 `RTO` 完全不同的概念，它代表可接受损失的最大时间段。`RPO`\
  \ 定义了防止发生不可接受的数据丢失水平所需的备份操作频率。建立 `RPO` 的简单示例是回答以下问题：你能承受丢失多少数据？可以容忍多大程度的重新？\n\n\
  `RTO` 和 `RPO` 似乎有关，但实际上衡量的是完全不同的东西。`RTO` 的目的是定义业务连续性的需求，而 `RPO` 处理的是备份频率。存在 `RTO`\
  \ 为 1 天而 `RPO` 为 1 小时，或者 `RTO` 为 1 小时而 `RPO` 为 1 天的情况。决定因素是业务需求。\n\n![image](img/examtip.jpg)\n\
  \n**考试贴士**：尽管恢复时间目标和恢复点目标看起来相同或相似，但它们非常不同。`RTO` 的目的是定义业务连续性的需求，而 `RPO` 处理的是备份频率。\n\
  \n### 章节复\n\n在本章中，你熟悉了风险管理的原则。章节从定义与风险管理相关的关键术语开始。然后介绍了三类安全控制：管理类、技术类和操作类。接下来，讨论了假正例和假阴性的概念以及它们如何与安全系统相关。\n\
  \n你了解到安全策略对风险可能产生直接影响，并发现了策略的作用，包括安全策略、隐私策略、可接受使用策略、与人力资源相关的策略（如职位轮换和强制休假）、职责分离和最小特权策略。然后，你检查了定性和定量风险管理方法论，包括对它们的比较。你学习了如何使用\
  \ `ALE`、`SLE` 和 `ARO` 计算风险，并接触了 `MTTR`、`MTBF` 和 `MTTF` 的概念。可用性被作为 `MTTF` 和 `MTTR`\
  \ 的函数提出。该领域以对恢复时间目标、恢复点目标及其之间区别的讨论结束。\n\n章节接下来介绍了允许利用的漏洞特征，包括概率和威胁可能性的概念。还介绍了将威胁向量作为攻击者攻击系统的手段的概念。章节以风险管理的四种主要策略（回避、转移、缓解和接受）结束，并对虚拟化和云计算领域风险的当前趋势进行了讨论。\n\
  \n### 练习\n\n为了帮助你进一步准备 CompTIA Security+ 考试，并测试你的准备程度，请回答以下问题，然后与章节末尾的正确答案进行比对。\n\
  \n1. 以下哪项是一类控制？\nA. 预防性\nB. 管理类\nC. 缓解\nD. 影响\n\n2. 以下哪项是一种控制类型？\nA. 操作类\nB. 威胁\n\
  C. 风险\nD. 探测性\n\n3. 以下哪项是职责分离的示例？\nA. 软件开发者不应访问生产数据和源代码。\nB. 软件开发、测试、质量保证和生产可以分配相同的个人。\n\
  C. 创建、安装和管理程序的功能可以分配相同的个人。\nD. 软件开发者和测试人员应该访问“现场”生产数据。\n\n4. 以下哪项正确定义了最小特权原则？\n\
  A. 通过向不同个人分配职责来防止或检测错误和异常的控制。\nB. 组织内在不同职位之间轮换的过程。\nC. 为用户提供执行所需功能的最少权限和特权。\n\n\n\
  \n\n\nD. 依赖于令人困惑且据称不为人知的保护机制的安全控制。\n\n5 下列哪项正确定义了可接受使用策略？\n\nA. 概述了公司允许员工发送的电子邮件内容。\n\
