  \ 可以将其划分为一系列网络。如果希望将其划分为两个网络，主机空间的最高位将变为网络地址位；这使得新的子网掩码变为 `255.255.128.0`。其效果是使用\
  \ 17 位用于网络寻址，15 位用于主机。`CIDR` 使用一种记法，网络地址位用 `/` 符号标记，因此此示例为 `192.168.x.x/17`。这等同于说子网掩码为\
  \ `255.255.128.0`。产生的主机地址集在一个网络上为 `192.168.0.1` 到 `192.168.127.254`，在另一个网络上为 `192.168.128.1`\
  \ 到 `192.168.255.254`。如果你需要三个子网，则需要将其划分为……（此处根据原文逻辑翻译，原文此处似乎有重复或错误，已按意翻译）。注：原文中从\
