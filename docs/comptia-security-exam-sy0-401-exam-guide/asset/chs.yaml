  \ CA 创建的每个证书都是唯一的。CA 使用 MD5 哈希算法创建了摘要值，然后使用其私钥进行签名。颁发证书的实际 CA 是 Root SGC Authority，有效日期指示了该证书的有效期。实际公钥显示在下方窗口中，并以十六进制表示。\n\
  \n![image](img/f0468-01.jpg)\n\n**图 24-7** 数字证书中的字段\n\n\n\n证书的主体（subject）通常是一个个人，但并非必须如此。主体可以是网络设备（路由器、Web\
  \ 服务器、防火墙等）、应用程序、一个部门、一家公司或一个个人。每个主体都有其自身的身份，在启动安全、信任的通信之前，需要向另一个实体对其身份进行验证和证明。如果网络设备使用证书进行身份验证，则该证书可能包含该设备的网络地址。这意味着，如果证书包含网络地址\
  \ `10.0.0.1`，接收方会将此地址与其接收证书的源地址进行比对，以确保没有正在尝试中间人攻击。\n\n## 证书属性\n\n主要使用了四种类型的证书：\n\
  \n- 终端实体证书 (End-entity certificates)\n- CA 证书\n- 交叉认证证书\n- 策略证书\n\n`End-entity certificates`\
  \ 由 `CA` 发给特定的主体，例如 Joyce、会计部门或防火墙，如图图 24-8 所示。终端实体证书是 PKI 实现提供的身份文件。![image](img/f0469-01.jpg)\n\
  \n***\n\n**图 24-8** 终端实体证书和 CA 证书\n\n`CA certificate` 可以是自签名的（在独立或根 `CA` 的情况下），也可以由分级模型中的上级\
  \ `CA` 颁发。在图 24-8 所示的模型中，上级 `CA` 赋予授权，允许从级 `CA` 接收证书请求并自行生成个人证书。当公司需要多个内部 `CAs`，且组织内的不同部门需要拥有自己的\
  \ `CAs` 为其所在区域内的特定终端实体（用户、网络设备和应用程序）提供服务时，这种做法可能是必要的。在这种情况下，每个需要 `CA` 的部门代表都会向信任度更高的\
  \ `CA` 注册并请求一个 `CA certificate`。\n\n`Cross-certification certificates`（或 `cross-certificates`，交叉证书）用于独立的\
  \ `CAs` 之间建立点对点的信任关系。简单来说，它们是一种机制，通过这种机制一个 `CA` 可以颁发证书，允许其用户信任另一个 `CA`。\n\n在用于高安全性应用程序的复杂\
  \ `CAs` 中，需要一种机制为 PKI 客户端提供集中控制的策略信息。这通常通过将策略信息放在 `policy certificate` 中来实现。\n\n\
  ## 证书生命周期\n\n密钥和证书应具有生命周期设置，强制用户在一段时间后重新注册新证书。确定这些生命周期的合理长度是一种权衡：较短的生命周期限制了攻击者破解的能力，但较长的生命周期会降低系统开销。更复杂的\
  \ PKI 实现会执行自动化且通常是透明的密钥更新，以避免旧证书过期时让用户重新注册新证书的时间和成本。\n\n证书生命周期意味着证书和密钥对有一个必须管理的生命周期。证书管理涉及管理和维护这些每个阶段，包括注册、证书和密钥生成、更新和撤销。\n\
  \n## 注册与生成\n\n密钥对（公钥和私钥）可以由应用程序本地生成，并存储在用户工作站的本地密钥库。密钥对也可以由中央密钥生成服务器创建，这需要将密钥安全传输给用户。在中央服务器上创建的密钥对可以存储在用户的工作站或智能卡上，这将提供更大的灵活性移动性。\n\
  \n在大多数现代 PKI 实现中，用户有两个密钥对。一个密钥对通常由中央服务器生成，用于加密和密钥传输。这允许企业 PKI 保留加密密钥对的副本，以备必要时恢复。第二个密钥对是数字签名密钥对，通常由用户生成，以确保她是唯一拥有私钥副本的人。如果怀疑其他人获取了某个人签名私钥的副本，那么不可否认性可能会受到挑战。如果密钥对是在中央服务器上创建的，可能会削弱“该个人是唯一拥有其私钥副本的人”这一论点。如果用户的签名私钥副本存储在其个人持有之外的任何地方，或者存在他人获取用户密钥的可能性，则无法提供真正的不可否认性。\n\
  \n验证某个人确实拥有给定公钥相应私钥的行为被称为 `proof of possession`（所有权证明）。并非所有的公钥/私钥对都能用于数字签名，因此要求个人对消息进行签名并返回以证明其拥有必要的私钥并不总是奏效。如果密钥对用于加密，`RA`\
  \ 可以向个人发送一个挑战值，个人随后可以使用其私钥对该值进行加密并返回给 `RA`。如果 `RA` 能够使用之前提供的公钥解密该值，则 `RA` 就可以确定该个人拥有必要的私钥，并继续完成注册阶段的其余部分。\n\
  \nPKI 管理员通常会配置用户首次生成密钥以及每次更新时必须使用的最小所需密钥大小。在大多数应用程序中，下拉列表显示了供选择的可能算法及可能的密钥大小。密钥大小应提供当前环境所需的安全级别。密钥的生命周期应该足够长，以至于持续更新不会影响生产力，但足够短，以确保密钥不会被成功破解。\n\
  \n### CSR\n\n`certificate signing request (CSR)`（证书签名请求）是向 `CA` 发出的实际请求，包含公钥以及生成证书所需的必要信息。`CSR`\
  \ 包含了通过生成过程绑定到密钥上的所有标识信息。\n\n## 更新\n\n证书本身有其生命周期，这可能与密钥对的生命周期不同。证书的生命周期由插入数字证书的有效日期指定。这些是指示证书有效期期间的开始和结束日期。证书在开始日期之前无法使用，一旦达到结束日期，证书即过期，需要颁发新证书。\n\
  \n更新过程与注册阶段不同，在于 `RA` 假设该个人已经成功完成了一轮注册。如果证书实际上没有被撤销，则原始密钥和证书可以用于更新阶段提供必要的验证信息和身份证明。\n\
  \n证书在更新过程中可能需要或不需要更改；这通常取决于更新的原因。如果证书只是过期，且密钥仍用于相同的用途，则可以生成具有新有效日期的证书。然而，如果密钥对的功能需要扩展或限制，则可能需要向新证书集成新的属性和扩展。这些新功能可能需要从更新证书的个人处收集更多信息，特别是类别发生变化或新密钥用途允许更强大的能力时。\n\
  \n### 撤销\n\n\n\n\n当证书的有效性需要在实际到期日之前终止时，可以对证书进行撤销，这种情况可能由于许多原因：例如，用户可能丢失了存储私钥的笔记本电脑或智能卡；可能发现了不当的软件实现，直接影响了私钥的安全性；用户可能是社会工程攻击的受害者，并在无意中交出了私钥；证书中持有的数据可能不再适用于指定的个人；或者某员工离开了公司，不应再被标识为内部\
  \ PKI 的成员。在最后一种情况下，与用户密钥对绑定的证书将该用户标识为公司员工，管理员希望确保该密钥对以后不再被用于验证该人员与公司的所属关系。撤销证书就能做到这一点。\n\
  \n如果发生了上述任何情况，用户的私钥就已经泄露，或者不应再映射到所有者的身份上。另一个个人可能拥有该用户的私钥，并可以使用它来冒充并作为原始用户进行身份验证。如果冒充者使用该密钥对消息进行数字签名，接收者将通过使用原始用户的公钥验证签名来验证发送者的真实性，而验证将完美地通过——接收者会认为该信息来自正确的发送者，而不是冒充者。然而，如果接收者在验证数字签名之前可以查看已撤销证书列表，他们将知道不要信任列表上的数字签名。由于私钥泄露相关的问题，撤销是永久且最终的——一旦撤销，证书就无法恢复。如果允许这样做且用户撤销了自己的证书，私钥的未经授权持有者可以使用它来恢复证书的有效性。\n\
  \n例如，如果 Joe 偷了 Mike 的笔记本电脑（其中包含 Mike 的私钥等），Joe 可能可以使用它来冒充 Mike。假设 Joe 写了一条消息，用 Mike\
  \ 的私钥对其进行数字签名，并发送给 Stacy。Stacy 定期与 Mike 通信并拥有他的公钥，因此她使用它来验证数字签名。计算结果正确，因此 Stacy\
  \ 确定此消息来自 Mike，但事实并非如此。如果 Stacy 在验证任何证书或数字签名之前可以检查撤销证书列表，她可能就不会成为 Joe 虚假消息的受害者。\n\
  \nCA 通过维护 `证书撤销列表 (CRL)` 来提供这种保护，CRL 是一份已撤销证书序列号列表。`CRL` 还包含一个说明特定证书被撤销原因的声明以及撤销发生的日期。该列表通常包含\
  \ CA 存续期内撤销的所有证书。过期的证书与已撤销的证书不同。如果证书已过期，意味着它到了有效性截止日。\n\nCA 是负责其生成的证书状态的实体；它需要被告知撤销，并且必须将此信息提供给他人。CA\
  \ 负责维护 `CRL` 并将其发布在公开可用的目录中。\n\n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 证书撤销列表是确保证书仍然有效的关键项。CA\
  \ 在公开可用的目录中发布 `CRLs`，以允许在证书使用之前根据列表对证书进行自动检查。\n\n如果 `CRL` 不是最新的了怎么办？它多久多多久更新一次？它是否真的反映了当前*所有*已撤销的证书？列表更新的实际频率取决于\
  \ CA 及其证书实践声明 (`CPS`)。及时更新列表非常重要，这样任何使用列表的人都能获得最新的信息。需要验证和确认新收证书的个人可以请求 `CRL` 文件，或者这些文件也可以定期推送到（发送给）参与\
  \ PKI 的所有用户。这意味着 `CRL` 可以在需要时由单个用户拉取（下载），也可以按时间间隔推送到 PKI 内的所有所有用户。\n\n实际的 `CRL`\
  \ 文件可能会大幅增长，传输此文件并要求每个工作站上的 PKI 客户端软件保存并维护它可能会消耗大量资源，因此 `CRL` 越小越好。也可能先推送完整的 `CRL`，在初始加载之后，随后推送到用户的\
  \ `CRLs` 是增量 `CRL` (delta)，意味着它们只包含相对于原始或基础 `CRL` 的更改。这可以极大减少更新 `CRLs` 时消耗的带宽。\n\
  \n\n\n\n在不将 CRL（证书吊销列表）直接推送到各个系统的实现方案中，用户的 PKI 软件需要知道去哪里查找与与其尝试验证的证书相关的发布 CRL。该证书可能包含一个扩展项，将验证用户指向必要的\
  \ `CRL distribution point`（CRL 分发点）。网络管理员设置这些分发点，一个特定的 PKI 可以存在一个或多个分发点。分发点持有一个或多个包含撤销证书序列号的列表，用户的\
  \ PKI 软件扫描这些列表，以查找用户尝试验证的证书的序列号。如果不存在该序列号，则用户可以确定该证书未被撤销。这种方法有助于用户找到正确的资源，同时也减少了在检查证书未被撤销时需要扫描的信息量。\n\
  \n检查分发 CRL 的最后一种选择是使用在线服务。当客户端用户需要验证证书并确保其未被撤销时，他可以与在线服务通信，该服务将查询环境内提供的所需的 CRL。该服务可以为客户端查询列表，而不是将完整的\
  \ CRL 推送到每一个系统。因此，如果 Joe 从 Stacy 那里收到一个证书，他可以联系在线服务，并将 Stacy 发送的证书中列出的序列号发送给它。在线服务将查询所需的\
  \ CRL 并向 Joe 响应，指示该序列号是否被列为已撤销。\n\n用于在线撤销服务的协议之一是之前提到的在线证书状态协议（OCSP），这是一种请求/响应协议，用于获取正在验证的证书的序列号并为客户端审查\
  \ CRL。该协议有一个响应服务，可向客户端报告证书状态，指示其是已撤销、有效还是状态未知。该协议和服务为客户端省去了查找、下载和处理正确列表的繁琐工作。\n\n\
  ***\n\n![image](img/examtip.jpg)\n\n**考试要点 (EXAM TIP)** 证书撤销检查通过检查 CRL 或使用 `OCSP`\
  \ 查看证书是否已被撤销来实现。\n\n## 挂起 (Suspension)\n\n证书不是被撤销而是被`suspended`（suspended），这意味着它被临时锁定。例如，如果\
  \ Bob 正在休长假并希望确保他的证书在此期间不会被使用，他可以向 `CA` 提交挂起请求。CRL 将列出此证书及其序列号，并在描述证书被撤销原因的字段中，改为指示为挂起状态。一旦\
  \ Bob 回归工作，他可以向 `CA` 提出请求将其证书从列表中移除。\n\n挂起证书的另一个原因是管理员怀疑私钥可能已泄露。在调查期间，可以挂起该证书以确保其无法被使用。\n\
  \n## 密钥销毁 (Key Destruction)\n\n密钥对和证书有固定的`lifetimes`（寿命），这意味着它们将在指定时间过期。当该时间到达时，妥善销毁证书和密钥至关重要，无论密钥存储在何处（用户工作站、集中密钥服务器、USB\
  \ 令牌设备、智能卡等）。\n\n目标是确保在密钥寿命结束后，没有人可以获取该密钥，并将此密钥用于恶意目的。攻击者可能会使用该密钥对消息进行数字签名或加密，寄希望欺骗他人关于其身份（这将是中间人攻击的例子）。此外，如果攻击者正对你的加密系统进行某种类型的破解攻击，试图找出用于加密过程的特定密钥，那么获取旧密钥可能会让他更深入地了解你的加密系统是如何生成密钥的。提供给潜在黑客的信息越少越好。\n\
  \n请注意，在现代 PKI 中，加密密钥对通常在过期后仍需保留一段时间，以便用户可以解密使用旧密钥加密的信息。例如，如果 Bob 使用其当前密钥加密了一个文档，而密钥在三个月后更新，那么\
  \ Bob 的软件必须维护旧密钥的副本，以便他仍能解密该文档。\n\n## 私钥保护 (Private Key Protection)\n\n尽管 PKI 的实现可能复杂且包含许多组件，但一个通用的关键概念必须被理解并执行：私钥必须保持私密。数字签名是通过使用私钥来证明谁发送了信息的，这建立在只有一个人能访问私钥的假设之上。如果伪造者获取了私钥，真实性和不可否认性将无法再主张或证明。\n\
  \n当第一次生成私钥时，它必须存储在某个处。这种存储被称为 `key store`（密钥存储库），通常在应用程序注册证书时创建密钥存储库。在大多数实现中，系统会提示用户输入密码，以创建保护密钥库。例如，如果\
  \ Cheryl 使用网络浏览器注册证书，她的私钥将被生成并存储在密钥库中，这将加密密钥库。当 Cheryl 以后需要访问此私钥时，她会被提示输入密码，该密码将解密密钥库。\n\
  \n不幸的是，许多应用程序并不要求创建强密码来保护密钥存储，而且在某些实现中，用户可以选择完全不提供密码。用户仍然拥有可用的私钥，而且它与用户的身份绑定，因此还需要密码吗？例如，如果\
  \ Cheryl 决定不使用密码，另一个人坐在她的电脑前，他就可以使用她的网络浏览器和私钥对包含病毒的消息进行数字签名。如果 Cheryl 的同事 Cliff\
  \ 收收了这条消息，他会认为是 Cheryl 发的，从而打开消息并下载病毒。这个故事的教训是，用户在使用私钥之前应要求提供某种类型的身份验证（密码、智能卡等），否则，密钥可能会被他人或伪造者使用，身份验证和不可否认性将无从谈起。\n\
  \n由于私钥是任何 PKI 实现的关键组件，密钥本身应具备必要的特性并在生命周期的每个阶段受到保护。以下列表总结了正确使用私钥的特性：\n\n- 密钥大小应为环境提供必要的保护级别。\n\
  - 密钥的寿命应与其使用频率及其保护的数据的敏感性相应。\n- 密钥应该更换，并且在超过允许寿命后使用。\n- 在适当的情况下，密钥在寿命结束时应销毁。\n-\
  \ 私钥绝不能以明文形式暴露。\n- 如果私钥用于数字签名，则不应制作其副本。\n- 私钥不应共享。\n- 密钥应安全地存储。\n- 在使用私钥之前应进行身份验证。\n\
  - 密钥应安全地传输。\n\n\n\n\n\n-   应对对存储和使用密钥的软件实现进行评估，以确保它们提供了必要的保护级别。\n\n如果数字签名将用于法律目的，则可能需要对这些点及其他点进行审计，以确保提供真实的真实性和不可否赖性。\n\
  \n#### CA 私钥\n\n最敏感且关键的公钥/私钥对是 CA 用于对证书进行数字签名的密钥对。这些密钥需要受到高度保护，因为如果它们被破解，CA 与所有终端实体之间的信任关系将受到威胁。在高安全环境中，这些密钥通常存储在防篡改的硬件加密器中，仅允许有访问需求的人员访问。\n\
  \n### 密钥恢复\n\n个人可能拥有一个、两个或多个与其身份绑定的密钥对。这是因为用户对公钥/私钥对有不同的需求和要求。如前所述，证书可以具有特定的属性和使用要求，规定了相应的密钥可以和不能如何使用。例如，David\
  \ 可以有一对密钥对用于加密和传输对称密钥。他还可以有一对密钥对用于加密数据，以及另一对密钥对执行数字签名。David 还可以有一对用于工作相关的数字签名密钥对，以及另一对用于个人活动（例如给朋友发邮件）的密钥对。这些密钥对仅应用于其预期用途，这是通过证书属性和使用值强制执行的。\n\
  \n如果一家公司实施并维护密钥恢复系统，它通常只会备份用于加密数据的密钥对，而不备份用于生成数字签名的密钥对。公司归档密钥是为了确保如果某人离开公司、发生意外或由于某些原因无法解密重要的公司信息，公司仍然可以获取其拥有的数据。这只是组织保护自身的问题。公司不需要能够恢复用于数字签名的密钥对，因为这些密钥仅用于证明发送消息个人的真实性。公司拥有这些密钥并无获益，实际上也不应该拥有这些访问权限，因为它们是针对特定目的与个人相关的。\n\
  \n备份和恢复加密密钥有两个重要的系统：密钥归档和密钥恢复。`密钥归档系统`是一种备份密钥并将其安全存储在存储库中的方法；`密钥恢复`是将丢失的密钥恢复给用户或公司的过程。`恢复代理`是指向被授予公钥证书以恢复已加密用户数据的实体的术语。这是\
  \ PKI 中常用的恢复策略类型，但增加了恢复代理访问受保护信息的风险。\n\n如果密钥被备份并存储在集中计算机中，该系统必须经过严格控制，因为如果它被破解，攻击者将获得访问整个基础设施的所有密钥。此外，授权某一个人恢复环境中的所有密钥通常是不明智的，因为这个人可能将这种权力用于邪恶目的，而不是仅仅在合法目的需要密钥时恢复密钥。在安全系统中，最好不要完全信任任何人。\n\
