  \n**抱歉，由于输入文本本身存在逻辑重复，为了确保准确性，我将对重复部分进行了整合。以下是针对您文本中未重复部分的翻译：**\n\n[content]\n##\
  \ 密钥和凭证管理\n\n`MDM` 市场正在迅速成熟。密钥和凭证管理服务正在集成到大多数 `MDM` 服务中，以确保现有的强策略和程序可以安全地扩展到移动平台。这些服务包括数字签名密钥以及\
  \ `S/MIME` 加密解密。密钥和凭证是移动设备上可以找到的价值最高物品，因此对其进行保护是移动设备安全的关键。存储在设备上的密钥和凭证可以使用多个应用程序。在保持可用性的同时为这些密钥提供保护是现代应用程序安全的要素要素。\n\
  \n## 身份验证\n\n当使用移动设备访问业务网络时，身份验证就会变成一个问题。存在几个层面：设备是否允许访问网络？设备的用户是网络用户吗？如果是，如何验证用户？移动设备具有某些优势，因为它们可以存储证书，本质上比密码更安全。这把身份验证问题转移到了终端，依赖于密码、屏幕锁定和其他移动设备保护。除非结合使用（包括在有限次数失败后擦除），否则这些可能是薄弱的。移动认证的风险在于存储在设备中的强凭证受不受严格密码的保护。用户可以共享他们的移动设备，并无意中共享他们的强身份代码。\n\
  \n### 地理标记\n\n在移动设备上或具有 `GPS` 功能的相机拍摄的照片可以在数字照片中嵌入位置信息。这被称为“地理标记”。发布嵌入地理标记的照片有其用途，但也可能无意中发布用户不想共享的信息。例如，如果你用智能手机拍摄了车库里的汽车照片并将其发布到互联网上尝试出售，如果智能手机开启了地理标记，拍摄位置的位置将作为元数据嵌入数字照片中。这种发布可能会无意中暴露你家的位置。关于这一主题已有许多公开讨论，大多数移动设备都可以禁用地理标记。\n\
  \n\n\n\n### 应用白名单\n正如本章早期“应用控制”部分所讨论的，控制设备可以访问的应用程序可能是公司移动设备策略的重要元素。应用白名单和黑名单允许允许您控制并阻止移动设备上可用的应用程序。这通常通过某种类型的\
  \ MDM（移动设备管理）功能进行管理。应用白名单可以通过防止未经批准的应用程序在设备上安装和运行来提高安全性。\n\n### 加密\n正如设备应该被加密以保护设备上的所有信息一样，应用程序也应该被加密。仅对数据存储进行加密是不够的。如果设备经过全加密，那么所有应用都将能够访问数据，从本质上从应用程序的角度来看绕过了加密。带有敏感信息的应用程序应通过自身的一套保护措施来控制访问。在设备内隔离数据的唯一方法是应用程序通过特定特定的加密来管理自己的数据存储。这将允许敏感数据免受恶意应用程序的侵害，如果允许统一访问，这些程序可能会泄露数据。\n\
  \n### 传递信任/认证\n跨多个域/平台的安全通过信任关系提供。当域或平台之间存在信任关系时，每个域的身份验证信任所有其他受信任域的身份验证。因此，当一个应用程序通过身份验证时，其身份验证会被所有信任该认证域或平台的其他域/平台接受。移动设备中的信任关系可能非常复杂，而且安全方面往往没有得到妥善实施。移动设备倾向于用于许多系统，包括业务、个人、公共和私有系统。这极大地扩大了风险配置以及基于传递信任的攻击机会。与其他所有应用程序一样，应该对移动应用程序进行仔细审查，以确保信任关系是安全的。\n\
  \n### BYOD（自带设备办公）顾量\nBYOD 在业务中有很多优势，而不仅仅是从设备成本的角度来看。用户倾向于拥有一台设备而不是携带多个设备。用户在他们已经感兴趣学习的设备上，学习曲线更短。\n\
  \n### 数据所有权\nBYOD 模糊了数据所有权的界限，因为它模糊了设备管理的界限。如果公司拥有分发给员工的智能手机，公司可以在员工离职时收回该手机。这种做法通过让公司配发的设备仅留在员工手中来保护公司数据。然而，公司在重新发放设备之前不能依赖于简单的出厂重置，因为出厂重置可能无法删除设备上的所有数据。如果设备被重新发放，之前所有者的某些个人信息（如私人联系人）可能仍然留在设备上。另一方面，如果员工的设备是用于业务目的的个人设备，在员工离职时，尽管公司尽力删除设备上的数据，手机上可能仍留有一些公司数据。如果该设备被转售或回收，公司数据可能会留在设备上并传递给后续所有者。将业务数据保留在单独的\
  \ MDM 管理容器中是解决这一问题的方法之一。\n\n### 支持所有权\n移动设备的支持成本是企业的一个重要考虑因素。每台设备都有其各种功能的实现。虽然这些功能通常是根据规范实现的，但软件实现可能没有完全或正确地实现该规范。这可能导致向您的帮助热线或支持组织的支持电话增加。对于企业帮助热线来说，要熟悉访问公司网络的所有可能设备的各个方面是非常的。例如，您的支持组织必须能够对\
  \ iPhone、Android 设备、平板电脑等进行故障排除。这些设备更新频繁，新设备不断发布，新功能也定期添加。您的支持组织将需要可靠的知识库文章和工作辅助，以便为各种不断变化的设备提供足够的支持。\n\
  \n### 补丁管理\n正如您的公司政策应强制及时更新桌面电脑和笔记本电脑以帮助消除这些平台上的安全漏洞一样，它也应该要求移动设备保持补丁更新。拥有最新的应用程序、操作系统等是防御病毒、恶意软件和其他威胁的重要最佳防御。\n\
  \n\n\n\n员工离职流程需要修改，以包含移动设备账户的注销。在员工离职几个月后，仍发现其账户甚至公司设备仍连接到公司网络，这种情况并不罕见。作为员工离职政策和流程的一部分，应及时删除电子邮件账户。离职时应收回公司提供的移动设备。作为离职流程的一部分，应终止\
  \ `BYOD` 设备对公司资源的访问权限。应对对旧账户或未注销的账户进行定期审计，以确保离职员工的账户被及时删除。\n\n### 遵循公司政策\n您关于 `BYOD`\
  \ 设备的公司政策应与现有的计算机安全策略保持一致。您的培训计划应包含有关移动设备安全的指导。纪律处分应保持一致。应该加强您的监控程序，以包含对移动设备的监控和控制。\n\
  \n### 用户接受\n`BYOD` 本质上产生了个人利益与公司利益之间的冲突。使用自己的设备进行公司业务的员工，本质上对该设备有强烈的所有感，并可能对公司控制下载到设备上的公司信息感到反感。另一方面，公司期望公司数据得到适当的控制和保护，因此希望实施远程擦除或锁定要求以保护公司数据。如果某个人丢失了特殊活动中的个人照片，而公司擦除了她的设备（包括那些无法替代的照片），她可能会对公司产生不满情绪。您的公司\
  \ `BYOD` 政策需要明确定义，经过公司法务部门批准，并通过培训清晰地告知所有员工。\n\n### 架构/基础设施考虑\n移动设备消耗到公司 IT 基础设施的连接。现在，一个人通过一个或多个智能手机、平板电脑以及笔记本电脑或桌面电脑连接到公司基础设施的情况已不罕见。过去的一些基础设施实现在设计上并不高效，有时一个设备会占用多个连接。这会减少其他终端用户的可用连接数。建议进行负载测试，以确保您的设计或现有基础设施能够支持来自多个设备可能的大量连接。\n\
  \n当系统根据多个连接跟踪用户账户时，多个连接也可能产生安全问题。用户需要意识到这一点，以免无意中制造了应急响应情况，或发现自己由于自己的操作而被锁定。这是一个棘手的问题，需要比传统的“`userid`\
  \ 等于一个当前连接”的理念更具智能性的设计。\n\n### 法律问题\n从本章讨论的各种主题可以明显看出，用于公司业务的移动设备带来了许多安全挑战。由于技术变化非常快，最好确保您对政策进行了稳妥的法律审查。涉及移动设备时既有法律问题，也有公关问题。使用公司所有和个人设备的员工在涉及公司数据时承担相应责任。应定期审查政策和程序以跟上技术发展。\n\
  \n### 可接受使用策略\n与您对笔记本电脑和桌面电脑的可接受使用策略类似，您的移动设备策略应解决移动或 `BYOD` 设备的可接受使用问题。应解决授权公司设备用于个人目的的问题。应对违反移动设备政策的纪律处分。`BYOD`\
  \ 为公司和用户都带来了优势；应具体说明其影响以及具体的用户责任。\n\n***\n\n![image](img/examtip.jpg)\n\n**考试贴士**\
  \ 移动设备在企业内部提供了许多可用性优势，可以在具有安全意识的用户的帮助下进行安全管理。安全政策在帮助用户理解其安全方面可以大有用。\n\n### 内置摄像头/视频\n\
  正如“GPS”部分讨论的，许多设备包含摄像头、视频。\n\n### 章节回顾\n在本章中，您熟悉了移动设备带来的广泛安全问题。\n\n### 问题\n为了帮助您进一步准备\
