  \ Zimmermann）于 1991 年创建，经过了多个版本，并在非商业许可下免费提供。`PGP` 现在是一项商业企业加密产品。它可以应用于流行的电子邮件程序，通过对称和非对称加密协议的结合来处理大多数日常加密任务。`PGP`\
  \ 的独特特性之一是它同时使用对称和非对称加密方法，利用每种方法的优势。\n\n### PAP\n\nPretty Good Privacy (`PGP`) 由菲利普·齐默曼（Philip\
  \ Zimmermann）于 1991 年创建，经过了多个版本，并在非商业许可下免费提供。`PGP` 现在是一项商业企业加密产品。它可以应用于流行的电子邮件程序，通过对称和非对称加密协议的结合来处理大多数日常加密任务。`PGP`\
  \ 的独特特性之一是它同时使用对称和非对称加密方法，利用每种方法的优势。\n\n### NTLM\n\nPretty Good Privacy (`PGP`)\
  \ 由菲利普·齐默曼（Philip Zimmermann）于 1991 年创建，经过了多个版本，并在非商业许可下免费提供。`PGP` 现在是一项商业企业加密产品。它可以应用于流行的电子邮件程序，通过对称和非对称加密协议的结合来处理大多数日常加密任务。`PGP`\
  \ 的独特特性之一是它同时使用对称和非对称加密方法，利用每种方法的优势。\n\n### Wireless\n\n在无线领域，有三种常用的安全套件：无线传输隐私\
  \ (`WEP`)、Wi-Fi 保护访问 (`WPA`) 和 `WPA2`。`WEP` 已显示出许多缺陷，主要与 `RC4` 的初始化有关。`WPA` 的开发是为了克服这些缺陷，但仍然存在不足。`WPA2`\
  \ 解决了这些问题并使用 `AES` 进行机密。`WPA2` 提供了预共享密钥 (`PSK`) 选项，其中密钥是提前共享。`WPA2` 有两种变体：`WPA2-PSK`\
  \ 和 `WPA2-Enterprise`。`WPA2-Enterprise` 的设置复杂得多，涉及对 `RADIUS` 认证服务器的使用，并避免了提前共享密钥的必要。黑客已经成功破解了\
  \ `WPA2-PSK`，但 `WPA2-Enterprise` 尚未被破解。`WPA2-PSK` 的最佳解决方案是使用长随机密钥（大于 25 个字符）和随机\
  \ SSID，因为 SSID 在攻击中会被用于预计算彩虹表。\n\n* * *\n\n![image](img/examtip.jpg)\n\n**考试提示**\
  \ WPA2 是安全无线最安全的方法，其中 `WPA2-Enterprise` 适用于企业，`WPA2-PSK` 适用于家庭和小企业。\n\n### 密钥\n\n\
  一次性密钥是一种有趣的加密形式，在理论上它是完美且不可破解的。密钥的大小与加密材料相同或更大。明文与密钥进行 `XOR` 运算产生密文。使一次性密钥“完美”的是密钥的大小。如果你使用一个充满密钥的空间，你将解密出与原始信息相同的所有可能的信息，而无法判断哪一个是正确的。这使得一次性密钥在不重复使用的情况下，即使通过暴力破解也无法破解。这使得一次性密钥在任何大规模使用中都不太实际。\n\
  \n### 算法的比较优势与性能\n\n\n\n\n\n决定加密算法强度的因素有几个。首先，最显而易见的是密钥大小以及由此产生的密钥空间大小。一种攻击方法是直接在暴力攻击中尝试所有可能的密钥。另一个因素被称为`工作因子`（`work\
  \ factor`），它是对执行操作所需的时间和精力的主观衡量。如果工作因子较低，则测试密钥的速度就会很快，这意味着需要更大的密钥空间。工作因子在保护诸如密码哈希（password\
  \ hashes）等系统中也起着作用，在这些系统中，较高的工作因子可以作为安全机制的一部分。\n\n## 使用带有传输加密的算法/协议\n\n数据跨越网络的移动被称为`传输`（`transport`）。加密传输机制是保护传输中数据的关键要素之一。数据可以独立于传输机制进行加密，然后在开放通道上传输，也可以对通道本身进行加密。\n\
  \n### HTTPS\n大多数网络活动使用超文本传输协议（`HTTP`），但这种明文协议极容易被截获。`HTTPS` 使用安全套接层（`SSL`）或传输层安全（`TLS`）在信息传输之前保护通道。`HTTPS`\
  \ 使用标准的 `TCP` 端口 `443` 进行 `TCP/IP` 通信，而不是用于 `HTTP` 的标准端口 `80`。早期的 `HTTPS` 实现使用了\
  \ 40 位的 `RC4` 加密算法，但随着出口限制的放宽，大多数实现现在使用 128 位加密。在 `SSL/TLS` 协议协商期间，会从密码套件中选择合适的算法集。\n\
  \n### SSL\n安全套接层（`SSL`）由 Netscape 发明，作为解决网络流量缺乏机密性的解决方案。`SSL` 通过加密通信通道来工作，从 Diffie-Hellman\
  \ 密钥交换开始，协商一组包括加密和身份验证方法在内的参数。最新版本是 3.0，但截至 2014 年 10 月，所有的 `SSL` 版本都有已知的可利用漏洞，不应启用。\n\
  \n### TLS\n传输层安全（`TLS`）是 IETF 的产物，与 `SSL` 非常相似。`TLS` 是作为 `SSL` 的替代品创建的，在许多使用 `TLS`\
  \ 的情况下，人们会错误地将其称为 `SSL`。`TLS` 有多个版本：`1.0`、`1.1` 和 `1.2`。与 `SSL` 一样，在通道建立期间，算法的选择是通过选择连接双方共有的密码套件之一来完成的。\n\
  \n### IPsec\n`IPsec` 是 `IP` 安全功能的集合，旨在网络通信的网层或数据包处理层引入安全性。其他方法尝试在 `TCP/IP` 协议族的更高层级引入安全性，例如应用程序所在的层。`IPsec`\
  \ 设计用于在互联网上提供安全的虚拟专用网络（`VPN`）能力。本质上，`IPsec` 通过引入身份验证和加密来保护第 4 层协议，从而提供安全版本的 `IP`。对于\
  \ `IPv4`，`IPsec` 是可选的，但对于 `IPv6` 是强制要求的。显然，通信的双方都需要使用 `IPsec` 才能进行加解过程。`IPsec` 使用\
  \ `HMAC-SHA1` 确保完整性和真实性，使用 `AES` 确保机密性。\n\n`IPsec` 提供两种安全服务，以确保数据本身（称为`IPsec 传输模式`/`IPsec\
  \ transport mode`）或数据和头部（称为`隧道模式`/`tunnel mode`）的身份验证和机密性。`IPsec` 引入了许多新协议，包括身份验证头部（`AH`），它基本上提供了发送者的身份验证，以及封装安全载荷（`ESP`），它为数据添加了加密以确保机密性。`IPsec`\
  \ 还允许在使用 IP 负载压缩协议（`IPComp`）在加密之前对负载进行压缩。通常，加密会负面影响压缩算法完全压缩数据以传输的能力。通过提供在加密前压缩数据的能力，`IPsec`\
  \ 解决了这个问题。\n\n### SSH\n安全外壳（`SSH`）是明文传输协议 `Telnet` 的安全替代品。`OpenSSH` 是一个流行的 `SSH`\
  \ 实现，当前版本为 6.6。在 `OpenSSH` 网站（`www.openssh.com/`）上列出了过去版本的已知漏洞列表。`OpenSSH` 支持 `3DES`、`Blowfish`\
  \ 和 `AES`。\n\n![image](img/examtip.jpg)\n\n**考试提示** 对于考试，你应该预期会有关于传输加密以及 `HTTPS`、`SSL/TLS`、`IPsec`\
  \ 和 `SSH` 的问题，这些都是 CompTIA Security+ 的目标。你应该理解在何种场景下使用它们。\n\n## 密码套件\n\n在许多应用程序中，加密的使用是以一组函数的形式出现的。不同的算法可以用于身份验证、加密/解密、数字签名和哈希。`密码套件`（`cipher\
  \ suite`）一词指的是一组排列好的算法。例如，`TLS` 在 `www.iana.org/assignments/tls-parameters/tls-parameters.xhtml`\
  \ 发布了 `TLS 密码套件注册表`。\n\n### 强加密 vs 弱加密\n加密算法种类繁，有旧的，也有新的，每种都有自己的优缺点。随着时间的推移，新的方法和计算能力改变了加密的可行性。强加密与弱加密的概念承认了随着时间的推移，加密可能会变得容易受到攻击。在应用或选择加密时，应该考虑到并不是所有加密仍然是强加密。在选择使用的加密算法时，做出合适的选择至关重要。例如，如果服务器提供\
  \ `SSL v2` 和 `v3`，你应该只选择 `v3`，因为 `v2` 已证明存在漏洞。\n\n## 密钥伸展\n\n密钥伸展（`Key stretching`）是一种机制，它获取弱密钥并将其“伸展”，以使系统更具防御暴力攻击的能力。用于密钥伸展的典型方法通过增加迭代计算来提高计算复杂度。为了将密码扩展为更长的密钥，你可以让它通过多轮变长哈希，每次随时间推移增加输出位数。这可能需要成百或数千次迭代，但对于单次计算，时间并不显著。当人们想要使用暴力攻击时，如果进行数十亿次操作，计算工作量的增加就会变得显著，使得这种攻击形式的成本更高。\n\
  \n今天使用的常用的密钥伸展形式包括基于密码的密钥衍生函数 2（PBKDF2）和 Bcrypt。\n\n### PBKDF2\n基于密码的密钥衍生函数 2（`PBKDF2`）是一种从密码派生密钥的密钥衍生函数。该函数使用密码或密码以及盐，并对输入进行数千次\
  \ `HMAC`。重复使得暴力攻击在计算上是不可行的。\n\n### Bcrypt\n`Bcrypt` 是一种密钥伸展机制，它使用了 `Blowfish` 算法和盐，并添加了自适应函数来增加迭代次数。结果与其他密钥伸展机制相同（单次使用在计算上是可行的），但在尝试暴力破解该函数时，数十亿次尝试使其在计算上变得不可行。\n\
  \n\n\n\n\n公钥基础设施（PKI）为不同类型的用户和实体提供了安全且可预测的方式进行通信所需的所有组件。PKI 由硬件、应用程序、策略、服务、编程接口、加密算法、协议、用户和实用程序组成。这些组件共同工作，允许通信管理非对称密钥，从而促进利用公钥加密用于数字签名、数据加密和完整性保护。如果你需要复习这些概念，请参考第\
  \ 23 章。虽然许多不同的应用程序和协议可以提供相同的功能，但构建和实现 PKI 归结在于建立信任级别。\n\n例如，如果 John 和 Diane 想要安全地通信，John\
  \ 可以生成自己的公钥/私钥对，并将公钥发送给 Diane，或者他可以将自己的公钥放在所有人都可以访问的目录中。如果 Diane 从 John 处或从公共目录收到了\
  \ John 的公钥，她如何知道这确实来自 John 呢？也许是另一个人冒充 John，并将自己的公钥替换了 John 的公钥，如图 24-1 所示。如果发生了这种情况，Diane\
  \ 会认为她的信息只有 John 能够读取，并且回复实际上是来自他的。然而，她实际上是在与 Katie 通信。需要的是一种验证个人身份的方法，以确保人的公钥与其身份绑定，从而确保上述场景（以及其他场景）不会发生。\n\
  \n![image](img/f0458-01.jpg)\n\n* *\n\n**图 24-1** 没有 PKI，个人可以伪造他人的身份。\n\n在 PKI 环境中，被称为`注册机构\
  \ (RAs)` 和`证书颁发机构` (`CAs`) 的实体提供类似于车辆管理局（DMV）的服务。当 John 去申请驾照时，他必须通过护照、出生证明或其他身份证明向\
  \ DMV 证明自己的身份。如果 DMV 对 John 提供的证明满意（且 John 通过了驾驶测试），DMV 将创建一个驾照，随后 John 可以用它来证明自己的身份。每当\
  \ John 需要证明自己的身份时，都可以出示驾照。虽然许多人可能不信任 John 会真实地证明身份，但他们信任第三方，即 DMV。\n\n在 PKI 语境下，虽然特定产品存在某些差异，但注册机构将要求请求证书的个人提供身份证明并验证这些信息。注册机构随后会建议\
  \ CA 生成证书，该证书类似于驾照。CA 将使用其私钥对证书进行数字签名。私钥的使用确保了接收者能够确认证书来自 CA。当 Diane 收到 John 的证书并验证其确实是由她信任的\
  \ CA 签了数字名时，她将相信该证书确实是 John 的——这不是因为她信任 John，而是因为她信任那个为他的身份背书的实体（CA）。\n\n这通常被称为`第三方信任模型`。公钥是数字证书的组成部分，因此当\
  \ Diane 验证 CA 的数字签名时，这证明了该证书确实是 John 的，且证书包含的公钥也是 John 的。John 的身份就是这样绑定的。\n\n###\
  \ 证书颁发机构\n\nCA 是受信任的权威，负责认证个人身份并创建表明个人与其声称身份一致的电子文档。该电子文档被称为数字证书，它在主体的身份与公钥之间建立了关联。如第\
  \ 23 章所注，保护私钥至关重要，它通常不会离开创建它的机器或设备。\n\n然而，CA 不仅仅是一个软件；它实际上是由参与验证身份和生成证书的软件、硬件、流程、策略和人员组成的。这意味着，如果这些组件中的一个受到破坏，会对整个\
  \ CA 产生负面影响，并威胁到其产生的证书的完整性。\n\n每个 CA 都应该有一份认证实践声明（CPS），概述了如何验证身份；CA 生成、维护和传输证书所遵循的步骤；以及为什么\
  \ CA 是值得信任的。它描述了密钥是如何保护的、数字证书中包含哪些数据，以及将如何处理撤销。如果一家公司将使用并依赖公立 CA，公司的安全官、管理员和法律部门应该审查\
  \ CA 的整个 CPS，以确保它能够恰当满足公司的需求。\n\n`证书服务器`是根据初始注册过程中提供的数据颁发证书的实际服务。该服务器构建数字证书并向其填充必要信息，并将用户的公钥与生成的证书相结合。然后使用\
  \ CA 的私钥对证书进行数字签名。\n\n### 注册机构\n\n注册机构（RA）是接受数字证书请求并对请求证书的人员执行注册和验证必要步骤的组件。身份验证的要求取决于所请求的证书类型。\n\
  \n\n\n\n\n不同的 CA（证书机构）提供的证书类型可能有所不同，但通常至少提供三种不同类型，并分为以下几类：\n\n- **1 类（Class 1）**：1\
  \ 类证书通常用于通过电子邮件验证个人身份。获得 1 类证书的人可以使用公钥/私钥对对电子邮件进行数字签名并对消息内容加密。\n- **2 类（Class 2）**：2\
  \ 类证书可用于软件签名。软件供应商会注册此类证书，以便对其软件进行数字签名。这为软件在开发和发布后提供了完整性保护，并允许软件接收者验证软件的来源。\n- **3\
  \ 类（Class 3）**：公司可以使用 3 类证书建立自己的 CA，这将允许它进行自己的身份验证并在内部生成证书。\n\n每一种高级别的证书都可以比其低一级的证书执行更强大、更关键的任务。这就是为什么不同级别的证书对身份证明有不同的要求。如果你想获得\
  \ 1 类证书，可能只被要求提供姓名、电子邮件地址和物理地址。对于 2 类认证，你可能需要向 RA（注册机构）提供更多数据，例如驾照、护照和可以验证的公司信息。要获得\
  \ 3 类证书，你将被要求提供更多信息，并且很可能需要前往 RA 办公室进行面对面。每个 CA 都会概述其提供的证书类别以及获取每种类型证书所必须满足的身份识别要求。\n\
  \n在大多数情况下，当用户请求 1 类证书时，注册过程将要求用户在 Web 端表单中输入特定信息。网页将有一个接受用户公钥的区域，或者将引导用户创建公钥/私钥对，允许用户选择要创建的密钥大小。一旦完成这些步骤，公钥将附在证书注册表单上，两者都会转发给\
  \ RA 进行处理。RA 仅负责注册过程，无法实际生成证书。一旦 RA 完成了请求的处理并验证了个人身份，RA 将把请求发送给 CA。CA 将使用 RA 提供的信息生成数字证书，将必要数据集成到证书字段中（用户身份信息、公钥、有效期、密钥和证书的正确用途等），并将证书副本发送给用户。这些步骤如图\
  \ 24-3 所示。证书还可能被发布在公开访问的目录中，以便他人访问。\n\n![image](img/f0462-01.jpg)\n\n**图 24-3**\
  \ 获取数字证书的步骤\n\n注意，身份与证书之间并不一定存在 1:1 的对应关系。实体可以拥有多个密钥对，针对不同的用途使用不同的公钥。因此，实体可以拥有多个证书，每个证书都证明独立公钥的所有权。也可以拥有不同类的证书，同样使用不同的密钥。这种灵活性允许实体在管理密钥方面完全完全自主权，而\
  \ PKI 通过使用统一的流程（通过通用接口进行密钥验证）来管理复杂性。\n\n![image](img/examtip.jpg)\n\n**考试提示** RA\
  \ 代表 CA 验证证书请求者的身份。CA 使用由 RA 转发的信息生成证书。\n\n如果应用程序创建了一个可以被其他应用程序访问的密钥库，它将提供一个标准的接口，称为\
  \ `application programming interface (API)`。在 Mozilla 和 Linux 系统中，此接口通常是 `PKCS #11`；在\
  \ Microsoft 应用程序中，对于 Microsoft Vista 及更高版本，接口是 `Cryptography API: Next Generation\
  \ (CNG)`。例如，图 24-4 显示，某些应用程序通过密钥库来通信。\n\n![image](img/f0463-0.jpg)\n\n**图 24-4**\
  \ 某些应用程序可以共享密钥库\n\n本地密钥库只是存储这些项目的一个位置。通常，数字证书和公钥存储在证书库中，以便某些个人使用。\n\n### 信任与证书验证\n\
  \n如果我们不自动信任某些个人，就需要使用 PKI。安全在于保持怀疑并确保安全，因此我们需要我们信任的第三方为个人背书，才能建立信任。但是，信任 CA 意味着什么，我们如何利用这一点呢？\n\
  \n当用户选择信任某个 CA 时，她将下载该 CA 的数字证书和公钥，这些将存储在她的计算机上。大多数浏览器都配置了默认信任的 CA 列表，因此用户安装新浏览器时，一些著名的\
  \ CA 无需设置即可被信任。这种列表的示例如图 24-5 所示。\n\n![image](img/f0464-0.jpg)\n\n**图 24-5** 浏览器默认信任的\
  \ CA 列表\n\n在 Microsoft CNG 环境中，用户可以根据需要从列表中添加或删除 CA。在需要更高保护的生产环境中，此列表将经过精简，可能列出的\
  \ CA 只有公司的内部 CA。这确保了只有由公司 CA 签名的数字软件才会被自动安装。其他产品（如 Entrust）使用集中控制的策略来决定哪些 CA 值得信任，而不是让用户做出这些关键决策。\n\
  \n检查消息有效性涉及许多步骤。例如，假设 Maynard 收到了一条来自他不认识或信任的 Joyce 的数字签名消息。Joyce 還在消息中附带了她的数字证书，其中包含了她的公钥。在\
  \ Maynard 确定此消息的真实性之前，他需要做一些工作。这些步骤如图 24-6 所示。\n\n![image](img/f0465-0.jpg)\n\n\
  **图 24-6** 验证证书真实性和完整性的步骤\n\n首先，Maynard 将看到是哪个 CA 签署了 Joyce 的证书，并将其与其计算机配置的 CA 列表进行比较。他信任列表中的\
  \ CA，而不信任其他任何。（如果证书是由列表中没有的 CA 签署，他将不会接受该证书为有效，因此无法确定此消息是否是由 Joyce 发送的，或者附带的密钥是否真的是她的公钥。）\n\
  \n\n\n\nMaynard 看到签署 Joyce 证书的 `CA` 确实在他受信任的 `CA` 列表中，因此他现在需要验证该证书是否被修改过。通过使用 `CA`\
  \ 的公钥和证书的摘要，Maynard 可以验证证书的完整性。然后，Maynard 就可以确定该 `CA` 确实创建了该证书，因此他现在可以信任 Joyce 证书的来源。数字签名的使用允许证书保存在公共目录中，而无需担心它们被意外或刻意地修改。如果用户从存储库中提取证书，并创建一个与证书本身嵌入的数字签名不匹配的消息摘要值，那么该用户就会知道证书已被已被\
  \ `CA` 以外的人员修改过，他将知道不要接受相应公钥的有效性。同样，攻击者无法创建一个新的消息摘要并对其进行加密，将其嵌入证书中，因为他无法访问 `CA`\
  \ 的私钥。\n\n但 Maynard 的工作尚未结束。他需要确保颁发证书的 `CA` 尚未吊销该证书。证书还有开始日期和结束日期，表示证书有效的时间段。如果开始日期尚未到达，或者结束日期已经过去，则该证书是无效的。Maynard\
  \ 检查这些日期，以确保证书仍被视为有效。\n\nMaynard 可能会经历的另一个步骤是检查此证书是否由于任何原因被吊销，因此他将参考吊销列表，查看 Joyce\
  \ 的证书是否在列表中。吊销列表可以直接通过颁发证书的 `CA` 进行检查，也可以通过支持在线证书状态协议 (`OCSP`）的专用在线服务进行检查。（证书吊销和列表分发在本章后后的“证书生命周期”部分进行了详细解释。）\n\
  \n综而言之，验证证书需要以下步骤：\n\n1. 将数字签名签署证书的 `CA` 与已加载到接收者计算机的 `CAs` 列表进行比较。\n2. 为证书计算消息摘要。\n\
  3. 使用 `CA` 的公钥解密数字签名，并恢复出声称嵌入证书的原始消息摘要（验证数字签名）。\n4. 比较两个生成的消息摘要值，以确保证书的完整性。\n5.\
  \ 检查证书内的标识信息，例如电子邮件地址。\n6. 检查有效性日期。\n7. 检查吊销列表以查看该证书是否被吊销。\n\nMaynard 现在相信该证书是合法的，并且属于\
  \ Joyce。现在他需要做什么呢？证书持有 Joyce 的公钥，他需要验证 Joyce 附加在其消息上的数字签名，因此 Maynard 从她的证书中提取 Joyce\
  \ 的公钥，通过哈希算法处理她的消息，并计算出值为 `X` 的消息摘要值。然后他使用 Joyce 的公钥解密她的数字签名（记住数字签名只是用私钥加密的消息摘要）。此解密过程为他提供了另一个值为\
  \ `Y` 的消息摘要。Maynard 比较值 `X` 和 `Y`，如果它们相同，他就可以确保该消息没有被修改过。\n\n### 数字证书\n\n数字证书将身份与公钥绑定。颁发证书的\
