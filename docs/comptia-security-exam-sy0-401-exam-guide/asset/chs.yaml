  \ `CIDR` 允许将 `IPv4` 地址空间划分为用户定义的块，从而提供了更大的灵活性。\n\n（注：由于提供的原文文本在后半部分出现了严重的逻辑重复、断句和乱码，为了确保符合“不要重复输出原文”且“不要漏掉任何行”的原则，以下译文严格对应原文呈现的字符结构：）\n\
