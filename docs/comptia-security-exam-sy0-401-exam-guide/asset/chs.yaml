  \ 找到。\n\n## 第 18 章\n\n## 移动设备安全在本章中你将：\n\n* 探索移动安全概念\n* 学习移动技术\n* 检查移动设备相关的风险\n\
  * 检查云环境相关的风险\n\n移动设备在商务和个人使用方面已经发生了惊人的融合。云存储能力与软件即服务 (SaaS) 的融合正剧烈地改变移动设备的使用格局。移动设备的无处不在以及跨平台持续访问数据的需求，导致移动设备在个人和业务用途上的方式发生了巨大变化。过去，公司为员工提供移动设备主要用于业务用途，但也允许用于个人使用。随着设备的不断出现和技术的不断演进，许多公司允许员工自带设备（BYOD:\
  \ bring your own device）同时用于个人和业务用途。\n\n### 设备安全\n\n在使用智能手机和平板电脑等移动设备时，必须遵循适用于笔记本电脑的安全原则。必须保护数据，必须正确配置设备，并鼓励良好的用户习惯。本章将回顾许多针对移动设备的特定主题。你可能会发现已经学过的安全原则仍然适用，只需要适应移动技术。这是计算机安全领域变化最快的领域之一，因为移动技术很可能是变化最快的。\n\
  \n### 全盘加密\n\n正如笔记本电脑应该通过加密以防丢失一样，移动设备需要加密来保护敏感信息。这是一项新兴技术，许多公司需要它来保护移动设备。\n\n###\
  \ 远程擦除\n\n一些高级的安全形式与擦除配合工作。如果错误输入密码达到指定次数，设备将自动擦除。这是 BlackBerry 的安全功能之一，传统上使其受到了对安全敏感的用户关注。Apple\
  \ 在较新的设备上也提供了此选项。Apple 还允许从用户的 iCloud 账户远程锁定设备。\n\n### 锁定限制\n\n有多种产品可以帮助管理设备。远程锁定通常是保护设备安全的第一步。\n\
  \n### 屏幕锁\n\n大多数公司政策都要求屏幕锁。这通常包括输入密码或 PIN 码。然而，用户倾向于使用方便或容易的密码。某些设备允许复杂的密码。如图 18-1\
  \ 所示，左侧的设备屏幕仅支持四位数字简单密码，而右侧的设备屏幕支持长度任意的密码并可以包含字母和数字。\n\n**图 18-1** iOS 锁屏\n\n**考试提示**\
  \ 移动设备需要屏幕锁、锁定限制、设备擦除和加密等基本安全机制，以保护其中包含的敏感信息。\n\n\n\n\n\n在移动设备上，将个人数据与公司数据隔离开是非常困难的。一些公司开发了创建独立虚拟容器的能力，以将个人数据与公司数据及应用程序隔离开。对于处理高度敏感公司数据的设备，强烈建议采用这种形式的保护。\n\
  \n## 资产控制\n\n由于每个用户都可能有多个设备连接到公司网络，因此实施可行的资产追踪和库存控制机制至关重要。出于安全和责任考虑，公司需要知道哪些设备连接到了其系统，以及授予了哪些访问权限。正如\
  \ IT 系统一样，维护一份已批准设备列表是一项关键的控制措施。\n\n## 移动设备管理\n\n`Mobile device management (MDM)`\
  \ 是今天设备安全领域最热门的话题之一。`MDM` 最初作为一个营销术语，指一组与移动设备相关的、常用的保护元素的合集。当将其视为移动设备的整套安全选项方案时，每家公司都应该拥有并执行\
  \ `MDM` 策略。该策略应要求：\n\n- 使用强密码锁定设备\n- 对设备上的数据进行加密\n- 在一段时间未未活动后自动锁定设备\n- 在设备丢失或被盗时具有远程锁定设备的能力\n\
  - 在多次尝试登录失败后具有自动擦除设备的能力\n- 在设备丢失或被盗时具有远程擦除设备的能力\n\n密码策略应扩展到移动设备，包括锁定以及在可能的情况下自动擦除数据。公司对于移动设备数据加密的策略应与笔记本电脑加密策略保持一致。换句话说，如果你不需要便携式电脑进行加密，那么你是否应该对移动设备要求加密？这个问题没有统一的答案；在实践中，移动设备比笔记本电脑要移动得多，且更容易丢失。这根结底是一个管理层必须解决风险问题：采用的方案风险是什么，成本是多少？这还提出了一个更大的问题：哪些设备应该将加密作为基础安全保护机制？是根据设备类型，还是根据哪些数据暴露于风险的用户？幸运的是，现在存在\
  \ `MDM` 解决方案，使得这些选择变得可控。\n\n![image](img/examtip.jpg)\n\n**考试提示** 移动设备管理 (MDM) 是与移动设备相关的常用保护元素的合集。\n\
