  \n\n\n\n## 9. D. 信息安全培训是 PCI DSS、HIPAA 以及许多最佳实践的一部分。\n\n## 10. A. 安全港湾原则中的“通知”规定，公司必须识别收集了哪些信息、如何使用这些信息以及与谁共享。\n\
  \n## 11. 关于用户习惯的良好培训应包含以下规则：锁办公室或工作区域的门（保持桌面整洁）；不要在车内留存不受保护的敏感信息；将包含敏感信息的安全存储介质存放在安全的存储设备中；粉碎含有组织信息的纸张；不要向没有授权访问所需的个人泄露敏感信息；不要与家庭成员讨论敏感信息；保护包含敏感组织信息的笔记本电脑和其他移动设备；在讨论敏感信息时注意周围的人；执行公司访问控制程序（以避免尾随进入、窥视屏幕等行为）；熟悉报告违反安全策略行为的正确程序；遵循程序执行良好的密码安全实践。\n\
  \n## 12. 安全港湾原则包括：通知、选择、后续传输、安全、数据完整性、访问和执行。\n\n## 13. 可接受使用政策、互联网使用政策和电子邮件使用政策应该是首批实施的政策之一。\n\
  \n## 14. 培训计划应根据已建立的政策包含要培训的内容（政策列表），并应包含一个初始培训所有员工的计划、跟踪完成情况并定义循环培训的周期。\n\n## 15.\
  \ 数据分类系统确保公司信息得到适当保护。它为公司的处置和销毁政策提供了基础。它对于定义访问控制和基于角色的访问控制也是基础性的。\n\n# 第 10 章\n\n\
  ## 物理安全与环境控制\n\n在本章中，你将：\n\n- 探索环境控制\n- 探索物理安全控制\n- 比较物理安全与环境控制\n- 检查物理安全中的控制类型\n\
  \n物理安全对于处理网络和信息系统安全的企业来说是一个重要课题。企业负责确保其盈利能力，这需要保护组合资产：员工、产品库存、贸易秘密和战略信息。这些及其他重要资产影响公司的盈利能力和未来生存。因此，公司执行许多活动来尝试提供物理安全——锁门、安装报警系统、使用保险箱、部署安保人员、设置访问控制等。\n\
  \n环境控制在保护用于处理信息的系统方面发挥着重要作用。如今大多数公司在网络安全和信息系统安全方面都投入了大量的时间、资金和精力。在本章中，你将学习保护网络和保护信息系统的策略是如何关联的，并将学习几种公司可以减少其可能损害网络安全的物理安全事件暴露风险的方法。\n\
  \n### 环境控制\n\n虽然信息的机密性很重要，但其可用性同样重要。当前的数据中心需要复杂的环境控制。加热和冷却对于计算机系统以及用户都非常重要。在处理信息系统时，灭火是一个重要的考虑因素。电磁干扰（或\
  \ `EMI`）也是一个环境问题。\n\n### HVAC\n\n控制数据中心的温度和湿度对于保持服务器运行至关重要。暖通风和空调（`HVAC`）系统对于保持数据中心冷却至关重要，因为典型的服务器会产生\
  \ 1000 到 2000 BTUs 的热量（`1 BTU` 等于将一磅液态水升高 1 华氏度所需的能量）。\n\n狭窄区域内的多台服务器可能会导致导致机器无法继续运行的过热状况。随着片式计算系统的出现以及许多其他设备尺寸的缩小，这个问题变得更加严重。虽然物理尺寸更小了，但它们倾向于释放相同数量的热量。\n\
  \n### 灭火\n\n根据灭火系统协会（`www.fssa.net`），因重大火灾而关闭的企业中有 43% 从未重新开放。另有 29% 的企业在事件发生三年内失败。因此，快速有效地响应火灾的能力对任何组织的长期成功至关重要。处理潜在的火灾危害和脆弱性一直是组织在风险分析过程中的关注点。目标显然不应让火灾发生，但在发生火灾的情况下，建立相应的机制来限制火灾可能造成的损害是非常重要的。\n\
  \n#### 水基灭火系统\n\n水基灭火系统长期以来且现在仍然是处理和控制结构火灾的主要工具。考虑到如今办公环境中电气设备的数量，以及由于显而易见的原因这些设备对大量水的反应并不良好，因此如果设备受到水基喷淋系统该做什么非常重要。2013\
  \ 年的《NFPA 75：信息技术设备保护标准》概述了可以采取以减少暴露于水中的电子设备损害的措施。该指南包括以下建议：\n\n- 打开柜门，拆除侧板和盖，拉出机箱抽屉让水流出设备。\n\
  - 设置风扇让室温空气通过设备进行通用干燥。将移动设备移至干燥、有空调的区域。\n- 使用压力不超过 `50 psi` 的压缩空气吹出受困的水。\n- 使用手持式吹风机的最低档位来干燥连接器、背板线绕和打印电路卡。\n\
  - 使用棉签擦拭难以触及的地方。轻轻拍打表面以去除残留水分。不要在线绕接端子上使用棉签。\n- 使用含有氟利昂酒精（`Freon-alcohol`）混合物的置换水溶胶喷雾作为干燥关键组件的有效第一步。尽快进行专业的修复。\n\
  \n即使遵循了这些指南，对系统的损害可能已经发生。由于水对电子设备具有很强的破坏性，不仅是因为系统产生电子短路的即时性问题，还因为水可能造成的长期腐蚀损坏，因此人们一直在寻找替代的灭火方法。较常用的替代方法之一是卤素系统。\n\
  \n#### 卤素灭火系统\n\n\n\n\n\n火灾需要燃料、氧气和高温才能发生化学燃烧。如果移除其中任何一种，火灾将无法持续。卤剂（Halon）会干扰火灾中的化学燃烧。尽管卤剂已于\
  \ 1994 年被禁止生产，但今天仍存在许多此类系统。它们最初之所以流行，是因为卤剂会迅速与房间内的空气混合，且不会对计算机系统造成危害。卤剂对人类也是危险的，特别是在处于极高温下（例如火灾中可能出现的温度）时，它会分解成其他有毒化学品。由于这些危险，而且由于卤剂与臭氧层消耗问题有关，新的灭火系统已禁止使用卤剂。需要注意的是，根据环保保护署（EPA）强制不再进一步生产卤剂的规定，现有的系统并不要求销毁。然而，在已释放的系统中更换卤剂将是一个问题，因为只能使用现有的卤剂储量，且成本正变得令人负担不起。由于这个原因，许多机构正在切换到替代方案。这些替代方案被称为`洁净剂灭火系统`，因为它们不仅提供灭火能力，还能保护房间内的物品，包括人员、文件和电子设备。洁净剂的示例包括二氧化碳、氩气、Inergen\
  \ 和 FM-200（七氟丙烷）。\n\n## 洁净剂灭火系统\n\n二氧化碳（CO[2]）长期以来一直被灭火剂。贝尔电话公司在 20 世纪早期使用便携式`CO[2]`灭火器。二氧化碳灭火器攻击火灾发生的所有三个要素。`CO[2]`\
  \ 排除氧气，使剩余氧气量不足以维持火灾。它还能在火灾区域提供一些冷却，并降低“气化”燃料的浓度。氩气通过将氧气浓度降低到可燃物品所需的 15% 以下来灭火。氩气系统设计将氧气含量降低到约\
  \ 12.5%，这低于火灾所需的 15%，但仍高于 EPA 为人体安全要求的 10%。Inergen 是 Ansul 公司的一种产品，由三种气体组成：52% 的氮气、40%\
  \ 的氩气和 8% 的二氧化碳。以纯氩气系统类似的方式，Inergen 系统将氧气水平降低到约 12.5%，这对于人体安全是够的，但不足以维持火灾。另一种用于淘汰卤剂的化学品是`FE-13`，或三氟甲烷。这种化学品最初被开发为化学制冷剂，通过抑制燃烧链反应来扑火。`FE-13`\
  \ 是气态的，不会留下任何损坏设备的残留物，被认为在有人的区域是安全的。其他卤烃也被批准用于替代卤剂系统，包括`FM-200`（七氟丙烷），一种用作哮喘药物喷射器推进剂的化学品。\n\
  \n## 手持灭火器\n\n计算机安全专业人员对其办公室配备的灭火系统类型通常没有太大影响力。然而，让他们意识到安装了什么种类型、在紧急情况下他们应该做什么，以及在系统释放后需要做什么来恢复，是非常重要的。不过，他们可以影响的一个领域是所在区域配备的手持灭火器的类型。\n\
  \n设计为在检测到火灾时释放的自动灭火系统并不是你们应该注意的唯一系统。如果能在自动系统释放之前扑灭并控制火灾，对组织在时间和设备成本（包括自动系统的重新充电）方面可能意味着巨大的节省。办公室里常见手持灭火器，但必须理解其正确使用方法否则可能会发生灾难。\n\
  \n火灾有四种类型，如`表 10-1`所示。每种类型的火灾都有自己的燃料源和扑灭方法。例如，A 类系统设计用于扑灭以普通可燃材料为火源的火灾。这种类型的灭火器可以使用水，因为它对这类火灾有效。正如我们所讨论过的，水不适用于涉及布线或电气设备的火灾。在电气火灾中使用\
  \ A 类灭火器不仅无效，还可能导致额外的损坏。某些灭火器设计为可以对一种一种类别的火灾有效，例如常见的`ABC` 灭火器。这可能是数据处理设施中拥有的系统类型。所有灭火器都应该易于获取并清晰地标记。在任何人使用灭火器之前，他们应该知道是哪种灭火器以及火源是什么。如果有任何疑问，请撤离并让消防队处理情况。\n\
  \n![image](img/t0172-01.jpg)\n\n**表 10-1** 火灾类型与灭火方法\n\n* *\n\n![image](img/examtip.jpg)\n\
  \n**考试提示** 火灾的类型决定了应使用什么类型的灭火器来扑灭。记住，最常见的类型是`ABC` 灭火器，它设计用于处理除易燃金属火之外的所有类型的火灾（后者非常罕见）。\n\
  \n## 火灾探测设备\n\n灭火系统和设备的不可或缺补充是火灾探测设备（火灾探测器）。探测器能够在火灾极早期阶段、在灭火系统激活之前检测到火灾，并发出警告，可能使员工在火灾严重到需要灭火设备介入之前处理。\n\
  \n有几种不同类型的火灾探测器。其中一种有两种品种，由烟雾激活。这两种烟雾探测器是电离式和光电式。光电式探测器能够很好为阴燃火灾提供预警。这种设备监测内部的光束。如果某种东西削弱了光线（例如通过遮挡它），探测器就会认为是烟雾并报警。电离式探测器使用电离室和一个微小的放射性源来检测快速燃烧的火灾。如`图\
  \ 10-1`所示，电离室由两个板组成，一个带正电，一个带负电。空气中的氧气和氮颗粒变得“电离”（分子中释放出一个离子）。带负电的自由离子被正极吸引，而带正电的分子剩余部分被负极吸引。这些粒子的运动产生了设备测量的微小电流。烟雾会抑制这一过程，探测器将检测到电流下降并报警。\n\
  \n![image](img/f0173-01.jpg)\n\n* *\n\n**图 10-1** 电离式类型烟雾探测器的电离室\n\n这两种设备通常被泛称为烟雾探测器，并且可能结合这两种品种。关于烟雾探测器的更多信息，请参阅`[`home.howstuffworks.com/home-improvement/household-safety/fire/smoke2.htm`](http://www.home.howstuffworks.com/home-improvement/household-safety/fire/smoke2.htm)`。由于这两种设备都是由信号中断触发的，无论原因，可能会误报。它们无法区分厨房火灾的烟雾和焦的面包之间的区别。\n\
  \n\n\n\n\n另一种类型的火探测器是由热量激活的。这些设备也有两种型号。固定温度或固定点设备在区域温度一旦超过某些预设电平时就会激活。升温速率（或上升率）温度设备在局部温度突然升高时激活，这可能预示着火灾的初期阶段。升温速率传感器可以提供更早的警报，但也会产生更多的误报。\n\
  \n第三类探测器是火焰激活的。这种类型的设备依靠火灾产生的火焰来提供红外能量的变化，这种变化是可以被检测到的。火焰激活型设备通常比其他两种类型贵，但通常能够更早地检测到火灾。\n\
  \n### EMI 屏蔽\n\n电磁干扰，或 `EMI`，可能会困扰任何类型的电子设备，但典型数据中心中的电路密度使其成为 `EMI` 的避风港。`EMI` 定义为由于电路接收电磁辐射而引起电路的干扰。磁性辐射通过感应进入电路，磁波在电路上产生电荷。对这种磁场的灵敏程度取决于许多因素，包括电路长度（电路可以像天线一样工作）。`EMI`\
  \ 分为两个大类：窄带和宽带。窄带从本质上说是指频带较小的电磁能量，因此通常来自故意在指定频段内传输的设备。宽带涵盖更广泛的频率范围，通常是由某些通用电力使用引起的，如电源线或电动机。\n\
  \n在美国，联邦通信委员会（FCC）负责监管产生 `EMI` 的产品，并制定了一项计划，让设备制造商遵守 `EMI` 抗干扰能力标准。现代电路的设计旨在抵抗 `EMI`。布线就是一个很好的例子；非屏蔽扭绞线（`UTP`）或\
  \ `Category 5` 或 `6` 类线缆中的扭绞是为了防止 `EMI`。`EMI` 还通过接地的金属计算机机箱进行控制；通过提供通向地的地的路径，机箱充当了\
  \ `EMI` 屏蔽层。屏蔽对于网络布线非常重要。不要将长距离的网络布线与电源线并行运行。双绞线提供某种程度的保护，但在工业设施等电噪声较大的环境中，可能需要屏蔽双绞线（`STP`）。\n\
  \n屏蔽更大的例子是法拉第笼或法拉第屏蔽，这是一种接地的导电材料制成的围结构。这些可以是房间大小的，也可以内置在建筑结构中；关键元素是围结构材料没有明显的缝隙。这些措施可以帮助屏蔽\
  \ `EMI`，特别是在高射频环境中。\n\n虽然我们讨论了为了防止 `EMI` 辐射进入电路所必需的屏蔽，但也有技术试图帮助将其留在内部。这种技术被某些人称为\
  \ `TEMPEST`，也被称为范埃克发射（Van Eck emissions）。计算机显示器或 `LCD` 显示器产生的电磁辐射可以使用正确的设备进行远程观察。`TEMPEST`\
  \ 是美国国家安全局（`NSA`）一项旨在保护设备免受此类窃听攻击的计划代号。虽然关于 `TEMPEST` 的某些信息仍保密，但互联网上有描述保护措施的指南，例如屏蔽和抗电磁外壳。某公司甚至开发出了一种提供射频屏蔽的商业油漆。\n\
  \n* *\n\n![image](img/examtip.jpg)\n\n**EXAM TIP** 确保你理解环境控制系统（如 `HVAC` 和灭火系统）背后的原理，以及环境监测和\
  \ `EMI` 屏蔽。\n\n### 热冷通道\n\n向更小型、更高密度服务器演发展的趋势意味着每个机架中有更多的服务器和设备，给冷却系统带来了更大的负载。这促进了热通道/冷通道布局的使用。排列成热通道和冷通道的数据中心规定所有设备上的进气扇都面向冷通道，而所有排气扇都面向相反的通道。`HVAC`\
  \ 系统随后设计为将冷空气推入架空地板下方，并通过冷通道上的穿孔板向上排出。来自热通道的热气会被 `HVAC` 系统的回风道捕获。使用这种布局旨在控制气流，目的是绝不让冷热空气混合。这需要使用封挡板和侧板来关闭开放的机架槽。这种安排的优点是冷却效率更高，并且能够处理更高的密度。\n\
  \n### 环境监测\n\n当涉及信息技术时，*环境监测*是指对数据中心温度和湿度的电子跟踪。使用温度计测量温度的历史可以追溯到 17 世纪。每个人对玻璃水柱型温度计提供的经典模拟温度读都很熟悉，但温度测量越来越多地是电子化的。消费级型号价格便宜，可以接收来自远程无线传输器的读数，允许从室内和室外进行测量。更先进的单元可以跟踪温度、压力、湿度、风速、降水量以及一系列其他数据。由于数据中心通常拥有大量的网络基础设施并越来越多地远程控制，因此将这些环境传感器添加到网络中是最合理的。现代监测应用程序使用传感器阵列测量测量流、温度、湿度和压力。结合数据库软件，可以随时间推移数据中心的环境状况，以便进行扩展规划并在出现问题时提供警报。\n\
  \n### 温度湿度控制\n\n服务器温度是一个常见的问题，但湿度水平同样重要。湿度过高会导致冷区域产生冷凝，湿度过低则会导致静电。\n\n### 物理安全\n\
  \n对于处理网络和信息系统的业务来说，物理安全是一个重要课题。对硬件、网络、服务器、客户端和组件的物理访问可用于破坏安全控制。因此，公司执行许多活动来尝试提供物理安全——锁门、安装报警系统、使用保险箱、部署安保人员、设置访问控制等。\n\
  \n物理访问是获取硬盘镜像最常见的方法，对攻击者来说最大的好处是硬盘镜像不会留下任何犯罪痕迹。除了物理上限制对计算机的访问外，你无法做很多来防止硬盘镜像，但你可以减少其影响。对少数重要文件使用加密即可提供保护。全盘加密保护存储在其上的所有文件。或者，将文件放置在集中文件服务器上可以防止它们从单台机器被镜像，但如果攻击者能够镜像文件服务器，数据将被复制。\n\
  \n集中式存储管理将物理安全问题转移到了机房，但这简化了问题。与其担心许多需要保护的地方，高价值材料的集中存储允许进行集中的安全增强。这允许经济地使用多种物理安全机制，包括锁、报警、摄像头和其他机制。\n\
  \n### 硬件锁\n\n\n\n\n锁具是一种常见的安全措施，其应用范围几乎无处不在。每个人都熟悉使用锁具来保护物品。正如锁具可以防止你的汽车被盗一样，它们也可以保护计算机的安全。笔记本电脑是小偷的热门目标，在使用后后应将其锁在桌子内，或使用特殊的电脑防盗锁进行固定。从汽车中盗取笔记本电脑可能在几秒钟内发生，而且曾有小偷在主人于安检过程中分心时，从机场的安全安检区域偷走了电脑。如果使用台式电脑主机，请使用提供空间可以锁定电脑的计算机办公桌。在某些情况下，贵贵的介质被存储在专为此设计的保险箱中。所有这些措施都可以提高计算机本身的物理安全性，但如果用户不了解安全程序且不遵守程序，大多数措施都可能被攻击者破解。\n\
  \n尽管锁具已经使用了几百年，但它们的设计并没有发生太大变化：使用一个金属“令牌”来对齐机械设备中的销钉。由于所有机械设备都存在公差，因此有可能通过“开锁（picking）”来穿过这些公差。大多数锁都可以用简单的工具轻松打开，其中一些工具在图\
  \ 10-2 所示。\n\n![image](img/f0176-01.jpg)\n\n* * *\n\n**图 10-2** 开锁工具\n\n由于我们人类总是试图制造更棒的捕鼠器，因此高安全性锁被设计用来抵御攻击，例如图\
  \ 10-3 所示的攻击；这些锁比标准的家用插锁系统更复杂。这些锁通常出现在需要高安全性的商业应用中，被设计成能够抵抗开锁、钻孔以及其他常见攻击（例如直接通过门撞击锁具）的手段。高安全性锁的另一个常见特征是`钥匙控制（key\
  \ control）`，它指的是对复制钥匙施加的限制。对于大多数家用锁，去一趟五金店就能让你复制一把钥匙。钥匙控制锁使用专利钥匙孔，只能在锁匠处进行复制，锁匠会对特定钥匙的授权用户进行记录。\n\
  \n![image](img/f0177-01.jpg)\n\n* * *\n\n**图 10-3** 高安全性锁及其钥匙\n\n随着“撞击钥匙（bump keys）”之类的攻击已广为人知且易于获得，高端锁的安全性现在变得更加重要。撞击钥匙是一种所有槽口都切到最大深度的钥匙，也被称为“全九（all\
  \ nines）”。这种钥匙使用一种存在已的技术，但最近变得非常流行。将钥匙插入锁中然后用力撞击，使锁销钉跳到剪切线以上，从而打开锁。高安全性锁通过各种机械手段（如非传统的销钉布局、侧锁，甚至是磁性钥匙）试图防止此类攻击。\n\
  \n### 门禁系统（Mantraps）\n\n实施门禁系统是防止“尾随”（tailgating）的一种方法。门禁由两扇间距很密的门组成，需要用户先后通过第一扇门再通过另一扇门。门禁使得在不被察觉的情况下跟踪通过门口几乎是不可能的——如果你恰好进入第一道门，你会被第二道门困在里面。\n\
  \n* * *\n\n![image](img/examtip.jpg)\n\n**考试提示** 门禁门布局可以防止未经授权的人跟随授权用户通过访问控制门，这也被称为尾随。\n\
  \n### 视频监控\n\n视频监控通常通过闭路电视（CCTV）完成。使用 CCTV 摄像头进行监控至少可以追溯到 1961 年，当时在伦敦交通火车站安装了摄像头。从那时，摄像头组件的发展和成本的降低导致了\
  \ CCTV 行业的蓬勃发展。\n\nCCTV 摄像头用于出于安全目的监控场所。这些系统在银行和珠宝店中很常见，这些地方的高价值商品对小偷非常有吸引力。随着这些系统成本的下降，它们对更多行业领域变得实用。\n\
  \n传统的摄像头是基于模拟的，需要视频多路用器来合并所有信号并在显示器上显示多个视图。基于 IP 的摄像头正在改变这一点，因为它们大多数是独立单元，可以通过网络浏览器进行查看，例如图\
  \ 10-4 所示的摄像头。\n\n![image](img/f0178-01.jpg)\n\n* * *\n\n**图 10-4** 基于 IP 的摄像头利用现有的\
  \ IP 网络，而不需要专用的 CCTV 线缆。\n\n这些基于 IP 的系统增加了实用的功能，例如从互联网检查建筑的能力。然而，这种网络功能使得摄像头容易受到普通的\
  \ IP 网络攻击。在入室盗发生时对 CCTV 系统发动 DoS 攻击是任何人都不希望发生的事情（除了罪犯）。由于这种原因，基于 IP 的  应该放置在独立的网络上，仅供安全人员访问。旧的录像带正在逐渐被数字录像机取代。技术进步很大，但当这些设备连接网络时要小心。\n\
  \n如果你依赖 CCTV 系统来保护组织的资产，请仔细考虑摄像头的放置。不同的虹膜类型、焦距以及色彩或红外能力都是使某个位置优于另一个位置摄像头的选项。\n\n\
  ### 围栏\n\n围栏作为财产周围的物理屏障。它们可以限制人员进入和离开，防止在未经授权区域移动。围栏可以是物理安全计划的重要部分。如果使用得，它可以帮助防止未经授权的访客。在建筑墙之外，许多组织倾向于设置边界围栏，可以使用铁丝网进行增强。防爬围栏看起来是由密集的垂直立柱构成的围栏，用于需要额外规模和防篡能力的高安全性实施方案。\n\
  \n\n\n\n\n访问列表在物理世界中的工作方式与在电子世界中相同。访问列表定义了被授权使用资源的个人组。进入服务器房、进入设备房以及保护敏感区域的锁具的钥匙，都是需要访问控制的元素示例。\n\
  \n许多组织使用电子访问控制系统来控制门的开启。使用近距离读卡器和非接触式访问卡可以向控制面板提供用户信息。门道通过电子电磁锁和磁锁进行电子控制。这些设备依赖于来自控制面板的电子信号来释放保持门关闭状态的机构。这些设备被集成到一个访问控制系统中，该系统控制并记录连接到它的所有门的入入情况，通常通过使用访问令牌来实现。通过一个中心化的系统，可以根据访问列表和对给用户的令牌的读取，即时授予或拒绝访问，从而提高了安全性。这种系统还会记录用户访问情况，为特定用户在受控环境中的存在提供不可否认性。系统将允许对人员进入进行记录、对人员移动进行审计以及对访问控制进行实时监控。\n\
  \n### 适当照明\n适当的光照明对于物理安全至关重要。无光或光线昏暗的区域会让入侵者潜伏并进行未经授权的活动，而不会面临保安或其他人员观察的显著风险。建筑外部照明对于确保未经授权的活动在不被观察和响应的情况下发生非常重要。内部照明同样重要，因为它让更多的人能够观察到活动并发现不正常状况。正如后文在“屏障”部分描述的，窗户在协助观察场所方面可以起到重要作用。让敏感区域照明良好并能通过窗户进行观察，可以防止本会在秘密情况下发生的活动。如果服务器位于中心位置、周围有窗户环绕且照明良好，那么服务器房内的未经授权方更容易被检测到。\n\
  \n### 标志牌\n标志牌作为信息设备，可以以多种方式协助物理安全。标志牌可以提供有关限制区域的信息，或指示需要采取特定预防措施（如保持门锁好）的地方。高安全设施中标志牌的一个常见用途是界定访客允许区域与需要陪同的安保区域。视觉安全线索可以帮助提醒用户需要特定的安全预防措施。关于所需保护类型的视觉线索可以表现为不同颜色的名牌（规定了访问级别）、指示访客身份的视觉吊挂绳、彩色文件夹等。\n\
  \n### 保安\n保安提供了一种极佳的安全措施，因为保安是具有直接安全责任的可见存在。其他员工期望保安在确保设施安全方面表现出特定的行为。保安通常监控出入口，并可以维护谁进入和离开建筑的访问日志。在许多组织中，每个以访客身份通过安全检查的人都必须在日志上签名，这对于追踪谁在何种地点以及为什么非常有用。\n\
  \n安全人员在物理保护承载信息资产的机器方面很有帮助，但为了从他们的存在中获得最大的利益，他们必须接受训练，采取全面的安全防护方法。数据的价值通常可以是存储这些数据的机器价值的许多倍。保安通常不是计算机安全专家，因此他们需要接受有关数据价值的教育，并接受网络安全以及涉及用户的物理安全方面的培训。他们是公司发现可疑活动的眼睛和耳朵，因此网络安全部门需要培训他们也注意到可疑的网络活动。夜间多个分机连续响响、所有电脑同时重启，或者有奇怪的人停在停车场里并放着笔记本电脑或其他移动计算设备，都是网络攻击的指标，如果没有经过适当培训，可能会漏掉这些迹。\n\
  \n### 屏障\n大多数物理攻击的主要防御措施是资产与潜在攻击者之间的屏障——墙、栅栏、门和大门。某些组织还聘用全职或兼职的私人安保人员试图保护其资产。这些屏障是所有其他安全计划的基础，但安全必须仔细设计，因为攻击者只需要找到一个缝隙即可进入。屏障也可以用于控制对建筑物或结构的车辆访问。\n\
  \n![image](img/examtip.jpg)\n\n**考试提示** 所有进入服务器房和机房的入口点都应受到控制，并尽可能通过访问系统进行记录。\n\n\
  墙可能是人类最早的发明之一。在他们学会利用山脉等自然障碍将自己隔离开后，他们随后学会了建造自己的*山脉*。英国的哈德亚墙、中国长城和柏林墙都是这种基础防御的著名例子。建筑的墙具有相同的目的，但规模较小：它们为资产提供了屏障。在信息资产的情况下，最有价值的资产包含在服务器上。为了保护物理服务器，必须观察所有方向。服务器房是否使用了吊顶？内墙是否延伸到实际屋顶、架空地板或爬行空间？服务器房的访问应限制在需要访问的人员，而不是组织的所有员工。\n\
  \n![image](img/note.jpg)\n\n**注意** 有窗户还是没有窗户？窗户提供了可视性，允许人们观察服务器房内的活动。如果那些观察者有权查看服务器房的活动，这提供了安全性。如果外部人员没有这种权限，则应避免使用窗户。\n\
  \n另一种防止秘密访问的方法是通过使用窗户。许多高安全区域有很多窗户，以便人员在区域内的活动无法被隐藏。没有窗户的封闭服务器房为某人在不担心被发现的情况下访问设备提供了一个安静的地方。窗户消除了许多犯罪分子用来实现进入和非法活动的隐私元素。\n\
  \n### 生物识别\n生物识别通过对某些生物因素的测量来识别特定个人。这些因素基于人体独特的部位。最为人知的独特生物因素是指纹。指纹识别器已在笔记本电脑和其他移动设备中（如图\
  \ 10-6 所示）以及作为独立的 USB 设备使用了多年。\n\n![image](img/f0182-01.jpg)\n\n**图 10-6** 新的笔记本电脑通常带有指纹识别器。\n\
  \n\n\n\n然而，还可以使用许多生物因素，例如眼睛的视网膜或虹膜、手的几何结构以及脸部的几何结构。当这些因素被用于身份验证时，过程分为两个部分：注册和随后的验证。在注册期间，计算机获取生物因素的图像并将其还原为数值。当用户尝试身份验证时，读取器会扫描其特征，计算机将读取到的数值与数据库中存储的数值进行比较。如果两者匹配，则允许访问。由于这些物理因素是唯一的，理论上，只有实际的授权人员才会被允许访问。但在现实世界中，生物识别背后的理论会失效。带有数字代码的令牌（Tokens）效果良好，因为一切都停留在数字领域。计算机根据数据库检查你的代码（例如\
  \ `123`）；如果计算机发现了 `123` 且该数字具有访问权限，计算机就会打开门。然而，生物识别获取的是模拟信号（如指纹或脸部），并尝试将其数字化，然后与数据库中的数字进行匹配。模拟信号的问题在于，它两次的编码方式可能并不相同。例如，如果你去上班时下巴上贴了绷带，基于脸部的生物识别会允许你进入还是拒绝你？\n\
  \n设计这些系统的工程师理解到，如果系统被设置为精确检查，编码后的生物识别可能永远无法授予访问权限，因为它两次扫描生物识别的方式可能永远不同。因此，大多数系统都尝试在扫描中允许一定量的误差，同时不允许过多。这导致了误报（false\
  \ positives）和漏报（false negatives）的概念。当扫描生物识别并允许未授权的人访问时，就发生了`false positive`（假阳性）——例如，两个指纹非常相似的人被计算机识别为同一个人，从而向错误的人授予访问权限。当系统拒绝实际上已授权的人访问时，就发生了`false\
  \ negative`（阴性）——例如，手部几何扫描仪的用户忘记佩戴他常戴的戒指，计算机没有识别出他的手并拒绝了他的访问。为了让生物身份验证能够正常工作并获得信任，它必须尽可能地减少误报和漏报的存在。要做到这一点，必须在精确与误差之间建立平衡，使机器允许允许细微的物理差异——但不能太大。\n\
  \n### 误报与漏报\n\n当根据信息和相关的概率范围做出决策时，就会产生错误判断条件。`图 10-7` 展示了两个重叠的概率；某项属于左侧曲线或右侧曲线，但不同兼者。在判断某项属于哪条曲线时出现出现在曲线重叠时。\n\
  \n![image](img/f0183-01.jpg)\n\n**图 10-7** 重叠概率\n\n当存在重叠区域时，通常被称为`false positive\
  \ and false negative rate`（误报和漏报率）。注意，在随附图中，重叠的大小被大大夸大了以便观察。`图 10-8` 展示了一个误报检测。如果观察到的值是虚线，那么它可以被视为匹配或不匹配。如果实际上它不应该匹配，而系统将其标记为匹配，那么就是一个误报。在生物识别中，误报将允许未经授权的访问。\n\
  \n![image](img/f0184-01.jpg)\n\n**图 10-8** 误报\n\n`图 10-9` 展示了一个漏报检测。如果观察到的值是虚线，那么它可以被视为匹配或不匹配。如果实际上它应该匹配，而系统将其标记为不匹配，那么就是一个漏报。漏报将阻止授权用户获得访问权限。\n\
  \n![image](img/f0184-02.jpg)\n\n**图 10-9** 漏报\n\n为了解决误报和漏报问题，概率引擎必须产生两组不重叠的曲线。这等同于极低的（`<0.001%`）误报和漏报率。因为曲线技术上具有无限延伸的尾部，所以会有某些误差率，但这些数字必须极小以确保安全。`图\
  \ 10-10` 展示了理想的（但通常不可行的）曲线分离。生物识别的另一个担忧是人体特征会发生变化。如果有人能够复制机器扫描的特征（例如通过玻璃上的指纹），他们就拥有了访问权限。更换丢失或被盗的令牌很容易，但替换被盗窃的人手要困难得多。生物识别的另一个问题是人体部位会发生变化。脸部会因为疤痕、体重减轻或增加或手术而变化。指纹会因受伤而变化。视网膜会受到糖尿病的影响。所有这些变化都迫使生物系统对读取的内容允许更高的容忍度。这导致了高安全设施转向多因素身份认证。\n\
  \n![image](img/f0185-01.jpg)\n\n**图 10-10** 理想情况\n\n### 受保护布线（布线）\n\n拦截网络流量始终应该是安全团队考虑的问题。防止实际布线被窃听不是大多数安全人员考虑的话题，但在高安全网络中，这可能是重要的。就像交换机和路由器应该放在锁好的房间内防止未经访问一样，网络布线也需要物理保护。在网络流量需要安全措施的地方，通过物理保护布线来保护流量可能是重要的。\n\
  \n### 报警\n\n报警的作用是提醒人员异常状况。物理安全可以涉及许多传感器、入侵报警、运动检测器、门禁开关、视频和音频监控等。这些每个系统都可以收集有用信息，但只有在采取行动时，信息才真正有用。当这些系统之一具有对操作人员有用的信息时，报警是提醒人员状况最简单的方法。报警并不简单；如果报警条件太多，尤其是误报，那么操作人员就不会按预期对状况做出反应。\n\
  \n### 运动检测\n\n在监控区域的未经授权活动时，一个潜在实用的工具是运动检测器。在预计没有流量的区域，运动检测器可以提醒操作人员区域内的活动。运动检测器有很多类型，但大多数基于红外（热量）辐射，并能检测人体移动的变化。它们可以根据大小进行调整，忽略户外环境中的较小动物运动。\n\
  \n\n\n\n正如安全控制措施在信息安全中起着作用一样，适当的应用控制措施有助于与物理安全相关的风险管理。控制措施有多种类型，下文描述。\n\n![image](img/examtip.jpg)\n\
  \n**考试提示** 物理安全控制措施的类型在考试中经常会被测——建议记忆。\n\n*   **威慑 (Deterrent)**：威慑性控制通过降低成功概率来影响攻击者。例如增加惩罚的法律法规。\n\
  *   **预防 (Preventive)**：预防性控制是防止特定动作发生的控制，例如防撞门（mantrap）可以防止尾随进入。预防性控制在事件发生之前作用，阻止其进展。\n\
  *   **检测 (Detective)**：检测性控制有助于检测物理安全违规。检测性控制在事件发生期间作用，提醒操作人员特定状况。报警是检测性控制的常见示例。\n\
  *   **纠正 (Corrective)**：纠正性控制用于事件后，旨在尽可能地减少损害程度。备份是纠正性控制的典型示例，因为它们可以快速恢复运行。\n* \
  \  **补偿 (Compensating)**：当无法直接满足某项要求时使用的补偿性控制。灭火系统不能阻止火灾损坏，但如果使用得当，它们可以减轻或限制火灾造成的损害。\n\
  *   **技术 (Technical)**：技术性控制是指使用某种形式的技术来解决物理安全问题。生物识别就是技术性控制。\n*   **行政 (Administrative)**：行政性控制用于限制物理安全风险的策略或程序。对守卫的指令即为行政性控制。\n\
  \nNIST 在其 `NIST SP 800-53` 文档中提供了控制措施目录。目前的修订版第 4 版列出了 600 多项控制措施，分为 18 个功能类别。这\
  \ 18 个功能类别归分为三大类：管理、技术和运营。尽管这些控制措施中的绝大多数与信息的电子安全有关，但其中许多延伸到了物理世界。意识与培训、访问控制、介质保护以及物理和环境保护等元素与物理安全活动直接相关。\n\
  \n## 章节回顾\n\n在本章中，你熟悉了物理安全的原理。环境控制、灭火、EMI 屏蔽、冷热通道、环境监控以及温度湿度控制在如何保护系统方面进行了详细介绍。本章涵盖了旨在协助企业控制对信息系统网络及其组件访问的物理安全控制措施。它研究了用于确保系统同时具有可靠性和恢复能力的控制措施，包括环境控制和灭火方法。本章还研究了保护信号免受未经授权的部分意外丢失或拦截的屏蔽等元素。\n\
  \n本章以对控制措施类型及其使用方式的检查结束。这些控制措施运行在物理领域，而不是大多数安全控制措施所处的纯电子领域。这些控制措施对于确保系统免受可能干扰操作的物理向量的影响非常有用。\n\
  \n### 习\n\n为了帮助你进一步准备 CompTIA Security+ 考试，并测试你的准备程度，请回答以下问题，然后与章节末的正确答案进行比对。\n\n\
