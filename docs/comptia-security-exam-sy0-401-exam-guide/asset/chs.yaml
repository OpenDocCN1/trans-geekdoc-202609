  ### 9. BYOD 策略应包括：使用强密码锁定设备、数据加密、在一段时间未活动后自动锁定设备、设备丢失或被盗时远程锁定、在一定次数失败登录尝试后自动擦除，以及设备丢失或被盗时远程擦除。\n\
  ### 10. BYOD 模糊了设备所有权和公司数据所有权的边界。另一个挑战是公司数据和个人数据的共享位置。\n### 11. 抓取联系人/电话列表的应用程序、窃取数据的恶意软件、设备的物理丢失以及窥屏查看屏幕上的敏感信息。\n\
  ### 12. 接受公司数据及其在设备上的限制（远程擦除）、开启自动锁定的责任、设备的物理保护、仅使用批准的应用程序、报告被盗或丢失设备的责任、保持设备操作系统和应用程序更新的责任、公司\
  \ MDM 解决方案的影响。\n### 13. MDM 策略应要求：\n* 使用强密码锁定设备\n* 数据加密\n* 在一段时间未活动后自动锁定设备\n* 设备丢失或被盗时远程锁定\n\
  * 在一定次数失败登录尝试后自动擦除\n* 设备丢失或被盗时远程擦除\n### 14. 密码、密钥库安全性、设备加密、设备锁定、失败登录保护、防病毒/恶意软件保护、应用程序安全。\n\
  ### 15. 未能接受新更新、内部保护机制状态未知、与许可相关的法律问题。\n\n## 第 19 章\n\n## 基于主机的安全\n\n在本章中，你将：\n\
  * 发现建立主机安全的适当解决方案\n* 理解如何实施适当的控制以确保数据安全\n* 检查基于主机的安全控制和应用程序\n* 学习如何在多个环境中确保数据安全\n\
  \n### 主机安全\n\n基于主机的安全采取细粒度的安全视角，重点保护每台计算机和设备，而不是整个网络。当使用基于主机的安全时，依靠每台计算机保护自己。\n\n\
  大多数环境充满了不同的操作系统（Windows、Linux、OS X）、这些操作系统的不同版本以及不同类型的安装应用程序。此外，今天移动设备操作系统的主机安全是一个重要的安全问题，这使得操作系统列表扩展到了\
  \ iOS、Android 和 BlackBerry。每个操作系统的安全配置都不同，相同操作系统的不同版本之间实际上也存在差异。\n\n主机安全很重要，并且应该始终被关注。然而，安全不应止于此，因为主机安全是与网络安全相结合的互补过程。如果单个主机计算机内部存在漏洞，那么网络安全可以提供另一层保护，希望阻止那些已经进入环境内部的入侵者。\n\
  \n\n\n\n\n早期版本的家庭操作系统没有为不同用户提供独立的命名账户。这被视为一种便利性机制；毕竟，谁想去受登录机器的麻烦呢？这导致了一个简单的问题：所有用户都可以查看、修改和删除其他人的内容。虽然可以使用访问控制机制来隔离内容，但这需要对操作系统进行配置以管理每个用户的身份。许多操作系统的早期版本几乎所有选项都处于开启状态。同样，这也是出于方便性考虑，但它导致系统运行了它们从未用过的进程和服务，并不必要地增加了主机的攻击面。\n\
  \n确定正确的设置并正确实施它们是加固主机系统的重要步骤。本章将探讨为了在主机系统上实现合理的安全水平，需要恰善使用的多种控制和选项。\n\n## 操作系统加固\
  \ (OS Hardening)\n\n操作系统开发者和制造商都面临着一个共同的问题：他们无法预判用户社区对产品提出的各种不同配置和变体。因此，制造商并没有花费无数的时间和资金尝试满足每种需求，而是为其产品提供“默认”安装，这通常包含基础操作系统以及一些常用的常用选项，如驱动程序、实用程序和增强功能。由于操作系统可以用于各种用途，并可以放置在任何数量的逻辑位置（局域、DMZ、WAN\
  \ 等），制造商在安全方面通常无所作为。制造商可能会提供一些建议或简化的工具和设置来帮助保护系统，但通常情况下，终端用户负责自己系统的安全。这通常涉及删除不必要的应用程序和实用程序、禁用不需要的服务、对文件设置适当权限，并将操作系统和应用程序代码更新到最新版本。\n\
  \n这种保护操作系统的过程被称为 `hardening`（加固），目的是使系统更具抵抗力，就像装甲或钢材经过硬化变得不易破碎或损坏一样。每个操作系统都有自己的安全方法，虽然加固过程通常是相同的，但针对每个操作系统必须采取不同的步骤。为生产环境准备和加固操作系统并非易事；它需要准备和规划。遗憾的是，许多用户并不理解有效保护系统的必要步骤，导致每天都有数百个系统被破解。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 系统加固是准备和保护系统的过程，涉及移除所有不必要的软件和服务。\n\
  \n你必须满足几个关键要求，以确保本节描述的系统加固过程达到其安全目标。这些要求独立于操作系统，并且应该是所有系统维护操作的正常部分：\n\n- 所有操作系统和应用程序软件的基础安装均来自可信源，并使用哈希值验证正确性。\n\
  - 在安装、加固和更新过程中，机器仅连接到完全可信的网络。\n- 基础安装包含操作系统和应用程序的所有当前服务包和更新。\n- 在加固和更新后拍摄备份镜像，以便系统恢复到已知状态。\n\
  \n这些步骤确保你了解机器上有什么内容，可以验证其真实性，并拥有一个已建立备份版本。\n\n## 反恶意软件 (Anti-malware)\n\n在 PC 使用的早期，威胁是有限的：大多数家庭用户并非通过宽带连接连接到互联网，最常见的威胁是通过感染的软盘在计算机之间传播的病毒（就像医学定义一样，计算机病毒是可以感染主机并自我复制的东西）。但自那些早期以来，情况发生了巨大变化，现在的威胁带来的风险比以往任何时候都大。根据\
  \ SANS 网络风暴中心，互联网上未打补丁的 Windows PC 的平均生存时间小于 60 分钟（`http://isc.sans.org/survivaltime.html`）。这是自动探测发现、渗透并破解系统之前的估计时间。来自僵尸网络和蠕虫的自动探测并不是网络上唯一的威胁——还有通过电子邮件传播的病毒和恶意软件、钓鱼网站、访问时会在你的系统中执行代码的受感染网站、广告软件、间谍软件等。幸运的是，随着威胁复杂性和能力的增加，旨在阻止它们的产品也在不断增强。\n\
  \n### 杀毒软件 (Antivirus)\n\n杀毒软件尝试识别、中和或移除恶意程序、宏和文件。这些产品最初旨在检测和删除计算机病毒，但许多杀毒软件现在都包含了额外的安全产品和功能。\n\
  \n尽管杀毒软件已经有了近二十年的时间来完善其能力，但杀毒软件的目的未变：检测并消除计算机病毒和恶意软件。大多数杀毒软件在扫描病毒时结合了以下方法：\n\n-\
  \ **基于特征的扫描 (Signature-based scanning)**：类似于入侵检测系统 (`IDS`)，杀毒软件扫描程序、文件、宏、电子邮件和其他数据，以寻找已知的蠕虫、病毒和恶意软件。杀毒软件包含包含数千个已知病毒特征的病毒字典，由于每天都会发现新病毒，必须频繁更新。这种方法可以捕已知病毒，但受限于病毒字典——它不知道的内容就无法捕获。\n\
  - **启发式扫描（或分析) (Heuristic scanning)**：启发式扫描不依赖病毒字典。相反，它寻找可疑行为——任何不符合受保护系统上运行的操作系统和应用程序“正常”行为模式的行为。\n\
  \n由于基于特征的扫描是一个熟悉的概念，让我们详细检查一下启发式扫描。`Heuristic scanning`（启发式扫描）通常寻找应用程序中通常不会发现的命令或指令，例如访问保留内存寄存器的尝试。大多数杀毒软件在它们的启发式扫描中使用基于权重的系统或基于规则的系统（更有效的产品结合了这两种技术）。`weight-based\
  \ system`（基于权重系统）根据行为相关的威胁程度对每个可疑行为进行评分。如果根据单一行为或组合行为超过了设定阈值，杀毒软件会将执行该行为的进程、应用程序、宏等视为系统威胁。`rule-based\
  \ system`（基于规则系统）将活动与用于检测和识别恶意软件的规则集进行比较。如果软件的部分匹配规则，或者进程、应用程序、宏等执行了与规则匹配的行为，杀毒软件将将其视为对本地系统的威胁。\n\
  \n某些启发式产品非常先进，包含了检查内存使用和址的能力、检查可执行代码的解析器、逻辑流分析器以及反汇编器/模拟器，以便它们可以“猜测”代码的设计目的以及是否具有恶意。\n\
  \n\n\n\n\n与 IDS/IPS 产品一样，加密和混淆也给杀毒软件构成了挑战：任何无法读取的内容都无法与当前的病毒字典或活动模式进行匹配。为了对抗恶意软件和病毒中的加密技术，许多启发式扫描器会寻找加密和解密循环。由于恶意软件通常被设计为独立且无人看管地运行，如果它使用了加密，则必须包含所有按需加密和解密自身的指令。启发式扫描器会寻找此类指令，例如使用有效内存地址初始化指针、操作计数器，或基于计数器值的分支条件。虽然这些操作并不总是意味着加密/解密循环的存在，但如果启发式引擎能够找到循环，它可能能够在受保护的内存空间（如模拟器）中解密软件，并对软件进行更详细的评估。许多病毒共享加密/解密程序，这有助于杀毒软件开发人员。\n\
  \n目前的杀毒产品具有高度的可配置性，大多数产品都具备以下功能：\n\n- **自动更新**：一个良好的杀毒解决方案最重要的功能可能是其能够通过频繁自动下载最新的病毒特征来保持自身更新。这通常要求系统以某种方式连接互联网，并每天（或更频繁地）执行更新。\n\
  - **自动扫描**：大多数杀毒产品允许调度自动扫描，以便你可以指定杀毒产品检查本地系统受感染文件的时间。这些自动扫描通常可以安排在特定的日期和时间，并可以配置扫描参数以指定扫描哪些驱动器、目录和文件类型。\n\
  - **媒体扫描**：可移动介质仍然是病毒和恶意软件传播的常见方法，大多数杀毒产品可以配置为在本地系统连接或访问光介质、USB 驱动器、内存或其他任何类型的可移动介质时立即进行自动扫描。\n\
  - **手动扫描**：许多杀毒产品允许用户“按需要”扫描驱动器、文件或目录（文件夹）。\n- **邮件扫描**：电子邮件仍然是病毒和恶意软件传播的主要方法。许多杀毒产品赋予用户扫描收件箱件邮件以及任何附件的能力。\n\
  - **处理**：当杀毒产品检测到受感染的文件或应用程序时，它通常可以执行几种操作之一。杀毒产品可能会将文件隔离，使其无法访问；它可能会尝试通过移除感染或违规代码来修复文件；或者可能会删除受感染的文件。大多数杀毒产品允许用户指定所需的操作，某些产品允许操作升级，例如在可能的情况下清理受感染的文件，如果无法清理则隔离文件。\n\
  \n杀毒解决方案通常安装在单个系统（桌面电脑、服务器甚至移动设备）上，但许多商业网关产品也提供了基于网络的杀毒功能。这些网关产品通常将防火墙、IDS/IPS 和杀毒功能集成到单一的平台中。大多数组织还在电子邮件服务器上采用杀毒解决方案，因为这仍然是病毒非常流行的传播方法。\n\
  \n尽管安装良好的杀毒软件仍被认为是一种必要的最佳实践，但人们对杀毒软件应对不断发展的威胁的有效性日益担忧。早期的病毒通常表现出破坏性行为；编写质量较差；经过修改的文件；而且对隐藏行迹的关注不如传播。我们正看到由专业人士创建的病毒和恶意软件（有时由犯罪组织或政府资助），它们竭尽全力隐藏行迹。这些病毒和恶意软件通常用于窃取敏感信息，或将受感染的\
  \ PC 变成僵尸网络的一部分，用于垃圾邮件或攻击操作。\n\n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 杀毒软件是所有平台上不可或缺的安全应用程序。\n\
  \n### 反垃圾邮件\n\n`spam`（垃圾邮件）是各地用户和系统管理员的噩梦，它本质上是未经请求或不受欢迎的批量电子信息。虽然通常应用于电子邮件，但可以通过短信发送到手机和移动设备、作为互联网论坛帖子或其他方式传输。如果你用过电子邮件账户，很可能你收到过垃圾邮件。\n\
  \n从生产力和安全角度来看，垃圾邮件每年给企业和用户造成数十亿美元的损失，这是一个如此普遍的问题，以至于美国会通过了 2003 年的《CAN-SPAM 法》，授权联邦贸易委员会执行该法案，并授权司法部对垃圾邮件发送者实施刑事制裁。该法案对发送商业电子邮件的人制定了要求，规定了违反法律的垃圾邮件发送者以及在垃圾邮件中投放广告公司的处罚，并赋予消费者要求邮件发送者停止发送垃圾邮件的权利。然而，尽管我们付出了巨大努力，垃圾邮件仍然源不断；随着阻止垃圾邮件的技术和手段变得越来越先进复杂，发送这些未经请求信息的工具和技术也随之增加。\n\
  \n以下是一些用于对抗垃圾邮件泛滥的流行方法；其中大多数技术用于过滤电子邮件，但也可以应用于其他介质：\n\n- **黑名单**：黑名单本质上是记录哪些域名和源地址有发送垃圾邮件的声誉，并拒绝来自这些域名和源地址的消息。这基本上是一种永久的“忽略”或“来电”类型的功能。几个组织和一些商业公司提供了已知垃圾邮件发送者列表。\n\
  - **内容或关键词过滤**：与互联网内容过滤类似，这种方法过滤电子邮件消息中的不受欢迎内容或垃圾邮件迹象。类似于对网页内容的内容过滤，基于关键词等内容过滤电子邮件可能会导致意想不到的结果，因为某些术语可能同时出现在合法邮件和垃圾邮件中。大多数内容过滤技术使用正则表达式匹配进行关键词过滤。\n\
  - **可信服务器**：黑名单的相反，可信服务器列表包含了被“信任”为不会转发垃圾邮件的 `SMTP` 服务器。\n- **基于延迟的过滤**：某些简单邮件传输协议（`SMTP`）服务器被配置在建立连接和发送\
  \ `SMTP` 服务器欢迎语之间插入故意延迟。某些生成垃圾邮件的程序不会等待该欢迎语，任何在连接打开后立即开始发送数据的系统会被视为垃圾邮件生成器并被 `SMTP`\
  \ 服务器丢弃。\n- **PTR 和反向 DNS 检查**：某些电子邮件过滤器检查邮件发送者的源域名。如果反向检查显示邮件来自拨号用户、家庭宽带或动态分配的地址，或者具有通用域名或缺失域名，那么过滤器将拒绝它，因为这些是垃圾邮件消息的常见来源。\n\
  - **回调验证**：由于许多垃圾邮件使用伪造的“发件人”地址，某些过滤器尝试验证入站邮件的“发件人”地址。接收服务器可以联系发送服务器以尝试验证发送地址，但这并不总是有效的，因为伪造的地址有时是经过验证的有效电子邮件地址。\n\
  \n\n\n\n\n- **统计过滤**：统计过滤非常类似于文档分类系统。用户将收到的消息标记为垃圾邮件或合法邮件，过滤系统会从用户的输入中学习。看到并分类为垃圾邮件的消息越多，过滤软件拦截入站垃圾邮件的能力就越强。垃圾邮件发送者通过在消息中插入随机单词和字符来反制许多过滤技术，使得内容过滤器难以识别垃圾邮件的共同模式。\n\
  - **基于规则的过滤**：基于规则的过滤是一种简单的技术，仅查找某些字段或关键词的匹配。例如，基于规则的过滤系统可能会查找主题中包含“发财”字样的任何消息。许多流行的电子邮件客户端都具有实现基于规则过滤的功能。\n\
  - **出站过滤**：一些组织会对离开其组织的电子邮件执行垃圾邮件过滤，这被称为出站过滤。可以使用相同类型的反垃圾邮件技术来验证和过滤出站邮件，以对抗垃圾邮件。\n\
  - **混合过滤**：大多数商业反垃圾邮件方法使用混合过滤，或使用几种不同技术的组合来对抗垃圾邮件。例如，过滤解决方案可能会将每条入站消息与已知的垃圾邮件发送者进行匹配，然后与基于规则的过滤器匹配，接着是内容过滤器，最后与基于统计的过滤器匹配。如果消息通过了所有过滤阶段，它将被视为合法消息；否则，将作为垃圾邮件被拒绝。\n\
  \n许多垃圾邮件过滤是在网络或 SMTP 服务器级别完成的。使用集中解决方案扫描所有入站和出站消息，比在整个组织的终端用户机器上部署单独的解决方案要有效得多。电子邮件默认本质上是一种代理服务：消息通常进入并离开组织的邮件服务器。（用户通常不会连接到远程\
  \ SMTP 服务器来发送和接收消息，但他们可以这样做。）反垃圾邮件解决方案以软件形式存在，加载在 SMTP 服务器本身上，或者加载在次要服务器上，在消息到达\
  \ SMTP 服务器之前或消息被 SMTP 服务器处理之后对其进行处理。反垃圾邮件解决方案还以设备的形式存在，软件和硬件是一个单一集成的解决方案。许多集中的反垃圾邮件方法允许个人用户为其特定的收件箱自定义垃圾邮件过滤，指定他们自己的过滤规则和评估入站邮件的标准。\n\
  \n### 反间谍软件\n\n大多数杀毒产品还将包含反间谍软件功能。虽然杀毒程序的设计目的是监控向文件系统写入文件，但许多当前形式的恶意软件会避开文件系统以避免这种形式的检测。较新的杀毒产品正在适应并扫描内存，同时监控文件系统的访问，试图检测高级恶意软件。`Spyware`\
  \ 是用于定义旨在从系统中窃取信息的恶意软件的术语，例如击键、密码、PIN 和密钥。反间谍软件帮助你的系统免受日益增加的恶意软件泛滥，这些恶意软件试图监控你的击键、窃取你的密码并将敏感信息报告给攻击者。许多此类攻击向量在系统内存中运行，以避免被轻易检测。\n\
  \n### 弹出窗口拦截器\n\n网页浏览相关的最令人恼的困扰之一是弹出广告。弹出广告是为了吸引网络流量访问特定网站、捕获电子邮件地址投放产品以及执行其他任务设计的在线广告。如果你在互联网上冲浪超过了一个一小时，你无疑见过它们。当你正在访问的网站为了显示广告而打开新的网页浏览器窗口时，弹出广告就创建了。弹出广告通常出现在你当前浏览器窗口的前面，吸引你的注意力（并干扰你的浏览）。弹出广告的程度从轻微烦恼（产生一或两个弹出窗口）到导致系统瘫痪（如果恶意网站尝试在你的系统上打开成千上万个弹出窗口）不等。\n\
  \n与弹出广告类似的是弹出后广告，它会在你当前的浏览器窗口后面打开。在关掉当前窗口之前，你看不到这些广告，某些人认为它们比弹出窗口不那么烦。另一种弹出窗口形式是悬停广告，它使用动态\
  \ HTML 显示为覆盖在你的浏览器窗口之上的浮动窗口。对于某些用户来说，弹出广告像垃圾邮件一样不受欢迎，许多网络浏览器现在允许用户使用内置在网络浏览器中或作为插件提供的功能来限制或阻止弹出窗口。Internet\
  \ Explorer 包含一个内置的弹出拦截器（如图 19-1 所示，并在 Internet Explorer 11 的“工具”菜单中可用）。\n\n![image](img/f0349-01.jpg)\n\
  \n**图 19-1** IE 11 中的弹出拦截器\n\nFirefox 也包含一个内置的弹出拦截器（通过选择“工具 | 选项”然后选择“内容”选项卡可用）。流行的插件，如\
  \ Google 和 Yahoo! 工具栏也包含弹出拦截器。如果这些免费提供的选项不能满足你的需求，来自 McAfee、Symantec 和 Check Point\
  \ 的许多商业安全套件也包含弹出拦截功能。用户在选择弹出拦截器时必须小心，因为一些不道德的开发者创建了伪装成免费弹出拦截器或其他安全工具的广告软件。\n\n![image](img/examtip.jpg)\n\
  \n**考试提示** 弹出窗口拦截器用于防止网站在没有特定用户同意的情况下打开额外的网页浏览器窗口或标签页。\n\n弹出广告可以通过多种方式生成，包括 JavaScript\
  \ 和 Adobe Flash，一个有效的弹出拦截器必须能够处理用于创建弹出窗口的许多方法。当创建弹出窗口时，用户通常可以点击弹出窗口内部的关闭或取消按钮，或者通过操作系统提供的可用方法关闭新窗口（例如从任务栏关闭窗口）。由于他们在\
  \ Web 开发环境中使用可以使用的高级功能，一些不道德的开发者对他们弹出窗口中的关闭或取消按钮编写程序，以启动新的弹出窗口、重定向用户、在本地系统上运行命令，甚至加载软件。\n\
  \n弹出窗口不应与广告软件混淆。弹出窗口是你访问页面时出现的广告。广告软件是广告支持的软件。在安装广告软件后，广告软件会自动在你的计算机上下载并显示广告，这些广告通常在使用软件期间显示。广告软件通常被吹称为“免费”软件，因为用户不需要为软件付费，但在使用软件之前必须同意允许下载并显示广告。这种方法在智能手机和移动移动设备上非常流行。\n\
  \n### 补丁管理\n\n大多数计算机程序都是由几十甚至数千个独立个人编写的相互关联软件模块的大型复杂组合。随着过去几年向基于 GUI 的功能和增强能力的推动，操作系统持续增长和扩展。供应商通常遵循软件更新的层级结构：\n\
  \n- **热补丁 (Hotfix)**：此术语指的是（通常是）小的软件更新，旨在解决特定问题，例如应用程序中的缓冲区溢出，这会导致系统暴露在攻击之下。热补丁通常是针对发现的问题开发的，并迅速制作和发布。热补丁通常处理关键的安全相关问题，应尽快应用于受影响的应用程序或操作系统。\n\
  \n\n\n\n\n- **补丁 (Patch)**：该术语通常指的是更正式、规模更大的软件更新，它可能解决多个或许多软件问题。补丁通常包含功能增强或额外能力，以及对已知漏洞的修复。补丁的开发周期通常较长。\n\
  - **服务包 (Service pack)**：该术语通常指的是将大量的补丁和热修复（hotfixes）整合成一个单一的、规模较大的包。服务包的设计旨在让系统一次性提升到已知的良好水平，而不是要求用户或系统管理员单独下载几十个或上百个更新。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 所有的软件随着时间的推移都需要更改/补丁。管理补丁是安全计划中不可或缺的环节。\n\
  \n## 操作系统补丁\n\nWindows 7 包含约 4000 万行代码，尽管它可能不是最大的一个，但其他现代操作系统也处于同一数量级。随着操作系统的不断增长和新功能的引入，代码出现问题的可能性也随之增加。操作系统厂商几乎不可能在每个可能的平台、每种可能的情况下测试其产品，因此在操作系统发布后确实会出现功能和安全问题。对于普通用户或系统管理员来说，这意味着会有持续不断的更新流，旨在纠正问题、替换代码段，甚至为已安装的操作系统添加新功能。\n\
  \n从 Linux 到 Windows，每个操作系统都需要软件更新，而且每个操作系统都有不同的方法来帮助用户保持系统处于最新状态。例如，微软通常会在其网站上提供供下载的更新。虽然大多数管理员或技术精通的用户可能倾向于单独识别并下载更新，但微软意识到非技术用户更倾向于更简单的方法，而微软已将这种方法内置到其操作系统中。在\
  \ Windows 7、8 和 Windows Server 2012 中，微软提供了自动化更新功能，一旦配置完成，它将定位任何所需的更新，将其下载到你的系统，并根据你的喜好甚至可以安装这些更新。在\
  \ Microsoft Windows 中，`Windows Update` 工具（参见图 19-2）可以按需搜索更新，或配置为自动扫描、下载甚至自动安装更新——本质上与具有新界面的自动更新功能相同。`Windows\
  \ Update` 的一个非常好的特性是能够扫描并下载其他微软软件（如 Office）的补丁，以及操作系统自身的更新和补丁。\n\n![image](img/f0351-01.jpg)\n\
  \n![image](img/f0352-01.jpg)\n\n***\n\n**图 19-2** Windows Update 工具截图\n\n如何为 Linux\
  \ 系统打补丁很大程度上取决于所使用的特定版本以及正在应用的补丁。在某些情况下，补丁将由一系列手动步骤组成，需要管理员替换文件、更改权限并修改目录。在其他情况下，补丁是可执行的脚本或工具，会自动执行补丁操作。某些\
  \ Linux 版本（如 Red Hat）内置了处理补丁过程的工具。在这些情况下，管理员下载特定格式的文件，然后由补丁工具处理该文件以执行需要进行的任何修改或更新。\n\
  \n无论你使用哪种方法更新操作系统，保持系统处于最新状态至关重要。新的安全公告每天都会发布，虽然缓冲区溢出今天可能是一个“潜在”问题，但它在不久的将来几乎会变成一个“确定”的问题。就像建立操作系统基准和初始安全保护的步骤一样，保持每个系统都打上补丁并保持最新状态对于保护系统及其包含的信息至关重要。\n\
  \n## 应用更新\n\n正如操作系统需要补丁一样，应用程序也需要。管理各种应用程序以及来自许多不同软件供应商的所需更新可能是一项巨大的挑战。这为补丁管理软件创造了一个利基市场。在大多数企业中，使用了某种形式的自动化补丁管理解决方案，既为了减少劳动，也为了确保在整个企业范围内应用更新。\n\
  \n## 应用白名单与黑名单\n\n可以在操作系统层面控制应用程序，这通过白名单（Whitelisting）或黑名单（Blacklisting）来实现。`黑名单`\
  \ 本质上是记录哪些应用程序不应运行。白名单则相反：它由允许运行的应用程序列表组成。这两种方法都有优缺点。黑名单在应对动态威胁时很难使用，因为可以轻松避免特定的应用程序。白名单则更容易实施——可以使用哈希值确保可执行文件未被篡改。其挑战在于，对于单一用途的机器（例如数据库服务器），白名单相对容易实施；对于多功能机器，则可能更为复杂。\n\
  \n微软提供了两种内置机制来控制用户可以使用哪些应用程序：\n\n- **软件限制策略**：通过组策略实施，允许脚本和可执行文件进行大量控制。主要模式是基于机器而非用户账户。\n\
  - **用户帐户级控制**：通过 `AppLocker` 实施，允许控制哪些用户执行哪些程序。通过规则，企业可以对访问和使用软件施加大量控制。\n\n在 Linux\
  \ 平台上，第三方供应商应用程序也提供了类似的功能。\n\n## 可信操作系统 (Trusted OS)\n\n`可信操作系统`是一种设计用于运行时允许多级安全的操作系统。它通过满足美国政府要求的一系列标准进一步定义。创建和维护可信系统的成本很高，因为任何更改通常都需要经过重新认证。定义可信操作系统最常用的标准是信息技术安全通用标准（简称为共同标准或\
  \ `CC`），这是由美国、加拿大、英国以及大多数欧盟国家在内的许多国家认可的统一安全标准。Windows、Linux、大型操作系统和特殊操作系统的版本已通过不同标准的认证。\n\
  \n## 主机防火墙\n\n个人防火墙是基于主机的保护机制，监控并控制进出单个系统的流量。为终端用户设计的软件防火墙通常具有可配置的安全策略，允许用户确定哪些流量是“良好的”并允许通过，哪些流量是“坏的”并被拦截。软件防火墙非常常见——大多数现代操作系统都自带了某种个人防火墙。\n\
  \n从 Windows XP 专业版开始，微软在所有现代 Windows 操作系统中包含了基于主机的防火墙解决方案。`Windows Firewall` 具有良好的配置性；它可以设置为阻塞所有流量、为允许通过的流量设置例外，并记录被拒绝的流量以供以后分析。在每个系统中，微软都扩展了防火墙的功能和可配置性。\n\
  \nLinux 系统多年来内置了基于软件的防火墙（参见图 19-3），包括 `TCP Wrappers`、`ipchains` 和 `iptables`。\n\n\
  ![image](img/f0354-01.jpg)\n\n***\n\n\n\n\n## 主机入侵检测\n\n第一代入侵检测系统是基于主机的，旨在检查特定主机的活动。基于主机的入侵检测系统（HIDS）检查日志文件、审计日志以及进入或离开特定主机的网络流量。HIDS\
  \ 可以以实时模式运行，监控正在发生的活动，也可以以批处理模式运行，定期检查活动。基于主机的系统通常是独立的，但许多新的商业产品被设计为向中央系统报告并由其管理。基于主机的系统在运行时还需要本地系统资源。也就是说，HIDS\
  \ 会消耗其受保护系统的部分内存和 CPU 周期。早期的 HIDS 以批处理模式运行，每小时或每天检查一次异常活动，通常只查看系统日志中的特定事件。随着处理器速度的提高，后版本的\
  \ HIDS 能够实时查看日志文件，甚至增加了检查主机正在生成和接收的数据流量的能力。\n\n大多数 HIDS 关注本地操作系统生成的日志文件或审计日志。在 Linux\
  \ 系统上，检查的日志通常包括由 syslog 创建的日志，例如消息、内核日志和错误日志。在 Windows 系统上，检查的日志通常是三个主要的“事件”日志：应用程序、系统和安全。某些\
  \ HIDS 还可以覆盖特定的应用程序（如 FTP 或 Web 服务），通过检查这些特定应用程序产生的日志或检查这些服务的流量来实现。在日志文件中，HIDS 正在寻找代表敌意行为的活动或：\n\
  \n- 身份验证失败\n- 登录\n- 添加新账户\n- 修改关键文件\n- 启动或停止\n- 权限提升\n\n通常，HIDS 的工作方式相似。（图 19-4\
  \ 显示了典型的 HIDS 布局）。\n\n\n\n`user interface`（用户界面）是 IDS 的可见部分——人类与之交互的部分。用户界面根据产品和供应商的不同差异很大，可以是从详细的\
  \ GUI 到简单命令行的任何形式。无论类型和复杂程度如何，界面的目的是为了允许用户与系统进行交互：更改参数、接收警报、调整签名和响应模式等。\n\n为了更好地理解\
  \ HIDS 如何运行，请查看 Linux 系统和 Windows 系统的示例。\n\n### Linux 系统 HIDS\n在 Linux 系统上，HIDS\
  \ 可能会检查许多系统日志之一——基本上是包含系统发生情况记录条目的大文本文件。对于本示例，请考虑 Red Hat 系统上 `messages` 日志中的以下几行：\n\
  \n```\nJan 5 18:20:39 jeep su(pam_unix)[32478]: session opened for user bob by (uid=0)\n\
  Jan 5 18:20:47 jeep su(pam_unix)[32516]: authentication failure;\nlogname= uid=502\
  \ euid=0 tty= ruser=bob rhost= user=root\nJan 5 18:20:53 jeep su(pam_unix)[32517]:\
  \ authentication failure; logname= id=502 euid=0 tty= ruser=bob rhost= user=root\n\
  Jan 5 18:21:06 jeep su(pam_unix)[32519]: authentication failure; logname= uid=502\
  \ euid=0 tty= ruser=bob rhost= user=root\n```\n\n在第一行中，你看到一个名为 `bob` 的用户打开了会话。这通常表明账户\
  \ `bob` 登录了系统。在接下来的三行中，你看到用户 `bob` 尝试成为 `root` 时身份验证失败——这是一个可以在系统上执行任何操作的超级用户。在这种情况下，用户\
  \ `bob` 尝试了三次成为 `root` 但每次尝试都失败了。这种活动模式可能有许多不同的含义——`bob` 可能是一个忘记了 `root` 账户密码的管理员，`bob`\
  \ 可能是一个管理员而有人在没有告诉他的情况下更改了 `root` 密码，`bob` 可能是一个尝试猜测 `root` 密码的用户，或者攻击者可能破解了用户 `bob`\
  \ 的账户，现在正尝试破解系统上的 `root` 账户。在任何情况下，HIDS 将通过其决策树来确定消息日志中的身份验证失败是否是需要检查的内容。在此实例中，当\
  \ IDS 检查日志中的这些行时，它会注意到日志中的三行匹配了它被告知要查找的模式之一（由决策树信息和签名数据库确定），并且它会做出相应的反应，通常是生成某种类型的警报或告警，这些会显示在用户界面或电子邮件、页面或其他形式的消息中。\n\
  \n### Windows 系统 HIDS\n在 Windows 系统上，HIDS 可能会检查由操作系统生成的应用程序日志。三个主要日志（`Application`、`System`\
  \ 和 `Security`）与 LINUX 系统上的日志类似，尽管 Windows 日志不是以文本文件存储的，通常需要工具或应用程序（如 `Event Viewer`）来读取它们。\n\
  \n![image](img/n0358-01.jpg)\n\n在 `Security` 日志的前三行中，你看到一个针对登录/注销（Logon/Logoff）过程的失败审计条目。这表明有人尝试登录系统三次，且每次都失败了（类似于我们的\
  \ Linux 示例）。在 Windows `Event Viewer` 工具中展开日志条目之前，你还看不到账户名称，但对于本示例，假设它是 `Administrator`\
  \ 账户——这是 Windows 对应的 root 账户。在这里你再次看到了三次登录失败——如果 HIDS 被程序化为查找失败的登录尝试，那么它在检查这些日志条目时将生成告警。尽管\
  \ Linux 和 Windows 之间的日志看起来不同，但做出适当判断的必要信息都包含在其中；系统只需要从操作系统格式中提取它们即可。\n\n***\n\n\
  ![image](img/examtip.jpg)\n\n> **考试贴士**：基于主机的入侵检测系统和基于主机的防火墙可以在深度防御策略中提供额外的安全层。\n\
  \n### HIDS 的优势\nHIDS 具有某些优势，使其成为某些情况下的良好选择：\n\n*   **它们具有很强的操作系统特定性，并拥有更详细的签名**。HIDS\
  \ 可以经过专门设计，以运行在特定的操作系统上或保护某些应用程序。这种狭的关注让开发者能够专注于影响他们试图保护的特定环境的具体因素。通过这种关注，开发者可以避免通用的警报，并开发出更具体、更详细的签名来更准确地识别恶意流量。\n\
  *   **它们可以降低假报率**。在特定系统上运行时，IDS 进程更有可能判断正在检查的活动是否为恶意活动。通过更准确地识别哪些活动是“坏的”，IDS 将产生更少的假报（当流量匹配模式但实际上并非恶意活动时生成的警报）。\n\
  *   **它们可以在数据解密后进行检查**。随着安全担忧的不断增加，许多开发者开始对网络通信进行加密。如果以正确的方式设计和实现，HIDS 将能够检查网络型\
  \ IDS 无法读取的流量。随着越来越多的网站开始加密其流量，这种特殊能力正变得越来越重要。\n*   **它们可以是针对特定的**。在主机层级，IDS 可以被设计、修改或调整，以在特定应用程序上运行得良好。可以为特定版本的\
  \ Web 服务器软件、FTP 服务器、邮件服务器或托管在该主机上的任何其他应用程序构建特定的签名。\n*   **它们可以判断警报是否会影响该系统**。确定特定活动是否会真正影响系统的能力有助于减少生成的警报数量。因为\
  \ IDS 驻留在系统内部，所以它在分析流量时可以验证补丁级别、文件是否存在以及系统状态等信息。通过了解系统处于什么状态，IDS 可以更准确地判断某项活动是否具有危害。\n\
  \n### HIDS 的劣势\nHIDS 也有某些劣势，在决定部署此类技术时必须进行权衡：\n\n*   **IDS 必须在你监控的每个系统中运行一个进程**。你必须在想要监控的每个主机上安装\
  \ IDS 进程或应用程序。因此，要监控 100 个系统，你就需要部署 100 个 HIDS。\n*   **IDS 可能有较高的拥有和维护成本**。取决于特定的供应商和应用程序，HIDS\
  \ 在时间和人力方面的成本可能相当。除非 HIDS 是允许管理员维护远程进程的中心控制台，否则管理员必须单独维护每个 IDS 进程。即使有了中心控制台，使用 HIDS\
  \ 也会有大量的进程需要维护、软件需要更新以及参数需要调优。\n*   **IDS 使用本地系统资源**。为了运行，HIDS 必须使用其试图保护的系统的 CPU\
  \ 周期和内存。IDS 使用的任何资源都无法供系统执行其其他功能。这在高流量 Web 服务器等应用程序上变得极其重要，因为在这些地方，资源越少意味着服务的访问者越少，并且需要更多系统来处理预期的流量。\n\
  \n\n\n\n-   IDS 的视角非常局限，无法与周围的活动建立联系。HIDS 对世界的视野有限，因为它只能看到其正在保护的主机上的活动。对于网络周围的流量或其他主机上正在发生的事件，它几乎或完全没有可见性。因此，HIDS\
  \ 只能告诉你它运行的系统是否正遭受攻击。\n-   如果将 IDS 日志记录在本地，它可能会被破坏或禁用。当 IDS 产生警报时，它通常会将警报信息存储在某种文件或数据库中。如果\
  \ HIDS 将其生成的警报流量存储在本地系统中，成功攻入系统的攻击者可能能够修改或删除这些警报。这使得安全人员难以发现入侵者并进行任何类型的事后调查。能力高超的入侵者甚至能够完全关闭\
  \ `IDS` 进程。\n\n#### 主动型与被动型 HIDS\n\n大多数 IDS 可以根据它们检查周围活动的方式以及是否与这些活动进行交互来区分。这对于\
  \ HIDS 来说无疑如此。在被动系统中，IDS 正如其名——它只是简单地观察活动、分析并生成警报。它不会以任何方式与活动本身交互，也不会通过修改系统的防御态来响应流量。被动\
  \ IDS 类似于简单的运动传感器——当它匹配到模式时，它会生成警报，就像运动传感器看到移动时生成警报一样。\n\n主动 IDS 包含了与被动 IDS 相同的所有组件和能力，但有一个关键区别——主动\
  \ IDS 能够对它正在分析的活动做出反应。这些反应可以从简单的操作（例如运行脚本来开启或关闭进程）到复杂的操作（例如修改文件权限、终止违规进程、注销特定用户以及重新配置本地功能以防止特定用户在接下来的\
  \ 12 小时内登录）。响应的深度和广度取决于实施者的想象力，因为脚本可以自动化任何操作。\n\n#### HIDS 的复兴与进步\n\n过去几年中，HIDS\
  \ 的使用出现了强劲的复兴。随着处理器性能的巨大进步、多核处理器的引入以及硬盘和内存系统容量的增加，运行 HIDS 的某些传统障碍已经克服。结合全天候宽带连接的普及、远程办公使用的增加以及对计算机安全需求整体意识的提高，诸如\
  \ HIDS 这样的解决方案开始成为企业和家庭用户眼中既具有吸引力且有时是有效的解决方案。\n\n新一代 HIDS 引入了新的功能，旨在通过防止攻击从根本上执行或访问受保护的文件来阻止攻击，而不是依赖于仅匹配已知攻击的特定签名集。更先进的基于主机的产品（大多数供应商将其称为主机入侵入侵防御系统，即\
  \ IPS）将以下元素整合成一个软件包中：\n\n-   **集成系统防火墙**：防火墙组件检查所有进入和离开主机的网络流量。用户可以针对他们想要允许进入或流出系统的各种流量类型设置规则。\n\
  -   **基于行为和签名的 IDS**：这种混合方法使用签名来匹配已知的攻击，并使用通用模式来捕获没有签名的“零日”或未知攻击。\n-   **应用程序控制**：这允许管理员控制应用程序在系统上的使用情况，以及是否可以安装新应用程序。控制现有软件的添加、删除或修改可以是控制系统基准并防止恶意软件安装的好方法。\n\
  -   **企业级管理**：某些基于主机的产品在安装时带有“代理”，允许它们由中央服务器管理并向其报告。这种集成远程管理能力在任何大规模的主机级 IDS/IPS\
  \ 部署中都是至关重要的。\n-   **恶意软件检测与防护**：某些 HIDS/HIPS 包含针对间谍软件、恶意软件、根基包和其他恶意软件的扫描和防护功能。\n\
  \n#### 硬件安全\n\n服务器、工作站甚至移动设备等形式的硬件可能代表企业相关安全系统中的弱点或漏洞。虽然硬件在丢失或被盗后可以很容易更换，但设备包含的信息使局面变得复杂。数据或信息可以通过备份防止丢失，但对于防止其泄露给未经授权的方作用不大。虽然有加密等软件措施可以提供帮助，但这些在扩展性和密钥分发方面也有缺点。\n\
  \n应该采用一些硬件保护机制来保护服务器、工作站和移动设备中的信息。移动设备可以使用钢链锁以防被盗。锁柜和保险箱可用于保护便携介质、USB 驱动器和 CD/DVD。物理安全将在第\
  \ 10 章中进行详细介绍。\n\n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 物理安全是安全计划中不可或缺的元素。对硬件和网络组件的非法访问会导致许多安全措施失效。\n\
  \n#### 主机软件基准\n\n为了有效且一致地保护系统上的软件，你必须采取结构化和逻辑化的方法。这始于检查系统的预期功能和能力，以确定系统上将运行哪些进程和应用程序。作为最佳实践，任何运行不必需的内容都应该在系统上删除或禁用；然后，应应用所有适当的补丁、热修复和设置来对其保护和加固。\n\
  \n这种建立软件基础状态的过程被称为建立基准（baselining），其产物是安全基准，允许软件安全可靠地运行。在安全方面，软件和硬件是紧密分的，因此必须结合考虑。一旦针对特定的硬件和软件组合完成了处理，任何类似的系统都可以使用相同的基准进行配置，以实现相同水平和深度的安全与保护。\n\
  \n\n\n\n\n# 简介\n\n虚拟化技术允许计算机拥有多个操作系统（OS），并且在许多情况下它们可以同时运行。虚拟化是操作系统层的一种抽象，创建了在单一硬件上托管多个操作系统的能力。虚拟化的主要优势之一是软件与硬件的分离，这创建了一个可以改进许多系统功能（包括安全性）的屏障。底层硬件被称为主机（host\
  \ machine），其上运行着主机操作系统（host OS）。主机操作系统内置了虚拟机管理程序功能，或者需要一个应用程序来提供虚拟机管理程序功能以管理虚拟机（`VMs`）。虚拟机通常被称为客户操作系统（guest\
  \ OSs）。\n\n***\n\n![image](img/examtip.jpg)\n\n**考试要点** 虚拟机管理程序（hypervisor）是虚拟机与宿主机硬件之间的接口。虚拟机管理程序是实现虚拟化的层。\n\
  \n新的操作系统在设计时原生集成了虚拟化钩子，使得虚拟机的使用更加容易。目前有几种常见的虚拟化解决方案，包括 `Microsoft Hyper-V`、`VMware`、`Oracle\
  \ VM VirtualBox`、`Parallels` 和 `Citrix Xen`。区分虚拟化与允许不同操作系统在硬件上启动的引导加载程序（boot loaders）非常重要。苹果的\
  \ `Boot Camp` 允许你在 Apple 硬件上启动 `Microsoft Windows`。这与 `Parallels` 不同，后者是针对 Apple\
  \ 硬件具有完全虚拟化能力的产品。\n\n虚拟化基于主机的系统管理提供了许多便利。从允许轻松回滚到以前状态的快照，到通过预配置镜像实现快速系统部署、便捷备份以及测试系统的能力，虚拟化为所有者提供了许多优势。操作软件层与硬件层的分离可以改进系统管理的许多方面。\n\
  \n## 虚拟化优势\n\n### 快照 (Snapshots)\n`snapshot`（快照）是虚拟机状态在某一时间点的保存。快照具有巨大的实用价值，因为它们就像整个系统的保存点。快照可以将系统回滚到之前的某个时间点、撤销操作，或者为出错的复杂系统级性更改提供快速恢复手段。快照作为一种备份形式，通常比正常的系统备份和恢复操作快得多。\n\
  \n### 补丁兼容性 (Patch Compatibility)\n在虚拟环境中运行操作系统并不会改变与操作系统相关的安全性需求。仍然需要并应该应用补丁，这与虚拟化状态如何无关。由于虚拟环境的特性，它对打补丁的效用没有影响，因为补丁是针对客户操作系统的。\n\
  \n### 主机可用性/弹性 (Host Availability/Elasticity)\n设置虚拟化环境时，保护主机操作系统和虚拟机管理程序层对于系统稳定性至关重要。最佳实践是避免在主机级机器上安装任何应用程序。所有应用都应存放并运行在虚拟环境中。通过提供应用程序与主机操作系统之间的分离，有助于稳定性。`elasticity`（弹性）一词是指系统根据系统需求扩展或收缩的能力。虚拟化的优势之一是虚拟机可以根据需要移动到更大或更小的环境中。如果\
  \ `VM` 需要更多的处理能力，那么将 `VM` 迁移到具有更大 `CPU` 容量的新硬件系统将允许系统进行扩展而无需重新构建。\n\n### 安全控制测试\
  \ (Security Control Testing)\n在对系统应用安全控制以管理安全操作时，测试这些控制以确保它们提供了预期的结果非常重要。将系统放入 `VM`\
  \ 并不会改变这一要求。事实上，由于客户操作系统到虚拟机管理程序之间的关系，这可能会使其变得复杂。专门对虚拟环境内的所有安全控制进行测试，以确保它们的行为仍然有效是至关重要的。\n\
  \n### 沙箱 (Sandboxing)\n`Sandboxing`（沙箱）指的是系统与其环境的隔离或屏蔽。虚拟化可以作为针对整个系统的沙箱形式。你可以构建一个\
  \ `VM`，在 `VM` 内部测试某些内容，并根据结果对稳定性或存在的任何担忧做出决定。\n\n## 基于主机的安全控制 (Host-based Security\
  \ Controls)\n\n在主机上可以实施安全控制，其明确目的是为主机提供数据保护。本节将探索实施适当控制以确保数据安全的方法。\n\n### 云存储存储\
  \ (Cloud Storage)\n`Cloud computing`（云计算）是利用在线资源进行存储、处理或两者。在云端存储数据时，可以使用加密来保护数据，使得实际存储的是加密数据。这降低了数据在传输到云端和返回过程中以及存储期间的数据泄露风险。\n\
  \n### SAN\n存储区域网络（`SAN`）是通过次级专用网络存储数据的一种手段。`SAN` 的运行方式连接数据存储设备，就像本地存储一样，但它们是独立的，可以是磁盘、磁带和其他存储设备的集合。由于专用网络与普通的\
  \ `IP` 网络分离，访问 `SAN` 需要通过一个连接的机器之一。这使得 `SANs` 比其他形式的存储稍微安全一点，尽管通过受攻击的客户端机器丢失数据仍然是一个风险。\n\
  \n### 处理大数据 (Handling Big Data)\n`Big data`（大数据）是许多企业使用的海量数据集的行业术语。拍字节（PB）、艾字节（EB）甚至泽字节范围的数据集现在正在某些应用程序中被探索。这些规模的数据集需要特殊的硬件和软件来处理，但这并不能减轻对安全性的需求。在这种规模上规划安全性需要企业级的思维，但值得注意的是，最终某些信息的子集会进入主机使用。在这一点上，数据是脆弱的，因为无论大型存储系统采取了什么保护方案，数据现在已经超出了该范围。这意味着本地保护机制（例如由\
  \ `Kerberos` 认证提供的机制）对于管理这种类型的保护方案至关重要。\n\n### 数据加密 (Data Encryption)\n数据加密仍然是数据安全的最佳解决方案。经过适当加密的数据未经授权的人无法读取。在主机上实施这种程度的保护有许多方法。\n\
  \n#### 全盘加密 (Full Disk)\n`Full disk encryption`（全盘加密）指的是对整个分区进行单次操作加密。当需要特定元素时，这些扇区会被解密并使用。这提供了一个简单的便利因素，并确保所有数据都得到了保护。这确实会有性能代价，因为解密和加密操作需要时间。对于某些高性能数据存储，特别是那些有延迟问题的存储，这种性能损耗可能是关键的。虽然可以使用专用硬件获得更好的性能，但与所有安全控制一样，需要对相关风险与成本进行评估。\n\
  \n#### 数据库 (Database)\n主流数据库引擎内置了加密功能。这些加密方案的优势在于它们可以根据数据结构进行定制，保护关键列而不影响不敏感的列。采用数据库加密要求将数据模式及其安全需求设计到数据库实现中。其优势在于对任何数据库破解提供了更好的保护，而且与其他替代方案相比，性能损耗通常可以忽略不计。\n\
  \n#### 单个文件 (Individual Files)\n\n\n\n\n在系统中也可以对单个文件进行加密。这可以在操作系统（OS）层面完成，也可以通过第三方应用程序完成。管理单个文件加密可能比较棘，因为它变成了加密密钥的安全性问题。当使用操作系统内置的加密方法时，密钥问题由操作系统本身解决，采用单一密钥并将其与用户凭据一起存储。将数据传输给另一个用户时，单个文件加密的优势之一就体现出来了。通过电子邮件等不受保护的通道传输单个文件，通过单文件加密可以安全地完成。\n\
  \n## 可移除介质\n\n可移除介质其本质使其可以移动到另一个位置，因此保护设备上存储的数据至关重要。加密再次成为首选工具，广泛的加密方法支持可移除介质。`Microsoft\
  \ BitLocker` 构建于企业版、Ultimate 和 Pro 版操作系统，提供了对可移除介质的数据。\n\n## 移动设备\n\n移动设备安全在第 18\
  \ 章中详细介绍，当关键或敏感数据传输到移动设备时也至关重要。移动设备的保护超越了简单的加密，因为设备可以作为系统的授权终端，会产生攻击途径。\n\n## 基于硬件的加密\n\
  \n基于硬件的加密设备旨在通过硬件而非系统上的软件进行加密/解密操作。这些解决方案提供了性能和安全优势。\n\n### TPM\n\n信任平台模块（TPM）是主板上的硬件解决方案，协助密钥的生成和存储。当加密密钥存储在\
  \ `TPM` 中时，它们无法通过普通软件访问，并且与硬盘或其他数据位置物理隔离。\n\n### HSM\n\n硬件安全模块（HSM）是用于管理或存储加密密钥的设备，也可以协助哈希、加密或数字签名等操作。`HSMs`\
  \ 通常是通过 `USB` 连接的外围设备，它们具有篡改保护机制以防止访问其密钥。由于其专用设计，当企业进行大量的加密操作时，`HSMs` 可以提供性能优势。\n\
  \n*\n\n![image](img/examtip.jpg)\n\n**考试提示** 在任何地方存储私钥都会导致丢失风险。`HSMs` 的设计用于防止此类主机威胁。\n\
  \n### USB 加密\n\n通用串行线（USB）提供了一种连接设备到计算机的简单机制。当数据通过 `USB` 连接时，它通常位于便携设备上，因此需要适当的安全级别。存在许多机制，从\
  \ `USB` 设备本身的加密到数据移动之前的启用加密，每种机制都有优缺点，最终根据数据的敏感性由用户来选择最佳方法。\n\n### 硬盘\n\n由于硬盘用于存储信息，提供加密服务的硬盘可以在性能和安全方面提供灵活性。今天可以购买集成\
  \ `AES` 加密的硬盘，以便硬盘内容是安全的，密钥可以单独存储在 `TPM` 中。这比其他软件解决方案提供了大量的性能和安全增强。\n\n## 数据安全\n\
  \n数据或信息是企业中最需要保护的元素。设备可以被购买、替换而不会产生后果；正在处理的信息具有价值。数据安全是指为了保护数据而采取的行动，无论数据位于何处：传输、静态或使用。\n\
  \n### 传输数据\n\n数据在企业中具有价值，但为了充分实现价值，数据元素需要在系统之间共享和移动。每当数据在传输中从一个系统移动到另一个系统时，就需要被保护。这种保护最常见的方法是通过加密。重要的是确保数据始终获得与数据安全故障风险程度正比的保护。\n\
  \n### 静态数据\n\n静态数据指的是被存储的数据。数据以多种格式存储：文件、数据库和结构化元素。无论是 `ASCII`、`XML`、`JavaScript\
  \ Object Notation (JSON)` 还是数据库，无论存储在什么介质上，静态数据仍然需要与其价值相相应的保护。同样，与传输数据一样，加密是防止未经授权访问或篡改的最佳手段。\n\
  \n### 使用中数据\n\n数据在应用程序中处理，用于各种功能，并在位于系统内存中甚至在处理过程中可能会面临风险。在使用过程中保护数据比在传输或存储时保护它要困难得多。虽然在其他情况下可以使用加密，但对加密数据执行操作是不切行的。这意味着需要采取其他措施来保护数据。保护内存方案和地址空间随机化是防止数据安全故障的两种工具。安全编码原则（包括在不再需要时彻底删除关键数据元素）可以帮助保护使用中的数据。\n\
  \n*\n\n![image](img/examtip.jpg)\n\n**考试提示** 理解保护传输、静态和使用这三个阶段数据的需要是一个重要概念。第一步是识别数据所处的阶段，第二步是识别该阶段正确的保护手段。\n\
  \n### 权限/ACL\n\n访问控制列表（ACLs）构成了机器安全的基石之一。操作系统可以使用 `ACLs` 来判断用户是否可以访问资源。这种级别的权限限制为资源提供了显著保护，并将访问控制问题的管理转移到了\
  \ `ACLs` 的管理，这是一个更小且更容易管理的问题。\n\n### 数据策略\n\n数据需要与与其丢失或篡改风险相匹配的保护。数据安全策略是确定数据敏感级别和管理数据安全结构的最佳方法。数据安全策略的核心是识别风险，通常通过数据分级完成。一旦完成了这一步，就可以处理安全数据的任务。\n\
  \n#### 擦除\n\n\n\n\n删除文件的操作实际上并没有从文件系统中删除数据。要真正销毁数据本身，需要一种更密集且具侵入性的程序，被称为 `wiping`（擦除）。擦除通过进入数据结构并将要销毁的数据替换为替代模式来实现工作。目前有可用的应用程序可以对系统执行不同级的数据擦除，从而破坏信息。擦除还可以用于清除文件空间的其他区域，数据可能曾经在那里但现在已消失。清除碎片空间（slack\
  \ space）和空闲空间是防止使用后数据泄露的重要因素。（需要注意的是：现代日志文件操作系统可以跟踪所有的更改，包括擦除，这使得撤销各种形式的擦除成为可能。）尽管操作系统中的这些安全措施既耗时又枯燥，但除非在擦除操作期间暂停它们，否则会影响良好的数据卫生。\n\
  \n## 处置\n处置数据似乎很简单——只需删除文件即可。但正如刚才讨论的，文件删除并不是那样工作的。此外，人们如何知道某组特定数据的副本存储在哪里呢？当从数据为中心的角度处理处置问题时，会出现此类之的问题，例如，“所有副本存在于何？”当从设备的角度来看，问题变为“在我们处置设备之前，设备是否已经擦除？”这两个方面都需要通过数据安全策略解决。\n\
  \n## 留存\n`Data retention`（数据留存）是处理你应该保留数据多久的活动。虽然“永远”似乎是一个简单的答案，但取决于数据，它并不一定是正确的答案。某些数据在一段时间后在企业内部不再有进一步用途，保留它们只会浪费资源。其他元素可能有法律或监管要求，规定数据必须保留一段最短时间。数据留存策略应清楚地解决这些因素，以确保数据在需要期间一直保留，并拥有一种机制来确定何时可以安全地处置。\n\
  \n## 存储\n数据保护策略应包含有关如何在存储中保护数据等细节。这些细节应同时涵盖电子存储和物理存储（一旦打印，纸张可能需要进行物理安全保护）。该策略还应该就密钥管理和加密级别提供存储方面的保护方法。\n\
  \n## 本章复\n在本章中，你熟悉了保护主机机器背后的原理，包括运行在上面的上的数据和应用程序。本章从检查操作系统开始，介绍了如何对其进行加固，以及安全软件和补丁实践的标准安全预防措施。接下来它涵盖了与物理访问相关的话，随后介绍了防火墙、入侵检测的安全应用以及应用程序白名单。虚拟化及其影响在章的前半部分也得到了涵盖。\n\
  \n本章的后半部分涵盖了数据安全主题，包括加密、策略以及使用适当的控制来确保数据安全。你阅读了关于特定硬件设备的使用，包括 `TPM` 和 `HSMs`，以及如何跨企业管理数据，从云到\
  \ `SAN` 再到可移动媒体。\n\n## 问题\n为了帮助你进一步为 CompTIA Security+ 考试做好准备，并测试你的就绪程度，请回答以下问题，然后与章末的正确答案进行比对。\n\
  \n1. 你被要求为你公司举办的会议设置一个临时的互联网咖啡馆。你有十台笔记本电脑要在咖啡馆使用，并在设置好并运行它们后防止它们“溜走”。你应该使用什么来帮助从物理上保护这些笔记本电脑？\n\
  \   - A. 锁柜\n   - B. 缆锁\n   - C. 锁定 USB 端口\n   - D. 密码保护的屏幕保护程序\n\n2. 在为互联网咖啡馆设置的笔记本电脑上，你希望确保没有人下载或安装任何东西来感染系统。在允许客人使用这些笔记本电脑之前，你应该安装什么种类型的保护？\n\
  \   - A. 反垃圾邮件软件\n   - B. 弹出窗口拦截软件\n   - C. 反病毒软件\n   - D. 虚拟机软件\n\n3. 你还想限制访问互联网咖啡馆的用户运行哪些程序。防止用户运行你不让他们运行的程序方法是？\n\
  \   - A. 应用白名单\n   - B. 应用黑名单\n   - C. 可信操作系统\n   - D. 防火墙\n\n4. 你建立的互联网咖啡馆将直接连接网络。你需要保护每个系统免受网络扫描、探测和攻击。你应该部署什么种保护机制来防止网络威胁？\n\
  \   - A. 反垃圾邮件软件\n   - B. 主机防火墙\n   - C. 沙- D. 防恶意软件\n\n5. 帮助你设置互联网咖啡馆的同事询问你正在设置的笔记本电脑是否针对最近发现的漏洞进行了保护。你确定是安全的，因为你通过以下哪项确保定期安装安全更新？\n\
  \   - A. 质量保证\n   - B. 应用黑名单\n   - C. 补丁管理\n   - D. 可信操作系统\n\n6. 你的老板想让你为所有工作站创建一个“黄金镜像”。你负责在创建镜像之前确保安装了所有正确的软件且系统配置正确。这一过程被称为：\n\
  \   - A. 主机基准（basining）\n   - B. 主机白名单\n   - C. 主机操作系统\n   - D. 主机配置\n\n7. 如果操作系统通过了多级环境认证，它可能也称为以下哪项？\n\
  \   - A. 安全操作系统\n   - B. 韧性操作系统\n   - C. 可信操作系统\n   - D. SELinux\n\n8. 你的同事告诉你有这种很棒的新技术，用于测试他从互联网下载的新应用程序和软件。他使用虚拟机来测试软件并看它是否会有任何恶意行为。如果是这样，他只需删除虚拟机。你的同事在描述哪种安全实践？\n\
  \   - A. 应用白名单\n   - B. 安全控制测试\n   - C. 快照测试\n   - D. 沙箱化\n\n9. 你的老板想让你给她买一台新笔记本电脑，一台带有特殊芯片的电脑，该芯片允许她使用\
  \ `BitLocker` 存储加密密钥以保护她的硬盘。你的老板在谈论哪种特殊芯片？\n   - A. 可信平台模块 (TPM)\n   - B. PKI 模块\n\
  \   - C. BitLocker 加密模块\n   - D. FIPS 140 芯片\n\n10. 当数据存储在硬盘上未被访问时，被称为：\n    - A.\
  \ 传输数据\n    - B. 静态数据\n    - C. 使用中数据\n    - D. 存储数据\n\n\n\n\n## 11. 你的同事正在保护一台\
  \ Windows Server 2012 计算机。他删除了所有不必要的软件，关闭了不必要的服务，开启了防火墙并打了补丁等等。你的同事正在执行什么过程？\n\n\
  **A.** 操作系统加固\n**B.** 生产系统准备\n**C.** 安全控制测试\n**D.** 补丁管理\n\n## 12. 你的一个 SAN（存储区域网络）即将达到容量上限。在调查过程中，你发现有大量的客户服务数据库事务日志和备份。当你询问为什么有这么多日志时，得到的回答是没人知道保留这些日志多久，以及什么时候可以删除。你的组织应该制定什么方案来防止日志文件的失控堆积？\n\
  \n**A.** 数据加密策略\n**B.** HSM 策略\n**C.** 数据留存策略\n**D.** 客户服务策略\n\n## 13. 下列哪种技术用于帮助保护对“大数据”的访问？\n\
  \n**A.** HSM 加密\n**B.** 基于 Kerberos 的身份验证\n**C.** 账户白名单\n**D.** 安全协议方法论\n\n## 14.\
  \ 你的经理非常担心网络内部系统之间发生的攻击。他坚信工程部门的某人攻击他的系统只是为了“整蛊他”。你目前没有好的方法来监控经理系统与网络其余部分之间的流量。你可以推荐以下哪些功能来帮助你的经理查看他的系统是否真的遭到了攻击？\n\
  \n**A.** 基于主机的漏洞扫描器\n**B.** 基于主机的入侵检测系统\n**C.** 基于主机的弹出器\n**D.** 基于主机的反间谍软件\n\n\
  ## 15. 一位开发者希望你搭建一个系统，让她可以在上面运行多次测试，并在测试不同版本的代码时能够反复将系统恢复到初始配置。她认为虚拟化可能是可行的方法。哪种虚拟化功能可以满足她的测试和回滚需求？\n\
  \n**A.** 沙箱\n**B.** 快照\n**C.** 主机弹性\n**D.** 基准线\n\n### Answers\n\n## 1. **B.** 锁线是将笔记本电脑固定在桌子或桌面上的良好方法。它们允许访问笔记本键盘、USB\
  \ 端口和光驱器，并将笔记本电脑固定在桌子上。\n\n## 2. **C.** 如果你正在寻找免受感染电脑的保护，你应该安装良好的防病毒软件并进行定期扫描。\n\
  \n## 3. **A.** 使用白名单是确保只有你想运行的程序被允许运行的方法。\n\n## 4. **B.** 基于主机的入侵检测系统（HIDS）的工作方式与网络入侵检测系统（IDS）相同，但它运行在主机级别。它检查进入和离开主机的流量。HIDS\
  \ 只能真正保护它安装的系统。\n\n## 5. **C.** 补丁管理系统允许你安排更新并跟踪补丁状态。\n\n## 6. **A.** 主机基准化是为系统建立基本需求。\n\
  \n## 7. **C.** 可信的操作系统为主机提供安全保障。（注：原文为 \"trusted operating system\"，但语境是指操作系统安全）。\n\
  \n## 8. **D.** 沙箱是将不可信代码与可信代码分离的方法。当正确执行沙箱时，沙箱中发生的任何事情都会受到控制。\n\n## 9. **A.** TPM（可信平台模块）是一个存储加密密钥的专用芯片。当\
  \ BitLocker 加密驱动器时，它将密钥存储在 TPM 中。\n\n## 10. **B.** 存储在驱动器上未被访问的数据被称为“静态数据”。\n\n\
  ## 11. **A.** 你的同事正在执行操作系统加固——通过减少漏洞和最小化攻击面来保护系统。删除不必要的软件和服务、打补丁以及限制流量都是加固系统的的步骤。\n\
  \n## 12. **C.** 数据留存策略平衡了保留记录的法律、业务或运营需求与保留成本。该策略应明确记录应保留多久以及在什么情况下可以销毁。\n\n## 13.\
  \ **B.** 基于 Kerberos 的身份验证是用于保护对大数据访问的方法之一。Kerberos 是一种网络身份验证协议，使用票据允许系统在所运行的网络不安全的情况下相互识别和身份验证。\n\
  \n## 14. **B.** 基于主机的入侵检测系统（HIDS）可以帮助你的经理判断他的系统是否受到攻击。HIDS 的工作方式与网络 IDS 相同，但它运行在主机级别，检查进入和离开主机的流量。HIDS\
  \ 只能保护它安装的系统。\n\n## 15. **B.** 在虚拟化环境中使用快照的功能将满足开发者的需求。快照是虚拟机在特定时间点的状态副本——文件系统、内存内容、电源状态等都会捕获并存储为快照的一部分。\n\
  \n# 第 20 章\n\n## 替代环境的安全\n\n在本章中，你将：\n\n* 学习比较和对比缓解静态环境中安全风险的替代方法\n* 理解安全在替代环境中的作用\n\
  * 检查替代环境相关的风险\n\n传统上，“计算”一词与大型主机、服务器、工作站和网络组件相关。今天，计算在许多其他环境中也发挥着作用，从 ATM 机机和 SCADA\
  \ 控制系统到嵌入式系统、智能手机和游戏机。\n\n\n\n\n\n可以使用多种方法来协助保障非传统系统的安全。其中一些方法是传统 IT 系统中方法的直接复制，而另一些则是这些替代环境所有的。\n\
  \n### 替代环境\n\n`Alternative environments`（替代环境）指的是并非常见 IT 环境中传统的计算机系统。这并不意味着这些环境很少见；事实上，整个社会存在数百万个由数亿台设备组成的系统。计算机存在许多系统中，并执行与特定系统密切相关的关键功能。这些替代系统本质上通常是静态的；也就是说，它们的软件在功能运行过程中是不不变的。更新和修订非常少。虽然这似乎与目前的安全实践背道而驰，但事实并非如此：因为这些替代系统受限于有限且定义的功能范围，漏洞带来的风险也是有限的。这些替代环境的示例包括嵌入式系统、SCADA\
  \ 系统、移动设备、主机、游戏机和车载计算机。\n\n### SCADA\n`SCADA` 是 `supervisory control and data acquisition`（监控控制数据采集）的缩写，是一种用于控制网络物理环境中自动化系统的系统。`SCADA`\
  \ 系统控制制造工厂、交通灯、炼油厂、能源网络、水厂、建筑自动化和环境控制以及许多其他系统。`SCADA` 也称为分布式控制系统（`DCS`）和工业控制系统（`ICS`），具体变化取决于行业和配置。当计算机直接控制物理过程时，很可能涉及到\
  \ `SCADA` 系统。\n\n大多数 `SCADA` 系统涉及多个连接在一起的组件，以实现一组功能目标。这些系统通常包含人机界面（`HMI`），操作员可以在那里对受控系统的操作实施某种形式的指令控制。从历史上看，`SCADA`\
  \ 系统与其他系统是隔离的，但随着这些系统跨传统网络进行互联以改进业务功能，这种隔离状态正在减少。许多旧的 `SCADA` 系统与公司网络是物理隔离（air gapped）的；也就是说，它们没有直接的网络连接。这意味着流入出的数据流是手动处理的，并且需要时间完成。现代系统希望消除这种限制，并在\
  \ `SCADA` 网络与企业 IT 网络之间增加了直接的网络连接。这些连接增加了攻击面面和对系统的风险，而且它们越像 IT 网络系统，对安全功能的需求就越大。\n\
  \n随着 2010 年报道的针对伊朗核设施的 `Stuxnet`（震网病毒）攻击，`SCADA` 系统被推向安全的焦点。`Stuxnet` 是一种专门用于攻击特定\
  \ `SCADA` 系统并导致工厂设备损坏故障的恶意软件。这次攻击复杂且设计精良，使伊朗的核燃料处理陷入长时间中断。这次攻击提高了人们对 `SCADA` 系统相关风险的意识，无论其是否连接到互联网（`Stuxnet`\
  \ 跨越了物理隔离击中了目标）。\n\n### 嵌入式系统\n`Embedded system`（嵌入式系统）是指作为更大系统的组成部分包含的计算机。从打印机等计算机外设，到智能电视和恒温器等家用设备，再到你驾驶的汽车，嵌入式系统无处不在。嵌入式系统可以是一个具有完全集成接口的微控制器（片上系统），也可以像现代汽车中数十个互连的嵌入式系统那样复杂。嵌入式系统的设计具有单一的控制目的，几乎没有额外功能，但这并不意味着它们没有风险或安全担忧。绝大多数安全漏洞涉及让设备或系统执行它能够做到且在技术上设计为要做的事情，即使产生的功能从未是该设备或系统的意图用途。\n\
  \n嵌入式系统的设计者通常关注成本最小化，安全很少作为设计或实施的一部分而被认真考虑。由于大多数嵌入式系统作为孤立系统运行，风险并不显著。然而，随着能力的增强以及这些设备变得相互互联，风险显著增加。例如，智能打印机已被黑客利用，作为进入企业的途径，并作为躲避防御者的手段。当下一代汽车开始相互通信，在它们传递交通和其他信息，并开始将导航和其他输入被传输到系统中时，风险将会增加，安全将成为一个问题。这在航空业已经得到看到，其中机内\
  \ Wi-Fi、机内娱乐和驾驶舱数字飞行控制网络的隔离已成为一个安全问题。\n\n![image](img/examtip.jpg)\n\n**考试贴士** 理解静态环境，即硬件、操作系统、应用程序和网络针对特定功能或目的进行配置的系统。这些系统被设计为在整个生命周期内保持不变，极少需要更新。\n\
  \n建筑自动化系统、气候控制系统、HVAC 系统、电梯控制系统和报警系统只是由嵌入式系统管理的系统示例。尽管这些系统过去是独立和单机运行的，但超连接的兴起证明了将它们集成的价值。拥有一个“智能建筑”，根据内部人员的数量和分布减少建筑资源，可以提高效率并降低成本。将这些系统互连并添加基于的的中央控制机制会增加外部攻击的风险特征。\n\
  \n### 手机和移动设备\n当手机首次出现时，它们是模拟设备，旨在为无处不在的电话系统增加便携性。今天，手机和平板电脑等移动设备是具有强大能力的便携式计算机系统。几十年前，只有超级计算机的处理能力、内存和图形能力能超过目前的移动手机。随着这种能力的出现，这些设备有了新的用途，如今移动设备是各种类型企业的主要终端。\n\
  \n移动设备看起来可能是一个静态环境，其操作系统很少更改或很少更新，但随着这些设备在能力上变得越来越无处不在，事实并非如此。移动设备对操作系统有定期软件更新，用户还会添加应用程序，使得大多数移动设备成为了一项完整的安全挑战。移动设备经常带有蓝牙连接机制。保护设备免受针对蓝牙连接的攻击（如蓝牙劫持\
  \ `bluejacking` 和蓝牙盗窃 `bluesnarfing`）是一项重要的缓解措施。为了防止防范未经授权的连接，蓝牙设备应始终关闭可发现模式，除非用户正在刻意对设备进行配对。\n\
  \n移动设备中使用了许多不同的操作系统，按市场份额划分，最常见的是 `Android` 和苹果的 `iOS`。微软和黑莓有自己的操作系统，但两者都没有大量的用户。\n\
  \n#### Android\n\n\n\n\n\n`Android` 是一个基于 Linux 的移动操作系统的通用名称。Google 收购了 Android\
  \ 平台，将其开源，并从 2008 年开始出货设备。此以后，Android 已经经历了多次更新，大多数系统都针对特定的移动运营商添加了某种程度的定制。多年来，Android\
  \ 出现过许多安全问题，从允许攻击者访问操作系统的漏洞到被恶意软件感染的应用程序不等。随着代码的清理和漏洞数量的减少，Android 平台持续演进。解决恶意软件感染应用程序的问题要困难得多，因为创建内容并将其添加到应用商店（Google\
  \ Play）的能力受到的监管程度远低于 Apple 和微软生态系统。\n\n在企业部署中，建议使用移动设备管理（MDM）系统，特别是在发生 BYOD（自带设备）的情况下。此类以及针对移动设备的特定安全方面涵盖在第\
  \ 18 章中。\n\n## iOS\n\n`iOS` 是苹果在其移动平台上专用操作系统的名称。由于苹果不授权在其设备以外的地方使用软件，因此苹果保留了对操作系统及任何特定功能的完全控制权。苹果还对其应用商店施加了严大的控制，这极大减少了苹果生态系统中恶意软件的发生率。\n\
  \n## 越狱 (Jailbreaking)\n\n与移动设备常见的破解手段是越狱。`Jailbreaking` 是用户提升权限级别的过程，绕过操作系统的控制和限制。用户仍然拥有设备的完整功能，但还拥有额外的能力，绕过操作系统施加的用户限制。关于越狱的实用性有几种不同的观点，但从安全的角度来看，重要的问题是，运行任何具有增强权限的设备都可能导致导致损害更大的错误，因为正常的安全控制通常会被绕过。\n\
  \n## 大型机 (Mainframe)\n\n大型机代表了计算的历史，尽管许多人认为它们已经消失了，但它们在企业计算中仍然非常活跃。大型机是高性能机器，提供大量的内存、计算能力和存储。几十年来，大型机一直被用于高量交易系统以及高性能计算。与大型机系统相关的安全性往往被构建在专用用途大型机的操作系统中。大型机环境往往具有非常强大的配置控制机制和极高的稳定性。\n\
  \n大型机已成为许多高量应用的一种具有成本效益的解决方案，因为大型机硬件上可以运行许多实例的虚拟机。这为许多新的安全漏洞打开了门——并不是针对大型机硬件本身，而是通过虚拟环境中客户机操作系统的漏洞。\n\
  \n## 游戏机 (Game Consoles)\n\n基于计算机的游戏机可以被视为一种设计用于娱乐的嵌入式系统。游戏机的操作系统不是为用户设计的，而是为了支持特定的应用程序或游戏。游戏机上的操作系统通常没有供用户交互的人机界面；相反，操作系统的设计只有一个单一目的。随着多功能娱乐控制机的兴起，游戏机的攻击面可能相当大，但仍然受到游戏生态系统封闭性的限制。固件和操作系统级软件的更新由游戏机制造商提供。这种封闭环境为与连接的系统相关的安全提供了一个合理的风险水平。随着游戏机变得更加通用，并包含网页浏览等功能，风险增加到与任何其他系统相当的水平。\n\
  \n## 车载计算系统 (In-vehicle Computing Systems)\n\n多年来，汽车内部一直嵌入式计算机，调节发动机功能、环境控制和仪表盘显示。最近，功能已扩展到娱乐和导航系统。随着车载计算系统继续与网络集成，与其他系统相同的安全风险也随之出现。\n\
  \n## 方法 (Methods)\n\n许多替代环境可以被视为静态系统。静态系统是指具有定义范围和目的，并且不像 PC 环境那样以动态方式经常变化的系统。静态系统往往具有封闭的生态系统，由单一供应商对所有功能进行完全控制。在替代系统的管理中可以采用广泛的安全技术。网络分段、安全层、封装（wrappers）和防火墙有助于保障网络安全。手动更新、固件控制和冗余有助于设备运行。`Network\
  \ segmentation` 是利用网络架构来限制设备之间的通信。可以使用多种网络机制在网络层限制对设备的访问。\n\n### 网络分段 (Network Segmentation)\n\
  \n手动更新有助于设备运行。替代系统面临的挑战之一是，设备本身可能没有在其功能集中包含典型的安全控制（如访问控制或加密）。这使得外部控制（如网络分段）作为解决方案的一部分变得更加关重要。\n\
  \n### 安全层 (Security Layers)\n\n使用不同的层执行不同的功能是几十年来计算机学的基石。利用层来强制执行安全方面也是长期存在的概念。并不是所有的层都具有相同的信息或处理能力，利用每层来实现安全解决方案的一部分可以产生更稳健的安全解决方案。虽然网络可以根据网络信息管理流量，但这并不是完整的安全解决方案。添加额外的层（如应用层防火墙和身份验证服务）增加了额外的安全功能，进一步降低了与系统相关的风险。\n\
  \n### 应用防火墙 (Application Firewalls)\n\n应用防火墙是运行在应用层的策略强制执行机制，用于执行一组通信规则。虽然网络防火墙检查网络流量并根据地址执行规则，但应用防火墙提供了显著更强大的能力来控制跨网络的应用程序通信。\n\
  \n### 手动更新 (Manual Updates)\n\n所有系统最终都需要更新来修复问题、修补漏洞甚至更改功能。在替代环境中，这些更改在许多情况下是手动完成的。手动更新可以限制对系统的访问，防止对系统进行未经授权更改。在某些情况下，由于规模的原因，可以使用自动化系统推送更新，但紧紧控制系统更新功能访问的原则需要保留。\n\
  \n\n\n\n固件存在于几乎每一个系统中，但在许多嵌入式系统中，它起着更为关键的作用，因为它可能还包含操作系统和应用程序。对固件的更改实施严格的控制措施，对于确保系统软件的真实性至关重要。固件更新需要极高的质量控制措施，以确保在更新过程中不会引入错误。固件更新虽然并非总是需要，但是一个非常敏感的事件，因为失败会导致系统功能故障。如果未经授权的第三方能够更改系统的固件（如针对\
  \ ATM 机的攻击中所示），攻击者就可以获得对系统的完整功能控制。\n\n## 包装器 (Wrappers)\n\n正如在第 19 章中讨论的，TCP 包装器用于封装或包含某些其他系统的结构。包装器已以多种方式使用，包括模糊或隐藏功能。特木马是包装器的一种形式。包装器还可以用于封装信息，例如在隧道或\
  \ VPN 解决方案中。包装器可以作为一种通道控制的形式，包括普通信号无法携带的完整性和验证信息。在替代环境中，经常看到使用包装器为 IP 传输准备通信。\n\n\
  ## 控制冗余与多样性\n\n深度防御是底层安全基础原理之一，这在替代环境中尤为需要。许多替代环境没有配备内置加密、访问控制或验证服务。这使得设备周围的控制在确保安全运行方面变得至关重要。\n\
  \n设计重叠的控制，使每种控制相互协助但不重复，这为安全解决方案增加了显著的强度。其目标是提高准入门槛，防止未经授权的第三方接触漏洞，并减轻他们能够触及的漏洞，使攻击者无法进一步进行。没有完美安全之说，但一系列重叠的控制可以使利用变得几乎不可能。\n\
  \n当系统处于替代环境中时（无论是静态还是动态的），安全原则仍然适用。事实上，在许多情况下，这些原则更为关键，因为设备本身几乎或完全没有安全功能，因此依赖支持环境来确保安全。在冗余、重叠的结构中采用多样化的控制，是提供这种程度缓解的最佳方法。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 理解静态环境的安全方法。静态系统需要网络分段、安全层、防火墙、包装器和其他安全控制等安全措施和技术。\n\
  \n## 章末总结\n\n在本章中，你熟悉了如何保护替代环境。替代环境包括非标准 IT 系统，例如 SCADA 系统、嵌入式系统、移动设备、主机、车载系统和游戏机。本章还涵盖了安全方法的应用，例如网络隔离、安全层、应用防火墙、手动更新、安全固件控制、包装器和多样化控制集。\n\
  \n## 习题\n\n为了帮助你进一步准备 CompTIA Security+ 考试，并测试你的准备程度，请回答以下问题，然后与章末的正确答案进行比对。\n\n\
