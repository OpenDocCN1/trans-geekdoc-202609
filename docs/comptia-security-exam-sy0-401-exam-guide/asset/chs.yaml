  - 6. **C.** 块密码将输入分为预定义的长度（块），然后对任何剩余部分进行填充。\n- 7. **C.** SSL 证书是公钥基础设施的一部分，使用非对称密钥。\n\
  - 8. **D.** 密钥托管（或密钥恢复）在企业环境中很流行，因为那里的系统如果丢失主密码，将会丢失大量数据。\n- 9. **A.** 任何未经过公开审查的算法都可能存在算法缺陷。大多数良好的算法在经过长时间公开审查阶段后才批准使用。\n\
  - 10. **D.** 这三个答案都是正确的。互联网上有大量的图像、音频文件和视频文件，扫描所有文件以寻找隐藏信息是一项无法完成的任务。此外，变化非常微小，极难检测。数据还可以被加密以使模式分析变得困难得多，编码可以是私有的，以避免在图像像素中留下已知模式。\n\
  \n\n\n\n\n## 11. C, D, and F.\n最佳答案是用户身份验证、安全的密钥交换以及向加密中添加多个用户的能力。非对称密钥允许对每个用户进行身份验证，因为他们应该是访问私钥的唯一。非对称密钥还允许安全地交换任何必要的会话密钥，而且由于非对称密钥是基于用户的，可以在不影响数据安全的情况下完成单个用户的移除。\n\
  \n## 12. D.\n对称加密算法擅长快速加密，能够提供良好的文件传输速度。\n\n## 13. D.\n忘记密钥口令和法院命令的政府行动都可能是密钥托管的用途。\n\
  \n## 14. A.\n带内密钥交换将是在线解决方案的最优设计。带外密钥交换引起的延迟将极大地限制可用性，并减慢应用程序的采用速度。\n\n## 15. C.\n\
  不可否认性在协作环境中至关重要，这样对文档的更改就可以安全地跟踪，并且做出更改的人无法否认做过这些更改。\n\n# 第 24 章\n\n## 加密方法\n\n\
  在本章中，你将学习：\n\n- 学习如何在任何给定场景中使用适当的加密方法\n- 学习算法的比较优势和性能\n- 学习如何在任何给定场景中使用适当的 PKI 方法\n\
  - 学习如何在任何给定场景下执行证书管理以及相关的组件操作\n\n加密算法的使用每天都在增长。越来越多的信息被数字化编码并放置在网络上，所有这些数据都需要安全保护。使用当前技术实现此点的最佳方法是使用加密。本章考虑了加密算法完成的一些任务，以及它们最擅任的任务。它介绍了不同的加密方法及其适用场景。\n\
  \n### 哈希（Hashing）\n正如第 23 章所介绍的，哈希函数是常用的加密方法。哈希算法的常见用途是存储计算机密码和确保消息完整性。`HMAC`（或基于哈希的消息认证码）是哈希技术的特殊子集。因此，`HMAC`\
  \ 可以在提供完整性的同时提供身份验证。流行的哈希算法包括消息摘要 (`MD5`)、安全哈希算法 (`SHA`) 系列以及 `RIPEMD` 算法。\n\n###\
  \ MD5\n*Message Digest (MD)* 是几种算法中的一种的通用版本，这些算法旨在根据输入到算法的数据创建消息摘要或哈希。`MD` 算法的工作方式与\
  \ `SHA` 相同，它们使用一种安全方法压缩文件并生成指定位数的计算输出。它们都是由 MIT 的 Ronald L. Rivest 开发的。当前版本是 `MD5`，而之前的版本是\
  \ `MD2` 和 `MD4`。`MD5` 开发于 1991 年，其结构基于 `MD4`，但增加了额外的安全性以解决 `MD4` 中的问题。2007 年 11\
  \ 月，研究人员发表了他们的发现，即可以拥有两个功能不同但具有相同 `MD5` 哈希值的两个完全不同的 `Win32` 可执行文件。这一发现对于恶意软件的开发具有明显的影响。`MD5`\
  \ 的这些问题的结合促使人们出于安全考虑采用更强力的 `SHA` 版本。\n\n### SHA\n*Secure Hash Algorithm (SHA)* 指由美国国家标准与技术研究院\
  \ (`NIST`) 和国家安全局 (`NSA`) 设计并发布的一组哈希算法。这些算法包含在 `SHA` 标准信息处理标准 (`FIPS`) 180-2 和 180-3\
  \ 中。每个标准单独被命名为 `SHA-1`、`SHA-224`、`SHA-256`、`SHA-384` 和 `SHA-512`。后四个变体有时被称为 `SHA-2`。由于\
  \ `SHA-1` 和 `SHA-2` 系列存在基于碰撞的弱点，`NIST` 进行了新版本的搜索，其结果被称为 `SHA-3`。\n\n#### SHA-1\n\
  `SHA-1` 开发于 1993 年，被设计为美国数字签名标准 (`DSS`) 中用于安全哈希的算法。它基于 `MD4` 算法建模，并实现了 `NSA` 发现的该算法中的修复。它创建一个长度为\
  \ 160 位的消息摘要，可以由数字签名算法 (`DSA`) 使用，然后 DSA 可以计算消息的签名。这在计算上更简单，因为消息摘要通常小于实际消息——消息越小，工作量越少。`SHA-1`\
  \ 与所有哈希函数一样，通过对输入数据应用压缩函数来工作。\n\n曾几何，`SHA-1` 是最安全的哈希函数之一，但它被发现容易受到碰撞攻击。因此，大多数 `SHA-1`\
  \ 的实现已被其他更安全的 `SHA` 版本取代。`SHA-1` 中增加的安全性和抗攻击能力确实需要更多的处理能力来计算哈希。尽管有了这些改进，`SHA-1`\
  \ 仍然容易受到碰撞，并且不再被政府机构批准。\n\n#### SHA-2\n`SHA-2` 是 `SHA-224`、`SHA-256`、`SHA-384` 和\
  \ `SHA-512` 的统称。`SHA-2` 与 `SHA-1` 类似，它接受小于 $2^{64}$ 位的输入并将该输入还原为哈希。`SHA-2` 系列产生的哈希长度等于数值，因此\
  \ `SHA-256` 产生 256 位的摘要。\n\n#### SHA-3\n`SHA-3` 是 `SHA-2` 替代品的名称。2012 年，`Keccak`\
  \ 哈希函数赢得了 `NIST` 竞赛并被选为 `SHA-3` 方法。由于算法与之前的 `SHA` 系列完全不同，它证明了能够更好地抵抗针对后者的攻击。由于 `SHA-3`\
  \ 系列相对较新，尚未在许多密码套件中广泛采用。\n\n### RIPEMD\nRACE 性消息摘要 (`RIPEMD`) 是由 RACE 原始语评估 (`RIPE`)\
  \ 联盟开发的哈希函数。它最初提供 128 位哈希，后来被证明存在碰撞问题。`RIPEMD` 被 Hans Dobbertin、Antoon Bosselaers\
  \ 和 Bart Preneel 增强为 160 位哈希，并被称为 `RIPEMD-160`。\n\n#### RIPEMD-160\n`RIPEMD-160`\
  \ 是一种基于 `MD4` 的算法，但它使用了两个并行通道。输出由五个 32 位字组成，形成 160 位哈希。`RIPEMD-160` 也有更大的输出扩展。这些扩展\
  \ `RIPEMD-256` 和 `RIPEMD-320` 分别提供 256 位和 320 位的输出。虽然这些提供了更大的输出尺寸，但这并不意味着哈希函数本质上更强。\n\
  \n### 对称加密\n对称加密算法用于批量加密，因为它们相对快速且计算要求低。常见的对称算法有 `DES`、`3DES`、`AES`、`Blowfish`、`Twofish`、`RC2`、`RC4`、`RC5`\
  \ 和 `RC6`。\n\n\n\n\nDES，即数据加密标准，其开发是为了响应国家标准局（`NBS`，现称为美国标准与技术研究院 `NIST`）在 1973\
  \ 年发布的关于一种标准加密算法的征集公告。NBS 规定 `DES` 标准每五年必须重新认证一次。虽然 `DES` 在 1983 年顺利通过了认证，但美国国家安全局（NSA）表示他们将不会在\
  \ 1987 年对其进行重新认证。然而，由于许多企业没有备选方案，导致了大量投诉，NSA 和 NBS 迫于对其进行了重新认证。该算法随后在 1993 年再次通过了认证。现在，NIST\
  \ 已认证了高级加密标准（`AES`）以取代 `DES`。\n\n## 3DES\n三重 DES（`3DES`）是 `DES` 的后续实现。根据具体的变体，它使用两个或三个密钥，而不是\
  \ `DES` 使用的单密钥。它还通过所谓的“多重加密”运行 `DES` 算法三次。\n\n多重加密可以通过几种不同的方式进行。多重加密最简单的方法是将算法堆叠在一起——获取明文，用\
  \ `DES` 对其加密，然后用不同的密钥对第一个密文加密，再用第三个密钥对第二个密文加密。在实际上，这种技术的效果不如 `3DES` 使用的技术，后者是先用一个密钥加密，再用第二个密钥解密，最后用第三个密钥加密。\n\
  \n这极大地增加了获取密钥所需的尝试次数，是安全性的显著增强。然而，额外的安全性是有代价的。计算 `3DES` 的时间可能是计算 `DES` 的三倍。然而，如今电子设备中内存和处理能力的进步使得这个问题对于除极小型低功耗手持设备以外的所有设备来说都不再重要。\n\
  \n`3DES` 的唯一弱点就是 `DES` 中已经存在的那些。由于对相同算法使用了不同的密钥，有效密钥长度比 `DES` 密钥空间长，这导致对破解攻击的抵抗力更强，使得\
  \ `3DES` 在多种攻击面前比 `DES` 更强。虽然 `3DES` 一直保持流行并仍得到广泛支持，但 `AES` 已接管了对称加密标准。\n\n## AES\n\
  由于技术的进步以及快速检索 `DES` 密钥的进展，NIST 发布了新的高级加密标准（`AES`）的征集公告。它要求使用对称密钥加密的分块密码算法，并支持 128、192\
  \ 和 256 位的密钥长度。经过评估，NIST 有五个决赛入围者：\n\n* `MARS` IBM\n* `RC6` RSA\n* `Rijndael` John\
  \ Daemen 和 Vincent Rijmen\n* `Serpent` Ross Anderson, Eli Biham 和 Lars Knudsen\n\
  * `Twofish` Bruce Schneier, John Kelsey, Doug Whiting, David Wagner, Chris Hall\
  \ 和 Niels Ferguson\n\n2000 年秋季，NIST 选择了 `Rijndael` 作为新的 `AES`。选择它是因为它的整体安全性以及在容量受限设备上的良好性能。`AES`\
  \ 有三种不同的标准密钥长度，128、192 和 256 位，分别指定为 `AES-128`、`AES-192` 和 `AES-256`。\n\n虽然目前不存在针对\
  \ `AES` 的有效攻击，但更多的时间和分析将告诉我们这个标准能否像 `DES` 那样持久下去。\n\n![image](img/examtip.jpg)\n\
