  \n# 第 11 章\n\n***\n\n## 安全控制\n\n在本章中，你将：\n\n- 确定满足安全目标的适当控制\n- 检查确保机密性的控制措施\n- 检查确保完整性的控制措施\n\
  - 检查确保可用性的控制\n\n***\n\n## 安全控制\n\n在本章中，你将：\n\n- 确定满足安全目标的适当控制\n- 检查确保机密性的控制措施\n\
  - 检查确保完整性的控制措施\n- 检查确保可用性的控制\n\n***\n\n## 安全控制\n\n在本章中，你将：\n\n- 确定满足安全目标的适当控制\n\
  - 检查确保机密性的控制措施\n- 检查确保完整性的控制措施\n- 检查确保可用性的控制\n\n***\n\n## 安全控制\n\n在本章中，你将：\n\n-\
  \ 确定满足安全目标的适当控制\n- 检查确保机密性的控制措施\n- 检查确保完整性的控制措施\n- 检查确保可用性的控制\n\n***\n\n### 机密性\n\
  \n机密性是信息系统的一个属性，确保信息只有获得授权的人员才能访问。机密性通过加密、访问控制或数据隐藏来实现。\n\n***\n\n### 完整性\n\n完整性是信息系统的一个属性，确保信息未被未经授权的篡改。完整性由单向哈希函数和数字签名提供。哈希函数计算消息摘要，通过允许测试来判断消息是否发生了变化，从而保证消息的完整性。消息现在有了一个计算函数（哈希值），在消息被拦截和干扰时告诉用户重新发送。\n\
  \n该哈希值通过非对称加密相结合，即获取消息的哈希值并使用用户的私钥对其加密。这使得任何拥有用户公钥的人都可以解密哈希并与本地计算的哈希进行比较，这不仅确保了消息的完整性，还正向识别了发送者。\n\
  \n***\n\n### 可用性\n\n可用性是信息系统的一个属性，确保授权用户在需要时可以访问信息。可用性通过冗余、容错能力和灾难恢复来实现。\n\n\n\n\
  \n可用性（Availability）是 CIA 三要素模型中的第三支柱，指的是当授权用户在获得访问权限时，系统保持可访问的属性。对于某些系统而言，可用性是一个重大的运营关注点。这导致了容错和冗余系统的开发，以确保关键系统的持续可用。确保系统可用性的关键运营流程是变更配置委员会（change\
  \ configuration board）。运行良好的变更配置委员会可以确保系统即使在需要停机补丁时，也能保持最大的可用性。在包含多个相同服务器的系统中，任何给定时间只有部分服务器会被更改，允许在提交所有机器之前，在生产环境中充分测试更改的有效性。只要更改允许在用户空闲期间进行，就应该有足够的空隙空间维持可用性的进行滚动更改。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 可用性可以通过容错和冗余系统来实现。\n\n使用备用系统也可以在灾难发生和实施业务连续计划时提高可用性。将热备场（hot\
  \ site）作为备用系统是最佳解决方案，因为温备和冷备会为连续运行增加停机时间。在极端故障转移需求下（例如不丢失任何时间和数据），则需要主主（active-active）架构。当数据中心是主主架构且应用程序也是主主架构时，结果就是持续可用性。主主系统将在主系统和备份系统上同时处理数据，允许瞬时故障转移，但缺点是需要具备双向复制能力的软件。\n\
  \n数据可用性也可能成为问题，特别是当大量数据存储在单个机器和移动设备上时。许多工作人员视为关键的日常数据，其备份频率可能不如企业数据。如果员工的日常工作具有价值，那么这些数据也应该通过备份保护的形式获得适当关注。\n\
  \n## 安全（Safety）\n\n安全与 Security（Security）在多个方面相互相关。一个安全的系统执行它应该执行的任务且仅执行这些任务，这些品质对于安全是必要的。安全系统种类繁、形式多样，但许多与物理安全问题有关。\n\
  \n## 围栏（Fencing）\n\n围栏可用于物理隔离和保护。围栏可以区分安全区域、提供安全区域并维持交通分离。从简单的链网围到高安全性围栏，每种都能提供不同级别的保护。链网围可以提供简单的人群控制，但在阻止有敌意的对手方面作用有限。高安全性围栏（如木栅围栏\
  \ palisade fencing）提供了显著的防攀爬保护和入侵延迟因素。\n\n## 照明（Lighting）\n\n照明由于几个原因而至关重要。它可以为监控系统（如\
  \ `CCTV` 系统）提供必要的照明。它还可以在疏散演习期间为人员提供必要的引导。工作区域提供适当水平的照明很常见，但在出口场所和楼梯间等区域提供充足的照明同样重要。\n\
  \n## 锁（Locks）\n\n锁提供了控制访问的手段，充当访问控制列表的物理体现。由于锁是容易受到篡改的物理设备，因此对于高安全性锁，需要采取措施防止绕过。许多高安全性锁制造商会对空白钥匙进行专利保护并严格控制。这将使得未经授权的人无法获得空白并消除弹子钥匙（bump\
  \ keys）。物理锁芯也可以采用比普通锁更复杂的设计，使物理操作（开锁）变得极其困难。\n\n## CCTV\n\n闭路电视 (`CCTV`) 可用于监控。\n\
  \n## 逃生路线（Escape Routes）\n\n逃生路线用于应急疏散。\n\n## 逃生计划（Escape Plans）\n\n逃生计划为应急疏散而制定。\n\
  \n## 演习（Drills）\n\n演习用于练习应急响应。\n\n## 控制（Controls）\n\n控制用于安全管理。\n\n## 章节复（Chapter\
  \ Review）\n\n在本章中，你熟悉了主要的属性。\n\n## 问题（Questions）\n\n为了帮助你进一步准备 CompTIA+ 考试并测试你的水平，请回答以下问题并在最后检查答案。\n\
