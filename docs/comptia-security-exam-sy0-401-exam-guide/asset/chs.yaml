  ## 第七章风险管理\n\n在本章中，你将：\n\n* 学习如何实施适当的风险缓解策略\n* 研究用于变更和事件管理的业务连续性概念\n* 研究灾难恢复概念\n\
  \n风险管理为处理与变更、事件管理相关的风险提供了方法。理解这些相互活动的元素是企业的关键要素。\n\n### 风险缓解策略\n\n风险缓解策略是在彻底评估与运营相关的威胁、危害和风险后开发的行动计划。这些策略用于减少运营相关的风险。常见的缓解策略包括变更管理、事件管理、用户权限审查和技术控制。\n\
  \n![image](img/examtip.jpg)\n\n**EXAM TIP** 考试时，准备好在提供场景时实施适当的风险缓解策略。\n\n### 变更管理\n\
  \n变更管理源于系统工程，在工程领域通常被称为配置管理。大多数软件和硬件变更管理实践源于传统的系统工程配置管理实践。计算机硬件和软件的发展已演变为必须存在适当的管理结构和控制以确保计划运行。企业通常设立变更控制委员会来批准所有生产变更，并在引入变更之前遵循变更管理程序。配置控制是对基准项进行控制的过程。配置控制确保只实施已批准的基准更改。很容易理解为什么软件系统（例如基于\
  \ Web 的订单输入系统）在没有适当测试和控制的情况下进行更改——否则系统可能会在关键时刻停止运行。配置控制是为管理层提供价值见解的关键步骤。如果正在进行更改并遵守了配置控制，经理和其他相关人员将获得更多信息。这确保了资产的正确使用，并避免了由于未经批准更改引起的不必要停机。\n\
  \n### 事件管理\n\n当发生事件时，拥有一种事件响应方法论是一种关键的风险缓解策略。建立以处理由于网络事件导致的业务中断的计划的步骤之一是建立计算机事件响应小组（`CIRT`）或计算机应急响应小组（`CERT`）。\n\
  \n![image](img/note.jpg)\n\n**NOTE** `CERT` 是卡内基梅隆大学的商标，并在某些情况下经常使用，例如 US-CERT。\n\
  \n\n\n\n\n组织的计算机应急响应小组（CIRT）将对事件进行调查，并就后续处理方案提出建议。CIRT 不应仅由常驻成员组成，还应包括临时成员，根据事件的性质可能被召来处理特殊需求。除了具有技术背景的人员外，CIRT\
  \ 还应包括非技术人员，以就如何处理媒体关注、可能出现的法律问题以及有关组织持续运营的管理问题提供指导。在事件发生之前，应当创建 CIRT 并确定团队成员。开展调查调查的政策和程序也应在事件发生前制定。此外，建议团队定期开会以审查这些程序。\n\
  \n`Incident response` 是安全人员为了响应各种触发事件而执行的一系列行动。这些行动非常广泛且多样，因为它们必须处理各种原因和后果。通过使用结构化的框架并配合准备充分的流程，事件响应将变成一项可管理的任务。如果没有适当的准备，这项任务可能会迅速变得无法完成或成本极其高昂。\n\
  \n## 用户权利和权限审查\n\n用户权利和权限审查是较强大的安全控制措施之一。但这种控制的强度取决于其是否保持更新并得到适当维护。对于任何规模大于微型的企业来说，确保用户列表及关联权限的完整性和实时性都是一项挑战性任务。一种可以帮助保持用户权利列表更新的补偿控制措施是对用户库及关联权限进行系列定期审计。\n\
  \n## 执行例行审计\n\n作为任何良好安全计划的一部分，管理员必须执行定期审计，以确保用户、系统、策略和程序方面“符合预期”。安装和配置安全机制固然重要，但必须按照定期计划进行审查，以确保它们有效、更新并发挥其预期功能。以下是一些应定期审计的条目示例，但并非完整列表：\n\
  \n-   **用户访问**：管理员应审查哪些用户正在访问系统、何时进行访问、正在使用哪些资源等。管理员应密切关注是否存在用户不当访问资源，或在异常时间访问合法资源的情况。\n\
  -   **用户权利**：当用户更换工作或职责时，她可能需要分配不同的访问权限；她可能会获得新资源的访问权限并失去对其他资源的访问。为了确保用户仅拥有其当前职位所需的资源和权限，应定期对所有用户权利进行审计。\n\
  -   **存储**：许多组织都有政策规定可以在“公司”资源上存储什么，以及特定用户或组可以使用多少空间。定期审计有助于确保组织资源上不存在不良或非法的材料。\n\
  -   **保留**：在某些组织中，特定文档或记录的存储时间可能与存储的内容同样重要。记录保留政策有助于定义存储什么、如何存储、存储多久以及到期后如何处置。定期审计有助于在记录或文档不再需要时将其移除。\n\
  -   **防火墙规则**：定期审计防火墙规则非常重要，这可以确保防火墙正在按预期过滤流量，并有助于确保“临时”规则不会变成规则集中的永久添加。\n\n## 数据丢失或盗取\n\
  \n数据是大多数攻击者的主要目标。数据的价值各异，使得某些数据更有价值，因此面临更高的被窃风险。数据还通过各种机制丢失，硬件故障、操作错误和系统错误是常见原因。无论丢失原因是什么，组织都可以采取各种行动来减轻损失的影响。备份是首选，因为备份可以提供防止损失的最最终保护。\n\
  \n为了防止盗取，可以采用多种控制措施。有些是风险缓解步骤，例如数据最小化，即不存储不需要的内容。如果必须存储且具有价值，则可以使用数据泄露防护（DLP）等技术提供保护手段。防火墙和网络分段等简单的安全控制也可以增加数据窃取的难度。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 在考试时，请理解防止数据丢失或盗取的策略和程序。\n\n## 技术控制\n\
  \n保护企业数据是安全控制的主要目标。防火墙和网络隔离可以作为保护关键强大屏障。使用与数据敏感性相应的网络隔离区可以为数据提供显著保护。在网络层限制访问可以防止非相应网段机器直接连接数据。由于数据只有在被授权访问的人使用时才有用，因此访问数据的方法可以设计为不受外部影响的影响。\n\
  \n使用严格的访问控制结合审计，可以针对数据丢失、损坏和盗取提供重大的系统保护。这些控制是网络和数据安全的核心，是数据保护的重要主要元素。\n\n### 数据泄露防护\n\
  \n`Data loss prevention (DLP)` 指用于检测和防止跨企业数据传输的技术。在关键位置部署 DLP 技术可以扫描数据包中的特定数据模式。该技术可以进行调整以检测账号、密码、特定标记或文件。当检测到特定的数据元素时，系统可以阻止传输。使用\
  \ DLP 技术的主要挑战是传感器的放置。DLP 传感器需要能够观察数据，因此如果通道是加密的，DLP 技术可能会失效。\n\n## 风险管理最佳实践\n\n\
  `Best practices` 是组织在任何活动中可以采用的最佳防御。检查最佳实践的一种方法是确保业务拥有一套涵盖其运营职责的最佳实践。在更深层次上，如果想要获得最高水平的保护，这些实践的细节本身也需要是最佳实践。至少，风险缓解最佳实践包含了业务连续性、高可用性、容错和灾难恢复概念。\n\
  \n这些措施都不是孤立运行的。事实上，它们都是相互关联的，通过共享元素并共同工作以实现共同目标：企业数据的安全。\n\n## 业务连续性概念\n\n在发生中断运营的事件时保持组织运行并非自动完成，而是需要提前计划并定期演练这些计划以确保它们有效。在讨论组织持续运营问题时，经常使用的术语是\
  \ `business continuity plan (BCP)`。你可能会好奇灾难恢复计划 (DRP) 和 BCP 之间的区别。实际上，这两个术语有时被同义使用，对于许多组织来说，两者之间可能没有重大差异。然而，BCP\
  \ 和 DRP 之间存在细微差异，其中之一就是`focus`（侧重点）。\n\n\n\n\n业务连续性计划（BCP）的重点是业务或组织的持续运营。灾难恢复计划（DRP）的重点是在灾难发生后组织的恢复和重建。DRP\
  \ 是更广泛的 BCP 的组成部分，因为业务连续性始终是一个需要解决的问题。在 DRP 中，应该处理对人类生命的保护，这是该文档的一个主要重点。应该涵盖疏散计划和系统关机程序。员工的安全应该是贯穿整个\
  \ DRP 的主题。而在 BCP 的其他部分，你可能不会看到对员工保护有同等程度的强调。BCP 的重点是组织运营所需的关键系统。\n\n看待这两个计划的另一种方式是：BCP\
  \ 将用于确保在发生任何导致业务中断的事件时，你的业务能够持续。如果发生了灾难并摧毁了你设施全部或部分，BCP 中的 DRP 部分将处理建筑问题或获得新设施的问题。DRP\
  \ 还可以包括与组织长期恢复相关的详细信息。\n\n无论你如何看待这两个计划，一个无法在业务中断后迅速恢复业务功能的组织，极有可能遭受不可挽回的损失，并可能停止存在。这些计划的成功实施对组织在发生灾难时是如此关键，以至于不仅应该制定这些计划，还需要定期进行测试，以确保它们是充分的并且确实能够实现它们的设计目标。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试贴士** `DRP` 和 `BCP` 术语通常被互换使用，但它们之间存在细微差别。仔细学习本节，以确保你能够区分这两个术语。\n\
  \n与业务连续性相关的许多风险管理最佳实践。接下来的章节将详细介绍业务影响分析、关键系统和组件的识别、单点故障、`BCP` 等主题。\n\n### 业务影响分析\n\
  \n通常用于描述通过解决前节中的问题而创建的文档的名称是业务影响分析（`BIA`）（这也可以称为业务影响评估）。\n\n### 关键系统和组件\n\n在业务连续性中，识别组织所需的关键系统和组件是至关重要的安全策略。`BIA`\
  \ 概述了业务中断期间需要恢复的内容。\n\n### 关键系统和组件\n\n识别关键系统和组件、单点故障、`BCP` 以及更多主题将在后续章节中进行详细介绍。\n\
  \n### 单点故障\n\n在业务连续性中，识别关键系统和组件是至关重要的安全策略。`BIA` 概述了业务中断期间需要恢复的内容。\n\n### 业务连续性\n\
  \n在业务连续性中，识别关键系统和组件是至关重要的安全策略。`BIA` 概述了业务中断期间需要恢复的内容。\n\n### 业务连续性计划与测试\n\n业务连续性计划需要测试以确保它们符合预期。随着系统的演变，计划也必须更新。\n\
  \n### 风险评估\n\n风险评估的原则（见第 5 章](#ch5)）可以应用于 `BCP`。\n\n### 灾难恢复\n\n在良好的 `DRP` 中，包含恢复组织使其再次运行的过程和程序是重要的。哪些具体的步骤将用于运营？这些过程应该记录下来，并在可能的情况下定期进行`测试`。在灾难发生之前演练灾难恢复计划和流程，为你提供了发现计划缺陷的机会。它为计划中的关键人物提供了练习他们将要完成的任务。\n\
  \n要开始创建 `DRP`，首先要识别组织的所有关键功能，然后对这些每个关键功能回答以下问题：\n\n- 谁负责该功能？\n- 这些人员执行该功能需要什么？\n\
  - 该功能与其他功能相比应该何时完成？\n- 该功能在哪里执行？\n- 如何执行该功能（流程是什么）？\n- 为什么该功能对组织如此重要或关键？\n\n通过回答这些问题，并处理在丢失任何关键功能时将如何恢复，你可以创建组织\
  \ `DRP` 的草稿。\n\n#### IT 应急计划\n\n今天任何组织的重要部分都是信息技术（IT）流程和资产。没有计算机和网络，今天大多数组织无法运营。因此，`BCP`\
  \ 包含 IT 应急计划至关重要。由于互联网的性质及其存在的威胁，在组织遭受自然灾害引起的中断之前，其 IT 资产可能会某种程度的中。病毒、蠕虫、计算机入侵和拒绝服务攻击等事件可能会导致组织在没有任何警告的情况下失去部分或全部计算资源。因此，IT\
  \ 应急计划比 `BCP` 的其他方面更可能需要。\n\n\n\n\n# 继任计划\n\n业务连续性计划不仅仅是确保硬件可用且运行。操作和维护系统的人员同样重要；在发生破坏性事件时，关键人员的可用性与硬件对于业务连续性运营的成功同样等重要。制定一个识别关键人员并为关键职培养合格人员的继任计划，是成功的业务连续性计划（BCP）的关键部分。\n\
  \n## 高可用性\n\n安全的目标之一是在授权用户需要时提供数据和处理能力的可用性。`High availability`是指尽管发生破坏性事件，仍能保持数据和运行处理（服务）可用的能力。通常，这需要在电力**处理方面具备冗余系统，以便当一个系统发生故障时，另一个可以接管操作而不会中断服务。高可用性不仅仅是数据冗余；它要求数据和服务均是可用的。\n\
  \n## 冗余\n\n`RAID`通过使用`redundancy`来提高可靠性。在制定确保组织拥有运营所需物资的计划（即使硬件或软件发生故障或安全性被攻破）时，应该考虑涉及冗余和备用零件的其他措施。冗余的一些常见应用包括使用冗余服务器、冗余连接和冗余\
  \ ISP。对冗余服务器和连接的需求可能是显而易见的，但冗余 ISP 可能并非如此，至少最初是这样。许多 ISP 已经拥有多个接入互联网的，但通过拥有额外的 ISP\
  \ 连接，组织可以减少某个 ISP 中断对组织产生负面影响的概率。确保员工不中断地访问互联网或客户不中断地访问组织的电子商务网站正变得越来越重要。\n\n许多组织认为没有必要维持备用零件供应。毕竟，随着存储价格的下降和处理器速度的提高，为什么要用旧技术来更换损坏的部件呢？然而，充足的备用零件供应可以简化系统重新上线的过程。用较新版本的硬件和软件替换系统有时会导致兼容性问题。某些关键软件的旧版本可能无法与新硬件协同工作，而新硬件在许多方面可能更强大。为组织中的关键职能准备关键硬件（或软件）备件，可以在软件或硬件发生故障时，极大地有助于维护业务的连续性。\n\
  \n![image](img/examtip.jpg)\n\n**考试提示** 冗余是安全和可靠性的重要因素。请确保你理解可以从冗余组件中受益的许多不同领域。\n\
  \n## 桌面演练\n\n对运营计划进行演练是一种采取多种形式的努力。对于高级决策者来说，行动点通常是办公桌或会议室，其方法是会议和决策。高级管理层运营计划演练的一种常见形式是桌面演练（tabletop\
  \ exercise）。高级管理团队或其成员聚集在一起，并被赋予一个场景。他们可以演练决策步骤，与他人交流，并按照他们可能参与的模式完成演练的动作。场景的设定旨在测试其决策和决策过程的响应能力。由于该活动经常在会议室内、围着桌子进行，因此“桌面演练”这一名称被定义了这种演练形式。\n\
  \n## 容错\n\n在面临某种中断时，讨论运营连续性时经常使用的其他一些术语还包括高可用性和容错。\n\n`Fault tolerance` 的基本目标与高可用性相同——即对数据服务的无间断访问。这可以通过数据和硬件系统的镜像来实现。如果发生“故障”导致磁盘控制器等设备出现中断，镜像系统将提供所需的数据，且对用户的服务不会有明显的中断。某些系统（如服务器）对业务运营至关重要，因此应该是容错措施的对象。\n\
  \n![image](img/examtip.jpg)\n\n**考试提示** 容错和高可用性的目标是类似的，但在应用上是独立的。高可用性是指在发生破坏性事件时，仍保持数据和服务处于运行状态。容错是在发生故障时以实现高可用性的一种设计目标。\n\
  \n## 硬件\n\n硬件以基础设施的形式构成系统的骨干。从网络设备到服务器、存储和用户机器，硬件都是相互互连的，提供了一个存储、处理和使用数据的通道。这些设备构成了运营的骨干，也是安全活动发生的场所。网络控制设备、防火墙、入侵检测系统和日志系统等硬件组件对于提供所需的安全级别至关重要。\n\
  \n## RAID\n\n提高磁盘存储可靠性的常用方法是廉价磁盘冗余阵列，现在被称为`Redundant Array of Independent Disks\
  \ (RAID)`（独立磁盘冗余阵列）。`RAID`将通常存储在单个磁盘上的数据并将其分散到其他几个磁盘上。如果丢失了任何一个磁盘，也可以从同样存储数据的磁盘上恢复数据。随着磁盘存储价格的下降，这种方法变得越来越流行，以至于许多用户甚至为家庭系统配备了\
  \ `RAID` 阵列。`RAID` 还可以增加数据恢复速度，因为多个驱动器可以同时忙于检索请求的数据，而不是依靠单个磁盘来完成工作。\n\n可以考虑几种不同的\
  \ RAID 方法：\n\n- `RAID 0`（条带化磁盘）仅是将原本存储在单个磁盘上的数据分散到多个磁盘上。这缩短了检索数据的时间，因为可以从多个驱动器同时读取，但它没有提高可靠性，因为任何一个驱动器的丢失都会导致所有数据的丢失（因为文件部分位于不同的磁盘上）。在\
  \ `RAID 0` 中，数据跨所有驱动器划分，没有任何冗余。\n- `RAID 1`（镜像磁盘）是 `RAID 0` 的相反。`RAID 1` 将一个磁盘的数据复制到两个或多个磁盘上。如果丢失任何磁盘，数据也不会丢失，因为它复制到了其他磁盘。这种方法可以提高可靠性和检索速度，但与其他技术相比，相对昂贵。\n\
  - `RAID 2`（位级纠错码）通常不使用，因为它在位级而非块级上跨驱动器进行数据条带化。它的设计旨在能够通过纠错技术恢复任何单个磁盘的丢失。\n- `RAID\
  \ 3`（字节条带化错误检查）在字节级上将数据分散到多个磁盘上，并用一个磁盘专门校验位。这种技术并不常见实现，因为由于需要访问同一块磁盘（带有校验位的磁盘），输入/输出操作无法重叠。\n\
  - `RAID 4`（专用校验磁盘）在多个磁盘上进行数据条带化，但其条带单元比 `RAID 3` 更大，并使用单个驱动器进行基于校验的错误检查。`RAID 4`\
  \ 的缺点是无法提高数据检索速度，因为所有检索仍然需要访问同一个校验磁盘。\n\n\n\n\n\n- `RAID 5`（带检查的块条带）是一种常用方法，它在块级对数据进行条带化并将校验数据分布在所有驱动器上。这既提供了可靠性又提高了速度性能。这种形式至少需要三个驱动器。\n\
  \n`RAID 0` 到 `5` 是原始技术，其中 `RAID 5` 是最常用的方法，因为它同时提供了可靠性和速度提升。此外还实现了其他方法，例如在磁盘上双倍备份校验数据（`RAID\
  \ 6`）以及镜像条带（`RAID 10`）。\n\n![image](img/examtip.jpg)\n\n**考试提示** 了解按编号划分的基础 RAID\
  \ 结构是一个可考点，应该为了考试牢牢记忆。\n\n## 集群\n\n另一种与负载均衡密切相关的技术是`clustering`（聚类）。这种技术将一组系统连接起来，使它们共同工作，作为一个单一系统运行。在许多方面，一个协同工作的计算机集群可以被视为单台更大的计算机，其优势是成本低于一台性能相当的单台计算机。集群还具有容错优势，即整个系统的性能不依赖于任何单一计算机系统。\n\
  \n## 负载均衡\n\n容错中的一种常用技术是`load balancing`（负载均衡）。这种技术设计用于将处理负载分布到两个或多个系统中。它旨在帮助提高资源利用率和吞吐量，同时也具有增加整个系统容错能力的额外优势，因为关键进程可能会分拆在几个系统上。如果任何一个系统故障，其他系统可以接管它正在处理的任务。虽然对整体吞吐量可能会有影响，但操作不会完全停止。负载均衡通常用于处理网站和高带宽文件传输的系统。\n\
  \n## 服务器\n\n服务器在所有阶段都是数据的焦点：在存储器中、在访问期间以及在处理期间。这使得服务器成为那些想要获取数据的人的攻击目标。在处理关键数据的服务器上采取必要的安全措施是降低风险的关键要素。在处理关键数据的机器上，不应运行不必要的服务。对机器的所有访问都应该受到控制，既要在逻辑访问控制层面，也应在逻辑网络分层层面。\n\
  \n## 灾难恢复概念\n\n许多类型的灾难（无论是自然灾害还是人为造成的）都可能导致你的业务中断一段时间。此类灾难与对你计算机系统和网络的威胁不同，因为导致中断的事件并非专门针对你的组织。这并不是说其他威胁不会中断业务——它们确实会，而且工业间谍、黑客攻击、不满的员工和内部威胁都必须考虑在内。本节的目的是指出你之前可能没有考虑过的额外事件。\n\
  \n你组织业务中断的时间在一定程度上取决于它对灾难的准备程度，以及制定了哪些减轻灾难影响的计划。表 7-1 中的任何一个事件都可能导致业务中断。\n\n![image](img/t0121-01.jpg)\n\
  \n**表 7-1** 灾难的常见原因\n\n幸运的是，这类事件发生得并不频繁。业务运营更有可能是由于员工错误而中断（例如意外损坏数据库，或为了插吸尘器而拔掉系统插头——这种事件在不止一个组织中发生过）。良好的灾难恢复计划将为你的组织应对任何类型的组织中断做好准备。\n\
  \n当灾难发生时，开始制定响应计划通常已经太晚了。后续关于备份计划与策略；备份执行与频率；以及冷备、热备和温备的章节提供了进行适当准备所需的详细信息。\n\n\
  ### 备份计划/策略\n\n备份在任何 IT 应急计划和业务连续性计划（BCP）中都非常重要，不仅是因为存在灾难的可能性，还因为硬件和存储介质会定期故障，导致关键数据的丢失或损坏。当安全措施失效且个人获取了重要信息时，组织可能还会发现备份至关重要。在组织的数据备份策略中，必须考虑几个因素：\n\
  \n- 应该多频繁地执行备份？\n- 备份需要多详尽？\n- 执行备份的流程是什么？\n- 谁负责创建备份？\n- 备份将存储在何处？\n- 备份将保存多久？\n\
  - 将维护多少份副本？\n\n请记住，备份的目的是在原始文件或存储介质损坏或丢失时，提供有效且未受损坏的数据。根据组织的类型，执行备份的法律要求也会影响其实现方式。\n\
  \n![image](img/note.jpg)\n\n**注意** 恢复过程可能从恢复一个经历硬件故障的单一系统，到在自然灾害等情况下恢复所有公司功能。灾难恢复计划（DRP）应该考虑这些不同的恢复水平。\n\
  \n### 备份执行/频率\n\n要备份的数据量和完成备份所需的时间直接影响将执行的备份类型。四种基本的备份类型、每种所需的空间以及使用每种策略进行恢复的难易性列在表\
  \ 7-2。\n\n![image](img/t0123-01.jpg)\n\n**表 7-2** 备份类型的特性\n\n表 7-2 中每个策略的值取决于你的特定环境。备份之间的变化越多，这些策略就越相似。每种策略的内容需要进一步解释。\n\
  \n最容易理解的备份类型是`full backup`（全备），即将所有文件和软件备份到存储介质上并清除归档位。从全备恢复同样简单——你必须将所有文件恢复到系统中。这个过程可能会花费大量时间。\n\
  \n\n\n\n\n在 `differential backup`（差异备份）中，只有自上次全量备份完成以来发生变化的文件和软件会被备份。这意味着需要定期执行全量备份。全量备份与中间差异备份之间的频率取决于您的组织，并是您所定义策略的一部分。从\
  \ `differential backup` 恢复需要两个步骤：首先需要加载最后一次全量备份，然后应用差异备份来更新自执行全量备份以来发生变化的文件。虽然差异备份过程可能需要时间，但所需的时间远少于全量备份，这是该方法的优点之一。显然，如果两次差异备份之间相隔了很长时间，或者您的环境导致大多数文件频繁变化，那么差异备份与全量备份相比没有太大区别。同样显而易见，为了完成差异备份，系统必须有一种方法来确定自某个时间点以来哪些文件发生了变化。归档位（archive\
  \ bit）便用于此目的。\n\n通过 `incremental backups`（增量备份），每个单独的增量中存储的信息更少。增量备份是差异备份的变体，区别在于，它不像差异备份那样备份自上次全量备份以来发生变化的所有文件，而是只备份自上次全量或增量备份以来发生变化的文件，因此需要备份的文件更少。与差异备份一样，增量备份也依赖于偶尔的全量备份。之后，您只备份自上次任何类型备份执行以来发生变化的文件。使用这种备份方法恢复系统需要花费大量工作。您首先需要回到上一次全量备份，并用这些数据重新加载系统。然后，您必须使用自那以后发生的每一次增量备份来更新系统。这种备份类型的优点是所需的存储空间和时间较少。缺点是恢复过程更为复杂。然而，假设您不需要频繁对系统进行完整恢复，那么增量备份是一种有效的技术。\n\
  \n最后，`delta backup`（增量/增量备份）的目标是在每次执行备份时尽可能保存最少的信息。与其他策略一样，需要偶尔进行全量备份。之后，当按特定间隔进行增量备份时，将仅存储文件中发生变化的部分。这种方法的优点显而易见。如果您的组织维护一个包含数千条记录和数百兆字节数据的大数据库，即使只更改了一条记录，在之前的备份类型中也会备份整个数据库。而对于增量备份，将仅存储发生变化的实际记录。该方法的缺点也显而易见——恢复是一个复杂的过程，因为它不仅仅是加载一个文件（或多个文件）。它需要运行应用程序来更新已更改文件中的记录。这一过程也被称为\
  \ `transactional backup`（事务备份）。\n\n每种类型的备份都有优缺点。哪种类型最适合您的组织，取决于您例行处理和存储的数据量、其变化频率、您预期从备份中恢复的频率以及许多其他因素。您选择的类型将极大地影响您的整体备份策略、计划和流程。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示 (EXAM TIP)** 备份策略是安全中至关重要的元素，您需要确保自己理解不同类型的备份及其优缺点。\n\
  \n组织所采用的备份策略类型通常受其执行备份活动频率的影响。备份的用性与自备份创建以来发生了多少变化直接相关，这显然受到备份创建频率的影响。自备份创建以来时间越长，可能发生的变化就越多。然而，关于组织应该多频繁地执行备份并没有一个简单的答案。每个组织都应该考虑在没有用于运行当前数据的情况下可以生存多久。然后，就可以确定使用各种方法从备份中恢复需要多长时间。这听起来很简单，但是一个严肃且复杂的决策。\n\
  \n与备份存储的位置相关的是恢复服务的所在地。与频率问题相关的是维护备份多久的问题。维护一个备份就足够了吗？安全专业人士会告诉你不能；由于各种原因需要维护多个备份。如果恢复数据是因为系统中发现了入侵者，为了恢复到入侵前的状态，如果入侵者在系统中留了几个月才被发现，且备份是每周一次，那么如果只维护一个备份将无法恢复到入侵前的状态。如果按照各种间隔维护了多个备份，则更容易回到入侵（或导致恢复的安全事件）发生的时间点。\n\
  \n备份保留策略或方法包括常见且易记的“三规则”，即保留最近的三个备份。当创建新备份时，旧的备份会被覆盖。另一种策略是保留不同时间间隔的最新备份。例如，您可能会保留最新的每日、每周、每月、年度备份。请注意，在某些环境中，法规可能会规定特定的频率和保留期，因此在决定您何时创建备份以及保留多久时，了解这些要求是重要的。\n\
  \n如果您不是处于法规规定备份频率和保留期的环境中，您的目标将是优化频率。在确定最佳备份频率时，需要考虑两个主要成本：您选择的备份策略的成本，以及如果不实施该策略时的恢复成本。您还必须在公式中考虑备份所需的概率。\n\
  \n在计算备份策略的成本时，请考虑以下要素：\n\n- 单个备份所需的介质成本\n- 备份介质和保留策略的存储成本\n- 执行单个备份相关的劳动成本\n- 创建备份的频率\n\
  \n所有这些因素都可以用于得出实施所选策略的年度成本，然后可以像之前一样使用该数字。\n\n与备份存储位置相关的是恢复服务的所在地。如果组织的设施遭受了物理损坏，拥有离线数据存储只是解决方案的一部分。这些数据需要在某个地方进行处理，这意味着需要与正常操作中类似的计算设施。这个问题可以通过多种方式来解决，包括热备场（hot\
  \ sites）、温备场（warm sites）和冷备场（cold sites）。\n\n#### 冷备场 (Cold Site)\n\n\n\n\n冷地（Cold\
  \ site）具备运行所需的 set 环境控制，但缺少处理数据所需的计算组件。使冷地投入运行可能需要几周时间。\n\n### 热备地（Hot Site）\n热备地完全配置的环境，类似于正常运行环境，根据其配置和组织需求，可以立即运行或在几小时内运行。\n\
  \n### 温备地（Warm Site）\n温备地经过部分配置，通常具有外围设备和软件，但可能没有昂贵的主处理器。它的设计目标是在几天内运行。\n\n***\n\
  \n![image](img/examtip.jpg)\n\n**考试提示** 备用站点（Alternate sites）是 CompTIA Security+\
  \ 考试中的高频考点。了解每个位置的数据是否可用同样重要。例如，热备地拥有重复数据或原始站点的近期就绪备份。冷地没有原始站点数据的当前或备份副本。温备地有备份，但这些备份通常是几天或几周前的。\n\
  \n### 本章总结\n在本章中，你熟悉了风险缓解策略的原则。章节首先介绍了变更管理、事件管理、用户权限和许可以及常规审计的概念。然后涵盖了使用安全控制措施防止数据丢失或被盗，包括如\
  \ `DLP` 等技术解决方案。\n\n接下来，你接触了业务连续性主题以及完成此活动相关的关键要素。涵盖了容错能力和高可用性概念，随后是了使用策略和程序来实现灾难恢复，包括备份策略。章节以对备用站点及其能力的检查作为结束。\n\
