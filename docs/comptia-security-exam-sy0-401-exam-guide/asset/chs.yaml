  \ B, 和 F。路由器和防火墙的设计都是为了有效过滤任何不需要的流量，并且可以过滤从桌面发出的任何电子邮件连接。垃圾邮件过滤器不仅可以过滤入站方向的邮件，如果它是出站邮件流的一部分，还可以过滤出站方向的邮件，这在恶意软件感染的情况下非常有帮助。\n\
  \n14. A. IDS 系统旨在在攻击发生时立即识别攻击，提供攻击正在发生的警告，并允许快速响应以缓解攻击。\n\n15. 这四种模型分别是基于行为的、基于签名的、基于异常的和基于启发式的。\n\
  \n# 第 2 章\n\n## 安全网络管理\n\n在本章中，你将：\n- 应用安全网络管理原则\n- 学习基于规则的管理系统，包括防火墙和交换机\n- 检查网络保护机制\n\
  \n本章将检查网络安全机制，包括路由器、交换机、防火墙和安全设备等网络设备。此外还讨论了安全机制，如访问控制列表、端口安全、`802.1x`、洪泛防护、环路保护和网络隔离，因为它们是安全网络管理的基础方法。\n\
  \n### 安全网络管理原则\n\n网络由硬件和软件组成，并在定义了预期运行条件的策略和程序下运行。安全网络管理原则包括正确配置硬件和软件，以及正确地执行操作和维护。从规划、设计到运行，所有这些元素都需要考虑安全因素。\n\
  \n### 基于规则的管理\n\n基于规则的管理是配置系统的常用方法。以这种方式定义预期运行状态，使其能够表示为规则，并由控制设备在运行时执行这些规则。这种方法用于防火墙、代理、交换机、路由器、反恶意软件、`IDS/IPS`\
  \ 等。每当一个数据包提交给控制设备时，就会应用并解释这组规则。这是将策略目标转换为实际操作的高效方式。\n\n### 防火墙规则\n\n防火墙通过对尝试通过的流量执行一组规则来工作。这组规则（防火墙规则集）是网络中特定点策略限制的镜像。因此，规则集会随防火墙的不同而异，因为它是每个点预期流量限制的操作实现。防火墙规则规定了防火墙应该允许特定流量通过还是将其拦截。防火墙规则的结构可以从简单到非常复杂，取决于防火墙的类型和流量的类型。包过滤防火墙可以对\
  \ `IP` 地址和端口进行操作，根据这些信息允许或拦截。状态数据包检测防火墙可以根据会话的状态进行操作——这是一个新会话还是会话的延续？它源自防火墙内部还是外部？应用层防火墙可以在更深层次上分析流量，检查流量的应用程序特征并在拦截特定操作的同时允许其他操作，即使在连接了网络的应用程序内部也是如此。\n\
  \n考试提示：防火墙通过检查数据包并根据规则集选择性地拒绝某些数据包来工作。防火墙充当特定网络点的流量门员或哨兵，允许某些数据包通过并拦截其他。\n\n所有防火墙规则集都应该包含一条隐式拒绝规则，以防止任何未被明确识别为允许的流量通过。防火墙按照自上而下的方式对流量执行规则，任何符合条件的允许或拦截规则都会结束处理。这意味着规则的顺序非常重要。这也意味着最后规则应该是拒绝所有规则，因为任何到达最后规则且未满足允许其通过规则的流量都应该被拦截。\n\
  \n### VLAN 管理\n\n某些交换机可以启用的另一种安全功能是虚拟局域网（`VLAN`）概念。Cisco 将 `VLAN` 定义为“交换式网络内的广播域”，这意味着信息仅以广播模式传输到\
  \ `VLAN` 内的设备。允许定义多个 `VLAN` 的交换机可以将广播消息隔离到特定的 `VLAN` 中。例如，如果办公室的每层都有一个交换机，其中两楼负责会计功能，两楼负责工程功能，两楼负责销售功能，那么为会计、工程和销售划分的\
  \ `VLAN` 就可以让这些组拥有独立的广播域，即使是跨越楼层的也是如此。这种配置增加了网络隔离，提高了吞吐量和安全性。\n\n未使用的交换机端口可以预配置到不连接到网络其余部分的空\
  \ `VLAN` 中。这显著增强了防止未经授权的网络连接的安全性。例如，如果一栋楼的所有房间都布了网络连接（包括为了方便和未来扩展的多个连接），这些未使用的端口就会对网络开放。一种解决方案是在交换机端断开连接，但这仅仅是将网络缺口移动到了交换机房。更好的解决方案是断开连接并在交换机中禁用该端口。这可以通过将所有未使用的端口连接到一个与网络其余部分隔离的\
  \ `VLAN` 中来实现。\n\n`VLAN` 还可以用于隔离管理网络的流量。配置管理 `VLAN` 以允许通过 `Telnet`、`SSH` 或交换机内置的\
  \ Web 远程访问交换机。需要注意的是，`VLAN` 不如 `VPN` 那样安全，因此你不应该依赖 `VLAN` 来保护敏感数据。出于此原因，管理 `VLAN`\
  \ 并不总是最佳解决方案。\n\n### 安全路由器配置\n\n正如第 1 章 所述，路由器的一个严重操作安全问题是对其内部功能的访问和控制。像许多网络设备一样，可以使用\
  \ `SNMP` 和 `Telnet` 访问路由器并进行远程编程。由于 `Telnet` 是明文传输，它本质上是不防窃听的。为了安全访问，应该使用如安全 Shell（`SSH`）的方法。\n\
  \n对路由器的物理控制是绝对必要的，因为如果任何设备（无论是服务器、交换机还是路由器）被黑客物理访问，它应该被认为已被攻破；因此，必须防止这种访问。与所有网络设备一样，确保管理员密码永不明文传输、仅使用安全机制访问路由器，并将所有默认密码重置为强密码是非常重要的。\n\
  \n\n\n\n\n就像交换机一样，路由器管理控制最可靠的访问方式是通过串行控制接口端口。这允许访问路由器的控制部分，而无需处理与流量相关的问题。对于公司内部网络，路由器的地理分布可能有限，但存在第三方解决方案，可以来实现带外远程管理。这允许即使从远程位置也能以一种安全的方式对路由器进行完全控制，尽管这需要额外的硬件。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 为了配置之目的连接到路由器，请务必使用安全连接。避免使用如 `Telnet`\
  \ 等明文连接，因为它们可能会导致凭据暴露给监听者。\n\n### 访问控制列表\n\n访问控制列表（`ACLs`）是用户及其许可操作的列表。可以通过多种方式识别用户，包括通过用户\
  \ ID、网络地址或令牌。其简单目标是创建一个查找系统，允许设备确定哪些操作是被允许的，哪些操作是被拒绝的。路由器可以包含一个 `ACL`，列出允许的地址或阻塞的地址，或者两者的结合。最常见的实现是用于文件系统，其中使用命名用户\
  \ ID 来决定允许用户访问哪些文件系统属性。这一通用概念被复用到网络中所有类型的设备和场景中。\n\n正如本章之前讨论的防火墙规则集适用于隐式拒绝规则，显式拒绝原则也可以应用于\
  \ `ACLs`。当使用这种方法构建 ACL 时，允许的流量必须通过 `permit` 语句被显式允许。规则集中所有特定的 `permit` 命令后面都紧跟着一个\
  \ `deny all` 语句。`ACL` 条目通常按照从上到下的方式进行评估，因此任何不匹配 `permit` 条目的流量都将被置于 `ACL` 最后一行的\
  \ `deny all` 语句丢弃。\n\n### 端口安全\n\n端口安全是交换机提供的一种功能，允许你控制哪些设备以及多少个设备通过交换机上的每个端口连接。端口安全通过使用\
  \ `MAC` 地址运行。尽管并不完美——`MAC` 地址可以被伪造——但端口安全可以提供所需的网络安全功能。\n\n端口安全有三种变体：\n\n- **静态学习**：为端口分配特定的\
  \ `MAC` 地址。这对于固定、专用的硬件连接非常有用。缺点是需要提前获并编程 `MAC` 地址，这使得它对于定义的连接良好，但对于访问性连接并不理想。\n\
  - **动态学习**：允许交换机在设备连接时学习 `MAC` 地址。当你预计会有少量有限的机器连接到端口时，动态学习是非常实用的。\n- **粘性学习**：同样允许多个设备连接到端口，但会将信息存储在内存中，并在重启后持续存在。这防止了攻击者通过重启交换机来更改设置。\n\
  \n#### 802.1x\n\nIEEE `802.1x` 是一种认证标准，支持用户与授权设备（如边缘路由器）之间的通信。IEEE `802.1x` 用于所有类型的网络，包括以太网、令牌环网和无线网络。该标准描述了在授予访问认证服务器（如\
  \ `RADIUS` 服务器）权限之前对用户进行身份验证的方法。`802.1x` 通过中间设备（如边缘交换机）运行，如果连接经过了适当验证，端口就可以携带正常流量。这防止了未经授权的客户端访问交换机上的公共端口，从而将未经授权的用户排除在\
  \ `LAN` 之外。在客户端成功向设备通过验证之前，交换机仅通过局域网可扩展认证协议（`EAPOL`）流量。\n\n`EAPOL` 是一种在 `802` 帧上传递可扩展认证协议（`EAP`）消息的封装方法。`EAP`\
  \ 是一种通用协议，可以支持多种认证方法，包括一次性密码、Kerberos、公钥以及智能卡等安全设备方法。一旦客户端成功向 `802.1x` 设备通过验证，交换机就会为正常流量开放端口。此时，客户端可以与系统的认证、授权和计费（`AAA`）方法（如\
  \ `RADIUS` 服务器）通信，并向网络进行身份验证。\n\n#### 洪泛\n\n一种攻击形式是洪水。有许多类型的洪泛攻击：ping 洪水、SYN 洪水、互联网控制消息协议（`ICMP`）洪水（Smurf\
  \ 攻击）和流量洪水。洪泛攻击被用作网络或系统拒绝服务的形式。检测洪泛攻击相对容易，但检测攻击与缓解攻击之间存在差异。洪泛可以通过断开连接或管理流量进行主动管理。洪泛通过管理流量流起作用。通过监控广播、多播和单播流量的流量速率和占带宽的百分比，洪泛可以检测何时阻塞流量以管理洪泛。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 洪泛防护通常实防火墙和 IDS/IPS 系统中防止 DoS 和 DDoS\
  \ 攻击。\n\n#### 环路保护\n\n交换机工作在 OSI 模型的第 2 层，在这一层没有倒计时机制来杀死陷入循环或永远无法解决的路径的数据包。第 2 层空间像一个网格，新设备的添加可能会在现有设备间的连接中产生环路。开放路径优先（`OSPF`）是一种链路状态路由协议，通常用于单个自治系统的网关之间。为了防止环路，几乎所有的交换机都采用名为生成树的技术。生成树协议（`STP`）允许存在多条冗余路径，同时破坏环路以确保正确的广播模式。`STP`\
  \ 是一种链路层协议，通过 IEEE 标准 `802.1D`。它通过修剪不属于生成树的连接来起作用。\n\n#### 隐式拒绝\n\n隐式拒绝是一个关键的安全原则。如果某个操作没有被明确允许，则该操作应该被拒绝。这防止了未知状况在系统中传播。隐式拒绝经常用于基于规则的系统，通过将最后一条规则设为\
  \ `deny all` 来实施。这意味着如果之前的任何允许操作规则没有被触发，那么提议的操作显然不是批准的操作之一，因此应该被拦截。\n\n#### 网络隔离\n\
  \n将网络流量分离到不同的通信区域可以增强安全性。可以使用桥器、交换机和 `VLAN` 来分离流量。流量隔离通过限制流量的范围来防止敏感流量被嗅探。将高度敏感流量与可能出现不受信任流量和访问的区域分开，可以防止拦截导致的意外泄露。网络隔离可以保持开发、测试和生产网络的分离，防止意外的交叉污染。\n\
  \n#### 日志分析\n\n大多数管理网络设备都可以记录各种状况。这些日志条目可以提供有关网络运行、流量状况以及攻击和入侵等状况的重要信息。只有在对日志进行分析和检查其包含的线索时，这些日志信息才有用。\n\
  \n\n\n\n\n`Unified threat management (UTM)` 是一个用于描述网络安全中合一设备的营销术语。`UTM` 设备通常提供广泛的服务，包括交换、防火墙、`IDS/IPS`、反恶意软件、反垃圾邮件、内容过滤和流量整形。这些设备旨在简化安全管理，目标用户是中小型网络。由于它们提供的服务范围广泛，它们通常位于网络边缘，管理进出网络的流量。\n\
  \n## 章节复\n\n本章首先审查了安全网络管理原则，包括访问控制列表、端口安全、`802.1x`、洪泛攻击器（flood guards）、环路保护和网络隔离。接着，审查了网络安全机制，包括路由器、交换机、防火墙和安全设备等网络设备。最后，介绍了安全机制，包括日志分析、隐式拒绝、`VLAN`\
  \ 管理和基于规则的安全机制，以说明操作控制。\n\n### 习\n\n为了帮助你进一步为 `CompTIA Security+` 考试做准备，并测试你的准备程度，请回答以下问题，然后与章节末尾的答案进行比对。\n\
  \n1. [#ch2.html#ch2q-1]. 洪泛攻击器功能可能防止以下哪些攻击？\n   A. 放大攻击攻击（Smurf attack）\n   B. 地址欺骗（Address\
  \ spoofing）\n   C. 暴力破解（Brute force）\n   D. SQL 注入\n\n2. [#ch2.html#ch2q-2]. 在使用显式拒绝法构建访问控制列表时，你会将“拒绝所有”语句放在哪里？\n\
  \   A. 在 `ACL` 条目的开头\n   B. 在任何处理 HTTP 流量的 `ACL` 条目之前\n   C. 在 `ACL` 条目的末尾\n   D.\
  \ 入站过滤器（ingress filter）\n\n3. [#ch2.html#ch2q-3]. 下列协议未用于环路保护？\n   A. 多生成生成树 (Multiple\
  \ Spanning Tree)\n   B. 快速生成树 (Rapid Spanning Tree)\n   C. 生成树协议 (Spanning Tree)\n\
  \   D. 开放最短路径优先 (Open Shortest Path First)\n\n4. [#ch2.html#ch2q-4]. `802.1x` 定义了\
  \ `EAP` 的封装。什么是 `EAP`？\n   A. 可扩展自主协议 (Extensible Autonomous Protocol)\n   B. 可扩展认证协议\
  \ (Extensible Authentication Protocol)\n   C. 扩展认证协议 (Extended Authentication Protocol)\n\
  \   D. 封装协议 (Encapsulation Protocol)\n\n5. [#ch2.html#ch2q-5]. 管理 `VLAN` 允许管理员执行以下操作？\n\
  \   A. 远程连接到交换机\n   B. 根据流量绑定 `VLAN`\n   C. 复制通过交换机的所有数据包\n   D. 根据时间自动重排 `VLAN`\n\
  \n6. [#ch2.html#ch2q-6]. 在 `ACLs` 中，隐式拒绝适用于以下网络流量：\n   A. 匹配 `ACL` 中的两个或多个规则\n \
  \  B. 不匹配 `ACL` 中的任何条目\n   C. 源自 `DMZ`\n   D. 来自欺骗地址\n\n7. [#ch2.html#ch2q-7]. 下列哪个不是安全路由器配置的最佳实践？\n\
  \   A. 禁用 `echo`、`CHARGEN` 和其他服务\n   B. 禁用 `IP source route`\n   C. 启用 `Telnet`\
  \ 访问\n   D. 启用日志\n\n8. [#ch2.html#ch2q-8]. 在交换机接口上启用端口安全时，流量通常基于什么：\n   A. `IP`\
  \ 地址\n   B. 源端口\n   C. 协议\n   D. `MAC` 地址\n\n9. [#ch2.html#ch2q-9]. 网络隔离主要用于：\n\
  \   A. 最大化性能\n   B. 限制所需的 `SPAN` 端口数量\n   C. 出于安全考虑隔离网络\n   D. 方便记录可疑流量\n\n10. [#ch2.html#ch2q-10].\
  \ UTM 设备可能放置于：\n    A. 网络运营中心\n    B. 公司网络边缘\n    C. 开发网络内部\n    D. 开发网络与生产网络之间\n\
  \n11. [#ch2.html#ch2q-11]. 你的公司防火墙在 `DMZ` 的入口接口上应用了以下规则。如果你需要阻止来自恶意 `IP` 地址的所有网络流量，你会将针对该恶意\
  \ `IP` 地址的显式拒绝语句放在哪里？\n\n    ![image](img/p0032-01.jpg)\n\n    A. 在第 30 行和 40 行之间\n\
  \    B. 在第 20 行和 30 行之间\n    C. 在第 10 行和 20 行之间\n    D. 在第 10 行之前\n\n12. [#ch2.html#ch2q-12].\
  \ 你被要求配置一台用于连接远程分支到公司总部的路由器。该路由器需要从总部进行远程管理。你建议使用哪种协议来管理远程路由器？\n    A. `HTTP`\n\
  \    B. `Telnet`\n    C. `SSH`\n    D. `SNMP`\n\n13. [#ch2.html#ch2q-13]. 你正在处理公司连接的交换机上启用端口安全。为了确保只有公司设备连接到网络，你会选择哪种类型的端口安全？\n\
  \    A. `Static` 静态方法\n    B. `Dynamic` 动态学习\n    C. `Sticky` 粘性方法\n    D. `LIFO`\
  \ 方法\n\n14. [#ch2.html#ch2q-14]. 你的公司政策不允许来自海外地址的连接。哪种安全机制最适合此？\n    A. `VLAN` 管理\n\
  \    B. `ACLs`\n    C. `Implicit deny` 隐式拒绝\n    D. `Network separation` 网络隔离\n\n\
  15. [#ch2.html#ch2q-15]. 在调查安全漏洞期间，你发现文件服务器连接到了开发人员可以的 `VLAN`。这违反了哪种安全原则？\n    A.\
  \ `VLAN management`\n    B. `Least privilege` 最小权限\n    C. `Network separation`\
  \ 网络隔离\n    D. `Loop protection` 环路保护\n\n#### 答\n\n1. A. 洪泛攻击器功能旨在防止 ping 洪泛、端口洪泛和拒绝服务攻击。放大攻击是一种拒绝服务攻击，攻击者向受欺骗源地址发送\
  \ ICMP 包到网络广播地址。结果是针对受害者的 ICMP 回应包洪水。\n\n2. C. 使用显式拒绝法构建 `ACL` 时，允许的流量必须通过允许语句显式允许。由于\
  \ `ACL` 条目通常自上而下的顺序评估，任何不匹配“允许”条目的流量将被位于 `ACL` 末尾的“拒绝所有”语句丢弃。\n\n3. D. 开放最短路径优先\
  \ (OSPF) 是一种链路状态路由协议，通常用于单个自治系统的网关之间。\n\n4. B. 在 `802.1x` 的背景下，`EAP` 代表可扩展认证协议 (EAP)。\n\
  \n5. A. 管理 `VLAN` 配置允许通过 `Telnet`、`SSH` 或交换机内置的 Web 界面访问交换机。\n\n6. B. 在访问控制列表中，隐式拒绝是列表末尾的捕获所有规则。所有流量都会匹配隐式拒绝规则，因此任何未被\
  \ `ACL` 之前的行允许的流量将到达 `ACL` 结尾并被拒绝。在某些防火墙和路由器中，系统会在每个 `ACL` 结束处自动强制隐式拒绝规则。\n\n\n\n\
  \n\n**7**. **C.** Telnet 是一种明文协议，这意味着任何可以拦截流量的人都能“看到”流量内容。Telnet 以明文形式传输用户 ID、密码和命令，本质上是一个不安全的协议。应该在所有路由器、防火墙和交换机上禁用\
  \ Telnet。\n\n**8**. **D.** 端口安全（Port security）允许你根据 MAC 地址限制流量。\n\n**9**. **C.**\
  \ 网络隔离主要用于出于安全目的对网络进行划分。例如，一个机构可能会在物理上或逻辑上将开发环境与生产环境隔离开。或者，传输敏感流量的网络可以与提供 Internet\
  \ 服务的公共访问网络进行物理隔离。\n\n**10**. **B.** 统一威胁管理（Unified threat management，简称 UTM）是将多个安全服务整合到单一设备中的概念。例如，一台\
  \ UTM 设备可以同时充当防火墙、防病毒解决方案、VPN 网关、负载均衡器和内容过滤器。由于其提供的功能，UTM 设备通常被放置在企业网络的边缘，在这些位置它们可以检查进入和离开网络的流量。\n\
  \n**11**. **D.** 第 10 行允许任何源 IP 地址通过 80 端口连接到 DMZ 内的 Web 服务器。如果你需要阻止来自恶意源 IP 地址的*所有*\
  \ Web 流量，你的显式拒绝（deny）语句必须放在第 10 行之前。\n\n**12**. **C.** 在列出的协议中，SSH 是路由器管理最安全的选择。SSH\
  \ 允许在加密会话中进行远程命令行登录、远程命令执行以及其他安全网络服务。\n\n**13**. **A.** 端口安全的静态方法允许你专门定义允许连接到交换机每个端口的\
  \ MAC 地址。这将让你能够确保只有经过批准的 MAC 地址的企业资产才能通过该交换机连接到网络。\n\n**14**. **B.** 在边缘设备上使用访问控制列表（ACL）是在路由器或防火墙上阻止选定\
  \ IP 地址访问的方法。\n\n**15**. **C.** 将生产资产（production assets）与开发资产互连违反了网络隔离原则。在物理或逻辑上将用于开发的网络与用于生产的网络分离是一项安全最佳实践。\n\
  \n# 第 3 章\n\n## 安全网络设计\n\n在本章中，你将：\n\n- 研究网络设计元素\n- 探索网络组件\n- 发现子网是如何创建的\n- 学习如何实现常用协议\n\
  - 学习如何实现常用服务\n\n安全网络设计是一个包含硬件、软件以及策略和程序等组成元素的目标。适当的设计始于理解网络的目标。为了实现设计目标，文中将讨论协议的恰当实现和使用。\n\
  \n### 网络设计元素与组件\n\n与单服务器不同，网络是以多个设备连接的形式形式的。网络的一个关键特征是其布局，即 `topology`（拓扑结构）。适当的网络拓扑会考虑安全性，并有助于将“安全构建”到网络中。与安全相关的拓扑包括根据用途和功能划分网络部分、策略性地设计用于\
  \ IDS（入侵检测系统）监控的点、构建冗余以及增加容错特性。\n\n**考试贴士** 本章关于如何使用组件设计网络。在考试期间，预计你将熟悉基础网络设计元素和组件。\n\
  \n### DMZ 安全区域\n\n安全性的第一个方面是分层防御。就像城堡有护城河、外墙、内墙甚至主楼一样，现代安全网络也有不同层次的保护。不同的区域旨在提供层层防御，最外层提供基础保护，而最内层提供最高级别的保护。一个持续存在的问题是，访问性往往与保护水平成反比，因此同时提供完全保护和无限制访问是困难的。访问与安全之间的权衡通过区域来处理，连续的区域由防火墙守卫，防火墙执行日益严格的安全策略。\n\
  \n最外层的区域是 Internet，这是一个自由的区域，不受任何特定控制。在内部安全企业网络和 Internet 之间存在一个机器被认为有风险的区域。这个区域被称为\
  \ `DMZ`，其名称源于军事术语“非军事区”（demilitarized zone），在那里双方都没有任何特定的控制。在内部网络网络中，经常会划分出不同的分支以提供特定的功能区域。\n\
  \n#### DMZ\n\nDMZ 是一个军事术语，指通过协议划分的两个对立力量之间的地面，目的是作为双方之间的缓冲区。计算机网络中的 `DMZ` 使用方式相同；它充当不受控制的\
  \ Internet 与组织已建立安全策略的内部安全网络之间的缓冲区（参见[图 3-1]）。为了界定这些区域并实施隔离，在 `DMZ` 的每一侧都使用了防火墙。这些防火墙之间的区域可以从内部安全网络或\
  \ Internet 访问。图 3-1 展示了由于防火墙放置而产生的这些区域。防火墙专门设计用于防止从 Internet 直接跨越 DMZ 访问内部安全网络。\n\
  \n应特别注意放置在 `DMZ` 中的网络设备的安全设置，并且应始终认为它们可能被未经授权的使用而攻破。一个常见的行业术语 `hardened operating\
  \ system`（加固操作系统）适用于功能被锁定以保护安全性的机器。这种方法需要应用到 `DMZ` 中的机器上，尽管这意味着它们的功能受到限制，但这些预防措施确保了机器在安全性较低的环境中能够正常工作。\n\
  \n许多类型的服务器都属于该区域，包括为 Internet 用户提供内容的 Web 服务器，以及远程访问服务器和外部电子邮件服务器。通常情况下，任何直接从外部不可信的\
  \ Internet 区域直接访问的服务器都需要位于 `DMZ` 中。其他服务器不应放置在 `DMZ` 中。内部信任网络的域名服务器以及存放企业数据库的数据库服务器不应能从外部访问。应用程序服务器、文件服务器、打印服务器——所有在信任网络中使用的标准服务器——都应该位于防火墙之后，以及连接这些机器的路由器和交换机之后。\n\
  \n使用 `DMZ` 拓扑结构的理念是迫使外部用户在访问信任网络内部信息之前，必须在 `DMZ` 中至少跳转一次。如果外部用户请求信任网络中的资源（例如通过 Web\
  \ 页面请求数据库数据元素），那么该请求需要遵循以下场景：\n\n1. 来自不可信网络（Internet）的用户通过 Web 页面向 `DMZ` 中的 Web\
  \ 服务器请求。\n2. `DMZ` 中的 Web 服务器向应用程序服务器请求数据，应用程序服务器可以位于 `DMZ` 中也可以位于内部信任网络中。\n3. 应用程序服务器向信任网络中的数据库服务器请求数据。\n\
  \n\n\n\n\n4. 数据库服务器将数据返回给应用程序服务器。\n5. 应用服务器将数据返回给请求的 Web 服务器。\n6. Web 服务器将数据返回给来自不可信网络的请求用户。\n\
  \n这种分离实现了两个特定的、独立的任务。首先，将用户与在安全网络上的数据请求进行隔离开来。通过让中间设备进行请求，这种分层方法允许实施重大的安全级别。用户无法对其请求进行直接访问或控制，这种过滤过程可以实施相应的控制措施。其次，扩展性更容易实现。这种多服务器解决方案可以设计得具有极高的扩展性，理论上可以支持数百万用户，而不会减慢任何特定层的速度。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试贴士** DMZ（非军事化区）作为网络中不受保护区域（互联网）和受保护区域（敏感公司数据存储）之间的缓冲区，允许对这两个区域之间的流量进行监控和规管。\n\
  \n### 子网划分\n\nIP 地址（`IPv4`）由两部分组成：网络地址和主机地址，组合成一个 32 位的数字。高位表示网络地址，低位（或剩余位）表示主机地址。分离点定义为子网掩码。最初，`IPv4`\
  \ 地址空间是根据某些标准划分成一系列地址范围，详见表 3-1。随着时间的推移，这种方法被认为过于局限，于是开发了一种名为无类分类域间路由（`CIDR`）的新方案。`CIDR`\
  \ 允许将 `IPv4` 地址空间划分为用户定义的块，从而提供了更大的灵活性。\n\n![image](img/t0038-01.jpg)\n\n**表 3-1**\
