  \n\n\n\n\n公共 CA（证书颁发机构）专门验证个人身份并创建和维护其证书。这些公司颁发的证书不限于特定的公司或公司内部部门。相反，它们的服务是供更大、更多样化的群体和组织使用的。如果一家公司使用公共\
  \ CA，该公司公司将向 CA 组织支付个人证书费用以及维护这些证书的服务费用。公共 CA 的示例包括 VeriSign（包含 GeoTrust 和 Thawte）、Entrust\
  \ 和 GoDaddy。\n\n使用公共 CA 的优势之一是，它们通常为人所知，并且许多人都可以访问。大多数网络浏览器都默认安装并配置了公共 CA 列表，以及它们相应的根证书。这意味着，如果你在计算机上安装了网络浏览器，它已经配置为信任某些\
  \ CA，尽管你以前可能从未听过它们。因此，如果你从 Bob 处收到一个证书，而他的证书是由你浏览器中列出的 CA 进行数字签名的，你就可以自动信任该 CA，并轻松完成验证\
  \ Bob 证书的过程。然而，这引起了一些安全专业人员的关注，因为信任是默认安装的，但行业认为这是一种必要的方法，可以为用户提供透明并增强功能。如果用户想对系统信任谁、不信任谁拥有更多控制权，可以从其浏览器列表中删除这些\
  \ CA。\n\n在本章较早之前，已经解释了不同的证书类别及其用途。没有全球性标准来定义这些类别、获取这些不同证书的准确要求或它们的用途。虽然已经有了标准（通常是针对特定国家或行业），但这意味着公共\
  \ CA 可以定义自己的证书分类。对于依赖公共 CA 的公司来说，这不一定是一件好事，因为这并没有对公司如何解释证书分类以及如何使用这些分类提供足够的控制。\n\
  \n这意味着，对于使用和依赖公共 CA 的公司，需要仔细开发另一个组件，该组件被称为 `证书策略 (CP)`。该策略允许公司决定哪些证书类别是可以接受的，以及它们在组织内部如何被使用。这与\
  \ `CPS`（证书实践声明）不同，后者解释了 CA 如何验证实体、生成证书以及维护这些证书。`CP` 由使用外部 CA 的单个公司生成并拥有有，它允许公司执行其安全决策，并控制证书在应用程序中的使用方式。\n\
  \n### 信任模型\n\n`信任域 (trust domain)` 是系统、人员、应用程序、协议、技术和策略的构体，它们共同工作以提供特定级别的保护。所有这些组件可以在同一个信任域内无缝协作，因为它们对域内的其他组件是已知的，并在某种程度上是受信任的。不同的信任域通常由不同的管理员组管理，具有不同的安全策略，并限制外部人员的特权访问。\n\
  \n大多数信任域（无论是个人公司还是部门）通常不是与世隔绝的孤岛——它们需要与其他信任程度较低的域进行通信。诀窍在于确定两个不同的域之间应该相互信任多少，以及如何实现和配置一种基础设施，允许这两个域以一种不会导致安全泄露或破坏的方式进行通信。这比听起来要困难得多。\n\
  \n在本章较之前考虑的一个信任示例是 `DMV`（车辆管理局）颁发的驾照。例如，Bob 正在从 Carol 那处买一盏灯，他想用支票支付。由于 Carol 不认识\
  \ Bob，她不知道是否可以信任他，或者对他的支票有多大信心。但如果 Bob 向 Carol 展示他的驾照，她可以将姓名与支票上的姓名进行对比，并选择接受它。在这种情况下，`信任根源\
  \ (trust anchor)`（双方认可的信任第三方）是 `DMV`，因为 Carol 和 Bob 对它的信任程度超过了他们彼此之间的信任。由于 Bob 必须向\
  \ `DMV` 提供证明其身份的材料，该机构信任他到足以生成一张执照，而 Carol 信任 `DMV`，所以她决定信任 Bob 的支票。\n\n考虑另一个信任根源的例子。如果\
  \ Joe 和 Stacy 需要通过电子邮件通信，并希望使用加密和数字签名，他们不会仅仅信任对方的证书。但当双方收到对方的证书，并看到双方都由一个他们都信任的实体——CA\
  \ 进行了数字签名时，那么他们之间就有了更深层次的信任。这里的信任根源是 `CA`。这足够容易，但当我们在不同的 CA 和 PKI 环境之间建立信任根源时，情况就会变得复杂。\n\
  \n当两家公司需要使用各自的 PKI 进行通信时，或者同一家公司的两个部门使用不同的 CA 时，就会涉及到两个独立的信任域。它们需要通信，并且构建并维护一条通信通道。\n\
  \n两个颁发机构（CA）之间必须建立信任关系。这发生在一个或两个 CA 为对方颁发证书时。信任路径可以是单向的或双向的，因此两个 CA 相互信任（双向），或者只有其中一个信任另一个（单向）。\n\
  \n\n\n\n中间级 CA 的功能是在不同的 CA 之间传递信任。这些 CA 被称为 `subordinate CAs`（从属 CA），因为它们从属于它们所引用的\
  \ CA。信任路径从从属 CA 向上到高级 CA 追溯；本质上，从属 CA 正在使用高级 CA 作为参考对象。\n\n如图 24-10 所示，不存在双向信任——它们都是单向信任，如单向箭头所示。由于没有其他实体可以为根根\
  \ CA 颁发并生成证书，因此它创建了自签名证书。这意味着证书的颁发者（issuer）和主体（subject）字段包含相同的信息，都代表根 CA，并且在需要时，根\
  \ CA 的公钥将用于验证此证书。该根 CA 证书和公钥分发给此信任模型中的所有实体。\n\n### 遍历证书路径\n\n当一个信任域中的用户需要与另一个信任域的用户通信时，其中一个用户需要验证另一个用户。这听起来很简单，但它的实际意味着必须验证从到共享信任锚的每个\
  \ CA 的每个证书。如果 Debbie 需要像图 24-10 所示那样验证 Sam 的证书，她实际上还需要验证叶级 CA（Leaf CA）和中间 CA（Intermediate\
  \ CA）证书。\n\n因此，在图 24-10 中，我们有一个用户 Sam，他对消息进行数字签名并将其证书发送给 Debbie。Debbie 在信任 Sam 之前需要验证此证书。Sam\
  \ 的证书中包含一个颁发者字段，指示证书是由 Leaf CA 颁发的。Debbie 必须获取 Leaf CA 的证书和公钥。记得 Debbie 通过验证其数字签名来验证证书。数字签名是由颁发者使用其私钥创建的，因此\
  \ Debbie 需要使用颁发者的公钥验证签名。\n\nDebbie 跟踪了 Leaf CA 的证书和公钥，但她现在需要验证这个 CA，因此她查看颁发者字段，该字段指示证书是由\
  \ Intermediate CA 颁发的。Debbie 现在需要获取 Intermediate CA 的证书和公钥。Debbie 的客户端软件追踪了这个过程并发现\
  \ Intermediate CA 的颁发者是根 CA，而她已经有了根 CA 的证书和公钥。因此，Debbie 的客户端软件必须遵循 `certificate\
  \ path`（证书路径），这意味着它必须追踪并收集证书，直到遇到自签名证书。自签名证书表示它是由根 CA 签名的，而 Debbie 的软件已配置为信任此实体作为她的信任锚，因此她可以在此停止。图\
  \ 24-11 说明了 Debbie 的软件为了能够验证 Sam 的证书而必须执行的步骤。\n\n![image](img/f0483-01.jpg)\n\n\
  **图 24-11** 验证证书路径中的每个证书\n\n这种简单的信任模型在容易遵循层级组织架构图的企业内部运行良好，但许多公司无法使用这种信任模型，因为不同的部门或办公室需要它们自己的信任锚。这些需求可能源于直接的业务需求或组织间的政治考虑。当两家或更多公司需要相互通信时，这种层级模型可能是不可能的。任何一家公司都不会让对方的\
  \ CA 成为根 CA，因为它们并不一定信任对方实体到那种程度。在这些情况下，CA 将需要以对点关系工作，而不是层级关系。\n\n### 对点模型\n\n在 `peer-to-peer\
  \ trust model`（对点信任模型）中，一个 CA 不从属于另一个 CA，且 CA 之间不存在建立的信任锚。终端实体将其颁发 CA 视为自己的信任锚，但不同的\
  \ CA 将没有共同的锚点。图 24-12 说明了这种信任模型。两个不同的 CA 将为对方的公钥颁发证书，从而创建了双向信任。这被称为 `cross-certification`（交叉认证），因为\
  \ CA 并不是从上级 CA 接收证书和公钥，而是为彼此创建它们。\n\n![image](img/f0483-02.jpg)\n\n**图 24-12** 交叉认证创建了对点\
  \ PKI 模型。\n\n该模型的主要缺点之一是扩展性。每个 CA 必须验证参与的每一个其他 CA，并且必须实现双向信任路径，如图 24-13 所示。如果由一个根\
  \ CA 为所有的中间 CA 颁发证书，扩展性就不是那么大问题了。图 24-13 代表了一个全连接的 `mesh architecture`（网状架构），这意味着每个\
  \ CA 都直接连接到每个其他 CA 并具有双向信任关系。正如你在插图中看到的，这种设置的复杂性可能会变得难以接受。\n\n![image](img/f0484-01.jpg)\n\
  \n**图 24-13** 扩展性是交叉认证模型中的缺点。\n\n### 混合信任模型\n\n一家公司内部可能非常复杂，当需要以授权且安全的方式与外部合作伙伴、供应商和客户进行适当通信时，这种复杂性可能使得坚持使用层级或对点信任模型变得困难，甚至是不可能的。在许多实现中，必须结合不同的模型类型，以提供必要的通信链路和信任级别。在\
  \ `hybrid trust model`（混合信任模型）中，两家公司有自己的内部模型，并通过使用交叉认证的对点模型连接。\n\n这种混合配置的另一种选择是实现\
  \ `bridge CA`（桥接 CA）。图 24-14 说明了 `bridge CA` 可能扮演的角色——它负责为所有连接的 CA 和信任域颁发交叉证书。`bridge\
  \ CA` 不被认为是根或信任锚，而仅仅是为连接的环境生成并维护交叉认证的实体。\n\n![image](img/f0485-01.jpg)\n\n**图 24-14**\
  \ 桥接 CA 可以控制交叉认证程序。\n\n![image](img/examtip.jpg)\n\n**考试提示** 存在三种信任模型：层级、对点和混合。层级信任像一棵倒挂的树。对点是一个横向的系列，而混合是层级和对点的结合。\n\
  \n### 本章总结\n\n在本章中，你熟悉了加密算法的应用。哈希值是涵盖的第一类型，紧接着是对称算法。之后是非对称算法，然后介绍了常见的应用。本章最后介绍了公钥基础设施\
  \ (`PKI`)，这是管理公钥的关键元素。本章的许多内容是之前内容的重复，但重要的是学习在什么情况下使用哪些加密算法。\n\n### 问题\n\n为了帮助你进一步准备\
  \ CompTIA Security+ 考试并测试你的准备情况，请回答以下问题，然后与章节末的正确答案列表进行比对。\n\n1. 为什么 `DES` 不再有效？\n\
  A. 它只对公钥有效。\nB. 它的密钥空间太小。\nC. 它被一次性密码方法取代了。\nD. 它被 `AES` 取代。\n\n2. `SSL` 依赖什么进行身份验证？\n\
  A. `SHA-1` 哈希值\nB. 客户端的数字签名。\n\n\n\n\n### **C.** 由根 `CA` 建立的信任分级\n\n### **D.** 私钥密码\n\
  \n### 3. 一次性密码的独特性是什么？（选择所有适用项。）\n\n**A.** 极其困难的密钥共享\n**B.** 完整性\n**C.** 4096 位对称密钥\n\
  **D.** 不可破解的\n**E.** 容易受到弱密钥的影响\n\n### 4. 你将使用以下哪种项来机密地验证用户身份？\n\n**A.** 密码认证协议\
  \ (PAP)\n**B.** 挑战握手认证协议 (CHAP)\n**C.** A 和 B 都是\n**D.** A 和 B 都都不是\n\n### 5. 你会用什么来创建\
  \ `HMAC`？\n\n**A.** `TLS`\n**B.** `MD5` 或 `SHA`\n**C.** `AES`\n**D.** `Bcrypt`\n\
  \n### 6. 哪种密码算法取决于质数因子分解的难度？\n\n**A.** `AES`\n**B.** `SHA`\n**C.** `RC4`\n**D.**\
  \ `RSA`\n\n### 7. Twofish 相比其前身 Blowfish 优在哪里？\n\n**A.** Twofish 是一种非对称算法。\n**B.**\
  \ Twofish 使用更复杂的 S 盒来防止字典攻击。\n**C.** Twofish 对某些类弱密钥的脆弱性较低。\n**D.** 以上所有项。\n\n###\
  \ 8. `SSH` 使用公钥的目的是？\n\n**A.** 加密\n**B.** 会话密钥交换\n**C.** 客户端认证\n**D.** A 和 B 都是\n\
  **E.** B 和 C 都是\n**F.** 以上所有项\n\n### 9. Diffie-Hellman 代表密码学的哪个分支？\n\n**A.** 流加密\n\
  **B.** 对称\n**C.** 非对称\n**D.** 哈希函数\n\n### 10. 当生成 `CSR` 时，实际发送给 `CA` 的内容是什么？\n\n\
  **A.** 一个等待由 `CA` 解密的加密挑战\n**B.** 申请者的公钥和一些身份识别信息\n**C.** 申请者的私钥、公钥以及 `X.509` 信息\n\
  **D.** `PKCS #2` 消息\n\n对于问题 1–15，请假设以下场景：你们公司的首席信息官 (CIO) 在行业杂志上读到了关于公钥基础设施的内容，认为新的\
  \ `PKI` 系统可以解决公司所有的问题。他要求你设计并实现该 `PKI` 系统，以支持公司使用的所有加密并管理所有的密钥。\n\n### 11. 你可能需要哪些算法来支持\
  \ CIO 为你设的所有目标？\n\n**A.** `SSL`\n**B.** `SHA`\n**C.** `AES`\n**D.** `DES`\n**E.**\
  \ `RSA`\n**F.** `CHAP`\n\n### 12. 以下哪项最可能提供完全前向保密？\n\n**A.** `3DES`\n**B.** `Blowfish`\n\
  **C.** `EDH`\n**D.** `SHA-3`\n\n### 13. 桌面支持团队想要再增加一个认证因子。你的建议是什么？\n\n**A.** 独立生物识别\n\
  **B.** 带有数字签名的智能卡\n**C.** 动态认证码（滚动的认证码）\n**D.** 非接触式访问卡\n\n### 14. CIO 要求你确保所有电子邮件都具有严格的不可否认性。`PKI`\
  \ 系统如何解决这个问题？\n\n**A.** 管理用于邮件加密的对称密钥\n**B.** 强制所有用户在访问邮件服务器时使用双因子身份认证\n**C.** 使用\
  \ `PKI` 在 `SMTP` 传输中支持 `TLS`\n**D.** 为所有用户颁发数字证书用于签名邮件\n\n### 15. 当 `PKI` 系统与文件和文件夹加密结合使用时，潜在风险是什么？\n\
  \n**A.** 丢失或损坏的密钥会导致数据永久锁定。\n**B.** 加密会阻止备份运行。\n**C.** 一旦 `PKI` 的根密钥被破解，所有加密数据都可以被读取。\n\
  **D.** 加密永远没有风险。\n\n### 答案\n\n### 1. **B.** `DES` 不再认为有效，因为考虑到现代计算机的速度，其原始的 56 位密钥空间太小了。暴力破解可以在几天甚至几小时内破解破密钥。\n\
  \n### 2. **C.** `SSL` 认证由受信任机构签名的服务器证书处理，这创建了一个信任分级——由于你信任根权威，你就信任任何由根权威签名的内容，包括由根签名的证书。\n\
  \n### 3. **A** 和 **D.** 一次性密码依赖于密钥长度与明文长度完全相等。这使其在实践上是不可破解的，因为它不受密码分析的影响。\n\n###\
  \ 4. **B.** 挑战握手认证协议 (`CHAP`) 通过握手来保护身份认证信息。\n\n### 5. **B.** 使用 `MD5` 或 `SHA` 创建密钥哈希消息码。\n\
  \n### 6. **D.** `RSA` 是一种非对称密码，因为它有公钥也有私钥。公钥是两个大质数的积，这确保了密码的安全性。\n\n### 7. **C.**\
  \ `Blowfish` 存在某些类弱密钥。Twofish 不存在此问题。\n\n### 8. **E.** `SSH` 使用公钥在启动时交换加密密钥。如果配置，它还可以使用公钥来验证客户端。\n\
  \n### 9. **C.** Diffie-Hellman 方法是非对称的。\n\n### 10. **B.** `CSR` 主要是申请者的公钥以及一些附加信息，以便生成签名的证书。\n\
  \n### 11. **B**、**C** 和 **E.** `RSA` 将作为公钥密码，`AES` 用于对称密码，`SHA` 作为哈希算法。\n\n### 12.\
  \ **C.** 临时 Diffie-Hellman (`EDH`)——关键部分是*临时的* (ephemeral)，这意味着使用了临时（不重复使用的）密钥；这提供了完全前向保密。\n\
  \n### 13. **B.** 智能卡可以利用新的 `PKI` 实现，并为双因子认证问题提供内部解决方案。\n\n### 14. **D.** 颁发数字证书将允许所有用户对发送的邮件进行签名，这要求发送时私钥存在，并确保了不可否认性。\n\
  \n### 15. **A.** 如果系统未包含密钥托管，密钥的丢失会导致数据无法恢复。\n\n\n\n\n网络是互连的计算机和专用硬件组，旨在促进数据从一个设备传输到另一台设备。网络的基本功能是允许机器和设备以有序的方式相互进行通信。\n\
  \n## 网络框架与协议\n\n如今的网络由来自多个供应商的各种类型和尺寸的设备组成。为了确保设备之间信息有效且高效的传输，需要对供应商之间如何进行传输达成一致。\n\
  \n`protocol`（协议）一词指的是为了实现特定层次的功能而开发的一套标准规则集。在网络中，已经开发了许多协议，其中一些是私有的，另一些是公共的，以便机器之间的通信。就像说话者需要共同语言来交流，或者至少必须理解对方的语言一样，计算机和网络必须约定某种通用的协议。\n\
  \n通信要求所有方对所讨论的对象有共同的理解。如果该对象是无形的或不存在，每方都需要某种方法来引用这些项目，以便另一方能够理解。`model`（模型）是一种用作框架的工具，在人们讨论项目时提供共同的参考点。数学模型在科学领域中很常见，因为它们赋予人们比较答案和结果的能力。与此类似，模型被用于许多学科以促进通信。许多公司开发了网络模型，作为工程师之间交流的方式，用于说明网络中何时、何地发生了哪些特定的功能。\n\
  \n随着互联网的形成，需要一系列协议来确保跨这一通用网络结构的互操作性。传输控制协议（`TCP`）、用户数据报协议（`UDP`）和互联网协议（`IP`）是实现数据在互联网上移动的三种常用协议。由于这些协议相互协作工作，你通常会看到\
  \ `TCP/IP` 或 `UDP/IP` 成对使用。对这些术语以及协议和模型用法的基本理解，对于讨论网络功能至关重要，因为它提供了必要的参考点，以理解在网络涉及的复杂操作流中，在何时、何地发生了什么。\n\
  \n## OSI 模型\n\n为了促进跨供应商和跨公司的通信，1984 年，国际标准化组织（`ISO`）创建了用于网络的开放系统互连（`OSI`）模型。`OSI`\
  \ 模型可能是网络领域中被引用最多、讨论最广泛的模型。尽管它在北美并未完全普及，但它的部分已被采纳为参考点，甚至被整合到公司名称中。第 2 层、第 3 层、网络层、第\
  \ 3 级这些都是 `OSI` 模型部分的引用。这些引用允许人们在讨论抽象和脱离上下文的问题时，以清晰且无歧的方式进行通信。这些引用为复杂网络领域的细节提供了背景。`level`（级）和\
  \ `layer`（层）这两个术语被交叉用于描述 `OSI` 模型的部分，尽管 `layer` 是更常用的术语。\n\n`OSI` 模型由线性堆叠的七层组成。这些层从上到下分别是应用层、表示层、会话层、传输层、网络层、链路层和物理层。你可以使用助记法：All\
  \ People Seem To Need Data Processing（所有人似乎都需要数据处理）。每一层都有定义的功能和分离，旨在允许多个协议以协调的方式共同工作。\n\
  \n尽管 `OSI` 模型可能是最常引用的标准化的网络模型，但一种更常见的模型——互联网模型已经崛起并主导了互联网。`OSI` 模型享有正式的、定义的国际标准的地位，而互联网模型从未被正式定义过。互联网模型基本上与\
  \ `OSI` 模型相同，仅将前三个 `OSI` 层合并为了单一的应用层，使互联网模型总共只有五层。两种模型都如图图 A-1 所示。\n\n![image](img/f0495-01.jpg)\n\
  \n**图 A-1** OSI 和互联网网络模型\n\n这些模型的一个方面是，它们允许特定层次的功能被分开并顺序执行。这种划分还决定了哪些层可以与其他层通信。在每一层，都可以存在特定的数据格式和协议，这使得它们与其他机器上相同层的相似协议和数据格式兼容。这使得每一层似乎都在与另一台计算机上相同层的对应层进行通信，尽管这只是一个虚拟连接。框之间唯一的真实连接位于这些模型的物理层。所有其他连接都是虚拟的——尽管它们对用户来说是真实的，但它们在现实中并不存在。\n\
  \n层之间的真实通信发生在垂直方向上，向上和向下——每一层只能与其上方和下方的相邻层进行通信。在图 A-2 中，直接通信路径显示为两个物理层之间的粗线。框之间的所有数据都通过这条线。高层之间的虚线表示虚拟连接，并且对于大多数层还列出了相关的活动和协议（协议也列在表\
  \ A-1 中）。这些虚线是虚拟的——数据并没有实际上穿过它们，尽管看起来像穿过了一样。数据的真实路径到达物理层，然后返回另一台机器上的同一层。\n\n![image](img/f0495-02.jpg)\n\
  \n**图 A-2** 网络模型通信路径\n\n![image](img/t0496-01.jpg)\n\n**表 A-1** 按 OSI 层划分常用协议\n\n\
  ## 应用层\n\n应用层是实际使用的应用程序的典型接口。这是通信栈中通常负责启动通信请求的层。例如，Internet Explorer 是一个在应用层使用 `HTTP`\
  \ 在系统间移动数据的应用程序。这一层代表了用户对系统和网络的访问。虽然应用程序似乎直接与另一台机器上的应用程序通信，但这实际上是一个`virtual`连接。应用层在\
  \ `OSI` 模型中也被称为第 7 层。应用层中常见的几种协议，包括超文本传输协议（`HTTP`）、简单邮件传输协议（`SMTP`）和简单网络管理协议（`SNMP`）。\n\
  \n在 `OSI` 模型中，应用层实际上只与其所在机器上的表示层通信。在互联网模型中，应用层正下的一层是传输层，这是该模型中应用层直接调用的层。由于互联网模型中“缺失”了表示层和会话层，这些\
  \ OSI 层的功能由应用层执行。\n\n互联网模型应用层中存在的会话层功能包括网络通信端之间逻辑会话的启动、维护和终止。会话层功能还包括会话级计数和加密服务。`OSI`\
  \ 模型的表示层功能也包含在互联网模型的应用层中，特别是格式化接收数据显示参数的功能。任何未具体包含在互联网模型底层中的其他功能都具体包含在应用层中。\n\n\n\
  \n\n表示层的命名源于其主要功能：为数据的呈现做准备。它负责为不同类型终端或显示器的不同接口准备数据，这样应用程序就不需要处理这项任务了。数据压缩、字符集翻译和加密都位于这一层。\n\
  \n表示层仅与两个层进行通信：上方的应用层和下方的会话层。表示层也称为 OSI 模型的第 6 层。\n\n### 会话层\n\n会话层的主要职责是管理机器之间的通信会话。管理功能包括启动、维护和终止会话。管理会话可以比作拨打普通电话。当你拨号时，你启动了一个会话。在通话期间，会话必须保持开启状态。通话结束，你挂断电话，电路必须终止。由于每个会话都可以有自己的参数，会话层负责设置这些参数，包括安全、加密以及计费或统计功能。\n\
  \n会话层专门与上方的表示层和下方的传输层进行通信。会话层也称为 OSI 模型第 5 层。\n\n### 传输层\n\n传输层负责跨网络连接的端到端数据传输。为了完成这项任务，传输层通过逻辑连接处理进入和离开网络的数据。它可以添加并使用特定地址的信息（如端口）来完成此任务。`port`\
  \ 是一种特定地址的扩展，允许机器之间进行多个并发通信。如果数据传输量对于单包传输来说太大，传输层将负责将数据流拆分成块并重新组装。它确保所有数据包都已传输和接收，并且它可以请求丢失的数据包并消除重复的数据包。错误检查也可以在此级别执行，尽管此功能通常在数据链路层执行。\n\
  \n协议可以是面向连接的，也可以是无连接的。如果协议是面向连接的，传输层将管理连接信息。在 `TCP` 的情况下，传输层通过滑动窗口算法管理丢包的重传请求。\n\
  \n传输层专门与上方的会话层和下方的网络层进行通信。传输层也称为 OSI 模型第 4 层。\n\n### 网络层\n\n网络层负责跨网络对数据包进行路由。路由功能确定数据包的下一个最佳目的地，并在必要时确定目标计算机的完整地址。此层的常用协议包括\
  \ `IP` 和互联网控制消息协议 (`ICMP`）。\n\n网络层专门与上方的传输层和下方的数据链路层进行通信。网络层也称为 OSI 模型第 3 层。\n\n\
  ### 数据链路层\n\n数据链路层负责来自第 1 层（物理层）硬件的数据分发和接收。第 `1` 层仅处理位流，因此数据链路层必须将来自网络层的数据包转换为物理层可以理解的位流。为了确保传输准确，数据链路层在每个数据包上添加消息结束标记，并管理错误检测、纠正和重传功能。该层还执行媒体访问功能，根据网络流量决定何时发送和接收数据。在这一层，数据包在技术上被称为\
  \ `frames`（帧），尽管许多从业人员在泛指意义上使用 `packet`（数据包）。\n\n数据链路层专门与上方的网络层和下方的物理层进行通信。数据链路层也称为\
  \ OSI 模型第 2 层，它是基于机器地址功能的 LAN 交换发生的地方。\n\n### 物理层\n\n物理层是通信硬件和软件的领域，在这里，1 和 0 变成特定传输标准定义的光波、电压电、相位偏移或其他物理实体。该层从电气和光学特性方面定义了机器之间信号传输的物理方法。物理层是通过标准连接器（再次由信号类型和协议决定）与外部世界连接的节点。\n\
  \n物理层通过电线、光纤或无线电波与其他机器的物理层通信。物理层还与上方的数据链路层通信。物理层也称为 OSI 第 1 层。\n\n### 互联网协议\n\n\
  为了方便跨厂商的产品通信，人们采用了多种协议来标准化方法。互联网产生了许多新协议，其中几个常用于信息路由。传输层使用的两种协议是 `TCP` 和 `UDP`，而\
  \ `IP` 则用于网络层。在每个会话中，都会使用一个传输层协议和一个网络层协议。\n\n### TCP\n\nTCP 是现今互联网上使用的主要的传输协议，占了\
  \ 80% 以上的数据包。\n\nTCP 通过一种名为 TCP `handshake`（握手）的机制建立虚拟连接。这种握手涉及三个信号：发送到目标的 `SYN`、作为响应返回的\
  \ `SYN/ACK`，然后发送回目标的 `ACK` 以完成电路。这在机器之间建立了一个虚拟连接，数据将在该连接上传输，这就是为什么 TCP 被称为 `connection\
  \ oriented`（面向连接）。\n\nTCP 被分类为可靠协议，并将使用序列号确保数据包的发送、接收和排序。数据包排序和维护这种顺序会产生开销，但对于许多通信来说，这是至关重要的，例如电子邮件传输、HTTP\
  \ 等。\n\nTCP 具有执行传输层所有所需功能的设施。TCP 具有拥塞控制和流量控制机制，向发送者报告拥塞和其他流量相关信息，以协助流量级管理。通过名为 `ports`（端口）的机制可以在机器之间建立多个\
  \ TCP 连接。TCP 端口的编号从 0 到 65535，尽管 1024 以下的端口通常保留给特定功能。TCP 端口与 UDP 端口是独立的实体，可以同时使用。\n\
  \n### UDP\n\nUDP 是一种比 TCP 更简单的传输协议。UDP 执行传输层的所有所需功能，但它没有 TCP 的维护和检查功能。UDP 不建立连接，也不使用序列号。UDP\
  \ 数据包通过“尽力而为”的方法发送，通常被称为“发后即忘”，因为数据包要么到达目的地，要么就永远丢失。\n\nUDP 没有像 TCP 那样的流量管理或流量控制功能。这导致了更低的开销，使得\
  \ UDP 是流媒体数据源（如音频和视频流量）的理想选择，因为在这些情况下，数据包之间的延迟可能会成为问题。基础服务如动态主机配置协议 (`DHCP`) 和域名系统服务\
  \ (`DNS`) 使用 UDP，主要是因为其开销较低。当数据包确实丢失时（这在现代网络中很少见），可以重新发送。\n\n\n\n\n\n机器之间可以通过端口建立多个\
  \ UDP 连接。UDP 端口的编号范围从 0 到 65,535，尽管 1024 以下的端口通常被预留给特定功能使用。UDP 端口与 TCP 端口是独立的实体，可以同时使用。\n\
  \n### IP\n\nIP 是一种无连接的协议，用于在互联网上路由消息。其主要目的是通过 IP 地址对数据包（包括目的地址源地址）进行标记，并使用这些地址来确定数据包将传输的下一跳。由于\
  \ IP 是`无连接的`，根据流量状况，同一主机之间的 IP 数据包在不同时间可以采取不同的路由。IP 还维护着一些流量管理信息，例如生存时间（一个给数据包限制寿命的函数）和分片控制（在必要时在途中拆分数据包的机制）。\n\
  \nIP 的当前版本是第 4 版，称为 `IPv4`，它使用 32 位地址空间。较新的 `IPv6` 协议增加了显著的功能层次，例如安全性、改进的地址空间（128\
  \ 位）以及一系列复杂的流量管理选项。`IPv4` 地址写为四组数字，格式为 `v.x.y.z`，每个值范围在 0 到 255 之间。由于这很难记忆，因此开发了一套基于域名的主机命名系统，`DNS`\
  \ 服务器会将主机名（例如 [www.ietf.org](http://www.ietf.org)）转换为 IP 地址（例如 `4.17.168.6`）。\n\n\
  ### 消息封装\n\n当消息从一个主机上的一个应用程序开始通过网络，向下经过 OSI 模型，从物理层传出，并向上进入另一台机器的 OSI 模型时，数据在每一层都会被封装。这可以被视为“信封套信封”的方案。由于每层只处理特定的信封，因此只有该层的必要信息会显示在信封上。在每一层，信封内部的信息是不相关的，之前的信封已被丢弃——只使用当前信封上的信息。这实现了层之间功能的高效分离。这一概念在图\
  \ A-3 中所示。\n\n![image](img/f0500-01.jpg)\n\n***\n\n**图 A-3** OSI 消息封装\n\n当消息从应用层到物理层遍历\
  \ OSI 模型时，信封被放置在更大的信封内部。这增加了数据包的大小，但这种增加是高层协议已知并考虑在内的。在每一级，都会在前端添加一个头部，其作用是将前一层作为数据进行封装。在物理层，位被转换为物理信号并传输到下一个站。\n\
  \n在接收站，位被转换成一个大数据包，这代表了原始的“信封套信封”概念。然后，每个信封在相应的层级被处理。这种封装存在于传输层及以下层，因为这是会话中数据包的领域。\n\
  \n### 复习\n\n为了帮助变量系统理解网络通信中执行的功能，需要一个通用的框架。该框架由 OSI 和互联网网络模型提供，它们规定了在数据跨网络从一个应用程序传输到另一个应用程序的过程中，哪些功能发生以及以什么顺序发生。\n\
  \n理解 OSI 模型以及数据在通过网络传输时的状态，有助于更深入地理解与安全相关的问题。理解 `SSL` 发生在 `TCP` 和 `IP` 之前，可以让你理解\
  \ `SSL` 如何保护 `TCP` 和 `IP` 免受外部嗅探。了解不同的协议以及数据丢失时发生的情况，能让你更好地理解某些类型的攻击是如何实现的。\n\n\
  框架的本质是增强对关系的理解，而这些网络模型为网络专业人员履行了这一功能。\n\n## 附录 B\n\n### 关于下载\n\n本电子书附带 Total Tester\
