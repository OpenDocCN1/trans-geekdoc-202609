  \n**7**. 一个男人穿着深蓝色的风衣站在你们大楼外，背上印着 `FBI` 字样。他要求进入你们大楼的人出示驾驶执照和员工证。然后他向每个人问了一系列问题，关于他们在哪里工作、做什么、在公司工作了多久等等。当一个人要求看那个人的证件时，风衣男子威胁要因为不配合联邦调查把他们关进监狱。这里可能使用了哪种社会工程学原理？\n\
