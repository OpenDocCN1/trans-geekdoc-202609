  C. 禁用不用的功能可以增加用户的易用性。\nD. 启用不用的功能可以增加用户的易用性。\n\n### 7. 执行移动设备取证时最重要的记忆什么？\n\nA.\
  \ 移动设备在电源后会保留状态。\nB. 一旦电池耗尽，设备将改变状态。\nC. 移动设备取证与标准工作站取证非常相似。\nD. 最好依靠经过专门训练的人员。\n\
