  \nA. 电电电潮湿导致的电压尖峰\nB. 旋转硬盘的磁势减小\nC. 金属组件的腐蚀\nD. 化学刻蚀\n\n15. 完成下表，列出针对三个问题的控制类型：\n\
  \n![image](img/t0190-01.jpg)\n\n### 答案\n\n1. **D.** 电缆的扭绞设计是为了通过使感应力相互抵消来防止电磁干扰\
  \ (EMI)。\n\n2. **C.** 模拟和 `IP` 是两种主要类型，模拟是传统摄像头，`IP` 摄像头是基于网络的，通常通过 `Ethernet` 运行。\n\
  \n3. **B.** 非接触式卡通常用于门禁控制系统上的近距离读卡器。\n\n4. **C.** 烟雾器测量空气中的离子，烟雾会干扰离子，导致空气流动中产生可测的差异。\n\
  \n5. **A.** 冷热走道能更好地管理数据中心的气流，从而实现更高的服务器密度。\n\n6. **D.** 因为卤气系统被认为会导致臭氧层消耗，且卤气体有转化为毒性化合物的危险，`EPA`\
  \ 已禁止使用卤气系统。\n\n7. **B.** 清洁剂灭火对电气系统和电子设备的设备的损坏比其他灭火系统更小。\n\n8. **C.** 虚假报警是指系统将未经授权的用户接受为授权用户并允许访问的情况。\n\
  \n9. **B.** 生物识别是模拟信号，必须编码为数字值。由于传感器每次读取生物识别值时可能略有不同，编码值必须对不完美具有一定的容差。\n\n10. **C.**\
  \ 电气火被列在 `Type C` 手提灭火器下。\n\n11. **B** 和 **E.** 最佳答案是 `Type ABC` 灭火器和基于 `Inergen`\
  \ 的洁洁剂系统。\n\n12. **C.** 服务器房等高安全性区域最好由多因素访问控制系统保护。将近距离卡与生物传感器结合，将“你拥有的”与“你的特征”相结合作为两个身份验证因素。这还减少了虚假阴性和虚假阳性的概率。\n\
