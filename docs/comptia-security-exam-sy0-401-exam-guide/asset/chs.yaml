  - **B.** 添加新用户\n- **C.** 需要安全跟踪的更改\n- **D.** 非 A 非 B\n\n### 答案\n\n- 1. **B.** 会话密钥允许通信获得两种加密密码器的优点。非对称加密用于密钥交换，而速度更对称加密用于加密。\n\
