- "# CompTIA Security+ (Exam SY0-401) 考试指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 作者简介\n\
  \n### Arthur Conklin\n`Arthur Conklin`, `CISSP`、`CompTIA Security+` 是德克萨斯大学圣安东奥分校（`UTSA`）信息保障中心（`CIA`）的副教授兼主任。他拥有德克萨斯大学圣安东奥分校（`UTSA`）的工商管理博士学位（主修信息安全），以及美国海军后研究生学校的工程学位（主修空间工程）。他是\
  \ `ISSA` 的会员、`ASQ` 的高级成员以及 `IEEE` 的成员。他的研究兴趣包括系统的安全应用，特别是`工业控制`系统。他曾合著了六本计算机安全教科书。他活跃于\
  \ `DoD` 赞助的工业控制系统。\n\n### Gregory White\n`Gregory White` 自 1986 年以来一直从事计算机和安全工作。他在空军服役了\
  \ 19 年现役，并在空军预备役队服役了 11 年。他于 1995 年在德克萨斯 A&M 大学获得计算机科学博士学位。他的论文主题是`网络入侵检测`领域。他目前任基础设施保障与安全中心（`CIAS`）主任以及德克萨斯大学圣安东奥分校（`UTSA`）的计算机科学教授。他合著了五本教科书，并为其他书籍编写了章节。他目前的研究计划包括`社区事件响应`、`入侵检测`和`安全信息共享`。\n\
  \n### Chuck Cothren\n`Chuck Cothren`, `CISSP` 是赛门公司（`Symantec Corporation`）首席解决方案专家，应用广泛的网络安全经验，包括执行`控制渗透测试`、`事件响应`和`安全管理`，协助各种客户保护其关键数据。他还分析了`IP\
  \ 语音（VoIP）`系统和`监控控制与数据采集（SCADA）`系统的安全方法。他是书籍 *Voice and Data Security* 和 *Principles\
  \ of Computer Security* 的共同合著者。\n\n### Roger L. Davis\n`Roger L. Davis`, `CISSP`、`CISM`、`CISA`\
  \ 是后期耶稣基督教会的运营经理，管理着该教会在 140 多个国家的多个信息系统。他曾担任信息系统安全协会（`ISSA`）犹他分会主席，并在信息系统审计与控制协会（`ISACA`）犹他分会担任过董事会职务。他是一位退休的空军中校，拥有\
  \ 30 年的军事和信息系统/安全经验。Davis 先生曾任教于布莱格扬姆大学和空军技术学院。他合著了 McGraw-Hill 的 *Principles of\
  \ Computer Security* 和 *Voice and Data Security*。他拥有乔治·华盛顿大学计算机科学硕士学位、布莱格扬姆大学计算机科学学士学位，并在科罗拉多大学进行过电气工程和计算机科学的研究生学习。\n\
  \n\n\n\n`Dwayne Williams`，CISSP，是德克萨斯大学圣安东奥分校基础设施保障与安全中心（CIAS）的技术与研究副主任，并担任国家大学生网络防御竞赛的主管。Williams\
