  D. 总是通过包装器进行。\n\n13. 包装器可用于执行以下哪操作？\n\nA. 将数据包减小到传输传输。\nB. 为替代系统提供网络隔离。\nC. 为数据提供验证服务。\n\
  D. 为静态系统提供应用防火墙功能。\n\n14. 嵌入式系统主要的安全问题是什么？\n\nA. 功能减少。\nB. 预算限制（成本）。\nC. 缺乏网络连接。\n\
  D. 处理能力。\n\n15. 替代环境的安全策略应该解决哪些问题？\n\n\n\n\n\n**2.** **A.** 如果你对设备进行了越狱，操作系统的更新可能不再无法正常应用。\n\
  \n**3.** **B.** MDM（移动设备管理）提供了保护、监控和支持移动设备的能力。\n\n**4.** **D.** 替代环境通常是指将计算机控制应用于物理过程的方法，如暖空调（HVAC）、电梯、报警器等。故障可能会导致真实的物理后果。对物理系统的完全控制可能会带来独特的风险。\n\
  \n**5.** **D.** 除非用户正在刻意配对设备，否则蓝牙设备应始终关闭可发现模式。\n\n**6.** **D.** 许多替代系统不包含加密、身份验证和访问控制等常见的基础安全功能。\n\
  \n**7.** **C.** 嵌入式系统、SCADA 等静态环境是为特定功能配置的，并设计用于在不进行更新或系统更改的情况下运行。\n\n**8.** 可能的答案包括网络分段、手动更新、封装器、固件控制、控制冗余和多样性。\n\
  \n**9.** MAC 地址过滤、IP 地址路由、VLAN、访问控制管理和应用层过滤。\n\n**10.** **A.** 应用层防火墙在应用层强制通信规则。\n\
  \n**11.** **A.** 主机具有高度灵活性，能够托管多个虚拟化操作系统，并在现代企业中呈现出相当复杂的安全态势。虽然基础操作系统可能非常安全，但大量且各种虚拟机（VM）实例从安全角度来看可能构成一个严峻的挑战。\n\
  \n**12.** **B.** 由于固件更新可能会完全改变设备的功能，并且缺乏内部安全控制，因此应对对它们进行严格控制并手动执行。\n\n**13.** **C.**\
  \ 封装器（Wrappers）可用于数据流提供完整性和身份验证服务，例如在隧道和 VPN 中。\n\n**14.** **B.** 成本是许多嵌入式系统设计中的主要考虑因素，其结果是功能减少，仅保留绝对需要的功能。安全通常被认为不够重要，不足以以重要的方式包含其中。\n\
  \n## 第五部分\n\n## 访问控制与身份管理\n\n![image](img/square.jpg)**第 21 章** 访问控制与身份验证\n\n![image](img/square.jpg)**第\
  \ 22 章** 账户管理\n\n## 第 21 章\n\n## 访问控制与身份验证\n\n在本章中，你将：\n\n- 学习远程访问网络的方法和协议\n- 区分识别、身份验证、授权和计费（AAA）协议\n\
  - 介绍 AAA 方法及其在使用过程中的安全影响\n- 比较并对比身份验证的功能\n- 根据给定场景，选择合适的识别、身份验证、授权或访问控制\n\n访问控制和身份验证对于控制谁可以访问计算机系统和资源至关重要。控制访问和妥当身份验证的原理适用于内部访问和远程访问。远程访问的要求更为严格，但相同的原理也适用于内部访问。\n\
  \n远程访问允许网络外的用户拥有网络访问权限和权利，就像他们位于网络内部一样。在网络*外部*意味着用户正在一台物理上未连接到网络的机器上工作，因此必须通过远程手段建立连接，例如拨号、通过互联网连接或通过无线连接进行连接。通过互联网服务提供商（ISP）从互联网访问资源的用户也是通过互联网远程连接到这些资源的。\n\
  \n### 身份验证服务\n\n身份验证是建立用户身份以便授予权限的过程。为了建立网络连接，会使用多种方法，这些方法取决于网络类型、硬件软件以及任何安全要求。Microsoft\
  \ Windows 有一个特定的服务器组件 `Remote Access Service`，它为运行 Windows 的客户端应用程序提供远程访问能力。Cisco\
  \ 通过其网络硬件和软件实现了多种远程访问方法。UNIX 系统也有内置的方法来启用远程访问。\n\n通过远程访问进行连接的过程涉及两个元素：临时连接和一组用于协商权限和命令的协议。临时网络连接可以通过互联网、无线访问或任何其他方法发生。一旦建立了连接，主要问题就是对用户进行身份验证并为该用户建立正确的权限。这是通过协议和操作系统组合实现的。\n\
  \n建立正确权限的三个步骤是身份验证、授权和计费（AAA）。`身份验证`是将用户提供的凭据与主机上预先存储的凭据进行匹配，它通常涉及账户用户名和密码。一旦用户通过身份验证，就会进入授权步骤。`授权`是根据账户拥有的权限授予特定的权限。用户在此时是否有权使用网络，或者其使用是否受限？用户是否有权访问特定应用程序（如邮件和\
  \ FTP），或者某些程序是否受限？这些检查作为授权的一部分执行，在许多情况下，这是操作系统与其既定安全策略共同完成的功能。最后一个功能`计费`是收集账单和其他详细记录。网络访问通常是一项计费功能，需要维护一份使用了多少时间、带宽、文件传输空间或其他资源的日志。其他计费功能包括保留详细的安全日志，以维护所执行任务的审计跟踪。\n\
  \n通过加密，远程访问协议可以根据预先建立的权限级别安全地身份验证并授权用户。授权阶段可以防止未经授权的用户进入，但在之后，通信通道的加密变得非常重要，可以防止未经授权的用户入侵会话并劫持授权用户的数据或凭据。随着越来越多的网络依赖互联网连接远程用户，对远程访问协议和安全通信通道的需求和重要性将继续增长。\n\
  \n\n\n\n\n当用户通过 ISP（互联网服务供应商）连接到互联网时，用户正在与 ISP 的网络建立连接，同样的安全问题也适用。身份验证问题（即将用户提供的凭据与在主机上预先存储的凭据进行匹配）——通常通过用户用户名和密码完成。一旦用户通过身份验证，就会进入授权步骤。\n\
  \n访问控制定义了用户可以执行的操作或用户被允许访问的对象。访问控制建立在旨在促进用户与进程匹配的元素基础之上。这些元素是身份识别、身份验证和授权。\n\n###\
  \ RADIUS\n\n远程认证拨号用户服务（RADIUS）是一种最初由 Livingston Enterprises（后被 Lucent 收购）开发的 AAA\
  \ 协议（认证、授权、计费）。它曾以一系列 RFC 的形式提交给互联网工程任务组（IETF）：`RFC 2058`（RADIUS 规范）、`RFC 2059`（RADIUS\
  \ 计费标准），以及更新后的 `RFCs 2865–2869` 现在已成为标准协议。IETF AAA 工作组提议对 RADIUS 进行了扩展（`RFC 2882`）。\n\
  \nRADIUS 设计为一种无连接协议，利用用户数据报协议（UDP）作为其传输层协议。连接类型问题（如超时）由 RADIUS 应用程序而非传输层处理。RADIUS\
  \ 利用 UDP 端口 `1812` 进行认证和授权，利用 `1813` 进行计费功能（参见“常用远程访问端口”部分的表 21-2）。\n\n![image](img/t0394-01.jpg)\n\
  \n**表 21-1** 常用 TCP/UDP 远程访问网络端口分配\n\n![image](img/t0400-01.jpg)\n\n**表 21-2** 访问控制矩阵\n\
  \nRADIUS 是一种客户端/服务器协议。RADIUS 客户端通常是网络接入服务器（NAS）。RADIUS 服务器是运行在 UNIX 或 Windows 服务器机器上的进程或守护进程。RADIUS\
  \ 客户端与 RADIUS 服务器之间的通信使用手动配置到每个实体中的共享密钥进行加密，该密钥不会在连接中进行共享。因此，RADIUS 客户端（通常为 NAS）与\
  \ RADIUS 服务器之间的通信是安全的，但用户（通常为 PC）与 RADIUS 客户端之间的通信可能会受到破解。这一点非常重要，因为如果用户的机器（PC）不是\
  \ RADIUS 客户端（NAS），那么 PC 与 NAS 之间的通信通常是不加密的，并且是以明文传输的。\n\n### RADIUS 身份验证\n\nRADIUS\
  \ 协议旨在允许 RADIUS 服务器支持多种身份验证用户的方法。当服务器收到用户名和密码时，根据服务器时的设置，它可以支持点对点协议（PPP）、密码认证协议（PAP）、挑战握手认证协议（CHAP）、UNIX\
  \ 登录以及其他机制，取决于服务器设置时建立的内容。用户登录身份验证由 RADIUS 客户端的查询（`Access-Request`）和 RADIUS 服务器相应的响应（`Access-Accept`\
  \ 或 `Access-Reject`）组成，如图 21-1\n\n**图 21-1** RADIUS 通序列\n\n`Access-Request` 消息包含用户名、加密后的密码、NAS\
  \ IP 地址和端口。消息还包含有关用户想要启动的会话类型的信息。一旦 RADIUS 服务器接收到这些信息，它会在数据库中搜索匹配的用户名。如果没有找到匹配项，则加载默认配置文件或发送\
  \ `Access-Reject` 回复。如果找到了条目或使用了默认配置文件，则下一阶段涉及授权，因为在 RADIUS 中，这些步骤是顺序执行的。图 21-1\
  \ 显示了用户与 RADIUS 客户端及 RADIUS 服务器之间的交互，以及建立连接所采取的步骤：\n\n1. 用户向 NAS 发起 PPP 身份验证。\n\
  2. NAS 请求：\n   - 用户名和密码（如果是 PAP），或\n   - 挑战（如果是 CHAP）。\n3. 用户用凭据回复。\n4. RADIUS 客户端将用户名和加密后的密码发送给\
  \ RADIUS 服务器。\n5. RADIUS 服务器响应 Accept（接受）、Reject（拒绝）或 Challenge（挑战）。\n6. RADIUS\
  \ 客户端根据用户请求的服务执行操作。\n\n### RADIUS 授权\n\n在 RADIUS 协议中，身份验证和授权步骤是针对单个 `Access-Request`\
  \ 消息共同执行的，尽管它们是顺序步骤，如图 21-1 所示。一旦建立了身份（无论是已知的还是默认的），授权过程将决定返回给客户端的参数。典型的授权参数包括允许的服务类型（shell\
  \ 或 framed）、允许的协议、要分配给用户的 IP 地址（静态或动态）以及要应用的访问列表或放置在 NAS 路由表中的静态路由。这些参数都在设置期间在 RADIUS\
  \ 客户端和服务器的配置信息中定义。\n\n### RADIUS 计费\n\nRADIUS 计费功能独立于身份验证和授权。它使用独立的端口 `1813`（参见“常用远程访问端口”部分的表\
  \ 21-2）。RADIUS 计费的主要功能是为了支持 ISP 的用户计费，它允许在会话开始和结束时传输数据，并可以指示资源利用情况，如时间、带宽等。\n\n\
  当 RADIUS 在 90 年代初初设计时，ISP NAS 的角色相对简单。允许或拒绝访问以及使用时间是关注重点。今天，互联网及其访问方法已经发生了变化，AAA\
  \ 的需求也如此。\n\n### TACACS+\n\n终端访问控制系统+（TACACS+）是 TACACS 家族的当代版本。TACACS+ 扩展了属性控制和计费过程。该协议的一个基本设计方面是身份验证、授权和计费的分离。尽管这些协议从原始\
  \ TACACS 有直接的血缘关系，但 TACACS+ 是一个重大修订，与该系列之前的版本不兼容。\n\nTACACS+ 使用 TCP 作为其传输协议，通常运行在\
  \ TCP 端口 `49` 上。该端口用于登录过程，并在 IANA 维护的分配数字数据库中预留（`RFC 3232`）。在 IANA 规范中，UDP 和 TCP\
  \ 端口 49 均保留给 TACACS 登录协议。\n\nTACACS+ 是一种客户端/服务器协议，客户端通常是 NAS，服务器是 UNIX、Linux 或 Windows\
  \ 服务器上的守护进程。这一点非常重要，因为如果用户的机器（通常为 PC）不是客户端（通常为 NAS），那么 PC 与 NAS 之间的通信通常是不加密的，并且是以明文传输的。TACACS+\
  \ 客户端与 TACACS+ 服务器之间的通信使用手动配置到每个实体中的共享密钥进行加密，该密钥不会在连接中进行共享。\n\n\n\n\n\nTACACS+ 允许身份验证交换序列具有任意长度和内容，使得\
  \ TACACS+ 客户端可以使用许多不同的认证机制。认证是可选的，并由站点可配置选项进行决定。当使用认证时，常见的形式包括 PPP PAP、PPP CHAP、PPP\
  \ EAP、令牌卡和 Kerberos。认证过程通过三种不同的数据包完成：`START`、`CONTINUE` 和 `REPLY`。`START` 和 `CONTINUE`\
  \ 数据包源于客户端并指向 TACACS+ 服务器。`REPLY` 数据包用于从 TACACS+ 服务器到客户端的通信。\n\n认证过程如图图 21-2 所示，它从客户端向服务器的\
  \ `START` 消息开始。该消息可能是对连接到 TACACS+ 客户端的 PC 发起的初始化响应。`START` 消息描述了所请求的认证类型（简单明文密码、PAP、CHAP\
  \ 等）。此 `START` 消息还可能包含额外的认证数据，例如用户名和密码。当服务器在 `REPLY` 消息中发送重启请求时，也会发送 `START` 消息作为响应。`START`\
  \ 消息的序列号始终设置为 1。\n\n![image](img/f0393-01.jpg)\n\n***\n\n**图 21-2** TACACS+ 通信序列\n\
  \n当 TACACS+ 服务器接收到 `START` 消息时，它会发送 `REPLY` 消息。此 `REPLY` 消息将指示认证已完成还是需要继续。如果需要继续，`REPLY`\
  \ 消息还会指定还需要哪些信息。客户端对请求额外数据的 `REPLY` 消息的响应是 `CONTINUE` 消息。此过程持续直到服务器获得所需信息，认证过程以成功或失败结束。\n\
  \n### TACACS+ 授权\n\n`Authorization` 描述了与确定用户操作权限相关的操作。这通常发生在认证之后，如图图 21-2 所示，但这不是硬性要求。在用户认证之前存在“未知用户”默认状态，可以为未知用户确定权限。与认证一样，授权是一个可选过程，可能也可能不是站点特定操作的一部分。当它与认证结合使用时，授权过程遵循认证过程，并使用确认的用户身份作为决策过程的输入。\n\
  \n授权过程使用两种消息类型执行：`REQUEST` 和 `RESPONSE`。授权过程通过由单对 `REQUEST` 和 `RESPONSE` 消息组成的授权会话执行。客户端发布授权\
  \ `REQUEST` 消息，其中包含一组固定字段，用于列出请求权限的用户或进程的真实性，以及一组变量字段，用于列出正在请求授权的服务或选项。\n\nTACACS+\
  \ 中的 `RESPONSE` 消息并不是简单的“是”或“否”；它还可以包含定性信息，例如用户时间限制或 IP 限制。这些限制具有重要用途，例如对 shell\
  \ 访问实施时间限制或对特定用户账户实施 IP 访问列表限制。\n\n### TACACS+ 计费\n\n与之前的服务一样，计费（Accounting）也是 TACACS+\
  \ 的可选功能。当使用时，它通常在其他服务之后。TACACS+ 中的 `Accounting` 定义为记录用户或进程执行操作的过程。计费可以实现两个重要目的：\n\
  \n- 可用于计算已使用的服务，可能用于计费目的。\n- 可用于生成安全审计跟踪。\n\nTACACS+ 计费记录包含几项信息以支持这些任务。计费过程拥有授权和认证过程中揭示的信息，因此它可以记录用户或进程的特定请求。为了支持此功能，TACACS+\
  \ 有三种类型的计费记录：`START`、`STOP` 和 `UPDATE`。注意，这些是记录类型，而不是之前讨论的消息类型。\n\n`START` 记录指示开始授权过程的时间以及用户或进程。`STOP`\
  \ 记录列出有关特定操作停止时间的相同信息。`UPDATE` 记录充当中间通知，说明某项任务仍在执行。这三种消息类型共同允许创建描绘用户或进程在系统上活动的记录。\n\
  \n### XTACACS\n\n扩展型 TACACS (XTACACS) 是 TACACS 的扩展，它将认证、授权和计费的任务分离开来。与 TACACS 一样，Cisco\
  \ 认为 XTACACS 已结束生命周期，并推广 TACACS+、RADIUS 和 Kerberos 作为替代品。\n\n### 常见远程访问端口\n\n表 21-1\
  \ 显示了一些远程访问支持解决方案，应为了考试牢记。\n\n### Kerberos\n\nKerberos 是作为 MIT Athena 项目的一部分开发的，是一种专为客户端/服务器环境设计的网络认证协议。当前版本是\
  \ Kerberos 第 5 版 1.12.1，并受所有主流操作系统支持。Kerberos 使用 Needham-Schroeder 密钥协议在不安全的网络上安全地传递对称密钥。Kerberos\
  \ 围绕“信任第三方”的概念构建，称为 `密钥发行中心 (KDC)`，它由两个逻辑上独立的部分组成：认证服务器 (AS) 和票据授予服务器 (TGS)。Kerberos\
  \ 通过“票据”进行通信，用于证明用户的身份。\n\nKerberos 的名字源自希腊神话中的三头狗，设计用于在互联网这一本质上不安全的环境中运行。Kerberos\
  \ 使用强加密，使得客户端可以向服务器证明自己的身份，而服务器反过来向客户端验证自己的身份。完整的 Kerberos 环境被称为 Kerberos `领域 (realm)`。Kerberos\
  \ 服务器包含所有拥有领域服务权限的用户 ID 和哈希密码。Kerberos 服务器还与将授予访问票据的服务器持有共享密钥。\n\nKerberos 认证的依据是票据。票据在两个步骤的过程中使用。第一个票据是\
  \ AS 发送给请求客户端的授权票据。客户端可以将此票据提交给 Kerberos 服务器，以请求访问服务的票据。这种客户端到服务器的票据用于获取领域服务的访问。由于整个会话可以加密，这消除了在网络上可能被拦截的密码等物品的不安全传输。票据带有时间戳并有有效期，因此尝试重用票据将无法成功。\n\
  \n\n\n\n\n为了说明 `Kerberos` 身份验证服务的工作原理，请想象常见的驾照。你获得了一份执照，可以向其他实体展示以证明你的身份如你。由于其他实体信任颁发执照的国家，它们将接受你的执照作为你身份的证明。颁发执照的国家类似于\
  \ `Kerberos` 身份验证服务的领域（realm），而执照充当了客户端到服务器的票据。它是双方赖以提供有效身份识别的受信任实体。这个类比并不完美，因为我们可能都听说过获得虚假驾照的人，但它有助于说明\
  \ `Kerberos` 背后的基本原理。\n\n## LDAP\n\n`directory`（目录）是一种类似于数据库的数据存储机制，但与标准数据库机制相比，它有几个不同之处，旨在提供高效的数据检索服务。目录是为读取数据设计并优化的，提供极快的搜索和检索操作。目录中存储的信息类型倾向于描述性属性数据。目录提供数据的静态视图，这些数据可以在无需复杂的更新事务的情况下进行更改。数据以树形结构进行分级描述，并且通常具有用于读取的网络接口。目录的常见用途包括电子邮件列表、域服务器数据和网络资源的资源映射。\n\
  \n为了实现互操作性，`X.500` 标准被创建作为目录服务的标准。访问 `X.500` 目录的主要方法是通过目录访问协议（`DAP`），这重量级协议很难完全实现，特别是在\
  \ PC 和更受限的平台上。这导致了轻量级目录访问协议（`LDAP`）的产生，包含了最常用的功能。`LDAP` 可以与 `X.500` 服务对接，最重要的是，`LDAP`\
  \ 可以在 `TCP` 上运行，所需的计算资源远少于完整的 `X.500` 实现。`LDAP` 提供了大多数目录所需的所有功能，且实现起来更容易、更经济，因此\
  \ `LDAP` 已成为目录服务的互联网标准。`LDAP` 标准由取决于用途的两个独立实体管理：国际电信联盟（`ITU`）管理 `X.500` 标准，而 `LDAP`\
  \ 的互联网用途则由 `IETF` 管理。许多 `RFCs` 适用于 `LDAP` 功能，但最重要的包括 `RFCs` 2251 到 2256 以及 `RFCs`\
  \ 2829 和 2830。\n\n## Secure LDAP\n\n安全 `LDAP` 指通过 `SSL/TLS` 运行 `LDAP`。基于 `TCP` 的\
  \ `LDAP` 是明文协议，意味着数据以明文传输，容易被窃听。可以使用加密来解决这个问题，应用基于 `SSL/TLS`的服务将保护目录查询和响应免受窃听者的攻击。`SSL/TLS`\
  \ 为 `LDAP` 服务提供了几个重要功能。它可以通过证书建立数据源的身份，还可以提供从 `LDAP` 来源呈现的数据的完整性和机密性。由于 `LDAP` 和\
  \ `SSL/TLS` 是两个分离且独立的协议，互操作性更多地取决于正确的设置而非任何其他因素。要实现基于 `SSL/TLS` 的 `LDAP`，典型的设置是先建立一个\
  \ `SSL/TLS` 连接，然后在受保护的通道上打开 `LDAP` 连接。这要求客户端和服务器都启用了 `SSL/TLS`。对于客户端，大多数浏览器已经启用。对于\
  \ `LDAP` 服务器，此特定功能必须由系统管理员启用。这种设置起初是复杂的，因此绝对是胜任的系统管理员的任务。\n\n一旦 `LDAP` 服务器被设置为通过\
  \ `SSL/TLS` 连接运行，它的运行方式就和往常一样。`LDAP` 服务器通过返回搜索中节点的数据来响应特定查询。`SSL/TLS` 功能负责保护通信通道，从用户的角度来看，对数据流是透明的。从外部来看，`SSL/TLS`\
  \ 防止对数据请求和响应的观测，确保了机密性。\n\n## SAML\n\n安全断言标记语言（`SAML`）是一种用于 Web 应用程序的单登录能力，确保用户身份可以共享并受到保护。它定义了在安全域之间交换身份验证和授权数据的标准。随着云解决方案和软件服务（`SaaS`）应用程序的出现，这种技术变得越来越重要，因为它确保了跨身份提供者的互操作性。\n\
  \n`SAML` 是一种基于 XML 的协议，使用安全令牌和断言将关于“主体”（通常是终端用户）的信息在 `SAML` 权威（“身份提供者”或 `IdP`）与服务提供者（`SP`）之间传递。\"\
  主体` 向 `SP` 请求服务，然后由 `SP` 向 `IdP` 请求并获取身份断言。随后，`SP` 即可为 `主体` 授予访问或执行请求的服务。\n\n##\
  \ Authorization\n\n授权（`Authorization`）是允许或拒绝访问特定资源的过程。一旦通过身份验证确认了身份，就可以对特定操作进行授权或拒绝。使用了许多类型的授权方案，但目的是相同的：确定已识别的给定用户是否有权限访问所请求的特定对象或资源。此功能通常是操作系统的一部分，并且对用户是透明的。\n\
  \n从识别到身份验证再到授权的任务分工具有若干优点。可以使用许多方法来执行每项任务，并且在许多系统中，每项任务都同时存在多种方法。将这些任务拆分为单个元素允许不同的实现组合协同工作。任何需要授权的系统或资源，无论是硬件（路由器或工作站）还是软件组件（数据库系统），在身份验证发生后都可以使用自己的授权方法。这使得这些原则的应用既高效又一致。\n\
  \n## Least Privilege\n\n安全的最基本方法之一是最小权限（`least privilege`）。这一概念适用于许多物理环境，也适用于网络和主机安全。最小权限意味着一个对象（如用户、应用程序或进程）应该仅具有执行其任务所需的权利和权限，而没有额外的权限。限制对象的权限可以减少可能造成的危害，从而限制组织的受损程度。用户可能可以访问其工作站上的文件和文件服务器上的部分文件，但无法访问存储在数据库中的关键数据。这一规则有助于组织保护其最敏感的资源，并确保与这些资源交互的人有合理的理由。\n\
  \n不同的操作系统和应用程序有实现权利、权限和特权的各种方法。在实际配置操作系统之前，应该制定一个整体计划并开发标准化方法，以确保实施安全基线。例如，一家公司可能希望会计部门的所有员工（以及其他人）能够访问存储在服务器上的员工工资和利润率电子表格。实现这一点的简单方法是开发一个会计组，将所有会计员工放入该组，并将权利分配给组而不是每个单独的用户。\n\
  \n\n\n\n\n另一个例子是，公司可以要求实施分级管理员制度，执行不同的功能并需要特定类型的权限。可以安排两个人负责个人工作站和服务器的备份；因此，他们不需要对所有资源完全访问的管理员权限。可以安排三个人负责设置新用户账户和密码管理，这意味着他们不需要对公司的路由器和交换机拥有完全访问权限，甚至不需要权限。一旦界定了这些基准（即哪些主体需要哪些权利和权限），要配置设置以为不同主体提供最小权限就会变得容易得多。\n\
  \n最小权限原则不仅适用于为用户提供特定权利和权限，还适用于更多的网络安全问题。在创建信任关系时，不应将其实现方式为仅仅因为那样设置更简单就让大家互相信任。一个域信任另一个域应该是出于非常特定的原因，实施者应该完全理解这种信任关系在两个域之间允许的操作。如果一个域信任另一个域，是否所有的用户都会自动变得受信任，他们是否因此就能访问另一个域上的任何和所有资源？这是一个一个好主意吗？是否有更安全的方法可以提供相同的功能？如果实现的信任关系使得某组的用户可以访问仅在某一个域上的绘图机或打印机，例如，购买另一台绘图机可能是合理的，这样其他更有价值或更敏感的资源就不会被整个小组访问。\n\
  \n另一个属于最小权限概念的问题是应用程序运行的安全上下文。所有的应用程序、脚本和批处理文件都运行在操作系统上特定用户的安全上下。这些对象将以特定的权限执行，就像它们是用户一样。该应用程序可以是\
  \ `Microsoft Word` 并运行在普通用户的空间中；它也可能是一个需要访问更多敏感系统文件的诊断程序，因此必须在管理员账户下运行；或者它可能是一个执行备份的程序，因此应该在备份操作员的安全上下运行。这个问题的关键在于，程序应该只在为了程序成功完成职责所需的安全上下文中执行。在许多环境中，人们并不真正理解如何让程序在不同的安全上下文中运行，或者似乎让它们全部运行在管理员账户下更简单。如果攻击者能够攻破在管理员账户下运行的程序或服务，他们实际上就提升了自己的访问级别，对系统拥有了更多的控制权，并有更多造成破坏的可能性。\n\
  \n![image](img/examtip.jpg)\n\n**考点提示** 最小权限概念是许多安全方面的基石。记住，基本思想是只给人员提供他们完成工作所需的数据和程序的访问权限。超出这一范围的都可能导致潜在的安全问题。\n\
  \n### 职责分离\n\n安全的另一个基本方法是职责分离。这一概念不仅适用于物理环境，也适用于网络和主机安全。职责分离确保了对于任何给定的任务，都需要一个以上的个人参与。任务被拆分成不同的职责，每种职责都由一个独立的个人完成。通过这种方式实施任务，没有任何一个个人可以滥用系统来取利。这一原则在商业领域（特别是金融机构）已经实施了多年。一个简单的例子是某个系统，它要求某个人来下单，而需要另一个人来授权购买。\n\
  \n虽然职责分离提供了一定程度的制衡，但它并不是没有缺点的。最主要的缺点是完成任务所需的成本。这种成本同时体现在时间和和金钱上。当一个人就可以完成任务时，却需要一个以上的个人，因此可能增加了任务的成本。此外，由于涉及多个个人，由于任务必须经过各个不同的步骤，可以预见到会有某种延迟。\n\
  \n### 访问控制\n\n`access control` 术语描述了各种保护方案。它有时指的是用于防止未经授权访问计算机系统或网络而使用的所有安全特性。从这个意义上说，它可能会与\
  \ `authentication`（身份验证）混淆。更准确地说，`access`（访问）是指主体（如计算机系统上的用户或进程）与对象（如文件或硬件设备）交互的能力。而\
  \ `authentication` 则是验证身份。为了理解两者的区别，请考虑一个个人尝试登录计算机系统的例子。`authentication` 是用于向计算机系统或网络验证该个人是其所称身份的过程。实现此常用的方法是使用\
  \ `user ID` 和 `password`。一个人被允许进入系统并不意味着他应该拥有系统所包含的所有数据。\n\n考虑另一个例子。当你去银行取款时，窗口的柜员通过要求你提供带有照片的身份证件（如驾照）来验证你确实是你所称的人。你可能还需要提供你的\
  \ `account number`。一旦柜员验证了你的身份，你就证明了你是该银行的有效（授权）客户。然而，这并不意味着你有权查看银行保护的信息——例如账户余额。柜员将控制你可以访问的信息和资金，并只授予你授权查看的信息。在这个例子中，你的身份证和\
  \ `account number` 作为你的 `authentication` 方法，而柜员则作为访问控制机制。\n\n在计算机系统和网络中，访问控制可以通过多种方式实现。`access\
  \ control matrix` 提供了一个说明该过程的最简单框架，并如表 21-2](#ch21.html#ch21tab2）所示。在该矩阵中，系统正在跟踪两个进程、两个文件和一个硬件设备。`Process\
  \ 1` 可以读取 `File 1` 和 `File 2`，但只能写入 `File 1`。`Process 1` 无法访问 `Process 2`，但 `Process\
  \ 2` 可以执行 `Process 1`。两个进程都有向 `printer` 写入的能力。\n\n\n\n\n无论在计算机系统或网络中使用什么种特定的机制来实现访问控制，这些控制都应该基于特定的访问\
  \ `model`（模型）。安全文献中讨论了许多种不同的模型，包括自主访问控制（DAC）、强制性访问控制（MAC）、基于角色的访问控制（RBAC）以及基于规则的访问控制（也称为\
  \ `RBAC`）。\n\n#### 自主访问控制\n\n`discretionary access control`（自主访问控制）和 `mandatory\
  \ access control`（强制性访问控制）最初都是军事领域领域使用的两个术语。根据“橙色书籍”（Orange Book）——美国国防部曾作为描述可信计算机系统标准的文件——DAC\
  \ 是“一种根据主体的身份或其所属的组来限制对对象的访问的手段。这些控制是具有裁量权的，因为具有特定访问权限的主体能够将该权限（可能是间接的）传递给任何其他主体”。虽然这听起来可能是某种令人困惑的“政府术语”，但其原理非常简单。在采用\
  \ DAC 的系统中，对象的所有者可以决定哪些其他主体可以访问该对象以及他们拥有何种特定的访问权限。实现此点的常用方法是 `UNIX` 系统中使用的权限位。文件所有者可以指定同一组成员可以拥有什么权限（读/写/执行），以及所有其他人可以拥有什么权限。`ACLs`（访问控制列表）也是用于实现\
  \ DAC 的常用机制。\n\n#### 强制性访问控制\n\n另一种使用频率较低的访问限制系统是强制性访问控制。该系统通常只用于存在不同安全分级的环境，对于用户被允许的操作，它具有严格得多的限制。参考“橙色书籍”，强制性访问控制是“一种根据对象所包含信息的敏感性（由标签表示）以及主体访问此类敏感性信息的正式授权（即许可审查）来限制对对象的访问的手段”。在这种情况下，所有者或主体无法决定是否授予另一个主体访问权限；这由操作系统来决定。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试贴士** 常见的信息分类包括高、中、低、机密、私有和公开。\n\n在 MAC\
  \ 中，安全机制控制对所有对象的访问，单个主体无法更改这种访问。关键在于附在每个主体和对象上的标签。标签将标识该对象的分类级别以及主体有权拥有的级别。想一下军事安全分级，例如“秘密”和“绝密”。一个被标识为绝密（带有标明其为绝密的标签）的文件只能由具有绝密权限的人员查看。这需要访问控制机制来确保只有“秘密”权限的人员永远无法获得对标记为“绝密”文件的访问。同样，拥有“绝密”访问权限的用户将不允许通过访问控制机制将标记为“绝密”的文件分级改为“秘密”，或发送该绝密文件。\n\
  \n\n\n\n时段限制（Time of day restrictions）的设计旨在允许在预期使用的范围内访问系统或应用程序。设施进入系统通常限制特定时间内对设施的访问。例如，如果一个人不需要在周末或正常工作时间之外工作，那么系统将不允许其在正常工作时间之外进入设施。这也可以适用于电话系统，特别是可以拨长途电话的传真线或会议室电话。时段限制可以防止未经授权的人员利用公司费用拨长途电话以牟取私利。\n\
  \n## 身份验证\n身份验证是在验证计算机系统中先前建立的身份的过程。执行此功能有多种方法，每种方法都有其优缺点。这些是本章本节的主题。\n\n### 生物识别\n\
  生物识别及其在访问控制机制中的应用将在第 10 章中详细介绍。\n\n## 用户名\n用户名是符合“你所知道的”标准的身份验证元素之一。正如本章后文所述，最好不要共享你的用户名，但用户名并不是一种安全方法。用户应该假设自己的用户名已经泄露。\n\
  \n## 智能卡\n`smart card`（也称为`集成电路卡 [ICC]` 或`芯片卡`）是一种嵌入了集成电路的口袋大小卡片，用于提供身份安全验证。智能卡的出现使得强加密身份验证方法成为可能。智能卡技术已被证明足够可靠，现在已成为物理和逻辑身份验证政府标准的一部分。\n\
  \n## 通用访问卡\n通用访问卡（CAC）是一种尺寸与标准信用卡相近的智能卡，它满足现役军人员、国防部（DoD）人员和承包商的双因子身份验证（你所知道的和你所拥有的）。因此，它被用作进入受控空间以及访问国防计算机系统和网络的主要卡。CAC\
  \ 提供了数字签名、身份验证、完整性和不可否认性。\n\n## 个人身份验证卡\n个人身份验证（PIV）卡是用于美国联邦政府员工和承包商的智能卡。与 DoD 的\
  \ CAC 类似，它包含了持卡人访问联邦设施和系统所需的信息。联邦信息处理标准（`FIPS`）`201`文档规定了所有联邦员工和承包商通用身份识别标准的标准。这种智能卡包括一个加密芯片和连接器，以及一个非接触式距离卡电路。它还对正面打印的照片和名称有标准。生物识别数据可以存储在卡上，提供额外的身份验证因子，如果遵循\
  \ PIV 标准，颁发卡片需要几种形式的识别。\n\n## 多因素身份验证\n`multifactor authentication`（或多因子身份验证）简单来说是两种或多种类型身份验证的组合。可以使用三大类身份验证：你是什么（例如，生物识别）、你拥有什么（例如，令牌）以及你所知道的（密码和其他信息）。双因子身份验证在授予访问权限之前结合这三者的任意两种。例如，一个读卡器随后打开指纹扫描仪——如果你的指纹与卡片记录的指纹匹配，即可获得访问权限。三因子身份验证将结合所有类型，例如智能卡读卡器在启用视网膜扫描仪之前要求输入`PIN`。如果所有三个都对应计算机数据库中的有效用户，则授予访问。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 双因子身份验证结合任意两种方法，将令牌与生物识别等项目进行匹配。三因子身份验证结合任意三种，例如密码、生物识别和令牌。\n\
  \n多因素身份验证方法通过使攻击者极难获得所有正确的身份验证材料，极大地增强了安全性。它们还可以防止令牌被盗的风险，因为攻击者必须拥有正确的生物识别、密码或两者兼有。更重要的是，多因素身份验证通过防止生物识别信息被盗增强了生物识别系统的安全性。更改令牌会让生物识别失效，除非攻击者能偷到新的令牌。它还通过尝试将提供的生物识别与与提供的令牌相关的生物识别进行匹配，减少了误报率。这防止了计算机使用整个生物识别数据库进行匹配。使用多个因素是确保正确身份验证和访问控制的最佳方法之一。\n\
  \n## HOTP\n基于 HMAC 的一次性密码（`HOTP`）是一种可以使用身份验证服务器在系统中验证用户身份算法。（`HMAC` 代表基于哈希的消息认证码。）它定义在\
  \ `RFC 4226` 中，日期为 2005 年 12 月。\n\n## TOTP\n基于时间的一次性密码（`TOTP`）算法是 `HOTP` 的特定实现，它使用密钥和当前时间戳生成一次性密码。它描述在\
  \ `RFC 6238` 中，日期为 2011 年 5 月。\n\n## CHAP\n挑战握手身份验证协议（`CHAP`）用于通过 `PPP` 提供跨点链路的身份验证。在此协议中，链路建立后的身份验证不是强制性的。CHAP\
  \ 设计用于通过挑战/响应系统定期提供身份验证，这种系统有时被称为`三路握手`，如图 21-3 所示。初始挑战（一个随机生成的数字）发送给客户端。客户端使用单向哈希函数计算响应应该是什么，然后将其发回。服务器将响应与其计算的预期响应进行比较。如果它们匹配，则继续通信。如果两个值不匹配，则终止连接。这种机制依赖于两个实体之间的共享密钥，以便计算正确的值。\n\
  \n![image](img/f4405-01.jpg)\n\n***\n\n**图 21-3** CHAP 挑战/响应序列\n\n微软创建了两个版本的 CHAP，经过修改以增加其在其产品线中的可用性。MSCHAPv1\
  \ 定义在 `RFC 2433` 中，已在 Windows Vista 中弃用并删除。当前的标准版本 2，`RFC 2759`，随 Windows 2000 引入。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** CHAP 使用 `PPP`，它支持三种功能：\n\n—跨串行链路封装数据报\n\
  \n—使用 `LCP` 建立、配置和测试链路\n\n—使用 `NCP` 建立和配置不同的网络协议 PPP 支持两种身份验证协议：\n\n—密码认证协议（`PAP`）\n\
  \n—挑战握手身份验证协议（`CHAP`）\n\n## PAP\n密码认证协议（`PAP`）身份验证涉及双向握手，用户名和密码以明文通过链路发送。PAP 身份验证不对重放攻击和链路监听的任何保护。PAP\
  \ 现在是一个已弃用的标准。\n\n***\n\n![image](img/examtip.jpg)\n\n**考试提示** PAP 是一种明文身份验证协议，因此容易被拦截。CHAP\
  \ 使用挑战/响应握手协议来保护通道。\n\n### EAP\n扩展身份验证协议（`EAP`）是一种由 `RFC 3748` 定义的通用身份验证框架，经常用于无线网络和点点连接。尽管\
  \ EAP 不限于无线并可用于有线身份验证，但它最常用于无线局域网（LAN）。\n\n## 默认拒绝\n\n\n\n\n如今的互联网最初被设计为一个友好的环境，其中每个人都同意遵守各种协议中实施的规则。今天，互联网已不再是曾经那个研究人员的友好乐场。这导致了不同的方法，这些方法起初看起来可能并不友好，但出于安全目的是必须的。其中一种方法就是`隐式拒绝`（implicit\
  \ deny）。\n\n在网络世界中，经常需要做出访问访问决策。通常，会使用一系列规则来决定是否允许访问。如果特定情况没有被任何其他规则涵盖，隐式拒绝方法规定不应授予访问权限。换句话说，如果没有规则允许访问，则不应授予访问权限。隐式拒绝适用于涉及授权和访问的情况。\n\
  \n隐式拒绝的替代方案是：除非特定规则禁止，否则就允许访问。这两种方法的另一个例子是用于监控和阻止访问某些网站的程序。一种方法是提供一个用户`不`被允许访问的特定网站列表（黑名单）。对列表之外任何网站的访问都将被隐式允许。相反的方法（隐式拒绝方法）将阻止对所有未明确标识为授权的网站的访问（白名单）。正如你可以想象的，取决于具体的应用程序，其中一种方法是合适的。你应该选择哪种方法取决于你组织的安全目标和策略。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** `Implicit deny` 是安全的另一个基本原则，因此请确保你理解这一原则。与最小权限原则类似，该原则规定，如果用户没有被特别地允许访问，则应该拒绝访问。\n\
  \n### 可信操作系统\n`trusted OS`（可信操作系统）是一种能够提供多级安全能力并能够满足一组定义标准（通常来自政府机构）的操作系统。由于开发、测试和认证涉及的大量精力和时间，只有少数操作系统（如`Trusted\
  \ Solaris` 和 `HP-UX 10.26`）经过了这一过程成为可信操作系统。\n\n### 身份验证因子\n身份验证是将特定 ID 绑定到特定计算机连接的过程。从历史上看，使用三类来验证用户身份。这些类别最初由美国政府在计算机安全的“彩虹系列”手册之一中发布，它们是：\n\
  \n- 你所知道的（例如密码）\n- 你所拥有的（例如令牌）\n- 你所特征的（静态生物识别，如指纹或虹膜模式）\n\n今天，由于技术的进步，出现了一个模仿无意识行为的新类别：\n\
  \n- 你所做的（动态生物识别，如打字模式或步态）\n\n由于由于 GPS 和其他基于位置的技术，可以使用第五类类别：\n\n- 你所处的地方\n\n这些方法可以单独使用，也可以结合使用。这些控制措施假设识别过程已经完成且用户身份已通过验证。身份验证机制的工作是确保只有有效用户被允许进入。另一种说法，身份验证是使用某种机制来证明你就是你所声称的人。\n\
  \n（注：源提示词中提供的剩余文本关于身份验证方法存在大量重复和杂乱的句子。我在保持技术术语格式规则的同时，精简了源文件中呈现的核心概念。）\n\n\n\n\n\
  `Identification`是将计算机 ID 分配给特定用户、计算机、网络设备或计算机进程的过程。识别过程通常只执行一次，即在向特定用户发放用户 ID 时。用户识别能够实现认证（authentication）和授权（authorization），从而形成可追溯性（accountability）的基础。为了可追溯性，不应共享用户\
  \ ID，而且出于安全考虑，用户 ID 不应描述工作功能。这种做法使你能够将活动追溯到个人用户或计算机进程，以便他们对自己的行为负责。识别通常以 `logon\
  \ ID` 或用户 ID 的形式存在。此类 ID 的必要特性是它们必须是。\n\n## 证书 (Certificates)\n\n`Certificates`是一种建立特定对象（如个人的公钥或下载的软件）真实性的方法。数字证书通常是消息的附件，用于验证该消息确实来自其所声称的实体。数字证书还可以包含一个用于加密未来通信的密钥。\n\
  \n## 令牌 (Tokens)\n\n访问令牌（access token）是一种识别特定访问权限的物理对象，在身份验证中属于“你拥有的东西”因素。例如，你的房屋钥匙就是一个基本的物理访问令牌，允许你进入家中。尽管钥匙几个年来一直被用于解锁设备，但它们确实有几个局限性。钥匙与锁或一组锁排他匹配，并且不易更改。通过给用户钥匙副本来添加授权用户很容易，但要给该用户提供选择性访问要困难得多，除非指定的区域已设置为单独的密钥。从单个令牌或令牌持有者撤销访问权限也很困难，通常需要对整个系统重新制作密钥。\n\
  \n在许多企业中，物理访问验证已转向非接触式射频卡和近距离读取器。当卡片靠近读取器时，卡片通过无线电波发送代码。读取器获取此代码并将其传输到控制面板。控制面板根据读取器以及数据库中卡片拥有的访问类型对代码进行检查。这种基于令牌系统的优势包括可以从系统中删除任何卡片而不影响其他卡片或系统的其余部分。此外，连接到系统的所有门都可以以任何形式或方式分段，创建多个访问区域，每个区域都有不同的权限。令牌本身还可以以多种方式分组，为不同组的人提供不同的访问级别。如果建筑空间被重新分配，可以快速方便地修改所有访问级别或门的分段。新技术正在为标准的令牌系统增加功能。智能卡也可以用于携带识别令牌。基于令牌的验证的主要缺点是只有令牌本身被验证。因此，令牌被盗可能会让任何拥有令牌的人获得系统保护内容的访问。\n\
  \n令牌被盗的风险可以通过使用多因素认证（定义在下一节中）来抵消。人们尝试实现多因素认证的方法之一是在系统中添加生物识别因素。另一种较便宜的替代方案是在挑战/响应认证过程中使用硬件令牌。这样，它既充当拥有的又已知的认证机制。这种设备存在多种变体，但它们都按照相同的原理工作。该设备具有\
  \ `LCD` 屏幕，也可能没有。\n\n## 多因素 (Multifactor)\n\n`Multifactor`是一个描述同时使用一种以上认证机制的术语。其例子是硬件令牌，它同时需要\
  \ `PIN` 或密码。生物识别也经常与 `PIN` 结合使用，以便它们也可以作为多因素认证的一部分，在这种情况下，既是“你所拥有的”，也是“你所知的”。多因素认证的目的是提高安全级别，因为未经授权的人员要访问计算机系统，必须伪造多个一个机制。多因素安全最常见的例子是我们大多数人钱包里常见的普通\
  \ ATM 卡。该卡与只有授权持卡人才知道的 `PIN` 相关联。在没有卡的情况下知道 `PIN` 是没用的，就像有卡但不知道 `PIN` 也无法为你提供账户访问权限。\n\
  \n**考试提示 (EXAM TIP)** 要求使用一种以上的认证系统被称为多因素认证。最常见的例子是密码与硬件令牌的结合。对于高安全性，可以使用三个因素：密码、令牌和生物识别。\n\
  \n## 单点登录 (SSO)\n\n单点登录（Single sign-on）是一种认证形式，涉及在系统之间传输凭据。随着日常使用中的系统越来越多地组合，用户被迫拥有多组凭据。用户为了完成工作，每天可能需要登录三个、四个、五个甚至更多系统。单点登录允许用户传输其凭据，因此登录一个系统就登录了所有系统。这种方法的优点是减少了用户登录的困扰。它的缺点是将认证系统结合，以至于如果其中一次登录被破解，该用户的所有登录都会被破解。\n\
  \n\n\n\n\n`Mutual authentication`（双向认证）描述了电子通信双方相互验证对方真实性的过程。我们习惯于在访问互联网之前先向 ISP（互联网服务提供商）进行身份验证，通常通过使用用户\
  \ ID/密码对，但我们如何确定自己确实是在与 ISP 通信，而不是以某种方式插入我们通信中的其他系统（中间人攻击）呢？双向认证提供了一种机制，让客户端/服务器关系的双方验证对方的真实性以解决这一问题。\n\
  \n## 漏洞\n\n与所有这些远程访问方法相关的主要漏洞是关键数据的明文传输。如果密码被嗅获，明文传输密码将无法提供任何安全性，而嗅探器在网络上是很容易使用的。即使是明文传输用户\
  \ ID 也会提供可以关联并可能被攻击者利用的信息。明文传输凭据是 `Telnet` 的基本缺陷之一，这也是开发 `SSH` 的原因。这也是 `RADIUS`\
  \ 和 `TACACS+` 的缺陷之一，因为它们存在不受保护的分段。虽然有方法克服这些局限性，但它们建立系统时需要纪律和理解。\n\n加密算法的强度也是关注的问题。如果特定的算法或方法被证明存在漏洞，那么仅依赖于它的服务也会脆弱。为了规避这种依赖，许多协议允许多种加密方法，这样当其中一种被证明有漏洞时，切换到另一种方法即可恢复安全性。\n\
  \n与任何软件实现一样，始终存在漏洞导致系统易受攻击的可能性。大多数软件包已经修复了漏洞，以关闭导致系统脆弱的漏洞，远程访问功能也不例外。正如大众媒体可能认为的那样，这并不是\
  \ `Microsoft` 特有的现象。在几乎每个产品中都发现了严重缺陷，从如 `OpenSSH` 等开放系统实现到如 `Cisco` ` `IOS` 等专有系统。问题不在于软件漏洞的存在，因为随着软件变得越来越复杂，这是一个不可避免的问题。真正的关键在于供应商在发现漏洞后修复的响应速度，而像\
  \ `Cisco` 和 `Microsoft` 这样的主要厂商在该领域的反应非常迅速。\n\n## 联邦\n\n`Federation`（联邦）或 `identity\
  \ federation`（身份联邦）定义了跨系统和跨组织管理身份的策略、协议和实践。其最终目标是允许用户无缝地访问跨域的数据或系统。联邦通过使用本章较早部分讨论的\
  \ `SAML` 等行业标准来实现。\n\n### 传递信任/认证\n\n跨多个域的安全通过信任关系提供。当域之间存在信任关系时，每个域的身份验证信任所有其他受信任域的身份验证。因此，当应用程序被某个域验证时，其身份验证将被所有信任该验证域的其他域所接受。\n\
  \n需要注意的是，信任关系仅适用于身份验证。它们不适用于资源使用，资源使用是一个访问控制问题。信任关系允许用户验证其身份（身份验证）。使用资源的能力由访问控制规则定义。因此，尽管用户通过信任关系进行了身份验证，但它并没有提供实际使用资源的访问。\n\
  \n传递信任关系意味着扩展到一个域的信任关系将扩展到该域信任的任何其他域。双向信任关系意味着两个域互相信任。\n\n***\n\n![image](img/examtip.jpg)\n\
  \n**考试贴士** 传递信任涉及三方：如果 `A` 信任 `B`，且 `B` 信任 `C`，那么在传递信任关系中，`A` 将信任 `C`。\n\n## 复习\n\
  \n在本章中，你熟悉了许多可以在各种访问条件下实现安全的方法，随着新协议开发以满足日益增长的远程访问需求，这些方法的数量不断增加。从 `Telnet` 的开始到\
  \ `RADIUS` 和 `Kerberos` 的高级认证机制，选择有很多，但任务基本上是相同的：执行识别、认证、授权和审计的功能，同时保护消息和数据安全不受外部干预。\n\
  \n你对访问方案的选择取决于多个因素，包括安全需求、网络类型、客户端类型、所需的访问方法、可扩展性、现有的认证机制以及成本。每个系统都有其优缺点，当被妥使用时，每个系统都可以在其限制范围内有效使用。目前没有最佳解决方案。\n\
  \n## 问题\n\n为了帮助你进一步准备 `CompTIA Security+` 考试并测试你的准备程度，请回答以下问题并与章节末的正确答案进行比对。\n\n\
  **1.** `RADIUS` 使用以下哪个 UDP 端口？\n- **A.** 22 和 23\n- **B.** 49 和 65\n- **C.** 512\
  \ 和 513\n- **D.** 1812 和 1813\n\n**2.** 哪种协议旨在取代 `RADIUS`？\n- **A.** `LDA`\n- **B.**\
  \ `TACACS`\n- **C.** `TACACS+`\n- **D.** `Diameter`\n\n**3.** `TACACS+` 使用以下哪个 TCP\
  \ 端口？\n- **A.** 22 和 23\n- **B.** 49 和 65\n- **C.** 989 和 990\n- **D.** 512 和 513\n\
  \n**4.** 下列哪项正确描述了认证、授权和审计（AAA）协议中的“认证”（authentication）？\n- **A.** 管理连接时间和费用记录\n\
  - **B.** 确定用户是否具有权限的过程\n- **C.** 远程连接客户端的机制\n- **D.** 连接到已批准的用户\n\n**5.** 下列哪项正确描述了\
  \ `TACACS+` 客户端和服务器之间的通信？\n- **A.** `TACACS+`（通常为 `NAS`）与服务器之间的通信容易破解，但用户（通常为 `PC`）之间的通信是安全的。\n\
  - **B.** `TACACS+`（通常为 `NAS`）与服务器之间的通信是安全的，但用户（通常为 `PC`）之间的通信容易破解。\n- **C.** `TACACS+`（通常为\
  \ `PC`）与服务器之间的通信容易破解，但用户（通常为 `NAS`）之间的通信是安全的。\n- **D.** `TACACS+`（通常为 `PC`）与服务器之间的通信是安全的，但用户（通常为\
  \ `NAS`）之间的通信容易破解。\n\n**6.** 下列哪项不是点对点协议 (`PPP`）支持的功能？\n- **A.** 密码认证协议 (`PAP`）\n\
  - **B.** 使用链路控制协议 (`LCP`）建立、配置和测试链路\n- **C.** 使用网络控制协议 (`NCP`）建立和配置不同的网络协议\n- **D.**\
  \ 在串行链路上封装数据报\n\n**7.** 挑战响应握手认证协议 (`CHAP`）的另一种描述是？\n- **A.** 隧道端点\n- **B.** 将数据包封装在另一个数据包中\n\
  - **C.** 三次握手\n- **D.** 传输过程中的消息封装\n\n\n\n\n\n## 8. Telnet 使用哪个端口？\n\n**A.** UDP\
  \ 端口 22\n**B.** TCP 端口 22\n**C.** UDP 端口 23\n**D.** TCP 端口 23\n\n## 9. 在多因素认证中，以下哪一项不是所有因素（用户拥有的东西）？\n\
  \n**A.** 一性口令\n**B.** 磁条\n**C.** 识别码 (PIN)\n**D.** USB 令牌\n\n## 10. 指纹是以下内容的示例：\n\
  \n**A.** 你拥有的\n**B.** 你知道的\n**C.** 你特征\n**D.** 共享密钥\n\n## 11. 在准备参加 CompTIA Security+\
  \ 认证考试时，你和你的一个小伙伴正在互相提问。你的小伙伴问：“建立 RADIUS 连接的六个步骤是什么？”你会如何回答？\n\n## 12. 你的学习伙伴接着问：“建立\
  \ TACACS+ 连接的七个步骤是什么？”你会如何回答？\n\n## 13. 作为计算机安全专业人员，能够向上级描述 Kerberos 认证的工作原理是非常重要的。请列出\
  \ Kerberos 认证的六个步骤。\n\n## 14. 列出用于建立身份的五个不同因素，并给出每个因素的例子。\n\n## 15. 将端口与服务进行匹配：\n\
  \n**A.** 139 **1.** FTP\n**B.** 80 **2.** DNS\n**C.** 21 **3.** POP3\n**D.** 3389\
  \ **4.** NetBIOS\n**E.** 110 **5.** HTTP\n**F.** 53 **6.** RDP\n\n### 答案\n\n1. **D.**\
  \ `RADIUS` 使用 `UDP`（以及 `TCP`）端口 1812 和 1813。\n2. **D.** `Diameter` 设计用于取代 `RADIUS`\
  \ 协议。\n3. **B.** `TACACS+` 使用 `UDP` 和 `TCP` 端口 49 和 65。\n4. **D.** `认证` 是安全的基石元素，将访问权限与之前批准通过的用户\
  \ ID 连接起来。\n5. **B.** `TACACS+` 客户端（通常为 `NAS`）与 `TACACS+` 服务器之间的通信是安全的，但用户（通常为 `PC`）与\
  \ `TACACS+` 客户端之间的通信可能会受到攻击。\n6. **A.** `密码认证协议`（`PAP`）不是点点协议（`PPP`）的功能。`PAP` 是一个不同的协议。\n\
  7. **C.** `挑战握手协议`（`CHAP`）的另一种描述方式是三次握手。\n8. **D.** `Telnet` 使用 `TCP` 端口 23。\n9.\
  \ **C.** `PIN`（识别码）是一个知识因素（你知道的东西）。\n10. **C.** `fingerprint`（指纹）是生物识别的，因此是你特特征的。\n\
  11. 建立 `RADIUS` 连接的步骤是：1) 用户向 `NAS` 发起 `PPP` 认证；2) `NAS` 提示输入用户名和密码（如果是 `PAP`）或进行挑战（如果是\
  \ `CHAP`）；3) 用户用凭据回复；4) `RADIUS` 客户端将用户名和加密后的密码发送到 `RADIUS` 服务器；5) `RADIUS` 服务器响应\
  \ `Access-Accept`、`Access-Reject` 或 `Access Challenge`；6) `RADIUS` 客户端根据用户请求的服务执行操作。\n\
  12. 建立 `TACACS+` 连接的步骤是：1) 用户向 `NAS` 发起 `PPP` 连接；2) `NAS` 提示输入用户名和密码（如果是 `PAP`）或进行挑战（如果是\
  \ `CHAP`）；3) 用户用凭据回复；4) `TACACS+` 客户端向 `TACACS+` 服务器发送 `START` 请求；5) `TACACS+` 服务器响应认证完成，或者客户端发送\
  \ `CONTINUE` 直到完成；6) `TACACS+` 客户端和服务器交换授权请求；7) `TACACS+` 客户端根据用户请求的服务执行操作。\n13.\
  \ `Kerberos` 认证的六个步骤是：1) 用户提交其凭据并向密钥发行中心（`KDC`）请求票据；2) `KDC` 验证凭据并颁发票据令牌（`TGT`）；3)\
  \ 用户向 `KDC` 提交 `TGT` 和服务请求；4) `KDC` 验证授权并颁发客户端到服务器的票据（或服务票据）；5) 用户向所需的服务提交请求和客户端到服务器的票据；6)\
  \ 如果客户端到服务器的票据有效，则向客户端授予服务。\n14. 你知道的（密码）\n    你拥有的（令牌）\n    你特征的（生物识别）\n    你做的（走路姿态或打字模式）\n\
  \    你所在的（当前位置）\n15. 将端口与服务进行匹配：\n**A.** 139 **4.** NetBIOS\n**B.** 80 **5.** HTTP\n\
  **C.** 21 **1.** FTP\n**D.** 3389 **6.** RDP\n**E.** 110 **3.** POP3\n**F.** 53\
  \ **2.** DNS\n\n## 第 22 章\n\n## 账户管理\n\n在本章中，你将：\n\n* 学习用户、组和角色管理之间的区别\n* 探索密码策略\n\
  * 理解为账户管理安装安全控制措施的最佳实践\n* 理解配置账户管理安全控制的最佳实践\n\n随着越来越多的用户开始共享系统，显然需要某种方法来区分和限制用户，这导致了用户、组和权限的概念。这些概念不断发展和完善，现在是我们所说的账户管理的一部分。\n\
  \n账户管理也称为权限管理。权限管理是限制用户与计算机系统交互的过程。用户与计算机系统的交互范围广泛，包括查看、修改和删除数据；运行应用程序；停止和启动进程；控制计算机资源。本质上，控制用户对计算机或使用计算机的一切行为都属于账户管理的范畴。\n\
  \n### 用户、组和角色管理\n\n为了在同一系统上有效地管理许多不同人的权限，需要一种将人们划分成独立实体（用户）的机制，以便在个人层面控制访问权限。在同时向许多人（组）授予访问权限时，将用户组合是非常方便且高效的。在其他情况下，根据人们在组织中的工作或功能（角色）来授予或限制访问是非常有用的。虽然你可以仅基于用户来管理权限，但结合管理用户、组和角色分配将更加方便和高效。\n\
  \n\n\n\n\n`user` 一词通常指任何访问计算机系统的个人。在权限管理中，`user` 指单个个体，例如“John Forthright”或“Sally\
  \ Jenkins”。这通常是权限管理涉及的最低层级，也是处理访问、权限和能力的最常见区域。在访问计算机系统时，每个 `user` 通常都会被赋予一个 `user\
  \ ID`——这是一个唯一的字母数字标识符，用户在登录或访问系统时使用它来识别自己的身份。`User IDs` 通常基于用户名、中间名和姓名的某种组合，并且通常也包含数字。在制定选择\
  \ `user IDs` 的方案时，你应该记住 `user IDs` 必须对每个用户都是唯一的，但它们也必须足够易于用户记忆和使用。由于 `user ID` 用于识别执行特定操作的人，因此不使用通用或共享的凭据至关重要。这两种情况的任何一种都会对授权用户的追溯变得非常困难，甚至无法实现。\n\
  \n![image](img/examtip.jpg)\n\n考试提示：在调查访问控制问题时，为系统的所有用户提供唯一且不共享的 `user IDs` 是至关重要的。\n\
  \n在某些少数例外的情况下，通常情况下，想要访问计算机系统的 `user` 必须首先在其希望使用的系统上为其创建一个 `user ID`。这通常由系统管理员、安全管理员或其他特权用户完成，这是权限管理的第一步——不应允许用户创建自己的账户。\n\
  \n一旦创建了账户并选了 `user ID`，管理员就可以为该用户分配特定的权限。权限控制了用户在系统上被允许的操作——例如他可以访问哪些文件、可以执行哪些程序等。虽然个人电脑通常只有一个或两个用户账户，但像服务器和大型机等较大的系统在同一系统上可以拥有数百个账户。\n\
  \n账户策略的执行是用户凭据系统的重要部分。凭据管理始于规定预期目标的策略。策略的关键要素包括诸如禁止共享账户和禁止未分配给用户的通用账户等元素。对于拥有多个角色的用户，可能需要多个账户，但这些需要通过策略界定，而不是临时规定。应该制定凭据管理规则，例如\
  \ `password policy`，包括锁定和恢复程序。当用户不再获得授权时（例如当他们离开公司或更换工作时），应该禁用账户而不是删除。\n\n### 组\
  \ (Groups)\n\n在权限管理中，`group` 是具有某些共同标准的用户的集合，例如需要访问特定数据集或一组应用程序。一个 `group` 可以由一个用户或数百个用户组成，且每个用户可以属于一个或多个组。图\
  \ 22-1 显示了一种常用的用户分组方法——基于工作功能构建组。现代操作系统通过组实现了基于角色的访问控制 (`RBAC`)。\n\n![image](img/f0419-01.jpg)\n\
  \n**图 22-1** 组的逻辑表示\n\n通过将用户分配到特定 `group` 的成员身份，你可以让控制该用户的访问和权限变得变得得易得多。例如，如果工程部门的每个成员都需要访问产品开发文档，管理员可以将工程部门的所有用户放在同一个\
  \ `group` 中，并允许该 `group` 访问必要的文档。一旦某个 `group` 被分配了访问特定资源的权限，向该组添加新用户将自动允许该用户访问该资源。实际上，用户一旦被放入该\
  \ `group`，就会“继承”该 `group` 的权限。正如 图 22-2 所示，计算机系统可以有许多不同的组，每个组都有自己的权利和权限。\n\n![image](img/f0419-02.jpg)\n\
  \n**图 22-2** Windows 中的组管理界面\n\n正如你在图 22-2 中看到的 `Administrators` 组的描述，该组对系统具有完全且不受限制的访问权限。这包括对所有文件、应用程序和数据的访问。任何属于\
  \ `Administrators` 组或被放入此组的人都对系统拥有大量的访问和控制权。\n\n![image](img/examtip.jpg)\n\n考试提示：将用户分组可以降低账户管理的复杂性。\n\
  \n### 多角色 (Multiple Roles)\n\n个人往往有业务需求。考虑一家小公司，用户可能有开发、测试和生产环境的账户——发布三套账户比将其合并为一个要安全得多。\n\
  \n### 账户策略执行 (Account Policy Enforcement)\n\n访问大多数系统的关键方法仍然基于密码。需要对密码进行管理以提供适当的保护级别。`password\
  \ policy` 可以确保采取必要的步骤。\n\n### 凭据管理 (Credential Management)\n\n`Credential management`\
  \ 指用于存储、管理和记录用户凭据使用的过程、服务和软件。凭据管理解决方案通常旨在帮助用户管理他们不断增长的密码集。凭据管理产品提供了一种安全的存储凭据的方法，并跨从本地存储到云存储。\n\
  \n### 组策略 (Group Policy)\n\n企业环境下的 Microsoft Windows 系统可以通过组策略 (`GPOs`) 进行管理。GPO\
  \ 通过一组可以管理的注册表设置起作用。许多设置可以通过 GPO 进行管理，包括许多安全相关的设置。\n\n### 密码策略 (Password Policies)\n\
  \n用户 ID/密码组合是访问应用程序、网站和计算机系统最常用的方法。平均用户在学校、工作和个人用途可能有几十个 ID 和密码组合。为了帮助用户选择良好的、难以猜测的密码，大多数组织都会实施并执行密码策略，该策略通常包含以下组件：\n\
  \n- **密码构造**：密码应该是多少字符、大写字母/数字/特殊字符的使用、不基于字典单词创建密码、不基于个人信息创建密码、不要对现有密码进行微调等。\n-\
  \ **重用限制**：是否允许重复使用密码，以及如果允许，频率是怎样的（你必须使用多少个不同的密码后才能可以使用用过的密码）。\n- **时长**：密码在更改或必须更改之前可以使用最短和最大天数，也称为\
  \ `password expiration period`。通常使用 1 天作为最小值，90 天作为最大值。90 天是考虑了用户便利性和安全性的平衡。\n\n\
  \n\n\n\n-   **密码保护**：不要将密码写在他人可以找到的地方、不保存密码、不允许自动登录、不与其他用户共享密码等。\n-   **后果**：与违反或不遵守策略相关的后果。\n\
  \n### 域密码策略\n\n`domain password policy` 是针对特定域的密码策略。由于这些策略通常与 Windows 操作系统相关（参见图\
  \ 22-3），因此域密码策略是在 `Active Directory domain controller`（活动目录域控制器）上实施和执行的。域密码策略通常属于\
  \ `GPO`，并包含以下元素：\n\n![image](img/f0421-01.jpg)\n\n**图 22-3** Windows 本地组策略编辑器中的密码策略选项\n\
  \n- **强制密码历史**：告诉系统需要记住多少个密码，并且不允许用户重复旧密码。\n- **最大密码年龄**：指定密码在必须更改之前可以使用的最长天数。\n\
  - **最小密码年龄**：指定密码在再次更改之前必须使用的的最少天数。\n- **最小密码长度**：指定密码中必须使用的最少字符数。\n- **密码必须满足复杂性要求**：指定密码必须满足最小长度要求，并包含以下四组中的至少三组字符：英语大写字母（A\
  \ 到 Z）、英语小写字母（a 到 z）、数字（0 到 9）和非字母字符（如 !, $, #, %）。\n- **使用可逆加密存储密码**：本质上等于存储密码的明文版本；仅当应用程序使用需要用户密码进行身份验证的协议（例如挑战握手验证协议，或\
  \ `CHAP`）时才使用。由于它是可逆的，应尽可能避免使用。\n\n密码在应用中几乎无处不在。它们有几个关键优势，例如它们始终随用户。。密码管理的一个挑战是“密码困境”：“我们让攻击者猜中密码变得越困难，强制更改密码的频率就越高，用户就越难记住密码，写下来的可能性就越大。”解决密码困境的唯一可靠方案涉及纯安全元素与易用性元素之间的折衡。\n\
  \n![image](img/examtip.jpg)\n\n**考试提示** 与密码相关的关键安全控制包括密码复杂度规则、锁定规则和过期时间表。\n\n目前已设计出在失败次数有限后进行锁定的复杂系统。这防止了自动猜解程序尝试所有密码直到找到正确的密码。锁定可以设置自动重置，例如在每次三次失败后\
  \ 5 分钟自动重置。这减少了帮助台重置密码的负载。密码系统可以围绕知识系统构建自动重置机制。这使得使用户能够重置自己的密码，再次无需与帮助台交互，从而使系统运行更高效。\n\
  \n### 密码攻击\n\n密码被用作安全控制来实现某种形式的身份验证。存在可以针对密码系统的攻击，即设计用于绕过系统并实现访问的攻击。针对密码的攻击有许多不同的形式，每种都旨在攻击密码系统的不同方面。`Dictionary\
  \ attacks`（字典攻击）使用由常用词、俚语或可能具有意义的词组成的自定义字典。有些程序可以从网页内容甚至硬盘内容等元素构建字典。尽管这些工具可能会生成数百万甚至更多密码，自动检查器仍然可以快速遍历此类列表。用户倾向于使用他们能记住的事物创建密码，使用用户可用或创建的来源，这可以为猜测密码提供手段。\n\
  \n`Brute-force attacks`（暴力破解）利用计算机的力量创建随机密码列表，并使用这些密码测试系统。`hybrid`（混合）攻击是字典攻击和暴力破解的结合。与这些攻击相关的技术是\
  \ `birthday attack`（生日攻击）场景。生日攻击场景以生日问题命名。\n\n密码的强度与其长度和复杂度有关。更多细节请见第 15 章。\n\n\
  ![image](img/examtip.jpg)\n\n**考试提示** 与密码相关的关键安全控制包括密码复杂度规则、锁定规则和过期时间。\n\n### 账户审计\n\
  \n与所有安全控制一样，减轻风险的安全控制的一个方面是监控组件。日志是最常用的组件，对于特权账户，日志可能尤为重要。审查根账户的访问控制日志是安全访问的重要元素。由于权限和潜在的滥用，应对对管理账户进行严密监控。持续监控的一个重要元素是使用管理账户。\n\
  \n![image](img/examtip.jpg)\n\n**考试提示** 失败尝试的记录为调查提供了宝贵信息。\n\n强大的配置管理环境将包括对能够更改环境的用户访问系统的控制。根级更改通常是重大的，在生产系统中这些更改应预先批准。将所有根级活动与已批准的更改进行比较将有助于检测活动。\n\
  \n### 章节总结\n\n在本章中，你熟悉了账户管理的安全方面。章节介绍了账户策略问题，包括多个账户/角色和共享账户、凭据管理、组策略和通用账户禁止。还介绍了密码策略元素，如复杂度要求、过期、恢复、历史、重复和长度要求。章节讨论了用户账户元素，如锁定、禁用和记录。\n\
  \n### 问题\n\n为了帮助你进一步准备 CompTIA Security+ 考试并测试你的准备程度，请回答以下问题，然后与章节末的正确答案进行比对。\n\n\
  **1** 平衡密码安全与用户便利性的推荐密码更改周期是多久？\n\nA. 30 天\nB. 90 天\nC. 120 天\nD. 180 天\n\n\n\n\n\
  \n### 2. 下列哪个密码长度提供了最大的密码强度？\n\n**A.** 4 个字符\n**B.** 8 个字符\n**C.** 15 个字符\n**D.**\
  \ 使用单单词短语\n\n### 3. 从实际角度来看，在锁定账户之前应该允许输入多少密码？\n\n**A.** 1 次\n**B.** 3 次\n**C.**\
  \ 10 次\n**D.** 24 次\n\n### 4. 下列哪项内容代表了最严格的密码策略规定？\n\n**A.** 构造、重用、有效期、保护措施、后果\n\
  **B.** 绝不通过电子邮件传输密码，绝不手写密码\n**C.** 长度、过期、复杂性、账户共享、密码共享/记录\n**D.** 禁止字典词、包含数字、绝不手写密码\n\
  \n### 5. 什么是密码困境？\n\n**A.** 良好的密码策略定义了密码长度、有效期、禁止字典词和复杂性。\n**B.** 密码选择是个个人活动，确保个人做出良好的选择是组织密码策略的范畴。\n\
  **C.** 使用常用单词、短语或名称。\n**D.** 我们让攻击者越难猜到我们的密码，且我们强制更改密码的频率就越高，用户记忆密码就越越困难，他们也越可能将其写下来。\n\
  \n### 6. 为什么不应该把密码写下来？\n\n**A.** 把密码写下来有助于你更好地记住密码。\n**B.** 如果攻击者获得了工作区域的物理访问权限，就更容易找到密码。\n\
  **C.** 写下密码通常会导致选择更简单的密码。\n**D.** 写下密码使得在多个账户上使用同一个密码变得更容易。\n\n### 7. 下列哪项在入侵入侵调查期间提供了有价值的信息？\n\
  \n**A.** 关键文件的访问日志\n**B.** root 级登录次数\n**C.** 登录的 IP 地址\n**D.** 登录失败尝试的次数\n\n###\
  \ 8. 下列哪项正确定义了密码策略？\n\n**A.** 一组适用于特定域的规则，通过要求用户使用并维护强密码来增强计算机安全\n**B.** 一个人必须记住多少个密码，并防止用户重用旧密码\n\
  **C.** 一组规则，通过要求用户使用并维护强密码来增强计算机安全\n**D.** 密码中必须使用的最少字符数\n\n### 9. 下列哪项实现了最严格的域域密码策略？\n\
  \n**A.** 强制执行密码历史、最大密码有效期、最小密码有效期、最小密码长度\n**B.** 密码构造、重用、有效期、密码保护\n**C.** 长度、过期、复杂性、账户共享、密码共享/记录\n\
  **D.** 禁止字典词、包含数字、绝不手写密码\n\n### 10. 列出三种类型的密码攻击。\n\n### 11. 列出三个缓解风险的重要用户账户因素。\n\
  \n### 12. 你的同事告诉你，他发明了一个记住密码的好方法。他开始从一个非常强的密码开始，现在每当需要更改密码时，只需更改最后两个字符。你朋友这样做的弱点是什么？\n\
  \n### 13. 你的老板要求你为执行人员准备一份幻灯片演示稿，概述密码策略的五个组成部分。列出你将放在幻灯片上的五个点。\n\n### 14. 选择良好密码策略的两个元素，并在密码困境的背景下，解释这些元素可能带来的问题。\n\
  \n### 15. 将密码策略问题与其缓解的攻击进行匹配：\n\n**A.** 密码长度 — **1.** 字典攻击\n**B.** 密码文件访问 — **2.**\
  \ 生日攻击\n**C.** 密码复杂性 — **3.** 暴力破解攻击\n\n### 答案\n\n**1.** **B.** 九十天是安全与便利之间的一种合理平衡。\n\
  **2.** **C.** 十五字符是这些选项中最强的，因为单单词长度不会超过 15 个字符。\n**3.** **B.** 三次尝试是合理的。\n**4.**\
  \ **A.** 关于构造、重用、有效期、保护和后果的规定将创建最强大的密码策略。\n**5.** **D.** 密码困境定义为：“我们让攻击者越难猜到我们的密码，且我们强制更改密码的频率就越高，用户记忆密码就越困难，他们也越可能将其写下来。”\n\
  **6.** **B.** 不应该把密码写下来，因为如果攻击者获得了工作区域的物理访问权限，就更容易找到密码。\n**7.** **D.** 登录失败的尝试（尤其是大量的尝试）表明存在破解尝试。\n\
  **8.** **C.** 密码策略是一组规则，通过要求用户使用并维护强密码来增强计算机安全。\n**9.** **A.** 强制执行密码历史、最大密码有效期、最小密码有效期和最小密码长度是域密码策略的元素。\n\
  **10.** 字典攻击、暴力破解、混合攻击和生日攻击是发现密码的方法。\n**11.** 用于缓解账户风险的因素包括密码复杂性、账户锁定、账户禁用、共享账户和通用账户禁止。\n\
  **12.** 虽然同事的密码仍然很，但它并没有发生显著变化。如果他的账户被破解，可能会发现他只是在增量地通过两个字符来更改密码。\n**13.** 密码策略的五个关键组成部分是密码构造、重用限制、有效期、密码保护和后果。\n\
  **14.** 过于复杂的密码构造会导致人们写下密码。重用限制可能会导致人们重用密码的微小变。有效期可能会导致人们在频繁更改密码时记录密码。密码保护可能会导致人们仍然隐藏密码，只是放在了更有“创意”但仍然很弱的地方。后果可能会导致人们掩盖与密码策略有关的行为。\n\
  \n\n\n\n\n-   识别不同的加密类型\n-   学习当前的加密方法\n-   理解加密如何应用于安全领域\n-   在给定场景中利用通用密码学概念\n\
  \n`Cryptography`（密码学）是关于加密或隐藏信息的科学——这是人们自他们开始使用语言以来就一直在尝试的事情。尽管语言允许他们相互交流，但掌握权力的人试图通过控制谁能接受读写训练来隐藏信息。最终，人们开发出了更复杂的隐藏信息的方法，即通过移动字母来使文本变得不可读。这些复杂的方法就是加密算法，也称为\
  \ `ciphers`（密码/密码）。“cipher”一词源于阿拉伯语 `sifr`，意为空值或零。\n\n## 通用密码学概念\n\n历史上的密码既易于使用，也容易被破解。因为隐藏信息仍然很重要，所以需要更先进的置位密码和替换密码。随着系统和技术的复杂化，密码经常通过某些机械或机电设备实现自动化。现代加密机的一个著名例子是第二次世界大战期间德国的恩尼玛（Enigma）机器。这台机器使用一系列复杂的替换来执行加密，有趣的是，它促进了计算机领域的广泛研究。\n\
  \n当被称为 `plaintext`（明文）的材料需要防止未经授权的拦截或篡改时，它会被加密为 `ciphertext`（密文）。这是通过算法和 `key`（密钥）完成的，数字计算机的出现提供了大量的算法和日益复杂的密钥。特定算法的选择取决于几个因素，我们将在本章中探讨。\n\
  \n密码分析（Cryptanalysis）是分析可用信息以尝试将加密消息还原为原始形式的过程，复杂的加密方法需要计算机技术的进步。计算机的诞生使得轻松执行更复杂加密算法所需的计算成为可能。今天，计算机几乎完全主导了加密实现。计算机技术也帮助了密码分析，允许开发新方法，例如线性分析和差分密码分析。差分分析通过比较输入\
  \ `plaintext` 和输出 `ciphertext` 来尝试确定用于加密信息的密钥。线性分析的相似之处在于它也同时使用 `plaintext` 和 `ciphertext`，但它将\
  \ `plaintext` 通过一个简化的 `cipher`，试图推出完整版本 `cipher` 中可能的密钥是什么。\n\n## 对称\n\n对称加密是一种较老且更简单的信息加密方法。对称加密的基础是消息的发送者和接收者此前都获得了相同的\
  \ `key`。事实上，这甚至是最古老密码的基础——斯巴达人需要完全相同尺寸的圆柱，使圆柱成为消息的“密钥”，而在移位密码中，双方都需要知道所执行移动的方向和数量。所有对称算法都基于这种\
  \ `shared secret`（共享密钥）原则，包括不可破解的一次性口便密码法。\n\n`Figure 23-1` 是一个简单的图表，显示了对称算法从 `plaintext`\
  \ 到 `ciphertext` 提供加密所经历的过程。该 `ciphertext` 消息可能被传输给消息接收者，接收者使用与加密消息时相同的 `key` 经过解密消息的过程。`Figure\
  \ 23-1` 显示了算法的密钥，在对称加密的情况下，它们是相同的值。\n\n![image](img/f0432-01.jpg)\n\n**图 23-1**\
  \ 对称算法的布局\n\n与哈希函数不同，对称加密涉及密码学 `key`，因此必须有一种密钥管理机制。在对称算法中，管理密码密钥关重要，因为密钥解锁了正在受保护的数据。然而，密钥也需要以秘密方式告知或传输给你想通信的方。这种密钥管理适用于密钥可能发生的所有情况：在本地计算机上保护它、在远程计算机上保护它、防止数据损坏、防止丢失，以及可能最重要的步骤：在密钥在双方之间传输时保护它。在本章稍后我们将介绍公钥密码学，它极大减轻了密钥管理问题，但对于对称算法，最重要的教训是仅通过已知的安全的存储和发送密钥。\n\
  \n![image](img/examtip.jpg)\n\n**考试提示** 常见的对称算法有 `3DES`、`AES`、`Blowfish`、`Twofish`\
  \ 和 `RC4`。\n\n对称算法之所以重要是因为它们相对快速且对计算要求较低。它们的主要弱点是两个地理位置相远的双方都需要一个完全匹配的密钥。在过去，密钥可以简单得多仍然是安全的，但凭借今天的计算能力，简单的密钥可以很快被暴力破解。这意味着必须使用并交换更大、更复杂的密钥。这种密钥交换是困难的，因为密钥不能简单（例如一个单词），必须以安全的方式共享。这种密钥交换由于我们的下一个主题——非对称加密或公钥加密而得到了极大便利。\n\
  \n## 公钥或非对称\n\n非对称加密通常被称为公钥加密。在许多方面，非对称加密与对称加密不同。虽然两者都用于防止未经授权的用户获取数据，但非对称加密使用两个密钥而不是一个。它由\
  \ Whitfield Diffie 和 Martin Hellman 于 1975 年发明。该系统使用一对密钥：一个保持秘密的私钥（private key）和一个可以发送给任何人的公钥（public\
  \ key）。系统的安全性取决于在已知一个密钥的情况下推导出另一个密钥，从而从 `ciphertext` 中检索出 `plaintext`。\n\n公钥系统通常通过使用复杂的数学问题工作。较常见的方法之一是通过大数分解的困难性。这些函数通常被称为\
  \ `trapdoor functions`（陷门函数），因为在没有密钥的情况下很难处理，但在你有密钥时很容易处理——密钥就是穿过函数的陷门。例如，给定一个质数，如\
  \ `293`，另一个质数，如 `307`，将它们相乘得到 `89951` 是一个简单的函数。给定 `89951`，除非你知道其中一个，否则寻找因子 `293`\
  \ 和 `307` 并不简单。计算机可以轻松地乘以几百或数千位的大型质数，但不能轻易分解其乘积。\n\n这些函数的强度非常重要：因为攻击者可能可以访问公钥，他可以运行已知明文测试并产生密文。这允许对算法密钥的猜测进行快速检查。`RSA`、`Diffie-Hellman`、`椭圆曲线密码学\
  \ (ECC)` 和 `ElGamal` 都是流行的非对称协议。\n\n\n\n\n非对称加密涉及两个独立但在数学上相关的密钥。这些密钥的使用方式相反：一个密钥的作用消除另一个密钥的作用，反之亦然。因此，如图\
  \ 23-2 所示，如果你用一个密钥加密消息，则使用另一个密钥来解密消息。在上面的示例中，Alice 想要向 Bob 发送私密消息。因此，她使用 Bob 的公钥加密消息。然后，由于只有\
  \ Bob 的私钥可以解密消息，所以只有 Bob 能够阅读。在下方的示例中，Bob 想要发送一条消息，并证明该消息来自他。通过用他的私钥进行加密，任何使用他的公钥解密的人都知道该消息来自\
  \ Bob。\n\n![image](img/f0434-01.jpg)\n\n**图 23-2** 使用非对称算法\n\n![image](img/examtip.jpg)\n\
  \n**考试贴士** 公钥加密始终涉及两个密钥，一个公钥和一个私钥，它们合称为密钥对。公钥广泛提供给任何可能需要它的人，而私钥则被严密保护且不与任何人共享。\n\
  \n非对称密钥通过证书进行分发。数字证书包含公钥与实体之间关联的信息，以及可用于验证证书和密钥当前有效性的附加信息。当机器之间交换密钥时（例如在 SSL/TLS\
  \ 握手期间），交换是通过传递证书完成的。\n\n### 对称 vs. 非对称\n\n对称加密和非对称加密方法各有优缺点。对称加密通常速度更快，计算开销较小，更适合大批量传输。但它面临密钥管理问题，因为密钥必须免受未经授权方的侵害。非对称方法通过公钥解决了密钥的机密性问题，但增加了显著的计算复杂性，使其不那么适用于批量加密。\n\
  \n通过使用非对称加密来传递对称密钥，可以结合这两种体系的优点来完成批量加密。通过引入临时密钥交换（ephemeral key exchange），你可以实现完美的前向安全性（在本章稍后部分讨论）。数字签名是一种非常有用的工具，但如果没有非对称方法，它是不可行的。\n\
  \n### 会话密钥\n\n`session key`（会话密钥）是在通信会话期间用于加密消息的对称密钥。它由随机种子生成，并在整个通信会话期间有效。当会话密钥在会话建立期间正确生成并传播时，可以在通信期间提供高水平保护，还能实现完美的前向安全性。会话密钥具有对称加密的优点（速度、强度和简单性），并且通过数字方法进行密钥交换，实现了高水平的自动化安全。\n\
  \n### 密钥交换\n\n加密机制同时使用算法和密钥，其中密钥需要双方之间进行通信。在对称加密中，机密性取决于密钥的机密性，因此密钥的不安全传输会导致无法保护使用该密钥加密的信息。`Key\
  \ exchange`（密钥交换）是安全对称加密系统的核心基础。维护对称密钥的机密性是秘密通信的基础。在非对称系统中，密钥交换问题是密钥发布问题。由于公钥的设计是为了共享，因此问题从机密性问题变成了公开性问题。\n\
  \n早期的密钥交换由受信任的信使执行。人们将密钥从发送者携带到接收者处。可以认为这种形式的密钥交换是 `key exchange` 的极致。（注：原文此处大量重复已去重）\n\
  \n\n\n\n椭圆曲线系统的安全性一直受到质疑，主要是因为缺乏分析。然而，所有的公钥系统都依赖于某些数学问题的困难性。任何上述系统若要被大幅削弱，都需要数学领域的突破，但已经对这些问题进行了相关研究，结果表明椭圆曲线问题对增进式的进展具有更强的抵抗力。同样，与所有的加密算法一样，只有时间才能证明它们到底有多安全。`ECC`\
  \ 系统的巨大优势在于在给定的位强度下，所需的计算能力更少。这使得 `ECC` 成为低功耗移动设备的理想选择。移动连接的激增带来了使用 `ECC` 和 `AES`\
  \ 算法保护用户数据的安全语音、电子邮件和短信应用程序。\n\n## 量子加密\n密码学在传统上是一个非常保守的信息技术分支。它依赖于经过证明的技术，并尽力抵抗变化。近年来，一个重大新话题是`量子加密`，它基于量子力学，主要是叠加和纠缠。对量子力学的讨论不在本文范围之内，但我们在密码学方面最关注的原理是：在量子力学中，对数据的测量会干扰数据。对于密码学家来说，这意味着很容易判断信息在传输过程中是否被窃听。这允许人们在交换密钥数据的同时，知道数据在传输过程中没有被拦截。\n\
  \n对`量子加密`的使用被称为`量子密钥分发`。这是目前`量子加密`的唯一商业用途，尽管有几种发送密钥的方法，但它们都遵循相同的原理。发送密钥位，然后在远端检查是否被拦截，然后使用相同的过程发送更多的密钥位。一旦整个密钥被安全地发送，就可以使用对称加密。涉及量子力学和密码学的另一个研究领域是量子密码分析。量子计算机对大质数进行分解的速度比普通计算机快数指数级，这可能导致\
  \ `RSA` 算法以及任何基于质因数分解的系统变得不安全。这导致了对不受量子计算攻击影响的密码体系的研究，被称为`后量子密码学`。\n\n## 哈希\n哈希函数是常用的加密方法。`hashing\
  \ function` 是一种执行单向加密的特殊数学函数，这意味着一旦算法经过处理，就没有可行的方法使用密文来检索生成该密文的明文。此外，理想情况下，没有可行的方法可以生成两个计算出相同哈希值的不同明文。图\
  \ 23-3 显示了通用的哈希过程。\n\n![image](img/f0438-01.jpg)\n\n**图 23-3** 哈希的工作原理\n\n哈希算法的常见用途存储计算机密码和确保消息完整性。其原理是哈希可以产生与输入数据对应的唯一值，但其他人运行相同的算法也可以生成相同的哈希值。因此，你可以对消息进行哈希以获得消息认证码（`MAC`），消息的计算数值将表明没有中间人修改过消息。这个过程之所以有效，是因为哈希方法通常是公开的，任何人可以使用指定的方法对数据进行哈希。生成哈希在计算上非常简单，因此通过将给定的哈希与本地生成的哈希进行匹配来检查某事的有效性或完整性非常简单。`HMAC`（基于哈希的消息认证码）是哈希技术的一个特殊子集。它是应用于消息以生成\
  \ `MAC` 的哈希算法，但它是使用预共享的密钥完成的。因此，`HMAC` 同时提供完整性和身份认证。\n\n哈希算法可能会受到所谓的`碰撞攻击`的影响，在这种攻击中，攻击者找到两个哈希值为相同的不同消息。这种攻击非常困难，需要生成一个单独的算法来尝试找到一个哈希值与已知哈希值相同的文本。这必须比简单地修改字符直到哈希出相同值（这是一种暴力攻击类型）更快地发生。遭受碰撞的哈希函数，其后果是完整性的丧失。如果一个攻击者可以故意让两个不同的输入哈希为相同值，她可能会欺骗人们运行恶意代码并引起其他问题。流行的哈希算法包括安全哈希算法（`SHA`）系列、`RIPEMD`\
  \ 算法，以及不同版本的消息摘要（`MD`）哈希（`MD2`、`MD4`、`MD5`）。\n\n![image](img/examtip.jpg)\n\n**考试提示**\
  \ 常用的哈希算法有 `MD2`、`MD4`、`MD5`、`SHA-1`、`SHA-256`、`SHA-384` 和 `SHA-512`。\n\n哈希函数非常常见，它们在安全存储密码等信息的方式以及消息签名的方式起着重要作用。通过计算消息的摘要，更复杂的非对称加密需要签名的数据就更少，这仍然保持了对消息完整性的保证。这是设计这些协议的主要目的，它们的成功将允许对电子协议和数字签名有更大的信任。\n\
  \n## 临时密钥\n`ephemeral keys` 是生成后仅使用一次的加密密钥。当临时密钥作为 `Diffie-Hellman` 方案的一部分时，它形成`Ephemeral\
  \ Diffie-Hellman`（`EDH`）密钥交换。`EDH` 为每个连接生成临时密钥，从不重复使用同一个密钥。这提供了完美前向安全性。\n\n## 密码学目标\n\
  加密方法的存在目的是为了保护数据的完整性和机密性。这种保护涉及许多元素以实现系统级的解决方案。如完美前向安全性、不可否赖性、密钥托管等其他元素实现了成功的密码学实现。\n\
  \n## 完美前向安全性\n`perfect forward secrecy` 是公钥系统的一种属性，即使原始密钥被破解，从另一个密钥派生的密钥也不会被破解。这在会话密钥生成中尤为重要，因为未来的通信可能会被破解；如果没有前向安全性，那么过去被记录的可能就可以被解密。\n\
  \n## 传输加密\n`transport encryption` 用于保护传输中的数据。当数据跨网络传输时，它面临被拦截的风险。检查 `OSI` 网络模型显示有一个专门用于传输的层，这种抽象可以用于管理通信通道的端到端加密功能。在使用\
  \ `TCP/IP` 协议时，`TLS` 是管理传输层安全的一种特定方法。`SSL` 是另一个传输层安全的示例。管理安全的通信层是许多形式计算机操作中的基本要素。\n\
  \n## 不可否赖性\n`non-repudiation` 是一种处理验证消息已发送和接收能力的属性，使得发送者（或接收者）无法否认发送（或接收）该信息。这种属性的应用示例出现在私钥持有者关系中。假设私钥永远不会离开私钥持有者的范围。如果发生这种情况，撤销密钥是持有者的责任。因此，如果使用了了私钥（如公钥验证成功证明），则假设该消息是由私钥持有者发送的。因此，签名的行为无法被持有者否认。\n\
  \n\n\n\n加密技术使用的惊人增长促使了密钥处理方法的新出现。`密钥托管`（Key escrow）是一种系统，其中你的私钥由你和第三方共同保管。加密非常擅长隐藏秘密，随着计算机技术变得人人都能负担起，犯罪分子和其他心怀不轨的人开始使用加密来向执法机构隐藏他们的通信和业务往来。由于他们无法破解加密，政府机构开始要求密钥托管。在这种情况下，密钥托管是一种你的私钥同时由你和政府共同保管的系统。这使得持有法院命令的人能够检索你的私钥，从而访问任何用你的公钥加密的内容。这些数据本质上是由你的密钥和政府密钥共同加密的，使得政府可以访问你的明文数据。\n\
  \n密钥托管也被用于企业实体，因为它在密钥持有者无法于场时提供了一种获取密钥的方法。此外，密钥恢复机制也可以实现这一点，而公司政策将决定在整个企业范围内保护密钥的恰当方式。\n\
  \n涉及外部机构的密钥托管可能会对加密提供的安全性产生负面影响，因为政府需要一个庞大且复杂的系统基础设施来持有每一个托管的密钥，而这些系统的安全性低于记忆密钥的安全性。然而，密钥托管是一把双刃剑。如果没有在密钥丢失或持有者死亡时恢复密钥的实用方法（例如），某些重要信息将永远丢失。此类问题将在可预见的未来影响加密技术的设计和安全性。\n\
  \n* *\n\n![image](img/examtip.jpg)\n\n**考试提示** 密钥托管可以解决许多因密钥无法访问导致的问题，而密码学的本质决定了没有密钥就无法访问数据。\n\
  \n### 隐写术\n\n`Steganography`隐写术）是加密技术的一个分支，其含义源自希腊语 `steganos`，意为“覆盖”。放置在文档上并用无害文本隐藏的隐形水就是隐写术消息的一个例子。另一个例子是位于人头顶的纹身，只有当人剃掉头发时才可见。\n\
  \n计算机时代的隐藏写作依赖于一个程序将数据隐藏在其他数据之中。最常见的应用程序是在图片文件中隐藏文本消息。互联网包含数十亿图像文件，使得隐藏消息几乎可以定位在任何地方而不被发现。图像文件的特性也使得隐藏消息难以检测。虽然将消息隐藏在图像内部是最常见的做法，但它们也可以隐藏在视频和音频文件中。\n\
  \n隐写术相对于加密的优势在于消息不会引起注意，而这种检测隐藏消息的困难为分析提供了额外的屏障。隐藏在隐写术消息中的数据通常也经过了加密，因此即使被发现，消息仍将保持安全。隐写术有许多用途，但最广为人知的用途是隐藏非法材料（通常是色情内容），或据称用于恐怖网络进行秘密通信。虽然没有直接证据表明恐怖分子使用隐写术，但这些技术在他们的一些训练材料中已有记载。\n\
  \n隐写编码可以用许多方式和通过许多不同的媒介使用。涵盖所有这些内容超出了本书的范围，但我们将讨论编码到图像文件的最常见的方法之一，`LSB 编码`。`LSB`（最低有效位\
  \ Least Significant Bit）是一种将信息编码到图像的方法，同时尽可能减少对实际视觉图像的影响。计算机图像由成千上万或数百万像素组成，所有像素都由\
  \ `1` 和 `0` 定义。如果一个图像由红、绿、蓝（RGB）值组成，每个像素都有一个从 `0` 到 `255` 数字表示的 RGB 值。例如，`0,0,0`\
  \ 是黑色，`255,255,255` 是白色，它们也可以表示为黑色的 `00000000`, `00000000`, `00000000` 和白色的 `11111111`,\
  \ `11111111`, `11111111`。给定的一个白色像素，将该像素的最低有效位编辑为 `11111110`, `11111110`, `11111110`\
  \ 就会改变颜色。这种颜的变化是肉眼无法察觉的，但在一个拥有百万像素的图像中，这创建了一个 `125KB` 的区域来存储消息。\n\n### 数字签名\n\n\
  `digital signature`数字签名是一种用于证明真实性和身份的密码学实现。通过使用公钥密码学，数字签名允许追溯到签署消息的人。数字签名的操作如图图\
  \ 23-4 所示。要签名的消息经过哈希处理，哈希值使用发送者的私钥进行加密。接收后，接收者可以使用发送者的公钥解密哈希值。如果随后对消息再次哈希处理显示相同的值，则可以知道两点：第一，消息没有被更改过；第二，发送者拥有该私钥，因此假设其就是发送者本人。\n\
  \n![image](img/f0441-01.jpg)\n\n* *\n\n**图 23-4** 数字签名操作\n\n数字签名本身不能保护内容免受截听。消息仍然是以明文发送的，因此如果对消息机密性有要求，必须采取额外措施保护消息免受窃听。这可以通过加密消息本身或加密传输消息的通道来实现。\n\
  \n### 使用经过验证的技术\n\n在建立加密方案时，使用经过验证的技术是非常重要的。经过验证的密码库和符合密码学的随机数生成器是稳健程序的基础元素。在这些领域使用自研或自定义元素会大大增加系统崩溃的风险。开发自己的加密算法超出了大多数小组的能力。算法复杂且难以创建。任何没有经过公开审查的算法都存在缺陷。大多数良好的算法在经过长时间测试和公开审查后才被使用。\n\
  \n### 总结\n\n在本章中，你熟悉了密码学的原理。章节从密码学概念开始，包括与通用密码学相关的词汇元素描述。介绍了密码学、加密和哈希的基本方法，并从算法类型和数据类型进行了分析。数据可以是块形式（即同时有多个字节用于加密），也可以是流形式（字节在时间上间隔分布）。加密算法本质上是对称或非对称的。密钥交换问题（对称加密中的一个挑战）得到了介绍，包括临时迪菲-赫曼交换等方法，这些方法提供了完美后安全性。新的方法，包括椭圆曲线和量子密码学，也得到了涵盖。\n\
  \n本章介绍了哈希函数在验证完整性方面的应用。哈希函数与非对称加密的结合实现了数字签名和不可否认性等功能。章节以密钥托管和隐写术等主题结束。\n\n### 习题\n\
