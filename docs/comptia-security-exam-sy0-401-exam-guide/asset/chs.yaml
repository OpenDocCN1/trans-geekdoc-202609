  **A.** 访问控制\n**B.** `CCTV`\n**C.** 加密\n**D.** 哈希值\n**E.** 锁\n**F.** 容错性\n\n**13.**\
  \ 你新实施的控制测试政策识别出疏散路线存在问题，正如演习期间人员表现困惑所示。最好的补救措施是什么？\n**A.** 更清晰的标识和修改后的疏散计划\n**B.**\
  \ 更好的围栏\n**C.** 重新设计办公室，将人员仅引导至南端较大的楼梯\n**D.** 更好的应急照明\n\n**14.** 定期疏散演习显示员工离开建筑花费了太长时间，因为他们带了笔记本电脑。受到质问时，他们表示关键数据仅存在于机器上。纠正此问题的安全控制是什么？\n\
  **A.** 增加演习\n**B.** 更好的疏散计划\n**C.** 更多的数据冗余\n**D.** 更快的疏散路线\n\n**15.** 公司已经使用了相同的锁多年。你请求基于卡片的访问控制系统时会使用哪些理由？\n\
