  \ 请按易失性顺序对以下项目进行排序：ARP 缓存、USB 驱动器、内存 (RAM)、临时文件系统/交换空间、CPU 寄存器内容、实时网络连接、硬盘上的数据。\n\
  \n12. 你怀疑一个用户的工作站感染了恶意软件，并正准备开始调查。如果你想降低该工作站感染你网络上其他系统的概率，但仍然想尽可能地保留证据，你应该采取以下哪种操作？\n\
  \nA. 关闭工作站\nB. 拔掉工作站的电源线\nC. 拔掉工作站的网线\nD. 从系统中移除所有 USB 设备和外设\n\n13. 你的组织刚刚从大型系统故障中恢复，事件响应小组的成员正准备回到正常工作。在响应小组正式解散之前，你应该对整个小组做什么？\n\
