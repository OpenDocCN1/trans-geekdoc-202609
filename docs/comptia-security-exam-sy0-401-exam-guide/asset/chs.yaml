  #### 6. B. 管理防火墙时最好使用最小访问原则；你希望防火墙拦截尽可能多的流量，同时允许授权通过。\n#### 7. C. 混杂模式告诉网络适配器处理收到的所有数据包，而针对其\
  \ MAC 地址的数据包和广播包。\n#### 8. A. 简单网络管理协议 (SNMP) 为许多网络设备提供管理功能，但 SNMPv1 和 SNMPv2 使用明文密码身份验证，允许监控数据包的人捕获密码并访问网络设备。\n\
  #### 9. C. 内容过滤代理在企业中很受欢迎，因为它们通过过滤身份验证用户不允许查看的内容来实施可接受使用策略。\n#### 10. B. 垃圾邮件生成器不等待\
  \ SMTP banner，可以通过其行为异常被识别为垃圾邮件发送者。\n#### 11. A, B, 和 E. 路由器、防火墙和 IDS 是确定攻击者路径和目标应检查的主要日志。\n\
