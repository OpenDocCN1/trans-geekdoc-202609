  \ international\\_cs@mcgraw-hill.com。\n\n## 术表\n\n**3DES**: 三重加密——使用三轮 DES 加密提高安全性。\n\
  \n**802.11**: 描述无线设备网络协议的标准族。\n\n**802.1X**: 一种用于在网络上进行身份验证的 IEEE 标准。\n\n**AAA**:\
  \ 参见身份验证（authentication）、授权（authorization）和审计（accounting）。\n\n**可接受政策 (AUP)**: 一种向用户传达哪些计算机资源用途允许的政策。\n\
  \n**访问 (access)**：主体（如用户）对对象（如文件）执行特定操作的能力。典型的访问级别包括读取、写入、执行和删除。\n\n**访问控制 (access\
  \ control)**: 用于确定主体（如用户）对特定对象（如文件）拥有何种访问权限的机制或方法。\n\n\n\n\n\n# 安全术语表\n\n### 访问控制列表\
  \ (ACL)\n与对象（如文件）关联的列表，用于识别每个主体（如用户）拥有的访问级别——即他们对对象可以执行的操作（如读取、写入或执行）。\n\n### 接入点\n\
  无线接入点的缩写，允许设备连接到无线网络的设备。\n\n### 活动目录 (Active Directory)\nWindows 系统的目录服务部分，存储有关网络实体（如应用程序、文件、打印机和人员）的信息，并提供一种结构化、一致的方法来命名、描述、定位、访问和管理这些资源。\n\
  \n### ActiveX\n微软技术，用于促进丰富的互联网应用程序，从而扩展并增强 Microsoft Internet Explorer 的功能。与 Java\
  \ 类似，`ActiveX` 允许开发交互内容。当支持 ActiveX 的浏览器遇到包含不支持功能的网页时，它可以自动安装相应的应用程序以便使用该功能。\n\n\
  ### 地址解析协议 (ARP)\nTCP/IP 协议族规范中的协议，用于将 IP 地址映射到介质访问控制（MAC）地址。\n\n### 高级加密标准 (AES)\n\
  美国目前的对称加密标准，广泛应用于所有领域。\n\n### 256 位高级加密标准\n使用 256 位密钥的 `AES` 实现。\n\n### 广告软件\n一种广告支持型软件，在软件安装后或在使用程序期间会自动播放、显示或下载广告。\n\
  \n### AES\n*参见* 高级加密标准。\n\n### AES256\n*参见* 256 位高级加密标准。\n\n### 物理隔离 (air gap)\n\
  对网络进行强制分离，导致系统之间产生物理隔离。跨越隔离的通信需要手动将数据从一个网络移动到另一个网络，因为两个网络之间不存在网络连接。\n\n### 算法\n\
  一种逐步执行的程序——通常是为了在规定的步骤内解决问题的既定计算方法。\n\n### 年度预期损失 (ALE)\n根据损失的金额成本及其可能发生的频率，某事件预计为企业带来的年度成本。`ALE\
  \ = 单次损失预期 × 年发生率`。\n\n### 年发生率 (ARO)\n事件预计按年计算发生的频率。\n\n### 异常\n不符合预期模式的事物。\n\n\
  ### 应用程序\n旨在提供特定用户功能的程序或组，例如文字处理器或 Web 服务器。\n\n### 应用程序接口 (API)\n一组关于如何与计算机程序接口的指令，以便开发人员访问程序中定义的接口。\n\
  \n### 应用程序服务提供商 (ASP)\n为实体提供通过互联网访问应用程序和服务的公司。\n\n### ARP\n*参见* 地址解析协议。\n\n### 资产\n\
  组织开展业务所需的资源和信息。\n\n### 非对称加密\n组织开展业务所需的资源和信息。也称为密钥加密，使用两个密钥进行加密。\n\n### 审计跟踪\n一组记录或事件，通常按时间顺序排列，显示发生了什么。\n\
  \n### 审计\n用于验证已发生情况的操作或过程。\n\n### 身份验证\n验证主体身份的过程。\n\n### 认证、授权和审计 (AAA)\n登录时执行的三种常见功能。\n\
  \n### 认证头 (AH)\n`ipsec` 的一部分，提供身份验证服务。\n\n### 可用性\n“CIA”安全模型的一部分。可用性适用于硬件和软件。\n\n\
  ### 后门\n用于访问系统的隐藏方法。\n\n### 备份\n将数据复制并存储在与原始数据分开的次要位置。\n\n### 基准\n特定时间点的系统或软件状态。\n\
  \n### 基本输入/输出系统 (BIOS)\n提供硬件和软件之间接口的固件元件。\n\n### BGP\n*参见* 边界网关协议。\n\n### 生物识别\n\
  使用个人的独特特征（如指纹）来验证个人身份。\n\n### BIOS\n*参见* 基本输入/输出系统。\n\n### Blowfish\n由 Bruce Schneier\
  \ 开发的对称块密码的免费实现。它具有从 32 位到 448 位的变长方案。\n\n### 蓝牙漏洞 (bluebugging)\n使用支持蓝牙的设备通过他人的手机作为发射器监听他人的对话。\n\
  \n### 蓝牙攻击 (bluejacking)\n通过蓝牙向支持蓝牙的设备发送未经请求的消息。\n\n### 蓝牙窃 (bluesnarfing)\n通过蓝牙连接未经授权访问支持蓝牙设备的信息。\n\
  \n### 边界网关协议 (BGP)\n在网协议 (IP) 网络中实现的域间路由协议，用于实现自治系统之间的路由。\n\n### 僵尸网络\n独立且自动运行的软件机器人（或\
  \ *bots*）集合的术语。\n\n### 自带设备 (BYOD)\n用于描述用户将个人拥有的设备带入企业并集成到业务系统的环境。\n\n### 缓冲区溢出\n\
  一种特定的软件编码错误，允许用户输入溢出分配的存储区域并损坏运行中的程序。\n\n### 工业和安全局 (BIS)\n美国商务部下属部门，负责涵盖美国加密技术的出口管理条例。\n\
  \n\n\n\n\n# **业务连续性计划 (BCP)** 企业为了在重大中断时能够继续关键运营而制定的计划。\n\n# **业务影响分析 (BIA)** 对特定事件对业务影响的分析。\n\
  \n# **业务伙伴关系协议 (BPA)** 一种定义业务伙伴关系条款和条件的书面协议。\n\n# **BYOD** *参见* 自带设备 (bring your\
  \ own device)。\n\n# **cache** 使用前对信息的临时存储，通常用于加速系统。在互联网语境下，指在用户的 PC 或 Web 服务器上本地存储常用访问的网页、图形文件和其他内容。`cache`\
  \ 有助于减少下载时间并为频繁访问的网站预留带宽，同时有助于减轻 Web 服务器的负载。\n\n# **能力成熟模型 (CMM)** 一种结构化方法论，通过提供从随机过程到规范化软件管理过程的演进路径，帮助组织提高其软件过程的成熟度。由卡内基·梅隆大学的软件工程研究所开发。\n\
  \n# **集中化管理** 一种权限管理类型，将管理和维护权限与特权的权威和责任集中到一个组、一个位置或区域。\n\n# **CERT** *参见* 计算机应急响应小组\
  \ (Computer Emergency Response Team)。\n\n# **证书** 一个经过加密签名的对象，包含一个身份以及与该身份相关的公钥。`certificate`\
  \ 可用于建立身份，类似于公证过的书面文件。\n\n# **证书入注册协议 (CEP)** 最初由 VeriSign 为 Cisco 系统开发，旨在利用现有技术支持证书的颁发、分发和吊销。\n\
  \n# **吊吊列表 (CRL)** 一个数字签名的对象，列出了由特定认证权威机构颁发的所有当前但已吊销的证书。这允许用户验证证书是否仍然有效，即使其尚未过期。`CRL`\
  \ 类似于被盗刷的信用卡号列表，允许商店拒绝坏掉的信用卡。\n\n# **证书颁发机构 (CA)** 负责颁发和吊销证书的实体。`CAs` 通常与需要证书的公司无关，尽管它们也存在于公司内部使用（例如微软）。该术语也适用于提供这些服务的服务器软件。`certificate\
  \ authority` 与 `certification authority` 可以通用使用。\n\n# **监管链 (chain of custody)**\
  \ 用于记录、处理和保护证据的规则，以确保证据不会发生任何意外的变更。\n\n# **挑战握手身份验证协议 (CHAP)** 用于通过点对点协议 (`PPP`)\
  \ 在点对点链路上提供身份验证。\n\n# **变更（配置）管理** 一种在软件开发和运行期间执行并记录变更的标准方法论。\n\n# **变更控制委员会 (CCB)**\
  \ 负责监督变更过程并使管理层能够监督和协调项目的机构。\n\n# **CHAP** *参见* 挑战握手身份验证协议 (Challenge Handshake\
  \ Authentication Protocol)。\n\n# **安全 CIA** 指机密性、完整性和可用性，这是任何安全系统的基本功能。\n\n# **密码算法**\
  \ 一种加密系统，接受明文输入，然后根据其内部算法和密钥输出密文。\n\n# **密文** 用于表示加密算法的输出。`ciphertext` 是加密后的数据。\n\
  \n# **CIRT** *参见* 计算机应急响应小组 (Computer Emergency Response Team)。\n\n# **闭路电视 (CCTV)**\
  \ 一种私有电视系统，通常在安全应用中通过硬线连接以记录视觉信息。\n\n# **云计算** 跨网络按需自动配置计算资源。\n\n# **冷备地** 一种廉价的备用站点形式，始终不包含当前的数据集。`cold\
  \ site` 恢复运行系统所需的时间较长，但它比温备地或热备地便宜得多。\n\n# **碰撞** 用于哈希密码学分析，指算法从两组不同的数据产生相同哈希值的属性。\n\
  \n# **通用访问卡 (CAC)** 一种用于访问联邦计算机系统的智能卡，并可兼作身份证使用。\n\n# **计算机应急响应小组 (CERT)** 也称为计算机事件响应小组\
  \ (`CIRT`)，该小组负责调查和响应安全漏洞、病毒以及其他潜在的灾难性事件。\n\n# **计算机安全** 广义地说，用于确保计算机系统安全的方法、技术和工具。\n\
  \n# **计算机软件配置项** *参见* 配置项 (configuration item)。\n\n# **机密性** 安全 `CIA` 的部分。指一种安全原则，即信息不应泄露给未经授权的人员。\n\
  \n# **配置审核** 验证配置项是否根据需求、标准或合同协议进行构建和维护的过程。\n\n# **配置控制** 控制对已基准的项进行变更的过程。\n\n#\
  \ **配置识别** 识别哪些资产需要管理和控制的过程。\n\n# **配置项** 作为软件变更管理过程的一部分被识别和管理的数据和软件（或其他资产）。也称为\
  \ `computer software configuration item`。\n\n# **配置状态会计** 用于跟踪和维护基准中每个配置项相关数据的程序。\n\
  \n# **应急计划 (CP)** 创建在特殊情况下（应急情况）下使用的流程和程序的行为。\n\n# **业务连续性计划 (COOP)** 创建与继续关键运营相关的计划。\n\
  \n# **控制器区域网络** 一种用于车辆连接微控制器的总线标准。\n\n# **cookie** Web 服务器存储在用户计算机上的信息，用于维持与服务器连接的状态。主要用于在未来的请求中召回偏好或之前使用过的信息。\n\
  \n# **COOP** *参见* 业务连续性计划 (Continuity of Operations Planning)。\n\n# **密分组链消息认证协议计数模式\
  \ (CCMP)** 一种基于 AES 的 CBC-MAC 计数模式的增强数据加密机制，设计用于无线局域网。\n\n# **对措施** *参见* 安全控制 (security\
  \ control)。\n\n# **破解** 某些人指恶意黑客攻击，试图非法访问计算机系统或网络。*参见* 黑客攻击 (hacking)。\n\n# **CRC**\
  \ *参见* 循环冗余校验 (Cyclic Redundancy Check)。\n\n# **CRL** *参见* 吊销列表 (Certificate Revocation\
  \ List)。\n\n# **跨站请求伪造 (CSRF 或 XSRF)** 一种向系统发送恶意输入并依赖解析器和执行元素执行请求的操作，从而引发攻击的方法。`XSRF`\
  \ 利用网站对用户浏览器的信任。\n\n# **跨站脚本 (XSS)** 一种向系统输入发送脚本命令并依赖解析器和执行元素执行请求的脚本的操作，从而引发攻击的方法。`XSS`\
  \ 利用用户对网站的信任。\n\n# **密码分析学** 尝试破解加密系统的过程。\n\n# **密码学** 一种秘密写作的艺术，使个人能够向预期接收者之外隐藏消息或文件的内容。\n\
  \n# **循环冗余校验 (CRC)** 一种错误检测技术，使用一系列两个 8 位块检查字符来表示整个数据块。这些块检查字符被包含传输帧中，并在接收端进行检查。\n\
  \n\n\n\n\n### `DAC` *参见* 任意性访问控制 (Discretionary Access Control)。\n\n### `Data Encryption\
  \ Standard (DES)` 一种被政府采用用于保护敏感但非分类信息的私钥加密算法。通常用于三重 DES (Triple DES)，通过应用三轮加密提供更高的安全性。\n\
  \n### `Data Execution Prevention (DEP)` 操作系统的一种安全功能，可以由软件、硬件或两者共同驱动，旨在防止从内存数据块中执行代码。\n\
  \n### `Data Loss Prevention (DLP)` 用于检测何时发生从系统未经授权移除数据行为的技术、流程和程序。DLP 通常是主动的，通过阻止传输或断开连接来防止数据丢失。\n\
  \n### `datagram`（数据报文）一种可以在无连接模式下通过分组交换系统传输的数据包。\n\n### `decision tree`（决策树）一种数据结构，其中每个元素连接到其下方的一个或多个结构。\n\
  \n### `demilitarized zone (DMZ)` 存在于互联网和内部安全信任网络之间的半保护区的网络段。\n\n### `denial-of-service\
  \ (DoS) attack` 一种通过攻击手段剥夺授权用户访问系统、其资源、存储或处理的数据以及其连接的网络的攻击。\n\n### `DES` *参见* 数据加密标准\
  \ (Data Encryption Standard)。\n\n### `DHCP` *参见* 动态主机配置协议 (Dynamic Host Configuration\
  \ Protocol)。\n\n### `Diffie-Hellman` 一种在不安全介质上安全地建立共享密钥的加密方法。\n\n### `Diffie-Hellman\
  \ Ephemeral (DHE)` 一种使用临时密钥在不安全介质上安全地建立共享密钥的加密方法，以实现正向安全性。\n\n### `digital signature`（数字签名）一种基于密码学的产物，是公密钥基础设施\
  \ (PKI) 实现的关键组件。数字签名可用于证明身份，因为它是用公/私钥对中的私钥部分创建的。接收者可以解密签名，从而确认数据一定来自发送者且数据未被更改。\n\
  \n### `digital signature algorithm (DSA)` 一种用于实现数字签名的美国政府标准加密算法。\n\n### `direct-sequence\
  \ spread spectrum (DSSS)`（直接序列扩频）一种在多个频率上分发通信以避免干扰和检测的方法。\n\n### `disaster recovery\
  \ plan (DRP)`（灾难恢复计划）一种旨在解决组织如何应对自然或人为灾难的书面计划，以确保业务连续性。与业务连续性计划 (BCP) 的概念相关。\n\n\
  ### `discretionary access control (DAC)`（任意性访问控制）一种访问控制机制，对象（如文件）的所有者可以决定其他主体（如其他用户）可以访问该对象，以及这些对象拥有何种访问权限（读、写、执行）。\n\
  \n### `distributed denial-of-service (DDoS) attack`（分布式拒绝服务攻击）一种特殊的 DoS 攻击，攻击者诱导通常不愿配合的其他系统发起多对一的攻击。\n\
  \n### `diversity of defense`（防御多样性）通过创建不同的安全层的方法，使得能够突破一个层的入侵者在下一下一层将面对另一套完全不同的防御措施。\n\
  \n### `Domain Name Service (DNS)`（域名系统）一种将互联网域名（如 `www.mcgraw-hill.com`）翻译为 IP 地址的服务。\n\
  \n### `DRP` *参见* 灾难恢复计划 (disaster recovery plan)。\n\n### `DSSS` *参见* 直接序列扩频 (direct-sequence\
  \ spread spectrum)。\n\n### `dumpster diving`（翻垃圾桶）通过搜寻垃圾来发现被丢弃但未破坏或粉碎的敏感材料的行为。\n\
  \n### `Dynamic Host Configuration Protocol (DHCP)`（动态主机配置协议）一种互联网工程任务组 (IETF) 的互联网协议\
  \ (IP) 规范，根据网络适配器地址自动分配 IP 地址和其他配置信息。它实现了地址池化分配，并简化了 TCP/IP 的安装和管理。\n\n### `dynamic\
  \ link library (DLL)`（动态链接库）在 Microsoft Windows 环境使用的共享库函数。\n\n### `EAP` *参见* 扩展认证协议\
  \ (Extensible Authentication Protocol)。\n\n### `electromagnetic interference (EMI)`（电磁干扰）由于电磁场对电子设备产生的干扰或干扰。\n\
  \n### `elliptic curve cryptography (ECC)`（椭曲线密码学）一种基于有限域椭曲线结构的加密方法。\n\n### `elliptic\
  \ curve Diffie-Hellman Ephemeral (ECDHE)`（椭曲线临时迪菲-赫尔曼）一种使用 ECC 在不安全介质上安全地建立共享密钥的加密方法，实现正向安全性。\n\
  \n### `Encapsulating Payload (ESP)`（封装安全载荷）IPsec 的一部分，提供了数据机密性以及可选的认证和重放检测。\n\n\
  ### `Encrypted File System (EFS)`（加密文件系统）从 Windows 2000 开始的一种安全功能，对文件进行透明加密/解密。\n\
  \n### `escalation auditing`（权限提升审计）对普通用户获得管理员权限进行审计。\n\n### `evidence`（证据）在法庭上许可的文件、口头陈述和材料。\n\
  \n### `exposure factor`（暴露因素）衡量损失规模的指标。用于计算单次损失期望 (SLE)。\n\n### `Extensible Authentication\
  \ Protocol (EAP)`（扩展认证协议）一种用于无线网络和点点连接的通用认证框架。定义于 RFC 3748 并通过 RFC 5247 更新。\n\n\
  ### `Extensible Markup Language (XML)`（可扩展标记语言）一种基于文本、易读的数据语言。\n\n### `false positive`（误报）当安全系统发生错误并错误报告搜索对象存在时使用的术语。包括将良流量误认为敌性的入侵检测系统、在未感染软件中报告病毒的杀毒程序，或允许未经授权访问系统的生物识别系统。\n\
  \n### `FHSS` *参见* 跳频扩频 (frequency-hopping spectrum)。\n\n### `file system access\
  \ list (FACL)`（文件系统访问列表）文件系统中的访问控制实现。\n\n### `File Transfer Protocol (FTP)`（文件传输协议）一种用于通过网络传输文件的应用层协议。\n\
  \n### `File Transfer Protocol Secure (FTPS)`（安全文件传输协议）一种用于通过网络传输文件的应用层协议，使用了通过 SSL\
  \ 或 TLS 连接的 FTP。\n\n### `firewall`（防火墙）根据规则隔离流量的网络设备。\n\n### `flood guard`（洪水防护）阻止洪水型\
  \ DoS/DDoS 攻击的网络设备，通常是 IDS/IPS 的一部分。\n\n### `forensics (or computer forensics)`（取证或计算机取证）为了法律程序对数据的保护、识别、记录和解释。\n\
  \n### `free space`（空闲空间）操作系统可以使用的媒介区域。\n\n### `frequency-hopping spread spectrum\
  \ (FHSS)`（跳频扩频）一种在时间上通过多个频率分发通信以避免干扰和检测的方法。\n\n### `full disk encryption (FDE)`（全盘加密）对整个磁盘应用加密，在一个容器中保护所有内容。\n\
  \n### `Generic Routing Encapsulation (GRE)`（通用路由封装）一种隧道协议，旨在将各种网络层包封装在 IP 隧道包中。\n\
  \n### `Gnu Privacy Guard (GPG)`（GNU 隐私守护）一种遵循 OpenPGP 标准的加密程序。\n\n### `GPG` *参见*\
  \ Gnu 隐私守护 (Gnu Privacy Guard)。\n\n### `GPO` *参见* 组策略对象 (Group Policy object)。\n\
  \n### `Group Policy object (GPO)`（组策略对象）Windows 用于在企业范围内应用操作系统设置的方法。\n\n\n\n\n\n\
  # 黑客攻击 (hacking)\n媒体用于描述未经授权访问计算机系统和网络的过程术语。该术语也用于深入研究计算机系统和网络使用的代码及协议的过程。*参见* 破解\
  \ (cracking)。\n\n# 硬盘 (HDD)\n一种用于以磁性形式存储数字数据的机械设备。\n\n# 硬件安全模块 (HSM)\n一种用于保护但仍允许使用密钥的物理设备。它与主机分离。\n\
  \n# 哈希 (hash)\n一种加密形式，通过对输入算法的数据创建摘要。这些算法被称为单向算法，因为没有可行的方法可以解密已加密的内容。\n\n# 哈希值 (hash\
  \ value)\n*参见* 消息摘要 (message digest)。\n\n# 消息认证码 (HMAC)\n使用加密哈希函数和消息认证码来确保消息的完整性和真实性。\n\
  \n# HDD\n*参见* 硬盘。\n\n# 供暖、通风与空调 (HVAC)\n用于对建筑或结构的空气进行加热和冷却的系统。\n\n# HIDS\n*参见* 主机入侵检测系统。\n\
  \n# HIPS\n*参见* 主机入侵防御系统。\n\n# 蜜罐 (honeypot)\n一个用于吸引潜在入侵者的计算机系统或网络部分，以希望他们离开其他系统。由于该系统没有合法用户，任何访问该系统的尝试都是未经授权活动的迹象，并提供了一种识别攻击的简单机制。\n\
  \n# 主机入侵检测系统 (HIDS)\n一种通过监控一个或多个独立 PC 或服务器上的活动来寻找计算机入侵的系统。\n\n# 主机入侵防御系统 (HIPS)\n\
  一种通过监控一个或多个独立 PC 或服务器上的活动并根据规则集自动响应计算机入侵的系统。\n\n# 热备站点 (hot site)\n一个完全配置了设备和数据的备份站点，在运行系统发生故障时准备好立即接收操作处理的转移。\n\
  \n# HSM\n*参见* 硬件安全模块。\n\n# 超文本标记语言 (HTML)\n一种用于跨越 HTTP 标记文本的协议。\n\n# 超文本传输协议 (HTTP)\n\
  一种用于在互联网传输材料的协议，包含指向附加材料的链接。\n\n# 基于 SSL/TLS 的超文本传输协议 (HTTPS)\n一种用于在互联网传输材料的协议，包含通过\
  \ SSL 或 TLS 安全隧道传输的附加材料的链接。\n\n# ICMP\n*参见* 互联网控制消息协议。\n\n# 标识 (ID)\n认证过程的第一步，用户与认证系统建立一个秘密并绑定到用户名。\n\
  \n# IEEE\n*参见* 电气电子工程师学会。\n\n# IETF\n*参见* 互联网工程任务组。\n\n# 影响 (impact)\n漏洞被利用的结果，导致损失。\n\
  \n# 事件响应 (incident response)\n包含、分析和从事件中恢复的过程。\n\n# 信息安全 (information security)\n\
  通常与安全同义使用，但强调对信息的保护。\n\n# 基础服务 (IaaS)\n基础设施的按需提供。\n\n# 初始化向量 (IV)\n一种用于种子生成的的值。\n\
  \n# 即时消息 (IM)\n一种基于文本的通信方法。\n\n# 电气电子工程师学会 (IEEE)\n一家非营利性技术机构。\n\n# 无形资产\n难以确定。\n\
  \n# 完整性 (integrity)\n一种安全原则，即信息除非经授权方修改，否则信息不会被修改。\n\n# 互连安全 (ISA)\n双方之间的协议。\n\n\
  # 国际数据加密算法 (IDEA)\n一种对称算法。\n\n# 互联网分配机构 (IANA)\n用于分配唯一协议值的结算机构。\n\n# 互联网控制消息协议 (ICMP)\n\
  一种用于错误报告和状态消息的协议。\n\n# 互联网工程任务组 (IETF)\n一个网络设计师的大型国际社区。\n\n# 互联网消息协议版本 4 (IMAP4)\n\
  用于电子邮件检索常用的互联网标准之一。\n\n# 互联网协议 (IP)\n网络层协议。\n\n# 互联网协议安全 (IPsec)\n一种用于在传输期间保护 `IP`\
  \ 包的协议。它提供认证、完整性和机密性服务，并使用 `AH` 和 `ESP` 实现这些功能。\n\n# 互联网安全关联和密钥管理协议 (ISAKMP)\n一种定义密钥交换协议机制和安全策略协商的协议框架。\n\
  \n# 互联网服务供应商 (ISP)\n提供互联网访问服务的电信公司。\n\n# 入侵检测系统 (IDS)\n一种用于识别指示计算机安全漏洞的嫌疑、恶意或不良活动的系统。\n\
  \n### IPsec\n*参见* 互联网协议安全。\n\n# ISA\n*参见* 互连安全协议。\n\n# 密钥骨罗斯 (Kerberos)\n一种网络认证协议。\n\
  \n# 密钥 (key)\n在密码学中，算法用于加密或解密消息的字符或位序列。\n\n# 密钥发行中心 (KDC)\nKerberos 系统中用于认证的组件，负责密钥的安全分配。\n\
  \n# 密钥空间 (keyspace)\n特定加密算法的所有可能密钥的完整集合。\n\n# 二层隧道协议 (L2TP)\n一种运行在数据链路层上的交换协议。\n\
  \n# LDAP\n*参见* 轻量级目录访问协议。\n\n# 权限 (least privilege)\n一种安全原则，为用户提供执行所需功能所需的最小权利和权限。其目标是限制任何用户可能造成的潜在损害。\n\
  \n# 轻量级目录访问协议 (LDAP)\n一种用于跨 TCP/IP 网络访问目录服务的应用协议。\n\n# 轻量级扩展认证协议 (LEAP)\n思科在 802.11i\
  \ 之前开发的 EAP 版本，用于推动 802.1X 和 WEP 的采用。\n\n# 负载均衡器 (load balancer)\n一种在多台计算机之间分配计算的网络设备。\n\
  \n\n\n\n\n`local area network (LAN)` 局限于特定区域的网络结构中的计算机组，并使用特定的协议，例如用于 `OSI Layer\
  \ 2` 流量寻址的 `Ethernet`。\n\n`logic bomb` 逻辑炸弹，由特定事件或条件触发的恶意代码或软件形式。*参见*时间炸弹。\n\n`loop\
  \ protection` 防止在 `Layer 2` 层出现桥接环路的要求，这通常通过交换设备上的 `Spanning Tree` 算法解决。\n\n`MAC`\
  \ *参见*强制访问控制（mandatory access control）、介质访问控制（Media Access Control）或消息认证码（Message\
  \ Authentication Code）。\n\n`man-in-the-middle attack` 任何尝试将网络节点作为两个其他节点之间媒介的攻击。每个终端节点都认为自己正在与对方直接通信，但实际上它们都在与中间节点通信。\n\
  \n`mandatory access control (MAC)` 一种强制访问控制机制，其中安全机制控制对所有对象（文件）的访问，且单个主体（进程或用户）无法更改该访问权限。\n\
  \n`master boot record (MBR)` Windows 系统中硬盘上的一段数据，用于实现特定的初始功能或标识。\n\n`maximum transmission\
  \ unit (MTU)` 衡量特定协议在特定实例的单个数据包中能够携带的最大负载的指标。\n\n`MD5` 消息摘要 5，一种哈希算法以及产生消息摘要特定方法。\n\
  \n`mean time between failure (MTBF)` 平均故障间隔，通过统计确定的系统故障之间的时间段。\n\n`mean time to\
  \ failure (MTTF)` 平均失效时间，通过统计确定的下一次故障发生的时间。\n\n`mean time to repair (MTTR)` 平均修复时间，衡量修复给定故障所需时间的常用标准。这是平均时间，可能包含也不包含获取所需的时间。\n\
  \n`Media Access Control (MAC)` 介质访问控制，用于数据链路层本地网络寻址的协议。\n\n`memorandum of understanding\
  \ (MOU)` 谅解备录，双方之间签署的定义某种形式协议的文档。\n\n`message authentication code (MAC)` 消息认证码，用于验证消息身份的短数据。*参见*哈希消息认证码。\n\
  \n`message digest` 消息摘要，对数据应用哈希函数的结果。有时称为哈希值。*参见*哈希。\n\n`metropolitan area network\
  \ (MAN)` 城域网，在城市范围内互连的网络集合，并通常连接到互联网。\n\n`Microsoft Challenge Handshake Authentication\
  \ Protocol (MSCHAP)` 微软开发的 `Challenge Handshake Authentication Protocol (CHAP)`\
  \ 变体。\n\n`mitigation` 缓解，为减少威胁发生的可能性而采取的行动。\n\n`Monitoring as a Service (MaaS)`\
  \ 监控即，利用第三方提供安全监控服务。\n\n`MSCHAP` *参见*微软挑战响应认证协议。\n\n`MTBF` *参见*平均故障间隔。\n\n`MTTF`\
  \ *参见*平均失效时间。\n\n`MTTR` *参见*平均修复时间。\n\n`NAC` *参见*网络访问控制（Network Access Control）。\n\
  \n`NAP` *参见*网络访问保护（Network Access Protection）。\n\n`NAT` *参见*网络地址转换（Network Address\
  \ Translation）。\n\n`National Institute of Standards and Technology (NIST)` 美国国家标准与技术研究院，负责标准和技术的美国政府机构。\n\
  \n`NDA` *参见*保密协议（non-disclosure agreement）。\n\n`near field communication (NFC)`\
  \ 近场通信，一组用于在极短距离内建立链路的标准和协议。用于移动设备。\n\n`Network Access Control (NAC)` 网络访问控制，一种终端安全方法，涉及在允许对象连接到网络之前监控并修复终端安全问题。\n\
  \n`Network Access Protection (NAP)` 微软的一种网络访问控制方法。\n\n`Network Address Translation\
  \ (NAT)` 网络地址转换，在网关点对网络数据包进行重新路由的方法，以便使用本地不可路由的 IP 地址。\n\n`network-based detection\
  \ system (NIDS)` 网络入侵检测系统，通过检查流量来识别可疑、恶意行为的系统。\n\n`network-based prevention system\
  \ (NIPS)` 网络入侵防御系统，对入侵做出响应的系统。\n\n`Network Basic Input/Output System (NetBIOS)`\
  \ 网络基本输入输出系统，支持用户环境的系统。\n\n`network operating system (NOS)` 网络操作系统，用于网络的操作系统。\n\n\
  `Network Time Protocol (NTP)` 网络时间协议，用于时间同步传输的协议。\n\n`New Technology File System\
  \ (NTFS)` 新技术文件系统，微软于 1993 年开发的专用文件系统，支持多种操作。\n\n`New Technology LANMAN (NTLM)`\
  \ 新技术 LANMAN，一种提供身份认证的安全套件。\n\n`NFC` *参见*近场通信。\n\n`NIST` *参见*美国国家标准与技术研究院。\n\n`non-disclosure\
  \ agreement (NDA)` 保密协议，双方之间的法律合同，详细说明了每个伙伴承担的限制和要求。\n\n`non-repudiation` 不否认性，验证操作是由特定人员执行的能力。\n\
  \n`Oakley protocol` Oakley 协议，一种密钥交换协议，定义了如何基于 Diffie-Hellman 算法获取认证密钥材料。\n\n`object\
  \ reuse` 对象重用，将之前使用过的介质分配给主体。\n\n`one-time pad (OTP)` 密码，一种不可破解的加密方案，使用一组不重复的随机位作为密钥来加密消息。由于每个密码只使用一次，因此无法建立模式。\n\
  \n`Online Certificate Status Protocol (OCSP)` 在线证书状态协议，用于请求数字证书的撤销状态。这是证书列表的替代方案。\n\
  \n`Open Vulnerability and Assessment Language (OVAL)`一种基于 XML 的标准，用于工具和业务之间安全信息的通信。\n\
  \n`operating system (OS)` 操作系统，处理输入、输出、显示、内存管理以及所有支持用户环境和相关应用程序的高度细节任务的基础软件。\n\n\
  `OVAL` *参见*开放漏洞与评估语言。\n\n`PAC` *参见*代理自动配置（Proxy Auto Configuration）。\n\n`Packet\
  \ Capture (PCAP)` 数据包捕获，以文本文件形式采集网络流量的方法和文件。\n\n`PAM` *参见*可插身份模块（Pluggable Authentication\
  \ Modules）。\n\n*pan-tilt-zoom (PTZ)` 云台摄像机，用于描述支持远程方向和缩放控制的摄像机的术语。\n\n`password`\
  \ 密码，用于向系统或对象证明个人身份的字符字符串。与用户 ID 配合是最常用的身份验证方法。密码应由所有者保守。\n\n`Password Authentication\
  \ Protocol (PAP)` 密码认证协议，用于向网络访问服务器验证用户的简单协议。\n\n`Password-Based Key Derivation\
  \ Function 2 (PBKDF2)` 基于密码的密钥派生函数 2，RSA 实验室公密钥密码标准的一部分，作为 IETF RFC 2898 发布。\n\n\
  `patch` 补丁，一组旨在修正现有软件问题或漏洞的替换代码。\n\n`PBX` *参见*私分交换机（private branch exchange）。\n\n\
  \n\n\n\n- `peer-to-peer (P2P)`: 一种涉及点与点直接连接的网络连接方法。\n- `penetration testing`: 一种安全测试，通过尝试绕过安全控制来发现漏洞和弱点。也称为渗透测试（pen\
  \ test）。\n- `permissions`: 主体对对象可以执行的授权操作。*另参阅访问控制（access controls）。*\n- `personal\
  \ electronic device (PED)`: 用于描述由用户拥有并带入企业、使用企业数据的电子设备的术语。这包括但不限于笔记本电脑、平板电脑和手机手机。\n\
  - `Personal Identity Verification (PIV)`: 用于安全识别联邦工作人员身份的策略、程序、硬件和软件。\n- `personally\
  \ identifiable information (PII)`: 可用于识别单个个人的信息。\n- `phreaking`: 媒体中用于指对与电话公司相关的计算机系统和网络进行黑客攻击（电讯黑客）。*另参阅破解（cracking）。*\n\
  - `Plain Old Telephone Service (POTS)`: 用于描述旧模拟电话服务以及后来的“陆地”数字电话服务的术语。\n- `plaintext`:\
  \ 在密码学中指未加密的数据。它也可以指输入加密算法并输出密文的数据。\n- `Pluggable Authentication Modules (PAM)`:\
  \ Linux 系统中用于将低级身份验证方法集成到 API 中的机制。\n- `Point-to-Point Protocol (PPP)`: 一种在串行线路（如拨号连接）上传输\
  \ IP 数据包的 Internet 标准。\n- `Point-to-Point Protocol Extensible Authentication Protocol\
  \ (EAP)`: PPP 的扩展协议，为 `PPP` 内部的身份验证方法提供支持。\n- `Point-to-Point Protocol Password\
  \ Authentication Protocol (PAP)`: PPP 的扩展协议，在 `PPP` 上提供对密码认证的支持。\n- `Point-to-Point\
  \ Tunneling Protocol (PPTP)`: 在 `PPP` 上使用通用封装来创建一种用于虚拟网络的方法。\n- `Port Address Translation\
  \ (PAT)`: 在网络中的某点对 IP 数据报文中的端口信息进行处理，以类似于网络地址转换（NAT）更改地址的方式来映射端口。\n- `pre-shared\
  \ key (PSK)`: 之前在双方之间共享的共享密钥，用于建立安全通道。\n- `Pretty Good Privacy (PGP)`: 一种流行的加密程序，能够对电子邮件和文件进行加密和签名。\n\
  - `preventative intrusion detection`: 一种检测敌对行为或网络活动并防止其影响系统的系统。\n- `privacy`: 保护个人信息免受未经授权查看的人员。\n\
  - `private branch exchange (PBX)`: 服务于特定业务或实体的电话交换机。\n- `privilege auditing`: 检查分配给账户或账户组的权利和权限的过程。\n\
  - `privilege management`: 限制用户与计算机交互能力的过程。\n- `Protected Extensible Authentication\
  \ Protocol (PEAP)`: 由 Cisco、Microsoft 和 RSA 开发的 `EAP` 保护版本，通过在隧道中封装 `EAP` 帧起作用。\n\
  - `Proxy Auto Configuration (PAC)`: 一种自动化 浏览器连接到代理服务以获取特定 URL 的。\n- `PSK`: *另参阅共享密钥（pre-shared\
  \ key）。*\n- `PTZ`: *另参阅云台摄像（pan-tilt-zoom）。*\n- `public key cryptography`: *另参阅非对称加密（asymmetric\
  \ encryption）。*\n- `public key infrastructure (PKI)`: 通过受信任机构将公钥绑定到已知用户的基础设施。\n\
  - `qualitative risk assessment`: 主观确定影响项目、程序或业务的事件影响的过程。它涉及专家判断、经验或小组共识的使用。\n- `quantitative\
  \ risk assessment`: 客观确定影响项目、程序或业务的事件影响的过程。它涉及使用指标和模型完成评估。\n- `RADIUS`: 远程认证拨入服务，一种提供身份验证服务的标准协议。通常用于拨号、无线环境。\n\
  - `RAID`: *另参阅冗余磁盘阵列（Redundant Array of Disks）。*\n- `rapid application development\
  \ (RAD)`: 一种有利于使用快速原型和变化的软件开发方法。\n- `RAS`: *另参阅远程访问服务（Remote Access Service）。*\n\
  - `RBAC`: *另参阅基于角色的访问控制（role-based access control）或基于规则的访问控制。*\n- `RC4`: 一种在 `TLS`\
  \ 中使用的流密码。\n- `Real-time Transport Protocol (RTP)`: 一种用于 IP 网络上携带音频视频流量的标准数据包格式。\n\
  - `Recovery Agent (RA)`: Microsoft Windows 环境中，使用特殊私钥加密文件系统 (`EFS`)）。\n- `recovery\
  \ point objective (RPO)`: 业务愿意承担的数据量。\n- `recovery time objective (RTO)`: 业务在产生不可接受的数据丢失前恢复过程的时间。\n\
  - `risk`: 遭受损失的可能性。\n- `risk assessment or risk analysis`: 分析环境以识别威胁、漏洞和缓解措施，从而确定（定量或定性）影响项目、程序或业务的事件影响的过程。\n\
  - `risk management`: 识别威胁和漏洞及其潜在影响、确定缓解此类事件的成本，并决定采取哪些成本效益措施来控制这些风险的整体决策过程。\n\n\n\
  \n\n\n# 安全哈希算法 (SHA)\n一种用于分块数据哈希的算法。第一个版本是 `SHA1`，后续版本详细介绍了哈希摘要长度：`SHA256`、`SHA384`\
  \ 和 `SHA512`。\n\n# 安全超文本传输协议 (SHTTP)\nHTTPS 的替代方案，仅对传输的页面和 POST 字段进行加密。由于 HTTPS\
  \ 的广泛采用，很大程度上已被淘汰。\n\n# 安全/多功能互联网邮件扩展 (S/MIME)\n`MIME`（多功能互联网邮件扩展）协议规范的加密实现。\n\n\
  # 安全外壳 (SSH)\n一组用于建立到计算机安全远程连接的协议。该协议要求连接的两端都有一个客户端，并可以使用多种加密协议。\n\n# 安全外壳文件传输协议\
  \ (SFTP)\n与安全外壳协议（`SSH`）相关的安全传输传输系统。\n\n# 安全套接层 (SSL)\nOSI 模型会话层与传输层之间的加密层，旨在加密传输层以上的内容，实现主机之间的安全会话。\n\
  \n# 安全断言标记语言 (SAML)\n一种基于 XML 的用于交换身份验证和授权数据的标准。\n\n# 安全关联 (SA)\n应用于特定数据流的安全策略和密钥材料的实例。`IKE`\
  \ 和 `IPsec` 都使用 `SAs`，尽管这些 `SAs` 彼此是独立的。`IPsec` `SAs` 是单向的，且在每个安全协议是唯一的，而 `IKE`\
  \ `SAs` 是双向的。受保护的数据管道需要一组 `SAs`，每个协议每个方向需要一个。`SAs` 通过目的地址（`IPsec` 终点）、安全协议（`AH`\
  \ 或 `ESP`）和安全参数索引（`SPI`）进行唯一标识。\n\n# 安全基线\n建立信息系统安全状态过程的最终结果。它是一种已知的配置，能够抵抗攻击和信息泄露。\n\
  \n# 安全内容自动化协议 (SCAP)\n一种使用特定协议和数据交换来自动确定跨系统或多个系统的漏洞管理、测量和策略合规性的判定的方法。\n\n## 安全控制\n\
  一组技术性的、管理或操作性的策略和程序，旨在实现特定的安全功能。访问控制就是安全控制的一个示例。\n\n# 安全信息和事件管理 (SIEM)\n用于广泛技术解决方案的名称，用于收集和分析整个企业范围的安全相关信息。\n\
  \n# 职责分离或分工\n一种基本的控制措施，通过将责任分配给不同个人来防止或检测错误和违规行为，使任何个人都无法实施欺诈或恶意行为。\n\n# 服务水平协议\
  \ (SLA)\n双方之间关于系统预期或约定运行时间的的协议。\n\n# 服务集标识符 (SSID)\n用于标识特定的 `802.11` 无线网络。它传输有关无线客户端正在连接的访问点的信息。\n\
  \n# 屏蔽双绞线 (STP)\n一种物理网络连接，由两根扭绞并覆盖屏蔽层的电线组成，以防止干扰。\n\n# 短信服务 (SMS)\n一种通过电话和移动电话电路发送文本消息的形式，允许多达\
  \ 160 个字符的消息通过信令信道传输。\n\n# 签名数据库\n一组已识别并分类的活动模式集合，这些模式通常指示可疑或恶意活动。\n\n# 简单证书注册协议\
  \ (SCEP)\n一种在 `PKI` 中用于注册和其他服务的协议。\n\n# 简单邮件传输协议 (SMTP)\n用于在主机之间传输电子邮件的标准互联网协议。\n\
  \n# 简单网络管理协议 (SNMP)\n一种用于远程管理跨网络网络设备的标准协议。\n\n# 简单对象访问协议 (SOAP)\n一种基于 Web 服务的 XML\
  \ 规范。\n\n# 单次损失期望 (SLE)\n威胁发生的货币损失或影响 `SLE = 资产价值 × 暴露因素`。\n\n# 单点登录 (SSO)\n一种允许用户输入一次\
  \ ID 和密码即可访问资源的身份验证过程。\n\n# 空隙空间\n磁盘上未使用的空间（如 `扇区`）。\n\n# SMS\n见 短信服务。\n\n# 嗅探器\n\
  用于观察通过网络传输流量的软件或硬件设备。\n\n# 社会工程学\n通过欺骗他人使其泄露机密的艺术。这通常通过伪装成有权访问该信息的个人来实现。\n\n###\
  \ 软件即服务 (SaaS)\n按需提供的软件。\n\n# 软件开发生命周期方法 (SDLM)\n用于开发软件的过程和程序。有时被称为安全开发生命周期。\n\n\
  # 固态硬盘 (SSD)\n一种由电子存储组成的质量存储设备，相对于物理硬盘器。\n\n# 数字光纤 (SONET)\n见 同步网络技术。\n\n# 垃圾邮件\n\
  未经接收者请求的、具有商业性质的电子邮件。也称为 `UCE`。\n\n# 垃圾过滤器\n在进入邮件服务器之前过滤垃圾邮件的安全设备。\n\n# Spim\n通过即时消息通道发送的垃圾邮件。\n\
  \n### 伪装\n使数据看起来源自另一个源，以隐藏真实的来源。\n\n# SSD\n见 固态硬盘。\n\n# 存储网络 (SAN)\n提供数据数据的专用网络。\n\
  \n# STP\n见 屏蔽双绞线。\n\n# 结构化异常处理 (SEH)\n用于处理 Windows 核心函数异常的方法。\n\n# 结构化查询语言 (SQL)\n\
  用于关系数据库查询的语言。\n\n# 用户模块 (SIM)\n安全存储国际用户标识 (`IMSI`) 以及用于识别和认证手机用户密钥的集成电路或硬件元件。\n\n\
  # 采集与数据采集 (SCADA)\n用于连接基础设施要素（如制造工厂、油气管道、发电和配电系统等）与计算机系统的控制网络通用术语。\n\n# 对称加密\n需要所有方都拥有密钥副本的加密方式，有时称为共享密钥。同一个密钥用于加密和解密。\n\
  \n# 同步网络技术 (SONET)\n用于光网络数据传输的一系列标准。\n\n# 有形资产\n可以确定货币等值的资产。例如库存、建筑、现金、硬件、软件等。\n\
  \n### Telnet\n一种用于通过 `TCP` 提供明文双向通信的网络协议。\n\n# 密钥完整性协议 (TKIP)\n用于 `802.11` 无线网络的安全协议。\n\
  \n# 终端访问控制系统+ (TACACS+)\n一种使用 `RFC 1492` 定义的 `TACACS+` 协议和 `TCP` 端口 49 的远程认证系统。\n\
  \n# 威胁\n任何可能损害资产的情况或事件。\n\n# 黄金票据 (TGT)\n`Kerberos` 身份验证系统的一部分，用于在请求服务票据时证明身份。\n\
  \n\n\n\n\n# **基于时间的一次性密码 (TOTP)** 一种使用一次且仅在特定时间段内有效的密码。\n\n**定时炸弹 (time bomb)**\
  \ 逻辑炸弹的一种，其触发事件是日期或特定时间。*另参见*逻辑炸弹。\n\n**TKIP** *参见* 临时密钥完整性协议 (Temporal Key Integrity\
  \ Protocol)。\n\n**令牌 (token)** 可以在挑战-响应认证过程中使用的硬件设备。\n\n**事务签名 (TSIG)** 一种用于 DNS\
  \ 更新期间作为动态 DNS 记录认证手段的协议。\n\n**传输控制协议/网际协议 (TCP/IP)** 一种用于 IP 网络上通信的面向连接的协议。\n\n\
  **传输层安全 (TLS)** 一种作为 Internet 标准提出的新型 SSL 形式。\n\n**后门 (trapdoor)** *参见* 陷门 (backdoor)。\n\
  \n**简易文件传输协议 (TFTP)** FTP 的简化版本，用于通过 UDP 端口 `69` 进行低开销文件传输。\n\n**木洛马 (Trojan horse)**\
  \ 恶意代码的形式，表面上提供某项服务（可能确实提供了该服务），但隐藏了另一个目的。这个隐藏目的通常具有恶意意。这种代码也可以被简单地称为*木马 (Trojan)*。\n\
  \n**信任平台模块 (TPM)** 用于用于启用信任计算平台操作的硬件芯片。\n\n**统一可扩展固件接口 (UEFI)** 一种定义操作系统与硬件固件之间接口的规范。它是\
  \ BIOS 的替代品。\n\n**统一威胁管理 (UTM)** 为了提高效率，将多个网络安全产品聚合到单一设备中。\n\n**统一资源标识符 (URI)**\
  \ 一组用于识别计算机系统中资源名称的字符。URL 是 URI 的一种形式。\n\n**不间断电源 (UPS)** 一种电源（通常是电池），旨在在临时断电时为计算机系统提供不间断的电源。\n\
  \n**通用资源定位符 (URL)** 用于指向 Internet 上特定项目的特定字符字符串。\n\n**通用串行线 (USB)** 一种通过标准连接器电缆与外围设备进行通信的行业标准协议。\n\
  \n**非屏蔽双绞线 (UTP)** 一种由形成电路的对扭绞线组成的物理连接。\n\n**使用审计 (usage auditing)** 记录信息系统中谁在何时做了什么操作的过程。\n\
  \n**用户验收测试 (UAT)** 将验收测试标准应用于应用程序，以根据最终用户需求确定其适用性。\n\n**用户数据报协议 (UDP)** `TCP/IP`\
  \ 协议族中用于传输层的协议，它不对数据包进行排序——其本质上是“发后即不管”。\n\n**用户 ID (user ID)** 唯一的字母数字标识符，用于识别登录或访问系统的个人。\n\
  \n**吸血鬼头 (vampire tap)** 一种在不中断连接的情况下连接到网络线路的分接器。\n\n**视频会议 (VTC)** 一种使用视频信号在不同位置之间传输音频和视觉信号的业务流程，从而允许参与者通过虚拟会议见面，而不是旅行到物理位置。在光线和背景得到控制的情况下，现代视频会议设备可以提供非常真实的连接。\n\
  \n**虚拟局域网 (VLAN)** 交换系统内部的广播域。\n\n**虚拟专用网络 (VPN)** 跨越另一个网络的加密网络连接，在公共介质上提供私有通信通道。\n\
  \n**虚拟桌面基础设施 (VDI)** 使用服务器托管虚拟桌面，通过将处理过程移动到服务器并将桌面机仅作为显示终端。VDI 提供了运营效率以及成本和安全方面的收益。\n\
  \n**病毒 (virus)** 一种恶意代码或软件的形式，它附着在其他代码上以进行复制。病毒可能包含载荷，即部分设计在满足某些条件（例如在特定日期）时执行的代码。这种载荷通常上是恶意的。\n\
  \n**IP 语音 (VoIP)** 通过网际协议对语音信号（电话）进行分组包传输。\n\n**漏洞 (vulnerability)** 资产中的弱点，可以被威胁利用以造成伤害。\n\
  \n**无线接入点 (WAP)** 一种促进无线设备连接到网络的接入设备。\n\n**战争拨号 (war dialing)** 攻击者试图通过电话系统和调制解调器发现不受保护的系统连接，以获得对计算机系统或网络的未经授权访问。\n\
  \n**战争驱动 (war driving)** 攻击者试图通过携带无线设备漫游（或开车）寻找可用的无线接入点来发现不受保护的无线网络。\n\n**Web 应用程序防火墙\
  \ (WAF)** 一种运行在应用程序级别的防火墙，专门设计通过检查应用栈级别的请求来保护 Web 应用程序。\n\n**WEP** *参见* 有线等加密 (Wired\
  \ Equivalent Privacy)。\n\n**广域网 (WAN)** 跨越大地理区域的网络。\n\n**Wi-Fi 保护/Wi-Fi 保护 2 (WPA/WPA2)**\
  \ 一种使用 `802.11i` 标准子集来保护无线通信的协议。\n\n**Wi-Fi 安全设置 (WPS)** 一种允许轻松设置无线家庭网络的安全标准。\n\n\
  **有线等加密 (WEP)** 用于尝试在 `802.11` 网络上提供机密性和数据完整性的加密方案。\n\n**无线应用协议 (WAP)** 一种向手机手机等小型手持设备传输数据的协议。\n\
  \n**无线入侵检测系统 (WIDS)** 一种建立用于覆盖无线网络的入侵检测系统。\n\n**无线入侵预防系统 (WIPS)** 一种建立用于覆盖无线网络的入侵预防系统。\n\
  \n**无线传输层安全 (WTLS)** 在 `WAP` 网络上使用的加密协议。\n\n**蠕虫 (worm)** 一种独立的恶意代码或软件，它能自我复制。与病毒不同，它不需要附着在其他代码上。蠕虫通过侵入另一个系统并在新系统上创建副本来完成复制。蠕虫可以包含破坏性载荷，但并非必须。\n\
  \n**X.509** 数字证书的标准格式。\n\n**XML** *参见* 可扩展标记语言 (Extensible Markup Language)。\n\n\
  **XOR** 位异或运算，常用于密码学。\n\n**XSRF** *参见* 跨站请求伪造 (cross-site request forgery)。\n\n\
