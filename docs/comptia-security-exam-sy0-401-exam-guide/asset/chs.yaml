  \ Hellman）于 1976 年创建。该协议是目前最常用的加密协议之一。它在安全套接层 (`SSL`) 协议的电子密钥交换方法中起着作用。它也被 `SSH`\
  \ 和 `IPsec` 协议使用。Diffie-Hellman 之所以重要是因为允许两个此前没有联系过的人共享秘密密钥。\n\nDiffie-Hellman 密钥交换有几种变体。临时\
  \ Diffie-Hellman (`EDH`) 是一种变体，它在密钥交换中使用临时密钥，而不是反复使用同一个密钥。这样做是为了创建完美前向安全性，这是第 23\
  \ 章中涵盖的一个理想属性性。椭圆曲线 Diffie-Hellman (`ECDH`) 是 `Diffie-Hellman` 协议的一种变体，使用了椭圆曲线密码学。`ECDH`\
  \ 也可以配合临时密钥使用，变为椭圆曲线 Diffie-Hellman 临时 (`ECDHE`)，以实现完美前向安全性。\n\n* * *\n\n![image](img/examtip.jpg)\n\
  \n**考试提示** Diffie-Hellman 是密钥交换的金标准，对于考试，您应该理解 `DH`、`EDH`、`ECDH` 和 `ECDHE` 形式之间的微妙区别。\n\
  \n### ECC\n\n椭圆曲线密码学 (`ECC`) 在第 23 章中详细介绍过。从使用的角度来看，需要注意的是 `ECC` 非常适合计算能力有限的平台，例如移动设备。\n\
  \n椭圆曲线系统的安全性受到了质疑，主要是因为缺乏分析。然而，所有的公钥系统都依赖于某些数学问题的困难性。任何上述系统若要被大幅削弱，都需要数学上的突破，但已经对这些问题进行了研究，并表明，椭圆曲线问题对增量进展更具抵抗力。同样，与所有的加密算法一样，只有时间才能证明它们到底有多安全。`ECC`\
  \ 系统的巨大优势是对于给定的位强度，它们所需的计算能力较少。这使得 `ECC` 成为低功耗移动设备的理想选择。移动连接的激增带来了使用 `ECC` 和 `AES`\
  \ 算法保护用户数据的语音、电子邮件和短信应用程序。\n\n* * *\n\n![image](img/examtip.jpg)\n\n**考试提示** 确保你理解考试所需的非对称算法\
  \ `RSA`、`ECC` 和 Diffie-Hellman 变体。\n\n### 加密应用\n\n一些应用程序可以方便地在个人计算机上加密数据。这些程序代表了广泛的独立加密应用。列表的一个值得注意的例外是\
