  \n### 目标地图：考试 SY0-401\n![image](img/t0xli-01.jpg)\n![image](img/t0xlii-01.jpg)\n\
  \n* *\n\n## 第一部分\n\n* *\n\n### 网络安全\n![image](img/square.jpg)**第 1 章** 网络设备配置\n\
  ![image](img/square.jpg)**第 2 章** 安全网络管理\n![image](img/square.jpg)**第 3 章** 安全网络设计\n\
  ![image](img/square.jpg)**第 4 章** 安全无线网络\n\n* *\n\n## 第 1 章\n\n* *\n\n## 网络设备配置\n\
  在本章中，你将：\n\n- 在网络设备上实施安全配置参数\n- 在其他技术上实施安全配置参数\n\n* *\n\n网络由设备组成，并通过软件配置以执行操作。设备的正确配置是安全基础设施的关键要素。适当的配置有助于安全态。学习如何正确配置网络设备对于通过\
  \ `CompTIA Security+` 考试至关重要。\n\n### 网络设备\n在今天的商业环境中，完整的网络计算机解决方案不仅包括客户端和服务器。设备用于连接客户端和服务器并调节它们之间的流量。还需要设备将这种网络从简单的客户端和服务器扩展到包括其他设备和手持系统。设备有多种形式和功能，从集线器、交换机到路由器、无线访问点以及专用的\
  \ VPN 设备。每个设备都有特定的网络功能，并在维护网络基础设施安全方面发挥作用。\n\n* *\n\n![image](img/examtip.jpg)\n\
  \n**EXAM TIP** 预计会有关于如何在网络设备上实施安全配置参数的问题。\n\n### 防火墙\n防火墙可以是硬件、软件或者的结合，其目的是跨网络连接执行一组安全策略。它非常像带窗户的墙：墙的作用是将东西挡在外面，除非通过窗户允许（参见图\
  \ 1-1）。网络安全策略就像窗玻璃；它们允许某些东西通过（如光），同时阻止其他东西（如空气）。防火墙的核心是它执行的安全策略集。管理层决定了设备之间允许的网络流量，这些策略被用于构建用于过滤网络流量的防火墙设备的规则集。\n\
  \n![image](img/f0004-01.jpg)\n\n* *\n\n**图 1-1** 防火墙的工作原理\n\n\n\n\n\n`Security policies`\
  \ 是定义哪些流量是被允许的、哪些流量应该阻止或拒绝的规则。这些规则并非通用的，对于具有多个连接的单一公司，会创建许多不同的规则集。例如，连接到互联网的 Web\
  \ 服务器可能配置为仅允许端口 `80` 上的 HTTP 流量，并阻塞所有其他端口。电子邮件服务器可能只开放电子邮件所需的必要端口，而阻塞其他端口。网络防火墙可以编程为阻止除端口\
  \ `80` 流量以外的所有指向 Web 服务器的流量，并阻止除端口 `25` 流量以外的所有指向邮件服务器的流量。通过这种方式，防火墙充当了安全过滤器，通过机器、端口以及在某些情况下基于应用层细节来实现对网络流量的控制。防火墙设置安全策略的关键与其他安全策略相同——**最小权限原则**。仅允许某功能所需的必要访问；阻止或拒绝所有不需要的功能。公司部署防火墙的方式决定了每个防火墙安全策略所需的内容。\n\
  \n正如后文将讨论的，安全拓扑结构将决定在网络的何种节点使用哪些网络设备。至少，公司到互联网的连接应该通过防火墙。该防火墙应阻止所有非公司专门授权的网络流量。阻塞端口上的通信非常简单——只需告诉防火墙关闭该端口即可。问题在于决定需要哪些服务以及由谁需要，从而决定哪些端口应该开启，哪些应该关闭。这就是安全策略变得实用的原因。防火墙完美的网络安全策略集是终端用户永远看不见的，且绝不允许即使是一个未经授权的数据包进入网络。就像任何其他完美事物一样，在企业中很难找到完美的防火墙安全策略集。在开发防火墙规则时，最好使用最小权限原则；你希望防火墙尽可能阻挡流量，同时允许授权的流量通过。\n\
  \n要制定一个完整且全面的安全策略，首先需要对你的网络资源及其用途有一个完整全面的理解。一旦你知道网络将如何被使用，你就会知道允许什么。此外，一旦你了解你需要保护什么，你就会知道应该阻止什么。防火墙的设计是在攻击到达目标机器之前将其拦截。常见目标是\
  \ Web 服务器、电子邮件服务器、DNS 服务器、FTP 服务和数据库。这些每项都有独立的功能，且各有独特的漏洞。一旦你决定了谁应该接收什么类型的流量以及应该阻止哪些类型，就可以通过防火墙进行管理。\n\
  \n## 防火墙是如何工作的？\n\n防火墙通过多种机制执行已建立的安全策略，包括以下机制：\n\n-   网络地址翻译 (NAT)\n-   基础数据包过滤\n\
  -   状态检测数据包过滤\n-   访问控制列表 (ACLs)\n-   应用层代理\n\n防火墙提供的最基本的安全功能之一是 `NAT`，它允许你从网络外部屏蔽（mask）大量信息。这允许外部实体与防火墙内部的实体通信，而无需真正知道其地址。`NAT`\
  \ 是 `IPv4` 中用于将私有 IP 地址映射到公共 IP 地址的技术。私有 IP 地址是任何人都可以使用的 IP 地址集，根据定义，它们在互联网上是不可路由的。`NAT`\
  \ 可以通过防止在通过 `NAT` 设备更改地址之前从公司外部直接访问设备来协助安全。这样做的好处是需要更少的公共 IP 地址，从安全角度来看，内部地址结构对外部不可知。如果黑客攻击源地址，他仅仅是在攻击\
  \ `NAT` 设备，而不是数据包的实际发送者。`NAT` 在第 3 章 中有详细描述。\n\n`NAT` 的产生是为了解决与 `IPv4` 相关的地址短缺问题，许多人认为它对\
  \ `IPv6` 来说是不必要的。强制流量翻译和从外部直接连接中隐藏内部网络细节的额外安全功能，将使 `NAT` 在 `IPv6` 时代继续发挥作用。\n\n\
  基础数据包过滤是次常见的防火墙技术，涉及查看数据包、其端口、协议以及源地址和目的地址，并将这些信息与防火墙上配置的规则进行比对。可以禁止向邮件或数据库服务器建立\
  \ `Telnet` 和 `FTP` 连接，但可能允许相应的服务服务器建立。这是一种基于每个数据包头部信息（如 `IP` 地址和 `TCP/UDP` 端口）的简单过滤方法。数据包过滤无法检测并捕获所有不需要的数据包，但它是快速且高效的。\n\
  \n查看所有数据包并确定每个数据包的需求及其数据需要 `stateful`（状态）数据包过滤。`Stateful` 意味着防火墙维护或知道对话的上下文。许多情况下，规则取决于特定通信连接的上下文。例如，从外部服务器到内部服务器的流量如果是被请求的则被允许，如果没有请求则被阻止。一个常见的例子是请求\
  \ Web 。此请求实际上是对多个服务器的一系列请求，每个请求都可以被允许或被阻止。高级防火墙采用状态检测数据包过滤来防止几种类型的不需要的通信。如果数据包来自网络外部并伪装成对网络内部消息的响应，防火墙将没有其被请求的记录并将其丢弃，从而阻止不需要的外部访问尝试。由于许多通信将传输到高端口（`1023`\
  \ 以上），状态监控将使系统确定哪些组高端口通信是允许的，哪些应该被阻止。状态监控的缺点是执行这种类型的监控需要大量的资源和处理，这会降低效率并需要更强大、昂贵的硬件。\n\
  \n* * *\n\n![image](img/examtip.jpg)\n\n**考试提示** 防火墙通过检查数据包并根据一组规则选择性地拒绝某些来工作。防火墙充当特定网络节点的门卫或哨兵，隔离流量并允许某些通过而阻止其他通过。\n\
  \n\n\n\n防火墙还可以充当网络流量调节器，因为它们可以配置为缓解特定类型的网络攻击。在拒绝服务和分布式拒绝服务（`DoS/DDoS`）攻击中，攻击者会试图向网络泛洪大量流量。防火墙可以经过调以检测此类攻击并充当泛洪保护器，减轻对网络的影响。防火墙在阻止各种泛洪攻击方面非常有效，包括端口泛洪、`SYN\
  \ floods` 泛洪和 ping 泛洪。\n\n## 路由器\n\n`Routers`（路由器）是网络流量管理设备，用于相互连接不同的网络段。路由器运行在开放系统互连模型（`OSI`）参考模型的网络层（在第\
  \ 3 章\n\n**考试提示** `ACLs` 的建立和维护可能耗费大量精力。创建它们是一项简单的任务，但明智地使用它们可以在少量维护的情况下产生安全收益。这对于\
  \ `DMZ`（非军事特区）和边缘设备等安全区域非常重要，可以在阻止不必要的外部接触的同时，允许已知的内部流量。\n\n路由器的一个严重的操作安全问题涉及对路由器的访问以及对其内部函数的控制。路由器可以使用简单网络管理协议（`SNMP`）和\
  \ `Telnet` 进行访问并进行远程编程。由于路由器的地理隔离，这可能成为一种需要，因为世界上许多路由器可能相隔数百英里，位于不同的锁定结构中。对路由器进行物理控制绝对必要的，因为如果任何设备（无论是服务器、交换机还是路由器）被黑客物理访问，应被视为已被破解；因此必须防止此类访问。确保管理密码绝不明文传输、仅使用安全机制访问路由器，并将所有默认密码重置为强密码是非常重要的。\n\
  \n与交换机一样，路由器管理控制最可靠的访问点是通过串口控制接口或特定的路由器管理以太网接口。这允许访问路由器的控制部分，而无需处理与流量相关的问题。对于路由器地理分布可能有限的公司内部网络，存在允许进行带外远程管理的第三方解决方案。这允许即使从远程位置也能以安全的方式对路由器进行完全控制，尽管需要额外的硬件。\n\
  \n路由器可以从许多供应商处获得，大小不一。一个用于电缆调制解调器/DSL 典型小型家庭办公室路由器如图图 1-2 所示。较大的路由器可以处理每通道每秒数十 GB\
  \ 的流量，使用光纤输入并在网络中移动数万个并发的互联网连接。这些成本可能高达几十万美元的路由器是电子商务基础设施的重要组成部分，使 Amazon 和 eBay\
  \ 等大型企业能够同时为许多客户提供服务。\n\n![image](img/f0008-01.jpg)\n\n* *\n\n**图 1-2** 用于电缆调制解调器/DSL\
  \ 的小型家庭办公室路由器\n\n## 交换机\n\n`Switches`（交换机）大多数基于以太网的局域网（`LANs`）的基础。虽然集线器和桥仍然存在，但在今天高性能的网络环境中，交换机已取代了两者。交换机的每个端口都有独立的冲突域。（注：原文此处存在大量重复的句子，译文已按要求保留格式并翻译核心含义：交换机的每个端口都有独立的冲突域。）\n\
  \n\n\n\n![image](img/caution.jpg)\n\n**警告** 为了确保交换机的安全，您应该禁用除安全串行链路或安全协议（如 Secure\
  \ Shell (SSH))之外的所有访问协议。仅使用安全方法访问交换机将减少受到黑客和恶意用户攻击的风险。维护安全的网络交换机比保护单个设备更为重要，因为交换机拦截数据的数据控制范围要大得多，特别是当它可能被黑客重新编程时。\n\
  \n## 负载均衡\n\n某些系统（例如服务器）对业务运营至关重要，因此它们应该是容错措施的对象。容错中用的一种常用技术是`负载均衡`。该技术旨在将处理负载分布到两个或多个系统上。它被用于帮助提高资源利用率和吞吐量，同时也具有增加整个系统容错能力的额外优势，因为关键进程可能会被拆分到几个系统上。如果任何一个系统发生故障，其他系统可以接管其原本正在处理的任务。虽然对整体吞吐量可能会有影响，但操作不会完全中断。负载均衡通常用于处理网站、高带宽文件传输和大型互联网即时聊天\
  \ (IRC) 系统。负载均衡通过一系列健康检查工作，这些检查会告知负载均衡器哪些机器正在运行，并通过调度机制来均匀地分配工作。负载均衡对于无状态系统最好，因为随后的请求可以由任何服务器处理，而不仅仅是处理上一个请求的那个服务器。\n\
  \n## 代理\n\n虽然`代理服务器`不是严格意义的安全工具，但它可以用来过滤掉不需要的流量，并防止员工访问潜在的恶意网站。代理服务器从客户端系统接收请求并代表客户端将其转发到目标服务器。代理服务器可以是完全透明的（这些通常称为`网关`或`隧道代理`），也可以在发送请求之前修改客户端请求，甚至在不需要联系目标服务器的情况下为客户端提供服务。目前正在使用的代理服务器主要分为几类：\n\
  \n*   **匿名代理**：匿名代理旨在隐藏请求系统的信息，并使用户浏览体验变得“匿名”。这种代理服务通常被那些关注互联网传输个人信息量、以及使用跟踪 cookie\
  \ 和其他机制跟踪浏览活动的个人使用。\n*   **缓存代理**：这种代理保留热门客户端请求的本地副本，通常用于大型组织以减少带宽占用并提高性能。当请求被发出时，代理服务器首先检查缓存中是否有请求内容的最新副本；如果有，它将立即为客户端提供服务，而无需联系目标服务器。如果内容过旧或缓存代理没有请求内容的副本，则请求将转发到目标服务器。\n\
  *   **内容过滤代理**：内容过滤代理检查每个客户端请求并将其与既定的可接受使用策略 (AUP) 进行比较。请求可以通过多种方式进行过滤，包括根据请求的 URL、目标系统、域名或内容本身中的关键词。内容过滤代理通常支持用户级认证，以便对访问进行控制和监控，并对通过代理的活动进行记录和分析。这种代理在学校、企业环境政府网络中非常流行。\n\
  *   **开放代理**：开放代理本质上是任何互联网用户都可以使用的代理，通常也具有某些匿名功能。这种代理类型一直是争议的话题，辩论的一方是互联网隐私和自由的倡导者，另一方则是执法部门、公司和政府实体。由于开放代理经常被用于绕过公司代理，许多公司尝试阻止员工使用开放代理。\n\
  *   **反向代理**：反向代理通常安装在网络连接的服务器端，通常位于一组 Web 服务器之前。反向代理拦截所有入的 Web 请求，并可以执行许多功能，包括流量过滤、安全套层协议\
  \ (SSL) 解密、提供图形等常见静态内容以及执行负载均衡。\n*   **Web 代理**：Web 代理专门用于处理 Web 流量，有时被称为`Web 缓存`。大多数\
  \ Web 代理本质上都是缓存代理。\n\n在网络环境中部署代理解决方案通常通过设置代理并要求所有客户端系统配置使用代理，或者通过部署一个拦截所有请求的代理来实现（无需客户端配置）。\n\
  \n从安全角度来看，代理在控制和过滤出站请求方面最有用。通过限制员工访问的内容和网站，许多管理员希望避免数据丢失、系统被劫持以及恶意网站感染。管理员还利用代理来执行公司接受使用策略并跟踪资源的使用。\n\
  \n## 安全网关\n\n某些安全厂商将代理功能与内容过滤功能相结合，创建一个名为`安全网关`的产品。安全网关旨在解决针对 Web 流量的安全威胁和漏洞。安全网关通常提供以下功能：\n\
  \n*   **实时恶意软件防护**（也称为恶意软件检查）：某些安全网关能够扫描所有出入 Web 流量，检测并阻止恶意软件、间谍软件、广告软件、恶意脚本、基于文件的攻击等不良流量。\n\
  *   **内容监控**：某些安全网关提供监控正在检查的 Web 流量内容的能力，以确保符合组织策略。\n*   **生产力监控**：某些安全网关衡量特定用户、用户组或整个组织产生的\
  \ Web 流量，以及流量类型。\n*   **数据保护与合规**：某些安全网关可以扫描 Web 流量，检查发送到组织外的敏感或专利信息，以及社交网络网站或不良网站的使用。\n\
  \n## VPN 集中器\n\n虚拟专用网络 (VPN) 是一种用于在公共网络（如互联网）上的用户之间提供安全通信通道的结构。正如后文所述，可以使用多种技术来实例化\
  \ VPN 连接。加密技术允许对数据包数据进行加密或对整个数据包进行加密。如果仅加密数据，包头在源和目的之间仍然可以嗅探和观察，但加密保护了数据包的内容不被查看。如果加密整个数据包，它将被放入另一个数据包中，并通过隧道跨越公共网络发送。隧道可以保护通信双方的身份。\n\
  \n\n\n\nVPN 最常见的实现方式是通过 `IPsec`，这是一种用于 IP 安全的协议。`IPsec` 在 `IPv6` 中是强制性的，并可选地回溯支持到\
  \ `IPv4`。`IPsec` 可以通过硬件、软件或两者结合来实现。VPN 终止于网络中的特定点，即 VPN 集中器。VPN 集中器有多种尺寸，可以进行扩展以支持从小型网络到大型网络的\
  \ VPN 应用。VPN 集中器允许多个 VPN 连接终止于单一网络点。\n\n### 入侵检测系统\n\n入侵检测系统（IDS）旨在能够实时和事后检测、记录并响应未经授权的网络或主机使用。IDS\
  \ 可由众多供应商提供，是网络安全中不可不可缺的组成部分。这些系统通过软件实现，但在大型系统中，还需要专门的硬件。IDS 可分为两类：基于网络的系统和基于主机的系统。它们使用两种主要的检测方法：基于特征的和基于异常的：\n\
  \n- **`基于主机的入侵检测系统 (HIDS)`**：检查单个系统（如邮件服务器、Web 服务器或个人 PC）上的活动。它只关注单个系统，通常对网络或周围系统的活动没有可见性。\n\
  - **`基于网络的入侵检测系统 (NIDS)`**：检查网络本身的活动。它只能看到通过其监控的网络链路的流量，通常不知道单个系统上发生了什么。\n\n***\n\
  \n![image](img/examtip.jpg)\n\n**考试要点 (EXAM TIP)** 了解基于主机的 IDS 和基于网络的 IDS 之间的区别。基于主机的\
  \ IDS 运行在特定系统（服务器或工作站）上，查看该主机上的所有活动。基于网络的 IDS 嗅探网络流量，仅能看到在网络上发生的活动。\n\n无论是基于网络还是基于主机，IDS\
  \ 通常由几个协同工作的特种化组件组成，如图 1-3 所示。这些组件通常是逻辑上和基于软件的，而不是物理的，并且会根据供应商和产品的不同而略有差异。通常，一个\
  \ IDS 具有以下逻辑组件：\n\n- **`流量收集器（或传感器）`**：该组件收集 IDS 需要检查的活动/事件。在基于主机的 IDS 中，这可能是日志文件、审计日志或进入/离开特定系统的流量。在基于网络的\
  \ IDS 中，这通常是一种从网络链路复制流量的机制——基本上充当嗅探器工作。此组件通常被称为传感器。\n- **`分析引擎`**：该组件检查收集的网络流量，并将其与特征数据库中存储的已知可疑或恶意活动模式进行比较。分析引擎是\
  \ IDS 的“大脑”。\n- **`特征数据库`**：特征数据库是已知可疑或恶意活动的模式和定义的集合。\n- **`用户界面和报告`**：该组件与人类元素进行交互，在适当的时候提供警报，并为用户提供与\
  \ IDS 交互和操作的手段。\n\n![image](img/f0012-01.jpg)\n\n***\n\n**图 1-3** IDS 组件的逻辑示意图\n\
  \n大多数 IDS 都可以进行调整以适应特定的环境。可以关闭某些特征，告诉 IDS 不要查找某些类型的流量。例如，如果你在纯 `UNIX` 环境中运行，你可能不希望看到基于\
  \ Windows 的警报，因为它们不会影响你的系统。此外，可以根据你对某些类型流量的关注程度，调整警报级别的严厉程度。某些 IDS 还会允许用户从特定主机中排除某些活动模式。换句话说，你可以告诉\
  \ IDS 忽略某些系统生成看起来像恶意活动流量的事实，因为它们实际上并不是。\n\n一些分析师还会根据 IDS 运行和检测恶意流量的方式，将 IDS 模型进一步分为四类（这些模型也适用于入侵防御系统，稍后会进行讨论）。\n\
  \n### 基于行为 (Behavior Based)\n\n这种模型依赖于一组收集的“正常行为”——网络上应该发生的情况，以及被认为是“正常”或“可接受”的流量。不符合“正常”活动类别或模式的行为被认为是可疑或恶意的。这种模型能够检测零日攻击或未发表的攻击，但误报率较高，因为任何新的流量模式都可以被标记为“可疑”。\n\
  \n### 基于特征 (Signature Based)\n\n这种模型依赖于一组预定义的模式（称为`特征`）。IDS 在识别并处理可疑或恶意流量之前，必须提前知道哪些行为被认为是“坏的”。基于特征的系统非常快速且精确，但它们依赖于事先拥有准确的特征定义。\n\
  \n### 基于异常 (Anomaly Based)\n\n这种模型与基于行为的方法类似。IDS 首先学习什么是“正常”流量，然后寻找与这些“正常”模式偏离的特征。异常也可以被定义，例如发送到基于\
  \ Windows 的系统的 `Linux` 命令，并通过基于人工智能的引擎实现，以扩展特定定义的实用性。\n\n### 启发式 (Heuristic)\n\n\
  这种模型使用人工智能来检测入侵和恶意流量。这通常通过算法实现，帮助 IDS 决定流量模式是否为恶意。例如，包含重复 10 次字符的 URL 可能被视为单个特征的“坏”流量。在启发式模型中，IDS\
  \ 将理解如果 10 个重复字符是坏的，那么 11 个仍然是坏的，20 个更糟。这种模糊逻辑实现使得该模型介于基于特征和基于行为的模型之间。\n\n### 入侵防御系统\
  \ (Intrusion Prevention Systems)\n\n入侵防御系统 (`IPS`) 的核心是一个入侵检测系统。然而，IDS 只能在网络流量匹配规则时发出警报，而\
  \ IPS 可以采取进一步的操作。IPS 具有 IDS 相同的两种形式：基于主机 (`HIPS`) 和基于网络 (`NIPS`)。IPS 可以采取直接行动拦截攻击，其行动由规则支配。通过自动化响应，IPS\
  \ 显著地缩短了从检测到采取行动的时间。\n\n***\n\n![image](img/examtip.jpg)\n\n**考试要点 (EXAM TIP)**\
  \ 识别出 IPS 具有 IDS 的所有特征，但与 IDS 不同，它可以自动响应某些事件（例如重置 `TCP` 连接），而无需人工干预。\n\n### 协议分析器\
  \ (Protocol Analyzers)\n\n`协议分析器`（也称为`数据嗅探器`、`网络分析器`或`网络嗅探器`）是一种捕捉和解码网络流量的软件或集成软硬件系统。几十年来，协议分析器一直受到管理员和安全专业人员的欢迎，因为它们是环境中多功能的工具。从安全角度来看，协议分析器可以用于多种活动，例如：\n\
  \n- 检测入侵或不受欢迎流量（IDS/IPS 必须具备某种捕捉解码能力以便查找可疑/恶意流量）\n- 在事件响应或事件处理期间捕捉流量\n- 寻找僵尸、木马和感染系统的证据\n\
  - 寻找异常流量或超过某些阈值的流量\n- 测试系统或应用程序之间的加密\n\n从网络管理的角度来看，协议分析器可以用于此类活动：\n\n- 分析网络问题\n\
  - 检测配置不当或运行异常的应用程序\n- 收集和报告网络使用情况及流量统计数据\n\n\n\n\n# 调试客户端/服务器通信\n\n无论预期用途如何，协议分析器都必须能够网络流量以便对其进行捕和解码。基于软件的协议分析器必须能够将其用于监控网络流量的网络接口卡（`NIC`）设置为`混杂模式`（`promiscuous\
  \ mode`，有时称为 `promisc mode`）。`混杂模式`告诉 `NIC` 处理它看到的每一个网络数据包，无论其目标地是什么。通常情况下，`NIC`\
  \ 只处理`broadcast`数据包（发送给该子网上所有人的数据包）以及数据包内目标地址为该 `NIC` MAC 地址的数据包。作为嗅探器，分析器必须处理通过线线的每一个数据包，因此，将\
  \ `NIC` 置于`混杂模式`的能力至关重要。\n\n对于较旧的网络技术（如集线器），操作协议分析器要容易得多，因为集线器无论目标何，都会将每个数据包广播到每个接口上。随着交换机成为网络设备的标准，部署协议分析器变得更加困难，因为交换机不会在每个端口上广播每个数据包。虽然这让管理员嗅探流量变得更加困难，但也让窃听者和潜在攻击变得更难实现。\n\
  \n为了适应协议分析器、IDS 设备和 IPS 设备，大多数交换机制造商都支持`端口镜像`或`交换端口分析 (SPAN)` 端口。根据制造商和硬件的不同，镜像端口将看到通过交换机或特定\
  \ `VLAN(s)` 的所有流量，或者通过其他特定交换机端口的所有流量。网络流量实际上被复制（或镜像）到特定端口，该端口即可支持协议分析器。\n\n一种流行的开源协议分析器是\
  \ Wireshark ([www.wireshark.org](http://www.wireshark.org))）。Wireshark 适用于 UNIX/Linux\
  \ 和 Windows 操作系统，是一种基于 GUI 的协议分析器，允许用户在运行软件的系统上的任何可用网络接口（包括无线接口）上捕获并解码网络流量。Wireshark\
  \ 具有一些有趣的功能，包括“跟踪 TCP 流”的能力，这允许用户选择单个 TCP 数据包，然后查看参与该 TCP 会话的所有其他数据包。\n\n***\n\n\
  ![image](img/examtip.jpg)\n\n**考试提示** 预计会遇到有关如何在 IT 技术组件上实现安全配置参数的问题。\n\n## 垃圾邮件过滤器\n\
  \n各地用户和系统管理员的噩梦——`spam` 本质上是未经请求或不受欢迎的批量电子信息。虽然垃圾邮件通常应用于电子邮件，但也可以通过短信发送到手机和移动设备、作为互联网论坛的帖子，以及通过其他手段发送。如果你用过电子邮件账户，很有可能你收到过垃圾邮件。\n\
  \n从生产力和安全角度来看，垃圾邮件每年给企业和用户造成数十亿美元的损失，它是一个如此广泛的问题，以至于美国会通过了 2003 年的 `CAN-SPAM 法案`，授权联邦贸易委员会执行该法案，并授权司法部对垃圾邮件发送者实施刑事制裁。该法案对发送商业电子邮件的人制定了要求，规定了垃圾邮件发送者以及产品在垃圾邮件中广告的公司违法的处罚措施，并赋予消费者要求邮件发送者停止发送垃圾邮件的权利。然而，尽管我们付出了巨大努力，垃圾邮件仍然源源不断；随着停止垃圾邮件的技术和手段变得越来越先进复杂，用于发送这些未经请求消息的工具和技术也同样如此。\n\
  \n以下是几种用于对抗垃圾邮件泛行的流行方法；其中大多数技术都用于过滤电子邮件，但也可以应用于其他媒介：\n\n- **黑名单 (Blacklisting)**：黑名单本质上是记录哪些域名和源地址有发送垃圾邮件的声誉，并拒绝来自这些域名和源地址的消息。这基本上是一种永久的“忽略”或“拉黑”类型的能力。几个机构和几家商业公司提供了已知垃圾邮件发送者列表。\n\
  - **内容或关键词过滤**：类似于互联网内容过滤，这种方法过滤电子邮件消息中的不受欢迎内容或垃圾邮件迹。就像对网页内容进行过滤一样，基于关键词等内容过滤电子邮件可能会导致意外之外的结果，因为某些术语可能出现在合法邮件和垃圾邮件中。大多数内容过滤技术使用正则表达式匹配进行关键词过滤。\n\
  - **可信服务器 (Trusted servers)**：与黑名单相反，可信服务器列表包含了被“信任”不会转发垃圾邮件的 `SMTP` 服务器。\n- **基于延迟的过滤**：某些简单邮件传输协议\
  \ (`SMTP`) 服务器被配置为在建立连接后和发送 `SMTP` 服务器欢迎横幅之间插入故意暂停。某些生成垃圾邮件的程序不会等待欢迎横幅，任何在连接打开后立即开始发送数据的系统会被视为垃圾邮件生成器并被\
  \ `SMTP` 服务器丢弃。\n- **PTR 和反向 DNS 检查**：某些电子邮件过滤器会检查邮件发送者的源域名。如果反向检查显示邮件来自拨号上网用户、家庭宽带或动态分配的地址，或者具有通用或缺失的域名，那么过滤器就会拒绝它，因为这些是垃圾邮件的常见来源。\n\
  - **回调验证 (Callback verification)**：由于许多垃圾邮件使用伪造的“发件人”地址，某些过滤器尝试验证入站邮件的“发件人”地址。接收服务器可以联系发送服务器以尝试验证发送地址，但这并不总是有效，因为伪造地址有时是有效的电子邮件地址。\n\
  - **统计过滤 (Statistical filtering)**：统计过滤非常像文档分类系统。用户将收到的消息标记为垃圾邮件或合法邮件，过滤系统从用户的输入中学习。看到并分类为垃圾邮件的消息越多，过滤软件拦截接入垃圾邮件的效果就越好。垃圾邮件发送者通过在消息中插入随机单词和字符来反许多过滤技术，这使得识别垃圾邮件模式变得困难。\n\
  - **基于规则的过滤 (Rule-based filtering)**：基于规则的过滤是一种简单的技术，仅查找匹配某些字段或关键词。例如，基于规则的过滤系统可能会查找入站邮件主题行中包含“发财”字样的任何邮件。许多流行的电子邮件客户端具有实现基于规则过滤的能力。\n\
  - **出站过滤 (Egress filtering)**：某些组织也会对离开其组织的电子邮件进行垃圾邮件过滤，这被称为出站过滤。同样类型的反垃圾技术可以用于验证和过滤出站电子邮件，以对抗垃圾邮件。\n\
  - **混合过滤 (Hybrid filtering)**：大多数商业反垃圾方法使用混合过滤，或结合几种不同技术来对抗垃圾邮件。例如，过滤解决方案可能会获取每条入站消息并与已知垃圾邮件发送者进行匹配，然后通过基于规则的过滤器，然后通过内容过滤器，最后通过统计过滤器。如果消息通过了所有过滤阶段，它将被视为合法消息；否则，将作为垃圾邮件被拒绝。\n\
  \n\n\n\n\n许多垃圾邮件过滤是在网络层或 `SMTP` 服务器级别完成的。与在整个组织的用户桌面电脑上部署单独的相比，使用集中式解决方案扫描所有入站和出站消息要高效得多。电子邮件本质上默认是一种代理服务：消息通常进入并离开组织的邮件服务器。用户通常不会连接到远程\
  \ `SMTP` 服务器来发送和接收消息，但他们可以这样做。反垃圾邮件解决方案以软件形式存在，软件既可以加载在 `SMTP` 服务器本身上，也可以加载在次要服务器上，后者在消息到达\
  \ `SMTP` 服务器之前或在 `SMTP` 服务器处理之后对其进行处理。反垃圾邮件解决方案还以硬件设备的形式存在，软件和硬件是一个集成的解决方案。许多集中式反垃圾邮件方法允许用户针对其特定的收件箱自定义垃圾邮件过滤，指定他们自己的过滤规则和评估入站邮件的标准。\n\
  \n垃圾邮件的核心问题在于，尽管付出了大量精力构建有效的垃圾邮件过滤程序，垃圾邮件发送者仍不断创造新方法来淹没收件箱。垃圾邮件过滤解决方案虽然很好，但远非完美，并且持续面临着允许合法信息通过的同时拦截垃圾邮件的持续挑战。对互联网流量缺乏中央控制也使得反垃圾邮件工作变得更加困难。不同国家对电子邮件的法律法规各异，从严厉到完全不存在不等。在可预见的未来，垃圾邮件将继续成为管理员和用户的负担。\n\
  \n## UTM 安全设备\n\n许多安全供应商提供“合位一体安全设备”，这些设备将多种功能整合到同一硬件设备中。最常见的功能是 `firewall`、`IDS/IPS`\
  \ 和反杀病毒软件，尽管合位一体设备也可以包含 `VPN` get、反垃圾邮件、恶意网页流量过滤、反间谍软件、内容过滤、流量整形等。合位一体设备的销售通常认为它们比实现合位一体设备各项功能的单独解决方案更便宜、更易管理且更高效。这些合位一体设备的常用名称是统一威胁管理\
  \ (`UTM`)。使用 `UTM` 设备将安全活动简化为单一过程，并在通用的软件包下进行操作。这把学习曲线降低到单一工具，而不是一系列工具。与相互连接的工具集相比，`UTM`\
  \ 设备在处理网络流量和安全事件方面具有更好的集成性和效率。\n\n## URL 过滤器\n\nURL 过滤器会阻止与禁止列表网站的连接。使用设备（通常由服务支持以更新禁止网站列表）提供了一种自动化手段，阻止访问被认为危险或不当的网站。由于网页内容具有高度的波动性，需要企业级的自动化保护，以确保有合理的概率拦截不当内容、恶意软件和其他恶意内容的来源。\n\
  \n## 内容检查\n\n设备不仅依赖于 `URL` 来判断内容的接受性，还可以检查正在提供的实际内容。内容检查被用于过滤返回包含特定组件内容的网页请求，例如身体部位的名称、音乐或视频内容，以及其他不符合业务环境的内容。\n\
  \n## 恶意软件检查\n\n恶意软件是另一项可以在网络传输过程中检测到的内容，且设备可以进行调整以检测恶意软件。基于网络的恶意软件检测的优势在于只需要更新单个系统，而不是所有机器。\n\
  \n## Web 应用防火墙 vs 网络防火墙\n\n网络防火墙是一种根据网络地址执行策略的设备。网络防火墙根据网络地址执行策略。Web 应用防火墙 (`WAF`)\
  \ 是一种根据应用程序执行安全检查的设备。\n\n\n\n\n\n### A. Logixn\n### B. 请求计数\n### C. 健康检查\n### D.\
  \ 生存时间 (TTL)\n\n#### 2. 对于防火墙而言，“状态化”（stateful）一词是什么意思？\n\nA. 防火墙跟踪请求来自国家。\nB. 仅允许匹配活动连接的数据包通过。\n\
