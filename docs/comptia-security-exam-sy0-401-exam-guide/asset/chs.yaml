  \ 考试目标\n\n### 为参加 CompTIA Security+ 考试做准备\n\n*CompTIA Security+ All-in-One Exam\
  \ Guide, Fourth Edition* 旨在帮助你准备参加 CompTIA Security+ 认证考试 SY0-401。\n\n### 本书组织的\n\
  \n\n\n\n本书分为若干节和章节，以与考试目标相对应。某些章节比其他章节更具技术性——这反映了安全环境的本质，你你不仅要处理技术细节，还要处理安全策略、程序以及培训和教育等问题。尽管许多从事计算机和网络安全的人员拥有数学、计算机科学、信息系统或计算机或电气工程的高级学位，但你并不需要这些技术背景来解决你组织中的安全问题。例如，你不需要开发自己的加密算法；你只需要理解加密学是如何使用的，以及它的优缺点即可。随着学习的深入，你会发现许多安全问题是由人为因素造成的。世界上最先进的技术最终仍会被放在一个人类有机会搞砸的环境中——而且人类往往真的会这么做。\n\
