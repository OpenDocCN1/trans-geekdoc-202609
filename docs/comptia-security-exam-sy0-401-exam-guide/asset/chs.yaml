  D. 垃圾邮件的 TTL 值非常短。\n\n对于问题 11–14，请使用以下场景：怀疑黑客已经突破了公司的边界系统，首席信息安全官 (CISO) 要求你进行事件响应。团队组建后，你决定处理网络部分。\n\
