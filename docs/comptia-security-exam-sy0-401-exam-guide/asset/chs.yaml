  \ 全面性 (Comprehensive)\n\n#### 7. 为什么网络协议分析器需要处于混杂模式（promiscuous mode）？\n\nA. 为了规避\
  \ ACL\nB. 为了告诉交换机将所有数据包转发到工作站\nC. 为了强制网卡处理所有数据包\nD. 不需要混杂模式\n\n#### 8. 哪种协议由于使用明文密码进行验证，会在交换机、防火墙和路由器中创建安全漏洞？\n\
  \nA. SNMP\nB. SSH\nC. SMTP\nD. NAT\n\n#### 9. 为什么大多数组织应该使用内容过滤代理？\n\nA. 允许用户浏览互联网\n\
  B. 提供一个通往互联网的安全隧道\nC. 实施网络可接受策略\nD. 通过本地内容副本减少带宽占用\n\n#### 10. 为什么基于延迟的过滤对垃圾邮件有效？\n\
