  \    - 该功能将在哪里执行？\n    - 如何执行该功能（流程是什么）？\n    - 为什么该功能对组织如此重要或处于关键？\n- **12.** 业务连续性计划的重点是业务的持续运行，尽管在某些时期可能是降低水平或通过不同的手段。灾难恢复计划专门侧于从灾难中恢复。\n\
