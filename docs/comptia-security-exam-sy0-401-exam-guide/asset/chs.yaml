  \ TIP** DMZs act as a buffer zone between unprotected areas of a network (the Internet)\
  \ and protected areas (sensitive company data stores), allowing for the monitoring\
  \ and regulation of traffic between these two zones.\n\n### Subnetting\n\nAn IP\
  \ address (`IPv4`) consists of two parts, a network address and a host address,\
  \ combined in a 32-bit number. The higher-order bits represent the network address,\
  \ and the lower, or remaining bits, represent the host address. The point of separation\
  \ is defined as a subnet mask. Initially, the `IPv4` address space was divided into\
  \ a series of address ranges, based on some standard separations, as detailed in\
  \ Table 3-1. Over time, this was deemed too restrictive and a new scheme called\
  \ Classless Inter-Domain Routing (`CIDR`) was developed. `CIDR` allows the partitioning\
  \ of the `IPv4` address space into user-definable chunks, allowing greater flexibility.\n\
  \n![image](img/t0038-01.jpg)\n\n**Table 3-1** IPv4 Network Classes and Subnet Masks\n\
  \n`CIDR` allows address blocks to be broken into smaller networks referred to as\
  \ subnets. Beginning with a Class C address, such as `192.168.x.x`, `CIDR` can break\
  \ it into a series of networks. If it is desired to break it into two networks,\
  \ then the highest-order bit of the host space becomes a network address bit; this\
  \ makes the new subnet mask `255.255.128.0`. The effect is to use 17 bits for network\
  \ addressing and 15 bits for hosts. `CIDR` uses a notation where the network address\
  \ bits are marked with a `/` sign, so this example would be `192.168.x.x/17`. This\
  \ is the same as saying the subnet mask is `255.255.128.0`. The resulting set of\
  \ host addresses would be `192.168.0.1` through `192.168.127.254` on one network\
  \ and `192.168.128.1` through `192.168.255.254` on the other. If you need three\
  \ subnets, then you need to... (此处原文内容开始出现大量重复乱码)\n\n**由于您提供的原文文本从 \"If you need\
