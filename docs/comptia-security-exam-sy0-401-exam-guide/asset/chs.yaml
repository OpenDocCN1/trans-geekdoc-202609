  \ LCD 电视销售的广告。广告上列出了“Bob 的电视仓库”的地址，那在城市的另一端。这个例子中使用了哪种社会工程学原理？\n\n**A.** 尾随 (Tailgating)\n\
  **B.** 稀缺性 (Scarcity)\n**C.** 捕鱼大鱼 (Whaling)\n**D.** 客户端攻击 (Client-side attack)\n\
