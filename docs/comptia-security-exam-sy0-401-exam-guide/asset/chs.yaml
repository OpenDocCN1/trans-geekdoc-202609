  \ 为什么烟雾探测器无法区分烟？\n   A. 它们只能检测烟雾。\n   B. 它们检测颗粒物。\n   C. 它们检测空气中的颗粒物。\n   D. 以上都不对。\n\
  \n5 [ch10.html#ch10q5] 冷热通道的主要优点是什么？\n   A. 数据中心密度\n   B. 更容易安装\n   C. 不需要复杂的机架\n\
  \   D. 降低功耗\n\n6 [ch10.html#ch10q6] 为什么不再使用氟利昂？\n   A. 氟利昂具有火灾特性。\n   B. 它们非常昂贵。\n\
  \   C. 氟利昂系统极易被触发。\n   D. `EPA` 法规禁止了氟利昂。\n\n7 [ch10.html#ch10q7] 非水灭火的优点是什么？\n\
  \   A. 成本较低\n   B. 对系统的损坏较小\n   C. 不需要消防部门响应\n   D. 以上所有\n\n8 [ch10.html#ch10q8]\
  \ 生物识别中的假阳性是指什么？\n   A. 系统不允许授权用户访问。\n   B. 系统对生物识别产生误判并强制重新扫描。\n   C. 系统允许未经授权的用户。\n\
  \   D. 系统验证了用户但没有打开锁。\n\n9 [ch10.html#ch10q9] 生物识别假阳性的原因是什么？\n   A. 设计不良传感器\n  \
  \ B. 从模拟值到数字值的转换\n   C. 系统用户过多\n   D. 使用了非全球唯一的生物标准\n\n10 [ch10.html#ch10q10] 如果你要扑灭电火，应该使用哪种类的手持灭火器？\n\
  \    A. A 类\n    B. B 类\n    C. C 类\n    D. E 类\n\n对于问题 11-13，请使用以下场景：你是一家中杂货店的\
  \ IT 总监。公司超过了其主要仓库数据中心的容量，将在新租赁的建筑中建立全新的数据中心。数据中心建设尚未完成，CEO 要求你从安全的角度对方案提出建议。\n\n\
  11 [ch10.html#ch10q11] 你推荐哪种灭火系统？（选择所有适用）\n   A. 标准喷淋系统\n   B. ABC 类灭火器\n   C. 氟利昂淹没系统\n\
