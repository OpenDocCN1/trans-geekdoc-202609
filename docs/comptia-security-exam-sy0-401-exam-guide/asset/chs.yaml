  2. B. 内存内容是数字证据中最易易失的。当系统关闭时，可能位于计算机内存中的数字证据将会丢失。\n3. C. 在连接证据驱动器时使用写保护器可以确保没有数据被写入证据中。这有助于确保在收集证据时不对证据进行任何更改。\n\
