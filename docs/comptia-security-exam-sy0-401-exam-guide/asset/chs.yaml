  \n\n\n\n\n\n\n\n\n\n\n\n\n\n### 信息分类 (#ch9.html#ch9Lev166)\n### 本章复 (#ch9.html#ch9Lev176)\n\
  \n\n\n\n\n\n\n\n\n\n- 答案\n\n\n\n\n\n\n### 监控系统日志\n### 禁用未使用的账户\n### 答案\n\n\n###\
  \ 答案\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 引言\n\n在过去的十年里，信息和计算机安全已经从学术界走向美国主流社会。从\
  \ `CodeRed`、`Nimda` 和 `Slammer` 攻击到数据泄露，再到如今被媒体广泛报道并进入普通美国人家庭的高级持续威胁（APT），信息安全已成为一个共同的话题。每个人都越来越明显地意识到，必须采取行动，不仅是为了保护我们国家的关键基础设施，还要保护我们每天打交道的业务。问题是：“我们应该从何开始？”一个普通的信息技术专业人员可以做什么来保护他所受雇维护的系统？一个直接的答案是教育和培训。如果我们想保护计算机系统和网络，我们必须知道如何这样做以及安全包含哪些内容。\n\
  \n在当今敌对的网络环境中，自满不是一个可选项。虽然我们曾认为内部人员是企业网络的主要威胁，而 `script kiddie`（脚本小子）是标准的外部威胁（通常被认为仅仅是麻烦），但当今高度互联的网络世界已是一个完全不同的地方。美国政府几年前确定了八项关键基础设施，认为这些设施对国家的日常运行至关重要，如果其中一项遭受破坏，将对国家产生灾难性影响。在原始的八个部门基础上，又增加了更多，现在总共\
  \ 17 项。此外，分析显示，在美国超过 85% 的此类基础设施由公司所有和运营，而非政府。然而，所有这些关键基础设施的一个共同点是技术——特别是与计算机和通信相关的技术。因此，如果个人、组织或国家想要对这个国家造成破坏，他们不仅可以使用传统武器攻击，还可以通过互联网利用计算机进行攻击。在对恐怖组织的袭击中获取的其他信息中，计算机和互联网信息通常也会被缴获，这并不奇怪。虽然内部人员仍然可以给组织造成巨大的破坏，但外部威胁再次成为许多人的首要关注点。\n\
  \n那么，作为寻求更多安全知识的 IT 专业人员，你从哪里开始学习呢？IT 世界充斥着各种认证，那些试图更多了解所选专业的人可以获得。安全领域也如此，`CompTIA\
  \ Security+` 考试提供了安全基础级认证。`CompTIA Security+` 是对从事安全职业感兴趣的人来说的一个理想的起点。在本考试指南的书中，你不仅会找到可以帮助你准备\
  \ `CompTIA Security+` 考试的材料，还将找到理解当今保护计算机系统和网络时涉及的问题所需的基础信息。本考试指南绝不是学习所有保护组织系统知识的最终来源，但它是你开启安全学习和职业的起点。\n\
  \n关于这个研究领域有一点是肯定的——它永远不会无聊。随着技术本身的进步，它不断变化。在你深入安全学习的过程中，你还会发现，无论技术如何进步，无论开发了多少新的安全设备，在最基本的层，人仍然是安全链中最薄弱的环节。如果你正在寻找一个令人兴奋的领域深入研究，那么你的选择非常明智。安全提供了技术与人事问题的挑战性融合。作为本考试指南的作者，我们祝你在开启充满兴奋和挑战的职业生涯时好运。\n\
  \n## 致谢\n\n我们，*CompTIA Security+ All-in-One Exam Guide, Fourth Edition* 的作者，要感谢许多人，没有他们，这项工作无法取得成功。我们首先感谢\
  \ `Artklin`，他提供了这项工作所需的支持。我们还需要感谢 `Gregory B. White` 一直给予我的巨大支持。`Josie`，感谢所有的爱和支持。`Macon`，感谢你所有的快乐和笑声。`Geena`，感谢你做我最好的朋友和我最强大的支持。我亲爱的妻子\
  \ `Susan`：你是我的灵感、我的爱和灵感来源。对于我在写书期间你所遭受的所有等待，我深表歉意。我的妻子 `Charlan`，感谢她一直给予我的支持。给我的妻子和好朋友\
  \ `Leah`，感谢你的爱和支持。给我的孩子们——这就是爸爸在电脑上输入的内容！\n\n## 引言\n\n随着事件数量稳步上升，计算机安全已变得至关重要。许多公司现在将预算的大部分投入安全硬件、软件、服务和人员。他们花费这些钱并不是因为这能增加销售或增强他们提供的产品，而是因为如果不采取保护措施可能会面临的后果。\n\
  \n### 为什么要关注安全？\n\n安全不是我们想要付钱的东西；如果我们不需要担心保护数据免受未经授权的泄露、修改或破坏，那就太好了，但这并不是我们所处的环境。相反，我们看到从安全事件恢复恢复随着事件数量的增加而不断上升。网络攻击和信息泄露发生得如此频繁，以至于在新闻中几乎忽略了它们。但\
  \ `Target` 被盗取的 4000 万多个信用卡和借记卡号，以及随之而来的 `CIO` 和 `CEO` 辞职，可能表明了一种新的紧迫感，一种在数据安全方面的新目标。纸质报告和企业“口头支惠”的时代可能正在消退，应对更复杂的攻击者带来的新挑战的时间已经到来。几个月后，`Home\
  \ Depot` 报告了更大规模的安全漏洞。战斗将是长期的，防御者在适应和保护，而攻击者在寻找弱点漏洞。谁会赢？取决于防御者的警惕性，因为攻击者将长期存在。\n\
  \n### 对安全专家日益增长的需求\n\n\n\n\n\n# 简介概述\n\n为了保护我们的计算机系统和网络，我们需要大量接受过计算机和网络安全各个方面培训的新型安全专业人员。这并不是一项容易的任务，因为连接到互联网的系统变得日益复杂，其软件代码行数以百万计。如果你仅仅考虑一个数百万行代码的软件中可能存在多少错误，那么理解为什么这是一个如此难以解决的问题并不难。考虑到由于市场不断变化，软件开发速度之快——这是必然的——理解错误是如何发生的并非易事。\n\
  \n软件中的并非每一个“漏洞”（bug）都会导致安全漏洞，但只需寥几个漏洞就能对互联网社区产生巨大影响。我们不能仅仅将这种局面归咎于供应商，因为他们正在响应政府和行业的需求。大多数供应商都非常擅长为其软件中发现的缺陷开发补丁，并且不断发布补丁以保护系统免受可能引入安全问题的漏洞的影响。这为经理和管理员引入了一个全新的问题——`补丁管理`（patch\
  \ management）。这一点变得多么重要，从最近发生的安全事件就可以看出：许多事件是由于在安全事件发生几个月就被发现的安全漏洞导致的，尽管当时已有补丁可用，但社区没有正确安装补丁，从而导致了事件的发生。发生这种情况的原因之一是，许多负责安装补丁的人员没有经过培训，无法理解漏洞周围的安全影响或不安装补丁的后果。这些人中的许多人只是缺乏必要的培训。\n\
  \n由于需要越来越多接受过基本水平理解培训的安全专业人员，诸如 `CompTIA Security+` 等认证已应运而生。潜在的雇主希望知道他们考虑聘佣的个人在安全方面知道该做什么。反过来，潜在的员工也希望有一种方法来论证他或她的理解水平，这可以增加候选人被录用的机会。整个社区只是希望有受过培训的安全专业人员。\n\
  \n## CompTIA Security+\n\n参加 `CompTIA Security+` 考试的目标是证明你已经掌握了全球范围内基础级安全从业人员的标准。考试为你提供了一个验证自己对计算机安全领域知识和理解的绝佳机会，对于许多不同的人（包括网络和系统管理员、分析师、程序员、网页设计师、应用程序开发人员和数据库专家）来说，它是展示安全领域专业成就的适当机制。根据\
  \ CompTIA 的说法，考试针对具有以下条件的人员：\n\n* 至少两年的 IT 管理经验，侧重于安全\n* 日常的`技术`信息安全经验\n* 对安全问题和实施有广泛知识，包括在特定\
  \ `CompTIA Security+` 领域中的主题\n\n考试目标是在行业和政府机构的投入和协助下开发的，包括一些著名的例子，如联邦调查局 (`FBI`)、美国国家标准与技术研究院\
  \ (`NIST`)、美国秘密勤务局、信息系统安全协会 (`ISSA`)、信息系统审计和控制协会 (`ISACA`)、微软公司、RSA Security、摩托罗拉、Novell、太阳芯系统、VeriSign\
  \ 和 Entrust。\n\n`CompTIA Security+` 考试旨在涵盖广泛的安全主题——这些主题是安全从业人员预期应该掌握的。测试包含来自六个知识领域的信息：\n\
  \n![image](img/txxxvi-01.jpg)\n\n`网络安全`（Network Security）知识领域涵盖了基础网络原理和设备。该领域涉及有线和无线网络，以及计算机连接到局域网和互联网时引入的安全问题。`合规与运营安全`（Compliance\
  \ and Operational Security）领域检查了许多运营安全问题，如风险评估与缓解、事件响应、灾难恢复和业务连续性、培训和意识以及环境控制。由于了解你正在保护系统和网络免受哪些威胁非常重要，第三个领域`威胁与漏洞`（Threats\
  \ and Vulnerabilities）检查了可能发生的许多不同类型的攻击以及这些攻击利用的漏洞。第四个领域`应用、数据与主机安全`（Application,\
  \ Data and Host Security）涵盖了个人保护主机的措施。在访问控制与身份管理`（Access Control and Identity Management）领域涉及了认证、授权和访问控制的基本概念。账户管理和认证服务在该领域也有涉及。最后一个领域`密码学`（Cryptography）一直是任何组织安全基础的一部分。\n\
  \n`CompTIA Security+` 考试旨在涵盖广泛的安全主题——安全从业人员预期应该知道的主题。测试包含一系列问题，每个问题都设计有一个最佳答案或响应。其他备选项是为那些个人对问题代表的主题知识或理解不完整而设计的。考试将包含多选题和性能测试题。性能测试题让候选人在模拟环境中面对任务或问题。候选人有机会展示其技能。\n\
