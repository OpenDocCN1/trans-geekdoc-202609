  \ **B.** 许多高安全性锁制造商会对钥匙孔申请专利并严格控制。这将使得未经授权的人员无法获得毛坯，即使发现了毛坯，它们也仅适用于小物理区域内的锁。\n**3.**\
  \ **C.** 隐写术的一个关键优势是难以被检测，因为它的编码可以类似于视觉特征。\n**4.** **C.** 加密是数据保护的主要保护手段。\n**5.**\
  \ **B.** 你必须检查哈希值以确保文件未被更改。\n**6.** **D.** 封锁演习是为了应对威胁而锁上所有门。\n**7.** **B.** `fail-safe`\
  \ 意味着门会打开以便离开。\n**8.** **A.** `CCTV` 可以在个人经过时进行追踪。\n**9.** **D.** 以上都是容错设计的示例：电源、磁盘、连接。\n\
  **10.** **C.** 当地建筑规范会规定疏散路线的需求。\n**11.** **A, B, 和 D.** 围栏、控制测试和照明。\n**12.** **A,\
  \ C, 和 D.** 访问控制、加密和哈希值是最佳答案。\n**13.** **A.** 更清晰的标识让员工知道疏散路径。\n**14.** **C.** 数据冗余是最佳解决方案。\n\
  **15.** **D.** 以上都是正确答案。\n\n\n\n\n\n# 攻击与恶意软件\n\n在本章中，你将：\n- 检查恶意软件的类型\n- 学习各种类型的计算机和网络攻击，包括拒绝服务、欺骗、劫持和密码破解\n\
  - 理解存在的不同类型的恶意软件，包括病毒、蠕虫、特洛伊马、逻辑炸弹和定时弹\n- 理解各种类型的攻击\n\n攻击可以针对软件的几乎任何层或层级，从网络协议到应用程序。当攻击者在系统中发现漏洞时，他会利用该弱点来攻击系统。攻击的效果取决于攻击者的意图，可能导致从轻微到严重的各种影响。对系统的攻击可能在系统本身上是不可见的，因为攻击实际上发生在另一个系统上，而攻击者将在第二个系统中操纵的数据是通过攻击第一个系统而获得的。\n\
  \n### 恶意软件\n恶意软件是指为了某些邪恶目的而设计的软件。此类软件可以被设计为对系统造成破坏（例如删除所有文件），也可以被设计为在系统中创建后门，以允许未经授权的个人访问。通常，恶意软件的安装是为了不让授权用户察觉到。可以使用几种不同类型的恶意软件，例如病毒、特洛伊马、逻辑炸弹、间谍软件和蠕虫，它们在安装方式和目的上有所不同。\n\
  \n### 广告软件\n软件分发业务需要一种收入流来支持开发和分发的成本。一种收入流就是广告。由广告支持的软件被称为 `adware`。广告软件有许多不同的形式。对于合法的广告软件，用户对广告知情并同意这种安排，以获得免费使用软件。这种类型的广告软件通常提供付费的无广告版本作为替代。广告软件也可以指一种恶意软件，其特征是展示不受欢迎广告的软件。这些广告有时会令人困扰，而有时则代表了实际的安全威胁。这些广告通常以弹出浏览器窗口的形式出现，在某些情况下，它们会随着任何用户操作而级联出现。\n\
  \n### 病毒\n最著名的恶意代码类型是病毒。关于病毒有很多记载，因为有几起高关注的安全事件涉及了它们。`virus` 是一种恶意代码，通过附着在另一段可执行代码上来复制自己。当运行其他可执行代码时，病毒也会执行，并有机会感染其他文件并执行其设计要进行的任何其他邪恶行为。病毒感染其他文件的特定方式以及它感染的文件类型取决于病毒的类型。创建的第一批病毒有两种类型——引导扇区病毒和程序病毒。\n\
  \n### 蠕虫\n曾经很容易区分蠕虫和病毒。最近，随着新物种复杂恶意代码的引入，这种区别已经变得模糊了。`Worms` 是试图渗透网络和计算机系统的代码片段。一旦发生渗透，蠕虫会在被渗透的系统上创建一个自己的新副本。因此，蠕虫的繁殖不依赖于将病毒附着在另一段代码或文件上（这是病毒的定义）。\n\
  \n病毒通常被认为是一个基于系统的问题，而蠕虫是基于网络的问题。如果恶意代码被发送到整个网络，它随后可能被称为蠕虫。然而，重要的区别在于代码是否必须附着在其他东西上（病毒），或者它是否可以独立“生存”（蠕虫）。\n\
  \n最近一些高关注的蠕虫示例包括 2003 年的 `Sobig` 蠕虫、2003 年的 `SQL Slammer` 蠕虫、2001 年的 `Code Red`\
  \ 和 `Nimba` 攻击，以及 2005 年导致 CNN Live 宕线的 `Zotob` 蠕虫。`Nimba` 特别令人印象深刻，因为它使用了五种不同的方法进行传播：通过电子邮件、通过开放网络共享、通过浏览受感染的网站、使用\
  \ `Microsoft IIS 4.0/5.0` 的目录遍历漏洞，以及最令人惊的是通过 `Code Red II` 和 `sadmind` 蠕虫留下的后门。\n\
  \n![image](img/examtip.jpg)\n\n**考试贴士** 蠕虫的行为像病毒，但也具有在没有人类操作的情况下旅行的能力。\n\n### 间谍软件\n\
  间谍软件是“监视”用户、记录并报告其活动的软件。通常在用户不知情的情况下安装，间谍软件可以执行广泛的活动。它可以记录击键（通常称为 `keylogging`），当用户登录特定网站时。它可以监控用户运行特定的软件，例如在游戏中作弊。许多间谍软件初初看起来是无害的，但未经授权的系统监控很容易被滥用。在其他情况下，间谍软件被专门设计用于窃取信息。\n\
  \n### 特洛伊马\n特洛伊马或简称 `Trojan` 是一种看起来在做某件事（实际上可能在做那件事）但隐藏了其他功能的软件。它与古代著名的故事的类比非常准确。在原始案例中，该物体看起来是一个巨大的木马，事实也如此。同时它隐藏了对特洛人更邪恶、危险的东西。只要木马留在城墙外，就不会对居民造成伤害。它必须由居民带入，正是在其内部隐藏目的才被激活。计算机特洛伊马的工作原理如此。与病毒通过附着在其他文件或程序进行复制不同，特洛伊马是一个由用户复制并安装的独立程序——它必须由授权用户“带入”系统。攻击者面临的挑战是引导用户复制并运行该程序。这通常意味着程序必须伪装成用户想要运行的东西，例如特殊的工具或游戏。一旦它被复制并进入系统，特洛伊马就会执行其隐藏目的，而用户通常察觉不到其真实面目。\n\
  \n特洛伊马的一个很好的例子是 `Back Orifice (BO)`，它最初于 1999 年，现在提供多个版本。`BO` 可以附着于多种类型的程序。一旦附着，并且一旦运行受感染的文件，`BO`\
  \ 就会为未经授权的人提供远程接管系统的方法，就像他们坐在控制台一样。`BO` 设计用于基于 Windows 的系统。许多特洛伊马通过 Trojan 打开的端口与外部通信，这是检测特洛伊马的方法之一。\n\
  \n\n\n\n\n`Rootkits` 是一种恶意软件，专门设计用于某种方式修改操作系统的运行，以实现非标准功能。rootkits 的历史可以追溯到 `UNIX`\
  \ 操作系统的初期，当时 rootkits 是一组被修改过的管理工具。这种技术最初的设计是为了让程序在故障或无响应时，对操作系统功能获得更大的控制权，但现在它已经不断演变并被用于各种场景。其中一个广为人知的案例发生在索尼\
  \ BMG 公司，该公司利用 rootkit 技术为其公司的一些 CD 提供复制保护技术。两个主要问题导致这一事件演变成了一场彻底的溃败：首先，该软件在未经用户许可的情况下修改了系统；其次，该软件在基于\
  \ `Windows` 的系统中开了安全漏洞，在 rootkit 级别创建了可被利用的漏洞。这导致索尼案被标记为恶意软件，这也是 rootkits 最常见的用途。\n\
  \nrootkit 可以做很多事情——事实上，它几乎可以做操作系统能做的任何事情。rootkits 会修改操作系统内核及支持函数，改变系统运行的本质。rootkits\
  \ 的设计旨在通过颠覆或规避操作系统的安全功能来避免被检测。rootkits 作为一种恶意软件，可以更改线程优先级以提升应用程序性能、执行键记录、充当嗅探器、向其他应用程序隐藏其他文件，或在身份验证系统中创建后门。利用\
  \ rootkit 功能隐藏其他进程和文件，使得攻击者可以在用户或其他应用程序不知道发生了什么的情况下使用计算机的一部分。这让漏洞利用代码规避了杀毒软件和反间谍软件的检测，像了一件隐身斗篷。\n\
  \nrootkits 可以在操作系统加载之前加载，作为一个虚拟化层，例如 `SubVirt` 和 `Blue Pill`。rootkits 可以存在于固件中，这已经在显卡和扩展卡中均得到证实。rootkits\
  \ 可以以可加载库模块的形式存在，从而有效地更改内核之外的操作系统部分。关于野外特定 rootkit 的更多信息可以在 [www.antirootkit.com](http://www.antirootkit.com)\
  \ 找到。\n\n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 存在五种类型的 rootkits：固件、虚拟、内核、库级和应用级。\n\
  \n一旦检测到 rootkit，就需要对其进行删除和清理。由于 rootkits 具有侵入性，而且 rootkits 的许多方面并不易于检测，大多数系统管理员甚至不会尝试清理或删除\
  \ rootkit。与尝试确定损坏的深度和范围并尝试修复单个文件相比，使用以前捕获的干净系统镜像并对机器重新装映像要简单得多。\n\n### 后门\n\n`Backdoors`\
  \ 最初（有时现在仍然）仅仅是软件开发人员使用的一种方法，以确保即使将来发生某些阻止正常访问方法的情况，他们也能访问应用程序。一个例子是硬编码密码，当管理员忘记自己的系统密码时，可以使用该密码获取程序的访问。这种后门（有时也称为\
  \ `trapdoor`，即陷阱门）明显的问题在于，由于它是硬编码的，因此无法被删除。如果攻击者获知了该后门，所有运行该软件的系统将受到攻击的威胁。\n\n`backdoor`\
  \ 一词也且更常见地用于指绕过加密系统、计算机或（在某些情况下）物理屏障的正常身份验证的方法。后门的一个常见例子是程序中的硬编码密码。另一个例子是开发者为了维护目的而创建的后门，后来被攻击者利用。后门可能非常危险，因为它们为攻击者访问系统提供了便利的途径。\n\
  \n### 逻辑炸弹\n\n`Logic bombs` 是故意插入软件系统中的一段代码，当满足某些条件时会触发该功能。这些条件可能是特定的日期或时间，或者是用户的操作。逻辑炸弹通常被用于对系统造成破坏。\n\
  \n\n\n\n\n### 多态恶意软件\n\n反病毒软件对恶意软件的检测主要通过使用特征码来实现。程序会扫描可执行文件中的代码段，作为标记，这些标记是能够实现检测的唯一代码模式。就像人体会产生与标记蛋白匹配的抗原一样，反病毒软件通过恶意软件代码中存在的唯一标记来检测恶意软件。\n\
  \n恶意软件编写者了解这一功能，并调整了方法来击败它。规避传感器的主要手段之一是使用 `polymorphic code`（多态代码），即定期更改的代码。这些更改或变异的设计目的不是影响代码的功能，而是为了掩盖任何特征以防止被检测。多态程序可以在每次使用后更改其编码，使得从检测的角度来看，每个复制品都是不同的。\n\
  \n### 加壳病毒\n\n当发现新形式的恶意软件/病毒时，防病毒公司和安全研究人员会对程序进行反编译，尝试对其功能进行逆向工程。通过逆向工程可以确定很多信息，例如恶意软件来自哪里、如何工作、如何通信的、如何传播等。加壳恶意软件可以使确定这些信息的过程变得困难得多，甚至不可能。某些恶意软件（如\
  \ `Zeus`）以加密形式出现，以防止犯罪分子窃取他们所使用的恶意软件的知识产权。\n\n### 攻击方法\n\n尽管黑客和病毒在新闻中受到关注，但它们并不是攻击计算机系统和网络的唯一方法。本节介绍了每天计算机和网络遭受攻击的许多不同方式。每种类型的攻击都会威胁到三个安全要求之一：机密性、完整性和可用性（安全的\
  \ CIA 三要素）。\n\n从高层角度来看，对计算机系统和网络的攻击可以分为大类：针对特定软件（如应用程序或操作系统）的攻击，以及针对特定协议或服务的攻击。针对特定应用程序或操作系统的攻击通常是因为代码中的（可能也包括测试中的）疏忽，或者是因为代码中的缺陷或漏洞（再次表明缺乏彻底测试）。针对特定协议或服务的攻击则是试图利用协议或服务的特定功能，或者以非预期的方式使用该协议或服务。本节将讨论安全专业人员需要注意的各种攻击形式。\n\
  \n### 中间人\n\n正如名称所示，`man-in-the-middle attack`（中间人攻击）通常发生在攻击者能够将自己置于两个通信的主机之间的情况下。理想情况下（从攻击者的角度来看），通过确保所有发送到目标主机或从目标主机发出的通信都通过攻击者的主机来实现（如果攻击者能够攻破目标主机的路由器，就可以实现）。攻击者可以在转发流量之前观察所有流量，并实际上可以修改或阻塞流量。对于目标主机来说，通信似乎正常进行，因为收到了所有预期的回复。图\
  \ 12-1 展示了这种攻击。\n\n![image](img/f0211-01.jpg)\n\n* * *\n\n**图 12-1** 中间人攻击\n\n实例化中间人攻击的方法有很多。一种常见方法是通过\
  \ `session hijacking`（会话劫持），这可能发生在 `cookie` 等信息被盗取时，允许攻击者冒充合法会话。这种攻击可能是跨站脚本攻击的结果，该攻击欺骗用户执行代码导致\
  \ cookie 被盗取。如果通信是加密的，那么在中间人攻击中可以获得的信息将是有限的。尽管如此，仍然可以获得敏感信息，因为知道正在进行什么通信以及在哪些个人之间进行，在某些情况下实际上提供了非常有价值的信息。\n\
  \n#### 针对加密流量的中间人攻击\n\n“中间人攻击”一词有时用于指一种更特定的攻击类型——即处理加密流量问题的攻击。在第 23 章中详细讨论的公钥加密需要两个密钥：你的公钥（任何人都可以用它来加密或“锁定”你的消息）以及你的私钥（只有你知道，并用于“解锁”或解密用你的公钥锁定的消息）。\n\
  \n如果你想和朋友 Bob 安全地通信，你可能会向他索要公钥，以便向他加密消息。反之，你也会向 Bob 提供你的公钥。攻击者可以通过拦截你向 Bob 索要公钥以及你发送公钥的过程来进行中间人攻击。攻击者会将你的公钥替换为她的公钥，并将其发送给\
  \ Bob。攻击者还会把她的公钥发送给你，而不是 Bob 的公钥。现在，当你或 Bob 加密消息时，它都将使用攻击者的公钥进行加密。攻击者现在可以拦截它、解密，然后使用适用于你或\
  \ Bob 的相应密钥重新加密并发送出去。你们双方都认为自己正在安全地传输，但实际上，你们的通信已经被破解了。设计良好的加密产品使用诸如双向认证等技术来避免这个问题。\n\
  \n### 拒绝服务\n\n拒绝服务（DoS）攻击可以利用特定应用程序或操作系统的已知漏洞，也可以攻击特定协议或服务的特性（或弱点）。在 DoS 攻击中，攻击者试图阻止授权用户访问特定信息或访问计算机系统或网络。这可以通过崩溃系统（使其离线）或通过发送大量请求导致机器过载来实现。\n\
  \nDoS 攻击的目的可能只是阻止访问目标系统，也可以与其他操作结合，以获得对计算机或网络的未经授权访问。例如，`SYN flooding`（SYN 洪水）攻击可以用于临时阻止系统服务，以便利用该系统与另一个系统之间存在的信任关系。\n\
  \nSYN 洪水是 DoS 攻击的一个示例，它利用了 TCP/IP 网络的设计方式，并可以用来说明任何 DoS 攻击的基本原理。SYN 洪水使用建立两个间连接的\
  \ TCP 三次握手。在正常情况下，第一个系统向它想要通信的系统发送 `SYN` 数据包。如果第二个系统能够接受请求，它会响应 `SYN/ACK`。当初始系统接收到第二个系统的\
  \ `SYN/ACK` 时，它会响应一个 `ACK` 包，然后通信就可以进行。这一过程在图 12-2 中所示。\n\n![image](img/f0212-01.jpg)\n\
  \n* * *\n\n**图 12-2** TCP 三次握手\n\n\n\n\n\n在 SYN 洪水攻击中，攻击者向目标系统发送伪造的通信请求。这些请求中的每一个都会得到目标系统的响应，目标系统会等待握手的第三部分。由于请求是伪造的（请求中使用了一个不存在的\
  \ IP 地址，因此目标系统正在响应一个不存在的系统），目标将等待永远不会等来的响应，如图 12-3 所示。目标系统会在特定的超时后丢弃这些连接，但如果攻击者发送请求的速度快于超时消除它们的速度，系统将很快被请求充满。系统能够支持的连接数是有限的，因此当进入的请求超过可处理的数量时，系统很快就会将其所有连接留给伪造请求。此时，任何进一步的请求将直接被丢弃（忽略），想要连接到目标系统的合法用户将无法连接，因为他们被拒绝使用该系统。\n\
  \n![image](img/f0213-01.jpg)\n\n* * *\n\n**图 12-3** SYN 洪水 DoS 攻击\n\n另一种简单的 DoS\
  \ 攻击是臭名昭彰的死亡之包（POD），它说明了另一种类型的攻击——针对特定应用程序或操作系统的攻击，而 SYN 洪水攻击是针对协议的。在 POD 攻击中，攻击者发送一个互联网控制消息协议（ICMP）ping\
  \ 包，大小等于或超过 64KB（这意味着大于 64 × 1024 = 65,536 字节）。这种类型的数据包不应该自然产生（没有理由让一个 ping 包大于\
  \ 64KB）。某些系统无法处理这种大小的数据包，会导致系统挂起或崩溃。\n\n## 分布式拒绝服务\n\nDoS 攻击使用单个攻击系统进行。使用多个攻击系统进行的\
  \ DoS 攻击被称为分布式拒绝服务（DDoS）攻击。DDoS 攻击的目标同样拒绝使用或访问特定的服务或系统。DDoS 攻击在 2000 年因对 eBay、CNN、Amazon\
  \ 和 Yahoo! 的广受关注的攻击而闻名。\n\n在 DDoS 攻击中，通过来自许多不同系统的流量淹没目标来拒绝服务。攻击者会创建一个攻击代理网络（有时称为\
  \ `zombies`，僵尸），在收到攻击者的攻击命令后，攻击代理开始向目标发送特定类型的流量。如果攻击网络足够大，即使是普通的网络流量也能迅速淹没最大的网站，例如\
  \ 2014 年初的 400-Gbps CloudFlare 攻击。\n\n创建一个 DDoS 网络并非易事。攻击代理不是自愿的——它们是已经被攻破并安装了 DDoS\
  \ 攻击软件的系统。要攻破这些代理，攻击者必须获得对系统的未经授权的访问，或者欺骗授权用户运行安装了攻击软件的程序。攻击网络的创建实际上可能是一个多步骤，攻击者首先攻破几个系统，然后将它们用作\
  \ `handlers`（处理节点）或 `masters`（主节点），进而攻破其他系统。一旦网络建立，代理就会在发起攻击之前等待包含特定目标数据的攻击消息。DDoS\
  \ 攻击的一个重要方面是，仅需向代理发送几条消息，攻击者就可以让向目标系统发送大量的消息。图 12-3DDoS 攻击的一个重要方面是，仅需向代理发送几条消息，攻击者就可以让向目标系统发送大量的消息。\n\
  \n![image](img/f0213-01.jpg)\n\n* * *\n\n**图 12-3** SYN 洪水 DoS 攻击\n\n如何停止或缓解 DDoS\
  \ 攻击？一个重要的预防措施是确保修补了 `vulnerability`（漏洞）。许多当前的防病毒/间谍软件安全工具会检测已知的 `zombie` 类型感染。然而，这种方法的问题在于，它不是你防止攻击的方法——而是你对自己的网络采取的操作。你必须依靠网络管理员社区测试他们的系统，以防止针对你系统的攻击。\n\
  \n你应该考虑的另一个可以解决多种形式 DDoS 攻击的选项是在你的边界阻塞 `ICMP` 包。但在实施这种方法之前，请仔细考虑，因为它也会阻止可能实用的工具的使用。\n\
  \n### 重放\n\n`replay attack`（重放攻击）发生在攻击者捕获双方之间通信的一部分并在稍后重新发送时。例如，攻击者可能会重放用于金融交易的系列命令和代码，导致交易执行多次。通常，重放攻击与尝试绕过身份验证机制有关，例如证书或票据的捕获和重用。\n\
  \n防止重放攻击的最佳方法是加密、加密认证和时间戳。如果证书或票据的一部分包含加密的时间戳，那么稍后重放它将是徒劳的，因为它将由于过期而被拒绝。\n\n###\
  \ 欺骗\n\n`Spoofing`（欺骗）仅仅是让数据看起来像是来自不同的源。这在 `/IP` 中是可能的，因为协议背后的友好假设。在开发这些协议时，假设能够访问网络层的人员是可以信任的特权用户。\n\
  \n\n\n\n\n当数据包从一个系统发送到另一个系统时，它不仅包含目标 IP 地址和端口，还包含源 IP 地址。你本应该在源地址处填写自己的地址，但没有什么能阻止你填写另一个系统的地址。这是几种欺骗（spoofing）形式中的一种。\n\
  \n### 电子邮件欺骗\n\n在电子邮件欺骗中，发送的消息的 `From`（发件）地址与发送系统的地址不同。使用几种不同的程序可以轻松实现这一点。为了演示伪造电子邮件地址有多简单，你可以\
  \ `Telnet` 连接到邮件服务器上的 `25` 端口（与电子邮件相关的端口）。从那里，你可以为消息的 `From`（发件）和 `To`（收件）部分填写任何地址，无论这些地址是否属于你，也无论它们是否真实存在。\n\
  \n你可以使用几种方法来判断一封邮件可能不是由其声称的来源发送的，但大多数用户并不会质疑自己的邮件，并接受它们看起来源自的地方。不过，电子邮件欺骗的一种变体（虽然在技术上不属于欺骗）是攻击者获取一个与他们想要伪造的\
  \ URL 类似的 URL，这样从他们系统发送的电子邮件看起来就像是来自官方网站——直到你仔细阅读地址为止。例如，如果攻击者想要伪造拥有 `[XYZ.com](http://www.XYZ.com)`\
  \ 的 `XYZ Corporation`，攻击者可能会获得 URL `[XYZ.Corp.com](http://www.XYZ.Corp.com)` 的访问。接收来自伪造公司网站消息的人通常不会怀疑它是欺骗，而是认为它是官方的。同样的方法也可以、也已经被用于伪造网站。最著名的例子可能是\
  \ `[www.whitehouse.com](http://www.whitehouse.com)`。`[www.whitehouse.gov](http://www.whitehouse.gov)`\
  \ 网站是白宫的官方网站。而 `[www.whitehouse.com](http://www.whitehouse.com)` URL 会带你进入色情网站。在这种情况下，可能没人会将该网站视为官方政府网站，而且它的目的也不是为了这样理解。然而，如果攻击者让他们伪造的网站看起来与官方网站相似，他们就可以说服许多潜在观众他们正处于官方网站。\n\
  \n### IP 地址欺骗\n\nIP 的设计旨在让任何 IP 包的发送者在数据包的 `From` 部分包含自己的 IP 地址。虽然这是设计意图，但没有什么能阻止系统在数据包的\
  \ `From` 部分插入不同的地址。这被称为 `IP 地址欺骗`。IP 地址可能由于多种原因而被欺骗。\n\n### Smurf 攻击\n\n在一种名为 `Smurf`\
  \ 攻击的特定 DoS 攻击中，攻击者向网络的广播地址发送伪造的数据包，该数据包会分发到该网络上的所有系统。在 Smurf 攻击中，攻击者发送到广播地址的数据包回显请求（echo\
  \ request），其 `From` 地址经过伪造，使其看起来是另一个系统（目标系统）发出的回显请求。系统对回显请求的正常响应是回显回复（echo reply），它用于\
  \ `ping` 工具让用户知道远程系统是否可访问以及是否有响应。在 Smurf 攻击中，请求被发送到网络上的所有系统，因此所有系统都会向目标系统响应回显回复，如\
  \ `图 12-5` 所示。攻击者发送了一个数据包，就能产生多达 254 个针对目标的响应。如果攻击者发送多个此类伪造请求，或将其发送到几个不同的网络，目标可能会因为收到的回显回复数量而迅速瘫痪。\n\
  \n![image](img/f0217-01.jpg)\n\n* * *\n\n**图 12-5** 用于 Smurf DoS 攻击的欺骗\n\n* * *\n\
  \n![image](img/examtip.jpg)\n\n**考试要点** Smurf 攻击允许攻击者利用网络结构向受害者发送大量数据包。通过向一个以受害者为源地址的广播\
  \ IP 地址发送 `ICMP` 请求，大量的回复将淹没受害者系统。\n\n### 欺骗与信任关系\n\n欺骗还可以利用两个系统之间的`信任关系`（trusted\
  \ relationship）。如果两个系统被配置为接受对方完成的身份验证，那么登录到其中一个系统的个人可能不需要再次通过身份验证过程即可访问另一个系统。攻击者可以通过向一个系统发送一个看起来来自受信任系统的数据包来利用这种安排。由于信任关系的存在，目标系统可能会在不进行身份验证的情况下执行请求的任务。\n\
  \n由于一旦收到数据包通常会发送回复，因此被冒充的系统可能会干扰攻击，因为它将收到一个它从未发送过的请求的确认。攻击者通常会先发起 DoS 攻击（例如 `SYN\
  \ 泛滥攻击`），在攻击者利用信任关系期间临时禁用被伪造系统。一旦攻击完成，对伪造系统的 DoS 攻击就会终止，管理员除了发现一个暂时无响应的系统外，可能永远不会察觉到攻击的发生。`图\
  \ 12-6` 展示了一个包含 `SYN 泛滥攻击`的欺骗攻击。\n\n![image](img/f0218-01.jpg)\n\n* * *\n\n**图 12-6**\
  \ 利用信任关系的欺骗\n\n由于这类攻击，鼓励管理员严格限制主机之间的任何信任关系。防火墙还应配置为丢弃任何来自防火墙外部但源地址显示来自网络内部的数据包（这种情况不应发生，且表明存在欺骗尝试）。\n\
  \n## 欺骗与序列号\n\n欺骗的复杂程度很大程度上取决于几个因素，包括流量是否加密以及攻击者相对于目标的位置。例如，从网络内部进行欺骗攻击比从网络外部进行要容易得多，因为内部攻击者可以观察进和目标的流量，并能更好地构造必要的数据包。\n\
  \n对于外部攻击者来说，构造数据包更为复杂，因为序列号与 `TCP` 数据包相关。序列号是由发送主机建立的 32 位数字，每发送一个包都会递增。包并不保证按顺序接收，序列号可以帮助在接收时对包进行排序，并引用传输过程中可能丢失的数据包。\n\
  \n在 TCP 三次握手中，会创建两组序列号，如 `图 12-7` 所示。第一个系统为原始 `SYN` 数据包选择一个序列号。接收此 `SYN` 数据包的系统通过\
  \ `SYN/ACK` 进行确认。它回传一个确认号，该号基于第一个序列号加一（即它将收到的序列号加一）。然后它还创建了自己的序列号并随之发送。原始系统接收到带有新序列号的\
  \ `SYN/ACK`。它将序列号加一，并将其作为响应的 `ACK` 数据包中的确认号。\n\n\n\n\n\n从网络内部和外部尝试欺骗攻击的难度差异在于对序列号的确定。如果攻击者位于网络内部，并且可以观察到目标主机做出响应的流量，那么攻击者就能轻松地看到系统生成的序列号，并使用正确的序列号进行响应。如果攻击者位于网络外部，且没有观察目标系统生成的序列号，攻击者几乎不可能提供正确序列号的最终\
  \ ACK。因此，攻击者必须猜测序列号可能是什么。\n\n序列号在某种程度上是可以预测的。每个会话的序列号并非从同一个数字开始，因此来自不同并发连接的不同数据包不会具有相同的序列号。相反，每个新连接的序列号会增加一个很大的数字，以保持数字不相同。序列号可能每秒（或或其他时间段）增加一个很大的数字。外部攻击者必须确定用于这些增量的取值是什么。攻击者可以通过在不同的时间间隔上尝试连接，观察序列号是如何增加的来实现这一点。一旦确定了模式，攻击者就可以尝试建立合法连接以确定当前值，然后立即尝试欺骗连接。欺骗连接的序列号应该是合法连接加上已确定的值或多个值。\n\
  \n序列号在会话劫持中也非常重要，该内容在本章的“TCP/IP 劫持”部分进行了讨论。\n\n### 垃圾邮件 (Spam)\n\n尽管通常不被认为是社会工程学问题，也不是安全问题，但垃圾邮件确实可能成为安全隐患。正如大家所知的，`spam`\
  \ 是大量未经请求的电子邮件。它在某种意义上可能是法的，因为它是由广告产品或服务的公司发送的，但它可能是恶意的，可能包含旨在破坏你系统的恶意软件附件，或者指向可能尝试从你处获取个人信息的恶意网站链接。\n\
  \n## 垃圾信息 (Spim)\n\n虽然不广为人知，但垃圾邮件的一种变体是 `spim`，它基本上是通过 Yahoo! Messenger 或 AOL Instant\
  \ Messenger (AIM) 等即时消息应用程序发送的垃圾信息。恶意 spim 的目的与垃圾邮件相同——即传递恶意内容或链接。\n\n## 网络钓鱼 (Phishing)\n\
  \n`phishing`（读音为 fishing”）是一种社会工程攻击，攻击者试图通过在发送给大量通常随机用户的电子邮件或即时消息中伪装成受信任的实体，从而从用户处获取敏感信息。攻击者试图获取用户名、密码、信用卡号以及用户银行账户详情等信息。发送的消息通常鼓励用户访问一个看起来像\
  \ PayPal 或 eBay 等信誉良好的实体的网站，这两个实体都经常被用于钓鱼尝试。然而，用户实际访问的网站并不属于该信誉良好的组织，而是要求用户提供可在稍后攻击中使用的信息。通常，发送给用户的消息会声称用户的账户已被入侵，并出于安全考虑要求用户输入其账户信息以验证详情。\n\
  \n网络钓鱼的另一个非常常见的例子是，攻击者发送一封据称来自银行的大群邮件，告诉收件者发生了安全泄露，并指示他们点击链接以验证其账户是否未被篡改。如果个人确实点击了该链接，他们将被带到一个看起来由银行所有、但实际上由攻击者控制的网站。当他们出于“验证”目的提供账户和密码时，他们实际上是将这些信息交给了攻击者。\n\
  \n## 鱼叉式钓鱼 (Spear Phishing)\n\n`spear phishing` 是一个术语，指针对具有共同特征的特定群体的钓鱼攻击。通过针对特定群体，成功攻击的比例（即收到的响应数量）与发送的电子邮件或消息总数之比通常会增加，因为针对性攻击看起来比随机发送给用户的消息更具合理性。\n\
  \n### 语音钓鱼 (Vishing)\n\n`vishing` 是钓鱼的一种变体，它利用语音通信来获取信息。语音钓鱼利用了人们对电话网络的信任。用户并不知道攻击者可以使用\
  \ IP IP (`VoIP`) 技术伪造（模拟）合法实体的电话。语音消息也可以被破坏并用于这些尝试。通常，攻击者希望获取信用卡号或其他可用于身份盗窃的信息。用户可能会收到一封邮件，要求他们拨打一个可能被破坏的语音系统的电话。如果用户收到声称来自信誉良好的实体并要求敏感信息，不应提供，而应通过互联网或检查账户账单来找到联系电话。用户随后可以验证收到的消息是否合法或报告该钓鱼尝试。\n\
  \n## 圣诞树攻击 (Xmas Attack)\n\n`xmas` `attack` 或圣诞树攻击源于特定的协议选项。圣诞树数据包是一个所有选项都开启的数据包。这个名字源于这些数据包像圣诞树一样点亮的说法。当作为扫描发送时，圣诞树数据包设置了\
  \ `FIN`、`URG` 和 `PSH` 选项。许多操作系统实现遵循 IP 数据包规范的 `RFC 791` 的方式略有不同。它们对数据包的响应可以告诉扫描器存在什么操作系统。另一种情况是在\
  \ DoS 攻击中，圣诞树数据包会消耗更多的路由器处理，消耗资源。\n\n简单的无状态防火墙检查设置的 `SYN` 标志以防止 SYN 洪水，而圣诞树数据包设计为不设置\
  \ `SYN`，因此可以跳过这些设备。新的安全设备（如高级防火墙）可以检测这些数据包，提醒人们注意扫描活动。\n\n## 入站 (Pharming)\n\n`pharming`\
  \ 包括将用户重定向到看起来官方的虚假网站。通过钓鱼，个人被逐一针对。要成为受害者，接收者必须采取行动（例如通过提供个人信息做出响应）。在注入过程中，由于 DNS\
  \ 污染（更改服务器域名表中 URL 的攻击）或修改本地主机文件（用于将 URL 转换为相应的 IP 地址）等活动，用户将被引导至虚假网站。一旦进入虚假网站，用户可能会认为那是合法站点而提供个人信息。\n\
  \n### 权限提升 (Privilege Escalation)\n\n网络攻击是一个多步骤的过程。大多数攻击从与普通用户相关的权限级别开始。从该级别开始，攻击者利用漏洞获得\
  \ root 或管理员权限的访问权限。攻击链中的这一步被称为权限提升（`privilege escalation`），对于许多攻击努力至关重要。\n\n\n\n\
  \n实现权限提升有几种方法。其中一条路径是利用现有权限并执行能够允许你窃取更高级凭据的操作。使用嗅探器抓取凭据、获取 `SAM` 或 `/etc/passwd`\
  \ 文件，是获取“更高级”凭据的一种方法。另一种方法是通过以特权权限运行的进程中的漏洞或缺陷。在这些进程中注入恶意代码也可以实现权限提升。\n\n***\n\n\
  ![image](img/examtip.jpg)\n\n**考试贴士** 阻止权限提升是系统防御中重要的一个步骤。这也是微软最近减少在特权模式下运行的进程和服务的背后的原理。这极大地减少了攻击者执行这一关键任务时可利用的攻击面。\n\
  \n#### 恶意内部威胁\n系统上的所有活动都在一个账户名下进行。账户定义了分配给用户的权限级别。用户之所以拥有这些访问权限，是因为他们执行职责时需要信任，而这种信任反映在赋予其账户的权限中。当内部人员进行恶意活动时，他们是在滥用这种信任。但他们也比外部攻击者具有显著优势，因为他们拥有系统上的基本权限。在攻击链中，早期的步骤之一（有时也是困难的步骤）是在系统上建立基本用户访问权限。恶意内部威胁本质上是从完成这一步开始的。\n\
  \n如果恶意内部人员具有特权权限（例如系统管理员），那么这种形式的攻击可能特别别有害。具有 root 级访问权限和技术的恶意内部人员可以绕过许多安全措施，并在避免检测的情况下执行许多破坏性任务。最近美国安全局（NSA）内部人员爱德华·斯诺登（Edward\
  \ Snowden）的案例表明，这种攻击向量对组织具有多大的破坏性。\n\n针对内部人员的最佳防御是由两部分组成的层次防御。第一是通过 HR 对新员工进行筛选，并监控员工的活动和士气。另一个工具是职责分工。确保系统管理员没有操作其所管理系统日志的能力，可以通过多个日志服务器和多组管理控制来实现。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试贴士** 管理恶意内部人员问题是 HR 人员管理与技术层面职责分工的结合。\n\
  \n#### 缓存中毒\n许多网络活动依赖各种地址方案才能正常工作。当你通过输入银行的 URL 访问银行网站时，浏览器会查询系统的 DNS 系统将单词转换为数字地址。当数据包通过网络交换到你的机器时，会涉及到一系列地址缓存。无论缓存是用于\
  \ DNS 系统还是 ARP 系统，其存在的原因都是相同的：效率。这些缓存防止了重复的冗余查询，为系统节省时间。但它们也可能被中毒，向终端用户的应用程序发送错误信息、重定向流量并改变系统行为。\n\
  \n###### DNS 中毒\nDNS 系统用于将名称转换为 IP 地址。并不是一个单一的 DNS 系统，而是一个 DNS 服务器层级结构，从互联网骨干网上的根服务器，到你\
  \ ISP 处的副本、你的家庭路由器和你的本地机器，每个节点都以 DNS 缓存的形式存在。要检查特定地址的 DNS 查询，你可以使用 `nslookup` 命令。图\
  \ 12-8 显示了在 Windows 机器上执行的一系列 DNS 查询。在第一次请求中，DNS 服务器位于 ISP，而在第二次请求中，DNS 服务器来自 VPN\
  \ 连接。在两次请求之间，网络连接发生了变化，导致了不同的 DNS 查询结果。这是一种 DNS 中毒攻击。\n\n![image](img/f0223-01.jpg)\n\
  \n***\n\n**图 12-8** DNS 查询的 `nslookup`\n\n有时，`nslookup` 将返回一个非权威答案，如图 12-9 所示。这通常意味着结果来自缓存，而不是具有权威（即已知是实的）答案的服务器。\n\
  \n![image](img/f0224-01.jpg)\n\n***\n\n**图 12-9** 对 DNS 查询的缓存响应\n\n你可以使用其他命令来检查和操作系统上的\
  \ DNS 缓存。在 Windows 中，`ipconfig /displaydns` 命令将显示机器上当前的 DNS 缓存。图 12-10 显示了一个小型 DNS\
  \ 缓存。该缓存最近使用 `ipconfig /flushdns` 命令清空了，以便在屏幕上显示。\n\n![image](img/f0224-02.jpg)\n\
  \n***\n\n**图 12-10** 对 DNS 表查询的缓存响应\n\n将 DNS 看作一个完整的系统，可以看出它存在从顶部（根服务器）到单台机器缓存的层级结构。DNS\
  \ 中毒可能发生这些层级中的任何一级，中毒的影响随着发生位置越高而越广。2010 年，一次 DNS 中毒事件导致“中国防火墙”审查了美国的互联网流量。\n\n\
  DNS 中毒是一类被称为 `DNS 欺骗` 的更大攻击类中的变体。在 DNS 欺骗中，攻击者通过许多方式更改 DNS 记录，其中包括破坏 DNS 服务器、Kaminsky\
  \ 攻击以及使用虚假网络节点。攻击者甚至可以使用 DNS 缓存中毒导致 DNS 欺骗。通过中毒上游缓存，所有下游用户将获得被欺骗的信息。\n\n由于 DNS 请求和响应的重要性，一个项目开始使用数字签名来保护\
  \ DNS。该项目由美国政府发起并称为域名安全扩展 (`DNSSEC`) 通过对记录进行数字签名来工作。这是通过向 DNS 系统添加密钥和证明密钥有效性的签名来实现。有了这些信息，请求者可以确保他们收到的信息是正确的。该新系统需要大量时间（几年）传播到整个\
  \ DNS 基础设施，但最终系统将获得更大的保障。\n\n###### ARP 中毒\n在机器之间移动数据包时，设备有时需要知道如何使用 MAC 或二层地址发送数据包。地址解析协议\
  \ (`ARP`) 通过四种基本消息类型解决这个问题：\n\n- `ARP 请求`：“谁拥有此地址？”\n- `ARP 响应`：“我有该 IP 地址，我的 MAC\
  \ 地址是……”\n- `反向 ARP 请求 (RARP)`：“谁拥有此 MAC 地址？”\n- `RARP 响应`：“我有该 MAC 地址，我的 IP 地址是……”\n\
  \n这些消息与设备的 ARP 表结合使用，ARP 表是存储与这些数据元素相关的内存的地方。这些命令被用作简单的查找。当机器向网络发送 ARP 请求时，响应会被所有听到该响应的设备接收并记录。这有利于高效的地址查找，但也使系统容易受到攻击。\n\
  \n当 ARP 表收到响应时，它会自动信任该响应并更新表格。某些操作系统甚至在从未听到过原始请求的情况下也会接受 ARP 响应数据。目前没有机制可以验证收到的数据的真实性。攻击者可以发送消息、破坏\
  \ ARP 表并导致数据包被错误路由。这种攻击形式被称为 ARP 中毒，会导致恶意地址重定向。这允许一种机制，使得攻击者可以插入到两台机器之间的对话中间，即中间人攻击。\n\
  \n#### TCP/IP 劫持\n\n\n\n\n\n`TCP/IP hijacking` 和 `session hijacking` 是用于指代接管客户端与服务器之间已存在会话的术语。对于攻击者而言，相比尝试渗透计算机系统或网络，劫持的优势在于攻击者不需要绕过任何验证机制，因为用户已经通过了验证并建立了会话。一旦用户完成了验证序列，攻击者就可以夺取会话并继续操作，就好像是攻击者而不是用户对系统进行了验证一样。为了防止用户察觉到任何异常，攻击者可以决定攻击用户的系统并对其进行\
  \ `DoS` 攻击，使其宕机，这样用户和系统就不会注意到正在发生的额外流量。\n\n劫持攻击通常用于 Web 和 Telnet 会话。用于身份欺骗的序列号也适用于会话劫持，因为劫持者需要提供正确的序列号来继续相应的会话。\n\
  \n### 传递性访问\n\n`Transitive access` 是一种通过破坏机器之间的信任关系来攻击系统的方法。一个简单的例子是：服务器受到了良好的保护，而客户端没有，且服务器信任客户端。在这种情况下，攻击客户端可以获得对服务器的传递性访问。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 了解如何通过毒化地址机制执行劫持攻击对于考试至关重要。\n\n###\
  \ 客户端攻击\n\n网页浏览器已成为用户跨 Web 参与资源的主要应用程序。该界面的流行和实用性使其成为攻击者获取系统访问控制权的首要目标。通过浏览器可以发生各种攻击，通常是由于在使用输入前未能对其进行妥当验证。未验证的输入可能导致一系列注入攻击、头部操作以及其他形式的攻击。\n\
  \n#### 注入攻击\n\n当在不进行输入验证的情况下使用用户输入时，为攻击者提供了了机会，通过构造输入以便在输入被应用程序解析和使用时触发特定事件。`SQL\
  \ 注入攻击` 涉及对输入的操纵，导致产生与设计者意图不同的 `SQL` 语句。`XML` 和 `LDAP` 注入也是以此方式完成。由于 `SQL`、`XML`\
  \ 和 `LDAP` 用于存储数据，这可能让攻击者获取违反业务规则的数据。`命令注入攻击` 发生在输入以一种允许命令行操纵的方式被使用时。这可以让攻击者在应用程序的权限级别上获得命令行访问权限。\n\
  \n#### 头部操作\n\n当通过用户输入动态生成 `HTTP` 时，未验证的输入可以给攻击者更改 `HTTP` 元素的机会。当用户提供的信息用在头部中时，可能会创建各种攻击，包括缓存投毒、跨站脚本、跨用户篡改、页面劫持、Cookie\
  \ 操纵或开放重定向。\n\n### 密码攻击\n\n最常见的验证形式是用户 ID 和密码的组合。虽然这在本质上不是一种糟糕的身份验证机制，但这种组合可以以多种方式受到攻击。很多时候，这些攻击为攻击者带来了有利的结果，这并不是因为方案本身有缺陷，而通常是因为用户没有遵循良好的密码规范。\n\
  \n#### 糟糕的密码选择\n\n在各种密码攻击技术中，技术性最低的一种是攻击者简单尝试猜测系统或网络授权用户的密码。这种简单的方法竟然如此有效，令人惊讶，原因在于人们因选择糟糕密码而臭名昭著。用户需要选择他们能记住的密码，因此他们创建了简单的密码，例如生日、母亲的娘姓、配偶或孩子的名字，甚至直接使用用户\
  \ ID 本身。攻击者只需要在开始猜测之前获得有效的用户 ID（这通常是简单的事，因为组织倾向于以某种组合使用个人姓名——例如，名字的首字母加上姓氏）以及关于用户的一点信息即可。组织有时会通过在其网站上发布其“管理团队”和其他个人的姓名（有时还附有简短介绍），让攻击者更容易获取此类这类信息。\n\
  \n即使某人没有使用某些个人细节作为密码，攻击者可能仍然好运，因为许多人使用常用单词作为密码。攻击者可以获得常用密码列表——互联网上存在许多此类列表。像“password”和“secret”之类的单词经常被用作密码。喜欢的运动队名称也经常出现在常用密码列表中。\n\
  \n### 字典攻击\n\n确定密码的另一种方法是使用密码破解程序，该程序使用字典单词列表来尝试猜测密码，因此被称为 `dictionary attack`（字典攻击）。单词可以单独使用，也可以将两个或多个较小的单词组合成一个单一可能的密码。许多商业和公有域的密码破解程序采用多种方法来破解密码，包括使用用户\
  \ ID 的变体。\n\n这些程序通常允许攻击者创建各种规则，告诉程序如何组合单词以形成新的可能的密码。用户通常用特定的数字代替特定的字母。例如，如果用户想用\
  \ `secret` 作为密码，可以将字母 `e` 替换为数字 `3`，产生 `s3cr3t`。这个密码不会出现在字典中，因此纯字典攻击无法破解它，但这个密码对用户来说仍然很容易。然而，如果创建一个规则尝试字典中的所有单词，然后用数字\
  \ `3` 代替字母 `e`，密码就会被破解。\n\n规则还可以被定义让破解程序用特殊字符替换其他字符或组合单词。攻击者破解密码的能力取决于用户创建密码的方法，以及所使用的字典和规则。\n\
  \n### 暴力破解\n\n如果用户选择的密码不在字典中，即使用各种数字或特殊字符代替字母，破解密码的唯一方法是攻击者尝试 `brute-force attack`（暴力破解），密码破解程序尝试所有可能的密码组合。\n\
  \n密码的长度和密码中可能字符集的大小将极大影响暴力破解所需的时间。几年前，这种攻击方法非常耗时，因为生成所有组合需要大量时间。然而，随着计算机速度的提高，生成密码组合的速度快得多，使得对某些计算机系统和网络发起暴力破解变得更加可行。\n\
  \n对密码的暴力破解可以在两个层面进行：它可以攻击攻击者在登录提示处尝试猜测密码系统，也可以攻击密码文件中包含的密码哈希值列表。如果账户在几次登录尝试后锁定，则第一种攻击会变得更加困难。如果密码文件维护良好，他人无法获取其副本，则第二种攻击就可以被阻止。\n\
  \n#### 混合攻击\n\n\n\n\n\n`hybrid`（混合型）密码攻击是一种结合了上述方法的系统。大多数破解工具都内置了此选项，首先尝试字典攻击，然后转向暴力破解方法。\n\
  \n## 生日攻击\n\n`birthday attack`（生日攻击）是一种特殊的暴力破解攻击，其名称源于所谓的“生日悖论”。该悖论指出，在至少有 23 个人的群体中，至少两个个人生日相同的概率大于\
  \ 50%。在数学上，我们可以使用方程 `1.25*k*^(1/2)`（其中 `k` 等于可能值集合的大小），在生日悖论中，`k` 等于 365（可能的生日数量）。这种现象同样适用于密码，此时\
  \ `k`（密码数量）要比大得多。\n\n## 彩虹表\n\n`rainbow tables`（彩虹表）是与密码关联的预计算表或哈希值。这可以将密码的搜索从一个计算问题变为查找问题。这可以极大地减少攻击密码时的工作量。针对彩虹表的最佳防御是加盐哈希（salted\
  \ hashes），因为添加盐值增加了问题的复杂性，使得预计算过程在系统之间无法复制。\n\n## 抢注攻击/URL 劫持\n\n`typo squatting`（抢注攻击）是一种利用常见拼写错误的攻击形式。如果用户输错了\
  \ URL，结果本应该是 404 错误或“未找到资源”。但如果攻击者注册了拼写错误的 URL，你就会进入攻击者的页面。这种攻击模式也被称为 `URL hijacking`（URL\
  \ 劫持）、`fake URL`（虚假 URL）或基于品牌欺骗的 `brandjacking`（品牌劫持）。\n\n攻击者追求这种攻击途径有几个原因。最明显的是作为钓鱼攻击的一种。假网站收集凭据并将其传递给真实网站，然后在获取凭据后退出对话以避免检测。它还可被用于在受害者机器上植入路式恶意软件（drive-by\
  \ malware）。它还可以通过联盟网络传输数据包，根据拼写错误赚点击收益。使用虚假 URL 作为起点还可以实施许多其他形式的攻击。\n\n## 水坑攻击\n\
  \n最广为人知的攻击向量是那些直接针对目标的攻击。由于其具有进入性和直接性，防御措施是为检测和防御它们而设计的。但如果用户通过访问网站“主动请求”了攻击呢？就像猎人坐在水坑旁等待动物来喝一样，攻击者可以在用户可能经常访问的网站放置恶意软件。水坑攻击（watering\
  \ hole attacks）最早由 RSA 发现，涉及用恶意软件感染目标网站。在检测到的某些案例中，感染被限制在特定的地理区域。这些不是简单的攻击，但对于向特定的终端用户组传递恶意软件可能非常有效。水坑攻击实现起来复杂，并且似乎有国家级或其他高资源攻击者的支持。鉴于其风险之大，典型的攻击向量将是零日攻击，以进一步避免检测。\n\
  \n## 本章复\n\n在本章中，你熟悉了攻击和恶意软件的原理。本章从检查各种形式的恶意软件开始。这些形式中的每一种都符合攻击的某种目的或某种漏洞的类型。涵盖的形式包括作为常见攻击向量代理的蠕虫、病毒、特洛木马、后门和逻辑炸弹。广告软件、间谍软件和勒索软件是针对特定目的的恶意软件的特征。还涵盖了更先进、复杂的根内核（rootkits）、僵尸网络（botnets）、多态（polymorphic）和加固（armored）恶意软件。\n\
  \n转向攻击类型，本章展示了大量的当前攻击模式。从拒绝服务（DoS）和分布式拒绝服务（DDoS），到欺骗（spoofing）、钓网（pharming）和权限提升（privilege\
  \ escalation），这些攻击形式是实现目的的技术手段。中间人攻击（Man-in-the-middle）、钓鱼（phishing）、叉式钓鱼（spear\
  \ phishing）、语音钓鱼（vishing）、垃圾邮件（spam）和垃圾信息（spim）是实现恶意软件传递的其他途径。\n\n## 问题\n\n为了帮助你进一步准备考试，并测试你的准备程度，请回答以下问题，然后与章节末尾的答案进行对比。\n\
  \n**1**. 你的朋友推荐了一个帮助组织播放列表的免费软件包。你尝试了，它很棒——除了每次启动时都必须等待 30 秒让产品视频结束才能使用。这种软件被称为：\n\
  A. DNS 重定向器\nB. 广告软件\nC. 臃肿软件 (Bloatware)\nD. 浏览器劫持程序\n\n**2**. 在检查网络数据包捕获时，你注意到有大量设置了\
  \ URG、PUSH 和 FIN 标志的数据包。你在该数据包捕获中看到的是什么流量？\nA. 僵尸网络控制通道\nB. Smurf 攻击\nC. 圣诞攻击 (Xmas\
  \ attack)\nD. 重放攻击\n\n**3**. 如果攻击者能够插入你与安全服务器之间的加密对话中，他执行了什么类型的攻击？\nA. Smurf 攻击\n\
  B. 重放攻击\nC. 点击劫持攻击\nD. 中间人攻击\n\n**4**. 你的整个办公室都在传一个关于跳舞小鼠的 PPT。大家觉得它很棒，直到第二天早上所有人的硬盘似乎都被擦除了。跳舞的小鼠是典型的：\n\
  A. 病毒\nB. 特洛木马\nC. 根内核\nD. 漏洞\n\n**5**. 你的朋友的电脑显示出一个弹窗，写着“警告！您的计算机已被用于非法活动并已锁定。要访问您的计算机必须支付罚款……”你朋友无法消除弹窗，也无法使用电脑。你朋友的电脑感染了什么？\n\
  A. 勒索软件\nB. 根内核\nC. 僵尸网络\nD. 臃肿软件\n\n**6**. 你在 4 月 1 日启动电脑，出现一个大弹窗写着“哈 哈”，下面是小丑的脸。当弹窗消失后，桌面上的图标都消失了。你感染了什么类型的恶意软件？\n\
  A. 根内核\nB. 加固病毒\nC. 广告软件\nD. 逻辑炸弹\n\n**7**. Smurf 攻击是哪种攻击的例子？\nA. DDoS\nB. DoS\n\
  C. SQL 注入\nD. 点击劫持\n\n**8**. 你的组织被一种无法清除的恶意软件感染了。似乎每清理一个系统并更新组织内所有的杀毒定义，另一个系统就会显示感染迹象。在这个例子中，你可能面临哪种恶意软件？\n\
  A. 多态恶意软件\nB. 特洛木马\nC. 僵尸网络\nD. Cookie 怪兽\n\n**9**. 哪种网络攻击使用有效数据传输的重复或延迟？\nA. 僵尸网络\n\
  B. 跨站脚本\nC. 令牌劫持\nD. 重放攻击\n\n**10**. `www.whitehouse.com` 是一个著名的例子：\nA. 逻辑炸弹\nB.\
  \ 抢注攻击\nC. 钓鱼\nD. 钓网\n\n\n\n\n### 11. 你所在组织的销售部门的每个人都收到一封邮件，声称他们将获得“年度最佳销售员”奖。邮件末尾有一个链接，允许他们输入希望显示在奖项上的姓名。结果证明这封邮件是伪造的，点击链接导致用户的电脑感染了恶意软件。这是哪种类型的活动？\n\
  \n**A.** 鱼叉式网络钓鱼 (Spear phishing)\n\n**B.** 欺骗 (Spoofing)\n\n**C.** 语音网络钓鱼 (Vishing)\n\
  \n**D.** 客户端攻击 (Client-side attack)\n\n### 12. 你今天注意到你所在的组织的系统出现了一些异常行为。今天早上一切运行正常，但现在当你输入公司主页的\
  \ URL 时，你看到的是一个用外语编写的网页。你所在的组织正在发生哪种攻击？\n\n**A.** 中间人攻击 (Man-in-the-middle)\n\n\
  **B.** 水坑攻击攻击 (Watering hole attack)\n\n**C.** DNS 投毒 (DNS poisoning)\n\n**D.**\
  \ 垃圾邮件 (Spam)\n\n### 13. 你的杀毒软件检测到你其中一台电脑上有恶意软件。杀毒程序告诉你是恶意软件位于某个目录，但当你去删除恶意软件时，发现该目录并不存在。这最可能是以下情况的示例：\n\
  \n**A.** 特洛木马 (A Trojan horse)\n\n**B.** 铠甲病毒 (An armored virus)\n\n**C.** 瞬态病毒\
  \ (A transient virus)\n\n**D.** 移动恶意软件感染 (A mobile malware infection)\n\n### 14.\
  \ 你想在一个系统上安装一些新软件，但你只有该系统的普通用户账户，且系统不允许你加载新软件。你的朋友给了你一个 USB 盘，有一个名为 `runme.bat`\
  \ 的程序。运行该程序后，屏幕闪烁，你打开的所有程序都关闭了，但你现在可以安装新软件了。USB 盘上的那个程序做了什么？\n\n**A.** 删除了磁盘配额 (Removed\
  \ disk quotas)\n\n**B.** 删除了不需要的文件结构 (Deleted unnecessary file structures)\n\n**C.**\
  \ 执行了权限提升 (Executed a privilege escalation)\n\n**D.** 投毒了 ARP 缓存 (Poisoned the ARP\
  \ cache)\n\n### 15. 在对你的组织进行端口扫描时，你发现一个基于 Ubuntu 的系统开启了 TCP 端口 65123。当你使用 `Telnet`\
  \ 连接到该端口时，只看到一个像 ## 的提示符。你尝试输入了几条命令，发现几乎可以在系统上执行任何事情，包括显示 `/etc/shadow` 的内容。你在这个基于\
  \ Ubuntu 的系统上发现了什么？\n\n**A.** 间谍软件 (Spyware)\n\n**B.** 后门 (Backdoor)\n\n**C.** 文件恶意软件\
  \ (Fileware)\n\n**D.** 远程访问软件 (Remote-access software)\n\n### 答案\n\n### 1. **B.**\
  \ 广告软件 (Adware) 是用于描述通常免费但包含嵌入广告或在使用软件时显示广告能力的软件的术语。通常，可以通过购买软件来移除广告功能。\n\n### 2.\
  \ **C.** Xmas 攻击（Xmas attack）使用了设置了 `URG`、`PUSH` 和 `FIN` 标志的数据包。不同设备对 Xmas 攻击的响应不同。某些系统变慢，某些会重启或崩溃，某些则完全丢弃数据包。\n\
  \n### 3. **D.** 如果攻击者能够插入加密对话的中间，并让每个受害者相信他们仍在与原始双方交谈，那么攻击者就成功执行了中间人攻击。只有当攻击者能够成功伪装对话中的两个终端时，中间人攻击才能成功。\n\
  \n### 4. **B.** 特洛木马 (Trojans) 是看似是某种东西实则做另一件事的恶意程序，并以木马命名。\n\n### 5. **A.** 你的电脑感染了勒索软件\
  \ (Ransomware)，这种软件旨在在支付赎金之前阻止访问。\n\n### 6. **D.** 逻辑炸弹 (Logic bombs) 在满足特定条件时执行。\n\
  \n### 7. **A.** 在 Smurf 攻击（水牛攻击）中，攻击者伪造 ICMP 请求并将其发送到多个地址。\n\n### 8. **D.** 分布式拒绝服务\
  \ (DDoS) 是通过流量淹没目标的一种早期攻击类型之一。\n\n### 9. **D.** 重放攻击 (Replay attack) 捕获有效数据流（如登录据）并在稍后的日期进行重放。\n\
  \n### 10. **B.** `www.whitehouse.com` 是拼写劫 (Typo squatting) 的著名示例。拼写劫涉及使用用户在访问合法网站时可能出现的拼写错误、打字错误来设置网站。\n\
  \n### 11. **A.** 鱼叉式网络钓鱼 (Spear phishing) 使用针对特定组织或组织内群欺诈电子邮件。例如，想要访问 `www.whitehouse.gov`\
  \ 的用户可能会误打 `.com` 而不是 `.gov`，从而引导至完全不同的网站。\n\n### 12. **C.** 你的组织最可能受到了 DNS 投毒攻击。在\
  \ DNS 投毒攻击中，攻击者尝试损坏 DNS 服务器或缓存，以便在 DNS 解析时返回错误的 IP 地址。\n\n### 13. **B.** 欺骗杀毒软件认为恶意软件位于一个位置而实际上位于另一个位置，是铠甲病毒\
  \ (Armored virus) 的常用技术。铠甲病毒的设计旨在更能抵抗检测、逆向工程和移除。\n\n### 14. **C.** 如果你在运行某个程序后被允许执行以前不允许执行的操作（例如安装软件），那么该程序很可能执行了权限提升攻击。权限提升攻击利用漏洞、缺陷或配置错误，允许获得普通用户通常无法获得的资源和操作权限。\n\
  \n### 15. **B.** 如果你能够通过非标准端口访问系统并绕过正常的身份验证机制，你最可能发现了一个后门 (Backdoor)。\n\n# 第 13\
  \ 章\n\n* * *\n\n## 社会工程学 (Social Engineering)\n\n在本章中，你将\n\n- 定义与社会工程学相关的基本术语\n\n\
  \n\n\n\n- 识别可能使组织信息面临风险常用用户操作\n- 识别攻击者可能用于获取组织信息的方法\n- 检查与虚拟化和云环境相关的风险\n\n***\n\n\
  社会工程学是指说服授权人员向未经授权的个人提供机密信息或访问权限的过程。这是一种攻击者使用各种欺骗手段，说服目标人物透露他们通常不会透露的信息，或说服攻击目标做一些他们通常不会做的事情。\n\
  \n### 社会工程学方法\n\n社会工程学是一种针对用户的攻击，通常涉及某种形式的社交互动。攻击中利用的弱点并不一定是技术知识方面的，甚至是安全意识方面的。社会工程学的核心在于操纵人际关系中自然的社交属性。它本质上利用了我们倾向于渴望的几种特征。例如，乐于助人是我们在团队环境中希望看到的特征之一。我们希望员工能够互相帮助，并且倾向于奖励那些乐于助人的人，惩罚那些不帮助的人。\n\
  \n如果我们的工作文化是围绕协作和团队合作的，那么这如何被利用呢？这并不简单，但可以通过一系列微妙的诡计来实现。其中一种是围绕“建立熟悉感”的概念构建——让自己看起来像属于该群体。例如，通过带着正确的措辞和准确的信息加入这段对话或相遇中，你可以让自己看起来像是他们的一员。通过巧妙地提到名人并将你的故事与当前时事和预期对齐，你就可以悄不知不觉地溜进去。另一个例子是与一个持身份证的人同时到达门口，两手里都提着东西，你可能让他们为你开门并扶住门。一种更成功的技术是在通往门的路上讨论某些能让你融入环境的话题。人们想要帮助，而这种战术赋予了他人帮助你的权力。\n\
  \n第二种方法涉及营造敌对环境。人们倾向于避免敌意，因此如果你在进入想要加入的群体时正与某人发生激烈争论——确保你不仅是在输掉争论，而且看起来还完全不公平——你瞬间就能与任何受过类似不对待的人建立联系。利用同情心、利用他们对怜情的渴望，并利用那个时刻绕过连接环节。\n\
  \n一名优秀的社会工程工程师了解如何利用肢体语言影响他人——在合适的时候微笑，如何模仿动作，如何不通过语言而通过肢体语言信号来影响他人。任何使用过肢体语言让男人做某事而无需直接请求的女性都理解这种游戏。男人也理解，他们玩这个是因为他们也试图获得一些东西。当某人拥有你项目、提案或其他任何重要事项所需的关键信息时，进行等价交换（quid\
  \ quo pro）是一种不成文的仪式。如果你对一个带有恶意的人的人这样做，请记住那句话：“提备提着礼物的希腊人。”\n\n防御社会工程学攻击的最佳方法是全面的培训和意识计划，其中包含社会工程学，但这并不意味着员工应该被训练得固执且不于助人。相反，员工应该被训练对可疑请求保持警惕，同时在适当的情况下提供帮助。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**技巧** 对于考试，请熟悉所有的社会工程学攻击及其种方法的有效性。\n\n###\
  \ 窥视 (Shoulder Surfing)\n\n`Shoulder surfing` 并不涉及与目标直接接触，而是涉及攻击者观察输入敏感信息的个人。例如，攻击者可能在用户工作时盯着看，或者可能设置摄像头或使用望远镜观察用户输入数据。攻击者可以尝试获取此类信息，如自动取款机\
  \ (`ATM`) 上的个人识别码 (`PIN`)、安全门或门口的访问控制入口代码，或电话卡或信用卡号。许多地方现在使用一个小挡板围住键盘，这样就很难观察别人输入信息的情况了。更复杂的系统实际上可以打乱数字的位置，使得顶行每次发生变化。虽然这让用户输入信息的速度变慢了一些，但它阻碍了攻击者观察按了哪些数字然后输入相同按钮/模式的企图，因为数字的位置在不断变化。\n\
  \n### 翻垃圾桶 (Dumpster Diving)\n\n在搜寻目标垃圾以希望找到可能用于渗透尝试的有价值信息的过程中，在安全社区中被称为 `dumpster\
  \ diving`。如果攻击者在目标附近，寻找信息的常见场所是目标的垃圾桶。攻击者可能会发现一些对攻击有用的零碎信息。然而，这种战术并非计算机社区所特有；多年来一直被其他人（如身份窃取者、私家侦探和执法人员）使用，以获取有关个人或组织的信息。如果攻击者非常幸运，且目标的安全程序非常糟糕，他们实际上可能会找到用户\
  \ ID 和密码。\n\n组织应该制定关于丢弃材料的政策。敏感信息应该粉碎，组织应该考虑加固垃圾桶，防止个人翻找。人们也应该考虑在自己的垃圾桶中粉碎想要丢弃的个人或敏感信息。\n\
  \n\n\n\n正如第 9 章所讨论的，尾随（tailgating，或 piggybacking）是一种紧跟在刚刚使用访问卡的人身后进入设施的简单策略。人们通常都很匆忙，往往不会遵守安全规程。攻击者可以利用这一特性，在无需访问卡或\
  \ PIN 码的情况下进入设施。这与窥视屏幕（shoulder surfing）相似，因为两者都利用了授权用户不遵守规程。经常，攻击者甚至会在到达门口之前就开始与目标交谈，以便用户在不检查身份的情况下进入。这种意义上，尾随属于社交工程攻击。\n\
  \n尾随和视视攻击技术可以通过简单的规程来应对，确保没有人紧跟在你身后或观察你的行为。这些方法都取决于授权用户不遵守规程。针对尾随的一种更复杂的防御措施是`门禁`（man\
  \ trap），在第一扇门关闭之前，第二扇门不会打开，并且门之间的间隔设置使得一次只允许一个人通过。\n\n### 伪装\n\n伪装是一种常见的社交工程技术，可以以多种方式采用。它可以发生在现场、通过电话或在线进行。在伪装攻击案例中，攻击者假冒一个被攻击者认可的角色，在假冒该角色时，攻击者利用害者的判断力偏差来不遵守规程。\n\
  \n### 第三方授权\n\n利用事先获得的关于项目、截止日期、老板等信息，攻击者带着 1) 受害者预预期或会视为正常的东西；2) 以项目遇到麻烦或其他类似情况为借口，在这种情况下攻击者会被视为乐于助人或无害的；3)\
  \ 提到“大老板”（Mr. Big），此人恰不在办公室且无法联系，从而规避身份检查。攻击者很少要求任何表面上不合理或根据情况不太可能共享的内容。这些行为可以制造出第三方授权的假象，而事实上并没有。\n\
  \n### 服务台/技术支持\n\n拨打或来自帮助台和技术支持部门的电话可以用来诱取信息。假冒成员工，你可以获取重置密码、有关系统的信息或其他有用信息。电话也可以反过来，即社交工程师假冒成帮助台或技术支持。然后，通过拨打员工，攻击者可以获取系统状态和其他以后可以使用的相关元素。\n\
  \n### 承包商/外部人员\n\n许多组织通常聘请外部承包商清洁建筑、浇植物以及其他日常杂务。在这些许多情况下，如果没有适当的安全防护，攻击者可以简单地穿上与承包商制服相匹配的衣服，在比平时稍不同的时间出现，并在受到挑战时利用工人的同情心，说他们正在替\
  \ `X` 或替 `Y`。然后，攻击者在无人察觉的情况下走在走廊，同时对办公桌和纸张拍照并寻找信息。\n\n### 在线攻击\n\n伪装也可以用于在线攻击。在这些情况下，技术在通信链中起着中介作用。一些旧的形式，如弹出窗口，今天往往效果较，因为用户对它们保持警惕。然而，通过电子邮件和社交媒体进行的钓鱼尝试层不穷。\n\
  \n### 防御\n\n在所有伪装案例中，最好的防御很简单——建立流程，要求员工在不个人认识某人时，与其接触之前查看对方的身份证明。这包括挑战快递员和合同工等人员。不要在不检查身份证明的情况下让人们通过门进入（尾随）。如果这是标准流程，那么没有人会感到被冒犯，如果有人假装生气，反而会变得更加可疑。培训和意识确实有效，正如弹出窗口效力下降等趋势所证明的那样。但这种防御的关键在于让培训定期进行，并根据目前正在经历的情况进行定制，而不是泛泛背诵最佳实践。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 培训和意识计划仍然是防御社交工程攻击的最佳防御。\n\n\n\n\n\
  社会工程学之所以非常成功，有两个普遍原因。第一个是大多数人乐于助助人的基本愿望。当有人问一个我们知道答案的问题时，我们正常的反应不是怀疑，而是回答该问题。这样做的问题在于，这些看似无害的信息可以被直接用于攻击，也可以间接用于构建一个更大的信息网，攻击者可以利用这些信息在攻击期间营造出一种真实感——个人对一个组织的了解越深，就越容易说服他人自己是该组织的一员并有权获取甚至是敏感信息。\n\
  \n社会工程学成功的第二个原因是，个人通常倾向于避免冲突和麻烦。如果攻击者试图恐吓目标，威胁要因为没有得到帮助而给目标的主管打电话，目标可能会妥协并提供信息以避免冲突。\n\
  \n### 工具\n\n社会工程师工具箱中的工具是基于对心理学的了解，并不一定需要复杂的软件或硬件知识。社会工程师将雇用各种策略，旨在利用人们自身的偏见和信念，使其在瞬间丧失做出良好判断和使用标准程序的能力。以下列表可以采用的“技术”在许多社会工程攻击中都很常见：\n\
  \n- **权威**：如果攻击者能够说服他人他在特定情况下拥有权威，他就可以诱导他们以特定方式行动。表现得像老板在要求某事，人们就不可能拒绝。\n- **恐吓**：恐吓可以是微妙的，通过感知的权力来实现，也可以是直接的，通过使用建立优越预期的通信手段来实现。\n\
  - **共识/社会证明**：共识是小组范围内的决策。它通常不是来自某个倡导者，而是通过多轮小组谈判产生的。这些轮可以被操纵以达到想要的结果。\n- **稀缺性**：如果某物短缺且具有价值，那么带着所需的物品出现就能带来奖励和认可。“此价格仅剩最后\
  \ `X` 件”就是这种技术的例子。\n- **紧急性**：可以操纵时间来营造紧迫感，并促使人们走捷径，从而可能导致介入流程的机会。限时优惠应该始终被视为可疑的。\n\
  - **熟悉感/喜欢**：人们会为他们喜欢或感到有联系的人做事情。建立这种熟悉感和吸引力可能导致产生错位的信任。\n- **信任**：信任被定义为理解某事在特定条件下如何运作。社会工程师可以塑造员工的认知，使其在信任方程上应用判断并得出错误的结论。\n\
  \n使用这些工具对社会工程师来说是种本能，凭借技巧，他们可以在任何特定情况下进出切换这些工具，就像水管工使用各种手工具、系统管理员使用 OS 命令来完成复杂任务一样。在观察任何这些专业人士工作时，我们可能会对他们运用工具的方式感到惊叹，社会工程师也是如此——只不过他们的工具更加微妙，而目标是人类和信任。\n\
  \n### 章节复\n\n在本章中，你熟悉了社会工程攻击的原理。你检查了社会工程学的方法，以及特定的攻击向量，如窥视（shoulder surfing）、翻垃圾、尾随、冒充、骗局、鲸鲸钓鱼（whaling）和语音钓鱼（vishing）。介绍这些基于社会工程的攻击是为了能够被识别。对于所有这些攻击，共同的防御机制是培训和意识。本章最后检查了社会工程师使用的主要工具以及它们之所以有效。\n\
