  \n# 第 6 章\n\n* *\n\n## 系统集成流程\n\n在本章中，你将\n\n      学习与第三方集成系统和数据的安全影响\n\n       检查互操作协议的不同形式\n\
  \n       检查与第三方共享数据相关的风险\n\n* *\n\n### 系统级流程\n\n许多横跨整个企业、影响不仅是单一业务部门、往往是整个业务的流程。这些流程可能会产生安全影响。这些影响有时表现为与产生地不同的区域；因此，从企业层面进行处理最为合适。\n\
  \n### 业务伙伴入入/离职\n\n\n\n\n\n正如管理公司人员的入职（on-boarding）和离职（off-boarding）流程同样重要，在与第三方进行安排时，考虑相同类型的元素也同样重要。与业务伙伴的协议在与业务流程相关的相互预期相关的条款方面通常非常具体。对入职和离职流程的考虑至关重要，尤其是离职流程。当与第三方的合同安排结束时，需要解决第三方对数据进行留存和销毁的问题。这些考虑需要在建立关系之前做出，而不是在关系结束时才事后添加。\n\
  \n![image](img/examtip.jpg)\n\n**考试技巧** 业务入职和离职流程应有良好的记录，以确保符合法律要求。\n\n### 社交媒体网络\n\
  \n社交媒体网络的兴起改变了业务的许多方面。无论是用于营销、沟通、客户关系还是其他目的，社交媒体网络都可以被视为第三方的形式。与社交媒体网络和/应用程序合作时，面临的挑战之一是其使用条款。虽然与典型第三方的关系涉及针对需求的一系列协商协议，但与社交媒体网络之间没有谈判空间。唯一的选择是接受它们的服务条款，因此，了解这些条款在社交网络业务用途方面的影响非常重要。\n\
  \n### 互操作性协议\n\n许多业务运营涉及许多不同方之间的活动——某些在组织内部，某些在不同的组织中。这些活动需要双方之间的通信，定义双方的责任和预期、业务目标以及追求这些目标的环境。为了确保双方理解协议，会使用书面协议。业务中使用许多形式的法律协议和合同，但就安全性而言，最常用的包括服务水平协议（SLA）、业务伙伴协议（BPA）、谅解备录（MOU）和互连安全协议（ISA）。\n\
  \nSLA 服务水平协议（SLA）是双方之间的协商协议，详细说明了客户与服务提供商之间的预期。SLA 本质上设定了合约服务的性能水平。SLA 通常作为服务合同的一部分，并设定技术预期水平。SLA\
  \ 可以定义特定服务、与服务相关的性能水平、问题管理和解决等。SLA 在客户和供应商之间协商，代表约定的条款。一旦签署，SLA 成为具有法律约束力的文档。\n\n\
  通常，良好的 SLA 将满足两个简单规则。首先，它将详细描述整个产品或服务功能，使其需求变得明确。其次，SLA 将提供一种清晰的方法来确定是否已按照约定的性能水平提供了特定的功能或服务。\n\
  \nBPA 业务伙伴协议（BPA）是伙伴之间的法律协议，用于确立伙伴之间关系的条款、条件和预期。这些细节可以涵盖广泛的问题，包括典型项目，如损益共享、每个伙伴的责任、伙伴的增加或移除以及任何其他问题。由州法律和惯例的《统一合伙法》（UPA）规定了一套与合伙关系相关的统一规则，以解决任何合伙条款。UPA\
  \ 中的条款被设计为“一刀切”，而且通常不符合任何特定合伙企业的最佳利益。为了避免 UPA 条款可能导致的非预期结果，合伙企业最好在 BPA 中说明具体细节。\n\
  \nMOU 谅解备忘录（MOU）是用于描述双方双边协议的法律文件。它是一份书面协议，表达了双方就某些共同追求或目标的一系列意向行动。它比简单的握手更正式、更详细，但通常缺乏合同的法律约束力。在组织内部的不同部门之间发现\
  \ MOU 也很常见，用以详细说明与共同业务利益相关的预期。\n\nISA 互连安全协议（ISA）是互连 IT 系统的组织之间的特殊协议，其目的是记录与互连相关的安全要求。ISA\
  \ 可以作为互连技术安全方面的部分。\n\n![image](img/examtip.jpg)\n\n**考试技巧** 确保你理解 Security+ 考试中互操作协议\
  \ SLA、BPA、MOU 和 ISA 的区别。\n\n### 隐私考虑\n\n第三方集成会导致隐私考虑。隐私可以被视为对自己的数据的控制。当为了业务目的与其他共享数据时，公司有责任确保采取适当的保护措施。确保个人身份信息（PII）在公司内部和第三方关系中都得到妥善处理。\n\
  \n第一步是定义保护 PIII 的需求。这些需求应该是组织隐私政策的一部分。隐私是对自己的信息以及他人如何使用这些信息的权利。对于个人数据，组织的隐私政策设定了人们所预期的条款和条件。通过建立和发布与\
  \ PII 相关的需求，组织可以确保隐私意识渗透到整个组织并纳入计划、政策和程序。\n\n隐私政策的组成因组织而异，但某些常见组件包括：\n\n- 明确指定收集和存储的\
  \ PII 元素。\n- 明确说明 PII 的用途，包括向第三方传输。\n- 为存储的 PII 指定安全规定和存储时间。\n\n## 风险意识\n\n让第三方参与业务运营并不能减轻风险管理的责任。风险管理的各个方面都需要根据第三方关系进行审查。需要关注与数据流和数据潜在暴露相关的风险。数据安全的机密性、完整性和可用性需要根据数据需求进行相应的定义。数据保护的需求和随后的风险暴露需要更新，以包含与第三方处理相关的方面。\n\
  \n### 数据问题\n\n#### 未授权的数据共享\n\n\n\n\n未经授权的数据共享可能是一个严重的问题，在当今世界，数据具有价值，并且经常被用于次要目的。确保关系中的所有方都理解数据共享要求是一个重要的前提。同样重要的是，确保所有方都理解共享数据的安全性要求。\n\
  \n### 数据所有权\n数据需要一个数据所有者。业务中需要定义所有数据元素的数据所有权角色。数据所有权是一项业务功能，在其中确立了安全、隐私、保留和其他业务功能的需求。并非所有数据都需要相同的处理限制，但所有数据都需要定义这些特征。这是数据所有者的责任。\n\
  \n### 数据备份\n数据所有权要求包括备份责任。数据备份要求包括确定备份级别、恢复目标和保护级别要求。这些要求可以由数据所有者定义，然后由运维 IT 人员执行。确定备份责任并制定必要的操作程序以确保进行充分的备份，是重要的安全要素。\n\
  \n### 政策与程序\n政策和程序规范了业务的运行，代表了从内部和外部需求中共同开发出的一套要求。外部需求可能来自法律法规、合同条款（如并入支付卡行业数据安全保护标准\
  \ `PCI-DSS`）或客户规范。在某些情况下，法律或法规要求执行特定的业务行为。在许多情况下，法律或法规规定了实施特定政策来管理合规。理解业务环境的具体需求可能需要支持业务部门的协助、行业小组的指导或其他来源的帮助。确定适用于第三方关系的相关安全政策和程序，是确保在业务运营期间满足所有要素的关键元素。底线非常简单：在某些业务情况下，政策和程序可能由外部法规强制规定，在确保合规性方面可能需要协助。\n\
  \n### 协议\n与第三方的关系通常由本章之前讨论的系列协议涵盖。建立一套流程来确保协议经过妥善审查，以验证与业务相关的合规性和性能标准是至关重要的。\n\n\
  ### 本回顾\n在本章中，你熟悉了与第三方集成的原则。与第三方的系统集成扩大了与风险相关的业务流程。本章从讨论互操作性协议开始，包括了服务水平协议（SLA）、业务伙伴协议、谅解备忘录和互连安全协议。本章继续检查了与第三方共享相关的数据问题和风险。它涵盖了隐私考量（包括\
  \ `PII` 相关问题），然后介绍了政策和程序以及如何通过协议在第三方之间应用。本章以检查通过社交媒体网络共享相关的挑战告终。\n\n![image](img/examtip.jpg)\n\
  \n**考试提示** 理解与第三方集成系统和数据的安全影响至关重要。\n\n## 问题\n为了帮助你进一步准备 CompTIA Security+ 考试，并测试你的准备程度，请回答以下问题，然后与章节末尾的答案进行比对。\n\
  \n**1**. 下哪项描述了谅解备忘录 (`MOU`)？\n\nA. 对提供的服务清晰定义，包括在未达到约的服务水平时的处罚\nB. 识别理想与实际隐私性能之间的结构化方法\n\
  C. 用于辅助保护隐私的应用程序或工具\nD. 一种非合同性协议，表示双方之间的意向方法\n\n**2**. 隐私的定义是什么？\n\nA. 通过贸易法保护的商业秘密\n\
  B. 控制关于你的信息以及他人对这些信息能做什么的权利\nC. 通过有关国家安全的法律保护政府信息\nD. 用于识别特定个人的信息\n\n**3**. 下哪项代表了一个良好的\
  \ `SLA` 应该满足的两个简单规则？\n\nA. 网络标准和编码实践\nB. 技术和流程\nC. 提供的服务和服务水平\nD. \n\n**4**. 下哪项描述了系统集成？\n\
  \nA. 组件之间产生协同的方法\nB. 文档和保护信息的规则\nC. 执行和记录更改的过程\nD. 确保系统正确连接的方法\n\n**5**. 下哪项描述了互操作性协议的要素？\n\
  \nA. 提供具体细节的强制性要素\nB. 各方的责任、预期和环境\nC. 组织认为合理的第三方资源使用方式\nD. 分步实施说明\n\n**6**. 下哪项描述了业务伙伴协议通常包含的内容？\n\
  \nA. 利润分配以及伙伴的加入或退出\nB. 组织认为合理的电子邮件、电话、互联网访问等\nC. 关于如何处置重要信息的清晰声明\nD. 对 IT 基础设施修改时各伙伴的责任\n\
  \n**7**. 下哪项是谅解备忘录 (`MOU`) 的局限性？\n\nA. 它帮助控制服务水平协议\nB. 它基于尽责和尽职调查\nC. 它识别需要管理的资产\n\
  D. 它比握手正式，但缺乏合同的约束力\n\n**8**. 下哪项描述了互连安全协议？\n\nA. 定义调查安全漏洞的规则\nB. 防止系统间的哈希冲突\nC\
  \ 记录与互连 IT 系统相关的安全要求\nD. 连接双方共享的系统\n\n**9**. 将社交网络用于业务目的时，挑战之一是？\n\nA. 协议容易谈判\n\
  B. 包含了资源和信息\nC. 规定了允许的访问级别\nD. 使用条款通常无法谈判\n\n**10**. 关于政策和程序需要记住的一个重要因素是什么？\n\n\
  A. 它们应该包含分步实施说明\nB. 它们可能由外部法规强制规定。\n\n\n\n\nC. 他们强制要求恰善使用公司资源。\n\nD. 他们描述了如何处理重要的公司信息。\n\
  \n11. 你被要求审查由第三方服务提供商提供给公司的服务水平协议（`SLA`）。列出你应确保包含在 `SLA` 中的三个元素：\n\n\\_\\_\\_\\\
