  \n2. 有多少类型的高安全性锁防弹开？\nA. 它们使用更高强度的销\nB. 它们使用专利锁芯和控制空白\nC. 它们的公差控制得更紧\nD. 没有；没有一把锁能有效防止弹开技术\n\
  \n3. 隐写术相对于加密的主要优势是什么？\nA. 可以更安全地保存更多数据\nB. 密钥更难暴力破解\nC. 难以检测\nD. 易实施\n\n4. 哪种冗余方案可以提供瞬时故障转移？\n\
  A. 热备\nB. 冷备\nC. 主主（active-active）\nD. 温备\n\n5. 消息摘要通过以下方式提供完整性：\nA. 提供无法解锁的加密\n\
  B. 提供一个可以独立验证的值，以显示消息是否发生了变化\n\n\n\n\n**C.** 提供消息机密性，使其他用户无法看到消息\n**D.** 对消息进行签名\n\
  \n**6.** 封锁演习规定如下：\n**A.** 所有人员都应按照疏散路线移动到指定的安全区域。\n**B.** 所有人员都应在内墙旁排队并护住头部。\n\
  **C.** 所有人员都应静静地移动到指定的就位点。\n**D.** 所有人员都应留在室内并锁好所有门窗窗户。\n\n**7.** 在描述电子访问控制系统时，`fail-safe`（故障安全）是什么意思？\n\
  **A.** 所有电磁锁都固固锁定，以确保人员安全地待在室内。\n**B.** 所有电磁锁都打开，以便人员可以安全地离开。\n**C.** 所有电磁锁都恢复到其默认的锁定/未锁定状态。\n\
  **D.** 以上都不是。\n\n**8.** 技术的进步允许 `CCTV` 系统与`_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
