  15. ARP 缓存、网络连接、内存 (RAM)、交换空间、存储在归档介质/备份中的数据（USB 内存）。\n\n# 第 9 章\n\n## 安全意识与培训\n\
  \n在本章中，你将：\n\n- 考虑安全相关意识和培训的重要性\n- 学习信息分类的使用\n- 了解数据标记的重要性\n- 探索用户习惯在安全方面的影响\n-\
  \ 检查新的威胁向量\n\n人员在企业信息安全方面起着重要作用。为了参与安全工作工作，他们需要培训和教育。政策可能是组织信息安全计划的基石，但除非以便于他们使用的方式传达给员工，否则这些政策的效果将微乎其微。良好的安全意识和培训工作是确保所有员工都能以支持的方式参与的关键。\n\
  \n## 安全意识与培训\n\n安全意识和培训计划可以通过两种直接方式增强组织的安全态势。首先，它们教导人员如何遵循正确的操作步骤以以安全的方式履行职责。其次，它们让人员意识到社交工程攻击的特征和影响。\n\
  \n\n\n\n\n员工执行的许多任务都可能对信息安全产生影响。经过良好培训的员工能够以有效的方式履行其职责，包括与信息安全相关的职责。信息安全培训的程度取决于组织的环境和威胁水平，但入职时的的初始员工安全培训至关重要，定期的复习培训也是如此。\n\
  \n一个强有安全教育和意识培训计划可以很大程度上降低社会工程攻击成功的概率。安全意识计划和活动（可能包括座讨会、视频、海报、简报和类似材料）实施相当容易，而且成本并不高。组织没有理由不建立安全意识计划。许多政府机构已经创建了安全意识海报，不断提醒个人由于由于心大意而产生的风险。安全简报（通常以电子邮件形式出现）也被用于提醒员工他们的安全责任。\n\
  \n## 安全策略培训与程序\n\n在没有对任务和期望进行相关培训的情况下，不能指望人员能够执行复杂的任务。这既适用于安全策略，也适用于操作安全细节。如果要求员工遵守组织的安全策略，他们必须对该策略的用途、含义和目标接受良好培训。关于信息安全策略、个人责任和期望的培训，需要通过定期的复习培训进行强化。\n\
  \n由于安全策略是一项设定了安全方面整体支持和执行方向的高层指令，因此确保这一信息的含义得到翻译和支持至关重要。二级策略（如密码、访问、信息处理和可接受使用策略）也需要涵盖。策略的集合应该描出一幅描述组织预期安全文化的蓝图。培训的设计应确保人们能够看到并理解整体，而不仅仅是各个元素。\n\
  \n## 基于角色的培训\n\n为了使培训有效，需要根据用户在培训主题中的角色进行针对性培训。虽然所有员工可能都需要通用的安全意识培训，但他们还需要在其拥有个人责任的领域接受特定培训。针对信息安全责任的基于角色的培训是信息安全培训的重要部分。\n\
  \n如果一个人的工作职责可能影响信息安全，则需要针对特定进行培训，以确保个人理解与信息安全相关的责任。某些角色（如系统管理员或开发人员）具有明确定义的信息安全责任。其他角色（如项目经理或采购经理）对信息安全的影响不那么明显，但这些角色也需要培训。事实上，中层管理人员这种不明显但影响更广泛的角色对信息安全文化产生巨大影响，因此，如果追求特定的结果，就需要进行培训。\n\
  \n与所有人员相关的培训一样，有两个元素需要关注。首先，必须随着时间的推移进行重新培训，以人员保持适当的知识水平。其次，当人员更换工作时，需要对所需的培训基础进行重新评估，并可能需要额外的培训。维护准确的人员培训记录是任何大型企业中管理此问题的唯一途径。\n\
  \n## 个人识别信息\n\n当信息可用于识别个人时，未能保护它可能会导致特定的后果。商业秘密通过贸易秘密法保护，政府信息通过有关国家安全的法律保护，而隐私法保护与人员相关的信息。一组可以导致个人特定身份的元素被称为\
  \ `个人身份识别信息 (PII)`。根据定义，`PII` 可用于识别特定的个人，即使没有披露整个集合。\n\n`PII` 是许多在线交易中必不可少的元素，但如果披露给未经授权的方，也可能被滥用。因此，它应该由拥有它的所有方始终受到保护。TRUSTe（[www.truste.com](http://www.truste.com)）作为一个独立的信任机构，将个人识别信息定义为：\n\
  \n任何信息……(i) 识别或可用于识别、联系或定位与此类信息相关的人员，或 (ii) 从从中可以推导出个人的身份识别或联系信息。个人身份识别信息包括但不限于：姓名、地址、电话号码、传真号码、电子邮件地址、财务状况、医疗状况、社会安全号码和信用卡信息。\n\
  \n`PII` 的概念被用于识别哪些数据元素需要特定层次的保护。当记录被单独使用（不以聚合形式存在）时，`PII` 是将一组数据元素连接到特定目的的理念。如果可以实现这一点，那么该信息就是\
  \ `PII` 并需要特定的保护。美国联邦贸易委员会（FTC）多次裁定，如果一家公司收集了 `PII`，它就对其的整个生命周期负责，从最初的收集、使用、退役到销毁。只有在\
  \ `PII` 在所有形式和位置都被销毁后，公司对其可能泄露的责任才会消除。\n\n### 告知、选择与同意\n\n隐私被定义为控制他人了解你的什么信息以及他们能用这些信息做什么的权力，而\
  \ `PII` 代表应该控制的核心项目；与终端用户就隐私进行沟通至关重要。隐私政策将在本章稍后部分介绍，但在收集 `PII` 时，三个词可以规范良好的公民行为。`告知\
  \ (Notice)` 指告知客户将收集、使用和/或存储 `PII`。`选择 (Choice)` 指终端用户获得同意数据收集或退出的机会。`同意 (Consent)`\
  \ 指客户通过积极确认，确认她阅读了通知，理解了她的选择，并同意为了向其解释的释放她的 `PII`。\n\n### 安全港\n\n美国和欧盟在数据隐私方面存在显著差异。在数据保护方法上的的差异导致欧盟对美国数据保护的充分性表示担忧，此举可能会为阻止数据传输铺平道路。经过谈判，确定了自愿加入名为“安全港\
  \ (Safe Harbor)”安排的美国组织在数据保护方面被认为是充分的。安全港是一种自我监管机制，可以通过 FTC 的贸易行为法进行执行。加入安全港联盟的企业必须承诺遵守有关隐私的特定准则。安全港成员还同意接受某些自我执行监管机制的管辖，这些机制最终由\
  \ FTC 的行动支持。\n\n安全港建立在七项原则之上：\n\n- 告知：公司必须告知正在收集什么信息、如何使用以及与谁共享。\n- 选择：公司必须允许选择退出将\
  \ `PII` 转移给第三方。\n\n\n\n\n\n- **后续传输**：所有对个人身份信息（PII）的披露必须与之前的“通知与选择”原则保持一致。\n- **安全性**：PII\
  \ 必须始终处于安全状态。\n- **数据完整性**：PII 必须保持准确；如果信息错误，客户有权对其进行更正。\n- **访问权限**：个人为了验证和更正之目的，必须对\
  \ PII 拥有适当且合理的访问权限。\n- **执行**：隐私和 PII 相关问题必须有适当的执行条款以确保其有效性。\n\n### 信息分类\n\nIT 安全的一个关键部分是保护在计算机系统和网络上处理和存储的信息。组织处理许多不同类型的信息，它们需要意识到并非所有信息在重要或敏感性上都是平等的。这促使将信息分类为不同的类别，每种类别都有其特定的处理要求。影响特定信息分类的因素包括其对组织的价值（如果丢失了这些信息会对组织产生什么影响？）、其时效，以及监管保护这些信息的法律或法规。\n\
  \n最为人知的信息分类是美国政府和军方实施的，它将信息分为非机密、敏感但非机密、机密、秘密和绝密等类别。企业也有保护信息的类似愿望，但通常使用如可公开发布、专有、公司机密或仅供内部使用等类别。每项信息分类政策都应该描述如何保护信息、谁可以访问它、谁有权发布它以及应如何销毁它。\n\
  \n组织的所有员工都应该接受其授权访问的信息处理程序的培训。分类的分级如何如何——是高、中、低，还是私密、公开和机密，或者任何其他描述符——并不重要。重要的元素是对用于区分分类的标准进行清晰的定义。员工要在实践中实施该方案，就必须能够理解信息分类方案。\n\
  \n![image](img/examtip.jpg)\n\n**考试贴士** 参加 CompTIA Security+ 考试时，你应该注意的信息分类类别包括：高、中、低、机密、私密和公开。\n\
  \n### 数据标记、处理与处置\n\n有效的数据分类计划包括数据标记，这使得处理数据的人员知道数据何时是敏感的，并理解所需的保护级别。当数据位于信息处理系统内部时，保护措施应设计在系统中。但当数据离开这个保护的“茧”（无论是通过打印、下载还是复制）时，就有必要通过其他手段确保持续保护。这就是数据标记帮助用户履行其职责之处。确保标记的发生以及标记被使用和遵循的培训，对于那些职责可能受此类材料影响的用户来说非常重要。\n\
  \n许多潜在入侵者已经学会了“翻垃圾桶”（dumpster diving）的价值。组织不仅必须关注如何处理纸质和废弃物品，还要关注存储在计算机等废弃设备上的信息。几家政府机构在披露后感到尴尬，因为它们卖给回收商的旧电脑被证明其硬盘中存有敏感文件。对于每个组织来说，拥有一套强大的处置和销毁政策以及相关程序，并将其纳入培训计划以确保用户遵守，是非常关重要的。\n\
  \n重要的文件应该粉碎，在这种情况下，“重要”意味着任何可能对潜在入侵者有用的信息。入侵者利用那些看似无害的信息碎片所做出的事情令人惊叹。\n\n在磁性存储介质（如磁盘或磁带）被丢入垃圾桶或作为回收物出售之前，应删除其所有文件，并至少用全\
  \ `1s`、全 `0s` 以及随机字符覆盖三次。市面上有商业产品可以使用此过程销毁文件。仅仅删除所有文件并置之不管是不够的，因为删除过程只影响指向文件存储位置的指针，并没有真正删除文件中的所有比特位。这就是为什么在文件被删除后，能够“撤销”并恢复它们。\n\
  \n培训在确保适当的数据处理和处置方面起着重要作用。人员密切参与与数据处理以及数据销毁/处置相关的若干特定任务，如果接受了适当培训，就可以作为安全控制措施。未经过培训或培训不足的人员将不是有效的安全控制，事实上，他们可能成为潜在风险的来源。\n\
  \n### 法律、最佳实践与标准的遵循\n\n与信息安全涉及涉及许多法律、法规、合同要求、标准和最佳实践。每一项都对组织及其人员提出了了特定的要求。组织应对这些要求的唯一有效方法是将它们构建到自己的政策和程序中。对自身政策和程序的培训将转化为对这些外部要求的覆盖。\n\
  \n需要注意的是，这些外部要求中的许多为组织赋予了特定的培训和意识组成。受支付卡行业数据安全标准（`PCI DSS`）、格拉姆-莱奇-布莱法案（`GLBA`）或健康保险便携与责任法案（`HIPAA`）约束的组织，是必须维护特定信息安全培训计划的众多机构之一。其他组织也作为最佳实践这样做。\n\
  \n### 用户习惯\n\n个人用户的责任因组织和每个组织所从事的业务类型而异，但某些非常基本的责任应该指导用户采纳：\n\n- 锁好办公室或工作区域的门。\n\
  - 不要将敏感信息留在车内。\n- 将包含敏感信息的存储介质存放在安全存储设备中。\n- 在丢弃含有信息的纸张前将其粉碎。\n- 不要向没有授权知情需求的个人（包括其他员工）泄露敏感信息。\n\
  - 不要与家人讨论敏感信息。（该规则最常见的违反发生在人力资源信息方面，因为员工尤其是主管可能会向配偶或朋友抱怨同事或工作中发生的问题。）\n- 无论设备存储或放置，保护包含敏感或重要组织信息的笔记本和其他移动设备。（确保笔记本或移动设备上的敏感信息加密是一个好主意，这样即使设备丢失或被盗，信息也是安全的。）\n\
  - 在讨论敏感公司信息时，注意周围的人。听力范围内的每个人都有需要这些信息吗？\n- 执行公司的访问控制程序。警惕并不允许尾随、窥屏或在没有相应凭证的情况下访问。\n\
  - 了解报告怀疑或实际违反安全政策行为的正确程序。\n\n\n\n\n\n-   遵循已建立的程序以执行良好的密码安全实践。密码是如此关键的元素，它们经常是社会工程攻击的最终目标。虽然这些密码程序可能看起来过于压抑或严格，但它们通常是最佳的防线。\n\
  \n![image](img/examtip.jpg) \n\n**考试提示** 用户责任是考试中经常提问的简单培训主题，因此请务必记住此处列出的要点。\n\n\
  ### 可接受使用政策\n\n可接受使用政策（`AUP`）概述了组织认为的适当使用资源（如计算机系统、电子邮件、互联网和网络）的规定。组织应该关注任何对公司无益的组织资产个人用途。\n\
  \n该政策的目标是在确保员工生产力的同时，限制因不当使用组织资产而导致的潜在组织法律责任。与政策相关的培训应明确界定哪些活动是不允许的。`AUP` 应涵盖诸如使用资源进行个人业务、硬件或软件的安装、对系统和网络的远程访问、对公司所有软件的复制，以及用户保护公司资产（包括数据、软件和硬件）的责任。还应包括关于忽略任何政策可能导致惩罚（如`termination`，解雇）的陈述。\n\
  \n员工对组织计算机系统和网络的适当使用与组织自身的适当使用相关。这些问题中最重要的是，组织是否认为监控员工对系统和网络的使用是适当的。如果认为监控是适当的，组织应在访问横幅和培训中包含此类声明，以提醒员工。这会反复警告员工以及潜在的入侵者，他们的行为受到监控，且任何对系统的滥用都将不被容忍。如果组织需要在民事或刑事案件中使用监控期间收集的任何信息，那么如果组织能够指出其反复显示的声明——即使用系统即视为同意监控，那么关于员工是否具有隐私预期，或组织监控是否合法的争议就会简化。\n\
  \n![image](img/examtip.jpg)\n\n**考试提示** 确保你理解可接受使用政策概述了计算机系统用户被认为是可接受的行为。此项政策通常与组织的互联网使用政策相辅相成。\n\
  \n### 密码行为\n\n糟糕的密码选择是最常见的糟糕安全实践之一，也是最危险的之一。对密码选择进行的许多研究发现，尽管总体来说，越来越多的用户正在学习选择良好的密码，但仍有很大比例的用户在做出糟糕的选择。这里的问题的在于，糟糕的密码选择可能使攻击者更容易地破解计算机系统或网络。即使用户拥有良好的密码，他们往往也会诉诸于另一种糟糕的安全实践——将密码写在容易找到的地方，如果攻击者获得了对该区域的物理访问权限，这也会导致系统被破解。\n\
  \n![image](img/examtip.jpg)\n\n**考试提示** 了解良好密码选择的规则。通常，这些规则包括：\n1. 在密码中使用八个或更多字符；\n\
  2. 包含大写字母和小写字母的组合；\n3. 包含至少一个数字和一个特殊字符；\n4. 不要使用常用的词、短语或名称；以及\n5. 选择一个你能够记住的密码，这样你就不需要把它写下来。\n\
  \n密码策略是组织可以拥有的最基本的策略之一。确保你不仅理解构成良好密码的基础知识，还理解围绕密码创建、过期、共享和使用的其他问题。\n\n### 数据处理\n\
  \n理解与个人工作相关的妥当数据处理责任是一个重要的培训主题。信息具有欺骗性，因为它不是直接的实物，而且人们倾向于在其他工作衡量方面养成坏习惯……以牺牲安全为代价。员工需要培训如何识别他们正在使用的数据的分类和处理要求，并需要学习如何遵循妥当的处理流程。如果某些数据元素由于合同、法律或法规需要特殊处理，则通常会有与该要求相关的培训条款。培训条款的精髓在于你接受什么就会得到什么，如果对特定数据类型的安全性是一项要求，那么就应该进行培训。这一原则同样适用于公司数据处理责任；你获得的是你所培训和奖励的行为。\n\
  \n### 洁桌面政策\n\n在工作区域内防止信息访问同样重要。拥有敏感信息的公司应该有一项“洁桌面政策”，规定当工作人员不在现场担任保管员时，敏感信息不能留在工作区域内处于未保护状态。即使离开桌面区域去洗手间也可能导致信息暴露并面临被破解的风险。洁桌面政策应该识别并禁止第一眼看并不明显的事物，例如键盘和鼠标垫下的贴纸或未安全的桌面抽屉里的密码。\n\
  \n### 窥视\n\n`Shoulder surfing`（窥视）不涉及与用户的直接接触，而是涉及攻击者直接观察目标在表单、数字键盘或键盘上输入敏感信息。攻击者可能只是从工作中的同事肩膀后看，看着同事输入密码。攻击者可以尝试在自动取款机处获取`PIN`等信息，在安全门或门处获取访问控制入口代码，或者电话卡或信用卡号。让用户意识到何时正在输入敏感信息并养成隐藏自己活动的习惯是非常重要的。\n\
  \n尽管防御方法可以帮助让窥视变得更加困难，但最好的防御是用户意识到周围环境，不要让个人进入可以观察到用户输入内容的位置。此时可以提出这样一点相关的安全评论：一个人不应该对所有不同的账户、门禁代码等使用同一个`PIN`，因为获知其中一个`PIN`的攻击者就可以将其用于所有其他地方。\n\
  \n### 防止尾随\n\n\n\n\n\n自自带设备（BYOD）是一项具有安全影响的当前趋势。员工需要接受有关 BYOD 安全影响的培训。某些看似无害的行为，例如通过计算机的\
  \ USB 接口为手机充电，可能会导致无意中打开攻击攻击面。使用个人设备阅读公司电子邮件可能会扩大信息边界，应该采取相应的控制措施以防止某些水平的信息流向这些设备。但最终的安全端点保护设备是用户，因此应该对用户就潜在风险、公司政策以及在使用\
  \ BYOD 方面应采取的正确行动进行培训。\n\n## 新威胁与安全趋势/警报\n\n归根结底，信息安全实践的核心在于风险管理，众所周知，风险环境以不断变化为特征。不断演变的威胁环境以新威胁、新安全问题和新形式的防御措施为特征。培训人员识别新威胁需要持续的意识培训和复习培训活动。\n\
  \n## 新病毒\n\n新形式的病毒（或恶意软件）每天都在被创造。其中一些新形式可能具有很强的破坏性和高昂的成本，所有用户都有责任保持警惕并采取行动避免暴露。恶意软件作者利用用户的不良习惯来协助其攻击的传播。向用户解释正确行动的一种方法是使用清洁来作类比。培训用户在行动中养成良好的卫生习惯可以极大地帮助企业防御这些攻击向量。\n\
  \n## 钓鱼攻击\n\n钓鱼攻击是社会工程攻击的一种形式。因此，它们专门针对用户，试图让用户执行可被作攻击向量的特定操作。钓鱼攻击形式多种多样，包括针对特定高价值目标的高度针对性钓鱼攻击，这种技术被称为`鱼叉式钓鱼`（spear\
  \ phishing）。一种较新的鱼叉式钓鱼形式被称为`捕鲸攻击`（whaling），它针对特定的高级高管或其他具有极高影响力的人员。\n\n防御钓鱼和其他社会工程攻击的最佳方法是培养受过教育且具有意识的员工群体。需要对社会工程主题和当前攻击趋势的细节进行持续的复习培训，使员工意识到并对社会工程攻击的新趋势做好准备。攻击者依赖于缺乏教育、自满或分心焉的劳动力来实现其攻击向量。社会工程已成为当今许多最具破坏性攻击的入口。过去几年在新闻中频频的高级持续性威胁（APT）依赖社会工程作为其感染向量之一。之所以使用钓鱼和其他社会工程攻击是因为它们是有效的。一个具有意识且知识丰富的劳动力落入这些攻击向量的概率要小得多，活跃的培训和意识计划是让员工应对这种威胁的最佳方法。\n\
  \n## 零日漏洞\n\n零日漏洞本质上是未知的攻击机制，尚未制定出特定的防御措施，因此被称为“零日”。这意味着 IT 部门有“零天”时间应对攻击。潜在的零日攻击向量数量是未知的，而已检测到且厂商正在研究防御措施的活跃零日漏洞数量相对较少。组织有责任配备经过专门培训的人员，以协调针对活跃零日攻击的系统进行主动修复。\n\
  \n当零日漏洞被利用并成为已知漏洞时，产品出现该问题的供应商必须立即寻求防御措施。依赖此产品的组织必须迅速评估潜在的安全泄露和对企业的风险。如果是关键系统，在补丁修复之前，可能需要采取某种形式的补偿控制。\n\
  \n积极参与这一防御方面需要一个经过培训且具有意识的群体，他们具备协调活跃零日攻击进行系统主动修复的能力。当零日漏洞被利用并成为已知漏洞时，产品出现该问题的供应商必须立即寻求防御措施。依赖此产品的组织必须快速评估潜在的安全泄露和对企业的风险。如果是关键系统，在漏洞被修复之前，可能需要采取某种形式的补偿控制。\n\
  \n积极参与这一防御方面需要一个经过培训且具有意识的群体，他们具备协调活跃零日攻击进行系统主动修复的能力。保持对零日问题的意识不是年度或每季的活动，而是需要通过多种安全信息源进行每日检查以维护活跃知识库。\n\
  \n## 社交网络与 P2P\n\n随着点对点（P2P）通信和社交网络网站（如 Facebook、Twitter 和 LinkedIn）的流行，许多人习惯了过度分享信息。发布类似“从销售回访回来”的状态会向不需要这些信息的人泄露信息。将与朋友分享与业务信息混淆是人们经常越界的行为，无论这看起来多么无害。\n\
  \n用户需要理解在工作中使用 Torrent 等文件共享程序的重要性，因为这些程序可能导致感染机制和数据泄露。信息安全培训和意识计划应涵盖这些问题。如果向员工充分解释这些问题，他们遵守的动机将不仅是为了避免违反政策而受到人员处分；他们将希望维护组织及其任务的安全。\n\
  \n## 章节总结\n\n\n\n\n在本章中，你将熟悉了建立有效的安全培训和意识计划所需的要素。本章首先介绍了信息安全培训计划的需求基础。随后，详细说明了信息分类、标签标记和处理等领域的要求。本章还涵盖了针对角色、习惯和活动的用户教育，并探讨了培训在遵守信息安全领域各种规则、法规、法律和合同要求方面的作用。接下，本章研究了新攻击向量（如新形式的恶意软件、网络钓鱼攻击和零日漏洞利用）对培训带来的影响，并探讨了\
  \ P2P 和社交媒体的影响。本章最后讨论了跟进和收集培训指标以验证合规性和安全态势的必要性。\n\n### 问题\n\n为了帮助你进一步为 CompTIA Security+\
