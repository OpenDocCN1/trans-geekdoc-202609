  \n\n\n这些地址在网络内部的使用不受限制，其功能与其他任何 IP 地址相同。当这些地址中的某一个需要外部资源（即互联网提供的资源）时，就需要 `NAT` 为该资源生成一个有效的外部\
  \ IP 地址。`NAT` 的工作原理是在流量通过 `NAT` 设备（如防火墙）时对地址进行翻译。所使用的外部地址与内部地址之间不是 1:1 的外部映射关系，因为这将违背重用和地址空间节省的目的。通常，`NAT`\
  \ 设备使用一个外部 IP 地址池，由设备记录在任何时刻哪个内部地址正在使用哪个外部地址。这提供了一个重大的安全层，因为它使得从外部映射到防火墙后的内部网络变得非常困难。\n\
  \n实现 `NAT` 使用了以下几种技术：\n- `static NAT`：提供外部地址到内部地址的 1:1 绑定；适用于引用内部源的服务，例如 Web 服务器或电子邮件服务器。\n\
  - `DMZ`：引用外部地址的资源可以通过 `dynamic NAT` 共享，在这种模式下，边缘设备会构建并使用一张表来管理翻译，因为地址可能会随时间而变化。\n\
  - `Port Address Translation (PAT)`：实际的 `TCP/UDP` 端口也会被翻译。这将允许单个外部 IP 地址通过端口（如端口\
  \ `80` 或 `25`）为内部 IP 地址提供服务。\n\n### 远程访问\n远程访问是跨网络到设备的连接。有多种协议可以用于启用远程访问。`Remote\
  \ Access Service (RAS)` 是 `Windows OS` 的一部分，允许通过拨号连接在客户端和服务器之间。虽然速度比 `DSL` 连接慢，但这仍然是连接到远程网络的常用方法。当用户拨号接入计算机系统时，将通过一系列远程访问协议进行身份验证和授权。为了获得更高的安全性，可以使用回调系统，即服务器在设定的时间内拨回客户端。`RAS`\
  \ 也可以指 `Remote Access Server`（远程访问服务器），这是一个允许远程用户访问网络并监管其访问的术语。今天，远程访问通常通过使用 `VPNs`\
  \ 和远程桌面软件来实现。\n\n### 电话\n数据和语音通信在企业中已共存数。近期企业内部 `Voice over IP (VoIP)` 与传统程控交换 (`PBX`)\
  \ 的连接增加了功能性，但也增加了风险。可以使用特定的防火墙来防止电话连接上的未经授权的流量。`PBX` 是公共电话网络向业务领域的延伸。尽管被认为是与数据系统不同的实体，但\
  \ `PBXs` 经常互连，并作为这种互连的一部分具有安全性。`PBXs` 是基于计算机的交换设备，旨在将电话连接到本地系统。它们基本上是数字交换系统，可能会从外部被破解，并被黑客用来通过企业的费用拨打电话。尽管随着低成本远程服务的出现，这种类型的攻击有所减少，但它并没有消失，正如公司每年学到的那样，语音信箱和\
  \ `PBXs` 可能会被破解，风险可能会变得很高。\n\n`PBXs` 的另一个问题出现在当它们与数据系统互连时，无论是通过企业连接还是通过用户手中的非法调制调器。在何种情况下，都存在通往外部数据网络和互联网的路径。正如数据连接需要防火墙来确保安全一样，这些连接也需要防火墙。电信防火墙是一种特殊的防火墙，旨在同时保护\
  \ `PBX` 和数据连接。电信防火墙的功能与数据防火墙相同：其目的是执行安全策略。电信安全策略甚至可以通过实施访问代码和/或限制服务，来覆盖数小时的使用时间。\n\
  \n### 网络访问控制 (NAC)\n网络由连接的工作站和服务器组成。网络安全管理涉及管理来自各种连接硬件以及运行这些设备的软件的广泛问题。假设网络是安全的，那么每个额外的连接都涉及风险。在端点连接时逐种情况地进行管理，这种安全方法被称为网络访问控制（Network\
  \ Access Control）。存在两种主要的竞争方法论：\n- `Network Access Protection (NAP)`：微软的一种用于控制计算机主机网络访问的技术。\n\
  - `Network Admission Control (NAC)`：思科的用于控制网络准入的技术。\n\n微软的 `NAP` 系统基于测量连接机器的系统健康状况，包括\
  \ `OS` 的补丁级别、反病毒保护情况和系统策略。`NAP` 首次在 `Windows XP Service Pack 3`、`Windows Vista`\
  \ 和 `Windows Server 2008` 中被利用，它需要额外的基础设施服务器来实现健康检查。该系统包含执行代理，用于询问客户端并验证准入标准。每当建立网络连接时，客户端都会启动。响应选项包括拒绝连接请求或限制进入子网的访问。\n\
  \n思科的 `NAC` 系统围绕一个设备构建，该设备执行网络管理员选择的策略。一系列第三方解决方案可以与该设备接口，允许验证各种选项，包括客户端策略设置、软件更新和客户端安全态势。第三方设备和软件的使用使得该系统在广泛设备上具有可扩展性。\n\
  \n思科的 `NAC` 和微软的 `NAP` 都处于采用的早期阶段。客户端部分已经就绪，但企业在完全部署该技术的服务器端方面进展缓慢。基于客户端设备特征的自动准入检查概念将一直存在下去，因为它为当今企业瞬息万变的网络世界提供了及时的控制。随着企业中自备设备\
  \ (`BYOD`) 的兴起，人们对使用 `NAC` 来帮助保护网络免受不安全设备的兴趣再次增加。\n\n### 虚拟化\n虚拟化是创建虚拟系统而非实际硬件和软件。硬件与软件的分离增加了企业的灵活性。在实际硬件之上，虚拟化层允许创建完整的系统，包括作为虚拟机的计算机和网络设备。这种硬件与软件的分通过一系列改进提高了安全性。复制整个系统、备份它们或在硬件平台之间移动它们的能力可以增加系统的安全性。\n\
  \n\n\n\n与虚拟化相关的实用元素之一是`snapshot`（快照）。快照是系统在某一时间点的映像。快照实现了许多实用功能。快照允许系统恢复到之前的某个点。快照能够更快的备份、更快的恢复，并作为使系统更稳定的手段。\n\
  \n尽管存在某些漏洞可能允许一个虚拟环境中的进程突破虚拟环境之间的隔离或突破到宿主机层，但这些情况非常罕见且极难利用。必须解决一种新形式的漏洞——创建完整虚拟系统副本的能力，因为这可能导致数据和知识产权的损失。虚拟系统的存储保护必须与普通系统的备份同等，以避免大规模的损失。\n\
  \n## 云计算\n\n`Cloud computing`（云计算）是一个通用术语，用于描述通过网络提供的计算机服务。这些计算服务是通过互联网协议提供的计算、存储、应用程序和各项服务。云计算的特点之一是对终端用户透明的。这提高了这种服务提供形式的易用性。云计算为用户提供了许多益处：包括性能、可扩展性、灵活性、安全性和可靠性的提升等。这些改进是与云服务实现方式相关的特定属性的直接结果。\n\
  \n当数据和计算由远程方处理时（如在云计算中），安全性是一项特殊的挑战。具体的挑战在于如何允许数据离开你的企业，同时仍保持对数据使用的控制。常见的答案是加密。通过在数据离开企业之前对其进行适当的加密，可以通过适当使用加密元素安全地执行外部存储。\n\
  \n云可以由许多组织内部和外部的实体创建。商业云服务已经可用，并由从 Google 和 Amazon 等大公司到较小的本地供应商的各种公司提供。公司内部的服务可以复制云计算的优势，同时提高有限资源的实用性。云计算的承诺是提高实用性，并以平台即服务（PaaS）、软件即服务（SaaS）和基础设施即服务（IaaS）的概念进行营销。\n\
  \n云服务的使用已成为普通用户的常规，通过如 `iCloud`（苹果）、`OneDrive`（原 `SkyDrive`）以及 `Dropbox` 等文件服务。这些服务易于使用、易于配置，并以最小的用户困难提供所需的基本服务。\n\
  \n### 平台即服务\n\n平台即服务（PaaS）是一个营销术语，用于描述在云中提供计算平台。多组协同工作的软件提供的服务（如数据库服务）可以通过云以平台的形式交付。PaaS\
  \ 产品通常专注于安全性和可扩展性，这两者都是符合云和平台需求的特征。\n\n### 软件即服务\n\n软件即服务（SaaS）是从云内部向终端用户提供软件。SaaS\
  \ 不是在客户端机器上安装软件，而是充当按需软件，软件从云端运行。这有几个优势：更新对终端用户来说是无缝的，组件之间的集成可以得到增强。SaaS 的常见示例是通过订阅服务通过\
  \ Web 的产品，如 `Microsoft Office 365` 和 `Adobe Creative Suite`。\n\n### 基础设施即服务\n\n\
  基础设施即服务（IaaS）是一个术语，用于描述作为计算虚拟平台交付的云系统。IaaS 无需构建数据中心，允许公司根据需要签订公用事业计算。IaaS 特别地按需付费的基础上进行营销，并可根据需求直接扩展。\n\
  \n***\n\n![image](img/examtip.jpg)\n\n**考试提示** 必确保你理解云计算服务模型——平台即服务、软件即服务和基础设施即服务之间的区别。\n\
  \n### 私有云\n\n如果你的组织对资源共享非常敏感，你可能希望考虑使用私有云。私有云本质上是仅供你的组织使用的保留资源——你在云内部的自己的小云。这种服务将昂贵得多，但它的风险也较少，并且应该让你的组织能够更好地定义云内发生的安全性、处理、数据处理等。\n\
  \n### 公有云\n\n`public cloud`（公有云）一术是指是指云服务是在供公众使用的系统上提供的。在大多数情况下，公有云和私有云架构在操作上的区别很小，但安全影响可能是巨大的。尽管公有云服务将通过安全限制区分用户，但根据定义，这些限制的深度和程度在公有云中要少得多。\n\
  \n### 混合云\n\n混合云结构是结合了私有云、公有云和社区云结构元素的结构。在检查混合结构时，你需要意识到在操作上，这些不同的环境可能并没有实际连接，而是一起使用。敏感信息可以存储在私有云中，与问题相关的信息可以存储在社区云中，所有这些信息由一个应用程序访问。这使得整个系统成为混合云系统。\n\
  \n### 社区云\n\n社区云系统是几个具有共同利益的组织为了共同努力的特定目的共享云环境。例如，本地公共实体和关键当地公司可以共享一个专门用于服务社区倡议利益的社区云。这可以是特定数据共享倡议的一种极具吸引力的成本共享机制。\n\
  \n## 分层安全/深度防御\n\n安全网络设计依赖于许多元素，关键元素之一是深度防御。深度防御是一种安全原则，通过采用多个、不同的安全元素来提高安全级别。如果攻击者能够绕过某项安全措施，重叠控制之一仍然可以捕获并阻止入侵。在网络中，可以以叠加的方式采用一系列防御，包括访问控制列表、防火墙、入侵检测系统和网络隔离，以实现保护。\n\
  \n### 协议\n\n协议充当共同语言，允许不同组件使用一组通用的已知的命令进行通信。存在许多不同的协议，它们都用于实现特定的通信目标。\n\n***\n\n\
  ![image](img/examtip.jpg)\n\n**考试提示** 在考试期间，你应该预计可能会被要求在给定基本场景的情况下实现常见的协议和服务。\n\n\
  ### IPsec\n\nIPsec 是由 IETF 开发的一组协议，用于在 OSI 模型网络层（第 3 层）安全地交换数据包（RFC 2401–2412）。尽管这些协议仅与\
  \ IP 网络配合，但一旦建立了 IPsec 连接，就可以跨越 OSI 模型中较低层次的网络进行隧道传输。IPsec 提供的安全服务发生在 OSI 模型的网络层，因此高层协议（如\
  \ `TCP`、`UDP`、`网络控制消息协议 (ICMP)`、`边界网关协议 (BGP)` 等）不会因为 IPsec 服务的实现而发生功能变化。\n\n\n\n\
  \n\nIPsec 协议系列设计用于提供广泛的服务，包括但不限于访问控制、无连接完整性、流量流机密性、拒绝重放数据包、数据安全（加密）以及数据源认证。IPsec\
  \ 定义了两种方法——传输模式（transport）和隧道模式（tunneling），它们可提供不同级别的安全保护。IPsec 还有三种连接模式：主机到服务器、服务器到服务器以及主机到主机。\n\
  \n### IPsec 方法\n\n传输方法仅对加密数据包的数据部分，因此外部人员可以看到源 IP 和目的 IP 地址。传输方法保护与数据包相关的高层协议并保护正在传输的数据，但允许传输过程本身被感知。对数据包数据部分的保护被称为\
  \ `content protection`（内容保护）。\n\n隧道模式对源 IP、目的 IP 地址以及数据本身进行加密。这提供了最大的安全性，但只能在 IPsec\
  \ 服务器（或路由器）之间进行，因为交付时需要知道最终目的地。对头部信息的保护被称为 `context protection`（上下文保护）。\n\n* *\n\
  \n![image](img/examtip.jpg)\n\n**考试要点** 在传输模式（端到端）中，数据包流量的安全由端点计算机提供。在隧道模式（门户到门户）中，数据包流量的安全由每个网络中的端点节点机器提供，而不是由终端主机提供。\n\
  \n可以同时使用这两种方法，例如在自己的网络内部使用传输方法到达 IPsec 服务器，然后通过隧道连接到目标服务器的网络，连接到那里的 IPsec 服务器，最后从目标网络中的\
  \ IPsec 服务器使用传输方法到达目标主机。IPsec 使用“安全关联”（security association，SA）一术语来描述特定算法和密钥选择的单向组合，以提供保护通道。如果流量是双向的，则需要两个安全关联，且它们实际上可以是不同的。\n\
  \n### 基础配置\n\n使用 IPsec 进行机器之间的连接可以应用四种基础配置。最简单的是两台机器之间的主机到主机连接，如图 3-3\n\n* *\n\n\
  **图 3-3** 两台机器之间的主机到主机连接\n\n第二种情况流中放置两个安全设备，减轻了主机的计算和封装职责。这两个网关之间有一个 `SA`。假设从每台机器到其网关的网络是安全的，且在这些跳跃之间不执行\
  \ IPsec。图 3-4 显示了两个具有跨越互联网隧道的安全网关，尽管可以使用隧道模式或传输模式。\n\n![image](img/f0047-02.jpg)\n\
  \n* *\n\n**图 3-4** 具有跨越隧的两个安全网关\n\n第三种结合了前两种。网关设备之间存在独立的 `SA`，但主机之间也存在一个 `SA`。这可以被视为隧道内部的隧道，如图\
  \ 3-5 所示。\n\n![image](img/f0048-01.jpg)\n\n* *\n\n**图 3-5** 隧道中的隧道\n\n远程用户通常通过互联网连接到组织网络。该网络有一个安全网关，通过它来保护进出其服务器和授权用户的流量。在最后一种情况下（如图\
  \ 3-6#ch3.html#ch3fig6 所示），用户与安全网关建立 `SA`，如果需要，再与目标服务器建立单独的 `SA`。这可以使用远程笔记本电脑上的软件和组织网络上的硬件来实现。\n\
  \n![image](img/f0048-02.jpg)\n\n* *\n\n**图 3-6** 从主机到网关的隧道\n\nWindows 可以作为 IPsec\
  \ 服务器，路由器和其他服务器也是如此。主要问题是 CPU 使用率以及计算能力应该在何处。这种考虑导致了 IPsec 设备的兴起，这些是专门为系列通信执行 IPsec\
  \ 功能的硬件设备。根据连接数、网络带宽等，这些设备对于小型办公室或家庭办公室可能非常廉价，但对于大型企业级实现可能非常昂贵。\n\n### AH 和 ESP\n\
  \nIPsec 使用两种协议来提供流量安全：\n\n- 身份认证头部 (AH)\n- 封装安全载荷 (ESP)\n\n对于密钥管理和交换，存在三种协议：\n\n\
  - 互联网安全关联和密钥管理协议 (ISAKMP)\n- Oakley\n- 安全密钥机制 (SKEMI)\n- 互联网密钥管理 (IKMP)\n- 互联网密钥交换\
  \ (IKE)\n\nIPsec 不定义特定算法，也不要求特定方法。IPsec 是一个开放框架，允许厂商实现行业标准算法。这种灵活性是 IPsec 的关键。IPsec\
  \ 使用以下：\n\n- 节点之间的 Diffie-Hellman 交换\n- 批量加密算法，如 `IDEA` 和 `3DES` 用于加密数据\n- 密钥哈希算法，如\
  \ `HMAC` 以及传统的哈希算法，如 `MD5` 和 `SHA-1` 用于数据包级认证\n- 作为双方数字 ID 的数字证书\n\n为了提供流量安全，为 IP\
  \ 数据报定义了两个头部扩展。AH 添加到 IP 数据报时，确保了数据的完整性并确保数据源的真实性。通过保护 IP 头部中不变的元素，AH 保护 IP 地址并实现了数据源认证。ESP\
  \ 为数据包的高层协议部分提供安全服务，而不是 IP 头部。\n\n* *\n\n![image](img/examtip.jpg)\n\n**考试要点** IPsec\
  \ AH 保护完整性，但不提供私密性。IPsec ESP 提供机密性，但不保护数据包的完整性。为了同时涵盖隐私性和完整性，可以同时使用这两个头部。\n\nAH\
  \ 和 ESP 可以单独使用或结合使用，取决于所需的安全级别和类型。它们也与 IPsec 协议的传输模式和隧道模式配合。在传输模式下，两个通信端点主要为上层协议提供安全。加密和解密发生的端点位于通信通道的源和目的地。对于传输模式下的\
  \ AH，原始 IP 头部暴露的，但其内容通过数据包中的 AH 块受到保护，如图 3-7 所示。对于传输模式下的 ESP，数据内容通过加密受到保护，如图 3-8\
  \ 所示。\n\n![image](img/f0050-01.jpg)\n\n* *\n\n**图 3-7** 传输模式下的 IPsec AH\n\n![image](img/f0050-02.jpg)\n\
  \n* *\n\n**图 3-8** 传输模式下的 IPsec ESP\n\n\n\n\n隧道（Tunneling）是将数据封装封装协议内部的手段，该协议仅在隧道的入口和出口点被理解。这为隧道内的传输提供了安全性，因为外部观察者无法破解数据包内容，甚至无法识别通信双方的身份。`IPsec`\
  \ 具有隧道模式，可以用于跨公共网络的服务器到服务器之间的通信。虽然隧道端点被称为 `servers`，但这些设备可以是路由器、专用设备或服务器。在隧道模式下，隧道端点仅用新的\
  \ IP 头部封装整个数据包以指示端点，并对此新数据包的内容进行加密。真实的源和目的信息包含在内部 IP 头部中，该头部在隧道中是加密的。外层 IP 头部包含隧道端点的地址。\n\
  \n如前所述，`AH` 和 `ESP` 可以在隧道模式下使用。在隧道模式下使用 `AH` 时，外层 IP 头部部的部分将获得与传输模式相同的头部保护，而整个内部数据包都受到保护。这在图\
  \ 3-9 中所示。`ESP` 为隧道数据包的内容（即来自初始发送者的整个数据包）提供相同的加密保护，如图 3-10 所示。在隧道模式下，`AH` 和 `ESP`\
  \ 共同可以为整个数据包提供完整保护，如图 3-11 所示。`AH` 和 `ESP` 的特定组合在 `IPsec` 中被称为安全关联（SA）。\n\n![image](img/f0051-01.jpg)\n\
  \n* * *\n\n**图 3-9** `IPsec` 在隧道模式下使用 `AH`\n\n![image](img/f0051-02.jpg)\n\n* *\
  \ *\n\n**图 3-10** `IPsec` 在隧道模式下使用 `ESP`\n\n![image](img/f0052-01.jpg)\n\n* * *\n\
  \n**图 3-11** 隧道模式下 `IPsec` `ESP` 和 `AH` 数据包结构\n\n在 `IPv4` 中，`IPsec` 是一个附加组件，其接受由厂商驱动。它不是原始\
  \ `IP` 的一部分——这是原始 `IP` 的短视设计缺陷之一。在 `IPv6` 中，`IPsec` 集成到 `IP` 中，并在所有数据包上都是原生的。它的使用仍然是可选的，但其协议套件中的包含将确保厂商解决方案在符合\
  \ `IPv6` 标准时具有互操作性。\n\n`IPsec` 在其安全过程中使用加密密钥，并作为协议系列的一部分具有手动和自动密钥分发。包含了手动密钥分发，但它只在小型、静态环境中实用，无法扩展到企业级实现。密钥管理的默认方法\
  \ `IKE` 是自动的。`IKE` 验证参与 `IPsec` 的每个对端并协商安全策略，包括会话密钥的交换。`IKE` 在对端之间创建一个安全隧道，然后通过该通道为\
  \ `IPsec` 协商 `SA`。这分为两个阶段：第一阶段建立通道，第二阶段建立 `SA`。\n\n### SNMP\n简单网络管理协议（`SNMP`）是管理基于\
  \ `IP` 网络上设备的标准。`SNMP` 是一种应用层协议，是 `IP` 协议族的一部分，用于管理和监控设备，包括网络设备、计算机以及连接到 `IP` 网络的其他设备。\n\
  \n### SSH\n安全外壳（`SSH`）协议是一种加密的远程终端。`SSH` 是一个加密的远程终端。`SSH` 是一个加密的远程终端。`SSH` 是一个加密的远程终端。`SSH`\
