  **D.** 以上所有\n\n**10.** 建筑疏散路线通常由以下要求：\n**A.** 建筑设计\n**B.** 建筑所有\n**C.** 当建筑规范\n\
  **D.** 租户\n\n对于问题 11–15，请假设以下场景：在公司发生入侵事件后，董事会决定将你的角色从“信息总监”转变为“首席安全官”。他们要求你承担所有的安全责任并加强安全工作，以防再次发生事故。\n\
