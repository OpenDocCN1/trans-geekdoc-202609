- - '##'
  - Web 应用防火墙 vs 网络防火墙
- - '###'
  - A. Logixn
- - '###'
  - B. 请求计数
- - '###'
  - C. 健康检查
- - '###'
  - D. 生存时间 (TTL)
- - '####'
  - 2. 对于防火墙而言，“状态化”（stateful）一词是什么意思？
- - '####'
  - 3. 代理服务器和防火墙之间的主要区别是什么？
- - '####'
  - 4. 为什么 Web 应用防火墙执行 SSL 检查非常重要？
- - '####'
  - 5. 基于异常的网络入侵防御系统 (NIPS) 在哪种情况下会告警？
- - '####'
  - 6. 管理防火墙时使用哪种策略最好？
- - '####'
  - 7. 为什么网络协议分析器需要处于混杂模式（promiscuous mode）？
- - '####'
  - 8. 哪种协议由于使用明文密码进行验证，会在交换机、防火墙和路由器中创建安全漏洞？
- - '####'
  - 9. 为什么大多数组织应该使用内容过滤代理？
- - '####'
  - 10. 为什么基于延迟的过滤对垃圾邮件有效？
- - '####'
  - 11. 应该检查哪些日志以确定入侵者是否破解了内部系统？（选择所有项）
- - '####'
  - 12. 你发现攻击已通过路由器和防火墙到达了一个未识别的桌面机器。你拥有 IP 地址但没有流量内容。你的下一步可能是什么？
- - '####'
  - 13. 通过分析网络流量，你确定攻击已经入侵了销售部门的一台桌面电脑，现在正在发送外发垃圾邮件。哪些设备可以用于消除这种流量？（选择所有项）
- - '####'
  - 14. 入侵检测系统如何帮助你响应？
- - '####'
  - 15. 列出入侵系统四模型。
- - '###'
  - 答案
- - '####'
  - 1. C. 负载均衡设备向每个服务器发送请求，以确保应用程序正在响应。
- - '####'
  - 2. B. 状态化防火墙跟踪活动连接，并通过识别数据包是否属于任何连接来防止欺骗。
- - '####'
  - 3. C. 代理工作在应用层，而防火墙通常工作在传输层和网络层。
- - '####'
  - 4. A. 执行 SSL 检查很重要，否则攻击者可以使用不受检查的通道绕过防火墙。
- - '####'
  - 5. D. 基于异常的 NIPS 在网络流量偏离设备首次建立的基准时告警。
- - '####'
  - 6. B. 管理防火墙时最好使用最小访问原则；你希望防火墙拦截尽可能多的流量，同时允许授权通过。
- - '####'
  - 7. C. 混杂模式告诉网络适配器处理收到的所有数据包，而针对其 MAC 地址的数据包和广播包。
- - '####'
  - 8. A. 简单网络管理协议 (SNMP) 为许多网络设备提供管理功能，但 SNMPv1 和 SNMPv2 使用明文密码身份验证，允许监控数据包的人捕获密码并访问网络设备。
- - '####'
  - 9. C. 内容过滤代理在企业中很受欢迎，因为它们通过过滤身份验证用户不允许查看的内容来实施可接受使用策略。
- - '####'
  - 10. B. 垃圾邮件生成器不等待 SMTP banner，可以通过其行为异常被识别为垃圾邮件发送者。
- - '####'
  - 11. A, B, 和 E. 路由器、防火墙和 IDS 是确定入侵者是否破解了内部系统。
