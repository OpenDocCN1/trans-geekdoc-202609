    # # RESULTS


    # ## Comparison of Baseline Characteristics


    Table 1 summarizes the baseline characteristics of the entire cohort. A total
    of 8431 patients were included (mean age, 54.73±10.21 years; 48.2% were male;
    50.9% with symptomatic chest pain, with 319 MACE5 (3.8%) were recorded, including
    34 deaths, 8 cases of AMI, 244 coronary revascularizations (202 percutaneous coronary
    interventions and 42 coronary artery bypass grafting), and 54 strokes, during
    a median follow-up of 3.68 years (interquartile range, 2.65–4.27 years). The most
    common cardiac symptom was atypical angina (44.6%), followed by typical chest
    pain (6.3%). In the CCTA examination, 76.4% of patients had normal coronary arteries,
    11.1% had nonobstructive plaques, 7.7% had obstructive CAD (stenosis ≥50%) in
    1 vessel, 3.0% had obstructive CAD in 2 vessels, and 1.7% had obstructive CAD
    in 3 vessels or the left main artery. The average total plaque burden for all
    patients was 6.08% (SD ±12.74%), with a noncalcified plaque burden of 5.78% (SD
    ±12.02%), a fibrous plaque burden of 5.04% (SD±10.56%), a lipid plaque burden
    of 0.73% (SD ±1.90%), and a calcified plaque burden of 0.30% (SD ±1.63%; Table
    2).


    The baseline characteristics and outcomes of the training set (n=5901, 70%) and
    testing set (n=2530, 30%) are also detailed in Table 1. The median 10-year risk
    of CAD calculated by the pooled cohort equation risk score was 10.0% (interquartile
    range, 4.9–19.6). The cardiovascular risk factors, pooled cohort equation risk
    score, and MACE events in both groups were very similar, with no significant differences.
    The distribution of plaque burden was generally similar between the 2 cohorts
    (Table S3).


    # ## Comparison of Baseline and Coronary Features Between the Mace and Nonmace
    Groups


    In the training set, the MACE group was significantly older than the non-MACE
    group (60.66±9.49 versus


    54.65±10.08 years; P<0.001). The MACE group had a higher proportion of males (66.8%)
    and had a higher prevalence of traditional cardiovascular risk factors, except
    for family history of CAD, body mass index, and non-high-density lipoprotein cholesterol,
    compared with the non-MACE group (Table S4). The MACE group also had a higher
    incidence of obstructive CAD, greater stenosis rates, and a higher prevalence
    of high-risk plaques. In coronary artery quantitative analysis, the MACE group
    displayed significant differences in PVs and plaque burden across different plaque
    subtypes (all P<0.001). These results were similar in the testing cohort (Table
    2).


    # ## Feature Selection and Modeling Training


    Using all 48 CCTA candidate variables without feature elimination, the XGBoost
    model exhibited superior predictive performance on both training and testing sets,
    achieving a C-index of 0.918 to 0.925 and an AUC of 0.905 to 0.925, thereby outperforming
    5 other ML survival analysis algorithms. The comparison of different ML performance
    is summarized in Table 3; Table S5. The global interpretability of the XGBoost
    model and its top 20 most impactful features is illustrated using Shapley additive
    explanation value plots (Figure 1A and 1B). These key features were confirmed
    by clinical and imaging experts to be consistent with clinical relevance and underlying
    pathophysiology. A recursive feature elimination process identified 6 most important
    variables; the performance of the simplified final model is also detailed in Table
    3; Table S5, also with XGBoost chosen as the best model. In both the training
    and testing cohorts, all 6 CCTA features were independently associated with a
    higher MACE risk, independent of traditional cardiovascular risk factors and CACS
    (Table S6).


    # ## Model Performance Comparison


    In the training cohort, the simplified final model using 6 CCTA features (model
    3) predicted MACE with an ROC and AUC of 0.903 (95% CI, 0.872–0.933). In contrast,
    the clinical risk factors model (model 1) had an ROC AUC of 0.788 (95% CI, 0.740–0.837),
    and the combined clinical risk factors+CACS model (model 2) showed an ROC AUC
    of 0.830 (95% CI, 0.787–0.873). Thus, the clinical+CACS was only slightly superior
    to the clinical model (ΔAUC, 0.042 for model 2 versus model 1; P=0.100), the CCTA
    model performed significantly better than the clinical model and the combined
    clinical+CACS model (ΔAUC, 0.115 for model 3 versus model 1; ΔAUC, 0.073 for model
    3 versus model 2; P<0.001 for both). When CCTA features were added to the clinical
    model (model 4) and the clinical+CACS model (model 5), the ROC AUC improved to
    0.915(95% CI, 0.885–0.944) and 0.924 (95% CI, 0.897–0.950; P<0.001 for both; Figure
    2A; Table S7).'
