- pgno: 12
  md: 'different subgroups, suggesting that the ML model''s predictive ability may
    primarily derive from the atherosclerotic burden and plaque phenotype itself.
    However, due to the limited events, further validation in larger studies is needed.


    Our study also demonstrated the practical application of the integrated ML model
    in clinical practice, emphasizing each feature''s contribution to the final prediction
    score, thereby providing clear interpretability of the predicted outcomes. It
    enables direct visualization of coronary atherosclerosis and luminal stenosis,
    facilitating a deeper understanding of the pathophysiological mechanisms underlying
    coronary atherosclerosis. Moreover, the model can be incorporated into PACS systems
    to automatically generate individualized risk scores based on structured imaging
    parameters. When the predicted risk exceeds a predefined threshold, automated
    alerts can be triggered to assist clinicians in early intervention and treatment
    decision-making. Its application will transform the cardiovascular disease prevention
    strategies, shifting from population-level risk assessments to individual-level
    evaluation and intervention, aiding in identifying high-risk individuals for future
    cardiovascular events. Despite its strong prognostic value, CCTA has several limitations,
    including the need for iodinated contrast agents, exposure to ionizing radiation,
    reduced diagnostic accuracy in the presence of heavy coronary calcification, heart
    rate dependence, and limited availability in some settings.


    # Strengths and Limitations


    Our study has several notable strengths. It is a nationally representative, prospective
    registry cohort study with a large sample size and medium to long-term follow-up.
    Various advanced ML survival techniques were applied to establish a new multidimensional
    CCTA imaging prediction model. However, our study has several limitations: First,
    all data were derived from a single specialized tertiary medical center, which
    may result in selection bias. Although the model performed well in internal validation,
    its applicability needs to be confirmed through external validation, considering
    variations across regions, countries, and racial/ethnic. Second, this study did
    not capture detailed information on atypical ischemic symptoms or specific indications
    for CCTA, which may have introduced a degree of referral bias. Further validation
    in a clearly symptomatic population is warranted. Third, the types and dosages
    of lipid-lowering medications were not recorded during the follow-up period, which
    may affect the progression of adverse patient outcomes. Fourth, future studies
    could consider incorporating new CCTA parameters, such as coronary functional
    flow assessment and perivascular fat attenuation index, to provide additional
    information about cardiovascular risk and further improve modeling accuracy.


    # Conclusions


    This study combines CCTA with ML to develop and validate a more interpretable,
    accurate, individualized, and dynamic model for cardiovascular risk prediction.
    This model enhances risk stratification, thereby potentially advancing the clinical
    application and translation of CCTA imaging.


