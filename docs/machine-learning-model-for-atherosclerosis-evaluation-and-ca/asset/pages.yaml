  md: '# CLINICAL PERSPECTIVE


    Among 6 machine learning survival models trained with 48 coronary computed tomography
    angiography parameters, XGBoost showed the best performance and was selected for
    model development. Based on the XGBoost algorithm, a coronary computed tomography
    angiography machine learning model integrating 6 key imaging features—including
    diameter stenosis, lipid plaque burden and volume, total plaque volume, high-risk
    plaque and vessel volume—demonstrated superior predictive performance for major
    adverse cardiovascular events compared with models incorporating traditional clinical
    risk factors and coronary artery calcium score across multiple time points during
    1- to 5-year follow-up. This multidimensional model offers individualized, precise,
    and interpretable risk assessment, enabling early identification of patients with
    high-risk and guiding personalized prevention and intervention strategies.


    # Nonstandard Abbreviations and Acronyms


    | Acronym | Meaning |

    | --- | --- |

    | AMI | acute myocardial infarction |

    | AUC | area under the curve |

    | CACS | coronary artery calcium score |

    | CAD | coronary artery disease |

    | CCTA | coronary computed tomography angiography |

    | GLP1 | glucagon-like peptide-1 |

    | HU | Hounsfield unit |

    | MACE | major adverse cardiac event |

    | MACE | major adverse cardiovascular event |

    | ML | machine learning |

    | NRI | net reclassification improvement |

    | PV | plaque volume |

    | ROC | receiver operating characteristic curve |


    Recent studies indicate that various novel drug therapies, such as PCSK9 monoclonal
    antibody inhibitor,<sup>1,2</sup> inclisiran,<sup>3</sup> icosapent ethyl,<sup>4,5</sup>
    GLP1 (glucagon-like peptide-1) receptor agonists,<sup>6</sup> and colchicine,<sup>78</sup>
    effectively reduce ASCVD risk by altering coronary plaque phenotype and composition.
    Nevertheless, these treatments are relatively costly. Therefore, accurately identifying
    high-risk populations, optimizing clinical decision-making, maximizing cardiovascular
    benefits, and improving health care economic efficiency are critical issues to
    be solved.


    Current ASCVD prediction guidelines mainly rely on clinical risk scores and the
    coronary artery calcium score (CACS).<sup>9</sup> Risk algorithms including Systemic
    Coronary Risk Evaluation 2 system<sup>10</sup> and the Second Manifestations of
    Arterial disease 2,<sup>11</sup> Pooled Cohort Equations,<sup>12</sup>


    and the Framingham Risk Score<sup>13</sup> are based on traditional cardiovascular
    risk factors, have limited value in predicting ASCVD risk due to population-level
    differences, especially for Pooled Cohort Equation often overestimate risk in
    high-risk individuals and European populations even after recalibration, and cannot
    predict the complex pathophysiological processes of coronary atherosclerosis at
    individual-level.<sup>14-16</sup> The CACS is a noninvasive CT scan used to measure
    calcium deposits within coronary artery plaques. However, CACS does not provide
    information regarding noncalcified plaques or the extent of coronary stenosis.<sup>17</sup>
    Given the considerable heterogeneity in the prevalence and management of ASCVD,
    there is an urgent need for additional biomarkers or imaging indicators to enhance
    the prediction of future cardiovascular events.


    Despite practical barriers to the widespread clinical adoption of coronary computed
    tomography angiography (CCTA), such as relatively high cost, radiation exposure,
    and the risk of contrast-induced nephropathy, it remains a widely recognized noninvasive
    imaging modality. Beyond assessing the severity and extent of coronary artery
    stenosis, CCTA enables whole-heart visualization of adverse plaque characteristics,
    plaque distribution, and precise plaque quantification.<sup>18</sup> Recent studies
    have shown that plaque morphology and plaque quantification metrics are important
    risk predictors for cardiovascular events and hold great potential in improving
    ASCVD risk stratification.<sup>19,20</sup>


    Deep learning, a subset of artificial intelligence, has experienced substantial
    advancements with sophisticated algorithms emerging, including the DeepHit neural
    network. Additionally, XGBoost, an optimized implementation of gradient-boosted
    decision trees, has also made significant contributions to artificial intelligence
    applications. These advanced machine learning (ML) algorithms enable the integration
    of complex, multidimensional, and interactive data sets derived from CTA, which
    are challenging to analyze using traditional statistical methods. In particular,
    models like DeepHit are designed to capture time-to-event dynamics, while tree-based
    methods like XGBoost can flexibly incorporate engineered temporal features. At
    present, a CCTA-derived risk ML model that integrates coronary stenosis, plaque
    qualitative, and quantitative analysis across multiple dimensions has not yet
    been established. Integrating CCTA with advanced ML techniques to develop an interpretable,
    more accurate, personalized, and dynamic cardiovascular risk prediction model
    will help achieve better cardiovascular risk stratification and prediction, thereby
    promoting the clinical application and translational value of CTA imaging.


    The objective of this study is to create an ASCVD prediction model using a large-scale
    prospective registry based on CTA imaging. This model will be constructed using
    6 advanced ML survival techniques. Its'
