    After recalibrating all models, we tested their discrimination performance in
    the testing cohort. The simplified final model using CCTA features (model 3) predicted
    MACE events with an ROC and AUC of 0.899 (0.839–0.959). In contrast, the clinical
    risk factors model (model 1) had an ROC AUC of 0.708 (95% CI, 0.610–0.806), and
