- pgno: 11
  md: '# Risk Assessment for Cardiovascular Events Based on Conventional Risk Factors
    and CACS


    ASCVD risk assessment tools used in clinical practice predominantly focus on identifying
    population-level traditional risk factors, which pose challenges in reflecting
    the dynamic prevalence of disease and associated risk factors.27 CACS has substantial
    predictive value for cardiac events in both asymptomatic and symptomatic chest
    pain.28,29 Nevertheless, CACS is limited to quantifying calcified plaques within
    the coronary arteries and does not provide information regarding noncalcified
    plaques. A CAC score of zero does not equate to zero cardiovascular risk or the
    complete absence of atherosclerosis. Previous studies indicate that 5% to 16%
    of individuals with a CAC score of zero still have coronary plaques.30,31 The
    present study found that ≈5.9% of patients with a CAC score of zero similarly
    have coronary plaques. The CONFIRM study, involving 35 281 individuals with suspected
    CAD, demonstrated that an ML model incorporating clinical variables and CACS can
    improve the preoperative likelihood of detecting obstructive CAD.32


    A meta-analysis that included 6 cohort studies from different countries revealed
    that CACS provides incremental discriminatory ability beyond traditional cardiovascular
    disease risk assessment equations in predicting future cardiovascular event risk,
    yielding an incremental C-statistic of 0.036. This increment was relatively consistent
    across studies.33 Consistent with previous studies, our study found that the clinical
    prediction model incorporating 9 well-validated traditional cardiovascular risk
    factors showed an AUC ranging from 0.650 to 0.788 across different subgroups.
    Adding CACS to the clinical model resulted in an incremental C-statistic to 0.033
    to 0.085, without yielding a significant additional benefit. These findings further
    confirm the limitations of traditional cardiovascular risk factors in predicting
    cardiovascular events and highlight the modest incremental value of CACS over
    clinical risk factors.


    # Additional Discriminatory Value of ML-CCTA During Follow-Up


    Although previous literature has reported the predictive value of various CCTA
    variables, including anatomic stenosis severity, plaque phenotype, and plaque
    quantification analysis,34 however, the CONFIRM study primarily evaluated the
    feasibility of traditional ML models to combine clinical data with coronary stenosis
    severity.35 The subsequent CONFIRM2 study demonstrated artificial intelligence-derived
    quantitative plaque features were associated with a higher risk of MACE in women,
    suggesting the potential underestimation of cardiovascular risk in female patients
    and underscoring the need for more individualized interventions.36 In this study,
    we developed and validated a simplified novel model based on 6 key CCTA


    features through deep learning methods, with clinical risk factors and CACS serving
    as reference models, demonstrating significantly enhanced performance in predicting
    cardiac events. The 6 features represent distinct dimensions, including absolute
    atherosclerotic total plaque burden, relative and absolute lipid-rich plaque burden,
    coronary stenosis severity, and plaque phenotype. These imaging-derived risk factors
    are consistent with previous studies. Analysis of the ICONIC study found that
    the presence of severe stenosis (≥70%), the volume of low-density noncalcified
    plaque, and the presence of high-risk plaque was higher in ACS cases.37 In analysis
    from the multicenter PROMISE trial in 4451 patients, high-risk plaque was associated
    with a 70% increased risk of MACE, independent of other risk factors or the presence
    of obstructive disease.38 Also using external validation, validated deep learning
    system SCOT-HEART, Lin et al99 found that diameter stenosis ≥50% and total PV
    above 238.5 mm3, were associated with a >3 to 5-fold increased risk of future
    myocardial infarction. But did not incorporate multiple ML survival models. It
    is noteworthy that the incremental predictability of the 6 CCTA features remains
    consistent across different time points throughout the 5-year follow-up period.
    Therefore, the CREATION study emphasizes the importance of incorporating a broader
    range of multidimensional CCTA variables that reflect the pathophysiology of coronary
    atherosclerosis into cardiovascular risk assessment in a real-world Asian population.


    This study further identified the key predictors of ASCVD events and found that
    lipid plaque burden serves as the best imaging marker for assessing cardiovascular
    risk. Williams et al40 demonstrated that low-attenuation plaque burden >4% was
    nearly 5× more likely to have subsequent myocardial infarction in 1769 patients
    with stable chest pain undergoing CCTA in the SCOT-HEART trial, which is consistent
    with our findings. This highlights the critical role of plaque burden and phenotype
    in the pathogenesis of ASCVD events. Plaque rupture is associated with inflammatory
    plaques characterized by a thin fibrous cap and a large necrotic core.


    In this study, most MACE events were revascularizations occurring after 60 days,
    which may be influenced by CCTA findings rather than spontaneous events, which
    could lead to overestimation of the model''s predictive performance. To mitigate
    this intervention bias, we conducted a sensitivity analysis excluding all revascularizations.
    The findings remained unchanged when restricted to a secondary composite end point
    (death, myocardial infarction, and stroke), demonstrating strong robustness and
    applicability.


    We did not observe a significant impact of gender, age, or the presence of chest
    pain symptoms on the association between CCTA features and MACE risk. These results
    highlight the sustained prognostic significance of the ML-CCTA model for assessing
    MACE risk across'
