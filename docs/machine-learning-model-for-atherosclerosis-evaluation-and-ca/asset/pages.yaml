    # METHODS


    # Data Availability


    Due to ethical restrictions related to the consent given by subjects at the time
    of study commencement, our data sets are available from the corresponding author
    on reasonable request after permission from the institutional review board of
    Fuwai Hospital.


    # Study Cohorts


    This study is derived from the Coronary Atherosclerosis Progression and Prognosis
    Evaluation by Coronary CT Angiography multicenter prospective cohort (CREATION,
    URL: https://www.clinicaltrials.gov; Unique Identifier: NCT03518437). Currently,
    complete and standardized coronary CT imaging data are available only from the
    Fuwai Hospital center, while imaging data from other participating centers remain
    under collection. This analysis includes 8873 patients with suspected coronary
    artery disease (CAD) who underwent CCTA at Fuwai Hospital between January 2016
    and August 2019. Initially, all patients were referred for CCTA by their cardiologists.
    For the present study, we excluded subjects who have incomplete clinical information
    (n=33), nondiagnostic coronary images because of motion artifacts or inadequate
    contrast concentration on CCTA images (n=12), or have other heart diseases (eg,
    cardiomyopathy, n=25; valvular heart disease, n=12; congenital heart disease,
    n=39), and lost to follow-up patients (301 patients could not be contacted, 20
    patients could not provide accurate outcome information). Eventually, 8431 patients
    were enrolled for final analysis (Figure S1). The study complied with the Declaration
    of Helsinki, all patients provided informed consent for inclusion in the registry,
    and institutional review board approval was obtained at each center.


    # CCTA Scanning Protocols and Image Analysis


    The detailed information regarding the computed tomography scanners used for the
    study population is available in the Supplemental Methods. The coronary CTA images
    were audited by the core laboratory for image analysis.


    For plaque measurement, we adjusted the plaque threshold slider to separate the
    Hounsfield unit (HU) values that separate different plaque characteristics into
    lipid (<30 HU), fibrous (30–150 HU), calcified plaque (>350 HU), and lumen (350–350
    HU). A color map overlay was displayed between the start and end of a plaque,
    highlighting lumen, calcified plaque, and noncalcified plaque in different colors
    determined by HU values. Adverse plaque characteristics include low attenuation
    plaque (pixel density ≤30 HU), positive remodeling (remodeling index ≥1.1), spotty
    calcification (average density >330 HU, with a diameter <3 mm in any direction),
    and the napkin-ring sign (a ring-like attenuation pattern with peripheral high
    attenuation and central low attenuation; legends detailed in Figure S2). High-risk
    plaque is defined as a lesion with ≥2 adverse plaque characteristics. Quantitative
    plaque characteristics include plaque volume (PV) and subtypes (in cubic millimeters),
    including total PV, noncalcified PV, calcified PV, fibrous


    PV, and lipid PV. Plaque burden (expressed as a percentage) is defined as the
    corresponding PV divided by the vessel volume, then multiplied by 100, including
    percent total PV, percent noncalcified PV, percent calcified PV, percent fibrous
    PV, and percent lipid PV. Total PV is calculated by summing the volumes of the
    3 components, while noncalcified PV is calculated by summing the volumes of the
    fibrous and lipid components. For patients with normal coronary arteries, PV and
    burden are set to 0. The volumes of various plaque components were quantified
    using validated automated plaque software (Deep Blue, ADW4.6, GE Healthcare, Milwaukee,
    WI). Two radiologists worked together to determine the location and extent of
    the plaques and reached a consensus to derive the final results. There was high
    interobserver and intraobserver agreement in evaluating CCTA (k statistic: 0.97,
    0.98, respectively).


    # Clinical Data


    A structured interview was conducted before CCTA to collect information on symptoms,
    demographic characteristics, and the presence of cardiovascular risk factors.
    Hypertension was defined as a previously established diagnosis, systolic blood
    pressure >140 mmHg, diastolic blood pressure >90 mmHg, or antihypertensive medication
    use. Hypercholesterolemia was defined according to the National Cholesterol Education
    Panel guidelines or by the current use of lipid-lowering medication. Diabetes
    was defined as a previously established diagnosis, insulin, or oral hypoglycemic
    therapy. Family history of CAD was defined as myocardial infarction, coronary
    revascularization, or sudden cardiac death for father <55 years old or mother
    <65 years old. Smoking was defined as any cigarette smoking within 1 year before
    the CCTA exam. Diabetes was defined as a fasting plasma glucose level of ≥126
    mg/dL, glycated hemoglobin of ≥6.5%, or treatment with any antidiabetic drugs.
    Hyperlipidemia was defined as triglycerides of ≥200 mg/dL, total cholesterol of
    >240 mg/dL, low-density lipoprotein cholesterol of ≥160 mg/dL, high-density lipoprotein
    cholesterol <40 mg/dL, or treatment with any lipid-lowering medications.


    # Outcome


    The primary end point was major adverse cardiac events (MACE) obtained from patient
    telephone interviews, contact with the patients'' physicians, and hospital records.
    A standard questionnaire was used during the telephone interview. MACE included
    any of the following: (1) all-cause death, (2) acute myocardial infarction (AMI),
    (3) coronary revascularization (percutaneous coronary intervention and coronary
    artery bypass graft), and (4) stroke. AMI was defined based on the criteria of
    typical chest pain, elevated cardiac enzyme levels, and typical alterations of
    the ECG. The decision to submit patients to revascularization was made by referring
    physicians, taking into account all available information and patient preferences.
    Revascularization procedures within 60 days after CCTA were considered to be triggered
    by the scan and were not considered events (physicians were likely to include
    CCTA findings in management decisions). When a patient experienced >1 MACE, the
    first event was chosen. When 2 MACE occurred simultaneously, the worst event was
    chosen (death>AMI>stroke>revascularization). An adjudication outcome panel of
    2 physicians reviewed the patient data forms and verified by 2 review of medical
    records to determine whether a patient had MACE during the follow-up period.'
