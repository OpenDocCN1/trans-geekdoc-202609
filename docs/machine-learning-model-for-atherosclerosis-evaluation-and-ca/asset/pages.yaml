    Even after excluding all revascularization events and defining death, myocardial
    infarction, and stroke as the secondary composite end point, the overall incidence
    remained 1.1% (94/8431). The discriminative performance of the 5 models showed
    no significant change in this analysis (Online Appendix; Table S8; Figure S5).
    Figure 3 presents the time-dependent ROC curve analysis conducted at 1-year intervals.
    When evaluating the predictability of the 5 prediction models at different time
    points, the CCTA prediction model consistently demonstrated higher predictability
    than the clinical + CACS model, regardless of the timing of event occurrence.
    Additionally, the integrated model of clinical+CACS and CCTA exhibited enhanced
    predictive value. However, it is noteworthy that the overall predictability of
    these models tended to decrease when predicting long-term cardiovascular events.
    The individualized interpretation of the risk model was evaluated using the Shapley
    additive explanation waterfall plot to assess the contribution of each component
    within the CCTA prediction model to the overall discrimination ability. Figure
    4 depicts 2 representative cases in the testing cohort, illustrating how each
    component contributes to the classifier''s output in predicting MACE versus non-MACE
    events. In the illustrated MACE event case, lipid plaque burden provided the highest
    incremental contribution to the classifier''s output when predicting the future
    occurrence of MACE. Moreover, Figure S6 shows false-positive and false-negative
    examples in MACE prediction.


    # Subgroup Analysis


    The ML model was subsequently evaluated within selected subgroups stratified by
    gender (female versus male), chest pain (symptomatic versus asymptomatic), and
    CAD onset ages (early onset versus late-onset). The CCTA model similarly exhibited
    consistently improved discrimination ability for predicting MACE compared with
    traditional clinical risk factors and CACS across these 3 subgroups (Online Appendix;
    Tables S9 through S11, and Figures S7 through S9).


    # Sensitivity Analysis


    In this study, the proportion of individuals with normal coronary arteries was
    relatively high. Therefore, a sensitivity analysis was performed, excluding the
    normal coronary arteries, only focusing on individuals with coronary atherosclerosis
    and CACS >0. The discriminatory performance of the 5 models did not show significant
    changes (Online Appendix; Tables S12 and S13; Figures S10 and S11). The MACE prediction
    remained consistent when compared with the entire suspected CAD population.


    # DISCUSSION


    In a large prospective registry study, we applied various advanced ML techniques
    to establish a new predictive model based on CCTA. This model integrates multiple
    dimensions of coronary plaque, qualitative and'
