    对于斑块测量，我们调整了斑块阈值滑块，以分离分离不同斑块特征的豪斯菲尔德单位（HU）值，分别为脂质（<30 HU）、纤维（30–150 HU）、钙化斑块（>350
    HU）和腔内（350–350 HU）。在斑块的起始和结束处显示了彩色图叠加，根据HU值以不同颜色突出显示腔内、钙化斑块和非钙化斑块。不良斑块特征包括低密度斑块（像素密度≤30
    HU）、阳性重塑（重塑指数≥1.1）、点状钙化（平均密度>330 HU，任何方向直径<3 mm）以及napkin-ring sign（餐巾环征，外周高密度伴中心低密度的环状密度模式；图例详见图S2）。高危斑块定义为具有≥2个不良斑块特征的病变。定量斑块特征包括斑块体积（PV）及亚型（以立方毫米计），包括总PV、非钙化PV、钙化PV、纤维PV和脂质PV。斑块负担（以百分比表示）定义为相应PV除以血管体积，然后乘以100，包括总PV百分比、非钙化PV百分比、钙化PV百分比、纤维PV百分比和脂质PV百分比。总PV通过求和3个成分的体积计算，而非钙化PV通过求和纤维和脂质成分的体积计算。对于冠状动脉正常的患者，PV和负担设为0。各种斑块成分的体积使用经过验证的自动化斑块软件（Deep
