    ## 原始文章


    ## 基于冠状动脉CT血管造影的粥状硬化评估与心血管风险预测机器学习模型——来自CREATION登记册的分析


    Ying Song, MD*; Na Xu, MD*; Jianan Zheng, MD; Sida Jia, MD; Cheng Cui, MD; Yin
    Zhang, MD; Lijian Gao, MD; Zhan Gao, MD; Jue Chen, MD; Lei Song, MD; Jinqing Yuan,
    MD; Bin Lu, MD*; Hou Zhi-hui, MD†


    ### 背景


    基于传统风险因素和冠状动脉钙化评分的当前ASCVD风险预测工具存在局限性。


    ### 方法


    CREATION研究包括在2016年至2019年间于阜外医院接受冠状动脉计算机血管造影（CCTA）的疑似冠状动脉疾病患者。主要终点为重大不良心脏事件，定义为全因死亡、急性心肌梗死、冠状动脉血运重建或中风的复合终点。采用六种机器学习生存模型创建ASCVD预测模型。


    ### 结果


    总计，纳入了8431名具有可分析CCTA数据的参与者，中位随访期为3.68年，发生319例重大不良心脏事件（3.8%）（平均年龄54.73±10.21岁，48.2%为男性，50.9%伴有症状性胸痛）。在用48个CCTA参数训练的6种机器学习模型中，XGBoost表现最佳并被选用于模型开发。在训练队列（n=5901，70%）中，XGBoost模型显著优于临床风险因素和冠状动脉钙化评分模型（曲线下面积，0.903对0.830；P<0.001）。测试队列显示出相似的性能（曲线下面积，0.899对0.753；P<0.001）。CCTA模型在性别（女性或男性）、发病年龄（早发或晚发）和症状（无症状或有症状）亚组分析中表现出一致的预测性能。最终CCTA模型包括直径狭窄、脂质斑块负担和体积、斑块总体积、高危斑块和血管体积作为最重要的特征。脂质斑块负担与重大不良心脏事件的关联最为紧密（每增加5%的调整后危险比：2.524
    [95% CI，2.157–2.996]；P<0.001）。机器学习CCTA特征的增量价值在1至5年随访期间的不同时间点上保持一致。当限制于次要复合终点（死亡、心肌梗死或中风）时，研究结果保持不变。


    ### 结论


    纳入CCTA斑块定量、特征评估和狭窄评估的机器学习模型显著增强了对重大不良心脏事件的预测能力。它提供了冠状动脉粥样硬化的直接可视化，并优于临床实践中推荐的传统风险因素和冠状动脉钙化评分模型。


    ### 图文摘要


    本文有图文摘要可供查阅。


    ### 关键词


    胸痛 ■ 冠状动脉疾病 ■ 脂质 ■ 机器学习 ■ 心肌梗死


    ## 临床视角


    在用48个冠状动脉计算机血管造影参数训练的6种机器学习生存模型中，XGBoost表现最佳并被选用于模型开发。基于XGBoost算法，整合6项关键影像特征（包括直径狭窄、脂质斑块负担和体积、斑块总体积、高危斑块及血管体积）的冠状动脉计算机血管造影机器学习模型，在1至5年随访期间的多个时间点上，对重大不良心血管事件的预测性能优于纳入传统临床风险因素和冠状动脉钙化评分的模型。这种多维模型提供个性化、精确且可解释的风险评估，能够早期识别高风险患者，并指导个性化的预防和干预策略。


    ### 非标准缩写和首字母缩略词


    | 缩写 | 含义 |

    | --- | --- |

    | AMI | 急性心肌梗死 |

    | AUC | 曲线下面积 |

    | CACS | 冠状动脉钙化评分 |

    | CAD | 冠状动脉疾病 |

    | CCTA | 冠状动脉计算机血管造影 |

    | GLP1 | 胰高血糖素样肽-1 |

    | HU | 霍恩斯菲尔德单位 |

    | MACE | 重大不良心脏事件 |

    | MACE | 重大不良心血管事件 |

    | ML | 机器学习 |

    | NRI | 净重分类改善 |

    | PV | 斑块体积 |

    | ROC | 接收者操作特征曲线 |


    近期研究表明，PCSK9单克隆抗体抑制剂<sup>1,2</sup>、英司利兰<sup>3</sup>、乙基二十碳五烯酸<sup>4,5</sup>、GLP1（胰高血糖素样肽-1）受体激动剂<sup>6</sup>和秋水仙碱<sup>7,8</sup>等多种新型药物疗法，可通过改变冠状动脉斑块表型和成分有效降低ASCVD风险。然而，这些治疗费用相对较高。因此，准确识别高风险人群、优化临床决策、最大化心血管获益以及提高医疗经济效率，是亟待解决的关键问题。


    目前的ASCVD预防指南主要依赖临床风险评分和冠状动脉钙化评分（CACS）。<sup>9</sup> 包括系统性冠心病风险评估2系统<sup>10</sup>、动脉疾病第二次表现2<sup>11</sup>、聚合队列方程<sup>12</sup>和弗雷明汉风险评分<sup>13</sup>在内的风险算法基于传统心血管风险因素，由于人群水平差异，在预测ASCVD风险方面价值有限，尤其是聚合队列方程即使在重新校准后，也经常高估高危个体和欧洲人群的风险，且无法在个体水平上预测冠状动脉粥样硬化的复杂病理生理过程。<sup>14-16</sup>
    CACS是一种非侵入性CT扫描，用于测量冠状动脉斑块内的钙质沉积。然而，CACS不提供关于非钙化斑块或冠状动脉狭窄程度的信息。<sup>17</sup> 鉴于ASCVD患病率和管理的显著异质性，迫切需要额外的生物标志物或影像指标来增强对未来心血管事件的预测。


    尽管冠状动脉计算机血管造影（CCTA）在广泛临床应用中存在实际障碍，例如成本相对较高、辐射暴露以及对比剂诱发性肾病的风险，但它仍然是一种广泛认可的非侵入性影像学检查方法。除了评估冠状动脉狭窄的严重程度和范围外，CCTA还能实现对不良斑块特征、斑块分布的全脏器可视化以及精确的斑块定量。<sup>18</sup>
    近期研究表明，斑块形态学和斑块定量指标是心血管事件的重要风险预测因子，在改善ASCVD风险分层方面具有巨大潜力。<sup>19,20</sup>


    深度学习作为人工智能的一个子集，经历了重大进展，涌现出包括DeepHit神经网络在内的复杂算法。此外，XGBoost作为梯度提升决策树的优化实现，也在人工智能应用中做出了重要贡献。这些先进的机器学习（ML）算法能够整合来自CTA的复杂、多维和交互式数据集，这些数据集使用传统统计方法难以分析。特别是，像DeepHit这样的模型旨在捕捉时间至事件动态，而像XGBoost这样的基于树的方法可以灵活地融入工程化的时间特征。目前，尚未建立一种整合冠状动脉狭窄、斑块定性与定量分析的多维CCTA衍生风险ML模型。将CCTA与先进的ML技术相结合，开发可解释、更准确、个性化和动态的心血管风险预测模型，将有助于实现更好的心血管风险分层和预测，从而促进CTA影像的临床应用和转化价值。


    本研究的目的是利用基于CTA影像的大规模前瞻性登记库创建ASCVD预测模型。该模型将采用6种先进的ML生存技术构建。其

