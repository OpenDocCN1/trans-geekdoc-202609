    as reference models, demonstrating significantly enhanced performance in predicting
    cardiac events. The 6 features represent distinct dimensions, including absolute
    atherosclerotic total plaque burden, relative and absolute lipid-rich plaque burden,
    coronary stenosis severity, and plaque phenotype. These imaging-derived risk factors
    are consistent with previous studies. Analysis of the ICONIC study found that
    the presence of severe stenosis (≥70%), the volume of low-density noncalcified
    plaque, and the presence of high-risk plaque was higher in ACS cases.37 In analysis
