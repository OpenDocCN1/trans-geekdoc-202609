    # CLINICAL PERSPECTIVE


    Among 6 machine learning survival models trained with 48 coronary computed tomography
    angiography parameters, XGBoost showed the best performance and was selected for
    model development. Based on the XGBoost algorithm, a coronary computed tomography
    angiography machine learning model integrating 6 key imaging features—including
    diameter stenosis, lipid plaque burden and volume, total plaque volume, high-risk
    plaque and vessel volume—demonstrated superior predictive performance for major
    adverse cardiovascular events compared with models incorporating traditional clinical
    risk factors and coronary artery calcium score across multiple time points during
    1- to 5-year follow-up. This multidimensional model offers individualized, precise,
    and interpretable risk assessment, enabling early identification of patients with
    high-risk and guiding personalized prevention and intervention strategies.


