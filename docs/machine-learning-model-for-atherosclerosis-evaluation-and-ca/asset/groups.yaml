    随后，在按性别（女性与男性）、胸痛（有症状与无症状）和冠心病发病年龄（早发性与晚发性）分层的选定亚组中，对 ML 模型进行了评估。在这些 3 个亚组中，CCTA
    模型与传统临床危险因素和 CACS 相比，同样表现出预测 MACE 的持续改善的鉴别能力（网上附录；表 S9 至 S11，以及图 S7 至 S9）。


    ## 敏感性分析


    本研究中，冠状动脉正常个体的比例相对较高。因此，进行了敏感性分析，排除了冠状动脉正常者，仅关注有冠状动脉粥样硬化且 CACS >0 的个体。5 个模型的鉴别性能没有显著变化（网上附录；表
    S12 和 S13；图 S10 和 S11）。与整个可疑冠心病人群相比，MACE 预测保持一致。


    ## 讨论


    在一项大型前瞻性登记研究中，我们应用了各种先进的机器学习技术，建立了基于 CCTA 的新预测模型。该模型整合了冠状动脉斑块的多维度定性与


    ![](img/2c742bd2457d5ae0fac24d154467ac60_10_0.png)


    图 4. 基于最佳冠状动脉计算机断层血管造影（CCTA）特征的个体风险预测，包含主要不良心血管事件（MACE）和无 MACE 病例示例。通过极端梯度提升（XGBoost）机器学习模型对
    2 个准确预测示例进行个性化解释，展示了每个特征对 MACE 发生概率的个体贡献。特征按影响程度递减排列，红色箭头表示 MACE 风险增加，蓝色箭头表示 MACE
    风险降低。(A) 和 (B) 分别为一名 63 岁 MACE 男性患者和一名 65 岁无 MACE 男性患者的 CCTA 图像。


    定量特征、斑块位置和狭窄度。主要结果如下：首先，我们证明，包含 6 个最佳 CCTA 特征的模型在预测 MACE 时显著优于临床加 CACS 模型。在训练队列和测试队列中，CCTA
    模型均表现出更好的鉴别性能、良好的校准，并提供了显著的 NRI。其次，无论事件发生时间如何，新的 CCTA 模型均优于临床和 CACS 风险模型。结合这些模型进一步提高了鉴别性能，表明
    CCTA 特征相对于临床和 CACS 提供了增量预测价值。第三，可解释的 CCTA-ML 模型将脂质斑块负荷确定为风险预测中最具影响力的特征；最后，CTA
    的预测价值在不同亚组中保持一致，包括性别、年龄（早发或晚发）和有症状亚组，强调了其在临床风险分层中的持续价值。本研究结果证实，CCTA 模型显著提高了 MACE
    事件的预测准确性，为高危人群的风险分层提供了巨大潜力。此外，这些结果丰富了整合 CCTA 影像的机器学习技术在精确预测 ASCVD 事件中的应用。


    ## 机器学习算法的优势


    冠状动脉 CTA 产生广泛、复杂、多维、非线性且交互的数据集，可使用 ML 技术快速处理。随着 ML 算法的持续更新，生存预测模型（如深度学习神经网络和 XGBoost）已显示出预测时间至事件结局的能力。本研究表明，整合
    CTA 参数的 XGBoost 算法提供了优越的预后价值，超越了其他常规 ML 算法。其部署门槛低、运行效率高、可集成性强，使其更适用于现实世界临床应用，并使日益可行的个体化风险预测成为可能，凸显了在
    CTA 分析中开发和应用深度学习算法的巨大潜力。


    ## 基于常规危险因素和 CACS 的心血管事件风险评估


    临床实践中使用的 ASCVD 风险评估工具主要侧重于识别人群层面的传统危险因素，这在反映疾病及相关危险因素的动态患病率方面存在挑战。27 CACS 对无症状和有症状胸痛的心脏事件具有显著的预测价值。28,29
    尽管如此，CACS 仅限于量化冠状动脉内的钙化斑块，不提供非钙化斑块的信息。CAC 得分为零并不等同于心血管风险为零或完全没有粥样硬化。先前研究表明，5%
    至 16% 的 CAC 得分为零的个体仍有冠状动脉斑块。30,31 本研究发现，约 5.9% 的 CAC 得分为零的患者同样存在冠状动脉斑块。CONFIRM
    研究涉及 35,281 名可疑冠心病个体，证明整合临床变量和 CACS 的 ML 模型可以改善检测梗阻性冠心病的术前可能性。32


    一项包含不同国家 6 个队列研究的 Meta 分析显示，CACS 在预测未来心血管事件风险方面，超越传统心血管疾病风险评估方程提供了增量鉴别能力，增量 C-statistic
    为 0.036。这一增量在各研究中相对一致。33 与先前研究一致，本研究发现，整合 9 个经过充分验证的传统心血管危险因素的临床预测模型，在不同亚组中显示出的
    AUC 范围为 0.650 至 0.788。将 CACS 加入临床模型后，增量 C-statistic 为 0.033 至 0.085，未产生显著的额外益处。这些发现进一步证实了传统心血管危险因素在预测心血管事件方面的局限性，并强调了
    CACS 相对于临床危险因素的适度增量价值。


    ## 随访期间 ML-CCTA 的额外鉴别价值


    尽管先前文献已报告了各种 CCTA 变量（包括解剖狭窄程度、斑块表型和斑块定量分析）的预测价值，34 然而，CONFIRM 研究主要评估了传统 ML 模型结合临床数据与冠状动脉狭窄程度的可行性。35
    随后的 CONFIRM2 研究显示，人工智能衍生的定量斑块特征与女性较高 MACE 风险相关，提示可能低估了女性患者的心血管风险，并强调需要更加个体化的干预。36
    在本研究中，我们通过深度学习方法，基于 6 个关键 CCTA 特征开发并验证了一种简化的新型模型，以临床危险因素和 CACS 作为参考模型，证明在预测心脏事件方面性能显著增强。这
    6 个特征代表不同维度，包括绝对粥样硬化总斑块负荷、相对和绝对富脂斑块负荷、冠状动脉狭窄程度以及斑块表型。这些影像衍生的危险因素与先前研究一致。ICONIC
    研究分析发现，在 ACS 病例中，严重狭窄（≥70%）的存在、低密度非钙化斑块体积以及高危斑块的存在更高。37 在多中心 PROMISE 试验中对 4451
    名患者的分析显示，高危斑块与 MACE 风险增加 70% 相关，独立于其他危险因素或梗阻性疾病的存在。38 同样使用外部验证，经验证的深度学习系统 SCOT-HEART，Lin
    等人99 发现，直径狭窄 ≥50% 且总 PV 高于 238.5 mm³ 与未来心肌梗死风险增加 >3 至 5 倍相关。但未纳入多个 ML 生存模型。值得注意的是，6
    个 CCTA 特征的增量可预测性在整个 5 年随访期间的不同时间点保持一致。因此，CREATION 研究强调将反映冠状动脉粥样硬化病理生理学的更广泛多维 CCTA
    变量纳入现实世界亚洲人群心血管风险评估的重要性。


    本研究进一步确定了 ASCVD 事件的关键预测因子，并发现脂质斑块负荷是评估心血管风险的最佳影像标志。Williams 等人40 证明，在 SCOT-HEART
    试验中，1769 名接受 CCTA 的稳定性胸痛患者中，低密度斑块负荷 >4% 后续发生心肌梗死的可能性高出近 5 倍，这与我们的发现一致。这凸显了斑块负荷和表型在
    ASCVD 事件发病机制中的关键作用。斑块破裂与具有薄纤维帽和大坏死核的炎症性斑块相关。


    在本研究中，大多数 MACE 事件为 60 天后发生的再血管化，可能受 CCTA 结果影响而非自发性事件，这可能导致对模型预测性能的高估。为了减轻这种干预偏倚，我们进行了排除所有再血管化的敏感性分析。当限制于次要复合终点（死亡、心肌梗死和脑卒中）时，结果保持不变，表明具有强健的稳健性和适用性。


    我们未观察到性别、年龄或胸痛症状的存在对 CCTA 特征与 MACE 风险之间关联的显著影响。这些结果突出了 ML-CCTA 模型在不同亚组中评估 MACE
    风险的持续预后意义。


