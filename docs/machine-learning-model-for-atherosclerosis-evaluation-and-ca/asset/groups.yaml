    tomography angiography (CCTA), such as relatively high cost, radiation exposure,
    and the risk of contrast-induced nephropathy, it remains a widely recognized noninvasive
    imaging modality. Beyond assessing the severity and extent of coronary artery
    stenosis, CCTA enables whole-heart visualization of adverse plaque characteristics,
    plaque distribution, and precise plaque quantification.<sup>18</sup> Recent studies
    have shown that plaque morphology and plaque quantification metrics are important
    risk predictors for cardiovascular events and hold great potential in improving
    ASCVD risk stratification.<sup>19,20</sup>


