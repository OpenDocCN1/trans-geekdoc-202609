    所有作者均参与了研究的构思与设计。许博士、宋博士、郑博士、贾博士、崔博士、张博士、L.高博士、Z.高博士和陈博士参与了数据收集与分析。Zhi-hui博士、Lu博士、Yuan博士和L.宋博士对文章进行了关键性修订。所有作者阅读并批准了最终文章。前两位作者平等贡献：许博士负责该项工作的算法开发部分，宋博士负责医学部分，两位第一作者均平等参与了文章撰写。


    ## 资助来源


    本工作得到中国医学科学院医学创新基金（2023-I2M-C&T-B-061）；中国医学科学院医学创新基金（2021-I2M-1-008）；国家高水平医院临床研究资助（2024-GSP-TJ-8）；中国医学科学院医学创新基金（2023-I2M-1-002）支持。


    ## 利益冲突


    无。


