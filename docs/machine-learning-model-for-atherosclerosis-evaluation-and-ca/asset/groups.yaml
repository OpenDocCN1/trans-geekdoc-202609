    在训练队列中，使用6个CCTA特征的简化最终模型（模型3）预测MACE的ROC和AUC为0.903（95% CI，0.872–0.933）。相比之下，临床风险因素模型（模型1）的ROC
    AUC为0.788（95% CI，0.740–0.837），联合临床风险因素+CACS模型（模型2）的ROC AUC为0.830（95% CI，0.787–0.873）。因此，临床+CACS模型仅略优于临床模型（模型2
    versus模型1的ΔAUC为0.042；P=0.100），CCTA模型明显优于临床模型和联合临床+CACS模型（模型3 versus模型1的ΔAUC为0.115；模型3
    versus模型2的ΔAUC为0.073；两者P均<0.001）。当将CCTA特征加入临床模型（模型4）和临床+CACS模型（模型5）时，ROC AUC分别提高至0.915（95%
    CI，0.885–0.944）和0.924（95% CI，0.897–0.950；两者P均<0.001；图2A；补充表S7）。


