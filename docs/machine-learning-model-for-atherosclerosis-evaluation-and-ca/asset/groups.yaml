    ability, suggesting that CCTA features offer additional predictive value beyond
    the clinical and CACS models. The results presented in Table 4 and Table S7 illustrate
    the calibration of the clinical model, clinical+CACS, CCTA, and combined models
    within both the training and testing cohorts, as assessed quantitatively using
    the Brier score. All 5 models demonstrated good calibration, with the calibration
    improving progressively in combined models. We calculated the NRI by comparing
    the CCTA model with the clinical+CACS model. In the training cohort, the NRI was
    0.241 (95% CI, 0.153–0.330), while in the testing cohort, the NRI was 0.420 (95%
    CI, 0.247–0.593). The findings indicate that the CCTA model offers superior predictive
    accuracy for MACE compared with the clinical + CACS model and significantly enhances
    risk reclassification. The observed NRI increase underscores that the CCTA model
    has a notable advantage in identifying patients with high risk, who were not sufficiently
    predicted by the clinical + CACS model. Overall, the CCTA model remains excellent
    in calibration, making it reliable and practical for clinical applications.


