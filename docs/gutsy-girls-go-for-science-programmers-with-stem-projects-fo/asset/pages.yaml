  md: '# Private Industry


    Margaret left MIT in the mid-1970s to develop her own business. She co-founded
    Higher Order Software in 1976. She was CEO for eight years. In 1986, she started
    Hamilton Technologies Inc. Both of these businesses focus on programming and software.


