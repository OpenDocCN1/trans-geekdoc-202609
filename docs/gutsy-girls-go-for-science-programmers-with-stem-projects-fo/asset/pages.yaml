- pgno: 15
  md: '# Crack the Code


    Computers read binary code, or machine code. A binary digit, also known as a bit,
    is a building block of information. The most basic code is binary, using a system
    of zeros (0) and ones (1). The series of 0s and 1s is hard for humans to read,
    but this is what computers understand.


    So how do we get from human language to the computer language made of 0s and 1s?
    Programmers write instructions in a language called source code, which looks a
    bit like random words and punctuation, but is actually filled with meaning! This
    source code is translated into the machine code that computers understand. Sometimes,
    computer scientists use a program called compiler to do this.


    Have you ever played Minecraft? This computer game is written with a computer
    language called Java!


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_15_0.png)'
  merge: -1
  img_proc: true
