- pgno: 27
  md: '# A Meeting of Minds


    When Ada was 17, she met Charles Babbage (1791–1871), a mathematics professor
    at Cambridge University. Charles showed Ada his plans for a small-scale model,
    called a prototype, of a calculating machine he was working on. He called it a
    Difference Engine. He envisioned it as a hand-cranked calculator with about 4,000
    parts. It would weigh at least 2 tons.


    # BECOMING COUNTESS


    When she was 19, Ada met and married William King. Soon after their marriage,
    she became an earl, which meant that she became the Countess of Lovelace. Her
    official name is August Byron King-Noel, Countess of Lovelace. Today, she is most
    often referred to as Ada Lovelace.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_27_0.png)


    Gutsy Girls Go for Science: Programmers'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Ada LOVELACE

    THE COUNTESS OF COMPUTERS


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_28_0.png)


    > > **A model of Charles Babbage''s

    Difference Engine in an exhibit at

    the Computer History Museum**

    > credit: Jitze Couperus (CC BY 2.0)


    Ada was excited about the calculating machine. Charles realized that she understood
    mathematics in a way that that few people did. He called her the “Enchantress
    of Numbers.”


    The two became friends and wrote frequent letters to each other about mathematics
    and logic.


    > > Did Ada''s wealth give her opportunities that other girls didn''t have? If
    she had been poor, would she still have been so involved in math?


    # Wonder


    20'
