  img_proc: true
- pgno: 68
  md: 'The women all had long careers with computers and received many awards for
    their work. Despite the lack of early recognition, all six programmers were inducted
    into the Women in Technology International Hall of Fame in 1997.


    > As the only ENIAC programmer born outside the United States, Kay received recognition
    from her birth country as well. The Irish Times referred to her as the “Irish
    mother” of computer programming.


    # # BLACK GIRLS CODE


    Electrical engineer Kimberly Bryant launched the organization BlackGirlsCode in
    2011. BlackGirlsCode was created to show the world that African American girls
    can code—and do a whole lot more. Workshops, after-school programs, and camps
    introduce coding to young girls living in communities lacking computer science
    classes. The organization is committed to bridging the “digital divide.” Within
    two years, BlackGirlsCode was working within seven states in the United States
    in addition to Johannesburg, South Africa. And they are expanding. BlackGirlsCode
    plans on teaching coding to 1 million girls by 2040.


    Listen to one student talk about what BlackGirlsCode has done for her at this
    website.


    Connect . . . . . . . . . . . . . . . .


    Colgate Black Girls Code'
