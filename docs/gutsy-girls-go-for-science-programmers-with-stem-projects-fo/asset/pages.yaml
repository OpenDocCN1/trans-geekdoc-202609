- pgno: 21
  md: 'The person considered to be one of the first computer programmers didn''t actually
    work on a computer. She had to use her imagination and write notes on how people
    could communicate with computers, which hadn''t quite been invented yet. But the
    work she did laid the foundation for future languages that people still use today.


    In fact, in the 1970s, the U.S. Department of Defense developed a new programming
    language named ADA. This language is named after Ada Lovelace, the first computer
    programmer!


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_21_0.png)


    # Ada Lovelace


    credit: Alfred Edward Chalon


    +   TIMELINE

    * 1815 Ada Lovelace is born.

    * 1828 Ada designs a flying machine.


    # Gutsy Girls Go for Science: Programmers'
