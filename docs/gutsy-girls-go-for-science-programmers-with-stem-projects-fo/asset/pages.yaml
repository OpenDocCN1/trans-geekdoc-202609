    | World II ends. | ENIAC is announced to the public. The role of women is overlooked.
    | The ENIAC women are inducted into the Women in Technology Hall of Fame. | The
    Computer History Museum honors Jean Bartik with its Fellows Award. | The Computers,
    a documentary about the ENIAC women, is released.'
