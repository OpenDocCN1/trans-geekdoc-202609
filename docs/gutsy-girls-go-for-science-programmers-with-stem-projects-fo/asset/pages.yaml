- pgno: 49
  md: 'Five years later, she was 66 and past the age when many people retired. She
    was also past the age when many people were promoted. But a special vote of the
    U.S. Congress promoted her to captain. She was later promoted to commodore and
    then rear admiral.


    When Grace retired from the Navy in 1986, she was just a few months from her 80th
    birthday. She was the oldest-serving officer in all of the armed forces. The highest
    honor from the U.S. Department of Defense Distinguished Service Medal, was presented
    to her. Grace passed away in 1992.


    > Grace had many nicknames. Among them, "Amazing Grace," "Grand Lady of Software,"
    and the "Queen of Code."


