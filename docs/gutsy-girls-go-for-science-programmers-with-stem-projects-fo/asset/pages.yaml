- pgno: 22
  md: '# As a Kid


    A man named Lord Byron was a famous poet in the early 1800s. At a party one day,
    he met a serious 19-year-old woman named Anabella. Anabella came from a wealthy
    family. She was passionate about mathematics. Lord Byron gave Anabella the nickname,
    “Princess of Parallelograms.”


    Lord Byron and Anabella were married in January of 1815. Nearly a year later,
    they had a daughter—Augusta Ada Byron. When Ada was five weeks old, she and her
    mother moved in with her mother’s family.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_22_0.png)


    | 1837 | 1843 | 1852 | 1946 | 2009 |

    | --- | --- | --- | --- | --- |

    | The first mechanical, general purpose computer is proposed by Charles Babbage.
    | Ada publishes a translation with her own notes on the analytical engine. Her
    published work includes the first computer program. | Ada Lovelace passes away.
    | The ENIAC becomes the first electronic computer. | The first Ada Lovelace Day
    is held to celebrate women in STEM throughout the world. |'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Lord Byron passed away soon after this. His servant later said that Lord Byron''s
    last words were about his daughter.


    Ada''s mother believed strongly in education for females, and hired tutors to
    teach her daughter math and science. She didn''t want her daughter to follow in
    Lord Byron''s footsteps and become a poet!


    Ada had a lonely childhood. She was kept company only by servants, tutors, and
    a cat named Puff. She was often sick and spent most of her time indoors, reading
    and studying.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_23_0.png)


    Ada didn''t really mind being alone. She discovered that she could be creative
    with math and science.


    > Ada! sole daughter of my house and heart? When last I saw thy young blue eyes,
    they smiled, And then we parted,—not as now we part, But with a hope.


    Lord Byron, about his daughter


    At age 12, she decided she wanted to fly. So, she designed a flying machine. Her
    machine was shaped like a horse with a steam engine inside to power it. The flying
    machine came with a pair of mechanical wings based upon those of birds.


    # Gutsy Girls Go for Science: Programmers'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'When Ada was 13, she caught the measles and spent three years sick in bed!
    Her mother encouraged Ada to spend even more time working on her studies, including
    chemistry.


    When Ada got better, she was a little bit rebellious toward her mother. She wanted
    to learn more than just math and science.


    # # THE WORLD’S FIRST FEMALE MATHEMATICIAN


    The first known female mathematician and scientist was Hypatia (c. 370-415). She
    was born in Alexandria, a great city in Egypt. Her father, Theon, was a mathematician
    at Alexandria’s university. He taught his daughter everything he knew and they
    often worked together. When Hypatia became an adult, she also taught at the university.
    She was the only woman known to do so. Hypatia was accomplished at mathematics,
    astronomy, and philosophy. She was also an inventor and either invented an early
    astrolabe or improved upon it, researchers are not sure.


    During Hypatia’s time, some people believed that mathematics and witchcraft were
    the same thing, and dangerous. One day, when Hypatia was leaving the university,
    she was killed by a mob that felt angry and scared enough to attack a woman who
    dared to study and learn.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_24_0.png)'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'As she grew older and met more people and learned more about the world, Ada
    noticed a relationship between music and math.


    Ada also saw poetry in math and science. She called herself an analyst and metaphysphysian
    who studied poetical science. She was fascinated by how the brain creates thoughts.


    # Ada at 17


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_25_0.png)


    > Ada was interested in machines, in particular the Jacquard loom. This weaving
    machine used punch cards to weave designs in cloth, a detail she wouldn''t forget
    when designing a system of her own.'
  merge: -1
  img_proc: true
