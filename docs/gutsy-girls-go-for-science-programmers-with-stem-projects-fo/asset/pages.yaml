- pgno: 56
  md: 'Based on the headlines, you might never know that six women were part of the
    success of ENIAC. But if you look at the pictures, you''ll see them working on
    ENIAC in the background. Who were these unnamed women? What were they doing?


    Jean lived in a rural area where most people didn''t have much money. But the
    Jennings family knew what was important—education. Jean''s father taught in a
    one-room schoolhouse.

    Jean''s mother tutored students in algebra and geometry.


    All the Jennings children went to college. Jean went to Northwest Missouri State
    Teachers College in Mayville. Tuition was $76 a year. She thought she might like
    to be a journalist, but didn''t care for her adviser, so she switched to math.


    # As Kids


    Jean Jennings was born on a Missouri farm outside of Alanthus Grove, population
    104. She was the sixth of seven children! She grew up doing lots of farm chores.


