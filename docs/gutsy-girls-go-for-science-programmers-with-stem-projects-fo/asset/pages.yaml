- pgno: 42
  md: '# GIRLS ONLY!


    Vassar began in 1861 as a college for women. Back then, most colleges and universities
    didn''t allow women to attend, so sometimes, people began new schools for girls.
    Vassar had the reputation for being very challenging. Women could take classes
    in art history, geology, astronomy, music, mathematics, and chemistry. It was
    known as a school that offered experiential learning. In 1869, the famous astronomer
    Maria Mitchell took her students out of the state to observe an eclipse of the
    sun! Vassar allowed boys to enroll in 1969. What do you think might have changed
    when men began to attend?


