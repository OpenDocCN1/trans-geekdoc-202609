  md: '# Juvenile Nonfiction • Biography

    Ages: 8-11 • Guided Reading Level: R


    # DO YOU KNOW HOW TO MAKE COMPUTERS UNDERSTAND

    WHAT PEOPLE WANT? PROGRAMMING!


    In Gutsy Girls Go for Science: Programmers, readers ages 8 to 11 meet five female
    programmers who made revolutionary discoveries and inventions that changed the
    way people used technology. Ada Lovelace, Grace Hopper, the ENIAC women, Dorothy
    Vaughan, and Margaret Hamilton broke through barriers of gender and race to succeed
    in a field they loved.


    Try these hands-on STEM projects!


    +   * Program with Scratch

    * Write a program in HTML

    * Build an app


    Programmers is part of a set of four Gutsy Girls Go for Science books that explore
    career connections for young scientists. Check out the other titles in this series!


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_119_0.png)


    > PRAISE FOR TECHNOLOGY: COOL WOMEN WHO

    CODE FROM THE GIRLS IN SCIENCE SERIES


    > "The inspirational stories of these successful women in STEM are the perfect
    introduction to the careers and contributions in technology for young readers
    . . . This is a much needed book for our time for young readers to be inspired
    by strong females in the world of STEM


    > —Science Books & Films


