- pgno: 104
  md: '# TECHNOLOCHICAS


    Latinas are a very underrepresented group in computer science and programming
    in the United States. In 2016, only 2 percent of Latinas worked in the computing
    field. Developed by the National Center for Women & Information Technology (NCWIT),
    TECHNOLOGY raises awareness about technology careers for Latina girls and their
    families. An important part of the program is introducing Latinas currently working
    in computer technology or studying computer science in school. This revolving
    group of computer science mentors tells them their stories in person and online.
    You can learn from them at this website.


    TECHNOLOCHICAS


    Margaret believes that software engineering helps people be more creative and
    better problem-solvers. It also taught her the importance of learning from mistakes
    and turning them into positive results.


    On November 22, 2016, President Barack Obama awarded Margaret Hamilton the Presidential
    Medal of Freedom for her programming contributions to Apollo 11. The Presidential
    Medal of Freedom is the highest award a civilian can receive.'
