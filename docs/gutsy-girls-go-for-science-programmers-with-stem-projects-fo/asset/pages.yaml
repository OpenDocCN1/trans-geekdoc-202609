- pgno: 74
  md: '# As a Kid


    Dorothy Johnson was born on September 20, 1910, in Kansas City, Missouri, and
    when she was seven, her family moved to Morgantown, West Virginia.


    School was easy for Dorothy. She graduated from high school by age 15 and went
    straight to college. She attended Wilber University in Ohio, the first American
    college to be owned and operated by African Americans.


    By the time Dorothy turned 20 years old, she had two degrees—one in mathematics
    and the other in French.


    # SEPARATE BUT... EQUAL?


    In 1896, the U.S. Supreme Court ruled that it was legal to have separate but equal
    schools for different races. However, people knew the segregated schools weren''t
    equal. They weren''t well funded as schools for white people. In 1954, segregation
    was outlawed in schools. It would take another 15 to 20 years for all schools
    finally to be integrated.


    +   - 1964 The Civil Rights Act is passed, making discrimination based on race
    illegal.


    +   - 1971 Dorothy retires from NASA.


    +   - 1983 Guion "Guy" Bluford is the first African astronaut to fly in space.


    +   - 1992 Dr. Mae Jemison becomes the first African American female in space.


    +   - 2008 Dorothy passes away on November 10.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# New Jobs


    After college, Dorothy worked as a high school math teacher for African American
    students. She married Howard Vaughan in 1932. They had six children. Called Dot
    by her friends, she stayed busy as a mother, homemaker, and math teacher until
    1943.


    That was when Dorothy saw an advertisement for African American mathematicians.
    World War II had started and mathematicians were needed. President Franklin D.
    Roosevelt signed an order that prohibited discrimination in the defense industry.
    Dorothy filled out an application in the spring of 1943.


    > Use Google''s Made with Code to create a message for equality.

    And then, see what girls are doing with code at Google''s Made with Code.


    Connect . . . . . . . . . . . . . . . . . . . . . . . . . .


    Made with Code Equality


    Made with Code mentors


    # Gutsy Girls Go for Science: Programmers'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'While she was waiting, the school summer break started. Dorothy didn''t earn
    enough from teaching to take the summer off. She began working at Camp Pickett''s
    laundry boiler plant, washing soldiers'' laundry. It would get so hot and humid
    in the plant that going outside into the 100-degree heat of central Virginia was
    an improvement.


    Months later, Dorothy had started back to school when she received her letter
    from NACA. They wanted to hire her as a human computer. She quit her teaching
    job. She couldn''t turn down a job offer for more than double the money she had
    been earning!


    This job would let her save money for her children''s education.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_76_0.png)'
  merge: -1
  img_proc: true
- pgno: 77
  md: '> Possessed of an inner confidence that attributed no shortcoming to her race
    or to her gender, Dorothy welcomed the chance to prove herself in an academic
    arena.


    -Margot Lee Shetterly, in her book, Hidden Figures


    Dorothy was among the first group of African American scientists and mathematicians
    hired by NACA. She thought her new job as a mathematician at the Langley Memorial
    Aeronautical Laboratory was temporary. Mostly likely, she would return to being
    a high school math teacher when the war ended.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_77_0.png)'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Langley was more than 100 miles from where she lived. Since the job was temporary,
    she saw no reason to move the family. For $5 a week, she got a room closer to
    work and two meals a day. When she could, she visited her family or brought her
    children to stay with her for a few days. When Dorothy was still working at Langley
    a year later, she moved her family to join her.


    While the law said that African Americans would be hired, there was nothing said
    about working conditions. Dorothy was assigned to West Area Computing—only African
    American women worked on that unit. The East Area Computers were made up of white
    women only.


    The West Area Computers had separate work and dining areas and separate bathrooms.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_78_0.png)


    > NASA was an early employer of female African American computer programmers,
    including Melba Roy Moulton.


    credit: NASA'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Dorothy worked with other African American women doing calculations for the
    engineers'' experiments. The teams of engineers worked with models of aircraft
    flown in gigantic wind tunnels tested their durability.


    In 1949, Dorothy became NASA''s first African American supervisor to the West
    Area Computer group. The two previous supervisors had been white women. Her role
    meant she assigned the women to different projects. She also continued working
    on special projects. With other computer supervisors, she developed a handbook
    for calculating machines.


    Dorothy did more than calculating and supervising. She also advocatedated for
    the female computers, no matter what their race. If someone deserved a promotion
    or a pay raise, she spoke up.


    # Change is Coming


    In 1947, NACA bought an electronic calculator from Bell Telephone Laboratories.
    The electronic calculator used paper-punched tape as inputs. It generated answers
    16 times faster than humans. It also shook the entire building when it was operating!


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_79_0.png)'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'Although most calculations were still done by hand, Dorothy realized that her
    electronic co-worker could someday take her job. She also knew that integration
    was right around the corner—African Americans and white people were going to be
    working together and competing for the same jobs. The people with the best skills
    would win.


    Hidden Figures Margot Lee Shelterly writes that “being on the leading edge of
    integration was not for the faint of heart.” How did Dorothy Vaughan demonstrate
    this?


    # Why?


    Dorothy began taking computer classes after work and on weekends. She encouraged
    other West Area Computers to do the same.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_80_0.png)


    > Dorothy Vaughan is on the far left of this gathering of human computers.


    Whenever she had an opportunity, Dorothy visited the IBM 704 in the chilly room
    in the basement. The temperature was set low to keep the vacuum tubes from overheating.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# NACA to NASA


    Congress passed the Space Act of 1958, leading the way for NACA to become NASA.
    A memo was sent out on May 5, 1958. The West Area Computing unit was no more.
    Segregated facilities were to be a thing of the past.


    Dorothy joined the new Analysis and Computation Division (ACD). This group was
    made up of men and women of various races who all worked on computers. Not only
    could the computers do calculations, they also did simulations.


    Dorothy learned a new programming language, Formula Translator, better known as
    FORTRAN.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_81_0.png)'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'FORTRAN was the first programming language to open up programming to people
    other than mathematicians. The 10-person team at IBM that developed FORTRAN included
    one woman, Lois Haibt (1934-).


    Dorothy reinvented her career and became an expert FORTRAN programmer. Because
    of her programming skills, she worked on important projects, such as a program
    that developed reliable launch rockets that made it possible to launch satellites
    and manned space flights.


    NASA still uses a version of FORTRAN. And people still use the older versions
    of FORTRAN for older projects such as Voyager 1 and 2. Two Voyager spacecraft
    launched in 1977 are still sending us data about the solar system and beyond.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_82_0.png)'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Dorothy Vaughan''s Impact


    Dorothy retired from NASA in 1971. Her contributions to computer programming and
    NASA remained a little-known fact until Margot Lee Shellyter published Hidden
    Figures in 2017. Hidden Figures is the story about African American women in the
    early days of NACA and NASA. The book was also made into a movie.


    Dorothy spent her retirement years being active in her church and music programs
    and volunteering. She passed away on November 10, 2008, at 98 years old. She didn''t
    live to see the recognition for her role in computer programming and integrating
    the space industry.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_83_0.png)


    NASA''s Voyager 2 Testing

    credit: NASA/JPL'
  merge: -1
  img_proc: true
