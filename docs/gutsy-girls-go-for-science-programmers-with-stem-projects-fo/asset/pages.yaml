  md: 'Once the astronauts were in space, there could be no mistakes. Margaret had
    to think of everything that could possibly go wrong—such as human error, loss
    of power, and going off course—and then have a fix ready. In fact, her daughter
    helped with this. When playing astronaut, her daughter selected the pre-launch
