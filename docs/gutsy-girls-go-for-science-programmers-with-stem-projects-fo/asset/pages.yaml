- pgno: 91
  md: 'Just minutes before the lunar module Eagle was set to land on the moon’s surface,
    an alarm went off. At such a critical point, mission control might have stopped
    the mission. However, thanks to computer programming done by computer scientist
    Margaret Hamilton, Neil Armstrong was still able to take those historic steps.


    > With help from Margaret Hamilton, the Eagle landed on the moon.

    credit: NASA


