- pgno: 18
  md: 'To see what the code for the web page looks like, follow the directions below
    for the browser you''re using.


    +   - CHROME: Right click with your mouse over a fixed headline. Left click on
    "Inspect Element" to see the code.


    +   - SAFARI: Enable the Developer menu. Go to Preferences > Advanced in the Safari
    menu. Click "Show Developer menu in menu bar." Close the Preferences window and
    go to the Develop menu, where you will click on "Show Page Source."


    +   - INTERNET EXPLORER: Press the Alt key for the browser''s menu bar. Select
    "View," and "Source" from the drop-down menu that appears.


    +   - EDGE: Click on the More icon on the upper-right corner of your screen. Select
    "Developer Tools" from the drop-down menu that appears. You can also reach it
    with one of two shortcuts: pressing Ctrl+U or F12 on your keyboard.


    > See how the web page looks different with different browsers and on different
    digital devices. You''ll see similarities, but also differences, too! Programmers
    often have to see how their code looks different with browsers and devices.'
  merge: -1
  img_proc: true
