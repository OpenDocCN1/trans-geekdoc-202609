    many people walk around with a very small computer in their pockets—a smartphone!


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_14_0.png)


    All of these computers and computer programs need programmers.mers give computers
    specific instructions on what to do.


    > As calculators became more advanced, they became smaller. We''ve seen the same
