- pgno: 93
  md: '# As a Kid


    Margaret Heaf was born on August 17, 1936, in Paoli, Indiana. She describes her
    father as a philosopher and a poet who talked to her a lot about the universe.
    Margaret realized that math was useful when thinking about the universe. She enjoyed
    poetry and philosophy, but when it came to solving problems, she looked to math,
    including algebra, geometry, and calculus.


    And Margaret liked solving problems. She wondered about many things, such as why
    boys and girls weren''t treated the same. And why weren''t there more female baseball
    players and scientists? She did her part by playing baseball while growing up.
    And she continued studying math.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_93_0.png)'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# MARGARET HAMILTON


    > How important is diversity in school and in the workplace? Why?


    It seemed only natural that she would study math in college. She was often the
    only girl in her math and physics classes. Her goal was to become a math professor.


    A female math professor at Earlham, Florence Long, was a role model to Margaret.


