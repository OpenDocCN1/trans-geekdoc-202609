  img_proc: true
- pgno: 44
  md: '![](img/66d6fea998f37bc7b306d3d7f72bd61a_44_0.png)


    # HEDY LAMARR

    (1914–2000)


    Grace Hopper isn''t the only woman to revolutionize technology for the Navy. If
    you''re a fan of old movies, the name Hedy Lamarr might be familiar. She was a
    famous movie actress in the 1940s and 1950s. She also developed technology that
    makes today''s wireless technology possible. Torpedoes in wartime were successful
    only 40 percent of the time because the radio signals jammed up. Single-frequency
    settings also left ships vulnerable to attack. Hedy worked with a composer friend
    on a way for a sender and receiver to hop frequencies in a pattern. She patented
    the invention, and then gave it to the Navy. The Navy didn''t use Hedy''s invention
    during World War II, but they did use the technology in the late 1950s. In 1990,
    Hedy''s invention became public and was used for all kinds of things we have today,
    including satellite technology.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Grace Meets Mark I


    In 1944, Grace was sent to work at the top-secret Harvard Computational Lab. She
    was not entirely sure what to expect. An armed guard escorted her to the basement.


    > If Wright is flight, and Edison is light, then Hopper is code. —President Obama,


    The first thing she probably noticed when she walked into the room was the enormous
    computer. It was 8 feet high and 3 feet long, it weighed about 5 tons. Grace immediately
    wanted to take it apart and figure out how it worked, just the way she did with
    those clocks when she was a kid!


    awarding the Presidential Medal of Freedom to Grace


    “Where have you been?” someone asked as she stared at the computer. That was Howard
    Aiken (1900–1973). He had expected Grace months earlier, and he hadn''t been happy
    to be assigned a female assistant in the first place. That would soon change.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_45_0.png)


    37 Gutsy Girls Go for Science: Programmers'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Howard had built that giant computer, called the Automatic Sequence Controlled
    Calculator. Better known as the Mark I, it was the first in a series of early
    computers for the military. The Navy would use it to program rocket trajectories
    and solve engineering problems.


    Grace got to work immediately. She was given a notebook of instructional codes
    for the Mark I. She studied blueprints at night. She learned how to communicate
    with the machine to get it to do what she wanted.


    Grace was the third person to program the Mark I and soon became chief programmer.
    She also worked on later versions of the computer, the Mark II and Mark III. She
    wrote the first programming manual—500 pages on the history of the Mark I and
    how to program it.


    When the war ended in 1945, Grace had caught her own computer bug! She decided
    to stay at Harvard''s Computational Laboratory.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_46_0.png)'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Programming Leader


    After a few years, it became clear to Grace that Harvard wasn''t going to give
    her tenure and the Navy wasn''t going to give her a regular commission. This meant
    she couldn''t count on always having a job. So, she left Harvard in 1949 to go
    to work for a private company.


    When Grace developed the first computer language compiler, she sent it to other
    programmers for their input.


    Another compiler worked on led to the development of a programming language still
    in use today. Called COBOL, it was the first widely used computer program containing
    words. It became one of the most frequently used programming languages in the
    world.


    Grace was involved in developing early programming languages. She knew that programming
    was key to making computers more user-friendly to non-mathematicians. If computers
    were easier to use, more people would use them. She shared code and programming
    information with other programmers.


    > Grace Hopper believe collaboration would make programming better, she regularly
    shared her work with others. Do you agree with this approach? What place does
    competition have in the business of developing computers? Wonder why?


    Grace realized that computers needed a translator to take human commands and turn
    them into computer language. This is now called a compiler.


    # Gutsy Girls Go for Science: Programmers'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# # A Short Retirement


    In the 1960s, Grace retired from the Naval Reserve. It would be a very short retirement.
    In 1967, the Navy asked her back to lead a project that would standardize programming
    languages so everyone could use them.


    Grace had a clock in her office that ran counterclockwise instead of clockwise.
    It reminded her not to do things only because that was the way they had always
    been done.


    > Grace being promoted to the rank of commodore at a White House ceremony, 1983


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_48_0.png)'
