    PROGRAMS: HTML, JAVASCRIPT, AND CSS. BOTH JAVASCRIPT AND CSS OPERATE WITHIN HTML.


    HTML stands for HyperText Markup Language. This programming language uses ordinary
    text to describe a page. It''s fairly simple to use. HTML uses hidden keywords
    called tags. These keywords are between <>, Tags have an opening <> and an ending
    </ >. In between the tags are content. You might also add values and attributes.


    !DOCTYPE tells a browser you''re using the HTML5 version.

    At its most basic, a web page has the following tags.


    ```

    <!DOCTYPE html>

    <head>

    <title>Page Title</title>

    </head>

    <body>page content goes here</body>

    </html>

    ```


