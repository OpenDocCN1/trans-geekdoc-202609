- pgno: 95
  md: '# The First Software Engineer


    While at college, Margaret met and married her husband and became Margaret Hamilton.
    After school, she became a high school math teacher. She and her husband decided
    to take turns working and going to school for advanced degrees. While her husband
    went to school, Margaret began working at MIT''s new Lincoln Laboratory in 1959.


    Margaret quickly realized that computers could help with answers to questions
    about the universe. She began writing code, the instructions for computers. At
    first, these programs were for predicting weather.


    Margaret moved to another MIT lab, the Instrumentation Laboratory. This lab provided
    aeronautical technology to NASA. The code for the projects she worked on grew
    more complicated! Margaret wrote the software for the program that identified
    enemy aircraft.


    > Listen to President John F. Kennedy state his hope for the future of space exploration
    in his famous speech. Can you think of recent speeches that have sparked the same
    kind of inspiration and hard work?


    > Margaret was often the only woman in the computer lab, but she was so involved
    with her work that she rarely noticed.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_95_0.png)'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'She became an expert in systems programming. There was no job title to accurately
    describe what she was doing, so she invented one—software engineer.


    # # To the Moon


    During the 1950s, the United States and the Soviet Union were in a race. It was
    a space race, and the Soviet Union was winning.


    President John F. Kennedy gave a speech to Congress on May 25, 1961. He said it
    was time to land a man on the moon, and that the United States would do that by
    the end of the decade.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_96_0.png)


    > We choose to go to the moon . . . and do the other things, not because they
    are easy, but because they are hard; because that goal will serve to organize
    and measure the best of our energies and skills, because that challenge is one
    that we are willing to accept, one we are unwilling to postpone, and one we intend
    to win, and the others, too.


    —President John F. Kennedy, 1961'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'This announcement was in Margaret''s mind as she considered going back to school.
    She was set to attend nearby Brandeis University for advanced math degrees, but
    then she heard that MIT was going to work with NASA to develop software to send
    humans to the moon. That was a project she had to be a part of!


    Two portable computers had to be invented for the spacecraft. One for the command
    module, and another for the lunar module, named the Eagle. And Margaret was responsible
    for the onboard flight software.


    In addition to her challenging work, Margaret was now a mother. There were many
    evenings and weekends when her young daughter came to work with her. The work
    was very consuming! One night, Margaret left a party and hurried back to the lab
    when she realized a piece of code needed fixing.


    Margaret was interviewed and hired on the same day. Work started in 1963.


    > Hear Margaret talk about how she ended up as the first programmer on the Apollo
    project.


    By 1968, there were approximately 400 people working on the Apollo software. Everything
    they did underwent lots of testing. Programmed punch cards would be processed
    overnight on a giant mainframe computer that simulated the Apollo landing. Margaret''s
    team analyzed and fixed any mistakes that came up.


