  - '[PAGE 112]


    SCHOLAR: a person who is highly educated in a subject.


    SCRIPT: in computer programming, a script is a program or sequence of instructions
    that is interpreted or carried out by another program.


    SECURITY CLEARANCE: special permission given only to people who are approved to
    know see secrets.


    SEGREGATION: the practice of keeping people of different races, genders, or religions
    separate from each other.


    SHORT CIRCUIT: a situation in which a current takes the path of least resistance.
    It may result in an electric shock.


    SIMULATION: a copy or imitation of something before the real act.


    SOFTWARE ENGINEER: a person who develops software in a systematic method.


    SOURCE CODE: a text listing of commands to be compiled or assembled into an executable
    computer program.


    SPACE RACE: the competition between the United States and the Soviet Union to
    achieve the greatest accomplishments in space exploration.


    STANDARDIZE: to make everything the same.


    STORYBOARD: a visual representation of a story that can include drawings, directions,
    and dialogue.


    SWITCH: in computers, a device that turns on or interrupts the flow of electricity
    in a circuit.


    TECHNOLOGY: the tools, methods, and systems used to solve a problem or do work.


    TENURE: guaranteed permanent employment, usually for college-level professors.


    TRAJECTORY: the path of an object moving under a force.


    TRIGONOMETRY: a branch of mathematics that studies the properties of triangles
    and their functions.


    TUTOR: a person who gives private lessons to a student.


    TUTORIAL: a routine that allows a person to instruct oneself using software.


    UNIVAC: Universal Automatic Computer; the first commercial computer produced in
    the United States.


    VACUUM TUBE: an electronic component that looks like a lightbulb. It was used
    as an on/off switch in early computers and other appliances.


    VALET: a personal attendant who looks after a man''s clothes; can also be an employee
    in high-end hotels.


    VIRTUAL REALITY: an interactive environment that looks three-dimensional through
    a computerized device.


    WAVES: Women Accepted for Volunteer Emergency Service, the American female volunteers
    with the U.S. Navy.


    WIND TUNNEL: a tunnel built so airplanes can be safely tested in winds.'
