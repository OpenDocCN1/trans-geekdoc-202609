    ALGORITHMS.


    An algorithm is a set of steps to follow in order to accomplish a task. It has
    a beginning and an end. Algorithms can be followed by humans or machines.


    Programmers break complicated tasks into smaller, step-by-step tasks called algorithms.
    Each piece of code directs the computer to perform one step or instruction. Algorithms
    transform information and automate tasks. They make code more efficient.


    When you do a division problem in math class, you solve the problem with an algorithm.
    Here''s an example.


    A simple question such as 84 divided by 6 might have the following algorithm.


    - How many times does 6 go into 8? (The answer is 1)

    - How many is left over? (2)

    - Bring the numbers at the top, down (In this example, drop the 4 next to the
    2)

    - How many times does 6 go into 24? (The answer is 4)


    84 divided by 6 is 14. The answer is reached by following an algorithm.


