    # As a Kid


    A man named Lord Byron was a famous poet in the early 1800s. At a party one day,
    he met a serious 19-year-old woman named Anabella. Anabella came from a wealthy
    family. She was passionate about mathematics. Lord Byron gave Anabella the nickname,
    “Princess of Parallelograms.”


    Lord Byron and Anabella were married in January of 1815. Nearly a year later,
    they had a daughter—Augusta Ada Byron. When Ada was five weeks old, she and her
    mother moved in with her mother’s family.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_22_0.png)


