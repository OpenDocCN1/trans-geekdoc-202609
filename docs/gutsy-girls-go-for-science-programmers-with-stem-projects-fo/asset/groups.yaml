    Dorothy Vaughan could see it coming. The National Advisory Committee for Aeronautics
    (NACA), where she had worked for 15 years, was becoming the National Aeronautics
    and Space Administration (NASA). Rumors were that segregation might end as well,
    and white and black people would be allowed to work together.


