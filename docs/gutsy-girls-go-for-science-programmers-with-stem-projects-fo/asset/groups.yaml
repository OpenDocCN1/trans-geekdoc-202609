    ## 征招女性数学家


    在这一时期，许多上大学的女性主修数学。大多数人成为了老师。这可能也是珍（Jean）原本的道路，除非她的微积分老师给她看了一张传单。


    招聘：拥有数学学位的女性


    宾夕法尼亚大学正在寻找女性数学家。这些女性将担任“计算员”，负责该部门所需的大量数学计算。


    珍申请了并被录用了。她乘坐一列午夜火车出发，40小时后到达宾夕法尼亚州。当时她只有20岁。这是她第一次离开密苏里州！


    在工作时，珍坐在一个有近100名其他女性的大房间里。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_57_0.png)


    ## 勇敢女孩投身科学：程序员


    桌子上散落着纸张和带有手摇的桌面加法机。她们的工作是什么？为军队计算弹道表。


    在当时，导弹的精度很差它取决于许多因素，包括湿度、地球曲率和地理条件。所有这些因素都可以通过数学计算出来，但方程非常复杂。一个人完成一个方程可能需要12小时！尽管女性们工作得尽力高效，但完成一张弹道表仍需要一个月的时间。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_58_0.png)


    # ENIAC 女性们

    无名英雄


    50


    ## 战时编程：乔恩·克拉克


    乔恩·克拉克（Joan Clarke, 1917-1996）是一位破译员，在破解纳粹德国的代码方面发挥了关键作用。这在第二次世界大战期间拯救了英国无数人的生命。1939年，英国政府因她在剑桥大学的数学工作而招募了她。她和其他人在布莱切利园公园的Colossus机（Colossus）上工作，那里现在是一座博物馆。去看看吧！


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_59_0.png)


    使用Colossus 的女性们


    ## 连接 ............................ 布莱切利园公园


    在珍开始工作几个月后，一份备忘录发布了，说明宾夕法尼亚大学工程工程学院有六个名额用于研发一台新机器。


    珍对自己的工作感到有点无聊，于是她申请了职位。在面试期间，她被问及对电的了解程度。他们真正想知道的是她是否害怕电。她说不害怕，并被录用了。


    勇敢女孩投身科学：程序员


    还有五位女性也是如此：玛丽莲·韦斯考夫（Marilyn Wescoff）、露丝·利希特曼（Ruth Lichterman）、贝蒂·斯奈德（Betty Snyder）、弗朗西斯·比拉斯（Frances
    Bilas）和凯·麦克尔蒂（Kay McNulty）。她们来自不同的背景和文化。她们的共同点是什么？数学。


    ## 介绍 ENIAC


    物理学家约翰·莫奇利（John Mauchly, 1907–1980）在1942年构思了一台全电子计算机器。他正确地认为，如果没有机械部件，它的运行速度会更快。在战争期间，速度是关重要的。ENIAC就是这一产物，于1943年至1945年间建成。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_60_0.png)


    机器建成后，需要对其编程。建造机器的男人们认为编程并不重要。被录用的这六位女性被称为“ENIAC女孩们”。她们的年薪2000美元，外加周六加班的400美元奖金。


    这些女性被送到一处陆军设施，学习如何使用IBM打孔卡和连接控制面板。六周后，她们回到了宾夕法尼亚大学。


    > ENIAC程序员们通常以团队形式工作。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_61_0.png)


    ## 勇敢女孩投身科学：程序员


    ### ENIAC程序员项目


    律师凯西·克莱曼（Kathy Kleiman）在哈佛大学求读期间，第一次了解到ENIAC程序员。她写过关于20世纪中期女性“计算员”的论文。当ENIAC50周年纪念公布时，凯西得知最初的ENIAC程序员没有被邀请参加庆祝。她创建了“ENIAC程序员项目”来讲述她们的故事。凯西记录了口述历史，并推动对她们成就的认可。她继续就计算机编程中的多样性。在她的TEDx演讲中听听Kathy
    Kleiman讲述计算机编程史上的女性。


    Kathy Kleiman TED


    起初，这些女性甚至不允许看到ENIAC。她们没有安全许可。相反，她们得到的是接线图、蓝图和图表！她们必须以此找出如何为ENIAC编程。


    最后，她们被允许在ENIAC所在的1500平方英尺房间里操作机器。这台重30吨的怪物高9英尺，覆盖了房间的三面。它包含了6000个开关、1500个继电器和18000个真空管。它可以计算……


    ## 为ENIAC编程


    很快，这些女性对机器的了解比工程师还要深。为ENIAC编程意味着将大问题分解为小步骤。


    女性们大部分晚上都在工作以保持ENIAC运行。珍、贝蒂和凯继续与建造ENIAC的男人们一起工作，将转向一台名为二进制自动计算机（BINAC）的新计算机。后来，格蕾丝·霍珀（Grace
    Hopper）在制造BINAC的同一公司工作。


    她们的下一个项目是通用自动计算机（UNIVAC）——第一台商业计算机。美国人口普查局成为使用它的第一个客户，但当UNIVAC准确预测1952年美国总统大选中艾德华·D·艾森豪将击败阿德莱·斯蒂文森时，它闻名全球。


    56


