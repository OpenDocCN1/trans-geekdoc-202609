    3 想想什么会让你的生活变得更简单或更愉快。也许有相应的App呢？


    4 访问 https://hourofcode.com/codehsjsapp。观看视频获取介绍。


    从应用商店、教程中的二维码或代码小时网站下载Expo应用。Expo应用提供了使用JavaScript和React Native进行创建的开发者工具。Expo的一个主要优点是它能同时兼容安卓和iOS设备。


