    # GLOSSARY


    MACHINE CODE: programming language consisting of binary instructions that a computer
    can respond to directly.


    PRIORITY: something that is more important than other things.


    MAINFRAME: a large and powerful computer.


    PROGRAMMER: a person who writes computer programs. Also called coder.


    MANUAL: a book of instructions.


    PROGRAMMING LANGUAGE: a language invented to communicate instructions to a computer.


    MANUALLY: by hand.


    PROMOTE: to raise someone to a higher position or rank.


    MATHEMATICS: the study of ideas related to numbers. Mathematicians study mathematics.


    PROSPEROUS: financially successful, wealthy.


    MEASLES: an infectious disease that results in a fever and a rash.


    PROTOTYPE: a working model or mock-up that engineers use to test their solution.


    METAPHYSICIAN: an expert in the branch of philosophy that deals with the fundamental
    nature of reality.


    PUNCH CARD: a card with holes punched in it that gives directions to a machine
    or computer.


    MISSION CONTROL: a command center on Earth that helps astronauts on their mission.


    RACE: a group of people that share distinct physical qualities, such as skin color.


    NASA: National Aeronautics and Space Administration, the U.S. organization in
    charge of space exploration.


    REBELLIOUS: fighting against authority or those in charge.


    PARALLELOGRAM: a four-sided shape with opposite parallel sides.


    RECRUIT: to get a person to join; someone who recently joined the armed forces
    or another group.


    PATENT: a government license that gives an inventor or creator sole right to make
    and sell a product or invention.


    RELAY: a device that makes changes in an electrical circuit in response to other
    changes.


    PHILOSOPHER: a person who studies truth, wisdom, knowledge, and the nature of
    reality.


    RESOURCES: something you can go for help or support; can also be something useful
    or valuable to a place or person.


    PHYSICS: the science of how matter and energy work together. A physicist studies
    physics.


    SATELLITE: a spacecraft sent into orbit; can also be a moon that travels in an
    orbit around a larger heavenly body.


