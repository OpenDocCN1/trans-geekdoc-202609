    ## 黑女孩代码 (BLACK GIRLS CODE)


    电气工程师金伯莉·布莱特（Kimberly Bryant）于2011年发起了 BlackGirlsCode组织。创立 BlackGirlsCode 的目的是向世界展示非裔美国女孩可以编程——而且能做得更多。工作坊、课后计划和训练营为生活缺乏计算机科学课程社区的女孩们介绍了编程。该组织致力于弥合“数字鸿沟”。在两年内，BlackGirlsCode
    的业务已扩展到美国七个州以及南非的约翰内斯堡。而且他们正在不断扩张。BlackGirlsCode 计划到 2040 年向 100 万女孩教授编程。


