  - '[PAGE 35]


    # Breaking It Down


    ABOUT 1,200 YEARS AGO, A MATHEMATIAN NAMED MUHAMMAD IBN MUSA AL-KHAWARIZMI (780–850)
    DEVELOPED A STEP-BY-STEP APPROACH TO SOLVING MATH PROBLEMS. HE WASN’T THE ONLY
    MATHEMATIAN DOING THIS, BUT THIS PERSIAN SCHOLAR IS CREDITED WITH THE IDEA OF
    ALGORITHMS.


    An algorithm is a set of steps to follow in order to accomplish a task. It has
    a beginning and an end. Algorithms can be followed by humans or machines.


    Programmers break complicated tasks into smaller, step-by-step tasks called algorithms.
    Each piece of code directs the computer to perform one step or instruction. Algorithms
    transform information and automate tasks. They make code more efficient.'
  - '[PAGE 36]


    When you do a division problem in math class, you solve the problem with an algorithm.
    Here''s an example.


    A simple question such as 84 divided by 6 might have the following algorithm.


    +   - How many times does 6 go into 8? (The answer is 1)

    - How many is left over? (2)

    - Bring the numbers at the top, down (In this example, drop the 4 next to the
    2)

    - How many times does 6 go into 24? (The answer is 4)


    84 divided by 6 is 14. The answer is reached by following an algorithm.


    It''s your turn to write an algorithm.


    # Choose a task you do every day.


    Write down a step-by-step set of instructions that will be clear enough for someone
    to follow. Remember to consider different decisions someone has to make and how
    these decisions will affect the final outcome.


    Ask a friend or family member to follow your algorithm. Are they successful?


    > Try! Computer programmers spend many hours revising their codes to get them
    right. What do you need to change or add to your algorithm to make it easier to
    follow?'
  - '[PAGE 37]


    # GRACE MURRAY HOPPER


    > The only phrase I''ve ever disliked is, ''Why, we''ve always done it that way.''
    I always tell young people, go ahead and do it. You can always apologize later.


    Grace Hopper


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_37_0.png)'
  - '[PAGE 38]


