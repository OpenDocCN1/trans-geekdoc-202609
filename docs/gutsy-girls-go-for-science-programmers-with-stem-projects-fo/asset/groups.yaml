    # Programming Leader


    After a few years, it became clear to Grace that Harvard wasn''t going to give
    her tenure and the Navy wasn''t going to give her a regular commission. This meant
    she couldn''t count on always having a job. So, she left Harvard in 1949 to go
    to work for a private company.


    When Grace developed the first computer language compiler, she sent it to other
    programmers for their input.


    Another compiler worked on led to the development of a programming language still
    in use today. Called COBOL, it was the first widely used computer program containing
    words. It became one of the most frequently used programming languages in the
    world.


    Grace was involved in developing early programming languages. She knew that programming
    was key to making computers more user-friendly to non-mathematicians. If computers
    were easier to use, more people would use them. She shared code and programming
    information with other programmers.


    > Grace Hopper believe collaboration would make programming better, she regularly
    shared her work with others. Do you agree with this approach? What place does
    competition have in the business of developing computers? Wonder why?


    Grace realized that computers needed a translator to take human commands and turn
    them into computer language. This is now called a compiler.


