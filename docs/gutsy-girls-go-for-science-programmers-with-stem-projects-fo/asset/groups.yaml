    Ada''s translation included her own notes describing the machine and how it would
    work. A series of instructions, or algorithms, could be programmed into the machine
    with punch cards.


    > Ada explained that the Analytical Engine could weave patterns “just as the Jacquard
    loom weaves flowers and leaves."


    Her “Notes” section was more than twice as long as the original 8,000-word paper.
    Perhaps more importantly, she figured out an algorithm that the machine could
    use.


