    # 青少年非虚构类 ·传记

    年龄：8-11岁 • 引导阅读分：R


    # 你知道如何让计算机理解人类的需求吗？那就是编程！


    在《勇敢的女孩科学之旅：程序员》一书中，8 到 11 岁的读者将结识五位女性程序员，她们做出了具有革命性的发现和发明，改变了人们使用技术的方式。阿达·洛夫莱斯、格蕾丝·霍珀、ENIAC
    女子们、多萝西·沃恩和玛格丽特·汉密尔顿突破了性别和种族的障碍，在她们热爱的领域取得了成功。


    尝试这些动手实践的 STEM 项目吧！


    - 使用 Scratch 编程

    - 用 HTML 编写程序

    - 构建一个应用程序


    《程序员》是《勇敢的女孩科学之旅》系列四本书中的一本，旨在为年轻科学家探索职业联系。欢迎查看该系列中的其他书目！


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_119_0.png)


    > 《科学中的女孩》系列对《技术：编程的酷女孩们》的好评：


    > “这些 STEM 领域成功女性的励志故事，是年轻读者了解技术职业和贡献的完美介绍……对于我们时代，这本书非常这本书，能让年轻读者从 STEM 领域的优秀女性身上获得启发。”


    > ——《书籍与电影》(Science Books & Films)


