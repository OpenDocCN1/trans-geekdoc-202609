    # 为月球进程序


    1969年7月20日，全球6亿人聚集在电视机前，见证了一个历史性的时刻。


    他们见证了航天员尼尔·阿姆斯特朗成为第一个在月球上漫步的人类。


    很少有人知道，20世纪最伟大的成就之一几乎没有发生！


    就在“鹰号”登月舱准备降落在月球表面前几分钟，警报响了。在如此关键的时刻，任务控制中心可能会停止任务。然而，得亏计算机科学家玛格丽特·哈密尔顿（Margaret
    Hamilton）完成的计算机编程，尼尔·阿姆斯特朗仍然迈出了那历史的一步。


    > 在玛格丽特·哈密尔特的帮助下，“鹰号”降落在月球。

