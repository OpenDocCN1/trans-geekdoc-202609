    # # A Short Retirement


    In the 1960s, Grace retired from the Naval Reserve. It would be a very short retirement.
    In 1967, the Navy asked her back to lead a project that would standardize programming
    languages so everyone could use them.


    Grace had a clock in her office that ran counterclockwise instead of clockwise.
    It reminded her not to do things only because that was the way they had always
    been done.


