    # INTRODUCTION


    > Coders can be superheroes!


    Vanessa Hurst, programmer and co-founder of Girl Develop It!'
  - '[PAGE 10]


    # Computer Talk


    # A CAR STOPS AS A TRAFFIC LIGHT CHANGES TO RED.


    When the light turns green, it means the car can go. Red equals stop. Green equals
    go. It''s a simple set of instructions that the traffic light—and the traffic!—follows.


    This an example of code used in everyday life. Code is a way of transferring information
    between people and machines. A programmer used code to tell the traffic light
    what to do. It is the language of computerized devices. And it''s one of the most
    powerful types of communication today.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_10_0.png)'
  - '[PAGE 11]


    Do you have computers or laptops at your school? What about a smartphone? All
    of these devices that we use every day rely on programming to work.


    Without programs, computers wouldn''t know what to do. Programmers use a step-by-step
    approach to solve a problem. Every app a smartphone uses, every job a computer
    does, every turn a Mars rover makes, a programmer had to write a set of instructions
    to make it possible. Sound like a lot of work? It is.


    Digital devices can go places that people can''t go—inside hurricanes, to the
    ocean floor, and beyond the solar system. The programs that are part of these
    devices make all this possible.


    > NASA''s Curiosity Mars rover uses its programming to explore a planet where
    humans can''t yet survive for long periods of time.


    credit: NASA/JPL-Caltech/MSSS


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_11_0.png)


    # Gutsy Girls Go for Science: Programmers'
  - '[PAGE 12]


    # BC—Before Computers!


    It''s hard to imagine life without computers, but 100 years ago, that''s exactly
    what life was like—no computers.


    People did things manually, even when it took a long time. That includes doing
    long math problems (no calculators), waiting for film to be exposed in early cameras
    (no selfies), and using paper maps (no GPS).


    # COMPUTER CAREERS


    Who works with computers? About 62 percent of Americans use the internet in their
    jobs. About 4 million people work in the computer science and information industry.
    Programming and software engineering are some of the highest-demand careers today.
    More than half a million new computer and information jobs are expected to exist
    in the United States by 2026.


    Humans are always looking for new ways to do things faster and better. As time
    went on, people changed the way they made products. Companies opened factories,
    where many products could be produced at the same time. And machines helped with
    the job!


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_12_0.png)'
  - '[PAGE 13]


    Once engineers invented circuits, computers began to go digital. People learned
    to program those digital computers to do different things in different areas.
    The U.S. military was one of the first users of computers. These early computers,
    built in the 1940s, took up entire rooms! They took much more time to use than
    the computers we have today.


    # COMPUTER RICE


    Today, there is a computer the size of a grain of rice. The Michigan Micro Mote
    can take pictures, read data, and record information. Researchers are still experimenting,
    but they hope that the tiny computers could be injected into a human body to check
    temperature and identify possible health problems.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_13_0.png)


    > The ENIAC computer in 1946. That''s a big computer!'
  - '[PAGE 14]


    # INTRODUCTION


    As people worked on the design of computers and found ways to make them smaller
    and faster and cheaper, these machines began to appear more and more in businesses
    and homes. The 1980s saw personal computers, or PCs, become very popular. Today,
    many people walk around with a very small computer in their pockets—a smartphone!


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_14_0.png)


    All of these computers and computer programs need programmers.mers give computers
    specific instructions on what to do.


    > As calculators became more advanced, they became smaller. We''ve seen the same
    thing happen with computers. Why? Is smaller better?


    # Wonder


    # COMPUTER TALK


    6'
  - '[PAGE 15]


    # Crack the Code


    Computers read binary code, or machine code. A binary digit, also known as a bit,
    is a building block of information. The most basic code is binary, using a system
    of zeros (0) and ones (1). The series of 0s and 1s is hard for humans to read,
    but this is what computers understand.


    So how do we get from human language to the computer language made of 0s and 1s?
    Programmers write instructions in a language called source code, which looks a
    bit like random words and punctuation, but is actually filled with meaning! This
    source code is translated into the machine code that computers understand. Sometimes,
    computer scientists use a program called compiler to do this.


    Have you ever played Minecraft? This computer game is written with a computer
    language called Java!


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_15_0.png)'
