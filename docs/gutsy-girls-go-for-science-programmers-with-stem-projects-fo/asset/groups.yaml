    在这本书中，我们将遇到几位破解了计算机领域工作密码的女性，她们取得了改变我们生活方式的技术进步！你将了解到爱达·洛芙莱斯、格蕾丝·霍珀、为第一台电子计算机编程的六位
    ENIAC 女性、多萝西·沃恩以及玛格丽特·汉密尔顿。准备好开始了吗？我们出发吧！


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_16_0.png)


    > 这本书里有很多词汇！


    尝试通过观察周围的句子来推断含义，或者在词表中查找定义。


    # 幕后


    当你看网页时，代码并不是立而易见的。但有很多方法可以看到源代码。来看看吧！使用互联网时始终获得大人的许可。


    1. 使用你最喜欢的浏览器访问互联网。

    2. 访问你最喜欢的网站之一。

    3. 检查页面元素以及它们是如何相互作用的。


    勇敢女孩学科学：程序员


    要查看网页代码的样式，请根据你正在使用的浏览器遵循以下说明。


    - CHROME：用鼠标在固定标题上点击右键。左键点击“检查元素”以查看代码。

    - SAFARI：启用开发者菜单。在 Safari 菜单中进入“偏好设置 > 高级”。点击“在菜单栏中显示开发者菜单”。关闭偏好窗口并进入“开发”菜单，点击“显示网页源代码”。

    - INTERNET EXPLORER：按下 Alt 键打开浏览器菜单栏。从出现的下拉菜单中选择“查看”和“源代码”。

    - EDGE：点击屏幕右上角的“更多”图标。在出现的下拉菜单中选择“开发工具”。你也可以通过两个快捷键之一来访问它：在键盘上按下 Ctrl+U 或 F12。


    > 看看网页在不同的浏览器和不同的数字设备上看起来有多不同。你会发现相似之处，也有不同之处！程序员经常需要查看他们的代码在不同浏览器和设备上的显示差异。


    # 爱达·洛芙莱斯


    > 为未来的分析使用开发了一种全新的、庞大且强大的语言，通过运用其真理，使其能够为人类的目标实现更快速、更准确的实际应用。


    - 爱达·洛芙莱斯


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_19_0.png)


    # 计算机伯爵夫人


    # 我们如何让计算机执行我们想要做的事？


    编程！如果没有共同的编程语言，人类和计算机将无法通信，计算机也将毫无用处。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_20_0.png)


    被认为是第一位计算机程序员的人实际上并没有在计算机上工作过。她必须运用自己的想象力，写下人们如何与计算机通信的笔记，而当时计算机还没有被发明。但她的工作为人们今天仍在使用的未来语言奠定了基础。


    事实上，在20世纪70年代，美国国防部开发了一种名为 ADA 的新编程语言。这种语言是以第一位计算机程序员爱达·洛芙莱斯命名的！


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_21_0.png)


    # 爱达·洛芙莱斯


    致谢：Alfred Edward Chalon


    # 时间线

    - 1815年 爱达·洛芙莱斯出生。

    - 1828年 爱达设计了一台飞行机器。


    # 勇敢女孩学科学：程序员


    # 童年


    一位名叫罗德·拜伦的男人是19世纪初一位著名的诗人。某天在一次聚会上，他遇到了一位19岁的女性，名叫安贝拉。安贝拉来自一个富有家庭。她对数学充满热情。罗德·拜伦给了安贝拉“平行四形公主”的绰号。


    罗德·拜伦和安贝拉在1815年1月结婚。几乎一年后，他们有了一个女儿——奥达。当奥达五周大时，她和母亲搬到了安贝拉的家里。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_22_0.png)


    | 1837年 | 1843年 | 1852年 | 1946年 | 2009年 |

    | :--- | :--- | :--- | :--- | :--- |

    | 查尔斯·巴贝提出了第一台机械通用计算机。 | 爱达发表了关于分析机的翻译笔记，包含了第一个计算机程序。 | 爱达·洛芙莱斯去世。 | ENIAC成为第一台电子计算机。
    | 全球举行了第一个爱达·洛芙莱斯日。 |

    | 罗德·拜伦不久后去世。他的从人说罗德·拜伦最后的遗言是关于女儿的。奥达的母亲坚信女性教育，并雇佣导师教她数学和科学。她不希望女儿遵循罗德·拜伦的足迹成为诗人！
    | | | | 奥达过了一个孤独的童年。只有从人、导师和一只名叫 Puff 的猫陪伴着她。她经常生病，大部分时间都在室内阅读和学习。 |


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_23_0.png)


    奥达并不介意孤独。她发现自己在数学和科学上很有创造力。


    > 爱达！我唯一的女儿，我的心？当我最后看到你的蓝眼睛时，它们笑了，然后我们分开了——不像现在这样，而是带着希望。


    12岁时，她决定想要飞行。所以，她设计了一台飞行机器。她的机器形状像马，内部有一个蒸汽机提供动力。飞行机器有一对基于鸟类的机械翅膀。


    勇敢女孩学科学：程序员


    当奥达13岁时，她患了麻疹，卧床了三年！她的母亲鼓励奥达花更多时间学习，包括化学。当奥达康复后，她对母亲有点反叛。她想学习的不仅仅是数学和科学。


    # 世界第一位女性数学家


    著名的第一女性数学家和科学家是希帕提娅（约370-415年）。她出生在埃及的一个大城市亚历山大。她的父亲西翁是亚历山大大学的一位数学家。他教女儿他知道的一切，他们经常一起工作。当希帕提娅成年后，她在大学教学。她是唯一一位这么做的女性。希帕提娅在数学、天文学和哲学方面都有成就。她还是一位发明家，是发明了早期的星盘还是对其进行了改进，研究人员尚不清楚。


    希帕提娅时代，有些人认为数学和巫术是一回事而且是危险的。有一天，当希帕提娅离开大学时，她被暴民杀害，他们愤怒并害怕一个敢于学习和研究的女性。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_24_0.png)


    随着年龄增长，接触的人越来越多，对世界的了解深入，奥达发现了音乐与数学之间的关系。奥达也在数学和科学中看到了诗意。她自称为研究诗意分析的形而上学家。她对大脑如何产生思想感到着迷。


    # 17岁的奥达


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_25_0.png)


    > 爱达对机器感兴趣，特别是提花机。这种织布机使用孔卡在布料上织出图案，这是她在设计自己的系统时不会忘记的细节。


    > “我认为让更多女性进入计算领域非常重要。我的口号是：计算太重要了，不能留给男性。”——凯恩·斯帕克·琼，剑桥计算机实验室计算机信息教授


    Code.org 是一个鼓励所有人学习代码的组织。尝试这个小时的编程活动来创建你自己的谷歌标志。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_26_0.png)


    # 思想的交汇


    当奥达17岁时，她遇到了查尔斯·巴贝奇（1791–1871），剑桥大学的一位数学教授。查尔斯向奥达展示了他正在研究的计算机的小比例模型（原型）的计划。他将其称为差分机。他设想这是一个拥有约4000个零件的手摇计算器。它的重量至少会有2吨。


    # 成为伯爵夫人


    当她19岁时，奥达相遇并结了威廉·金。结婚后不久，她成为了伯爵，这意味着她成为了洛芙莱斯伯爵夫人。她的正式名称是奥古斯塔·拜伦·金·洛芙莱斯伯爵夫人。今天，她最被称为爱达·洛芙莱斯。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_27_0.png)


