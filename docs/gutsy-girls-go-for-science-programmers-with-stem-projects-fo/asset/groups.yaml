    ## 多萝西·沃恩 (DOROTHY VAUGHAN)


    > 我改变我能改变的，对于不能改变的，我忍受。


    多罗西·沃恩讲述在20世纪50 年代和60 年代作为黑人女性的经历。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_71_0.png)


    ## NASA早期程序员


    ## 时代正在发生变化


    多罗西·沃恩能预见到这一点。她工作了 15 年的国家航空咨询委员会（NACA）正在转变为国家航空和航天局（NASA）。传言说隔离可能也将结束，白人和黑人共同工作。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_72_0.png)


    多罗西被一台她在室内见过最大的机器之一吸引了注意力。那是一台计算机，一台可能取代她工作的机器。但多罗西并没有纠结于此。她看到了学习新知识的机会。似乎很少有人知道如何编程和操作这种机器。为什么不是她呢？


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_73_0.png)


    多罗西·沃恩

    来源：NASA


    > 看看更多海德行星馆和科学中心对多罗西·沃恩的评价。


    连接 . . . . . . . . . . Morehead 多罗西·沃恩


    | 时间线 | 1910 | 1943 | 1949 | 1954 | 1958 |

    |---|---|---|---|---|---|

    | | 多罗西·约翰逊（Dorothy Johnson）于9月20日出生。 | 多罗西开始在 NASA 工作，那是一个隔离的公司。 | 多罗西被任命为西计算部的主管。
    | 美国最高法院在对“堪萨斯州托皮卡区诉教育委员会案”的裁决中，宣布学校隔离违宪。 | NACA 变为 NASA。 |


    ## 勇敢的女孩投身科学：程序员


    ## 孩童


    多罗西·约翰逊于1910年9月20日出生于密苏里州堪萨斯市，当她七岁时，家人搬到了西弗吉尼亚州的摩根敦。


    学校对多罗西来说很容易。她在15岁时就高中毕业并直接进入大学。她就读于俄亥俄州的威尔伯大学（Wilber University），这是第一所由非裔美国拥有并运营的美国大学。


    当多罗西20岁时，她已经有两个学位——一个数学学位，另一个法语学位。


    ## 分开但……平等？


    1896年，美国最高法院裁定，不同种族实行“隔离但平等”的学校是合。然而，隔离并不是平等的。


    - 1964年：《民权法案》通过。

    - 1971年：多罗西从 NASA 退休。

    - 1983年：吉恩·布鲁福德（Guion Bluford）成为首位非裔美国宇航员。

    - 1992年：梅·杰米森博士（Mae Jemison）成为首位进入太空的非裔女性。

    - 2008年：多罗西去世。


    ## 新工作


    大学毕业后，多罗西担任教师。她在1932年与霍华德·沃恩结婚。他们有六个孩子。


    虽然法律规定雇佣非裔美国人，但对工作条件没有任何规定。多罗西被分配到西计算部——只有非裔女性在该部门工作。西计算部有独立的办公区、用餐区和洗手间。东计算部完全由白人女性组成。


