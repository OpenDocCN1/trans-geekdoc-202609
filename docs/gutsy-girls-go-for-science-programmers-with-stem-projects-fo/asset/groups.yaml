    玛格丽特关于胆于失败的这段名言对你意味着什么？你能回想起自己胆于失败的时刻吗？你能回想起那些因为恐惧而没有抓住机会的瞬间吗？


    ## 为什么？


    ## 私营行业


    玛格丽特在20世纪70年代中期离开麻省理工学院经营自己的业务。她在1976年共同创立了Higher Order Software，并担任了八年的CEO。1986年，她创立了Hamilton
    Technologies公司。这两家公司都专注于编程和软件。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_103_0.png)


    ## 科技女性


    拉丁裔女性在美国计算机科学和编程领域是一个代表性极不足的群体。2016年，只有2%的拉丁裔女性从事计算领域。由女性与信息技术国家中心（NCWIT）开发的“科技”计划旨在提高拉丁裔女孩及其家庭对科技职业的认知。该计划的重要部分是介绍目前从事计算机技术工作或在学校学习计算机科学的拉丁裔女性。这个轮换计算机科学导师小组通过线下和在线的方式向她们讲述自己的故事。你可以在这个网站向她们学习。


    科技女性


    玛格丽特认为，软件工程能帮助人们更有创造力，成为更好的问题解决者。它还教会了从错误中学习并将其转化为积极结果的重要性。


    2016年11月22日，巴拉克·奥巴马总统授予玛格丽特·哈密尔顿总统自由勋，感谢她在阿波罗11号编程方面的贡献。总统自由勋是平民可以获得的最高荣誉。


    ## 试试看！HTML


    你有智能手机或平板电脑吗？如果有，你就对App有一定的经验！移动App的使用率处于历史高位。各年龄段的人（包括孩子）对App都有很好的主意。App可以娱乐、教育并简化我们的生活。


    你呢？你有一个App的好主意吗？那么，让我们开始这个代码小时”项目吧。使用Javascript制作App。


    获得成人的许可来使用本项目中的技术。


    想出一个主意。如果你已经有了主意，请跳到第2步。如果没有，请进行头脑风暴。你是否使用一些可以改进的App？


    ## 你的工具箱清单


    - 移动设备（iPhone、安卓、iPad）

    - 代码小时网站


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_106_0.png)


