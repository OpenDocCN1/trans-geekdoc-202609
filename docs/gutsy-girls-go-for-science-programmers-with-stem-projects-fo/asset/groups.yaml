    # Gutsy Girls Go for Science: Programmers'
  - "[PAGE 40]\n\nIn 1947, a moth was found in the Mark II computer. The bug had short\
    \ circuited a relay, which is an electronic switch. Grace Murray Hopper taped\
    \ it to the computer logbook and wrote, \"first actual case of bug being found.\"\
    \ She was the first to talk of \"debugging\" computers! She was also the first\
    \ to do many things.\n\n# As a Kid\n\nGrace Brewster Murray was born in New York\
    \ City on December 9, 1906. Even as a child, she always wanted to know how things\
    \ worked.\n\nClocks, for example. Where did the ticking come from? When Grace\
    \ was seven, she decided to find out, so she took apart one clock, then another,\
    \ and another.\n\n| 1946 | 1952 | 1957 | 1959 | 1992 |\n|---|---|---|---|--|\n\
    \ ENIAC becomes the first electronic digital computer. | Grace develops the first\
    \ compiler. | FORTRAN programming language is developed by a team at IBM. | A\
    \ team led by Grace develops COBOL, a business-oriented programming language.\
    \ | Grace passes away on January 1. |"
  - '[PAGE 41]


    > in 1930,

    15 percent of math

    doctorates in the United States

    were women. By the 1950s,

    number had dropped to 4 percent. It took

    more than 50 years for that percentage to

    rise to the level it had been in 1930. Why

    do you think this?

    Wonder why?


    She was one of four women

    entering Yale''s Ph.D. program

    in mathematics. While there, she

    married Vincent Foster Hopper and

    changed her last name.


    After earning a PhD in 1934, Grace

    Hopper began teaching mathematics

    at Vassar. She approached teaching

    the same way she approached life—nwith a desire to shake things up. She

    wanted her students to study writing

    and science as well as math.


    The Murrays were a prosperous family

    who lived in Manhattan and spent their

    summers at a lake in New Hampshire.

    Books were plentiful at the Murray house.

    The family valued education.


    > Grace believed there was

    no use learning math if you

    cn''t communicate with

    others, and she saw writing

    as a link among the different

    subjects.


    Grace started at Vassar College at age

    17. By 1928, she had math and physics

    drees. She continued her education

    at Yale, earning an advanced degree in

    mathematics by the time she was 23.


    This didn''t make Grace very

    popular with other professors, but

    t students loved her.


    # Gutsy Girls Go for Science: Programmers'
  - '[PAGE 42]


    # GIRLS ONLY!


    Vassar began in 1861 as a college for women. Back then, most colleges and universities
    didn''t allow women to attend, so sometimes, people began new schools for girls.
    Vassar had the reputation for being very challenging. Women could take classes
    in art history, geology, astronomy, music, mathematics, and chemistry. It was
    known as a school that offered experiential learning. In 1869, the famous astronomer
    Maria Mitchell took her students out of the state to observe an eclipse of the
    sun! Vassar allowed boys to enroll in 1969. What do you think might have changed
    when men began to attend?


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_42_0.png)


    The entrance to Vassar College, 1904'
  - '[PAGE 43]


    # Wartime


    The Japanese attacked Pearl Harbor, Hawaii, on December 7, 1941, and the next
    day, the United States entered World War II. American women and men wanted to
    serve their country. But there weren''t many opportunities for women.


    Grace wanted to do her part as well. Her great-grandfather had been a rear admiral
    in the Navy, so she tried to join the Navy. But at 35 years old and 108 pounds,
    she was considered too old and too small.


    Grace''s determination, which would become famous through her career, pushed her.
    She kept applying until she was finally accepted into the WAVES, or Women Accepted
    for Volunteer Service.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_43_0.png)


    > When Grace enlisted, there were approximately 27,000 WAVES. There would be more
    than three times that number by the end of the war.


    Gutsy Girls Go for Science: Programmers'
  - '[PAGE 44]


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_44_0.png)


    # HEDY LAMARR

    (1914–2000)


    Grace Hopper isn''t the only woman to revolutionize technology for the Navy. If
    you''re a fan of old movies, the name Hedy Lamarr might be familiar. She was a
    famous movie actress in the 1940s and 1950s. She also developed technology that
    makes today''s wireless technology possible. Torpedoes in wartime were successful
    only 40 percent of the time because the radio signals jammed up. Single-frequency
    settings also left ships vulnerable to attack. Hedy worked with a composer friend
    on a way for a sender and receiver to hop frequencies in a pattern. She patented
    the invention, and then gave it to the Navy. The Navy didn''t use Hedy''s invention
    during World War II, but they did use the technology in the late 1950s. In 1990,
