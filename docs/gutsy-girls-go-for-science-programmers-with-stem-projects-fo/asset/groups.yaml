  - '[PAGE 99]


    Once the astronauts were in space, there could be no mistakes. Margaret had to
    think of everything that could possibly go wrong—such as human error, loss of
    power, and going off course—and then have a fix ready. In fact, her daughter helped
    with this. When playing astronaut, her daughter selected the pre-launch program
    while the simulator was in “flight.” The program crashed. Margaret created a fix.


    > > Buzz Aldrin on the moon

    > > credit: NASA


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_99_0.png)


    91 Gutsy Girls Go for Science: Programmers'
  - '[PAGE 100]


    # Mission control after the successful moon landing

    credit: NASA


    While millions of people watched the Apollo 11 mission on their televisions, Margaret
    watched from mission control. Minutes before the landing on the moon, error messages
    began going off. Then, the 1202 alarm went off. This meant the computer was being
    overwhelmed with too many tasks.


    A switch had been flipped to change the computer''s priority system to a radar
    system. The software override that command based on Margaret''s programming. The
    guidance computer needed to shed less important tasks and focus on the highest-priority
    task—steering and landing the lunar module. The program worked, allowing Neil
    Armstrong and Buzz Aldrin to safely land on the moon.


