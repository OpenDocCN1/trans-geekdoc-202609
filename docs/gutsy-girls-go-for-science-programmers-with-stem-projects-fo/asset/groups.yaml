    # When computers were first built during the twentieth century, inventors studied
    Charles''s designs and Ada''s notes.


    The article, Sketch of the Analytical Engine Invented by Charles Babbage was published
    in 1843 when Ada was just 27 years old. She began experiencing health problems
    soon afterward. She passed away from cancer at age 36 on November 27, 1852. At
    her request, she was buried next to her father.


