    # 童年


    玛格丽特·哈密尔顿于1936年8月17日出生于印第安纳州的波奥利。她将父亲描述为一位哲学家和诗人，经常和她谈论宇宙。玛格丽特意识到，在思考宇宙时，数学是非常有用的。她喜欢诗歌和哲学，但在解决问题时，她求助于数学，包括代数、几何学和微积分。


    而且玛格丽特喜欢解决问题。她对很多事情感到好奇，比如为什么男孩和女孩没有被同等待待。为什么没有更多的女棒球运动员和科学家？她在成长过程中通过打棒球贡献了自己的力量。并继续学习数学。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_93_0.png)


    # 玛格丽特·哈密尔顿


    > 多样性在学校和职场中有多重要？为什么？


    她在大学学习数学似乎是理所当然的。她经常是数学和物理课上唯一的女孩。她的目标是成为一名数学教授。


    埃尔哈姆学院（Earlham）的女性数学教授弗洛伦斯·龙（Florence Long）是玛格丽特的榜样。


    # 为月球进程序


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_94_0.png)


    # 第一位软件工程师


    大学期间，玛格丽特相遇并结婚了丈夫，改名为玛格丽特·哈密尔顿。毕业后，她成为了一名高中数学老师。她和丈夫决定轮流工作和攻读高级学位。当丈夫在上学时，玛格丽特在1959年开始在麻理工学院的新林肯实验室（Lincoln
    Laboratory）工作。


    玛格丽特很快意识到，计算机可以帮助回答关于宇宙的问题。她开始编写代码，即计算机的指令。起初，这些程序是用来预测天气的。


    玛格丽特搬到了麻理工的另一个实验室——仪器实验室（Instrumentation Laboratory）。该实验室为 NASA 提供航空技术。她所参与的项目的代码变得越来越复杂！玛格丽特编写了识别敌方飞机的程序软件。


    > 听约翰·F·肯尼迪总统在他著名的演讲中表达他对太空探索未来的愿景。你想出最近有哪些哪些演讲引发了同样的灵感和努力工作吗？


    > 玛格丽特经常是计算机实验室里唯一的女性，但她全心投入工作，以至于很少注意到。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_95_0.png)


    她成为了系统编程专家。当时还没有一个职位名称可以准确描述她在做什么，于是她发明了一个——软件工程师。


    # 月球


    20世纪50年代，美国和苏联正在进行竞争。这是一场太空竞赛，苏联处于领先地位。


    约翰·F·肯尼迪总统在1961年5月25日向国会发表演讲。他说是时候让人类登上月球了，美国将在本世纪结束前实现这一目标。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_96_0.png)


    > 我们选择登上月球……完成其他事情，不是因为它们容易，而是因为它们困难；因为这个目标将有助于组织和衡量我们最好的能量和技能，因为这个挑战是我们愿意接受的，是我们不愿推迟的，也是我们想要赢得，而其他的挑战也是如此。

    > ——约翰·F·肯尼迪总统，1961年


    当玛格丽特考虑回到学校学习时，这段公告浮现在她的脑海中。她本打算去附近的布兰代斯大学（Brandeis University）获得高级数学学位，但她听到麻理工学院将与
    NASA 合作开发将人类送到月球的软件。那是一个她必须参与的项目！


    航天器必须发明两台便携式计算机。一个用于指令舱，另一个用于登月舱。玛格丽特负责车载飞行软件。事实上，她的女儿对此帮了忙。在玩航天员时，当模拟器处于“飞行”状态时，她的女儿选择了发射前程序。程序崩溃了。


    当航天员在太空中时，不能出任何错误。玛格丽特必须考虑到可能发生的任何问题——如人为错误、电源丢失或偏航——并准备好解决方案。


    1966年10月14日，土星五号火箭前往39号发射场，准备开启月球之旅。玛格丽特的团队分析了任何错误。到1968年，约有40人在致力于阿波罗软件。一个开关被拨动以改变计算机的优先级系统。玛格丽特现在是一位母亲了。有很多晚上和周末，她的女儿会来工作。玛格丽特在同一天接受采访。工作始于1963年。


    > 玛格丽特讲述她是如何成为阿波罗项目的程序员的。


    # 勇敢的女孩投身科学：程序员


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_98_0.png)


    > 月球上的巴兹·奥尔德林

    > 来源：美国航空航天局 (NASA)


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_99_0.png)


    # 登月成功后的任务控制

    >来源：美国航空航天局 (NASA)


    当数百万人在电视上看阿波罗11号任务时，玛格丽特在任务控制中心观察。在降落在月球前几分钟，错误信息开始响起。随后响起了1202警报。这意味着计算机被过多的任务淹没了。


    基于玛格丽特程序的软件覆盖。引导计算机需要丢弃不重要的任务，专注于最高优先的任务——引导和登月舱着陆。程序运行正常，让尼尔·阿姆斯特朗和巴兹·奥尔德林安全地降落在月球上。


    '
