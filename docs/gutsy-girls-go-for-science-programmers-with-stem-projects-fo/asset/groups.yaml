    多萝西与其他的非洲裔女性一起工作，为工程师的实验进行计算。工程师团队通过在巨大的风洞中测试飞行的飞机模型来测试它们的耐用性。


    1949年，多萝西成为 NASA（美国航空航天局）首位担任西区计算组的非洲裔主管。之前的两位主管都是白人女性。她的职责意味着将这些女性分配到不同的项目中。她也继续从事特殊项目。和其他计算主管一起，她编写了一本计算机手册。


    多萝西的工作不仅限于计算和监督。她还为女性计算员争取权益，无论她们的种族如何。如果有人应该晋升或加薪，她会挺身而出。


    ## 变革正在到来


    1947年，NACA（美国航空咨询委员会）从贝尔实验室购买了一台电子计算器。这台电子计算器使用打孔带作为输入。它生成答案的速度比人类快16倍。而且在运行时，整栋楼都会震动！


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_79_0.png)


    尽管大多数计算仍然是手工完成，但多萝西意识到，她的电子同事有一天会接替她的工作。她也知道整合就在家门口——非洲裔和白人将共同工作并竞争同一份工作。技能最出色的人将获胜。


    《隐藏的数字》（Hidden Figures）的作者马戈特·李·谢特利（Margot Lee Shelterly）写道：“处于整合的最前沿并非胆小者所能。”多萝西是如何证明这一点的？


    ## 为什么？


    多萝西开始在下班和周末上计算课程。她鼓励其他的西区计算员也这样做。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_80_0.png)


    > 多萝西·范恩位于这张人类计算员合照的最左侧。


    只要有机会，多萝西就会去地下冰冷的房间看 IBM 704 计算机。那里的温度设得很低，以防止真空管过热。


    ## 从 NACA 到 NASA


    国会通过了1958年《空间法案》，引导 NACA 成为 NASA。1958年5月5日发出一份备忘录。西区计算单元不复存在了。隔离设施将成为过去。


    多萝西加入了新的分析与计算学部（ACD）。该小组由来自不同种族的男女组成，他们都在计算机上工作。计算机不仅可以进行计算，还能进行模拟。


    多萝西学习了一种新的编程语言——公式翻译器，即广为人知的 FORTRAN。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_81_0.png)


    FORTRAN 是第一个让数学家以外的人们也能进行编程的语言。IBM 开发 FORTRAN 的 10 人团队中包括一名女性，洛伊斯·海伯特（Lois Haibt,
    1934-）。


    多萝西重新定义了她的职业，成为一名专家 FORTRAN 程序员。由于她的编程技能，她参与了重要项目，例如一个开发可靠发射火箭的程序，使得卫星发射和载人航天成为可能。


    NASA 仍然在使用某个版本的 FORTRAN。人们仍然对旅行者1号和2号等旧项目使用较旧版本的 FORTRAN。1977年发射的两艘旅行者号航天器仍在向我们发送关于太阳系及以外的数据。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_82_0.png)


    ## 多萝西·范恩的影响


    多萝西于1971年从 NASA 退休。她在计算机编程和 NASA 的贡献一直是一个鲜为人知的事实，直到马戈特·李·谢特利在2017年出版了《隐藏的数字》，这件事才广为人知。《隐藏的数字》讲述了
    NACA 和 NASA 早期非洲裔女性的故事。该书还被改编成了电影。


    多萝西在退休后活跃于教会和音乐节目，并从事志愿者工作。她于2008年11月10日去世，享寿98岁。她没能看到自己在计算机编程和整合航天工业方面获得的认可。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_83_0.png)


    NASA 旅行者2号测试

    图片来源：NASA/JPL


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_84_0.png)


    虽然多萝西的编程技能对美国航天计划至关重要，她也证明了非洲裔女性在航天工业和计算机编程领域都能取得成功。


    > NASA 员工对《隐藏的数字》中人物的影响有何评价？请访问此网站查看。


    ## 多萝西·范恩：早期 NASA 程序员


