    # 艾达·洛夫莱斯

    计算机伯爵夫人


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_28_0.png)


    > > **计算机历史博物馆展出的查尔斯·巴贝奇差分机模型**

    > 来源：Jitze Couperus (CC BY 2.0)


    艾达对计算机器感到兴奋。查尔斯意识到，她对数学的理解程度是少数人能够企及的。他称她为“数字女魔术”。


    两人成为了朋友，并经常就数学和逻辑互相写信交流。


    > > 艾达的财富是否为她获得了其他女孩没有的机会？如果她很穷，她还会如此投入数学研究吗？


    # 奇迹


    20


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_29_0.png)


    # 计算机的愿景


    作为一名已婚伯爵夫人和母亲，艾达并没有停止学习。她甚至请了一位数学家来教她三角学，即关于三角形的研究。


    与此同时，查尔斯开始研究他的新发明，名为“分析机”。虽然他从未真正制造出差分机（它可以生成并计算行列数字），但分析机将能够解决数学问题并存储信息。


    > 艾达·洛夫莱斯，1836

    > 来源：Margaret Sarah Carpenter


    勇敢女孩投身科学：程序员


    > 艾达·洛夫莱斯日定于每年的10月第二个周二举行。这是一个表彰科学、技术、工程和数学（简称 STEM）领域女性的节日。


    艾达能够看到，这样的机器可以处理任何内容——文字、图形和音乐。就像我们今天拥有的计算机一样！


    查尔斯·巴贝奇曾向许多小组发表过关于他分析机想法的演讲。在其中一次演讲后，一位意大利工程师和数学家用法语写了一篇关于巴贝奇机器的论文。不清楚将论文翻译成英文是查尔斯的主意还是艾达的主意，但她非常乐意承担这项工作！


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_30_0.png)


    查尔斯·巴贝奇，1871

    > 来源：《伦敦插画报》未知职员画师


    艾达的翻译包含了她自己的注释，描述了这台机器及其工作原理。一系列指令（或算法）可以通过打卡片编程到机器中。


    > 艾达解释说，分析机可以像“雅卡尔织机编织花朵叶子一样”编织图案。


    她的“注释”部分比原始的 8000 字论文长了一一倍多。更重要的是，她发现了一种机器可以使用的算法。


