    # Visions of a Computer


    Now a married countess and mother, Ada kept up with her studies. She even hired
    a mathematician to teach her trigonometry, the study of triangles.


    Meanwhile, Charles began work on his new invention, called an Analytical Engine.
    While the Difference Engine, which he never actually built, would have produced
    and calculated rows and columns of numbers, the Analytical Engine was to be able
    to solve math problems and store information.


    > Ada Lovelace, 1836

    credit: Margaret Sarah Carpenter


    Gutsy Girls Go for Science: Programmers'
  - '[PAGE 30]


    > Ada Lovelace Day is held the second Tuesday in October each year. It''s a day
    of recognition for women in science, technology, engineering, and math—known as
    STEM.


    Ada could see that such a machine could work with anything—words, graphics, and
    music. Just like the computers we have today!


    Charles Babbage delivered talks about his ideas for the Analytical Engine to many
    different groups. After one of those talks, an Italian engineer and mathematician
    wrote a paper in French about Babbage''s machine. It''s not clear whether translating
    the paper into English was Charles''s idea or Ada''s, but she was excited to take
    on the job!


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_30_0.png)


    Charles Babbage, 1871

    credit: Unknown staff artist for The Illustrated London News'
