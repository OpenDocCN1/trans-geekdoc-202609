    (NACA), where she had worked for 15 years, was becoming the National Aeronautics
    and Space Administration (NASA). Rumors were that segregation might end as well,
    and white and black people would be allowed to work together.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_72_0.png)


    Dorothy was distracted by the sight one of the largest machines she had ever seen
    indoors. It was a computer, one that could take her job away. But Dorothy didn''t
    dwell on that. She saw an opportunity to learn something new. Few people seemed
    to know how to program and operate the machine. Why not her?


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_73_0.png)


    Dorothy Vaughan

    credit: NASA


    > See what Morehead Planetarium and Science Center has to say about Dorothy Vaughan.


    Connect . . . . . . . . . . . Morehead Dorothy Vaughan


    | TIMELINE | 1910 | 1943 | 1949 | 1954 | 1958 |

    |---|---|---|---|---|---|

    | | Dorothy Johnson is born on September 20. | Dorothy begins working at NASA,
    which is a segregated company. | Dorothy is appointed supervisor at West Computing.
    | The U.S. Supreme Court declares school segregation unconstitutional in its ruling
    on Brown v. Board of Education of Topeka, Kansas. | NACA becomes NASA. |


    ## Gutsy Girls Go for Science: Programmers


    ## As a Kid


    Dorothy Johnson was born on September 20, 1910, in Kansas City, Missouri, and
    when she was seven, her family moved to Morgantown, West Virginia.


    School was easy for Dorothy. She graduated from high school by age 15 and went
    straight to college. She attended Wilber University in Ohio, the first American
    college to be owned and operated by African Americans.


    By the time Dorothy turned 20 years old, she had two degrees—one in mathematics
    and the other in French.


    ## SEPARATE BUT... EQUAL?


    In 1896, the U.S. Supreme Court ruled that it was legal to have separate but equal
    schools for different races. However, segregation was not equal.


    - 1964: The Civil Rights Act is passed.

    - 1971: Dorothy retires from NASA.

    - 1983: Guion Bluford is the first African American astronaut.

    - 1992: Dr. Mae Jemison becomes the first African American female in space.

    - 2008: Dorothy passes away.


    ## New Jobs


    After college, Dorothy worked as a school teacher. She married Howard Vaughan
    in 1932. They had six children.


    While the law said that African Americans would be hired, there was nothing said
    about working conditions. Dorothy was assigned to West Area Computing—only African
    American women worked on that unit. The East Area Computers were made up of white
    women only.


    The West Area Computers had separate work and dining areas and separate bathrooms.

