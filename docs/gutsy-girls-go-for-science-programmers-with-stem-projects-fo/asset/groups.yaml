  mdcn: "\n\n# 词汇表\n\n机器码 (MACHINE CODE)：由二进制指令组成的编程语言，计算机可以直接对其做出响应。\n\n优先级 (PRIORITY)：比其他事物更重要的。\n\
    \n大型机 (MAINFRAME)：一种大型且强大的计算机。\n\n程序员 (PROGRAMMER)：编写计算机程序的人。也称为代码编写员。\n\n手册 (MANUAL)：一本说明书。\n\
    \n编程语言 (PROGRAMMING LANGUAGE)：一种发明用于向计算机传递指令的语言。\n\n手动地 (MANUALLY)：通过手工。\n\n晋升\
    \ (PROMOTE)：将某人提升更高的职位或等级。\n\n数学 (MATHEMATICS)：对与数字相关的思想的研究。数学家研究数学。\n\n繁荣的 (PROSPEROUS)：财务上成功的，富有的。\n\
    \n麻疹 (MEASLES)：一种会导致发热和皮疹的传染性。\n\n原型 (PROTOTYPE)：工程师用于测试其解决方案的运行模型或模型。\n\n形而上学哲学家\
    \ (METAPHYSICIAN)：研究现实基本性质的哲学分支的专家。\n\n打孔卡 (PUNCH CARD)：一种打有孔的卡片，用于向机器或计算机提供指令。\n\
    \n任务控制中心 (MISSION CONTROL)：地球上的一个指挥中心，帮助宇航员执行任务。\n\n种族 (RACE)：一群具有独特物理特征（如肤色）的人。\n\
    \n美国国家航空和空间天局 (NASA)：美国国家航空和空间天局，负责太空探索的美国机构。\n\n反叛的 (REBELLIOUS)：反抗权威或掌权者。\n\n\
    平行四边形 (PARALLELOGRAM)：一种对边平行的四边形。\n\n招募 (RECRUIT)：使某人加入；最近加入武装部队或其他团体的人。\n\n专利\
    \ (PATENT)：政府颁发的许可，赋予发明者或创造者制造和销售某种产品或发明的独家权利。\n\n继电器 (RELAY)：一种根据其他变化而使电子电路发生变化的设备。\n\
    \n哲学家 (PHILOSOPHER)：研究真理、智慧、知识和现实本质的人。\n\n资源 (RESOURCES)：你可以寻求帮助或支持的东西；也可以是指对某个地方或人有用或有价值的东西。\n\
    \n物理学 (PHYSICS)：研究物质和能量如何共同工作的科学。物理学家研究物理学。\n\n卫星 (SATELLITE)：送入的航天器；也可以是指绕较大天体运行运行的月球。\n\
    \n学者 (SCHOLAR)：在某一领域受过高等教育的人。\n\n脚本 (SCRIPT)：在计算机编程中，脚本是一个由另一个程序解释或执行的程序或指令序列。\n\
    \n安全许可 (SECURITY CLEARANCE)：仅授予经批准查看机密的人的特殊许可。\n\n隔离 (SEGREGATION)：将不同种族、性别或宗教的人隔离开来的做法。\n\
    \n短路 (SHORT CIRCUIT)：电流通过电阻最小的路径的情况。它可能导致电击。\n\n模拟 (SIMULATION)：在实际行动之前对某事物的复制或模仿。\n\
    \n软件工程师 (SOFTWARE ENGINEER)：以系统方法开发软件的人。\n\n源代码 (SOURCE CODE)：指令的文本列表，可被编译或汇编成可执行的计算机程序。\n\
    \n太空竞赛 (SPACE RACE)：美国和苏联之间为了在太空探索领域取得最大成就而进行的竞争。\n\n标准化 (STANDARDIZE)：让一切都变得一致。\n\
    \n故事分镜 (STORYBOARD)：故事的视觉化表示，可以包括图画、方向和对话。\n\n开关 (SWITCH)：在计算机中，一种开启或中断电路中电流流的设备。\n\
    \n技术 (TECHNOLOGY)：用于解决问题或工作的工具、方法和系统。\n\n终身制 (TENURE)：保证性的永久就业，通常适用于大学级别的教授。\n\
    \n轨迹 (TRAJECTORY)：物体在力作用下运动的路径。\n\n三角学 (TRIGONOMETRY)：研究三角形性质及其函数的数学分支。\n\n家教\
    \ (TUTOR)：给学生提供私人课程的人。\n\n教程 (TUTORIAL)：允许人们使用软件进行自学的常规程序。\n\nUNIVAC：通用自动计算机；美国生产的第一台商业计算机。\n\
    \n真空管 (VACUUM TUBE)：一种像灯泡的电子元件。它曾被用作早期计算机和其他电器的开/开关。\n\n侍从 (VALET)：照看男性衣服的私人随从；也可以是高端酒店的员工。\n\
    \n虚拟现实 (VIRTUAL REALITY)：通过计算机设备看起来是三维的交互式环境。\n\n波士妇女 (WAVES)：志愿者应急服务接受的女性，美国海军的女性志愿者。\n\
    \n风洞 (WIND TUNNEL)：建造的隧道，以便飞机可以在风力中进行安全测试。\n\n# 书籍\n\n- Bodden, Valerie. 编程先驱\
