    # Female Mathematicians Wanted


    Many women who attended college during this time period majored in math. And most
    became teachers. That would probably have been Jean''s path as well, except that
    her calculus teacher showed her a flyer.


    Wanted: Women with Degrees in Mathematics


    The University of Pennsylvania was looking for female mathematicians. The women
    would work as “computers,” doing a lot of the math that was required at the department.


    Jean applied and was accepted. She left on a midnight train, arriving 40 hours
    later in Pennsylvania. She was 20 years old. It was the first time she had ever
    been out of Missouri!


    At work, Jean sat in a large room with almost 100 other women.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_57_0.png)


    Gutsy Girls Go for Science: Programmers'
  - '[PAGE 58]


    Pads of paper and desktop adding machines with cranks lay on the desks. Their
    job? Calculating trajectory tables for the Army.


    Back then, missile accuracy was poor. It depended on many things, including humidity,
    the curve of the earth, and geography. All of these things could be accounted
    for with math, but the equations were complex. It might take 12 hours for one
    person to complete one equation! And it took about a month for a single ballistics
    table to be completed, even though the women worked as efficiently as they could.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_58_0.png)


    # THE ENIAC WOMEN

    UNUNG HEROES


    50'
  - '[PAGE 59]


    # CODING IN WARTIME: JOAN CLARKE


    Joan Clarke (1917-1996) was a codebreaker who played a critical role in cracking
    the codes of Nazi Germany. This saved countless lives in Great Britain during
    World War II. Joan was recruited in 1939 by the British government because of
    her work in mathematics at Cambridge. She and others worked on the Colossus at
    Bletchley Park, which is now a museum. Take a look!


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_59_0.png)


    Women with the Colossus


    # Connect ............................ Bletchley Park


    A few months after Jean started her job, a memo came out stating there were six
    openings to work on a new machine at the University of Pennsylvania''s Moore School
    of Engineering.


    Jean was getting a little bored with her job, so she applied. During her interview,
    she was asked what she knew about electricity. What they really wanted to know
    was whether she was scared of electricity. She said she wasn''t and was hired.


    Guts Girls Go for Science: Programmers'
  - '[PAGE 60]


    So were five other women: Marilyn Wescoff, Ruth Lichterman, Betty Snyder, Frances
    Bilas, and Kay McNulty. They came from different backgrounds and cultures. What
    did they have in common? Math.


    # # Introducing ENIAC


    Physicist John Mauchly (1907–1980) had thought up an all-electronic calculating
    machine in 1942. He correctly believed that it would run faster without mechanical
    parts. And in wartime, speed was critical. ENIAC was the result, built between
    1943 to 1945.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_60_0.png)'
  - '[PAGE 61]


    Once the machine built, it needed to be programmed. The men who''d built it believed
    that the programming wasn''t as important. The six women who''d been hired were
    called the “ENIAC girls.” They received $2,000 a year, plus a $400 bonus for working
    Saturdays.


    The women were sent to an Army facility to learn how to use IBM punch cards and
    wire up control panels. They returned to the University of Pennsylvania six weeks
    later.


    > The ENIAC programmers often worked in teams.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_61_0.png)


    # Gutsy Girls Go for Science: Programmers'
  - '[PAGE 62]


    # ENIAC PROGRAMMERS PROJECT


    Attorney Kathy Kleiman first learned about the ENIAC programmers when she was
    a student at Harvard University. She wrote papers on female "computers" of the
    mid-twentieth century. When ENIAC''s 50th anniversary was announced, Kathy learned
    that the original ENIAC programmers weren''t invited to the celebration. She created
    the ENIAC Programmers Project to tell their stories. Kathy recorded oral histories
    and pushed for recognition for their accomplishments. She continues to speak about
    diversity in computer programming. Listen to Kathy Kleiman speak about women in
    computer programming history in her TEDx Talk.


    Kathy Kleiman TED


    At first, the women weren''t even allowed to see ENIAC. They didn''t have security
    clearance. Instead, they were given wiring diagrams, blueprints, and charts! That''s
    how they were supposed to figure out how to program ENIAC.


    Finally, they were allowed to work with the machine in the 1,500-square-foot room
    where ENIAC lived. The 30-ton monster was 9 feet high and covered three sides
    of the room. It included 6,000 switches, 1,500 relays, and 18,000 vacuum tubes.
    And it could calculate more than 1,000 times faster than a human.'
  - '[PAGE 63]


    # Programming ENIAC


    Soon, the six women knew the machine better than the engineers. The programmers
    realized that the key to programming ENIAC and keeping it running was to break
    big problems into small steps.


    The 18,000 vacuum tubes that made ENIAC so fast were always burning out. A burnt-out
    bulb meant that ENIAC couldn''t do its job. Jean and Betty developed a system
    to locate and replace a burnt-out vacuum tube within 15 minutes.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_63_0.png)


    > There were 18,000 vacuum tubes like these on the ENIAC.


    credit: Erik Pitti (CC BY 2.0)


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_63_1.png)'
  - '[PAGE 64]


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_64_0.png)


    World War II ended before ENIAC could offer much help, but the Army decided to
    introduce ENIAC to the world. Of course, ENIAC began acting up the day before
    its first public demonstration.


    The women worked most of the night to get it working. There were many, many late
    nights dedicated to keeping ENIAC in working order.


    Two demonstrations were held on February 14, 1946. The first one was for journalists.
    The second was for important scientists and military officers.


    The programmers weren’t introduced, nor were they invited to celebrate ENIAC’s
    success at the dinner that evening. The women were invisible.


    # THE ENIAC WOMEN

    Unsung Heroes


    56'
  - '[PAGE 65]


    > Yet the tale of ENIAC’s programming by a group of young women has all but been
    erased from computer history.


    Although the war was over, there was still work for ENIAC to do, and some of that
    work was top secret. In later years, the women would suspect they had something
    to do with development of the hydrogen bomb, a very powerful nuclear weapon.


    # The Computers documentary movie


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_65_0.png)'
  - '[PAGE 66]


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_66_0.png)


    ENIAC introduced the modern age of computing. For five years, it was the only
    electronic computer operating in the United States. And it served the Army for
    nine years.


    The **ENIAC. Can you imagine having to use this machine instead of a laptop?***


    > For the 50th anniversary of ENIAC, University of Pennsylvania undergraduates
    recreated the computer. What was once a room-size computer could now be contained
    on a computer chip in the palm of your hand.'
  - '[PAGE 67]


    # After ENIAC


    ENIAC was moved to Aberdeen, Maryland, in the late 1940s. Ruth and Frances went
    with it. Frances became head of the computer research branch, while Ruth went
    went on to teach programming to others.


    > Hear what Jean has to say about programming. What does she attribute the success
    of ENIAC to?


    # Connect ........


    Jean Bartik video


    > The ENIAC programmers inspired me to stay in computing at a time when there
    were few women in my programming classes and every signal was telling me that
    computing was not a field for women.


    Jean, Betty, and Kay continued to work with the men who built ENIAC, turning their
    focus to a new computer called the Binary Automatic Computer, or BINAC. Later,
    Grace Hopper worked for the same company that built BINAC.


    Their next project was the Universal Automatic Computer (UNIVAC)—the first commercial
    computer. The U.S. Census Bureau became the first customer to use it, but the
    UNIVAC became known worldwide when it correctly predicted that Dwight D. Eisenhower
    would defeat Adlai Stevenson in the 1952 U.S. presidential election.


    Kathy Kleiman, founder of ENIACmers Project'
  md: '

    ## Female Mathematicians Wanted


    Many women who attended college during this time period majored in math. And most
    became teachers. That would probably have been Jean''s path as well, except that
    her calculus teacher showed her a flyer.


    Wanted: Women with Degrees in Mathematics


    The University of Pennsylvania was looking for female mathematicians. The women
    would work as “computers,” doing a lot of the math that was required at the department.


    Jean applied and was accepted. She left on a midnight train, arriving 40 hours
    later in Pennsylvania. She was 20 years old. It was the first time she had ever
    been out of Missouri!


    At work, Jean sat in a large room with almost 100 other women.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_57_0.png)


    ## Gutsy Girls Go for Science: Programmers


    Pads of paper and desktop adding machines with cranks lay on the desks. Their
    job? Calculating trajectory tables for the Army.


    Back then, missile accuracy was poor. It depended on many things, including humidity,
    the curve of the earth, and geography. All of these things could be accounted
    for with math, but the equations were complex. It might take 12 hours for one
    person to complete one equation! And it took about a month for a single ballistics
    table to be completed, even though the women worked as efficiently as they could.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_58_0.png)


    # THE ENIAC WOMEN

    UNSUNG HEROES


    50


    ## CODING IN WARTIME: JOAN CLARKE


    Joan Clarke (1917-1996) was a codebreaker who played a critical role in cracking
    the codes of Nazi Germany. This saved countless lives in Great Britain during
    World War II. Joan was recruited in 1939 by the British government because of
    her work in mathematics at Cambridge. She and others worked on the Colossus at
    Bletchley Park, which is now a museum. Take a look!


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_59_0.png)


    Women with the Colossus


    ## Connect ............................ Bletchley Park


    A few months after Jean started her job, a memo came out stating there were six
    openings to work on a new machine at the University of Pennsylvania''s Moore School
    of Engineering.


    Jean was getting a little bored with her job, so she applied. During her interview,
    she was asked what she knew about electricity. What they really wanted to know
    was whether she was scared of electricity. She said she wasn''t and was hired.


    Gutsy Girls Go for Science: Programmers


    So were five other women: Marilyn Wescoff, Ruth Lichterman, Betty Snyder, Frances
    Bilas, and Kay McNulty. They came from different backgrounds and cultures. What
    did they have in common? Math.


    ## Introducing ENIAC


    Physicist John Mauchly (1907–1980) had thought up an all-electronic calculating
    machine in 1942. He correctly believed that it would run faster without mechanical
    parts. And in wartime, speed was critical. ENIAC was the result, built between
    1943 to 1945.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_60_0.png)


    Once the machine built, it needed to be programmed. The men who''d built it believed
    that the programming wasn''t as important. The six women who''d been hired were
    called the “ENIAC girls.” They received $2,000 a year, plus a $400 bonus for working
    Saturdays.


    The women were sent to an Army facility to learn how to use IBM punch cards and
    wire up control panels. They returned to the University of Pennsylvania six weeks
    later.


    > The ENIAC programmers often worked in teams.


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_61_0.png)


    ## Gutsy Girls Go for Science: Programmers


    ### ENIAC PROGRAMMERS PROJECT


    Attorney Kathy Kleiman first learned about the ENIAC programmers when she was
    a student at Harvard University. She wrote papers on female "computers" of the
    mid-twentieth century. When ENIAC''s 50th anniversary was announced, Kathy learned
    that the original ENIAC programmers weren''t invited to the celebration. She created
    the ENIAC Programmers Project to tell their stories. Kathy recorded oral histories
    and pushed for recognition for their accomplishments. She continues to speak about
    diversity in computer programming. Listen to Kathy Kleiman speak about women in
    computer programming history in her TEDx Talk.


    Kathy Kleiman TED


    At first, the women weren''t even allowed to see ENIAC. They didn''t have security
    clearance. Instead, they were given wiring diagrams, blueprints, and charts! That''s
    how they were supposed to figure out how to program ENIAC.


    Finally, they were allowed to work with the machine in the 1,500-square-foot room
    where ENIAC lived. The 30-ton monster was 9 feet high and covered three sides
    of the room. It included 6,000 switches, 1,500 relays, and 18,000 vacuum tubes.
    And it could calculate...


    ## Programming ENIAC


    Soon, the women knew the machine better than the engineers. Programming ENIAC
    meant breaking big problems into small steps.


    The women worked most of the night to keep ENIAC running. Jean, Betty, and Kay
    continued to work with the men who built ENIAC, turning their focus to a new computer
    called the Binary Automatic Computer, or BINAC. Later, Grace Hopper worked for
    the same company that built BINAC.


    Their next project was the Universal Automatic Computer (UNIVAC)—the first commercial
    computer. The U.S. Census Bureau became the first customer to use it, but the
    UNIVAC became known worldwide when it correctly predicted that Dwight D. Eisenhower
    would defeat Adlai Stevenson in the 1952 U.S. presidential election.


    # THE ENIAC WOMEN

    UNSUNG HEROES


    56

