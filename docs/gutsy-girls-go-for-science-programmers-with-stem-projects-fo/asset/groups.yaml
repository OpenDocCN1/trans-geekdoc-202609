    霍华德建造了那台巨大的计算机，被称为“自动序列控制计算器”（Automatic Sequence Controlled Calculator）。它更广为人知的
    Mark I，是军事早期计算机系列中的第一台。海军将用它来编写火箭轨道并解决工程问题。


    格蕾斯立即投入了工作。她获得了一本用于 Mark I 的指令代码笔记本。她晚上学习研究蓝图。她学会了如何与机器通信，让它执行她的意愿。


    格蕾斯是第三个为 Mark I 编程的人，并很快成为了首席程序员。她还参与了该计算机后续版本 Mark II 和 Mark III 的开发工作。她编写了第一本编程手册——一份
    500 页的手，介绍了 Mark I 的历史以及如何对其进行编程。


    1945年战争结束时，格蕾斯捕捉到了自己的第一个计算机“漏洞”（bug）！她决定留在哈佛大学的计算实验室。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_46_0.png)


    # 编程领袖


    几年后，格蕾斯清楚地意识到，哈佛大学不会给她终身教授职位，海军也不会给她正式的委任。这意味着她不能指望永远有一份工作。因此，她在1949年离开了哈佛大学，去一家私营公司工作。


    当格蕾斯开发出第一个计算机语言编译器时，她将其发送给其他程序员以征求意见。


    另一个编译器的工作催生了至今仍在使用的编程语言。它被称为 COBOL，是第一个包含单词的广泛使用的计算机程序。它成为世界上最频繁使用的编程语言之一。


    格蕾斯参与了早期编程语言的开发。她知道编程是让计算机对非数学专业人士更易于使用的关键。如果计算机更容易使用，就会更多人使用它们。她与其他程序员分享代码和编程信息。


    > 格蕾斯相信合作会让编程变得更好，她经常与他人分享她的工作。你同意这种方法吗？竞争在计算机开发业务中处于什么位置？想知道为什么吗？


    格蕾斯意识到，计算机需要一个翻译器来将人类指令转换为计算机语言。这现在被称为编译器。


    # 勇敢的女孩追求科学：程序员


    ## 短暂的退休


    20世纪60年代，格蕾斯从海军预备役退休。这将是一段非常短暂的退休。1967年，海军邀请她回归，领导一个标准化编程语言的项目，以便所有人都能使用它们。


    格蕾斯的办公室里有一个时钟，它是逆时针运行而不是顺时针。这提醒她不要仅仅因为过去一直是如此做就那样去做。


    > 1983年，格蕾斯在白宫仪式上被升为准将军衔


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_48_0.png)


    五年后，她66岁了，已经过了许多人退休的年龄。她也过了许多人获得晋升的年龄。但美国国会通过特别投票将她升为上尉。后来她又被升为准将，最后是海军少将。


    当格蕾斯于1986年从海军退休时，距离她80岁生日只有几个月。她是全武装部队中服役最长的军官。她获得了美国国防部最高荣誉——卓越服务勋章。格蕾斯于1992年去世。


    > 格蕾斯有很多绰号。其中包括“神奇的格蕾斯”、“软件界的老妇”和“代码女王”。


    ![](img/66d6fea998f37bc7b306d3d7f72bd61a_49_0.png)


    > 如果你问我最对哪个成就感到自豪，答案是我年来培训过的所有年轻人；这比编写第一个编译器更重要。


