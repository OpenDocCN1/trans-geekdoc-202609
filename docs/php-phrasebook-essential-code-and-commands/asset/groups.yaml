  mdcn: "\n## 读取表单数据\n\n```\nfunction processData() {\n    global $HTTP_POST_VARS;\n\
    \    // now you may access $HTTP_POST_VARS\n}\n```\n\n然而，这些数组也可以被停用（PHP 5 起），使用此\
    \ php.ini 指令：\n`register_long_arrays = Off`\n\n因此，以下是今天在 PHP 中访问表单数据的唯一推荐方法：\n\
    \n- $_GET 用于 GET 数据\n- $_POST 用于 POST 数据\n- $_REQUEST 用于 POST、GET 和 cookie（不推荐）\n\
    \n这些数组的键是表单值的名称。$_* 数组是所谓的超全局数组——也就是说，你不需要使用 global 关键字将它们带入全局作用域；它们在函数内部已经可用。\n\
    \n当你决定使用哪个超全局数组（取决于表单的 method）后，访问表单数据很容易：$_GET[<formfieldname>] 或 $_POST[<formfieldname>]\
    \ 会检索表单元素中的值。表 4.1 显示了针对每种表单字段类型返回的数据。\n\n## 表 4.1 $_GET/$_POST 中表单字段类型及返回的数据\n\
    \n| 表单字段类型 | 返回的数据 |\n|---|---|\n| 文本字段 | 字段中的文本 |\n| 密码字段 | 字段中的文本（明文，未加密） |\n\
    | 多行文本字段 | 字段中的文本 |\n| 隐藏字段 | 字段的 value 属性 |\n| 单选按钮 | 已选单选按钮的 value 属性 |\n| 复选框\
    \ | 若选中则为复选框的 value 属性（若未设置 value 则为 \"on\"） |\n| 选择列表 | 已选列表元素的 value 属性（若未设置\
    \ value 则为已选列表元素的标题） |\n| 多选列表 | 已选列表元素的 value 属性组成的数组（若未设置 value 则为已选列表元素的标题组成的数组）\
    \ |\n| 提交按钮 | 若使用此按钮发送表单，则为提交按钮的 value 属性（如果有多个提交按钮则很重要） |\n\n提示\n另外两种表单字段类型，图形化提交按钮和文件上传，将在本书后面专门介绍。\n\
    \n## 处理 \"Magic Quotes\"\n\n```\nif (get_magic_quotes_gpc()) {\n  $_GET = stripFormSlashes($_GET);\n\
    \  $_POST = stripFormSlashes($_POST);\n}\n```\n\n如果配置设置 magic_quotes 设置为 \"On\"\
    ，所有来自外部源的数据，包括表单数据和 cookie，都会得到特殊处理。所有引号字符，\" 和 '，都使用反斜杠字符（\\）进行转义。因此，如果用户在文本字段中输入\
    \ It's my life，则 $_GET 或 $_POST 中找到的值为 It\\'s my life。这最初是为了避免结构化查询语言（SQL）注入（有关更多详细信息，请参阅第\
    \ 8 章“使用 XML”），但对于经验丰富的程序员来说非常令人厌烦。唯一更令人厌烦的事情是手动为每个表单字段删除这些引号。\n\n```php\n<?php\n\
    \    function stripFormSlashes($arr) {\n        if (!is_array($arr)) {\n     \
    \       return stripslashes($arr);\n        } else {\n            return array_map('stripFormSlashes',\
    \ $arr);\n        }\n    }\n\n    if (get_magic_quotes_gpc()) {\n        $_GET\
    \  = stripFormSlashes($_GET);\n        $_POST = stripFormSlashes($_POST);\n  \
    \  }\n?>\n```\n\n*如果由 \"Magic Quotes\" 添加了反斜杠，则去除反斜杠（stripFormSlashes.inc.php）*\n\
    \nPHP 函数 stripslashes() 从字符串中删除转义反斜杠。然而，此函数只能在应用了“magic quotes”时调用；否则，它会破坏有意添加的反斜杠。你可以通过调用布尔函数\
    \ get_magic_quotes_gpc() 来确定“magic quotes”是否处于活动状态。如果返回 true，则可以删除所有斜杠。为了使其尽可能方便，\n\
    \n## 检查表单是否已提交\n\n你可以采用几种不同的方法来完成此任务；一种总是有效的方法是为提交按钮分配一个名称，然后测试在表单提交时此名称是否存在。\n\
    \n> 提示\n> 如果你的表单有多个提交按钮，请为每个按钮分配一个独特的名称；然后，你可以专门检查该名称，从而确定使用了哪个提交按钮。\n\n## 将表单数据保存到\
    \ Cookie 中\n\n```php\nsetcookie('formdata', serialize($formdata), time()+30*24*60*60);\n\
    ```\n\n表单提交后，数据必须去往某处，可能存入数据库（参见第 8 章），写入文件，或通过电子邮件发送。当网站包含多个相似的表单（例如，所有表单都要求用户提供姓名和联系信息）时，在用户填写后保存数据是个好主意。由于\
    \ HTTP 是无状态协议，你必须使用 cookie（参见第 6 章“在服务器文件系统上使用文件”）——会话是无用的，因为它们在用户关闭浏览器时过期。\n\n\
    ```php\nfunction setCookieData($arr) {\n    $formdata = getCookieData();\n   \
    \ if ($formdata == null) {\n        $formdata = array();\n    }\n    foreach ($arr\
    \ as $name => $value) {\n        $formdata[$name] = $value;\n    }\n    setcookie('formdata',\
    \ serialize($formdata),\n        time()+30*24*60*60);\n}\n```\n\n*将数据保存到 Cookie\
    \ 中（getFormData.inc.php；摘录）*\n\n由于用户代理每个域名只需保存 20 个 cookie，因此将表单信息存储在一个 cookie\
    \ 中作为数组是个好主意。然而，cookie 中只允许字符串值；这就是为什么你必须序列化数组。列表开头显示的函数将作为参数提供的数组的内容写入 cookie。\n\
    \n函数 getCookieData() 返回 cookie 中现有的（如果可用）数据并将其反序列化为数组。你将在后面的章节看到代码。\n\n剩下的唯一工作就是将所需的表单数据写入此数组。你可以专门提交某些值，或完整提交数组\
    \ $_GET 或 $_POST，如以下代码所示。\n\n```php\n<?php\n    require_once 'stripFormSlashes.inc.php';\n\
    \    require_once 'getFormData.inc.php';\n    if (isset($_POST['Submit'])) {\n\
    \        setCookieData($_POST);\n    }\n?>\n...\n<?php\n    if (isset($_POST['Submit']))\
    \ {\n        echo '<h1>Thank you for filling out this form!</h1>';\n    } else\
    \ {\n?>\n    <form method=\"post\" action=\"<?php echo\n        htmlspecialchars($_SERVER['PHP_SELF']);\
    \ ?>\">\n    ...\n    </form>\n<?php\n    }\n?>\n```\n\n*在 Cookie 中保存表单数据（save-cookie.php；摘录）*\n\
    \n图 4.2 显示了 resulting cookie。\n\n![](img/1e6d362f187af50011d2666ddaa68739_105_0.png)\n\
    \n图 4.2 序列化的表单数据保存在 cookie 中。\n\n注意\n请注意，你必须在任何 HTML 输出之前保存表单数据。由于 cookie 作为 HTTP\
    \ 头的一部分发送，它们必须在 HTML 开始之前声明（因此 HTTP 头结束）。有关 cookie 时间的更多信息，请参阅第 6 章。\n\n## 预填充文本字段和密码字段\n\
    \n```\n<input type=\"text\" name=\"textfieldname\"\nvalue=\"<?php\necho (isset($_POST['textfieldname']))\
    \ ?\nhtmlspecialchars($_POST['textfieldname']) : '';\n?>\" />\n```\n\n文本字段（以及密码字段和隐藏字段）中的值由其\
    \ value 属性提供。然而，那里的数据必须使用 htmlspecialchars() 正确编码，以去掉危险字符，如 ' 或 < 或 >。前面的代码片段期望表单提交回自身；因此，它从\
    \ $_POST 中提取文本字段的当前值（使用 $_GET 也会类似地工作）。\n\n```\n<?php\nrequire_once 'stripFormSlashes.inc.php';\n\
    ?>\n...\n<input type=\"text\" name=\"textfieldname\"\nvalue=\"<?php\necho (isset($_POST['textfieldname']))\
    \ ?\nhtmlspecialchars($_POST['textfieldname']) : '';\n?>\" />\n```\n\n*预填充文本字段（text.php；摘录）*\n\
