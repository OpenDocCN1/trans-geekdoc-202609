  md: "\n> TIP\n> You can replace the microtimestamp() function with the following\
    \ code:\n> \n> ```\n> function microtimestamp() {\n>     return microtime(true);\n\
    > }\n> ```\n> \n> The function microtime() returns a float value of the current\
    \ microtime, when the parameter true is provided (this was added in PHP 5). However,\
    \ this is reportedly slower than using gettimeofday(), which just executes the\
    \ underlying gettimeofday system call.\n\n## Create Self-updating Form Fields\
    \ for Date Selection\n\nThe code from the following section has one minor flaw:\
    \ The number of days per month is always from 1 to 31, even in months that have\
    \ less days. Using JavaScript, it is possible to write a fancy script that calculates\
    \ how many days the current month has and then updates the selection list.\n\n\
    ```php\n<?php\nif (isset($_POST['month']) && is_numeric($_POST['month']) &&\n\
    \    ((int)$_POST['month'] >= 1 &&\n(int)$_POST['month'] <= 12)) {\n    $month\
    \ = (int)$_POST['month'];\n} else {\n    $month = date('n');\n}\nif (isset($_POST['year'])\
    \ && is_numeric($_POST['year']) &&\n    ((int)$_POST['year'] >= 2005 &&\n(int)$_POST['year']\
    \ <= 2010)) {\n    $year = (int)$_POST['year'];\n} else {\n    $year = date('Y');\n\
    }\n?>\n<form method=\"post\" action=\"<?php echo\n    htmlspecialchars($_SERVER['PHP_SELF']);\
    \ ?>\">\n    <select name=\"day\"><?php\n    $maxdays = date('t', mktime(12, 0,\
    \ 0, $month, 1,\n        $year));\n    for ($i = 1; $i <= $maxdays; $i++) {\n\
    \        if (isset($_POST['day']) && $_POST['day'] ==\n            $i) {\n   \
    \         $sel = ' selected';\n        } elseif ($i == date('j')) {\n        \
    \    $sel = ' selected';\n        } else {\n            $sel = '';\n        }\n\
    \        echo \"<option value=\\\"$i\\\"$sel>$i</option>\\n\";\n    }\n?></select>\n\
    \    // ...\n</form>\n```\n\nThe Date Selection Updates Itself Automatically\n\
    (dateselection-js.php; excerpt)\n\n![](img/1e6d362f187af50011d2666ddaa68739_92_0.png)\n\
    \nFigure 3.4  The month names were automatically generated.\n\nHowever, it is\
    \ much more convenient to use a combination of JavaScript and PHP. Using JavaScript,\
    \ you automatically submit the form. Using PHP, you prefill the form fields (see\
    \ Chapter 4, “Interacting with Web Forms,” for more information about that) and,\
    \ more importantly, find out how many days the related year has.\n\nThe JavaScript\
    \ code is limited to a minimum: Selecting another month submits the HTML form\
    \ (as does selecting another year because leap years make February longer):\n\n\
    ```html\n<select name=\"month\" onchange=\"this.form.submit();\">\n...\n<select\
    \ name=\"year\" onchange=\"this.form.submit();\">\n```\n\nThe number of days per\
    \ month can be found using date('t'). The listing at the beginning of this section\
    \ contains the complete code for this, including some sanity checks for the information\
    \ transmitted. Also, the code automatically preselects the current date, unless\
    \ the user chooses something else. Figure 3.5 contains the output of the complete\
    \ code.\n\n## Calculating the Difference Between Two Dates\n\n```\n$century =\
    \ mktime(12, 0, 0, 1, 1, 2001);\n$today = time();\n$difference = $today - $century;\n\
    ```\n\nThe epoch value that can be determined by time() and other PHP functions\
    \ can be used to easily calculate the difference between two dates. The trick\
    \ is to convert the dates into time stamps (if not already available in this format).\
    \ Then the difference between these two time stamps is calculated. The result\
    \ is the time difference in seconds. This value can then be used to find out how\
    \ many minutes, hours, and days this corresponds to:\n\n- Divide the result by\
    \ 60 to get the number of minutes\n- Divide the result by 60 * 60 = 3600 to get\
    \ the number of hours\n- Divide the result by 60 * 60 * 24 = 86400 to get the\
    \ number of days\n\n```php\n<?php\n$century = mktime(12, 0, 0, 1, 1, 2001);\n\
    $today = time();\n$difference = $today - $century;\necho 'This century started\
    \ ';\necho floor($difference / 86400);\n$difference -= 86400 * floor($difference\
    \ / 86400);\necho ' days, ';\necho floor($difference / 3600);\n$difference -=\
    \ 3600 * floor($difference / 3600);\necho ' hours, ';\necho floor($difference\
    \ / 60);\n$difference -= 60 * floor($difference / 60);\necho \" minutes, and $difference\
    \ seconds ago.\";\n?>\n```\n\nThe Difference Between Two Dates (timediff.php)\n\
    \n![](img/1e6d362f187af50011d2666ddaa68739_94_0.png)\n\nFigure 3.5 The PHP code\
    \ filled the month selection list with the appropriate number of days.\n\nIf you\
    \ start with the number of days, round down each result and subtract this from\
    \ the result; you can also split up the difference into days, hours, and minutes.\n\
    \n## Using GMT Date/Time Information\n\nUsually, PHP takes the local settings\
    \ for time formats. However in some special cases, the GMT time format must be\
    \ used. For this, PHP offers “GMT-enabled” versions of some of its date/time functions:\n\
    \n- `gmdate()` works like `date()` and formats a date/time value; however, the\
    \ return value uses GMT format\n- `gmmktime()` creates a time stamp like `mktime()`;\
    \ however, it uses GMT\n- `gmstrftime()` formats a time as `strftime()` does;\
    \ however, it uses GMT\n\nGMT is important when it comes to setting a page’s expiry\
    \ date in an HTTP header or manually setting the expiry date of a cookie, also\
    \ in the HTTP header.\n\n## What Does PEAR Offer?\n\nThe following PEAR packages\
    \ offer functionality helpful for processing form data of any kind:\n\n- `Date`\
    \ contains a set of functions to work with various date/time values, including\
    \ conversions between time zones and various date/time representations\n- `Date_Holidays`\
    \ calculates the names and dates of special holidays\n\n## Interacting with Web\
    \ Forms\n\nHTML forms are one of the key ingredients of any dynamic website because\
    \ they can enable the users of a site to interact with it. Otherwise, websites\
    \ are more or less static: They may be driven by a database and, therefore, regularly\
    \ changing, but they look the same for each and every visitor. HTML forms can\
    \ change that; therefore, using data from forms from within PHP is very important.\n\
    \nReading the information in is a very easy task: For form data submitted via\
    \ GET (that is, in the Uniform Resource Identifier [URI] of the page requested),\
    \ the data can be found in $_GET[<value of name attribute of form field>]. However,\
    \ this is only the beginning. Suppose a user fills out a form but forgets one\
    \ field. Instead of presenting an error message and asking the user to click the\
    \ browser's Back button, the user can expect a form in which all fields are filled\
    \ in with the values that he previously provided. Many books neglect this; yet,\
    \ even worse, some books just do it wrong. You must not forget the special encoding\
    \ of the form field values; otherwise, the form is subject to Cross-Site Scripting\
    \ (XSS) attacks or, at least, could look ugly.\n\nFigure 4.1 demonstrates this:\
    \ You see two buttons with the same caption; however, only the first button’s\
    \ caption was encoded correctly in the HTML code.\n\n![](img/1e6d362f187af50011d2666ddaa68739_97_0.png)\n\
    \nFigure 4.1 Correct encoding of special characters is mandatory.\n\nOther important\
    \ topics of interest include Hypertext Transfer Protocol (HTTP) file uploads and\
    \ coping with the various settings in php.ini or elsewhere that might boycott\
    \ the good intentions of the developer.\n\n## Sending Form Data Back to the Current\
    \ Script\n\n```\n<form action=\"<?php echo htmlspecialchars($_SERVER['PHP_SELF']);\
    \ ?>\">\n</form>\n```\n\nAll relevant browsers send back form data to the current\
    \ page, if no action attribute is provided in the <form> element. However, the\
    \ HTML and the Extensible Hypertext Markup Language (XHTML) specifications both\
    \ state that action is a required attribute (marked as #REQUIRED in the Document\
    \ Type Definitions [DTDs]). The behavior of the user agent is undefined, as the\
    \ HTML specification at http://w3.org/TR/html4/interact/forms.html#def-action\
    \ explains. Therefore, it's a good idea to specifically provide the uniform resource\
    \ locator (URL) of the current script as the form's action. The code above does\
    \ this and also escapes special characters in $_SERVER['PHP_SELF'] for security\
    \ reasons.\n\n## Reading Out Form Data\n\nAt the beginning, reading out form data\
    \ was very easy: If the form field had the name attribute \"whatever\" or, in\
    \ newer versions of HTML/XHTML, the id attribute \"whatever\", PHP creates a variable\
    \ $whatever in the global scope. This is very convenient, but, from an architectural\
    \ point of view, is a bad idea. Therefore, this was disabled by default from PHP\
    \ version 4.2 onward, using the following php.ini directive:\n\n```\nregister_globals\
    \ = Off\n```\n\nSince PHP 3, the following global arrays existed for form data:\n\
    \n- $HTTP_GET_VARS—All data provided using GET\n- $HTTP_POST_VARS—All data provided\
    \ using POST\n- $HTTP_REQUEST_VARS—All data provided using GET or POST, or via\
    \ cookies (use not recommended)\n\nThese arrays are global; therefore, you have\
    \ to use the global keyword to uplevel them to global scope if you use them within\
    \ a function:\n"
  mdcn: "\n> 提示\n> 你可以用以下代码替换 microtimestamp() 函数：\n> \n> ```\n> function microtimestamp()\
    \ {\n>     return microtime(true);\n> }\n> ```\n> \n> microtime() 函数在提供参数 true\
