    \ 20 个 cookie 的限制。因此，尝试在单个 cookie 中保存多个数据是有意义的。为此，自然会想到使用数组。\n\n然而，cookie 的值只允许是字符串。因此，必须使用\
    \ serialize() 将数组转换为字符串，然后可以使用 unserialize() 将其转换回数组。\n\n```\n<?php\n    require_once\
    \ 'stripCookieSlashes.inc.php';\n\n    function setCookieData($arr) {\n      \
    \  $cookiedata = getAllCookieData();\n        if ($cookiedata == null) {\n   \
    \         $cookiedata = array();\n        }\n        foreach ($arr as $name =>\
    \ $value) {\n            $cookiedata[$name] = $value;\n        }\n        setcookie('cookiedata',\n\
    \            serialize($cookiedata),\n            time() + 30*24*60*60);\n   \
    \ }\n\n    function getAllCookieData() {\n        if (isset($_COOKIE['cookiedata']))\
    \ {\n            $formdata = $_COOKIE['cookiedata'];\n            if ($formdata\
    \ != '') {\n                return unserialize($formdata);\n            } else\
    \ {\n                return array();\n            }\n        } else {\n      \
    \      return null;\n        }\n    }\n\n    function getCookieData($name) {\n\
    \        $cookiedata = getAllCookieData();\n        if ($cookiedata != null &&\n\
    \            isset($cookiedata[$name])) {\n            return $cookiedata[$name];\n\
    \        }\n        return '';\n    }\n?>\n```\n\n*用于将多个值保存到一个 Cookie 中的辅助库（getCookieData.inc.php）*\n\
    \n为此，你可以编写一个库，它与上一章中用于将表单数据保存到 cookie 中的库非常相似。一个名为 cookiedata 的 cookie 以关联数组的形式包含所有值。函数\
    \ getCookieData() 返回一个特定的值，而 setCookieData() 接受一个数组并将其内容写入 cookie。前面的清单显示了这个库的完整代码。\n\
    \n下面的清单使用这个库来实现之前章节中的 cookie 测试。\n\n```\n<?php\n    require_once 'getCookieData.inc.php';\n\
    \n    if (isset($_GET['step']) && $_GET['step'] == '2')\n    {\n        $test\
    \ = (getCookieData('test') == 'ok') ?\n            'supports' : 'does not support';\n\
    \        echo \"Browser $test cookies.\";\n    } else {\n        setCookieData(array('test'\
    \ => 'ok'));\n        header(\"Location: \".$_SERVER['PHP_SELF'].\"?step=2\");\n\
    \    }\n?>\n```\n\n## 保存用户的语言偏好\n\n```\nsetcookie('Lang', $_SERVER['PHP_SELF'],\
    \ time() + 30*24*60*60, '/')\n```\n\n许多网页都是多语言的。此外，它们通常被组织为每个本地化部分都位于自己的目录中，类似于下面这种方法：\n\
    \n- 英语版本位于 en 目录中。\n- 西班牙语版本位于 es 目录中。\n- 法语版本位于 fr 目录中。\n\n你可以通过几种不同的方式检测用户的语言：\n\
    \n- 尝试将客户端的 IP 地址关联到地理区域\n- 通过读取 Accept-Language HTTP 头来确定用户偏好的语言\n- 直接询问用户\n\n\
    尽管所有这些方法在某种程度上都可行，但最后一种（或几种方法的组合）被认为是最用户友好的。因此，你确实需要一个提供指向所有三个版本链接的首页。这就是简单的 HTML，如下所示：\n\
    \n```\n<a href=\"en/index.php\">English version</a><br />\n<a href=\"es/index.php\"\
    >Versión español</a><br />\n<a href=\"fr/index.php\">Version française</a>\n```\n\
    \n*链接到各种语言版本的首页（multilingual.php；节选）*\n\n现在，每个语言目录都有一个特定语言的 index.php 文件。该文件包含了本部分开头清单中的代码。这段代码会检查是否已经存在语言\
    \ cookie。如果不存在，它会尝试使用当前路径（从 $_SERVER['PHP_SELF'] 获取）设置一个 cookie。\n\n```\n<?php\n\
    \  if (!isset($_COOKIE['lang']) ||\n      $_COOKIE['lang'] != $_SERVER['PHP_SELF'])\
    \ {\n    setcookie('lang', $_SERVER['PHP_SELF'],\n      time() + 30*24*60*60,\
    \ '/');\n  }\n?>\n```\n\n*将当前路径保存到 Cookie 中（saveLanguage.inc.php）*\n\n> 注意\n>\
    \ 将 cookie 的路径设置为 Web 服务器的根目录非常重要。否则，路径默认为当前路径，cookie 将自动仅在当前目录及其子目录中可读，而在首页上不可读。\n\
    \n最后，你必须在首页上检查 cookie 是否存在，如果存在，则将用户重定向到相应的页面。为此，必须将以下代码添加到 multilingual.php 页面的顶部。\n\
    \n```\n<?php\n    if (isset($_COOKIE['lang']) && $_COOKIE['lang'] != '' ) {\n\
    \        header(\"Location: \".$_COOKIE['lang']);\n    }\n?>\n```\n\n## 理解会话\n\
    \n最初，会话是指用户对网站的一次访问。用户点击一些链接，浏览几个页面，然后离开。这就定义了一个会话。或者换句话说：如果用户在一段时间内（例如 20 分钟）没有向网站请求任何数据，会话就会结束。\n\
    \nHTTP 没有任何会话机制；该协议是无状态的。不过，PHP 内置了会话支持，使得使用会话变得相当容易。\n\n创建会话后，PHP 会生成一个会话 ID，即一个标识该会话的长字符串。然后，PHP\
    \ 会为这个会话创建一个文件或数据库条目。接着，PHP 应用程序可以将数据存储在此会话中。这些数据随后会被写入会话文件或数据库（共享内存是另一种选择，但很少使用）。\n\
    \n因此，客户端和服务器之间必须传输的只有会话 ID。与会话相关的所有其他数据都驻留在服务器端。这样，敏感数据就不会被不必要地在网络上多次传输。\n\nPHP\
    \ 会话机制的配置完全在 php.ini 配置文件的 [session] 部分进行。默认设置可能不适用于所有应用程序，因此接下来的几个部分将介绍一些可能的配置。\n\
    \n## 在何处存储会话\n\n通常，会话数据存储在文件中。这些文件的位置由 php.ini 指令 session.save_path 设置。当然，该路径必须\
    \ (a) 存在，并且 (b) 对 PHP 进程（通常是 Web 服务器进程）可读可写。否则，会话信息将无法存储。\n\n然而，当你有大量用户和因此产生的大量会话时，PHP\
    \ 不应将所有会话文件放在一个目录中，因为这可能会导致严重的性能问题。以下语法允许 PHP 将会话数据移动到多个子目录中：\n\n```\nsession.save_path\
    \ = \"n;/tmp\"\n```\n\n这会在 /tmp 目录内创建深度不超过 n 级的子目录。但是，这些子目录必须存在，PHP 的会话机制才能写入其中；为此，在\
    \ ext/session 目录中有一个 shell 脚本 mod_files.sh。\n\n当然，只有 Web 服务器应被允许读取此目录；否则，系统中的其他用户可能能够读取可能包含敏感数据的会话信息。\n\
    \n## 如何维持会话状态\n\n会话 ID 必须在每个响应中发送到浏览器，而且——更重要的是——必须在每个请求中发送回服务器。\n\n最简单的方法是使用\
    \ cookie。然后，PHP 会向客户端发送一个名为 PHPSESSID 的 cookie（可以通过 session.name 指令更改）。然而，要实现这一点，必须设置以下\
    \ php.ini 指令：\n\n```\nsession.use_cookies = 1\n```\n\n然而，如果客户端不支持 cookie 该怎么办？这时，第二种机制就会发挥作用，即以下指令：\n\
    \n```\nsession.use_trans_sid = 0\n```\n\n然后，PHP 会自动回退到一种模式，在该模式下，会话 ID 会自动附加到所有\
    \ URL。这可能会带来一些潜在的安全风险（例如会话固定和会话劫持），但也非常实用。所有相关的电子商务网站都使用这种机制，例如亚马逊。如果\n\n"
