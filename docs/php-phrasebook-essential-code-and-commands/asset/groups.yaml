    \ Then, you include the code from this listing using `require_once` and then use\
    \ sessions as usual. In the background, PHP then saves all session information\
    \ in the database and not in the file system.\n\n```\n<?php\n$GLOBALS['sess_server']\
    \ = 'localhost';\n$GLOBALS['sess_db'] = 'sessions';\n$GLOBALS['sess_username']\
    \ = 'user';\n$GLOBALS['sess_password'] = 'pass';\n\nfunction sess_open() {\n \
    \   $GLOBALS['sess_mysqli'] = mysqli_connect(\n        $GLOBALS['sess_server'],\n\
    \        $GLOBALS['sess_username'],\n        $GLOBALS['sess_password']\n    );\n\
    ```\n"
  mdcn: "\n你访问他们的网站并加载一个页面，会话 ID 会自动附加到 URL 的末尾。\n\n要使用 `session.use_trans_sid`，PHP\
    \ 必须使用开关 `--enable-trans-sid` 编译，这对于 Windows 和 Mac OS X 二进制文件是自动完成的。\n\n另一个选项是只允许在\
    \ URL 中使用 cookie，而不是会话 ID。为此，你可以使用以下 php.ini 指令：\n\n```\nsession.use_only_cookies\
    \ = 1\n```\n\n> **注意**\n> URL 中的会话 ID 通常是不好的；因为人们可能会书签保存这些信息，一些搜索引擎将不会索引你的网站，等等。然而，每个电子商务网站（以及大多数其他网站）都必须考虑到一些访客（潜在客户！）只是不喜欢或不支持\
    \ cookie。在这里，会话提供了一种方便的方式来克服这一限制。\n\n## 激活会话\n\n### session_start()\n\n使用会话管理始终需要资源，因此会消耗性能。因此，会话必须被激活。因为\
    \ cookie 可能是其中的一部分，所以必须在任何 HTML 内容发送到客户端之前完成。这可以通过两种方式实现：\n\n- 使用 php.ini 指令 `session.auto_start\
    \ = 1` 全局激活会话。\n\n- 使用函数 `session_start()` 按脚本激活会话。\n\n从性能角度来看，后者是最佳选择。\n\n```\n\
    <?php\nsession_start();\necho 'Sessions activated.';\n?>\n```\n\n激活会话 (session_start.php)\n\
    \n## 读取和写入会话\n\n```\n<?php\nsession_start();\necho 'Sessions activated.<br />';\n\
    $_SESSION['version'] = phpversion();\necho 'Session data written.<br />';\necho\
    \ \"Session data read: {$_SESSION['version']}.\";\n?>\n```\n\n所有会话数据都可以通过 `$_SESSION`\
    \ 数组从 PHP 脚本访问。因为数据本身存储在服务器端，你可以写入会话数据并在下一个 PHP 语句中读取，而不需要像 cookie 那样进行服务器往返。只需记住先调用\
    \ `session_start()` 然后访问 `$_SESSION`。前面的列表创建了一个会话文件，如图 5.6 所示。\n\n![](img/1e6d362f187af50011d2666ddaa68739_158_0.png)\n\
    \n图 5.6 由列表 5.16 创建的会话文件的内容。\n\n## 关闭会话\n\n### session_destroy()\n\n在某些情况下，例如用户注销时，所有会话数据都应被删除，并且会话必须关闭。当然，可以使用\
    \ `foreach` 遍历 `$_SESSION` 然后将每个值设置为空字符串或 null，但有更快的方法：调用 `session_destroy()`。之后，当前会话中的所有数据将被销毁，正如函数名所暗示的那样。\n\
    \n```\n<?php\n    session_start();\n    echo 'Before: <pre>';\n    print_r($_SESSION);\n\
    \    echo '</pre>After: <pre> ';\n    session_destroy();\n    print_r($_SESSION);\n\
    \    echo '</pre>';\n?>\n```\n\n删除所有会话数据 (session_destroy.php)\n\n## 更改会话 ID\n\
    \n### session_regenerate_id()\n\n针对使用会话保护的网站的一种常见攻击是用户的会话 ID 以某种方式被窃取（例如，通过分析\
    \ HTTP 请求中的 HTTP_REFERER 条目），然后被用来冒充该特定用户。这很难防范，但一种方便的方法是每当发生“重要”事件时更改会话 ID，例如用户登录时。例如，亚马逊要求已通过\
    \ cookie 身份验证的用户在下单时再次登录。\n\n```\n<?php\nob_start();\nsession_start();\necho 'Old:\
    \ ' . session_id();\nsession_regenerate_id();\necho '<br />New: ' . session_id();\n\
    ob_end_flush();\n?>\n```\n\n*更改会话 ID (session_regenerate_id.php)*\n\n在这种情况下，函数\
    \ `session_regenerate_id()` 只是更改当前会话 ID，但保留所有数据不变。这在前面的代码中显示，其中使用 `session_id()`\
    \ 函数检索当前会话 ID（新旧皆是）。图 5.7 显示了此脚本的可能输出。\n\n> 此代码使用输出缓冲——`ob_start()` 和 `ob_end_flush()`——因为\
    \ `session_regenerate_id()` 也必须在任何 HTML 输出发送到客户端之前调用。\n\n![](img/1e6d362f187af50011d2666ddaa68739_160_0.png)\n\
    \n图 5.7 两个会话 ID，一个是旧的，一个是新的。\n\n## 创建动态、会话感知的链接\n\n```\n$sname = urlencode(session_name());\n\
    $id = urlencode(session_id());\necho \"<a href=\\\"page.php?$sname=$id\\\">dynamic\
    \ link</a>\";\n```\n\n使用 `session.use_trans_sid` 自动更新所有链接以包含会话 ID（如果需要）是件好事；然而，如果这些链接是由\
    \ PHP 动态生成的，则不起作用。然而，PHP 提供了两个函数，提供所需的所有信息：\n\n- `session_name()` 返回会话的名称。\n-\
    \ `session_id()` 返回当前会话的 ID。\n\n因此，前面的代码创建了一个包含此信息的动态链接，使程序员能够使动态链接具有会话感知能力。\n\
    \n此代码的一种潜在输出如下：\n\n```\n<a href=\"page.php?PHPSESSID=5b25b64843fad0d1afb4286cfe0ed448\"\
    >dynamic link</a>\n```\n\n> **提示**\n>\n> 当你使用 HTML 表单时，PHP 会自动将会话 ID 附加到表单的 `action`\
    \ 属性。然而，如果你想使用动态表单，可以向表单添加一个隐藏表单字段，包含会话信息：\n\n```\n<?php\n$name = htmlspecialchars(session_name());\n\
    $id = htmlspecialchars(session_id());\necho \"<input type=\\\"hidden\\\" name=\\\
    \"$name\\\" value=\\\"$id\\\" />\";\n?>\n```\n\n## 实现自定义会话管理\n\n```\nsession_set_save_handler(\n\
    'sess_open', 'sess_close', 'sess_read',\n'sess_write', 'sess_destroy', 'sess_gc');\n\
    ```\n\n不将会话数据存储在文件中有一些很好的理由。性能可能是一个问题，安全性是另一个问题。存储会话信息的一种替代方法是使用数据库。为此，你只需要一个名为\
    \ `sessiondata` 的数据库表，包含三列（名称可能有所不同，但必须在即将到来的列表中使用）：\n\n- 列 `id`（主键）类型为 `VARCHAR(32)`，包含会话\
    \ ID。\n- 列 `data` 类型为 `TEXT`，包含会话数据。\n- 列 `access` 类型为 `VARCHAR(14)`，包含对会话信息最近访问的时间戳。\n\
    \n使用哪种数据库并不重要。本书使用 MySQL 和 PHP 5 的新 `mysqli` 扩展；然而，将代码更改为适用于其他数据库也很简单（请参阅第 7 章，“Making\
    \ Data Dynamic”，了解有关使用 PHP 使用许多相关数据库的信息）。\n\nPHP 函数 `session_set_save_handler()`\
    \ 可用于为 PHP 内部使用的所有相关六个会话操作提供自定义函数：\n\n- 打开会话\n- 关闭会话\n- 读取会话变量\n- 写入会话变量\n- 销毁会话\n\
    - 清理（垃圾回收，例如从数据存储中删除旧会话数据）\n\n对于这六个操作，以下列表包含从 MySQL 数据源读取和写入会话数据的代码。你只需要 PHP 5\
    \ 并适当设置连接参数（服务器、用户名、密码）。然后，使用 `require_once` 包含此列表中的代码，然后像往常一样使用会话。在后台，PHP 然后将所有会话信息保存在数据库中，而不是文件系统中。\n\
    \n```\n<?php\n$GLOBALS['sess_server'] = 'localhost';\n$GLOBALS['sess_db'] = 'sessions';\n\
    $GLOBALS['sess_username'] = 'user';\n$GLOBALS['sess_password'] = 'pass';\n\nfunction\
    \ sess_open() {\n    $GLOBALS['sess_mysqli'] = mysqli_connect(\n        $GLOBALS['sess_server'],\n\
    \        $GLOBALS['sess_username'],\n        $GLOBALS['sess_password']\n    );\n\
    ```\n"
