    ```

    $result = mysqli_query(query);

    mysql_fetch_object($result);

    ```


    The return value of `mysql_query()` or `mysqli_query()` is a pointer to the actual
    resultset. It can be used to iterate through the complete list of entries returned
    by a SELECT statement. For this, these functions come in handy:


    +   - `mysql_fetch_assoc()` and `mysqli_fetch_assoc()` return the current row
    in the resultset as an associative array (field names become keys) and move farther
    to the next row.

    +   - `mysql_fetch_object()` and `mysqli_fetch_object()` return the current row
    in the resultset as an object (field names become properties) and move farther
    to the next row.

    +   - `mysql_fetch_row()` and `mysqli_fetch_row()` return the current row in the
    resultset as a numeric array and move farther to the next row.'
