    \n## Sorting Arrays Alphabetically\n\n```php\nsort($a, SORT_NUMERIC);\nsort($a,\
    \ SORT_STRING);\n```\n\nNumerical arrays can be sorted rather easily by using\
    \ `sort()`. However, a problem exists if the array contains both numerical and\
