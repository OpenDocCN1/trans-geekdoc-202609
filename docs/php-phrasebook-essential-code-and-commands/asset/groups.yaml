    \nFigure 2.1 Printing array contents with print_r()."
  - "[PAGE 48]\n\nTIP\nIf you set the second parameter of print_r() to true, the array's\
    \ contents are not sent to the client, but are returned from the function, so\
    \ that you can save this information in a variable and process it further.\n\n\
    However, the output of the preceding code is hardly usable for more than debugging\
    \ purposes (see Figure 2.1). Therefore, a clever way to access all data must be\
    \ found. A recursive function is a reasonable way to achieve this. In this, all\
    \ elements of an array are printed out; the whole output is indented using the\
    \ HTML element <blockquote>. If, however, the array element's value is an array\
    \ itself, the function calls itself recursively, which leads to an additional\
    \ level of indentation. Whether something is an array can be determined using\
    \ the PHP function is_array(). Using this, the following code can be assembled.\
    \ See Figure 2.2 for the result.\n\n```\n<?php\nfunction printNestedArray($a)\
    \ {\n    echo '<blockquote>';\n    foreach ($a as $key => $value) {\n        echo\
    \ htmlspecialchars(\"$key: \");\n        if (is_array($value)) {\n           \
    \ printNestedArray($value);\n        } else {\n            echo htmlspecialchars($value)\
    \ . '<br />';\n        }\n    }\n    echo '</blockquote>';\n}\n```"
  - "[PAGE 49]\n\n# Accessing All Array Elements in Nested Arrays\n\n```\n$arr = array(\n\
    \    'Roman' =>\n        array('one' => 'I', 'two' => 'II', 'three' =>\n     \
    \   'III', 'four' => 'IV'),\n    'Arabic' =>\n        array('one' => '1', 'two'\
    \ => '2', 'three' =>\n        '3', 'four' => '4')\n);\n\nprintNestedArray($arr);\n\
    ?>\n```\n\nPrinting a Nested Array Using a Recursive Function\n(printNestedArray.php)\n\
    \n![](img/1e6d362f187af50011d2666ddaa68739_49_0.png)\n\nFigure 2.2  Printing array\
    \ contents using a recursive function.\n\n# Turning an Array into Variables\n\n\
    ```\nwhile (list($key, $value) = each($a))\n```"
  - "[PAGE 50]\n\nWhenever each() is used, the use of list() is a good idea. Within\
    \ list(), you provide variable names for all values with numerical indices in\
    \ the array that is returned by each(). This makes while/each() loops even easier\
    \ to use, as the code shows. Within the parentheses, the variable names are provided.\n\
    \n```\n<?php\n$a = array('one' => 'I', 'two' => 'II', 'three' =>\n    'III', 'four'\
    \ => 'IV');\nwhile (list($key, $value) = each($a)) {\n    echo htmlspecialchars(\"\
    $key: $value\") . '<br\n/>';\n}\n?>\n```\n\n*Looping Through an Array with list()\
    \ and each() (each-list.php)*\n\n# TIP\n\nIf you are only interested in either\
    \ the key or the value of the array, you can remove one of the two variables;\
    \ just make sure that you keep the comma.\n\n```\nwhile (list(, $value) = each($a))\
    \ {\n    echo htmlspecialchars(\"$value\") .\n        '<br />';\n}\n```\n\n# Converting\
    \ Strings to Arrays\n\n```\n$a = explode(',', $csvdata);\n```\n\nSometimes, arrays\
    \ are not used to store information; instead, a string is used. The single values\
    \ are all within the string, but are separated by a special character. One example\
    \ for this is the comma separated values (CSV) format."
  - "[PAGE 51]\n\n# Converting Strings to Arrays\n\n```\n<?php\n  $csvdata = 'Sams\
    \ Publishing,800 East 96th Street,Indianapolis,Indiana,46240';\n  $a = explode(',',\
    \ $csvdata);\n  $info = print_r($a, true);\n  echo \"<pre>$info</pre>\";\n?>\n\
    ```\n\n*Turning a String into an Array (explode.php)*\n\nThe PHP function explode()\
    \ creates an array out of these values; you just have to provide the character(s)\
    \ at which the string needs to be split. The browser then shows this output:\n\
    \n```\nArray\n(\n    [0] => Sams Publishing\n    [1] => 800 East 96th Street\n\
    \    [2] => Indianapolis\n    [3] => Indiana\n    [4] => 46240\n)\n```\n\n# Converting\
    \ Arrays to Strings\n\n```\n$address = implode('<br />', $data);\n```\n\nThe way\
    \ back (that is, making a string representation out of the elements in an array)\
    \ can be done using implode(). Again, two parameters are required: the separation\
    \ elements, then the array. The order is quite unusual, yet important.\n\nSo,\
    \ PHP joins the elements of the array, using the <br /> HTML element. Therefore,\
    \ in the browser, each array’s elements stay at its own line."
  md: "\n## Working with Arrays\n- Successively adding values to an array using the\
    \ variable name and square brackets\n\n```\n$a[] = 'I';\n$a[] = 'II';\n$a[] =\
    \ 'III';\n$a[] = 'IV';\n```\n\nWhen using associative arrays, the same two methods\
    \ can be used; however, this time keys and values must be provided:\n\n```\n$a1\
    \ = array('one' => 'I', 'two' => 'II', 'three' =>\n    'III', 'four' => 'IV');\n\
    $a2['one'] = 'I';\n$a2['two'] = 'II';\n$a2['three'] = 'III';\n$a2['four'] = 'IV';\n\
    ```\n\nArrays can also be nested, when an array element itself is an array:\n\n\
    ```\n$a = array(\n    'Roman' =>\n        array('one' => 'I', 'two' => 'II', 'three'\
    \ =>\n            'III', 'four' => 'IV'),\n    'Arabic' =>\n        array('one'\
    \ => '1', 'two' => '2', 'three' =>\n            '3', 'four' => '4')\n);\n```\n\
    \nNow, the Arabic representation of the number four can be accessed using $a['Arabic']['four'].\n\
    \nOf course, arrays are not only created within a script, but can also come from\
    \ other sources, including from HTML forms (see Chapter 4, “Interacting with Web\
    \ Forms”) and from cookies and sessions (see Chapter 5, “Remembering Users (Cookies\
    \ and Sessions)”). But if the array is there, what’s next? The following phrases\
    \ give some pointers.\n\n## Accessing All Elements of Numerical Arrays\n\n```\n\
    array('I', 'II', 'III', 'IV');\n```\n\nLooping through numerical arrays can most\
    \ easily be done using foreach because in each iteration of the loop, the current\
    \ element in the array is automatically written in a variable.\n\n```\n<?php\n\
    $a = array('I', 'II', 'III', 'IV');\nforeach ($a as $element) {\n    echo htmlspecialchars($element)\
    \ . '<br />';\n}\n?>\n```\n\n*Looping Through an Array with foreach (foreach-n.php)*\n\
    \nAlternatively, a for loop can also be used. The first array element has the\
    \ index 0; the number of array indices can be retrieved using the count() function.\n\
    \n```\n<?php\n$a = array('I', 'II', 'III', 'IV');\nfor ($i = 0; $i < count($a);\
    \ $i++) {\n    echo htmlspecialchars($a[$i]) . '<br />';\n}\n?>\n```\n\n*Looping\
    \ Through an Array with for (for-n.php)*\n\nBoth ways are equally good (or bad);\
    \ though, usually, using foreach is the much more convenient way. However, there\
    \ is a third possibility: The PHP function\n\neach() returns the current element\
    \ in an array. The return value of each() is an array, in which you can access\
    \ the value using the numerical index 1, or the string index 'value'. Using a\
    \ while loop, the whole array can be traversed. The following code once again\
    \ prints all elements in the array, this time using each().\n\n```\n<?php\n$a\
    \ = array('I', 'II', 'III', 'IV');\nwhile ($element = each($a)) {\n    echo htmlspecialchars($element['value'])\
    \ .\n        '<br />'; //or: $element[1]\n}\n?>\n```\n\n*Looping Through an Array\
    \ with each() (each-n.php)*\n\nThe output of the three listings is always the\
    \ same, of course.\n\n## Accessing All Elements of Associative Arrays\n\n```\n\
    foreach ($array as $key => $value) {\n```\n\nWhen using an associative array and\
    \ wanting to access all data in it, the keys are also of relevance. For this,\
    \ the foreach loop must also provide a variable name for the element’s key, not\
    \ only for its value.\n\n```\n<?php\n$array = array('one' => 'I', 'two' => 'II',\
    \ 'three' => 'III', 'four' => 'IV');\nforeach ($array as $key => $value) {\n```\n\
    \n```\n<?php\nforeach ($array as $key => $value) {\n    echo htmlspecialchars(\"\
    $key: $value\") . '<br />';\n}\n?>\n```\n\n*Looping Through an Associative Array\
    \ with foreach (foreach-a.php)*\n\nUsing count() is possible: count() returns\
    \ the number of values in the array, not the number of elements. Looping through\
    \ all array elements with for is not feasible. However, the combination of each()\
    \ and while can be used, as can be seen in the following code. The important point\
    \ is that the key name can be retrieved either using the index 0 or the string\
    \ index 'key'.\n\n```\n<?php\n$a = array('one' => 'I', 'two' => 'II', 'three'\
    \ =>\n    'III', 'four' => 'IV');\nwhile ($element = each($a)) {\n    echo htmlspecialchars($element['key']\
    \ . ': ' .\n        $element['value']) . '<br />';\n    //or: $element[0] / $element[1]\n\
    }\n?>\n```\n\n*Looping Through an Array with each() (each-a.php)*\n\n## Accessing\
    \ All Array Elements in Nested Arrays\n\n```\n<?php\nprint_r($a);\n?>\n```\n\n\
    Nested arrays can be printed really easily by using print_r(). Take a look at\
    \ the output of the listing in Figure 2.1.\n\n```\n<pre>\n<?php\n$a = array(\n\
    \    'Roman' =>\n        array('one' => 'I', 'two' => 'II', 'three' =>\n     \
    \       'III', 'four' => 'IV'),\n    'Arabic' =>\n        array('one' => '1',\
    \ 'two' => '2', 'three' =>\n            '3', 'four' => '4')\n);\nprint_r($a);\n\
    ?>\n</pre>\n```\n\nPrinting a nested array with print_r() (print_r.php)\n\n![](img/1e6d362f187af50011d2666ddaa68739_47_0.png)\n\
    \nFigure 2.1 Printing array contents with print_r().\n\n### TIP\nIf you set the\
    \ second parameter of print_r() to true, the array's contents are not sent to\
    \ the client, but are returned from the function, so that you can save this information\
    \ in a variable and process it further.\n\nHowever, the output of the preceding\
    \ code is hardly usable for more than debugging purposes (see Figure 2.1). Therefore,\
    \ a clever way to access all data must be found. A recursive function is a reasonable\
    \ way to achieve this. In this, all elements of an array are printed out; the\
    \ whole output is indented using the HTML element <blockquote>. If, however, the\
    \ array element's value is an array itself, the function calls itself recursively,\
    \ which leads to an additional level of indentation. Whether something is an array\
    \ can be determined using the PHP function is_array(). Using this, the following\
    \ code can be assembled. See Figure 2.2 for the result.\n\n```\n<?php\nfunction\
    \ printNestedArray($a) {\n    echo '<blockquote>';\n    foreach ($a as $key =>\
    \ $value) {\n        echo htmlspecialchars(\"$key: \");\n        if (is_array($value))\
    \ {\n            printNestedArray($value);\n        } else {\n            echo\
    \ htmlspecialchars($value) . '<br />';\n        }\n    }\n    echo '</blockquote>';\n\
    }\n```\n\n```\n$arr = array(\n    'Roman' =>\n        array('one' => 'I', 'two'\
    \ => 'II', 'three' =>\n        'III', 'four' => 'IV'),\n    'Arabic' =>\n    \
    \    array('one' => '1', 'two' => '2', 'three' =>\n        '3', 'four' => '4')\n\
    );\n\nprintNestedArray($arr);\n?>\n```\n\nPrinting a Nested Array Using a Recursive\
    \ Function\n(printNestedArray.php)\n\n![](img/1e6d362f187af50011d2666ddaa68739_49_0.png)\n\
    \nFigure 2.2  Printing array contents using a recursive function.\n\n## Turning\
    \ an Array into Variables\n\n```\nwhile (list($key, $value) = each($a))\n```\n\
    \nWhenever each() is used, the use of list() is a good idea. Within list(), you\
    \ provide variable names for all values with numerical indices in the array that\
    \ is returned by each(). This makes while/each() loops even easier to use, as\
    \ the code shows. Within the parentheses, the variable names are provided.\n\n\
    ```\n<?php\n$a = array('one' => 'I', 'two' => 'II', 'three' =>\n    'III', 'four'\
    \ => 'IV');\nwhile (list($key, $value) = each($a)) {\n    echo htmlspecialchars(\"\
    $key: $value\") . '<br />';\n}\n?>\n```\n\n*Looping Through an Array with list()\
    \ and each() (each-list.php)*\n\n### TIP\nIf you are only interested in either\
    \ the key or the value of the array, you can remove one of the two variables;\
    \ just make sure that you keep the comma.\n\n```\nwhile (list(, $value) = each($a))\
    \ {\n    echo htmlspecialchars(\"$value\") .\n        '<br />';\n}\n```\n\n##\
    \ Converting Strings to Arrays\n\n```\n$a = explode(',', $csvdata);\n```\n\nSometimes,\
    \ arrays are not used to store information; instead, a string is used. The single\
    \ values are all within the string, but are separated by a special character.\
    \ One example for this is the comma separated values (CSV) format.\n\n```\n<?php\n\
    \  $csvdata = 'Sams Publishing,800 East 96th Street,Indianapolis,Indiana,46240';\n\
    \  $a = explode(',', $csvdata);\n  $info = print_r($a, true);\n  echo \"<pre>$info</pre>\"\
    ;\n?>\n```\n\n*Turning a String into an Array (explode.php)*\n\nThe PHP function\
    \ explode() creates an array out of these values; you just have to provide the\
    \ character(s) at which the string needs to be split. The browser then shows this\
    \ output:\n\n```\nArray\n(\n    [0] => Sams Publishing\n    [1] => 800 East 96th\
    \ Street\n    [2] => Indianapolis\n    [3] => Indiana\n    [4] => 46240\n)\n```\n\
    \n## Converting Arrays to Strings\n\n```\n$address = implode('<br />', $data);\n\
    ```\n\nThe way back (that is, making a string representation out of the elements\
    \ in an array) can be done using implode(). Again, two parameters are required:\
    \ the separation elements, then the array. The order is quite unusual, yet important.\n\
    \nSo, PHP joins the elements of the array, using the <br /> HTML element. Therefore,\
    \ in the browser, each array’s elements stay at its own line.\n"
  mdcn: "\n## 使用数组\n- 连续使用变量名和方括号向数组添加值\n\n```\n$a[] = 'I';\n$a[] = 'II';\n$a[] =\
    \ 'III';\n$a[] = 'IV';\n```\n\n使用关联数组时，同样可以使用这两种方法；不过这次必须提供键和值：\n\n```\n$a1 =\
    \ array('one' => 'I', 'two' => 'II', 'three' =>\n    'III', 'four' => 'IV');\n\
    $a2['one'] = 'I';\n$a2['two'] = 'II';\n$a2['three'] = 'III';\n$a2['four'] = 'IV';\n\
    ```\n\n数组也可以嵌套，当数组元素本身就是一个数组时：\n\n```\n$a = array(\n    'Roman' =>\n        array('one'\
    \ => 'I', 'two' => 'II', 'three' =>\n            'III', 'four' => 'IV'),\n   \
    \ 'Arabic' =>\n        array('one' => '1', 'two' => '2', 'three' =>\n        \
    \    '3', 'four' => '4')\n);\n```\n\n现在，可以使用 $a['Arabic']['four'] 访问数字四的阿拉伯语表示。\n\
    \n当然，数组不仅可以在脚本中创建，还可以来自其他来源，包括来自 HTML 表单（参见第 4 章，“与 Web 表单交互”）以及 cookie 和会话（参见第\
    \ 5 章，“记住用户（Cookie 和会话）”）。但如果数组已经存在，下一步是什么？以下内容提供了一些提示。\n\n## 访问数值数组的所有元素\n\n\
    ```\narray('I', 'II', 'III', 'IV');\n```\n\n使用 foreach 遍历数值数组是最简单的方法，因为在循环的每次迭代中，数组中的当前元素会自动写入一个变量。\n\
    \n```\n<?php\n$a = array('I', 'II', 'III', 'IV');\nforeach ($a as $element) {\n\
    \    echo htmlspecialchars($element) . '<br />';\n}\n?>\n```\n\n*使用 foreach 遍历数组\
    \ (foreach-n.php)*\n\n另外，也可以使用 for 循环。第一个数组元素的索引为 0；可以使用 count() 函数获取数组索引的数量。\n\
    \n```\n<?php\n$a = array('I', 'II', 'III', 'IV');\nfor ($i = 0; $i < count($a);\
    \ $i++) {\n    echo htmlspecialchars($a[$i]) . '<br />';\n}\n?>\n```\n\n*使用 for\
    \ 遍历数组 (for-n.php)*\n\n两种方法都同样好（或不好）；不过，通常使用 foreach 要方便得多。然而还有第三种可能性：PHP 函数\n\
    \neach() 返回数组中的当前元素。each() 的返回值是一个数组，其中可以使用数值索引 1 或字符串索引 'value' 访问值。使用 while\
    \ 循环，可以遍历整个数组。以下代码再次打印数组中的所有元素，这次使用 each()。\n\n```\n<?php\n$a = array('I', 'II',\
    \ 'III', 'IV');\nwhile ($element = each($a)) {\n    echo htmlspecialchars($element['value'])\
    \ .\n        '<br />'; //or: $element[1]\n}\n?>\n```\n\n*使用 each() 遍历数组 (each-n.php)*\n\
    \n当然，这三个列表的输出始终相同。\n\n## 访问关联数组的所有元素\n\n```\nforeach ($array as $key => $value)\
    \ {\n```\n\n使用关联数组并希望访问其中的所有数据时，键也很重要。为此，foreach 循环必须为元素的键提供变量名，而不仅仅是其值。\n\n```\n\
    <?php\n$array = array('one' => 'I', 'two' => 'II', 'three' => 'III', 'four' =>\
    \ 'IV');\nforeach ($array as $key => $value) {\n```\n\n```\n<?php\nforeach ($array\
    \ as $key => $value) {\n    echo htmlspecialchars(\"$key: $value\") . '<br />';\n\
    }\n?>\n```\n\n*使用 foreach 遍历关联数组 (foreach-a.php)*\n\n使用 count() 是可行的：count() 返回数组中值的数量，而不是元素的数量。使用\
    \ for 遍历所有数组元素是不可行的。然而，可以使用 each() 和 while 的组合，如以下代码所示。重要的是，键名可以使用索引 0 或字符串索引\
    \ 'key' 获取。\n\n```\n<?php\n$a = array('one' => 'I', 'two' => 'II', 'three' =>\n\
    \    'III', 'four' => 'IV');\nwhile ($element = each($a)) {\n    echo htmlspecialchars($element['key']\
    \ . ': ' .\n        $element['value']) . '<br />';\n    //or: $element[0] / $element[1]\n\
    }\n?>\n```\n\n*使用 each() 遍历数组 (each-a.php)*\n\n## 访问嵌套数组中的所有数组元素\n\n```\n<?php\n\
    print_r($a);\n?>\n```\n\n使用 print_r() 可以非常轻松地打印嵌套数组。查看图 2.1 中列表的输出。\n\n```\n<pre>\n\
    <?php\n$a = array(\n    'Roman' =>\n        array('one' => 'I', 'two' => 'II',\
    \ 'three' =>\n            'III', 'four' => 'IV'),\n    'Arabic' =>\n        array('one'\
    \ => '1', 'two' => '2', 'three' =>\n            '3', 'four' => '4')\n);\nprint_r($a);\n\
    ?>\n</pre>\n```\n\n使用 print_r() 打印嵌套数组 (print_r.php)\n\n![](img/1e6d362f187af50011d2666ddaa68739_47_0.png)\n\
    \n图 2.1 使用 print_r() 打印数组内容。\n\n### 提示\n如果将 print_r() 的第二个参数设置为 true，数组的内容不会发送给客户端，而是从函数返回，这样你就可以将此信息保存到变量中并进一步处理。\n\
    \n然而，前述代码的输出几乎只能用于调试目的（参见图 2.1）。因此，必须找到一种巧妙的方式来访问所有数据。递归函数是一种合理的方法来实现这一点。在此，所有数组元素都会被打印出来；整个输出使用\
    \ HTML 元素 <blockquote> 进行缩进。然而，如果数组元素的值本身就是一个数组，函数会递归调用自身，从而导致额外的缩进级别。是否是一个数组可以使用\
    \ PHP 函数 is_array() 来确定。利用这一点，可以组装以下代码。结果请参见图 2.2。\n\n```\n<?php\nfunction printNestedArray($a)\
    \ {\n    echo '<blockquote>';\n    foreach ($a as $key => $value) {\n        echo\
    \ htmlspecialchars(\"$key: \");\n        if (is_array($value)) {\n           \
    \ printNestedArray($value);\n        } else {\n            echo htmlspecialchars($value)\
    \ . '<br />';\n        }\n    }\n    echo '</blockquote>';\n}\n```\n\n```\n$arr\
    \ = array(\n    'Roman' =>\n        array('one' => 'I', 'two' => 'II', 'three'\
    \ =>\n        'III', 'four' => 'IV'),\n    'Arabic' =>\n        array('one' =>\
    \ '1', 'two' => '2', 'three' =>\n        '3', 'four' => '4')\n);\n\nprintNestedArray($arr);\n\
    ?>\n```\n\n使用递归函数打印嵌套数组\n(printNestedArray.php)\n\n![](img/1e6d362f187af50011d2666ddaa68739_49_0.png)\n\
    \n图 2.2 使用递归函数打印数组内容。\n\n## 将数组转换为变量\n\n```\nwhile (list($key, $value) = each($a))\n\
    ```\n\n每当使用 each() 时，使用 list() 是一个好主意。在 list() 中，你为 each() 返回的数组中所有具有数值索引的值提供变量名。这使得\
    \ while/each() 循环更容易使用，正如代码所示。在括号内提供变量名。\n\n```\n<?php\n$a = array('one' => 'I',\
    \ 'two' => 'II', 'three' =>\n    'III', 'four' => 'IV');\nwhile (list($key, $value)\
    \ = each($a)) {\n    echo htmlspecialchars(\"$key: $value\") . '<br />';\n}\n\
    ?>\n```\n\n*使用 list() 和 each() 遍历数组 (each-list.php)*\n\n### 提示\n如果你只对数组的键或值感兴趣，可以删除其中一个变量；只要确保保留逗号。\n\
    \n```\nwhile (list(, $value) = each($a)) {\n    echo htmlspecialchars(\"$value\"\
    ) .\n        '<br />';\n}\n```\n\n## 将字符串转换为数组\n\n```\n$a = explode(',', $csvdata);\n\
    ```\n\n有时，并不使用数组来存储信息；而是使用字符串。单个值都包含在字符串中，但由特殊字符分隔。逗号分隔值（CSV）格式就是一个例子。\n\n```\n\
    <?php\n  $csvdata = 'Sams Publishing,800 East 96th Street,Indianapolis,Indiana,46240';\n\
    \  $a = explode(',', $csvdata);\n  $info = print_r($a, true);\n  echo \"<pre>$info</pre>\"\
    ;\n?>\n```\n\n*将字符串转换为数组 (explode.php)*\n\nPHP 函数 explode() 从这些值创建数组；你只需要提供字符串需要拆分的字符。浏览器然后显示此输出：\n\
    \n```\nArray\n(\n    [0] => Sams Publishing\n    [1] => 800 East 96th Street\n\
    \    [2] => Indianapolis\n    [3] => Indiana\n    [4] => 46240\n)\n```\n\n## 将数组转换为字符串\n\
    \n```\n$address = implode('<br />', $data);\n```\n\n回去的方式（即从数组中的元素制作字符串表示）可以使用\
    \ implode() 完成。同样需要两个参数：分隔元素，然后是数组。顺序相当不寻常，但很重要。\n\n因此，PHP 使用 <br /> HTML 元素连接数组的元素。因此，在浏览器中，每个数组的元素保持在自己的行上。\n"
