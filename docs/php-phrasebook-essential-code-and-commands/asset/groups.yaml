  md: "\n## Retrieving Results of a Query Via PDO\n\n## What Does PEAR Offer?\n\n\
    The following PEAR packages (among others) offer database abstraction layers and\
    \ other goodies for database access:\n\n- DB is the best-known database abstraction\
    \ layer in PEAR\n- DB_DataObject can create SQL from objects\n- DB_QueryTool offers\
    \ some help for building SQL queries\n- MDB and MDB2 are also feature-rich database\
    \ abstraction layers\n\n## Using XML\n\nAfter the hype, the Extensible Markup\
    \ Language (XML) is now really used almost everywhere. An application that receives\
    \ a lot of buzz is Web Services, a technology that is covered in detail in Chapter\
    \ 9, \"Communicating with Others.\" However, XML can be used elsewhere, as well.\
    \ It is a good format to store any kind of data.\n\nThe tasks behind using XML\
    \ are always the same: reading data from XML and writing data into it. So this\
    \ chapter focuses on these tasks and shows how to implement them.\n\nUnfortunately,\
    \ PHP 4’s XML support was somewhat limited. Some extensions did not prove to be\
    \ very stable. This changed drastically with PHP 5 and a revamped XML support.\
    \ Therefore, the main focus of this chapter is on PHP 4. In PHP 5.1, some new\
    \ features will be added that are already covered in this chapter.\n\nAs the sample\
    \ XML file and format in this chapter, the XML from the following code reuses\
    \ the quotes database example from the previous chapter. As you can see, <quotes>\
    \ is the root element, and each quote (including its author and the year the phrase\
    \ was coined) is contained in a <quote> element.\n\n```\n<?xml version=\"1.0\"\
    \ encoding=\"ISO-8859-1\" ?>\n<quotes>\n  <quote year=\"1991\">\n    <phrase>Hasta\
    \ la vista, baby!</phrase>\n    <author>Arnold Schwarzenegger</author>\n  </quote>\n\
    </quotes>\n```\n\n### The sample XML file (quotes.xml; excerpt)\n\n### Parsing\
    \ XML with SAX\n\n```\n$sax = xml_parser_create();\n```\n\nSAX is an approach\
    \ to parse XML documents, but not to validate them. The good thing is that you\
    \ can use it with both PHP 4 and PHP 5 with no changes. In PHP 4, the SAX parsing\
    \ is already available on all platforms, so no separate installation is necessary.\n\
    \n```\n<?php\n// ...\n$sax = xml_parser_create();\nxml_parser_set_option($sax,\
    \ XML_OPTION_CASE_FOLDING, false);\nxml_parser_set_option($sax, XML_OPTION_SKIP_WHITE,\
    \ true);\nxml_set_element_handler($sax, 'sax_start', 'sax_end');\nxml_set_character_data_handler($sax,\
    \ 'sax_cdata');\nxml_parse($sax, file_get_contents('quotes.xml'), true);\nxml_parser_free($sax);\n\
    ?>\n```\n\nYou create a SAX (Simple API for XML) parser using xml_parser_create().\
    \ This parser can look at an XML file and react upon various events. The following\
    \ three events are the most important ones:\n\n- Beginning of an element\n- End\
    \ of an element\n- CDATA blocks\n\nYou can then define handler functions for these\
    \ elements and use them to transform the XML into something else, for instance\
    \ Hypertext Markup Language (HTML). Listing 8.1 shows this and outputs the contents\
    \ of the XML file as a bulleted HTML list, as shown in Figure 8.1. The function\
    \ xml_set_element_handler() sets the handlers for the beginning and end of an\
    \ element, whereas xml_set_character_data_handler() sets the handler for CDATA\
    \ blocks. With xml_parser_set_option(), you can configure the handler, for instance\
    \ to ignore whitespace and to handle tag names as case sensitive (then tag names\
    \ are not converted into uppercase letters automatically). The following code\
    \ contains the code for the handler functions:\n\n```\nfunction sax_start($sax,\
    \ $tag, $attr) {\n    if ($tag == 'quotes') {\n        echo '<ul>';\n    } elseif\
    \ ($tag == 'quote') {\n        echo '<li>' . htmlspecialchars($attr['year']) .\n\
    \            ': ';\n    } elseif ($tag == 'phrase') {\n        echo '\"';\n  \
    \  } elseif ($tag == 'author') {\n        echo ' (';\n    }\n}\nfunction sax_end($sax,\
    \ $tag) {\n    if ($tag == 'quotes') {\n        echo '</ul>';\n    } elseif ($tag\
    \ == 'quote') {\n        echo '</li>';\n    } elseif ($tag == 'phrase') {\n  \
    \      echo '\"';\n    } elseif ($tag == 'author') {\n        echo ') ';\n   \
    \ }\n}\nfunction sax_cdata($sax, $data) {\n    echo htmlspecialchars($data);\n\
    }\n```\n\n![](img/1e6d362f187af50011d2666ddaa68739_249_0.png)\n\nFigure 8.1 HTML\
    \ created from XML.\n\nNOTE\n\nPHP 5.1 comes with XMLReader included by default.\
    \ This is a wrapper on libxml2 and mimics the application programming interface\
    \ (API) of the .NET component for reading XML, XmlTextReader. It is much faster\
    \ than SAX and just easier to use. As of this writing, it is not very stable yet,\
    \ but looks quite promising. Not part of the standard PHP 5.1 distribution, but\
    \ available in PECL, is the associated module XMLWriter that allows write access\
    \ to XML. More information about both modules is available in a presentation by\
    \ their author at http://php5.bitflux.org/xmloncrack/.\n\n## Using DOM in PHP\
    \ 4 to Read XML\n\n```\ndomxml_open_mem(file_get_contents('quotes.xml'))\n```\n\
    \nThe W3C's Document Object Model (DOM) defines a unified way to access elements\
    \ in an XML structure. Therefore, accessing elements in an HTML page using JavaScript's\
    \ DOM access and accessing elements in an XML file using PHP's DOM access are\
    \ quite similar.\n\n```\n<?php\n$dom =\ndomxml_open_mem(file_get_contents('quotes.xml'));\n\
    echo '<ul>';\nforeach ($dom->get_elements_by_tagname('quote') as\n    $element)\
    \ {\n    $attr = $element->attributes();\n    $year = htmlspecialchars($attr[0]->value);\n\
    \    foreach ($element->child_nodes() as $e) {\n        if (isset($e->tagname))\
    \ {\n            if ($e->tagname == 'phrase') {\n                $node = $e->first_child();\n\
    \                $phrase = htmlspecialchars\n                    ($node->node_value());\n\
    \            } elseif ($e->tagname == 'author') {\n                $node = $e->first_child();\n\
    \                $author =\n                    htmlspecialchars($node->node_value());\n\
    \            }\n        }\n    }\n    echo \"<li>$author: \\\"$phrase\\\" ($year)</li>\"\
    ;\n}\necho '</ul>';\n?>\n```\n\nUnfortunately, if you use PHP 4, be aware that\
    \ the DOM access changed between versions and is not that stable on some systems.\
    \ Windows users have to use extension=php_domxml.dll in php.ini and may have to\
    \ copy iconv.dll in the Windows system32 folder. Other systems have to reconfigure\
    \ PHP using --with-dom=/path/to/libxml. Then domxml_open_file() opens a file—using\
    \ the absolute path! A more portable way is to use domxml_open_mem that reads\
    \ in a string. The return value of both functions offers access to the two methods\
    \ get_elements_by_tagname() and get_element_by_id() that return all nodes with\
    \ a certain tag name or a specific element identified by its ID. Then each node\
    \ exposes some methods such as the following:\n\n- `first_child()`—First child\
    \ node\n- `last_child()`—Last child node\n- `next_sibling()`—Next node\n- `previous_sibling()`—Previous\
    \ node\n- `node_value()`—Value of the node\n\nThe preceding code uses DOM to access\
    \ all quotes in the XML file and outputs them.\n\n## Using DOM in PHP 5 to Read\
    \ XML\n\nIf you use PHP 5, the main advantage is that libxml2 is used, a much\
    \ better library than libxml. It is bundled with PHP, so no installation is required.\
    \ However, the API has changed drastically. First, you instantiate a DOMDocument\
    \ object, then you load() a file or loadXML() a string. All method names have\
    \ changed to studly caps, and all properties are real properties, not methods\
    \ like in PHP 4. The preceding code does the same as the code in the previous\
    \ example, but works under PHP 5.\n\n```\n<?php\n$dom = new DOMDocument();\n$dom->load('quotes.xml');\n\
    echo '<ul>';\nforeach ($dom->getElementsByTagname('quote') as\n    $element) {\n\
    \    $year = $element->getAttribute('year');\n    foreach (($element->childNodes)\
    \ as $e) {\n        if (is_a($e, 'DOMElement')) {\n            if ($e->tagName\
    \ == 'phrase') {\n                $phrase = htmlspecialchars($e->textContent);\n\
    \            } elseif ($e->tagName == 'author') {\n                $author = htmlspecialchars($e->textContent);\n\
    \            }\n        }\n    }\n    echo \"<li>$author: \\\"$phrase\\\" ($year)</li>\"\
    ;\n}\necho '</ul>';\n?>\n```\n\n*Parsing XML with DOM (dom-read5.php)*\n\nNote\
    \ that the listings use is_a() so that the tag names are only evaluated in nodes\
    \ of the type DOMElement. This is because whitespace is considered as a DOM node\
    \ (however, of type DOMText).\n"
  mdcn: "\n## 通过 PDO 检索查询结果\n\n## PEAR 提供了什么？\n\n以下是 PEAR 包（其中之一）提供数据库抽象层和其他数据库访问便利功能：\n\
    \n- DB 是 PEAR 中最知名的数据库抽象层\n- DB_DataObject 可以从对象创建 SQL\n- DB_QueryTool 在构建 SQL\
    \ 查询时提供一些帮助\n- MDB 和 MDB2 也是功能丰富的数据库抽象层\n\n## 使用 XML\n\n在炒作之后，可扩展标记语言（XML）现在几乎在任何地方都被真正使用。一个备受关注的应用是\
    \ Web Services，这项技术在第 9 章“与他人通信”中有详细介绍。然而，XML 也可以在其他地方使用。它是存储任何类型数据的良好格式。\n\n\
    使用 XML 背后的任务始终相同：从 XML 读取数据并向其中写入数据。因此，本章重点介绍这些任务并展示如何实现它们。\n\n不幸的是，PHP 4 的 XML\
    \ 支持有限。一些扩展证明并不十分稳定。随着 PHP 5 和重新设计的 XML 支持，这一情况发生了巨大变化。因此，本章的重点主要放在 PHP 4 上。在\
    \ PHP 5.1 中，将添加一些新功能，这些功能已在本章中介绍。\n\n作为本章中的示例 XML 文件和格式，以下代码中的 XML 重用了上一章中的 quotes\
    \ 数据库示例。如你所见，<quotes> 是根元素，每个引语（包括其作者和短语诞生的年份）都包含在 <quote> 元素中。\n\n```\n<?xml\
    \ version=\"1.0\" encoding=\"ISO-8859-1\" ?>\n<quotes>\n  <quote year=\"1991\"\
    >\n    <phrase>Hasta la vista, baby!</phrase>\n    <author>Arnold Schwarzenegger</author>\n\
    \  </quote>\n</quotes>\n```\n\n### 示例 XML 文件（quotes.xml；摘录）\n\n### 使用 SAX 解析 XML\n\
    \n```\n$sax = xml_parser_create();\n```\n\nSAX 是一种解析 XML 文档的方法，但不用于验证。好处是，你可以在\
    \ PHP 4 和 PHP 5 中使用它而无需更改。在 PHP 4 中，SAX 解析已在所有平台上可用，因此无需单独安装。\n\n```\n<?php\n\
    // ...\n$sax = xml_parser_create();\nxml_parser_set_option($sax, XML_OPTION_CASE_FOLDING,\
    \ false);\nxml_parser_set_option($sax, XML_OPTION_SKIP_WHITE, true);\nxml_set_element_handler($sax,\
    \ 'sax_start', 'sax_end');\nxml_set_character_data_handler($sax, 'sax_cdata');\n\
    xml_parse($sax, file_get_contents('quotes.xml'), true);\nxml_parser_free($sax);\n\
    ?>\n```\n\n你使用 xml_parser_create() 创建一个 SAX（XML 简单 API）解析器。该解析器可以查看 XML 文件并对各种事件做出反应。以下三个事件是最重要的：\n\
    \n- 元素的开始\n- 元素的结束\n- CDATA 块\n\n然后你可以为这些元素定义处理函数，并使用它们将 XML 转换为其他内容，例如超文本标记语言（HTML）。列表\
    \ 8.1 展示了这一点，并将 XML 文件的内容输出为项目符号 HTML 列表，如图 8.1 所示。函数 xml_set_element_handler()\
    \ 设置元素的开始和结束处理程序，而 xml_set_character_data_handler() 设置 CDATA 块的处理程序。使用 xml_parser_set_option()，你可以配置处理程序，例如忽略空白并将标签名作为区分大小写处理（然后标签名不会自动转换为大写字母）。以下代码包含处理函数代码：\n\
    \n```\nfunction sax_start($sax, $tag, $attr) {\n    if ($tag == 'quotes') {\n\
    \        echo '<ul>';\n    } elseif ($tag == 'quote') {\n        echo '<li>' .\
    \ htmlspecialchars($attr['year']) .\n            ': ';\n    } elseif ($tag ==\
    \ 'phrase') {\n        echo '\"';\n    } elseif ($tag == 'author') {\n       \
    \ echo ' (';\n    }\n}\nfunction sax_end($sax, $tag) {\n    if ($tag == 'quotes')\
    \ {\n        echo '</ul>';\n    } elseif ($tag == 'quote') {\n        echo '</li>';\n\
    \    } elseif ($tag == 'phrase') {\n        echo '\"';\n    } elseif ($tag ==\
    \ 'author') {\n        echo ') ';\n    }\n}\nfunction sax_cdata($sax, $data) {\n\
    \    echo htmlspecialchars($data);\n}\n```\n\n![](img/1e6d362f187af50011d2666ddaa68739_249_0.png)\n\
    \n图 8.1 从 XML 创建的 HTML。\n\n注意\n\nPHP 5.1 默认包含 XMLReader。它是对 libxml2 的包装，并模仿用于读取\
    \ XML 的 .NET 组件 XmlTextReader 的应用程序编程接口（API）。它比 SAX 快得多，而且更容易使用。截至本文撰写时，它还不是很稳定，但看起来很有前景。不是\
    \ PHP 5.1 标准发行版的一部分，但在 PECL 中可用的是关联模块 XMLWriter，它允许对 XML 进行写访问。有关这两个模块的更多信息可在其作者的演示文稿中找到，网址为\
    \ http://php5.bitflux.org/xmloncrack/。\n\n## 在 PHP 4 中使用 DOM 读取 XML\n\n```\ndomxml_open_mem(file_get_contents('quotes.xml'))\n\
    ```\n\nW3C 的文档对象模型（DOM）定义了访问 XML 结构中元素的一种统一方式。因此，使用 JavaScript 的 DOM 访问访问 HTML\
    \ 页面中的元素和使用 PHP 的 DOM 访问访问 XML 文件中的元素非常相似。\n\n```\n<?php\n$dom =\ndomxml_open_mem(file_get_contents('quotes.xml'));\n\
    echo '<ul>';\nforeach ($dom->get_elements_by_tagname('quote') as\n    $element)\
    \ {\n    $attr = $element->attributes();\n    $year = htmlspecialchars($attr[0]->value);\n\
    \    foreach ($element->child_nodes() as $e) {\n        if (isset($e->tagname))\
    \ {\n            if ($e->tagname == 'phrase') {\n                $node = $e->first_child();\n\
    \                $phrase = htmlspecialchars\n                    ($node->node_value());\n\
    \            } elseif ($e->tagname == 'author') {\n                $node = $e->first_child();\n\
    \                $author =\n                    htmlspecialchars($node->node_value());\n\
    \            }\n        }\n    }\n    echo \"<li>$author: \\\"$phrase\\\" ($year)</li>\"\
    ;\n}\necho '</ul>';\n?>\n```\n\n不幸的是，如果你使用 PHP 4，请注意 DOM 访问在版本之间发生了变化，并且在某些系统上并不稳定。Windows\
    \ 用户必须在 php.ini 中使用 extension=php_domxml.dll，并且可能需要将 iconv.dll 复制到 Windows system32\
    \ 文件夹中。其他系统必须使用 --with-dom=/path/to/libxml 重新配置 PHP。然后 domxml_open_file() 打开文件——使用绝对路径！更可移植的方法是使用读取字符串的\
    \ domxml_open_mem。这两个函数的返回值提供了对两个方法 get_elements_by_tagname() 和 get_element_by_id()\
    \ 的访问，它们返回具有特定标签名的所有节点或由其 ID 标识的特定元素。然后每个节点公开一些方法，如下所示：\n\n- `first_child()`—第一个子节点\n\
    - `last_child()`—最后一个子节点\n- `next_sibling()`—下一个节点\n- `previous_sibling()`—上一个节点\n\
    - `node_value()`—节点的值\n\n前面的代码使用 DOM 访问 XML 文件中的所有引语并输出它们。\n\n## 在 PHP 5 中使用 DOM\
    \ 读取 XML\n\n如果你使用 PHP 5，主要优势是使用了 libxml2，这是一个比 libxml 好得多的库。它捆绑在 PHP 中，因此无需安装。然而，API\
    \ 已发生巨大变化。首先，你实例化一个 DOMDocument 对象，然后 load() 一个文件或 loadXML() 一个字符串。所有方法名都已更改为驼峰式大小写，并且所有属性都是真正的属性，而不是像\
    \ PHP 4 中的方法。前面的代码与前一个示例中的代码做同样的事情，但可在 PHP 5 下运行。\n\n```\n<?php\n$dom = new DOMDocument();\n\
    $dom->load('quotes.xml');\necho '<ul>';\nforeach ($dom->getElementsByTagname('quote')\
    \ as\n    $element) {\n    $year = $element->getAttribute('year');\n    foreach\
    \ (($element->childNodes) as $e) {\n        if (is_a($e, 'DOMElement')) {\n  \
    \          if ($e->tagName == 'phrase') {\n                $phrase = htmlspecialchars($e->textContent);\n\
    \            } elseif ($e->tagName == 'author') {\n                $author = htmlspecialchars($e->textContent);\n\
    \            }\n        }\n    }\n    echo \"<li>$author: \\\"$phrase\\\" ($year)</li>\"\
    ;\n}\necho '</ul>';\n?>\n```\n\n*使用 DOM 解析 XML（dom-read5.php）*\n\n请注意，列表中使用 is_a()，以便仅在类型为\
    \ DOMElement 的节点中评估标签名。这是因为空白被视为一个 DOM 节点（不过类型为 DOMText）。\n"
