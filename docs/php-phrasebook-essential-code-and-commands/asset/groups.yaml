    \ '<b><br><i>');\n?>\n```\n\n*删除所有 HTML 标签 (strip_tags.php)*\n\n## 使用换行\n\n在 HTML\
    \ 中如何使用换行？很简单：使用 `<br />` HTML 元素。然而，如果数据中包含 `\\n` 或 `\\r\\n` 换行符怎么办？可能会想到搜索和替换；然而，使用内置的\
    \ PHP 函数 `nl2br()` 要容易得多。这会解析字符串并将所有换行符转换为 `<br />` 元素，如前面的脚本所示。\n\n```php\n<?php\n\
    \    $input = \"One\\nTwo\\r\\nThree\";\n    echo nl2br($input);\n?>\n```\n\n\
    输出 HTML：\n\n```html\nOne<br />\nTwo<br />\nThree\n```\n\n*在每个换行处添加 `<br />` 元素\
