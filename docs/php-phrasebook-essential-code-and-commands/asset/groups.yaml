    \ listings):\n\n- Column `id` (primary key) is of type `VARCHAR(32)` and contains\
    \ the session ID.\n- Column `data` is of type `TEXT` and contains the session\
    \ data.\n- Column `access` is of type `VARCHAR(14)` and contains the time stamp\
    \ of the most recent access to the session information.\n\nIt doesn’t matter which\
    \ database is used. This book uses MySQL and PHP 5’s new `mysqli` extension; however,\
    \ it is trivial to change the code to work with other databases, as well (see\
    \ Chapter 7, “Making Data Dynamic,” for information about using many relevant\
    \ databases with PHP).\n\nThe PHP function `session_set_save_handler()` can be\
    \ used to provide custom functions for all relevant six session operations PHP\
    \ uses internally:\n\n- Opening a session\n- Closing a session\n- Reading a session\
    \ variable\n- Writing a session variable\n- Destroying a session\n- Cleaning up\
    \ (garbage collection, for example removing old session data from the data store)\n\
    \nFor all these six operations, the following listing contains code that reads\
    \ and writes session data from and to a MySQL data source. You just need PHP 5\
