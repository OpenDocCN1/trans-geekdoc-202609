    \n$a = array(4, 1345, 31, 222);\nusort($a, 'compare');\necho implode(' < ', $a);\n\
    ```\n\n## 对任何内容进行排序\n\n如果你不想局限于 PHP 提供的标准排序功能，你可以编写自己的排序算法。内部，PHP 使用 Quicksort\
    \ 算法对数组中的值进行排序。为此，PHP 必须知道两个值是否相等；在后一种情况下，PHP 需要找出哪个值更大。因此，要实现自定义排序，只需要一个接受两个参数并返回的函数：\n\
    \n- 如果第一个参数小于第二个参数，则返回负值\n- 如果两个参数相等，则返回 0\n- 如果第二个参数小于第一个参数，则返回正值\n\n此函数的名称必须作为字符串传递给\
    \ usort()！其余工作由 PHP 完成，如代码所示。那里使用的比较函数是一种非常简单的数值排序方法。通过减去两个值，函数返回所需的值：如果第一个参数大于第二个参数，则返回正数，如果两个参数相等则返回\
    \ 0，否则返回负数。\n\n> **注意**\n> Quicksort 算法是排序元素最快的算法之一。对 n 个元素进行排序时，最多使用 n² 次比较；然而，平均只需要\
    \ n log n 次比较，使其非常快速。Quicksort 使用分而治之的策略：它将问题拆分为几个较小的子问题，可以递归解决。有关该算法的更多信息可在 http://en.wikipedia.org/wiki/Quicksort\
    \ 找到。\n\n## 使用外语进行排序\n\n对于这种特殊情况，PHP 没有特殊的排序方法；然而，你可以使用 strnatcmp() 来模拟此行为。其思想是为某些特殊字符定义新的顺序；在比较函数中，你然后使用它来确定哪个字符“更大”，哪个字符“更小”。\n\
    \n你首先需要一个可以对单个字符进行排序的函数：\n\n```php\nfunction compareChar($a, $b) {\n    $characters\
    \ = 'AAÀÁÄBCÇDEÉÈFGHIÌÍJKLMNOÒÖÓPQRSTUÙÜÚVWXYZ';\n    $characters .= 'aaàáäbcçdeèéfghiìíjklmnoòöópqrstuùüúvwxyz';\n\
    \    $pos_a = strpos($characters, $a);\n    $pos_b = strpos($characters, $b);\n\
    \    if ($pos_a === false) {\n        if ($pos_b === false) {\n            return\
    \ 0;\n        } else {\n            return 1;\n        }\n    } elseif ($pos_b\
    \ === false) {\n        return -1;\n    } else {\n        return $pos_a - $pos_b;\n\
    \    }\n}\n```\n\n然后，主排序函数逐字符调用 compareChar()，直到找到差异为止。如果没有找到差异，则较长的字符串被认为是“更大”的一个。如果两个字符串完全相同，则返回\
    \ 0。本段开头的代码展示了 compare 函数。该代码的结果如预期，Frans < Frédéric < Froni。\n"
