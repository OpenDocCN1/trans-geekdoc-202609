    \n函数 strftime() 接受一个格式字符串（date() 也是如此），其中接受大量特殊符号。表 3.2 包含完整列表。\n\n## 自动本地化日期\n\
    \n表 3.2 — `strftime()` 的格式化符号\n\n| Symbol | Description |\n|---|---|\n| `%a` |\
    \ 星期几（缩写） |\n| `%A` | 星期几 |\n| `%b` or `%h` | 月份（缩写） |\n| `%B` | 月份 |\n| `%c`\
    \ | 标准格式的日期和时间 |\n| `%C` | 世纪 |\n| `%d` | 月中的日（从 01 到 31） |\n| `%D` | 日期缩写格式（mm/dd/yy）\
    \ |\n| `%e` | 月中的日作为两字符字符串（从‘ 1’到‘31’） |\n| `%g` | 按周数计的年份，两位数 |\n| `%G` | 按周数计的年份，四位数\
