    # Creating a Web Service with PEAR::XML-RPC


    Several XML-RPC implementations are out there, but the one most widely used and
    also in active development is PEAR::XML-RPC, available at http://pear.php.net/package/XML_RPC/.
    It is a PEAR port of another XML-RPC library and adds some fixes that didn’t make
    it in the original distribution. You can install it with pear upgrade XML_RPC,
    to get the latest and greatest version.


    To provide such a Web Service, you have to instantiate the XML_RPC_Server class
    and provide some information about the service: which function to use, its description,
    and, of course, the signature (which parameter types are passed, which data type
    is returned). The preceding code contains this information for a simple “add two
    numbers” Web Service.'
