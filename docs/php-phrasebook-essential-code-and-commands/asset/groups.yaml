  - "[PAGE 47]\n\n# Accessing All Array Elements in Nested Arrays\n\n```\n<pre>\n\
    <?php\n$a = array(\n    'Roman' =>\n        array('one' => 'I', 'two' => 'II',\
    \ 'three' =>\n            'III', 'four' => 'IV'),\n    'Arabic' =>\n        array('one'\
