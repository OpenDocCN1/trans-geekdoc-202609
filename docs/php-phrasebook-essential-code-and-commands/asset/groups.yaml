    # Introduction


    While working on a concept, we found some differences between a language phrasebook
    and an IT phrasebook. For instance, a language phrasebook just contrasts the same
    sentence in two languages.


    However, this is not always helpful. What if you want to change the phrase a bit,
    for instance if you want an en vogue blow wave (an oxymoron, one might say)?


    So, we tried to create a concept that contains a lot of phrases, but all of them
    with good explanations so that it is easy to change the code and adapt it to one''s
    needs. This, of course, makes the “foreign language” portions of a phrase a bit
