    \ 系统调用。\n\n## 为日期选择创建自更新表单字段\n\n下一节中的代码有一个小缺陷：每月的天数始终从 1 到 31，即使在天数较少的月份也是如此。使用\
    \ JavaScript，可以编写一个花哨的脚本来计算当前月份有多少天，然后更新选择列表。\n\n```php\n<?php\nif (isset($_POST['month'])\
