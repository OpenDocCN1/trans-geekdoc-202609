    \ndate() 的行为如下：第一个参数中具有特殊含义的所有字符（例如，格式化符号）都会被适当的值替换。然而，其他字符保持不变。如果使用反斜杠字符（\\）转义一个字符，则会原样返回。因此，本段开头的代码显示了仅使用一次\
