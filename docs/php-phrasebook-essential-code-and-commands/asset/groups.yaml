    # Automatically Localizing Dates


    ```

    setlocale(LC_TIME, ''en_US'');

    echo strftime(''In (American) English: %c<br />'');

    ```


    The PHP function strftime() formats a date/time value according to the sytem''s
    locale, for example, to the web server''s local settings. Generally, the language
    of the system is automatically used. However, this can be overridden using setlocale().


    ```

    <?php

    setlocale(LC_TIME, ''en_US'');

    echo strftime(''In (American) English: %c<br />'');

    setlocale(LC_TIME, ''en_gb'');

    echo strftime(''In (British) English: %c<br />'');

    setlocale(LC_TIME, ''de_DE'');

    echo strftime(''Auf Deutsch: %c<br />'');

    setlocale(LC_TIME, ''fr_FR'');

    echo strftime(''En Français: %c'');

    ?>

    ```


    *Localizing Dates Using strftime() (strftime.php)*


    The function strftime() expects a format string (as does date()) in which it accepts
    a large number of special symbols. Table 3.2 contains a full list.'
