    error_reporting(E_ALL ^ E_NOTICE);\nrequire_once 'SOAP/Server.php';\n\n$soap =\
    \ new SOAP_Server;\n$service = new ServiceClass();\n$soap->addObjectMap($service,\
    \ 'urn:php-phrasebook-soapservice');\n```\n\n## Automatically Generating WSDL\
    \ with PEAR::SOAP\n\n```php\nif (isset($_SERVER['REQUEST_METHOD']) && $_SERVER['REQUEST_METHOD']\
    \ == 'POST') {\n$soap->service($HTTP_RAW_POST_DATA);\n} else {\nrequire_once 'SOAP/Disco.php';\n\
    $disco = new SOAP_DISCO_Server($soap, 'DiscoServer');\nif (isset($_SERVER['QUERY_STRING'])\
    \ && strpos($_SERVER['QUERY_STRING'], 'wsdl') === 0) {\nheader('Content-type:\
    \ text/xml');\necho $disco->getWSDL();\n}\n}\n\nclass ServiceClass {\n// ...\n\
    }\n```\n\n## Consuming a Web Service with PEAR::SOAP\n\nAfter the Web Service\
    \ is created and does offer WSDL generation, a proxy class is very easy to get,\
    \ thanks to PEAR::SOAP. Instantiate the SOAP_WSDL class with the WSDL description,\
    \ call getProxy(), and then use the proxy. This is very short but does quite a\
    \ lot of SOAP in the background.\n\n## Automatically Generating WSDL with PEAR::SOAP\n\
    \n```php\n<?php\n    error_reporting(E_ALL ^ E_NOTICE);\n    require_once 'SOAP/Client.php';\n\
    \n    $soap = new SOAP_WSDL('http://localhost/\n        wsdl-pear-server.php?wsdl');\n\
    \    $proxy = $soap->getProxy();\n    $result = $proxy->add(47, 11);\n    if (PEAR::isError($result))\
    \ {\n        echo $result->getMessage();\n    } else {\n        echo \"47 + 11\
    \ = $result\";\n    }\n?>\n```\n\nConsuming the Web Service with PEAR::SOAP (wsdl-pear-client.php)\n\
    \n## Creating a Web Service with PHP 5's SOAP Extension\n\nOne of the key features\
    \ of PHP 5 is the new SOAP extension. Because it is written in C, it is much faster\
    \ than anything that is coded in PHP alone. However, the extension is relatively\
    \ new, so there are still some hiccups and missing features. However, it works\
    \ well on many occasions.\n\nYou have to configure PHP with -enable-soap to use\
    \ the extension; Windows users have to add extension=php_soap.dll to their php.ini\
    \ configuration file. Then, the extension is available and writing a SOAP server\
    \ is quite easy.\n\nAgain, it’s a small number of steps: Instantiate the SoapServer\
    \ class, add your function with addFunction(), and, finally, call handle().\n\n\
    ## Creating a Web Service with PHP 5's SOAP Extension\n\n```php\n<?php\n$soap\
    \ = new SoapServer(null, array('uri' =>\n    'http://php.phrasebook.org/'));\n\
    $soap->addFunction('add');\n$soap->handle();\n\nfunction add($a, $b) {\n    return\
    \ $a + $b;\n}\n?>\n```\n\nA Web Service with PHP5-SOAP (soap-php5-server.php)\n\
    \nTIP\nPHP 5-SOAP originated as a PECL extension. So, it is also possible to use\
    \ this extension under PHP 4, just grab the code from CVS. However, no precompiled\
    \ Windows binaries are available at the moment, and chances are that there never\
    \ will be any.\n\n## Automatically Generating WSDL with PHP 5's SOAP Extension\n\
    \nThe greatest shortcoming of PHP5-SOAP is that there is no way to automatically\
    \ generate WSDL with it. This is not often mentioned; however, it does create\
    \ problems in real life. WSDL is so complicated that errors in the WSDL are hard\
    \ to see and even harder to find.\n\nHowever, you can create such a WSDL description\
    \ for a Web Service in several ways, most of which have been used in real-world\
    \ projects:\n\n- Use NuSOAP or PEAR::SOAP to create a similar service, just to\
    \ get the WSDL—just change the `<soap:address>` element\n- Use the class Ctrx_SOAP_AutoDiscover\
    \ (available at http://crtx.org/index.php?area=Main&page=CrtxSoapAutoDiscover)\n\
    - Use the Webservice Helper tool (available at http://www.jool.nl/new/index.php?file_id=1)\n\
    - Use the WSDL_Gen class (available at http://www.schlossnagle.org/~george/php/WSDL_Gen.tgz)\n\
    \nSo as you can see, WSDL support is being worked on, not as part of the SOAP\
    \ extension itself, but in the form of external projects. But hopes are that this\
    \ will change some day.\n\nIf you finally have a WSDL description of your service\
    \ (in the download archive, you will find a file AddService.wsdl that originated\
    \ from the PEAR::SOAP-generated WSDL), the code for the server must only be slightly\
    \ updated. The first parameter for the SoapServer instantiation receives the WSDL\
    \ URL; also, the method(s) of the Web Service must be\n"
