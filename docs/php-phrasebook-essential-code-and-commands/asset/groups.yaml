    \n```php\n<?php\nfunction sanitize($s) {\n    return htmlspecialchars($s);\n}\n\
    \n$a = array('harmless', '<bad>', '>>click here!<<');\n$a = array_map('sanitize',\
    \ $a);\necho implode(' ', $a);\n?>\n```\n\n*将htmlspecialchars()应用于数组的所有元素（array_map.php）*\n\
