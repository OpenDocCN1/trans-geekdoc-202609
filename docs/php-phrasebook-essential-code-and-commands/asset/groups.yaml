    每当表 3.2 中提到 *标准格式* 时，格式化符号会根据本地设置被替换为关联的值。前面的代码使用 `setlocale()` 多次更改区域设置，然后调用\
    \ `strftime()`。可以在图 3.1 中看到差异。还请看图 3.2，其中相同的脚本在 Windows 机器上执行。根据文档，大多数 `strftime()`\
    \ 也在 Windows 上工作，但在某些配置中更改区域设置似乎不起作用。因此，非常重要的是先测试系统是否支持本地化日期。\n\n## 自动本地化日期\n\n\
    ![](img/1e6d362f187af50011d2666ddaa68739_77_0.png)\n\n图 3.1  不同区域设置下的当前日期。\n\n\
