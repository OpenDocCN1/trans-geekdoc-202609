    \     mysqli_real_escape_string($GLOBALS['sess_mysqli'],\n            $id))\n\
    \    );\n    if ($row = mysqli_fetch_object($result)) {\n        $ret = $row->data;\n\
    \        mysqli_query(\n            $GLOBALS['sess_mysqli'],\n            sprintf('UPDATE\
