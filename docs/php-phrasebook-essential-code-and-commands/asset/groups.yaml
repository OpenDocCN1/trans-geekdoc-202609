    \n## 手动本地化日期\n\n如果你不能依赖 setlocale()，但仍想使用本地化日期和时间值，你必须自己进行翻译并将结果存储在数组中。然后，你可以使用\
    \ date() 检索有关日期的信息。这可作为你数组的索引。\n\n```\n<?php\n    $weekdays = array(\n       \
