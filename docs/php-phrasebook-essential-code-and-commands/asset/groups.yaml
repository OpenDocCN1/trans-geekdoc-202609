    \ |\n| `%S` | 秒（从 00 到 59） |\n| `%t` | 制表符（`\\t`） |\n| `%T` | 时间格式为 hh:ss:mm |\n\
    | `%u` | 星期几（从 1—星期一—到 7—星期日） |\n\n表 3.2 继续\n\n| Symbol | Description |\n|---|---|\n\
