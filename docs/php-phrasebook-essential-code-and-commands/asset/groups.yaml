    \ Way\n\n```\n<?php\n    echo 'US format: ' . date('m/d/Y<br />');\n    echo 'UK\
    \ format: ' . date('d/m/Y<br />');\n    echo 'German format: ' . date('d.m.Y<br\
    \ />');\n    echo 'International format: ' . date('Y-m-d');\n?>\n```\n\n## Using\
    \ the Current Date the U.S./U.K./European Way\n\nTo give you a short and convenient\
    \ reference, the preceding code contains several commonly used date formats. Depending\
    \ on where you are, the order in which day, month, and year are used might vary:\n\
    \n- In the United States, it’s (mostly) month, day, and year\n- In the United\
    \ Kingdom and the rest of Europe, it’s (mostly) day, month, and year\n- The international\
    \ standard date notation starts with the year and continues with month and day\n\
    \n> **NOTE**\n> The preceding code used a four-digit representation of the year\
    \ because this is nonambiguous. In practice, however, two-digit years are also\
    \ commonly used.\n\n## Formatting a Specific Date\n\n```\necho 'Time stamp: '\
    \ . mktime(12, 0, 0, 1, 1, 2001);\n```\n\nAll previous phrases in this chapter\
    \ have used the current date and time. However, it is also possible to use any\
    \ other arbitrary date and time value. For this, the relevant functions (especially\
    \ date() and strftime()) accept a second parameter—a time stamp of the date to\
    \ be analyzed. This time stamp is an integer value, the date and time in the so-called\
    \ epoch format. This is the number of seconds that passed since January 1st, 1970,\
    \ midnight GMT—the beginning of the UNIX epoch. The time stamp/epoch value of\
    \ the current moment can be retrieved using time() or by calling date('U') (see\
    \ Table 3.1).\n\n## Formatting a Specific Date\n\nIf you want to use another date,\
    \ mktime() comes into play. This function converts a date provided by year, month,\
    \ day, hour, minute, and second into an epoch value. Probably the strangest thing\
    \ about this function is the order in which these parameters are passed:\n\n-\
    \ 1. Hour\n- 2. Minute\n- 3. Second\n- 4. Month\n- 5. Day\n- 6. Year\n\nYou can\
    \ also provide an optional seventh parameter, regardless of whether it is Daylight\
    \ Savings Time (DST). This is relevant close to the change from or to DST because\
    \ that does not happen at the same time over the world.\n\nThe preceding code\
    \ calculates the time stamp for noon on the first day of this millennium. Because\
    \ there was no year 0, this was January 1st, 2001.\n\n> If you love collecting\
    \ useless facts: On September 9, 2001, at precisely 3:46:40 a.m., the time stamp\
    \ was 1,000,000,000. Therefore, mktime(3, 46, 40, 9, 9, 2001) returns 1000000000\
    \ (if your time zone is Central Europe).\n"
