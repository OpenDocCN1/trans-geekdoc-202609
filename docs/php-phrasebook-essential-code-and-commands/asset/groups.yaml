    \ 和 `$1$9S3.c/3.$5101Bm4v3cnBN0b1AECi1..`，但本示例坚持使用第一个）。检查某个值是否对应于调用 `crypt()`\
    \ 的结果可以通过再次调用 `crypt()` 来完成：`crypt($value, $encryptedValue)` 必须返回 `$encryptedValue`。\n\
