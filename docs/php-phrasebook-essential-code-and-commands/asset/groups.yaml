    \ For this to work, you have to download the FreeTDS library from http://www.freetds.org/\
    \ and install it after unpacking the distribution with this command:\n\n```\n\
    ./configure --prefix=/usr/local/tds --with-tdsver=4.2\nmake\nsudo make install\n\
    ```\n\nThen, reconfigure PHP with the switch --with-sybase=/usr/local/freetds.\n\
    \nFinally, you can connect to the server using mssql_connect() and select the\
    \ database to be used using mssql_select_db(), as the preceding listing shows.\n\
    \n```php\n<?php\n    if ($db = @mssql_connect('localhost', 'user',\n        'password'))\
    \ {\n        mssql_select_db('phrasebook');\n        echo 'Connected to the database.';\n\
    \        mssql_close($db);\n    } else {\n        echo 'Connection failed.';\n\
    \    }\n?>\n```\n\n*Connecting to MSSDE/MSDE (mssql_connect.php)*\n\nMSSQL/MSDE\
    \ supports two modes to authenticate users: SQL authentication and Windows authentication.\
    \ The latter one checks whether the current Windows user has sufficient rights\
    \ to access the database. In a controlled environment, this might be a better\
    \ idea than using username and password. However, you first have to find out which\
    \ user is used. For instance, Microsoft IIS web server software uses the Internet\
    \ guest account, that is, IUSR_<machinename>. Therefore, this user requires privileges\
    \ in the database.\n\nTo use Windows authentication—sometimes also called trusted\
    \ connection—you need the following php.ini directive:\n\n```\nmssql.secure_connection\
    \ = On\n```\n\n## Sending SQL to MSSQL\n\n### mssql_query()\n\nThe function mssql_query()\
    \ sends an SQL statement to the MSSQL/MSDE installation. Again, the parameter\
    \ order is a bit strange: first the SQL command, then the database handle. However,\
    \ as you saw in the previous listing in the call to mssql_select_db(), this information\
    \ can also be omitted—then, the last connection established is used automatically.\n\
    \nAnother important point is escaping special characters. In MSSQL/MSDE, single\
    \ quotes must not be escaped using a backslash, but double quotes are the way\
    \ to go:\n\n```\nINSERT INTO quotes (quote, author, year) VALUES ('Ain''t Misbehavin''',\
    \ 'Louis Armstrong', 1929)\n```\n\nTo achieve this, addslashes() can be used—however,\
    \ first, it has to be configured to behave so that MSSQL/MSDE-compatible strings\
    \ are returned:\n\n```\nini_set('magic_quotes_sybase', 'On');\n$author = addslashes($_POST['author']);\n\
    ```\n\n```php\n<?php\nif ($db = @mssql_connect('localhost', 'user', 'password'))\
    \ {\n    require_once 'stripFormSlashes.inc.php';\n    mssql_select_db('phrasebook',\
    \ $db);\n    ini_set('magic_quotes_sybase', 'On');\n    mssql_query(sprintf(\n\
    \        'INSERT INTO quotes (quote, author, year)\n        VALUES (\\'%s\\',\
    \ \\'%s\\', \\'%s\\')',\n        addslashes($_POST['quote']),\n        addslashes($_POST['author']),\n\
    \        intval($_POST['year']), $db);\n    echo 'Quote saved.';\n    mssql_close($db);\n\
    } else {\n    echo 'Connection failed.';\n}\n?>\n```\n\n*Sending SQL to MSSQL/MSDE\
    \ (mssql_execute.php; excerpt)*\n\nThe listing at the beginning of this phrase\
    \ sanitizes some form data and writes it to the (by now) well-known sample database.\n\
    \n## Retrieving Results of a Query to MSSQL\n\n```php\n$result = mssql_query();\n\
    mssql_fetch_assoc($result);\n```\n\nFinally, there is, of course, also a way to\
    \ retrieve all data in the resultset. A while loop comes into play, using one\
    \ of these functions:\n\n- mssql_fetch_assoc() returns the current row in the\
    \ resultset as an associative array\n- mssql_fetch_object() returns the current\
    \ row in the resultset as an object\n- mssql_fetch_row() returns the current row\
    \ in the resultset as a numeric array\n"
