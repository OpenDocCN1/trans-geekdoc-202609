  md: "\n## Getting Rid of \"Magic Quotes\" in Cookies\n\nIf magic_quotes is set,\
    \ stripslashes() is applied recursively to all data in $_COOKIE.\n\n```php\n<?php\n\
    function stripCookieSlashes($arr) {\n    if (!is_array($arr)) {\n        return\
    \ stripslashes($arr);\n    } else {\n        return array_map('stripCookieSlashes',\
    \ $arr);\n    }\n}\n\nif (get_magic_quotes_gpc()) {\n    $_COOKIE = stripCookieSlashes($_COOKIE);\n\
    }\n?>\n```\n\n*Removing \"Magic Quotes\" from Cookies (stripCookieSlashes.inc.php)*\n\
    \nThis file should then be included in all PHP scripts that read cookies, using\
    \ this statement:\n\n```\nrequire_once 'stripCookieSlashes.inc.php';\n```\n\n\
    ## Setting a (Reasonable) Expiry Date\n\nThe expiry date of a cookie is the third\
    \ parameter for setcookie(). It is an integer value; therefore, the epoch value\
    \ for a time stamp must be used. Chapter 3, “Date and Time,” contains quite a\
    \ lot of information on how to work with this type of information.\n\n```php\n\
    <?php\n    setcookie('version', phpversion(), time() +\n        21*24*60*60);\n\
    ?>\n```\nTried to send cookie.\n\n*Setting a Cookie with a Relative Expiry Date\
    \ (setcookie-expiry.php)*\n\nUsually, it is a good thing to set a relative expiry\
    \ date for a cookie (\"in three weeks\"), rather than an absolute date (\"end\
    \ of May 2006\"). If you use absolute dates, you might have to change your script\
    \ on a regular basis because the absolute expiry date might arrive soon. It is\
    \ also considered very unprofessional to set expiry dates that are in the very\
    \ distant future, for instance in the year 2030. The client that receives this\
    \ cookie will most certainly not be booted any more in that year.\n\nTherefore,\
    \ use a relative date. The PHP function time() retrieves the current epoch value;\
    \ then add to this the number of seconds you want the cookie to live. The code\
    \ at the beginning of this phrase sets a cookie that will exist for three weeks.\n\
    \n## Setting a Client-Specific Expiry Date\n\n```\nsetcookie('version', phpversion(),\n\
    \    $_GET['time'] + 21*24*60*60);\n```\n\nKeep in mind that the decision of when\
    \ a cookie expires is made on the client side, using the client time settings.\
    \ So, if the client has the wrong date (which is something you cannot control\
    \ from the server-side).\n\nYour cookies might expire sooner than you expect.\
    \ So, don’t try to set cookies that live for just one hour or so; small things\
    \ like DST could destroy your plan.\n\n```php\n<?php\nif (isset($_GET['time'])\
    \ && is_int($_GET['time']))\n{\n    setcookie('version', phpversion(),\n     \
    \   $_GET['time'] + 21*24*60*60);\n} else {\n    setcookie('version', phpversion(),\n\
    \        time() + 21*24*60*60);\n}\n?>\n```\nTried to send cookie.\n\n*Setting\
    \ a Cookie with a Specific Expiry Date (setcookie-specific.php)*\n\nHowever, with\
    \ a bit of JavaScript, it can be possible to avoid this trap. The code in the\
    \ following listing is client-side JavaScript code that determines the current\
    \ time (client-side!) as an epoch value and sends it to a server-side script,\
    \ setcookie-specific.php. The main difference between PHP’s time() function and\
    \ JavaScript’s getTime() method is that the latter returns the number of milliseconds\
    \ since January 1, 1970, whereas the former just works with the number of seconds.\
    \ So, the JavaScript value first has to be divided by 1,000 and rounded down.\n\
    \nThe code for this file can be seen at the beginning of this phrase: The transmitted\
    \ value is taken as the basis for the calculation of the relative cookie expiration\
    \ date.\n\n```html\n<script language=\"JavaScript\"\n    type=\"text/javascript\"\
    ><!--\n    var epoche = (new Date()).getTime();\n    epoche = Math.floor(epoche\
    \ / 1000);\n    location.replace(\"setcookie-specific.php?time=\" +\n        epoche);\n\
    //--></script>\n```\n\n## Deleting a Cookie\n\n```\nsetcookie('version', '', time()\
    \ - 10*365*24*60*60);\n```\n\nAn intuitive way to delete a cookie is to set its\
    \ value to an empty string. However, the cookie is still there, albeit without\
    \ a value. A better way is to additionally send a cookie with the same name again,\
    \ but provide an expiry date that is in the past. Again, incorrect local time\
    \ settings have to be taken into account, so use a really small expiry date, for\
    \ instance 10 years before today. This listing implements this and deletes the\
    \ version cookie that has been sent by the previous listings. Here, both methods\
    \ are combined: The cookie value is set to an empty string, and the expiry date\
    \ is in the past. Figure 5.4 shows the result: The browser tries to delete the\
    \ cookie by setting the expiry date to the desired time (which lies in the past,\
    \ so the cookie is gone).\n\n```php\n<?php\n    setcookie('version', '', time()\
    \ -\n        10*365*24*60*60);\n?>\n```\nTried to delete cookie.\n\nDeleting a\
    \ Cookie (deletecookie.php)\n\n![](img/1e6d362f187af50011d2666ddaa68739_145_0.png)\n\
    \nFigure 5.4 The cookie will be deleted (if the user accepts it).\n\nWARNING\n\
    If you try to set the expiration date to 0, PHP just skips this parameter, so\
    \ this does not work. You do have to provide a positive parameter, even if it's\
    \ 1.\n\n## Making Cookies Accessible for Several Domains\n\n```\nsetcookie('version',\
    \ phpversion(), 0, '.example.com');\n```\n\nOne part of the Set-Cookie header\
    \ sent by a server is the domain that has access to this cookie. If not sent specifically,\
    \ this value defaults to the domain that is sending the cookie. Setting this domain\
    \ to a completely different value, for example, the domain of an ad server (so-called\
    \ third-party cookies; used to try to generate a profile of the user), does not\
    \ always work because many browsers allow to specifically disable that. (See Figure\
    \ 5.5 for an example in the old Netscape 4.x browser that was already capable\
    \ of doing so.)\n\n```php\n<?php\n    setcookie('version', phpversion(), 0,\n\
    \        '.example.com');\n?>\n```\nTried to send cookie.\n\n*Setting the Domain\
    \ for a Cookie (setcookie-domain.php)*\n\n![](img/1e6d362f187af50011d2666ddaa68739_146_0.png)\n\
    \nFigure 5.5  Even Netscape 4.x allows you to block cookies that do not use the\
    \ originating domain.\n\nHowever, in some instances it is required that the cookies\
    \ work on several third-level domains or subdomains, for instance www.example.com,\
    \ store.example.com, and ssl.example.com. Examples for this are large websites\
    \ with many subdomains, such as Amazon and eBay. They require that all top-level\
    \ domains (TLDs) are supported. To achieve this, the domain of the cookie—fourth\
    \ parameter of setcookie()—has to be set. Here comes the trick:\n\nAll domain\
    \ names are valid, as long as they contain two dots. So, if you set the domain\
    \ to “.example.com”, all third-level domains of example.com have access to this\
    \ cookie. There is one “but”: Pages on http://example.com/ cannot access this\
    \ cookie. So, you might want to try to set the domain to “example.com”; however,\
    \ this does not conform with the specification and might not be supported with\
    \ all browsers.\n\n## Checking Whether the Client Supports Cookies\n\n```php\n\
    $test_temp = isset($_COOKIE['test_temp']) ?\n'supports' : 'does not support';\n\
    $test_persist = isset($_COOKIE['test_persist']) ?\n'supports' : 'does not support';\n\
    ```\n\nRemember the way cookies are sent: First, the server sends the cookie to\
    \ the client as part of the HTTP response. In the next request, the client sends\
    \ the cookie back if accepted. Therefore, calling setcookie() and then checking\
    \ the contents of $_COOKIE does not work. You have to wait for the next HTTP request.\n\
    \n```php\nif (isset($_GET['step']) && $_GET['step'] == '2')\n{\n$test_temp = isset($_COOKIE['test_temp'])\
    \ ?\n'supports' : 'does not support';\n$test_persist = isset($_COOKIE['test_persist'])\
    \ ?\n'supports' : 'does not support';\nsetcookie('test_temp', '', time() - 365*24*60*60);\n\
    setcookie('test_persist', '', time() - 365*24*60*60);\necho \"Browser $test_temp\
    \ temporary cookies.<br />\";\necho \"Browser $test_persist persistent cookies.\"\
    ;\n} else {\nsetcookie('test_temp', 'ok');\nsetcookie('test_persist', 'ok', time()\
    \ +\n14*24*60*60);\nheader(\"Location: \".$_SERVER['PHP_SELF'].\"?step=2\");\n\
    }\n?>\n```\n\n*Testing the Cookie Configuration of a Browser (cookietest.php)*\n\
    \nYou can, however, use header() to force the client to create a second request.\
    \ In the first request, you set the cookie; in the second request, you check whether\
    \ that worked.\n\nIn the previous code, two cookies are set, one temporary cookie\
    \ and one persistent cookie—because it is possible to configure some browsers\
    \ so that one kind of cookie is accepted, the other one is not. Then, the redirect\
    \ is done using header() and the Location: HTTP header, and the presence of the\
    \ cookie(s) is checked.\n\nOf course you should configure your browser to show\
    \ a message window when a cookie arrives; that makes debugging much easier.\n"
  mdcn: "\n## 去除 Cookie 中的“魔术引号”\n\n如果启用了 magic_quotes，则 stripslashes() 会递归应用于 $_COOKIE\
    \ 中的所有数据。\n\n```php\n<?php\nfunction stripCookieSlashes($arr) {\n    if (!is_array($arr))\
    \ {\n        return stripslashes($arr);\n    } else {\n        return array_map('stripCookieSlashes',\
    \ $arr);\n    }\n}\n\nif (get_magic_quotes_gpc()) {\n    $_COOKIE = stripCookieSlashes($_COOKIE);\n\
    }\n?>\n```\n\n*从 Cookie 中移除“魔术引号”（stripCookieSlashes.inc.php）*\n\n此文件随后应包含在读取\
    \ cookie 的所有 PHP 脚本中，使用以下语句：\n\n```\nrequire_once 'stripCookieSlashes.inc.php';\n\
    ```\n\n## 设置（合理的）过期日期\n\nCookie 的过期日期是 setcookie() 的第三个参数。它是一个整数值；因此必须使用时间戳的 epoch\
    \ 值。第 3 章“日期和时间”包含有关如何处理此类信息的大量信息。\n\n```php\n<?php\n    setcookie('version',\
    \ phpversion(), time() +\n        21*24*60*60);\n?>\n```\n尝试发送 cookie。\n\n*使用相对过期日期设置\
    \ Cookie（setcookie-expiry.php）*\n\n通常，为 cookie 设置相对过期日期（“三周后”）是一个好主意，而不是绝对日期（“2006\
    \ 年 5 月底”）。如果使用绝对日期，你可能需要定期更改脚本，因为绝对过期日期可能很快到来。将过期日期设置为遥远的未来，例如 2030 年，也被认为是非常不专业的。接收此\
    \ cookie 的客户端到那时很可能早已被淘汰。\n\n因此，使用相对日期。PHP 函数 time() 获取当前 epoch 值；然后加上你希望 cookie\
    \ 存活的秒数。本段开头的代码设置了一个将存在三周的 cookie。\n\n## 设置客户端特定的过期日期\n\n```\nsetcookie('version',\
    \ phpversion(),\n    $_GET['time'] + 21*24*60*60);\n```\n\n请记住，cookie 何时过期的决定是在客户端做出的，使用客户端的时间设置。因此，如果客户端的日期错误（这是服务器端无法控制的）。\n\
    \n你的 cookie 可能比你预期的更早过期。因此，不要尝试设置仅存活一小时左右的 cookie；像夏令时（DST）这样的小事就可能破坏你的计划。\n\n\
    ```php\n<?php\nif (isset($_GET['time']) && is_int($_GET['time']))\n{\n    setcookie('version',\
    \ phpversion(),\n        $_GET['time'] + 21*24*60*60);\n} else {\n    setcookie('version',\
    \ phpversion(),\n        time() + 21*24*60*60);\n}\n?>\n```\n尝试发送 cookie。\n\n\
    *使用特定过期日期设置 Cookie（setcookie-specific.php）*\n\n然而，通过一点 JavaScript，可以避免这个陷阱。以下列表中的代码是客户端\
    \ JavaScript 代码，它以 epoch 值确定当前时间（客户端！）并将其发送到服务器端脚本 setcookie-specific.php。PHP\
    \ 的 time() 函数与 JavaScript 的 getTime() 方法之间的主要区别在于，后者返回自 1970 年 1 月 1 日以来的毫秒数，而前者仅使用秒数。因此，JavaScript\
    \ 值首先必须除以 1,000 并向下取整。\n\n本段开头的代码可以查看此文件：传输的值被用作计算相对 cookie 过期日期的基础。\n\n```html\n\
    <script language=\"JavaScript\"\n    type=\"text/javascript\"><!--\n    var epoche\
    \ = (new Date()).getTime();\n    epoche = Math.floor(epoche / 1000);\n    location.replace(\"\
    setcookie-specific.php?time=\" +\n        epoche);\n//--></script>\n```\n\n##\
    \ 删除 Cookie\n\n```\nsetcookie('version', '', time() - 10*365*24*60*60);\n```\n\
    \n直观地删除 cookie 的方法是将其值设置为空字符串。然而，cookie 仍然存在，只是没有值。更好的方法是再次发送一个同名的 cookie，但提供一个在过去的过期日期。同样，必须考虑不正确的本地时间设置，因此使用一个非常小的过期日期，例如今天之前\
    \ 10 年。此列表实现了这一点并删除了之前列表中发送的 version cookie。在这里，两种方法结合使用：cookie 值被设置为空字符串，并且过期日期在过去。图\
    \ 5.4 显示了结果：浏览器尝试通过将过期日期设置为期望时间（该时间在过去，因此 cookie 已消失）来删除 cookie。\n\n```php\n<?php\n\
    \    setcookie('version', '', time() -\n        10*365*24*60*60);\n?>\n```\n尝试删除\
    \ cookie。\n\n删除 Cookie（deletecookie.php）\n\n![](img/1e6d362f187af50011d2666ddaa68739_145_0.png)\n\
    \n图 5.4 cookie 将被删除（如果用户接受）。\n\n警告\n如果尝试将过期日期设置为 0，PHP 只是跳过此参数，因此不起作用。你必须提供一个正参数，即使是\
    \ 1。\n\n## 使 Cookie 可供多个域访问\n\n```\nsetcookie('version', phpversion(), 0, '.example.com');\n\
    ```\n\n服务器发送的 Set-Cookie 头的一部分是有权访问此 cookie 的域。如果未明确发送，此值默认为发送 cookie 的域。将此域设置为完全不同的值，例如广告服务器的域（所谓的第三方\
    \ cookie；用于尝试生成用户画像），并不总是有效，因为许多浏览器允许专门禁用该功能。（参见图 5.5，了解旧版 Netscape 4.x 浏览器的示例，该浏览器已具备此功能。）\n\
    \n```php\n<?php\n    setcookie('version', phpversion(), 0,\n        '.example.com');\n\
    ?>\n```\n尝试发送 cookie。\n\n*为 Cookie 设置域（setcookie-domain.php）*\n\n![](img/1e6d362f187af50011d2666ddaa68739_146_0.png)\n\
    \n图 5.5  即使是 Netscape 4.x 也允许你阻止不使用源域的 cookie。\n\n然而，在某些情况下，要求 cookie 在多个三级域或子域上工作，例如\
    \ www.example.com、store.example.com 和 ssl.example.com。这方面的例子是拥有许多子域的大型网站，如 Amazon\
    \ 和 eBay。它们要求支持所有顶级域（TLD）。为此，必须设置 cookie 的域——setcookie() 的第四个参数。这里有一个技巧：\n\n只要包含两个点，所有域名都是有效的。因此，如果将域设置为“.example.com”，example.com\
    \ 的所有三级域都可以访问此 cookie。这里有一个“但是”：http://example.com/ 上的页面无法访问此 cookie。因此，你可能想尝试将域设置为“example.com”；然而，这不符合规范，并且可能不被所有浏览器支持。\n\
    \n## 检查客户端是否支持 Cookie\n\n```php\n$test_temp = isset($_COOKIE['test_temp']) ?\n\
    'supports' : 'does not support';\n$test_persist = isset($_COOKIE['test_persist'])\
    \ ?\n'supports' : 'does not support';\n```\n\n请记住 cookie 的发送方式：首先，服务器作为 HTTP 响应的<|message|>一部分将\
    \ cookie 发送给客户端。在下一个请求中，如果接受，客户端会将 cookie 发送回。因此，调用 setcookie() 然后检查 $_COOKIE\
    \ 的内容是无效的。你必须等待下一个 HTTP 请求。\n\n```php\nif (isset($_GET['step']) && $_GET['step']\
    \ == '2')\n{\n$test_temp = isset($_COOKIE['test_temp']) ?\n'supports' : 'does\
    \ not support';\n$test_persist = isset($_COOKIE['test_persist']) ?\n'supports'\
    \ : 'does not support';\nsetcookie('test_temp', '', time() - 365*24*60*60);\n\
    setcookie('test_persist', '', time() - 365*24*60*60);\necho \"Browser $test_temp\
    \ temporary cookies.<br />\";\necho \"Browser $test_persist persistent cookies.\"\
    ;\n} else {\nsetcookie('test_temp', 'ok');\nsetcookie('test_persist', 'ok', time()\
    \ +\n14*24*60*60);\nheader(\"Location: \".$_SERVER['PHP_SELF'].\"?step=2\");\n\
    }\n?>\n```\n\n*测试浏览器 Cookie 配置（cookietest.php）*\n\n然而，你可以使用 header() 强制客户端创建第二个请求。在第一个请求中，你设置\
    \ cookie；在第二个请求中，你检查是否成功。\n\n在之前的代码中，设置了两个 cookie，一个临时 cookie 和一个持久 cookie——因为可以配置某些浏览器以接受一种\
    \ cookie 而不接受另一种。然后，使用 header() 和 Location: HTTP 头进行重定向，并检查 cookie(s) 的存在。\n\n\
    当然，你应该配置浏览器在 cookie 到达时显示消息窗口；这使得调试变得容易得多。\n"
