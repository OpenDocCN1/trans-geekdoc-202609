  - '[PAGE 30]


    # Protecting Email Addresses Using ASCII Codes


    This can be used to protect email addresses, for instance. Because spammers are
    writing software to search for certain patterns (email adresses) on web pages,
    this might help keep spam low. The trick is to use HTML character codes for email
    addresses, making it much harder for spambots to find email data.


    The preceding code takes an email address (in the format email@address.xy) as
    a parameter and returns mailto:email@address.xy—but converted into HTML entities.
    For instance, the m of mailto: has the ASCII code 109; therefore, &#109; stands
    for m. To do so, a for loop iterates through all characters in the string. To
    do so, the length of the string has to be determined, which can be done using
    strlen(). Then, a call to ord() calculates the ASCII code of each character, which
    is then used for the resulting HTML.


    Of course, this does not offer a bulletproof protection; you might consider using
    alternative ways to obscure the email address, including a syntax such as email
    at address dot xy.


    # Printing Strings, Variables, and Expressions Simultaneously


    Using double quotation marks, printing a mixture of strings and variables is easy
    to do. However, when you also want to use expressions such as function calls,
    the standard way is to use lots of string concatenations:


    ```

    echo ''The length of the string is '' . strlen($s) . ''!'' ;

    ```


    This is obviously getting rather complex when several expressions are involved.'
