  mdcn: "\n放入一个类中。然后，setClass() 为 SOAP 扩展提供要使用的类的名称。\n\n```\n<?php\n$soap = new SoapServer(\n\
    \    'AddService.wsdl',\n    array('uri' => 'http://php.phrasebook.org/')\n);\n\
    $soap->setClass('ServiceClass');\n$soap->handle();\n\nclass ServiceClass {\n \
    \   function add($a, $b) {\n        return $a + $b;\n    }\n}\n?>\n```\n\n## 使用\
    \ PHP 5 的 SOAP 扩展消费 Web 服务\n\n只要您有 WSDL 描述，消费再次变得很容易。此代码调用 Web 服务，并且还捕获任何错误，这得益于\
    \ PHP 5 的 try-catch 机制。\n\n```\n<?php\n$soap = new SoapClient('AddService.wsdl');\n\
    try {\n    $result = $soap->add(47, 11);\n    echo \"47 + 11 = $result\";\n} catch\
    \ (SoapFault $e) {\n    echo \"Error: {$e->faultstring}\";\n}\n?>\n```\n\n## 提示\n\
    \n为了提高性能，PHP 5 的 SOAP 扩展默认缓存 WSDL。以下是 php.ini-recommended 中的标准设置：\n\n```\n[soap]\n\
    ; Enables or disables WSDL caching feature.\nsoap.wsdl_cache_enabled=1\n; Sets\
    \ the directory name where SOAP extension will put cache files.\nsoap.wsdl_cache_dir=\"\
    /tmp\"\n; (time to live) Sets the number of seconds\n; while cached file will\
    \ be used\n; instead of original one.\nsoap.wsdl_cache_ttl=86400\n```\n\n在开发 Web\
    \ 服务并且可能更改 WSDL 时，这当然是显而易见的。因此，在开发期间将 soap.wsdl_cache_enabled 设置为 Off，但在生产服务器上将其打开。\n\
    \n## 使用有史以来最糟糕的缩写：AJAX\n\nWikipedia 列出了“Ajax”一词十多种不同的含义，包括荷兰的一支足球球队、荷马《伊利亚特》中的两个人物以及一种家用清洁产品。然而，自几个月前以来，AJAX\
    \ 也代表“异步 JavaScript + XML”。该技术远非新事物（底层技术，即 JavaScript 中的 XML HTTP 请求，受最近版本的 Internet\
    \ Explorer 以及包括 Firefox、Safari 和 Konqueror 在内的 Mozilla 浏览器支持——此外，对于此，XML 根本不是必需的），但只有在创造了这个真正愚蠢的术语之后，人们才真正开始使用它。\n\
    \n基本原则是 JavaScript 现在能够调用远程服务器然后处理其返回值，而无需重新加载整个页面。当然，这与 PHP 关系不大；然而，一些 AJAX 类使从\
    \ PHP 中使用 AJAX 变得非常容易。\n\n本书的这一最后章节展示了“AJAX”的一个非常简短的演示。本章节使用 Sajax 工具包（S 代表 simple）可在\
    \ http://www.modernmethod.com/sajax/ 获取。\n\n此示例的完整代码相当长，因为同时需要 PHP 和 JavaScript。首先，我们需要服务器端逻辑。为此，加载了\
    \ Sajax 工具包，它作为单个 PHP 文件提供。然后我们“导出”（注册）所有希望从客户端使用的 PHP 函数。以下示例有一个小型函数，用于生成随机 RGB\
    \ 颜色。\n\n```\n<?php\n    require_once 'Sajax.php';\n\n    sajax_init();\n    sajax_export('randomColor');\n\
    \    sajax_handle_client_request();\n\n    function randomColor() {\n        $color\
    \ = '#';\n        for ($i=0; $i<3; $i++) {\n            $color .= dechex(rand(0,\
    \ 255));\n        }\n        return $color;\n    }\n?>\n```\n\n*服务器端应用程序部分（ajax.php；摘录）*\n\
    \n在客户端，对 (PHP) 函数 `sajax_show_javascript()` 的调用完成了大部分工作——它创建了一些 JavaScript 代码行，在后台处理对\
    \ Web 服务器的请求。然后，所有之前注册的 PHP 函数都可以在客户端通过在函数名称前加上 `x_` 来调用。作为参数，您必须提供回调函数的名称；当服务器端响应请求时，该函数将被调用。\n\
    \n以下代码每五秒调用一次 `randomColor()` PHP 函数，然后以此随机颜色写入文本——全部无需服务器往返！图 9.5 显示了结果。\n\n\
    ```\n<script language=\"JavaScript\" type=\"text/javascript\">\n    <!--\n<?php\n\
    \    sajax_show_javascript();\n?>\n    changeColor();\n    setInterval('changeColor()',\
    \ 5000);\n\n    function changeColor() {\n        x_randomColor(randomColor_callback);\n\
    \    }\n\n    function randomColor_callback(result) {\n        var text = '<span\
    \ style=\"color: ' + result + '\">What a dumb acronym ...</span>';\n        document.getElementById('output').innerHTML\
    \ =\n            text;\n    }\n//--></script>\n...\n<div id=\"output\"></div>\n\
    ```\n\n客户端应用程序部分（ajax.php；摘录）\n\n![](img/1e6d362f187af50011d2666ddaa68739_292_0.png)\n\
    \nFigure 9.5  使用 JavaScript 和 PHP 显示的文本。\n\n## PEAR 提供了什么？\n\n除了本章提到的几个模块外，以下\
    \ PEAR 包在通过 PHP 与他人连接时提供的功能可能有所帮助：\n\n- PEAR 的 HTTP 类别提供了一些相关包，包括 HTTP、HTTP_Client、HTTP_Header、HTTP_Request\
