  mdcn: "\n以及消息摘要算法5（MD5）。它们会生成这样的校验和，即哈希。这两种算法与DES/crypt()所用算法的主要区别在于：字符串的SHA1或MD5校验和始终是相同的，因此验证数据非常容易。如图1.2所示，就连PHP发行版也在网站上提供了MD5校验和，用于验证下载文件。\n\
    \n![](img/1e6d362f187af50011d2666ddaa68739_26_0.png)\n\n图1.2 PHP下载页面显示了PHP发行版的MD5哈希值。\n\
    \n在这里，目标仍然是验证用户通过GET提供的密码。正确的密码依旧是'TopSecret'，其哈希值如下：\n\n- 6958b43cb096e036f872d65d6a4dc01b\
    \ 是 MD5 哈希值\n- 61c2feed11e0e53eb8e295ab8da78150be12f301 是 SHA1 哈希值\n\n## 计算字符串校验和\n\
    \n> 在计算文件的MD5或SHA1哈希值时，无需调用 file_get_contents() 或其他文件函数；PHP提供了两个函数来计算文件的哈希值（并负责打开和读取文件数据）：\n\
    > \n> - md5_file()\n> - sha1_file()\n\n## 提取子字符串\n\nsubstr() 函数返回字符串的一部分。你需要提供一个字符串以及要提取的第一个字符的位置（请记住，第一个字符的索引为0）。从该字符开始，将返回字符串的其余部分。如果只想返回其中一部分，可在第三个参数中指定长度。前面的代码演示了\
    \ substr() 的用法，从 PHP: Hypertext Preprocessor 中提取出 Prep。\n\n```php\n<?php\n$php\
    \ = \"PHP: Hypertext Preprocessor\";\necho substr($php, 15, 4); //returns \"Prep\"\
    \n?>\n```\n\n*使用 substr() 提取子字符串（substr.php；节选）*\n\n> 提示\n> \n> 如果想从字符串末尾开始计数，可以将\
    \ substr() 的第二个参数设置为负值：\n> \n> echo substr($php, -12, 4);\n> \n> 如果为 substr()\
    \ 的第三个参数提供负值，例如 -n，则最后 n 个字符不包含在子字符串中。\n> \n> echo substr($php, -12, -8);\n> \n\
    > 所有这些 substr() 调用都返回 Prep，并包含在完整代码中。\n\n## 使用ASCII码保护电子邮件地址\n\n### protectMail('email@address.xy')\n\
    \n在浏览器中，你只会看到一个电子邮件链接；但其底层的HTML标记是难以解读的：\n\n```\n<a href=\"&#109;&#97;&#105;&#108;&#116;&#111;&#58;&#101;&#109;&#97;&#105;&#108;&#64;&#97;&#100;&#100;&#114;&#101;&#115;&#115;&#46;&#120;&#121;\"\
    >Send mail</a>\n```\n\n```php\n<?php\nfunction protectMail($s) {\n  $result =\
    \ '';\n  $s = 'mailto:' . $s;\n  for ($i = 0; $i < strlen($s); $i++) {\n    $result\
    \ .= '&#' . ord(substr($s, $i, 1)) . ';';\n  }\n  return $result;\n}\n```\n\n\
    ## 使用ASCII码保护电子邮件地址\n\n```\necho '<a href=\"' .\n    protectMail('email@address.xy')\
    \ .\n    '\">Send mail</a>';\n?>\n```\n\n*保护电子邮件地址（protectMail.php）*\n\n然而，请看图1.3：网络浏览器正确解码了电子邮件地址，从状态栏中可以看到。\n\
    \n![](img/1e6d362f187af50011d2666ddaa68739_29_0.png)\n\n图1.3 机器胜过人类（在解密电子邮件地址时）。\n\
    \n有些特殊字符很难用在字符串中，因为用键盘很难输入。但是，它们都有对应的ASCII值。PHP提供了两个函数来处理这种情况：\n\n- `chr()` 将ASCII码转换为相应的字符\n\
    - `ord()` 返回一个字符的ASCII码\n\n## 使用ASCII码保护电子邮件地址\n\n例如，这可用于保护电子邮件地址。由于垃圾邮件发送者会编写软件来搜索网页上的特定模式（电子邮件地址），这样做可能有助于减少垃圾邮件。诀窍是为电子邮件地址使用HTML字符代码，使垃圾邮件机器人更难以找到电子邮件数据。\n\
    \n前面的代码将一个电子邮件地址（格式为 email@address.xy）作为参数，返回 mailto:email@address.xy —— 但会转换为HTML实体。例如，mailto:\
    \ 中的 m 的ASCII码是109，因此 &#109; 表示 m。为此，需要使用 for 循环遍历字符串中的所有字符。要这样做，必须先确定字符串的长度，这可以使用\
    \ strlen() 完成。然后，调用 ord() 计算每个字符的ASCII码，并将其用于生成的HTML。\n\n当然，这并不能提供万无一失的保护；你可以考虑使用其他方式来隐藏电子邮件地址，例如使用\
    \ email at address dot xy 这样的语法。\n\n## 同时打印字符串、变量和表达式\n\n使用双引号，可以轻松打印字符串和变量的混合内容。但是，当还想使用函数调用等表达式时，标准做法是使用大量的字符串连接：\n\
    \n```\necho 'The length of the string is ' . strlen($s) . '!' ;\n```\n\n当涉及多个表达式时，这显然会变得相当复杂。\n\
    \n下面展示了 printf() 如何使代码更易读一些：\n\n```php\n<?php\n$a = 'PHP';\n$b = 'php';\nprintf('strcmp():\
    \ %d<br />strcasecmp(): %d',\n    strcmp($a, $b), strcasecmp($a, $b));\n?>\n```\n\
    \nPHP还支持几个与 printf() 相关的函数：\n\n- sprintf() 的工作方式与 printf() 类似，但会返回字符串，而不是打印它。\n\
    - vprintf() 的工作方式与 printf() 类似，但期望字符串中占位符的值以数组形式提供。\n- vsprintf() 是 sprintf()\
    \ 和 vprintf() 的混合体：占位符值以数组形式提供，函数返回字符串但不打印。\n\n## 扫描格式化字符串\n\n```\nsscanf($date,\
    \ '%d/%d/%d')\n```\n\n另一个与 printf() 相关的函数是 sscanf()。它会解析一个字符串，并尝试将其与包含占位符的模式进行匹配。$input\
    \ 字符串包含一个日期，并使用包含多个占位符的字符串 '%d-%d-%d' 进行扫描，如前面的代码所示。该函数返回一个数组，其中包含所有匹配的占位符的值。然后将该数组传递给\
    \ vprintf() 进行打印。\n\n## 扫描格式化字符串\n\n```php\n<?php\n$date = '02/01/06';\n$values\
    \ = sscanf($date, '%d/%d/%d');\nvprintf('Month: %d; Day: %d; Year: %d.', $values);\n\
    ?>\n```\n\n*扫描格式化字符串（sscanf.php）*\n\n或者，你可以向 sscanf() 提供一系列变量名作为附加参数。然后，该函数会将与占位符匹配的子字符串写入这些变量。下面的代码演示了这一点：\n\
    \n```php\n<?php\n$date = '02/01/06';\n$values = sscanf($date, '%d/%d/%d', $m,\
    \ $d, $y);\necho \"Month: $m; Day: $d; Year: $y.\";\n?>\n```\n\n*扫描格式化字符串（sscanf-alternative.php）*\n\
    \n## 获取关于变量的详细信息\n\n```\nvar_dump(false);\n```\n\n变量的值可以使用 print() 或 echo() 发送到客户端；但有时这样做会有问题。以布尔值为例，echo(true)\
    \ 会打印 1，而 echo(false) 不打印任何内容。更好的方法是使用 var_dump()，这个函数还会打印变量的类型。因此，上述代码返回字符串 bool(false)。\n\
    \n这对于对象和数组也同样适用，因此 var_dump() 是喜欢在没有调试器的情况下进行调试的开发人员的必备选择。\n\n### 注意\n\n一个与 var_dump()\
    \ 相关的函数是 var_export()。它的工作方式类似，但有两个不同点：\n\n- var_export() 的返回值是 PHP 代码；例如，var_export(false)\
    \ 返回 false。\n- 如果提供给 var_export() 的第二个参数为布尔值 true，则该函数不会打印任何内容，而是返回一个字符串。\n\n\
    ## 在字符串中搜索\n\n```php\nif (strpos($string, $substring) === false) {\n    echo 'No\
    \ match found.';\n} else {\n    echo 'Match found.';\n}\n```\n\n在字符串中查找子字符串时，会使用\
    \ strpos()（以及对应的 strrpos()，它从字符串末尾开始搜索）。这个函数的棘手之处在于，它返回子字符串第一次出现的索引，否则返回 false。这意味着前面的代码片段是不正确的。\n\
    \n前面的代码片段不正确，因为如果 $string 恰好以 $substring 开头，strpos() 会返回 0，而 0 被判定为 false。因此，必须使用\
    \ === 或 !== 进行比较来获取数据\n"
