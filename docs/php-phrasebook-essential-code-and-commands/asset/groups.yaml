    ?>\n</table>\n```\n\nRetrieving Data from MSSQL/MSDE (mssql_fetch.php; excerpt)\n\
    \n## Connecting to Firebird\n\n### ibase_connect()\n\nThe Firebird database is\
    \ currently more an insider’s tip than a widely in use database, but is getting\
    \ more users and may be an alternative to established RDBMS. The origins of this\
    \ database lie in Borland’s InterBase product. Therefore, the extension is called\
    \ ibase or interbase. So, Windows users need extension=php_interbase.dll in their\
    \ php.ini, whereas “self-compilers” must configure PHP with the switch --with-interbase=/path/to/firebird.\
    \ Then, Firebird supports two modes: a file mode comparable to SQLite and a server\
    \ mode. For the sake of interoperability and for an easy deployment, this section\
    \ uses the file mode.\n\n```\n<?php\n    if ($db =\nibase_connect('localhost:/tmp/quotes.gdb',\
    \ 'user',\n    'password')) {\n        echo 'Connected to the database.';\n  \
    \      ibase_close($db);\n    } else {\n        echo 'Connection failed.';\n \
    \   }\n?>\n```\n\n*Connecting to InterBase/Firebird (ibase_connect.php)*\n\nThis\
    \ section also uses .gdb files that are compatible with both Firebird and Interbase;\
    \ the new Firebird format has the extension .fdb. After this file is created,\
    \ ibase_connect() connects to the file or database. For\n\n```\n} else {\n   \
    \ echo 'Connection failed.';\n}\n?>\n```\n\n*Sending SQL to InterBase/Firebird\
    \ (ibase_execute.php; excerpt)*\n\n**NOTE**\nThe preceding code contains two specialities\
    \ of Firebird. First, the identity column is driven by a generator in the database;\
    \ the call to GEN_ID(quotes_gen, 1) enters the next available value in this column\
    \ when inserting a new field. Also, the word year is reserved within Firebird,\
    \ so the column's name is qyear.\n\n## Retrieving Results of a Query to Firebird\n\
    \n```\n$result = ibase_query();\n$row = ibase_fetch_object($result);\n```\n\n\
    No matter if you are using ibase_query or ibase_execute(), at the end, you have\
    \ a handle for the resultset, which you can iterate with ibase_fetch_assoc()—which\
    \ returns an associative array—or ibase_fetch_object()—which returns an object.\
    \ This code uses the latter method.\n\nKeep in mind that Firebird and InterBase\
    \ return column names in uppercase, so the object properties (and the keys in\
    \ the associative arrays) are uppercase, too.\n\n## Retrieving Results of a Query\
    \ to Firebird\n\n```\n<table>\n<tr><th>#</th><th>Quote</th><th>Author</th><th>Year</th></tr>\n\
    <?php\nif ($db = ibase_connect('//CHRISTIAN2003/tmp/quotes.gdb', 'user', 'password'))\
    \ {\n$result = ibase_query($db, 'SELECT * FROM quotes');\nwhile ($row = ibase_fetch_object($result))\
    \ {\nprintf(\n'<tr><td>%s</td><td>%s</td><td>%s</td><td>%s</td></tr>',\nhtmlspecialchars($row->ID),\n\
    htmlspecialchars($row->QUOTE),\nhtmlspecialchars($row->AUTHOR),\nhtmlspecialchars($row->QYEAR)\n\
    );\n}\nibase_close($db);\n} else {\necho '<tr><td colspan=\"4\">Connection failed.</td></tr>';\n\
    }\n?>\n</table>\n```\n\n*Retrieving Data from InterBase/Firebird (ibase_fetch.php;\
    \ excerpt)*\n\n## Connecting Via PDO\n\n```\ntry {\n$db = new PDO('sqlite:PDOquotes.db');\n\
    }\n```\n\nFinally, a new development from some core PHP developers and one of\
    \ the key features of PHP 5.1 is PDO, short for PHP Data Objects. There are several\
    \ abstraction classes in PHP, but PDO will become the official one.\n\nPDO is\
    \ already available in PEAR, at http://pecl.php.net/package/PDO. UNIX/Linux users\
    \ can install it using pear install PDO or by compiling it manually; Windows users\
    \ have to refer to http://pecl4win.php.net/list.php/5_0 for PHP 5.0.x, and to\
    \ http://pecl4win.php.net/list.php/5_1 for PHP 5.1. Then, extension=php_pdo.dll\
    \ (or extension=pdo.so on other systems) in php.ini does the trick.\n\n```php\n\
    <?php\ntry {\n    $db = new PDO('sqlite:PDOquotes.db');\n    echo 'Connected to\
    \ the database.';\n} catch (PDOException $ex) {\n    echo 'Connection failed:\
    \ ' .\nhtmlspecialchars($ex->getMessage());\n}\n?>\n```\n\n*Connecting Via PDO\
    \ (pdo_connect.php)*\n\nAfter installing PDO, a driver for the database to be\
    \ used must be loaded, as well. As of this writing, the following drivers are\
    \ available:\n\n- PDO_FIREBIRD for InterBase/Firebird\n- PDO_MYSQL for MySQL 3.x\
    \ and 4.0\n- PDO_OCI for Oracle\n- PDO_ODBC for ODBC and IBM's DB2\n- PDO_PGSQL\
    \ for PostgreSQL\n- PDO_SQLITE for SQLite\n\n## Connecting Via PDO\n\nTo make\
    \ this as portable and easy to deploy as possible, the following phrases use the\
    \ SQLite driver; however, other drivers and database systems are just as good.\
    \ Note that this driver uses SQLite 3 and not SQLite 2 as bundled with PHP 5 (that’s\
    \ why the binary distribution of the driver weighs in at over 200KB). Whatever\
    \ system you choose, download and install the driver and load it after PDO in\
    \ your php.ini.\n\nBecause PDO only works with PHP 5 and later versions, you can\
    \ use an object-oriented approach. All you need is a suitable data source name\
    \ (DSN), a user, and a password (and possibly other options). The preceding code\
    \ connects to/creates an SQLite file.\n\n## Sending SQL Via PDO\n\n```\n$stmt\
    \ = $db->prepare($sql);\n$stmt->execute();\n```\n\nTo send SQL via PDO, a statement\
    \ must be executed using the query() method. As always, you need a way to escape\
    \ special characters. This can, once again, be done using prepared statements.\
    \ First, an SQL query can be parsed using a method called prepare(), whereas placeholders\
    \ start with a colon. Then, the bindParam() method binds a value to a placeholder\
    \ name. Finally, the execute() method sends the statement to the database.\n\n\
    ```php\n<?php\ntry {\n    $db = new PDO('sqlite:PDOquotes.db');\n    require_once\
    \ 'stripFormSlashes.inc.php';\n    $sql = 'INSERT INTO quotes (quote, author,\
    \ year)\nVALUES (:quote, :author, :year)';\n$stmt = $db->prepare($sql);\n$stmt->bindParam(':quote',\
    \ $_POST['quote']);\n$stmt->bindParam(':author', $_POST['author']);\n$stmt->bindParam(':year',\n\
    \    intval($_POST['year']));\n$stmt->execute();\necho 'Quote saved.';\n} catch\
    \ (PDOException $ex) {\necho 'Connection failed: ' . htmlspecialchars\n    ($ex->getMessage());\n\
    }\n?>\n```\n\nSending SQL Via PDO (pdo_execute.php; excerpt)\n\n## Retrieving\
    \ Results of a Query Via PDO\n\n```\n$result = $db->query();\n$result->fetch(PDO::FETCH_ASSOC);\n\
    ```\n\nFinally, reading out results from an SQL query with PDO is done using the\
    \ standard approach: Send the SELECT query to the server and then use a while\
    \ loop to iterate over the results. Here, the iteration is done using the fetch()\
    \ method. As a parameter, you can provide constants such as PDO::FETCH_ASSOC (which\
    \ returns an associative array) or PDO::FETCH_OBJ (which returns an object). Alternatively,\
    \ you can use the fetchAll() method and get an array of arrays, so you have all\
    \ the data at once.\n\nThis code uses fetch() and PDO::FETCH_ASSOC to read out\
    \ all data from the data source.\n\n## Retrieving Results of a Query Via PDO\n\
    \n```\n<table>\n<tr><th>#</th><th>Quote</th><th>Author</th><th>Year</th></tr>\n\
    <?php\n  try {\n    $db = new PDO('sqlite:PDOquotes.db');\n    $result = $db->query('SELECT\
    \ * FROM quotes');\n    while ($row = $result->fetch(PDO::FETCH_ASSOC)) {\n  \
    \    printf(\n'<tr><td>%s</td><td>%s</td><td>%s</td><td>%s</td></tr>',\n     \
    \   htmlspecialchars($row['id']),\n        htmlspecialchars($row['quote']),\n\
    \        htmlspecialchars($row['author']),\n        htmlspecialchars($row['year'])\n\
    \      );\n    }\n  } catch (PDOException $ex) {\n    echo 'Connection failed:\
    \ ' . htmlspecialchars\n      ($ex->getMessage());\n  }\n?>\n</table>\n```\n\n\
    Retrieving Data Via PDO (pdo_fetch.php; excerpt)\n\nNOTE\nAs of this writing,\
    \ PDO cannot be considered as stable yet; therefore, it is possible that the application\
    \ programming interface (API) or behavior of PDO may change in the future. Also,\
    \ if you try out PDO, be aware that this is still not proven to be as reliable\
    \ as PHP itself.\n"
