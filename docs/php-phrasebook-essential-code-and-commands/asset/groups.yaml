    \ relaxNG 字符串进行验证\n\n前面的代码使用 relaxNGValidate() 将（格式良好的）XML 文件与不匹配的 relaxNG 文件进行验证。如果你在文件\
    \ quotes.rng 中将 <element name=\"person\"> 改为 <element name=\"author\">，验证就会成功。\n\
    \n```php\n<?php\n$dom = new DOMDocument;\n$dom->load('quotes.xml');\necho 'Validation\
    \ ';\n(($dom->relaxNGValidate('quotes.rng')) ?\n'succeeded.' : 'failed.');\n?>\n\
    ```\n\n使用 relaxNG 验证 XML (validate-rng.php)\n\n> 提示\n> \n> 创建 relaxNG 文件可能相当困难；Java\
    \ 工具 Trang，可在 http://thaiopensource.com/relaxng/trang.html 获取，可以读取 XML 文件并从中创建\
    \ relaxNG、Schema 或 DTD 文件。\n\n验证 Schema 类似，并在下载库中的文件 validate-xsd.php 中展示。当验证\
    \ DTD 时，你必须稍微修改 XML。DTD 文件必须包含在文件中或像这样引用：\n\n```\n<!DOCTYPE note SYSTEM \"quotes.dtd\"\
    >\n```\n\n然后，只需将 XML 文档加载到 DOM 对象中并调用 validate()。下面包含适当的代码；代码库中引用的文件在 DTD 中包含一个有意的错误（month\
    \ 而不是 year）。\n\n```php\n<?php\n$dom = new DOMDocument();\n$dom->load('quotes-dtd.xml');\n\
    echo 'Validation ' .\n    (($dom->validate()) ? 'succeeded.' : 'failed.');\n?>\n\
    ```\n\n*使用 DTD 验证 XML (validate-dtd.php)*\n\n## 验证 XML\n\n## PEAR 提供了什么？\n\n截至本文撰写时，PEAR\
    \ 的 XML 部分包含 28 个包，太多无法一一列举。以下是其中一些：\n\n- XML_Beautifier 格式化 XML 文档，使其更美观\n- XML_DTD\
    \ 允许解析 DTD，即使在 PHP 4 中也行\n- XML_Serializer 将 XML 文件转换为数据结构，反之亦然\n- XML_Util 包含用于处理\
    \ XML 的大量辅助函数\n\n## 与他人通信\n\n前面的大部分短语都在所使用的 PHP 脚本和 Web 服务器的生态系统中工作。然而，由于某些短语也可以被他人理解，本章涵盖了一些此类示例。你可以通过多种方式连接到远程服务器。\n\
    \n## 连接 HTTP 服务器\n\n```php\n<xmp>\n<?php\necho file_get_contents('http://www.php.net/');\n\
    ?>\n</xmp>\n```\n\n超文本传输协议（HTTP）可能是从 PHP 连接到其他系统（除各种数据库协议外）最常用的协议。从 PHP 4.3 开始，连接此类数据变得非常容易\n"
