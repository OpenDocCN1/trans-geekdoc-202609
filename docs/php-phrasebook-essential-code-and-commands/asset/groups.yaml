    \n本章涉及相当多的数据库并展示了与它们的基本操作：连接、发送 SQL 语句以及评估返回值。无论您的数据库驱动 Web 应用程序必须做什么，它总是必须执行这些步骤。\n\
    \n为了拥有一些测试数据，我们在关系数据库管理系统（RDBMS）中创建了一个名为 phrasebook 的数据库，并在其中放置了一个名为 quotes 的表。该表由四个字段组成：\n\
