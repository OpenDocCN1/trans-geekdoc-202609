    \ id=\\'%s\\'',\n            mysqli_real_escape_string($GLOBALS['sess_mysqli'],\
    \ $data),\n            date('YmdHis'),\n            mysqli_real_escape_string($GLOBALS['sess_mysqli'],\
    \ $id))\n    );\n    if (mysqli_affected_rows($GLOBALS['sess_mysqli']) < 1) {\n\
    \        mysqli_query(\n            $GLOBALS['sess_mysqli'],\n            sprintf('INSERT\
    \ INTO sessiondata (data, access, id) VALUES (\\'%s\\', \\'%s\\', \\'%s\\')',\n\
    \                mysqli_real_escape_string($GLOBALS['sess_mysqli'], $data),\n\
    \                date('YmdHis'),\n                mysqli_real_escape_string($GLOBALS['sess_mysqli'],\
    \ $id))\n        );\n    }\n    return true;\n}\n\nfunction sess_destroy($id)\
    \ {\n    mysqli_query(\n        $GLOBALS['sess_mysqli'],\n        sprintf('DELETE\
    \ FROM sessiondata WHERE id=\\'%s\\'',\n            mysqli_real_escape_string($GLOBALS['sess_mysqli'],\
    \ $id))\n    );\n    return true;\n}\n\nfunction sess_gc($timeout) {\n    $timestamp\
    \ = date('YmdHis', time() - $timeout);\n    mysqli_query(\n        $GLOBALS['sess_mysqli'],\n\
    \        sprintf('DELETE FROM sessiondata WHERE access < \\'%s\\'',\n        \
    \    $timestamp)\n    );\n}\n\nsession_set_save_handler(\n    'sess_open', 'sess_close',\
    \ 'sess_read',\n    'sess_write', 'sess_destroy', 'sess_gc');\n?>\n```\n\n**TIP**\
    \ The file `session.sql` in the download archive contains an SQL file to create\
    \ the database table in MySQL. The file `session_mysqli_readwrite.php` uses the\
    \ code in the preceding listing and saves some data in the session.\n\nFigure\
    \ 5.8 shows the contents in the session table after data has been written into\
    \ it.\n\n![](img/1e6d362f187af50011d2666ddaa68739_167_0.png)\n\nFigure 5.8  The\
    \ session data now resides in the database.\n\n### Creating a Secured Area with\
    \ Sessions\n\n```php\nsession_start();\nif (!(isset($_SESSION['authorized']) &&\
    \ $_SESSION['authorized'] != '')) {\n    header(\"Location: login.php?url=\".nl2br($_SERVER['PHP_SELF']));\n\
    }\n```\n\nSessions can be a great way to secure certain parts of a website. The\
    \ approach is simple: After the user is authenticated, write this information\
    \ into a session variable. On all protected pages, check for the presence of this\
    \ session variable.\n\nFirst, you can check for the session variable. The code\
    \ from the beginning of this section must be included (with `require_once`) in\
    \ all pages that are only accessible for authorized users.\n\nThe script `login.php`,\
    \ to which the preceding code redirects the user, contains an HTML form (see also\
    \ Figure 5.9) and checks whether the provided data is correct (you might have\
    \ to add your own users and passwords). As you might have seen, the previous URL\
    \ is provided as a GET parameter, so, if available, the login code redirects the\
    \ user back to where she came from:\n\n```php\n<?php\n    if (isset($_POST['user'])\
    \ && $_POST['user'] == 'Damon' &&\n        isset($_POST['pass']) && $_POST['pass']\
    \ == 'secret') {\n        session_start();\n        $_SESSION['authorized'] =\
    \ 'ok';\n        $url = (isset($_GET['url'])) ? nl2br($_GET['url']) : 'index.php';\n\
    \        header(\"Location: $url\");\n    }\n?>\n```\n\n*Checking the User Credentials\
    \ (login.php; excerpt)*\n\nAnd that's it! The script `secret.php` in the download\
    \ archive contains some quite secret information and is protected by the code\
    \ in the previous listings.\n\n![](img/1e6d362f187af50011d2666ddaa68739_169_0.png)\n\
    \nFigure 5.9 The login form—note the referring page in the URL.\n\n### Creating\
    \ a Secured Area Without Sessions\n\n```php\n$_SERVER['PHP_AUTH_USER'] == 'Shelley'\
    \ && $_SERVER['PHP_AUTH_PW'] == 'TopSecret'\n```\n\nIf using authentication with\
    \ PHP's session management seems to be too much overhead, you have two other options.\
    \ First, configure your web server so that only authorized users can access some\
    \ files or directories. For instance, Apache users might use `.htaccess` files;\
    \ `http://apache-server.com/tutorials/ATusing-htaccess.html` contains some good\
    \ information about that. Microsoft IIS offers a graphical user interface (GUI)\
    \ administration of access rights, so that can be done, as well.\n\n```php\n<?php\n\
    if (!(isset($_SERVER['PHP_AUTH_USER']) &&\n    isset($_SERVER['PHP_AUTH_PW'])\
    \ &&\n    $_SERVER['PHP_AUTH_USER'] == 'Shelley' &&\n    $_SERVER['PHP_AUTH_PW']\
    \ == 'TopSecret')) {\n    header('WWW-Authenticate: Basic realm=\"Secured area\"\
    ');\n    header('Status: 401 Unauthorized');\n} else {\n?>\n<!DOCTYPE html PUBLIC\
    \ \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    >\n...\n<?php\n}\n?>\n```\n\n*Using HTTP to Secure PHP Pages (http_authentication.php;\
    \ excerpt)*\n\nHowever, one more or less platform-independent way is to use authentication\
    \ via HTTP. If you send an HTTP status code 401 (unauthorized), browsers prompt\
    \ the client for a username and a password. This information is then available\
    \ using `$_SERVER['PHP_AUTH_USER']` and `$_SERVER['PHP_AUTH_PW']`—however, only\
    \ if you are running PHP as a server module, not in Common Gateway Interface (CGI)\
    \ mode.\n\nYou can then check this and decide whether to send out a 401 header\
    \ again or to show the page's actual contents. The preceding listing shows an\
    \ implementation for that. Figure 5.10 shows the prompt for username and password.\n\
    \n![](img/1e6d362f187af50011d2666ddaa68739_171_0.png)\n\nFigure 5.10  The browser\
    \ prompts for a username and a password.\n\n### What Does PEAR Offer?\n\nThe following\
    \ PEAR packages offer functionality that can be associated to sessions and HTTP\
    \ authentication:\n\n- Auth implements various ways to authenticate users and,\
    \ therefore, protect PHP pages.\n- HTTP_Session is based upon PHP's session mechanism\
    \ but offers an object-oriented access to session information.\n\n## Using Files\
    \ on the Server File System\n\nAlthough databases are very common, using the file\
    \ system to store data can be a real alternative. Often, it is easier to implement\
    \ that way. Sometimes, it is faster, and much more importantly, all hosting providers\
    \ have file access enabled, whereas database support might only be available at\
    \ extra cost.\n\nPHP supports working with files through a set of certain functions.\
    \ Using wrappers, the same technologies can also be used to access remote data\
    \ via protocols like Hypertext Transfer Protocol (HTTP) or File Transfer Protocol\
    \ (FTP), but this is covered in more detail in Chapter 9, “Communicating with\
    \ Others.”\n\nThis chapter covers both standard tasks such as reading and writing\
    \ files, and advanced tasks such as archiving files in ZIP or BZ2 format. Many\
    \ of these tasks can be solved in different, equally usable ways, so you truly\
    \ have the freedom of choice.\n\n### Opening and Closing Files\n\n```php\nif ($fp\
    \ = @fopen('file.txt', 'at')) {\n    fclose($fp);\n}\n```\n\nFor most file system\
    \ functions, the files have to be opened first. The function `fopen()` does exactly\
    \ this and returns a so-called file handle, a pointer to the file. This file handle\
    \ can then be used in subsequent functions to, for instance, read information\
    \ from a file or write to it.\n\n`fopen()` expects at least two parameters:\n\n\
    - The name of the file\n- The file mode to use when accessing the file\n\n```php\n\
    <?php\n    if ($fp = @fopen('file.txt', 'at')) {\n        echo 'File opened.';\n\
    \        fclose($fp);\n        echo '<br />File closed.';\n    } else {\n    \
    \    echo 'Error opening file.';\n    }\n?>\n```\n\n*Opening (and Closing) Files\
    \ (fopen.php)*\n\nOf great interest is the file mode parameter. This is a string\
    \ that consists of one or more characters. The first character is one of `a`,\
    \ `r`, `w`, or `x`; after that, one or more special modifiers can be used. Table\
    \ 6.1 shows all modes.\n"
