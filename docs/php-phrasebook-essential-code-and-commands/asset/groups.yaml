  - "[PAGE 44]\n\n# Accessing All Elements of Numerical Arrays\n\n```\narray('I',\
    \ 'II', 'III', 'IV');\n```\n\nLooping through numerical arrays can most easily\
    \ be done using foreach because in each iteration of the loop, the current element\
    \ in the array is automatically written in a variable.\n\n```\n<?php\n$a = array('I',\
    \ 'II', 'III', 'IV');\nforeach ($a as $element) {\n    echo htmlspecialchars($element)\
    \ . '<br />';\n}\n?>\n```\n\n*Looping Through an Array with foreach (foreach-n.php)*\n\
    \nAlternatively, a for loop can also be used. The first array element has the\
    \ index 0; the number of array indices can be retrieved using the count() function.\n\
    \n```\n<?php\n$a = array('I', 'II', 'III', 'IV');\nfor ($i = 0; $i < count($a);\
    \ $i++) {\n    echo htmlspecialchars($a[$i]) . '<br />';\n}\n?>\n```\n\n*Looping\
    \ Through an Array with for (for-n.php)*\n\nBoth ways are equally good (or bad);\
    \ though, usually, using foreach is the much more convenient way. However, there\
    \ is a third possibility: The PHP function"
  - "[PAGE 45]\n\n# Accessing All Elements of Numerical Arrays\n\neach() returns the\
    \ current element in an array. The return value of each() is an array, in which\
    \ you can access the value using the numerical index 1, or the string index 'value'.\
    \ Using a while loop, the whole array can be traversed. The following code once\
    \ again prints all elements in the array, this time using each().\n\n```\n<?php\n\
    $a = array('I', 'II', 'III', 'IV');\nwhile ($element = each($a)) {\n    echo htmlspecialchars($element['value'])\
    \ .\n        '<br />'; //or: $element[1]\n}\n?>\n```\n\n*Looping Through an Array\
    \ with each() (each-n.php)*\n\nThe output of the three listings is always the\
    \ same, of course.\n\n# Accessing All Elements of Associative Arrays\n\n```\n\
    foreach ($array as $key => $value) {\n```\n\nWhen using an associative array and\
    \ wanting to access all data in it, the keys are also of relevance. For this,\
