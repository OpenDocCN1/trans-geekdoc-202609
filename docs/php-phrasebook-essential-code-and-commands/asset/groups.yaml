    \ behavior. The idea is to define a new order for some special characters; in\
    \ the comparison function, you then use this to find out which character is “larger”\
    \ and which is “smaller.”\n\nYou first need a function that can sort single characters:\n\
    \n```\nfunction compareChar($a, $b) {\n    $characters = 'AAÀÁÄBCÇDEÉÈFGHIÌÍJKLMNOÒÖÓPQRSTUÙÜÚVWXYZ';\n\
    \    $characters .= 'aaàáäbcçdeèéfghiìíjklmnoòöópqrstuùüúvwxyz';\n    $pos_a =\
    \ strpos($characters, $a);\n    $pos_b = strpos($characters, $b);\n    if ($pos_a\
    \ === false) {\n        if ($pos_b === false) {\n            return 0;\n     \
    \   } else {\n            return 1;\n        }\n    } elseif ($pos_b === false)\
    \ {\n        return -1;\n    } else {\n        return $pos_a - $pos_b;\n    }\n\
    }\n```\n\nThen, the main sorting function calls compareChar(), character for character,\
