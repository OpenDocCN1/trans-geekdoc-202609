    +   - XML-RPC stands for Remote Procedure Call and uses a very simple XML dialect
    to transport function calls, parameters, and return values. This approach is sometimes
    called REST, for Representational State. There are some fierce debates about which
    is better, this protocol or the next one. To make a short and ugly story short:
    Both have advantages (and disadvantages).

    +   - SOAP once stood for Simple Object Access Protocol, but because it is neither
    simple nor has too much to do with object access, today SOAP just stands for ...
    SOAP. It is a rather complex protocol but overcomes many of the limitations of
    XML-RPC (which was, by the way, created by some parties who also worked on SOAP).


    Most of the time, XML-RPC or SOAP calls are transported via HTTP as the carrier
    protocol. However, other protocols are also possible, including Simple Mail Transfer
    Protocol (SMTP) or even User Datagram Protocol (UDP).


    There is one more important aspect when using SOAP. When you know exactly how
    a Web Service is implemented, you also know how to call (access, or consume) it.
    However, many times this information is not available, so there must be a kind
    of self-description of the Web Service that contains all relevant information,
    such as which methods or functions are exposed, which parameters and data types
    do they expect, and what they return. This can be done using a specifically crafted
    XML file, as well. The standard behind that is Web Services Description Language'
