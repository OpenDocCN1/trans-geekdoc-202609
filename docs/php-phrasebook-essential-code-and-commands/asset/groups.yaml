    \ expressions, but this is probably just slower. You should also be aware that\
    \ the aforementioned code cannot detect every email address that is incorrect.\
    \ Also watch out for the new international domains with special characters such\
    \ as ä or é in it. Most regular expressions omit these, so you are much better\
    \ off with the preceding code.\n\n## Search and Replace\n\n```\nPOSIX:\n  ereg_replace()\n\
    PCRE:\n  preg_replace()\n```\n\nSearching within strings is one thing; replacing\
    \ all occurrences with something else is completely different. Using regular expressions,\
    \ this is relatively easy; you just have to know the respective function names:\n\
    \n- For POSIX, use `ereg_replace()` and `eregi_replace()`\n- For PCRE, use `preg_replace()`\n\
    \n```\nPOSIX:\n<?php\n$string = '02/01/06';\necho ereg_replace(\n'([0-9][0-9]?)/([0-9][0-9]?)/([0-9][0-9]?)',\n\
    '\\\\2/\\\\1/\\\\3',\n$string\n);\n?>\n```\n\n```\nPCRE:\n<?php\n    $string =\
    \ '02/01/06';\n    echo preg_replace(\n        '#(\\d{1,2})/(\\d{1,2})/(\\d{1,2})#',\n\
    \        '$2/$1/$3',\n        $string\n    );\n?>\n```\n\n*Replacing Matches Using\
    \ POSIX (ereg_replace.php) and PCRE (preg_replace.php)*\n\nWithin the regular\
    \ expression for the replace term, you can use references to subpatterns. The\
    \ complete match is referred to by \\0 in POSIX and $0 in PCRE. Then count parentheses\
    \ from inside to outside, from left to right: The contents of the first parentheses\
    \ are referenced by \\1 or $1, the second parentheses are accessed using \\2 or\
    \ $2, and so on.\n\nWith this in mind, the replacement can be done. In the example,\
    \ a U.S. date (month/day/year) is converted to a U.K. date (day/month/year).\n\
    \n**TIP**\nThe regular expression in the preceding code does not use the / delimiter\
    \ for the regular expression because the regular expression itself contains slashes\
    \ that would then need escaping. However, by choosing another delimiter (for example:\
    \ #), the escaping of slashes can be avoided.\n\nIf you have a static pattern,\
    \ without any quantifiers or special characters, using str_replace() is almost\
    \ always faster. The parameter order for this is: first the string(s) to search\
    \ for; then the replacement(s); and, finally, the string where the search and\
    \ replace shall take place.\nYou can provide strings or arrays of strings in the\
    \ first two parameters. The following code removes all punctuation from the text.\n\
    \n```\n<?php\n$string = 'To be, or not to be; that\\'s the question?!';\necho\
    \ str_replace(\n    array('.', ',', ':', ';', '!', '?'),\n    '',\n    $string\n\
    );\n?>\n```\n\n*Replacing Without Regular Expressions (str_replace.php)*\n\n##\
    \ Working with Arrays\n\nWhen simple variables are just not good enough, arrays\
    \ come into play (or objects, but that's another topic). The array section in\
    \ the PHP manual, available at http://php.net/array, lists approximately 80 functions\
    \ that are helpful. Therefore, this book could be filled with array-related phrases\
    \ alone. However, not all of these functions are really used often. Therefore,\
    \ this chapter presents the most important problems you'll have to solve when\
    \ working with arrays—and, of course, solutions for these problems.\n\nThere are\
    \ two types of arrays. The names they are given differ sometimes, but usually\
    \ arrays are distinguished between numerical arrays and associative arrays. The\
    \ first type of array uses numerical keys, whereas the latter type can also use\
    \ strings as keys.\n\nCreating an array can be done in one of two ways:\n\n- Using\
    \ the array() function\n\n```\n$a = array('I', 'II', 'III', 'IV');\n```\n"
  mdcn: "\n请考虑。 这句话开头的代码展示了如何正确使用 `strpos()`。\n\n## 理解正则表达式\n\n正则表达式简单来说，是可以与字符串匹配的模式。PHP\
    \ 中有两种正则表达式——POSIX 正则表达式和 PCRE 正则表达式。前者可以在使用开关 `--with-regex` 配置 PHP 时安装。Windows\
    \ 用户无需这样做；POSIX Regex 的支持默认已启用。\n\n另一种选择是 Perl 兼容正则表达式（PCRE）。PCRE 通常被认为更快，并且提供更多功能。此功能在\
    \ PHP 中默认启用；但是，如果你自行编译 PHP，可以使用开关 `--without-pcre-regex` 禁用 PCRE。\n\n正则表达式中的模式包含可在较大字符串中搜索的字符串。然而，这也可以（更快地）使用\
    \ `strpos()` 来完成。正则表达式的优点是提供了一些特殊功能，例如通配符。表 1.2 显示了一些特殊字符及其含义。\n\n表 1.2 正则表达式中的特殊字符\n\
    \n| 特殊字符 | 描述 | 示例 |\n|---|---|---|\n| ^ | 字符串开头 | ^a 表示以 a 开头的字符串 |\n\n## 表 1.2\
    \ 继续\n\n| 特殊字符 | 描述 | 示例 |\n|---|---|---|\n| $ | 字符串结尾 | a$ 表示以 a 结尾的字符串 |\n|\
    \ ? | 0 或 1 次（指前一个字符或表达式） | ab? 表示 a 或 ab |\n| * | 0 或多次（指前一个字符或表达式） | ab* 表示\
    \ a 或 ab 或 abb 或 ... |\n| + | 1 或多次（指前一个字符或表达式） | ab+ 表示 ab 或 abb 或 abbb 或 ...\
    \ |\n| [...] | 替代字符 | PHP[45] 表示 PHP4 或 PHP5 |\n| - (用于方括号内) | 值序列 | PHP[3-5]\
    \ 表示 PHP3 或 PHP4 或 PHP5 |\n| ^ (用于方括号内) | 匹配除以下字符外的任何内容 | [^A-C] 表示 D 或 E 或 F\
    \ 或 ... |\n| \\| | 替代模式 | PHP4|PHP5 表示 PHP4 或 PHP5 |\n| (...) | 定义子模式 | (a)(b)\
    \ 表示 ab，但包含两个子模式（a 和 b） |\n\n## 在字符串中搜索\n\n表 1.2 继续\n\n| 特殊字符 | 描述 | 示例 |\n|---|---|---|\n\
    | . | 任意字符 | . 表示 a、b、c、0、1、2、$、^、... |\n| {min, max} | 最小和最大出现次数；如果省略 min 或 max，则表示\
    \ 0 或无限 | a{1,3} 表示 a、aa 或 aaa。 a{,3} 表示空字符串、a、aa 或 aaa。 a{1,} 表示 a、aaa、aaa、...\
    \ |\n| \\ | 转义下一个字符 | \\. 代表 . |\n\n> **TIP**\n>\n> 正则表达式的事实标准参考是 Jeffrey E. F.\
    \ Friedl 所著的 *Mastering Regular Expressions*。有点过时，但读起来很有趣。\n\n其他特殊字符和表达式也可用，例如指代数字的字符。然而，这在\
    \ POSIX 和 PCRE 之间有所不同，它们在示例中分别使用 [:digit:] 和 \\d。\n\n## 使用 POSIX 正则表达式\n\n使用 POSIX\
    \ 正则表达式搜索匹配是通过 ereg() 函数完成的。你提供一个模式、要搜索的字符串，以及一个变量名，该\n\n## 验证电子邮件地址\n\n检查字符串是否包含有效的电子邮件地址同时具有两个特点：非常常见且非常复杂。前述关于正则表达式的书籍用了几页篇幅来创建一套正则表达式来执行此任务。如果你对此感兴趣，请查看\
    \ http://examples.oreilly.com/regex/readme.html。\n\n```\nfunction checkEmail($s)\
    \ {\n  $lastDot = strrpos($s, '.');\n  $ampersand = strrpos($s, '@');\n  $length\
    \ = strlen($s);\n  return !(\n    $lastDot === false ||\n    $ampersand === false\
    \ ||\n    $length === false ||\n    $lastDot - $ampersand < 3 ||\n    $length\
    \ - $lastDot < 3\n  );\n}\n```\n\n*验证电子邮件地址 (check.inc.php; 摘录)*\n\n验证电子邮件地址很困难，因为不同国家对有效域名名的规则差异很大。例如，bn.com\
    \ 是有效的，而 bn.de 不是（但 db.de 是）。此外，你知道 username@[127.0.0.1] 是一个有效的电子邮件地址吗（如果 127.0.0.1\
    \ 是邮件服务器的 IP 地址）？\n\n因此，建议仅检查电子邮件地址的主要元素：有效字符（@ 字符）以及其后某处的点。检查电子邮件地址不可能 100% 确定——如果测试过于严格，用户只需提供一个虚构的电子邮件地址。电子邮件检查的唯一目的是在发生（非故意）拼写错误时提供帮助。\n\
    \n当然，这也可以使用正则表达式完成，但可能只是更慢。你还应该注意，前述代码无法检测到所有不正确的电子邮件地址。还要注意包含特殊字符（如 ä 或 é）的新国际域名。大多数正则表达式省略了这些，因此使用前述代码要好得多。\n\
    \n## 搜索和替换\n\n```\nPOSIX:\n  ereg_replace()\nPCRE:\n  preg_replace()\n```\n\n\
    在字符串中搜索是一回事；用其他内容替换所有出现的内容则完全不同。使用正则表达式，这相对容易；你只需要知道相应的函数名称：\n\n- 对于 POSIX，使用\
    \ `ereg_replace()` 和 `eregi_replace()`\n- 对于 PCRE，使用 `preg_replace()`\n\n```\n\
    POSIX:\n<?php\n$string = '02/01/06';\necho ereg_replace(\n'([0-9][0-9]?)/([0-9][0-9]?)/([0-9][0-9]?)',\n\
    '\\\\2/\\\\1/\\\\3',\n$string\n);\n?>\n```\n\n```\nPCRE:\n<?php\n    $string =\
    \ '02/01/06';\n    echo preg_replace(\n        '#(\\d{1,2})/(\\d{1,2})/(\\d{1,2})#',\n\
    \        '$2/$1/$3',\n        $string\n    );\n?>\n```\n\n*使用 POSIX (ereg_replace.php)\
    \ 和 PCRE (preg_replace.php) 替换匹配项*\n\n在替换项的正则表达式中，你可以使用对子模式的引用。完整匹配在 POSIX 中用\
    \ \\0 表示，在 PCRE 中用 $0 表示。然后从内到外、从左到右计数括号：第一个括号的内容由 \\1 或 $1 引用，第二个括号的内容使用 \\2\
    \ 或 $2 访问，以此类推。\n\n考虑到这一点，可以进行替换。在示例中，美国日期（月/日/年）被转换为英国日期（日/月/年）。\n\n**TIP**\n\
    前述代码中的正则表达式未使用 / 作为正则表达式的分隔符，因为正则表达式本身包含斜杠，这些斜杠随后需要转义。然而，通过选择另一个分隔符（例如：#），可以避免转义斜杠。\n\
    \n如果你有一个静态模式，没有任何量词或特殊字符，使用 str_replace() 几乎总是更快。其参数顺序为：首先是要搜索的字符串（或字符串）；然后是替换内容（或内容）；最后是执行搜索和替换的字符串。\n\
    你可以在前两个参数中提供字符串或字符串数组。以下代码从文本中删除所有标点符号。\n\n```\n<?php\n$string = 'To be, or not\
    \ to be; that\\'s the question?!';\necho str_replace(\n    array('.', ',', ':',\
    \ ';', '!', '?'),\n    '',\n    $string\n);\n?>\n```\n\n*不使用正则表达式进行替换 (str_replace.php)*\n\
    \n## 使用数组\n\n当简单变量不够好时，数组就派上用场了（或对象，但那是另一个话题）。PHP 手册中可用的数组部分，网址为 http://php.net/array，列出了大约\
    \ 80 个有用的函数。因此，这本书仅用与数组相关的短语就可以填满。然而，并非所有这些函数都经常使用。因此，本章介绍了在使用数组时你需要解决的最重要问题——当然，还有这些问题的解决方案。\n\
    \n有两种类型的数组。它们的名称有时不同，但通常数组分为数值数组和关联数组。第一类数组使用数值键，而后一类数组也可以使用字符串作为键。\n\n创建数组可以通过以下两种方式之一完成：\n\
    \n- 使用 array() 函数\n\n```\n$a = array('I', 'II', 'III', 'IV');\n```\n"
