  - "[PAGE 264]\n\n# Connecting with HTTP Servers\n\nFor security reasons, this behavior\
    \ can be turned off in php.ini by setting allow_url_fopen to Off, so you cannot\
    \ rely on it on web servers you cannot control—for instance, shared hosting at\
    \ large Internet service providers (ISPs).\n\nIf you want to control the HTTP\
    \ request by yourself, you can do so by using sockets. First, open a socket with\
    \ fsockopen() to the web server, and if that works, then send a well-formed HTTP\
    \ request. The following code implements this again for querying the PHP homepage.\n\
    \n```\n<?php\n$fp = @fsockopen('www.php.net', 80, $errno,\n$errstr, 30);\nif ($fp)\
    \ {\necho '<xmp>';\n$request = \"GET / HTTP/1.0\\r\\n\";\n$request .= \"Host:\
    \ www.php.net\\r\\n\";\n$request .= \"Connection: Close\\r\\n\\r\\n\";\nfwrite($fp,\
    \ $request);\nwhile (!feof($fp)) {\n\techo fgets($fp, 1024);\n}\nfclose($fp);\n\
    echo '</xmp>';\n} else {\necho \"Error: $errstr (#$errno)\";\n}\n?>\n```\n\nReading\
    \ in an HTTP resource using sockets (http-socket.php)"
