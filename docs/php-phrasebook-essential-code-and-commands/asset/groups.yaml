  mdcn: "\n## 连接 HTTP 服务器\n\n原因在于 PHP 的流支持在该版本中得到了极大改进（当然，以这种方式使用 HTTP 在更早的 PHP 版本中已经可能）。思路是当你使用文件操作时，你访问的是一个数据流。实际上，无论是本地系统上的文件、网络共享上的文件，还是通过\
    \ HTTP、文件传输协议（FTP）或其他受支持协议连接的远程服务器上的文件，都无关紧要。只需提供适当的文件名，PHP 就会处理其余部分。前面的代码展示了这一点：它打开\
    \ PHP 主页并在浏览器中打印其超文本标记语言（HTML）代码。只用一行代码，就不能更简单了。图 9.1 包含输出。\n\n![](img/1e6d362f187af50011d2666ddaa68739_263_0.png)\n\
    \n图 9.1 一行代码打印 PHP 主页的 HTML 标记。\n\n出于安全原因，此行为可在 php.ini 中通过将 allow_url_fopen 设置为\
    \ Off 来关闭，因此您无法在无法控制的 Web 服务器上依赖它——例如大型互联网服务提供商（ISP）的共享托管。\n\n如果您想自行控制 HTTP 请求，可以使用套接字。首先，使用\
    \ fsockopen() 向 Web 服务器打开一个套接字，如果成功，则发送格式良好的 HTTP 请求。以下代码再次实现了此功能，用于查询 PHP 主页。\n\
    \n```\n<?php\n$fp = @fsockopen('www.php.net', 80, $errno,\n$errstr, 30);\nif ($fp)\
    \ {\necho '<xmp>';\n$request = \"GET / HTTP/1.0\\r\\n\";\n$request .= \"Host:\
    \ www.php.net\\r\\n\";\n$request .= \"Connection: Close\\r\\n\\r\\n\";\nfwrite($fp,\
    \ $request);\nwhile (!feof($fp)) {\n\techo fgets($fp, 1024);\n}\nfclose($fp);\n\
    echo '</xmp>';\n} else {\necho \"Error: $errstr (#$errno)\";\n}\n?>\n```\n\n使用套接字读取\
    \ HTTP 资源（http-socket.php）\n\n输出相同，只有一个区别：套接字方法还会返回服务器发送的所有 HTTP 标头，而流包装器则省略了它们。\n\
    \n### 注意\n\n当需要处理 HTTP 安全（HTTPS）资源（使用 SSL——安全套接字层 保护的网站）时，这两种方法仍然有效，只是需要稍作修改：\n\
    \n- 使用 file functions such as file_get_contents() 等文件函数时，只需提供一个 https:// 统一资源定位符（URL）。\n\
    - 使用套接字时，使用 ssl:// URL。\n\n## 连接 FTP 服务器\n\n访问 FTP 服务器时，PHP 的流包装器也很方便。您只有读取权限，但访问仍然是二进制安全的。此代码展示了如何使用\
    \ file_get_contents() 从 FTP 服务器下载 Apache 的当前 README 文件并将其保存到本地硬盘。写入也是可能的；只需使用\
    \ file_put_contents() 或 fopen() 的正确文件模式即可。注意，虽然同时进行读写尚未得到支持。\n\n```\nfile_get_contents('ftp://ftp.leo.org/.mnt/0/\n\
    mirrors/apache/httpd/README.html')\n```\n\n```\n<?php\n$data =\nfile_get_contents('ftp://ftp.leo.org/.mnt/0/\n\
    mirrors/apache/httpd/README.html');\nfile_put_contents('Apache-README.html', $data);\n\
    echo 'File written.';\n?>\n```\n\n读取 FTP 文件（ftp-file.php；摘录）\n\n### 提示\n\n如果您不提供任何凭据，PHP\
    \ 会尝试使用大多数公共 FTP 服务器提供的访客账户登录到 FTP 服务器。您也可以自行提供凭据：\n\n```\n$data = file_get_contents\n\
    ('ftp://USER:PASSWORD@ftp.example.com/');\n```\n\n这也适用于 HTTP 资源（见前文）！\n\nPHP 还内置了对\
    \ FTP 的支持，并有一组特殊函数实现了相关请求评论（RFC）中定义的完整 FTP 功能。在 Windows 发行版中，这默认启用，而在其他系统上，PHP\
    \ 必须使用 --enable-ftp 开关进行配置。然后，使用 FTP 服务器通常包括以下步骤：\n\n- 使用 ftp_connect() 连接到服务器\n\
    - 使用 ftp_login() 登录\n- 使用 ftp_chdir() 进入目标目录\n- 从 FTP 服务器读取文件——ftp_get()——或向 FTP\
    \ 服务器写入文件——ftp_put()——\n- 使用 ftp_close() 关闭连接\n\n由于读取可能比写入更常见，下面展示了前者的执行。再次从 FTP\
    \ 服务器获取 Apache README。\n\n```\n<?php\n$ftp = @ftp_connect('ftp.leo.org');\n$login\
    \ = @ftp_login($ftp, 'anonymous',\n    'email@example.com');\nif ($ftp && $login)\
    \ {\n    ftp_chdir($ftp, './mnt/0/mirrors/apache/httpd/');\n    ftp_get($ftp,\
    \ 'Apache-README-ftp.html',\n        'README.html', FTP_ASCII);\n    echo 'File\
    \ written.';\n    ftp_close($ftp);\n} else {\n    echo 'Error!';\n}\n?>\n```\n\
    \n*使用内置函数读取 FTP 文件（ftp-functions.php）*\n\n请注意 ftp_get() 的语法有点奇怪。在 FTP 资源之后，您必须先提供本地文件名，然后再提供远程文件名（直观上您会期望顺序相反）。最后一个参数是传输模式：文本文件使用\
    \ FTP_ASCII，所有其他数据使用 FTP_BINARY。\n\n## 检查服务器是否仍在响应\n\n假设您有一个 Web 服务器，并且想要定期检查它是否再次崩溃。那么使用\
    \ PHP 脚本执行此任务是个好主意。只需向服务器打开一个套接字并等待（fsockopen() 的最后一个参数是超时值）。在此时间过去后，您就知道服务器是否在线或离线。\n\
    \n```\n<?php\n$server = 'localhost';\n$port = '80';\n$status = 'unavailable';\n\
    $fp = @fsockopen($server, $port, $errno, $errstr, 10);\nif ($fp) {\n    $status\
    \ = 'alive, but not responding';\n    fwrite($fp, \"HEAD / HTTP/1.0\\r\\n\");\n\
    \    fwrite($fp, \"Host: $server:$port\\r\\n\\r\\n\");\n    if (strlen(@fread($fp,\
    \ 1024)) > 0) {\n        $status = 'alive and kicking';\n    }\n    fclose($fp);\n\
    }\necho \"The server is $status.\";\n?>\n```\n\n*检查服务器状态（serverstatus.php）*\n\n\
    ### 提示\n\n如果只需要检查一个服务器的状态，这效果很好。如果有多个服务器，这种方法有一些缺点。fsockopen() 的调用可能需要长达超时值的时间才会执行下一个命令。\n\
    因此，所有服务器都是按顺序同步检查的。对于多个服务器来说，这花费的时间太长了。\n然而，使用 PHP 5 和流套接字，这可以异步完成。代码有点复杂，但 Wez\
    \ Furlong 在 http://netevil.org/node.php?nid=280 详细解释了这种方法。\n\n## 理解 Web 服务\n\n\
    有些人说 Web 服务只是旧酒装新瓶，因为其背后的想法并不新鲜。基本原理是：两台机器相互通信。例如，一台机器包含一些业务逻辑或更一般地包含一些信息，而另一台机器请求这些信息（或想要使用业务逻辑）。\n\
    \n这已经做了很多年，但仅在几年前，主要参与者才坐在一起开始着手制定协议，将整个通信建立在标准之上。其中一些标准现在由万维网联盟（W3C）监管，而其他标准则由结构化信息标准推进组织（OASIS）联盟管理。\n\
    \n有大量关于 Web 服务的书籍，页数相当多。然而，根据本短语手册的概念，本章内容简单但仍提供您所需了解的一切。有一种协议用于传输对 Web 服务的请求及其响应。有几种可能性，但以下两种最常见：\n\
    \n- XML-RPC 代表远程过程调用，使用非常简单的 XML 方言传输函数调用、参数和返回值。这种方法有时称为 REST，即表征状态。关于哪种协议更好——这种协议还是下一个——存在一些激烈的争论。简单而粗糙地说：两者都有优点（和缺点）。\n\
    - SOAP 一度代表简单对象访问协议，但由于它既不简单也不太与对象访问有关，今天 SOAP 就只是代表……SOAP。它是一个相当复杂的协议，但克服了 XML-RPC\
    \ 的许多限制（顺便说一下，XML-RPC 是由一些也参与 SOAP 工作的人员创建的）。\n\n大多数情况下，XML-RPC 或 SOAP 调用通过 HTTP\
    \ 作为承载协议传输。然而，其他协议也是可能的，包括简单邮件传输协议（SMTP）甚至用户数据报协议（UDP）。\n\n使用 SOAP 时还有一个更重要的方面。当您确切知道\
    \ Web 服务是如何实现的时，您也知道如何调用（访问或使用）它。然而，很多时候这些信息不可用，因此必须有一种 Web 服务的自描述，其中包含所有相关信息，例如暴露了哪些方法和函数，它们期望哪些参数和数据类型，以及它们返回什么。这也可以使用专门制作的\
    \ XML 文件来完成。其背后的标准是 Web 服务描述语言\n"
