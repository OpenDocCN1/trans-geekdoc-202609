    \        'http://soapinterop.org/'\n    );\n    $soap->service(isset($HTTP_RAW_POST_DATA)\
    \ ?\n        $HTTP_RAW_POST_DATA : '');\n\n    function add($a, $b) {\n      \
    \  return $a + $b;\n    }\n?>\n```\n\n*A WSDL-enabled Web Service with NuSOAP\
    \ (wsdl-nusoap-server.php)*\n\nBack to the WSDL: Figure 9.3 shows the Web Service\
    \ in the browser when called using GET. A click on the link shows some information\
    \ about the add() method. In Figure 9.4, you see what happens when you append\
    \ ?WSDL to the URL of the script (or click on the WSDL link): The WSDL for the\
    \ service is automatically generated. Imagine if you had to do this manually...\n"
  mdcn: "\n## 检查服务器是否仍在响应\n\n今天，WSDL 已被所有相关的 Web 服务使用，因为这样使用它们就相当简单。大多数服务器端技术都提供一种（或多种）方式来读取\
    \ WSDL，然后像访问本地可用的类一样访问 Web 服务。\n\n生成所有这些 XML 相当复杂。并不是说 PHP 没有良好的 XML 支持，而是语法可能相当困难。幸运的是，一些扩展和外部包使得使用\
    \ Web 服务变得容易得多。以下各节都实现了一个仅将两个数字相加的 Web 服务。基于这些信息，你肯定会更有创意并创建一些实际的 Web 服务。\n\n\
    ## 使用 PEAR::XML-RPC 创建 Web 服务\n\n有多种 XML-RPC 实现，但使用最广泛且也在积极开发中的是 PEAR::XML-RPC，可在\
    \ http://pear.php.net/package/XML_RPC/ 获取。它是另一款 XML-RPC 库的 PEAR 移植版，并添加了一些在原始发行版中未包含的修复。你可以使用\
    \ pear upgrade XML_RPC 安装它，以获取最新最好的版本。\n\n要提供这样的 Web 服务，你必须实例化 XML_RPC_Server\
    \ 类并提供有关服务的一些信息：使用哪个函数、其描述，以及当然签名（传递哪些参数类型、返回哪种数据类型）。前面的代码包含了简单“加两个数字”Web 服务的这些信息。\n\
    \n```php\n<?php\n    require_once 'XML/RPC/Server.php';\n\n    $description =\
    \ 'adds two numbers';\n    $signature = array(\n        array('int', 'int', 'int')\n\
    \    );\n\n    $xmlrpc = new XML_RPC_Server(\n        array('phrasebook.php.add'\
    \ =>\n            array(\n                'function' => 'add',\n             \
    \   'docstring' => $description,\n                'signature' => $signature\n\
    \            )\n        )\n    );\n?>\n```\n\n*有关 XML-RPC Web 服务的信息\n(xmlrpc-pear-server.php；摘录)*\n\
    \n请注意，签名包含所有输入参数的数据类型加上返回值的类型；这就是为什么 'int' 出现了三次而不是两次。\n\n现在唯一缺少的就是实际的业务逻辑，即 add\
    \ 函数。这有点棘手：首先，getParam() 方法返回提供给函数的所有参数；然后，scalarval() 检索此类参数的实际值。然后，可以通过返回合适的\
    \ XML_RPC_Response 对象来完成数字的相加。例如：\n\n```php\nfunction add($params) {\n    $a =\
    \ $params->getParam(0);\n    $b = $params->getParam(1);\n    if (isset($a) &&\
    \ isset($b)) {\n        if ($a->scalartyp() == 'int' && $b->scalartyp() == 'int')\
    \ {\n            $a = $a->scalarval();\n            $b = $b->scalarval();\n  \
    \          $c = new XML_RPC_Value($a + $b, 'int');\n            return new XML_RPC_Response($c);\n\
    \        } else {\n            global $XML_RPC_erruser;\n            return new\
    \ XML_RPC_Response(0,\n                $XML_RPC_erruser,\n                'wrong\
    \ parameters');\n        }\n    }\n}\n```\n\n## 使用 PEAR::XML-RPC 消费 Web 服务\n\n\
    查询 Web 服务相当容易。只需实例化 XML_RPC_Client 类（提供服务的名称、服务器和端口），然后制作包含所有参数的消息，最后将该消息发送到服务器。你会收到\
    \ Web 服务调用的结果——或错误消息。该代码调用上一节中的 Web 服务，假设它可通过端口 80 上的 http://localhost/xmlrpc-pear-server.php\
    \ 访问。\n\n```php\n<?php\nrequire_once 'XML/RPC.php';\n\n$a = 47;\n$b = 11;\n\n\
    $xmlrpc = new XML_RPC_Client(\n'/xmlrpc-pear-server.php',\n'localhost',\n80\n\
    );\n\n$msg = new XML_RPC_Message(\n  'phrasebook.php.add',\n  array(\n    new\
    \ XML_RPC_Value($a, 'int'),\n    new XML_RPC_Value($b, 'int')\n  )\n);\n\n$response\
    \ = $xmlrpc->send($msg);\n$result = $response->value();\nif (!$response->faultCode())\
    \ {\n  echo \"$a + $b = \" . $result->scalarval();\n} else {\n  echo 'Error #'\
    \ . $response->faultCode() . ': ' .\n    $response->faultString();\n}\n?>\n```\n\
    \n调用 XML-RPC Web 服务 (xmlrpc-pear-client.php)\n\nTIP\n当你调用 $xmlrpc->setDebug(1)\
    \ 时，调试消息会被打开，使你更容易找出问题所在。\n\nNOTE\n仅适用于 PHP 5，有一个名为 XMLRPCi 的新扩展（i 代表 improved，即改进版），它使用\
    \ libxml2 进行 XML-RPC 调用。然而，目前仅发布过一次，且文档非常有限，因此几乎没有被使用。\n\n## 使用 NuSOAP 创建 Web\
    \ 服务\n\n在 http://dietrich.ganx4.com/nusoap/ 和 http://sourceforge.net/projects/nusoap/\
    \ 上，你可以找到 NuSOAP，这是 PHP 中最知名的 SOAP 类之一。有些人甚至可能知道它的前身 SOAPx4。一段时间以来，发布并不频繁，但现在该项目再次活跃起来。尽管如此，你最好还是检查\
    \ Concurrent Versions System (CVS) 系统以获取最新代码。即使你在那里找到多个文件，nusoap.php 才是你需要的那个。\n\
    \n```php\n<?php\n    require_once 'nusoap.php';\n\n    $soap = new soap_server;\n\
    \    $soap->register('add');\n    $soap->service($HTTP_RAW_POST_DATA);\n\n   \
    \ function add($a, $b) {\n        return $a + $b;\n    }\n?>\n```\n\n*使用 NuSOAP\
    \ 创建 Web 服务 (nusoap-server.php)*\n\nNOTE\n截至本文撰写时，NuSOAP 仅在 PHP 4 下工作，但据传 PHP\
    \ 5 的移植正在进行中。\n\n使用 NuSOAP 创建 Web 服务非常简单，因为该模块处理了所有繁琐的事情，包括 SOAP。只需按照以下步骤操作：\n\
    \n- 1. 编写你想要作为 Web 方法公开的函数\n- 2. 实例化 soap_server 类\n- 3. 将你的函数注册到 SOAP 服务器\n-\
    \ 4. 调用 service() 方法并提交 $HTTP_RAW_POST_DATA 作为参数\n\n该代码使用 NuSOAP 实现了一个 SOAP 服务器。图\
    \ 9.2 显示了当你尝试直接从客户端调用 Web 服务时浏览器中的输出。错误消息说 XML 为空——当然，因为我们没有发送请求！\n\n## 使用 NuSOAP\
    \ 自动生成 WSDL\n\n如前所述，当前 Web 服务几乎总是使用 WSDL。手动编写 WSDL 真的很痛苦且容易出错，但大多数严肃的 PHP Web\
    \ 服务实现可以自动创建 WSDL。然而，由于 PHP 不是强类型语言，它们需要一些帮助。\n\n要使用 NuSOAP 实现这一点，前一节的代码必须稍微扩展一下。首先，必须调用\
    \ configureWSDL() 方法来提供服务的名称和命名空间。然后，必须提供方法签名（哪些参数传入，哪些参数传出）。然后启动服务器。然而，这次会检查\
    \ $HTTP_RAW_POST_DATA 是否已设置。这是因为当它未设置时，用户发出了 GET 请求，因此他可能只是想要 WSDL 描述。\n\n```php\n\
    <?php\n    require_once 'nusoap.php';\n\n    $soap = new soap_server;\n    $soap->configureWSDL('AddService',\
    \ 'http://php.phrasebook.org/');\n    $soap->wsdl->schemaTargetNamespace = 'http://soapinterop.org/xsd/';\n\
    \    $soap->register(\n        'add',\n        array('a' => 'xsd:int', 'b' =>\
    \ 'xsd:int'),\n        array('c' => 'xsd:int'),\n        'http://soapinterop.org/'\n\
    \    );\n    $soap->service(isset($HTTP_RAW_POST_DATA) ?\n        $HTTP_RAW_POST_DATA\
    \ : '');\n\n    function add($a, $b) {\n        return $a + $b;\n    }\n?>\n```\n\
    \n*使用 NuSOAP 的 WSDL 启用 Web 服务 (wsdl-nusoap-server.php)*\n\n回到 WSDL：图 9.3 显示了使用\
    \ GET 调用时浏览器中的 Web 服务。点击链接会显示有关 add() 方法的一些信息。在图 9.4 中，你可以看到当你在脚本 URL 后附加 ?WSDL\
    \ 时（或点击 WSDL 链接）会发生什么：服务的 WSDL 会自动生成。想象一下如果必须手动完成这项工作...\n"
