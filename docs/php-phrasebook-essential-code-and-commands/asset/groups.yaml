    \    $timestamp)\n    );\n}\n\nsession_set_save_handler(\n    'sess_open', 'sess_close',\
    \ 'sess_read',\n    'sess_write', 'sess_destroy', 'sess_gc');\n?>\n```\n\n**提示**：下载存档中的\
    \ `session.sql` 文件包含一个用于在 MySQL 中创建数据库表的 SQL 文件。`session_mysqli_readwrite.php`\
    \ 文件使用了前面代码列表中的代码，并在会话中保存了一些数据。\n\n图 5.8 显示了数据写入后会话表中的内容。\n\n![](img/1e6d362f187af50011d2666ddaa68739_167_0.png)\n\
    \n图 5.8 会话数据现在存储在数据库中。\n\n### 使用会话创建安全区域\n\n```php\nsession_start();\nif (!(isset($_SESSION['authorized'])\
    \ && $_SESSION['authorized'] != '')) {\n    header(\"Location: login.php?url=\"\
    .nl2br($_SERVER['PHP_SELF']));\n}\n```\n\n会话可以成为保护网站某些部分的好方法。其方法很简单：在用户通过身份验证后，将此信息写入会话变量。在所有受保护的页面上，检查此会话变量是否存在。\n\
    \n首先，你可以检查该会话变量。本节开头的代码必须（使用 `require_once`）包含在所有只有授权用户才能访问的页面中。\n\n前面代码将用户重定向到的\
    \ `login.php` 脚本包含一个 HTML 表单（另见图 5.9），并检查所提供的数据是否正确（你可能需要添加自己的用户和密码）。你可能已经注意到，之前的\
    \ URL 是作为 GET 参数提供的，因此，如果可用，登录代码会将用户重定向回其来源页面：\n\n```php\n<?php\n    if (isset($_POST['user'])\
    \ && $_POST['user'] == 'Damon' &&\n        isset($_POST['pass']) && $_POST['pass']\
    \ == 'secret') {\n        session_start();\n        $_SESSION['authorized'] =\
    \ 'ok';\n        $url = (isset($_GET['url'])) ? nl2br($_GET['url']) : 'index.php';\n\
    \        header(\"Location: $url\");\n    }\n?>\n```\n\n*检查用户凭据（login.php；节选）*\n\
    \n就是这样！下载存档中的 `secret.php` 脚本包含一些相当机密的信息，并受前面代码列表中的代码保护。\n\n![](img/1e6d362f187af50011d2666ddaa68739_169_0.png)\n\
    \n图 5.9 登录表单——注意 URL 中的来源页面。\n\n### 不使用会话创建安全区域\n\n```php\n$_SERVER['PHP_AUTH_USER']\
    \ == 'Shelley' && $_SERVER['PHP_AUTH_PW'] == 'TopSecret'\n```\n\n如果使用 PHP 的会话管理进行身份验证似乎开销过大，你还有另外两种选择。首先，配置\
    \ Web 服务器，使得只有授权用户才能访问某些文件或目录。例如，Apache 用户可以使用 `.htaccess` 文件；`http://apache-server.com/tutorials/ATusing-htaccess.html`\
    \ 包含了一些有关这方面的有用信息。Microsoft IIS 提供了访问权限的图形用户界面（GUI）管理，因此也可以这样做。\n\n```php\n<?php\n\
    if (!(isset($_SERVER['PHP_AUTH_USER']) &&\n    isset($_SERVER['PHP_AUTH_PW'])\
    \ &&\n    $_SERVER['PHP_AUTH_USER'] == 'Shelley' &&\n    $_SERVER['PHP_AUTH_PW']\
    \ == 'TopSecret')) {\n    header('WWW-Authenticate: Basic realm=\"Secured area\"\
    ');\n    header('Status: 401 Unauthorized');\n} else {\n?>\n<!DOCTYPE html PUBLIC\
    \ \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    >\n...\n<?php\n}\n?>\n```\n\n*使用 HTTP 保护 PHP 页面（http_authentication.php；节选）*\n\
    \n不过，一种或多或少与平台无关的方式是通过 HTTP 进行身份验证。如果你发送 HTTP 状态码 401（未授权），浏览器会提示客户端输入用户名和密码。然后可以通过\
    \ `$_SERVER['PHP_AUTH_USER']` 和 `$_SERVER['PHP_AUTH_PW']` 获取这些信息——但前提是你将 PHP 作为服务器模块运行，而不是以通用网关接口（CGI）模式运行。\n\
    \n然后你可以检查这些信息，并决定是再次发送 401 头，还是显示页面的实际内容。前面的代码列表展示了该实现。图 5.10 显示了提示输入用户名和密码的界面。\n\
    \n![](img/1e6d362f187af50011d2666ddaa68739_171_0.png)\n\n图 5.10 浏览器提示输入用户名和密码。\n\
    \n### PEAR 提供了什么？\n\n以下 PEAR 包提供了与会话和 HTTP 身份验证相关的功能：\n\n- Auth 实现了多种用户身份验证方式，从而保护\
    \ PHP 页面。\n- HTTP_Session 基于 PHP 的会话机制，但提供了面向对象的会话信息访问方式。\n\n## 使用服务器文件系统上的文件\n\
    \n尽管数据库非常普遍，但使用文件系统存储数据也是一种真正可行的替代方案。通常，以这种方式实现更容易。有时它更快，更重要的是，所有托管提供商都启用了文件访问，而数据库支持可能需要额外付费。\n\
    \nPHP 通过一组特定函数支持文件处理。使用包装器，同样的技术也可以用于通过超文本传输协议（HTTP）或文件传输协议（FTP）等协议访问远程数据，但这将在第\
    \ 9 章“与他人通信”中更详细地介绍。\n\n本章涵盖读取和写入文件等标准任务，以及以 ZIP 或 BZ2 格式归档文件等高级任务。其中许多任务可以用不同但同样可用的方式解决，因此你真正拥有选择的自由。\n\
    \n### 打开和关闭文件\n\n```php\nif ($fp = @fopen('file.txt', 'at')) {\n    fclose($fp);\n\
    }\n```\n\n对于大多数文件系统函数，必须首先打开文件。`fopen()` 函数正是执行此操作，并返回所谓的文件句柄，即指向文件的指针。然后，该文件句柄可以在后续函数中使用，例如从文件中读取信息或向其写入信息。\n\
    \n`fopen()` 至少需要两个参数：\n\n- 文件名\n- 访问文件时使用的文件模式\n\n```php\n<?php\n    if ($fp =\
    \ @fopen('file.txt', 'at')) {\n        echo 'File opened.';\n        fclose($fp);\n\
    \        echo '<br />File closed.';\n    } else {\n        echo 'Error opening\
    \ file.';\n    }\n?>\n```\n\n*打开（和关闭）文件（fopen.php）*\n\n文件模式参数非常值得关注。这是一个由一个或多个字符组成的字符串。第一个字符是\
    \ `a`、`r`、`w` 或 `x` 之一；之后可以使用一个或多个特殊修饰符。表 6.1 显示了所有模式。\n\n"
