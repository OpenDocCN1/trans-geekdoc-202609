    # Table 1.2 Continues


    | Special Character | Description | Example |

    |---|---|---|

    | $ | End of the string | a$ means a string that ends with a |

    | ? | 0 or 1 times (refers to the previous character or expression) | ab? means
    a or ab |

    | * | 0 or more times (refers to the previous character or expression) | ab* means
    a or ab or abb or ... |

    | + | 1 or more times (refers to the previous character or expression) | ab+ means
    ab or abb or abbb or ... |

    | [...] | Alternative characters | PHP[45] means PHP4 or PHP5 |

    | - (used within square brackets) | A sequence of values | PHP[3-5] means PHP3
    or PHP4 or PHP5 |

    | ^ (used within square brackets) | Matches anything but the following characters
    | [^A-C] means D or E or F or ... |

    | | | Alternative patterns | PHP4|PHP5 means PHP4 or PHP5 |

    | (...) | Defines a subpattern | (a)(b) means ab, but with two subpatterns (a
    and b) |'
