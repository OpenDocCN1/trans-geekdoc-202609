    \n本章前面的所有段落都使用了当前日期和时间。然而，也可以使用任何其他任意日期和时间值。为此，相关函数（尤其是 date() 和 strftime()）接受第二个参数——要分析的日期的时间戳。此时间戳是一个整数值，即所谓的\
    \ epoch 格式的日期和时间。这是自 1970 年 1 月 1 日格林威治标准时间午夜以来经过的秒数——UNIX 纪元的开始。当前时刻的时间戳/epoch\
    \ 值可以使用 time() 或通过调用 date('U') 检索（参见表 3.1）。\n\n## 格式化特定日期\n\n如果你想使用另一个日期，mktime()\
    \ 就派上用场了。此函数将按年份、月份、日期、小时、分钟和秒提供的日期转换为 epoch 值。关于此函数最奇怪的事情可能是这些参数传递的顺序：\n\n- 1.\
    \ 小时\n- 2. 分钟\n- 3. 秒\n- 4. 月份\n- 5. 日期\n- 6. 年份\n\n你还可以提供一个可选的第七参数，无论是否使用夏令时（DST）。这在夏令时变更前后很相关，因为世界各地并不在同一时间发生。\n\
    \n前面的代码计算了本千年第一天的中午时间戳。由于没有公元 0 年，这就是 2001 年 1 月 1 日。\n\n> 如果你喜欢收集无用的事实：在 2001\
