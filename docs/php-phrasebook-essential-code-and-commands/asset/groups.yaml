    \ 中使用的空格字符。\n\n然而，函数 `strip_tags()` 会完全去掉所有 HTML 元素。如果只想保留某些元素（例如，使用 `<b>`、`<i>`\
    \ 和 `<br />` 标签的一些有限格式功能），则在 `strip_tags()` 的第二个参数中提供允许值的列表。以下脚本展示了这一点；图 1.1 描述了其输出。正如你所见，所有不需要的\
    \ HTML 标签已被删除；然而，其内容仍然存在。\n\n![](img/1e6d362f187af50011d2666ddaa68739_22_0.png)\n\
    \n*图 1.1 一些 HTML 标签已被剥离，但并非全部。*\n\n```php\n<?php\n$input = 'My parents <i>hate</i>\
