  - "[PAGE 149]\n\n# Saving Multiple Data\nin One Cookie\n\n```\nsetcookie('cookiedata',\
    \ serialize($cookiedata))\n```\n\nUsually, one cookie has one value: one string.\
    \ Therefore, to store multiple data in cookies, multiple cookies have to be used.\
    \ This, however, could create some problems, for instance the 20 cookies per domain\
    \ limit. Therefore, it might make sense to try to save multiple data in one cookie.\
    \ For this, an array comes to mind.\n\nHowever, only strings are allowed for the\
    \ value of a cookie. Therefore, the array must be transformed into a string using\
    \ serialize() and can then be converted back into an array using unserialize().\n\
    \n```\n<?php\n    require_once 'stripCookieSlashes.inc.php';\n\n    function setCookieData($arr)\
