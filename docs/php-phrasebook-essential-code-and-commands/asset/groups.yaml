  - "[PAGE 99]\n\n# Reading Out Form Data\n\n```\nfunction processData() {\n    global\
    \ $HTTP_POST_VARS;\n    // now you may access $HTTP_POST_VARS\n}\n```\n\nHowever,\
    \ these arrays can be deactivated (PHP 5 onward), as well, using this php.ini\
    \ directive:\n`register_long_arrays = Off`\n\nTherefore, the following is the\
    \ only recommended method to access form data today in PHP:\n\n+   - $_GET for\
    \ GET data\n+   - $_POST for POST data\n+   - $_REQUEST for POST, GET, and cookies\
    \ (not recommended)\n\nThe keys of these arrays are the names of the form values.\
    \ The $_* arrays are so-called superglobal arrays—that is, you do not have to\
    \ use the global keyword to get them into global scope; they are already available\
    \ within functions.\n\nWhen you have decided which superglobal array to use (depending\
    \ on the form’s method), accessing form data is easy: $_GET[<formfieldname>] or\
    \ $_POST[<formfieldname>] retrieves the value in the form element. Table 4.1 shows\
    \ which data is returned for which form field type.\n\n# Table 4.1 Form Field\
    \ Types and Data Returned in $_GET/$_POST\n\n| Form Field Type | Data Returned\
    \ |\n|---|---|\n| Text field | Text in field |\n| Password field | Text in field\
    \ (clear text, not encrypted) |\n| Multiline text field | Text in field |"
