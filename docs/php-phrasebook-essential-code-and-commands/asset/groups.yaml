    <?php\n}\n?>\n```\n\n## Writing All Form Data into a File\n\n```php\n$data[] =\
    \ $_POST;\nfile_put_contents('formdata.txt',\nserialize($data));\n```\n\nAfter\
    \ a user fills out a form correctly, what do you do with the form data? A very\
