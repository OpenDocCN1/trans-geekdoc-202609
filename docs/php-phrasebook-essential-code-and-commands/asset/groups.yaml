  - "[PAGE 141]\n\n# Getting Rid of \"Magic Quotes\" in Cookies\n\nIf magic_quotes\
    \ is set, stripslashes() is applied recursively to all data in $_COOKIE.\n\n```\n\
    <?php\nfunction stripCookieSlashes($arr) {\n    if (!is_array($arr)) {\n     \
    \   return stripslashes($arr);\n    } else {\n        return array_map('stripCookieSlashes',\
    \ $arr);\n    }\n}\n\nif (get_magic_quotes_gpc()) {\n    $_COOKIE = stripCookieSlashes($_COOKIE);\n\
    }\n?>\n```\n\n*Removing \"Magic Quotes\" from Cookies (stripCookieSlashes.inc.php)*\n\
    \nThis file should then be included in all PHP scripts that read cookies, using\
    \ this statement:\n\n```\nrequire_once 'stripCookieSlashes.inc.php'\n```\n\n#\
    \ Setting a (Reasonable) Expiry Date\n\nThe expiry date of a cookie is the third\
    \ parameter for setcookie(). It is an integer value; therefore, the epoche value\
    \ for a time stamp must be used. Chapter 3, “Date and Time,” contains quite a\
    \ lot of information on how to work with this type of information."
  - "[PAGE 142]\n\n```\n<?php\n    setcookie('version', phpversion(), time() +\n \
    \       21*24*60*60);\n?>\nTried to send cookie.\n```\n\n*Setting a Cookie with\
    \ a Relative Expiry Date (setcookie-expiry.php)*\n\nUsually, it is a good thing\
    \ to set a relative expiry date for a cookie (\"in three weeks\"), rather than\
    \ an absolute date (\"end of May 2006\"). If you use absolute dates, you might\
    \ have to change your script on a regular basis because the absolute expiry date\
    \ might arrive soon. It is also considered very unprofessional to set expiry dates\
    \ that are in the very distant future, for instance in the year 2030. The client\
    \ that receives this cookie will most certainly not be booted any more in that\
    \ year.\n\nTherefore, use a relative date. The PHP function time() retrieves the\
    \ current epoche value; then add to this the number of seconds you want the cookie\
    \ to live. The code at the beginning of this phrase sets a cookie that will exist\
    \ for three weeks.\n\n# Setting a Client-Specific Expiry Date\n\n```\nsetcookie('version',\
    \ phpversion(),\n    $_GET['time'] + 21*24*60*60)\n```\n\nKeep in mind that the\
    \ decision of when a cookie expires is made on the client side, using the client\
    \ time settings. So, if the client has the wrong date (which is something you\
    \ cannot control from the server-side)."
  - "[PAGE 143]\n\n# Setting a Client-Specific Expiry Date\n\nyour cookies might expire\
    \ sooner than you expect. So, don’t try to set cookies that live for just one\
    \ hour or so; small things like DST could destroy your plan.\n\n```\n<?php\nif\
    \ (isset($_GET['time']) && is_int($_GET['time']))\n{\n    setcookie('version',\
    \ phpversion(),\n        $_GET['time'] + 21*24*60*60);\n} else {\n    setcookie('version',\
    \ phpversion(),\n        time() + 21*24*60*60);\n}\n?>\n```\n\nTried to send cookie.\n\
    \n*Setting a Cookie with a Specific Expiry Date (setcookie-specific.php)*\n\n\
    However, with a bit of JavaScript, it can be possible to avoid this trap. The\
    \ code in the following listing is client-side JavaScript code that determines\
    \ the current time (client-side!) as an epoche value and sends it to a server-side\
    \ script, setcookie-specific.php. The main difference between PHP’s time() function\
    \ and JavaScript’s getTime() method is that the latter returns the number of milliseconds\
    \ since January 1, 1970, whereas the former just works with the number of seconds.\
    \ So, the JavaScript value first has to be divided by 1,000 and rounded down.\n\
    \nThe code for this file can be seen at the beginning of this phrase: The transmitted\
    \ value is taken as the basis for the calculation of the relative cookie expiration\
    \ date."
  - "[PAGE 144]\n\n```\n<script language=\"JavaScript\"\n    type=\"text/javascript\"\
    ><!--\n    var epoche = (new Date()).getTime();\n    epoche = Math.floor(epoche\
    \ / 1000);\n    location.replace(\"setcookie-specific.php?time=\" +\n        epoche);\n\
    //--></script>\n```\n\n# Deleting a Cookie\n\n```\nsetcookie('version', '', time()\
    \ - 10*365*24*60*60);\n```\n\nAn intuitive way to delete a cookie is to set its\
    \ value to an empty string. However, the cookie is still there, albeit without\
    \ a value. A better way is to additionally send a cookie with the same name again,\
    \ but provide an expiry date that is in the past. Again, incorrect local time\
    \ settings have to be taken into account, so use a really small expiry date, for\
    \ instance 10 years before today. This listing implements this and deletes the\
    \ version cookie that has been sent by the previous listings. Here, both methods\
    \ are combined: The cookie value is set to an empty string, and the expiry date\
    \ is in the past. Figure 5.4 shows the result: The browser tries to delete the\
