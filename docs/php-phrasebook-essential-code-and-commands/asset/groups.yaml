    \ found.';\n}\n```\n\nWhen looking for substrings in strings, strpos() is used\
    \ (and its counterpart strrpos(), which searches from the end of the string).\
    \ The tricky thing about this function is that it returns the index of the first\
    \ occurrence of the substring, or false otherwise. That means that the preceding\
    \ code snippet is incorrect.\n\nThe preceding code snippet is incorrect because\
    \ if $string happens to start with $substring, strpos() returns 0, which evaluates\
