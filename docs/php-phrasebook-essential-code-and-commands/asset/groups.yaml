  md: "\n## Moving Uploaded Files to a Safe Location\n\n```\n<input type=\"file\"\
    \ name=\"File\" />\n<input type=\"submit\" name=\"Submit\" value=\"Submit form\"\
    \ />\n</form>\n<?php\n}\n?>\n```\n\n*Moving an Uploaded File to a New Location\
    \ (upload-move.php; excerpt)*\n\nSuppose the path /tmp exists and is writable\
    \ by the web server and the PHP process. Then, the preceding code moves the uploaded\
    \ file to this directory, using its original filename (and you do not care whether\
    \ the filename already exists).\n\n## What Does PEAR Offer?\n\nThe following PEAR\
    \ packages offer functionality helpful for processing form data of any kind:\n\
    \n- HTML_QuickForm is a very convenient package to create forms using an OOP (object-oriented\
    \ programming) syntax and includes very mighty validation and processing features\n\
    - HTTP_Upload helps to manage file uploads and offers advanced features such as\
    \ providing valid extensions for uploads\n\n## Remembering Users (Cookies and\
    \ Sessions)\n\nHypertext Transfer Protocol (HTTP) is a stateless protocol. To\
    \ say it in a simple way: A client (web browser) connects to a web server, sends\
    \ a request, and gets a response. Then, the connection is closed. The consequence\
    \ is the next time the same client sends a request to the same web server, it\
    \ is a new request, so the web server cannot identify the caller. This is, of\
    \ course, a problem for applications in which state must be maintained, for instance\
    \ e-commerce applications with a shopping-cart functionality.\n\nHowever, you\
    \ can overcome this limitation in several ways. The basic idea is to send some\
    \ information with the HTTP response; to try to achieve that, this information\
    \ is sent back with all subsequent requests to that server. The following possibilities\
    \ exist:\n\n- Sending the data via POST (that is, a form) is required each time\n\
    - Sending the data via GET (that is, by appending this information to the request's\
    \ uniform resource locator [URL])\n- Sending the data as part of the HTTP header\
    \ (in the form of a cookie)\n\nIn real-world projects, one of two methods is used:\
    \ sessions (via GET or cookies) and cookies.\n\n## Understanding Cookies\n\nA\
    \ cookie is sent as part of the HTTP header and is basically a name-value pair.\
    \ Their main disadvantage is it is possible to deactivate cookies in the web browser\
    \ (and also to filter them out in proxy servers). Some people think cookies create\
    \ privacy issues. Part of this might have been caused by an article written by\
    \ John Udell in March 1997, in which he wrote that every cookie can be read from\
    \ every web server, thus there is no privacy. This caused quite a stir, although,\
    \ unfortunately, the correction two months later did not get that amount of attention.\n\
    \nThe fact is that cookies have some limitations:\n\n- Cookies are tied to domains,\
    \ usually the domain that sent the cookie.\n- Cookies can be tied to paths on\
    \ the web server.\n- A cookie contains only text information, 4096 bytes at max\
    \ (including the cookie name and the = character between the name and value).\n\
    - Browsers must only accept up to 20 cookies per domain and 300 cookies in total\
    \ (although some browsers accept more).\n\n> **NOTE**\n> The (unofficial) cookie\
    \ specification goes back to Netscape and is still available at http://wp.netscape.com/newsref/std/cookie_spec.html.\
    \ There have been attempts to create a special Request for Comment (RFC) for next-generation\
    \ cookies, but this hasn't found any reasonable browser support yet.\n\nCookies\
    \ are sent as part of the HTTP header. If a cookie is set, the HTTP header entry\
    \ Set-Cookie is created. The name and value of the cookie (both strings) follow\
    \ and, optionally, further information such as expiration date, domain, and path\
    \ of the cookie. For instance, when visiting http://www.php.net/, the PHP website\
    \ sends this header entry (your mileage may vary, especially in terms of the language\
    \ and IP address used):\n\n```\nSet-Cookie: COUNTRY=DEU%2C84.154.17.84; expires=Thu,\
    \ 19-May-05 15:23:29 GMT; path=/; domain=.php.net\n```\n\nWhen the browser (or\
    \ the user) accepts the cookie, it is then sent back to the server in the HTTP\
    \ header Cookie:\n\n```\nCookie: COUNTRY=DEU%2C84.154.17.84\n```\n\nA cookie can\
    \ have an expiration date. If that is set, the cookie lives up to this date (at\
    \ most) and is a so-called persistent cookie. After that, the browser automatically\
    \ deletes the cookie—but this could also happen earlier, for instance when the\
    \ maximum number of cookies in the browser is reached and the oldest cookies are\
    \ purged. If, however, no cookie expiration date is set, a so-called session cookie\
    \ or temporary cookie has been created. This lives as long as the web browser\
    \ is running. When it is closed, the cookie is deleted.\n\n> TIP\n> To actually\
    \ see the HTTP headers, you could use special extensions to standard web browsers.\
    \ For Mozilla browsers (including Firefox), the LiveHTTPHeaders extension available\
    \ at http://livehttpheaders.mozdev.org/ is a real time-saver. Users of Microsoft\
    \ Internet Explorer might be interested in installing ieHTTPHeaders, an Explorer\
    \ bar available from http://www.blunck.info/iehttpheaders.html. Figure 5.1 shows\
    \ some of the output the Firefox extension shows when accessing the PHP home page.\n\
    \n![](img/1e6d362f187af50011d2666ddaa68739_137_0.png)\n\nFigure 5.1 Cookies are\
    \ set as part of the HTTP header.\n\n## Creating a Cookie\n\n```\n<?php\n    setcookie('version',\
    \ phpversion());\n?>\nTried to send cookie.\n```\n\nTo create a cookie, the PHP\
    \ function setcookie() can be used. It expects the following parameters; however,\
    \ only the first one is mandatory:\n\n- 1. The name of the cookie\n- 2. The value\
    \ of the cookie\n- 3. The expiry date (in UNIX epoch format)\n- 4. The path on\
    \ the web server from which the cookie may be accessed\n- 5. The domain from which\
    \ the cookie may be accessed\n- 6. Whether the cookie may only be sent using secure\
    \ (HTTP Secure [HTTPS]/Secure Sockets Layer [SSL]) connections\n\nThe preceding\
    \ code sets a simple session cookie with the current PHP version as its value.\n\
    \nFigure 5.2 shows a cookie warning in the Firefox browser. You can clearly see\
    \ the cookie name and script.\n\n## Reading Out Cookies\n\nAll cookies to which\
    \ the server has access (not all cookies that are stored in the browser!) are\
    \ available in the superglobal array $_COOKIE. The foreach loop reads in all cookies\
    \ and sends them to the client in an HTML table.\n\n```\n<table>\n<?php\n  foreach\
    \ ($_COOKIE as $name => $value) {\n    printf('<tr><td>%s</td><td>%s</td></tr>',\n\
    \      htmlspecialchars($name),\n      htmlspecialchars($value));\n  }\n?>\n</table>\n\
    ```\n\n*Reading Out Cookie (getcookie.php)*\n\n![](img/1e6d362f187af50011d2666ddaa68739_139_0.png)\n\
    \nFigure 5.2 Firefox receives the cookie and asks the user what to do.\n\n**WARNING**\n\
    Because cookies are sent as part of the HTTP header, they have to be created before\
    \ any Hypertext Markup Language (HTML) content is sent out (unless you are using\
    \ output buffering). Otherwise, you receive an error message such as the one shown\
    \ in Figure 5.3.\n\n![](img/1e6d362f187af50011d2666ddaa68739_140_0.png)\n\nFigure\
    \ 5.3 Cookies have to be sent prior to any HTML content.\n\nNOTE\nUsually, PHP\
    \ takes care of escaping special characters in the cookie values (in URL format).\
    \ However, since PHP 5, it is possible to do this manually by sending raw cookie\
    \ data. For this, the function setrawcookie() accepts the same parameter as setcookie(),\
    \ but does not encode the cookie's value. You must do that manually, with the\
    \ function urlencode().\n\n## Getting Rid of \"Magic Quotes\" in Cookies\n\nMagic\
    \ quotes—which were covered and hated in the previous chapter, as well—also apply\
    \ to cookies because they are data coming from the client. So if magic_quotes\
    \ is on, single and double quotes are escaped with backslash characters. To get\
    \ rid of those, this code is used. A similar code was also used in the previous\
    \ chapter to remove these escape characters from form data (GET and POST data).\n"
  mdcn: "\n## 将上传文件移动到安全位置\n\n```\n<input type=\"file\" name=\"File\" />\n<input type=\"\
    submit\" name=\"Submit\" value=\"Submit form\" />\n</form>\n<?php\n}\n?>\n```\n\
    \n*将上传文件移动至新位置（upload-move.php；摘录）*\n\n假设路径 /tmp 存在，并且 Web 服务器和 PHP 进程对其具有写权限。那么，前面的代码会将上传的文件移动到该目录，并使用其原始文件名（并且你不用担心该文件名是否已存在）。\n\
    \n## PEAR 提供了什么？\n\n以下 PEAR 包提供了有助于处理任何类型表单数据的功能：\n\n- HTML_QuickForm 是一个使用 OOP（面向对象编程）语法创建表单的非常便捷的包，并且包含非常强大的验证和处理功能\n\
    - HTTP_Upload 有助于管理文件上传，并提供高级功能，例如为上传提供有效的扩展名\n\n## 记住用户（Cookie 与会话）\n\n超文本传输协议（HTTP）是一种无状态协议。简单来说：客户端（Web\
    \ 浏览器）连接到 Web 服务器，发送请求，得到响应。然后连接关闭。结果是，同一客户端下一次向同一 Web 服务器发送请求时，这是一个新请求，因此 Web\
    \ 服务器无法识别调用者。当然，对于必须维护状态的应用来说，这是一个问题，例如带有购物车功能的电子商务应用。\n\n不过，你可以通过多种方式克服这一限制。基本思想是在\
    \ HTTP 响应中发送一些信息；为了做到这一点，这些信息会在之后对该服务器的所有请求中一并发送回来。存在以下可能性：\n\n- 每次都通过 POST（即表单）发送数据\n\
    - 通过 GET（即把信息附加到请求的统一资源定位符 [URL]）发送数据\n- 作为 HTTP 头的一部分（以 Cookie 的形式）发送数据\n\n在实际项目中，会使用两种方法之一：会话（通过\
    \ GET 或 Cookie）和 Cookie。\n\n## 理解 Cookie\n\nCookie 作为 HTTP 头的一部分发送，本质上是一个名值对。它们的主要缺点是可以在\
    \ Web 浏览器中停用 Cookie（也可以在代理服务器中将其过滤掉）。有些人认为 Cookie 会带来隐私问题。这部分可能是因为 John Udell\
    \ 在 1997 年 3 月撰写的一篇文章，他在文章中写道，每个 Web 服务器都可以读取每个 Cookie，因此没有隐私可言。这引起了不小的轰动，但不幸的是，两个月后的更正却并没有得到那么多的关注。\n\
    \n事实上，Cookie 有一些限制：\n\n- Cookie 与域名绑定，通常与发送 Cookie 的域名绑定。\n- Cookie 可以与 Web 服务器上的路径绑定。\n\
    - Cookie 只包含文本信息，最多 4096 字节（包括 Cookie 名称以及名称和值之间的 = 字符）。\n- 浏览器每个域名最多只能接受 20 个\
    \ Cookie，总共 300 个 Cookie（尽管有些浏览器接受更多）。\n\n> **注意**\n> （非官方的）Cookie 规范可以追溯到 Netscape，并且仍然可以在\
    \ http://wp.netscape.com/newsref/std/cookie_spec.html 获取。人们曾尝试为下一代 Cookie 创建专门的请求评论（RFC），但还没有得到任何主流浏览器的合理支持。\n\
    \nCookie 作为 HTTP 头的一部分发送。如果设置了 Cookie，就会创建 HTTP 头条目 Set-Cookie。随后是 Cookie 的名称和值（两者都是字符串），以及可选的其他信息，例如过期日期、域和\
    \ Cookie 路径。例如，访问 http://www.php.net/ 时，PHP 网站会发送这个头条目（具体内容可能有所不同，尤其是在使用的语言和 IP\
    \ 地址方面）：\n\n```\nSet-Cookie: COUNTRY=DEU%2C84.154.17.84; expires=Thu, 19-May-05\
    \ 15:23:29 GMT; path=/; domain=.php.net\n```\n\n当浏览器（或用户）接受 Cookie 后，它会通过 HTTP\
    \ 头 Cookie 发送回服务器：\n\n```\nCookie: COUNTRY=DEU%2C84.154.17.84\n```\n\nCookie 可以有过期日期。如果设置了过期日期，Cookie\
    \ 最多存活到该日期，即所谓的持久 Cookie。之后，浏览器会自动删除该 Cookie——但也可能更早发生，例如当浏览器中的 Cookie 数量达到上限时，最旧的\
    \ Cookie 会被清除。然而，如果没有设置 Cookie 过期日期，则创建了所谓的会话 Cookie 或临时 Cookie。它在 Web 浏览器运行期间一直存在。当浏览器关闭时，该\
    \ Cookie 会被删除。\n\n> **提示**\n> 要实际查看 HTTP 头，可以使用标准 Web 浏览器的特殊扩展。对于 Mozilla 浏览器（包括\
    \ Firefox），http://livehttpheaders.mozdev.org/ 上提供的 LiveHTTPHeaders 扩展可以节省大量时间。Microsoft\
    \ Internet Explorer 的用户可能对安装 ieHTTPHeaders 感兴趣，这是一个来自 http://www.blunck.info/iehttpheaders.html\
    \ 的 Explorer 栏。图 5.1 显示了 Firefox 扩展在访问 PHP 主页时显示的部分输出。\n\n![](img/1e6d362f187af50011d2666ddaa68739_137_0.png)\n\
    \n图 5.1 Cookie 作为 HTTP 头的一部分进行设置。\n\n## 创建 Cookie\n\n```\n<?php\n    setcookie('version',\
    \ phpversion());\n?>\nTried to send cookie.\n```\n\n要创建 Cookie，可以使用 PHP 函数 setcookie()。它需要以下参数；但只有第一个是必需的：\n\
    \n- 1. Cookie 的名称\n- 2. Cookie 的值\n- 3. 过期日期（UNIX 纪元格式）\n- 4. 可以从 Web 服务器访问 Cookie\
    \ 的路径\n- 5. 可以从哪个域访问 Cookie\n- 6. Cookie 是否只能通过安全（HTTP Secure [HTTPS]/Secure Sockets\
    \ Layer [SSL]）连接发送\n\n前面的代码设置了一个简单的会话 Cookie，其值为当前 PHP 版本。\n\n图 5.2 显示了 Firefox\
    \ 浏览器中的 Cookie 警告。你可以清楚地看到 Cookie 名称和脚本。\n\n## 读取 Cookie\n\n服务器可以访问的所有 Cookie（不是浏览器中存储的所有\
    \ Cookie！）都可以在超全局数组 $_COOKIE 中获取。foreach 循环读取所有 Cookie，并将它们以 HTML 表格形式发送给客户端。\n\
    \n```\n<table>\n<?php\n  foreach ($_COOKIE as $name => $value) {\n    printf('<tr><td>%s</td><td>%s</td></tr>',\n\
    \      htmlspecialchars($name),\n      htmlspecialchars($value));\n  }\n?>\n</table>\n\
    ```\n\n*读取 Cookie（getcookie.php）*\n\n![](img/1e6d362f187af50011d2666ddaa68739_139_0.png)\n\
    \n图 5.2 Firefox 接收 Cookie 并询问用户要做什么。\n\n**警告**\n因为 Cookie 作为 HTTP 头的一部分发送，所以必须在发送任何超文本标记语言（HTML）内容之前创建它们（除非你使用输出缓冲）。否则，你会收到类似图\
    \ 5.3 所示的错误消息。\n\n![](img/1e6d362f187af50011d2666ddaa68739_140_0.png)\n\n图 5.3\
    \ Cookie 必须先于任何 HTML 内容发送。\n\n注意\n通常，PHP 会负责对 Cookie 值中的特殊字符进行转义（采用 URL 格式）。但是，从\
    \ PHP 5 开始，可以通过发送原始 Cookie 数据来手动完成这件事。为此，函数 setrawcookie() 接受与 setcookie() 相同的参数，但不会对\
    \ Cookie 的值进行编码。你必须使用函数 urlencode() 手动进行编码。\n\n## 摆脱 Cookie 中的“魔法引号”\n\n魔法引号——上一章中也曾介绍过并遭到厌恶——同样适用于\
    \ Cookie，因为它们是来自客户端的数据。因此，如果 magic_quotes 开启，单引号和双引号会被反斜杠字符转义。为了去除这些转义，可以使用这段代码。上一章中也使用了类似的代码来从表单数据（GET\
    \ 和 POST 数据）中移除这些转义字符。\n"
