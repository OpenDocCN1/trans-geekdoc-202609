    \n- `sqlite_fetch_array()` 将结果集中的当前行作为关联数组返回（字段名成为键），并继续移动到下一行。\n- `sqlite_fetch_object()`\
    \ 将结果集中的当前行作为对象返回（字段名成为属性），并继续移动到下一行。\n- `sqlite_fetch_all()` 将整个结果集作为关联数组的数组返回。\n\
    \n```\n<table>\n<tr><th>#</th><th>Quote</th><th>Author</th><th>Year</th></tr>\n\
