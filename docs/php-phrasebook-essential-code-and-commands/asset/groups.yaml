  mdcn: "\n\n## 预填充文本字段和密码字段\n\n```\n<input type=\"text\" name=\"textfieldname\"\n\
    \    value=\"<?php\n    echo (isset($_POST['textfieldname'])) ?\n        htmlspecialchars($_POST['textfieldname'])\
    \ :\n        'default value';\n?>\" />\n```\n\n另一种可能性是从 cookie 中预填充表单值。当用户多次将数据输入表单时，这非常有用。这样，当他们几天后再次访问站点上的表单时，可以从\
    \ cookie 中检索旧数据。是的，只需要一个 cookie，因为每个域只允许 20 个 cookie。当然，我们使用数组来实现这一点。但是，cookie\
    \ 值只允许使用字符串，因此需要使用 serialize() 和 unserialize()。\n\n下面的函数从包含表单数据的 cookie 中检索值。优先级顺序如下：如果\
    \ $_GET 或 $_POST 中包含该字段的当前值，则使用该值（由于通常一次只使用这两种方法中的一种，因此存在专门针对 $_GET 和 $_POST 的函数版本）。否则，脚本会在\
    \ $_COOKIE 中查找关联值。如果找不到任何内容，则返回空字符串。\n\n```\nfunction getCookieData() {\n    if\
    \ (isset($_COOKIE['formdata'])) {\n        $formdata = $_COOKIE['formdata'];\n\
    \        if ($formdata != '') {\n            if (get_magic_quotes_gpc()) {\n \
    \               $formdata = stripslashes($formdata);\n            }\n        \
    \    return unserialize($formdata);\n        } else {\n            return array();\n\
    \        }\n    } else {\n        return null;\n    }\n}\n\nfunction getFormDataPOST($name)\
    \ {\n    if (isset($_POST[$name])) {\n        return $_POST[$name];\n    } else\
    \ {\n        $cookiedata = getCookieData();\n        if ($cookiedata != null &&\n\
    \            isset($cookiedata[$name])) {\n            return $cookiedata[$name];\n\
    \        }\n    }\n    return '';\n}\nfunction getFormDataGET($name) {\n    if\
    \ (isset($_GET[$name])) {\n        return $_GET[$name];\n    } else {\n      \
    \  $cookiedata = getCookieData();\n        if ($cookiedata != null &&\n      \
    \      isset($cookiedata[$name])) {\n            return $cookiedata[$name];\n\
    \        }\n    }\n    return '';\n}\n```\n\n*从 Cookie 中检索表单数据（getFormData.inc.php；节选）*\n\
    \n现在，预填充表单值就很简单了：由于 getFormDataGET() 和 getFormDataPOST() 总是返回一个值——即使是空字符串——因此返回值可以直接用于文本字段的\
    \ value 属性。\n\n## 预填充文本字段和密码字段\n\n```\n<?php\n    require_once 'stripFormSlashes.inc.php';\n\
    \    require_once 'getFormData.inc.php';\n?>\n...\n<input type=\"text\" name=\"\
    textfieldname\"\n    value=\"<?php\n        echo\n    htmlspecialchars(getFormDataPOST('textfieldname'));\n\
    \    ?>\" />\n```\n\n*预填充文本字段（text-cookie.php；节选）*\n\n## 预填充多行文本字段\n\n```\n<textarea\
    \ cols=\"40\" rows=\"5\"\nname=\"areafieldname\"><?php\n    echo (isset($_POST['areafieldname']))\
    \ ?\n    htmlspecialchars($_POST['areafieldname']) : '';\n?></textarea>\n```\n\
    \n对于多行文本字段，可以使用与单行文本字段和密码字段几乎相同的方法。唯一的区别在于预填充值的位置：它应位于 <textarea> 和 </textarea>\
