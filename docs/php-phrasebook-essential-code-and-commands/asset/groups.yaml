    \    echo 'International format: ' . date('Y-m-d');\n?>\n```\n\n## 按美国/英国/欧洲方式使用当前日期\n\
    \n为了给你一个简短方便的参考，前面的代码包含了一些常用的日期格式。根据你的所在位置，日、月、年的顺序可能会有所不同：\n\n- 在美国，主要是月份、日和年份\n\
    - 在英国和欧洲其他地区，主要是日、月份和年份\n- 国际标准日期表示法以年份开头，然后是月份和日期\n\n> **NOTE**\n> 前面的代码使用了四位数的年份表示，因为这是无歧义的。在实践中，两位数的年份也很常见。\n\
