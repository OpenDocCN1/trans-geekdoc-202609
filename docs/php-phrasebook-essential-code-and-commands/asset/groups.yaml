    \ automatically done for the Windows and Mac OS X binaries.\n\nThe other option\
    \ is to allow only cookies, not session IDs, in URLs. To do so, you can use the\
    \ following php.ini directive:\n\n```\nsession.use_only_cookies = 1\n```\n\n>\
    \ **NOTE**\n> Session IDs in the URL are generally a bad thing; because people\
    \ could bookmark this information, some search engines will not index your sites,\
    \ and so on. However, every e-commerce website (and most other websites as well)\
    \ must take into account that some visitors (potential clients!) just do not like\
    \ or do not support cookies. Here, sessions offer a convenient way to overcome\
    \ this limitation.\n\n## Activating Sessions\n\n### session_start()\n\nUsing session\
    \ management always requires resources and, therefore, costs performance. Therefore,\
    \ sessions have to be activated. Because cookies might be part of the package,\
    \ this has to be done before any HTML content is sent to the client. This can\
    \ be accomplished in two ways:\n\n- Activate sessions globally with the php.ini\
    \ directive `session.auto_start = 1`.\n\n- Activate sessions on a per-script basis\
    \ with the function `session_start()`.\n\nFrom a performance point-of-view, the\
    \ latter option is the best one.\n\n```\n<?php\nsession_start();\necho 'Sessions\
    \ activated.';\n?>\n```\n\nActivating Sessions (session_start.php)\n\n## Reading\
    \ and Writing Sessions\n\n```\n<?php\nsession_start();\necho 'Sessions activated.<br\
    \ />';\n$_SESSION['version'] = phpversion();\necho 'Session data written.<br />';\n\
    echo \"Session data read: {$_SESSION['version']}.\";\n?>\n```\n\nAll session data\
    \ is accessible from a PHP script via the `$_SESSION` array. Because the data\
    \ itself is stored on the server-side, you can write session data and read it\
    \ in the next PHP statement, without the requirement of a round-trip to the server\
    \ as it was with cookies. Just remember to call `session_start()` first and then\
    \ access `$_SESSION`. The preceding listing creates a session file that Figure\
    \ 5.6 shows.\n\n![](img/1e6d362f187af50011d2666ddaa68739_158_0.png)\n\nFigure\
    \ 5.6 The content of the session file created by Listing 5.16.\n\n## Closing Sessions\n\
    \n### session_destroy()\n\nIn some instances, for example when a user logs out,\
    \ all session data should be removed, and the session must be closed. Of course,\
    \ it would be possible to loop through `$_SESSION` with `foreach` and then set\
    \ each value to an empty string or null, but there is a quicker way: Call `session_destroy()`.\
    \ After that, all data in the current session is destroyed, as the function name\
    \ suggests.\n\n```\n<?php\n    session_start();\n    echo 'Before: <pre>';\n \
    \   print_r($_SESSION);\n    echo '</pre>After: <pre> ';\n    session_destroy();\n\
    \    print_r($_SESSION);\n    echo '</pre>';\n?>\n```\n\nRemoving All Session\
    \ Data (session_destroy.php)\n\n## Changing the Session ID\n\n### session_regenerate_id()\n\
    \nOne common attack against websites that are secured with sessions is that the\
    \ session ID of a user is somehow taken (for instance, by analyzing HTTP_REFERER\
    \ entries in HTTP requests) and then used to impersonate that specific user. This\
    \ is hard to battle, but one convenient way to make it harder for attackers is\
    \ to change the session ID whenever something “important” happens, such as the\
    \ user signing in. For instance, Amazon requires users who are already authenticated\
    \ with their cookie to sign in again when they want to order something.\n\n```\n\
    <?php\nob_start();\nsession_start();\necho 'Old: ' . session_id();\nsession_regenerate_id();\n\
    echo '<br />New: ' . session_id();\nob_end_flush();\n?>\n```\n\n*Changing the\
    \ Session ID (session_regenerate_id.php)*\n\nIn this case, the function `session_regenerate_id()`\
    \ just changes the current session ID but leaves all data intact. This is shown\
    \ in the preceding code, in which the current session ID (both old and new) is\
    \ retrieved using the `session_id()` function. Figure 5.7 shows a possible output\
    \ of this script.\n\n> This code uses output buffering—`ob_start()` and `ob_end_flush()`—because\
    \ `session_regenerate_id()` must also be called before any HTML output is sent\
    \ to the client.\n\n![](img/1e6d362f187af50011d2666ddaa68739_160_0.png)\n\nFigure\
    \ 5.7 Two session IDs, one is old and one is new.\n\n## Creating Dynamic, Session-Aware\
    \ Links\n\n```\n$sname = urlencode(session_name());\n$id = urlencode(session_id());\n\
    echo \"<a href=\\\"page.php?$sname=$id\\\">dynamic link</a>\";\n```\n\nUsing `session.use_trans_sid`\
    \ to automatically update all links to contain the session ID, if required, is\
    \ a good thing; however, it does not work if those links are dynamically generated\
    \ by PHP. However, PHP offers two functions that provide all information that\
    \ is needed:\n\n- `session_name()` returns the name of the session.\n- `session_id()`\
    \ returns the current session's ID.\n\nTherefore, the preceding code creates a\
    \ dynamic link that contains this information, enabling the programmer to make\
    \ dynamic links session-aware.\n\nOne potential output of this code is the following:\n\
    \n```\n<a href=\"page.php?PHPSESSID=5b25b64843fad0d1afb4286cfe0ed448\">dynamic\
    \ link</a>\n```\n\n> **TIP**\n>\n> When you use an HTML form, PHP automatically\
