    }\nif (isset($_POST['year']) && is_numeric($_POST['year']) &&\n    ((int)$_POST['year']\
    \ >= 2005 &&\n(int)$_POST['year'] <= 2010)) {\n    $year = (int)$_POST['year'];\n\
    } else {\n    $year = date('Y');\n}\n?>\n<form method=\"post\" action=\"<?php\
    \ echo\n    htmlspecialchars($_SERVER['PHP_SELF']); ?>\">\n    <select name=\"\
    day\"><?php\n    $maxdays = date('t', mktime(12, 0, 0, $month, 1,\n        $year));\n\
    \    for ($i = 1; $i <= $maxdays; $i++) {\n        if (isset($_POST['day']) &&\
    \ $_POST['day'] ==\n            $i) {\n            $sel = ' selected';\n     \
    \   } elseif ($i == date('j')) {\n            $sel = ' selected';\n        } else\
    \ {\n            $sel = '';\n        }\n        echo \"<option value=\\\"$i\\\"\
    $sel>$i</option>\\n\";\n    }\n?></select>\n    // ...\n</form>\n```\n\n日期选择会自动更新\n\
    (dateselection-js.php; 摘录)\n\n![](img/1e6d362f187af50011d2666ddaa68739_92_0.png)\n\
    \n图 3.4 月份名称是自动生成的。\n\n然而，使用 JavaScript 和 PHP 的组合会更方便。使用 JavaScript，你可以自动提交表单。使用\
    \ PHP，你可以预先填充表单字段（有关更多信息，请参阅第 4 章“与 Web 表单交互”），更重要的是，找出相关年份有多少天。\n\nJavaScript\
    \ 代码被限制到最小：选择另一个月份会提交 HTML 表单（选择另一个年份也会提交表单，因为闰年会使二月变长）：\n\n```html\n<select name=\"\
    month\" onchange=\"this.form.submit();\">\n...\n<select name=\"year\" onchange=\"\
    this.form.submit();\">\n```\n\n每月的天数可以使用 date('t') 找到。本节开头处的列表包含了此功能的完整代码，包括对传输信息的某些合理性检查。此外，代码会自动预选当前日期，除非用户选择其他日期。图\
    \ 3.5 包含完整代码的输出。\n\n## 计算两个日期之间的差异\n\n```\n$century = mktime(12, 0, 0, 1, 1, 2001);\n\
    $today = time();\n$difference = $today - $century;\n```\n\n可以由 time() 和其他 PHP\
    \ 函数确定的纪元值可用于轻松计算两个日期之间的差异。诀窍是将日期转换为时间戳（如果尚未以此格式提供）。然后计算这两个时间戳之间的差异。结果是秒为单位的时间差。然后此值可用于找出它对应多少分钟、小时和天：\n\
    \n- 将结果除以 60 得到分钟数\n- 将结果除以 60 * 60 = 3600 得到小时数\n- 将结果除以 60 * 60 * 24 = 86400\
    \ 得到天数\n\n```php\n<?php\n$century = mktime(12, 0, 0, 1, 1, 2001);\n$today = time();\n\
    $difference = $today - $century;\necho 'This century started ';\necho floor($difference\
    \ / 86400);\n$difference -= 86400 * floor($difference / 86400);\necho ' days,\
    \ ';\necho floor($difference / 3600);\n$difference -= 3600 * floor($difference\
    \ / 3600);\necho ' hours, ';\necho floor($difference / 60);\n$difference -= 60\
    \ * floor($difference / 60);\necho \" minutes, and $difference seconds ago.\"\
    ;\n?>\n```\n\n两个日期之间的差异 (timediff.php)\n\n![](img/1e6d362f187af50011d2666ddaa68739_94_0.png)\n\
    \n图 3.5 PHP 代码用适当的天数填充了月份选择列表。\n\n如果你从天数开始，将每个结果向下取整并从结果中减去它；你也可以将差异拆分为天、小时和分钟。\n\
    \n## 使用 GMT 日期/时间信息\n\n通常，PHP 使用时间的本地设置。然而在某些特殊情况下，必须使用 GMT 时间格式。为此，PHP 提供了一些日期/时间函数的“GMT\
    \ 启用”版本：\n\n- `gmdate()` 的工作方式与 `date()` 相同并格式化日期/时间值；然而，返回值使用 GMT 格式\n- `gmmktime()`\
    \ 创建的时间戳与 `mktime()` 类似；然而，它使用 GMT\n- `gmstrftime()` 的格式化方式与 `strftime()` 相同；然而，它使用\
    \ GMT\n\nGMT 在设置页面在 HTTP 头中的过期日期或手动设置 cookie 的过期日期（也在 HTTP 头中）时很重要。\n\n## PEAR\
    \ 提供了什么？\n\n以下 PEAR 包提供了有助于处理任何类型表单数据的功能：\n\n- `Date` 包含一组用于处理各种日期/时间值的函数，包括时区之间以及各种日期/时间表示之间的转换\n\
    - `Date_Holidays` 计算特殊假期的名称和日期\n\n## 与 Web 表单交互\n\nHTML 表单是任何动态网站的关键要素之一，因为它们可以让网站用户与其交互。否则，网站或多或少是静态的：它们可能由数据库驱动，因此会定期更改，但对每个访客看起来都一样。HTML\
    \ 表单可以改变这一点；因此，从 PHP 中使用表单数据非常重要。\n\n读取信息是一项非常简单的任务：对于通过 GET 提交的表单数据（即在请求的页面的统一资源标识符\
    \ [URI] 中），数据可以在 $_GET[<表单字段 name 属性的值>] 中找到。然而，这只是开始。假设用户填写表单但忘记了一个字段。与其显示错误消息并要求用户点击浏览器的后退按钮，用户可以期望一个表单，其中所有字段都已填入他之前提供的值。许多书籍忽略了这一点；更糟的是，有些书籍只是做错了。你必须不要忘记表单字段值的特殊编码；否则，表单会受到跨站脚本\
    \ (XSS) 攻击，或至少看起来会很丑陋。\n\n图 4.1 演示了这一点：你看到两个按钮的标题相同；然而，只有第一个按钮的标题在 HTML 代码中被正确编码。\n\
    \n![](img/1e6d362f187af50011d2666ddaa68739_97_0.png)\n\n图 4.1 正确编码特殊字符是强制性的。\n\
    \n其他重要主题包括超文本传输协议 (HTTP) 文件上传以及应对 php.ini 或其他地方可能抵制开发人员良好意图的各种设置。\n\n## 将表单数据发送回当前脚本\n\
    \n```\n<form action=\"<?php echo htmlspecialchars($_SERVER['PHP_SELF']); ?>\"\
    >\n</form>\n```\n\n所有相关浏览器如果在 <form> 元素中未提供 action 属性，就会将表单数据发送回当前页面。然而，HTML 和可扩展超文本标记语言\
    \ (XHTML) 规范都指出 action 是一个必需属性（在文档类型定义 [DTDs] 中标记为 #REQUIRED）。用户代理的行为是未定义的，正如\
    \ http://w3.org/TR/html4/interact/forms.html#def-action 处的 HTML 规范所解释的那样。因此，最好明确提供当前脚本的统一资源定位符\
    \ (URL) 作为表单的 action。上面的代码就是这样做的，并且还出于安全原因转义了 $_SERVER['PHP_SELF'] 中的特殊字符。\n\n\
    ## 读取表单数据\n\n起初，读取表单数据非常容易：如果表单字段具有 name 属性 \"whatever\" 或在 HTML/XHTML 的较新版本中具有\
    \ id 属性 \"whatever\"，PHP 会在全局范围内创建一个变量 $whatever。这非常方便，但从架构角度来看是个坏主意。因此，从 PHP\
    \ 4.2 版本开始，默认情况下使用以下 php.ini 指令禁用了它：\n\n```\nregister_globals = Off\n```\n\n自\
    \ PHP 3 以来，以下全局数组用于表单数据：\n\n- $HTTP_GET_VARS—使用 GET 提供的所有数据\n- $HTTP_POST_VARS—使用\
    \ POST 提供的所有数据\n- $HTTP_REQUEST_VARS—使用 GET 或 POST 提供的数据，或通过 cookie 提供的数据（不推荐使用）\n\
    \n这些数组是全局的；因此，如果你在函数中使用它们，你必须使用 global 关键字将它们提升到全局范围：\n"
