    \ = '$1$FK3.qn2.$Si5KhnprsRb.N.SEF4GMW0'\n```\n\n密码绝不应以明文形式存储在数据库中，而应以加密方式存储。一些数据库内部提供加密；对于其他所有数据库，PHP\
    \ 都可以提供帮助。`crypt()` 函数使用数据加密标准（DES）加密字符串。这是一种单向加密，因此无法回溯。此外，对 `crypt()` 的后续调用会产生不同的结果。\n\
    \n```php\n<?php\n    $pass = (isset($_GET['pass'])) ? $_GET['pass'] : '';\n  \
    \  $encpass = '$1$FK3.qn2.$Si5KhnprsRb.N.SEF4GMW0';\n    if (crypt($pass, $encpass)\
