  md: "\nput in a class. Then, setClass() provides the SOAP extension with the name\
    \ of the class to be used.\n\n```\n<?php\n$soap = new SoapServer(\n    'AddService.wsdl',\n\
    \    array('uri' => 'http://php.phrasebook.org/')\n);\n$soap->setClass('ServiceClass');\n\
    $soap->handle();\n\nclass ServiceClass {\n    function add($a, $b) {\n       \
    \ return $a + $b;\n    }\n}\n?>\n```\n\n## Consuming a Web Service with PHP 5's\
    \ SOAP Extension\n\nConsumption is again easy, as long as you have a WSDL description.\
    \ This code calls the Web Services and also catches any errors, thanks to PHP\
    \ 5's try-catch mechanism.\n\n```\n<?php\n$soap = new SoapClient('AddService.wsdl');\n\
    try {\n    $result = $soap->add(47, 11);\n    echo \"47 + 11 = $result\";\n} catch\
    \ (SoapFault $e) {\n    echo \"Error: {$e->faultstring}\";\n}\n?>\n```\n\n## TIP\n\
    \nIn an attempt to boost performance, PHP 5's SOAP extension defaults to caching\
    \ WSDL. The following are the standard settings from php.ini-recommended:\n\n\
    ```\n[soap]\n; Enables or disables WSDL caching feature.\nsoap.wsdl_cache_enabled=1\n\
    ; Sets the directory name where SOAP extension will put cache files.\nsoap.wsdl_cache_dir=\"\
    /tmp\"\n; (time to live) Sets the number of seconds\n; while cached file will\
    \ be used\n; instead of original one.\nsoap.wsdl_cache_ttl=86400\n```\n\nWhen\
    \ developing a Web Service and maybe changing the WSDL, this is, of course, a\
    \ no-brainer. Therefore, set soap.wsdl_cache_enabled to Off during development,\
    \ but turn it on on production servers.\n\n## Using the Worst Acronym Ever: AJAX\n\
    \nWikipedia lists over a dozen different meanings for the term “Ajax,” including\
    \ a soccer team from the Netherlands, two figures of Homer’s Iliad, and a household-cleaning\
    \ product. However, since several months ago, AJAX also stands for “Asynchronous\
    \ JavaScript + XML.” The technology is far from new (the underlying technology,\
    \ XML HTTP requests from JavaScript, are supported by recent versions of Internet\
    \ Explorer, and Mozilla browsers including Firefox, Safari, and Konqueror—also,\
    \ XML is not required at all for this), but only after this really stupid term\
    \ was coined, did people actually start using it.\n\nThe basic principle is that\
    \ JavaScript is now able to call a remote server and then process its return values,\
    \ without having to reload the whole page. Of course, this has little to do with\
    \ PHP; however, some AJAX classes make using AJAX from within PHP very easy.\n\
    \nThis final phrase of the book shows a very short demonstration of “AJAX.” This\
    \ phrase uses the Sajax toolkit (the S stands for simple) available at http://www.modernmethod.com/sajax/.\n\
    \nThe complete code for this example is quite long because both PHP and JavaScript\
    \ are needed. First, we need the server-side logic. For this, the Sajax toolkit\
    \ is loaded, which comes as a single PHP file. We then “export” (register) all\
    \ PHP functions we want to use from the client-side. The following example has\
    \ a small function that generates a random RGB color.\n\n```\n<?php\n    require_once\
    \ 'Sajax.php';\n\n    sajax_init();\n    sajax_export('randomColor');\n    sajax_handle_client_request();\n\
    \n    function randomColor() {\n        $color = '#';\n        for ($i=0; $i<3;\
    \ $i++) {\n            $color .= dechex(rand(0, 255));\n        }\n        return\
    \ $color;\n    }\n?>\n```\n\n*The server-side part of the application (ajax.php;\
    \ excerpt)*\n\nOn the client-side, a call to the (PHP) function `sajax_show_javascript()`\
    \ does most of the work—it creates some lines of JavaScript code that take care\
    \ of the requests to the web server in the background. Then, all PHP functions\
    \ that have been registered before can be called on the client-side by prepending\
    \ `x_` to the name of the function. As a parameter, you have to provide the name\
    \ of a callback function; this function is then called when the server-side has\
    \ responded to the request.\n\nThe following code calls the `randomColor()` PHP\
    \ function every five seconds and then writes a text in this random color—all\
    \ without server round-trips! Figure 9.5 shows the result.\n\n```\n<script language=\"\
    JavaScript\" type=\"text/javascript\">\n    <!--\n<?php\n    sajax_show_javascript();\n\
    ?>\n    changeColor();\n    setInterval('changeColor()', 5000);\n\n    function\
    \ changeColor() {\n        x_randomColor(randomColor_callback);\n    }\n\n   \
    \ function randomColor_callback(result) {\n        var text = '<span style=\"\
    color: ' + result + '\">What a dumb acronym ...</span>';\n        document.getElementById('output').innerHTML\
    \ =\n            text;\n    }\n//--></script>\n...\n<div id=\"output\"></div>\n\
    ```\n\nThe client-side part of the application (ajax.php; excerpt)\n\n![](img/1e6d362f187af50011d2666ddaa68739_292_0.png)\n\
    \nFigure 9.5  The text appears, using JavaScript and PHP.\n\n## What Does PEAR\
    \ Offer?\n\nAlong with the several modules mentioned in this chapter, the following\
    \ PEAR packages offer functionality that can be helpful when connecting with others\
