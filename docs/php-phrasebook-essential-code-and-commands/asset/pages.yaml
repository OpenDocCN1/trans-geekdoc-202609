- pgno: 282
  md: "# Creating a Web Service with PEAR::SOAP\n\nProviding a Web Service is again\
    \ a matter of a few lines of code: Instantiate a class (SOAP_Server), and then\
    \ attach the business logic to it (this time, by putting it into a class and then\
    \ instantiating the class). Finally, call addObjectMap() to provide a uniform\
    \ resource name (URN) for the method and then connect it with the method service()\
    \ to $HTTP_RAW_POST_DATA. This code contains all the details, so you can start\
    \ from there for your own Web Service.\n\n> WARNING\n> \n> Unfortunately, PEAR::SOAP\
    \ currently does not work when error_reporting is set to E_ALL because notices\
    \ occur in the code. Therefore, the code in this phrase sets the error reporting\
    \ to a less severe value before loading the PEAR::SOAP classes.\n\n# Automatically\
    \ Generating WSDL with PEAR::SOAP\n\nPEAR::SOAP can also automatically create\
    \ WSDL; however, it needs some assistance by the programmer. First, the constructor\
    \ of the Web Service's class must set a __dispatch_map property that contains\
    \ a list of input and output parameters. The __dispatch_map property is an array\
    \ (therefore, several operations per Web Service are supported), and the name\
    \ of the function is the key for the signature.\n\nAlso, you need some code that\
    \ checks the URL. If ?wsdl is appended, the WSDL must be returned by the service.\
    \ For this, the SOAP DISCO Server class is instantiated and then its method getWSDL()\
    \ gets called."
  merge: -1
  img_proc: true
- pgno: 283
  md: "# Automatically Generating WSDL with PEAR::SOAP\n\n```\n```php\nclass ServiceClass\
