- pgno: 290
  md: '# Using the Worst Acronym Ever: AJAX


    Wikipedia lists over a dozen different meanings for the term “Ajax,” including
    a soccer team from the Netherlands, two figures of Homer’s Iliad, and a household-cleaning
    product. However, since several months ago, AJAX also stands for “Asynchronous
    JavaScript + XML.” The technology is far from new (the underlying technology,
    XML HTTP requests from JavaScript, are supported by recent versions of Internet
    Explorer, and Mozilla browsers including Firefox, Safari, and Konqueror—also,
    XML is not required at all for this), but only after this really stupid term was
    coined, did people actually start using it.


    The basic principle is that JavaScript is now able to call a remote server and
    then process its return values, without having to reload the whole page. Of course,
    this has little to do with PHP; however, some AJAX classes make using AJAX from
    within PHP very easy.


    This final phrase of the book shows a very short demonstration of “AJAX.” This
    phrase uses the Sajax toolkit (the S stands for simple) available at http://www.modernmethod.com/sajax/.


    The complete code for this example is quite long because both PHP and JavaScript
    are needed. First, we need the server-side logic. For this, we the Sajax toolkit
    is loaded, which comes as a single PHP file. We then “export” (register) all PHP
    functions we want to use from the client-side. The following example has a small
    function that generates a random RGB color.'
  merge: -1
  img_proc: true
- pgno: 291
  md: "# Consuming a Web Service with PHP 5's SOAP Extension\n\n```\n<?php\n    require_once\
    \ 'Sajax.php';\n\n    sajax_init();\n    sajax_export('randomColor');\n    sajax_handle_client_request();\n\
    \n    function randomColor() {\n        $color = '#';\n        for ($i=0; $i<3;\
    \ $i++) {\n            $color .= dechex(rand(0, 255));\n        }\n        return\
    \ $color;\n    }\n?>\n```\n\n*The server-side part of the application (ajax.php;\
    \ excerpt)*\n\nOn the client-side, a call to the (PHP) function `sajax_show_javascript()`\
    \ does most of the work—it creates some lines of JavaScript code that take care\
    \ of the requests to the web server in the background. Then, all PHP functions\
    \ that have been registered before can be called on the client-side by prepending\
    \ `x_` to the name of the function. As a parameter, you have to provide the name\
    \ of a callback function; this function is then called when the server-side has\
    \ responded to the request.\n\nThe following code calls the `randomColor()` PHP\
    \ function every five seconds and then writes a text in this random color—all\
    \ without server round-trips! Figure 9.5 shows the result."
