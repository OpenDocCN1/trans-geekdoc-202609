  md: "# Moving Uploaded Files\nto a Safe Location\n\n```\nmove_uploaded_file(\n \
    \   $_FILES['File']['tmp_name'],\n    '/tmp/' . basename($_FILES['File']['name'])\n\
    )\n```\n\nWhen a user uploads a file to a PHP script using the <input type=\"\
    file\" /> HTML element, PHP stores the file in a temporary location (set in the\
    \ php.ini directive upload_tmp_dir) and deletes it upon completion of script execution.\
    \ Therefore, you have to access the uploaded file within the script. To do so,\
    \ PHP contains the function move_uploaded_file(), which moves a file from one\
    \ location to another. The great thing about move_uploaded_file() is that the\
    \ function first does a sanity check, whether the filename you provide really\
    \ is an uploaded file or if a malicious user just tried to trick you into moving\
    \ /etc/passwd or C:\\boot.ini somewhere else.\n\n```\n<?php\nif (isset($_POST['Submit'])\
    \ && isset($_FILES['File'])) {\n    $move = move_uploaded_file(\n        $_FILES['File']['tmp_name'],\n\
    \        '/tmp/' . basename($_FILES['File']['name'])\n    );\n    echo '<h1>';\n\
    \    echo ($move) ? 'Moved' : 'Did not move';\n    echo ' the file!</h1>';\n}\
    \ else {\n?>\n<form action=\"<?php echo htmlspecialchars($_SERVER['PHP_SELF']);\
    \ ?>\" method=\"post\" enctype=\"multipart/form-data\">\n```"
