    | Symbol | Description |

    | --- | --- |

    | U | Epoche value (seconds since January 1st, 1970, Midnight GMT) |

    | w | Day of week (from 0—Sunday, to 6—Saturday) |

    | W | Week number (according to ISO 8601, from 1 to 53) |

    | y | Year (two digits) |

    | Y | Year (four digits) |

    | z | Day of year (from 0 to 365) |

    | Z | Time zone difference to UTC (in seconds) |


    **NOTE**

    Almost all of the formatting symbols shown in Table 3.1 are available since PHP
    3. There are only two exceptions: Using W for determining the week number of a
    date was added in PHP 4.1.0, and using c for retrieving the ISO 8601 representation
    for a date (for example, 2006-06-30T12:34:56+01:00) came in PHP 5.


    The function date() is very powerful and offers a broad range of ways to use it.
    However, especially if you have localized content, you need some good phrases.
    In this chapter, you will find many of them.


    PHP''s date and time functions have their own section in the PHP manual. You can
    find more information about date() and friends at http://php.net/datetime.'
