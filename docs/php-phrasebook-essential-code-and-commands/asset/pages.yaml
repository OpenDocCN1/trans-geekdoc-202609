- pgno: 20
  md: "# Converting Strings into Hypertext Markup Language (HTML)\n\n```\nhtmlspecialchars($input)\n\
    htmlentities($input)\n```\n\nA commonly used web attack is called Cross-Site Scripting\
    \ (XSS). For example, a user enters some malicious data, such as JavaScript code,\
    \ into a web form; the web page then at some point outputs this information verbatim,\
    \ without proper escaping. Standard examples for this are web guest books or discussion\
    \ forms. People enter text for others to see it.\n\n```\n<?php\n    $input = '<script>alert(\"\
    I have a bad\nFöhnwelle, ' .\n        'therefore I crack\nwebsites.\");</script>';\n\
    \necho htmlspecialchars($input) . '<br />';\necho htmlentities($input);\n?>\n\
    ```\n\n*Escaping Strings for HTML (htmlescape.php)*\n\nHere, it is important to\
    \ remove certain HTML markup. To make a long story short: It is almost impossible\
    \ to really catch all attempts to inject JavaScript into data. It's not only always\
    \ done using the <script> tag, but also in other HTML elements, such as <img onerror=\"\
    badCode()\" />. Therefore, in most cases, all HTML must be removed."
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Converting Strings into Hypertext Markup Language (HTML)


    The easiest way to do so is to call htmlspecialchars(); this converts the string
    into HTML, including replacement of all < and > characters by &lt; and &gt;. Another
    option is to call htmlentities(). This uses HTML entities for characters, if available.
    The preceding code shows the differences between these two methods. The German
    ö (o umlaut) is not converted by htmlspecialchars(); however, htmlentities() replaces
    it by its entity &ouml;.


    The use of htmlspecialchars() and htmlentities() just outputs what the user entered
    in the browser. So if the user entered HTML markup, this very markup is shown.
    So htmlspecialchars() and htmlentities() please the browser, but might not please
    the user.


    > NOTE

    > If you, however, want to prepare strings to be used within URLs, you have to
    use urlencode() to properly encode special characters such as the space character
    that can be used in URLs.


    However, the function strip_tags() does completely get rid of all HTML elements.
    If you just want to keep some elements (for example, some limited formatting functionalities
    with <b> and <i> and <br /> tags), you provide a list of allowed values in the
    second parameter for strip_tags(). The following script shows this; Figure 1.1
    depicts its output. As you can see, all unwanted HTML tags have been removed;
    however, its contents are still there.'
  merge: -1
  img_proc: true
- pgno: 22
  md: "![](img/1e6d362f187af50011d2666ddaa68739_22_0.png)\n\nFigure 1.1 Some HTML\
    \ tags were stripped, but not all.\n\n```\n<?php\n$input = 'My parents <i>hate</i>\
    \ me, <br />' .\n    'therefore I <b>crack</b> websites. ' .\n    '<script>alert(\"\
    Nice try!\");</script>' .\n    '<img src=\"explicit.jpg\" />';\n\necho strip_tags($input,\
    \ '<b><br><i>');\n?>\n```\n\nRemoving All HTML Tags (strip_tags.php)\n\n# Using\
    \ Line Breaks\n\nHow can a line break be used within HTML? That's easy: with the\
    \ <br /> HTML element. However, what if there is data with \\n or \\r\\n line\
    \ breaks? Search and replace comes to mind; however, it is much easier to use\
    \ a built-in PHP function: nl2br(). This parses a string and converts all line\
    \ breaks to <br /> elements, as the preceding script shows."
  merge: -1
  img_proc: true
- pgno: 23
  md: "# Using Line Breaks\n\n```\n<?php\n    $input = \"One\\nTwo\\r\\nThree\";\n\
    \    echo nl2br($input);\n?>\n```\n\nOutputs the HTML:\n\nOne<br />\nTwo<br />\n\
    Three\n\n*Adding <br/> Elements at Every Line Break (nl2br.php)*\n\nAs you can\
    \ see, the line breaks are still there, but the <br /> elements were added.\n\n\
    # Encrypting Strings\n\n```\n$encpass = '$1$FK3.qn2.$Si5KhnprsRb.N.SEF4GMW0'\n\
    ```\n\nPasswords should never be stored verbatim in a database, but in an encrypted\
    \ way. Some databases internally offer encryption; for all the others, PHP is\
    \ there to help. The crypt() function encrypts a string using Data Encryption\
    \ Standard (DES). This is a one-way encryption, so there is no way back. Also,\
    \ subsequent calls to crypt() result in different results.\n\n```\n<?php\n   \
    \ $pass = (isset($_GET['pass'])) ? $_GET['pass'] : '';\n    $encpass = '$1$FK3.qn2.$Si5KhnprsRb.N.SEF4GMW0';\n\
    \    if (crypt($pass, $encpass) === $encpass) {\n        echo 'Login successful.';\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 24
  md: "```\n```php\n} else {\n    echo 'Login failed.';\n}\n?>\n```\n```\n\n# Checking\
    \ Logins Using an Encrypted Password (crypt.php)\n\nFor instance, the string 'TopSecret'\
    \ is encrypted into $1$FK3.qn2.$Si5KhnprsRb.N.SEF4GMW0 (and also $1$m61.1i2.$0p1J3EHwkIxy\
    \ cnyePp1Fz0 and $1$9S3.c/3.$5101Bm4v3cnBN0b1AECi1.., but this example sticks\
    \ with the first one). Checking whether a value corresponds to a result from calling\
    \ crypt() can be done by calling crypt() again: crypt($value, $encryptedValue)\
    \ must return $encryptedValue.\n\nThe preceding script checks whether a password\
    \ provided via the URL matches the previous result of crypt(). Calling this script\
    \ with the GET parameter pass=TopSecret succeeds in logging in; all other passwords\
    \ fail.\n\n> NOTE\n> \n> To provide more details: The second parameter to crypt()\
    \ is the salt (initialization value) for encrypting the data. You can also use\
    \ a salt when encrypting the original password. However, you do have to make sure\
    \ that the salt values are unique—otherwise, the encryption is not secure. Therefore,\
    \ do not use a custom salt value and let PHP do the work.\n> \n> Be also advised,\
    \ though, that DES encryption can be cracked in about 24 hours, so it's not bulletproof\
    \ anymore. A more recent alternative is Advanced Encryption Standard (AES)."
