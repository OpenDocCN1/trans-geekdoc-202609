  md: "```\n<?php\n$a = array('100.200.300.400', '100.50.60.70',\n    '100.8.9.0');\n\
    natsort($a);\necho implode(' < ', $a);\n?>\n```\n\n*Sorting IP Addresses Using\
    \ a Natural Order String Comparison (natsort.php)*\n\nWhat is needed in this case\
    \ is a so-called natural sorting, something that has been implemented by Martin\
    \ Pool's Natural Order String Comparison project at http://sourcefrog.net/projects/natsort/.\
    \ In PHP's natcasesort() function, this algorithm is used. According to the description,\
    \ it sorts “as a human would.” When case sensitivity is an issue, natsort() can\
    \ be used. The preceding code shows the latter function.\n\nNOTE\nInternally,\
    \ natsort() uses strnatcmp() (and natcasesort() uses strnatcasecmp()), which does\
    \ a “natural” comparison of two strings. By calling this function a number of\
    \ times, the array elements are brought into the correct order.\n\n# Sorting Anything\n\
    \n```\nfunction compare($a, $b) {\n    return $a - $b;\n}\n\n$a = array(4, 1345,\
    \ 31, 222);\nusort($a, 'compare');\necho implode(' < ', $a);\n```"
