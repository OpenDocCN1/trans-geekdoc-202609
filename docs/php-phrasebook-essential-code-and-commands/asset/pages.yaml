    >Send mail</a>\n```\n\n```\n<?php\nfunction protectMail($s) {\n  $result = '';\n\
    \  $s = 'mailto:' . $s;\n  for ($i = 0; $i < strlen($s); $i++) {\n    $result\
    \ .= '&#' . ord(substr($s, $i, 1)) . ';';\n  }\n  return $result;\n}\n```"
