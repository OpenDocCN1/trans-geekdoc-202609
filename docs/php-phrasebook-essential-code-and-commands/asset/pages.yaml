    \ $t);\n}\n```\n\nSometimes, using date values with a database is not a clever\
    \ thing. Different language versions of the database, its drivers, or the underlying\
    \ operating system could cause some trouble when the regional date formats do\
    \ not fit together.\n\n```\n<?php\nfunction timestamp($t = null) {\n    if ($t\
    \ == null) {\n        $t = time();\n    }\n    return date('YmdHis', $t);\n}\n\
    \necho 'Time stamp: ' . timestamp(time());\n?>\n```\n\n*Converting a Date into\
    \ a (Sortable) Time Stamp (timestamp.php)*\n\nA potential alternative is the use\
    \ of time stamps. Several different formats are available, but most of them have\
