  md: '# Index


    # Symbols


    +   * *(asterisk), 25

    +   * \ (backslash), 26

    +   * ^ (caret), 24

    +   * $ (dollar sign), 25

    +   * . (dot), 26

    +   * " (double primes), 69

    +   * | (pipe), 25

    +   * ? (question mark), 25

    +   * [...] special character, 25

    +   * + (plus sign), 25

    +   * !== operator, 23

    +   * == operator, 6

    +   * === compare operator, 23

    +   * === operator, 6-7

    +   * 401 status code, 165


    # A


    +   * access

    +     * file access

    +       * PHP built-in class, 191-192

    +       * relative paths for, 179-180

    +       * security traps, 181

    +   * addslashes() function, 228


    +   * Advanced Encryption Standard (AES), 13

