  md: "# Prefilling Text Fields and Password Fields\n\n```\n<input type=\"text\" name=\"\
    textfieldname\"\n    value=\"<?php\n    echo (isset($_POST['textfieldname']))\
    \ ?\n        htmlspecialchars($_POST['textfieldname']) :\n        'default value';\n\
    ?>\" />\n```\n\nAnother possibility is to prefill form values from cookies. This\
    \ is quite useful when users enter their data into a form several times. So, when\
    \ they visit a form on the site a couple of days later, the old data can be retrieved\
    \ from the cookie. Yes, just one cookie since only 20 cookies per domain are allowed.\
    \ We use an array for that, of course. However, only strings are allowed as cookie\
    \ values, so the use of serialize() and unserialize() is required.\n\nThe following\
    \ function retrieves a value from the cookie that contains the form data. The\
    \ order of precedence is as follows: If $_GET or $_POST contains a current value\
    \ for this field, this value is used (specific versions of the function exist\
    \ for $_GET and $_POST because only one of these two methods is normally used\
    \ at a time). Otherwise, the script looks in $_COOKIE for an associated value.\
    \ If nothing is found, an empty string is returned.\n\n```\nfunction getCookieData()\
    \ {\n    if (isset($_COOKIE['formdata'])) {\n        $formdata = $_COOKIE['formdata'];\n\
    \        if ($formdata != '') {\n            if (get_magic_quotes_gpc()) {\n \
    \               $formdata = stripslashes($formdata);\n            }\n        \
    \    return unserialize($formdata);\n        } else {\n            return array();\n\
    \        }\n    }\n}\n```"
