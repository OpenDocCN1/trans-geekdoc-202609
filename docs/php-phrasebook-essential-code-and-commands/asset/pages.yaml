- pgno: 66
  md: "![](img/1e6d362f187af50011d2666ddaa68739_66_0.png)\n\nFigure 2.6 The nested\
    \ arrays have been HTML-encoded.\n\nAnother function that behaves similarly is\
    \ array_walk(). This one also applies a function to every element of an array;\
    \ however, it also allows you to provide a parameter for this function call. In\
    \ the following code, this is used to print out all elements of an array. A parameter\
    \ is passed—a counter. Because it is passed by reference, increasing this counter\
    \ by 1 within the function leads to a sequence of numbers.\n\n```\n<?php\n   \
    \ function printElement($s, &$i) {\n        printf('%d: %s<br />', $i,\n     \
    \       htmlspecialchars($s));\n        $i++;\n    }\n    $i = 1;\n    $a = array('one',\
    \ 'two', 'three', 'four');\n    $a = array_walk($a, 'printElement', $i);\n?>\n\
    ```\n\nPrinting Array Elements Using array_walk() and a Counter Passed by Reference\
    \ (array_walk.php)"
