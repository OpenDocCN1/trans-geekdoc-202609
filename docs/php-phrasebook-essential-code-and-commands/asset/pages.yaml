  md: "```\n} else {\n    echo 'Connection failed.';\n}\n?>\n```\n\nSending SQL to\
    \ Oracle (oci_execute.php; excerpt)\n\nTo send SQL to Oracle, two steps are required.\
    \ First, a call to oci_parse() parses an SQL string and returns a resource that\
    \ can then be executed using oci_execute(). The second parameter of oci_execute()\
    \ is quite important. Several constants are allowed, but most of the time, OCI_DEFAULT\
    \ is used. Despite the name, that's not the default value, but means \"no auto-commit.\"\
    \ On the other hand, OCI_COMMIT_ON_SUCCESS commits the pending transaction when\
    \ no error has occurred. And this is, indeed, the default value.\n\nUnfortunately,\
    \ there is no such thing as oci_escape_string() to escape special characters for\
    \ use in an SQL statement. Therefore, prepared statements are a must— but are\
    \ also very easy to implement. For this, the SQL statement must contain placeholders\
    \ that start with a colon:\n\n```\n$sql = 'INSERT INTO quotes (quote, author,\
    \ year)\n    VALUES (:quote, :author, :year)';\n```\n\nThen, these placeholders\
    \ have to be filled with values. For this, oci_bind_by_name() must be used:\n\n\
    ```\noci_bind_by_name($stmt, ':quote', $_POST['quote']);\n```\n\nThe preceding\
    \ code sends some form data to the database. No worries about special characters\
    \ because oci_bind_by_name takes care of that."
