- pgno: 48
  md: "TIP\nIf you set the second parameter of print_r() to true, the array's contents\
    \ are not sent to the client, but are returned from the function, so that you\
    \ can save this information in a variable and process it further.\n\nHowever,\
    \ the output of the preceding code is hardly usable for more than debugging purposes\
    \ (see Figure 2.1). Therefore, a clever way to access all data must be found.\
    \ A recursive function is a reasonable way to achieve this. In this, all elements\
    \ of an array are printed out; the whole output is indented using the HTML element\
    \ <blockquote>. If, however, the array element's value is an array itself, the\
    \ function calls itself recursively, which leads to an additional level of indentation.\
    \ Whether something is an array can be determined using the PHP function is_array().\
    \ Using this, the following code can be assembled. See Figure 2.2 for the result.\n\
    \n```\n<?php\nfunction printNestedArray($a) {\n    echo '<blockquote>';\n    foreach\
    \ ($a as $key => $value) {\n        echo htmlspecialchars(\"$key: \");\n     \
    \   if (is_array($value)) {\n            printNestedArray($value);\n        }\
    \ else {\n            echo htmlspecialchars($value) . '<br />';\n        }\n \
    \   }\n    echo '</blockquote>';\n}\n```"
