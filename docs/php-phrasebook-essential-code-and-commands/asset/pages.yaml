    PHP 5 can validate XML against three types of files: Document Type Definitions
    (DTDs), Schemas (.xsd), and relaxNG. For the latter two, the following four methods
    of the DOM object exist:


    +   - `schemaValidate(''file.xsd'')`—Validates against a Schema file

    +   - `schemaValidateSource(''...'')`—Validates against a Schema string

    +   - `relaxNGValidate(''file.rng'')`—Validates against a relaxNG file

    +   - `relaxNGValidateSource(''...'')`—Validates against a relaxNG string


    The preceding code uses relaxNGValidate() to validate a (well-formed) XML file
    against a nonmatching relaxNG file. If you change <element name="person"> to <element
    name="author"> in the file quotes.rng, the validation succeeds.


