- pgno: 179
  md: "# Reading from Files\n\n```\necho file_get_contents('file.txt');\n```\n\nTo\
    \ read data from a file, PHP offers several possibilities. Probably the easiest\
    \ way is to read it all at once and then output it to the user.\n\nThe function\
    \ file_get_contents(), available since PHP 4.3.0, returns the contents of a file\
    \ (or stream) as a string so that it all can be processed further. The preceding\
    \ code reads in a file called file.txt and prints out its contents. This function\
    \ is binary-safe, that's why no file mode can (or has to) be used.\n\nThe file()\
    \ function works as file_get_contents(), but returns the file's contents as an\
    \ array: Each element is one row in the file (including the line break character).\
    \ The following code converts this array into a string and sends it to the browser.\
    \ The function implode() glues the array element together (see Chapter 2, “Working\
    \ with Arrays”).\n\n```\n<?php\n    echo implode('', file('file.txt'));\n?>\n\
    ```\n\nAn even shorter way is to use readfile(), which sends the file's contents\
    \ directly to the browser. To be able to process the data before sending it, output\
    \ buffering must be used. The following listing converts special Hypertext Markup\
    \ Language (HTML) characters and uses <br> elements at line breaks so that the\
    \ original content of the file is shown in the browser."
  merge: -1
  img_proc: true
