    \n```\nPOSIX:\n<?php\n$string = '02/01/06';\necho ereg_replace(\n'([0-9][0-9]?)/([0-9][0-9]?)/([0-9][0-9]?)',\n\
    '\\\\2/\\\\1/\\\\3',\n$string\n);\n?>\n```"
