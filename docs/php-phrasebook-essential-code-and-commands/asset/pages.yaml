  md: "```\nPCRE:\n<?php\n    $string = '02/01/06';\n    echo preg_replace(\n    \
    \    '#(\\d{1,2})/(\\d{1,2})/(\\d{1,2})#',\n        '$2/$1/$3',\n        $string\n\
    \    );\n?>\n```\n\n*Replacing Matches Using POSIX (ereg_replace.php) and PCRE\
    \ (preg_replace.php)*\n\nWithin the regular expression for the replace term, you\
    \ can use references to subpatterns. The complete match is referred to by \\0\
    \ in POSIX and $0 in PCRE. Then count parentheses from inside to outside, from\
    \ left to right: The contents of the first parentheses are referenced by \\1 or\
    \ $1, the second parentheses are accessed using \\2 or $2, and so on.\n\nWith\
    \ this in mind, the replacement can be done. In the example, a U.S. date (month/day/year)\
    \ is converted to a U.K. date (day/month/year).\n\n**TIP**\nThe regular expression\
    \ in the preceding code does not use the / delimiter for the regular expression\
    \ because the regular expression itself contains slashes that would then need\
    \ escaping. However, by choosing another delimiter (for example: #), the escaping\
    \ of slashes can be avoided.\n\nIf you have a static pattern, without any quantifiers\
    \ or special characters, using str_replace() is almost always faster. The parameter\
    \ order for this is: first the string(s)"
