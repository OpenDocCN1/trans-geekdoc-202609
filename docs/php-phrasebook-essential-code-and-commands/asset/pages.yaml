    The Microsoft SQL engine comes in two flavors: the fully featured (and fully priced)
    Microsoft SQL Server (short: MSSQL) and the free edition, the Microsoft SQL Server
    Desktop Engine (short: MSDE), available for free at http://www.asp.net/msde/.
    Both versions are supported by PHP because they are compatible to each other.
    To make it work, you need the line `extension=php_mssql.dll` in your php.ini.
    Also, PHP needs access to the client libraries for MSSQL/MSDE, the file `ntwdbllib.dll`.
    In PHP 5, this file is in the PHP directory, so the PHP process just needs read
    access to it. In PHP 4, you might have to copy the file (that resides in the dll
    subdirectory) somewhere else, for example in the Windows system32 folder.


    However, UNIX/Linux systems can also connect to MSSQL/MSDE installations in a
    heterogenous network, a combination that powers some high-traffic websites. For
    this to work, you have to download the FreeTDS library from http://www.freetds.org/
    and install it after unpacking the distribution with this command:


    ```

    ./configure --prefix=/usr/local/tds --with-tdsver=4.2

    make

    sudo make install

    ```'
