  md: "```\n<script language=\"JavaScript\"\n    type=\"text/javascript\"><!--\n \
    \   var epoche = (new Date()).getTime();\n    epoche = Math.floor(epoche / 1000);\n\
    \    location.replace(\"setcookie-specific.php?time=\" +\n        epoche);\n//--></script>\n\
    ```\n\n# Deleting a Cookie\n\n```\nsetcookie('version', '', time() - 10*365*24*60*60);\n\
    ```\n\nAn intuitive way to delete a cookie is to set its value to an empty string.\
    \ However, the cookie is still there, albeit without a value. A better way is\
    \ to additionally send a cookie with the same name again, but provide an expiry\
    \ date that is in the past. Again, incorrect local time settings have to be taken\
    \ into account, so use a really small expiry date, for instance 10 years before\
    \ today. This listing implements this and deletes the version cookie that has\
    \ been sent by the previous listings. Here, both methods are combined: The cookie\
    \ value is set to an empty string, and the expiry date is in the past. Figure\
    \ 5.4 shows the result: The browser tries to delete the cookie by setting the\
    \ expiry date to the desired time (which lies in the past, so the cookie is gone).\n\
    \n```\n<?php\n    setcookie('version', '', time() -\n        10*365*24*60*60);\n\
    ?>\nTried to delete cookie.\n```\n\nDeleting a Cookie (deletecookie.php)"
