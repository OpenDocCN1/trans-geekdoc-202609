    WSDL manually is a real pain and very error-prone, but most serious Web Services
    implementations for PHP can create WSDL automatically. However, because PHP is
    no strongly typed language, they need some help.


    To do so with NuSOAP, the code from the previous section must be expanded a bit.
    First, a method configureWSDL() must be called to provide the name and the namespace
    of the service. Then, the signature of the method must be provided (which parameters
    go in, which go out). Then, the server is started. However, this time whether
    $HTTP_RAW_POST_DATA is set is checked'
