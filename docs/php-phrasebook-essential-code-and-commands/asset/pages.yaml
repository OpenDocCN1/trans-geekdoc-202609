  md: "```\n<?php\n    setcookie('version', phpversion(), time() +\n        21*24*60*60);\n\
    ?>\nTried to send cookie.\n```\n\n*Setting a Cookie with a Relative Expiry Date\
    \ (setcookie-expiry.php)*\n\nUsually, it is a good thing to set a relative expiry\
    \ date for a cookie (\"in three weeks\"), rather than an absolute date (\"end\
    \ of May 2006\"). If you use absolute dates, you might have to change your script\
    \ on a regular basis because the absolute expiry date might arrive soon. It is\
    \ also considered very unprofessional to set expiry dates that are in the very\
    \ distant future, for instance in the year 2030. The client that receives this\
    \ cookie will most certainly not be booted any more in that year.\n\nTherefore,\
    \ use a relative date. The PHP function time() retrieves the current epoche value;\
    \ then add to this the number of seconds you want the cookie to live. The code\
    \ at the beginning of this phrase sets a cookie that will exist for three weeks.\n\
    \n# Setting a Client-Specific Expiry Date\n\n```\nsetcookie('version', phpversion(),\n\
    \    $_GET['time'] + 21*24*60*60)\n```\n\nKeep in mind that the decision of when\
    \ a cookie expires is made on the client side, using the client time settings.\
    \ So, if the client has the wrong date (which is something you cannot control\
    \ from the server-side)."
  merge: -1
  img_proc: true
- pgno: 143
  md: "# Setting a Client-Specific Expiry Date\n\nyour cookies might expire sooner\
    \ than you expect. So, don’t try to set cookies that live for just one hour or\
    \ so; small things like DST could destroy your plan.\n\n```\n<?php\nif (isset($_GET['time'])\
    \ && is_int($_GET['time']))\n{\n    setcookie('version', phpversion(),\n     \
    \   $_GET['time'] + 21*24*60*60);\n} else {\n    setcookie('version', phpversion(),\n\
    \        time() + 21*24*60*60);\n}\n?>\n```\n\nTried to send cookie.\n\n*Setting\
    \ a Cookie with a Specific Expiry Date (setcookie-specific.php)*\n\nHowever, with\
    \ a bit of JavaScript, it can be possible to avoid this trap. The code in the\
    \ following listing is client-side JavaScript code that determines the current\
    \ time (client-side!) as an epoche value and sends it to a server-side script,\
    \ setcookie-specific.php. The main difference between PHP’s time() function and\
    \ JavaScript’s getTime() method is that the latter returns the number of milliseconds\
    \ since January 1, 1970, whereas the former just works with the number of seconds.\
    \ So, the JavaScript value first has to be divided by 1,000 and rounded down.\n\
    \nThe code for this file can be seen at the beginning of this phrase: The transmitted\
    \ value is taken as the basis for the calculation of the relative cookie expiration\
    \ date."
  merge: -1
