  md: "# Validating Email Addresses\n\nChecking whether a string contains a valid\
    \ email address is two things at once: very common and very complicated. The aforementioned\
    \ book on regular expressions uses several pages to create a set of regular expressions\
    \ to perform this task. If you are interested in this, take a look at http://examples.oreilly.com/regex/readme.html.\n\
    \n```\nfunction checkEmail($s) {\n  $lastDot = strrpos($s, '.');\n  $ampersat\
    \ = strrpos($s, '@');\n  $length = strlen($s);\n  return !(\n    $lastDot ===\
    \ false ||\n    $ampersat === false ||\n    $length === false ||\n    $lastDot\
    \ - $ampersat < 3 ||\n    $length - $lastDot < 3\n  );\n}\n```\n\n*Validating\
    \ Email Addresses (check.inc.php; excerpt)*\n\nValidating email addresses is difficult\
    \ because the rules for valid domain names differ drastically between countries.\
    \ For instance, bn.com is valid, whereas bn.de is not (but db.de is). Also, did\
    \ you know that username@[127.0.0.1] is a valid email address (if 127.0.0.1 is\
    \ the IP address of the mail server)?\n\nTherefore, the recommendation is to only\
    \ check for the major elements of an email address: valid characters (an @ character)\
    \ and a dot somewhere after that. It is impossible to be 100% sure with checking\
    \ email addresses—if the test is too strict, the user just provides a fantasy\
    \ email address. The only purpose of email"
