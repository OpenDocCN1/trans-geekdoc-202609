- pgno: 70
  md: '# Date and Time


    Most of the time, the date and time functionalities of PHP 5 are used for printing
    out the current date and time—to pretend that the web page is up to date (you
    would be surprised how many larger websites actually use this). But apart from
    that, working with date and time in PHP offers many other possibilities, most
    of which you will find in this chapter.


    First, though, it seems appropriate to have a look at the PHP function that is
    probably used the most for working with dates—date(). This function can take the
    current date (or an arbitrary one) and extract some information about it, for
    example, the day, whether it’s a.m. or p.m., and what time it is according to
    the rather failed marketing stunt, “Swatch Internet Time.” To do so, you call
    date() and provide a string as the first parameter. This string may now contain
    a list of formatting symbols that can be seen in Table 3.1 (the PHP manual carries
    a list with more examples at http://php.net/date). Each of these symbols is replaced
    by the associated date/time value.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Table 3.1 Formatting Symbols for date()


    | Symbol | Description |

    |--------|-------------|

    | a | am or pm |

    | A | AM or PM |

    | B | Swatch Internet Time (between 000 and 999) |

    | c | Date in ISO 8601 format |

    | d | Day of month (from 01 to 31) |

    | D | Day of week (from Mon to Sun) |

    | F | Month (from January to December) |

    | g | Hour (from 1 to 12) |

    | G | Hour (from 0 to 23) |

    | h | Hour (from 01 to 12) |

    | H | Hour (from 00 to 23) |

    | i | Minutes (from 00 to 59) |

    | I | Whether date is in DST (1) or not (0) |

    | j | Day of month (between 1 and 31) |

    | l | Day of month (from Sunday to Saturday) |

    | L | Whether date is in a leap year (1) or not (0) |

    | m | Month (from 01 to 12) |

    | M | Month (from Jan to Dec) |

    | n | Month (from 1 to 12) |

    | O | Difference to GMT (for example, +0100 for one hour ahead) |

    | r | Date in RFC 2822 format |

    | s | Seconds (from 00 to 59) |

    | S | Ordinal suffix for the day of month (st, nr, td, th) |

    | t | Number of days in the provided month (from 28 to 31) |

    | T | Time zone of server (for example, CET) |'
  merge: -1
