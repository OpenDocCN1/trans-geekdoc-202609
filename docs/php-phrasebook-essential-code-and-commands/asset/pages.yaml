  md: '# Returning Files with an HTTP Request


    ```

    $filename = ''httpfile.zip'';

    header("Content-Disposition: attachment; filename = $filename");

    ```


    When a PHP script shall return a (downloadable) file instead of HTML, the correct
    HTTP headers have to be sent:


    +   - Content-Disposition for the (proposed) name of the file

    +   - Content-Length for the file size

    +   - Content-Type for the MIME type of the file


    The preceding code reads in a ZIP file and sends it to the client; Figure 6.6
    shows its result in the browser.


    ```

    <?php

    $filename = ''httpfile.zip'';

    $mimetype = ''application/zip'';

    $data = file_get_contents($filename);

    $size = strlen($data);

    header("Content-Disposition: attachment; filename = $filename");

    header("Content-Length: $size");

    header("Content-Type: $mimetype");

    echo $data;

    ?>

    ```


    Sending a File with HTTP (httpfile.php)'
