- pgno: 182
  md: "# TIP\n\nIt is even easier to provide a third parameter to file_put_contents()\
    \ to append data instead of overwriting files:\n\n```\nfile_put_contents($filename,\
    \ $data, FILE_APPEND);\n```\n\nHowever, this all fails when a PHP version below\
    \ 5.0.0 is used because the function file_put_contents() does not exist in earlier\
    \ versions. It is, however, possible to emulate the behavior of file_put_contents()\
    \ for older PHP versions. This works similarly to reading from a file with fopen(),\
    \ fgets(), and fclose(). For writing, just one more function is required: fwrite()\
    \ writes data to a file handle. The following code implements this approach. Using\
    \ function_exists(), you can check whether the function file_put_contents() already\
    \ exists. If not, you can write it.\n\n```\n<?php\nif (!function_exists('file_put_contents'))\
    \ {\n    function file_put_contents($filename, $content)\n    {\n        if ($fp\
    \ = @fopen($filename, 'w')) {\n            $result = fwrite($fp, $content);\n\
    \            fclose($fp);\n            return $result;\n        } else {\n   \
    \         return false;\n        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 183
  md: "```\nfile_put_contents('file.txt',\n    \"\\n-> This text file contains\\nsome\
    \ random text. <-\" );\necho 'Data written to file.';\n?>\n```\n\n*Using file_put_contents()\
    \ with All Relevant PHP Versions (file_put_contents_compatible.php)*\n\n# Locking\
    \ Files\n\n```\nflock($fp, LOCK_UN);\n```\n\nWhile reading and writing files,\
    \ you have to take concurrency into mind. What if two processes try to access\
    \ the file at the same time? To avoid trouble when one process writes while the\
    \ other one reads, you have to lock the file. This is done using the PHP function\
    \ flock().\n\n```\n<?php\n    if (!function_exists('file_put_contents')) {\n \
    \       function file_put_contents($filename, $content)\n        {\n         \
    \   if ($fp = @fopen($filename, 'w') && flock($fp, LOCK_EX)) {\n             \
    \   $result = fwrite($fp, $content);\n                flock($fp, LOCK_UN);\n \
    \               fclose($fp);\n                return $result;\n            } else\
    \ {\n                return false;\n            }\n        }\n    }\n?>\n```"
