    session_set_save_handler(

    ''sess_open'', ''sess_close'', ''sess_read'',

    ''sess_write'', ''sess_destroy'', ''sess_gc'');

    ```


    There are some good reasons not to store session data in files. Performance might
    be one issue, with security as another issue. An alternative way to store session
    information is to use databases. For this, you just need a database table called
    sessiondata with three columns (the names might vary, but they have to be used
    in the upcoming listings):


    +   - Column id (primary key) is of type VARCHAR(32) and contains the session
    ID.

    +   - Column data is of type TEXT and contains the session data.

    +   - Column access is of type VARCHAR(14) and contains the time stamp of the
    most recent access to the session information.


    It doesn’t matter which database is used. This phrase uses MySQL and PHP5’s new
    mysqli extension; however, it is trivial to change the code to work with other
    databases, as well (see Chapter 7, “Making Data Dynamic,” for information about
    using many relevant databases with PHP).'
