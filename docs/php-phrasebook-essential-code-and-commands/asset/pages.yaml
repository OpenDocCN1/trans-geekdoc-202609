- pgno: 16
  md: '# Manipulating Strings


    Of all data types PHP supports, strings are probably the ones most often used.
    One of the reasons for this is that, at some point, a string representation of
    something is needed when sending out something to the client.


    PHP offers a vast number of functions suitable for strings, almost 100. In addition,
    regular expressions come in handy when looking for certain patterns in strings.
    However, in real life only a fraction of these functions are actually used. Most
    of them deserve their loyal fan base; however, some underestimated functions should
    get more attention. The phrases in this chapter offer a good mix of both: standard
    applications and rather unusual, but very useful ways to work with strings.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Comparing Strings


    ```

    strcmp($a, $b)

    strcasecmp($a, $b)

    ```


    Comparing strings seems like an easy task—use the == operator for implicit type
    conversion (so ''1'' == 1 returns true) or the === operator for type checking
    (so ''1'' === 1 returns false). However, the first method is rather flawed because
    the type conversions are not always turned into strings. For instance, 1 == ''1twothree''
    returns true, too—both values are converted into integers. Therefore, === is the
    way to go.


    However, PHP also offers functions that offer a bit more than just comparing strings
    and returning true or false. Instead, strcmp() returns a positive value when the
    string passed as the first parameter is greater than the second parameter, and
    a negative value when it is smaller. If both strings are equal, strcmp() returns
    0. If no case sensitivity is required, strcasecmp() comes into play. It works
    as strcmp(); however, it does not distinguish between uppercase and lowercase
    letters.


    ```

    <?php

    $a = ''PHP'';

    $b = ''php'';

    echo ''strcmp(): '' . strcmp($a, $b) . ''<br />'';

    echo ''strcasecmp(): '' . strcasecmp($a, $b);

    ?>

    ```


    Which outputs:


    ```

    strcmp(): -1

    strcasecmp(): 0

    ```


    *Comparing Strings (compare.php)*'
  merge: -1
  img_proc: true
- pgno: 18
  md: "These two functions can be used to sort arrays. More about custom array sorting\
    \ can be found in Chapter 2, “Working with Arrays.”\n\n# Checking Usernames\n\
    and Passwords\n\nWhen validating a username and a password (for example, in a\
    \ script that backs an HTML login form), two things seem to form a de facto standard\
    \ on the Web:\n\n+   - The password is always case sensitive. It has to be provided\
    \ exactly the same way it was set.\n+   - The username, however, is not case sensitive.\n\
    \nTherefore, a username has to be compared without considering case sensitivity.\
    \ This can be done either by using strcasecmp()—see the previous phrase—or by\
    \ first converting both the provided password and the real password into lowercase\
    \ letters (or uppercase letters). This is done by the functions strtolower() or\
    \ strtoupper(). The preceding code shows an example, using strcmp()/strcasecmp()\
    \ and also the compare operator ===.\n\n```\n<?php\n$user = (isset($_GET['user']))\
    \ ? $_GET['user'] : '';\n$pass = (isset($_GET['pass'])) ? $_GET['pass'] : '';\n\
    \nif (\n    (strtolower($user) === 'damon' && $pass === 'secret') ||\n```"
  merge: -1
  img_proc: true
- pgno: 19
  md: "# Checking Usernames and Passwords\n\n```\n```php\n(strtoupper($user) === 'SHELLEY'\
    \ && $pass ===\n'verysecret') ||\n    (strcasecmp($user, 'Christian') == 0 &&\n\
    strcmp($pass, 'topsecret') == 0)\n) {\n    echo 'Login successful.';\n} else {\n\
    \    echo 'Login failed.';\n}\n?>\n```\n```\n\n*Validating Logins by Comparing\
    \ Strings (comparelogin.php)*\n\nDepending on the data provided in the uniform\
    \ resource locator (URL) of the call to the script, the login either fails or\
    \ succeeds. For instance, the following URL successfully logs in the user (you\
    \ have to change the servername portion):\n\n`http://servername/comparelogin.php?user=cHRISTIAN&&pass=topsecret`\n\
    \nOn the other hand, the following login does fail:\n\n`http://servername/comparelogin.php?user=Christian&&pass=TopSecret`\n\
    \n> **NOTE**\n> Of course, providing usernames and passwords via GET is a very\
    \ bad idea; POST is preferred (see Chapter 4, \"Interacting with Web Forms,\"\
    \ for more details on form data). However, for testing purposes, this chapter's\
    \ code uses GET."
