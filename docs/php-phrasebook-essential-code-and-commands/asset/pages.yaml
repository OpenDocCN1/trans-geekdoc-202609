- pgno: 43
  md: "# Working with Arrays\n\n+   - Successively adding values to an array using\
    \ the variable name and square brackets\n\n```\n$a[] = 'I';\n$a[] = 'II';\n$a[]\
    \ = 'III';\n$a[] = 'IV';\n```\n\nWhen using associative arrays, the same two methods\
    \ can be used; however, this time keys and values must be provided:\n\n```\n$a1\
    \ = array('one' => 'I', 'two' => 'II', 'three' =>\n    'III', 'four' => 'IV');\n\
    $a2['one'] = 'I';\n$a2['two'] = 'II';\n$a2['three'] = 'III';\n$a2['four'] = 'IV';\n\
    ```\n\nArrays can also be nested, when an array element itself is an array:\n\n\
    ```\n$a = array(\n    'Roman' =>\n        array('one' => 'I', 'two' => 'II', 'three'\
    \ =>\n            'III', 'four' => 'IV'),\n    'Arabic' =>\n        array('one'\
    \ => '1', 'two' => '2', 'three' =>\n            '3', 'four' => '4')\n);\n```\n\
    \nNow, the Arabic representation of the number four can be accessed using $a['Arabic']['four'].\n\
    \nOf course, arrays are not only created within a script, but can also come from\
    \ other sources, including from HTML forms (see Chapter 4, “Interacting with Web\
    \ Forms”) and from cookies and sessions (see Chapter 5, “Remembering Users (Cookies\
    \ and Sessions)”). But if the array is there, what’s next? The following phrases\
    \ give some pointers."
