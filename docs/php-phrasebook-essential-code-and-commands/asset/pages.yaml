- pgno: 50
  md: "Whenever each() is used, the use of list() is a good idea. Within list(), you\
    \ provide variable names for all values with numerical indices in the array that\
    \ is returned by each(). This makes while/each() loops even easier to use, as\
    \ the code shows. Within the parentheses, the variable names are provided.\n\n\
    ```\n<?php\n$a = array('one' => 'I', 'two' => 'II', 'three' =>\n    'III', 'four'\
    \ => 'IV');\nwhile (list($key, $value) = each($a)) {\n    echo htmlspecialchars(\"\
    $key: $value\") . '<br\n/>';\n}\n?>\n```\n\n*Looping Through an Array with list()\
    \ and each() (each-list.php)*\n\n# TIP\n\nIf you are only interested in either\
    \ the key or the value of the array, you can remove one of the two variables;\
    \ just make sure that you keep the comma.\n\n```\nwhile (list(, $value) = each($a))\
    \ {\n    echo htmlspecialchars(\"$value\") .\n        '<br />';\n}\n```\n\n# Converting\
    \ Strings to Arrays\n\n```\n$a = explode(',', $csvdata);\n```\n\nSometimes, arrays\
    \ are not used to store information; instead, a string is used. The single values\
    \ are all within the string, but are separated by a special character. One example\
    \ for this is the comma separated values (CSV) format."
