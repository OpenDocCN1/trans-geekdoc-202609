    # Reading Out Form Data


    At the beginning, reading out form data was very easy: If the form field had the
    name attribute "whatever" or, in newer versions of HTML/XHTML, the id attribute
    "whatever", PHP creates a variable $whatever in the global scope. This is very
    convenient, but, from an architectural point of view, is a bad idea. Therefore,
    this was disabled by default from PHP version 4.2 onward, using the following
    php.ini directive:


    ```

    register_globals = Off

    ```


    Since PHP 3, the following global arrays existed for form data:


    +   - $HTTP_GET_VARS—All data provided using GET

    +   - $HTTP_POST_VARS—All data provided using POST

    +   - $HTTP_REQUEST_VARS—All data provided using GET or POST, or via cookies (use
    not recommended)


    These arrays are global; therefore, you have to use the global keyword to uplevel
    them to global scope if you use them within a function:'
