  md: "# # Prepared Statements with MySQL\n\n```\n```\n$stmt = mysqli_prepare();\n\
    mysqli_stmt_execute($stmt);\n```\n```\n\nThe new MySQL extension offers a way\
    \ to both avoid SQL injection and to speed up SQL statements: so-called prepared\
    \ statements. Within them, you provide placeholders for any dynamic data you are\
    \ using in the SQL code. You then assign values to those placeholders. The MySQL\
    \ extension then takes care of all the rest, including escaping of special characters.\n\
    \n```\n<?php\nif ($db = @mysqli_connect('localhost', 'user', 'password')) {\n\t\
    require_once 'stripFormSlashes.inc.php';\n\tmysqli_select_db($db, 'phrasebook');\n\
    \t$stmt = mysqli_prepare($db, 'INSERT INTO quotes (quote, author, year) VALUES\
    \ (?, ?, ?)');\n\t$quote = mysqli_real_escape_string($db, $_POST['quote']);\n\t\
    $author = mysqli_real_escape_string($db, $_POST['author']);\n\t$year = intval($_POST['year']);\n\
    \tmysqli_stmt_bind_param($stmt, 'ssi', $quote, $author, $year);\n\tif (mysqli_stmt_execute($stmt))\
    \ {\n\t\techo 'Quote saved. ';\n\t} else {\n\t\techo 'Error writing quote.';\n\
    \t}\n\tmysqli_close($db);\n} else {\n\t\techo 'Connection failed. ';\n}\n?>\n\
    ```"
