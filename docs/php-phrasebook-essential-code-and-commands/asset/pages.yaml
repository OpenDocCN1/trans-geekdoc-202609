  md: "# Converting Strings to Arrays\n\n```\n<?php\n  $csvdata = 'Sams Publishing,800\
    \ East 96th Street,Indianapolis,Indiana,46240';\n  $a = explode(',', $csvdata);\n\
    \  $info = print_r($a, true);\n  echo \"<pre>$info</pre>\";\n?>\n```\n\n*Turning\
    \ a String into an Array (explode.php)*\n\nThe PHP function explode() creates\
    \ an array out of these values; you just have to provide the character(s) at which\
    \ the string needs to be split. The browser then shows this output:\n\n```\nArray\n\
    (\n    [0] => Sams Publishing\n    [1] => 800 East 96th Street\n    [2] => Indianapolis\n\
    \    [3] => Indiana\n    [4] => 46240\n)\n```\n\n# Converting Arrays to Strings\n\
    \n```\n$address = implode('<br />', $data);\n```\n\nThe way back (that is, making\
    \ a string representation out of the elements in an array) can be done using implode().\
    \ Again, two parameters are required: the separation elements, then the array.\
    \ The order is quite unusual, yet important.\n\nSo, PHP joins the elements of\
    \ the array, using the <br /> HTML element. Therefore, in the browser, each array’s\
    \ elements stay at its own line."
