  md: '> TIP

    > If a table contains an identity column (data type INTEGER PRIMARY KEY when using
    SQLite), calling `sqlite_last_insert_rowid()` after sending an SQL statement returns
    the value this column has for the new entry in the database.


    # Retrieving Results of a Query to SQLite


    ```

    $result = sqlite_query($db, ''SELECT * FROM quotes'');

    sqlite_fetch_array($result);

    ```


    The function `sqlite_exec()` from the previous phrase is very quick performing;
    however, it is not possible to access return values from the SQL statement sent
    with it. For this, `sqlite_query()` must be used. This function returns a handle
    of the resultset of the query. The following functions can then be used to iterate
    over the resultset:


    +   - `sqlite_fetch_array()` returns the current row in the resultset as an associative
    array (field names become keys) and moves farther to the next row.

    +   - `sqlite_fetch_object()` returns the current row in the resultset as an object
    (field names become properties) and moves farther to the next row.

    +   - `sqlite_fetch_all()` returns the complete resultset as an array of associative
    arrays.'
