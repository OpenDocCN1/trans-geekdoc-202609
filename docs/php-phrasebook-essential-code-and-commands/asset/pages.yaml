- pgno: 55
  md: "# Sorting Nested Arrays\n\n![](img/1e6d362f187af50011d2666ddaa68739_55_0.png)\n\
    \nFigure 2.3 Sorting associative arrays.\n\n> NOTE\n> Trying to use sort() or\
    \ rsort() with associative arrays works—but the keys are then all lost.\n\n# Sorting\
    \ Nested Arrays\n\n```\n```php\nfunction sortNestedArray(&$a) {\n    sort($a);\n\
    \    for ($i = 0; $i < count($a); $i++) {\n        if (is_array($a[$i])) {\n \
    \           sortNestedArray($a[$i]);\n        }\n    }\n}\n```\n```\n\nThe standard\
    \ sorting functions of PHP have to give up when they work on nested arrays. However,\
    \ if you use a recursive function, you can code this in just a few lines.\n\n\
    The goal is to sort an array that is nested, but consists only of numeric subarrays,\
    \ so only numeric (and, therefore, useless) keys are used."
