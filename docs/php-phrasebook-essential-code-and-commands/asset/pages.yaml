  md: "# Creating a Web Service with PEAR::SOAP\n\nIn PHP’s official package repository\
    \ PEAR, you can find a SOAP extension at http://pear.php.net/package/SOAP. It\
    \ depends on several other packages, so you do need to install all that are mentioned\
    \ on the download page. The current released version works under PHP 4, but the\
    \ CVS system of PHP (browsable online via http://cvs.php.net/) contains a port\
    \ for PHP 5. This book uses the PHP 4 version that seems to be more tested and\
    \ in use than the PHP 5 version from CVS. Use pear install -f SOAP; you might\
    \ get a list of packages that are required for PEAR::SOAP to run.\n\n```\n```php\n\
    <?php\n    error_reporting(E_ALL ^ E_NOTICE);\n    require_once 'SOAP/Server.php';\n\
    \n    $soap = new SOAP_Server;\n    $service = new ServiceClass();\n    $soap->addObjectMap($service,\
    \ 'urn:php-phrasebook-soapservice');\n    $soap->service($HTTP_RAW_POST_DATA);\n\
    \n    class ServiceClass {\n        function add($a, $b) {\n            return\
    \ $a + $b;\n        }\n    }\n?>\n```\n```\n\nA Web Service with PEAR::SOAP (soap-pear-server.php)"
  merge: -1
