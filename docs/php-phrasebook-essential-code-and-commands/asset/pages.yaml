- pgno: 317
  md: '# PHP

    PHRASEBOOK


    PHP Phrasebook gives you the code you need to complete your web programming projects
    quickly and effectively in PHP, the leading scripting language for creating dynamic
    web pages.


    # CONCISE AND ACCESSIBLE


    Easy to carry and easy to use—lets you ditch all those bulky books for one portable
    pocket guide


    # FLEXIBLE AND FUNCTIONAL


    Packed with more than 100 customizable code snippets—so you can readily code functional
    PHP in just about any situation


    Christian Wenz is an author, trainer, and consultant with a focus on web technologies.
    He was a founding principal at the PHP Security Consortium and has contributed
    to several PHP packages in the PEAR repository.'
