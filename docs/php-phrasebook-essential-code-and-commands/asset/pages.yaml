- pgno: 174
  md: '# Using Files on the Server File System


    Although databases are very common, using the file system to store data can be
    a real alternative. Often, it is easier to implement that way. Sometimes, it is
    faster, and much more importantly, all hosting providers have file access enabled,
    whereas database support might only be available at extra cost.


    PHP supports working with files through a set of certain functions. Using wrappers,
    the same technologies can also be used to access remote data via protocols like
    Hypertext Transfer Protocol (HTTP) or File Transfer Protocol (FTP), but this is
    covered in more detail in Chapter 9. “Communicating with Others.”


    This chapter covers both standard tasks such as reading and writing files, and
    advanced tasks such as archiving files in ZIP or BZ2 format. Many of these tasks
    can be solved in different, equally usable ways, so you truly have the freedom
    of choice.'
  merge: -1
  img_proc: true
- pgno: 175
  md: "# Opening and Closing Files\n\n```\n($fp = @fopen('file.txt', 'at')\nfclose($fp);\n\
    ```\n\nFor most file system functions, the files have to be opened first. The\
    \ function fopen() does exactly this and returns a so-called file handle, a pointer\
    \ to the file. This file handle can then be used in subsequent functions to, for\
    \ instance, read information from a file or write to it.\n\nfopen() expects at\
    \ least two parameters:\n\n+   - The name of the file\n+   - The file mode to\
    \ use when accessing the file\n\n```\n<?php\n    if ($fp = @fopen('file.txt',\
    \ 'at')) {\n        echo 'File opened.';\n        fclose($fp);\n        echo '<br\
    \ />File closed.';\n    } else {\n        echo 'Error opening file.';\n    }\n\
    ?>\n```\n\n*Opening (and Closing) Files (fopen.php)*\n\nOf great interest is the\
    \ file mode parameter. This is a string that consists of one or more characters.\
    \ The first character is one of a, r, w, or x; after that, one or more special\
    \ modifiers can be used. Table 6.1 shows all modes."
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Table 6.1 File Modes for PHP''s File Functions


    | Mode | Description |

    |------|-------------|

    | a | Open file to append (write) data; create it if it doesn''t exist |

    | a+ | As mode a, but additionally with read access to the file |

    | r | Open file to read data |

    | r+ | As mode r, but in addition with write access to the file |

    | w | Open file to write data, erasing its contents; create it if it doesn''t
    exist |

    | w+ | As mode w, but in addition with read access to the file |

    | x | Create file to write data; send E_WARNING if it already exists |

    | x+ | As mode x, but in addition with read access to the file |


    So the modifier + always adds the missing read or write access to a file mode.
    There are other modifiers, as well. As of PHP 4.3.2, PHP does a really good job
    determining whether a file is a text file or a binary file and translates funny
    characters appropriately. If you append b to a file mode, you force PHP to open
    a file as a binary file; for instance, the file mode rb opens a file for reading
    in binary mode.


    Another special modifier exists that might come in handy for Windows users: t.
    If this is appended to the file mode, all \n line breaks are converted into \r\n
    as Windows applications might expect.


    fopen() returns a file handle or false if opening the file did not work. You should,
    however, suppress any'
