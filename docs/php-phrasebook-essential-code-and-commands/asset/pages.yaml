- pgno: 212
  md: "So first, you prepare an SQL statement with mysqli_prepare(); as a placeholder\
    \ character, you use a question mark:\n\n```\n$stmt = mysqli_prepare($db, 'INSERT\
    \ INTO quotes\n    (quote, author, year) VALUES (?, ?, ?)');\n```\n\nThen, you\
    \ bind values to each parameter. First, you provide the statement returned by\
    \ mysqli_prepare, then one-character codes for the values of all parameters (s\
    \ for string, i for integer, d for double). Finally, you provide a list of values.\
    \ Because these values are used by reference, you have to provide variables, not\
    \ raw values.\n\n```\nmysqli_stmt_bind_param($stmt, 'ssi', $quote,\n    $author,\
    \ $year);\n```\n\nFinally, mysqli_stmt_execute() executes the prepared statement.\n\
    \n# NOTE\n\nThe ext/mysqli extension supports some of the new features or recent\
    \ MySQL versions, including transactions. For this, the following functions are\
    \ available:\n\n+   - mysqli_autocommit($db, false) deactivates autocommit\n+\
    \   - mysqli_rollback($db) rolls back all pending transactions\n+   - mysqli_commit($db)\
    \ commits all pending transactions"
