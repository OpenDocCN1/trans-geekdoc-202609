- pgno: 63
  md: "# Sorting with Foreign Languages\n\nFor this special case, PHP offers no special\
    \ sorting method; however, you can use strnatcmp() to emulate this behavior. The\
    \ idea is to define a new order for some special characters; in the comparison\
    \ function, you then use this to find out which character is “larger” and which\
    \ is “smaller.”\n\nYou first need a function that can sort single characters:\n\
    \n```\nfunction compareChar($a, $b) {\n    $characters = 'AAÀÁÄBCÇDEÉÈFGHIÌÍJKLMNOÒÖÓPQRSTUÙÜÚVWXYZ';\n\
    \    $characters .= 'aaàáäbcçdeèéfghiìíjklmnoòöópqrstuùüúvwxyz';\n    $pos_a =\
    \ strpos($characters, $a);\n    $pos_b = strpos($characters, $b);\n    if ($pos_a\
    \ === false) {\n        if ($pos_b === false) {\n            return 0;\n     \
    \   } else {\n            return 1;\n        }\n    } elseif ($pos_b === false)\
    \ {\n        return -1;\n    } else {\n        return $pos_a - $pos_b;\n    }\n\
    }\n```\n\nThen, the main sorting function calls compareChar(), character for character,\
    \ until a difference is found. If no difference is found, the longer string is\
    \ considered to be the “greater” one. If both strings are identical, 0 is returned.\
    \ The code at the beginning of this phrase shows the compare function. The result\
    \ of this code is, as desired, Frans < Frédéric < Froni."
  merge: -1
  img_proc: true
- pgno: 64
  md: "# Applying an Effect to All Array Elements\n\n```\n$a = array_map('sanitize',\
    \ $a);\n```\n\nSometimes, data in an array has to be preprocessed before it can\
    \ be used. In Chapter 4, you will see how data coming from the user via HTML forms\
    \ can be sanitized before it is used. To do so, every array element must be touched.\n\
    \n```\n<?php\nfunction sanitize($s) {\n    return htmlspecialchars($s);\n}\n\n\
    $a = array('harmless', '<bad>', '>>click here!<<');\n$a = array_map('sanitize',\
    \ $a);\necho implode(' ', $a);\n?>\n```\n\n*Applying htmlspecialchars() to All\
    \ Elements of an Array (array_map.php)*\n\nHowever, it is not required that you\
    \ do a cumbersome for/foreach/while loop; PHP offers built-in functionality for\
    \ this. The first possibility is to use array_map(). This takes an array (second\
    \ parameter) and submits every element in that array to a callback function (first\
    \ parameter, as a string). At the end, the array is returned, with all of the\
    \ elements replaced by the associated return values of the callback function.\n\
    \nIn the preceding listing, all values in the array are converted into HTML using\
    \ htmlspecialchars()."
  merge: -1
  img_proc: true
- pgno: 65
  md: "# Applying an Effect to All Array Elements\n\nIf, however, the array turns\
    \ out to be a nested one, the tactic has to be changed a little. Then a recursive\
    \ function can be used. If an array element is a string, it is HTML-encoded. If\
    \ it’s an array, the recursive function calls itself on that array. The following\
    \ code implements this, and Figure 2.6 shows the result.\n\n```\n<?php\nfunction\
    \ sanitize_recursive($s) {\n\tif (is_array($s)) {\n\t\treturn(array_map('sanitize_recursive',\
    \ $s));\n\t} else {\n\t\treturn htmlspecialchars($s);\n\t}\n}\n\n$a = array(\n\
    \t'harmless' =>\n\t\tarray('no', 'problem'),\n\t'harmful' =>\n\t\tarray('<bad>',\
    \ '--> <worse> <--')\n\t);\n\n$a = sanitize_recursive($a);\n\necho '<pre>' . print_r($a,\
    \ true) . '</pre>';\n```\n\nRecursively Applying htmlspecialchars() to All Elements\
    \ of a Nested Array (array_map_recursive.php)"
  merge: -1
