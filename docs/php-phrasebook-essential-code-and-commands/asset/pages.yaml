- pgno: 268
  md: "# Checking Whether a Server Is Still Reacting\n\nAssume you have a web server\
    \ and you want to check periodically if it didn’t crash again. Then, using a PHP\
    \ script for this task can be a good idea. Just open a socket to the server and\
    \ wait (the last parameter of fsockopen() is a timeout value). After this time\
    \ has elapsed, you know if the server is online or offline.\n\n```\n<?php\n$server\
    \ = 'localhost';\n$port = '80';\n$status = 'unavailable';\n$fp = @fsockopen($server,\
    \ $port, $errno, $errstr, 10);\nif ($fp) {\n    $status = 'alive, but not responding';\n\
    \    fwrite($fp, \"HEAD / HTTP/1.0\\r\\n\");\n    fwrite($fp, \"Host: $server:$port\\\
    r\\n\\r\\n\");\n    if (strlen(@fread($fp, 1024)) > 0) {\n        $status = 'alive\
    \ and kicking';\n    }\n    fclose($fp);\n}\necho \"The server is $status.\";\n\
    ?>\n```\n\n*Checking the status of a server (serverstatus.php)*"
  merge: -1
