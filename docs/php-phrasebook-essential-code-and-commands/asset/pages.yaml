  md: "# Coping with “Magic Quotes”\n\nform data and cookies, gets special treatment.\
    \ All quote characters, \" and ', are escaped using the backslash character (\\\
    ). Therefore, if the user enters It's my life into a text field, the value found\
    \ in $_GET or $_POST is It\\'s my life. This was originally implemented to avoid\
    \ Structured Query Language (SQL) injection (see Chapter 8, “Using XML,” for more\
    \ details on that), but is—especially for experienced programmers—very annoying.\
    \ The only thing that is even more annoying is to remove these quotes manually\
    \ for every form field.\n\n```\n```php\n<?php\n    function stripFormSlashes($arr)\
    \ {\n        if (!is_array($arr)) {\n            return stripslashes($arr);\n\
    \        } else {\n            return array_map('stripFormSlashes', $arr);\n \
    \       }\n    }\n\n    if (get_magic_quotes_gpc()) {\n        $_GET  = stripFormSlashes($_GET);\n\
    \        $_POST = stripFormSlashes($_POST);\n    }\n?>\n```\n```\n\n*Stripping\
    \ Slashes, If They Were Added by \"Magic Quotes\" (stripFormSlashes.inc.php)*\n\
    \nThe PHP function stripslashes() removes escape backslashes from strings. However,\
    \ this function can only be called if “magic quotes” have been applied; otherwise,\
    \ it destroys backslashes that were added on purpose. You can determine whether\
    \ “magic quotes” are active by calling the Boolean function get_magic_quotes_gpc().\
    \ If this returns true, all slashes can be removed. To make this as convenient\
    \ as possible,"
