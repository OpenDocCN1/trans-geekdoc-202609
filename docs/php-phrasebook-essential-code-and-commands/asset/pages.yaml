- pgno: 67
  md: "Running the preceding code shows the following:\n\n```\n0: one\n1: two\n2:\
    \ three\n3: four\n```\n\n# Filtering Arrays\n\n```\narray_filter($values, 'checkMail')\n\
    ```\n\nImagine you get a bunch of values—from an HTML form, a file, or a database—and\
    \ want to select which of these values are actually usable and which are not.\
    \ You could again call for, foreach, or while and find out what is interesting,\
    \ or you can let PHP do most of the work. In the latter case, get acquainted with\
    \ the function `array_filter()`. This one takes two parameters—first, the array\
    \ to be filtered and, second, a function name (as a string) that checks whether\
    \ an array element is good. This validation function returns `true` upon success\
    \ and `false` otherwise. The following is a very simplistic validation function\
    \ for email addresses (see Chapter 1, “Manipulating Strings,” for a discussion\
    \ of this topic).\n\n```\n```php\n<?php\nfunction checkMail($s) {\n    $ampersand\
    \ = strpos($s, '@');\n    $lastDot = strrpos($s, '.');\n    return ($ampersand\
    \ !== false &&\n            $lastDot !== false &&\n            $lastDot - $ampersand\
    \ >= 3);\n}\n```\n```"
  merge: -1
  img_proc: true
