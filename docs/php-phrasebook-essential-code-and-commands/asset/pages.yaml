- pgno: 181
  md: "# Writing to Files\n\nWriting to files is as easy as reading from them—if you\
    \ are using PHP 5 or higher. Then, the function file_put_contents() writes data\
    \ directly to a file, and this is binary-safe. After calling the function, the\
    \ file is closed. The code writes data into a file.\n\n```\n<?php\n    file_put_contents('file.txt',\n\
    \        \"-> This text file contains\\nsome random text.\n        <-\");\n  \
    \  echo 'File written.';\n?>\n```\n\nWriting Data into a File (file_put_contents.php)\n\
    \nHowever, the preceding code overwrites the existing file. If you want to append\
    \ data (therefore emulating file mode a), you first have to read in the file’s\
    \ data.\n\n```\n<?php\n    function file_append_contents($filename, $data) {\n\
    \        $olddata = @file_get_contents($filename);\n        return file_put_contents($filename,\
    \ \n            \"$olddata$data\");\n    }\n\n    file_append_contents('file.txt',\n\
    \        \"\\n-> This text file contains\\neven more random text. <-\");\n   \
    \ echo 'Data appended to file';\n?>\n```\n\nAppending Data to a File (file_append_contents.php)"
