  md: "# Implementing a Custom Session Management\n\nThe PHP function session_set_save_handler()\
    \ can be used to provide custom functions for all relevant six session operations\
    \ PHP uses internally:\n\n+   - Opening a session\n+   - Closing a session\n+\
    \   - Reading a session variable\n+   - Writing a session variable\n+   - Destroying\
    \ a session\n+   - Cleaning up (garbage collection, for example removing old session\
    \ data from the data store)\n\nFor all these six operations, the following listing\
    \ contains code that reads and writes session data from and to a MySQL data source.\
    \ You just need PHP 5 and have to set the connection parameters (server, username,\
    \ password) appropriately. Then, you include the code from this listing using\
    \ require_once and then use sessions as usual. In the background, PHP then saves\
    \ all session information in the database and not in the file system.\n\n```\n\
    <?php\n$GLOBALS['sess_server'] = 'localhost';\n$GLOBALS['sess_db'] = 'sessions';\n\
    $GLOBALS['sess_username'] = 'user';\n$GLOBALS['sess_password'] = 'pass';\n\nfunction\
    \ sess_open() {\n    $GLOBALS['sess_mysqli'] = mysqli_connect(\n        $GLOBALS['sess_server'],\n\
    \        $GLOBALS['sess_username'],\n        $GLOBALS['sess_password']\n    );\n\
    ```"
