  md: '# Scanning Formatted Strings


    ```

    <?php

    $date = ''02/01/06'';

    $values = sscanf($date, ''%d/%d/%d'');

    vprintf(''Month: %d; Day: %d; Year: %d.'', $values);

    ?>

    ```


    *Scanning Formatted Strings (sscanf.php)*


    Alternatively, you can provide a list of variable names as additional parameters
    to sscanf(). Then the function writes the substrings that match the placeholders
    into these variables. The following code shows this:


    ```

    <?php

    $date = ''02/01/06'';

    $values = sscanf($date, ''%d/%d/%d'', $m, $d, $y);

    echo "Month: $m; Day: $d; Year: $y.";

    ?>

    ```


    *Scanning Formatted Strings (sscanf-alternative.php)*


    # Getting Detailed Information About Variables


    ```

    var_dump(false);

    ```


    The values of variables can be sent to the client using print() or echo(); however,
    this is sometimes problematic. Take Booleans, for instance. echo(true) prints
    1, but echo(false) prints nothing. A much better way is to use var_dump(), a function
    that also prints the type of the variable. Therefore, this code returns the string
    bool(false).'
