    \     $this->__dispatch_map['add'] = array(\n            'in'  => array('a' =>\
    \ 'int', 'b' => 'int'),\n            'out' => array('c' => 'int')\n        );\n\
    \    }\n\n    function __dispatch($method) {\n        if (isset($this->__dispatch_map[$method]))\
    \ {\n            return $this->__dispatch_map[$method];\n        } else {\n  \
    \          return null;\n        }\n    }\n    ..\n}\n```\n```\n\n*A WSDL-enabled\
    \ Web Service with NuSOAP*\n*(wsdl-nusoap-server.php; excerpt)*\n\nThe following\
    \ contains the rest of the code for the server; as you would expect, calling the\
    \ URL with ?wsdl at the end creates the service’s WSDL description.\n\n```\n```php\n\
    <?php\nerror_reporting(E_ALL ^ E_NOTICE);\nrequire_once 'SOAP/Server.php';\n\n\
    $soap = new SOAP_Server;\n$service = new ServiceClass();\n$soap->addObjectMap($service,\
    \ 'urn:php-phrasebook-soapservice');\n```\n```"
