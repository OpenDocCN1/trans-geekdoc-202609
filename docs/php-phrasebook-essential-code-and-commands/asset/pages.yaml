    \ substr($php, -12, -8);\n> \n> All of these calls to substr() return Prep and\
    \ are included into the complete code.\n\n# Protecting Email Addresses Using ASCII\
    \ Codes\n\n# protectMail('email@address.xy')\n\nIn the browser, you just see an\
    \ email link; however, the underlying HTML markup is indecipherable:\n\n```\n\
