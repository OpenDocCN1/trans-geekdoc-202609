  \n## 第 8 章 初学者入门 MySQL\n\nMySQL 是最流行的开源数据库。本课程从数据库基础知识、规范化和 `MySQL Workbench` 的安装开始。随后，它将教授\
  \ MySQL 命令，如 `Select`、`Insert`、`Group By`，以及 `通配符` & `函数` 等高级主题。\n\n### 数据库与 SQL\n\
  \n### 什么是数据？\n简单来说，数据可以是与所考虑的任何对象相关的实。例如，你的名字、年龄、身高、体重等都是与你相关的数据。图片、`image`、`file`、`pdf`\
  \ 等也可以被视为数据。\n\n### 什么是数据库？\n数据库是数据的系统集合。数据库支持数据的存储和操作。数据库使数据管理变得简单。让我们讨论几个例子：\n\
  * 在线电话簿肯定会使用数据库来存储与人员、电话号码、其他联系方式等相关的数据。\n* 你的电力服务供应商显然正在使用数据库来管理账单、客户相关问题、处理故障数据等。\n\
  * 我们也考虑 `facebook`。它需要存储、操作和展示与成员、其朋友、成员活动、消息、广告等更多相关的数据。\n\n### 什么是数据库管理系统 (DBMS)？\n\
  数据库管理系统（DBMS）是一个程序集合，使用户能够访问数据库、操作数据、报告/表示数据。它还有助于控制对数据库的访问。数据库管理系统并不是新概念，最早于 20\
  \ 世纪 60 年代实现。查尔斯·巴赫的集成数据存储（`IDS`）被认为是历史上第一个 DBMS。随着时间的推移，数据库技术发生了巨大演变，而数据库的使用和预期功能也大幅增加。\n\
  \n### DBMS 的类型\n让我们看看 DBMS 家族是如何随时间演变的。下面的图展示了 DBMS 类别的演变。\n\n* **层次型** - 这种类型的\
  \ DBMS 采用“父子”关系来存储数据。这种类型的 DBMS 现在很少使用。它的结构像一棵树，节点代表记录，分支代表字段。`Windows XP` 中使用的\
  \ `windows registry` 是层次型数据库的一个示例。配置设置以带有节点的树结构形式存储。\n* **网络型 DBMS** - 这种类型的 DBMS\
  \ 支持多对多关系。这通常会导致复杂的数据库结构。`RDM Server` 是实现网络模型的数据库管理系统示例。\n* **关系型 DBMS** - 这种类型的\
  \ DBMS 以表的形式（也称为关系）定义数据库关系。与网络型 DBMS 不同，`RDBMS` 不支持多对多关系。关系型 DBMS 通常具有它们支持的预定义数据类型。这是市场上最流行的\
  \ DBMS 类型。关系型数据库管理系统包括 `MySQL`、`Oracle` 和 `Microsoft SQL Server` 数据库。\n* **对象关系\
  \ DBMS** - 这种类型支持新数据类型的存储。要存储的数据以对象的形式存在。存储在数据库中的对象具有属性（例如 `gender`、`age`）和定义如何处理数据的方法`PostgreSQL`\
  \ 是对象关系 DBMS 的示例。\n\n### 什么是 SQL？\n* 结构化查询语言（`SQL`）读作 \"S-Q-L\"，有时读作 \"See-Quel\"\
  ，实际上是处理关系型数据库的标准语言。\n* `SQL` 编程可以有效地用于插入、搜索、更新、删除数据库记录。\n* 这并不意味着 `SQL` 不能做这些之外的事情。\n\
  * 事实上它可以它可以很多事情，包括但不限于数据库的优化和维护。\n* 关系型数据库如 `MySQL Database`、`Oracle`、`Ms SQL server`、`Sybase`\
  \ 等都使用 `SQL`！\n* 这些数据库使用的 `SQL` 语法几乎相似，不同之处在于某些使用少量不同的语法甚至是专有的 `SQL` 语法。\n\n###\
  \ SQL 示例\n```\nSELECT * FROM Members WHERE Age > 30\n```\n\n### 为什么要使用 MySQL？\n\
  市场上有很多关系型数据库管理系统。关系型数据库的示例包括 `Microsoft SQL Server`、`Microsoft Access`、`Oracle`、`DB2`\
  \ 等。人们可能会问为什么选择 `MySQL` 而不是其他数据库管理系统。\n\n### MySQL workbench - SQL 开发工具\n结构化查询语言（`SQL`）允许我们操作关系型数据库。`SQL`\
  \ 是所有关系型数据库的核心。\n* `MySQLworkbench` 内置了 `SQL` 可视编辑器。\n* `Visual SQL` 编辑器允许开发者针对\
  \ `MySQL server` 数据库构建、编辑和运行查询。它具有查看和导出数据的实用程序。\n* 它的语法高亮有助于开发者轻松编写和调试 `SQL` 语句。\n\
  * 可以运行多个查询，结果会自动显示在不同的标签页中。\n* 查询还保存在历史面板中，以便稍后检索和运行。\n\n### MySQL workbench - 管理工具\n\
  服务器管理对于保护公司数据起着至关重要的作用。服务器管理的主要问题是用户管理、服务器配置、服务器日志等。`Workbench MySQL` 具有以下功能，简化了\
  \ `MySQL server` 管理过程：\n* **用户管理** - 用于管理用户的可视化实用程序，让数据库管理员在需要时轻松添加新用户和删除现有用户，授予和删除权限并查看用户配置文件。\n\
  * **服务器配置** - 允许对服务器进行高级配置并微调以获得最佳性能。\n* **数据库备份和还原** - 用于导出/导入 `MySQL dump` 文件的可视化工具。`MySQL\
  \ dump` 文件包含用于创建数据库、表、视图、存储过程和插入数据的 SQL 脚本。\n* **服务器日志** - 查看 `MySQL server logs`\
  \ 的可视化工具。日志包括 `error logs`、`binary logs` 和 `InnodDB logs`。这些日志在对服务器进行诊断时非常有用。下图显示了\
  \ `MySQL Workbench` 的建模窗口。\n\n\n\n\n数据库设计的主要目标是为建议的数据库系统产生逻辑和物理设计模型。逻辑模型侧于数据需求和要存储的数据，且独立于物理考虑。它不涉及数据将如何存储或在物理上存储何处。物理数据设计模型涉及利用硬件资源和软件系统（如数据库管理系统\
  \ `DBMS`）将数据库的逻辑设计转换为物理介质上的设计。\n\n### 为什么数据库设计如此重要？\n\n数据库设计对于高性能数据库系统至关重要。除了提高性能外，设计良好的数据库易于维护、提高数据一致性，并在磁盘存储空间方面具有成本效益。注意，数据库的精之处在于其设计。使用\
  \ `SQL` 进行数据操作相对简单。\n\n### 数据库设计阶段\n\n- **逻辑模型**：此阶段涉及根据需求开发数据库模型。整个设计都在纸面上完成，没有任何物理实现或特定的\
  \ `DBMS` 考虑。\n- **物理模型**：此阶段在考虑 `DBMS` 和物理实现因素的基础上对数据库的逻辑模型进行实现。\n\n### 实现\n\n-\
  \ **数据转换与加载**：此阶段涉及将数据从旧系统导入并转换到新数据库。\n- **测试**：此阶段涉及识别新实现系统中的错误。它根据需求规范检查数据库。\n\
  \n### 两种类型的数据库技术\n\n1. 规范化\n2. ER 建模\n\n### MySQL 创建数据库、表、数据类型\n\n### 创建数据库的步骤\n\
  \nMySQL 有两种方式创建数据库：\n1) 通过执行简单的 `SQL` 查询\n2) 在 `MySQL Workbench` 中使用正向工程\n\n`CREATE\
  \ DATABASE` 是创建数据库的 `SQL` 命令。假设你需要创建一个名为 \"movies\" 的数据库。你可以通过执行以下 `SQL` 命令来实现。\n\
  \n```sql\nCREATE DATABASE movies;\n```\n\n注意：你也可以使用命令 `CREATE SCHEMA` 代替 `CREATE\
  \ DATABASE`。现在让我们改进我们的 `SQL` 查询，添加更多参数和规范。IF NOT EXISTS\n\n一个 `MySQL` 服务器可以拥有多个数据库。如果你不是唯一访问同一\
  \ `MySQL` 服务器的人，或者你必须处理多个数据库，那么可能会尝试创建一个与现有数据库同名的新数据库。`IF NOT EXISTS` 允许指示 `MySQL`\
  \ 服务器在创建数据库之前检查是否存在名称相似的数据库。当使用 `IF NOT EXISTS` 时，只有在给定的名称与现有数据库名称冲突时才会创建数据库。如果不使用\
  \ `IF NOT EXISTS`，`MySQL` 将抛出错误。\n\n```sql\nCREATE DATABASE IF NOT EXISTS movies;\n\
  ```\n\n### 创建表\n\n可以使用 `CREATE TABLE` 语句创建 MySQL 表，其实际语法如下。\n\n```sql\nCREATE TABLE\
  \ [IF NOT EXISTS] `TableName` (`fieldname` dataType [optional parameters]) ENGINE\
  \ = storage Engine;\n```\n\n- `\"CREATE TABLE\"` 负责在数据库中创建表。\n- `\"\"[IF NOT EXISTS]\"\
  ` 是可选的，只有在未找到匹配的表名时才创建表。\n- \"`fieldName\"` 是字段名，`\"data Type\"` 定义了存储在字段中的数据性质。\n\
  - `\"[optional parameters]\"` 关于字段的额外信息，例如 `AUTO_INCREMENT`、`NOT NULL` 等。\n\n**创建表示例：**\n\
  \n```sql\nCREATE TABLE IF NOT EXISTS `MyFlixDB`.`Members` (\n  `membership_number`\
  \ INT AUTOINCREMENT,\n  `full_names` VARCHAR(150) NOT NULL,\n  `gender` VARCHAR(6),\n\
  \  `date_of_birth` DATE,\n  `physical_address` VARCHAR(255),\n  `postal_address`\
  \ VARCHAR(255),\n  `contact_number` VARCHAR(75),\n  `email` VARCHAR(255),\n  PRIMARY\
  \ KEY (`membership_number`)\n) ENGINE = InnoDB;\n```\n\n现在让我们看看 `MySQL` 的数据类型有哪些。你可以根据需要使用任何一种。在创建数据库时，你应该尽量避免低估或高估潜在的数据范围。\n\
  \n## 第 10 章 数据类型\n\n数据类型定义了可以在表的特定列中存储的数据的性质。`MySQL` 有 3 大类数据类型，如下：\n\n1. 数值\n2.\
  \ 文本\n3. 日期/时间\n\n\n\n\n### 数值数据类型\n数值数据类型用于存储数值。确保你的数据范围在数值数据类型的上下边界之间是极其重要的。\n\
  \n### MySQL SELECT 语句\n### SQL SELECT 语句语法\nSQL SELECT 语句是最常用的 SQL 命令，其具有以下通用语法：\n\
  \n```sql\nSELECT [DISTINCT|ALL ] { * | [fieldExpression [AS newName]]} FROM tableName\
  \ [alias] [WHERE condition][GROUP BY fieldName(s)] [HAVING condition] ORDER BY fieldName(s)\n\
  ```\n这里\n* `SELECT` 是 SQL 关键字，告诉数据库你想检索数据。\n* `[DISTINCT | ALL]` 是可选关键字，可用于微调 SQL\
  \ SELECT 语句返回的结果。如果未指定任何内容，则默认为 `ALL`。\n* `{*|[fieldExpression [AS newName]]}` 必须指定至少一部分，`*`\
  \ 从指定的表名选择所有字段，`fieldExpression` 对指定的字段执行某些计算，例如数字相加或将两个字符串字段合并为一个字段。\n* `FROM tableName`\
  \ 是强制性的，必须包含至少一个表，多个表必须使用逗号分隔，或使用 `JOIN` 关键字进行连接。\n* `WHERE condition` 是可选的，可用于指定查询返回的结果集中的标准。\n\
  * `GROUP BY` 用于将具有相同字段值的记录组合。\n* `HAVING condition` 用于在使用 `GROUP BY` 关键字时指定标准。\n\
  * `ORDER BY` 用于指定结果集的排序顺序。\n\n星号 `*` 用于选择表中的所有列。一个简单的 SELECT 语句示例所示：\n\n```sql\n\
  SELECT * FROM `members`;\n```\n上述语句从 `members` 表中选择所有字段。分号是语句的终止符。它不是强制性的，但像这样结束语句被认为是一种良好的习惯。\n\
  \n### MySQL WHERE 子句\n### 什么是 WHERE 子句？\n在上一个教程中，我们学习了如何使用 `SELECT` 语句从数据库查询数据。`SELECT`\
  \ 语句返回了查询数据库表的所有结果。然而，某些时候我们希望将查询结果限制在指定的条件下。SQL 的 `WHERE` 子句在这种情况下派上用场。\n\n###\
  \ WHERE 子句语法\n在 `SELECT` 语句中使用 `WHERE` 子句的基本语法如下。\n\n```sql\nSELECT * FROM tableName\
  \ WHERE condition;\n```\n这里\n* `\"SELECT * FROM tableName\"` 是标准的 `SELECT` 语句\n\
  * `\"WHERE\"` 是限制我们的选择查询结果集的关键字，`\"condition\"` 是应用于结果的过滤器。过滤器可以是范围、单值或子查询。\n\n\
  现在让我们来看一个实际示例。假设我们要根据会员编号 1 从 `members` 表中获取成员的个人详情，我们将使用以下脚本来实现目标。\n\n```sql\n\
  SELECT * FROM `members` WHERE `membership_number` = 1;\n```\n\n### WHERE 子句结合 -\
  \ AND 逻辑运算符\n当 `WHERE` 子句与 `AND` 逻辑运算符一起使用时，只有在满足所有指定的过滤标准时，才会执行。现在让我们来看一个实际示例——假设我们要获取\
  \ 2008 年发布的类别为 2 的所有电影列表，我们将使用下所示的脚本来实现。\n\n```sql\nSELECT * FROM `movies` WHERE\
  \ `category_id` = 2 AND `year_released` = 2008;\n```\n\n### WHERE 子句结合 - OR 逻辑运算符\n\
  当 `WHERE` 子句与 `OR` 运算符一起使用时，只有在满足任何或全部指定的过滤标准时才会执行。以下脚本获取类别 1 或类别 2 中的所有电影\n\n```sql\n\
  SELECT * FROM `movies` WHERE `category_id` = 1 OR `category_id` = 2;\n```\n\n###\
  \ WHERE 子句结合 - IN 关键字\n当 `WHERE` 子句与 `IN` 关键字一起使用时，仅影响值匹配 `IN` 关键字提供的值列表的行。`IN`\
  \ 有助于减少你可能需要使用的 `OR` 子句数量。以下查询提供了 `membership_number` 为 1、2 或 3 的行\n\n```sql\nSELECT\
  \ * FROM `members` WHERE `membership_number` IN (1,2,3);\n```\n\n### WHERE 子句结合\
  \ - NOT IN 关键字\n当 `WHERE` 子句与 `NOT IN` 关键字一起使用时**不会**影响值匹配 `NOT IN` 关键字提供的值列表的行。以下查询提供了\
  \ `membership_number` 不是 1、2 或 3 的行\n\n```sql\nSELECT * FROM `members` WHERE `membership_number`\
  \ NOT IN (1,2,3);\n```\n\n### WHERE 子句结合 - 比较运算符\n小于 `<`、等于 (`=`)、不等于 `!=` 等比较运算符可以与\
  \ `Where` 子句配合使用。\n\n### 等\n以下脚本使用等于比较运算符从 `members` 表中获取所有女性成员。\n\n```sql\nSELECT\
  \ * FROM `members` WHERE `gender` = 'Female';\n```\n\n### MySQL 查询 INSERT INTO 表\n\
  ### 什么是 INSERT INTO？\n数据库系统的主要目标是在表中存储数据。数据通常由运行在数据库之上的应用程序提供。为此，SQL 拥有 `INSERT`\
  \ 命令，用于将数据存储到表中。\n\n### 基础语法\n让我们来看 `INSERT` 语法。\n\n```sql\nINSERT INTO tableName\
  \ (column1, column2, ...) VALUES (value1, value2, ...);\n```\n这里\n* `INSERT INTO\
  \ tableName` 告诉 MySQL 向表中添加行。\n* `(column1, column2, ...)` 指定要插入的列。\n* `VALUES (value1,\
  \ value2, ...)` 指定要添加的值。\n\n### MySQL UPDATE & DELETE 查询\n### 什么是 DELETE 关键字？\n\
  SQL DELETE 命令用于从数据库表中删除不再需要的行。它删除表中的整行。Delete 命令在从数据库中删除临时或过时数据时派上用场。`DELETE` 命令可以在一次查询中删除表中的多行。一旦行被删除，将无法恢复。因此，强烈建议在从数据库删除任何数据之前进行备份。\n\
  \n### Delete 命令语法\ndelete 命令的基本语法所示。\n\n```sql\nDELETE FROM tableName [WHERE condition];\n\
  ```\n这里\n* `DELETE FROM tableName` 告诉 MySQL 从表中删除行。\n* `[WHERE condition]` 是可选的，用于设置过滤器限制影响\
  \ DELETE 查询的行数。如果 DELETE 查询没有使用 WHERE 子句，则给定表中的所有行都将被删除。\n\n在详细讨论 DELETE 命令之前，让我们先向\
  \ movies 表中插入一些示例数据以便操作。\n\n```sql\nINSERT INTO `movies` (title, director, year_released,\
  \ category_id) VALUES ('The Great Dictator', 'Chalie Chaplie', 1920, 7);\n```\n\n\
  \n\n\n\n```sql\nINSERT INTO `movies` (`title`, `director`, `category_id`) VALUES\
  \ ('sample movie', 'Anonymous', 8);\nINSERT INTO movies (`title`, `director`, `year_released`,\
  \ `category_id`) VALUES ('movie 3', 'John Brown', 1920, 8);\n```\n\n执行上述脚本将向 `movies`\
  \ 表中添加三 (3) 部电影。在继续后续课程之前，让我们获取表中的所有电影。下方的脚本即可实现此操作。\n\n```sql\nSELECT * FROM `movies`;\n\
  ```\n\n- `delete` 命令用于从表中删除不再需要的数据。\n- `WHERE 子句`用于限制受 `DELETE` 查询影响的行数。\n- 一旦数据被删除，将无法恢复，因此强烈建议在删除数据之前进行备份。\n\
  - `update` 命令用于修改现有数据。\n- `WHERE 子句`用于限制受 `UPDATE` 查询影响的行数。\n\n### SQL 对比 MySQL：它们之间有什么区别？\n\
  \n### 什么是 SQL？\nSQL 是一种用于操作你的数据库的语言。SQL 是所有数据库通的基础语言。不同数据库之间的语法存在细微差异，但基础 SQL 语法在很大程度上保持不变。SQL\
  \ 是结构查询语言（Structured Query Language）的缩写。根据 `ANSI`（美国国家标准协会）的标准，`SQL` 是操作关系型数据库管理系统的标准语言。SQL\
  \ 用于数据库数据的访问、更新和处理。它的设计允许管理 RDBMS（如 `MYSQL`）中的数据。SQL 语言还用于控制数据访问以及数据库架构（Schemas）的创建和修改。\n\
  \n### 什么是 MYSQL？\n`MySQL` 开发于 90 年代中期，是市场上首批可的开源数据库之一。今天有许多 `MySQL` 的替代变体，这些变体之间的差异并不显著，因为它们使用相同的语法，且基本功能也保持一致。`MySQL`\
  \ 是一种 RDBMS，允许使数据库中存在保持组织良好。`MySQL` 的读音为 \"My S-Q-L\"，但也被称为 \"My Sequel\"。它以联合创始人\
  \ Michael Widenius 的女儿命名。`MySQL` 提供了对数据库的多用户访问。该 RDBMS 系统通常与 `PHP` 和 `Apache Web\
  \ 服务器` 结合并运行在 Linux 发行版之上。`MySQL` 使用 `SQL` 语言来查询数据库。\n\n\n\n\n\n# 20 道 SQL 面试题解答\n\
  \n### 1. 什么是 DBMS？\n数据库管理系统（`DBMS`）是一个控制数据库创建、维护和使用的程序。`DBMS` 可以称为文件管理器，它管理数据库中的数据，而不是将其保存在文件系统中。\n\
  \n### 2. 什么是 RDBMS？\nRDBMS 代表关系型数据库管理系统。`RDBMS` 将数据存储在表集合中，这些表通过列之间的公共字段相互关联。它还提供了关系操作符来操纵存储在表中的数据。例如：SQL\
  \ Server。\n\n### 3. 什么是 SQL？\nSQL 代表结构化查询语言，用于与数据库通信。这是一种用于执行从数据库中检索、更新、插入和删除数据等任务的标准语言。标准的\
  \ SQL 命令有 `Select`。\n\n### 4. 什么是数据库？\n数据库无非为了方便访问、存储、检索和管理数据而组织的有组织的数据。它被称为数据的结构化形式，可以通过多种方式访问。例如：学校管理数据库、银行管理数据库。\n\
  \n### 5. 什么是表（Tables）和字段（Fields）？\n表是一组按照列和行组织在模型中的数据。列可以分为垂直方向，行是水平方向。表具有指定数量的列，称为字段，但可以有任意数量的行，称为记录。例如：表：员工。字段：员工\
  \ ID、员工姓名、出生日期。数据：201456、David、11/15/1960。\n\n### 6. 什么是主键（Primary key）？\n主键是字段的组合，用于唯一指定某行。这是一种特殊的唯一键，它具有隐式的\
  \ `NOT NULL` 约束。这意味着主键值不能为 `NULL`。\n\n### 7. 什么是唯一键（Unique key）？\n`Unique key` 约束唯一地标识数据库中的每条记录。它为列或一组列提供了唯一性。`Primary\
  \ key` 约束在其上定义了自动的唯一约束。但唯一键的情况不是。每个表可以定义多个唯一约束，但每个表只能定义一个 `Primary key` 约束。\n\n\
  ### 8. 什么是外键（Foreign key）？\n外键是指与另一个表的主键关联的表。需要通过引用另一个表的主键并引用外键在两个表之间建立关系。\n\n###\
  \ 9. 什么是连接（Join）？\n这是一个关键字，用于根据表字段之间的关系从多个表中查询数据。在使用 `JOINs` 时，键起着主要作用。\n\n### 10.\
  \ 连接有哪些类型？请解释每种。\n有多种类型的连接用于检索数据，这取决于表与表之间的关系。\n\n* **内连接（Inner Join）**：当表之间至少存在一组匹配的行时，内连接返回这些行。\n\
  * **右连接（Right Join）**：右连接返回表之间公共的行以及右侧表的所有行。简单来说，即使左侧表没有匹配项，它也会返回右侧表的所有行。\n* **左连接（Left\
  \ Join）**：左连接返回表之间公共的行以及左侧表的所有行。简单来说，即使右侧表没有匹配项，它也会返回左侧表的所有行。\n* **全连接（Full Join）**：当任何一个表中存在匹配的行时，全连接返回这些行。这意味着它会返回左侧表的所有行和右侧表的所有行。\n\
  \n### 11. 什么是规范化（Normalization）？\n规范化是通过组织数据库的字段和表来最小化冗余和依赖的过程。规范化的主要目标是在单个表中对字段进行添加、删除或修改。\n\
  \n### 12. 什么是反规范化（Denormalization）？\n反规范化是一种用于从数据库的高级规范范式访问数据的技术。它也是通过合并相关表中的数据向表中引入冗余的过程。\n\
  \n### 13. 所有的不同的规范化形式有哪些？\n范式可以分为 5 种，解释如下：\n\n* **第一范式（1NF）**：这应该移除表中的所有重复列。为相关数据创建表并识别唯一列。\n\
  * **第二范式（2NF）**：满足第一范式的所有要求。将数据子集放在单独的表中，并使用主键在表之间建立关系。\n* **第三范式（3NF）**：这应该满足 2NF\
  \ 的所有要求。移除不依赖于主键约束的列。\n* **第四范式（4NF）**：满足第三范式的所有要求，且不应具有多值依赖。\n\n### 14. 什么是视图（View）？\n\
  视图是一个虚拟表，它包含表中数据的子集。视图在物理上并不存在，存储所需的空间较少。视图可以包含一个或多个表的数据，取决于它们的关系。\n\n### 15. 什么是索引（Index）？\n\
  索引是一种性能调优方法，允许更快速地从表中检索记录。索引为每个值创建一个条目，这样检索数据会更快。\n\n### 16. 索引有所有不同的类型？\n索引有三种类型：\n\
  \n* **唯一索引（Unique Index）**：如果列是唯一的，则此索引不允许字段具有重复值。在定义主键时可以应用唯一索引。\n* **聚集索引（Clustered\
  \ Index）**：这种类型的索引会重新排列表的物理顺序，并根据值进行搜索。每个表只能有一个聚集索引。\n* **非聚集索引（NonClustered Index）**：非聚集索引不改变表的物理顺序，而是维护数据的逻辑顺序。每个表可以有\
  \ 999 个非聚集索引。\n\n### 17. 什么是游标（Cursor）？\n数据库游标是一种允许遍历表中的行或记录的控件。这可以被看作是行集中某一个行的指针。游标对于遍历检索、添加和删除数据库记录非常有用。\n\
  \n### 18. 什么是关系（Relationship）？它们有哪些？\n数据库关系定义为数据库表之间的连接。有多种数据基础关系，如下：\n\n* 一对一关系。\n\
  * 一对多关系。\n* 多对一关系。\n* 自引用关系。\n\n### 19. 什么是查询（Query）？\n数据库查询是为了从数据库中获取信息而编写的代码。查询可以设计成符合我们对结果集的预期。简单来说，就是向数据库提问。\n\
  \n### 20. 什么是子查询（Subquery）？\n子查询是嵌套在查询中的查询。外部查询称为主查询，内部查询称为子查询。子查询总是先执行，子查询的结果被传递给主查询。\n\
