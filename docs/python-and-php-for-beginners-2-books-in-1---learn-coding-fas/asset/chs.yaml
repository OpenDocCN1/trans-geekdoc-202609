  * 您的默认浏览器将打开 URL `http://localhost/phplessons/index.php`。浏览器中将显示输出“Hello World!”。\n\
  \n* `XAMPP` 是 `X-cross platform`（跨平台）、`Apache`、`MySQL`、`PHP` 和 `Perl` 的缩写。\n* PHP\
  \ 编辑器是一个允许您在最短时间内编写 PHP 代码，并允许您在设计时调试语法错误的程序。\n* `Netbeans PHP editor` 是一个跨平台的开源编辑器，可以提高\
  \ PHP 开发人员的效率。\n\n### 第 3 章 PHP 数据类型、变量、常量、运算符\n\n### 数据类型\n数据类型是根据属性将数据归入不同的类别；\n\
  * 字母数字字符被归类为字符串\n* 整数被归类为整数\n* 带有小数点的数字归类为浮点数\n* 真或假值被归类为布尔（Boolean）\n\nPHP 是一种弱类型语言；它没有显式定义的数据类型。PHP\
  \ 通过分析提供的数据属性来确定数据类型。PHP 隐式支持以下数据类型\n* **整数 (Integer)** – 整数，例如 `-3`、`0`、`69`。整数的最大值取决于平台。在\
  \ 32 位机器上，通常约为 20 亿。64 位机器具有更大的值。使用常量 `PHP_INT_MAX` 来确定最大值。\n\n```php\n<?php\necho\
  \ PHP_INT_MAX;\n?>\n```\n\n\n\n\n\n`?> Output: 9223372036854775807`\n\n● **浮点数**\
  \ – 小进制数字，例如 `3.14`。它们也被称为双精度或实数。浮点数的最大值取决于平台。浮点数大于整数。\n● **字符字符串** – 例如 `Hello\
  \ World`\n● **布尔值** – 例如 `True` 或 `false`。\n\n## PHP 变量\n变量是赋值给在运行时存储数据的内存位置的名称。变量的作用域决定了它的可见性。`Php`\
  \ 全局变量可以被应用程序中的所有脚本访问。局部变量仅对定义它的脚本可见。将变量想象成一个装有水的杯子。你可以向杯子里加水、把水全部喝光、重新装水等。变量也是如此。变量用于存储数据并在需要时提供所存储的数据。与其它编程语言一样，PHP\
  \ 也支持变量。现在让我们来看一下在 PHP 中创建变量时遵循的规则。\n\n● 所有变量名必须以美元符号 `$`开头，例如 `$` 后跟一个字母或下划线。\n\
  ![Learn about PHP Variable, Operators and Data types](img/rsrc1UT.jpg)\n● 变量名大小写敏感；这意味着\
  \ `$my_var` 与 `$MY_VAR` 不同。\n![Learn about PHP Variable, Operators and Data types](img/rsrc1V0.jpg)\n\
  ● 所有变量名必须以字母开头，后跟其他字符，例如 `$my_var1`。 `$1my_var` 不是合法的变量名。\n![Learn about PHP Variable,\
  \ Operators and Data types](img/rsrc1V6.jpg)\n● 变量名不能包含任何空格，“`$first name`”不是合法的名称。你可以使用下划线代替空格，例如\
  \ `$first_name`。你不能使用美元符号或减号字符来分隔变量名。\n![Learn about PHP Variable, Operators and\
  \ Data types](img/rsrc1VC.jpg)\n\n现在让我们来看 PHP 如何根据所提供数据的属性来确定数据类型。\n\n```php\n<?php\
  \  \n$my_var = 1;  \necho $my_var;  \n?>\n```\n`?> Output: 1`\n\n### 浮点数\n```php\n\
  <?php  \n$my_var = 3.14;  \necho $my_var;  \n?>\n```\n`?> Output: 3.14`\n\n### 字符字符串\n\
  ```php\n<?php  \n$my_var =\"Hypertext Pre Processor\";  \necho $my_var;  \n?>\n\
  ```\n`?> Output: Hypertext Pre Processor`\n\n## 变量的使用\n变量有助于将数据与程序算法分离。同一个算法可以用于不同的输入数据值。例如，假设你正在开发一个将两个数字相加的计算器程序，你可以创建两个变量来接收这些数字，然后在执行加法的表达式中使用这些变量名。\n\
  \n## 变量类型转换\n在 C# 等语言中使用对变量进行算术运算，需要变量具有相同的数据类型。类型转换是将变量或值转换为所需的数据类型。在执行需要变量具有相同数据类型的算术运算时，这非常有用。PHP\
  \ 中的类型转换是由解释器完成的。在 C# 等其他语言中，你必须转换变量。PHP 也允许你转换数据类型。这被称为显式转换。\n\n```php\n<?php \
  \ \n$a = 1;  \n$b = 1.5;  \n$c = $a + $b;  \n$c = $a + (int) $b;  \necho $c;  \n\
  ?>\n```\n`?> Output: 2`\n上述代码输出 2\n\n`var_dump` 函数用于确定数据类型。下面的代码演示了如何使用 `var_dump`\
  \ 函数。\n\n```php\n<?php  \n$a = 1;  \nvar_dump($a);  \n$b = 1.5;  \nvar_dump($b);\
  \  \n$c = \"I Love PHP\";  \nvar_dump($c);  \n$d = true;  \nvar_dump($d);  \n?>\n\
  ```\n`?> Output: int(1) float(1.5) string(10) \"I Love PHP\" bool(true)`\n\n## PHP\
  \ 常量\n定义常量 - 常量是一个运行时无法更改值的变量。假设我们正在开发一个使用 `PI` 值 `3.14` 的程序，我们可以使用常量来存储它的值。现在让我们来看一个定义常量的示例。\n\
  \n```php\ndefine('PI',3.14); // 创建一个值为 3.14 的常量\n```\n一旦你定义 `PI` 为 `3.14`，编写下面的代码将产生错误：\n\
  ```php\nPI = 4; // PI 已定义为常量，因此不允许赋值。\n```\n\n## PHP 运算符\n### 算术运算符\n算术运算符用于对数值数据进行算术运算。连接运算符也作用于字符串值。PHP\
  \ 支持以下运算符。\n\n| 运算符 | 名称 | 描述 | 示例 | 输出 |\n| --- | --- | --- | --- | --- |\n| `+`\
  \ | 加法 | x 和 y 的和 | `1 + 1;` | `2` |\n| `-` | 减法 | x 和 y 的差 | `1 – 1;` | `0` |\n\
  | `*` | 乘法 | x 和 y 的积 | `1 * 1;` | `1` |\n| `/` | 除法 | x 和 y 的商 | `1 / 1;` | `1`\
  \ |\n| `%` | 取模 | x 除 y 的余数 | `1 % 1;` | `0` |\n| `**` | 幂 | x 的次方 | `2 ** 3;` |\
  \ `8` |\n\n### 赋值运算符\n赋值运算符用于向变量赋值。它们也可以与算术运算符结合使用。\n\n| 运算符 | 名称 | 描述 | 示例 | 输出\
  \ |\n| --- | --- | --- | --- | --- |\n| `=` | 赋值 | 将值赋予 x | `x = 5;` | `5` |\n|\
  \ `+=` | 加法 | x 增加 | `x += 1;` | `6` |\n| `-=` | 减法 | 从 x 中减去 | `x -= 2;` | `3`\
  \ |\n| `*=` | 乘法 | x 乘以 | `x *= 3;` | `9` |\n| `/=` | 除法 | x 除以 | `x /= 2;` | `2`\
  \ |\n| `%=` | 取模 | x 对 y 的余数 | `x %= 2;` | `1` |\n\n### 比较运算符\n比较运算符用于比较值和数据类型。\n\
  \n| 运算符 | 名称 | 描述 | 示例 | 输出 |\n| --- | --- | --- | --- | --- |\n| `==` | 等于 | 比较\
  \ x 和 y，如果相等则返回真 | `1 == \"1\";` | `1` |\n| `===` | 恒等 | 同时比较值和数据类型 | `1 === \"\
  1\";` | `0` |\n| `!=`, `<>` | 不等于 | 比较 x 和 y，如果不相等则返回真 | `2 != 1;` | `1` |\n| `>`\
  \ | 大于 | 比较 x 和 y，如果 x 大于 y 则返回真 | `3 > 1;` | `1` |\n| `<` | 小于 | 比较 x 和 y，如果 x\
  \ 小于 y 则返回真 | `2 < 1;` | `0` |\n| `>=` | 大于等于 | 比较 x 和 y，如果 x 大于等于 y 则返回真 | `1 >=1`\
  \ | `1` |\n| `<=` | 小于等于 | 比较 x 和 y，如果 x 小于等于 y 则返回真 | `8 <= 6` | `0` |\n\n### 逻辑运算符\n\
  在使用逻辑运算符时，任何大于或小于零 (0) 的数字均求值为真。零 (0) 求值为假。\n\n| 运算符 | 名称 | 描述 | 示例 | 输出 |\n| ---\
  \ | --- | --- | --- | --- |\n| `and`, `&&` | 与 | 如果 x 和 y 都为真则返回真 | `1 and 4;True&&\
  \ False;` | `1` 或 `0` |\n| `or`, `||` | 或 | 如果 x 或 y 只要有一个为真则返回真 | `6 or 9;0 ||\
  \ 0;` | `1` 或 `0` |\n| `xor` | 异或 | 如果仅 x 为真或仅 y 为真则返回真 | `1 xor 1;1 xor 0;` | `0`\
  \ 或 `1` |\n| `!` | 非 | 如果 x 为假则返回真，如果 x 为真则返回假 | `!0;` | `1` |\n\n\n\n\n- `PHP`\
  \ 是一种弱类型语言。\n- 变量是用于存储数据的内存位置。\n- 常量的值在运行时不能更改。\n- 类型强制转换用于将值或变量转换为所需的数据类型。\n- 算术运算符用于处理数值数据。\n\
  - 赋值运算符用于将数据分配给变量。\n- 比较运算符用于比较变量或值。\n- 逻辑运算符用于比较条件或值。\n\n# 第 4 章 PHP 数组：关联数组、多维数组\n\
  \n`PHP` `array`（数组）是一种变量，它可以在单个变量中存储多个相关数据。将数组想象成一个内部带有隔板的巧克力盒。盒子代表数组本身，而装有巧力的空间代表存储在数组中的值。\n\
  \n### 索引数组\n\n索引数组使用数字作为访问键。`access key` 是数组变量中内存槽的引用。每当我们想要读取或为数组元素分配新值时，都会使用 `access\
  \ key`。下面是在 `php` 中创建索引数组的语法格式。\n\n```php\n<?php  \n$variable_name[n] = value; \
  \ \n?> \n```\n或者\n```php\n<?php  \n$variable_name = array(n => value, …);  \n?>\n\
  ```\n这里，\n- `$variable_name...` 是变量名。\n- `[n]` 是元素的访问索引数字。\n- `value` 是分配给数组元素的值。\n\
  \n现在让我们来看一个索引数组的示例。假设我们有 5 部电影想要存储在数组变量中。我们可以使用下所示的示例来实现。\n\n```php\n<?php  \n$movie[0]\
  \ = 'Shaolin Monk';  \n$movie[1] = 'Drunken Master';  \n$movie[2] = 'American Ninja';\
  \  \n$movie[3] = 'Once upon a time in China';  \n$movie[4] = 'Replacement Killers';\
  \  \n?>\n```\n\n每部电影都分配了一个索引数字，用于检索或修改其值。观察以下代码：\n\n```php\n<?php  \n$movie[0]=\"\
  Shaolin Monk\";  \n$movie[1]=\"Drunken Master\";  \n$movie[2]=\"American Ninja\"\
  ;  \n$movie[3]=\"Once upon a time in China\";  \n$movie[4]=\"Replacement Killers\"\
  ;  \n\necho $movie[3];  \n$movie[3] = \" Eastern Condors\";  \necho $movie[3]; \
  \ \n?>\n```\n输出：\nOnce upon a time in China\nEastern Condors\n\n如从上面的示例所示，在 `PHP`\
  \ 中处理相同性质的多个值时，操作数组是非常简单灵活的。此外，上面的数组变量也可以以下代码创建。\n\n```php\n<?php  \n$movie = array(0\
  \ => \"Shaolin Monk\",  \n               1 => \"Drunken Master\",  \n          \
  \     2 => \"American Ninja\",  \n               3 => \"Once upon a time in China\"\
  ,  \n               4 =>\"Replacement Killers\" );  \necho $movie[4];  \n?>\n```\n\
  输出：Replacement Killers\n\n## PHP 关联数组\n\n关联数组与索引数组的区别在于，关联数组使用描述性名称作为 `id` 键（key）。下面是在\
  \ `php` 中创建关联数组的语法格式。\n\n```php\n<?php  \n$variable_name['key_name'] = value;  \n\
  $variable_name = array('key_name' => value);  \n?>\n```\n这里，\n- `$variable_name...`\
  \ 是变量名。\n- `['key_name']` 是元素的访问索引数字。\n- `value` 是分配给数组元素的值。\n\n假设我们有一组人，并想要将每个人的性别分配给他们的名字。我们可以使用关联数组来实现。下面的代码可以帮助我们完成操作。\n\
  \n```php\n<?php  \n$persons = array(\"Mary\" => \"Female\", \"John\" => \"Male\"\
  , \"Mirriam\" => \"Female\");  \nprint_r($persons);  \necho \"\";  \necho \"Mary\
  \ is a \" . $persons[\"Mary\"];  \n?>\n```\n\n## PHP 数组函数\n\n### count 函数\n\n`count`\
  \ 函数用于统计 `php` 数组包含的元素数量。下面的代码显示了实现。\n\n```php\n<?php  \n$lecturers = array(\"Mr.\
  \ Jones\", \"Mr. Banda\", \"Mrs. Smith\");  \necho count($lecturers);  \n?>\n```\n\
  输出：3\n\n### is_array 函数\n\n`is_array` 函数用于判断变量是否为数组。现在来看一个示例。\n\n```php\n<?php \
  \ \n$lecturers = array(\"Mr. Jones\", \"Mr. Banda\", \"Mrs. Smith\");  \necho is_array($lecturers);\
  \  \n?>\n```\n\n### sort 函数\n\n`sort` 函数用于排序数组。如果值是字母数字，它将按字母顺序排序。如果值是数值，它将按升序排序。接下来的示例：\n\
  \n```php\n<?php  \n$persons = array(\"Mary\" => \"Female\", \"John\" => \"Male\"\
  , \"Mirriam\" => \"Female\");  \nsort($persons);  \nprint_r($persons);  \n?>\n```\n\
  \n### ksort 函数\n\n`ksort` 函数用于按键对数组排序。接下来的示例：\n\n```php\n<?php  \n$persons = array(\"\
  Mary\" => \"Female\", \"John\" => \"Male\", \"Mirriam\" => \"Female\");  \nksort($persons);\
  \  \nprint_r($persons);  \n?>\n```\n\n### asort 函数\n\n`asort` 函数用于按值对数组排序。接下来的示例：\n\
  \n```php\n<?php  \n$persons = array(\"Mary\" => \"Female\", \"John\" => \"Male\"\
  , \"Mirriam\" => \"Female\");  \nasort($persons);  \nprint_r($persons);  \n?>\n\
  ```\n\n### 为什么要使用数组？\n\n- 数组有助于分组相关信息。\n- 数组有助于编写整洁的代码。\n- 数组可以扩展。\n\n# 第 5 章 PHP\
  \ 控制结构\n\n### If else, Switch Case\n\n什么是控制结构？代码执行可以如下所示：\n\n- **顺序**：按照编写顺序执行所有代码。\n\
  - **决策**：在给定选项的情况下进行选择。代码执行取决于条件。\n\n控制结构是根据值决定程序执行路径的代码块。现在来看 PHP 支持的一些控制结构。\n\n\
  ### If Else\n\n`if... then... else` 是简单的控制结构。你有一段仅在条件为真时执行的代码。`if... then... else`\
  \ 的语法如下：\n\n```php\nif (condition is true) { \nblock one \nelse \nblock two \n}\n\
  ```\n这里，\n- `if (condition is true)` 是控制结构。\n- `block one` 是条件为真时执行的代码。\n- `{...else}`\
  \ 是条件为假时的备选。\n- `block two` 是条件为假时执行的代码块。\n\n工作原理：下面的代码使用 `if... then... else` 来确定两个数字之间的较大值。\n\
  \n```php\n<?php  \n$first_number = 7;  \n$second_number = 21;  \n\nif ($first_number\
  \ > $second_number){  \n  echo \"$first_number is greater than $second_number\"\
  ;  \n}else{\n  echo \"$second_number is greater than $first_number\";  \n}  \n?>\n\
  ```\n输出：21 is greater than 7\n\n### Switch Case\n\n`Switch... case` 类似于 `if then...\
  \ else` 控制结构。它根据条件的值只执行单个代码块。如果没有满足任何条件，则执行 `default` 代码块。它具有以下基本语法：\n\n```php\n\
  switch(condition){\n  case value:  \n    //要执行的代码块\n    break;  \n  case value2:\
  \  \n    //要执行的代码块\n    break;  \n  default:  \n    // 默认块代码\n    break;  \n}\n\
  ```\n\n\n\n\n\n## Switch 结构 (Switch Structure)\n\n?> 这里，\n● `switch(…){…}` 是控制结构块代码\
  \ \n● `case value: case…` 是根据条件值执行的代码块 \n● `default:` 是当没有值与条件匹配时执行的代码块\n\n### 工作原理\n\
  下方的流程图展示了 `switch` 控制结构是如何工作的 ![](img/rsrc2F1.jpg)\n\n## PHP 循环：For, ForEach, While,\
  \ Do While\n\n[示例]\n循环（Loop）是一种迭代控制结构，它涉及到在满足特定条件之前重复执行相同次数的代码。\n\n### PHP For 循环\n\
  上述代码输出“21 大于 7”\n\n### For 循环\n`for...` 循环按指定的次数执行代码块。for 循环主要有两种类型：\n● `for`\n\
  ● `for… each.`\n\n现在，让我们分别单独查看它们。\n\n### For 循环\n它具有以下基本语法：\n```php\n<?php\nfor\
  \ (initialize; condition; increment){\n  // 要执行的代码\n}\n?>\n```\n?> 这里，\n● `for…{…}`\
  \ 是循环块 \n● `initialize` 通常是一个整数；用于设置计数器的初始值。 \n● `condition` 是每次 php 执行时评估的条件。如果评估结果为真，则终止\
  \ `for...` 循环。如果评估结果为假，则继续执行 `for...` 循环。 \n● `increment` 用于增加计数器整数的初始值。\n\n###\
  \ 工作原理\n下方的流程图展示了 php 中的 `for` 循环是如何工作的 ![](img/rsrc2FS.jpg)\n\n### 如何编写代码\n下面的代码使用\
  \ `for… 循环` 打印 10 乘以 0 到 10 的结果：\n```php\n<?php\nfor ($i = 0; $i < 10; $i++){\n\
  \  $product = 10 * $i;\n  echo \"The product of 10 * $i is $product <br/>\";\n}\n\
  ?>\n```\n输出：\nThe product of 10 x 0 is 0\nThe product of 10 x 1 is 10\nThe product\
  \ of 10 x 2 is 20\nThe product of 10 x 3 is 30\nThe product of 10 x 4 is 40\nThe\
  \ product of 10 x 5 is 50\nThe product of 10 x 6 is 60\nThe product of 10 x 7 is\
  \ 70\nThe product of 10 x 8 is 80\nThe product of 10 x 9 is 90\n\n### PHP For Each\
  \ 循环\n`php foreach` 循环用于遍历数组值。它具有以下基本语法：\n```php\n<?php\nforeach($array_variable\
  \ as $array_value){\n  // 代码块\n}\n?>\n```\n?> 这里，\n● `foreach(…){…}` 是循环块 \n● `$array_data`\
  \ 是要循环的数组 \n● `$array_value` 是持有当前项目的临时变量 \n● `block of code`\n\n### 工作原理\n下方的流程图展示了\
  \ `foreach` 循环是如何工作的 ![](img/src2GK.jpg)\n\n### While 循环\n\nWhile 循环\n它们用于执行代码块，直到满足某个条件。\n\
  \n### 何时使用 while 循环\n● While 循环用于从数据库查询中读取记录。\n\n### while 循环的类型\n● `do… while`\
  \ - 在条件之前至少执行一次代码块\n● `while…` - 先检查条件。如果评估结果为真，则只要条件满足就执行代码块。如果评估结果为假，则终止执行。\n\n\
  ### While 循环\n它具有以下语法：\n```php\n<?php\nwhile (condition){\n  // 要执行的代码块\n}\n?>\n\
  ```\n?> 这里，\n● `while(…){…}` 是循环块 \n● `condition` 是 while 循环评估的条件 \n● `block of\
  \ code`\n\n### 工作原理\n下方的流程图展示了 while 循环是如何工作的 ![](img/src2HF.jpg)\n\n### PHP Do\
  \ While\n`while… 循环` 与 `do… while 循环` 的区别在于，`do… while` 在评估条件之前至少执行一次。\n\n现在，让我们来看\
  \ `do… while 循环` 的基本语法：\n```php\n<?php\ndo{\n  // 要执行的代码块\n} while (condition);\n\
  ?>\n```\n?> 这里，\n● `do{…} while(…)` 是循环块 \n● `condition` 是 while 循环评估的条件 \n● `block\
  \ of code`\n\n### 工作原理\n下方的流程图展示了 `while… 循环如何工作 ![](img/src2J5.jpg)\n\n## 第 6 章\
  \ PHP 字符串函数：substr, strlen, strtolower, explode, strpos, str_replace\n\n### 什么是字符串？\n\
  字符串是字符集合。字符串是 PHP 支持的数据类型之一。字符串变量可以包含字母数字。字符串在以下情况下创建：\n● 你声明变量并为其分配字符串字符\n● 你可以直接在\
  \ `echo` 语句中使用它们\n● 字符串是语言结构，有助于捕捉词汇。\n\n学习 PHP 中字符串的工作原理以及如何操作它们将使你成为一名高效且多产开发者。\n\
  \n### PHP 创建字符串\n现在让我们来看创建字符串的不同方式。\n\n### 创建字符串\n**使用单引号**：创建字符串最简单的方法是使用单引号。让我们看一个在\
  \ PHP 中创建简单字符串的示例。\n```php\n<?php\nvar_dump(\"You need to be logged in to view this\
  \ page\");\n?>\n```\n输出：`string(42) \"You need to be logged in to view this page\"\
  `\n\n**转义单引号**：如果单引号是字符串值的一部分，可以使用反斜杠对其进行转义。下面的代码展示了如何转义单引号。\n```php\n<?php\necho\
  \ \"I \\\\'ll be back after 20 minutes\";\n?>\n```\n\n\n\n\n?> 输出: 我将在 20 分钟后回来\n\
  \n# PHP 函数：数值、内置、字符串、日期、用户定义\n\n### 什么是函数？\n函数是执行特定操作的可重用代码段或块。函数在调用时可以返回值，也可以简单地执行操作而不返回任何值。`PHP`\
  \ 拥有 700 多个 `内置` 函数，用于执行不同的任务。\n\n### 为什么使用函数？\n* **更好的代码组织**：函数允许我们我们将执行特定任务的相关代码块组合在一起。\n\
  * **可重用性**：一旦定义，函数就可以在 `PHP` 文件中的多个脚本中调用。这节省了我们在执行如连接数据库等例行任务时重复“造轮子”的时间。\n* **易于维护**：系统的更新只需要在一个地方进行即可。\n\
  \n### 内置函数\n内置函数是存在于 `PHP` 安装包中的函数。这些内置函数使 `PHP` 成为一种非常高效且高产的脚本语言。内置函数可以分为许多类。以下是类别列表。\n\
  \n### 字符串函数\n这些是处理字符串数据的函数，请参考关于字符串的文章获取字符串函数的实现示例。\n\n### 数值函数\n数值函数是返回数值结果的函数。`Numeric\
  \ php function` 可用于格式化数字、返回常量、执行数学计算等。\n\n### 日期函数\n`date` 函数用于将 `Unix` 日期和时间格式化为人类可读的格式。查看\
  \ `PHP` `date` 函数文章获取更多详情。\n\n### 其他函数\n这些包括：\n* **数组**：请查看关于数组的文章示例\n* **文件**：请查看关于文件的文章获取示例\n\
  * **数据库函数**：请查看 `MySQL PHP` 和其他数据库访问方法 v2 文章\n\n## 为什么使用用户定义函数？\n在以下情况下，用户定义函数会非常有用：\n\
  * 你的应用程序中有例行任务，例如向数据库中添加数据\n* 对数据进行验证检查\n* 在系统中对用户进行身份验证等。\n\n这些活动将分布在多个页面中。创建一个所有这些页面都可以调用的函数是使\
  \ `PHP` 成为强大脚本语言的特性之一。\n\n在我们创建第一个用户定义函数之前，让我们先看看创建自己的函数时必须遵循的规则：\n* 函数名必须以字母或下划线开头，但不能以数字开头。\n\
  * 函数名必须是唯一的。\n* 函数名不能包含空格。\n* 使用描述性的函数名被认为是一种良好的实践。\n* 函数还可以选择接受参数并返回值。\n\n现在让我们创建第一个函数。我们将创建一个非常基础的函数，用于说明\
  \ `PHP` 函数的主要组成部分。\n\n```php\n<?php  \n//定义一个显示 hello function 的函数\nfunction add_numbers(){\
  \  \n    echo 1 + 2;  \n}  \nadd_numbers ();  \n?>\n```\n?> 输出: 3\n\n在这里，\n* `function...(){}`\
  \ 是函数块，告诉 `PHP` 你正在定义一个自定义函数。\n* `add_numbers` 是使用函数时将调用的函数名。\n* `()` 可用于向函数传递参数。\n\
  * `echo 'Hello function!';` 是执行的函数代码块。它可以是上述示例之外之外的任何代码。\n\n现在来看一个相当复杂的示例，它接受一个参数并像上面的函数一样显示消息。假设我们想要写一个在屏幕上打印用户函数，我们可以写一个接受用户名的自定义函数。\n\
  \n```php\n<?php  \nfunction display_name($name) {\n    echo \"Hello \" . $name;\
  \  \n}  \ndisplay_name(\"Martin King\");\n?>\n```\n?> 输出: Hello King\n\n在这里，\n*\
  \ `($name)` 是参数，并初始化为匿名。如果没有向函数传递参数，将导致错误。\n\n现在我们来看一个接受参数并返回值的值的函数。我们将创建一个将千里转换为英里的函数。\n\
  \n```php\n<?php  \nfunction kilometers_to_miles($kilometers) {\n    $miles = 0;\n\
  \    return $miles;  \n}  \necho kilometers_to_miles(100);  \n?>\n```\n?> 输出: 62\n\
  \n# 使用 GET 方法的 PHP 表单\n\n### 什么是表单？\n表单是一个包含用户界面项（如输入框、按钮等）的 HTML 标签。表单使用 `<form>`\
  \ 标签定义。\n\n### 为什么使用表单？\n* 表单对于开发动态应用程序有用。\n* 表单可编辑数据库中的现有数据。\n* 我们将使用 HTML 标签来创建表单。\n\
  \n### 示例\n下面的代码创建了一个注册表单：\n\n```html\n<html>\n<head>\n    <title>注册表单</title>\n\
  \    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\">\n</head>\n\
  <body>\n    <h2>注册表单</h2>\n    <form action=\"registration.php\" method=\"POST\"\
  >\n        First name: <input type=\"text\" name=\"firstname\"> <br>\n        Last\
  \ name: <input type=\"text\" name=\"lastname\"> <br>\n        <input type=\"hidden\"\
  \ name=\"form_submitted\" value=\"1\" />\n        <input type=\"submit\" value=\"\
  Submit\">\n    </form>\n</body>\n</html>\n```\n在网络浏览器中查看上述代码将显示以下表单：\n* `<form>...</form>`\
  \ 是表单的开始和结束标签。\n* `action=\"registration.php\" method=\"POST\"` 指定了目标 URL 和提交类型。\n\
  * `First name/Last name:` 是输入框的标签。\n* `<input type=\"text\">` 是输入框标签。\n* `<br>`\
  \ 是换行。\n* `<input type=\"hidden\" name=\"form_submitted\" value=\"1\"/>` 是用于检查表单是否提交的隐藏值。\n\
  * `<input type=\"submit\" value=\"Submit\">` 是按钮，点击时会将表单提交到服务器进行处理。\n\n## PHP POST\
  \ 方法\n这是内置的 `PHP` 超全局数组变量，用于获取通过 HTTP POST 方法提交的值。该数组变量可以从程序中的任何脚本访问；它具有全局作用域。\n\
  \n使用 post 方法的一个良好示例是向服务器提交登录详情。它的语法如下：\n\n```php\n<?php  \n$_POST['variable_name'];\
  \  \n```\n\n\n\n\n\n`$_POST[…]` 是 PHP 数组。`'variable_name'` 是 URL 变量名。\n\n### PHP\
  \ GET 方法\n`$_GET` 是 PHP 内置的超全局数组变量，用于获取通过 HTTP GET 方法提交的值。\n- 该数组变量可以从程序中的任何脚本访问；它具有全局作用域。\n\
  - 此方法会在 URL 中显示表单值。\n- 它非常适合搜索引擎表单，因为它允许用户对结果进行收藏。\n\n它具有以下语法：\n```php\n<?php\n\
  $_GET['variable_name'];\n?>\n```\n在这里，`$_GET[…]` 是 PHP 数组。`'variable_name'` 是 URL\
  \ 变量名。\n\n# 第 7 章 PHP File() 函数：`file_exists`, `Fopen`, `fwrite`, `Fclose`, `Fgets`,\
  \ `copy`, `unlink`\n\n### 什么是文件？\n文件简单来说是计算机上存储信息的资源。文件通常用于存储此类信息：\n- 程序的配置设置\n\
  - 简单的数据，例如电话号码对应的联系人。\n- 图像、图片、照片等。\n\n## PHP 文件格式支持\nPHP 文件函数支持广泛的文件格式，包括：\n- `File.txt`\n\
  - `File.log`\n- `File.custom_extension`，即 `file.xyz`\n- `File.csv`\n- `File.gif`,\
  \ `file.jpg` 等\n\n与需要其他软件和技能来管理 DBMS 系统的相比，文件为简单数据提供了永久且高效的数据存储解决方案：\n- 你想要存储简单数据（如服务器日志）以便后续检索和分析。\n\
  - 你想要存储程序设置，即 `program.ini`\n\n### PHP 函数\nPHP 通过其丰富的内置函数集合提供了一种方便的文件处理方法。Windows\
  \ 和 MAC OS 等操作系统对大小写敏感，而 Linux 或 Unix 操作系统对大小写敏感。采用仅使用小写字母进行文件命名的规范是一种良好的做法，可以确保最大的跨平台兼容性。\n\
  \n现在让我们来看一些常用的 PHP 文件函数。\n\n### PHP `file_exists` 函数\n此函数用于判断文件是否存在。\n- 当我们想在处理文件之前知道该文件是否存在时，它非常有用。\n\
  - 当你创建一个新文件并想确保该文件不存在时，也可以使用此函数。\n\n`file_exists` 函数具有以下语法：\n```php\n<?php\nfile_exists($filename);\n\
  ?>\n```\n在这里，`file_exists()` 是 PHP 函数，如果文件存在则返回 true，如果不存在则返回 false。 `$file_name`\
  \ 是要检查的文件路径和名称。以下代码使用 `file_exists` 来判断 `settings.txt` 是否存在。\n\n```php\n<?php\n\
  if (file_exists('settings.txt')) {\n    echo 'file found!';\n} else {\n    echo\
  \ 'settings.txt does not exist';\n}\n?>\n```\n将上述代码保存名为 `file_function.php` 的文件中。假设你将文件保存在\
  \ htdocs 中的 `phptuts` 文件夹中，打开 URL http://localhost/phptuts/file_function.php。\n\n\
  ## PHP Try Catch 示例：异常与错误处理\n\n### 什么是异常？\n错误是程序本身无法处理的意外程序结果。错误通过修复程序来解决。错误的一个例子是永不停止执行的无限循环。\n\
  \n异常是程序本身可以处理的意外程序结果。异常的示例包括尝试打开一个不存在的文件。这种异常可以通过创建文件或向用户提供搜索文件的选项来处理。\n\n## PHP\
  \ 错误处理\n当发生错误时，取决于你的配置设置，PHP 会在浏览器中显示与发生错误相关的信息。PHP 提供了多种处理错误的方法。我们将查看三种 (3) 常用方法：\n\
  \n1. **Die 语句**：`die` 函数将 `echo` 和 `exit` 函数合并为一。当我们希望在发生错误时输出一条消息并停止脚本执行时，它非常有用。\n\
  2. **自定义错误处理器**：这些是每当发生错误时就会调用的用户自定义函数。\n3. **PHP 错误报告**：错误消息取决于你的 PHP 错误报告设置。这种方法在开发环境中非常有用，因为你可能不知道导致错误的原因。显示的信息可以帮助你调试应用程序。\n\
  \n\n\n\n\n# 20 个 PHP 面试题解答\n\n### 1) 什么是 PHP？\nPHP 是一种基于脚本的 Web 语言，允许开发者动态创建生成的网页。\n\
  \n### 2) PHP 的缩写代表什么？\nPHP 代表 `PHP`：Hypertext Preprocessor（超文本处理器）。\n\n### 3) PHP\
  \ 像哪种编程语言？\nPHP 的语法类似于 Perl 和 `C`。\n\n### 4) PEAR 代表什么？\nPEAR 代表 \"PHP Extension\
  \ and Application Repository（PHP 扩展与应用程序库）。它扩展了 PHP 并为 Web 开发者提供了更高层次的编程。\n\n###\
  \ 5) 实际使用的 PHP 版本是什么？\n推荐使用的 PHP 版本是 `7.1` 或 `7.2`。\n\n### 6) 如何从命令行执行 PHP 脚本？\n\
  只需使用 PHP 命令行界面 (`CLI`) 并指定要执行的脚本文件名，如下：\n```\nphp script.php\n```\n\n### 7) 如何从命令行界面运行交互式\
  \ PHP Shell？\n只需使用带有 `-a` 选项的 PHP CLI 程序如下：\n```\nphp -a\n```\n\n### 8) 启动和结束 PHP\
  \ 代码块的正确且最常用的方法是什么？\n启动和结束 PHP 脚本最常用的方法是：\n```php\n<?php --- PHP 代码---- ?>\n```\n\
  和\n```php\n<? <? PHP 代码 --- ?>\n```\n\n### 9) 如何直接将输出显示到浏览器？\n为了能够将输出显示到浏览器，我们必须使用特殊标签\
  \ `<?=` 和 `?>`。\n\n### 10) PHP 4 和 PHP 5 的主要区别是什么？\nPHP 5 提供了许多额外的 OOP（面向对象编程）特性。\n\
  \n### 11) PHP 支持多重继承吗？\nPHP 只支持单继承；这意味着一个类只能使用 `extended` 关键字从一个类进行扩展。\n\n### 12)\
  \ final 类（final class）和 final 方法（final method）什么含义？\n`final` 是 `PHP5` 中引入的。final\
  \ 类意味着该类不能被扩展，final 方法不能被重写。\n\n### 13) PHP 中如何对对象进行比较？\n我们使用运算符 `==` 来测试两个对象是否实例化自同一个类，并且具有相同的属性和相等的值。我们可以通过恒等运算符\
  \ `===` 来测试两个对象是否引用自同类的同一个实例。\n\n### 14) PHP 和 HTML 如何交互？\n可以通过 PHP 脚本生成 HTML，也可以从\
  \ HTML 向 PHP 传递部分信息。\n\n### 15) 当通过表单或 URL 传递值时，需要什么类型的操作？\n如果我们想通过表单或 URL 传递值，我们需要使用\
  \ `htmlspecialchars()` 和 `urlencode()` 对它们进行编码和解码。\n\n### 16) PHP 和 Javascript 如何交互？\n\
  PHP 和 Javascript 无法直接交互，因为 PHP 是服务端语言而 Javascript 是客户端语言。但是，我们可以交换变量，因为 PHP 可以生成供浏览器执行的\
  \ Javascript 代码，并且可以通过 URL 将特定变量传回 PHP。\n\n### 17) 使用图像函数需要什么？\n执行图像函数需要 GD 库。\n\
