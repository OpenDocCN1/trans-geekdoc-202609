    \ we understand that one task can be performed in different ways. For example\
    \ You have a class animal, and all animals speak. But they speak differently.\
    \ Here, the \"speak\" behavior is polymorphic in the sense and depends on the\
    \ animal. So, the abstract \"animal\" concept does not actually \"speak\", but\
    \ specific animals (like dogs and cats) have a concrete implementation of the\
    \ action \"speak\". Encapsulation Encapsulation is also an important aspect of\
    \ object-oriented programming. It is used to restrict access to methods and variables.\
    \ In encapsulation, code and data are wrapped together within a single unit from\
    \ being modified by accident. Data Abstraction Data abstraction and encapsulation\
    \ both are often used as synonyms. Both are nearly synonym because data abstraction\
    \ is achieved through encapsulation. Abstraction is used to hide internal details\
    \ and show only functionalities. Abstracting something means to give names to\
    \ things so that the name captures the core of what a function or a whole program\
    \ does. \n\nInterview Questions and Answers A list of frequently asked Python\
    \ interview questions with answers for freshers and experienced are given below\
    \ 1) What is Python? Python is a general-purpose computer programming language.\
    \ It is a high-level, object-oriented language which can run equally on different\
    \ platforms such as Windows, Linux, UNIX, and Macintosh. It is widely used in\
    \ data science, machine learning and artificial intelligence domain. It is easy\
    \ to learn and require less code to develop the applications. 2\\. What are the\
    \ applications of Python? Python is used in various software domains some application\
    \ areas are given below. \n\n*   Web and Internet Development\n\n*   Games\n\n\
    *   Scientific and computational applications\n\n*   Language development\n\n\
    *   Image processing and graphic design applications\n\n*   Enterprise and business\
    \ applications development\n\n*   Operating systems\n\n*   GUI based desktop applications\n\
    \nPython provides various web frameworks to develop web applications. The popular\
    \ python web frameworks are Django, Pyramid, Flask. Python's standard library\
    \ supports for E-mail processing, FTP, IMAP, and other Internet protocols. Python's\
    \ SciPy and NumPy helps in scientific and computational application development.\
    \ Python's Tkinter library supports to create a desktop based GUI applications.\
    \ 3\\. What are the advantages of Python? \n\n*   Interpreted\n\n*   Free and\
    \ open source\n\n*   Extensible\n\n*   Object-oriented\n\n*   Built-in data structure\n\
    \n*   Readability\n\n*   High-Level Language\n\n*   Cross-platform  \n\n    Interpreted:\
    \ Python is an interpreted language. It does not require prior compilation of\
    \ code and executes instructions directly.\n\n*   Free and open source: It is\
    \ an open source project which is publicly available to reuse. It can be downloaded\
    \ free of cost.\n\n*   Portable: Python programs can run on cross platforms without\
    \ affecting its performance.\n\n*   Extensible: It is very flexible and extensible\
    \ with any module.\n\n*   Object-oriented: Python allows to implement the Object\
    \ Oriented concepts to build application solution.\n\n*   Built-in data structure:\
    \ Tuple, List, and Dictionary are useful integrated data structures provided by\
    \ the language.\n\n4\\. What is PEP 8? PEP 8 is a coding convention which specifies\
    \ a set of guidelines, about how to write Python code more readable. It's a set\
    \ of rules to guide how to format your Python code to maximize its readability.\
    \ Writing code to a specification helps to make significant code bases, with lots\
    \ of writers, more uniform and predictable, too. 5\\. What do you mean by Python\
    \ literals? Literals can be defined as a data which is given in a variable or\
    \ constant. Python supports the following literals: String Literals String literals\
    \ are formed by enclosing text in the single or double quotes. For example, string\
    \ literals are string values. E.g.: \"Aman\", '12345'. Numeric Literals Python\
    \ supports three types of numeric literals integer, float and complex. See the\
    \ examples. \\# Integer litera l    a = 1 0    #Float Litera l    b = 12. 3    \
    \ #Complex Literal      x = 3.14 j    Boolean Literals Boolean literals are used\
    \ to denote boolean values. It contains either True or False. \\# Boolean litera\
    \ l    isboolean = Tru e    6\\. Explain Python Functions? A function is a section\
    \ of the program or a block of code that is written once and can be executed whenever\
    \ required in the program. A function is a block of self-contained statements\
    \ which has a valid name, parameters list, and body. Functions make programming\
    \ more functional and modular to perform modular tasks. Python provides several\
    \ built-in functions to complete tasks and also allows a user to create new functions\
    \ as well. There are two types of functions: \n\n*   Built-In Functions: copy(),\
    \ len(), count() are the some built-in functions.\n\n*   User-defined Functions:\
    \ Functions which are defined by a user known as user-defined functions.\n\nExample:\
    \ A general syntax of user defined function is given below. de f function\\_name(parameters\
    \ list):   #--- statements-- \\-    retur n a\\_value 7\\. Which are the file\
    \ related libraries/modules in Python? Python provides libraries/modules including\
    \ functions that facilitate us to manipulate text files and binary files on the\
    \ file system. By using these libraries, we can create files, update their contents,\
    \ copy, and delete files. These libraries are os, os.path, and the shutil. os\
    \ and os.path: os and os.path libraries include functions for accessing the filesystem.\
    \ shutil: This library is used to copy and delete the files. 8\\. What are the\
    \ different file processing modes supported by Python? Python provides three modes\
    \ to open files. The read-only, write-only, read-write and append mode. 'r' is\
    \ used to open a file in read-only mode, 'w' is used to open a file in write-only\
    \ mode, 'rw' is used to open in reading and write mode, 'a' is used to open a\
    \ file in append mode. If the mode is not specified, by default file opens in\
    \ read-only mode. \n\n*   Read-only mode : Open a file for reading. It is the\
    \ default mode.\n\n*   Write-only mode: Open a file for writing. If the file contains\
    \ data, data would be lost. Other a new file is created.\n\n*   Read-Write mode:\
    \ Open a file for reading, write mode. It means updating mode.\n\n*   Append mode:\
    \ Open for writing, append to the end of the file, if the file exists."
