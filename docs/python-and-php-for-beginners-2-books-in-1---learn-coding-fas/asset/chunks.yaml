    \ statement can be any valid logical expression which can be either evaluated\
    \ to true or false.\n\n![if else 1.jpg](rsrc124.jpg)\n\nThe syntax of the `if`-statement\
    \ is given below.\n```python\nif expression:\n    statement\n```\n\n### Example\
    \ 1\n```python\nnum = int(input(\"enter the number? \"))\nif num % 2 == 0:\n \
    \   print(\"Number is even \")\n```\nOutput: enter the number?10 Number is even\n\
    \n### Example 2: Program to print the largest of the three numbers.\n```python\n\
    a = int(input(\"Enter a? \"))\nb = int(input(\"Enter b? \"))\nc = int(input(\"\
    Enter c? \"))\nif a > b and a > c:\n    print(\"a is largest \")\nif b > a and\
    \ b > c:\n    print(\"b is largest \")\nif c > a and c > b:\n    print(\"c is\
    \ largest \")\n```\nOutput: Enter a? 100 Enter b? 120 Enter c? 130 c is largest\
    \ \n\n## The if-else statement\nThe `if-else` statement provides an `else` block\
    \ combined with the `if` statement which is executed in the false case of the\
    \ condition. If the condition is true, then the `if-block` is executed. Otherwise,\
    \ the `else-block` is executed.\n\n![if else 2.jpg](rsrc136.jpg)\n\nThe syntax\
    \ of the `if-else` statement is given below.\n```python\nif condition:\n    #block\
    \ of statements\nelse:\n    #another block of statements (else-block)\n```\n\n\
    ### Example 1 : Program to check whether a person is eligible to vote or not.\n\
    ```python\nage = int(input(\"Enter your age? \"))\nif age >= 18:\n    print(\"\
    You are eligible to vote !! \")\nelse:\n    print(\"Sorry! you have to wait !!\
    \ \")\n```\nOutput: Enter your age? 90 You are eligible to vote !!\n\n### Example\
    \ 2: Program to check whether a number is even or not.\n```python\nnum = int(input(\"\
    enter the number? \"))\nif num % 2 == 0:\n    print(\"Number is even... \")\n\
    else:\n    print(\"Number is odd... \")\n```\nOutput: enter the number?10 Number\
    \ is even\n\n## The elif statement\nThe `elif` statement enables us to check multiple\
    \ conditions and execute the specific block of statements depending upon the true\
    \ condition among them. We can have any number of `elif` statements in our program\
    \ depending upon our need. However, using `elif` is optional. The `elif` statement\
    \ works like an `if-else-if` ladder statement in C. It must be succeeded by an\
    \ `if` statement. The syntax of the `elif` statement is given below.\n```python\n\
    if expression 1:\n    # block of statements\nelif expression 2:\n    # block of\
    \ statements\nelif expression 3:\n    # block of statements\nelse:\n    # block\
    \ of statements\n```\n![if else 3.jpg](rsrc14E.jpg)\n\n### Example 1\n```python\n\
    number = int(input(\"Enter the number? \"))\nif number <= 10:\n    print(\"number\
    \ is equals to 10 \")\nelif number <= 50:\n    print(\"number is equal to 50 \"\
    )\nelif number <= 100:\n    print(\"number is equal to 100 \")\nelse:\n    print(\"\
    number is not equal to 10, 50 or 100 \")\n```\nOutput: Enter the number?15 number\
    \ is not equal to 10, 50 or 100\n\n# CHAPTER 8 Python Loops\n\nThe flow of the\
    \ programs written in any programming language is sequential by default. Sometimes\
    \ we may need to alter the flow of the program. The execution of a specific code\
    \ may need to be repeated several of times. For this purpose, The programming\
    \ languages provide various types of loops which are capable of repeating some\
    \ specific code several numbers of times. Consider the following diagram to understand\
    \ the working of a loop statement.\n\n![loops 1.jpg](rsrc158.jpg)\n\n## Why we\
    \ use loops in python?\nThe looping simplifies the complex problems into the easy\
    \ ones. It enables us to alter the flow of the program so that instead of writing\
    \ the same code again and again, we can repeat the same code for a finite number\
    \ of times. For example, if we need to print the first 10 natural numbers then,\
    \ instead of using the print statement 10 times, we can print inside a loop which\
    \ runs up to 10 iterations.\n\n## Advantages of loops\nThere are the following\
    \ advantages of loops in Python.\n\n1. It provides code re-usability.\n2. Using\
    \ loops, we do not need to write the same code again and again.\n3. Using loops,\
    \ we can traverse over the elements of data structures (array or linked lists).\n"
