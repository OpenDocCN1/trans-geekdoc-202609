- fmt: "\n# CHAPTER 6 Python Functions\n\nFunctions are the most important aspect\
    \ of an application. A function can be defined as the organized block of reusable\
    \ code which can be called whenever required. Python allows us to divide a large\
    \ program into the basic building blocks known as function. The function contains\
    \ the set of programming statements enclosed by `{}`. A function can be called\
    \ multiple times to provide reusability and modularity to the python program.\
    \ In other words, we can say that the collection of functions creates a program.\
    \ The function is also known as procedure or subroutine in other programming languages.\
    \ Python provide us various inbuilt functions like `range()` or `print()`. Although,\
    \ the user can create its functions which can be called user-defined functions.\n\
    \n## Advantage of functions in python\n\nThere are the following advantages of\
    \ C functions:\n\n- By using functions, we can avoid rewriting same logic/code\
    \ again and again in a program.\n- We can call python functions any number of\
    \ times in a program and from any place in a program.\n- We can track a large\
    \ python program easily when it is divided into multiple functions.\n- Reusability\
    \ is the main achievement of python functions.\n- However, Function calling is\
    \ always overhead in a python program.\n\n## Creating a function\n\nIn python,\
    \ we can use `def` keyword to define the function. The syntax to define a function\
    \ in python is given below.\n\n```python\ndef my_function():\n    function-suite\n\
    \    return <expression>\n```\n\nThe function block is started with the colon\
    \ (`:`) and all the same level block statements remain at the same indentation.\
    \ A function can accept any number of parameters that must be the same in the\
    \ definition and function calling.\n\n## Function calling\n\nIn python, a function\
    \ must be defined before the function calling otherwise the python interpreter\
    \ gives an error. Once the function is defined, we can call it from another function\
    \ or the python prompt. To call the function, use the function name followed by\
    \ the parentheses. A simple function that prints the message \"Hello Word\" is\
    \ given below.\n\n```python\ndef hello_world():\n    print(\"hello world \")\n\
    \nhello_world()\n```\nOutput: hello world\n\n## Parameters in function\n\nThe\
    \ information into the functions can be passed as the parameters. The parameters\
    \ are specified in the parentheses. We can give any number of parameters, but\
    \ we have to separate them with a comma. Consider the following example which\
    \ contains a function that accepts a string as the parameter and prints it.\n\n\
    ### Example 1\n# defining the function\n```python\ndef func(name):\n    print(\"\
    Hi \",name);\n\n# calling the function\nfunc(\"Ayush \")\n```\n\n### Example 2\n\
    # python function to calculate the sum of two variables\n```python\n# defining\
    \ the function\ndef sum(a,b):\n    return a+b\n\n# taking values from the user\n\
    a = int(input(\"Enter a: \"))\nb = int(input(\"Enter b: \"))\n# printing the sum\
    \ of a and b\nprint(\"Sum = \",sum(a,b))\n```\nOutput: Enter a: 10 Enter b: 20\
    \ Sum = 30\n\n## Call by reference in Python\n\nIn python, all the functions are\
    \ called by reference, `i.e., all the changes made to the reference inside the\
    \ function revert back to the original value referred by the reference. However,\
    \ there is an exception in the case of mutable objects since the changes made\
    \ to the mutable objects like string do not revert to the original string rather,\
    \ a new string object is made, and therefore the two different objects are printed.\n\
    \n### Example 1 Passing Immutable Object (List)\n# defining the function\n```python\n\
    def change_list(list1):\n    list1.append(20);\n    list1.append(30);\n    print(\"\
    list inside function = \",list1)\n\n# defining the list\nlist1 = [10, 30, 40,\
    \ 50]\n\n# calling the function\nchange_list(list1)\nprint(\"list outside function\
    \ = \",list1)\n```\nOutput: list inside function = [10, 30, 40, 50, 20, 30] list\
    \ outside function = [10, 30, 40, 50, 20, 30]\n\n### Example 2 Passing Mutable\
    \ Object (String)\n# defining the function\n```python\ndef change_string(str):\n\
    \    str = str + \" Hows you \"\n    print(\"printing the string inside function\
    \ : \",str)\n\nstring1 = \"Hi I am there \"\n# calling the function\nchange_string(string1)\n\
    print(\"printing the string outside function : \",string1)\n```\nOutput: printing\
    \ the string inside function : Hi I am there Hows you printing the string outside\
    \ function : Hi I am there\n\n## Types of arguments\n\nThere may be several types\
    \ of arguments which can be passed at the time of function calling:\n\n1. Required\
    \ arguments\n2. Keyword arguments\n3. Default arguments\n4. Variable-length arguments\n"
