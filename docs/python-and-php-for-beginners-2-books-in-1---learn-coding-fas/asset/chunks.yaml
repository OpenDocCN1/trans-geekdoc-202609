  trans: "\n\n### 3) 此部分包含实用的工具，如 `Netsat`、Windows 服务快捷方式等。\n\n### 4) 此部分显示模块的状态信息。控制面板可用于：\n\
    * 安装和卸载通过 `XAMPP` 安装的服务，如 `Apache`、`MySQL` 等\n* 启动和停止服务。\n* 打开配置文件等。\n\n### 配置\
    \ XAMPP\n现在让我们来看看开始使用 `XAMPP` 安装程序开发 PHP 驱动网站之前需要的基础配置。在您喜爱的浏览器中输入 URL `http://localhost/xampp/`。最好的\
    \ PHP IDE 是什么？PHP IDE 是一个允许您轻松编写 PHP 代码的程序。PHP IDE 通常配有语法高亮功能，在某些情况下还具有自动补全功能。这意味着如果你写了一个\
    \ PHP 解释器识别的 PHP 关键字，该关键字将显示为与普通语句不同的颜色。自动补全功能会在你输入时自动弹出已知的 PHP 关键字。\n\n`Notepad`\
    \ 也可以用于编写和编辑 PHP 代码。使用如 `Notepad` 这样的编辑器的缺点是调试脚本变得困难，因为很难发现诸如关键字拼写错误、未闭合括号等错误，而\
    \ IDE 会高亮带有错误的语句，让你易于发现它们。下表显示了 5 种流行的 PHP 编辑器\n\n| 编辑器 | 许可证 | 跨平台 | 简要描述 |\n\
    | --- | --- | --- | --- |\n| Netbeans IDE | 开源 | 是 | ● 专用的 PHP 编码环境，具有关键字和其他已知信息的语法高亮和代码补全。●\
    \ 支持与 PHP MVC 框架集成，例如 `Zend`。● 显示文件更改的代码历史。● 通过插件支持 `SFTP`、`FTP` 和 `SVN`。 |\n\
    | Dreamweaver | 商业 | 是 | ● 支持 `HTML` 和 `PHP`。● 关键字和其他已知信息的语法高亮、代码折叠和补全。● 支持 `SFTP`\
    \ 和 `FTP`。 |\n| Zend studio | 商业 | 是 | ● 与 `Zend Server`、`Zend PHP`框架、`PHPUnit`、`phpDocumentor`\
    \ 等集成。● 具有语法高亮、代码折叠。● 支持 Web 服务等。 |\n| PHP Eclipse | 开源 | 是 | ● 代码格式化。● 支持 `SVN`、`SSH/FTP`\
    \ |\n| Notepad ++ | 免费软件 | 仅 Windows | ● 语法高亮。● 通过插件支持 `SFTP` 和 `FTP`。 |\n\n###\
    \ Netbeans IDE PHP 编辑器\n如上表简述，`Netbeans IDE` 具有增强 PHP 代码人员效率的强大功能。可以从 `http://netbeans.org/downloads/index.html`\
    \ 免费下载该 IDE。\n* 语法高亮和自动补全功能提高了您的工作效率\n* 它对 `MySQL` 等数据库系统有原生支持。你不需要使用两个程序来编写和开发数据库。\n\
    * IDE 可以在协作环境中使用。当你需要与其他开发者以团队形式工作时，这非常有用。\n* IDE 支持其他语言，如：\n    * `Java SE`\n\
    \    * `Java EE`\n    * `C`\n    * `C++`\n\n### Netbeans IDE 简介\n在成功安装 `Netbeans\
    \ IDE` PHP 编辑器后，像运行任何其他 Windows 程序一样运行它。\n1. **项目资源管理器 (Project explorer)** –\
    \ 此面板用于显示所有打开的项目。项目以树形视图列出。\n2. **快捷工具栏 (Shortcuts tool bar)** – 此工具栏包含经常执行任务的快捷方式，如创建新项目、打开现有项目、撤销和重做操作等。\n\
    3. **启动页 (Startup page)** – 此页面包含 3 个标签页，即 `Learn & Discover`、`My Netbeans` 和\
    \ `What’s New`。\n    * 第一个标签 `[Learn and Discover]` 向您介绍 `Netbeans IDE` 的功能，展示了一些可以在\
    \ `Netbeans IDE` 中开发的演示和教程。\n    * 第二个标签 `[My Netbeans]` 列出最近打开的项目，允许您安装插件并激活\
    \ IDE 的功能。\n4. **输出窗口 (Output window)** – 用于显示来自 Java 控制台应用程序的输出。它还用于显示日志和调试信息。\n\
    \n`Netbeans PHP editor` 允许与 `Symfony` 和 `Zend` 等 PHP MVC 框架集成。目前我们不选择任何 MVC 框架。点击完成\
    \ (Finish)。\n* 您新创建的项目将显示在项目浏览器中，并为您创建一个 `index.php` 页面。\n* 新创建的页面包含一些 HTML 代码。将其替换为下方所示的代码。\n\
    \n### 运行您的第一个 PHP 示例\n```php\n<?php\necho \"Hello World!\";\n?>\n```\n* 点击工具栏上的运行按钮\n\
    * 您的默认浏览器将打开 URL `http://localhost/phplessons/index.php`。浏览器中将显示输出“Hello World!”。\n\
    \n* `XAMPP` 是 `X-cross platform`（跨平台）、`Apache`、`MySQL`、`PHP` 和 `Perl` 的缩写。\n*\
    \ PHP 编辑器是一个允许您在最短时间内编写 PHP 代码，并允许您在设计时调试语法错误的程序。\n* `Netbeans PHP editor` 是一个跨平台的开源编辑器，可以提高\
    \ PHP 开发人员的效率。\n\n### 第 3 章 PHP 数据类型、变量、常量、运算符\n\n#### 数据类型\n数据类型是根据属性将数据归入不同的类别；\n\
    * 字母数字字符被归类为字符串\n* 整数被归类为整数\n* 带有小数点的数字归类为浮点数\n* 真或假值被归类为布尔（Boolean）\n\nPHP 是一种弱类型语言；它没有显式定义的数据类型。PHP\
    \ 通过分析提供的数据属性来确定数据类型。PHP 隐式支持以下数据类型\n* **整数 (Integer)** – 整数，例如 `-3`、`0`、`69`。整数的最大值取决于平台。在\
    \ 32 位机器上，通常约为 20 亿。64 位机器具有更大的值。使用常量 `PHP_INT_MAX` 来确定最大值。\n\n```php\n<?php\n\
    echo PHP_INT_MAX;\n?>\n```\n\n"
- fmt: "\n`?> Output: 9223372036854775807`\n\n● **Floating point number** – decimal\
    \ numbers e.g. `3.14`. they are also known as double or real numbers. The maximum\
    \ value of a float is platform-dependent. Floating point numbers are larger than\
    \ integers.\n● **Character string** – e.g. `Hello World`\n● **Boolean** – e.g.\
    \ `True` or `false`.\n\n## PHP Variable\nA variable is a name given to a memory\
    \ location that stores data at runtime. The scope of a variable determines its\
    \ visibility. A `Php` global variable is accessible to all the scripts in an application.\
    \ A local variable is only accessible to the script that it was defined in. Think\
    \ of a variable as a glass containing water. You can add water into the glass,\
    \ drink all of it, refill it again etc. The same applies for variables. Variables\
    \ are used to store data and provide stored data when needed. Just like in other\
    \ programming languages, PHP supports variables too. Let’s now look at the rules\
    \ followed when creating variables in PHP.\n\n● All variable names must start\
    \ with the dollar sign e.g. `$` followed by a letter or an underscore.\n![Learn\
    \ about PHP Variable, Operators and Data types](rsrc1UT.jpg)\n● Variable names\
    \ are case sensitive; this means `$my_var` is different from `$MY_VAR`\n![Learn\
    \ about PHP Variable, Operators and Data types](rsrc1V0.jpg)\n● All variables\
    \ names must start with a letter follow other characters e.g. `$my_var1`. `$1my_var`\
    \ is not a legal variable name.\n![Learn about PHP Variable, Operators and Data\
    \ types](rsrc1V6.jpg)\n● Variable names must not contain any spaces, “`$first\
    \ name`” is not a legal name. You can instead use an underscore in place of the\
    \ space e.g. `$first_name`. You can't use characters such as the dollar or minus\
    \ sign to separate variable names.\n![Learn about PHP Variable, Operators and\
    \ Data types](rsrc1VC.jpg)\n\nLet’s now look at how PHP determines the data type\
    \ depending on the attributes of the supplied data.\n\n```php\n<?php  \n$my_var\
    \ = 1;  \necho $my_var;  \n?>\n```\n`?> Output: 1`\n\n### Floating point numbers\n\
    ```php\n<?php  \n$my_var = 3.14;  \necho $my_var;  \n?>\n```\n`?> Output: 3.14`\n\
    \n### Character strings\n```php\n<?php  \n$my_var =\"Hypertext Pre Processor\"\
    ;  \necho $my_var;  \n?>\n```\n`?> Output: Hypertext Pre Processor`\n\n## Use\
    \ of Variables\nVariables help separate data from the program algorithms. The\
    \ same algorithm can be used for different input data values. For example, suppose\
    \ that you are developing a calculator program that adds up two numbers, you can\
    \ create two variables that accept the numbers then you use the variables names\
    \ in the expression that does the addition.\n\n## Variable Type Casting\nPerforming\
    \ arithmetic computations using variables in a language such as C# requires the\
    \ variables to be of the same data type. Type casting is converting a variable\
    \ or value into a desired data type. This is very useful when performing arithmetic\
    \ computations that require variables to be of the same data type. Type casting\
    \ in PHP is done by the interpreter. In other languages such as C#, you have to\
    \ cast the variables. PHP also allows you to cast the data type. This is known\
    \ as explicit casting.\n\n```php\n<?php  \n$a = 1;  \n$b = 1.5;  \n$c = $a + $b;\
    \  \n$c = $a + (int) $b;  \necho $c;  \n?>\n```\n`?> Output: 2`\nAbove Code Output\
    \ 2\n\nThe `var_dump` function is used to determine the data type. The code below\
    \ demonstrates how to use the `var_dump` function.\n\n```php\n<?php  \n$a = 1;\
    \  \nvar_dump($a);  \n$b = 1.5;  \nvar_dump($b);  \n$c = \"I Love PHP\";  \nvar_dump($c);\
    \  \n$d = true;  \nvar_dump($d);  \n?>\n```\n`?> Output: int(1) float(1.5) string(10)\
    \ \"I Love PHP\" bool(true)`\n\n## PHP Constant\nDefine constant- A constant is\
    \ a variable whose value cannot be changed at runtime. Suppose we are developing\
    \ a program that uses the value of `PI` `3.14`, we can use a constant to store\
    \ its value. Let’s now look at an example that defines a constant.\n\n```php\n\
    define('PI',3.14); //creates a constant with a value of 3.14\n```\nOnce you define\
    \ `PI` as `3.14`, writing a code like below will generate an error:\n```php\n\
    PI = 4; //PI has been defined as a constant therefore assigning a value is not\
    \ permissible.\n```\n\n## PHP Operators\n### Arithmetic operators\nArithmetic\
    \ operators are used to perform arithmetic operations on numeric data. The concatenate\
    \ operator works on strings values too. PHP supports the following operators.\n\
    \n| Operator | Name | Description | Example | Output |\n| --- | --- | --- | ---\
    \ | --- |\n| `+` | Addition | Summation of x and y | `1 + 1;` | `2` |\n| `-` |\
    \ Subtraction | Difference between x and y | `1 – 1;` | `0` |\n| `*` | Multiplication\
    \ | Multiplies x and y | `3 * 7;` | `21` |\n| `/` | Division | Quotient of x and\
    \ y | `45 / 5;` | `9` |\n| `%` | Php Modulus | Gives reminder of dividing x and\
    \ y | `10 % 3;` | `1` |\n| `-n` | Negation | Turns n into a negative number |\
    \ `-(-5);` | `5` |\n| `x . y` | Concatenation | Puts together x and y | `\"PHP\"\
    \ . \" ROCKS\";10 . 3;` | `PHP ROCKS103` |\n\n### Assignment Operators\nAssignment\
    \ operators are used to assign values to variables. They can also be used together\
    \ with arithmetic operators.\n\n| Operator | Name | Description | Example | Output\
    \ |\n| --- | --- | --- | --- | --- |\n| `=` | assignment | Assigns the value of\
    \ x | `x = 5;` | `5` |\n| `+=` | addition | Increments the value of x by | `x\
    \ += 1;` | `2` |\n| `-=` | subtraction | Subtracts from the value of x | `x -=\
    \ 2;` | `3` |\n| `*=` | multiplication | Multiplies the value of x by | `x *=\
    \ 3;` | `0` |\n| `/=` | division | Divides the value of x by | `x /= 6;` | `1`\
    \ |\n| `%=` | modulus | The remainder of dividing x by | `x %= 2;` | `1` |\n\n\
    ### Comparison operators\nComparison operators are used to compare values and\
    \ data types.\n\n| Operator | Name | Description | Example | Output |\n| --- |\
    \ --- | --- | --- | --- |\n| `==` | Equal | Compares x and y then returns true\
    \ if they are equal | `1 == \"1\";` | `1` |\n| `===` | identical | Compares both\
    \ values and data types. | `1 === \"1\";` | `0` |\n| `!=`, `<>` | PHP Not equal\
    \ | Compares values of x and y. returns true if the values are not equal | `2\
    \ != 1;` | `1` |\n| `>` | Greater than | Compares values of x and y. returns true\
    \ if x is greater than y | `3 > 1;` | `1` |\n| `<` | Less than | Compares values\
    \ of x and y. returns true if x is less than y | `2 < 1;` | `0` |\n| `>=` | Greater\
    \ or equal | Compares values of x and y. returns true if x is greater than or\
    \ equal to y | `1 >=1` | `1` |\n| `<=` | Less than or equal | Compares values\
    \ of x and y. returns true if x is greater than or equal to y | `8 <= 6` | `0`\
    \ |\n\n### Logical operators\nWhen working with logical operators, any number\
    \ greater than or less than zero (0) evaluates to true. Zero (0) evaluates to\
    \ false.\n\n| Operator | Name | Description | Example | Output |\n| --- | ---\
    \ | --- | --- | --- |\n| `and`, `&&` | And | Returns true if both x and y are\
    \ equal | `1 and 4;True&& False;` | `1` or `0` |\n| `or`, `||` | Or | Returns\
    \ true if either x or y is true | `6 or 9;0 || 0;` | `1` or `0` |\n| `xor` | Exclusive\
    \ or | Returns true if only x is true or only y is true | `1 xor 1;1 xor 0;` |\
    \ `0` or `1` |\n| `!` | Not | Returns true if x is false and false if x is true\
    \ | `!0;` | `1` |\n"
