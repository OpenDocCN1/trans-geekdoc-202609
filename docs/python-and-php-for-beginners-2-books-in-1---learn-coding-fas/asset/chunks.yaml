  trans: "\n\n# 第 6 章 Python 函数\n\n函数是应用程序中最重要的部分。函数可以被定义为组织良好的、可重用的代码块，可以在需要时随时调用。Python\
    \ 允许我们将一个大型程序划分为称为函数的基本构建单元。函数包含封装在 `{}` 中的一组组编程语句。函数可以被多次调用，以为 Python 程序提供可重用性和模块化。换句话说，我们可以说函数的集合创建了一个程序。在其他编程语言中，函数也称为过程（procedure）或子程序（subroutine）。Python\
    \ 为我们提供了各种内置函数，如 `range()` 或 `print()`。尽管如此，用户也可以创建自己的函数，这些被称为用户自定义函数。\n\n## Python\
    \ 函数的优势\n\nPython 函数具有以下优点：\n\n-   通过使用函数，我们可以避免在程序中反复编写相同的逻辑/代码。\n-   我们可以在程序的任何地方、以任意的次数调用\
    \ Python 函数。\n-   当一个大型 Python 程序被分为多个函数时，我们可以轻松地追踪它。\n-   可重用性是 Python 函数的主要成就。\n\
    -   然而，函数调用在 Python 程序中始终存在开销。\n\n## 创建函数\n\n在 Python 中，我们可以使用 `def` 关键字来定义函数。Python\
    \ 中定义函数的语法所示：\n\n```python\ndef my_function():\n    function-suite\n    return\
    \ <expression>\n```\n\n函数块以冒号（`:`）开始，所有相同层级的块语句都保持相同的缩进。函数可以接受任意数量的参数，这些参数在定义和函数调用时必须一致。\n\
    \n## 函数调用\n\n在 Python 中，必须在调用函数之前定义函数，否则 Python 解释器会报错。一旦定义了函数，我们就可以从另一个函数或 Python\
    \ 提示符调用它。要调用函数，使用函数名后跟括号。下面是一个打印“Hello Word”消息的简单函数。\n\n```python\ndef hello_world():\n\
    \    print(\"hello world \")\n\nhello_world()\n```\n输出：hello world\n\n## 函数中的参数\n\
    \n信息可以作为参数传递到函数中。参数在括号指定。我们可以给出任意数量的参数，但必须用逗号将其分隔。考虑以下示例，它包含一个接受字符串作为参数并打印它的函数。\n\
    \n### 示例 1\n# 定义函数\n```python\ndef func(name):\n    print(\"Hi \",name);\n\n#\
    \ 调用函数\nfunc(\"Ayush \")\n```\n\n### 示例 2\n# 计算两个变量之的 Python 函数\n```python\n#\
    \ 定义函数\ndef sum(a,b):\n    return a+b\n\n# 从用户获取值\na = int(input(\"Enter a: \"\
    ))\nb = int(input(\"Enter b: \"))\n# 打印 a 和 b 的和\nprint(\"Sum = \",sum(a,b))\n\
    ```\n输出：Enter a: 10 Enter b: 20 Sum = 30\n\n## Python 中的按引用传递\n\n在 Python 中，所有函数都是通过引用调用的，即：函数内部对引用所做的所有更改都会恢复到该引用所指的原始值。然而，在可变对象的情况下有一个例外，因为对字符串等可变对象所做的更改不会恢复到原始字符串，而是会创建一个新的字符串对象，因此会打印两个不同的对象。\n\
    \n### 示例 1 传递不可变对象（列表）\n# 定义函数\n```python\ndef change_list(list1):\n    list1.append(20);\n\
    \    list1.append(30);\n    print(\"list inside function = \",list1)\n\n# 定义列表\n\
    list1 = [10, 30, 40, 50]\n\n# 调用函数\nchange_list(list1)\nprint(\"list outside function\
    \ = \",list1)\n```\n输出：list inside function = [10, 30, 40, 50, 20, 30] list outside\
    \ function = [10, 30, 40, 50, 20, 30]\n\n### 示例 2 传递可变对象（字符串）\n# 定义函数\n```python\n\
    def change_string(str):\n    str = str + \" Hows you \"\n    print(\"printing\
    \ the string inside function : \",str)\n\nstring1 = \"Hi I am there \"\n# 调用函数\n\
    change_string(string1)\nprint(\"printing the string outside function : \",string1)\n\
    ```\n输出：printing the string inside function : Hi I am there Hows you printing\
    \ the string outside function : Hi I am there\n\n## 参数类型\n\n在调用函数时可以传递多种类型的参数：\n\
    \n1. 必需参数 (Required arguments)\n2. 关键字参数 (Keyword arguments)\n3. 默认参数 (Default\
    \ arguments)\n4. 可变长度参数 (Variable-length arguments)\n\n"
- fmt: "\n# Required Arguments\n\nTill now, we have learned about function calling\
    \ in python. However, we can provide the arguments at the time of function calling.\
    \ \n\nAs far as the required arguments are concerned, these are the arguments\
    \ which are required to be passed at the time of function calling with the exact\
    \ match of their positions in the function call and function definition. If either\
    \ of the arguments is not provided in the function call, or the position of the\
    \ arguments is changed, then the python interpreter will show the error. Consider\
    \ the following example.\n\n### Example 1\nthe argument name is the required argument\
    \ to the function `func`.\n```python\ndef func(name):\n    message = \"Hi \" +name\n\
    \    return message\nname = input(\"Enter the name? \")\nprint(func(name))\n```\n\
    Output: `Enter the name?John Hi John`\n\n### Example 2\nthe function `simple_interest`\
    \ accepts three arguments and returns the simple interest accordingly.\n```python\n\
    def simple_interest(p,t,r):\n    return (p*t*r)/ 100\np = float(input(\"Enter\
    \ the principle amount? \"))\nr = float(input(\"Enter the rate of interest? \"\
    ))\nt = float(input(\"Enter the time in years? \"))\nprint(\"Simple Interest:\
    \ \",simple_interest(p,r,t))\n```\nOutput: `Enter the principle amount? 10000\
    \ Enter the rate of interest? 5 Enter the time in years? 2 Simple Interest: 1000.0`\n\
    \n### Example 3\nthe function `calculate` returns the sum of two arguments `a`\
    \ and `b`.\n```python\ndef calculate(a,b):\n    return a+b\ncalculate(10) # this\
    \ causes an error as we are missing a required arguments b .\n```\nOutput: `TypeError:\
    \ calculate() missing 1 required positional argument: 'b'`\n\n# Keyword arguments\n\
    \nPython allows us to call the function with the keyword arguments. This kind\
    \ of function call will enable us to pass the arguments in the random order. The\
    \ name of the arguments is treated as the keywords and matched in the function\
    \ calling and definition. If the same match is found, the values of the arguments\
    \ are copied in the function definition. Consider the following example.\n\n###\
    \ Example 1\nfunction `func` is called with the `name` and `message` as the keyword\
    \ arguments.\n```python\ndef func(name,message):\n    print(\"printing the message\
    \ with \",name,,\"and \",message)\nfunc(name = \"John \",message=\"hello \") #name\
    \ and message is copied with the values John and hello respectively\n```\nOutput:\
    \ `printing the message with John and hello`\n\n### Example 2\nproviding the values\
    \ in different order at the calling.\nThe function `simple_interest(p, t, r)`\
    \ is called with the keyword arguments; the order of arguments doesn't matter\
    \ in this case.\n```python\ndef simple_interest(p,t,r):\n    return (p*t*r)/ 100\n\
    print(\"Simple Interest: \",simple_interest(t=10,r=10,p=1900))\n```\nOutput: `Simple\
    \ Interest: 1900.0`\n\nIf we provide the different name of arguments at the time\
    \ of function call, an error will be thrown. Consider the following example.\n\
    \n### Example 3\nThe function `simple_interest(p, t, r)` is called with the keyword\
    \ arguments.\n```python\ndef simple_interest(p,t,r):\n    return (p*t*r)/ 100\n\
    print(\"Simple Interest: \",simple_interest(time=10,rate=10,principle=1900)) #\
    \ doesn?t find the exact match of the name of the arguments (keywords )\n```\n\
    Output: `TypeError: simple_interest() got an unexpected keyword argument 'time'`\n\
    \nThe python allows us to provide the mix of the required arguments and keyword\
    \ arguments at the time of function call. However, the required argument must\
    \ not be given after the keyword argument, i.e., once the keyword argument is\
    \ encountered in the function call, the following arguments must also be the keyword\
    \ arguments. Consider the following example.\n\n### Example 4\n```python\ndef\
    \ func(name1,message,name2):\n    print(\"printing the message with \",name1,\"\
    , \",message,\",and \",name2)\nfunc(\"John \",message=\"hello \",name2=\"David\
    \ \") #the first argument is not the keyword argument\n```\nOutput: `printing\
    \ the message with John , hello ,and David`\n\nThe following example will cause\
    \ an error due to an in-proper mix of keyword and required arguments being passed\
    \ in the function call.\n\n### Example 5\n```python\ndef func(name1,message,name2):\n\
    \    print(\"printing the message with \",name1,\", \",message,\",and \",name2)\n\
    func(\"John \",message=\"hello \", \"David \")\n```\nOutput: `SyntaxError: positional\
    \ argument follows keyword argument`\n\n# Default Arguments\n\nPython allows us\
    \ to initialize the arguments at the function definition. If the value of any\
    \ of the argument is not provided at the time of function call, then that argument\
    \ can be initialized with the value given in the definition.\n\n### Example 1\n\
    ```python\ndef printme(name,age=2):\n    print(\"My name is \",name,\"and age\
    \ \",age)\nprintme(name=\"john \")\n```\nOutput: `My name is john and age 2`\n\
    \n### Example 2\n```python\ndef printme(name,age=2):\n    print(\"My name is \"\
    ,name,\"and age \",age)\nprintme(name=\"David \") # variable age is not passed\
    \ into the function however the default value is considered\n```\nOutput: `My\
    \ name is David and age 2`\n\n# Variable length Arguments\n\nIn the large projects,\
    \ we may not know the number of arguments to be passed in advance. In such cases,\
    \ Python provides us the flexibility to provide the comma separated values which\
    \ are internally treated as tuples at the function call. However, at the function\
    \ definition, we have to define the variable with `*<name>`. Consider the following\
    \ example.\n\n```python\ndef printme(*names):\n    print(\"type of passed argument\
    \ is \",type(names))\n    print(\"printing the arguments...\")\n    for name in\
    \ names:\n        print(name)\nprintme(\"john \", \"David \", \"smith \", \"nick\
    \ \")\n```\nOutput:\n`type of passed argument is <class 'tuple'>`\n`printing the\
    \ arguments...`\n`john `\n`David `\n`smith `\n`nick `\n\n# Scope of variables\n\
    \nThe scopes of the variables depend upon the location where the variable is declared.\
    \ The variable declared in one part of the program may not be accessible to the\
    \ other parts. In python, the variables are defined with the two types of scopes.\n\
    \n### Global variables\nThe variable defined outside any function is known to\
    \ have a global scope whereas the variable defined inside a function is known\
    \ to have a local scope. Consider the following example.\n\n### Example 1\n```python\n\
    def print_message():\n    message = \"hello !! I am going to print a message.\"\
    \ # the variable message is local to the function itself\n    print(message)\n\
    print_message()\nprint(message) # this will cause an error since a local variable\
    \ cannot be accessible here.\n```\nOutput:\n`hello !! I am going to print a message.`\n\
    `File \"/root/PycharmProjects/PythonTest/Test1.py\", line 5, in print(message)`\n\
    `NameError: name 'message' is not defined`\n\n### Local variables\n```python\n\
    def calculate(*args):\n    sum = 0\n    for arg in args:\n        sum = sum +\
    \ arg\n    print(\"The sum is \",sum)\nsum = 0\ncalculate(10, 20, 30) #60 will\
    \ be printed as the sum\nprint(\"Value of sum outside the function: \",sum) #\
    \ 0 will be printed\n```\nOutput:\n`The sum is 60`\n`Value of sum outside the\
    \ function: 0`\n"
