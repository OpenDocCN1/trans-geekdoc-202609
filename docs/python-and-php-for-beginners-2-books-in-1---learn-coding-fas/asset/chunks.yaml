- fmt: "\n# CHAPTER 8 MySQL for Beginners\n\nMySQL is the most popular open-source\
    \ database. This course starts with database basics, normalization and `MySQL\
    \ Workbench` installation. Later it teaches MySQL commands like `Select`, `Insert`,\
    \ `Group By` and advance topics like `Wildcards` & `Functions`.\n\n## Database\
    \ and SQL\n\n### What is Data?\nIn simple words data can be facts related to any\
    \ object in consideration. For example your name, age, height, weight, etc are\
    \ some data related to you. A picture , `image`, `file` , `pdf` etc can also be\
    \ considered data.\n\n### What is a Database?\nDatabase is a systematic collection\
    \ of data. Databases support storage and manipulation of data. Databases make\
    \ data management easy. Let's discuss few examples.\n* An online telephone directory\
    \ would definitely use database to store data pertaining to people, phone numbers,\
    \ other contact details, etc.\n* Your electricity service provider is obviously\
    \ using a database to manage billing , client related issues, to handle fault\
    \ data, etc.\n* Let's also consider the `facebook`. It needs to store, manipulate\
    \ and present data related to members, their friends, member activities, messages,\
    \ advertisements and lot more.\n\n### What is a Database Management System (DBMS)?\n\
    Database Management System (DBMS) is a collection of programs which enables its\
    \ users to access database, manipulate data, reporting / representation of data\
    \ . It also helps to control access to the database. Database Management Systems\
    \ are not a new concept and as such had been first implemented in 1960s. Charles\
    \ Bachmen's Integrated Data Store (`IDS`) is said to be the first DBMS in history.\
    \ With time database technologies evolved a lot while usage and expected functionalities\
    \ of databases have been increased immensely.\n\n### Types of DBMS\nLet's see\
    \ how the DBMS family got evolved with the time. Following diagram shows the evolution\
    \ of DBMS categories.\n\n* **Hierarchical** - this type of DBMS employs the \"\
    parent-child\" relationship of storing data. This type of DBMS is rarely used\
    \ nowadays. Its structure is like a tree with nodes representing records and branches\
    \ representing fields. The `windows registry` used in `Windows XP` is an example\
    \ of a hierarchical database. Configuration settings are stored as tree structures\
    \ with nodes.\n* **Network DBMS** - this type of DBMS supports many-to many relations.\
    \ This usually results in complex database structures. `RDM Server` is an example\
    \ of a database management system that implements the network model.\n* **Relational\
    \ DBMS** - this type of DBMS defines database relationships in form of tables,\
    \ also known as relations. Unlike network DBMS, `RDBMS` does not support many\
    \ to many relationships. Relational DBMS usually have pre-defined data types that\
    \ they can support. This is the most popular DBMS type in the market. Examples\
    \ of relational database management systems include `MySQL`, `Oracle`, and `Microsoft\
    \ SQL Server` database.\n* **Object Oriented Relation DBMS** - this type supports\
    \ storage of new data types. The data to be stored is in form of objects. The\
    \ objects to be stored in the database have attributes (i.e. `gender`, `ager`)\
    \ and methods that define what to do with the data. `PostgreSQL` is an example\
    \ of an object oriented relational DBMS.\n\n### What is SQL?\n* Structured Query\
    \ language (`SQL`) pronounced as \"S-Q-L\" or sometimes as \"See-Quel\" is actually\
    \ the standard language for dealing with Relational Databases.\n* `SQL` programming\
    \ can be effectively used to insert, search, update, delete database records.\n\
    * That doesn't mean `SQL` cannot do things beyond that.\n* In fact it can do lot\
    \ of things including, but not limited to, optimizing and maintenance of databases.\n\
    * Relational databases like `MySQL Database`, `Oracle`, `Ms SQL server`, `Sybase`,\
    \ etc uses `SQL` !\n* `SQL` syntaxes used in these databases are almost similar,\
    \ except the fact that some are using few different syntaxes and even proprietary\
    \ `SQL` syntaxes.\n\n#### SQL Example\n```\nSELECT * FROM Members WHERE Age >\
    \ 30\n```\n\n### Why use MySQL?\nThere are a number of relational database management\
    \ systems on the market. Examples of relational databases include `Microsoft SQL\
    \ Server`, `Microsoft Access`, `Oracle`, `DB2` etc. One may ask why we would choose\
    \ `MySQL` over the other database management systems.\n\n#### MySQL workbench\
    \ - SQL development tool\nStructured Query Language (`SQL`) allows us to manipulate\
    \ our relational databases. `SQL` is at the heart of all relational databases.\n\
    * `MySQLworkbench`, has built in `SQL` visual editor.\n* The `Visual SQL` editor\
    \ allows developers to build, edit and run queries against `MySQL server` databases.\
    \ It has utilities for viewing data and exporting it.\n* Its syntax color highlighters\
    \ help developers easily write and debug `SQL` statements.\n* Multiple queries\
    \ can be run and results automatically displayed in different tabs.\n* The queries\
    \ are also saved in the history panel for later retrieval and running.\n\n####\
    \ MySQL workbench - Administration tool\nServer administration plays a critical\
    \ role in securing the data of the company. The major issues concerning server\
    \ administration are users' management, server configuration, server logs and\
    \ many more. `Workbench MySQL` has the following features that simplify the process\
    \ of `MySQL server` administration;\n* **User administration** - visual utility\
    \ for managing users that lets database administrators easily add new and remove\
    \ existing users if need arises, grant and drop privileges and view user profiles.\n\
    * **Server configuration** - allows for advanced configuration of the server and\
    \ fine tuning for optimal performance.\n* **Database backup and restorations**\
    \ - visual tool for exporting/importing `MySQL dump` files. `MySQL dump` files\
    \ contain SQL scripts for creating databases, tables, views, stored procedures\
    \ and insertion of data.\n* **Server logs** - visual tool for viewing `MySQL server\
    \ logs`. The logs include `error logs`, `binary logs` and `InnodDB logs`. These\
    \ logs come in handy when performing diagnosis on the server. The figure shown\
    \ below shows the modeling window for `MySQL Workbench` .\n\n# CHAPTER 9 Database\
    \ Design\n\nDatabase Design is a collection of processes that facilitate the designing,\
    \ development, implementation and maintenance of enterprise data management systems\
    \ It helps produce  database systems \n\n1. That meet the requirements of the\
    \ users\n2. Have high performance.\n"
