- fmt: "\nThe main objectives of database designing are to produce logical and physical\
    \ designs models of the proposed database system. The logical model concentrates\
    \ on the data requirements and the data to be stored independent of physical considerations.\
    \ It does not concern itself with how the data will be stored or where it will\
    \ be stored physically. The physical data design model involves translating the\
    \ logical design of the database onto physical media using hardware resources\
    \ and software systems such as database management systems (`DBMS`).\n\n## Why\
    \ Database Design is Important?\n\nDatabase designing is crucial to high performance\
    \ database system. Apart from improving the performance, properly designed database\
    \ are easy to maintain, improve data consistency and are cost effective in terms\
    \ of disk storage space. Note, the genius of a database is in its design. Data\
    \ operations using `SQL` is relatively simple.\n\n## Database Designing Stages\
    \ \n\n- **Logical model**: This stage is concerned with developing a database\
    \ model based on requirements. The entire design is on paper without any physical\
    \ implementations or specific `DBMS` considerations.\n- **Physical model**: This\
    \ stage implements the logical model of the database taking into account the `DBMS`\
    \ and physical implementation factors.\n\n## Implementation\n\n- **Data conversion\
    \ and loading**: this stage is concerned with importing and converting data from\
    \ the old system into the new database.\n- **Testing**: this stage is concerned\
    \ with the identification of errors in the newly implemented system. It checks\
    \ the database against requirement specifications.\n\n## Two Types of Database\
    \ Techniques\n\n1. Normalization\n2. ER Modeling\n\n## MySQL Create Database,\
    \ Tables, Data Types\n\n### Steps for Create Database\n\nMySQL Create Database\
    \ in two ways:\n1) By executing a simple `SQL` query\n2) By using forward engineering\
    \ in `MySQL Workbench`\n\n`CREATE DATABASE` is the `SQL` command for creating\
    \ a database. Imagine you need to create a database with name \"movies\". You\
    \ can do it by executing following `SQL` command.\n\n```sql\nCREATE DATABASE movies;\n\
    ```\n\nNote: you can also use the command `CREATE SCHEMA` instead of `CREATE DATABASE`.\
    \ Now let's improve our `SQL` query adding more parameters and specifications.\
    \ IF NOT EXISTS\n\nA single `MySQL` server could have multiple databases. If you\
    \ are not the only one accessing the same `MySQL` server or if you have to deal\
    \ with multiple databases there is a probability of attempting to create a new\
    \ database with name of an existing database. `IF NOT EXISTS` let you instruct\
    \ `MySQL` server to check the existence of a database with a similar name prior\
    \ to creating database. When `IF NOT EXISTS` is used database is created only\
    \ if given name does not conflict with an existing database name. Without the\
    \ use of `IF NOT EXISTS` `MySQL` throws an error.\n\n```sql\nCREATE DATABASE IF\
    \ NOT EXISTS movies;\n```\n\n### Creating Tables\n\nMySQL Tables can be created\
    \ using `CREATE TABLE` statement and it actually has the following syntax.\n\n\
    ```sql\nCREATE TABLE [IF NOT EXISTS] `TableName` (`fieldname` dataType [optional\
    \ parameters]) ENGINE = storage Engine;\n```\n\n- `\"CREATE TABLE\"` is the one\
    \ responsible for the creation of the table in the database.\n- `\"\"[IF NOT EXISTS]\"\
    ` is optional and only create the table if no matching table name is found.\n\
    - \"`fieldName`\"` is the name of the field and `\"data Type\"` defines the nature\
    \ of the data to be stored in the field.\n- `\"[optional parameters]\"` additional\
    \ information about a field such as `AUTO_INCREMENT`, `NOT NULL` etc.\n\n**Create\
    \ Table Example:**\n\n```sql\nCREATE TABLE IF NOT EXISTS `MyFlixDB`.`Members`\
    \ (\n  `membership_number` INT AUTOINCREMENT,\n  `full_names` VARCHAR(150) NOT\
    \ NULL,\n  `gender` VARCHAR(6),\n  `date_of_birth` DATE,\n  `physical_address`\
    \ VARCHAR(255),\n  `postal_address` VARCHAR(255),\n  `contact_number` VARCHAR(75),\n\
    \  `email` VARCHAR(255),\n  PRIMARY KEY (`membership_number`)\n) ENGINE = InnoDB;\n\
    ```\n\nNow let's see what the `MySQL`s data types are. You can use any of them\
    \ depending on your need. You should always try not to underestimate or overestimate\
    \ potential range of data when creating a database.\n\n## CHAPTER 10 DATA TYPES\n\
    \nData types define the nature of the data that can be stored in a particular\
    \ column of a table. `MySQL` has 3 main categories of data types namely:\n\n1.\
    \ Numeric\n2. Text\n3. Date/time\n"
