  trans: "\n\n# 第 4 章 Python 字典\n\n字典用于在 Python 中实现键值对（key-value pair）。字典是 Python\
    \ 中的数据类型，可以模拟现实生活的数据安排，即某些特定的键对应特定的值。换句话说，我们可以说字典是键值对的集合，其中值可以是任何 Python 对象，而键必须是不可变的\
    \ Python 对象，即数字、字符串或元组。字典在 Python 中模拟了 Java 的 hash-map 功能。\n\n## 创建字典\n\n可以使用多个包含在小括号\
    \ `()` 中并用冒号（:`）分隔的键值对来创建字典。键值对的集合包含在大括号 `{}` 中。定义字典的语法所示：\n\n`Dict = {\"Name\"\
    \ : \"Ayush\" ,\"Age\" : 22}` \n\n在上面的字典 `Dict` 中，键 `Name` 和 `Age` 是字符串，字符串是一种不可变对象。让我们来看一个创建字典并打印其内容的示例。\n\
    \n```python\nEmployee = {\"Name\" : \"John\" , \"Age\" : 29, \"salary\" :25000,\"\
    Company\" :\"GOOGLE\" }\nprint (type(Employee))\nprint (\"printing Employee data\
    \ .... \" )\nprint (Employee)\n```\n\n输出\n`<class 'dict'>`\nprinting Employee\
    \ data .... {'Age': 29, 'salary': 25000, 'Name': 'John', 'Company': 'GOOGLE'}\n\
    \n## 访问字典值\n\n我们已经讨论过如何使用索引来访问列表和元组中的数据。然而，在字典中，可以使用键来访问值，因为键在字典中是唯一的。可以通过以下方式访问字典值。\n\
    \n```python\nEmployee = { \"Name \" : \"John \" , \"Age \" : 2 9 , \"salary \"\
    \ : 2500 0 , \"Company \" : \"GOOGLE \" }\nprint (type(Employee))\nprint ( \"\
    printing Employee data .... \" )\nprint ( \"Name : %s \" %Employee[\"Name \"]])\n\
    print ( \"Age : %d \" %Employee[\"Age \"]])\nprint ( \"Salary : %d \" %Employee[\"\
    salary \"]])\nprint ( \"Company : %s \" %Employee[\"Company \"])\n```\n\n输出：\n\
    `<class 'dict'>`\nprinting Employee data .... Name : John Age : 29 Salary : 25000\
    \ Company : GOOGLE\n\nPython 为我们提供了使用 `get()` 方法访问字典值的替代方案。它将产生与索引访问相同的结果。\n\n\
    ## 更新字典值\n\n字典是一种可变数据类型，可以使用特定的键来更新其值。让我们来看更新字典值的示例。\n\n```python\nEmployee =\
    \ { \"Name \" : \"John \" , \"Age \" : 2 9 , \"salary \" : 2500 0 , \"Company\
    \ \" : \"GOOGLE \" }\nprint (type(Employee))\nprint ( \"printing Employee data\
    \ .... \" )\nprint (Employee)\nprint ( \"Enter the details of the new employee....\
    \ \" );\nEmployee[\"Name \"] = input( \"Name: \" );\nEmployee[\"Age \"] = int(input(\
    \ \"Age: \"));\nEmployee[\"salary \"] = int(input( \"Salary: \"));\nEmployee[\"\
    Company \"] = input( \"Company: \" );\nprint ( \"printing the new data \" );\n\
    print (Employee)\n```\n\n输出：\n`<class 'dict'>`\nprinting Employee data .... {'Name':\
    \ 'John', 'salary': 25000, 'Company': 'GOOGLE', 'Age': 29}\nEnter the details\
    \ of the new employee....\nName: David\nAge: 19\nSalary: 8900\nCompany: JTP\n\
    printing the new data {'Name': 'David', 'salary': 8900, 'Company': 'JTP', 'Age':\
    \ 19}\n\n## 使用 del 关键字删除元素\n\n可以使用下方的 `del` 关键字删除字典的项。\n\n```python\nEmployee\
    \ = { \"Name \" : \"John \" , \"Age \" : 2 9 , \"salary \" : 2500 0 , \"Company\
    \ \" : \"GOOGLE \" }\nprint (type(Employee))\nprint ( \"printing Employee data\
    \ .... \" )\nprint (Employee)\nprint ( \"Deleting some of the employee data \"\
    \ )\ndel Employee[\"Name \"]\ndel Employee[\"Company \"]\nprint ( \"printing the\
    \ modified information \" )\nprint (Employee)\nprint ( \"Deleting the dictionary:\
    \ \" );\ndel Employee\nprint ( \"Lets to print it again \" );\nprint (Employee)\n\
    ```\n\n输出：\n`<class 'dict'>`\nprinting Employee data .... {'Age': 29, 'Company':\
    \ 'GOOGLE', 'Name': 'John', 'salary': 25000}\nDeleting some of the employee data\n\
    modified information {'Age': 29, 'salary': 25000}\nDeleting the dictionary:\n\
    Lets to print it again\nTraceback (most recent call last):\nFile \"list.py\",\
    \ line 13, in <module>\nprint(Employee)\nError: name 'Employee' is not defined\n\
    \n## 迭代字典\n\n可以使用下方的 for 循环对字典进行迭代。\n\n### 示例 1：使用 for 循环打印字典的所有键\n```python\n\
    Employee = { \"Name \" : \"John \" , \"Age \" : 2 9 , \"salary \" : 2500 0 , \"\
    Company \" : \"GOOGLE \" }\nfor x in Employee:\n    print (x);\n```\n输出：\nName\
    \ Company salary Age\n\n### 示例 2：使用 for 循环打印字典的所有值\n```python\nEmployee = { \"\
    Name \" : \"John \" , \"Age \" : 2 9 , \"salary \" : 2500 0 , \"Company \" : \"\
    GOOGLE \" }\nfor x in Employee:\n    print (Employee[x]);\n```\n输出：\n29 GOOGLE\
    \ John 25000\n\n### 示例 3：使用 values() 方法通过 for 循环打印字典的值\n```python\nEmployee =\
    \ { \"Name \" : \"John \" , \"Age \" : 2 9 , \"salary \" : 2500 0 , \"Company\
    \ \" : \"GOOGLE \" }\nfor x in Employee.values():\n    print (x);\n```\n输出：\n\
    GOOGLE 25000 John 29\n\n### 示例 4：使用 items() 方法通过 for 循环打印字典的项\n```python\nEmployee\
    \ = { \"Name \" : \"John \" , \"Age \" : 2 9 , \"salary \" : 2500 0 , \"Company\
    \ \" : \"GOOGLE \" }\nfor x in Employee.items():\n    print (x);\n```\n输出：\n('Name',\
    \ 'John') ('Age', 29) ('salary', 25000) ('Company', 'GOOGLE')\n\n## 字典键的属性\n\n\
    1. 字典不支持同一个键存储多个值。如果为一个键传递了多个值，则最后赋值的值被视为该键的值。请看以下示例。\n```python\nEmployee = {\
    \ \"Name \" : \"John \" , \"Age \" : 2 9 , \"Salary \" : 2500 0 , \"Company \"\
    \ : \"GOOGLE \" , \"Name \" : \"Johnn \" }\nfor x,y in Employee.items():\n   \
    \ print (x,y)\n```\n输出：\nSalary 25000 Company GOOGLE Name Johnn Age 29\n\n2. 在\
    \ Python 中，键不能是可变对象。可以使用数字、字符串或元组作为键，但不能在字典中使用列表等可变对象作为键。请看以下示例。\n```python\n\
    Employee = { \"Name \" : \"John \" , \"Age \" : 2 9 , \"salary \" : 2500 0 , \"\
    Company \" : \"GOOGLE \" , [ 100 , 201 , 301 ]: \"Department ID \" }\nfor x,y\
    \ in Employee.items():\n    print (x,y)\n```\n输出：\nTraceback (most recent call\
    \ last):\nFile \"list.py\", line 2, in Employee\nEmployee = {\"Name\": \"John\"\
    , \"Age\": 29, \"salary\":25000,\"Company\":\"GOOGLE\",[100,201,301]:\"Department\
    \ ID\"}\nTypeError: unhashable type: 'list'\n\n"
