  trans: "\n数据库设计的主要目标是为建议的数据库系统产生逻辑和物理设计模型。逻辑模型侧于数据需求和要存储的数据，且独立于物理考虑。它不涉及数据将如何存储或在物理上存储何处。物理数据设计模型涉及利用硬件资源和软件系统（如数据库管理系统\
    \ `DBMS`）将数据库的逻辑设计转换为物理介质上的设计。\n\n## 为什么数据库设计如此重要？\n\n数据库设计对于高性能数据库系统至关重要。除了提高性能外，设计良好的数据库易于维护、提高数据一致性，并在磁盘存储空间方面具有成本效益。注意，数据库的精之处在于其设计。使用\
    \ `SQL` 进行数据操作相对简单。\n\n## 数据库设计阶段\n\n- **逻辑模型**：此阶段涉及根据需求开发数据库模型。整个设计都在纸面上完成，没有任何物理实现或特定的\
    \ `DBMS` 考虑。\n- **物理模型**：此阶段在考虑 `DBMS` 和物理实现因素的基础上对数据库的逻辑模型进行实现。\n\n## 实现\n\n\
    - **数据转换与加载**：此阶段涉及将数据从旧系统导入并转换到新数据库。\n- **测试**：此阶段涉及识别新实现系统中的错误。它根据需求规范检查数据库。\n\
    \n## 两种类型的数据库技术\n\n1. 规范化\n2. ER 建模\n\n## MySQL 创建数据库、表、数据类型\n\n### 创建数据库的步骤\n\
    \nMySQL 有两种方式创建数据库：\n1) 通过执行简单的 `SQL` 查询\n2) 在 `MySQL Workbench` 中使用正向工程\n\n`CREATE\
    \ DATABASE` 是创建数据库的 `SQL` 命令。假设你需要创建一个名为 \"movies\" 的数据库。你可以通过执行以下 `SQL` 命令来实现。\n\
    \n```sql\nCREATE DATABASE movies;\n```\n\n注意：你也可以使用命令 `CREATE SCHEMA` 代替 `CREATE\
    \ DATABASE`。现在让我们改进我们的 `SQL` 查询，添加更多参数和规范。IF NOT EXISTS\n\n一个 `MySQL` 服务器可以拥有多个数据库。如果你不是唯一访问同一\
    \ `MySQL` 服务器的人，或者你必须处理多个数据库，那么可能会尝试创建一个与现有数据库同名的新数据库。`IF NOT EXISTS` 允许指示 `MySQL`\
    \ 服务器在创建数据库之前检查是否存在名称相似的数据库。当使用 `IF NOT EXISTS` 时，只有在给定的名称与现有数据库名称冲突时才会创建数据库。如果不使用\
    \ `IF NOT EXISTS`，`MySQL` 将抛出错误。\n\n```sql\nCREATE DATABASE IF NOT EXISTS movies;\n\
    ```\n\n### 创建表\n\n可以使用 `CREATE TABLE` 语句创建 MySQL 表，其实际语法如下。\n\n```sql\nCREATE\
    \ TABLE [IF NOT EXISTS] `TableName` (`fieldname` dataType [optional parameters])\
    \ ENGINE = storage Engine;\n```\n\n- `\"CREATE TABLE\"` 负责在数据库中创建表。\n- `\"\"[IF\
    \ NOT EXISTS]\"` 是可选的，只有在未找到匹配的表名时才创建表。\n- \"`fieldName\"` 是字段名，`\"data Type\"\
    ` 定义了存储在字段中的数据性质。\n- `\"[optional parameters]\"` 关于字段的额外信息，例如 `AUTO_INCREMENT`、`NOT\
    \ NULL` 等。\n\n**创建表示例：**\n\n```sql\nCREATE TABLE IF NOT EXISTS `MyFlixDB`.`Members`\
    \ (\n  `membership_number` INT AUTOINCREMENT,\n  `full_names` VARCHAR(150) NOT\
    \ NULL,\n  `gender` VARCHAR(6),\n  `date_of_birth` DATE,\n  `physical_address`\
    \ VARCHAR(255),\n  `postal_address` VARCHAR(255),\n  `contact_number` VARCHAR(75),\n\
    \  `email` VARCHAR(255),\n  PRIMARY KEY (`membership_number`)\n) ENGINE = InnoDB;\n\
    ```\n\n现在让我们看看 `MySQL` 的数据类型有哪些。你可以根据需要使用任何一种。在创建数据库时，你应该尽量避免低估或高估潜在的数据范围。\n\n\
    ## 第 10 章 数据类型\n\n数据类型定义了可以在表的特定列中存储的数据的性质。`MySQL` 有 3 大类数据类型，如下：\n\n1. 数值\n2.\
    \ 文本\n3. 日期/时间\n"
