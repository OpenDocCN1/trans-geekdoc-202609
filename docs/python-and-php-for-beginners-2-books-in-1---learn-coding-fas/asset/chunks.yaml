  trans: "\n\n# 对象\n`object` 是一个具有状态和行为的实体。它可以是任何现实世界的物体，如鼠标、键盘、椅子、桌子、笔等。在 Python\
    \ 中，一切都是对象，几乎每个对象都具有属性和方法。所有函数都有一个内置属性 `__doc__`，它返回在函数源代码中定义的文档字符串（doc string）。\n\
    \n# 类\n`class` 可以被定义为对象的集合。它是一个具有某些特定属性和方法的逻辑实体。例如：如果你有一个 `employee` 类，那么它应该包含一些属性和方法，即电子邮件\
    \ ID、姓名、年龄、工资等。\n\n### 语法\n```python\nclass ClassName:\n    <statement-1>\n  \
    \  ...\n    <statement-N>\n```\n\n# 方法\n`method` 是与对象关联的函数。在 Python 中，`method`\
    \ 并不是类实例所有的。任何对象类型都可以拥有方法。\n\n# 继承\n`Inheritance` 是面向对象编程中最重要的方面，它模拟了现实世界的继承概念。它规定子对象获取父对象的所有属性和行为。通过继承，我们可以创建一个使用另一个类的所有属性和行为的类。新类被称为派生类或子类，而属性被获取的类被称为基类或父类。它提供了代码的可重用。\n\
    \n# 多态\n`Polymorphism` 包含两个词“poly”和“morphs”。Poly 意味着“多”，Morphs 意味着“形式、形状”。通过多态，我们理解任务可以通过不同的方式执行。例如，你有一个\
    \ `animal` 类，所有的动物都会说话。但它们说话的方式不同。在这里，“speak”行为在意义上是多态的，取决于具体的动物。因此，抽象的“animal”概念本身并不会“speak”，但特定的动物（如狗和猫）拥有“speak”这一动作的具体实现。\n\
    \n# 封装\n`Encapsulation` 也是面向对象编程的一个重要方面。它用于限制对方法和变量的访问。在封装中，代码和数据被封装在一个单元内，防止被意外修改。\n\
    \n# 数据抽象\n`Data abstraction`（数据抽象）和封装通常被用作同义词。两者几乎同义，因为数据抽象是通过封装实现的。抽象用于隐藏内部细节并只显示功能。抽象某个事物意味着给事物命名，使该名称捕捉函数或整个程序的功能的核心内容。\n\
    \n# 面试题与答案\n以下列出了针对新手和有经验开发者的常用 Python 面试问题及答案。\n\n### 1) 什么是 Python？\nPython\
    \ 是一种通用计算机编程语言。它是一种高级、面向对象的语言，可以同样运行在 Windows、Linux、UNIX 和 Macintosh 等不同平台上。它广泛用于数据科学、机器学习和人工智能领域。它易于学习，开发应用程序代码较少。\n\
    \n### 2) Python 的应用有哪些？\nPython 用于各种软件领域，以下是一些应用领域：\n*   Web 和互联网开发\n*   游戏\n\
    *   科学和计算应用\n*   语言开发\n*   图像处理和图形设计应用\n*   企业级和业务应用开发\n*   操作系统\n*   基于 GUI 的桌面应用\n\
    \nPython 提供了各种用于开发 Web 应用的框架。流行的 Python Web 框架有 `Django`、`Pyramid`、`Flask`。\n\n\
    ### 3) Python 的优点？\n*   解释型\n*   免费开源\n*   可扩展\n*   面向对象\n*   内置数据结构\n*   可读性高\n\
    *   高级\n*   可移植\n\n### 4) 什么是 PEP 8？\n`PEP8` 是一种编码规范，规定了如何编写代码。\n\n### 5) 字面量（literals）是指什么？\n\
    字面量可以定义为变量或常量。Python 支持以下内容：\n*   **字符串字面量**：字符串字面量通过单引号或双引号包裹文本形成。例如：\"man\"\
    , 'woman'。\n*   **数字字面量**：Python 支持三种类型：整数、浮点和复数。\n*   **布尔字面量**：布尔字面量用于表示布尔值。包含\
    \ `True` 或 `False`。\n\n### 6) 解释 Python 函数？\n`function` 是程序的一个部分或代码块，编写一次并在程序需要时随时执行。函数是一个自包含的块，具有有效的名称、参数列表和函数体。函数使编程更具功能性。函数有两种类型：\n\
    *   **内置函数**：`copy()`、`len()`、`count()`\n*   **自定义函数**：由用户定义的函数。\n\n示例：用户自定义函数的通用语法如下：\n\
    ```python\ndef function_name(parameters list):\n    # statements\n    return value\n\
    ```\n\n### 7) Python 中哪些与文件相关的库/模块？\nPython 提供了许多库/模块，方便我们操作文件系统上的文本文件和二进制文件。通过使用这些库，我们可以创建文件、更新内容、复制和删除文件。这些库是\
    \ `os`、`os.path` 和 `shutil`。\n*   `os` 和 `path`：这些库包含了访问文件系统的函数。\n*   `shutil`：此库用于复制和删除文件。\n\
    \n### 8) Python 支持哪些不同的文件处理模式？\nPython 提供了三种打开文件的模式。只读、只写、读写和追加模式。`'r'` 用于以只读模式打开文件，`'w'`\
    \ 用于以只写模式打开文件，`'rw'` 用于读写模式打开，`'a'` 用于以追加模式打开文件。如果未指定模式，默认以只读模式打开文件。\n\n*   **只读模式**：以只读模式打开文件。这是默认模式。\n\
    *   **只写模式**：以只写模式打开文件。如果文件包含数据，数据将丢失。否则会创建一个新文件。\n*   **读写模式**：以读、写模式打开文件。这意味着更新模式。\n\
    *   **追加模式**：以写模式打开文件，如果文件存在，则追加到文件末尾。\n\n"
- fmt: "\n# 9. What are the different types of operators in Python?\nPython uses a\
    \ rich set of operators to perform a variety of operations. Some individual operators\
    \ like membership and identity operators are not so familiar but allow to perform\
    \ operations. \n\n- Arithmetic Operators \n- Relational Operators\n- Assignment\
    \ Operators\n- Logical Operators\n- Membership Operators\n- Identity Operators\n\
    - Bitwise Operators\n\n## 10. How to create a Unicode string in Python?\nIn Python\
    \ 3, the old Unicode type has replaced by `str` type, and the string is treated\
    \ as Unicode by default. We can make a string in Unicode by using `art.title.encode(\"\
    utf-8\")` function.\n\n## 11. Is Python interpreted language?\nPython is an interpreted\
    \ language. The Python language program runs directly from the source code. It\
    \ converts the source code into an intermediate language code, which is again\
    \ translated into machine language that has to be executed. Unlike Java or C,\
    \ Python does not require compilation before execution.\n\n## 12. What are the\
    \ rules for a local and global variable in Python?\nIn Python, variables that\
    \ are only referenced inside a function are called implicitly global. If a variable\
    \ is assigned a new value anywhere within the function's body, it's assumed to\
    \ be a local. If a variable is ever assigned a new value inside the function,\
    \ the variable is implicitly local, and we need to declare it as `global` explicitly.\
    \ To make a variable globally, we need to declare it by using `global` keyword.\
    \ Local variables are accessible within local body only. Global variables are\
    \ accessible anywhere in the program, and any function can access and modify its\
    \ value.\n\n## 13. What is the namespace in Python?\nIn Python, every name has\
    \ a place where it lives. It is known as a namespace. It is like a box where a\
    \ variable name maps to the object placed. Whenever the variable is searched out,\
    \ this box will be searched, to get the corresponding object.\n\n## 14. What are\
    \ iterators in Python?\nIn Python, iterators are used to iterate a group of elements,\
    \ containers like a list. Iterators are the collection of items, and it can be\
    \ a list, tuple, or a dictionary. Python iterator implements `__iter__` and `next()`\
    \ method to iterate the stored elements. In Python, we generally use loops to\
    \ iterate over the collections (list, tuple).\n\n## 15. What is a generator in\
    \ Python?\nIn Python, the generator is a way that specifies how to implement iterators.\
    \ It is a normal function except that it yields expression in the function. It\
    \ does not implements `__iter__` and `next()` method and reduce other overheads\
    \ as well. If a function contains at least a `yield` statement, it becomes a generator.\
    \ The `yield` keyword pauses the current execution by saving its states and then\
    \ resume from the same when required.\n\n## 16. What is slicing in Python?\nSlicing\
    \ is a mechanism used to select a range of items from sequence type like list,\
    \ tuple, and string. It is beneficial and easy to get elements from a range by\
    \ using slice way. It requires a `:` (colon) which separates the start and end\
    \ index of the field. All the data collection types `List` or `tuple` allows us\
    \ to use slicing to fetch elements. Although we can get elements by specifying\
    \ an index, we get only single element whereas using slicing we can get a group\
    \ of elements.\n\n## 17. What is a negative index in Python?\nPython sequences\
    \ are accessible using an index in positive and negative numbers. For example,\
    \ 0 is the first positive index, 1 is the second positive index and so on. For\
    \ negative indexes -1 is the last negative index, -2 is the second last negative\
    \ index and so on. Index traverses from left to right and increases by one until\
    \ end of the list. Negative index traverse from right to left and iterate one\
    \ by one till the start of the list. A negative index is used to traverse the\
    \ elements into reverse order.\n\n## 18. What is pickling and unpickling in Python?\n\
    Pickling is a process in which a `pickle` module accepts any Python object, converts\
    \ it into a string representation and dumps it into a file by using `dump()` function.\
    \ Unpickling is a process of retrieving original Python object from the stored\
    \ string representation for use. `Pickle` is a standard module which serializes\
    \ and de-serializes a Python object structure.\n\n## 19. What are the differences\
    \ between Python 2.x and Python 3.x?\nPython 2.x is an older version of Python.\
    \ Python 3.x is newer and latest version. Python 2.x is legacy now. Python 3.x\
    \ is the present and future of this language. The most visible difference between\
    \ Python2 and Python3 is in print statement (function). In Python 2, it looks\
    \ like `print \"Hello\"`, and in Python 3, it is `print (\"Hello\")`. String in\
    \ Python2 is ASCII implicitly, and in Python3 it is Unicode. The `xrange()` method\
    \ has removed from Python 3 version. A new keyword as `is` is introduced in Error\
    \ handling.\n\n## 20. How to send an email in Python Language?\nTo send an email,\
    \ Python provides `smtplib` and `email` modules. Import these modules into the\
    \ created mail script and send mail by authenticating a user. It has a method\
    \ `SMTP(smtp-server, port)`. It requires two parameters to establish SMTP connection.\
    \ A simple example to send an email is given below.\n\n```python\nimport smtplib\n\
    # Calling SMTP\ns = smtplib.SMTP('smtp.gmail.com' , 587)\n# TLS for network security\n\
    s.starttls()\n# User email Authentication\ns.login(\"sender_email_id\" , \"sender_email_id_password\"\
    \ )\n# message to be sent\nmessage = \"Message_you_need_to_send\"\n# sending the\
    \ mail\ns.sendmail(\"sender_email_id\" , \"receiver_email_id\" , message)\n```\n"
