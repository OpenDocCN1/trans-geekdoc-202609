  trans: "\n\n# PHP 入学者教程 第 1 章\n\n## 关于 PHP\n\n### 什么是 PHP？\n`PHP` 是一种服务器端脚本语言，用于开发静态网站、动态网站或\
    \ Web 应用程序。`PHP` 代表 `Hypertext Pre-processor`（超文本处理器），早期曾代表 `Personal Home Pages`（个人首页）。`PHP`\
    \ 脚本只能在安装了 `PHP` 的服务器上进行解释。访问 `PHP` 脚本的客户端电脑只需要 浏览器。`PHP` 文件包含 `PHP` 标签并以 `.php`\
    \ 扩展名结尾。\n\n### 脚本语言\n脚本是一组在运行时解释的编程指令。脚本语言是一种在运行时解释脚本的语言。脚本通常嵌入到其他软件环境中。脚本的通常是为了增强性能或为应用程序执行例行任务。服务器端脚本在服务器上进行解释，而客户端脚本由客户端应用程序解释。`PHP`\
    \ 是一种在服务器上解释的服务器端脚本，而 `JavaScript` 是一个由客户端浏览器解释的客户端脚本示例。`PHP` 和 `JavaScript` 都可以嵌入到\
    \ HTML 页面中。\n\n### 编程语言 VS 脚本语言\n| 编程语言 | 脚本语言 |\n| :--- | :--- |\n| 拥有开发完整应用程序所需的所有功能\
    \ | 主要用于例行任务 |\n| 代码在执行前必须经过编译 | 代码通常无需编译即可执行 |\n| 不需要嵌入到其他语言中 | 通常嵌入到其他软件环境中\
    \ |\n\n### PHP 代表什么？\n`PHP` 的意思是 `Personal Home Page`（个人首页），但它现在代表递归回缩写 `PHP:\
    \ Hypertext Preprocessor`（PHP：超文本处理器）。`PHP` 代码可以嵌入 HTML 代码中，也可以与各种 Web 模板系统、Web\
    \ 内容管理系统和 Web 框架结合。\n\n### PHP 语法\n`PHP` 文件也可以包含如 `HTML` 等标签以及 `JavaScript` 等客户端脚本。\n\
    * `HTML` 是学习 `PHP` 语言时的额外优势。你甚至可以在不知道 `HTML` 的情况下学习 `PHP`，但建议你至少了解 `HTML` 的基础。\n\
    * 用于数据库驱动应用程序的数据库管理系统 `DBMS`。\n* 对于交互式应用程序和 Web 服务等高级主题，你需要 `JavaScript` 和 `XML`。下所示流程图说明了\
    \ `PHP` Web 的基本架构以及服务器如何处理请求。\n\n### 为什么要使用 PHP？\n你显然听过许多编程语言；你可能想知道为什么要把 `PHP`\
    \ 作为我们 Web 编程的选择。以下是一些具有说服力的理由。\n* `PHP` 是开源且免费的。\n* 与 `JSP`、`ASP` 等语言相比，学习曲线较短。\n\
    * 庞大的社区文档。\n* 大多数 Web 托管服务器默认支持 `PHP`，不像 `ASP` 等需要 `IIS` 的语言。这使得 `PHP` 成为一个高效益的选择。\n\
    * `PHP` 定期更新以跟上最新的技术趋势。\n* 使用 `PHP` 的其他好处是它是一种服务器端脚本语言；这意味着你只需要在服务器上安装它，向服务器请求资源的客户端电脑不需要安装\
    \ `PHP`；仅需 浏览器即可。\n* `PHP` 内置支持与 `MySQL` 协同工作；这并不意味着你可以将 `PHP` 与其他数据库管理系统配合。你仍然可以使用\n\
    \    * `Postgres`\n    * `Oracle`\n    * `MS SQL Server`\n    * `ODBC` 等\n* `PHP`\
    \ 是跨平台的；这意味着你可以将应用程序部署在多个不同的操作系统上，如 `windows`、`Linux`、`Mac OS` 等。\n\n### PHP 的用途与市场份额\n\
    在市场份额方面，互联网上有超过 2000 万个使用 `PHP` 脚本语言开发的网站和应用程序。这可能归因于以下几点；下图显示了一些使用 `PHP` 的流行站点![](img/src1N.jpg)\n\
    \n# 第 2 章\n\n## 安装 PHP\n为了安装 `PHP`，我们需要 `Apache`、`MySQL` 和 `PHP` 栈。它在不同的操作系统上可用。以下是某些选项：\n\
    * `WAMP` 用于 Windows\n* `LAMP` 用于 Linux\n* `MAMP` 用于 Mac\n* `SAMP` 用于 Solaris\n\
    * `FAMP` 用于 FreeBSD\n* `XAMPP` 用于跨平台\n`XAMPP` 包含了 `Apache`、`MySQL` 等组件等。\n\n###\
    \ 什么是 XAMPP\n`XAMPP` 是在服务器上解释的 `Apache`、`MySQL`、`PHP` 和 `Perl` 软件包。它由 `Apache`\
    \ 维护`XAMPP` 代表：\n* `X` - 操作系统\n* `A` - Apache\n* `M` - MySQL\n* `P` - PHP\n* `P`\
    \ - Perl\n\n### 为什么使用 XAMPP？\n为了使用 `PHP`，你需要安装 `Apache` 和 `MySQL`。`XAMPP` 提供了一个易于使用的控制面板来管理\
    \ `Apache`。如果你单独安装 `Apache`，你仍然需要设置和集成它。`XAMPP` 处理 `PHP` 和 `Perl` 的复杂性。你不需要记住启动\
    \ `Apache` 的命令。\n* 下载 `XAMPP` 安装程序：http://www.apachefriends.org/en/xampp.html\n\
    \n### 安装\n`XAMPP` 就像安装其他 Windows 程序一样。在我们测试 `XAMPP` 安装之前，让我们先看看基础目录。\n\n#### 基础\
    \ Web 服务器配置\n本教程假设你在 Windows 的 `C` 上安装。以下是你需要了解的基础目录列表：\n* `htdocs`：这是 Web 根目录。所有的\
    \ `PHP` 代码将放在此目录中。\n* `mysql`：此目录包含与 `MySQL` 数据库引擎相关的所有信息，默认运行在端口 `3306`。\n* `php`：此目录包含\
    \ `PHP` 安装文件。它包含一个名为 `php.ini` 的重要文件。该目录用于配置 `PHP` 在服务器上的行为。默认情况下，`Apache` Web\
    \ 服务器运行在端口 `80`。如果端口 `80` 被其他 Web 服务器占用，可以使用不同的端口。\n\n#### 控制面板\n控制面板用于管理通过 `XAMPP`\
    \ 安装的程序。打开 `XAMPP` 控制面板：\n* 点击开始菜单\n* 程序目录并找到 `Apache Friends`，然后是 `XAMPP`，如图所示![](img/src1MV.jpg)\n\
    * 下图显示了控制面板![](img/src1NC.jpg)\n\n"
- fmt: "\n### 3) This section contains useful utilities such as `Netsat`, windows\
    \ services short cuts etc.\n\n### 4) This section displays status information\
    \ on the modules. The control panel can be used to;\n* Install and uninstall services\
    \ such as `Apache`, `MySQL` etc. that are installed via `XAMPP`\n* Start and stop\
    \ services.\n* Open configure files etc.\n\n### Configure XAMPP\nLet’s now look\
    \ at the basic configurations required before we start using our `XAMPP` installation\
    \ for developing PHP powered web sites. Type the URL `http://localhost/xampp/`\
    \ in your favorite browser. What is the best PHP IDE? A PHP IDE is a program that\
    \ allows you to easily write PHP codes. PHP IDEs are often equipped with syntax\
    \ highlighting features and in some cases autocomplete features too. This means\
    \ that if you write a PHP keyword that is known by the PHP interpreter, then the\
    \ keyword will be highlighted a different color from the one used for regular\
    \ statements. The autocomplete features automatically pops up known PHP keywords\
    \ as you type them.\n\n`Notepad` can also be used to write and editor PHP codes.\
    \ The disadvantage of using an editor such as `Notepad` is that debugging the\
    \ scripts becomes difficult because it is not easy to spot errors such as misspelled\
    \ keywords, unclosed braces etc. an IDE will highlight the statements with errors\
    \ so it’s easy for you to spot them. The table shown below shows 5 popular PHP\
    \ editors\n\n| Editor | License | Cross Platform | Brief description |\n| ---\
    \ | --- | --- | --- |\n| Netbeans IDE | Open Source | Yes | ● Dedicated PHP coding\
    \ environment with syntax highlighting and code completion for keywords and other\
    \ known information. ● Supports integration with PHP MVC frameworks i.e. `Zend`,\
    \ ● Code History that shows the changes made to a file ● Supports `SFTP`, `FTP`\
    \ and `SVN` via plugins. |\n| Dreamweaver | Commercial | Yes | ● Supports `HTML`\
    \ and `PHP`. ● Syntax highlighting, code folding and completion for keywords and\
    \ other known information. ● Supports `SFTP` and `FTP`. |\n| Zend studio | Commercial\
    \ | Yes | ● Integrated with `Zend Server` and `Zend PHP`` framework, `PHPUnit`,\
    \ `phpDocumentor` etc. ● Has syntax highlighting, code folding, ● Support for\
    \ Web services etc. |\n| PHP Eclipse | Open Source | Yes | ● Code formatter ●\
    \ Supports `SVN`, `SHH/FTP` |\n| Notepad ++ | Freeware | Windows only | ● Syntax\
    \ highlighting ● Supports `SFTP` and `FTP` via plugins. |\n\n### Netbeans IDE\
    \ PHP editor\nAs briefly highlighted in the above table, `Netbeans IDE` has powerful\
    \ features that enhance the productive of PHP coders. The IDE can be freely downloaded\
    \ from the `http://netbeans.org/downloads/index.html`\n* Syntax highlighting and\
    \ auto-complete features enhances your productivity\n* It has native support for\
    \ database systems like `MySQL`. You don’t need to use two programs to code and\
    \ develop your database.\n* The IDE can be used in a collaborative environment.\
    \ This comes in handy when you have to work with other developers as a team.\n\
    * The IDE has support for other languages such as;\n    * `Java SE`\n    * `Java\
    \ EE`\n    * `C`\n    * `C++`\n\n### Introduction to Netbeans IDE\nAfter you have\
    \ successfully installed the `Netbeans IDE` PHP editor, run the program just like\
    \ any other windows program.\n1. **Project explorer** – this panel is used to\
    \ display all the opened projects. The projects are listed in a tree view.\n2.\
    \ **Shortcuts tool bar** – this toolbar contains shortcuts to frequently performed\
    \ tasks such as creating a new project, opening an existing project, undo and\
    \ redo actions etc.\n3. **Startup page** – this page contains 3 tabs namely- `Learn\
    \ & Discover`, `My Netbeans` and `What’s New`.\n    * The first tab `[Learn and\
    \ Discover]` introduces you to the features of the `Netbeans IDE`, showcases some\
    \ demos and tutorials that can be developed in the `Netbeans IDE`.\n    * The\
    \ second tab `[My Netbeans]` lists the recently opened projects, allows you to\
    \ install plugins and activate features of the IDE.\n4. **Output window** – it\
    \ is used to display output from programs such as `Java` console applications.\
    \ It is also used to display log and debug information.\n\nThe `Netbeans PHP editor`\
    \ allows for integration with PHP MVC frameworks such as `Symfony` and `Zend`.\
    \ For now we will not select any MVC framework. Click on Finish button.\n* Your\
    \ newly created project will be displayed in the project browser and an `index.php`\
    \ page created for you.\n* The newly create page contains some html code. Replace\
    \ it with the following code shown below.\n\n### Running your first PHP Example\n\
    ```php\n<?php\necho \"Hello World!\";\n?>\n```\n* Click on the run button on the\
    \ toolbar\n* Your default browser will be opened with the URL `http://localhost/phplessons/index.php`.\
    \ The output “Hello World!” will be displayed in your browser.\n\n* `XAMPP` is\
    \ the acronym for `X-cross platform`, `Apache`, `MySQL`, `PHP` and `Perl`\n* A\
    \ PHP editor is a program that allows you to write PHP code within the shortest\
    \ possible time and allows you to debug your syntax errors at design time.\n*\
    \ `Netbeans PHP editor` is a cross platform open source editor that enhances the\
    \ productivity of PHP developers.\n\n### CHAPTER 3 PHP Data Types, Variables,\
    \ Constant, Operators\n\n#### Data Types\nA Data type is the classification of\
    \ data into a category according to its attributes;\n* Alphanumeric characters\
    \ are classified as strings\n* Whole numbers are classified integers\n* Numbers\
    \ with decimal points are classified as floating points.\n* True or false values\
    \ are classified as Boolean.\n\nPHP is a loosely typed language; it does not have\
    \ explicit defined data types. PHP determines the data types by analyzing the\
    \ attributes of data supplied. PHP implicitly supports the following data types\n\
    * **Integer** – whole numbers e.g. `-3`, `0`, `69`. The maximum value of an integer\
    \ is platform-dependent. On a 32 bit machine, it’s usually around 2 billion. 64\
    \ bit machines usually have larger values. The constant `PHP_INT_MAX` is used\
    \ to determine the maximum value.\n\n```php\n<?php\necho PHP_INT_MAX;\n?>\n```\n"
