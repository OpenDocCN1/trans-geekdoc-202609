  trans: "\n\n# 必须参数\n\n到目前为止，我们学习了 Python 中的函数调用。然而，我们可以在函数调用时提供参数。\n\n关于必须参数（required\
    \ arguments），这些是在函数调用时必须传递的参数，且其位置必须与函数调用和函数定义中的位置完全匹配。如果在函数调用中没有提供其中一个参数，或者参数的位置发生了变化，Python\
    \ 解释器将显示错误。考虑以下示例。\n\n### 示例 1\n参数 `name` 是函数 `func` 的必须参数。\n```python\ndef func(name):\n\
    \    message = \"Hi \" +name\n    return message\nname = input(\"Enter the name?\
    \ \")\nprint(func(name))\n```\n输出: `Enter the name?John Hi John`\n\n### 示例 2\n\
    函数 `simple_interest` 三个参数并相应返回单利。\n```python\ndef simple_interest(p,t,r):\n  \
    \  return (p*t*r)/ 100\np = float(input(\"Enter the principle amount? \"))\nr\
    \ = float(input(\"Enter the rate of interest? \"))\nt = float(input(\"Enter the\
    \ time in years? \"))\nprint(\"Simple Interest: \",simple_interest(p,r,t))\n```\n\
    输出: `Enter the principle amount? 10000 Enter the rate of interest? 5 Enter the\
    \ time in years? 2 Simple Interest: 1000.0`\n\n### 示例 3\n函数 `calculate` 返回两个参数\
    \ `a` 和 `b` 的和。\n```python\ndef calculate(a,b):\n    return a+b\ncalculate(10)\
    \ # 这会导致错误，因为我们缺少一个必须的参数 b .\n```\n输出: `TypeError: calculate() missing 1 required\
    \ positional argument: 'b'`\n\n# 关键字参数\n\nPython 允许我们使用关键字参数调用函数。这种函数调用允许我们以随机顺序传递参数。参数名称被视为关键字并在函数调用和定义中进行匹配。如果找到了相同的匹配，参数的值将复制到函数定义中。考虑以下示例。\n\
    \n### 示例 1\n使用 `name` 和 `message` 作为关键字参数调用函数 `func`。\n```python\ndef func(name,message):\n\
    \    print(\"printing the message with \",name,,\"and \",message)\nfunc(name =\
    \ \"John \",message=\"hello \") #name 和 message 分别带值 John 和 hello 被复制\n```\n输出:\
    \ `printing the message with John and hello`\n\n### 示例 2\n在调用时以不同的顺序提供值。\n使用关键字参数调用函数\
    \ `simple_interest(p, t, r)`；在这种情况下参数的顺序并不重要。\n```python\ndef simple_interest(p,t,r):\n\
    \    return (p*t*r)/ 100\nprint(\"Simple Interest: \",simple_interest(t=10,r=10,p=1900))\n\
    ```\n输出: `Simple Interest: 1900.0`\n\n如果我们在函数调用时提供了不同的参数名称，将抛出错误。考虑以下示例。\n\n###\
    \ 示例 3\n使用关键字参数调用函数 `simple_interest(p, t, r)`。\n```python\ndef simple_interest(p,t,r):\n\
    \    return (p*t*r)/ 100\nprint(\"Simple Interest: \",simple_interest(time=10,rate=10,principle=1900))\
    \ # 未能找到参数名称（关键字）的精确匹配\n```\n输出: `TypeError: simple_interest() got an unexpected\
    \ keyword argument 'time'`\n\nPython 允许我们在函数调用时混合使用必须参数和关键字参数。然而，在函数调用时，必须参数必须放在关键字参数之前。考虑以下示例。\n\
    \n### 示例 4\n```python\ndef func(name,message):\n    print(\"printing the message\
    \ with \",name,,\"and \",message)\nfunc(\"John \",message=\"hello \") #必须参数不能在关键字参数之后\n\
    ```\n输出: `printing the message with John and hello`\n\n由于必须参数和关键字参数的混合，以下示例会导致错误。\n\
    \n### 示例 5\n```python\ndef func(name1,message2):\n    print(\"printing the message\
    \ with \",name1)\nfunc(message=\"hello \", \"John \")\n```\n输出: `SyntaxError:\
    \ positional argument follows keyword argument`\n\n# 默认参数\n\nPython 允许我们在函数定义时初始化参数。如果在函数调用时没有提供某个参数的值，则可以使用定义中的默认值。\n\
    \n### 示例 1\n```python\ndef printme(name,age=2):\n    print(\"My name is \",name,\"\
    and age \",age)\nprintme(\"john\")\n```\n输出: `My name is john and age 2`\n\n###\
    \ 示例 2\n```python\ndef printme(name,age=2):\n    print(\"My name is \",name,\"\
    and age \",age)\nprintme(name=\"David\")\n```\n输出: `My name is David and age 2`\n\
    \n# 可变长度参数\n\n大型项目中，我们可能无法预知参数的数量。在这种情况下，Python 允许我们提供逗号分隔的值，这些在函数调用时被视为元组。在函数定义中，我们必须使用\
    \ `*name` 来定义变量。考虑以下示例。\n\n```python\ndef printme(*names):\n    print(\"type of\
    \ passed argument is \",type(names))\n    print(\"printing the arguments...\"\
    )\n    for name in names:\n        print(name)\nprintme(\"john \", \"David \"\
    , \"smith \", \"nick \")\n```\n输出:\n`type of passed argument is <class 'tuple'>`\n\
    `printing the arguments...`\n`john `\n`David `\n`smith `\n`nick `\n\n# 变量的作用域\n\
    \n变量的作用域取决于变量声明的位置。程序某部分定义的变量可能在其他部分访问。在 Python 中，变量分为两种类型的作用域。\n\n### 全局变量\n\
    在函数外部定义的变量具有全局作用域，而在函数内部定义的变量具有局部作用域。考虑以下示例。\n\n### 示例 1\n```python\ndef print_message():\n\
    \    message = \"hello !! I am going to print a message.\" #  message 是函数局部的\n\
    \    print(message)\nprint_message()\nprint(message) # 这会导致错误，因为在这里无法访问局部变量。\n\
    ```\n输出:\n`hello !! I am going to print a message.`\n`File \"/root/PycharmProjects/PythonTest/Test1.py\"\
    , line 6, in print(message)`\n`NameError: name 'message' is not defined`\n\n###\
    \ 局部变量\n```python\ndef calculate(*args):\n    sum = 0\n    for arg in args:\n\
    \        sum = sum + arg\n    print(\"The sum is \",sum)\nsum = 0\ncalculate(10,\
    \ 20, 30) # 60 将作为和打印\nprint(\"Value of sum outside the function: \",sum) # 0\
    \ 将被打印\n```\n输出:\n`The sum is 60`\n`Value of sum outside the function: 0`\n\n"
- fmt: "\n# CHAPTER 7 Python If-else statements\n\nDecision making is the most important\
    \ aspect of almost all the programming languages. As the name implies, decision\
    \ making allows us to run a particular block of code for a particular decision.\
    \ Here, the decisions are made on the validity of the particular conditions. Condition\
    \ checking is the backbone of decision making. In python, decision making is performed\
    \ by the following statements.\n\n| Statement | Description |\n| :--- | :--- |\n\
    | If Statement | The `if` statement is used to test a specific condition. If the\
    \ condition is true, a block of code (`if-block`) will be executed. |\n| If-else\
    \ Statement | The `if-else` statement is similar to `if` statement except the\
    \ fact that, it also provides the block of the code for the false case of the\
    \ condition to be checked. If the condition provided in the `if` statement is\
    \ false, then the `else` statement will be executed. |\n| Nested if Statement\
    \ | Nested `if` statements enable us to use `if-else` statement inside an outer\
    \ `if` statement. |\n\n## Indentation in Python\nFor the ease of programming and\
