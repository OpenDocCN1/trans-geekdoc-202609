    python object, i.e., Numbers, string or tuple. Dictionary simulates Java hash-map
    in python. Creating the dictionary The dictionary can be created by using multiple
    key-value pairs enclosed with the small brackets () and separated by the colon
    (:). The collections of the key-value pairs are enclosed within the curly braces
    {}. The syntax to define the dictionary is given below. Dict = {"Name" : "Ayush"
