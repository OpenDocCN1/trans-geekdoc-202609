- fmt: "\n# PHP FOR BEGINNERS CHAPTER 1\n\n## About PHP\n\n### What is PHP?\n`PHP`\
    \ is a server side scripting language. that is used to develop Static websites\
    \ or Dynamic websites or Web applications. `PHP` stands for `Hypertext Pre-processor`,\
    \ that earlier stood for `Personal Home Pages`. `PHP` scripts can only be interpreted\
    \ on a server that has `PHP` installed. The client computers accessing the `PHP`\
    \ scripts require a web browser only. A `PHP` file contains `PHP` tags and ends\
    \ with the extension `.php`.\n\n### Scripting Language\nA script is a set of programming\
    \ instructions that is interpreted at runtime. A scripting language is a language\
    \ that interprets scripts at runtime. Scripts are usually embedded into other\
    \ software environments. The purpose of the scripts is usually to enhance the\
    \ performance or perform routine tasks for an application. Server side scripts\
    \ are interpreted on the server while client side scripts are interpreted by the\
    \ client application. `PHP` is a server side script that is interpreted on the\
    \ server while `JavaScript` is an example of a client side script that is interpreted\
    \ by the client browser. Both `PHP` and `JavaScript` can be embedded into HTML\
    \ pages.\n\n### Programming Language Vs Scripting Language\n| Programming language\
    \ | Scripting language |\n| :--- | :--- |\n| Has all the features needed to develop\
    \ complete applications | Mostly used for routine tasks |\n| The code has to be\
    \ compiled before it can be executed | The code is usually executed without compiling\
    \ |\n| Does not need to be embedded into other languages | Is usually embedded\
    \ into other software environments. |\n\n### What does PHP stand for?\n`PHP` means\
    \ - `Personal Home Page`, but it now stands for the recursive backronym `PHP:\
    \ Hypertext Preprocessor`. `PHP` code may be embedded into HTML code, or it can\
    \ be used in combination with various web template systems, web content management\
    \ system and web frameworks.\n\n### PHP Syntax\nA `PHP` file can also contain\
    \ tags such as `HTML` and client side scripts such as `JavaScript`.\n* `HTML`\
    \ is an added advantage when learning `PHP` Language. You can even learn `PHP`\
    \ without knowing `HTML` but it’s recommended you at least know the basics of\
    \ `HTML`.\n* Database management systems `DBMS` for database powered applications.\n\
    * For more advanced topics such as interactive applications and web services,\
    \ you will need `JavaScript` and `XML`. The flowchart diagram shown below illustrates\
    \ the basic architecture of a `PHP` web application and how the server handles\
    \ the requests.\n\n### Why use PHP?\nYou have obviously head of a number of programming\
    \ languages out there; you may be wondering why we would want to use `PHP` as\
    \ our poison for the web programming. Below are some of the compelling reasons.\n\
    * `PHP` is open source and free.\n* Short learning curve compared to other languages\
    \ such as `JSP`, `ASP` etc.\n* Large community document\n* Most web hosting servers\
    \ support `PHP` by default unlike other languages such as `ASP` that need `IIS`.\
    \ This makes `PHP` a cost effective choice.\n* `PHP` is regular updated to keep\
    \ abreast with the latest technology trends.\n* Other benefit that you get with\
    \ `PHP` is that it’s a server side scripting language; this means you only need\
    \ to install it on the server and client computers requesting for resources from\
    \ the server do not need to have `PHP` installed; only a web browser would be\
    \ enough.\n* `PHP` has in built support for working hand in hand with `MySQL`;\
    \ this doesn’t mean you can’t use `PHP` with other database management systems.\
    \ You can still use `PHP` with\n    * `Postgres`\n    * `Oracle`\n    * `MS SQL\
    \ Server`\n    * `ODBC` etc.\n* `PHP` is cross platform; this means you can deploy\
    \ your application on a number of different operating systems such as `windows`,\
    \ `Linux`, `Mac OS` etc.\n\n### What is PHP used for & Market share\nIn terms\
    \ of market share, there are over 20 million websites and application on the internet\
    \ developed using `PHP` scripting language. This may be attributed to the points\
    \ raised above; The diagram below shows some of the popular sites that use `PHP`![](rsrc1KM.jpg)\n\
    \n# CHAPTER 2\n\n## Install PHP\nTo install `PHP`, we will suggest you to install\
    \ `AMP` (`Apache`, `MySQL`, `PHP`) software stack. It is available for all operating\
    \ systems. There are many `AMP` options available in the market that are given\
    \ below:\n* `WAMP` for Windows\n* `LAMP` for Linux\n* `MAMP` for Mac\n* `SAMP`\
    \ for Solaris\n* `FAMP` for FreeBSD\n* `XAMPP` (Cross, Apache, MySQL, PHP, Perl)\
    \ for Cross Platform:\n    * It includes some other components too as `FileZilla`,\
    \ `OpenSSL`, `Webalizer`, `Mercury Mail` etc.\n\n### XAMPP\n`XAMPP` is an open\
    \ source cross platform web server, `MySQL` database engine, and `PHP` and `Perl`\
    \ package. It is compiled and maintained by `apache`. The acronym `XAMPP` stands\
    \ for:\n* `X` – `[cross platform operating systems]` meaning it can run on any\
    \ OS `Mac OX`, `Windows`, `Linux` etc.\n* `A` – `Apache` - this is the web server\
    \ software.\n* `M` – `MySQL` - Database.\n* `P` – `PHP`\n* `P` – `Perl` – scripting\
    \ language\n\n### Why use XAMPP?\n* In order to use `PHP`, you will need to install\
    \ `PHP`, `Apache` and may be even `MySQL`. It’s not easy to install `Apache` and\
    \ configure it. If you install `Apache` on its own, you will still have to set\
    \ it up and integrate it with `PHP` and `Perl` among other things. `XAMPP` deals\
    \ with all the complexity in setting up and integrating with `PHP` and `Perl`.\
    \ Unlike `Java` that runs with the `Java SDK` only, `PHP` requires a web server\
    \ to work\n* `XAMPP` provides an easy to use control panel to manage `Apache`,\
    \ `MySQL` and other programs such as `Tomcat`, `filezilla` etc. You don’t have\
    \ to memorize commands for starting `apache`, `MySQL` etc.\n* Download the `XAMPP`\
    \ installer at `http://www.apachefriends.org/en/xampp-windows.html`\n\n### Installation\n\
    `XAMPP` is just like installing any other windows program. Before we test our\
    \ `XAMPP` installation, let’s first look at the basic directories that we will\
    \ be working with.\n\n#### Basic Web server configuration\nThis tutorial assumes\
    \ that you have installed `XAMPP` on drive `C` in Windows using the steps mentioned\
    \ above. The following is a list of the basic directories that you are supposed\
    \ to be aware of.![](rsrc1MV.jpg)\n* `htdocs`; this is the web root directory.\
    \ All of our `PHP` codes will be placed in this directory.\n* `mysql` – this directory\
    \ contains all the information related to `MySQL` database engine, by default\
    \ it runs on port `3306`.\n* `php` – this directory contains `PHP` installation\
    \ files. It contains an important file named `php.ini`. This directory is used\
    \ to configure how `PHP` behaves on your server. By default, the `Apache` web\
    \ server runs on port `80`. If port `80` is taken by another web server, you can\
    \ use a different port number. For this tutorial we will assume we are using port\
    \ `80`. Note,If you use `SKYPE`, it uses the same port. Close `Skype` if you want\
    \ to use `Apache` on port `80`.\n\n#### Control panel\nThe control panel is used\
    \ to manage programs installed via `XAMPP`. To open the `XAMPP` control panel:\n\
    * Click on start menu\n* Explore the programs directory and locate `Apache Friends`\
    \ then `XAMPP` as shown in the diagram below![](rsrc1N7.jpg)\n* The diagram below\
    \ shows the control panel.![](rsrc1NC.jpg)\n\nThis section lists the installed\
    \ services, modules and the process IDs `PID(s)`. A green tick means the module\
    \ has been installed as a service. The red mark means it has not been installed\
    \ as a service. To install a service, click on the red mark. If the button shows\
    \ a green tick and you click on it, the control panel will ask you if you want\
    \ to uninstall the system. \nThis section shows Port(s) associated with the modules.\
    \ The actions section is for:\n1. starting and stopping modules\n2. Open the administrative\
    \ windows for `Apache` and `MySQL`\n3. Open configuration files for `Apache`,\
    \ `MySQL` etc. to make changes\n4. View log files for the modules\n"
