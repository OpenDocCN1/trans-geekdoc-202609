  trans: "\n\n`$_POST[…]` 是 PHP 数组。`'variable_name'` 是 URL 变量名。\n\n### PHP GET 方法\n\
    `$_GET` 是 PHP 内置的超全局数组变量，用于获取通过 HTTP GET 方法提交的值。\n- 该数组变量可以从程序中的任何脚本访问；它具有全局作用域。\n\
    - 此方法会在 URL 中显示表单值。\n- 它非常适合搜索引擎表单，因为它允许用户对结果进行收藏。\n\n它具有以下语法：\n```php\n<?php\n\
    $_GET['variable_name'];\n?>\n```\n在这里，`$_GET[…]` 是 PHP 数组。`'variable_name'` 是\
    \ URL 变量名。\n\n# 第 7 章 PHP File() 函数：`file_exists`, `Fopen`, `fwrite`, `Fclose`,\
    \ `Fgets`, `copy`, `unlink`\n\n## 什么是文件？\n文件简单来说是计算机上存储信息的资源。文件通常用于存储此类信息：\n-\
    \ 程序的配置设置\n- 简单的数据，例如电话号码对应的联系人。\n- 图像、图片、照片等。\n\n## PHP 文件格式支持\nPHP 文件函数支持广泛的文件格式，包括：\n\
    - `File.txt`\n- `File.log`\n- `File.custom_extension`，即 `file.xyz`\n- `File.csv`\n\
    - `File.gif`, `file.jpg` 等\n\n与需要其他软件和技能来管理 DBMS 系统的相比，文件为简单数据提供了永久且高效的数据存储解决方案：\n\
    - 你想要存储简单数据（如服务器日志）以便后续检索和分析。\n- 你想要存储程序设置，即 `program.ini`\n\n## PHP 函数\nPHP 通过其丰富的内置函数集合提供了一种方便的文件处理方法。Windows\
    \ 和 MAC OS 等操作系统对大小写敏感，而 Linux 或 Unix 操作系统对大小写敏感。采用仅使用小写字母进行文件命名的规范是一种良好的做法，可以确保最大的跨平台兼容性。\n\
    \n现在让我们来看一些常用的 PHP 文件函数。\n\n### PHP `file_exists` 函数\n此函数用于判断文件是否存在。\n- 当我们想在处理文件之前知道该文件是否存在时，它非常有用。\n\
    - 当你创建一个新文件并想确保该文件不存在时，也可以使用此函数。\n\n`file_exists` 函数具有以下语法：\n```php\n<?php\nfile_exists($filename);\n\
    ?>\n```\n在这里，`file_exists()` 是 PHP 函数，如果文件存在则返回 true，如果不存在则返回 false。 `$file_name`\
    \ 是要检查的文件路径和名称。以下代码使用 `file_exists` 来判断 `settings.txt` 是否存在。\n\n```php\n<?php\n\
    if (file_exists('settings.txt')) {\n    echo 'file found!';\n} else {\n    echo\
    \ 'settings.txt does not exist';\n}\n?>\n```\n将上述代码保存名为 `file_function.php` 的文件中。假设你将文件保存在\
    \ htdocs 中的 `phptuts` 文件夹中，打开 URL http://localhost/phptuts/file_function.php。\n\
    \n# PHP Try Catch 示例：异常与错误处理\n\n## 什么是异常？\n错误是程序本身无法处理的意外程序结果。错误通过修复程序来解决。错误的一个例子是永不停止执行的无限循环。\n\
    \n异常是程序本身可以处理的意外程序结果。异常的示例包括尝试打开一个不存在的文件。这种异常可以通过创建文件或向用户提供搜索文件的选项来处理。\n\n## PHP\
    \ 错误处理\n当发生错误时，取决于你的配置设置，PHP 会在浏览器中显示与发生错误相关的信息。PHP 提供了多种处理错误的方法。我们将查看三种 (3) 常用方法：\n\
    \n1. **Die 语句**：`die` 函数将 `echo` 和 `exit` 函数合并为一。当我们希望在发生错误时输出一条消息并停止脚本执行时，它非常有用。\n\
    2. **自定义错误处理器**：这些是每当发生错误时就会调用的用户自定义函数。\n3. **PHP 错误报告**：错误消息取决于你的 PHP 错误报告设置。这种方法在开发环境中非常有用，因为你可能不知道导致错误的原因。显示的信息可以帮助你调试应用程序。\n\
    \n"
