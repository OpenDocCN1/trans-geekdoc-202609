  trans: "\n\n## Switch 结构 (Switch Structure)\n\n?> 这里，\n● `switch(…){…}` 是控制结构块代码\
    \ \n● `case value: case…` 是根据条件值执行的代码块 \n● `default:` 是当没有值与条件匹配时执行的代码块\n\n###\
    \ 工作原理\n下方的流程图展示了 `switch` 控制结构是如何工作的 ![](img/rsrc2F1.jpg)\n\n## PHP 循环：For, ForEach,\
    \ While, Do While\n\n[示例]\n循环（Loop）是一种迭代控制结构，它涉及到在满足特定条件之前重复执行相同次数的代码。\n\n###\
    \ PHP For 循环\n上述代码输出“21 大于 7”\n\n#### For 循环\n`for...` 循环按指定的次数执行代码块。for 循环主要有两种类型：\n\
    ● `for`\n● `for… each.`\n\n现在，让我们分别单独查看它们。\n\n#### For 循环\n它具有以下基本语法：\n```php\n\
    <?php\nfor (initialize; condition; increment){\n  // 要执行的代码\n}\n?>\n```\n?> 这里，\n\
    ● `for…{…}` 是循环块 \n● `initialize` 通常是一个整数；用于设置计数器的初始值。 \n● `condition` 是每次 php\
    \ 执行时评估的条件。如果评估结果为真，则终止 `for...` 循环。如果评估结果为假，则继续执行 `for...` 循环。 \n● `increment`\
    \ 用于增加计数器整数的初始值。\n\n### 工作原理\n下方的流程图展示了 php 中的 `for` 循环是如何工作的 ![](img/rsrc2FS.jpg)\n\
    \n### 如何编写代码\n下面的代码使用 `for… 循环` 打印 10 乘以 0 到 10 的结果：\n```php\n<?php\nfor ($i =\
    \ 0; $i < 10; $i++){\n  $product = 10 * $i;\n  echo \"The product of 10 * $i is\
    \ $product <br/>\";\n}\n?>\n```\n输出：\nThe product of 10 x 0 is 0\nThe product\
    \ of 10 x 1 is 10\nThe product of 10 x 2 is 20\nThe product of 10 x 3 is 30\n\
    The product of 10 x 4 is 40\nThe product of 10 x 5 is 50\nThe product of 10 x\
    \ 6 is 60\nThe product of 10 x 7 is 70\nThe product of 10 x 8 is 80\nThe product\
    \ of 10 x 9 is 90\n\n### PHP For Each 循环\n`php foreach` 循环用于遍历数组值。它具有以下基本语法：\n\
    ```php\n<?php\nforeach($array_variable as $array_value){\n  // 代码块\n}\n?>\n```\n\
    ?> 这里，\n● `foreach(…){…}` 是循环块 \n● `$array_data` 是要循环的数组 \n● `$array_value` 是持有当前项目的临时变量\
    \ \n● `block of code`\n\n### 工作原理\n下方的流程图展示了 `foreach` 循环是如何工作的 ![](img/src2GK.jpg)\n\
    \n## While 循环\n\nWhile 循环\n它们用于执行代码块，直到满足某个条件。\n\n### 何时使用 while 循环\n● While 循环用于从数据库查询中读取记录。\n\
    \n### while 循环的类型\n● `do… while` - 在条件之前至少执行一次代码块\n● `while…` - 先检查条件。如果评估结果为真，则只要条件满足就执行代码块。如果评估结果为假，则终止执行。\n\
    \n#### While 循环\n它具有以下语法：\n```php\n<?php\nwhile (condition){\n  // 要执行的代码块\n}\n\
    ?>\n```\n?> 这里，\n● `while(…){…}` 是循环块 \n● `condition` 是 while 循环评估的条件 \n● `block\
    \ of code`\n\n### 工作原理\n下方的流程图展示了 while 循环是如何工作的 ![](img/src2HF.jpg)\n\n### PHP\
    \ Do While\n`while… 循环` 与 `do… while 循环` 的区别在于，`do… while` 在评估条件之前至少执行一次。\n\n\
    现在，让我们来看 `do… while 循环` 的基本语法：\n```php\n<?php\ndo{\n  // 要执行的代码块\n} while (condition);\n\
    ?>\n```\n?> 这里，\n● `do{…} while(…)` 是循环块 \n● `condition` 是 while 循环评估的条件 \n● `block\
    \ of code`\n\n### 工作原理\n下方的流程图展示了 `while… 循环如何工作 ![](img/src2J5.jpg)\n\n## 第 6\
    \ 章 PHP 字符串函数：substr, strlen, strtolower, explode, strpos, str_replace\n\n###\
    \ 什么是字符串？\n字符串是字符集合。字符串是 PHP 支持的数据类型之一。字符串变量可以包含字母数字。字符串在以下情况下创建：\n● 你声明变量并为其分配字符串字符\n\
    ● 你可以直接在 `echo` 语句中使用它们\n● 字符串是语言结构，有助于捕捉词汇。\n\n学习 PHP 中字符串的工作原理以及如何操作它们将使你成为一名高效且多产开发者。\n\
    \n### PHP 创建字符串\n现在让我们来看创建字符串的不同方式。\n\n#### 创建字符串\n**使用单引号**：创建字符串最简单的方法是使用单引号。让我们看一个在\
    \ PHP 中创建简单字符串的示例。\n```php\n<?php\nvar_dump(\"You need to be logged in to view\
    \ this page\");\n?>\n```\n输出：`string(42) \"You need to be logged in to view this\
    \ page\"`\n\n**转义单引号**：如果单引号是字符串值的一部分，可以使用反斜杠对其进行转义。下面的代码展示了如何转义单引号。\n```php\n\
    <?php\necho \"I \\\\'ll be back after 20 minutes\";\n?>\n```\n"
- fmt: "\n?> Output: I \\'ll be back after 20 minutes\n\n# PHP Function: Numeric,\
    \ Built in, String, Date, User Defined\n\n## What is a Function?\nA function is\
    \ a reusable piece or block of code that performs a specific action. Functions\
    \ can either return values when called or can simply perform an operation without\
    \ returning any value. `PHP` has over 700 functions `built-in` that perform different\
    \ tasks.\n\n## Why use Functions?\n* **Better code organization**: functions allow\
    \ us to group blocks of related code that perform a specific task together.\n\
    * **Reusability**: once defined, a function can be called by a number of scripts\
    \ in our `PHP` files. This saves us time of reinventing the wheel when we want\
    \ to perform some routine tasks such as connecting to the database.\n* **Easy\
    \ maintenance**: updates to the system only need to be made in one place.\n\n\
    ## Built in Functions\nBuilt in functions are functions that exist in `PHP` installation\
    \ package. These built-in functions are what make `PHP` a very efficient and productive\
    \ scripting language. The built-in functions can be classified into many categories.\
    \ Below is the list of the categories.\n\n### String Functions\nThese are functions\
    \ that manipulate string data, refer to the article on strings for implementation\
    \ examples of string functions.\n\n### Numeric Functions\nNumeric functions are\
    \ function that return numeric results. `Numeric php function` can be used to\
    \ format numbers, return constants, perform mathematical computations etc.\n\n\
    ### Date Function\nThe `date` function is used to format `Unix` date and time\
    \ to human readable format. Check the article on `PHP` `date` functions for more\
    \ details.\n\n### Other functions\nThese include:\n* **Arrays**: see the article\
    \ on arrays for examples\n* **Files**: see the article on files for examples\n\
    * **Database functions**: see the article on `MySQL PHP` and other database access\
    \ methods v2\n\n## Why use User Defined Functions?\nUser-defined functions come\
    \ in handy when:\n* you have routine tasks in your application such as adding\
    \ data to the database\n* performing validation checks on the data\n* Authenticating\
    \ users in the system etc. \n\nThese activities will be spread across a number\
    \ of pages. Creating a function that all these pages can be calling [sic] is one\
    \ of the features that make `PHP` a powerful scripting language.\n\nBefore we\
    \ create our first user defined function, let’s look at the rules that we must\
    \ follow when creating our own functions:\n* Function names must start with a\
    \ letter or an underscore but not a number.\n* The function name must be unique.\n\
    * The function name must not contain spaces.\n* It is considered a good practice\
    \ to use descriptive function names.\n* Functions can optionally accept parameters\
    \ and return values too.\n\nLet’s now create our first function. We will create\
    \ a very basic function that illustrates the major components of a function in\
    \ `PHP`.\n\n```php\n<?php  \n//define a function that displays hello function\
    \  \nfunction add_numbers(){  \n    echo 1 + 2;  \n}  \nadd_numbers ();  \n?>\n\
    ```\n?> Output: 3\n\nHERE,\n* `function...(){}` is the function block that tells\
    \ `PHP` that you are defining a custom function.\n* `add_numbers` is the function\
    \ name that will be called when using the function.\n* `()` can be used to pass\
    \ parameters to the function.\n* `echo 'Hello function!';` is the function block\
    \ of code that is executed. It could be any code other than the one used in the\
    \ above example.\n\nLet’s now look at a fairly complex example that accepts a\
    \ parameter and display a message just like the above function. Suppose we want\
    \ to write a function that prints the user name on the screen, we can write a\
    \ custom function that accepts the user name.\n\n```php\n<?php  \nfunction display_name($name)\
    \ {\n    echo \"Hello \" . $name;  \n}  \ndisplay_name(\"Martin King\");\n?>\n\
    ```\n?> Output: Hello King\n\nHERE,\n* `($name)` is the parameter and is initialized\
    \ to nameless. If no parameter is passed to the function, it will result in errors.\n\
    \nLet’s now look at a function that accepts a parameter and returns a value. We\
    \ will create a function that converts kilometers to miles.\n\n```php\n<?php \
