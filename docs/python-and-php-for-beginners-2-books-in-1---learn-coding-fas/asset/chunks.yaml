  trans: "\n\n- `PHP` 是一种弱类型语言。\n- 变量是用于存储数据的内存位置。\n- 常量的值在运行时不能更改。\n- 类型强制转换用于将值或变量转换为所需的数据类型。\n\
    - 算术运算符用于处理数值数据。\n- 赋值运算符用于将数据分配给变量。\n- 比较运算符用于比较变量或值。\n- 逻辑运算符用于比较条件或值。\n\n#\
    \ 第 4 章 PHP 数组：关联数组、多维数组\n\n`PHP` `array`（数组）是一种变量，它可以在单个变量中存储多个相关数据。将数组想象成一个内部带有隔板的巧克力盒。盒子代表数组本身，而装有巧力的空间代表存储在数组中的值。\n\
    \n## 索引数组\n\n索引数组使用数字作为访问键。`access key` 是数组变量中内存槽的引用。每当我们想要读取或为数组元素分配新值时，都会使用\
    \ `access key`。下面是在 `php` 中创建索引数组的语法格式。\n\n```php\n<?php  \n$variable_name[n]\
    \ = value;  \n?> \n```\n或者\n```php\n<?php  \n$variable_name = array(n => value,\
    \ …);  \n?>\n```\n这里，\n- `$variable_name...` 是变量名。\n- `[n]` 是元素的访问索引数字。\n- `value`\
    \ 是分配给数组元素的值。\n\n现在让我们来看一个索引数组的示例。假设我们有 5 部电影想要存储在数组变量中。我们可以使用下所示的示例来实现。\n\n```php\n\
    <?php  \n$movie[0] = 'Shaolin Monk';  \n$movie[1] = 'Drunken Master';  \n$movie[2]\
    \ = 'American Ninja';  \n$movie[3] = 'Once upon a time in China';  \n$movie[4]\
    \ = 'Replacement Killers';  \n?>\n```\n\n每部电影都分配了一个索引数字，用于检索或修改其值。观察以下代码：\n\n\
    ```php\n<?php  \n$movie[0]=\"Shaolin Monk\";  \n$movie[1]=\"Drunken Master\";\
    \  \n$movie[2]=\"American Ninja\";  \n$movie[3]=\"Once upon a time in China\"\
    ;  \n$movie[4]=\"Replacement Killers\";  \n\necho $movie[3];  \n$movie[3] = \"\
    \ Eastern Condors\";  \necho $movie[3];  \n?>\n```\n输出：\nOnce upon a time in China\n\
    Eastern Condors\n\n如从上面的示例所示，在 `PHP` 中处理相同性质的多个值时，操作数组是非常简单灵活的。此外，上面的数组变量也可以以下代码创建。\n\
    \n```php\n<?php  \n$movie = array(0 => \"Shaolin Monk\",  \n               1 =>\
    \ \"Drunken Master\",  \n               2 => \"American Ninja\",  \n         \
    \      3 => \"Once upon a time in China\",  \n               4 =>\"Replacement\
    \ Killers\" );  \necho $movie[4];  \n?>\n```\n输出：Replacement Killers\n\n## PHP\
    \ 关联数组\n\n关联数组与索引数组的区别在于，关联数组使用描述性名称作为 `id` 键（key）。下面是在 `php` 中创建关联数组的语法格式。\n\n\
    ```php\n<?php  \n$variable_name['key_name'] = value;  \n$variable_name = array('key_name'\
    \ => value);  \n?>\n```\n这里，\n- `$variable_name...` 是变量名。\n- `['key_name']` 是元素的访问索引数字。\n\
    - `value` 是分配给数组元素的值。\n\n假设我们有一组人，并想要将每个人的性别分配给他们的名字。我们可以使用关联数组来实现。下面的代码可以帮助我们完成操作。\n\
    \n```php\n<?php  \n$persons = array(\"Mary\" => \"Female\", \"John\" => \"Male\"\
    , \"Mirriam\" => \"Female\");  \nprint_r($persons);  \necho \"\";  \necho \"Mary\
    \ is a \" . $persons[\"Mary\"];  \n?>\n```\n\n## PHP 数组函数\n\n### count 函数\n\n\
    `count` 函数用于统计 `php` 数组包含的元素数量。下面的代码显示了实现。\n\n```php\n<?php  \n$lecturers = array(\"\
    Mr. Jones\", \"Mr. Banda\", \"Mrs. Smith\");  \necho count($lecturers);  \n?>\n\
    ```\n输出：3\n\n### is_array 函数\n\n`is_array` 函数用于判断变量是否为数组。现在来看一个示例。\n\n```php\n\
    <?php  \n$lecturers = array(\"Mr. Jones\", \"Mr. Banda\", \"Mrs. Smith\");  \n\
    echo is_array($lecturers);  \n?>\n```\n\n### sort 函数\n\n`sort` 函数用于排序数组。如果值是字母数字，它将按字母顺序排序。如果值是数值，它将按升序排序。接下来的示例：\n\
    \n```php\n<?php  \n$persons = array(\"Mary\" => \"Female\", \"John\" => \"Male\"\
    , \"Mirriam\" => \"Female\");  \nsort($persons);  \nprint_r($persons);  \n?>\n\
    ```\n\n### ksort 函数\n\n`ksort` 函数用于按键对数组排序。接下来的示例：\n\n```php\n<?php  \n$persons\
    \ = array(\"Mary\" => \"Female\", \"John\" => \"Male\", \"Mirriam\" => \"Female\"\
    );  \nksort($persons);  \nprint_r($persons);  \n?>\n```\n\n### asort 函数\n\n`asort`\
    \ 函数用于按值对数组排序。接下来的示例：\n\n```php\n<?php  \n$persons = array(\"Mary\" => \"Female\"\
    , \"John\" => \"Male\", \"Mirriam\" => \"Female\");  \nasort($persons);  \nprint_r($persons);\
    \  \n?>\n```\n\n### 为什么要使用数组？\n\n- 数组有助于分组相关信息。\n- 数组有助于编写整洁的代码。\n- 数组可以扩展。\n\n\
    # 第 5 章 PHP 控制结构\n\n## If else, Switch Case\n\n什么是控制结构？代码执行可以如下所示：\n\n- **顺序**：按照编写顺序执行所有代码。\n\
    - **决策**：在给定选项的情况下进行选择。代码执行取决于条件。\n\n控制结构是根据值决定程序执行路径的代码块。现在来看 PHP 支持的一些控制结构。\n\
    \n### If Else\n\n`if... then... else` 是简单的控制结构。你有一段仅在条件为真时执行的代码。`if... then...\
    \ else` 的语法如下：\n\n```php\nif (condition is true) { \nblock one \nelse \nblock\
    \ two \n}\n```\n这里，\n- `if (condition is true)` 是控制结构。\n- `block one` 是条件为真时执行的代码。\n\
    - `{...else}` 是条件为假时的备选。\n- `block two` 是条件为假时执行的代码块。\n\n工作原理：下面的代码使用 `if... then...\
    \ else` 来确定两个数字之间的较大值。\n\n```php\n<?php  \n$first_number = 7;  \n$second_number\
    \ = 21;  \n\nif ($first_number > $second_number){  \n  echo \"$first_number is\
    \ greater than $second_number\";  \n}else{\n  echo \"$second_number is greater\
    \ than $first_number\";  \n}  \n?>\n```\n输出：21 is greater than 7\n\n### Switch\
    \ Case\n\n`Switch... case` 类似于 `if then... else` 控制结构。它根据条件的值只执行单个代码块。如果没有满足任何条件，则执行\
    \ `default` 代码块。它具有以下基本语法：\n\n```php\nswitch(condition){\n  case value:  \n  \
    \  //要执行的代码块\n    break;  \n  case value2:  \n    //要执行的代码块\n    break;  \n  default:\
    \  \n    // 默认块代码\n    break;  \n}\n```\n\n"
- fmt: "\n## Switch Structure\n\n?> HERE, \n● `switch(…){…}` is the control structure\
    \ block code \n● `case value: case…` are the blocks of code to be executed depending\
    \ on the value of the condition \n● `default:` is the block of code to be executed\
    \ when no value matches with the condition\n\n### How it works\nThe flow chart\
    \ shown below illustrates how the `switch` control structure works ![](rsrc2F1.jpg)\n\
    \n## PHP Loop: For, ForEach, While, Do While\n\n[Example]\nA Loop is an Iterative\
    \ Control Structure that involves executing the same number of code a number of\
    \ times until a certain condition is met.\n\n### PHP For Loop\nThe above code\
    \ outputs “21 is greater than 7”\n\n#### For loops\n`for...` loops execute the\
    \ block of code a specified number of times. There are basically two types of\
    \ for loops;\n● `for`\n● `for… each.`\n\nLet’s now look at them separately.\n\n\
    #### For loop\nIt has the following basic syntax:\n```php\n<?php\nfor (initialize;\
    \ condition; increment){\n  //code to be executed\n}\n?>\n```\n?> HERE,\n● `for…{…}`\
    \ is the loop block \n● `initialize` usually an integer; it is used to set the\
    \ counter’s initial value. \n● `condition` the condition that is evaluated for\
    \ each php execution. If it evaluates to true then execution of the `for...` loop\
    \ is terminated. If it evaluates to false, the execution of the `for...` loop\
    \ continues. \n● `increment` is used to increment the initial value of counter\
    \ integer.\n\n### How it works\nThe flowchart shown below illustrates how `for`\
    \ loop in `php` works ![](rsrc2FS.jpg)\n\n### How to code\nThe code below uses\
    \ the `for… loop` to print values of multiplying 10 by 0 through to 10:\n```php\n\
    <?php\nfor ($i = 0; $i < 10; $i++){\n  $product = 10 * $i;\n  echo \"The product\
    \ of 10 * $i is $product <br/>\";\n}\n?>\n```\nOutput:\nThe product of 10 x 0\
    \ is 0\nThe product of 10 x 1 is 10\nThe product of 10 x 2 is 20\nThe product\
    \ of 10 x 3 is 30\nThe product of 10 x 4 is 40\nThe product of 10 x 5 is 50\n\
    The product of 10 x 6 is 60\nThe product of 10 x 7 is 70\nThe product of 10 x\
    \ 8 is 80\nThe product of 10 x 9 is 90\n\n### PHP For Each loop\nThe `php foreach`\
    \ loop is used to iterate through array values. It has the following basic syntax:\n\
    ```php\n<?php\nforeach($array_variable as $array_value){\n  // block of code\n\
    }\n?>\n```\n?> HERE,\n● `foreach(…){…}` is the loop block \n● `$array_data` is\
    \ the array to be looped \n● `$array_value` is the temporary variable that holds\
    \ the current item \n● `block of code`\n\n### How it works\nThe flowchart shown\
    \ below illustrates how `foreach` loop works ![](src2GK.jpg)\n\n## While Loop\n\
    \nWhile Loop\nThey are used to execute a block of code until a condition is satisfied.\n\
    \n### When to use while loops\n● While loops are used to read records from a database\
    \ query.\n\n### Types of while loops\n● `do… while` - executes the block of code\
    \ at least once before the condition\n● `while…` - checks the condition first.\
    \ If it evaluates to true, the block of code is executed as long as the condition.\
    \ If it evaluates to false, execution is terminated.\n\n#### While loop\nIt has\
    \ the following syntax:\n```php\n<?php\nwhile (condition){\n  // block of code\
    \ to be executed\n}\n?>\n```\n?> HERE,\n● `while(…){…}` is the loop block \n●\
    \ `condition` is the condition to be evaluated by the while loop \n● `block of\
    \ code`\n\n### How it works\nThe flowchart shown below illustrates how while loop\
    \ works ![](src2HF.jpg)\n\n### PHP Do While\nThe difference between `while… loop`\
    \ and `do… while loop` is `do… while` is executed-least once before the condition\
    \ is evaluated.\n\nLet’s now look at the basic syntax of `do… while loop`:\n```php\n\
    <?php\ndo{\n  // block of code to be executed\n} while (condition);\n?>\n```\n\
    ?> HERE,\n● `do{…} while(…)` is the loop block \n● `condition` is the condition\
    \ to be evaluated by the while loop \n● `block of code`\n\n### How it works\n\
    The flow chart shown below illustrates how `while… loop works ![](src2J5.jpg)\n\
    \n## CHAPTER 6 PHP String Functions: substr, strlen, strtolower, explode, strpos,\
    \ str_replace\n\n### What is a string?\nA string is a collection of characters.\
    \ String is one of the data types supported by PHP. The string variables can contain\
    \ alphanumeric characters. Strings are created when:\n● You declare a variable\
    \ and assign string characters to it\n● You can directly use them with `echo`\
    \ statement\n● Strings are language construct, it helps capture words.\n\nLearning\
    \ how strings work in PHP and how to manipulate them will make you a very effective\
    \ and productive developer.\n\n### PHP Create strings\nLet’s now look at the four\
    \ different ways of creating strings.\n\n#### Creating Strings\n**Using Single\
    \ quotes:** The simplest way to create a string is to use single quotes. Let’s\
    \ look at an example that creates a simple string in PHP.\n```php\n<?php\nvar_dump(\"\
    You need to be logged in to view this page\");\n?>\n```\nOutput: `string(42) \"\
    You need to be logged in to view this page\"`\n\n**Escaping single quotes:** If\
    \ the single quote is part of the string value, it can be escaped using the backslash.\
    \ The code below illustrates how to escape a single quote.\n```php\n<?php\necho\
    \ \"I \\\\'ll be back after 20 minutes\";\n?>\n```"
