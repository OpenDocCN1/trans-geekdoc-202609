  trans: "\n\n`?> Output: 9223372036854775807`\n\n● **浮点数** – 小进制数字，例如 `3.14`。它们也被称为双精度或实数。浮点数的最大值取决于平台。浮点数大于整数。\n\
    ● **字符字符串** – 例如 `Hello World`\n● **布尔值** – 例如 `True` 或 `false`。\n\n## PHP 变量\n\
    变量是赋值给在运行时存储数据的内存位置的名称。变量的作用域决定了它的可见性。`Php` 全局变量可以被应用程序中的所有脚本访问。局部变量仅对定义它的脚本可见。将变量想象成一个装有水的杯子。你可以向杯子里加水、把水全部喝光、重新装水等。变量也是如此。变量用于存储数据并在需要时提供所存储的数据。与其它编程语言一样，PHP\
    \ 也支持变量。现在让我们来看一下在 PHP 中创建变量时遵循的规则。\n\n● 所有变量名必须以美元符号 `$`开头，例如 `$` 后跟一个字母或下划线。\n\
    ![Learn about PHP Variable, Operators and Data types](img/rsrc1UT.jpg)\n● 变量名大小写敏感；这意味着\
    \ `$my_var` 与 `$MY_VAR` 不同。\n![Learn about PHP Variable, Operators and Data types](img/rsrc1V0.jpg)\n\
    ● 所有变量名必须以字母开头，后跟其他字符，例如 `$my_var1`。 `$1my_var` 不是合法的变量名。\n![Learn about PHP Variable,\
    \ Operators and Data types](img/rsrc1V6.jpg)\n● 变量名不能包含任何空格，“`$first name`”不是合法的名称。你可以使用下划线代替空格，例如\
    \ `$first_name`。你不能使用美元符号或减号字符来分隔变量名。\n![Learn about PHP Variable, Operators and\
    \ Data types](img/rsrc1VC.jpg)\n\n现在让我们来看 PHP 如何根据所提供数据的属性来确定数据类型。\n\n```php\n\
    <?php  \n$my_var = 1;  \necho $my_var;  \n?>\n```\n`?> Output: 1`\n\n### 浮点数\n\
    ```php\n<?php  \n$my_var = 3.14;  \necho $my_var;  \n?>\n```\n`?> Output: 3.14`\n\
    \n### 字符字符串\n```php\n<?php  \n$my_var =\"Hypertext Pre Processor\";  \necho $my_var;\
    \  \n?>\n```\n`?> Output: Hypertext Pre Processor`\n\n## 变量的使用\n变量有助于将数据与程序算法分离。同一个算法可以用于不同的输入数据值。例如，假设你正在开发一个将两个数字相加的计算器程序，你可以创建两个变量来接收这些数字，然后在执行加法的表达式中使用这些变量名。\n\
    \n## 变量类型转换\n在 C# 等语言中使用对变量进行算术运算，需要变量具有相同的数据类型。类型转换是将变量或值转换为所需的数据类型。在执行需要变量具有相同数据类型的算术运算时，这非常有用。PHP\
    \ 中的类型转换是由解释器完成的。在 C# 等其他语言中，你必须转换变量。PHP 也允许你转换数据类型。这被称为显式转换。\n\n```php\n<?php\
    \  \n$a = 1;  \n$b = 1.5;  \n$c = $a + $b;  \n$c = $a + (int) $b;  \necho $c;\
    \  \n?>\n```\n`?> Output: 2`\n上述代码输出 2\n\n`var_dump` 函数用于确定数据类型。下面的代码演示了如何使用 `var_dump`\
    \ 函数。\n\n```php\n<?php  \n$a = 1;  \nvar_dump($a);  \n$b = 1.5;  \nvar_dump($b);\
    \  \n$c = \"I Love PHP\";  \nvar_dump($c);  \n$d = true;  \nvar_dump($d);  \n\
    ?>\n```\n`?> Output: int(1) float(1.5) string(10) \"I Love PHP\" bool(true)`\n\
    \n## PHP 常量\n定义常量 - 常量是一个运行时无法更改值的变量。假设我们正在开发一个使用 `PI` 值 `3.14` 的程序，我们可以使用常量来存储它的值。现在让我们来看一个定义常量的示例。\n\
    \n```php\ndefine('PI',3.14); // 创建一个值为 3.14 的常量\n```\n一旦你定义 `PI` 为 `3.14`，编写下面的代码将产生错误：\n\
    ```php\nPI = 4; // PI 已定义为常量，因此不允许赋值。\n```\n\n## PHP 运算符\n### 算术运算符\n算术运算符用于对数值数据进行算术运算。连接运算符也作用于字符串值。PHP\
    \ 支持以下运算符。\n\n| 运算符 | 名称 | 描述 | 示例 | 输出 |\n| --- | --- | --- | --- | --- |\n|\
    \ `+` | 加法 | x 和 y 的和 | `1 + 1;` | `2` |\n| `-` | 减法 | x 和 y 的差 | `1 – 1;` | `0`\
    \ |\n| `*` | 乘法 | x 和 y 的积 | `1 * 1;` | `1` |\n| `/` | 除法 | x 和 y 的商 | `1 / 1;`\
    \ | `1` |\n| `%` | 取模 | x 除 y 的余数 | `1 % 1;` | `0` |\n| `**` | 幂 | x 的次方 | `2\
    \ ** 3;` | `8` |\n\n### 赋值运算符\n赋值运算符用于向变量赋值。它们也可以与算术运算符结合使用。\n\n| 运算符 | 名称 | 描述\
    \ | 示例 | 输出 |\n| --- | --- | --- | --- | --- |\n| `=` | 赋值 | 将值赋予 x | `x = 5;`\
    \ | `5` |\n| `+=` | 加法 | x 增加 | `x += 1;` | `6` |\n| `-=` | 减法 | 从 x 中减去 | `x\
    \ -= 2;` | `3` |\n| `*=` | 乘法 | x 乘以 | `x *= 3;` | `9` |\n| `/=` | 除法 | x 除以 |\
    \ `x /= 2;` | `2` |\n| `%=` | 取模 | x 对 y 的余数 | `x %= 2;` | `1` |\n\n### 比较运算符\n\
    比较运算符用于比较值和数据类型。\n\n| 运算符 | 名称 | 描述 | 示例 | 输出 |\n| --- | --- | --- | --- | ---\
    \ |\n| `==` | 等于 | 比较 x 和 y，如果相等则返回真 | `1 == \"1\";` | `1` |\n| `===` | 恒等 | 同时比较值和数据类型\
    \ | `1 === \"1\";` | `0` |\n| `!=`, `<>` | 不等于 | 比较 x 和 y，如果不相等则返回真 | `2 != 1;`\
    \ | `1` |\n| `>` | 大于 | 比较 x 和 y，如果 x 大于 y 则返回真 | `3 > 1;` | `1` |\n| `<` | 小于\
    \ | 比较 x 和 y，如果 x 小于 y 则返回真 | `2 < 1;` | `0` |\n| `>=` | 大于等于 | 比较 x 和 y，如果 x\
    \ 大于等于 y 则返回真 | `1 >=1` | `1` |\n| `<=` | 小于等于 | 比较 x 和 y，如果 x 小于等于 y 则返回真 | `8\
    \ <= 6` | `0` |\n\n### 逻辑运算符\n在使用逻辑运算符时，任何大于或小于零 (0) 的数字均求值为真。零 (0) 求值为假。\n\n\
    | 运算符 | 名称 | 描述 | 示例 | 输出 |\n| --- | --- | --- | --- | --- |\n| `and`, `&&` |\
    \ 与 | 如果 x 和 y 都为真则返回真 | `1 and 4;True&& False;` | `1` 或 `0` |\n| `or`, `||` |\
    \ 或 | 如果 x 或 y 只要有一个为真则返回真 | `6 or 9;0 || 0;` | `1` 或 `0` |\n| `xor` | 异或 | 如果仅\
    \ x 为真或仅 y 为真则返回真 | `1 xor 1;1 xor 0;` | `0` 或 `1` |\n| `!` | 非 | 如果 x 为假则返回真，如果\
    \ x 为真则返回假 | `!0;` | `1` |\n"
- fmt: "\n- `PHP` is a loosely typed language.\n- Variables are memory locations used\
    \ to store data.\n- The value of constants cannot be changed at runtime.\n- Type\
    \ casting is used to convert a value or variable into a desired data type.\n-\
    \ Arithmetic operators are used to manipulate numeric data.\n- Assignment operators\
    \ are used to assign data to variables.\n- Comparison operators are used to compare\
    \ variables or values.\n- Logical operators are used to compare conditions or\
    \ values.\n\n# CHAPTER 4 PHP Array: Associative, Multidimensional\n\nA `PHP` `array`\
    \ is a variable that stores more than one piece of related data in a single variable.\
    \ Think of an array as a box of chocolates with slots inside. The box represents\
    \ the array itself while the spaces containing chocolates represent the values\
    \ stored in the arrays.\n\n## Numeric Arrays\n\nNumeric arrays use number as access\
    \ keys. An `access key` is a reference to a memory slot in an array variable.\
    \ The `access key` is used whenever we want to read or assign a new value an array\
    \ element. Below is the syntax for creating numeric array in `php`.\n\n```php\n\
    <?php  \n$variable_name[n] = value;  \n?> \nOr\n```php\n<?php  \n$variable_name\
    \ = array(n => value, …);  \n?>\n```\nHERE,\n- `$variable_name...` is the name\
    \ of the variable.\n- `[n]` is the access index number of the element.\n- `value`\
    \ is the value assigned to the array element.\n\nLet’s now look at an example\
    \ of a numeric array. Suppose we have 5 movies that we want to store in array\
    \ variables. We can use the example shown below to do that.\n\n```php\n<?php \
    \ \n$movie[0] = 'Shaolin Monk';  \n$movie[1] = 'Drunken Master';  \n$movie[2]\
    \ = 'American Ninja';  \n$movie[3] = 'Once upon a time in China';  \n$movie[4]\
    \ = 'Replacement Killers';  \n?>\n```\n\nEach movie is given an index number that\
    \ is used to retrieve or modify its value. Observe the following code:\n\n```php\n\
    <?php  \n$movie[0]=\"Shaolin Monk\";  \n$movie[1]=\"Drunken Master\";  \n$movie[2]=\"\
    American Ninja\";  \n$movie[3]=\"Once upon a time in China\";  \n$movie[4]=\"\
    Replacement Killers\";  \n\necho $movie[3];  \n$movie[3] = \" Eastern Condors\"\
    ;  \necho $movie[3];  \n?>\n```\nOutput:\nOnce upon a time in China\nEastern Condors\n\
    \nAs you can see from the above examples, working with arrays in `PHP` when dealing\
    \ with multiple values of the same nature is very easy and flexible. Alternatively,\
    \ the above array variables can also be created using the following code.\n\n\
    ```php\n<?php  \n$movie = array(0 => \"Shaolin Monk\",  \n               1 =>\
    \ \"Drunken Master\",  \n               2 => \"American Ninja\",  \n         \
    \      3 => \"Once upon a time in China\",  \n               4 =>\"Replacement\
    \ Killers\" );  \necho $movie[4];  \n?>\n```\nOutput: Replacement Killers\n\n\
    ## PHP Associative Array\n\nAssociative array differ from numeric array in the\
    \ sense that associative arrays use descriptive names for `id` keys. Below is\
    \ the syntax for creating associative array in `php`.\n\n```php\n<?php  \n$variable_name['key_name']\
    \ = value;  \n$variable_name = array('key_name' => value);  \n?>\n```\nHERE,\n\
    - `$variable_name...` is the name of the variable.\n- `['key_name']` is the access\
    \ index number of the element.\n- `value` is the value assigned to the array element.\n\
    \nLet’s suppose that we have a group of persons, and we want to assign the gender\
    \ of each person against their names. We can use an associative array to do that.\
    \ The code below helps us to do that.\n\n```php\n<?php  \n$persons = array(\"\
    Mary\" => \"Female\", \"John\" => \"Male\", \"Mirriam\" => \"Female\");  \nprint_r($persons);\
    \  \necho \"\";  \necho \"Mary is a \" . $persons[\"Mary\"];  \n?>\n```\n\n##\
    \ PHP Array Functions\n\n### Count function\n\nThe `count` function is used to\
    \ count the number of elements that an `php` array contains. The code below shows\
    \ the implementation.\n\n```php\n<?php  \n$lecturers = array(\"Mr. Jones\", \"\
    Mr. Banda\", \"Mrs. Smith\");  \necho count($lecturers);  \n?>\n```\nOutput: 3\n\
    \n### is_array function\n\nThe `is_array` function is used to determine if a variable\
    \ is an array or not. Let’s now look at an example.\n\n```php\n<?php  \n$lecturers\
    \ = array(\"Mr. Jones\", \"Mr. Banda\", \"Mrs. Smith\");  \necho is_array($lecturers);\
    \  \n?>\n```\n\n### sort function\n\nThe `sort` function is used to sort arrays.\
    \ If the values are alphanumeric, it sorts them in alphabetical order. If the\
    \ values are numeric, it sorts them in ascending order. The following example:\n\
    \n```php\n<?php  \n$persons = array(\"Mary\" => \"Female\", \"John\" => \"Male\"\
    , \"Mirriam\" => \"Female\");  \nsort($persons);  \nprint_r($persons);  \n?>\n\
    ```\n\n### ksort function\n\nThe `ksort` function is used to sort the array by\
    \ key. The following example:\n\n```php\n<?php  \n$persons = array(\"Mary\" =>\
    \ \"Female\", \"John\" => \"Male\", \"Mirriam\" => \"Female\");  \nksort($persons);\
    \  \nprint_r($persons);  \n?>\n```\n\n### asort function\n\nThe `asort` function\
    \ is used to sort the array by values. The following example:\n\n```php\n<?php\
    \  \n$persons = array(\"Mary\" => \"Female\", \"John\" => \"Male\", \"Mirriam\"\
    \ => \"Female\");  \nasort($persons);  \nprint_r($persons);  \n?>\n```\n\n###\
    \ Why use arrays?\n\n- Arrays help group related information such as details.\n\
    - Arrays help write cleaner code.\n- Arrays can be stretched.\n\n# CHAPTER 5 PHP\
    \ Control Structures\n\n## If else, Switch Case\n\nWhat is a control structure?\
    \ Code execution can be grouped as shown below:\n\n- **Sequential**: this one\
    \ involves executing all the codes in the order in which they have been written.\n\
    - **Decision**: this one involves making a choice given a number of options. The\
    \ code executed depends on the condition.\n\nA control structure is a block of\
    \ code that decides the execution path of a program depending on the value of.\
    \ Let’s now look at some of the control structures that `PHP` supports.\n\n###\
    \ If Else\n\n`if... then... else` is the simplest control structure. You have\
    \ a block of code that should be executed only if a certain condition is true.\
    \ The syntax for `if... then... else` is:\n\n```php\nif (condition is true) {\
    \ \nblock one \nelse \nblock two \n}\n```\nHERE,\n- `if (condition is true)` is\
    \ the control structure.\n- `block one` is the code to be executed if the condition\
    \ is true.\n- `{...else}` is the fallback if the condition is false.\n- `block\
    \ two` is the block of code executed if the condition is false.\n\nHow it works:\
    \ The code below uses `if... then... else` to determine the larger value between\
    \ two numbers.\n\n```php\n<?php  \n$first_number = 7;  \n$second_number = 21;\
    \  \n\nif ($first_number > $second_number){  \n  echo \"$first_number is greater\
    \ than $second_number\";  \n}else{\n  echo \"$second_number is greater than $first_number\"\
    ;  \n}  \n?>\n```\nOutput: 21 is greater than 7\n\n### Switch Case\n\n`Switch...\
    \ case` is similar to the `if then... else` control structure. It only executes\
    \ a single block of code depending on the value of the condition. If no condition\
    \ has been met then the `default` block of code is executed. It has the following\
    \ basic syntax:\n\n```php\nswitch(condition){\n  case value:  \n    //block of\
    \ code to be executed  \n    break;  \n  case value2:  \n    //block of code to\
    \ be executed  \n    break;  \n  default:  \n    //default block code  \n    break;\
    \  \n}\n```\n"
