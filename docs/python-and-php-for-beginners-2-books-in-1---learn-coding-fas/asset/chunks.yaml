    \ system that implements the network model. ●         Relational DBMS \\- this\
    \ type of DBMS defines database relationships in form of tables, also known as\
    \ relations. Unlike network DBMS, RDBMS does not support many to many relationships.Relational\
    \ DBMS usually have pre-defined data types that they can support. This is the\
    \ most popular DBMS type in the market. Examples of relational database management\
    \ systems include MySQL, Oracle, and Microsoft SQL Server database. ●        \
    \ Object Oriented Relation DBMS \\- this type supports storage of new data types.\
    \ The data to be stored is in form of objects. The objects to be stored in the\
    \ database have attributes (i.e. gender, ager) and methods that define what to\
    \ do with the data. PostgreSQL is an example of an object oriented relational\
    \ DBMS What is SQL? ●        Structured Query language (SQL) pronounced as \"\
    S-Q-L\" or sometimes as \"See-Quel\"is actually the standard language for dealing\
    \ with Relational Databases. ●         SQL programming can be effectively used\
    \ to insert, search, update, delete database records. ●         That doesn't mean\
    \ SQL cannot do things beyond that. ●        In fact it can do lot of things including,\
    \ but not limited to, optimizing and maintenance of databases. ●        Relational\
    \ databases like MySQL Database, Oracle, Ms SQL server, Sybase, etc uses SQL !\
    \ ●        SQL syntaxes used in these databases are almost similar, except the\
    \ fact that some are using few different syntaxes and even proprietary SQL syntaxes.\
    \ ●         SQL Example ●         SELECT \\* FROM Members WHERE Age > 30 Why use\
    \ MySQL? There are a number of relational database management systems on the market.\
    \ Examples of relational databases include Microsoft SQL Server, Microsoft Access,\
    \ Oracle, DB2 etc. One may ask why we would choose MySQL over the other database\
    \ management systems. MySQL workbench - SQL development tool Structured Query\
    \ Language (SQL) allows us to manipulate our relational databases. SQL is at the\
    \ heart of all relational databases. ●         MySQLworkbench, has built in SQL\
    \ visual editor. ●        The Visual SQL editor allows developers to build, edit\
    \ and run queries against MySQL server databases. It has utilities for viewing\
    \ data and exporting it. ●         Its syntax color highlighters help developers\
    \ easily write and debug SQL statements. ●         Multiple queries can be run\
    \ and results automatically displayed in different tabs. ●        The queries\
    \ are also saved in the history panel for later retrieval and running. MySQL workbench\
    \ - Administration tool Server administration plays a critical role in securing\
    \ the data of the company. The major issues concerning server administration are\
    \ users' management, server configuration, server logs and many more. Workbench\
    \ MySQL has the following features that simplify the process of MySQL server administration;\
    \ ●        User administration - visual utility for managing users that lets database\
    \ administrators easily add new and remove existing users if need arises, grant\
    \ and drop privileges and view user profiles. ●        Server configuration -\
    \ allows for advanced configuration of the server and fine tuning for optimal\
    \ performance. ●        Database backup and restorations - visual tool for exporting/importing\
    \ MySQL dump files. MySQL dump files contain SQL scripts for creating databases,\
    \ tables, views, stored procedures and insertion of data. ●         Server logs\
    \ - visual tool for viewing MySQL server logs. The logs include error logs, binary\
    \ logs and InnodDB logs. These logs come in handy when performing diagnosis on\
    \ the server. The figure shown below shows the modeling window for MySQL Workbench\
    \ . \n\nCHAPTER 9 Database Design Database Design is a collection of processes\
    \ that facilitate the designing, development, implementation and maintenance of\
    \ enterprise data management systems It helps produce  database systems \n\n1.\
    \  That meet the requirements of the users\n\n2.  Have high performance."
