    # CHAPTER 5 Python Operators


    The operator can be defined as a symbol which is responsible for a particular
    operation between two operands. Operators are the pillars of a program on which
    the logic is built in a particular programming language. Python provides a variety
    of operators described as follows:

    - Arithmetic operators

    - Comparison operators

    - Assignment Operators

    - Logical Operators

    - Bitwise Operators

    - Membership Operators

    - Identity Operators


    ## Arithmetic operators


    Arithmetic operators are used to perform arithmetic operations between two operands.
    It includes `+` (addition), `-` (subtraction), `*` (multiplication), `/` (divide),
    `%` (reminder), `//` (floor division), and `**` (exponent). Consider the following
    table for a detailed explanation of arithmetic operators.


    | Operator | Description |

    | :--- | :--- |

    | `+` (Addition) | It is used to add two operands. For example, if `a = 20`, `b
    = 10` => `a+b = 30` |

    | `-` (Subtraction) | It is used to subtract the second operand from the first
    operand. If the first operand is less than the second operand, the value result
    negative. For example, if `a = 20`, `b = 10` => `a - b = 10` |

    | `/` (divide) | It returns the quotient after dividing the first operand by the
    second operand. For example, if `a = 20`, `b = 10` => `a/b = 2` |

    | `*` (Multiplication) | It is used to multiply one operand with the other. For
    example, if `a = 20`, `b = 10` => `a * b = 200` |

    | `%` (reminder) | It returns the reminder after dividing the first operand by
    the second operand. For example, if `a = 20`, `b = 10` => `a%b = 0` |

    | `**` (Exponent) | It is an exponent operator represented as it calculates the
    first operand power to second operand. |

    | `//` (Floor division) | It gives the floor value of the quotient produced by
    dividing the two operands. |


    ## Comparison operators


    Comparison operators are used to comparing the value of the two operands and returns
    boolean true or false accordingly. The comparison operators are described in the
    following table.


    | Operator | Description |

    | :--- | :--- |

    | `==` | If the value of two operands is equal, then the condition becomes true.
    |

    | `!=` | If the value of two operands is not equal then the condition becomes
    true. |

    | `<=` | If the first operand is less than or equal to the second operand, then
    the condition becomes true. |

    | `>=` | If the first operand is greater than or equal to the second operand,
    then the condition becomes true. |

    | `<>` | If the value of two operands is not equal, then the condition becomes
    true. |

    | `>` | If the first operand is greater than the second operand, then the condition
    becomes true. |

    | `<` | If the first operand is less than the second operand, then the condition
    becomes true. |


    ## Python assignment operators


    The assignment operators are used to assign the value of the right expression
    to the left operand. The assignment operators are described in the following table.


    | Operator | Description |

    | :--- | :--- |

    | `=` | It assigns the value of the right expression to the left operand. |

    | `+=` | It increases the value of the left operand by the value of the right
    operand and assign the modified value back to operand. For example, if `a = 10`,
    `b = 20` => `a += b` will be equal to `a = 30`. |

    | `-=` | It decreases the value of the left operand by the value of the right
    operand and assign the modified value back to operand. For example, if `a = 20`,
    `b = 10` => `a -= b` will be equal to `a = 10`. |

    | `*=` | It multiplies the value of the left operand by the value of the right
    operand and assign the modified value back to operand. For example, if `a = 10`,
    `b = 20` => `a *= b` will be equal to `a = 200`. |

    | `%=` | It divides the value of the left operand by the value of the right operand
    and assign the reminder back to operand. For example, if `a = 20`, `b = 10` =>
    `a %= b` will be equal to `a = 0`. |

    | `**=` | It calculates the exponentiation of the left operand to the value of
    the right operand and assign the result back to operand. For example, if `a =
    4`, `b = 2`, `a**= b` will be equal to `a = 16`. |

    | `//=` | It performs floor division of the left operand by the value of the right
    operand and assign the result to operand. For example, if `a = 4`, `b = 3`, `a//=
    b` will be equal to `a = 1`. |


    ## Bitwise operator


    The bitwise operators perform bit by bit operation on the values of the operands.
    For example, if `a = 7` (111) and `b = 6` (110), then:

    - `binary(a)` = 111

    - `binary(b)` = 110

    - `a & b` = 110

    - `a | b` = 111

    - `a ^ b` = 001

    - `~ a` = 100


    | Operator | Description |

    | :--- | :--- |

    | `&` (binary and) | If both the bits at the same place in two operands are 1,
    then 1 is copied to the result. Otherwise, 0 is copied. |

    | `|` (binary or) | The resulting bit will be 0 if both the bits are zero otherwise
    the resulting bit will be 1. |

    | `^` (binary xor) | The resulting bit will be 1 if both the bits are different
    otherwise the resulting bit will be 0. |

    | `~` (negation) | It calculates the negation of each bit of the operand, i.e.,
    if the bit is 0, the resulting bit will be 1 and vice versa. |

    | `<<` (left shift) | The left operand value is moved left by the number of bits
    present in the right operand. |

    | `>>` (right shift) | The left operand is moved right by the number of bits present
    in the right operand. |


    ## Logical Operators


    The logical operators are used primarily in the expression evaluation to make
    a decision. Python supports the following logical operators.


    | Operator | Description |

    | :--- | :--- |

    | `and` | If both the expression are true, then the condition will be true. If
    `a` and `b` are the two expressions, `a → true`, `b → true` => `a and b → true`.
    |

    | `or` | If one of the expressions is true, then the condition will be true. If
    `a` and `b` are the two expressions, `a → true`, `b → false` => `a or b → true`.
    |

    | `not` | If an expression `a` is true then `not(a)` will be false and vice versa.
    |


    ## Membership Operators


    Python membership operators are used to check the membership of value inside a
    data structure. If the value is present in the data structure, then the resulting
    value is true otherwise it returns false.


    | Operator | Description |

    | :--- | :--- |

    | `in` | It is evaluated to be true if the first operand is found in the second
    operand (list, tuple, or dictionary). |

    | `not in` | It is evaluated to be true if the first operand is not found in the
    second operand (list, tuple, or dictionary). |


    ## Identity Operators


    | Operator | Description |

    | :--- | :--- |

    | `is` | It is evaluated to be true if the reference present at both sides point
    to the same object. |

    | `is not` | It is evaluated to be true if the reference present at both side
    do not point to the same object. |


    ## Operator Precedence


    The precedence of the operators is important to find out since it enables us to
    know which operator should be evaluated first. The precedence table of the operators
    in python is given below.


    | Operator | Description |

    | :--- | :--- |

    | `**` | The exponent operator is given priority over all the others used in the
    expression. |

    | `~`, `+`, `-` | The negation, unary plus and minus. |

    | `*`, `/`, `%`, `//` | The multiplication, divide, modules, reminder, and floor
    division. |

    | `+`, `-` | Binary plus and minus. |

    | `>>`, `<<` | Left shift and right shift. |

    | `&` | Binary and. |

    | `^`, `|` | Binary xor and or. |

    | `<=`, `<`, `>=` | Comparison operators (less then, less than equal to, greater
    then, greater than equal to). |

    | `<>`, `==`, `!=` | Equality operators. |

    '
