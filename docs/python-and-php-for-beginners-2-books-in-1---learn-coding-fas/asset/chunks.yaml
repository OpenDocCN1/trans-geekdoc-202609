    # Python 入门教程


    `Python` 是一种简单、易学、强大、高级且面向对象的编程语言。Python 也是一种解释型脚本语言。Guido Van Rossum 被称为 Python
    编程的创始人。Python 是一种通用的、动态、高级且解释型的编程语言。它支持面向对象的编程方法来开发应用程序。它简单易于学习，并提供了许多高级数据结构。Python
    是一种易于学习又强大且多功能的脚本语言，这使其对应用程序开发非常有吸引力。Python 的语法和动态类型结合其解释特性，使其成为脚本和快速应用程序开发的理想语言。Python
    支持多种编程模式，包括面向对象、命令式、函数式或过程化编程风格。Python 并非用于网络编程等特殊领域。这就是为什么它被称为多用途语言，因为它可以用于 Web、企业级、3D
    CAD 等领域。


    ## 第一章：安装 Python


    访问链接 `[`www.python.org/downloads/`](https://www.python.org/downloads/)` 下载最新版本的
    Python。![install 1.jpg](img/rsrc61.jpg)


    双击下载的可执行文件；将打开以下窗口。选择“自定义安装”（Customize installation）并继续。![install 2.jpg](img/rsrc67.jpg)


    现在点击“立即安装”（Install Now）。完成后，你会看到一个显示“安装成功”的屏幕。


    ## 开始使用 PyCharm


    在我们的第一个程序中，我们在 CentOS 上使用了 `gedit` 作为编辑器。在 Windows 上，我们有替代方案，如 `notepad` 或 `notepad++`
    来编辑代码。然而，这些编辑器没有被作 Python 的 IDE，因为它们无法显示与语法相关的建议。JetBrains 提供了最流行且广泛使用的跨平台 IDE
    `PyCharm` 来运行 Python 程序。


    ### 安装 PyCharm


    正如我们已经说过的，PyCharm 是一个跨平台 IDE，因此它可以安装在各种操作系统上。在教程的这一部分，我们将涵盖在 Windows、MacOS、CentOS
    和 Ubuntu 上安装 PyCharm 的过程。


    #### Windows


    在 Windows 上安装 PyCharm 非常简单。要在 Windows 操作系统上安装 PyCharm，请访问链接 `[`www.jetbrains.com/pycharm/download/download-thanks.html?platform=windows`](https://www.jetbrains.com/pycharm/download/download-thanks.html?platform=windows)`
    下载可执行安装程序。双击安装程序（`.exe` 文件），并在每一步点击“下一步”（next）来安装 PyCharm。


    ## Hello World：创建你的第一个 Python 程序


    在上一个教程中，我们完成了 Python 的安装和设置。现在是创建第一个程序了。


    ### 创建第一个程序


    **步骤 1)** 打开 PyCharm 编辑器。你会看到 PyCharm 的介绍界面。要创建一个新项目，点击“创建新项目”（Create New Project）。![](img/rsrc73.jpg)


    **步骤 2)** 你需要选择一个位置。

    1. 你可以选择想要创建项目的位置。如果你不想更改位置，请保持原样，但至少将名称从“untitled”更改为更有意义的名称，例如“FirstProject”。

    2. PyCharm 应该已经找到了你之前安装的 Python 解释器。

    3. 下一步点击“创建”（Create）按钮。


    **步骤 3)** 现在转到“文件”（File）菜单并选择“新建”（New）。接下来，选择“Python 文件”（Python File）。![](img/rsrc7H.jpg)


    **步骤 4)** 弹出一个新窗口。接下来，输入你想要的文件名（这里我们给“HelloWorld”）并点击“确定”（OK）。![](img/rsrc7S.jpg)


    **步骤 5)** 接下来输入一个简单的程序 - `print (‘Hello World!'')`。(rsrc7Z.jpg)


    **步骤 6)** 现在转到“运行”（Run）菜单并选择“运行”（Run）来运行你的程序。![](img/rsrc84.jpg)


    **步骤 7)** 你可以在底部看到程序的输出。


