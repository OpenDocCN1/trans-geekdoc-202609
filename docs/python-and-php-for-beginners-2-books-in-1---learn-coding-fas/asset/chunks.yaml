    def someFunction():\n    # global f\n    f = 'I am learning Python'\n    print(f)\n\
    \nsomeFunction()\nprint(f)\n```\n\n使用关键字 `global` 可以在函数内部引用全局变量。\n\n1. 变量 `\"\
    f\"` 在全局作用范围内，并被赋值为 `101`，该值在输出中被打印。\n2. 使用关键字 `global` 声明变量 `f`。这不是一个局部变量，而是之前声明的同一个全局变量。因此我们打印它的值，输出为\
    \ `101`。\n3. 我们在函数内部更改了 `\"f\"` 的值。一旦函数调用结束，变量 `\"f\"` 的改变就会持续。在第 12 行，当我们再次打印\
    \ `\"f\"` 的值时，它显示的是值 `\"changing global variable\"`。\n\n## Python 2 示例\n```python\n\
    f = 101\nprint f\n\n# 函数中的全局变量与局部变量\ndef someFunction():\n  global f\n  print\
    \ f\n\nf = \"changing global variable\"\nsomeFunction()\nprint f\n```\n\n## Python\
    \ 3 示例\n```python\nf = 101\nprint(f)\n\n# 函数中的全局变量与局部变量\ndef someFunction():\n\
    \  global f\n  print(f)\n\nf = \"changing global variable\"\nsomeFunction()\n\
    print(f)\n```\n\n## 删除变量\n我们也可以使用 `del \"variable name\"` 命令删除变量。在下面的示例中，我们删除了变量\
    \ `f`，当我们尝试打印它时，会得到错误 `\"variable name is not defined\"`，这意味着你已经删除了变量。\n\n```python\n\
    f = 11\nprint(f)\ndel f\nprint(f)\n```\n\n## 总结\n- 变量被视为“信封”或“桶”，在其中可以维护和引用信息。像任何其他编程语言一样，Python\
    \ 也使用变量来存储信息。\n- 变量可以使用任何名称声明，甚至是字母如 `a`、`aa`、`abc` 等。\n- 即使在我们已经声明过一次之后，也可以重新声明。\n\
    - 在 Python 中，我们不能直接将字符串与数字拼接，你需要将它们声明为独立的变量，之后就可以将数字与字符串拼接。\n- 在需要时声明局部变量。\n-\
    \ 当想要在程序的剩余部分使用同一个变量时声明全局变量。\n- 删除变量使用 `del`。\n\n---\n\n# 第 2 章：字符串\n\n到目前，我们讨论了数字作为数据类型。在这一节中，我们将讨论最流行的数据类型：即字符串。字符串可以通过单引号、双引号或三引号包裹字符序列来创建。\n\
    \n考虑以下示例：\n```python\nstr = \"Hi !\"\n```\n在 Python 中，如果使用 `type(str)` 检查 `str`\
    \ 的类型，它将打印 `<class 'str'>`。字符串被视为一个序列。与其他语言一样，字符串的索引从 `0` 开始。例如，字符串 `\"HELLO\"\
    ` 的索引所示。\n\n### 更新字符串\n更新字符串的内容并不容易，因为字符串在 Python 中是不可变的。考虑下面的示例 1：\n```python\n\
    str = \"HELLO\"\nstr[0] = \"h\"\nprint(str)\n```\n输出：\n```\nTraceback (most recent\
    \ call last):\n  File \"12.py\", line 2, in <module>\nTypeError: 'str' object\
    \ does not support item assignment\n```\n然而，在示例 2 中，字符串可以完全赋值为一个内容：\n```python\n\
    str = \"HELLO\"\nprint(str)\nstr = \"hello\"\nprint(str)\n```\n输出：\n```\nHELLO\n\
    hello\n```\n\n## 字符串运算符\n考虑以下示例来理解 Python 运算符在字符串上的实际用途：\n```python\nstr = \"\
    Hello \"\nstr1 = \" world \"\n```\n- **拼接**：`print(str + str1)` 打印 `Hello world\
    \ `。\n- **重复**：`print(str * 3)` 打印 `Hello Hello Hello `。\n- **索引**：`print(str[4])`\
    \ 打印 `o`。\n- **切片**：`print(str[2:4])` 打印 `ll`。\n- **成员测试**：`print('w' in str)`\
    \ 打印 `False`，而 `print('wo' in str1)` 打印 `True`。\n- **格式化**：`print(\"The string\
    \ str : %s \" % str)` 打印 `The string str : Hello `。\n\n---\n\n## 格式化运算符\nPython\
    \ 允许我们使用 C 语言 `printf` 语句中的格式化符。Python 中的格式化符处理方式与 C 相同。Python 提供了一个额外的运算符 `%`，作为格式化符与其值之间的接口。换句话说，我们可以说它将格式化符绑定到值。\n\
    \n考虑以下示例：\n```python\nInteger = 10\nFloat = 1.290\nString = \"Ayush\"\nprint(\"\
    Hi I am Integer ... My value is %d\\nHi I am float ... My value is %f\\nHi I am\
    \ string ... My value is %s\" % (Integer, Float, String))\n```\n**输出：**\n```\n\
    Hi I am Integer ... My value is 10\nHi I am float ... My value is 1.290000\nHi\
    \ I am string ... My value is Ayush\n```\n\n"
- fmt: "\n# CHAPTER 3 Python Tuple\n\nTuple is used to store the sequence of immutable\
    \ python objects. Tuple is similar to lists since the value of the items stored\
    \ in the list can be changed whereas the tuple is immutable and the value of the\
    \ items stored in the tuple can not be changed. A tuple can be written as the\
    \ collection of comma-separated values enclosed with the small brackets. A tuple\
    \ can be defined as follows.\n\n```python\nT1 = (101, \"Ayush\" , 22)\nT2 = (\"\
    Apple\" , \"Banana\" , \"Orange\" )\n```\n\n### Example\n```python\ntuple1 = (10,\
    \ 20, 30, 40, 50, 60)\nprint (tuple1)\ncount = 0\nfor i in tuple1:\n    print\
    \ (\"tuple1[%d] = %d\" %(count, i));\n```\n**Output:**\n```\n(10, 20, 30, 40,\
    \ 50, 60)\ntuple1[0] = 10\ntuple1[1] = 20\ntuple1[2] = 30\ntuple1[3] = 40\ntuple1[4]\
    \ = 50\ntuple1[5] = 60\n```\n\n### Example 2\n```python\ntuple1 = tuple(input(\"\
    Enter the tuple elements ...\" ))\nprint (tuple1)\ncount = 0\nfor i in tuple1:\n\
    \    print (\"tuple1[%d] = %s\" %(count, i));\n```\n**Output:**\n```\nEnter the\
    \ tuple elements ...12345\n('1', '2', '3', '4', '5')\ntuple1[0] = 1\ntuple1[1]\
    \ = 2\ntuple1[2] = 3\ntuple1[3] = 4\ntuple1[4] = 5\n```\n\nHowever, if we try\
    \ to reassign the items of a tuple, we would get an error as the tuple object\
    \ doesn't support the item assignment. An empty tuple can be written as follows.\n\
    \n```python\nT3 = ()\n```\n\nThe tuple having a single value must include a comma\
    \ as given below.\n\n```python\nT4 = (90,)\n```\n\nA tuple is indexed in the same\
    \ way as the lists. The items in the tuple can be accessed by using their specific\
    \ index value. We will see all these aspects of tuple in this section of the tutorial.\n\
    \n### Tuple indexing and splitting\nThe indexing and slicing in tuple are similar\
    \ to lists. The indexing in the tuple starts from 0 and goes to `length(tuple)\
    \ - 1`. The items in the tuple can be accessed by using the slice operator. Python\
    \ also allows us to use the colon operator to access multiple items in the tuple.\
    \ Consider the following image to understand the indexing and slicing in detail.\n\
    \n![Tuple 1.jpg](rsrcGB.jpg)\n\nUnlike lists, the tuple items can not be deleted\
    \ by using the `del` keyword as tuples are immutable. To delete an entire tuple,\
    \ we can use the `del` keyword with the tuple name. Consider the following example.\n\
    \n```python\ntuple1 = (1, 2, 3, 4, 5, 6)\nprint (tuple1)\ndel tuple1[0]\nprint\
    \ (tuple1)\ndel tuple1\nprint (tuple1)\n```\n**Output:**\n```\n(1, 2, 3, 4, 5,\
    \ 6)\nTraceback (most recent call last):\n  File \"tuple.py\", line 4, in <module>\n\
    \    print(tuple1)\nNameError: name 'tuple1' is not defined\n```\n\nLike lists,\
    \ the tuple elements can be accessed in both the directions. The right most element\
    \ (last) of the tuple can be accessed by using the index `-1`. The elements from\
    \ left to right are traversed using the negative indexing. Consider the following\
    \ example.\n\n```python\ntuple1 = (1, 2, 3, 4, 5)\nprint (tuple1[-1])\nprint (tuple1[-4])\n\
    ```\n**Output:** `5 2`\n\n### Where use tuple\nUsing tuple instead of list is\
    \ used in the following scenario.\n\n1. Using tuple instead of list gives us a\
    \ clear idea that tuple data is constant and must not be changed.\n2. Tuple can\
    \ simulate dictionary without keys. Consider the following nested structure which\
    \ can be used as a dictionary.\n```python\n[(101, \"John\" , 22), (102, \"Mike\"\
    \ , 28), (103, \"Dustin\" , 30)]\n```\n3. Tuple can be used as the key inside\
    \ dictionary due to its immutable nature.\n"
