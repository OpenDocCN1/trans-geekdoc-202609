    _exists('my\\_settings.txt'))  \n\n{      \n\n        echo 'file found!';  \n\n\
    }  \n\nelse  \n\n{       \n\n        echo 'my\\_settings.txt does not exist';\
    \  \n\n  }  \n\n?>   Save the above code in a file named file\\_function.php Assuming\
    \ you saved the file in phptuts folder in htdocs, open the URL http://localhost/phptuts/file\\\
    _function.php PHP Try Catch Example: Exception & Error Handling What is an Exception?\
    \ An error is an unexpected program result that cannot be handled by the program\
    \ itself. Errors are resolved by fixing the program. An example of an error would\
    \ be an infinite loop that never stops executing. An exception is unexpected program\
    \ result that can be handled by the program itself. Examples of exception include\
    \ trying to open a file that does not exist. This exception can be handled by\
    \ either creating the file or presenting the user with an option of searching\
    \ for the file. PHP Error handling When an error occurs, depending on your configuration\
    \ settings, PHP displays the error message in the web browser with information\
    \ relating to the error that occurred. PHP offers a number of ways to handle errors.\
    \ We are going to look at three (3) commonly used methods; \n\n1.  Die statements–\
    \ the die function combines the echo and exit function in one. It is very useful\
    \ when we want to output a message and stop the script execution when an error\
    \ occurs.\n\n2.  Custom error handlers – these are user defined functions that\
    \ are called whenever an error occurs.\n\n3.  PHP error reporting – the error\
    \ message depending on your PHP error reporting settings. This method is very\
    \ useful in development environment when you have no idea what caused the error.\
    \ The information displayed can help you debug your application."
