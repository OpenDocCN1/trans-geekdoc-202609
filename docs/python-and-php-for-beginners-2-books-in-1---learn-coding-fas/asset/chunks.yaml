  trans: "\n\n?> 输出: 我将在 20 分钟后回来\n\n# PHP 函数：数值、内置、字符串、日期、用户定义\n\n## 什么是函数？\n函数是执行特定操作的可重用代码段或块。函数在调用时可以返回值，也可以简单地执行操作而不返回任何值。`PHP`\
    \ 拥有 700 多个 `内置` 函数，用于执行不同的任务。\n\n## 为什么使用函数？\n* **更好的代码组织**：函数允许我们我们将执行特定任务的相关代码块组合在一起。\n\
    * **可重用性**：一旦定义，函数就可以在 `PHP` 文件中的多个脚本中调用。这节省了我们在执行如连接数据库等例行任务时重复“造轮子”的时间。\n* **易于维护**：系统的更新只需要在一个地方进行即可。\n\
    \n## 内置函数\n内置函数是存在于 `PHP` 安装包中的函数。这些内置函数使 `PHP` 成为一种非常高效且高产的脚本语言。内置函数可以分为许多类。以下是类别列表。\n\
    \n### 字符串函数\n这些是处理字符串数据的函数，请参考关于字符串的文章获取字符串函数的实现示例。\n\n### 数值函数\n数值函数是返回数值结果的函数。`Numeric\
    \ php function` 可用于格式化数字、返回常量、执行数学计算等。\n\n### 日期函数\n`date` 函数用于将 `Unix` 日期和时间格式化为人类可读的格式。查看\
    \ `PHP` `date` 函数文章获取更多详情。\n\n### 其他函数\n这些包括：\n* **数组**：请查看关于数组的文章示例\n* **文件**：请查看关于文件的文章获取示例\n\
    * **数据库函数**：请查看 `MySQL PHP` 和其他数据库访问方法 v2 文章\n\n## 为什么使用用户定义函数？\n在以下情况下，用户定义函数会非常有用：\n\
    * 你的应用程序中有例行任务，例如向数据库中添加数据\n* 对数据进行验证检查\n* 在系统中对用户进行身份验证等。\n\n这些活动将分布在多个页面中。创建一个所有这些页面都可以调用的函数是使\
    \ `PHP` 成为强大脚本语言的特性之一。\n\n在我们创建第一个用户定义函数之前，让我们先看看创建自己的函数时必须遵循的规则：\n* 函数名必须以字母或下划线开头，但不能以数字开头。\n\
    * 函数名必须是唯一的。\n* 函数名不能包含空格。\n* 使用描述性的函数名被认为是一种良好的实践。\n* 函数还可以选择接受参数并返回值。\n\n现在让我们创建第一个函数。我们将创建一个非常基础的函数，用于说明\
    \ `PHP` 函数的主要组成部分。\n\n```php\n<?php  \n//定义一个显示 hello function 的函数\nfunction add_numbers(){\
    \  \n    echo 1 + 2;  \n}  \nadd_numbers ();  \n?>\n```\n?> 输出: 3\n\n在这里，\n* `function...(){}`\
    \ 是函数块，告诉 `PHP` 你正在定义一个自定义函数。\n* `add_numbers` 是使用函数时将调用的函数名。\n* `()` 可用于向函数传递参数。\n\
    * `echo 'Hello function!';` 是执行的函数代码块。它可以是上述示例之外之外的任何代码。\n\n现在来看一个相当复杂的示例，它接受一个参数并像上面的函数一样显示消息。假设我们想要写一个在屏幕上打印用户函数，我们可以写一个接受用户名的自定义函数。\n\
    \n```php\n<?php  \nfunction display_name($name) {\n    echo \"Hello \" . $name;\
    \  \n}  \ndisplay_name(\"Martin King\");\n?>\n```\n?> 输出: Hello King\n\n在这里，\n\
    * `($name)` 是参数，并初始化为匿名。如果没有向函数传递参数，将导致错误。\n\n现在我们来看一个接受参数并返回值的值的函数。我们将创建一个将千里转换为英里的函数。\n\
    \n```php\n<?php  \nfunction kilometers_to_miles($kilometers) {\n    $miles = 0;\n\
    \    return $miles;  \n}  \necho kilometers_to_miles(100);  \n?>\n```\n?> 输出:\
    \ 62\n\n# 使用 GET 方法的 PHP 表单\n\n## 什么是表单？\n表单是一个包含用户界面项（如输入框、按钮等）的 HTML 标签。表单使用\
    \ `<form>` 标签定义。\n\n## 为什么使用表单？\n* 表单对于开发动态应用程序有用。\n* 表单可编辑数据库中的现有数据。\n* 我们将使用\
    \ HTML 标签来创建表单。\n\n## 示例\n下面的代码创建了一个注册表单：\n\n```html\n<html>\n<head>\n    <title>注册表单</title>\n\
    \    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\">\n\
    </head>\n<body>\n    <h2>注册表单</h2>\n    <form action=\"registration.php\" method=\"\
    POST\">\n        First name: <input type=\"text\" name=\"firstname\"> <br>\n \
    \       Last name: <input type=\"text\" name=\"lastname\"> <br>\n        <input\
    \ type=\"hidden\" name=\"form_submitted\" value=\"1\" />\n        <input type=\"\
    submit\" value=\"Submit\">\n    </form>\n</body>\n</html>\n```\n在网络浏览器中查看上述代码将显示以下表单：\n\
    * `<form>...</form>` 是表单的开始和结束标签。\n* `action=\"registration.php\" method=\"POST\"\
    ` 指定了目标 URL 和提交类型。\n* `First name/Last name:` 是输入框的标签。\n* `<input type=\"text\"\
    >` 是输入框标签。\n* `<br>` 是换行。\n* `<input type=\"hidden\" name=\"form_submitted\" value=\"\
    1\"/>` 是用于检查表单是否提交的隐藏值。\n* `<input type=\"submit\" value=\"Submit\">` 是按钮，点击时会将表单提交到服务器进行处理。\n\
    \n## PHP POST 方法\n这是内置的 `PHP` 超全局数组变量，用于获取通过 HTTP POST 方法提交的值。该数组变量可以从程序中的任何脚本访问；它具有全局作用域。\n\
    \n使用 post 方法的一个良好示例是向服务器提交登录详情。它的语法如下：\n\n```php\n<?php  \n$_POST['variable_name'];\
    \  \n```\n\n"
- fmt: "\n`$_POST[…]` is the PHP array. `'variable_name'` is the URL variable name.\
    \ \n\n### PHP GET method\n`$_GET` is the built in PHP super global array variable\
    \ that is used to get values submitted via HTTP GET method.\n- The array variable\
    \ can be accessed from any script in the program; it has a global scope.\n- This\
    \ method displays the form values in the URL.\n- It’s ideal for search engine\
    \ forms as it allows the users to book mark the results.\n\nIt has the following\
    \ syntax:\n```php\n<?php\n$_GET['variable_name'];\n?>\n```\nHERE, `$_GET[…]` is\
    \ the PHP array. `'variable_name'` is the URL variable name.\n\n# CHAPTER 7 PHP\
    \ File() Function: `file_exists`, `Fopen`, `fwrite`, `Fclose`, `Fgets`, `copy`,\
    \ `unlink`\n\n## What is a File?\nA file is simply a resource for storing information\
    \ on a computer. Files are usually used to store information such as:\n- Configuration\
    \ settings of a program\n- Simple data such as contact names against the phone\
    \ numbers.\n- Images, Pictures, Photos, etc.\n\n## PHP File Formats Support\n\
    PHP file functions support a wide range of file formats that include:\n- `File.txt`\n\
    - `File.log`\n- `File.custom_extension` i.e. `file.xyz`\n- `File.csv`\n- `File.gif`,\
    \ `file.jpg` etc.\n\nFiles provide a permanent cost effective data storage solution\
    \ for simple data compared to databases that require other software and skills\
    \ to manage DBMS systems.\n- You want to store simple data such as server logs\
    \ for later retrieval and analysis.\n- You want to store program settings i.e.\
    \ `program.ini`\n\n## PHP files Functions\nPHP provides a convenient way of working\
    \ with files via its rich collection of built in functions. Operating systems\
    \ such as Windows and MAC OS are not case sensitive while Linux or Unix operating\
    \ systems are case sensitive. Adopting a naming conversion such as lower case\
    \ letters only for file naming is a good practice that ensures maximum cross platform\
    \ compatibility. \n\nLet’s now look at some of the most commonly used PHP file\
    \ functions.\n\n### PHP `file_exists` Function\nThis function is used to determine\
    \ whether a file exists or not.\n- It comes in handy when we want to know if a\
    \ file exists before processing it.\n- You can also use this function when creating\
    \ a new file and you want to ensure that the file does not exist.\n\nThe `file_exists`\
    \ function has the following syntax:\n```php\n<?php\nfile_exists($filename);\n\
    ?>\n```\nHERE, `file_exists()` is the PHP function that returns true if the file\
    \ exists and false if it does not. `$file_name` is the path and name of the file\
    \ to be checked. The code below uses `file_exists` to determine if `settings.txt`\
    \ exists.\n\n```php\n<?php\nif (file_exists('settings.txt')) {\n    echo 'file\
    \ found!';\n} else {\n    echo 'settings.txt does not exist';\n}\n?>\n```\nSave\
    \ the above code in a file named `file_function.php`. Assuming you saved the file\
    \ in `phptuts` folder in htdocs, open the URL http://localhost/phptuts/file_function.php.\n\
    \n# PHP Try Catch Example: Exception & Error Handling\n\n## What is an Exception?\n\
    An error is an unexpected program result that cannot be handled by the program\
    \ itself. Errors are resolved by fixing the program. An example of an error would\
    \ be an infinite loop that never stops executing.\n\nAn exception is unexpected\
    \ program result that can be handled by the program itself. Examples of exception\
    \ include trying to open a file that does not exist. This exception can be handled\
    \ by either creating the file or presenting the user with an option of searching\
    \ for the file.\n\n## PHP Error handling\nWhen an error occurs, depending on your\
    \ configuration settings, PHP displays the error message in the web browser with\
    \ information relating to the error that occurred. PHP offers a number of ways\
    \ to handle errors. We are going to look at three (3) commonly used methods:\n\
    \n1. **Die statements**: the `die` function combines the `echo` and `exit` function\
    \ in one. It is very useful when we want to output a message and stop the script\
    \ execution when an error occurs.\n2. **Custom error handlers**: these are user\
    \ defined functions that are called whenever an error occurs.\n3. **PHP error\
    \ reporting**: the error message depending on your PHP error reporting settings.\
    \ This method is very useful in development environment when you have no idea\
    \ what caused the error. The information displayed can help you debug your application.\n"
