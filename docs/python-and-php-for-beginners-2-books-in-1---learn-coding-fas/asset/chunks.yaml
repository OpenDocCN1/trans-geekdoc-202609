  trans: "\n\n# 第 3 章 Python 元组 (Tuple)\n\n元组用于存储不可变 Python 对象的序列。元组与列表相似，因为列表所存储的项目值可以更改，而元组是不可变的，元组中存储的项目值不能更改。元组可以写成用小括号括起来的逗号分隔值的集合。元组可以如下所示定义：\n\
    \n```python\nT1 = (101, \"Ayush\" , 22)\nT2 = (\"Apple\" , \"Banana\" , \"Orange\"\
    \ )\n```\n\n### 示例\n```python\ntuple1 = (10, 20, 30, 40, 50, 60)\nprint (tuple1)\n\
    count = 0\nfor i in tuple1:\n    print (\"tuple1[%d] = %d\" %(count, i));\n```\n\
    **输出：**\n```\n(10, 20, 30, 40, 50, 60)\ntuple1[0] = 10\ntuple1[1] = 20\ntuple1[2]\
    \ = 30\ntuple1[3] = 40\ntuple1[4] = 50\ntuple1[5] = 60\n```\n\n### 示例 2\n```python\n\
    tuple1 = tuple(input(\"Enter the tuple elements ...\" ))\nprint (tuple1)\ncount\
    \ = 0\nfor i in tuple1:\n    print (\"tuple1[%d] = %s\" %(count, i));\n```\n**输出：**\n\
    ```\nEnter the tuple elements ...12345\n('1', '2', '3', '4', '5')\ntuple1[0] =\
    \ 1\ntuple1[1] = 2\ntuple1[2] = 3\ntuple1[3] = 4\ntuple1[4] = 5\n```\n\n然而，如果我们尝试重新分配元组的项目，我们将得到一个错误，因为元组对象不支持项目赋值。空元组可以如下所示：\n\
    \n```python\nT3 = ()\n```\n\n包含单个值的元组必须包含一个逗号，如下所示：\n\n```python\nT4 = (90,)\n\
    ```\n\n元组的索引方式与列表相同。可以通过特定的索引值访问元组中的项目。我们将在教程的本节中介绍元组的所有方面。\n\n### 元组的索引与分割\n\
    元组中的索引和切片与列表相似。元组的索引从 0 开始到`length(tuple) - 1`。可以使用切片运算符访问元组的项目。Python 还允许我们使用冒号运算符访问元组中的多个项目。请下面的图片以详细了解索引和分割。\n\
    \n![Tuple 1.jpg](img/rsrcGB.jpg)\n\n与列表不同，由于元组是不可变的，不能使用 `del` 关键字删除元组项目。要删除整个元组，可以使用\
    \ `del` 关键字配合元组名称。考虑以下示例：\n\n```python\ntuple1 = (1, 2, 3, 4, 5, 6)\nprint (tuple1)\n\
    del tuple1[0]\nprint (tuple1)\ndel tuple1\nprint (tuple1)\n```\n**输出：**\n```\n\
    (1, 2, 3, 4, 5, 6)\nTraceback (most recent call last):\n  File \"tuple.py\", line\
    \ 4, in <module>\n    print(tuple1)\nNameError: name 'tuple1' is not defined\n\
    ```\n\n与列表一样，元组元素可以从两个方向进行访问。可以使用索引 `-1` 访问元组最右侧（最后一个）的元素。使用负索引可以从左到右遍历元素。考虑以下示例：\n\
    \n```python\ntuple1 = (1, 2, 3, 4, 5)\nprint (tuple1[-1])\nprint (tuple1[-4])\n\
    ```\n**输出：** `5 2`\n\n### 元组的使用场景\n在以下场景中，会使用元组代替列表：\n\n1. 使用元组代替列表给了我们一个明确的思路，即元组数据是常量且不能更改。\n\
    2. 元组可以模拟没有键的字典。考虑下面的嵌套结构，它可以用作字典：\n```python\n[(101, \"John\" , 22), (102, \"\
    Mike\" , 28), (103, \"Dustin\" , 30)]\n```\n3. 由于元组的不可变性，元组可以作为字典内部的键。\n\n"
- fmt: "\n# CHAPTER 4 Python Dictionary\n\nDictionary is used to implement the key-value\
    \ pair in python. The dictionary is the data type in python which can simulate\
    \ the real-life data arrangement where some specific value exists for some particular\
    \ key. In other words, we can say that a dictionary is the collection of key-value\
    \ pairs where the value can be any python object whereas the keys are the immutable\
    \ python object, i.e., Numbers, string or tuple. Dictionary simulates Java hash-map\
    \ in python.\n\n## Creating the dictionary\n\nThe dictionary can be created by\
    \ using multiple key-value pairs enclosed with the small brackets `()` and separated\
    \ by the colon (`:`). The collections of the key-value pairs are enclosed within\
    \ the curly braces `{}`. The syntax to define the dictionary is given below.\n\
    \n`Dict = {\"Name\" : \"Ayush\" ,\"Age\" : 22}` \n\nIn the above dictionary `Dict`,\
    \ The keys `Name`, and `Age` are the string that is an immutable object. Let's\
    \ see an example to create a dictionary and printing its content.\n\n```python\n\
    Employee = {\"Name\" : \"John\" , \"Age\" : 29, \"salary\" :25000,\"Company\"\
    \ :\"GOOGLE\" }\nprint (type(Employee))\nprint (\"printing Employee data ....\
    \ \" )\nprint (Employee)\n```\n\nOutput\n`<class 'dict'>`\nprinting Employee data\
    \ .... {'Age': 29, 'salary': 25000, 'Name': 'John', 'Company': 'GOOGLE'}`\n\n\
    ## Accessing the dictionary values\n\nWe have discussed how the data can be accessed\
    \ in the list and tuple by using the indexing. However, the values can be accessed\
    \ in the dictionary by using the keys as keys are unique in the dictionary. The\
    \ dictionary values can be accessed in the following way.\n\n```python\nEmployee\
    \ = { \"Name \" : \"John \" , \"Age \" : 2 9 , \"salary \" : 2500 0 , \"Company\
    \ \" : \"GOOGLE \" }\nprint (type(Employee))\nprint ( \"printing Employee data\
    \ .... \" )\nprint ( \"Name : %s \" %Employee[\"Name \"]])\nprint ( \"Age : %d\
    \ \" %Employee[\"Age \"]])\nprint ( \"Salary : %d \" %Employee[\"salary \"]])\n\
    print ( \"Company : %s \" %Employee[\"Company \"])\n```\n\nOutput:\n`<class 'dict'>`\n\
    printing Employee data .... Name : John Age : 29 Salary : 25000 Company : GOOGLE\n\
    \nPython provides us with an alternative to use the `get()` method to access the\
    \ dictionary values. It would give the same result as given by the indexing.\n\
    \n## Updating dictionary values\n\nThe dictionary is a mutable data type, and\
    \ its values can be updated by using the specific keys. Let's see an example to\
    \ update the dictionary values.\n\n```python\nEmployee = { \"Name \" : \"John\
    \ \" , \"Age \" : 2 9 , \"salary \" : 2500 0 , \"Company \" : \"GOOGLE \" }\n\
    print (type(Employee))\nprint ( \"printing Employee data .... \" )\nprint (Employee)\n\
    print ( \"Enter the details of the new employee.... \" );\nEmployee[\"Name \"\
    ] = input( \"Name: \" );\nEmployee[\"Age \"] = int(input( \"Age: \"));\nEmployee[\"\
    salary \"] = int(input( \"Salary: \"));\nEmployee[\"Company \"] = input( \"Company:\
    \ \" );\nprint ( \"printing the new data \" );\nprint (Employee)\n```\n\nOutput:\n\
    `<class 'dict'>`\nprinting Employee data .... {'Name': 'John', 'salary': 25000,\
    \ 'Company': 'GOOGLE', 'Age': 29}\nEnter the details of the new employee....\n\
    Name: David\nAge: 19\nSalary: 8900\nCompany: JTP\nprinting the new data {'Name':\
    \ 'David', 'salary': 8900, 'Company': 'JTP', 'Age': 19}\n\n## Deleting elements\
    \ using del keyword\n\nThe items of the dictionary can be deleted using the `del`\
    \ keyword as given below.\n\n```python\nEmployee = { \"Name \" : \"John \" , \"\
    Age \" : 2 9 , \"salary \" : 2500 0 , \"Company \" : \"GOOGLE \" }\nprint (type(Employee))\n\
    print ( \"printing Employee data .... \" )\nprint (Employee)\nprint ( \"Deleting\
    \ some of the employee data \" )\ndel Employee[\"Name \"]\ndel Employee[\"Company\
    \ \"]\nprint ( \"printing the modified information \" )\nprint (Employee)\nprint\
    \ ( \"Deleting the dictionary: \" );\ndel Employee\nprint ( \"Lets to print it\
    \ again \" );\nprint (Employee)\n```\n\nOutput:\n`<class 'dict'>`\nprinting Employee\
    \ data .... {'Age': 29, 'Company': 'GOOGLE', 'Name': 'John', 'salary': 25000}\n\
    Deleting some of the employee data\nmodified information {'Age': 29, 'salary':\
    \ 25000}\nDeleting the dictionary:\nLets to print it again\nTraceback (most recent\
    \ call last):\nFile \"list.py\", line 13, in <module>\nprint(Employee)\nError:\
    \ name 'Employee' is not defined\n\n## Iterating Dictionary\n\nA dictionary can\
    \ be iterated using for loop as given below.\n\n### Example 1: for loop to print\
    \ all the keys of a dictionary\n```python\nEmployee = { \"Name \" : \"John \"\
    \ , \"Age \" : 2 9 , \"salary \" : 2500 0 , \"Company \" : \"GOOGLE \" }\nfor\
    \ x in Employee:\n    print (x);\n```\nOutput:\nName Company salary Age\n\n###\
    \ Example 2: for loop to print all the values of the dictionary\n```python\nEmployee\
    \ = { \"Name \" : \"John \" , \"Age \" : 2 9 , \"salary \" : 2500 0 , \"Company\
    \ \" : \"GOOGLE \" }\nfor x in Employee:\n    print (Employee[x]);\n```\nOutput:\n\
    29 GOOGLE John 25000\n\n### Example 3: for loop to print the values of the dictionary\
    \ using values() method\n```python\nEmployee = { \"Name \" : \"John \" , \"Age\
    \ \" : 2 9 , \"salary \" : 2500 0 , \"Company \" : \"GOOGLE \" }\nfor x in Employee.values():\n\
    \    print (x);\n```\nOutput:\nGOOGLE 25000 John 29\n\n### Example 4: for loop\
    \ to print the items of the dictionary using items() method\n```python\nEmployee\
    \ = { \"Name \" : \"John \" , \"Age \" : 2 9 , \"salary \" : 2500 0 , \"Company\
    \ \" : \"GOOGLE \" }\nfor x in Employee.items():\n    print (x);\n```\nOutput:\n\
    ('Name', 'John') ('Age', 29) ('salary', 25000) ('Company', 'GOOGLE')\n\n## Properties\
    \ of Dictionary keys\n\n1. In the dictionary, we can not store multiple values\
    \ for the same keys. If we pass more than one values for a single key, then the\
    \ value which is last assigned is considered as the value of the key. Consider\
    \ the following example.\n```python\nEmployee = { \"Name \" : \"John \" , \"Age\
    \ \" : 2 9 , \"Salary \" : 2500 0 , \"Company \" : \"GOOGLE \" , \"Name \" : \"\
    Johnn \" }\nfor x,y in Employee.items():\n    print (x,y)\n```\nOutput:\nSalary\
    \ 25000 Company GOOGLE Name Johnn Age 29\n\n2. In python, the key cannot be any\
    \ mutable object. We can use numbers, strings, or tuple as the key but we can\
    \ not use any mutable object like the list as the key in the dictionary. Consider\
    \ the following example.\n```python\nEmployee = { \"Name \" : \"John \" , \"Age\
    \ \" : 2 9 , \"salary \" : 2500 0 , \"Company \" : \"GOOGLE \" , [ 100 , 201 ,\
    \ 301 ]: \"Department ID \" }\nfor x,y in Employee.items():\n    print (x,y)\n\
    ```\nOutput:\nTraceback (most recent call last):\nFile \"list.py\", line 1, in\
    \ Employee\nEmployee = {\"Name\": \"John\", \"Age\": 29, \"salary\":25000,\"Company\"\
    :\"GOOGLE\",[100,201,301]:\"Department ID\"}\nTypeError: unhashable type: 'list'\n"
