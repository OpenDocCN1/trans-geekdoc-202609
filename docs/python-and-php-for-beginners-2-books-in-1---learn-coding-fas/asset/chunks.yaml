    \ typing  with its interpreted nature, makes it an ideal language for scripting\
    \ and rapid application development. Python supports multiple programming pattern\
    \ , including object oriented, imperative and functional or procedural programming\
    \ styles. Python is not intended to work on special area such as web programming.\
    \ That is why it is known as multipurpose  because it can be used with web, enterprise,\
    \ 3D CAD etc. CHAPTER 1 Installing Python Visit the link [https://www.python.org/downloads/](https://www.python.org/downloads/)\
    \  to download the latest release of Python. ![install 1.jpg](rsrc61.jpg)Double-click\
    \ the executable file which is downloaded; the following window will open. Select\
    \ Customize installation and proceed. ![install 2.jpg](rsrc67.jpg)Now click Install\
    \ Now. When it finishes, you see a screen that says the Setup was successful.\
    \ Get Started with PyCharm In our first program, we have used gedit on our CentOS\
    \ as an editor. On Windows, we have an alternative like notepad or notepad++ to\
    \ edit the code. However, these editors are not used as IDE for python since they\
    \ are unable to show the syntax related suggestions. JetBrains provides the most\
    \ popular and a widely used cross-platform IDE  PyChar m  to run the python programs.\
    \ PyCharm installation As we have already stated, PyCharm is a cross-platform\
    \ IDE, and hence it can be installed on a variety of the operating systems. In\
    \ this section of the tutorial, we will cover the installation process of PyCharm\
    \ on Windows, MacOS, CentOS, and Ubuntu. Windows Installing PyCharm on Windows\
    \ is very simple. To install PyCharm on Windows operating system, visit the link [https://www.jetbrains.com/pycharm/download/download-thanks.html?platform=windows](https://www.jetbrains.com/pycharm/download/download-thanks.html?platform=windows)\
    \  to download the executable installer.  Double clic k  the installer (.exe)\
    \ file and install PyCharm by clicking next at each step. Hello World: Create\
    \ your First Python Program In the last tutorial, we completed Python installation\
    \ and setup. It's time to create first program. Creating First Program Step 1)\
    \ Open PyCharm Editor. You see the introductory screen for PyCharm. To create\
    \ a new project, click “Create New Project”. ![](rsrc73.jpg)Step 2)You will need\
    \ select a location. 1.   You can select the location where u want the project\
    \ to be created. If u don’t want to change location than keep it as it is but\
    \ at least change the name from “untitled” to something more meaningful, like\
    \ “FirstProject”. 2.   PyCharm should have found Python interpreter you installed\
    \ earlier. 3.   Next Click “Create” Butto n. Step 3) Now Go up to “File” menu\
    \ and select “New”. Next , select “Python File”. ![](rsrc7H.jpg)Step 4) A new\
    \ pop up is appear. Next type the name of the file you want (Here we give “HelloWorld”)\
    \ and hit “OK”. ![](rsrc7S.jpg)Step 5) Next type a simple program - print (‘Hello\
    \ World!’). ![](rsrc7Z.jpg)Step 6) Now Go up to “Run” menu and select “Run” to\
    \ run your program. ![](rsrc84.jpg)Step 7) You can see output of your program\
    \ at the bottom of the screen. Step 8) Don't worry if u don't have Pycharm Editor\
    \ installed, U can still run the code from the command prompt. Enter correct path\
    \ of a file in command prompt to run the program. Python Main Function with Examples\
    \ Before we jump more  Python coding, we should familiarize with Python Main function\
    \ and its importance. See the following code def main():  \n\n     print \"hello\
    \ world!\"  \n\nprint \"world2020\" Here we got 2 pieces of print one is defined\
    \ within a main function that is \"Hello World\" and the other one is independent\
    \ which is \"world2020\". When you run the function def main (): ●          Only\
    \ \"world2020\" prints out ●          and not the code \"Hello World.\" It is\
    \ because we did not declared the call function \"if\\_\\_name\\_\\_== \"\\_\\\
    _main\\_\\_\". ●          When Python interpreter reads a source file, that will\
    \ execute all the code found in it. ●         When Python runs the \"source file\"\
    \ as  main program, that sets the special variable (\\_\\_name\\_\\_) to have\
    \ a value (\"\\_\\_main\\_\\_\"). ●         When U execute the main function,\
    \ it will then read the \"if\" statement and checks whether \\_\\_name\\_\\_ does\
    \ equal to \\_\\_main\\_\\_. ●         In Python \"if\\_\\_name\\_\\_== \"\\_\\\
    _main\\_\\_\" allows U to run the Python files either as reusable modules or standalone\
    \ programs. Like C, Python uses == for comparison while = for assignment. Python\
    \ interpreter use the main function in two ways. It is important that after defining\
    \ the main function, we call the code by if\\_\\_name\\_\\_== \"\\_\\_main\\_\\\
    _\" and then run the code, only then we will get the output \"hello world!\" in\
    \ the programming console as shown below. Note: Make sure after defining a main\
    \ function, you leave some indent and not declare the code right below the def\
    \ main(): function otherwise it will give indent error. Python Variables Variable\
    \ is a name which is used to refer memory location. Variable also known as identifier\
    \ and used to hold value. In Python, we don't need to specify the type of variable\
    \ because Python is a type infer language and smart enough to get variable type.\
    \ Variable names can be a group of both letters and digits, but they have to begin\
    \ with a letter or an underscore. It is recomended to use lowercase letters for\
    \ variable name. Rahul and rahul both are two different variables. Identifier\
    \ Naming Variables are the example of identifiers. An Identifier is used to identify\
    \ the literals used in the program. The rules to name an identifier are given\
    \ below. The first character of the variable must be an alphabet or underscore\
    \ ( \\_ ). All the characters except the first character may be an alphabet of\
    \ lower-case(a-z), upper-case (A-Z), underscore or digit (0-9). Identifier name\
    \ must not contain any white-space, or special character (!, @, #, %, ^, &, \\\
    *). Identifier name must not be similar to any keyword defined in the language.\
    \ Identifier names are case sensitive for example my name, and MyName is not the\
    \ same. Examples of valid identifiers : a123, \\_n, n\\_9, etc. Examples of invalid\
    \ identifiers: 1a, n%4, n 9, etc. Concatenate Variables Let's see whether concatenate\
    \ different data types like string and number together. For example, we concatenate\
    \ \"world\" with the number \"2020\". Unlike Java, concatenates number with string\
    \ without declaring number as string, Python requires declaring the number as\
    \ string otherwise it will show a TypeError For the following code, you will get\
    \ undefined output a=\"world\"  \n\nb = 2020  \n\nprint a+b Once the integer declared\
    \ as string, it can concatenate both \"world\" + str(\"2020\")= \"world2020\"\
    \ in the output. a=\"world\"  \n\nb = 2020  \n\nprint(a+str(b)) Local & Global\
    \ Variables In Python when we want to use the same variable for rest of your program\
    \ or module you declare it a global variable, while if you want to use the variable\
    \ in a specific function or method, you use a local variable. Let's understand\
    \ this difference between local and global variable with below program. \n\n1.\
    \  Variable \"f\" is global in scope and it is assigned value 101 which is printed\
    \ in output\n\n2.  Variable f is again declared in function and it assumes local\
    \ scope. That is assigned value \"I am learning Python.\" which is printed out\
    \ as output. This variable is different from the global variable \"f\" define\
    \ earlier in this chapter"
