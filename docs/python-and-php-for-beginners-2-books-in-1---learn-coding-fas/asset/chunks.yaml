    # Numeric Data types

    Numeric data types are used to store numeric values. It is very important to make
    sure range of your data is between lower and upper boundaries of numeric data
    types.


    ## MySQL SELECT Statement

    ### SQL SELECT statement syntax

    SQL SELECT statement is the most frequently used SQL command and has the following
    general syntax:


    ```sql

    SELECT [DISTINCT|ALL ] { * | [fieldExpression [AS newName]]} FROM tableName [alias]
    [WHERE condition][GROUP BY fieldName(s)] [HAVING condition] ORDER BY fieldName(s)

    ```

    HERE

    * `SELECT` is the SQL keyword that lets the database know that you want to retrieve
    data.

    * `[DISTINCT | ALL]` are optional keywords that can be used to fine tune the results
    returned from the SQL SELECT statement. If nothing is specified then `ALL` is
    assumed as the default.

    * `{*|[fieldExpression [AS newName]]}` at least one part must be specified, `*`
    selected all the fields from the specified table name, `fieldExpression` performs
    some computations on the specified fields such as adding numbers or putting together
    two string fields into one.

    * `FROM tableName` is mandatory and must contain at least one table, multiple
    tables must be separated using commas or joined using the `JOIN` keyword.

    * `WHERE condition` is optional, it can be used to specify criteria in the result
    set returned from the query.

    * `GROUP BY` is used to put together records that have the same field values.

    * `HAVING condition` is used to specify criteria when working using the `GROUP
    BY` keyword.

    * `ORDER BY` is used to specify the sort order of the result set.


    The Star symbol is used to select all the columns in table. An example of a simple
    SELECT statement looks like the one shown below.


    ```sql

    SELECT * FROM `members`;

    ```

    The above statement selects all the fields from the `members` table. The semi-colon
    is a statement terminate. It''s not mandatory but is considered a good practice
    to end your statements like that.


    ## MySQL WHERE Clause

    ### What is the WHERE Clause?

    We looked at how to query data from a database using the `SELECT` statement in
    the previous tutorial. The `SELECT` statement returned all the results from the
    queried database table. They are however, times when we want to restrict the query
    results to a specified condition. The SQL `WHERE` clause comes in handy in such
    situations.


    ### WHERE clause Syntax

    The basic syntax for the `WHERE` clause when used in a `SELECT` statement is as
    follows.


    ```sql

    SELECT * FROM tableName WHERE condition;

    ```

    HERE

    * `"SELECT * FROM tableName"` is the standard `SELECT` statement

    * `"WHERE"` is the keyword that restricts our select query result set and `"condition"`
    is the filter to be applied on the results. The filter could be a range, single
    value or sub query.


    Let''s now look at a practical example. Suppose we want to get a member''s personal
    details from `members` table given the membership number 1, we would use the following
    script to achieve that.


    ```sql

    SELECT * FROM `members` WHERE `membership_number` = 1;

    ```


    ### WHERE clause combined with - AND LOGICAL Operator

    The `WHERE` clause when used together with the `AND` logical operator, is only
    executed if ALL filter criteria specified are met. Let''s now look at a practical
    example - Suppose we want to get a list of all the movies in category 2 that were
    released in 2008, we would use the script shown below is achieve that.


    ```sql

    SELECT * FROM `movies` WHERE `category_id` = 2 AND `year_released` = 2008;

    ```


    ### WHERE clause combined with - OR LOGICAL Operator

    The `WHERE` clause when used together with the `OR` operator, is only executed
    if any or the entire specified filter criteria is met. The following script gets
    all the movies in either category 1 or category 2


    ```sql

    SELECT * FROM `movies` WHERE `category_id` = 1 OR `category_id` = 2;

    ```


    ### WHERE clause combined with - IN Keyword

    The `WHERE` clause when used together with the `IN` keyword only affects the rows
    whose values matches the list of values provided in the `IN` keyword. `IN` helps
    reduces number of `OR` clauses you may have to use. The following query gives
    rows where `membership_number` is either 1, 2 or 3


    ```sql

    SELECT * FROM `members` WHERE `membership_number` IN (1,2,3);

    ```


    ### WHERE clause combined with - NOT IN Keyword

    The `WHERE` clause when used together with the `NOT IN` keyword DOES NOT affects
    the rows whose values matches the list of values provided in the `NOT IN` keyword.
    The following query gives rows where `membership_number` is NOT 1, 2 or 3


    ```sql

    SELECT * FROM `members` WHERE `membership_number` NOT IN (1,2,3);

    ```


    ### WHERE clause combined with - COMPARISON OPERATORS

    The less than `()`, equal to (`=`), not equal to `()` comparison operators can
    be used with the `Where` clause.


    #### Equal To

    The following script gets all the female members from the `members` table using
    the equal to comparison operator.


    ```sql

    SELECT * FROM `members` WHERE `gender` = ''Female'';

    ```


    ## MySQL query INSERT INTO Table

    ### What is INSERT INTO?

    The main goal of database systems is to store data in the tables. The data is
    usually supplied by application programs that run on top of the database. Towards
    that end, SQL has the `INSERT` command that is used to store data into a table.


    ### Basic syntax

    Let''s look at the `INSERT` syntax.


    ```sql

    INSERT INTO tableName (column1, column2, ...) VALUES (value1, value2, ...);

    ```

    HERE

    * `INSERT INTO tableName` tells MySQL server to add row to the table.

    * `(column1, column2, ...)` specifies the columns to be inserted.

    * `VALUES (value1, value2, ...)` specifies the values to be added.


    ## MySQL UPDATE & DELETE Query

    ### What is the DELETE Keyword?

    The SQL `DELETE` command is used to delete rows that are longer required from
    the database tables. It deletes the whole row from the table. Delete command comes
    in handy to delete temporary or obsolete data from your database. The `DELETE`
    command can delete more than one row from a table in a single query. Once a row
    has been deleted, it cannot be recovered. It is therefore strongly recommended
    to make database backups before deleting any data from the database.


    ### Delete command syntax

    The basic syntax of the delete command is as shown below.


    ```sql

    DELETE FROM tableName [WHERE condition];

    ```

    HERE

    * `DELETE FROM tableName` tells MySQL server to remove rows from the table.

    * `[WHERE condition]` is optional and is used to put a filter that restricts the
    number of rows affected by the `DELETE` query. If the `WHERE` clause is not used
    in the `DELETE` query, then all the rows in a given table will be deleted.


    Before we go into more details discussion the `DELETE` command, let''s insert
    some sample data into the movies table to work with.


    ```sql

    INSERT INTO `movies` (title, director, year_released, category_id) VALUES (''The
    Great Dictator'', ''Chalie Chaplie'', 1920, 7);

    ```

