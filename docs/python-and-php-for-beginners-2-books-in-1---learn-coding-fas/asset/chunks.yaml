    ```sql

    INSERT INTO `movies` (`title`, `director`, `category_id`) VALUES (''sample movie'',
    ''Anonymous'', 8);

    INSERT INTO movies (`title`, `director`, `year_released`, `category_id`) VALUES
    (''movie 3'', ''John Brown'', 1920, 8);

    ```


    执行上述脚本将向 `movies` 表中添加三 (3) 部电影。在继续后续课程之前，让我们获取表中的所有电影。下方的脚本即可实现此操作。


    ```sql

    SELECT * FROM `movies`;

    ```


    - `delete` 命令用于从表中删除不再需要的数据。

    - `WHERE 子句`用于限制受 `DELETE` 查询影响的行数。

    - 一旦数据被删除，将无法恢复，因此强烈建议在删除数据之前进行备份。

    - `update` 命令用于修改现有数据。

    - `WHERE 子句`用于限制受 `UPDATE` 查询影响的行数。


    ## SQL 对比 MySQL：它们之间有什么区别？


    ### 什么是 SQL？

    SQL 是一种用于操作你的数据库的语言。SQL 是所有数据库通的基础语言。不同数据库之间的语法存在细微差异，但基础 SQL 语法在很大程度上保持不变。SQL
    是结构查询语言（Structured Query Language）的缩写。根据 `ANSI`（美国国家标准协会）的标准，`SQL` 是操作关系型数据库管理系统的标准语言。SQL
    用于数据库数据的访问、更新和处理。它的设计允许管理 RDBMS（如 `MYSQL`）中的数据。SQL 语言还用于控制数据访问以及数据库架构（Schemas）的创建和修改。


    ### 什么是 MYSQL？

    `MySQL` 开发于 90 年代中期，是市场上首批可的开源数据库之一。今天有许多 `MySQL` 的替代变体，这些变体之间的差异并不显著，因为它们使用相同的语法，且基本功能也保持一致。`MySQL`
    是一种 RDBMS，允许使数据库中存在保持组织良好。`MySQL` 的读音为 "My S-Q-L"，但也被称为 "My Sequel"。它以联合创始人 Michael
    Widenius 的女儿命名。`MySQL` 提供了对数据库的多用户访问。该 RDBMS 系统通常与 `PHP` 和 `Apache Web 服务器` 结合并运行在
    Linux 发行版之上。`MySQL` 使用 `SQL` 语言来查询数据库。


    '
