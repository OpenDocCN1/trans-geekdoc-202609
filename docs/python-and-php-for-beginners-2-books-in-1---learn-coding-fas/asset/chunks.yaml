    \ f = 'I am learning Python'\n    print f\n\nsomeFunction()\nprint f\n```\n\n\
    ## Python 3 Example\n# Declare a variable and initialize it\n```python\nf = 101\n\
    print(f)\n```\n\n### Global vs. local variables in functions\n```python\ndef someFunction():\n\
    \    # global f\n    f = 'I am learning Python'\n    print(f)\n\nsomeFunction()\n\
    print(f)\n```\n\nUsing keyword `global`, we can reference the global variable\
    \ inside a function.\n\n1. Variable `\"f\"` is global in scope and is assigned\
    \ value `101` which printed in output.\n2. Variable `f` declared using the keyword\
    \ `global`. This NOT a local variable, but the same global variable declared earlier.\
    \ Hence we print its value, the output is `101`.\n3. We changed value of `\"f\"\
    ` inside the function. Once the function call over, the changed value of variable\
    \ `\"f\"` persists. At line 12, when we again, print value of `\"f\"` is it displays\
    \ the value `\"changing global variable\"`.\n\n## Python 2 Example\n```python\n\
    f = 101\nprint f\n\n# Global vs.local variables in functions\ndef someFunction():\n\
    \  global f\n  print f\n\nf = \"changing global variable\"\nsomeFunction()\nprint\
    \ f\n```\n\n## Python 3 Example\n```python\nf = 101\nprint(f)\n\n# Global vs.local\
    \ variables in functions\ndef someFunction():\n  global f\n  print(f)\n\nf = \"\
    changing global variable\"\nsomeFunction()\nprint(f)\n```\n\n## Delete a variable\n\
    We can also delete variable using the command `del \"variable name\"`. In this\
    \ example below, we deleted variable `f`, and when we proceed to print it, we\
    \ get error `\"variable name is not defined\"` which means you have deleted the\
    \ variable.\n\n```python\nf = 11\nprint(f)\ndel f\nprint(f)\n```\n\n## Summary\n\
    - Variables referred to \"envelop\" or \"buckets\" where information can be maintained\
    \ and referenced. Like any other programming language Python also uses variable\
    \ to store the information.\n- Variables can be declared by any name or even alphabets\
    \ like `a`, `aa`, `abc`, etc.\n- Variables can be re-declared even after we have\
    \ declared them for once.\n- In Python we cannot concatenate string with number\
    \ directly, you need to declare them as a separate variable, and after that, you\
    \ can concatenate number with string.\n- Declare local variable when we want to\
    \ use.\n- Declare Global variable when want to use the same variable for rest\
    \ of program.\n- To delete variable, it uses `del`.\n\n---\n\n# CHAPTER 2: String\n\
    \nTill now, we have discussed numbers as data types. In this section, we will\
    \ discuss the most popular data type: i.e., string. Strings can be created by\
    \ enclosing the sequence of characters in single quotes, double quotes, or triple\
    \ quotes.\n\nConsider the following example:\n```python\nstr = \"Hi !\"\n```\n\
    In Python, if we check the type of `str` using `type(str)`, it will print `<class\
    \ 'str'>`. Strings are treated as a sequence. Like other languages, the indexing\
    \ of strings starts from `0`. For example, the string `\"HELLO\"` is indexed as\
    \ given below.\n\n### Updating Strings\nUpdating the content of strings is not\
    \ easy since strings are immutable in Python. Consider the following example 1:\n\
    ```python\nstr = \"HELLO\"\nstr[0] = \"h\"\nprint(str)\n```\nOutput:\n```\nTraceback\
    \ (most recent call last):\n  File \"12.py\", line 2, in <module>\nTypeError:\
    \ 'str' object does not support item assignment\n```\nHowever, in example 2, the\
    \ string can be completely assigned to a new content:\n```python\nstr = \"HELLO\"\
    \nprint(str)\nstr = \"hello\"\nprint(str)\n```\nOutput:\n```\nHELLO\nhello\n```\n\
    \n## String Operators\nConsider the following example to understand the real use\
    \ of Python operators on strings:\n```python\nstr = \"Hello \"\nstr1 = \" world\
    \ \"\n```\n- **Concatenation**: `print(str + str1)` prints `Hello world `.\n-\
    \ **Repetition**: `print(str * 3)` prints `Hello Hello Hello `.\n- **Indexing**:\
    \ `print(str[4])` prints `o`. \n- **Slicing**: `print(str[2:4])` prints `ll`.\n\
    - **Membership**: `print('w' in str)` prints `False`, while `print('wo' in str1)`\
    \ prints `True`.\n- **Formatting**: `print(\"The string str : %s \" % str)` prints\
    \ `The string str : Hello `.\n\n---\n\n## Formatting Operator\nPython allows us\
    \ to use the format specifiers used in C's `printf` statement. The format specifiers\
    \ in python are treated in the same way as they are treated in C. However, Python\
    \ provides an additional operator `%` which is used as an interface between the\
    \ format specifiers and their values. In other words, we can say that it binds\
    \ the format specifiers to the values.\n\nConsider the following example:\n```python\n\
    Integer = 10\nFloat = 1.290\nString = \"Ayush\"\nprint(\"Hi I am Integer ... My\
    \ value is %d\\nHi I am float ... My value is %f\\nHi I am string ... My value\
    \ is %s\" % (Integer, Float, String))\n```\n**Output:**\n```\nHi I am Integer\
    \ ... My value is 10\nHi I am float ... My value is 1.290000\nHi I am string ...\
    \ My value is Ayush\n```\n"
