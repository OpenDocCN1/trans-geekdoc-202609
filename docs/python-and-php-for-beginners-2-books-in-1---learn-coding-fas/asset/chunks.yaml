    \ level code. In Python, indentation is used to declare a block. If two statements\
    \ are at the same indentation level, then they are the part of the same block.\
    \ Generally, four spaces are given to indent the statements which are a typical\
    \ amount of indentation in python. Indentation is the most used part of the python\
