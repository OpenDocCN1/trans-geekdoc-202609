    # 第 8 章 初学者入门 MySQL


    MySQL 是最流行的开源数据库。本课程从数据库基础知识、规范化和 `MySQL Workbench` 的安装开始。随后，它将教授 MySQL 命令，如 `Select`、`Insert`、`Group
    By`，以及 `通配符` & `函数` 等高级主题。


    ## 数据库与 SQL


    ### 什么是数据？

    简单来说，数据可以是与所考虑的任何对象相关的实。例如，你的名字、年龄、身高、体重等都是与你相关的数据。图片、`image`、`file`、`pdf` 等也可以被视为数据。


    ### 什么是数据库？

    数据库是数据的系统集合。数据库支持数据的存储和操作。数据库使数据管理变得简单。让我们讨论几个例子：

    * 在线电话簿肯定会使用数据库来存储与人员、电话号码、其他联系方式等相关的数据。

    * 你的电力服务供应商显然正在使用数据库来管理账单、客户相关问题、处理故障数据等。

    * 我们也考虑 `facebook`。它需要存储、操作和展示与成员、其朋友、成员活动、消息、广告等更多相关的数据。


    ### 什么是数据库管理系统 (DBMS)？

    数据库管理系统（DBMS）是一个程序集合，使用户能够访问数据库、操作数据、报告/表示数据。它还有助于控制对数据库的访问。数据库管理系统并不是新概念，最早于
    20 世纪 60 年代实现。查尔斯·巴赫的集成数据存储（`IDS`）被认为是历史上第一个 DBMS。随着时间的推移，数据库技术发生了巨大演变，而数据库的使用和预期功能也大幅增加。


    ### DBMS 的类型

    让我们看看 DBMS 家族是如何随时间演变的。下面的图展示了 DBMS 类别的演变。


    * **层次型** - 这种类型的 DBMS 采用“父子”关系来存储数据。这种类型的 DBMS 现在很少使用。它的结构像一棵树，节点代表记录，分支代表字段。`Windows
    XP` 中使用的 `windows registry` 是层次型数据库的一个示例。配置设置以带有节点的树结构形式存储。

    * **网络型 DBMS** - 这种类型的 DBMS 支持多对多关系。这通常会导致复杂的数据库结构。`RDM Server` 是实现网络模型的数据库管理系统示例。

    * **关系型 DBMS** - 这种类型的 DBMS 以表的形式（也称为关系）定义数据库关系。与网络型 DBMS 不同，`RDBMS` 不支持多对多关系。关系型
    DBMS 通常具有它们支持的预定义数据类型。这是市场上最流行的 DBMS 类型。关系型数据库管理系统包括 `MySQL`、`Oracle` 和 `Microsoft
    SQL Server` 数据库。

    * **对象关系 DBMS** - 这种类型支持新数据类型的存储。要存储的数据以对象的形式存在。存储在数据库中的对象具有属性（例如 `gender`、`age`）和定义如何处理数据的方法`PostgreSQL`
    是对象关系 DBMS 的示例。


    ### 什么是 SQL？

    * 结构化查询语言（`SQL`）读作 "S-Q-L"，有时读作 "See-Quel"，实际上是处理关系型数据库的标准语言。

    * `SQL` 编程可以有效地用于插入、搜索、更新、删除数据库记录。

    * 这并不意味着 `SQL` 不能做这些之外的事情。

    * 事实上它可以它可以很多事情，包括但不限于数据库的优化和维护。

    * 关系型数据库如 `MySQL Database`、`Oracle`、`Ms SQL server`、`Sybase` 等都使用 `SQL`！

    * 这些数据库使用的 `SQL` 语法几乎相似，不同之处在于某些使用少量不同的语法甚至是专有的 `SQL` 语法。


    #### SQL 示例

    ```

    SELECT * FROM Members WHERE Age > 30

    ```


    #### 为什么要使用 MySQL？

    市场上有很多关系型数据库管理系统。关系型数据库的示例包括 `Microsoft SQL Server`、`Microsoft Access`、`Oracle`、`DB2`
    等。人们可能会问为什么选择 `MySQL` 而不是其他数据库管理系统。


    #### MySQL workbench - SQL 开发工具

    结构化查询语言（`SQL`）允许我们操作关系型数据库。`SQL` 是所有关系型数据库的核心。

    * `MySQLworkbench` 内置了 `SQL` 可视编辑器。

    * `Visual SQL` 编辑器允许开发者针对 `MySQL server` 数据库构建、编辑和运行查询。它具有查看和导出数据的实用程序。

    * 它的语法高亮有助于开发者轻松编写和调试 `SQL` 语句。

    * 可以运行多个查询，结果会自动显示在不同的标签页中。

    * 查询还保存在历史面板中，以便稍后检索和运行。


    #### MySQL workbench - 管理工具

    服务器管理对于保护公司数据起着至关重要的作用。服务器管理的主要问题是用户管理、服务器配置、服务器日志等。`Workbench MySQL` 具有以下功能，简化了
    `MySQL server` 管理过程：

    * **用户管理** - 用于管理用户的可视化实用程序，让数据库管理员在需要时轻松添加新用户和删除现有用户，授予和删除权限并查看用户配置文件。

    * **服务器配置** - 允许对服务器进行高级配置并微调以获得最佳性能。

    * **数据库备份和还原** - 用于导出/导入 `MySQL dump` 文件的可视化工具。`MySQL dump` 文件包含用于创建数据库、表、视图、存储过程和插入数据的
    SQL 脚本。

    * **服务器日志** - 查看 `MySQL server logs` 的可视化工具。日志包括 `error logs`、`binary logs` 和
    `InnodDB logs`。这些日志在对服务器进行诊断时非常有用。下图显示了 `MySQL Workbench` 的建模窗口。


