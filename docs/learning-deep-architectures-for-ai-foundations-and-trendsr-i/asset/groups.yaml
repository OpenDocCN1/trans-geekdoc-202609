    the learning could be done using information locally in one layer or sub-layer
    of the architecture, thus avoiding the hypothesized problems with supervised gradients
    propagating through long chains with large fan-in elements.


    +   - Connected to the two previous points is the idea that unsupervised learning
    could put the parameters of a supervised'
