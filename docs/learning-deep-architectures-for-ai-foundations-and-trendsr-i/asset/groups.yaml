    machines), learning a function with many sign changes in one direction is fundamentally
    difficult (requiring a large VC-dimension, and a correspondingly large number
    of examples). However, learning could work with other classes of functions in
    which the pattern of variations is captured (a trivial example is when the variations
    are periodic and the class of functions includes periodic functions that approximately
    match).


    For complex tasks in high dimension, the complexity of the decision surface could
    quickly make learning impractical when using a local kernel method. It could also
    be argued that if the curve has many variations and these variations are not related
    to each other through an underlying regularity, then no learning algorithm will
    do much better than estimators that are local in input space. However, it might
    be worth looking for more compact representations of these variations, because
    if one could be found, it would be likely to lead to better generalization, especially
    for variations not seen in the training set.'
