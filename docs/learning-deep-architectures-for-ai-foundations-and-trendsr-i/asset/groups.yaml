    ## 7.3 横向连接


    通过在可见单元之间引入相互作用项或“横向连接”（lateral connections），可以使 RBM 的限制稍微减少。从 $P(h|x)$ 采样 $\mathbf{h}$
    仍然容易，但从 $P(x|h)$ 采样 $\mathbf{x}$ 现在通常更困难，且与从马尔可夫随机场采样不同（尽管随机场也是一种全观测的玻尔兹曼机，其中偏移量依赖于某些值的值）。[141]
    提出了这样一种模型来捕捉图像统计数据，其结果表明，基于普通 RBM 的深度置信网络（DBNs）生成的图像比普通 DBNs 更真实。它们的结果还显示，所得分布在像素强度的边缘和成对统计上与观察到的真实图像块相似。


    这些横向连接捕捉了成对依赖，而这些依赖可以通过使用隐藏单元更容易地捕捉，从而将隐藏单元用于捕捉高阶依赖。对于第一层，这可以被视为一种白化（whitening）的形式，这种方法在图像处理系统中被证明是有用的预处理步骤
    [139]。[141] 提出的想法是在 DBN 的所有层上使用横向连接（现在 DBN 可以被看作马尔可夫随机场的分层结构）。这种方法的通用优势在于，由隐藏单元表示的高层因子不需要编码下层横向连接能够捕捉的所有局部“细节”。例如，在生成人脸部图像时，嘴巴和鼻子必须在高层上进行指定，而它们的位置可以通过选择来满足在低层横向连接中编码的成对偏好。这似乎使得生成的图像边缘更锐利，且各部分的相对位置通常更准确，而无需扩展大量的高层单元。


    为了从 $P(x|h)$ 中进行采样，我们可以在当前示例中启动一个马尔可夫链（假设该链已经具有与模型表示的相似的像素共同依赖性，因此收敛应该会很快），并且仅在
    $\mathbf{x}$ 上运行一条短链（保持 $\mathbf{h}$ 固定）。令 $U$ 为可见单元到可见单元连接的方矩阵，对应公式 (5.15) 中的通用玻尔兹曼机能量函数。


    ## 7.4 条件 RBM 和时间 RBM


    为了减少该模型中对比散度（CD）的采样方差，[141] 使用了五个阻尼平均场步骤代替 $\mathbf{x}$ 的普通吉尔布斯链：$\mathbf{x}_t
    = \mathbf{x}_{t-1} + (1-\alpha)\text{sign}(\mathbf{b} + \mathbf{Ux}_{t-1} + \mathbf{W}'')$，其中
    $\alpha \in (0,1)$。


    条件 RBM 是一种某些参数不是自由的，而是随机变量参数函数的 RBM。例如，考虑对于观测向量 $\mathbf{x}$ 和隐藏向量 $\mathbf{h}$
