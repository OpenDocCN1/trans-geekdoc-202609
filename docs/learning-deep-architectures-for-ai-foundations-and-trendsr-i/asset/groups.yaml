    2 架构。小型深层电路中计算单元的组合可以看作是对大型浅层电路的高效“因子分解”。重新组织单元组合的方式会对比表示大小的效率产生巨大影响。例如，想象一个多项式的深度
    $k$ 表示法，其中奇数层实现乘法，偶数层实现加法。这种架构可以看作是一种特别高效的分解，当它扩展为深度 2 架构（如乘积和）时，和中可能需要大量的项：考虑来自深度
    $2k$ 架构的第 1 层乘积（如 $x_2x_4$）。它在深度 2 架构中可能作为因子出现多次。从这个例子可以看出，如果某些计算（例如在某一层）是可以共享的（考虑扩展后的深度
    2 表达式），那么深度架构是有优势的：在这种情况下，待表示的整体表达式可以被因子化，即用深度架构更紧凑地表示。


