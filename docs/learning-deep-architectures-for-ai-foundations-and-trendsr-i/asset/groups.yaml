    我们需要关于世界的先验知识来解释观察到的图像多样性，即使如图 1.1 所示，对于像 MAN（哺乳动物）这样看似简单的抽象。像 MAN 这样的高级抽象具有特性：它对应于一组非常可能的图像，从像素强度空间中简单欧式距离的角度来看，这些图像彼此可能非常不同。在像素空间中，标签对应的图像集合可能是像素空间中一个高度复杂的区域，且该区域不一定是连通的。MAN
    类别在这里可以被视为高级抽象，它可以是一个类别（如 MAN 类别）或是一个特征（数据的函数），可以是离散的（例如，输入句子是过去式），也可以是连续的（例如，输入视频显示物体以每秒
    2 米的速度移动）。许多低级和中间级概念（我们在这里也称为抽象）对于构建 MAN 检测器非常有用。低级抽象与特定概念联系得更紧密，而高级抽象则是我们所说的“更抽象”的抽象，因为它们与实际概念的联系更加遥远，并且通过其他中间级抽象来实现。


    除了构合适抽象的困难外，我们希望“智能”机器捕获的视觉和语义类别（如 MAN）的数量也相当大。深度架构学习的重点是自动发现从最低级到最高级概念的抽象。理想情况下，我们希望学习算法能够尽可能少的人为努力来实现这种发现，即不需要手动定义所有必要的抽象，也不需要有一组巨大的手工标记示例。如果这些算法能够利用互联网上海量的文本和图像资源，无疑有助于将许多人类知识转移到机器可解释的形式。


    # 引言


    深度学习方法旨在学习特征层次结构，其中高层级的特征由低层特征的组合形成。在多个抽象层级上自动学习特征，允许系统直接从数据中学习映射输入到输出的复杂函数，而不需要完全依赖人工构建的特征。这对于高级抽象尤为重要，因为人类往往不知道如何根据原始感官输入来指定它们。随着数据量和学习方法应用范围的不断增长，自动学习强大特征的能力将变得越来越重要。


    架构的深度指的是所学习函数中非线性操作组合的层数。虽然目前大多数学习算法对应于浅层架构（1、2 或 3 层），但哺乳动物大脑的组织方式是一种深度架构 [173]，给定的输入存在于多个抽象层级上，每层对应于皮层的不同区域。人类通常以分层的方式描述此类概念，具有多个抽象层级。大脑似乎还通过多个阶段的转换和表示来处理信息。这在灵长类视觉系统
    [173] 中尤为清晰，其处理阶段序列为：边缘检测、原始形状，并逐渐移动到日益复杂的视觉形状。


