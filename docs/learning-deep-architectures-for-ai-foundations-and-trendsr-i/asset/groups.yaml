    ## 7.6 泛化 RBM 与对比散度


    让我们尝试泛化 RBM 的定义，以便包含一大类参数化，对于这些参数化，我们上面讨论过的本质相同的思想和学习算法（如对比散度）可以很直接地应用。我们以以下方式泛化
    RBM：广义 RBM 是一种基于能量的概率模型，具有输入向量 $\mathbf{x}$ 和隐藏向量 $\mathbf{h}$，其能量函数使得 $P(\mathbf{h}|\mathbf{x})$
    和 $P(\mathbf{x}|\mathbf{h})$ 都可因子分解。该定义可以通过能量函数的参数化来形式化，这也由 [73] 提过；


    **命题 7.1.** 与形式如方程 (5.5) 的模型相关的能量函数，满足 $P(\mathbf{h}|\mathbf{x}) = \prod_i P(h_i|\mathbf{x})$
    和 $P(\mathbf{x}|\mathbf{h})$，必须具有如下形式


    $$\text{Energy}(\mathbf{h},\mathbf{x}) = \sum_i \phi_i(h_i) + \sum_j \xi_j(x_j)
    + \sum_{i,j} h_{ij}(\mathbf{h}_i, \mathbf{x}_j). \quad (7.7)$$


    这是 Hammersley-Clifford 定理 [63, 73] 的直接应用，该定理还表明上述是获得互补先验的充分必要条件。互补先验允许通过适当选择 $\mathbf{h}$
    使得后验分布 $P(\mathbf{h}|\mathbf{x})$ 因子分解。


    在隐藏值和输入值为二值的情况下，这种表述并没有带来任何额外的表示能力。事实上，$\eta_{ij}(\mathbf{h}_i, \mathbf{x}_j)$
    根据 $(\mathbf{h}_i, \mathbf{x}_j)$ 的 $2 \times 2$ 配置最多可以取四个不同的值，始终可以重写为 $(\mathbf{h}_i,
    \mathbf{x}_j)$ 的二次多项式：$a + b\mathbf{x}_j + c\mathbf{h}_i + d\mathbf{h}_i\mathbf{x}_j$。


    然而，$b$ 和 $c$ 可以合并到偏移项中，而 $a$ 可以合并为一个全局加性常数，这并不重要（因为会被配函数抵消）。


