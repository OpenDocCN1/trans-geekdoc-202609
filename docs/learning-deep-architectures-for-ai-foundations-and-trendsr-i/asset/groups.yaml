    can infer enough semantic concepts to be able to interact with most humans using
    these concepts? No. If we consider image understanding, one of the best specified
    of the AI tasks, we realize that we do not yet have learning algorithms that can
    discover the many visual and semantic concepts that would seem to be necessary
    to interpret most images on the web. The situation is similar for other AI tasks.


