    most examples it is easy to compress the fixed-length vector (in average by the
    amount of sparsity). For a given level of sparsity, the number of configurations
    of sparse vectors is much smaller than when less sparsity (or not at all) is imposed,
    so the entropy of sparse codes is smaller.


