    Introduction


    # 1.3 Desiderata for Learning AI


    Summarizing some of the above issues, and trying to put them in the broader perspective
    of AI, we put forward a number of requirements we believe to be important for
    learning algorithms to approach AI, many of which motivate the research are here:


    +   - Ability to learn complex, highly-varying functions, i.e., with a number
    of variations much greater than the number of training examples.

    - Ability to learn with little human input the low-level, intermediate, and high-level
    abstractions that would be useful to represent the kind of complex functions needed
    for AI tasks.

    - Ability to learn from a very large set of examples: computation for training
    should scale well with the number of examples, close to linearly.

    - Ability to learn from mostly unlabeled data, i.e., to work in the semi-supervised
    setting, where not all the examples come with complete and correct semantic labels.

    - Ability to exploit the synergies present across a large number of tasks, multi-task
    learning. These synergies exist because all the AI tasks provide different views
    on the same reality.

    - Strong unsupervised learning (i.e., capturing most of the statistical structure
    in the observed data), which seems essential in the limit of a large number of
    tasks and when future tasks are not known ahead of time.


    Other elements are equally important but connected to the material in this monograph.
    They include the ability to learn to represent context of varying length and structure
    [146], so as to allow machines to operate in a context-dependent stream of observations
    and produce a stream of actions, the ability to make decisions when actions influence
    the future observations and future rewards [181], and the ability to influence
    future observations so as to collect more relevant information about the world,
    i.e., a form of active learning [34].'
