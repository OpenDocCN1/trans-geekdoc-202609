    ## 4.6 自动编码器


    策略是在编码中加入噪声。这本质上是 RBM 所做的，正如我们之后将看到的。另一种非常成功的策略 [46, 121, 139, 150, 152, 153]
    是基于代码的稀疏性约束。有趣的是，这些方法产生的权重向量在性质上与哺乳动物视觉系统主要区域 V1 和 V2 中神经元的观测感受野 [110] 匹配良好。稀疏性问题将在第
