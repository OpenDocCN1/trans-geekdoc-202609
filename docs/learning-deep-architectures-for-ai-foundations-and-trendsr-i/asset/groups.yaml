    ## 4.3 深度架构的无监督学习


    正如我们在上面看到的，逐层无监督学习是为止所有成功的深度架构学习算法的关键组成。如果定义在输出层的判准的梯度在反向传播到低层时变得越来越小，那么理由相信，定义在单层水平上的无监督学习判准可以将其参数向有利的方向移动。如果单层学习算法发现了一种能够发现层输入统计规律的表示，这种预期就是合理的。PCA
    和要求信号数量与输入数量相同的 ICA 标准变体是不恰当的，因为它们在所谓的“过完备”情况下（层的输出数量大于其输入数量）通常没有意义。这表明应该向 ICA
