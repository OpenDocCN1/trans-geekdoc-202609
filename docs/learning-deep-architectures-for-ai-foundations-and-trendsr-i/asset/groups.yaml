    $\mathbf{x}_1$ 的对数似然的近似，它仅取决于 Gibbs 样本 $\mathbf{h}_1$ 和 $\mathbf{x}_{k+1}$：


    $$\frac{\partial}{\partial\theta} P(\mathbf{x}_1) \simeq -\frac{\partial\text{FreeEnergy}(\mathbf{x}_1)}{\partial\theta}
    + \frac{\partial\text{FreeEnergy}(\mathbf{x}_{k+1})}{\partial\theta} \\ \simeq
    (\sum_{i,j} \frac{\partial\eta_{i,j}(\mathbf{h}_i, \mathbf{x}_j)}{\partial\theta}
    + \sum_{i,j} \frac{\partial\eta_{i,j}(\mathbf{h}_{k+1}, \mathbf{x}_j)}{\partial\theta})
    \propto \Delta\theta,$$


    其中 $\Delta\theta$ 是模型参数 $\theta$ 的更新规则，对应于此类广义 RBM 中的 CD-$k$。注意在大多数参数化中，$\theta$
    的特定元素依赖于 $\eta_{i,j}$ 的方式使得不需要显式的求和。例如（对 $\mathbf{h}_{k+1}$ 取期望而非采样），我们恢复了算法 1：


    $$\eta_{i,j}(\mathbf{h}_i, \mathbf{x}_j) = -W_{ij}\mathbf{h}_i\mathbf{x}_j$$


    其中 $n_h$ 和 $n_x$ 分别是隐藏单元和可见单元的数量。


    DBN 联合优化的随机变界


    在本节中，我们将讨论 DBN 的原理。DBN 的对数似然可以使用 Jensen 不等式下界，正如我们下面讨论的，这可以证明贪心逐层策略的合理性。首先我们将
    $P(x)$ 乘以 $1 = \sum_h$ 并展开项：


    $$\text{FreeEnergy}(\mathbf{x}) = - \log \sum_{i,j} \exp \left(-\sum \eta_{i,j}(\mathbf{h}_i,\mathbf{x}_j)\right)
    \cdot$$


