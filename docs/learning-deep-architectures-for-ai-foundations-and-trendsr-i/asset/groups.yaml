    ## 9.2 Why Unsupervised Learning is Important


    One of the claims of this monograph is that powerful unsupervised or semi-supervised
    (self-taught) learning is a crucial component in building successful learning
    algorithms for deep architectures aimed at approaching AI. We briefly cover the
    arguments in favor of this hypothesis here:


    - Scarcity of labeled examples and availability of unlabeled examples (possibly
    not only of the classes of interest, as in self-taught learning [148]).


    - Unknown future tasks: if a learning agent does not know what future tasks it
    will have to deal with in the future, but it knows the task will be defined with
    respect to a world (i.e., random variables) that it can observe now, it would
    appear very rational to collect and integrate as much information as possible
    about this world as to learn what makes it.


    - Once a good high-level representation is learned, other learning tasks (e.g.,
    supervised or reinforcement learning) could be much easier. We know for example
    that kernel machines can be very powerful if using an appropriate kernel, i.e.,
    an appropriate feature space. Similarly, we know powerful reinforcement learning
    algorithms which have guarantees in the case where agents are essentially obtained
    through linear combination of appropriate features. We do not know what the appropriate
    representation should be, but one would be reassured if it caught the salient
    factors of variation in the input data, and disentangled them.


    - Layer-wise unsupervised learning: this was argued in Section 4.3. Much of the
    learning could be done using information locally in one layer or sub-layer of
    the architecture, thus avoiding the hypothesized problems with supervised gradients
    propagating through long chains with large fan-in elements.


    - Connected to the two previous points is the idea that unsupervised learning
    could put the parameters of a supervised or reinforcement learning machine in
    a region from which gradient descent (local optimization) would yield good solutions.
    This has been verified empirically in several settings, in particular in the experiment
    of Figure 4.2 and in [17, 98, 50].


    - The extra constraints imposed on the optimization by requiring the model to
    capture not only the input-to-target dependency but also the statistical regularities
    of the input distribution might be helpful in avoiding some generalizing apparent
    local (those that do not correspond to good modeling of the input distribution).
    Note that in general extra constraints may also create more local, but we observe
    experimentally [17] that both training and test error can be reduced by unsupervised
    pre-training, suggesting that the unsupervised pre-training moves the parameters
    in a region of space closer to local minima corresponding to better representations
    (in the lower layers). It has been argued [71] (but is debatable) that unsupervised
    learning is less prone to overfitting than supervised learning. Deep architectures
    have typically been used to construct a supervised classifier, and in that case
    the unsupervised learning component can clearly be seen as a regularizer or a
    prior [137, 100, 118, 50] that forces the resulting parameters to make sense not
    only to model classes given inputs but also to capture the structure of the input
    distribution.


    ## 9.3 Open Questions


    Research on deep architectures is still young and many questions remain unanswered.
    The following are potentially interesting.


    1. Can the results pertaining to the role of computational depth in circuits be
    generalized beyond logic gates and linear threshold units?


    2. Is there a depth that is mostly sufficient for the computations necessary to
    approach human-level performance of AI tasks?


