    ## 9.1 全局优化策略


    ### 9.1.2 从无监督到有监督的过渡


    许多论文报告的实验清楚地表明，对于深度架构，无监督预训练后进行有监督微调效果良好。虽然之前结合无监督和有监督准则的工作 [100] 侧重于无监督准则的正则化效应（以及监督学习中的未标记样本），但第
    4.2 节的论述表明，在深度网络无监督预训练中观察到的部分收益可能源于对深度架构低层更好的优化。


    许多近期工作关注于从无监督表示学习算法（例如稀疏编码）开始，并使用判别准则微调表示，或将判别准则与无监督准则结合 [6, 97, 121]。


    在 [97] 中，RBM 是通过一个包含输入 $x$ 和目标类 $y$ 的两部分可见向量进行训练的。由于 RBM 可以被训练用于建模联合分布 $P(x,y)$（例如通过对比散度
    CD）或建模条件分布 $P(y|x)$（条件对数似然的精确梯度是可计算的）。报道的最佳结果 [97] 结合了两种准则，但模型使用非判别准则进行初始化。


    在 [6, 121] 中，在稀疏编码系统中训练解码器基的任务与在稀疏码上训练分类器的任务耦合在一起。在用非判别学习初始化解码器基后，可以使用判别准则对其进行微调，该准则同时应用于表示参数（即产生稀疏码的第一层基）和一组分类器参数（例如一个以表示码作为输入的线性分类器）。根据
    [121] 的研究，如果不先用非判别训练进行初始化而直接尝试优化有监督准则将导致非常糟糕的结果。事实上，他们提出了一种从非判别准则到判别准则的*平滑过渡*，因此执行了某种续延方法来优化判别准则。


    ### 9.1.3 控制温度


    即使是优化单个 RBM 的对数似然也可能是一个困难的优化问题。事实证明，使用随机梯度（例如从 CD-$k$ 获取的）和较小的初始权重再次接近于续延方法，并且很容易转化为这种方法。考虑对应于
    RBM 正则化路径 [64] 的优化问题族，例如参数的 $\ell_2$ 正则化，由 $\lambda \in \{0,1]$ 参数化的训练准则族：


    ```

    $C_{\lambda}(\theta) =-\sum \log P_{\theta}(\mathbf{x}_i) - ||\theta||^2 \log
    \lambda.quad (9.1)$

    ```


    当 $\lambda \to 0$ 时，$\theta \to 0$，可以证明 RBM 的对数似然在 $\theta$ 上是凸的。当 $\lambda \to
    1$ 时，没有正则化（注意，如果训练集很小，$\lambda$ 的某些中间值在泛化方面可能更好）。控制 RBM 中偏移和权重的幅度等于控制玻尔兹曼机中的温度（能量函数的缩放系数）。高温度对应于高度随机的系统，在极限情况下是输入上的阶乘和均匀分布。低温对应于更具确定性的系统，只有一小部分可能的配置是合理的。


    有趣的是，人们经常观察到，从小权重开始的随机梯度下降允许权重增大幅度，从而近似遵循正则化路径。早停是一种广为人知的有效容量控制技术，基于在训练期间监控验证集上的性能，并保留验证集误差表现最好的参数。早停与
    $\ell_2$ 正则化（沿间隔边界）之间的数学联系已经建立 [36, 211]：从小参数开始并进行梯度下降会产生逐渐较大的参数，对应于逐渐减少正则化的训练准则。然而，使用普通的随机梯度下降（没有显式正则化项），无法保证我们能够追踪与等式
    (9.1) 中一系列 $\lambda$ 值相关的局部极点序列。可能通过稍微修改随机梯度算法来使其跟踪更好的正则化路径，即使其更接近续延方法，方法是通过显式控制
    $\lambda$，并在当优化足够接近当前 $\lambda$ 值的局部极点时逐渐增加 $\lambda$。请注意，相同的技术可能扩展到机器学习中发现的其他困难非线性优化问题，例如训练深度有监督神经网络。我们希望从全局最优解开始并逐渐跟踪局部极点，从强正则化缓慢移动到较弱或无正则化。


    ### 9.1.4 塑造：基于课程的训练


    通过逐渐变换训练任务，可以获得另一种续延方法，从一个简单的（可能是凸的）示例说明较简单概念的任务过渡到目标任务（具有更困难的示例）。人类需要几十年的训练才能成为社会中功能完全的成年人。这种训练是高度组织化的，基于教育系统和课程，课程在不同时间引入不同的概念，利用以前学过的概念来简化对新抽象概念的学习。用课程训练学习机器的想法至少可以追溯到
    [49]。基本思想是从小开始，学习任务中较容易的方面或较容易的子任务，然后增加难度。从本文提倡的构建表示的角度来看，该想法是先学习捕捉低级抽象的表示，然后利用并组合这些表示，以学习解释数据中更复杂结构所必需稍高层次的抽象。通过选择向学习系统呈现哪些概念以及呈现的顺序，可以引导训练并显著提高我们学习的速度。这种思想在动物训练中被经常利用，被称为“塑造（shaping）”
    [95, 144, 177]。


    塑造和课程的使用也可以看作是续延方法。为此，考虑考虑建模来自训练分布 $P$ 的数据的学习问题。该思想是根据给定的进度重新权重从训练分布中采样示例的概率，该进度从“最容易”的示例开始逐渐向说明更抽象概念的示例。在进度的点
    $t$，我们从分布 $\hat{P}_t$ 进行训练，其中 $\hat{P}_t = P$，且 $\hat{P}_0$ 被选择为易于学习。像任何续延方法一样，当学习者在进度的当前点
    $t$ 达到局部极点时（即它充分掌握了之前呈现的示例，从 $P_t$ 采样），我们就沿着进度移动。对 $t$ 进行微小改变以平滑训练分布中采样概率的变化，从而构建一条从简单学习问题开始到所需训练分布的连续路径。这在
    [20] 中得到了进一步发展，实验表明，与仅使用目标分布进行训练相比，使用通向目标分布的课程进行训练，在视觉和语言任务上都具有更好的泛化性。


    '
