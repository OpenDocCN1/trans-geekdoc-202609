    ## 7.4 Conditional RBMs and Temporal RBMs


    To reduce sampling variance in CD for this model, [141] used five damped mean-field
    steps instead of an ordinary Gibbs chain on the $\mathbf{x}$''s: $\mathbf{x}_t
    = \mathbf{x}_{t-1} + (1-\alpha)\text{sign}(\mathbf{b} + \mathbf{Ux}_{t-1} + \mathbf{W}'')$,
    with $\alpha \in (0,1)$.


    ## 7.4 Conditional RBMs and Temporal RBMs


    A Conditional RBM is an RBM where some of the parameters are not free but are
    instead parametrized functions of a random variable. For example, consider an
    RBM for the joint distribution $P(x,h)$ between observed vector $\mathbf{x}$ and
    hidden vector $\mathbf{h}$, with parameters $(\mathbf{b},\mathbf{c})$ as per Equation
    (5.15), for input offsets hidden units offsets $\mathbf{c}$, and the weight matrix
    $\mathbf{W}$. This idea has been introduced by [182, 183] for context-dependent
    RBMs in which the hidden units $\mathbf{c}$ are affine functions of a context
    variable $\mathbf{z}$. Hence the RBM represents $P(x,h|z)$, or marginalizing over
    $\mathbf{h}$, $P(x)$. In the general parameters $\theta=(\mathbf{b},\mathbf{W})$
    of an RBM can be written as a parametrized $\theta=f(x,z)$, i.e., the free parameters
    of the conditional RBM with conditioning variable $\mathbf{z}$ are denoted $\omega$.
    Generalizing RBMs to conditional RBMs allows building deep architectures in which
    the hidden variables at each level can be conditioned on the value of other variables
    (typically representing some form of context).


    The Contrastive Divergence algorithm for RBMs can be easily generalized to the
    case of Conditional RBMs. The CD gradient estimator $\Delta\theta$ on a parameter
    $\theta$ can simply be back-propagated to obtain a gradient estimator on $\omega$:


    ```

    $\Delta\omega = \Delta\theta \frac{\partial\theta}{\partial\omega}$.

    ```


    In the affine case $\mathbf{c} = \beta + \mathbf{Mz}$ (with $\mathbf{c}, \beta$
    and $\mathbf{z}$ column vectors) studied by [183], the CD update on the conditional
    parameters is simply


    ```

    $\Delta\beta = \Delta\mathbf{c},$

    $\Delta\mathbf{M} = \Delta\mathbf{c}\mathbf{z}''$.

    ```


    where the last multiplication is an outer product (applying the chain rule on
    derivatives), and $\Delta\mathbf{c}$ is the update given by CD-$k$ on hidden units
    offsets.


    This idea has been successfully applied to model conditional distributions $P(\mathbf{x}_t|\mathbf{x}_{t-1},
    \mathbf{x}_{t-2}, \mathbf{x}_{t-3})$ in sequential data of human motion [183],
    where $\mathbf{x}_t$ is a vector of joint angles and other geometric features
    computed from motion capture data of human movements as walking and running. Interestingly,
    this allows *generating* realistic human motion *sequences*, by successively sampling
    the $t$-th frame given the previously sampled $k$ frames, i.e., approximating


    ```

    $P(\mathbf{x}_1, \dots, \mathbf{x}_t) \approx P(\mathbf{x}_1, \dots, \mathbf{x}_k)
    \prod_{t=k+1}^T P(\mathbf{x}_t|\mathbf{x}_{t-1}, \dots, \mathbf{x}_{t-k})$.

    ```


    As demonstrated by [126], it can be useful to not just make the offsets but also
    the weights conditional on a context variable. In that, we greatly increase the
    number of freedom. Probabilistic sequences of $\mathbf{h}$ [180] can gain a lot
    by capturing dependencies between the. While Hidden Markov Models (HMMs) only
    consider the state at the previous time, Temporal RBMs allow for longer-range
    dependencies. This approach is used in [147] to model the state of.


    ## 7.5 Factored RBMs


    In several probabilistic language models, it has been proposed to learn a distributed
    representation of each word. For an RBM that models a sequence of words, it would
    be convenient to use a parametrization that leads to automatically learning a
    distributed representation for each word in the vocabulary. Consider an RBM input
    $\mathbf{x}$ that is the concatenation of one-hot vectors $\mathbf{v}_i$ for each
    word $w_i$ in a fixed-sequence $(w_1, w_2, \dots, w_t)$.

