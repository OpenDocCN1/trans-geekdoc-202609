    ### 7.1.1 Why a Sparse Representation?


    We argue that if one is going to go fixed-size representations, then sparse representations
    are more efficient (than non-sparse ones) in an information-theoretic sense, allowing
    for varying the effective number of bits per example. According to learning theory
    [117, 193], to obtain good generalization it is enough that the total number of
    bits needed to encode the whole training set be small, compared to the size of
    the training set. In many domains of interest different examples require different
    number of bits when compressed.


