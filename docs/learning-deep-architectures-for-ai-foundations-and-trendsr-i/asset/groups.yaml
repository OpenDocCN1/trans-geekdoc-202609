    An appealing generalization of semi-supervised learning, especially in the context
    of deep architectures, is self-taught learning [109, 148], in which the unlabeled
    examples potentially come from classes other than the labeled classes. This is
    more realistic than the standard semi-supervised setting, e.g., even if we are
