    RBM）以及一个对自由非参数代码 $\mathbf{h}$ 与参数化编码器输出之间差异的惩罚。通过这种方式，优化的代码 $\mathbf{h}$ 试图满足两个目标：良好地重构输入（类似于稀疏编码），同时不离编码器的输出太远（由于编码器的简单参数化，它在结构上是稳定的）。在执行的实验中，编码器仅是一个仿射变换加上像
    sigmoid 这样的非线性，解码器像稀疏编码一样是线性的。实验表明，生成的代码在深度架构（带有监督微调）中运行良好 [150]。


