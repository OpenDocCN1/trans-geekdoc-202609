    $\eta_{i,j}$ 中，因此我们在下文中忽略它们。定理 5.1 可以应用于：


    $$\text{FreeEnergy}(\mathbf{x}) = - \log \sum_{i,j} \exp \left(-\sum \eta_{i,j}(\mathbf{h}_i,\mathbf{x}_j)\right)
    \cdot$$


    样本 $\mathbf{x}$ 的自由能量的梯度为：


    $$\frac{\partial \text{FreeEnergy}(\mathbf{x})}{\partial \theta} = \sum_{h} \frac{\exp
    \left(-\sum_{i,j} \eta_{i,j}(\mathbf{h}_i,\mathbf{x}_j)\right)}{\partial \theta}
    - \sum_{h} \sum_{i,j} \exp \left(-\sum_{i,j} \eta_{i,j}(\mathbf{h}_i,\mathbf{x}_j)\right)
    \frac{\partial \eta_{i,j}(\mathbf{h}_i,\mathbf{x}_j)}{\partial \theta} \\= \sum_{h}
    P(\mathbf{h}|\mathbf{x}) \frac{\partial \eta_{i,j}(\mathbf{h}_i,\mathbf{x}_j)}{\partial
    \theta} \\= E_{h} \left[ \sum_{i,j} \frac{\partial \eta_{i,j}(\mathbf{h}_i,\mathbf{x}_j)}{\partial
    \theta} \right]$$


