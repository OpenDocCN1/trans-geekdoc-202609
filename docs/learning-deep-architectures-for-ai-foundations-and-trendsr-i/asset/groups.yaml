    model of an RBM is illustrated in Figure 4.5, showing that the $\mathbf{h}$ are
    independent of each other when conditioning on $x$ and the $\mathbf{x}_j$ are
    independent of each other when conditioning on $\mathbf{h}$. In an RBM, $U=0$
    and $V=0$ in Equation (5.15), i.e., the only interaction terms are between a hidden
    unit and a visible unit, but not between units of the same layer. This form of
    model was first introduced under the name of *Harmonium* [178], and learning algorithms
    (beyond the ones for Boltzmann Machines) were discussed in [51]. Empirically demonstrated
    and efficient learning algorithms and variants were proposed more recently [31,
    70, 200]. As a consequence of the lack of input-input and hidden-hidden interactions,
    the energy function is bilinear,


    ```

    $Energy(\mathbf{x}, \mathbf{h}) = -\mathbf{b}''\mathbf{x} - \mathbf{c}''\mathbf{h}
    - \mathbf{h}''\mathbf{Wx} \quad (5.20)$

    ```


    and the factorization of the free energy of the input, introduced with Equations
    (5.11) and (5.13) can be applied with $\beta(\mathbf{x})=\mathbf{b}''\mathbf{x}$
    and $\gamma_i(\mathbf{x},\mathbf{h})=-h_i(c_i + W_ix)$, where $W_i$ is the row
    vector corresponding to the $i$-th row of $\mathbf{W}$. Therefore the free energy
    of the input (i.e., its unnormalized log-probability) can be computed efficiently:


    ```

    $FreeEnergy(\mathbf{x}) = -\sum_{i} \log \sum_{h_i} e^{h_i(c_i + W_ix)} \quad
    (5.21)$

    ```


    Using the same factorization technique (in Equation (5.12)) due to the affine
    form of $Energy(\mathbf{x},\mathbf{h})$ with respect to $\mathbf{h}$, we readily
    obtain a tractable expression for the conditional probability $P(\mathbf{h}|\mathbf{x})$:


    ```

    $P(\mathbf{h}|\mathbf{x}) = \frac{\exp(\mathbf{b}''\mathbf{x} + \mathbf{c}''\mathbf{h}
    + \mathbf{h}''\mathbf{Wx})}{\sum_{\mathbf{h}} \exp(\mathbf{b}''\mathbf{x} + \mathbf{c}''\mathbf{h}
    + \mathbf{h}''\mathbf{Wx})} = \frac{\prod_i \sum_{h_i} \exp(c_ih_i + W_ix)}{\prod_i
    \sum_{h_i} \exp(h_i(c_i + W_ix))} = \prod_i P(h_i|\mathbf{x}).\.$

