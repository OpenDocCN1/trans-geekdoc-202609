    ### 3.1 The Limits of Matching Local Templates


    How a learning algorithm compactly represent a "complicated" function of the input,
    i.e., one that has many more variations than the number of available training
    examples? This question is both connected to the depth question and the question
    of locality of estimators. We argue that local estimators are inappropriate to
    learn highly varying functions, even though they can potentially be represented
    efficiently with deep architectures. An estimator that is local in input space
    obtains good generalization for a new input x by mostly exploiting training examples
    in the neighborhood of x. For example, the k neighbors of the test point x, among
    the training examples, vote for the prediction at x. Local estimators implicitly
    or explicitly partition the input space in regions (possibly in a soft than hard
    way) and require different parameters or degrees of freedom to account for the
    possible shape of the target function in each of the regions. When many regions
    are necessary because the function is highly varying, the number of required parameters
    will be also large, and thus the number of examples needed to achieve good generalization.


    # Local vs Non-Local Generalization


    The local generalization issue is directly connected to the literature on the
    curse of dimensionality, but the results we cite show what matters for generalization
    is not dimensionality, but instead the number of “variations” of the function
    we wish to obtain after learning. For example, if the function represented by
    the model is piecewise-constant (e.g., decision trees), then the question is the
    number of pieces required to approximate properly the target function. There are
    connections between the number of variations and the input dimension: one can
    readily design families of target functions for which the number of variations
    is exponential in the input dimension, such as the parity function with d inputs.


    Architectures based on matching templates can be thought of having two levels.
    The first level is a set of templates which can be matched to the input. A template
    unit will output a value that indicates the degree of matching. The second level
    combines these values, typically with a simple linear combination (an OR-like
    operation), in order to estimate the desired output. One can think of this linear
    combination as performing a kind of interpolation in order to produce an answer
    in the region of input space that is between the templates.


    The prototypical example of architectures based on matching templates is the kernel
    machine [66]


