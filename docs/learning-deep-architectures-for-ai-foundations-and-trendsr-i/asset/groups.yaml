    [67, 68, 123, 122, 124, 157]。这里讨论的现代深度架构方法归功于认知心理学（随后进入计算机科学/人工智能），旨在解释早期认知模型无法自然捕捉的现象，并将认知解释与神经基质的计算特征联系起来。


    总之，许多计算复杂性结果有力地表明，能够用深度 $k$ 架构紧凑表示的函数，为了用浅层架构表示可能需要大量的元素。由于架构中的每个元素都可能需要使用示例进行选择（即学习），这些结果表明从统计效率的角度来看，架构的深度可能非常重要。这一概念在下一节中进一步发展，讨论了许多浅层架构与非参数学习算法相关的另一个弱点：估计器在输入空间中的局部性。


    # 局部与非局部泛化


    ### 3.1 匹配局部模板的局限


    学习算法如何紧凑地表示输入的“复杂”函数，即变化远多于可用训练数量的函数？这个问题与深度以及估计器的局部性问题都相关。我们认为局部估计器不适用于学习高度变变的函数，尽管它们潜在地可以通过深度架构高效地表示。输入空间中的局部估计器通过主要利用
    $x$ 附近的邻域内的训练示例，为新输入 $x$ 获得良好的泛化。例如，训练示例中测试点 $x$ 的 $k$ 个邻居对 $x$ 处的预测投票。局部估计器隐式或显式将输入空间划分为区域（可能是软性的而非硬性的），并需要不同的参数或自由度来解释每个区域内目标函数可能的形状。当由于函数高度变而需要许多区域时，所需的参数数量也会很大，从而导致实现良好泛化所需的示例数量也之增加。


    # 局部与非局部泛化


    局部泛化问题与维度灾难的文献直接相关，但我们引用的结果表明，对泛化的关键因素不是维度，而是我们希望在学习后获得的函数的“变化”数量。例如，如果模型表示的函数是分段常数的（例如决策树），那么问题就是恰当拟合目标函数所需的分段数量。变化数量与输入维度之间存在联系：人们很容易设计出一类目标函数族，其变化数量随输入维度呈指数级增长，例如具有
    $d$ 个输入的奇偶校验函数。


    基于匹配模板的架构可以被认为具有两个级。第一层是一组可以与输入匹配的模板。模板单元将输出一个指示匹配程度的值。第二层结合这些值，通常是简单的线性组合（一种类似于或门的操作），以估计所需的输出。人们可以将这种线性组合理解为执行了某种插值，以便在输入空间中模板之间的区域产生答案。


    基于匹配模板的架构的典型示例是核机器 [66]


    ```

    $f(x) = b + \sum \alpha_i K(x, x_i),

    ```


    $b$ 和 $\alpha_i$ 构成第二层，而在第一层，核函数 $K(x,x_i)$ 将输入与 $x_i$ 匹配。在上面的方程中，$f(x)$ 可以是分类器的判别式，或者是回归预测器的输出。当
    $K(\mathbf{x},\mathbf{x}_i) > \rho$ 对于 $\mathbf{x}_i$ 周围区域区域时，核是局部的。该区域的大小通常由核的某个超参数控制。局部核的一个示例是高斯核
    $K(\mathbf{x},\mathbf{x}_i) = e^{-|\mathbf{x}-\mathbf{x}_i|^2/\sigma^2}$，其中 $\sigma$
    控制区域。我们可以将高斯核看作是一种软与运算，因为


    ### 3.1 匹配局部模板的局限


    它可以被写为一维条件的乘积：$K(\mathbf{u}, \mathbf{v}) = \prod_{j} e^{-(\mathbf{u}_j-\mathbf{v}_j)^2/\sigma^2}$。如果所有维度
    $j$ 的 $|\mathbf{u}_j-\mathbf{v}_j|/\sigma$ 都很小，则模式匹配且 $K(\mathbf{u}, \mathbf{v})$
    很大。如果单个 $j$ 的 $|\mathbf{u}_j-\mathbf{v}_j|/\sigma$ 很大，则没有匹配且 $K$ 很小。


