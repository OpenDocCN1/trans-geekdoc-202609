    or reinforcement learning machine in a region from which gradient descent (local
    optimization) would yield good solutions. This has been verified empirically in
    several settings, in particular in the experiment of Figure 4.2 and in [17, 98,
    50].


    +   - The extra constraints imposed on the optimization by requiring the model
    to capture not only the input-to-target dependency but also the statistical regularities
    of the input distribution might be helpful in avoiding some generalizing apparent
