    虽然稀疏性和正则化降低了表示能力以避免学习恒等函数，但 RBM 可以具有巨大的容量而仍然不学习恒等函数，因为它们不仅（仅）试图编码输入，还试图通过近似最大化生成模型的似然来捕捉输入中的统计结构。自动编码器的一种变体与
    RBM 具有相同属性，称为去噪自动编码器 [195]。去噪自动编码器最小化了从输入的随机损坏变换中重构输入的误差。可以证明，它最大化了生成模型对数似然的下界。更多细节见第
    7.2 节。


    ## 基于能量的模型和玻尔兹曼机


    由于深度信念网络 (DBNs) 基于受限玻尔兹曼机 (RBMs)，而 RBM 是特定的*基于能量的模型*，我们在这里引入了有助于理解它们的主要数学概念，包括*对比散度*
    (CD)。


    ## 5.1 基于能量的模型和专家乘积


    基于能量的模型将标量能量分配给感兴趣变量的每个配置 [107, 106, 149]。学习对应于修改该能量函数，使其形状具有理想的属性。例如，我们希望合理或理想的配置具有低能量。基于能量的概率模型可以通过能量函数定义概率分布，如下：


    $$P(x) = \frac{e^{-Energy(x)}}{Z}$$


    即能量作用在对数概率域中。上述内容推广了指数族*模型 [29]，这些模型的能量函数 Energy($**x**) 具有形式为 $\eta(\theta) \cdot
    \phi(x)$。我们将在下面看到，在 RBM 中，给定另一层时某一层的条件分布可以从指数族分布的任何一种中获得 [200]。虽然任何概率分布都可以表示为基于能量的模型，但许多专门的分布族（如指数族）可以从特定的推理和学习程序中获益。另一些人探索了基于能量的模型中相当通用的学习方法
    [84, 106, 149]。


    归一化因子 Z 类比物理系统被称为配函数，


    $$Z = \sum_{x} e^{-\text{Energy}(\mathbf{x})} \quad (5.2)$$


    其中和是在输入空间上进行的，当 $\mathbf{x}$ 是连续的时通过积分进行。当 $Z$ 不存在时，某些基于能量的模型可以定义（见节 5.1）。


    在专家乘积公式中 [69]，能量函数是各项之和，每项对应于一个专家 $f_i$：


    $$\text{Energy}(\mathbf{x}) = \sum_{i} f_i(\mathbf{x}), \quad (5.3)$$


    即


    $$P(\mathbf{x}) \propto \prod_{i} e^{-f_i(\mathbf{x})}, \quad (5.4)$$


    每个专家视为 $\mathbf{x}$ 不合理配置的检测器，如果我们考虑 $f_i(\mathbf{x})$ 仅取两个值的特殊情况：一个（小的）对应于满足约束，另一个（大的）对应于不满足约束。[69]
    解释了专家乘积相对于专家混合的优势，在专家混合中，概率的乘积被概率的加权和所取代。专家乘积公式的优势在于，$f_i(\mathbf{x})$ 形成了一个分布式表示：它们不像专家混合那样每个专家划分一个区域，而是根据所有可能的配置来划分空间（每个专家的约束可能被违反）。[69]
    提出了一种估计公式 (5.4) 中 $\log P(x)$ 关于每个专家参数的梯度的算法，使用了对比散度的首次实例化 [70]。


    ### 5.1.1 引入隐藏变量


    在许多感兴趣的情况下，x 有许多组件变量 $x_i$，我们并不同时观测这些组件，或者我们想要引入非观测变量来增加模型的表达能力。因此我们考虑一个观测部分（此处用
    x 表示）和一个隐藏部分，由于只有 x 是观测到的，我们关心边缘分布


    $$P(x) = \frac{e^{-FreeEnergy(x)}}{Z} (5.6)$$


    在这种情况下，为了将这种公式映射到类似于 (5.1) 的形式，我们引入了（受物理启发的）自由能量符号，定义为：


    $$P(x) = \frac{e^{-FreeEnergy(x)}}{Z}, (5.7)$$


    带有 $\sum_{x} e^{-FreeEnergy(x)}$，即


    $$FreeEnergy(x) = -log \sum_{h} e^{-FreeEnergy(x,h)} (5.8)$$


    因此自由能量是能量在对数域中的边缘化。数据似然梯度随后具有一种特别的形式。让我们引入 $\theta$ 来表示模型的参数。从公式 (5.7) 开始，我们得到


    $$\frac{\partial \log P(x)}{\partial \theta} = \frac{\partial FreeEnergy(x)}{\partial
    \theta} + \frac{1}{Z} \sum_{\hat{x}} e^{-FreeEnergy(\hat{x})} \frac{\partial FreeEnergy(\hat{x})}{\partial
    \theta} = \frac{\partial FreeEnergy(x)}{\partial \theta} + \sum_{\hat{x}} P(\hat{x})
    \frac{\partial FreeEnergy(\hat{x})}{\partial \theta}. (5.9)$$


