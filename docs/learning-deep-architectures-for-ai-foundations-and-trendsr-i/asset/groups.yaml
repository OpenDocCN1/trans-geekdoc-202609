    # 用于 AI 的深度架构学习


    Yoshua Bengio

    IRO 系


    ## 摘要


    理论结果表明，为了学习能够表示高层抽象的复杂函数（例如在视觉、语言和其他 AI 级任务中），我们可能需要*深度架构*。深度架构由多层非线性操作组成，例如具有许多隐藏层的神经网络，或者在重用了许多子公式的命题公式中。搜索深度架构的参数空间是一项艰巨的任务，但最近提出的诸如深度置信网络的学习算法在解决这一问题上取得了显著成功，在某些领域超越了最先进水平。本专著讨论了关于深度架构学习算法的动机和原理，特别是那些利用单层模型的无监督学习（如受限玻尔兹曼机）作为构建块的方法，用于构建如深度置信网络等更深的模型。


    # 1 引言


    让计算机很好地模拟我们的世界以展现出我们所谓的“智能”，一直是半个多世纪以来的研究焦点。为了实现这一点，显然应该在计算机中显式或隐式地存储大量关于世界的信息。由于将所有内容格式化为计算机用于回答问题并泛化到新语境的格式似乎极其困难，许多研究人员转向了学习算法来捕捉大部分大部分信息。在理解和改进学习算法方面取得了巨大进展，但人工智能（AI）的挑战依然存在。我们有能够理解场景并用自然语言描述它们的算法吗？并没有，除非在非常有限的范围内。我们有能够推断出足够语义概念以便使用这些概念与大多数人进行交互的算法吗？没有。如果我们考虑图像理解——最明确的
    AI 任务之一——我们发现我们还没有能够发现许多视觉和语义概念的学习算法，而这些概念对于解释网络上的大部分图像似乎是必要的。其他 AI 任务的情况也是如此。


