    be fixed?


    6. Is the supervised training criterion for deep architectures (and maybe the
    log-likelihood in deep Boltzmann machines and DBNs) really fraught with poor local
    minima or is it just that the criterion is too intricate for the optimization
    algorithms tried (such as gradient descent and conjugate gradients)?


    7. Is the presence of local minima an important issue in training RBMs?


    8. Could we replace RBMs and auto-encoders by algorithms that would be proficient
    at extracting good representations but involving an easier optimization problem,
    perhaps even a convex one?


    9. Current training algorithms for deep architectures involves many phases (one
    layer, plus a global fine-tuning). This is not very practical in the purely online
    setting since we have moved into fine-tuning, we might be trapped in an apparent
    local minimum. Is it possible to come up with a completely online procedure for
