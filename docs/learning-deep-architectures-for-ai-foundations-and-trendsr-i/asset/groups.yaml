    ## 4.2 训练深度神经网络的挑战 33


    既不利用 RBM 也不利用自编码器 [131, 202]。这些算法与基于 RBM 和自编码器的训练算法的共同点是具有层局部的无监督准则，即：在每一层注入无监督训练信号可能有助于引导该层的参数向参数空间中的某些区域。


    在 [202] 中，神经网络使用样本对 $(x, x'')$ 进行训练，这些样本对要么被认为是“邻居”（或属于同一类），要么不是。考虑 $h^k(x)$ 为模型中
    $x$ 的第 $k$ 层表示。


    在每一层都定义了一个局部训练准则，根据 $x$ 和 $x''$ 是否应该为邻居（例如输入空间中的 $k$-最近邻），将中间表示 $h^k(x)$ 和 $h^k(x'')$
    推向彼此或推开彼此。相同的准则已被成功用于通过无监督流形学习算法学习低维嵌入 [59]，但在此处 [202] 中，它被应用于神经网络的一个或多个中间层。遵循慢特征分析
    [23, 131, 204] 的思想，利用高层抽象的时间恒性来为中间层提供无监督引导：连续的帧可能包含相同的物体。


    显然，这些技术可以显著提高测试误差，至少对于所研究的任务类型是如此，但为什么呢？要问的基本问题是，这种改进基本上源于更好的优化还是更好的正则化。如后文所述，答案可能不符合优化和正则化的定义。


    在某些实验 [17, 98] 中，显而易见，没有无监督预训练的深度神经网络可以将分类误差降为零，这指向了正则化效应而非优化效应。[50] 中的实验也提供了相同方向的证据：对于相同的相同的训练误差（在训练期间的不同阶段），具有无监督预训练的测试误差系统地更低。正如
    [50] 中讨论的，无监督预训练等于对参数空间中允许解的区域进行约束。这种约束强制解“靠近-2


    2 梯度下降过程的吸引力盆。


    那些与无监督训练对应的解，即希望对应于那些捕捉了输入中显著统计结构的解。另一方面，其他实验 [17, 98] 表明，底层调优不当可能是导致预训练结果较差的原因；当顶层隐藏层受到约束（强制变得小）时，随机初始化的深度神经网络（无无监督预训练）在训练集和测试集上的表现都很差，远差于预训练的网络。在之前提到的误差归零的实验中，情况始终是：每层隐藏单元的数量（一个超参数）被允许足够足够大（以最小化验证集上的误差）。[17,
    98] 中提出的解释性假设是，当顶层隐藏层未受约束时，顶部的两层（对应于普通的 1 隐藏层神经网络）就足以拟合训练集，并使用下层计算的表示作为输入，即使该表示很差。另一方面，通过无监督预训练，底层被“更好地优化”了，较小的顶层就足以获得较低的训练误差，同时也能产生更好的泛化能力。[50]
    中描述的实验也符合这一解释：在随机参数初始化的情况下，底层（更接近输入层）训练得很差。这些实验表明，无监督预训练的效果对于深度架构的底层最为显著。


    我们从经验中知道，两层网络（一个隐藏层）通常可以被良好训练，并且从深度网络中的两层来看，它们形成了一个浅网络，其输入是下层的输出。对于常用的训练准则，优化深度神经网络的最后一层是一个凸优化问题。优化最后两层虽然不是凸的，但已知其比优化深度网络要容易得多（事实上，当隐藏单元的数量趋于无穷大时，两层网络的训练准则可以被构造为凸
    [18]）。


