    of AI, we put forward a number of requirements we believe to be important for
    learning algorithms to approach AI, many of which motivate the research are here:


    - Ability to learn complex, highly-varying functions, i.e., with a number of variations
    much greater than the number of training examples.

    - Ability to learn with little human input the low-level, intermediate, and high-level
    abstractions that would be useful to represent the kind of complex functions needed
    for AI tasks.

    - Ability to learn from a very large set of examples: computation for training
    should scale well with the number of examples, close to linearly.

    - Ability to learn from mostly unlabeled data, i.e., to work in the semi-supervised
    setting, where not all the examples come with complete and correct semantic labels.

    - Ability to exploit the synergies present across a large number of tasks, multi-task
    learning. These synergies exist because all the AI tasks provide different views
    on the same reality.

    - Strong unsupervised learning (i.e., capturing most of the statistical structure
    in the observed data), which seems essential in the limit of a large number of
    tasks and when future tasks are not known ahead of time.


    Other elements are equally important but connected to the material in this monograph.
    They include the ability to learn to represent context of varying length and structure
    [146], so as to allow machines to operate in a context-dependent stream of observations
    and produce a stream of actions, the ability to make decisions when actions influence
    the future observations and future rewards [181], and the ability to influence
    future observations so as to collect more relevant information about the world,
    i.e., a form of active learning [34].


    ## Outline of the Paper


    Section 2 reviews theoretical results (which can be skipped without hurting the
    understanding of the remainder) showing that an architecture with insufficient
    depth can require many more computational elements, potentially exponentially
    more (with respect to input size), than architectures whose depth is matched to
    the task. We claim that insufficient depth can be detrimental for learning. Indeed,
    if a solution to the task is represented with a very large but shallow architecture
    a lot of training examples may be needed to tune all of these elements and capture
    a highly varying function. Section 3.1 is also meant to motivate the reader, this
    time to highlight the limitations of local generalization and local estimation,
    which we expect to avoid using deep architectures with a distributed representation
    (Section 3.2).


    In later sections, the monograph describes and analyzes some of the algorithms
    that have been proposed to train deep architectures. Section 4 introduces concepts
    from the neural networks relevant to the task of training deep architectures.
    We first consider the previous difficulties in training neural networks with many
    layers, and then introduce deep unsupervised learning algorithms that could be
    exploited to initialize deep neural networks. Many of these algorithms (including
    those for the RBM) are related to the auto-encoder: a simple unsupervised algorithm
    for a one-layer model that captures a distributed representation for its input
    [25, 79, 156]. To fully understand RBMs and many related unsupervised learning
    algorithms, Section 5 introduces the class of energy-based models, including those
    used to build generative models with hidden variables such as the Boltzmann Machine.
    Section 6 focuses on the greedy-wise training algorithms for Deep Belief Networks
    (DBNs) [73] and Stacked Auto-Encoders (17, 153, 195). Section 7 discusses fully
    variants of RBMs and auto-encoders that have been recently proposed to extend
    and improve them, including the use of sparsity, and the modeling of temporal
    dependencies. Section 8 discusses algorithms for jointly training all the layers
    of a Deep Belief Network using variational bounds. Finally, we consider in Section
    9 forward looking questions such as the hypothesized difficult optimization problem
    involved in training deep architectures. In particular, we follow up on the hypothesis
    that part of the success of current learning strategies for deep architectures
    is connected to the optimization of lower layers. We discuss the principle of
    continuation methods, which minimize gradually smooth versions of the desired
    cost function, to make a dent in the optimization of deep architectures.


    ## Theoretical Advantages of Deep Architectures


    In this section, we present a motivating argument for the study of learning algorithms
    for deep architectures, by way of theoretical results revealing potential limitations
    of architectures with insufficient depth. This part of the monograph (this section
    and the next) motivates the algorithms described in the later sections, and can
    be skipped without making the remainder difficult to follow.


    The main point of this section is that some functions cannot be efficiently represented
    (in terms of tunable elements) by architectures that are too shallow. These results
    suggest that it would be worthwhile to explore learning algorithms for deep architectures,
    which might be able to represent some functions otherwise efficiently representable.
