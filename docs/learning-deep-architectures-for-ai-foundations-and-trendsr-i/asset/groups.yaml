    ## Local vs Non-Local Generalization


    The curse of dimensionality and the limitations of local generalization.


    A cartoon local representation for integers $i \in\{1,2,\dots,N\}$ is a vector
    $\mathbf{r}(i)$ of $N$ bits with a single $1$ and $N-1$ zeros, i.e., with $j$th
    element $\mathbf{r}(i)=\mathbf{e}_{ij}$, called the one-hot representation of
    $i$. A distributed representation for the sparse integer could be a vector of
    $\log_2 N$ bits, which is a much more compact way to represent $i$. For the same
    number of possible configurations, a distributed representation can potentially
    be exponentially more compact than a very local one. Introducing the notion of
    sparsity (e.g., encouraging many units to take the value (0)) allows for representations
    that are in between being fully (local, maximally sparse) and non-sparse (i.e.,
    dense) distributed representations. Neurons in the cortex are believed to have
    a distributed and sparse representation [139], with around 1-4% of the neurons
    active at any one time [5, 113]. In practice, we often take advantage of representations
    which are continuous-valued, which increases their expressive power. An example
    of continuous-valued local representation is one where the $i$th element varies
    according to some distance between the input and a prototype or region center,
    as with the Gaussian kernel discussed in Section 3.1. In a distributed representation
    the input pattern is represented by a set of features that are not mutually exclusive,
    and even might be statistically independent. For example, clustering algorithms
    do not build a distributed representation since the clusters are essentially mutually
    exclusive, whereas Independent Component Analysis (ICA) [11, 142] and Principal
    Component Analysis (PCA) [82] build a distributed representation.


    Consider a discrete representation $\mathbf{r}(\mathbf{x})$ for an input $\mathbf{x}$,
    where $\mathbf{r}(\mathbf{x})\in\{1,\dots,M\}$; $i\in\{1,\dots,N\}$. Each $\mathbf{r}(\mathbf{x})$
    can be seen as a classification of $\mathbf{x}$ into $\mathcal{M}$ classes. As
    illustrated in Figure 3.2 (with $M=2$, $\mathbf{r}(i)$ partitions the $x$-space
    in $\mathcal{M}$ regions, where the partitions can be combined to give rise to
    a potentially exponential number of possible intersection regions in $x$-space,
    corresponding to different configurations of $\mathbf{r}(\mathbf{x})$. Note that
    when representing a particular input distribution, some configurations may be
    impossible because they are incompatible. For example, in language modeling, a
    local representation of a word could directly encode its identity by an index
    in the vocabulary table, or equivalently a one-hot code with as many entries as
    the vocabulary size.


    On the other hand, a distributed representation could represent the word by concatenating
    in one vector indicators for syntactic features (e.g., distribution over parts
    of speech it can have), morphological features (which suffix or prefix does it
    have?), and semantic features (is it the name of an animal? etc.). In clustering,
    we construct discrete classes, but the potential number of combined classes is
    huge: we obtain what a multi-clustering and that is similar to the sense of overlapping
    clusters and partial memberships [55, 66] in the sense that cluster memberships
    are not mutually exclusive involves a heavy loss of information about the input,
    whereas clustering forms a single partition and generally provides a set of separate
    partitions of the input space. Identifying which region of each partition the
    input example belongs to is very rich, possibly not losing any information. The
    type of symbols specifying which region of each partition the input pattern might
    can be seen as a transformation of the input into a new space, where the statistical
    structure of the data and the factors of variation in it could be disentangled.
    This corresponds to the kind of partition of $x$-space that an ensemble of trees
    can represent, as discussed in the previous section. This is also what we would
    like a deep architecture to capture, but with multiple levels of representation,
    the higher levels being more abstract and representing complex regions of input
    space.


    In the realm of supervised learning, multi-layer neural networks [157, 156] and
    in the realm of unsupervised learning, Boltzmann machines [1] have been introduced
    with the goal of learning distributed internal representations in the hidden layers.
    Unlike in the linguistic example above, the objective is to let learning algorithms
    discover the features that compose the distributed representation. In a multi-layer
    neural network with more than one hidden layer, there are several representations,
    one at each layer. Learning multiple levels of distributed representations involves
    a challenging training problem, which we discuss next.


