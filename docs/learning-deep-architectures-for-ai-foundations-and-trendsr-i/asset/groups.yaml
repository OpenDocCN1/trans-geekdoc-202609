    # # 7.3 Lateral Connections


    The RBM can be made slightly less restricted by introducing interaction terms
    or "lateral connections" between visible units. Sampling **h from $P(h|x)** is
    still easy but sampling **x** from $P(x|h)$ is now generally more difficult, and
    unlike sampling from a Markov Random Field which is also a fully observed Boltzmann
    machine, in which the offsets are dependent on the value of. [141] propose such
    a model for capturing image statistics and their results suggest that Deep Belief
    Nets (DBNs) based on ordinary RBMs. generate more realistic images than DBNs.
    Their results also show that the resulting distribution has marginal and pairwise
    statistics for pixel intensities that are similar to those observed on real image
    patches.


    These lateral connections capture pairwise dependencies that can be more easily
    captured by using hidden units, saving the hidden units for capturing higher-order
    dependencies. In the case of the first layer, it can be seen that this amounts
    to a form of whitening, which has been found useful as a preprocessing step in
    image processing systems [139]. The idea proposed by [141] is to use lateral connections
    at all levels of a DBN (which can now be seen as a hierarchy of Markov random
    fields). The generic advantage of this type of approach would be that the higher
    level factors represented by the hidden units do not have to encode all the local
    "details" that the lateral connections at the levels below can capture. For example,
    when generating an image of a face, the mouth and nose must be specified at a
    high level whereas their location could be selected in order to satisfy the pairwise
    preferences encoded in the lateral connections at a lower level. This appears
    to yield generated images with sharper edges and generally more accuracy in the
    relative locations of parts, without having to expand a large number of higher-level
    units.


    In order to sample from $P(x|h)$, we can start a Markov chain in the current example
    (presumably already has pixel co-dependencies similar to those represented by
