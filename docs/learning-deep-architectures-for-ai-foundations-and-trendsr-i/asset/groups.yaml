    # 10


    # Conclusion


    This monograph started with a number of motivations: first to use learning to
    approach AI, then on the intuitive plausausibility of decomposing a problem into
    multiple levels of computation and representation, followed by theoretical results
    showing that a computational architecture that does not have enough of these levels
    can require a huge number of computational elements, and the observation that
    a learning algorithm that relies only on local generalization is unlikely to generalize
    well when trying to learn highly varying functions.


    Turning to architectures and algorithms, we first motivated distributed representations
    of the data, in which a huge number of configurations of abstract features of
    the input are possible, allowing a system to compactly represent each example,
    while opening the door to a rich form of generalization. The discussion then focused
    on the difficulty of successfully training deep architectures for learning multiple
    levels of distributed representations. Although the reasons for the failure of
    standard gradient-based methods in this case remain to be clarified, several algorithms
    have been introduced in recent years that demonstrate much better performance
    than was previously possible with simple gradient-based optimization,'
  - '[PAGE 113]


    and we have tried to focus on the underlying principles behind their success.


    Although much of this monograph has focused on deep neural net and deep graphical
    model architectures, the idea of exploring learning algorithms for deep architectures
    should be explored beyond the neural net framework. For example, it would be interesting
    to consider extensions of decision tree and boosting algorithms to multiple levels.


    Kernel-learning algorithms suggest another path which should be explored, since
    a feature space that captures the abstractions relevant to the distribution of
    interest would be just the right space in which to apply the kernel machinery.
    Research in this direction should consider ways in which the learned kernel would
    have the ability to generalize non-locally, to avoid the curse of dimensionality
    issues raised in Sec-3.1 when trying to learn a highly varying function.


    The monograph focused on a particular family of algorithms, the Deep Belief Networks,
    and their component elements, the Restricted Boltzmann Machine, and very near
    neighbors: different kinds of encoders, which can also be stacked successfully
    to form a deep architecture. We studied and connected together estimators of the
    likelihood gradient in Restricted Boltzmann machines, helping to justify the use
    of the Contrastive Divergence update for Restricted Boltzmann Machines. We highlighted
    an optimization principle that has worked well for Deep Belief Networks and related
    algorithms such as Stacked Auto-Encoders, based on a greedy, layer-wise unsupervised
    initialization of each level of the model. We found that this optimization principle
    is actually an approximation of a more general optimization principle, explored
    in so-called continuation methods, in which a series of gradually more difficult
    optimization problems are solved. This suggested new avenues for optimizing deep
    architectures, either by tracking solutions along a regularization path, or by
    presenting the system with a sequence of selected examples illustrating gradually
    more complicated concepts, in a way analogous to the way students or animals are
    trained.'
