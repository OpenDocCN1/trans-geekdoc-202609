    # Theoretical Advantages of Deep Architectures


    In this section, we present a motivating argument for the study of learning algorithms
    for deep architectures, by way of theoretical results revealing potential limitations
    of architectures with insufficient depth. This part of the monograph (this section
    and the next) motivates the algorithms described in the later sections, and can
    be skipped without making the remainder difficult to follow.


    The main point of this section is that some functions cannot be efficiently represented
    (in terms of tunable elements) by architectures that are too shallow. These results
    suggest that it would be worthwhile to explore learning algorithms for deep architectures,
    which might be able to represent some functions otherwise not efficiently representable.
    Where simpler and shallower architectures fail to efficiently represent (and hence
    to learn) a task of interest, we can hope for learning algorithms that could set
    the parameters of a deep architecture for this task.


