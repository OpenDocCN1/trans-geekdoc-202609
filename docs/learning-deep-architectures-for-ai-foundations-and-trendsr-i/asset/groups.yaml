    and ICA, or non-linear as LLE and Isomap, map each example to the same low-dimensional
    space. In light of the above argument, it would be more efficient to map each
    example to a variable-length representation. To simplify the argument, assume
    that this representation is a binary vector. If we are required to map each example
    to a fixed-length representation, a good solution would be to choose that representation
    to have enough degrees of freedom to represent the vast majority of the examples,
    while at the same allowing to compress fixed-length vector to a smaller variable-size
    code for most of the examples. We now have two representations: the fixed-length
