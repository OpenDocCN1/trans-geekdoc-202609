    # # 7

    ## Variants of RBMs and Auto-Encoders


    We review here some of the variations that have been proposed on the basic RBM
    and auto-encoder models to extend and improve them.

    We have already mentioned that it is straightforward to generalize the conditional
    distributions associated with visible or hidden units in RBMs, e.g., to any member
    of the exponential family [200]. Gaussian units and exponential or truncated exponential
    units have been proposed or used in [17, 51, 99, 201]. With respect to the analysis
    presented here, the equations can be easily adapted by simply changing the domain
    of the sum (or integral) for the $h_i$ and $x_i$. Diagonal quadratic terms (e.g.,
    to yield Gaussian or truncated Gaussian distributions) can also be added in the
    energy function without losing the property that the free energy factorizes.


    # ### 7.1 Sparse Representations in Auto-Encoders and RBMs


    Sparsity has become a concept of great interest recently, not only in machine
    learning but also in statistics and signal processing, in particular with the
    work on compressed sensing [30, 47], but it was introduced earlier in computational
    neuroscience in the context of sparse coding in'
  - '[PAGE 77]


    # 7.1 Sparse Representations in Auto-Encoders and RBMs


    the visual system [139], and has been a key element deep convolutional networks
    exploiting of a variant of auto-encoders [121, 150, 151, 152, 153] with a sparse
    distributed representation, and has become a key ingredient in Deep Belief Networks
    [110].


    # 7.1.1 Why a Sparse Representation?


    We argue that if one is going to go fixed-size representations, then sparse representations
    are more efficient (than non-sparse ones) in an information-theoretic sense, allowing
    for varying the effective number of bits per example. According to learning theory
    [117, 193], to obtain good generalization it is enough that the total number of
    bits needed to encode the whole training set be small, compared to the size of
    the training set. In many domains of interest different examples require different
    number of bits when compressed.


    On the other hand, dimensionality reduction algorithms, whether linear as PCA
    and ICA, or non-linear as LLE and Isomap, map each example to the same low-dimensional
    space. In light of the above argument, it would be more efficient to map each
    example to a variable-length representation. To simplify the argument, assume
    that this representation is a binary vector. If we are required to map each example
    to a fixed-length representation, a good solution would be to choose that representation
    to have enough degrees of freedom to represent the vast majority of the examples,
