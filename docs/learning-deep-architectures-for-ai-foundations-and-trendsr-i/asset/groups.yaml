    # 局部与非局部泛化


    初始化一个确定性的非线性变换（多层神经网络）来计算特征向量（数据的一个新特征空间），并可以使用基于梯度的优化对该变换进行调整，以最小化高斯过程产生的预测误差。特征空间可以被看作数据的学习表示。良好的表示会将具有相似抽象特征的示例聚集在一起，而这些特征是数据分布的相关变异因素。深层架构的学习算法可以看作是核机器学习良好特征空间的方法。


    考虑目标函数中的一个方向 $\mathbf v$，在该方向上，目标函数 $f$（学习者理想上应该捕捉的内容）在一系列“波峰”中起伏（即随着 $f(x+\alpha
    v)$ 越过零点、变为正值、变为负值等）。根据 [165], [13,19] 的研究，对于使用高斯核的核机器，所需的示例数量随待学习目标函数中“波峰”的数量呈线性增长。它们还表明，对于像奇偶函数（parity
    function）这样变化剧烈的函数，使用高斯核机器达到某些误差率所需的示例数量相对于输入域呈指数级增长。对于仅依赖目标函数是局部平滑这一先验假设的学习器（例如高斯核机器），在一个方向上学习具有多次符号变化的函数在根本上是非常困难的（需要巨大的
    VC 维和相应的大数量示例）。然而，学习其他类别的函数可能是行的，因为这些函数中的变异模式可以被捕捉（一个平凡的例子是变异是周期性的，且函数类包含了近似匹配的周期性函数）。


    对于高维中的复杂任务，使用局部核方法时，决策表面的复杂性可能会迅速使学习变得不可行。也可以认为，如果曲线具有许多变化，且这些变化并非通过底层的正则性相互联系，那么任何学习算法都不会比输入空间中局部的估计器好多少。然而，寻找这些变异更紧凑的表示可能是值得的，因为如果能找到，它可能会导致更好的泛化能力，特别是对于训练集中未出现过的变异。


    # 3.1 局部模板匹配的局限性


    本课程的后续只有在目标函数中存在可以捕捉的底层正则性时才可能；我们预计这种属性在 AI 任务中成立。


    输入空间中局部的估计器不仅存在于上述的无监督学习算法中，还存在于无监督和半监督算法中，例如局部线性嵌入 [155]、Isomap [158]核主成分分析 [168]（或核
    PCA）、拉普拉斯特征映射 [10]流形投影 [26]谱聚类算法 [199] 以及基于核的非参数半监督算法 [9, 44, 209, 210]。这些无监督和半监督算法大部分依赖于*邻域图*：一种每个示例一个节点且近邻之间有弧的图。通过这些算法，我们可以对它们的操作产生几何直觉，也可以理解它们作为局部估计器如何阻碍性能。这通过流形学习中的图
    3.1 示例所示。在这里再次发现为了


    ![](img/9b96758870b18b40e2196245f674a1e8_27_0.png)


    图 3.1 与同一物体类别相关的图像集形成了一个流形或一组不相交的流形，即维度低于原始图像空间的区域。通过旋转或缩放（例如数字 4），我们得到同一类别的其他图像，即在同一个流形上。由于流形是局部平滑的，在原理上可以用局部线性补片进行局部近似，每个补片都与流形相切。遗憾的是，如果流形曲率很大，则要求的补片非常小，且相对于流形维度可能需要指数级的补片。图中慷慨提供的图由
    Pascal 覆盖了待学习的许多变异。


    最后让我们考虑基于邻域图的算法 [9, 44, 209, 210]。这些算法将邻域图划分为具有恒定标签的区域。可以证明，达到某些误差率所需的示例数量相对于恒定标签的区域呈指数级增长。对于目标函数中的变异，需要相应数量的恒定标签示例。


    决策树 [28] 是研究最充分的学习算法之一。由于它们关注输入变量的子集，起初看起来是非局部的。然而，通过对空间进行划分，它们也是局部估计器。这意味着它们的泛化性能随目标函数中变异数量的增加而下降。理论分析
    [14] 显示，对于某些类函数，达到给定误差率所需的训练示例相对于维度呈指数级。这种分析建立在计算复杂性文献 [41] 中利用的类似方法之上。这些结果也与之前的实验结果一致
    [143]。


    树集成（例如提升树 [52] 和森林 [80]）比单棵树更强大。它们在架构中增加了一个第三层，使得模型能够在参数数量呈指数级关系的区域中进行区分。如图 3.2
