    in Section 5.3.1. By starting from a representation **h^{l-1}** obtained from
    a training set example (through the $Q$''s as above), fewer Gibbs steps might
    be required.


    +   2. For $k = \ell - 1$ down to 1, sample **h^k** according to the level-$k$
    hidden-to-visible conditional distribution $P(h^k|h^{k-1}).$.


    +   3. **x = h^0** is the DBN sample.


    # 6.2 Training Stacked Auto-Encoders


    Auto-Encoders have been used as building blocks to build and initialize a deep
    multi-layer neural network [17, 99, 153, 195]. The training procedure is similar
    to the one for Deep Belief Networks:


    +   1. Train the first layer as an auto-encoder to minimize some form of reconstruction
    error of the raw input. This is purely unsupervised.


    +   2. The hidden units'' outputs (i.e., the codes) of the auto-encoder are now
    used as input for another layer, also trained to be an auto-encoder. Again, we
    only need unlabeled examples.


    +   3. Iterate in step (2) to initialize the desired number of additional layers.


    +   4. Take the last hidden layer output as input to a supervised layer and initialize
    its parameters (either randomly or by supervised training, keeping the rest of
    the network fixed).


    +   5. Fine-tune all the parameters of this deep architecture with respect to
    the supervised criterion. Alternately, unfold all the auto-encoders into a very
    deep auto-encoder and fine-tune the global reconstruction error, as in [75].'
