    偏离第一 RBM 的边际 $Q(h^1)$ 越来越远，后验概率 $P(h^1|\mathbf{x})$（来自 DBN）和 $Q(h^1|\mathbf{x})$（来自
    RBM）可能会偏离越来越远（因为 $P(h^1|\mathbf{x})Q(\mathbf{x})P(h^1)$ 和 $Q(h^1|\mathbf{x})Q(\mathbf{x})Q(h^1)$），使得方程
