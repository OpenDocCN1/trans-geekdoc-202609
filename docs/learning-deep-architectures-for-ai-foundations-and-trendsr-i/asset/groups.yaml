    ```

    $P(\mathbf{h}|\mathbf{x}) = \prod_i P(h_i|\mathbf{x}) \quad (5.23)$

    ```


    ### 5.3.1 Gibbs Sampling in RBMs


    Sampling from an RBM is useful for several reasons. First of all it is useful
    in learning algorithms, to obtain an estimator of the log-likelihood gradient.
    Second, inspection of examples generated from the model is useful to get an idea
    of what the model has captured or not about the data distribution. Since the joint
    distribution of the top two layers of a DBN is an RBM, sampling from an RBM enables
    us to sample from a DBN, as elaborated in Section 6.1.


    Gibbs sampling in fully connected Boltzmann Machines is slow because there are
    many sub-steps in the Gibbs chain as there are units in the network. On the other
    hand, the factorization enjoyed by RBMs brings two benefits: first we do not need
    to sample in the positive phase have the free energy (and therefore its gradient)
    computed analytically; second, the set of variables in $(\mathbf{x}, \mathbf{h})$
    can be sampled in two sub-steps in each step of the Gibbs chain. We first sample
    $\mathbf{h}$ given $\mathbf{x}$, and then a new $\mathbf{x}$ given $\mathbf{h}$.

