    交互进行更高容量的建模，可能是非参数的，例如逐渐向 $\eta_{i,j}$ 添加项以更好地建模交互。此外，从条件密度 $P(\mathbf{x}_j|\mathbf{h})$
    或 $P(\mathbf{h}_i|\mathbf{x})$ 采样是足够易处理的函数，仅仅因为这些是一维密度，通过高效采样和数值积分可以容易地计算在嵌套子区间或箱（bins）上密度的累积和。


    这种分析也凸显了 RBM 的基本局限性，即其参数化仅考虑了变量之间的两两交互。正因为 $\mathbf{h}$ 是隐藏的，并且因为我们可以选择隐藏单元的数量，我们仍然对
    $\mathbf{x}$ 中可能的边缘分布具有完全的表达能力（事实上，我们可以表示任何离散分布 [102]）。第 7.4 节中讨论的 RBM 其他变体允许三三交互。


