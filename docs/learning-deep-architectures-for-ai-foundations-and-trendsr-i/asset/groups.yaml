    RBM 初始化深度玻尔兹曼机器时，保留 RBM 权重。非常有趣的一点是，深度玻尔兹曼机器的 RBM 初始化对于获得所报道的良好结果至关重要。作者对玻尔兹曼机器的正相位梯度和负相位梯度提出了近似方法（见第
    5.2 节和等式 (5.16)）。

