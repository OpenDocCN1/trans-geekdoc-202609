    # 基于能量的模型与玻尔兹曼机


    [12] 证明了如何对任何 $t \ge 1$ 的对数似然梯度进行扩展。


    **定理 5.1.** 考虑从数据点 $\mathbf{x}_1$ 开始的收敛吉尔布斯链 $\mathbf{x}_1 \Rightarrow \mathbf{h}_1
    \Rightarrow \mathbf{x}_2 \to \dots$。对数似然梯度可以为：


    $$\frac{\log P(\mathbf{x}_1)}{\partial \theta} = -\frac{\partial FreeEnergy(\mathbf{x}_1)}{\partial
    \theta} + E\left[\frac{\partial FreeEnergy(\mathbf{x}_1)}{\partial \theta}\right]
    + E\left[\frac{\partial P(\mathbf{x}_1)}{\partial \theta}\right] (5.28)$$


    且最后一项随着 $t$ 趋于无穷大收敛于零。


    由于最后一项随着 $t$ 的增加而变小，通过在马尔可夫链中将链截断为 $k$ 步，使用近似方法：


    $$\frac{\log P(\mathbf{x}_1)}{\partial \theta} \simeq -\frac{\partial FreeEnergy(\mathbf{x}_1)}{\partial
    \theta} + E\left[\frac{\partial FreeEnergy(\mathbf{x}_{k+1})}{\partial \theta}\right]$$


    当我们将期望替换为样本 $\tilde{\mathbf{x}} = \mathbf{x}_{k+1}$ 时，这正是 CD-k 更新（方程 (5.27)）。这告诉我们
    CD-k 的偏置为 $E[\frac{\partial P(\mathbf{x}_{k+1})}{\partial \theta}]$。实验和理论支持这样一个观点：由于偏置较小，CD-k
    比 CD$(k-1)$ 具有更好且更快的收敛（从迭代次数而言），尽管计算开销可能并不划算。虽然实验显示当 $k$ 较小时 CD-k 的偏置可能很大，但从经验上看，CD-k
    的更新规则仍然将模型参数移动到与对数似然梯度相同的象限内 [12]。这与即使在 $k=1$ 时也能获得良好的结果是一致的。一个有助于理解这一现象的直观图是：当使用输入示例
    $\mathbf{x}_1$ 初始化链时，每个马尔可夫链步骤（到 $\mathbf{x}_2$）相对于 $\mathbf{x}_1$ 倾向于处于正确的方向，即大致从
    $\mathbf{x}_1$ 沿着能量景观下降。由于梯度取决于 $\mathbf{x}_2$ 和 $\mathbf{x}_1$ 之间的变化，我们倾向于得到梯度的方向。


    因此，CD-1 对应于两个样本后截断链（一个来自 $\mathbf{h}_1$，另一个来自 $\mathbf{x}_2|\mathbf{h}_1$）。在第一个样本（即
    $\mathbf{h}_1|\mathbf{x}_1$）后停止如何？可以从以下对数似然梯度展开 [12] 进行分析：


    $$\frac{\partial \log P(\mathbf{x}_1|\mathbf{h}_1)}{\partial \theta} = E \left[\frac{\partial
    \log P(\mathbf{x}_1|\mathbf{h}_1)}{\partial \theta}\right] - E \left[\frac{\partial
    \log P(\mathbf{h}_1)}{\partial \theta}\right]. (5.29)$$


    让我们考虑第一个期望的均场近似，这里不再根据 $P(\mathbf{h}_1|\mathbf{x}_1)$ 对所有 $\mathbf{h}_1$ 配置取平均，而是使用其平均配置
    $\mathbf{h}_1 = E[\mathbf{h}_1|\mathbf{x}_1]$，得到：


    $$\frac{\partial \log P(\mathbf{x}_1|\mathbf{h}_1)}{\partial \theta} \approx E\left[\frac{\partial
    \log P(\mathbf{x}_1|\mathbf{h}_1)}{\partial \theta}\right]. (5.30)$$


    如果我们像 CD 那样忽略方程 (5.29) 中的期望（这会对对数似然梯度的估计引入额外的偏置），那么我们得到方程 (5.30) 的右侧作为更新方向，它是*重构*误差的梯度：


    $-\log P(\mathbf{x}_1|\mathbf{h}_1)$


    通常用于训练自动编码器（见方程 (4.7)，$\mathbf{c} = E[\mathbf{h}_1]$）^。


    我们发现，吉尔布斯链的截断产生了重构误差的第一阶近似（通过有偏的均场近似），对于 CD-1 产生了略微更好的近似（两个样本，通过样本近似期望），而对于 CD-k
    则有更多项（仍然通过样本近似期望）。注意，重构误差是确定性计算的并与对数似然相关，这就是为什么在用 CD 训练 RBM 时使用它来跟踪进度。


    > ^4 在计算方程 (5.30) 均场近似的梯度时，是否考虑 $\mathbf{h}_1$ 依赖于 $\theta$ 这一事实是有争议的，但为了与自动编码器建立直接联系，这是必须。


    ## 5.4.4 模型样本是负样本


    在这里，我们认为训练能量模型可以通过解决一系列分类问题来实现，在这些问题中，试图训练示例与模型生成的样本区分开。在玻尔兹曼机和对比散度中，一个重要的元素是从模型中进行采样的能力。理解这一现象的一种优雅方式是这样的：当使用输入示例
    $\mathbf{x}_1$ 初始化链时，每个马尔可夫链步骤（到 $\mathbf{x}_2$）相对于 $\mathbf{x}_1$ 倾向于处于正确的方向，即大致从
    $\mathbf{x}_1$ 沿着能量景观下降。由于梯度取决于 $\mathbf{x}_2$ 和 $\mathbf{x}_1$ 之间的变化，我们倾向于得到梯度的方向。


