    ## 8.3 Joint Unsupervised Training of All the Layers


    ### 8.3.2 Transforming the DBN into a Boltzmann Machine


    Another approach was recently proposed, yielding in the evaluated results superior
    to the use of the Wake-Sleep algorithm [161]. After initializing each layer as
    an RBM as already discussed in Section 6.1, the DBN is transformed into a corresponding
    Boltzmann machine. Because in a Boltzmann machine each unit receives input from
    above as well as below, it is proposed to have the RBM weights when initializing
    the deep Boltzmann machine from the layerwise RBMs. It is very interesting to
    note that the RBM initialization of the deep Boltzmann machine was crucial to
    obtain the good results reported. The authors propose approximations for the positive
    phase and negative phase gradients of the Boltzmann machine (see Section 5.2 and
    Equation (5.16)). For the positive phase (which in principle requires holding
    $\mathbf{x}$ fixed and sampling from $P(\mathbf{h}|x)$), they propose a variational
    approximation corresponding to a mean-field relaxation (propagating probabilities
    associated with each unit given the others, rather than samples, and iterating
    a few dozen times to let them settle). For the negative phase (which in principle
    requires sampling from the joint $P(\mathbf{h},x)$) they propose to use the idea
    of a persistent MCMC chain already discussed in Section 5.4.1 and introduced in
    [187]. The idea is to keep states (or particles) that are updated by one Gibbs
    step according to the current model (i.e., sample each unit according to its probability
    given all the others at the previous step). Even though the parameters keep changing
    (very slowly), we continue the same Markov chain instead of starting a new one
    (as in the old Boltzmann machine algorithm algorithm [77, 1, 76]). This strategy
    seems to work well, and [161] report an improvement over DBNs on the MNIST dataset,
    both in terms of data log-likelihood (estimated using annealed importance sampling
    [163]) and in terms of classification error (after supervised fine-tuning), bringing
    down the error rate from 1.2% to 0.95%. More recently, [111] also transform the
    trained DBN into a deep Boltzmann machine in order to generate samples from it,
    and here the DBN has a convolutional structure.


    ## 9 Looking Forward


    ### 9.1 Global Optimization Strategies


    As discussed Section 4.2, part of the explanation for the better generalization
    observed with layer-local unsupervised pre-training in deep architectures could
    be that they help to better optimize the lower layers (near the input), by initializing
    supervised training in regions of parameter space associated with better unsupervised
    models. Similarly, initializing each layer of a deep Boltzmann machine as an RBM
    was important to achieve the good results reported [161]. In both settings, we
    optimize a proxy criterion that is layer-local before fine-tuning with respect
    to the whole deep architecture.


    Here, we draw connections between existing work and approaches that could help
    to deal with difficult optimization problems, based on the principle of continuation
    methods [3]. Although they provide no guarantee to obtain the global optimum,
    these methods have been particularly useful in computational chemistry to find
    approximate solutions to difficult optimization problems involving the configurations
    of molecules [35, 132, 206]. The basic idea is to first solve an easier and smoothed
    version of the problem and gradually consider less smoothing, with the intuition
    that a smooth version of the problem reveals the global picture, just like with
    simulated annealing [93]. One defines a single-parameter family of cost functions
    $C_\lambda(\theta)$ such that $C_0$ can be optimized more easily (maybe convex
    in $\theta$), while $C_1$ is the criterion that we wish to minimize. One minimizes
    $C_0(\theta)$ and then gradually increases $\lambda$ while keeping $\theta$ at
    a local minimum of $C_\lambda(\theta)$. Typical $C_0$ is a highly smoothed version
    of $C_1$, so that $\theta$ gradually moves into the basin of attraction of a dominant
    (if not global) minimum of $C_1$.


    ### 9.1.1 Greedy layer-wise Training of DBNs as a Continuation Method


    The greedy layer-wise training algorithm for DBNs described in Section 6.1 can
    be viewed as an approximate continuation method, and First of recall (Section
    8.1) that the top-level RBM of a DBN can be unfolded into an infinite directed
    graphical model with tied parameters. At each step of the greedy layer-wise procedure,
    we unite the parameters of the top-level RBM from the parameters of the penultimate
    layer. So one can view the layer-wise procedure as follows. The model structure
    remains the same, an infinite chain of said layers, but we change the constraint
    on the parameters at each step of the layer-wise procedure. Initially all the
    layers are tied. After training the first RBM (i.e., optimizing under this constraint),
    we unite the first level parameters from the rest. After training the second RBM
    (i.e., optimizing under this slightly relaxed constraint), we unite the second
    level parameters from the rest, etc. Instead of a continuum of training criteria,
    we have a discrete sequence of (presumably) gradually more difficult optimization
    problems. By making the process greedy we fix the parameters of the first k layers
    after they have been trained and only optimize the (k+1)th, i.e., train an RBM.
    For this we would need to initialize the weights of the newly added RBM with the
    transpose of the previous one. Note also that instead of optimizing all the parameters,
    the greedy layer-wise approach only optimizes the new ones. But even with these
    approximations, this analysis suggests an explanation for the good performance
    of the layer-wise training approach in terms of reaching better solutions.

