    ## Abstract


    Theoretical results suggest that in order to learn the kind of complicated functions
    that can represent high-level abstractions (e.g., in vision, language, and other
    AI-level tasks), one may need *deep architectures*. Deep architectures are composed
    of multiple levels of non-linear operations, as in neural nets with many hidden
    layers or in propositional formulae re-using many sub-formulae. Searching the
    parameter space of deep architectures is a difficult task, but learning algorithms
    as those for Deep Belief Networks have recently been proposed to tackle this problem
    with notable success, beating the state-of-the-art in certain areas. This monograph
    discusses the motivations and principles regarding learning algorithms for deep
    architectures, in particular those exploiting as building blocks unsupervised
    learning of single-layer models such as Restricted Boltzmann Machines, used to
    construct deeper models such as Deep Belief Networks.


    # 1 Introduction


    Allowing computers to model our world well enough to exhibit what we call intelligence
    has been the focus of more than half a century of research. To achieve this, it
    is clear that a large quantity of information about our world should be stored,
    explicitly or implicitly, in the computer. Because it seems daunting to formalize
