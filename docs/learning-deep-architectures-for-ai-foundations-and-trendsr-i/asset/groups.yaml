    ## 局部与非局部泛化


    维度灾难与局部泛化的局限性。


    整数 $i \in\{1,2,\dots,N\}$ 的一种卡通局部表示是一个包含 $N$ 位的向量 $\mathbf{r}(i)$，其中包含一个 $1$ 和
    $N-1$ 个 $0$，即第 $j$ 个元素为 $\mathbf{r}(i)=\mathbf{e}_{ij}$，称为 $i$ 的独热表示。对于稀疏整数，其分布式表示可以是一个包含
    $\log_2 N$ 位的向量，这是表示 $i$ 的一种紧凑得多的方法。对于相同数量可能配置，分布式表示的紧凑程度可能比非常局部的指数级。引入稀疏性概念（例如，鼓励许多单元取值为
    (0)）允许产生介于完全（局部、极大稀疏）和非稀疏（即密集）分布式表示之间的表示。皮层中的神经元被认为具有分布且稀疏的表示 [139]，任何时刻约有1-4%的神经元处于激活状态
    [5, 113]。在实践中，我们经常利用连续值的表示，这增加了它们的表达能力。连续值局部表示的一个例子是，第 $i$ 个元素根据输入与原型或区域中心之间的某种距离而变化，如
    3.1 节讨论的高斯内核所示。在分布式表示中，输入模式由一组不互斥的特征表示，甚至可能在统计上是独立的。例如，聚类算法并不构建分布式表示，因为类本质上是互斥的，而独立成分分析
    (ICA) [11, 142] 和主成分分析 (PCA) [82] 则构建了分布式表示。


    考虑输入 $\mathbf{x}$ 的离散表示 $\mathbf{r}(\mathbf{x})$，其中 $\mathbf{r}(\mathbf{x})\in\{1,\dots,M\}$；$i\in\{1,\dots,N\}$。每个
    $\mathbf{r}(\mathbf{x})$ 都可以看是将 $\mathbf{x}$ 分为 $\mathcal{M}$ 类。如图3.2 所示（当 $M=2$
    时，$\mathbf{r}(i)$ 将 $x$ 空间划分为 $\mathcal{M}$ 个区域，这些划分可以组合产生 $x$ 空间中可能的指数级数量的交集区域，对应于
    $\mathbf{r}(\mathbf{x})$ 的不同配置）。注意，在表示特定的输入分布时，某些配置是不可能的，因为它们互不兼容。例如，在语言建模中，单词的局部表示可以通过词汇表中的索引直接编码其身份，或者等效地使用具有与词汇表大小相同条目的独热码。


    另一方面，分布式表示可以通过在一个向量中拼接句法特征（例如，它可能拥有的词性分布）、形态特征（它具有什么后缀或前缀？）以及语义特征（它是动物的名字吗？等等）的指示器来表示单词。在聚类中，我们构建了离散的类，但组合类的的潜在组合类数量是巨大的：我们获得的是多聚类，这在与重叠类和部分成员关系
    [55, 66] 的意义上是类似的，即类成员关系不是互斥的，这导致了关于输入信息的严重损失；而聚类形成了一个单一的划分，并通常提供输入空间的一系列独立划分。识别输入示例属于每个划分的哪一个区域是非常丰富的，可能不会丢失任何信息。指定输入模式可能属于每个划分中哪个区域的符号类型可以被视为输入到新空间的变换，在该空间中，数据的统计结构和变化因子可以被解耦。这对应于上一节讨论的树森林可以表示的
    $x$ 空间划分类型。这也是我们希望深度架构捕捉的，但具有多个层级的表示，较高层级更抽象，并代表输入空间的复杂区域。


