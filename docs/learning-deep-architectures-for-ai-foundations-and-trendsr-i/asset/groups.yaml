    # 10

    ## 结论


    本专著的编写基于多项动机：首先是利用学习来接近人工智能；其次是由于将问题分解为多个层级的计算和表示在直觉上是合理的；随后是一些理论结果，它们证明了不具备足够这些层级的计算架构可能需要大量的计算元素；而且观察到，仅依赖局部泛化的学习算法在尝试学习高度变异函数时，不太可能实现良好的泛化。


    转向架构和算法，我们首先对数据的分布式表示提出了动力性，在这种表示中，输入的抽象特征可能存在大量配置，允许系统能够紧凑地表示每个示例，同时为丰富的泛化形式打开了大门。随后的讨论集中在成功训练用于学习多级分布式表示的深度架构的难度。尽管标准基于梯度的方法在这种情况下失败的原因仍有待澄清，但近年来引入的几种算法展示了比以往简单基于梯度的优化优得多的性能，我们尝试关注这些算法背后的底层原理。


    尽管本专著的大部分内容集中在深度神经网络和深度图模型架构上，但探索深度架构学习算法的思想应当扩展到神经网络框架之外。例如，考虑将决策树和提升算法（boosting
    algorithms）扩展到多个层级将很有趣。


    核学习算法提供了另一条应当探索的路径，因为捕捉与感兴趣的分布相关的抽象特征空间正是应用核机制的恰当空间。这一方向的研究应该考虑使学习到的核具有非局部泛化的能力，以避免第
    3.1 节中提到的在尝试学习高度变异函数时提出的维度灾数问题。


    本专著专注于一类特定的算法——深度信念网络（Deep Belief Networks），及其组件元素受限玻尔兹曼机（Restricted Boltzmann
    Machine），以及近邻领域：不同类型的编码器，这些编码器也可以成功地堆叠形成深度架构。我们研究并连接了受限玻尔兹机中似然梯度的估计器，有助于证明在受限玻尔兹机中使用对比散度（Contrastive
    Divergence）更新的合理性。我们强调了一种深度深度网络以及堆叠自动编码器（Stacked Auto-Encoders）等相关算法有效的优化原理，该原理基于模型每一层的贪婪、逐层无监督初始化。我们发现这种优化原理实际上是更通用优化原理的近似，这种原理在所谓的延续法（continuation
    methods）中被探索，在这些方法中，解决了一系列逐渐变难的优化问题。这为优化深度架构提供了新途径，要么通过沿着正则化路径跟踪解，要么向系统呈现一系列选定的示例以展示逐渐变得复杂的概念，这种方式类似于学生或动物的受训练的方式。


    # 致谢


    作者特别感谢 Yann LeCun, Aaron Courville, Olivier Delalleau, Dumitru Erhan, Pascal Vincent,
    Geoffrey Hinton, Joseph Turian, Hugo Larochelle, Nicolas Le Roux, Jérôme Louradour,
    Pascal Lamblin, James Bergstra, Pierre-Antoine Manzagol 和 Xavier Glorot 的启发和建设性建议。本研究得益
    NSERC、MITACS 和加拿大研究教授项目的资助。


