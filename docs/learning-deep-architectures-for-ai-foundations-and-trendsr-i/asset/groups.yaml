    1.1 How Do We Train Deep Architectures 5


    prior knowledge about the world to explain the observed variety of images, even
    for such as an apparently simple abstraction as MAN, illustrated in Figure 1.1.
    A high-level abstraction such as MAN has the property that it corresponds to a
    very large set of possible images, which might be very different from each other
    from the point of view of simple Euclidean distance in the space of pixel intensities.
    The set of images in pixel space that label could be appropriate a highly convoluted
    region in pixel space that is not necessarily a connected region. The MAN category
    can be seen as a high-level abstraction here can be a category (such as MAN category)
    or a feature, a function of sensory data, which can be discrete (e.g., the input
    sentence is at a past tense) or continuous (e.g., the input video shows an object
    moving at 2 meter/second). Many lower-level and intermediate-level concepts (which
    we also call abstractions here) would be useful to construct a MAN-detector. Lower
    level abstractions are more directly tied to particular concepts, whereas higher
    level ones are what we call “more abstract” because their connection to actual
    concepts is more remote, and through other, intermediate-level abstractions.


    In addition to the difficulty of coming up with the appropriate abstractions,
    the number of visual and semantic categories (such as MAN) that we would like
    an “intelligent” machine to capture is rather large. The focus of deep architecture
    learning is to automatically discover abstractions, from the lowest level to the
    highest level concepts. Ideally, we would like learning algorithms that enable
    this discovery with as little human effort as possible, i.e., without having to
    manually define all necessary abstractions or having a huge set of hand-labeled
    examples. If these algorithms could tap into the huge resource of text and images
    on the web, it would certainly help to transfer much of human knowledge into machine-interpretable
    form.


    # 1.1 How Do We Train Deep Architectures?


    Deep learning methods aim at learning feature hierarchies with features from higher
    levels of the hierarchy formed by the composition of'
  - '[PAGE 8]


    # Introduction


    lower level features. Automatically learning features at multiple levels of abstraction
    allow a system to learn complex functions mapping the input to output directly
    from data, without depending completely on human-crafted features. This is especially
    important for higher-level abstractions, which humans often do not know how to
    specify in terms of raw sensory input. The ability to automatically learn powerful
    features will become increasingly important as the amount of data and range of
    applications to learning methods continues to grow.


    Depth of architecture refers to the number of levels of composition of non-linear
    operations in the function learned. Whereas most current learning algorithms correspond
    to shallow architectures (1, 2 or 3 levels), the mammalian brain is organized
    in a deep architecture [173] with given input present at multiple levels of abstraction,
    each level corresponding to a different area of cortex. Humans often describe
    such concepts in hierarchical ways, with multiple levels of abstraction. The brain
    also appears to process information through multiple stages of transformation
    and representation. This is particular clear in the primate visual system [173],
    with its sequence of processing stages: detection of edges, primitive shapes,
    and moving up to gradually complex visual shapes.


    Inspired by the architectural depth of the brain, neural network researchers have
    wanted for decades to train deep multi-layer neural networks [19, 191], but no
    successful attempts were reported before 2006: researchers posted experimental
    results with typically two or three levels (i.e., one or two hidden layers), but
    training deeper consistently yielded poorer results. Something that can be considered
    a breakthrough happened in 2006: Hinton et al. at University of Toronto introduced
    Deep Belief Networks (DBNs) [73], with a learning algorithm that greedily trains
    one layer at a time, exploiting an unsupervised learning algorithm for each layer,
    a Restricted Boltzmann Autoencoder (RBM) [51]. Shortly after, related algorithms
    based on auto-encoders were proposed [17, 153], apparently exploiting the


    > Except for neural networks with a special structure called convolutional networks,
    discussed in Section 4.5.'
  - '[PAGE 9]


    1.2 Sharing Features and Abstractions Across Tasks 7


    same principle: guiding the training of intermediate levels of representation
    using unsupervised learning, which can be performed locally at each level. Other
    algorithms for deep architectures were proposed recently that exploit RBMs not
    auto-encoders and that exploit the same principle [131, 202] (see Section 4).


    Since 2006, deep networks have been applied with success not only in classification
