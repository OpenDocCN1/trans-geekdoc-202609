    as the dominant learning approach. However, recent work has shown that short chains
    can sometimes be used successfully, and this is the principle of Contrastive Divergence,
    discussed in Section 5.4 to train RBMs. Note also that the negative phase does
    not have to be restarted for each new example $x$ (since it does not depend on
