    \ case is where $y$ can only take values in a small discrete set, i.e.,\n\n$P(y|\\\
    mathbf{x}) = \\sum e^{-Energy(\\mathbf{x},y)}.$ \n\n(5.14)\n\nIn this case the\
    \ gradient of the conditional log-likelihood with respect to parameters of the\
    \ energy function can be computed efficiently. This formulation applies to a discriminant\
    \ of the RBM called Discriminative RBM [97]. Such conditional energy-based models\
    \ have also been exploited in a series of probabilistic language models based\
    \ on neural networks [15, 16, 130, 169, 170, 171, 207]. That formulation (or generally\
    \ when it is easy to sum or maximize over the values of the terms of the partition\
    \ function) has been explored at length [37, 106, 149, 153]. An important and\
    \ interesting element in the latter is that it shows that energy-based models\
    \ can be optimized not just with respect to log-likelihood but with respect to\
    \ more general criteria whose gradient has the property of making the energy of\
    \ \"correct\" responses decrease while making the energy of competing responses\
    \ increase. These energy functions do not necessarily give rise to a probabilistic\
    \ model (because the exponential of the negated energy function is not required\
