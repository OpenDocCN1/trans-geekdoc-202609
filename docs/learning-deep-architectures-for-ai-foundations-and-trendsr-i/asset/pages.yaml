    # 8.2 Variational Justification of Greedy Layer-wise Training


    Here, we discuss the argument made by [73] that adding one RBM layer improves
    the likelihood of a DBN. Let us suppose we have trained an RBM to model $x$, which
    provides us with a model $Q(x)$ expressed through two conditionals $Q(h^1|x)$
    and $Q(x|h^1)$. Exploiting the argument in the previous subsection, let us now
    initialize an equivalent two-layer DBN, i.e., generating $P(x)=Q(x)$, by taking
    $P(h^1|x)=Q(h^1|x)$ and $P(h^1|h^1)$ by a second-level RBM. Now let us come back
    to Equation (8.1) above, and the objective of improving the DBN likelihood by
    changing $P(h^1|x)$, keeping $P(h^1|x)$ and $Q(x|h^1)$ fixed. Interestingly, the
    KL divergence increases. Starting from $P(h^1|x)=Q(h^1|x)$, the KL term is zero
    (i.e., can only increase) and the entropy in Equation (8.1) does not depend on
    the DBN $P(h^1)$, so small improvements to the term with $P(h^1)$ an increase
    in $\log P(x)$. We are also guaranteed that further improvements of the $P(h^1)$
    term (i.e., further training of the second RBM, detailed below) cannot bring the
    log-likelihood lower than it was before the second RBM was added. This is simply
    because of the positivity of the KL and entropy terms: further training of the
    second RBM increases a lower bound on the log-likelihood (Equation (8.2)), as
    argued by [73]. This justifies training the second RBM to maximize the second
    term, i.e., the expectation over the second term of $\sum_{h^1} Q(h^1|x)\log P(h^1)$.


    The second-level RBM is trained to maximize


    ```

    $$\sum_{h^1} \dot{P}(x)Q(h^1|x)\log P(h^1). \quad (8.3)$

