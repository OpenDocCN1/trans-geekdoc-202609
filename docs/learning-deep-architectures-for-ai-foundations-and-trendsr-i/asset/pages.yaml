- pgno: 20
  md: '# Theoretical Advantages of Deep Architectures


    Of particular interest is the following theorem, which applies to monotone weighted
    threshold circuits (i.e., multi-layer neural networks with linear threshold units
    and positive weights) when trying to represent a function representable with a
    depth $k$ circuit:


    **Theorem 2.1.** A monotone weighted threshold circuit of depth $k-1$ computing
    a function $f_k \in F_{k,N}$ has size at least $2^{cN}$ for some constant $c >
    0$ and $N > N_0$ [63].


    The class of $f_{k,N}$ is defined as follows. It contains functions with $N^{2k-2}$
    inputs, defined by a depth $k$ circuit that is tree. At the leaves of the tree
    there are ungated input variables, and the function value is at the root. The
    $i$-th level from the bottom consists of AND gates when $i$ is even and OR gates
    when $i$ is odd. The fan-in at the top and bottom level is $N$ and at all levels
    it is $N^2$.


    The above results do not prove that other classes of functions (such as those
    we want to learn for AI tasks) require deep architectures, however, these theoretical
    results belong to types of circuits. However, they raise the question: are the
    depth 1, 2 and 3 architectures (typically found in machine learning algorithms)
    too shallow to represent efficiently more complicated functions of the kind needed
    for AI tasks? Results such as the above theorem also suggest that *there might
    be no universally right depth* for each function (i.e., each task) might require
    a particular minimum depth (for a given set of computational elements). We should
    therefore strive to develop deep learning algorithms that use the data to determine
    the depth of the final architecture. Note also that recursive computation defines
    a computation graph whose depth increases linearly with the number of iterations.


    # **2.2 Informal Arguments**


    Depth of architecture is connected to the notion of highly varying functions.
    We argue that, in general, deep architectures can compactly represent highly varying
    functions which would otherwise require a very large size to be represented with
    an inappropriate architecture. We say'
