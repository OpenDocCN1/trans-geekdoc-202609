    RBM. The interesting observation is that there exists a DBN whose $\mathbf{h}^1$
    marginal equals the first RBM''s $\mathbf{h}^1$ marginal, i.e., $P(h^1) = Q(h^1)$,
    as the dimension of $\mathbf{h}^2$ matches the dimension of $\mathbf{h}^0 = \mathbf{x}$.
    To see this, consider a second-level RBM whose weight matrix is the transpose
    of the first-level RBM (that is why we need the matching dimensions). Hence, by
    symmetry of the roles of visible and hidden in an RBM joint distribution (when
    transposing the second matrix), the marginal distribution over the visible vector
    of the second RBM is equal to the marginal distribution $Q(\mathbf{h}^1)$ of the
    hidden vector of the first RBM.'
