    gradient (such as the one obtained from CD-$k$) and small initial weights is again
    close to a continuation method, and could easily be turned into one. Consider
    the family of optimization problems corresponding to the regularization path [64]
    for RBM, e.g., with $\ell_2$ regularization of the parameters, the family of training
    criteria parametrized by $\lambda \in \{0,1]$:


    ```

    $C_{\lambda}(\theta) =-\sum \log P_{\theta}(\mathbf{x}_i) - ||\theta||^2 \log
    \lambda. \quad (9.1)$

    ```


    When $\lambda \to 0$, we have $\theta \to 0$, and it can be shown that the RBM
    loglikelihood becomes convex in $\theta$. When $\lambda \to 1$, there is no regularization
    (note that some intermediate value of $\lambda$ might be better in terms of generalization,
    if the training set is small). Controlling the magnitude of the offsets and weights
    in an RBM is equivalent to controlling the temperature in a Boltzmann machine
    (a scaling coefficient for the energy function). High temperature corresponds
    to a highly stochastic system, and at the limit a factorial and uniform distribution
    over the input. Low temperature corresponds to a more deterministic system where
    only a small subset of possible configurations are plausible.


    Interestingly, one observes routinely that stochastic gradient descent starting
    from small weights allows the weights to increase in magnitude, thus approximately
    following the regularization path. Early stopping is a well-known and efficient
    capacity control technique based on monitoring performance on a validation set
    during training and keeping the best parameters in terms of validation set error.
    The mathematical connection between early stopping and $\ell_2$ regularization
    (along margin) has already been established [36, 211]: starting from small parameters
    and doing gradient descent yields gradually larger parameters, corresponding to
    a gradually less regularized training criterion. However, with ordinary stochastic
    gradient descent (with no explicit regularization term), there is no guarantee
    that we would be tracking the sequence of local minima associated with a sequence
    of values of $\lambda$ in Equation (9.1). It might be possible to slightly change
    the stochastic gradient algorithm to make it track the better regularization path,
    it. (i.e., make it closer to a continuation method), by controlling $\lambda$
    explicitly, gradually increasing $\lambda$ when the optimization is near enough
    a local minimum for the current value of $\lambda$. Note that the same technique'
