  md: '# 5.4 Contrastive Divergence 63


    Another alternative to Contrastive Divergence [84, 85, 86], a general approach
    to train energy-based models in which the energy can be computed tractably, but
    not the normalization constant Z. The score function of the density $p(x)=q(x)/Z$
    is $\psi=\log p(x)/\partial\mathbf{x}$, and we exploit the fact that the score
    function of our model does not depend on its normalization constant, i.e., $\psi=\log
    q(x)/\partial\mathbf{x}$. The basic idea is to match the score function of the
    model with the score function of the empirical density. The average (under the
    empirical density) of the square norm of the difference between the two functions
    can be written in squares of the model score function and second derivatives $(\partial^2
    q(\mathbf{x}))/\partial\mathbf{x}^2$. Score matching has been shown to be locally
    consistent [84], converging if the model family matches the data generating process,
    and it has been used for unsupervised models of image and audio data [94].


    # 5.4.3 Truncations of the Log-Likelihood Gradient in Gibbs-Chain Models


    Here, approach approach Contrastive Divergence update rule from a different perspective,
    which gives rise to possible generalizations of it and links it to the reconstruction
    error often used to monitor its performance and that is used to optimize auto-encoders
    (Equation (4.7)). The inspiration for this derivation comes from [73]; first from
    the idea (explained in Section 8.1) the Gibbs chain can be associated with an
    infinite directed graphical model (where we associate with an expansion of the
    log-likelihood gradient), and second that the convergence of the chain justifies
    Contrastive Divergence (since the expected value of Equation (5.27) becomes equivalent
    to Equation (5.9) when the chain sample $\mathbf{x}$ comes from the model). In
    particular, we are interested in clarifying and understanding the bias in the
