  md: '# 2.2 Informal Arguments


    that a function is highly varying when a piecewise approximation (e.g., piecewise-constant
    or piecewise-linear) of that function would require a large number of pieces.
    A deep architecture is a composition of many operations, and it could in any case
    be represented by a very large depth-2 architecture. The composition of computational
    units in a small deep circuit can be seen as an efficient "factorization" of a
    large shallow circuit. Reorganizing the way in which units composed can have a
    drastic effect on the efficiency of representation size. For example, imagine
    a deep $k$ representation of polynomials where odd layers implement products and
    even layers implement sums. This architecture can be seen as a particularly efficient
    factorization, when expanded into a depth 2 architecture such as a sum of products,
    might require a huge number of terms in the sum: consider a level 1 product (like
    $x_2x_4$) from the depth $2k$ architecture. It could occur many times as a factor
    in terms of the depth 2 architecture. One can see in this example deep architectures
    can be advantageous if some computations (e.g., at one level) can be shared (considering
    the expanded depth 2 expression): in this case, the overall expression to be represented
    can be factored out, i.e., represented more compactly with a deep architecture.


    ![](img/9b96758870b18b40e2196245f674a1e8_21_0.png)


    Fig. 2.2 Example of polynomial circuit (with products on odd layers and sums on
    even ones) illustrating the factorization enjoyed by a deep architecture. For
    example the level-1 product $x_2x_3$ would occur many times (exponential in depth)
    in a depth 2 (sum of product) expansion of the above polynomial.'
