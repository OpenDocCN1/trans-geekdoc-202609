- pgno: 10
  md: '8 Introduction


    Each level of abstraction found in the brain consists of the “activation” (neural
    excitation) of a small subset of a large number of features that are, in general,
    not mutually exclusive. Because these features are not mutually exclusive, they
    form what is called a distributed representation [68, 156]; the information is
    not localized in a particular neuron but distributed across many. In addition
    to being distributed, it appears that the brain uses a representation that is
    sparse: only around 1-4% of the neurons are active at a given time [5, 113]. Section
    3.2 introduces the notion of sparse distributed representation and Section 7.1
    describes in more detail the machine learning approaches, some inspired by the
    observations of sparse representations in the brain, that have been used to build
    deep architectures with sparse representations.


    Whereas dense distributed representations are one extreme of a spectrum, and sparse
    representations are in the middle of that spectrum, pure local representations
    are the other. Locality of representation is intimately connected with the notion
    of local generalization. Many machine learning methods are local in input space:
    to obtain a learned function that behaves in different regions of data-space,
    they require different tunable parameters for each of these regions (see more
    in Section 3.1). Even though statistical efficiency is not necessarily poor when
    the number of tunable parameters is large, good generalization can be obtained
    only when adding some form of prior (e.g., that smaller values of the parameters
    are preferred). When prior is not task-specific, it is often one that forces the
    solution to be very smooth, as discussed at the end of Section 3.1. In contrast
    to learning methods based on local generalization, the total number of patterns
    that can be distinguished using a distributed representation scales possibly exponentially
    with the dimension of the representation (i.e., the number of learned features).


    In many vision systems, learning algorithms have been limited to specific parts
    of a processing chain. The rest of the design remains labor-intensive, which might
    limit the scale of such systems.


    On the other hand, a hallmark of what we consider intelligent machines includes
    a large enough repertoire of concepts. Recognizing MAN is not enough. We need
    algorithms that can tackle a very large'
