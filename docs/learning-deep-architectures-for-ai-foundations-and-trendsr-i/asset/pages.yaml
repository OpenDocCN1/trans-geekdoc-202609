  md: '# # 1 Introduction


    Allowing computers to model our world well enough to exhibit what we call intelligence
    has been the focus of more than half a century of research. To achieve this, it
    is clear that a large quantity of information about our world should be stored,
    explicitly or implicitly, in the computer. Because it seems daunting to formalize
    all all in a format that computers can use to answer questions and generalize
    to new contexts, many researchers have turned to learning algorithms to capture
    a large fraction of that information. Much progress has been made to understand
    and improve learning algorithms, but the challenge of artificial intelligence
    (AI) remains. Do we have algorithms that can understand scenes and describe them
    in natural language? Not really, except in very limited settings. Do we have algorithms
    that can infer enough semantic concepts to be able to interact with most humans
    using these concepts? No. If we consider image understanding, one of the best
    specified of the AI tasks, we realize that we do not yet have learning algorithms
    that can discover the many visual and semantic concepts that would seem to be
    necessary to interpret most images on the web. The situation is similar for other
    AI tasks.'
  merge: -1
