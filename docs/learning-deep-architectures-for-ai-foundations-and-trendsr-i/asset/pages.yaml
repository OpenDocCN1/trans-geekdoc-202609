  md: "# Boltzmann Machines\n\nThe Boltzmann machine is a particular type of energy-based\
    \ model with hidden variables, and RBMs are special forms of Boltzmann machines\
    \ in which $P(\\mathbf{h})$ and $P(\\mathbf{x})$ are both tractable because they\
    \ factorize. In a Boltzmann machine [1, 76, 77], the energy function is a general\
    \ second-order polynomial:\n\n```\n$Energy(\\mathbf{x}, \\mathbf{h}) = -\\mathbf{b}^\t\
    op\\mathbf{x} - \\mathbf{c}^\top\\mathbf{h} - \\mathbf{h}^\topW\\mathbf{x} - \\\
    mathbf{x}^\topU\\mathbf{h} - hVh. \\quad (5.15)$\n```\n\nThere are two types of\
    \ parameters, which we collectively denote by $\theta$: the offsets $\\mathbf{b}$\
    \ and $\\mathbf{c}$ (each associated with a single element of the vector $\\mathbf{x}$\
    \ or $\\mathbf{h}$), and the weights $W_{ij}$, $U_{ij}$ and $V_{ij}$ (each associated\
    \ with a pair of units). $U$ and $V$ are assumed to be symmetric,$1$ and in most\
    \ models with zeros in the diagonal. Non-zeros can be used to obtain other variants,\
    \ e.g., with Gaussian instead of binomial units [200].\n\nBecause of the quadratic\
    \ interaction terms in $\\mathbf{h}$, the trick to analytically compute the energy\
    \ (Equation (5.12)) cannot be applied here. However, an MCMC (Monte Carlo Markov\
    \ Chain [4]) sampling procedure can be applied to obtain a stochastic estimator\
    \ of the gradient. The gradient of the log-likelihood can be written as follows,\
    \ starting from Equation (5.6):\n\n```\n$\\frac{\\partial\\log P(\\mathbf{x})}{\\\
    partial\\theta} = \\frac{\\partial\\sum_{\\mathbf{h}} e^{-Energy(\\mathbf{x},\\\
    mathbf{h})}{\\partial\\theta} - \\frac{1}{\\sum_{\\mathbf{h}} e^{-Energy(\\mathbf{x},\\\
    mathbf{h})}} \\frac{\\partialEnergy(\\mathbf{x},\\mathbf{h})}{\\partial\\theta}\
    \ \\\\n + \\sum_{\\mathbf{h}} e^{-Energy(\\\\hat{x},\\mathbf{h})} \\frac{\\partialEnergy(\\\
    \\hat{x},\\mathbf{h})}{\\partial\\theta} \\\\n=-\\sum_{\\mathbf{h}} P(\\mathbf{h}|\\\
    mathbf{x}) \\frac{\\partialEnergy(\\mathbf{x},\\mathbf{h})}{\\partial\\theta}\
    \ + \\sum_{\\mathbf{h}} P(\\mathbf{x},\\mathbf{h}) \\frac{\\partialEnergy(\\mathbf{x},\\\
    mathbf{h})}{\\partial\\theta} \\quad (5.16)$\n```\n\n> $1$ For example, if $U$\
    \ was not symmetric, the extra degrees of freedom would be wasted since $x_ix_{ij}\
    \ + x_jU_{ji}$ can be rewritten as $x_i(U_{ij} + U_{ji})x_j = \\frac{1}{2}(U_{ij}\
