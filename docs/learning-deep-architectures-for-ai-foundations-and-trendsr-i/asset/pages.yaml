    The hope is that the unsupervised pre-training in this greedy-wise fashion has
    put the parameters of all the layers in a region of parameter space from which
    a good¹ local optimum can be reached by local descent. This indeed appears to
    happen in a number of tasks [17, 99, 153, 195].


    The principle is exactly the same as the one previously proposed for DBNs, but
    using auto-encoders instead of RBMs. Comparative experimental results suggest
    that Deep Belief Networks typically have an edge over Stacked Auto-Encoders [17,
    99, 195]. This may be because CD-k is closer to the log-likelihood gradient than
    the reconstruction error gradient. However, since the reconstruction error has
    less variance than CD-k (because no sampling is involved), it might be interesting
    to combine the two criteria, at least in the initial phases of learning. Note
    also that the DBN advantage disappeared in experiments where the ordinary auto-encoder
    was replaced by a denoising autoencoder [195], which is stochastic (see Section
    7.2).


    An advantage of using auto-encoders instead of RBMs as the unsupervised block
    of a deep architecture is that almost any parametrization of the layers is possible,
    as long as the training criterion is continuous in the parameters. On the other
    hand, the class of probabilistic models for CD or other known tractable estimators
    of the log-likelihood gradient can be applied is currently more limited. A disadvantage
    of Stacked Auto-Encoders is that they do not correspond to a generative model:
    with generative models such as RBMs and DBNs, samples can be drawn to check qualitatively
    what has been learned, e.g., by visualizing the images or word sequences that
