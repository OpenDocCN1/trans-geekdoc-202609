    a number of examples proportional to the number of variations to be covered [21].


    Finally let us consider the case of semi-supervised learning algorithms based
    on the neighborhood graph [9, 44, 209, 210]. These algorithms partition the neighborhood
    graph in regions of constant label. It can be shown that the number of regions
    with constant label cannot be greater than the number of labeled examples [13].
    Here one needs at least as many labeled examples as there are variations of interest
    for the classification. This can be prohibitive if the decision surface of interest
    has a very large number of variations.


    Decision trees [28] are among the best studied learning algorithms. Because they
    can focus on specific subsets of input variables, at first they seem non-local.
    However, they are also local estimators in the sense of relying on a partition
    of the input space and using separate parameters for each region [14], with each
    region associated with a leaf of the decision tree. This means that they also
    suffer from the limitation discussed for other non-parametric learning algorithms:
    they need at least as many training examples as there are variations of interest
    in the target function, and they cannot generalize to new variations not covered
    in the training set. Theoretical analysis [14] shows specific classes of functions
    for which the number of training examples necessary to achieve a given error rate
    is exponential in the input dimension. This analysis is built on lines similar
    to those exploited previously in the computational complexity literature [41].
    These results are also in line with previous empirical results [143, 194] showing
    that the generalization performance of decision trees degrades when the number
    of variations in the target function increases.


    Ensembles of trees (like boosted trees [52], and forests [80, 27]) are more powerful
    than a single tree. They add a third level to the architecture which allows the
    model to discriminate among a number of regions exponential in the number of parameters
    [14]. As illustrated in Figure 3.2, they implicitly form a distributed representation
    (a notion discussed further in Section 3.2) with the output of all the trees in
    the forest. Each tree in an ensemble can be associated with a discrete symbol
    identifying the leaf/region in which the input example falls for'
