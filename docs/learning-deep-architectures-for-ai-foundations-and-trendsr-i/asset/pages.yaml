    # 4.5 Convolutional Neural Networks


    Although deep supervised neural networks were generally found too difficult to
    train before the use of unsupervised pre-training, there is one exception: convolutional
    neural networks. Convolutional nets were inspired by the visual system''s structure,
    and in particular by the models of it proposed by [83]. The first computational
    models based on these local connectivities between neurons and on hierarchical
    transformations of the image are found in Fukushima''s Neocognitron [54]. As recognized,
    when neurons with the same parameters are applied on patches of the previous layer
    at different locations, a form of translational invariance is obtained. LeCun
    and collaborators, following up on this idea, designed and trained convolutional
    networks using the error gradient, obtaining state-of-the-art performance [101,
    104] on several pattern recognition tasks. Modern understanding of the physiology
    of the visual system is consistent with the processing style found in convolutional
    networks [173], at least for the quick recognition of objects, i.e., without the
    benefit of attention and top-down feedback connections. To this day, pattern recognition
    systems based on convolutional neural networks are among the best performing systems.
    This has been shown clearly for handwritten character recognition [101], which
    has served as a machine learning benchmark for many years.$


