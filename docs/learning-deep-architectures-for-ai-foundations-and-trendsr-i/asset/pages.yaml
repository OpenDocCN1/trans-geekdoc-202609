  md: 'Another argument in favor of sparsity is that the fixed-length representation
    is going to be used as input for further processing, so that it should be easy
    to interpret. A highly compressed encoding is usually highly entangled, so that
    no subset of bits in the code can really be interpreted unless the other bits
    are taken into account. Instead, we would like our fixed-length sparse representation
    to have the property that individual bits or small subsets of these bits can be
    interpreted, i.e., correspond to meaningful aspects of the input, and capture
    factors of variation in the data. For example, with a speech signal as input,
    if some bits encode the speaker characteristics and other bits encode generic
    features of the phoneme being pronounced, we have disentangled some of the factors
    of variation in the data, and some subset of the factors might be sufficient for
    some particular prediction tasks.


    Another way to justify sparsity of the representation was proposed in [150], in
    the context of models based on auto-encoders. This view explains how one might
    get good models even though the partition function is not explicitly minimized,
    or only minimized approximately, as like other constraints (such as sparsity)
    are used on the learned representation. Suppose that the representation learned
    by an auto-encoder is sparse, then the auto-encoder cannot reconstruct every possible
    input pattern, because the number of sparse configurations is necessarily smaller
    than the number of dense configurations. To minimize the average reconstruction
    error on the training set, the auto-encoder then has to find a representation
    which captures statistical regularities of the data distribution. First of all,
    [150] connect the free energy with a function of reconstruction error (when one
