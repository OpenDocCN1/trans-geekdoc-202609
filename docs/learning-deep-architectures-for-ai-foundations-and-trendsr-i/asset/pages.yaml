  md: '# 4.6 Auto-Encoders 47


    regularization of the weights, one strategy is to add noise in the encoding. This
    is essentially what RBMs do, as we will see later. Another strategy, which was
    found very successful [46, 121, 139, 150, 152, 153], is based on sparsity constraint
    on the code. Interestingly, these approaches give rise to weight vectors that
    match well qualitatively the observed receptive fields of neurons in V1 and V2
    [110], major areas of the mammalian visual system. The question of sparsity is
    discussed further in Section 7.1.


    Whereas sparsity and regularization reduce representational capacity to avoid
    learning the identity, RBMs can have a very large capacity and still not learn
    the identity, because they are not (only) trying to encode the input but also
    to capture the statistical structure in the input, by approximately maximizing
    the likelihood of a generative model. There is a variant of auto-encoder which
    shares that property with RBMs, called denoising auto-encoder [195]. The denoising
    auto-encoder minimizes the error in reconstructing the input from a stochastically
    corrupted transformation of the input. It can be shown that it maximizes a lower
    bound on the log-likelihood of a generative model. See Section 7.2 for more details.'
