    \ an MCMC. The MCMC sampling approach introduced in [1, 76, 77] is based on *Gibbs\
    \ sampling* [4, 57]. Gibbs sampling is of the joint of $N$ variables $S = (S_1,\
    \ \\dots, S_N)$ through a sequence of $N$ sampling sub-steps of the form\n\n$s_i\
