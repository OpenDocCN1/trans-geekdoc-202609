- pgno: 106
  md: '# Looking Forward


    method, we move along the schedule when the learner has reached a local minimum
    at the current point $t$ in the schedule, i.e., when it has sufficiently mastered
    the previously presented examples (sampled from $P_t$). Making small changes in
    $t$ to smooth changes in the probability of sampling examples in the training
    distribution, so we can construct a continuous path starting from an easy learning
    problem and ending in the desired training distribution. This is developed further
    in [20], with experiments showing better generalization when training with a curriculum
    leading to a target distribution, compared to training only with the target distribution,
    on both vision and language tasks.


    There is a connection between the shaping/curriculum idea and the greedy-wise
    idea. In both cases we want to exploit the notion that a high level abstraction
    can more conveniently learned once appropriate lower-level abstractions have been
    learned. In the case of the layer-wise approach, capacity builds upon previously
    learned concepts. In the case of the curriculum, we control the training examples
    so as to sure that simpler concepts have actually learned before showing many
    examples of the more advanced concepts. Showing complicated illustrations of the
    more advanced concepts is likely to be a waste of time, as suggested by the difficulty
    for humans to grasp a new idea if they do not understand the concepts necessary
    to express that new complexity.


    With the curriculum idea we introduce a teacher, in addition to the learner and
    the training distribution or environment. The teacher can use two sources of information
    to decide on the schedule: (a) prior knowledge about a sequence of concepts that
    can more easily learned when presented in that order, and (b) monitoring of the
    learner’s progress to decide when to move on to new material from the curriculum.
    The teacher has to select a level of difficulty for new examples which is a compromise
    between “too easy” (the learner will not need to change its model to account for
    these examples) and “too hard” (the learner cannot make an incremental change
    that can account for these examples so they will most likely be treated as outliers
    or special cases, i.e., not helping generalization).'
