  md: '# Energy-Based Based Models and Boltzmann Machines


    Because Deep Belief Networks (DBNs) are based on Restricted Boltzmann Machines
    (RBMs), which are particular *energy-based models*, we introduce here the main
    mathematical concepts helpful to understand them, including *Contrastive Divergence*
    (CD).


    # 5.1 Energy-Based Models and Products of Experts


    Energy-based models associate a scalar energy to each configuration of the variables
    of interest [107, 106, 149]. Learning corresponds to modifying that energy function
    so that its shape has desirable properties. For example, we would like plausible
    or desirable configurations to have low energy. Energy-based probabilistic models
    may define a probability distribution through an energy function, as follows:


    ```

    P(x) = \frac{e^{-Energy(x)}}{Z}

    ```


    i.e., energies operate in the log-probability domain. This above generalizes exponential
    family* models [29], for which the energy function Energy(**x**) has the form
    $\eta(\theta) \cdot \phi(x)$. We will see below that the conditional distribution
    of one layer given another, in the RBM, can be taken'
  merge: -1
