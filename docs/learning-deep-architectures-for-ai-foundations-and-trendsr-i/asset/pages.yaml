    as training data for the top RBM.


    A variational approximation can be used to justify the Wake-Sleep algorithm. The
    log-likelihood decomposition in Equation (8.1)


    ```

    $log P(x) = KL(Q(h|x)||P(x)) + H_{Q(h)}(x),$\n+ \sum_{h} Q(h|x)(\log P(h) + \log
    P(x)),\eqno (8.7)$

    ```


    shows that the log-likelihood can be bounded from below by the opposite of the
    Helmholtz free energy [72, 53] $F:$


    ```

    $log P(x) = KL(Q(h|x)||P(x)) - F(x) \geq -F(x),\eqno (8.8)$

    ```


    where


    ```

    $F(x) = -H_{Q(h)}(x) - \sum_{h} Q(h|x)(\log P(h) + \log P(x)),\eqno (8.9)$

    ```


    and the inequality is tight when $Q=P$. The variational approach is based on maximizing
    the lower bound $-F$ while trying to make the bound tight, $minimizing KL(Q(h|x)||P(x))$.
    When the bound is tight, an increase of $-F(x)$ is more likely to yield an increase
    of $log P(x)$. Since we decouple the parameters of $Q$ and $P_s$, we now see what
    the two phases are doing. In the Wake phase we fix $x$ and do a stochastic gradient
    step towards maximizing the expected value of $F(x)$ over samples $x$ of the training
    set, with respect'
