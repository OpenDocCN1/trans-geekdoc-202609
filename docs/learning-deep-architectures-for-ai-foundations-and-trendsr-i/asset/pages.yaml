    # 7.6 Generalizing RBMs and Contrastive Divergence


    Let us try generalize the definition of RBM so as to include a large class of
    parametrizations for which essentially the same ideas and learning algorithms
    (such as Contrastive Divergence) that we have discussed above can be applied in
    a straightforward way. We generalize RBMs as follows: a Generalized RBM is an
    energy-based probabilistic model with input vector $\mathbf\mathbf{x}$ and hidden
    vector $\mathbf{h}$ whose energy function is such that $P(\mathbf{h}|\mathbf{x})$
    and $P(\mathbf{x}|\mathbf{h})$ both factorize. This definition can be formalized
    in terms of the parametrization of the energy function, which is also proposed
    by [73];


    # **Proposition 7.1.** The energy function associated with a model of form Equation
    (5.5) such that $P(\mathbf{h}|\mathbf{x}) = \prod_i P(h_i|\mathbf{x})$ and $P(\mathbf{x}|\mathbf{h})$
    must have the form


    ```

    $$\text{Energy}(\mathbf{h},\mathbf{x}) = \sum_i \phi_i(h_i) + \sum_j \xi_j(x_j)
    + \sum_{i,j} h_{ij}(\mathbf{h}_i, \mathbf{x}_j). \quad (7.7)$

    ```


    This is a direct application of the Hammersley-Clifford theorem [63, 73] also
    showed that the above is a necessary and sufficient condition to obtain complementary
    priors. Complementary priors allow the posterior distribution $P(\mathbf{h}|\mathbf{x})$
    to factorize by a proper choice of $\mathbf{h}$.


    In the case where the hidden and input values are binary, this formulation does
    not actually bring any additional power of representation. Indeed, $\eta_{ij}(\mathbf{h}_i,
    \mathbf{x}_j)$, which can take at most four different values according to the
    $2 \times 2$ configurations of $(\mathbf{h}_i, \mathbf{x}_j)$ could always be
    rewritten as a second order polynomial in $(\mathbf{h}_i, \mathbf{x}_j): a + b\mathbf{x}_j
    + c\mathbf{h}_i + d\mathbf{h}_i\mathbf{x}_j$.'
