  md: '# Outline of the Paper


    Section 2 reviews theoretical results (which can be skipped without hurting the
    understanding of the remainder) showing that an architecture with insufficient
    depth can require many more computational elements, potentially exponentially
    more (with respect to input size), than architectures whose depth is matched to
    the task. We claim that insufficient depth can be detrimental for learning. Indeed,
    if a solution to the task is represented with a very large but shallow architecture
    a lot of training examples may be needed to tune all of these elements and capture
    a highly varying function. Section 3.1 is also meant to motivate the reader, this
    time to highlight the limitations of local generalization and local estimation,
    which we expect to avoid using deep architectures with a distributed representation
    (Section 3.2).


    In later sections, the monograph describes and analyzes some of the algorithms
    that have been proposed to train deep architectures. Section 4 introduces concepts
    from the neural networks relevant to the task of training deep architectures.
    We first consider the previous difficulties in training neural networks with many
    layers, and then introduce deep unsupervised learning algorithms that could be
    exploited to initialize deep neural networks. Many of these algorithms (including
    those for the RBM) are related to the auto-encoder: a simple unsupervised algorithm
    for a one-layer model that captures a distributed representation for its input
    [25, 79, 156]. To fully understand RBMs and many related unsupervised learning
    algorithms, Section 5 introduces the class of energy-based models, including those
    used to build generative models with hidden variables such as the Boltzmann Machine.
    Section 6 focuses on the greedy-wise training algorithms for Deep Belief Networks
    (DBNs) [73] and Stacked Auto-Encoders (17, 153, 195]. Section 7 discusses fully
    variants of RBMs and auto-encoders that have been recently proposed to extend
    and improve them, including the use of sparsity, and the modeling of temporal
    dependencies. Section 8 discusses algorithms for jointly training all the layers
    of a Deep Belief Network using variational bounds. Finally, we consider in Section
    9 forward looking questions such as the hypothesized difficult optimization'
