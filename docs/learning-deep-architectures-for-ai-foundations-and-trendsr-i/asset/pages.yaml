    # # 4.3 Unsupervised Learning for Deep Architectures


    As we have seen above, layer-wise unsupervised learning has been a crucial component
    of all the successful learning algorithms for deep architectures up to now. If
    gradients of a criterion defined at the output layer become less as they are propagated
    backwards to lower layers, it is reasonable to believe that an unsupervised learning
    criterion defined at the level of a single layer could be used to move its parameters
    in a favorable direction. It would be reasonable to expect this if the single-layer
    learning algorithm discovered a representation that statistical regularities of
    the layer''s input. PCA and the standard variants of ICA requiring as many signals
    as seem inappropriate because they generally do not make sense in the so-called
    overcomplete case, where the number of outputs of the layer is greater than the
    number of its inputs. This suggests linking in the direction of extensions of
    ICA to deal with the overcomplete case [78, 87, 115, 184], as well algorithms
    related to PCA and ICA, as auto-encoders and RBMs, which can be applied in the
    overcomplete case. Indeed, experiments performed with these one-layer unsupervised
    learning algorithms in the context of a multi-layer system confirm this idea [17,
    73, 153]. Furthermore, marking linear projections (e.g., two layers of PCA) is
    still a linear transformation, i.e., not building deeper architectures.


    In addition to the motivation that unsupervised learning could help reduce the
    dependency on the unreliable direction given by the gradient of a supervised criterion,
    we have already introduced another motivation for using unsupervised learning
    at each level of a deep architecture. It could be a way to naturally decompose
    the problem into sub-problems associated with different levels of abstraction.
    We know that unsupervised learning algorithms can extract salient information
    about the input distribution. This information can be captured in a distributed
    representation, i.e., a set of features which encode the salient factors of variation
    in the input. A one-layer unsupervised learning algorithm could extract such salient
    features, but because of the limited capacity of that layer, the features extracted
    from the first level of the architecture can be seen as low-level features. It
    is conceivable that learning a second layer based on the same principle but taking
