    # 9.1.4 Shaping: Training with a Curriculum


    Another continuation method may be obtained by gradually transforming the training
    task, from an easy one (maybe convex) where examples illustrate the simpler concepts,
    to the target one (with more difficult examples). Humans need about decades to
    be trained as fully functional adults of our society. That training is highly
    organized, based on an education system and a curriculum which introduces different
    concepts at different times, exploiting previously learned concepts to ease the
    learning of new abstractions. The idea of training a learning machine with a curriculum
    can be traced back at least to [49]. The basic idea is to start small, learn easier
    aspects of the task or easier sub-tasks, and then increase the difficulty level.
    From the point of view of building representations, advocated here, the idea is
    to learn representations that capture low-level abstractions first, and then exploit
    them and compose them to learn slightly higher-level abstractions necessary to
    explain more complex structure in the data. By choosing which concepts to present
    and in order to present to the learning system, one can guide training and remarkably
    increase the speed at which we can learn. This idea is routinely exploited in
    animal training and is called shaping [95, 144, 177].


    Shaping and the use of a curriculum can also be seen as continuation methods.
    For this purpose, consider the learning problem of modeling the data coming from
    a training distribution $P$. The idea is to rewe the probability of sampling the
    examples from the training distribution, according to a given schedule that starts
    from the “easiest” examples and moves gradually towards examples illustrating
    more abstract concepts. At point $t$ in the schedule, we train from distribution
    $\hat{P}_t$, with $\hat{P}_t = P$ and $\hat{P}_0$ chosen to be easy to learn.
    Like in any continuation'
  merge: -1
