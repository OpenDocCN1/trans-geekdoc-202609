  md: '# 9.1 Global Optimization Strategies


    # 9.1.2 Unsupervised to Supervised Transition


    The experiments reported in many papers clearly show that an unsupervised pre-training
    followed by a supervised fine-tuning works well for deep architectures. Whereas
    previous work on combining unsupervised and supervised criteria [100] focus on
    the regularization effect of an unsupervised criterion (and unlabeled examples,
    in semi-supervised learning), the discourse of Section 4.2 suggests that part
    of the gain observed with unsupervised pre-training of deep networks may arise
    out of better optimization of the lower layers of the deep architecture.


    Much recent work has focused on starting from an unsupervised representation learning
    algorithm (e.g., as sparse coding) and fine-tuning the representation with a discriminant
    criterion or combining the discriminant and unsupervised criteria [6, 97, 121].


    In [97], an RBM is trained with a two-part visible vector that includes the input
    $x$ and the target class $y$. Since an RBM can be trained to model the joint $P(x,y)$
    (e.g., by Contrastive Divergence) or to model the conditional $P(y|x)$ (the exact
    gradient of the conditional log-likelihood is tractable). The best results reported
    [97] combine both criteria, but the model is initialized using the non-discriminant
    criterion.


    In [6, 121], the task of training the decoder bases in a sparse coding system
    is coupled with a task of training a classifier on to of the sparse codes. After
    initializing the decoder bases using non-discriminant learning, they can be fine-tuned
    using a discriminant criterion that is applied jointly on the representation parameters
    (i.e., the first layer bases, that give rise to the sparse codes) and a set of
    classifier parameters (e.g., a linear classifier that takes the representation
    codes as input). According to [121], trying to directly optimize the supervised
    criterion without initializing with non-discriminant training yielded very poor
    results. In fact, they propose a *smooth transition* from the non-discriminant
    criterion to the discriminant one, hence performing a kind of continuation method
    to optimize the discriminant criterion.


