  md: "# 5.4 Contrastive Divergence 61\n\nRunning a long MCMC chain is very expensive.\
    \ The idea of k-step Contrastive Divergence (CD-$k$) [69, 70] is simple, and involves\
    \ a **second approximation**, which introduces some bias in the gradient: run\
    \ the MCMC chain $x_1, x_2, \\dots, x_{k+1}$ for $k$ steps starting from the observed\
    \ example $x_1 = x$. The CD-$k$ update (i.e., the log-likelihood gradient) after\
    \ sampling $\tilde{x}$, is,\n\n```\n$$\\Delta \\theta = \\frac{\\partial FreeEnergy(x)}{\\\
    partial \\theta} - \\frac{\\partial FreeEnergy(\\tilde{x})}{\\partial \\theta}\
    \ \\quad (5.27)$\n```\n\nwhere $\tilde{x} = x_{k+1}$ is the last sample from our\
    \ Markov chain, obtained after $k$ steps. We know that when $k \\to \\infty$,\
    \ the bias goes away. We also know when the model distribution is very close to\
    \ the empirical distribution, i.e., $P \\approx P$, then we start the chain from\
    \ $x$ (a sample from $P$) MCMC has already converged, and we need only one step\
    \ to obtain an unbiased sample from $P$ (although it would still be correlated\
    \ with $x$).\n\nThe surprising empirical result is that even $k=1$ (CD-1) often\
    \ gives good results. An extensive numerical comparison of training with CD-$k$\
    \ versus log-likelihood gradient has been presented in [31]. In these experiments,\
    \ taking $k$ larger than 1 gives more results, although very good approximations\
    \ of the solution can be obtained even with $k=1$. Theoretical results [12] discussed\
    \ in Section 5.4.3 help to understand why small values of $k$ can work: CD-$k$\
    \ corresponds to keeping the $k$ terms of a series that converges to the log-likelihood\
    \ gradient.\n\nOne way to interpret Contrastive Divergence is that it is approximating\
    \ the log-likelihood gradient *locally* around the training point $x_1$. The stochastic\
    \ reconstruction $\\tilde{x} = x_{k+1}$ (for CD-$k$) has a distribution (given\
    \ $x_1$) which is in sense centered around $x_1$ and becomes more spread out as\
    \ $k$ increases, until it models the model distribution. The CD-$k$ update will\
    \ decrease the free energy of the training point $x_1$ (which would increase its\
    \ likelihood if all the other free energies were kept constant), and increase\
    \ the free energy of $\\tilde{x}$, which is that $\\tilde{x}$ is in the neighborhood\
    \ of $x_1$, but at the same time more likely to be in regions of high probability\
    \ under the model (especially for $k$ larger). As argued by [106],"
