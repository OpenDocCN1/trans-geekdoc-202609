    # 1.2 Intermediate Representations: Sharing Features and Abstractions Across Tasks


    Since a deep architecture can be seen as the composition of a series of processing
    stages, the immediate question that deep architectures raise is: what kind of
    representation of the data should be found as the output of each stage (i.e.,
    the input of another)? What kind of interface should be between these stages?
    A hallmark of recent research on deep architectures is the focus on these intermediate
    representations: the success of deep architectures belongs to the representations
    learned in an unsupervised way by RBMs [73], ordinary auto-encoders [17], sparse
    auto-encoders [150, 153], or denoising auto-encoders [195]. These algorithms (described
    in more detail in Section 7.2) can be seen as learning to transform one representation
    (the output of the previous stage) into another, at each step maybe disentangling
    better the factors of variations underlying the data. As we discuss at length
    in Section 4, it has been observed again and again that once a good representation
    has been found at each level, it can be used to initialize and successfully train
    a deep network by supervised gradient-based optimization.'
