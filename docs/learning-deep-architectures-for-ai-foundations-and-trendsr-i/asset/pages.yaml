    More precisely, functions that can be compactly represented by a depth k architecture
    might require an exponential number of computational elements to be represented
    by a depth k - 1 architecture. Since the number of computational elements one
    can afford depends on the number of training examples available to tune or select
    them, the consequences are not only computational but also statistical; poor generalization
    may be expected when using an insufficiently deep architecture for representing
    some functions.


    We consider the case of fixed-dimension inputs, where the computation performed
    by the machine can be represented by a directed acyclic graph where each node
    performs a computation that is the output of another node in the graph or one
    of the external inputs to the graph. The whole graph can be viewed as a *circuit*
    that computes a function applied to the external inputs. When the set of functions
    allowed for the computation nodes is limited to *logic gates*, such as {AND, NOT},
    this is a Boolean circuit, or *logic circuit*


    To formalize the notion of depth of architecture, one must introduce the notion
    of a set of computational elements. An example of such a set is the set of computations
    that can be performed by logic gates. Another is the set of computations that
    can be performed by an artificial neuron (depending on the values of its synaptic
    weights). A function can be expressed by the composition of computational elements
    from a set. It is defined by a graph that formalizes this composition, with one
    node per computational element. Depth of architecture refers to the depth of that
