  md: '# Introduction


    lower level features. Automatically learning features at multiple levels of abstraction
    allow a system to learn complex functions mapping the input to output directly
    from data, without depending completely on human-crafted features. This is especially
    important for higher-level abstractions, which humans often do not know how to
    specify in terms of raw sensory input. The ability to automatically learn powerful
    features will become increasingly important as the amount of data and range of
    applications to learning methods continues to grow.


    Depth of architecture refers to the number of levels of composition of non-linear
    operations in the function learned. Whereas most current learning algorithms correspond
    to shallow architectures (1, 2 or 3 levels), the mammalian brain is organized
    in a deep architecture [173] with given input present at multiple levels of abstraction,
    each level corresponding to a different area of cortex. Humans often describe
    such concepts in hierarchical ways, with multiple levels of abstraction. The brain
    also appears to process information through multiple stages of transformation
    and representation. This is particular clear in the primate visual system [173],
    with its sequence of processing stages: detection of edges, primitive shapes,
    and moving up to gradually complex visual shapes.


    Inspired by the architectural depth of the brain, neural network researchers have
    wanted for decades to train deep multi-layer neural networks [19, 191], but no
    successful attempts were reported before 2006: researchers posted experimental
    results with typically two or three levels (i.e., one or two hidden layers), but
    training deeper consistently yielded poorer results. Something that can be considered
    a breakthrough happened in 2006: Hinton et al. at University of Toronto introduced
    Deep Belief Networks (DBNs) [73], with a learning algorithm that greedily trains
    one layer at a time, exploiting an unsupervised learning algorithm for each layer,
    a Restricted Boltzmann Autoencoder (RBM) [51]. Shortly after, related algorithms
    based on auto-encoders were proposed [17, 153], apparently exploiting the


