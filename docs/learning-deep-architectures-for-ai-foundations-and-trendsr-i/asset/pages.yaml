- pgno: 64
  md: 'Energy-Based Models and Boltzmann Machines


    what is mostly needed from the training algorithm for an energy-based model is
    that it makes the energy (free energy, here, to marginalize hidden variables)
    of observed inputs smaller, shoveling “energy” elsewhere, and most importantly
    in areas of low energy. The Contrastive Divergence algorithm is fueled by the
    contrast between the statistics collected when the input is a real training example
    and when the input is a chain sample. As argued in the next section, one can think
    of the unsupervised learning problem as discovering a decision surface that can
    roughly separate the regions of high probability (where there are many observed
    training examples) from the rest. Therefore, we want to penalize the model when
    it generates examples on the wrong side of that divide, and a good way to identify
    where divide should be moved is to compare training examples with samples from
    the model.


    # 5.4.2 Alternatives to Contrastive Divergence


    Exciting recent development in the research on learning algorithms for RBMs is
    use of a socalled persistent MCMC for the negative phase [161, 187], following
    an approach already introduced in [135]. The idea is simple: keep a background
    MCMC chain ... $x_t \rightarrow h_t \rightarrow x_{t+1} \rightarrow h_{t+1} \dots$
    to obtain the negative phase samples (which should be from the model). Instead
    of running a short chain as (which should be from CD-k, the approximation is made
    to ignore the fact that parameters are changing as we move along the chain, i.e.,
    we do not run a separate chain for each value of the parameters (as in the traditional
    Boltzmann Machine learning algorithm). Maybe because the parameters move slowly,
    the approximation works well, usually giving rise to better log-likelihood than
    CD-k (experiments against $k=1$ and k=10$). The trade-off with CD-1 is that the
    variance is larger but the bias is smaller. Something also happens [185]: the
    model systematically moves away from the samples obtained in the negative phase,
    and this interacts with the chain itself, preventing it from staying in the same
    region very long, substantially improving the mixing rate of the chain. This is
    a very desirable and unforeseen effect, which helps to explore more quickly the
    space of RBM configurations.'
  merge: -1
