    over all possible input configurations, maximizing likelihood roughly amounts
    to making reconstruction error high for most possible input configurations, while
    making it low for those in the training set. This can be achieved if the encoder
    (which maps an input to its representation) is constrained in such a way that
    it cannot represent well most of the possible input'
