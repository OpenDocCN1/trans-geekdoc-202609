    demonstrated by [12], shows how one can expand the log-likelihood gradient for
    any $t \ge 1$.


    **Theorem 5.1.** Consider the converging Gibbs chain $\mathbf{x}_1 \Rightarrow
    \mathbf{h}_1 \Rightarrow \mathbf{x}_2 \h2 \dots$ starting at data point $\mathbf{x}_1$.
    The log-likelihood gradient can be


    ```

    $$\frac{\log P(\mathbf{x}_1)}{\partial \theta} = -\frac{\partial FreeEnergy(\mathbf{x}_1)}{\partial
    \theta} + E\left[\frac{\partial FreeEnergy(\mathbf{x}_1)}{\partial \theta}}\right]
    + E\left[\frac{\partial P(\mathbf{x}_1)}{\partial \theta}}\right] (5.28)$

    ```


    and the final term converges to zero as $t$ goes to infinity.


    Since the final term becomes small as $t$ increases, truncating the chain to $k$
    steps in the Markov chain, using the approximation-


    ```

    $$\frac{\log P(\mathbf{x}_1)}{\partial \theta} \simeq -\frac{\partial FreeEnergy(\mathbf{x}_1)}{\partial
    \theta} + E\left[\frac{\partial FreeEnergy(\mathbf{x}_{k+1})}{\partial \theta}}\right]$

    ```


    is exactly the CD-k update (Equation (5.27)) when we replace the expectation with
    a single sample $\tilde{\mathbf{x}} = \mathbf{x}_{k+1}$. This tells us that the
    bias of CD-k is $E[\frac{\partial P(\mathbf{x}_{k+1})}{\partial \theta}]$. Experiments
    and theory support the idea that CD-k yields better and faster convergence (in
    terms of number of iterations) than CD$(k-1)$, due to smaller bias (though the
    computational overhead might not be worth it). although experiments show that
    the CD-k bias can be large when $k$ is small, empirically the update rule of CD-k
    still moves the model''s parameters in the same quadrant as log-likelihood gradient
    [12]. This is in agreement with the good results that can be obtained even with
    $k=1$. An intuitive picture that may help to understand the phenomenon is the
    following: when the input example $\mathbf{x}_1$ is used to initialize the chain,
    each Markov chain step (to $\mathbf{x}_2$) tends to be in the right direction
    compared to $\mathbf{x}_1$, i.e., roughly going down the energy landscape from
    $\mathbf{x}_1$. Since the gradient depends on the change between $\mathbf{x}_2$
    and $\mathbf{x}_1$, we tend to get the direction of the gradient'
