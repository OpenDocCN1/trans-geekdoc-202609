  md: '# 2.1 Computational Complexity 17


    A two-layer circuit of logic gates can represent any Boolean function [127]. Any
    Boolean function can be written as a sum of products (disjunctive normal form:
    AND gates on the first layer with optional negation of inputs, and OR gate on
    the second layer) or a product of sums (conjunctive normal form: OR gates on the
    first layer with optional negation of inputs, and AND gate on the second layer).
    To understand the limitations of shallow architectures, the first result to consider
    is with depth-two logical circuits, most Boolean functions require an exponential
    (with respect to input size) number of logic gates [198] to be represented.


    More interestingly, there are functions computable with a polynomial-size logic
    circuits of depth $k-1$ [62] that require exponential size when restricted to
    depth $d$. The proof of this theorem relies on earlier results [208] showing that
    $d$-bit parity circuits of depth $2$ have exponential size. The $d$-bit parity
    function is defined as usual:


    ```

    parity : (b_1, \dots, b_d) \in \{0, 1\}^d \to \begin{cases} 1, & \text{if } \sum_{i=1}^d
    b_i \text{ is even} \ 0, & \text{otherwise}. \end{cases}

    ```


    One might wonder whether these complexity results for Boolean circuits are relevant
    to machine learning. See [140] for an early survey of theoretical results in computational
    complexity relevant to learning algorithms. Interestingly, many of the results
    for Boolean circuits can be generalized to architectures whose elements are linear
    threshold units (also known as artificial neurons [125]), which compute


    ```

    $f(\mathbf{x}) = \mathbf{1}_{\mathbf{w}^T\mathbf{x}+b\geq 0} \quad (2.1)

    ```


    with parameters $\mathbf{w}$ and $b$. The fan-in of a circuit is the maximum number
    of inputs of a particular element. Circuits are often organized in layers, like
    multi-layer neural networks, where elements in a layer only take their input from
    elements in the previous layer(s), and the first layer is the neural network input.
    The size of a circuit is the number of its computational elements (excluding input
    elements, which do not perform any computation).'
