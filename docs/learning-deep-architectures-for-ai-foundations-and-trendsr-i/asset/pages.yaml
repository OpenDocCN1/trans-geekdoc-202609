    # 2.1 Computational Complexity


    The most formal arguments about the power of deep architectures come from investigations
    into computational complexity of circuits. The basic conclusion that these results
    suggest that when a function can be compactly represented by a deep architecture,
    it might need a very large architecture to be represented by an insufficiently
    deep one.'
