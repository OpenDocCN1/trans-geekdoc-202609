    is viewed as a lossy compression of $\mathbf{x}$, it cannot be a good compression
    (with small loss) for all $x$, so learning drives it to be one that is a good
    compression in particular for training examples, and for others as well (and that
    is the sense in which an auto-encoder generalizes), but not for arbitrary inputs.


    One issue with this approach is that if there is no other constraint, then an
    auto-encoder of dimension at least $n$ could potentially just learn useless (e.g.,
    just copying the input). Surprisingly, experiments reported in [17] suggest that
    in practice, when trained with stochastic gradient descent, non-linear auto-encoders
    with more hidden units than inputs (called overcomplete) yield useful representations
    (in the sense of classification error measured on a network taking this representation
    in input). A simple explanation is based on the observation that stochastic gradient
    descent with early stopping is similar to an $\ell_2$ regularization of the parameters
    [211, 36]. To achieve perfect reconstruction of continuous inputs, a one-hidden
    layer auto-encoder with non-linear hidden units needs very small weights in the
    first layer (to bring the non-linearity of the hidden units in their linear regime)
    and very large weights in the second layer. With binary inputs, large weights
    are also needed to completely minimize the reconstruction error. Since the implicit
    or explicit regularization makes it difficult to reach large-weight solutions,
    the optimization algorithm finds which only well for examples similar to those
    in the training set, which is what we want. It means that the representation is
    exploiting statistical regularities present in the training set, rather than learning
    to replicate the identity function.


    There are different ways that an auto-encoder with more hidden units than inputs
    could be prevented from learning the identity, and still capture something useful
    about the input in its hidden representation. Instead or in addition to constraining
    the encoder by explicit or implicit'
