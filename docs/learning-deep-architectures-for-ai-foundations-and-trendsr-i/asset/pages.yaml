    # 4.4 Deep Generative Architectures


    Besides being useful for pre-training a supervised predictor, unsupervised learning
    in deep architectures can be of interest to learn a distribution and generate
    samples from it. Generative models can often be represented as graphical models
    [91]: these are visualized as graphs in which nodes represent random variables
    and arcs say something about the type of dependency existing between the random
    variables. The joint distribution of all the variables can be written in terms
    of products only a node and its neighbors in the graph. With directed arcs (defining
    parenthesis), a node is conditionally independent of its ancestors, given its
    parents. Some of the random variables in a graphical model can be observed, and
    others cannot (called hidden variables). Sigmoid belief networks are generative
    multi-layer neural networks that were proposed and studied before 2006, and trained
    using variational approximations [42, 72, 164, 189]. In a sigmoid belief network,
    the units (typically binary random variables) in each layer are independent given
    the values of the units in the layer above, as illustrated in Figure 4.3. The
    typical parametrization of these conditional distributions (going downwards of
    of ordinary neural nets) is similar to the neuron activation equation of Equation
    (4.1):


    ```

    $P(h^k) = \text{sigmoid}(b^k + \sum_y W_{kj}^{k+1}h_j^{k+1}) \quad (4.3)$

    ```


    where $h_i^k$ is the binary activation of hidden node $i$ in layer $k$, $h^k$
    is the vector $(h_1^k, \dots)$, and we denote the input vector $\mathbf{x} = h^0$.
    Note how the notation $P(...)$ always represents a probability distribution associated
    with our model, whereas $\tilde{P}$ is the training distribution (the'
