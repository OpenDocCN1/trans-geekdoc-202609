    initialize a deterministic non-linear transformation (a multi-layer neural network)
    that computes a feature vector (a new feature space for the data), and that transformation
    can be tuned to minimize the prediction error made by the Gaussian process, using
    a gradient-based optimization. The feature space can be seen as a learned representation
