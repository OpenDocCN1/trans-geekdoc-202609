    could therefore be trained as sample $x$ from the training set, then sample $h^1
    \sim Q(h^1|x)$, and consider $h^1$ as a training sample for the second-level RBM
    (i.e., as an observation for its ‘visible’ vector). If there was no constraint
    on $P(h^1)$,'
