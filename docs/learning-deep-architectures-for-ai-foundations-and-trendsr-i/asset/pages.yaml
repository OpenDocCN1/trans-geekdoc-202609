- pgno: 11
  md: '# 1.2 Sharing Features and Abstractions Across Tasks 9


    set of tasks and concepts. It seems daunting to manually define that many tasks,
    and learning becomes essential in this context. Furthermore, it would seem foolish
    not to exploit the underlying commonalities between these tasks and the concepts
    they require. This has been the focus of research on multi-task learning [7, 8,
    32, 88, 186]. Architectures with multiple levels naturally provide such sharing
    and reuse of components: the low-level visual features (like edge detectors) and
    intermediate-level visual features (like object parts) that are useful to detect
    MAN are also useful for a large group of other visual tasks. Deep learning algorithms
    are based on learning intermediate representations Hence they can leverage unsupervised
    data and data from similar tasks [148] to boost performance on large and challenging
    problems that routinely suffer from a poverty of labelled data, as has been shown
    by [37], beating the state-of-the-art in natural language processing tasks. A
    similar multi-task approach for deep architectures was applied in vision tasks
    by [2]. Consider a multi-task setting in which there are different outputs for
    tasks, all obtained from a shared pool of level features. The fact that many of
    these learned features appear among m provides sharing of statistical strength
    in proportion to m. Now consider that these learned high-level features can themselves
    be represented by combining lower-level intermediate features from a common pool.
    Again statistical strength can be gained in a similar way, and this strategy can
    be exploited for every level of a deep architecture.


    In addition, learning about a large set of interrelated concepts might provide
    a key to the kind of broad generalizations that humans appear to do, which we
    would not expect from separately trained object detectors, with one detector per
    visual category. If each high-level category is itself represented through a particular
    distributed configuration of abstract features from a common pool, generalization
    to unseen categories could follow naturally from new configurations of these features.
    Even though only some configurations of these features would present in the training
    examples, if they represent different aspects of the data, new examples could
    meaningfully be represented by new configurations of these features.'
