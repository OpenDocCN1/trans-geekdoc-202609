  md: '# 8 Stochastic Variational Bounds for Joint Optimization of DBN Layers


    In this section, we discuss mathematical underpinnings of algorithms for training
    a DBN as a whole. The log-likelihood of a DBN can be lower bounded using Jensen''s
    inequality, and as we discuss below, this can justify the greedy layer-wise training
    strategy introduced in [73] and described in Section 6.1. We will use Equation
    (6.1) for a DBN joint distribution, writing **h** for $h^1$ (the first level hidden
    vector) to lighten notation, and introducing an arbitrary conditional distribution
    $Q(\mathbf{h}|x)$. First multiply $P(x)$ by $1 = \sum_h Q(h|x)$, then use $P(x)
    = P(\mathbf{h},x)/P(\mathbf{h}|x)$, and multiply by $1 = Q(\mathbf{h}|x)/Q(\mathbf{h}|x)$
    and expand the terms:


    ```

    $$\log P(x) = \left( \sum_h Q(h|x) \right) \log P(x) = \sum_h Q(h|x) \log \frac{P(x,h)}{P(h|x)}$$

    $= \sum_h Q(h|x) \log \frac{P(x,h) Q(h|x)}{P(h|x) Q(h|x)}$$

    $= H_{Q(h|x)} + \sum_h Q(h|x) \log P(x,h) + \sum_h Q(h|x) \log \frac{Q(h|x)}{P(h|x)}$$

    ```'
