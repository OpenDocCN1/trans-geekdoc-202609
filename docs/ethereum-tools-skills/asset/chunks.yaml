- raw: "You can create a new file in the browser local storage using the first button\
    \ with the `+` icon on the top left. You can then provide a name in the opened\
    \ dialog and press *OK*.\n\nUsing the second button from top left, you can open\
    \ an existing Solidity file from your computer file system into the Remix IDE.\
    \ The file will also be stored in the browser’s local storage.\n\n#### Publishing\
    \ Explorer Files as GitHub Gists\n\nUsing the third and fourth buttons from top\
    \ left, you can publish files from the IDE as a public GitHub gist.\n\n#### Copying\
    \ Files to Another Instance of Remix IDE\n\nUsing the fifth button from top left,\
    \ you can copy files from the local storage to another instance of Remix by providing\
    \ the URL of the instance.\n\n#### Connecting to the Local File System\n\nThe\
    \ last button can be used to connect the Remix IDE to your local file system if\
    \ you’re running the Remixd tool.\n\n### Solidity Code Editor\n\nThe Solidity\
    \ code editor provides the interface where you can write your code with many features\
    \ such as syntax highlighting, auto-recompling, auto-saving etc. You can open\
    \ multiple tabs and also increase/decrease the font size using the *+/-* button\
    \ in the top-left corner.\n\n![Solidity Code Editor](images/00005.jpeg)\n\n###\
    \ Terminal\n\nThe terminal window below the editor integrates a JavaScript interpreter\
    \ and the `web3` object. You can execute JavaScript code in the current context,\
    \ visualize the actions performed from the IDE, visualize all network transactions\
    \ or transactions created from the Remix IDE etc. You can also search for data\
    \ in the terminal and clear the logs.\n\n![Remix terminal](images/00006.jpeg)\n\
    \n### Tabs Panel\n\nThe *Tabs* panel provides many tabs for working with the IDE:\n\
    \n*   the *Compile* tab: used for compiling a smart contract and publishing on\
    \ Swarm\n\n*   the *Run* tab: used for sending transactions to the configured\
    \ environment\n\n*   the *Settings* tab: used for updating settings like the compiler\
    \ version and many general settings for the editor\n\n*   the *Debugger* tab:\
    \ used for debugging transactions\n\n*   the *Analysis* tab: used for getting\
    \ information about the latest compilation\n\n*   the *Support* tab: used for\
    \ connecting with the Remix community.\n\n![Remix tabs](images/00007.jpeg)\n\n\
    ## Remix Execution Environments\n\nThe Remix IDE provides many environments for\
    \ executing the transactions:\n\n*   JavaScript VM: a sandbox blockchain implemented\
    \ with JavaScript in the browser to emulate a real blockchain.\n\n*   Injected\
    \ Web3: a provider that injects web3 such as `Mist` and `Metamask`, [connecting\
    \ you to your private blockchain](https://bitfalls.com/2018/03/26/connecting-myetherwallet-mist-metamask-private-blockchain/).\n\
    \n*   Web3 Provider: a remote node with geth, parity or any Ethereum client. Can\
    \ be used to connect to the real network, or to your private blockchain directly\
    \ without MetaMask in the middle.\n\n![Remix Execution Environments](images/00008.jpeg)\n\
    \n## Using Remix IDE to Compile and Deploy a Smart Contract\n\nFor the sake of\
    \ demonstrating what we can achieve using Remix IDE, we’ll use an example contract\
    \ and we’ll see how we can:\n\n*   compile the contract in Remix IDE\n\n*   see\
    \ some warnings emitted by the compiler when best practices aren’t followed\n\n\
    *   deploy the contract on the JavaScript EVM (Ethereum Virtual Machine)\n\n*\
    \   make transactions on the deployed contract\n\n*   see example reads and writes\
    \ in the terminal IDE.\n\nWe’ll use the following example contract [from this\
    \ tutorial](https://bitfalls.com/2018/03/31/solidity-development-crash-course-building-blockchain-raffle/)\
    \ which implements a blockchain raffle:\n\n```\npragma solidity ^0.4.20;\n \n\
    \ contract Blocksplit {\n \n     address[] public players;\n     mapping (address\
    \ => bool) public uniquePlayers;\n     address[] public winners;\n \n     address\
    \ public charity = 0xc39eA9DB33F510407D2C77b06157c3Ae57247c2A;\n \n     function()\
    \ external payable {\n         play(msg.sender);\n     }\n \n     function play(address\
    \ _participant) payable public {\n         require (msg.value >= 1000000000000000\
    \ && msg.value <= 100000000000000000);\n         require (uniquePlayers[_participant]\
    \ == false);\n \n         players.push(_participant);\n         uniquePlayers[_participant]\
    \ = true;\n     }\n \n }\n \n```\n\nThe contract declares some variables, such\
    \ as:\n\n*   The `players` array variable, which holds the addresses of the raffle\
    \ participants.\n\n*   The `uniquePlayers` mapping, which is used to save unique\
    \ players so players don’t participate multiple times from the same address. (An\
    \ address will be mapped to a boolean, true or false, value indicating if the\
    \ participant has already participated or not.)\n\n*   The `winners` array variable,\
    \ which will hold the addresses of the winners.\n\n*   The `charity` variable,\
    \ which holds a hardcoded address of a charity where profits will go.\n\nIt also\
    \ declares:\n\n*   A fallback function marked as `payable`, which enables the\
    \ smart contract to accept payments.\n\n*   A `play()` function that enables participants\
    \ to enter the raffle by providing an address.\n\nYou can read more details about\
    \ this contract from this [tutorial](https://bitfalls.com/2018/03/31/solidity-development-crash-course-building-blockchain-raffle/)\
    \ where all the code is explained in detail.\n\nNow, go ahead and open the Remix\
    \ IDE from [remix.ethereum.org](https://remix.ethereum.org/).\n\nNext, create\
    \ a new file by clicking on the button with the *+* icon.\n\n![Creating a new\
    \ file](images/00009.jpeg)\n\nA new dialog will pop up Enter a name for your file\
    \ (`blocksplit.sol`), then press *OK*:\n\n![Naming the file](images/00010.jpeg)\n\
    \nA new tab will be opened in the code editor where you can start writing your\
    \ contract. So just copy and paste the previous contract code in there.\n\nFirst\
    \ start by compiling the contract. From the *Compile* tab click *Start to compile*\
    \ button.\n\nWe’re getting a message box with two warnings raised by Static Analysis\
    \ of the code.\n\n![Two warnings](images/00011.jpeg)\n\nIf you click on the message\
    \ box you’ll be taken to the *Analysis* tab, which provides more information about\
    \ the warnings:\n\n![warning info](images/00012.gif)\n\nThe first warning is raised\
    \ if the gas requirements of functions are too high, and the second one is raised\
    \ if the `require()` or `assert()` functions are not used appropriately.\n\nYou\
    \ can also use the checkboxes in the *Analysis* tab to determine when you want\
    \ the compiler to emit warnings.\n\n![determine when you want the compiler to\
    \ emit warnings](images/00013.jpeg)\n\nNext, let’s deploy the contract with our\
    \ JavaScript VM. Switch to the *Run* tab, and select *JavaScript VM* from the\
    \ dropdown menu.\n\n![Selecting the JavaScript VM](images/00014.jpeg)\n\nNext,\
    \ click the *Deploy* button below the contract name.\n\n![The Deploy button](images/00015.jpeg)\n\
    \nOnce the contract is deployed successfully on the JavaScript VM, a box will\
    \ be opened on the bottom of the *Run* tab.\n\n![Run tab box](images/00016.jpeg)\n\
    \nUnder the name and address of the deployed contract, we have some buttons with\
    \ red and blue colors. Red buttons refer to actions that cause a write to the\
    \ blockchain (in our case the fallback and play functions) and need a transaction,\
    \ where blue buttons refer to reading from blockchain (*charity, players, uniquePlayers\
    \ and winners* public variables we defined in the contract’s code).\n\nYou’ll\
    \ also see a similar message to the following screenshot in the IDE terminal.\n\
    \n![Terminal message](images/00017.gif)\n\nFor now, the only variable that holds\
    \ a value is the *charity* variable, because the address is hardcoded in the code\
    \ so if you click on the corresponding button you’ll get the value of that address.\n\
    \n![address value](images/00018.gif)\n\nThe contract is built to allow a participant\
    \ to enter the raffle by just sending ether to the address (using a payable callback\
    \ function) or also call the `play()` function with the address of the participant."
