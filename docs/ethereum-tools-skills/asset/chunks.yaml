    \ `v`，检查函数上下文中所有可用的变量。\n\n输入 `v` 执行。输出应如下：\n\n```\nnumberPosition: 1\n       \
    \ newNumber: 12\n                : 189\n_numberStorage: [ 12 ]\n```\n\n另一种方法更具体，我们可以通过输入\
    \ `:<variable_name>` 来实现。输入 `:numberPosition` 试试。你应该得到输出 `1`。\n\n现在让我们尝试计算一个表达式。你也可以用\
    \ `:` 结构来做到这一点。\n\n让我们尝试用 `:_numberStorage[numberPosition]` 取回我们的数字：\n\n```\n\
    debug(development:0x34d26b8b...)> :_numberStorage[numberPosition]\nundefined\n\
    ```\n\n运行后，我们得到输出 `undefined`。这意味着那里没有数字。\n\n对所有开发者来说，这个错误应该是相当显而易见的。我们试图在位置 1\
    \ 访问第一个元素。由于在 Solidity 中，就像在大多数语言中一样，数组是**零索引**的，我们需要用数字零来访问它。\n\n按 `q` 退出调试器，然后我们来修复代码。在你的\
    \ `Storage.sol` 中修改这部分：\n"
