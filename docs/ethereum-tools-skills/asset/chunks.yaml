  trans: '


    # OpenZeppelin 库


    OpenZeppelin 库是以太坊开发者工具箱中最酷的工具之一。它是一个框架，包含许多以安全方式编写的 Solidity 代码模式和智能合约模块。作者本身就是
    Solidity 审计师和顾问，你可以[在此阅读关于这些模块的第三方审计报告](https://blog.zeppelin.solutions/external-audit-of-openzeppelin-2ea50404ba7b)。OpenZeppelin
    背后的阿根廷公司 Zeppelin Solutions 的 Manuel Araoz [概述](https://blog.zeppelin.solutions/onward-with-ethereum-smart-contract-security-97a827e47702)了主要的
    Solidity 安全模式和注意事项。


    OpenZeppelin 正确立自己作为可复用且安全的开源（MIT 许可）Solidity 代码库的行业标准，[可使用 Truffle 轻松部署](https://blog.zeppelin.solutions/how-to-create-token-and-initial-coin-offering-contracts-using-truffle-openzeppelin-1b7a5dae99b6)。它由智能合约组成，一旦通过
    `npm` 安装，即可轻松导入并在我们的合约中使用。


    Truffle 框架[发布了一个关于结合 Truffle 和 Ganache 使用 OpenZeppelin 的教程](http://truffleframework.com/tutorials/robust-smart-contracts-with-openzeppelin)。


    这些合约旨在被导入，其方法旨在根据需要被重写。文件本身不应被修改。


    ## ICO 模式


    OpenZeppelin 库包含一组用于在以太坊平台上发布代币的合约——针对 [ERC20](https://en.wikipedia.org/wiki/ERC20)
    代币，包括 `BasicToken` 合约、`BurnableToken`、`CappedToken`。这是一种具有固定上限的可铸造代币、`MintableToken`、`PausableToken`，可暂停代币转账。还有
    `TokenVesting`，一种*可像典型的归属方案一样逐步释放其代币余额的合约，包含悬崖期和归属期*，以及更多。


    还有一组用于 [ERC721](https://openzeppelin.org/api/docs/token_ERC721_ERC721Token.html)
    代币的合约——即非同质化、独特的 CryptoKitties 类型代币。


    [ERC827 代币](https://github.com/ethereum/EIPs/issues/827)合约，即随交易代币发送数据的标准，[也已包含在内](https://openzeppelin.org/api/docs/token_ERC827_ERC827.html)。


    还有一组*[众筹合约](https://openzeppelin.org/api/docs/crowdsale_Crowdsale.html)*——用于进行首次代币发行（ICO）的合约。这些合约可以[记录购买](https://openzeppelin.org/api/docs/crowdsale_Crowdsale.html#TokenPurchase)，向购买者[交付/发放代币](https://openzeppelin.org/api/docs/crowdsale_Crowdsale.html#_deliverTokens)，[转发
    ETH 资金](https://openzeppelin.org/api/docs/crowdsale_Crowdsale.html#_forwardFunds)。其中包含用于验证和处理代币购买的函数。


    [FinalizableCrowdsale](https://openzeppelin.org/api/docs/crowdsale_distribution_FinalizableCrowdsale.html)
    合约提供了众筹结束后执行某些逻辑的功能。[PostDeliveryCrowdsale](https://openzeppelin.org/api/docs/crowdsale_distribution_PostDeliveryCrowdsale.html)
    允许冻结提款直到众筹结束。[RefundableCrowdsale](https://openzeppelin.org/api/docs/crowdsale_distribution_RefundableCrowdsale.html)
    是*Crowdsale 合约的扩展，增加了融资目标，以及在目标未达成时用户可退款的可能性*。


    [可销毁合约](https://openzeppelin.org/api/docs/lifecycle_Destructible.html)可由所有者销毁，并将所有资金发送给所有者。还有用于向子合约[实现*可暂停性*](https://openzeppelin.org/api/docs/lifecycle_Pausable.html)的合约。


    OpenZeppelin 为进行 ICO 提供了许多辅助工具和实用程序——例如[用于恢复误发送到 ICO 地址而非 ETH 地址的 ERC20 代币的合约](https://openzeppelin.org/api/docs/ownership_CanReclaimToken.html)。[可继承合约](https://openzeppelin.org/api/docs/ownership_Heritable.html)提供在特定情况下将所有权转移给另一所有者的功能。[Ownable
    合约](https://openzeppelin.org/api/docs/ownership_Ownable.html)拥有一个所有者地址，并提供基本的授权/权限控制和所有权转移功能。


    [RBAC 合约](https://openzeppelin.org/api/docs/ownership_rbac_RBAC.html)提供基于角色的访问控制实用程序。我们可以为不同地址分配不同角色，角色数量无上限。


    Zeppelin 还提供了一个示例众筹启动 Truffle 项目，该项目尚未经过审计，因此最适合作为 OpenZeppelin 使用入门。它使快速启动众筹和代币变得容易。


    ## ZeppelinOS


    ![ZeppelinOS 图表](img/00037.jpeg)


    [ZeppelinOS](https://zeppelinos.org/) 是*一个建立在 EVM 之上的开源、去中心化的工具与服务平台，用于安全地开发和管理智能合约应用*。


    实际上，这是一种建立在 EVM 之上的中间件层，比目前的 OpenZeppelin 框架更进一步。Zeppelin Solutions 此处承诺*通过[可升级模式](https://blog.zeppelinos.org/proxy-patterns/)，使开发者能够选择让其已部署的代码具备可变性*。为
    EVM 编写智能合约的人都知道，其中一个顾虑/限制是已部署合约的不可变性：一旦上链，合约无法更改。这正是 ZeppelinOS 承诺中有趣的地方之一。


    直到现在，为了“更新”合约，必须部署两个合约——一个作为带有接口的代理，另一个作为实现。代理的函数会被调用，并将请求转发给实现。如果需要更改，则在代理中替换实现（重定向到另一个实现，并可选择用
    `suicide` 函数销毁原始实现），新实现便无缝激活。


    我们正在等待观察社区对 ZeppelinOS 的未来采用情况。Zeppelin Solutions 已点名一些举足轻重的参与者，如 OpenBazaar、district0x、storj.io
    等正在使用 ZeppelinOS。


    ## Truffle Boxes


    [Truffle 框架](http://truffleframework.com)是以太坊的开发环境、测试框架和资源管道。它是工具集最完整、在以太坊开发者中关注度最高的框架。Truffle
    的生态系统包含许多 [Truffle Boxes](http://truffleframework.com/boxes/)——即样板项目，包含前端 JavaScript
    代码、Solidity 合约和工作流实用程序，如带有工具集的样板 webpack 项目——迁移、测试、构建管道等。Truffle Boxes 可包含完整的入门级
    dapp。


    部分官方支持的 Boxes 包括：


    *   **Drizzle**：一组[基于 React/Redux 的前端库](http://truffleframework.com/boxes/drizzle)，可简化
    dapp 前端的创建。

    *   **React box**：一个用于从 React 前端应用开始与智能合约交互的[基础应用](http://truffleframework.com/boxes/react)。

    *   **[React Auth box](http://truffleframework.com/boxes/react-auth)**：提供由智能合约驱动的身份验证所需的组件集。

    *   **[React-Uport](http://truffleframework.com/boxes/react-uport)**：此身份验证 box
    将前端与 UPort 区块链身份验证系统连接。

    *   还有我们之前提到的 [webpack 项目样板](http://truffleframework.com/boxes/webpack) box。


    社区创建的 boxes 还带来了用于[合约与移动应用 / Status IM 集成](http://truffleframework.com/boxes/status)的样板，或提供
    Angular 和 Vue.js 样板等。


    这些 boxes 与 Truffle 集成，因此我们可以通过运行类似 `truffle unbox react` 的命令开始使用它们——这将下载 *React*
    box 并在本地安装其依赖项。


