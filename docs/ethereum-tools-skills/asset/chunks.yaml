- raw: "In this tutorial, we’ve used Truffle and OpenZeppelin to build a simple token,\
    \ then used truffle-flattener to flatten the custom contract and Remix IDE to\
    \ start debugging the contract for errors.\n\nHopefully this will help you fearlessly\
    \ dive into step-by-step debugging of your own contracts. Let us know how it works\
    \ out for you!\n\n# Chapter 9: Debugging with Truffle CLI\n\n### by Mislav Javor\n\
    \n**Debuggers have been crucial software development tools for over thirty years.**\n\
    \nA modern debugger enables us to:\n\n*   run the code line-by-line\n\n*   set\
    \ breakpoints in the code\n\n*   put conditions on the breakpoints\n\n*   evaluate\
    \ expressions during runtime.\n\nMost modern debuggers are also highly integrated\
    \ into development environments of languages they are serving. They enable setting\
    \ breakpoints by clicking on line numbers, evaluating expressions by hovering\
    \ over variables, writing conditional breakpoints in the code comments … and so\
    \ on.\n\nSo what is the state of Solidity smart contract debugging and debuggers?\n\
    \n## Solidity Debugger\n\nAs with most blockchain things, we’re still in the infancy\
    \ stage. The basic debuggers are available (and advancing at a rapid pace), but\
    \ no editor integrations are here yet, *and* the debugger heavily relies on the\
    \ framework of choice.\n\nIn this article, we’ll be exploring the Solidity debugger\
    \ bundled with the [Truffle Suite](http://truffleframework.com/).\n\n## Getting\
    \ Started\n\nFirst, we’ll need to install all the required tools. Luckily for\
    \ us, the Truffle framework is very well integrated, so we’ll just need to install\
    \ it.\n\nFirst, install [Node.js and NPM](https://nodejs.org/en/download/). After\
    \ you’ve installed Node, you can verify that it’s installed by checking the version\
    \ of the tool like this:\n\n```\n➜  ~ node -v\nv10.2.1\n➜  ~ npm -v\n5.6.0\n```\n\
    \nIf your Node is up and running, let’s install the Truffle framework. This is\
    \ made simple enough by the usage of `npm`, so just run this:\n\n```\nnpm install\
    \ -g truffle\n```\n\nYou can check whether the install was successful by checking\
    \ the version:\n\n```\ntruffle version\nTruffle v4.1.11 (core: 4.1.11)\nSolidity\
    \ v0.4.24 (solc-js)\n```\n\n## Setting Up the Project\n\nNow that you have Truffle\
    \ all set up, let’s create a new (empty) Truffle project. Open your terminal,\
    \ position yourself into a desired directory and run `truffle init`. The output\
    \ should be similar to this:\n\n```\ntruffle init\nDownloading...\nUnpacking...\n\
    Setting up...\nUnbox successful. Sweet!\n\nCommands:\n\n    Compile:        truffle\
    \ compile\n    Migrate:        truffle migrate\n    Test contracts: truffle test\n\
    ```\n\nAfter you’ve done this, you should have a contract structure similar to\
    \ this:\n\n```\n.\n├── contracts\n│   └── Migrations.sol\n├── migrations\n│  \
    \ └── 1_initial_migration.js\n├── test\n├── truffle-config.js\n└── truffle.js\n\
    ```\n\nNow open the `truffle.js` file and put the following data into it:\n\n\
    ```\nmodule.exports = {\n    networks: {\n        development: {\n           \
    \ port: 9545,\n            host: \"127.0.0.1\",\n            network_id: \"*\"\
    \n        }\n    }\n};\n```\n\nSave the file and run `truffle develop`. You should\
    \ get an output similar to this:\n\n```\ntruffle develop\nTruffle Develop started\
    \ at http://127.0.0.1:9545/\n\nAccounts:\n(0) 0x627306090abab3a6e1400e9345bc60c78a8bef57\n\
    (1) 0xf17f52151ebef6c7334fad080c5704d77216b732\n(2) 0xc5fdf4076b8f3a5357c5e395ab970b5b54098fef\n\
    (3) 0x821aea9a577a9b44299b9c15c88cf3087f3b5544\n(4) 0x0d1d4e623d10f9fba5db95830f7d3839406c6af2\n\
    (5) 0x2932b7a2355d6fecc4b5c0b6bd44cc31df247a2e\n(6) 0x2191ef87e392377ec08e7c08eb105ef5448eced5\n\
    (7) 0x0f4f2ac550a1b4e2280d04c21cea7ebd822934b5\n(8) 0x6330a553fc93768f612722bb8c2ec78ac90b3bbc\n\
    (9) 0x5aeda56215b167893e80b4fe645ba6d5bab767de\n\nPrivate Keys:\n(0) c87509a1c067bbde78beb793e6fa76530b6382a4c0241e5e4a9ec0a0f44dc0d3\n\
    (1) ae6ae8e5ccbfb04590405997ee2d52d2b330726137b875053c36d94e974d162f\n(2) 0dbbe8e4ae425a6d2687f1a7e3ba17bc98c673636790f1b8ad91193c05875ef1\n\
    (3) c88b703fb08cbea894b6aeff5a544fb92e78a18e19814cd85da83b71f772aa6c\n(4) 388c684f0ba1ef5017716adb5d21a053ea8e90277d0868337519f97bede61418\n\
    (5) 659cbb0e2411a44db63778987b1e22153c086a95eb6b18bdf89de078917abc63\n(6) 82d052c865f5763aad42add438569276c00d3d88a2d062d36b2bae914d58b8c8\n\
    (7) aa3680d5d48a8283413f7a108367c7299ca73f553735860a87b08f39395618b7\n(8) 0f62d96d6675f32685bbdb8ac13cda7c23436f63efbb9d07700d8669ff12b7c4\n\
    (9) 8d5366123cb560bb606379f90a0bfd4769eecc0557f1b362dcae9012b548b1e5\n\nMnemonic:\
    \ candy maple cake sugar pudding cream honey rich smooth crumble sweet treat\n\
    \nImportant  : This mnemonic was created for you by Truffle. It is not secure.\n\
    Ensure you do not use it on production blockchains, or else you risk losing funds.\n\
    ```\n\nThis started an instance of the Truffle development blockchain backed by\
    \ `ganache-cli` (former `TestRPC`).\n\n## Writing and Deploying the Contract\n\
    \nIn the contracts directory, make a file called `Storage.sol`. In that file,\
    \ put the following code:\n\n```\npragma solidity ^0.4.23;\n\n\ncontract Storage\
    \ {\n\n    uint[] private _numberStorage;\n\n    event AddedNewNumber(uint position);\n\
    \n    function addNumber(uint newNumber) public returns (uint) {\n        _numberStorage.push(newNumber);\n\
    \n        uint numberPosition = _numberStorage.length;\n\n        emit AddedNewNumber(numberPosition);\n\
    \        return numberPosition;\n    }\n\n    function getNumber(uint position)\
    \ public constant returns (uint) {\n        return _numberStorage[position];\n\
    \    }\n\n}\n```\n\nAfter you’re done with this, your file structure should look\
    \ like this:\n\n```\n├── contracts\n│   ├── Migrations.sol\n│   └── Storage.sol\n\
    ├── migrations\n│   └── 1_initial_migration.js\n├── test\n├── truffle-config.js\n\
    └── truffle.js\n```\n\nIn the `migrations` directory, make a new file called `2_deploy_migrations.js`\
    \ and put the following code into it:\n\n```\nvar Storage = artifacts.require(\"\
    ./Storage.sol\");\n\nmodule.exports = function(deployer) {\n\n    deployer.deploy(Storage);\n\
    \n}\n```\n\nThis code defines *how* Truffle will migrate our project to the blockchain.\n\
    \nNow open a new tab in the terminal (leaving the `truffle develop` running) and\
    \ run `truffle migrate`. This will compile and migrate your contracts to the development\
    \ blockchain. You should get an output like this:\n\n```\nUsing network 'development'.\n\
    \nRunning migration: 1_initial_migration.js\n    Deploying Migrations...\n   \
    \ ... 0x819678a9812313714a27b52c30f065544a331ec5c79ec6c251bc97cd09398d08\n   \
    \ Migrations: 0x8cdaf0cd259887258bc13a92c0a6da92698644c0\nSaving successful migration\
    \ to network...\n    ... 0xd7bc86d31bee32fa3988f1c1eabce403a1b5d570340a3a9cdba53a472ee8c956\n\
    Saving artifacts...\n```\n\nNow write `truffle console`. This will open up an\
    \ interactive console for you to test out your contracts. In the console do the\
    \ following:"
