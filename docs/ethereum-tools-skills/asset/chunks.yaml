    \ similar to this:\n\n```\n\"networks\": {\n  \"1525343635906\": {\n    \"events\"\
    : {},\n    \"links\": {},\n    \"address\": \"0xd8e2af5be9af2a45fc3ee7cdcb68d9bcc37a3c81\"\
    ,\n    \"transactionHash\": \"0xb8ec575a9f3eca4a11a3f61170231a1816f7c68940d8487e56567adcf5c0a21e\"\
    \n  }\n}\n```\n\n`1525343635906` is the ID of the network. (The Ethereum main\
    \ network and all the major testnets have fixed IDs like 1,2,3 etc.)\n\n`address`\
    \ is the address to which the contract was deployed.\n\n`transactionHash` is the\
    \ hash of the transaction which was used for contract deployment.\n\nWe’ll see\
    \ how this is useful later on in the tutorial.\n\n### Multiple contracts\n\nWhere\
    \ Truffle migrations really shine is when there are multiple contracts to compile,\
    \ deploy and keep track of (which almost all blockchain projects have).\n\nNot\
    \ only do migrations allow us to deploy multiple contracts with a single command,\
    \ they allow us to run arbitrary functions on the contracts, get return values\
    \ of those functions and pass them to subsequent contracts.\n\nNow in your `contracts`\
    \ directory, create a file called `InfoManager.sol`. In the file write a contract\
    \ like this:\n\n```\npragma solidity ^0.4.21;\n\nimport \"./Storage.sol\";\n\n\
    \ncontract InfoManager {\n\n    Storage private _dataStore;\n\n    uint private\
    \ _lastAdded;\n\n    function InfoManager(Storage dataStore) public {\n      \
    \  _dataStore = dataStore;\n    }\n\n    function addData(string key, string value)\
    \ public {\n        require((now - 1 days) > _lastAdded);\n        _dataStore.addData(key,\
    \ value);\n    }\n\n}\n```\n\nAs we can see, this contract depends on the `Storage`\
    \ contract. Not only that, it takes the `Storage` contract as a parameter in its\
    \ constructor. Let’s examine the migrations which will make this possible. The\
    \ migrations are contained in the same file called `2_deploy_contracts.js`:\n\n\
    ```\nvar Storage = artifacts.require(\"./Storage.sol\");\nvar InfoManager = artifacts.require(\"\
    ./InfoManager.sol\");\n\nmodule.exports = function(deployer) {\n\n    // Deploy\
    \ the Storage contract\n    deployer.deploy(Storage)\n        // Wait until the\
    \ storage contract is deployed\n        .then(() => Storage.deployed())\n    \
    \    // Deploy the InfoManager contract, while passing the address of the\n  \
    \      // Storage contract\n        .then(() => deployer.deploy(InfoManager, Storage.address));\n\
    }\n```\n\nThe syntax for deploying is:\n\n```\n...\ndeployer.deploy(`ContractName`,\
    \ [`constructor params`]) // Returns a promise\n...\n```\n\nSince the `deploy(...)`\
    \ function returns a promise, you can handle it any way you like, with the notable\
    \ exception of `async` not working in migrations for some reason.\n\nYou can also\
    \ run custom steps after the contract has been deployed. For example, the migration\
    \ could look like this:\n\n```\ndeployer.deploy(Storage)\n    .then(() => Storage.deployed())\n\
    \    .then((instance) => {\n        instance.addData(\"Hello\", \"world\")\n \
    \   }).then(() => deployer.deploy(InfoManager, Storage.address));\n```\n\nThis\
    \ would populate the `Storage` contract with a string `world` at the key `data`\
    \ before deploying the `InfoManager` contract.\n\nThis is useful because sometimes\
    \ the interdependence between contracts can be such that some data must be either\
    \ retrieved or inserted outside of the scope of the contract constructor.\n\n\
    ### Networks\n\nYou’re able to conditionally run certain migrations depending\
    \ on which network you’re on. This can be very useful for either populating mock\
    \ data in the development phase or inputting already deployed mainnet contracts\
    \ into your contracts.\n\nThis is done by “expanding” the inserted parameters\
    \ of the `module.exports` function:\n\n```\nmodule.exports = function(deployer,\
    \ network) {\n    if (network == \"live\") {\n        // do one thing\n    } else\
    \ if (network == \"development\") {\n        // do other thing\n    }\n}\n```\n\
    \n### Accounts\n\nThe `module.exports` default function also exposes the accounts\
    \ which you have access to through your Ethereum node or the wallet provider.\
    \ Here’s an example:\n\n```\nmodule.exports = function(deployer, network, accounts)\
    \ {\n    var defaultAccount;\n    if (network == \"live\") {\n        defaultAccount\
    \ = accounts[0]\n    } else {\n        defaultAccount = accounts[1]\n    }\n}\n\
    ```\n\n### Libraries\n\nYou’re also able to link existing libraries (already deployed),\
    \ by using the `deployer.link(...)` function:\n\n```\n...\ndeployer.deploy(MyLibrary);\n\
    deployer.link(MyLibrary, MyContract);\ndeployer.deploy(MyContract);\n...\n```\n\
    \n## Conclusion\n\nBy using the techniques outlined above, you can automate most\
    \ of your blockchain deployments and reduce much of the boilerplate work involved\
    \ in the development of decentralized applications.\n\n# Chapter 8: Flattening\
    \ Contracts and Debugging with Remix\n\n### by Ahmed Bouchefra\n\n**Smart contracts\
    \ on the [Ethereum](https://www.sitepoint.com/ethereum-introduction/) main-net\
    \ use real money, so building error-free [smart contracts](https://bitfalls.com/2018/03/31/solidity-development-crash-course-building-blockchain-raffle/)\
    \ is crucial and requires special tools like debuggers.**\n\n[Remix IDE](https://www.sitepoint.com/remix-smart-contracts-ethereum-blockchain)\
    \ is the most fully-featured IDE for Solidity. Among other tools, it has an excellent\
    \ step-by-step debugger. You can perform various tasks such as moving in time,\
    \ changing the current step, exploring local variables and current state by expanding\
    \ various panels.\n\nYou can also set breakpoints to move between different points\
    \ in the code. And the terminal allows you to display transactions executed from\
    \ Remix and debug them.\n\nThroughout this tutorial, we’ll use [Truffle and OpenZeppelin](https://www.sitepoint.com/solidity-openzeppelin)\
    \ to build a simple custom token. We’ll see why and how to flatten the contract,\
    \ and finally we’ll use Remix IDE to start debugging the contract.\n\n## Why Flatten\
    \ a Smart Contract?\n\n**Flattening** a smart contract refers to combining all\
    \ Solidity code in one file instead of multiple source files such that, instead\
    \ of having imports, the imported code is embedded in the same file. We need to\
    \ flatten smart contracts for various reasons, such as manually reviewing the\
    \ contract, verifying the contract on [Etherscan](https://etherscan.io), or debugging\
    \ the contract with Remix IDE, as it currently doesn’t support imports.\n\n##\
    \ Writing a Simple Token Using Truffle and OpenZeppelin\n\nRemix IDE is officially\
    \ recommended for building small contracts or for the sake of learning Solidity,\
    \ but once you need to build a larger contract or need advanced compilation options,\
    \ you’ll have to use the Solidity compiler or other tools/frameworks such as Truffle.\n\
    \nBesides error-free contracts, security is also a crucial part of building a\
    \ smart contract. For this reason, using battle-tested frameworks like [OpenZeppelin](https://openzeppelin.org/)\
    \ that provides reusable, well-tested, community-reviewed smart contracts, will\
    \ help you reduce the vulnerabilities in your Dapps."
