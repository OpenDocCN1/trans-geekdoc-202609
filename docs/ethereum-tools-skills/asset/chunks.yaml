- raw: "The output at the end echoes the “health” status of the remote server. Since\
    \ it has no services running, it will just list the IP. You can see the same result\
    \ by selecting option 1: `Show network stats`.\n\nRepeat the process for the other\
    \ VM, so both appear in the health status screen.\n\n### New Genesis\n\nTo start\
    \ our blockchain, we should configure a new genesis file. A genesis file is a\
    \ file from which the first (genesis) block is built, and on which each subsequent\
    \ block grows.\n\nSelect option 2, `Configure new genesis`, and populate the options\
    \ like so:\n\n```\nWhich consensus engine to use? (default = clique)\n 1. Ethash\
    \ - proof-of-work\n 2. Clique - proof-of-authority\n> 2\n\nHow many seconds should\
    \ blocks take? (default = 15)\n> 10\n\nWhich accounts are allowed to seal? (mandatory\
    \ at least one)\n> 0xaba88be2dc16eaed464e3991eed5a1eaa5e7b11b\n> 0x655a6ea9950cdf9f8a8175fda639555f17277bdf\n\
    > 0x\n\nWhich accounts should be pre-funded? (advisable at least one)\n> 0x655a6ea9950cdf9f8a8175fda639555f17277bdf\n\
    > 0xaba88be2dc16eaed464e3991eed5a1eaa5e7b11b\n> 0x\n\nSpecify your chain/network\
    \ ID if you want an explicit one (default = random)\n>\nINFO [05-20|11:25:55]\
    \ Configured new genesis block\n```\n\nYou can find out about the difference between\
    \ PoW and PoA [here](https://www.sitepoint.com/proof-of-stake-vs-proof-of-work/).\
    \ PoW wastes a lot of computing power and is impractical to run on a local machine,\
    \ so we’ll pick PoA here. We reduce the block time to 10 seconds so that our transactions\
    \ confirm faster, and we add the addresses we generated previously as allowed\
    \ sealers and as pre-funded. Being sealers means that they’re allowed to create\
    \ new blocks. Since there are no mining rewards in PoA, we also pre-fund them\
    \ with almost infinite ether so we can test our transactions with those accounts.\n\
    \nThe genesis file is now generated, and for backup purposes you can export it\
    \ into an external file if you wish by selecting option 2 again. This isn’t necessary\
    \ for now.\n\nNow let’s deploy some blockchain components!\n\n## Deploying Network\
    \ Components\n\nPuppeth deploys these components in separate docker containers\
    \ using the `docker-compose` tool. Docker as a tool is outside the scope of this\
    \ post, but you don’t need to be familiar with it to use this anyway. Let’s start\
    \ with the first component, Ethstats.\n\n### Ethstats\n\nInstalling Ethstats installs\
    \ and runs a local version of [the ethstats.net website](https://ethstats.net/).\
    \ Select the first option.\n\n```\nWhich server do you want to interact with?\n\
    \ 1. vagrant@192.168.10.10\n 2. Connect another server\n> 1\n\nWhich port should\
    \ ethstats listen on? (default = 80)\n> 8081\n\nAllow sharing the port with other\
    \ services (y/n)? (default = yes)\n>\nINFO [05-20|11:43:32] Deploying nginx reverse-proxy\
    \            server=192.168.10.10         port=8081\nBuilding nginx\nStep 1/1\
    \ : FROM jwilder/nginx-proxy\n ---> e143a63bea4b\nSuccessfully built e143a63bea4b\n\
    Recreating puptest_nginx_1\n\nProxy deployed, which domain to assign? (default\
    \ = 192.168.10.10)\n> homestead.test\n\nWhat should be the secret password for\
    \ the API? (must not be empty)\n> internet2\nFound orphan containers (puptest_nginx_1)\
    \ for this project. If you removed or renamed this service in your compose file,\
    \ you can run this command with the --remove-orphans flag to clean it up.\nBuilding\
    \ ethstats\nStep 1/2 : FROM puppeth/ethstats:latest\n```\n\nWe select the first\
    \ previously added server. Then we add a port on which to deploy this software,\
    \ and then name the domain through which we’ll access the app. Finally, we generate\
    \ a simple “secret” for accessing the API of the app. Docker then takes over and\
    \ builds the software for us.\n\nThe end result should be another health screen\
    \ output, but this time the table will have another entry: it will also list the\
    \ `ethstats` app with its configuration details:\n\n```\nINFO [05-20|11:44:23]\
    \ Starting remote server health-check      server=vagrant@192.168.10.10\n+-----------------------+---------------+----------+-----------------------+----------------+\n\
    |        SERVER         |    ADDRESS    | SERVICE  |        CONFIG         | \
    \    VALUE      |\n+-----------------------+---------------+----------+-----------------------+----------------+\n\
    | vagrant@192.168.10.10 | 192.168.10.10 | ethstats | Banned addresses      | []\
    \             |\n|                       |               |          | Login secret\
    \          | internet2      |\n|                       |               |     \
    \     | Website address       | homestead.test |\n|                       |  \
    \             |          | Website listener port | 8081           |\n|       \
    \                |               |          | --------------------- | --------------\
    \ |\n|                       |               | nginx    | Shared listener port\
    \  | 8081           |\n+-----------------------+---------------+----------+-----------------------+----------------+\n\
    ```\n\nVisiting the URL `homestead.test:8081` in the browser should show a screen\
    \ like the following:\n\n![Ethstats local](images/00050.jpeg)\n\nThis application\
    \ is currently useless: we need to deploy at least one node for this app to start\
    \ showing something!\n\n### Bootnode\n\nLet’s deploy a bootnode.\n\nA bootnode\
    \ is a node which serves just as the first connection point through which an Ethereum\
    \ [node](https://bitfalls.com/2017/11/26/whats-bitcoin-node-mining-vs-validation/)\
    \ connects to other nodes. It’s basically a relayer of information helping nodes\
    \ connect.\n\nPick option 2 to deploy the bootnode. Again, deploy on the same\
    \ remote server and pick some defaults, then give the node a name for the “health\
    \ stats” table:\n\n```\nWhich server do you want to interact with?\n 1. vagrant@192.168.10.10\n\
    \ 2. vagrant@192.168.10.11\n 3. Connect another server\n> 1\n\nWhere should data\
    \ be stored on the remote machine?\n> /home/vagrant/mychain\n\nWhich TCP/UDP port\
    \ to listen on? (default = 30303)\n>\n\nHow many peers to allow connecting? (default\
    \ = 512)\n>\n\nHow many light peers to allow connecting? (default = 256)\n>\n\n\
    What should the node be called on the stats page?\n> booty\n```\n\nDocker will\
    \ build the node and run it. The location where to store data on the remote machine\
    \ is arbitrary. We picked the `vagrant` user’s home directory.\n\nIf you revisit\
    \ the `ethstats` page now (`homestead.test:8081`) you’ll notice that `booty` is\
    \ in the list of nodes!\n\n![Booty is listed](images/00051.jpeg)\n\n#### If Your\
    \ Bootnode is Listed as Offline\n\nIf this is not the case and your bootnode is\
    \ listed as offline in the healthcheck, reboot the remote server (with the VM,\
    \ that’s `vagrant reload`) and then check again\n\n### Sealnode\n\nA seal node\
    \ is a node which can serve as the miner of new blocks. Let’s deploy that next:\n\
    \n```\nWhich server do you want to interact with?\n 1. vagrant@192.168.10.10\n\
    \ 2. vagrant@192.168.10.11\n 3. Connect another server\n> 1\n\nWhere should data\
    \ be stored on the remote machine?\n> /home/vagrant/mychainsealer\n\nWhich TCP/UDP\
    \ port to listen on? (default = 30303)\n> 30301\n\nHow many peers to allow connecting?\
    \ (default = 50)\n>\n\nHow many light peers to allow connecting? (default = 0)\n\
    >\n\nWhat should the node be called on the stats page?\n> sealer\n\nPlease paste\
    \ the signer's key JSON:\n> {\"address\":\"655a6ea9950cdf9f8a8175fda639555f17277bdf\"\
    ,\"crypto\":{\"cipher\":\"aes-128-ctr\",\"ciphertext\":\"9278db9216e3c58380864bb53edcec245c5bc919a51733333410fe4b22818914\"\
    ,\"cipherparams\":{\"iv\":\"ca6579d08e97c25f46e127e026bafadb\"},\"kdf\":\"scrypt\"\
    ,\"kdfparams\":{\"dklen\":32,\"n\":262144,\"p\":1,\"r\":8,\"salt\":\"93e5f080d76e50c0e08add15d3fdd9b143295d0ccaeec9dae89446e0478ba4a1\"\
    },\"mac\":\"28fcdaaf6008d82a0fe22ac60de3398f12a47e471a21618b2333fe15d8d6c9c3\"\
    },\"id\":\"20ae40fe-ebf9-4047-8203-711bf67213e9\",\"version\":3}\n\nWhat's the\
    \ unlock password for the account? (won't be echoed)\n>\n\nWhat gas limit should\
    \ empty blocks target (MGas)? (default = 4.700)\n>\n\nWhat gas price should the\
    \ signer require (GWei)? (default = 18.000)\n>\n```"
