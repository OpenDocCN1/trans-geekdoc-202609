    To be able to easily send Ether and custom tokens around, you can deploy your
    own version of [MyEtherWallet](https://www.sitepoint.com/ethereum-wallets-myetherwallet/)
    using Puppeth.


    Select Wallet in the selection of components to deploy and populate the options
    as follows:


    ```

    Which port should the wallet listen on? (default = 80)

    > 8083


    Allow sharing the port with other services (y/n)? (default = yes)

    > no


    Where should data be stored on the remote machine?

    > /home/vagrant/wallet


    Which TCP/UDP port should the backing node listen on? (default = 30303)

    > 30304


    Which port should the backing RPC API listen on? (default = 8545)

    >


    What should the wallet be called on the stats page?

    > wallet

    ```


    The wallet should be available and auto-connected to your test network.


    ![connected](images/00053.jpeg)


    You can open a wallet by selecting JSON file as the means of unlocking it and
    pointing to one of the JSON files we generated earlier in the `my_project/nodeX/keystore`
    folders. Then enter the password, and you’ll have trillions of ether to send.
    You can use this local version of the wallet to create accounts on your private
    blockchain and thoroughly test everything. Go ahead and send some ether!


    ### Faucet


    A `Faucet` is a site on which a user can easily request some test ether. Publicly
    accessible faucets like the [Rinkeby Faucet](https://faucet.rinkeby.io/) have
    protection mechanisms against spam, but our local faucet can be much less secure
    since it’s a test blockchain.


    ```

    Which port should the faucet listen on? (default = 80)

    > 8084


    Allow sharing the port with other services (y/n)? (default = yes)

    > no


    How many Ethers to release per request? (default = 1)

    >


    How many minutes to enforce between requests? (default = 1440)

    > 1


    How many funding tiers to feature (x2.5 amounts, x3 timeout)? (default = 3)

    >


    Enable reCaptcha protection against robots (y/n)? (default = no)

    >

    WARN [05-20|12:51:13] Users will be able to requests funds via automated scripts


    Where should data be stored on the remote machine?

    > /home/vagrant/faucet


    Which TCP/UDP port should the light client listen on? (default = 30303)

    > 30305


    What should the node be called on the stats page?

    > faucet


    Please paste the faucet''s funding account key JSON:

    > {"address":"655a6ea9950cdf9f8a8175fda639555f17277bdf","crypto":{"cipher":"aes-128-ctr","ciphertext":"9278db9216e3c58380864bb53edcec245c5bc919a51733333410fe4b22818914","cipherparams":{"iv":"ca6579d08e97c25f46e127e026bafadb"},"kdf":"scrypt","kdfparams":{"dklen":32,"n":262144,"p":1,"r":8,"salt":"93e5f080d76e50c0e08add15d3fdd9b143295d0ccaeec9dae89446e0478ba4a1"},"mac":"28fcdaaf6008d82a0fe22ac60de3398f12a47e471a21618b2333fe15d8d6c9c3"},"id":"20ae40fe-ebf9-4047-8203-711bf67213e9","version":3}


    What''s the unlock password for the account? (won''t be echoed)

    >


    Permit non-authenticated funding requests (y/n)? (default = false)

    > y

    ```


    Once these services have all been added, you should be able to see them in the
    Ethstats list.


    ![All services are listed](images/00054.jpeg)


    ### Dashboard


    Finally, Puppeth offers the “Dashboard”, a web interface which combines all the
    interfaces we’ve launched so far. The deployment process is equally simple: just
    follow the steps, and when asked about linking to existing components, select
    those that we already booted up. The final result should look something like this:


    ![Dashboard](images/00055.jpeg)


    The dashboard is a collection of all the tools we’ve deployed so far, plus some
    instructions on how to manually connect to the blockchain we had built.


    ## Conclusion


    You can now start developing your smart contracts with ease, and deploy them to
    your test blockchain through your local version of MyEtherWallet or the MetaMask
    integration of Remix, or any [other combination](https://bitfalls.com/2018/03/26/connecting-myetherwallet-mist-metamask-private-blockchain/).


    Puppeth is a one-stop shop of blockchain service management tools. It’s very handy
    when you’re doing blockchain development often, but can be complicated to wrap
    one’s head around. Hopefully this guide has helped you understand what it does
    and how it does it, and will assist you in your future blockchain endeavors.


    The Docker containers that run the components are configured to auto-run on boot,
    so rebooting either of the VMs will not require any reconfiguration, but you’ll
    need to re-add the servers into Puppeth if you want to further tweak some components
    or install new ones.


    Any questions? Ping the author [on Twitter](https://twitter.com/bitfalls)!

