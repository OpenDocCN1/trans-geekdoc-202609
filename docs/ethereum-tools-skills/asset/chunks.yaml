    \ should be .active\");\n        Assert.equal(seller, this, \"The function caller\
    \ should be the seller\");\n    }\n\n}\n```\n\n让我们看看测试中的一些重要部分。首先：\n\n```solidity\n\
    HashMarket market = HashMarket(DeployedAddresses.HashMarket());\n```\n\n这段代码使用\
    \ `DeployedAddresses` 库来创建一个用于测试的 `HashMarket` 合约新实例。\n\n```solidity\nAssert.equal(<current>,\
    \ <expected>, <message>)\n```\n\n这部分代码负责检查两个值是否相等。如果相等，它会向测试套件传达成功消息。如果不相等，则传达失败消息。它还会附加该消息，以便你能知道代码*在何处*失败。\n\
    \n现在让我们运行它：\n\n```bash\ntruffle test\n```\n\n你应该会得到如下结果：\n\n```\nTestHashMarket\n\
