- raw: "Let’s now see how we can use Truffle and OpenZeppelin to create a simple custom\
    \ Token that extends the standard token from OpenZeppelin.\n\n### Requirements\n\
    \nThis tutorial requires some knowledge of Truffle, Ethereum and Solidity. You\
    \ can read the [Blockchain Introduction](https://www.sitepoint.com/blockchain-what-it-is-how-it-works-why-its-so-popular/)\
    \ and [Ethereum Introduction](https://www.sitepoint.com/ethereum-introduction/).\n\
    \nYou also need to have Node.js *5.0+* and npm installed on your system. Refer\
    \ to their [download page](https://nodejs.org/en/download/) for instructions.\n\
    \n### Installing Truffle\n\nUsing your terminal, run the following command to\
    \ install Truffle:\n\n```\nnpm install -g truffle\n```\n\n### Creating a New Truffle\
    \ Project\n\nStart by creating a new directory for your project. Let’s call it\
    \ `simpletoken` and navigate into it:\n\n```\nmkdir simpletoken\ncd simpletoken\n\
    ```\n\nNext, create the actual project files using:\n\n```\ntruffle init\n```\n\
    \nThis command will create multiple folders, such as `contracts/` and `migrations/`,\
    \ and files that will be used when deploying the contract to the blockchain.\n\
    \nNext, we’ll install OpenZeppelin:\n\n```\nnpm install openzeppelin-solidity\n\
    ```\n\n### Creating a Simple Token Contract\n\nInside the `contracts/` folder,\
    \ create a file named `SimpleToken.sol` and add the following content:\n\n```\n\
    pragma solidity ^0.4.23;\n\nimport 'openzeppelin-solidity/contracts/token/ERC20/StandardToken.sol';\n\
    \ncontract SimpleToken is StandardToken {\n    address public owner;\n\n    string\
    \ public name = 'SimpleToken';\n    string public symbol = 'STt';\n    uint8 public\
    \ decimals = 2;\n    uint public INITIAL_SUPPLY = 10000;\n\n    constructor()\
    \ public {\n      totalSupply_ = INITIAL_SUPPLY;\n      balances[owner] = INITIAL_SUPPLY;\n\
    \    }\n\n}\n```\n\nThis is the contract that we’re going to flatten and debug.\
    \ We’re importing the OpenZeppelin `StandardToken.sol` contract and declaring\
    \ our `SimpleToken` contract which extends `StandardToken.sol` using the `is`\
    \ operator.\n\nOur contract will inherit a bunch of variables and functions, which\
    \ need to be overridden in order to customize the contract.\n\nFor the sake of\
    \ completing our Truffle project, inside the `migrations/` folder of your project,\
    \ create a file called `2_deploy_contract.js` and add the following content:\n\
    \n```\nvar  SimpleToken = artifacts.require(\"SimpleToken\");\n    module.exports\
    \  =  function(deployer) {\n        deployer.deploy(SimpleToken);\n};\n```\n\n\
    Using this file, we can deploy/migrate our smart contract into the blockchain,\
    \ but we don’t actually need this for this example, because we’re going to use\
    \ Remix IDE to deploy the smart contract after flattening it.\n\n### Flattening\
    \ the Contract Using Truffle Flattener\n\n[Truffle Flattener](https://www.npmjs.com/package/truffle-flattener)\
    \ is an npm utility that flattens or combines Solidity files developed under Truffle\
    \ with all of their dependencies in the right order.\n\nFirst, start by installing\
    \ `truffle-flattener` from npm globally using:\n\n```\nnpm install -g truffle-flattener\n\
    ```\n\nNext, inside your Truffle project, run the following command to flatten\
    \ the `SimpleToken.sol` file:\n\n```\ntruffle-flattener contracts/SimpleToken.sol\
    \ > FlattenedSimpleToken.sol\n```\n\n`truffle-flattener` outputs the flattened\
    \ contract into the standard output or the terminal. Using the `>` operator we\
    \ save the output in the `FlattenedSimpleToken.sol` file inside the current folder.\n\
    \n### Compiling and Deploying the Contract Using Remix IDE\n\nYou can access your\
    \ flattened smart contract from the `FlattenedSimpleToken.sol` file. Open the\
    \ file and copy its content.\n\nNext, open Remix IDE from [https://remix.ethereum.org](https://remix.ethereum.org)\
    \ and paste the flattened smart contract into a new file in the IDE.\n\nIf you\
    \ get an error saying *Mock compiler : Source not found*, make sure to select\
    \ a newer compiler version from *Settings tab > Solidity version pane > select\
    \ new compiler version dropdown*.\n\nIf *Auto compile* is disabled, click on the\
    \ *Start to compile* button in the *Compile* panel.\n\nNext, activate the *Run*\
    \ panel. First make sure you have *JavaScript VM* selected for environment. On\
    \ the second box, select the *SimpleToken* contract from the drop-down, then click\
    \ on the red *Deploy* button, right below the drop-down.\n\nYour contract is deployed\
    \ and running on the JavaScript VM, which simulates a blockchain. We can now start\
    \ debugging it in different ways.\n\n## Debugging the Custom Token Contract\n\n\
    To see how we can debug the contract, we’ll first introduce some errors.\n\nYou\
    \ can start debugging smart contracts in Remix IDE using two different ways, depending\
    \ on the use case.\n\nWhen you first deploy your smart contract or perform any\
    \ transaction afterwards, some information will be logged in the terminal and\
    \ you can start debugging it from the white *Debug* button next to the log. Let’s\
    \ see that in action.\n\n### Using assert()\n\nSafeMath is an OpenZeppelin library\
    \ for Math operations with safety checks that throw an error. The `sub(a,b)` function\
    \ subtracts two numbers and returns an unsigned number. The first parameter should\
    \ be greater than the second parameter so we can always get a positive number.\
    \ The function enforces this rule using an *assert()* function. This is the code\
    \ for the *sub* function:\n\n```\n  function sub(uint256 a, uint256 b) internal\
    \ pure returns (uint256) {\n    assert(b <= a);\n    return a - b;\n  }\n```\n\
    \nAs long as you provide values for *a* and *b* that verify the condition *b <=\
    \ a*, the execution continues without problems, but once you provide a value of\
    \ *b* greater that *a*, the *assert()* function will throw an error that says:\n\
    \n```\nVM error: invalid opcode. invalid opcode The execution might have thrown.\
    \ Debug the transaction to get more information.  \n```\n\nSo let’s add a call\
    \ to the *sub()* with wrong parameters in the *SimpleToken* contract:\n\n```\n\
    \    constructor() public {\n      totalSupply_ = INITIAL_SUPPLY;\n      balances[owner]\
    \ = INITIAL_SUPPLY;\n      SafeMath.sub(10, 1000);\n    }\n```\n\nIf you redeploy\
    \ the contract, you’re going to get the the invalid opcode error in the terminal:\n\
    \n![Invalid opcode error](images/00038.jpeg)\n\nOnce you click the *Debug* button\
    \ you’ll be taken to the *Debugger* panel where you can start debugging your code.\n\
    \n![The debugger panel](images/00039.jpeg)\n\nIn the code editor, the first line/instruction\
    \ will be highlighted marking where we are currently at the code.\n\n![First line/instruction\
    \ highlighted](images/00040.jpeg)\n\nClick on the *Step over forward* button to\
    \ step through the code.\n\n![Step over forward button](images/00041.jpeg)\n\n\
    You can also jump right in the exception using the *Jump to exception* button.\n\
    \n![Jump to exception button](images/00042.jpeg)\n\nWhatever way you’re using,\
    \ the debugger will take you to the code causing the problem, and will then stop.\n\
    \n![Stopping on the problem](images/00043.jpeg)\n\nYou can inspect the state of\
    \ the local variables at the current step.\n\n![local variables at the current\
    \ step](images/00044.jpeg)\n\nThe *Solidity Locals* panel displays local variables\
    \ associated with the current context.\n\nFrom the source code and *Solidity Locals*,\
    \ you can conclude that the source of the problem is related to the *assert()*\
    \ method and the value of *b* being greater than the value of *a*.\n\nYou can\
    \ stop debugging using the *stop debugging* button.\n\n![Stop debugging button](images/00045.jpeg)\n\
    \nIt’s also worth looking at the other panels of the debugger.\n\n### Instructions\n\
    \n![Instructions panel](images/00046.jpeg)\n\nThe *Instructions* panel displays\
    \ the byte-code of the debugged contract. The byte-code of the current step is\
    \ highlighted.\n\n### Solidity State\n\n![Solidity state](images/00047.jpeg)\n\
    \nThe *Solidity State* panel displays state variables of the currently debugged\
    \ contract.\n\n### Low Level Panels\n\n![Low level panels](images/00048.jpeg)\n\
    \nThese panels display low level information about the execution such as step\
    \ details, memory, stack and return value of functions.\n\n## Conclusion"
  fmt: "\n# 使用 Truffle 和 OpenZeppelin 创建自定义 Token\n\n本文介绍如何使用 Truffle 和 OpenZeppelin\
    \ 创建一个扩展自 OpenZeppelin 标准 Token 的简单自定义 Token。\n\n## 环境要求\n\n本教程需要具备 Truffle、Ethereum\
    \ 和 Solidity 的基础知识。您可以阅读 [区块链简介](https://www.sitepoint.com/blockchain-what-it-is-how-it-works-why-its-so-popular/)\
    \ 和 [Ethereum 简介](https://www.sitepoint.com/ethereum-introduction/)。\n\n您还需要在系统上安装\
    \ Node.js `5.0+` 和 npm。请参考其 [下载页面](https://nodejs.org/en/download/) 获取安装说明。\n\n\
    ## 安装 Truffle\n\n在终端中运行以下命令安装 Truffle：\n\n```\nnpm install -g truffle\n```\n\n\
    ## 创建新的 Truffle 项目\n\n首先创建一个新的项目目录，命名为 `simpletoken` 并进入该目录：\n\n```\nmkdir simpletoken\n\
    cd simpletoken\n```\n\n接下来，使用以下命令创建实际的项目文件：\n\n```\ntruffle init\n```\n\n该命令将创建多个文件夹（如\
    \ `contracts/` 和 `migrations/`）以及部署合约到区块链时所需的文件。\n\n接着，安装 OpenZeppelin：\n\n```\n\
    npm install openzeppelin-solidity\n```\n\n## 创建简单的 Token 合约\n\n在 `contracts/`\
    \ 文件夹内，创建一个名为 `SimpleToken.sol` 的文件并添加以下内容：\n\n```\npragma solidity ^0.4.23;\n\
    \nimport 'openzeppelin-solidity/contracts/token/ERC20/StandardToken.sol';\n\n\
    contract SimpleToken is StandardToken {\n    address public owner;\n\n    string\
    \ public name = 'SimpleToken';\n    string public symbol = 'STt';\n    uint8 public\
    \ decimals = 2;\n    uint public INITIAL_SUPPLY = 10000;\n\n    constructor()\
    \ public {\n      totalSupply_ = INITIAL_SUPPLY;\n      balances[owner] = INITIAL_SUPPLY;\n\
    \    }\n\n}\n```\n\n这是我们将要扁平化和调试的合约。我们导入了 OpenZeppelin 的 `StandardToken.sol` 合约，并使用\
    \ `is` 操作符声明了继承自 `StandardToken.sol` 的 `SimpleToken` 合约。\n\n我们的合约将继承一系列变量和函数，这些需要被重写以实现自定义。\n\
    \n为了完成 Truffle 项目，在项目的 `migrations/` 文件夹内创建一个名为 `2_deploy_contract.js` 的文件并添加以下内容：\n\
    \n```\nvar SimpleToken = artifacts.require(\"SimpleToken\");\nmodule.exports =\
    \ function(deployer) {\n    deployer.deploy(SimpleToken);\n};\n```\n\n使用该文件，我们可以将智能合约部署/迁移到区块链，但本例中并不需要此步骤，因为我们将在扁平化后使用\
    \ Remix IDE 部署智能合约。\n\n## 使用 Truffle Flattener 扁平化合约\n\n[Truffle Flattener](https://www.npmjs.com/package/truffle-flattener)\
    \ 是一个 npm 工具，用于将 Truffle 下开发的 Solidity 文件及其所有依赖按正确顺序扁平化或合并。\n\n首先，全局安装 `truffle-flattener`：\n\
    \n```\nnpm install -g truffle-flattener\n```\n\n接下来，在 Truffle 项目中运行以下命令扁平化 `SimpleToken.sol`\
    \ 文件：\n\n```\ntruffle-flattener contracts/SimpleToken.sol > FlattenedSimpleToken.sol\n\
    ```\n\n`truffle-flattener` 将扁平化后的合约输出到标准输出（终端）。使用 `>` 操作符将输出保存到当前文件夹下的 `FlattenedSimpleToken.sol`\
    \ 文件中。\n\n## 使用 Remix IDE 编译和部署合约\n\n您可以从 `FlattenedSimpleToken.sol` 文件获取扁平化后的智能合约。打开文件并复制其内容。\n\
    \n接着，打开 Remix IDE（[https://remix.ethereum.org](https://remix.ethereum.org)），将扁平化后的智能合约粘贴到\
    \ IDE 中的新文件里。\n\n如果出现 *Mock compiler : Source not found* 错误，请确保在 *Settings tab\
    \ > Solidity version pane > select new compiler version dropdown* 中选择了更新的编译器版本。\n\
    \n如果 *Auto compile* 被禁用，请在 *Compile* 面板点击 *Start to compile* 按钮。\n\n接下来，激活 *Run*\
    \ 面板。首先确保 *Environment* 选择了 *JavaScript VM*。在第二个下拉框中选择 *SimpleToken* 合约，然后点击下拉框下方的红色\
    \ *Deploy* 按钮。\n\n您的合约已部署并在 JavaScript VM 上运行，该虚拟机模拟了区块链环境。现在我们可以开始以不同方式对其进行调试。\n\
    \n# 调试自定义 Token 合约\n\n为了演示如何调试合约，我们将首先引入一些错误。\n\n在 Remix IDE 中，根据用例不同，有两种方式开始调试智能合约。\n\
    \n当您首次部署智能合约或随后执行任何交易时，终端会记录一些信息，您可以点击日志旁边的白色 *Debug* 按钮开始调试。让我们看看实际操作。\n\n##\
    \ 使用 assert()\n\nSafeMath 是 OpenZeppelin 用于带安全检查的数学运算的库，检查失败会抛出错误。`sub(a,b)` 函数用于两数相减并返回无符号数。第一个参数必须大于第二个参数以保证结果为正数。该函数使用\
    \ `assert()` 函数强制执行此规则。以下是 `sub` 函数的代码：\n\n```\nfunction sub(uint256 a, uint256\
    \ b) internal pure returns (uint256) {\n    assert(b <= a);\n    return a - b;\n\
    }\n```\n\n只要您提供的 `a` 和 `b` 值满足条件 `b <= a`，执行就会继续而不会出现问题；但一旦您提供的 `b` 值大于 `a`，`assert()`\
    \ 函数将抛出如下错误：\n\n```\nVM error: invalid opcode. invalid opcode The execution might\
    \ have thrown. Debug the transaction to get more information.\n```\n\n因此，让我们在\
    \ `SimpleToken` 合约的构造函数中添加一个带有错误参数的 `sub()` 调用：\n\n```\nconstructor() public {\n\
    \    totalSupply_ = INITIAL_SUPPLY;\n    balances[owner] = INITIAL_SUPPLY;\n \
    \   SafeMath.sub(10, 1000);\n}\n```\n\n如果您重新部署合约，终端将显示 invalid opcode 错误：\n\n\
    ![Invalid opcode error](images/00038.jpeg)\n\n点击 *Debug* 按钮后，您将进入 *Debugger* 面板，可以开始调试代码。\n\
    \n![The debugger panel](images/00039.jpeg)\n\n在代码编辑器中，第一行/指令会被高亮显示，标记当前所在位置。\n\
    \n![First line/instruction highlighted](images/00040.jpeg)\n\n点击 *Step over forward*\
    \ 按钮逐步执行代码。\n\n![Step over forward button](images/00041.jpeg)\n\n您也可以使用 *Jump\
    \ to exception* 按钮直接跳转到异常处。\n\n![Jump to exception button](images/00042.jpeg)\n\
    \n无论使用哪种方式，调试器都会定位到导致问题的代码并停下。\n\n![Stopping on the problem](images/00043.jpeg)\n\
    \n您可以在当前步骤检查局部变量的状态。\n\n![local variables at the current step](images/00044.jpeg)\n\
    \n*Solidity Locals* 面板显示与当前上下文关联的局部变量。\n\n通过源代码和 *Solidity Locals*，您可以得出结论：问题源于\
    \ `assert()` 方法以及 `b` 的值大于 `a` 的值。\n\n您可以使用 *stop debugging* 按钮停止调试。\n\n![Stop\
    \ debugging button](images/00045.jpeg)\n\n查看调试器的其他面板也很有价值。\n\n### Instructions（指令）\n\
    \n![Instructions panel](images/00046.jpeg)\n\n*Instructions* 面板显示被调试合约的字节码。当前步骤的字节码会被高亮显示。\n\
    \n### Solidity State（Solidity 状态）\n\n![Solidity state](images/00047.jpeg)\n\n\
    *Solidity State* 面板显示当前被调试合约的状态变量。\n\n### Low Level Panels（底层面板）\n\n![Low level\
    \ panels](images/00048.jpeg)\n\n这些面板显示执行的底层信息，如步骤详情、内存、堆栈和函数返回值。\n\n## 结论\n"
