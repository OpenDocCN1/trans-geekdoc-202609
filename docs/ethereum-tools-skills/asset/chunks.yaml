  fmt: "\n# Truffle Migrations\n\nTruffle migrations enable us to “push” the smart\
    \ contracts to the Ethereum blockchain (either [local, testnet or mainnet](https://bitfalls.com/2018/02/08/what-is-an-ethereum-testnet-and-how-is-it-used/))\
    \ and to set up necessary steps for linking contracts with other contracts as\
    \ well as populate contracts with initial data.\n\nWhere migrations really shine\
    \ is the management of contract addresses on the blockchain. This usually tedious\
    \ job gets almost entirely abstracted away with Truffle.\n\n## Prerequisites\n\
    \nMake sure that you have installed the [Truffle Framework](http://truffleframework.com/)\
    \ and [Ganache CLI](https://github.com/trufflesuite/ganache-cli).\n\n## Getting\
    \ Started\n\nFor starters, choose a project folder and then run `truffle init`.\
    \ You should get an output similar to this:\n\n```\nDownloading...\nUnpacking...\n\
    Setting up...\nUnbox successful. Sweet!\n\nCommands:\n\n  Compile:        truffle\
    \ compile\n  Migrate:        truffle migrate\n  Test contracts: truffle test\n\
    ```\n\nThis command creates a barebones Truffle project in the directory where\
    \ you’re positioned. The directory looks like this:\n\n```\n.\n├── contracts\n\
    │   └── Migrations.sol\n├── migrations\n│   └── 1_initial_migration.js\n├── test\n\
    ├── truffle-config.js\n└── truffle.js\n```\n\nFor starters, in the `contracts`\
    \ directory, create a new file called `Storage.sol`, which should look like this:\n\
    \n```\npragma solidity ^0.4.21;\n\n\ncontract Storage {\n\n    mapping (string\
    \ => string) private _store;\n\n    function addData(string key, string value)\
    \ public {\n        require(bytes(_store[key]).length == 0);\n        _store[key]\
    \ = value;\n    }\n\n    function removeData(string key) public returns (string)\
    \ {\n        require(bytes(_store[key]).length != 0);\n        string prev = _store[key];\n\
    \        delete _store[key];\n        return prev;\n    }\n\n    function changeData(string\
    \ key, string newValue) public {\n        require(bytes(_store[key]).length !=\
    \ 0);\n        _store[key] = newValue;\n    }\n\n}\n```\n\n## Initial Migrations\n\
    \nAs you might have noticed, two files are created when you run `truffle init`.\
    \ They are `Migrations.sol` and `1_initial_migration.js`.\n\nThe initial migration\
    \ files rarely need to be changed. What they do is essentially keep track of addresses\
    \ on the blockchain.\n\nThe `Migrations.sol` file can look any way you want it\
    \ to, but it must conform to a fixed interface which looks like the interface\
    \ created by the `truffle init` command. What you can do in those files is some\
    \ advanced mangling of migrations, but as I’ve said, it’s rarely needed.\n\nThe\
    \ same goes for the `1_initial_migration.js` file. What *it* does is simply push\
    \ the `Migrations.sol` file to the desired blockchain.\n\n## Migrations Data\n\
    \nIn order to deploy the smart contracts to the Ethereum blockchain, you must\
    \ first write migrations. In order to get started, in your `migrations` directory,\
    \ create a file called `2_deploy_contracts.js`. Your project structure should\
    \ now look like this:\n\n```\n.\n├── contracts\n│   ├── Migrations.sol\n│   └──\
    \ Storage.sol\n├── migrations\n│   ├── 1_initial_migration.js\n│   └── 2_deploy_contracts.js\n\
    ├── test\n├── truffle-config.js\n└── truffle.js\n```\n\nIn order to deploy smart\
    \ contracts with migrations, first we need to access their *artifacts*. These\
    \ are files which describe the contract addresses, the networks on which the contracts\
    \ have been deployed and the functions which contracts have.\n\nSo where does\
    \ all of this data come from?\n\nIn your project directory, run `truffle compile`.\
    \ If all goes well, you should have an output similar to this:\n\n```\nCompiling\
    \ ./contracts/Migrations.sol...\nCompiling ./contracts/Storage.sol...\n\nWriting\
    \ artifacts to ./build/contracts\n```\n\n*Depending on the compiler version, you\
    \ might get some warnings, but as long as there are no errors, you’re good to\
    \ go.*\n\nNow check your project directory structure again:\n\n```\n.\n├── build\n\
    │   └── contracts\n│       ├── Migrations.json\n│       └── Storage.json\n├──\
    \ contracts\n│   ├── Migrations.sol\n│   └── Storage.sol\n├── migrations\n│  \
    \ ├── 1_initial_migration.js\n│   └── 2_deploy_contracts.js\n├── test\n├── truffle-config.js\n\
    └── truffle.js\n```\n\nNotice that there is now a `build` folder containing two\
    \ files — `Migrations.json` and `Storage.json` — which match the smart contract\
    \ files in the `contracts` directory.\n\nThese `*.json` files contain descriptions\
    \ of their respective smart contracts. The description includes:\n\n*   Contract\
    \ name\n*   Contract ABI (Application Binary Interface — a list of all the functions\
    \ in the smart contracts along with their parameters and return values)\n*   Contract\
    \ bytecode (compiled contract data)\n*   Contract deployed bytecode (the latest\
    \ version of the bytecode which was deployed to the blockchain)\n*   The compiler\
    \ version with which the contract was last compiled\n*   A list of networks onto\
    \ which the contract has been deployed and the address of the contract on each\
    \ of those networks.\n\nThis file enables Truffle to create a JavaScript wrapper\
    \ for communicating with the smart contract. For example, when you call `contract.address`\
    \ in your JavaScript code, the Truffle framework reads the address from the `*.json`\
    \ file and enables effortless transitions between contract versions and networks.\n\
    \n## Writing Migrations\n\nArmed with this knowledge, let’s write our first migration.\
    \ In the `2_deploy_contracts.js` file, write this:\n\n```\n// Fetch the Storage\
    \ contract data from the Storage.json file\nvar Storage = artifacts.require(\"\
    ./Storage.sol\");\n\n// JavaScript export\nmodule.exports = function(deployer)\
    \ {\n    // Deployer is the Truffle wrapper for deploying\n    // contracts to\
    \ the network\n\n    // Deploy the contract to the network\n    deployer.deploy(Storage);\n\
    }\n```\n\nWriting migrations is as simple as that. In order to run the migration\
    \ script, run the following in the terminal:\n\n```\ntruffle migrate\n```\n\n\
    You should get an error saying:\n\n```\nError: No network specified. Cannot determine\
    \ current network.\n```\n\nThis means that Truffle couldn’t find the network to\
    \ which you want to deploy.\n\nIn order to use a simulated Ethereum blockchain,\
    \ open a new tab in the terminal and run `ganache-cli`. You should get an output\
    \ similar to this:\n\n```\nGanache CLI v6.1.0 (ganache-core: 2.1.0)\n\nAvailable\
    \ Accounts\n==================\n(0) 0x828da2e7b47f9480838f2077d470d39906ad1d8e\n\
    (1) 0xa4928865329324560185f1c93b5ebafd7ae6c9e8\n(2) 0x957b8b855bed52e11b2d7e9b3e6427771f299f3f\n\
    (3) 0xf4b6bcabedaf1ccb3d0c89197c4b961460f1f63d\n(4) 0x4bcae97be4a0d1f9a6dea4c23df8a2bffdb51291\n\
    (5) 0xe855c7cccac3a65ad24f006bf084c85c0197a779\n(6) 0x168cb232283701a816a3d118897eedfcae2aec9d\n\
    (7) 0x49563e64868e1d378e20b6ab89813c1bbaa0fd48\n(8) 0x467c6f6f526eee9f66776197e3a9798c1cbf78e0\n\
    (9) 0xf65b47a3c663e2cc17ded8f197057a091686da43\n\nPrivate Keys\n==================\n\
    (0) 8729d0f1d876d692f2f454f564042bd11c1e6d0c9b1808954f171f6f7b926fd6\n(1) 452dfeee16e5a0e34fa5348f0ef11f39a8b4635e5f454f77fc228ca9598f6997\n\
    (2) 9196ad9fd6234f09ee13726cb889dcbc438c15f98e8ff1feb36a93758fa6d10a\n(3) fa47edd832e896314544b98d7e297ac2ce2097b49f8a9d7e7ae0e38154db8760\n\
    (4) 7ba1a96db190c14aaee5401dd5faab1af9074d7e6f24bc2f24b5084514bbf405\n(5) 90088ce271f227db6be251c3055872c0d3dbdda9fc23ed119cf9d55db7c91259\n\
    (6) c36afd6f8f291b45e94ef0059576a86602e9a982b87e0c6fb25cfab4d68e9030\n(7) 2766ac8aee110e9ad1ea68d1f28aaafb464fb1ef2a759bf5b2f628d256043c15\n\
    (8) 51ccf45f87806e8e9f30f487d6cdd0b44de3ad103f0d8daf9f1e20d9a4728dd9\n(9) 398c0f079448c1e3724c9267f07ca4ab88233fc995a3d463c7c64d1a191688f5\n\
    \nHD Wallet\n==================\nMnemonic:      void august badge future common\
    \ warfare dismiss earn dog shell vintage dice\nBase HD Path:  m/44'/60'/0'/0/{account_index}\n\
    \nListening on localhost:8545\n```\n\nThis means that you’ve spun up a private\
    \ blockchain and it’s running on `localhost:8545`. Now let’s set up Truffle to\
    \ deploy to that network.\n\nPlace the following in the `truffle.js` file:\n\n\
    ```\nmodule.exports = {\n  networks: {\n    development: {\n      host: \"127.0.0.1\"\
    ,\n      port: 8545,\n      network_id: \"*\"\n    }\n  }\n};\n```\n"
  trans: "\n\n# Truffle 迁移\n\nTruffle 迁移使我们能够将智能合约“推送”到以太坊区块链（无论是[本地、测试网还是主网](https://bitfalls.com/2018/02/08/what-is-an-ethereum-testnet-and-how-is-it-used/)），并设置将合约与其他合约链接以及用初始数据填充合约所需的步骤。\n\
    \n迁移真正大放异彩的地方在于对区块链上合约地址的管理。这项通常繁琐的工作在 Truffle 中几乎被完全抽象化了。\n\n## 先决条件\n\n请确保您已安装\
    \ [Truffle 框架](http://truffleframework.com/) 和 [Ganache CLI](https://github.com/trufflesuite/ganache-cli)。\n\
    \n## 入门\n\n首先，选择一个项目文件夹，然后运行 `truffle init`。您应该会得到类似如下的输出：\n\n```\nDownloading...\n\
    Unpacking...\nSetting up...\nUnbox successful. Sweet!\n\nCommands:\n\n  Compile:\
    \        truffle compile\n  Migrate:        truffle migrate\n  Test contracts:\
    \ truffle test\n```\n\n此命令会在您当前所在的目录中创建一个基础的 Truffle 项目。目录结构如下：\n\n```\n.\n├──\
    \ contracts\n│   └── Migrations.sol\n├── migrations\n│   └── 1_initial_migration.js\n\
    ├── test\n├── truffle-config.js\n└── truffle.js\n```\n\n首先，在 `contracts` 目录中，创建一个名为\
    \ `Storage.sol` 的新文件，内容如下：\n\n```\npragma solidity ⁰.4.21;\n\n\ncontract Storage\
    \ {\n\n    mapping (string => string) private _store;\n\n    function addData(string\
    \ key, string value) public {\n        require(bytes(_store[key]).length == 0);\n\
    \        _store[key] = value;\n    }\n\n    function removeData(string key) public\
    \ returns (string) {\n        require(bytes(_store[key]).length != 0);\n     \
    \   string prev = _store[key];\n        delete _store[key];\n        return prev;\n\
    \    }\n\n    function changeData(string key, string newValue) public {\n    \
    \    require(bytes(_store[key]).length != 0);\n        _store[key] = newValue;\n\
    \    }\n\n}\n```\n\n## 初始迁移\n\n正如您可能已经注意到的，运行 `truffle init` 时会创建两个文件。它们是 `Migrations.sol`\
    \ 和 `1_initial_migration.js`。\n\n初始迁移文件很少需要更改。它们的作用本质上是跟踪区块链上的地址。\n\n`Migrations.sol`\
    \ 文件可以是您想要的任何样子，但它必须符合一个固定的接口，该接口类似于 `truffle init` 命令创建的接口。您可以在这些文件中对迁移进行一些高级处理，但正如我所说，这很少需要。\n\
    \n`1_initial_migration.js` 文件也是如此。它的作用仅仅是将 `Migrations.sol` 文件推送到所需的区块链。\n\n##\
    \ 迁移数据\n\n为了将智能合约部署到以太坊区块链，您必须首先编写迁移脚本。为了开始，在您的 `migrations` 目录中，创建一个名为 `2_deploy_contracts.js`\
    \ 的文件。您的项目结构现在应该如下所示：\n\n```\n.\n├── contracts\n│   ├── Migrations.sol\n│   └──\
    \ Storage.sol\n├── migrations\n│   ├── 1_initial_migration.js\n│   └── 2_deploy_contracts.js\n\
    ├── test\n├── truffle-config.js\n└── truffle.js\n```\n\n为了使用迁移部署智能合约，首先我们需要访问它们的*工件*。这些文件描述了合约地址、合约已部署的网络以及合约拥有的函数。\n\
    \n那么所有这些数据来自哪里？\n\n在您的项目目录中，运行 `truffle compile`。如果一切顺利，您应该会得到类似如下的输出：\n\n```\n\
    Compiling ./contracts/Migrations.sol...\nCompiling ./contracts/Storage.sol...\n\
    \nWriting artifacts to ./build/contracts\n```\n\n*根据编译器版本的不同，您可能会收到一些警告，但只要没有错误，就可以继续。*\n\
    \n现在再次检查您的项目目录结构：\n\n```\n.\n├── build\n│   └── contracts\n│       ├── Migrations.json\n\
    │       └── Storage.json\n├── contracts\n│   ├── Migrations.sol\n│   └── Storage.sol\n\
    ├── migrations\n│   ├── 1_initial_migration.js\n│   └── 2_deploy_contracts.js\n\
    ├── test\n├── truffle-config.js\n└── truffle.js\n```\n\n请注意，现在有一个 `build` 文件夹，其中包含两个文件\
    \ —— `Migrations.json` 和 `Storage.json` —— 它们与 `contracts` 目录中的智能合约文件相对应。\n\n\
    这些 `*.json` 文件包含其各自智能合约的描述。描述包括：\n\n*   合约名称\n*   合约 ABI（应用程序二进制接口 —— 智能合约中所有函数及其参数和返回值的列表）\n\
    *   合约字节码（编译后的合约数据）\n*   合约已部署字节码（部署到区块链的最新版本字节码）\n*   最后编译合约的编译器版本\n*   合约已部署的网络列表以及合约在每个网络上的地址。\n\
    \n此文件使 Truffle 能够创建一个 JavaScript 包装器，用于与智能合约通信。例如，当您在 JavaScript 代码中调用 `contract.address`\
    \ 时，Truffle 框架会从 `*.json` 文件中读取地址，从而实现合约版本和网络之间的轻松切换。\n\n## 编写迁移\n\n掌握了这些知识，让我们编写第一个迁移脚本。在\
    \ `2_deploy_contracts.js` 文件中，编写以下内容：\n\n```\n// 从 Storage.json 文件获取 Storage 合约数据\n\
    var Storage = artifacts.require(\"./Storage.sol\");\n\n// JavaScript 导出\nmodule.exports\
    \ = function(deployer) {\n    // Deployer 是用于将合约部署到网络的 Truffle 包装器\n\n    // 将合约部署到网络\n\
    \    deployer.deploy(Storage);\n}\n```\n\n编写迁移就是这么简单。要运行迁移脚本，请在终端中运行以下命令：\n\n\
    ```\ntruffle migrate\n```\n\n您应该会收到一个错误，内容如下：\n\n```\nError: No network specified.\
    \ Cannot determine current network.\n```\n\n这意味着 Truffle 找不到您要部署的网络。\n\n为了使用模拟的以太坊区块链，在终端中打开一个新标签页并运行\
    \ `ganache-cli`。您应该会得到类似如下的输出：\n\n```\nGanache CLI v6.1.0 (ganache-core: 2.1.0)\n\
    \nAvailable Accounts\n==================\n(0) 0x828da2e7b47f9480838f2077d470d39906ad1d8e\n\
    (1) 0xa4928865329324560185f1c93b5ebafd7ae6c9e8\n(2) 0x957b8b855bed52e11b2d7e9b3e6427771f299f3f\n\
    (3) 0xf4b6bcabedaf1ccb3d0c89197c4b961460f1f63d\n(4) 0x4bcae97be4a0d1f9a6dea4c23df8a2bffdb51291\n\
    (5) 0xe855c7cccac3a65ad24f006bf084c85c0197a779\n(6) 0x168cb232283701a816a3d118897eedfcae2aec9d\n\
    (7) 0x49563e64868e1d378e20b6ab89813c1bbaa0fd48\n(8) 0x467c6f6f526eee9f66776197e3a9798c1cbf78e0\n\
    (9) 0xf65b47a3c663e2cc17ded8f197057a091686da43\n\nPrivate Keys\n==================\n\
    (0) 8729d0f1d876d692f2f454f564042bd11c1e6d0c9b1808954f171f6f7b926fd6\n(1) 452dfeee16e5a0e34fa5348f0ef11f39a8b4635e5f454f77fc228ca9598f6997\n\
    (2) 9196ad9fd6234f09ee13726cb889dcbc438c15f98e8ff1feb36a93758fa6d10a\n(3) fa47edd832e896314544b98d7e297ac2ce2097b49f8a9d7e7ae0e38154db8760\n\
    (4) 7ba1a96db190c14aaee5401dd5faab1af9074d7e6f24bc2f24b5084514bbf405\n(5) 90088ce271f227db6be251c3055872c0d3dbdda9fc23ed119cf9d55db7c91259\n\
    (6) c36afd6f8f291b45e94ef0059576a86602e9a982b87e0c6fb25cfab4d68e9030\n(7) 2766ac8aee110e9ad1ea68d1f28aaafb464fb1ef2a759bf5b2f628d256043c15\n\
    (8) 51ccf45f87806e8e9f30f487d6cdd0b44de3ad103f0d8daf9f1e20d9a4728dd9\n(9) 398c0f079448c1e3724c9267f07ca4ab88233fc995a3d463c7c64d1a191688f5\n\
    \nHD Wallet\n==================\nMnemonic:      void august badge future common\
    \ warfare dismiss earn dog shell vintage dice\nBase HD Path:  m/44'/60'/0'/0/{account_index}\n\
    \nListening on localhost:8545\n```\n\n这意味着您已经启动了一个私有区块链，它正在 `localhost:8545` 上运行。现在让我们设置\
    \ Truffle 以部署到该网络。\n\n将以下内容放入 `truffle.js` 文件中：\n\n```\nmodule.exports = {\n \
    \ networks: {\n    development: {\n      host: \"127.0.0.1\",\n      port: 8545,\n\
    \      network_id: \"*\"\n    }\n  }\n};\n```\n\n"
