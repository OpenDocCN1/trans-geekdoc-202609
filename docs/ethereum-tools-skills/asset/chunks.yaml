    \      at XMLHttpRequest._onHttpResponseEnd (/usr/local/lib/node_modules/truffle/build/webpack:/~/xhr2/lib/xhr2.js:509:1)\n\
    \      at IncomingMessage.<anonymous> (/usr/local/lib/node_modules/truffle/build/webpack:/~/xhr2/lib/xhr2.js:469:1)\n\
    \      at endReadableNT (_stream_readable.js:1106:12)\n      at process._tickCallback\
    \ (internal/process/next_tick.js:178:19)\n```\n\nOur test failed!\n\nLet’s go\
    \ into the contract to inspect possible errors.\n\nAfter a careful inspection,\
    \ we’ll find that the issue with our contract is in the `return` statement of\
    \ our `addNewItem` method:\n\n```solidity\nfunction addNewItem(bytes32 name, uint\
    \ price) public returns (uint) {\n\n        _items.push(Item({\n            name:\
    \ name,\n            price: price,\n            seller: msg.sender,\n        \
    \    status: ItemStatus.active\n        }));\n\n        // Item is pushed to the\
    \ end, so the lenth is used for\n        // the ID of the item\n        return\
    \ _items.length;\n}\n```\n\nSince arrays are zero indexed, and we use the array\
    \ position as an ID, we should actually return `_items.length - 1`. Fix this error\
    \ and run this again:\n\n```bash\ntruffle test\n```\n\nYou should get a much happier\
    \ message:\n\n```\nTestHashMarket\n  ✓ testAddingNewProduct (130ms)\n\n\n1 passing\
    \ (729ms)\n```\n\nWe’ve successfully used Truffle testing to fix a very likely\
    \ error in our code!\n\n## JavaScript Testing\n\nTruffle enables us to use JavaScript\
    \ for testing, leveraging the Mocha testing framework. This enables you to write\
    \ more complex tests and get more functionality out of your testing framework.\n\
    \nOkay, let’s write the test. First, in the `test` folder, create a file and call\
    \ it `hashmarket.js`.\n\nThe first thing we need to do, is get the reference to\
    \ our contract in JavaScript. For that, we’ll use Truffle’s `artifacts.require(...)`\
    \ function:\n\n```javascript\nvar HashMarket = artifacts.require(\"./HashMarket.sol\"\
    );\n```\n\nNow that we have the reference to the contract, let’s start writing\
    \ tests. To start, we’ll use the `contract` function provided to us:\n\n```javascript\n\
    contract(\"HashMarket\", function(accounts) {\n\n});\n```\n\nThis creates a test\
    \ suite for our contract. Now for testing, we use Mocha `it` syntax:\n\n```javascript\n\
    contract(\"HashMarket\", function(accounts) {\n    it(\"should add a new product\"\
    , function() {\n\n    });\n});\n```\n\nThis describes the test we’ll write and\
    \ presents a message for us to know the purpose of the test. Now let’s write the\
    \ test itself. At the end, the `hashmarket.js` file should look like the following.\
    \ The reasoning is explained in the comments of the source code:\n\n```javascript\n\
    var HashMarket = artifacts.require(\"./HashMarket.sol\");\n\ncontract(\"HashMarket\"\
    , function(accounts) {\n    it(\"should add a new product\", function() {\n\n\
    \        // Set the names of test data\n        var itemName = \"TestItem\";\n\
    \        var itemPrice = 1000;\n        var itemSeller = accounts[0];\n\n    \
    \    // Since all of our testing functions are async, we store the\n        //\
    \ contract instance at a higher level to enable access from\n        // all functions\n\
    \        var hashMarketContract;\n\n        // Item ID will be provided asynchronously\
    \ so we extract it\n        var itemID;\n\n        return HashMarket.deployed().then(function(instance)\
    \ {\n            // set contract instance into a variable\n            hashMarketContract\
    \ = instance;\n\n            // Subscribe to a Solidity event\n            instance.ItemAdded({}).watch((error,\
    \ result) => {\n                if (error) {\n                    console.log(error);\n\
    \                }\n                // Once the event is triggered, store the\
    \ result in the\n                // external variable\n                itemID\
    \ = result.args.itemID;\n            });\n\n            // Call the addNewItem\
    \ function and return the promise\n            return instance.addNewItem(itemName,\
    \ itemPrice, {from: itemSeller});\n        }).then(function() {\n            //\
    \ This function is triggered after the addNewItem call transaction\n         \
    \   // has been mined. Now call the getItem function with the itemID\n       \
    \     // we received from the event\n            return hashMarketContract.getItem.call(itemID);\n\
    \        }).then(function(result) {\n            // The result of getItem is a\
    \ tuple, we can deconstruct it\n            // to variables like this\n      \
    \      var [name, price, seller, status] = result;\n\n            // Start testing.\
    \ Use web3.toAscii() to convert the result of\n            // the smart contract\
    \ from Solidity bytecode to ASCII. After that\n            // use the .replace()\
    \ to pad the excess bytes from bytes32\n            assert.equal(itemName, web3.toAscii(name).replace(/\\\
    u0000/g, ''), \"Name wasn't properly added\");\n            // Use assert.equal()\
    \ to check all the variables\n            assert.equal(itemPrice, price, \"Price\
    \ wasn't properly added\");\n            assert.equal(itemSeller, seller, \"Seller\
    \ wasn't properly added\");\n            assert.equal(status, 0, \"Status wasn't\
    \ properly added\");\n        });\n    });\n});\n```\n\nRun `truffle test` and\
    \ you should get something like this:\n\n```\nTestHashMarket\n  ✓ testAddingNewProduct\
    \ (109ms)\n\nContract: HashMarket\n  ✓ should add a new product (64ms)\n\n\n2\
    \ passing (876ms)\n```\n\nYour test has passed and you can be confident about\
    \ not having regression bugs.\n\nFor homework, write tests for all other functions\
    \ in the contract.\n\n# Chapter 7: Truffle Migrations Explained\n\n### by Mislav\
    \ Javor\n\nMigrations, generally speaking, are ways for developers to automate\
    \ the deployment of data and its supporting structures. They are very useful for\
    \ managing the deployment of new software versions, and as such aren’t exclusive\
    \ to blockchain development.\n"
