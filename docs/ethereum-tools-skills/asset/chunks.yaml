    ## Remix 替代方案


    有许多用于轻松开发和部署智能合约的替代方案，例如：


    *   [Truffle](http://truffleframework.com/): 号称以太坊的“瑞士军刀”，并声称是以太坊最流行的开发框架，其使命是让你的生活轻松得多。我们将在后续章节中大量使用
    Truffle。

    *   [Embark](https://github.com/embark-framework/embark): 一个允许你轻松开发和部署去中心化应用（DApps）的框架。

    *   [MetaMask](https://metamask.io/): 一个桥梁，让你今天就能在浏览器中访问明天的分布式网络。它允许你直接在浏览器中运行以太坊
    DApps，而无需运行完整的以太坊节点。关于如何使用 MetaMask 进行开发，请查看此 [FAQ](https://github.com/MetaMask/faq/)。

    *   [Dapp](https://dapp.readthedocs.io/en/latest/): Dapp 是一个用于智能合约开发的简单命令行工具。

    *   用于为流行 IDE 添加 Solidity 支持的不同插件，例如 [这个 Visual Studio Code 插件](https://marketplace.visualstudio.com/items?itemName=JuanBlanco.solidity)
    和 [这个 Atom 插件](https://atom.io/packages/language-ethereum) 等。


    ## 结论


    我们向你介绍了用于为以太坊区块链开发智能合约的 Remix IDE。你可以在 [文档](http://remix.readthedocs.io/en/latest/)
    中找到更详细的信息。


    有了基础介绍，请随意深入探索，尝试修改代码并探索编辑器提供的不同功能和标签页。


    # 第 2 章：Geth 简介与运行以太坊节点


    ## 作者：Mislav Javor


    **在本文中，我们将了解什么是以太坊节点，并探索最流行的节点之一，称为 Geth。**


    为了与区块链通信，我们必须使用区块链 **客户端**。客户端是一段能够与其他客户端建立 p2p 通信通道、签名并广播交易、挖矿、部署和交互智能合约等的软件。客户端通常被称为
    **节点**。


    以太坊节点必须遵循的功能正式定义见 [以太坊黄皮书](https://ethereum.github.io/yellowpaper/paper.pdf)。黄皮书定义了网络上节点所需的功能、挖矿算法、私钥/公钥
    [ECDSA](https://en.wikipedia.org/wiki/Elliptic_Curve_Digital_Signature_Algorithm)
    参数。它定义了使节点成为完全兼容的以太坊客户端的全部特性。


    基于黄皮书，任何人都可以用他们认为合适的任何语言创建自己的以太坊节点实现。


    完整的客户端列表可见 [此处](https://github.com/ethereum/wiki/wiki/Clients,-tools,-dapp-browsers,-wallets-and-other-projects#ethereum-clients)。


    目前最流行的客户端是 [Geth](https://github.com/ethereum/go-ethereum/wiki) 和 [Parity](https://wiki.parity.io/)。实现上的差异主要在于编程语言的选择
    —— Geth 使用 Golang，而 Parity 使用 Rust。


    由于 Geth 目前是最流行的客户端实现，我们将暂时专注于它。


    ## 节点类型


    当你加入以太坊网络时，你可以选择运行各种类型的节点。目前的选项有：


    *   轻节点

    *   全节点

    *   归档节点


    归档节点是全节点的一种特殊情况，所以我们不会详细介绍它。我找到的关于节点类型最好的总结之一在 [Stack Exchange](https://ethereum.stackexchange.com/questions/5975/what-are-the-types-of-nodes-in-ethereum)
    上：


    > 一般来说，我们可以将节点软件分为两类：全节点和轻量节点。全节点验证广播到网络上的区块。也就是说，它们确保区块中包含的交易（以及区块本身）遵循以太坊规范中定义的规则。它们维护网络的当前状态（根据以太坊规范定义）。

    >

    > 不遵循规则的交易和区块不用于确定以太坊网络的当前状态。例如，如果 A 试图向 B 发送 100 以太币，但 A 拥有 0 以太币，而一个区块包含了这笔交易，全节点会意识到这不符合以太坊的规则并拒绝该区块，视其为无效。特别地，智能合约的执行就是一个交易的例子。每当智能合约在交易中被使用时（例如发送
    ERC-20 代币），所有全节点都必须运行所有指令，以确保它们到达正确的、商定一致的区块链下一个状态。

    >

    > 到达相同状态有多种方式。例如，如果 A 有 101 以太币，并在一笔交易中给了 B 一百个，支付 1 以太币作为 Gas，最终结果将与 A 发送 100
    笔每笔 1 以太币的交易给 B，每笔支付 0.01 以太币（忽略谁收到了交易费）的结果相同。要想知道 B 现在是否被允许发送 100 以太币，只需知道 B
    当前的余额即可。保留完整交易历史的全节点被称为全归档节点。网络健康运行需要这些节点的存在。

    >

    > 节点也可以选择丢弃旧数据；如果 B 想向 C 发送 100 以太币，不重要以太币是如何获得的，只重要 B 的账户包含 100 以太币。相比之下，轻节点不验证每个区块或交易，并且可能没有当前区块链状态的副本。它们依赖全节点为它们提供缺失的细节（或仅仅缺乏特定功能）。轻节点的优势在于它们可以更快地启动和运行，可以在计算/内存受限的设备上运行，并且不会占用近乎那么多的存储空间。缺点是存在对其他节点的信任成分（这因客户端而异，可以使用概率方法/启发式算法来降低风险）。一些全客户端包含实现更快同步的功能（例如
    Parity 的 warp sync）。


    ## 安装 Geth


    在各种平台（Windows、macOS、Linux）上安装 Geth 的说明可以在 [这里](https://github.com/ethereum/go-ethereum/wiki/Building-Ethereum)
    找到。该列表非常全面且保持更新，所以我不会在文章中重述。


    ## 运行 Geth


    要启动一个 Geth 节点，你只需要打开终端窗口并运行 `geth`。当你这样做时，你应该会得到类似如下的输出：

