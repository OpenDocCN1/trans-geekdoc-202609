- raw: "## TokenMarket\n\n[TokenMarket](https://tokenmarket.net/about) is another\
    \ company that has published a repository of Solidity contracts and tools for\
    \ managing token sales / ICOs. It’s a limited company incorporated in Gibraltar\
    \ that does ICO consulting. It was awarded “The Best ICO Advisor” at [Cryptocurrency\
    \ World Expo Berlin Summit 2018](https://cryptocurrencyworldexpo.com/).\n\n[Tokenmarket’s\
    \ ICO repository on GitHub](https://github.com/TokenMarketNet/ico) says that [one\
    \ of its design goals](https://github.com/TokenMarketNet/ico#features-and-design-goals)/principles\
    \ is to use or build upon the existing OpenZeppelin contracts, calling them a\
    \ gold standard of Solidity contracts. So from this, a lot of the TokenMarket’s\
    \ ICO codebase is based on OpenZeppelin’s code base, and then it builds further\
    \ on it (by inheriting from it in OOP fashion).\n\nTokenMarket regularly (tries\
    \ to) keep up to date with its upstream code base, OpenZeppelin. It adds more\
    \ to it, though, such as the following:\n\n*   [AMLtoken contract](https://github.com/TokenMarketNet/ico/blob/master/contracts/AMLToken.sol):\
    \ this *gives the Owner the chance to reclaim tokens from a participant before\
    \ the token is released after a participant has failed a prolonged AML process*.\n\
    \n*   [Gnosis Wallet](https://github.com/TokenMarketNet/ico/blob/master/contracts/GnosisWallet.sol):\
    \ basically a multi-sig wallet, which requires consensus of multiple parties for\
    \ certain transactions.\n\n*   a [Centrally Issued Token](https://github.com/TokenMarketNet/ico/blob/master/contracts/CentrallyIssuedToken.sol)\
    \ contract.\n\n*   [KYCCrowdsale](https://github.com/TokenMarketNet/ico/blob/master/contracts/KYCCrowdsale.sol):\
    \ a contract that only lets in investors who are not anonymous.\n\n*   [Relaunched\
    \ Crowdsale contract](https://github.com/TokenMarketNet/ico/blob/master/contracts/RelaunchedCrowdsale.sol):\
    \ this restores a previous crowdsale and allows for changing of some parameters.\n\
    \n*   [Milestone Pricing](https://github.com/TokenMarketNet/ico/blob/master/contracts/MilestonePricing.sol):\
    \ this contract provides for milestone-based pricing, and pre-ICO-deals.\n\nAlthough\
    \ there’s a lot of the code in the repositories we talk about here, the EVM is\
    \ Turing complete so all these various contracts do not, even remotely, exhaust\
    \ its full capabilities. Provided that the system — Ethereum — survives and continues\
    \ to be competitive, with enough people on the network, we can look forward to\
    \ much bigger versatility in what these blockchain contracts attempt to solve.\n\
    \n## ConsenSys\n\nConsensys Ventures is a Swiss ventures/investing company that’s\
    \ profiling itself as an *angel/seed investing company* in the decentralized space\
    \ — and this particularly means the Ethereum space. Beyond other resources they\
    \ offer their protege companies, they have put together a [nice little compendium\
    \ of best practices for Ethereum smart contracts](https://consensys.github.io/smart-contract-best-practices/).\
    \ Although narrowly speaking this isn’t code, it still contains quite a number\
    \ of good and bad examples of Solidity code.\n\nIt’s mostly about best *security\
    \ practices* of Solidity smart contracts.\n\nThe complete list of topics goes\
    \ a bit beyond the scope of this article, because the resource is *comprehensive*\
    \ and is worth reading even to remind a smart contract developer of all they need\
    \ to keep in mind when writing software for the EVM. And this *especially* goes\
    \ if one writes programs from scratch (not relying on already made and vetted\
    \ code like OpenZeppelin’s).\n\nSome of the articles deal with external calls,\
    \ avoiding state changes after external calls, handling errors in external calls,\
    \ favoring pull over push for external calls, staying aware of the tradeoffs between\
    \ abstract contracts and interfaces, not assuming that contracts are created with\
    \ zero balance, differentiating functions and events, multiple inheritance caution,\
    \ warnings about timestamp dependence and gameability of such constructs — for\
    \ example, with blocks — and many other such tips with a lot of code examples.\n\
    \nThen there are token-specific warnings, warnings related to token standards,\
    \ software engineering techniques, security tools — for static analysis, testing,\
    \ linters, etc.\n\nThey also list known attacks, from those that include calling\
    \ on external code and contracts, functions that could be called repeatedly in\
    \ such cases, reentrancy problems, cross-function race conditions, Here they analyze\
    \ a whole range of problems, some of which manifested in [the DAO hack](https://en.wikipedia.org/wiki/The_DAO_\\\
    (organization\\)).\n\nThey further mention transaction-ordering dependence, timestamp\
    \ dependence, integer overflow and underflow, different possibilities/points of\
    \ DoS attacks, like DoS with block gas limit, then forcibly sending Ether to a\
    \ contract; and they also analyze historical and deprecated attacks. Definitely\
    \ give their docs a read.\n\n## Conclusion\n\nIn this introduction to the ecosystem,\
    \ we went through some of the available resources for writing good, production\
    \ ready smart contracts on the Ethereum Virtual Machine. This includes both reusing\
    \ already audited, vetted code (OpenZeppelin claim there is over $4 billion worth\
    \ of cryptocurrency running on their contracts) to practical resources to learn\
    \ writing ones own secure, production-ready software.\n\n# Chapter 6: Truffle:\
    \ Testing Smart Contracts\n\n### by Mislav Javor\n\n**In our [introduction to\
    \ Truffle](#part0002_split_000.html#1T140-7bc08c01daea4ad09f5951d0fde8baea), we\
    \ discussed what Truffle is and how it can help you automate the job of compiling,\
    \ testing and deploying smart contracts.**\n\nIn this article, we’ll explore how\
    \ to test smart contracts. Testing is *the* most important aspect of quality smart\
    \ contract development.\n\nWhy test extensively? So you can avoid stuff like [this](http://www.businessinsider.com/ethereum-price-parity-hack-bug-fork-2017-11),\
    \ or [this](https://coincodex.com/article/50/the-dao-hack-what-happened-and-what-followed/).\
    \ Smart contracts handle value, sometimes a huge amount of value — which makes\
    \ them very interesting prey for people with the time and the skills to attack\
    \ them.\n\nYou wouldn’t want your project to end up on the [Blockchain graveyard](https://magoo.github.io/Blockchain-Graveyard/),\
    \ would you?\n\n## Getting Started\n\nWe’re going to be making *HashMarket*, a\
    \ simple, smart-contract based used goods market.\n\nOpen your terminal and position\
    \ yourself in the folder where you want to build the project. In that folder,\
    \ run the following:\n\n```\nmkdir HashMarket\ncd HashMarket\ntruffle init\n```\n\
    \nYou should get a result that looks a little bit like this:\n\n```\nDownloading...\n\
    Unpacking...\nSetting up...\nUnbox successful. Sweet!\n\nCommands:\n\n  Compile:\
    \        truffle compile\n  Migrate:        truffle migrate\n  Test contracts:\
    \ truffle test\n```\n\nYou’ll also get a file structure that looks like this:\n\
    \n```\n.\n├── contracts\n│   └── Migrations.sol\n├── migrations\n│   └── 1_initial_migration.js\n\
    ├── test\n├── truffle-config.js\n└── truffle.js\n```\n\nFor a refresher on the\
    \ files, take a look at the [previous article](https://www.sitepoint.com/truffle-introduction/).\
    \ In a nutshell, we have the basic `truffle.js` and the two files used for making\
    \ the initial migrations onto the blockchain.\n\n### Preparing the test environment\n\
    \nThe easiest way to test is on the local network. I highly recommend using the\
    \ `ganache-cli` (previously known as `TestRPC`) tool for contract testing.\n\n\
    Install `ganache-cli` (which requires the Node Package Manager):\n\n```\nnpm install\
    \ -g ganache-cli\n```\n\nAfter that, open a separate terminal window or tab and\
    \ run this:\n\n```\nganache-cli\n```\n\nYou should see an output similar to this:"
  fmt: "\n## TokenMarket\n\n[TokenMarket](https://tokenmarket.net/about) 是另一家发布了 Solidity\
    \ 合约和管理代币销售 / ICO 工具存储库的公司。它是一家在直布罗陀注册的有限公司，从事 ICO 咨询。它在 [Cryptocurrency World\
    \ Expo Berlin Summit 2018](https://cryptocurrencyworldexpo.com/) 上获得了“最佳 ICO 顾问”奖。\n\
    \n[TokenMarket 的 ICO GitHub 存储库](https://github.com/TokenMarketNet/ico) 表明，其[设计目标/原则之一](https://github.com/TokenMarketNet/ico#features-and-design-goals)\
    \ 是使用或构建在现有的 OpenZeppelin 合约之上，称其为 Solidity 合约的黄金标准。因此，TokenMarket 的 ICO 代码库很大程度上基于\
    \ OpenZeppelin 的代码库，并在此基础上进一步构建（通过面向对象的方式继承）。\n\nTokenMarket 定期（尝试）跟进其上游代码库 OpenZeppelin\
    \ 的更新。但它也增加了更多内容，例如：\n\n*   [`AMLToken` 合约](https://github.com/TokenMarketNet/ico/blob/master/contracts/AMLToken.sol)：该合约*在参与者经历漫长的\
    \ AML 流程失败后，代币发布前，给予所有者从参与者处追回代币的机会*。\n*   [`GnosisWallet`](https://github.com/TokenMarketNet/ico/blob/master/contracts/GnosisWallet.sol)：基本上是一个多签钱包，需要多方共识才能进行某些交易。\n\
    *   一个 [`CentrallyIssuedToken`](https://github.com/TokenMarketNet/ico/blob/master/contracts/CentrallyIssuedToken.sol)\
    \ 合约。\n*   [`KYCCrowdsale`](https://github.com/TokenMarketNet/ico/blob/master/contracts/KYCCrowdsale.sol)：一个只允许非匿名投资者参与的合约。\n\
    *   [`RelaunchedCrowdsale`](https://github.com/TokenMarketNet/ico/blob/master/contracts/RelaunchedCrowdsale.sol)\
    \ 合约：该合约恢复之前的众筹，并允许更改某些参数。\n*   [`MilestonePricing`](https://github.com/TokenMarketNet/ico/blob/master/contracts/MilestonePricing.sol)：该合约提供基于里程碑的定价和预\
    \ ICO 交易。\n\n尽管我们在这里讨论的存储库中有大量代码，但 EVM 图灵完备，因此所有这些不同的合约甚至远未穷尽其全部能力。只要系统 —— Ethereum\
    \ —— 能够生存并保持竞争力，网络上有足够多的人，我们就可以期待这些区块链合约尝试解决的问题将具有更大的多样性。\n\n## ConsenSys\n\n\
    ConsenSys Ventures 是一家瑞士风投/投资公司，将自己定位为去中心化领域的 *天使/种子投资公司* —— 特别是指 Ethereum 领域。除了为其孵化公司提供其他资源外，他们还整理了一份\
    \ [Ethereum 智能合约最佳实践的精选汇编](https://consensys.github.io/smart-contract-best-practices/)。虽然狭义上讲这不是代码，但它仍包含大量好的和坏的\
    \ Solidity 代码示例。\n\n它主要关注 Solidity 智能合约的 *安全最佳实践*。\n\n完整的主题列表超出了本文的范围，因为该资源 *全面*\
    \ 且值得一读，即使只是为了提醒智能合约开发者在为 EVM 编写软件时需要牢记的所有事项。如果从头编写程序（不依赖像 OpenZeppelin 这样已经制作并经过审核的代码），这一点\
    \ *尤其* 重要。\n\n一些文章涉及外部调用、避免在外部调用后更改状态、处理外部调用中的错误、倾向于对外部调用使用拉取而非推送模式、注意抽象合约和接口之间的权衡、不要假设合约创建时余额为零、区分函数和事件、多重继承的注意事项、关于时间戳依赖及此类结构可被博弈的警告\
    \ —— 例如与区块相关的 —— 以及许多其他带有大量代码示例的提示。\n\n然后还有特定于代币的警告、与代币标准相关的警告、软件工程技术、安全工具 ——\
    \ 用于静态分析、测试、代码检查等。\n\n他们还列出了已知攻击，包括调用外部代码和合约的攻击、此类情况下可能被重复调用的函数、重入问题、跨函数竞态条件。在这里，他们分析了一系列问题，其中一些表现为\
    \ [The DAO 攻击](https://en.wikipedia.org/wiki/The_DAO_\\(organization\\))。\n\n\
    他们进一步提到了交易顺序依赖、时间戳依赖、整数溢出和下溢、不同的 DoS 攻击可能性/切入点，如区块 Gas 限制导致的 DoS、强制向合约发送 Ether；他们还分析了历史上的和已弃用的攻击。强烈建议阅读他们的文档。\n\
    \n## 结论\n\n在本生态系统介绍中，我们浏览了一些可用于在 Ethereum 虚拟机上编写优秀、生产就绪智能合约的资源。这包括复用已经过审计、验证的代码（OpenZeppelin\
    \ 声称有超过 40 亿美元价值的加密货币运行在其合约上），以及学习编写自己安全、生产就绪软件的实用资源。\n\n# 第 6 章：Truffle：测试智能合约\n\
    \n### 作者：Mislav Javor\n\n在我们的 [Truffle 简介](#part0002_split_000.html#1T140-7bc08c01daea4ad09f5951d0fde8baea)\
    \ 中，我们讨论了什么是 Truffle 以及它如何帮助你自动化编译、测试和部署智能合约的工作。\n\n在本文中，我们将探讨如何测试智能合约。测试是高质量智能合约开发\
    \ *最* 重要的方面。\n\n为什么要进行广泛测试？这样你可以避免类似 [这种](http://www.businessinsider.com/ethereum-price-parity-hack-bug-fork-2017-11)\
    \ 或 [这种](https://coincodex.com/article/50/the-dao-hack-what-happened-and-what-followed/)\
    \ 事件。智能合约处理价值，有时是巨额价值 —— 这使它们成为有时间和技能攻击它们的人极具吸引力的猎物。\n\n你肯定不希望你的项目最终进入 [区块链墓地](https://magoo.github.io/Blockchain-Graveyard/)，对吧？\n\
    \n## 入门\n\n我们将构建 *HashMarket*，一个基于智能合约的简单二手商品市场。\n\n打开终端，定位到你想要构建项目的文件夹。在该文件夹中，运行以下命令：\n\
    \n```\nmkdir HashMarket\ncd HashMarket\ntruffle init\n```\n\n你应该会得到类似如下的结果：\n\n\
    ```\nDownloading...\nUnpacking...\nSetting up...\nUnbox successful. Sweet!\n\n\
    Commands:\n\n  Compile:        truffle compile\n  Migrate:        truffle migrate\n\
    \  Test contracts: truffle test\n```\n\n你还将获得如下的文件结构：\n\n```\n.\n├── contracts\n\
    │   └── Migrations.sol\n├── migrations\n│   └── 1_initial_migration.js\n├── test\n\
    ├── truffle-config.js\n└── truffle.js\n```\n\n有关文件的回顾，请参阅 [上一篇文章](https://www.sitepoint.com/truffle-introduction/)。简而言之，我们有基本的\
    \ `truffle.js` 和两个用于进行初始区块链迁移的文件。\n\n### 准备测试环境\n\n最简单的测试方式是在本地网络上进行。我强烈建议使用 `ganache-cli`（以前称为\
    \ `TestRPC`）工具进行合约测试。\n\n安装 `ganache-cli`（需要 Node 包管理器）：\n\n```\nnpm install -g\
    \ ganache-cli\n```\n\n之后，打开一个单独的终端窗口或标签页并运行：\n\n```\nganache-cli\n```\n\n你应该会看到类似如下的输出：\n"
