    12:\n13:         uint numberPosition = _numberStorage.length;\n```\n\nWe’ve pushed\
    \ the number and are getting the position of the number in the array. Press `o`\
    \ again.\n\n```\nStorage.sol:\n\n13:         uint numberPosition = _numberStorage.length;\n\
    14:\n15:         emit AddedNewNumber(numberPosition);\n                    ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\n\
    ```\n\nWe’re at the line emitting the position. Now instead of pressing `o`, let’s\
    \ inspect our variables and try getting the number back from the array. We can\
    \ use one of two ways. The first, more generic one is just typing `v` and inspecting\
    \ all variables available from the function context.\n\nDo it by typing `v`. The\
    \ output should be this:\n\n```\nnumberPosition: 1\n        newNumber: 12\n  \
    \              : 189\n_numberStorage: [ 12 ]\n```\n\nThe other way to do it is\
