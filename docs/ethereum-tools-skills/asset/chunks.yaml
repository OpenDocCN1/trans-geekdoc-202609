    \  ... 0x5b6a332306f739b27ccbdfd10d11c60200b70a55ec775e7165358b711082cf55\nSaving\
    \ artifacts...\n```\n\n## Testing Smart Contracts\n\nYou can use Solidity or JavaScript\
    \ for smart contract testing. Solidity can be a little bit more intuitive when\
