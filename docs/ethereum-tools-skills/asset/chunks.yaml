    \n## Notice of Liability\n\nThe author and publisher have made every effort to\
    \ ensure the accuracy of the information herein. However, the information contained\
    \ in this book is sold without warranty, either express or implied. Neither the\
    \ authors and SitePoint Pty. Ltd., nor its dealers or distributors will be held\
    \ liable for any damages to be caused either directly or indirectly by the instructions\
    \ contained in this book, or by the software or hardware products described herein.\n\
    \n## Trademark Notice\n\nRather than indicating every occurrence of a trademarked\
    \ name as such, this book uses the names only in an editorial fashion and to the\
    \ benefit of the trademark owner with no intention of infringement of the trademark.\n\
    \n![SitePoint logo](images/00001.gif)  \n\nPublished by SitePoint Pty. Ltd.\n\n\
    48 Cambridge Street Collingwood  \n\nVIC Australia 3066  \n\nWeb: www.sitepoint.com\
    \  \n\nEmail: books@sitepoint.com\n\n## About SitePoint\n\nSitePoint specializes\
    \ in publishing fun, practical, and easy-to-understand content for web professionals.\
    \ Visit [http://www.sitepoint.com/](http://www.sitepoint.com/) to access our blogs,\
    \ books, newsletters, articles, and community forums. You’ll find a stack of information\
    \ on JavaScript, PHP, design, and more.\n\n# Preface\n\nAs the Ethereum platform\
    \ has grown, so has the ecosystem of tools that support it. In this book, we'll\
    \ examine some of the most popular Ethereum tools, and walk you through how to\
    \ use them when building your own Ethereum-based apps.\n\n## Who Should Read This\
    \ Book?\n\nThis book is for anyone interested in using the Ethereum platform for\
    \ development. It's advised that you read *The Developer's Guide to Ethereum*\
    \ before reading this book if you are not familiar with blockchain technology.\n\
    \n## Conventions Used\n\n### Code Samples\n\nCode in this book is displayed using\
    \ a fixed-width font, like so:\n\n```\n<h1>A Perfect Summer's Day</h1>\n<p>It\
    \ was a lovely day for a walk in the park.\nThe birds were singing and the kids\
    \ were all back at school.</p>\n\t\t\t\n```\n\nWhere existing code is required\
    \ for context, rather than repeat all of it, ⋮ will be displayed:\n\n```\nfunction\
    \ animate() {\n    ⋮\nnew_variable = \"Hello\";\n}\n```\n\nSome lines of code\
    \ should be entered on one line, but we’ve had to wrap them because of page constraints.\
    \ An ➥ indicates a line break that exists for formatting purposes only, and should\
    \ be ignored:\n\n```\nURL.open(\"http://www.sitepoint.com/responsive-web-\n➥design-real-user-testing/?responsive1\"\
    );\n```\n\nYou’ll notice that we’ve used certain layout styles throughout this\
    \ book to signify different types of information. Look out for the following items.\n\
    \n### Tips, Notes, and Warnings\n\n#### Hey, You!\n\nTips provide helpful little\
    \ pointers.\n\n#### Ahem, Excuse Me ...\n\nNotes are useful asides that are related—but\
    \ not critical—to the topic at hand. Think of them as extra tidbits of information.\n\
    \n#### Make Sure You Always ...\n\n... pay attention to these important points.\n\
    \n#### Watch Out!\n\nWarnings highlight any gotchas that are likely to trip you\
    \ up along the way.\n\n# Chapter 1: Remix: Develop Smart Contracts for the Ethereum\
    \ Blockchain\n\n### by Ahmed Bouchefra\n\n**Remix is a Solidity IDE that’s used\
    \ to write, compile and debug Solidity code. [Solidity](https://solidity.readthedocs.io)\
    \ is a high-level, contract-oriented programming language for writing smart contracts.\
    \ It was influenced by popular languages such as C++, Python and JavaScript.**\n\
    \nIDE stands for Integrated Development Environment and is an application with\
    \ a set of tools designed to help programmers execute different tasks related\
    \ to software development such as writing, compiling, executing and debugging\
    \ code.\n\nBefore you begin using Remix to develop smart contracts, make sure\
    \ you’re familiar with some basic concepts. In particular, give these articles\
    \ about [blockchain](https://www.sitepoint.com/blockchain-what-it-is-how-it-works-why-its-so-popular)\
    \ and [Ethereum](https://bitfalls.com/2017/09/19/what-ethereum-compare-to-bitcoin/)\
    \ a read.\n\n### What’s a Smart Contract/Dapp?\n\nA smart contract is a trust-less\
    \ agreement between two parties that makes use of blockchain technology, to enforce\
    \ the parties to adhere to the terms, rather than relying on the traditional ways\
    \ such as trusting a middleman or using laws to handle disputes.\n\nUsing the\
    \ Ethereum blockchain, you can create smart contracts with the Solidity language\
    \ (among others). Ethereum is not the only platform that can be used to create\
    \ smart contacts, but it’s the most popular choice, as it was designed from the\
    \ start to support building them.\n\n[Dapp](http://ethdocs.org/en/latest/contracts-and-transactions/developer-tools.html#dapps)\
    \ stands for ***de*centralized *app*lication** and is a web3 application that\
    \ can have a front-end written in traditional languages such as JavaScript, HTML,\
    \ CSS and a smart contract (as back-end code) which runs on the blockchain. So\
    \ you can simply think of a Dapp as the front end plus the associated blockchain\
    \ smart contract(s).\n\nUnlike the smart contract deployed on the blockchain itself,\
    \ the front end of a Dapp can be either hosted on a centralized server like a\
    \ CDN or on decentralized storage like [Swarm](http://ethdocs.org/en/latest/contracts-and-transactions/developer-tools.html#swarm).\n\
    \n## Accessing the Remix IDE\n\nYou can access the Remix IDE in different ways:\
    \ online, via a web browser like Chrome, from a locally installed copy, or from\
    \ Mist (the Ethereum Dapp browser).\n\n### Using the In-Browser Remix IDE\n\n\
    You can access the Remix IDE from your web browser without any special installation.\
    \ Visit [https://remix.ethereum.org/](https://remix.ethereum.org/) and you’ll\
    \ be presented with a complete IDE with a code editor and various panels for compiling,\
    \ running and debugging your smart contracts. You’ll have a default example *Ballot*\
    \ contract that you can play with.\n\n![Remix IDE](images/00002.jpeg)\n\n### Starting\
    \ Remix IDE from Mist\n\nYou can start the Remix IDE from Mist by clicking on\
    \ *Develop*, then *Open Remix IDE*. Remix will be opened in a new window. If this\
    \ is your first time running the IDE, you’ll be presented with a simple example\
    \ *Ballot* contract.\n\nTo get familiar with Mist, please see [this article](https://bitfalls.com/2018/02/12/explaining-ethereum-tools-geth-mist/).\n\
    \n### Running your Own Copy of Remix IDE\n\nYou can also run your own copy of\
    \ Remix IDE by executing the following commands:\n\n```\nnpm install remix-ide\
    \ -g\n remix-ide\n \n```\n\nYou need to have Node.js and npm installed. Check\
    \ this [GitHub repository](https://github.com/ethereum/remix-ide) for more information.\n\
    \n## Remix Panels\n\nAfter seeing how to open the Remix IDE, let’s now see the\
    \ various panels composing the IDE.\n\n### File Explorer\n\nThe file explorer\
    \ provides a view with the created files stored in the browser’s storage. You\
    \ can rename or delete any file by right-clicking on it, then choosing the right\
    \ operation from the context menu.\n\n![context menu options](images/00003.jpeg)\n\
    \nPlease note that the file explorer uses the browser’s local storage by default,\
    \ which means you can lose all your files if you clear or the operating system\
    \ automatically clears the storage. For advanced work, it’s recommended to use\
    \ [Remixd](https://github.com/ethereum/remixd) — a Node.js tool (available from\
    \ npm `npm install -g remixd`) which allows the Remix IDE to access your computer’s\
    \ file system.\n\nNow let’s see the different actions that you can perform using\
    \ the buttons at the top of the explorer.\n\n![Remix buttons](images/00004.jpeg)\n\
    \n#### Creating/Opening Files in Remix"
