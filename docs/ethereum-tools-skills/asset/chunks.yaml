    \ open and running.\n\n## Prerequisites\n\nNow let's install the prerequisite\
    \ software on *each machine*.\n\nPuppeth runs helper applications and Ethereum\
    \ nodes for you in Docker containers, so we need Docker. It's also useful to install\
    \ Geth itself.\n\n```\nsudo add-apt-repository -y ppa:ethereum/ethereum\nsudo\
    \ apt-get update\nsudo apt-get install \\\n    apt-transport-https \\\n    ca-certificates\
    \ \\\n    curl \\\n    software-properties-common \\\n    ethereum \\\n    docker.io\
    \ \\\n    docker-compose\n```\n\nAll other prerequisites will be pulled in by\
    \ Puppeth through docker itself, but we need to make sure the current user is\
    \ allowed to operate Docker commands first:\n\n```\nsudo usermod -a -G docker\
    \ $USER\n```\n\nOn the host machine (outside the VMs), we should create new Ethereum\
    \ accounts in the folder where we're running our project.\n\nIf you're using the\
    \ VMs as suggested above, that can be in `myproject` if `myproject` is the parent\
    \ folder which contains `hi_puppeth1` and `hi_puppeth2`.\n\n```\nmkdir node1 node2\n\
    geth --datadir node1 account new\ngeth --datadir node2 account new\n```\n\nMake\
    \ a note of the addresses generated by this process:\n\n```\n$ mkdir node1 node2\n\
    $ geth --datadir node1 account new\nINFO [05-20|10:27:20] Maximum peer count \
    \                      ETH=25 LES=0 total=25\nYour new account is locked with\
    \ a password. Please give a password. Do not forget this password.\nPassphrase:\n\
    Repeat passphrase:\nAddress: {aba88be2dc16eaed464e3991eed5a1eaa5e7b11b}\n$ geth\
    \ --datadir node2 account new\nINFO [05-20|10:27:35] Maximum peer count      \
    \                 ETH=25 LES=0 total=25\nYour new account is locked with a password.\
    \ Please give a password. Do not forget this password.\nPassphrase:\nRepeat passphrase:\n\
    Address: {655a6ea9950cdf9f8a8175fda639555f17277bdf}\n```\n\nWe need two accounts\
    \ because at least two *signers* are needed in a Proof of Authority blockchain\
    \ (more on that later).\n\n## Puppeth\n\nNow that our VMs are running and our\
    \ accounts are initialized, let's see what Puppeth offers. With the remote servers/VMs\
    \ still running, in a new tab on your host machine run Puppeth with `puppeth`.\n\
    \nThe first thing it'll ask for is the network name. This is useful for identifying\
    \ various blockchains if you're running several on your local machine. We'll use\
    \ \"puptest\" here.\n\n```\nPlease specify a network name to administer (no spaces\
    \ or hyphens, please)\n> puptest\n\nSweet, you can set this via --network=puptest\
    \ next time!\n\nINFO [05-20|10:32:15] Administering Ethereum network         \
    \  name=puptest\nWARN [05-20|10:32:15] No previous configurations found      \
    \   path=/Users/swader/.puppeth/puptest\n```\n\nNow let's connect to our \"remote\"\
    \ servers so that Puppeth has them in the list and can do operations on them.\n\
    \n### Track new remote server\n\nUsing this option lets you connect to the server\
    \ where your blockchain-related services will be running. Select option 3, then\
    \ enter the values as follows:\n\n```\nPlease enter remote server's address:\n\
    > vagrant@192.168.10.10\nWhat's the decryption password for /Users/swader/.ssh/id_rsa?\
    \ (won't be echoed)\n>\n\nThe authenticity of host '192.168.10.10:22 (192.168.10.10:22)'\
    \ can't be established.\nSSH key fingerprint is 38:53:d3:c2:85:cf:77:54:a5:54:26:3b:93:5b:6f:09\
    \ [MD5]\nAre you sure you want to continue connecting (yes/no)? yes\nWhat's the\
    \ login password for vagrant at 192.168.10.10:22? (won't be echoed)\n>\nINFO [05-20|10:39:53]\
    \ Starting remote server health-check      server=vagrant@192.168.10.10\n+-----------------------+---------------+---------+--------+-------+\n\
    |        SERVER         |    ADDRESS    | SERVICE | CONFIG | VALUE |\n+-----------------------+---------------+---------+--------+-------+\n\
    | vagrant@192.168.10.10 | 192.168.10.10 |         |        |       |\n+-----------------------+---------------+---------+--------+-------+\n\
    ```\n\nPuppeth will ask for your SSH key's passphrase just in case SSH is used\
    \ to connect to the server. If not, it will ask for the SSH password (as it does\
    \ in the example above). The default SSH password for the user `vagrant` on the\
    \ VM in question is `vagrant`.\n"
