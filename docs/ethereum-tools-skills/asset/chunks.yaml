    \ us with helper functions for testing, so we need to import those. At the beginning\
    \ of the file, add:\n\n```\npragma solidity ^0.4.20;\n\nimport \"truffle/Assert.sol\"\
    ;\nimport \"truffle/DeployedAddresses.sol\";\nimport \"../contracts/HashMarket.sol\"\
    ;\n```\n\nThe first two imports are the important ones.\n\nThe `Assert` import\
    \ gives us access to various testing functions, like `Assert.equals()`, `Assert.greaterThan()`,\
