    11:         _numberStorage.push(newNumber);\n12:\n13:         uint numberPosition\
    \ = _numberStorage.length;\n```\n\n我们已推入数字，并正在获取数字在数组中的位置。按 `o` 继续。\n\n```\nStorage.sol:\n\
    \n13:         uint numberPosition = _numberStorage.length;\n14:\n15:         emit\
