- raw: "```\nDownloading...\nUnpacking...\nSetting up...\nUnbox successful. Sweet!\n\
    \nCommands:\n\n  Compile contracts: truffle compile\n  Migrate contracts: truffle\
    \ migrate\n  Test contracts:    truffle test\n```\n\nIf you get some errors, it\
    \ could be that you’re using a different version of Truffle. The version this\
    \ tutorial is written for is `Truffle v4.1.5`, but the instructions should stay\
    \ relevant for at least a couple of versions.\n\n## The Truffle Project Structure\n\
    \nYour Truffle folder should look a little bit like this:\n\n```\n.\n├── contracts\n\
    │   ├── ConvertLib.sol\n│   ├── MetaCoin.sol\n│   └── Migrations.sol\n├── migrations\n\
    │   ├── 1_initial_migration.js\n│   └── 2_deploy_contracts.js\n├── test\n│   ├──\
    \ TestMetacoin.sol\n│   └── metacoin.js\n├── truffle-config.js\n└── truffle.js\n\
    ```\n\n### Contracts folder\n\nThis is the folder where you will put all of your\
    \ smart contracts.\n\nIn your contracts folder, there’s also a `Migrations.sol`\
    \ file, which is a special file — but more about that in the following section.\n\
    \nWhen Truffle compiles the project, it will go through the `contracts` folder\
    \ and compile all the compatible files. For now, the most used files are Solidity\
    \ files with the `.sol` extension.\n\nIn the future, this might transition to\
    \ Vyper or SolidityX (both better for smart contract development, but less used\
    \ for now).\n\n## Migrations Folder\n\nWhat is a truffle migration? In essence\
    \ it’s a script which defines *how* the contracts will be deployed to the blockchain.\n\
    \n### Why do we need migrations?\n\nAs your project becomes more and more complex,\
    \ the complexity of your deployments becomes more and more complex accordingly.\n\
    \nLet’s take an example:\n\n*   You have smart contracts `One`, `Two` and `Three`\n\
    \n*   The smart contract `Three` contains a reference to the smart contract `One`\
    \ *and* requires the address of contract `Two` in its constructor.\n\nThis example\
    \ requires that contracts not only to be deployed sequentially, but also that\
    \ they cross reference each other. Migrations, in a nutshell, enable us to automate\
    \ this process.\n\nA rough overview of how you would do this would be as follows:\n\
    \n```\nvar One = artifacts.require(\"One\");\nvar Two = artifacts.require(\"Two\"\
    );\nvar Three = artifacts.require(\"Three\");\n\nmodule.exports = function(deployer)\
    \ {\n  deployer.deploy(One).then(function() {\n    deployer.deploy(Two).then(function()\
    \ {\n      deployer.deploy(Three, One.address);\n    })\n  });\n};\n```\n\nBeyond\
    \ that, migrations allow you to do a lot of other cool things like:\n\n*   set\
    \ max gas for deployments\n\n*   change the `from` address of deployments\n\n\
    *   deploy libraries\n\n*   call arbitrary contract functions\n\n### Initial migration\n\
    \nAs you’ve noticed in your `MetaCoin` project, you have a file called `1_initial_migration.js`.\
    \ What this file does is deploy the `Migrations.sol` contract to the blockchain.\n\
    \nUsually you don’t have to do anything to this file once it’s initialized, so\
    \ we won’t focus too much on this.\n\n## Test Folder\n\nAs I’ve said: YOU! MUST!\
    \ TEST! SMART! CONTRACTS! No buts, no ifs, no maybes: you MUST do it.\n\nBut if\
    \ you’re going to do it, it would be cool to have an automatic tool to enable\
    \ you to do it seamlessly.\n\nTruffle enables this by having a built-in testing\
    \ framework. It enables you to write tests either in Solidity or JavaScript.\n\
    \nThe examples in the MetaCoin project speak for themselves basically, so we won’t\
    \ get too much into this.\n\nThe key is, if you’re writing Solidity tests, you\
    \ import your contracts into the tests with the Solidity `import` directive:\n\
    \n```\nimport \"../contracts/MetaCoin.sol\";\n```\n\nAnd if you’re writing them\
    \ in JavaScript, you import them with the `artifacts.require()` helper function:\n\
    \n```\nvar MetaCoin = artifacts.require(\"./MetaCoin.sol\");\n```\n\n## Configuration\
    \ File\n\nThe configuration file is called either `truffle.js` or `truffle-config.js`.\
    \ In most cases it’ll be called `truffle.js`, but the fallback is there because\
    \ of weird command precedence rules on Windows machines.\n\nJust know that, when\
    \ you see `truffle.js` or `truffle-config.js`, they’re the same thing, basically.\
    \ (Also, don’t use CMD on windows; PowerShell is significantly better.)\n\nThe\
    \ config file defines a couple of things, detailed below.\n\n**Environments**\
    \ Develop, TestNet, Live (Production). You can define the address of the Geth\
    \ note, the `network_id`, max gas for deployment, the gas price you’re willing\
    \ to pay.\n\n**Project structure** You can change where the files are built and\
    \ located, but it isn’t necessary or even recommended.\n\n**Compiler version and\
    \ settings** Fix the `solc` version and set the `-O` (optimization) parameters.\n\
    \n**Package management**\n\n*   Truffle can work with EthPM (the Ethereum Package\
    \ Manager), but it’s still very iffy.\n\n*   You can set up dependencies for EthPM\
    \ to use in your Truffle project.\n\n**Project description** Who made the project,\
    \ what is the project name, contact addresses etc.\n\n**License** Use [GPLv3](https://pbs.twimg.com/profile_images/561116211258220544/FlICmGnj_400x400.jpeg).\n\
    \n## Running the Code\n\nIn order to compile your contracts, run this:\n\n```\n\
    truffle compile\n```\n\nIn order to run migrations, you can just use this:\n\n\
    ```\ntruffle migrate\n```\n\nOr you can do it by specifying an environment:\n\n\
    ```\ntruffle migrate --network live\n```\n\nIn order to test your contracts run\
    \ this:\n\n```\ntruffle test\n```\n\nOr you can run a *specific* test by running\
    \ this:\n\n```\ntruffle test ./path/to/FileTest.sol\n```\n\n## Conclusion\n\n\
    Truffle is a very handy tool that makes development in this brand new ecosystem\
    \ a little easier. It aims to bring standards and common practices from the rest\
    \ of the development world into a little corner of blockchain experimentation.\n\
    \n# Chapter 5: Quality Solidity Code with OpenZeppelin and Friends\n\n### by Tonino\
    \ Jankov\n\n**Given the fact that all of [Ethereum’s](https://bitfalls.com/2017/09/19/what-ethereum-compare-to-bitcoin/)\
    \ computations need to be reproduced on all the [nodes](https://bitfalls.com/2017/11/26/whats-bitcoin-node-mining-vs-validation/)\
    \ in the network, Ethereum’s computing is inherently costly and inefficient. (In\
    \ fact, Ethereum’s developer docs on GitHub state that we shouldn’t expect more\
    \ computational power from Ethereum than we do from a 1999 phone.)**\n\nSo, security\
    \ on the Ethereum Virtual Machine — meaning, the security of smart contracts deployed\
    \ on Ethereum blockchain — is of paramount importance. All the errors on it cost\
    \ real money — whether it’s errors thrown by badly-written contracts, or hackers\
    \ exploiting loopholes in contracts, like in the well-known DAO hack, which caused\
    \ a community split and sprang the Ethereum Classic blockchain into existence.\n\
    \n*Turing Completeness* — and a whole range of other design decisions that have\
    \ made Ethereum a lot more capable and sophisticated — have come at a cost. Ethereum’s\
    \ richness has made it more vulnerable to errors and hackers.\n\nTo add to the\
    \ problem, smart contracts deployed on Ethereum cannot be modified. The [blockchain](https://www.sitepoint.com/blockchain-what-it-is-how-it-works-why-its-so-popular)\
    \ is an immutable data structure.\n\n[This](https://medium.com/loom-network/how-to-secure-your-smart-contracts-6-solidity-vulnerabilities-and-how-to-avoid-them-part-1-c33048d4d17d)\
    \ and [this](https://medium.com/loom-network/how-to-secure-your-smart-contracts-6-solidity-vulnerabilities-and-how-to-avoid-them-part-2-730db0aa4834)\
    \ article go into more depth regarding security of smart contracts, and the ecosystem\
    \ of tools and libraries to help us to make our smart contracts secure.\n\nLet’s\
    \ look at some amazing upgrades to our toolset we can use *today* to utilize the\
    \ best practices the Solidity environment can offer.\n\n## Helper Tools"
