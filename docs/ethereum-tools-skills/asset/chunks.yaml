    \ = {\n    networks: {\n      development: {\n        host: \"127.0.0.1\",\n \
    \       port: 8545,\n        network_id: \"*\"\n      }\n    }\n};\n```\n\n###\
    \ 编写智能合约\n\n我们要做的第一件事是编写 HashMarket 智能合约。我们将尽量保持其简洁，同时仍保留所需的功能。\n\nHashMarket\
    \ 是区块链上的一种 eBay。它允许卖家发布商品，买家用以太币购买。它还允许卖家在商品未售出时将其移除。\n\n在你的项目中，在 `contracts`\
    \ 文件夹下，创建一个新文件并命名为 `HashMarket.sol`。在该文件中，添加以下代码：\n\n```solidity\npragma solidity\
    \ 0.4.21;\n\n\ncontract HashMarket {\n\n    // 跟踪物品状态，同时保留历史记录\n    enum ItemStatus\
    \ {\n        active,\n        sold,\n        removed\n    }\n\n    struct Item\
    \ {\n        bytes32 name;\n        uint price;\n        address seller;\n   \
    \     ItemStatus status;\n    }\n\n    event ItemAdded(bytes32 name, uint price,\
    \ address seller);\n    event ItemPurchased(uint itemID, address buyer, address\
    \ seller);\n    event ItemRemoved(uint itemID);\n    event FundsPulled(address\
    \ owner, uint amount);\n\n    Item[] private _items;\n    mapping (address =>\
    \ uint) public _pendingWithdrawals;\n\n    modifier onlyIfItemExists(uint itemID)\
    \ {\n        require(_items[itemID].seller != address(0));\n        _;\n    }\n\
    \n    function addNewItem(bytes32 name, uint price) public returns (uint) {\n\n\
    \        _items.push(Item({\n            name: name,\n            price: price,\n\
    \            seller: msg.sender,\n            status: ItemStatus.active\n    \
    \    }));\n\n        emit ItemAdded(name, price, msg.sender);\n        // 物品被推到末尾，所以长度用作\n\
    \        // 物品的 ID\n        return _items.length - 1;\n    }\n\n    function getItem(uint\
    \ itemID) public view onlyIfItemExists(itemID)\n    returns (bytes32, uint, address,\
    \ uint) {\n\n        Item storage item = _items[itemID];\n        return (item.name,\
    \ item.price, item.seller, uint(item.status));\n    }\n\n    function buyItem(uint\
    \ itemID) public payable onlyIfItemExists(itemID) {\n\n        Item storage currentItem\
    \ = _items[itemID];\n\n        require(currentItem.status == ItemStatus.active);\n\
    \        require(currentItem.price == msg.value);\n\n        _pendingWithdrawals[currentItem.seller]\
    \ = msg.value;\n        currentItem.status = ItemStatus.sold;\n\n        emit\
    \ ItemPurchased(itemID, msg.sender, currentItem.seller);\n    }\n\n    function\
    \ removeItem(uint itemID) public onlyIfItemExists(itemID) {\n        Item storage\
    \ currentItem = _items[itemID];\n\n        require(currentItem.seller == msg.sender);\n\
    \        require(currentItem.status == ItemStatus.active);\n\n        currentItem.status\
    \ = ItemStatus.removed;\n\n        emit ItemRemoved(itemID);\n    }\n\n    function\
    \ pullFunds() public returns (bool) {\n        require(_pendingWithdrawals[msg.sender]\
    \ > 0);\n\n        uint outstandingFundsAmount = _pendingWithdrawals[msg.sender];\n\
    \n        if (msg.sender.send(outstandingFundsAmount)) {\n            emit FundsPulled(msg.sender,\
    \ outstandingFundsAmount);\n            return true;\n        } else {\n     \
    \       return false;\n        }\n    }\n}\n```\n\n完成此操作后，尝试运行 `truffle compile`\
    \ 以查看代码是否能编译通过。由于 Solidity 惯例经常变更，如果你的代码无法编译，可能的解决方案是使用旧版本的编译器（0.4.21 是编写此代码时的版本，将工作正常）。\n\
    \n### 编写迁移脚本\n\n你需要编写一个迁移脚本，让 Truffle 知道如何将你的合约部署到区块链。进入 `migrations` 文件夹并创建一个名为\
    \ `2_deploy_contracts.js` 的新文件。在该文件中，添加以下代码：\n\n```javascript\nvar HashMarket\
    \ = artifacts.require(\"./HashMarket.sol\");\n\nmodule.exports = function(deployer)\
    \ {\n    deployer.deploy(HashMarket);\n};\n```\n\n因为我们只有一个合约，所以迁移文件非常简单。\n\n现在运行\
    \ `truffle migrate`，希望你能看到类似如下的输出：\n\n```\nUsing network 'development'.\n\nRunning\
    \ migration: 1_initial_migration.js\n  Deploying Migrations...\n  ... 0xad501b7c4e183459c4ee3fee58ea9309a01aa345f053d053b7a9d168e6efaeff\n\
    \  Migrations: 0x9d69f4390c8bb260eadb7992d5a3efc8d03c157e\nSaving successful migration\
    \ to network...\n  ... 0x7deb2c3d9dacd6d7c3dc45dc5b1c6a534a2104bfd17a1e5a93ce9aade147b86e\n\
    Saving artifacts...\nRunning migration: 2_deploy_contracts.js\n  Deploying HashMarket...\n\
    \  ... 0xcbc967b5292f03af2130fc0f5aaced7080c4851867abd917d6f0d52f1072d91e\n  HashMarket:\
    \ 0x7918eaef5e6a21a26dc95fc95ce9550e98e789d4\nSaving successful migration to network...\n\
    \  ... 0x5b6a332306f739b27ccbdfd10d11c60200b70a55ec775e7165358b711082cf55\nSaving\
    \ artifacts...\n```\n\n## 测试智能合约\n\n你可以使用 Solidity 或 JavaScript 进行智能合约测试。测试智能合约时\
    \ Solidity 可能稍微更直观一些，但 JavaScript 给你提供了更多可能性。\n\n### Solidity 测试\n\n为了开始测试，在你项目的\
    \ `test` 文件夹中，创建一个名为 `TestHashMarket.sol` 的文件。Truffle 套件为我们提供了用于测试的辅助函数，所以我们需要导入它们。在文件开头，添加：\n\
    \n```solidity\npragma solidity ⁰.4.20;\n\nimport \"truffle/Assert.sol\";\nimport\
    \ \"truffle/DeployedAddresses.sol\";\nimport \"../contracts/HashMarket.sol\";\n\
    ```\n\n前两个导入是最重要的。\n\n`Assert` 导入让我们能访问各种测试函数，如 `Assert.equals()`、`Assert.greaterThan()`\
    \ 等。通过这种方式，Assert 配合 Truffle 自动完成大部分“枯燥”的代码编写工作。\n\n`DeployedAddresses` 导入为我们管理合约地址。因为每次你更改合约，都必须将其重新部署到新地址，*并且*即使你不更改它，每次测试时合约也应该重新部署以从原始状态开始。`DeployedAddresses`\
    \ 库为我们处理了这个问题。\n\n现在让我们编写一个测试。在 `import` 指令下方，添加以下内容：\n"
