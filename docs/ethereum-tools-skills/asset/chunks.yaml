    After this, you should see new lines appear periodically, where Geth says “Importing
    new state” or “Importing new block headers” or “Importing new receipts”. The state,
    block headers and transactions are part of [Ethereum’s tree tries](https://ethereum.stackexchange.com/questions/15142/how-many-tries-does-ethereum-have):
    they must be downloaded in order to synchronize your node with the Ethereum blockchain.


    This is a process which can take a really long time, so one of the options you
    have is to run a light node like this;


    ```

    geth --light

    ```


    What Geth needs to do now is only pull the latest block headers and rely on other
    full nodes to validate transactions through the usage of [merkle proofs](https://www.quora.com/Cryptography-How-does-a-Merkle-proof-actually-work).


    ### Accessing a Geth Console


    Now that you’ve created a node, you can access it by opening up a new tab in your
    terminal and running the following:


    ```

    geth attach

    ```


    This will connect a Geth console — which is a Javascript environment for communicating
    with the blockchain — to your running node. This can be done in both the full
    client mode and the light mode.


    After you’ve opened the console, type this:


    ```

    web3.eth.blockNumber

    ```


    You should get an output as a number (e.g. 5631487) which represents the current
    block number of the Ethereum network.


    ## Creating a New Account


    In order to use the blockchain, you need to have an account. With Geth, you can
    do it by running the following in your terminal:


    ```

    geth account new

    ```


    After you’ve done that, it will ask you for the password, which you’ll need to
    protect your account. Make sure to use a secure password and to store it safely.


    What Geth does when you run `geth account new` is update a file in the Geth data
    directory (a directory where Geth stores all the necessary data, including blocks
    and headers). The locations are (per platform):


    *   macOS: `~/Library/Ethereum`


    *   Linux: `~/.ethereum`


    *   Windows: `%APPDATA%\Ethereum`


    ## Accessing Geth from Other Clients


    When you start Geth, the client automatically starts an RPC server at port `8545`.
    You can access the RPC server and its [methods](https://github.com/ethereum/wiki/wiki/JSON-RPC)
    on this port by connecting to `localhost:8545` with a library like `web3js` or
    `web3j` *or* call it manually with `curl` or `wget`.


    To learn about connecting with external tools like those to a running Geth instance
    (either private when launching your own blockchain, or public as in the instructions
    above) see [this post](https://bitfalls.com/2018/03/26/connecting-myetherwallet-mist-metamask-private-blockchain/).


    ## Conclusion


    In this short introduction we covered Geth, the types of Ethereum nodes, and their
    purpose. You can now run a Geth node of your own, and enhance it with third-party
    tools. In future articles, we’ll cover running private networks (your own Ethereum
    blockchain with Geth) and much more.


    # Chapter 3: Introducing Mist, a Human-friendly Geth Interface


    ### by Mislav Javor


    **This article explains how to install and work with [Geth](#part0003_split_000.html#2RHM0-7bc08c01daea4ad09f5951d0fde8baea)
    and Mist, which allow you to mine or develop Ethereum software, and to control
    your own node and your own wallet’s key, thereby signing your own transactions
    instead of relying on third-party software.**


    In order to communicate with the Ethereum blockchain, we must use a blockchain
    *client*. The client is responsible for broadcasting transactions, mining, signing
    messages and communicating with smart contracts.


    Currently, the most popular clients for Ethereum are [Geth](https://www.sitepoint.com/an-introduction-to-geth-and-running-ethereum-nodes/)
    and Parity. They both come as command line tools with terminal consoles for blockchain
    operations.


    Since most people aren’t comfortable using command line tools, client *extensions*
    like Mist were created. They “wrap” the functionality of the client in a user-friendly
    interface — enabling people not proficient in command line usage to participate
    in the network.


    ## What is Mist?


    Mist is a program which connects to Geth in the background, and also serves as
    an interface for the wallet.


    When Geth is running, it synchronizes with the public blockchain by downloading
    all its data. Mist is just a human-friendly interface for talking to Geth. In
    other words, Geth is both your node and your wallet, but instead of talking to
    it through obscure commands (such as `web3.fromWei(eth.getBalance(eth.coinbase)`)
    to get an account’s balance), Mist will provide that same information in the UI
    without you even having to ask for it.


    You can download Mist from [this link](https://github.com/ethereum/mist/releases).
    Download the version called Mist-installer, not the Ethereum-Wallet one.


    *The difference between Mist-installer and Ethereum-wallet is that Mist is, by
    itself, a web and Ethereum browser as well as a wallet interface. Ethereum-wallet
    has the browser functionality removed for safety, and only a single dapp installed
    — the wallet interface. Hence, they are the same, but the latter is limited in
    functionality.*


    The file you pick will depend on your operating system. macOS users will pick
    the `.dmg` file, Windows users will go for the `.exe` file, while Linux users
    will most often go with the `.deb` file.


    After having downloaded it, run the installation process then run the app. If
    you’re not sure where it got installed, just enter its name into your operating
    system’s search bar:


    ![Seeing where Mist is installed](images/00023.jpeg)


    ## Mist: First Run


    After running for the first time, Mist checks whether or not it has the latest
    Geth installed on the same machine and then checks for contact with the Ethereum
    network.


    ![Checking for contact with the Ethereum network](images/00024.jpeg)'
