    \ {\n    ^^^^^^^^^^^^^^^^^^\n\ndebug(development:0x34d26b8b...)>\n```\n\n这里我们可以看到调试控制台。它比大多数开发者习惯的现代调试器要原始得多，但它具备所有必需的功能。让我们来探索一下这些功能。\n\
    \n在控制台中，运行以下系列命令：\n\n```\ndebug(development:0x34d26b8b...)> o\n\nStorage.sol:\n\
