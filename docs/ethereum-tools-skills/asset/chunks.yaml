    \ writing.\n\nThe `DeployedAddresses` import manages contract addresses for us.\
    \ Since every time you change your contract, you must redeploy it to a new address\
    \ *and* even if you don’t change it, every time you test the contract should be\
    \ redeployed to start from pristine state. The `DeployedAddresses` library manages\
    \ this for us.\n\nNow let’s write a test. Under the `import` directives, add the\
