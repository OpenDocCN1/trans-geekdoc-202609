- raw: 'Then, Mist looks for peers — nodes it can connect to so it can download blockchain
    data from them.


    ![Looking for peers](images/00025.jpeg)


    Having found them, Mist begins to download the extraordinary amount of required
    data.


    ![Downloading required data](images/00026.jpeg)


    This can take days, depending on the speed of the computer and internet connection.
    It doesn’t have to finish all at once: you can shut it down and come by later
    or leave it overnight. You can also launch the app outright and wait for sync
    in the background while actually using the app.


    After syncing is finished, Mist will ask which network to use: Main or Test. Pick
    any of them. Unless you made an address beforehand in Geth via the `personal.newAccount`
    command (you probably didn’t and that’s fine), it’ll also ask you for a password.
    That password additionally secures your wallet, but don’t forget it: it cannot
    be changed and it cannot be restored. Choose wisely. The JSON file that gets generated
    by this process is then encrypted with this password, and can be imported into
    various wallet tools like MetaMask, MyEtherWallet, etc. To get to the JSON file(s)
    (for backup purposes) go to `File -> Backup -> Accounts` and Mist will open the
    folder containing the JSON files of generated addresses.


    ## Mist: Addresses


    After these initial steps have been completed, the main screen of the Mist app
    will appear. It’ll only have the main address you just generated shown on the
    screen. That address is called a coinbase address, and that’s the address that
    gets credited with Ether when it’s mined if you’ll be mining it on this machine.


    ![coinbase address](images/00027.jpeg)


    To be able to safely play with Ether and Mist’s functionality, we need to switch
    to the test network if you’re not already connected to it. In the Develop menu,
    go to *Network -> Ropsten*.


    ![Ropsten](images/00028.jpeg)


    For an explanation of testnets, please read [this post](https://bitfalls.com/2018/02/08/what-is-an-ethereum-testnet-and-how-is-it-used/).
    The gist of it is that there exist various public test networks for testing Ethereum
    software, but the Ether on those networks is worthless, so there’s no danger in
    doing reckless things and developing carelessly. Ropsten is one such network.


    Feel free to use the *Add Account* feature to add more addresses. One Geth/Mist
    can sustain an infinite number of addresses. The picture below shows three generated
    addresses.


    ![three generated addresses](images/00029.jpeg)


    If we click any of them, we’ll see some details.


    ![Account details](images/00030.jpeg)


    The part next to the icon above the balance — the one starting with 0x90 — is
    the address to which we can send Ether. But how do we get some? If you’re connected
    to the Ropsten network, you can use their faucet site: [faucet.ropsten.be:3001/](http://faucet.ropsten.be:3001/)


    Enter this address into the first field on that site and request some Ether.


    ![Ropsten faucet](images/00031.jpeg)


    If your node is synced up, the new balance should show up immediately. If it doesn’t,
    turn the app off and on again; it sometimes needs a reset to re-sync properly.


    ## Sending and Receiving Ether


    Sending is extremely simple. Open the *Send* interface in Mist, put the receiving
    address into “To” and select the sender under “From” (use the address you sent
    Ether to from the faucet).


    ![Send funds](images/00032.jpeg)


    You can pick the sending speed at the bottom of the screen. Slower is cheaper.
    Press send to send Ether, and input the password you previously decided on when
    asked for it.


    ![Send transaction](images/00033.jpeg)


    In this example, we’re sending 5 Eth from one address with 225 Eth to another
    with 0 Eth. The Ether should arrive almost instantly.


    ![Account overview: transaction](images/00034.jpeg)


    ## Contracts


    Mist enables easy and user-friendly deployment of smart contracts to the Ethereum
    blockchain. This is enabled by two components of the Mist suite:


    ### 1\. The Remix IDE


    Remix is a web-based development environment for deploying smart contracts. Remix
    has syntax highlighting, snippets, contract compilation and deployment script
    generation and a lot of other interesting features.


    You can access remix by clicking *Develop* on the toolbar and then clicking “Open
    Remix IDE”. You should get a window similar to this:


    ![Remix](images/00035.jpeg)


    ### 2\. Contract deployments


    In Remix, you can write, compile and test your smart contracts. After you’re done,
    you can go back to Mist and open the *Contracts* tab from the *Wallet* page. You
    should get a screen like this


    ![Mist wallets page](images/00036.jpeg)


    When you click on *Deploy new contract*, a set of inputs will open. There you
    can paste your contract source code or bytecode and deploy it to the Ethereum
    network. After you’re done, you can interact with your contracts.


    ## Conclusion


    Geth and Mist are essential tools for every ambitious Ethereum network participant.
    If you’d like to try mining or developing Ethereum software (ICOs, tokens, dapps),
    or if you just want to control your own node and thus your own wallet’s key, thereby
    signing your own transactions instead of relying on third-party software, installing
    and getting to know Geth and Mist is definitely worth the trouble.


    # Chapter 4: Introducing Truffle, a Blockchain Smart Contract Suite


    ### by Mislav Javor


    **In the early days of *smart contract* development (circa 2016) the way to go
    was to write smart contracts in your favorite text editor and deploy them by directly
    calling `geth` and `solc`.**


    The way to make this process a little bit more *user friendly* was to make bash
    scripts which could first compile and then deploy the contract … which was better,
    but still pretty rudimentary — the problem with scripting, of course, being the
    lack of *standardization* and the suboptimal experience of bash scripting.


    The answer came in two distinct flavors — *Truffle and Embark* — with Truffle
    being the more popular of the two (and the one we’ll be discussing in this article).


    To understand the reasoning behind Truffle, we must understand the problems it’s
    trying to solve, which are detailed below.


    **Compilation** Multiple versions of the `solc` compiler should be supported at
    the same time, with a clear indication which one is used.


    **Environments** Contracts need to have development, integration and production
    environments, each with their own Ethereum node address, accounts, etc.


    **Testing** The contracts *must* be testable. The importance of testing software
    can’t be overstated. For smart contracts, the importance is infinitely more important.
    So. Test. Your. Contracts!


    **Configuration** Your development, integration and production environments should
    be encapsulated within a config file so they can be committed to git and reused
    by teammates.


    **Web3js Integration** Web3.js is a JavaScript framework for enabling easier communication
    with smart contracts from web apps. Truffle takes this a step further and enables
    the Web3.js interface from within the Truffle console, so you can call web functions
    while still in development mode, outside the browser.


    ## Installing Truffle


    The best way to install Truffle is by using the Node Package Manager (npm). After
    [setting up NPM](https://nodejs.org/en/) on your computer, install Truffle by
    opening the terminal and typing this:


    ```

    npm install -g truffle

    ```


    #### On Linux


    The `sudo` prefix may be required on Linux machines.


    ## Getting Started


    Once Truffle is installed, the best way to get a feel for how it works is to set
    up the Truffle demo project called “MetaCoin”.


    Open the terminal app (literally Terminal on Linux and macOS, or Git Bash, Powershell,
    Cygwin or similar on Windows) and position yourself in the folder where you wish
    to initialize the project.


    Then run the following:


    ```

    mkdir MetaCoin

    cd MetaCoin

    truffle unbox metacoin

    ```


    You should see output like this:'
