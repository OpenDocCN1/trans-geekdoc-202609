    # 4. Discussion


    This study demonstrates the wide variety of machine learning techniques that have
    been used to assess the presence of an increased left ventricular mass or cardiac
    hypertrophy. It demonstrates the differences in sensitivity, specificity and predictive
    accuracy between ML algorithms. It further identifies large differences in the
    input variables between algorithms. These differences underscore the necessity
    to conduct an in-depth evaluation.


    The sources of datasets for left ventricular hypertrophy from the ECG in the literature
    varied widely between studies. Two studies derived data from military recruits,
    who were essentially young men with a low prevalence of LVH [31,39]. There were
    three population-based studies, with two studies on the same UK database, with
    a greater prevalence of LVH [32,36,37,43]. There were eight hospital-based studies,
    which had, on average, the oldest mean age and the highest prevalence of LVH,
    with the proportion of men ranging from 42 to 64% [33–35,38,40–42] and one military
    hospital with a predominance of men (90%) [44]. Overall, the proportion of men
    and women varied greatly but mainly because of the predominance of men in the
    studies of young military recruits and in a military hospital. Young male military
    recruits may not be generalizable to the general population or to older patients
    admitted to hospital. The prevalence of LVH between studies ranged'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'from 0.8 to 48% and may have influenced the precision of LVH detection. The
    majority of studies used echocardiograms to assess the prevalence of LVH, but
    the LVH criteria varied between studies in Asian or European populations.


    ML algorithms may be differentiated by the manner in which they select the boundary
    that distinguishes different groupings. SVM was used by several groups [31,37,43].
    The SVM classifier can use linear or non-linear functions, although linear functions
    are usually selected. The decision boundary in this method is called the maximum
    margin classifier, maximum margin hyperplane or the maximum margin hyper plane
    [45]. Other studies relied on logistic regression [33], a simpler method that
    tries to maximize the conditional likelihoods; however, it is more prone to outliers
    than SVMs, which mostly prioritize the points that are closest to the decision
    boundary. However, LR and SVM often yield similar results [46]. Some studies used
    RF [37,39,43]. Random forests are a classification algorithm using an ensemble
    of decision trees, such that each tree depends on the values of a random vector
    sampled independently, and the generalizability depends on the strength of each
    tree and the correlation between them [47]. In several clinical diagnosis conditions,
    RF showed the highest accuracy followed by SVM [48].


    Angelaki et al. used SHAP (SHapley Additive exPlanations), a game theoretic approach
    that connects optimal credit allocation with local explanations, using the classic
    Shapley values from game theory and their related extensions [38]. A number of
    studies used multiple ML algorithms [37,39]. Some investigators employed deep
    learning methods [34,40,42]. The explosive growth of deep learning for ECG data
    led to the conclusion that a hybrid architecture of a convolutional neural network
    and recurrent neural network ensemble yielded the best results [49]. However,
    there are some new challenges and problems related to interpretability, scalability,
    and efficiency, in addition to differences in the perspectives of datasets and
    methods [49]. This hybrid combination has been used in a few studies for LVH detection
    [34,42].


    Liu et al. reported both very high sensitivity and specificity. Usually, the higher
    a test sensitivity, the lower its specificity. They used detailed QRS analysis,
    but other studies that did not attain as a high a sensitivity and specificity
    also used detailed ECG signal analysis [43]; for example, Zhao et al. had 36,350
    ECG segments in their final dataset [40], and another ML algorithm used 552 amplitude
    and duration measurements per ECG [32]. The findings of Liu et al. [44] showed
    both very high sensitivity and specificity, but this may relate to their decision
    that they had too few LVH cases “for designing a machine-learning model. Therefore,
    the beat segmentation method, Pan-Tompkins technique was performed to increase
    the ECG data amount to improve the detection performances” [44].


    The crucial test of the ML algorithms is the comparative ability to predict LVH.
    The best or highest sensitivity was the algorithm proposed by Liu et al. [44],
    followed by Lin and Liu [31] and then by De la Garza-Salazar et al. [33]. If one
    wants a specific diagnosis, the highest specificity was found using the algorithm
    proposed by Sammani et al. [41], followed closely by that of Liu et al. [44] and
    then Khurshid et al. [36]. However, algorithms with high specificity often have
    low sensitivity. Combining sensitivity and specificity using ROC curves suggests
    the best approach would be the algorithms of Angelaki et al. [38] followed by
    Kwon et al. [34]. Several studies compared different ML models to predict LVH
    [34,39,42]. The differences were usually not large. Two studies compared at least
    four ML approaches, and both found that ENN had the highest AUC; ENN offered a
    competitive advantage over other ML approaches [34,42]. Kokopulo et al. developed
    an ensemble neural network (ENN) model, that consisted of a convolutional neural
    network (CNN) and a deep neural network (DNN) [42]. Kwan et al. used a deep neural
    network (DNN). Based on the two studies that used ENN, this ML approach (ENN)
    offered a competitive advantage over other ML approaches [34,42].


    Comparisons with classical ECG criteria for LVH showed that ML algorithms were
    usually more sensitive than the standard Cornell voltage [13], Cornell product
    [28], Sokolow-Lyons [9] or Romhilt-Estes criteria [29] for the detection of LVH.
    In contrast, generally, the ML algorithms were not more specific than the classic
    criteria, as four ML algorithms were'
