    ```


    Random shuffling in train-test splitting is employed to ensure that the training
    and testing datasets are representative of the overall dataset [24]. By shuffling,
    the data is randomized, preventing the model from learning potential patterns
    that may be due to the order of the data rather than the underlying relationships
    between the variables.'
