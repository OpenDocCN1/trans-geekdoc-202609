  md: '# Systemic Lupus Erythematosus: How Machine Learning Can Help Distinguish between
    Infections and Flares


    Iciar Usategui 1, Yoel Arroyo 2, Ana María Torres 3,4, Julia Barbado 5 and Jorge
    Mateo 3,4,*


    +   1 Department of Internal Medicine, Hospital Clínico Universitario, 47005 Valladolid,
    Spain

    +   2 Department of Technologies and Information Systems, Faculty of Social Sciences
    and Information Technologies, Universidad de Castilla-La Mancha (UCLM), 45600
    Talavera de la Reina, Spain

    +   3 Medical Analysis Expert Group, Institute of Technology, Universidad de Castilla-La
    Mancha (UCLM), 16071 Cuenca, Spain

    +   4 Medical Analysis Expert Group, Instituto de Investigación Sanitaria de Castilla-La
    Mancha (IDISCAM), 45071 Toledo, Spain

    +   5 Department of Internal Medicine, Hospital Universitario Río Hortega, 47012
    Valladolid, Spain

    +   * Correspondence: jorge.mateo@uclm.es


    Abstract: Systemic Lupus Erythematosus (SLE) is a multifaceted autoimmune ailment
    that impacts multiple bodily systems and manifests with varied clinical manifestations.
    Early detection is considered the most effective way to save patients’ lives,
    but detecting severe SLE activity in its early stages is proving to be a formidable
    challenge. Consequently, this work advocates the use of Machine Learning (ML)
    algorithms for the diagnosis of SLE flares in the context of infections. In the
    pursuit of this research, the Random Forest (RF) method has been employed due
    to its performance attributes. With RF, our objective is to uncover patterns within
    the patient data. Multiple ML techniques have been scrutinized within this investigation.
    The proposed system exhibited around a 7.49% enhancement in accuracy when compared
    to k-Nearest Neighbors (KNN) algorithm. In contrast, the Support Vector Machine
    (SVM), Binary Linear Discriminant Analysis (BLDA), Decision Trees (DT) and Linear
    Regression (LR) methods demonstrated inferior performance, with respective values
    around 81%, 78%, 84% and 69%. It is noteworthy that the proposed method displayed
    a superior area under the curve (AUC) and balanced accuracy (both around 94%)
    in comparison to other ML approaches. These outcomes underscore the feasibility
    of crafting an automated diagnostic support method for SLE patients grounded in
    ML systems.


    Keywords: Systemic Lupus Erythematosus; medical treatment; machine learning; artificial
    intelligence


    # 1. Introduction


    Systemic Lupus Erythematosus (SLE) is a chronic autoimmune affliction that affects
    various physiological systems. It serves as an exemplary autoimmune disorder,
    and its intricate nature poses significant challenges. The varied clinical presentations
    of SLE, coupled with distinct complexities in both diagnosis and treatment, present
    a formidable task for healthcare professionals. The emergence of multiple mechanisms
    results in the breakdown of self-tolerance and subsequent organ dysfunction. Progress
    in elucidating the molecular and cellular foundations of this condition, in conjunction
    with the identification of genetic variations, contributes to a more profound
    comprehension of its pathogenesis, offering promise for therapeutic advancements
    in the near future.


    Commonly known as lupus, it varies in prevalence depending on geographic location,
    ethnicity, and research study design. In the United States, an estimated 241 cases
    per 100,000 adults have been reported, while in Spain, the updated figure is 210
    cases per 100,000 inhabitants [1]. The Lupus Foundation of America estimates that
    approximately 161,000 to 322,000 individuals in the U.S. are affected by SLE,
    translating to a prevalence'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'of approximately 0.05% to 0.1% of the population. Predominantly, it affects
    young, fertile females and has resulted in increased mortality, although improved
    treatment modalities have positively impacted survival rates. Notably, the onset
    of the disease frequently occurs during the childbearing years. Certain demographic
    groups, including women, people of color (particularly African American, Hispanic,
    and Asian populations), and individuals of reproductive age, may experience higher
    prevalence rates. Simultaneously, several factors contribute to a state of relative
    immunodeficiency in individuals with SLE, including the aging, the increasing
    use of targeted biologic therapies, and the chronic nature of the disease. Furthermore,
    the presence of other comorbidities such as malignancy, infections, malnutrition,
    and more further compounds the complexity of the disease. SLE is a complex and
    heterogeneous condition, manifesting symptoms across a spectrum from mild to severe.
    The precise etiology of SLE remains not fully understood, with its development
    believed to result from a combination of genetic and environmental factors. Moreover,
    the prevalence of SLE may undergo changes over time, influenced by factors such
    as improvements in diagnostic methods and increased awareness of the disease.
    Collectively, these multifaceted factors underscore the need for a comprehensive
    understanding of the diverse epidemiological and clinical aspects of SLE to inform
    effective management strategies and interventions.


    Emerging evidence suggests that immunodeficiency and systemic autoimmunity are
    interconnected manifestations of a shared underlying process [2]. Immune disorders
    present as both susceptibility to infections and autoimmune symptoms, indicating
    a dual impact on the immune system—reduced ability to clear infections and a disruption
    of self-tolerance. On the other hand, infections are one of the most common causes
    of death and are often associated with high levels of activity in SLE. Early diagnosis
    of immunodeficiency in SLE is the first step to contribute to detect infections,
    which are likely to be associated with flares, allows prompt initiation of treatment,
    a better prognosis, and a reduction in organ dysfunction [3–7]. In the absence
    of specific criteria that can differentiate between a severe infection and an
    exacerbation in SLE, the development of clinical studies and guidelines becomes
    imperative to facilitate a more precise classification of these patients [8].


    In pursuance of this objective, Machine Learning (ML) draws inspiration from biological
    nervous systems. Its fundamental principle revolves around presenting algorithms
    with input data, subjecting them to computer analysis to predict output values
    within an acceptable range of accuracy, recognizing data patterns and trends,
    and ultimately assimilating knowledge from prior experiences [9]. ML delves into
    intricate data distributions, establishes probabilistic relationships, and identifies
    the minimum set of features required to capture essential data patterns through
    repeated cross-validation, culminating in the formulation of predictive models.
    Numerous studies have leveraged ML methods to develop more precise diagnostic
    algorithms for stratifying autoimmune diseases, thereby preventing or mitigating
    observed morbidity [10]. ML methods consistently exhibit superior performance
    compared to traditional statistical models [9,11–13]. A variety of ML techniques,
    including Support Vector Machine (SVM), Binary Linear Discriminant Analysis (BLDA),
    k-Nearest Neighbors (KNN), and Decision Trees (DT) [14–17], have been employed
    for data analysis. These systems represent a selection of algorithms designed
    for classifying data and processing information, and they have been explored in
    the context of various autoimmune diseases, including SLE, rheumatoid arthritis,
    lupus tubulointerstitial inflammation, and neuropsychiatric SLE [18–23].


    In this paper, we present a system that utilizes the Random Forest (RF) method
    for the analysis of immunodeficiency patterns in SLE patients. RF is an ML algorithm
    that operates by constructing a multitude of decision trees for classification
    and prediction. For its capacity to enhance accuracy and processing speed, and
    several notable advantages, including a low computational burden, flexibility
    in model tuning, high scalability, and algorithmic optimization, it serves as
    the cornerstone of this approach. Through the application of RF, we aim to predict
    the immunodeficiency status of our patients, with'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'the overarching goal of not only identifying optimal treatment options but
    also designing personalized preventive measures and tailoring patient-specific
    follow-up strategies.


    The paper is structured as follows. The first section outlines the topic, purpose,
    and significance of this study. Second section introduces a detailed description
    of material and methods. Third section entails the main findings of the study,
    including data, analysis, and interpretation of the results obtained. Fourth section
    explores a discussion of these results. And finally, the paper concludes with
    a summary of the research and some concluding remarks.


    # ## 2. Materials and Methods


    # ### 2.1. Materials


    The study cohort included 125 patients who met the American College of Rheumatology
    criteria for SLE in 2019 [23]. These individuals were enrolled from the Autoimmune
    Unit Registry at Valladolid Clinic Hospital (HCUV) between 2017 and 2019. The
    experimental protocol adhered to the principles outlined in the Declaration of
    Helsinki (2008) and received approval from the Clinical Research Ethics Committee
    of the HCUV. The study was conducted in compliance with Spanish data protection
    laws (LO 15/1999) and specifications (RD 1720/2007).


    Consequently, a retrospective review of patients was systematically conducted,
    encompassing the collection of epidemiological, analytical, immunological, and
    clinical characteristics. Relevant immunological parameters for evaluating immune
    competence included leukocytes, neutrophils, CD3, CD4 and CD8 T-cell counts, CD19
    B-cell and Natural Killer (NK) cell levels, serum immunoglobulin isotypes (IgG,
    IgA, IgM), IgG subclasses, and complement levels (C3, C4). Exclusion criteria
    involved patients with evidence of active disease (SLEDAI >= 4) or significant
    residual proteinuria (>500 mg). Following this selection strategy, 31 patients
    were excluded from the study.


    Flow cytometry was performed to identify cell populations. Serum levels of immunoglobulin
    isotypes and IgG subclasses and complement were determined by nephelometry. Standardized
    reference ranges from the immunology laboratory of our institution were used to
    define control patients. Laboratory levels below the reference ranges were considered
    as possible immunodeficiency status: leukocytes < 4000 cL/µL, neutrophils < 1800
    cL/µL, lymphocytes < 1500 cL/µL, CD3 T-cell < 700 cL/µL, CD19 B-cell < 100 cL/µL,
    CD4 T-cell < 300 cL/µL, CD8 T-cell < 200 cL/µL, NK cell < 90 cL/µL, IgG < 870
    mg/dL, IgG1 < 383 mg/dL, IgG2 < 242 mg/dL, IgG3 < 22 mg/dL, IgG4 < 4 mg/dL, IgA
    < 117 mg/dL, IgM < 60 mg/dL, C3 < 90 mg/dL, C4 < 10 mg/dL; special data for patients
    between 14 and 18 years old were: IgG1 < 315 mg/dL, IgG2 < 242 mg/dL, IgG3 < 23
    mg/dL, IgG4 < 11 mg/dL. Severe infection was defined as infection which required
    hospitalization of seriousness, treatment needed or recommended monitoring.


    # ### 2.2. Method


    This study introduces an ML method centered on the Random Forest (RF) algorithm.
    RF, a widely adopted ML algorithm within supervised learning, is applied for both
    classification and regression challenges in ML. Renowned for its simplicity, versatility,
    and robustness, RF embodies a potent ML algorithm with several noteworthy attributes:
    (1) operative as an ensemble learning approach, it combines decisions from multiple
    models to improve overall performance; (2) employing decision trees as base-level
    models; (3) mitigating overfitting by averaging results across several trees,
    thereby diminishing the risk of developing complex models performing well on training
    data but poorly on new data; (4) adeptly handling missing values by learning the
    optimal imputation value based on the reduction in the utilized criterion; (5)
    furnishing a reliable estimate of the importance of variables in the classification
    process; (6) demonstrating flexibility in its applicability to both regression
    and classification tasks; and (7) executing swiftly with minimal preprocessing
    requirements compared to alternative algorithms, capable of handling categorical
    variables'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'without necessitating the creation of dummy variables. Consequently, RF is
    the chosen algorithm for crafting the model aimed at detecting immunodeficiency
    patterns within the SLE population [24,25].


    Given a dataset \( S = \{x_j, y_j\} \), where \( x_j \) represents feature vectors
    and \( y_j \) corresponds to labels, the RF algorithm proceeds as follows:

    For each of the \( n \) trees in the forest:


    +   1. Draw a bootstrap sample \( Z^* \) of size \( N \) from the training data.

    +   2. Grow a decision tree \( T_b \) to the bootstrapped data by recursively
    repeating the following steps for each terminal node of the tree, until the minimum
    node size \( n_{min} \) is reached:

    +      (a) Select \( m \) variables at random from the \( p \) variables.

    +      (b) Pick the best variable/split-point among the \( m \) variables.

    +      (c) Split the node into two daughter nodes.


    The prediction of the RF then aggregates the predictions of the \( n \) trees.

    For regression, it is typically the average over all trees:


    ```

    \(\widehat{f}_{rf}(x) = \frac{1}{n} \sum_{b=1}^n T_b(x)\) (1)

    ```


    For classification, it is determined by the majority vote:


    ```

    \(\widehat{C}_{rf}(x) = \text{majority}\{\widehat{C}_b(x)\}_1^n\) (2)

    ```


    Here, \( T_b(x) \) and \( \widehat{C}_b(x) \) represent the prediction of the
    \( b \)-th decision tree for regression and classification, respectively.


    The algorithm was designed and developed using Matlab software (MatLab 2023a,
    The Mathworks Inc., Natick, MA, USA). Furthermore, the proposed system underwent
    analysis alongside other ML systems prevalent in the scientific community. These
    included Support Vector Machine (SVM) [14], Binary Linear Discriminant Analysis
    (BLDA) [26], Decision Trees (DT) [15], Linear Regression (LR) [27,28], and k-Nearest
    Neighbor (KNN) [16] to assess its performance. Within the ML system''s learning
    process, it is imperative to control overtraining. To address this, the k-fold
    cross-validation technique was employed in our case.


    As depicted in Figure 1, each iteration involves the random classification of
    70% of the patients for training and 30% for testing and validation. Notably,
    patient data are not shared between the training and validation subsets to prevent
    the algorithm from being validated with data from the same patients used in the
    training phase.


    ![](img/46da2aabc253ed283db238584dfa3d21_14_0.png)


    **Figure 1.** The figure shows the processes followed in this study for the classification
    of patients with SLE.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Additionally, techniques for hyperparameter optimization have been applied
    to fine-tune the hyperparameters of the methods. These hyperparameter values are
    adjusted during the training phase to maximize the accuracy of the ML method.
    The hyperparameters subjected to optimization encompass variables such as apprentices,
    neighbors, distance metric, distance weight, kernel, box constraint level, and
    multiclass method, each tailored to the specific requirements of the method in
    use. Bayesian optimization was chosen as the technique to enhance the performance
    of the various methods by optimizing the selection of diverse hyperparameters.
    Recall value and AUC were utilized as performance metrics. The entire study was
    iterated 100 times to obtain mean values and standard deviations for the process.
    Importantly, it should be emphasized that data used in each iteration were randomized,
    mitigating noise in the samples and ensuring the acquisition of results with statistically
    valid values [29].


    # 2.3. Performance Evaluation


    For this study, the most well-known metrics in artificial intelligence were implemented
    to test the performance of the methods [29]: balanced accuracy (BA), recall, precision,
    specificity (SP), degenerated Younden''s index (DYI) [29], receiver operating
    characteristic (ROC) and area under the curve (AUC). The F1 score is established
    as:


    $$F_{1score} = 2\frac{Precision \cdot Recall}{Precision + Recall}$$ (3)


    To test the classification performance of the model, the Matthew correlation coefficient
    (MCC) has been used, which is described as follows:


    $$MCC = \frac{TP \cdot TN - FP \cdot FN}{\sqrt{(TP + FP)(TP + FN)(TN + FP)(TN
    + FN)}}$$ (4)


    where TP is the number of true positives, FP the number of false positives, TN
    the number of true negatives and FN the number of false negatives. And finally,
    Cohen’s Kappa (CK), CK is another metric that estimates the performance of the
    model [29].


    # 3. Results


    The study was conducted on a group of 125 patients diagnosed with SLE. Out of
    these, 94 patients met the specific criteria of having a SLEDAI-2K score of less
    than four points, and were thus included in the study. Further analysis revealed
    that 77 of these 94 patients showed signs of immunodeficiency. This means that
    approximately 81.9% of the patients with a SLEDAI-2K score less than four exhibited
    signs of immunodeficiency.


    The cohort of patients had a median age of 52 years, whilst the median age at
    diagnosis was 38 years. The group was predominantly female, with 68 female patients
    compared to 9 male patients. The median duration of the disease among these patients
    was 14 years. At the time of data collection (see Table 1), 50 patients (64.9%)
    were being treated with corticosteroids at an average daily dose of 2.57 mg. In
    addition, 25 patients (34.9%) were receiving immunosuppressants such as azathioprine,
    methotrexate, and mycophenolate. Two patients were on belimumab treatment. Notably,
    none of the patients were undergoing treatment with rituximab.


    In turn, 41 patients (53.2%) exhibited patterns of immunodeficiency. Among these
    patients, there were a total of 51 episodes of severe infections. The breakdown
    of these infections is as follows:


    +   • 17 patients were hospitalized due to lower respiratory infections.

    +   • 4 patients were hospitalized for upper respiratory infections.

    +   • 9 patients were treated for urinary infections.

    +   • 10 patients had soft tissue infections.

    +   • 4 patients suffered from digestive infections.

    +   • 1 patient was diagnosed with tuberculous lymphadenitis.'
