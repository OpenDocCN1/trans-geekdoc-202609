- pgno: 159
  md: '# ## 6. Limitations and Future Directions


    While our study demonstrates promising results for the automated detection of
    Usher syndrome using miRNA expression profiles, there are several limitations.
    First, the dataset used is small, reflecting the challenges inherent to studying
    rare genetic disorders like Usher syndrome. A small sample size may limit the
    robustness and generalizability of the identified minimal feature set, which may
    not fully capture the variability across a more diverse population. Additionally,
    the heterogeneity of miRNA expression influenced by various factors (e.g., age,
    genetic background, and environmental factors) could impact the model''s performance
    when applied to different cohorts. Another limitation lies in miRNA data itself;
    variations in miRNA extraction and quantification techniques may influence the
    reproducibility of results across different labs or clinical settings.


    Future research should focus on expanding the dataset by including samples from
    diverse populations and incorporating longitudinal data where possible. This would
    allow the feature selection method to capture a broader range of genetic variability,
    enhancing the generalizability of the model. In addition, further studies should
    explore integrating multi-omics data (e.g., mRNA, protein, and epigenetic data)
    to improve predictive accuracy and capture complex biological interactions related
    to Usher syndrome. Another potential avenue is the incorporation of transfer learning
    or domain adaptation techniques to enable the model trained on miRNA data to be
    effectively applied to new data sources or patient groups. Validation in a clinical
    setting is also necessary to assess the practicality and reliability of the proposed
    framework in real-world diagnostic workflows. Finally, as more samples become
    available, it would be valuable to explore deep learning-based models that could
    potentially improve classification performance by capturing non-linear relationships
    in the data.


    # ## 7. Conclusions


    This study presents a machine learning-based approach incorporating ensemble feature
    selection and nested cross-validation for the discovery of miRNA biomarkers associated
    with Usher syndrome. Given the rarity of Usher syndrome, obtaining large datasets
    is challenging. Our method aims to maximize the reliability of biomarker identification
    by selecting a minimal set of miRNAs that remain robust against variations in
    sample size. The ensemble feature selection component integrates results from
    multiple models, while nested cross-validation ensures rigorous evaluation. This
    provides more reliable biomarker selection compared to conventional validation
    methods. The identified minimal biomarker set represents a promising step toward
    developing miRNA-based biomarkers for Usher syndrome, although its generalizability
    to larger, more diverse datasets remains a future goal. Our results demonstrate
    that as more data become available, the biomarker set can be refined and updated,
    enhancing its clinical applicability. Overall, this study provides a robust framework
    for feature selection and validation in small, complex datasets, with potential
    applications beyond Usher syndrome to other rare genetic disorders where data
    availability is limited.


