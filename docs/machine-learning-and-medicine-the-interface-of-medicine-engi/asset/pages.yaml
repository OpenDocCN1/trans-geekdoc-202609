  md: '# Improving Radiology Report Generation Quality and Diversity through Reinforcement
    Learning and Text Augmentation


    Daniel Parres 1,*, Alberto Albiol 1 and Roberto Paredes 1,2


    1 Campus de Vera, Universitat Politècnica València, Camí de Vera s/n, 46022 Valencia,
    Spain; alalbiol@iteam.upv.edu (A.A.); rparedes@prhlt.upv.es (R.P.)

    2 Valencian Graduate School and Research Network of Artificial Intelligence, Camí
    de Vera s/n, 46022 Valencia, Spain

    * Correspondence: dparres@prhlt.upv.es


    Abstract: Deep learning is revolutionizing radiology report generation (RRG) with
    the adoption of vision encoder–decoder (VED) frameworks, which transform radiographs
    into detailed medical reports. Traditional methods, however, often generate reports
    of limited diversity and struggle with generalization. Our research introduces
    reinforcement learning and text augmentation to tackle these issues, significantly
    improving report quality and variability. By employing RadGraph as a reward metric
    and innovating in text augmentation, we surpass existing benchmarks like BLEU4,
    ROUGE-L, F1 CheXbert, and RadGraph, setting new standards for report accuracy
    and diversity on MIMIC-CXR and Open-i datasets. Our VED model achieves F1-scores
    of 66.2 for CheXbert and 37.8 for RadGraph on the MIMIC-CXR dataset, and 54.7
    and 45.6, respectively, on Open-i. These outcomes represent a significant breakthrough
    in the RRG field. The findings and implementation of the proposed approach, aimed
    at enhancing diagnostic precision and radiological interpretations in clinical
    settings, are publicly available on GitHub to encourage further advancements in
    the field.


    Keywords: radiology report generation; reinforcement learning; text augmentation;
    machine learning; deep learning; vision transformer; chest X-rays; medical image;
    text generation


    # 1. Introduction


    Radiology report generation (RRG) is a challenging task where the goal is to interpret
    radiographic images and generate detailed reports on potential patient pathologies.
    In contrast to typical computer vision (CV) tasks, which aim to identify objects
    in images, RRG focuses on diagnosing potential pathologies and determining their
    presence, absence, or uncertainty. Moreover, limited data availability and the
    diverse nature of medical reports pose significant challenges. This task is crucial
    for streamlining and enhancing patient care, as it enables the analysis of individuals’
    health and the rapid detection of diseases. Furthermore, it serves as assistance
    and support for medical professionals. The RRG task parallels other works such
    as [1], where complex data are handled, and models trained from such data must
    ensure specific security criteria. This similarity arises from the need to develop
    models capable of diagnosing pathologies precisely, as in this type of problem,
    patients’ health is put at risk. Current approaches mainly rely on deep learning
    (DL), specifically the vision encoder–decoder (VED) architecture [2–8], incorporating
    components like memories [9,10] or reinforcement learning (RL) [5,11,12] to improve
    performance.


    This study presents a two-stage VED pure-transformer architecture for chest RRG.
    In the first stage, conventional negative log-likelihood (NLL) training is employed,
    while the second stage focuses on RL optimization for various metrics. These metrics
    encompass embedding comparison for semantic coherence [13], entity and relationship
    graph generation for pathology descriptions [14], and NLL. Additionally, we propose
    the integration of text augmentation and hard negative mining techniques. This
    comprehensive approach sur-'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'passes current chest RRG methodologies, enhancing report variability, factual
    correctness, completeness, and overall model generalization.


    The key contributions of this study are as follows:


    +   - Harnessing vision encoder–decoder transformer frameworks and reinforcement
    learning to enhance radiology report quality, factual correctness, and completeness.

    +   - Proposing text augmentation to the training workflow. This technique allows
    for leveraging the scarcity of data by generating new reports. This leads to an
    improvement in diversity, averaging a threefold increase compared to the state
    of the art.

    +   - Due to the challenge of measuring the quality of generated reports, we focus
    on employing specialized natural language processing-based metrics to evaluate
    radiology reports comprehensively.

    +   - Open-sourcing our methodology on GitHub at https://github.com/dparres/Diversifying-Radiology-Report-Generation
    (accessed on 1 April 2024) to propel progress in diagnostic precision and radiological
    interpretation within clinical settings.


    # # Related Work


    In recent years, deep learning techniques have led various approaches to classify
    and detect pathologies in X-ray images. Notable efforts in this domain include
    Schlegl et al. [15], who proposed a convolutional network (CNN) for classifying
    tissue patterns in tomographies, utilizing semantic descriptions in reports as
    labels. Building on this success, subsequent neural network models were explored
    for X-rays, such as Shin et al. [16], who introduced a CNN for chest X-ray images
    and a recurrent network (RNN) for annotations, jointly trained to annotate diseases,
    anatomy, and severity. Other approaches, like that of Moradi et al. [17], focused
    on annotation through the concatenation of a CNN and an RNN block to identify
    regions of interest. Notably, Rubin et al. [18] employed parallely trained CNNs
    for frontal and lateral chest X-ray views to estimate possible pathologies. The
    interest in RRG has grown, led by impactful models like TieNet [4], as well as
    innovative contributions from Li et al. [3], Jing et al. [19], and Jing et al.
    [19], each leveraging advanced techniques such as pretrained networks, coattention
    mechanisms, and retrieval policy modules for efficient disease classification
    and report generation.


    Deep learning applications in radiology encounter obstacles due to limited and
    unstructured data availability, exacerbating the normal–abnormal case imbalance
    and complicated by ambiguous radiologist reports [20]. CNN models such as AlexNet
    [21], VGG-16 [22], GoogLeNet [23], and ResNet [24] dominate medical text–image
    mining, with the increasing prevalence of end-to-end training [20]. However, the
    model comparison is hindered by dataset diversity, although incorporating radiology
    reports is expected to grow [20]. Radiology reports, diverse in style and influenced
    by biases, pose challenges in training robust models, with few datasets meeting
    scalability and accessibility criteria [25]. Most RRG systems concentrate on X-ray
    tests, with emerging applications for CT scans and MRI datasets, each encountering
    unique challenges [25].


    Alfargahly et al. [26] introduced a novel technique for generating radiology reports
    from chest X-rays with DistilGPT2 [27]. This approach highlights faster training
    and improved metrics. Although limitations persist, larger datasets’ release is
    suggested for enhanced model generalization and critical evaluation of quantitative
    methods [26]. Yang et al. [28] presented a method combining general medical and
    specific medical knowledge with a multihead attention mechanism for chest RRG.
    Furthermore, Pan et al. [29] proposed a method for generating chest radiology
    reports through cross-modal multiscale feature fusion. This architecture aims
    to enhance location sensitivity and disease characterization. Additionally, these
    advancements paved the way for aligning scales and integrating knowledge graphs,
    enhancing the accuracy of report generation [29]. Yang et al. [30] introduced
    a highly accurate and automated radiology generation framework coupled with a
    novel automatic medical knowledge updating mechanism, enhanced by a multimodal
    alignment approach. Zhao et al. [31] presented a knowledge enhancement technique
    leveraging medical knowledge in dictionary form alongside historical knowledge,
    comple-'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'mented by a multilevel alignment method to mitigate modal differences between
    text and image. Nicolson et al. [32] introduced CvT2DistilGPT2, leveraging a convolutional
    vision transformer for optimal encoder warm starting and highlighting GPT2’s [33]
    superiority in decoder warm starting over BERT [34]. Despite the proposals’ novelty,
    they all rely on metrics such as BLEU and ROUGE-L for comparison, which may not
    be entirely suitable for measuring the presence, absence, or uncertainty of pathologies.
    Furthermore, these metrics fail to consider the interrelation of pathologies within
    the report. Additionally, the monotony and repetition in generated reports are
    noteworthy factors attributed to the inherent difficulty of the RRG task.


    Due to the increasing interest in automating RRG, specific architectures have
    been designed to address chest RRG tasks. Liu et al. [5] proposed a CNN for extracting
    visual features, followed by a sentence decoder and word decoder for generating
    report topics and composing the final report. The model is fine-tuned using RL
    with CheXpert [35] labels. Chen et al. [9] introduced the memory-driven transformer,
    employing relational and memory-driven layers to enhance information retention
    and incorporation into the decoder. Meanwhile, Chen et al. [10] presented a VED
    based on cross-model memory networks, leveraging shared memory to capture and
    utilize visual–textual alignments.


    Liu et al. [6] and Liu et al. [7] proposed leveraging unsupervised construction
    of knowledge graphs to replicate radiologists’ patterns to generate reports. Focusing
    on RL, Miura et al. [11] suggested employing two metrics: one ensuring the generation
    of domain entities (factENT) and the other maintaining coherent entity descriptions
    (factENTNLI). These metrics are optimized alongside BERTScore [13], a semantic
    equivalence metric. Delbrouck et al. [12] propose a competitive chest RRG approach
    utilizing a VED. The model employs a DenseNet-121 [36] as the optical encoder
    and a single-layer BERT [34] as the decoder. Trained with RL, the optimization
    involves three metrics: RadGraph [14], BERTScore, and NLL. RadGraph, a neural
    network, constructs semantic annotations by forming a graph of entities and relationships
    in reports. The reward is computed by comparing the hypotheses’ entities and relationships
    against the reference, resulting in higher-quality reports surpassing values achieved
    by factENT and factENTNLI. These proposals employ chest-RRG-oriented metrics to
    enable more precise comparisons of report quality compared to metrics such as
    BLEU or ROUGE-L. Despite this and using RL for training, the reports exhibit repetitiveness
    and a lack of diversity.


    # 2. Materials and Methods


    This section of the paper presents the primary approach for the chest RRG task.
    Firstly, the neural models are introduced, and we propose four different architectures
    to analyze the most suitable for the RRG task. Subsequently, the training workflow
    of the models is outlined. Then, the text augmentation technique is introduced
    to leverage the scarcity of data. The final subsection presents the databases
    to be utilized and the metrics for comparing models and measuring the quality
    of the generated reports.


    # 2.1. Proposed Architectures


    Our model architectures for addressing the chest RRG problem are VED models, with
    Swin [37] as the vision model and BERT [34] as the language model or decoder.
    We opted for Swin for its outstanding performance in various computer vision tasks
    such as classification, object detection, and semantic segmentation [37]. Compared
    to ViT [38], Swin’s hierarchical nature and more efficient attention mechanism
    based on shifted windows make it more suitable for X-ray analysis. Our models
    utilize both the base and small variants, denoted as SwinB and SwinS. These architectures
    are pretrained with ImageNet [39] and feature an input image size of three channels
    with a width and height of 224 pixels. They have architectural depths of 2, 2,
    18, and 2 for each layer, with a patch size of 4. The primary difference lies
    in the number of heads, with SwinB utilizing sizes 4, 8, 16, and 32 and SwinS
    using 3, 6, 12, and 24.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'For the decoder model, BERT was selected due to its proven effectiveness across
    various natural language processing (NLP) tasks [34,40,41]. However, we diverge
    from the standard configuration by employing only three layers with a hidden size
    of 1024, rather than the original 12 layers. Moreover, our investigation includes
    the analysis of two distinct decoders: one word-based, with a vocabulary of approximately
    9.8k words, and another subword-based, featuring a vocabulary of 30k subwords.
    The integration of the vision model with the decoder model is facilitated through
    cross-attention layers, enabling the introduction of visual features extracted
    from the radiograph into the decoder. This integration allows for the autoregressive
    generation of reports.


    Following this approach, the proposed VED models for chest RRG analysis are SwinB+BERT9k,
    SwinB+BERT30k, SwinS+BERT9k, and SwinS+BERT30k.


    # 2.2. Training Workflows


    In radiological contexts, multiple images (such as anterior–posterior and lateral
    views) are commonly generated per patient study. We employ a multi-image approach
    to address this, restricting it to three images per study. This involves concatenating
    features extracted by the Swin encoder for each image and processing them in the
    decoder. Furthermore, we apply random transformations—including translation, scaling,
    rotation, and adjustments to brightness and contrast—to augment training images.


    Our training process comprises two stages, as illustrated in Figure 1. In the
    initial stage, the NLL loss function is employed, utilizing teacher forcing to
    train the model based on the generated hypothesis and the reference report. This
    stage typically encompasses approximately twelve training epochs. Subsequently,
    in the second stage, RL is introduced using the self-critical sequence training
    (SCST) algorithm [42]. SCST performs two forward passes of the VED: greedy decoding
    and beam-search multinomial sampling (sampling decoding). The first pass involves
    inference through greedy decoding to obtain the report Yg without calculating
    gradients. Meanwhile, the second pass employs sampling decoding, calculating gradients
    to obtain the sampling report Ys.


    RL aims to optimize specific metrics by using them as rewards. In our approach,
    we propose utilizing two metrics: BERTScore [13] and RadGraph [14]. BERTScore
    effectively improves grammar and semantics within models, while F1RG ER aids the
    model in prioritizing pathology-related entities and relationships.


    After obtaining the reports Yg and Ys, we must calculate a loss for each metric
    to optimize (Lossmetric). This Lossmetric is subsequently used to compute a weighted
    sum to obtain the final LossRL and update the model weights. Equation (1) outlines
    the process to derive the Lossmetric, where the metric rewards are computed for
    Ys and Yg using the reference report Yref. These rewards are then subtracted and
    multiplied by the logarithm of the probabilities calculated during the generation
    of the Ys report.


    ```

    Loss_metric(Y_s, Y_g, Y_ref) = -(r_metric(Y_s, Y_ref) - r_metric(Y_g, Y_ref))
    log(Pr(Y_s)) (1)

    ```


    Each Lossmetric contributes as a distinct weighted term to the final RL loss,
    as presented in Equation (2). To obtain the LossRL for updating the model weights,
    LossBERTscore, LossF1 RG ER, and the same loss utilized in the initial training
    stage, the LossNLL, are summed. In our experiments, we set α = β = 0.495 and γ
    = 0.010 as the weighting factors.


    ```

    Loss_RL = αLoss_BERTScore + βLoss_F1 RG ER + γLoss_NLL (2)

    ```


    # 2.3. Text Augmentation


    Data augmentation (DA) is the most prevalent technique for addressing machine
    learning problems with limited data. This approach significantly contributes to
    enhanced generalization and improved data utilization. However, regarding RRG,
    the focus has primarily been on augmenting input images. To the best of our knowledge,
    no prior approach has investigated the impact of augmenting radiology reports,
    a technique known as text augmentation (TA). In chest RRG, reports are often drafted
    by different individuals'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'in diverse manners, lacking specific templates, which results in significant
    variability inherent to natural language. Presently, state-of-the-art RRG algorithms
    encounter this data scarcity issue, often generating highly repetitive and monotonous
    reports.


    In this study, we introduce a TA technique designed to enhance the quality and
    diversity of generated reports. Our TA approach involves splitting the reference
    report into phrases, considering the typical structure of reports with multiple
    sentences. These phrases are then randomly reorganized to create new reports while
    maintaining the original diagnosis, as depicted in Figure 1. This method mitigates
    overfitting concerns and promotes a more targeted learning of the mentioned pathologies.
    Furthermore, our TA significantly improves the quality, factual accuracy, and
    comprehensiveness of the generated reports, as demonstrated subsequently.


