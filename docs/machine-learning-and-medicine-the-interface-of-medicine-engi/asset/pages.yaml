    # ## 3.2. Benchmarking with the State of the Art


    To assess the competitiveness of our top model against other state-of-the-art
    models, we selected the proposals with the most competitive results on both the
    MIMIC-CXR and Open-i datasets, as detailed in Table 3. The table is divided into
    two sections: models trained with NLL and models trained with RL, comparing them
    across the same metrics presented in Table 2. Metrics optimized for models trained
    with RL are indicated in parentheses. The benchmark model we employ is SwinB+BERT9k
    utilizing RL and TA, as depicted in Table 2.


    The results underscore the importance of utilizing RL for training, as models
    trained with NLL exhibit inferior performance. In NLL models for MIMIC-CXR, it
    can be observed that Nicolson et al. [32]''s proposal achieves the highest BLEU4
    score while securing a second position in terms of ROUGE-L. Pan et al. [29]''s
    proposal obtains the highest ROUGE-L value. Regarding chest RRG metrics, due to
    their novelty, not all proposals have registered values, as image-captioning metrics
    such as BLEU4 or ROUGE-L are commonly used. Our proposal achieved the highest
    F1_CXB values, followed by Delbrouck et al. [12]''s model; this trend was also
    observed for F1_RG_ER values. When compared to the NLL models of the Open-i dataset,
    the highest BLEU4 score is achieved by Miura et al. [11], while Chen et al. [10]
    obtain the highest ROUGE-L score. Similar to MIMIC-CXR, in chest-RRG-oriented
    metrics, our model obtains the highest values, followed by Delbrouck et al. [12].


    Table 3 also presents the results for methods trained with RL. The metric used
    within the RL reward is indicated in parentheses. In the MIMIC-CXR dataset, it
    is apparent that the BLEU4 score reported by Miura et al. [11] deteriorates in
    both models when compared to the one trained with NLL. However, it still manages
    to enhance the F1_CXB score. Regarding Delbrouck et al. [12]''s models, there
    is an improvement of about one point in BLEU4 and ROUGE-L, with their model achieving
    the second-best scores for F1_CXB and F1_RG_ER at 62.2 and 34.7, respectively.
    Meanwhile, our SwinB+BERT9k model surpasses all RL models across all metrics,
    demonstrating superior quality, factual correctness, and completeness. In the
    case of the Open-i dataset, a similar trend is observed, with our model outperforming
    other proposals by approximately nine and six points in F1_CXB and F1_RG_ER, respectively,
    compared to Delbrouck et al. [12]. The good results obtained in this database
    demonstrate the generalization and adaptability capacity of our training workflow
    to the chest RRG task.


