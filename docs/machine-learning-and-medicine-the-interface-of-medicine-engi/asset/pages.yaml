    # 3.3. Proposed Methodology


    Unlike traditional research for detecting and predicting SKCM disease, our proposed
    research exploits ensemble methods (stacking, bagging, boosting, and voting).
    The proposed research includes the latest ensemble methods to predict SKCM disease
    using various ML classifiers and analyze the overall survival using the Kaplan–Meier
    and Cox proportional hazards regression models. To train ensemble methods, we
    initially create and train baseline classifiers (RF, GB, NB, LR, ET, AdaBoost,
    DT, LGBM). The performance was evaluated for accuracy, precision, recall, and
    F1 score. ROC curve and confusion matrix were generated to illustrate the performance.
    Following is the detail of baseline classifiers.


    **RF:** The RF is a highly powerful ML classifier, which amalgamates diverse DT
    outputs using a majority voting mechanism. This technique increases the resilience
    of the solution, specifically in challenging problem domains. The overall prediction
    is derived by computing the average of the results generated by individual DTs.


    **GB:** It is a powerful ensemble learning ML classifier. Unlike RF, which combines
    various DTs, the GB creates a sequential DT, with each subsequent tree correcting
    the errors. The classifiers optimize a loss function by iteratively adding weak
    learners, typically shallow DT, to the ensemble. Each tree is trained to emphasize
    the instances where the model performs poorly, gradually refining the overall
    predictive capability. The GB is'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'known for its high predictive accuracy and adaptability to various data types,
    making it a popular choice for classification and regression tasks.


    **NB**: It is a simple classifier that leverages Bayes’ theorem for predicting
    the unlabeled data points. It involves the computation of previous probabilities
    related to various classes and their application to the latest data. The simplicity
    and computational efficiency of GNB arise from the assumption of feature independence,
    making it a streamlined approach for classification tasks.


    **LR**: It is used to predict the probability of the categorical data. LR utilizes
    a logistic function for calculating the probability in binary classification,
    where the output is dichotomous, representing two classes. It is also named the
    sigmoid function, which transforms the linear combination of input features into
    a value between 0 and 1, signifying the likelihood of belonging to a particular
    class. This makes LR particularly well-suited for problems with binary outcomes,
    such as in spam detection or medical diagnosis.


    **ET**: It is an ensemble learning method related to the DT algorithm. Similar
    to RF, ET develops a forest of DTs for prediction. In ET, for each split of the
    DT, the ETs randomly select the feature to split on, leading to a higher level
    of diversity among individual trees in the ensemble. This increased randomness
    often results in a more robust model and can be particularly useful in mitigating
    overfitting. ET is famous for its efficiency and accuracy in handling high-dimensional
    data, making it a valuable classifier.


    **AdaBoost**: This is a popular ensemble learning classifier for regression and
    classifications. It combines multiple weak learners’ predictions to create an
    efficient and accurate prediction model. The algorithm assigns weights to each
    data point, and, in each iteration, it focuses on the misclassified instances,
    adjusting their weights to prioritize correct classification in the subsequent
    iteration.


    **DT**: It is a highly recognized ML algorithm that evaluates the samples to categories
    as per their feature values. The DT creation process entails evaluating training
    samples and considering the most reliable features to partition the data into
    subsets, guided by principles like information gain or the Gini index. The motive
    is to create a tree capable of precisely predicting outcomes for new data based
    on the available features.


    **LGBM**: This is an effective gradient-boosting framework exploited for advanced
    ML tasks. Unlike traditional GB methods, it uses a “leaf-wise” tree growth approach.
    This technique follows to expand the structure of the tree, integrating leaves
    that result in the maximum reduction of the loss function, ultimately leading
    to faster training times.


