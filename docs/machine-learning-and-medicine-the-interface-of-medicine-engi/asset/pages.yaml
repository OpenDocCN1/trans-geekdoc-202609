  md: '# # About the Editor


    # **Simon W. Rabkin**


    Simon W. Rabkin is a Full Professor of Medicine in the Division of Cardiology
    at the University of British Columbia. Dr. Rabkin received his MD degree from
    the University of Manitoba and completed postgraduate training in cardiology at
    the University of Cincinnati and at Emory University. His research interests span
    the range from molecular/cellular pathways to cardiovascular disease, as well
    as clinical and population science. He has published over 300 scientific papers
    on a range of topics including brain–heart interconnection, heart failure, risk
    factors for coronary artery disease, and machine learning and AI.


    He was the founder and first director of the program in experimental medicine
    which is now one of the largest postgraduate programs in the Faculty of Medicine
    at the University of British Columbia. He has served on various committees and
    is the former President of the Vancouver Hospital Medical staff and Canadian Hypertension
    Society. He now serves as an associate editor of several cardiovascular journals.
    Throughout his academic career he has received multiple awards.'
