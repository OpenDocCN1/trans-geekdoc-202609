    # 2.4. Datasets and Metrics


    To evaluate the competitiveness of our models, we employed two publicly available
    datasets: MIMIC-CXR [43] and Open-i [44]. Due to the relatively small size of
    the Open-i dataset, containing 3.3 k reports, it was exclusively utilized for
    testing. The MIMIC-CXR dataset comprises 152 k reports for training, 2.3 k for
    validation, and 2.3 k for testing. The workflow involves training with the 152
    k reports, saving the model weights based on the best performance on the validation
    set, and finally using these weights to perform inference on both the MIMIC-CXR
    and Open-i test sets. It is important to note that in this study, the models were
    specifically designed to generate the findings section of the reports. Additionally,
    samples with empty findings sections were excluded from consideration.


    Metrics play a crucial role in comparing models, with BLEU4 [45] and ROUGE-L [46]
    currently considered as the most widely used natural language generation (NLG)-oriented
    metrics for reports. Additionally, two chest-RRG-oriented metrics, specifically
    designed to evaluate the quality of radiology reports, have been employed: F1CheXbert
    (F1cXb) [47] and F1RGER [12,14]. These metrics leverage neural networks to assess
    the quality of generated reports, offering a higher semantic evaluation. F1cXb
    utilizes CheXbert, a transformer model capable of identifying the presence of
    the 14 CheXpert [48] pathologies (atelectasis, cardiomegaly, consolidation, edema,
    enlarged cardiomediastinum, fracture, lung lesion, lung opacity, pleural effusion,
    pneumonia, pneumothorax, pleural other, support devices, and no finding) in a
    hypothesis report, and calculates the F1-score based on the pathologies present
    in the reference report. On the other hand, F1RGER employs a transformer model
    to analyze reports, generating graphs for entities and relationships. It evaluates
    comparisons between entity and relationship structures in hypotheses and reference
    graphs to compute the F1-score.


    # 3. Results


    This section details the experiments carried out to develop models for chest RRG.
    We analyze the proposed architectures and then conduct an ablation study on effective
    training techniques and strategies. Finally, we assess the competitiveness of
    our proposal by comparing it with state-of-the-art models. All experiments were
    conducted using a computer equipped with an NVIDIA RTX 4090 GPU.


