    # 3. Methodology


    In this section, we present the enhanced RFLN model tailored for single image
    super-resolution. In our work, we specifically adapted the model for medical imaging
    by replacing its residual local feature block with a standard residual block.
    Section 3.1 provides a comprehensive overview of the baseline model, while Section
    3.2 offers a detailed structural analysis of the proposed modifications and loss
    functions.


    # 3.1. Residual Local Feature Network


    The RFLN is a deep learning model primarily designed to enhance single image super-resolution
    tasks (Figure 1). It leverages the concept of residual learning, which facilitates
    the ability to focus on learning the residual (or difference) between the LR input
    and the HR output, rather than attempting to directly reconstruct the high-resolution
    image. This technique has proven effective in mitigating vanishing gradient issues,
    allowing for more efficient and accurate deep network training. At the core of
    the RFLN architecture are residual local feature blocks, which are designed to
    extract and preserve both local and global features from the input image. These
    blocks work in synergy to capture intricate details across various scales of the
    image, ensuring that the reconstructed high-resolution image maintains sharpness
    and fine texture details. The architecture also incorporates several layers of
    convolutional operations, each followed by non-linear activation functions, which
    together contribute to the progressive refinement of the image resolution.


    ![](img/46da2aabc253ed283db238584dfa3d21_89_0.png)


    Figure 1. The architecture of the modified RFLN.


    The residual local feature blocks within the network are particularly adept at
    retaining essential image features while suppressing irrelevant noise, which is
    critical for high-quality image super-resolution. In essence, RFLN focuses on
    learning local dependencies within the image, while the residual connections across
    layers ensure that the network can maintain stable gradient flow during training,
    preventing performance degradation in deeper layers. Furthermore, the integration
    of upsampling techniques toward the later stages of the network enables the final
    generation of the high-resolution output. These methods, often involving pixel
    shuffling or deconvolution, ensure that the output resolution is increased efficiently
    without introducing significant artifacts. By leveraging these techniques, RFLN'
