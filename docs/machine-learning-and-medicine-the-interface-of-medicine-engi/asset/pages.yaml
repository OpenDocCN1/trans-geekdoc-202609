    **b. Backward Feature Elimination Method (BFE):** BFE is a simple feature selection
    method that starts with a full model and deletes features until all remaining
    features have significant contributions. The least significant feature is deleted
    first, followed by refitting the model without the deleted feature and recompiling
    test statistics [36]. To understand the workings of this method, we have a set
    of features A with r size of dimensions that can be interpreted using Equation
    (8). We initialize the method using Equation (9) with a given set of features.
    Once the input variable is initialized, we have a subset of features Dw based
    on which method refits the features using Equation (10). Assume T- to be the features
    that will find the arg max (Dw - g) where g ∈ A - Dw maximize our selection criteria
    that is associated with the classifier having the best score; score can be accuracy,
    MAE, r2 on the set of features that is Dw. This process continues until we have
    the desired set L of features with a good score. Equations (11)-(14) detail the
    steps involved in the iterative feature elimination process.


    ```

    A = {A1, A2, A3, ..., Ar}                                                       (8)

    B0 = A,   w = r                                                                 (9)

    Dw = {gi | i = 1,2,3,...,w; gi ∈ A},   where w = {1, 2, 3, ..., m}              (10)

    T- = arg max(Dw - g),   where g ∈ A - Dw                                        (11)

    Dw+1 = Dw - T-                                                                  (12)

    w = w + 1                                                                       (13)

    W = L                                                                           (14)

    ```


