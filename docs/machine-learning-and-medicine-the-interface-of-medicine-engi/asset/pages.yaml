  md: 'no better and four were worse than these classic criteria for LVH. The ML algorithms
    of Sparapani et al. [32], Kokubo et al. [42], Kwan et al. [34] and Khurshid et
    al. [36] had a specificity equal to the classical ECG criteria.


    A major theoretical issue with the ML algorithms for the detection of LVH is the
    use of different kinds of input data. There are several lines of reasoning for
    the use of ML for LVH diagnosis. The first is whether ML can improve LVH detection
    based on QRS complexes and especially QRS voltage, which was historically the
    first attempt to electrocardiographically identify LVH [9]. The second approach
    is to utilize all aspects of the ECG signal. This was embodied by the work of
    Romhilt and Estes [29], who added QRS axis and ST-T waves to QRS voltage to identify
    LVH. As such, ML algorithms can point to the classical approach to justify the
    inclusion of other ECG factors. The incorporation of clinical factors becomes
    more problematic in ECG assessment. When age and history of hypertension are included,
    sensitivity increases markedly, but is that a fair test of the use of ECGs in
    diagnosis? The addition of an extensive list of clinical and laboratory variables
    further removes the question from the utility of the ECG but satisfies the question
    of how to more accurately predict the presence of LVH. For example, Sabović et
    al. inputted a large number of clinical and laboratory variables, including blood
    count, blood glucose, lipids, renin activity, leptin, insulin, aldosterone and
    cortisol [37]. Zhao et al. included the input variables of clinical factors, age,
    sex and medical history, as well as laboratory factors, like hemoglobin, PLT,
    lipids, creatinine sodium and potassium [40]. The inclusion of such extensive
    clinical and laboratory data precludes the use of the ECG as a screening test
    for the presence of LVH, as all the clinical and other laboratory data, which
    are usually not available, would have to be inputted to utilize the algorithms.


    Studies on machine learning-based prediction models have been criticized because
    of poor methodology quality and a high risk of bias [50]. The criticism relates
    to the frequent failure ‘to report key information to help readers judge the methods
    and have a complete, transparent and clear picture of the ...content of the model’
    [51]. This criticism has some validity in the assessment of ML algorithms for
    the detection/diagnosis of LVH. These kinds of models, because of their complexity,
    have been labelled as a ‘black box’, certainly compared to regression-based models
    that can be more recognizable [51]. For example, it is challenging to compare
    algorithms that state they are derived from 24 features, which consist of R peak
    and S valley amplitudes automatically obtained from the output of an ECG signal
    [44] versus raw ECG data, with 5000 numbers from each of the 12 leads [34]. Recognizing
    the limitations of each of the studies, it is worth discussing the implications
    of the results. First, ML algorithms can improve the sensitivity of the ECG for
    the detection of LVH. Improving sensitivity is important for a screening technique,
    and the ECG fulfills that requirement. Second, simplicity warrants using an algorithm
    that only relies on ECG variables to add to the ECG interpretation with respect
    to LVH. Third, algorithms that were developed utilizing a neural network approach
    appear to offer a competitive advantage over other ML approaches.


    There are several limitations of this analysis that warrant discussion. First,
    the studies usually utilized ML approaches from available ‘packages’. Wallace
    et al. cautioned that the “near-ubiquitous reliance on ‘out of bag’ approaches
    may provide ‘misleading results’” [52]. Second, many of the algorithms use ECG
    variables from most or all of the ECG leads, but in LVH detection, the QRS criteria
    from multiple leads often provide similar data [53]. Third, not all publications
    provided the same outputs to compare accuracy, F1 or ROC data. Fourth, it is difficult
    to compare and select the ‘best’ ML algorithms when one algorithm employs an extensive
    list of laboratory variables and another uses only ECG factors. One is left with
    the question whether one approach would be better if it also included an extensive
    list of laboratory tests.


    In summary, it is important to re-emphasize the potential of the ECG to identify
    LVH because LVH is a significant predictor of cardiovascular events [3,8,19,24]
    and because a better approach for LVH detection would be an important contribution.
    Several ML algorithms improve the sensitivity, but most do not improve specificity
    for LVH diagnosis'
