- pgno: 117
  md: 'the leading cause of mortality. The report exhibits that nearly 10 million
    deaths have resulted from various types of cancer [2]. The World Health Organization
    (WHO) 2023 report illustrates that cancer is the second leading cause of death
    (16%), followed by cardiovascular disease (27%) [3]. In such a situation, the
    early diagnosis of a disease can cure and prevent the patients from further jeopardy.
    In general, there are two main forms of skin cancer: melanoma (cancers resulting
    from melanocyte malfunction) and non-melanoma skin cancers (from cells generated
    from the epidermis) [4]. Among various types of cancers, SKCM has become one of
    the most prevalent cancers in the last ten years [5] with tumors made of melanocyte
    cells. It is currently a major public health issue worldwide, and the increasing
    prevalence of the disease might significantly impact the world’s population and
    economy [6]. However, early diagnosis and effective tumor therapy lead to a cure
    rate of over 90% in individuals with incipient melanoma [7]. There are several
    factors for an increased number of skin cancers. One of the most common occurrences
    of skin cancer is due to ultraviolet (UV) rays [8]. Other reasons include sun
    exposure, depletion of the ozone layer, genetic predisposition, and so on.


    Several studies have shown that SKCM results from abnormalities in transcriptional
    and epigenetic factors, including the expression of messenger ribonucleic acid
    (mRNAs) and micro ribonucleic acid (miRNAs), the aberration in methylation patterns
    of CpG islands of genes, and histone modifications, which opens the door for the
    development of potential molecular biomarkers in melanoma [9,10]. As predictive
    indicators for cutaneous melanoma, miRNA expression has been implicated in several
    past studies.


    Various healthcare sectors, including dermatology, have leveraged artificial intelligence
    (AI), revolutionizing diagnostic and therapeutic processes. Diverse biomedical
    data from health records, medical images, IoT sensor data, and text can be used
    to predict SKCM. Specifically, machine learning (ML) and deep learning (DL) significantly
    contribute to predicting the disease on publicly available datasets. The most
    recent skin cancer detection technique includes dermoscopy with AI, which leverages
    the handheld device for magnifying the skin and allows dermatologists to examine
    moles and lesions in detail. The ML and DL algorithms require structured data
    for classification, with lower prediction accuracy, and require more computational
    time. Due to its superiority over traditional analytical methods, AI has significantly
    uplifted the healthcare industry. Applications of AI in healthcare are being used
    with increasing optimism, and they range from speeding up the research of new
    drugs to helping with medical diagnosis, treatment, and administrative support.
    Additionally, using it as an adjvant in clinical decision making can be advantageous
    [11,12]. Various ML algorithms are leveraged to predict different diseases in
    the early stage after diagnosing different attributes of the disease. Those diseases
    include different cancer types, diabetes, kidney disease, and other diseases [13].
    Specifically, ensemble learning is a learning method that combines multiple baseline
    models to create a powerful single model. It reduces overfitting risk and has
    been successfully applied in various fields. Common ensemble techniques include
    averaging, bagging, boosting, stacking, and voting. [14]. Traditional ensemble
    learning integrates ML models across various fields, but efforts have shifted
    to DL, focusing on complex models and integrating them across various fields [15].
    The other recent skin cancer detection technique involves reflectance confocal
    microscopy (RCM), a non-invasive imaging approach, that enables high-resolution
    skin imaging at the cellular level. It aids dermatologists in visualizing skin
    structures and identifying abnormal cells without a biopsy procedure. Another
    recent technique leverages smartphone applications where mobile applications utilize
    smartphone cameras for skin self-examination. These apps often use AI algorithms
    to analyze photos and provide risk assessments. The main objective of this study
    is to propose four ensemble methods for predicting skin cancer by utilizing ML
    algorithms. We experimented with five transcriptomic technologies from the ICGC
    portal [16]. In this research, three features were leveraged—recursive feature
    elimination (RFE), forward feature selection (FFE), and backward feature elimination
    (BFE)—for the ensemble method. This paper discusses the five phases for ensemble
    methods based on ML algorithms that use transcriptomic technology'
