    # 4.3. Model Evaluation


    The performance of five models in classifying Usher syndrome samples using miRNA
    data was evaluated across 10 validation sets over 10 iterations, as shown in Table
    2. Logistic regression model demonstrated consistent accuracy with minimal fluctuations,
    highlighting its ability to generalize effectively in classifying Usher syndrome
    samples compared to control samples. Specificity remained close to 1.0 across
    most iterations, indicating the model''s reliability in identifying true positives.
    Sensitivity, although exhibiting slight variability, was stable enough to confirm
    the model''s effectiveness in correctly classifying control samples. The F1 Score,
    a balance between precision and recall, consistently hovered around 1.00 with
    minimal variation, reflecting the robust behavior of the model in maintaining
    a strong balance between true positive rate and precision. Additionally, the Area
    Under the Curve (AUC) remained nearly perfect, consistently achieving values between
    0.97 and 1.0. The overall performance metrics are as follows: mean Accuracy of
    97%, mean Sensitivity of 98.0%, mean Specificity of 93%, mean F1 Score of 95%,
    and mean AUC of 97%. Furthermore, Logistic Regression demonstrated stable and
    reliable performance across all evaluation metrics, making it a suitable and robust
    choice for miRNA-based classification of Usher syndrome.


    # 4.4. Pathway Analysis


    There were 6115 unique genes predicted to be targeted by the 10 miRNAs derived
    from the ML model. In total, 572 of these genes were predicted to be strongly
    suppressed by the miRNAs of interest. There were six GOs flagged to be affected
    (Figure 5). Of the six GOs, four were associated with neuronal or axon development.
    The remaining two GOs were signal transduction related, with RAS protein signal
    transduction, and GTPase mediated signal transduction both predicted to be suppressed
    by miRNAs of interest. Included are the top 10 pathways associated with the genes
    targeted by miRNAs from the ML model (Figure 6). The top two pathways in terms
    of combined scores are both related to neuronal development, corroborating observations
    from GO enrichment findings (Table 3).'
