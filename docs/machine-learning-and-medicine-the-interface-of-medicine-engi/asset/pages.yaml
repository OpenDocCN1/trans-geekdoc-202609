    # 4.1.3. ML-Based Ensemble Methods


    We trained eight different ML classifiers to create ensemble models. To evaluate
    the performance of the proposed ML classifiers, we used two performance measures:
    ROC and confusion matrix. The results are presented in accuracy, precision, recall,
    F1 score, and ROC curve. The assessment includes four performance metrics: true
    positive (TP), denoting the accurate classification of ‘Positive Reputation’ in
    positive samples; false positive (FP), representing the misclassification of samples
    not belonging to the class; true negative (TN), indicating the accurate classification
    of negative samples; and false negative (FN), signifying the misclassification
    of samples as positive when they actually belong to the negative class.


    Table 5 compares the performance of feature selection methods. We have trained
    an RF classifier with scoring matrix r2 to select the best features. The performance
    of the RFE method is better than the other two methods.'
