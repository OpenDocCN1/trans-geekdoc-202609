    # 2.1. Methodology 1: Algorithms 1–3—Classical Approach


    Methodology 1 is presented via Algorithms 1, 2 and 3 in the investigation. The
    approach of Algorithms 1–3 is as follows:


    Step 1: Data loading and initial processing—the initial step involves loading
