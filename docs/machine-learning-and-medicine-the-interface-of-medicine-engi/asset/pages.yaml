    The lower part shows four exemplars that share the same class as the input.


    A survey was conducted involving domain experts, beginners, and unskilled people
    to assess the effectiveness of the explanations provided by ABELE. The results
    of the survey show that the usage of explanations increases trust and confidence
    in the automatic decision system. This phenomenon is more evident among domain
    experts and people with the highest level of education. After receiving wrong
    advice from an AI model, domain experts tend to decrease their trust in the same
    model for future analysis.


    The survey was designed to validate the effectiveness of the explanations returned
    by ABELE for skin lesion diagnosis. The main purpose was to validate the effectiveness
    of the explanations in assisting doctors and medical experts in the diagnosis
    and treatment of skin cancers, as well as to investigate their confidence in automatic
    diagnosis models based on black-boxes and on the explanations provided by the
    explainer.


    The survey was organized into ten questions composed of various points. Participants
