    # 4. Discussion


    To our knowledge, this is the first work to investigate both the diagnostic accuracy
    and appropriateness of triage recommendations of GPT-4 and Bard in response to
    simulated ophthalmic complaints of varying degrees of descriptiveness. It also
    uses the largest sample size of responses. Overall, the chatbots were significantly
    better at ophthalmic triage than at providing the correct diagnosis; notably,
    GPT-4 displayed high rates of appropriate triage—which supports data found in
    another recent study [21]. Our work demonstrates that GPT-4 performed significantly
    better than Bard in the domains of appropriate triage recommendations, responses
    that experts were satisfied with for patient use, and responses that were not
    considered to cause harm if given to real patients. While some of the results
    were not statistically significant in the sub-analyses, this was likely due to
    the smaller sample size. It should be highlighted, however, that in the 5 descriptor
    sub-analysis, GPT-4 performed significantly better than Bard in considering the
    correct diagnosis as either the most likely diagnosis or as one of the possible
    diagnoses in the differential diagnosis (92.5% vs. 72.5%; p = 0.019). This is
    in agreement with recent research demonstrating the superiority of GPT-4 to Bard
    in correctly answering questions related to ocular symptoms [19] and myopia-related
    queries [20]. In addition, our work uniquely reveals that increasing the detail
    of chatbot input (more descriptors) generally improved the quality of output.
    It should be emphasized that the chatbots were able to provide appropriate triage
    recommendations without necessarily recognizing the exact diagnosis which better
    lends itself as an ophthalmic triage tool than as a diagnostic tool. Another critical
    question to consider is the performance of these chatbots in the context of do-not-miss
    diagnoses that are vision- or life-threatening, such as an oculomotor nerve palsy,
    endophthalmitis, or acute angle closure crisis. In these cases, humans might be
    trained to take extreme caution when giving guidance to patients, and adoption
    of conversational AI tools in this space may depend on the responses in such cases.
    Here, we examined the superior performing chatbot (GPT-4) under optimal conditions
    (5 descriptor'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'prompts), and we found that all 11 entries with do-not-miss diagnoses resulted
    in generally appropriate triage recommendations and responses that senior ophthalmologists
    were satisfied with for patient use. Moreover, there were no responses (0 of 40)
    in the GPT-4-5 descriptor subgroup that were considered to be potentially harmful.
    This is particularly valuable as we consider the potential applications of this
    technology for future patient use, either as a self-inquiry tool or as an adjunct
    tool for medical staff to execute timely, appropriate, and safe patient triage.


    This study’s moderate sample size of chatbot responses is one of its many strengths.
    We used a highly systematic approach to develop and input all chatbot entries,
    with chatbot history being reset following each entry to eliminate the variable
    of chatbot growth over the course of data collection. In addition, our 3-step
    approach to inputting entries for each “conversation” attempted to take advantage
    of the conversational capabilities of these chatbots. Lastly, the chatbot responses
    were all gathered within a one-week time-frame during which all responses were
    generated from a single iteration of either GPT-4 or Bard, then statistical analysis
    was performed.


    Based on the results found in this work, chatbot responses in the current state
    of technology are promising but not a sufficient substitute for professional medical
    advice, yet only in a handful of chatbot responses, GPT-4 more often than Bard,
    were there such explicit disclaimers. Some examples from GPT-4 include: “I’m an
    AI developed by OpenAI and while I can help suggest some potential causes for
    your symptoms, I’m not a substitute for professional medical advice”, “Please
    note that this advice does not substitute professional medical advice. Always
    consult with a healthcare provider for medical concerns”, or “Remember that while
    the internet can provide useful general advice, it’s no substitute for the professional
    judgment of a healthcare provider who can evaluate your child in person”. It should
    also be added that in less than half of the GPT-4 responses (28 of 80) and in
    only one Bard response, was there a specific comment about being an AI; interestingly,
    Bard only indicated itself as such when unable to respond [“I''m a text-based
    AI and can''t assist with that.”]. In this work, we inputted the chatbot prompts
    from the perspective of a simulated patient; in the future, it would be worthwhile
    to assess how chatbot responses would differ if the chatbot was prompted to answer
    questions while identifying itself as an AI-generated ophthalmic triage staff.
    Nonetheless, the chatbot''s recognition of self-limitations as an AI and its recommendation
    to seek professional medical evaluation are important elements that serve as safety
    checks to the general public who may already be using this technology to answer
    their own health-related questions.


    # 5. Limitations


    Prior to considering the implementation of such technology for clinical use, further
    studies with larger data sets should be performed. Another shortcoming of this
    study is the relatively subjective definition of a “descriptor”, where some modifiers
    might be more informative than others; nonetheless, our results overall do show
    that a more descriptive chatbot prompt is desirable. A general concern of conversational
    AI that must also be highlighted is the risk of generating “hallucinations”, seemingly
    accurate information that are in fact false [23]. While our study found that chatbot
    responses, especially GPT-4, were typically not harmful, we did not specifically
    investigate the number of hallucinatory responses. The potential of generating
    convincing misinformation is a serious concern that should not be taken lightly
    and should be further explored, especially as different iterations of these software
    are developed.


    # 6. Conclusions


    In this work we have evaluated two AI chatbots for their use in ophthalmology;
    however, as the usage of these tools increases over the coming years, it is imperative
    to continue their evaluation. As future iterations of GPT-4, Bard, or other LLMs
    are published, each of these should be tested anew. Additionally, more reviewers
    could assess a larger sample size of chatbot responses in order to provide greater
    accountability for the variability'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'in AI responses. In addition, the language of prompts can be more varied in
    future studies to allow for variability from the user. Finally, more in-depth
    studies of chatbots’ use may be performed over a longitudinal study following
    patients’ real-time diagnoses and the chatbots’ capabilities in diagnosis and
    triage.


    Another aspect of AI chatbots to study further includes incorporating images with
    written text of patient concerns to assess how diagnostic accuracy and triage
    recommendations vary with the added variable of clinical photos. Given that ophthalmology
    is a highly visual discipline, it would be interesting to assess how external
    photos of the eye (i.e., the type of photo that a patient could realistically
    provide) in conjunction with clinical context would impact chatbot responses.


    While this work sheds light on the performance and potential utility of GPT-4
    and Bard in the domain of ophthalmic diagnostics and triage, the broader scientific
    understanding of conversational AI in medicine is still in its infancy as there
    is an endless number of ways to engage with these chatbots. Recognizing the optimal
    approach of feeding information into the chatbot and evaluating the quality of
    the resultant response is imperative to advancing towards real-world application
    of conversational AI for patient use, either as a self-triage tool or as an adjunct
    triage tool for medical staff. Our results herein suggest that currently, GPT-4
    outperforms Bard and that a greater number of key clinical descriptors for chatbot
    input is desirable. But only until we have established a full understanding of
    the strengths and weaknesses of AI chatbots and have been able to consistently
    achieve a high level of excellence in the quality of responses should we consider
    their incorporation in patient care. As the world quickly moves towards greater
    use of conversational AI and a greater need in clinical settings for technological
    solutions, the urgency for investigative studies like this one will only increase.


