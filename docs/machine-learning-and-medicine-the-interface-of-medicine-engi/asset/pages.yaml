  md: '# 4.4. The International Skin Imaging Collaboration


    ABELE (Adversarial Black-box Explainer generating Latent Exemplars) [36] is a
    local model-agnostic explainer that takes an image and a black-box classifier
    as input and returns a set of exemplar and counter-exemplar images, as well as
    a saliency map.


    Exemplars and counter-exemplars are synthetically generated images classified
    with the same outcome as the input image and with an outcome other than the input
    image, respectively. They can be visually analyzed to understand the reasons for
    the decision. The saliency map highlights the areas of the input image that contribute
    to its classification and areas that push it into another class.


    ABELE works by generating a neighborhood in the latent feature space using an
    Adversarial Autoencoder (AAE [37]). The image to be explained is passed as input
    to the AAE where the encoder returns the latent representation using latent features.
    A genetic approach maximizing a fitness function was adopted to accomplish the
    neighborhood generation. In this respect, ABELE takes advantage of a latent version
    of LORE.


    After the generation process, for any instance in the neighborhood, ABELE checks
    the validity of the instance by querying the discriminator and decoding it into
    an image. Then, it queries the black-box classifier with the image to obtain the
    class. Given the local neighborhood, ABELE builds a decision tree classifier trained
    on the neighborhood labeled with the black-box classifier. The surrogate tree
    is intended to locally mimic the behavior of the black-box classifier in the neighborhood.
    It extracts the decision rule and counter-factual rules enabling the generation
    of exemplars and counter-exemplars.


    The overall effectiveness of ABELE lies in the goodness of the encoder and decoder
    function adopted. The better the AAE, the more realistic and useful the explanations
    will be.


    In recent years, deep learning, particularly through convolutional neural networks
    (CNNs), has significantly advanced the detection and diagnosis of skin cancer
    lesions [38–41], achieving diagnostic accuracies comparable to dermatologists.
    This progress promises improved early detection rates and broader access to high-quality
    diagnostic services. However, the effectiveness of these models in clinical settings
    hinges on their interpretability and the transparency of their decision making,
    ensuring healthcare professionals can integrate AI insights confidently into patient
    care. In [42–45], a case study on skin lesion diagnosis using a ResNet classifier
    trained on the ISIC (International Skin Imaging Collaboration) dataset is presented.
    The classifier’s decisions are explained using ABELE.


    A user interaction module was implemented as a web application to present the
    results of the classification and the corresponding explanation. The module communicates
    with a backend that exposes the functionalities of the black-box and ABELE via
    a RESTful interface (https://kdd.isti.cnr.it/isic_viz/, accessed on 14 March 2024).
    The visual space of the application is organized into two sections (see Figure
    5). The upper part shows the instance under analysis with the classification returned
    by the ResNet on the left and a synthetic counter-exemplar image returned by ABELE
    on the right. The lower part of the module shows four exemplars, i.e., a set of
    images returned by ABELE that have the same label assigned by the ResNet to the
    instance under analysis.


    The customization of the autoencoder, specifically an Adversarial Autoencoder
    (AAE), is crucial in this case study due to the complexity of the image classification
    task and the limitations of the dataset. The ISIC dataset, which is used for training
    the ResNet classifier [46], presents challenges such as fragmentation, imbalance,
    lack of uniform digitization, and shortage of data. Training an AAE in a standard
    fashion without addressing these issues results in poor performance, mainly due
    to a persistent mode collapse.


    To overcome these challenges, a collection of cutting-edge techniques were implemented,
    including Mini Batch Discrimination and Denoising autoencoders. The model of AAE
    adopted is a Progressive Growing AAE, which helps achieve more stable training
    of generative models for high-resolution images. The main idea is to start with
    a very low-resolution image and, step by step, add blocks of layers that simultaneously
    increase'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'the output size of the generator model and the input size of the discriminator
    model until the desired size is achieved. In this case, the desired size is 224
    × 224 pixels.


    The latent space dimension is kept fixed, so the discriminator always takes as
    input tensors of the same size. The incremental addition of the layers allows
    the Progressive Growing AAE to first learn large-scale structure and progressively
    shift the attention to finer detail. This approach greatly reduces mode collapse
    and enables the generation of varied and high-quality synthetic skin lesion images.


    The customization of the AAE is necessary to make it usable for the complex image
    classification task addressed by the ResNet classifier. After a thorough fine-tuning
    of all three network structures (encoder, decoder, and discriminator), the Progressive
    Growing AAE with 256 latent features achieves a reconstruction error measure through
    RMSE that ranges from 0.08 to 0.24 depending on whether the most common or the
    rarest skin lesion class is considered. This customization allows ABELE to generate
    meaningful explanations and can be tested in a survey involving real participants.


    ![](img/46da2aabc253ed283db238584dfa3d21_78_0.png)


    ![](img/46da2aabc253ed283db238584dfa3d21_78_1.png)


    Figure 5. A user visualization module to present the classification and the corresponding
