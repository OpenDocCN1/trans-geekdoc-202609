    # Sensitivity


    As shown in Table 1, Logistic Regression and Random Forest maintained perfect
    sensitivity (1.00 ± 0.00) across all iterations, clearly outperforming the other
    models. SVM showed strong but slightly lower sensitivity (0.95 ± 0.00). XGBoost
    and AdaBoost were the least stable, with sensitivity ranging from 0.67 to 1.0,
    and a large standard deviation of ±0.30, indicating inconsistency across iterations.


    # Specificity


    Regarding specificity, presented in Table 1, AdaBoost achieved perfect specificity
    (1.00 ± 0.00), followed by XGBoost (0.97 ± 0.10), Logistic Regression and SVM
    (0.97 ± 0.10), and Random Forest (0.93 ± 0.13). However, AdaBoost displayed the
    highest variance, with performance fluctuating significantly. Logistic Regression,
    in contrast, maintained a consistent specificity with lower variance, reinforcing
    its reliability.


    # F1 Score


    As shown in Table 1, Logistic Regression exhibited the most consistent performance
    with F1 scores of 0.99 ± 0.04 (CI: 0.95–1.00), reflecting robust model behavior.
    SVM and Random Forest also performed well (both at 0.97–0.99) with minor fluctuations.
    XGBoost had a lower mean F1 score (0.89 ± 0.30), and AdaBoost showed the most
    variability (0.90 ± 0.30), occasionally dipping below 0.90. Among the classifiers,
    Logistic Regression was the most stable, making it a potentially more reliable
    choice for miRNA-based classification tasks.


    # AUC


    As shown in Table 1, AUC values for Logistic Regression remained nearly perfect
    (0.99 ± 0.10, CI: 0.99–1.00) across iterations, indicating high and consistent
    discriminatory power. SVM and Random Forest also showed strong AUC values (0.99
    ± 0.03). XGBoost and AdaBoost exhibited more variability, though both reached
    a maximum AUC of 1.00 in certain iterations.


    Overall, Logistic Regression demonstrated the most consistent and robust performance
    across accuracy, sensitivity, specificity, F1 score, and AUC. In contrast, AdaBoost
    exhibited the most unstable results, often lagging behind other models in terms
    of accuracy, sensitivity, and specificity. These results suggest that Logistic
    Regression may be the most suitable model for miRNA-based Usher syndrome classification,
    offering reliable performance with minimal fluctuations across different iterations
    of the LPOCV process.


