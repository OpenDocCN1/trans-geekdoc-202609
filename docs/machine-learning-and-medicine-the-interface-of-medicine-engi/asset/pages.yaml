  img_proc: true
- pgno: 54
  md: 'The measures precision, specificity, and sensitivity can be calculated based
    on the elements of the confusion matrix as shown in [17–19]. The measures specificity
    and sensitivity provide information on how the model predicts both classes of
    the dataset. The high values of these measures confirm the efficiency of the model.
    The accuracy provides an insight into the overall performance of the classification
    models. In this study, we adhere to the standard formulas for classification evaluation
    [17–19].


    Using these measures, we compare our methodology to existing ones. We show that
    our methodology may outperform other existing machine learning algorithms, while
    producing competitive results to deep learning algorithms. The advantages are
    simplicity, easy interpretation of the results, and improved model performance.


    Next section describes the proposed methodology on the PIMA Indian diabetes dataset.
    The results section details the results of our experiments in terms of model quality
    and considering other papers on this dataset, while Section 4 concludes.


    # 2. Materials and Methods


    Our methodology is applied on the public PIMA Indian diabetes dataset from [1,20].
    The dataset contains 768 observations and 9 variables for female patients from
    Arizona, USA. The dataset consists of nine medical variables (predictors) and
    one target variable. The target variable for the dataset represents 268 observations
    that are positives for diabetes. They are denoted by value ‘1’ whereas value ‘0’
    is used for negative results for diabetes observations. The number of negative
    observations is 500. This dataset is representative of the class imbalance problem
    in the ML theory and practice [21–23]. Class imbalance is an issue in classification
    problems where the target variable has one class dominating over the other [23].
    The structure of the PIMA dataset demonstrates heavy class imbalance as the label
    ‘0’ is the predominant class, accounting for about 2/3s of the observations in
    the target variable. Therefore, the prediction of diabetes in the PIMA dataset
    is sensitive to class imbalance, which needs to be handled using appropriate tools.


    This paper presents a novel methodology for handling the class imbalance issue
    in the PIMA dataset. To interpret the results from the novel methodology, we also
    run experiments with the classical methodology The first methodology models the
    original observations without preprocessing them for class imbalance. Class imbalance
    is handled using the built-in parameter in Python called “class_weight” = balanced.
    This is a standard tool to handle class imbalance without preprocessing the data.
    This is the classical approach. The second methodology introduces novel steps
    for data preprocessing to handle the class imbalance in the target variable before
    applying a classification model. The novelty in our methodology lies in resampling
    and shuffling the data as a preprocessing step prior to cross validation and model
    fitting. The classical methodology is tested with k-fold cross validation, while
    the proposed methodology is run by k-fold and stratified k-fold cross validation.


    K-fold cross validation is the most often used validation strategy. However, it
    is suitable for large datasets with no class imbalance. Some authors [16,18] argue
    that k-fold cross validation can be appropriate for datasets with class imbalance
    only if the dataset is large enough. The definition of ‘large enough’ is not provided
    but the PIMA dataset has less than 1000 observations, so it may be considered
    a ‘small’ dataset. As the definitions of ‘small’ and ‘large’ datasets are not
    clear, we test the proposed methodology with both k-fold cross validation and
    stratified k-fold cross validation. The aim is to understand which cross validation
    strategy is better for the PIMA dataset.


    Another advantage of the proposed methodology is the unique combination of (1)
    re-sampling and shuffling, (2) setting ‘class_weight’ = ‘balanced’, and (3) using
    (stratified)'
