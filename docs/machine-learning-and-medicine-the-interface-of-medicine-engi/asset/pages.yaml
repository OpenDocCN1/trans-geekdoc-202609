    In addition to the inherent complexity of this task, focusing on medical text
    generation necessitates the analysis and proposal of additional chest-RRG-oriented
    metrics based on NLP models. Exploring novel methods to assess the reference report
    against an estimated one can facilitate a more comprehensive evaluation of state-of-the-art
    models. Our study demonstrates the utility of F1cXb in verifying whether generated
    reports discuss patholo-'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'gies present in the reference reports. Furthermore, F1RG_ER ensures that the
    present, absent, and unknown pathologies are correctly related in the reports.
    Considering these findings, these two metrics are essential for model comparison.
    Although these metrics effectively and efficiently enhance RL training, models
    frequently produce reports with incomplete sentences. This deficiency is evident
    in numerous state-of-the-art proposals, and despite the efficacy of TA, it still
    occurs occasionally. It is evidenced at the end of the third report in Table 4.
    This phenomenon arises from models learning that specific syntactic structures
    can benefit chest RRG-oriented metrics like F1RG_ER, even if they do not constitute
    syntactically correct sentences. Moving forward, we advocate for further research
    into novel metrics using alternative deep learning algorithms, such as LLMs like
    GPT-4 [50] or LLaMA [51].


    Several aspects of the proposed approach for real-world RRG scenarios merit attention,
    including multilinguage support, standardization of reports, and improvements
    in picture archiving and communication systems (PACS). Since the decoder model
    primarily operates with English words, it encounters specific difficulties when
    used in other languages. Thus, it would be necessary to remove the last layer
    of the decoder model and adjust it based on the desired language; however, the
    rest of the model remains language-independent. Another challenge lies in the
    lack of standardization in report writing across different institutions, leading
    to variations in reporting guidelines. Consequently, RRG models can assist in
    integrating new reporting guidelines to standardize and unify databases for RRG.
    Furthermore, our approach can enhance PACS, which are commonly used in healthcare
    for securely storing and transmitting electronic images and clinical reports.
    Collaborating with expert radiologists, we can integrate RRG models to streamline
    processes within PACS, such as preparing automatic draft reports that radiologists
    can interactively correct. This approach can improve diagnostic efficiency and
    expert assistance times while enhancing the standardization and homogenization
    of reports.


    The strengths and weaknesses of our model have been highlighted using different
    metrics. However, another essential aspect to analyze is the integration of the
    proposed workflow into the clinical setting. Given that the system relies on a
    VED deep learning model, its deployment only requires a computer with a GPU with
    at least 12 GB of memory. The model specializes in chest radiographs from different
    position views, such as antero- posterior, lateral, posteroanterior, and lateral
    decubitus. Therefore, it can integrate and analyze a wide variety of chest radiographs.


    The scope of this work is focused on chest radiographs. However, our approach
    is not limited solely to its application in chest radiographs. The proposed approach
    is flexible and independent, allowing it to be applied to other radiological scenarios.
    Therefore, our approach can be seamlessly adapted for radiographs of different
    body parts. The only aspect requiring modification is the reward optimization
    during RL training. Since F1RG_ER primarily specializes in chest-related pathologies,
    this metric should be replaced with another relevant to the radiological scenario
    where our approach is intended for application. The remaining components, such
    as the encoder, decoder, TA, and decoding strategies, are independent of the radiological
    scenario. Despite the flexibility and independence of the approach, the major
    limitation for application to other radiological scenarios depends on the availability
    of training data. Acquiring large datasets to train VED models is crucial for
    improving the quality of reports and enhancing their applicability to different
    scenarios.


    # 5. Conclusions


    Chest RRG poses a challenge due to the limited data availability and the diverse
    nature of medical reports and variations in pathology expressions. Four transformer-based
    models were analyzed, highlighting the encoder as the key component, with SwinB
    being the best choice. This transformer encoder has not been previously explored
    in RRG. Regarding the decoder, a word-based approach trains faster and achieves
    more competitive results than a subword-based one.


    Techniques like image data augmentation, hard negative mining, and TA were introduced.
    TA was shown to be an effective method to improve generalization and the quality'
