    Moreover, Tables 4 and 5 present performance metrics, including F1 score, MCC,
    DYI, and Kappa values, for the ML methods applied. The observed values provide
    insights into the models'' effectiveness in classifying SLE patients. Thus, in
    Table 4 (variables IgG, IgG2, IgG3, and IgG4), RF consistently outperforms again
    other methods across all metrics, exhibiting high F1 score, MCC, DYI, and Kappa
    values. This suggests RF''s robustness in achieving a balanced trade-off between
    precision and recall, capturing the model''s ability to handle both positive and
    negative instances effectively. Again, KNN also shows competitive performance,
    while SVM, BLDA, and DT demonstrate slightly lower performance across these metrics,
    being LR the one which obtained the lowest performance values. Similar trends
    are observed in the variables related to immune cell types in Table 5 (IgM, NK,
    CD19, and CD3), where RF again demonstrates superior performance, especially notable
    in achieving high F1 score and DYI values. This reinforces RF''s suitability for
    SLE classification, indicating its ability to maintain a balance between true
    positives, true negatives, false positives, and false negatives. KNN also perform
    well, but RF consistently stands out as the top-performing model across the diverse
    set of variables.


    For a comprehensive view of the trade-off between the true/false positive rates
    between the proposed system and other ML methods, the Receiver Operating Characteristic
    (ROC) curves were also generated. With this purpose in mind, the ROC curve is
    employed to quantify sensitivity and 1-specificity at various threshold levels.
    As illustrated in Figure 2, which shows the ROC curve for CD19 variable as example,
    the system that utilizes RF generates the largest area under the curve, indicating
    a superior level of predictive accuracy.'
