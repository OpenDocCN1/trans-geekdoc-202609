- pgno: 150
  md: 'The methodology begins with the input of a miRNA expression dataset, which
    contains both the samples and the associated features necessary for classification.
    The first step involves initializing key variables: N, the number of samples;
    F, the number of miRNA features; and an empty set called 𝐹minimal to store the
    minimal set of miRNA features identified during the analysis. Additionally, a
    variable 𝑀∗ is initialized to hold the best-performing model after evaluation.
    Two sets are initialized to facilitate the nested cross-validation process: outer
    training sets, which consists of the outer training sets (T1, T2, …, Tp), and
    validation sets, which includes the corresponding validation sets (V1, V2, …,
    Vp).


    The second step involves executing Leave-P-Out Cross-Validation (LPOCV) as shown
    in Figure 2, where the input data are divided into outer training and validation
    sets. This method generates multiple splits, with each outer training set (Ti)
    containing 90% of the total data, while the corresponding validation sets (Vi)
    consist of the remaining 10%. This process ensures that each instance in the dataset
    is eventually used for validation, providing a robust evaluation framework for
    model performance.


    In the third step, the focus shifts to the inner cross-validation and feature
    selection process. For each outer training set Ti, stratified k-fold cross-validation
    is employed to further divide the data. As shown in Figure 2, each outer training
    set (Ti) is split into multiple inner training sets (t1, t2, …, ti) and corresponding
    inner test sets (v1, v2, …, vi). Feature selection is then performed on each inner
    training set using various methods, such as Recursive Feature Elimination (RFE),
    Random Forest (RF) feature importance, LASSO, and the k-best method using the
    ANOVA F-score as the statistical indicator to rank features based on their discriminative
    power. Simultaneously, different classifiers, including Logistic Regression (LR),
    Random Forest (RF), Support Vector Machines (SVM), Extreme Gradient Boosting (XGB),
    and AdaBoost (ADB), are trained on these inner training sets. The performance
    of each model is evaluated against its corresponding inner test set using key
    metrics like accuracy, sensitivity, specificity, F1 score, and AUC. The model
    that achieves the best mean performance across all metrics for the current outer
    training set is designated as 𝑀∗. In addition to that, miRNA features that consistently
    appear at least 3 times across all iterations are appended to the 𝐹minimal.


    The final step involves validating the selected model and feature set. For each
    validation set Vi, the 𝑀∗ identified from the inner cross-validation is used to
    perform classification, utilizing the minimal miRNA feature set derived from the
    previous step. The performance of this model is then evaluated on the validation
    sets using the same metrics: accuracy, sensitivity, specificity, F1 score, and
    AUC.


    Ultimately, the output of this comprehensive methodology includes the minimal
    miRNA feature set consistently selected across all inner k-folds, the best-performing
    model based on mean performance across all inner train and test sets, and the
    mean metrics of this best model evaluated against the validation sets. This structured
    approach ensures a thorough and reliable framework for identifying significant
    miRNA features and achieving accurate classification outcomes.


    # 3.6. Finding Enriched Pathways


    # 3.6.1. miRNA Gene Target Prediction


    TargetScanHuman version 8.0 was used to predict genes with binding sites matching
    the 10 miRNAs from the model, resulting in 6115 genes with matching miRNA target
    sites [50]. Of these, 572 gene targets had cumulative weighted context scores
    (CWCS) less than −0.5, indicating strong gene suppression. All 6115 unique gene
    targets were included in gene ontology enrichment analysis and metabolic pathway
    analysis [50].'
