    # 4.1.2. Cox Proportional Hazards Regression Model


    The proportional hazards model, developed by David Cox in 1972 [38], uses the
    proportional risks assumption to produce reliable estimates of covariate effects.
    The Cox proportional hazards regression model is a semi-parametric approach for
    estimating weights in a proportional hazard model. It uses gradient descent to
    fit the data and minimizes errors. The model works by estimating the log hazard
    of patients as a linear function of their static covariates and a population-level
    baseline hazard function that changes over time [24]. It can be defined mathematically
    as Equation (17).


    ```

    E(d|e) = h_0(d) exp \left( \sum_{n=1}^e y_n(e_n) \right) (17)

    ```


    where


    +   - d represents survival time;

    +   - E(d|e) represents the hazard function determined by a set of factors, i.e.,
    e1, e2, e3, ... en;

    +   - h_0(d) defines the baseline hazard function representing event probability
    when all covariates are zero. Hazard value equals 1 when all e_n are zero. The
    model assumes a parametric form for covariates’ effect on hazard without baseline
    assumptions;

    +   - exp \left( \sum_{n=1}^b y_n(e_n) \right) represents partial hazard as a
    time-invariant scalar factor that increases or decreases baseline hazard like
    the intercept in ordinary regression;

    +   - The coefficients (y1, y2, y3, ..., yn) measure the impact of covariates
    on a subject’s hazard. The sign of the coefficient b affects the baseline hazard.
    A positive sign indicates higher risk, whereas a negative sign indicates lower
    risk. The magnitude of the coefficient b is estimated by maximizing partial likelihood.
    It assumes a proportional rate ratio throughout the study period, offering increased
    flexibility. This model can handle right-censored data but not left-censored or
    interval-censored data directly.

    +   The Cox model accepts the following three assumptions:


    +   1. A constant hazard ratio;

    +   2. The multiplicativity of explanatory variables;

    +   3. The independent failure times for individual subjects.


