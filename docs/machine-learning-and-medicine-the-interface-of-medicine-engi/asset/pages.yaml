    a fairly small dataset of roughly 450 patients including pre- and post-operative
    factors, we aim to develop Explainable AI models with the objective of answering
    a number of questions regarding the effect of liver transplantation on patients
    [52]. Using explanations as a lens to inspect the models, we are going to investigate
    possible effects on the onset of diabetes, patient survival, and graft survival.
    The key challenges involve the highly imbalanced dataset, with the survival rate
    significantly higher than mortality, and the low number of samples. We plan to
    apply data balancing techniques cautiously to maintain the integrity of real-world
    examples so that Explainable AI techniques can still extract meaningful insights
    from the predictive models. The ultimate goal is to identify key factors contributing
    to survival rates and understand the relationship between a patient’s diabetic
    condition and survival outcome, thereby offering physicians a way to find new
    and actionable insights.


    # 6.4. DoctorXAI++


    DoctorXAI [28] has been proven to be highly beneficial to clinicians for understanding
    a machine learning model’s decision and for improving trust in the model output
    [33]. The various components of the DoctorXAI architecture, however, can be improved,
    in light of recent advancements in the model’s performance and in generative AI
    techniques. This project has the objective of improving DoctorXAI by applying
    more modern deep learning models to the updated MIMICIV [53] dataset with the
    ICD10 ontology. The initial experiments we have performed in this direction have
    the objective of investigating the synthetic neighborhood generation mechanism
    of DoctorXAI, improving it with the use of Large Language Models (LLMs), trained
    to approximate the original data distribution. LLMs show the potential of learning
    the original ontology directly from the data. This may indicate that LLMs can
    be used both to perform predictions and to replicate ontology-based'
