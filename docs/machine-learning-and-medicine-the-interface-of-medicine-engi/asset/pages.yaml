  md: '# An Effective Methodology for Diabetes Prediction in the Case of Class Imbalance


    BorisIva Toleva 1, Ivan Atanasov 1, Ivan Ivanov 1,* and Vincent Hooper 2


    +   1 Faculty of Economics and Business Administration, Sofia University, St.
    Kl. Ohridski, 1113 Sofia, Bulgaria; vrigazova@uni-sofia.bg (B.T.); iv.atanasov89@gmail.com
    (I.A.)

    +   2 SP Jain Global School of Management, Academic City, Dubai P.O. Box 502345,
    United Arab Emirates; vincent.hooper@spjain.org

    +   * Correspondence: i_ivanov@feb.uni-sofia.bg


    Abstract: Diabetes causes an increase in the level of blood sugar, which leads
    to damage to various parts of the human body. Diabetes data are used not only
    for providing a deeper understanding of the treatment mechanisms but also for
    predicting the probability that one might become sick. This paper proposes a novel
    methodology to perform classification in the case of heavy class imbalance, as
    observed in the PIMA diabetes dataset. The proposed methodology uses two novel
    steps, namely resampling and random shuffling prior to defining the classification
    model. The methodology is tested with two versions of cross validation that are
    appropriate in cases of class imbalance—k-fold cross validation and stratified
    k-fold cross validation. Our findings suggest that when having imbalanced data,
    shuffling the data randomly prior to a train/test split can help improve estimation
    metrics. Our methodology can outperform existing machine learning algorithms and
    complex deep learning models. Applying our proposed methodology is a simple and
    fast way to predict labels with class imbalance. It does not require additional
    techniques to balance classes. It does not involve preselecting important variables,
    which saves time and makes the model easy for analysis. This makes it an effective
    methodology for initial and further modeling of data with class imbalance. Moreover,
    our methodologies show how to increase the effectiveness of the machine learning
    models based on the standard approaches and make them more reliable.


    Keywords: class imbalance; classification; cross validation; resample; shuffle


    # 1. Introduction


    The topic of diabetes disease prediction has been an extremely popular topic lately.
    Diabetes causes an increase in the level of blood sugar, which leads to damage
    to various parts of the human body. Many researchers collect medical data on the
    physiological, social, and environmental factors that would cause diabetes. These
    data are used not only for providing a deeper understanding of the treatment mechanisms
    but also for predicting the probability that one might become sick. This prediction
    is important for reversing the course of the possible development of diabetes
    by adjusting the related factors that impact the individual. Therefore, diabetes
    prediction can be crucial not only for decreasing the number of cases but also
    for developing a better clinical approach for the individual based on the specifics
    of their case.


    The aim of the article is to propose a novel methodology for predicting whether
    an individual would develop diabetes over time given a set of biological and social
    indicators. The proposed algorithms create effective classification models to
    predict the risk of diabetes.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'The proposed methodology works on public clinical data on diabetes in the women
    of the PIMA Indians dataset [1]. Our results outperform other existing research
    and extend the practical tools for researchers to provide a holistic approach
    for each patient. Based on the predictions, public healthcare specialists can
    create and implement specific strategies for the prevention and treatment of diabetes.


    Predicting the risk of diabetes using novel computing techniques has been an expanding
    topic in academic literature with practical applications in medicine. Many of
    these techniques are centered around the application of Machine Learning (ML)
    models are the decision tree, support vector machines (SVM), Random Forest (RF)
    and Naive Bayes (NB) models [2]. For example, Traymbak et al. [3] used SVM to
    model the PIMA diabetes dataset and achieved a high classification accuracy of
    73.86%, sensitivity of 83%, and specificity of 56.60%. In more advanced cases,
    deep learning techniques are applied to grasp the underlying complexity of the
    data and the connections among them [2]. The selection of the classification algorithm
    depends on the complexity of the data. The most common dataset for ML and deep
    learning experiments is the PIMA Indian diabetes dataset although other datasets
    exist as well [1]. An effective approach is to apply the ensemble and bagging
    methods for handling class imbalance in machine learning for healthcare datasets
    [4,5]. The high results emphasize the role of ensemble and bagging methods in
    enhancing model performance on classification models with imbalanced datasets.


    For example, the RF classifier with feature selection has been applied to the
    PIMA diabetes dataset by Zou et al. [6]. They have concluded that the Random Forest
    model after the feature reduction achieves the best accuracy of 77.4% for the
    PIMA dataset. The same authors applied the RF model to another clinical dataset
    about diabetes—the Luzhou dataset. Random Forest confirms the efficiency with
    an accuracy value of 80.8% for the Luzhou dataset. Zhou et al. [7] have also worked
    on the PIMA dataset. They built an ensemble learning model based on the Boruta
    feature selection. The authors have applied the grid search approach to optimize
    the parameters of the proposed model. The accuracy they achieve is 98.0%. Machine
    learning models such as linear discriminant analysis (LDA), k-nearest neighbors
    (kNN), and Adaboost have also been applied for diabetes prediction by Traymbak
    et al. [3]. Different methodologies are commented on and compared with effective
    applications to healthcare modeling and prediction [8–11]. A detailed study on
    the application of SMOTE-based machine learning algorithms to predict diabetes
    can be found in [8,9]. In addition, Wu et al. [10] have applied machine learning
    modeling for imbalanced datasets based on the local interpretable model-agnostic
    explanation (LIME). In fact, LIME is applied to each sample independently and
    estimated. Then, conclusions are extended to the dataset.


    Deep neural networks (DNN) are often used in complex cases. Deep neural networks
    are a deep learning algorithm. They combine the advantages of both deep learning
    and neural networks. Deep neural networks significantly increase the capabilities
    and quality of models applied in artificial intelligence, including diabetes prediction.
    Often deep learning algorithms outperform machine learning algorithms due to their
    flexibility and ability to capture and model more complex data structures including
    such in the PIMA diabetes dataset [2,12–16].


    Regardless of the methodology selected, model estimation is a critical step in
    evaluating the performance of a classification model, especially when working
    with imbalanced data like the PIMA dataset. The standard tools for evaluating
    model performance are the confusion matrix and classification metrics like accuracy,
    precision, specificity (recall), sensitivity, and F1 score [17–19]. The confusion
    matrix provides insights into the extent to which the two classes are correctly
    predicted. The elements of the confusion matrix are denoted as true positive (TP),
    false positive (FP), true negative (TN), and false negative (FN).'
