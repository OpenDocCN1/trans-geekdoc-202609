  md: '# 4.1.1. Kaplan–Meier Estimator


    One of the most popular statistical methods used to estimate the likelihood of
    an event, such as death, a recurrence of a disease, the emergence of a new disease
    entity, or an adverse response, is survival analysis [37]. First, we need to understand
    the survival function to understand survival analysis. For example, consider Y
    as the random duration taken from the dataset under study as a duration that can
    be infinite but not a negative value, and the survival function can be denoted
    as Pro(ti), where Pro(ti) denotes the probability that an event has occurred or
    not yet at a time ti. It denotes the survival function calculated as Equation
    (15).


    Pro(ti) = x(Y > ti)


    The survival analysis can be achieved using the Kaplan–Meier estimator. Re-estimating
    the survival probability upon each event occurrence can be achieved using the
    Kaplan–Meier (KM) approach. This non-parametric method does not assume a specific
    distribution for the outcome variable, such as time. This approach is very simple,
    and complexity arises as the number of observations increases. We can say that
    the main idea of the KM approach, depending on the observed event time, is to
    split the estimation of the survival function into small chunks. The probability
    for each interval can be formulated using the following Equation (16):


    Pro(ti) = \prod_{tia<t} \frac{Z_{(a-c_a)}}{Z_a}


    where za denotes the number of patients whose lives are at risk at time tia, and
    ca denotes the number of incidents that occurred in the event at a time tia (See
    Figure 5). Figure 5 shows the overall survival analysis of patients. We find the
    overall survival probability with significance (p-value is 0.05) of patients after
    diagnosing SKCM. The graph shows a higher probability of survival beyond the age
    of 20 and less than 20 years.


    ![](img/46da2aabc253ed283db238584dfa3d21_128_0.png)


    Figure 5. Overall survival (OS) analysis.


    Figure 6 shows the survival probabilities of patients. We find that male patients
    have a higher probability than female patients. The male patients aged 20 years
    and below have higher (about 0.8 or 80%) survival probability. Above 80 years
    and somehow below 80 years, patients have less about (0.2 or 20%) of survival
    probability.'
