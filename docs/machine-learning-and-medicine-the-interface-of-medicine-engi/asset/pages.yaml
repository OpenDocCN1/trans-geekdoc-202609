  md: 'than its subword-based counterpart. This finding contrasts with strategies
    commonly employed in current large language models (LLMs). However, this discrepancy
    can be attributed to the inherent variability and scarcity of data in the chest
    RRG task. Furthermore, our ablation study underscores the critical role of TA
    in effectively leveraging data for this task, demonstrating substantial improvements
    in metrics over strategies like image augmentation or HNM.


    A prevalent issue in RRG proposals is the high repetition and monotony frequently
    encountered in reports generated by other state-of-the-art approaches. Typically,
    models tend to converge to a local minimum, yielding nearly identical standardized
    reports across most patients. This phenomenon arises as deep learning algorithms
    settle at a midpoint where the generated reports broadly apply to most cases.
    These reports adhere to a template naming common pathologies in a fixed order
    and syntactic structure, irrespective of the patient. Consequently, this pattern
    results in reports of dubious quality, often overlooking less common pathologies,
    thereby undermining the reliability of diagnostic models.


    Given the high repetition and monotony in the generated reports of state-of-the-art
    models, we propose an analysis of report diversity using N-grams in the MIMIC-CXR
    test set. This analysis allows for measuring diversity by examining the number
    of unique N-grams present in generated reports, as illustrated in Figure 2. Specifically,
    we compare reports generated by our model with those produced by the approach
    presented in Delbrouck et al. [12], acknowledged for being the most competitive
    proposal in the field, as outlined in Table 3. The graph illustrates a notably
    greater diversity in our generated reports compared to those of the Delbrouck
    et al. [12] model. Moreover, our model achieves a diversity difference averaging
    nearly three times their model.


