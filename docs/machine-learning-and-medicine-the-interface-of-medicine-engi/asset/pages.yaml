    # 4. Discussion


    This study presents an efficient workflow for training VED models explicitly designed
    for chest RRG. This workflow demonstrates remarkable performance in chest-RRG-oriented
    metrics. One pivotal finding lies in our analysis of the proposed architectures,
    where we show that utilizing the SwinB encoder yields superior radiograph representations.
    Notably, the word-based approach proves more competitive in the decoder component'
