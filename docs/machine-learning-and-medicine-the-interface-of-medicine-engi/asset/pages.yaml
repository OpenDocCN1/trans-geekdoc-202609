  img_proc: true
- pgno: 113
  md: 'of the generated reports regarding variability, quality, factual correctness,
    and completeness, which yields a model that outperforms the state of the art.
    Moreover, this approach paves the way for new TA approaches based on augmentation
    with more complex NLP techniques, such as LLM models.


    Additionally, NLG-oriented metrics may not be optimal for measuring report quality,
    as they compare sentences and words without considering semantic meaning or alternative
    expressions of the same diagnosis. Thus, metrics based on NLP models specialized
    in chest radiology reports like F1cXb and F1RG_ER appear to be crucial in evaluating
    report quality.


