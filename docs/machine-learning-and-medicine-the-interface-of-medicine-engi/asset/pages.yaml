    y variable is transformed into categories to facilitate analysis.


    Step 2: Data shuffling—the indices of all independent variables (X) and the target
    variable (y) have been shuffled so that their place in the dataset is rearranged.
    To perform the shuffle a seed of 99 is set and the numpy command np.random_permutations
    is used as shown below:


    ```

