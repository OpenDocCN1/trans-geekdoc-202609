- pgno: 43
  md: '# Exploring Diagnostic Precision and Triage Proficiency: A Comparative Study
    of GPT-4 and Bard in Addressing Common Ophthalmic Complaints


    Roya Zandi 1, Joseph D. Fahey 1, Michael Drakopoulos 1, John M. Bryan 1, Siyuan
    Dong 2, Paul J. Bryar 1, Ann E. Bidwell 1, R. Chris Bowen 1, Jeremy A. Lavine
    1 and Rukhsana G. Mirza 1,*


    +   1 Department of Ophthalmology, Feinberg School of Medicine, Northwestern University,
    Chicago, IL 60611, USA

    +   2 Division of Biostatistics, Department of Preventive Medicine, Feinberg School
    of Medicine, Northwestern University, Chicago, IL 60611, USA

    +   * Correspondence: r-mirza@northwestern.edu


    Abstract: In the modern era, patients often resort to the internet for answers
    to their health-related concerns, and clinics face challenges to providing timely
    response to patient concerns. This has led to a need to investigate the capabilities
    of AI chatbots for ophthalmic diagnosis and triage. In this in silico study, 80
    simulated patient complaints in ophthalmology with varying urgency levels and
    clinical descriptors were entered into both ChatGPT and Bard in a systematic 3-step
    submission process asking chatbots to triage, diagnose, and evaluate urgency.
    Three ophthalmologists graded chatbot responses. Chatbots were significantly better
    at ophthalmic triage than diagnosis (90.0% appropriate triage vs. 48.8% correct
    leading diagnosis; p < 0.001), and GPT-4 performed better than Bard for appropriate
    triage recommendations (96.3% vs. 83.8%; p = 0.008), grader satisfaction for patient
    use (81.3% vs. 55.0%; p < 0.001), and lower potential harm rates (6.3% vs. 20.0%;
    p = 0.010). More descriptors improved the accuracy of diagnosis for both GPT-4
    and Bard. These results indicate that chatbots may not need to recognize the correct
    diagnosis to provide appropriate ophthalmic triage, and there is a potential utility
    of these tools in aiding patients or triage staff; however, they are not a replacement
    for professional ophthalmic evaluation or advice.


    Keywords: artificial intelligence; ophthalmology; triage; chatbots; ChatGPT; bard;
    large language models


    # 1. Introduction


    Conversational artificial intelligence (AI) chatbots have gained significant momentum
    over the last few years. OpenAI’s Chat Generative Pre-trained Transformer (ChatGPT),
    released November 2022, and Google’s Bard, launched March 2023, are two chatbots
    that are publicly available. These systems use large language models (LLMs) to
    process and generate text similar to human language. LLMs constitute a growing
    field of technology where computer models are pre-trained on large-scale data
    to then be adapted to a variety of tasks [1]. While there are several LLMs available
    today, this work will focus its efforts on ChatGPT and Bard due to their widespread
    presence and public availability. There are a few key operational differences
    between the two systems. Namely, ChatGPT uses GPT-3.5 or GPT-4 chatbot models,
    whereas Bard uses PaLM 2 (Pathways Language Model 2). In addition, Bard draws
    its data live and directly from Google, whereas ChatGPT operates based on data
    from 2021, and must search papers to gather information [2,3].


    These powerful tools are increasingly being considered for efficiency improvements
    across medicine, including in such applications as supporting clinical practice,
    scientific writing, image analysis, or immediate medical advice [4,5]. However,
    they are not without risk. It has been noted that LLMs can produce biased or harmful
    content due to the vast variability in quality of the data used to power them;
    in medicine in particular, the quality of'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'chatbot output is of concern as it relates to patient care [6]. There has recently
    been a strong interest in exploring the capabilities of these LLMs in medicine.
    Early work demonstrated that OpenAI’s GPT-3.5 performed at or near passing for
    all three exams in the United States Medical Licensing Exam (USMLE) series [7].
    With newer iterations, GPT-4, released March 2023, was found to outperform GPT-3.5
    in correctly answering USMLE questions involving communication skills, ethics,
    empathy, and professionalism [8]. More recent studies have compared GPT-4 and
    Bard in their performance of answering board-style questions in various subspecialties,
    and these showed that GPT-4 was superior to Bard [9–11]. Within ophthalmology,
    there has been an interest as well, where in one study GPT-4 demonstrated an excellent
    performance, significantly better than GPT-3.5, in answering practice questions
    to the Ophthalmology Knowledge Assessment Program (OKAP) examination [12].


    As AI chatbots evolve, become more widely used by the general population, and
    are integrated into common internet search engines, it is increasingly imperative
    to assess their role in the patient care journey. It is a well-established trend
    that patients look to the internet for seeking information about their health
    [13,14] and often turn to the internet first for health advice before contacting
    health professionals [15,16]. Moreover, patients often have long wait times when
    they do contact their health providers, which is especially true in ophthalmology.
    A recent study projected that there will be a sizable shortage of ophthalmologists
    relative to demand by the year 2035 [17], with limited ophthalmology coverage
    in emergency departments, especially in rural settings [18]. As a result, non-ophthalmology
    providers, busy triage call centers, and patients may begin to look to technological
    solutions such as AI chatbots that can support addressing ophthalmic complaints
    and triage. It is therefore critical that the strengths and potential risks of
    these tools are evaluated thoroughly.


    Recent studies have begun to explore the capabilities of AI chatbots as ocular
    symptom checkers or ophthalmic triage tools. Specifically, Pushpanathan et al.
    investigated accuracy and quality of responses (without examining triage capabilities)
    for GPT-3.5, GPT-4, and Bard in answering direct questions about specific ocular
    symptoms and found that GPT-4 had the highest accuracy [19]. Lim et al. benchmarked
    performance of ChatGPT and Bard for myopia-related queries specifically, and also
    found that GPT-4.0 had superior accuracy [20]. Lyons et al. compared the triage
    capabilities of GPT-4, Bing Chat, and WebMD Symptom Checker with ophthalmology
    trainees across 24 ophthalmic diagnoses. Notably, GPT-4 performed comparably with
    the trainees in diagnostic and triage accuracy [21].


    In this work, we aimed to evaluate and compare GPT-4 and Bard in their responses
    to commonly encountered ophthalmic complaints corresponding to 40 clinical diagnoses
    in the form of simulated patient vignettes with targeted questions about proposed
    diagnoses and triage recommendations. We additionally analyzed how prompt descriptiveness
    impacts response quality with the aim to better understand how they would best
    be used in future patient-oriented settings. As we gain a better understanding
    of the values and limitations of this technology, we can move closer to determining
    how conversational AI can potentially be implemented in day-to-day society for
    meeting the demands of delivering timely, accurate, and safe ophthalmic health
    information for patient use and decision making.


    # 2. Materials and Methods


    The Northwestern University Institutional Review Board determined that this in
    silico research did not involve human subjects. At the time of data collection,
    GPT-4 was publicly available by paid subscription through ChatGPT Plus, and Bard
    was freely accessible.


    # 2.1. Creation of Simulated Patient Prompts in Ophthalmology


    We systematically constructed common scenarios encountered in ophthalmology from
    the perspective of a patient. Forty common diagnoses, including “cannot miss diagnoses”
    [22], were identified and distributed evenly among four groups of ophthalmic specialties:
    anterior segment/glaucoma, neuro-ophthalmology, pediatric ophthalmol-'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'ogy / oculoplastics, and retina. An urgency level to seek care was designated
    for each diagnosis as either same day, urgent (<1 week), or non-urgent (>1 week).
    For each diagnosis, two prompts were created, one with three key clinical descriptors
    and one with five descriptors (Scheme 1). A descriptor was defined as a clinically
    relevant piece of information that addressed any of the following: relevant history,
    onset, duration, laterality, mention of specific ocular anatomy, vision, dyschromatopsia,
    pain, photophobia, visual disturbances, or any other clinical characteristic.
    For each patient scenario, consensus was reached among experienced ophthalmologists
    (P.B., A.E.B., and R.C.B) regarding intended diagnosis and urgency level based
    on expert opinion (Supplemental Tables S1–S4).


    ![](img/46da2aabc253ed283db238584dfa3d21_45_0.png)


    Scheme 1. Flowchart of overall study design of chatbot prompts.


    # 2.2. Input to Artificial Intelligence Chatbots


    The simulated patient prompts were entered into the AI chatbots between 14 June
    2023 and 20 June 2023 using GPT-4 version 2023.05.24 and Bard version 2023.06.07.
    While many chatbots exist, including Microsoft Bing AI, Claude AI, or Meta’s LLaMA,
    we chose these two as they are among the most commonly used and referenced chatbots
    at the time of publication, and they are publicly available. Each prompt was entered
    into the chatbot using a standardized 3-part stepwise approach. First, the simulated
    patient scenario followed by the question “What are the possible causes of this?”
    was entered to the chatbot. The second entry was “Which of these is most likely?”.
    Finally, the third input was “How soon should I seek medical attention?” Chatbot
    history was reset prior to starting each 3-part entry. These sequential questions
    were to ensure that the chatbot addressed a differential diagnosis, leading diagnosis,
    and provided triage recommendations.


    # 2.3. Grading of Chatbot Responses


    To evaluate the response generated by the chatbots, a seven-question questionnaire
    was designed using both a 4-point Likert scale and binary (yes/no) style questions
    (Supplemental Table S5). Prior to grading, chatbot identifiers (e.g., “I’m an
    AI developed by OpenAI”) were removed from chatbot responses to eliminate potential
    grader bias toward'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'a particular chatbot. Two experienced ophthalmologists graded each chatbot
    conversation for accuracy of diagnosis and appropriateness of triage recommendations
    (primary outcomes), as well as relevance of differential diagnosis, satisfaction
    with quality of responses for real patient use, and potential harm that responses
    may pose to real patients (secondary outcomes). A third experienced ophthalmologist
    served as arbiter for any grading disagreements. All graders were blinded to the
    chatbot source. For the purposes of this analysis, responses of 3 or 4 on the
    4-point Likert scale were treated as “agree” and responses of 1 or 2 were treated
    as “disagree” to provide binary data.


    # 2.4. Statistical Analysis


    Descriptive statistics were generated for all variables of interest where frequencies
    along with percentages were reported. To compare the outcomes between ChatGPT
    and Bard, as well as between 5 and 3 descriptors, Pearson’s Chi-squared test or
    Fisher’s exact test was used when appropriate. Sub-analyses for sub-specialty
    categories and urgency levels were conducted using the same method. Logistic regression
    models were applied to the primary outcomes with the degree of detail in prompt
    as the predictor, and the models were fit separately for ChatGPT and Bard. Model
    performance was estimated using Area under Curve (AUC) and receiver operating
    characteristic (ROC) curves. All analyses were conducted using R version 4.3.1.


    # 3. Results


    Eighty unique entries were supplied to both GPT-4 and Bard, resulting in a total
    of 160 chatbot generated responses. 40 entries had 3 prompt descriptors and a
    counterpart 40 entries had 5 prompt descriptors. The 40 diagnoses were broken
    down into four sub-specialty categories (10 general, 10 neuro-ophthalmology, 10
    pediatrics/oculoplastics, and 10 retina) and 3 urgency levels (16 non-urgent,
    13 urgent, and 11 same day) (Scheme 1). The diagnosis rates (i.e., providing the
    correct diagnosis as the stated most likely cause of the patient’s symptoms) for
    GPT-4 and Bard were 53.8% and 43.8%, respectively (p = 0.2). Interestingly, both
    chatbots were significantly better at providing triage recommendations than at
    providing the correct leading diagnosis (GPT-4: p < 0.001, Bard: p < 0.001). The
    rates of generally appropriate triage recommendations for GPT-4 and Bard were
    96.3% and 83.8%, respectively (p = 0.008) (Table 1).


