    # 5. Discussion


    The proposed methodology for biomarker discovery in Usher syndrome integrates
    ensemble feature selection with nested cross-validation to identify a minimal
    set of miRNA biomarkers. This minimal biomarker set represents the smallest subset
    of miRNAs that can reliably distinguish Usher syndrome from control samples. However,
    due to the rarity of Usher syndrome, obtaining large sample sizes remains a challenge,
    which may impact the generalizability of the selected biomarkers. As more data
    become available, this approach is designed to refine and update the biomarker
    set, improving its robustness and biological relevance over time. Future validation
    on larger datasets will enhance its clinical applicability and reliability.


    By employing nested cross-validation, this methodology ensures that dataset partitioning
    into training and validation sets is performed iteratively. The training sets
    undergo additional stratified cross-validation, where multiple validation sets
    are tested to generate stable performance metrics. Compared to single-set validation,
    this process provides more reliable feature selection and performance evaluation.
    The combination of ensemble feature selection and rigorous cross-validation enhances
    the stability of identified biomarkers, ensuring their reproducibility, even with
    limited data.


    Future studies incorporating larger sample sizes will be essential to further
    validate and refine the identified miRNA biomarkers, advancing their potential
    use in early diagnosis and therapeutic targeting of Usher syndrome. The methodology
    leverages LPOCV for the outer loop and stratified k-fold cross-validation for
    the inner loop, ensuring robust biomarker selection.'
