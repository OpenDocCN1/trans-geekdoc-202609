    are an essential part of the analysis of the model quality. They show whether
    each class is predicted correctly and to what extent. A sign for a good model
    is not only high classification metrics (accuracy, precision, sensitivity, and
    specificity) but also the correct prediction of each class. Cases when the classification
    metrics are high, but the confusion matrices show that one of the classes is not
    predicted correctly may be a sign of overfitting. Therefore, we compare our results
    to other authors based on the classification metrics, but the comparison of the
    quality of prediction for each class cannot be done thoroughly. Despite this,
    we achieve similar results to Tables 8 and 12 with a much simpler methodology
    that is not computationally exhaustive and does not require a complex hardware
    setup to run. This finding presents another advantage of the proposed methodology.


    Based on the results above, the key finding is that the proposed methodology is
    competitive with other existing machine learning and deep learning algorithms.
    In some cases, the proposed methodology can outperform existing ML algorithms,
    while having similar performance to deep learning algorithms. Resampling and shuffling
    the data prior to defining the classification model can improve the prediction
    ability of the classification in case of class imbalance. The proposed methodology
    can be used with either k-fold cross-validation or stratified cross-validation.
    In the two cases, the results are similar, which validates the importance of the
    two novel steps in improving the predictions for class imbalance. This result
    also validates the assumption made by other authors [25–28] that both k-fold and
    stratified k-fold cross-validation can be used in class imbalance classification.
    Our results also suggest that the size of the dataset in the case of class imbalance
    may not be the key factor determining the type of cross-validation, which opens
    a new field for exploration of the role of cross-validation in the class imbalance
    issue. The proposed methodology improves not only the classification ability of
    the model but the ability of the model to improve the prediction for each class.
    This makes it competitive with deep learning models without further complicating
    the applications and interpretation of the model. Therefore, we consider the proposed
    methodology effective and efficient in handling class the class imbalance issue
    for the PIMA diabetes data.


    A future extension of this work would be testing the proposed methodology on larger
    datasets with class imbalance as well as multilabel classification. Also, the
    proposed methodology can be tested in datasets with many features without feature
    selection. We consider our methodology flexible and able to adapt to the characteristics
    of the data as model tuning can easily be performed. Therefore, the proposed methodology
    can easily be adapted to other datasets and multiclass classification.


    Although some recent diabetes research focusing on various aspects of diabetes
    prediction exists [29–32] they use different datasets. This makes their authors’
    results incomparable to ours. However, in the publication of Mohanty [33] the
    same dataset as ours is analyzed. The authors have studied a few machine learning
    models and ensemble models for classification analysis of the dataset. The proposed
    ensemble model in the paper [33] has'
