    # 4.3. Metrics


    In this paper, the primary metrics we use to evaluate the model''s performance
    are the Peak Signal-to-Noise Ratio (PSNR) and the Structural Similarity Index
    Measure (SSIM). These metrics are crucial for assessing the quality of the images
    that have been enhanced by the super-resolution process. PSNR is used to measure
    the ratio between the maximum possible power of a signal and the power of any
    corrupting noise that affects the fidelity of its representation, which, in image
    processing, translates to how much detail can be perceived in the super-resolved
    image:


    ```

    PSNR = 20 \cdot \log_{10} \left( \frac{MAX_I}{\sqrt{MSE}} \right) \quad \text{(11)}

    ```


    where \(MAX_I\) is the maximum possible pixel value of the image (e.g., 255 for
    8-bit images) and \(MSE\) is the mean squared error between the original and the
    reconstructed images. SSIM, on the other hand, evaluates the visual impact of
    three characteristics of an image (luminance, contrast, and structure), thereby
    providing a more comprehensive measure of image quality and perceived changes
    in structural information. These metrics are instrumental in demonstrating the
    effectiveness of the proposed model in improving the resolution of medical images
    while maintaining a balance between computational efficiency and enhancement quality:


    ```

    SSIM(x, y) = \frac{(2\mu_x\mu_y + c_1)(2\sigma_{xy} + c_2)}{(\mu_x^2 + \mu_y^2
    + c_1)(\sigma_x^2 + \sigma_y^2 + c_2)} \quad \text{(12)}

    ```


    where \(\mu_x\) and \(\mu_y\) are the averages of \(x\) and \(y\), respectively,
    \(\sigma_x\) and \(\sigma_y\) are the variance of \(x\) and \(y\), respectively,
    \(\sigma_{xy}\) is the covariance of \(x\) and \(y\), and \(c_1\) and \(c_2\)
    are two variables to stabilize division with a weak denominator.


