    the initial stage, training with NLL employs teacher forcing. Subsequently, during
    RL training, the SCST algorithm computes rewards utilizing two different reports
    from two distinct decoding strategies: greedy search and beam-search multinomial
    sampling. Inference on validation and test sets is conducted using beam search
    in both stages.'
