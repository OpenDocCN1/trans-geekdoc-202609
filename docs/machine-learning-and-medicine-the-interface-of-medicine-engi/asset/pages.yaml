  md: '# Lightweight Super-Resolution Techniques in Medical Imaging: Bridging Quality
    and Computational Efficiency


    Akmalbek Abdusalomov 1, Sanjar Mirzakhalilov 2, Zaripova Dilnoza 2, Kudratjon
    Zohirov 3, Rashid Nasimov 4, Sabina Umirzakova 1,* and Young-Im Cho 1,*


    +   1 Department of Computer Engineering, Gachon University Sujeong-Gu, Seongnam-Si
    13120, Gyeonggi-Do, Republic of Korea; bobomirzaevich@gmail.com

    +   2 Department of Computer Systems/Information and Educational Technologies,
    Tashkent University of Information Technologies Named After Muhammad Al-Khwarizmi,
    Tashkent 100200, Uzbekistan; mirzakhalilov86@tuit.uz (S.M.); zaripovada85@gmail.com
    (Z.D.)

    +   3 Department of Computer Systems, Karshi Branch of the Tashkent University
    of Information Technologies Named After Muhammad al-Khwarizmi, Tashkent 100200,
    Uzbekistan; qzohirov@gmail.com

    +   4 Department of Artificial Intelligence, Tashkent State University of Economics,
    Tashkent 100066, Uzbekistan; rashid.nasimov@tsue.uz

    +   * Correspondence: sabinatuit@gachon.ac.kr (S.U.); yicho@gachon.ac.kr (Y.-I.C.)


    Abstract: Medical imaging plays an essential role in modern healthcare, providing
    non-invasive tools for diagnosing and monitoring various medical conditions. However,
    the resolution limitations of imaging hardware often result in suboptimal images,
    which can hinder the precision of clinical decision-making. Single image super-resolution
    (SISR) techniques offer a solution by reconstructing high-resolution (HR) images
    from low-resolution (LR) counterparts, enhancing the visual quality of medical
    images. In this paper, we propose an enhanced Residual Feature Learning Network
    (RFLN) tailored specifically for medical imaging. Our contributions include replacing
    the residual local feature blocks with standard residual blocks, increasing the
    model depth for improved feature extraction, and incorporating enhanced spatial
    attention (ESA) mechanisms to refine the feature selection. Extensive experiments
    on medical imaging datasets demonstrate that the proposed model achieves superior
    performance in terms of both quantitative metrics, such as PSNR and SSIM, and
    qualitative visual quality compared to existing state-of-the-art models. The enhanced
    RFLN not only effectively mitigates noise but also preserves critical anatomical
    details, making it a promising solution for high-precision medical imaging applications.


    Keywords: medical imaging; super-resolution; lightweight model; residual learning


    # 1. Introduction


    Medical imaging plays a crucial role in modern healthcare, providing non-invasive
    methods for diagnosing, monitoring, and treating various medical conditions. With
    the ever-increasing demand for higher precision in medical image interpretation,
    enhancing the resolution of medical images has become a fundamental task [1].
    High-resolution medical images provide better visualization of intricate anatomical
    details, aiding healthcare professionals in making accurate diagnoses and planning
    effective treatments [2]. However, the limitations of imaging hardware often lead
    to sub-optimal image resolution, making the development of advanced super-resolution
    techniques imperative.


    Single image super-resolution (SISR) aims to reconstruct a high-resolution (HR)
    image from a given low-resolution (LR) image, recovering fine details that are
    essential for accurate analysis [3]. In recent years, deep learning-based approaches
    have demonstrated significant improvements in SISR tasks, surpassing traditional
    methods in both visual quality and computational efficiency [4]. This paper focuses
    on enhancing the Residual Feature Learning Network (RFLN) [5] for medical imaging
    by proposing modifications'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'tailored specifically for the unique challenges posed by medical datasets [6].
    The proposed model, an enhanced version of the RFLN, replaces the original residual
    local feature block with a standard residual block and introduces deeper layers
    for improved feature extraction, which is particularly suited for medical images,
    that often have only a single input channel. Our modifications aim to retain essential
    features while reducing irrelevant noise, thereby providing high-fidelity reconstructions,
    which are critical for medical applications. This paper details the architectural
    changes, the training methodology, and a comprehensive comparison with other state-of-the-art
    super-resolution models, demonstrating the superiority of the proposed model,
    both in terms of performance metrics and the visual results of medical imaging
    tasks.


    The main contributions of this work are summarized as follows:


    +   We propose an improved version of the RFLN architecture tailored specifically
    for medical imaging. The modifications include replacing the residual local feature
    blocks with standard residual blocks and increasing the model depth to improve
    feature extraction and resolution quality.


    +   To further improve the feature refinement process, we integrate an enhanced
    spatial attention mechanism into the model. This helps focus on the most relevant
    areas of the input image, enhancing the overall quality of the super-resolved
    output, which is crucial for medical image interpretation.


    +   We conduct extensive experiments using specialized medical imaging datasets,
    demonstrating the efficacy of the proposed model in terms of both quantitative
    metrics and qualitative results. The proposed model outperforms existing state-of-the-art
    models, showcasing its potential for real-world medical applications.


    +   We provide a detailed analysis of the proposed model''s performance compared
    to other leading SISR models. Our results highlight the advantages of our modifications
    in handling the unique challenges presented by medical images, such as the preservation
    of subtle anatomical details and noise reduction.


    These contributions collectively advance the field of super-resolution for medical
    imaging, providing a robust framework that can significantly enhance the quality
    of medical images, ultimately aiding healthcare professionals in delivering accurate
    and effective diagnoses. In the following sections, we outline the structure of
    this paper: Section 2 reviews the related works in the field of single image super-resolution
    (SISR). Section 3 presents the methodology, detailing the proposed enhancements
    to the RFLN. Section 4 describes the experiments and results, while Section 5
    discusses the findings and implications. Finally, Section 6 concludes the paper
    by summarizing the main contributions and future directions.


    # 2. Related Works


    The field of SISR has seen considerable advancements in recent years, primarily
    due to the advent of deep learning-based methods [7]. Early approaches, such as
    bicubic interpolation [8] and sparse representation-based methods [9], laid the
    groundwork for SISR but were limited in their ability to capture complex textures
    and fine details. Traditional machine learning techniques, such as Sparse Coding-based
    Super-Resolution (SC-SR) [10] and Neighbor Embedding-based Super-Resolution (NE-SR)
    [11], provided some improvements over basic interpolation techniques but still
    struggled with high-frequency detail restoration. The introduction of convolutional
    neural networks (CNNs) marked a turning point for SISR. Dong et al. introduced
    the Super-Resolution Convolutional Neural Network (SRCNN) [3], which was among
    the first to demonstrate the potential of deep learning for super-resolution tasks.
    SRCNN utilized a straightforward architecture, achieving notable improvements
    in visual quality over traditional methods. Subsequent models, such as Very Deep
    Super-Resolution (VDSR) [12] and the Deep Recursive Convolutional Network (DRCN)
    [13], leveraged deeper architectures and recursive structures to further improve
    super-resolution performance. Generative adversarial networks (GANs) have also
    been employed to enhance the perceptual quality of super-resolved images [14].
    The SRGAN [15] model was a pioneering effort that introduced adversarial loss
    to encourage the genera-'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'tion of high-frequency details [16], producing images that were perceptually
    closer to the ground truth. However, GAN-based models often suffer from instability
    during training and may introduce artifacts that compromise the accuracy of medical
    images, where precise detail is crucial.


    More recent works have focused on residual learning and attention mechanisms [17]
    to address the challenges of high-fidelity image reconstruction. The authors of
    [18] introduced the Enhanced Deep Residual Network for Single Image Super-Resolution
    (EDSR), which discarded unnecessary layers and batch normalization to achieve
    better performance. The authors of [19] proposed the Residual Channel Attention
    Network (RCAN) [20], which leveraged channel-wise attention to adaptively refine
    features, leading to significant improvements in image quality [21]. These models
    have demonstrated the importance of focusing on key features while suppressing
    irrelevant information, an approach that aligns closely with the goals of our
