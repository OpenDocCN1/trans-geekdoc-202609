  md: '# 5. Conclusions


    In this paper, Kaplan–Meier and Cox proportional hazards regression models are
    used to analyze overall survival, and ML-based ensemble methods are proposed to
    predict SKCM. Five distinct datasets using transcriptomic technologies were collected.
    To choose the best features, three distinct feature selection methods, i.e., REF,
    FFE, and BFE, were used. We trained and compared four ensemble approaches (stacking,
    bagging, boosting, and voting) using eight baseline classifiers (RF, DT, GNB,
    AdaBoost, GB, LR, ET, and LGBM). The performance of ensemble methods was evaluated
    with the help of the ROC curve, confusion matrix, accuracy, precision, recall,
    and F1 score. The overall performance of RF was good as compared to other classifiers.
    The recorded performance of the algorithms shows a slight variation. Voting and
    stacking strategies scored the best among ensemble techniques. The highest ROC
    was achieved using RF, LR, AdaBoost, and LGBM, which was 0.99. The RF classifier
    achieved the best accuracy, which was 99%, and the stacking and voting method
    achieved the highest accuracy rate, which was 99%. Finally, this study is limited
    to a specific dataset, which can be evaluated on various datasets to achieve better
    results.


    # Future Work


    We will investigate deep learning methods for skin cancer early detection and
    prognosis in the future. We will investigate other multi-omic technologies in
    this area and investigate various skin cancers to further find out ways for early
    detection of diseases.


