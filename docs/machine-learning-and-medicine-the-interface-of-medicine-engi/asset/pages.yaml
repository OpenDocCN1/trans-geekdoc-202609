- pgno: 142
  md: '# Machine Learning-Based Ensemble Feature Selection and Nested Cross-Validation
    for miRNA Biomarker Discovery in Usher Syndrome


    Rama Krishna Thelagathoti, Dinesh S. Chandel, Wesley A. Tom, Chao Jiang, Gary
    Krzyzanowski, Appolinaire Olou and M. Rohan Fernando *


    Molecular Diagnostic Research Laboratory, Center for Sensory Neuroscience, Boys
    Town National Research Hospital, Omaha, NE 68010, USA; ramakrishna.thelagathoti@boystown.org
    (R.K.T.); wesley.tom@boystown.org (W.A.T.); chao.jiang@boystown.org (C.J.); gary.krzyzanowski@boystown.org
    (G.K.); appolinaire.olou@boystown.org (A.O.) * Correspondence: m.rohan.fernando@boystown.org


    Abstract: Usher syndrome (USH) is a rare genetic disorder affecting vision, hearing,
    and balance. Identifying reliable biomarkers is crucial for early diagnosis and
    understanding disease mechanisms. MicroRNAs (miRNAs), key regulators of gene expression,
    hold promise as biomarkers for USH. This study aimed to identify a minimal subset
    of miRNAs that could serve as biomarkers to effectively differentiate USH from
    controls. We employed ensemble feature selection techniques to select the top
    miRNAs appearing in at least three algorithms. Machine learning models were trained
    and tested using this subset, followed by validation on an independent 10% sample.
    Our approach identified 10 key miRNAs as potential biomarkers for USH. To further
    validate their biological relevance, we conducted pathway analysis, which revealed
    significant pathways associated with USH. Furthermore, our approach achieved high
    classification performance, with an accuracy of 97.7%, sensitivity of 98%, specificity
    of 92.5%, F1 score of 95.8%, and an AUC of 97.5%. These findings demonstrate that
    combining ensemble feature selection with machine learning provides a robust strategy
    for miRNA biomarker discovery, advancing USH diagnosis and molecular understanding.


    Keywords: ensemble feature selection; biomarker discovery; usher syndrome; miRNA;
    machine learning; nested cross-validation


    # 1. Introduction


    Usher syndrome is a rare genetic disorder characterized by a combination of hearing
    loss, progressive vision loss due to retinitis pigmentosa and, in some cases,
    balance issues [1,2]. It is the most common cause of inherited deaf-blindness,
    accounting for approximately 50% of cases where individuals experience both hearing
    and vision impairment [3]. Usher syndrome presents in various clinical subtypes,
    each with varying severity and onset of symptoms, making its diagnosis particularly
    complex [4]. The heterogeneity in symptoms and the various genetic mutations associated
    with the syndrome make diagnosis challenging, often requiring a combination of
    clinical assessments, audiological tests, and genetic screening [5,6].


    In recent years, microRNAs (miRNAs) have emerged as promising biomarkers for diagnosing
    various genetic and complex diseases, including Usher syndrome [7,8]. miRNAs are
    small, non-coding RNA molecules that regulate gene expression and play crucial
    roles'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'in various cellular processes [9,10]. Abnormal miRNA expression has been linked
    to a wide range of diseases, including cancers, neurological disorders, and genetic
    syndromes [10]. Given their stability in biological fluids and their specificity
    to certain pathological states, miRNAs have gained attention as potential biomarkers
    for early and accurate diagnosis. In the context of Usher syndrome, profiling
    miRNA expression can offer insights into the molecular mechanisms underlying the
    disorder and potentially aid in its detection [7,11].


    While miRNAs hold significant promise for diagnosis, not all miRNAs contribute
    equally to disease progression. Identifying a minimal subset of miRNAs that are
    most relevant to disease is critical for both diagnostic accuracy and biological
    understanding [12–14]. A smaller miRNA set improves the interpretability of diagnostic
    models, aiding in better understanding the disease’s molecular underpinnings [15–17].
    Clinically, a minimal miRNA set reduces the complexity and cost of diagnostic
    tests, making them more feasible for large-scale or routine screening [18]. Moreover,
    focusing on a smaller, highly relevant miRNA subset facilitates the development
    of targeted therapies and personalized treatments [15].


    Feature selection techniques are instrumental in reducing the dimensionality of
    miRNA datasets by identifying the most relevant miRNAs associated with any disease,
    including Usher syndrome [12,13,15]. Given the high dimensionality of miRNA expression
    profiles, selecting a minimal feature set is essential. Rare genetic disorder
    studies often have relatively small sample sizes. Feature selection methods, such
    as filter, wrapper, and embedded techniques, can help identify the most impactful
    miRNAs [19]. Therefore, choosing a compact set of features is crucial for developing
    robust and interpretable models. In the case of Usher syndrome, which is also
    a rare genetic disorder, applying feature selection to miRNA data can help isolate
    the key miRNAs associated with the disorder, facilitating a more efficient and
    accurate diagnostic process.


    Given the complexity of Usher syndrome and the vast miRNA datasets generated from
    expression profiling, automating the diagnostic process with machine learning
    classifiers is essential. In this study, we propose a machine learning-based approach
    that integrates ensemble feature selection and nested cross-validation to identify
    the minimal miRNA feature set needed for the automated detection of Usher syndrome.
    This study has two main objectives: (1) to design and develop an ensemble feature
    selection method combined with nested cross-validation to identify the minimal
    miRNA set for classification; and (2) to utilize a range of supervised machine
    learning classifiers to train, test, and validate the models to identify the best-performing
    one. This approach not only reduces the time and labor involved in manual diagnosis,
    but also improves the accuracy and reliability of predictions. Furthermore, nested
    cross-validation is particularly beneficial when working with small datasets,
    where data acquisition is often a challenge.


    # 2. Relevant Work


    Ensemble feature selection has proven to be a promising approach in miRNA-based
    disease classification, particularly for high-dimensional datasets. Studies highlight
    its ability to identify minimal miRNA subsets that improve diagnostic accuracy
    and reduce dimensionality. For example, Cai et al. (2015) employed an ensemble
    method with multiple classifiers to differentiate lung cancer samples from controls,
    achieving enhanced robustness in classification [20]. Similarly, Sarkar et al.
    (2021) leveraged machine learning integrated with survival analysis to identify
    breast cancer subtype-specific miRNA biomarkers, demonstrating improved diagnostic
    and prognostic precision [15]. These methods underscore the value of ensemble
    strategies in addressing the challenges of high-dimensional biological data.'
