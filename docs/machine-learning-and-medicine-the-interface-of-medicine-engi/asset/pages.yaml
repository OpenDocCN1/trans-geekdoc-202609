    employing image augmentation techniques such as slight rotations, scale changes,
    shifts, random crops, and adjustments of brightness and contrast helps exploit
    the number of images. Moreover, since most datasets typically include more challenging
    samples than others, HNM is an option to consider. During training, samples with
    errors greater than the mean error plus their standard deviation are reutilized
