    # 4. Discussion


    In this paper we present a simple and not computationally exhaustive methodology
    for improving the prediction ability of classification models for the minority
    class in the case of class imbalance. We can summarize the key findings from this
    research as follows:


    +   1. Using Python’s built-in functions can successfully tackle class imbalance.
    The used parameter in question is ‘class_weight’ = balance. However, additional
    steps need to be taken to handle class imbalance so that the model can become
    more efficient.

    +   2. When having imbalanced data, resampling and shuffling the data randomly
    before the train/test split can help improve estimation metrics. This result is
    robust regardless of the type of cross validation used.

    +   3. Applying our proposed algorithm is a simple and fast way to predict labels
    with class imbalance. It does not require additional techniques to balance classes.
    It does not involve preselecting important variables, which saves time and makes
    the model easy for analysis. This makes it an effective algorithm for the initial
    and further modeling of data with heavy class imbalance.

    +   4. Our algorithm does not need a feature selection procedure, therefore avoiding
    the bias that can be introduced with the method of feature selection.

    +   5. Two types of cross validation can be used as shown. The results are similar,
    suggesting that the type of cross validation may not be key for class imbalance.
    Rather, the overall strategy to eliminate the influence of the dominant class
    may be more important.

    +   6. Despite the relatively small size of the PIMA datasets, both k-fold and
    stratified k-fold cross validation are appropriate. This finding contrasts with
    some researchers suggesting using k-fold cross validation for class imbalance
    only in large datasets. We highlight that the type of cross validation used may
    not be dependent on the size of the dataset rather than its characteristics.

    +   7. This property of the model makes it flexible to adjust to other issues
    in the data, not only class imbalance. Therefore, other types of cross validation
    can be used.


    As a conclusion, testing the proposed methodology on the PIMA diabetes dataset
    has shed light on the importance of resampling and shuffling data as a data processing
    step for handling class imbalance. With this discovery, we extend the applications
    of resampling and shuffling data and introduce a new line of academic research
    in the field of class imbalance. Moreover, our methodologies show how to increase
    the effectiveness of the machine learning models based on the standard approaches
    and make them more reliable.


    Currently, the use of artificial intelligence (AI) applications in healthcare
    is growing rapidly. AI implementation allows healthcare professionals to devote
    more attention to patient care prescreening and individual treatment. As a result,
    the quality of life and rates of recovery increase. Therefore, the issue of the
    legal and ethical consequences of adopting AI technology in medicine is relevant.
    For example, Geantă et. al. [34] compared the efficiency of artificial intelligence
    models in healthcare to answer the question of which platform is better equipped
    to produce health-safe diagnostic models. They discovered that AI models generated
    by ChatGPT 3.5 in some healthcare fields may be more trustworthy and secure in
    diagnosing some diseases than AI models pre-defined by researchers. However, other
    diseases are diagnosed and treated more accurately using AI models defined by
    the researcher. Therefore, an ethical issue arises to discover and make sure that
    the safest AI algorithm for the detection of the disease is used. This results
    in public trust [34–36] in the healthcare system. However, the questions of what
    AI models are safe and ethical to use, how hospitals can better protect the personal
    data they collect as'
