  img_proc: true
- pgno: 144
  md: 'Lopez-Rincon et al. (2020) [21] applied an ensemble recursive feature selection
    approach to identify circulating miRNAs as biomarkers for cancer classification
    across various tumor types. This method improved the interpretability and reliability
    of cancer classification by pinpointing a minimal subset of miRNAs relevant to
    different tumor types [21]. In a related study, Lopez-Rincon et al. (2019) [12]
    developed an ensemble feature selection framework to identify a 100-miRNA signature
    for cancer classification. Their automated feature selection approach demonstrated
    the scalability of ensemble feature selection in cancer classification. However,
    the large number of selected features (100 miRNAs) may not be suitable for diseases
    associated with fewer miRNAs, such as rare genetic disorders [12]. Colombelli
    et al. (2022) [22] proposed a hybrid ensemble feature selection method for identifying
    miRNA biomarkers from transcriptomic data. This hybrid design enabled a more comprehensive
    selection of candidate biomarkers, enhancing model accuracy and interpretability
    [22].


    The current study overcomes the limitations of previous research by incorporating
    an adaptive ensemble feature selection method combined with nested cross-validation
    for miRNA-based classification, specifically targeting Usher syndrome. This novel
    approach ensures robust feature selection and validation, addressing overfitting
    by employing nested cross-validation throughout both the feature selection and
    classification processes. Furthermore, our method dynamically updates the minimal
    feature set as new data becomes available, making it particularly well-suited
    for rare genetic disorders like Usher syndrome, which often suffer from small
    sample sizes. This integration of dynamic adaptability and scalability represents
    a significant advancement in miRNA-based disease classification, offering a more
    reliable and flexible framework than prior methods.


    # ## 3. Materials and Methods


    This section outlines the methodology employed in this study. As shown in Figure
    1, the process begins with preprocessing the miRNA samples, followed by feature
    selection and model training using an ensemble feature selection approach combined
    with nested cross-validation. This methodology helps identify the best-performing
    model and the minimal subset of miRNA features. The selected model is then evaluated
    and validated using these features to assess its performance. Additionally, the
    minimal set of miRNAs is used for pathway analysis to extract relevant biological
    pathways. Furthermore, this section provides an overview of the feature selection
    techniques and machine learning classification algorithms used in this study.


    # ### 3.1. miRNA Samples Extraction and Quantification


    For each sample in the study, total miRNA was extracted using methods described
    previously [7]. Briefly, QIAzol reagent was used to isolate total RNA, and miRNA
    was samples in this study were collected from patient derived B-lymphocyte cell
    lines. MiRNA was purified from cell lines using miRNeasy Tissue/Cells Advanced
    Micro Kit (QIAGEN Sciences Inc., Germantown, MD, USA). MicroRNA expression was
    quantified for all samples using NanoString nCounter Human v3 miRNA Expression
    assays (cat. # CSO-MIR3-12, Bruker Corp., Billerica, MA, USA). Quality control
    and batch normalization of miRNA count data was performed using NAnostring quality
    Control dasHbOard (NACHO) package in R [23]. This resulted in a miRNA count matrix
    for 798 miRNAs for 60 samples, which was utilized for subsequent machine learning
    analysis. There were 31 Usher samples, and 29 control samples int the cohort.'
