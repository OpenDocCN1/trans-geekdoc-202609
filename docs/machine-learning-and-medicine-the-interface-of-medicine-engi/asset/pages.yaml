- pgno: 31
  md: 'Sparapani et al. evaluated 3774 participants from MESA (Multi-Ethnic Study
    of Atherosclerosis), free of clinically apparent cardiovascular disease at enrollment,
    using ECG and participant characteristics to predict LV mass from cardiac magnetic
    resonance imaging [32]. There were four global ECG measurements (PR interval,
    P axis, QRS interval and QRS axis) plus 552 amplitude and duration measurements
    per ECG, which resulted in 556 ECG variables. The machine learning technique Bayesian
    Additive Regression Trees (BART) was used [32]. This model showed the highest
    sensitivity (29.0%), greater than the other criteria, including the Sokolow-Lyon
    criterion (21.7%), Peguero-Lo Presti (14.5%), Cornell voltage product (10.1%)
    and Cornell voltage (5.8%). The specificity was >93% for all criteria [32].


    Garza-Salazar et al. conducted an observational, retrospective case–control study
    that included data from a representative sample of consecutive adult patients
    who underwent an ECG and an echocardiogram at their institution [33]. They evaluated
    432 patients, of whom 47% had LVH [33]. The ECG variables included S-wave voltage
    and R-wave voltage in all ECG leads (I, II, III, aVL, aVF, aVR and V1–V6), P-wave
    duration and voltage in the V1 lead, left atrial enlargement, QRS complex duration
    in lead V1, QRS axis (using leads I and aVL), intrinsicoid deflection in lead
    V6 and “ST strain” (downward ST depression and asymmetric T-wave inversion) [33].
    The logistic regression (LR) model was used as well as a supervised ML algorithm
    to create a multilevel binary decision tree, using the ECG features that provided
    the greatest information to classify patients as having LVH [33]. Their five-level
    binary decision tree used only six predictive variables and had an accuracy of
    71.4%, a sensitivity of 79.6% and specificity of 53% [33].


    De la Garza Salazar et al. reported another observational, retrospective, case–control
    study on 439 patients who underwent an echocardiogram and an ECG [35]. Sixteen
    ECG parameters, including T voltage in lead I, peak-to-peak QRS distance in aVL
    (>1.235 mV) and peak-to-peak QRS distance in aVF (>0.178 mV), were fed into a
    C5.0 ML algorithm, a method that defines a decision tree structure model (or criteria).
    Their model had an accuracy of 70.5%, a sensitivity of 74.3% and a specificity
    of 68.7%.


    Kwon et al. conducted a retrospective cohort study of 12,648 patients who underwent
    12-lead ECG and echocardiography [34]. LVH was present in 21% of the group. An
    ensemble neural network (ENN) combining a convolutional (CNN) and deep neural
    network (DNN) was developed. Two other machine learning-based algorithms—LR and
    RF—were also developed. The model was developed using 3162 ECGs from 3162 patients.
    They used four clinical variables (age, sex, weight and height) and ECG features,
    such as heart rate, presence of atrial fibrillation or flutter, QT interval, QTc,
    QRS duration, R-wave axis and T-wave axis. In addition, they used raw ECG data
    with 5000 numbers from each of the 12 leads. The area under the ROC curve for
    ENN was 0.880, which significantly outperformed the Romhilt-Estes point system,
    Cornell voltage criteria and the Sokolow-Lyon criteria [34].


    Lim et al. examined the ECGs and echocardiograms of 17,310 male military conscripts,
    aged 16 to 23 years [39]. The prevalence of echocardiographic LVH was 0.82%. Several
    machine learning models (Logistic Regression, GLMNet, Random Forests and Gradient
    Boosting Machines) were used. Their clinical variables were body weight, height,
    body fat percentage and systolic blood pressure. Their ECG variables included
    QT interval, mean QRS duration and R wave in lead I, ECG parameters not used in
    the classical criteria but deemed important to the machine learning algorithms,
    both when ECG parameters alone were included and when all predictive parameters
    were included. Considering AUC, ML methods achieved superior performance: logistic
    regression (0.811), GLMNet (0.873), Random Forest (0.824) and Gradient Boosting
    Machines (0.800).


    Two studies used the UK Biobank with individuals aged 40 to 69 years, with a mean
    age of 64 years, of which 52% were female, who had LV mass index assessed by MRI
    [36]. Khurshid et al. also tested a Massachusetts General/Brigham Hospital database,
    but more information was available for the UK Biobank so it was selected in this
    analysis. Khurshid et al. trained an ML model on 32, 239 participants [36]. The
    input variables were'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'demographic factor, age, sex, race, height, weight and body mass index (BMI),
    plus ECG waveform data. Their model had a sensitivity of 34% and a specificity
    of 96% [36].


    Naderi et al. also explored the UK Biobank [43]. There was a low prevalence of
    LVH, specifically 1.5%. Demographic factors included age, sex and race, and physical
    measurements included height, weight and body mass index (BMI). Clinical variables
    included blood pressure, and 23 ECG variables used the independent ECG leads (I,
    II, V1–6). ECG variables consisted of ECG waveform data. Three supervised machine
    learning algorithms, logistic regression (LR), support vector machine (SVM) and
    Random Forest (RF), were used. For the SVM classifier, the Gaussian kernel function
    was applied to deal with potential non-linear data. The three models were comparable
    in classifying LVH. Classification of LVH with logistic regression had an accuracy
    of 81%, sensitivity of 70%, specificity of 81% and an AUC of 0.86. Analysis with
    SVM showed 81% accuracy, sensitivity of 72%, specificity of 81% and AUC of 0.85.
    RF analysis showed 72% accuracy, sensitivity of 74%, specificity of 72% and AUC
    of 0.83 [43].


    Sabovčik et al. evaluated 1407 individuals (mean age 51 years, 51% women), randomly
    recruited from the general population, of whom an echocardiographically determined
    LV mass was present in 19% [37]. A large number of clinical and laboratory variables
    (blood count, blood glucose, lipids, renin activity, leptin, insulin, aldosterone
    and cortisol) were used. From the ECG tracing, the onsets, amplitudes and intervals
    of P waves, QRS complexes and T waves were extracted. They used five standard
    ML methods, XGBoost, AdaBoost, RF, SVM and LR, to build classifiers based on 67
    clinical, biochemical and ECG variables. A high area under the ROC was found for
    XGBoost (0.785), RF classifiers (0.783), AdaBoost (0.771), SVM (0.783) and LR
    (0.783) for predicting LVH. Age, body mass index, different components of blood
    pressure, history of hypertension, antihypertensive treatment and various electrocardiographic
    variables were the top features for predicting LVH [37].


    Angelaki et al. evaluated 528 patients with and without essential hypertension
    but no other indications of cardiovascular disease [38]. LVH, assessed by echocardiogram,
    was present in 16.8% of cases. Clinical variables were used. ECG waveform measurements
    from each lead included peak voltages, area of the QRS complex, planar frontal
    QRS–T angle and QTc duration. A Random Forest ML algorithm consisting of a collection
    of de-correlated decision trees was used. They calculated SHAP (SHapley Additive
    exPlanations). Hypertension, age and BMI were the most significant factors predicting
    the presence of LVH. The area under the QRS complex summed over all 12 leads,
    the Planar Frontal QRS–T angle and QTc duration, among others, was important in
    predicting risk. For the identification of LVH, their model noted 87% accuracy,
    75% specificity, 97% sensitivity and area under the receiver operating curve (AUC/ROC)
    of 0.91 [38]. However, some of the patients did not have LVH but rather concentric
    remodeling [38].


    Kokubo et al. analyzed data from patients aged 18 years or older, with a mean
    age 64.2 years, 57% men, who had an echocardiogram and ECG at The University of
    Tokyo Hospital [42]. LVH was defined as an LVMI > 101 g/m² for men and > 85 g/m²
    for women, consistent with recommendations for the Japanese population, and was
    present in 16.5% of cases [42]. The data were derived from a training set of 12,008
    persons. Nineteen factors—clinical (age, sex, height and weight) and ECG features
    (heart rate, rhythm, pr interval, QT interval, QRS axis, P wave axis as well as
    QRS voltages in leads V1, V2, V5 and V6)—were used as input variables. They developed
    an ensemble neural network (ENN) model, which consisted of a convolutional neural
    network (CNN) and a deep neural network (DNN) as well as a LR and RF approaches
    to detect LVH. For the detection of LVH, the area under the ROC curve was 0.784
    for the deep learning model, which was significantly greater than that of the
    LR, RF or conventional ECG criteria [42].


    Zhao et al. utilized data from 3120 patients who had an echocardiogram and an
