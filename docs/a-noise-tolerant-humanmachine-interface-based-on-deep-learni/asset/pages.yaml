    # Mechanical simulation


    The commercial software ABAQUS was used to predict deformation and evaluate the
    streptability of interface connections between each layer (Extended Fig. 2). Two
    Cu/PL laminates were modeled using four-dimensional shell elements².


    An explicit solver was used to ensure convergence in involving intricate contact
    areas with the serpentine interconnections.


    Cu was used to evaluate the mechanical properties using an elastic modulus of
    110 GPa, Poisson''s ratio of 0.34 and a strength of 350 MPa (-0.3 yield). The
    mechanical behavior of the elastomer (Ecoflex), and the substrate, was modeled
    using a hyperelastic viscoelastic model.


    This relationship was evaluated with an elastic modulus of 10 GPa and a Poisson''s
    ratio of 0.49. For Ep, an elastic modulus of 2.5 GPa and a Poisson''s ratio of
    0.27 were used. A rigid and frictionless contact model described interactions
    between the serpentine interconnections and elastomer.


    Boundary conditions were implemented on the two vertical edges of the model. Specifically
    the displacement constraints were prescribed as follows: (uₓ, 0) for the left
    side and (uₓ, ε*L) for the right side, where ε* is the strain applied along the
    length of the model and L is the length of the model.


    # Bluetooth characterization


    The Bluetooth signal was characterized using the received signal strength meter.
    Measurements were conducted through the Bluetooth scanner. To ensure data accuracy
    and reliability, the received signal strength value was recorded 15 times under
    each specified condition (Fig. 1, Extended Fig. 3 and Supplementary Fig. 37).


    # Thermal characterization


    Thermal images were captured by a thermal camera (FLIR C Series) after activating
    the sensors. Images were recorded every 10 minutes during different conditions
    (Fig. 4 and Supplementary Fig. 4).


    To assess actual conditions, a thermocouple (a sensor) was placed between the
    active and the skin to monitor temperature during continuous operation (Supplementary
    Fig. 4).


    # Signal processing of EMG signals for differentiating grasping and relaxing


    Raw EMG signals are susceptible to low frequency artifacts and noise. To mitigate
    these interferences, we used a digital 30 –200 Hz bandpass filter and a 6 Hz notch
    filter.


    The root mean square (RMS) of the EMG signals was calculated by:


    ```

    EMG_{RMS} = \sqrt{\frac{1}{N}\sum_{i=1}^{N} EMG^{2}(i)}

    ```


    where N represents the length of the signal and EMG denotes the magnitude of the
    RMS data points. The value represents the power of the EMG signal during a short
    duration: duration for grasping and relaxing.


    When the window length increases, we capture more of the signal but reduce resolution.
    We used a window of 200 ms to achieve a balance. The RMS value exceeded 0.2 μV
    when the robotic finger performed grasping, and conversely, relaxed when the value
    was below the threshold (Fig. 4b and Extended Data Figs. 7–10).


    To account for individual variations in muscle tone, which can influence EMG amplitudes,


    we implemented an individual-specific calibration strategy to reliably distinguish
    grasping from relaxing – specifically for each individual, EMG


    signals were recorded during baseline and grasping actions (each lasting: -2 s
    to 10 cycles). The RMS of the baseline during grasping and relaxing (V_{baseline}
    and V_{grasping}) were measured.


    V_{threshold} = 0.5 × (V_{baseline} + V_{grasping}),


    This calibration consistent recognition performance across individuals with varying
    signal quality.


    # Characterization of electrode conductivity, impedance and signal quality


    The impedance of the test electrode was measured using a digital multimeter (Keysight).
    Impedance was measured using a bioimpedance analyzer (AD-594B02) in a three-electrode
    configuration (that, is, reference and counter electrodes).


    Measurements were conducted under specific conditions, ringing and vibration conditions
    (Supplementary Fig. 1).


    The impedance of the EMG was evaluated by quantifying the signal-to-noise ratio
    during grasping, ringing and vibration (Supplementary Fig. 11). In each test,
    the individual performed hand relaxing and grasping force of –n N.


    # Characterization of electrode-skin interface


    The impedance at the electrode-skin interface was measured using a Palenostat
    with a three-electrode configuration (Supplementary Fig. 2). The device maintains
    a stable pressure.


    This setup enabled characterizing the impedance of the working electrode-skin
    interface, while the counter electrode circuited the circuits. The three electrodes
    were laminated onto the flexible polymer substrate with a 2 cm spacing.


    We utilized the galvanic impedance spectroscopy over a frequency range of 0.1
    Hz to 10 Hz, to ensure stability for the body. The units were tested under various
    conditions, the electrode-skin interface was submerged in seawater collected from
    the San Diego Mission.


    # Stability of the sensor performance


    To evaluate the sensors'' long-term term performance during interactive activities,
    we conducted experiments over five days. The experiments were performed on the
    individuals, where the EMG module recorded signals induced by grasping and hand.
    The recorded signal was analysed using power spectral density analysis (Supplementary
    Fig. 12).


    Performance under varying temperature and humidity conditions was assessed by
    baseline noise levels. The sensors were placed on a hotplate at different temperatures
    while kept stationary. Additionally, the sensors were tested under varying humidity
    levels during measurement (Supplementary Fig. 13).


    To characterize the effect of pressure on signal quality, we measured EMG for
    15 min and 30 min during short-term runs. In each session, the individual performed
    hand relaxing and grasping force of –n N (Supplementary Fig. 14).


    # Generation of the corpus training dataset


    The individual performed each gesture 20 times while sitting. Each session was
    recorded independently with 18 different motor motions, including grasping, ringing,
    vibration and their combinations at different stages, with a duration of 1 s (Fig.
    3a and Extended Data Fig. 4). To address the influence of orientation and the
    morphology of the gesture signals, each gesture was also performed motion artifacts
    related to vibration (without those from grasping) (Supplementary Fig. 15).


