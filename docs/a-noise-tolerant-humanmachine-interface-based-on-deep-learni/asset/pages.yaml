    Then, we fine-tuned the model with varying numbers of shots (that is, the number
    of shots from each gesture). Furthermore, we used a lower learning rate of 0.001
    for the recurrent layers to retain the primary gesture representations (Supplementary
    Fig. 3 and Supplementary Note 14).


    When the user moved, the involuntary motions significantly distorted the accelerometer
    and gyroscope sensors. The robotic arm experienced unwanted vibrations without
    a deeplearning algorithm (Supplementary Fig. 1). However, even when the gestures
    were executed in different dates, the system successfully recognized the intended
    actions.


    We evaluated the efficiency of the transfer learning with 100 shots (that is,
    used in the testing dataset) (Extended Fig. 5 and Methods). The result showed
    that transfer learning with only 2 shots per gesture (one recorded while sitting
    and one while standing) performed as well as the 400 shots required for the initial
    training process.


    Using a sliding window with a step size of 0.5s to reduce the computational load
    and overlap between consecutive gestures (Fig. 3f). A larger step size improved
    the minimum recognition accuracy across all types of gestures from 51% to >92%
    (Fig. 3e). The time taken to collect motion artifacts from the new individual
    was reduced from 2 minutes to 60 seconds.


    To achieve gesture recognition, the acquired signals should be continuously fed
    into the sliding window mechanism, which allows the window to capture signals
    from either a single gesture or two consecutive gestures.


    In underwater environments, water currents are different from the intricate dynamics
    of seas, which vary significantly with wave parameters (e.g., wavelength and height).
    However, unwanted wave-interference can affect the user''s gesture signals, complicating
    the classification of gestures.


    When the sliding window slides, the window may contain signals from two consecutive
    gestures. Therefore, we generated signals using various consecutive gesture combinations.
    Rather than performing individually, we predicted by concatenating individual
    perceived gestures, by connecting two signals to end-consecutive gestures.


    We trained the model with a dataset that includes sea-wave motions. The training
    data was originally collected in San Diego Bay (Fig. 5a). However, due to the
    bay''s enclosed environment (compared to an open environment), the amplitude of
    the waves is different from the open sea.


    The sliding window was applied to these concatenated signals, and we achieved
    a recognition rate of 95% of the duration (Extended Fig. 6). A similarity comparison
    was performed for all gestures while sliding down (Supplementary Fig. 24). This
    approach reached 46,930 signals for 19 gestures (Methods).


    # Potential aquatic applications


    Human-machine interfaces are used to control underwater robots for task tracking,
    data collection, shipw inspection, and rescue operations.


    # Robotic arm


    Although many studies have achieved high accuracy in gesture recognition using
    EMG and IMU with many degrees of freedom, these approaches require the user to
    remain stationary, which is inevitably impacted by motion artifacts.


    With the model built, we can perform a demonstration directing a robotic arm floating
    in the ocean. When the IMU signals were superimposed with sea-wave interference,
    the system generated accurate commands for the robotic arm (Supplementary Fig.
