    Existing methods for mitigating artifacts in IMUs can be broadly categorized into
    hardware- and software-based approaches (Supplementary Note 2). For hardware-based
    approaches, reducing the device thickness or enhancing the adhesion between the
    device and the


    skin can minimize artifacts caused by displacement of the skin–sensor interface.
    Although this method is effective in bipolar measurement, it is essential for
    IMUs, which inherently capture unintentional depletments during body movements.


