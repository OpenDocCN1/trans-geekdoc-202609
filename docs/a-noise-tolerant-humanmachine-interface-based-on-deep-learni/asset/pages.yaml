    signal (for example, a signal of gesture 2) superimposed with 18 stages of motion
    artifacts in **b** and **d**. The stages are fixed rather than by randomly selecting
    segments from continuous motion artifact recordings. Since random selection can
    unintentionally introduce overlapping segments, where identical portions of motion
    artifacts appear in multiple superimposed signals, using fixed stages is key to
    extracting generalizable features. Otherwise, the model may learn to recognize
    repeated motion artifact patterns instead. To mitigate this, we deliberately divided
    the motion artifacts into distinct, non-overlapping stages.


