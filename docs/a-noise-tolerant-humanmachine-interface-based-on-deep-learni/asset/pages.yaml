    # Process for training learning


    For training, we collected data from 6 subjects (5 males and 1 female, aged 21
    to 34) with different motion speeds and forearm lengths (40-50 cm). The data from
    five individuals were used to train the CNN, while the sixth was used for fine-tuning.
    During the testing phase, we used the CNN to determine the output. Notably, 100
    sequences were randomly selected to evaluate the performance of the CNN (Fig.
    3c and Extended Data Fig. 5). This cross-validation approach separates training
    and testing, preventing any data leakage during the process.


