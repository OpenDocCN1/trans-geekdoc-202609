    Wearable machine interfaces with inertial measurement units (IMUs) are widely
    applied across healthcare, robotics and interactive technologies. However, extracting
    signals remains challenging owing to motion artifacts in real-world environments.
    Here we present a human–machine interface capable of tolerating diverse motion
    artifacts through deep learning-enhanced wearable sensors. The system integrates
    a six-channel IMU, an electromyography module, a Bluetooth microcontroller unit
    and a stretchable battery, enabling wireless capture and transmission of gestures.
    A convolutional neural network trained on a composite dataset of gestures and
    motion artifacts extracts robust signals, parameter-based transfer learning improves
    the generalizability of the network across users. A sliding-window approach connects
    the extracted gestures in real-time, continuous control of a robotic arm during
    dynamic activities such as running, high-frequency vibration, posture changes,
    ocean wave motion and combinations of these. This work demonstrates the potential
    of wearable human–machine interfaces for complex real-world applications.


    Wearable devices have great promise in various applications, such as continuous
    health monitoring$^{1}$, energy harvesting$^{1}$, and human–machine interfaces$^{2}$.
    Wearable inertial measurement units (IMUs) that can capture gestures have proven
    to be particularly valuable for virtual and augmented reality$^{2}$, non-communication$^{2}$,
    physiological monitoring$^{2}$, sports rehabilitation$^{2}$ and robotic control$^{2}$.
    However, gestures are inevitably confounded by motion artifacts in real-world
    applications (Supplementary


    Note: Motion artifacts can arise from environmental activities such as walking,
    running or sitting in vehicles, from the changing orientations of the IMU to the
    gravity vector (Supplementary Figure 1) or com of these. The motion artifacts
    may exhibit similar features to those of gesture signals, or different frequencies
    which vary among individuals. However, recovering gesture signals amid these motion
    artifacts is a major challenge$^{2-10}$.


