    # Reporting


    Further information on this research is available in the Nature Research Report
    Linking to this article.


    # Process for training learning


    For training, we collected data from 6 subjects (5 males and 1 female, aged 21
    to 34) with different motion speeds and forearm lengths (40-50 cm). The data from
    five individuals were used to train the CNN, while the sixth was used for fine-tuning.
    During the testing phase, we used the CNN to determine the output. Notably, 100
    sequences were randomly selected to evaluate the performance of the CNN (Fig.
    3c and Extended Data Fig. 5). This cross-validation approach separates training
    and testing, preventing any data leakage during the process.


    # Data availability


    The material and resources supporting this findings are available upon request.
    The raw data can be found in the Source Data files. Source data are provided with
    this paper.


    # Code availability


    The codes used in gesture recognition and transfer learning are found in a publicly
    accessible repository (https://github.com/zIou/mm/main).


    # Generation of the generated signals


    # References


    Each superimposed signal was generated for 19 superimposed gestures (including
    both identical and different gestures), which produced 342 concatenated signals
    (19 superimposed signals with 8 cm of motion for setting or lowering gestures).
    For each gesture, a randomly weighted segment was concatenated into segments,
    yielding a total of 2,280 segmented motions with signals (Fig. 3F, Extended Data
    Fig. 6 and Supplementary Fig. 4).


    In total, 2,470 signals were generated per gesture, comprising 95 superimposed
    signals and 95 from lying down without motion, 2,280 segmented motions with signals.
    Across all 19 gestures, a total of 46,930 signals were generated per iteration.
    The dataset was split into training, validation and testing sets at a ratio of
    70%:15%:15%. Performance was evaluated across 15 independent runs.


