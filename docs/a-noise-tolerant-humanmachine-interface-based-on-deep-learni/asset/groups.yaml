    Extended Data Fig. 3: Biaxial cyclic stretchability test of the sensors.


    a. Photos of the sensors under simultaneous 100-cycle tensile forces along both
    vertical and horizontal directions up to 200%, showing plastic deformation after
    300 cycles of biaxial stretching tests, which demonstrates the robustness of the
    design. b. Bluetooth signal strength under bi-axial stretching. The RSSI consistently
    remained above -60 dB across all tested levels, indicating stable and continuous
    wireless communication. Two competing effects influence signal strength during
    stretching. First, mechanical strain increases the resistance of the interconnects,
    leading


    to transmission loss (there is, reduced signal strength). Second, as the device
    stretches, the antenna beam progresses away from nearby electronic components,
    reducing parasitic capacitance and thereby decreasing signal loss (that is, improved
    signal strength). Due to these opposing effects, the signal strength initially
    decreases from increased resistance and subsequently increases as parasitic loss
    diminishes. The graph presents the average values, with error bars indicating
    the standard deviation (n = 15 independent measurements).


