    **Extended Data Fig. 5: Efficacy of transfer learning across different numbers
    of gestures.** Confusion matrices of the prediction results are based on a, one-shot,
    b, three-shot, and c, four-shot transfer learning for gesture recognition. In
    one-shot transfer learning, the minimum observed accuracy is 69% for gesture 5,
    which is considered suboptimal. This limitation is attributed to the fact that
    a single gesture signal is obtained from an individual only one posture: either
    sitting or lying down. When two or more shots are used in transfer learning, gesture
    signals during both sitting and lying down are collected. As a result, the recognition
    accuracy can stabilize and converge. Therefore, two-shot transfer learning has
    been adopted because it balances the time for collecting signals and the accuracy
    (Fig. 3c).


