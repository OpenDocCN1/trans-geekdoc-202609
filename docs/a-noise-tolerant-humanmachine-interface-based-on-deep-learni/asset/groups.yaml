    # Article


    The final design used for an experiment to study the two-finger gripper. To enable
    fine-resolution, a multi-electrode array was designed to capture tactile signals
    from individual muscular groups. Integrating such an array with multimodal learning
    demonstrated the capability of executing intricate tasks with greater degrees
    of freedom. The cell was fabricated using the following procedure: CNTs (4 wt%)
    were prepared and blended with PDMS to ensure the uniformity. We used Ecoflex
    for each curing, which allowed stirring to ensure a more dispersion of the CNTs.
    The CNT-doped PDMS was degassed and cast onto the glass substrate. The substrate
    was then plasma treated to form the layer between the electrodes and the circuit
    were removed using mechanical vents. The circuit was then connected using silver
    ink to bond them together.


    # Methods


    ## Preparation


    Several glass slides were cleaned using acetone (IPA) and deionized water. Two
    glass slides were coated with polymethyl methacrylate (PMMA) at 2000 rpm for 30
    s to remove a layer. A layer of Ecoflex was coated at 2000 rpm for 30 s for curing
    on a substrate. The substrate was then coated with polydimethylsiloxane (PDMS,
    Sylgard 184, silicone 10:1) at 2000 rpm for 30 s, for curing in the oven. Separately,
    polymeric (PI, HD Micros) was coated onto Ecoflex (Mist) at 2000 rpm for 30 s,
    followed by baking on a hot plate at 150 °C for 1 h and baking in a nitrogen-protected
    layer at 300 °C for 1 h.


    ## Fabrication of the transfer circuit


    The PI-coated and the CNT-coated glass slides were attached by ultrasonic vibration
    (250 kHz, series ultrasonic, QUASOL II, Novacosam) to reach 80 °C for 10 min.
    For 1 min, the PI-coated film was layered onto the coated glass slide and then
    patterned using pulsed laser (600 W, Laser Mark''s) according to a Custom Auto
    Editor. After removing the material on the patterned film, it was lifted using
    a water-table and then cured at 80 °C for 10 min. The substrate was removed using
    deionized water. After drying, the glass film was cleaned by IPA. The circuit
    was then bonded with silver solder (MS33, LTIP). The solder was used for bonding
    the chips to the patterned film, by curing on a hot plate at 40 °C for 24 min.
    The second layer of Ecoflex was coated at 2000 rpm and cured on the first layer
    slide as the substrate for fabricating the second layer. A solvent was then applied
    to remove Ecoflex at designated locations, using a solvent without access to the
    next and second layer slides. Subsequently, the solvent was removed to reveal
    the first layer. The microcircuit was preprogrammed using a customized evaluation
    approach. The third layer was fabricated on Ecoflex/PMMA-coated glass slide, aligned
    and pressed with the first and second layers through alignment markers observed
    under a microscope. The second and third layers were cured by connecting 0.0 Ω
    resistors on a hot plate at 240 °C for 5 min. Finally, the transfer circuit was
    encapsulated by filling degassed Ecoflex over the 2 glass slides that sandwiched
    the circuit, for low curing at 50 °C for 20 min. The PMMA-coated glass slides
    were removed by IPA.


    ## Fabrication of stretchable substrate


    Four inks were formulated into the stretchable substrate: Ag, ZnO, and TiO (600
    mesh). The Ag ink was used for the circuit, which was formed using a mixture of
    Ag, polystyrene-ethylene- (SEBS) resin toner with a weight ratio of 9.0:1. The
    Zn ink was used for the substrate and was synthesized using Zn, ZnO (25 wt% in
    water) with a weight ratio similar to Ag. The TiO ink was used as the battery
    substrate, prepared by mixing TiO2 with calcium carbonate (33 wt% in water) with
    a weight ratio of 9.0:12.6.

