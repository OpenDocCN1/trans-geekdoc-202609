    effects influence signal strength during stretching. First, mechanical strain
    increases the resistance of interconnects, leading to transmission loss (reduced
    signal strength). Second, as the device stretches, the antenna progresses away
    from nearby components, reducing parasitic capacitance and decreasing signal loss
    (improved signal strength). Due to these opposing effects, the signal strength
    initially decreases from increased resistance and subsequently increases as parasitic
    loss diminishes. The graph presents the average values, with error bars indicating
