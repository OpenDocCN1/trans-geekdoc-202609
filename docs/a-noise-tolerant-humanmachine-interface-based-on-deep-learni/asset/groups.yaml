    ![](img/a586d877770d9adbdea6809f1986596b_16_4.png)


    **Extended Fig. 4:** Illustration of the process for generating the composite
    dataset (for example, gesture 2) with 20 signals of gesture 2 recorded while sitting.
    **b.** Motion artifacts induced by running. These motion artifacts are divided
    into six stages with each stage lasting 1 s. **c.** Motion artifacts induced by
    high-frequency vibrations. These motion artifacts are divided into six stages
    with each stage lasting 1 s. **d.** Motion artifacts induced by the combination
    of high-frequency vibrations and running. These motion artifacts are divided into
    six stages with each stage lasting 1 s. **e.** Superimposed signals for training.
    The superimposed signals are generated by adding motion artifacts to the gesture
    signal (for example, a signal of gesture 2) superimposed with 18 stages of motion
    artifacts in **b** and **d**. The stages are fixed rather than by randomly selecting
    segments from continuous motion artifact recordings. Since random selection can
    unintentionally introduce overlapping segments, where identical portions of motion
    artifacts appear in multiple superimposed signals, using fixed stages is key to
    extracting generalizable features. Otherwise, the model may learn to recognize
    repeated motion artifact patterns instead. To mitigate this, we deliberately divided
    the motion artifacts into distinct, non-overlapping stages.


