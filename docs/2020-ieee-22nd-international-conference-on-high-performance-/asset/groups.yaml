    # 6) Migration


    The AMPOA introduces the migration operation as an additional function to enhance
    its search capability in complex optimization problems. While the migrating search
    group fails, such solution may get into the leader group to recover the current
    best under the condition of rand(0,1) ≤ 0.5 or iterations.


    # C. Algorithmic Flow


    At first, the user-defined parameters of the algorithm and the fitness function
    of the problem are provided as the input to execute the AMPOA. The initialization
    process is performed. Then, at each iteration, the algorithm operations are executed;
    respectively, the evaluation of the function, selection, transformation, migration,
    and update are repeated until the predefined criterion is met.


    # III. THE BINARY ADAPTIVE MULTI-POPULATION OPTIMIZATION ALGORITHM


    A solution to any binary problem is defined as follows


    ```

    $X_i = [x_1^i, x_2^i, ..., x_n^i], x_j^i \in \{0, 1\}$

    ```


    Accordingly, the original AMPOA approach can be adapted to solve the binary problem
    through rounding or transfer functions to be considered as follows


    ## A. The Rounding Approach


    The rounding approach is simple and straightforward for handling discrete optimization
    problems in binary search space. Basically, the first variant of the AMPOA algorithm
    named the BAMOA-R inherits the main body of the continuous AMPOA while adopting
    the following technique


    ```

    $X_i = \begin{cases} 0, & X_i < 0.5 \\ 1, & X_i \geq 0.5 \end{cases}$

    ```


    where $X_i$ is the binary conversion from the continuous variable $x_i$,


    ## B. The Transfer Function Approach


    (11)


    ```

    $S_\theta(x) = \frac{1}{1+e^{-\theta x}}$

    ```


    where $S_\theta(x)$ is a sigmoid function, rand(0,1) is a random number between
    0 and 1, and $\theta$ is set to 1.


    - *Modification: The Local Search Group*

    To update a solution, tanh function is used to conduct the transformation. The
    transformation operations are listed in the following (12)-(13).


    ```

    $X_{i+1} = \begin{cases} 1, & rand(0,1) \leq T(S_i) \\ 0, & rand(0,1) \leq T(S_i)
    \\ 1, & rand(0,1) > T(S_i) \\ 0, & rand(0,1) > T(S_i) \end{cases}$

    ```


    ```

    $T(x) = \frac{e^x - e^{-x}}{e^x + e^{-x}}$

    ```


    where $T(x)$ is a tanh function.


    - *Modification: The Migration Search Group*

    As the De/Rand1 algorithm is involved in the migration search, a group is applied
    in (16).


    ```

    $V_i = \begin{cases} 0, & V_i < 0.5 \\ 1, & V_i \geq 0.5 \end{cases}$

    ```


    where $F = [0.5]$ is the binary factor, the difference $c = 0.3$ is the crossover
    probability, $r1, r2$ and $r3$ are the random numbers to select solutions from
    the migration search group.


    # TABLE I

    A CONCISE DESCRIPTION OF THE BENCHMARK DATASETS


    | Dataset | Features | No. of Features |

    |---|---|---|

    | Congress | Politics | 16 | 435 |

    | Heart | Biology | 13 | 2196 |

    | KrVsWg | Wine | 36 | 3190 |

    | Penguins | Satellite | 15 | 721 |

    | Physical | Physics | 35 | 6435 |

    | Soil | Geology | 20 | 327 |

    | Tree | Biology | 6 | 268 |

    | Tic-tace | Vegetable | 9 | 958 |

    | Waveform | Wave | 18 | 846 |

    | Artificial | Physics | 40 | 5000 |

    | Zoo | Chemistry | 16 | 101 |


    For the second binary variant, the BAMOA-T to utilize the transfer function, the
