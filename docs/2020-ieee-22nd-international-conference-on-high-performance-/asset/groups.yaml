    # 6) 迁移


    AMPOA 引入迁移操作作为一种额外功能，以增强其在复杂优化问题中的搜索能力。当迁移搜索组失败时，该解在 rand(0,1) ≤ 0.5 或达到迭代次数的情况下，可能会进入领导组以恢复当前最优解。


    # C. 算法流程


    首先，将算法的用户定义参数和问题的适应度函数作为输入提供以执行 AMPOA。进行初始化过程。然后，在每次迭代中，执行算法操作；分别重复函数评估、选择、变换、迁移和更新，直到满足预定义的准则。


    # III. 二值自适应多种群优化算法


    任何二值问题的解定义如下：


    ```

    $X_i = [x_1^i, x_2^i, ..., x_n^i], x_j^i \in \{0, 1\}$

    ```


    因此，原始的 AMPOA 方法可以通过舍入或转换函数适配以解决二值问题，考虑如下：


    ## A. 舍入法


    舍入法对于处理二进制搜索空间中的离散优化问题非常简单且直接。基本上，名为 BAMOA-R 的 AMPOA 算法变体继承了连续 AMPOA 的主体，同时采用了以下技术：


    ```

    $X_i = \begin{cases} 0, & X_i < 0.5 \\ 1, & X_i \geq 0.5 \end{cases}$

    ```


    其中 $X_i$ 是连续变量 $x_i$ 的二值转换。


    ## B. 转换函数法


    (11)


    ```

    $S_\theta(x) = \frac{1}{1+e^{-\theta x}}$

    ```


    其中 $S_\theta(x)$ 是 sigmoid 函数，rand(0,1) 是 0 到 1 之间的随机数，$\theta$ 设置为 1。


    - *修改：局部搜索组*

    为了更新解，使用 tanh 函数进行变换。变换操作列于 (12)-(13)。


    ```

    $X_{i+1} = \begin{cases} 1, & rand(0,1) \leq T(S_i) \\ 0, & rand(0,1) \leq T(S_i)
    \\ 1, & rand(0,1) > T(S_i) \\ 0, & rand(0,1) > T(S_i) \end{cases}$

    ```


    ```

    $T(x) = \frac{e^x - e^{-x}}{e^x + e^{-x}}$

    ```


    其中 $T(x)$ 是 tanh 函数。


    - *修改：迁移搜索组*

    由于迁移搜索涉及 De/Rand1 算法，在 (16) 中应用了一个组。


    ```

    $V_i = \begin{cases} 0, & V_i < 0.5 \\ 1, & V_i \geq 0.5 \end{cases}$

    ```


    其中 $F = [0.5]$ 是二值因子，$c = 0.3$ 是交叉概率，$r1, r2$ 和 $r3$ 是从迁移搜索组中选择解的随机数。


    # 表 I

    基准数据集简要描述


    | 数据集 | 特征领域 | 特征数量 |

    |---|---|---|

    | Congress | 政治 | 16 | 435 |

    | Heart | 生物 | 13 | 2196 |

    | KrVsWg | 酒类 | 36 | 3190 |

    | Penguins | 卫星 | 15 | 721 |

    | Physical | 物理 | 35 | 6435 |

    | Soil | 地质 | 20 | 327 |

    | Tree | 生物 | 6 | 268 |

    | Tic-ace | 蔬菜 | 9 | 958 |

    | Waveform | 波形 | 18 | 846 |

    | Artificial | 物理 | 40 | 5000 |

    | Zoo | 化学 | 16 | 101 |


    对于第二种二值变体 BAMOA-T，利用转换函数，原始 AMPOA 的修改描述如下：


    - *修改：随机搜索组*

    随机搜索的每个个体在二值域内执行 rand(0,1) 的随机搜索。


    - *修改：全局搜索组*

    继承由函数 (11) 更新的原始解。相反，根据 (10) 更新解，并使用 sigmoid 函数。


    ```

    $X_{i+1} = \begin{cases} 1, & rand(0,1) \leq S_\theta(S_i) \\ 0, & rand(0,1) >
    S_\theta(S_i) \end{cases}$

    ```


    # IV. 实验结果与讨论


    为了仔细评估建议方法的性能，首先使用最先进的优化器对 BAMOA-R 和 BAMOA-T 在 12 个已知基准数据集上的特征选择进行测试。BAMOA-R 方法在支持向量回归（SVR）的第一组测试中获得最佳性能。在评估中，特征选择被定义为二值优化问题，每个输入特征关联二进制变量
    0 或 1，表示是否被选择。


    ## 基准数据集测试


    如表 1 所示，实验利用了政治、生物等 12 个不同领域。特征的最大数为 32。这些基准数据集可在 [22] 获取。适应适应函数定义如下：


    ```

    $min Fitness = \gamma(C) + \beta\frac{|M|}{|N|}

    ```


    其中 $\gamma(C)$ 是分类器的错误率，$|M|$ 是特征总数，$\alpha$ 和 $\beta$ 代表分类率和集的长度。在评估中，每个数据集按
    80% 和 20% 划分进行了 30 次和 200 次运行。GA 和 PSO 被用传统算法，SBDA 和 SMJO 用于比较的最先进算法。


    - GA: Pa=0.1, C=0.6;

    - PSO: $w1=1.5, w2=2.0, w3=0.8$;

    - SBDA: Ref: [18];

    - SMJO: Ref: [19];

    - BAMPOA: $\alpha=0.08, \beta=0.8, \gamma=0.6, \omega=0.1, \epsilon=0.1$;


    所有算法均用 Python 实现，并在配备 Intel Core i7-9700K (3.6GHz) 和 24GB RAM 的计算机上执行。


    表 II 给出了使用显著性水平为 0.05 的 Wilcoxon 秩检验在 12 个基准数据集上带有优化器的分类器性能。我们发现 BAMPOA 倾向于获得更好的性能。表
    III 列出了每个算法的特征数量，而表 IV 显示了优化器的 CPU 秒执行时间。总体而言，BAMOA-R 和 GA 算法在大多数数据集上的性能显著更好，这些算法的执行时间差异并不大。为了评估建议方法与竞争方法的性能，进行了另一种
    Wilcoxon 和检验。备择假设是建议算法优于竞争算法。结果显示，BAMOA-R 的所有 $p$ 值小于 0.05，BAMOA-T 的准确性为 0.0002-0.046。这表明
    BAMPOA-R 和 BAMPOA-T 在相关数据集上有效地选择了这些特征。


    ## B. 股票指数预测


    在许多金融应用中，股市预测对投资管理、风险评估和市场预测具有重要作用。由于大多数输入特征可能存在噪声且与开发股票任务的机器学习模型无关，特征选择成为执行价格预测挑战的关键过程。


    在本研究中使用带有径基函数的SVR算法预测全球金融市场10个主要股票指数的次日值。所使用的10个股票指数是道琼指数（DJIA）、巴黎40指数（CAC40）、金融指数（FCI）、香港恒生指数（HSI）、恒生指数（HSSI）、纳斯达克综合指数（NKI）、韩国指数（KOSPI）、墨西哥指数（INTR）、上海100指数（N100）、日经225指数（N225）和上海综指（SSE）。


    数据集从2016年1月1日至2018年12月31日收集，为三年。作为指标的最相关特征通过一个名为Tablib的开源库完成。每个输入特征和输出标签都被归一化到0到1范围，以避免特征优化过程中的任何偏差。数据集被分为训练、验证和测试三部分。


    在回归器的训练阶段，采用优化器来选择输入特征。适应度函数根据回归误差和所选特征的百分比定义：


    ```

    $min Fitness = \gamma(R) + \beta\frac{|M|}{|N|}

    ```


    其中 $\gamma(R)$ 是基于大多数数据的回归误差，$|M|$ 是特征总数，[N] 是参数 $\alpha$ 和 $\beta$，其定义与(17)相同。


    种群大小和最大次数（MaxFe）与之前在12个基准数据集上的测试相同。所有算法的参数，除适应度函数中第一句的$\alpha$和$\beta$外，均设置为1.00和0.05。SVR的参数$C_{\gamma}$、$\gamma$
    和 $\epsilon$设置为64、1.0和0.056。


