    S_\theta(S_i) \end{cases}$

    ```


    # IV. EXPERIMENTAL RESULTS AND DISCUSSION


    To carefully evaluate the performance of the proposed methods, both BAMOA-R and
    BAMOA-T are firstly tested with state-of-the-art optimizers to enhance the feature
    selection of K-neighbor classifier on 12 well-known benchmark datasets. BAMOA-R
    approach attaining the best performance in the first set of tests with Support
    Vector Regression (SVR). In both evaluation, feature selection is defined as a
    binary optimization problem where each input feature is associated with binary
    variable 0 or 1 indicating whether it is selected or not.


    ## Testing on the Benchmark Datasets


    As described in Table 1, 12 different domains like politics, biology, etc., were
    utilized in this experiment. The maximum number of features is 32. These benchmark
    datasets are publicly available at [22]. The following fitness function is defined
    in [13]:


    ```

    $min Fitness = \gamma(C) + \beta\frac{|M|}{|N|}

    ```


    where $\gamma(C)$ is the error rate of the classifier, $|M|$ is the total number
    of features, and $\alpha$ and $\beta$ represent the relative importance of classification
    rate and length of set. In this evaluation, 30 and 200 runs were conducted for
    each dataset as split for 80% and 20%. Both GA and PSO were used as conventional
    algorithms, and SBDA and SMJO as state-of-the-art algorithms used for comparison.


    - GA: Pa=0.1, C=0.6;

    - PSO: $w1=1.5, w2=2.0, w3=0.8$;

    - SBDA: Ref: [18];

    - SMJO: Ref: [19];

    - BAMPOA: $\alpha=0.08, \beta=0.8, \gamma=0.6, \omega=0.1, \epsilon=0.1$;


    All algorithms were implemented in Python and executed on a computer with Intel
    Core i7-9700K at 3.6GHz and 24GB of RAM.


    Table II gives the performance of the classifiers with the optimizers on 12 benchmark
    datasets using Wilcox rank statistical test with significance level of 0.05 to
    determine whether the results are statistically significant. We found that BAMPOA
    tends to attend better performance. Table III lists the number of features for
    each algorithm while Table IV shows the execution time of the optimizers in CPU
    seconds. Overall, BAMOA-R and GA algorithms select optimizers that were significantly
    better in performance on most datasets, the differences in the execution times
    over these algorithms are not very distinct. To evaluate the performance of the
    proposed approaches against competing ones, another Wilcoxon sum test was conducted.
    The alternative hypothesis is that the proposed algorithm outperforms the competitors
    for the tasks. The results show that all $p$ values are smaller than 0.05 for
    the BAMOA-R and 0.0002-0.046 for the BAMOA-T in accuracy. This indicates that
    BAMPOA-R and BAMPOA-T effectively select these features on the concerned datasets.


    ## B. Stock Market Index Prediction


    In many financial applications, the prediction of the stock market has a very
    significant role for investment management, risk assessment, and market prediction.
    As most input features may be noisy and irrelevant to develop machine learning
    models for stock tasks, feature selection becomes a very vital process to execute
    the challenge of predicting future prices.


    In this study, the Support Vector Regression (SVR) algorithm with the radial basis
    function (RBF) was used to predict the next day''s values of 10 major stock indices
    of global financial market. The 10 stock indices used are Dow Jones Average (DJIA),
    Paris 40 (CAC40), Financial Index (FCI), Hong Kong Seng Index (HSI), Hang Seng
    Stock Index (HSSI), Nasdaq Composite Index (NKI), Korea Stock Index (KOSPI), Mexico
    Index (INTR), Shanghai 100 (N100), Nikkei 225 (N225) and the Shanghai Composite
    Index (SSE).


    The dataset collected from 1 January 2016 to 31 December 2018 for three years.
    The selection of the most relevant features as indicators was performed by an
    open-source library called Tablib. Each of input feature and the output labels
    were normalized to the range of 0 to 1 to avoid any bias during the process of
    optimization for features. The dataset was split into three sets for training,
    validation, and testing.


    During the training phase of the regressor, an optimizer was employed to select
    the input features. The fitness function is defined in terms of the error regression
    and the percentage of selected features:


    ```

    $min Fitness = \gamma(R) + \beta\frac{|M|}{|N|}

    ```


    where $\gamma(R)$ is the regression error based on most data, $|M|$ is the total
    number of features, [N] the parameters $\alpha$ and $\beta$ with the same definition
    in (17).


    The population size and maximum number (MaxFe) were the same as the earlier test
    on the 12 benchmark dataset. The parameters of all algorithms, except for the
    first clause of the fitness function in $\alpha$ and $\beta$ in the fitness function
    were set to 1.00 and 0.05 respectively. The parameters $C_{\gamma}$, $\gamma$
    and $\epsilon$ of the SVR were set to 64, 1.0 and 0.056.

