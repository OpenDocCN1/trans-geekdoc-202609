    Besides other variants, the proposed algorithms were compared with other competitive
    approaches including PCA, FR, and MI as the popular feature selection methods
    [23] which were used to predict financial data. Our approach compared with SVM
    to construct the PCA-SVM, MI-SVM and FR-SVM. In both MI and FR, the 20 best features
    were selected and used respectively. Additionally, we adopted two-sided methods
    including the LSTM [25] (with LSTM layers with 64 and 32 units) and the RF were
    used to predict the error of the testing data. In VII of these terms, the proposed
    BAMPOA-RA achieved the best among the other 5 indexes. The FR-SVM model produced
    good results on the testing data since the FR is much lower (only 4 times the
    error of time) compared to the testing datasets. Overall, the BAMPOA-RA approach
    is competitive with other competitive approaches for predicting the market indexes
    under our investigation.


    # V. CONCLUSION AND FUTURE WORK


    In this work, we proposed optimization algorithms based on the BAMPOA-namely and
    BAMPOA-T, for the crucial task of feature selection in constructing machine learning
    models for real-world applications. The performances of these algorithms were
    compared with various classification methods through experiments of classification
    using KNN on 12 benchmark datasets and the regression tasks with SVM on 10 major
    indexes of the global financial market.


    For the future, it is interesting to investigate more transformations and techniques
    of the BAMPOA approach. The proposed optimizers can be applied to fine-tune the
    hyperparameters of the machine learning model as FS. But last but not, the proposed
    approaches can be applied to more real-world problems for comparisons with more
    sophisticated deep learning approaches.


