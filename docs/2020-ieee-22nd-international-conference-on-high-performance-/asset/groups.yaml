  mdcn: "\n\n# 应用自适应多种群优化算法增强计算金融机器学习模型\n\nZhixi Li, Vincent Tam, Lawrence K. Young\
    \ and Zhenglong Li\n香港大学电子与工程系\n中国香港特别行政区\nlix@ee.hku.hk\n\n 摘要—在许多现实应用中，开发有效的学习模型以最大化所学模式的泛化能力，同时最小化训练模型的最终成本具有非常重要的意义。由于高度的复杂性和海量数据，选择合适的学习模型将变得更具挑战性。通常，数据科学家和研究人员可能会探索各种算法。在本文中，我们提出了一种自适应多种群优化算法（AMPAOA），利用具有不同搜索策略的多种群来决定使用的参数值。我们通过在12个特征的集合上使用K最近邻分类器增强了特征选择过程。为了确定某个特征对学习模型是否有用，BAMPOAO利用特定函数进行判断。所提出的用于金融应用的优化器——具有重复技巧的BAMPOAO-R方法，在测试实验中识别出了最佳性能。\n\
    \n索引术语—优化、特征选择、机器学习、元启发式算法、股票市场预测\n\n# I. 引言\n\n在机器学习中，特征选择（FS）是降低过拟合风险、提高所学模式的泛化能力以及减少生成的学习模型计算成本的一个非常有挑战性且至关重要的步骤[1]。在许多金融应用中，数据大多是噪声、冗余和/或相关的，因此特征选择对于增强预测模型的性能至关重要[3]。本质上，从完整的输入特征集中找到最优特征子集，以提高最终机器学习模型的性能。\n\
    \n特征选择算法分为三大类：过滤（filter）、包装（wrapper）和嵌入（embedded）技术[4]。过滤技术如信息增益、互信息、费舍分数、相关特征等，仅根据数据的特征对特征进行评估，而不涉及任何学习算法[6]。由于选择机制相对简单，这些技术存在主要缺点，未能考虑所选特征对学习算法性能的影响[4]。\n\
    \n[7]，包装技术将特征选择与学习算法直接连接，因此更容易获得更好的结果。尽管学习模型需要在这个过程中不断重新评估所选特征，但包装技术的计算开销非常大，特别是在处理具有大量特征的复杂学习模型时。但至少嵌入方法是作为特定学习模型的一部分集成的。具体而言，特征的选择和学习模型的训练是同时完成的[8]。\n\
    \n在这工作中，研究重点是包装技术。基本上，每个带有二值变量的优化问题都指定是否包含某个特征。目标是找到穷尽搜索空间的最方法。处理高维数据的特征选择变得越来越困难。例如，如果一个数据集包含20个特征，特征子集的数量为$2^{20}$（即1,048,575）。最近的研究表明，元启发式优化算法是解决这一特征选择问题的可能替代方案，某些算法实现了令人深刻的性能。目前已为机器学习的特征选择提出了许多元启发式方法。示例包括传统方法，如遗传算法（GA）[9]、粒子群优化（PSO）[10）、二值狼群优化（BGWO）[11）、散列搜索算法（SSA）[12）、二值蝗虫优化算法（BGO）[13）、二值搜索算法（BSGA）[14）、二值布谷搜索（BCS）[15]。\n\
    \n第三节详细介绍了使用不同技术的BAMPOA两种变体。第四节分析并讨论了在分类基准数据集和用于预测的股票指数上的实验结果。第五节总结了工作，并为未来的研究方向提供了启发。\n\
    \n最优地受病毒种子[17]启发，自适应多种群优化算法（AMPOA）是一种最近提出的用于处理连续优化问题的元启发式算法。AMPOA将种群智能中的几个有用特征集成到利用多种群的优化算法中。AMPOA方法精心设计了多种群的新型控制机制、解克隆机制和重置操作，以解决复杂搜索空间中的全局或次优解。\n\
    \n# II. 自适应多种群优化算法\n\n在本节中，自适应多种群优化算法（AMPOA）最初受[17]启发，所示：\n\n# A. 种群\n\n在AMPOA中，每个种群由个体组成。种群大小由$N_{pop}$表示。每个个体代表当前问题的一个可能解，正式定义为：\n\
    \n```\n$X_i = [x_{i,1}, x_{i,2}, ..., x_{i,n}]^T, X_i \\in S$\n```\n\n利用基于群体的方法的概念，AMPOA算法设计在多个种群中。AMPOA的整个种群分为五个子类：随机搜索组、全局搜索组、局部搜索组、领导者组和迁移组。根据不同的标准为个体分配不同的搜索行为。通常，每个个体都可以是领导者组中选出的最佳解之一。为了简单起见，认为对于后续的所有决策，只有一个最佳解染色体被选入领导者组，作为种群目前为止发现的最佳解。在具有大步长的全局搜索组中，在整个搜索空间内寻找最佳解。在局部搜索组中在较小的搜索空间内进行局部搜索。随机搜索组中的个体基本上在整个搜索空间内随机行走。最后，迁移组由经典的差分进化算法（DE/rand/1）赋能，其具有与其他搜索组不同的机制，以获得更高质量的解。\n\
    \n# B. 操作\n\nAMPOA方法采用了以下六种操作：初始化、选择、更新、变换和重置，下文解释。\n\n# 1. 初始化\n\n在起始点，整个种群的所有解在搜索空间内通过均匀分布随机生成。为了评估所提方法的性能，在12个基准数据集集上进行了基于K最近邻（KNN）分类器的包装方法比较研究。将BAMPOA算法与包括GA和BPSO在内的传统技术，以及其他先进方法BCS、二值搜索算法（BSDA）[18]和带SMO函数的二值社会优化算法[19]进行了比较。然后，将BAMPOA应用于股票价格预测的实际应用，使用支持向量回归（SVR）预测次日市场指数值。本文的其余部分组织如下。第二节介绍了连续的BAMPOA算法用于\n\
    \n2) 选择：\n\n如上所述，在每次迭代中，从随机搜索组、全局搜索组或局部搜索组中选择最有利的解选入领导者组。当发现新的最优解时，领导者组的个体将被更新。\n\
    \n3) 更新：\n\n更新机制取决于每个种群：\n\n- 随机搜索组：随机搜索组的个体在整个搜索空间内进行随机搜索。\n\n- 全局搜索组：如(2-3)，全局搜索组的通过以下方式更新：\n\
    ```\n$S_i^{t+1} = S_i^t + w(g_{best}^t - S_i^t)$,\n```\n其中$S_i^t$是$t$时刻的解，$w$是权重因子，$g_{best}^t$是$t$时刻种群发现的最佳解，$w\
    \ \\in (0,1)$。\n\n- 局部搜索组：局部搜索组个体的更新函数所示(4-6)：\n```\n$\\delta_i = \\gamma \\delta_i$\n\
    $S_i^{t+1} = X_i^t + \\delta_i$\n```\n其中$X_i^t$是$t$时刻的解，$\\gamma \\in (0,1)$是常数系数，$Gaussian(0,\
    \ \\delta_i)$是均值为0标准差为$\\delta_i$的高斯函数。\n\n- 领导者组：由于领导者组中的个体是最优解，因此不需要更新。\n\n\
    - 迁移组：在AMPOA中，迁移组通过DE算法开发。其大小为$N_{pop}(1-Pr)$。\n\n4) 变换\n\n变换的目标是在个体之间传播信息以提高有效性。AMPOA设计了一种三步机制。第一步，领导者组、全局搜索组和局部搜索组的个体组成源组，而随机搜索组按降序排列的所有解组成目标组。将所有按升序排列的解中的每个排序个体与随机搜索组的排序个体配对。然后，目标组的每个个体根据概率转换为全局搜索组或局部搜索组。例如，配对概率$(P_G^t\
    \ + P_L^t) = 1$表示随机搜索组个体的变换概率。转换为全局搜索组后，对每个个体执行详细更新：\n\n- 变换到全局搜索组：当随机搜索组的个体变换到全局组时，应用单点交叉。随机搜索组个体的每个值将根据预定义概率被配对个体的值。\n\
    \n- 变换到局部搜索组：当随机搜索组的个体与全局搜索组的个体配对时，源组的解转换为局部搜索组。\n\n5) 重置：\n\n由于强大的变换，随机搜索组的所有个体可能会被变换多次，导致局部迁移。重置操作作为一种机制，可以有效恢复全局搜索组或局部搜索组中较差个体的比例，该操作带有每次迭代生成的随机重置参数（0.1到0.9之间）。此外，实现了倍增机制：局部或全局搜索组的一个块将移动到全局搜索组，或者某些选定的随机搜索组个体将在重置过程中发生偏移。\n\
    \n"
