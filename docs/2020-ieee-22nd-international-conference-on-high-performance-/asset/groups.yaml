    在本文中，我们提出了基于 BAMPOA-R 和 BAMPOA-T 的优化算法，用于构建现实应用机器学习模型时关键的特征选择任务。通过在 12 个基准数据集上的
    KNN 分类实验，以及在 10 个全球主要市场指数上的 SVM 回归任务，对这些算法的性能进行了对比。未来，探索 BAMPOA 方法的其他转换和技术是很有意义的。所提出的优化器可以用于机器学习模型的超参数调优。最后但不是最后，我们提出的方法可以应用于更现实的问题，并与更复杂的深度学习方法进行比较。


