    Abstract—Developing effective learning models to maximize the generalization capability
    of the learned patterns while minimizing the ultimate cost of the trained models
    is very significant in many real-world applications. Due to the high complexity
    and huge amount of data, selecting appropriate learning models will become more
    challenging. Typically, data scientists and researchers may explore various algorithms.
    In this paper, we propose an Adaptive Multi-Population Optimization Algorithm
    (AMPAOA), utilizing multiple populations with different search strategies to decide
    on which value of parameters to use. We enhance the feature selection process
    by using K-nearest neighbor classifier classifier on a set of 12 features. To
    determine whether a feature is useful or not for the learning model while the
    BAMPOAO utilizes a specific function to decide on that. The proposed optimizer
    for financial applications, the BAMPOAO-R approach with repeating technique identifies
    the best performance in the test experiments.


    Index Terms—optimization, feature selection, machine learning, metaheuristic,
    stock market prediction


    # I. INTRODUCTION


    In machine learning, feature selection (FS) is a very challenging yet crucial
    step in reducing the risk of overfitting, improving the generalization capability
    of the learned patterns and reducing the computational cost of the resulting learning
    model [1]. In many financial applications, data is mostly noisy, redundant and/or
    irrelevant, so FS is vital to enhance the performance of the prediction models


    [3], Essentially, FS is to find the optimal feature subset of the complete set
    of input features in order to improve the performance of the ultimate machine
    learning model.


    FS algorithms are divided into three main categories: filter, wrapper and embedded
    techniques [4]. The filter techniques, like Information Gain, Mutual Information,
    Fisher Score, Relevance Features, etc., evaluate features based solely on the
    characteristics of the data without involving any learning algorithms [6]. Due
    to the relatively simple selection mechanism, these techniques have major drawbacks
    and fail to consider the effects of the selected features on the performance of
    the learning algorithms [4].


    [7], The wrapper techniques directly connect FS to the learning algorithm, so
    it is more likely to achieve better results. Although the learning model needs
    to be re-evaluated the selected features continuously in this process, wrapper
    techniques are very computationally expensive, especially when processing a complex
    learning model with a large number of features. But at least, an embedded approach
    is integrated as a part of a specific learning model. Specifically, selecting
    the features and training the learning model are done simultaneously [8].


    In this work, the investigation is focused on the wrapper techniques. Basically,
    each optimization problem with binary variables specifies whether to include a
    feature or not. The goal is an optimal approach to find the exhaustive search
    space. It is increasingly difficult to tackle a FS with high-dimensional data.
    In instance, if one dataset contains 20 features, the number of feature subsets
    is 2²⁰-¹ (i.e, 1,048,575). Recent studies show that metaheuristic optimization
    algorithms are the possible alternatives for solving this FS problem in a reason-'
