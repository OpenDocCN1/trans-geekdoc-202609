    ous problems. Section III presents the two variants of the BAMPOA using different
    techniques in detail. The experimental results on the benchmark datasets for classification
    and the stock market index for prediction are analyzed and discussed in Section
    IV. Section V concludes the work and sheds light on potential directions for future
