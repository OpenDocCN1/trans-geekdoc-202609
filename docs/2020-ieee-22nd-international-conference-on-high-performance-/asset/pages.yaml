    \ iterations.\n\n# C. Algorithmic Flow\n\nAt first, the user-defined parameters\
    \ of the algorithm and the fitness function of the problem are provided as the\
    \ input to execute the AMPOA. The initialization process is performed. Then, at\
    \ each iteration, the algorithm operations are executed; respectively, the evaluation\
    \ of the function, selection, transformation, migration, and update are repeated\
    \ until the predefined criterion is met.\n\n# III. THE BINARY ADAPTIVE MULTI-POPULATION\
    \ OPTIMIZATION ALGORITHM\n\nA solution to any binary problem is defined as follows\n\
    \n```\n$X_i = [x_1^i, x_2^i, ..., x_n^i], x_j^i \\in \\{0, 1\\}$\n```\n\nAccordingly,\
    \ the original AMPOA approach can be adapted to solve the binary problem through\
    \ rounding or transfer functions to be considered as follows\n\n# A. The Rounding\
    \ Approach\n\nThe rounding approach is simple and straightforward for handling\
    \ discrete optimization problems in binary search space. Basically, the first\
    \ variant of the AMPOA algorithm named the BAMOA-R inherits the main body of the\
    \ continuous AMPOA while adopting the following technique\n\n```\n$X_i = \\begin{cases}\
    \ 0, & X_i < 0.5 \\ 1, & X_i \\geq 0.5 \\end{cases}$\n```\n\nwhere $X_i$ is the\
