    Optimally inspired by the seeds of viruses [17], the Adaptive Multi-Population
    Optimization Algorithm (AMPOA) is a recently proposed metaheuristic for tackling
    continuous optimization problems. The AMPOA integrates several useful features
    from the swarm intelligence into an optimization algorithm utilizing multiple
    populations. The novel control mechanisms on the multiple populations, solution
    cloning mechanism and reset operation are carefully designed in the AMPOA approach
    to solve the global or sub-optimal solution in complex search spaces.


    # II. THE ADAPT MULTI-POPULATION OPTIMIZATION ALGORITHM


    In this section, the Adaptive Multi-Population Optimization Algorithm (AMPOA)
    was originally inspired by [17] for solving continuous optimization problems provided
    as below.


    # A. Population


    In AMPOA, each population consists of individuals. The population size is indicated
    by $N_{pop}$. Each individual represents a possible solution to the problem at
    hand, and is formally defined as:


    ```

    $X_i = [x_{i,1}, x_{i,2}, ..., x_{i,n}]^T, X_i \in S$

    ```


    Utilizing the concept of population-based methods, the AMPOA algorithm is designed
    in a multiple population. The whole population of the AMPOA is divided into five
    subclasses: random search group, global search group, local search group, leader
    group and migrating group. Different search behaviors are assigned to the individuals
    based on different criteria. Generally, each can be one of the best solutions
    chosen in the leader group. For simplicity, it is considered that for all the
    subsequent decision there is only the best solution chromosome selected into the
    leader served as the best solution found by the population so far. In the global
    search group with large step sizes search for the best solutions within the whole
    search space. In the local search group perform local search in smaller search
    spaces. The individuals in the random search group basically walk random in the
    whole search space. Lastly, in the migrating group is empowered by the Classical
    Differential Evolution (DE/rand/1) algorithm with a different mechanism than the
    other search groups for solutions of a better quality.


    # B. Operations


    Six operations are employed in the AMPOA approach: initialization, selection,
    update, transformation, migration and reset that are explained below.


    # 1. Initialization


    At the starting point, all solutions of the whole population are randomly generated
    in the search space using a uniform distribution function.


    In order to evaluate the performance of the proposed method, a comparative study
    on the wrapper was conducted with the K-nearest (KNN) classifiers on 12 benchmark
    datasets. The BAMPOA algorithm was compared with conventional techniques including
    the GA and the BPSO, other state-of-the-art approach in optimization such as BCS,
    Binary Search Differential Algorithm (SBDA) [18] and Binary Social Optimization
    with SMO function [19]. Then, both BAMPOA were applied to the practical application
    of stock price prediction, using the Support Vector Regression (SVR) to predict
    the next-day ahead of 10 market index values in the global markets. The performance
    of the proposed methods are compared with those of other approaches including
    the SVR integrated with convolutional networks.


