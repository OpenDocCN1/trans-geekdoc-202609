  md: '# 162 CONCLUSION


    # 7.4 CONCLUSION


    There are numerous varieties of dementia, as Lewy body dementia (LBD), vascular
    dementia (VD), and AD, a neurodegenerative condition that primarily influences
    the elderly. A patient will be born every three seconds worldwide, according to
    the 2018 Global AD Report. Globally, dementia affected over 50 million people
    in 2018. Three times as many people will have dementia by 2050—150 million people—as
    are now. As a result, AD detection might aid in more effective treatment. As a
    result, the disease’s progression can be slowed down. Accurately identifying patients
    with AD can be achieved by using ML algorithms. Future AD sufferers could have
    a higher performance categorization thanks to advanced ML techniques. This article
    proposes a hybrid MCDM-based framework to predict AD through audio data. This
    work presented a hybrid framework for the early prediction of AD. First, our voting-based
    FS approach extracts the essential features. After applying the processing-first
    framework, this work uses genetic features. SVM-SMOTE sampling method for handling
    the class imbalance. Then, the voting-based FS approach extracts the essential
    features. Finally, a TOPSIS-based classifier has been applied to these optimal
    features. TOPSIS is an MCDM approach. To assess the resilience and predict how
    the model will perform with unknown data, the suggested framework has been tested
    using classification techniques. The results shows that this approach is promising
    in boosting accuracy.


