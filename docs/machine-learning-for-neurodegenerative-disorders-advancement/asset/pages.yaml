    # 4.2.1.3 Huntington''s Disease


    Huntington''s disease is a hereditary and progressive brain disorder that causes
    uncontrolled movements, emotional problems, and loss of thinking ability (cognition)
    [58]. This rare condition results from a genetic mutation in a single gene [14].
    This disease has been the subject of numerous studies from 2011 to 2022. These
    studies suggest that the worldwide incidence of Huntington''s disease is approximately
    4.88/100,000 individuals, with a 95% confidence interval ranging from 3.38 to
    700 [59]. This disease is characterized by the gradual breakdown of nerve cells
    in the brain, leading to a decline in motor control, cognitive function, and stability
    [33]. Huntington''s disease can appear at any age [59]. The disease is known for
    its wide range of symptoms, which can vary greatly among individuals [60]. The
    most common symptoms include involuntary jerking or writing movements (chorea);
    muscle problems such as rigidity or muscle contraction (dystonia); or abnormal
    eye movements; impaired gait, posture, and balance; and difficulty in speech or
    swallowing [61].'
