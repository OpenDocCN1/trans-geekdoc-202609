    # 5.2 BACKGROUND STUDIES


    Freezing of gait is a common condition in the later stages of PD, in which patients
    experience an involuntary and unexpected condition of immobility with the sensation
    of being stuck to the ground. These conditions can be triggered by stress, anxiety,
    complex surroundings, and attempting to multitask. During FoG conditions, people
    are more prone to stumbling or losing their balance, increasing the risk of falls
    and injuries. As a result of the failure of falling in public, mobility and independence
    are reduced, causing isolation and emotional distress, lowering the overall quality
    of life for people with PD.


    It is worth noting the likelihood of experiencing FoG in PD among individuals
    [8]. FoG does not affect all patients, and when it does, its frequency and severity
    vary. FoG is determined by a variety of factors, including the stage of PD, the
    presence of other symptoms, and differences in disease prevalence [9]. However,
    FoG is more common in advanced stages of PD, although it can appear at any stage.


    A clinical assessment is typically required to diagnose PD, which includes a meticulous
    history review, physical examination to identify motor symptoms, and evaluation
    of the patient''s response to dopaminergic medications. Clinical observation,
    on the other hand, is critical in the diagnosis of FoG. Healthcare providers meticulously
    track their patients'' gait and motor performance by auditing the frequency of
    FoG conditions utilizing wearable sensors or other objective measurement tools.
    The diagnosis phase is critical because it guides the tailoring of treatment strategies
    for Parkinson''s patients [10]. Accurate diagnosis enables healthcare providers
    to comprehend the unique nature of the FoG, which facilitates early and pre-diagnosis,
    which is critical for optimizing treatment and improving mobility. The diagnosis
    of FoG is still a challenging task in PD patients. The application of emerging
    technologies and artificial intelligence has enabled the development of predictive
    models that have the potential to effectively manage and reduce the frequency
    of FoG episodes, improving the quality of life for people living with PD [11].


    # 5.3 METHODOLOGY


    Predicting FoG in PD is an area of research aimed at improving the quality of
    life and ensuring the safety of those suffering from this condition. The methodology
    encompasses a series of critical steps: data acquisition, pre-processing, feature
    extraction and feature selection, model development, and performance evaluation,
    as illustrated in Figure 5.1.


    # 5.3.1 DATA COLLECTION


    Data collection for FoG in PD employs a multifaceted strategy, including clinical
    assessment, video recordings, gait analysis systems, and wearable devices, as
    illustrated in Figure 5.2. This stage collectively contributes to a thorough understanding
    of the FoG condition, encompassing its distinct features, triggers, and its effects
    on affected PD.


    +   * *Clinical assessment: Clinical assessment is the foundation for understanding
    FoG in PD. Neurologists or movement disorder specialists perform comprehensive
    evaluations, observing and documenting various aspects of patients'' conditions,
    such as FoG frequency, severity, and accompanying symptoms. These evaluations
    provide critical foundational data, which is quite useful for subsequent investigations
    [12, 13].'
