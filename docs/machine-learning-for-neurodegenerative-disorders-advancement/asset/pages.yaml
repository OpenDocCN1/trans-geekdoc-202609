    KM can be implemented for efficient clustering. A generalized algorithm of KM
    clustering procedure defined below.


    +   - Set the initial values of the KM at random for a specified number of iterations.

    - Repeat each group or cluster.

    - Determine which mean is closest to the item by comparing each mean''s Euclidean
    distance to the group.

    - Assign the cluster to represent the mean.

    - Adjust the mean by moving it to the cluster''s average value.


    The following are the iterative steps in KM clustering algorithm.


    +   1. Determine the data points (x1, y1), (x2, y2), ..., (xn, yn) in 2D space
    from the anisotropic-tropically diffused 2D image to generate differentiated clusters
    with its corresponding data points.

    2. Learn and initialize the mid-value or the centroid value of the image in 2D
    space.

    3. Assign the number of clusters, C=4 (i.e., C1, C2, C3, and C4) and decide four
    random seed points or the centroids in those particular clusters.

    4. In the first iteration, determine the distance between each data point with
    the four seed points by means of Euclidean distance formula. Let the random seed
    points with respect to the four clusters be (A1, B1), (A2, B2), (A3, B3), (A4,
    B4). Euclidean distance, D for the first data point and the four seed points is
    given by


    ```

    D=√((x1-A1)^2 + (y1-B1)^2) for C1

    D=√((x1-A2)^2 + (y1-B2)^2) for C2

    D=√((x1-A3)^2 + (y1-B3)^2) for C3

    D=√((x1-A4)^2 + (y1-B4)^2) for C4

    ```


    (9.5)


    5. Calculate the cluster number by knowing the minimum value of Euclidean distance
    among the four distances calculated. If the distance in cluster C2 has the minimum
    value, then that cluster number is assigned to the particular data point (x1,
    y1).'
