    Another option is the voting-based FS. When creating a predictive model, FS [18]
    is an approach of minimizing the number of features or variables. Minimizing the
    number of variables is preferable if it can lower the model''s computing cost
    and, in some situations, enhances the model''s performance. Statistical-based
    FS algorithms choose the input variables with the highest correlation with the
    statistical relation between each and the target variable. Voting ensembles [19]
    is an ensemble technique used to train numerous models. The output is the result
    of the predictions from each model. In contrast to voting ensembles, models for
    bagging and boosting techniques use the same algorithm. Furthermore, unlike voting
    ensembles, the weights and aggregations are carried out here. On the other hand,
    ensemble techniques like stacking and blending include algorithms of risky models
    and methods.


    In this research, we have created an ensemble-based statistical method. Here,
    different statistical k-based FS have been used: Chi-square (CSQ) [20], mutual
    information (MI) [21], variance threshold (VT) [22], sequential forward selection
    (SFS) [23], SVM-recursive feature selection (SVM-RFE) [24], and relief [25]. Relief
    is an algorithm that was created in 1992 by Kira and Rendell. It selects features
    using a filter-method approach and is very sensitive to sensitive attributes.
    It was initially used in binary classification involving discrete or continuous
    features. Relief gives a feature score, which is used to rank and the Chi-square
    test used to assess each feature''s relevance to the target variable in the context
    of FS. It can evaluate each feature''s significance and choose the most instructive
    ones by calculating the Chi-square statistic and the p-value that goes along with
    it. MI operates on the variables which are one another. MI-based FS for choosing
    a subset of features. When selecting features, this method considers MI between
    features and classes. It employs a greedy strategy to select a feature subset
    that maximizes information about the class label. To improve classification performance,
    SVM-RFE can eliminate comparatively unimportant features and filter features.
    The sequential feature selector selects a feature subset greedily by adding (ahead
    selection) or removing (backward selection) features. Based on an estimator''s
    CV score, this selects the optimal feature to add or remove at each step. This
    sequential feature selector solely selects the features in the context of unsupervised
    learning, not the outputs (y). Whose variance is less than a threshold are eliminated.
    All zero-variance characteristics—features with the same value across all samples—are,
    by default, eliminated. Here, first we set the k value (i.e., number of features)
    then by the above FS method, we will select the FS algorithm through the voting
    approach. Here, our primary objective is reducing the error rate (through LOOCV
    approach).


    # 7.2.3 MCDM-BASED CLASSIFIER


    After selecting the number of features, we choose the best class via the technique
    for order preference by similarity to ideal TOPSIS [26], an MCDM method. The core
    notion of TOPSIS is that the optimal solution is the one that is furthest from
    the (negative ideal) and most distant from the (positive ideal). The goal of the
    generic MCDM method is to evaluate and rank alternatives $X_u(u=1,2,3,...,V)$.
    The list of options $X_u$ represents the possibilities that need to be prioritized
    by the decision-maker. The group of qualities when evaluating the options, $Y_j$,
    indicates the elements influencing the decision-maker’s'
