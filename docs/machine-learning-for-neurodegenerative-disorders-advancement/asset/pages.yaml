    +   * Speech features: Patients suffering from PD frequently experience speech
    difficulties, such as reduced voice volume and poorly articulated speech. The
    extraction of important characteristics from speech data includes pitch, loudness,
    speech rate, and articulatory precision. Speech impairments can be assessed using
    this comprehensive evaluation.

    * Kinetics features: Kinetic characteristics include joint forces, torques, and
    center of mass (COP) parameters. These characteristics aid in the evaluation of
    the biomechanical components of motion and equilibrium, providing useful information
    about muscular weakness, postural instability, and motor control.

    * Frequency and time-domain-domain features: The frequency components of various
    signals, such as power spectra obtained from accelerometers or electromyography
    data, can be analyzed to detect motor abnormalities and tremor features in PD.
    Time-domain features, which are typically extracted using techniques such as wavelet
    or Fourier transform, provide insights into the temporal characteristics of the
    signals and aid in the detection of patterns or irregularities.


    # ### 5.3.3 MODEL DEVELOPMENT


    Model development is a crucial step in which various machine learning techniques
    are analyzed for designing an efficient diagnostic system for FoG in PD. FoG is
    a disturbing symptom of PD, which is often assessed objectively. Samà et al. have
    identified accelerometer-based features that are utilized with machine learning-based
    classifiers, achieving 91.7% specificity and 87.4% specificity in real-life settings
    [23]. Moore et al. [24] have validated ambulatory FoG monitors using ankle-mounted
    sensors with an accuracy of 89% (10% false positives), potentially improving FoG
    management in PD patients.

    Detecting freezing in Parkinson''s patients is crucial for fall prevention, and
    wrist-mounted sensors have a 90% FoG detection rate, which has improved user acceptance
    over lower limbs. Wrist sensors provide a feasible alternative for FoG detection
    without compromising accuracy [25]. Tripoliti et al. have detected FoG in Parkinson''s
    patients using body-worn sensors and a four-stage methodology. The evaluation
    with different sensor configurations revealed a method achieving 98.74% specificity,
    81.94% specificity, 98.6% AUC, and 96.11% accuracy with random forests classification
    [26]. Orphanidou et al. have employed learning models to predict FoG in advance,
    using accelerometer data from eight patients,'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'demonstrating high sensitivity and specificity, with support vector machines
    (polymonial kernel) outperforming other methods. Applying the classification algorithm
    to five-second windows with 18 features achieved balanced accuracies of 91% for
    walking, 90% for FoG, and 82% for transitions [5].


    # 5.3.4 PERFORMANCE EVALUATION


    Performance evaluation is critical in determining the efficacy of models developed
    for detecting FoG in PD. The precision of the FoG classification-based predictive
    model is calculated by dividing the number of real positive predictions by the
    total number of positive predictions, represents the model''s ability to avoid
    false alarms, which is crucial for patient safety. Sensitivity assesses the model''s
    ability to identify true positive cases, which is critical for timely intervention.
    Specificity measures the model''s ability to correctly classify negative cases,
    whereas the number of unnecessary alerts. The accuracy metric provides an overall
    measure of correct predictions, providing a robust evaluation metric. Root mean
    square error (RMSE) evaluates the model''s predictive accuracy in continuous FoG
    severity estimation, whereas the AUC-ROC evaluates the model''s ability to distinguish
    between FoG and non-FoG states. Score balances precision and recall, providing
    a comprehensive measure of model performance. Pearson correlation measures the
    linear relationship between predicted and observed FoG severity by allowing for
    the evaluation of prediction quality on continuous scales. These metrics, as presented
    in Figure 5.5, work together to assess the dependability and practicality of FoG
    detection models for PD.


    ```

    Accuracy = \frac{TP + TN}{TP + FP + TN + FN} (5.1)

    ```


    ```

    Precision = \frac{TP}{TP + FP} (5.2)

    ```


    ```

    Specificity = \frac{TN}{TN + FP} (5.3)

    ```


    ```

    Sensitivity = \frac{TP}{TP + FN} (5.4)

    ```


    ```

    Kappa (K) = \frac{Fo - Fe}{1 - Fe} (5.5)

    ```


    ```

    RMSE = \sqrt{\frac{\sum_{j=1}^{U} (f_j - g_j)^2}{U}} (5.6)

    ```


    ```

    Pearson Correlation = \frac{\sum_{j=1}^{U} (f_j - \bar{f})(g_j - \bar{g})}{\sqrt{\sum_{j=1}^{U}
    (f_j - \bar{f})^2 (g_j - \bar{g})^2}} (5.7)

    ```


    ```

    F1 - score = \frac{2 * Precision * Recall}{Precision + Recall} (5.8)

    ```'
