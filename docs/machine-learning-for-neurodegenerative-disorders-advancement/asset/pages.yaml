    capture sequential dependencies has also been beneficial in tasks like predicting
    neurodegenerative disease progression from longitudinal imaging.


    However, traditional RNNs face challenges such as vanishing or exploding gradients,
    limiting their effectiveness in capturing long-term dependencies. Gated recurrent
    units (GRUs) have been introduced as specialized neural architectures with improved
    memory and gradient flow. These variants have enhanced the capability of RNNs
    to model and interpret complex sequential patterns, leading to improved performance
    in various neuroimaging applications [38].


    # 2.7 CONNECTIVITY ANALYSIS AND GRAPH THEORY


    # 2.7.1 The Brain As a Network


    Connectivity analysis and graph theory have become pivotal in understanding the
    organization of the brain as a complex network. The brain is not only an intricate
    graph of specialized regions but also a network of interconnected nodes, where
    each node represents a distinct brain region, and edges signify the functional
    or structural connections between them [46]. Connectivity analysis, often employed
    in neuroimaging studies using techniques like fMRI or DTI, allows researchers
    to investigate how different brain regions communicate and collaborate. Graph
    theory provides a mathematical framework to analyze and quantify the topological
    properties of these networks, revealing crucial insights into the brain’s structural
    and functional organization [10].


    Functional connectivity assesses the temporal correlations between brain regions,
    elucidating patterns activity and resting-state networks [49]. Structural connectivity,
    on the other hand, examines the anatomical links between regions, often inferred
    from white matter tractography through DTI. Graph theory metrics such as centrality,
    cluster-coefficient, and modularity quantify to measure the network properties
    of the brain [50].


    The application of connectivity analysis and graph theory has greatly enhanced
    our understanding of normal brain function, cognitive processes, and neurological
    disorders. Studies using these techniques have investigated diverse topics, including
    the identification of hubs in the brain network associated with higher cognitive
    functions and the alterations in network properties in conditions Alzheimer’s
    disease or schizophrenia. Overall, connectivity analysis and graph theory provide
    a powerful framework to explore the brain’s intricate architecture and offer valuable
    insights into both healthy and pathological states [51].'
