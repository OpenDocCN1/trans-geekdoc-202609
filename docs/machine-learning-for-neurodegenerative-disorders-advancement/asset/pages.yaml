    # 6.3 ALZHEIMER’S DISEASE PATHOPHYOLOGY


    Alzheimer’s disease is a neurological disease that causes people to lose their
    memory and abilities. It is still a challenging issue to solve. Even though the
    etiology of amyloid is still unknown, researchers have found intriguing answers
    to the pathological riddle to help explain how illness eventually destroys brain
    function [11].


    Amyloid plaques and tangles are the two main characters at the center of this
    complex web. Where tangles are caused by the misfolding and clustering of tau
    protein, amyloid plaques are aberrant protein deposits created by the accumulation
    of beta-amyloid peptides. These aberrant aggregates act to impair normal neuronal
    activity and communication inside the brain. Their exact functions are still for
    discussion. The hippocampus is an important area for memory creation and retrieval,
    and it is the weakest spot of AD frequently seen. The points of contact between
    neurons, or synapses, are weakened by the buildup of tangles and amyloid plaques,
    which impairs signal transmission and causes general memory loss. Following this,
    brain regions show a steady decline in cognition, language, and even physical
    capacities due to cause cellular damage [12, 13].


    Another possible cause of oxidative stress, is a cause of imbalance between antioxidants
    and free radicals. Free radicals—chemicals that injure cells—appear to hasten
    the degeneration of neurons. In AD, the development of tau angles and amyloid
    plaques, as well as damage to brain, may be linked to chronic inflammation, genetic
    susceptibility also appears an important component. Apart from these well-known
    participants, gene such as apolipoprotein E (Apo-E4), may affect how amyloid is
    processed or how proteins fold, increasing the likelihood of AD. Astrocytes are
    the primary source of ApoE production under normal physiological conditions. ApoE
    is engaged via ABC cassette transporters ABC1 and ABCG1. When pathological situations,
    including injury, stress, and aging, occur, ApoE4 impairs lipid metabolism in
    astrocytes, which lowers the clearance of amyloid beta (Aβ) proteins. The possible
    role of environmental variables such as diabetes, cardiovascular illness, and
    head traumas in the development of the condition is also being studied [15].'
