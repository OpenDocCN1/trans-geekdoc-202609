    # Machine Learning for Neurodegenerative Disorders


    and has profound effects, there is still no conclusive diagnosis available before
    death of disease development. It is projected by 2050, the number of Alzheimer''s
    disease patients in the United States could reach approximately 13.8 million [15].
    Alzheimer''s disease is a progressive neurodegenerative disorder that primarily
    affects older adults, although early-onset cases do exist [10]. It is the most
    common cause of dementia and a general term for a decline in mental ability severe
    enough to interfere with daily life [16]. Alzheimer''s disease is characterized
    by a gradual deterioration of cognitive functions, including memory, thinking,
    orientation, comprehension, calculation, learning capacity, language, and judgment
    [17]. However, consciousness is typically not affected. The disease begins with
    mild symptoms, such as forgetfulness and difficulty in remembering recent events
    or conversations. As the disease progresses, patients may experience memory loss;
    disorientation; mood and behavior changes; deepening confusion about events, time,
    and place; unfounded suspicions about family, friends, and professional caregivers;
    more serious memory loss and behavioral changes; and difficult speaking, swallowing,
    and walking [18].


    The pathology of Alzheimer''s disease is defined by two abnormalities (Figure
    4.1): amyloid beta (β) protein plaques and neurofibrillary tangles. Amyloid beta
    is a fragment of a larger protein called amyloid precursor protein, which, when
    misfolded, forms plaques between neurons and disrupts cell function [19]. These
    proteins are natural products of brain cell activity. Gial cells usually manage
    small to moderate amounts of Aβ without issue. However, excessive production and
    accumulation of Aβ disrupt neuronal function. Originating from the amyloid precursor
    protein, AB peptides consist of 36–43 amino acids. The most common forms contain
    40 and 42 amino acids (AB40 and A42), with the 42 and 43 amino acid variants showing
    a greater propensity for clustering together. These variants are primarily responsible
    for neuronal damage in Alzheimer''s disease [19]. In contrast, neurofibrillary
    tangles are twisted fibers of another protein tau build up inside cells [20].
    Healthy neurons, which are critical for brain functions, are connected to each
    other


