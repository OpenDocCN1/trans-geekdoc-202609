    of Alzheimer’s Disease


    # A Comparative Analysis of Neural Network Approaches


    Suchismita Das and Udita J. Monani

    School of Computer Engineering, KIIT Deemed to be University,

    Bhubaneswar, India


    Biswajit Jena

    Siksha ‘O’ Anusandan (Deemed to be University),

    Bhubaneswar, India


    # 6.1 INTRODUCTION


    Alzheimer’s disease (AD) is a common neurological illness that can be fatal. It
    is marked by a gradual deterioration in cognitive function, memory loss, and behavioral
    abnormalities. Neurotic plaques, neurofibrillary tangles, and the degradation
    of nerve cells are its hallmarks [1]. The World Health Organization (WHO) and
    other organizations report that the prevalence of AD is startlingly high and is
    on the rise as a result of aging populations. To highlight the need for efficient
    diagnostic techniques, we use the most recent statistics. These organizations
    estimate that 50 million people globally suffer from AD, and that figure rise
    to 152 million by 2050. More than 5 million people in the US alone suffer from
    AD, which is higher in women than in men. This disease has a significant financial
    and psychological impact on individuals, families, and healthcare systems; the
    global expenses are estimated to be $1 trillion [2, 3]. Figure 6.1 shows Medicare
    and Medicaid estimates for the cost of AD (in millions of US dollars) in women
    during the upcoming 2050s. Estimated on variable prevalence documented in several
    large studies, and although gender distribution is not supported by all studies,
    the prevalence of AD is higher in women than men. In the age group 65–69, 0.7%
    of women and 0.6% of men suffer from the disease, increasing frequencies of 14.2%
    and 8.8% in individuals aged 85–89 years.


    With a person with AD typically has five years to live after diagnosis, it is
    critical to establish efficient diagnosis and treatment plans. In order to enhance
    early diagnosis and treatment results, this project seeks to perform a thorough
    assessment of the literature on the detection of AD with a particular focus on
    the integration of modern imaging techniques and artificial intelligence (AI)
    methodology [4, 5]. Prior review articles have mostly focused on particular datasets
    and traditional diagnostic techniques, frequently ignoring the examination of
    AI-driven strategies and the possible incorporation of genomics. In order to fill
    these gaps, we offer a thorough analysis of deep learning (DL) and machine learning
    (ML) models for AD diagnosis. Additionally, we investigate the potential benefits
    of merging genomic and imaging data .'
