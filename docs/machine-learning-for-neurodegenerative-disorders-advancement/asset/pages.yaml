    # ##7.1 INTRODUCTION


    The growing older population is the primary demographic characteristics of developed
    countries, facing the rise of various age-related difficulties. Alzheimer’s disease
    (AD) [1] is one of the most common disorders and a significant cause of disability
    and loss of self-sufficiency in the elderly. The worldwide battle against AD faces
    a significant challenge in the early detection of AD at the pre-clinical or early
    phases (mild cognitive impairment [MCI]), especially in light of the potential
    benefits of both secondary prevention and disease-modifying treatment. Early diagnosis
    also provides AD [2] patients and their carers with the chance to plan and recover
    the proper to help control symptoms. It is believed that 75% of people living
    with dementia do not have a diagnosis. Despite this, the diagnostic coverage rate
    is still inadequate. The development of precise, user-friendly screening instruments
    for the early diagnosis of AD and MCI is becoming more and popular in this field.
    With an estimated 50 million people affected by the disease and about 10 million
    new cases annually globally, the World Health Organization (WHO) declared it a
    public health emergency.


    The process of early disease diagnosis is time-consuming and expensive since it
    requires extensive data collection, the use of advanced prediction algorithms,
    the involvement of an experienced physician. Automated systems can be employed
    in decision support systems because they are less prone to mistakes and more accurate
    than human assessment. Nowadays, researchers are using machine learning (ML) and
    deep learning-based classifiers for early AD prediction.


    Nasrolahadeh et al. [3] use genetic programming (GP) as data-driven evolutionary
    computation-based model creating a computer-aided diagnosis system for detecting
    AD. This approach uses a voting-based system to choose a group of the most discriminant
    features that result in the maximum accuracy of the final classification.


    Yildiz et al. [4] presented a method that favors for majority vote, feature selection
    (FS), classification, and multilevel feature extraction (FE)—a local feature-extraction
    method built on the binary tree—extracted features from audio signals. Chi2 and
    the iterative neighborhood component


