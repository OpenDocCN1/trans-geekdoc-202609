    reliability. These metrics typically include the following:


    +   i. **Accuracy**: The proportion of correct predictions made by the model out
    of all predictions.

    ii. **Precision**: The ability of the model to correctly identify only those individuals
    who have ASD.

    iii. **Recall (sensitivity)**: The ability of the model to identify all individuals
    who have ASD.

    iv. **F1-Score**: The harmonic mean of precision and recall, providing a balance
    between the two.

    v. **Kappa coefficient**: A statistical measure that accounts for the possibility
    of the agreement occurring by chance, providing a more nuanced assessment of the
    model''s accuracy.


    These metrics offer a comprehensive evaluation of the model''s performance, allowing
