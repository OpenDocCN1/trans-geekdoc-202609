  md: '# 8.3.3.1.3 Standardization and Normalization of Numerical Features


    For numerical attributes like age and screening score, standardization or normalization
    can be applied.


    +   - *Standardization of age*: Adjust the age to have a mean of 0 and standard
    deviation of 1.


    ```

    $$\text{Age} = \frac{\text{Standardized - Age}}{\sigma_{\text{Age}}}$$ (8.6)

    ```


    where $\mu$ Age is the mean age, and $\sigma$ Age is the standard deviation.


    +   - *Normalization of screening score*: Rescale the screening score to a range
    [0, 1].


    ```

    $$\text{Screening Score}_{\text{Normalized}} = \frac{\min(\text{Screening Score})}{\max(\text{Screening
    Score}) - \min(\text{Screening Score})}$$ (8.7)

    ```


    # 8.3.3.1.4 Binary Encoding for Binary Responses


    For attributes born with jaundice, family member with PDD, used the screening
    app before, and Question 1 to Question 10 answers, binary encoding is appropriate
