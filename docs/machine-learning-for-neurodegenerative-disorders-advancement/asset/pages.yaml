    # 10.1 INTRODUCTION


    Drowsiness detection has been the focus of a number of methods, including visual
    features and biological signals. On the one hand, video-based drowsiness detection
    applications are effective and resilient to changes in light and noise. However,
    compared to visual features, biological signals are the most accurate predictors
    of drowsiness. Thus, monitoring serves as a means of increasing security for the
    benefit of human well-being. As a matter of fact, this subject is increasingly
    significant in healthcare applications to enhance medical assessment. The stage
    of transition between waking and sleep, known as drowsiness, is when the decline
    in attentiveness is seen. This phase, which precedes the sleep state, is marked
    by a near lack of reflexes and, as is incompatible with tasks that demand high
    levels of alertness. The primary characteristics of this state are heaviness in
    noise, behavioral abnormalities, decreased reflex, and difficulties maintaining
    the head in the frontal position within the field of view.


    Brain signals are one type of physiological marker that can monitor behavior,
    manners, and mental health. The use of brain signals in brain-computer interfaces
    has been initiated since electroencephalography (EEG) was developed to record
    brain signals without the need for complex setups. The technology for EEG recording
    has evolved dramatically. Signals can be recorded using dry electrodes. The systems
    additionally include software for removing artifacts and noise. EEG signals are
    one of the best indicators of drowsiness and alertness variance, according to
    a number of research on brain signals and drowsiness detection. It is possible
    to study the EEG signal temporal and spatial domains. The identification of tiredness
    using EEG involves the application of signal processing techniques, feature extraction
    methods, and classification approaches. Important feature extraction techniques
    that have demonstrated excellent efficiency in numerous research is in this state.


    Based on 2015 highway reports, the National Highway Traffic Safety Administration
    (NHTSA) identified 89,000 accident caused by drunk drivers. Forty thousand people
    were injured in the accidents. In 2018, there were 636 deaths related to drunk
    drivers. However, NHTSA acknowledges that the exact number of crashes, injuries,
