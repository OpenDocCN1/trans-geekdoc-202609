    # 6.5 DISCUSSION


    # 6.5.1 NEW FINDINGS AND CLAIMS


    Transcending the conventional suspects, such as tau and amyloid, a group of newly
    discovered biomarkers become attractive candidates. A more complete picture of
    early-stage onset was provided by blood-based neurofilament light chains, genetic
    variant, and metabolic markers obtained from brain imaging. This window of opportunity
    for early identification, before substantial cognitive deterioration occurs, may
    provide a vital head start for therapeutic intervention.'
