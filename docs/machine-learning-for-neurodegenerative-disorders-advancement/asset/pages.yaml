    a high degree of accuracy [106]. For example, a deep learning model can analyze
    structural data from thousands of protein-ligand complexes and learn patterns
    that dictate how molecules bind to proteins. By applying these patterns, AI models
    can predict the binding orientations and affinities of new drug candidates, often
    more quickly than traditional computational docking methods. This method is particularly
    beneficial in high-throughput screening scenarios, where thousands of compounds
    need to be evaluated in a short time [89].


    Moreover, AI-driven molecular docking simulations often equal quality or better
    than traditional methods. This improvement is partly due to the ability of learning
    models to consider a broader range of interactions and factors that influence
    binding, including subtle changes in proteins and dynamic aspects of ligand binding
    [106]. Additionally, AI models incorporate advanced techniques such as reinforcement
    learning, where the system learns the best docking strategies through a process
    of trial and error [13]. This approach allows the development of novel molecular
    strategies for AI that have not been considered traditional methods. Importantly,
    these AI-driven simulations can reveal potential off-target effects, where a drug
    might bind to unintended proteins, leading to side effects [107]. AI models aid
    in the design of more selective and safe drugs by predicting these off-target
    interactions. This advantage not only speeds up the drug discovery but also enhances
    the likelihood of identifying effective and safe drug candidates, potentially
    reducing the time and cost associated with bringing new drugs to market.


    # 4.3.4 Generative Models for Drug Design


    Generative models in AI, particularly generative adversarial networks (GANs) and
    variational autoencoders (VAEs), represent a revolutionary approach in the field
    of drug design. These models are unsupervised models in which the system is trained
    to generate new data that are similar to the input data [103]. In the context
    of drug discovery, generative models are trained on vast libraries of molecular
    structures and their properties, enabling them to generate new, drug-like molecules
    with desired characteristics. GANs achieve this through this unique architecture
    comprising two networks, a generator and a discriminator, which compete against
    each other. The generator creates new molecular structures, while the discriminator
    evaluates the authenticity of the structures against real data. This competition
    drives the generator to produce increasingly accurate and realistic structures
    [108].


    VAEs offer another approach for generating new molecular structures. VAEs are
    trained to encode molecules into a low-dimensional latent space and decode this
    representation back into molecular structures. By exploring this latent space,
    VAEs can be interpolated and extrapolated from known molecules to create novel
    structures that possess desired chemical or biological activities that are relevant
    for treating neurodegenerative disorders, such as blood–brain barrier permeability,
    receptor binding affinity or metabolic stability. This targeted design enables
    the creation of drug candidates that are not only effective but also provide an
    improved safety profile [110].


    The use of generative models for drug discovery is particularly for addressing
    the complex andmultif nature of neurodegenerative disorders. These diseases often
    require drugs that can interact with multiple targets or pathways simultaneously.
    Generative models can be trained to take into account multiple pharmacological
    factors, enabling the design of multarget drugs [103]. For instance, a model can
    be trained on data from compounds to modulate specific pathways involved in Alzheimer’s
    disease, allowing it to generate molecules that are likely to have a therapeutic
    effect on the disease''s progression. AI-driven models can be used to modify the
    molecular structures of existing drugs to improve their efficacy or reduce side
    effects, a process known as molecular optimization [111]. Furthermore, their ability
    to precisely target molecules for specific therapeutic targets opens new avenues
    in the design of more effective and safe medications. As these models continue
    to evolve and improve, they are set to transform the future of pharmaceutical
    research and development.'
