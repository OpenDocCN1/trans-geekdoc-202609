    # 6.7 CONCLUSION


    In this literature, we looked at the approaches and results with ML and DL technologies.
    Before the data we fed into several methods, including SVMs, regression, decision
    trees, and random forests, it underwent a series of methodological stages, including
    data analysis, pre-processing, feature extraction, and data splitting. This method
    had quicker model training processes, required less domain-specific knowledge,
    and was more intuitive.


    On the other hand, CNNs and RNNs were used in DL approaches; each had a design
    specific to why they proved more accurate at tasks like picture identification
    and classification for two-dimensional data. Time series analysis and natural
    language processing are applications that found great use RNNs, which were created
    for sequential data. Longer training times and greater processing power are required
    for the more automated DL procedure. Thus, the decision between ML and DL comes
    down to the practical needs and limitations of the application.


