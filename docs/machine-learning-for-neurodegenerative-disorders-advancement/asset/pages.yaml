    The disease usually affects people over 60 years old, early-onset Parkinson''s
    disease can occur [40, 41]. Currently, there is no cure for Parkinson''s disease,
    but various treatments can provide significant relief from symptoms [12].


    Parkinson''s disease, as shown in Figure 4.2, involves a cascade of events triggered
    by dopamine, leading to the characteristic motor symptoms. Dopamine, acting as
    chemical messenger, coordinates movement within specific brain circuits. When
    dopamine levels plummet, intracellular network factors fail, Lewy bodies, clumps
    of alpha-synuclein protein, emerge as a hallmark feature, wreaking on remaining
    neurons. The exact role of these Lewy bodies and alpha-synuclein remains under
    investigation, they are believed to contribute to dopamine degeneration. Additionally,
    chronic inflammation and increased oxidative stress, prevalent in Parkinson''s,
    further damage and kill neurons. This inflammatory response and free radical production
    exacerbate the damage by α-synuclein accumulation [42].


    The loss of dopamine, a neurotransmitter, results in abnormal brain activity,
    leading to symptoms of Parkinson''s disease [43]. Patients may also experience
    a wide range of nonmotor symptoms, such as depression, fatigue, pain, cognitive
    impairment, sleep disturbances, and autonomic dysfunction.'
