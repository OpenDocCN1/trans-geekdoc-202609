    # 2.6.3 TIME-SERIES ANALYSIS IN fMRI


    Time-series analysis in fMRI is a crucial aspect of neuroimaging that involves
    the examination of brain activity over time [10]. fMRI captures the blood oxygen
    level-dependent (BOLD) signal, providing a temporal record of neural activity.
    Time-series analysis techniques aim to extract meaningful information from these
    temporal signals, enabling the investigation of dynamic patterns and connectivity
    within the brain.


    One common approach in time-series analysis is seed-based correlation analysis,
    where the correlation between this seed and other brain regions is computed [30].
    This method provides insights into functional patterns and has widely used to
    explore resting-state networks. Another technique is ICA, which decomposes fMRI
    data into spatially and temporally independent components, revealing distinct
    networks of activated brain regions [45].


    Dynamic connectivity analysis goes beyond static connectivity by examining how
    patterns change over time. This is particularly relevant for understanding the
    temporal dynamics of brain networks during cognitive tasks or resting. Additionally,
    graph-based analyses assess the brain''s functional connectivity as a complex
    network, characterizing the organization of nodes (brain regions) and edges (connectivity)
    over time.


    Time-series analysis in fMRI plays a crucial role in unveiling the temporal dynamics
    of brain function and connectivity. These techniques contribute to our understanding
    of cognitive processes, neural plasticity, and the altered patterns associated
    with neurological and psychiatric disorder [46].


    # 2.6.3.1 Dynamic Time Warping


    Dynamic time warping (DTW) is a powerful technique in time-series analysis that
    allows for the comparison and alignment of time-varying sequences, even when they
    exhibit temporal distortions. Originally introduced in the context of speech recognition,
    DTW has widespread applications in various fields, including neuroscience and
    neuroimaging. DTW addresses the challenge of comparing time-series data with different
    patterns, making it particularly relevant for fMRI studies.


    In neuroimaging, DTW has been applied to align and fMRI time series, allowing
    researchers to uncover temporal patterns and synchronize functional activations
    across different brain regions. For instance, the work by Liao et al. [47] used
    DTW to align fMRI time series obtained from multiple subjects, facilitating the
    identification of consistent patterns in brain activity over time, providing valuable
    insights into functional connectivity and dynamic networks [47].


    One of the strengths of DTW is in its flexibility to handle variable temporal
    lengths and warping, making it well suited for studying dynamic interactions in
    the brain. Moreover, DTW has been applied to align time-series data in other neuroscientific
    domains, such as EEG and MEG, showcasing its versatility in analyzing temporal
    dynamics across different modalities [48].'
