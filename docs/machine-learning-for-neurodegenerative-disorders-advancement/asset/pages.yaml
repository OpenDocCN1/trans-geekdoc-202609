    # ## 2.1 INTRODUCTION


    Neuroimaging is a multidisciplinary field that plays a pivotal role in understanding
    the structure and function of the human brain. It encompasses a variety of techniques
    designed to visualize and map the neural activity and anatomy. Advances in neuroimaging
    have significantly contributed to our understanding of cognitive processes, neurological
    disorders, and brain development. This article explores the historical evolution
    and key modalities of neuroimaging, shedding light on the transformative impact
    it has on neuroscience [1].


    The roots of neuroimaging can be traced back to the late 19th century when scientists
    Santiago Ramon y Cajal pioneered techniques that allowed visualization of individual
    neurons under the microscope. However, it wasn''t until the mid-20th century that
    advancements in technology paved the way for non-invasive imaging of the living
    brain.


    One of the earliest neuroimaging techniques, electroencephalography (EEG), measured
    in the 1920s, measures electrical activity in the brain through electrodes placed
    on the scalp, providing a temporal perspective on brain function. Complementary
    to EEG, magnetoencephalography (MEG) measures the magnetic fields generated by
    neuronal activity, offering high temporal resolution [2].


    The 1970s marked a turning point with the advent of structural imaging techniques
    such as computed tomography (CT) and magnetic resonance imaging (MRI). CT provides
    detailed structural'
