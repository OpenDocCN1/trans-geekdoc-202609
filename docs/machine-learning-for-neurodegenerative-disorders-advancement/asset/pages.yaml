    # 3.3 EXTRACTION OF INFORMATION FROM LITERATURE REGARDING NEURODEGENERATIVE DISORDERS


    Named entity recognition is an NLP task that involves identifying and classifying
    named entities within unstructured text into predefined categories. In the context
    of biomedical and healthcare research, NER plays a crucial role in extracting
    disease entities from vast volumes of scientific literature, clinical notes, and
    EHRs. This provides an introduction to the significance of NER for identifying
    disease entities, its applications, and the challenges in the process. The abundance
    of information on diverse diseases found in the biomedical literature and clinical
    records makes NER crucial for knowledge extraction and data mining. Researchers
    and physicians can collect pertinent information for analysis, therapy, and decision-making
    by identifying disease entities. Finding relevant articles, case studies, and
    clinical trials for disorders is easier with the use of NER. Disease entity recognition
    is the cornerstone for biomedical knowledge graphs, which link diseases to related
    genes, proteins, symptoms, and treatments. By lifting through literature to find
    disease-drug relations, NER helps to find viable medications for ailments.


    Disease entity challenges in NER


    +   **Ambiguity:** Disease names may have various connotations or be synonymous,
