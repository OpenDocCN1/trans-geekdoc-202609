    As demonstrated in Figure 4.3, Huntington''s disease is caused by a genetic mutation
    in the huntingtin gene (HTT), which leads to the production of an abnormal version
    of the huntingtin protein. This mutation involves an expanded guanine-adenine-guanine
    (GAG) nucleotide repeat in the gene. Normally, this is repeated 10 to 35 times
    within the gene, but with Huntington''s disease, it is repeated 36 to more than
    120 times [62, 63]. As result, an abnormal version of the huntingtin protein is
    produced, which accumulates in the brain, causing the degeneration of neurons.
    This degeneration primarily affects the basal ganglia and cerebral cortex, leading
    to impairments in movement, cognition, and behavior associated with the disease
    [64]. Huntington''s syndrome is unique among neurodegenerative disorders due to
    its genetic predictability; children of a parent with Huntington''s disease have
    a 50% chance of inheriting the faulty gene [65]. There is currently no cure for
    Huntington''s disease, and there is no way to slow or stop the brain it causes.
    However, there are treatments available to help manage symptoms of the disease
    and improving quality of life [66].

    Treatment for Huntington''s disease focuses on managing symptoms and improving
    quality of life [67]. Medications are often employed to manage mood disorders
    associated with Huntington''s disease. Table 4.3 presents an overview of current
    pharmacological strategies for treating Huntington''s disease. Several therapeutic
    approaches targeting various aspects of the disease''s symptoms and underlying
    causes are highlighted. Dopamine receptor blockers are common in Huntington''s
    although they can lead to side effects such as dystonia and psychosis [68]. Glutamate
    modulators, including memantine, aim to modulate glutamate, reducing excitotoxicity
    and offering neuroprotective benefits [69]. Specifically selective serotonin reuptake
    inhibitors (SSRIs), such as fluoxetine; and norepinephrine reuptake inhibitors
    (SNRIs), such as duloxetine, also manage the mood disorders and depression frequently
    associated with Huntington''s disease [70, 71]. Tetrabenazine, which targets vesicular
    monoamine transporter 2 (VMAT2), is employed to control chorea and can be used
    for depression [72]. Innovative gene silencing therapies, such as antisense oligonucleotides
    (ASOs), with tomersen as a prime example, represent a novel approach that targets
    the genetic root of the disease. These therapies work by reducing the production
    of mutant huntingtin protein and are currently under clinical investigation, potentially
    offering a way to modify the progression of the disease.'
