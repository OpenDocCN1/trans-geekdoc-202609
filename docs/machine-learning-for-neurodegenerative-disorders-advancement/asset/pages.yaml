    promise for drug discovery and repurposing. In drug development laboratories,
    robotic systems can automate repetitive and time-consuming tasks such as high-throughput
    screening of compound libraries. AI can enhance the capabilities of these systems,
    enabling them not to perform tasks more efficiently but also analyze the results
    of these screenings to identify drug candidates [90]. AI algorithms can analyze
    the thousands of compounds to identify most effective against specific targets
    in neurodegenerative diseases [154]. AI can be integrated with technologies such
