    Decision trees are foundational components of ML algorithms, widely applied in
    various domains, including AD detection. In this context, decision trees are initially
    trained without tuning, allowing the algorithm to create a tree structure based
    on features extracted from the dataset. Subsequently, grid search techniques are
    employed to optimize parameters such as tree depth and evaluation criterion, which
    may include the Gini index or entropy. Decision trees offer interpretability but
    are susceptible to overfitting, requiring pruning and parameter optimization to
    enhance generalization and model robustness. Despite these limitations, decision
    trees provide valuable insights into the salient features contributing to AD diagnosis,
    in the development of effective diagnostic models [22].


    Random forests represent an ensemble learning technique designed to address the
    limitations of individual decision trees. The aggregating predictions from multiple
    decision trees improve performance and stability. Each decision tree in the ensemble
    is trained independently, and the final prediction is determined through voting
    or averaging mechanisms. This approach mitigates overfitting and variance issues
    enhances robustness of the model. Random forests incorporate grid search and cross-validation
    techniques to handle large and high-dimensional datasets, random forests are well
    suited for AD detection tasks, where identifying patterns in complex data is crucial
    for accurate diagnosis. In conclusion, random forests offer a powerful framework
    for developing reliable and effective models for AD diagnosis, facilitating early
