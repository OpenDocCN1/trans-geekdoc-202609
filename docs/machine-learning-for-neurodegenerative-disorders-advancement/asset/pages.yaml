    # Data preprocessing steps


    +   - Tokenization: The process of dividing a text into smaller parts, such as
    words or subwords (tokens), to make analysis and processing easier. All content
    should be converted to ensure case-insensitive processing and prevent information
    from being duplicated as a result of different word spellings.

    - Stop removal: A common preprocessing step in NLP involves eliminating common
    words that are considered to be of little value in determining the meaning of
    a text. These words, known as stop words, are often frequent and don''t carry
    significant meaning when removing. Stop words help reduce noise in the data and
    can improve the efficiency of downstream NLP tasks. It involves getting rid of
    frequent words like “the” and “is,” which have little meaning and can contaminate
    data.

    - Punctuation removal: Eliminating punctuation, including periods and commas,
    does not advance the text semantic meaning. Punctuation removal is a common preprocessing
    step in NLP. The purpose of removing punctuation is to simplify the text data
    and focus on the meaningful content of the words. Punctuation, as commas, periods,
    and quotation marks, doesn''t always contribute significantly to the semantic
    meaning of the text and can introduce noise during analysis. Remove punctuation
    marks from each token or during word. Common punctuation includes commas, periods,
    exclamation marks, question marks, quotation marks, parentheses, etc.

    - Lemmatization and stemming: Taking words to their simplest or forms to handle
    variants (such as running, ran, and to run). Stemming removes prefixes or suffixes
    from words to obtain the root or base form, known as the stem. The goal is to
    reduce words to a common base, even if the result is not a valid. For the word
    “running,” the stem would be “run.” Stemming might also turn “happily” to “happ”.
    Lemmatization, on the other hand, reducing words to their base or dictionary form,
    known as the lemma. The result is always a valid word, and the process considers
    the word''s context to determine the appropriate base form. Example: For the word
    “running,” the lemma will be “run.” Similarly, “better” would be lemmatized to
    “good.”

    - Corpus creation: A sizable collection of text data used for NLP model training
    and evaluation. To create reliable NLP models that can handle a variety of linguistic
    patterns, a high-quality corpus must be built.


