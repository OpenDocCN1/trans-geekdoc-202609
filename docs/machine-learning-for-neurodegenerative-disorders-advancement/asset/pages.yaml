    effective treatments make it prime candidate for the application of AI technologies,
    especially ML and deep learning. These technologies have been applied to various
    aspects of Alzheimer’s disease research, leading to notable advancements and promising
    developments. The endeavor to create effective treatments for Alzheimer’s disease
    involves significant challenges in both complexity and financial investment. Research
    and development costs for new Alzheimer’s treatments are estimated at approximately
    $5.7 billion, a figure nearly times greater than for developing cancer drugs [1].
    The most recent drug got FDA approval in this domain, aducanumab, targets amyloid
    a monoclonal antibody. Its primary action is to reduce the accumulation of β-amyloid
