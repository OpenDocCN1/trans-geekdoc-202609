    # 7.2 DEMONSTRATION OF THE PROPOSED APPROACH


    Here we will give a detailed explanation of the proposed method for the prediction
    of AD through audio data. Figure 7.1 shows the pictorial representation of the
    flowchart of the proposed approach. Section 7.2 will discuss the processing techniques
    that have applied in the proposed approach. Section 7.2.2 will discuss how we
    can avoid the class imbalance problem in the proposed approach. Then, Section
    7.2.3 will describe the voting ensemble-based FS approach. Finally, Section 7.2.4
    will explain how the MCDM-classifier has been used to create the predicted model.


    # 7.2.1 PRE-PROCESSING


    Audio pre-processing is a crucial step in getting audio data for analysis or processing
    numerous methodologies are employed to improve the caliber of audio signals, essential
    features, and noise reduction effect significantly reduces background and broadband
    noise, while signal quality is only slightly compromised. Historically, one of
    the earliest methods is spectral subtraction [15]. This method estimates the clean
    speech by subtracting the noisy speech spectrum from the noisy speech spectrum
    which is conducted during speech phases. In this article, we applied the spectral
    subtraction noise reduction method to the audio dataset. Then, we apply the Mel-frequency
    cepstral coefficient approach [16] to extract meaningful, important, or essential
    features. A group of coefficients known as MFCCs are used to represent the features
    of a sound signal''s power spectrum. They are produced by using a filter such
    as the Discrete Fourier transform (DFT) to convert the unprocessed audio input
    into a frequency domain and then using the Mel to scale how the human ear perceives
    frequency. Lastly, the Mel-scaled spectrum is used to compute cepstral coefficients.


