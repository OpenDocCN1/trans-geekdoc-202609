    towards the possibility of diagnosing AD at an early stage, tailoring the most
    effective treatment [56]. However, because we must prevent this work from stagnation,
    it is important to discuss these ways to test emerging diseases in the first instance
    [96]. In this review, we will present the advantages and pitfalls of AD blood
    tests to draw a reasonable conclusion about their clinical utilization.'
