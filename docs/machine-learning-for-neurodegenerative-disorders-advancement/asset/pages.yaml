    by predicting potential developments at the intersection of ML and neuroscience.
    The section highlights challenges that need to be addressed for continued progress
    in this area. Finally, Section 1.1.10 presents the conclusion of the chapter.


    # 1.2 BASICS OF MACHINE LEARNING


    This section defines ML and its core concepts, including supervised, unsupervised,
    and RL. The section also explains standard ML algorithms as decision trees, support
    vector machines, neural networks, and deep learning.


    # 1.2.1 MACHINE LEARNING CORE CONCEPTS


    ML is a subset of artificial intelligence (AI) that involves the development of
    algorithms and models that allow computers to learn from data and improve their
    performance on a specific task without being explicitly programmed (Pavarino et
    al., 2023). ML enables systems to automatically adapt and improve based on experience,
    making it particularly useful for tasks that involve complex tasks, large datasets,
    and where explicit rule-based programming is challenging. The core concepts of
    ML includes the following.


    # 1.2.1.1 Data


    Data are the foundation where devices are built and foster human operations. They
    include all kinds of information, structured or unstructured; algorithms can process
    to extract meaningful patterns. Structured data are organized into rows and columns,
    normally in data sources or spreadsheets, and it is much easier to evaluate. Data
    are the raw information that is used to train and test ML algorithms. Disorganized
    information, such as text, pictures, and video clips, which do not have a predefined
    layout, allowing for more innovative preprocessing methods (Pavarino et al., 2023).
    High-quality data are essential as they directly influence the efficiency of ML
    designs. They include raw inputs, historical records, sensor results, and any
    other relevant details that inform the knowing process. The quality, quantity,
    and variety of the information considerably the design''s capability to generalize
    and make precise predictions. It can encompass various formats, such as numerical
    values, video, images, or audio (Choi et al., 2023). In supervised learning, data
    consists of pairs of input features and their corresponding labels (outputs).
    In unsupervised learning, the data may consist solely of input features without
    labeled outcomes.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 1.2.1.2 Features


    Features are individual attributes or characteristics of the data that are used
    as inputs to the ML algorithm. They represent the information that the algorithm
    will use to make predictions or classifications. Features can vary in type; they
    could be numerical (for example, temperature or age), categorical (for instance,
    gender or color), or more complex in types (such as text or images). The input
    variables used by ML models to discover patterns and make (Zheng et al., 2023).
    Attributes can be numerical, specific, or binary, they must be thoroughly chosen
    and crafted to guarantee the model''s effectiveness. Feature option involves picking
    one of the most pertinent features from the dataset. In contrast, feature design
    produces brand-new features or changing existing ones to better stand for the
    underlying framework (Azad et al., 2023). The quality and relevance of functions
    directly affect the design''s performance, as pointless or repetitive attributes
    can introduce sound and reduced precision.


    # 1.2.1.3 Label or Target


    In supervised learning,the label (target) is the output or outcome the algorithm
    aims to predict based on input features. For example, in a medical diagnosis scenario,
    the label could indicate whether a patient has a particular disease (Moreno-Rodríguez
    et al., 2023). During training, the algorithm learns the relationship between
    the input features and the corresponding labels. In a binary category, tags could
    be “0” or “1”, showing the lack of visibility of a specific condition. Labels
    can be categorical, numerical, or binary, depending upon the nature of the trouble.
    Accurately identified information is vital for training efforts, as incorrect
    labels can mislead the procedure and break down performance. By not-being watched
    understanding, there are no labels, and the design intends to locate patterns
    within the data (Góriez et al., 2023).


    # 1.2.1.4 Algorithm


    An algorithm is a set of mathematical and computational rules that the ML system
    follows to learn from the data (Schmidgall & Hays, 2023). Algorithms are designed
    to discover patterns, relationships and relations within, enabling the model to
    make predictions or decisions. Algorithms can be categorized by the kind of learning
    they assist in, such as monitored, supervised, semi-supervised, and support understanding.
    Illustrations include decision trees, linear regression, neural networks, support
    vector machines, and clustering algorithms. Each algorithm has its strengths and
    weaknesses, and the choice of algorithm relies on the details of the problem being
    handled, the nature of the data, and the preferred result (Jaison et al., 2023).
    The algorithm iteratively refines the input data, readjusting the mistakes and
    enhance its anticipating prediction.


    # 1.2.1.5 Training


    Training exposes the ML model to a dataset containing input features and corresponding
    labels. During training, the algorithm adjusts its internal parameters to learn
    the patterns and labels that enable accurate predictions or classifications (Jiang,
    2023). The algorithm aims to generalize its learning to unseen data. During training,
    the model iteratively changes its criteria to lessen the mistakes between its
    predictions and the actual labels. This entails making use of a loss function
    to gauge the discrepancy and optimization, such as gradient descent, to upgrade
