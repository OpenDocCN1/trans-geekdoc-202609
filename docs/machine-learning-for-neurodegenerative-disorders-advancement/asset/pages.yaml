- pgno: 22
  md: 'generally improve, guiding the agent toward optimal actions. The algorithm
    is considered “off-policy”, meaning it learns the best actions regardless of the
    agent''s current behavior, allowing it to explore and exploit simultaneously.
    Q-learning is straightforward and effective for many problems, but it can become
    impractical when dealing with large or continuous state spaces because the Q-table
    grows too large to manage (Kraninger et al., 2023). The agent learns a Q-value
    function that estimates the expected cumulative reward for a specific action from
    a state, guiding decision-making.


    # 1.2.4.2 Deep Q-Networks


    A DQN²⁰ is an extension of Q-learning using deep neural networks to approximate
    the Q-value function. DQNs enhance Q-learning by using deep neural networks to
    handle environments with vast or continuous states, where Q-tables would be infeasible.
    Instead of using a Q-value for every state-action pair in data, a DQN uses a network
    to approximate these values. The network outputs for all actions, allowing the
    agent to select the best action (Kraninger et al., 2023). Training the neural
    network using past experiences in a replay buffer experiences are randomly sampled
    to break the correlation between consecutive states, stabilizing the learning
    process. DQNs also use a separate target network updates frequently to provide
    stable Q-values for training (Jaison et al., 2023). This technique prevents the
    feedback loop that can cause instability in learning. DQNs have proven effective
    in complex environments like video games, where they can learn to play at superhuman
    levels. However, they require significant computational resources and careful
    parameter tuning to perform and they can struggle with problems involving sparse
    rewards or high-dimensional action spaces (Kraninger et al., 2023).


    # 1.2.5 Other Algorithms


    # 1.2.5.1 Naive Bayes


    Naive Bayes²¹ is an inmate of probabilistic algorithms based on Bayes'' theorem,
    with the “naive” assumption that features are independent given the class label.
    Despite this simplification, Naive Bayes models perform surprisingly well in many
    real-world applications, especially for classification problems like spam detection
    and sentiment analysis. There are different types of Naive Bayes classifiers,
    including Gaussian, Multinomial, and Bernoulli, each suited to different types
    of data (Huang et al., 2023). The algorithm calculates the posterior probability
    of each class given the input features and predicts the class with the highest
    probability. This includes simplicity, efficiency, and effectiveness with large
    datasets and high-dimensional data (Wang et al., 2023). Naive Bayes can struggle
    when the independence assumption is violated or when dealing with small sample
    sizes and highly correlated features. It is frequently used for text classification
    and spam filtering.


    # 1.2.5.2 Neural Networks


    These are computational models inspired by the human brain''s function. They consist
    of layers of interconnected nodes (neurons), where each connection has an assigned
    weight. The input layer receives raw data, which is transformed by hidden layers
    using activation functions, culminating in the output layer that produces the
    final (Rodriguez et al., 2023). Each neuron processes input data, applies a weight,
    adds a bias, and passes the result through an activation function. The network
    learns by adjusting these weights and biases during training using backpropagation
    and optimization algorithms such as gradient descent (Poikonen et al., 2023).
    Neural networks are versatile and can model complex, nonlinear relationships in
    data, making them suitable for a wide range of tasks, including image recognition,
    natural language processing, and game playing. They require large amounts of data
    and computational resources, and they can be prone to overfitting without proper
    regularization. Various architectures, such as feedforward, convolutional, and
    recurrent networks, cater to different data types and tasks (Currey et al., 2023).'
