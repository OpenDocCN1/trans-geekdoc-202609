  md: '# A Novel Machine Learning Model


    +   * Notch filtering reduces interference by removing particular small frequency
    bands, like the 50/60 Hz frequency linked to electrical power lines.

    * Artifact rejection eliminates from any portion of the EEG data that exhibit
    notable artifacts. Often, this is accomplished by establishing thresholds for
    amplitude or other traits that point to the existence of artifacts.

    * The advanced method known as independent component analysis (ICA) breaks down
    the signal into its individual components. Based on their spatial and temporal
    properties, artifacts are recognized as separate components and are then eliminated
    or fixed.

    * Adaptive filtering uses filters that change their properties instantly in response
    to an incoming signal. Using adaptive filters to address non-stationary phenomena
    can be especially beneficial.


    It is essential to thoroughly inspect the filtered EEG data to ensure that no
    additional artifacts have been introduced and that the relevant brain signals
    remain unaltered during the filtering process. Validating the filtering method''s
    efficacy through a comparison of the filtered data with established brain activity
    patterns is also essential.

    A filter is a mathematical technique that operates on a digital dataset to extract
    useful information while removing irrelevant information. Filtering methods are
    mostly used to keep the frequency component of a particular signal.


    A simple convolutional filter, such as a mean filter, works in the removal of
    artifacts which is based on a kernel. The mean filter, also known as the average,
    is a windowed filter that smoothes the signal. The filter performs a low-pass
    function. The basic idea underlying filtering is to take an average of any fine
    detail (picture) in its neighborhood.

    This simple filter is chosen so as not to disturb the fine details of the data
    points. A straightforward convolution with the kernel of the filter yields better
    results which can be forwarded to the proposed method of AI learning.


    # 10.3.3 MACHINE LEARNING THROUGH A K-Means CLUSTERING ALGORITHM


    K-Means clustering is a vector quantization method derived from signal processing
    that tries to split N observations into K clusters, with each observation belonging
    to the cluster with the nearest mean (cluster centers or centroid), which serves
    as the cluster''s prototype. Unsupervised ML is the process of teaching a computer
    to use unlabeled, nameless material while allowing the algorithm to work on without
    supervision [27]. Without any prior data training, the machine''s task in this
    situation is to arrange unsorted data based on parallels, patterns, and variances.
    K represents clustering; data points are assigned to one of the K clusters based
    on their distance from the cluster center. It is by randomly designating the cluster''s
    centroid in space. The data points are then assigned to one of the clusters depending
    on their distance from the cluster''s centroid. After assigning each point to
    a cluster, new clusters are created. This algorithm iterates until it finds a
    suitable cluster. In the study, we assume that the number of clusters is predetermined
    and we must allocate points to one of the groups.


    For the KMC algorithm we define the clusters using cognitive state. Cognitive
    state refers to information processes of the brain, being conscious or unconscious
    depending on what an individual knows about the situation they are in. Cognition
    can be defined as the process by which someone''s thoughts are organized, understood,
    and transformed into language with some degree of permanence. Cluster number is
    defined using five cognitive states, which are extremely sleepy, very drowsy,
    moderately sleepy, slightly sleepy, and alert. Alerts are given in the order they
    are mentioned so as to prioritize the contention of alert. Training data is obtained
    from the references. The KMC algorithm calculates the centroids and iterates until
    it finds the optimal centroid. Here K represents the number of clusters identified
    from data by algorithm.'
