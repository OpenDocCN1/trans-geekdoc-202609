    # 8.3.3.1.1 Handling Missing Data


    For attributes like age, gender, ethnicity, born with jaundice, and family member
    with PDD, it’s essential to managing missing values to maintain data quality.


    +   i. Imputation for age: If some age are missing, you can use imputation to
    fill in the missing values.


    ```

    Imputed Age = \sum_{i=1}^{N} Age_i

    ```


    where N is the number of non-missing age entries.


    +   ii. Imputation for categorical attributes: For categorical attributes like
    gender or ethnicity, mode imputation could be:


    ```

    Imputed Value for Gender = Mode(Gender)

    ```


    where mode is the most frequent value in the dataset.


    +   iii. Record removal: If an attribute has screening score is missing, and this
    attribute is critical, the entire record might be removed:


    ```

    Remove record if Screening Score is missing.

    ```


    # 8.3.3.1.2 Encoding Categorical Variables


    For attributes like gender, ethnicity, born with jaundice, family member with
    PDD, country of residence, relation,class/ASD, and who is completing the test,
    categorical encoding is necessary.


    +   i. Label encoding for gender: Convert the gender attribute to numeric labels.


    ```

    Gender Encoded = \begin{cases} 0 & \text{if Male} \ 1 & \text{if Female} \end{cases}

    ```


    +   ii. One-Hot Encoding for Ethnicity: Convert the Ethnicity attribute to binary
    variables for each ethnicity.


    ```

    Ethnicity_{Category} = \begin{cases} 1 & \text{if ethnicity is Category} \ 0 &
    \text{otherwise} \end{cases}

