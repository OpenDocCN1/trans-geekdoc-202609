    shown to detect early signs of drowsiness [12]. To achieve this, we introduced
    an encoding-decoding framework, leveraging EEG signals to estimate Percentage
    of Eye Closure (PERCLOS), a widely adopted measure of drowsiness [13]. We established
    a linear relationship between EEG features and PERCLOS, estimating unknown parameters
    via the least-square method. Additionally, we defined the state transition of
    PERCLOS, independent of EEG data, and estimated another set of parameters using
    the least-square approach. This approach introduced a novel dynamic modeling solution,
    utilizing EEG signals to estimate the instantaneous level of drowsiness, anchored
