    # 6.2 SEARCH STRATEGY AND STATISTICAL DISTRIBUTIONS


    # 6.2.1 PRISMA MODEL


    Extensive research was done on PubMed, Google Scholar, and Scopus. “Alzheimer’s
    disease,” “detecting Alzheimer’s disease,” “Alzheimer’s machine learning,” and
    “Deep learning” were used for searching. A total of 6,181 articles were identified
    of all keywords searched. There were three exclusion criteria: (i) duplicate articles,
    (ii) articles with insufficient information, and (iii) non-related articles. After
    the exclusion criteria were met, we underwent a further exclusion procedure (i.e.,
    accessibility of full-text articles). After applying these exclusion procedures,
    a total of 42 articles were identified for the final selection for review, as
    shown in Figure 6.3.


    # 6.2.2 STATISTICAL DISTRIBUTION


    # 6.2.1 Publication Trend


    We received statistics that the number of articles about AD increased over time.
    Figure 6.4 shows that more and more research is being spent on AD research as
    society ages and understanding of AD. The number of articles about AD has increased
    over time, bringing the total for ten years to 95,876.


    # 6.2.2 Distribution of AI-based Models


    The importance of DL and ML in AD detection has been demonstrated, and since 2017,
    the number of articles published in this area has increased rapidly, as shown
    in Figure 6.5. The numbers in the figure show pre-printed and peer-reviewed articles
    which do not include chapters and dissertations. There are nine preprints and
    105 peer reviews.


    Various approaches for the detection of AD ML and DL. With the number of documents
    selected through the PRISMA model, the most common model is the DL model, which
    is around 83.7%, followed by ML at 16.3%. The ML-based approaches are clustering,
    SVM, logistic regression, decision tree, KNN, and hybrid. The DL-based approaches
    are convolutional neural networks (CNNs), autoencoders, 3D multi-stream multi-scale
    deep convolution networks (3D MSCNN), and recurrent neural networks (RNNs), which
    are preferred, as shown in Figure 6.6.'
