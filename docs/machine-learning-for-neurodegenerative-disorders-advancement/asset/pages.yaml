  md: '# 11 Challenges and Future Directions in Applying Machine Learning to Neurodegenerative
    Disorders


    Harish Gavel, Rahul Kumar, and Chandrasekhar Azad

    National Institute of Technology, Jamshedpur, Jharkhand, India


    # 11.1  INTRODUCTION


    Like a tornado of synapses, our large brains sweep more brain cells and connections
    than anyone on Earth – when it works properly [1]; but if at any moment this fails,
    thoughts blossom, waltzes, and emotions flash like lightning across the dance
    of neurons [2]. However, the tune transforms into discord when the music fades
    and turns into an abyss of neurodegenerative diseases [3]. Alzheimer’s, Parkinson’s,
    amyotrophic lateral sclerosis (ALS) – they are harsh conductors guiding a slow
    death march that robs movement and mind until life succumbs as well. But in this
    symphony of doom, no out of optimism but out the rising crescendo to machine learning.


    Now imagine a future in this merciless age [4], instead of the first tremor in
    a hand, remember a mistake that lost will set off an ML-based alarm leading to
    early detection, allowing for course correction, or better prevention [5]. Imagine
    bespoke care that have sewn the tapestry of every individual’s DNA exposing their
    MRI image and clinical records [6]. Think of the immense datasets that have been
    previously silent and unforgiving being converted by ML into stories telling tales,
    exposing invisible intricacies, leaking tips for the progression of diseases such
    as a virus but also pointing out where treatments, perhaps we thought about, are
    rarely investigated [7]. This is not far-fetched modern science fiction but the
    immunity of ML will affect the fight against neurodegenerative disorders [8].


    But the journey to promised land is fraught. The fuel of the ML machine is data
    [9], with individual variability. A few systems have been developed separately
    using neural patterns that behave like the human brain. Still, it is much harder
    and less reliable than what can be achieved by any well-trained analytical algorithm
    [10]. What is an interesting algorithm? An even more problem with the new AI industry
    continues inherently inscrutable black boxes from which esoteric solutions to
    complex problems spill out like in a a movie [11]. It’s a fact that there are
    walls separating us from ML’s high paying potential [12].


    This chapter takes us on through this complex terrain, where the challenges and
    opportunities of ML in neurodegenerative disorders converge like neural branches.
    We will dive deep into the data problem, unpacking novel approaches such as wearable
    sensors and federated learning that hold hope for unlocking the gold of human
    experiences. In this regard, we will look further into the realm of interpretable
    AI – where algorithms are stripped from their black-cloak and show how they make
    certain predictions, building trust to utilize them in clinical applications [13]
    Is this road toward personalized medicine where every patient journey becomes
    a data point with unprecedented resolution guiding treatments. Before all, we
    try to map out a way to


