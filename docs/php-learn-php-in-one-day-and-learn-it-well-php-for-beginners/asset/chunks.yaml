    before our project. In this chapter, we are going to learn to manage errors and
    exceptions in our PHP scripts. Frankly speaking, this is one of the messiest areas
    in PHP as PHP differentiates between an exception and an error. When something
    goes wrong, we’ll get either an exception or an error. Internal PHP functions
    mainly give us errors when something goes wrong. Modern object-oriented extensions
    (such as the PDO extension we learned in the previous chapter), on the other hand,
    are more likely to use exceptions. In this chapter, we’ll first discuss exceptions
    and errors separately before consolidating everything into a single file in the
    last section. Ready? Let’s look at exceptions first. 12.1 Handling Exceptions
    12.1.1 What is an exception? An exception is a predefined object in PHP that allows
    us to alter the flow of our scripts when something undesirable happens. For instance,
    if we try to connect to a database and the connection fails, we can use an exception
    to help us handle the situation. To see what an exception is, create a file called
    connect.php in htdocs and add the following code to it: <?php $pdo = new PDO("mysql:host=localhost;dbname=pawszone",
    "wrongadmin", "ABCD"); $pdo->setAttribute(PDO::ATTR\_ERRMODE, PDO::ERRMODE\_EXCEPTION);
    Here, we try to connect to the “pawszone” database using an invalid username (“wrongadmin”).
    Next, create a new file called exceptionHandling.php in htdocs and add the following
    code to it: <?php include "connect.php"; echo ''<BR>Welcome to Pawszone''; Here,
    we use an include statement to include the connect.php file (which contains the
    invalid code) and use an echo statement to echo the text “Welcome to Pawszone”
    after the include statement. After creating the two files, try loading exceptionHandling.php
    in your browser (with Apache and MySQL running), what do you get? You get a message
    similar to what is shown below, right? I’ve formatted and underlined parts of
    the message to make it more readable. Fatal error : Uncaught PDOException : SQLSTATE\[HY000\]
    \[1045\] Access denied for user ''wrongadmin''@''localhost'' (using password:
    YES) in /opt/lampp/htdocs/connect.php:3 Stack trace: #0 /opt/lampp/htdocs/connect.php(3)
    : PDO->\_\_construct(''mysql:host=loca...'', ''wrongadmin'', ''ABCD'' ) #1 /opt/lampp/htdocs/exceptionHandling.php(2)
    : include(''/opt/lampp/htdo...'') #2 {main} thrown in /opt/lampp/htdocs/connect.php
    on line 3 This message informs us that a PDO exception ( PDOException ) has occurred
    and is not caught (i.e., not handled). This exception occurs because of the invalid
    username we used when connecting to the “pawszone” database. When an exception
    occurs and is not caught, PHP displays a message similar to the one shown above.
    This output includes a stack trace listing all the files linked to the exception.
    The trace above tells us that the current exception is linked to line 3 in connect.php
    and line 2 in exceptionHandling.php . In addition, the database password, “ABCD”,
    is revealed in the trace. Notice that the second statement ( echo ''<BR>Welcome
    to Pawszone''; ) in exceptionHandling.php is not executed? This is because any
    exception that is not caught results in a fatal error; the script is terminated
    immediately before the echo statement can be executed. If we do not want script
    termination to happen (or the message above to be displayed) when an exception
    occurs, we need to catch the exception. 12.1.2 try-catch-finally To catch exceptions,
    we use the try , catch and finally blocks. The syntax is as follows: try { //do
    something } catch (type of exception) { //do something else when an exception
    occurs } finally { //do this regardless of whether the try or catch block is executed
    } The try block first tries to perform a task. If the task fails, an exception
    will be thrown. Throwing an exception simply means PHP will create an object using
    one of the predefined classes for dealing with exceptions. These classes include
    the Exception , PDOException , DOMException and OutOfBoundsException class. When
    an exception occurs, PHP creates an object of the relevant exception class. This
    object contains information about the exception and can be used to call various
    methods defined in the class. These methods include the getMessage() , getFile()
    , getLine() and getTraceAsString() methods, which give us the message, file name,
    line number and stack trace of the exception respectively. After an exception
    is thrown (i.e., after PHP creates the exception object), we need to catch it
    using a catch block. We can define multiple catch blocks to deal with different
    types of exceptions. After the catch block(s), we have the finally block. This
    block is optional and always executed regardless of whether the try block succeeds
    or fails. To illustrate how the try , catch and finally blocks work, replace the
    original code in exceptionHandling.php with the following code: <?php try{ include
    "connect.php"; }catch(PDOException $e){ echo ''<BR>Unable to connect ''.$e->getMessage();
    }catch(Exception $e){ echo ''<BR>Something else happened''.$e->getMessage(); }finally{
    echo ''<BR><BR>The finally block is always executed''; } echo ''<BR>After connecting'';
    Here, we first try to connect to the “pawszone” database inside the try block.
    If we are unable to connect, PHP throws an exception and one of the catch blocks
    will be executed. In our example, we have two catch blocks. The first catch block
    catches a PDO exception ( PDOException ) while the second catches a general exception
    ( Exception ). PDOException is a predefined class that deals with exceptions when
    PDO is unable to perform its task. Exception , on the other hand, is the parent
