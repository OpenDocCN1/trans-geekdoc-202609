    # 第 3 章：基础 PHP 任务


    在上一章中，我们安装了 XAMPP 和 Brackets，并编写了我们的第一个 PHP 脚本。在本章中，我们将学习执行 PHP 中三个非常基础的任务——向用户显示输出、在多个页面之间复制代码以及重定向用户。


    ## 3.1 显示输出


    在学习显示输出之前，让我们先创建一个 PHP 文件作为模板，以便我们测试本节中的 PHP 语句。在 Brackets 中创建一个文件并将其保存为 `output.php`
    到你的 `htdocs` 文件夹中。在 `output.php` 中添加以下代码：


    ```php

    <?php

    //在此处添加代码

    ```


    每当你想要测试本节中的任何 PHP 语句时，都可以将该语句添加到 `output.php`（`<?php` 开启标签之后），并在浏览器中加载它以检查输出。


    注意，我们没有为 `output.php` 添加结束标签（`?>`）。这是因为 `output.php` 只包含 PHP 代码。根据 PHP 框架互操作组（PHP
    Framework Interop Group）推荐的标准，任何只包含 PHP 代码的 PHP 脚本都不应以结束标签结尾。这样做是为了防止文件末尾出现意外的空格，这在修改响应头时可能会导致如“Headers
    already sent”（头部已发送）之类的警告。如果上面的语句看起来没有意义，不要担心；我们稍后会学习“Headers already sent”警告。现在，让我们继续学习如何在
    PHP 中显示输出。


    ### 3.1.1 echo


    在 PHP 中显示输出最简单的方法是使用 `echo` 语句。要做到这一点，我们在 `echo` 关键字之后使用一对匹配的引号将我们想要显示的文本括起来。`echo`
    关键字是不区分大小写的。因此，`echo`、`Echo` 或 `ECHO` 都能正常工作。


    使用 `echo` 语句非常直接。我们在第 2 章就用过它，当时是用它显示“Hello World!”单词。除了使用 `echo` 语句显示简单的文本消息外，我们还可以使用它们显示带有
    HTML 标记的文本。例如，我们可以写 `echo ''PHP is fun<BR>and easy!'';`。这将带给我们 PHP is fun and
    easy! 的输出；由于 `<BR>` 标签，文本“and easy!”显示在第二行。


    我们还可以在单个 `echo` 语句中组合多个消息。要做到这一点，我们用逗号分隔消息。例如，`echo "ABCD", "EFGH";` 将带给我们 ABCDEFGH
    的输出。当消息更复杂时（例如消息包含变量和函数时），组合消息是非常用的。我们将在书的后续部分学习变量和函数。


    最后但同样重要的是，我们可以使用带括号或不带括号的 `echo` 语句。你可能见过执行以下操作的代码：`echo ("ABCD");` 这在大多数情况下都是良好的。然而，如果你使用括号，则不允许在单个
    `echo` 语句中组合多个消息。例如，`echo ("ABCD", "EFGH");` 将导致错误。在大多数情况下，你最好使用不带括号的 `echo` 语句。


    ### 3.1.2 print


    除了使用 `echo` 语句显示输出外，我们还可以使用 `print` 语句。`print` 语句与 `echo` 语句非常相似。来看这个例子：`print
    "My name is Brody.";` 将带给我们 My name is Brody. 的输出。如你所见，`print` 语句的作用与 `echo` 语句一样。虽然它们之间存在一些差异，但在大多数情况下，没有必要使用
    `print` 语句。


    在 PHP 中，有多种方法执行某项任务是非常常见的。这是开发者对 PHP 的主要抱怨之一，因为它让事情变得不必要的复杂。在大多数情况下，这些不同方式彼此非常相似。为了不让你被过多的选项困扰，我将在书中坚持一种选择，并在必要时简要提到其他选项。在书中，我将使用
    `echo` 语句来显示输出。


    ### 3.1.3 转义字符


    接下来，让我们学习在 PHP 中转义字符。在之前的节中，我们学习了在 ways `echo`（或 `print`）语句时用用引号将文本括起来。如果我们想显示一个单引号会发生什么呢？例如，假设我们有如下语句：`echo
    ''<BR>Today is Friday, we''re going to the zoo.'';` 当我们尝试运行上述语句时会得到错误，因为 PHP 默认不区分单引号和双引号。因此，它将“we’re”单词中的单引号视为结束结束引号。换句话说，它将该语句看作
    `echo ''<BR>Today is Friday, we''` 并期望在单引号后有一个分号或逗号。当情况没有发生时，PHP 就会困惑并给出一个错误。


    处理上述错误有两种方法。第一种是使用双引号括文本并将语句重写为 `echo "<BR>Today is Friday, we''re going to the
    zoo.";` 由于 PHP 使用双引号来结束另一个双引号，因此“we’re”中的单引号不会被误解为结束引号。


    另一种，我们可以通过在原始语句的单引号前面加上反斜杠字符（`\\`）来转义它。转义字符会改变字符的含义。没有反斜杠，单引号会被解释为结束单引号；有了反斜杠，它就会被视为要在在浏览器上显示的单引号。例如，为了显示上一个例子中的单引号，可以使用下面的语句：`echo
    ''<BR>Today is Friday, we\''re going to the zoo.'';` 这带给我们 Today is Friday, we''re
    going to the zoo 的 输出。


    反斜杠的其他常见用法包括：

    - 使用它显示双引号：`echo """` 会产生错误，而 `echo "\"";` 带给我们 `"`

    - 使用它显示反斜杠本身：`echo "\"` 会产生错误，而 `echo "\\";` 带给我们 `\`


    ## 3.2 复制代码


    接下来，让我们学习如何在脚本中复制代码。在 PHP 中，通常情况下脚本是相互独立的。因此，在一个脚本中编写的代码（例如 `index.php`）在导航到另一个页面时可用。如果我们希望网站上的多个页面具有相同的
    HTML 或 PHP 代码，我们需要使用 `include` 语句。


    ### 3.2.1 include


    假设你希望网站上的多个页面具有相同的 <h1> 标题，不需要将代码复制到所有页面。相反，你可以使用 `include` 语句。让我们尝试一下。创建一个名为
    `heading.html` 的文件（在 `htdocs` 中），为其添加以下代码：`<h1>Welcome to PHP</h1>`


    接下来，创建一个名为 `includedemo.php` 的文件并将其保存到 `htdocs` 中。向该文件添加以下代码：


    ```php

    <!DOCTYPE html>

    <html>

    <body>

    <?php include ''heading.html''; ?>

    </body>

    </html>

    ```


    注意 `includedemo.php` 中的语句 `include ''heading.html'';`。当 PHP 看到这个语句时，它会去 `heading.html`，复制里面的代码并将其粘贴到
    `includedemo.php` 中。这节省了我们手动复制代码的麻烦。如果你现在启动 `includedemo.php`，你会看到“Welcome to
    PHP”作为 <h1> 标题显示。


    明白了吗？


    使用 `include` 语句我们需要给 PHP 要包含的文件路径。这类似于我们在 HTML 中将 CSS 或文件链接到网页。在上面的示例中，由于 `heading.html`
    与 `includedemo.php` 在同一个文件夹中，我们只需提供文件名。如果 `heading.html` 存储在另一个文件夹（例如 `htdocs`
    内部的 `includes` 文件夹中），我们需要使用下面的语句：`include ''includes/heading.html'';`


    ### 3.2.2 require


    除了 `include` 语句，PHP 还有 `require` 语句。区别在于，如果 PHP 找不到文件，`require` 会产生致命错误并停止脚本。而
    `include` 只产生警告而不停止脚本。如果你想要包含的内容对于页面的正确执行至关重要，你应该使用 `require` 语句。否则，你可以使用 `include`
    语句。


    ### 3.2.3 include_once, require_once


    `include` 和 `require` 语句都带有 `_once` 版本。正如名称所示，`include_once` 和 `require_once`
    只向文件中“复制粘贴”一次代码。这些语句适用于同一个文件可能被包含多次的情况（例如，当脚本很长你忘记之前是否包含过该文件）。如果你在 `includedemo.php`
    中添加另一个 `include ''heading.html'';` 语句（`?>` 标签之前）并加载页面，你会看到两次“Welcome to PHP”作为
    <h1> 标题。另一方面，如果你将包含语句改为 `include_once ''heading.html''; include_once ''heading.html'';`
    你只会看到一次 <h1> 标题。


    ## 3.3 重定向用户


    太棒了！我们来到了本章的最后一节。在本节中，我们将学习使用 PHP 重定向用户。在 HTML 中，我们知道可以使用 `<meta>` 标签将用户重定向到另一个页面。在
    PHP 中，我们使用名为 `header()` 的内置函数。


    首先，什么是函数？函数是执行特定任务的代码块。作为一个类比，想想 MS Excel 中的函数。如果我们想相加电子表格中某些单元格的值，可以使用名为 `sum()`
    的内置函数。该函数是由其他程序员预写的并包含在 Excel 中的。与 Excel 中的预写函数类似，PHP 带有许多内置函数。大多数函数都要求我们提供某些信息以便它们执行任务。在
    PHP 中，我们通过在函数名后的一一对括号（按照预定义的顺序）来提供这些信息。我们传递给函数的信息称为参数。要要使用 `header()` 函数，我们需要向函数传递“Location”一词，后面跟一个冒号和重定向
    URL。使用函数也称为调用函数。要调用 `header()` 函数，在 `includedemo.php` 的开头添加以下代码（`<!DOCTYPE html>`
    标签之前）：


    ```php

    <?php header(''Location: http://example.com''); ?>

    ```


    如果你现在加载 `includedemo.php`，你将被重定向到 http://example.com。明白了吗？


    当你使用 `header()` 函数时，注意它必须在你的脚本向浏览器生成任何输出之前调用，无论是通过普通的 HTML 标签、空行还是来自 PHP。如果在调用函数之前有任何输出，该函数将无法工作。例如，它在以下两个示例中将无法工作：


    示例 1：

    ```php

    <?php echo ''Hello''; header(''Location: http://example.com''); ?>

    ```


    示例 2：

    ```html

    <p>This is some text.</p>

    <?php header(''Location: http://example.com''); ?>

    ```


    在第一个示例中，输出是在 `header()` 函数调用之前由 `echo` 语句（`echo ''Hello'';`）产生的。在第二个示例中，输出是由 `<?php`
    标签之前的两行代码产生的。这两行在 `header()` 函数调用之前生成了一个 HTML 段落和一个空行。


