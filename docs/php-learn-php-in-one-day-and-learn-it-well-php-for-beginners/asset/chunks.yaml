    browser’s address bar. For instance, to load hello.php , type [http://locahost/hello.php](http://locahost/hello.php)
    . On Mac, the easiest way to load files stored in htdocs is to enable port forwarding.
    This can be done under the “Network” tab in XAMPP. Suppose you have enabled “localhost:8080->80(Over
    SSH)” in XAMPP, to load hello.php , type [http://locahost:8080/hello.php](http://locahost:8080/hello.php)
    into your browser’s address bar. Got it? You can refer to [https://learncodingfast.com/how-to-install-xampp-and-brackets](https://learncodingfast.com/how-to-install-xampp-and-brackets)
    for more detailed instructions. For ease of reference, from this point forward,
    I will use [http://localhost](http://localhost) to refer to your localhost. If
    you are using Mac, remember to add the port number to the URL (i.e., [http://localhost:8080](http://localhost:8080)
    ). Let’s analyze the code in hello.php now. Most of the code should look familiar
    to you except the following: <?php #Simple hello world page     echo "Hello World!";
    ?> The <?php … ?> tags above are known as PHP tags; they tell the server that
    code enclosed within should be treated as PHP code. In our example, we have two
    simple lines of PHP code. The first line #Simple hello world page is known as
    a comment. Comments are written by programmers to explain their code to other
    programmers; these comments are ignored by the PHP interpreter. To add a single
    line comment to our code, we precede the comment with # or // . For instance,
    \# This is a comment // This is also a comment To add multiple lines comment,
    we enclose the comment in /\*...\*/ . For instance, /\*This is an example of a
    multi-line comment. \*/ After the comment, we use the statement echo "Hello World!";
    to display the words “Hello World!” on the browser. This is known as an echo statement;
    we’ll learn more about it in the next chapter. Notice that we end the echo statement
    with a semicolon (;)? All statements in PHP must end with a semicolon. This is
    similar to how we end sentences with a period (.) in English. If you load hello.php
    now, you’ll get ![](image_rsrc3AM.jpg)as the output. That’s it. We have just coded
    our first PHP web page. Simple? Great! Let’s move on. '
