    = 0 to $i = 49 . However, as we have the break statement, this loop only runs
    from $i = 0 to $i = 4 . This is because when $i equals 4 , the if condition (
    $i == 4 ) evaluates to true . The break statement that follows then causes the
    program to break out of the for loop, skipping the rest of the iterations (from
    $i = 5 to $i = 49 ). Got it? Next, we have the continue statement. This statement
    does not cause a loop to end prematurely. Instead, it causes the rest of the loop
    to be skipped for that particular iteration . Let’s look at an example: for ($i
    = 0; $i < 6; ++$i) { echo ''$i = ''.$i.'', ''; if ($i == 4) continue; echo ''First.'';
    echo ''Second.<BR>''; } If you run the code above, you’ll get the following output:
    $i = 0, First.Second. $i = 1, First.Second. $i = 2, First.Second. $i = 3, First.Second.
    $i = 4, $i = 5, First.Second. Notice that when $i equals 4 , the text “First.Second.”
    does not appear? This is because when $i equals 4 , the continue statement caused
    the program to skip the statements echo ''First.''; echo ''Second.<BR>''; for
    that iteration. Other than that, the code runs as per normal. Clear? 6.4.3 Alternative
    Syntax Next, let’s move on to talk about an alternative syntax for control structures
    in PHP. PHP offers an alternative syntax for some of its control structures, specifically
    the if , while , for , foreach , and switch structures. This syntax involves changing
    opening braces to colons ( : ) and the last closing brace to endif; , endwhile;
    , endfor; , endforeach; , or endswitch; respectively. Let’s use an if statement
    to illustrate this. Suppose we want to display different outputs based on the
    value of $a , we can use the following if statement: $a = 5; if ($a == 5){ echo
    ''<BR>The value of $a is<BR>''; echo $a; }else{ echo ''Not five''; } Alternatively,
    we can do it as follows: $a = 5; if ($a == 5): echo ''<BR>The value of $a is<BR>'';
    echo $a; else: echo ''Not five''; endif; Compare the two if statements carefully.
    Notice that in the second if statement above, we replaced both opening braces
    with a colon? In addition, we replaced the last closing brace with an endif; statement.
    If you run the code above, you’ll get The value of $a is 5 as the output for both
    syntaxes. 6.4.4 Displaying HTML code Last but not least, let’s discuss a neat
    trick for outputting HTML code in control structures. So far, we have been using
    echo statements to output HTML code (such as the <BR> tag) in our control structures.
    This technique is easy to use and works well with simple HTML code. However, it
    can get cumbersome if we have more complicated HTML code to output, especially
    if the code uses lots of single and double quotation marks. For instance, if we
    want to output the following HTML code <a href = "names.php" target="\_blank">The
    names are ''Aaron'', ''Peter'', ''James'', ''Max'', ''Jenny'' and ''Don''.</a>
    <img src="names.jpg" alt="Names" height="42" width="42"> using an echo statement,
    we need to escape a lot of quotation marks. In cases like that, we can use a neat
    trick to switch between PHP and HTML code. For demonstration purposes, let’s suppose
    we want to use a for loop to output the HTML code <h1>Hello</h1> three times,
    the code below shows how we can do it (using the alternative syntax mentioned
    in the previous section): 1 <?php 2    for ($i = 0; $i < 3; ++$i): 3        echo
    ''<h1>Hello</h1>''; 4    endfor; 5 ?> This loop uses an echo statement to output
    the HTML code. Alternatively, if we do not want to use echo statements, we can
    do it as follows: 1 <?php 2    for ($i = 0; $i < 3; ++$i): ?> 3        <h1>Hello</h1>
    4    <?php endfor; 5 ?> Study the two loops carefully, what differences do you
    notice? First, notice that we added ?> to the end of line 2 in the second loop?
    This ?> tag closes the <?php opening tag on line 1. When that happens, any code
    after line 2 in the second loop is no longer interpreted as PHP code. Instead,
    it is interpreted as HTML code. This explains why we do not need to use an echo
    statement to output <h1>Hello</h1> on line 3. Next, on line 4, we open the PHP
    tag again. When PHP sees this opening tag, it knows that what follows is PHP code.
    When it encounters the endfor; statement, it realizes that this is a for loop
    and searches for the condition to evaluate. When it finds it on line 2, it increments
    $i by 1 and runs line 3 again. This keeps repeating until the condition $i < 3
    is no longer valid. Got it? If you run the loops above, you’ll get “Hello” displayed
    as a <h1> heading three times in both cases. Study the two loops carefully to
    appreciate how this technique works. It can be a bit confusing in the beginning.
    The main idea is to close the PHP tag before switching to HTML code and open it
    again after the HTML code. This makes it much more convenient to insert HTML code
    without having to use echo statements. '
