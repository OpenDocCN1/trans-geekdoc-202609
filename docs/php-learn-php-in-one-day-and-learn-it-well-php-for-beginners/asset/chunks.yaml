    box with the text “Your Name”. Alternatively, we can use PHP to prefill the text
    box with user-entered data. To do that, Change <input type = "text" name = "studentname"
    value = "Your Name"> to <input type = "text" name = "studentname" value = "<?php
    if (isset($\_POST\[''studentname''\])) echo $\_POST\[''studentname''\]; ?>"> If
    you analyze the code above carefully, you’ll notice that we replaced the text
    “Your Name” with the following block of PHP code: <?php if (isset($\_POST\[''studentname''\]))
    echo $\_POST\[''studentname''\]; ?> This code first checks if $\_POST\[''studentname''\]
    is set. If it is (i.e., the user has submitted data for this text field previously),
    we use an echo statement to prefill the text box with the information submitted.
    Got it? It is relatively straightforward to prefill a text box with user-entered
    data. Things get a bit more complicated when we want to prefill elements like
