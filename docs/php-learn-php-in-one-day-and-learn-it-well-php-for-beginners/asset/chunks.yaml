    a new string. I’ve added spaces before and after the concatenate operators so
    that you can see the three components more clearly; you do not need to add these
    spaces. After concatenating, we assign the new string to a variable called $contact
    and use the echo statement to echo its value. If you run the code above, you’ll
    get +1(208)1234567 as the output. 5.1.1 Commonly used String Functions in PHP
    Next, let’s discuss some of the commonly used string functions in PHP. PHP comes
    with a large number of built-in functions for working with strings. Most functions
    return a result after performing their tasks. We can assign the result to a variable
    or use the echo statement to display the result directly. A function may have
    different variations as some functions allow us to provide optional arguments
    to modify the function’s behavior. The examples below discuss the most common
    and useful approach to using each function. strlen() The strlen() function gives
    us the length of a string. Example: $str1 = ''Good Day!''; echo strlen($str1);
    Output: 9 Here, we declare a variable called $str1 and assign the string ''Good
    Day!'' to it. Next, we pass $str1 to strlen() and use the echo statement to display
    the function''s result directly. We get 9 as the output because 4 ( ''Good'' )
    + 1 ( '' '' ) + 3 ( ''Day'' ) + 1 ( ''!'' ) = 9. strtolower(), strtoupper() The
    strtolower() and strtoupper() functions convert a string to lowercase and uppercase
    respectively and return the new string. The original string is not changed. Example:
    $str2 = ''Hello World''; $str3 = strtolower($str2); $str4 = strtoupper($str2);
    echo ''<BR>''.$str2; echo ''<BR>''.$str3; echo ''<BR>''.$str4; Here, we declare
    a variable called $str2 and assign the string ''Hello World'' to it. Next, we
    pass $str2 to strtolower() and strtoupper() and assign the results to $str3 and
    $str4 respectively. Finally, we use three echo statements to echo the values of
    $str2 , $str3 and $str4 . In each case, we concatenate ''<BR>'' with the variable
    so that the output will start on a new line. If you run the code above, you’ll
    get Hello World hello world HELLO WORLD as the output. trim() The trim() function
    removes whitespaces from the front and end of a string by default and returns
    the new string. You can specify other characters for it to remove by passing a
    second optional argument to the function. Example 1: $str5 = '' is ''; echo ''PHP''.$str5.''Fun<BR>'';
    echo ''PHP''.trim($str5).''Fun<BR>''; Output: PHP is Fun PHPisFun Here, we first
    concatenate $str5 with the strings ''PHP'' and ''Fun<BR>'' and use an echo statement
    to echo the resulting string directly. We get “PHP is Fun” as the output. Next,
    we use the trim() function to remove whitespaces from $str5 and concatenate it
    with ''PHP'' and ''Fun<BR>'' again.  We get “PHPisFun” as the output this time.
    Example 2: $str6 = ''\*\*Hello\*\*World\*\*\*''; echo trim($str6, ''\*''); Output:
    Hello\*\*World Here, we pass ''\*'' to the trim() function as the second argument.
    As a result, asterisks (instead of whitespaces) are removed from the front and
    back of $str6 and we get “Hello\*\*World” as the output. substr() The substr()
    function returns a substring. To use this function, we need to pass two arguments
    to it - the string to extract the substring from and the position to start extracting
    it. We can also pass a third argument to specify the length of the substring to
