    # 第 4 章：PHP 中的常量、变量、数据类型和运算符


    太棒了我们已经来到了第 4 章。在本章中，我们将学习常量和变量。此外，我们还将讨论变量存储的数据以及我们可以对它们执行的各种操作。在继续之前，你可能想创建一个名为
    `chap4.php` 的新 PHP 脚本，并用它来测试章中的示例。准备好了吗？太好了！让我们开始吧。我们将从常量开始。


    ## 4.1 常量


    PHP 中的常量类似于数学中的常量。还记得我们在数学中学过的数字 3.14159（保留 5 位小数）吗？这个数字被称为圆周率（π），它的值永远不会。就像数学中的
    Pi 一，我们可以在 PHP 中定义自己的常量并为它们命名以便方便引用。要做到这一点，我们使用一个名为 `define()` 的内置函数。一旦定义了常量，就不允许更改它的值。要使用
    `define()` 函数，我们需要向函数传递两个参数（用逗号分隔）——常量名（用引号括起）和值。常量名默认对大小写敏感，可以由字母、数字或下划线组成。然而，它必须以字母或下划线开头。命名常量时使用全大写字母是一种约定。


    让我们来看一个示例。


    ```

    define("BASIC_MEMBER", 1112020);

    echo BASIC_MEMBER;

    echo ''<BR>'';

    define("BASIC_MEMBER", 16932);

    echo BASIC_MEMBER;

    ```


    在这里我们定义了一个名为 `BASIC_MEMBER` 的常量，并指定其值为 `1112020`。接下来，我们使用它的名称引用它，并使用 `echo` 语句输出它的值。在输出之后，我们尝试重新定义
    `BASIC_MEMBER` 并将其值改为 `16932`。最后，我们再次输出它的值。如果你运行上面的代码，将得到以下输出：


    ```

    1112020

    Notice : Constant BASIC_MEMBER already defined in ...

    1112020

    ```


    如果你仔细研究输出结果，你会发现我们在第一次定义 `BASIC_MEMBER` 之后并没有成功更改它的值。因此，当我们第二次输出它时，它的值仍然是 `1112020`。明白了吗？很好！在上面的示例中，注意当我们输出它的值时，我们没有给
    `BASIC_MEMBER` 括上引号。如果我们使用引号（例如，`echo ''BASIC_MEMBER'';`），我们将得到 `BASIC_MEMBER`
    作为输出，这并不是我们想要的。我们只在定义常量时才将常量名括在引号内（即在调用 `define()` 函数时）。


    ## 4.2 变量


    接下来，让我们进入变量。变量用于在程序中存储数据。它们有名称，并在需要时可以更改其值。和常量一样，变量名需要遵循某些命名规则。首先，变量名必须以 `$` 符号开头。在该符号之后，名称不能以数字开头，且只能包含字母数字下划线（`A-z`、`0-9`
    和 `_`）。像 `$userName`、 `$age1` 和 `$user_email` 这样的名称是可以的，而像 `$4ever`（以数字开头）、`$unit+NY`（包含
    `+` 符号）和 `$var 1`（包含空格）是不行的。接下来，变量名是大小写敏感的；`$userName` 与 `$username` 不同。最后，变量名应该具有意义。使用
    `$x`、`$y` 和 `$z` 等变量来存储用户的姓名、年龄和密码会让你的代码变得混乱且不直观。虽然不是强制的，但你绝对应该使用更有意义的名称，如 `$name`、
    `$age` 和 `$password`，以提高代码的可读性。


    在 PHP 中为变量命名时有两种常用的风格。我们可以使用驼峰命名法或下划线。驼峰命名法是用混合大小写编写复合词，每个单词（第一个除外）大写开头（例如，`$thisIsAVariable`）。另一种常见风格是使用下划线（`_`）分隔单词（例如，`$this_is_a_variable`）。选择一种风格而不是另一种取决于个人偏好。更重要的是在整个代码中保持一致。在书中，我们将变量使用驼峰命名法（camelCase）。


    在 PHP 中声明变量，我们写如下：


    ```

    $x = 7;

    ```


    在这里，我们声明了一个名为 `$x` 的变量并给它赋值 `7`。给变量赋值被称为赋值赋值。在声明变量时给它初始值被称为初始化变量。这在 PHP 中不是强制的。然而，这样做被认为是一种坏习惯，因为它可能导致脚本出现意想不到的行为。当我们声明并初始化变量时，PHP
    会在服务器存储空间上分配特定的区域来存储这些数据。随后可以通过引用其名称访问并修改这些数据。


    例如，要显示 `$x` 的值，我们写道：


    ```

    echo $x;

    ```


    这给了我们输出 `7`。如果我们改变 `$x` 的值，只需给它赋一个新值。例如：


    ```

    $x = 5;

    echo $x;

    ```


    这更新了 `$x` 的值并给了我们 `5`。在上面的示例中，注意我们使用 `echo` 语句时没有给 `$x` 括上引号。通常情况下，在使用 `echo`
    语句时不将常量、变量或函数的名称括在引号内。这是因为 `echo` 语句将任何在引号内的内容视为文本或 HTML 代码并原样输出。例如，如果我们写 `echo
    ''$x'';`，我们将得到输出 `$x`。唯一的例外是双引号括起的变量名。如果我们把变量名括在双引号内，`echo` 语句不会原样输出变量名。相反，它会用变量的值替换名称并输出该值。例如，如果我们写道：


    ```

    echo ''The value is $x.'';

    echo ''<BR>'';

    echo "The value is $x.";

    ```


    我们将得到输出 `The value is $x. The value is 5.`。当使用单引号时，`echo` 语句会原样输出文本。相比之下，当使用双引号时，它会将
    `$x` 替换为它的值。明白了吗？


    ## 4.3 基本数据类型


    接下来，让我们讨论 PHP 中的类型。PHP 中的变量可以存储不同类型的数据。变量存储的数据类型被称为数据类型。在本节中，我们将讨论三种基本数据类型：`int`、`float`
    和 `bool`。


    - `int`：指整数，即没有小数部分的数字。这种数据类型有上限和下限，且取决于平台。也就是说，它只能存储特定范围内的数字。超出这些边界的整数（例如很大的数字）会被解释为浮点。

    - `float`：指浮点数，即带有小数部分的数字。示例包括 `5.7`、`-3.5` 和 `7`。

    - `bool`：指布尔，是一种只能存储两个值之一的特殊类型——`true` 或 `false`。这两个值对大小写敏感。也就是说，`true` 和 `TRUE`
    指同一个值。同样，`false` 和 `FALSE` 指同一个值。`bool` 数据类型目前似乎是冗余的。当我们在讨论比较运算符和条件语句时，它的意义将会体现。PHP
    被认为是一种弱类型语言。当我们声明变量时，不需要指定其数据类型。为了存储整数或布尔。如果我们有以下变量：


    ```

    $x = 5;

    $y = 2.1;

    $z = true;

    ```


    `$x` 是整数，`y` 是浮点，`z` 是布尔。为了验证变量的类型，我们可以使用内置函数 `var_dump()`。


    ```

    var_dump($x);

    var_dump($y);

    var_dump($z);

    ```


    `int(5)`、`float(2.1)`、`bool(true)`。在上一节中，我们可以轻松地将一种数据类型转换为另一种。这被称为类型转换。


    ## 4.4 类型转换


    在上一节中，我们学习了基本数据类型——`int`、`float` 和 `bool`。我们可以轻松地将一种数据类型转换为另一种。这被称为类型转换。将值/变量转换为整数，我们添加
    `(int)` 或 `(integer)`。将其转换为浮点，我们添加 `(float)` 或 `(double)`。让我们来看一个例子：


    ```

    $p = 4.6;

    var_dump($p);

    ```


    在这里我们声明了一个名为 `$p` 的变量并给它赋值 `4.6`。接下来我们使用 `var_dump()` 函数显示 `$p` 的类型和值。如果我们运行上面的代码，我们将得到输出
    `int(4)`，PHP 通过截断小数部分将 `4.6` 转换为整数。除了将值转换为整数或浮点之外，我们也可以将其转换为字符串、数组或对象，添加 `(string)`、`(array)`
    和 `(object)`。


    ## 4.5 PHP 中的运算符


    PHP 带有许多可以使用变量的运算符。让我们先讨论赋值运算符。


    ### 4.5.1 赋值运算符


    之前我们学习了使用 `=` 给变量赋值。这个符号被称为赋值运算符，与数学中的等号不同。在 PHP（以及大多数编程语言）中，赋值是从右到左进行的。也就是说，我们将赋值运算符右侧的值（或变量）赋值给左侧的变量。因此，`$x
    = 7;` 不等于 `7 = $x;`。虽然这两个语句在数学上都是接受的，但在 PHP 中第二个语句是不允许的。在第一个语句中，我们将 `7` 赋值给 `$x`。这是正确的且不会产生错误。另一方面，在第二个语句中，我们将
    `$x` 赋值给 `7`（从右到左）。这没有意义并且会产生错误。


    ### 4.5.2 算术运算符


    接下来，让我们讨论算术运算符。这些运算符用于执行基本的算术运算。它们包括加 (`+`)、减 (`-`)、乘 (`*`)、除 (`/`)、取模 (`%`) 和幂
    (`**`)。


    假设你有：


    ```

    $x = 5;

    $y = 2;

    ```


    `$x + $y` 给了我们 `7`，`$x - $y` 给了我们 `3`，`$x * $y` 给了我们 `10`，`$x / $y` 给了我们 `2.5`，`$x
    % $y` 给了我们 `1`，因为取模运算符给了 5 除以 2 的余数，而 `$x ** $y` 给了我们 `25`，因为幂运算符给了 5 的 2 次方。


    ### 4.5.3 复合赋值运算符


    除了上述算术运算符，我们还有一组将算术运算与赋值结合的运算符。假设你有 `$x = 5;`，你想给 `$x` 加 3，你可以这样做：


    ```

    $x = $x + 3;

    ```


    赋值总是从右到左发生。因此，右侧的表达式 (`$x + 3`) 先被求值，结果为 `5+3`。然后这个值被赋值回左侧的变量 `$x`。也就是说，`$x` 的值变成了
    `8`。除了写 `$x = $x + 3;`，我们还可以使用 `+=` 运算符。这个运算符是赋值运算符与加法运算符结合的简写。如果你写道：


    ```php

    $x = 5;

    $x += 3;

    echo $x;

    ```


    你将得到输出 8。`$x += 3` 仅仅意味着 `$x = $x + 3`。除了 `+=` 运算符，我们还有 `-=` 运算符，它将 `-` 运算符与赋值运算符结合。适用于上一节提到的所有算术运算符。因此，`$x
    -= 4` 等于 `$x = $x - 4`，`$x *= 2` 等于 `$x = $x * 2` 等。


    ### 4.5.4 自增/自减运算符


    最后但同样，让我们讨论自增 (`++`) 和自减 (`--`) 运算符。这些运算符增加或减少变量的值 1 并返回新值。让我们尝试一些代码（添加了行号）：


    ```php

    $q = 3;

    echo "<BR>$q<BR>";

    echo ++$q;

    ```


    如果你运行上面的代码，将得到以下输出：


    ```

    3

    4

    ```


    第 2 行使用 `echo` 语句输出 `$q` 的原始值。第 3 行执行的是：

    1. 将 `$q` 的值增加 1

    2. 输出 `$q` 的新值


    因此我们得到了输出 4。`++` 运算符被称为自增运算符。它可以放在变量名的前面（称为预自增）或后面（称为后自增）。尝试将上面的第 3 行改为 `echo
    $q++;` 并重新运行代码，你将得到输出：


    ```

    3

    3

    ```


    这次感到惊讶吗？这是因为现在第 3 行执行的是：

    1. 输出 `$q` 的原始值

    2. 将 `$q` 的值增加 1


    也就是说，这两个任务（自增和输出）的执行顺序反转了。自增是在输出语句执行完毕后完成的（因此故名为后自增）。为了证明 `$q` 确实被增加了，你可以在第 3
    行之后再次输出它的值。这次你将得到输出 4。明白了吗？除了自增运算符，我们还有自减运算符 (`--`)。这个运算符由两个减号组成，并将变量的值减少 1。它也可以作为预自减或后自减运算符使用。


