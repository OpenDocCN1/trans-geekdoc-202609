    ![](img/image_rsrc3AB.jpg)


    # 一天学会 PHP 并精通它


    ## 面向初者的 PHP：带实战项目

    你立即开始学习 PHP 编码所需的唯一书籍。作者：Jamie Chan  [`www.learncodingfast.com/php`](https://www.learncodingfast.com/php)


    版权 © 2020 版权所有。未经出版者书面许可，不得以任何形式或通过任何复制、发行或传输本出版物的任何部分，包括复印、录制或其他电子或机械方法，但批判性评论中包含简短引引以及版权法允许的某些非商业用途除外。


    ## 前言

    本书旨在帮助你快速且精通地学习 `PHP`。虽然本书适合 `PHP` 绝对初学者，但你确实需要熟悉 `HTML` 和 `SQL`（针对第 11 章）。本书涵盖了广泛的
    `PHP` 主题，经过精心挑选，旨在让你对该语言有广泛的接触。如果你是 `PHP` 的绝对初学者，你会发现这本书以易懂且简洁的方式解释了复杂的概念。在书的末尾，你将在一个项目的指导下完成学习，这让你有机会运用所学，并看到它们是如何联系在一起的。你可以在
    [`www.learncodingfast.com/php`](https://www.learncodingfast.com/php) 下载示例和项目的源代码。任何错误可以在
    [`www.learncodingfast.com/errata`](https://www.learncodingfast.com/errata) 找到。


    ## 联系信息

    我乐意收到你的反馈。如需反馈或咨询，可以通过 jamie@learncodingfast.com 与我联系。


    ## Jamie 的其他书籍

    - ![](https://www.amazon.com/dp/B07K374J19) [一天学会 SQL（使用 MySQL）并精通它](https://www.amazon.com/dp/B07K374J19)

    - ![](https://www.amazon.com/dp/B00UI2QHQG) [一天学会 CSS（结合 HTML 5）并精通它](https://www.amazon.com/dp/B00UI2QHQG)

    - ![](https://www.amazon.com/dp/B071Z2Q6TQ) [一天学会 Python 并精通它（第二版）](https://www.amazon.com/dp/B071Z2Q6TQ)

    - ![](https://www.amazon.com/dp/B07WH99L1J) [一天学会 Python 并精通它（练习册）](https://www.amazon.com/dp/B07WH99L1J)

    - ![](https://www.amazon.com/dp/B016Z18MLG) [一天学会 C# 并精通它](https://www.amazon.com/dp/B016Z18MLG)

    - ![](https://www.amazon.com/dp/B01LZOCVN9) [一天学会 Java 并精通它](https://www.amazon.com/dp/B01LZOCVN9)


