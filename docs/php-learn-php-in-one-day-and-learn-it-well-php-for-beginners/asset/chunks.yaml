    # 第一章：PHP 简介


    感谢你拿起这本书。我非常高兴你选择这本书，衷心希望它能帮助你掌握 PHP，并带你进入动态 Web 编程的世界。在书中，我们将涵盖 PHP 的大部分主要主题。这些主题经过了精心挑选，旨在让你对
    PHP 有广泛的接触，同时又不会被不必要的细节所困扰。在书的末尾，我们还将一起构建一个动态网站。很期待吗？


    在正式开始 PHP 之前，请注意本书要求你对 HTML 和 `MySQL` 有基础的了解。如果你不熟悉这些语言，建议你参考我的书籍“[一天内学会并精通 CSS（带
    HTML 5）](https://www.amazon.com/dp/B00UI2QHQG)”和“[在内内学会并精通 SQL（使用 MySQL）](https://www.amazon.com/dp/B07K374J19)”。如果你已经熟悉了，那我们继续吧。


    ## 1.1 什么是 PHP？


    `PHP` 是一种通用型编程语言，主要用于 Web 开发。它由 Rasmus Lerdorf 于 1994 年创建，允许开发者轻松地创建动态网页。例如，开发者可以在
    HTML 中创建一个表单，并使用 `PHP` 对其进行处理。根据表单中输入的内容，开发者可以使用 `PHP` 向用户显示不同的输出结果。


    大多数情况下，`PHP` 被用作服务器端语言。这意味着 `PHP` 代码不是在用户的计算机（也称为客户端）上处理的。换句话说，当你通过浏览器访问一个 `PHP`
    页面时，代码不会在你的计算机上运行。相反，你的浏览器会向 Web 服务器发送请求，然后由服务器处理代码，并将结果以网页的形式返回给浏览器。在通常情况下，这个
    Web 服务器是存储 `PHP` 文件的远程计算机。


    为了让 Web 服务器能够处理 `PHP` 代码，需要安装一种名为 `PHP` 解释器的特殊软件。在下一章节中，我们将学习如何使用一种名为 `XAMPP`
    的免费软件来搭建 Web 服务器并安装 `PHP` 解释器。


    ## 1.2 为什么要学习 PHP？


    学习 `PHP` 有很多理由。首先，`PHP` 是使用最广泛的 Web 编程语言之一，被许多流行的内容管理系统（如 `Wordpress`、`Drupal`
    和 `Joomla`）所使用。因此，对 `PHP` 程序员的需求很大。如果你计划从事自由开发者工作，`PHP` 是一项必备技能。


    其次，`PHP` 设计对初学者友好且易于学习。此外，由于这种语言的流行，如果你在 `PHP` 代码上遇到任何问题，都可以轻松地找到帮助。在互联网上简单搜索就能帮助你解决面临的大部分问题。


    最后但同样重要的是，`PHP` 的语法与 `Java` 或 `C` 等其他编程语言非常相似。一旦你熟悉了 `PHP`，你会发现掌握其他语言变得容易得多。准备好开始了吗？让我们开始吧！


    '
- fmt: "\n# Chapter 2: Installing XAMPP\n\nAs mentioned in the previous chapter, we’ll\
    \ learn to set up our web server and install the PHP interpreter in this chapter.\
    \ In addition, as we’ll be using PHP to interact with a database later in this\
    \ book, we need to set up our database server too. To set up our web and database\
    \ servers, we need to install three software: the Apache web server, the PHP interpreter\
    \ and the MarieDB database server. Installing all three software can be tedious\
    \ if we do them one by one. Fortunately, some kind folks at Apache Friends created\
    \ a free package that contains all the software we need. This package is known\
    \ as `XAMPP`, which stands for Cross-platform (X), Apache web server (A), MarieDB\
    \ database server (M), PHP (P) and Perl (P). \n\nThe MarieDB database server is\
    \ a community-developed fork of the `MySQL` server. Although `M` in `XAMPP` officially\
    \ stands for `MarieDB`, you’ll see that `XAMPP` labels the database server as\
    \ `MySQL` in the software. We’ll follow this label and refer to the database server\
    \ as `MySQL` in our book. For detailed instructions on installing `XAMPP` and\
    \ using it to set up our servers, check out [https://learncodingfast.com/how-to-install-xampp-and-brackets](https://learncodingfast.com/how-to-install-xampp-and-brackets).\
    \ Instructions are available on the accompanying site of this book so that whenever\
    \ there are any changes to `XAMPP`, you can find the updated instructions on the\
    \ site. This will ensure that you’ll always get the latest installation instructions.\
    \ Besides installing `XAMPP`, you are strongly encouraged to install an advanced\
    \ text editor to do your coding in. While you can definitely code in a basic text\
    \ editor (such as `Notepad`), an advanced text editor offers features like syntax\
    \ highlighting that makes your code easier to read and debug. A recommended free\
    \ editor is `Brackets`. For instructions on installing `Brackets`, head over to\
    \ [https://learncodingfast.com/how-to-install-xampp-and-brackets](https://learncodingfast.com/how-to-install-xampp-and-brackets)\
    \ as well.\n\n## 2.1 Configuring php.ini\n\nAfter you have installed `XAMPP` and\
    \ `Brackets` on your computer, you are ready to start creating your dynamic website.\
    \ However, before we do that, we need to make some changes to the error settings\
    \ on our PHP server. This ensures that whenever there’s any mistake in our code,\
    \ an error message will be displayed on the browser. To configure these settings,\
    \ the most direct way is to modify a file called `php.ini`. The instructions below\
    \ are valid at the time of writing. If there are any changes to the instructions,\
    \ you can find the updated instructions at [https://learncodingfast.com/php](https://learncodingfast.com/php).\
    \ To modify `php.ini`, we need to locate the file first. To do that on Windows,\
    \ launch `XAMPP` and click on the “Config” button for `Apache`. Next, select `php.ini`.\
    \ The file will be opened in `Notepad`. ![](image_rsrc3AJ.jpg)\n\nOn Mac, launch\
    \ `XAMPP` and click on the “Start” button in the “General” tab. Wait for the status\
    \ to turn green. Next, select the “Volumes” tab and click on the “Mount” button.\
    \ Finally, click on “Explore” and look for the “etc” folder. You’ll find `php.ini`\
    \ inside this folder. Open it using `Brackets`.![](image_rsrc3.jpg)\n\nOnce `php.ini`\
    \ is open, scroll to the bottom of the page and add the following lines to it:\n\
    \n```\nerror_reporting=ALL\ndisplay_errors=On\n```\n\nThese lines are added to\
    \ the bottom of the page so that if the settings have been set previously (in\
    \ earlier parts of the `php.ini` file), the new lines will override the previous\
    \ settings. We’ll discuss these two settings in Chapter 2. Next, save the file\
    \ and restart `Apache`. On Windows, just stop the `Apache` server (if it is currently\
    \ running) and start it again. On Mac, select the “Services” tab and click on\
    \ “Apache”. If `Apache` is currently running, click on the “Restart” button. Else,\
    \ click on the “Start” button. Wait for `Apache` to restart and your settings\
    \ will be updated. You’ll now get an error message whenever there’s error in your\
    \ code. Depending on the PHP version you are using, some of the errors you encounter\
    \ when testing the code may differ from what is described. Don’t worry about that.\
    \ We’ll discuss errors in depth in Chapter 2.\n\n## 2.2 Important Links\n\nBefore\
    \ proceeding to code our first web page, I would like to bring your attention\
    \ to two important links. The first is [https://learncodingfast.com/php](https://learncodingfast.com/php).\
    \ This book uses lots of examples to illustrate different concepts. While you\
    \ are encouraged to type out these examples in `Brackets` yourself, if you prefer\
    \ not to, you can download the source code at the link above. The project files\
    \ and any additional notes or updates to the book can also be found there. Next,\
    \ we have errata page. While every effort has been made to ensure that there are\
    \ no errors in the book and all source code has been tested extensively on multiple\
    \ machines, if there are any errors we missed, you can find the errata at [https://learncodingfast.com/errata](https://learncodingfast.com/errata).\n\
    \n## 2.3 Coding our first Web Page\n\nGreat! We are now ready to start coding.\
    \ First, ensure that you have started `Apache` in `XAMPP`. Note: If you have any\
    \ problems starting `Apache`, it is likely due to a port conflict. Follow the\
    \ instructions at [https://learncodingfast.com/how-to-install-xampp-and-brackets](https://learncodingfast.com/how-to-install-xampp-and-brackets)\
    \ to resolve the conflict. Next, create a new file in `Brackets` and add the following\
    \ code to it:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>My first\
    \ PHP page</title>\n</head>\n<body>\n    <h1>My first PHP page</h1>\n    <?php\
    \ #Simple hello world page\n    echo \"Hello World!\";\n?>\n</body>\n</html>\n\
    ```\n\nIf you are using an ebook reader, some lines above may wrap to the next\
    \ line due to the limited width of the reader. If that occurs, try changing your\
    \ device to landscape mode or using a smaller font size. The same applies to all\
    \ the other examples in this book. Save the file above as `hello.php` to your\
    \ `htdocs` folder. Any file that contains PHP code must be saved with a `.php`\
    \ extension. A file that ends with a `.php` extension is also known as a PHP script.\
    \ You can find the `htdocs` folder inside the `XAMPP` (Windows) or `LAMP` (Mac)\
    \ folder. `htdocs` is the root directory of your local web server.\n\nOn Windows,\
    \ to load the files stored in `htdocs`, you simply type `http://localhost/<filename>`\
    \ into your browser’s address bar. For instance, to load `hello.php`, type [http://localhost/hello.php](http://localhost/hello.php).\
    \ On Mac, the easiest way to load files stored in `htdocs` is to enable port forwarding.\
    \ This can be done under the “Network” tab in `XAMPP`. Suppose you have enabled\
    \ `localhost:8080->80` (Over SSH) in `XAMPP`, to load `hello.php`, type [http://localhost:8080/hello.php](http://localhost:8080/hello.php)\
    \ into your browser’s address bar. Got it? You can refer to [https://learncodingfast.com/how-to-install-xampp-and-brackets](https://learncodingfast.com/how-to-install-xampp-and-brackets)\
    \ for more detailed instructions. For ease of reference, from this point forward,\
    \ I will use [http://localhost](http://localhost) to refer to your localhost.\
    \ If you are using Mac, remember to add the port number to the URL (i.e., [http://localhost:8080](http://localhost:8080)).\n\
    \nLet’s analyze the code in `hello.php` now. Most of the code should look familiar\
    \ to you except the following:\n\n```php\n<?php \n#Simple hello world page \n\
    echo \"Hello World!\"; \n?>\n```\n\nThe `<?php` ... `?>` tags above are known\
    \ as PHP tags; they tell the server that code enclosed within should be treated\
    \ as PHP code. In our example, we have two simple lines of PHP code (one being\
    \ a comment, one a statement). The first line `#Simple hello world page` is known\
    \ as a comment. Comments are written by programmers to explain their code to other\
    \ programmers; these comments are ignored by the PHP interpreter. To add a single\
    \ line comment to our code, we precede the comment with `#` or `//`. For instance:\n\
    \n```php\n# This is a comment\n// This is also a comment\n```\n\nTo add multiple\
    \ lines comment, we enclose the comment in `/*...*/*/`. For instance:\n\n```php\n\
    /*\nThis is an example of a multi-line comment.\n*/\n```\n\nAfter the comment,\
    \ we use the statement `echo \"Hello World!\";` to display the words “Hello World!”\
    \ on the browser. This is known as an `echo` statement; we’ll learn more about\
    \ it in the next chapter. Notice that we end the `echo` statement with a semicolon\
    \ (`;`))? All statements in PHP must end with a semicolon. This is similar to\
    \ how we end sentences with a period (`.`) in English. If you load `hello.php`\
    \ now, you’ll get ![](image_rsrc3AM.jpg)as the output. That’s it. We have just\
    \ coded our first PHP web page. Simple? Great! Let’s move on.\n"
