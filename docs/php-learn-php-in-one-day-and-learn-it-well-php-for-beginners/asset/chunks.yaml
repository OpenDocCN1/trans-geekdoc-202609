- fmt: "\nIf any of the cases above are not met, we assign an appropriate error message\
    \ to `$msg`. Else, we do the following: Create a `BlogMember` object and use it\
    \ to call the `isDuplicateID()` method. If the method returns `true`, assign an\
    \ appropriate error message to `$msg`, informing users that the username is already\
    \ in use. Else, use the `BlogMember` object to call the `insertIntoMemberDB()`\
    \ method and use the `header()` function to redirect users to `index.php`. Append\
    \ the query string `new=1` to `index.php`. Got it? Try coding `p-signup.php` yourself.\
    \ Hint: Refer to `p-index.php` for help on processing forms. If you are not familiar\
    \ with query strings, you can refer to Chapter 8.1.2. To check the five cases\
    \ listed above, you can use the `isEmpty()`, `isValidLength()`, `isSecure()` and\
    \ `passwordsMatch()` methods in the `Helper` class. Refer to `Helper.php` and\
    \ `BlogMember.php` to figure out what needs to be passed to the various methods\
    \ in the `Helper` and `BlogMember` classes when calling them. Once you are done\
    \ with `p-signup.php`, we can move on to `p-write.php`.\n\n### 13.6.4 p-write.php\n\
    \n`write.php` has an input box named “title”, a textarea named “post”, a drop-down\
    \ list named “audience” and a button named “submit”. If an error occurs when processing\
    \ `write.php`, the page echoes an error message stored in a variable called `$msg`.\
    \ If you analyze the code in `write.php`, you’ll notice that we added a `<script>`\
    \ element after the textarea. This is for replacing the textarea with a more advanced\
    \ text editor known as the CKEDITOR (available for free at [https://ckeditor.com/ckeditor-4/]).\
    \ We won’t go into details on how to use `CKEDITOR` as it only affects the user\
    \ interface. Using `CKEDITOR` does not affect our PHP code in any way.\n\nHere’s\
    \ what we need to do in `p-write.php`:\n\n1. First, we need to retrieve two session\
    \ variables - `$_SESSION['username']` and `$_SESSION['is_admin']` - and check\
    \ if they are set. If either of the session variables is not set, we know that\
    \ the user is trying to access `write.php` without logging in with an admin account.\
    \ If that’s the case, we use the `header()` function to redirect them to `admin.php`.\n\
    2. Else, we do the following: First, declare and initialize a `Helper` object\
    \ called `$h`. Next, declare four variables `$title`, `$post`, `$audience` and\
    \ `$msg` and assign an empty string to each of them. After that, check if the\
    \ “submit” button has been clicked. If it has, assign `$_POST['title']`, `$_POST['post']`\
    \ and `$_POST['audience']` to `$title`, `$post` and `$audience` respectively.\n\
    3. Next, check that all fields in `write.php` have been filled out. If there is\
    \ an empty field, assign an appropriate error message to `$msg`. Else, create\
    \ an `Admin` object using `$_SESSION['username']` as the argument. Use this object\
    \ to call the `insertIntoPostDB()` method. (Refer to the `Admin` class to decide\
    \ what arguments to pass to the method.)\n4. Once that is done, assign the string\
    \ `'Message saved successfully'` to `$msg`.\n\nGot it? Try coding `p-write.php`\
    \ yourself. Once you are done, we are ready to move on to the most complex file\
    \ - `p-read.php`.\n\n### 13.6.5 p-read.php\n\n`p-read.php` is for processing `read.php`,\
    \ which is used for displaying posts to readers. We need to implement two essential\
    \ features in `p-read.php`:\n\nFirst, depending on whether the user is logged\
    \ in, we need to display different posts. If the user is logged in, we display\
    \ all posts. Else, we only display “Public” posts.\n\nNext, if the user is logged\
    \ in, we need to display a “New” icon for posts posted to the database after the\
    \ user’s login. To achieve the above, open `p-read.php` and do the following:\n\
    \n- First, declare a variable `$h` and assign a `Helper` object to it.\n- Next,\
    \ declare a variable `$update` and assign `false` to it.\n- Last but not least,\
    \ declare a variable `$is_member` and assign `isset($_SESSION['username'])` to\
    \ it. Here, we use the `isset()` function to check if the session variable `$_SESSION['username']`\
    \ is set. If it is (i.e., `isset()` returns `true`), we know that the reader accessing\
    \ `read.php` is logged in.\n\nNext, we need to use a couple of `if-else` statements\
    \ in `p-read.php`. The structure is shown below:\n\n```php\nif ($is_member){\n\
    \    // Create a BlogMember object and use it to call the getLastPost() method\n\
    }else{\n    // Create a BlogReader object\n}\n// Call getPostsDB() method\nif\
    \ ($posts == false){\n    // include the blankcard.html file\n}else{\n    // use\
    \ a foreach loop to process the elements in $posts\n    // include the messagecard.php\
    \ file\n}\nif ($is_member) {\n    // include the logout.html file\n}\nif ($update)\
    \ {\n    // use the BlogMember object to call getLastPost() method\n}```\n\nIn\
    \ the first `if-else` statement, we check if the user is logged in. If the user\
    \ is logged in (i.e., `$is_member` is `true`), we initialize a `BlogMember` object\
    \ and assign it to a variable called `$reader`. We then use `$reader` to call\
    \ the `getLastPost()` method in the `BlogMember` class and assign the result to\
    \ a variable called `$lastPost`. On the other hand, if the user is not logged\
    \ in, we initialize a `BlogReader` object and assign it to `$reader`. Try coding\
    \ this `if-else` statement yourself. Refer to the respective classes to find out\
    \ what needs to be passed when calling them.\n\nOnce the `if-else` statement is\
    \ complete, we need to use the `$reader` object to call the `getPostsDB()` method;\
    \ this method is defined in the `BlogReader` class. Recall that `BlogMember` is\
    \ a subclass of `BlogReader`. Hence, regardless of whether `$reader` is `BlogMember`\
    \ or `BlogReader` object, it can access the `getPostsDB()` method. Try calling\
    \ this method yourself and assign the result to a variable called `$posts`.\n\n\
    Next, we need to use a second `if-else` statement to check if `getPostsDB()` returned\
    \ any results. If there are no results (i.e., `$posts` is `false`), we want to\
    \ display the HTML in `blankcard.html` (located in the `output_code` folder).\
    \ To include this file, we use the following statement: `include \"output_code/blankcard.html\"\
    ;`.\n\nNext, inside the `else` block (if there are results), we use a `foreach`\
    \ loop to loop through `$posts`. `$posts` is a two-dimensional array fetched using\
    \ the `getPostsDB()` method in the `BlogReader` class. This method uses the `queryDB()`\
    \ method in the `Database` class, which in turn uses the built-in `fetchAll()`\
    \ method in the `PDO` class. The `fetchAll()` method fetches data from a table\
    \ as a two-dimensional array, where each element in the array is an array representing\
    \ a row from the table. In our `p-read.php` file, we assign the data fetched from\
    \ the “posts” table to `$posts`. To process `$posts`, we can loop through it using\
    \ the following `foreach` loop:\n\n```php\nforeach($posts as $result) {\n    $msgid\
    \ = $result['id'];\n    $title = htmlspecialchars($result['title']);\n    $post\
    \ = strip_tags($result['post'], \"<strong><em><p><ol><ul><li><a>\"); \n    $username\
    \ = htmlspecialchars($result['username']);\n    $postdate = htmlspecialchars($result['post_date']);\n\
    \    include \"output_code/messagecard.php\";\n}\n```\n\nFor each iteration, we\
    \ assign the array in `$posts` to `$result`. Next, inside the loop, we assign\
    \ the elements in `$result` to various variables. For instance, we assign `$result['title']`\
    \ to `$title`. However, before we do that, we apply the `htmlspecialchars()` function\
    \ to `$result['title']` first. The same applies to `$result['username']` and `$result['post_date']`.\
    \ The reason for this is we’ll be displaying the values of these elements in `read.php`\
    \ later. Hence, we have to convert any special characters in these elements to\
    \ HTML entities to prevent cross-site scripting. Refer to Chapter 8.1.6 if you\
    \ have forgotten what cross-site scripting is.\n\nHowever, notice that we did\
    \ not apply the `htmlspecialchars()` function to `$result['post']`? This is because\
    \ we want to allow certain HTML tags in `$result['post']`. Specifically, we want\
    \ to allow the `<strong>`, `<em>`, `<p>`, `<ol>`, `<ul>`, `<li>` and `<a>` tags.\
    \ To do that, we need to use another built-in function called `strip_tags()`.\
    \ This function strips a string of all HTML tags except those passed as a second\
    \ argument to the function. Hence, `strip_tags($result['post'], \"<strong><em><p><ol><ul><li><a>\"\
    )` strips `$result['post']` of all HTML tags except the ones we want.\n\nGot it?\
    \ After assigning all the elements in `$result` to their respective variables,\
    \ we use an `include` statement to include `messagecard.php`. `messagecard.php`\
    \ is stored in the `output_code` folder and contains code for displaying the values\
    \ above. Once that is done, the `foreach` loop is complete. Based on the code\
    \ given above, try completing the second `if-else` statement. This statement checks\
    \ if `$is_member` is `true`. If it is, we use an `include` statement to include\
    \ `logout.html`. This file is stored in the `output_code` folder and contains\
    \ HTML code with a logout link. In addition, we use an inner `if` statement to\
    \ check if `$update` is `true`. If it is, we use the `$reader` object to call\
    \ the `getLastPost()` method in the `BlogMember` class. Try completing this statement\
    \ yourself. Once that is done, the `p-read.php` file is complete. Great! You have\
    \ completed the hardest file in the project; we just need to tie up some ends\
    \ now.\n\n### 13.6.6 messagecard.php\n\nFirst, we need to add some code to `messagecard.php`\
    \ file. This file is found inside the `output_code` folder. As mentioned above,\
    \ this file contains code for displaying posts retrieved from the “posts” table.\
    \ When a user is logged in to our blog, we need to display a “New” icon in `read.php`\
    \ for posts that were posted after the user’s last login. As posts are displayed\
    \ using the `messagecard.php` file, we need to make some modifications. To do\
    \ that, replace the comment `//add code here` in `messagecard.php` with the following\
    \ `if` statement:\n\n```php\n<?php\nif ($is_member and $lastPost < $msgid) {\n\
    \    echo '<span class=\"new-post\">NEW</span>';\n    $update = true;\n}\n?>\n\
    ```\n\nHere, we use an `if` statement to check if the user is logged in. In addition,\
    \ we check if `$lastPost` is smaller than `$msgid`. `$lastPost` stores the id\
    \ of the last post viewed by the user. We got that by calling the `getLastPost()`\
    \ method in the first `if-else` statement in `p-read.php`. `$msgid` stores the\
    \ id of the current post in the `foreach` loop. If `$lastPost` is smaller than\
    \ the id of the current post, we know this is a new post. Hence, we use an `echo`\
    \ statement to echo a `<span>` tag with the word “NEW”. In addition, we set the\
    \ value of `$update` to `true`. `$update` is used to indicate whether we need\
    \ to call the `getLastPost()` method (in the last `if` statement in `p-read.php`).\
    \ If `$update` is `true`, we call the method to update the `last_viewed` column\
    \ in the “members” table to the latest post id in the “posts” table. Got it? Refer\
    \ to the `BlogMember` class (`BlogMember.php`) if you are not sure how the `getLastPost()`\
    \ method works.\n\nAfter inserting the `if` statement, we need to replace some\
    \ text in `messagecard.php` with PHP code. Specifically, we need to replace “post_title”,\
    \ “user_name”, “post_date” and “post_text” with the values of `$title`, `$username`,\
    \ `$postdate` and `$post` respectively. We do that using `echo` statements. For\
    \ instance, to replace “post_title”, we write:\n\n```php\n<?php echo $title; ?>\n\
    ```\n\nTry replacing “user_name”, “post_date” and “post_text” yourself. However,\
    \ before replacing “post_date”, we need to convert `$postdate` to a string. This\
    \ is because `$postdate` currently stores a UNIX timestamp. To display `$postdate`\
    \ in a more human-readable format, you need to use the `date()` function to convert\
    \ the timestamp to a datetime string. Try doing this yourself, using `'d-M-Y g:i'`\
    \ as the first argument to the function. Refer to Chapter 5.2.2 if you need help\
    \ with the `date()` function. Once you have updated `messagecard.php`, the process\
    \ folder is complete.\n\n### 13.7 The includes Folder\n\nWe are now ready to discuss\
    \ the three remaining files in the includes folder. These three files are `header.html`,\
    \ `debugging.php` and `loadclasses.php`.\n\n- `header.html` contains HTML code\
    \ for the `<head>` element and has already been completed for you.\n- `debugging.php`\
    \ contains code for handling errors and exceptions. This file was explained in\
