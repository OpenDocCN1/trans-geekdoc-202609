    \n```php\nfunction myDownHandler(){\n    $lastError = error_get_last();\n    if\
    \ (isset($lastError)) {\n        echo '<BR>Oppsss... Script terminated.<BR>';\n\
    \    }\n}\nregister_shutdown_function('myDownHandler');\n```\n\nHere, we declare\
    \ a function called `myDownHandler()`. Within the function, we need to determine\
    \ whether the termination is due to an error. To do that, we use `error_get_last()`.\
    \ This function returns `NULL` if no error occurred. On the other hand, if an\
    \ error occurred, it returns the last error as an associative array. The array\
    \ contains four keys: `type` (which gives the error type), `message` (which gives\
    \ the error message), `file` (the file where error occurred) and `line` (the line\
    \ where where error occurred). After calling `error_get_last()`, we use an `if`\
    \ statement to check if an error occurred. If it has, we echo a custom message\
    \ to users. After coding the `myDownHandler()` function, we use another built-in\
    \ function called `register_shutdown_function()` to register it as the shutdown\
    \ function. To test our shutdown function, add the following code to the end of\
    \ `errorHandling.php`:\n\n```php\nhello();\n```\n\nHere, we try to call a non-existent\
    \ function. If you load `errorHandling.php` now, you’ll get the message below:\n\
