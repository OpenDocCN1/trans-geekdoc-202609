    element (as defined by the parameter $tag ) with the word “Movies” enclosed. Else,
    it returns an element with the words “Award Winning Movies” enclosed. Next, replace
    the line echo $mov1->id.''<BR>''; in chap9.php with echo $mov1->displayHeading(''H1'');
