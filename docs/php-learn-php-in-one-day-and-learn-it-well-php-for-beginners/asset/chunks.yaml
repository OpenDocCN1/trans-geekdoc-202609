    \ to search for 20 in `$assocArrDemo`. we get \"C\" as the output. In the last\
    \ echo statement, we use `array_search()` to search for 'B' in `$assocArrDemo`.\
    \ we get false as 'B' is a key in the array, not a value.\n\n#### `in_array()`\n\
    \nThe `in_array()` function is similar to the `array_search()` function. However,\
    \ instead of returning the key or index, it returns true if the stated value is\
    \ found in the array. Else, it returns false. With reference to `$indexArrDemo`\
    \ and `$assocArrDemo` defined above:\n\n```php\nvar_dump(in_array(5, $indexArrDemo));\n\
    var_dump(in_array(20, $assocArrDemo));\nvar_dump(in_array('B', $assocArrDemo));\n\
    ```\ngive bool(true) bool(true) bool(false)\n\n#### `array_merge()`\n\nFinally,\
    \ we have the `array_merge()` function. This function merges two or more arrays\
    \ and returns the merged array. Example 1:\n\n```php\n$num1 = array(100, 111,\
    \ 120);\n$num2 = array(100, 3, 5);\n$num3 = array(1, 10);\n$newArray1 = array_merge($num1,\
    \ $num2, $num3);\n```\n`newArray1` becomes (100, 111, 120, 100, 3, 5, 1, 10).\n\
    \nExample 2:\n\n```php\n$names1 = array(5 => \"Peter\", 24 => \"Aaron\");\n$names2\
    \ = array(5 => \"Zac\", 4 => \"Alfred\", 7 => \"Avi\");\n$newArray2 = array_merge($names1,\
    \ $names2);\n```\n\nKeys are renumbered in the merged array if any of the arrays\
    \ passed to the `array_merge()` function is an associative array with integer\
    \ keys. In the example above, `$newArray2` becomes (0 => \"Peter\", 1 => \"Aaron\"\
    , 2 => \"Zac\", 3 => \"Alfred\", 4 => \"Avi\").\n\nExample 3:\n\n```php\n$str1\
