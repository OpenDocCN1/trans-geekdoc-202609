    Besides relying on PHP to throw exceptions for us, we can throw our own exceptions.
    We do that using the throw keyword. Let’s look at an example. Add the function
    below to the end of exceptionHandling.php (i.e., after the echo ''<BR>After connecting'';
    statement) : function displayUserInput($userInput){ if ($userInput > 100) { throw
    new OutOfRangeException(''<BR>User input is too big''); }else { echo ''<BR>''.$userInput;
    } } Here, we define a function called displayUserInput() that has one parameter
