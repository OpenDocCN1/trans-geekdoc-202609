    outside the Movie class. This is the gist of how access modifiers work; they basically
    control whether we can access a particular class member outside the class in which
    it is declared. Got it? In PHP, access modifiers are mandatory for properties
    but optional for methods. If we fail to declare the modifier for a property, we’ll
