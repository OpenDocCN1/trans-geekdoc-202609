    <BR><BR> Gender <BR> <input type = "radio" name = "gender" value = "M">Male <input
    type = "radio" name = "gender" value = "F">Female <BR><BR> <input type = "submit"
    name="sm" value = "Submit Form"> </form> </body> </html> Study the code above
    carefully. Notice that we use the following <form> tag to create a HTML form?
    <form action = "" method = "get"> This tag has two attributes - action and method
    . The action attribute specifies the file that we want to use to process the HTML
