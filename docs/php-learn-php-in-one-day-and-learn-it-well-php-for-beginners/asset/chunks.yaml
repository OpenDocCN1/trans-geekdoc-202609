    function As the name suggests, the strtotime() function converts a string to time.
    It accepts a string describing a specific date (and time) and tries to convert
    that to a timestamp. If you pass a string to the function that it is unable to
    convert, it returns false . On the other hand, if you pass a string that it is
    able to convert, it parses the string and returns the UNIX timestamp. A UNIX timestamp
    is an integer that gives us the number of seconds that have elapsed since January
    1 1970 00:00:00 UTC. For instance, if you run the statement echo strtotime("next
    Monday"); you’ll get something similar to 1587340800 This gives the UNIX timestamp
    for next Monday (at the time of writing). The strtotime() function is quite smart
    and is able to convert various English textual datetime descriptions into UNIX
    timestamps. For instance, it has no problem converting strings like "now" , "tomorrow"
    , "next Monday" , "15 Nov 2019" or "+1 week" . However, while the function is
    easy to use, you’ll probably agree that the timestamp it returns is not very useful
    in most cases. If you want to get a more meaningful format for a date or time,
    you can use another built-in function called date() . 5.2.2 The date() function
    The date() function accepts an optional timestamp and formats the timestamp into
    a more readable string. If the timestamp is not provided, it formats the current
    timestamp. Suppose we want to format a timestamp that is 10 hours from the current
    time, we can use the statement below: echo date(''d-M-Y'', strtotime("+ 10 hours"));
    Here, we pass two arguments to the function. The first argument specifies how
    we want the timestamp to be formatted. To do that, we use a string consisting
    of punctuation marks and predefined characters (as defined on [https://www.php.net/manual/en/function.date.php](https://www.php.net/manual/en/function.date.php)
    ). In our example, we use the string ''d-M-Y'' . The character ‘d’ indicates that
    we want the day to be represented as a two-digit number, using a leading zero
    if necessary (e.g., 3 is output as 03). The characters ‘M’ and ‘Y’ indicate that
    we want the month and year to be represented as a three-letter text (e.g., Jan)
    and a four-digit number respectively. Last but not least, the punctuation mark
    ‘-’ indicates that we want the day, month and year to be separated by hyphens.
    After specifying the desired format, we pass a second argument ( strtotime("+
    10 hours") ) to the date() function. This argument is optional and specifies the
    date we want the function to format. If you run the echo statement above, you’ll
    get an output similar to 03-Apr-2020 This gives the date 10 hours from now (at
    the point of writing). Got it? 5.2.3 Setting the timezone The sections above discussed
    two of the many built-in date/time functions in PHP. While most of these functions
    are easy to use, do note that their results are affected by the timezone set in
    our PHP server. For instance, while echo date(''d-M-Y'', strtotime("+ 10 hours"));
    gives us 03-Apr-2020 in one timezone, it may give us 04-Apr-2020 in another. To
    avoid any discrepancy in results, it is strongly recommended that you manually
    set the timezone in your PHP server if you want to use any date/time function
