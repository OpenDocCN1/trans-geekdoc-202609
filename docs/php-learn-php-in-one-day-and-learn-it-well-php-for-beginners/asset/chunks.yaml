    \ method when calling them.) If `isValidLogin()` returns false, assign an appropriate\
    \ error message to `$msg` to inform users that the login credentials are invalid.\
    \ Else, assign `$username` to `$_SESSION['username']`. In addition, declare a\
    \ session variable called `$_SESSION['is_admin']` and assign true to it. Finally,\
    \ redirect users to `write.php` using the `header()` function. Got it? Try coding\
    \ `p-admin.php` yourself. You can refer to `p-index.php` for reference. Once you\
    \ are done, we are ready to move on to `p-signup.php`.\n\n### 13.6.3 p-signup.php\n\
    \n`p-signup.php` is for processing `signup.php`, which contains a form for members\
    \ to sign up. To keep this project short, we’ll only create a sign-up form for\
    \ blog members, not for admin. We’ll learn to convert a blog member to an admin\
    \ later using phpMyAdmin. The sign-up form for blog members (`signup.php`) has\
    \ three input boxes named “username”, “password” and “confirm_password” and one\
    \ button named “submit”. If an error occurs when processing `signup.php`, the\
    \ page echoes an error message stored in a variable called `$msg`. Here’s what\
    \ we need to do in `p-signup.php`: First, declare and initialize three variables\
    \ `$h`, `$msg` and `$username` (similar to what was done in `p-index.php`). Next,\
    \ check if the `submit` button has been clicked. If it has, we first assign `$_POST['username']`\
    \ to `$username`. Next, we need to ensure the following:\n"
  raw: 'Chapter 13: Project Congratulations on making it to the end of the book! We’ve
    covered a lot in the preceding chapters. The best way to learn programming is
    to work on an actual project. In this chapter, we’re going to work through a project
    together. This project covers numerous concepts you’ve learned in the previous
    chapters and allows you to see how everything works together. We’ll also be covering
    some new miscellaneous concepts in this project. Excited? Let’s do it! 13.1 About
    the Project This project involves creating a website that works like a mini blog,
    where users with an admin account can log in to post. When posting to the blog,
    the admin user can choose whether to make the post available to non-members or
    members. Admin and members need to be logged in while non-members do not. Admin
    can read and write posts, members can read “Members only” posts after they log
    in, and non-members can only read “Public” posts. When a member or admin logs
    in to the site, the website retrieves the last post he/she has read and notifies
    him/her which posts are new. To see a demonstration of how the site works, go
    to [https://learncodingfast.com/php](https://learncodingfast.com/php) . 13.2 Acknowledgements
    and Requirements This project uses HTML, CSS, Javascript, PHP and MySQL. An understanding
    of HTML (especially HTML forms) and SQL is essential for the project. This chapter
    only covers PHP and will guide you through all the PHP code used. All HTML, CSS,
    Javascript and SQL code will be provided for you. You can download them at [https://learncodingfast.com/php](https://learncodingfast.com/php)
    . However, as the project uses Bootstrap ( [https://getbootstrap.com/](https://getbootstrap.com/)
    ) for the user interface and CKEditor ( [https://ckeditor.com/ckeditor-4/](https://ckeditor.com/ckeditor-4/)
    ) for the text editor, their code will not be provided. Instead, links will be
    provided in the <head> element to include these files from their respective content
    delivery networks (CDN). This means that you need an internet connection when
    running the code in the project . Certain instructions (such as creating a database
    and user account) provided here are specifically for XAMPP. If you are not using
    XAMPP, you’ll have to refer to the software’s documentation for specific instructions.
    Last but not least, this project uses PHP 5.5 and above. If you have just downloaded
    XAMPP, the PHP interpreter bundled with it is at least PHP 7. 13.3 Structure of
    the Project The main folder of the project is phpproject . Inside this main folder,
    we have eight files: admin.php , error.html , index.php , logout.php , read.php
    , signup.php , UI\_include.php and write.php . These files are responsible for
    the user interface of the blog. Besides the eight files, we have a sub-folder
    called includes . Inside includes , we have three files: loadclasses.php , header.html
    and debugging.php . We also have three sub-folders: process (contains files used
    for processing HTML forms), classes (contains files where we define our classes)
    and css (contains files with CSS code). 13.4 Creating Database, User Account and
    Tables Before we begin working on the PHP code, we need to create the database,
    tables and user account. First, ensure that you have started XAMPP and the Apache
    and MySQL servers. Next, proceed to [http://localhost/phpmyadmin/index.php](http://localhost/phpmyadmin/index.php)
    and follow the instructions in Chapter 11.5 to create a database called “project”.
    Next, create a user with the following information for the “project” database:
    User Name: project\_admin Host Name: localhost Choose your own desired password
    for the user and click “Go” to create the user. Once that is done, click on the
    SQL tab at the top of the page and copy the following SQL code into the editor.
    This code can be downloaded at [https://learncodingfast.com/php](https://learncodingfast.com/php)
    . USE project; CREATE TABLE IF NOT EXISTS members ( username VARCHAR(100) PRIMARY
    KEY, password VARCHAR(255) NOT NULL, is\_admin BOOLEAN DEFAULT false, last\_viewed
    int DEFAULT 0 ); CREATE TABLE IF NOT EXISTS posts( id INT AUTO\_INCREMENT PRIMARY
    KEY, post\_date TIMESTAMP DEFAULT NOW() NOT NULL, username VARCHAR(100) NOT NULL,
    title VARCHAR(255) NOT NULL, post TEXT NOT NULL, audience INT NOT NULL, CONSTRAINT
    FOREIGN KEY (username) REFERENCES members(username) ON DELETE CASCADE ); The code
    above creates two tables, “members” and “posts”, for the “project” database. Click
    on “Go” to execute the code. Once that is done, we are ready to work on the PHP
    code. 13.5 Editing The classes Folder First, navigate to your htdocs folder and
    paste the unzipped phpproject folder into it. Next, launch [http://localhost/phpproject/index.php](http://localhost/phpproject/index.php)
    in your browser. If you see the page below, all is good. ![](image_rsrc3AV.jpg)Close
    your browser and navigate to the htdocs\\phpproject\\includes\\classes folder
    on your computer. You should see five PHP files inside. 13.5.1 Helper.php We’ll
    start with Helper.php . Open this file in Brackets; you’ll see that we’ve created
    a class called Helper . This class has no properties and constructor. Inside the
    class, our job is to implement five public methods - passwordsMatch() , isValidLength()
    , isEmpty() , isSecure() and keepValues() . Let’s start with the passwordsMatch()
    method. This method has two parameters, $pw1 and $pw2 . In this project, to keep
    our code compatible with older versions of PHP, we will not be using type declaration
    for functions and methods. With this in mind, try declaring the passwordsMatch()
    method yourself. Next, within the method, we need to check if the values of the
    two parameters are equal. If they are, we return true . Else, we return false
    . Try doing this yourself. Hint: You need to use an if-else statement. Once you
    are done with the if-else statement, the passwordsMatch() method is complete.
    Next, let’s move on to the isValidLength() method. This method has three parameters
    - $str , $min and $max . $min has a default value of 8 , while $max has a default
    value of 20 . You can refer to Chapter 7.1 if you are not familiar with default
    values for functions (and methods). Within the method, we need to check if the
    length of $str is smaller than $min or greater than $max . If it is, we return
    false . Else, we return true . Try coding the method yourself. Hint: You can use
    the built-in function strlen() to get the length of $str . After the isValidLength()
    method, we have the isEmpty() method. This method has one parameter, $postValues
    , which stores an array. The method checks if any of the elements in the array
    is an empty string. Inside the method, we need to use a foreach loop to loop through
    each element in $postValues and use an if statement to check if the element equals
    an empty string. If it equals, we return true . After looping through all the
    elements, if no empty string is found, we return false . In other words, we return
    false outside the foreach loop. Try coding this method yourself. You can refer
    to Chapter 6.3.5 for help on using foreach loops. Next, we have the isSecure()
    method. This method has one parameter - $pw \- and checks if $pw contains at least
    one lowercase character, one uppercase character and one digit. To do so, we need
    to use regular expressions. A regular expression allows us to translate the requirements
    above (written in English) into an expression that PHP can understand. All regular
    expressions must start and end with a delimiter. This delimiter can be any non-alphanumeric,
    non-backslash and non-whitespace character. Often used delimiters include forward
    slashes ( / ), hash signs ( # ) and tildes ( ~ ). We’ll use tildes in our code.
    The regular expression for “at least one lowercase character” is ~\[a-z\]+~ ,
    where ~ is the delimiter, \[a-z\] represents the set of lowercase characters and
    + represents “at least one”. The regular expression for “at least one uppercase
    character” is ~\[A-Z\]+~ and that for “at least one digit” is ~\[0-9\]+~ . To
    check if $pw satisfies the regular expressions above, we need to use a built-in
    function called preg\_match() . This function accepts two arguments - the regular
    expression and the string that we want to check. The regular expression is passed
    as a string to the function. To check if $pw contains at least one lowercase character,
    we write preg\_match("~\[a-z\]+~", $pw) This returns true if $pw contains at least
    one lowercase character. Else, it returns false . Our isSecure() method needs
    to apply the preg\_match() function three times to check if all three requirements
    are met. If all three are met, it returns true . Else, it returns false . Try
    doing this yourself. Done? Last but not least, let’s move on to the most complicated
    method in the Helper class. This method is used to preserve user input in a form
    when the form is not processed successfully (you can refer to Chapter 8.1.4 for
    more details). To do that, we need to prefill the form with the user’s previous
    input when the form reloads. To prefill textboxes, we use the value attribute.
    For instance, <input type="text" value = "Hello" > prefills a textbox with “Hello”.
    To prefill textareas, we enclose the text between the <textarea> opening and closing
    tags. For instance, <textarea>Hello </textarea> prefills a textarea with “Hello”.
    To preselect drop-down lists, we add the word “selected” to the selected option.
    For instance, <select> <option value = ''P''>Public</option> <option value = ''M''
    selected >Members Only</option> </select> preselects the “Members Only” option.
    Our job now is to write a method to prefill/preselect user input for us. This
    method is called keepValues() and has three parameters - $val , $type and $attr
    . $val represents the value submitted by the user. For textboxes and textareas,
    the value submitted is the text entered into the respective form elements. For
    drop-down lists, the value submitted is the string assigned to the value attribute
    of the selected option. For instance, in the drop-down list above, if the second
    option is selected, the value submitted is ''M'' (not “Members Only”). $type represents
    the type of form element. $attr is only applicable for drop-down lists and has
    a default value of '''' (an empty string). It represents the string assigned to
    the value attribute of a drop-down list’s option. For instance, for the drop-down
    list above, $attr is ''P'' for the first option and ''M'' for the second. Try
    declaring this method yourself. Next, inside the method, we have the following
    switch statement: switch ($type){ case ''textbox'': echo "value = ''$val''"; break;
    case ''textarea'': //Add code here case ''select'': //Add code here default: echo
    ''''; } This statement uses the value of $type to determine what string to echo.
    The first case has been completed for you. Based on the description above, try
    completing the other two cases yourself by echoing a suitable string for the respective
    form elements. Hint: Refer to the underlined text for each HTML form element in
    the description above. For the ''select'' case, you need to use an if statement
    to compare the value of $val (which is the value submitted by the user) with $attr
    (which is the string assigned to the value attribute of an option) to decide whether
    to echo anything for a particular option. Got it? You may need to read through
    this section more than once to complete this switch statement. Once you are done
    with the switch statement, the keepValues() method is complete and so is the Helper
    class. Remember to close the braces for the switch statement, the keepValues()
    method and the class itself. 13.5.2 Database.php Next, let’s move on to the Database.php
    file. Inside this file, we’ve created a class called Database with three constants
    ( SELECTSINGLE , SELECTALL and EXECUTE ) and one private property ( $pdo ). In
    addition, we have a constructor that is used to create a new PDO object. You need
    to modify two things in the constructor. First, on line 13, you need to change
    “Your Password” to your actual password. Next, notice that $pdo is a property
    of the Database class? We learned in Chapter 9.2 that to access any property of
    a class, you need to use the $this keyword inside the class. Hence, on line 13,
    you need to change $pdo = … to $this->pdo = … The same applies to line 14. Try
    doing this yourself. Once that is done, the constructor is complete. Next, we
    need to add a public method called queryDB() to the Database class. To code this
    method, you need to be familiar with using prepared statements in PHP. You can
    refer to Chapter 11.4 for reference if you are not familiar. The queryDB() method
    has three parameters, $sql , $mode and $values . $sql represents the SQL statement
    to be executed, $mode indicates whether the method needs to fetch any row(s) from
    the database and $values , which has a default value of array() (i.e., an empty
    array), is used for binding variables to the placeholders in $sql . Try declaring
    the method yourself. Inside the method, we need to use the $pdo property (reminder:
    you access it using $this->pdo ) to prepare the SQL statement ( $sql ) and assign
    the result to a variable called $stmt . Try doing this yourself. Next, we need
    to bind values to the placeholders in the SQL statement. The placeholders and
    values for binding are passed as a two-dimensional array ( $values ) to the method.
    Refer to Chapter 5.3.1 if you are not familiar with multidimensional arrays. Suppose
    the placeholders are :username and :password and the variables to bind are $uname
    and $pwd respectively, users need to pass the following array to the queryDB()
    method: $values = array( array('':username'', $uname), array('':password'', $pwd)
    ); To process this array, we use the foreach loop below: foreach($values as $valueToBind){
    $stmt->bindValue($valueToBind\[0\], $valueToBind\[1\]); } When this loop runs
    for the first time, the array ('':username'', $uname) gets assigned to $valueToBind
    . Inside the loop, we use the bindValue() method to bind $uname ( $valueToBind\[1\]
    ) to '':username'' ( $valueToBind\[0\] ). When the loop runs for the second time,
    we use the bindValue() method to bind $pwd to '':password'' . Got it? Copy the
    foreach loop above into the queryDB() method and make sure you understand it before
    proceeding. After binding values to placeholders, we need to use $stmt to call
    the execute() method. Try doing this yourself. Finally, we need to determine if
    there are any values to be fetched. We do that using the second parameter - $mode
    . $mode can take one of three constants - SELECTSINGLE , SELECTALL or EXECUTE
    . These three constants were defined in the class previously. We use an if statement
    to determine whether we should fetch any results. The if statement works similar
    to the pseudocode below: if ($mode is not equal to SELECTSINGLE, SELECTALL and
    EXECUTE){ throw an Exception using ''Invalid Mode'' as the error message }else
    if ($mode equals SELECTSINGLE){ use $stmt to call the fetch(PDO::FETCH\_ASSOC)
    method and return the result using the return keyword }else if ($mode equals SELECTALL){
    use $stmt to call the fetchAll(PDO::FETCH\_ASSOC) method and return the result
    using the return keyword } First, we check if the value of $mode is valid (i.e.,
    it must be either SELECTSINGLE , SELECTALL or EXECUTE ). Next, we check if $mode
    is SELECTSINGLE or SELECTALL and use the $stmt variable to call the fetch(PDO::FETCH\_ASSOC)
    or fetchAll(PDO::FETCH\_ASSOC) method respectively. We then use the return keyword
    to return the results fetched. Try converting the pseudocode to PHP code yourself.
    Hint: To access the constants defined in the Database class, you need to use the
    self keyword or the class name followed by the :: operator. For instance, to access
    EXECUTE , you can write Database::EXECUTE . Refer to Chapter 9.7 for reference
    on using constants in classes. To throw an exception, you create a new Exception
    object and pass the error message to the constructor. Refer to Chapter 12.1.3
    for reference on throwing exceptions. Once you are done with the if statement,
    the queryDB() method is complete and so is the Database class. 13.5.3 BlogReader.php
    Now, let’s proceed to the BlogReader class. This class has two constants, READER
    and MEMBER , with values 1 and 2 respectively. In addition, it has two protected
    properties $db and $type . The constructor of the class has been coded for you.
    public function \_\_construct(){ $this->db = new Database(); $this->type = BlogReader::READER;
    } This constructor initializes the values of $db and $type . Now, we need to add
    a method called getPostsFromDB() to the class. This method is public and has no
    parameter; try declaring it yourself. A blog reader refers to readers of the blog
    who are not logged in. Readers who are not logged in can only read posts from
    the “posts” table where the “audience” column has a value smaller than or equal
    to 1. Hence, inside the getPostsFromDB() method, we need to use the following
    statement to query the “posts” table: $sql = "SELECT id, unix\_timestamp(post\_date)
    as \`post\_date\`, username, title, post, audience FROM posts WHERE audience <=
    :audience ORDER BY id DESC"; Add the statement above to the getPostsFromDB() method;
    we’ll use the queryDB() method to execute it later. This statement has one placeholder
    :audience . Based on what we mentioned when we coded the Database class, we need
    to declare a two-dimensional array and use it to bind a value to the placeholder.
    This is done with the following statement: $values = array( array('':audience'',
    $this->type) ); Here, we declare a two dimensional array called $values with one
    inner array -   ('':audience'', $this->type) . We use this inner array to bind
    the $type property to the :audience placeholder. As we’ve previously assigned
    BlogReader::READER (which equals 1 ) to the $type property in the constructor,
    we are essentially binding the value 1 to the :audience placeholder. Got it? Add
    the $values array above to the getPostsFromDB() method. Next, we need to use the
    Database object ( $db ) to call the queryDB() method in the Database class. To
    do that, we use the statement below: $result = $this->db->queryDB($sql, Database::SELECTALL,
    $values); Here, we use $this->db to access $db as it is a class property. After
    accessing $db , we use it to call the queryDB() method, passing the SQL statement
    ( $sql ), the mode ( Database::SELECTALL ) and the $values array to the method.
    The mode is Database::SELECTALL as we are retrieving more than one row from the
    “posts” table. Next, we assign the result returned to a variable called $result
    . Add the statement above to the getPostsFromDB() method. Finally, we need to
    check if there are any rows returned by the queryDB() method. To do that, we check
    if there are any elements in $result . If there aren’t, we return false . Else,
    we return the $result array. Try writing this if statement yourself. Hint: You
    can use the count() function to get the number of elements in $result . Once that
    is done, the getPostsFromDB() method is complete and so is the BlogReader class.
    Read through the getPostsFromDB() method carefully and make sure you understand
    it before proceeding; we’ll be coding many methods similar to it later. 13.5.4
    BlogMember.php Now, let’s write a class that extends the BlogReader class. Open
    BlogMember.php and create a new class called BlogMember . This class extends the
    BlogReader class and has a private property called $username . Try declaring the
    class yourself. Inside the class, we have a constructor that has one parameter
    - $pUsername . Inside the constructor, we need to call the parent class constructor
    to initialize the inherited property $db . Next, we need to assign $pUsername
    to the $username property and BlogMember::MEMBER (this constant is inherited from
    the BlogReader class) to the inherited property $type . Try implementing the constructor
    yourself. Hint: You need to use the parent keyword, followed by the :: operator,
    to call the parent class constructor. Got it? Good! After you have implemented
    the constructor, you need to implement six more methods. The methods are: public
    function isDuplicateID() public function insertIntoMemberDB($pPassword) public
    function isValidLogin($pPassword) private function getLatestPostID() public function
    updateLastViewedPost() public function getLastViewedPost() Let’s start with the
    isDuplicateID() method. This method is public and has no parameter. It is called
    whenever a new user signs up and returns true if the username selected by the
    new user already exists in the “members” table. Try declaring the method yourself.
    Inside the method, we need to execute the following SQL statement: SELECT count(username)
    AS num FROM members WHERE username = :username This statement returns 0 if the
    username bound to :username is not found. Try using the queryDB() method in the
    Database class to execute this SQL statement. You need to bind the $username property
    to :username and use the Database::SELECTSINGLE mode (as we are only selecting
    one row from the database) to call the queryDB() method. Try doing this yourself.
    You can refer to the getPostsFromDB() method in the BlogReader class for reference
    on using the queryDB() method. Got it? Once that is done, assign the result returned
    by queryDB() to a variable called $result . Next, use an if statement to check
    if $result\[''num''\] is equal to zero. If it is, return false . Else, return
    true . Try coding this method yourself. Once you have completed the isDuplicateID()
    method, we can move on to the insertIntoMemberDB() method. This method is public
    and has one parameter - $pPassword . It is used to insert a new row into the “members”
    table when a new user signs up. $pPassword stores the password entered by the
    user when he/she submits the sign-up form. Inside the method, we need to use the
    queryDB() method with the Database::EXECUTE mode (as we are not fetching any data
    from the database) to execute the following SQL statement: INSERT INTO members
    (username, password) VALUES (:username, :password) To execute this statement,
    we need to bind $username (the class property) to :username and $pPassword (the
    parameter) to :password . However, as $pPassword stores the password selected
    by our user, we should not store it in the database in its original form. Instead,
    we should hash it first. Hashing is similar to encrypting and can be done using
    a built-in function in PHP called password\_hash() . This function is available
    from PHP 5.5 onwards and accepts two arguments - the string to hash and the algorithm
    to use. The algorithm to use can be any of the predefined constants found at [https://www.php.net/manual/en/password.constants.php](https://www.php.net/manual/en/password.constants.php)
    . In our project, we’ll use PASSWORD\_DEFAULT as the constant. This constant indicates
    that we’ll use the default algorithm in PHP. To hash $pPassword , we use the code
    below: password\_hash($pPassword, PASSWORD\_DEFAULT) Hence, to bind values to
    the :username and :password placeholders in our SQL statement, we use the $values
    array below: $values = array( array('':username'', $this->username), array('':password'',
    password\_hash($pPassword, PASSWORD\_DEFAULT)) ); Try using this array, the Database::EXECUTE
    constant and the SQL INSERT statement above to call the queryDB() method. Once
    that is done, the insertIntoMemberDB() method is complete. There is no need to
    return any result for this method as the queryDB() method does not return any
    result when the mode is Database::EXECUTE . Done? Great! Let’s move on to the
    isValidLogin() method. This method is public and has one parameter - $pPassword
    . It checks if the username and password entered by the user are valid when he/she
    tries to log in. Inside the method, we need to use the queryDB() method to execute
    the following SQL statement: SELECT password FROM members WHERE username = :username
    To do that, you need to bind the $username property to :username and use the Database::SELECTSINGLE
    mode (as we are only selecting one row from the database) to call the queryDB()
    method. Once that is done, assign the result to a variable called $result . Try
    doing this yourself. Next, we need to check if $result\[''password''\] is set.
    $result\[''password''\] is set only if the fetch() method in queryDB() manages
    to fetch the password. If there is no user with the username stated in the SQL
    query, $result\[''password''\] will not be set. Besides checking if $result\[''password''\]
    is set, we also need to check if the password entered by the user matches the
    password fetched from the database. Recall that the password stored in the database
    is hashed and no longer in its original form? To check if the hashed password
    matches the password entered by the user, we need to use another built-in function
    called password\_verify() . This function accepts two arguments and returns true
    if the first argument matches the second. The second argument has to be a password
    hashed using the password\_hash() function. In our isValidLogin() method, to determine
    if the two passwords match, we use the following if statement: if (isset($result\[''password''\])
    && password\_verify($pPassword, $result\[''password''\])) return true; else return
    false; Add the statement above to the isValidLogin() method and the method is
    complete. Great! Let’s proceed to the getLatestPostID() method. This is a private
    method with no parameters and will be used in the updateLastViewedPost() method
    later. Try declaring it yourself. Inside the method, we need to use the queryDB()
    method to execute the following SQL statement: SELECT max(id) AS max FROM posts
    Decide on the appropriate mode to use for this SQL statement and try calling the
    queryDB() method yourself. Note that for this SQL statement, there is no need
    to pass any array to the queryDB() method as the statement does not contain any
    placeholder. Once you have executed the queryDB() method, assign the result to
    a variable called $result . The SQL statement above returns NULL if there is no
    post in the “posts” table. Hence, we need to first check if $result\[''max''\]
    is set. If it is, we return its value. Else, we return 0 . Try doing this yourself.
    Once this is done, the getLatestPostID() method is complete and we can move on
    to the updateLastViewedPost() method. The updateLastViewedPost() method is public
    and has no parameters. Try declaring it yourself. Inside the method, we need to
    update the “last\_viewed” column of the “members” table to reflect the latest
    post viewed by a member. Whenever a member logs into our website, the “last\_viewed”
    value of that member will be updated to the id of the latest post in the “posts”
    table. This id is given by the getLatestPostID() method we coded earlier. To use
    this method, add the following line to the updateLastViewedPost() method: $max
    = $this->getLatestPostID(); Here, we use the $this keyword to call the getLastestPostID()
    method and assign its result to $max . Next, we need to use the queryDB() method
    to execute the following SQL statement: UPDATE members SET last\_viewed = :max
    WHERE username = :username To execute this statement, we need to bind the $username
    property to :username and the variable $max to :max . In addition, we need to
    decide on the appropriate mode to use when calling queryDB() . Try doing this
    yourself. Once this is done, the method is complete. Finally, we move on to the
    getLastViewedPost() method. This method is public and has no parameters. It uses
    the queryDB() method to execute the following SQL statement: SELECT last\_viewed
    FROM members WHERE username = :username To execute this statement, we need to
    bind the $username property to :username and decide on the appropriate mode to
    use when calling the queryDB() method. Try doing this yourself and assign the
    result to a variable called $result . Next, we need to check if $result\[''last\_viewed''\]
    is set. If there is no user with the username stated in the SQL query, $result\[''last\_viewed''\]
    will not be set. If $result\[''last\_viewed''\] is set, we return its value. Else,
    we return 0 . Try doing this yourself. Once this is done, the getLastViewedPost()
    method is complete and so is the BlogMember class. 13.5.5 Admin.php We are left
    with one more class to code - the Admin class. The Admin class has two private
    properties - $db and $username . Inside the class, we have a constructor with
    one parameter - $pUsername . This constructor initializes $username with $pUsername
    and $db with a new Database object. Try declaring the class and properties and
    implement the constructor yourself. Next, we have a public method called isValidLogin()
    that has one parameter - $pPassword . This method is very similar to the isValidLogin()
    method in the BlogMember class except that it executes the following SQL statement:
    SELECT password FROM members WHERE username = :username AND is\_admin = true Try
    coding this method yourself. Once that is done, we can move on to the final method
    - insertIntoPostDB() . This method is public and has three parameters - $title
    , $post and $audience . Inside the method, we use the queryDB() method to execute
    the following SQL statement: INSERT INTO posts (username, title, post, audience)
    VALUES (:username, :title, :post, :audience) You need to bind the $username property
    to :username and the parameters $title , $post and $audience to :title , :post
    and :audience respectively. In addition, you need to choose the correct mode for
    queryDB() . Try coding this method yourself. Done? Great! All our classes are
    now complete. We are ready to move on to the process folder. 13.6 Editing The
    process Folder The files in the process folder are for processing HTML forms.
    13.6.1 p-index.php We’ll start with p-index.php . This file is for processing
    index.php , which contains a form for members to log in to read “Members Only”
    posts. index.php has two input boxes named “username” and “password” and one button
    named “submit”. If an error occurs when processing index.php , the page echoes
    an error message stored in a variable called $msg . If you open p-index.php (inside
    the process folder), you’ll see that the code has already been completed for you.
    This is done so that you can refer to this file when working on other processing
    files later. Let’s run through the code together. First, we declare a variable
    called $h and assign a new Helper object to it. Next, we declare two variables
    $msg and $username and assign an empty string to each of them. After declaring
    and initializing the variables, we are ready to process the form in index.php
    . We use the following if statement to check if the “submit” button has been clicked.
    if (isset($\_POST\[''submit''\])) { } Inside the if block, we first assign $\_POST\[''username''\]
    to $username . We need to do this as we’ll be using $username in index.php later.
    Next, we use an if-else statement to check if users have entered data into both
    the “username” and “password” input boxes. To do that, we use $h to call the isEmpty()
    method in the Helper class. This method accepts an array that contains all the
    variables we want to check. We pass the following array to the method: array($username,
    $\_POST\[''password''\]) If any of the elements in the array is an empty string,
    the isEmpty() method returns true . When that happens, the if block is executed
    and the string ''All fields are required'' is assigned to $msg . On the other
    hand, if none of the elements are empty, the else block is executed. Inside the
    else block, we create a BlogMember object called $member . Next, we have another
    if-else statement. This inner if-else statement uses the $member object to call
    the isValidLogin() method in the BlogMember class. If the method returns false
    , the condition !$member->isValidLogin($\_POST\[''password''\]) evaluates to true
    (as !false equals true ) and the if block is executed. The string ''Invalid Username
    or Password'' will then be assigned to $msg . On the other hand, if the method
    returns true , the else block is executed. Within this else block, we assign $username
    to a session variable called $\_SESSION\[''username''\] and use the header() function
    to redirect users to read.php . Once that is done, the p-index.php page is complete.
    Go through p-index.php carefully and make sure you understand it before proceeding.
    Got it? Great! 13.6.2 p-admin.php Let’s move on to the p-admin.php file now. This
    file is for processing admin.php , which contains a form for admin to log in.
    admin.php has two input boxes named “username” and “password” and one button named
    “submit”.  If an error occurs when processing admin.php , the page echoes an error
    message stored in a variable called $msg . As you may have guessed, p-admin.php
    is very similar to p-index.php . Here’s what we need to do in p-admin.php : First,
    declare and initialize $h , $msg and $username (similar to what was done in p-index.php
    ). Next, check if the “submit” button has been clicked. If it has, assign $\_POST\[''username''\]
    to $username . Next, ensure that all input boxes are not empty. If any of the
    boxes are empty, assign an appropriate error message to $msg . Else, create an
    Admin object and use it to call the isValidLogin() method. (Refer to the Admin
    class to find out what needs to be passed to the constructor and the isValidLogin()
    method when calling them.) If isValidLogin() returns false , assign an appropriate
    error message to $msg to inform users that the login credentials are invalid.
    Else, assign $username to $\_SESSION\[''username''\] . In addition, declare a
    session variable called $\_SESSION\[''is\_admin''\] and assign true to it. Finally,
    redirect users to write.php using the header() function. Got it? Try coding p-admin.php
    yourself. You can refer to p-index.php for reference. Once you are done, we are
    ready to move on to p-signup.php . 13.6.3 p-signup.php p-signup.php is for processing
    signup.php , which contains a form for members to sign up. To keep this project
    short, we’ll only create a sign-up form for blog members, not for admin. We’ll
    learn to convert a blog member to an admin later using phpMyAdmin. The sign-up
    form for blog members ( signup.php ) has three input boxes named “username”, “password”
    and “confirm\_password” and one button named “submit”. If an error occurs when
    processing signup.php , the page echoes an error message stored in a variable
    called $msg . Here’s what we need to do in p-signup.php : First, declare and initialize
    three variables $h , $msg and $username (similar to what was done in p-index.php
    ). Next, check if the “submit” button has been clicked. If it has, we first assign
    $\_POST\[''username''\] to $username . Next, we need to ensure the following: '
