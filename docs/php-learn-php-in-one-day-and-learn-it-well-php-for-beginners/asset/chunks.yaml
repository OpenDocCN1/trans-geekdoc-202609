  trans: "\n\n# 第 2 章：安装 XAMPP\n\n正如上一章提到的，在本章中我们将学习如何设置 Web 服务器并安装 PHP 解释器。此外，由于我们在书的后续部分将使用\
    \ PHP 与数据库进行交互，我们还需要设置数据库服务器。为了设置 Web 服务器和数据库服务器，我们需要安装三个软件：Apache Web 服务器、PHP\
    \ 解释器和 MarieDB 数据库服务器。如果一个接一个安装这三个软件，可能会非常繁琐。幸运的是，Apache Friends 的热心人士创建了一个包含了我们所需所有软件的免费软件包。这个软件包被称为\
    \ `XAMPP`，代表跨平台（X）、Apache Web 服务器（A）、MarieDB 数据库服务器（M）、PHP（P）和 Perl（P）。\n\nMarieDB\
    \ 数据库服务器是 `MySQL` 服务器的社区开发分支版本。虽然 `XAMPP` 中的 `M` 正式代表 `MarieDB`，但你会发现 `XAMPP`\
    \ 在软件中将数据库服务器标记为 `MySQL`。我们将遵循这一标记，在书中将数据库服务器称为 `MySQL`。关于安装 `XAMPP` 以及使用它设置服务器的详细说明，请查看\
    \ [`learncodingfast.com/how-to-install-xampp-and-brackets`](https://learncodingfast.com/how-to-install-xampp-and-brackets)。说明可以在本书的配套网站上找到，每当\
    \ `XAMPP` 有任何变化时，你都可以在网站上找到更新后的说明。这将确保你始终获得最新的安装说明。除了安装 `XAMPP` 之外，强烈建议你安装一个高级文本编辑器来编写代码。虽然你完全可以在基础文本编辑器（如\
    \ `Notepad`）中编写代码，但高级文本编辑器提供语法高亮等功能，可以让你的代码更易于阅读和调试。推荐的免费编辑器是 `Brackets`。关于安装\
    \ `Brackets` 的说明，也请前往 [`learncodingfast.com/how-to-install-xampp-and-brackets`](https://learncodingfast.com/how-to-install-xampp-and-brackets)。\n\
    \n## 2.1 配置 php.ini\n\n在电脑上安装好 `XAMPP` 和 `Brackets` 之后，你就可以开始创建你的动态网站了。然而，在我们开始之前，我们需要对\
    \ PHP 服务器上的错误设置进行一些更改。这确保了每当代码中出现任何错误时，浏览器上都会显示错误消息。要配置这些设置，最直接的方法是修改名为 `php.ini`\
    \ 的文件。以下说明在编写时是有效的。如果说明有任何更改，你可以在 [`learncodingfast.com/php`](https://learncodingfast.com/php)\
    \ 找到更新后的说明。要修改 `php.ini`，我们需要先找到文件。在 Windows 上，启动 `XAMPP` 并点击 `Apache` 的“Config”按钮。接下来，选择\
    \ `php.ini`。文件将在 `Notepad` 中打开。![](img/image_rsrc3AJ.jpg)\n\n在 Mac 上，启动 `XAMPP`\
    \ 并点击“General”标签页中的“Start”按钮。等待状态变为绿色。接下来，选择“Volumes”标签页并点击“Mount”按钮。最后，点击“Explore”并寻找“etc”文件夹。你会在该文件夹找到\
    \ `php.ini`。使用 `Brackets` 打开它。![](img/image_rsrc3.jpg)\n\n一旦打开了 `php.ini`，滚动到页面底部并添加添加以下几行：\n\
    \n```\nerror_reporting=ALL\ndisplay_errors=On\n```\n\n将这些行添加到页面底部，是为了如果之前已经设置过这些设置（在\
    \ `php.ini` 文件的早期部分），新行将覆盖旧设置。保存文件并重启 `Apache`。在 Windows 上，停止 `Apache` 服务器（如果它正在运行）然后重新启动。在\
    \ Mac 上，选择“Services”标签页并点击“Apache”。如果 `Apache` 正在运行，点击“Restart”按钮。否则，点击“Start”按钮。等待\
    \ `Apache` 重启，你的设置将会更新。当代码中有错误时，现在你会收到错误消息。根据你使用的 PHP 版本，测试代码时遇到的错误可能与描述的不同。不要担心这一点。\n\
    \n## 2.2 重要链接\n\n在编写我们的第一个网页之前，我想让你注意两个重要链接。第一个是 [`learncodingfast.com/php`](https://learncodingfast.com/php)。本书使用了大量示例来解释不同的概念。我们鼓励你自己在\
    \ `Brackets` 中输入这些示例，如果你不愿意，可以在上面的链接下载源代码。项目文件和本书的任何更新也可以在那里找到。我们已尽努力确保书中没有错误，所有源代码已在多台机器上经过广泛测试，如果发现任何错误，你可以在\
    \ [`learncodingfast.com/errata`](https://learncodingfast.com/errata) 找到。\n\n##\
    \ 2.3 编写我们的第一个网页\n\n太棒了！我们现在准备好编写代码了。首先，确保你在 `XAMPP` 中启动了 `Apache`。注意：如果在启动 `Apache`\
    \ 时遇到任何问题，可能是由于端口冲突。按照 [`learncodingfast.com/how-to-install-xampp-and-brackets`](https://learncodingfast.com/how-to-install-xampp-and-brackets)\
    \ 的说明解决冲突。接下来，在 `Brackets` 中创建一个新文件并添加以下代码：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <title>My first PHP page</title>\n</head>\n<body>\n    <h1>My first\
    \ PHP page</h1>\n    <?php #Simple hello world page\n    echo \"Hello World!\"\
    ;\n?>\n</body>\n</html>\n```\n\n如果你使用的是电子书阅读器，上面的行可能会因为宽度限制而换行。尝试将设备切换为横屏模式或使用较小的字体。这适用于书中的所有示例。将上面的文件保存为\
    \ `hello.php` 到你的 `htdocs` 文件夹中。任何包含 PHP 代码的文件必须以 `.php` 扩展名保存。以 `.php` 结尾的文件称为\
    \ PHP 脚本。你可以在 `XAMPP`（Windows）或 `LAMP`（Mac）文件夹找到 `htdocs` 文件夹。`htdocs` 是你本地 Web\
    \ 服务器的根目录。\n\n在 Windows 上，要加载 `htdocs` 中的文件，只需在浏览器地址栏输入 `http://localhost/<filename>`。例如，要加载\
    \ `hello.php`，输入 [`localhost/hello.php`](http://localhost/hello.php)。在 Mac 上，加载\
    \ `htdocs` 中文件的简单方法是启用端口转发。这可以在 XAMPP 的“Network”标签页下完成。假设你在 XAMPP 中启用了 `localhost:8080->80`（通过\
    \ SSH），要加载 `hello.php`，请在浏览器地址栏中输入 [`localhost:8080/hello.php`](http://localhost:8080/hello.php)。懂了吗？你可以参考\
    \ [`learncodingfast.com/how-to-install-xampp-and-brackets`](https://learncodingfast.com/how-to-install-xampp-and-brackets)\
    \ 获取更详细的说明。为了方便引用，从现在起，我将使用 [`localhost`](http://localhost) 指代你的本地。如果你使用的是 Mac，请在\
    \ URL 中添加端口号（例如 [`localhost:8080`](http://localhost:8080)）。\n\n现在让我们分析 `hello.php`\
    \ 中的代码。大部分代码你看起来应该是熟悉的，除了以下内容：\n\n```php\n<?php \n#Simple hello world page \n\
    echo \"Hello World!\"; \n?>\n```\n\n上面的 `<?php` ... `?>` 标签被称为 PHP 标签；它们告诉服务器内部的代码被视为\
    \ PHP 代码。在示例中，我们有两行简单的 PHP 代码（一行是注释，一行是语句）。第一行 `#Simple hello world page` 是注释。注释是由程序员编写的，用于向其他程序员解释代码；PHP\
    \ 解释器会忽略这些注释。要在我们的代码中添加单行注释，我们在注释前加上 `#` 或 `//`。例如：\n\n```php\n# This is a comment\n\
    // This is also a comment\n```\n\n要添加多行注释，我们将注释包含在 `/*...*/*/` 中。例如：\n\n```php\n\
    /*\nThis is an example of a multi-line comment.\n*/\n```\n\n注释之后，我们使用语句 `echo\
    \ \"Hello World!\";` 在浏览器上显示“Hello World!”字样。这被称为 `echo` 语句；我们将在下一章中学习更多内容。注意我们\
    \ `echo` 语句是以分号（`;`）结尾的。PHP 中的所有语句都必须以分号结尾。这类似于我们在英语中使用句号（`.`）结束句子。\n\n"
- fmt: "\n# Chapter 3: Basic PHP Tasks\n\nIn the previous chapter, we installed XAMPP\
    \ and Brackets and coded our first PHP script. In this chapter, we’re going to\
    \ learn to perform three very fundamental tasks in PHP - displaying outputs to\
    \ users, duplicating code across multiple pages and redirecting users.\n\n## 3.1\
    \ Displaying Outputs\n\nBefore we learn to display outputs, let’s create a PHP\
    \ file to serve as a template for us to test the PHP statements in this section.\
    \ Create a file in Brackets and save it as `output.php` to your `htdocs` folder.\
    \ Add the following code to `output.php`:\n\n```php\n<?php\n//Add code here\n\
    ```\n\nWhenever you want to test any PHP statement in this section, you can add\
    \ the statement to `output.php` (after the `<?php` opening tag) and load it in\
    \ your browser to check the output.\n\nNotice that we did not add a closing tag\
    \ (`?>` to `output.php`? This is because `output.php` only contains PHP code.\
    \ According to the standard recommended by the PHP Framework Interop Group, any\
    \ PHP script that only contains PHP code should not end with a closing tag. This\
    \ is to prevent unwanted whitespaces at the end of the file, which can cause issues\
    \ such as an “Headers already sent” warning when modifying response headers. Do\
    \ not worry if the statement above does not make any sense; we’ll learn about\
    \ the “Headers already sent” warning later. For now, let’s move on to learn how\
    \ to display outputs in PHP.\n\n### 3.1.1 echo\n\nThe easiest way to display outputs\
    \ in PHP is to use an `echo` statement. To do that, we enclose the text that we\
    \ want to display in a pair of matching quotation marks after the `echo` keyword.\
    \ The `echo` keyword is not case sensitive. Hence, `echo`, `Echo` or `ECHO` will\
    \ all work.\n\nUsing an `echo` statement is straightforward. We did that in Chapter\
    \ 2 when we used it to display the words “Hello World!”. In addition to using\
    \ `echo` statements to display simple text messages, we can use them to display\
    \ text with HTML markup. For instance, we can write `echo 'PHP is fun<BR>and easy!';`\
    \ This gives us PHP is fun and easy! as the output; the text “and easy!” is displayed\
    \ on the second line due to the `<BR>` tag.\n\nWe can also combine multiple messages\
    \ in a single `echo` statement. To do that, we separate the messages with commas.\
    \ For instance, `echo \"ABCD\", \"EFGH\";` gives us ABCDEFGH as the output. Combining\
    \ messages is useful when our message is more complex, such as when the message\
    \ includes variables and functions. We’ll learn about variables and functions\
    \ in later parts of the book.\n\nLast but not least, we can use an `echo` statement\
    \ with or without parentheses. You may have seen some code that does the following:\
    \ `echo (\"ABCD\");` This is fine in most cases. However, if you use parentheses,\
    \ you are not allowed to combine multiple messages in a single `echo` statement.\
    \ For instance, `echo (\"ABCD\", \"EFGH\");` will give us an error. In most cases,\
    \ you are better off using `echo` statements without parentheses.\n\n### 3.1.2\
    \ print\n\nBesides using `echo` statements to display outputs, we can use `print`\
    \ statements. `print` statements are VERY similar to `echo` statements. Let’s\
    \ look at an example: `print \"My name is Brody.\";` gives us My name is Brody.\
    \ as the output. As you can see, the `print` statement works just like an `echo`\
    \ statement. While there are some differences between them, in most cases, there\
    \ is no need to use the `print` statement.\n\nIn PHP, it is fairly common that\
    \ there is more than one way to perform a certain task. This is one of the main\
    \ complaints developers have about PHP, as it complicates things unnecessarily.\
    \ In most cases, the different ways are very similar to each other. In order not\
    \ to overwhelm you with too many options, I'll stick with one option in this book\
    \ and briefly mention other options if necessary. In this book, I’ll be using\
    \ `echo` statements to display outputs.\n\n### 3.1.3 Escaping Characters\n\nNext,\
    \ let’s learn to escape characters in PHP. In the previous sections, we learned\
    \ to enclose text in quotation marks when we use an `echo` (or `print`) statement.\
    \ What happens if we want to display an apostrophe? For instance, suppose we have\
    \ the following statement: `echo '<BR>Today is Friday, we're going to the zoo.';`\
    \ We’ll get an error when we try to run the statement above as PHP does not differentiate\
    \ between an apostrophe and a quotation mark by default. Hence, it treats the\
    \ apostrophe in the word “we’re” as a closing quotation mark. In other words,\
    \ it sees the statement as `echo '<BR>Today is Friday, we'` and expects a semicolon\
    \ or comma after the apostrophe. When that does not happen, PHP gets confused\
    \ and gives us an error.\n\nThere are two ways to deal with the error above. The\
    \ first is to use double quotation marks to enclose the text and rewrite the statement\
    \ as `echo \"<BR>Today is Friday, we're going to the zoo.\";` As PHP uses a double\
    \ quotation mark to close another double quotation mark, the apostrophe in “we’re”\
    \ is not mistakenly interpreted as a closing quotation mark.\n\nAlternatively,\
    \ we can escape the apostrophe in the original statement by preceding it with\
    \ a backslash character (`\\\\`). Escaping a character alters the meaning of the\
    \ character. Without the backslash character, the apostrophe is interpreted as\
    \ a closing single quote. With it, it is treated as an apostrophe meant to be\
    \ displayed on the browser. For instance, to display the apostrophe in the previous\
    \ example, we can use the statement below: `echo '<BR>Today is Friday, we\\\\\
    're going to the zoo.';` This gives us the following output: Today is Friday,\
    \ we're going to the zoo.\n\nOther common uses of the backslash character include:\n\
    - Using it to display a double quotation mark: `echo \"\"\"` gives us an error,\
    \ while `echo \"\\\\\"\";` gives us `\"`\n- Using it to display the backslash\
    \ character itself: `echo \"\\\"` gives us an error, while `echo \"\\\\\\\\\"\
    ;` gives us `\\`\n\n## 3.2 Duplicating Code\n\nNext, let’s move on to learn how\
    \ to duplicate code in our scripts. In PHP, generally speaking, scripts are independent\
    \ of another. Hence, code written in one script (say, `index.php`) is not available\
    \ once users navigate to another page. If we want multiple pages on our website\
    \ to have the same HTML or PHP code, we need to use the `include` statement.\n\
    \n### 3.2.1 include\n\nSuppose you want multiple pages on your website to have\
    \ the same `<h1>` heading, you do not need to copy and paste the code into all\
    \ the pages. Instead, you can use the `include` statement. Let’s try that out.\
    \ Create a file called `heading.html` (in `htdocs`) and add the following code\
    \ to it: `<h1>Welcome to PHP</h1>`\n\nNext, create another file called `includedemo.php`\
    \ and save it to `htdocs` too. Add the following code to `includedemo.php`:\n\n\
    ```php\n<!DOCTYPE html>\n<html>\n<body>\n<?php include 'heading.html'; ?>\n</body>\n\
    </html>\n```\n\nNotice the statement `include 'heading.html';` in `includedemo.php`.\
    \ When PHP sees this statement, it goes to `heading.html`, copies the code inside,\
    \ and pastes it into `includedemo.php` for us automatically. This saves us the\
    \ trouble of having to copy the code ourselves. If you launch `includedemo.php`\
    \ now, you’ll see the words “Welcome to PHP” displayed as a `<h1>` heading. \n\
    \nGot it?\n\nTo use an `include` statement, we need to give PHP the path of the\
    \ file we want to include. This is similar to what we do in HTML when we link\
    \ CSS or other files to our webpages. In our example above, as `heading.html`\
    \ is stored in the same folder as `includedemo.php`, we simply give it the filename.\
    \ If `heading.html` is stored in another folder (say in a folder called `includes`\
    \ inside `htdocs`), we need to use the statement below: `include 'includes/heading.html';`\n\
    \n### 3.2.2 require\n\nBesides the `include` statement, PHP also has the `require`\
    \ statement. The difference between the two is that `require` produces a fatal\
    \ error and stops the script if PHP fails to find the file. `include`, on the\
    \ other hand, will only produce a warning without stopping the script. If the\
    \ content you want PHP to “copy and paste” into your file is crucial to the correct\
    \ execution of the page, you should use the `require` statement. Otherwise, you\
    \ can use the `include` statement.\n\n### 3.2.3 include_once, require_once\n\n\
    Both the `include` and `require` statements come with `_once` version. As the\
    \ names suggest, `include_once` and `require_once` only “copy and paste” the code\
    \ into the file once. These statements are useful in cases where the same file\
    \ may be included more than once (for instance, when the script is so long you\
    \ have lost track of whether you have included the file previously). If you add\
    \ another `include 'heading.html';` statement to `includedemo.php` (before the\
    \ `?>` tag) and load the page, you’ll get “Welcome to PHP” displayed as a `<h1>`\
    \ heading twice. On the other hand, if you change the include statements to `include_once\
    \ 'heading.html'; include_once 'heading.html';` you’ll only get the `<h1>` heading\
    \ displayed once.\n\n## 3.3 Redirecting Users\n\nGreat! We’ve come to the last\
    \ section of this chapter. In this section, well learn to redirect users using\
    \ PHP. In HTML, we know that we can use a `<meta>` tag to redirect users to another\
    \ page. In PHP, we use a built-in function called `header()`.\n\nFirst off, what\
    \ is a function? A function is a block of code that performs a certain task. For\
    \ an analogy, think of the functions in MS Excel. If we want to add the values\
    \ of some cells in a spreadsheet, we can use a built-in function called `sum()`.\
    \ This function is pre-written by other programmers and comes included with Excel.\
    \ Similar to the pre-written functions in Excel, PHP comes with many built-in\
    \ functions. Most functions require us to provide certain information for them\
    \ to perform their tasks. In PHP, we provide this information by enclosing them\
    \ inside a pair of parentheses (in a pre-defined order) after the function name.\
    \ The information that we pass to the function is known as arguments.\n\nTo use\
    \ the `header()` function, we need to pass the word “Location”, followed by a\
    \ colon and the redirect URL to the function. Using a function is also known as\
    \ calling the function. To call the `header()` function, add the following code\
    \ to the start of `includedemo.php` (before the `<!DOCTYPE html>` tag):\n\n```php\n\
    <?php header('Location: http://example.com'); ?>\n```\n\nIf you load `includedemo.php`\
    \ now, you’ll be redirected to http://example.com. Got it?\n\nWhen you use the\
    \ `header()` function, note that it must be called before your script generates\
    \ any output to the browser, either by normal HTML tags, blank lines, or from\
    \ PHP. If there’s any output before the function is called, the function will\
    \ not work. For instance, it will not work in the following two examples:\n\n\
    Example 1:\n```php\n<?php echo 'Hello'; header('Location: http://example.com');\
    \ ?>\n```\n\nExample 2:\n```html\n<p>This is some text.</p>\n<?php header('Location:\
    \ http://example.com'); ?>\n```\n\nIn the first example, output is generated by\
    \ the `echo` statement (`echo 'Hello';`) before the `header()` function is called.\
    \ In the second example, output is generated by the two lines of code before the\
    \ `<?php` tag. These two lines generate an HTML paragraph and an empty line before\
    \ the `header()` function is called. If your script generates any output before\
    \ the `header()` function is called, you’ll get the “Headers already sent” warning\
    \ mentioned previously in Chapter 3.1 and users will not be redirected. The code\
    \ may work when you are working on your local computer. However, when you upload\
    \ it to your hosting company’s server, it will fail to work. Got it?\n"
