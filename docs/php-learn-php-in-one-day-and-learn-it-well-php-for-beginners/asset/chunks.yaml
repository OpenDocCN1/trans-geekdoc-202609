  trans: "\n\n| 值 (Value) | 说明 (Description) |\n| --- | --- |\n| 表示零的数字（例如 0 和 0.0）\
    \ |\n| 空字符串（例如 `''`，由两个单引号组成且没有包含文本） |\n| 字符串 `\"0\"` |\n| 元素个数为数组 |\n| 一个名为 `NULL`\
    \ 的特殊值 |\n\n另一方面，大多数其他值（如 1、3.4 和 `\"Hello\"`）都会转换为 `true`。我们已经见过控制结构如何根据条件的求值是\
    \ `true` 还是 `false` 来决定是否执行某段代码块。假设我们有以下 `if` 语句：\n\n`if (\"hello\") echo 'if\
    \ block'; else echo 'else block';`\n\n如果运行运行上述语句，我们将得到 `if block` 作为输出。这是因为字符串\
    \ `\"hello\"` 被转换为了 `true`。对于任何控制结构，只要条件的求值为 `true`，无论它是比较的结果（例如 `$a < 5`）还是转换为\
    \ `true` 的值，对应的代码块都将被执行。在上面的 `if` 语句中，由于 `if` 条件 `(\"hello\")` 求值为 `true`，因此 `if`\
    \ 块被执行了。明白了吗？很好！\n\n## 6.4.2 Break, Continue\n\n接下来，让我们讨论 `break` 和 `continue`\
    \ 语句。这些语句可以用于修改控制结构的行为。我们在之前讨论 `switch` 语句时已经遇到过 `break` 语句。当满足某个特定的 `switch`\
    \ case 时，`switch` 语句会执行后续的所有内容，直到遇到 `break` 语句为止。除了在 `switch` 语句中使用它外，我们可以在循环中使用\
    \ `break` 语句。`break` 语句会结束其所在循环的执行。\n\n让我们来看一个例子：\n\n```\nfor ($i = 0; $i < 50;\
    \ ++$i) {\n    echo \"$i<BR>\";\n    if ($i == 4) break;\n}\n```\n\n在这里，我们在 `for`\
    \ 循环内部有一个 `if` 语句。在编程中，将一个控制结构嵌套在另一个内部是非常常见的。在 `for` 循环中，我们首先输出 `$i` 的值。接下来，我们检查\
    \ `$i` 是否等于 `4`。如果相等，我们希望程序跳出 `for` 循环。如果你运行上面的代码，将得到以下输出：`0 1 2 3 4`。\n\n如果没有\
    \ `break` 语句，`for` 循环应该运行 50 次，从 `$i = 0` 到 `$i = 49`。然而，由于有了 `break` 语句，这个循环只从\
    \ `$i = 0` 运行到 `$i = 4`。这是因为当 `$i` 等于 `4` 时，`if` 条件 `($i == 4)` 求值为 `true`。随后的\
    \ `break` 语句导致程序跳出 `for` 循环，跳过剩余的迭代（从 `$i = 5` 到 `$i = 49`）。明白了吗？\n\n接下来我们是 `continue`\
    \ 语句。这个语句不会导致循环提前结束。相反，它会导致跳过特定迭代的循环剩余部分。让我们来看一个例子：\n\n```\nfor ($i = 0; $i <\
    \ 6; ++$i) {\n    echo '$i = '.$i.', ';\n    if ($i == 4) continue;\n    echo\
    \ 'First.';\n    echo 'Second.<BR>';\n}\n```\n\n如果你运行上面的代码，将得到以下输出：\n`$i = 0,\
    \ First.Second.`\n`$i = 1, First.Second.`\n`$i = 2, First.Second.`\n`$i = 3, First.Second.`\n\
    `$i = 4, $i = 5, First.Second.`\n\n注意当 `$i` 等于 `4` 时，“First.Second.” 没有出现？这是因为当\
    \ `$i` 等于 `4` 时，`continue` 语句导致程序跳过了该迭代的 `echo 'First.'; echo 'Second.<BR>';`\
    \ 语句。除此之外，代码正常运行。清楚了吗？\n\n## 6.4.3 替代语法\n\n接下来，让我们谈谈 PHP 中控制结构的替代语法。PHP 为其某些控制结构提供了替代语法，特别是\
    \ `if`、`while`、`for`、`foreach` 和 `switch` 结构。这种语法涉及将大括号替换为冒号（`:`），并将最后一个大括号分别替换为\
    \ `endif;`、`endwhile;`、`endfor;`、`endforeach;` 或 `endswitch;`。\n\n让我们用一个 `if`\
    \ 语句来说说明：\n\n```php\nif ($condition) {\n    echo \"true block\";\n} else {\n \
    \   echo \"false block\";\n}\n```\n\n使用替代语法：\n\n```php\nif ($condition):\n   \
    \ echo \"true block\";\nelse:\n    echo \"false block\";\nendif;\n```\n\n注意在替代语法中，左大括号被冒号替换，右大括号被\
    \ `endif;` 替换。这种语法在与 HTML 混合 时特别有用。\n\n"
- fmt: "\n# Chapter 7: Functions\n\nIn this chapter, let’s move on to talk about functions.\
    \ We have already encountered functions in previous chapters. For instance, in\
    \ Chapter 5, we learned to use various `PHP` functions to work with strings and\
    \ arrays. In this chapter, we’ll learn to define our own functions.\n\n## 7.1\
    \ Defining our own Functions\n\nTo define our own functions, we use the syntax\
    \ below:\n\n```php\nfunction functionName(list of parameters) { \n    //code to\
    \ be executed; \n    //return statements, if any \n}\n```\n\nAll function declarations\
    \ must start with the `function` keyword. Next, we have the `function name`. Function\
    \ names in `PHP` are not case-sensitive and can contain letters, numbers, or underscores.\
    \ However, they must start with a letter or an underscore. Similar to variable\
    \ names, we commonly use `camelCase` or underscores when naming functions. In\
    \ this book, we’ll use `camelCase`.\n\nAfter the function name, we enclose the\
    \ list of parameters (if any) that the function needs in a pair of parentheses.\
    \ Parameters are variables used for storing values that we pass to the function;\
    \ the values that we pass are known as `arguments`. After declaring the function,\
    \ we use curly braces to enclose the code that we want the function to perform.\
    \ If the function returns a result, we use the `return` keyword. Got it? Let’s\
    \ look at some examples.\n\n### Example 1\n\n```php\nfunction displayGreetings(){\
    \ \n    echo 'Hello'; \n}\n```\n\nHere, we declare a function called `displayGreetings()`\
    \ that has no parameters (as indicated by the pair of empty parentheses after\
    \ the function name). This function simply echoes the word “Hello”. To call the\
    \ function, we use its name followed by a pair of parentheses: `displayGreetings();`.\
    \ This gives us `Hello` as the output.\n\n### Example 2\n\n```php\nfunction displayGreetings2($name,\
    \ $message){ \n    echo \"Hello $name, $message\"; \n}\n```\n\nHere, we declare\
    \ a function called `displayGreetings2()` that has two parameters - `$name` and\
    \ `$message`. If we call the function using the following statement `displayGreetings2('Jamie',\
    \ 'good morning');`, the arguments `'Jamie'` and `'good morning'` will be assigned\
    \ to the parameters `$name` and `$message` respectively. When we run the code\
    \ above, we’ll get `Hello Jamie, good morning` as the output.\n\n### Example 3\n\
    \nWe can provide default values for parameter(s) when we declare our functions.\n\
    \n```php\nfunction displayGreetings3($name, $message = 'have a good day' ){ \n\
    \    echo \"Hello $name, $message\"; \n}\n```\n\nIn the example above, we declare\
    \ `'have a good day'` as the default value for the parameter `$message` (refer\
    \ to the underlined code). To call the function, we can use the statements below:\n\
    \n```php\ndisplayGreetings3('Jamie');\necho '<BR>';\ndisplayGreetings3('Jamie',\
    \ 'how are you?');\n```\n\nIn the first function call, we omitted the second argument.\
    \ When we do that, the function uses the default value `'have a good day'` as\
    \ the value for `$message`. If we run the code above, we’ll get `Hello Jamie,\
    \ have a good day` and `Hello Jamie, how are you?` as the output.\n\nWhen we declare\
    \ functions with default values for parameters, note that parameters with default\
    \ values must come after parameters without default values. If we declare a function\
    \ as `function redundantDefault($a = 1, $b){ //some code }`, the default value\
    \ for `$a` will not work as it comes before `$b` (which does not have a default\
    \ value); we’ll still need to provide two arguments when calling the function.\n\
    \n### Example 4\n\nLast but not least, functions can return a result after they\
    \ complete their tasks.\n\n```php\nfunction addNumbers($num1, $num2, $num3){ \n\
    \    return $num1 + $num2 + $num3; \n}\n```\n\nThe function above returns the\
    \ sum of `$num1`, `$num2` and `$num3`. To use it, we add `echo` to the statement:\
    \ `echo addNumbers(9, 6, 1);`. This gives us `16` as the output.\n\n## 7.2 Type\
    \ Declaration\n\nBefore we move on to the next chapter I would like to discuss\
    \ `type declaration`. Type declaration (also known as `type hinting`) is available\
    \ from `PHP` 7 onwards. Scalar types refer to data types that store a single value,\
    \ such as `int`, `float`, `bool` and `string`. Type declaration is optional but\
    \ good to implement if you are certain about your code.\n\nTo use type declaration,\
    \ we need to add `strict_types` to our script. Create a new file in Brackets and\
    \ name it `typedec.php`. Add the following code to it:\n\n```php\n<?php\ndeclare(strict_types=1);\n\
    function addNumbers(int $num1, int $num2, int $num3){ \n    return $num1 + $num2\
    \ + $num3; \n}\necho addNumbers('9', '6', '1');\n```\n\nHere, we set `strict_types`\
    \ to 1 using a built-in function `declare()`. This statement must be the first\
    \ statement in our script. Next, we declare a function `addNumbers()` with three\
    \ parameters `$num1`, `$num2` and `$num3`. We indicate that these parameters must\
    \ be of `int` type by adding `int` in front of their names. Finally, we call the\
    \ function by passing `'9'`, `'6'` and `'1'` to it. If you run the code above,\
    \ you’ll get an output similar to what is shown below:\n\n`Fatal error : Uncaught\
    \ TypeError: Argument 1 passed to addNumbers() must be of the type int, string\
    \ given`\n\nNext, change the echo statement to `echo addNumbers(9, 6, 1);` and\
    \ rerun the code. As `9`, `6` and `1` are of `int` type, we won’t get any errors\
    \ now. Instead, we’ll get `16` as the output. Got it? Besides doing type declaration\
    \ for parameters, we can do it for the return type if we are using `PHP 7 and\
    \ above. To do that, we indicate the return type using a colon after the parentheses\
    \ in the function declaration. Add the following code to `typedec.php`:\n\n```php\n\
    function addTwoNums($a, $b): int { \n    return $a + $b; \n}\necho '<BR>'.addTwoNums(3,\
    \ 1);\n```\n\nHere, we indicate that the return value of `addTwoNums()` should\
    \ be of `int` type. Next, we call the function using `3` and `1` as the arguments.\
    \ If you run the code above, you’ll get `4` as the output. Next, change the last\
    \ line to `echo '<BR>'.addTwoNums(3.9, 1);` and run the page again. You’ll get\
    \ the following output:\n\n`Fatal error : Uncaught TypeError: Return value of\
    \ addTwoNums() must be of the type int, float returned`\n\nThis is because `3.9\
    \ + 1` gives us `4.9`, which is not of `int` type.\n"
  raw: 'Chapter 7: Functions In this chapter, let’s move on to talk about functions.
    We have already encountered functions in previous chapters. For instance, in Chapter
    5, we learned to use various PHP functions to work with strings and arrays. In
    this chapter, we’ll learn to define our own functions. 7.1 Defining our own Functions
    To define our own functions, we use the syntax below: function functionName(list
    of parameters) { //code to be executed; //return statements, if any } All function
    declarations must start with the function keyword. Next, we have the function
    name. Function names in PHP are not case-sensitive and can contain letters, numbers,
    or underscores. However, they must start with a letter or an underscore. Similar
    to variable names, we commonly use camelCase or underscores when naming functions.
    In this book, we’ll use camelCase. After the function name, we enclose the list
    of parameters (if any) that the function needs in a pair of parentheses. Parameters
    are variables used for storing values that we pass to the function; the values
    that we pass are known as arguments. After declaring the function, we use curly
    braces to enclose the code that we want the function to perform. If the function
    returns a result, we use the return keyword. Got it? Let’s look at some examples.
    Example 1 function displayGreetings(){ echo ''Hello''; } Here, we declare a function
    called displayGreetings() that has no parameters (as indicated by the pair of
    empty parentheses after the function name). This function simply echoes the word
    “Hello”. To call the function, we use its name followed by a pair of parentheses:
    displayGreetings(); This gives us Hello as the output. Example 2 function displayGreetings2($name,
    $message){ echo "Hello $name, $message"; } Here, we declare a function called
    displayGreetings2() that has two parameters - $name and $message . If we call
    the function using the following statement displayGreetings2(''Jamie'', ''good
    morning''); the arguments ''Jamie'' and ''good morning'' will be assigned to the
    parameters $name and $message respectively. When we run the code above, we’ll
    get Hello Jamie, good morning as the output. Example 3 We can provide default
    values for parameter(s) when we declare our functions. function displayGreetings3($name,
    $message = ''have a good day'' ){ echo "Hello $name, $message"; } In the example
    above, we declare ''have a good day'' as the default value for the parameter $message
    (refer to the underlined code). To call the function, we can use the statements
    below: displayGreetings3(''Jamie''); echo ''<BR>''; displayGreetings3(''Jamie'',
    ''how are you?''); In the first function call, we omitted the second argument.
    When we do that, the function uses the default value ''have a good day'' as the
    value for $message . If we run the code above, we’ll get Hello Jamie, have a good
    day Hello Jamie, how are you? as the output. When we declare functions with default
    values for parameters, note that parameters with default values must come after
    parameters without default values. If we declare a function as function redundantDefault($a
    = 1, $b){ //some code } the default value for $a will not work as it comes before
    $b (which does not have a default value); we’ll still need to provide two arguments
    when calling the function. Example 4 Last but not least, functions can return
    a result after they complete their tasks. function addNumbers($num1, $num2, $num3){
    return $num1 + $num2 + $num3; echo ''Hello''; } The function above returns the
    sum of $num1 , $num2 and $num3 using a return statement. Once a return statement
    is executed, the function exits, and any statement after the return statement
    is not executed. We can assign the result returned by the function to a variable
    or use the echo statement to display the result directly. If we call the function
    above using the following statement: echo addNumbers(9, 6, 1); we’ll get 16 as
    the output. The statement echo ''Hello''; is not executed as it comes after the
    return statement. 7.2 Type Declaration The examples in the previous section illustrate
    the main points we need to know when defining our own functions. Before we move
    on to the next chapter, I would like to discuss type declaration (also known as
    type hinting) in this section. Type declaration is a feature added to newer versions
    of PHP. This feature is optional but good to implement if you are certain your
    code will only run on PHP 5 (preferably PHP 7) and above. First, what is type
    declaration? As mentioned previously, PHP is a loosely typed language. In the
    examples above, when we declared the parameters of our functions, we did not indicate
    their data types. If the arguments that we pass to the function are of invalid
    data types, PHP will try its best to execute the function. For instance, with
    reference to Example 4 in the previous section, if we try to run the following
    statement echo addNumbers(''9'', ''6'', ''1''); we won’t get any errors. Although
    we pass three strings to the addNumbers() function, PHP converts them to integers
    for us automatically and executes the function. Hence, we’ll get 16 as the output.
    Such flexibility makes PHP a very easy language to program in. However, depending
    on the requirements of the site you are building, you may not want the function
    to run when the data type is incorrect. In cases like that, you can use type declaration.
    Type declaration allows us to state the data types of a function’s parameters
    when we declare it. This feature is available from PHP 5 onwards. However, in
    PHP 5, type declaration does not work for scalar data types. Scalar data types
    refer to data types that store a single value, such as int , float , bool and
    string . Type declaration only works for data types like arrays. To use type declaration
    with scalar data types, we need PHP 7 and above. In addition, we need to add a
    strict\_types declaration to our script and set strict\_types to 1 . To illustrate
    how this works, let’s look at an example. This example works in PHP 7. Create
    a new file in Brackets and name it typedec.php . Add the following code to it.
    <?php declare(strict\_types=1); function addNumbersStrict(int $num1, int $num2,
    int $num3){ return $num1 + $num2 + $num3; } echo addNumbersStrict(''9'', ''6'',
    ''1''); Here, we set strict\_types to 1 using a built-in function called declare()
    . This statement must be the first statement in our script. Next, we declare a
    function called addNumbersStrict() with three parameters $num1 , $num2 and $num3
    . We indicate that these parameters must be of int type by adding int in front
    of their names. Finally, we call the function by passing ''9'' , ''6'' and ''1''
    to it. If you run the code above, you’ll get an output similar to what is shown
    below: Fatal error : Uncaught TypeError: Argument 1 passed to addNumbersStrict()
    must be of the type int, string given... Next, change the echo statement to echo
    addNumbersStrict(9 , 6 , 1); and rerun the code. As 9 , 6 and 1 are of int type,
    we won’t get any errors now. Instead, we’ll get 16 as the output. Got it? Besides
    doing type declaration for parameters, we can do it for the return type if we
    are using PHP 7 and above. To do that, we indicate the return type using a colon
    after the parentheses in the function declaration. Add the following code to typedec.php
    : function addTwoNums($a, $b): int { return $a + $b; } echo ''<BR>''.addTwoNums(3,
    1); Here, we indicate that the return value of addTwoNums() should be of int type.
    Next, we call the function using 3 and 1 as the arguments. If you run the code
    above, you’ll get 4 as the output. Next, change the last line to echo ''<BR>''.addTwoNums(3.9,
    1); and run the page again. You’ll get the following output: Fatal error : Uncaught
    TypeError: Return value of addTwoNums() must be of the type int, float returned...
    This is because 3.9 + 1 gives us 4.9, which is not of int type. '
