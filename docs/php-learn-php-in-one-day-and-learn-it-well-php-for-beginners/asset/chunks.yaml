    # Learn PHP in One Day and Learn It Well


    ## PHP for Beginners with Hands-on Project

    The only book you need to start coding in PHP immediately By Jamie Chan [https://www.learncodingfast.com/php](https://www.learncodingfast.com/php)


    Copyright © 2020 All rights reserved. No part of this publication may be reproduced,
    distributed, or transmitted in any form or by any means, including photocopying,
    recording, or other electronic or mechanical methods, without the prior written
    permission of the publisher, except in the case of brief quotations embodied in
    critical reviews and certain other noncommercial uses permitted by copyright law.


    ## Preface

    This book is designed to help you learn `PHP` fast and learn it well. While the
    book is suitable for absolute beginners in `PHP`, you do need to be familiar with
    `HTML` and `SQL` (for Chapter 11). The book covers a wide range of topics in `PHP`,
    carefully selected to give you broad exposure to the language. If you are an absolute
    beginner in `PHP`, you''ll find that this book explains complex concepts in an
    easy to understand and concise manner. At the end of the book, you''ll be guided
    through a project that gives you a chance to put everything you''ve learned to
    use and see how it all ties together. You can download the source code for the
    examples and project at [https://www.learncodingfast.com/php](https://www.learncodingfast.com/php)
    Any errata can be found at [https://www.learncodingfast.com/errata](https://www.learncodingfast.com/errata)


    ## Contact Information

    I would love to hear from you. For feedback or queries, you can contact me at
    [jamie@learncodingfast.com](mailto:jamie@learncodingfast.com).


