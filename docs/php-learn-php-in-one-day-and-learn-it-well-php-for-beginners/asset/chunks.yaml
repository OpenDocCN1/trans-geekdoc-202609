    ''Helper'' , the concatenation gives us the string INC\_DIR.''classes/Helper.php'';
    which is a direct path to the Helper.php file. We then use the include\_once statement
    to help us include this file. Got it? After we code myAutoloader() , we need to
    use a built-in function called   spl\_autoload\_register() to register it as the
    autoloader. Once this is done, we simply need to include loadclasses.php in all
    our PHP scripts and PHP will autoload classes for us whenever we create an object.
    That’s it! We are now ready to go back to the main phpproject folder. 13.8 Editing
    The phpproject Folder Inside this folder, we have eight files, seven of which
    are user interface files. The seven files are signup.php , admin.php , write.php
    , index.php , read.php , logout.php and error.html . Besides these user interface
    files, we have a file called UI\_include.php . 13.8.1 UI\_include.php We’ll start
    with the UI\_include.php file. If you open this file, you’ll see that it has already
    been completed for you. Let’s go through the code. Inside the file, we first define
    a constant called INC\_DIR and assign the string $\_SERVER\["DOCUMENT\_ROOT"\].
    "/phpproject/includes/" to it. $\_SERVER\[''DOCUMENT\_ROOT''\] is a predefined
    variable that stores the document root directory under which the current script
    is executing. If you are using XAMPP, this root directory refers to the htdocs
    folder. When we concatenate $\_SERVER\[''DOCUMENT\_ROOT''\] and "/phpproject/includes/"
    , we get a direct path to the includes folder. If you rename the phpproject folder,
    you have to edit the path assigned to INC\_DIR accordingly. For instance, if you
    rename the folder to myproject , you have to assign $\_SERVER\["DOCUMENT\_ROOT"\].
    "/myproject /includes/" to INC\_DIR instead. Next, we have two include statements
    for including loadclasses.php and debugging.php . As mentioned previously, we
    use loadclasses.php to autoload our classes and debugging.php to handle all errors
    and exceptions. These two files have to be included in most of our user interface
    files later. With that, the UI\_include.php file is complete and we are ready
    to move on to the user interface files. 13.8.2 User Interface Files The first
    is the error.html file. This file contains HTML code for displaying a custom message
    to users when an error or exception occurs on our site. It has already been completed
    for you. Next, we have five very similar files - admin.php , write.php , index.php
    , signup.php and read.php . Inside each file, we need to add PHP code to do the
    following: start a new session and include the UI\_include.php and header.html
    files. In addition, each of the files contains a HTML form that is processed by
    the file itself. To process the form, we need to use an include statement to add
    the relevant processing file to the user interface file. For instance, to process
    the form in admin.php , we need to include the p-admin.php file. The above has
    already been done for you in admin.php . With reference to the code in admin.php
    , try doing the same for write.php , index.php , signup.php and read.php . In
    each case, note that the UI\_include.php file must be included before the other
    two files (as we need INC\_DIR to be defined before using it). In addition, you
    need to change the processing file accordingly. Got it? Great! Once you are done
    with the above, we need to make some modifications. For signup.php , there is
    no need to start a new session as p-signup.php does not use any session variable.
    Hence, we should remove the session\_start(); statement from signup.php . Next,
    for read.php , as p-read.php includes code for displaying output, we should not
    include it at the start of the file. Instead, we should include it between the
    <body>...</body> tags. Last but not least, for signup.php , admin.php , index.php
    and write.php , we need to replace the text “Error Message Here” (without quotes)
    in the HTML code with the actual error message stored in a variable called $msg
    . To do that, we use the PHP code below: <?php echo $msg; ?> Try doing all the
    modifications above yourself. Now, we need to make one more modification to index.php
    . If you refer to p-signup.php , you’ll notice that we added the query string
    new=1 when directing users to index.php after a successful sign-up, we want to
    make use of this query string inside index.php . To do that, add the following
    code to index.php after the line <div class="form"> : <div class = "new"> <?php
    if (isset($\_GET\[''new''\])) echo ''ACCOUNT CREATED SUCCESSFULLY''; ?> </div>
    Here, we use the query string to check if users are directed to index.php after
    a successful sign-up. If yes, we echo the string ''ACCOUNT CREATED SUCCESSFULLY''
    . Got it? Great. Let’s move on to the last user interface file - logout.php .
    As the code for logging out is very straightforward, we did not create a separate
    file for processing logout.php . Instead, we’ll add the processing code to logout.php
    directly. To do that, we need to do a few things in logout.php . First, we need
    to resume the existing session (using session\_start() ) and destroy all variables
    in that session (using session\_destroy() ). Next, we need to include the UI\_include.php
    and header.html files. Try doing the above yourself. Once that is done, load the
    page [http://localhost/phpproject/logout.php](http://localhost/phpproject/logout.php)
    in your browser; you’ll notice two identical links that say, “Click here to log
    in again”. This is not a mistake. The first link points to admin.php while the
    second points to index.php . If you refer back to write.php and study the code
    carefully, you’ll notice that we added a query string ( admin=1 ) to the logout
    URL near the end of the page. This query string tells us that the person logging
    out is an admin user. When that happens, we want to display the first logout link
    in logout.php . On the other hand, if the person is not an admin user (i.e., there
    is no query string), we want to display the second logout link. Try using an if-else
    statement in logout.php to achieve the above. You can refer to index.php for help
    on using query strings. Once that is done, the logout.php file is complete. The
    project is almost complete at this point. In fact, if you have done everything
    correctly, you can load [http://localhost/phpproject/signup.php](http://localhost/phpproject/signup.php)
    and everything will work. Try entering your desired username into the first input
    box and click “Submit”. What do you notice? You should get an error message that
    says “All fields are required”. Notice that the username you entered into the
    first input box is gone? The last part of our project involves adding PHP code
    to your user interface files to ensure that values entered into forms are maintained
    if there’s an error processing the form. Recall that we wrote a method called
    keepValues() inside the Helper class for this purpose? Suppose we have a Helper
    object called $h , here’s how we use the method: If we have a form with a textbox
    named “tb” and we store the value submitted for “tb” as $tb , we write <input
    type="text" name="tb" <?php $h->keepValues($tb, ''textbox'');?> \> If we have
    a textarea named “ta” and we store the value submitted for “ta” as $ta , we write
    <textarea name = "ta"> <?php $h->keepValues($ta, ''textarea''); ?> </textarea>
    Finally, if we have a dropdrop list named “sl” with two value attributes “1” and
    “2”, and we store the value submitted for “sl” as $sl , we write <select name
    = "sl"> <option value = ''1'' <?php $h->keepValues($sl, ''select'', ''1''); ?>
    >1</option> <option value = ''2'' <?php $h->keepValues($sl, ''select'', ''2'');
    ?> >2</option> </select> In our project, the names of the variables used to store
    each input correspond to the names of the input fields. For instance, $username
    stores the input for the textbox named “username”. Based on the description above,
    modify index.php , signup.php , admin.php and write.php so that all values entered,
    except passwords , are maintained if there’s an error processing the form. Got
    it? Once the above is done, we need to make some additional changes to write.php
    . For most pages, if there’s no error processing the form, the website automatically
    loads another page based on the URL we passed to the header() function. However,
    this does not happen for write.php . For this page, after the admin clicks on
    the “submit” button, he/she will stay on the same page regardless of whether data
    is submitted to the database successfully or not. We want to modify write.php
    so that if data is inserted into the database successfully, we’ll clear the form
    so that the admin can write a new post. In other words, if data is inserted successfully,
    we do not want to call the keepValues() method. To do that, we need to use the
    variable $msg declared in p-write.php . Recall that after data is inserted into
    the database, we assign the string ''Message saved successfully'' to $msg ? We
    can use this string to decide whether we need to call the keepValues() method.
    The example below shows how it can be done for the first input field (“title”).
    The underlined code shows the if condition to use. <input id = "txttitle" type="text"
    name="title" placeholder="Enter Title" autofocus <?php if ($msg != ''Message saved
    successfully'') $h->keepValues($title, ''textbox''); ?>> Try doing this for the
    other input fields. Once that is done, we’ve completed the project. Congratulations!
    You are now ready to test your code to see if everything works as expected. 13.9
    Running the Code Before running the code, we need to make some changes to php.ini
    . Follow the instructions in Chapter 2.1 to locate php.ini and open it in Brackets.
    Scroll to the bottom of the page and add the following lines to it (if you have
    yet to do so in previous chapters): error\_reporting=E\_ALL display\_errors=On
    date.timezone=America/New\_York Next, we want to add one more line to php.ini
    . Specifically, we want to add a line to prepend debugging.php . Prepending a
    file means specifying that we want PHP to process this file before it processes
    any other PHP script. Previously, we used the include statement in UI\_include.php
    to add debugging.php to our PHP scripts. This works for most errors. However,
    it will not work if the file that debugging.php is included in has syntax errors.
    If you want debugging.php to work even when there are syntax errors, you need
    to prepend the file. To do that, add the line auto\_prepend\_file="<DOCUMENT\_ROOT>/phpproject/includes/debugging.php"
    to php.ini , where <DOCUMENT\_ROOT> refers to the actual path of your htdocs folder.
    To find this path, load [http://localhost/dashboard/phpinfo.php](http://localhost/dashboard/phpinfo.php)
    in your browser and search for “DOCUMENT\_ROOT” (without quotes). You’ll see the
    path listed beside. You need to replace <DOCUMENT\_ROOT> with the path listed.
    For instance, if the path is /opt/lampp/htdocs , the line should be auto\_prepend\_file="/opt/lampp/htdocs/phpproject/includes/debugging.php"
    The code above may appear as two lines in this book due to the limited width of
    the book. Do not break it into two lines, it should be written as a single line
    in php.ini . After prepending debugging.php , if you are using PHP 7.2 and above,
    you should also turn track\_errors off. track\_errors is a built-in feature in
    PHP that has been deprecated since PHP 7.2. However, this feature is set to “On”
    by default. Leaving it on may lead to a warning that says “Directive ‘track\_errors’
    is deprecated found on line 0 in file Unknown” on some servers. To turn it off,
    simply add track\_errors=Off to the bottom of php.ini . That’s it. You can now
    save the file and restart Apache. Next, go to UI\_include.php and comment out
    the include statement for debugging.php . As we have already prepended the file,
    we should not include it again. Next, launch [http://localhost/phpproject/signup.php](http://localhost/phpproject/signup.php)
    in your browser and sign up for two new accounts. Everything works? If yes, congratulations!
    Give yourself a pat on the back. If no, it’s all right. Figuring out what went
    wrong is a large part of programming. This, to me, is where the most learning
    takes place. If something fails to work, you will likely get an error message.
    Try to use the line number and file name given in the error message to figure
    out what is wrong. Alternatively, you can use echo statements to determine which
    part of your code works. For instance, if you add an echo statement to line 10
    of your code and you don’t see the output, you know that something has likely
    gone wrong before line 10. Similarly, if you add an echo statement to an if block
    and don’t see the output, you know that the if block is not executed. Try finding
    the error yourself. If you really can’t figure out the issue, you can check the
    suggested solution in the phpproject-complete folder and compare the code with
    your code. Copy and paste the functions that you suspect may be causing the error
    from the suggested solution to your solution and rerun your code to see if it
    works. Study the suggested solution carefully to really understand how it works.
    Got it? Once you manage to find the bug and are able to sign up for two accounts
    successfully, you can proceed to convert one of them to an admin account. To do
    that, go to [http://localhost/phpmyadmin/](http://localhost/phpmyadmin/) and click
    on the “project” database. Click on the SQL tab and run the following SQL statement,
    replacing YOUR\_ADMIN\_USERNAME with the username you want to convert to an admin
    user: UPDATE members SET is\_admin = 1 WHERE username = ''YOUR\_ADMIN\_USERNAME'';
    Once that is done, you can use the admin account to post to the blog. To do that,
    go to [http://localhost/phpproject/admin.php](http://localhost/phpproject/admin.php)
    to log in as an admin. Try adding some posts to the blog. Does everything work?
    After posting, you can go to [http://localhost/phpproject/index.php](http://localhost/phpproject/index.php)
    to log in as a member (using either account) to read the posts. Alternatively,
    you can go to [http://localhost/phpproject/read.php](http://localhost/phpproject/read.php)
    directly to read “Public” posts without logging in. Play around with the site
    to see if everything works as expected. If something does not work, try debugging
    it. With perseverance, you can definitely find the error and learn a lot in the
    process. Have fun!'
  toc: []
  trans: "\n\n如果不符合上述任一情况，我们将为 `$msg` 赋值适当的错误消息。否则，我们将执行以下操作：创建一个 `BlogMember` 对象并使用它调用\
    \ `isDuplicateID()` 方法。如果该方法返回 `true`，则为 `$msg` 赋值适当的错误消息，通知用户用户名已被占用。否则，使用 `BlogMember`\
    \ 对象调用 `insertIntoMemberDB()` 方法，并使用 `header()` 函数将用户重定向到 `index.php`。在 `index.php`\
    \ 后附加查询字符串 `new=1`。明白了吗？尝试自己编写 `p-signup.php`。提示：参考 `p-index.php` 获取处理表单的帮助。如果不熟悉查询字符串，可以参考第\
    \ 8.1.2 章。要检查上述列出的五种情况，你可以使用 `Helper` 类中的 `isEmpty()`、`isValidLength()`、`isSecure()`\
    \ 和 `passwordsMatch()` 方法。参考 `Helper.php` 和 `BlogMember.php` 以确定在调用 `Helper` 和\
    \ `BlogMember` 类中的各种方法需要传递哪些参数。一旦你完成了 `p-signup.php`，我们就可以继续处理 `p-write.php`。\n\
    \n### 13.6.4 p-write.php\n\n`write.php` 有一个名为“title”的输入框、一个名为“post”的文本区域、一个名为“audience”的下拉列表和一个名为“submit”的按钮。如果在处理\
    \ `write.php` 时发生错误，页面将输出存储在变量 `$msg` 中的错误消息。如果你分析 `write.php` 中的代码，你会发现我们在文本区域之后添加了一个\
    \ `<script>` 元素。这是为了用更高级的文本编辑器 CKEDITOR 替换文本区域（可以在 [https://ckeditor.com/ckeditor-4/]\
    \ 免费获取）。我们不会详细介绍如何使用 `CKEDITOR`，因为它只影响用户界面。使用 `CKEDITOR` 不会任何方式影响我们的 PHP 代码。\n\
    \n以下是 `p-write.php` 中需要做的工作：\n\n1.  首先，我们需要获取两个会话变量——`$_SESSION['username']` 和\
    \ `$_SESSION['is_admin']` 并检查它们是否设置。如果任一会话变量未设置，我们就知道用户正尝试在未登录管理员账户的情况下访问 `write.php`。如果是这样，我们使用\
    \ `header()` 函数将他们重定向到 `admin.php`。\n2.  否则，我们执行以下操作：首先，声明并初始化名为 `$h` 的 `Helper`\
    \ 对象。接下来，声明四个变量 `$title`、 `$post`、 `$audience` 和 `$msg` 并为它们各赋值空字符串。之后，检查是否点击了“submit”按钮。如果是，则将\
    \ `$_POST['title']`、`$_POST['post']` 和 `$_POST['audience']` 分别赋值给 `$title`、 `$post`\
    \ 和 `$audience`。\n3.  接下来，检查 `write.php` 中的所有字段是否已填写。如果有为空，则为 `$msg` 赋值适当的错误消息。否则，使用\
    \ `$_SESSION['username']` 作为参数创建一个 `Admin` 对象。使用该对象调用 `insertIntoPostDB()` 方法。（参考\
    \ `Admin` 类来决定传递给方法的参数。）\n4.  一旦完成，将字符串 `'Message saved successfully'` 赋值给 `$msg`。\n\
    \n明白了吗？尝试自己编写 `p-write.php`。一旦完成，我们就可以准备好处理最复杂的文件——`p-read.php`。\n\n### 13.6.5\
    \ p-read.php\n\n`p-read.php` 用于处理 `read.php`，后者用于向读者显示帖子。我们需要在 `p-read.php` 中实现两个核心功能：\n\
    \n首先，根据用户是否登录，我们需要显示不同的帖子。如果用户已登录，显示所有帖子；否则只显示“公共”（Public）帖子。\n\n接下来，如果用户已登录，我们需要为登录后发布的帖子显示“新”图标。为了实现这一点，打开\
    \ `p-read.php` 并执行以下操作：\n\n-   首先，声明变量 `$h` 并赋值一个 `Helper` 对象。\n-   接下来，声明变量 `$update`\
    \ 并赋值为 `false`。\n-   最后，声明变量 `$is_member` 并赋值 `isset($_SESSION['username'])`。在这里，我们使用\
    \ `isset()` 函数检查会话变量 `$_SESSION['username']` 是否设置。如果是，说明访问 `read.php` 的用户已登录。\n\
    \n接下来，我们需要在 `p-read.php` 中使用几个 `if-else` 语句，结构如下：\n\n```php\nif ($is_member){\n\
    \    // 创建 BlogMember 对象并使用它调用 getLastPost() 方法\n}else{\n    // 创建 Reader 对象\n\
    }\n// 调用 getPosts() 方法\nif ($posts == false){\n    // 包含 card.html 文件\n}else{\n\
    \    // 使用 foreach 循环处理 $posts 中的元素\n    // 包含 card.php 文件\n}\nif ($is_member)\
    \ {\n    // 包含.html 文件\n}\nif ($update) {\n    // 使用 BlogMember 对象调用 getLastPost()\
    \ 方法```\n\n在第一个 `if-else` 语句中，我们检查用户是否登录。如果用户已登录（即 `$is_member` 为 `true`），我们初始化\
    \ `BlogMember` 对象并赋值给变量 `$reader`。然后我们使用 `$reader` 调用 `BlogMember` 类中的 `getLastPost()`\
    \ 方法并将结果赋值给变量 `$lastPost`。另一方面，如果用户未登录，我们初始化 `Reader` 对象并赋值给 `$reader`。尝试自己编写这个\
    \ `if-else` 语句。参考相应的类找到调用它们时需要传递什么。\n\n一旦 `if-else` 语句完成，我们需要使用 `$reader` 对象调用\
    \ `getPostsDB()` 方法；该方法定义在 `Reader` 类中。记住 `BlogMember` 是 `Reader` 的子类。因此，无论 `$reader`\
    \ 是 `BlogMember` 还是 `Reader` 对象，都可以访问 `getPostsDB()` 方法。尝试调用此方法并将结果赋值给变量 `$posts`。\n\
    \n接下来，我们需要使用第二个 `if-else` 语句检查 `getPostsDB()` 是否返回了结果。如果没有结果（即 `$posts` 为 `false`），我们想要显示\
    \ `output_code` 文件夹中的 `blankcard.html`。为了包含此文件，我们使用以下语句：`include \"output_code/blankcard.html\"\
    ;`。\n\n接下来，在 `else` 块中（如果有结果），我们使用 `foreach` 循环遍历 `$posts`。`$posts` 是使用 `Reader`\
    \ 类中的 `getPostsDB()` 方法获取的二维数组。该方法使用 `Database` 类中的 `queryDB()` 方法，后者又使用 `PDO`\
    \ 类的 `fetchAll()` 方法。`fetchAll()` 方法从表中获取二维数组，数组中的每个元素代表一行。在我们的 `p-read.php` 文件中，我们将从“posts”表获取的数据赋值给\
    \ `$posts`。为了处理 `$posts`，我们可以使用以下 `foreach` 循环遍历它：\n\n```php\nforeach($posts as\
    \ $result) {\n    $msgid = $result['id'];\n    $title = htmlspecialchars($result['title']);\n\
    \    $post = strip_tags($result['post'], \"<strong><em><p><ol><<ul>><<li>><a>\"\
    ); \n    $username = htmlspecialchars($result['username']);\n    $postdate = htmlspecialchars($result['post_date']);\n\
    \    include \"output_code/messagecard.php\";\n}\n```\n\n对于每次迭代，我们将 `$posts` 中的数组赋值给\
    \ `$result`。接下来，在循环内部，我们将 `$result` 中的元素赋值给各种变量。例如，我们将 `$result['title']` 赋值给\
    \ `$title`。然而，在此之前，我们先对 `$result['title']` 应用了 `htmlspecialchars()` 函数。同样的情况也适用于\
    \ `$result['username']` 和 `$result['post_date']`。这样做的原因是我们稍将在 `read.php` 中显示这些元素的值。因此，我们必须将这些元素中的任何特殊字符转换为\
    \ HTML 实体以防止跨站脚本攻击。如果你忘记了跨站脚本攻击，请参考第 8.1.6 章。\n\n然而，注意我们没有对 `$result['post']`\
    \ 应用 `htmlspecialchars()` 函数吗？这是因为我们希望在 `$result['post']` 中允许某些 HTML 标签。具体来说，我们希望允许\
    \ `<strong>`、`<em>`、`<p>`、`<ol>`、`<ul>`、`<li>` 和 `<a>` 标签。为了实现这一点，我们需要另一个名为 `strip_tags()`\
    \ 的内置函数。该函数会从字符串中删除所有非第二个参数传递的 HTML 标签。因此，`strip_tags($result['post'], \"<strong><em><p><ol><<ul><a>\"\
    )` 删除了 `$result['post']` 中除了想要的之外标签。\n\n明白了吗？在将 `$result` 中的所有元素赋值给相应的变量后，我们使用\
    \ `include` 语句包含 `messagecard.php`。`messagecard.php` 存储在 `output_code` 文件夹中，包含了显示值的代码。一旦完成，`foreach`\
    \ 循环就结束了。根据提供的代码，尝试完成第二个 `if-else` 语句。该语句检查 `$is_member` 是否为 `true`。如果是，我们使用 `include`\
    \ 语句包含 `logout.html`。该文件存储在 `output_code` 文件夹中，包含了带有链接的代码。\n\n### 13.6.6 messagecard.php\n\
    \n首先，我们需要在 `messagecard.php` 中添加一些代码。该文件位于 `output_code` 文件夹内。如上所述，该文件包含了从“posts”表中检索帖子的代码。当用户登录博客时，我们需要在\
    \ `read.php` 中为用户登录后的帖子显示一个“新”图标。当使用 `messagecard.php` 文件显示帖子时，我们需要进行一些修改。为了实现这一点，将\
    \ `messagecard.php` 中的注释 `//add code` 替换为以下 `if` 语句：\n\n```php\n<?php\nif ($is_member\
    \ and $lastPost < $msgid) {\n    echo '<span class=\"new-post\">NEW</span>';\n\
    \    $update = true;\n}\n?>\n```\n\n在这里，我们使用 `if` 语句检查用户是否登录。此外，我们检查 `$lastPost`\
    \ 是否小于 `$msgid`。`$lastPost` 存储用户查看的最后一个帖子的 ID。我们通过 `p-read.php` 中的第一个 `if-else`\
    \ 语句获取了这一点。`msgid` 存储当前帖子的 ID。在 `foreach` 循环中，如果 `$lastPost` 小于当前帖子的 ID，我们这是一个新帖子。因此，我们使用\
    \ `echo` 语句输出带有“NEW”字样的 `<span>` 标签。此外，我们将 `$update` 的值设置为 `true`。如果 `$update`\
    \ 为 `true`，我们调用 `p-read.php` 中最后一个 `if` 语句中的 `getLastPost()` 方法，更新“members”表中的\
    \ `last_viewed` 列为“posts”表中的最新帖子 ID。明白了吗？如果不确定 `getLastPost()` 方法如何工作，请参考 `BlogMember`\
    \ 类 (`BlogMember.php`)。\n\n插入 `if` 语句后，我们需要将 `messagecard.php` 中的一些文本替换为 PHP 代码。具体来说，我们需要将“post_title”、“user_name”、“post_date”和“post_text”分别替换为\
    \ `$title`、`$username`、`postdate` 和 `$post` 的值。我们使用 `echo` 语句来实现这一点。例如，为了替换“post_title”，我们写道：\n\
    \n```php\n<?php echo $title; ?>\n```\n\n尝试自己替换“user_name”、“post_date”和“post_text”。然而，在替换“post_date”之前，我们需要将\
    \ `$postdate` 转换为字符串。这是因为 `$postdate` 目前存储的是 UNIX 时间戳。为了以更易读的格式显示 `$postdate`，你需要使用\
    \ `date()` 函数将时间戳转换为日期时间字符串。尝试自己这样做，使用 `'d-M-Y g:i'` 作为函数的第一个参数。如果 `date()` 函数上需要帮助，请参考第\
    \ 5.2.2 章。一旦更新了 `messagecard.php`，process 文件夹就完成了。\n\n### 13.7 includes Folder\n\
    \n我们现在准备好讨论 includes 文件夹中剩下的三个文件。这三个文件是 `header.html`、`debugging.php` 和 `loadclasses.php`。\n\
    \n-   `header.html` 包含 `<head>` 元素的 HTML 代码并已经为你完成。\n-   `debugging.php` 包含处理错误和异常的代码。该文件在第\
    \ 12.3 章中详细介绍过，因此我们在这里不再介绍它。然而，在这个项目中，请注意我们没有尝试捕获任何异常。相反，我们使用 `debugging.php`\
    \ 处理所有异常。这是因为当发生异常时，网站继续运行是没有意义的。例如，如果我们无法连接到数据库，网站的其他部分将无法工作。因此，简单使用 `debugging.php`\
    \ 处理异常是合理的。如果发生异常或错误，当 `display_errors` 设置为 '1'（即我们在开发网站时），`debugging.php` 在浏览器上显示详细消息。当\
    \ `display_errors` 设置为 '0'（即上线），它会记录消息并将用户重定向到 `error.html`（存储在主 `phpproject`\
    \ 文件夹中）。\n-   最后是 `loadclasses.php` 文件。正如名称所示，该文件用于自动加载类。你是否注意到在之前所有的文件中，我们在创建对象时都没有要求你\
    \ `include` 相关类文件？例如，在 `p-admin.php` 中，我没有要求你 `include` `Helper.php`。这通常会导致致命错误，因为每个\
    \ PHP 脚本都不知道另一个 PHP 脚本中的代码。因此，为了防止该错误，我们需要在创建 `Helper` 对象之前包含 `Helper.php`。然而与其手动包含此文件，PHP\
    \ 为我们提供了一个方便的替代方案 autoloader。如果在我们的 PHP 脚本中定义 autoloader，每当我们创建一个对象时，autoloader\
    \ 会自动为我们包含文件。要使用 autoloader，我们需要确保文件名与类名匹配。例如，如果文件名是 `MyClass.php`，类名为 `MyClass`。此外，使用\
    \ autoloader 非常简单。如果你打开 `loadclasses.php`，你会发现定义了一个名为 `autoloader()` 的函数，它有一个参数\
    \ `$class`。在这个函数内部，我们使用 `include_once` 包含相关的类文件。`INC_DIR` 是一个提供了项目 includes 文件夹路径的常量；我们将在下一节讨论这个常量。在\
    \ `autoloader()` 函数内部，我们将 `INC_DIR` 与字符串 `'classes/'`、变量 `$class` 以及字符串 `'.php'`\
    \ 拼接以获取类的直接路径。例如，如果 `$class` 等于 `'Helper'`，拼接结果为 `INC_DIR.'classes/Helper.php'`，这是\
    \ `Helper.php` 文件的直接路径。我们使用 `include_once` 来帮助包含该文件。明白了吗？编写 `autoloader()` 后，我们需要使用一个名为\
    \ `spl_autoload_register()` 的内置函数将其注册为 autoloader。一旦完成，我们只需要在所有 PHP 脚本中包含 `loadclasses.php`，每当我们创建一个对象时，PHP\
    \ 就会自动加载类。好了！我们现在回到 `phpproject` 文件夹。\n\n### 13.8 Editing the phpproject Folder\n\
    \n在这个文件夹中，我们有八个文件，其中七个是界面文件。这七个文件是 `signup.php`、`admin.php`、`write.php`、`index.php`、`read.php`、`logout.php`\
    \ 和 `error.html`。除了这些界面文件，我们还有一个名为 `UI_include.php` 的文件。\n\n#### 13.8.1 UI_include.php\n\
    \n我们将从 `UI_include.php` 文件开始。如果你打开这个文件，你会发现已经为你完成了。让我们来看代码。\n\n在文件中，我们首先定义常量 `INC_DIR`\
    \ 并向其赋值字符串 `$_SERVER['DOCUMENT_ROOT'] . '/phpproject/includes/'`。`$_SERVER['DOCUMENT_ROOT']`\
    \ 是一个预定义变量，存储当前脚本执行的根目录。如果你使用的是 XAMPP，此根目录指向 `htdocs` 文件夹。当我们拼接 `$_SERVER['DOCUMENT_ROOT']`\
    \ 和 `\"/phpproject/includes/\"` 时，我们得到了 includes 文件夹的直接路径。如果你重命名了 `phpproject`\
    \ 文件夹，必须相应地编辑给 `INC_DIR` 的路径。例如，如果你将文件夹重命名为 `myproject`，则需要赋值 `$_SERVER['DOCUMENT_ROOT']\
    \ . '/myproject/includes/'`。\n\n接下来，我们有两个 `include` 语句用于包含 `loadclasses.php` 和\
    \ `debugging.php`。之前提到，我们使用 `loadclasses.php` 自动加载类并使用 `debugging.php` 处理所有错误和异常。这两个文件以后需要包含在大部分界面文件中。`UI_include.php`\
    \ 文件完成后，我们就准备好处理界面文件。\n\n#### 13.8.2 User Interface Files\n\n第一个是 `error.html`\
    \ 文件。该文件包含了当网站发生错误或异常时向用户显示自定义消息的 HTML 代码。已经为你完成了。\n\n接下来，我们有五个非常相似的文件——`admin.php`、`write.php`、`index.php`、`signup.php`\
    \ 和 `read.php`。在每个文件中，我们需要添加 PHP 代码执行以下操作：启动新会话并包含 `UI_include.php` 和 `header.html`\
    \ 文件。此外，每个文件都包含一个由自身处理的 HTML 表单。为了处理表单，我们需要使用 `include` 语句将相关的处理文件添加到界面文件中。例如，为了处理\
    \ `admin.php` 中的表单，我们需要包含 `p-admin.php` 文件。上述操作已经在 `admin.php` 中为你完成。参考 `admin.php`\
    \ 中的代码，尝试对 `write.php`、`index.php`、`signup.php` 和 `read.php` 执行同样的操作。在每种情况下，注意\
    \ `UI_include.php` 文件必须在另外两个文件之前包含（因为我们需要在使用它之前定义 `INC_DIR`）。此外，你还需要相应地更改处理文件。\n\
    \n明白了吗？太棒了！一旦完成了上述操作，我们需要进行一些修改。\n\n-   对于 `signup.php`，没有需要启动新会话，因为 `p-signup.php`\
    \ 没有使用会话变量。因此，我们应该从 `signup.php` 中删除 `session_start()` 语句。\n-   对于 `read.php`，由于\
    \ `p-read.php` 包含了输出代码，我们应该在文件开头包含它。相反，我们应该在 `<body>...</body>` 标签之间包含它。\n-  \
    \ 最后对于 `signup.php`、`admin.php`、`index.php` 和 `write.php`，我们需要将 HTML 代码中的“Error\
    \ Message”（带引号）替换为存储在变量 `$msg` 中的实际消息。为了这样做，我们使用以下 PHP 代码：\n\n```php\n<?php echo\
    \ $msg; ?>```\n\n尝试自己完成上述修改。现在我们需要对 `index.php` 进行最后一次修改。如果你参考 `p-signup.php`，你会注意到我们在引导用户到\
    \ `index.php` 时添加了查询字符串 `new=1`。在成功后，我们希望在 `index.php` 中使用这个字符串。在 `<div class=\"\
    form\">` 之后添加以下代码：\n\n```php\n<div class=\"new\">\n<?php if (isset($_GET['new']))\
    \ echo 'ACCOUNT CREATED'; ?>\n</div>\n```\n\n在这里，我们使用查询字符串检查用户是否被成功引导到 `index.php`。如果是，输出\
    \ `'ACCOUNT CREATED'`。明白了吗？太棒了。让我们处理最后一个界面文件——`logout.php`。由于登录代码非常简单，我们没有为 `logout.php`\
    \ 创建单独的文件。相反，我们将直接向 `logout.php` 添加处理代码。为了这样做，我们需要在 `logout.php` 中做几件事：\n\n- \
    \  首先，我们需要恢复现有会话（使用 `session_start()`）并销毁会话中的变量（使用 `session_destroy()`）。\n-  \
    \ 接下来，我们需要包含 `UI_include.php` 和 `header.html` 文件。\n\n尝试完成上述操作。一旦完成，在浏览器中加载 `http://localhost/phpproject/logout.php`；你会看到两个显示“点击此处重新”的链接。这不是错误。第一个链接指向\
    \ `admin.php`，第二个指向 `index.php`。如果你回到 `write.php` 并仔细研究代码，你会注意到我们在页面末尾添加了查询字符串\
    \ `admin=1`。这个查询字符串告诉我们注销的用户是管理员。如果是这样，我们希望在 `logout.php` 中显示第一个链接。另一方面，如果用户不是管理员（即没有查询字符串），我们希望显示第二个链接。尝试使用\
    \ `logout.php` 中的 `if-else` 语句来实现上述操作。你可以参考 `index.php` 获取关于查询字符串的帮助。一旦完成，`logout.php`\
    \ 文件就完成了。此时项目几乎已经完成。事实上，如果你都做得正确，你可以加载 `http://localhost/phpproject/signup.php`\
    \ 且一切正常。尝试在第一个输入框中输入你想要的用户名并点击“提交”。你注意到什么？你应该得到一条显示“所有字段必填”的错误消息。注意你输入的第一个输入框的用户名消失了吗？我们项目的最后部分是在界面文件中添加\
    \ PHP 代码，以确保在处理表单出错时保持表单中输入的值。记得我们在 `Helper` 类中为此写了一个名为 `keepValues()` 的方法吗？假设我们有一个名为\
    \ `$h` 的 `Helper` 对象，这里是使用该方法的方法：\n\n-   如果我们有一个名为 `tb` 的文本框，并将提交的 `tb` 的值赋值给\
    \ `$tb`，我们写道：`<input type=\"text\" name=\"tb\" <?php $h->keepValues($tb, 'textbox');\
    \ ?>>`\n-   如果我们有一个名为 `ta` 的文本区域，并将提交的 `ta` 的值赋值给 `$ta`，我们写道：`<textarea name=\"\
    ta\"><?php $h->keepValues($ta, 'textarea'); ?></textarea>`\n-   最后，如果我们有一个名为 `sl`\
    \ 的下拉列表带有两个值属性 `1` 和 `2`，并将提交的 `sl` 的值赋值给 `$sl`，我们写道：\n\n```html\n<select name=\"\
    sl\">\n    <option value=\"1\"><?php $h->keepValues($sl, '1'); ?>1</option>\n\
    \    <option value=\"2\"><?php $h->keepValues($sl, '2'); ?>2</option>\n</select>\n\
    ```\n\n在我们的项目中，用于存储每个输入的变量名称与输入字段名称对应。例如， `$username` 存储名为“username”文本框的输入。根据上述描述，修改\
    \ `index.php`、`signup.php`、`admin.php` 和 `write.php`，使得在处理表单出错时，除 `passwords`\
    \ 以外的所有值都保持不变。明白了吗？一旦完成，我们需要对 `write.php` 做一些额外的更改。对于大多数页面，如果没有处理表单出错，网站将根据我们传递给\
    \ `header()` 函数的 URL 自动加载另一个页面。然而，这没有发生在 `write.php` 上。对于此页面，在管理员点击“submit”按钮后，无论数据是否成功提交到数据库，他/她都留在留在页面。我们希望修改\
    \ `write.php`，以便如果数据成功插入数据库，我们将清除表单，以便可以编写新帖子。换言之，如果数据插入成功，我们不想调用 `keepValues()`\
    \ 方法。为了这样做，我们需要使用 `p-write.php` 中声明的变量 `$msg`。下面的示例显示了如何对第一个输入字段（“title”）执行操作：\n\
    \n```html\n<input id=\"txttitle\" type=\"text\" name=\"title\" placeholder=\"\
    Enter Title\" autofocus <?php if ($msg != 'Message saved successfully') $h->keepValues($title,\
    \ 'textbox'); ?>>\n```\n\n尝试对其他输入字段执行此操作。一旦完成，项目就完成了。\n\n"
