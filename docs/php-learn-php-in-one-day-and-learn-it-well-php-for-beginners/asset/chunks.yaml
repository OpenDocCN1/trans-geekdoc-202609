    type = "checkbox" value = "EL" checked>English results in the checkbox labelled
    “English” being selected. If we want PHP to dynamically select this checkbox,
    we need to replace the code above with: <input type = "checkbox" name = "subj\[\]"
    value = "EL" <?php if (isset($\_POST\[''subj''\]) && in\_array(''EL'', $\_POST\[''subj''\]))
    echo ''checked''; ?> \>English Here, we use PHP to check if $\_POST\[''subj''\]
    is set and if the current option is selected. If it is, the string ''EL'' should
    be found in the $\_POST\[''subj''\] array. In other words, in\_array(''EL'', $\_POST\[''subj''\])
    should return true . If that’s the case, we echo ''checked'' to select this checkbox.
    This dynamically selects the checkbox labelled “English”. Got it? Great! We’ll
    be writing a function to prefill forms in our project later. 8.1.5 Filtering User
    Input Next, let’s move on to discuss how we can filter user inputs in our forms.
    Filtering refers to the sanitization and validation of user inputs. Sanitization
    is the process of removing invalid characters from the input. For instance, sanitizing
    an integer involves removing all characters except digits, plus and minus signs
    from the input. Validation, on the other hand, is the process of checking if the
    input satisfies certain criteria. For instance, if the input is supposed to be
    an email address, we can use the validation process to check if it is indeed an
    email address (such as whether it contains the “@” character). To filter user
    inputs, we use a built-in function called filter\_var() . When using this function,
    we need to specify how we want to filter our inputs. We do that using one of the
    predefined filters found at [https://www.php.net/manual/en/filter.filters.php](https://www.php.net/manual/en/filter.filters.php)
    . Depending on the filter used, this function will either return the filtered
    data or return false . For instance, if we want to remove invalid characters from
    an integer, we can use the FILTER\_SANITIZE\_NUMBER\_INT filter as shown below:
    $num = ''12.5abc''; echo filter\_var($num, FILTER\_SANITIZE\_NUMBER\_INT); If
    you run the code above, you’ll get 125 as the output. If we want to validate whether
    an email address is valid, we can use the FILTER\_VALIDATE\_EMAIL filter. If we
    pass a valid email address to the function, it returns the email address. Else,
    it returns false . For instance, $email = ''abc@gmail''; var\_dump(filter\_var($email,
    FILTER\_VALIDATE\_EMAIL)); gives us bool(false) as “abc@gmail” is not a valid
    email address (“.com” is missing). 8.1.6 Cross-Site Scripting Great! We’ve covered
    most of the form handling concepts in PHP. Last but not least, let’s move on to
    cross-site scripting. For this, I need to do a little demonstration. Change the
    PHP code in form.php (between the </form> and </body> tags) to the following:
    if (isset($\_POST\[''studentname''\])) echo ''You entered ''.$\_POST\[''studentname''\].''
    into the text field''; and reload the page. Type <script>alert(''Hacked'');</script>
    into the text field and click on the “Submit Form” button. What do you get? You
    get an alert box that says “Hacked” right? ![](image_rsrc3AP.jpg)Surprised? This
    example demonstrates a critical security concept in PHP - cross-site scripting
    (also known as XSS). Cross-site scripting occurs when a user enters undesirable
    scripting code into our PHP form and submits the code. If our site then stores
    this code (for instance, in a database) and displays it to another user, the malicious
    code will be executed in the other user’s browser. In our example, we created
    a harmless alert box using Javascript. However, users with malicious intent can
    definitely use this same technique to run harmful scripting code on the victim’s
    browser. To prevent this from happening, we need to be careful whenever we display
    information entered by users. There are a few ways to do it. The easiest is to
    use a built-in function called htmlspecialchars() . This function converts special
    characters into HTML entities. Special characters refer to characters that have
    special significance in HTML, such as the < and \> characters. If you do not want
    < and \> to represent the start and end of an HTML tag, you need to encode them
    using the htmlspecialchars() function. This function converts < and \> to &lt;
    and &gt; respectively. <script> will thus be converted to &lt;script&gt; and no
    longer interpreted as an HTML tag. To see how this works, change the PHP code
    above to if (isset($\_POST\[''studentname''\])) echo ''You entered ''.htmlspecialchars($\_POST\[''studentname''\]).''
    into the text field''; For demonstration purposes, we only encode the text field.
    In actual coding, you have to encode every form element where users are allowed
    to enter information themselves. If you load the page and enter <script>alert(''Hacked'');</script>
    into the text field now, you’ll see that the alert box no longer pops out when
    you submit the form. Instead, you get the following output below the form: You
    entered <script>alert(''Hacked'');</script> into the text field. <script> and
    </script> are treated as normal text with no HTML significance. If you right-click
    on your webpage and select “View Page Source”, you’ll see the line You entered
    &lt;script&gt;alert(''Hacked'');&lt;/script&gt; into the text field. below the
    </form> tag. This shows the encoding of the < and \> characters. 8.2 $\_SESSION
    We’ve covered quite a bit in this chapter so far. In the previous section on PHP
    form handling, you learned about the $\_GET and $\_POST superglobals. In this
    section, we are going to discuss another superglobal - $\_SESSION . In PHP, a
    session is a way of storing information that can be accessed across multiple pages;
    this information is stored in the $\_SESSION superglobal. Like the $\_GET and
    $\_POST superglobals, the $\_SESSION superglobal is an associative array. This
    array is stored on the server and is available to all pages on the site during
    the duration of the session. To demonstrate the use of sessions, we need to create
    two pages, session.php and session2.php . Let’s do that now. First, create a new
    file called session.php in htdocs and add the following code to it (line numbers
    are added for reference). 1  <?php 2     session\_start(); 3 4     $\_SESSION\[''myFavFood''\]
    = ''Pizza''; 5     $\_SESSION\[''myFavDrink''\] = ''Cola'';   6     $\_SESSION\[''myFavColor''\]
    = ''Orange''; 7 8     #updating a session variable 9     $\_SESSION\[''myFavDrink''\]
    = ''Beer''; 10 11    #deleting a session variable 12    unset($\_SESSION\[''myFavColor''\]);
    Here, we use a built-in function called session\_start() to start a new session
    on line 2. This function creates a new session if one has not already been created
    or resumes the current one if it exists. Each session created is associated with
    an automatically generated unique session ID. After creating the session, we store
    the strings ''Pizza'' , ''Cola'' and ''Orange'' into the $\_SESSION superglobal,
    using ''myFavFood'' , ''myFavDrink'' and ''myFavColor'' as the keys respectively.
    Next, we update the value of $\_SESSION\[''myFavDrink''\] by assigning a new string
    to it on line 9. Finally, on line 12, we use another built-in function called
    unset() to destroy an element in the $\_SESSION superglobal. To use this function,
    we pass the name of the element that we want to destroy to the function. After
    the element is destroyed, we will no longer be able to access it. Next, let’s
    create another file called session2.php (in htdocs) and add the following code
    to it: <?php session\_start(); echo ''<BR>Food: ''.$\_SESSION\[''myFavFood''\];
    echo ''<BR>Drink: ''.$\_SESSION\[''myFavDrink''\]; echo ''Color: ''.$\_SESSION\[''myFavColor''\];
    Here, we start by calling the session\_start() function to resume the current
    session. We need to call this function whenever we want to access the $\_SESSION
    superglobal. Next, we use three echo statements to output the values stored in
    $\_SESSION . Now, we are ready to demonstrate how sessions work. To do that, load
    session.php in your browser first. When you do that, session.php starts a new
    session and stores data into the $\_SESSION superglobal. Next, load session2.php
    in your browser. What do you get? Depending on the error setting on your PHP server,
    you will get an output similar to what is shown below: Food: Pizza Drink: Beer
    Notice : Undefined index: myFavColor in …session2.php on line 6 Color: Notice
    that we get an undefined index notice for “myFavColor”? This is because $\_SESSION\[''myFavColor''\]
    was destroyed using the unset() function in session.php . Other than that, we
    have successfully retrieved the values of $\_SESSION\[''myFavFood''\] and $\_SESSION\[''myFavDrink''\]
    . These two values were stored in the $\_SESSION superglobal in session.php and
    retrieved in session2.php . This demonstrates how we can use the $\_SESSION superglobal
    to store and retrieve data across different PHP pages. Got it? Besides creating
    and storing data in a session, we can destroy a session. We commonly do that when
    users log out of our site. To destroy a session, we use another built-in function
    called session\_destroy() . To see how this function works, create a new file
    called session3.php in htdocs and add the following code to it: <?php session\_start();
    session\_destroy(); As shown in the code above, we need to call the session\_start()
    function to resume an existing session before destroying it. Next, load session3.php
    in your browser; this destroys the current session. Finally, load session2.php
    in your browser again. You’ll get an output that says indexes “myFavFood”, “myFavDrink”
    and “myFavColor” are all undefined. This indicates that the session no longer
    exists. 8.3 $\_COOKIE Cool! We’ve come to the final topic in this chapter - cookies.
    A cookie is another way of storing information that can be accessed across multiple
    pages on the site. It is essentially a small text file that stores data on the
    user''s computer (as opposed to a session that stores data on the server). As
    cookies are stored on the user’s computer, you should not use cookies to store
    sensitive data, as a malicious user could potentially manipulate it. Also, cookies
    may be disabled on the user’s browser. Hence, if the information to be stored
    is crucial or sensitive, you should use sessions instead. To create a cookie,
    we use the set\_cookie() function. Similar to the header() function covered in
    Chapter 3.3, the set\_cookie() function must be called before your script generates
    any output. If you fail to do that, you’ll get a “Cannot modify header information
    - headers already sent” warning and the cookie will not be set. Your code may
    work when you are working on your local computer, but when you upload it to your
    hosting company’s server, it will fail to work. The set\_cookie() function accepts
    up to seven arguments; only the first is mandatory. We commonly provide the first
    three arguments to the function, namely the name of the cookie, the value of the
    cookie and the expiry date in UNIX timestamp format. Let’s look at an example.
    Create a file called cookie.php in htdocs and add the following code to it: <?php
    setcookie(''userName'', ''Joy'', time() + 120); #modifying a cookie setcookie(''userAge'',
    25, time() + 3600); setcookie(''userAge'', 26, time() + 3600); #deleting a cookie
    setcookie(''userLevel'', 3, time() + 3600); setcookie(''userLevel'', 3, time()
    - 3600); Here, we set three cookies - userName , userAge and userLevel . For the
    first cookie ( userName ), its value and expiry date are ''Joy'' and time() +
    120 respectively. time() is a built-in function that gives us the current Unix
    timestamp; time() + 120 means the cookie will expire 120 seconds (i.e. 2 minutes)
    after it is set. Next, we have the userAge cookie. This cookie is set twice. When
    a cookie is set more than once, the newest cookie overwrites the previous ones.
    Hence, the value of userAge is updated from 25 to 26 . Finally, we have the userLevel
    cookie. This cookie is set with an initial expiry of time() + 3600 . However,
    it is subsequently updated to an expiry of time() - 3600 . When a cookie has an
    expiry in the past, it gets deleted. Let’s look at how we can access each of these
    cookies now. We do that using the $\_COOKIE superglobal. Create another file called
    cookie2.php in htdocs and add the following code to it: <?php echo ''User Name
    is ''.$\_COOKIE\[''userName''\]; echo ''<BR>User Age is ''.$\_COOKIE\[''userAge''\];
    echo ''User Level is ''.$\_COOKIE\[''userLevel''\]; We are now ready to test our
    scripts. First, launch cookie.php in your browser. When you do that, the three
    cookies ( userName , userAge and userLevel ) get created. Next, launch cookie2.php
    . Depending on the error setting on your PHP server, you’ll get an output similar
    to what is shown below: User Name is Joy User Age is 26 Notice: Undefined index:
    userLevel in ...cookie2.php on line 4 User Level is The userLevel cookie does
    not exist as it has been deleted. Wait 2 minutes and reload cookie2.php . You’ll
    get an output similar to the following: Notice: Undefined index: userName in ...cookie2.php
    on line 2 User Name is User Age is 26 Notice: Undefined index: userLevel in ...cookie2.php
    on line 4 User Level is The userName cookie is also non-existent now as it has
    expired. '
