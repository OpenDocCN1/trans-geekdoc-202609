    \ array returned by the `fetch()` method. `row[0]` gives us the first column (i.e.,\
    \ “owner” column) while `row[1]` gives us the second column (i.e., “petname” column).\n\
    \nBesides `FETCH_NUM` style, we can use the `FETCH_ASSOC` style to fetch our data:\n\
    \n```php\nwhile($row = $preparedNamed->fetch(PDO::FETCH_ASSOC)) {\n    echo 'Pet\
