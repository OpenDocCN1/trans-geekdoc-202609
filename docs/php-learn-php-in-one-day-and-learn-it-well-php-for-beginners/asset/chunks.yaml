  trans: "\n\n# 第 9 章：面向对象编程\n\n在接下来的两个章节中，我们将介绍 PHP 的另一个重要概念——面向对象编程（OOP）。OOP 是一个大课题，因此，对其进行全面讨论超出了本书的范围。在本章中，我们将涵盖\
    \ OOP 的核心概念。在下一章，我们将讨论继承。准备好了吗？让我们开始。\n\n## 9.1 什么是 OOP？\n\n首先，什么是 OOP？OOP 是一种编程方法，我们通过将相关的变量、常量和函数分组到一个\
    \ `class`（类）中组织代码。这个 `class` 作为一个模板，我们可以从它创建所谓的 `objects`（对象）。对象可以用于存储数据并访问在 `class`\
    \ 内部定义的函数。困了吗？别担心。理解 OOP 的最好方法是看例子。现在让我们编写自己的 `class`。\n\n## 9.2 编写我们自己的类\n\n\
    要编写自己的 `class`，我们使用 `class` 关键字，后面跟着类的名称。类名不区分大小写，可以包含字母、数字或下划线。然而，它不能是 PHP 的保留字（即在\
    \ PHP 中具有预定义含义的单词，例如 `echo`、`switch`、`break` 等），并且不能与数字开头。在命名 `classes` 时，使用 `pascal\
    \ case`（大驼命名法）是一种约定。Pascal case 指每个单词的首字母大写的做法，包括第一个单词（例如 `ClassName`）。\n\n为了创建我们的\
    \ `class`，让我们首先在 Brackets 中创建一个文件并保存为 `Movie.php` 到我们的 `htdocs` 文件夹中。接下来，将以下代码添加到\
    \ `Movie.php`：\n\n```php\n<?php\nclass Movie{\n    //在此处添加类成员\n}\n```\n\n在这里，我们使用\
    \ `class` 关键字声明了一个名为 `Movie` 的 `class`。在 `Movie` 类内部（大括号 `{}` 内），我们将添加变量、常量和函数。在\
    \ `class` 内部声明的变量和函数分别被称为 `properties`（属性）和 `methods`（方法）。总来说，这些属性、常量和方法被称为 `class\
    \ members`（类成员）。\n\n我们将首先为 `Movie` 类添加属性。为了做到这一点，将以下代码添加到 `Movie.php`（大括号内部）：\n\
    \n```php\nprivate $id;\npublic $title;\npublic $rentalPrice;\n```\n\n在这里，我们声明了三个属性：`$id`、\
    \ `$title` 和 `$rentalPrice`。注意我们没有在上面的代码中初始化它们。这是因为我们稍后将在名为 `constructor`（构造函数）的特殊方法中对它们进行初始化。此外，注意我们在属性声明之前使用了\
    \ `public` 或 `private` 单词。现在不要担心这些关键字；我们稍后会回到它们。\n\n接下来，为我们的 `Movie` 类添加一个常量。为了做到这一点，将以下代码添加到\
    \ `Movie.php`（大括号内部）：\n\n```php\nconst DISCOUNT = 10;\n```\n\n在这里，我们定义了一个名为 `DISCOUNT`\
    \ 的常量并给它赋值为 `10`。注意我们在这里定义常量的方式有所不同（与我们在 4.1 节中学到的相比）？确实，在 `class` 内部定义常量，我们不使用\
    \ `define()` 函数。相反，我们使用所示的 `const` 关键字。\n\n最后，为我们的 `class` 添加一些方法。如前所述，`method`\
    \ 是定义在 `class` 内部的函数。我们将从 `constructor` 开始。`constructor` 是 PHP 中的一个魔术方法。魔术方法是\
    \ PHP 中具有特殊功能的方法；它们的名称是预定义的并且始终以两个下划线开头。`constructor` 命名为 `__construct()`，每当我们从\
    \ `class` 创建 `object` 时，它是第一个被调用的方法。我们通常使用此方法来初始化 `class` 中的属性。\n\n在常量之后（但在 `Movie`\
    \ 类结束括号之前）向 `Movie` 类添加以下代码：\n\n```php\npublic function __construct($pId, $pTitle,\
    \ $pRentalPrice){\n    $this->id = $pId;\n    $this->title = $pTitle;\n    $this->rentalPrice\
    \ = $pRentalPrice;\n}\n```\n\n在这里，我们定义了一个带有三个参数的 `constructor`：`$pId` `$pTitle`\
    \ 和 `$pRentalPrice`。在 `constructor` 内部，我们分别用 `$pId` `$pTitle` 和 `$pRentalPrice`\
    \ 的值初始化 `$id`、 `$title` 和 `$rentalPrice`。注意上面的代码中有一个新关键字 `$this`？我们将在下一节学习创建对象时解释这个关键字。现在，只需知道每当我们想在\
    \ `class` 内部访问 `class` 的属性和方法时，我们需要使用 `$this` 关键字，后跟 `->` 运算符。\n\n接下来，为我们的 `Movie`\
    \ 类添加一个普通的（即非魔术的）`method`。在 `__construct()` 方法之后（但在 `Movie` 类结束括号之前）添加以下方法：\n\n\
    ```php\npublic function conversion($country){\n    $rate = 1;\n    switch($country){\n\
    \        case 'UK':\n            $rate = 0.76;\n            break;\n        case\
    \ 'Japan':\n            $rate = 110;\n            break;\n    }\n    return round($rate*$this->rentalPrice,\
    \ 2);\n}\n```\n\n在这里，我们定义了一个名为 `conversion()` 的 `method`。该方法有一个参数——`$country`，并根据\
    \ `$country` 的值将美元转换为镑或日元。在方法内部，我们声明并初始化了一个名为 `$rate` 的变量，并使用 `switch` 语句根据 `$country`\
    \ 的值更新它的值。\n\n接下来，我们将 `$rate` 与 `$rentalPrice` 属性相乘（`$rate*$this->rentalPrice`），并将乘积作为参数传递给名为\
    \ `round()` 的内置函数。该函数接受两个参数，并将第一个参数四舍五到第二个参数指定的精度。在我们方法中，我们将乘积四舍五到 2 位小数。最后，我们使用\
    \ `return` 关键字返回 `round()` 函数的结果。在方法内部，注意我们没有使用 `$this` 关键字来访问 `$country` 和 `$rate`。这是因为\
    \ `$country` 是一个参数，而 `$rate` 是一个局部变量（即在方法内部声明）。换句话说，它们不是类属性。我们只在访问类属性和方法时才使用 `$this`\
    \ 关键字。例如，我们使用 `$this` 关键字来访问 `$rentalPrice` 属性。明白了吗？一旦你在 `Movie` 类中添加了 `conversion()`\
    \ 方法，我们的 `class` 就完成了。我们现在准备好使用这个 `class` 了。\n\n## 9.3 创建对象\n\n创建一个 `object`，我们使用\
    \ `new` 关键字。`object` 也称为 `class` 的一个 `instance`（实例），创建 `object` 的过程被称为 `instantiating`（实例化）。在\
    \ Brackets 中创建一个新文件并将其保存为 `chap9.php` 到你的 `htdocs` 文件夹中。向 `chap9.php` 添加以下代码：\n\
    \n```php\n<?php\ninclude 'Movie.php';\n$mov1 = new Movie('N001', 'Lusso', 99);\n\
    ```\n\n在这里，我们首先使用 `include` 语句包含 `Movie.php`（包含了 `Movie` 类的代码）。接下来，我们使用 `new`\
    \ 关键字创建一个名为 `$mov1` 的 `object`。由于 `__construct()` 是一个魔术方法，PHP 会自动查找并执行它。我们还记得\
    \ `class` 里的 `$this` 关键字吗？`$this` 指向当前对象。当我们使用语句 `$mov1 = new Movie('N001', 'Lusso',\
    \ 99);` 创建 `$mov1` 时，`$this` 指向 `$mov1`。换句话说，当 PHP 执行构造函数时， `$this->id = 'N001';`\
    \ 变成了赋值操作。结果是值 `'N001'` 被赋值给 `$mov1` 的 `$id` 属性。构造函数中的其他赋值语句也是如此。因此，值 `'Lusso'`\
    \ 和 `99` 分别赋值给 `$mov1` 的 `$title` 和 `$rentalPrice` 属性。接下来，我们使用下面的语句创建一个名为 `$mov2`\
    \ 的第二个 `object`：\n\n```php\n$mov2 = new Movie('P002', 'Junior', 89);\n```\n\n\
    当 PHP 创建 `$mov2` 并调用构造函数时，`$this` 指向 `$mov2`。因此，语句 `$this->id = 'P002';` 变成了 `$mov2->id\
    \ = 'P002';`。构造函数中的两个赋值语句也是如此。结果是，值 `'Junior'` 和 `89` 分别赋值给 `$mov2` 的 `$title`\
    \ 和 `$rentalPrice` 属性。明白了吗？好了！继续。\n\n## 9.4 访问类成员\n\n创建对象后，我们可以使用对象名和 `->` 运算符访问它的属性和方法。例如，访问\
    \ `chap9.php` 中 `$mov1` 的属性和方法，我们使用以下代码：\n\n```php\necho $mov1->title;\necho $mov1->conversion('Japan');\n\
    ```\n\n在这里，我们首先使用 `->` 运算符访问 `$mov1` 的 `title` 属性。接下来，我们使用 `->` 运算符调用 `conversion()`\
    \ 方法，并将 `'Japan'` 作为参数。将上述代码添加到 `chap9.php`（实例化语句之后）并加载页面，你会得到输出 Lusso 89。很直接吧？\n\
    \n现在，假设我们想访问 `Movie` 类中定义的 `DISCOUNT` 常量，我们该怎么做？访问类常量不使用 `->` 运算符。相反，我们使用 `::`\
    \ 运算符。这是因为类常量与类属性不同；它们每个类分配一次，而不是每个对象分配一次。这意味着即使有 100 个 `Movie` 对象（在我们示例中的 `$mov1`\
    \ 和 `$mov2`），存储 `DISCOUNT` 常量的内存位置也只有一个。要访问 `Movie` 类中的 `DISCOUNT` 常量，向 `chap9.php`\
    \ 添加以下代码：\n\n```php\necho Movie::DISCOUNT;\necho $mov1::DISCOUNT;\necho $mov2::DISCOUNT;\n\
    ```\n\n如果你运行上面的代码，你会看到三次 10。这显示我们可以使用类名（`Movie`）或对象名（`$mov1` 或 `$mov2`）来访问类常量。三个给出相同的值，因为它们访问同一个内存位置。\n\
    \n## 9.5 访问修饰符\n\n现在我们知道如何创建对象并使用这些对象访问类成员，让我们讨论之前跳过的概念——`public` 和 `private`\
    \ 关键字。这两个关键字被称为“access modifiers”（访问修饰符）；它们作为控制我们在哪里可以访问特定类的成员。`public` 类成员可以在地方访问，而\
    \ `private` 类成员只能在声明它们的类内部访问。\n\n在我们的 `Movie` 类中，有两个 `public` 属性（`$title` 和 `$rentalPrice`）和一个\
    \ `private` 属性（`$id`）。之前我们学习了访问 `chap9.php` 中 `$mov1` 的 `$title` 属性。由于 `$title`\
    \ 是公共类属性，我们在 `chap9.php` 中访问它没有问题。现在，尝试访问 `$id` 属性。向 `chap9.php` 添加这一行 `echo $mov1->id;`\
    \ 并再次加载页面。你得到了什么？输出中增加了 `Fatal error: Uncaught Error: Cannot access private property\
    \ Movie::$id...`，对吧？这是因为 `$id` 是一个私有属性。由于私有类成员只能在声明它们的类内部访问，我们不允许在类外的 `chap9.php`\
    \ 中访问 `$id` 属性。这就是访问修饰符的工作原理；它们基本上控制我们是否可以在声明类的外部访问特定的类成员。\n\n在 PHP 中，访问修饰符对于属性是强制的，对于方法是可选的。如果我们没有为属性声明修饰符，就会报错。如果我们不为方法声明修饰符，默认是\
    \ `public`。从 PHP 7.1.0 开始，我们也可以为常量添加访问修饰符。如果不为常量声明修饰符，默认是 `public`。除了公共和私有成员，PHP\
    \ 还有 `protected`（保护）成员。这些成员可以在声明它们的类以及任何继承自该类的类内部访问。我们将在下一章讨论保护成员。\n\n此时，你们中的一些人可能在想，为什么我们希望类成员是私有的。例如，如果我们无法访问它，为什么要大费心思声明\
    \ `$id` 属性呢？原因是虽然私有成员不能在声明它们的类外部访问，但它们在内部是可以访问的。例如，我们可以在 `Movie` 类内部编写一个根据 `$id`\
    \ 属性显示标题的函数。为了看到它是如何工作的，将以下代码添加到 `Movie.php`（`conversion()` 方法之后但在 `Movie` 类结束括号之前）：\n\
    \n```php\npublic function displayHeading($tag){\n    if (substr($this->id, 0,\
    \ 1) == 'N') return $tag;\n    else return \"Movies\";\n}\n```\n\n这个方法使用 `substr()`\
    \ 检查 `$id` 是否以 `'N'` 开头。如果是，它返回一个由参数 `$tag` 定义的元素；否则，它返回元素 \"Movies\"。接下来，将 `chap9.php`\
    \ 中的 `echo $mov1->id;` 替换为 `echo $mov1->displayHeading('H');`。由于 `displayHeading()`\
    \ 是公共方法，我们在类外部访问它没有问题。现在运行代码，你会得到 \"Movies\"。明白了吗？\n\n## 9.6 Getter（get 器）和 Setter（Setter）\n\
    \n在前一节中，我们讨论了 `public` 和 `private` 类成员之间的区别。在可能的情况下，我们应该将类成员声明为 `private`，如果类外部代码不需要访问它们。这种防止外部访问的行为被称为\
    \ `encapsulation`（封装）。封装使得我们能够能够在不影响类外部代码的情况下对类成员进行更改。例如，如果我们想将我们 `Movie` 类中 `$id`\
    \ 属性的名称改为 `$movieID`，我们只需要在类内部进行更改；类外的代码不受影响。将类属性声明为 `private` 的优点之一。\n\n将类属性声明为\
    \ `private` 的另一个优点是它可以防止对象的非法修改。为了验证这一点，向 `chap9.php` 添加以下代码：\n\n```php\n$mov1->rentalPrice\
    \ = -20;\necho $mov1->rentalPrice;\n```\n\n在这里，我们首先给 `$mov1` 的 `$rentalPrice`\
    \ 属性赋值 -20。接下来，我们使用 `echo` 语句输出它的值。如果你运行上面的代码，你会得到 -20，这意味着我们可以在类外部访问并将其更改为任何值。这显然是不理想的，因为价格不应该是负数。为了防止这种修改发生，我们不应该将\
    \ `$rentalPrice` 属性声明为 `public`。相反，我们应该将其声明为 `private`。\n\n如果我们将所有类属性声明为 `private`，如果类外部需要访问或修改这些属性怎么办？在这种情况下，我们可以使用\
    \ `getters` 和 `setters`。这些魔术方法允许我们受限地访问 `private` 属性。为了看到它是如何工作的，向 `Movie.php`\
    \ 添加以下方法：\n\n```php\npublic function __get($propertyRequested){\n    if ($propertyRequested\
    \ == 'id') return 'You do not have permission to access id.';\n    else return\
    \ $this->$propertyRequested;\n}\n\npublic function __set($propertyToModify, $value){\n\
    \    if ($propertyToModify == 'rentalPrice' && $value > $this->rentalPrice)\n\
    \        $this->rentalPrice = $value;\n    else echo 'Failed to modify '.$propertyToModify;\n\
    }\n```\n\n第一个方法 (`__get()`) 被称为 getter；它控制类外部可以哪些属性，并有一个名为 `$propertyRequested`\
    \ 的参数。该参数存储我们想要访问的属性名称。在 `__get()` 方法中，我们使用 `if-else` 语句检查 `$propertyRequested`\
    \ 是否等于 `'id'`。如果是，`__get()` 方法返回一个字符串告诉我们没有权限访问 `$id` 属性。否则，它返回请求的属性。\n\n第二个方法\
    \ `__set()` 被称为 setter；它控制哪些属性可以被修改，并有两个参数：`$propertyToModify` 和 `$value`。在 `__set()`\
    \ 方法内部，我们使用 `if-else` 语句检查 `$propertyToModify` 是否为 `'rentalPrice'` 且 `$value`\
    \ 是否大于 `$this->rentalPrice`。如果是，我们将 `$value` 赋值给 `$this->rentalPrice`。\n\n"
- fmt: "\n# Chapter 10: Inheritance\n\nIn the previous chapter, we covered the fundamentals\
    \ of OOP. Some of the concepts in OOP can be confusing for beginners. If this\
    \ is the first time you are exposed to OOP, you may want to read through the previous\
    \ chapter more than once to fully grasp the concepts. Once you are comfortable\
    \ with the topics covered in Chapter 9, we are ready to proceed to a more advanced,\
    \ but equally important, concept in OOP - inheritance. \n\nAs the name suggests,\
    \ inheritance has to do with the relationship between two or more classes. With\
    \ inheritance, classes can be declared such that one class is a child class (also\
    \ known as a subclass) of another (known as the `parent class` or `base class`).\
    \ This enables us to group related classes together. The easiest way to explain\
    \ inheritance is to look at an example. \n\n## 10.1 Writing the Child Classes\n\
    \nWe’ll use the `Movie` class in Chapter 9 as a parent class to illustrate. Open\
    \ Brackets and create a new file called `AwardWinningMovie.php`. Save this file\
    \ to your `htdocs` folder. Add the following code to `AwardWinningMovie.php`:\n\
    \n```php\n<?php\ninclude \"Movie.php\";\nclass AwardWinningMovie extends Movie{\n\
    \    private $award;\n    public function __construct($pId, $pTitle, $pRentalPrice,\
    \ $pAward){\n        parent::__construct($pId, $pTitle, $pRentalPrice);\n    \
    \    $this->award = $pAward;\n    }\n}\n```\n\nIn the code above, we first use\
    \ the `include` statement to include the code for the `Movie` class. Next, we\
    \ create a class called `AwardWinningMovie`. Notice a new keyword `extends` in\
    \ the `AwardWinningMovie` class declaration? This keyword indicates that `AwardWinningMovie`\
    \ is a child class of `Movie`. When one class is a child class of another, it\
    \ inherits all the `public` and `protected` members of the parent class. In other\
    \ words, it can access and use those members directly, as if they are part of\
    \ its own code. We’ll illustrate what this means later.\n\nWithin the `AwardWinningMovie`\
    \ class, we declare a private property called `$award`. Next, we declare a constructor\
    \ with 4 parameters: `$pId`, `$pTitle`, `$pRentalPrice` and `$pAward`. Within\
    \ the constructor, notice a new keyword, `parent`? As you may have guessed, this\
    \ keyword is used to call the parent class constructor. As the child class has\
    \ its own constructor, we need to use the `parent` keyword and the `::` operator\
    \ when we want to access the parent class constructor. \n\nWhen we call the parent\
    \ class constructor, we do not create a new object. Instead, we use the name of\
    \ the constructor (`__construct()`). In our example, we pass the values of `$pId`,\
    \ `$pTitle` and `$pRentalPrice` as arguments to the parent class constructor.\
    \ These values will be used to initialize the `$id`, `$title` and `$rentalPrice`\
    \ properties declared in the parent class respectively. As these properties were\
    \ declared as `private` in the parent class, we are not allowed to access them\
    \ directly in the child class. Instead, we can only initialize them using the\
    \ parent class constructor, which is a `public` method.\n\nNext, we have the statement\
    \ `$this->award = $pAward`. This statement is used to initialize the `$award`\
    \ property declared in the child class. With that, the child class constructor\
    \ is complete. Now, let’s add another method to the child class. Add the code\
    \ below to the `AwardWinningMovie` class, after the `__construct()` method but\
    \ before the closing brace of the class:\n\n```php\npublic function recommend($country){\n\
    \    switch ($this->award){\n        case 'Best Picture':\n            $others\
    \ = 'The Rail';\n            break;\n        case 'Best Actor':\n            $others\
    \ = '1729';\n            break;\n        default:\n            $others = 'And\
    \ so it begins';\n    }\n    return 'You might also like:<BR>'. '<BR>Movie Title\
    \ = '.$others. '<BR>Rental Price = '.$this->conversion($country);\n}\n```\n\n\
    Here, we declare a method called `recommend()` that has one parameter - `$country`.\
    \ Within the method, we use a `switch` statement to assign different values to\
    \ the local variable `$others`, depending on the value of `$this->award`. Next,\
    \ we return a string recommending a new movie to users. This string should be\
    \ quite self-explanatory, except for the last part where we use the `$this` keyword\
    \ to call the `conversion()` method (refer to the underlined code above). \n\n\
    Recall that we do not have a `conversion()` method in the `AwardWinningMovie`\
    \ class? Will we get an error when we try to call this method? The answer is no.\
    \ This is because the `AwardWinningMovie` class is a subclass of the `Movie` class.\
    \ Hence, it can access all the `public` and `protected` members of the parent\
    \ class directly, as if they are part of its own code. As the parent class - `Movie`\
    \ - has a `public` method called `conversion()`, the child class can access this\
    \ method simply by using the `$this` keyword. Got it? This is one of the main\
    \ reasons for using inheritance; it allows us to reuse existing code. In our example,\
    \ the `AwardWinningMovie` class can use the `conversion()` method directly without\
    \ having to code it itself.\n\n## 10.2 Creating a Child Class Object\n\nWe are\
    \ now ready to create a child class object. To do that, create a new file in Brackets\
    \ and save it as `chap10.php` to the `htdocs` folder. Add the following code to\
    \ it:\n\n```php\n<?php\ninclude 'AwardWinningMovie.php';\n$awm = new AwardWinningMovie('A12324',\
    \ 'Max', 6.99, 'Best Picture');\necho $awm->recommend('Japan');\n```\n\nHere,\
    \ we first use the `include` statement to include the `AwardWinningMovie` class.\
    \ Next, we use the `new` keyword to create an `AwardWinningMovie` object, passing\
    \ `'A12324'`, `'Max'`, `6.99` and `'Best Picture'` as arguments to the constructor.\
    \ Finally, after creating the `$awm` object, we use it to call the `recommend()`\
    \ method.\n\n## 10.3 Access Modifiers\n\nGood! Let’s revisit access modifiers.\
    \ Previously, we mentioned that when one class extends another, it inherits all\
    \ `public` and `protected` members. What happens if we change the `conversion()`\
    \ method in `Movie` to `private`? If you run the code, you’ll get an error similar\
    \ to:\n\n`Fatal error: Call to private method Movie::conversion() on object`\n\
    \nThis is because `private` methods are not accessible outside the class itself.\
    \ What if we change it to `protected`? If you run the code, you’ll get:\n\n`Fatal\
    \ error: Call to protected method Movie::conversion() on object`\n\nThis is because\
    \ `protected` methods are only accessible within the class and by its subclasses.\
    \ What if we change it back to `public`? If you run the code, it works because\
    \ `public` methods are accessible everywhere.\n\n## 10.4 Overriding\n\nNow that\
    \ you are familiar with child classes and inheritance, let’s move on to the concept\
    \ of overriding. Overriding occurs when a child class modifies the methods it\
    \ inherits from its parent class. To illustrate what this means, add the following\
    \ line to `chap10.php` and load the page:\n\n```php\necho $awm->displayHeading('H1');\n\
    ```\n\nYou’ll get the text “Award Winning Movies” displayed as an `<h1>` heading.\
    \ Here, we are calling the `displayHeading()` method declared in the parent class.\
    \ Next, let’s see what happens if we code a new version of the `displayHeading()`\
    \ method inside the child class. To do that, add the following method to the `AwardWinningMovie`\
    \ class:\n\n```php\npublic function displayHeading($tag){\n    $baseMsg = parent::displayHeading($tag);\n\
    \    return $baseMsg.$this->award;\n}\n```\n\nHere, we declare a method with the\
    \ same name `displayHeading` and parameter list `($tag)` as the method in the\
    \ parent class. When that happens, we say that the child class method overrides\
    \ the parent class method. Within the child class method, we use the `parent`\
    \ keyword to call the parent class `displayHeading()` method. Whenever a child\
    \ class overrides a parent class method, we need to use the `parent` keyword (instead\
    \ of the `$this` keyword) if we want to access the parent class method inside\
    \ the child class.\n\nIf you load `chap10.php` again, you’ll see the text “Award\
    \ Winning Movies” displayed as an `<h1>` heading, followed by a line that says\
    \ “Best Picture”. This additional line illustrates that we are now accessing the\
    \ `displayHeading()` method in the child class. As `displayHeading()` has been\
    \ overridden in the child class, the child class method is called when we access\
    \ it using a child class object (`$awm`). If we want to access the `displayHeading()`\
    \ method in the parent class, we have to use a parent class object. For instance,\
    \ we can do it as follows:\n\n```php\n$mv = new Movie('A3244', 'Golden Rose',\
    \ 3.99);\necho $mv->displayHeading('H1');\n```\n\nIf you add the code above to\
    \ `chap10.php` and load the page, you’ll only get “Award Winning Movies” (without\
    \ “Best Picture”) added to the output. This illustrates that `$mv` is accessing\
    \ the `displayHeading()` method in the parent class.\n"
  raw: 'Chapter 10: Inheritance In the previous chapter, we covered the fundamentals
    of OOP. Some of the concepts in OOP can be confusing for beginners. If this is
    the first time you are exposed to OOP, you may want to read through the previous
    chapter more than once to fully grasp the concepts. Once you are comfortable with
    the topics covered in Chapter 9, we are ready to proceed to a more advanced, but
    equally important, concept in OOP - inheritance. As the name suggests, inheritance
    has to do with the relationship between two or more classes. With inheritance,
    classes can be declared such that one class is a child class (also known as a
    subclass) of another (known as the parent class or base class). This enables us
    to group related classes together. The easiest way to explain inheritance is to
    look at an example. 10.1 Writing the Child Classes We’ll use the Movie class in
    Chapter 9 as a parent class to illustrate. Open Brackets and create a new file
    called AwardWinningMovie.php . Save this file to your htdocs folder. Add the following
    code to AwardWinningMovie.php : <?php include "Movie.php"; class AwardWinningMovie
    extends Movie{ private $award; public function \_\_construct($pId, $pTitle, $pRentalPrice,
    $pAward){ parent::\_\_construct($pId, $pTitle, $pRentalPrice); $this->award =
    $pAward; } } In the code above, we first use the include statement to include
    the code for the Movie class. Next, we create a class called AwardWinningMovie
    . Notice a new keyword extends in the AwardWinningMovie class declaration? This
    keyword indicates that AwardWinningMovie is a child class of Movie . When one
    class is a child class of another, it inherits all the public and protected members
    of the parent class. In other words, it can access and use those members directly,
    as if they are part of its own code. We’ll illustrate what this means later. Within
    the AwardWinningMovie class, we declare a private property called $award . Next,
    we declare a constructor with 4 parameters, $pId , $pTitle , $pRentalPrice and
    $pAward . Within the constructor, notice a new keyword, parent ? As you may have
    guessed, this keyword is used to call the parent class constructor. As the child
    class has its own constructor, we need to use the parent keyword and the :: operator
    when we want to access the parent class constructor. When we call the parent class
    constructor, we do not create a new object. Instead, we use the name of the constructor
    ( \_\_construct() ). In our example, we pass the values of $pId , $pTitle and
    $pRentalPrice as arguments to the parent class constructor. These values will
    be used to initialize the $id , $title and $rentalPrice properties declared in
    the parent class respectively. As these properties were declared as private in
    the parent class, we are not allowed to access them directly in the child class.
    Instead, we can only initialize them using the parent class constructor, which
    is a public method. Next, we have the statement $this->award = $pAward; This statement
    is used to initialize the $award property declared in the child class. With that,
    the child class constructor is complete. Now, let’s add another method to the
    child class. Add the code below to the AwardWinningMovie class, after the \_\_construct()
    method but before the closing brace of the class: public function recommend($country){
    switch ($this->award){ case ''Best Picture'': $others = ''The Rail''; break; case
    ''Best Actor'': $others = ''1729''; break; default: $others = ''And so it begins'';
    } return ''You might also like:<BR>''. ''<BR>Movie Title = ''.$others. ''<BR>Rental
    Price = ''.$this->conversion($country) ; } Here, we declare a method called recommend()
    that has one parameter - $country . Within the method, we use a switch statement
    to assign different values to the local variable $others , depending on the value
    of $this->award . Next, we return a string recommending a new movie to users.
    This string should be quite self-explanatory, except for the last part where we
    use the $this keyword to call the conversion() method (refer to the underlined
    code above) . Recall that we do not have a conversion() method in the AwardWinningMovie
    class? Will we get an error when we try to call this method? The answer is no.
    This is because the AwardWinningMovie class is a subclass of the Movie class.
    Hence, it can access all the public and protected members of the parent class
    directly, as if they are part of its own code. As the parent class - Movie \-
    has a public method called conversion() , the child class can access this method
    simply by using the $this keyword. Got it? This is one of the main reasons for
    using inheritance; it allows us to reuse existing code. In our example, the AwardWinningMovie
    class can use the conversion() method directly without having to code it itself.
    10.2 Creating a Child Class Object We are now ready to create a child class object.
    To do that, create a new file in Brackets and save it as chap10.php to the htdocs
    folder. Add the following code to it: <?php include ''AwardWinningMovie.php'';
    $awm = new AwardWinningMovie(''A12324'', ''Max'', 6.99, ''Best Picture''); echo
    $awm->recommend(''Japan''); Here, we first use the include statement to include
    the AwardWinningMovie class. Next, we use the new keyword to create an AwardWinningMovie
    object, passing ''A12324'' , ''Max'' , 6.99 and ''Best Picture'' as arguments
    to the constructor. Finally, after creating the $awm object, we use it to call
    the recommend() method. If you run the code above, you’ll get You might also like:
    Movie Title = The Rail Rental Price = 768.9 as the output. Straightforward? 10.3
    Access Modifiers Revisited Good! Let’s revisit the concept of access modifiers
    now. Previously, we mentioned that when one class extends another, it inherits
    all the public and protected class members of the class it extends. What this
    means is that it can access those members directly without any restrictions. However,
    the same does not apply to private class members. Child classes are not allowed
    to access private members of the parent class directly. To understand what this
    means, try changing the conversion() method in the Movie class to a private method.
    In other words, change the line public function conversion($country) in Movie.php
    to private function conversion($country) Next, load chap10.php again. What do
    you get? You get an error message similar to the output below, right? Fatal error:
    Uncaught Error: Call to private method Movie::conversion() from context ''AwardWinningMovie''...
    This is because when conversion() is a private method, we are not allowed to access
    it directly outside the class in which it is defined (i.e., outside the Movie
    class). Hence, the recommend() method in the AwardWinningMovie class is not allowed
    to access it. Next, change conversion() to a protected method and load chap10.php
    again. Everything works now, right? This is because child classes are allowed
    to access protected members in their parent class directly. Hence, the recommend()
    method in the AwardWinningMovie class is now allowed to access the conversion()
    method in the Movie class. Got it? Great! After changing conversion() to a protected
    method, note that we are only allowed to access it directly inside the class in
    which it is declared and any subclass that inherits from that class. In other
    words, we can only access it directly inside the Movie and AwardWinningMovie classes.
    Recall that previously, we accessed the method in chap9.php ? This was all right
    when conversion() was a public method. Now that it is a protected method, you’ll
    get an error if you load chap9.php again. If you want to access the conversion()
    method in chap9.php directly, you have to change it back to a public method. 10.4
    Overriding Now that you are familiar with child classes and inheritance, let’s
    move on to discuss the concept of overriding. Overriding occurs when a child class
    modifies the methods it inherits from its parent class. To illustrate what this
    means, add the following line to chap10.php and load the page. echo $awm->displayHeading(''H1'');
    You’ll get the text “Award Winning Movies” displayed as a <H1> heading. Here,
    we are calling the displayHeading() method declared in the parent class. This
    method is a public method inherited by the child class. Hence, we can access it
    using an AwardWinningMovie object. Next, let’s see what happens if we code a new
    version of the displayHeading() method inside the child class itself. To do that,
    add the following method to the AwardWinningMovie class, after the recommend()
    method but before the closing brace of the class: public function displayHeading($tag){
    $baseMsg = parent::displayHeading($tag); return $baseMsg.$this->award; } Here,
    we declare a method with the same name ( displayHeading ) and parameter list (
    $tag ) as the method in the parent class. When that happens, we say that the child
    class method overrides the parent class method. Within the child class method,
    we use the parent keyword to call the parent class displayHeading() method. Whenever
    a child class overrides a parent class method, we need to use the parent keyword
    (instead of the $this keyword) if we want to access the parent class method inside
    the child class. Next, we assign the result returned by the parent class method
    to a variable called $baseMsg . Finally, we concatenate $baseMsg with the $award
    property in the child class and return the result. If you load chap10.php again,
    you’ll see the text “Award Winning Movies” displayed as a <H1> heading, followed
    by a line that says “Best Picture”. This additional line illustrates that we are
    now accessing the displayHeading() method in the child class. As displayHeading()
    has been overridden in the child class, the child class method is called when
    we access it using a child class object ( $awm ). If we want to access the displayHeading()
    method in the parent class, we have to use a parent class object. For instance,
    we can do it as follows: $mv = new Movie(''A3244'', ''Golden Rose'', 3.99); echo
    $mv->displayHeading(''H1''); If you add the code above to chap10.php and load
    the page, you’ll only get “Award Winning Movies” (without “Best Picture”) added
    to the output. This illustrates that $mv is accessing the displayHeading() method
    in the parent class. '
