    you want another PHP script to use the same timezone, you have to set it in that
    script too. 5.3 Arrays Great! Now that we are familiar with strings and dates,
    let’s move on to another commonly used data type in PHP - arrays. An array is
    a special data type that allows us to store related values together as a single
    variable. For instance, suppose you want to store the test scores of 5 students.
    Instead of storing them as $marks1 , $marks2 , $marks3 , $marks4 and $marks5 ,
    you can store them as an array. 5.3.1 Creating an Array There are a few ways to
