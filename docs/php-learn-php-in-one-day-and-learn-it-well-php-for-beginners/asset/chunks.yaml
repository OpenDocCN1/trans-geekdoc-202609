    # Chapter 11: Interacting with a Database\n\nIn this chapter, let’s move on to\
    \ talk about databases. Whenever we work with websites, it is highly likely that\
    \ we need to store information (such as data entered by users) in a database.\
    \ This chapter assumes that you are familiar with `MySQL`. If you are not, I strongly\
    \ recommend that you check out my other book, “[Learn SQL (using MySQL) in One\
    \ Day and Learn it Well](https://www.amazon.com/dp/B07K374J19) ” before proceeding.\
    \ If you are familiar with `MySQL`, let’s proceed.\n\n## 11.1 The PDO library\n\
    \nTo use a database in our PHP programs, we can use one of two built-in libraries.\
    \ A library is a collection of code that other developers have written and made\
    \ available for us to use in our own programs. The two libraries available for\
    \ connecting to a database in PHP are the `MySQLi` and `PDO` libraries. Both essentially\
    \ do the same job, connecting to the database and sending queries to it. However,\
    \ there are some key differences between the two. The main difference is that\
    \ we can use the `PDO` library to connect to 12 different types of database servers\
    \ - such as a `MySQL` server, an `Oracle` server, or a `Microsoft SQL Server`.\
    \ In contrast, the `MySQLi` library only works with `MySQL` database servers.\
    \ For this reason, we’ll use the `PDO` library in this book.\n\n## 11.2 Connecting\
    \ to the Database\n\nTo send queries to our database using `PDO`, we need to connect\
    \ to it first. To do that, we need four pieces of information - the hostname of\
    \ the server, the name of the database, the username of the account authorized\
    \ to access that database and the password. In most cases, the hostname is simply\
    \ “localhost”. To get the other three pieces of information, you need to contact\
    \ your database administrator. For the examples in this book, we’ll be our own\
    \ database administrator and create a database and user account using `phpMyAdmin`\
    \ in `XAMPP` later.\n\nFor now, let’s suppose you have a database called “pawszone”\
    \ and a user account with username `pz_admin` and password “ABCD”. In the following\
    \ sections, we’ll first cover various concepts you need to know to work with `PDO`.\
    \ After covering the concepts, we’ll get some hands-on practice with a PHP script\
    \ that shows how the concepts can be applied. Ready? Let’s learn to connect to\
    \ our database first.\n\n`PDO` uses an object-oriented approach. To connect to\
    \ our database, we create a `PDO` object. For instance, to connect to the “pawszone”\
    \ database, we use the code below:\n\n```php\n$pdo = new PDO(\"mysql:host=localhost;dbname=pawszone\"\
    , \"pz_admin\", \"ABCD\");\n$pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
    ```\n\nOn the first line, we create a `PDO` object by passing three arguments\
    \ to the `PDO` constructor. The first argument is a string indicating the type\
    \ of database we are using (`mysql:` in our case), the hostname of the server\
    \ (`host=localhost`), and the name of the database (`dbname=pawszone`). The second\
    \ argument is the username (`pz_admin`) and the third is the password (`ABCD`).\
    \ After creating this object, we assign it to a variable called `$pdo` and use\
    \ `$pdo` to call the `setAttribute()` method on the next line.\n\nThe `setAttribute()`\
    \ method allows us to set the attributes of a `PDO` object. Here, we are trying\
    \ to set the error mode. By default, after establishing a successful connection,\
    \ `PDO` does not inform us of anything that goes wrong subsequently. For instance,\
    \ if we try to select data from a table that does not exist, `PDO` will not inform\
    \ us that there’s no such table. Instead, we’ll get a page with no results. This\
    \ is very frustrating if we are trying to figure out what is wrong.\n\nTo get\
    \ `PDO` to inform us of any issues, we need to use the `setAttribute()` method\
    \ to configure the error mode. To do that, we pass two predefined constants to\
    \ the method. The first constant tells `PDO` the attribute we want to set, and\
    \ the second tells `PDO` the value we want to set it to. You can find the list\
    \ of all predefined `PDO` constants at [https://www.php.net/manual/en/pdo.constants.php](https://www.php.net/manual/en/pdo.constants.php).\n\
    \nIn our example, we want to set the error mode attribute (`PDO::ATTR_ERRMODE`)\
    \ to `PDO::ERRMODE_EXCEPTION`. In this mode, `PDO` throws an exception when something\
    \ goes wrong. We’ll learn more about exceptions in the next chapter. For now,\
    \ just know that we can use the information in this exception to figure out what\
    \ went wrong. That’s it! That’s all that’s needed to connect to a database. After\
    \ connecting to our database, we are ready to send queries to it.\n\n## 11.3 SQL\
    \ Injection\n\nThere are two main types of queries in `MySQL` - ones that return\
    \ data from the database (e.g., `SELECT`) and ones that don’t (e.g., `CREATE`,\
    \ `INSERT`, `UPDATE` and `DELETE`). The easiest way to send queries that do not\
    \ return data is to use the `exec()` method, while the easiest way to send queries\
    \ that is is to use the `query()` method. However, both methods put us at risk\
    \ of a form of attack known as an SQL injection.\n\nRecall that we talked about\
    \ cross-site scripting in Chapter 8.1.6? SQL injection is similar to that in that\
    \ hackers can input data into our website and use it to hack our database. Suppose\
    \ we have a text field called “ownerName” and we want to select rows from a table\
    \ called “pets” in our database, we can use the code below:\n\n```php\n$owner\
    \ = $_POST['ownerName'];\n$sql = \"SELECT * FROM pets WHERE owner = '$owner'\"\
    ;\n$stmt = $pdo->query($sql);\n```\n\nDon’t worry if the code above does not make\
    \ sense yet. We’ll discuss a better method later. For now, just know that in the\
    \ code above, we use the user input `$_POST['ownerName']` in our SQL statement\
    \ and execute the statement. If our user enters Jamie into the “ownerName” field,\
    \ the SQL statement becomes `SELECT * FROM pets WHERE owner = 'Jamie'` and everything\
    \ works. However, suppose the user enters `Jamie' OR owner != 'Jamie` into the\
    \ text field instead, the SQL statement becomes `SELECT * FROM pets WHERE owner\
    \ = 'Jamie' OR owner != 'Jamie'`. When we use the `query()` method to execute\
    \ this statement, PHP interprets the word “OR” in user input as the SQL operator.\
    \ Hence, it returns ALL rows from the “pets” table, since `owner = 'Jamie' OR\
    \ owner != 'Jamie'` covers all possible values for the “owner” column. This is\
    \ definitely not desirable. Instead of using `query()` or `exec()` method to execute\
    \ SQL statements, a better way is to use prepared statements.\n\n## 11.4 Prepared\
    \ Statements\n\nThere are a few steps involved when using prepared statements:\n\
    1) Create the SQL statement using placeholders\n2) Prepare the statement\n3) Bind\
    \ variables or values to the placeholders\n4) Execute the statement\n5) Fetch\
    \ any data if necessary\n\n### Step 1: Creating the SQL statement using placeholders\n\
    Using prepared statements, we need to use placeholders to replace any variables\
    \ that contain user inputs in our SQL statements. These placeholders can be either\
    \ named or unnamed. An unnamed placeholder is represented by a question mark.\
    \ For instance, if we want to select information from the “pets” table using user\
    \ inputs for two columns “owner” and “petname”, we can use the SQL statement:\n\
    \n```php\n$sqlUnnamed = \"SELECT * FROM pets WHERE owner = ? AND petname = ?\"\
    ;\n```\n\nHere, we use question marks (`?`) to replace user inputs in our SQL\
    \ statement and assign the statement to a variable called `$sqlUnnamed`. Alternatively,\
    \ we can use named placeholders as shown below:\n\n```php\n$sqlNamed = \"SELECT\
    \ * FROM pets WHERE owner = :owner AND petname = :pname\";\n```\n\nHere, we use\
    \ `:owner` and `:pname` to replace user inputs and assign the statement to a variable\
    \ called `$sqlNamed`.\n\n### Step 2: Prepare the statement\nAfter creating the\
    \ statement, we need to prepare it. Preparing a statement means sending the statement\
    \ to your database server in advance, giving the server a chance to analyze, compile,\
    \ and optimize its plan for executing the query. The actual execution does not\
    \ happen at this step. To prepare the statements, we use the `prepare()` method.\
    \ This is a built-in method in the `PDO` class that prepares a SQL statement for\
    \ execution and returns a `PDOStatement` object. Suppose we have a `PDO` object\
    \ called `$pdo`, to prepare the `$sqlUnnamed` statement, we write:\n\n```php\n\
    $preparedUnnamed = $pdo->prepare($sqlUnnamed);\n```\n\nHere, we use `$pdo` to\
    \ call the `prepare()` method and assign the object returned to a variable called\
    \ `$preparedUnnamed`. To prepare the `$sqlNamed` statement, we write:\n\n```php\n\
    $preparedNamed = $pdo->prepare($sqlNamed);\n```\n\nHere, we assign the object\
    \ returned to a variable called `$preparedNamed`. After preparing the statements,\
    \ we won’t be using the `$PDO` object anymore. Instead, we’ll be using the `PDOStatement`\
    \ objects (i.e., `$preparedUnnamed` and `$preparedNamed`) in subsequent steps.\n\
    \n### Step 3: Binding values to the placeholders\nIn step 3, we need to bind values\
    \ to the placeholders in our SQL statements. This tells the database server what\
    \ values to replace the placeholders with when executing the statements. We can\
    \ use either `bindValue()` or `bindParam()` method to bind values to placeholders.\
    \ Both methods are similar, but `bindValue()` tends to be more versatile. We’ll\
    \ be using the `bindValue()` method in the examples follow.\n\nTo bind values\
    \ to unnamed placeholders, we typically provide two pieces of information to the\
    \ `bindValue()` method: the position of the placeholder and the value to bind.\
    \ The positions of placeholders start from 1. Recall that we have a `SELECT` statement\
    \ named `$sqlUnnamed` defined and prepared as follows:\n\n```php\n$sqlUnnamed\
    \ = \"SELECT * FROM pets WHERE owner = ? AND petname = ?\";\n$preparedUnnamed\
    \ = $pdo->prepare($sqlUnnamed);\n```\n\nSuppose we want to bind a user input called\
    \ `$myPet` to the second question mark in `$sqlUnnamed`, this is how we can do\
    \ it:\n\n```php\n$preparedUnnamed->bindValue(2, $myPet);\n```\n\nHere, we use\
    \ `$preparedUnnamed` to call the `bindValue()` method. The first argument (`2`)\
    \ indicates that we are binding a value to the second placeholder (i.e., the placeholder\
    \ for the “petname” column) while the second argument (`$myPet`) indicates the\
    \ value to bind.\n\nTo bind values to named placeholders, we replace the first\
    \ argument with the name of the placeholder, enclosed in quotation marks. For\
    \ instance, if we want to bind `$myPet` to the `:pname` placeholder in `$sqlNamed`,\
    \ we do it as follows:\n\n```php\n$preparedNamed->bindValue(':pname', $myPet);\n\
    ```\n\nThe first argument (`':pname'`) indicates that we are binding a value to\
    \ the `:pname` placeholder while the second (`$myPet`) indicates the value to\
    \ bind. At this point, some of you may wonder if `$myPet` (which stores a user\
    \ input) puts us at risk of an SQL injection attack. The answer is no. This is\
    \ because `PDO` knows that we’re sending it the value for a placeholder; hence,\
    \ it’ll not interpret any part of the string stored in `$myPet` as SQL code. For\
    \ instance, even if `$myPet` stores the string `Max' OR petname != 'Max`, the\
    \ word “OR”, the quotation marks and the `!=` operator will not be interpreted\
    \ as SQL code. Instead, `PDO` considers the entire string to be the value for\
    \ the “petname” column and simply searches for pets with that weird name.\n\n\
    ### Step 4: Execute the statement\nAfter binding values to placeholders, we need\
    \ to use the `PDOStatement` object to call the `execute()` method. To execute\
    \ `$preparedUnnamed`, we write:\n\n```php\n$preparedUnnamed->execute();\n```\n\
    \nTo execute `$preparedNamed`, we write:\n\n```php\n$preparedNamed->execute();\n\
    ```\n\n### Step 5: Fetch the data returned, if any\nAfter executing the statement,\
    \ we can use either `fetch()` or `fetchAll()` method to fetch any data returned\
    \ (if the statement is a `SELECT` statement). The `fetch()` method fetches the\
    \ rows one by one while `fetchAll()` method fetches all rows at once. Both methods\
    \ return false on failure. When using either method, we can specify the style\
    \ we want to use when fetching the rows. Commonly used styles include `FETCH_ASSOC`\
    \ and `FETCH_NUM`. The `FETCH_ASSOC` style fetches the rows as an associative\
    \ array (using column names in the table as keys) while `FETCH_NUM` style fetches\
    \ them as an indexed array (based on the order of columns returned by the `SELECT`\
    \ statement).\n\nFor instance, to fetch the rows for `$sqlUnnamed`, we can use\
    \ the following `while` loop:\n\n```php\nwhile($row = $preparedUnnamed->fetch(PDO::FETCH_NUM)){\n\
    \    echo 'Pet = '.$row[1];\n    echo 'Owner = '.$row[0];\n}\n```\n\nThis loop\
    \ uses the assignment `$row = $preparedUnnamed->fetch(PDO::FETCH_NUM)` as the\
    \ condition for looping. This is permissible and is a common approach when working\
