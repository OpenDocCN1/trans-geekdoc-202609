    in strings start from 0, not 1. For instance, if we have a string ''ABCDEF'' ,
    ''A'' is at position 0, ''B'' is at position 1 and so on. Positions can also be
    negative. If it is negative, it is counted from the back of the string. In ''ABCDEF''
    , ''F'' is at position -1, ''E'' is at position -2 etc. Example: $str7 = ''ABCDEF'';
    echo substr($str7, 2).''<BR>''; echo substr($str7, -3).''<BR>''; echo substr($str7,
    2, 1); Output: CDEF DEF C Here, we declare a variable called $str7 and assign
    the string ''ABCDEF'' to it. Next, we pass $str7 to substr() thrice to extract
