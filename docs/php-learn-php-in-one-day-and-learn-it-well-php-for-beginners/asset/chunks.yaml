    \ you’ll get the following output:\n\n```text\nOppsss... An error occurred.\n\
    Undefined variable: a\nScript is not terminated\n```\n\nThe error handler is first\
    \ executed to give us a custom message when we try to access an undefined variable.\
    \ After that, the script continues and the second `echo` statement is executed.\
    \ The error handler replaces the default PHP handler and gives us a convenient\
    \ way to modify messages displayed to users. However, it is unable to handle all\
    \ errors. For instance, fatal errors lead to script termination. To handle these\
    \ errors, we need another built-in function called `register_shutdown_function()`.\
    \ This function tells PHP which function to run when a script is about to be terminated.\
