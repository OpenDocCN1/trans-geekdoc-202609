    VARCHAR(20), PRIMARY KEY(owner, petname))"; $stmt = $pdo->prepare($sql); $stmt->execute();
    //SECTION C - INSERT DATA $sql = "INSERT INTO pets (owner, petname, breed) VALUES
    (:owner, :petname, :breed)"; $stmt = $pdo->prepare($sql); $owner = array(''Ted'',
    ''Jamie'', ''En'', ''En''); $pname = array(''Angel'', ''Max'', ''Boots'', ''Dora'');
    $breed = array(''Labradoodle'', ''Domestic Shorthair'', ''Domestic Shorthair'',
    ''Munchkin''); for ($i = 0; $i < 4; ++$i) { $stmt->bindValue('':owner'', $owner\[$i\]);
    $stmt->bindValue('':petname'', $pname\[$i\]); $stmt->bindValue('':breed'', $breed\[$i\]);
    $stmt->execute(); } //SECTION D - UPDATE DATA $sql = "UPDATE pets SET microchip
    = :micro WHERE owner = :owner AND petname = :petname"; $stmt = $pdo->prepare($sql);
    $stmt->bindValue('':micro'', ''121342345''); $stmt->bindValue('':owner'', ''Jamie'');
    $stmt->bindValue('':petname'', ''Max''); $stmt->execute(); //SECTION E - DELETE
    DATA $sql = "DELETE FROM pets WHERE owner = :owner AND petname = :petname"; $stmt
    = $pdo->prepare($sql); $stmt->bindValue('':owner'', ''Ted''); $stmt->bindValue('':petname'',
    ''Angel''); $stmt->execute(); In the code above, we first connect to the “pawszone”
    database in Section A. Next, in Section B, we use a SQL CREATE statement to create
    a table called “pets” in our database. As this SQL statement does not have any
    placeholder, we do not need to call the bindValue() method. Instead, we simply
    prepare the statement and execute it. In Section C, we have an INSERT statement
    for inserting data into the “pets” table. We first use the prepare() method to
    prepare this statement. Although we’ll be executing the INSERT statement four
    times using a for loop later, note that we only need to prepare the statement
    once. This is another advantage of using prepared statements as it can result
    in faster execution, especially if the query is complex or needs to be run many
    times. After preparing the statement, we declare three arrays - $owner , $pname
    and $breed \- and assign the data to be inserted to these arrays. Next, we use
    a for loop to loop through the arrays. Each time the loop runs, we bind one value
    in each array to the relevant placeholder. After binding the data, we call the
    execute() method to execute the INSERT statement. After inserting the data in
    Section C, we update a row (where owner = “Jamie” and petname = “Max”) in Sections
    D and delete another (where owner = “Ted” and petname = “Angel”) in Section E.
    These two sections should be quite self-explanatory. Read through the code above
    carefully and fully understand it before proceeding. Once you are clear on how
    prepared statements work, load the page sql\_cud.php in your browser to run the
    code. Next, head over to [http://localhost/phpmyadmin/](http://localhost/phpmyadmin/)
    and select the “pawszone” database on the left. You should see the “pets” table
    listed on the right. Click on “Browse” and you’ll get the following table: ![](image_rsrc3AU.jpg)As
    you can see, the “pets” table has been successfully created and data has been
    added to it. Got it? Next, let’s learn to select data from this table and display
    it on our web page using PHP. To do that, create a new file called sql\_select.php
    and add the following code to it. <?php //Section A - Connecting to the database
    $pdo = new PDO("mysql:host=localhost;dbname=pawszone", "pz\_admin", "ABCD"); $pdo->setAttribute(PDO::ATTR\_ERRMODE,
    PDO::ERRMODE\_EXCEPTION); //Section B - SELECT all rows from pets $sql = "SELECT
    petname, owner FROM pets"; $stmt = $pdo->prepare($sql); $stmt->execute(); while
    ($row = $stmt->fetch(PDO::FETCH\_ASSOC)){ echo ''<BR>Owner = ''.$row\[''owner''\].''<BR>'';
    echo ''Pet Name = ''.$row\[''petname''\].''<BR>''; } $stmt->execute(); while ($row
    = $stmt->fetch(PDO::FETCH\_NUM)){ echo ''<BR>Owner = ''.$row\[1\].''<BR>''; echo
    ''Pet Name = ''.$row\[0\].''<BR>''; } Here, as before, we first connect to the
    “pawszone” database in Section A. Next, in Section B, we use a SELECT statement
    to select the “petname” and “owner” columns from the “pets” table. After executing
    the statement, we use a while loop to fetch the rows one by one, using the FETCH\_ASSOC
    style. Finally, we use echo statements inside the while loop to display the data
    fetched. Next, we execute the SELECT statement again and use another while loop
    to fetch the rows using the FETCH\_NUM style. If you load sql\_select.php in your
    browser, you’ll get the following output displayed twice : Owner = En Pet Name
    = Boots Owner = En Pet Name = Dora Owner = Jamie Pet Name = Max '
