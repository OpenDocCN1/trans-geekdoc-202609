    an object of the respective exception class. Inside our catch blocks, we use $e
    to call the built-in getMessage() method and use an echo statement to echo the
    error message. If we run the code above, we’ll get the following output: Unable
    to connect SQLSTATE\[HY000\] \[1045\] Access denied for user ''wrongadmin''@''localhost''
    (using password: YES) The finally block is always executed After connecting The
    first line of output is from the catch(PDOException $e) block. As PHP is unable
    to connect to the database in connect.php , it throws a PDO exception. The second
    line is from the finally block. This block is executed regardless of whether the
