    \ ...errorHandling.php:27\nStack trace:\n#0 {main} thrown in ...errorHandling.php\
    \ on line 27\n```\n\nThe “Fatal error” message is displayed only when display\\\
    _errors is set to On ('1') . If you turn display\\_errors to Off ('0'), only the\
    \ last line is displayed. This line is generated by our shutdown function. Got\
    \ it?\n\n## 12.3 Putting it Together\n\nIn the previous sections, we talked about\
    \ exceptions and errors and how to handle them separately. In this section, let’s\
    \ consolidate everything into a single file. To do that, create a file called\
    \ `debugging.php` in `htdocs` folder. Inside this file, we need to first create\
    \ a function called `myDebugger()`; this function serves as the main function\
    \ for handling any uncaught exception or error later. To create the function,\
    \ add the following code to `debugging.php`:\n\n```php\nfunction myDebugger($msg,\
    \ $file, $line, $trace = ''){\n    $message = $trace.'<BR><BR><strong>'.$msg.'strong>\
    \ found on line '.$line.' in file '.$file.'</u>';\n    if (ini_get('display_errors'))\
    \ {\n        echo $message;\n    } else {\n        error_log($message);\n    \
    \    header('Location: error.html');\n    }\n}\n```\n\nHere, we define a function\
    \ called `myDebugger()` with four parameters - `$msg`, `$file`, `$line` and `$trace`.\
    \ The first three parameters are for storing the message, file name and line number\
    \ of an error or exception respectively. The last parameter is for storing the\
    \ stack trace of an exception. All four pieces of information will be provided\
    \ by PHP when an error occurs. Within the function, we concatenate the four parameters\
    \ and format the resulting string using HTML, before assigning it to a variable\
    \ called `$message`. Next, we use an `if` statement to determine what gets displayed\
    \ on our browser. To do that, we use a built-in function called `ini_get()` to\
    \ get the setting for `display_errors`. When `display_errors` is set to On (or\
    \ '1'), the `if` condition evaluates to true and we use an `echo` statement to\
    \ display the error message on our browser. Else, we use another built-in function\
    \ called `error_log()` to log `$message` to our error log file. The error log\
    \ file is a text file that contains all the messages we write to it using the\
    \ `error_log()` function. You can find where the error log file is located on\
    \ your system by searching for “error\\_log” (without quotes) in the PHP information\
    \ page, which can be found at [http://localhost/dashboard/phpinfo.php](http://localhost/dashboard/phpinfo.php).\
    \ If you are using Windows, the log file should be stored in the `C:\\xampp\\\
    php\\logs` folder. However, weirdly, this folder may not exist and you may have\
    \ to create it yourself. To do that, simply navigate to `C:\\xampp\\php` and create\
    \ a logs folder. When an error occurs, PHP will automatically create the log file\
    \ when the `error_log() ` function is called. After logging our error message,\
    \ we use the `header()` function to redirect users to another page called `error.html`\
    \ (which we need to create separately). With that, the `myDebugger()` function\
    \ is complete. Next, we need to create an exception handler, an error handler\
    \ and a shutdown function. Inside all three functions, we need to call the `myDebugger()`\
    \ function. To do that, add the following code to `debugging.php`:\n\n```php\n\
    function myExceptionHandler ($e) {\n    myDebugger($e->getMessage(), $e->getFile(),\
    \ $e->getLine(), $e->getTraceAsString());\n}\nfunction myErrorHandler($errno,\
    \ $errstr, $errfile, $line) {\n    myDebugger($errstr, $errfile, $line);\n}\n\
    function myDownHandler(){\n    $lastError = error_get_last();\n    if (isset($lastError))\
    \ {\n        myDebugger($lastError['message'], $lastError['file'], $lastError['line']);\n\
    \    }\n}\n```\n\nThe first function - `myExceptionHandler()` - has a parameter\
    \ `$e` that is used to store an uncaught exception object. Inside the function,\
    \ we use `$e` to call the `getMessage()`, `getFile()`, `getLine()` and `getTraceAsString()`\
    \ methods and pass the results as arguments to the `myDebugger()` function. Next,\
    \ we have the `myErrorHandler()` function. This function has four parameters -\
    \ `$errno`, `$errstr`, `$errfile` and `$line`. Inside the function, we pass `$errstr`,\
    \ `$errfile` and `$line` as arguments to the `myDebugger()` function. Last but\
    \ not least, we have the `myDownHandler()` function. Inside this function, we\
    \ check if the termination is due to an error. If it is, we pass the elements\
    \ in the associative array returned by `error_get_last()` as arguments to the\
    \ `myDebugger()` function. After coding these three functions, we need to set\
    \ them as our custom handlers and shutdown function. To do that, add the following\
    \ lines to `debugging.php`:\n\n```php\nset_exception_handler('myExceptionHandler');\n\
    set_error_handler('myErrorHandler');\nregister_shutdown_function('myDownHandler');\n\
    ```\n\nWith that, the `debugging.php` file is complete; we’ll be using it in our\
    \ project later. In PHP, there are many different approaches to dealing with exceptions\
    \ and errors, debugging.php demonstrates one of the many techniques. Regardless\
    \ of whether an error or an uncaught exception occurs on our site, this file uses\
    \ one of the custom handlers or the shutdown function to call the `myDebugger()`\
    \ function. This function displays an error message on the browser when display\\\
    _errors is set to On or '1' . Else, it logs the error message and redirects users\
    \ to a custom error page called `error.html` .\n"
