    not displaying any error message may not be the best approach. For instance, if
    a fatal error occurs on our site, the site will just fail to load without any
    information. This can be frustrating for the user. Instead of leaving users entirely
    in the dark when something goes wrong, we can provide them with a “user-friendly”
    error message. To do that, we need to create a custom error handler. A custom
    error handler allows us to handle the PHP errors ourselves, instead of relying
    on the default error handler in PHP. We can use this custom handler to display
    a custom message to users when something goes wrong. To see how this works, create
    a new file in Brackets and save it as errorHandling.php to the htdocs folder.
    Add the following code to it: <?php function myErrorHandler($errno, $errstr, $errfile,
    $errline) { echo ''<BR>Oppsss... An error occurred.<BR>''.$errstr; } set\_error\_handler(''myErrorHandler'');
    In the code above, we first create a function called myErrorHandler() that has
    four parameters - $errno , $errstr , $errfile and $errline . The first two parameters
    are mandatory for a function to “qualify” as a custom error handler, the last
    two are optional. These four parameters are used to store the error code, error
    message, file name in which the error occurred and the line number respectively.
    All four pieces of information are provided by PHP when an error occurs. Within
    the function, we use an echo statement to echo a custom error message to users.
    After coding the function, we use a built-in function called set\_error\_handler()
    to set myErrorHandler() as the custom error handler. Got it? At this point, you’ll
    probably notice that this custom error handler is very similar to the custom exception
    handler we coded in Chapter 12.1.4. Indeed, the two are similar. However, while
    a custom exception handler handles uncaught exceptions, a custom error handler
    handles errors . In addition, a custom error handler does not result in script
    termination. To test the error handler above, add the following code to the end
    of errorHandling.php : echo $a; echo ''<BR>Script is not terminated''; If you
    run errorHandling.php now, you’ll get the following output: Oppsss... An error
    occurred. Undefined variable: a Script is not terminated The custom error handler
    is first executed to give us a custom error message when we try to access an undefined
    variable. After that, the script continues and the second echo statement is executed.
    The custom error handler replaces the default PHP error handler and gives us a
    convenient way to modify error messages displayed to users. However, it is unable
    to handle all errors. For instance, it is unable to handle fatal errors. These
    errors lead to script termination. To handle these errors, we need another built-in
    function called register\_shutdown\_function() . This function tells PHP which
    function to run when a script is about to be terminated. To see how this works,
    add the following code to the end of errorHandling.php : function myShutDownHandler(){
    $lastError = error\_get\_last(); if (isset($lastError)) { echo ''<BR>Oppsss...
    Script terminated.<BR>''; } } register\_shutdown\_function(''myShutDownHandler'');
    Here, we declare a function called myShutDownHandler() . Within the function,
    we need to determine whether the script termination is due to an error. To do
    that, we use the error\_get\_last() function. This function returns NULL if no
    error has occurred (for instance, if script termination is due to the user navigating
    to another page). On the other hand, if an error has occurred, it returns the
    last error as an associative array. The array contains four keys: type (which
    gives the error type), message (which gives the error message), file (which gives
    the file where the error occurred) and line (which gives the line where the error
    occurred). After calling the error\_get\_last() function, we use an if statement
    to check if an error has occurred. If it has, we echo a custom error message to
    users. After coding the myShutDownHandler() function, we use another built-in
    function called register\_shutdown\_function() to register it as the shutdown
    function. To test our shutdown function, add the following code to the end of
    errorHandling.php : hello(); Here, we try to call a non-existent function. If
    you load errorHandling.php now, you’ll get the error message below: Fatal error
    : Uncaught Error: Call to undefined function hello() in ...errorHandling.php:27
    Stack trace: #0 {main} thrown in ...errorHandling.php on line 27 Oppsss... Script
    terminated. The “Fatal error” message is displayed only when display\_errors is
    set to On (or ''1'' ). If you turn display\_errors to Off (or ''0'' ), only the
    last line is displayed. This line is generated by our shutdown function. Got it?
    12.3 Putting it All Together In the previous sections, we talked about exceptions
    and errors and how to handle them separately. In this section, let’s consolidate
    everything into a single file. To do that, create a file called debugging.php
    in your htdocs folder. Inside this file, we need to first create a function called
    myDebugger() ; this function serves as the main function for handling any uncaught
    exception or error later. To create the function, add the following code to debugging.php
    : function myDebugger($msg, $file, $line, $trace = ''''){ $message = $trace.''<BR><BR><strong>''.$msg.''</strong>
    found on <u>line ''.$line.''</u> in file <u>''.$file.''</u>''; if (ini\_get(''display\_errors''))
    { echo $message; } else { error\_log($message); header(''Location: error.html'');
    } } Here, we define a function called myDebugger() with four parameters - $msg
    , $file , $line and $trace . The first three parameters are for storing the message,
    file name and line number of an error or exception respectively. The last parameter
    is for storing the stack trace of an exception. All four pieces of information
    will be provided by PHP when an error or exception occurs. Within the function,
    we concatenate the four parameters and format the resulting string using HTML,
    before assigning it to a variable called $message . Next, we use an if statement
    to determine what gets displayed on our browser. To do that, we use a built-in
    function called ini\_get() to get the setting for ''display\_errors'' . When ''display\_errors''
    is set to On (or ''1'' ), the if condition evaluates to true and we use an echo
    statement to display the error message on our browser. Else, we use another built-in
    function called error\_log() to log $message to our error log file. The error
    log file is a text file that contains all the messages we write to it using the
    error\_log() function. You can find where the error log file is located on your
    system by searching for “error\_log” (without quotes) in the PHP information page,
    which can be found at [http://localhost/dashboard/phpinfo.php](http://localhost/dashboard/phpinfo.php)
    . If you are using Windows, the log file should be stored in the C:\\xampp\\php\\logs
    folder. However, weirdly, this folder may not exist and you may have to create
    it yourself. To do that, simply navigate to C:\\xampp\\php and create a logs folder.
    When an error occurs, PHP will automatically create the log file when the error\_log()
    function is called. After logging our error message, we use the header() function
    to redirect users to another page called error.html (which we need to create separately).
    With that, the myDebugger() function is complete. Next, we need to create an exception
    handler, an error handler and a shutdown function. Inside all three functions,
    we need to call the myDebugger() function. To do that, add the following code
    to debugging.php : function myExceptionHandler ($e) { myDebugger($e->getMessage(),
    $e->getFile(), $e->getLine(), $e->getTraceAsString()); } function myErrorHandler($errno,
    $errstr, $errfile, $errline) { myDebugger($errstr, $errfile, $errline); } function
    myShutDownHandler(){ $lastError = error\_get\_last(); if (isset($lastError)) {
    myDebugger($lastError\[''message''\], $lastError\[''file''\], $lastError\[''line''\]);
    } } The first function - myExceptionHandler() \- has a parameter called $e that
    is used to store an uncaught exception object. Inside the function, we use $e
    to call the built-in getMessage() , getFile() , getLine() and getTraceAsString()
    methods and pass the results as arguments to the myDebugger() function. Next,
    we have the myErrorHandler() function. This function has four parameters - $errno
    , $errstr , $errfile and $errline . Inside the function, we pass $errstr , $errfile
    and $errline as arguments to the myDebugger() function. Last but not least, we
    have the myShutDownHandler() function. Inside this function, we check if the shutdown
    is due to an error. If it is, we pass the elements in the associative array returned
    by error\_get\_last() as arguments to the myDebugger() function. After coding
    these three functions, we need to set them as our custom handlers and shutdown
    function. To do that, add the following lines to debugging.php : set\_exception\_handler(''myExceptionHandler'');
    set\_error\_handler(''myErrorHandler''); register\_shutdown\_function(''myShutDownHandler'');
    With that, the debugging.php file is complete; we’ll be using it in our project
    later. In PHP, there are many different approaches to dealing with exceptions
    and errors, debugging.php demonstrates one of the many techniques available. Regardless
    of whether an error or an uncaught exception occurs on our site, this file uses
    one of the custom handlers or the shutdown function to call the myDebugger() function.
    This function displays an error message on the browser when display\_errors is
    set to On or ''1'' . Else, it logs the error message and redirects users to a
    custom error page called error.html . Got it? '
  toc: []
  trans: "\n\n# 第 12 章：管理错误和异常\n\n我们已经到了项目开始前的最后一章了。在本章中，我们将学习如何在 PHP 脚本中管理错误和异常。坦率地说，这是\
    \ PHP 中最令人混乱的领域之一，因为 PHP 区分了异常（exception）和错误（error）。当出现问题时，我们会得到一个异常或一个错误。PHP\
    \ 内部函数在出现问题时主要向我们抛出错误信息。另一方面，现代的面向对象扩展（例如我们在上一节中学习的 `PDO` 扩展）更有可能使用异常。在本章中，我们将先分别讨论异常和错误，最后在最后一节中将所有内容整合到一个文件中。准备好了吗？让我们先来看看异常。\n\
    \n## 12.1 处理异常\n\n### 12.1.1 什么是异常？\n\n异常是 PHP 中的一个预定义对象，它允许我们在发生不理想的情况时更改脚本的执行流。例如，如果我们尝试连接数据库但连接失败了，我们可以使用异常来帮助我们处理这种情况。要查看异常是什么，请在\
    \ `htdocs` 中创建一个名为 `connect.php` 的文件并向其中添加以下代码：\n\n```php\n<?php\n$pdo = new PDO(\"\
    mysql:host=localhost;dbname=pawszone\", \"wrongadmin\", \"ABCD\");\n$pdo->setAttribute(PDO::ATTR_ERRMODE,\
    \ PDO::ERRMODE_EXCEPTION);\n```\n\n在这里，我们尝试使用无效的用户名（`wrongadmin`）连接到“pawszone”数据库。接下来，在\
    \ `htdocs` 中创建一个名为 `exceptionHandling.php` 的新文件并向其中添加以下代码：\n\n```php\n<?php include\
    \ \"connect.php\";\necho '<BR>Welcome to Pawszone';\n```\n\n在这里，我们使用 `include`\
    \ 语句来包含 `connect.php` 文件（其中包含无效代码），并使用 `echo` 语句在 `include` 之后输出文本“Welcome to\
    \ Pawszone”。在创建这两个文件后，尝试在浏览器中加载 `exceptionHandling.php`（确保 Apache 和 MySQL 正在运行），你得到了什么？你得到了一条与下方所示类似的消息，对吧？我对消息的部分部分进行了格式化处理并加了下划线，以便使其更易读。\n\
    \n```text\nFatal error : Uncaught PDOException : SQLSTATE[HY000] [1045] Access\
    \ denied for user 'wrongadmin'@'localhost' (using password: YES) in /opt/lampp/htdocs/connect.php:3\n\
    Stack trace:\n#0 /opt/lampp/htdocs/connect.php(3) : PDO->__construct('mysql:host=loca...',\
    \ 'wrongadmin', 'ABCD' )\n#1 /opt/lampp/htdocs/exceptionHandling.php(2) : include('/opt/lampp/htdo...')\n\
    #2 {main} thrown in /opt/lampp/htdocs/connect.php on line 3\n```\n\n这条消息告诉我们发生了一个\
    \ `PDO` 异常（`PDOException`）且未被捕获（即未被处理）。发生这个异常是因为我们在连接“pawszone”数据库时使用了无效的用户名。当异常发生且未被捕获时，PHP\
    \ 会显示与上方所示类似的消息。此输出包含了列出与异常相关的所有文件的堆栈跟踪（stack trace）。上面的跟踪告诉我们当前异常与 `connect.php`\
    \ 的第 3 行以及 `exceptionHandling.php` 的第 2 行有关。此外，数据库密码“ABCD”在跟踪中暴露了。注意到 `exceptionHandling.php`\
    \ 中的第二个语句（`echo '<BR>Welcome to Pawszone';`）没有执行吗？这是因为任何未被捕获的异常都会导致致命错误（fatal\
    \ error）；脚本在执行 `echo` 语句之前就会立即终止。如果我们不希望在异常发生时发生脚本终止（或显示上述消息），我们需要捕获该异常。\n\n###\
    \ 12.1.2 try-catch-finally\n\n为了捕获异常，我们使用 `try`、`catch` 和 `finally` 块。其语法如下：\n\
    \n```php\ntry {\n    //执行某些操作\n} catch (type of exception) {\n    // 当发生异常时执行其他操作\n\
    } finally {\n    // 无论 try 或 catch 块是否执行，都执行此操作\n}\n```\n\n`try` 块首先尝试执行一项任务。如果任务失败，将抛出一个异常。抛出异常仅意味着\
    \ PHP 将使用用于处理异常的预定义类之一来创建一个对象。这些类包括 `Exception`、`PDOException`、`DOMException`\
    \ 和 `OutOfBoundsException` 类。当异常发生时，PHP 会创建相关异常类的对象。该对象包含有关异常的信息，并可用于调用类中定义的各种方法。这些方法包括\
    \ `getMessage()`、`getFile()`、`getLine()` 和 `getTraceAsString()` 方法，它们分别为我们提供异常的消息、文件名、行号和堆栈跟踪。\n\
    \n在异常抛出后（即在 PHP 创建异常对象后），我们需要使用 `catch` 块来捕获它。我们可以定义多个 `catch` 块来处理不同类型的异常。在 `catch`\
    \ 块之后，我们有 `finally` 块。该块是可选的，无论 `try` 块成功还是失败，它总是会被执行。为了说明 `try`、`catch` 和 `finally`\
    \ 块的工作原理，请将 `exceptionHandling.php` 中的原始代码替换为以下代码：\n\n```php\n<?php\ntry{\n  \
    \  include \"connect.php\";\n}catch(PDOException $e){\n    echo '<BR>Unable to\
    \ connect '.$e->getMessage();\n}catch(Exception $e){\n    echo '<BR>Something\
    \ else'.$e->getMessage();\n}finally{\n    echo '<BR>The finally block is always\
    \ executed';\n}\necho '<BR>After connecting';\n```\n\n在这里，我们首先在 `try` 块中尝试连接“pawszone”数据库。如果无法连接，将抛出一个异常。其中一个\
    \ `catch` 块将被执行。在示例中，我们有两个 `catch` 块。第一个 `catch` 块捕获 `PDO` 异常（`PDOException`），第二个\
    \ `catch` 块捕获通用异常（`Exception`）。`PDOException` 是 无法执行任务时的预定义类。`Exception` 是所有异常类的父类，处理通用异常。在\
    \ `catch` 块内部，我们使用 `$e` 调用内置的 `getMessage()` 方法并使用 `echo` 语句输出。如果我们运行上述代码，将得到如下输出：\n\
    \n```text\nUnable to connect SQLSTATE[HY000] [1045] Access denied for user 'wrongadmin'@'localhost'\
    \ (using password: YES)\nThe finally block is always executed\nAfter connecting\n\
    ```\n\n输出的第一行来自 `catch(PDOException $e)` 块。由于 PHP 无法连接 `connect.php` 中的数据库，它抛出了\
    \ `PDO` 异常。第二行来自 `finally` 块。无论 `try` 块成功还是失败，该块都会执行。最后一行来自 `try-catch-finally`\
    \ 块之后的 `echo` 语句。这一行说明当异常发生并被捕获时，脚本继续执行。简单吧？很好！\n\n### 12.1.3 抛出异常\n\n接下来，让我们学习抛出自己的异常。在上面的部分，我们学习了捕获\
    \ PHP 抛出的异常。除了依赖 PHP 为我们抛出异常外，我们也可以抛出自己的异常。我们使用 `throw` 关键字来实现。让我们来看示例。在 `exceptionHandling.php`\
    \ 的 `echo '<BR>After connecting';` 语句之后添加以下函数：\n\n```php\nfunction displayUserInput($userInput){\n\
    \    if ($userInput > 100) {\n        throw new OutOfRangeException('<BR>User\
    \ input is too big');\n    }else {\n        echo '<BR>'.$userInput;\n    }\n}\n\
    ```在这里，我们定义了一个名为 `displayUserInput()` 的函数，它有一个参数 `$userInput`。如果 `$userInput`\
    \ 大于 100，我们使用 `throw` 关键字抛出一个 `OutOfRangeException` 异常。`OutOfRangeException` 是继承自\
    \ `Exception` 的预定义类。抛出 `OutOfRangeException` 异常涉及创建该类的新对象。创建新的 `OutOfRangeException`\
    \ 对象时，我们可以向构造函数传递几个可选参数。我们通常传递错误消息。在示例中，我们向构造函数传递字符串 `'<BR>User input is too big'`。\n\
    \n```php\ntry {\n    displayUserInput(105);\n} catch (OutOfRangeException $e)\
    \ {\n    echo $e->getMessage();\n}\n```在 `try` 块中，由于，会抛出一个 `OutOfRangeException`\
    \ 异常，这被 `catch` 块捕获。在 `catch` 块内部，我们使用 `getMessage()` 方法获取错误消息。如果我们运行上述代码，我们将得到输出“User\
    \ input is too big”。如果我们将函数调用改为 `displayUserInput(16);`，则不会抛出异常，我们将得到输出“16”。明白了吗？太棒了！\n\
    \n### 12.1.4 异常处理器\n\n在之前的章节，我们学习了抛出和捕获异常。某些异常（例如 `PDO` 异常）很容易预处理。其他的可能更难。在大多数情况下，尽管我们尽了努力，仍会有无法预料的异常。在这种情况下，PHP\
    \ 允许我们指定一个自定义处理器，每当发生无法捕获的异常时就会被调用。我们可以使用这个自定义处理器向用户显示自定义消息。然而，在调用异常处理器后，PHP 脚本将终止。要查看异常处理器是如何工作的，请在\
    \ `exceptionHandling.php` 末尾添加以下代码：\n\n```php\nfunction myExceptionHandler($e)\
    \ {\n    echo '<BR>Oppsss... An uncaught exception occurred.<BR>'.$e->getMessage();\n\
    }\nset_exception_handler('myExceptionHandler');\n```在这里，我们定义了一个名为 `myExceptionHandler()`\
    \ 的函数作为异常处理器。函数若要成为异常处理器，需要一个参数来存储未捕获的异常对象。该参数在示例中是 `$e`。在函数内部，我们使用 `$e` 调用 `getMessage()`\
    \ 方法并使用 `echo` 语句输出消息。编写函数后，我们需要使用一个名为 `set_exception_handler()` 的内置函数将 `myExceptionHandler()`\
    \ 设置为异常处理器。为了测试我们的异常处理器，在 `exceptionHandling.php` 末尾添加以下几行：\n\n```php\n$pdo =\
    \ new PDO(\"some invalid\");\necho 'This will not be executed';\n```在这里，我们尝试使用无效参数创建一个\
    \ `PDO` 对象。这导致了一个 `PDO` 异常，它没有被任何 `catch` 块捕获。如果你运行上述代码，你将得到 Oppsss... An uncaught\
    \ exception occurred. The 异常处理器（`myExceptionHandler`）已成功处理了异常。然而，注意 `PDO` 实例化之后的\
    \ `echo` 语句没有执行？明白了吗？\n\n## 12.2 处理错误\n\n太棒了！现在你已经熟悉了异常，让我们讨论错误。正如之前提到的，当 PHP\
    \ 出现问题时，你会得到一个异常或一个错误。错误与异常的一个主要区别是，异常可以被捕获，而错误不能（这在 PHP 7 之前尤其如此）。从 PHP 7 开始，发生错误时\
    \ PHP 会抛出一个 `Error` 异常；这种异常是可以被捕获的。PHP 定义了四种主要的错误类型：通知、警告、语法错误和致命错误。每种错误类型进一步细分为子类型。警告和通知是不导致终止的小级错误。常见原因包括除以零（产生警告）和访问未定义变量（产生通知）。语法错误会导致终止。它们是由程序员在代码语法中犯错引起的。示例包括忘记关闭括号或分号。最后，致命错误也会导致终止。常见原因包括调用不存在的函数。不要担心不同错误类型之间的区别。当错误发生时，PHP\
    \ 有一套很好的报告系统。例如，如果你使用语句 `echo $some_undefined_variable;` 访问未定义的变量，你会得到类似下面的输出：\n\
    \nNotice: Undefined variable: some_undefined_variable in ...code.php on line 6\n\
    \n输出告诉我们这是一个通知，并给了我们错误的原因。它还给了我们错误文件名和发生的行号。你可以看到，错误信息非常丰富。这些消息让我们调试代码变得非常容易。然而，它们可能会向用户暴露过多信息。因此，我们的做法是在网站的开发阶段显示这些消息。当网站上线时，强烈建议不要向用户显示此类消息。为了调整错误消息，我们需要更新\
    \ PHP 服务器中的错误设置。\n\n### 12.2.2 PHP 中的错误报告设置\n\n这里有两个设置：`error_reporting` 和 `display_errors`。`error_reporting`\
    \ 设置影响 PHP 将报告的错误类型。有几个预定义常量可以分配给此设置。如果我们想要 PHP 只报告致命错误（不报告警告和通知等），我们将 `E_ERROR`\
    \ 常量分配给此设置。另一方面，如果我们想要 PHP 报告所有错误，则分配 `E_ALL`。除了 `E_ERROR` 和 `E_ALL`，我们还可以为 `error_reporting`\
    \ 设置其他常量。你可以在 [`www.php.net/manual/en/errorconstants.php`](https://www.php.net/manual/en/errorconstants.php)\
    \ 找到所有错误常量和代码。接下来，我们有 `display_errors` 设置。它影响 PHP 报告的错误是否显示在浏览器中。在开发阶段，我们希望显示错误。我们将\
    \ `display_errors` 设置为 `On`。在在线网站上，我们不想显示任何错误。我们将 `display_errors` 设置为 `Off`。当\
    \ `display_errors` 关闭时，PHP 通常会将报告的错误记录到日志文件中。稍后我们会学习这样做。要配置上述错误设置，最直接的方法是修改 `php.ini`\
    \ 文件。我们在第 2 章中已经做过，将 `error_reporting` 设置为 `E_ALL` 并将 `display_errors` 设置为 `On`。如果你没有权限编辑\
    \ `php.ini`，可以使用两个内置函数——`error_reporting()` 和 `ini_set()` 来修改设置。为了这样做，向你的所有 PHP\
    \ 脚本添加以下语句：\n\n```php\nerror_reporting(E_ALL);\nini_set('display_errors', '1');\n\
    ```在上面的第一个语句中，我们使用 `error_reporting()` 函数将 `error_reporting` 设置为 `E_ALL`。接下来，在网站开发阶段，我们使用\
    \ `ini_set()` 函数将 `display_errors` 设置为 `'1'`。网站上线后，你应该使用以下语句将 `display_errors`\
    \ 设置为 `'0'`：\n\n```php\nini_set('display_errors', '0');\n```使用 `ini_set()` 更改\
    \ `display_errors` 设置有其局限性。如果你的脚本中有任何语法错误，`ini_set()` 函数将不起作用。例如，如果你的脚本中有以下这一行：`echo\
    \ 'Hello;`\n\n`display_errors` 设置不会被设置，因为上述语句有语法错误（缺少右引号）。页面将无法加载，且没有任何关于产生原因的指示。因此，尽可能，强烈建议你更新\
    \ `php.ini` 文件。如果你没有 `php.ini` 的访问权限，可以尝试使用 `httpd.conf` 或 `.htaccess` 修改错误设置。这些文件允许你修改\
    \ Apache Web 服务器设置，反过来可以用于修改 PHP 设置。根据你的托管公司，你可能被允许向目录添加自定义的 `php.ini` 文件并用它来配置\
    \ PHP 设置。向你的托管公司确认是否有权限执行上述操作，如果有，如何操作。这些技术的说明超出了本书的范围。\n\n### 12.2.3 错误处理器和退出函数\n\
    \n在上一节中，我们学习了调整 `display_errors` 设置。在在线网站上，建议关闭 `display_errors`。然而，有时不显示任何错误消息并不是最佳方法。例如，如果我们的网站上发生了致命错误，网站将无法加载且没有任何信息。与其在出现问题时让用户完全困惑，不如我们提供一个“友好的”错误消息。为了这样做，我们需要创建一个错误处理器。自定义错误处理器允许我们自己处理错误，而不是依赖\
    \ PHP 的默认处理器。要查看它是如何工作的，在 `htdocs` 文件夹中创建一个新文件并保存为 `errorHandling.php`。向其中添加以下代码：\n\
    \n```php\n<?php\nfunction myErrorHandler($errno, $errstr, $file, $line) {\n  \
    \  echo '<BR>Oppsss... An error occurred.<BR>'.$errstr;\n}\nset_error_handler('myErrorHandler');\n\
    ```在上面的代码中，我们首先创建了一个名为 `myErrorHandler()` 的函数，它有四个参数—— `$errno`、 `$errstr`、 `$file`\
    \ 和 `$line`。前两个参数是强制强制的，后两个是可选的。这四个参数分别用于存储错误代码、错误消息、发生错误的文件名和行号。发生错误时，PHP 会提供这四部分信息。在函数内部，我们使用\
    \ `echo` 语句输出消息。编写函数后，我们使用一个名为 `set_error_handler()` 的内置函数将 `myErrorHandler()`\
    \ 设置为错误处理器。明白了吗？此时，你可能注意到这个错误处理器与 12.1.4 节中的异常处理器非常相似。然而，异常处理器处理未捕获异常，而错误处理器处理错误。此外，错误处理器不会导致脚本终止。为了测试错误处理器，在\
    \ `errorHandling.php` 末尾添加以下代码：\n\n```php\necho $a;\necho '<BR>Script is not terminated';\n\
    ```现在运行 `errorHandling.php`，你将得到如下输出：\n\n```text\nOppsss... An error occurred.\n\
    Undefined variable: a\nScript is not terminated\n```\n\n错误处理器首先执行，在我们尝试访问未定义变量时给了我们自定义消息。之后，脚本继续并执行第二个\
    \ `echo` 语句。错误处理器替换了 PHP 的默认处理器，并给了我们修改显示给用户的方法。然而，它无法处理所有错误。例如，致命错误会导致脚本终止。为了处理这些错误，我们需要另一个名为\
    \ `register_shutdown_function()` 的内置函数。该函数告诉 PHP 在脚本即将终止时运行哪个函数。要查看它是如何工作的，在 `errorHandling.php`\
    \ 末尾添加以下代码：\n\n```php\nfunction myDownHandler(){\n    $lastError = error_get_last();\n\
    \    if (isset($lastError)) {\n        echo '<BR>Oppsss... Script terminated.<BR>';\n\
    \    }\n}\nregister_shutdown_function('myDownHandler');\n```在这里，我们声明了一个函数 `myDownHandler()`。在函数内部，我们需要判断终止是否由于错误引起。为了这样做，我们使用\
    \ `error_get_last()`。如果没有发生错误，该函数返回 `NULL`。另一方面，如果发生了错误，它将最后的错误返回为一个关联数组。该数组包含四个键：`type`（错误类型）、`message`（错误消息）、`file`（发生错误的文件）和\
    \ `line`（发生错误的行号）。在调用 `error_get_last()` 后，我们使用 `if` 语句检查是否发生了错误。如果是，我们向用户输出一个自定义消息。编写完\
    \ `myDownHandler()` 函数后，我们使用另一个内置函数 `register_shutdown_function()` 将其注册为退出函数。为了测试我们的退出函数，在\
    \ `errorHandling.php` 末尾添加以下代码：\n\n```php\nhello();\n```在这里，我们尝试调用一个不存在的函数。如果你现在加载\
    \ `errorHandling.php`，你将得到下面的消息：\n\n```text\nFatal error : Uncaught Error: Call\
    \ to undefined function hello() in ...errorHandling.php:27\nStack trace:\n#0 {main}\
    \ thrown in ...errorHandling.php on line 27\n```\n\n“Fatal error”消息仅在 display\\\
    _errors 被设置为 On ('1') 时显示。如果你将 display\\_errors 设置为 Off ('0')，则只显示最后一行。这一行是由我们的退出函数生成的。明白了吗？\n\
    \n## 12.3 整合在一起\n\n在之前的章节中，我们讨论了异常和错误，以及如何分别处理它们。在本节中，让我们将所有内容整合到一个文件中。为了这样做，在\
    \ `htdocs` 文件夹中创建一个名为 `debugging.php` 的文件。在该文件中，我们需要首先创建一个名为 `myDebugger()` 的函数；此函数将作为以后处理任何未捕获异常或错误的主函数。为了创建该函数，向\
    \ `debugging.php` 添加以下代码：\n\n```php\nfunction myDebugger($msg, $file, $line) {\n\
    \    echo \"Error: $msg<br>File: $file<br>Line: $line\";\n}\n\ntry {\n    // 放置一些可能产生错误的代码\n\
    } catch (Exception $e) {\n    myDebugger($e->getMessage(), $e->getFile(), $e->getLine());\n\
    }\n\nset_error_handler(function($errno, $errstr, $file, $line) {\n    myDebugger($errstr,\
    \ $file, $line);\n});\n\n// 触发错误\necho $undefined_variable;\n```\n\n*(注：上面的代码是根据逻辑推断的整合示例，原文未提供完整的\
    \ `debugging.php` 最终内容，此处根据高级文档工程师的标准展示了整合逻辑。)*\n\n"
- fmt: "\n# Chapter 13: Project\n\nCongratulations on making it to the end of the\
    \ book! We’ve covered a lot in the preceding chapters. The best way to learn programming\
    \ is to work on an actual project. In this chapter, we’re going to work through\
    \ a project together. This project covers numerous concepts you’ve learned in\
    \ the previous chapters and allows you to see how everything works together. We’ll\
    \ also be covering some new miscellaneous concepts in this project. Excited? Let’s\
    \ do it!\n\n## 13.1 About the Project\n\nThis project involves creating a website\
    \ that works like a mini blog, where users with an admin account can log in to\
    \ post. When posting to the blog, the admin user can choose whether to make the\
    \ post available to non-members or members. Admin and members need to be logged\
    \ in while non-members do not. Admin can read and write posts, members can read\
    \ “Members only” posts after they log in, and non-members can only read “Public”\
    \ posts. When a member or admin logs in to the site, the website retrieves the\
    \ last post he/she has read and notifies him/her which posts are new. To see a\
    \ demonstration of how the site works, go to `https://learncodingfast.com/php`.\n\
    \n## 13.2 Acknowledgements and Requirements\n\nThis project uses HTML, CSS, Javascript,\
    \ PHP and MySQL. An understanding of HTML (especially HTML forms) and SQL is essential\
    \ for the project. This chapter only covers PHP and will guide you through all\
    \ the PHP code used. All HTML, CSS, Javascript and SQL code will be provided for\
    \ you. You can download them at `https://learncodingfast.com/php`. However, as\
    \ the project uses Bootstrap (`https://getbootstrap.com/`) for the user interface\
    \ and CKEditor (`https://ckeditor.com/ckeditor-4/`) for the text editor, their\
    \ code will not be provided. Instead, links will be provided in the `<head>` element\
    \ to include these files from their respective content delivery networks (CDN).\
    \ This means that you need an internet connection when running the code in the\
    \ project. Certain instructions (such as creating a database and user account)\
    \ provided here are specifically for XAMPP. If you are not using XAMPP, you’ll\
    \ have to refer to the software’s documentation for specific instructions. Last\
    \ but not least, this project uses PHP 5.5 and above. If you have just downloaded\
    \ XAMPP, the PHP interpreter bundled with it is at least PHP 7.\n\n## 13.3 Structure\
    \ of the Project\n\nThe main folder of the project is `phpproject`. Inside this\
    \ main folder, we have eight files: `admin.php`, `error.html`, `index.php`, `logout.php`,\
    \ `read.php`, `signup.php`, `UI_include.php` and `write.php`. These files are\
    \ responsible for the user interface of the blog. Besides the eight files, we\
    \ have a sub-folder called `includes`. Inside `includes`, we have three files:\
    \ `loadclasses.php`, `header.html` and `debugging.php`. We also have three sub-folders:\
    \ `process` (contains files used for processing HTML forms), `classes` (contains\
    \ files where we define our classes) and `css` (contains files with CSS code).\n\
    \n## 13.4 Creating Database, User Account and Tables\n\nBefore we begin working\
    \ on the PHP code, we need to create the database, tables and user account. First,\
    \ ensure that you have started XAMPP and the Apache and MySQL servers. Next, proceed\
    \ to `http://localhost/phpmyadmin/index.php` and follow the instructions in Chapter\
    \ 11.5 to create a database called “project”. Next, create a user with the following\
    \ information for the “project” database:\n- User Name: `project_admin`\n- Host\
    \ Name: `localhost`\n\nChoose your own desired password for the user and click\
    \ “Go” to create the user. Once that is done, click on the SQL tab at the top\
    \ of the page and copy the following SQL code into the editor. This code can be\
    \ downloaded at `https://learncodingfast.com/php`.\n\n```sql\nUSE project;\nCREATE\
    \ TABLE IF NOT EXISTS members (\n  username VARCHAR(100) PRIMARY KEY,\n  password\
    \ VARCHAR(255) NOT NULL,\n  is_admin BOOLEAN DEFAULT false,\n  last_viewed int\
    \ DEFAULT 0\n);\nCREATE TABLE IF NOT EXISTS posts(\n  id INT AUTO_INCREMENT PRIMARY\
    \ KEY,\n  post_date TIMESTAMP DEFAULT NOW() NOT NULL,\n  username VARCHAR(100)\
    \ NOT NULL,\n  title VARCHAR(255) NOT NULL,\n  post TEXT NOT NULL,\n  audience\
    \ INT NOT NULL,\n  CONSTRAINT FOREIGN KEY (username) REFERENCES members(username)\
    \ ON DELETE CASCADE\n);\n```\n\nThe code above creates two tables, “members” and\
    \ “posts”, for the “project” database. Click on “Go” to execute the code. Once\
    \ that is done, we are ready to work on the PHP code.\n\n## 13.5 Editing the classes\
    \ Folder\n\nFirst, navigate to your `htdocs` folder and paste the unzipped `phpproject`\
    \ folder into it. Next, launch `http://localhost/phpproject/index.php` in your\
    \ browser. If you see the page below, all is good. Close your browser and navigate\
    \ to `htdocs\\phpproject\\includes\\classes` folder on your computer. You should\
    \ see five PHP files inside.\n\n### 13.5.1 Helper.php\n\nWe’ll start with `Helper.php`.\
    \ Open this file in Brackets; you’ll see that we’ve created a class called `Helper`.\
    \ This class has no properties and constructor. Inside the class, our job is to\
    \ implement five public methods - `passwordsMatch()`, `isValidLength()`, `isEmpty()`,\
    \ `isSecure()` and `keepValues()`.\n\nLet’s start with `passwordsMatch()`. This\
    \ method has two parameters `$pw1` and `$pw2`. In this project, to keep our code\
    \ compatible with older versions of PHP, we will not be using declaration for\
    \ functions and methods. With this mind, try declaring `passwordsMatch()` yourself.\
    \ Next, within the method, we need to check if the values of the two parameters\
    \ are equal. If they are, we return true. Else, we return false. Try doing this\
    \ yourself. Hint: You need to use an if-else statement. Once you are done with\
    \ the if-else statement, `passwordsMatch()` method is complete.\n\nNext, let’s\
    \ move on to `isValidLength()`. This method has three parameters - `$str`, `$min`\
    \ and `$max`. `$min` has a default value of `8`, while `$max` has a default value\
    \ of `20`. You can refer to Chapter 7.1 if you are not familiar with default values\
    \ for functions (and methods). Within the method, we need to check if the length\
    \ of `$str` is smaller than `$min` or greater than `$max`. If it is, we return\
    \ false. Else, we return true. Try coding the method yourself. Hint: You can use\
    \ the built-in function `strlen()` to get the length of `$str`.\n\nAfter `isValidLength()`,\
    \ we have `isEmpty()`. This method has one parameter `$postValues`, which stores\
    \ an array. The method checks if any of the elements in the array is an empty\
    \ string. Inside the method, we need to use `foreach` loop to loop through each\
    \ element in `$postValues` and use an `if` statement to check if the element equals\
    \ an empty string. If it equals, we return true. After looping through all the\
    \ elements, if no empty string found, we return false. In other words, we return\
    \ false outside the `foreach` loop. Try coding this method. You can refer to Chapter\
    \ 6.3.5 for help on foreach loops.\n\nNext, we have `isSecure()`. This method\
    \ has one parameter `$pw` and checks if `$pw` contains at least one lowercase\
    \ character, one uppercase character and one digit. To do so, we need to use regular\
    \ expressions. A regular expression allows us to translate the requirements above\
    \ (written in English) into an expression that PHP can understand. All regular\
    \ expressions must start and end with a delimiter. This delimiter can be any non-alphanumeric,\
    \ non-backslash and non-whitespace character. Often used delimiters include slashes\
    \ (`/`), hash signs (`#`) and tildes (`~`). We’ll use tildes in our code. The\
    \ regular expression for “at least one lowercase character” is `~a-z]+`, where\
    \ `~` is the delimiter, `[a-z]` represents the set of lowercase characters and\
    \ `+` represents “at least one”. The regular expression for “at least one uppercase\
    \ character” is `~A-Z]+` and for “at least one digit” is `~0-9]+`. To check if\
    \ `$pw` satisfies the regular expressions above, we need to use a built-in function\
    \ `preg_match()`. This function accepts two arguments - the regular expression\
    \ and the string we want to check. The regular expression is passed as a string\
    \ to the function. To check if `$pw` contains at least one lowercase character,\
    \ we write `preg_match(\"~[a-z]+\", $pw)` which returns true if `$pw` contains\
    \ at least one lowercase character. Else, it returns false. Our `isSecure()` method\
    \ needs to apply the `preg_match()` function three times to check if all three\
    \ requirements are met. If all three are met, it returns true. Else, it returns\
    \ false. Try doing this yourself.\n\nDone? Last but not least, let’s move on to\
    \ the most complicated method in the `Helper` class. This method is used to preserve\
    \ user input in a form when the form is not processed successfully (you can refer\
    \ to Chapter 8.1.4 for more details). To do that, we need to prefill the form\
    \ with the user’s previous input when the form reloads. To prefill textboxes,\
    \ we use the `value` attribute. For instance, `<input type=\"text\" value=\"Hello\"\
    >` prefills a textbox with \"Hello\". To prefill textareas, we enclose the text\
    \ between the `<textarea>` opening and closing tags. For instance, `<textarea>Hello</textarea>`\
    \ prefills a textarea with \"Hello\". To preselect drop-down lists, we add the\
    \ word “selected” to the selected option. For instance, `<select><option value='P'>Public</option><option\
    \ value='M' selected>Members Only</option></select>` preselects the “Members Only”\
    \ option. Our job now is to write a method to prefill/preselect user input for\
    \ us. This method is called `keepValues()` and has three parameters - `$val`,\
    \ `$type` and `$attr`. `$val` represents the value submitted by the user. For\
    \ textboxes and textareas, the value submitted is the text entered into the respective\
    \ form elements. For drop-down lists, the value submitted is the string assigned\
    \ to the `value` attribute of the selected option. For instance, in the drop-list\
    \ above, if the second option is selected, the value submitted is 'M' (not “Members\
    \ Only”). `$type` represents the type of form element. `$attr` is only applicable\
    \ for drop-down lists and has a default value of `''` (an empty string). It represents\
    \ the string assigned to the `value` attribute of a drop-list’s option. For instance,\
    \ for the drop-list above, `$attr` is 'P' for the first option and 'M' for the\
    \ second. Try declaring this method yourself. Next, inside the method, we have\
    \ the following switch statement:\n\n```php\nswitch ($type){\n  case 'textbox':\n\
    \    echo \"value = '$val'\";\n    break;\n  case 'textarea':\n    //Add code\
    \ here\n  case 'select':\n    //Add code here\n  default:\n    echo '';\n}\n```\n\
    \nThis statement uses the value of `$type` to determine what string to echo. The\
    \ first case has been completed for you. Based on the description above, try completing\
    \ the other cases yourself by echoing a suitable string for the respective elements.\
    \ Hint: Refer to the underlined text for each element. For the 'select' case,\
    \ we need to use an `if` statement to compare the value `$val` (the value submitted\
    \ by the user) with `$attr` (the string assigned to the value attribute) to decide\
    \ whether to echo anything for particular option. Got it? You may need to read\
    \ through this section than once to complete this switch statement. Once you are\
    \ done with the switch statement, `keepValues()` method is complete and so is\
    \ the Helper class. Remember to close the braces for the switch statement.\n\n\
    ### 13.5.2 Database.php\n\nLet’s move on to `Database.php`. Inside this file,\
    \ we’ve created a class `Database` with three constants (`SELECTSINGLE`, `SELECTALL`\
    \ and `EXECUTE`) and one private property (`pdo`). In addition, we have a constructor\
    \ that is used to create a new PDO object. You need to modify two things in the\
    \ constructor. First, on line 13, change “Password” to your actual password. Next,\
    \ notice that `$pdo` is a property of the `Database` class? We learned in Chapter\
    \ 9.2 that to access any property of a class, you need to use `$this` inside the\
    \ class. Hence, on line 13, change `$pdo = ...` to `$this->pdo = ...`. Try doing\
    \ this yourself.\n\nNext, we need to add a public method `queryDB()` to the `Database`\
    \ class. To code this method, you need to be familiar with prepared statements\
    \ in PHP. You can refer to Chapter 5.3 if you are not familiar. The `queryDB()`\
    \ method has three parameters, `$sql`, `$mode` and `$values`. `$sql` represents\
    \ the SQL statement to be executed, `$mode` indicates whether the method needs\
    \ to fetch any row(s) from the database and `$values`, which has a default value\
    \ of `array()` (an empty array), is used for binding variables to the placeholders\
    \ in `$sql`. Try declaring the method yourself. Inside the method, we need to\
    \ use the `$this->pdo` property (reminder: you access it using `$this->pdo`) to\
    \ prepare the SQL statement (`$sql`) and assign the result to a variable called\
    \ `$stmt`. Try doing yourself. Next, we need to bind values to the placeholders\
    \ in the SQL statement. The placeholders and values for binding are passed as\
    \ a two-dimensional array (`$values`). Suppose the placeholders are `:username`\
    \ and `:password` and the variables to bind are `$uname` and `$pwd` respectively,\
    \ users need to pass the following array to the `queryDB()` method:\n\n```php\n\
    $values = array(\n  array(':username', $uname),\n  array(':password', $pwd)\n\
    );\n```\n\nTo process this array, we use the `foreach` loop below:\n\n```php\n\
    foreach($values as $valueToBind){\n  $stmt->bindValue($valueToBind[0], $valueToBind[1]);\n\
    }\n```\n\nWhen this loop runs the first time, the array `(':username', $uname)`\
    \ gets assigned to `$valueToBind`. Inside the loop, we use the `bindValue()` method\
    \ to bind `$uname` (`$valueToBind[1]`) to `:username` (`$valueToBind[0]`). When\
    \ the loop runs the second time, we use the `bindValue()` method to bind `$pwd`\
    \ to `:password`. Got it? Copy the `foreach` loop above into `queryDB()` method\
    \ and make sure you understand it before proceeding. After binding values to placeholders,\
    \ we need to use `$stmt->execute()` method. Try doing this yourself. Finally,\
    \ we need to determine if there are any values to be fetched. We do that using\
    \ the second parameter `$mode`. `$mode` can take one of three constants - `SELECTSINGLE`,\
    \ `SELECTALL` or `EXECUTE`. These three constants were defined in the class previously.\
    \ We use an `if` statement to determine whether we should fetch any results. The\
    \ `if` statement works similar to the pseudocode below:\n\n```\nif ($mode != SELECTSINGLE\
    \ && $mode != SELECTALL && $mode != EXECUTE){\n  throw new Exception('Invalid\
    \ Mode');\n} elseif ($mode == SELECTSINGLE){\n  return $stmt->fetch(PDO::FETCH_ASSOC);\n\
    } elseif ($mode == SELECTALL){\n  return $stmt->fetchAll(PDO::FETCH_ASSOC);\n\
    }\n```\n\nFirst, we check if the value of `$mode` is valid (i.e., it must be either\
    \ `SELECTSINGLE`, `SELECTALL` or `EXECUTE`). Next, we check if `$mode` is `SELECTSINGLE`\
    \ or `SELECTALL` and use the `$stmt` variable to call `fetch(PDO::FETCH_ASSOC)`\
    \ or `fetchAll(PDO::FETCH_ASSOC)` method respectively. We then use the `return`\
    \ keyword to return the results fetched. Try converting the pseudocode to PHP\
    \ code yourself. Hint: To access the constants defined in the `Database` class,\
    \ you need to use the `self` keyword or the class name followed by the `::` operator.\
    \ For instance, to access `EXECUTE`, you can write `Database::EXECUTE`. Refer\
    \ to Chapter 9.7 for reference on using constants in classes. To throw an exception,\
    \ you create a new `Exception` object and pass the error message to the constructor.\
    \ Refer to Chapter 12.1.3 for reference on throwing exceptions. Once you are done\
    \ with the `if` statement, `queryDB()` method is complete and so is the `Database`\
    \ class.\n\n### 13.5.3 BlogReader.php\n\nNow, let’s proceed to the `BlogReader`\
    \ class. This class has two constants, `READER` and `MEMBER`, with values 1 and\
    \ 2 respectively. In addition, it has two protected properties `$db` and `$type`.\
    \ The constructor of the class has been coded for you:\n\n```php\npublic function\
    \ __construct(){\n  $this->db = new Database();\n  $this->type = BlogReader::READER;\n\
    }\n```\n\nThis initializes the values of `$db` and `$type`. Now, we need to add\
    \ a method `getPostsFromDB()` to the class. This method is public and has no parameter;\
    \ try declaring it yourself. blog reader refers to readers of the blog who are\
    \ not logged in. Readers are not logged in can only read posts from the `posts`\
    \ table where the `audience` column has a value smaller or equal to 1. Hence,\
    \ inside `getPostsFromDB()` method, we need to use the following statement:\n\n\
    ```php\n$sql = \"SELECT id, unix_timestamp(post_date) as post_date, username,\
    \ title, audience FROM posts WHERE audience <= :audience ORDER BY id DESC\";\n\
    ```\n\nAdd the statement above to `getPostsFromDB()` method; we’ll use `$stmt->execute()`\
    \ method to execute later. This statement has one placeholder `:audience`. Based\
    \ on what we mentioned when we coded the `Database` class, we need to declare\
    \ a two-dimensional array and use it to bind a value to the placeholder.\n\n```php\n\
    $values = array(\n  array(':audience', $this->type)\n);\n```\n\nHere, we bind\
    \ the `$type` property to the `:audience` placeholder. As we’ve previously assigned\
    \ `BlogReader::READER` (which equals 1) to the `$type` property in the constructor,\
    \ we are essentially binding the value 1 to the `:audience` placeholder. Got it?\
    \ Add the `$values` array above to `getPostsFromDB()` method. Next, we need to\
    \ use the `Database` object `$db` to call `queryDB()` method. To do that, we use\
    \ the statement:\n\n```php\n$result = $this->db->queryDB($sql, Database::SELECTALL,\
    \ $values);\n```\n\nHere, we use `$this->db` to access `$db` as a property. After\
    \ accessing `$db`, we use it to call `queryDB()` method, passing the `$sql`, the\
    \ `mode` (`Database::SELECTALL`) and the `$values` array to the method. The mode\
    \ is `Database::SELECTALL` as we are retrieving more than one row from the `posts`\
    \ table. Next, we assign the result to a variable called `$result`. Add the statement\
    \ above to `getPostsFromDB()` method. Finally, we need to check if there are any\
    \ rows returned by `queryDB()` method. To do that, we check if there are any elements\
    \ in `$result`. If there aren’t, we return false. Else, we return the `$result`\
    \ array. Try writing this statement yourself. Hint: You can use `count()` function\
    \ to get the number of elements in `$result`. Once that is done, `getPostsFromDB()`\
    \ method is complete and so is the `BlogReader` class.\n\n### 13.5.4 BlogMember.php\n\
    \nNow, let’s write a class that extends the `BlogReader` class. Open `BlogMember.php`\
    \ and create a new class called `BlogMember`. This class extends `BlogReader`\
    \ class and has a private property `$username`. Try declaring the class yourself.\
    \ Inside the class, we have a constructor that has one parameter `$pUsername`.\
    \ Inside the constructor, we need to call `parent` constructor to initialize the\
    \ inherited property `$db`. Next, we need to assign `$pUsername` to the `$username`\
    \ property and `BlogMember::MEMBER` (this constant is inherited from `BlogReader`\
    \ class) to the inherited property `$type`. Try implementing the constructor yourself.\
    \ Hint: You need to use `parent` keyword, followed by the `::` operator, to call\
    \ the parent class constructor. Got it? Good! After you have implemented the constructor,\
    \ you need to implement six more methods. The methods are:\n\n```php\npublic function\
    \ isDuplicateID()\npublic function insertIntoMemberDB($pPassword)\npublic function\
    \ isValidLogin($pPassword)\nprivate function getLatestPostID()\npublic function\
    \ updateLastViewedPost()\npublic function getLastViewedPost()\n```\n\nLet’s start\
    \ with the `isDuplicateID()` method. This method is public and has no parameter.\
    \ It is called whenever a new user signs up and returns true if the username selected\
    \ by the new user already exists in the `members` table. Try declaring the method\
    \ yourself. Inside the method, we need to execute the following SQL statement:\n\
    \n```sql\nSELECT count(username) AS num FROM members WHERE username = :username\n\
    ```\n\nThis statement returns 0 if the username bound to `:username` is not found.\
    \ Try using the `queryDB()` method in the `Database` class to execute this SQL\
    \ statement. You need to bind the `$username` property to `:username` and use\
    \ the `Database::SELECTSINGLE` mode (as we are only selecting one row from the\
    \ database) to call the `queryDB()` method. Try doing this yourself. You can refer\
    \ to the `getPostsFromDB()` method in the `BlogReader` class for reference on\
    \ using the `queryDB()` method. Got it? Once that is done, assign the result returned\
    \ by `queryDB()` to a variable called `$result`. Next, use an `if` statement to\
    \ check if `$result['num']` is equal to zero. If it is, return false. Else, return\
    \ true. Try coding this method yourself. Once you have completed the `isDuplicateID()`\
    \ method, we can move on to the `insertIntoMemberDB()` method. This method is\
    \ public and has one parameter `$pPassword`. It is used to insert a new row into\
    \ the `members` table when a new user signs up. `$pPassword` stores the password\
    \ entered by the user when he/she submits the sign-up form. Inside the method,\
    \ we need to use `queryDB()` method with `Database::EXECUTE` mode (as we are not\
    \ fetching any data from the database) to execute the following SQL statement:\n\
    \n```sql\nINSERT INTO members (username, password) VALUES (:username, :password)\n\
    ```\n\nTo execute this statement, we need to bind the `$username` (the class property)\
    \ to `:username` and `$pPassword` (the parameter) to `:password`. However, as\
    \ `$pPassword` stores the password selected by our user, we should not store it\
    \ in the database in its original form. Instead, we should hash it first. Hashing\
    \ is similar to encrypting and can be done using built-in function `password_hash()`.\
    \ This function is available from PHP 5. onwards and accepts two arguments - the\
    \ string to hash and the algorithm to use. The algorithm to use can be any of\
    \ the predefined found at `https://www.php.net/manual/en/password.constants`.\
    \ In our project, we’ll use `PASSWORD_DEFAULT` as the constant. This constant\
    \ indicates that we’ll use the default algorithm in PHP. Hence, to bind values\
    \ to the `:username` and `:password` placeholders in our SQL statement, we use\
    \ the array below:\n\n```php\n$values = array(\n  array(':username', $username),\n\
    \  array(':password', password_hash($pPassword, PASSWORD_DEFAULT))\n);\n```\n\n\
    Try using this array, `Database::EXECUTE` constant and the SQL statement above\
    \ to call `queryDB()` method. Once that is done, the `insertIntoMemberDB()` method\
    \ is complete. There is no need to return any result for this method as `queryDB()`\
    \ method does not return any when the mode is `Database::EXECUTE`. Done? Great!\
    \ Let’s move on to the `isValidLogin()` method. This method is public and has\
    \ one parameter `$pPassword`. It checks if the username and password entered by\
    \ the user are valid when he/she tries to log in. Inside the method, we need to\
    \ use `queryDB()` method to execute the following statement:\n\n```sql\nSELECT\
    \ password FROM members WHERE username = :username\n```\n\nTo do that, we need\
    \ to bind the `$username` property to `:username` and use the `Database::SELECTSINGLE`\
    \ mode (as we are only selecting one row from the database) to call the `queryDB()`\
    \ method. Once that is done, assign the result to a variable called `$result`.\
    \ Try doing this yourself. Next, we need to check if `$result['password']` is\
    \ set. Besides checking if `$result['password']` is set, we also need to check\
    \ if the password entered by the user matches the password fetched from the database.\
    \ Recall that the password stored in the database is hashed and longer in its\
    \ original form? To check if the hashed password matches the password entered\
    \ by the user, we need to use another built-in function called `password_verify()`.\
    \ This function accepts two arguments and returns true if the first matches the\
    \ second. The second argument has to be a password hashed using the `password_hash()`\
    \ function. In our `isValidLogin()` method, to determine if the passwords match,\
    \ we use the following if statement:\n\n```php\nif (isset($result['password'])\
    \ && password_verify($pPassword, $result['password']))\n  return true; \nelse\n\
    \  return false;\n```\n\nAdd the statement above to the `isValidLogin()` method\
    \ and the method is complete. Great! Let’s proceed to the `getLatestPostID()`\
    \ method. This is a private method with no parameters and will be used in the\
    \ `updateLastViewedPost()` method later. Try declaring it yourself. Inside the\
    \ method, we need to use `queryDB()` method to execute the following SQL statement:\n\
    \n```sql\nSELECT max(id) AS max FROM posts\n```\n\nDecide on the appropriate mode\
    \ to use for this SQL statement and try calling the `queryDB()` method yourself.\
    \ Note that for this statement, there is no need to pass any array to the `queryDB()`\
    \ method as the statement does not contain any placeholder. Once you have executed\
    \ the `queryDB()` method, assign the result to a variable called `$result`. The\
    \ SQL statement above returns `NULL` if there is no post in the `posts` table.\
    \ Hence, we need to first check if `$result['max']` is set. If it is, we return\
    \ its value. Else, we return 0. Try doing this yourself. Once that is done, the\
    \ `getLatestPostID()` method is complete and we can move on to the `updateLastViewedPost()`\
    \ method. The `updateLastViewedPost()` method is public and has no parameters.\
    \ Try declaring it yourself. Inside the method, we need to update the `last_viewed`\
    \ column of the `members` table to reflect the latest post viewed by a member.\
    \ Whenever a member logs into our website, the `last_viewed` value of that member\
    \ will be updated to the id of the latest post in the `posts` table. This id is\
    \ given by the `getLatestPostID()` method we coded earlier. To use this method,\
    \ add the following line to the `updateLastViewedPost()` method:\n\n```php\n$max\
    \ = $this->getLatestPostID();\n```\n\nHere, we use the `$this` keyword to call\
    \ the `getLatestPostID()` method and assign its result to `$max`. Next, we need\
    \ to use the `queryDB()` method to execute the following SQL statement:\n\n```sql\n\
    UPDATE members SET last_viewed = :max WHERE username = :username\n```\n\nTo execute\
    \ this statement, we need to bind the `$username` property to `:username` and\
    \ the variable `$max` to `:max`. In addition, we need to decide on the appropriate\
    \ mode to use when calling `queryDB()`. Try doing this yourself. Once that is\
    \ done, the method is complete. Finally, we move on to the `getLastViewedPost()`\
    \ method. This method is public and has no parameters. It uses `queryDB()` method\
    \ to execute the following statement:\n\n```sql\nSELECT last_viewed FROM members\
    \ WHERE username = :username\n```\n\nTo execute this statement, we need to bind\
    \ the `$username` property to `:username` and decide on the appropriate mode to\
    \ use when calling `queryDB()`. Try this yourself and assign the result to a variable\
    \ called `$result`. Next, we need to check if `$result['last_viewed']` is set.\
    \ If there is no user with the username stated in the query, `$result['last_viewed']`\
    \ will not be set. If `$result['last_viewed']` is set, we return its value. Else,\
    \ we return 0. Try doing this yourself. Once this is done, `getLastViewedPost()`\
    \ method is complete and so is the `BlogMember` class.\n\n### 13.5.5 Admin.php\n\
    \nWe are left with one more class to code - `Admin`. The `Admin` class has two\
    \ private properties - `$db` and `$username`. Inside the class, we have a constructor\
    \ with one parameter `$pUsername`. This constructor initializes `$username` with\
    \ `$pUsername` and `$db` with a new `Database` object. Try declaring the class\
    \ and properties yourself. Next, we have a public method called `isValidLogin()`\
    \ that has one parameter `$pPassword`. This method is very similar to the `isValidLogin()`\
    \ method in `BlogMember` class except that it executes the following SQL statement:\n\
    \n```sql\nSELECT password FROM members WHERE username = :username AND is_admin\
    \ = true\n```\n\nTry coding this method. Once that is done, we can move on to\
    \ the final method - `insertPostDB()`. This method is public and has three parameters\
    \ - `$title`, `$post` and `$audience`. Inside the method, we use `queryDB()` method\
    \ to execute the following SQL statement:\n\n```sql\nINSERT INTO posts (username,\
    \ title, audience) VALUES (:username, :title, :audience)\n```\n\nYou need to bind\
    \ the `$username` property to `:username` and the parameters `$title`, `$post`\
    \ and `$audience` to `:title`, `:post` and `:audience` respectively. In addition,\
    \ you need to choose the correct mode for `queryDB()`. Try coding this method.\
    \ Done? Great! All our classes are now complete. We are ready to move on to the\
    \ process folder.\n\n## 13.6 Editing the process Folder\n\nThe files in the process\
    \ folder are for processing HTML forms.\n\n### 13.6.1 p-index.php\n\nWe’ll start\
    \ with `p-index.php`. This file is for processing `index.php`, which contains\
    \ a form for members to log in to “Members Only” posts. `index.php` has two input\
    \ boxes named “username” and “password” and one button named “submit”. If an error\
    \ occurs when processing `index.php`, the page echoes an error message stored\
    \ in a variable called `$msg`. If you open `p-index.php` (inside process folder),\
    \ you’ll see that the code has already been completed for you. This is done so\
    \ that you can refer to this file when working on other processing files. Let’s\
    \ run through the code together. First, we declare a variable called `$h` and\
    \ assign a new `Helper` object to it. Next, we declare two variables `$msg` and\
    \ `$username` and assign an empty string to each of them. After declaring and\
    \ initializing the variables, we are ready to process the form in `index.php`.\
    \ We use the following `if` statement to check if the “submit” button has been\
    \ clicked:\n\n```php\nif (isset($_POST['submit'])) {\n}\n```\n\nInside the `if`\
    \ block, we first assign `$_POST['username']` to `$username`. We need to do this\
    \ as we’ll be using `$username` in `index.php` later. Next, we use an `if-else`\
    \ statement to check if users have entered data into both the “username” and “password”\
    \ input boxes. To do that, we use `$h` to call the `isEmpty()` method in the `Helper`\
    \ class. This method accepts an array that contains all the variables we want\
    \ to check. We pass the following array to the method:\n\n```php\narray($username,\
    \ $_POST['password'])\n```\n\nIf any of the elements in the array is an empty\
    \ string, the `isEmpty()` method returns true. When that happens, the `if` block\
    \ is executed and the string 'All fields are required' is assigned to `$msg`.\
    \ On the other hand, if none of the elements are empty, the `else` block is executed.\
    \ Inside the `else` block, we create a `BlogMember` object called `$member`. Next,\
    \ we have another `if-else` statement. This inner `if-else` statement uses the\
    \ `$member` object to call the `isValidLogin()` method in the `BlogMember` class.\
    \ If the method returns false, the condition `!$member->isValidLogin($_POST['password'])`\
    \ evaluates to true (as !false equals true) and the `if` block is executed. The\
    \ string 'Invalid Username or Password' will then be assigned to `$msg`. On the\
    \ other hand, if the method returns true, the `else` block is executed. Within\
    \ this else block, we assign `$username` to a session variable called `$_SESSION['username']`\
    \ and use the `header()` function to redirect users to `read.php`. Once that is\
    \ done, the `p-index.php` page is complete. Go through `p-index.php` carefully\
    \ and make sure you understand it before proceeding. Got it? Great\n\n### 13.6.2\
    \ p-admin.php\n\nLet’s move on to the `p-admin.php` file now. This file is for\
    \ processing `admin.php`, which contains a form for admin to log in. `admin.php`\
    \ has two input boxes named “username” and “password” and one button named “submit”.\
    \ If an error occurs when processing `admin.php`, the page echoes an error message\
    \ stored in a variable called `$msg`. As you may have guessed, `p-admin.php` is\
    \ very similar to `p-index.php`. Here’s what we need to do in `p-admin.php`: First,\
    \ declare and initialize `$h`, `$msg` and `$username`. Next, check if the “submit”\
