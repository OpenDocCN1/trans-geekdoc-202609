    \ have the same string keys, the last one overrides the earlier ones. In the example\
    \ above, `$newArray3` becomes ('A' => 15, 'B' => 5, 'C' => 8, 'D' => 10). 'A'=>\
    \ 12 is replaced by 'A'=> 15. We’ve covered some of the commonly used array functions.\
    \ For a complete list of all the built-in array functions, check out [https://www.php.net/manual/en/ref.array.php](https://www.php.net/manual/en/ref.array.php).\n"
  raw: 'Chapter 5: More Data Types in PHP In the previous chapter, we looked at some
    of the basic data types in PHP. In this chapter, we’ll discuss two more data types
    - strings and arrays. You can create a new file named chap5.php to test the examples
    in this chapter. 5.1 Strings A string refers to a piece of text. In PHP, strings
    must be enclosed in single or double quotation marks. For instance, if we write
    $msg = ''Hello''; $greeting = "Good Morning"; $emptyStr = ""; $msg and $greeting
    store the strings ''Hello'' and "Good Morning" respectively. $emptyStr , on the
    other hand, stores a special string known as an empty string. This is because
    there is no text enclosed within the pair of double quotation marks we assign
    to it. In PHP, you can combine multiple strings using the concatenate operator
    (.). Let’s look at an example: $areacode = "(208)"; $contact = ''+1'' . $areacode
    . ''1234567''; echo $contact; Here, we use the concatenate operator twice to concatenate
