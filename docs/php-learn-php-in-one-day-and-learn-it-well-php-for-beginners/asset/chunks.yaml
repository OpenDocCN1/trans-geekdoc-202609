- fmt: "\n# Chapter 5: More Data Types in PHP\n\nIn the previous chapter, we looked\
    \ at some of the basic data types in PHP. In this chapter, we’ll discuss two more\
    \ data types - strings and arrays. You can create a new file named `chap5.php`\
    \ to test the examples in this chapter.\n\n## 5.1 Strings\n\nA string refers to\
    \ a piece of text. In PHP, strings must be enclosed in single or double quotation\
    \ marks. For instance, if we write:\n\n```php\n$msg = 'Hello';\n$greeting = \"\
    Good Morning\";\n$emptyStr = \"\";\n```\n\n`$msg` and `$greeting` store the strings\
    \ 'Hello' and \"Good Morning\" respectively. `$emptyStr`, on the other hand, stores\
    \ a special string known as an empty string. This is because there is no text\
    \ enclosed within the pair of double quotation marks we assign to it. In PHP,\
    \ you can combine multiple strings using the concatenate operator (`.`). Let’s\
    \ look at an example:\n\n```php\n$areacode = \"(208)\";\n$contact = '+1' . $areacode\
    \ . '1234567';\necho $contact;\n```\n\nHere, we use the concatenate operator twice\
    \ to concatenate the string `'+1'`, the variable `$areacode` and the string `'1234567'`\
    \ to form a new string. I’ve added spaces before and after the concatenate operators\
    \ so that you can see the three components more clearly; you do not need to add\
    \ these spaces. After concatenating, we assign the new string to a variable called\
    \ `$contact` and use the `echo` statement to echo its value. If you run the code\
    \ above, you’ll get `+1(208)1234567` as the output.\n\n### 5.1.1 Commonly used\
    \ String Functions in PHP\n\nNext, let’s discuss some of the commonly used string\
    \ functions in PHP. PHP comes with a large number of built-in functions for working\
    \ with strings. Most functions return a result after performing their tasks. We\
    \ can assign the result to a variable or use the `echo` statement to display the\
    \ result directly. A function may have different variations as some functions\
    \ allow us to provide optional arguments to modify the function’s behavior. The\
    \ examples below discuss the most common and useful approach to using each function.\n\
    \n#### `strlen()`\n\nThe `strlen()` function gives us the length of a string.\
    \ Example:\n\n```php\n$str1 = 'Good Day!';\necho strlen($str1);\n```\nOutput:\
    \ 9\n\nHere, we declare a variable called `$str1` and assign the string `'Good\
    \ Day!'` to it. Next, we pass `$str1` to `strlen()` and use the `echo` statement\
    \ to display the function's result directly. We get `9` as the output because\
    \ `4` (`'Good'`) + `1` (`' '`) + `3` (`'Day'`) + `1` (`'!'`) = `9`.\n\n#### `strtolower()`,\
    \ `strtoupper()`\n\nThe `strtolower()` and `strtoupper()` functions convert a\
    \ string to lowercase and uppercase respectively and return the new string. The\
    \ original string is not changed. Example:\n\n```php\n$str2 = 'Hello World';\n\
    $str3 = strtolower($str2);\n$str4 = strtoupper($str2);\necho '<BR>'.$str2;\necho\
    \ '<BR>'.$str3;\necho '<BR>'.$str4;\n```\n\nHere, we declare a variable called\
    \ `$str2` and assign the string `'Hello World'` to it. Next, we pass `$str2` to\
    \ `strtolower()` and `strtoupper()` and assign the results to `$str3` and `$str4`\
    \ respectively. Finally, we use three `echo` statements to echo the values of\
    \ `$str2`, `$str3` and `$str4`. In each case, we concatenate `'<BR>'` with the\
    \ variable so that the output will start on a new line. If you run the code above,\
    \ you’ll get `Hello World hello world HELLO WORLD` as the output.\n\n#### `trim()`\n\
    \nThe `trim()` function removes whitespaces from the front and end of a string\
    \ by default and returns the new string. You can specify other characters for\
    \ it to remove by passing a second optional argument to the function.\n\nExample\
    \ 1:\n\n```php\n$str5 = ' is ';\necho 'PHP'.$str5.'Fun<BR>';\necho 'PHP'.trim($str5).'Fun<BR>';\n\
    ```\nOutput: PHP is Fun PHPisFun\n\nHere, we first concatenate `$str5` with the\
    \ strings `'PHP'` and `'Fun<BR>'` and use an `echo` statement to echo the resulting\
    \ string directly. We get `\"PHP is Fun\"` as the output. Next, we use the `trim()`\
    \ function to remove whitespaces from `$str5` and concatenate it with `'PHP'`\
    \ and `'Fun<BR>'` again. We get `\"PHPisFun\"` as the output this time.\n\nExample\
    \ 2:\n\n```php\n$str6 = '\\*\\*Hello\\*\\*World\\*\\*\\*';\necho trim($str6, '\\\
    *');\n```\nOutput: Hello**World\n\nHere, we pass `'\\*'` to the `trim()` function\
    \ as the second argument. As a result, asterisks (instead of whitespaces) are\
    \ removed from the front and back of `$str6` and we get `\"Hello**World\"` as\
    \ the output.\n\n#### `substr()`\n\nThe `substr()` function returns a substring.\
    \ To use this function, we need to pass two arguments to it - the string to extract\
    \ the substring from and the position to start extracting it. We can also pass\
    \ a third argument to specify the length of the substring to extract. If we do\
    \ not provide this argument, the function extracts the substring starting from\
    \ the specified starting position to the end of the string. Positions in strings\
    \ start from 0, not 1. For instance, if we have a string `'ABCDEF'`, `'A'` is\
    \ at position 0, `'B'` is at position 1 and so on. Positions can also be negative.\
    \ If it is negative, it is counted from the back of the string. In `'ABCDEF'`,\
    \ `'F'` is at position -1, `'E'` is at position -2 etc.\n\nExample:\n\n```php\n\
    $str7 = 'ABCDEF';\necho substr($str7, 2).'<BR>';\necho substr($str7, -3).'<BR>';\n\
    echo substr($str7, 2, 1);\n```\nOutput: CDEF DEF C\n\nHere, we declare a variable\
    \ called `$str7` and assign the string `'ABCDEF'` to it. Next, we pass `$str7`\
    \ to `substr()` thrice to extract different substrings from it. In the first two\
    \ examples, the `substr()` function extracts substrings starting from (and including)\
    \ positions 2 and -3 respectively. Hence, we get `\"CDEF\"` and `\"DEF\"` as the\
    \ outputs. In the third example, we specify the desired length of the substring\
    \ by passing a third optional argument to `substr()`. As we specify the desired\
    \ length to be 1, we get `\"C\"` as the output.\n\nGot it? We’ve covered several\
    \ string functions in PHP. For a full list of all the string functions available,\
    \ you can check out the page [https://www.php.net/manual/en/ref.strings.php](https://www.php.net/manual/en/ref.strings.php).\n\
    \n## 5.2 Using Strings to Represent Dates\n\nNext, let’s learn to use strings\
    \ to represent dates. To do that, we use a built-in function called `strtotime()`.\n\
    \n### 5.2.1 The `strtotime()` function\n\nAs the name suggests, the `strtotime()`\
    \ function converts a string to time. It accepts a string describing a specific\
    \ date (and time) and tries to convert that to a timestamp. If you pass a string\
    \ to the function that it is unable to convert, it returns false. On the other\
    \ hand, if you pass a string that it is able to convert, it parses the string\
    \ and returns the UNIX timestamp. A UNIX timestamp is an integer that gives us\
    \ the number of seconds that have elapsed since January 1 1970 00:00:00 UTC.\n\
    \nFor instance, if you run the statement `echo strtotime(\"next Monday\");` you’ll\
    \ get something similar to 1587340800 This gives the UNIX timestamp for next Monday\
    \ (at the time of writing). The `strtotime()` function is quite smart and is able\
    \ to convert various English textual datetime descriptions into UNIX timestamps.\
    \ For instance, it has no problem converting strings like `\"now\"`, `\"tomorrow\"\
    `, `\"next Monday\"`, `\"15 Nov 2019\"` or `\"+1 week\"`. However, while the function\
    \ is easy to use, you’ll probably agree that the timestamp it returns is not useful\
    \ in most cases. If you want to get a more meaningful format for a date or time,\
    \ you can use another built-in function called `date()`.\n\n#### 5.2.2 The `date()`\
    \ function\n\nThe `date()` function accepts an optional timestamp and formats\
    \ the timestamp into a more readable string. If the timestamp is not provided,\
    \ it formats the current timestamp. Suppose we want to format a timestamp that\
    \ is 10 hours from the current time, we can use the statement below:\n\n```php\n\
    echo date('d-M-Y', strtotime(\"+10 hours\"));\n```\n\nHere, we pass two arguments\
    \ to the function. The first argument specifies how we want the timestamp to be\
    \ formatted. To do that, we use a string consisting of punctuation marks and predefined\
    \ characters (as defined on [https://www.php.net/manual/en/function.date.php](https://www.php.net/manual/en/function.date.php)).\
    \ In our example, we use the string 'd-M-Y'. The character `'d'` indicates that\
    \ we want the day to be represented as a two-digit number, using a leading zero\
    \ if necessary (e.g., 3 is output as 03). The characters `'M'` and `'Y'` indicate\
    \ that we want the month and year to be represented as three-letter text (e.g.,\
    \ Jan) and four-digit number respectively. Last but not least, the punctuation\
    \ mark `'-'` indicates that we want the day, month and year separated by hyphens.\
    \ After specifying the desired format, we pass a second argument `strtotime(\"\
    +10 hours\")` to the `date()` function. This argument is optional and specifies\
    \ the date we want to format. If you run the statement above, you’ll get an output\
    \ similar to 03-Apr-2020 This gives the date 10 hours from now (at the point of\
    \ writing). Got it?\n\n#### 5.2.3 Setting the timezone\n\nThe sections above discussed\
    \ two of the many built-in date/time functions in PHP. While most of functions\
    \ are easy to use, note that their results are affected by the timezone set in\
    \ our server. For instance, while `date('d-M-Y', strtotime(\"+10 hours\"))` gives\
    \ us 03-Apr-2020 in one timezone, it may give us 04-Apr_2020 in another. To avoid\
    \ any discrepancy in results, it is strongly recommended that you manually set\
    \ the timezone in your PHP server. To do that, you need to modify `php.ini` file.\
    \ Once you have located the file, open it, and scroll to the bottom. Next, head\
    \ over [https://www.php.net/manual/en/timezones.php](https://www.php.net/manual/en/timezones.php)\
    \ for a list of valid timezone identifiers. Say you want PHP to use the New York\
    \ timezone, you need to add `date.timezone=America/New_York` to the start of `php.ini`.\
    \ Once that is done, save the file, restart Apache, and the setting will be updated.\
    \ If you do not have permission to update `php.ini` file, you can use `date_timezone_set()`\
    \ function. This function takes a timezone identifier and sets the default timezone\
    \ used by all date/time functions in PHP script. For instance, to set the default\
    \ timezone to New York timezone, simply add `date_timezone_set('America/New_York');`\
    \ to your script.\n\n## 5.3 Arrays\n\nNow that we are familiar with strings and\
    \ dates, let’s move on to another commonly used type in PHP - arrays. An array\
    \ is a special data type that allows us to store values together as a single variable.\
    \ For instance, suppose you want to store the scores of 5 students. Instead of\
    \ storing them as `$marks1`, `$marks2`, `$marks3` and `$marks4`, you can store\
    \ them as an array.\n\n### 5.3.1 Creating an Array\n\nThere are a few ways to\
    \ create an array in PHP; the most common way is to use `array()` function.\n\n\
    Example 1:\n\n```php\n$firstArr = array();\n```\nThis creates an empty array.\n\
    \nExample 2:\n\n```php\n$secondArr = array(11, 16, 4, 9, 12);\n```\nThis creates\
    \ an array with 5 elements (i.e. 5 values). The array created is known as indexed\
    \ array, as each element in the array has an index. Indexes start from 0. In other\
    \ words, the first element (11) has an index of 0, the second (16) has an index\
    \ of 1, and so on. To access the individual elements in the array, we use its\
    \ index and a pair of square brackets. For instance, if you write `echo $secondArr[3];`\
    \ you are accessing the 4th element; you’ll get 9 as the output. You can also\
    \ use the index to update the value of an element.\n\n```php\n$secondArr[3] =\
    \ 20;\n```\nupdates the 4th element to 20. `$secondArr` becomes (11, 16, 4, 20,\
    \ 12).\n\nExample 3:\n\nIn addition to storing numbers, arrays can be used to\
    \ store other data types. In the example below, `$fruitsArr` is used to store\
    \ strings.\n\n```php\n$fruitsArr = array('Apple', 'Banana', 'Coconut');\n```\n\
    \nExample 4:\n\nBesides indexed arrays, we can create associative arrays. An associative\
    \ array is one where each value in the array is associated with a key. For instance,\
    \ in the example below, the value 16 is associated with 'Jane' (known as its key).\n\
    \n```php\n$assocArr = array('Peter' => 11, 'Jane' => 16, 'Paul' => 12);\n```\n\
    To access the values in an associative array, we use its key. If we write `echo\
    \ $assocArr['Paul'];` we’ll get 12 as the output.\n\nExample 5: Next, arrays can\
    \ be used to store arrays. This is known as a multidimensional array.\n\n```php\n\
    $simpleMDArr = array(\n    array(1, 2, 1, 4, 5),\n    array(0, 5, 1, 3, 4),\n\
    \    array(4, 1, 7, 8, 9)\n);\n```\n\nIn the example above, `$simpleMDArr[0]`\
