    and enter the same data we entered previously into the form. Next, click on the
    “Submit Form” button; you’ll see the following line appended to the bottom of
    the page: Array ( \[studentname\] => Alex \[subj\] => Array ( \[0\] => EL \[1\]
    => MA ) \[gender\] => M \[sm\] => Submit Form ) This gives us the content of the
    $\_GET\[\] array. In other words, $\_GET\[''studentname''\] = ''Alex'' , $\_GET\[''subj''\]
    = array(''EL'', ''MA'') , $\_GET\[''gender''\] = ''M'' and $\_GET\[''sm''\] =
    ''Submit Form'' . Got it? Great! Let’s move on to the post method now. 8.1.3 post
