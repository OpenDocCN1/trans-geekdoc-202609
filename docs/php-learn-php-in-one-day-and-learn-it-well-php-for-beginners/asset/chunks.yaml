  trans: "\n\n# 第 8 章：PHP 超全局变量\n\n我们在前面的章节中涵盖了许多内容。目前为止涵盖的大多数主题都是其他编程语言共同的基础概念。在本章中，我们将学习\
    \ PHP 特有的内容——PHP 超全局变量。我们将学习使用这些超全局变量与 HTML 表单交互，并将信息从一个 PHP 脚本传递到另一个。\n\n## 8.1\
    \ PHP 表单处理\n\n首先，这个主题要求你对 HTML 表单元素有基本的理解。如果你不熟悉，[`www.w3schools.com/html/html_form_elements.asp`](https://www.w3schools.com/html/html_form_elements.asp)\
    \ 提供了一个你可以参考的快速指南。如果你熟悉，让我们从创建一个简单的 HTML 表单开始，供以后使用。打开 Brackets 并在 `htdocs` 文件夹中创建一个名为\
    \ `form.php` 的新文件。向其中添加以下代码：\n\n```html\n<!DOCTYPE html>\n<html\n<head><title>PHP\
    \ Form Handling</title></head>\n<body <form action = \"\" method = \"get\"> Enter\
    \ Name <BR> <input type = \"text\" name = \"studentname\" value = \"Your Name\"\
    > <BR><BR> Favorite Subject(s)<BR> <input type = \"checkbox\" name = \"subj[]\"\
    \ value = \"EL\">English <input type = \"checkbox\" name = \"subj[]\" value =\
    \ \"MA\">Math <input type = \"checkbox\" name = \"subj[]\" value = \"PG\">Programming\
    \ <BR><BR> Gender <BR> <input type = \"radio\" name = \"gender\" value = \"M\"\
    >Male <input type = \"radio\" name = \"gender\" value = \"F\">Female <BR><BR>\
    \ <input type = \"submit\" name=\"sm\" value = \"Submit Form\"> </form></body></body></html>\n\
    ```\n\n仔细研究上面的代码。注意我们使用了以下 `<form>` 标签来创建一个 HTML 表单：`<form action = \"\" method\
    \ = \"get\">` 这个标签有两个属性——`action` 和 `method`。`action` 属性指定了我们想要用于处理 HTML 表单的文件。在示例中，我们给它赋值了一个空字符串。这意味着我们想要使用当前文件（即\
    \ `form.php`）来处理表单。如果我们想使用另一个文件来处理表单，我们需要将该文件的路径分配给 `action` 属性。例如，假设我们想使用 `process.php`\
    \ 且 `process.php` 与 `form.php` 在同一个文件夹中，我们需要写 `<form action = \"process.php\"\
    \ method = \"get\">`。\n\n接下来是 `method` 属性。该属性指定了我们想要用于发送表单数据的方法。有两种方法：`get` 和\
    \ `post`。如果我们不指定任何方法，默认是 `get`。在示例中，我们指定了想要使用 `get` 方法。我们稍后会讨论这两种方法。\n\n接下来，看看表单中的\
    \ `<input>` 标签；这些标签用于创建各种表单元素。注意所有的 `<input>` 标签都有一个 `name` 属性吗？这个属性用于命名相应的表单元素。例如，第一个表单元素（一个文本框）被命名为\
    \ `studentname`，如下代码所示：\n\n```html\n<input type = \"text\" name = \"studentname\"\
    \ value = \"Your Name\">\n```\n\n如果我们想用 PHP 处理这些元素，必须为表单元素命名。就像 PHP 中的变量有名称一样，所有表单元素必须有名称，以便我们稍后在代码中引用它们。\n\
    \n接下来，注意表单中所有的复选框（`type = \"checkbox\"`）都命名为 `subj`，两个单选按钮（`type = \"radio\"`）都命名为\
    \ `gender`。两个单选按钮名称相同，因为它们属于同一组（即它们都是“性别”的选项）。同样，三个复选框具有相同的名称，因为它们都是“喜科目”的选项。由于用户可以选择复选框可以选择多个选项，我们需要添加一对方括号来表示所选选项将被存储为数组。最后，注意所有的\
    \ `<input>` 标签都有一个 `value` 属性吗？该属性的行为取决于表单元素。对于文本框，它指定了显示在框中的初始值。对于“submit”（提交）按钮，它指定了按钮上的文本。对于复选框、单选按钮和下拉列表，它指定了每个被选中选项的值。例如，如果选择了下面的复选框：\n\
    \n```html\n<input type = \"checkbox\" name = \"subj[]\" value = \"EL\">\n```字符串\
    \ `\"EL\"` 将提交到 PHP 服务器，因为将其赋值了 `value` 属性。明白了了吗？太棒了！让我们继续讨论 `isset()` 函数。\n\n\
    ### 8.1.1 isset() 函数\n\n`isset()` 函数是 PHP 表单处理中常用的函数。它检查变量是否已声明且不是 `NULL`。`NULL`\
    \ 是一个特殊值，表示变量没有值。假设我们有两个变量 `$a` 和 `$b`：\n\n```php\n$a = 5;\n$b = NULL;\n```\n\n\
    以下语句：\n\n```php\nvar_dump(isset($a));\nvar_dump(isset($b));\nvar_dump(isset($c));\n\
    ```\n\n将输出 `bool(true)`、`bool(false)`、`bool(false)`。`$a` 被视为已设置，因为它有值。相比之下，`$b`\
    \ 和 `$c` 都被视为未设置，因为 `$b` 的值为 `NULL`。`isset()` 通常用于判断按钮是否被点击。我们稍后会学习。\n\n### 8.1.2\
    \ get 和 post\n\n`get` 和 `post` 方法都可以用于将表单数据发送到 PHP 服务器处理。主要的区别在于，当使用 `get` 方法时，表单数据会被附加到\
    \ URL 中。此外，使用 `get` 方法传输的数据量有一个限制。`form.php` 中的表单目前使用 `get` 方法。假设我们在表单中填写了以下数据：点击“Submit\
    \ Form”按钮时，URL 变为 `http://localhost/form.php?studentname=Alex&subj[]=EL&subj[]=MA&gender=M&sm=Submit+Form`。注意\
    \ URL 中的问号 (`?`)？问号用作分隔符；问号之后的内容被称为查询字符串。查询字符串包含了我们提交的表单数据，以 `name=value` 对的形式呈现，并用连符号\
    \ (`&`) 分隔。例如，我们在名为 `studentname` 的文本字段中输入字符串“Alex”，`studentname=Alex` 就会附加到 URL。接下来，为“科目”选择了“English”和“Math”。因此，附加到\
    \ URL 的 `subj[]=EL&subj[]=MA` 使用 URL 编码来无法在 URL 中显示的特殊字符。`%5B` 编码 `[`，而 `%5D`\
    \ 编码 `]`。你会得到 `subj[]=EL&subj[]=MA` 表示我们提交了“subj”的值。\n\n现在，假设我们想在 PHP 脚本中使用查询字符串存储的信息，该怎么做？简单。使用\
    \ `$_GET` 超全局变量。`$_GET` 是将查询字符串存储为关联数组的超全局变量。要查看 `$_GET` 中的所有数据，可以使用 `print_r()`\
    \ 函数。为了查看效果，在 `form.php` 的 `</form>` 和 `</body>` 标签之间添加以下代码：\n\n```php\n<?php\n\
    if (isset($_GET['sm']))\n    print_r($_GET);\n?>\n```\n\n这里，我们使用 `isset()` 函数检查\
    \ `$_GET['sm']` 是否设置。在点击“Submit Form”按钮（名为 `sm`）之前，`$_GET['sm']` 为未设置。当我们点击按钮时，PHP\
    \ 将字符串 `'Submit Form'` 分配给 `$_GET['sm']`，变量变为设置。发生这种情况时，`isset($_GET['sm'])` 返回\
    \ `true` 并执行 `if` 块。重新加载 `form.php`（不带查询字符串）并输入相同的数据。接下来，点击“Submit Form”按钮；你会在页面底部看到以下内容：\n\
    \n```text\nArray (\n    [studentname] => Alex\n    [subj] => Array\n        (\n\
    \            [0] => EL\n            [1] => MA\n        )\n    [gender] => M\n\
    \    [sm] => Submit Form\n)\n```\n\n这给了我们 `$_GET` 数组的内容。换句话说，`$_GET['studentname']\
    \ = 'Alex'`，`$_GET['subj'] = array('EL', 'MA')`，`$_GET['gender'] = 'M'` 以及 `$_GET['sm']\
    \ = 'Submit Form'`。\n\n### 8.1.3 post 和 $_POST\n\n`post` 方法类似于 `get` 方法，但表单数据不会附加到\
    \ URL。这使得 `post` 方法适用于向服务器发送敏感信息，因为信息不会在 URL 中可见。让我们来看例子。将 `form.php` 中的行 `<form\
    \ action = \"\" method = \"get\">` 改为 `<form action = \"\" method = \"post\">`。接下来，将\
    \ PHP 代码改为：\n\n```php\nif (isset($_POST['sm']))\n    print_r($_POST);\n```\n\n\
    最后，再次加载没有查询字符串的 `form.php` 并输入我们之前在表单中输入的数据。点击“Submit Form”按钮；你应该看到 URL 保持不变。除了这些，其他一切都是样的。换句话说，会在表单底部得到相同的输出。使用\
    \ `get` 方法对比 `post` 方法的主要区别在于前者会将查询字符串附加到 URL。`post` 方法使用 `$_POST` 超全局变量。\n\n\
    ### 8.1.4 在表单中保留值\n\n在之前的章节中，我们学习了如何使用 `get` 和 `post` 方法处理 HTML 表单。无论使用哪种方法，注意每当点击“Submit\
    \ Form”按钮时，表单都会刷新，输入的内容不再显示在表单上。如果表单处理成功，这是正确的。但如果表单没有处理成功且我们需要用户重新填写表单，这将非常麻烦。对于文本框，我们可以使用\
    \ `echo` 语句修改 `value` 属性。该属性允许我们在文本框中预填充文本。或者，将 `<input type = \"text\" name =\
    \ \"studentname\" value = \"Your Name\"> 改为：\n\n```html\n<input type = \"text\"\
    \ name = \"studentname\" value=\"<?php echo \"Your Name ?>\">\n```\n\n分析上面的代码，你会发现我们将“Your\
    \ Name”替换成了如下的 PHP 代码块：\n\n```php\n<?php\nif (isset($_POST['studentname']))\n\
    \    echo $_POST['studentname'];\n?>\n```\n\n这段代码首先检查 `$_POST['studentname']`\
    \ 是否设置。如果是（即用户提交了该字段的数据），我们使用 `echo` 语句预填充文本框。对于复选框、单选按钮和下拉列表，预填充这些元素变得有点复杂。我们需要知道哪个选项被选中了。让我们通过复选框来看例子。在标签中添加单词“checked”（不带引号），例如：\n\
    \n```html\n<input type=\"checkbox\" name=\"subj[]\" value=\"EL\" checked>\n```\n\
    \n会导致“English”复选框被选中。如果我们想让 PHP 动态选择这个复选框，我们需要将上面的代码替换为：\n\n```html\n<input type=\"\
    checkbox\" name=\"subj[]\" value=\"EL\">\n<?php\nif (isset($_POST['subj']) &&\
    \ in_array('EL', $_POST['subj']))\n    echo 'checked';\n?>\n```\n\n在这里，我们使用 PHP\
    \ 检查 `$_POST['subj']` 是否设置以及当前选项是否被选中。如果是，`in_array('EL', $_POST['subj'])` 在 `$_POST['subj']`\
    \ 数组中找到并返回 `true`。如果是这样，输出 `'checked'` 来选择这个复选框。这动态选择了“English”复选框。\n\n### 8.1.5\
    \ 过滤用户输入\n\n接下来，讨论如何在表单中过滤用户输入。过滤指的是清理（sanitization）和验证（validation）。清理是从输入中移除无效字符。例如，清理整数涉及移除数字正负号以外的所有字符。验证则是检查输入是否符合某些标准。例如，如果输入应该是电子邮件地址，我们可以使用验证过程检查它确实是电子邮件地址（例如是否包含\
    \ `@` 字符）。为了过滤输入，我们使用名为 `filter_var()` 的内置函数。使用此函数时，我们需要指定使用定义的过滤器之一来过滤输入。例如，如果我们想从整数中移除无效字符，可以使用\
    \ `FILTER_SANITIZE_INT` 过滤器：\n\n```php\n$num = '15abc';\necho filter_var($num,\
    \ FILTER_SANITIZE_INT);\n```\n\n运行上面的代码，你会得到输出 `15`。如果我们想验证邮件地址是否有效，可以使用 `FILTER_VALIDATE_EMAIL`\
    \ 过滤器。如果向函数传递有效的邮件地址，它返回该邮件地址。否则，它返回 `false`。\n\n```php\n$email = 'abc@gmail';\n\
    var_dump(filter_var($email, FILTER_VALIDATE_EMAIL));\n```\n\n给了我们 `bool(false)`，因为“abc@gmail”不是有效的邮件地址（缺少“com”）。\n\
    \n### 8.1.6 跨站脚本\n\n太棒了！我们涵盖了 PHP 中大多数表单处理概念。最后，让我们讨论跨站脚本。为了这个，我需要做一个小演示。将 `form.php`\
    \ 中的 PHP 代码（`</form>` 和 `</body>` 标签之间）改为以下内容：\n\n```php\nif (isset($_POST['studentname']))\n\
    \    echo 'You entered'.$_POST['studentname'].' into the text field';\n```\n\n\
    并刷新页面。在文本字段中输入 `<script>alert('Hacked');</script>` 并点击“Submit Form”按钮。你得到了？你得到了一个显示“Hacked”的警告框。惊讶吗？这个示例演示了\
    \ PHP 中的一个关键安全概念——跨站脚本（XSS）。跨站脚本发生在用户在我们的表单中输入不良代码并提交时。如果我们的网站存储了这段代码（例如在数据库中）并将其显示给另一个用户，恶意代码将在害者的浏览器中执行。在我们的示例中，使用\
    \ JavaScript 创建了一个无害的警告框。为了防止这种情况发生，每当我们显示用户输入的信息时，我们需要小心。有几种方法。最简单的是使用名为 `htmlspecialchars()`\
    \ 的内置函数。该函数将特殊字符转换为 HTML 实体。特殊字符是指在 HTML 中具有特殊意义的字符，如 `<` 和 `>`。如果我们不想代表 HTML\
    \ 标签的开始和结束，我们需要使用 `htmlspecialchars()` 函数。该函数会将 `<` 和 `>` 分别转换为 `&lt;` 和 `&gt;`。因此\
    \ `script&gt;` 将不再被解释为 HTML 标签。为了看到它如何工作，将上面的 PHP 代码改为：\n\n```php\nif (isset($_POST['studentname']))\n\
    \    echo 'You entered '.htmlspecialchars($_POST['studentname']).'.into the text\
    \ field';\n```\n\n为了演示目的，我们只编码文本字段。在实际编码中，你必须对用户允许插入每个表单元素进行编码。\n\n## 8.2 $_SESSION\n\
    \n本章到为止我们涵盖了很多内容。在之前的表单处理章节，你学习了 `$_GET` 和 `$_POST` 超全局变量。在本节中，我们将讨论另一个超全局变量——`$_SESSION`。在\
    \ PHP 中，session 是一种跨页面存储信息的方式。与 `$_GET` 和 `$_POST` 超全局变量一样，`$_SESSION` 是一个关联数组。该数组存储在服务器上，并在\
    \ session 期间对所有页面可用。为了演示 session 的使用，我们需要创建两个页面：`session.php` 和 `session2.php`。现在就开始。首先，在\
    \ `htdocs` 中创建一个名为 `session.php` 的新文件并添加以下代码（行号供参考）：\n\n```php\n<?php\nsession_start();\n\
    $_SESSION['myFavFood'] = 'Pizza';\n$_SESSION['myFavDrink'] = 'Cola';\n$_SESSION['myFavColor']\
    \ = 'Orange';\n// 更新 session\n$_SESSION['myFavDrink'] = 'Beer';\n// 删除 session\
    \ 变量\nunset($_SESSION['myFavColor']);\n?>\n```\n\n在这里，我们使用名为 `session_start()`\
    \ 的内置函数在第 2 行开启一个新的 session。该函数在尚未创建 session 时创建一个新的，如果已存在则恢复当前的。在创建 session 后，我们分别使用\
    \ `myFavFood`、`myFavDrink` 和 `myFavColor` 将 `'Pizza'`、`'Cola'` 和 `'Orange'` 存储到\
    \ `$_SESSION` 超全局变量。接下来，我们在第 9 行通过分配一个新字符串更新 `$_SESSION['myFavDrink']`。最后，在第 12\
    \ 行，我们使用另一个名为 `unset()` 的内置函数删除 `$_SESSION` 超全局变量中的元素。要使用此函数，我们需要传递要删除元素的名称。元素被删除后，我们将无法再次访问它。接下来，在\
    \ `htdocs` 中创建另一个名为 `session2.php` 的文件并添加以下代码：\n\n```php\n<?php\nsession_start();\n\
    echo 'Food: '.$$_SESSION['myFavFood'];\necho 'Drink: '.$$_SESSION['myFavDrink'];\n\
    echo 'Color: '.$$_SESSION['myFavColor'];\n?>\n```\n\n在这里，我们通过调用 `session_start()`\
    \ 来恢复当前的 session。每当我们想要访问 `$_SESSION` 时，都需要调用此函数。接下来，我们使用 `echo` 语句输出存储在 `$_SESSION`\
    \ 中的值。现在，我们准备好演示 session 是如何工作的。为此，在浏览器中加载 `session.php`。这样做，`session.php` 会启动一个新的\
    \ session 并存储数据到 `$_SESSION` 超全局变量。接下来，在浏览器中加载 `session2.php`。根据你 PHP 服务器的错误设置，你将得到类似于所示的输出：\n\
    \n```\nFood: Pizza\nDrink: Beer\nNotice: Undefined index: myFavColor in ...session2.php\
    \ on line 4\nColor:\n```\n\n注意我们得到了 `myFavColor` 的未定义索引？这是因为 `$_SESSION['myFavColor']`\
    \ 在 `session.php` 中通过 `unset()` 函数删除了。除此之外，我们成功获取了 `$_SESSION['myFavFood']` 和\
    \ `$_SESSION['myFavDrink']` 的值。这两个值存储在 `session.php` 中并在 `session2.php` 中检索。这演示了我们如何使用\
    \ `$_SESSION` 超全局变量在不同的 PHP 页面之间存储和检索数据。\n\n## 8.3 $_COOKIE\n\n酷酷！我们到了本章的最后一个主题——cookie。cookie\
    \ 是另一种跨页面访问信息的方式。cookie 本质上是存储在用户计算机上的小文件（与存储在服务器上的 session 不同）。由于 cookie 存储在用户的计算机上，用户可能会操纵它。因此，如果存储的信息是关重要的或敏感的，应该使用\
    \ session。为了创建一个 cookie，我们使用 `setcookie()` 函数。类似于第 3.3 节涵盖的 `header()` 函数，`setcookie()`\
    \ 函数必须在脚本生成任何输出之前被调用。`setcookie()` 函数接受最多七个参数；我们通常提供前三个：cookie 的名称、cookie 的值以及\
    \ UNIX 时间戳格式的过期日期。让我们来看例子。在 `htdocs` 中创建一个 `cookie.php` 文件并添加以下代码：\n\n```php\n\
    <?php\nsetcookie('userName', 'Joy', time() + 3600);\nsetcookie('userAge', 25,\
    \ time() + 3600);\nsetcookie('userLevel', '', time() - 3600); // 修改一个 cookie\n\
    setcookie('userAge', 26, time() + 3600); // 修改一个 cookie\nsetcookie('userLevel',\
    \ '', time() - 3600); // 删除一个 cookie\n?>\n```\n\n对于第一个 cookie (`userName`)，它的值和过期日期分别是\
    \ `'Joy'` 和 `time() + 3600`。`time()` 是一个内置函数，给出当前时间戳；`time() + 3600` 意味着 cookie\
    \ 将 3600 秒（即 1 小时）后过期。接下来，我们有 `userAge` cookie。这个 cookie 设置了两次。当 cookie 被设置多次时，最新的\
    \ cookie 会覆盖之前的。因此，`userAge` 的值从 25 更新为 26。最后，我们有 `userLevel` cookie。该 cookie\
    \ 的初始过期时间为 `time() + 3600`，但随后被更新为 `time() - 3600`。当 cookie 的过期时间在过去时，它就会被删除。让我们看看现在如何访问这些\
    \ cookie。我们使用 `$_COOKIE` 超全局变量。在 `htdocs` 中创建另一个名为 `cookie2.php` 的文件并添加以下代码：\n\
    \n```php\n<?php\necho 'User Name is '.$$_COOKIE['userName'];\necho '<BR>User Age\
    \ is '.$$_COOKIE['userAge'];\necho 'User Level is '.$$_COOKIE['userLevel'];\n\
    ?>\n```\n\n首先，在浏览器中启动 `cookie.php`。这样做，三个 cookie（`userName`、`userAge` 和 `userLevel`）被创建了。接下来，启动\
    \ `cookie2.php`。根据你 PHP 服务器的错误设置，你将得到类似于所示的输出：\n\n```\nUser Name is Joy\nUser\
    \ Age is 26\nNotice: Undefined index: userLevel in ...cookie2.php on line 3\n\
    User Level is\n```\n\n注意我们得到了 `userLevel` 的未定义索引？这是因为 `$_COOKIE['userLevel']`\
    \ 在 `cookie.php` 中通过 `unset()` 函数删除了（等等，文本说的是 `unset()`，但代码使用了带有过去的时间的 `set_cookie`）。实际上，文本说“这是因为\
    \ `$_COOKIE['userLevel']` 被删除了”，但代码显示 `setcookie('userLevel', '', time() - 3600);`。除此之外，我们成功获取了\
    \ `$_COOKIE['userName']` 和 `$_COOKIE['userAge']` 的值。这两个值存储在 `cookie.php` 中并在 `cookie2.php`\
    \ 中检索。\n\n"
- fmt: "\n# Chapter 9: Object-Oriented Programming\n\nIn the next two chapters, we\
    \ are going to cover another important concept in PHP - the concept of object-oriented\
    \ programming (OOP). OOP is a major topic. Hence, a full discussion of it is beyond\
    \ the scope of this book. In this chapter, we’ll cover the core concepts in OOP.\
    \ In the next, we’ll talk about inheritance. Ready? Let’s get started.\n\n## 9.1\
    \ What is OOP?\n\nFirst off, what is OOP? OOP is an approach to programming where\
    \ we organize our code by grouping related variables, constants and functions\
    \ into a `class`. This `class` serves as a template from which we can create what\
    \ is known as `objects`. Objects can then be used to store data and access functions\
    \ defined inside the `class`. Confused? No worries. The best way to understand\
    \ OOP is to look at an example. Let’s write our own `class` now.\n\n## 9.2 Writing\
    \ our own class\n\nTo write our own `class`, we use the `class` keyword, followed\
    \ by the name of the `class`. The name of the `class` is not case-sensitive and\
    \ can contain letters, numbers, or underscores. However, it cannot be a PHP reserved\
    \ word (i.e., a word that has a predefined meaning in PHP, such as `echo`, `switch`,\
    \ `break`, etc.) and cannot start with a number. It is a convention to use `pascal\
    \ case` when naming our `classes`. Pascal case refers to the practice of capitalizing\
    \ the first letter of each word, including the first word (e.g., `ClassName`).\n\
    \nTo create our `class`, let’s first create a file in Brackets and save it as\
    \ `Movie.php` to our `htdocs` folder. Next, add the following code to `Movie.php`:\n\
    \n```php\n<?php\nclass Movie{\n    //Add class members here\n}\n```\n\nHere, we\
    \ use the `class` keyword to declare a `class` called `Movie`. Within the `Movie`\
    \ class (inside the pair of braces `{}`), we are going to add variables, constants\
    \ and functions. Variables and functions declared inside a `class` are known as\
    \ `properties` and `methods` respectively. Collectively, these properties, constants\
    \ and methods are known as `class members`.\n\nWe’ll add properties to our `Movie`\
    \ class first. To do that, add the following code to `Movie.php` (inside the pair\
    \ of braces):\n\n```php\nprivate $id;\npublic $title;\npublic $rentalPrice;\n\
    ```\n\nHere, we declare three properties: `$id`, `$title` and `$rentalPrice`.\
    \ Notice that we did not initialize them in the code above? This is because we’ll\
    \ be initializing them in a special method known as the `constructor` later. Also,\
    \ note that we preceded the property declarations with the words `public` or `private`.\
    \ Don't worry about these keywords at the moment; we’ll come back to them later.\n\
    \nNext, let’s add a constant to our `Movie` class. To do that, add the following\
    \ code to `Movie.php` (inside the pair of braces):\n\n```php\nconst DISCOUNT =\
    \ 10;\n```\n\nHere, we define a constant called `DISCOUNT` and assign the value\
    \ `10` to it. Notice that we define a constant differently here (compared to what\
    \ we learned in Chapter 4.1)? Indeed, to define a constant inside a `class`, we\
    \ do not use the `define()` function. Instead, we use the `const` keyword as shown\
    \ above.\n\nFinally, let’s add some methods to our `class`. As mentioned previously,\
    \ a `method` is a function that is defined inside a `class`. We’ll start with\
    \ the `constructor`. A `constructor` is a magic method in PHP. Magic methods are\
    \ methods that have special functionalities in PHP; their names are predefined\
    \ and always start with two underscores. The `constructor` is named `__construct()`\
    \ and is the first method to be called whenever we create an `object` from the\
    \ `class`. We typically use this method to initialize the properties in the `class`.\n\
    \nAdd the following code to the `Movie` class after the constant (but before the\
    \ closing brace of the `Movie` class):\n\n```php\npublic function __construct($pId,\
    \ $pTitle, $pRentalPrice){\n    $this->id = $pId;\n    $this->title = $pTitle;\n\
    \    $this->rentalPrice = $pRentalPrice;\n}\n```\n\nHere, we define a `constructor`\
    \ with three parameters: `$pId`, `$pTitle` and `$pRentalPrice`. Inside the `constructor`,\
    \ we initialize `$id`, `$title` and `$rentalPrice` with the values of `$pId`,\
    \ `$pTitle` and `$pRentalPrice` respectively. Notice a new keyword `$this` in\
    \ the code above? We’ll explain this keyword later when we learn to create objects\
    \ in the next section. For now, just know that whenever we want to access the\
    \ properties and methods of a `class` inside the `class`, we need to use the `$this`\
    \ keyword, followed by the `->` operator.\n\nNext, let’s add a regular (i.e.,\
    \ non-magic) `method` to our `Movie` class. Add the following method after the\
    \ `__construct()` method (but before the closing brace of the `Movie` class):\n\
    \n```php\npublic function conversion($country){\n    $rate = 1;\n    switch($country){\n\
    \        case 'UK':\n            $rate = 0.76;\n            break;\n        case\
    \ 'Japan':\n            $rate = 110;\n            break;\n    }\n    return round($rate*$this->rentalPrice,\
    \ 2);\n}\n```\n\nHere, we define a `method` called `conversion()`. This method\
    \ has one parameter - `$country` - and converts USD to pounds or yen depending\
    \ on the value of `$country`. Within the method, we declare and initialize a variable\
    \ called `$rate` and use a `switch` statement to update its value based on the\
    \ value of `$country`.\n\nNext, we multiply `$rate` with the `$rentalPrice` property\
    \ (`$rate*$this->rentalPrice`) and pass the product as an argument to a built-in\
    \ function called `round()`. This function accepts two arguments and rounds the\
    \ first argument off to the precision indicated by the second. In our method,\
    \ we round the product off to 2 decimal places. Finally, we use the `return` keyword\
    \ to return the result of the `round()` function. Within the method, notice that\
    \ we did not use the `$this` keyword to access `$country` and `$rate`. This is\
    \ because `$country` is a parameter while `$rate` is a local variable (i.e., declared\
    \ inside the method). In other words, they are not class properties. We use the\
    \ `$this` keyword only when accessing class properties and methods. For instance,\
    \ we use the `$this` keyword to access the `$rentalPrice` property. Got it? Once\
    \ you have added the `conversion()` method to the `Movie` class, our `class` is\
    \ complete. We are now ready to make use of this `class`. To do that, we need\
    \ to create an `object` from it.\n\n## 9.3 Creating an Object\n\nTo create an\
    \ `object`, we use the `new` keyword. An `object` is also known as an `instance`\
    \ of the `class`, and the process of creating an `object` is known as `instantiating`\
    \ the `class`. Create a new file in Bracket and save it as `chap9.php` to your\
    \ `htdocs` folder. Add the following code to `chap9.php`:\n\n```php\n<?php\ninclude\
    \ 'Movie.php';\n$mov1 = new Movie('N001', 'Lusso', 4.99);\n```\n\nHere, we first\
    \ use the `include` statement to include `Movie.php` (which contains the code\
    \ for the `Movie` class). Next, we use the `new` keyword to create a `object`\
    \ called `$mov1`. As `__construct()` is a magic method, PHP looks for `__construct()`\
    \ method and executes it for us automatically. Remember the `$this` keyword in\
    \ our `class` constructor? `$this` refers to the current object. When we use the\
    \ statement `$mov1 = new Movie('N001', 'Lusso', 4.99);` to create `$mov1`, `$this`\
    \ refers to `$mov1`. In other words, when PHP executes the constructor, the statement\
    \ `$this->id = 'N001';` becomes `$mov1->id = 'N001';`. As a result, the value\
    \ `'N001'` gets assigned to the `$id` property of `$mov1`. The same applies to\
    \ the other assignment statements in the constructor. Hence, the values `'Lusso'`\
    \ and `4.99` get assigned to the `$title` and `$rentalPrice` properties of `$mov1`\
    \ respectively.\n\nNext, let’s create a second `object` called `$mov2` using the\
    \ statement below:\n\n```php\n$mov2 = new Movie('P002', 'Junior', 5.99); own```\n\
    \nWhen PHP creates `$mov2` and calls the constructor, `$this` refers to `$mov2`.\
    \ Hence, the statement `$this->id = 'P002';` becomes `$mov2->id = 'P002';`. The\
    \ same applies to the other two assignment statements in the constructor. As a\
    \ result, the values `'P002'`, `'Junior'` and `5.99` get assigned to the `$id`,\
    \ `$title` and `$rentalPrice` properties of `$mov2` respectively. Got it? Good!\
    \ Let’s move on.\n\n## 9.4 Accessing Class Members\n\nAfter creating an object,\
    \ we can use the object name and the `->` operator to access its properties and\
    \ methods. For instance, to access the properties and methods of `$mov1` in `chap9.php`,\
    \ we use the code below:\n\n```php\necho $mov1->title;\necho $mov1->conversion('Japan');\n\
    ```\n\nHere, we first use the `->` operator to access the `$title` property of\
    \ `$mov1`. Next, we use the `->` operator to call the `conversion()` method, passing\
    \ `'Japan'` as an argument to the method. Add the code above to `chap9.php` (after\
    \ the instantiation statements) and load the page, you’ll get Lusso 548.9 as the\
    \ output. Pretty straightforward, right?\n\nNow, suppose we want to access the\
    \ `DISCOUNT` constant defined in the `Movie` class, how do we do that? To access\
    \ a class constant, we do not use the `->` operator. Instead, we use the `::`\
    \ operator. This is because class constants are different from class properties;\
    \ they are allocated once per class, not once for each object. This means that\
    \ all objects of the same class (`$mov1` and `$mov2` in our example) share the\
    \ same constants. In other words, even if there are 100 `Movie` objects, there\
    \ is only one memory location to store the `DISCOUNT` constant. To access the\
    \ `DISCOUNT` constant in the `Movie` class, add the following code to `chap9.php`:\n\
    \n```php\necho Movie::DISCOUNT;\necho $mov1::DISCOUNT;\necho $mov2::DISCOUNT;\n\
    ```\n\nIf you run the code above, you’ll get 10 displayed three times. This shows\
    \ that we can use either the class name (`Movie`) or the object name (`$mov1`\
    \ or `$mov2`) to access a class constant. All three give us the same value as\
    \ they are accessing the same memory location.\n\n## 9.5 Access Modifiers\n\n\
    Now that we know how to create objects and access class members using these objects,\
    \ let’s discuss a concept we skipped previously - the `public` and `private` keywords.\
    \ These two keywords are known as `access modifiers`; they serve as gatekeepers\
    \ controlling where we can access a particular class member. `public` class members\
    \ can be assessed everywhere while `private` class members can only be accessed\
    \ within the class in which they are declared.\n\nIn our `Movie` class, we have\
    \ two `public` properties (`$title` and `$rentalPrice`) and one `private` property\
    \ (`$id`). Previously, we learned to access the `$title` property of `$mov1` in\
    \ `chap9.php`. As `$title` is a public class property, we had no problems accessing\
    \ it in `chap9.php`. Now, let’s try accessing the `$id` property. Add the line\
    \ `echo $mov1->id;` to `chap9.php` and load the page again. What do you get? You\
    \ get `Fatal error: Uncaught Error: Cannot access private property Movie::$id...`\
    \ added to the output, right? This is because `$id` is a private property. As\
    \ private class members can only be assessed within the class in which they are\
    \ declared, we are not allowed to access the `$id` property in `chap9.php`, which\
    \ is outside the class. This is the gist of how access modifiers work; they basically\
    \ control whether we can access a particular class member outside the class in\
    \ which it is declared.\n\nIn PHP, access modifiers are mandatory for properties\
    \ but optional for methods. If we fail to declare the modifier for a property,\
    \ we’ll get an error. If we do not declare the modifier for methods, the default\
    \ is `public`. As of PHP 7.1.0, we can also add access modifiers for constants.\
    \ If we do not declare the modifier for constants, the default is `public`. Besides\
    \ public and private members, PHP also has `protected` members. These members\
    \ can be accessed inside the class in which they are declared and any subclass\
    \ that inherits from that. We’ll discuss protected members in the next chapter.\n\
    \nAt this point, some of you may be wondering why we want class members be private.\
    \ For instance, why bother declaring the `$id` property if we cannot access it?\
    \ The reason is that while private members cannot be accessed outside the class\
    \ in which they are declared, they can be accessed inside it. For instance, we\
    \ can write a function inside the `Movie` class to display the heading based on\
    \ the `$id` property. To see how that works, add the code below to `Movie.php`\
    \ (after the `conversion()` method but before the closing brace of the `Movie`\
    \ class):\n\n```php\npublic function displayHeading($tag){\n    if (substr($this->id,\
    \ 0, 1) == 'N') return \"<h1>$tag</h1>\";\n    else return \"<h2>$tag</h2>\";\n\
    }\n```\n\nThis method checks if `$id` starts with `'N'` using the `substr()` function.\
    \ If it does, it returns an element (as defined by the parameter `$tag`) with\
    \ the word \"Movies\". Else, it returns an element. Next, replace the line `echo\
    \ $mov1->id;` in `chap9.php` with `echo $mov1->displayHeading('H1');`. As `displayHeading()`\
    \ is a public method, we have no problems accessing it outside the class. If you\
    \ run the code now, you’ll get \"Movies\" displayed as an `<h1>` element. Got\
    \ it?\n\n## 9.6 Getter and Setter\n\nIn the previous section, we talked about\
    \ the difference between `public` and `private` class members. Whenever possible,\
    \ we should declare class members as `private` if code outside the class does\
    \ not need to access them. This act of preventing code outside from accessing\
    \ members unnecessarily is known as `encapsulation`. Encapsulation makes it easy\
    \ for us to make changes to class members without affecting code outside the class.\
    \ For instance, if we want to change the name of the `$id` property in our class\
    \ to `$movieID`, we only need to make changes within the class class; any code\
    \ outside the class is not affected. This is one of the advantages of declaring\
    \ a class property as `private`.\n\nAnother advantage of declaring class properties\
    \ as `private` is that it helps prevent unauthorized modifications to object properties.\
    \ To see why this is, add the following code to `chap9.php`:\n\n```php\n$mov1->rentalPrice\
    \ = -20;\necho $mov1->rentalPrice;\n```\n\nHere, we first assign `-20` to the\
    \ `$rentalPrice` property of `$mov1`. Next, we use an `echo` statement to echo\
    \ its value. If you run the code above, you’ll get `-20` as the output. As you\
    \ can see, we manage to change the `$rentalPrice` property of `$mov1` to `-20`.\
    \ This is because `$rentalPrice` is a public property. Hence, we can access it\
    \ outside the class and change it to any value we like. This is definitely not\
    \ desirable as rental price should not be negative. To prevent such modifications\
    \ from happening, we should not declare the `$rentalPrice` property as `public`.\
    \ Instead, we should declare it as `private`.\n\nTry changing the `$rentalPrice`\
    \ property to `private` in `Movie.php` and run `chap9.php` again, what do you\
    \ get? You get something similar to the output below: `Fatal error: Uncaught Error:\
    \ Cannot access private property Movie::$rentalPrice in...`. We are no longer\
    \ allowed to access and modify the `$rentalPrice` property of `$mov1` as it is\
    \ now a private property. Whenever possible, we should always declare our class\
    \ properties as `private`; this helps to prevent any unauthorized access or modifications\
    \ to them. However, if we declare all our class properties as `private`, what\
    \ happens if code outside the class needs to access or modify those properties?\
    \ In cases like these, we can use `getters` and `setters`. These are magic methods\
    \ that allow us to provide limited and controlled access to our `private` and\
    \ `protected` properties. To see how this works, add the following methods to\
    \ `Movie.php` (after the `displayHeading()` method but before the closing brace\
    \ of the `Movie` class):\n\n```php\npublic function __get($propertyRequested){\n\
    \    if ($propertyRequested == 'id') return 'You do not have permission to access\
    \ id.';\n    else return $this->$propertyRequested;\n}\n\npublic function __set($propertyToModify,\
    \ $value){\n    if ($propertyToModify == 'rentalPrice' && $value > $this->rentalPrice)\n\
    \        $this->rentalPrice = $value;\n    else echo 'Failed to modify '.$propertyToModify;\n\
    }\n```\n\nThe first method (`__get()`) is known as a `getter`; it controls which\
    \ property can be accessed outside the class and has one parameter called `$propertyRequested`.\
    \ This parameter stores the name of the property we want to access. Within the\
    \ `__get()` method, we use an `if-else` statement to check if `$propertyRequested`\
    \ equals `'id'`. If it equals, the `__get()` method returns a string informing\
    \ us that we do not have permission to access the `$id` property. Else, it returns\
    \ the property requested.\n\nFor instance, if we want to change the name of the\
    \ `$id` property in our class to `$movieID`, we only need to make changes within\
    \ the class; any code outside the class is not affected. The `__set()` method\
    \ is known as a `setter`; it controls which property can be modified and has two\
    \ parameters: `$propertyToModify` and `$value`. Within the `__set()` method, we\
    \ use an `if-else` statement to check if `$propertyToModify` is `'rentalPrice'`\
    \ and `$value` is greater than `$this->rentalPrice`. If it is, we assign `$value`\
    \ to `$this->rentalPrice`. Else, we echo 'Failed to modify' followed by `$propertyToModify`.\n\
    \n## 9.7 Printing a String Representation of the Object\n\nBesides `__get()` and\
    \ `__set()``, another commonly defined magic method in PHP is the `__toString()`\
    \ method. Let’s add one to our `Movie` class. Add the following code to `Movie.php`\
    \ (after the `__set()` method but before the closing brace of the `Movie` class):\n\
    \n```php\npublic function __toString(){\n    return 'Discount = '.self::DISCOUNT.'<BR>Id\
    \ = '.$this->id. '<BR>Title = '.$this->title. '<BR>Rental Price (USD) = '.$this->rentalPrice;\n\
    }\n```\n\nThis method simply returns a string containing information about the\
    \ `Movie` class. Notice a new keyword, `self`, in the method above? This keyword\
    \ is used to access the `DISCOUNT` constant defined earlier in the class. Previously,\
    \ we learned that to access a class constant outside the class in which it is\
    \ defined, we can use either the class name or the `self` keyword. In the `__toString()`\
    \ method above, we used the `self` keyword. Alternatively, we could have used\
    \ the class name (`Movie::DISCOUNT`) as well.\n\nAfter declaring the `__toString()`\
    \ method, we can use it to print a string representation of our `Movie` class\
    \ objects. To do that, we simply use the `echo` statement. To see how this works,\
    \ add the following lines to `chap9.php` and run the page again:\n\n```php\necho\
    \ '<BR>';\necho $mov1;\n```\n\nyou’ll get Discount = 10% Id = N0001 Title = Lusso\
    \ Rental Price (USD) = 5.99 added to the output.\n"
  raw: 'Chapter 9: Object-Oriented Programming In the next two chapters, we are going
    to cover another important concept in PHP - the concept of object-oriented programming
    (OOP). OOP is a major topic. Hence, a full discussion of it is beyond the scope
    of this book. In this chapter, we’ll cover the core concepts in OOP. In the next,
    we’ll talk about inheritance. Ready? Let’s get started. 9.1 What is OOP? First
    off, what is OOP? OOP is an approach to programming where we organize our code
    by grouping related variables, constants and functions into a class . This class
    serves as a template from which we can create what is known as objects. Objects
    can then be used to store data and access functions defined inside the class.
    Confused? No worries. The best way to understand OOP is to look at an example.
    Let’s write our own class now. 9.2 Writing our own class To write our own class,
    we use the class keyword, followed by the name of the class. The name of the class
    is not case-sensitive and can contain letters, numbers, or underscores. However,
    it cannot be a PHP reserved word (i.e., a word that has a predefined meaning in
    PHP, such as echo , switch , break , etc.) and cannot start with a number. It
    is a convention to use pascal case when naming our classes. Pascal case refers
    to the practice of capitalizing the first letter of each word, including the first
    word (e.g., ClassName). To create our class, let’s first create a file in Brackets
    and save it as Movie.php to our htdocs folder. Next, add the following code to
    Movie.php . <?php class Movie{ //Add class members here } Here, we use the class
    keyword to declare a class called Movie . Within the Movie class (inside the pair
    of braces {} ), we are going to add variables, constants and functions. Variables
    and functions declared inside a class are known as properties and methods respectively.
    Collectively, these properties, constants and methods are known as class members
    . We’ll add properties to our Movie class first. To do that, add the following
    code to Movie.php ( inside the pair of braces): private $id; public $title; public
    $rentalPrice; Here, we declare three properties: $id , $title and $rentalPrice
    . Notice that we did not initialize them in the code above? This is because we’ll
    be initializing them in a special method known as the constructor later. Also,
    note that we preceded the property declarations with the words public or private
    . Don''t worry about these keywords at the moment; we’ll come back to them later.
    Next, let’s add a constant to our Movie class. To do that, add the following code
    to Movie.php ( inside the pair of braces): const DISCOUNT = 10; Here, we define
    a constant called DISCOUNT and assign the value 10 to it. Notice that we define
    a constant differently here (compared to what we learned in Chapter 4.1)? Indeed,
    to define a constant inside a class, we do not use the define() function. Instead,
    we use the const keyword as shown above. Finally, let’s add some methods to our
    class. As mentioned previously, a method is a function that is defined inside
    a class. We’ll start with the constructor. A constructor is a magic method in
    PHP. Magic methods are methods that have special functionalities in PHP; their
    names are predefined and always start with two underscores. The constructor is
    named \_\_construct() and is the first method to be called whenever we create
    an object from the class. We typically use this method to initialize the properties
    in the class. Add the following code to the Movie class after the constant (but
    before the closing brace of the Movie class): public function \_\_construct($pId,
    $pTitle, $pRentalPrice){ $this->id = $pId; $this->title = $pTitle; $this->rentalPrice
    = $pRentalPrice; } Here, we define a constructor with three parameters: $pId ,
    $pTitle and $pRentalPrice . Inside the constructor, we initialize $id , $title
    and $rentalPrice with the values of $pId , $pTitle and $pRentalPrice respectively.
    Notice a new keyword $this in the code above? We’ll explain this keyword later
    when we learn to create objects in the next section. For now, just know that whenever
    we want to access the properties and methods of a class inside the class, we need
    to use the $this keyword, followed by the \-> operator. Next, let’s add a regular
    (i.e., non-magic) method to our Movie class. Add the following method after the
    \_\_construct() method (but before the closing brace of the Movie class): public
    function conversion($country){ $rate = 1; switch($country){ case ''UK'': $rate
    = 0.76; break; case ''Japan'': $rate = 110; break; } return round($rate\*$this->rentalPrice,
    2); } Here, we define a method called conversion() . This method has one parameter
    - $country \- and converts USD to pounds or yen depending on the value of $country
    . Within the method, we declare and initialize a variable called $rate and use
    a switch statement to update its value based on the value of $country . Next,
    we multiply $rate with the $rentalPrice property ( $rate\*$this->rentalPrice )
    and pass the product as an argument to a built-in function called round() . This
    function accepts two arguments and rounds the first argument off to the precision
    indicated by the second. In our method, we round the product off to 2 decimal
    places. Finally, we use the return keyword to return the result of the round()
    function. Within the method, notice that we did not use the $this keyword to access
    $country and $rate ? This is because $country is a parameter while $rate is a
    local variable (i.e., a variable declared inside the method). In other words,
    they are not class properties. We use the $this keyword only when accessing class
    properties and methods. For instance, we use the $this keyword to access the $rentalPrice
    property. Got it? Once you have added the conversion() method to the Movie class,
    our class is complete. We are now ready to make use of this class. To do that,
    we need to create an object from it. 9.3 Creating an Object To create an object,
    we use the new keyword. An object is also known as an instance of the class, and
    the process of creating an object is known as instantiating the class. Create
    a new file in Bracket and save it as chap9.php to your htdocs folder. Add the
    following code to chap9.php : <?php include ''Movie.php''; $mov1 = new Movie(''N0001'',
    ''Lusso'', 4.99); Here, we first use the include statement to include Movie.php
    (which contains the code for the Movie class). Next, we use the new keyword to
    create a Movie object called $mov1 , passing ''N0001'' , ''Lusso'' and 4.99 as
    arguments to the \_\_construct() method. As \_\_construct() is a magic method,
    we do not call it using its name. Instead, when we create a new Movie object,
    PHP looks for the \_\_construct() method and executes it for us automatically.
    Remember the $this keyword in our Movie class constructor? $this refers to the
    current object. When we use the statement $mov1 = new Movie(''N0001'', ''Lusso'',
    4.99); to create $mov1 , $this refers to $mov1 . In other words, when PHP executes
    the constructor, the statement $this->id = $pId; in the constructor becomes $mov1->id
    = ''N0001''; As a result, the value ''N0001'' gets assigned to the $id property
    of $mov1 . The same applies to the other two assignment statements in the constructor.
    Hence, the values ''Lusso'' and 4.99 get assigned to the $title and $rentalPrice
    properties of $mov1 respectively. Next, let’s create a second Movie object called
    $mov2 using the statement below: $mov2 = new Movie(''P0002'', ''Junior'', 5.99);
    When PHP creates $mov2 and calls the constructor, $this refers to $mov2 . Hence,
    the statement $this->id = $pId; in the constructor becomes $mov2->id = ''P0002'';
    The same applies to the other two assignment statements in the constructor. As
    a result, the values ''P0002'' , ''Junior'' and 5.99 get assigned to the $id ,
    $title and $rentalPrice properties of $mov2 respectively. Got it? Good! Let’s
    move on. 9.4 Accessing Class Members After creating an object, we can use the
    object name and the \-> operator to access its properties and methods. For instance,
    to access the properties and methods of $mov1 in chap9.php , we use the code below:
    echo $mov1->title.''<BR>''; echo $mov1->conversion(''Japan'').''<BR>''; Here,
    we first use the \-> operator to access the $title property of $mov1 . Next, we
    use the \-> operator to call the conversion() method, passing ''Japan'' as an
    argument to the method. Add the code above to chap9.php (after the instantiation
    statements) and load the page, you’ll get Lusso 548.9 as the output. Pretty straightforward,
    right? Now, suppose we want to access the DISCOUNT constant defined in the Movie
    class, how do we do that? To access a class constant, we do not use the \-> operator.
    Instead, we use the :: operator. This is because class constants are different
    from class properties; they are allocated once per class, not once for each object.
    This means that all objects of the same class ( $mov1 and $mov2 in our example)
    share the same constants. In other words, even if there are 100 Movie objects,
    there is only one memory location allocated to store the DISCOUNT constant. To
    access the DISCOUNT constant in the Movie class, add the following code to chap9.php
    : echo Movie::DISCOUNT.''<BR>''; echo $mov1::DISCOUNT.''<BR>''; echo $mov2::DISCOUNT.''<BR>'';
    If you run the code above, you’ll get 10 displayed three times. This shows that
    we can use either the class name ( Movie ) or the object name ( $mov1 or $mov2
    ) to access a class constant. All three give us the same value as they are accessing
    the same memory location. 9.5 Access Modifiers Now that we know how to create
    objects and access class members using these objects, let’s discuss a concept
    we skipped previously - the public and private keywords. These two keywords are
    known as access modifiers; they serve as gatekeepers controlling where we can
    access a particular class member. public class members can be assessed everywhere
