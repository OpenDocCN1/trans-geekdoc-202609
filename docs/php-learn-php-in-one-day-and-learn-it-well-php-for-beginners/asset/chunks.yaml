    If we run the code above, we’ll get User input is too big as the output. If we
    change the function call to displayUserInput(16); no exception will be thrown
    and we’ll get 16 as the output. Got it? Great! 12.1.4 Exception Handler In the
    previous sections, we learned to throw and catch exceptions. Some exceptions,
    such as a PDO exception, are easy to pre-empt. Others may be harder. In most cases,
    despite our best efforts, there are bound to be exceptions we fail to anticipate.
    In cases like these, PHP allows us to specify a custom exception handler that
    gets called whenever there are exceptions we fail to catch. We can use this custom
    handler to display a custom message to users. However, after the exception handler
    is called, the PHP script will be terminated . To see how an exception handler
    works, add the following code to the end of exceptionHandling.php : function myExceptionHandler($e)
    { echo ''<BR>Oppsss... An uncaught exception occurred.<BR>''.$e->getMessage();
    } set\_exception\_handler(''myExceptionHandler''); Here, we define a function
