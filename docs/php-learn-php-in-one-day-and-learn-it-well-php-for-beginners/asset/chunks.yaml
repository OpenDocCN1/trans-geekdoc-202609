  trans: "\n\n# 第 13 章：项目\n\n恭喜你读到了本书的最后！在之前的章节中，我们学习了很多。学习编程最好的方法就是完成一个实际项目。在本章中，我们将一起完成一个项目。这个项目涵盖了你在之前章节中学到的许多概念，并让你看到所有内容是如何协同工作的。我们还将在这个项目中介绍一些新的杂杂概念。\
    \ 期待吗？让我们开始吧！\n\n## 13.1 关于项目\n\n这个项目涉及创建一个类似于迷你博客的网站，拥有管理员账户的用户可以登录并发布文章。在博客上发布文章时，管理员用户可以选择是否让该文章对非成员或成员可见。管理员和成员需要登录，而非成员不需要。管理员可以读写写文章，成员在登录后可以阅读“成员专属”文章，而非成员只能阅读“公共”文章。当成员或管理员登录网站时，网站会检索他/她最后阅读的文章并通知他/她哪些文章是新的。要查看网站如何运行的演示，请访问\
    \ `https://learncodingfast.com/php`。\n\n## 13.2 致谢与要求\n\n此项目使用了 HTML、CSS、Javascript、PHP\
    \ 和 MySQL。理解 HTML（特别是 HTML 表单）和 SQL 对于该项目至关重要。本章仅涵盖 PHP，并将引导你完成所有用到的 PHP 代码。所有的\
    \ HTML、CSS、Javascript 和 SQL 代码都将提供给你。你可以在 `https://learncodingfast.com/php` 下载它们。然而，由于项目使用了\
    \ Bootstrap (`https://getbootstrap.com/`) 作为用户界面并使用 CKEditor (`https://ckeditor.com/ckeditor-4/`)\
    \ 作为文本编辑器，它们的代码将不会提供。相反，`<head>` 元素中提供链接以从各自的内容交付网络（CDN）引入这些文件。这意味着在运行项目代码时需要连接互联网。这里提供的某些说明（例如创建数据库和用户）专门针对\
    \ XAMPP。如果你没有使用 XAMPP，将必须参考软件的文档来获取特定说明。最后，此项目使用 PHP 5.5 及以上版本。如果你刚刚下载了 XAMPP，内置的\
    \ PHP 解释器至少是 PHP 7。\n\n## 13.3 项目结构\n\n项目的主文件夹是 `phpproject`。在主文件夹内部，我们有八个文件：`admin.php`、`error.html`、`index.php`、`logout.php`、`read.php`、`signup.php`、`UI_include.php`\
    \ 和 `write.php`。这些文件负责博客的用户界面。除了这八个文件，我们还有一个名为 `includes` 的子文件夹。在 `includes` 内部，我们有三个文件：`loadclasses.php`、`header.html`\
    \ 和 `debugging.php`。我们还有三个子文件夹：`process`（包含用于处理 HTML 表单的文件）、`classes`（包含定义类的文件）和\
    \ `css`（包含 CSS 代码的文件）。\n\n## 13.4 创建数据库、用户账户和表\n\n在我们开始编写 PHP 代码之前，我们需要创建数据库、表和用户账户。首先，确保你已经启动了\
    \ XAMPP 以及 Apache 和 MySQL 服务器。接下来，访问 `http://localhost/phpmyadmin/index.php` 并按照第\
    \ 11.5 节的说明创建一个名为“project”的数据库。接着，为“project”数据库创建一个具有以下信息的的用户：\n- 用户名：`project_admin`\n\
    - 主机名：`localhost`\n\n为该用户选择一个你自己的密码并点击“执行（Go）”来创建用户。完成后，点击页面顶部的 SQL 选项卡，并将以下 SQL\
    \ 代码复制到编辑器中。这段代码可以在 `https://learncodingfast.com/php` 下载。\n\n```sql\nUSE project;\n\
    CREATE TABLE IF NOT EXISTS members (\n  username VARCHAR(100) PRIMARY KEY,\n \
    \ password VARCHAR(255) NOT NULL,\n  is_admin BOOLEAN DEFAULT false,\n  last_viewed\
    \ int DEFAULT 0\n);\nCREATE TABLE IF NOT EXISTS posts(\n  id INT AUTO_INCREMENT\
    \ PRIMARY KEY,\n  post_date TIMESTAMP DEFAULT NOW() NOT NULL,\n  username VARCHAR(100)\
    \ NOT NULL,\n  title VARCHAR(255) NOT NULL,\n  post TEXT NOT NULL,\n  audience\
    \ INT NOT NULL,\n  CONSTRAINT FOREIGN KEY (username) REFERENCES members(username)\
    \ ON DELETE CASCADE\n);\n```\n\n上述代码为“project”数据库创建了两个表：“members”和“posts”。点击“执行”来运行代码。完成后，我们就可以开始编写\
    \ PHP 代码了。\n\n## 13.5 编辑 classes 文件夹\n\n首先，导航到你的 `htdocs` 文件夹并将解压后的 `phpproject`\
    \ 文件夹粘贴其中。接下来，在浏览器中启动 `http://localhost/phpproject/index.php`。如果你看到下面的页面，说明一切正常。关闭浏览器并导航到电脑上的\
    \ `htdocs\\phpproject\\includes\\classes` 文件夹。你应该会在里面看到五个 PHP 文件。\n\n### 13.5.1\
    \ Helper.php\n\n我们将从 `Helper.php` 开始。在 Brackets 中打开此文件；你会看到我们创建了一个名为 `Helper`\
    \ 的类。该类没有属性和构造函数。在类内部，我们的任务是实现五个公共方法——`passwordsMatch()`、`isValidLength()`、`isEmpty()`、`isSecure()`\
    \ 和 `keepValues()`。\n\n让我们从 `passwordsMatch()` 开始。该方法有两个参数 `$pw1` 和 `$pw2`。在项目中，为了代码兼容旧版本的\
    \ PHP，我们不会在函数和方法中使用声明。尝试声明 `passwordsMatch()`。在方法内部，我们需要检查两个参数的值是否相等。如果是，返回 `true`。否则返回\
    \ `false`。提示：你需要使用 `if-else` 语句。一旦完成了 `if-else` 语句，`passwordsMatch()` 方法就完成了。\n\
    \n接下来，让我们来看 `isValidLength()`。该方法有三个参数—— `$str`、 `$min` 和 `$max`。`$min` 的默认值为\
    \ `8`，而 `$max` 的默认值为 `20`。如果你熟悉函数（和方法）默认值，可以参考第 7 章。在方法内部，我们需要检查 `$str` 的长度是否小于\
    \ `$min` 或大于 `$max`。如果是，返回 `false`。否则返回 `true`。提示：你可以使用内置函数 `strlen()` 获取 `$str`\
    \ 的长度。\n\n在 `isValidLength()` 之后，我们有 `isEmpty()`。该方法有一个存储数组的参数 `$postValues`。在方法内部，我们需要使用\
    \ `foreach` 循环遍历 `$postValues` 中的每个元素，并使用 `if` 语句检查是否为空字符串。如果是，返回 `true`。在遍历所有元素后，如果没有找到空字符串，返回\
    \ `false`。也就是说，在 `foreach` 循环之外返回 `false`。尝试编写此方法。你可以参考第 6.3 节获取关于 `foreach` 循环的帮助。\n\
    \n接下来，我们有 `isSecure()`。该方法有一个参数 `$pw`，检查 `$pw` 是否包含至少一个小写字母、一个大写字母和一个数字。为了实现，我们需要使用正则表达式。正则表达式允许我们将上述要求（英文编写）翻译成\
    \ PHP 可以理解的表达式。所有正则表达式必须以分隔符开头和结尾。常用的分隔符包括斜杠 (`/`)、井号 (`#`) 和波浪号 (`~`)。我们在代码中使用波浪号。“至少一个小写字母”的正则表达式是\
    \ `~[a-z]+`，其中 `~` 是分隔符，`[a-z]` 代表小写字母集，`+` 代表“至少一个”。至少一个大写字母”的正则表达式是 `~A-Z]+`，“至少一个数字”的是\
    \ `~0-9]+`。为了检查 `$pw` 是否满足上述正则表达式，我们需要使用内置函数 `preg_match()`。该函数接受两个参数——正则表达式和要检查的字符串。为了检查\
    \ `$pw` 是否包含至少一个小写字母，我们写下 `preg_match(\"~[a-z]+\", $pw)`，如果 `$pw` 包含至少一个小写字母，它返回\
    \ `true`。否则返回 `false`。我们的 `isSecure()` 方法需要应用三次 `preg_match()` 函数来检查是否满足所有三个要求。如果三个都满足，返回\
    \ `true`。否则返回 `false`。尝试自己这样做。\n\n完成了吗？最后，让我们来看 `Helper` 类中最复杂的方法。该方法用于在表单处理失败时保留用户输入（你可以参考第\
    \ 8.1.4 节获取更多细节）。为了实现这一点，我们需要在表单重载时用用户之前的输入填充表单。预填充文本框，我们使用 `value` 属性。例如，`<input\
    \ type=\"text\" value=\"Hello\">` 会在文本框中填充“Hello”。预填充文本区域，我们在 `<textarea>` 开始和结束标签之间包含文本。例如，`<textarea>Hello</textarea>`\
    \ 会在文本区域中填充“Hello”。预选下拉列表，我们在选中的选项中添加“selected”单词。例如，`<select><option value='P'>Public</option><option\
    \ value='M' selected>Members Only</option></select>` 会预选“成员专属”选项。我们现在的任务是写一个方法为我们预填充/预选用户输入。这个方法名为\
    \ `keepValues()`，并有三个参数—— `$val`、 `$type` 和 `$attr`。 `$val` 代表用户提交的值。对于文本框和文本区域，提交的值是输入相应表单元素的文本。对于下拉列表，提交的值是赋值给选中选项\
    \ `value` 属性的字符串。例如，在上面的下拉列表中，如果选择了第二个选项，提交的值是 'M'（而不是“成员专属”）。`$type` 代表表单元素的类型。`$attr`\
    \ 仅适用于下拉列表且默认值为 `''`（空字符串）。它代表赋值给下拉列表选项 `value` 属性的字符串。例如，对于上面的下拉列表，第一个选项的 `$attr`\
    \ 是 'P'，第二个选项是 'M'。尝试自己声明这个方法。接下来，在方法内部，我们有以下 `switch` 语句：\n\n```php\nswitch ($type){\n\
    \  case 'textbox':\n    echo \"value = '$val'\";\n    break;\n  case 'textarea':\n\
    \    // 在此处添加代码\n  case 'select':\n    // 在此处添加代码\n}\n```\n\n该语句使用 `$type` 的值来决定什么。第一个\
    \ `case` 已经为你完成了。根据描述，尝试自己完成其他 `case` 并输出相应的字符串。提示：对于 'select' 情况，我们需要使用 `if`\
    \ 语句来比较 `$val`（用户提交的值）和 `$attr`（赋值给属性的字符串）以决定输出什么。明白了吗？你可能需要多次阅读这一部分来完成这个 `switch`\
    \ 语句。一旦你完成了 `switch` 语句，`keepValues()` 方法就完成了，`Helper` 类也是如此。\n\n### 13.5.2 Database.php\n\
    \n让我们来看 `Database.php`。在该文件中，我们创建了一个名为 `Database` 类，带有三个常量（`SELECTSINGLE`、`SELECTALL`\
    \ 和 `EXECUTE`）和一个私有属性（`pdo`）。此外，我们有一个构造函数用于创建一个新的 PDO 对象。在构造函数中，第 13 行修改“Password”为实际密码。注意\
    \ `$pdo` 是 `Database` 类的属性，我们在第 9.2 章学过访问属性需要使用 `$this`。因此，在第 13 行将 `$pdo = ...`\
    \ 修改为 `$this->pdo = ...`。尝试自己这样做。\n\n接下来，我们需要向 `Database` 类添加一个公共方法 `queryDB()`。为了编写此方法，你需要熟悉\
    \ PHP 中的预处理语句。如果不熟悉，可以参考第 5.3 章。`queryDB()` 方法有三个参数—— `$sql`、 `$mode` 和 `$values`。\
    \ `$sql` 代表要执行的 SQL 语句， `$mode` 表示是否需要从数据库获取任何行，`$values` 的默认值为 `array()`（空数组），用于绑定\
    \ SQL 语句中的占位符。尝试自己声明该方法。在方法内部，我们需要使用 `$this->pdo` 属性（提醒：通过 `$this->pdo` 访问它）来准备\
    \ SQL 语句（`sql`），并将结果赋值给变量 `$stmt`。尝试自己这样做。接下来，我们需要绑定 SQL 语句中的占位符。假设占位符是 `:username`\
    \ 和 `:password`，要绑定的变量分别是 `$uname` 和 `$pwd`，用户需要将以下数组传递给 `queryDB()` 方法：\n\n```php\n\
    $values = array(\n  array(':username', $uname),\n  array(':password', $pwd)\n\
    );\n```\n\n为了处理这个数组，我们使用下面的 `foreach` 循环：\n\n```php\nforeach($values as $valueToBind){\n\
    \  $stmt->bindValue($valueToBind[0], $valueToBind[1]);\n}\n```\n\n当循环第一次运行时，数组\
    \ `(':username', $uname)` 被赋值给 `$valueToBind`。在循环内部，我们使用 `bindValue()` 方法将 `$uname`\
    \ (`$valueToBind[1]`) 绑定到 `:username` (`$valueToBind[0]`)。当循环第二次运行时，我们使用 `bindValue()`\
    \ 方法将 `$pwd` 绑定到 `:password`。明白了吗？最后，我们需要使用第二个参数 `$mode` 来决定是否获取任何结果。这个 `if` 语句的作用类似于下面的伪代码：\n\
    \n```\nif ($mode != SELECTSINGLE && $mode != SELECTALL && $mode != EXECUTE){\n\
    \  throw new Exception('Invalid Mode');\n} elseif ($mode == SELECTSINGLE){\n \
    \ return $stmt->fetch(PDO::FETCH_ASSOC);\n} elseif ($mode == SELECTALL){\n  return\
    \ $stmt->fetchAll(PDO::FETCH_ASSOC);\n}\n```\n\n首先，我们检查 `$mode` 的值是否有效（即它必须是 `SELECTSINGLE`、`SELECTALL`\
    \ 或 `EXECUTE`）。接下来，我们检查 `$mode` 是 `SELECTSINGLE` 还是 `SELECTALL`，并分别使用变量 `$stmt`\
    \ 调用 `fetch(PDO::FETCH_ASSOC)` 或 `fetchAll(PDO::FETCH_ASSOC)` 方法。我们然后使用 `return`\
    \ 关键字返回获取的结果。尝试自己将伪代码转换为 PHP 代码。提示：要访问 `Database` 类中定义的常量，你需要使用 `self` 关键字或类名后跟\
    \ `::` 操作符。例如，要访问 `EXECUTE`，你可以写 `Database::EXECUTE`。关于在类中使用常量，请参考第 9.7 章。要抛出异常，你创建一个新的\
    \ `Exception` 对象并将错误消息传递给构造函数。参考第 12.1.3 章关于抛出异常。一旦你完成了 `if` 语句，`queryDB()` 方法就完成了，`Database`\
    \ 类也是如此。\n\n### 13.5.3 BlogReader.php\n\n让我们来看 `BlogReader` 类。该类有两个常量——`READER`\
    \ 和 `MEMBER`，分别为 1 和 2。此外，它有两个保护属性—— `$db` 和 `$type`。构造函数已经为你写好了：\n\n```php\n\
    public function __construct(){\n  $this->db = new Database();\n  $this->type =\
    \ BlogReader::READER;\n}\n```\n\n这初始化了 `$db` 和 `$type`。现在，我们需要为类添加一个方法 `getPostsFromDB()`。该方法是公共且没有参数；尝试自己声明它。blog\
    \ reader 指的是未登录的读者。未登录的读者只能读取 `posts` 表中 `audience` 小于 1 的文章。因此，在 `getPostsFromDB()`\
    \ 方法中，我们需要使用以下语句：\n\n```sql\n$sql = \"SELECT id, unix_timestamp(post_date) as\
    \ post_date, username, title FROM posts WHERE audience <= :audience ORDER BY id\
    \ DESC\";\n```\n\n将上述语句添加到 `getPostsFromDB()` 方法；我们将使用 `$stmt->execute()` 方法来执行。该语句有一个占位符\
    \ `:audience`。根据我们在 `Database` 类中提到的，我们需要创建一个数组并使用它来绑定到占位符：\n\n```php\n$values\
    \ = array(\n  array(':audience', $this->type)\n);\n```\n\n在这里，我们将 `$type` 属性绑定到\
    \ `:audience` 占位符。由于我们之前将 `BlogReader::READER`（等于 1）赋值给了 `$type` 属性，我们在构造函数里本质上是将\
    \ 1 绑定到 `:audience` 占位符。明白了吗？接下来，我们需要使用 `Database` 对象 `$db` 来调用 `queryDB()` 方法：\n\
    \n```php\n$result = $this->db->queryDB($sql, Database::SELECTALL, $values);\n\
    ```\n\n在这里，我们将结果赋值给变量 `$result`。模式是 `Database::SELECTALL`，因为我们从 `posts` 表中检索多行。接下来，我们需要检查\
    \ `queryDB()` 方法是否返回了任何行。为了这样做，我们检查 `$result` 中是否有任何元素。如果没有，返回 0。否则返回 `$result`\
    \ 数组。尝试自己编写这个语句。提示：你可以使用 `count()` 函数获取 `$result` 中的元素数量。一旦完成，`getPostsFromDB()`\
    \ 方法就完成了，`BlogReader` 类也是如此。\n\n### 13.5.4 BlogMember.php\n\n现在让我们写一个继承 `BlogReader`\
    \ 的类。打开 `BlogMember.php` 并创建一个名为 `BlogMember` 的新类。该类继承 `BlogReader` 类并有一个私有属性\
    \ `$username`。尝试自己声明该类。在类内部，我们有一个带有参数 `$pUsername` 的构造函数。在构造函数中，我们需要调用 `parent`\
    \ 构造函数来初始化属性 `$db`。接下来，我们需要将 `$pUsername` 赋值给 `$username` 属性，并将 `BlogMember::MEMBER`（继承自\
    \ `BlogReader` 类）赋值给属性 `$type`。尝试自己实现构造函数。提示：你需要使用 `parent` 关键字后跟 `::` 操作符来调用父类构造函数。明白了吗？好！在实现构造函数后，你需要实现另外六个方法。这些方法是：\n\
    \n```php\npublic function isDuplicateID()\npublic function insertIntoMemberDB($pPassword)\n\
    public function isValidLogin($pPassword)\nprivate function getLatestPostID()\n\
    public function updateLastViewedPost()\npublic function getLastViewedPost()\n\
    ```\n\n让我们从 `isDuplicateID()` 方法开始。该方法是公共且没有参数的。每当新用户注册时就会调用它，如果新用户选择的用户名已存在于\
    \ `members` 表中则返回 `true`。尝试自己声明该方法。在方法内部，我们需要执行以下 SQL 语句：\n\n```sql\nSELECT count(username)\
    \ AS num FROM members WHERE username = :username\n```\n\n如果没有找到绑定到 `:username`\
    \ 的用户名，该语句返回 0。尝试使用 `Database` 类中的 `queryDB()` 方法执行此 SQL 语句。你需要将 `$username` 属性绑定到\
    \ `:username` 并使用 `Database::SELECTSINGLE` 模式（因为我们只从数据库选择一行）调用 `queryDB()` 方法。尝试自己这样做。你可以参考\
    \ `BlogReader` 类中的 `getPostsFromDB()` 方法了解如何使用 `queryDB()` 方法。明白了吗？一旦完成，将 `queryDB()`\
    \ 返回的结果赋值给变量 `$result`。接下来，使用 `if` 语句检查 `$result['num']` 是否等于零。如果是，返回 `false`。否则返回\
    \ `true`。尝试自己编写这个方法。一旦完成了 `isDuplicateID()` 方法，我们可以处理 `insertIntoMemberDB()` 方法。该方法是公共的并有一个参数\
    \ `$pPassword`。它用于在 `members` 表中插入新行，当新用户注册时 `$pPassword` 存储用户输入的密码。在方法内部，我们需要使用\
    \ `Database::EXECUTE` 模式 `queryDB()` 方法（因为我们没有获取任何数据）执行以下 SQL 语句：\n\n```sql\n\
    INSERT INTO members (username, password) VALUES (:username, :password)\n```\n\n\
    为了执行此语句，我们需要将 `$username` 属性绑定到 `:username`，并将 `$pPassword` 绑定到 `:password`。然而，由于\
    \ `$pPassword` 存储的是用户输入的密码，我们不应该以原始格式存储在数据库中。相反，我们应该先对其哈希。可以使用内置函数 `password_hash()`\
    \ 完成。该函数从 PHP 5 开始并接受两个参数——要加密的字符串和使用的算法。使用的算法可以在 `https://www.php.net/manual/en/password.constants`\
    \ 找到。在我们的项目中，我们将使用 `PASSWORD_DEFAULT` 作为常量。因此，在绑定 `:username` 和 `:password` 占位符时，我们使用下面的数组：\n\
    \n```php\n$values = array(\n  array(':username', $username),\n  array(':password',\
    \ password_hash($pPassword, PASSWORD_DEFAULT))\n);\n```\n\n使用该数组和 `Database::EXECUTE`\
    \ 常量调用 `queryDB()` 方法。一旦完成，`insertIntoMemberDB()` 方法就完成了。由于 `queryDB()` 方法在模式为\
    \ `Database::EXECUTE` 时不返回任何结果，因此不需要返回。明白了吗？好！让我们来看 `isValidLogin()` 方法。该方法是公共的并有一个参数\
    \ `$pPassword`。它在用户登录时检查用户名和密码是否有效。在方法内部，我们需要使用 `queryDB()` 方法执行以下语句：\n\n```sql\n\
    SELECT password FROM members WHERE username = :username\n```\n\n为了这样做，我们需要将 `$username`\
    \ 属性绑定到 `:username` 并使用 `Database::SELECTSINGLE` 模式（因为我们只从数据库选择一行）。尝试自己完成。然后将结果赋值给变量\
    \ `$result`。接下来，我们需要检查 `$result['password']` 是否。除了检查 `$result['password']` 设置，我们还需要检查用户输入的密码是否与从数据库获取的密码匹配。记得数据库中存储的密码是哈希过的。为了检查哈希密码是否匹配用户输入的密码，我们需要使用另一个内置函数\
    \ `password_verify()`。该函数接受两个参数，如果第一个匹配第二个，则返回 `true`。第二个参数必须是通过 `password_hash()`\
    \ 函数哈希过的。在我们的 `isValidLogin()` 方法中，为了判断密码匹配，我们使用以下 `if` 语句：\n\n```php\nif (isset($result['password'])\
    \ && password_verify($pPassword, $result['password']))\n  return true; \nelse\n\
    \  return false;\n```\n\n将上述语句添加到 `isValidLogin()` 方法，方法就完成了。好！让我们继续 `getLatestPostID()`\
    \ 方法。这是一个没有参数的私有方法，稍将在 `updateLastViewedPost()` 方法中使用。尝试自己声明。在方法内部，我们需要使用 `queryDB()`\
    \ 方法执行以下语句：\n\n```sql\nSELECT max(id) AS max FROM posts\n```\n\n为此 SQL 语句选择合适的模式并尝试调用\
    \ `queryDB()` 方法。注意，对于此语句不需要向 `queryDB()` 方法传递任何数组，因为语句不包含任何占位符。一旦执行 `queryDB()`\
    \ 方法，将结果赋值给变量 `$result`。如果 `posts` 表中文章，上述语句将返回 `NULL`。因此，我们需要首先检查 `$result['max']`\
    \ 是否设置。如果是，返回它的值。否则返回 0。尝试自己这样做。一旦完成，`getLatestPostID()` 方法就完成了，我们可以继续 `updateLastViewedPost()`\
    \ 方法。该方法是公共且没有参数。尝试自己声明。在方法内部，我们需要更新 `members` 表的 `last_viewed` 列以反映成员查看的最新文章。每当成员登录我们的网站时，该成员的\
    \ `last_viewed` 值将更新为 `posts` 表中最新文章的 ID。这个 ID 由我们之前写的 `getLatestPostID()` 方法提供。为了使用该方法，在\
    \ `updateLastViewedPost()` 方法中添加此行：\n\n```php\n$max = $this->getLatestPostID();\n\
    ```\n\n在这里，我们使用 `$this` 关键字调用 `getLatestPostID()` 方法并将结果赋值给 `$max`。接下来，我们需要使用\
    \ `queryDB()` 方法执行以下 SQL 语句：\n\n```sql\nUPDATE members SET last_viewed = :max\
    \ WHERE username = :username\n```\n\n为了执行此语句，我们需要将 `$username` 属性绑定到 `:username`并将变量\
    \ `$max` 绑定到 `:max`。此外，我们需要决定在调用 `queryDB()` 时使用合适的模式。尝试自己完成。一旦完成，方法就完成了。最后，我们来看\
    \ `getLastViewedPost()` 方法。该方法是公共且没有参数的。它使用 `queryDB()` 方法执行以下语句：\n\n```sql\n\
    SELECT last_viewed FROM members WHERE username = :username\n```\n\n为了执行此语句，我们需要将\
    \ `$username` 属性绑定到 `:username` 并使用 `Database::SELECTSINGLE` 模式（因为我们只从数据库选择一行）调用\
    \ `queryDB()` 方法。一旦完成，将结果赋值给变量 `$result`。接下来，我们需要检查 `$result['last_viewed']` 是否设置。除了检查\
    \ `$result['last_viewed']` 设置，我们还需要检查用户输入的密码（注：这里应该是 `last_viewed`，此处原文可能有误，根据逻辑翻译）。尝试自己完成该方法完成。\n\
    \n## 13.6 编辑 process 文件夹\n\n`process` 文件夹中的文件用于处理 HTML 表单。\n\n### 13.6.1 p-index.php\n\
    \n我们将从 `p-index.php` 开始。该文件用于处理 `index.php`，其中包含一个成员登录“成员专属”文章的表单。`index.php`\
    \ 有两个名为“username”和“password”的输入框和一个名为“submit”的按钮。如果在处理 `index.php` 时发生错误，页面将输出在变量\
    \ `$msg` 中的错误信息。如果你打开 process 文件夹中的 `p-index.php`，你会发现代码已经为你完成了。这样做是为了让你处理其他文件时参考此文件。让我们一起运行代码。首先，声明变量\
    \ `$h` 并为其分配一个新的 `Helper` 对象。接下来，声明两个变量 `$msg` 和 `$username` 并为它们分配空字符串。声明并初始化变量后，准备好处理\
    \ `index.php` 中的表单。我们使用以下 `if` 语句检查“submit”按钮是否被点击：\n\n```php\nif (isset($_POST['submit']))\
    \ {\n}\n```\n\n在 `if` 块内部，我们首先将 `$_POST['username']` 赋值给 `$username`。我们需要这样做，因为稍后会在\
    \ `index.php` 中使用 `$username`。接下来，我们使用 `if-else` 语句检查用户是否都在“username”和“password”输入框中输入了数据。为了这样做，我们使用\
    \ `$h` 调用 `Helper` 类中的 `isEmpty()` 方法。该方法接受一个包含我们想要检查的所有变量的数组。向方法传递以下数组：\n\n```php\n\
    array($username, $_POST['password'])\n```\n\n如果数组中的任何元素为空字符串，`isEmpty()` 方法将返回\
    \ `true`。当发生这种情况时，执行 `if` 块并将字符串“所有字段均为必填”赋值给 `$msg`。相反，如果元素都不为空，则执行 `else` 块。在\
    \ `else` 块内部，我们创建一个名为 `$member` 的 `BlogMember` 对象。接下来，我们有另一个 `if-else` 语句。这个内部\
    \ `if-else` 语句使用 `$member` 对象调用 `BlogMember` 类中的 `isValidLogin()` 方法。如果方法返回 `false`，条件\
    \ `!$member->isValidLogin($_POST['password'])` 结果为 `true`（因为 !false 等于 true），并执行\
    \ `if` 块。随后会将字符串“用户名或密码错误”赋值给 `$msg`。相反，如果方法返回 `true`，则执行 `else` 块。在这个 `else`\
    \ 块中，我们将 `$username` 赋值给会话变量 `$_SESSION['username']` 并使用 `header()` 函数将用户重定向到\
    \ `read.php`。一旦完成，`p-index.php` 页面就完成了。仔细检查 `p-index.php` 并确保在继续之前理解了它。明白了吗？好！\n\
    \n### 13.6.2 p-admin.php\n\n现在来看 `p-admin.php` 文件。该文件用于处理 `admin.php`，其中包含一个管理员登录的表单。`admin.php`\
    \ 有两个名为“username”和“password”的输入框和一个名为“submit”的按钮。如果在处理 `admin.php` 时发生错误，页面将输出在变量\
    \ `$msg` 中的错误信息。正如你所料，`p-admin.php` 与 `p-index.php` 非常相似。这是我们在 `p-admin.php` 中需要做的：首先，声明\
    \ `$h` `$msg` 和 `$username`。接下来，检查“submit”按钮是否被点击。如果是，将 `$_POST['username']` 赋值给\
    \ `$username`。接下来，我们需要确保所有输入框都不为空。如果任何一个框为空，并将相应的错误信息赋值给 `$msg`。为了这样做，我们使用 `$h`\
    \ 调用 `Helper` 类中的 `isEmpty()` 方法。该方法接受一个包含我们想要检查的所有变量的数组。向方法传递以下数组：\n\n```php\n\
    array($username, $_POST['password'])\n```\n\n如果数组中的任何元素为空字符串，`isEmpty()` 方法将返回\
    \ `true`。当发生这种情况时，执行 `if` 块并将字符串“所有字段均为必填”赋值给 `$msg`。相反，如果元素都不为空，则执行 `else` 块。在\
    \ `else` 块内部，我们创建一个名为 `$admin` 的 `Admin` 对象。接下来，我们有另一个 `if-else` 语句。这个内部 `if-else`\
    \ 语句使用 `$admin` 对象调用 `Admin` 类中的 `isValidLogin()` 方法。正如我们所说的，该方法执行以下 SQL 语句：\n\
    \n```sql\nSELECT password FROM members WHERE username = :username AND is_admin\
    \ = true\n```\n\n尝试自己编写该方法。如果方法返回 `false`，将“管理员登录错误”赋值给 `$msg`。相反，如果方法返回 `true`，则执行\
    \ `else` 块。在这个 `else` 块中，我们将 `$username` 赋值给会话变量 `$_SESSION['username']`并将 `$_SESSION['is_admin']`\
    \ 赋值为 `true`。最后，使用 `header()` 函数将用户重定向到 `read.php`。明白了吗？好！\n\n### 13.5.5 Admin.php\n\
    \n我们剩下的最后一个类要编写——`Admin`。`Admin` 类有两个私有属性—— `$db` 和 `$username`。在类内部，我们有一个带有参数\
    \ `$pUsername` 的构造函数（不，这里应该是构造函数初始化 `$db` 和 `$type`）。构造函数已经为你写好了：\n\n```php\n\
    public function __construct(){\n  $this->db = new Database();\n  $this->type =\
    \ BlogReader::READER;\n}\n```\n\n这初始化了 `$db` 和 `$type`。现在，我们需要为类添加一个方法 `insertPostDB()`。该方法是公共的并带有三个参数——\
    \ `$title`、 `$post` 和 `$audience`。在方法内部，我们执行以下 SQL 语句：\n\n```sql\nINSERT INTO\
    \ posts (username, title, post, audience) VALUES (:username, :title, :post, :audience)\n\
    ```\n\n为了执行此语句，我们需要将 `$username` 属性绑定到 `:username`，并将 `$title`、 `$post` 和 `$audience`\
    \ 分别绑定到相应的占位符。此外，我们需要决定在调用 `queryDB()` 时使用合适的模式。尝试自己完成。一旦完成，方法就完成了。\n\n"
