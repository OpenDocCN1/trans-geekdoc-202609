  trans: "\n\n# 第 7 章：函数\n\n在本章中，让我们来讨论函数。在之前的章节中我们已经遇到过函数。例如，在第 5 章中，我们学习了使用各种 `PHP`\
    \ 函数来处理字符串和数组。在本章中，我们将学习定义自己的函数。\n\n## 7.1 定义自己的函数\n\n要定义我们自己的函数，我们使用以下语法：\n\n\
    ```php\nfunction functionName(list of parameters) { \n    //要执行的代码; \n    // 返回语句，如果有的话\
    \ \n}\n```\n\n所有的函数声明必须以 `function` 关键字开头。接下来是 `function name`。`PHP` 中的函数名是不区分大小写的，并且可以包含字母、数字或下划线。然而，它们必须以字母或下划线开头。与变量名类似，我们在命名函数时通常使用\
    \ `camelCase`（驼峰命名法）或下划线。在书中，我们将使用 `camelCase`。\n\n在函数名之后，我们用括号将函数所需的参数列表（如果有）括起来。参数是用于存储传递给函数的值的变量；我们传递的值被称为\
    \ `arguments`（参数）。在声明函数后，我们使用大括号括起我们想要函数执行的代码。如果函数返回结果，我们使用 `return` 关键字。明白了吗？让我们来看一些示例。\n\
    \n### 示例 1\n\n```php\nfunction displayGreetings(){ \n    echo 'Hello'; \n}\n```\n\
    \n在这里，我们声明了一个名为 `displayGreetings()` 的函数，它没有参数（如函数名后的一对空括号所示）。这个函数只是输出“Hello”单词。要调用该函数，我们使用它的名称后跟一对括号：`displayGreetings();`。这让我们得到了\
    \ `Hello` 输出。\n\n### 示例 2\n\n```php\nfunction displayGreetings2($name, $message){\
    \ \n    echo \"Hello $name, $message\"; \n}\n```\n\n在这里，我们声明了一个名为 `displayGreetings2()`\
    \ 的函数，它有两个参数 - `$name` 和 `$message`。如果我们使用以下语句 `displayGreetings2('Jamie', 'good\
    \ morning');` 调用该函数，参数 `'Jamie'` 和 `'good morning'` 将分别赋值给参数 `$name` 和 `$message`。当我们运行上面的代码时，我们将得到\
    \ `Hello Jamie, good morning` 输出。\n\n### 示例 3\n\n在声明函数时，我们可以为参数提供默认值。\n\n```php\n\
    function displayGreetings3($name, $message = 'have a good day' ){ \n    echo \"\
    Hello $name, $message\"; \n}\n```\n\n在上面的示例中，我们将 `'have a good day'` 为参数 `$message`\
    \ 的默认值（参考下划线代码）。要调用该函数，我们可以使用以下语句：\n\n```php\ndisplayGreetings3('Jamie');\necho\
    \ '<BR>';\ndisplayGreetings3('Jamie', 'how are you?');\n```\n\n在第一次函数调用中，我们省略了第二个参数。当我们这样做时，函数将使用默认值\
    \ `'have a good day'` 作为 `$message` 的值。如果我们运行上面的代码，我们将得到 `Hello Jamie, have a\
    \ good day` 和 `Hello Jamie, how are you?` 输出。\n\n当我们在声明带有默认值的参数函数时，请注意，带有默认值的参数必须在不带默认值的参数之后。如果我们声明一个函数\
    \ `function redundantDefault($a = 1, $b){ //某些代码 }`，那么 `$a` 的默认值将不起作用，因为它在 `$b`（没有默认值）之前；在调用函数时，我们仍然需要两个参数。\n\
    \n### 示例 4\n\n最后但同样重要的是，函数可以在完成任务后返回结果。\n\n```php\nfunction addNumbers($num1,\
    \ $num2, $num3){ \n    return $num1 + $num2 + $num3; \n}\n```\n\n上面的函数返回 `$num1`、`num2`\
    \ 和 `$num3` 的和。要使用它，我们在语句中添加了 `echo`：`echo addNumbers(9, 6, 1);`。这让我们得到了 `16`\
    \ 输出。\n\n## 7.2 类型声明\n\n在进入下一章之前，我想讨论 `type declaration`（类型声明）。类型声明（也称为 `type\
    \ hinting` 类型提示）从 `PHP` 7 开始可用。标量类型（Scalar types）指的是存储单个值的数据类型，如 `int`、`float`、`bool`\
    \ 和 `string`。类型声明是可选的，但如果你对代码很有把握，那么它是很有用的。\n\n要使用类型声明，我们需要在脚本中添加 `strict_types`。在\
    \ Brackets 中创建一个新文件并将其命名为 `typedec.php`。向其中添加以下代码：\n\n```php\n<?php\ndeclare(strict_types=1);\n\
    function addNumbers(int $num1, int $num2, int $num3){ \n    return $num1 + $num2\
    \ + $num3; \n}\necho addNumbers('9', '6', '1');\n```\n\n在这里，我们使用内置函数 `declare()`\
    \ 将 `strict_types` 设置为 1。该语句必须是脚本中的第一语句。接下来，我们声明一个带有三个参数 `$num1`、 `$num2` 和 `$num3`\
    \ 的函数 `addNumbers()`。我们通过在它们前面添加 `int` 来指示这些参数必须是 `int` 类型。最后，我们通过传递 `'9'`、`'6'`\
    \ 和 `'1'` 调用函数。如果你运行上面的代码，将得到类似于下面的输出：\n\n`Fatal error : Uncaught TypeError: Argument\
    \ 1 passed to addNumbers() must be of the type int, string given`\n\n接下来将 echo\
    \ 语句改为 `echo addNumbers(9, 6, 1);` 并重新运行代码。由于 `9`、`6` 和 `1` 都是 `int` 类型，我们现在不会得到任何错误。相反，我们将得到\
    \ `16` 输出。明白了吗？除了对参数进行类型声明外，如果我们使用的是 `PHP 7` 及以上版本，还可以对返回类型进行声明。要这样做，我们在函数声明的括号后使用冒号指示返回类型。向\
    \ `typedec.php` 添加以下代码：\n\n```php\nfunction addTwoNums($a, $b): int { \n    return\
    \ $a + $b; \n}\necho '<BR>'.addTwoNums(3, 1);\n```\n\n在这里，我们指示 `addTwoNums()`\
    \ 的返回值应该是 `int` 类型。接下来，我们使用 `3` 和 `1` 作为参数调用函数。如果你运行上面的代码，你将得到 `4` 输出。接下来，将最后一行改为\
    \ `echo '<BR>'.addTwoNums(3.9, 1);` 并再次运行页面。你将得到以下输出：\n\n`Fatal error : Uncaught\
    \ TypeError: Return value of addTwoNums() must be of the type int, float returned`\n\
    \n这是因为 `3.9 + 1` 我们得到了 `4.9`，它不是 `int` 类型。\n\n"
- fmt: "\n# Chapter 8: PHP Superglobals\n\nWe’ve covered a lot in the preceding chapters.\
    \ Most of the topics covered so far are fundamental concepts common to other programming\
    \ languages. In this chapter, we are going to learn something specific to PHP\
    \ - PHP superglobals. We’ll learn to use these superglobals to interact with HTML\
    \ forms and pass information from one PHP script to another.\n\n## 8.1 PHP Form\
    \ Handling\n\nFirst and foremost, this topic requires you to have a basic understanding\
    \ of HTML form elements. If you are not familiar, [https://www.w3schools.com/html/html_form_elements.asp](https://www.w3schools.com/html/html_form_elements.asp)\
    \ provides a quick reference that you can refer to. If you are familiar, let’s\
    \ start by creating a simple HTML form to work with later. Open Brackets and create\
    \ a new file called `form.php` in your `htdocs` folder. Add the following code\
    \ to it:\n\n```html\n<!DOCTYPE html>\n<html>\n<head><title>PHP Form Handling</title></head>\n\
    <body> <form action = \"\" method = \"get\"> Enter Name <BR> <input type = \"\
    text\" name = \"studentname\" value = \"Your Name\"> <BR><BR> Favorite Subject(s)<BR>\
    \ <input type = \"checkbox\" name = \"subj[]\" value = \"EL\">English <input type\
    \ = \"checkbox\" name = \"subj[]\" value = \"MA\">Math <input type = \"checkbox\"\
    \ name = \"subj[]\" value = \"PG\">Programming <BR><BR> Gender <BR> <input type\
    \ = \"radio\" name = \"gender\" value = \"M\">Male <input type = \"radio\" name\
    \ = \"gender\" value = \"F\">Female <BR><BR> <input type = \"submit\" name=\"\
    sm\" value = \"Submit Form\"> </form></body></body></html>\n```\n\nStudy the code\
    \ above carefully. Notice that we use the following `<form>` tag to create a HTML\
    \ form? `<form action = \"\" method = \"get\">` This tag has two attributes -\
    \ `action` and `method`. The `action` attribute specifies the file that we want\
    \ to use to process the HTML form. In our example, we assign an empty string to\
    \ it. This means that we want to use the current file (i.e, `form.php`) to process\
    \ the form. If we want to use a different file to process the form, we need to\
    \ assign the path of that file to the `action` attribute. For instance, suppose\
    \ we want to use `process.php` and `process.php` is in the same folder as `form.php`,\
    \ we need to write `<form action = \"process.php\" method = \"get\">`.\n\nNext,\
    \ we have the `method` attribute. This attribute specifies the method that we\
    \ want to use to send the form data. There are two methods available: `get` and\
    \ `post`. If we do not specify any method, the default is `get`. In our example,\
    \ we specify that we want to use the `get` method. We’ll discuss both methods\
    \ later.\n\nNext, let’s look at the `<input>` tags in our form; these tags are\
    \ used to create various form elements. Notice that all `<input>` tags have a\
    \ `name` attribute? This attribute is used to name the respective form elements.\
    \ For instance, the first form element (which is a text box) is named `studentname`,\
    \ as shown in the code below:\n\n```html\n<input type = \"text\" name = \"studentname\"\
    \ value = \"Your Name\">\n```\n\nIt is mandatory for us to name form elements\
    \ if we want to use PHP to process those elements. Similar to how variables in\
    \ PHP have names, all form elements must have a name so that we can reference\
    \ them in our code later.\n\nNext, notice that all checkboxes (`type = \"checkbox\"\
    `) in our form are named `subj` and both radio buttons (`type = \"radio\"`) are\
    \ named `gender`? Both radio buttons have the same name as they belong to the\
    \ same group (i.e., they are both options for “Gender”). Similarly, the three\
    \ checkboxes have the same name as they are all options for “Favorite Subject(s)”.\
    \ As users can choose more than one option for checkboxes, we need to add a pair\
    \ of square brackets to indicate that the option(s) selected will be stored as\
    \ an array. Last but not least, notice that all `<input>` tags have a `value`\
    \ attribute? This attribute behaves differently depending on the form element.\
    \ For text boxes, it specifies the initial value displayed in the box. For “submit”\
    \ buttons, it specifies the text on the button. For checkboxes, radio buttons\
    \ and drop down lists, it specifies the value that will be submitted for each\
    \ selected option. For instance, if the following checkbox is selected:\n\n```html\n\
    <input type = \"checkbox\" name = \"subj[]\" value = \"EL\">\n```\n\nthe string\
    \ `\"EL\"` will be submitted to the PHP server, as we assigned `\"EL\"` to its\
    \ value attribute. Got it? Great! Let’s move on to discuss the `isset()` function.\n\
    \n### 8.1.1 The isset() function\n\nThe `isset()` function is an important function\
    \ that is commonly used in PHP form handling. This function checks if a variable\
    \ has been declared and is not `NULL`. `NULL` is a special value that, ironically,\
    \ is used to indicate that a variable has no value. Suppose we have two variables\
    \ `$a` and `$b` as shown below:\n\n```php\n$a = 5;\n$b = NULL;\n```\n\nThe following\
    \ statements:\n\n```php\nvar_dump(isset($a));\nvar_dump(isset($b));\nvar_dump(isset($c));\n\
    ```\n\ngive us `bool(true)`, `bool(false)`, `bool(false)` as the output. `$a`\
    \ is considered set (i.e., `isset($a)` returns `true`) as it has been declared\
    \ and has a non `NULL` value. In contrast, `$b` and `$c` are both considered unset\
    \ (i.e., `isset($b)` and `isset($c)` return `false`) as `$b` has a `NULL` value\
    \ and `$c` has not been declared. The `isset()` function is commonly used to determine\
    \ if a button has been clicked. We’ll learn to do that later.\n\n### 8.1.2 get\
    \ and post\n\nBoth the `get` and `post` methods can be used to send form data\
    \ to the PHP server for processing. The main difference is that when the `get`\
    \ method is used, form data is appended to the URL. In addition, there is a limit\
    \ to the amount of data that can be transmitted using the `get` method. The form\
    \ in `form.php` currently uses the `get` method. Suppose we fill in the form with\
    \ the following data: When we click on the “Submit Form” button, the URL changes\
    \ to `http://localhost/form.php?studentname=Alex&subj[]=EL&subj[]=MA&gender=M&sm=Submit+Form`.\
    \ Notice the question mark (`?`) in the URL? This question mark is used as a separator;\
    \ what follows the question mark in the URL is known as a query string. The query\
    \ string contains the form data that we submitted, with each data presented as\
    \ `name=value` pair, separated by ampersands (`&`). For instance, as we entered\
    \ the string “Alex” into the text field named `studentname`, the pair `studentname=Alex`\
    \ gets appended to the URL. Next, we selected the options “English” and “Math”\
    \ for “Favorite Subjects”. Hence, the pairs `subj[]=EL&subj[]=MA` appended to\
    \ the URL use URL encoding to encode special characters that cannot be displayed\
    \ in URL. `%5B` encodes the character `[` while `%5D` encodes `]`. You’ll get\
    \ `subj[]=EL&subj[]=MA` indicates that we submitted the values for “subj”.\n\n\
    Now, suppose we want to use the information stored in the query string in our\
    \ PHP scripts, how do we do that? Simple. We use the `$_GET` superglobal. `$_GET`\
    \ is a superglobal that stores the query string as an associative array. To view\
    \ all data in `$_GET`, we can use the `print_r()` function. To see how that works,\
    \ add the following lines of code to `form.php`, between the `</form>` and `</body>`\
    \ tags:\n\n```php\n<?php\nif (isset($_GET['sm']))\n    print_r($_GET);\n?>\n```\n\
    \nHere, we use the `isset()` function to check if `$_GET['sm']` is set. Before\
    \ we click on the “Submit Form” button (named `sm`), `$_GET['sm']` is considered\
    \ to be unset. When we click on the button, PHP assigns the string `'Submit Form'`\
    \ to `$_GET['sm']` and the variable becomes set. When that happens, `isset($_GET['sm'])`\
    \ returns `true` and the `if` block is executed. Reload `form.php` (without the\
    \ query string) and enter the same data we entered into the form. Next, click\
    \ on the “Submit Form” button; you’ll see the following appended to the bottom\
    \ of the page:\n\n```text\nArray (\n    [studentname] => Alex\n    [subj] => Array\n\
    \        (\n            [0] => EL\n            [1] => MA\n        )\n    [gender]\
    \ => M\n    [sm] => Submit Form\n)\n```\n\nThis gives us the content of the `$_GET`\
    \ array. In other words, `$_GET['studentname'] = 'Alex'`, `$_GET['subj'] = array('EL',\
    \ 'MA')`, `$_GET['gender'] = 'M'` and `$_GET['sm'] = 'Submit Form'`.\n\n### 8.1.3\
    \ post and $_POST\n\nThe `post` method is similar to the `get` method, except\
    \ that form data is not appended to the URL. This makes the `post` method suitable\
    \ for sending sensitive information to the server, as information will not be\
    \ visible in the URL. Let’s look at an example. Change the line `<form action\
    \ = \"\" method = \"get\">` in `form.php` to `<form action = \"\" method = \"\
    post\">`. Next, change the PHP code to:\n\n```php\nif (isset($_POST['sm']))\n\
    \    print_r($_POST);\n```\n\nFinally, load `form.php` again without any query\
    \ string and enter the same data we entered previously into the form. Click on\
    \ the ‘Submit Form’ button. You should see the URL in your address bar remains\
    \ unchanged. Other than that, everything else is the same. In other words, you’ll\
    \ get the same output appended to the bottom of the form. Processing a form using\
    \ the `get` vs `post` method is very similar. The main difference is one appends\
    \ a query string to the URL while the other doesn’t. In addition, with the `get`\
    \ method, we use the `$_GET` superglobal. With the `post` method, we use the `$_POST`\
    \ superglobal.\n\n### 8.1.4 Keeping The Values in The Form\n\nIn the previous\
    \ sections, we learned to process HTML forms using the `get` and `post` methods.\
    \ Regardless of which method we use, notice that whenever we click on the “Submit\
    \ Form” button, the form refreshes itself and data entered is not shown on the\
    \ form anymore? This is all right if the form is processed successfully. However,\
    \ if the form is not processed successfully and we need users to resubmit the\
    \ form, this can be very troublesome as users need to fill out all the fields\
    \ again. If we do not want that to happen, we can use `echo` statements. For text\
    \ boxes, we use `echo` statements to modify the `value` attribute. This attribute\
    \ allows us to prefill a text box with text. In `form.php`, we prefilled the text\
    \ box with the text “Your Name”. Alternatively, we can use PHP to prefill the\
    \ text box with user-entered data. To do that, change `<input type = \"text\"\
    \ name = \"studentname\" value = \"Your Name\">` to:\n\n```html\n<input type =\
    \ \"text\" name = \"studentname\" value=\"<?php echo \"Your Name ?>\">\n```\n\n\
    If you analyze the code above, you’ll notice that we replaced “Your Name” with\
    \ the following block of PHP:\n\n```php\n<?php\nif (isset($_POST['studentname']))\n\
    \    echo $_POST['studentname'];\n?>\n```\n\nThis code first checks if `$_POST['studentname']`\
    \ is set. If it is (i.e., the user has submitted data for this text field), we\
    \ use an `echo` statement to prefill the text box. It is relatively straightforward\
    \ to prefill a text box. Things get a bit complicated when we want to prefill\
    \ elements like checkboxes, radio buttons and drop down lists. To prefill these\
    \ elements, we need to know which option has been selected and use PHP to select\
    \ these options. Let’s look at an example using checkboxes. A checkbox is selected\
    \ when you add the word “checked” (without quotes) to its tag. For instance:\n\
    \n```html\n<input type=\"checkbox\" name=\"subj[]\" value=\"EL\" checked>\n```\n\
    \nresults in the checkbox “English” being selected. If we want PHP to dynamically\
    \ select this checkbox, we need to replace the code above with:\n\n```html\n<input\
    \ type=\"checkbox\" name=\"subj[]\" value=\"EL\">\n<?php\nif (isset($_POST['subj'])\
    \ && in_array('EL', $_POST['subj']))\n    echo 'checked';\n?>\n```\n\nHere, we\
    \ use PHP to check if `$_POST['subj']` is set and if the current option is selected.\
    \ If it is, the string `'EL'` should be found in `$_POST['subj']` array. In other\
    \ words, `in_array('EL', $_POST['subj'])` should return `true`. If that’s the\
    \ case, echo `'checked'` to select this checkbox. This dynamically selects the\
    \ checkbox “English”.\n\n### 8.1.5 Filtering User Input\n\nNext, let’s move on\
    \ to how we can filter user inputs in our forms. Filtering refers to sanitization\
    \ and validation of user inputs. Sanitization is the process of removing invalid\
    \ characters from the input. For instance, sanitizing an integer involves removing\
    \ all characters except digits, plus and minus signs. Validation, on the other\
    \ hand, is the process of checking if the input satisfies certain criteria. For\
    \ instance, if the input is supposed to be an email address, we can use the validation\
    \ process to check if it is indeed an email address (such as whether it contains\
    \ the `@` character). To filter inputs, we use a built-in function called `filter_var()`.\
    \ When using this function, we need to specify how we want to filter our inputs\
    \ using one of the predefined filters. For instance, if we want to remove invalid\
    \ characters from an integer, we can use the `FILTER_SANITIZE_INT` filter:\n\n\
    ```php\n$num = '15abc';\necho filter_var($num, FILTER_SANITIZE_INT);\n```\n\n\
    If you run the code above, you’ll get `15` as the output. If we want to validate\
    \ whether an email address is valid, we can use the `FILTER_VALIDATE_EMAIL` filter.\
    \ If we pass a valid email address to the function, it returns the email address.\
    \ Else, it returns `false`.\n\n```php\n$email = 'abc@gmail';\nvar_dump(filter_var($email,\
    \ FILTER_VALIDATE_EMAIL));\n```\n\ngives us `bool(false)` as “abc@gmail” is not\
    \ a valid email address (“com” is missing).\n\n### 8.1.6 Cross-Site Scripting\n\
    \nGreat! We’ve covered most of the form handling concepts in PHP. Last but least,\
    \ let’s move on to cross-site scripting. For this, I need to do a little demonstration.\
    \ Change the PHP code in `form.php` (between the `</form>` and `</body>` tags)\
    \ to the following:\n\n```php\nif (isset($_POST['studentname']))\n    echo 'You\
    \ entered'.$_POST['studentname'].' into the text field';\n```\n\nAnd reload the\
    \ page. Type `<script>alert('Hacked');</script>` into the text field and click\
    \ on the “Submit Form” button. What do you get? You get an alert box that says\
    \ “Hacked” right? Surprised? This example demonstrates a critical security concept\
    \ in PHP - cross-site scripting (also known as XSS). Cross-site scripting occurs\
    \ when a user enters undesirable scripting code into our PHP form and submits\
    \ the code. If our site then stores this code (for instance, in a database) and\
    \ displays it to another user, the malicious code will be executed in the other\
    \ user’s browser. In our example, we created a harmless alert box using Javascript.\
    \ However, users with malicious intent can definitely use this technique to run\
    \ harmful scripting code on the victim’s browser. To prevent this from happening,\
    \ we need to be careful whenever we display information entered by users. There\
    \ are a few ways to do it. The easiest is to use a built-in function called `htmlspecialchars()`.\
    \ This function converts special characters into HTML entities. Special characters\
    \ refer to characters that have special significance in HTML, such as the `<`\
    \ and `>` characters. If you do not want `<` and `>` to represent the start and\
    \ end of an HTML tag, we need to encode them using the `htmlspecialchars()` function.\
    \ This function converts `<` and `>` to `&lt;` and `&gt;` respectively. `<script>`\
    \ will thus be converted to `&lt;script&gt;` and no longer interpreted as an HTML\
    \ tag. To see how this works, change the PHP code above to:\n\n```php\nif (isset($_POST['studentname']))\n\
    \    echo 'You entered '.htmlspecialchars($_POST['studentname']).'.into the text\
    \ field';\n```\n\nFor demonstration purposes, we only encode the text field. In\
    \ actual coding, you have to encode every form element where users are allowed\
    \ to enter information themselves. If you load the page and enter `<script>alert('Hacked');</script>`\
    \ into the text field now, you’ll see that the alert box no longer pops out when\
    \ you submit the form. Instead, you get the following output below the form:\n\
    \nYou entered `<script>alert('Hacked');</script>` into the text field. `<script>`\
    \ and `</script>` are treated as normal text with no HTML significance. If you\
    \ right-click on your webpage and select “View Source”, you’ll see the line `You\
    \ entered &lt;script&gt;alert('Hacked');&lt;/script&gt;` into the text field below\
    \ the `</form>` tag. This shows the encoding of the `<` and `>` characters.\n\n\
    ## 8.2 $_SESSION\n\nWe’ve covered quite a bit in this chapter far. In the previous\
    \ section on form handling, you learned about `$_GET` and `$_POST` superglobals.\
    \ In this section, we are going to discuss another superglobal - `$_SESSION`.\
    \ In PHP, a session is a way of storing information that can be accessed across\
    \ multiple pages; this information is stored in the `$_SESSION` superglobal. Like\
    \ `$_GET` and `$_POST` superglobals, `$_SESSION` global is an associative array.\
    \ This array is stored on the server and is available to all pages during the\
    \ duration of the session. To demonstrate the use of sessions, we need to create\
    \ two pages, `session.php` and `session2.php`. Let’s do that now. First, create\
    \ a new file called `session.php` in `htdocs` and add the following code to it\
    \ (line numbers are added for reference):\n\n```php\n<?php\nsession_start();\n\
    $_SESSION['myFavFood'] = 'Pizza';\n$_SESSION['myFavDrink'] = 'Cola';\n$_SESSION['myFavColor']\
    \ = 'Orange';\n// updating a session\n$_SESSION['myFavDrink'] = 'Beer';\n// deleting\
    \ a session variable\nunset($_SESSION['myFavColor']);\n?>\n```\n\nHere, we use\
    \ a built-in function called `session_start()` to start a new session on line\
    \ 2. This function creates a new session if one has not already created or resumes\
    \ the current one if it exists. After creating the session, we store the strings\
    \ `'Pizza'`, `'Cola'` and `'Orange'` into the `$_SESSION` superglobal, using `myFavFood`,\
    \ `myFavDrink` and `myFavColor` respectively. Next, we update the value of `$_SESSION['myFavDrink']`\
    \ by assigning a new string to it on line 9. Finally, on line 12, we use another\
    \ built-in function called `unset()` to destroy an element in the `$_SESSION`\
    \ superglobal. To use this function, we pass the name of the element we want to\
    \ destroy. After the element is destroyed, we will no longer be able to access\
    \ it. Next, let’s create another file called `session2.php` (in `htdocs`) and\
    \ add the following code to it:\n\n```php\n<?php\nsession_start();\necho 'Food:\
    \ '.$$_SESSION['myFavFood'];\necho 'Drink: '.$$_SESSION['myFavDrink'];\necho 'Color:\
    \ '.$$_SESSION['myFavColor'];\n?>\n```\n\nHere, we start by calling `session_start()`\
    \ to resume the current session. We need to call this function whenever we want\
    \ to access `$_SESSION`. Next, we use `echo` statements to output the values stored\
    \ in `$_SESSION`. Now, we are ready to demonstrate how sessions work. To do that,\
    \ load `session.php` in your browser. When you do that, `session.php` starts a\
    \ new session and stores data into the `$_SESSION` superglobal. Next, load `session2.php`\
    \ in your browser. Depending on the error setting on your PHP server, you will\
    \ get an output similar to what is shown below:\n\n```\nFood: Pizza\nDrink: Beer\n\
    Notice: Undefined index: myFavColor in ...session2.php on line 4\nColor:\n```\n\
    \nNotice that we get an undefined index for `myFavColor`? This is because `$_SESSION['myFavColor']`\
    \ was destroyed using the `unset()` function in `session.php`. Other than that,\
    \ we have successfully retrieved the values of `$_SESSION['myFavFood']` and `$_SESSION['myFavDrink']`.\
    \ These two values were stored in the `$_SESSION` superglobal in `session.php`\
    \ and retrieved in `session2.php`. This demonstrates how we can use the `$_SESSION`\
    \ superglobal to store and retrieve data across different PHP pages. Got it? Besides\
    \ creating and storing data in a session, we can destroy a session. We commonly\
    \ do that when users log out of our site. To destroy a session, we use another\
    \ built-in function called `session_destroy()`. To see how this function works,\
    \ create a new file called `session3.php` in `htdocs` and add the following code\
    \ to it:\n\n```php\n<?php\nsession_start();\nsession_destroy();\n?>\n```\n\nAs\
    \ shown in the code above, we need to call the `session_start()` function to resume\
    \ an existing session before destroying it. Next, load `session3.php` in your\
    \ browser; this destroys the current session. Finally, load `session2.php` in\
    \ your browser again. You’ll get an output that says indexes “myFavFood”, “myFavDrink”\
    \ and “myFavColor” are all undefined. This indicates that the session no longer\
    \ exists.\n\n## 8.3 $_COOKIE\n\nCool! We’ve come to the final topic in this chapter\
    \ - cookies. A cookie is another way of storing information that can be accessed\
    \ across multiple pages on the site. It is essentially a small text file that\
    \ stores data on the user's computer (as opposed to a session that stores data\
    \ on the server). As cookies are stored on the user’s computer, you should not\
    \ use cookies to store sensitive data, as a malicious user could potentially manipulate\
    \ it. Also, cookies may be disabled on the user's browser. Hence, if the information\
    \ to be stored is crucial or sensitive, you should use sessions instead. To create\
    \ a cookie, we use the `set_cookie()` function. Similar to the `header()` function\
    \ covered in Chapter 3.3, the `set_cookie()` function must be called before your\
    \ script generates any output. If you fail to do that, you’ll get a “Cannot modify\
    \ header information - headers already sent” warning and the cookie will not be\
    \ set. Your code may work when you are working on your local computer, but when\
    \ you upload it to your hosting company’s server, it will fail to work. The `set_cookie()`\
    \ function accepts up to seven arguments; only the first is mandatory. We commonly\
    \ provide the first three arguments to the function, namely the name of the cookie,\
    \ the value of the cookie and the expiry date in UNIX timestamp format. Let’s\
    \ look at an example. Create a file called `cookie.php` in `htdocs` and add the\
    \ following code to it:\n\n```php\n<?php\nsetcookie('userName', 'Joy', time()\
    \ + 3600);\nsetcookie('userAge', 25, time() + 3600);\nsetcookie('userLevel', 3,\
    \ time() - 3600);\n// modifying a cookie\nsetcookie('userAge', 26, time() + 3600);\n\
    // deleting a cookie\nsetcookie('userLevel', '', time() - 3600);\n?>\n```\n\n\
    For the first cookie (`userName`), its value and expiry date are `'Joy'` and `time()\
    \ + 3600`. `time()` is a built-in function that gives us the current timestamp;\
    \ `time() + 3600` means the cookie will expire 3600 seconds (i.e. 1 hour) after\
    \ it is set. Next, we have the `userAge` cookie. This cookie is set twice. When\
    \ a cookie is set more than once, the newest cookie overwrites the previous ones.\
    \ Hence, the value of `userAge` is updated from 25 to 26. Finally, we have the\
    \ `userLevel` cookie. This cookie is set with an initial expiry of `time() + 3600`.\
    \ However, it is subsequently updated to an expiry of `time() - 3600`. When a\
    \ cookie has an expiry in the past, it gets deleted. Let’s look at how we can\
    \ access each of these cookies now. We do that using the `$_COOKIE` superglobal.\
    \ Create another file called `cookie2.php` in `htdocs` and add the following code\
    \ to it:\n\n```php\n<?php\necho 'User Name is '.$$_COOKIE['userName'];\necho '<BR>User\
    \ Age is '.$$_COOKIE['userAge'];\necho 'User Level is '.$$_COOKIE['userLevel'];\n\
    ?>\n```\n\nFirst, launch `cookie.php` in your browser. When you do that, the three\
    \ cookies (`userName`, `userAge` and `userLevel` ) get created. Next, launch `cookie2.php`.\
    \ Depending on the error setting on your PHP server, you will get an output similar\
    \ to what is shown below:\n\n```\nUser Name is Joy\nUser Age is 26\nNotice: Undefined\
    \ index: userLevel in ...cookie2.php on line 3\nUser Level is\n```\n\nNotice that\
    \ we get an undefined index for `userLevel`? This is because `$_COOKIE['userLevel']`\
    \ was destroyed using the `unset()` function in `cookie.php` (Wait, the text says\
    \ `unset()` but the code uses `set_cookie` with a past time). Actually, the text\
    \ says \"This is because `$_COOKIE['userLevel']` was destroyed\", but the code\
    \ shows `setcookie('userLevel', '', time() - 3600);`. Other than that, we have\
    \ successfully retrieved the values of `$_COOKIE['userName']` and `$_COOKIE['userAge']`.\
    \ These two values were stored in `cookie.php` and retrieved in `cookie2.php`.\
    \ This demonstrates how we can use the `$_COOKIE` superglobal to store and retrieve\
    \ data across different PHP pages. Got it? Besides creating and storing data in\
    \ a cookie, we can destroy a cookie. We commonly do that when users log out of\
    \ our site. To destroy a cookie, we use the `set_cookie()` function with an expiry\
    \ date in the past.\n\n"
