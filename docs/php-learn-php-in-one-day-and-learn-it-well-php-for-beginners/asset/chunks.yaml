    ). Example 3 $pets = array("corgi", "poodle", "golden retriever", "jack russell");
    array\_splice($pets, 1, 2); Here, we want to remove 2 elements from $pets , starting
    from (and including) position 1. $pets becomes ("corgi", "jack russell") . 5.3.5
    Commonly used Array Functions in PHP We’ve covered several array concepts in the
    previous sections. Before we end this chapter, let’s look at some commonly used
    array functions in PHP. count() The first is the count() function. This function
    accepts an array and returns the number of elements in the array. Example: $countDemo
    = array(1, 4, 5, 1, 2); echo count($countDemo); Output: 5 array\_search() Next,
    we have the array\_search() function. This function searches for a particular
    value in an array. If the value is found, the function returns its corresponding
    index or key. Else, it returns false . If more than one instance of the value
    is found, the index or key of the first matching value is returned. Example: $indexArrDemo
    = array(11, 4, 5, 1, 2, 5, 6); $assocArrDemo = array(''A''=>12, ''B''=>5, ''C''=>20);
    echo array\_search(5, $indexArrDemo).''<BR>''; echo array\_search(20, $assocArrDemo).''<BR>'';
    var\_dump(array\_search(''B'', $assocArrDemo)); Output: 2 C bool(false) In the
    first echo statement above, we use the array\_search () function to search for
    5 in $indexArrDemo . Although there are two values of 5 in the array, only the
    index of the first matching value is returned. In the second echo statement above,
    we use array\_search () to search for 20 in $assocArrDemo . We get “C” as the
    output. In the last echo statement, we use array\_search () to search for ''B''
    in $assocArrDemo . We get false as ''B'' is a key in the array, not a value. in\_array()
    The in\_array() function is similar to the array\_search() function. However,
    instead of returning the key or index, it returns true if the stated value is
    found in the array. Else, it returns false . With reference to $indexArrDemo and
    $assocArrDemo defined above, var\_dump(in\_array(5, $indexArrDemo)); var\_dump(in\_array(20,
    $assocArrDemo)); var\_dump(in\_array(''B'', $assocArrDemo)); give us bool(true)
    bool(true) bool(false) as the output. array\_merge() Finally, we have the array\_merge()
    function. This function merges two or more arrays and returns the merged array.
    Example 1: $num1 = array(100, 111, 120); $num2 = array(100, 3, 5); $num3 = array(1,
    10); $newArray1 = array\_merge($num1, $num2, $num3); $newArray1 becomes (100,
    111, 120, 100, 3, 5, 1, 10) . Example 2: $names1 = array(5 => "Peter", 24 => "Aaron");
    $names2 = array(5 => "Zac", 4 => "Alfred", 7 => "Avi"); $newArray2 = array\_merge($names1,
    $names2); Keys are renumbered in the merged array if any of the arrays passed
    to the array\_merge() function is an associative array with integer keys. In the
    example above, $newArray2 becomes (0 => "Peter", 1 => "Aaron", 2 => "Zac", 3 =>
    "Alfred", 4 => "Avi") . The key for "Peter" is renumbered from 5 to 0 . The same
    applies to all the other keys. Example 3: $str1 = array(''A''=> 12, ''B'' => 5,
    ''C'' => 8); $str2 = array(''A'' => 15, ''D'' => 10); $newArray3 = array\_merge($str1,
    $str2); If two or more array elements have the same string keys, the last one
    overrides the earlier ones. In the example above, $newArray3 becomes (''A''=>
    15, ''B'' => 5, ''C'' => 8, ''D'' => 10) . ''A''=> 12 is replaced by ''A''=> 15
    . We’ve covered some of the commonly used array functions in PHP. For a complete
    list of all the built-in array functions, check out [https://www.php.net/manual/en/ref.array.php](https://www.php.net/manual/en/ref.array.php)
    . '
