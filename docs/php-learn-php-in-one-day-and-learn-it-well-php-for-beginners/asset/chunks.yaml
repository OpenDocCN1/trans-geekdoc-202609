- fmt: "\n# Chapter 12: Managing Errors and Exceptions\n\nWe’ve come to the last chapter\
    \ before our project. In this chapter, we are going to learn to manage errors\
    \ and exceptions in our PHP scripts. Frankly speaking, this is one of the messiest\
    \ areas in PHP as PHP differentiates between an exception and an error. When something\
    \ goes wrong, we’ll get either an exception or an error. Internal PHP functions\
    \ mainly give us errors when something goes wrong. Modern object-oriented extensions\
    \ (such as the `PDO` extension we learned in the previous chapter), on the other\
    \ hand, are more likely to use exceptions. In this chapter, we’ll first discuss\
    \ exceptions and errors separately before consolidating everything into a single\
    \ file in the last section. Ready? Let’s look at exceptions first.\n\n## 12.1\
    \ Handling Exceptions\n\n### 12.1.1 What is an exception?\n\nAn exception is a\
    \ predefined object in PHP that allows us to alter the flow of our scripts when\
    \ something undesirable happens. For instance, if we try to connect to a database\
    \ and the connection fails, we can use an exception to help us handle the situation.\
    \ To see what an exception is, create a file called `connect.php` in `htdocs`\
    \ and add the following code to it:\n\n```php\n<?php\n$pdo = new PDO(\"mysql:host=localhost;dbname=pawszone\"\
    , \"wrongadmin\", \"ABCD\");\n$pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
    ```\n\nHere, we try to connect to the “pawszone” database using an invalid username\
    \ (``wrongadmin`). Next, create a new file called `exceptionHandling.php` in `htdocs`\
    \ and add the following code to it:\n\n```php\n<?php include \"connect.php\";\n\
    echo '<BR>Welcome to Pawszone';\n```\n\nHere, we use an `include` statement to\
    \ include the `connect.php` file (which contains the invalid code) and use an\
    \ `echo` statement to echo the text “Welcome to Pawszone” after the `include`\
    \ statement. After creating the two files, try loading `exceptionHandling.php`\
    \ in your browser (with Apache and MySQL running), what do you get? You get a\
    \ message similar to what is shown below, right? I’ve formatted and underlined\
    \ parts of the message to make it more readable.\n\n```text\nFatal error : Uncaught\
    \ PDOException : SQLSTATE[HY000] [1045] Access denied for user 'wrongadmin'@'localhost'\
    \ (using password: YES) in /opt/lampp/htdocs/connect.php:3\nStack trace:\n#0 /opt/lampp/htdocs/connect.php(3)\
    \ : PDO->__construct('mysql:host=loca...', 'wrongadmin', 'ABCD' )\n#1 /opt/lampp/htdocs/exceptionHandling.php(2)\
    \ : include('/opt/lampp/htdo...')\n#2 {main} thrown in /opt/lampp/htdocs/connect.php\
    \ on line 3\n```\n\nThis message informs us that a `PDO` exception (`PDOException`\
    \ ) has occurred and is not caught (i.e., not handled). This exception occurs\
    \ because of the invalid username we used when connecting to the “pawszone” database.\
    \ When an exception occurs and is not caught, PHP displays a message similar to\
    \ the one shown above. This output includes a stack trace listing all the files\
    \ linked to the exception. The trace above tells us that the current exception\
    \ is linked to line 3 in `connect.php` and line 2 in `exceptionHandling.php`.\
    \ In addition, the database password, “ABCD”, is revealed in the trace. Notice\
    \ that the second statement (`echo '<BR>Welcome to Pawszone';`) in `exceptionHandling.php`\
    \ is not executed? This is because any exception that is not caught results in\
    \ a fatal error; the script is terminated immediately before the `echo` statement\
    \ can be executed. If we do not want script termination to happen (or the message\
    \ above to be displayed) when an exception occurs, we need to catch the exception.\n\
    \n### 12.1.2 try-catch-finally\n\nTo catch exceptions, we use the `try`, `catch`\
    \ and `finally` blocks. The syntax is as follows:\n\n```php\ntry {\n    //do something\n\
    } catch (type of exception) {\n    //do something else when an exception occurs\n\
    } finally {\n    //do this regardless of whether the try or catch block is executed\n\
    }\n```\n\nThe `try` block first tries to perform a task. If the task fails, an\
    \ exception will be thrown. Throwing an exception simply means PHP will create\
    \ an object using one of the predefined classes for dealing with exceptions. These\
    \ classes include the `Exception`, `PDOException`, `DOMException` and `OutOfBoundsException`\
    \ class. When an exception occurs, PHP creates an object of the relevant exception\
    \ class. This object contains information about the exception and can be used\
    \ to call various methods defined in the class. These methods include the `getMessage()`,\
    \ `getFile()`, `getLine()` and `getTraceAsString()` methods, which give us the\
    \ message, file name, line number and stack trace of the exception respectively.\n\
    \nAfter an exception is thrown (i.e., after PHP creates the exception object),\
    \ we need to catch it using a `catch` block. We can define multiple `catch` blocks\
    \ to deal with different types of exceptions. After the `catch` block(s), we have\
    \ the `finally` block. This block is optional and always executed regardless of\
    \ whether the `try` block succeeds or fails. To illustrate how the `try`, `catch`\
    \ and `finally` blocks work, replace the original code in `exceptionHandling.php`\
    \ with the following code:\n\n```php\n<?php\ntry{\n    include \"connect.php\"\
    ;\n}catch(PDOException $e){\n    echo '<BR>Unable to connect '.$e->getMessage();\n\
    }catch(Exception $e){\n    echo '<BR>Something else happened'.$e->getMessage();\n\
    }finally{\n    echo '<BR><BR>The finally block is always executed';\n}\necho '<BR>After\
    \ connecting';\n```\n\nHere, we first try to connect to the “pawszone” database\
    \ inside the `try` block. If we are unable to connect, PHP throws an exception\
    \ and one of the `catch` blocks will be executed. In our example, we have two\
    \ `catch` blocks. The first `catch` block catches a `PDO` exception (`PDOException`\
    \ ) while the second catches a general exception (`Exception` ). `PDOException`\
    \ is a predefined class that deals with exceptions when `PDO` is unable to perform\
    \ its task. `Exception`, on the other hand, is the parent class of all exception\
    \ classes and deals with general exceptions. `$e` represents an object of the\
    \ respective exception class. Inside our `catch` blocks, we use `$e` to call the\
    \ built-in `getMessage()` method and use an `echo` statement to echo the error\
    \ message. If we run the code above, we’ll get the following output:\n\n```text\n\
    Unable to connect SQLSTATE[HY000] [1045] Access denied for user 'wrongadmin'@'localhost'\
    \ (using password: YES)\nThe finally block is always executed\nAfter connecting\n\
    ```\n\nThe first line of output is from the `catch(PDOException $e)` block. As\
    \ PHP is unable to connect to the database in `connect.php`, it throws a `PDO`\
    \ exception. The second line is from the `finally` block. This block is executed\
    \ regardless of whether the code in the `try` block succeeds or fails. Finally,\
    \ the last line is from the `echo` statement after the `try-catch-finally` blocks.\
    \ This line illustrates that when an exception occurs and is caught successfully,\
    \ the script continues executing. Straightforward? Good!\n\n### 12.1.3 Throwing\
    \ Exceptions\n\nNext, let’s learn to throw our own exceptions. In the section\
    \ above, we learn to catch exceptions thrown by PHP. Besides relying on PHP to\
    \ throw exceptions for us, we can throw our own exceptions. We do that using the\
    \ `throw` keyword. Let’s look at an example. Add the function below to the end\
    \ of `exceptionHandling.php` (i.e., after the `echo '<BR>After connecting';` statement):\n\
    \n```php\nfunction displayUserInput($userInput){\n    if ($userInput > 100) {\n\
    \        throw new OutOfRangeException('<BR>User input is too big');\n    }else\
    \ {\n        echo '<BR>'.$userInput;\n    }\n}\n```\n\nHere, we define a function\
    \ called `displayUserInput()` that has one parameter - `$userInput`. If `$userInput`\
    \ is greater than 100, we throw an `OutOfRangeException` exception using the `throw`\
    \ keyword. `OutOfRangeException` is a predefined class in PHP extended from the\
    \ `Exception` class. Throwing an `OutOfRangeException` exception involves creating\
    \ a new object of the class. When creating a new `OutOfRangeException` object,\
    \ we can pass a few optional arguments to the constructor. We commonly pass an\
    \ error message. In our example, we pass the string `'<BR>User input is too big'`\
    \ to the constructor.\n\n```php\ntry {\n    displayUserInput(105);\n} catch (OutOfRangeException\
    \ $e) {\n    echo $e->getMessage();\n}\n```\n\nan `OutOfRangeException` exception\
    \ will be thrown in the `try` block as `$userInput` is greater than 100. This\
    \ gets caught by the `catch` block. Inside the `catch` block, we use the `getMessage()`\
    \ method to get the error message. If we run the code above, we’ll get User input\
    \ is too big as the output. If we change the function call to `displayUserInput(16);`\
    \ no exception will be thrown and we’ll get 16 as the output. Got it? Great!\n\
    \n### 12.1.4 Exception Handler\n\nIn the previous sections, we learned to throw\
    \ and catch exceptions. Some exceptions, such as a `PDO` exception, are easy to\
    \ preempt. Others may be harder. In most cases, despite our best efforts, there\
    \ are exceptions we fail to anticipate. In cases like these, PHP allows us to\
    \ specify a custom handler that gets called whenever are exceptions we fail to\
    \ catch. We can use this custom handler to display a custom message to users.\
    \ However, after the exception handler is called, the PHP script will terminate.\
    \ To see how an exception handler works, add the following code to the end of\
    \ `exceptionHandling.php`:\n\n```php\nfunction myExceptionHandler($e) {\n    echo\
    \ '<BR>Oppsss... An uncaught exception occurred.<BR>'.$e->getMessage();\n}\nset_exception_handler('myExceptionHandler');\n\
    ```\n\nHere, we define a function called `myExceptionHandler()` to serve as the\
    \ exception handler. For a function to qualify as an exception handler, it needs\
    \ to have one parameter for storing the uncaught exception object. This parameter\
    \ is `$e` in our example. Within the function, we use `$e` to call the `getMessage()`\
    \ method and use `echo` statement to echo the message. After coding the function,\
    \ we need to use a built-in function called `set_exception_handler()` to set `myExceptionHandler()`\
    \ as the exception handler. To test our exception handler, add the following lines\
    \ to the end of `exceptionHandling.php`:\n\n```php\n$pdo = new PDO(\"some invalid\"\
    );\necho 'This will not be executed';\n```\n\nHere, we try to create a `PDO` object\
    \ using an invalid argument. This results in a `PDO` exception, which is not caught\
    \ by any catch block. If you run the code above, you’ll get Oppsss... An uncaught\
    \ exception occurred. The. The exception handler (`myExceptionHandler`) has successfully\
    \ handled the exception. However, notice that the `echo` statement after the `PDO`\
    \ instantiation is not executed? This is because the PHP script terminated after\
    \ the exception handler called. Got it?\n\n## 12.2 Handling Errors\n\n### 12.2.1\
    \ What are errors?\n\nGreat! Now that you are familiar with exceptions, let’s\
    \ move on to discuss errors. As mentioned previously, when something goes wrong\
    \ in PHP, you will get either an exception or an error. One major difference between\
    \ errors and exceptions is that exceptions can be caught while errors, by default,\
    \ cannot. This is especially true prior to PHP 7. From PHP 7 onwards, PHP throws\
    \ an `Error` exception when errors occur; this exception can then be caught. There\
    \ are four main types of errors defined in PHP - notices, warnings, syntax errors\
    \ and fatal errors. Each error type is further divided into subtypes and each\
    \ subtype is represented by a constant. Warnings and notices are minor errors\
    \ that do not lead to termination. Common causes include dividing by zero (which\
    \ generates a warning) and trying to access an undefined variable (which generates\
    \ a notice). Syntax errors, on the other hand, lead to script termination. They\
    \ are caused by programmers making a mistake in the syntax of their code. Examples\
    \ include forgetting to close a parenthesis or missing a semicolon. Last but not\
    \ least, we have fatal errors, which also lead to script termination. Common causes\
    \ include calling a non-existent function.\n\nDo not worry about the distinction\
    \ between different types of errors. When an error occurs, PHP has an excellent\
    \ reporting system. For instance, if you try to access a non-existent variable\
    \ using the statement `echo $some_undefined_variable;` you’ll get an output similar\
    \ to what is shown below:\n\nNotice: Undefined variable: some_undefined_variable\
    \ in ...code.php on line 6\n\nThis output informs us that the error is a notice\
    \ and gives us the reason for the error. It also gives us the file name of the\
    \ error and the line number where it occurred. As you can see, a error message\
    \ is very informative. Such messages make it very easy for us debug our code.\
    \ However, they can reveal too much information to users. Therefore, it is a common\
    \ practice for us to display these messages only during the development stage\
    \ of our site. When our site goes live, it is strongly recommended that we not\
    \ display such messages to users. To adjust whether error messages are displayed,\
    \ we need to update the error settings in our PHP server.\n\n### 12.2.2 Error\
    \ Reporting Settings in PHP\n\nThere are two relevant settings here - `error_reporting`\
    \ and `display_errors`. The `error_reporting` setting affects the type of errors\
    \ that PHP will report. There are several predefined constants that we can assign\
    \ to this setting. If we want PHP to only report fatal errors (and not report\
    \ warnings and notices etc.), we assign the `E_ERROR` constant to this setting.\
    \ On the other hand, if we want PHP to report all errors, we assign `E_ALL` to\
    \ it. Besides `E_ERROR` and `E_ALL`, we can assign other constants to the `error_reporting`\
    \ setting. You can find the list of all error constants and codes at [https://www.php.net/manual/en/errorconstants.php](https://www.php.net/manual/en/errorconstants.php).\n\
    \nNext, we have the `display_errors` setting. This affects whether errors reported\
    \ by PHP will be displayed on the browser. During the development stage, we want\
    \ errors to be displayed. To do that, we set `display_errors` to `On`. On a live\
    \ site, we do not want any errors to be displayed. To do that, we set `display_errors`\
    \ to `Off`. When `display_errors` is off, we typically log the errors reported\
    \ by PHP to a log file. We’ll learn to do that later. To configure the error settings\
    \ mentioned above, the most direct way is to modify the `php.ini` file. We’ve\
    \ already done that in Chapter 2, where we set `error_reporting` to `E_ALL` and\
    \ `display_errors` to `On`. If you do not have permission to edit `php.ini`, you\
    \ can use two built-in functions - `error_reporting()` and `ini_set()` - to modify\
    \ the settings. To do that, add the following statements to all your PHP scripts:\n\
    \n```php\nerror_reporting(E_ALL);\nini_set('display_errors', '1');\n```\n\nIn\
    \ the first statement above, we use the `error_reporting()` function to set `error_reporting`\
    \ to `E_ALL`. Next, we use the `ini_set()` function to set `display_errors` to\
    \ `'1'` when the site is in the development stage. After the site goes live, you\
    \ should change the `display_errors` setting to `'0'` using the following statement:\n\
    \n```php\nini_set('display_errors', '0');\n```\n\nChanging the `display_errors`\
    \ setting using `ini_set()` has its limitations. If there is any syntax error\
    \ in your script, the `ini_set()` function will not work. For instance, if you\
    \ have the following line in your script: `echo 'Hello;`\n\nThe `display_errors`\
    \ setting will not be set as the statement above has a syntax error (the closing\
    \ quotation mark is missing). The page will simply fail to load without any indication\
    \ of what’s causing it. Hence, whenever possible, it is strongly recommended that\
    \ you update the `php.ini` file instead. If you do not have access to `php.ini`,\
    \ you can try modifying the error settings using `httpd.conf` or `.htaccess`.\
    \ These files allow you to modify the Apache web server settings, which in turn\
    \ can be used to modify the PHP settings. Depending on your hosting company, you\
    \ may also be allowed to add a custom `php.ini` file to your directory and use\
    \ it to configure the PHP settings. Check with your hosting company if you have\
    \ permission to do any of the above and if yes, how to go about doing it. Instruction\
    \ on using these techniques is beyond the scope of this book.\n\n### 12.2.3 Error\
    \ Handler and Shutdown Function\n\nIn the previous section, we learned to adjust\
    \ the `display_errors` setting. On a live site, you are encouraged to turn `display_errors`\
    \ off. However, sometimes, not displaying any error message may not the best approach.\
    \ For instance, if a fatal error occurs on our site, the site will just fail to\
    \ load without any information. Instead of leaving users entirely in the dark\
    \ when something goes wrong, we can provide them with a “user-friendly” error\
    \ message. To do that, we need to create a custom error handler. A custom error\
    \ handler allows us to handle PHP errors ourselves instead of relying on the default\
    \ error handler in PHP. We can use this custom handler to display a custom message\
    \ to users when something goes wrong. To see how this works, create a new file\
    \ and save it as `errorHandling.php` to the `htdocs` folder. Add the following\
    \ code to it:\n\n```php\n<?php\nfunction myErrorHandler($errno, $errstr, $errfile,\
    \ $line) {\n    echo '<BR>Oppsss... An error occurred.<BR>'.$errstr;\n}\nset_error_handler('myErrorHandler');\n\
    ```\n\nIn the code above, we first create a function called `myErrorHandler()`\
    \ that has four parameters - `$errno`, `$errstr`, `$errfile` and `$line`. The\
    \ first two parameters are mandatory for a function to qualify as an error handler,\
    \ the last two are optional. These four parameters are used to store the error\
    \ code, error message, file name in which error occurred and the line number respectively.\
    \ All four pieces of information are provided by PHP when an error occurs. Within\
    \ the function, we use `echo` statement to echo the message to users. After coding\
    \ the function, we use a built-in function called `set_error_handler()` to set\
    \ `myErrorHandler()` as the error handler. Got it? At this point, you’ll probably\
    \ notice that this error handler is very similar to the exception handler coded\
    \ in Chapter 12.1.4. Indeed, the two are similar. However, while a exception handler\
    \ handles uncaught exceptions, an error handler handles errors. In addition, an\
    \ error handler does not result in script termination. To test the error handler,\
    \ add the following code to the end of `errorHandling.php`:\n\n```php\necho $a;\n\
