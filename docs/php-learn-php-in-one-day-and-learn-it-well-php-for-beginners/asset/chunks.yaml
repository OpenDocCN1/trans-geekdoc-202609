    7 . As this condition is true , the ternary operator performs the first task and
    returns the string ''Yes'' . We then assign this string to $a and use the echo
    statement to display its value on the next line. If we run the code above, we’ll
    get “Yes” as the output. In contrast, if we change the ternary statement to $a
    = (7 > 10 ? ''Yes'' : ''No''); we’ll get “No” as the output as 7 > 10 is false
    . 6.3.3 Switch Statement Next, we have the switch statement. This statement is
    similar to an if statement and can be faster if you have many conditions to test.
    It is typically used when the condition involves comparing a variable against
    a single value (instead of a range of values). The syntax is as follows: switch
    (variable used for switching) { case firstCase: Task A; break; case secondCase:
    Task B; break; ... default: Default task; } Let’s look at an example (line numbers
    are added for reference): 1  $b = 20; 2 3  switch ($b) 4  { 5     case 10: 6         echo
    ''Chocolate<BR>''; 7         break; 8     case 20: 9         echo ''Lemon<BR>'';
    10    case 25: 11        echo ''Strawberry<BR>''; 12        break; 13    default:
    14        echo ''None of the above<BR>''; 15 } In the example above, we first
    declare a variable called $b and assign 20 to it. Next, we have a switch statement
    from lines 3 to 15. On line 3, the switch statement uses the value of $b to decide
    which case to execute. When a certain case is satisfied, everything starting from
    the next line is executed until a break statement is reached. If $b is 10 , case
    10 is satisfied. The program executes everything after line 5 until it reaches
    the break statement on line 7. In other words, it executes line 6 and gives us
    “Chocolate” as output. On the other hand, if $b is 20 , case 20 is satisfied.
    However, this case does not have a break statement. Hence, the program executes
    everything starting from line 9, until it reaches a break statement on line 12.
    In other words, it executes cases 20 and 25 and gives us “Lemon”, followed by
    “Strawberry” as output. Next, if $b is 25 , case 25 is satisfied. The program
    executes line 11 and gives us “Strawberry” as output. Finally, if $b is not 10
    , 20 or 25 , the default case is executed and we’ll get “None of the above” as
    output. The default case is optional. In addition, we can have as many cases as
    we want in a switch statement. In our example, we have three cases. If you run
    the switch statement above, you’ll get Lemon Strawberry as output. Try changing
    $b to other values on line 1 and run the code again to fully appreciate how the
    switch statement works. 6.3.4 For Loop Next, let’s move on to the for loop. This
    control structure executes a block of code repeatedly until the test condition
    is no longer valid. The syntax is as follows: for (initial value; test condition;
    modification to value) { //Do Some Task } Let’s look at an example: for ($c =
    1; $c < 5; ++$c){ echo ''The value of $c is ''.$c.''<BR>''; } The main focus of
    a for loop is the first line. There are three parts to this line, each separated
    by a semicolon. In our example, we have the line for ($c = 1; $c < 5; ++$c) The
    first part declares a variable $c and initializes it to 1 . The second part tests
    if $c is smaller than 5 . If it is, the statement(s) inside the curly braces that
    follow will be executed. In our example, the curly braces are optional as there
    is only one statement to execute. After executing the statement(s) in the curly
    braces, the program returns to the third part ( ++$c ). This part modifies the
    value of the variable used for testing. In our example, we increase the value
    of $c by 1 using the increment operator. As a result, $c becomes 2 . After the
    increment, the program tests if the new value of $c is still smaller than 5. If
    it is, it executes the code in the curly braces again. This process of testing
    and updating the value of $c is repeated until the condition $c < 5 is no longer
    true. At this point, the program exits the for loop and continues to execute other
    statements after the for loop. If you run the code above, you’ll get The value
    of $c is 1 The value of $c is 2 The value of $c is 3 The value of $c is 4 as the
    output. 6.3.5 Foreach Loop Next, we have the foreach loop. This loop is similar
    to the for loop but is used to loop over arrays. There are two syntaxes: foreach
    ($array as $value) { //code to be executed; } foreach ($array as $key=>$value)
    { //code to be executed; } The names $array , $value and $key in the syntaxes
    above are chosen by us; we can use other names if we want. Let’s look at an example.
    This example uses the first syntax: $arr1 = array(11, 12, 13, 14, 15); foreach
    ($arr1 as $num){ echo ''The number is ''.$num.''<BR>''; } Here, we declare an
    array called $arr1 with values 11 , 12 , 13 , 14 and 15 . Next, we have the foreach
    loop. This loop loops through the elements in $arr1 one by one and assigns each
    element to a variable called $num . The first time the loop runs, the first element
    in $arr1 is assigned to $num . In other words, 11 is assigned to $num . After
    assigning 11 to $num , the program executes the code in the pair of curly braces
    that follows. This gives us “The number is 11” as the output. Once that is done,
    the foreach loop moves on to the second element and assigns it to $num . $num
    becomes 12 and the echo statement is executed again to give us “The number is
    12” as output. This keeps repeating until all the elements in $arr1 have been
    accounted for. If you run the code above, you’ll get The number is 11 The number
    is 12 The number is 13 The number is 14 The number is 15 as the output. Next,
    let’s look at a foreach loop that uses the second syntax. This syntax gives us
    both the values and keys of the elements in an array and is very useful when working
    with associative arrays. Suppose we have $arr2 = array(''Aaron''=>12, ''Ben''=>23,
    ''Carol''=>35); To get the keys and values of the elements in $arr2 , we can use
    the foreach loop below: foreach ($arr2 as $name=>$age){ echo $name.'' is ''.$age.''
    years old.<BR>''; } This gives us Aaron is 12 years old. Ben is 23 years old.
    Carol is 35 years old. as the output. 6.3.6 While Loop Next up is the while loop.
    This loop performs a task repeatedly while a specific condition remains valid.
    The syntax is as follows: while (condition is true) { //do A } As usual, let’s
    look at an example: 1 $d = 1; 2 3 while ($d < 5) 4 { 5       echo ''The value
    of $d is ''.$d.''<BR>''; 6       $d++; 7 } Here, we first declare a variable called
    $d and assign the value 1 to it. Next, we have the while loop from lines 3 to
    7. On line 3, the while loop checks if the condition $d < 5 is true . If it is,
    it executes the statements inside the curly braces that follow. In other words,
    it executes the echo statement on line 5 and increments $d by 1 on line 6. As
    a result, $d becomes 2 . Next, the while loop returns to line 3 to check if $d
    is still smaller than 5 . If it is, it executes the code inside the curly braces
    again. This process of checking and updating the value of $d continues until $d
    is no longer smaller than 5 . If you run the code above, you’ll get the following
    output: The value of $d is 1 The value of $d is 2 The value of $d is 3 The value
    of $d is 4 At this point, you may notice that the while loop is very similar to
    the for loop. Indeed, in most cases, both of them serve the same purpose. However,
    when using a while loop, one important difference is that we must remember to
    update the variable used for looping ( $d in this example). If we forget to do
    that, the while loop will run indefinitely, resulting in an infinite loop. For
    instance, in our example, if we omit line 6 ( $d++; ), the while loop will never
    end as the value of $d will always be 1 , which is smaller than 5 . Got it? Good!
    6.3.7 Do-while Loop Last but not least, let’s move on to the do-while loop. This
    loop is very similar to the while loop except that the test condition is placed
    at the end of the loop. This means that the code within the curly braces of the
    loop will always be executed at least once. The syntax of a do-while loop is do
    { //some tasks } while (condition is true); Note that a semicolon ( ; ) is required
    after the test condition. Here’s an example of how the loop works. 1 $e = 100;
    2 3 do { 4      echo ''The value is ''.$e; 5      $e++; 6 } while ($e<0); On line
    1, we first declare and initialize a variable $e with the value 100 . Next, we
    have the do-while loop from lines 3 to 6. Within the loop, the program executes
    the echo statement on line 4 and increments the value of $e to 101 on line 5.
    Finally, it reaches the test condition on line 6. As the value of $e is not smaller
    than 0 , the test fails. The program exits the do-while loop and does not repeat
    the tasks in the loop. If you run the code above, you will get The value is 100
    as the output. Although the original value of $e does not meet the test condition
    ($e < 0 ), the code inside the curly braces is executed once as the test condition
    comes after the closing curly brace. 6.4 Other Topics in Flow Control Great! We’ve
    covered all the main control structures in PHP. Before we end this chapter, I
    would like to cover a few more miscellaneous topics related to flow control in
    PHP. 6.4.1 Booleans First, let’s talk about the bool data type. We encountered
    this data type in Chapter 4.3 and learned that it can only store one of two values
    – true or false. In PHP, most values can be converted to true or false (i.e.,
    converted to the bool data type). Values that convert to false include: '
  toc: []
  trans: "\n\n# 第 6 章：PHP 中的控制结构\n\n恭喜你来到了第 6 章；有趣的内容开始了！在本章中，我们将介绍 PHP 中的各种控制结构，例如\
    \ `if` 语句、`for` 循环和 `while` 循环。这些结构允许我们控制程序的执行流。然而，在开始之前，我们需要讨论两组运算符——比较运算符和逻辑运算符。控制程序的执行流涉及评估这些运算符的结果并据此进行。\n\
    \n## 6.1 比较运算符\n\n让我们先来看看比较运算符。这些运算符比较两个值并根据比较结果返回 `true` 或 `false`。它们包括：\n\n\
    -   相等 (`==`))：如果两边的值相等则返回 `true`（例如，`5 == 5`、`'Hello' == 'Hello'` 和 `5 == 5.0`\
    \ 均返回 `true`）\n-   相同 (`===`)：如果两边的值相等且类型相同则返回 `true`（例如，`5 === 5` 返回 `true`，而\
    \ `5 === 5.0` 返回 `false`）\n-   不等于 (`!=` 或 `<>`)：如果两边的值不相等则返回 `true`（例如，`5 !=\
    \ 7` 和 `5 <> 7` 均返回 `true`）\n-   不相同 (`!==`)：如果两边的值不相等或类型不同则返回 `true`（例如，`5 !==\
    \ 5.0` 返回 `true`，因为 `5` 和 `5.0` 的数据类型不同）\n-   大于 (`>`)：如果左侧的值大于右侧的值则返回 `true`（例如，`7\
    \ > 2` 返回 `true`）\n-   大于等于 (`>=`)：如果左侧的值大于或等于右侧的值则返回 `true`（例如，`8 >= 5` 和 `6\
    \ >= 6` 均返回 `true`）\n-   小于 (`<`)：如果左侧的值小于右侧的值则返回 `true`（例如，`9 < 12` 返回 `true`）\n\
    -   小于等于 (`<=`)：如果左侧的值小于或等于右侧的值则返回 `true`（例如，`10 <= 14` 和 `13 <= 13` 均返回 `true`）\n\
    -   船位运算符 (`<=>`)：在 PHP 7 中引入。如果两边的值相等（不一定相同）则返回 0；如果左侧的值大返回 1；如果左侧的值小则返回 -1（例如，`5\
    \ <=> 7` 返回 `-1`，而 `5 <=> 5.0` 返回 `0`）\n\n## 6.2 逻辑运算符\n\n接下来我们有一组逻辑运算符。常用的运算符包括：\n\
    \n### NOT\n当 `NOT` (`!`) 运算符跟在一个为假的表达式之前时，返回 `true`。例如，`!(5 > 10)` 返回 `true`，因为\
    \ `5 > 10` 是 `false`（即 `5` 不大于 `10`）。\n\n### AND\n`AND` 运算符允许我们组合两个比较结果，并在两个比较都返回\
    \ `true` 时返回 `true`。我们可以使用 `and` 关键字（不区分大小写）或 `&&` 符号。两者作用相似，但优先级不同。让我们来看一些示例：\n\
    \n示例 1：\n```php\n$a = 5 > 3 and 4 < 10;\n$b = 5 > 3 && 4 < 10;\n$c = 5 > 1 &&\
    \ 13 < 5;\nvar_dump($a); var_dump($b); var_dump($c);\n```\n输出：\n```text\nbool(true)\n\
    bool(true)\nbool(false)\n```\n在上面的示例中，`$a` 和 `$b` 为 `true`，因为两个比较（`5 > 3 and 4\
    \ < 10`）都是 `true`。相比之下，`$c` 为 `false`，因为第二个比较（`13 < 5`）是 `false`。\n\n示例 2：\n```php\n\
    $d = 3 > 2 && 3 < 1;\n$e = 3 > 2 and 3 < 1;\nvar_dump($d); var_dump($e);\n```\n\
    输出：\n```text\nbool(false)\nbool(true)\n```\n这个示例说明了 `and` 关键字与 `&&` 符号之间的优先级差异。`&&`\
    \ 的优先级高于赋值运算符 (`=`)。因此，语句 `$d = 3 > 2 && 3 < 1;` 被评估为 `$d = (3 > 2 && 3 < 1);`；由于\
    \ `3 < 1` 为 `false`，`$d` 为 `false`。相反，`and` 关键字的优先级低于赋值运算符。因此，语句 `$e = 3 > 2 and\
    \ 3 < 1;` 被评估为 `($e = 3 > 2) and 3 < 1;`；`$e` 为 `true`，因为只有第一个比较（`3 > 2`）的结果被赋值给它。在大多数情况下，由于优先级更高，优于使用\
    \ `&&`。\n\n### OR\n接下来是 `OR` 运算符。当至少有一个比较返回 `true` 时，该运算符返回 `true`。我们可以使用 `or`\
    \ 关键字或 `||` 符号。不过，我鼓励你使用 `||`，它的优先级更高。\n示例：\n```php\n$f = 4 < 7 || 10 > 3;\n$g\
    \ = 3 < 2 || 3 > 1;\n$h = 10 > 15 || 12 < 1;\nvar_dump($f); var_dump($g); var_dump($h);\n\
    ```\n输出：\n```text\nbool(true)\nbool(true)\nbool(false)\n```\n`$f` 为 `true`，因为两个比较都是\
    \ `true`。`$g` 为 `true`，即使第一个比较（`3 < 2`）是 `false`，因为 `||` 只需要一个比较为真。`$h` 为 `false`，因为没有比较是\
    \ `true`。\n\n## 6.3 控制结构\n\n现在我们已经熟悉了比较，准备好讨论 PHP 中的各种控制结构。\n\n###6.3.1 If 语句\n\
    首先是 `if` 语句。该语句允许程序在满足条件时根据结果执行相应的操作。`if` 语句的语法如下：\n\n```php\nif (条件 1 满足) {\n\
    \    // 执行任务 A\n} elseif (条件 2 满足) {\n    // 执行任务 B\n} elseif (条件 3 满足) {\n  \
    \  // 执行任务 C\n} else {\n    // 执行任务 D\n}\n```\n让我们来看一个真实的示例：\n```php\n$a = 7;\n\
    if ($a < 0) {\n    echo 'if block\\ns smaller than 0';\n} elseif ($a < 5) {\n\
    \    echo 'First elseif block';\n} elseif ($a < 10) {\n    echo 'Second elseif\
    \ block';\n} else {\n    echo 'Else block';\n}\n```\n在这里，我们首先声明变量 `$a` 并将其赋值为\
    \ `7`。接下来，从第 3 行到第 7 行是 `if` 块。测试条件 `$a < 0`。如果真，程序执行大括号内的内容（即第 4 到 7 行），跳过 `if`\
    \ 语句其余部分。另一方面，如果 `$a < 0` 为假，程序跳过 4 到 7 行，继续测试第 8 行的 `elseif` 条件（`$a < 5`）。如果该条件为，执行第\
    \ 9 行。注意我们没有将第 9 行包裹在大括号中吗？这是因为只有一个语句要执行，大括号是可选的。如果条件 `$a < 5` 为假，程序继续测试第 10 行的下一个\
    \ `elseif` 条件（`$a < 10`）。如果该条件也为假，则进入 `else` 块并执行第 13 行。\n\n等等，抱歉。上面的示例中有 `elseif`\
    \ 块。此外，`elseif` 和 `else` 块是可选的。如果我们省略它们，当 `if` 条件不满足时，`if` 语句什么都不做。如果你运行上面的代码，将得到以下输出：\n\
    ```text\nSecond elseif block\n```\n由于 `$a` 等于 `7`，它通过了 `if` 条件（`$a < 0`）和第一个 `elseif`\
    \ 条件（`$a < 5`）。然而，它通过了第二个 `elseif` 条件（`$a < 10`）。因此，执行了第 11 行。尝试更改第 1 行 `$a` 的值并重新运行代码以完全工作原理。`$a`\
    \ 可能值的输出如下：\n- 如果 `$a` 等于 `-2`，我们得到 `if block smaller than 0`\n- 如果等于 `3`，我们得到\
    \ `First elseif block`\n- 如果等于 `11`，我们得到 `Else block`\n\n###6.3.2 三元运算符\n接下来，让我们讨论三元运算符。在之前的示例中，我们有一个带有两个\
    \ `elseif` 块的相对复杂的 `if` 语句。如果你只想做一个简单的 `if-else` 测试（无任何 `elseif` 块），可以使用三元运算符\
    \ (`?`）。语法如下：\n\n`条件 ? 任务 A : 任务 B`\n\n三元运算符首先检查左侧的条件。如果为真，执行任务 A。否则，执行任务 B。让我们来看一个示例：\n\
    ```php\n$a = (7 == 7 ? 'Yes' : 'No');\necho $a;\n```\n在这里，测试的条件是 `7 == 7`。由于该条件为真，三元运算符执行第一个任务并返回字符串\
    \ `'Yes'`。然后我们将此字符串赋值给 `$a` 并使用 `echo` 语句在下一行显示其值。如果运行上面的代码，我们将得到输出“Yes”。相反，如果我们把三元语句改为\
    \ `$a = (7 > 10 ? 'Yes' : 'No');`，我们将得到输出“No”，因为 `7 > 10` 为假。\n\n###6.3.3 Switch\
    \ 语句\n接下来我们有 `switch` 语句。该语句与 `if` 语句类似，如果你有很多条件需要测试，它的速度可能会更快。它通常用于条件涉及将变量与单个值进行比较（而不是值范围）的情况。语法如下：\n\
    \n```php\nswitch (用于切换的变量) {\n    case 情况 1: 任务 A; break;\n    case 情况 2: 任务 B;\
    \ break;\n    ...\n    default: 默认任务;\n}\n```\n让我们来看一个示例：\n```php\n$b = 20;\n\
    switch ($b) {\n    case 10:\n        echo 'Chocolate';\n        break;\n    case\
    \ 20:\n        echo 'Lemon';\n        break;\n    case 25:\n        echo 'Strawberry';\n\
    \        break;\n    default:\n        echo 'None of the above';\n}\n```\n在上面的示例中，我们首先声明变量\
    \ `$b` 并将其赋值为 `20`。接下来，从第 3 行到第 15 行是 `switch` 语句。`switch` 语句使用 `$b` 的值来决定执行哪个\
    \ `case`。当满足某个 `case` 时，执行其内容。如果 `$b` 是 `10`，满足了 `case 10`，程序执行第 5 行并输出“Chocolate”。另一方面，如果\
    \ `$b` 是 `25`，满足了 `case 25`，程序执行第 11 行并输出“Strawberry”。最后，如果 `$b` 不是 `10` 或 `25`，则执行\
    \ `default` 情况。\n\n###6.3.4 For 循环\n接下来，让我们来看 `for` 循环。该控制结构重复执行代码块，直到条件不再有效。语法如下：\n\
    \n```php\nfor (初始值; 测试条件; 修改值) {\n    // 执行任务\n}\n```\n让我们来看一个示例：\n```php\nfor\
    \ ($c = 1; $c < 5; ++$c) {\n    echo 'The value of $c is '.$c;\n}\n```\n`for`\
    \ 循环的重点是第一行。该行有三个部分，用分号分隔。在我们的示例中，第一部分声明变量 `$c` 并将其初始化为 `1`。第二部分测试 `$c < 5`。如果真，将执行大括号内的语句。第三部分修改用于测试的变量的值。在我们的示例中，我们使用递增运算符将\
    \ `$c` 加 1。递增后，程序测试 `$c` 的新值是否仍然小于。直到条件 `$c < 5` 不再成立，程序退出 `for` 循环。如果你运行上面的代码，将得到：\n\
    ```text\nThe value of $c is 1\nThe value of $c is 2\nThe value of $c is 3\nThe\
    \ value of $c is 4\n```\n\n###6.3.5 Foreach 循环\n接下来我们有 `foreach` 循环。这种循环类似于 `for`\
    \ 循环，但用于遍历数组。有两种语法：\n\n```php\nforeach ($array as $value) {\n    // 要执行的代码;\n\
    }\nforeach ($array as $key => $value) {\n    // 要执行的代码;\n}\n```\n上面语法中的名称 `$array`、`$value`\
    \ 和 `$key` 是我们选择的；如果需要，可以使用其他名称。让我们来看一个使用第一种语法的示例：\n```php\n$arr1 = array(11,\
    \ 12, 13, 14, 15);\nforeach ($arr1 as $num) {\n    echo 'The number is '.$num;\n\
    }\n```\n在这里，我们声明一个带有 `11`、`12`、`13`、`14` 和 `15` 值的数组 `$arr1`。接下来我们有 `foreach`\
    \ 循环。该循环逐个遍历 `$arr1` 中的元素并将每个元素赋值给名为 `$num` 的变量。第一次运行时，`arr1` 中的第一个元素被赋值给 `$num`。也就是说，`11`\
    \ 被赋值给 `$num`。在将 `11` 赋值给 `$num` 后，程序执行后续大括号中的代码。我们得到了“The number is 11”。一旦完成，`foreach`\
    \ 循环移动到第二个元素并赋值给 `$num`。`$num` 变为 `12`，再次执行 `echo` 语句输出“The number is 12”。这一直重复，直到\
    \ `$arr1` 中的所有元素都处理完毕。如果你运行上面的代码，将得到：\n```text\nThe number is 11\nThe number is\
    \ 12\nThe number is 13\nThe number is 14\nThe number is 15\n```\n接下来，让我们来看关联数组的第二种语法：\n\
    ```php\n$arr2 = array(\n    'Aaron' => 12,\n    'Ben' => 23,\n    'Charlie' =>\
    \ 34,\n    'David' => 45,\n    'Eve' => 56\n);\nforeach ($arr2 as $key => $value)\
    \ {\n    echo \"$key is $value\\n\";\n}\n```\n在这个示例中，`$key` 代表键，$value` 代表值。\n\
    \n## 6.4 控制中的其他话题\n\n太棒了！我们已经涵盖了 PHP 中所有的控制结构。在结束本章之前，我想讨论一些与 PHP 控制相关的杂杂话题。\n\
    \n###6.4.1 布尔值\n\n首先，让我们谈谈 `bool` 数据类型。我们在第 4.3 章遇到过这种数据类型，并了解到它只能存储两个值之一——真或假。在\
    \ PHP 中，大多数值都可以转换为真或假（即转换为 bool 数据类型）。转换为假 的值包括：\n\n"
- fmt: "\n| Value | Description |\n| --- | --- |\n| numbers that represent zero (such\
    \ as 0 and 0.0) |\n| the empty string (such as `''`, which is made up of two single\
    \ quotes with no text enclosed) |\n| the string `\"0\"` |\n| an array with zero\
    \ elements |\n| a special value called `NULL` |\n\nOn the other hand, most other\
    \ values (such as 1, 3.4, and `\"Hello\"`) convert to `true`. We’ve seen how control\
    \ structures decide whether to execute a certain block of code depending on whether\
    \ a condition evaluates to `true` or `false`. Suppose we have the following `if`\
    \ statement:\n\n`if (\"hello\") echo 'if block'; else echo 'else block';`\n\n\
    If we run the statement above, we’ll get `if block` as the output. This is because\
    \ the string `\"hello\"` is converted to `true`. For any control structure, as\
    \ long as a condition evaluates to `true`, regardless of whether it is the result\
    \ of a comparison (e.g., `$a < 5`) or a value converted to `true`, the corresponding\
    \ block of code will be executed. In the `if` statement above, the `if` block\
    \ is executed as the `if` condition `(\"hello\")` evaluates to `true`. Got it?\
    \ Good!\n\n## 6.4.2 Break, Continue\n\nNext, let’s discuss `break` and `continue`\
    \ statements. These statements can be used to modify the behavior of our control\
    \ structures. We’ve already encountered the `break` statement when we talked about\
    \ the `switch` statement previously. When a particular `switch` case is satisfied,\
    \ the `switch` statement executes everything that follows until it encounters\
    \ a `break` statement. Besides using it in a `switch` statement, we can use the\
    \ `break` statement in a loop. A `break` statement ends the execution of the loop\
    \ it is in.\n\nLet’s look at an example:\n\n```\nfor ($i = 0; $i < 50; ++$i) {\n\
    \    echo \"$i<BR>\";\n    if ($i == 4) break;\n}\n```\n\nHere, we have an `if`\
    \ statement inside a `for` loop. It is fairly common for us to nest one control\
    \ structure inside another in programming. Within the `for` loop, we first echo\
    \ the value of `$i`. Next, we check if `$i` equals `4`. If it equals, we want\
    \ the program to break out of the `for` loop. If you run the code above, you’ll\
    \ get the following output: `0 1 2 3 4`.\n\nIf we do not have the `break` statement,\
    \ the `for` loop should run 50 times, from `$i = 0` to `$i = 49`. However, as\
    \ we have the `break` statement, this loop only runs from `$i = 0` to `$i = 4`.\
    \ This is because when `$i` equals `4`, the `if` condition `($i == 4)` evaluates\
    \ to `true`. The `break` statement that follows then causes the program to break\
    \ out of the `for` loop, skipping the rest of the iterations (from `$i = 5` to\
    \ `$i = 49`). Got it?\n\nNext, we have the `continue` statement. This statement\
    \ does not cause a loop to end prematurely. Instead, it causes the rest of the\
    \ loop to be skipped for that particular iteration. Let’s look at an example:\n\
    \n```\nfor ($i = 0; $i < 6; ++$i) {\n    echo '$i = '.$i.', ';\n    if ($i ==\
    \ 4) continue;\n    echo 'First.';\n    echo 'Second.<BR>';\n}\n```\n\nIf you\
    \ run the code above, you’ll get the following output:\n`$i = 0, First.Second.`\n\
    `$i = 1, First.Second.`\n`$i = 2, First.Second.`\n`$i = 3, First.Second.`\n`$i\
    \ = 4, $i = 5, First.Second.`\n\nNotice that when `$i` equals `4`, the text “First.Second.”\
    \ does not appear? This is because when `$i` equals `4`, the `continue` statement\
    \ caused the program to skip the statements `echo 'First.'; echo 'Second.<BR>';`\
    \ for that iteration. Other than that, the code runs as per normal. Clear?\n\n\
    ## 6.4.3 Alternative Syntax\n\nNext, let’s move on to talk about an alternative\
    \ syntax for control structures in PHP. PHP offers an alternative syntax for some\
    \ of its control structures, specifically the `if`, `while`, `for`, `foreach`,\
    \ and `switch` structures. This syntax involves changing opening braces to colons\
    \ (`:`) and the last closing brace to `endif;`, `endwhile;`, `endfor;`, `endforeach;`,\
    \ or `endswitch;` respectively.\n\nLet’s use an `if` statement to illustrate this:\n\
    \n```php\nif ($condition) {\n    echo \"true block\";\n} else {\n    echo \"false\
    \ block\";\n}\n```\n\nUsing the alternative syntax:\n\n```php\nif ($condition):\n\
    \    echo \"true block\";\nelse:\n    echo \"false block\";\nendif;\n```\n\nNotice\
    \ that in the alternative syntax, the opening brace is replaced by a colon and\
    \ the closing brace is replaced by `endif;`. This syntax is particularly useful\
    \ when mixing PHP with HTML.\n"
