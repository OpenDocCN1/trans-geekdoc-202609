    generator responsible for generating new jobs, and a scheduler responsible for
    delivering jobs (Shown as Figure 2). Since all volunteers'' task assignment and
    publisher''s task storage need to pass through the task server in large-scale
    applications, the task server is likely to have performance or network bottlenecks
    and cause scalability problems and single point of failure problem.


    ![](img/147d0ed8c8a0094bfeef9a98595d91c8_1_0.png)


    Fig. 1. A BOINC server consists of several components, sharing several forms of
    storage.


    ![](img/147d0ed8c8a0094bfeef9a98595d91c8_1_1.png)


    Fig. 2. The components of a BOINC task server.


    ## B. Basic Principles of Blockchain Based Design


    In this design, volunteers and publishers exchange data through the blockchain.
    At the same time, all volunteers and publishers serve as nodes in the blockchain
    network and support the operation of the blockchain network. Therefore, a decentralized
    volunteer computing system can be established based on the blockchain. (Shown
    as Figure 3) Since the task server is no longer used, and thanks to the decentralized
    nature of the blockchain, the scalability problem and single point of failure
    caused by the bottleneck of the task server can be solved.


    ![](img/147d0ed8c8a0094bfeef9a98595d91c8_1_2.png)


    Fig. 3. Volunteer computing based on blockchain.


    Under this decentralized framework, because there is no centralized server, people
    cannot use a method like a centralized system to allocate and schedule tasks.
    Therefore, the publisher needs to split the project into multiple jobs with a
    suitable amount of computing content and treat each job as a "job block", and
    then publishes it on the blockchain. Then, volunteers can find unprocessed job
    on the blockchain for processing, and post a "processing block" on the blockchain
    to mark that the job is being processed, and other volunteers can use the "processing
    block" to determine whether the job is being handled by other volunteers. When
    the volunteer has finished processing the job, a "result block" should be issued
    to prove that the job has been completed, which should contain the output of the
    job.


