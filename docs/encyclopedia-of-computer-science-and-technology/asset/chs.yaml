  \ N. COOPER 指挥与控制决策 10.1201/97836781495\n\n## 背景概念\n\n指挥（C2）是效能过程的要素，如图 1 所示，同时也是增强人类表现的手段。图\
  \ 2 表明基于系统的辅助工具和支持系统支持包括 C2 在内的多种活动。本文重点关注 C2 的技术、C2 决策辅助工具的设计与开发，以及一些著名的 C2 决策支持系统。\n\
  \n图 1. 效能过程。\n图 2. 基于系统的支持系统范围。\n\n### 什么是指挥与控制（C2）？\n\n指挥与控制（C2）是军事和民用“指挥官”对人力物物资源行使权威和指导以实现战术和战略目标的过程。C2\
  \ 通过协调一系列设施、通信、设备以及监控、预测、指导、分配资源生成方案来实现。在工业领域，管理者识别市场目标并动员资源来实现目标；在军事领域，指挥官计划并执行复杂的阶段性行动以履行任务。工业指挥官动员工厂、进取的经理、工人以及天然和合成资源来生产卓越产品。军事指挥官动员武器、部队和复杂的设备来防御和获取领土以及相关的军事和政治目标。\n\
  \n### 什么是指挥与控制（C2）决策？\n\n决策是 C2 的核心。虽然指挥官始终需要数据、信息和知识来辅助决策，但决策过程本身可以得到 C2 决策支持系统的支持。这些系统支持指挥官的“认知”功能，包括威胁性质、组织能力的评估以及行动机会的识别。C2\
  \ 决策支持系统还能识别决策限制，例如时间限制和信息模糊。\n\n图 3 显示了 C2 决策支持系统的机会范围。目前有多种决策支持系统支持矩阵中单元格的决策。有支持国家军事指挥层级、联合司令和特定司令、各兵种以及一线决策的系统。请注意，图\
  \ 3 还表明存在战略、戏剧、盟军和战术层面，且假设在战争-和平连续体的不同点，决策是非常不同的。\n\n图 3. C2 决策矩阵。\n图 4 显示了战术级指挥官必须做出的\
  \ C2 决策的复杂性范围。所有级别和所有兵种的指挥官必须解决相似的问题并做出相同类型的决策。\n\n图 4. C2 决策示例。\n\n\n\n\n\n或许理解\
  \ C²（指挥与控制）决策辅助和支持系统何处帮助最大的方法，是识别指挥官经常面临的特殊问题。其中一些问题包括：\n\n### 欠佳的信息管理\n\n*   信息“过载”\n\
  *   寻找关键信息困难\n*   信息呈现方式不佳\n*   错误信息\n*   歧义信息\n*   不完整信息\n\n### 方案生成与执行有限\n\n*\
  \   替代方案生成有限\n*   方案评估欠佳\n*   情景生成能力有限\n*   实时模拟能力有限\n\n这些以及其他问题总结在图 5 中，该图还提示了\
  \ C² 决策辅助和支持系统在处能产生最大的收益。\n\n![图 5. C2 决策的机遇。](img/pg63_Image_107.jpg)\n\n图 5. C²\
  \ 决策的机遇。\n\n从 1979 年左右（这一日期标志着微型在整个国防体系内开始广泛普及）开始，决策辅助和大型支持系统已被设计、开发并应用于各种 C² 决策问题（有关若干代表性系统的详情请参见案例研究）。\n\
  \nC² 决策支持系统帮助指挥官在替代方案之间进行区分，模拟方案的执行情况，并评估指挥官在各种情况下所做决策的影响。它们帮助指挥官测试假设、进行“假设”分析并开展决策“事后分析”。\n\
  \n## 决策辅助技术\n\n为 C² 设计和开发决策辅助的人员求助于社会、行为、工程、数学、计算机和管理科学。C² 决策支持系统的设计和开发在本质和需要上都是多学科的。先进\
  \ C² 系统的设计者可以使用多种分析方法和其他工具与技术。图 6 识别了主要的决策辅助技术。\n\n![图 6. 主要的决策辅助技术。](img/pg64_Image_108.jpg)\n\
  \n图 6. 主要决策辅助技术。\n\n### 用于交互式决策辅助的分析方法\n\nC² 决策辅助和支持系统的设计者有多种分析方法可供。关键在于将分析方法与问题正确匹配[*3*]。这里有几类值得讨论的主要方法。它们包括决策分析方法、运筹学方法、源自计算机科学和人工智能的方法，以及源自人因工程领域的方法。\n\
  \n#### 决策分析方法\n\n用于驱动 C² 决策支持系统的某些方法、工具和技术包括效用/价值模型、概率模型和混合价值-概率模型[*4*]。效用/价值模型有多种。某些基于传统的成本效益模型和假设。另一些基于将价值视为“遗憾”的考虑，即效用的“反面”，因为许多\
  \ C² 指挥官对成本的感知比收益更生动。还有一些是基于多属性效用评估（MAUA）模型。MAUA 模型是评估替代方案相对价值的强大工具。\n\n#### 运筹学方法\n\
  \n许多工具和技术构成了运筹学方法的范围[5]。有几个值得特别提到，包括线性规划、动态规划、整数规划、队列理论、系统分析的各个方面，甚至是经典的定量-推断统计方法。\n\
  \n线性规划是寻求优化的运筹学方法的代表。当满足以下条件时，线性规划方法可以应用于复杂的资源分配和优化问题[5]：\n\n*   当问题的参数构成线性函数时\n\
  *   当存在替代资源组合时\n*   当线性函数（和约束）可以用数学表达式时\n*   当变量之间的数学关系可以映射时\n*   当资源是有限的（且可量化的）时\n\
  \n\n\n\n计算机科学是一门根于信息论的学科，它将电子数据处理与数据存储和检索的数据及模型联系起来。计算机科学的工具和技术使得实施各种方法成为可能，这些方法更准确地归类于上述一个或多个类别。模式识别、排队、网络、库存建模和模拟虽然经常被认为是计算机科学方法，但它们实际上属于运筹学社区。数据库管理方法实际上属于管理科学社区，而文档检索方法则属于那些应用图书馆和信息科学工具与技术的人员。理解这些方法范围（来自上述任何一类）的关键不在于对学科或探究领域的严格定义，而在于建立完善的、不冗余的方法分类法。理想情况下，这些分类法将植根于社会、行为科学、工程、计算机、数学和管理科学。\n\
  \n“常规”算法方法是指那些为了特定的问题解决目的而收集、提炼、存储、路由、处理和创建数据及信息的方法；在许多情况下，这等同于编写算法来实现决策分析、运筹学或管理科学方法。在其他情况下，它简化为表格和图形显示的开发，而在另一些情况下，常规计算机科学方法被应用于数据库的清理工作中。\n\
  \n人工智能（AI）方法寻求识别、编码和处理知识。AI 系统与常规系统在许多重要方面有所不同。首先，常规系统在某些特定的处理边界内存储和操纵数据。AI 系统在选定的问题领域内将知识存储并应用于各种未指定的问题。AI\
  \ 系统可以进行推理、实施经验规则，并以人类解决问题相似的方式解决某些领域的问题。\n\n知识表示是 AI 的支柱。对于“知识工程师”（负责将问题解决过程转换为可执行软件的\
  \ AI 系统分析师）来说，有许多选择。最流行的知识表示技术是规则，这是一种“如果——那么”的形式，它允许知识工程师通过一些相对简单的知识表达式来开发推理策略。例如，如果油箱无法启动，可以编写一系列规则来代表诊断人员为解决问题而可能采取的步骤：\n\
  \n* 如果引擎无法启动，则检查电池\n* 如果电池正常，则检查电磁阀\n* 如果电磁阀正常，则检查油箱\n* 如果油箱是满的，则检查启动机 . . .\n\n\
  这些简单的规则可以被扩展和重新排列顺序。数百条规则可以用于执行复杂的诊断、维护和规划任务。\n\n其他一些知识表示技术还包括框架、推理网络和对象—属性—值三元组\
  \ [[6]]。\n\n所有知识表示技术都力表示从通用知识结构进行推理的过程。一旦知识被表示，它就可以用于驱动专家系统、自然语言处理系统、机器人系统和视觉系统。专家系统体现了关于问题解决的专家知识；自然语言系统允许与分析算法进行自由格式的交互；机器人系统利用知识识别物体并在复杂环境中进行操纵；视觉系统智能地处理图像并“看”、识别和对它们的微环境做出响应\
  \ [[7]]。\n\n### 人机工程学方法\n\n除了上述讨论的分析方法外，C² 决策辅助和支持系统还必须理解几类方法。这些包括所有与系统连接到用户的实际手段相关的内容。所有这些问题、技术和方法都属于人机工程的总体范畴。\n\
  \n### C² 任务/方法匹配\n\n当分析方法“匹配”特定的 C² 要求时，最能发挥其作用。图 8 表明，分析方法的选择不能独立于系统旨在满足的要求。C²\
  \ 系统设计和开发中的“任务/方法匹配”步骤对于成功系统的应用至关重要 [[9]]。\n\n图 8。任务/方法流程。\n\n### C² 决策辅助和支持系统的设计与开发\n\
  \n旨在供无经验计算机用户解决分析问题的决策支持系统的设计与开发，与为频繁用户提供库存控制支持的系统设计开发有本质区别。因此，设计和开发 C² 决策辅助支持系统的实体完善了其需求分析技术。许多技术依赖于对指挥官进行结构化访谈以确定他们的决策需求。C²\
  \ 决策系统设计师还认可了系统设计的“快速原型”方法，因为首次捕获 C² 决策需求是非常困难的。因此，C² 系统设计师构建系统的多个工作原型，以便在进行全面开发之前验证需求。最后，C²\
  \ 决策辅助社区对如何评估系统投入了大量精力。\n\n#### C² 决策需求分析\n\nC² 决策辅助和支持系统的设计人员通过采用多种方法识别并提炼决策需求。这些方法包括调查和问卷法、基于访谈和（直接和间接）观察的方法，以及模拟和游戏方法。\n\
  \nC² 需求分析的关键在于识别关键决策任务，这些任务在执行良好时可以显著提高 C² 决策性能。\n\n\n\n\n\n[图 9]展示了一个三维需求矩阵，阐明了任务、用户和组织特征之间的交集。矩阵中的每个单元格都代表一个需求挑战。矩阵中的任务是通用的；在实践中，`C²`\
  \ 需求分析师会将这些通用任务转换为非常具体的任务（例如，涉及资源分配问题、战术规划和目标价值分析）。也许同一位需求分析师会对用户进行更详细的定义，而不仅仅是无经验/有经验/不频繁用户/频繁用户。组织——学说特征也可以有更详细的规定。无论细节程度如何如何（以及用于实现这些细节的方法），需求矩阵都表明，谨慎的\
  \ `C²` 决策辅助和支持系统设计师应该处理需求挑战的所有三个维度。\n\n![图 9. 三维 C2 需求矩阵。](img/pg70_Image_111.jpg)\n\
  \n**图 9. 三维 C² 需求矩阵。**\n\n### ### C² 系统建模与原型设计\n\n[图 10]通过原型设计展示了 `C²` 系统设计与开发流程。原型设计受到\
  \ `C²` 设计社区的认可，是因为在首次通过需求流程时，要识别和完善 `C²` 需求（尤其是决策需求）是非常困难的。原型假设要求对正在开发的决策支持系统设计一个运行模型，征求潜在用户对模型的反应，并在需求可以被验证时对模型进行完善。原型设计要求迭代。它还需要开发两种原型系统：“丢弃型”系统和“演化型”系统。当需求特别难以捕捉时使用丢弃型系统；当\
  \ `C²` 需求不那么模糊时使用演化型系统。（一旦需求开始出现，丢弃原型就会演变为演化原型。）\n\n![图 10. 通过原型设计的 C2 系统设计与开发流程](img/pg71_Image_112.jpg)\n\
  \n**图 10. 通过原型设计的 C² 系统设计与开发流程**\n\n### ### C² 系统评估\n\n`C²` 决策辅助和决策支持系统的评估比传统的软件系统更为全面。原因很简单：`C²`\
  \ 决策辅助和支持系统本质上是以用户为导向的。因此，对其性能的评估必须尝试衡量系统支持需求的程度、与用户交互的性、是否支持其旨在服务的组织使命、是否包含高效算法、是否可维护以及是否有文档（无论文档优坏）。换句话说，决策辅助和支持系统的评估涵盖了所有传统的软件性能问题，还涉及系统为用户和组织提供服务的优劣程度问题。\n\
  \n评估决策辅助和支持系统最有效的方法之一来自 Adelman 和 Donnell [10]。[图 11]展示了这种用于评估决策辅助和支持系统的多属性效用评估结构。请注意其对用户、组织和准确性的取向。在完善的决策辅助评估中，该结构将与传统的软件质量保证模型结合使用，以确定系统支持用户和运行的情况。\n\
  \n![图 11. 用于 C2 决策辅助/支持系统评估的多属性效用评估结构。](img/pg73_Image_113.jpg)\n\n**图 11. 用于 C²\
  \ 决策辅助/支持系统评估的多属性效用评估结构。**\n\n## ## C² 决策辅助与支持系统的设计、开发与应用案例\n\n`C²` 决策辅助和支持系统已应用于一系列\
  \ `C²` 问题。许多系统仍停留在原型阶段，因为它们初衷仅是为了演示或证明某个概念。然而，许多其他系统已取得了运行上的成功。\n\n### ### 一些运行原型\n\
  \n#### #### Conscreen [[11]\\]\n\n`CONSCREEN` 是一个原型系统，旨在帮助战术规划员识别和评估替代方案。它采用的方法是多属性效用评估。该系统要求用户根据一组标准对若干方案进行评估，这些标准旨在逐项衡量每种方案的理想性标准。[图\
  \ 12]展示了规划员用于评估替代方案的、来自 [11] 的多属性效用结构。在规划员评估了替代方案后，系统会计算方案的整体效用（或对规划员的价值）。系统根据方案满足标准的程度对计划进行排名。\n\
  \n![图 12. 用于评估替代战术计划的多属性效用评估结构。](img/pg74_Image_114.jpg)\n\n**图 12. 用于评估替代战术计划的多属性效用评估结构。**\n\
  \n#### #### OB1KB [[12]\\]\n\n`OB 1KB` 是一个帮助战术家管理战斗序列的专家系统。`OB 1KB` 使用规则帮助指挥官做出战斗管理决策。该系统使用图形（基于地图）界面，旨在扩大系统知识库与用户之间的通信带宽。该原型执行的具体任务包括跟踪敌方移动、识别敌方位置和态势以及生成战场态势的估计。\n\
  \n#### #### KNOBS [[13]\\]\n\n`KNOBS`（基于知识的系统）帮助空军战术指挥官进行任务规划，特别是进攻空任务规划。系统协助指挥官分配资源、选择与已知目标匹配的武器、确定应使用的空战术优先级，并评估限制因素（如敌方行为和天气）的影响。`KNOBS`\
  \ 是基于知识的，即它使用一个由关于任务规划的框架和规则组成的知识库。\n\n### ### 运行中的决策辅助与支持系统\n\n决策辅助和支持系统被指挥官用于多种环境。它们被用于评估替代目标的价值。它们用于复杂的路线规划。它们被用于将武器匹配目标。许多此类系统“嵌入”在更大的武器系统中，而另一些则作为大型系统的附件“独立”运行。\n\
  \n\n\n\n\n决策辅助工具和支持系统被情报部门用于估计敌方意图、预测国际危机，并评估特定国家新武器计划的概率。\n\n## 下一代 C² 决策辅助工具\n\
  \n`C²` 决策辅助工具将继续演进。可以预测，分析方法论的进步将扩展基于计算机的决策辅助和支持系统能够解决的问题范围。同样可以预测，用户将继续强烈要求强大的实时支持。\n\
  \n人工智能、生物控制论、神经网络建模和认知剖像分析等方法将在 20 世纪 90 年成为决策辅助工具设计与开发中的重要力量。在实施方面，我们可以预计并行处理器、分布式处理器以及能够确保可靠性和安全的处理器将得到完善。\n\
  \n2000 年的战略和战术决策辅助将是高度分布的、深度嵌入的、高度“行为化”且“快于条令”的。最后一点至关重要，因为作战领域尚未解决在使用可能与指挥官在军学校接受的教育、军事经验及条令不的系统的问题。技术将继续影响条令的演变和解释。基于高技术的决策辅助和支持系统的使用将有助于定义这种演变。\n\
  \n事实上，我们可以预计将各种发现（来自许多学科）整合到一个单一的理念架构中，用于一种智能、自适应决策支持系统概念，如图 13 所示 [`14`]。\n\n![图\
  \ 13. 下一代决策辅助系统概念。](img/pg76_Image_115.jpg)\n\n图 13. 下一代决策辅助系统概念。\n\n需要注意的是，`C²`\
  \ 决策辅助和支持系统的设计、开发和使用不仅限于美国军事界。苏联和许多欧洲国家已将决策辅助整合到其力量结构中[`15`]。随着战斗节奏加快（很大归功于先进武器系统的能力），对实时决策的需求正在增加。\n\
  \n最后，随着下一代用户进入作战领域，我们可以预计决策辅助工具和支持系统向作战领域的整合将加速。如上所述，真实的战场需求无疑会促进这种加速；然而，用户群体也发生着另一种更强大的变化。尽管几年前用户对分析计算还极其缺乏经验，但未来的用户在进入现场之前就已经对计算有了大量的接触。虽然还无法确定这种变化的精确影响，但毫无疑问，这种影响将会被感知。`C²`\
  \ 决策辅助和支持系统的设计、开发、应用和评估的机会只会增加。\n\n## 参考文献\n\n1. S. J. Andriole, and G. W. Hopple,\
