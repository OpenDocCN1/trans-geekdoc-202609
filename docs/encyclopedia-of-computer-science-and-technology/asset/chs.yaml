  \ | 80 | 1.6 | 1.228 |\n| ISO 301 | 8860/1 | X3.137 | 90 (3.5) | 2 | 80 | 1.0 |\
  \ 0.737 |\n| ISO 302 | 9529/1 | a | 90 (3.5) | 2 | 80 | 2.0 | 1.474 |\n\n## 技术现状与展望\n\
  \n从磁记录技术开始，已经观察到以下趋势：介质尺寸更小，封装密度和容量更高，同时保持或在可能的情况下提高可靠性，且价格更低。\n\n### 尺寸\n\n近年来磁磁盘取得的进展显而易见。硬质磁盘的尺寸从\
  \ 356 mm（14 英）缩小到 90 mm（3.5 英），软磁盘从 200 mm（8 英）缩小到 90 mm（3.5 英）。\n\n未来预期会出现什么？介质的进一步小型化仅在少数情况下合理。例如，较小的软盘\
  \ [50 mm (2 英)] 被用于便携式 PC 或笔记本电脑，但在这些情况下，驱动器的尺寸、重量和功耗可能比介质本身更重要。\n\n### 封装密度和容量\n\
  \n对于威士类型的硬磁盘，预计容量将进一步增加。内存技术变化迅速，磁磁盘尚未达到其容量峰值。实现更高存储容量有几种可能的方法：\n\n> 增加线性记录密度，即沿磁道单位长度的磁通量变化或记录比特数。在这种情况下，在传统的记录方法和涂层材料方面已经发现了局限性。某些技术创新，如新的头技术（例如，薄膜头或磁电阻头）以及新的记录技术（垂直记录）结合高矫力涂层（薄膜介质），使得进一步的进展成为可能或在未来将成为。目前，最高的线性密度约为\
  \ 1200 bits per mm (bpmm) [31,000 bits per inch (bpi)]。\n\n> 增加磁道密度。更高的磁道密度（即更小的磁道宽度和更小的道间距）只能通过复杂的伺服磁道技术来定位磁头并保持其精确在磁道上。磁头定位的光学技术也已公布。这一切意味着驱动机构具有极高的精度。目前，磁道密度为\
  \ 55 tracks/mm (tpmm) [1400 tracks per inch (tpi)] 的固定磁盘已上市。\n\n\n\n\n前提到的两种方法用于增加单位面积\
  \ [cm² (in²)] 的物理比特密度。一种在硬性磁盘中使用玻璃基板代替铝材料的新技术也能提高面密度，因为更平滑的表面会使磁头更贴表面飞浮。温彻技术始于 1973\
  \ 年，当时面密度为`0.26 Mbits/cm²`（`1.7 Mbits/in²`）。到 1988 年，最大面密度达到了`~ 6 Mbits per cm²`（`40\
  \ Mbits/in²`）。专家预测这种密度将在未来 5 年内增加 3 倍。\n\n增加固定磁盘格式化容量的另一种方法是利用这样一个事实：使用传统的轨道格式（每轨道固定数量的扇区）时，外圈轨道的线性密度远低于内圈轨道。更有效的记录方法（等密度记录或区位比特记录）以及编码方案[`运行长度限制”编码（RLL）`）或数据压缩技术实现了更高的容量。\n\
  \n以下是 1988 年固定磁盘存储容量（未格式化）的几个示例：\n\n* 90 mm (3.5 in), 2 个磁盘：50 Mbyte\n* 130 mm (5.25\
  \ in), 8 个磁盘：765 Mbyte\n* 200 mm (8 in) 组装：接近 1 Gigabyte\n\n### 访问时间\n\n访问时间方面预计也将有进一步进展。1988\
  \ 年制造的驱动器平均寻道时间在`16–25 ms`左右。未来，这个时间可能减少到`10 ms`。\n\n### 可靠性\n\n磁磁盘和驱动器的可靠性衡量标准是“平均故障间隔时间”（`MTBF`）和“比特错误率”。驱动器制造商数据表列出的一些数字在此给出：\n\
  \n> MTBF 定义为“在磁盘寿命的规定时期内，在规定条件下连续故障之间的平均时间（以小时为单位）”，相当于`20,000`到`50,000`个“通机小时”（`POH`）。（`50,000\
  \ 小时`对应于`5.7 年`）。\n\n这些数字看起来非常好，但用户应该知道，“平均”时间意味着 50%的驱动器将超过规定的时间而不发生故障。他只能希望自己的驱动器属于这一半，而不是另一半。\n\
  \n> 比特错误率是衡量驱动器质量的指标。它表示每读取的比特数中的错误比特数。一些典型数字如下：\n\n> | 软错误率：|| 每读取 10¹⁰. . . 10¹¹\
  \ 比特 |\n> | --- | --- |\n> | 硬错误（永久性）错误率：|| 每读取 10¹². . . 10¹³ 比特 |\n\n### 成本\n\n\
  增加磁磁盘的堆积密度和存储容量会导致成本下降。标示存储设备成本的常用方法是给出每 Mbyte 容量的价格。\n\n1980 年，一个 Mbyte 的价格为 185\
  \ 美元。当时面密度为`0.15 Mbits/cm²`（`1 Mbit/in²`）。到 1988 年，成本已处于每 Mbyte`6 美元`的数量级，预计 1993\
  \ 年的价格将为每 Mbyte`1.75 美元`。\n\n## 参考文献\n\n1. Cloke, B., EDN, 199–220 (March 1987).\n\
  2. Memory and Storage, Time-Life Books, Richmond, VA, 1987.\n3. Ohr, S., Electr.\
  \ Des., 55–58 (September 1986).\n4. Seither, M., Mini-Micro Systems, 23–26 (February\
  \ 1987).\n5. Special reports, Electronics, 61, 52–81 (August 1988).\n6. Standards\
  \ of the American National Standards Institute (ANSI),见表 1. 1430 Broadway, New York,\
  \ NY 10018.\n7. Standards of the International Organization of Standardization (ISO),见表\
  \ 1; ISO, P.O. Box 56, Geneva Switzerland.\n8. Williams, T. Computer Design, 49–55\
  \ (February 1988).\n\n**HANS J. SCHROEDER**\n\n# 管理信息系统\n\nDOI: [10.1201/9780367811495-10](https://doi.org/10.1201/9780367811495-10)\n\
  \n## 引言\n\n近年来，管理信息系统（`MIS`）的概念引起了极大关注。这种关注可以归因于市场上出现了越来越多、日益灵活且廉价的系统。新开发的硬件和软件无疑为在不需要巨额资本支出的情况下解决办公成本上升的问题提供了机会。然而，信息技术的扩散必须谨慎管理。否则，产生的不良副作用可能会损害组织活动。\n\
  \n目前存在着关键压力，迫使信息资源必须经过良好的管理[[*1*]`。下面描述了其中一些压力：\n\n### 技术的快速演变\n\n硬件和软件的技术和成本特性继续快速演变，为应用开发提供了截然不同的方法。然而，随着技术的变化，为了确保组织不会无意陷入不兼容系统，规划变得越来越重要。\n\
  \n### 人员短缺\n\n受过训练的分析师和程序员的短缺，加上使其充分发挥作用所需的长期培训，是信息系统开发的主要限制因素。\n\n### 其他组织资源的短缺\n\
  \n资金和管理资源的限制是另一个关键因素。信息系统只是公司许多战略投资机会之一，投入信息系统的资金往往是以其他关键领域为代价的。因此，对这些支出的有效性和效率进行审查是一项重要工作，也是建立项目的关键限制因素。\n\
  \n因此，为了管理资源，需要洞察某些关键问题：(1) 技术是如何被组织吸收的？(2) 吸收这些技术遇到了哪些问题？(3) 有哪些策略可以实现组织需求与可用技术之间的更好匹配？(4)\
  \ 如何识别和衡量组织计算机信息系统（`CBIS`）的有效性？\n\n本文将讨论这些问题。首先，提出了用于信息资源管理问题的方法论和框架。接下来，描述了识别组织信息需求的过程。然后，介绍了影响信息系统成本效益分析方法的问题，这将导致对特定`CBIS`的设计和开发选择。系统分析、设计和实施涉及的方法和程序非常重要，将在后面讨论。`CBIS`的成功实施日益取决于软件工程环境的演变，后者将在后续章节中描述。最后部分对需要进一步研究以实现更有效的资源管理的问题进行了讨论。\n\
  \n## 信息系统\n\n决策者日益复杂且期望的提高，使得组织资源管理面临着更大的挑战。广义来说，可以认为计算机信息系统（`CBIS`）的目标是为所有层级的决策者提供信息。这些信息对于协助管理在规划、执行和控制活动时做出及时且有效的决策是必要的。\n\
  \n\n\n信息可以来自多种来源并以多种格式存在。无论形式如何，一个设计良好的基于计算机的信息系统（CBIS）应该能够`anticipate`决策者（DMs）的信息需求，并在需求产生时`make`信息随时可用。然而，在任何组织中，CBIS\
  \ 的成功都取决于信息技术评估与采纳（ITAA）涉及的流程。“评估”和“采纳”指的是组织政策、策略，以及在努力识别、获取和传播适当技术的过程中所采用的任务（无论是显还是隐式的）。可以识别出从不同角度处理这一问题的若干模型，例如：(1)\
  \ 影响 CBIS 成功运行的组织背景变量，(2) 阶段理论，以及 (3) 技术扩散理论。下文将对此讨论。\n\n### 组织背景模型\n\n信息系统的设计、开发、实施和管理取决于多种相互作用的因素\
  \ [2, 3, 4, 5, 6]。这些因素的影响在不同组织之间甚至在一个组织的不同部门之间也不同。这些因素提出的问题是：“影响 CBIS 成功的关键因素是什么？”以及“这些因素如何相互作用并影响\
  \ CBIS 的成功运行？”在寻找这些问题答案的过程中，Ein—Dor 和 Segev [3] 识别出了十个直接或间接影响 CBIS 成功的组织变量。这些变量是：组织规模、组织成熟度、组织结构、组织时间跨、组织对\
  \ CBIS 的心理氛围、组织外状况、组织资源、负责执行管的级别和位置以及指导委员会。Montazemi [6] 研究了这八类因素对终端用户满意度的影响，发现去中心化程度较低的公司的终端用户对\
  \ CBIS 更满意。这可能是因为去中心化程度较低的公司更需要集成设备。此外，由于他们有多样化的需求并且使目标正式化，去中心化的组织需要根据个人决策者的需求量身定制信息系统。决策复杂性的增加和更复杂的协调需求需要更专业的系统分析师来进行深层次的信息系统规划。在\
  \ CBIS 的开发阶段，系统分析师的存在以及他们进行相关分析的程度倾向于对终端用户的参与产生积极影响。反之，相互合作倾向于对终端用户的计算机素养水平、对所开发的应用软件的满意度，以及对信息系统环境中固有问题和局限性的相互理解产生积极影响。\n\
  \n### 阶段理论\n\nGibson 和 Nolan 引入的 [7] 阶段模型代表了任何组织中信息系统的一种盛行的（尽管在科学上尚无充分依据）的演化模式。他们认为，在任何组织信息系统的演化过程中，可以识别出四个不同的阶段（即启动、扩张、正式化和成熟）。\n\
  \n通过将信息资源的演化分类为不同的阶段，更容易分类并从而更容易管理 CBIS 的可能性是一个重要的考虑因素。在这个框架内，信息系统资源（EDP）的增长根据以下方面得到了解释：\n\
  \n1. 计算机应用程序的增长\n2. EDP 人员专业化的增长\n3. 正式管理技术和组织的增长\n\n第一阶段（启动）发生在为了实现切实的成本节省而实施计算机化时（例如，通过自动化工资单系统来节省人员成本）。然而，在这一点上，高级管理层很少评估计算机化对人员或组织的长期影响。\n\
  \n第二阶段被识别为快速“扩张”时期。其结果是硬件、软件和人员支出的计划外指数级增长。该阶段以 EDP 职责的增长为特征，在设定项目优先级或计划方面成就甚小。在此期间，据认为会发生危机，迫使高层意识到活动的爆炸式增长和成本。通常会做出对整个组织的\
  \ EDP 努力合理的决策。\n\n在第三阶段，管理层试图通过“正式化”操作来抑制失控的计算机成本。这一阶段经常启动正式的管理报告系统、新的收费系统以及复杂的质量控制措施的建立。为了有效管理这些过程，建议组织集中某些组件、建立指导委员会并在公司范围内分配系统分析师以确保用户需求得到满足。\n\
  \n第四阶段确定了信息系统的成熟。在这个阶段，大多数 MIS 开发资金投入到直接涉及关键业务的应用中。EDP 与终端用户的关系既微妙又复杂，将专门的 EDP 资源整合到整个公司并非易事。整合需要\
  \ MIS 经理采取步骤，不仅与高层而且与副总裁级别的部门经理达成目标的相互理解。指导委员会在这里可以发挥重要作用，通过负责确定项目优先级并鼓励 MIS 部门内部的技术、政策和变革。\n\
  \n### 新技术的扩散\n\nMcFarlan 等人 [8] 关于组织内部发生变化的模型略有不同。他们的理论针对的不是 EDP 部门的演化阶段，而是组织管理新技术扩散的阶段\
  \ [1, 8, 9, 10]。他们的模型将扩散过程分为四个阶段：\n\n#### 第 1 阶段。技术识别与投资。\n\n重点是学习和应用新技术。通过试点研究建立员工技能。在这个阶段，假设经验非常有限，以至于参与者被认为无法理解长期影响。缺乏管理关注、项目管理不善或供应商或硬件选择错误可能会导致停滞并阻向更高级阶段的进展。\n\
  \n#### 第 2 阶段。实验、学习与适应。\n\n\n\n此阶段侧重于基于过去的经验，提高用户对新技术及其能够解决的问题的认识。此阶段的成功通常会导致服务请求数量的增加。此时，将对人员和技能需求、设备采购以及适当财务数据的生成进行评估。在此阶段，必须保持灵活性，因为现在是鼓励创新应用的至关时刻。在许多情况下，这是开发最有优势的适配的时候。这些新进展可能与第一阶段最初构想的截然不同，但如果允许经理制定并完善他们的理解，就很容易发生停滞并停止进展。\n\
  \n#### 第 3 阶段：合理化与管理\n\n此阶段的特点是追求短期效率措施。寻求的是管理和运营控制，而不是前一阶段的战略重点。此时，实施了管理控制以监控新资源的增长。活动集中在提升员工知识、重新组织以允许进一步计划的开发、确定适当的技术，以及以具有成本效益的方式实施新技术。与上阶段一样，必须注意避免过度标准化，否则可能导致停滞。\n\
  \n### 第 4 阶段：广泛的技术转移\n\n现在，新技术的优势和经验正传播到组织内的其他部门。技术基础已经安装，学习已基本完成，并强调长期分析和规划。\n\n\
  Huff 和 Munro [`11`]] 从不同的视角研究了信息技术的评估。他们认为描述 ITAA 过程涉及六个阶段，这些阶段可以区别如下：\n\n1.  **意识\
  \ (Awareness)**：首次听到该创新，但缺乏关于它的完整信息。\n2.  **兴趣 (Interest)**：刻意寻找缺失的信息。\n3.  **评估\
  \ (Evaluation)**：在脑中考虑对创新的使用，并决定是否尝试。\n4.  **试验 (Trial)**：进行实际的、通常是小规模的测试，以评估创新对现状和未来状况的价值。\n\
  5.  **实施 (Implementation)**：将试验扩大到首次全面使用创新；通常只涉及组织的一个或几个子部门。\n6.  **扩散 (Diffusion)**：将创新连同可能的修改扩展到额外的组织部门。\n\
  \n在 ITAA 过程中起决定性作用的六类可能的利益集团可以分类如下：\n\n1.  **用户 (Users)**：技术的直接用户。\n2.  **影响者 (Influencers)**：对购买过程产生影响的人。\n\
  3.  **决策者 (Deciders)**：拥有最终决定权的人。\n4.  **守门者 (Gatekeepers)**：处于能够提供有关技术本身或其应用的特殊信息的人员。\n\
  5.  **规划者 (Planners)**：规划实施并执行技术评估的人。\n6.  **赞助者 (Sponsors)**：为技术采用提供高级支持的人。\n\n\
  与组织中执行整体 ITAA 过程的方式相关的四种不同模型可以识别为：(1) 问题驱动 (issue driven)、(2) 技术驱动 (technology driven)、(3)\
  \ 机会模型 (opportunistic model) 和 (4) 规范理想 (normative ideal)。\n\n\n\n组织分析允许对组织的使命、性质及其环境进行审查。有人认为`13`，一个有效的战略信息系统规划过程必须提供：(1)\
  \ 定义基础信息系统（CBIS）产品服务的关键市场（企业内部）；(2) 内部一致性，特别是战略业务计划与战略 CBIS 计划之间的一致性；(3) 评估规划过程有效性的方法。为此，可以使用关键成功因素（CSF）法来建立一种手段与目的的关系，将\
  \ CBIS 战略聚焦于满足这些战略目标的关键领域`13`。关键成功因素法可以被认同为一种自上而下的方法，它将关键组织目标与组织内个人决策者所需的一系列关键信息需求联系起来。CSF\
  \ 方法论包含三个步骤流程：(1) 与相关经理和关键人员进行访谈；(2) 召开小组会议以评估和表征相关的 CSF；(3) 对这些 CSF 进行反馈、批判和采纳，以提供最终的\
  \ CSF 声明。\n\n## 战略到需求的转换\n\n战略到需求的转换通过对信息系统架构（ISA）进行建模，来代表整个组织的信息流需求。ISA 将必须执行的组织过程与特定过程所需的数据类联系起来。ISA\
  \ 的建模包括以下活动：\n\n1. 全局实体关系建模\n2. 概念性数据建模\n3. 过程建模\n4. 数据/过程集成\n\n至少，ISA 的逻辑建模过程 (1)\
  \ 解决了所有数据处理服务用户的需求问题，并 (2) 最大程度地减少了跨组织数据和过程建模中的任何冗余。生成的 ISA 被作为执行逻辑系统设计的基础，以及建立系统实施承诺的基础。\n\
  \n## 逻辑系统设计\n\n使用第二阶段提供的逻辑模型，第三阶段——逻辑系统设计负责数据设计、应用和地理架构。本质上，数据架构代表了从整个组织的角度应该设计的数据库的蓝图。应用程序架构定义了支持\
  \ ISA 所需的应用程序领域以及这些应用程序之间的关系。地理架构定义了应用程序的运行位置、数据库位于何处以及它们之间需要哪些通信链路。\n\n这些架构的逻辑设计由以下组件组成：\n\
  \n1. 实体/关系图 (ERD) 和全局 ERD\n2. 完整、一致的语义数据建模，包括：实体（对象）、属性、关系（是...、是...的一部分）、功能性依赖、事件和动作、数据项集（键）\n\
  3. 目录和字典\n4. 过程模型\n5. 运行模式\n6. 对话和通信程序\n\n## 逻辑到物理的转换\n\n信息需求分析的第四阶段是指导一组系统实施的基础。这包括以下活动：\n\
  \n- 将数据、应用架构和地理架构分解为子系统（应用程序组合）\n- 决定每个子系统的详细设计\n- 对子系统实施的优先级和进度表做出承诺\n\n## 系统实施\n\
  \n最后阶段是对第四阶段中确定的单个系统进行实施。在这一阶段，组织对其信息需求有了整体视图，并有了信息系统架构的蓝图。每个系统必须经过可行性研究、系统分析、概括系统设计、详细系统设计、系统实施、运行、维护和评估。目前已经提出了多种方法和技术来执行可行性研究、评估底层信息系统以及进行系统分析和设计。这些问题将在接下来讨论。\n\
  \n## 信息系统中的成本—效益分析\n\n需要将稀缺资源分配到特定信息系统开发的决策是非常重要的，并直接影响信息系统的成功。衡量信息系统成功的两个基本原则可以确定为：组织承担的总成本和从中获得的效益。系统开发前所需的成本与价值的比较，与为了证明系统修订而进行的比较有所不同。后者的比较又与确保价值持续超过成本的比较有显著区别。\n\
  \n成本效益分析的五个主要步骤讨论如下：\n\n### 选择分析师\n\n分析师可以从组织的成员中选择。另一种选择是聘请外部顾问。外部顾问具有执行可行分析所需的技能和经验，但他们可能昂贵，且会对正常运营产生干扰。\n\
  \n### 识别和选择方案\n\n该过程包括指定目标（例如更好的库存控制）以及如何实现这些目标。执行顺利，该步骤要求丢弃由于政治或其他原因不可接受的方案，并确定剩余方案的性能水平。\n\
  \n### 识别效益和成本\n\n成本通常以美元表示：硬件和软件的购买价格、人员成本、空间租赁等。另一方面，效益具有节省成本、避免成本和提高性能的形式。此外，无形效益包括改进决策、增强士气和提供更好的服务。无形效益最大的问题是对信息进行赋值。所有信息都有潜在价值，但在使用信息之前，这种价值是未知的。只有在做出决策后，才能通过有信息和无信息决策的差异来计算其价值。尽管如此，这个简单的概念很难应用，因为对决策的赋值可能是不可靠的。\n\
  \n对于任何信息系统，都可以确定一组有形和无形的成本与效益。有形成本/效益容易识别并适用于标准测量`14`。然而，无形成本/效益难以识别和精确测量。这一问题的复杂性导致了各种测量技术的兴起，如下：(1)\
  \ MIS 使用估计，2) 用户满意度，3) 决策有效性的增量，4) 信息经济学，5) 效用分析，6) 层次分析法和 (7) 信息属性检查；每种方法都有其优缺点`14,\
  \ 15, 16, 17, 18`。\n\n### 比较方案\n\n该步骤包括三个任务：将成本和效益的衡量标准转换为共同单位（例如美元）；为项目建立折现率；以及计算方案的现值。\n\
  \n### 执行分析\n\n\n\n\n这一步选择一个比较标准，并将其应用于各种替代方案的现值。为了进行公平比较，备选方案的结果必须标准化，并在相同时间段内对备选方案进行比较。在进行成本效益分析时，用于比较备选方案的五个可能标准如下：\n\
  \n1. 在给定成本下收益最大化\n2. 在给定收益水平下成本最小化\n3. 收益与成本之比最大化\n4. 净收益最大化（收益现值减去成本现值）\n5. 投资内部收益率最大化\n\
  \n## 系统分析与设计\n\n系统分析是一种方法，用于开发一套技术，以分析在给定系统背景下采取备选决策可能产生的后果。Necco 等人 [*19*] 指了多年年来用于开发组织计算机业务系统（CBIS）的六种方法：传统/经典方法；系统开发生命周期方法；结构化方法；自动化方法；原型方法和信息中心方法。接下来将对这些方法进行简要描述。\n\
  \n### 传统/经典方法\n\n系统分析与设计的传统/经典方法可以被描述为：系统开发生命周期各阶段的产品如何记录。该方法使用的主要文档工具是叙述性描述、系统和程序流程图、文件布局以及输入输出布局。\n\
  \n### 系统开发/生命周期方法\n\n通而言，系统开发生命周期（`SDLC`）方法可以被描述为将系统项目分解为阶段、活动和任务，以完成特定的项目。本质上，开发生命周期是产生系统所需所有元素的结构化方式。图\
  \ 1 代表了这种当前且主流观点的一个较为复杂的版本。这种“瀑布模型”将开发过程分为八个阶段：(1)系统可行性,(2)软件计划和需求,(3)产品设计,(4)详细设计,(5)代码,(6)集成,(7)实施以及(8)运行与维护。每个阶段的验证或核实标志着向下一阶段的过渡；必要时会返回早期的阶段\
  \ [*20*]。\n\n![FIGURE 1. 引用自 20 的软件生命周期瀑布模型，经 Prentice Hall, Inc. 许可](img/pg230_Image_170.jpg)\n\
  \n图 1. 引用自 20 的软件生命周期瀑布模型，经 Prentice Hall, Inc. 许可。\n\n目前的观点是 `SDLC` 方法被广泛使用，但并没有一种主流将系统项目分解为阶段的标准方法\
  \ [*19*,*21*](#C_012_c10.xhtml#r10_21)]。尽管对其结构缺乏共识，但 `SDLC` 方法非常适用于 CBIS 的开发以及取决于类型的特定阶段、活动和任务。\n\
  \n`SDLC` 涉及的步骤：\n\n- **系统概述**：对问题的调查。\n- **系统设计**：对用户的详细考虑。\n- **系统创建**：创建大部分元素的核心环节。\n\
  - **系统实施**：新开发的。\n\n20 世纪 70 年代，对计算机处理的需求促成了 SDM 的开发以管理这一过程。SDM 包含了系统生命期的开发，该开发由数据字典和活动结束时交付的产品支持\
  \ [*22*]。此外，某些 SDM 将结构化方法的使用与开发生命周期相结合 [*23*]。\n\n### 结构化方法\n\n系统分析与设计的结构化方法包含概念和工具。存在几种结构化技术可以帮助分析师在需求层面对组织进行建模。这些技术包括结构化分析与设计\
  \ [24]；数据流图 [*25*]；业务分析技术 [*26*]；以及结构化建模软件 [27]。结构化方法的主要概念是解构系统的复杂性，并用数据流图、结构图、数据字典来描述系统。系统从抽象到详细的层面进行分析和设计。\n\
  \n### 自动化方法\n\n在开发结构化方法的同时，开发了支持系统分析与设计中执行的许多任务的计算机化系统。如支持等软件软件包支持数据流图、结构图和其他图形技术的开发。该软件软件包还包括相关数据字典的开发以及各种分析工具，以确保此类文档的正确、完整和一致\
  \ [*28*]。\n\n### 原型方法\n\n信息系统可以根据特定任务的信息需求进行设计，而不论由谁执行。这种策略在任务高度结构化时（例如薪资发放系统）非常有用。在这种情况下，系统分析师对决策表现出完全理性的观点，并可以对设计方案进行完全控制，且能预测每个设计决策的结果。然而，当任务是半结构化或无结构化的，信息系统应该代表单个决策者的特定需求。此类任务的复杂性要求系统分析师和决策者共同定义底层信息系统的特征。\n\
  \n\n\n\n原型设计的成功取决于从决策者和/或专家处获取的规则和程序。获取此类知识时产生的问题可能源于多个方面，例如口头数据的局限性、无法获取的知识以及使用了不恰的获取技术\
  \ [*29]]。认为知识可以直接从领域专家处获取是一个误区。口头数据有效性的匮乏可能源于九个方面：\n\n1.  自我报告技术缺乏经验\n2.  重构/理论化而非准确报告（“填补空白”）\n\
  3.  程序性知识难以触及\n4.  某些事件或内部表征的不可言性\n5.  获取语境中的生态效度（例如，针对不具代表性的任务提供口头协议）\n6.  对高度熟悉知识的理所当然化\n\
  7.  对相关信息的直接遗忘\n8.  口头陈述中的歧义\n9.  保密性和刻意的低报率\n\n解决口头数据无效问题的部分解决方案在于原型设计方法论迭代的、反馈驱动的特性。原型设计可以减少上述困难；然而，无法获取（隐性）知识的问题仍然存在。隐性知识包含了推理和全局知识，它们为人类推理提供了不可言述的框架\
  \ [*30,*31](#C_012_c10.xhtml#r10_31)]]。通过专家提供并分类的示例进行决策规则机器归纳可以补偿这一瓶颈 [*32]]。一旦接受即使在单一专家领域内，专业知识也可以包含几种不同类型的知识，那么各种获取技术的需要就变得显而易见\
  \ [*33]]。知识获取技术可以识别如下 [*29]]：(1) 访谈，(2) 口头协议，(3) 机器归纳，(4) 观察研究，(5) 概念分类，以及 (6) 多维缩放\
  \ (MDS)。\n\n### 访谈\n访谈作为最熟悉且应用广泛的知识获取方法，可以采取多种形式。请专家对任务领域进行介绍性讲座是一种方法，或者访谈可以结合认知心理学技术来探测记忆，例如“关键偶发报告”。此外，访谈可以遵循知识工程师预先设定的问题计划，也可以是非结构化的。\n\
  \n### 口头协议\n口头协议分析要求专家在处理典型的决策问题时，对自己正在思考的内容进行评论。对这种“口头协议”进行录音，然后对其进行转录和分析。Myers\
  \ 等人 [*34]] 提议使用文本编辑器突出转录稿中的实质性知识，并将其直接编码为规则以形成原型。\n\n### 机器诱导\n机器诱导的规则通常与其他手段从人类专家处获取的规则很少相似之处。然而，机器归纳作为一种促进认知仿真的技术是合适的，原因有二：首先，作为原始数据输入的大量示例集是由人类专家选择并预分类的，因此反映了他们对领域的概念化。其次，当条件允许且存在完整或高度代表性的示例集时，诱导出的规则可以近似人类规则。\n\
  \n### 观察研究\n观察研究与口头协议相似，不同在于它没有来自次级活动（即提供口头报告）的推理。这类研究可以采取视频录像，或工程师与远程用户之间电话对话的录音等形式。无论媒介是什么，如果要提取有用知识，转录稿就需要详细的分析。\n\
  \n### 概念分类\n概念分类是认知心理学的一种技术。在最简单的情况下，该任务可以包括：(a) 获取一组覆盖某个领域的概念（通过教科书或词汇表）；(b) 将每个概念转换为卡片；(c)\
  \ 要求专家进行分组以识别组间的共同点；以及 (d) 迭代组合这些分组形成层次结构。\n\n### 多维缩放 (MDS)\n多维缩放 (MDS) 技术用于识别概念的相似性和差异。差异网格是一种已成功转移到知识工程的技术\
  \ [*32,*35](#C_012_c10.xhtml#r10_35)]]。与帮助识别宏观概念结构的概念分类相比，MDS 可以揭示专家能够而初学者难以做的细微区别。\n\
  \n### 信息中心方法\n信息中心方法据认为源于 IBM，它解决了许多组织中存在的应用开发和维护积压问题。在这种方法中，组织了一组数据处理专家协助用户开发自己的应用程序。支持这一概念的主要技术是第四代计算机程序。信息中心可以补充数据处理部门，减少系统开发工作，并控制微型计算机在整个组织中的扩散。信息中心的主要问题可能集中在与数据处理部门的关系、适用于用户的应用程序类型以及相关人员和用户的责任。为了满足用户的信息需求，系统分析和设计阶段遵循的策略可能包含上述方法。\n\
  \n## 软件工程环境\n软件工程的基本目标是为生命周期各个阶段提供良好的工程原则、实践和工具。在四分之一的时间里，商业语言的发展缓慢。第一代是机器语言。没有解释器或编译器将语言翻译成其他形式，因此这项任务由程序员，他们必须使用二进制符号来编写应用程序。第二代编程语言于\
  \ 20 世纪 50 年代中期投入，是符号汇编语言。汇编语言利用宏来减少编程的繁琐。然而，汇编语言仍然与人类自然语言相遥远，因此它是开发应用程序的复杂媒介。第三代编程语言（高级语言语言）于\
  \ 20 世纪 60 年代开始使用。第三代语言（FORTRAN、COBOL、BASIC、PL/I、ADA）已更接近自然语言。使用了英语单词，公式也用数学符号表示。\n\
  \n尽管，第三代语言对于终端用户开发自己的应用程序软件仍然太复杂。针对这些问题，创建了第四代语言 (4GL) 以实现以下目标：\n\n1.  更快的应用程序构建过程\n\
  \n\n\n\n\n## 2. 为了便于应用和程序更改，从而降低维护成本\n\n## 3. 为了从高层需求表达式生成无 bug 代码\n\n## 4. 使语言对用户友好，以便终端用户能够解决自己的问题并让计算机投入工作\n\
  \n市场上有多种第四代编程语言（4GL），旨在实现上述目标。然而，由于缺乏标准，目前提供的 4GL 提供了多种选择，即它们既支持过程化也支持非过程化编码。过程化语言与非过程化语言的主要区别在于，非过程化语言要求程序员通过指定所需的结果来指示计算机，而不是通过指定实现该结果的中间过程。编程的简便性使得快速原型设计成为可能。为了增加\
  \ 4GL 在开发特定场景宏的能力，某些 4GL 编程语言还包含一个过程化语言环境。4GL 的另一个吸引人的特性是它们支持数据库管理系统（DBMS）以及图形界面的能力。这些工具在决策支持系统（DSS）环境中变得尤为重要。总来说，以下可以被认为是\
  \ 4GL 的理想特性：\n\n* 简单查询\n* 简单查询和更新\n* 复杂查询\n* 复杂查询和更新\n* 数据库创建\n* 智能数据库操作，数据库中一个值的变化会导致其他操作自动发生\n\
  * 为关键输入操作生成数据输入屏幕\n* 过程化语言\n* 电子表格操作\n* 多维矩阵操作\n* 报告生成\n* 图形生成\n* 图形处理\n* 针对“假设分析”问题的决策支持\n\
  * 数学分析工具\n* 财务分析工具\n* 其他决策支持工具\n* 文本处理\n* 电子邮箱\n\n一个简单的 4GL 是电子电子表格。市场上更强大的 4GL\
  \ 包括 Focus、IFPS、RAMIS II 和 SYSTEM W。像 Focus 这样的系统提供了一个强大的通用 DSS 生成环境，而 IFPS 或 System\
  \ W 则更适用于金融系统的支持。\n\n我们现在进入了第五代时代，源自人工智能（AI）研究的专家系统开发的商业化开启了一个新行业。由于“AI”和“专家系统”这两个术汇的华丽，激发了人们的想象力，引发了不断扩张的活动浪潮，同时也产生了对当前技术水平不现实的预期。“专家系统”一术语是指将特定领域的大量知识应用于解决问题过程的计算机程序。专家系统的应用系统背后是关于在特定应用领域内行使专家决策过程（即专业知识）本质的假设。作为一个概念，专业知识涉及两个关键因素：第一是它在个人（或可能的小组）应用时的狭窄范围，第二是其性能的卓越性。设计专家系统意味着将知识领域中隐含的能力模型细节显式化。专家系统越接近捕捉这种底层模型，系统就越令人满意。可以识别出各种具有以计算机程序形式提取和表示专家知识固有能力的工具和技术。\n\
  \n专家系统的基本组成部分是推理引擎、知识库、用户界面、解释设施和知识获取设施。这些组件可以由 AI 语言支持，也可以由专家壳支持。\n\n\n\n\n获取知识固然重要，如何将这些信息呈现给终端用户对于成功的决策支持信息系统（CBIS）也同样重要\
  \ [`6`]。最近，人们对信息呈现模式有效性的兴趣日益增加，尽管这类研究的目的各异，但其核心哲学是一致的；主要的关注点在于如何回答不同的信息呈现模式（即图形化、表格化或文本）如何影响人类在信息接收、处理以及对决策环境反应方面的行为。尽管已有大量关于图化和其他视觉显示显示的研究，但不同呈现模式对决策过程的认知影响仍尚不清楚\
  \ [`47`]。\n\n## 参考文献\n\n1. F. W. McFarlan and J. L. McKenney, Harvard Bus. Rev.,\
  \ 60, 109–119 (1983).\n2. B. DeBrabander and G. Thiers, Mgmt. Sci., 30, 137–155\
  \ (1984).\n3. P. Ein-Dor and L. E. Segev, Mgmt. Sci., 24, 1067–1077 (1978).\n4.\
  \ J. L. King and K. L. Kraemer, Comm. ACM, 27, 466-475 (1984).\n5. R. O. Mason and\
  \ I. Mitroff, Mgmt. Sci., 19, 475–487 (1973).\n6. A. R. Montazemi, MIS Q., 12, 238–256\
  \ (1988).\n7. C. F. Gibson and R. L. Nolan, in Catching Up with the Computer Revolution\
  \ (L. Salerno, ed.), John Wiley & Sons Inc., New York, 1983, pp. 25–43.\n8. F. W.\
  \ McFarlan, J. L. McKenney, and P. Pyburn, Harvard Bus. Rev., 61, 145–156 (1983).\n\
