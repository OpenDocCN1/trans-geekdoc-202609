  \ 核心加密\n\n## 统计数据库上的专家系统\n\n在讨论专家系统对统计数据库的影响之前，有必要给出一些正式定义。首先，我们可以识别出一种通用系统，称为知识库系统。知识库由表示数据元素之间关系的结构化数据组成。知识库系统的一个特定子类是专家系统。专家系统的先决条件是一个存在人类专家的领域。\n\
  \n专家系统为了模拟决策过程，需要三种信息：\n\n1. 关于应用领域\n2. 关于解决问题所需的方法\n3. 关于检查的问题\n\n专家系统由三个部分组成：\n\
  \n1. 由应用领域的概念和特定规则组成的长期知识库\n2. 通用算法，即推理机，推理方法的实现\n3. 由信息（即事实）构成的短期知识库\n\n专家系统的工作原理如下：机从假设或初始事实开始，通过操作概念和知识片段，通过与用户对话或推理来获取新事实，并评估单个假设的可信度，给出一个“置信因子”。\n\
  \n\n\n\n\nADONIA 是一个用于数据分析管理的辅助专家系统。该系统使用了一个现有的 FORTRAN 语言编写的统计程序库，并建立在一个知识的基础上，该库包含了分析程序的使用方法以及对结果的解释。ADONIA\
  \ 的核心思想是将关于数据和现象的“局部”知识与分析技术知识区分来：通过这种方式，该系统被呈现为数据分析技术使用的“导师”。\n\n### 推断统计学中的专家系统\n\
  \n专家系统的另一个主要应用领域是推断统计学，它基于相对于数据结构对统计模型的先验假设。\n\n在此类应用的专家系统中，包括由 Pregibon 和 Gale\
  \ 提出的用于回归分析的 `REX` 系统（回归专家）。\n\n该系统会引导分析过程，测试回归假设，在不符合这些假设时建议适当的转换，并对给出的建议提供理由。此外，它还帮助用户解释中间和最终结果。正如我们看到的，`STUDENT`\
  \ 专家系统源于 `REX`。\n\n`EXPRESS`（依赖现有统计软件的专家系统）是另一个专家系统，旨在将已知统计包的计算能力与评估能力相结合，在进入后续应用之前，按照分步程序对分析结果进行评估。\n\
  \n`STAT 1` 和随后改进的 `STAT 2` 是专家系统，其主要目标是帮助社会科学领域中非统计专家的研究人员选择合适的统计分析方法，即使是简单的假设检验、相关性测量等方法。\n\
  \n另一个难以归入上述两类中的系统是由 P. Hietala 提出的 `ESTES`（时间序列专家系统）。该专家系统旨在帮助用户进行时间序列分析。对于不是统计和时间序列分析专家的用户来说，该系统可以识别时间序列的若干基本属性：趋势、季节性、运动水平、离群值。该系统的特点是它可以分析数据并给出指令，而不做出任何决策，将从指示的替代方案中选择的任务留给用户。\n\
  \n其他实验系统包括 `STATPATH`、`GLIMPSE`、`CLAVECIN` 和 `PANOS`。它们都集中于为用户提供关于适当分析模型或假设检验的建议。其中一些（如\
  \ `GLIMPSE`）与分析包链接，而另一些与统计数据库没有直接链接的独立组件。上述大多数系统都是使用构建专家系统的标准技术构建的。规则和启发式方法取自教科书，并作为产生规则或框架被纳入知识库。这与标准外壳相结合，用于处理控制策略（后向或正向推理）以及用于与专家和用户通信的自然语言接口。\n\
  \n### 时间数据\n\n时间数据通常代表一组随时间变化的信息集合，对于统计科学数据库（SSDBs）而言至关重要。测量数据的时间元素通常可以建模为由其他参数构成的多维空间中的另一个维度。对于随时间进行的定期测量的情况，尤其如此。当事件发生在离散但不规则的序列中时（例如检测器的故障或更换），处理时间数据会变得特别困难。另一个问题是不同数据集的变化速率可能不同，更糟糕的是，同种商品在不同时间间隔和不同国家之间的速率也可能不同。在数据分析过程中，必须将这两类测量相关联，正如\
  \ Shoshani 所说：\n\n通常，时间数据的建模需要整合静态数据、定期间隔变化的数据以及作为不规则离散事件出现的数据。从逻辑角度来看，必须对各种类型的时间数据进行建模，以便其语义对用户是清晰的。还需要提供查询功能，允许用户在时间维度上指定条件，并关联可能以不同速率变化的数据。\n\
  \n### 结论\n\n统计科学数据库领域代表了一个令人兴奋的研究领域，但仍有许多问题需要解决（既从理论角度，也从构建者特别是用户的角度来看）。该领域研究状态的参考点是每举办一次的\
