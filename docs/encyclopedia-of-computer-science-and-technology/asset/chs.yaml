  \ E. BILES, THOMAS G. RAY\n\n# 内存管理单元\n\nDOI: [10.1201/978036781195-12](https://doi.org/10.1201/978036781195-12)\n\
  \n## 引言\n\n内存管理单元 (`MMU`) 是一种硬件设备，它扩展了 `CPU` 架构，为高级操作系统软件功能提供底层的硬件支持，包括虚拟内存、多任务处理和数据安全。本文描述了\
  \ `MMU` 是什么以及它是如何融入计算机系统架构的。随后我们讨论了对操作系统重要的 `MMU` 特性，并给出几个市售 `MMU` 的示例。\n\n操作系统的主要功能之一是控制对计算机系统硬件资源的访问。操作系统的内存管理程序控制着一项关键资源：内存。\n\
  \n## 内存层次结构\n\n大多数计算机系统都包含层次化的内存类型，这些类型共同工作，对于运行在 `CPU` 上的程序来说就像“内存”。这种层次结构可以用中央处理器\
  \ (`CPU`)、`MMU` 和四种类型的内存进行建模（[图 1]）。存在多层内存层次结构这一事实对终端用户来说没有实际意义；这些划分是不可见的。然而，系统架构师会从该模型中进行组合，以设计出符合价格/性能目标的内存系统。\n\
  \n![图 1 系统模型包含内存类型的层次结构。](img/pg264_Image_187.jpg)\n\n[图 1] 系统模型包含内存类型的层次结构。\n\n\
  一项重要的 `MMU` 服务是支持虚拟内存。虚拟内存系统允许次级存储器充当慢的主存。这产生了一种系统包含巨大内存的幻象，而实际上，可能只有少量的随机访问内存 (`RAM`)。\n\
  \n这有两个优势：首先，这意味着系统可以运行比物理内存容量更大的程序。例如，一个系统可能包含 2MB 的 `RAM`，仍然能够运行一个访问 200MB 硬盘的\
  \ 4MB 程序。其次，这意味着应用程序不需要为了匹配特定的内存配置而修改。\n\n所有 `MMU` 设计提供的另一个重要功能是能够根据一组预定义的转换规则将程序重定位到内存的其他部分。这种重定位是在硬件中完成的，不需要修改任何应用程序。多任务操作系统随后可以通过重新配置\
  \ `MMU` 的转换寄存器从一个程序切换到另一个，而无需重新加载整个程序。这种在多个程序之间快速切换的能力允许系统并发运行多个程序，被称为多任务处理。\n\n\
  图 2 显示了在多任务操作系统运行多个程序的 `MMU` 如何执行这种转换。在带有 `MMU` 的系统上运行程序之前，操作系统配置 `MMU`，使用户程序重定位到内存的空闲区域。程序开始执行，感知感知\
  \ `MMU` 的操作。例如，一个程序可能被编译和链接为从位置 400 开始运行，但如果物理内存中的该位置被用于其他用途，操作系统可以配置 `MMU` 硬件，将程序所有的内存引用转换为另一个空闲区域。如果\
  \ `MMU` 不提供转换功能，那么编译器就必须以某种方式知道整个运行时系统的物理地址，而这些地址在编译时是未知的。\n\n![图 2 MMU 将虚拟地址转换为物理内存。](img/pg265_Image_188.jpg)\n\
  \n\n\n\n\n图 2 MMU 将虚拟地址翻译为物理内存。\n\nMMU 可以实施数据安全机制。由于 MMU 与所有 CPU 访问内存的操作是串联的，它可以通过抢占未经授权的读/写周期来提供数据安全。\n\
  \nMMU 硬件通过将物理内存划分为更小的片段，并为这些片段分配翻译描述符来提供这些服务。操作系统随后可以操纵这些描述符来控制内存层次结构，并提供虚拟内存、多任务处理和数据安全功能。MMU\
  \ 硬件如何划分内存的细节见下文。\n\n## MMU 硬件描述\n\n在不包含 MMU 的系统中，CPU 直接连接到主存，如图 3 所示。该图还包括内存读周期的状态图和时序图。当\
  \ CPU 想要从内存获取数据时，它在地址总线上放置一个地址，并向内存发送脉冲控制信号（strobe）；然后内存将请求的数据放在数据总线上并向 CPU 返回确认信号。![图\
  \ 3 不带 MMU 的典型系统。](img/pg266_Image_189.jpg)\n\n图 3 不带 MMU 的典型系统。\n\n包含 MMU 的系统如图\
  \ 4 所示。注意状态图有两个标记为 `MMU` 和 `TLB` 的新状态。当 CPU 想要从内存读取数据时，它会向 MMU 发出虚拟地址和脉冲信号。MMU 检查查找缓冲区（`TLB`）以查看它是否已经知道如何将此虚拟地址翻译为物理地址。如果信息在\
  \ `TLB` 中，则 MMU 生成物理地址并向内存发送脉冲信号。然后内存通过向 CPU 返回数据和确认信号来完成周期。\n\n![图 4 带有 MMU 的典型系统。](img/pg267_Image_190.jpg)\n\
  \n图 4 带有 MMU 的典型系统。\n\n如果翻译信息不在 `TLB` 中，则 MMU 必须搜索存储在主内存中的翻译描述符表。当它找到正确的描述符时，将其加载到\
  \ `TLB` 中。一旦信息在 `TLB` 中，MMU 就可以生成物理地址并向内存发送脉冲信号。然后内存通过向 CPU 返回数据和确认信号来完成周期。描述符表以树形结构存储在主内存中，搜索描述符表的过程被称为\
  \ MMU 表项遍历（tablewalk）。表遍历完全由 MMU 内部的硬件完成。\n\n翻译过程确实会改变硬件时序。MMU 在接收到虚拟地址脉冲并有足够访问\
  \ `TLB` 并将物理地址放在总线上的之前，不会断出物理地址脉冲信号。这种翻译延迟在时序图中标记出来，并有效地减慢了 CPU 的内存访问时间。如果翻译延迟太大，可能会严重损害系统性能，因为\
  \ CPU 必须插入等待状态。将 MMU 集成在与 CPU 同一芯片上的微处理器通常能够缩短翻译延迟，至于不影响周期时间。如果 MMU 在 CPU 外部，系统设计人员可能需要使用更快的内存设计来补偿翻译延迟，或添加虚拟缓存以减少翻译延迟的影响。\n\
  \nMMU 的框图如图 5 所示。注意它有三个到 32 位总线的接口；虚拟地址总线和物理地址总线在翻译期间使用，数据总线由 MMU 用于从内存加载数据到缓存。在表遍历结束时，MMU\
  \ 可以生成物理地址并向内存发送脉冲信号填充 `TLB`。根指针寄存器告诉控制逻辑物理内存中描述符树的起始位置。`TLB` 是存储最近翻译地址描述符的小缓存。\n\
  \n![图 5 MMU 框图。](img/pg268_Image_191.jpg)\n\n图 5 MMU 框图。\n\n`TLB` 必须设计为提供高命中率，以便执行\
  \ MMU 表遍历的时间不会降低性能。系统设计人员必须考虑缓存组织和替换策略，并处理地址别名和过时数据问题。为了避免翻译延迟导致的时间损失，`TLB` 由地址总线寻址。地址别名发生在多个虚拟地址描述不同的物理位置。例如，当程序\
  \ A 运行时，`TLB` 填充描述符。当程序 B 在相同的虚拟地址空间运行时，`TLB` 无法区分来自程序 A 还是 B，并可能错误的描述符信息。为了避免这个问题，操作系统在程序\
  \ B 开始运行之前必须失效 `TLB`。当 CPU 修改内存以更新描述符时，可能会发生过时的 `TLB` 数据。注意 CPU 可能会更新已经在 `TLB` 中的描述符，此时\
  \ `TLB` 中的描述符副本即为“过时”。再次，操作系统在修改描述符表后必须失效 `TLB`。过时数据也可能发生在多处理器系统中。这种情况稍后会讨论。\n\n\
  `TLB` 条目可以分为两部分：允许 MMU 执行虚拟到物理翻译的翻译信息，以及为这些较小片段分配特殊属性的描述符信息。图 5 中的 `TLB` 条目显示了这两个部分。描述符信息包含了支持特殊操作的三个字段。\n\
  \n保护字段分为两个较小的字段，操作系统对其进行编程以确保系统完整性。写保护字段可以设置为以停止非法或无意的写周期。它还可以用于支持写时复制等操作系统功能。用户/内核位可以进行编程以直接支持操作系统的用户模式和内核模式，使得运行用户模式的进程可以访问用户数据和指令，但\
  \ MMU 将阻止对内核指令或数据的尝试访问。\n\n缓存控制字段允许操作系统为缓存设置缓存禁用位（cache inhibit bits）。对于某些特殊用途（如内存映射\
  \ I/O 设备）的内存区域，必须设置缓存禁用位。在多个进程或多个处理器之间共享的数据可能被标记为缓存禁用，以避免缓存一致性问题。\n\n分配字段为虚拟内存提供硬件支持。当操作系统将信息从辅助内存移动到主内存时，会设置存在位。如果\
  \ CPU 尝试访问未设置存在位的区域，MMU 将停止访问并向 CPU 发送信号，强制跳转到操作系统例程。该例程将数据从辅助内存移动到主内存并设置存在位。一旦缺失的信息进入内存，CPU\
  \ 即可继续执行。\n\n\n\n\n访问位（accessed bit）由 `MMU` 在将描述符加载到 `TLB` 时设置。当 `CPU` 对描述符所指的内存区域进行写入时，`MMU`\
  \ 会设置修改位（modified bit）。操作系统在需要回收内存供其他用途时可以使用这两个位。尽管这些标志位是由 `MMU` 设置的，但系统动态变化需要时，操作系统的内存管理程序必须清除它们。例如，操作系统可能会清除访问位，稍后再次检查它，以判断该页最近是否被任何应用程序使用过。如果未被使用，操作系统可能会决定回收该内存供另一个程序使用。如果修改位被设置，则表示该内存区域已更新。现在在回收这些内存之前，必须将更新后的内存写回次级存储，否则最近的更新将会丢失。`TLB`\
  \ 目的目的翻译部分包含地址描述信息，这允许 `MMU` 翻译逻辑生成高位物理地址位。下面将详细描述两种翻译方案。\n\n## 翻译方案\n\n两种成熟的翻译机制在各种系统中都已变得非常流行。每种机制都提供了良好的灵活性，并且可以使用适量的\
  \ `MMU` 硬件来实现。下面描述这两种翻译方案：分段翻译和分页翻译。\n\n### 分段翻译\n分段翻译允许将内存划分为不同大小的片段，称为段（segments）。分段翻译的机制如图图\
  \ 6 所示。在此例中，地址的高位被称为段号，低位被称为段偏移量（segment displacement）。段号用于索引描述符表。描述符包含一个基地址，该地址是该段在物理内存中的起始地址。描述符还包含一个长度属性。段偏移量应小于长度，如果不是，则内存周期被终止并指示错误。假设没有错误的情况下，通过将段偏移量与基地址相加来完成翻译。物理内存现在可以被分为\
  \ 256 个不同大小的段。每个段的长度可以从 1 到 64 Kbytes 不等\n\n![图 6 分段翻译。](img/pg271_Image_192.jpg)\n\
  \n图 6 分段翻译。\n\n虽然变长的段允许内存分配更符合内存请求，但它会导致一个被称为“外部碎片”的问题。这个问题是分段式 `MMU` 特有的，当变长度的段在物理内存中留下的过小到无法实际使用的空洞时就会发生。\n\
  \n### 分页翻译\n图 7 显示了分页翻译的工作原理。在此例中，`MMU` 将虚拟地址分为两部分，高位被称为段号，低位被称为页索引（page index）。页索引决定页的大小，它直接通过\
  \ `MMU` 传递以形成物理地址的低部分。段号用作段表的索引。从段表输出的数据称为页地址（page address），形成物理地址的高部分。从逻辑上讲，一个内存位置通过进入\
  \ 2048 页之一的 13 位偏移量来描述。而物理上，内存被分为 2k 个固定大小为 8Kbytes 的页。\n\n![图 7 分页翻译。](img/pg272_Image_193.jpg)\n\
  \n图 7 分页翻译。\n\n由于页具有固定大小，小于页大小的内存请求会导致内存浪费。这种现象被称为“内部碎片”。例如，假设一个程序需要 1Kbyte 的存储空间来存放数据。当它运行时，将被分配一个\
  \ 4K 的段。其余的 3K 是无法被任何其他程序使用的内存碎片。\n\n在这两种翻译方案中，`MMU` 都将物理内存划分为更小的部分，并为每个部分分配描述符信息。操作系统随后可以使用这些属性来控制内存的访问并提供重要的系统功能。\n\
  \n## 商用 MMU\n\nIntel `80386` 微处理器在单个 132 引脚引栅阵列封装中包含一个 `CPU` 和一个 `MMU`。`80386` 的框图如图图\
  \ 8](#C_014_c12.xhtml#f12_8) 所示 [[1]](#C_014_c12.xhtml#r12_1)]。`MMU` 架构同时包含分段单元和分页单元。\n\
  \n![图 8 Intel 微处理器和 MMU 框图。](img/pg273_Image_194.jpg)\n\n图 8 Intel 微处理器和 MMU 框图。\n\
  \n`80386` 的翻译机制在图 9](#C_014_c12.xhtml#f12_9) 中详细描述。分段单元首先将虚拟地址翻译为物理地址。分段单元允许变长度段，其最大可达\
  \ 4GB。分页单元具有固定的两级翻译算法和 4K 的页大小。分页单元还包含一个 32 条目的 `TLB`。`TLB` 被组织为四路组关联缓存。当 `TLB`\
  \ 满且必须为新条目腾出空间时，它将实现真正的 LRU（最近最少使用）替换算法来选择最旧的条目。`80386` 支持虚拟内存。描述符中的存在位（Present\
  \ bits）通知 `CPU` 该页是在主内存还是次级存储中。`MMU` 在程序运行时设置访问位（accessed bits）和脏位（dirty bits）。还有一个三位的\
  \ `AVAIL` 字段供操作系统用于老化信息。\n\n![图 9 80386 MMU 分段和分页翻译。](img/pg274_Image_195.jpg)\n\
  \n图 9 80386 MMU 分段和分页翻译。\n\n![图 10 80386 页格式。](img/pg275_Image_196.jpg)\n\n图 10\
  \ 80386 页格式。\n\nMotorola 68030 将 CPU、虚拟缓存和 `MMU` 集成在一个芯片中。在 68030 架构中，`MMU` 被为具有自己的寄存器模型和指令集扩展的协处理器。`68030`\
  \ 的框图如图 11](#C_014_c12.xhtml#f12_11) 所示 [[2]](#C_014_c12.xhtml#r12_2)]。\n\n![图 11\
  \ Motorola 微处理器和 MMU 框图。](img/pg276_Image_197.jpg)\n\n图 11 Motorola 微处理器和 MMU 框图。\n\
  \n`68030` `MMU` 实现分页翻译机制。分页单元具有可编程的翻译算法，可以有一到五级翻译。页大小也可以编程为 256 到 32K 字节。还有两个透明寄存器，可以在不翻译的情况下映射独立的内存块。图\
  \ 12](#C_014_c12.xhtml#f12_12) 显示了 `68030` 翻译表的示例。\n\n![图 12a 68030 翻译表可以进行各种配置。](img/pg277_Image_198.jpg)\n\
  \n图 12a 68030 翻译表可以进行各种配置。\n\n![图 12b.](img/pg278_Image_199.jpg)\n\n图 12b。\n\n`TLB`（在\
  \ Motorola 文献中称为地址翻译缓存）是一个 22 个条目的全关联缓存，并使用伪 LRU 替换算法。`68030` 的 `MMU` 架构包含了对虚拟内存的支持。页描述符与为\
  \ `80386` 显示的类似。\n\n\n\n\n80386 和 68030 都将 `MMU` 和 `CPU` 集成到单个芯片中。这通过消除翻译延迟的影响提高了性能，并通过消除通常与外部\
  \ `MMU` 关联的大型高引脚封装降低了成本。\n\n上一个示例展示了摩托罗拉 88000 RISC 处理器。单处理器系统的框图见图 13 [3]。注意，88100\
  \ 微处理器是哈佛架构的一个示例，因为它包含了用于指令路径和数据路径的独立分用总线。它需要两个 `88200` 缓存和 `MMU`（或 `CMMU`）设备，每个总线各一个。这些物理缓存通过复用来共享通向主内存的单一路径。\n\
  \n![图 13 摩托罗拉 88000 RISC 微处理器和 MMU 框图。](img/pg279_Image_200.jpg)\n\n图 13 摩托罗拉 88000\
  \ RISC 微处理器和 MMU 框图。\n\n88000 使用类似于 68030 的分页翻译机制，然而，`TLB` 架构确实包含了一个旨在提高多处理器配置性能的独特特性。\n\
  \n上述描述的过期数据问题涉及单处理器系统。多处理器系统中可能存在过期数据的另一个原因。当多个 `MMUs` 在其各自的本地 `TLBs` 中拥有相同描述符的副本时就会发生这种情况。如果一个处理器更改了物理内存中的页描述符，它可以失效自己的\
  \ `TLB`，但其他 `TLBs` 中的数据现在变成了过期的。`88200` `CMMU` 通过允许对其他 `TLBs` 进行远程失效为该问题提供了优雅的解决方案（如图\
  \ 14 所示）。如图如图所示，当其中一个处理器更改物理内存中的页描述符并刷新其自身的 `TLB` 时，它可以向其他 `TLBs` 发送命令，从而使它们的（现过期的）条目。\n\
  \n![图 14 88000 多处理器架构支持远程 TLB 失效。](img/pg280_Image_201.jpg)\n\n图 14 88000 多处理器架构支持远程\
  \ TLB 失效。\n\n## 图书注释\n\n在其他地方可以找到广泛的调查和参考文献 [4]。整个内存层次结构的详细讨论，包括缓存`TLB` 设计和性能问题，在\
  \ Pohm 的书中涵盖 [5]。关于 `MMU` 设计选项和缓存`MMU` 相互作用的讨论可以在 Cho 的书中找到 [6]。Alexander 等人 [7]\
  \ 对比了 UNIX 环境下各种 `TLB` 架构的性能。Dixon [8] 和 Wood 等人 [9] 建议将 `MMU` 和缓存功能相结合。与多处理器和并行操作系统相关的内存管理问题由\
  \ Rashid 等 [10] 涵盖。Baer [11] 更深入地描述了 `MMU` 理论，包括对一种用于简化分段系统中分配的算法讨论（第 298 页）。Thakkar\
  \ 和 Knowles [12] 提出了一种此处描述的经典 `MMU` 的替代方案。\n\nOS/2 的分段内存管理在 Heller [13] 中被讨论。为将\
  \ UNIX 移植到 80386 而开发的策略在 Hensler 和 Sarno [14] 中被讨论。UNIX 系统的详细描述可以在 Bach [16] 中找到。VAX/VMS\
  \ 操作系统和 `MMU` 硬件在 Levy 和 Lipmon [16] 中描述。\n\n## 参考文献\n\n1. Intel 公司，80386 集成内存管理的高性能\
