  \ Englewood Cliffs, NJ, 1986。\n\n16. H，“VAX/VMS 虚拟管理”，Computer (1982)。\n\n\n\n\n\
  在接下来的章节中，我将定义 OODB，描述它们是如何被实现和应用的，并指出它们在未来十年内可能将如何影响信息管理的未来。第一部分介绍什么是数据库管理系统，以及为什么它们需要进行修改。第二部分将数据库理论、编程语言与对象模型的发展联系起来。第三部分是本文的主体，概述了可能可以被认为是\
  \ OODBMS 的各种商业和实验性项目。其中，对惠尔士彼普的 `IRIS`、Servio–Logic 的 `GemStone` 以及 MCC 的 `ORION`\
  \ 进行了详细的探讨。此外，在几个不同的“模型”伞下，还考虑了一系列其他设计。最后，第四部分总结了对象数据库的最新水平。\n\n尽管本报告并未声称代表通用数据库管理系统的最新水平，但值得注意的是，最近数据库社区（即\
  \ `ACM` 的 SIGMOD）的兴趣似乎发生了普遍转变。过去，大多数活动似乎集中在关系理论、依赖理论和事务建模领域；而现在的重点似乎在于扩展 `DBMS`\
  \ 的能力，以满足新用户社区的需求 [1*,*2*]。从这个意义上说，在数据库或信息管理领域，很难找到比目前话题更及时或更有意义的问题了。\n\n## 为什么需要对象数据库？\n\
  \n`DBMS` 数据模型呈现的是一种办事员视角的世界；每个被引用的实体都有固定数量的描述性特征，且这些属性的值可以列在账本上 [3*]。尽管这种表格模型既简单又直观，但作为一种信息源，它的实用性受到了严重限制。虽然图表和表格在财务和体育板块是有意义的，但报纸出版商知道读者在报纸的其他部分想要文字、图画和照片。相比之下，数据库设计者似乎认为如果表格适用于会计软件包，那么它们就适用于所有的应用程序。对他们来说的是，世界上大部分内容并不能很好地适应表格。\n\
  \n研究人员已经确定了几个显然超出传统数据库管理系统范围的广泛领域。这些包括计算机辅助设计（CAD）系统、文档和多媒体信息系统（通称为办公信息系统；OIS）以及软件设计系统（计算机辅助软件工程；CASE）。对该列表进行简单研究可以发现一些有趣的相似之处，这些相似之处虽然不是决定性的，但说明了为什么传统的\
  \ `DBMS` 是不的。\n\n首先，这些应用程序要么存储了实际实体，要么存储了感兴趣实体的非常完整的表示。文档数据库实际上包含文档本身，而不仅仅是外部对象的描述和位置。同样，`CAD\
  \ DBMS` 包含图纸，`CASE` 数据库包含程序模块 [3*,*4*]。标准数据库通常不允许存储大对象，而试图减少大对象的尝试（例如将 CAD 图纸中的矢量坐标放入关系数据库中）在性能上会受到明显影响。\n\
  \n其次，这些应用程序通常需要动态对象。它们随时间变化，其其实际价值取决于所处的时间。用户可能会在不同时间查询同一个对象的状态，这需要某种版本控制。可能涉及多个用户，要求具有创建并发版本和分离编辑路径的能力。\n\
  \n第三，大类对象具有某些共同的属性，但为了在类型之间做出更细致的区分，你必须识别特定子类的特定属性。例如，类型为 `Publication` 的实体通常被认为有一个\
  \ `Author` 和一个 `Title`，但要了解更多关于该物品的信息，你需要知道它是哪种类型的 `Publication`。书籍没有期刊标题或期号，而期刊文章没有\
  \ ISBN 号。在这些应用领域，数据定义的特化形成了一个层次结构，其中最通用的类位于根节点，每一层向下代表一个通过添加属性来标记的细化。这种实例可以在任何层找到。实例与类型之间的识别被称为分类（classification）。当向上遍历时，这种规范关系通常被称为\
  \ `IS—A` 链接。这样理解的话，这种关联被称为泛化（generalization）。\n\n第四，这些领域的对象通常由部分的层次组成，这些部分是非排他的，并且可以动态更改。适合\
  \ `Chevy` 图纸的引擎图可能与在 Oldsmobile 中发现的图纸相同。同一个段落可能是某篇先进论文、论文开题报告和论文的一部分。这种情况是一个线索，表明层次模型的树形结构，甚至是某些对象系统中系统中严格的\
  \ `CLASS` 和 `IS-A` 关系将是不够的。支持节点可能具有多个父节点的格状结构（lattice structures）是至关重要的 [23*]。同样重要的是泛化（`IS-A`）与聚合（`IS-PART-OF`）关系之间的清晰区分。\n\
  \n最后，对这些结构的操作通常使用相同的名称，但实际上它们可能在执行完全不同的动作。在文本中移动段落的程序和在屏幕上移动图表的程序可能都被命名为 `Move`，但代码之间之间会有很大不同。为了保持通用\
  \ `Move` 调用的便利性，同时让它根据涉及的数据进行不同的操作，需要一个测试数据类型并包含所有可能结果的复杂 Move 程序，否则就需要合适的 Move\
  \ 模块附加到数据。在程序附加到数据的情况下，接收 Move 请求的图片将调用它自己的 Move 过程，而接收相同信息的段落将运行完全不同的例程。对于具有自定义类型的大数据库，复杂的类型测试程序可能是不可行的，甚至是不可能的。因此，将过程附加到数据的面向对象方法变成了一种实行的替代方案。\n\
  \n这些需求每一个都对应于编程语言社区为人知的面向对象编程（OOP）的概念。在我们的上下文中，它们通常以各自的 OOP 术语出现：\n\n1. 对象标识性。每个对象通过其\
  \ `OID` 访问。\n2. 版本。多个对象的状态可以同时存在。\n3. 复合对象和继承。对象带有方法。\n4. 组合对象。结构可以包含许多成员对象。\n5.\
  \ 消息传递和多态。每个对象执行自己的过程来响应传递给它的消息。\n\n目前，我们还规定任何满足这些需求的系统都是面向对象系统。\n\n\n\n\n## 数据管理系统特性\n\
  \n### 数据独立性\n\n数据库管理系统的价值在于其能够将数据的语义从使用这些程序转移到存储这些数据的结构中。在数据库引入之前，即使在今天，许多情况下，如果你想知道文件中的某条数据“意味着”什么（即它的用途是什么），你必须查看使用该文件的程序，或者查阅一本已经翻破了页角的的数据定义笔记本。如果记录没有结构，或者其结构是未知的，那么从当前记录中获取电话号码就是一个意义的问题。\n\
  \n另一方面，数据库管理系统允许数据独立性，这种性体现在程序和用户可以根据字段名访问数据。物理存储对用户是完全隐藏的。数据结构的修改不需要在应用程序中进行任何程序性的更改。这是通过以编译后的模式（schemas）、系统表或数据字典的形式将数据信息与数据本身存储在一起实现的。如\
  \ `SQL` 等使用这些元数据的查询语言现在使得在无需编写整个新程序的情况下进行即席查询成为可能。\n\n由于数据结构与应用程序分离，因此可以创建一个数据定义的中央存储库，供所有用户和程序使用。为了确保与组织策略和现有应用程序兼容，应该对该数据字典进行严格管理。这项责任通常属于具有数据库管理（`DBA`）功能的个人或小组。\n\
  \n## 数据库结构\n\n数据库中的数据被划分为具有相同格式的记录组，这些组被各种称为数据集、表或关系。通常这些组被称为实体类型，实体类型之间的某种形式的连接将代表它们之间的现实世界关系。目前有三种基本的数据库结构化模型，用于定义几乎所有市售的数据库管理系统：层次型、网络型和关系型。\n\
  \n在层次型数据库中，一种依赖于另一种类型的记录（例如，在 `Company` 工作的 `Employees`）将紧密存储在彼此相邻的物理位置。依赖记录被分组在一起形成层次数据结构，或称为“树”。例如，位于比特兹堡的\
  \ `COMPANY XYZ` 有三个部门 `D1`、`D2`、`D3`，其经理分别为 `Ml`、`M2`、`M3`。不同的员工在不同的部门工作。层次型记录可能看起来如下：\n\
  \n> XYZ Pittsburgh | Dl Ml El E2 E3 | D2 M2 E4 E5 | D3 M3 E6 E7 E8\n\n需要注意的是，如果没有通过链接或索引提供额外支持，数据检索的唯一可行访问点是通过最顶部的键，即树的根。\n\
  \n当使用逻辑指针或记录号将数据集连接在一起时，该数据库属于网络模型。在这种模型中，现实世界的关系通过这些集合之间的连接在数据库中得到镜像。使用 XYZ 示例，一个网络数据库实现可能包含三组\
  \ `COMPANY`、`DEPARTMENT` 和 `EMPLOYEE`，它们都通过物理链接连接。`COMPANY XYZ` 在其记录中将包含一个 `DEPARTMENT`\
  \ 记录 `D1` 的记录号。`DEPARTMENT D1` 将持有一个 `NEXT` 指针与 `D2` 形成链表，并有一个指向 `El- EMPLOYEE`\
  \ 记录的指针，该记录是 `El`、`E2` 和 `E3` 链表的表头。\n\n关系型数据库是表的集合，通过在公共数据值上应用代数集操作来形成关系。关系具有某种直观性，因为可以通过公共数据值进行识别。比特兹堡的\
  \ `COMPANY XYZ` 必须是 `COMPANY-DEPARTMENT` 表列出的同一公司 `XYZ`，作为部门 `D1` 的所有者：\n\n| COMPANY\
  \  |\n| --- |\n| COMP xyz || CITY Pittsburgh |\n| --- | --- |\n| COMPANY-DEPARTMENT\
  \  |\n| --- | |\n| COMP || DEPT |\n| --- | --- |\n| xyz || dl |\n| xyz || d2 |\n\
  | xyz || d3 |\n| DEPARTMENT  |\n| --- |\n| DEPT || MANAGER |\n| --- | --- |\n| dl\
  \ || ml |\n| d2 || m2 |\n| d3 || m3 |\n\n关系型数据库是通过在公共数据值上应用代数集操作来形成关系的表集合。关系是直观的，因为可以通过公共数据值识别出来。比特兹堡的\
  \ `COMPANY XYZ` 必须是 `COMPANY-DEPARTMENT` 表列出的同一公司 `XYZ`，作为部门 `D1` 的所有者：\n\n（注：此处表格内容由于原文格式较为凌散，翻译已保持结构对应）\n\
  \n| COMPANY  |\n| --- |\n| COMP xyz || CITY Pittsburgh |\n| --- | --- |\n| COMPANY-DEPARTMENT\
  \  |\n| --- | |\n| COMP || DEPT |\n| --- | --- |\n| xyz || dl |\n| xyz || d2 |\n\
  | xyz || d3 |\n| DEPARTMENT  |\n| --- |\n| DEPT || MANAGER |\n| --- | --- |\n| dl\
  \ || ml |\n| d2 || m2 |\n| d3 || m3 |\n\n（注：原文中表格部分似乎在输入时重复或错乱，此处已根据逻辑进行了最小化对齐）\n\
  \n*修正关系部分翻译：*\n\n关系型数据库是表的集合，通过在公共数据值上应用代数集操作来形成关系。关系是直观的，因为可以通过公共数据值进行识别。比特兹堡的\
  \ `COMPANY XYZ` 必须是 `COMPANY-DEPARTMENT` 表中列出的同一公司 `XYZ`，作为部门 `D1` 的所有者：\n\n| COMPANY\
  \  |\n| --- |\n| COMP xyz || CITY Pittsburgh |\n| --- | --- |\n| COMPANY-DEPARTMENT\
  \  |\n| --- | |\n| COMP || DEPT |\n| --- | --- |\n| xyz || dl |\n| xyz || d2 |\n\
  | xyz || d3 |\n| DEPARTMENT  |\n| --- |\n| DEPT || MANAGER |\n| --- | --- |\n| dl\
  \ || ml |\n| d2 || m2 |\n| d3 || m3 |\n\n关系型数据库是通过在公共数据值上应用代数集操作来形成关系的表集合。关系是直观的，因为可以通过公共数据值进行识别。比特兹堡的\
  \ `COMPANY XYZ` 必须是 `COMPANY-DEPARTMENT` 表中列出的同一公司 `XYZ`，作为部门 `D1` 的所有者：\n\n由于数据结构与应用程序分离，因此可以创建一个供所有用户和程序使用的数据定义中央存储库。为了确保与组织策略和现有应用程序兼容，应该对该数据字典进行严格管理。这项责任通常属于具有数据库管理（`DBA`）功能的个人或小组。\n\
  \n归一化被称为第三范式，或 `3NF`。\n\n## 事务管理\n\n数据库事务是数据库事件的原子序列，它们要么将更改提交到数据库，要么不进行任何更改。为了高效使用数据库，必须允许许多事务同时执行而不会让数据库处于不一致状态。必须保证事务在其生命周期内访问的数据不会被其他事务修改，也不会其更新的数据不会被覆盖。如果交错执行的调度存在一个与该调度结果相同的执行序列，则该调度被认为是可序列化的。通过两阶段锁定等协议已集成到\
  \ `DBMS` 中以确保序列化，从而使得并发访问变得可能且安全。\n\n在考虑对象数据库时，锁定的一个问题是粒度。这指的是锁是应用于整个数据库、单个表、物理页面还是特定记录。显然，为了鼓励并发访问会鼓励低级锁定，但低级的代价是维护锁表的开销，并且每个低级操作都需要检查锁。然而，对于高级锁定，事务将等待检索与当前锁无关的信息。\n\
  \n## 数据完整性与安全\n\n授权方案可以构建在数据库管理系统中，允许某些用户或应用程序访问数据，而拒绝其他用户。根据数据库类型，这种授权可能还取决于粒度，例如允许在集合级别读取，或禁止对某些字段进行写入。\n\
  \n数据完整性通常是指数据库内部的一致性，例如确保如果某个数据值出现，它必须在数据库的其他地方出现。例如，如果一个学生注册了某门课程，该学生也必须出现在主文件中。对于层次型和网络模型数据库，这种类型的完整性通常内置在结构中，但随着关系模型的出现，它已成为\
  \ `DBA` 必须关注的问题。\n\n## 备份与恢复程序\n\n数据库恢复通常与事务管理问题相关，因为在系统或媒体故障后恢复数据库最大的问题源于不完全的事务。可以通过备份数据（将其复制到另一个介质或设备）恢复到固定时间点，但恢复备份与故障之间发生的事务需要其他机制。主要的机制是日志记录，即在每个事务期间在单独的介质上记录事件。这可以表现为记录事务发生之前的状态（被称为\
  \ `UNDO`），或记录组成事务的命令和数据（被称为 `REDO`）。在某些情况下，可以使用或两者都用于恢复系统故障期间丢失的数据。\n\n## 其他数据库模型\n\
  \n\n\n\n\n此前介绍了层次模型、关系模型和网络三种模型，它们代表了当前数据库技术的现状。这并不意味着人们没有探索替代方案。事实上，早期研究人员提出的许多提议导致了目前正在讨论的面向对象模型。其中包括实体关系模型、函数型数据库模型和集合论数据库模型。\n\
  \n### 实体关系模型\n\nChen 的 [*6*] 实体关系模型已被广泛用作数据库设计工具，但尚无一种将其实际实现为数据库管理系统的方案。相反，它是一种高层数据建模方法，从理论上讲，它可以放置在任何将数据组织成固定格式的系统之上。其基本概念是：实体（或感兴趣的对象）与对象之间的关系是两个不同的概念，并应该以这种方式对待。这种认知使数据库设计人员必须研究表或数据集是如何相互连接的，以及数据元素之间的所有交互是否都准确地反映在它们的数据模型中。该模型直接解决了关系模型的歧义性——在关系模型中，关系和实体属性是以完全相同的方式存储的（即作为表），只有了解业务的用户才能可靠地识别出每个\
  \ [7] 的语义。\n\n### 函数型数据模型\n\n函数数据库模型（`FDM`） [*8*] 是关系模型函数依赖概念的近亲。在 `FDM` 下，所有数据都作为函数的结果被检索，因此可以看到数据库检索是以\
  \ `AGE(STUDENTID(“Smith”))` 的形式表述的。函数模型的优势在于，某些数据可以计算，某些可能存储在表中，或者某些可能从其他源检索，但对用户来说是完全透明的。\n\
  \n### 集合论数据模型\n\n该模型 [*9*] 将对象构建为标记集合，这提供了简单的路径语法并提供了一种简单、一致的集合演算。标记集合具有了关系模型不允许的两个用途：首先，标签变成了元组代理，这意味着元组是可能的，这违反了关系第一范式的规则。其次，允许长度未指定的集合，并且它们在理论上被作为一个单元存储，而不是通过代数运算重新创建它们。例如，一家名为\
  \ Acme 的公司可能有如下数据定义：\n\n```\nAcme: {Departments: {A12: {Name: ‘Sales’,Managers:\
  \ {‘Nathen’, ‘Roberts’}, Budget: 142000}},\n{A16:{Name:’Research’,Managers:{’Carter’},\
  \ Budget:256500},. . .}}.\n```\n\n在这里，标记部门 `A12` 和 `A16` 标识了复合对象，而经理可能有一个或多个值。这两种能力都与关系归式化相违背。`STDM`\
  \ 是一个高度灵活的系统；大多数其他传统数据模型（如关系和层次模型）都可以在 `STDM` 下轻松建模。另一方面，它很大程度的活性源于完全无类型化，因此失去了强类型语言为应用系统提供的优势。\n\
  \n### 面向对象系统\n\n#### 面向对象编程\n\n面向对象数据库代表了数据库研究与编程语言研究的交汇。面向对象的概念正是源于后这两个领域之一，源于抽象数据类型（`ADT`）的引入。ADT\
  \ 是封装的数据结构：它们拥有私有的数据元素存储空间和一个可以访问该存储的公共函数接口。在面向对象编程中，封装与继承和消息传递相结合，构建出对象根据其拥有的函数（通过其类成员继承自）进行类型的语言。对象在接收消息后“运行”它们的函数\
  \ [*10*]。\n\n独立对象在编程语言中的首次出现是 `SIMULA`。`Smalltalk`、`带对象的 CommonLISP`（`CLOS`）、`C++`\
  \ 和 `Actors` 都是比较流行的面向对象编程语言，但似乎每月都有新语言引入。随着语言的移动，面向对象的定义差异很大，因此在进一步进行之前，说明这些差异的范围是有用的。\n\
  \n继承通常是层次化的，但层次结构的严格性是可变的。某些语言（如 `Smalltalk`）将继承严格视为类的特化化，其中每个子类都是一个父类的子集。其他语言允许多重继承或混入（mix-ins），因此一个类可以是两个不同类的子类。多重继承的一个可能是\
  \ `CarForSale`（待售汽车），它共享了 `MotorVehicle`（机动车辆）的方法和数据，同时也共享了 `CommercialProduct`（商业产品）的方法和数据。因此，该类的任何实例都将拥有代表\
  \ `NumberOfWheels` 和 `Price` 的字段。为了完全颠覆定义继承的尝试，还有基于 Actor 的面向对象系统，它们在水平连接中使用原型和方法委托，而不是使用任何层次结构。\n\
  \n`Class`（类）既可以指一组方法协议和一组类变量，也可以指共享这些特性的对象组。如果引用的是成员关系，它是否也包含子类的成员？在尝试设计索引系统并决定是为每个子类创建一个索引还是创建一个通用索引时，这个问题具有特殊的重要性。\n\
  \n消息传递也是一个歧义的概念。某些语言将消息视为从一个对象显式“发送”到另一个对象的对象，而另一些语言则将其视为仅仅不多于函数和参数。当应用于数据库时，这在确定执行方法时产生问题：是针对辅助存储中的数据执行、针对主内存中的某些活动对象，还是针对对象的某个副本执行。\n\
  \n#### 数据库中的对象\n\n面向对象编程通常发生在单用户环境中，对象仅在编程环境使用时是需要的。任何无法放入主内存的对象要么是不允许的，要么是将环境的部分交换到虚拟内存。重要的方面是对象存在于环境中，对对象的任何操作都需要对整个环境进行操作。\n\
  \n面向对象数据库应该只在调用时将对象调入内存，并能够完全高效地这样做。大多数研究人员认为这是一个透明的操作。对于用户来说，来自动态存储的对象和来自磁盘对象的处理方式不应相同。在实现上这并不容易，因为需要\
  \ `pointer swizzling`（在内存指针和磁盘指针之间切换）。\n\n#### 类定义\n\n`OODB` 最当前的话题之一是模式演变。这场辩论围绕着类何时应该定义的问题：在编译时固定、仅允许添加新对象进行修改，或者活动对象可能会更改。如果类发生变化，对已经存储的数据会有什么影响，更改是否会被所有子类继承？更改是否包括删除？Banerjee\
  \ 等人设计了一套实用的约束 set，以确定哪些修改在语义上是一致的。\n\n\n\n\n\n一种方法（可能是最实用的一种）是在数据库设计早期就确定类。例如，如果一个办公室只使用某些通用类的文档（如发票、信件和报告），那么它们为什么需要动态模式修改工具所带来的开销呢？有人担心，在变化的环境中，类的定义可能会超出其效用性，这比具有严格定义的类构成了更大的威胁。像\
  \ Smalltalk 等产品使用了浏览器工具，允许设计人员查看可用的类。在某个时刻（曾建议过达到 300 个类），即使是浏览器对用户来说也变得难以处理 [4*]。\n\
  \n## 数据访问\n\n正如下一节的描述所示，对于应该如何访问对象数据库（OODB）中的数据，存在一些分歧。在小型对象系统中，用户可以轻松地使用对象标识符，这种技术在大型数据库中效果并不理想。在长期运行的大型系统中，标识符很容易丢失或遗忘。通过属性值访问是\
  \ OODBBS 的最低要求。\n\n为了能够高效地实现属性值访问，有必要打破公共接口的概念。对每个潜在候选者执行方法可能会非常昂贵。因此，索引必须能够进入对象的私有存储区，且对索引的请求必须限于类变量。\n\
  \n索引还存在索引粒度的问题。如果对 `Vehicle` 进行索引，索引是检索所有 `Vehicle` 类的实例，还是包括 `Car`、`Truck` 和 `Bus`\
  \ 的实例？模拟实验 [12*] 提供了关于多级索引与单级索引相对效率的一些数据，表明潜在查询的性质是决定性因素。\n\n### 面向数据库的实现\n\n在这里我们考虑了在数据库管理系统中实现面向对象编程概念的几种尝试。其中前三个\
  \ `IRIS`、`ORION` 和 `GemStone` 被进行了详细介绍。接下来，简要讨论了一些基于 `C++` 语言的数据库管理系统（DBMS）。最后一节介绍了另一种替代范式——可扩展数据库，一些研究人员将其作为\
  \ OODBMS 的替代品或作为构建自定义 OODB 的平台。\n\n三个主要的面向对象数据库管理系统（`IRIS`、`ORION` 和 `GemStone`）在过去几年里一直是许多文章的主题。在某种程度上，它们代表了该领域的范式，是\
  \ OODB 能够做到的广为人知且易于识别的模型。这里应该强调范式的多样性，因为这三个系统在实现上几乎没有共同点。`IRIS` 是一个关系型数据库的面向对象前端，这种技术在学术文献中很流行，但很难将其视为与关系型模型的对比。`ORION`\
  \ 基于 `CommonLISP` 基础，类似于从人工智能研究中产出的某些专家系统外壳，例如 `Knowledge Craft` 和 `KEE`。`ORION`\
  \ 与它们相比提供的的主要区别是提供了大规模的次级存储对象管理。`GemStone` 起源于集合理论数据模型与面向对象编程语言 `Smalltalk` 的结合。在三个系统中，`GemStone`\
  \ 是目前唯一在商业上可用的。\n\n本节概述的其余数据库系统主要是大学和研究实验室遵循通用模型正在进行的工作示例。它们都选择 `C++` 作为基础，这为它们之间提供了一条共同线索。尽管选择\
  \ `C++` 可能是因为已经大量致力于使用 `C` 或 `C++` 编程的潜在客户群，但几位不同的开发者都发现 `C++` 是开发对象持久存储的合适平台，这一事实强调了当前\
  \ OODBMS 研究的一个主要主题：在单一编程语言中实现主存储和次级存储的无缝集成。\n\n### IRIS–HP Labs\n\n`IRIS` 是一个“下一代”数据库管理系统原型，自\
  \ 1984 年以来一直在惠尔尔-普罗实验室开发 [13*, *14*, *15*, *16*, *17*, *18*]。它的面向对象接口建立在关系型基础之上，实现了一个高度灵活的实验环境。除了一组提供到\
  \ `C` 和 `Lisp` 程序化链接的 `C` 函数外，还有一个交互式查询接口，它是 `SQL` 的真正扩展，称为 `OSQL`。`IRIS` 整合了面向对象编程的大多数特征：类和实例、继承、方法和对象标识性。唯一的显著缺失——消息传递被函数调用所取代。这一修改允许\
  \ `IRIS` 与现有的编程语言、外部数据库和分布式系统几乎无缝集成。\n\n![FIGURE 1. IRIS 架构。](img/pg292_Image_202.jpg)\n\
  \n图 1. IRIS 架构。\n\n*IRIS 架构。* `IRIS` 系统的底层是 `Iris` 存储管理器，它是 `ALLBASE`（在 Fishman\
  \ [*75*] 中称为 `HP-SQL`），HP 的关系型/网络（表加父子指针）DBMS。`ALLBASE` 处理数据库的所有管理功能，如关系的创建和删除、事务管理、日志、恢复和缓冲区管理。通过游标访问元组（一次一个而不是整个表）简化了单个元组的检索、更新、插入和删除。IRIS\
  \ 开发早期提出的存储系统扩展包括长期事务管理、可扩展类型和多媒体对象。这些目标某些似乎已从存储问题转移到了外部函数问题。每个目标将在后的章节中进行详细讨论。\n\
  \n上一个层是对象管理器。这是系统的核心，处理模式定义、数据操作和查询处理。在对象管理器中，以对象、类型和函数呈现的数据被重构，以满足存储管理器的元组、关系和约束词汇。从架构上讲，对象管理器和存储管理器是相互独立的，尽管为了实现性能它们是紧密耦合的。尽管如此，关系子结构对于所有\
  \ `IRIS` 接口模块都是完全隐藏的。\n\n顶层由四个接口包组成。`OSQL` 是一个交互式查询处理器，它扩展了 `SQL` 以允许通过标识而非属性值进行访问。例如，与其使用：\n\
  \n```\nSELECT S.PHONE\nFROM STUDENTS\nWHERE S.NAME = “Smith”\n```\n\n不如询问：\n\n```\n\
  SELECT PHONE(smith1).\n```\n\n图形编辑器是一个允许用户遍历类型和对象结构的交互式浏览器。其余两个接口是到 `Lisp` 和 `C`\
  \ 的实验性桥接。每种语言都开发了三种语言接口。一种是传统的 `OSQL` 嵌入。第二种是将 `IRIS` DBMS 封装为编程语言对象，其方法在对象管理器的\
  \ `C` 子程序中定义。第三种是将数据库对象视为编程语言自身定义对象的持久版本的实验性平台。这提供了一个编程环境，其中动态对象和持久化对象之间的差异几乎不可见。\n\
  \n\n\n\n\n# IRIS 对象\n\n对象是 IRIS 中访问的基本单元。每个对象都有其全系统范围的 `OID`（对象标识符）。对象具有属性，这些属性通过函数定义。属性可以是一个字面量对象（例如字符串或数字），也可以是另一个对象。例如，人的\
  \ `NAME` 属性可以是字面量对象“Smith”，而同同一人的 `FATHER` 属性则是另一个人的 `OID`，而该人的 `NAME` 可能是“Smith”也可能不是。在理论层面，IRIS\
  \ 并不区分检索存储数据的函数、计算值的函数或从其他程序或机器返回值的函数。\n\n[content]\n共享相同属性的对象（或更正式地说，共享定义属性的函数）被认为具有相同的**类型**（Type）。类型本质上与其他面向对象系统中的类（Class）相同，即它们是命名的对象集合。函数实现在类型上，因此两个相同类型的对象将利用相同的函数来返回属性。类型的结构允许简单的单继承和多重继承，形成一个无根的有向无环图。一个\
  \ `CAR` 可能是 `MACHINES`、`PASSENGER-VEHICLES` 和 `PURCHASE-GOODS` 的子类型，因此它将继承所有这些超类型的所有属性。每个\
  \ `CAR` 实例都将为与这些类型相关的每个字段拥有相应的函数值，例如 `HORSEPOWER`、`NUMBER-OF-PASSENGERS` 和 `PRICE`。在\
  \ `CAR` 下可能还会有子类型，如 `SEDAN` 和 `STATIONWAGON`。\n[/content]\n\n允许多态（或函数名重载）。对于当从两个源继承相同函数名时产生的冲突，其解决基于基于继承的特殊性，如果无法解决，则基于用户定义的规则。\n\
  \nIRIS 在类型定义方面提供了一个动态环境。类型可以被添加和删除，实例可以随着时间的推移应用或移除新类型。一个即将毕业的年级学生可能是 `STUDENT`\
  \ 类型，具有 `CLASS` 或 `QPA` 等属性，但在毕业就业后，可能会放弃 `STUDENT` 类型并采用 `EMPLOYEE` 类型，拥有一套全新的属性（即\
  \ `DEPT` 或 `SALARY`）。IRIS 目前尚不允许的重构是在现有类型之间创建新的“子类型-超类型”关系。\n\n## IRIS 函数\n\nIRIS\
  \ 中的函数和查询被编译为关系代数操作树，然后由对象管理器进行优化。树的底部是叶节点，它们可能是存储函数的表查询，也可能是外部函数的引用。较高的节点表示子树的组合，通过交叉积、过滤和投影（相当于关系代数中的连接、选择和投影）等操作链接。这些由派生函数和查询指定，并可以通过生成更高效但语义等价的树进行优化。\n\
  \nIRIS 函数的最简单形式是那些查找存储数据的函数或属性函数。如 `AGE(OID)` 的函数是一个根据给定对象返回整数的表查询。此类函数是自动可逆的，因此可以执行\
  \ OSQL 查询：\n\n```sql\nSELECT NAME(S) for each S where AGE(S) = 30\n```\n\n函数通过约束来区分是可选的还是必须的，以及是单值的\
  \ `[TEACHER(COURSE]` 或多值的 `[STUDENT(COURSE]`。可选命令 `CLUSTER` 可能会指示某些属性存储在同一个表中以便访问。\n\
  \nLyngbaek 和 Vianu [77] 研究了 IRIS 数据模型与存储函数的底层关系结构之间的关系，并发现了这种映射的若干优势。其中包括：现有的关系数据可以被\
  \ IRIS 系统轻松访问，以及关系模型的强大理论工具可以用于制定 IRIS 模型的语义。一个明显的缺点（这也是大多数建立在关系基础之上的复杂结构所具有的）是连接（join）的开销。\n\
  \n派生函数以其他函数的形式作为 IRIS 查询被存储和实现，这类似于 Ingres 等关系数据库中的 `VIEW`（视图）。在某些情况下，可以使用物化的派生函数来创建频繁访问的函数的临时存储版本。如前所述，这些被编译为关系代数树，并可以根据（建议的）用户定义优化规则在运行时进行优化。在开发优化程序期间，可以使用减少重复查找、最小化连接操作以及领域知识。\n\
  \n外部函数是访问 IRIS 环境之外数据或处理过程的函数。这些可能是对其他程序或数据库的调用，也是对其他机器和操作系统的调用。IRIS 外部函数协议是一组响应五个调用的程序：`ALLOC`、`OPEN`、`NEXT`、`CLOSE`\
  \ 和 `DEALLOC`。`ALLOC` 和 `DEALLOC` 建立通信并在完成后销毁，`OPEN` 和 `CLOSE` 启动活动，`NEXT` 用于逐个处理返回的数据。\n\
  \n作为外部函数用法的示例，Conners 和 Lyngbaek [14] 展示了一个股票经纪人的 IRIS 数据库模型，其中包含有关客户和持仓的相关信息。经纪人还订阅了提供当前市场活动的电报服务（tickertape\
  \ service）。对 IRIS 数据库的查询可能包括诸如持仓当前价值或与本月最低价相比的价值等问题。外部函数可以透明地访问股票数据库或电报服务，而无需将数据存储在经纪人的系统中。\n\
  \n外部函数受限于参数传递和链接的约束，这在子程序库系统中是常见的。消息传递架构可能比将维护远程访问程序作为 IRIS 架构的一部分更灵活的安排。HP 正在探索的一种可能的折中方案是将双向通信模块直接构建到\
  \ IRIS 中，这样单个函数就不承担该责任。这将减少实现外部函数所需的工作，并且预计会增加可调用操作的灵活性。\n\n## IRIS OSQL 与图形编辑器\n\
  \n[content]\nSQL 中一个为 OSQL 所修改的一个关键元素是 `FROM` 子句。\n[/content] \n\nBeech [13] 列出了选择\
  \ SQL 作为基础语言而非创建新语言的几个理由。OSQL 设计者认为，在已经存在合适基础的情况下，从零开始既是“社会不负责任”的，是不明智的，因为实现新语言的许多问题已经得到解决。嵌入\
  \ SQL 的做法也意味着用于主机语言访问的预处理器也已经可用。最后，正如 Lyngbaek 和 Vianu [17] 已经确定的，关系数据库与 IRIS 之间的关系是重大的，SQL\
  \ 接口只会鼓励这一研究方向。\n\n```sql\nSELECT NAME, ADDRESS\nFOR EACH SUPPLIER\n```\n\n[/content]\n\
