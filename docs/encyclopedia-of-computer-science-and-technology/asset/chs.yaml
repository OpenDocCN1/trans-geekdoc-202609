  \ | | | |\n\n\n\n\n\n声明式技术允许在指定信息，而无需建立关于其将被使用的形式的任何假设。重点在于其将要提交的过程，即“是什么”。在这种情况下，知识被表示为事实的静态集合以及一组用于处理这些事实的通用程序。每个事实只存储一次，且与其可能被使用的不同形式无关。可见，这是一个非常可修改的、灵活的系统，它可以节省大量的资源，并确保推断的确定性。语义网络和谓词演算是最经常使用的声明式技术。\n\
  \n另一方面，过程化技术更强调执行代表知识单元的操作方式。与算法编程语言一样，重点在于解决问题的形式，即“如何做”。在这里，知识是由供稍后使用的程序表示的；通过这种方式，将知识表示为启发式或不适应简单声明式方案（例如\
  \ `probabilistic reasoning`，概率推理）的表示变得更容易。这种系统允许通过使用领域特定的启发式方法来避免非自然的推理路线，从而更直接地开发其推理逻辑；另一方面，它还被赋予了编码和理解推理过程本身的能力。基于规则的系统通常被当作过程化方案；而框架（frames）和脚本（scripts）被认为是混合的。所有这些内容将在后文中被分别研究。\n\
  \n### 谓词演算\n\n构建智能系统的首次尝试使用了一阶谓词演算作为表示，因为它具有强大的表达能力和定义良好的语义。假设我们想要表示：`John gives\
  \ Mary a pencil. John is Mary’s friend.`。使用基于谓词逻辑的形式（如 `Prolog`），这两个句子表示如下：\n\n\
  | gives (John, Mary, pencil) || person (John) |\n| --- | --- |\n| friend (John,\
  \ Mary) || person (Mary) |\n|   || physical object (pencil) |\n\n逻辑似乎是表达某些概念的自然方式，因为它经常对应于直观理解；此类概念易于修改，有利于实验。它是准确的，也就是说，有标准方法来确定表达式的含义。它是灵活的，因为它不从于真正进行推断的过程类型。最后，它是模块化的，因为随着新事实的发现和添加，知识可以不断增长。遗憾的是，目前还没有一种有效的过程来判断一个特定的任意句子是否是任意知识库的逻辑推论；此外，这些结构的粒粒度不足以表示单个复杂的对象及其之间的关系。这些问题导致了语义网络以及面向对象和基于框架的知识表示语言的发展。谓词演算在形式上与其他形式等价，但由于上述困难，它已被它们取代，并且在实现上效率较低。换句话说，所有的表示形式在形式上是等价的，但从实践角度考虑完全不同。\n\
  \n### 产生规则\n\n一旦人工智能迈出第一步，通过传统算法对人工智能问题及其解决方案进行表示和处理就开始受到质疑。传统程序的一个基本特征是它们的顺序性。在环境发生变化且必须模拟人类对刺激的反应的情况下，这种方法是不够的。因此，将数据作为运行操作程序的一部分的想法运而生。这些想法促成了基于产生规则系统的出现，这类系统属于更通用的系统类型，被称为“产生规则系统”。\n\
  \n基于规则的系统通常包含三个组件：\n1. `working memory`（工作内存），包含数据；\n2. `rules base`（规则库），一组规则；\n\
  3. `inference engine`（推理引擎），一种控制策略。\n\n产生规则表示为：\n```\nIf A Then B\n```\n前提 `A` 表示条件。结论\
  \ `B` 表示新事实。规则必须呈现的最重要特征之一是确定性因子或信度系数，用于处理不确定的事实。必须在每条规则上关联一个反映高或低信度的程度。\n\n为了做到这一点，人们提出了不同的近似模型：\n\
  * `probability`（概率）：包含必要或可能的概念。\n* `nonmonotonic`（非单调）：管理时间的缺失。\n* `fuzzy`（模糊）：最后一个基本思想是定义特征函数\
  \ (`CF`)，它们在 `(0,1)` 区间是连续的，与集合论中的不同。基于规则系统的主要优点是模块化（允许自由添加、删除或修改规则）和统一性（因为信息编码在产生规则中）。由此产生的缺点是效率低下和不透明（难以跟踪控制流）。\n\
  \n### 语义网络\n\n产生规则不能以自然的方式表示声明式知识，例如领域对象之间的关系。如所述，语义网络起源于对知识表示替代方案的探索。这种形式将共享相同符号的不同组件分组：\n\
  1. `Nodes`（节点），代表对象、概念或情况。\n2. `Arc`（弧），连接节点，代表它们之间的关系。\n\n但节点和弧可以关联标签。例如，语义网络可以用于表示谈论谓词计算时提到的句子，其中\
  \ `the` 意味着元素；`ss` 意味着超集；`arg` 意味着参数。标签保留了关系的语义。然而，对于维持想要建模的断言意义所需的关系类型没有限制，但过多的链接类型可能会导致语义网络解释器的运行效率低下。因此，必须在关系的数量上表现出克制。\n\
  \n\n\n\n\n尽管使用图形化表示法思考语义网络是有用的，但计算机无法以这种方式进行表示。通常会使用某种类型的“属性-值”内存结构。例如，在 `LISP`\
  \ 中，每个节点将是一个 `atom`（原子），链接将是特征，而链接另一端的节点则是值。\n\n### 框架（Frames）\n\n框架也是一种面向结构化对象的表示形式。框架的概念是由明斯基（Minsky）在\
  \ *17* 中引入的。框架表示典型场景的结构。每个框架都与不同类型的信息相关。其中部分信息有关如何使用该框架；另一部分与预期将发生什么有关，特别是当这些预期没有得到确认时该做什么。\n\
  \n可以将框架看作由节点和关系构成的网络。框架的“高层”是固定的，它们代表在所假设的情况下始终为真的事物。“低层”有许多终端或“插槽”（slots），必须由特定数据填充。相关框架的集合组合成框架系统。重要动作的影响通过系统框架之间的变换来显示。这些变换用于减少某些类型计算的成本，表示重点和注意力的转移，并显示“图像”的有效性。某些插槽可以用默认赋值来填充。因此，框架可以包含大量细节，而这些假设并没有根据情况得到具体的证明。\n\
  \n上一个例子中的两个句子可以用图 13 中的框架表示 *3* 。在这个例例中，表示了多种类型的知识。“类型”插槽用于在框架之间建立一种层级继承特性，这反过来允许从“父”框架获取信息，以便“子”框架可以进行继承（这类似于语义网络表示中的“是”关系（is-a）链接）。在某些系统中，插槽可以具有复杂的结构，类似于框架。在其他情况下，插槽包含关于它可以取哪些类型值的指示或预期。\n\
  \n框架的一种变体——脚本（scripts），是专门为表示事件序列而设计的。\n\n![FIGURE 13 框架表示的一个示例。](img/pg178_Image_155.jpg)\n\
  \nFIGURE 13 框架表示的一个示例。\n\n图 14 *3*] 展示了知识表示形式形式主要类型的总结，与之相关的典型推理技术，以及每种形式的主要缺点。\n\
  \n![FIGURE 14 知识表示类型。](img/pg179_Image_156.jpg)\n\nFIGURE 14 知识表示类型。\n\n### 知识的使用：推理与控制。\n\
  \n推理引擎执行了一项对应于知识部件操作控制的任务。它随后表达了特定类型的推理，一种可以在不同水平上进行描述的范式。\n\n1. 对于解决问题方面的智力进步，系统的全局功能可以被视为以下类型的推理：“假设与验证”、反归归法、限制扩散的推理、类比推理以及将问题分解为更简单的子问题的推理。\n\
  2. 在概念方面，人们试图可视化目标为探索的搜索空间。本质上有两种搜索空间：状态空间和问题空间。\n3. 关于操作方面，推理可以以句法方式对正向链和后向链的限定进行描述。\n\
  4. 关于搜索，可以表征推理引擎如何构建状态或问题的图，以及它如何在其运行。当需要做出决策时，即在选择规则的时刻，推理引擎可以使用不同的策略来做出此选择：深度（例如爬山算法、反向），或范围（束搜索、分离和渐进赋值）。\n\
  \n基于规则的系统可以根据规则的语法及其控制结构分为两类：\n\n> 由前件（antecedent）运行的系统，或正向链系统，其中当前件为真时，处理结论并执行相关动作\n\
  \n> 由结论（consequent）运行的系统；在这种情况下，规则执行的分类由后向链引导，意味着将规则的结论与待测试的断言进行匹配。\n\n基于规则的系统的控制策略包含了控制知识，它无非一个“通用问题求解模型”。该策略连接了工作周期；每个周期包含两个阶段：\n\
  \n1. **决策或规则选择阶段**：\n    1. 限制包括尽可能利用通用知识部件，将事实和规则分为族类；确定它们的哪些子集在当前值得被比较，以便比较阶段尽可能快。\n\
  \    2. 匹配，其中通过检查数据库来选择待触发的候选规则子集。该子集被称为冲突集（conflict set）。\n    3. 冲突解决，即确定要触发的规则。为此，存在几种方法：选择第一个符合上下文的规则、根据程序员定义的标准选择优先级更高的规则、最特定的规则、其中的任何一个，甚至是不选，即通过未来的并行计算机实现伪并行来探索规则。\n\
  2. **动作、触发或演绎阶段**：在此阶段，推理引擎控制所选规则的执行。使用正向链，它通常在基中引入、删除或修改数据。使用后向链，它将规则前提作为目标引入基中。\n\
  \n循环反复，直到目标事实被添加（正向链）或所有目标在基中得到验证（后向链）。当没有规则可以触发时，在两种情况下都会停止。\n\n为了解释两种推理机制，假设我们有以下规则集：\n\
  \n```\n1: IF B and D and E THEN F\n2: IF D and G THEN A\n3: IF C and F THEN A\n\
  4: IF B THEN X\n5: IF D THEN E\n6: IF A and X THEN H\n7: IF C THEN D\n8: IF X and\
  \ C THEN A\n9: IF X and B THEN D\n```\n\n以及以下数据库：\n\n* 已知事实：B,C\n* 目标：H\n\n在正向链中，推理从已知事实开始应用规则直到推导出目标。通过这种方式，可以使用规则\
  \ 4 和 7 从 B 和 C 推导出 X 和 D。当一条规则触发时，新事实会被添加到基中。图 15 显示了描述该示例这种推理方式的树。弧表示已应用的规则，节点表示不同的数据库状态。虚线弧是匹配但未触发的规则。选择规则的策略是选择第一个适用的规则。\n\
  \n![FIGURE 15 正向链的一个示例。](img/pg180_Image_157.jpg)\n\n\n\n\n\n# 推理机制\n\n当推理使用反向链法时，它从目标（`H`）开始，尝试引入必须验证的等效子目标。通过这种方式，使用规则\
  \ `6`，`H` 被替换为子目标 `A` 和 `X`，这些是需要考虑的新目标。反之，`A` 可以使用这些规则之一（`2`、`3` 或 `8`）进行验证。如果失败了，例如，在这里无法以任何方式推导出\
  \ `G`，则需要回溯，并尝试上一个被忽略的规则。图 16 展示了针对前一个示例的这种推理方法。\n\n![FIGURE 16 反向链法的示例。](img/pg181_Image_158.jpg)\n\
  \nFIGURE 16 反向链法的示例。\n\n## 语义网络中的匹配\n\n匹配是处理处理有结构化对象（如框架和语义网络）时最广泛使用的推理机制。这种操作类似于谓词演算法的统一\
  \ [*16]。它对于作为产生系统全局数据库的结构化对象是基础性的。\n\n匹配在语义网络中的工作如下：构建一个表示对象或事实草图的网络片段，然后将其与数据库中的网络进行比较，以检查是否存在此类对象。为了完美匹配，变量节点被限定为它们应该拥有的值。\n\
  \n继续前述示例，假设我们想问问题：“谁给玛丽铅笔？”。这可以通过图 17 中的网络片段来表示。该片段与数据库网络进行比较，寻找一个与 `PENCIL`（铅笔）有“对象”链接且与\
  \ `MARY`（玛丽）有（接收者）链接的 `G` 节点。一旦找到，则将其“赠送者”链接指向的节点作为答案返回。匹配器还可以推导出未显式存在的网络结构。\n\n\
  ![FIGURE 17 用于查询数据库的语义网络片段。](img/pg182_Image_159.jpg)\n\nFIGURE 17 用于查询数据库的语义网络片段。\n\
  \n同样的问题可以通过图 18 目标帧表示，并通过将其与图 13 事实帧 `G1` 匹配来回答。\n\n![FIGURE 18 回答该问题的框架：谁给玛丽一本书？](img/pg182_Image_160.jpg)\n\
  \nFIGURE 18 回答该问题的框架：谁给玛丽一本书？\n\n## 演绎操作与继承\n\n在用于语义网络和框架推理的演绎操作中，包含了界定、继承以及网络规则和框架规则。通过特殊对象（框架或网络）断言集合中每个成员属性的蕴涵被称为界定实体（delineation\
  \ entities）。这些实体可以在正向用于创建新的事实帧或网络，或向现有实体添加属性。\n\n在许多应用中，表示集合中个体的结构化对象形成了一个分类层次结构。考虑示例语义网络。学习玛丽是一个人，我们可以使用界定（结合某些集合理论）进行多次正向推理。具体来说，我们可以推导出玛丽在呼吸、有两条手臂等。系统的运行方式就像对象自动从其集合和超集继承了所有必要特征。标记传播（Marker\
  \ propagation）是语义网络中处理继承的一种频繁使用的机制。标记标记了用户想要了解某些信息的节点，标记开始通过某些链接在整个网络中传播，这取决于要解决的问题类型或问题类型。\n\
  \n## 基于框架的推理\n\n框架从其所属子类或实例的其他框架中继承槽位（slot）值。一旦选择了一个框架来表示当前的上下文或情况，在用框架进行推理时，主过程通常仅包含满足其槽位的要求。继承值和默认值相对容易填充；在很大程度上，框架表示法的威力就基于这些值，因为任何表示该情况的新框架都可以使用以前经验确定的值，而无需重新计算。当必须推导信息时，与槽位相关的程序（procedures）提供了指定适当的方法，这些方法可以利用当前上下文，即“领域特定的启发式方法”。换句话之，通用问题解决方法可以用领域特定知识进行补充。\n\
  \n语义网络和框架形式化可以作为基于规则的系统的基础。有时，如在 `KEE` 中，规则本身被表示并结构化为框架。\n\n## 框架的动态方面\n\n在框架的声明式结构（组织静态事实的方式）之下，框架中还存在一个动态或过程化的方面。特别是，指导系统推理或行为的程序可以附加到槽位上，以解决问题。\n\
  \n活动值（Active values）是附加在界定帧（delineation frame）槽位上的程序或规则集，在读取或修改槽位值时触发。这些程序实现了事件或数据驱动的处理，因为它们只在特定数据或事件出现时运行。正如结构所示，基于框架的系统在数据形式或内容的预期对于解决如视觉场景解释或语音识别等问题领域非常有用。槽位带有附加程序，仅在特定事件发生时起作用。“需要”（If-needed）程序在需要槽位信息但槽位为空时运行。“添加”（If-added）程序在槽位中存储新信息时运行。最后，“删除”（if-deleted）程序仅在槽位信息被删除时运行。\n\
  \n## 控制知识与元规则\n\n除了对对象和关系的表示和使用外，还需要考虑控制知识。多个领域（如医学或数学）的专家可能不熟悉计算机，他们发现以谓词和规则的形式表达技能非常方便且自然。但也有为演绎系统提供控制知识。高效的控制策略是复杂的，将其整合需要高技巧。理想情况下，控制策略的设计应该交给\
  \ AI 专家。然而，领域特定的控制知识通常对程序非常重要。因此，专家经常提供此类知识以及声明性和过程性知识是非常有趣的。体现控制知识的不同方式有：\n\n1.\
  \ **元规则（Metarules）：反映高级知识（即控制知识）的元规则概念是由 Davis 在 `TEIRESIAS` 中引入的。在 `TEIRESIAS`\
  \ [*17] 中，元规则与对象级推理规则一起工作，推导出如何在给定情况下使用这些规则。它们代表了使用对象级知识的策略。它们的语法与产生规则相同，因此可以使用相同的推理机制，且知识在所有层次上都是统一的。它们允许对引导目标的规则集进行重新排序。它们之所以被称为元规则，不是因为任何语法细节，而是因为它们表达了“关于知识的知识”。\n\
  \n元规则是对在给定情况下如何推理的指示，因此它为选择改进程序性能的规则提供了用的建议。例如，[*18]：\n\n```\nIF 培养物不是来自无菌源，且某些规则的前件中提到了与当前生物相同的上一个生物，\n\
  THEN 存在证据 (1.0) 说明它们没有一个是有用的。\n```\n\n\n\n\n\n对这一规则的关注在于：过去发生过但仅表面上愈合的感染，可能在最晚一个月后再次出现。因此，推断引起感染的生物体身份的一种方法是参考之前的感染情况。然而，如果感染培养的方式导致样本不是无菌的，那么这种推理就是无效的。在这种情况下，从上一个生物体开始推断当前的生物体身份是没有意义的。\n\
  \n## 2. 议程 (Agenda)\n基于知识系统的另一种控制机制是议程。议程是系统可以执行的任务列表。每个任务通常与一组导致其被提出的原因相关，并有一个关于其用性的系数或衡量标准。由议程控制的系统通过从议程中选择最有趣的任务并执行它，根据其重要性或趣味性分配资源（时间和空间）。当一个任务运行时，它可能会产生新任务，这些任务必须被纳入议程[19*]。这种选择-操作序列循环反复。\n\
  \n## 3. 黑板 (Blackboard)\n[20*]。这种机制组织并控制个体的、也许是不同的组件，被称为“知识源”。黑板是在独特系统中使用不同类型知识的自然过程。为了解释这种方法论，想象一块巨大的空白黑板，周围围着一群试图组合拼图的人。每个人都有一块拼图碎片，认为自己拥有一块“有前景”碎片的人就会将其放置。如果其他玩家所持有的任何可用碎片与已放置的碎片相匹配，它就会被正确放置，从而向解决方案更近一步。\n\
  \n这个拼图可以在完全的沉默中解决；组员之间不需要进行直接通信。放置碎片也没有预设的顺序；这就是为什么这种控制被称为“*机会主义*”的。如果你想在这个过程中建立顺序，则需要使用一个监控器（monitor）来审查所有可放置的碎片并选择其中一个；这需要某些可以“先验”定义或动态定义的标准或策略，只要它能持续解决问题即可。\n\
  \n### 实现\n在这一阶段，知识工程师（们）将形式化的知识输入到具有已验证能力的计算机程序中。构建程序需要：\n\n> 内容：数据结构、推理规则和解决问题的控制策略。形式，由为了开发系统而选择的工具所指定。集成，意味着合并和重新组织不同的知识元素，以删除错误的全局比较。\n\
  \n这一阶段应该快速执行，因为实施初始原型的一个原因是为了验证在第一开发阶段做出的设计决策的有效性。这意味着初始代码在开发过程中有很大概率被修订或拒绝。\n\n\
  尽管这有时是一个独立的阶段，但开发通常是在这个阶段进行的。这种开发工作是最重要的方面之一，而且在专家系统（ES）的情况下，通常需要更长的时间，特别是当目标是比较这些接口，并在可能的情况下改进用户已经习惯的接口时。一个良好的接口将极大地有助于系统的验收。\n\
  \n### 验证 (Verification)\n验证意味着评估原型的性能和用性，并在必要时对其进行修订。专家会专门对原型进行评估，并帮助知识工程师进行最终的（尽管可能是可能的）修订。原型所执行的示例应在多个问题上进行验证，以评估其性能和用性（此处原文为\
  \ usefulness，译为用性或实用性均可*）。这种评估可能会揭示表示方案中的问题，例如被遗忘的概念和关系、在错误的细节水平上表示的知识，或难以管理的控制机制。此类问题可能迫使构建者通过不同的开发阶段对系统进行“回收”，重新表述概念，改进推理规则并修订控制流。\n\
  \n另一方面，系统以不智能或不自然的方式向用户提问，会降低其对系统的信心。因此，系统的解释必须能够充分描述得出结论的方法和原因，并且测试问题必须涵盖领域处理的典型情况，测试预期的困难情况的局限性。\n\
  \n系统在扩展到验证真实测试之前，必须在实验室环境中进行调试和验证。最终用户需要的不仅仅是性能或高水平；他们还需要一个快速、可靠、易于使用和理解的系统。此外，它的故障必须是可以恢复的。显然，专家系统在准备好商业使用之前需要经过大量的测试验证。\n\
  \n## 第三阶段。完整系统的生产或开发\n一旦大家对原型的最终版本都满意，它就可以被扩展为完整的或进入生产阶段的专家系统（ES）。开发完整系统所必需的活动包括以下：\n\
  \n### 实现完整系统的中央结构或核心\n最近，有人主张最好忽略原型。不同的原型可能只会强调了重新启动知识库基础设计的需求，有时甚至是重新启动整个开发过程的需求。在通常需要的修改中，我们可以找到系统所包含的精确对象、属性和关系的列表、层次级关系的调整，以及推理和启发式处理方式的变化。最后，虽然原型可能是成功的，初始的知识表示结构和使用的事实最终仍需要被修改。\n\
  \n### 扩展之前获得的知识库\n这可能是构建整个系统时要进行的主要工作。如果需要扩大知识库，则需要添加大量的启发式案例，这些这些通常和通常会增加系统的深度。可能决定纳入新的规则，以处理额外的子问题或专家工作之前最初未考虑的其他方面。\n\
  \n### 针对最终用户需求定制接口\n该接口使专家系统（ES）能够为用户提供信息，并在必要时获取信息。必须关注句子和解释的引入，以帮助用户遵循专家系统的逻辑，同时系统必须让用户更容易、自然地从系统中询问并获取他们所需的任何细节。图形化表示非常有帮助，并且可能是系统成功的关键。\n\
  \n### 开发系统性能的监控与评估\n接口必须使专家能够引入不同的案例来检查系统推理，并逐步检查给定的案例，询问为什么遵循某些特定规则或没有遵循任何规则，并通过这种方式识别出为了让系统得出充分结论所需的额外特定知识项。另一方面，在开发的这一阶段，专家对规则的引入已经有了充分的掌握，以至于他们继续向系统中插入新规则。通过这种方式，知识工程师对系统控制权向系统本身或专家的转移得到了促进，以便他们能够自己完善、详细和完成系统的维护。\n\
  \n\n\n\n\n# 第四阶段：生产环境下的集成与维护\n\n仅仅构建一个在孤立状态下运行良好的专家系统（ES）是不够的；有必要将其集成到其将继续运行的工作环境中。集成的目的不是对专家系统进行重大更改，而是包含必要的程序，以确保系统能够与组织内部现有系统（无论是专家系统还是传统系统）协调工作。在这一阶段开展的活动可以包括以下内容：\n\
  \n## 技术转移的组织\n\n当专家系统准备好进行集成运行时，知识工程师必须确保专家、用户以及将要使用和维护系统的人员真正理解它。到目前为止积累的经验表明，一旦专家确信系统能够为他们提供非常有用的建议，他们将愿意快速接受该系统。然而，说服那些非专家则会引发在组织环境中引入新技术系统所面临的所有问题和挑战。这方面的成功取决于任务规划执行的细致程度、各方之间沟通的量和范围，以及为讨论变更所提供的充足机会。简而言之，这包含了第一阶段在间接问题中所指出的所有内容。\n\
  \n## 专家系统与不同软件、硬件及其他系统的建立\n\n这是集成过程中另一个需要实现的目标。专家系统可能需要从测量仪器或其他硬件系统获取信息，或者访问数据库系统，甚至需要从人员处获取数据和信息。目标还可以包括完善取决于系统内部时间的因素，使其能够以更快、更高效的方式运行；或者如果系统必须在非通用的过程环境中运行，则可能改进硬件的物理特性。在专家系统开发过程中生成的代码到生产代码的“可移植性”与集成紧密相关。\n\
  \n## 提高最终全局系统的性能\n\n一旦专家系统被集成到更大的系统中，就有必要提高该全局系统的性能，因为专家系统的引入无疑会对其性能产生干扰。响应时间和事务处理易用性等因素在此非常相关，因为如果不充分考虑这些因素，就不能说该系统已投入生产。在这方面，也有必要考虑接口的功能完美性，以方便最终用户操作和处理全局系统。\n\
  \n## 系统维护\n\n维护一方面包括培训负责维护的人员，另一方面使系统具有灵活性以适应动态环境。当系统被翻译成与开发语言不同的语言以提高速度和可迁移性时，其灵活性会被牺牲。如果系统已经获取了工作领域内的所有知识，且这些知识在短期内不会被修改，这种情况是可以接受的。相反，如果设计专家系统仅仅是因为工作领域正在被修改，则必须在开发环境中维护系统，这将涉及持续的维护活动。\n\
  \n### 结论\n\n本文介绍了一种在不同领域经过验证的方法：医学、银行、公共管理、教学、工业、国防和立法；并用于执行不同的任务：监控、诊断、规划、解释、预测等。该方法应作为程序手册使用，作为执行整个过程的指南，而不是作为必须强制遵守的东西。换句话说，它必须被视为一种初始便利，而不是一种强加的条件。从这个角度来看，通过开发十多个专家系统所积累的经验，可以保证知识工程项目的成功。\n\
  \n最后，有必要指出，就知识工程而言，有一个重要项目由于明显的空间限制，此处（hic et nunc）将不再开发，那就是知识工程师的培训。然而，我们必须指出，仅仅精通专家系统的构建技术并不足以成为一名优秀的知识工程师；心理、人际和社交因素同样重要；大学对这些因素没有给予足够的关注；希望未来会发生变化。\n\
  \n## 参考文献\n\n1. H. Eco, “Intelectuales y Poder,” Diario 16, Madrid, (November 28,\
  \ 1986).\n2. D. Bell, “The Microelectronics Revolution,” in The Social Framework\
  \ of the Information Society, M.L. Dertouzos and J. Moses (Eds.), MIT Press, Cambridge,\
  \ MA, 1979.\n3. J.L. Maté and J. Pazos, Ingenieria del Conocimiento. Diseño y Construcción\
  \ de Sistemas Expertos, Sociedad para Estudios Pedagógicos Argentinos, Serie Inform\
  \ ática, Córdoba, Argentina, 1988.\n4. R. Fikes and T. Kehler, “The Role of Frame-Based\
  \ Representation in Reasoning,” ACM Comm. 28 (9) (1985).\n5. P. Harmon and D. King,\
  \ Expert Systems, John Wiley & Sons, New York, 1985.\n6. F. Nietzsche, Así habló\
  \ Zaratusta, Ed.\n\n\n\n\n机器翻译（MT）领域拥有一段长且动荡的历史。事实上，它是 20 世纪 40 年代为当时萌生的计算机科学领域提出的第一个非数值应用建议。在短短几年内，美国和欧洲组织了二十多个机器翻译项目。研发工作一直持续到\
  \ 20 世纪 60 年代初，当时人们发现，在当时的科技水平下，无法开发出高质量、全自动的翻译系统。这一认识导致了美国政府停止了对研究的支持，并标志着早期机器翻译范式的终结。20\
  \ 世纪 70 年代后期，机器翻译的研发工作显著加强，特别是在欧洲和日本。从那时起，机器翻译项目的数量持续增长。导致这一复兴的因素包括计算机硬件和软件质量的巨大提高、务实的预期，以及在理论语言学、计算语言学和人工智能（AI）等机器翻译至关重要的领域的进展。目前，机器翻译是一个充满活力的研发课题，在美国、日本和欧洲正被积极开展中。目前有许多关于机器翻译历史的优秀综述，特别是\
  \ Zarechnak [*1*] 尤其是 Hutchins [*2*]，后者详细地讨论了这一主题。关于该领域当前问题的更多描述，请参见 Nirenburg [*2a*]]。\n\
  \n# 机器翻译研究历史\n\n20 世纪 40 年代后期，机器翻译看起来是计算机技术的一种极具吸引力且可行的应用。这一观点得到了以下考虑的支撑。首先，在信息爆炸时代，翻译成为了一项非常重要的业务。像其他任何业务一样，自动化旨在旨在提高效率。其次，翻译是人类经常执行的共同任务。因此，任务的规范相对直接：潜在机器翻译系统的概念设计可以模仿人类执行翻译过程的组织进行建模。第三，词典查询可能占据翻译时间的很大一部分，但在使用在线词典时，这部分可以减少到忽略不计的水平。最后，世界大战期间密码学的巨大成功促使人们将其方法应用于其他领域。翻译确实可以被理解为一项破译任务（“当我看到一篇俄语文章时，我说：‘这实际上是用英语写的，但被用一些奇怪的符号加密了。我现在开始解码。’”）\
  \ [*3*]，这又是机器翻译发展的另一个动力。对可行性的考虑往往受到将翻译视为人类可以相对轻松完成的普通日常任务这一认知的影响。这就是 20 世纪 40 年代后期到\
  \ 20 世纪 60 年初机器翻译研究令人兴奋的发展依据。\n\n通常将所谓的“韦弗备忘录”（Weaver memorandum）视为机器翻译研究的起点。1949\
  \ 年，当时担任洛克菲勒基金会副主席的沃伦·韦弗（Warren Weaver）分发了 200 份信函，向一些对开发该技术感兴趣的人提出了机器翻译的概念。尽管这份备忘录主要是一份战略性文件，但其中讨论了几个重要的理论和方法论问题，包括语言单位的多义性、语言的逻辑基础、密码学的影响以及分析语言通用性（language\
  \ universais）的必要性。备忘录中的并非所有科学观点都是合适有效的（特别是整个密码学角度很快被证明是不可行的），但它引起了人们对机器翻译概念的科学和公众兴趣。1948\
  \ 年，由安德鲁·布斯（Andrew Booth）和理查德·里亨斯（Richard Richens）领导的伦敦大学团队是唯一进行机器翻译研究和实验的团队。在韦弗备忘录发布后的两年内，机器翻译工作在许多科学研究机构正式启动，包括麻理工学院、华盛顿大学、加州大学洛杉矶分校、国家标准局、乔治大学。\n\
  \n机器翻译的主要概念、主题和过程——如形态和句法分析、后编辑、语义表示、受限词汇、自动词典查找等——在当时首次被定义和讨论。第一次关于机器翻译的科学会议于 1952\
  \ 年在麻理工学院举行，第一次翻译程序的公开演示于 1954 年在乔治大学举行。乔治实验涉及将 49 句选自化学文献的俄语翻译成英语。词典包含约 250 个单词，俄语法仅由六条规则组成。不需要对源语言进行预编辑，且输出质量足够。公众和科学资助者认为这一实验是机器翻译可行性的有力证据。这一实验的广泛宣传也导致了美国以外机器翻译项目的建立，特别是在苏联。\n\
  \n整个 20 世纪 50 年代及之后的十年，机器翻译研究持续并增长。这一应用的需求为语言学以及后来被称为人工智能的学科提供了重要的理论发展动力。然而，实际翻译的质量仍然大部分处于接受水平以下，需要大量的后编辑，从以下这个\
  \ 1962 年 Georgetown GAT 系统的示例可以看出（译自俄语原文）：\n\n> 机器逻辑能力的首批实际应用之一是将其用于从一种语言翻译文本。语言差异代表了国家间文化、社会、政治和科学联系发展的严重障碍。翻译过程的自动化，即在没有相应外国语言知识的情况下实现翻译机器的应用，将是解决这一问题的重要一步措。\n\
  \n尽管如此，机器翻译研究人员对该领域的前景仍保持大部分乐观。“翻译机器，”埃米尔·德拉文内（Emile Delavenay）在 1960 年写道，“现在就在我们的门口了。为了让它工作起来，仍然需要完成对语言数据的探索。”当耶霍舒亚·巴希尔尔（Yehoshua\
  \ Bar Hillel）发表对当代机器翻译研究的批判 [*4*,*5*] 时，这属于少数意见。巴希尔尔的核心主张是，由于无法构建用于词义消歧的计算机程序，全自动高质量机器翻译是不可能的。他著名的例子是以下：\n\
  \n> 小约翰正在寻找他的玩具箱。最后，他找到了。盒子在围栏里（pen）。约翰非常开心。\n\n上面加粗句子中的“pen”一词至少有两个含义；写笔和游戏围栏。巴希尔尔的结论是，“任何现有或想象中的程序都无法让电子计算机确定给定上下文下句子中的单词\
  \ pen 具有上述第二种含义。”\n\n\n\n由于巴尔·希尔尔（Bar Hillel）是机器翻译（MT）的早期倡导者之一，对该领域的研究有深入了解，他的批评在对机器翻译的态度以及美国政府和工业界的赞助者中都产生了广泛共鸣。尽管在最初取得成功后，机器翻译研究面临的问题难度日益增加，而且当时的许多项目（特别是位于\
  \ `Georgetown` 和 `IBM` 的项目）追求的正是巴尔·希尔尔推荐的机器翻译研究类型，即机器翻译与人工后编辑相结合，但这种批评引发了对该领域态度的重新评估过程。这种重新评估在\
  \ 1966 年由美国国家科学院于 1964 年组织的具有影响力的自动语言处理咨询委员会发布的一份报告达到了顶峰。这份被广为人知的 `ALPAC`报告 [*6]\
  \ 对当时机器翻译的现状提出了批评意见，并建议大幅减少对机器翻译研究的支持。`ALPAC` 报告遭到了严厉（且恰当的）批评，指其具有偏见且不准确。然而，它的许多评估是正确的，特别是那些涉及机器翻译研究实用性的评估。回首过去，`ALPAC`\
  \ 产生的最大负面影响与其说是资金的减少，不如说是对机器翻译在美国作为科学事业的地位的损害。\n\n早期的机器翻译项目确实未能实现在广泛领域内构建高质量、全自动翻译系统的既定目标。然而，早期机器翻译工作者的主要错误在于判断：自然语言理解这一概念问题的复杂性被低估了。解决这一问题必须使用的知识的多样性和海量被证明是巨大的，以至于机器翻译作为一种应用的成功取决于这一问题的解决。机器翻译花费了十五十五时间才开始在科学上复兴。\n\
  \n虽然 `ALPAC` 报告有效地使美国的机器翻译计划陷入停滞，但在苏联、加拿大、德国、法国和意大利的一些科学小组，以及美国少数几个商业机构，研究和开发仍在继续。在\
  \ `ALPAC` 报告发布后的 15 年里，机器翻译的显著成就包括开发并日常使用首个毫无疑问成功的机器翻译系统 `TAUM-Meteo`，该系统由加拿大蒙特利尔大学开发，常用于将天气报告从英语翻译成法语。机器翻译程序\
  \ `Systran` 在 1975 年的“联盟号-阿波罗号”太空实验中被使用，并在次年正式被欧洲经济共同体（`EEC`）采用翻译工具。\n\n然而，机器翻译作为一门学科以及语言计算机技术应用的复兴，必须追溯到\
  \ `Eurotra` 项目的建立以及日本的机器翻译努力。`Eurotra` 起于 1978 年，是一个雄心勃勃且资金充足的项目，旨在为 `EEC` 的官方语言（丹语、荷兰语、英语、法语、德语、希腊语、意大利语、葡萄牙语和西班牙语）提供机器翻译能力。目前，`Eurotra`\
  \ 在多个国家小组和卢森堡项目总部雇用了约 160 名研究人员。日本新一代的机器翻译工作始于左右，得到了政府（特别是第五代计算机计划）和工业的支持。\n\n上述发展逐渐导致了美国机器翻译研究的复兴。1983\
  \ 年，国家科学基金会为机器翻译工作批准了一项研究经费（尽管金额很小），特别是`卡内基·梅隆大学`的`机器翻译中心`。机器翻译的重要性通过多次会议得到了强调，例如\
  \ 1987 年在日本举行的`Summit I`和 1989 年在西德举行的`Summit II`，这些会议吸引了来自全球的研究人员、用户和赞助者，学术界成员、政府机构和工业实体。机器翻译的氛围是乐观的，并意识到对机器翻译的需求比\
  \ 40 年前更加紧迫。这种新的乐观基于计算机技术的飞速进步（处理速度和内存容量的巨大改进、计算机架构的进步、数据库技术的出现、交互式环境）以及计算语言学的进步（特别是形态和句法分析技术）。意义自动处理进展和人机交互技术也是重要的组成部分。\n\
  \n## 机器翻译技术\n\n机器翻译的任务可以定义得非常简单：\n\n1. 获取一种语言（`SL`，代表 `sourcelanguage` 源语言）的文本并理解其含义\n\
  2. 生成另一种语言（`TL`，代表 `target language` 目标语言）的文本，使得`TL`文本的含义与`SL`文本的含义相同\n\n成功完成前者任务是后者的前提。因此，我们首先关注机器翻译工作的理解方面。在这一点上可以提出几个重要问题：\n\
  \n1. 人如何着提取文本的含义？\n2. 人如何表示文本的含义？\n3. 这种含义*究竟*是什么？\n4. 为了翻译，提取它（或至少提取*全部*）是必要的吗？\n\
  \n问题 3 是语言学和语言哲学中的一个基础问题。我们在这里甚至无法涵盖它的所有方面。我们必须采取一种更具操作性的方法来讨论机器翻译含义的问题。问题 2 涉及知识表示问题，无论是人工智能中的处理方式，还是在更传统的意义上（如词典编纂）。问题\
  \ 1 凸显了像机器翻译此类事业的计算问题。以上所有都是困难性问题，在计算语言学和人工智能的发展这一阶段，尚未给出确定性的解决方案。正是基于这一观点，人们必须解释问题\
  \ 4：是否存在一种可能，即特定应用领域（如机器翻译）的成功并不取决于产生上述问题的可行解决方案？本节的其余部分将专门讨论确定文本翻译所需的意义分析深度。\n\n\
  \n\n\n人类译员使用字典作为关于源语言（`SL`）和目标语言（`TL`）的信息来源。人类最常用的字典类型是双语词典，它包含了 `SL` 和 `TL` 的对应单元。从设计上讲，这种\
  \ `SL-TL` 映射旨在保留意义。而且由于意义是翻译过程中 `SL` 和 `TL` 文本之间的不变性，此类字典必须充分地满足这一目的。然而，需要记住的一个重要点是，我们所知的双语词典是为人类设计的。人类具有极强的能力来“理解”语言单元。这使得词典编纂的任务变得简单，因为不需要将意义的所有方面都绝对地列出来；人们即使面对有缺陷的解释也能理解。当字典被计算机程序使用时，情况就完全不同了。让我们来说在这种情况下所需的字典类型和处理模块。\n\
  \n## 构建机器翻译（MT）系统\n\n假设系统获取德语文本 (1) 输入。\n\n> (1) Das Buch liegt auf dem Tisch.\n\
  \n(1) 的英文翻译是 (2)。\n\n> (2) The book is on the table.\n\n执行此翻译所需的字典如下：\n\n| 德语 ||\
  \ 英语 |\n| --- | --- |\n| auf || on |\n| Buch || book |\n| das || the |\n| dem ||\
  \ the |\n| liegt || is |\n| Tisch || table |\n\n提供的翻译程序是逐个将英语单词替换为对应的德语单词。我们有 MT\
  \ 系统吗？是的，一个将德语句子 (1) 翻译成英语的机器翻译系统。事实上，只有在某些约束下，“liegen”应该翻译为“be”。我们可以使用同一个系统从英语翻译成德语吗？不能，因为从“the”到\
  \ `das` 和 `dem` 存在一对多的关系。我们在字典中记录的知识不足以解决这种歧义，我们没有额外的知识来帮助做出正确的选择。这是我们第一次观察到 `MT`\
  \ 研究可以被视为积累知识的过程，有助于做出正确的输出选择。现在，要将 (2) 翻译成俄语，我们需要如下字典：\n\n| 英语 || a |\n| --- |\
  \ --- |\n| a || # |\n| book || kniga |\n| is || # |\n| on || na |\n| table || stole\
  \ |\n| the || # |\n\n因此，句子 (2) 将被翻译为俄语 (3)。\n\n> (3) Kniga na stole.\n\n有趣的是，(3)\
  \ 也是 (4) 的翻译：\n\n> (4) The book is on a table.\n\n上述内容以一种出乎意料的方式表明，冠词在英语中没有意义。这当然不是事实。我们稍后会回到冠词如何影响翻译的问题。还要注意，俄语单词“stole”实际上是\
  \ 10 个不同单词之一（对应不同的格和数值），这些单词在实际文本中意义上会对应于表示“家具”含义的英语单词“table”。然而，我们在这里不会讨论形态分析。形态分析器已经为许多语言建立起来，包括像希伯来语或芬兰语这样形态变化丰富的语言。\n\
  \n再次，我们可以看到，使用同一个词典将 (3) 反向翻译成英语是不可能的。没有指示表明在什么地方（如果有的话）将俄语中对应于零字符串的单词放在哪里。这个例子说明必须向系统中引入更多知识。例如，类名词在英语句子中使用单数形式时，前面必须有一个冠词（a,\
  \ the）、指示词（this, that...）、所有主代词（例如 my, their）、疑问词（例如 what, which, whose）或数量词 one。这是关于英语语法知识的一部分。\n\
  \n上述描述的知识和困难对于早期 `MT` 研究人员来说是众为人知的。他们应对这些问题的一种方法是建立所谓的“直译”翻译系统，这些系统是专门为特定的 `SL`\
  \ 和特定的 `TL` 设计的，并且其中对 `TL` 的分析实际上取决于 `TL` 是什么。大多数早期的 `MT` 系统都是直译的，1970 年代的大型生产级系统（如\
  \ `Systran` 或 `Spanam`）也是基于这一原理构建的。它们运行的规则可以用来自 `Ramo-Wool-ridge` 俄英 `MT` 项目所用规则集的以下摘录为例（引用自\
  \ Hutchins，[*2*] 并为了方便理解进行了微调）：\n\n```\n如果在 SL 文本中，单词 `DO` 在任何句子中位于 `OT` 后八个单词内，将俄语\
  \ `OT` 翻译为英语 `FROM`，将俄语 `DO` 翻译为英语 `TO`\n\n如果在 SL 文本中 `ZA` 后面跟着一个符号，将其翻译为英语 `PER`，否则翻译为\
  \ `FOR` 或 `DURING`\n\n翻译俄语 `NET` 执行以下操作：如果 `OF` 插入到 TL 中位于 `NET` 之前或之后词块开头的潜在格之前，抑制\
  \ `NET` 的英语等价词并用 `THERE IS NO` 替换 `OF`\n```\n\n通常，直译系统中的处理如图图 1 所示。\n\n![图 1.](img/pg195_Image_161.jpg)\n\
  \n图 1.\n\n在高级直译系统中，处理过程通常被分为许多顺序步骤，其中大多数是特定语言的。以下是 `Systran` 翻译 `SL` 句子时使用的过程集：\n\
  \n1. SL 单词的形态分析\n2. 基于词法类别解决同形异义\n3. 检测复合名词（例如，错误消息）\n4. 识别名词组和其他短语的边界\n5. 识别短语内部依赖关系（一致、支配、并列）\n\
  6. 识别连词（包括标点符号）和并列短语（例如，为了确定像“old men and women”这样的短语中是两个名词，而形容词修饰整个连词，而不只是名词“men”）\n\
  7. 识别句子的功能结构，主要是主语和谓语\n8. 介词短语分析\n9. 习语翻译\n10. 介词翻译\n11. 使用主双语词典中的信息解决剩余翻译歧义\n12.\
  \ 剩余词汇单元翻译\n13. 语序重排\n\n上述过程使用了早期示例未涉及语法知识，特别是词法类别知识。然而，与早期 MT 系统不同，我们现在可以在生成语法的理论框架内推导出\
  \ SL 文本的语法结构。(5) 的语法结构知识帮助我们决定“coach”是名词还是动词，“lost”是动词还是形容词，“set”是名词、动词还是形容词。英语语法的知识足以消除这种\
  \ 12 重歧义并选择正确的解读。这种类型的知识记录在现代 MT 系统的 `SL` “语法”中。一个特殊的处理单元（语法解析器）将这种知识应用于输入文本并产生其语法结构。现在词典可以为\
  \ SL 单词的每个不同语法解读设置单独的条目（因此，“set”将作为三个条目的头部，分别对应该词的名词、形容词和动词的语法含义）。\n\n> (5) 教练输掉了一局。\n\
  \n\n\n\n\n随着表示自然语言句子句法结构的生成语法方法的发展，机器翻译（MT）研究人员清楚地，这种分析最好仅基于源语言（SL）信息进行，而无需参考特定的目标语言（TL）。机器翻译系统的架构发生了变化，所谓的`transfer`转换方法取代了直接翻译范式。典型的转换机器翻译系统的架构如图图\
  \ 2 所示。转换范式的翻译过程由三个阶段组成：\n\n![FIGURE 2.](img/pg196_Image_162.jpg)\n\n图 2.\n\n* \
  \  源语言文本分析\n*   源语言—目标语言转换\n*   目标语言文本合成\n\n在第一阶段，对源语言文本进行分析，通常是形态和句法上的分析，不参考任何特定的目标语言。源语言语法作为主要的知识来源。该阶段的结果通常是输入文本中句子的句法结构，通常以树的形式表示。图\
  \ 3 显示了用于表示(5)句法分析结果的一些树形结构。\n\n![FIGURE 3.](img/pg197_Image_163.jpg)\n\n图 3.\n\n\
  分析结果消除了源语言文本的歧义，使得转换阶段机制更容易将源语言的词汇单元和句法结构替换为目标语言中的对应项。转换过程依赖于存储在双语源—目标字典以及包含特定源—目标对句法结构对应数据的特殊转换语法。最后，目标语言合成阶段本质上负责根据目标语言语法规则将转换后的目标语言树线性化。\n\
  \n遗憾的是，在某些情况下，句法知识不足以消除歧义。因此，纯从句法角度无法确定(6a)中的连词连接的是两个名词，还是一个名词和一个被形容词修饰的名词（即：桌是白色的，还是椅子也是白色的）。注意，不能忽略提取这类知识，因为潜在翻译的形式可能取决于意图含义。因此，(6a)翻译成希伯来语时可能是(6b)或(6c)。\n\
  \n> (6a) White tables and chairs\n>\n>  (b) Shulhanot levanim vekisaot: (white tables)\
  \ and (chairs)\n>\n> (c) Shulhanot vekisaot levanim: White (tables) and (chairs)\n\
  \n句法知识无法处理的其他类型歧义还包括介词短语的附着以及英语中名词-名词复合词的分解。\n\n自然语言常见的词汇-语义歧义为句法分析在机器翻译中的不足提供了更深刻的证据。例如，在标准的英俄字典中(5)中的单词“coach”、“lose”和“set”在句法分析检测到的正确句法含义下，分别有\
  \ 6、10 和 34 种解释。\n\n### 词汇-语义歧义分析\n\n| 单词 | 解释 |\n| :--- | :--- |\n| coach | 6 |\n\
  | lose | 10 |\n| set | 34 |\n\n### 中间语言方法\n\n人工智能中使用的符号足够丰富，被称为语义。在人工智能中，它们被称为知识表示语言；在机器翻译中，它们传统上被称为`interlinguae`（中间语言）。如果机器翻译系统的分析模块能够产生一种独立于自然语言的中间语言（`IL`）源语言文本表示，并且该系统的合成模块可以将此\
  \ IL 文本作为输入并生成目标语言文本，那么就可以避免机器翻译过程中的转换阶段。此外，双语字典将变得多余，因为一旦从特定输入生成了 IL 文本，它就可以用于生成任意数量目标语言的文本，从而促进多语言机器翻译。由于不需要为每对源/目标语言编写双语字典和转换语法，而仅为每种自然语言两个字典（一个用于源语言-中间语言翻译，另一个用于中间语言-目标语言翻译），从而极大地节省了精力。\n\
  \n\n\n\n\n# 图 4. (a) 转换法：`N(N-l)` 个过程。(b) 中间语言法：`2N` 个过程。对于 `N = 72`，转换 = `5,112`，中间语言\
  \ = `144` 个过程。\n\n通常情况下，中间语言法可以被视为转换法的逻辑扩展，在这种情况下，转换阶段的“长度”缩减成了一个点（参见图 5）。\n\n![图\
  \ 5.](img/pg200_Image_165.jpg)\n\n图 5.\n\n机器翻译（MT）研究人员很早就理解了中间语言法在机器翻译中的优势。然而，对源语言（SL）文本进行语义解释的任务对于早期的机器翻译尝试来说过于困难了。使用语义分析（即在机器翻译中使用知识表示语言）的早期尝试之一是在耶尔\
  \ AI 学派内部进行的。概念依赖知识表示语言 [例如, 7] 被用于表示输入句的含义。该学派建立的实验性机器翻译系统利用世界背景知识来推断输入句中未明确的信息，以便消除歧义。这些背景知识通常描述典型的复杂事件序列，被称为“脚本”（scripts），这些脚本在某些子世界中很常见。因此，由于\
  \ (5) 中描述的事件属于 `TENNIS script` 这一知识，通过为单词“coach”和“set”提供合适的解读，有助于完全消除该句的歧义。一旦输入句的含义在中间语言中表示出来，借助脚本并使用概念依赖，系统的生成阶段将一组判别网（通过特定的语义知识单元标记选择点），将中间语言含义与目标语言（TL）单词及短语连接起来。\n\
  \n从示意图上看，这类系统的翻译过程可以如下所示[我们使用文献 8 中的示例]。假设句子 (9) 已作为输入提供给翻译程序。该句子将被将被分析（翻译为概念依赖语言）为\
  \ (10)。分析器将使用的字典会将英语动词“hit”与一个“框架”连接起来，该框架中有一个“动作”槽位，由标记 `PROPEL` 占据（不应解释为英语单词！）以及一个“力”槽位，由标记\
  \ `ABOVE-AVERAGE` 填充。“施者”、“宾语”和“工具”槽位将列在字典中但不包含填充内容。分析器的责任是使用从字典获取的“hit”表示作为核心，为新事件创建一个中间语言结构，并为未空的槽位寻找填充物。系统使用脚本和其他背景知识主要为了识别这些槽位填充物。\n\
  \n*   (9) Mary 击中了 John。\n*   (10) (event EV001\n    *   (action PROPEL)\n    *\
  \   (agent MARY)\n    *   (object JOHN)\n    *   (instrument *UNKNOWN*)\n    * \
  \  (force * ABOVE-AVERAGE*)\n    *   (intentionality *POSITIVE*))\n\n为了将 (10) 翻译成西班牙语，必须使用如图\
  \ 6 所示的判别网。目标是选择合适的动词来在西班牙语中表达中间语言动作 `PROPEL`。![图 6.](img/pg201_Image_166.jpg)\n\
