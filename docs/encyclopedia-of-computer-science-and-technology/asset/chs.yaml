  \ |\n\n会议涵盖了以下领域的邀请演讲和投稿演讲：\n\n* 主题 1：不确定动力学系统的控制，被忽略的动力学\n* 主题 2：量子力学过程的控制与非线性滤波\n\
  * 主题 3：生物系统的模型与控制策略\n* 主题 4：经济和社会系统的模型与控制策略\n\n主旨演讲为加利福尼亚大学伯克利分校的 G. Leitmann 教授和马萨诸理工学院的\
  \ S. K. Mitter 教授。\n\n现在，让我们简要概述上述主题所确定的主要科学方向。\n\n### 主题 1\n\n\n\n\n\n“真实”世界中的许多系统都需要人类的干预和控制。为实现预期目标制定控制策略或方案，第一步是对所感知到的实际（物理、化学、工程、生物、经济等）系统的显著特征进行抽象。这种抽象通常体现在`数学模型`中，例如常微分方程、有限差分方程、偏微分方程等。数学模型总是是`不确定的`，这部分是因为它们是涉及未知或部分已知元素的近似，另一部分是因为它们包含了模拟现实世界中不确定效应的元素。\n\
  \n处理此类不确定数学模型的系统分析人员，有两种途径可用：`统计方法`和`确定性方法`。在程序中，重点是后者。\n\n研究的问题包括：\n1. 不确定动力系统的控制\n\
  2. 被忽略的动力学\n3. 被忽略的传感器/执行器\n4. 包含“快速”和“缓慢”动力学的不确定系统\n5. 混沌系统\n6. 鲁棒控制\n7. 模糊系统\n\
  \n## 主题 2\n\n量子力学控制系统是一种将时变部分视为扰动的量子力学系统。可以在上面研究不同类型的问题：可以将时变部分视为从系统测量中提取的信号。这就是`“量子”滤波问题`，通常与`非破坏测量`概念相关。此外，时变部分也可以被视为对系统的有目的控制，即严格意义上的`控制问题`。\n\
  \n量子力学控制理论是从量子物理迈向量子技术道路上至关重要的一步。\n\n研究的问题包括：\n* 非线性滤波数学问题与量子物理之间的类比\n* 随机变分法与量子力学\n\
  * 随机力学\n* Bernstein-Jamison 意义上的随机倒易过程\n* 非破坏性滤波\n* 量子过程的控制\n\n## 主题 3\n\n从 20 世纪\
  \ 60 年代年代开始，贝尔曼（Bellman）意识到许多生物系统表现出与他所关注的决策过程相似的特征。随后，他将才华投入到开发这些系统的模型和控制策略中。在该领域发表了许多优秀论文，并被认为是将数学和计算机科学引入医学领域的先驱之一。他最初的动力是癌症问题；细胞的控制机制为何会突然失效仍然是一个谜团。\n\
  \n主题 3 顺着贝尔曼这部分工作的思路展开。在细胞层面及其内部量子过程的层面上，该主题与主题 2 密切相关。\n\n研究的问题包括：\n将系统分析方法、控制理论和仿真方法应用于生物和医学领域，例如：\n\
  * 肿瘤生长与治疗的建模与仿真方面\n* 控制理论在化疗和放射治疗中的应用\n* 脉冲控制理论在皮注射的应用\n* 心脏病识别\n* 激动剂—拮抗剂对调节的数学模型\n\
  \n## 主题 4\n\n系统数学理论的应用领域之一是数学经济学、计量经济学、社会科学和管理科学交叉领域。在主题 4 的许多问题中，以下列表并非详尽：\n* 微分博弈方法\n\
  * 生存理论\n* 合作、竞争、威胁策略、动态联盟理论\n* 无限域优化\n* 脉冲控制的理论与应用\n* 经济学中的最优周期\n\n程序中两个并行场的讲座列表如下：\n\
