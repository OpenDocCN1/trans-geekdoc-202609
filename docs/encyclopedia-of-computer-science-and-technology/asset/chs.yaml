  \ IRIS 中，这样单个函数就不承担该责任。这将减少实现外部函数所需的工作，并且预计会增加可调用操作的灵活性。\n\n## IRIS OSQL 与图形编辑器\n\
  \nBeech [13] 列出了选择 SQL 作为基础语言而非创建新语言的几个理由。OSQL 设计者认为，在已经存在合适基础的情况下，从零开始既是“社会不负责任”的，是不明智的，因为实现新语言的许多问题已经得到解决。嵌入\
  \ SQL 的做法也意味着用于主机语言访问的预处理器也已经可用。最后，正如 Lyngbaek 和 Vianu [17] 已经确定的，关系数据库与 IRIS 之间的关系是重大的，SQL\
  \ 接口只会鼓励这一研究方向。\n\nSQL 中一个为 OSQL 所修改的一个关键元素是 `FROM` 子句。在 SQL 中 `FROM` 将将变量绑定到表，识别要搜索的表并建立变量名称的作用范围。由于\
  \ OSQL 访问的是类型的实例而非表，`FROM` 的语义具有误导性。相反，OSQL 使用 `FOR EACH`，例如：\n\n```sql\nSELECT\
  \ NAME, ADDRESS\nFOR EACH SUPPLIER\n```\n\n\n\n\n- `WHERE CITY = ‘Palo Alto’;`\n\
  \n此外，人们也可以检索整个对象并将其绑定到变量上，这与 SQL 中分别每个字段每个值的操作相反。\n\n在 OSQL 中创建对象与 SQL 中创建元组相似，因为就像在\
  \ SQL 中必须先创建一个表然后识别一个出现项一样，在 OSQL 中，你先创建一个类型，然后定义一个实例。例如：\n\n```sql\nCREATE TYPE\
  \ STUDENT SUBTYPE OF PERSON\n(SID CHAR(6) REQUIRED,\nCLASS_YEAR CHAR(2),\nQPA REAL,\n\
  MAJOR DEPARTMENT,\nADVISOR FACULTY\n);\n```\n\n由于 `STUDENT` 现在继承了 `PERSON` 的所有功能，诸如\
  \ `NAME`、`ADDRESS` 和 `PHONE` 等属性也将内置到 `STUDENT` 类型中。请注意，`MAJOR` 和 `ADVISOR` 的类型是对其他对象类型的引用，因此访问顾问信息将返回顾问对象，而不仅仅是名称。\n\
  \n在 `CREATE` 语句中列出的对象属性在面向对象的术语中是隐式存储函数，但 IRIS 实际上生成了一个与类型定义对应的表。派生函数（也称为意图函数）通过\
  \ `CREATE FUNCTION` 语句设置。为了生成一个部门的学生和顾问列表，`CREATE FUNCTION` 看起来如下：\n\n```sql\nCREATE\
  \ FUNCTION STUDENTADVISOR\n(DEPARTMENT D) —> SET OF <CHAR(20),CHAR(20)>\nSELECT\
  \ NAME(S), NAME(ADVISOR(S))\nFOR EACH STUDENTS\nWHERE DEPARTMENT(S) = D;\n```\n\n\
  ### IRIS 作为全局数据管理器 (GDM)\n\n由于其具有外部函数功能，IRIS 还可以用作对象管理器来整合来自许多源的数据，包括单独的服务器。例来说，想象一组已经以某种预先建立的格式存储在磁盘上的文档集合。可以为这些文档定义一个对象类，其方法\
  \ `protocol` 是 IRIS 外部函数，能够呈现、删除和修改这种文本格式。然后创建此类此类型的 IRIS 对象，这些对象仅包含激活相应函数的方法所需的参数。访问该对象的用户将将其仅仅视为另一个\
  \ IRIS 对象，而原始的存储位置和格式不需要更改。\n\n这种将 IRIS 作为全局数据管理器的使用方法强调了整合外部函数的优势。人们可以很容易想象，能够“创建”由许多存在于远程位置且格式不一致的个体对象组成的新对象，这些对象可能包含某种方式即时计算或响应系统实时条件的信息。最重要的是，所有这一切在完成时，允许源对象保持自主性，而不必强制满足针对其数据或模式的某些任意\
  \ IRIS 格式要求。\n\n### ORION—MCC\n\nORION 的产生源于 MCC 在多媒体数据库和多版本 CAD 系统上进行的工作。目前的实现是一个用\
  \ CommonLISP 编写的单用户系统，在 Symbolics 3600 LISP 机器上开发，并被移植到 Sun 工作站的 Unix 上。作为一个研究平台，ORION\
  \ 为详细研究面向对象数据库实现在某些领域的特定挑战提供了机会，例如事务管理、多媒体数据管理、复合对象语义、动态模式演变和访问授权策略。\n\n#### ORION\
  \ 中的对象\n\nORION 构建在了一个显式静态关系或方法的库之上；数据定义以属性列表的形式呈现，而不是操作声明。现有的文献中没有讨论在 ORION 中除了简单的查询规范级别之外，如何实现新方法。可用于构建对象定义的属性要么是集合（set）或是标量（scalar），并且必须是原始类类型（字符、整数、字符串）或是某个类的定义域（例如，`PERSON`）。类是具有相同类型定义的对象的分组，定义在类格中；类类格是一个有根的有向无环图，其中\
  \ `OBJECT` 是根类。类的某些属性可能是共享值属性，其所有成员具有相同的值，且对变量的更改会反映在该类的每个对象上。其他属性可以被声明为默认值变量，每个对象在开始时具有相同的值，但更改仅对局部变量可见。\n\
  \n类内部的类型并不一定是强类型。一个属性可能属于父类定义域，因此可以使用任何子类来填充该槽位。例如，如果 `PartID` 被定义为 `PRIMITIVE`\
  \ 类型，那么它的值类型可以是整数、字符、字符串或其他 `PRIMITIVE` 类型。类型为 `PERSON` 的属性可以持有作为 `STUDENT`、`EMPLOYEE`、`MANAGER`、`TAXPAYER`\
  \ 或 `CONGRESSMAN` 的对象标识符的值。虽然类可以是多个类的子类并继承自所有父类，但一个实例（对象）可能只属于一个类。这是一个性能上的决策，允许实现在呈现对象时不必遵循多继承路径。\n\
  \n#### 访问对象\n\nORION 的语言在文献中没有充分讨论，但它们似乎基于 LISP 格式。定义类的格式如下：\n\n```lisp\n(make-class\
  \ 'Vehicle: superclasses nil\n    :attributes '(\n        (Manufacturer: domain\
  \ Company)\n        (Body: domain AutoBody\n            :composite true\n      \
  \      :exclusive true\n            :dependent nil)\n        (Drivetrain: domain\
  \ AutoDrivetrain\n            :composite true\n            :exclusive true\n   \
  \         :dependent nil)\n    etc.))\n```\n\n查询也类似于 LISP 语句，例如：\n\n```lisp\n(select\
  \ 'Vehicle '(and(equal Manufacturer “Ford”)\n    (< Owner Age 20)).\n```\n\n前端完全可能是\
  \ CommonLISP 编写的函数集合，因此 ORION 目前没有自己的语言。一种图形模式编辑器已经开发出来，但目前还没有对其进行讨论。\n\n#### ORION\
  \ 的架构\n\nORION 的整体架构由四个基本模块组成。消息处理器负责根据消息和参数（实际上是谓词和参数）调用方法。方法可以是用于元数据操作系统定义函数（如创建和删除实例）、从声明的属性中检索数据的取访问方法，或者是用户定义的方法。\n\
  \n第二个模块是对象系统，它控制模式演变、版本控制、查询优化和多媒体信息管理。其中大多数主题将在以后进行更详细的讨论，但在这里谈一下查询优化是合适的。\n\n\
  复合查询提供了几种替代的检索策略。一种基本的划分是从类开始并找到匹配查询的所有实例的策略（正向遍历），与从某些属性值的实例开始并向上遍历以建立类成员身份的策略（反向遍历）。在面向对象的数据库中，不恰的策略选择会严重降低检索效率。在\
  \ ORION 中，查询优化器的基本工作是知道何时使用何种策略，以及如何结合它们以获得最佳结果。\n\n\n\n\nORION 架构的第三模块是存储子系统。在该模块中，维护磁盘空间的分配与释放，在磁盘页上查找对象，并实现索引。在磁盘上，一个对象看起来像是属性的集合，这些属性可能是原始数据值、指向其他对象的指针或多媒体数据描述符。多媒体数据描述符是指向多媒体记录的指针，这些记录是大型文本、位图或其他字节流，存储在介质的其他位置，由多媒体空闲列表维护的区域。\n\
  \n最后一个模块是事务子系统。该子系统的部分包括一个处理锁表的并发管理器，以及一个保存事务日志的恢复管理器。近年来，这些一直是 ORION 中研究得最仔细的功能之一。对于关系型数据库，有大量关于并发和恢复的形式化文献，而这在面向对象的系统中简单说是不缺的。ORION\
  \ 团队花费了大量精力尝试进行这种形式化，首先是在 ORION 之上构建一个关系类型的锁定和日志系统，并对其进行开发，以更适合面向对象的环境中运行。诸如多继承类（晶格）和版本控制等问题凸显了两种数据库模型之间的差异。\n\
  \n![图 2. ORION 架构。](img/pg297_Image_203.jpg)\n\n图 2. ORION 架构。\n\n### ORION 中的事务\n\
  \n尽管 ORION 被呈现为一个单用户系统，但它允许在同一个会话中使用多个会话和多个窗口。这些功能需要一个完整的并发管理系统。ORION 使用基于超时的锁定系统，在该系统下，任何当前正在等待读或写锁的事务将要么在规定时间内获得锁，要么被中止并回滚。每当事务提交或中止时，所有的锁都会释放。\n\
  \n为了锁定任何指定对象，必须考虑三种粒度的路径。首先，必须对对象的类成员层级加加针对 `READ` 或 `WRITE` 操作的 `INTENT` 锁。其次，对象的任何属性的索引必须被锁定，或者更准确地说，至少要锁定受操作影响的那些索引页。最后，作为复合对象成员的对象必须锁定它们所属的簇。ORION\
  \ 将复合对象视为单个的可锁定单元。\n\n根据对复合对象结构的最新修改，整个锁定系统已经经过重新评估 [*5*]。以前，一个对象只能属于一个复合对象，例如 `EngineBlockID`\
  \ 只能存在于 `Automobile` 的一个实例中。*5*] 修订支持了段落或零件图可能作为多个不同对象的组件的可能性，这在 CAD 和 OIS 应用中很常见。这主要通过扩展锁定矩阵来实现，以区分具有专属成员对象的复合对象和具有共享成员的复合对象。\n\
  \n会话被描述为一组串行执行的事务，但没有任何固定的顺序，因此每个会话只有一个活动事务。会话背后的推理是，在 CAD 应用中需要一种长事务模型，而 ORION\
  \ 组希望能够支持原子事务与活动集之间的区别，以便他们能够实现长事务模块。多个窗口允许用户在当前事务等待锁时进行其他处理。由于多个窗口都查看同一个会话，用户可以访问到与当前等待的事务相同的锁。\n\
  \n数据在提交后立即写入磁盘，因此一个 `UNDO` 日志就足够用于数据恢复；事务要么提交，要么不提交。无论何种情况，不完整的数据都不会出现在数据库中。假设性事务是指允许访问数据（仅获取读锁）但在提交时不进行任何更新的事务。“如果……？”场景是假设性锁的一种用途，因为为了回答查询，可能似乎对数据库进行了大量更改，但这些更新最终都不会反映在持久对象存储器中。\n\
  \n### ORION 中的版本\n\nORION 通过一个层次的对象版本状态层级系统支持对象的多个版本：瞬态版本（transient）、工作版本（working）和通用版本（generic）。当用户访问一个对象时，会从对象的单个通用版本或指定的工作版本创建一个瞬态版本。对于任何给定的对象，只有一个通用版本，它是层级结构的根。它是一个数据结构，包含一个默认版本号、下一个版本号、当前工作版本的计数以及一组用于工作版本的版本描述符。每个版本描述符包含一个版本号、被版本化对象的\
  \ `id` 以及一个指向子版本的描述符列表。版本的绑定可以是静态的（指向对象 id 和版本号），也可以是动态的（指向通用版本，而通用版本再引用默认版本号）。瞬态版本可以被更新并可以被提升为工作版本。工作版本不能更新，只能删除。任何工作版本都可能被通用版本指向为当前默认版本。同一工作版本的瞬态版本修改之间的冲突通过更改通知和更改批准时间戳的双时间戳系统来解决。\n\
  \n### ORION 中的多媒体信息\n\nORION 将一维和二维数据都作为长字节字符串处理，通过适当的显示方法进行访问。如上述，ORION 将多媒体数据存储在与其结构分离的二级内存空间中。假设性，不需要重大更改将\
  \ ORION 的多媒体能力应用到存储在非 ORION 维护区域的现有数据。ORION 对多媒体数据的视图是一个多媒体记录描述符。描述符拥有所有的访问方法，存储物理磁盘位置，并作为日志的单元。对多媒体数据进行的更改被视为分配新的存储空间或删除之前分配的空间，因此修改在\
  \ ORION 中仅表现为描述符中的新指针和空闲链的重组。\n\n大多数标准显示设备和存储的多媒体对象类型的访问方法已经包含在 ORION 中。产生的消息传递协议直接从磁盘生成显示程序的开放字节流，减少了从存储到主内存的数据拷贝。表示显示设备的对象层级和显示对象类型的层级为引入新数据类型或新硬件提供了扩展空间。\n\
  \n#### 来自 Servio-Logic 的 GemStone 和 OPAL\n\nServio-Logic 自 1983 年以来一直活跃于面向对象数据库的研究。他们从集合数据模型开始研究\
  \ [*9*]，但最终选择了在 Smalltalk-80 编程语言上构建 DBMS。产品 `GemStone` 及其编程语言 `OPAL` 是最早商用的 OODBMS\
  \ 之一 [25, 26, 27, 28*]。\n\n\n\n\n\nGemStone 的设计者在开发产品时心中有几个目标。其中首位的是**意图语义（intentional\
  \ semantics）**的概念。类型定义应与对象实例化分离，并应包含可能适用于定义类型实例的操作协议。这一概念通过与关系型数据库的对比得到了最好的说明：在关系型数据库中，模式（schema）在定义时就实例化了关系，且所有操作都在数据库级别（即关系代数）定义，而没有任何机制可以在关系上定义特定于类型的操作。在关系型数据库中，可用的操作不随表而变化；`join`、`project`\
  \ 和 `select` 被定义为在类型 `TABLE` 上执行的操作。无论每个元组代表 `STUDENT`、`AUTOMOBILE` 还是 `BANKTRANSACTION`\
  \ 的实例，可用的操作都是相同的。\n\n第二个主要目标是**实体标识性（entity identity）**，据此，代表任何实体的数据可以作为一个单元被引用。数据值可能会改变，某些值可能不存在，但对象的标识性将保持不变。两个不同的实体可能具有相同的值集合，这在工程环境中很常见，例如，两个门可能具有相同的特性，但在功能上又完全不同。通过实体标识性，复合项可以被支持且非常灵活，结构可以发生任意变化。这导致了比传统数据库模型允许的更强大的数据建模；对象能够更好地模拟现实世界的关系和变化。\n\
  \n其他目标是基于对现有面向对象编程环境（如 `Smalltalk-80`）的改进。他们的系统应该避免对模式和数据项的任意（主内存）限制。随着持久性数据的引入，应该提供历史状态的显式存储，以及\
  \ DBMS 的标准功能：事务管理、并发控制、恢复能力和权限控制。\n\n最后，`OPAL` 的设计旨在提供一种单一语言，能够管理辅助存储、提供通用计算服务，并尽可能透明的系统命令语言。借鉴\
  \ `Smalltalk-80`，他们从一种非常适合快速原型制作的语言和一组作为系统控制基础的硬件对象定义开始。\n\n### GemStone 的结构\n\n\
  GemStone 与 `Smalltalk` 一样，基于对象、消息和类这三个概念。对象被定义为具有公共接口的私有内存：引用其他对象的实例变量，以及呈现和操作私有持有值的方法。对象作为某些\
  \ `class` 的实例被创建。类是层次化的，源自根类 `Object`。`Smalltalk` 或 `GemStone` 中均不允许多继承。\n\n方法通过对象之间的消息传递来调用。方法用\
  \ `OPAL` 编写，并通过继承附加到类，从而附加到对象。`OPAL` 的消息格式为：\n\n```\n> <receiver> <message>\n```\n\
  \n其中 `<message>` 的内容将某些方法名和一组可选参数。大多数消息返回某些对象，并可能可能不改变接收者的私有数据。根据参数格式，消息分为一元、二元和关键字。一元消息是一个无参数列表并作用于对象的操作，例如：\n\
  \n```\n> 4 negated\n```\n\n它将返回值 `-4`。二元操作通常是算术运算符或比较操作符：\n\n```\n> 8 + 3\n> 3 <\
  \ 5\n> empl salary < emp2 salary (注意: salary 是一元的, < 是二元的)\n```\n\n关键字运算符具有特殊的参数列表，其中参数名出现在实际参数之前：\n\
  \n```\n> an Array at 3 put: ‘Ross’ (selector is ‘at:put:’).\n```\n\n这将单词 ‘Ross’\
  \ 放入数据结构 `anArray` 的第三位置。\n\n表面上，`OPAL` 与 `Smalltalk` 非常为相似。这种相似性在 GemStone 两部分架构的\
  \ `Executor` 级别得以保持。`Executor` 控制 `GemStone` 中的会话，处理 `GemStone` 与任何主机软件之间的通信，并为每个活动用户管理编译器和解释器。方法被编译成字节码序列，当\
  \ `Executor` 被调用执行时会激活这些序列。\n\nGemStone 架构的第二层是 `object manager`，它的功能与 `Smalltalk`\
  \ 对象内存相同，但在大得规模上运行。辅助存储管理的额外开销和并发访问的处理显著扩展了 `object manager` 的角色。这加上潜在巨大的对象列表（`2³¹`\
  \ 个对象）和虚拟无限制的对象大小（`2³¹` 个实例变量）带来的问题，尖锐地区分了这两个对象处理系统。\n\n在 `object manager` 的实现下，对象五五基本存储格式：自标识（原始类型；`Character`、`SmallInt`、`Boolean`\
  \ 等）、字节（例如 `String`、`Float`）、命名（持有对象 ID 的实例变量）、索引（数组）和不可序列化集合（集合）。尽管类定义了对象结构，但类本身并不是数据访问结构。通常，如果想要对对象的实际分组，必须显式地生成一个包或\
  \ `set`。作为给定类型的不可序列化集合，此类组可以在类变量上建立索引。子类的实例和主类的实例都包含在 `OPAL` 索引中。维护依赖列表确保更新和并发控制适用于索引以及数据对象。\n\
  \n除了对象元素名称和值外，对象还存储了时间戳以适应版本控制。`GemStone` 使用乐观并发控制策略，在该策略下，只有在事务提交后更改对其他会话可见。数据的影子（Shadowing）将版本和并发问题结合在一起。当数据被修改时，会创建一个影子对象。当提交发生时，影子对象变为主体，新的对象指针和时间戳被添加到相应的列表中。\n\
  \n每个 `GemStone` 用户都有一个已知对象的字典列表。任何用户都可以访问这些字典中的几个，且字典可以在用户之间共享。授权通过用户名和密码处理。用户可以被授权以只读权限访问一组对象、读写权限，或者完全不给予访问。\n\
  \n### 分布式 GemStone\n\n`GemStone` 可以被设置为工作站网络的中心化服务器。方法既可以在服务器上执行（在持久性存储中操作 `GemStone`\
  \ 对象），也可以在客户端工作站上作为 `Smalltalk` 对象的执行。这两种方法执行形式被称为代理（proxies）和代理人（deputies）。系统设计者选择哪一种并不总是容易的决定。进程对对象的竞争、可用带宽以及机器之间的相对执行速度等因素都必须考虑在内。但在任何情况下，持久性存储都不会分布到中心化\
  \ `GemStone` 服务器控制的任何存储中。\n\n\n\n\nOPAL 是一种用于 GemStone 的通用、统一语言。在它中，可以定义数据（`DDL`）、访问和更新数据（`DML`）、编写扩展事务，并可以使用操作系统的实用程序。分布式系统通常需要访问其他语言。为了满足这一需求，GemStone\
  \ 提供了过程化接口模块（`PIM`），用于实现从 `C` 或 `Pascal` 到 GemStone 的远程过程调用。它围绕 `OOP`（面向对象的指针）的通用数据类型和固定长度无类型的缓冲区构建，可以从过程化语言向\
  \ GemStone 发调用，并通过缓冲区返回对象的内容。Servio 通过将 GemStone 与运行 Microsoft Windows 的远程 PC 连接，成功测试了他们的系统。\n\
  \n## 三种 C++ 数据库\n\n*R2D2: 卡尔斯鲁大学与 IBM。* `R2D2` 源自卡尔斯鲁大学和位于海德堡的 IBM 科学中心。它是 `AIM-P`\
  \ 项目中对 `NF2`（非第一规范范式）数据模型工作的延续。`R2D2` 背后的目标是一个工程数据库系统，因此工程系统的一些特殊需求反映在它的设计中 `*29*,*30*]`。\n\
  \n`R2D2` 的设计者目标是一个能够结合结构性和行为面向对象系统优势系统。在他们的术语中，结构面向对象数据库是指维护层次定义和复合单元复杂结构的数据库。另一方面，行为面向对象数据库是指那些通过公共访问函数隐藏结构的数据库。它们通常更面向用户或应用程序，对存储结构的关注较少。通过在结构面向对象数据库\
  \ `AIM-P` 之上构建功能性数据库语言，`R2D2` 组证明了两种方法可以相互补充。\n\n`NF2` 关系允许属性拥有其他关系的值，从而允许在纯关系型设计中无法实现的复合结构。在\
  \ `AIM-P` 中，这些被实现为“微目录”的小对象，它们以独立对象的形式出现，由树指针组成，其中叶节点是指向外部数据记录的指针。系统同时支持表（记录的无序集）和\
  \ `Lists`（有序集）。有序记录集（也是一种非关系概念）使得复合结构成为可能。\n\n在 `R2D2` 中，目标是将 `AIM-P` 的结构元素与所有层面的行为元素集成：查询、事务/恢复管理、编程和存储。由于工程操作涉及非常大的对象，效率也是首要考虑的问题。为了实现高效的系统，设计者使用了带有本地缓存的客户端/服务器模型。对象作为完整单元从持有公共数据库的服务器模型中“检出”（checked\
  \ out）。从该点开始，对象对用户的应用程序可用，而无需返回服务器。经过更新的对象必须“检回”（checked in）到服务器以执行更新并确认一致性。读锁和写锁防止更新之间的冲突。\n\
  \n通过指定私有内部变量和访问函数列表来作为 `ADs` 创建对象。这些函数可以是多值的，接受参数列表并返回集合或向量。对数据的访问通过类似于 `SQL` 的查询语言或扩展的\
  \ `Pascal` 实现。`Pascal` 数据类型是用户可见的结构，因此每个获取的对象都必须从一种存储结构翻译为另一种存储结构。\n\n（注：原文后续存在大量重复的\
  \ `ADTs` 创建描述段落，根据指令“不要重复输出原文”的要求，此处仅保留核心逻辑翻译或进行代表性处理。）\n\n*Vbase: 现在的 OB2 来自 ONTOLOGIC\
  \ Inc。* `VBASE`（现以 `OB2` 提供）是来自 Ontologic 公司的具有持久存储功能的商业面向对象系统。它的根源于 `CLU` 语言，这是\
  \ MIT 对抽象数据类型（`ADTs`）的实现。因此，它的主要目标是过程化编程语言与强类型对象的高度集成。\n\n\n\n相比于 `Smalltalk` 等面向对象语言的非类型化，我们选择强类型是因为它在构建大型系统方面具有许多优势。首先，基于类型不兼容的错误检查可以在编译时进行，这使得调试更加容易，并使产品发布更加安全。这意味着，与其在运行时花费时间动态绑定方法，大多数绑定可以在编译时静态建立，从而提高程序运行速度。最后，带有固定类型的程序规范在大型系统中强制执行了一致性，而用户命名规范是无法做到的。\n\
  \n## VBASE 中的对象\n\n`VBASE` 中的对象由一种`类型定义语言`（`TDL`）定义，该语言与 `Pascal` 或 `Algol` 中的类型定义非常相似。它采用块结构，允许在类型内部定义类型、进行任意分组，并支持路径遍历。聚合对象、枚举类型、类型变体和联合是结构化编程语言的特征，它们也被包含在\
  \ `TDL` 中，以最大化用户定义类型和多态性的潜能。对象确实具有静态定义的属性，这些属性会自动生成其自身的访问方法。在语法上，属性与操作是分开定义的，尽管用户可以提供操作定义来覆盖默认定义。\n\
  \n操作是用 C 语言的超集编写的，称为 `C 对象处理器`（`COP`）（最近的广告显示这已被 `C++` 取代）。`COP` 也用于为 `VBASE` 数据库编写应用程序。程序或操作调用\
  \ `COP` 操作就像调用 C 函数一样，其中参数列表中对象的类型将决定调用哪一个版本的方法。例如，调用 `Entity$Print(some-Object)`\
  \ 将根据 `someObject` 是整数、字符串还是枚举类型使用不同的代码。操作可以以包装器的方式构建，使得子类的定义是对父类方法的详述，而无需重复父类方法的代码。\n\
  \n反向操作由 `VBASE` 简单处理，因此像 `ComponentOF` 和 `Component` 等操作可以一起定义，并且它们将始终返回一致的答案。通过这种能力，可以轻松地维护一对多和多对多的关系。\n\
  \n## 持久性与特性\n\n在 `VBASE` 中，除非显式删除，否则所有对象都是持久的。因此，所有操作都是数据库操作，并且必须遵守与其他 DBMS 活动相同的约束。多并发处理、备份、恢复和访问控制都包含在设计中。除了这些之外，`VBASE`\
  \ 还提供了两个超越大多数 DBMS 的特性：聚类和触发器。聚类允许用户指定新创建对象的存储位置，以改进磁盘使用率并缩短经常一起检索的对象的访问时间。触发器是在数据库中匹配某些条件时自动调用的操作，例如当\
  \ `QuantityOnHand` 低于某个阈值时发布部分订单。\n\n### 可扩展数据库\n\n在结束对这些主流 OODBMS 的讨论之前，应该提到一下可扩展数据库领域。因为它们不是严格面向对象的，所以它们超出了本文的讨论范围。然而，由于它们经常被包含在\
  \ OODB 中，或者作为替代策略提供，因此在这里用几句话描述一下它们。\n\n两个领先的可扩展数据库模型分别是来自伯克利加州分校的 `POSTGRES` 和威斯康星大学分校的\
  \ `EXODUS`。`POSTGRES` 是一个中心关系型数据库，具有大量的扩展，使其具有超出关系模型的灵活性。新增的功能中包括：使用嵌套元组允许复合对象定义的能力；用于简化触发器和约束实现的规则处理和存储过程；以及带有时间戳的状态存储，使版本管理成为可能\
  \ [[`33`]]\n\n`EXODUS` 既不是关系型的也不是面向对象的，而是一个能够建模任何规模的工具包。版本控制、锁定和恢复都由存储系统处理 [[`36`]]。在用函数和运算符构建的\
  \ EXTRA 数据库中 [[`37`]]\n\n### 结论\n\n面向对象数据库系统的现状是，许多承诺已经得到证实，但对于最终产品的样貌目前还没有达成广泛共识。事实证明，标准模型的替代方案比其前身更适用于某些应用程序。主要的研究领域是那些存在变异最大的领域。其中包括：模式演进、索引策略、持久/动态对象操作的透明性、继承结构、复合对象和数据共享，以及与外部语言和系统的接口。\n\
  \n模式演进涉及添加新类、重新定义类与类的关系以及修改类定义的能力。大多数研究人员承认，添加新类是一个应该让用户方便使用的操作，而且实现是合理的。另一方面，重新定义关系和修改现有类则需要严格的协议来确保数据库的完整性。这些能力是否值得额外的开销仍然是一个未解决的问题。可能的研究方向涉及用于演进协议的高效实现算法，或用于缩小这些协议语义的领域特定规则库。\n\
  \n另一个可以从领域知识中受益的问题领域是索引策略的选择。这里的问题是，在类成员的什么深度下索引效率最高？索引应该只对直接类的成员排序，还是对所有子类的成员排序？如果有人根据关键词“database”查找\
  \ `DOCUMENT` 类型，那么他们可能也对在子类 `ARTICLE`、`REPORT` 和 `ABSTRACT` 中查找相关主题感兴趣。这通过全局 `DOCUMENT`\
  \ 索引、搜索父类单层子索引的算法，还是通过一组强制用户做决定的规则来处理最好？在哪些领域，深层搜索比单层搜索更常见？\n\n指针偏置（Pointer swizzling），或在主内存和辅助内存之间对对象的透明操作，带来了一些困难的技术问题。事实上，这是传统数据库从未过的特性，在学术研究社区之外，很难发现这种需求。纯主义者要求这种透明性，以克服语言与存储之间的“阻抗匹配”，实现程序与数据的“无缝集成”。这会改变用户看待数据的方式，还是会极地改变面向对象环境中的应用程序编程？\n\
  \n\n\n\n\n# 继承结构与系统设计\n\n继承结构在不同系统之间仍然存在差异，这很大程度上是因为实现严格的分级结构的简单性，与允许多重继承的困难性形成了鲜明对比。在这两种情况下，用户在模式开发（schema\
  \ development）期间进行遍历，而系统在方法查找期间进行遍历。多重继承结构额外的时间和复杂度可能会令用户望而却畏，并对系统性能造成负担。同样，人们必须问，在特定的应用环境中，用户究竟在何时才需要多重继承，这种权衡是否值得。\n\
  \n显而易见，在面向对象的数据库（OODB）应用中，有些应用需要对象属于多个结构的能力，而另一些则必须将所有权限制在一次一个。`ENGINE12345` 可能是驱动\
  \ `MYCAR` 的物理电机，在同一时间只能出现在一个地方。然而，该 `ENGINE` 的图纸可能出现在许多不同的汽车模型图纸中。关于复合结构语义及其应用在数据库领域才刚刚起步。\n\
  \n# 对象管理与版本控制\n\n在本文讨论的实现中，出现了几种不同的对象锁定和对象版本创建方案。然而，一个问题仍然存在：简单的“签出-签入”（check-out,\
  \ check-in）系统对于大型对象管理系统是否足够，还是仅仅是等待更好算法出现之前的权宜之计？是否可以实现签出系统甚至用户指定的版本控制系统，并保持存储结构的任何透明性？在潜在客户需求方面，最重要的问题可能是，为了保留对象版本必须牺牲多少物理存储，以及是否存在非时间消耗性的算法替代方案？\n\
  \n# 集成与未来方向\n\n最后，实现中的一个共同关注点是，它们与现有资源的交互能力如何。在大型用户环境中，OODBs 有潜力组织来自许多源的数据，例如分布式文件服务器、关系型数据库、用户分析数据以及各种输入输出设备。为了胜任角色，它们必须能够执行外部过程并用适当的对象表示存储这些过程。目前已经提出了多种实现这些策略，但它们的相对优缺点尚未经过统一分析和比较。全局对象管理器的概念仍然是\
  \ OODBMS 最具吸引力的特征之一，但其潜力才开始被认可。领域的可能性必须进一步研究。\n\n在看似可见的问题中，显然其中一个将是：何时可扩展工具包是一个实用的替代方案，或者在另一个极端，何时特定领域的面向对象数据库就是全部需要的？用户是否需要类和方法的运行时定义的完整功能，还是预编译的数据库模式会更高效？尽管在研究完全灵活性方面存在机遇，但当\
  \ OODBs 进入市场时，用户可能会发现他们实际上只在使用一小部分功能。希望在用户做出决定之前，有人有人提出这些问题。\n\n## 参考文献\n\n1. P.\
