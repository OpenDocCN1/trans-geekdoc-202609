  \n20. A. M. Fedotov, 输入信息中带有随机误差的线性病态问题，Nauka. Cib. Affiliation, 诺西伯伯利亚 (1982)（俄语原文）。\n\
  \n21. G. Meinardus, 《函数近似：理论与数值方法》，Springer-Verlag, New York, 1967。\n\n22. R. Bellman,\
  \ “常微分方程中的连续近似与计算机存储问题，”Comm. ACM, 4 (1961)。\n\n23. A. Iftar, F. Khorrami, 和 U.\
  \ Ozguner, “多尺度分析与重叠分解的比较，”收于系统、人与系统国际会议论文集，D. Graupe，在《系统识别》，Van Nostrand Reinhold,\
  \ New York, 1972。\n\n24. M. Coderch, 等，“多时间尺度线性系统的分层聚合，”IEEE Trans. Auto. Cont.,\
  \ AC-28(11), 1983。\n\n25. Y. C. Ho, 和 K.-C. Chu, “最优控制问题中的团队决策理论与信息结构，”第 1 和第 2\
  \ 部分，IEEE Trans. Auto. Cont., AC-17 (1972)。\n\n26. Y. C. Ho, 和 K.-C. Chu, “静态与动态团队信息结构的等效性，”IEEE\
  \ Trans. Auto. Cont., AC-18, 187-188 (1973)。\n\n27. Y. C. Ho, 和 K.-C. Chu, “动态多人控制问题中的信息结构，”Automatics,\
  \ 10, 341–345 (1974)。\n\n**A. Meystel**\n\n# 智能建议系统的接口设计问题\n\nDOI: [10.1201/9780367811406](https://doi.org/10.1201/9780367811406)\n\
  \n## 引言\n\n两种现象影响了近期许多人机交互的研究：(1) 人在学习系统时遇到很大困难，(2) 性能往往停滞不前。在这两个因素背后，似乎存在学习与工作之间的二元对立，而后者需要培训。\n\
  \n这种情况可以概括如下：人们想使用计算机是因为他们想完成任务。另一方面，学习与工作之间的这种对立导致新用户倾向于跳过培训，产生灾难性的后果。近期，许多研究人员支持一种建议，即通过智能监控器可以降低学习和技能提高的“成本”。这可以通过更好地将花费在学习上的与实际使用相结合，从而缓解学习与工作之间的冲突。这种“提供建议”的方法与更典型的在线教程和帮助命令风格形成对比。\n\
  \n我们对当前提供建议系统的方案进行了结构化的概述。我们有三个具体目标：\n\n首先，我们希望回顾文献。该领域的研究正在扩张，智能技术已经到了实用阶段。因此，现在对研究进行结构化和评估至关重要。\n\
  \n其次，我们的特定方向是从行为角度考虑此类系统的需求。近期计算机科学的一个引醒目的教训是，我们构建新系统的能力仅仅是可能成功的条件之一。单纯的技术可行性必须通过对人们将以及如何发现其有用且易操作的实证研究来补充。显然，智能用户监控就是这样一个领域。如果不考虑行为需求，构建此类设施是徒劳的。理想情况下，甚至在新技术完全开发之前就可以进行这种评估。\n\
  \n第三，我们的目标是从这项研究中提取可以帮助指导未来工作的主题和结论。从一开始就开诚布公：基于我们对现有文献的研究，我们认为目前在建议系统的设计研究中，行为学投入还太少。\n\
  \n\n\n\n我们将对文献的讨论分为两个主要主题领域：提供建议涉及的知识，以及有效建议的触发条件和内容。\n\n## 建议知识\n\n如果一个系统的建议要有价值，它就必须具备知识。那么对于一个系统来说，拥有知识意味着什么？建议系统需要了解什么？它需要了解多少知识？它应该如何获取这些知识？哲学家们可以放心了；在目前的技术水平下，对于计算机系统而言拥有知识仅仅意味着存储信息并能够根据这些信息采取行动。建议性系统的主要区别在于，它们存储了关于系统、命令、条件、过程等的信息。它们可以访问这些信息并将其作为在线培训和帮助提供给用户。这解决了哲学问题，但引发了一系列技术问题。\n\
  \n在撰写本报告的编辑环境中，命令 `help split` 会调出六个屏幕的信息，用于定义编辑命令 `split`。系统存储了关于自身的知识，并可以根据请求提供这些知识。真正的建议系统必须了解的不仅仅是自身的对话规范。它们还必须了解如何提供建议、它们将被用于哪些任务，以及用户可能产生的变化。例如，我们的编辑器可以进行增强，使其根据正在编辑的是文本文件还是\
  \ Pascal 程序，对 `help split` 做出不同的响应。关于帮助系统现状的审查，请参阅参考文献 [8,14]。\n\n我们从三个三个方面来考虑这些类型的知识：通用技能、领域知识和用户模型。通用技能包括关于辅导风格和自然语言等知识——这些知识领域超越了特定的系统、用户以及用户使用该系统所执行的任务。领域知识（如详述\
  \ `help split` 的示例）整合了特定的任务信息。用户模型是系统对与其与其交互的人员所了解的内容。我们将依次回顾当前工作处理这三个层次的方法。\n\n\
  ### 通用技能\n\n通用技能经常被认为是很重要的，但讨论的频率要少得多。这有其正当理由。通用技能涵盖了建议策略和自然语言等知识。这些主题宏大且复杂；我们对它们的理解非常不完整。因此，我们未能能够在建议系统中满意地对这些知识领域进行编码并不意外。\n\
  \n### 建议策略\n\n如何有效地提供建议？在给定特定的建议策略的情况下，如何根据被建议者的反馈有效地修改该策略？Sleeman 和 Brown [15]\
  \ 在他们关于智能辅导系统的著名合集的引言中，将显式描述不同建议策略的需求标记为“至关重要”，但书中的文章实际上并没有解决这个问题。例如，Clancy [16]\
  \ 将他的 `GUIDON` 系统在架构上将领域知识库与建议策略分离开来是一项重大进展——这强调了后者的重要性。他 [16, p. 205] 特别关注了评估策略的问题，但让该问题悬而未决。\n\
  \n通常，研究人员倾向于选择一种单一特定的建议风格，而很少或完全没有提供经验依据。例如，许多辅导系统采用了苏格拉底式，即系统提出问题，而期望用户提供答案 [16,\
  \ p. 219; 17, 18]。这很可能是交互式辅导的有效风格，特别是对于高度结构化的知识领域，但同样重要的是，还没有提供任何证据来证明这种可能性。或许更担忧的是，采用苏格拉底式可能是出于某些与辅导无关的原因。由于我们认为，通过允许系统以苏格拉底的方式提出所有问题来让系统控制对话，这允许了一个具有非常局部定义的辅导状态的简单问题列表知识结构\
  \ [19]。\n\n一个重要的权衡是系统对建议对话的控制可能会破坏可用性。Coombs 和 Alty [20] 分析了计算机顾问在处理用户提出的问题时的实际交互。他们发现信息流往往是单向的：在用户提出初始问题后，顾问就接管了交互的控制权。顾问很少包含解释或检查用户是否真的理解了建议。用户经常批评顾问“没有让信息产生意义”（第\
  \ 407 页）。被用户判定为成功的建议交互，往往是建议策略允许对话共享控制的交互 [12]。在面对面的建议交互中，用户经常向顾问提出主张而不是提问，我们认为这部分是为了共享对对话的控制\
  \ [21]。\n\n“在做中学学习”的环境包含了另一种已实验性实现的其他主要建议设计 [22, 23]。在这种方法中，用户可以更自由地发起行动。用户的移动与系统生成的专家移动进行比较，并提供反馈以塑造用户对专家原型的响应。这种方法比苏格拉底方法赋予了用户更多的主动权，因此也是更多的控制权。然而，允许用户在交互中增加这种灵活性可能对系统的知识要求更高。系统必须了解用户行为偏离专家行为的所有方式，以及每种潜在偏离的特定意义。\n\
  \n通常，“在做中学学习”的环境是为教育游戏开发的，这类可能的移动组合状态空间较小。几位研究人员已经基于经验开发了“错误”[22, 23, 24] 或“与对象相关的误解”[25]。但这些分类高度取决于领域，因此可能无法捕捉关于纠错策略或通过建议指导发展专业知识的通用知识参见\
  \ [26]]。\n\n苏格拉底方法或“在做中学学习”方法都没有获得许多系统的经验验证[但，请参见 24]。研究人员对建议策略的选择在很大程度上仍然是一个主观决定。例如，Kimball\
  \ [19, p. 283)] 明确拒绝了针对提出的数学问题领域采用“在做中学学习”的环境，但没有提供经验依据。同样值得注意的是，目前的辅导系统总是单方面地应用这两种方法。目前的系统无法对辅导本身进行推理，并动态地选择合适的辅导策略。\n\
  \n\n\n\n\nFischer 等人 [27; 另见 28] 承认了多种建议策略的必要性。他们将帮助策略分为主动和被动两种类型：在主动策略中，系统会中断对话，对用户的操作提供建议性评论；在被动策略中，用户必须显式请求建议。遗憾的是，他们尚未从实证角度证明他们的哪种建议策略是如何根据行为依据被具体召唤的，或者实施这些策略在实际上对人们有多大益处。直接的行为研究已开始描述成功的建议是什么样子的（通常是分析人类建议者的行为）。我们将在稍后回回到这一点。\n\
  \n## 自然语言\n\n与建议策略的情况类似，人们普遍认识到自然语言中的通用技能对于成功的建议界面的重要性 [29]。但问题往往只是被巧妙地回避了，而不是正面对。例如，像\
  \ Coombs 和 Alty [12] 以及 Goldstein [30] 所描述的系统，似乎几乎或没有自然语言能力。Fischer 等人 [27] 的 Passivist\
  \ 系统仅仅是模仿 Weizenbaum [31] 的 Eliza 来截取关键词。Sleeman [32] 的 ACE 系统使用简单的参数模板进行解析，这是一种非常粗糙、不可避免地脆弱且针对特定领域的方法。当用户无意中破坏了模板并导致从系统那里得到垃圾建议时，行为后果是什么？正如\
  \ Brown 等人 [22, p. 244] 所观察到的，风险在于：对自然语言的任意近似处理可能会产生比其解决的更多问题。\n\nMalhotra 和 Sheridan\
  \ 10; 另见 [33] 通过模拟一个能够用英语回答问题并响应命令的订单编写和发票系统，对这一问题采用了实证方法。在他们的研究中，用户系统的对话由实验者过滤，实验者可以在幕后干预以增强系统表面的自然语言能力。通过这种方式，Malhotra\
  \ 和 Sheridan 能够在没有实际实现这些功能的情况下，研究系统对自然语言能力的行为要求。受试者产生的句子中有一半半实例化了一小组结构模板。然而，产生的句子中超过三分之一被归类为无法进行语法分析。\n\
  \nChin [34] 最近采用了这种实证方法研究了对 UNIX 顾问 [35] 的模拟。他发现，提交给模拟顾问的查询中，超过四分之一包含了语境句法结构，例如省略、指代、间接言语行为和语法上不完整的从句。然而，在向人类顾问查询的对照组中，语境结构的比例几乎是后者的两倍。这些结果表明，一方面，自然语言接口需要能够解释语境结构；但另一方面，人们在与建议系统交互时可能会自愿限制其查询的语境复杂性。\n\
  \nChin、Malhotra 和 Sheridan 提供了一种主要出于实现易用性考虑的自然语言限制的替代方案。他们提出了一个理论问题，即如何更全面地刻画适当自然语言限制的本质。最后，他们开始提供方法来分析建议系统通用技能要求的成本效益权（例如，自然语言能力的某项特定增强实际上多大程度上提升了建议界面的可用性？），如果这些系统要在短期内具有实用性，这是一个关键问题。\n\
  \n行为研究也有助于揭示自然语言界面中的问题领域。例如，Ogden 和 Brooks [36] 显示，虽然用户在学习目标应先于搜索标准的语法限制（例如，“列出专业名称”）方面问题不大，但在学习词汇限制（例如）方面存在显著问题。Furnas\
  \ 等人 [37] 报告说，用户引用实体的词极其多样，这表明需要别名支持以体验作为自然语言的能力。对于建议系统来说，问题在于：当用户最需要帮助时，他们最无法遵守查询限制\
  \ [38]。\n\n通用技能领域，如建议策略和自然语言，显然适用于行为研究。希望像 Malhotra 和 Sheridan [10] 那样的模拟技术，以及 Chin\
  \ [34] 和像 Coombs 和 Alty [12] 那样的直接行为调查，将能够更广泛地应用于建议系统的通用知识探索中。\n\n## 领域知识\n\n在我们的“帮助分割”示例中，我们描述了一个在线帮助系统，它可以引用关于其支持的任务的启发式知识以决定如何响应帮助请求。然而，我们描述的领域知识能力范围有限。建议系统对用户意图可能做许多诊断将需要从用户活动序列中检查并提取模式\
  \ [23, p. 96)]。它们不仅需要查看用户到达的状态，还需要查看用户到达那里所经历的整个过程 [39]。\n\n### 领域理论\n\n所有关于领域知识的工作都存在一个令人不安的可能性：研究结果将过于针对特定领域。在开发交互式教学系统的研究中，调查的许多领域都非常简单。VanLehn\
  \ [40, p. 9)] 描述他感兴趣的领域（减法）是“枯燥、正式且与日常生活脱节的”。这提出了一个关于解决方案适用性的通用问题：它们能扩展到更复杂、更典型的领域吗？值得注意的是，现有工作大多集中在可以被称为声明性领域，而非过程性领域。过程性领域包括系统的交互式使用、程序的组合和和调试。例如，Stevens\
  \ 等人 [17] 研究的气象领域包含了底层的因果机制，但没有过程。这引发了 Stevens 等人对多种知识表示的分析如何扩展到过程性领域的问题：例如，在这样的领域中，脚本/功能性的区别是什么？\n\
  \n\n\n\n\n存在哪些领域？自然而然，计算机科学应用工作一直关注过程性领域例如，程序计划和缺陷；[41]]。与这些领域处于另一个极端的是声明性领域，例如人们关于页面排版的知识，以及他们在“所见即所得”（WYSIWYG）文本编辑器中能够利用的知识（关于用户界面隐喻的讨论，请参见参考文献\
  \ 42）。人们还拥有功能性知识，例如关于电子表格约束的知识，以及关于协作工作和通信的交互性知识（例如他们在电子邮件应用程序中使用的知识）。这些分类仅是为了讨论而提出的。我们需要更清晰地阐述一种领域分类法，以表达不同类型领域之间的相似性和差异。这种分类法必须反映领域类型之间显著的经验差异，并借此明确我们拥有哪些类型的领域知识理论，以及缺乏哪些类型的理论[43,\
  \ 44, 45]。\n\n咨询领域往往相当模糊。在我们的研究中，顾问报告说，他们处理的大部分查询实际上超出了他们的“官方”责任范围[46,47]。这些被误分类的查询并不是随机的；例如，一个文本顾问经常被问及打印机硬件和编辑器的问题，尽管文本顾问在官方上只负责格式。因此，在咨询系统中充分表征领域知识可能还需要表示适当的外围知识。\n\
  \n### 心理相关性\n\n领域知识理论旨在提供心理学相关性的分析，对用户的体验和所采取的行为产生解释，这些解释应与用户自身的解释一致，即从用户的意图角度出发。\n\
  \nFitter [48, p. 341)] 认为，为了对人们有用，系统必须以*按照人们所认知的方式*来表示其知识（另见参考文献 29, 49）：\n\n1.\
  \ 计算机正在执行的底层过程应该以与用户自身过程模型兼容的方式，对与用户直接相关的过程进行建模。\n2. 通信语言（或用户界面）的设计应当尽可能生动地揭示底层过程。\n\
  \n最近，Wenger [50] 认为，由于咨询系统的主要目的是知识的传递，领域知识必须对人们来说是透明表征的。当然，难点在于如何在给定案例中准确地执行这些准则（并能够确认你已经这样做）。基于与用户相关的过程对系统的操作和界面进行建模意味着什么？究底，用户对系统的内化心理模型是什么？\n\
  \n这些都是困难的问题。现有的心理学研究文献为推导出复杂任务领域的严谨心理模型提供了很少的依据[51]，而且几乎没有直接的行为研究能为有关心理相关性的主张提供支持，或用于评估这些主张（另见参考文献\
  \ 52]）。然而，心理学理论及其应用是有可能共同发展的。例如，McKendree 和 Zaback [53] 最近开发了一个用于统计学应用的咨询系统，该系统整合了一个类似于\
  \ Kieras 和 Poison 在用户实验室研究中开发的[54] 的产出系统任务模型。然而，他们发现他们的规划器需要能够生成替代性的行动方案，这为 Kieras\
  \ 和 Poison 模型的发展提供了方向。\n\n然而，发现一些研究人员仅仅假设这些问题已经解决是令人担忧的。例如，Jagodzinski [49, p. 218\
  \ f.)] 表示：“自从计算机出现以来，编程领域一直存在一种趋势，从反映计算机工作原理的方法转向更符合人类认知过程的方法。”从一个非常粗略、直观的意义上来说，这个说法似乎是正确的。但作为研究现状的总结，这只是充满乐观意意的无效承诺，缺乏对“人类认知过程”可能指什么的任何严谨探究。\n\
  \n与其专注于模仿人类领域知识，另一种富有成效的方法是关注人类认知与计算知识技术之间的明显差异。例如，Kidd 和 Cooper [13] 注意到在数据库中提取连接的详尽后向回溯策略与他们所谓的“快速刺探”策略之间的不匹配，后者可能更典型地反映了人们尝试提取此类连接的方式。Kidd\
  \ 和 Cooper 没有详细详细分析这种差异，也没有直接研究其经验后果，但他们的建议明确了如何开始识别相关的人类认知过程。\n\n### 多重表征\n\nFikes\
  \ [55] 和 Stevens 等人 [17] 提出了一个重要的可能性：领域的多重表征是必要的。这种观点认为，任何单一的领域表征都无法为有效的咨询提供足够的基础和灵活性。Fikes\
  \ 对了死记描述（rote description）、功能描述（functional description）和过程目的论（procedure teleology）。死记描述只关注过程的步骤和预期结果。功能描述还包含了每个步骤的原理——它与其他步骤的依赖关系以及对预期结果的贡献。过程目的论将这种原理扩展到过程本身；它描述了程序旨在实现的任务，以及程序中每个步骤所发挥的功能。Fikes\
  \ 研究的局限性在于它是从纯粹先验角度出发的：他的过程目的论概念的特定经验后果尚不清楚。\n\nStevens 等人 [17] 在实证研究背景下更具体地发展了多重表征假设。他们研究了气象知识领域。人们学习了关于天气的实（俄勒冈州很湿）以及支持这些事实的机制。他们识别出两个相关的知识层次：表达情境化的因果关系的脚本知识（scriptal\
  \ knowledge），以及表达更抽象、定性模型的功能知识（function knowledge）。他们发现，脚本知识决定了咨询对话中主要主题的顺序，而功能知识决定了咨询交互的细粒结构。遗憾的是，他们的工作建立在一个特意的教学轶事样本之上。Stevens\
  \ 等人没有提供足够的系统证据来证明他们的区分实际上对应于人类思维中的显著差异，且这种差异足以限制咨询系统的设计。尽管如此，这项工作是实证性的，并为进一步研究提供了一个有趣的方向。\n\
  \n### 分析粒度\n\n\n\n\n\n正如通用技能的情况一样，人们经常声称表示更多的领域知识是构建更好建议系统的关键。例如，Stevens 等人 17，第\
  \ 22 页以两种不同的格式表示了他们的知识领域，并认为额外的多重表示是必要的。与此类似，VanLehn 40，第 23 页结论说，如果他以更细致的粒度来表示领域知识——即过程性错误底层的过程，而非错误本身——他的进展将会更大。事实上，在基于知识的系统工作中，这是一种典型的做法，即预测只要能表示更多的知识和更细粒度的知识，就能取得更大的成就。\n\
  \nRich [56] 提出，领域知识的一种方便的表示粒度是系统代码中的语句级。她推测，如果一个建议设施能够逐语句地检查系统代码，它就能找到她认为的主要用户查询类型的的答案（“什么导致了这一结果？”、“如果我这样做会发生什么？”以及“这两种操作方法之间的区别是什么？”）。这是一个有趣的提案，仅仅因为它放弃了大多数研究人员在领域知识观点上所强加的心理相关性要求。然而，重要的是，Rich\
  \ 并没有证明她的提议真的能够在回答她所列举的用户查询类型方面产生一种可行的领域表示。此外，她也没有确定这些查询类型实际上涵盖了用户真正想要寻求建议的查询，甚至不能说它们是典型的查询。\n\
  \nReiser 等人 [57] 为一个 `Lisp` 智能辅导系统选择 `Lisp` 原子子（atoms）作为分析的粒度提供了一个基于用户的理由。他们认为，更细粒度的粒度（例如\
  \ `keystrokes`）往往无法确定特定的错误，从而无法确定特定的教程建议。然而，较大的粒度会推迟反馈，直到过了可以分类特定错误的时间，从而允许使用户在错误状态下进行徒劳的坚持。也许，通过关注领域知识表示的单一且显著的解析粒度（如\
  \ `Lisp` 原子子），系统可能会向用户呈现更一致的建议风格。然而，选择原子子作为粒度可能是一把双刃剑：在原子子级提供建议意味着系统可能会忽略或误导实际上属于更高层次程序结构的问题，或涉及多个低层问题之间概念纠结的问题。\n\
  \n与其向建议系统中塞入更多的领域知识，我们或许可以问：多少的领域知识、在多大的粒度下，仍能为建议提供任何杠作用？这种方法在很大程度上与现有大多数研究是互补的；它会将较多的注意力放在投影对话流利度和某些建议能力的表现上，而相对少地关注非常大的知识数据库的组织和访问。因此，与其存储\
  \ 500 个错误底层的组件过程，我们可能会存储几十个原型场景，以粗略地对用户情况进行分类并在该粒度上提供建议。经典的论证，如 Weizenbaum 的 [31]\
  \ `Eliza`，表明了仅仅是表象对人类能施加的力量。我们在场景机器的研究（下文将介绍）也探索了这一方向。\n\n### 用户模型\n\n再次提到我们的“帮助分割”示例，我们可能会考虑通过维护给定用户的工作模式和帮助调用记录来增强系统，以便用于诊断该用户（或任何用户）未来帮助调用的性质。这里一个特别关注的问题是计算机不要（或被视为）监视用户（例如，为了对员工生产力进行基准测试）。然而，为了提供个人和情相关的建议，系统可能需要分析用户活动。开发和维护预测性用户模型已被认为是建议系统的关键\
  \ [15, 58]。\n\n### 词汇分析\n\n如何构建和更新用户模型？系统可以仅仅要求用户指示技能水平吗？将确定技能水平的责任有效地交给用户似乎是不可能的。将用户简单地划分为“初学者”和“专家”可能是不的\
  \ [59]；但提供更多类别可能会使自分类任务变得困难且不可靠。人们在准确描述自己的信息需求方面是众所周知的糟糕 [60, 61]。系统是否需要从从和响应中推出用户的技能水平（以及用户的特定问题和担忧）？这似乎是一个更充分的方法，但显然对系统的要求也更高。\n\
  \nRich [61] 描述了一个文档格式系统的建议设施，它体现了一种简单但有趣的方法。在她的系统中，用户的技能水平是通过对帮助调用中所使用的词汇进行关键词分析确定的。每个文本格式命令都关联了一个从通用到技术的层次说明结构，其词汇反映了所涉及的复杂程度。用户帮助调用中诊断出的技能水平决定了解释的词汇水平。\n\
  \n这种方法的一个问题是，并不清楚帮助调用中的词汇到底有多大的诊断意义：完全的新学者可能不会提出非常技术性的查询，但具有丰富经验的用户可能仍使用相对通用的词汇，从而获得过于基础的建议。目前尚未对词汇分析进行任何行为评估。\n\
  \n### 行为分析\n\n自动诊断用户技能的更直接的途径可能是监控和评估用户的实际行为。大部分工作集中在监控和评估用户错误上。例如，Coombs 和 Alty\
  \ [12] 将原型错误模式存储为 `Prolog` 环境用户的规范用户模型。当特定用户生成了与存储的原型匹配的行为模式时，就会产生相关的纠正建议。我们希望不仅仅是已证实的错误类型列表来指导行为分析。我们希望有一个更通用、或更抽象的错误分类法，更重要的是对错误为何产生有理论上的理解。\n\
  \n早些我们提到关于知识“bug”概念，或用户模型偏离理想模型的系统性偏差的研究 22, 23, 24]。一个 bug 被定义为正确技能的最小变体 [24]，即正确程序中导致变为错误的微小变化。bug\
  \ 理论者强调，这种层次的分析比原型错误模式更抽象。后者仅仅是行为流中的元素。然而，bug 被视为知识假设：错误、特征性的非优化表现，甚至是正确的表现都可能成为特定\
  \ bug 假设的证据。\n\n\n\n\n\n遗憾的是，关于行为分析的研究仍然相当没有定论。例如，在简单算术领域的 bug 诊断方面，尽管进行了五多年的开发工作，仅分析了三分分之一的实际学习者错误。或许更令人担忧的事实是，尚未发现任何原则能将被正确分析的学习者错误与相对于\
  \ bug 的误分析的错误区分开来。尽管 bug 被视为抽象假设，但目前还没有一套关于 bug 的系统理论（当然，这同样适用于错误原型的清单）。bug 或错误的清单本质上是一个人知识的微型理论清单，但对这种分类法并没有任何系统性的约束。相反，将学习视为一个对性能中“最少变体”进行调试的过程，其丰富性仍然不比简单的刺激—响应连接的累积。这并仅仅是理论上的局限性，更是一个实践上的局限性。由于特定的\
  \ bug 或错误原型清单是在没有任何宏观框架的情况下逐个案例开发的，因此每个新案例几乎都是一张“白纸”。从实践角度来看，这是一个致命的局限性。\n\n也许是目前处理知识\
  \ bug 的方法层次太低，不足以理解认知技能。人们完全可以放弃要求 bug 必须区分性能中的“最少变体”。这种“高层”的 bug 可能构成一个更有效且更易于处理的理论分析粒度。（事实上，高层\
  \ bug 可能与错误原型的水平契合得更好，因此在实证上也是一个更直接的水平。）最后，显然，在许多情况下，对用户错误的分析必须明确包含用户在犯错时的意图 [*62*]。因此，从\
  \ bug 和错误原型的意义上说，行为分析可能需要变为认知分析 [*63*]。\n\n## 规范模型\n\n一种简单的方法是开发并引用一个规范用户模型，即一个适用于所有人的单一描述。一个例子是\
  \ Carroll 和 Carrithers 研究的“训练轮”式界面 [*64*]，该界面硬编码了这样假设：文字处理应用程序的新用户不需要访问特定的高级系统功能。当用户尝试访问这些功能时，他们会收到这些功能对他们不可用的通知。\n\
  \n训练轮设计基于实证研究，该研究表明新用户经常误触高级功能，然后因后果感到分心和困惑。然而，这种方法的局限性在于，如果用户的实际目标未能符合规范模型，他们可能会对该模型提供的隐含且灵活的指导感到沮丧。Reiser\
  \ 等人 [*57*] 在 Lisp 辅器中使用带有规定目标的规范模型，但根据特定的用户操作动态调整渲染建议。纠错建议根据错误发生的方式进行调整；用户也可以请求特定的澄清或解释。此类方法的局限性在于，功能上等同知识在心理上可能仍然不同的\
  \ [*65*]。\n\n一种调整建议的雄心勃勃的方法是结合一个规范参考模型和一个针对特定个人的用户模型。例如，Sleeman 和 Brown [*[15*]\
  \ 讨论了使用理想模型、特定用户模型以及性能比较作为生成建议的依据。Goldstein [*30*] 批评了这种方法，认为它假设从新手到专家的转变仅仅是知识的累积，这与认知学习\
  \ [*66*] 和人工智能理论 [*67*] 是一致的。\n\n新手与专家之间的关系可能比所学连接的数量更为复杂且可能更加无常，这种可能性正是 [*32*]\
  \ 设计系统时采用的。该系统正确诊断了 45% 到 80% 的用户错误。Reiser 等人 [*57*] 引入了一个规范模型……理想学生 [*69*] 引入了理想模型的变体，其中“理想”模型并非专家的模型。\n\
  \n## 个体差异\n\n从自上而下而不是自下而上来解决这些问题，我们可能从个体差异的通用分析开始，并从中推导出具有诊断意义的错误或 bug 模式。这种策略有望提供一个整合框架，帮助将跨任务领域和系统的逐个案例分类法进行泛化。\n\
  \n建议系统设计基础的用户建模通常假设用户在相关方面是同质的。当然，所有人也清楚看到，更好的替代方案是针对个体差异定制界面表述 [*61*]。我们同意个体差异可能在未来的建议技术中发挥重要作用，但我们也认为该领域目前几乎没有开发。说人们对信息有多样化的风格和需求是合理的。而且，那些向他人提供信息的人（例如参考值门员、指路的人）似乎并没有根据对个体差异的某种考量来进行调整\
  \ [*70*]。因此，预测计算机系统可能需要包含适应此类个体的能力似乎是合理的。\n\n讨论的许多例子并不怎么令人信服。一方面，讨论的许多个体差异类别都非常泛泛（例如性别和“知识分子女性”之类的刻板印象）。这些类别的问题在于，如何以聚焦的方式将其与人类信息处理的重要方面联系起来。也就是说，知识分子女性是否有不同的建议需求？\n\
  \n\n\n\n另一方面，更具体的个体差异分类往往对实际设计提供有限的启示。例如，在论证在界面设计中考虑个体差异时，Rich \\*[61*，第 200 页\\\
  ]关注了 Card 等人 \\[*71*\\]的研究，该研究表明，在为专家设计文字处理交互界面时，应尽量减少每个任务的击键次数；而 Ledgard 等人 \\\
  [*72*\\]的研究则表明，在为初学者设计文字处理交互界面时，应使用类似于英语的完整单词命令。她将这些称为“冲突的需求”，但目前完全不清楚它们是否存在冲突，即使对于特定的用户体验水平（例如，`Card`\
  \ `et al.` 显然将 `keystroke` 复杂性估计视为近似，而 `Ledgard` `et al.` 实际上使用了非常 `brief` 的完整单词命令）。\n\
  \n一个有趣且日益相关的个体差异是用户对其他系统的经验，包括对功能、词汇、预测错误和困惑的特定预期。例如，Rosson \\[*73*\\]发现，一个人以前使用过的不同全屏文本编辑器的数量可以预测用户的其他特征（在编辑时使用的程序功能键范围）。正如我们在此处审视的其他领域一样，个体差异似乎非常适合进行实证研究，尽管目前相关工作寥寥无几。\n\
  \n### 知识边界\n\n多少知识才足够？显然，可以认为：更多关于建议策略的显式知识、更自然的语言处理能力、关于给定领域的更多内容知识以及对个体用户更广泛的用户建模，都能使交互式建议系统更有效。然而，这使得问题与其赋予其意义的问题背景脱节了。正是施加在知识表示上的约束和局限性赋予了这项工作科学意义。此外，开发建议系统不仅仅是知识表示的练习；它还具有工程方面。如果我们仅仅得出增加每种知识将导致更好的建议系统的结论，那么后一个方面也被忽视了。\n\
  \n`Carroll` 和 `Aaronson` \\[*74*\\]为一个商业开发的数据库和报告应用程序模拟了一个智能建议系统。该模拟提供了针对可诊断错误的由系统发起的（主动的）帮助。从设计上看，该模拟仅具有边界的智能：它旨在模拟一个系统而非人类顾问。在某些情况下，系统的有限知识与用户的预期发生了冲突。当冲突发生时，系统往往会失败。例如，一个用户得出结论，认为他可以通过编辑现有数据库中的项目来创建一个数据库。他是错的，并犯了一系列错误，系统正确地指出了每一个错误并出了出了正建议。他拒绝了这些建议，因为他确信自己知道做什么。智能生物当然是这样的。问题的点在于，我们现在无法预测我们所拥有的用户智能与我们希望构建的建议智能之间的冲突。增加智能并不是思考这一问题的充分方法：我们现在无法构建在人类意义上一样智能的系统，我们可能永远无法做到这一点。更具体的研究问题是，我们如何帮助人们应对边界智能？\n\
  \n![FIGURE 1 建议知识问题的示例。](img/pg132_Image_140.jpg)\n\n图 1 建议知识问题的示例。\n\n知识需求工作需要移动的关键方向在于对知识表示施加约束和局限，并衡量和评估随后的行为后果。在理论领域，这意味着超越知识元素清单转向知识结构理论；这意味着开发领域理论，以及更好的特定领域理论——即可实证测试的理论；这意味着理解建议策略和受限的自然语言，以便替代方案被显式地表征、对比和评估。\n\
  \n在实践领域，我们不仅需要关注如何实现综合方法，还需要关注自我限制方法的后果。我们探索了一种名为`scenario machine`（场景机）的研究工具 [75,76\\\
  ]。`scenario machine`为用户编码了一系列需要完成的目标和任务。系统使随后的每个任务作为附带呈现而变得合理（例如，用户收到一封包含关于公告板项目查询的电子邮件，该项目随后被访问和检查以回答查询）。它可以提供关于当前目标、正在执行的程序步骤或其他与当前任务相关的信息的建议对话。\n\
  \n在考虑“知识需求”这类话题时，人们倾向于将其视为一个“形式”问题（更多是人工智能问题而非人为因素问题）。我们不同意这一观点。事实上，纵观目前的文献，令人惊讶的是，我们提出的许多问题（在很大程度上不得不留空的问题）只有通过对使用研究原型机的人进行行为测量才能解决。\n\
  \n## 建议对话\n\n提供建议的知识需求是一个基础，但在某种意义上，也是提供建议这一“真实”问题的准备工作。即使承认系统知道正确的类型、拥有了所有正确的答案和技能，这些内容在建议对话中应该如何被结构化和部署呢？系统应该说什么？以及何时说？我们将此讨论分为三个子部分。首先，我们审视了系统与用户之间的建议对话中建立并不可避免地共享主动权的问题。其次，我们讨论了提供建议的架构和风格。最后，我们考虑建议的范围。\n\
  \n### 主动权\n\n我们多次提到的简单“帮助拆分”示例假设用户会通过发布命令显式地请求系统提供建议。这在目前的商业技术中非常典型。用户必须在请求建议方面采取完全的主动。我们可以想象放弃这一假设：系统可以直接监控用户的活动，即记录每个用户的操作日志，分析这些日志，然后发起建议对话。事实上，当人们提到建议系统时，其含义是主动权至少与系统共享一部分。\n\
  \n\n\n一系列问题随之立即产生。例如，应该监控什么种程度的用户活动，即应该记录哪些类别的事件？系统可以记录每一个按键事件，也可以记录更高层次的事件（例如，某一分类错误闭集的示例）。应该如何传达建议？系统可以仅仅建议使用系统有更高效或更正确的方法（例如，通过口头反馈），也可以强迫用户按照这些替代方式进行操作。这两种截然不同的方法严重地调控了提供“建议”的含义。\n\
  \n## 系统监控\n\n在现有的建议系统中，最典型的需要监控的用户行为大类是错误。这在直觉上是非常合理的。毕竟，用户只有在发生错误的背景下才最需要建议。可以合理假设，用户在尝试从错误中恢复时，会有动力去关注并使用建议。因此，错误监控为可行性演示提供了良好的依据。\n\
  \n错误监控的关键问题在于定义什么被视为错误。这里存在一些简单的情况：在事实性领域中，如果用户断言了虚假事实，那么他就犯了错误，可以被纠正和辅导。即使在程序性领域，也有相当简单的情况：指定了一个不存在的目录的用户可能犯了错误。在创建任何可打印数据之前选择“打印”的用户也可能犯了错误。在首次登录且在任何其他选择之前选择“应用程序自定义”的用户可能犯了错误，可以被引导先尝试一些更简单的功能——但也许这并不是错误。一个反复队列并重新队列同一个打印任务而从未操作过打印机的用户也可能犯了错误，可以就如何使用打印机接受指导——但也许用户真的想队列几个相同的打印任务。\n\
  \n用户行为通常只相对于特定的用户目标才 true 错误。例如，那个在没有打印的情况下队列并重新队列同一个打印任务的用户，只有在其实操作目标确实是打印该任务的假设下才犯了“错误”。如果目标是填满队列，那么整个操作序列可能不仅是正确的，而且是优化的。因此，错误监控的问题变成了基于推断的目标来诊断错误\
  \ [62]。而在编程或文字处理等交互式程序性领域中，用户行为与用户目标的交叉乘积空间可能是巨大的。Carroll 和 Aaronson [74] 即使在看似是清楚病例的情况下，在做出正确错误诊断时也遇到了问题。例如，一个用户正在浏览一个被动式帮助系统并尝试那里描述的交互技术。在此过程中，他犯了一个错误并触发了模拟智能帮助系统的消息。由于他正在以一种“假设如果”的模式操作，并且怀着这种心态特意犯了错误，他只是对这种帮助感到恼火，并评论道：“好吧，我已经猜到了！”为了给这类用户服务，建议系统必须区分“浏览和实验”与“真正的尝试”。\n\
  \n这种情况比这更糟糕，因为此类错误和表面错误会交织在用户行为序列中。在先前的错误背景下执行的典型正确用户操作可能需要被解释为后续错误。例如，如果目标是打印文档\
  \ A，但通过其他错误，在队列文档 A 之前队列了文档 B，那么正确操作打印机可能是一个错误。这是一个错误，因为在这种背景下，正确操作打印机会导致文档 B 打印。在\
  \ Carroll 和 Aaronson [74] 的研究中，一个用户在设计数据模板时错误地指定了邮编码字段长度，在修复此问题的过程中，他不小心地向该文件添加了两空白数据记录。虽然这两个错误都是可诊断的，但系统地解开这些错误需要超出系统智能刻意施加边界的领域知识。\n\
  \n在用户行为是可预测的或被直接规定的范围内，错误监控就变得容易实现。事实上，这就是为什么关于建议系统的大量工作集中在智能辅导系统而不是智能帮助系统。辅导系统为系统提供了一个更受限的操作领域以供诊断。尽管如此，这清楚地表明，建议系统的工作需要从两个方向发展：监控显性错误之外的用户问题（例如，针对有问题的或仅仅是低效的使用模式；5），以及在实际使用语境中的错误（即在辅导环境之外）。Shrager\
  \ 和 Finin [77] 描述了一种监控实际使用并向用户建议更优方法的建议系统。然而，监控和分析“自由”的用户活动是令人生畏的。Quinn 和 Russell\
  \ [78] 评估了一个复印机系统的建议者，注意到在同步用户状态分析、建议呈现以及建议实际到达时用户状态之间存在着重大问题。\n\n## 用户发现\n\nBrown\
  \ 等人 [22, p. 228]] 报告说，根据他们开发交互式辅导系统的经验，大量的系统发起干预往往是有害的。他们认为，让用户自己处理通常更好，特别是当问题看起来很小时候。然而，他们也建议当学习者偏离轨道太远时不要提供任何建议\
  \ [24, p. 96)]，理由是对于在这种情况下不清楚应该给出什么种建议。这可能是目前可用的最佳智慧，但它凸显了我们现有理解缺乏深度：什么是偏离轨道太远？什么是小问题？什么是过多的系统发起干预？这些都是等待系统性调查的实证问题。\n\
  \n系统发起的建议无论与用户的处境有多相关，如果用户的当前目标不是关注建议，它仍然可能是对用户的干扰。这在 Carroll 和 Aaronson [74] 的研究中被确定为一个主要问题，但很难想象建议系统如何识别用户何时会接受帮助，何时不接受。Fischer\
  \ 等人 [27] 承认了这个问题，并采用了简单的超时方法；在他们的系统中，建议性中断以一个任意界定的最大频率发生。Carroll 和 Kay [75, 另见下一节]]\
  \ 对比了情景机中智能提示的几种处理方法。例如，在其中一个版本中，用户接收到提示建议，告诉他们在当前系统状态下应该做什么以完全避免犯错。其他版本则提供反馈建议，在提交错误后告诉用户如何恢复。有一个版本既提供提示建议（指导用户该做什么），又提供反馈建议（指导用户如何从已犯的错误中恢复）。有趣的是，那些在后后一种版本上接受过训练的人，在学习迁移任务中的表现最差，这表明[与\
  \ Brown 等人 (22) 的观点一致]，过多的建议实际上是有害的。\n\n\n\nFischer 等人以及 Carroll 和 Kay 的方法控制了建议信息的数量和多样性，但他们提供的控制无法对用户情况的具体细节做出响应。他们并没有试图区分“欢迎的干扰”与“建议性的骚扰”。“发现式学习法”的支持者通常主张在用户显式请求帮助之前，不要提供反馈[*79`]。当系统响应用户发起的请求并提供建议时，用户更有可能当前的目标正是关注这些建议。当前用户发起的建议设施在实际中的问题是，它们通常需要冗长且枯燥的提示对话交互[*13`]因此因此需要相关工作，以简化针对用户发起的建议请求的系统响应协议。\n\
  \n采取更强硬的发现式学习方法，我们可能会考虑提供建议这一本身的负面影响。人们经常认为，在许多情况下，向人们提供信息不如让他们自己主动去发现信息更有效[*80`]。发现式方法利用了机会性学习，即充分利用每种独特的个人经验。另一方面，允许用户在探索性学习模式下以最少的引导进行游荡可能也是不理想的，例如在学习率方面*[81,但请参见\
  \ 82]]。这同时也涉及非常复杂的技能是否能被高效地“发现”的问题（将发明微积分与学习微积分进行对比）。\n\n这种可能性可能与所考虑的界面类型产生相互作用。与命令界面相比，发现式学习对于菜单界面[*82`]可能更具可行性：前者显式地列出了可以尝试的当前选项，并提供了许多隐性线索（例如，通过选项名称所传达的信息）。围绕活动表单设计的界面[*83,*84`]为用户提供了更多关于隐性的建议，告知他们从给定的系统状态可以做什么以及会产生的结果。这些以及其他技术，例如动态高亮和或移动当前重要的显示区域，可以被认为是在向用户提供“软性”建议。Masson\
  \ 等人[*85`]发现，使用直接操作[*86`]版本界面的用户往往会固执于错误的响应，而这与使用命令行版本的用户形成对比。他们认为，直接操作界面由于未能保留之前操作的视觉记录，导致了错误的重复。命令行系统在电传打机中进行记录，因此提供了减少这种固执行为的线索。\n\
  \n硬性建议指导与发现式方法之间的权衡可能也对经验水平非常敏感。Elkerton [*87`]报告说，非常缺乏经验的用户有时会被高度交互的、混合主导的对话所困惑。Fischer\
  \ 和 Stevens [*88`]在设计他们的系统助手（System Assistant）时注意到了这一点，该系统试图在计算机崩溃后对重启提供建议。该系统包含了一个硬性的提问对话，以及一个用户可以自愿提供计算机状态信息的设施。初学者似乎对前者对话结构感到很自在，但更有经验的用户则更倾向于后者。这可能会限制发现式方法对非常缺乏经验的用户的效用。\n\
  \n### 后果\n\n提供建议具有后果。至少，信息被呈现了，并希望它被传达了。用户可以关注它、被它分心，甚至忽略它。还存在许多其他类型的后果：当给出建议以隐式地强制用户遵循建议时，系统的可用功能可能会发生；用户可能被置于一个特殊的系统模式，在该模式下，可以在不产生进一步错误或其他复杂情况风险的情况下探索建议。\n\
  \n### 确认对话\n\n除了仅仅呈现信息之外，建议设施还可以调节系统的控制结构。例如，当诊断出用户犯了错误，或者当用户可能仅差一个命令就会采取具有潜在危险后果的操作时，系统可以进入“确认对话”。系统中断用户的会话，并提出用户在允许继续会话之前必须回答的问题，例如，“如果你要传输的信息是非专有的，请输入\
  \ Y，或输入任何其他内容来取消命令。”一个广为人知的陈词滥调例子是确认问题：“你确定要删除所有文件吗？”这种确认对话的目标无疑是强迫用户重新思考最近的操作、即时选项以及可能的后果。\n\
  \n许多系统会对致命错误请求确认（例如删除所有文件的示例）。Cuff [*88a`]在对普通用户数据库检索系统工作进行回顾时，讨论了这种保护机制是理想的，但没有指定应如何或何时调用它。Gable\
  \ 和 Paige [*29`]在另一篇文献综述中也建议采用确认方法，即系统给予用户即时反馈，但用户始终拥有采纳或拒绝的特权。从原则上，强制用户确认删除所有文件的意图这一论点听起来很令人安心，但我们真的可以放心，那个会错误发布命令的类型的用户，在确认提示中简要回顾后果时，能够充分意识到后果的严重性吗？我们需要了解这种方法是如何工作的，或许更重要的是，它可能会何时以及如何失败。\n\
  \n### 阻塞控制\n\n在确认方法中，用户对系统的访问会被建议提示临时中断。一种更剧的干预是阻塞：系统的部分功能被有条件地限制用户访问。Carroll 和\
  \ Carrithers [*64`]研究了一个训练性系统，在该系统中某些系统状态被阻塞了：那些是产生问题的后果的状态（文本文件中存在不可打印字符），以及那些经常导致错误的状态（过早选择高级功能）。当用户选择这些功能时，会显示一条消息，说明这些功能在训练版系统中是不可用的。这种阻塞方法有一个不理想的副作用，即深度干扰了用户。如果系统误判了情况且实际上没有发生错误，或者用户想要执行所示的操作尽管这不符合常规，那么阻塞进展的后果将是非常令人沮丧的。阻塞方法可能适用于新用户，他们的目标可能有限（因此更容易被预测或识别），并且对系统控制流的中断可能不那么敏感。对于新用户，Carroll\
  \ 和 Carrithers 显示该方法使得学习文字处理应用程序变得更加高效。\n\n\n\n阻塞法（blocking approach）也被用于各种类型的智能建议对话中。Lewis\
  \ 和 Anderson [*89*]] 研究了人们学习玩一种基于逻辑计算机游戏。他们发现，在错误后立即提供反馈对于学习游戏的算符最有效。他们还发现，如果允许人们遇到死胡同状况，他们能更好地识别这些死胡同状况。允许人们实际上“看到”他们可能犯的错误及其后果（并能够轻松地撤销或避免这些后果）是一种重要的建议信息类型，而且是一种由建议系统独特实现的类型。这两个发现表明，建议应该在产生错误后立即呈现，但在阻塞用户之前，应该允许用户看到错误将导致什么后果（或本会导致什么后果），然后允许其纠正错误并做出正确的操作[参见参考文献\
  \ *58*]。\n\nWoolf 等人 [*28*]] 在他们的“恢复性锅炉辅导器”（Recovery Boiler Tutor）中也采用了这种方法。学生处理\
  \ 20 个教学情的情景，只有当他们开始偏离目标状态时，才会收到反馈。Carroll 和 Kay [*75*]] 以及 McKendree 和 Carroll\
  \ [*76*]] 在他们的情景机研究中将阻塞与各种建议信息相结合。阻塞思想已经比大多数建议对话技术发展得更完整，并经过了实证研究。然而，大多数工作只检查了演示系统，这引发了关于这些思想可以扩展到何种程度的进一步问题。\n\
  \n### 自动修正\n\n相对于阻塞进度和提供确认对话的另一个极端可能是自动修正方法。在这种方法中，当用户犯错时，系统将其解释为正确的后续响应并允许进度不受中断地继续。因此，我们可以想象一个误执行了\
  \ `split` 的用户会被自动提供一个正确的命令形式——而无需经过任何显式的 `help split` 请求。Interlisp 的“如我所意”（DWIM）功能\
  \ [*90*]] 会自动解析错误的输入并向用户建议修正（通常不仅仅是复杂的拼写检查）。然而，在修正被归类为“显而易见”的情况下，系统直接进行修正，而不请求显式确认。显然，这种方法对于经验丰富且老练的用户可能很方便，特别是当应用于平庸且常见的失误时。然而，该方法对这类用户有效的特定条件尚待确定。\n\
  \n两项行为研究表明，自动修正方法在为新用户设计训练界面时也可能有大用之地。我们之前描述了 Carroll 和 Kay [*75*]] 对训练系统不同版本的研究。在他们评估的培训设计中，从培训时间和学习迁移任务的成功率角度来看，最好的培训设计是带有自动修正的那一个：当初学者处理训练情景时，错误被解释为下一个正确操作。Hillen\
  \ 较早通过在线手册（on-line manual）进行的工作 [*91*]] 得出了相同的结论。这些奇特的发现可以扩展到何种程度是一个未解决的问题（尽管显然，该方法在极限情况下会失效）。\n\
  \n### 保护模式\n\n我们目前考虑的所有方法都是在与实际系统本身交互的上下文中提供建议。其中许多方法涉及改变系统的控制结构。另一种方法是创建一个特殊模式，用户可以在模式内解决问题并接收建议。例如，Jaagodzinsky\
  \ [*49*]] 描述了一种“侦察模式”（reconnoiter mode），在该模式下模拟系统命令的操作而不实际更改用户的任何数据。遇到问题的用户可以切换到侦察模式，通过无害的尝试来解决问题，然后返回实际系统环境继续工作。这种想法在一个名为\
  \ `NLS-SCHOLAR` 的文本处理系统中得到了实现，其中用户可以问一个“如果……”的问题，这将创建一个当前文件的临时副本并执行假设性操作，而不影响实际工作区[*92*]]，以及在\
  \ `SIGMA` 消息处理服务 [*93*]] 中。这些方法将启动侦察或“如果”会话的责任留给了用户，但我们可以对其进行扩展，想象在检测到潜在用户错误时系统建议此类建议子会话。这些方法的问题在于，通过将建议子会话放在特殊模式中，我们冒着引入用户在需要跟踪不同操作模式时通常遇到的困惑风险[94*,\
  \ *95*]]。事实上，Clark [*96*]] 报告说，他观察到的用户有时在从解决问题切换到学习模式的过程中，忘记了触发帮助请求的初衷。撤销功能的日益可用表明，保护模式的实用性与模式切换问题之间存在一种有趣的调和：实际系统环境可以成为一个尝试操作的保护环境。\n\
  \n关于建议系统设计中主动权和后果的管理，结论似乎是：我们在这里列举的所有方法（无疑还有我们遗漏的几种）都可以发挥作用。只要考虑到若要为设计此类系统建立原则性基础，还有很多路要走，目前这个结论没有问题。我们需要调查每种技术最有效的条件；我们需要理解权衡；我们需要系统地进行实证研究。\n\
  \n### 范围\n\n我们提到了错误恢复对话，但没有关注在该对话中具体应该提供什么信息。DWIM 自动修正没有提供显式信息。但可以提供信息帮助用户识别触发建议干预的具体错误。我们可以帮助用户更好地理解他们想要做什么（从目标的角度来看），或者更好地理解如何做（促进实现目标的具体步骤），或者可能更好地理解这项工作以及手头任务所处的更大背景。\n\
  \n我们从三个部分检查建议范围的问题。首先，我们查看建议对话可以措辞的不同层次：方法、目标、示例。其次，我们考虑了适当建议范围如何根据用户的当前状况（包括用户工作的问题解决背景）而变化。最后，我们简单考虑了管理对话元交流方面的问题，以激励用户关注建议。\n\
  \n### 方法\n\n\n\n\n步骤级建议可以非常直接地以字面指令的形式呈现给用户。对于传统的帮助系统，人们有一种某种共识，即呈现信息的重点应放在*如何*做某事上，提供简洁直接的指令，而不是更抽象或通用的解释和描述\
  \ [91]。智能建议设备也提倡使用步骤级对话 [23,` p. 92; 39,` p. 152`]。Burton 和 Brown 明确表示，他们希望通过呈现适当步骤的语言，含蓄地向用户建议适当的目标。\n\
  \n这种方法的一个问题在于，它放大了系统可能产生的任何错误诊断的成本。因为如果系统误判了用户的状况并建议了错误的下一步，用户很可能会被给出的建议完全带离轨道（所有后续建议的步骤也将是错误的）。如果建议的下一步（即使是正确的）与用户的预期相差甚远，就会产生另一个补充性问题。用户可能会死记硬背地执行，但对系统没有任何新的理解。另一种方法是反转\
  \ Burton 和 Brown 的策略，通过显式建议目标来含蓄地建议步骤。\n\n### 目标\n\nFikes [55] 认为，对步骤的死记描述虽然可能有助于人在某些常规情况下执行操作，但当指定的步骤序列未能产生预期结果时，它并没有为解决问题提供足够的依据。他提出了“程序目的论”的概念，对\
  \ (1) 要实现的任务和 (2) 程序中的每一步进行功能性描述。这将允许用户识别出程序可能不适当的情况，并支持新计划的重新制定。另一种方法是直接对目标给出建议。人类顾问将大量注意力放在沟通和澄清目标上\
  \ [97]。当他们未能做到这一点时，客户就会感到不满 [20]。在模拟建议系统的研究中，用户要求提供基于目标的建议理由 [38]，并且有时会拒绝那些看起来与其目标不相关的建议\
  \ [74]。目标级建议的认知要求可能高于步骤级建议，因为学习者没有在动作层面被告知该做什么，但正因为这个原因，学习可能在认知上更加详尽且稳健 [58,82]。\n\
  \n在机器工作场景 [75,76] 中，我们发现目标级建议在技术处理上实际上比步骤级建议更容易。由于任务场景的限制和其内在的目标结构，预测用户可能正在尝试做什么是直接的。但一个特定用户如何决定尝试实现这些目标则不清楚得多。我们还发现目标级建议对用户更有用\
  \ [76]。McKendree [98] 和 Singley [99] 发现目标级建议在教程情况下非常有用。\n\n一种在技术上更易于处理的方法可能是只提供*隐性*的目标级建议，然后要求用户从中生成适当的步骤。Carroll\
  \ 和 Carrithers [64] 研究的“辅助轮”系统仅仅是建议用户某个被选中的功能在训练期间不可用（他们的系统根据用户的经验和当前任务，阻止了那些被判断为过早选择的所选功能）。这种程度的建议并没有直接帮助用户决定转而尝试什么。用户必须根据其试图完成的任务和阻塞信息生成一个新目标，然后推导出实现该目标的具体步骤。\n\
  \n### 示例\n\nEdmonds [100] 强调了详细规定非常通用的层级目标是多么不明智，因为这些目标很可能随着用户经验的增加而改变。例如，用户理解系统相关目标的词汇可能会随着他们的经验发生根本性变化。Edmonds\
  \ 结论认为，应该先指定实现目标的手段，因为它们更稳定。他特别建议这种步骤级信息可以通过设计的示例来呈现，以促进向用户当前情况的类比映射 [101]。\n\n\
  RABBIT 系统 [83] 允许用户通过对实例进行连续的重构来查询数据库。然而，通过示例呈现步骤级建议可能存在问题。要区分示例中可以推广到类比领域的方面与不能推广的方面是众为人知的困难的\
  \ [102]。建议可能会变得模糊。\n\n卡内基·梅隆大学的研究已经解决了显式呈现和管理目标的问题，以避免产生此类类问题。在这些方案中，目标会被记录并随着工作的进展发布在显示器上\
  \ [58,98,99,103]。\n\n显然，建议甚至示例可以在多个层级上提供。一个人可以被确告知下一步要执行哪一个步骤，也可以仅被有关适当目标的信息并允许其从中推导出行动方案，或者被提供模拟了适当目标、计划和动作的示例。当行为（或显式的帮助请求）表明用户在复杂程序中迷失了路径时，可以建议或示例化一个目标。但当指示表明用户基本在正轨上但犯了微小失误时，就可以采用步骤。似乎提供建议的策略可能需要根据用户的需求和任务的性质而变化。例如，Paris\
  \ [104] 构建了一个系统，如果用户被判断为有经验的，则强调对象的组件和机制；如果用户被判断为新手，则强调操作和因果关系。遗憾的是，还没有行为学研究解决这个问题。\n\
  \n### 调整建议\n\nJackson 和 Lafrere [7] 敦促提供的建议类型确实应该随着任务水平而变化。定义良好的任务可能只需要像许多传统帮助系统中那样的描述性信息支持。系统功能的动画演示对于需要整合子程序的任务可能更合适，而更开放的任务可能需要动态生成的智能建议。尽管\
  \ Jackson 和 Lafrere 没有为这些建议引用具体的实证支持或心理推理，但他们的观点与已发表的少数关于提供建议的行为学研究是一致的。McCoy [25]\
  \ 讨论了专家纠正对象间属性映射误解的轶事。在她的示例中，专家提供的信息比揭示特定误解所需的要多；额外信息通常通过提出新问题的问题来确立正确的概念。\n\n\n\
  \n\nMcKendree 等人 [*95]] 研究了一个比 McCoy 模型更具程序性的领域：Lisp 计算机编程。导师/学习者二元组在不受限制的辅导情况下，处理了一系列典型的编程问题。研究人员根据导师所采用的目标和方法，对建议性对话的内容进行了分析。这种分析表明，导师倾向于根据对误解之“严重性”的判断来改变其帮助的内容。一个轻微的失误或语法错误可能只会从导师那里获得足够的信息，以纠正眼前的问题即可。然而，如果学习者的回答向导师暗示了问题更为严重，则可能会引发更广泛的解释、示例和提。尽管如此，在这项分析中，仍然清楚导师究竟是根据什么信息来确定“严重性”的。\n\
  \nPollack [*105]] 收集了关于计算机邮件系统的电子公告板查询。她注意到，寻求建议的人并不总是对他们需要知道的内容有良好的计划，例如，他们会询问关于系统中无法实现的操作。在她的研究中，其结果是，导师有时会回答一个未被要求的行动，即一个替代计划。Pollack\
  \ 将这些观察指向 Allen 和 Perault [*106]] 的“适当查询假设”，即假设用户总是拥有一个良好的计划并提出恰当的问题。这一结果表明，提供建议不能预设建议请求在某个领域内是完良好的。Hill\
  \ 和 Miller [*38]] 模拟了一个与人类导师交互的交互式智能建议系统。在这种情况下，他们发现导师往往侧于确保客户表述的即时目标和查询与长期目标（这些目标是从用户之前的查询和操作中推断出来的）是一致的。在某些情况下，建议处理了这些长期考虑，*而不是*回答一个即时的、但可能不恰当的查询。\n\
  \nAaronson 和 Carroll [*107]] 分析了与系统进行的实际建议交互，在该系统中，人类导师通过电子邮件接收查询并向其用户客户做出响应。该系统创建了一个有趣的“一次性”建议环境：客户和导师从未面对面，每次交互都由单个查询和单个响应组成。这种这种情况的特征催生了几种独特的策略。例如，大约一半的查询省略了导师回答时所需的细节。导师通过对查询背后的用户目标做出假设，或者通过提供多个解决方案以涵盖用户可能想到的各种查询范围（在其他策略之外）来处理这些不完整的查询。\n\
  \n### 辅导过程\n\n令人敬畏但同时也清晰易见的是，用户交互的整个情境定义了用户的建议需求。几位研究人员强调了将建议引导至解决问题相关的*过程*的重要性，而不是仅仅集中在对即时问题的解决方案上。例如，这被确定为用户知识和性能错误分析中的一个主要缺陷。Genesereth\
  \ [*39]] 认为，为了正确分析用户程序中的错误，必须分析整个解决问题的过程，而不仅仅是局部片段（例如错误出现之前的之前的活动）。\n\nCoombs 和\
  \ Alty [*12,*20](#C_008_c6.xhtml#r6_20)]] 发现，顾问对建议过程的组织关注太少：导师会尽快控制对话，并只允许单向信息流；他们很少包含对更广泛问题背景的解释；他们很少检查用户是否真的理解了所给建议。然而，这些问题似乎与用户的熟练程度存在相互作用。在辅导相对熟练的用户时，导师倾向于给出解释，并在更大程度上分享建议交互的控制权。这些后者的交互也被用户认为是更成功的。\n\
  \n这些更成功的建议交互往往没有明显的结构；它们看起来更具漫性。提供的信息似乎比实际需要的要多。然而，在与用户和顾问的简后报告会议上，动机往往变得更加明显。大量的信息交换使得解决问题过程中涉及的推理显性化，并允许用户通过监控和反馈参与其中。最终结果是鼓励“通过相互理解来解决问题”，用户在导师的帮助下解决自己的问题。他们得出结论，引导系统应该“支持而不是指导解决问题。这种支持应主要表现为协助在问题领域内构建和评估概念”\
  \ *[12*, p. 27]。因此，像 Fikes 一样，他们认为，随着用户对任务过程、步骤和目的知识增加而演变的建议，在遇到其他问题时将更好地帮助用户[另见参考文献\
  \ *13*]。\n\n我们对计算机顾问和用户之间建议交互的分析也支持这些结论。我们发现，表面上成功的建议交互往往并没有对解决方案进行编码，相反，“解决方案”的形式是执行的策略和计划的枚举，并排除了被判断为不那么有利的其他行动方案\
  \ [*108]]。我们还发现，产生建议的主要机制之一是*客户*提出的验证性问题：“我只是从标准输入读取；就简单吗？”因此，在某种程度上，“给出建议”仅仅意味着对已知的解决方案获得明确的鼓励\
  \ [*21]]。\n\n### 态度与动机\n\n尽管我们在这里关注的是程序、目标和步骤作为建议提供的层面，但记住建议建议发生的更大背景是重要的。低效建议中最重要的元素可能在于提供更正确更完整的信息之外。Alty\
  \ 和 Coombs [*109]] 对大学计算中心用户的建议和信息需求进行了实证调查，发现用户对中心帮助台服务满意的主要依据之一是其提供的人际接触。类似的观点也被\
  \ Eason [*110,*111](#C_008_c6.xhtml#r6_111)]] 强调过。\n\n\n\n\n显而易见，对计算机、对特定系统以及对系统建议对话框的态度将影响用户有效使用和学习系统的能力。几个演示系统已经明确地探讨了这一点。例如，Burton\
  \ 和 Brown 23 在第 89 页在 `WEST` 中提供了正向的鼓励以及批评性反馈，以激励用户。然而，这些解决动机和态度问题的尝试主要基于对这些因素是什么以及应该如何处理的直觉性分析。Malone\
  \ 112 和 Carroll 113 建议，计算机游戏中使用的激励元素（如幻想、挑战和风险承担中的安全性）可以被纳入用户界面对话框的设计中，以产生在内在上更有趣的系统对话框。然而，尽管为止，这项工作并未产生新的对话框设计。\n\
  \n### 总结\n\n人们在解决问题时通常需要建议。目前建议系统的研究侧重于用户错误背景下由系统发起的建议。这可能是一个极佳的选择；从直觉上看，这种情况下人们可能更容易接受建议，因此我们可以借此获得证明可行性的杠杆。\n\
  \n目前研究的不足之处集中在两个问题上：首先，文献中开发和描述的特定演示系统对建议交互空间的采样是有些随意的。应该在什么层级提供建议：目标、步骤、示例？建议应该伴随什么样的后果：阻塞、纠正、特殊模式？针对诸如错误之类的触发事件，建议在机上应如何安排？应该提供多少建议？建议提供策略的哪些动态方面是重要的？\n\
  \n第二类不足是，目前几乎没有任何研究工作接受过任何系统性的实证研究：建议系统（图 2）*理应*能够帮助人们解决问题，但我们目前还没有坚实的依据来认为这已经真正实现。事实上，Coombs\
  \ 和 Alty 12 最近提出了一个有趣的问题，为什么——在现在已经有了演示性建议系统的情况下——这项技术在实际应用中仍未被充分使用。他们提出这种失败可能是由于根本上缺乏可用性。Kidd\
  \ 和 Cooper 13 也表达了类似的观点。\n\n![图 2 建议对话框问题的示例](img/pg143_Image_141.jpg)\n\n图 2 建议对话框问题的示例。\n\
  \n行为证据表明，在提供建议时自发地使用了多种形式的沟通 17,20,97]。然而，对于各种风格的有效性，以及其与语境或误解类型的交互，尚未进行系统性的调查。这种在特定领域解决问题和教学方法方面的专业知识是通过经验抽象而来的，而在自动化系统中这种经验是非常有限的。构建的建议系统通常只采用这些策略中的一种，或者可能随机选择几种以改变建议风格。有必要将直觉和行为研究相结合，以系统化更有效的建议方法。\n\
  \n## 研究议程\n\n我们尝试从先验观点和当前技术水平出发，对建议系统设计中的一些关键问题进行捕捉和分类。我们能从中学到什么？我们还没有发现一个完善的范式尝试，它拥有一套高度结构化且普遍公认的标准问题集，以及一系列明确的研究成功。但这并不意外。建议提供领域既是认知科学领域也是计算机科学的前沿领域。\n\
  \n在我们看来，从中得出的主要教训涉及研究议程的管理。过多的能量被投入到存在性演示——即小规模建议技术的设计和实现。这是一个适当的早期目标，而且通过实现来研究当前的小规模建议系统是否能扩展到大型且复杂的实际应用中仍然具有意义。然而，极少系统性的努力被用于探索与建议系统相关的行为问题。事实上，建议系统的研究非常碎片化：系统研究人员不够关注其演示系统的可用性，行为研究人员不够关注实现问题，而真实建议系统的开发者又无法利用这些研究。这可能是一个致命的缺陷：即使目前技术可行性的问题通过令人惊叹的软件得到了解决，我们仍然在赌直觉，即所开发的建议设施对于真实的人来说是可用的，甚至是理想的。\n\
  \n为了避免这种赌博，建议系统的研究议程需要推进两个事项：我们需要一种关于建议和提供建议的心理学理论，我们需要行为方法论来评估演示建议系统的实际成功。我们将逐一考虑这些。\n\
  \n### 迈向建议提供理论\n\n实验计算机科学的一种方法是构建一个合理的运行系统，通过它来探索、发现和理解系统的运行原理。这是一种重要的研究方法，随着快速原型工具变得越来越强大、灵活且广泛可用，这种方法变得越来越重要。这种方法的局限性在于，在任何对用户界面有直接影响的系统设计领域，这种方法都是缺乏约束的。而且，越来越清楚的是，系统设计的每个方面对用户界面都有直接影响。因此，构建实验演示系统的方法必须增加对建议、人们如何生成和提供建议以及人们如何在问题背景下利用建议的考虑。我们目前还没有这样的通用理解。事实上，我们目前对建议和建议提供的理解（类似于我们对可用性的通用理解）要么太浅层，要么太底层。像“建议应该具有相关性”或“像人类一样表示和交流有关系统的信息”这样的高层原则，让人们想起著名但空洞的格言“了解用户”。这两者都不够深入或实用用。相反，原则也可能被编码在太低的水平。目前关于演示建议系统的许多讨论提供的设计原则仅在单个系统的语境下经过了随意的评估。但由于这些系统彼此在无数且非系统的方式上存在差异，我们实际上无法以任何信心地对它们进行比较、对比或泛化。\n\
  \n\n\n\n有用的原则适用于多种领域，同时能为特定的内容和结构提供指导。其中一个原则可能是“建议应以独立于系统的目标词汇呈现”。这一原则具有足够的强度使其具有可证伪性，并能真正约束建议功能的设计。另一个有用且可以通过实证测试的原则是“在检测到错误时提供即时反馈”。具体应该如何做到仍然是一个问题。是否应该阻止用户进行任何后续操作？允许他们查看后果？我们并不声称这些原则代表了我们所能期待的最优，甚至不断言它们是正确的（关于这些原则的证据仍然有限）。相反，我们认为此类原则是我们应该接受的`least`（底线）；它们只是一个开始。显然，在我们拥有任何可以被严肃称为“建议理论”的内容之前，还有大量工作要做，但正如我们所看到的，针对该领域的研究开始出现。\n\
  \n### 衡量建议的有效性\n\n建议系统显然是为了寻找实际应用。事实上，提供建议功能的主要理由是帮助用户变得更成功、更高效。但正如我们一直努力强调的，仅仅有善意是不够的。开发建议理论是超越单纯善意的关键，但即使如此，也无法保证设计为有效建议功能的设施在实际上确实是有效的建议功能。遗憾的是，即使在问题被承认时，提供的解决方案也可能是无用的：“以一种明智的方式实施……”\
  \ [115]。这并不是一种方法论，它仅仅强调了当前方法论的匮乏。\n\n我们需要在建议系统的开发过程中，开发、规范化并常规化行为评估技术的使用。我们绝不是认为现在有一系列丰富且强大的行为方法论可以从架架上拿来改进建议界面。事实上，有多种技术（其中一些已在本报告提到；另请参见\
  \ [116]）。然而，它们在帮助引导真实的复杂的系统项目方面的有效性，我们仍然缺乏经验来对其进行自信的评估但请参见最近的案例研究 [117, 118, 119,\
  \ 120]]。必须为该领域构建或调整适当的方法。\n\n我们提出的一个建议是，研究人员应尝试在获取可能便于量化和总结的“硬”行为数据与在帮助引导重新设计方面可能更具启发性的“软”行为数据之间取得平衡\
  \ [121]。例如，Reiser 等人 [57] 对行为评估了了关注，并对他们的 Lisp 导师的行为效能报告了非常令人鼓舞的总体统计。然而，他们没有报告任何定性细节：导师在哪些类型的错误上失败了？他们的教程设计力量有多少源于用户发起的\
  \ `Clarify`（澄清）和 `Explain`（解释）键，又有多少源于系统启动的教程？当然，我们需要知道建议设计是否真的有效，这可以通过定量来评估。但定性测量将指导进一步的研究发展。\n\
  \n一旦我们接受了衡量建议功能有效性的建议（而不仅仅是坚持），我们就可以严肃地询问给定的建议系统与其他系统相比的成本效益。如果一种方法的有效性是另一种方法的 90%，但成本（就开发时间和计算资源而言）只有后者的十分之一，那么这可能是一笔划算的交易。我们之前提到了场景机方法，它以非常大的粒度（计算机用户操作路径）对领域知识进行编码。此类系统没有将知识分解为原子，无法生成推理来做出动态响应，但它们的行为效用已经得到了系统性的证明。场景机是便宜的，但评估其有效性将涉及对用户和任务特定性的考虑。\n\
  \n建议系统的研究领域对于用户界面设计科学至关重要。该领域必须代表多种技术；知识工程和对话管理是我们过的两个关键领域。但系统设计的成功最终将取决于可用性。\n\n\
