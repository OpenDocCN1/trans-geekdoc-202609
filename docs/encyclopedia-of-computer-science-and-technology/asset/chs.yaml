  \n任何关于视觉思维讨论的“经典案例”（*locus classicus*）都是记忆法（method of loci），这是一种由希腊修辞家发明的辅助记忆技术。在几个世纪以来，它一直是许多推测和实践阐述的起点——弗朗西斯·耶茨斯（Frances\
  \ Yates）对这一知识传统进行过卓越的研究[*1*]。\n\n这个理念非常简单：选择一座复杂的建筑（通常建议是神庙），沿着某条路线走几次，记住你在路径上各个固定点所看到的内容。这些点就是\
  \ `loci`（位置），是该方法的关键。一旦你牢牢记住这条路径，并能随意调出它，就可以将其作为记忆辅助了。例如，如果你想背诵演讲稿，可以在脑海中穿过神庙进行虚拟行走。在第一个\
  \ `loci` 处，你创建一个与演讲第一个要点相关的生动图像，然后将该图像存储在该 `loci` 中。对演讲中的每个后续点重复这一过程，直到所有要点都存储在穿过神庙路径的\
  \ `loci` 中。然后，当你进行演讲时，只需从虚拟路径开始，依次从每个 `loci` 中检索你的想法。这种技术也可以用于逐字背诵演讲稿。在这种情况下，人们不是在\
  \ `loci` 处存储想法，而是存储单个单词。\n\n记忆法已成为我们“记忆提升”学说中的核心部分。此外，这种技术的有效性已经在心理学实验室中得到了验证。\n\
  \n根据认知心理学家乌尔里克·尼塞尔（Ulric Neisser）[*2*] 的说法，即使对于那些否认自己拥有心理图像的人来说，这种方法同样有效。\n\n尽管我们知道这种技术有效，但并不知道它为什么有效或如何有效，人机界面的桌面隐喻也是如此，对于未来我们视觉思维能力的计算扩展而言也是如此。我们发明的能力超过了我们理解自己发明的能力。\n\
  \n## 理解分子结构：艾尔文·吉斯（Irving GEIS）的工作\n\n请注意，虽然记忆法使用了视觉思维，但它从根本上并不是一种思考视觉对象的技术。作为一个在视觉领域思考的例子，请考虑艾尔文·吉斯（Irving\
  \ Geis）[*5*]的工作，他是一位科学插图师，在过去的三十职业中创作了大型生物分子的插图。吉斯在这方面的早期作品出现在 1961 年《科学美国人》（*Scientific\
  \ American*）的一篇文章中由约翰·肯德鲁爵士（Sir John Kendrew）编写，他是解析出肌红蛋白分子结构的诺贝尔奖得主。\n\n吉斯的任务是为这些大型分子创作绘画或图形，这些分子有许多组成部分——例如，肌红蛋白约有\
  \ 2500 个原子——其配置必须被准确描绘。在少数情况下，吉斯根据三维模型工作（如他在处理肌红蛋白时那样），但在大多数情况下，他从（计算机生成的）立体对开始。\n\
  \n在一次个人访谈中，吉斯表示在研究分子结构时，他使用了一种源自他建筑训练的练习。这种建筑练习不是在建筑中进行虚拟行走，而是在分子中进行虚拟行走。这使他能够从多个角度视觉化分子，并且除了视觉感觉外，还能对分子的结构产生一种运动感（kinesthetic\
  \ sense）。吉斯发现这种运动感如此重要，以至于他曾考虑建立一个足够大的分子模型，让人们可以进入并在其中移动，从而洞察其结构。吉斯指出，生物化学家和插图师都必须适应这种思维。为了理解分子的功能结构，生物化学家会从他们正在检查的图像中想象出各种视线。如果他们在阴极射线管（`CRT`）上有一个三维图像，他们可以指示计算机从各种取向显示分子。仅从某一个角度理解分子的形状是不够的。为了直观地理解其三维形状，必须能够从多个角度对分子进行视觉化。\n\
  \n吉斯的“分子行走”与记忆法之间存在强烈的普遍相似性。在两种情况下，我们拥不仅有视觉空间，还有运动空间。修辞家在虚拟的神庙中进行虚拟行走；吉斯将分子视为一个环境，并想象穿过该环境会是什么样子。这两个例子之间的强相似性表明，它们调用了相同的底层认知能力。\n\
  \n在对记忆法的讨论中，乌尔里克·尼塞尔认为它源于用于在世界中导航的图式（schemas）。修辞家将这些导航图式作为索引演讲中要点的工具；吉斯则利用它们来探索大型分子的复杂结构。用计算机科学的类比来说，就像吉斯取了一个导航程序，并将其应用于并非源自物理环境而是源自分子生物学的数据。同样，修辞家将该程序应用于他想要记忆的演讲要点。在所有情况下，程序都是相同的。只是运行程序的数据不同。\n\
  \n然而，在我们对分子结构进行虚拟行走之前，还需要创建视觉化分子的基本约定。目前没有办法用可见光直接照射这些分子并观察它们；可见光的波长太大，无法与分子有效作用以产生图像。一种常见的约定是将原子视为球，将原子间的键视为棒。这种在构建机械模型时经常采用的约定是吉斯经常使用的。重要的是，这种描绘模式是一种约定。\n\
  \n此外，不同的约定可以用于不同的目的。为了阐明分子的功能结构，有时需要采用某些简化图像以引起对分子功能的关注。也就是说，一个显示所有原子和键的图像可能太复杂，无法清晰显示分子的结构如何使其发挥功能。\n\
  \n让我们回到吉斯肌肌红蛋白。肌红蛋白在肌肉中结合氧分子。如果图像显示了所有 2500 个原子（包括中心孤立的氧分子），很难看出它是如何实现的。1968 年，吉斯产生了一个简化图像的想法，通过在肌红蛋白分子的主链周围套上虚拟的管，然后只描绘这个管，而不是内部的原子。这简化了肌红蛋白的图像，就像用纤维包裹树会简化树的形状一样。其效果是强调肌红蛋白分子的功能结构，更容易观察和分析允许分子捕捉并保持氧分子的折叠。正如我们不知道记忆法如何运作一样，我们也不理解创建视觉化约定的心理机制。但对艺术史的审查可以为描绘普通视觉世界所发明的约定提供一些线索，事实证明，在那个世界中视觉化约定在大分子的不可见世界同样不可或缺。\n\
  \n\n\n恩斯特·贡布里希爵[[4,5]]对西方艺术家构建写实图像的技巧和惯例一直感兴趣。与许多人（包括艺术家本人）所想的不同，艺术家并非简单地描绘他们所看到的。相反，艺术家必须发明表征惯例来构建写实图像。\n\
  \n贡布里希最有趣的例子之一是关于犀牛的描写。1515 年，著名的版画画家阿尔布雷希特·丢勒（Albrecht Dürer）创作了一幅犀牛图像，显示它身上覆盖着盔甲般的板——这一特征在任何真实的犀牛身上都不存在。1790\
  \ 年，一位詹姆斯·布鲁斯（James Bruce）发表了一幅根据实描的犀牛画，他称这幅画纠正了丢勒作品中的许多错误。但这幅画显然也描绘了盔甲般的板。它可能是写实画的，但贡布里希指出，丢勒图像的影响是如此强大，以至于在某些方面，它战胜了观察。这就好像丢勒图像中的表征惯例是一种概念装置，其他艺术家通过它来理解和解释犀牛。\n\
  \n透视画的技巧为这种表征惯例提供了一个更通用的例子。我们已经习惯了连贯的画面透视，以至于我们默默地认为艺术家创建这样的图像仅仅是因为他们在绘画某个场景时看到了它们。然而，希腊、罗马和中世纪的艺术家无法处理连贯的透视。那些技术直到文艺复兴时期才发展。但一旦这些技术发展出来，它们就被规范化并成为文化艺术传统的一部分。\n\
  \n通过研究大量的绘画和素描，贡布里希分析了许多此类惯例。他认为，这些写实渲染的惯例表明大脑通过心理对象来理解和解释世界，他将这些对象称为`schemas`（图式）。这些图式调针对各种视觉关系，即线条、形状和颜色之间的关系。各种表征惯例之所以有效，是因为它们允许艺术家创建出保留了这些图式中所捕捉到的视觉关系的图像。例如，透视渲染的惯例之所以有效，是因为它们捕捉了对我们的深度感知图式至重要的视觉关系。\n\
  \n画面表征的惯例与视觉表征的心理图式之间存在重要的区别。我们可以想象视觉图式仅存在于视觉系统中。但画面表征的惯例必须由运动系统执行。艺术家手里拿着铅笔、笔或画笔，并在绘图表面移动它。这些惯例不仅必须满足视觉图式，还必须是运动系统能够执行的。实现惯例的运动程序，实质上是对该惯例所满足的视觉图式的运动重构。\n\
  \n这种运动系统与视觉系统之间的关系并不是贡布里希讨论的内容，但它对于创作素描或绘画所涉及的思维过程显然很重要。以某种方式，必须有一种方法从代表场景的视觉图式推导出运动动作计划。大观点是，正如位置记忆法（method\
  \ of loci）涉及视觉与运动的交互一样，图像的创建也是如此。视觉思维不仅仅是眼睛看到的问题。它还涉及身体和手在视觉空间中如何移动。\n\n## 一个推测性建议\n\
  \n鉴于视觉思维具有运动成分，我提出以下推测性建议：视觉思维涉及视觉操纵活动以及在环境中运动的内化。我们在物理环境中移动，有时在熟悉的地方，有时在陌生的地方；我们处理物体，有时是为了完成特定任务，有时仅仅是为了检查物体。视觉思维涉及在想象设置中的想象运动，对想象物体的想象操纵。这些设置和物体可能是真实的但不在现场的，或者它们可能只存在于想象中。通过这种方式定义视觉思维，我是在使自己的观点与一种源自列夫·塞梅诺诺维奇·维果茨基（Lev\
  \ Semenovich Vygotsky）[[[6]]关于思维与语言关系的开创性分析。\n\n维果茨基是一位发展心理学家，他认为思维涉及使用内在语言来控制心理活动。为了简化问题，他研究了这样一个发育序列：(1)\
  \ 首先，幼儿受到成年人语言的影响，他们用语言引导孩子的活动，指出要看什么，要做什么。(2) 随着孩子学会说话，他学会了通过自言自语来引导自己的活动。(3) 过一段时间后，外部语言变得不再需要。内在语言足够稳定，使得孩子可以使用它引导行动和感知。这种内在语言是思维的素材。\n\
  \n维果茨基说明的意义在于，它涉及到外部动作的内化。外部语言需要物理活动，即语音肌肉的运动，这产生了物理影响——声波的传播。这些声波到达耳朵，由听觉器官探测并解码。维果茨基的理论（及其背后的观察）清楚地暗示，在发育的某个阶段，大脑使用一种外部通信通道（从口到耳朵的声音传播）来管理其操作。然而，过一段时间后，可以通过内部通道传输相同的信息。外部语言已经内化。\n\
  \n为了构建类似的视觉思维说明，我们可以转向乌里克·尼瑟[2]]的研究。与许多心理学家一样，尼瑟认为感知是一个主动过程。大脑并不是被动地接受外部刺激的印象，就像蜡板接受刻笔的印象那样。相反，大脑主动构建感官输入。这一过程涉及一个`感知循环`，其中代表物体的内部`schemas`引导对环境的探索以获取关于物体的信息。由此获得的信息被持续用于引导对环境的进一步探索。当感知循环被没有外部物体可用的图式激活时，就认为图像存在。例如，一个人可能在寻找手套。“手套”图式被激活了，但手套并可见。在这种情况下，人有一个手套的图像。但对尼瑟来说，这种图像与其说是脑中的画，倒不如说是为了在环境何时何地提供手套时看到并识别它们的感知准备。\n\
  \n\n\n对于尼塞尔（Neisser）来说，心理图像需要解释的是它们是如何从即时感知活动中脱离出来的。也就是说，在一个没有外部支持的情境下（即没有与激活的图式对应的外部对象），我们是如何激活图式的呢？尼塞尔建议，一种可能性是运动。感知是快速的，但运动相对缓慢。因此，当我们在熟悉的环境中移动时，我们不断地预判我们尚未看到的事物。这种预判意味着在缺乏对应对象的情况下激活了图式。我们在到达转角药店之前，预判了它的出现；在我们向药剂师递交处方之前，预判了她的出现；以此类推。尼塞尔没有提供我们如何激活这些图像的显式机制，但他的讨论使得这种机制的存在似乎是合理的。\n\
  \n## 尼塞尔与场所记忆法（Method of Loci）\n\n尼塞尔正是在此背景下讨论场所记忆法的。对于尼塞尔来说，这是一个在感知周期中缺乏外部刺激支持这些图式的情况下激活视觉图式的清晰案例。通过穿过一个环境创建的图式已经学习得如此透彻，以至于在没有环境的情况下也可以启动，并用于激活其他图式（存储在各个场所的关联图像）。\n\
  \n我们现在可以通过考虑尼塞尔对语言的阐述回到维果斯基[6]]。我们可以看到，我们的大部分图式都是多模态的，我们可以看、听、触、嗅、品尝事物。如果我们听到狗在叫，我们预计通过朝声音方向看，可能移动一下，就能看到那只狗。看到狗后，我们知道靠得更近可以闻到它并摸到它。因此，一种感官模式下图式的激活可以为其他感官模式的感知做好准备。根据尼塞尔[2]]，当孩子初学语言时，事物的名称会被同化为这些事物的通用图式。因此，当一个小孩子看到狗并听到有人叫“狗”时，孩子将该（语言）声音同化到它对狗的通用图式中。正如多模态的狗具有外、气味、质地和可触摸的形状，并发出特征性的声音一样，它也有这个奇特的听觉属性“狗”。正如狗的外观可以激活整个多模态图式，导致孩子预判某些气味和触觉感受一样，听到这个特殊的听觉属性“狗”也可以激活整个多模态图式。\n\
  \n也许名称最奇特的属性是，它是完整图式中受孩子直接控制的部分。孩子可以通过移动喉部肌肉发出“dog”这个声音，从而在完全没有任何外部刺激的情况下激活狗的图式。通过这种方式，语言赋予了我们任意操纵感知图式的能力。我们生成词汇，大声地或或者在以后，无声地，而图式则根据生成的词汇结构被激活和操纵。\n\
  \n显然，我们可以使用内在语言来唤起和操纵视觉图像，产生一种视觉思维。尼塞尔对心理图像的描述（包括他对场所记忆法的处理）表明我们可能拥有某些不依赖于内在语言的视觉思维。在这两种情况下，内向化的运动活动（无论是运动和操纵，还是发声的）都参与了思维。重要的一点是，思维是虚拟行动（virtual\
  \ action）。这意味着，如果我们思考计算机图形如何扩展视觉思维，我们不仅要考虑可以创建什么样的图像，还要考虑这些图像是如何被操纵的。在某种意义上，视觉思维始终是视觉运动思维。\n\
  \n## 关于心理图像的争议\n\n到为止，我们大多数时候都假设心理图像存在。然而，这并不是一个没有问题的假设。事实上，关于心理图像是否真实，以及如果是，它们在思维中是否起着重要作用，一直存在很大争议。我们是用语言思考，或者至少是用某种准语言的或命题的代码思考？还是我们用图像思考？命题或图像，这是主要的区别，尽管这种区别通过几乎无止境的微妙和复杂进行了限定和阐述。\n\
  \n约翰·安德森[7]）、斯蒂芬·科斯林（Stephen Kosslyn）和泽农·皮利申（Zenon Pylyshyn）[9]]讨论了许多核心问题。虽然心理实验的结果在这些讨论中起着很大作用，但很多分歧涉及哪些类型是允许的。也许由于计算提供了许多引发这场辩论的概念，处理这些基本问题最简单的方法是从计算的类比开始。\n\
  \n想象一下，一方面是一个 CAD 系统的 CRT（射线显示管），它显示着一个悦目的图像，例如齿轮组件。另一方面，我们有另一个连接到同一系统的 CRT，它显示着控制某些数控设备的程序代码片段。显然，其中一个显示的是图像，另一个不是。然而，这两个显示器都是从同一个数据库生成的，生成这些显示器的软件完全可以用相同的语言编写。\n\
  \n显示器之间截然不同——一个是在二维空间中排列的图像数组，另一个是由一维“单词”字符串组成的——这显然与两者都实现在使用命题编码的系统中这一事实并不矛盾。无论显示格式如何，所有的计算都是命题的。反对心理成像的人对人类大脑也持有类似的观点：基本过程或或少是语言和命题的，而心理图像（如果存在的话）是副现象，在思维中起的作用并不比闪烁指示灯在计算机运行中所起的作用更深。\n\
  \n可以这样构建一个反论：我们知道，从理论角度来看，任何可以想象的计算都可以在任何符合某些相当简单标准的语言中执行。更实际一点，任何可以被程序化的都可以用`Fortran`、`Lisp`、`C`、`Pascal`或`APL`等编程。但归结底，并不是所有语言都适用于所有的编程任务。`Lisp`和`Pascal`的理论等效并不等同于实际效用的等。或者，转向硬件领域，理论上任何可以在并行机器上执行的计算也可以在串行机器上执行这一事实，在所有真实计算都以有限速度进行的物理世界中并没有意义。在这个世界中，有些计算是巨大的，以至于串行执行需要几天或几周。在可能的情况下，将此类计算分成许多部分，每个部分分配给自己的处理器，让所有处理器并行运行，具有真正的实际价值。\n\
  \n所以，反论将会是，这可能适用于大脑。理论上，所有的心理活动都可以在某种语言代码中实现，但在实践中并非如此。因为对于某些活动，图像代码更有效。\n\n\n\n\
  \n这种论点在米丽姆·耶维克（Miriam Yevick）关于全息逻辑的[*11]]工作中得到了形式上的证明，这项工作在某种程度上受到了卡尔·普布拉姆（Karl\
  \ Pribram）的[*12]]将全息作为神经处理模型的模型的启发。她感兴趣的是对象的复杂度与足以识别该对象的表征复杂度之间的关系。对于几何形状上简单的物体（如正方形、三角形、十字形和圆形），某种命题形式化就足够足够了。但对于几何形状上复杂的物体（如汉字或脸部），一个充分的全息表示比一个充分的语言表征更简单。\n\
  \n一个物体或场景的全息表示在任何简单意义上，显然都不是该物体或场景的普通图像。但将其被视为一种非常特殊的模拟表示是不合理的，而且它显然与心理意象反对者所青睐的命题表征截然不同。然而，核心点仅仅在于：任何事物`can\
  \ be`被语言编码的事实并不`need not imply`大脑或神经`does in fact do so`（这样做）。自然世界中的大多数物体——人类、动物、树木和灌木等——在几何上并不简单。因此，值得考虑一种可能性：视觉所使用的比命题方案看起来更适合此类物体的表征方案。至少，耶维克（以及普布拉姆）为简单的心理意象和命题形式化都提供了一种替代方案。\n\
  \n一个简单的实证论据，也是对近期思维产生很大影响的依据，来自罗伯特·谢泼德（Robert Shepard）[*13]]及其同事进行的实验。受试者会被展示一个目标图形和另一个与其相似但方向不同的图形。他们必须比较这些图形并判断它们是否相同。谢泼德发现，受试者做出决策所需的时间与图形为了与目标图形相同方向以便进行直接比较而必须旋转的角度成正比，从而允许了直接比较。如果一个图形必须旋转\
  \ 40 度，而另一个必须旋转 60 度，那么第二种情况下做出决策的时间是第一种情况的一半倍。谢泼德将其解释为支持这样观点：受试者正在脑海中旋转该图形的心理意象。因此，心理旋转将是视觉思维中的一种基本操作。其他类型的操作（如扫描和缩放）是由斯蒂芬·科斯林（Stephen\
  \ Kosslyn）[*8]]及其同事的工作所提出的。旋转、扫描和缩放等操作很可能是视觉思维的原始操作，而较高水平的过程则由记忆场所法或内部语言等结构组织。关于心理意象的论点在于，这些操作实际上是原始的，还是说它们是以某种尚未发现的命题形式的神经编码实现的。\n\
  \n## 来自神经心理学的某些证据\n\n视觉系统是大脑内研究最彻底的系统之一（最近由大卫·休贝尔（David Hubel *[14]]回顾过）。大致来说，该系统始于视网膜，延伸中脑，然后进入大脑皮层。连接两个视网膜到大脑的视神经每条包含约百万根纤维。初级视觉皮层占据大脑皮层面积的约\
  \ 3%，但它包含了皮层中估计 500 亿神经元中的 10%，并被二级和三级区域包围，这些区域与视觉处理密切相关。据估计，每个神经元直接连接到 1000 到 10,000\
  \ 个其他神经元。视觉大脑的不同区域由巨大的纤维束连接，这些纤维的构建方式使得从一个区域到另一个区域存在映射，从视网膜到中脑，再到初级视觉皮层。即在一个区域具有特定空间关系的神经元投影到另一个具有相同空间关系的神经元。（注：根据戈登·蒙特卡塞尔（Gordon\
  \ Mountcastle [*15]]，这种映射可能适用于所有皮层区域，而不只是视觉区域。）\n\n来自视觉场右侧的感知信息在左半球处理，而来自视觉场左侧的信息在右半球处理。当我们考虑神经心理学中最戏剧性的证据之一时，应该记住这一点。这些证据表明，大致来说，优势半球（右用手者为左半球）似乎擅长语言任务，而劣势半球（右用手者为右半球）似乎擅长视觉任务。由于两个半球都参与视觉感知，因此理由认为这些证据是关于大脑如何`elaborates\
  \ on`（详述）感知结果的，它是关于视觉思维问题而非视觉感知的问题。\n\n这许多证据源于罗杰·斯佩里（Roger Sperry）对脑裂受试者进行的研究[*16]]）。虽然有少数人出生时左右大脑半球之间没有直接连接，但这些人大多数是由于治疗极度严重的癫痫而接受了脑裂手术的人。一旦大脑半球相互断开，就可以选择性地向任一半球呈现信息，从而研究两个半球的能力。通常情况下，在这种情况下，一个半球不知道另一个半球在做什么。这就像是一个人现在有两个不独立的思想。\n\
  \n优势半球被证明在说话、写作和计算方面表现更好。劣势半球被证明在视觉任务上更熟练。例如，如果将一个简单的立方体线条图展示给受试者的左半球，受试者将无法画出非常的副本。如果将同一图展示给右半球，受试者几乎没有困难就能画出一个立方体的良好副本，尽管他们必须用左手执行绘图，而左手通常不用于此类任务。劣势半球在触觉区分物品以及匹配触觉和视觉刺激方面也更优，这似乎在视觉思维的视觉操作方面很重要。在这一背景下，回到记忆场所法是有用的。显而易见的推测是，它涉及两个大脑半球之间的交互。心理场所建立在劣势（视觉）半球中。然后通过与相应的语言概念相关的生形象，将这些场所与优势（语言）半球中的构想联系起来。因此，这种方法利用视觉半球作为语言半球材料索引和检索的系统。因此，记忆场所法是视觉思维和语言思维相互作用的一个例子。\n\
  \n\n\n\n比喻是这种交互的另一个例子。比喻通常会唤起形象。考虑这样一个陈述：“阿基琉斯在战斗中像一只狮子。”这个比喻的意义在于阿基琉斯和狮子的战斗风格是相似的：敏捷、激情且疯狂。Benzon\
  \ 和 Hays 认为，这种风格在概念上被分离的过程是一个视觉过程，其中阿基琉斯战斗的心理图像通过狮子战斗的图像进行了`filtered`（过滤）。然而，控制这一过程的机制是一种语言机制，即词语序列“阿基琉斯在战斗中像一只狮子”。在这种情况下，我们看到的是语言过程控制着视觉过程。\n\
  \n作为语言/视觉交互的最后一个例子，考虑描述一个物体或场景的过程。场景的组件必须被命名，它们之间的关系必须被指定，并在周围附上适当的属性——“天空是蓝，松树高大而翠绿，鹰在飞过炽热的太阳时在池塘面上投下了阴影。”这样的词语序列是视觉对象的语言重构。某种表征形式（视觉）的东西在另一种表征形式（语言）中被重构。\n\
  \n最后这些例子——记忆宫殿、比喻和描述——似乎都涉及语言过程与视觉过程之间、主导半球与非主导半球之间的交互。这种交互对于所有使用视觉对象进行、关于以及通过视觉对象思考的最简单形式，都可能至关重要。\n\
  \n最后，为了对质疑视觉形象存在的人公正，我们应该意识到，所有关于半球差异的证据都没有真正回答他们关于心理过程中什么是绝对原始的的问题。这些证据仅告诉我们，两个半球对于不同领域的任务经过了专门化。它并没有告诉我们这些任务在任何一个半球中是如何实现的。视觉半球完全可能在使用一种`propositional\
  \ code`（命题代码）来完成工作。两个半球由相同类型的神经元组成，并排列成相同的组合，这一事实表明两者都执行了相同的原始操作。这是心理形象的支持者和反对者都必须考虑的问题。\n\
  \n## 视觉思维、科学与创造力\n\n由于科学是在理性的王国建立的，许多思想者对直觉性的视觉思维方式发挥重要作用的情况感到好奇——仿佛理性理论的起源于“非理性”直觉是一件很奇怪的事情。最著名的例子之一是库仑在\
  \ 1865 年发现苯环结构。那个关键的想法，即苯是环状结构，是在库仑的一个梦中出现的，梦中他看到一条蛇咬了自己的尾巴。没有理由怀疑这个故事，我断言，不必怀疑通常从中推导出的结论的合理性，即可视化和无意识思维过程（如做梦）对科学创造力来说都是重要的。然而，我们完全不理解库仑的无意识是如何产生梦中图像的，也不理解库仑的意识是如何从对梦图像的回忆到问题的解决方案——苯结构的。\n\
  \n考虑另一个例子，爱因斯坦给雅克·哈达玛（Jacques Hadamard）的一封信，哈达玛正在研究创造过程，并向许多数学家和科学家询问他们的心理过程。爱因斯坦断言：\n\
  \n> 词汇或语言，无论书面还是口头表达，似乎在我的思维机制中不起任何作用。似乎充当思维元素的实体是某些符号和或多清晰的图像，这些图像可以被“自愿地”复制和组合……上述元素在我身上是视觉类型的，有些是肌肉类型的。传统的词汇或其他符号只有在上述关联游戏被充分建立并可以随心所欲地复制的次要阶段，才需要费力去寻找。\n\
  \n注意爱因斯坦不仅提到了视觉元素，还提到了肌肉元素。正如记忆宫殿或 Geis 对分子结构的思考一样，视觉思维也与动作思维相关。\n\n最近，Arthur I.\
  \ Miller 对视觉形象在这一世纪物理学发展中所起的作用产生了兴趣。他对量子力学发展的讨论特别有趣，因为关于适当的可视化问题引发了巨大的争议。人们如何将那些有时像波、有时像粒子的东西可视化呢？玻尔原子可以很容易地被视觉化为一个微型太阳系统。然而，这种可视化变得站不住脚，亚原子物理学在没有适当可视化的情况下进行了约二十年，直到\
  \ 1949 年，理查德·费曼（Richard Feynman）引入了用于可视化量子力学事件的图表约定。Miller 指出，玻尔原子可视化（`Feynman diagrams`）是源自普通感知世界（运动中的简单机械物体）的可视化，而费曼图在视觉上是抽象的，且与普通的现象现实无关。因此，量子力学的发展涉及放弃了一套可视化惯例（转向纯粹的形式和数学阐述），然后回归可视化，但使用了新的惯例。\n\
  \n哈达玛和 Miller 都没有提供科学创造力的实用手册——那不是他们追求的。他们感兴趣的是科学中非语言的、通常是视觉的思维的作用。然而，其他人如 William\
  \ Gordon、Kurt Hanks 和 Robert McKim，则对促进视觉思维练习作为一种创造力手段感兴趣。以这种或那种方式，这些练习（通常源自课堂和咨询实践）旨在绕过语言和/逻辑思维过程。人们可能被要求想象用砖头可以做的各种事情，或者用一叠扑牌牌建造一座桥。Betty\
  \ Edwards 主要关注通过使用设计的练习来教人们画画，这些练习旨在防止语言过程干扰视觉工作。在其中一项练习中，一个人被要求复制一张倒置的图片，这使得无法立即识别（即命名、口语化）图像中的组件。通过这种方式，人们被迫画出他们所看到的，而不是他们所知道的。然而，Edwards\
  \ 开发了一些更倾向于通用构思的练习。例如，人们可以画出表达特定心情或情绪的抽象图像。\n\n另外两个思想家提倡一种特定的视觉技术。Tony Buzan 谈论`mind\
  \ maps`（思维导图），而 Gabriele L. Rico 谈论`clustering`（聚类）。在两种情况下，想法是相同的。与其以大纲的形式组织想法和笔记，不如创建自由形式的图表来描述想法之间的关联关系。写下一个术语（或者在\
  \ Buzan 的情况下，画一个小草图），然后在附近写下相关的术语、短语、概念，用线条连接紧密关联的想法。结果是相互关联的想法构成的蜘蛛网。这种形式的笔记和构思比创建和完善大纲要灵活得多，因为后者对思维施加了固定的层级结构。\n\
  \n\n\n不难看出这种技术在精神上与记忆宫（method of loci）相似。但是，记忆宫使用一个想象的固定路径作为存储和检索一系列思想的机制，而这种技术以一种方式排列思想，允许你探索并思考通过这些思想的多条路径。这些图表与认知科学领域的许多研究者提出的认知组织模型认知网络结构也有程度的相似之处。如果假设自然语言语义采用认知网络模型，那么聚类和思维导图似乎是一种用于视觉化呈现和探索个人言语及命题宇宙结构的技术。最后这，创造力的一个重要方面可能不仅仅是视觉化思维，而是能够在视觉和言语模式之间高效来回的能力。\n\
  \n## 作为思维工具的图像\n\n感知和思考视觉世界是一回事。创造想象的视觉世界并对其进行思考则略有不同。但在这两种情况下，我们都在思考分布在空间中的物体。然而，图像被以更抽象的方式作为思维工具。\n\
  \n基本思想非常简单。许多非常简单的视觉图像被用来表达思想。这些图像中的每一个都可以被视为一种“视觉谚语”，一种可以在不同概念领域中多样应用的视觉图像，就像我们引用普通谚语一样。例如，考虑三角形。语言学家可能会使用三角形来视觉化一个单词、该单词所指的物体、以及用于识别该物体所采用的感知图式之间的关系。但对于基督教神哲学家来说，三角形可能被用来视觉化父、子和圣灵之间的关系。这些是截然不同的概念领域，但三角形在这两个领域中都具有概念价值。因此，三角形是“视觉谚语”的载体。哪些视觉属性使其成为一个用于思考的有用图像？其他简单的几何形状，如正方形、十字架、圆形或螺旋线呢？除了这些简单的形式之外，更复杂的图像呢——例如，爱尔兰诗人威廉·巴特勒·叶芝对一个由两个交织圆锥组成的图像印象非常深。\n\
  \n当然，这些形式在所有文化用于宗教、艺术和装饰目的的视觉符号中都很常见。我们现在问的问题是，这些形式如何帮助我们组织可能并非本质上视觉化的经验和思想，这些思想可能与外部世界的感知没有直接联系。我们如何利用这些形式进行思考？这与爱因斯坦声称其自己思维过程根源的“或多清晰的图像”相似吗？我们能将费曼的量子力学图表视为此类意象的严谨发展吗？从另一个角度来看，这些视觉形式是我们许多人经常做的看似无目的涂鸦的实质。但涂鸦是无目的吗，还是说它是一种视觉化思维的形式？\n\
  \n寻找这些问题答案的一个至少起点是儿童绘画技能的发展。霍华·加德纳 [[27]](#C_021_c19.xhtml#r19_27)] 报告说，在尝试进行表现性绘画之前，儿童会花费大量时间绘制简单的几何图像——圆、正方形、十字架、箭头等等以及它们的组合。这种活动只涉及图形形式的创建和细化，而不涉及使用图形形式来代表物体和场景。在加德纳看来，孩子正在学习图形媒介的属性。（注：原文此处有大量重复句子，已在翻译中去重）。\n\
  \n\n\n\n大多数图形界面都是二维的。显示器是二维的，用户通过在二维表面上移动某些指向设备（鼠标、光标或触写笔）以二维方式与之交互。然而，在某些应用领域，人们希望拥有三维界面。提供三维显示并不容易，但通过三维领域的二维投影进行操作无疑是可能的。不过这仅适用于显示。提供三维输入是另一回事。在这里，人们真的希望能够在三维空间移动某些输入设备，并将坐标直接输入计算机。James\
  \ Foley [[29]] 研究了许多可能性。\n\n最有趣的设备是带有传感器的手套，它可以捕捉手部和手指运动的信息，允许手部和手指在三维空间内自由移动。这些信息可以用于引导计算机内“虚拟手”的运动。目前正在致力于为这种手套提供触觉反馈。力反馈也会有用，尽管这是一个更困难的问题。\n\
  \n在许多应用中，三维界面都有价值。最明显的例子涉及设计领域。使用实体建模系统的工程师可以受益于允许其直接操作形状的界面，而不是通过键盘发出命令。通过适当的三维界面，工程师将能够“抓取”用于构造形状的几何基元（球体、圆体、锥体、立方体等），手动组合它们，然后拉伸、折叠并压缩生成的实体以达到所需的形状。\n\
  \n使用计算机图形系统测试新药物可能结构的药物化学家也有类似的直接操作需求。药物的制造过程本质上是合成一种分子，其形状允许它在适当的生物“锁”中充当生物学“钥匙”。对于化学家来说，物理上直接操作一个（拟议的）分子比从键盘输入形状操作命令要容易得多。\n\
  \n三维界面在探索性数据分析中也可能有用，在这些分析中，统计学家正在探索按 3、4、5、10、15、50 或更多维度组织的数据集的结构。由于高维数据集的探索在根本上是困难的，因为要有效地展示超过四个维度的组织数据极其困难（通常是将其中三个维度映射到三个空间维度上，并将一个维度映射到时间上）。探索性数据分析的目的是创建分析高维数据集的技术。拥有三维界面显然不会直接增加感官可用的维度数量，但它会更容易探索和操作那些已适当地压缩到三个空间维度上的数据。\n\
  \n视频技术提供了将三维信息输入计算机的不同方法。人们使用视频系统，用户在物理空间中的运动被捕捉并投影到仅存在于计算机内部的视觉世界中，并在显示极射线管（CRT）或投影屏幕上查看；适当的软件分析运动图像以获取三维运动的信息。人的手或整个身体的图像可以出现在\
  \ CRT 上，在计算机定义的虚拟世界中移动并操纵物体。Myron Kruger [[30]] 一直在致力于此类环境，主要将其作为交互式艺术的形式。此类环境显然可以用于任何三维运动和操纵有用的应用。例如，人们可以使用这种技术使用户能够像\
  \ Geis 所描述的那样，“穿过”生物分子的结构。或者，建筑师可能会用它来“穿过”正在设计的建筑。\n\n此时，计算机已变成了一个“剧场”，心灵在其中投影图像。然而，这些图像的创建、操作和探索是通过物理动作完成的，这些物理动作被捕捉并投影到计算剧场中。我们现在对“视觉思维是物理运动和操作的心理模仿”这一观点产生了一种奇特的反转。现在，物理动作被用于操纵纯虚拟的对象和探索纯虚拟的空间。\n\
  \n## 计算世界的视觉本质\n\n很少有概念领域比计算机科学世界更具视觉性。因此，视觉思维对于更深入地理解这个世界是必要的，而且可视化这个世界的惯例非常重要——而且它们无处不在。计算机科学世界一个特别有趣的方面是，它既是物理的（硬件），又是抽象的（算法和数据结构），可视化惯例在两个领域都存在。\n\
  \n在最具体的层面，我们有非常复杂的物理设备——半导体芯片、电路板、磁盘驱动器等——这些设备必须经过设计，任务任务根本上说是视觉性的，尽管绝不仅限于此。更有趣的是，视觉意象告知了计算理论中更抽象的材料。图灵关于一种在无限长纸带上读写设备的比喻是视觉性的，而且它是计算思想的基础。串行处理与并行处理的区别是另一个引导可视化的基本思想。\n\
  \n在不那么抽象的层面，我们有逻辑图来使实现在电路和软件中的计算元件的基本功能结构可视化。虽然计算电路的物理形状取决于实现它的技术，但电路的逻辑结构独立于这些物理结构的细节。这种逻辑结构被记录在逻辑图中。图对于软件同样重要。流程图描述算法，而树和网络则描述数据结构。从硬件组织的几个层级到软件组织的几个层级，计算技术是视觉丰富的。\n\
  \n但这种丰富性无法简单地通过空间术语来理解，无论空间中存在多少维度。计算从本质上来说是一个过程；它发生在时间和空间中。因此，充分的可视化必须是动画的。因此，像\
  \ Marc Brown 和 Robert Sedgewick [[31]]这样的研究人员一直在开发用于算法动态行为可视的技术。这些技术具有明显的教育应用，因为动画可以帮助学生对不同算法的工作原理获得直观的感觉。这些相同的技术在算法的设计和分析以及作为编程和调试工具方面也具有潜在价值。\n\
  \n最后，我们应该考虑 Seymour Pappert [[32]]的工作，他一直致力于通过 `LOGO` 编程语言构建的高度视觉化且交互的环境向儿童教授编程和数学。他发现学生喜欢在这样的环境中工作，并且他们学得快速且有效。即使是对数学表现出反感的学生，对于向计算机发出指令在\
  \ CRT 屏幕上移动图形“乌龟”的机会也反应得良好。学生在观察和控制 CRT 屏幕上图形对象的运动和创建时获得的经验，为更抽象知识的生长播下了种子。\n\n\n\
  \n\n因此，正如计算是一个高度视觉化的世界，它内部包含了对该世界进行可视化的技术。引用小说家约翰·巴斯（John Barth）的一句话：宝藏的钥匙就是宝藏本身。计算的世界是全新的，而且对大多数人来说，是极其奇特的。只要这个世界能够通过视觉方式被理解，计算本身就可以为构建视觉化提供手段。\n\
  \n## 回到未来\n\n预测未来是众所周知的，而且通常是徒劳无功的。在视觉化思维方面，有两个相互关联的未来需要预测：我们对视觉认知和神经心理学理解理解的未来发展，以及计算机图形和图像处理的未来发展。对于这两个领域或它们之间的相互作用可能带来什么，我认为进行泛泛推测毫无意义。\n\
  \n然而，如果我们想思考这种相互作用以及它为视觉思维的计算扩展所开启的可能性，我们应该考虑另一个问题：文化背景。视觉思维可能发生在个体的脑海中，但这些个体存在于文化之中。而所有文化都有其特有的做事方式和思维方式。\n\
  \n我们必须面对这样一个事实：我们继承了一种对视觉化持深层矛盾态的知识文化。这种矛盾心态无疑将影响视觉思维的计算扩展。\n\n西方文化双重植根于古代以色列和古希腊。在我们宗教传统的中心，有《旧约圣经》中禁止偶像的禁令。在中世纪基督教教会，关于教堂是否应该装饰宗教人物的画像和雕塑曾存在巨大争议。我们的哲学也具有类似的偏见。无论希腊艺术是多么辉煌，他们的哲学都怀疑这种辉煌。柏拉图认为艺术是对现实的模仿的模仿；因此，它是如此地不可靠，以至于艺术实际上必须被视为一种谎言。从那时起，艺术无论何种形式（视觉或口头），都必须证明自己，证明它从根本上不是一种欺骗。\n\
  \n然而，正如恩内斯特·贡布里希（Ernst Gombrich）在《艺术的故事》[5*]]中所指出的，古代中国人对图像持有完全不同的态度。他们制作了极其精确的宗教人物雕塑——旨在准确地描绘他们在各种冥想状态下的样子——并使用自然景观的绘画作为冥想的对象。因此，我们不能辩称我们古代对视觉图像的矛盾态度是图像本质固有的。相反，这种矛盾态度存在于我们文化的古根中，但并不一定存在于其他文化中。\n\
  \n这种矛盾心态并没有消失。艺术对于当代哲学家来说，就像对于柏拉图来说一样是一个问题。知识分子对电影和电视的怀疑态度，可能与对图像的矛盾心态有关，也可能与这些媒体中的编程内容有关。正如拉里·斯马尔（Larry\
  \ Smarr）[33*]]所出的，使用计算机图形描绘数值模拟结果的科学家，必须面对那些认为只有分析方法才有效的同事。当这些同事谈论数值方法“不优雅”并担心此类解决方案的近似性质时，人们无法避免一种感觉：他们对这项工作表现出的怀疑，恰恰是因为这项工作如此依赖视觉思维，仿佛那些通常非常令人愉悦的抽象图像有诱导我们陷入谎言的力量，因此必须予以抵制。最后，在一篇回顾计算机图形在生物化学中应用的中，J.\
  \ E. Dubois、D. Laurent 和 J. Weber 指出，怀疑者怀疑图形呈现的价值，倾向于强调底层计算模型的作用。他们非常确信怀疑者是错误的；图形呈现是必不可少的。看来，怀疑者只是在回响对视觉化长期存在的文化偏见。\n\
  \n对现代科学起源背景的考察表明，这种怀疑是错误的。人们普遍认为，文艺复兴的第一次盛开是在 14 世纪和 15 世纪的视觉艺术，而最后一次盛开带给了我们现代科学，并在艾萨克·牛顿的作品中达到巅峰。J·布罗诺夫斯基（J.\
  \ Bronowski）[35*]（关于达芬奇的文章）和欧尔文·吉斯（Irving Geis）[33*]（关于解剖的文章）都表明，是艺术家将注意力转向了自然。古代和中世纪科学并非经验科学，而是从哲学原理推导出来的。这种矛盾心态对于限制我们的利用是遗憾的。随着越来越多的人发现图形化是必不可少的，他们将形成一个愿意支持它的群体。也许在图形化的背景下，我们最终将看到它的全面发展。\n\
