  \ (1987)。\n\n**JOHN M. CARROLL**\n\n**JEAN McKENDREE**\n\n# 知识工程设计与构建\n\nDOI:[10.1201/9780368114957](https://doi.org/10.1201/9780368114957)\n\
  \n## 知识及其工程\n\n对知识的追求与人类一样悠久，没有知识，我们就无法控制周围物体。正如孙子在公元 5 世纪所言，让君主能够感知、直觉并预测超越凡人的东西就是知识。培根将其总结为“知识就是力量”。\n\
  \n在这方面，贝尔认为在后工业社会，信息是变化最大的资源，作为一种主要公理是知识编码的战略资源。公共知识是以出版形式出现的知识，由独立于特定主题的基础原理、公理和定义组成，即通用理论。私有知识通常是特定领域专家内化并在日常工作中使用的知识，包含了主题相关的事实、启发式方法和信念。\n\
  \n## 专家系统\n\n目前编码公共和私有知识的唯一已知方法是使用基于知识库的人工智能技术。当这些系统包含的知识主要从人类专家处获得时，这些系统被称为专家系统（ES）。\n\
  \n\n\n\n所有这些以最通用形式存在的知识（图 1）都包含在专家系统（ES）所谓的知识库中[4]，而这些知识库与它们处理的推理过程相分离，这也许是这些系统最显著的结构特征。\n\
  \n![图 1 包含不同类型知识、事实和信息的专家系统知识库](img/pg154_Image_142.jpg)\n\n图 1 包含不同类型知识、事实和信息的专家系统知识库。\n\
  \n通常，设计和运行基于知识的系统（特别是专家系统）的过程被称为知识工程。\n\n这种工程的独特之处在于，它需要调用专门的判断和专家行为，这些行为超出了通常与标准软件开发项目关联的范围。因此，知识/信息工程师必须具备执行以下任务的能力，这些任务在图\
  \ 2 [5]中列出：\n\n![图 2 IDEAL 方法论](img/pg155_Image_143.jpg)\n\n图 2 IDEAL 方法论。\n\n1.\
  \ 评估并识别潜在应用，在投入大量精力尝试分析之前，诊断出那些简单易见的问题。\n2. 从专家处提取私有知识，并从任何存在的地方提取公共知识。\n3. 在尝试实施之前进行彻底的分析。\n\
  4. 通过选择合适的知识表示方法，设计、构建和验证知识库。设计并构建问题模型并随后对其进行验证。\n5. 定义问题空间，即执行搜索所需的各种和算符。当问题结构恰当时，这些元素是已知的。当问题结构较差时，这些某些元素会缺失或未知。\n\
  6. 放宽某些限制。\n7. 使用启发式方法来缩小搜索空间。\n8. 如果问题太大太复杂，则使用简化技术或将其分解为子问题。\n9. 使用学习技术和类比，即使用先前的知识。\n\
  10. 选择正确的工具以成功完成上述任务。\n\n这些任务的关联出现在后续关于方法论的章节中。\n\n## 构建专家系统的方法论\n\n## 引言\n\n根据尼采[6]的的话，“最宝贵的财富是方法。”伟大的方法论家笛卡尔[7]在其《指导心灵的规则》（Regulae\
  \ ad Directioem Ingenii）的规则 IV 中指出：“方法对于研究真理是必要的。”出于这些原因，我们在这里介绍一种引导专家系统创建和运行的方法。这种方法被称为\
  \ `IDEAL`，是其组成阶段的缩写（西班牙语为：*I*dentificaciôn 识别、*D*esarrollo 开发、*E*jecución 执行、*A*ctuacôn\
  \ 实施、*L*ogro 达成），其结构化安排见图 3 [8]，包含以下阶段：\n\n1. 应用的识别与选择以及方案的构想\n2. 原型的开发\n3. 完整系统的执行与构建\n\
  4. 实现系统与现有系统的集成以及技术的吸收\n\n图 3 显示了左侧影响该方法正确运行的负面因素，通过虚线连接到代表不同阶段的方框。为了取得成功，必须克服或至少减轻这些负面影响。右侧通过实线连接到方框的是的是整个过程中的积极、动态元素。\n\
  \n![图 3 IDEAL 方法论](img/pg156_Image_144.jpg)\n\n图 3 IDEAL 方法论。\n\n### 第一阶段：应用的选择\n\
  \n在这一阶段，我们必须考虑两类问题：\n\n#### 直接问题\n\n人工智能用户发现通常很难描述一个问题能够被专家系统（ES）充分解决的特征。然而，一个考虑开发专家系统的组织需要回答的第一个问题是：专家系统方法是否能够在特定问题中高效地工作？\n\
  \n尽管对于这个重大问题没有简单明确的答案，但定义一些已被证明可接受的行为准则并不困难。只有在特定情况下，开发专家系统是可能的、充分的且合理的时，才应该考虑专家系统技术。\n\
  \n专家系统处理的特定问题的特征条件总结在三条启发式规则中：\n\n1. 如果真正的专家愿意在合作中提供必要的经验以达成双方都能认可的解决方案，并能够创建他们自己的工作方法和程序来建立案例，且任务结构恰当、不很困难（只需要简单的认知专业知识），并且最后它要么是研发案例还是实际案例（但两者不兼顾），那么开发专家系统是可能的。\n\
  2. 如果专家必须在敌对、艰苦且不令人满意的环境中工作，或者人类专家缺乏或过度，或者在不同地点同时需要专业知识，如果预期会有高投资回报，或者没有替代方案，或者传统的算法编程既不可行也不如意，那么构建专家系统是合理的。\n\
  3. 如果任务是复杂的并需要符号操作和启发式解决方案，且它或可以缩小到可管理的范围内并具有实用价值，如果不需要寻找基础性解决方案，且所需的知识量大到需要使用数据库，并且专家系统能够满足长期需求，如果其引入的影响是可以计划的且应对的专家系统构建项目不会与其他项目冲突，那么构建专家系统是合适的。\n\
  \n#### 间接或衍生问题\n\n仅仅判断是否可以使用知识工程技术处理问题并使其在日常环境中解决是不够的。除了基本的技术考虑外，我们必须考虑可能抑制该技术使用的其他问题。这些问题总结在第四条启发式规则中，该规则试图确保系统的成功。\n\
  \n*4. 如果管理者了解项目并热切接受它（持有现实预期），且标准程序的更改微乎其微，且终端用户愿意接受专家系统的引入，并确保结果不会产生政治后果，那么在一个全球项目目标已充分整合且已完成适当技术转移的领域，项目的成功是有保障的。*\n\
  \n一个旨在上述方法论的项目正在马德里理工大学信息学院（Facultad de Informática）的人工智能实验室开发。在写作期间，具体的方法论和应用正在定义中。\n\
  \n### 第二阶段：原型的开发\n\n\n\n\n正如 Waterman [9] 所述，以一种复杂且实用的方式，专家系统（ES）的演化与其构建工具相似。专家系统通常从一个小型实验原型开始，以证明问题的可行性，让资金来源放心，并验证关于问题定义、范围和表示的一些观点。许多专家系统变成了中等规模的研究原型，能够从许多测试用例中提供可接受的证据。另一些在用户社区解决实际问题的步骤中通过验证修订后，发展为中大型规模。在这种情况下，它们变成了现场原型。当原型可靠时，它能提供良好的服务和友好的界面；当程序经过充分测试且足够大时，可以使用更高效、可移植的语言进行重新实现，以提高速度并减少存储需求。最近，这些原型中的一些已经在领域得到了应用。\n\
  \n增量式方法意味着系统本身可以帮助开发工作，构建者可以在实现初始方面和不同的开发原型时利用他们所学到的知识。\n\n毫无疑问，有时对问题重新设计或重新实现是明智的。例如，如果知识库达到了无法管理的规模或控制，变得运行缓慢且更加困难，那么知识工程师和专家应该重新检查问题，并可能重新设计初始的表示方案。\n\
  \n### 原型开发阶段\n\n尽管我们无法指定构建专家系统时应遵循的精确步骤，但我们可以描述系统开发的不同阶段，以及每个阶段的不同活动。为此，[9,10] 原型开发可以被视为一组五个高度独立且重叠的阶段：定义、概念化、形式化、实现和验证。尽管如此，虽然从教学角度来看，区分这五个阶段是方便的（见图\
  \ 4），但并没有简单的方法可以以恰当的方式来描述它们。\n\n#### 定义\n在这一阶段，知识工程师和专家确定问题的特征。为了做到这一点，他们必须识别问题本身：它的类型和范围；开发过程中的参与者；一组用于证明原型操作充分的测试用例；以及必要的资源（涉及耗时情况、计算设施和专家的可用性）。然后，必须描述要构建的原型的目标或目的，以及如何改进服务和分配专业知识。最后，必须建立成功标准，确定实际最终用户，并提供问题的详细示例及其可接受的解决方案。\n\
  \n![图 4 专家系统的开发阶段。](img/pg159_Image_145.jpg)\n图 4 专家系统的开发阶段。\n\n在所有这些活动中，开发者发现识别问题及其适当范围是最的；通常提出的问题太大或太复杂，必须首先将其缩小到可管理的规模。\n\
  \n#### 知识概念化\n一旦确定了领域，下一步是清晰地定义知识的概念。构建高效专家系统所需的知识并对其进行结构化以便于利用，通常会阻碍专家系统的开发。直到为止，还没有自动的方法可以这一点，除了一些旨在构建专家系统的简单辅助工具，这些工具能够从示例中提取规则。因此，必须考虑知识工程师如何从专家那里获取知识。\n\
  \n知识工程师和专家必须共同努力解决特定问题。通常，专家很难在通用知识框架内表达他们解决特定问题时使用的方法或规则。这是因为他们倾向于建立自己的结论，并用通用术语描述他们使用的推理，这太广泛了，无法允许计算机进行有效的分析。专家应该具备基础知识元素，并能够快速地组合这些元素，以至于难以描述每一步的处理和联系，他们甚至可以忽略单个步骤。这些方面代表了“经验的悖论”，可以定义为：最合格的专家无法描述他们在解决问题时使用的知识。\n\
  \n专家知识似乎是经过编译的，也就是说经过重新制作和简化，并以高效的形式呈现，这使得提取变得更加困难。当专家在经验范围内解决问题时，他们将新情况识别为他们已经熟悉的状态，如图\
  \ 5 所示[9]。然而，当专家面对新情况时，他们的行为就像明智的初学者。他们倾向于应用（见图 6）通用原则和演绎步骤，这些步骤为解决问题的序列中的几个步骤之间提供了因果联系。\n\
  \n![图 5 专家系统在熟悉情况下的问题解决。](img/pg161_Image_146.jpg)\n图 5 专家系统在熟悉情况下的问题解决。\n\n![图\
  \ 6 专家系统在新颖情况下的问题解决。](img/pg161_Image_147.jpg)\n图 6 专家系统在新颖情况下的问题解决。\n\n有两种方法或方法组来衡量服务的呈现并发现经验：观察或实验方法，以及直觉方法。实验方法包括观察专家解决现实问题，注意不要说或做任何影响专家方法的事。思维协议经常被使用。知识工程师在会议结束后对转录进行分析，可能有专家的帮助。这种方法由于过程描述中的巨大空白而会遇到实际困难。研究人员很难填补这些空白，而且如果他强迫专家变得更加显式，所实现的推理路线可能无法反映实际使用的解决方案技术。在对问题产生了一定感觉后，知识工程师可能会开始用半形式语言描述他们认为在解决问题的会议中发生了什么。\n\
  \n直觉方法取决于专家对该领域的内省式分析。在某些情况下，知识工程师调查或与专家互动以熟悉他们的解决方法，并成为一个伪专家，开发出一种经验的表示，随后与专家进行验证。在其他情况下，真正的专家作为其自身行为理论的构建者，并尝试将这些直接整合到信息系统中。问题在于专家在描述实际技术时遇到的困难。在这些情况下，一种有效的方法可能是：计算机可以从它或专家给出的解决方案的基础上，为特定案例提供通用解决方案的支持程序。这种方法与关于学习的长期工作密切相关。\n\
  \n\n\n\n通常，知识工程师将依赖访谈技术（图. 7），这种技术结合了上述两种方法。例如，专家在解决问题时会进行内省；并大声说出操作方法。在认为必要时，知识工程师会对其进行引导，提出重要问题以鼓励和支持专家，建议可能的原因并假设概念和规则。\n\
  \n![图 7 通过访谈技术结合各种方法。](img/pg162_Image_148.jpg)\n\n图 7 通过访谈技术结合各种方法。\n\n一旦原型运行，专家将检查并批评每条规则，并评估所使用的控制策略以进行选择。通过这种方式，可以包含每条规则的理由，系统随后可以使用这些理由来解释其运行机制。\n\
  \n一个经验丰富的知识工程师可以使用描述的一些技术来“反编译”知识。他的能力越强，最终系统就能越清晰地展示专家真实的启发式方法和程序。\n\n### 协议分析\n\
  \n另一种使用的技术是协议分析。该技术旨在产生用于解决问题的系统模型，由 Newell 和 Simon [*12*]] 以及更近期的时的 Ericson 和 Simon\
  \ [*12*]] 描述。在这种情况下，记录专家在解决问题时的行为，并对该协议进行转录和分析，最终将其转换为一组产生式规则，这些规则将一个状态转换为后续状态。\n\
  \n目前，协议分析分为两个阶段。在第一阶段，向专家提出特定的问题，要求其口述在得出解决方案时所做的所有决策；此列表提供了图 3 中列出的负面影响。在第二阶段，将与专家共同重新检查这些先前记录的动作序列，并要求其解释做出这些决策的依据。专家还必须解释为什么放弃了那些在他看来等效的、或至少是可能的替代方案。答案提供了符合规则右侧的负面条件（图\
  \ 3）。协议可能提供有用的启发式信息或事实，知识工程师可以直接作为知识使用，也可以间接作为元知识使用，以及关于专家思维过程的关键数据（访谈期间可能并未出现）。\n\
  \n### 多维缩放\n\n第三种技术涉及多维缩放，当涉及某些内在相关的概念时，这种方法非常适用。这些概念初学者难以识别，而经验在于有能力区分它们。该方法产生一组维度，定义包含通用知识对象的空间，并将某些对象与其他区分开来。\n\
  \n### 概念分类\n\n最后，第四种技术基于概念分类。专家除了对专业领域有详细知识外，对通用知识具有全局结构性知识。在必须组织大量信息时，这种元知识非常有用。这种技术的一种形式是获取一组泛指通用知识的概念；然后将每个概念转移到卡片上，并要求专家将其归类为描述每组共同特征的组。这些组可以进行比较以形成层级结构。\n\
  \n图 8 [*3*]] 表为不同类型的知识及其适用获取技术提供了指南。\n\n![图 8 知识类型与适用技术之间的关系。](img/pg163_Image_149.jpg)\n\
  \n图 8 知识类型与适用技术之间的关系。\n\n### 知识设计与架构\n\n知识获取的初始阶段会导致知识设计文档的创建 [*13*]，必须强调：设计中的不同领域、领域之间的依赖关系，以及知识不同元素的详细列举，如程序、限制、启发式方法等。该文档对于定义和验证最终纳入系统的知识至关重要。在专家之间传阅此文档有助于避免遗漏并检测和修正错误。该文档可以实验性地解决新的设计问题，但必须严格遵守。\n\
  \n计算架构或组织知识结构的设计的形式式化和定义。这一阶段意味着以正式的方式表达关键概念和关系，通常在知识工程工具建议的框架内进行。通过这种方式，知识工程师在开始正式化之前，应该对用于解决问题的适当工具形成一些想法。在此阶段需要保持严格的客观性，以便让事实决定选择的工具，而不允许每个知识工程师的偏好、预设观念或其可获得的现有资源覆盖事实。为此，传统的做法是只考虑要开发的任务来选择工具。这可能导致错误选择，因为还需要考虑正在执行的专家系统（ES）构建方法论阶段，以及谁来使用该工具。例如，相同的方法不能同时用于知识获取阶段和系统集成阶段。对于特定的活动，都有最合适的工具。也就是说，工具的需求不是“先验的”，而是源于使用它的人、使用方式以及正在工作的阶段。由于属性很多且某些属性是矛盾的，没有一种工具可以拥有所有目的所需的属性。因此，工具应该是可移植的并且在知识表示上与其他产品兼容；通过这种方式，可以使用最适合每个任务的用户来开发专家系统。工具可分为两大类：硬件和软件（图.\
  \ 9） [*14*]]。\n\n![图 9 人工智能机器分类。](img/pg166_Image_150.jpg)\n\n#### 知识工程硬件工具\n\n\
  为了开发支持人工智能处理的工具，必须记住通用知识应用的需求。为此，与传统的数值算法不同，大多数人工智能应用（特别是专家系统）呈现出几个特征：\n\n1. 符号处理，带有基本操作（如分类、比较、集合操作），或在更高层次上，对模型（如阶段、图表或图像）的操作。\n\
  2. 非确定性计算，因为根据可用信息无法规划执行和完成的程序。通常，需要搜索、使用不完整的指定函数或启发式方法来缩小搜索空间。\n3. 动态性能，因为通常在解决问题时会产生新的数据和函数结构，另一方面，给定结构的最大尺寸可能非常大，以至于在问题解决后必须动态分配和释放内存空间。\n\
  \n\n\n\n\n4.  可能需要大量的并行和分布式计算能力，以并发处理一组必要且独立的任务（合取并行或“**AND**”逻辑），或处理 AI 中典型的非确定性决策点上的任务（析取并行或“**OR**”逻辑）。\n\
  \n5.  知识管理是为了降低复杂性、避免穷尽搜索或处理通常具有不确定性的大量知识。\n\n6.  开放系统，因为解决问题的知识可能是不完整的，因此需要开放的视角以实现持续的完善和新知识的获取。\n\
  \n支持特定 AI 应用的计算机选择，应基于一系列考虑：\n\n> **表示**（Representation），涉及知识、解决问题的方法以及表示这些知识的手段。表示水平是设计过程中的一个重要元素，它决定了给定问题是否可以在合理的时间内解决。为此，有必要考虑元知识（metaknowledge）的使用，即关于领域知识的知识以及其在层次结构中的组织。元知识的使用（其最高层代表是常识知识）能够整合不同的表示方案和编程范式。选择合适的知识表示方法非常重要，并且对对所需的内存、时间、知识的预期使用情况等进行评估。最后，面向特定\
  \ AI 语言的计算机将继承实现该语言的所有特性和局限性。\n\n> **控制**（Control），与问题内部依赖关系和并行性的检测有关；有必要考虑真值维护，因为许多\
  \ AI 应用的特征是在表示层缺乏一致性和完整知识。控制机制还参与知识库和 AI 程序的重组和组合，以使处理更高效。由于问题的非确定性，这些问题通常可以分解为许多较小的任务。控制系统的另一个目标是选择准备好分配给可用处理器的任务。\n\
  \n> **处理**（Processing），特殊用途计算机可分为以下架构：微观级，用于支持 AI 处理，其基本设计使 AI 应用能够执行执行比较、集合交集等基本操作；宏观级，即中间级，可以从上述水平开始构建并执行更复杂的操作；系统级，面向一种或多种语言和知识表示方案，支持其特定特性。可以挑选出特定的系统来支持产生规则语言、框架（frames）、语义网络以及机器人学或自然语言理解等特殊应用。图\
  \ 9 展示了 AI 机器的分类研究；其中一些是真实的，另一些是概念性的表示。然而，目前也可以使用常规机器来开发专家系统（ES）。\n\n大量的并行架构是“连接主义的”（connectionist）；因此，系统的永久知识片段被存储为过程元素之间交互的连接模型或强连接，而不是被动地定位在内存中等待中央处理器检索。连接主义在\
  \ AI 社区虽存在争议，但由于连接网络与人类神经网络之间可能相似性，它是当前的研究趋势。\n\n### 知识工程软件工具\n\n在专家系统设计和构建的研究中，确定良好的工具为了执行其功能必须具备的基本品质是至关重要的。基本标准包括：\n\
  \n1. 认识论和模块化，用于表示。\n2. 易用性，用于创建。\n3. 推理和控制，用于检查。\n4. 渐进，用于产生。\n5. 服务渲染，用于允许。\n6.\
  \ 能力增长，用于支持。\n7. 灵活性和速度，用于开发。\n8. 用户友好支持，用于保存。\n9. 实用主义，用于整合。\n10. 通用性，用于使用。\n11.\
