  \ Society Press, 华盛顿特区, 1988。\n\n**JOHN A. STANKOVIC**\n\n# 空间信息处理：表示与推理\n\nDOI:\
  \ [10.1201/9780367811495-17](https://doi.org/10.1201/9780367811495-17)\n\n## 引言\n\
  \n尽管符号和基于语言的知识系统已经有了大量的开发，但空间表示和推理作为一个独立领域才刚刚开始被研究 [*1*]。在此之前，这些问题在计算机图形学、计算机视觉、图像处理、机器人技术、计算机集成制造、计算复杂度、空间数据库、自然语言处理和专家系统中被视为独立的实体。以下内容引用自\
  \ F. Hayes-Roth、D. Waterman 和 D. Lenat 编写的*构建专家系统*：\n\n> 许多设计问题需要对空间关系进行推理。对距离、形状和轮廓的推理需要大量的计算资源。目前还不存在对形状和空间关系进行良好的近似或定性推理的方法。\n\
  \n我们关注的是空间信息和知识的表示问题及推理方案的系统研究。空间信息处理通常需要新颖的想法来处理动态复杂的数据结构和分层次推理方案。超大规模集成电路（VLSI）、光计算与存储、高度并行计算机架构以及人工智能（AI）工作站的出现无疑将促进这一领域的发展。\n\
  \n首先，回顾了一些为人知的空间对象表示参见参考文献 [2 获取其他参考文献]]。然而，并非所有对象都能通过多面体和平表面表示。具有分形特征的自然物体 [*3*]\
  \ 也无处不在。因此，我们还将 R3 空间中所有紧致闭合集合视为空间对象 [*4*]。\n\n接下来，我们讨论了空间信息和知识的一些通用概念。提出了一种空间知识层次结构，包括世界空间、感知空间、路径空间和配置空间。世界空间对环境及其其中的对象进行建模。感知空间处理各种（视觉、听觉、触觉）传感器数据及其理解。路径空间关注世界空间中的运动，无论是观察者还是被观测对象。配置空间描述机器人系统的状态。不同类型的状态可能位于关节空间、路径空间、装配空间或它们的各种组合，从而在配置空间中形成更深的层次。\n\
  \n计算机的空间信息处理面临三个困难瓶颈：不确定性、不完全性和复杂性，尽管人类的认知处理不受这些障碍的影响。不确定性和不完全性主要由于成像和传感过程。算法的指数级复杂度有时是因为空间问题的范围太大[例如，三维（3-D）路径规划问题]。我们讨论了两种方法：(1)\
  \ 主感知和 (2) 拓扑和定性推理，这些方法提供了克服这些瓶颈的想法。它们比被动感知以及几何定量推理更具灵活性稳健性，因为在以自适应方式满足其他约束的同时，避免了大多数限制\
  \ *5, 6, 7]。\n\n我们接下来关注几个特定的问题领域。除了通用的推理范式，通常还需要应用领域的知识。我们描述了图像理解、机器人探索与地图学习、空间规划、自主移动机器人、自动装配、战术形势评估以及空间数据库管理系统（DBMS）中的一些空间推理问题。在一个通用系统中关联这些应用领域至关重要，这需要不同领域和技术的特征，例如黑板架构、关系型和空间数据库、不确定性推理、知识库系统、时间推理和机器学习。空间信息和知识的整合、管理和组织已得到讨论\
  \ [*8*]。\n\n目前无法对这一新兴领域进行全面的综述。在本报告中，将讨论了一些通用问题和观点。\n\n## 空间表示\n\n空间表示依赖于世界空间 R³\
  \ 中的坐标系。在每个对象周围，我们都有基于局部坐标系的局部地图，它描述了环境的局部行为。在机器人操纵中，该局部坐标系就是任务系统（图 1）。\n\n![图 1.\
  \ 全局坐标系中的不同坐标系。](img/365_Image_233.jpg)\n\n图 1 全局坐标系中的不同坐标系。\n\n文献中描述了若干不同的空间表示方案。并非所有空间对象都是具有光滑或多面体边界的\
  \ 3-D 对象。它们可能是 0-D 点、1-D 曲线、2-D 表面，甚至是奇特的集合，例如分形集。通常，我们要求它们是世界空间 R³ 中的紧致闭合集合，并且整体上在\
  \ R³ 集合的拓扑中是一个紧致族。一个重要的问题是找到高效的算法，将一种表示转换为另一种。\n\n### 构造性表示\n\n空间对象的构造性表示由一组 3-D\
  \ 体积（或实体几何）原语和一组集合论布尔运算：并集、交集和补集组成。这种表示在文献中被称为构造实体几何（CSG）方法。通常，3-D 体积原语集合包括块体、圆柱、圆锥、球体和超二次面。数据结构是一个二叉树，叶子节点是原语的实例，分支节点是布尔运算和位置信息。这种方法通过少量的原语和运算来表示复杂对象非常高效，因此被广泛用于\
  \ CAD 和 CAM。然而，它在处理通用曲面（如人脸）时的表达能力有限的。这种方法对于数学分析（如有限元分析）和空间推理方案并不方便。\n\n### 空间分解表示\n\
  \n\n\n\n空间分解表示法是将 3-D 世界空间（或感兴趣对象周围的区域）分解为不重叠的子区域，使得对象由合适分辨率的子区域表示。`octree`（八叉树）结构是最常用的表示法。它通过不同尺寸立方体的树对对象进行分层表示。每个立方体被分解为八个八体（或立方体）。这种递归方案提供了\
  \ 3-D 世界空间或感兴趣区域的细细结构。根据立方是被完全占据、部分占据还是未被占据，将其涂黑色、灰色或白色。虽然`octree`结构在直角坐标系中高效地表示了空间信息，但它仅计算机视觉的正交投影。\n\
  \n对于透视投影，`octree`结构在文献 9 中扩展为球形八叉树结构。这种数据结构将透视投影中的实扇分为八个八体。该扇受对象到观测位置最短径向距离的限制。每个八体递归地分解为八个八体。这种分层树与矩形的相同。一个显著的改进是将这些球形八叉树位于空间中的对象周围。对于每一簇对象，都构造一个球形八叉树。不同的球形八叉树在观测球上可能相关（图\
  \ 2）。\n\n![FIGURE 2. 不同的球形八叉树在观测球上相互相关。](img/pg366_Image_234.jpg)\n\nFIGURE 2. 不同的球形八叉树在观测球上相互相关。\n\
  \n### 表面边界表示\n\n对象通过其在 3-D 世界空间中的边界表面表示。在多面体情况下，边界表面可以表示为多边形（如三角形和方形）的多面体。在光滑情况下，边界表面可以由任意精度的三角形或多面体面进行近似。在拓扑情况下，集合的边界定义为集合论中其闭包与外部的交集。\n\
  \n有时，用平滑表面片来表示边界表面非常方便。在代数几何中，表面由 `R³` 中满足 `F(x,y,z) = 0` 的点集 `(x,y,z)` 表示。通常，函数\
  \ `F` 是 `x`、`y` 和 `z` 的多项式或可微函数。更方便的方法是参数化表面表示：`z = f(u,v)`，`y = g(u,v)` 和 `z =\
  \ h(u,v)`，其中 `(u,v) ε D` 是 `R²` 中的区域，`f,g,h` 是 `u` 和 `v` 的光滑函数。具体而言，Monge 片（patch）由\
  \ `x = u`、`y = v` 和 `z = h(x,y)` 给出，其中 `h` 是高度函数。Monge 片适用于正交投影，但不适用于透视投影[*10*]。在文献\
  \ 10 中，使用球形片 `ρ = ρ(θ,φ)` 来表示由 `θ` 和 `φ` 的实观测角跨越的表面片。径向值 `p` 假设为角度 `θ` 和 `φ` 的光滑函数（图\
  \ 3）。\n\n![FIGURE 3. 径向值 p 作为角度 θ 和 φ 的函数。](img/pg366_Image_235.jpg)\n\nFIGURE 3.\
  \ 径向值 p 作为角度 θ 和 φ 的函数。\n\n### 生成表示\n\n生成表示法通过空间曲线作为轴来生成对象。例如，圆柱体是通过线段绕空间中的某轴旋转生成的。同样，它也可以通过圆沿沿同一轴扫掠生成的。在文献中，生成表示法通常被称为广义锥和扫掠表示。一种相关的表示方案是骨架表示法，它使用轴或样条来表示骨架形状。\n\
  \n### 多帧表示\n\n空间对象通过不同方向的几个 2-D 投影来表示。某些结果使用 2-D 轮影投影和线图。特征视图法是一种更完整的方法。所有 2-D 投影被归分为有限数量拓扑等价类。同一等价类中的不同视图通过线性变换相关。另一些使用\
  \ 2-D 图像帧中的阴影信息来重建 3-D 对象。重建通常基于正交（或平行）投影。\n\n### 分形（分形集）\n\n自然界许多重要的空间模式是不规则的或分形的[*3*]。通常的几何对于研究这些集合没有用。例如，岛屿的海岸线或云的边界都是经典的分形。著名的分形源于布朗运动的几何模型。“分形”一词是由\
  \ B. Mandelbrot 创造的；然而，基础分形对于 Weierstrass、Sierpinski 和 Hausdorff 等数学家来说已经为人所知了一段时间。在数学上，分形被定义为其豪斯道维度严格大于拓扑维度的集合[这与文献\
  \ 4 的豪斯道测度有关]。由于分形在计算机视觉中具有重要作用。\n\n## 空间信息与知识的分层\n\n### 世界空间\n\n我们的世界充满了对象。并非所有空间中的对象都是具有光滑或多面体边界的\
  \ 3-D。它们可能是 0-D 点、1-D 曲线、2-D 表面。大多数情况下，对象在世界空间 `R³` 中是紧的。然而，公路或机场跑道可能不被认为是紧的。这时，在每个对象周围建立一个关联局部坐标系的局部八叉树结构。此外，它们可能是拓扑的，并且比传统的全局八叉树更通用。\n\
  \n对象的定性形状描述由拓扑等价给出。`W` 中的两个对象如果之间存在同胚（刚性变换的推广），则是等价的。因此，任何立方体在拓扑上都等价于实球（图 4）。这种等价关系可能太弱，因此必须定义更严格的（比拓扑更严格）等价关系。例如，所有带靠角的椅子在合适的多面体等价下是等价。\n\
  \n![FIGURE 4. 对象的拓扑等价。](img/pg368_Image_236.jpg)\n\nFIGURE 4. 对象的拓扑等价。\n\n常见的集合论关系，如交、并、补、位于、在右侧等，在对象世界空间\
  \ `W` 的拓扑模型中定义。因此，可以建立空间关系理论。\n\n\n\n\n感知空间 `V` 由感官（不一定是视觉）图像空间组成。然而，图像也是感知类别中的集合。在文献\
  \ `18` 中，开发了一种球形视觉模型。球面透视消除了平面透视模型的某些局限性，并为单个图像球上的时间感官数据融合提供了机制（图 5）。\n\n![FIGURE\
  \ 5. 时间感官数据融合。](img/pg368_Image_237.jpg)\n\nFIGURE 5. 时间感官数据融合。\n\n透视投影 `π` 是世界空间\
  \ `W` 到感知空间 `V` 的变换。这是`图像生成`模型。逆过程是`图像理解`，它关注的是识别待理解图像的对象。图像理解是空间推理的一种主要类型。如果我们用箭头表示推理，则图像理解用垂直箭头表示，而\
  \ `v` 和 `W` 中的推理则用水平箭头表示（图 6）。在世界空间中，我们在对象周围拥有局部拓扑八叉树结构。引入第二种八叉树结构——以观测者中心的球面八叉树结构，用于处理推理方案：`V`\
  \ 和 `W` 之间的图像理解。此外，以观测者中心的球面八叉树结构为以下提供了单一表示方案：\n\n![FIGURE 6. 空间推理机制。](img/pg369_Image_238.jpg)\n\
  \n1. （在世界空间中）相对于观测者的对象空间布局\n2. （在感知空间中）视觉和其他感官图像\n3. （在路径空间中）路径规划、机器人导航和避障\n4. （在配置空间中）运动控制、传感器控制的空间操纵（例如，视角角与运动控制角兼容）\n\
  \n这种局部的以观测者中心的球面八叉树结构进一步与所有局部拓扑对象为中心的八叉树集成，这些八叉树构建在由以下边界定义的区域内：\n\n`ρ`1 ≤ `ρ` ≤ `ρ`2,\
  \ `θ`1 ≤ `θ`  ≤ `θ`2,  ††⠠`and` and`ϕ`1 ≤ `ϕ` ≤ `ϕ`2,\n\n即相对于球面坐标系的对象的最小体积包围体。我们注意到，不需要文献\
  \ `[*1*]` 所要求的场景全局八叉树。每个局部的观测者为中心球面八叉树集成了其所有`可见`的拓扑对象中心八叉树。局部八叉树在 `(θ,φ)` 上可能具有不同的分辨率以及不同的径向（范围）数据。这些对象的局部子结构以及自由空间在有限且紧凑宇宙\
  \ `U` 在 `R³` 中的球面观测者中心`分层结构`中形成了一个不规则的`tessellation`。我们在 `R³` 的世界空间 `W` 中的内容可以通过中心（透视）投影投影到视觉（感知）图像球上，例如\
  \ `S²`，从而在 `V` 中创建图像（集合）。`R³` 中的豪斯多距离被投影到 `S²` 的豪斯多距离 `[*4*]`。对象中心球和观测者中心球的组织方式见图\
  \ 7。\n\n![FIGURE 7. 对象中心球 vs. 观测者中心球。](img/pg370_Image_240.jpg)\n\nFIGURE 7. 对象中心球\
  \ vs. 观测者中心球。\n\nChen `[*4*]` 指出，`R³` 中的空间关系可以根据球面数据结构的角度 `θ` 和 `φ` 的知识以及范围（径向）数据\
  \ `ρ` 来解释。我们应该注意到，在我们的模型中，范围 `ρ` 以及角度 `θ` 和 `φ` 可能不是`精确的`，而只是粗略和近似的。例如，我们能够以一致的方式，在世界空间和感知空间中的\
  \ `(ρ, θ, φ)` 任意固定点集周围附加所谓的“不确定流形”（扇区）。在文献中，只考虑了二维世界空间中的不确定流形。\n\n### 路径空间\n\n对于自主移动机器人\
  \ `*6, 7, 11, 12]`，路径规划、导航和避障是基本问题。传统的路径规划是通过优化一组代价函数来处理的。正如文献 `6` 和 `7` 所示，精确的度量地图很容易建立；感官输入的不准确以及运动输出的校准误差或滑移会导致度量不一致和累积误差。定性方法是将路径空间\
  \ `P` 中的路径和世界空间 `W` 中的地标（通常仅在感知空间 `V` 中感知）分别以图的弧和节点的形式考虑（图 8）。\n\n![FIGURE 8. 定性路径空间。](img/pg371_Image_241.jpg)\n\
  \nFIGURE 8. 定性路径空间。\n\n`拓扑`的数学理论为路径和地标的定性理论提供了工具——“广拓扑学”和“同伦”。广拓扑学是拓扑空间（地标及其周围环境）以及它们的同胚（用于世界空间）的研究；而“同伦理论”是研究空间中路径或高维自由区域之间的等价性。特别是，“同伦理论”考虑了空间中路径的空间\
  \ `T`。\n\n如何定义两个此类路径之间的等价关系？从同伦的角度来看，如果一个路径可以通过连续函数变形为另一个，那么它们就是等价的。直觉上，如果不介意走一段路，两个同伦路径实际上没有区别。因此，我们将路径定性地定义为两个节点之间同伦等价的弧的整个类（图\
  \ 9）。\n\n在定性推理之后，需要松弛技术来寻找最优或近似最优路径并识别最优或近似最优的地标。使用势函数，爬山技术将给出地标的解 `*6, 7]`。目标路径应该是宇宙\
  \ `U` 中相对于特定度量的等价类中的最小路径。它是给定度下的测地线（两点之间的最短曲线）。通过求解微分方程寻找测地线标准方法。\n\n路径空间 `P` 和感知空间\
  \ `V` 可以以多种方式联系。在球面表示中，导航和避障可以被视为球面数据结构中的相交问题。一种高效算法 `*4]`，“绕行”算法，引导自主移动机器人避开障碍，寻找绕过障碍的合适路径并返回计划路径。系统的输入是来自球面视觉系统的连续观测值集合，该系统为环境中的对象构建局部八叉树结构。球面数据结构及其局部八叉树结构的构建和更新构成了一个动态空间信息系统。该系统是计算密集型的。局部观测者中心和对象中心八叉树结构的定性方法将部分缓解这种难度。\n\
  \n![FIGURE 9. 等价路径的同伦。](img/pg371_Image_242.jpg)\n\nFIGURE 9. 等价路径的同伦。\n\n\n\n\n\
  \n路径空间 `P` 进一步与速度空间和其他物理空间相关。我们在这里不讨论它们。\n\n### 配置空间\n\n配置空间 `C` 包含了作为子空间的世界空间 `W`\
  \ 和路径空间 `P`，并由来自感知空间 `V` 的输入进行控制。如果仅考虑运动，`C` 可能会被简化为运动参数空间，例如在由一组多面体墙界定的区域内，一组铰接体（如机器人手臂）绕各个各个关节的运动。从代数角度来看，单个刚体的位置由旋转矩阵\
  \ `R[1]` 和 `R³` 中的一个向量 `A` 给出。如果第二个刚体铰接在第一个刚体上，那么整体位置则由两个旋转 `R[1],R[2]` 和一个向量 `A`\
  \ 共同描述为 `[A,R[1],R[2]]`。这些运动参数形成 `R^(3+3+3) = R⁹` 中的一个向量。如果我们有 `n` 个铰接体，运动参数形成 `R^(3(n+1))`\
  \ 中的一个向量。这些参数所满足的约束集由代数方程描述。所得配置空间是 `R^(3(n+1))` 中的一个代数流形。尽管已有计算算法，但它们的复杂度极大。该配置空间的定性理论是空间变换的拓扑建模。通过释放维度，某些约束被消除了。李群（如旋转群和平移群）的推广在其他地方给出\
  \ [[[13*]》。广义李群的类别保留了李群的基本特征，但由更广泛的拓扑同胚类组成。\n\n如果计划中有需要执行的任务，配置空间 `C` 就是世界空间 `W`\
  \ 之上的“纤维”空间，即对于 `W` 中的每个集合 `X`，都附加一个任务 `{TX,1,. . . ,TX,n}` 的子计划 `P(X)`（`X` 处的纤维）（见图\
  \ 10）。纤维空间的概念也借自拓扑学。纤维空间 `C` 不一定可以用参数（欧几里得）空间 `R^α` 表示。配置空间 `C` 中产生了一个异构数据结构的层次结构。\n\
  \n![图 10. 任务的纤维空间。](img/pg372_Image_243.jpg)\n\n图 10。 任务的纤维空间。\n\n### 示例\n\n###\
  \ 探索与地图学习 [[[6, *7*]]]\n\n产生空间信息和知识的环境通常由一张地图捕获。在每个独特的物体或位置周围，都会构建一个局部地图。全局地图整合了所有正在考虑的局部地图。这些未知环境地图的构建和学习是空间推理中最重要的重要问题之一。虽然目标是构建和学习提供精确距离、尺寸和其他定量信息的几何地图和测量地图，但一种定性和拓扑方法的方法类似于人类对新环境的认知地图。由于其具有管理不确定性、误差和噪声的能力，这种方法更加稳健。随着我们获取到更多知识，拓扑地图可能会获得正确的度量从而成为几何地图。\n\
  \n这种方法在其他任务中同样有效，例如设计房屋和制作雕塑。首先，我们对想要建造的东西产生概念和抽象的图像。这个初始图像更具拓扑性，尽管最终产品可以测到测量准确度。因此，测量方法和拓扑方法都是有用的。它们在过程中是互补的。\n\
  \n基本的拓扑等价性是同胚，它建立了两个拓扑空间之间的拓扑等价性。例如，圆形圆盘在拓扑上与正方形等价。广义李群的类别保留了李群的基本特征，但由更广泛的拓扑同胚类组成。广义李群的类别。同胚建立了两个拓扑空间之间的拓扑等价性。例如，根据拓扑不变性将无限数量的拓扑空间分类为有限数量的类别。圆形圆盘在拓扑上是等价的。这种拓扑等价性提供了更小的类别。基本上，拓扑不变性是，实际上是拓扑模型，因为路径是由节点和弧表示的复杂性模型。\n\
  \n### 空间语义网络与框架系统\n\n空间知识表示及其推理通常由语义网络、框架或一阶谓词逻辑[[[14*, *15*](#C_019_c17.xhtml#r17_15)]]`处理。知识被组织成\
  \ IS-A 层次结构，以及关系和约束。知识应该包括通用模型和特定实例。对于空间推理，为语义网络附加活动过程是有用的，以便可以动态计算数值。\n\n大多数空间推理系统用于图像理解。其中，ACRONYM[[[14*]]`\
  \ 是最著名的模型系统。它使用通用对象的显式表示，在框架层次中表示几何物体。物体之间的空间关系表示为量化的不等式，解释通过外部图匹配程序进行。对于匹配，使用了强领域模型。匹配与数据无关，因此搜索没有任何灵活性。量化在推理中也相当僵化。其他人开发了一种用于视觉的多级几何推理系统，它对物体知识和空间推理知识具有层次结构。\n\
  \n3D FORM 系统[[[15*]]` 正由 Kanade 等人开发。它使用框架来表示物体及其物体之间的关系。活动过程（守护进程）附加到系统参数上，以便根据需要进行假设或计算。原始物体具有守护进程从其他部分计算缺失的部分。由于物体和关系知识都是显式表示的，系统扩展到额外领域只需添加新框架，而无需修改框架的代码。推理过程通过访问对象来控制，因此该表示适用于自顶向下和自底上的处理。尽管这些系统具有某些优点，但人工智能的一个经典问题——框架问题仍然是空间推理的一个大难题。由于空间推理的动态性，复杂度是巨大的。这种系统无法模拟人类的空间推理能力。\n\
  \n### 空间数据库管理系统 [16*]\n\n由于空间数据库规模巨大且搜索需求复杂，传统的关系数据库管理系统（DBMS）可能成为空间推理系统的处理瓶颈。面向对象的表示提供了一种替代方法，为静态和动态领域知识提供了一个概念框架。探索面向对象数据库的搜索空间缩减和潜力。如果，面向对象和面向空间的表示都是层次化的，则通过使用递归和多分辨率推理可以进一步减小搜索空间规模并提高解决问题的效率。\n\
  \n\n\n\n\n在具有主机驻留软件和磁盘驻留数据的 DBMS 中，访问时间取决于搜索空间的大小和磁盘检索时间。通用方法包含三个步骤：第一，开发一种全集成的面向对象和面向空间的数据库组织结构，以支持对知识库的高效访问和操作；其次，使用分布式处理器实现，允许整个活动知识库驻留在随机访问存储器中以支持并发搜索；第三，实现低级空间推理方案（包括布尔运算、路径规划和度量计算），以利用空间\
  \ DBMS 丰富的结构。混合数据结构由矢量、金字塔、四叉树、八叉树和基于框架的组件组成，用于表示均匀和非均匀采样的点、线、区域对象属性。\n\n### 自动组装\
  \ 17, 18, 19]\n\n机器人领域的一个问题是机械零件的自动组装。自动组装需要一种信息处理和控制方法，来描述过程、工件以及组装设备。机械组装过程的建模是其中一个关键步骤。组装过程的流程语言和知识表示是另一项关键。Backstrom\
  \ [7] 提出了组装过程的静态和动态逻辑建模。该模型应具有对组装过程重要几何层面的表达能力，例如对象的复合结构。有些是初构体、物体中的孔洞、物体之间的接触以及物体间的附着，以及相对运动和附着中的约束。使用一阶逻辑表达了对象域、函数、基元谓词、可推导谓词以及约束公理。动态表示需要将一阶逻辑扩展为动态逻辑或模态逻辑。这面临着经典的框架问题，即动态更新规则在实践中是不可行的。一种方法是在动态逻辑中引入一些表示组装过程的算子。这一方向仍需进一步研究。其他工作\
  \ 20 使用了几何模型中的过程方法。然而，过程方法并不适用于空间推理。\n\n### 战术态势评估 21\n\n战术态势评估是分析关于敌方活动的输入军事情报数据的问题，以产生对其意图和能力的估计。其中一个重要要求是对地形进行分析，以寻找具有军事意义的特征，如掩护和隐蔽、进攻通道和障碍。可以构建一个描述这些特征的地形分析图。显著特征偶尔变化，因此结果可以反复用于对特定区域的详细分析。为了理解敌人的意图，将这些特征与情报报报进行匹配。该问题的完整解决方案需要解决几个主要的\
  \ AI 研究领域，包括规划和计划学习。到目前为止，大多数研究结果是寻找具有军事意义的特征。算法分为两类：基于军事知识的区域分割和视线计算。可见性分析提供了特定区域内的潜在攻击路径。\n\
  \n### 移动机器人中的空间信息管理 7, 8]\n\n目标是为自主系统建立一个中央信息管理器。Strat 和 Smith 定义了共同需求：首先，每个系统都应该具有感知环境的能力以及理解视觉、声纳和雷达图像的能力。无论数据来源是什么，每个系统都需要执行图像理解，将图像数据与存储的预期相匹配，并增量地建立周围环境的模型；其次，每个系统预计在非结构化环境中运行。需要使用自然形式新颖表示的高度适应性程序。基于模型的方法是不够的，分形和拓扑模型更实用。第三，环境是动态的。自主系统的移动不是变化的唯一来源，其他物体也在移动。\n\
  \n第四，感知、规划和执行监控需要知识密集型处理。领域特定知识必须被编码并在处理的每个阶段备供使用。最后，信息必须从多种来源获取。信息的不完整性和不确定性需要实时的多传感器融合和信息整合。在文献\
  \ 8 中，提出了核心知识系统架构，重点关注空间和关系组织及其对整合多源信息的影响。应用了许多技术，包括黑板架构、关系型和空间数据库、不确定推理、认识逻辑、计算机图形和知识库。\n\
  \n### 空间规划 11, 12, 22]\n\n许多研究人员已经了运动规划。机器人和计算几何中解决路径问题的通用方案可以用方法表示自由空间的方式来表征。有两种基本方法：一种是将障碍物显式表示为几何形状（多边形），并将自由空间隐式地定义为这些障碍物之外。2D\
  \ 空间中的最短路径可以通过搜索可见性图找到。扩展到 3D 最短路径问题在计算上是非常昂贵的。另一种方法是显式表示自由空间并直接在自由空间内寻找路径。例如，自由空间可以描述为广义锥，这些锥的中心轴形成一个连通图。路径规划问题是在连通图上搜索路径。该路径是无碰撞的，但可能不是最优的。沃诺伊图是描述自由空间的另一种方法，它表征了相邻障碍物之间自由空间的骨架或通道。沃诺伊图将\
  \ 2D 平面划分为不相交的区域。Meng [12] 推导了位置不确定性下的路径规划算法。其他算法可以在 4, 22](#C_019_c17.xhtml#r17_22),\
  \ 23](#C_019_c17.xhtml#r17_23)] 中找到。\n\n空间规划不仅限于运动规划。VLSI 设计和建筑设计中的平面规划是两个常见的应用\
  \ 18, 22](#C_019_c17.xhtml#r17_22)]。该问题涉及将矩形空间分解为不重叠的矩形空间。推理规则用于从约束图中确定约束。\n\n##\
