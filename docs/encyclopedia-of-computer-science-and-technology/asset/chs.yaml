  \ A. Marzollo, eds.), Springer, New York 1975。\n5. 我们 在此处（如本文各处一样）指的是动态优化。然而，同样的也适用于静态优化，其发展最初由军事类型的运筹学问题驱动，然后是经济和管理问题。我们回顾求解线性规划问题的单纯形法，该方法由\
  \ 20 世纪 40 年代苏联的 Kantorovich 和美国的 Dantzig 独立开发，以及用于非线性规划问题的 Kuhn-Tucker 乘子法，该方法在\
  \ 1951 年将经典的拉格日方法推广到不等式约束问题。\n6. 参见 注释 9。\n\n\n\n\n\n## 7. R. E. Bellman\n贝尔曼在其基础性著作*动态规划*（Princeton\
  \ University Press, 1957）中引入了这一术语，其参考了为了优化地引导系统状态达到目标而所采取的决策（因此得名“规划”/programming）；时间变量在过程中起着作用（因此使用了形容词“动态”/dynamic）。动态规划不同于“数学规划”（线性或非线性规划），后者指的是在时间不起作用的情况下，在给定约束定义的集合中寻找函数的最小值或最大值的方法（因此称为“静态规划”/static\
  \ programming）。\n\n## 8.\n在本例中，对于一个每边有 `(m + 1)` 个顶点（`n = 2 m` 个阶段）的正方形网络，其操作次数如下：\n\
  \n* 在每个可以在两个决策之间进行选择的顶点（即每边有 $m$ 个顶点的正方形网络中 $m²$ 个顶点中的每一个）： 2 次加法和 1 次比较。\n* 在其他每个顶点处（即\
  \ $2m$ 个顶点中的每一个）： 1 次加法。\n\n因此，$2m^{2} + 2m = 2\\left( \\frac{n}{2} \\right)^{2}\
  \ + n$ 次加法和 $m² = \\left( \\frac{n}{2} \\right)^{2}$ 次比较。在我们特殊的情况下，当 $n = 6$ 时，有\
  \ 24 次加法需要执行。对于较大的 $n$，与比较 A 和 B 之间所有路径代价的朴素方法相比，它具有巨大的优势。考虑到对控制的限制，此类路径的数量显然为\n\
  \n$$\\begin{pmatrix} \\text{n} \\\\ \\begin{matrix} \\begin{matrix} \\text{n} \\\
  \\ \\end{matrix} \\\\ 2 \\\\ \\end{matrix} \\\\ \\end{pmatrix} = \\frac{\\text{n}!}{\\\
  left( \\frac{\\text{n}}{2} \\right)\\text{!}\\left( \\frac{\\text{n}}{2} \\right)\\\
  text{!}}$$\n\n因此，加法的次数为：\n\n$$\\frac{\\left( \\text{n} - 1 \\right)\\text{~!}}{\\\
  left( \\frac{\\text{n}}{2} \\right)\\text{~!}\\left( \\frac{\\text{n}}{2} \\right)\\\
  text{~!}}$$\n\n对于 $n = 20$，简单列举法需要超过 $10⁶$ 次加法，而动态规划仅需 220 次。比较次数的差异仍然更大。\n\n##\
  \ 9.\n动态规划的基本方程可以被看作是拉泰奥德里提出的“变分法基本方程”的扩展（参见 C. Carathéodory, *Variations rechnung\
  \ und partielle Differential-gleichnungen erster Ordnung*, Teubner, Leipzig, 1935,\
  \ p. 208）。从这些方程可以推导出哈密顿-雅可比方程以及经典变分法的大多数结果。在历史上，经典变分法和力学中遵循的是反向路径，这也是最现代力学教材采用的方法：从哈密顿原理推导出欧拉-拉格朗方程，再从后者推导出哈密顿方程，最后推导出哈密顿-雅可比偏微分方程。关于变分法与动态规划之间的关系（例如参见\
  \ S. E. Dreyfus, *Dynamic Programming and the Calculus of Variations*, Academic\
  \ Press, New York, 1965）。\n\n对于一种基于几何概念并与动态规划相关的动态优化理论，参见 A. Blaquière, G. Leitmann,\
  \ “On the Theory of Optimal Process” in *Topics in Optimization* (G. Leitmann, ed.),\
  \ Academic Press, New York, 1967。这类理论基础的某些数学技术开发于 20 世纪 30 年代。参见 A. Marchaud, “Sur\
  \ les champs de demi-cones et equations diffèrentielles du premier ordre,” *Bull.\
  \ Soc. Math. France, 62*, 1–13 (1934); S. K. Zaremba, “Sur les èquations au paratingent,”\
  \ *Bull. Sci. Math., 60(2)*, 139–160 (1936)。\n\n## 10.\n更深入的分析请参见上述著作，以及例如 R. E.\
  \ Bellman, *Introduction to the Mathematical Theory of Control Processes*, Vol.\
  \ 1 (1967), Vol. 2 (1972), Academic Press, New York; D. H. Jacobsen, and D. A. Mayne,\
  \ *Differential Dynamic Programming*, Elsevier Publishing Company, New York, 1970;\
  \ R. E. Larson, and J. L. Casti, *Principles of Dynamic Programming*, Marcel Dekker,\
  \ New York, 1978。\n\n## 11.\n参见例如 A. Blaquière and A. Marzollo, “Some Relations\
  \ Between Control Theory and *ical Systems and Geometry*, Academic Press, New York,\
  \ 1982.\n\n## 12.\n如果轨迹不在可达集的边界上（见下一段）。\n\n## 13.\n读者可能会注意到到动态规划与变分法之间存在一个根本区别。在给定端点条件下代价积分\
  \ (15) 的最小化问题中，变分法的所有方法都面临这一问题，试图寻找 $u^*$ 使得在固定端点条件下，$u^*$ 的平稳性使得通过向 $u^*$ 加上“微小变分”获得的所有函数都给出一个更小的值。这是很自然的，因为在固定条件下，$u^*$\
  \ 的知识意味着代价的知识，反之不然。\n\n相反，在动态规划中，主要兴趣在于确定最优值函数 $V^*$。换句话说，动态规划不是直接面对一个给定的特定问题，而是考虑一个整个问题族。这个族对应于：\n\
  \n1. 每一个可能的点和固定终点；\n2. 每一个终点和固定起始点。\n\n(i) 由离散例说明；(ii) 由连续例说明。\n\n在离散例中，存在另一种解法方法，将特定问题嵌入一组固定起始顶点和多个顶点的问题族中（参见\
  \ S. E. Dreyfus, *Dynamic Programming and the Calculus of Variations*, Academic\
  \ Press, New York, 1965）。\n\n同样，在连续例中，存在另一种解法方法，将给定问题嵌入一组固定终点和多个点的问题族中。那么 (17) 应被替换为：\n\
  \n$$\\begin{matrix} {\\underset{\\text{u}}{\\text{min}}}\\left\\lbrack \\text{L}\\\
  left( x,u,t \\right) - \\partial V*/\\partial t + \\underset{\\alpha = 1}{\\overset{3}{\\\
  Sigma}}\\left( \\partial V*/\\partial{x\\alpha} \\right)\\text{u}\\alpha \\right\\\
  rbrack =} \\\\ {\\\\text{~~} = L{\\left( x,u^{\\*},t \\right) - \\left( \\partial\
  \ V^{\\*}/\\partial t \\right)} + \\underset{\\alpha = 1}{\\overset{3}{\\Sigma}}\\\
  left( {\\partial V}^{\\*}/\\\\partial{x\\alpha} \\right)u_{\\alpha}^{\\*} = 0} \\\
  \\ \\end{matrix}$$$(17’)\n\n只要知道了上述整个问题族的解，即已知 $V^*$，就可以解决每一个特定问题，当然包括对应于给定端点的给定问题。\n\
  \n\n\n\n\n15. 参见，例如，A. Blaquière，“广义相对论中反馈控制的最优性，”A. Blaquière 和 M. Pauchard，“广义相对论中反馈控制的可达性”，收于\
  \ *Dynamical Systems and Microphysics, Control Theory and Mechanics*（A. Blaquière\
  \ 和 G. Leitmann, 编），Academic Press, New York, 1984。\n\n16. 参见，例如，K. Kime 和 A. Blaquiere，“从两个随机最优控制问题到薛谔方程，”收于\
  \ Lecture Notes in Control Information Sciences 121, Modeling and Control of Systems\
  \ in Engineering Quantum Mechanics, Economics, and Biosciences。（A. Blaquiere, 编），Springer-Verlag,\
  \ Berlin-Heidelberg, 1989。\n\n17. 参见 L. de Broglie, *Une tentative d’interprètation\
  \ causale et non-linéaire de la mécanique ondulatoire*，Gauthier-Villars, Paris 1956。\n\
  \n18. 该 证明可以通过比照 A. Blaquière, F. Gerard 和 G. Leitmann 的 *Quantitative and Qualitative\
  \ Games*（Academic Press, New York, 1969）第 6 章中的方法来轻松编写。在该参考文献中，存在多个“引导者”和多个代价积分（博弈论）。\n\
  \n# 贝尔曼连续体会议\n\n## 第一届贝尔曼连续体\n\n第一次会议是一场为期三天的工作坊，由密歇根大学的 Semyon Meerkov 教授和加利福尼亚州圣莫尼卡理查德·贝尔曼的遗孀\
  \ Nina Bellman 女士组织。会议于 1985 年 5 月 29 日 31 日在安娜堡密歇根大学举行。\n\n“贝尔曼连续体”（Bellman Continuum）这一名称由\
  \ Meerkov 教授和 Bellman 女士选择，旨在纪念理查德·贝尔曼，并强调他的工作与在后续会议中将研究和发展的科学领域之间预期的连续性。\n\n会议仅接受邀请参加。来自美国、法国、日本和新西兰的约\
  \ 20 位科学家参加了这次会议，并在以下分发表了演讲：\n\n* 数学\n* 系统与计算机\n* 医学与生物学\n* 数学与系统\n\n摘要分发给了会议的所有参会者。\n\
  \nBellman 女士向参会者介绍了存储在她位于圣莫尼卡家中关于理查德·贝尔曼的论文、书籍、未完成的手稿和期刊，并欢迎任何对研究这些论文感兴趣的人来查阅。\n\
  \n## 第二届贝尔曼连续体\n\n第二次会议是一场为期三天的工作坊，由来自佐治亚州亚特兰大佐治亚理工学院工业与系统工程学院的 Augustine O. Esogbue\
  \ 博士主持。\n\n会议于 1986 年 6 月 23 日 25 日在亚特兰大佐治亚理工学院举行，并与关于动态规划和水利资源的工作坊（1986 年 6 月 25\
  \ 日 27 日）同期举行。\n\n更多信息可以联系主席 Augustine E. Esogbue 博士获取。\n\n## 第三届贝尔曼连续体\n\n贝尔曼连续体的前两次会议对应于形成阶段。他们吸引了理查德·贝尔曼的科学界朋友以及一些工作与他的学派有联系的科学家。\n\
  \n我们必须赞扬 Semyon Meerkov 教授和 Nina Bellman 女士的领导作用。\n\n此外，我们必须赞扬这组美国教授：\n\n* George,\
  \ Adomian，佐治亚大学\n* Augustine Esogbue，佐治亚理工学院\n* Stanley Lee，堪萨斯州立立大学\n* George Leitmann，加利福尼亚大学伯克利分校\n\
  * Lotfi Zadeh，加利福尼亚大学伯克利分校\n\n他们参与了这些前几次会议的组织工作，特别是 Esogbue 教授，他主持了第二次会议。\n\n这种初步经验以及理查德·贝尔曼在欧洲的知名，使他们预计在法国举行的第三届贝尔曼连续体可能会吸引“新血液”。\n\
  \n第三届贝尔曼连续体由法国信息与自动化自动化研究所（INRIA）和巴黎第 7 大学组织，于 1988 年 6 月 13 日 14 日在法国里维埃拉、安蒂比斯西北\
  \ 6 英里的索菲亚-安蒂波利 INRIA A 研究中心举行。它紧随于 1988 年 6 月 8 日 10 日在安蒂比斯会议中心举行的第八届系统分析与优化国际会议，并早于\
  \ 1988 年 6 月 16-17 日在 INRIA-索菲亚-安蒂波利举行的第三届微分博弈与应用国际研讨会。\n\n如果没有 INRIA 的技术和资金支持，这次工作坊无法举行，向此表示感谢。诚挚感谢以下许多国家和国际机构的资金支持：\n\
  \n* 法国信息与自动化自动化研究所 (INRIA)\n* 巴黎第 7 大学\n* 法国科学研究中心 (CNRS)\n* 外交部 (MAE)\n* 教育部 (MEN)\n\
  * 研究与高等教育部 (MRES)\n* 联合国教育科学文化组织 (UNESCO)\n* 巴黎第 7 大学 (UP7)\n* 法国经济与技术控制控制论协会 (AFCET)\n\
  \n第三届贝尔曼连续体由以下赞助：\n\n* 法国经济与技术控制控制论协会 (AFCET)\n* 国际控制联合会 (IFAC)\n* 数学委员会\n* 理论委员会\n\
  \n组织委员会包括：\n\n| A. Blaiere | 巴黎第 7 大学主席 |\n| --- | --- |\n| N. Bellman | 加利福尼亚州圣莫尼卡\
  \ |\n| A. Bensoussan | 巴黎岱芬大学/INRIA，法国 |\n| P. Bernhard | INRIA-索菲亚-安蒂波利，法国 |\n\
