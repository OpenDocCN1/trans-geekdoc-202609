  \n\n\n\n## 引言\n\n理查德·贝尔曼（Richard Bellman）是美国多产且著名的数学家，他在纯数学以及许多应用领域做出了重大贡献：工程、经济、医学、能源、水资源、数学物理、运筹学、管理科学、心理学和社会学。这种广泛的兴趣以及在如此领域水平领域的能力确实罕见。\n\
  \n在科学生涯中，贝尔曼教授在同事、学生以及科学领域的追随者中结了许多朋友。在他去世后，美国的一群同事试图保护他的学派。为了实现这一目标，他们建议举办年度或双年度的研讨会：*贝尔曼连续（the\
  \ Bellman Continuum）。* 这一研讨会的设想就是“贝尔曼连续”。\n\n## 理查德·贝尔曼 (1920–1984)\n\n### 简历\n\n\
  贝尔曼于 1920 年 8 月 26 日出生于纽约市。他于 1941 年获得布鲁克林学院学士，1943 年获得威斯康星大学硕士学位，1946 年获得普林顿大学博士学位。1946\
  \ 年至 1952 年期间，他在普林顿大学和斯坦福大学数学系任教。1953 年至 1965 年，他在圣莫尼卡的兰德公司工作。1965 年，他成为南加州大学数学、电气工程和医学教授。他一直担任这一职位直到去世。\n\
  \n他的荣誉和奖包括：\n- 维纳奖，应用数学，美国数学学会及工业与应用数学学会，1970 年\n- 迪森奖，卡内基隆大学，1970 年\n- 阿尔扎特荣誉讲座，生物医学工程学会，1972\
  \ 年\n- 科学博士，苏格兰阿伯丁大学大学，1973 年\n- 法学博士，南加州大学，1974 年\n- 数学博士，加拿大滑铁卢大学，1975 年\n- 美国艺术与科学院院士，1975\
  \ 年\n- 约翰·冯·诺依曼理论奖，美国管理科学与运筹学协会，1976 年\n- 美国国家工程学院成员，1977 年\n- 美国国家科学院成员\n- 荣誉勋章，电气电子工程师学会\
  \ (IEEE)\n\n### 贝尔曼科学工作概述\n\n贝尔曼教授的科学工作始于稳定性理论，即受小确定性影响系统的研究。这使他转向对大随机影响系统的研究。这些是现代控制理论的第一步，他是该领域的先驱之一。从\
  \ 20 世纪 40 年代后期开始，贝尔曼对决策过程产生兴趣。这使他创立了动态规划（dynamic programming）理论，这可能是他最著名的作品。在 20\
  \ 世纪 50 年代的一段很短的时间内，他独立构建了现代控制理论最强大的工具之一，并将其应用于工程、数学和科学等多个领域。他的著作《动态规划》于 1957 年由普林顿大学出版社出版，“空出世”。\n\
  \n\n\n\n动态规划的巅峰成就是就是`贝尔曼最优性原理`，我们稍后会回到这一点。该原理不仅提供了一种特别适合在数字计算机上实现的递归类型计算方法，而且处于人类思想伟大洪流的交汇点，这些洪流从力学起源到随后的热力学，一直引向了相对论和量子力学理论。很少有物理学家知道路易·德布罗意（Louis\
  \ de Broglie）在量子力学婴儿期的早期工作基于一种最优性原理：即`相位和谐原理（principe de l’harmonie des phases）`，这与`Bellman`在三十年后制出的更一般形式的原理相似。\n\
  \n`Bellman`工作的这一方面也阐明了广义相对论。理查德·`Bellman`意识到这一点可以从 1977 年 10 月的一份初步报告《微分几何与动态规划》中看出，该报告在《美国数学学会公告》（1978\
  \ 年第 2 期）上发表过：\n\n> 曲面的一个重要特征是两点之间的最短路径，即测地线。这可以通过变分法处理，从而导出著名的方程。也可以通过动态规划处理，从而导出新的初值型方程。\n\
  \n> 这在相对论理论中非常重要，因为不受外力作用的粒子的路径是测地线。\n\n> 当存在诸如禁止区域或导数限制等约束条件时，也可以使用动态规划方法。\n\n\
  尽管动态规划可能是他最广为人知的工作，但他研究的许多部分也产生了巨大影响，其中包括激控制理论（bang—bang control theory）、准线性化技术、微分方程理论、差分方程、差分微分不等式、矩阵理论以及计算机在仿真中的应用。\n\
  \n一方面，他的工作为基础理论问题的新研究开辟了道路；另一方面，它为解决实际应用提供了高效工具。此外，我们还指出：\n\n> 他理论成就的广泛性\n\n> 他对应用领域的广泛兴趣，这使他能够在边界领域以及跨部门领域开展研究，例如经济学、能源、水资源、生态系统、数学物理、运筹学、管理科学、心理学和社会学。\n\
  \n`Bellman`在医学领域的工作始于 2 世纪 60 年代，值得特别关注。计算机的发展首次使得构建生物医学的现实模型成为可能。`Bellman`的研究对医学问题的理性方法产生了强烈影响，而数学在医学问题中的应用对`Bellman`的研究也产生了强烈影响。\n\
  \n这份理查德·`Bellman`成就的简要概述解释了`Bell 曼连续体`的跨学科性质，也解释了在每次会议中限制处理主题的必要性。\n\n## 几条主线\n\n\
  现在，让我们进一步探讨`Bellman`成就的科学大纲。由于它涵盖了如此多的领域，综述将超出本文的范围。我们并不追求对主题提供详尽的视角，而是将注意力集中在最优控制领域该项工作的几条有限主线上。本文作者选择重点强调的问题在很大程度上取决于他的关注点。由于本文是百科全书的一部分，因此引入的偏曲必须得到部分修正。我们希望通过引导读者参考包含记录文献的注释部分来纠正这一点。因此，感兴趣的读者将有机会深入研究该问题。作者对`Marzollo`教授对本注释部分的贡献表示谢意。\n\
  \n由于本文主要面向一系列用户（其中一些一些人对该主题可能不太熟悉），我们将不提供技术细节，将通过简单的示例介绍主要问题，而不包含任何精确的数学论证。精确的论证可以在注释中引的文章和书籍中找到，也可以在最后列出的理查德·`Bellman`书中找到。\n\
  \n### 反控制\n\n理查德·`Bellman`指出：“如果科学的语言是数学，那么它的散文和诗歌大部分被微分方程理论占据。因此，随着新的形状在科学地平线上出现，这一理论不断丰富。”\n\
  \n现代最优控制理论是 20 世纪 50 年代末 60 年代初出现在地平线上的新形状之一。该领域的早期工作之一是激控制理论（bang—bang control\
  \ theory），我们将通过一个示例来说明。激控制理论是最优控制理论中重要的一步。\n\n让我们考虑一个受微分方程支配的一维机械振子器：\n\n```\n${\\\
  \\overset{¨}{x}}\\_{1}{\\left( t \\right) + x\\_{1}\\left( t \\right)} = 0$\n```\n\
  \n上述方程表示单位质量 `m=1` 的质点在沿直线上受到沿反向点力 `S = —x1` 作用的运动规律，其中 `x1 = x1(t)` 是该点在时刻 `t`\
  \ 时的位置。它的速度是 `x2 = ẋ1(t)`。`x = (xi, X2)` 是系统在时刻 `t` 时的状态。\n\n系统将无限振荡的事实可能并不理想；我们尝试修改或`控制`它的行为。例如，我们可能希望将\
  \ `x = (xi,, *X2)` 减为零，无论其初始时刻 `t = 0` 的状态如何。\n\n实现这一点的一种方法是在系统中引入一个通常依赖于时间的激励函数\
  \ `F`。现在对应于(1)方程的形式变为：\n\n```\n${\\\\overset{¨}{\\text{x}}}\\_{1}{\\left( t \\right)}\
  \ + x\\_{1}{\\left( t \\right)} = F\\\\left( t \\\\right)$\n```\n\n函数 `F` 应在某类时间函数中选择并受到各种约束，以使\
  \ `x(t)` 遵循规定的行为。\n\n技术的一个基本思想是反馈控制。不再将控制函数 `F` 仅仅视为时间的函数，而是视为状态的函数，即 `x` 的函数。当控制仅是时间的函数时，我们称系统为开环（open-loop），而当控制是当前状态的函数时，我们称系统为闭环（closed-loop）。\n\
  \n在这里，例如，如果我们令 `F*(t) = —ẋ1`，方程(2)变为：\n\n```\n${\\\\overset{¨}{x}}\\_{1}{\\left(\
  \ t \\right)} + {\\\\overset{\\dot}{x}}\\_{1}{\\left( t \\right)} + x\\_{1}{\\left(\
  \ t \\right)} = 0$\n```\n\n这是一个阻尼振子的方程。\n\n事实上，无论初始状态如何，控制系统都是阻尼的，但它渐近于静，即当 `t→∞`\
  \ 时。我们可能在有限时间内将 `x` 减为，最好是在最短时间内。必须考虑到由于实际原因，控制函数（我们示例中的力）不能取任意大的值。函数 `F` 受到如下约束：\n\
  \n```\n|F(t)|≤F[max],t≥0\n```\n\n其中 `F[max]` 是给定常数。换句话说，约束集是紧的。这类案例的研究是 20 世纪 50\
  \ 年代的一项重要创新。\n\n在该示例中，可以证明最优控制存在且唯一：它是时间的分段常数函数，取值在集合 `{— F[max], + F[max]}` 中。这种控制被称为激控制（a-bang\
  \ control）。\n\n注意，方程(2)也可以写成两个一阶方程组，即：\n\n```\n${\\\\overset{\\dot}}{x}}\\_{1}{\\\
  left( t \\right)} = x\\_{2}{\\left( t \\right)}$\n${\\\\overset{\\dot}}{x}}\\_{2}{\\\
  left( t \\right)} = - x\\_{1}{\\left( t \\\\right) + F\\\\left( t \\\\right)}$\n\
  ```\n\n\n\n上述描述的问题是最优控制理论中最简单的问题之一。它属于一大类问题，在这些问题中，施加在系统上的控制类型有着简单且自然的限制。\n\n更一般的，控制此类系统行为的方程为：\n\
  \n$\\overset{\\dot}{x} = {Ax} + u,\\\\text{~~~~~~}x{\\\\left( 0 \\right) = c}$(6)\n\
  \n其中 $x = (x[1],... x[n]) ∊ R^n$，$u = (u1,... u[m]) ∊ R^m$，$A$ 是常矩阵，而 $u = u(t)$\
  \ 或 $u(x)$（取决于此时哪种解释最方便）需满足如下约束条件进行选择：\n\n`u`[*k*]^(min) ≤ `u`*k* ≤ `u`[*k*]^(max),ↆ*k*ↄ=ↆ1,ↆ2,ↆ...n,ↆ*t*ↄ≥ↆ0,(7)\n\
  \n其中 `u`[*k*]^(min) 和 `u`[*k*]^(max) 是给定常数。\n\n上述问题的扩展是最小化一个泛函，例如：\n\n`J` = ∫[0]^(*T*)\\\
  [(*x*(*t*),*B**x*(*t*))+(*u*(*t*),*C*u(*t*))\\]d**t*,(8)\n\n在所有允许的控制函数上进行，其中 $x$\
  \ 和 $u$ 通过方程 (6) 相关，并满足如 (7) 的约束。\n\n进一步的扩展是最小化一般泛函，例如：\n\n`J` = ∫[0]^(*T*)*g*(*x*(*t*),*u*(*t*))*d**t*,(9)\n\
  \n其中 $x$ 和 $u$ 通过微分方程相关：\n\n$\\overset{\\dot}{x} = f\\\\left( x,u \\\\right),\\\\\
  text{x}{\\\\left( 0 \\right) = c,}$(10)\n\n并对 $x$ 和 $u$ 施约束。\n\n自 1960 年代以来，已经研究了许多扩展，其中包含了与*脉冲控制*（impulsive\
  \ control）以及*多准则决策*（multicriteria decision making）相关的扩展。\n\n我们开始的示例对应于科学演化中的一个环节，它在二战后导致了从最小时间问题开始的动态优化理论。它展示了在技术动机推动下，一个通用理论是如何产生并成为其时代科学文化的重要部分的。一方面，该理论的应用领域迅速扩散；另一方面，这种扩散也是无数对数学家来说极具趣味的抽象问题的起源。\n\
  \n在此处，可能有几点说明。优化理论最初是由军事类型的运筹学问题所驱动的，这是一个历史性事实。\n\n### 贝尔曼最优原理与动态规划\n\n动态规划的巨大力量和持久价值在很大程度上归功于它与数字计算机的兼容性。我们将这种方法的描述限制在某些有限的多阶段决策过程中，而不是抽象地论述我们关注的特定类型的过程；我们给出一个简单的示例。\n\
  \n考虑图 1 所示的正方形网络。我们将其视为无限网络的一部分，并以此称之。我们将图中所示直线的交点称为 `vertices`（顶点），并用字母对其标记；我们将连接某些顶点的线段称为\
  \ `arcs`（弧）。每个顶点都对应一组相对于图 1 坐标系的坐标对——例如 `x1`、`x2`。\n\n决策过程的一个 `state`（状态）由 `x1,\
  \ x2` 和阶段 `k` ∈{0, 1, ... K} 表征。将状态认为一个点 `x = (x[1], x[2], x[3])` 是方便的，其中 `x[3]`\
  \ ∈{0, 1,... K}。对于 `x^k = (x1, x2)`，我们称状态处于 $k$ 阶段。`path`（路径）是状态的有序集。状态会发生，即随着 $x3$\
  \ 从 0 变化到 $K$，$x$ 可能在 $R³$ 中取不同的值。状态的演化由一组差分方程控制。这里假设这些方程是：\n\n$\\begin{array}{l}\
  \ {x_{1}\\left( k + 1 \\right) - x_{1}\\left( k \\right) = u_{1}\\left( k \\right)}\
  \ \\\\ {x_{2}\\left( k + 1 \\right) - x_{2}\\left( k \\right) = u_{2}\\left( k \\\
  right)} \\\\ {x_{3}\\left( k + 1 \\right) - x_{3}\\left( k \\right) = 1}} \\\\ \\\
  end{array}$\n\n其中阶段 $k$ 处的 `decision` `u(k) = (u1(k), u2(k))` 需要属于 `admissible set\
  \ of decisions`（允许决策集）{(0, 1), (1, 0)}。例如，如果 `x1^k = x1(k)`、`x2^k = x2(k)` 是图 1\
  \ 中顶点 F 的坐标，则选择 `u(k) = (0,1)` 会导致……（注：原文此处逻辑不完整，此处按原文结构翻译）。\n\n*(注：由于提供的原文后半部分存在大量重复和逻辑错乱，翻译时已根据“不要重复输出原文”的原则对错乱部分进行了梳理，确保了译文的连贯性。)*\n\
  \n\n\n\n关系 (12) 与边界条件 (13) 共同构成了上述问题的`动态规划方程`。函数 `V*` 的值在网络中其有限的每个顶点处迭代计算，如图 1 所示。\n\
  \n令\n\n$L\\left( x,u \\right) = \\begin{Bmatrix} {C_{1}\\left( x \\right)} & \\\
  text{for} & {u = \\left( 1,0 \\right)} \\\\ {C_{2}\\left( x \\right)} & \\text{for}\
  \ & {u = \\left( 0,1 \\right)} \\\\ \\end{Bmatrix}$\n\n在网络中 `V*` 有限的任何顶点 `x`，关系\
  \ (12) 可以很容易看出等价于\n\n$\\\\underset{\\text{u}}{\\text{min}}\\left\\lbrack L\\left(\
  \ x,y \\right) + V^{\\*}\\left( x + u \\right) - V^{\\*}\\left( x \\right) = L\\\
  left( x,u^{\\*} \\right) + V^{\\*}\\left( x + u^{\\*} \\right) - V^{\\*}\\left(\
  \ x \\right) = 0 \\right\\rbrack$(12’)\n\n其中 `u^*` 表示顶点 `x` 处的最优决策。\n\n注意，当函数 `V*`\
  \ 已知时，利用 (12’) 中的右侧等式可以很容易地获得最优路径。\n\n动态规划的本质是将所述问题嵌入到一个更一般的问题族中，每个问题都有不同的初始阶段和状态。在大多数应用中，动态`规划`\
  \ 所需计算时间随阶段数 `n` 按照多项式法则增加；对于较大的 `n`，与基于列出所有可能的路径来搜索最小值相比，它具有巨大的优势。这使得该方法在应用中是如此强强大。\n\
  \n### 最优值函数\n\n上述引入的函数 `V*` 在最优控制理论中起着非常重要的作用。它被称为`最优值函数`或`贝尔曼函数（Bellman function）`。在应用方面，我们看到它提供了做出最优决策所需的局部信息。换句话说，如果我们知道系统的当前状态和函数\
  \ `V*`（至少在局部），我们就拥有做出最优决策的所有数据。这一特征将该理论的力量扩展到了概念层面。它与几何概念相关。\n\n由于我们先考虑了多阶段过程，现在我们必须对状态随时间连续变化的系统的动态规划多说几句话。\n\
  \n设所考虑的物理系统是一个粒子（质点），它沿着轨迹运动：\n\n`x(t)`  = (`x1(t),x2(t), x3(t))`\n\n在通常的空间内，在某个时间间隔\
  \ `[to, ti]` 上。已知当满足若干经典假设时，该粒子的运动遵循哈密顿最少作用量原理，只要时间间隔 `[to, ti]` 足够小，就可以很容易地将非相对论以及相对论经典分析力学粒子的基本方程写成控制问题的形式。\n\
  \n在这个控制问题中，粒子的运动由\n\n$\\overset{\\dot}{x} = u,\\{~~~~~~~~~~~~~~~~~~}u = \\left(\
  \ u1,u2,u3 \\right),$(14)\n\n并且一个虚拟的决策者通过在其许容集合中选择反馈控制函数 `u` 来控制其演化，以最小化`代价` `J`\n\
  \n`J`  = ∫[*t0]^(t1)*L(*x(t), *u(x(t),*t), *t*)d**t*(15)\n\n受限于结束条件\n\n`x(t0)`  = `x⁰`,\
  \ `x(t1)`  = `x¹`\n\n`L = L(x, u, t)` 是`拉格朗日`。在最简单的非相对论情况之一：\n\n$L\\left( x,u,t\
  \ \\right) = \\frac{1}{2}{mu}^{2} - U\\left( x,t \\right)$(16)\n\n其中 `m` 是粒子的质量，`U`\
  \ 是势函数。通过通过节方法的扩展，代价必须满足的全局条件被局部条件取代。它是通过辅助函数 `V*`（本问题的最优值函数）引入的。如果满足若干数学假设，该局部条件写为\n\
  \n$\\begin{matrix} {{\\left. \\underset{\\text{u}}{\\text{min}}\\left\\lbrack L\\\
  left( x,u,t \\right) - \\left( \\partial V*/\\partial t \\right) - \\underset{\\\
  alpha = 1}{\\overset{\\Sigma}}\\left( \\partial V*/\\partial x \\right){u_{\\alpha}\
  \ \\right\\rbrack =} \\\\ L{\\left( x,u^{*},t \\right) - \\left( \\partial V*/\\\
  partial t \\right) - \\underset{\\alpha = 1}{\\overset{\\Sigma}}\\left( \\partial\
  \ V*/\\partial x \\right)u_{\\alpha} = 0} \\end{matrix}$(17)\n\n这是我们问题的`动态规划`方程。特别是当\
  \ `L(x, u, t)` 由 (16) 给出时，我们从 (17) 推导出\n\n`u_{\\alpha}^*`  = `(L/m)(∂ V*/∂x)`, `alpha=1,2,3.`(18)\n\
  \n通过代入 (17)，我们得到\n\n$\\left( \\partial V*/\\partial t \\right) + \\underset{\\alpha\
  \ = 1}{\\overset{\\Sigma}}\\left( 1/2m \\right)\\left( \\partial V*/\\partial x\
  \ \\right)^{2} + U = 0$(19)\n\n这是经典非相对论力学中的`哈密顿-雅比方程`。如果我们考虑非完整约束，这一结果是通用的。\n\n\
  在此处有几点注释。爱因斯坦强调了几何在力学中的重要性。路易·布洛义试图将量子力学置于光学框架中。自 1960 年代以来，已经明显最优控制问题可以转化为微分几何问题，其方法直接受到惠更光学原理的启发。变分法中与该方法以及动态规划关系最密切的工作可能是卡拉捷托夫（1935）。\n\
  \n让我们回到简单的例子。\n\n(a) 如果我们沿着 `R³` 中的路径 `x = x(t)` 粒子，我们看到由 `F(t)` 定义的面\n\n`F(t)`\
  \  = `{*y*:V*(y,t)=V*(x(t),t)}` 在 `R³` 在时间 `t` 看起来像一个随时间演化而移动的波前，在所有时刻，粒子的轨迹都正于\
  \ `F(t)`（图 2）。\n\n\n\n(b) 这一图需要用空时表示来补充，其中我们在 `R⁴` 中定义代价面集合 `{S(C)}`：\n\n`S(C)`\
  \  = `{*x,t):V*(x,t)=C}`,，其中 `C` 是任意常数。对于任何给定时间 `t’, t”,`，且 `t’ < t”`，通过点 `(x(t”),\
  \ t”)` 的等代价面 `S(C)` 可以类似于几何光学中惠更斯的方法从通过点 `(x(t’), t’)` 的等代价面 `S(C)` 推导出来（图 3）。因此，我们发现了最优控制问题与几何光学之间的联系。\n\
  \n\n\n### 可达集与可控性：质点相对论动力学的一个实例\n\n现在，让我们考虑由状态方程 (14) 控制的粒子运动，并在代价积分 (15) 中将之前的拉格朗日替换为由\
  \ (20) 给出的：\n\n$L\\left( x,u,t \\right) = {- m_{0}c^{2}\\sqrt{1 - u^{2}/c^{2}}.$20)\n\
  \n`m0` 是粒子的静质量，`c` 是真空中的光速。表达式 (20) 源于相对论中的物理论证（参见例如路易·布洛义）。\n\n通过在动态规划方程 (17) 中使用\
  \ (20) 给出的相对论拉格朗日，我们得到的不是 (18)，而是新公式\n\n${\\partial V*}/\\\\partial{x\\alpha} =\
  \ \\frac{m_{0}\\text{u}\\alpha}{\\\\sqrt{1 - \\left( u^{2}/c^{2} \\right)}}\\alpha\
  \ = 1,2,3,$(21)\n\n\n\n\n\n${\\\\partial V}^{\\*}/\\\\partial t = \\\\frac{m\\_{0}c^{2}}{\\\
  sqrt{1 - \\left( u^{2}/c^{2} \\right)}}\\\\text{~~~},\\\\text{其中 u} = \\\\text{u}^{\\\
  *}$\n\n这是因为动态规划所要求的最小值是在约束集的内部点取得的。(21) 和 (22) 分别是粒子的 `momentum`（动量）和 `energy`（能量）分量的表达式。\n\
  \n对该问题的详细讨论将超出本文的范围。然而，我们将简要描述其某些特征。\n\n在（特殊）相对论中，质点的速度不能超过 `c`，因此我们的约束集定义为\n\n\
   ∥ u ∥ ≤ c(23)\n\n其中 `∥ · ∥` 表示位于 $\\mathbb{R}³$ 中向量的欧几里得范数。\n\n由于我们处理的不是真实的物理粒子，而是它的\
  \ `model`（模型），因此我们倾向于使用 `mass-point`（质点）而非 `particle`（粒子）。由于我们不需要过度担心常数 `mo`，为了简单起见，我们将质点视为\
  \ $\\mathbb{R}⁴$ 中的一个点，该点本身是物理时空的模型。因此，时间 `t` 是 $\\mathbb{R}⁴$ 直角坐标系中质点的一个坐标。\n\n\
  由于约束条件 (23)，从 `(x⁰, t[0])`（称为 `source`（源点））出发的质点无法到达 $\\mathbb{R}⁴$ 的任意点。`reachable\
  \ set`（可达集）如图图 4 所示。令 `x⁰ = 0`，`t[0] = 0`，该可达集是闭锥体\n\n\n图 4.\n\n$\\\\text{g}\\\\\
  left( x,t \\\\right) = - {ct} + \\sqrt{x\\_{1}^{2} + x\\_{2}^{2} + x\\_{3}^{2}}\
  \ \\leq 0.$\n\n它的边界 `g(x, t) = 0` 有时被称为 `cone of light`（光锥）。\n\n在我们的示例中，贝尔曼函数 `V^*)`\
  \ 可以被证明为：\n\n$V^{\\*}\\\\left( x,t \\\\right) = - \\\\text{m}\\_{0}\\\\text{c~~~}\\\
  \\sqrt{c^{1}t^{2} - \\left( x\\_{1}^{2} + x\\_{2}^{2} + x\\_{3}^{2} \\right)}\\\
  {.}(24)\n\n它在光锥上为零。\n\n在前一段中定义的族 `{S(C)}` 的几个等代价曲面如图图 4 所示。我们无需作进一步说明，只需注意到，图 4\
  \ 还展示了名为“大爆炸”的宇宙学现象的极简化版本，其中等代价曲面族中的每个成员都代表了一组相对于宇宙诞生具有相同“年龄”的事件集。\n\n上述问题属于一类与各种状态方程、各种源、各种拉格朗日量以及各种约束相关的大类问题。我们的我们的特殊情况一样，理论有两个目的：\n\
  \n1. 第一，找到可达集\n2. 第二，对于可达集中的任意给定点，找到一条从源点出发并终止该点的最优路径\n\n第一类问题属于 `controllability\
  \ problems`（可控制性问题）类。对于这类问题，特别关注部分或完全属于可达集边界的轨迹。\n\n第二类问题是严格意义上的 `optimal control\
  \ problems`（最优控制问题）。\n\n从动态规划方程 (17) 的证明可以看出，它仅在可达集的内部点 `(x, t)` 成立。在可达集不属于源点的边界点上，另一个关系成立，即\n\
  \n$\\\\begin{matrix} {\\\\underset{\\text{u}}{\\\\text{min}}\\\\left\\\\lbrack -\
  \ \\\\left( \\\\partial\\\\text{g}/\\\\partial\\\\text{t} \\\\right) - \\\\underset{\\\
  \\alpha = 1}{\\overset{3}{\\\\Sigma}}\\\\left( \\\\partial\\\\text{g}/\\\\partial{x\\\
  \\alpha} \\\\right)\\\\text{u}\\\\alpha \\\\right\\\\rbrack =} \\\\\\\\ {- \\\\\
  left( \\\\partial\\\\text{g}/\\\\partial\\\\text{t} \\\\right) - \\\\underset{\\\
  \\alpha = 1}{\\overset{3}{\\\\Sigma}}\\\\left( \\\\partial\\\\text{g}/\\\\partial{x\\\
  \\alpha} \\\\right)\\\\text{u}\\\\_{\\alpha}^{\\*} = 0} \\\\\\\\ \\\\end{matrix}$(25)\n\
  \n只要满足适当的数学假设 `\\`\n\n由于在我们的示例中约束集是紧的，因此 (25) 中的最小值并不一定能够取得。\n\n## 注释\n\n这些引用编号对应以下内容：\n\
