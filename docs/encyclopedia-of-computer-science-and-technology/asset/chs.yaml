  \ Ref.1 中找到。\n\n## 近似与优化，以及计算\n\n这个基本定理为近似、优化和计算之间的联系提供了丰富的材料。这里给三个不同的例子：第一个使用积分内积的多项式逼近，它揭示了求解计算中病态性的基本问题；第二个例子涉及带有三角逼近的经典（连续）傅里级数理论，第三个涉及用于当前计算思想的傅里技术离散化，包括快速傅里叶变换。\n\
  \n*Example 1.* 在空间 C[0, 1] 中，考虑内积\n\n```\n⟨*f*,g*⟩ = ∫[0]¹*f*(x)*g*(x)*d*x,\n```\n\
  \n令 *g*`i*` = *x*^(i-1) 对于 `i` = 1,2,...,`n` 为基函数。很容易检查 〈*g*[`i*`],*g*[`j*]`〉 =\
  \ 1(`i`+`j`-1)，因此该例子中的线性方程 (4) 变为：\n\n$$\n\\begin{pmatrix} \\\\frac{1}{1} & \\\\\
