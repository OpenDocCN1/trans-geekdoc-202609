  \n## 引言\n\n计算机系统的性能评估可以遵循两种方法。首先，如果系统已经存在，可以对其属性进行直接测量。其次，如果系统不存在，或者感兴趣的特定场景创建成本太高或太危险，则可以对系统模型进行研究。然而，系统的建模始终是解决方案的复杂性与准确性之间的权衡。\n\
  \n从历史上看，计算机系统的性能是通过队列网络 [1], [2], [3] 或仿真 [1], [4] 进行建模的。随着对并行和分布式系统架构兴趣的增加，这些技术被证明过于复杂或难以实现。作为替代，基于\
  \ Petri 网的模型 [6], [7], [8], [9], [10], [11], [12], [14] 引起了关注，能够更自然地表示并发和阻塞。\n\n\
  ## 底层模型: Petri 网\n\n由 Carl A. Petri 开发的 Petri 网模型是一种具有两种节点——转换和位置的自动机，它们通过弧连接。位置通常用于表示系统中的条件，转换用于表示可能发生的事件。Petri\
  \ 网的状态由位于位置中的 Token 定义。位置中 Token 的特定模式称为 Petri 网的标记。当每个位置至少有一个 Token 时，转换被认为是激活（可以执行）。当转换实际执行时，它从所有指向该转换的位置移除一个\
  \ Token，并在每个从该转换指向的位置放置一个 Token。\n\n*   **定义 1**：Petri 网是一种二部图 [16], [17], [18]，具有节点\
  \ `P`（位置）、`T`（转换）、输入输出弧 `A` 以及初始标记 `M0`。\n\n    $$ \\begin{matrix} {PN} & \\overset{\\\
  \\Delta}{=} & \\left( P,T,A,M\\_{0} \\right) \\\\ P & = & \\left\\{ p1,p2,...,p_{n}\
  \ \\right\\\\} \\\\ T & = & \\left\\{ t1,t2,...,t\\_{m} \\right\\\\} \\\\ A & \\\
  subset & {\\\\left\\{ P \\times T \\\\right\\\\} \\cup \\\\left\\{ T \\times P \\\
  \\right\\\\}} \\\\ M\\_{0} & = & \\left\\{ m\\_{1}^{0},m\\_{2}^{0},m\\_{n} \\right\\\
  \\} \\\\ \\\\end{matrix} $$\n\n*   **定义 2**：对于 Petri 网 `PN$，定义转换 `t` 的输入位置集合函数 `IP`（即\
  \ `t` 的前驱 [18]）为 `IP`。$IP(t)\\overset{\\\\Delta}{=}\\left\\{ p \\\\middle| \\\\\
  left( p,t \\right) \\\\in A \\\\right\\\\}.$\n\n*   **定义 3**：对于 Petri 网 `PN$，定义转换\
  \ `t` 的输出位置集合函数 `OP`（即 `t` 的后继 [18]）为 `OP`。$OP(t)\\overset{\\\\Delta}{=}\\left\\\
  { p \\\\middle| \\\\left( t,p \\right) \\\\in A \\\\right\\\\}.$\n\n*   **定义 4**：对于\
  \ Petri 网 `PN$，定义位置 `p` 的输入转换集合函数 `IT`（即 `p` 的前驱 [18]）为 `IT`。$IT(p)\\overset{\\\\\
  Delta}{=}\\left\\{ t \\\\middle| \\\\left( t,p \\right) \\\\in A \\\\right\\\\}.$\n\
  \n\n\n\n\n**定义 5：**\n对于 Petri 网 `PN`，定义库 `p` 的输出转移函数 `OT`（即后继集 `p**18]`）为 $OT\\\
  left( p \\right)\\overset{\\Delta}{=}\\left\\{ t \\middle | \\left( p,t \\right)\
  \ \\in A \\right\\}.$\n\n此处给出的输入输出函数定义适用于没有并行弧的网。如果使用了并行弧（多条弧），这些函数定义在包（bags）而不是集合上。\n\
  \n标记（marking）可以被视为从库集合 `P` 到自然数集 `N` 的映射。\n\n`M:P→N` 其中对于 `i=1,2,...,n`，`M(p[i])=m[i]`\
  \ (2)\n\n**定义 6：**\n当一个转移的每一个输入库都拥有一个或多个令牌时，该转移被认为是`已启用`的（即 ∀`p` ℊ ℄`IP(t)`，ↆ`M(p)`\
  \ ℊ > ℄0）。\n\n转移的启用可以被视为该转移所代表的事件所需的条件。普通 Petri 网的扩展增加了从库到转移的抑制弧，该弧执行零测试。如果抑制弧的输入库中有任何令牌，则该转移被禁用。（抑制弧的画法与普通弧相似，但箭头被替换为圆圈。）\n\
  \n**定义 7：**\n一个转移被说为`已触发`，是指它从其所有的输入库中移除一个令牌，并在其所有的输出库中放置一个额外的令牌（即 ∀`p` ℊ ℄`IP(t)`，ↆ`Mi\
  \ ⅅ+ⅅ1` = ℄`Mi` ⅅ− ⅅ1 和 ∀`[p∈OP(t)]`，ↆ`Mi ⅅ+ⅅ1` = ℄`M[i(p)]` ⅅ+1），从而改变了标记函数。\n\n\
  转移的触发将一个标记变为另一个标记。因此，转移的触发可以被视为一个事件的发生，随后导致状态变化。注意，转移在触发时所采取的精确动作存在某些变体。此定义是标准的，也是\
  \ Petri 网理论学家使用的定义。\n\n**定义 8：**\n如果存在一个转移序列 `t^*) 使得 $M_{1}\\overset{t^{\\*}}{\\\
  rightarrow}M_{2}$，则称标记 `M[2]` 从标记 `M[1]` `可达`的。\n\n可达性的概念有时分为两种情况：长度为一的序列特殊情况称为`直接可达`，而长度为一个或多个序列的情况简单称为`可达`。与其他自动机一样，可达性概念非常重要。\n\
  \n**定义 9：**\n可达集 `S` 是从某个初始标记的所有标记 `{M[i]}` 集合。\n\n根据 Petri 网的逻辑行为，我们可以以多种方式对这些行为进行分类。\n\
  \n**定义 10：**\n`PN` 中的库 `pi` 被说为`有界`的，如果存在有限数量的 `k`ℊ`S`。\n\n**定义 11：**\n如果每个 `pi`\
  \ 都是有界的 ∀`pi`∈`P`，则称 `PN` 为`有界`的。\n\n因此，一个 Petri 网是有界的，当且仅当它具有有限的可达集时。\n\n**定义 12：**\n\
  如果事件之间持续的时间为一，则称 `PN` 被说为`安全`的。\n\n**定义 13：**\n如果 ∀`M[k]`ℊ`S`，则转移 `ti` 被说为‘活的’的。\n\
  \n遗憾的是，活性有几种不同的类型。例如，一个转移是活的 `[*17]`。\n\n**定义 14：**\n如果每个转移都是活的，则称 `PN` 被说为‘活的’的。\n\
  \n注意，从 `M` 可达的所有标记并不完全相同。\n\n**定义 15：**\n如果一个 `PN` 只有一个输入和一个输出，则称其为`标记图`或`无决策型`的。\n\
  \n**定义 16：**\n对于任何作为多个转移输入的库，如果称 `PN` 被说为`无冲突`的。\n\n**定义 17：**\n对于任何转移 `t1` 和 `t2`，（`t1*\
  \ t2`），如果它对于所有标记 `[*19]` 都是持久的，则是持久的。\n\n**定义 18：**\n对于所有弧，要么库的输出集合是单个转移，要么转移的输入集合是单个库，则称\
  \ `PN` 被说为`自由自由选择`的。\n\n\n\n\n\nRamchandani 在 1973 年作为其在麻省理工学院（MIT）博士论文的一部分，首次正式地尝试构建了性能\
  \ Petri 特网模型 [6]。他的模型——时性 Petri 特网（TPN），针对的是新架构开发中复杂的硬件建模问题。该模型为转换的触发关联了一个实值，使得模型能够表示具有各种组件延迟的异步电路。该值可以是固定的，也可以被限制在固定值附近的狭窄范围内。\n\
  \n1975 年，Phillip Merlin 在加州大学欧尔文分校的博士论文中提出了一种数据通信协议模型，该模型将时间范围与转换关联。这被用于建模协议中的超时，并影响系统可能获得的状态\
  \ [21, 22]。然而，1977 年，Neil Jones、Lawrence Landwebber 和 Y. Edmund Lien 的论文证明证明，对于\
  \ Merlin 定义的时性 Petri 特网，可达性问题甚至有界性问题是不可判的。\n\n2 世纪 80 年代初，引入了许多不同的模型。Ramamoorthy\
  \ 和 Ho 在工作中恢复了第一种转换触发持续具有固定值的 Ramchandani 模型 [7]。Zuberek 将值限制为整数值，以表示集中式时钟系统 [9]。在另一个极端，随机\
  \ Petri 特网（SPN）分别由作者在美国（[11]）以及 Natkin 和 Florin 在法国（[10]）被引入。SPN 模型与每个转换关联的是一个服从指数分布的随机变量，而不是固定值。\n\
  \n在引入随机 Petri 特网模型之后，一些研究人员采纳并扩展了这一基础模型。1982 年，意大利都灵 strictly 理工大学的研究人员在 SPN 中引入了即时转换的概念，创建了广义随机\
  \ Petri 特网（GSPN）模型 [13]。这些新模型允许独立于时间的优先级和随机选择，同时保留了马尔可夫分析方法。大约同时，杜克大学的研究人员正在使用具有任意分布触发时间的基础\
  \ SPN 模型，开发扩展的随机 Petri 特网模型 [12]，作为混合自动可靠性预测器（HARP）系统的规范语言。这些模型需要使用半马尔可夫技术或仿真进行分析。\n\
  \n许多小组仍然倾向于使用原始的时性 Petri 特网，因此离散时间随机 Petri 特网 [23] 被提出作为这两种模型之间的桥梁。从另一个方向，Vernon\
  \ 和 Holliday 在 1985 年为了相同的目的引入了广义时性 Petri 特网 [24]。\n\n20 世纪 70 年代后期，欧洲 Petri 特网社区正在开发一些新模型。这些新模型——高层\
  \ Petri 特网，通过允许令牌（tokens）具有值从普通 Petri 特网扩展而来。在彩色 Petri 特网 [25] 的情况下，令牌具有某些标识符（或颜色）。在谓词转换网\
  \ [26] 的情况下，令牌是字符串。这些高层 Petri 特网中的转换被修改，使得启用规则取决于令牌的值（即谓词）。\n\n这些模型的出现导致了相应 Petri\
  \ 特网的引入。彩色 Petri 特网由 Alexandre Zenie 在 1985 年引入 [27]。随机高层 Petri 特网由 Lin 和 Marinescu\
  \ 在 1987 年引入 [28]。\n\n## 模型的分类\n\n将时间引入基础 Petri 特网可以通过多种方式实现。特定的时间语义为分类不同模型提供了依据。在本节中，我们将描述可能的语义差异，并以此形成文献中提出的模型分类。\n\
  \n模型的第一个区别在于作为底层模型的 Petri 特网类型。文献中描述了若干不同类型 [17, 18, 19]，它们定义在受限的 Petri 特网上，例如冲突图或自由选择网。\n\
  \n与时间关联的网对象是我们发现的第二个区别。一些模型将时间与位置关联（即时性位置 Petri 特网，TPPN）[8]，而大多数将时间与转换关联（即时性转换 Petri\
  \ 特网，TTPN）[6, 7, 9, 11]。\n\n在时性位置模型中，令牌被输出到位置并在一段时间内不可用。在初始延迟之后，这些令牌改变状态以变为该位置的启用转换可用。你可以通过将时性位置模型中的每个位置替换为用于延迟令牌的时性转换和一个在时性转换触发后持有令牌的位置，从而用时性转换模型构建时性位置模型。\n\
  \n第三个更为微妙的区别在于当两个多个转换并发启用并共享某些输入位置时的转换触发语义。如果在转换触发时间结束之前不移除令牌，则所有竞争转换都可以被认为并发触发。这意味着存在竞态条件，较快的转换可能会抢占较慢的转换。如果时间是确定的，抢占将是绝对的，系统的逻辑行为也是不同的。如果只选择一个转换来触发延迟，并且触发所需的令牌被认为对其他转换触发不可用，那么转换触发语义就包含一个`selection`规则。预选将时间函数与决定触发哪个转换的选择函数解耦来。在转换触发语义中包含预选的性能\
  \ Petri 特网，可以进一步细分为任意执行预选和基于概率函数执行预选的情况（见图 1[#C_016_c14.xhtml#f14_1)]）。\n\n\n\n\n\
  第四种区分是基于单个转换允许的并发触发次数。如果一个转换在某一时刻由于先前的启用而正在触发，且它在同一时刻再次被启用，则会有两种可能的操作：可以启动第二次并发触发，也可以将该转换限制为一次仅允许一个触发进行。在这种情况下，启用位置中的令牌将简单排队，直到当前触发完成。这种区分可以被视为转换的`internal\
  \ parallelism`（内部并行）的衡量标准。如果转换触发的规则允许无限并行，则令牌之间将互不干扰（即不会出现由于队列导致的延迟）。如果规则限制了并行度，则令牌之间可能会相互干扰。同样的概念也可以被描述为负载相关的转换触发规则。这就像比拥有了足够数量的转换副本，以处理启用负载。\n\
  \n最后一种区分是基于与性能 Petri 特网关联的时间值。时间值有三种方式可以与网联联：\n\n1.  可以使用单一固定值（可以是实数或整数）；确定性触发时间。\n\
  2.  可以使用某些固定值周围的值范围。\n3.  可以使用值的分布，使得时间成为随机变量；随机触发时间。\n\n从历史上看，前两种情况被称为定时 Petri\
  \ 特网（TPN），而最后一种被称为随机 Petri 特网（SPN）。然而，关于随机 Petri 特网的早期工作 [*11]]集中在指数分布上 *[12, 13,\
  \ 14*]。后的模型放宽了这一限制 *[12, 13, 14*]，但在名称中仍保留了“stochastic”（随机）一词。显然，允许任意分布的思想（如扩展随机\
  \ Petri 特网 (ESPN) [*12]]）将包含定时 Petri 特网作为特例。\n\n## 性能 Petri 特网示例\n\n文献中有很多不同的模型以某种方式将时间与\
  \ Petri 特网联系。还有一些模型将时间与等效于 Petri 特网的有向图联系。其中许多模型都是这里提到的模型的变体。此列表绝非详尽，但它说明了目前正在使用的模型。\n\
  \n文献中的许多模型与此处介绍的模型具有相同的属性。关于哪些特定的规范结构将构成适当的用户界面，目前仍有大量的讨论。这种讨论将避免这个问题，因为只有用户才能真正确定哪种界面是合适的。\n\
  \n以下性能 Petri 特网的示例应该说明文献中介绍模型的多样性。每个模型都有其优缺点，目前没有任何一个模型占据主导地位，这让它的支持者感到非常沮丧。\n\n\
  ### E 网\n\nNoe 和 Nutt [*20]] 开发评估网（E 网）在外观和操作上与 Petri 特网非常相似。两种模型的操作上有两个基本区别。首先，额外了一种名为\
  \ `resolution location`（解析位置）的转换类型作为开关。其次，触发规则被更改为只有当目标位置为空时才允许转换被启用。\n\n有五种 E 网转换类型，均在图\
  \ 2](#C_016_c14.xhtml#f14_2) 所示。在 `T` 转换中，当 `b` 上有令牌且 `c` 上没有令牌时，转换触发。触发时，令牌从 `b`\
  \ 移到 `c`。在 `F` 转换中，只有当 `e` 和 `f` 都为空时，令牌从 `b` 移到 `e`。在 `J` 转换中，当 `e` 和 `f` 都为空时，令牌从\
  \ `b` 移到 `f`。\n\n![图 2. E 网](img/pg317_Image_213.jpg)\n图 2. E 网\n\n最后两种类型的 E 网 转换使用解析位置类型。在\
  \ `X` 转换中，如果 `r` 包含令牌，则从 `b` 移到 `c`。在 `Y` 转换中，如果 `r` 包含令牌，则选择 `c` 作为输入，令牌从 `b` 移到\
  \ `f`。在构建模拟器时，与转换关联了计时。为了便于性能测量，引入了一个名为 `resource`（资源）的特殊对象。转换可以指定触发所需的资源集。该模拟器将跟踪资源被使用的总时间。\n\
  \n### 定时 Petri 特网\n\n定时 Petri 特网由 C. Ramchandani [6]] 引入。该模型后来被 Ramorthy [*7]]、Sifakis\
  \ [*8]]、Merlin [*21] 和 Zuberek [*9]] 使用。这种扩展的基本思想是为每个转换添加一个标签，指示该转换所需的时间。这些时间值可以是固定的（确定性的）值\
  \ *6]、*7]、*8]、*9]]，或者是某个固定值周围的值范围 *21]]。底层 Petri 特网是安全的（1 界的），并且受限于非反射的、无冲突（无决策）结构。\n\
  \n考虑图 3](#f14_3) 所示的 Zuberek [[*9]]] 示例。这种定时 Petri 特网（TPN）是安全且无决策的，因此转换不会被其他转换禁用。\n\
  \n定时 Petri 特网对可达集施加了额外的约束。底层 Petri 特网中可达的状态在 TPN 中可能不可达。首先，由于转换触发时间可能会同步触发，违反了 Petri\
  \ 特网的单转换触发规则。其次，竞态条件可能始终要求一个转换在另一个转换触发之前触发，从而实际上给了较快的转换优先级。例如，在图 3](#f14_3)所示的 TPN\
  \ 中，标记 (0,1,0,1,0,0,0,1,0) 不发生，尽管它是底层 Petri 特网的可达集。这种对可达集的约束可以被视为一种互锁现象。由于循环之间的这种互锁使得\
  \ TPN 中的循环保持同步，任何连接的、安全的循环的周期时间，\n\n![图 3. 定时 Petri 特网](img/pg319_Image_214.jpg)\n\
  图 3. 定时 Petri 特网\n\n当在网中放置额外的令牌时，对转换操作语义有两种可能的解释。首先，在转换“开始”之后到达的新令牌可能等待直到转换计时周期完成。其次，允许新令牌独立启动该转换的计时，而不考虑任何其他正在使用的令牌。最后一种解释是\
  \ Ramamoorthy 提出的。它意味着转换具有令牌所需的无限内部并行性。\n\n\n\n\n如果放宽 TPN 的无冲突限制，就会出现一些新问题。考虑在同一标记（marking）下启用的两个变态（transitions）。此时有三种方法来选择哪个变态将触发。首先，如果启用令牌没有“提交”给特定的变态，那么这些变态将记录它们的时间值，且最短的时间值总是先触发。因此，即使该变态被启用，它也可能永远不会触发。这产生了一系列全新的死锁检测问题。其次，在选择提交到哪个变态时可以增加一个概率，该概率与迁移时间无关。这增加了性能计算的复杂性，因为需要计算每个可能的优势周期，然后对这些周期取其加权平均值。第三，选择提交到哪个变态可以是任意的，这就是\
  \ Ramamoorthy 的方法。\n\n![FIGURE 4. TPN 时序图](img/pg319_Image_215.jpg)\n\nFIGURE 4.\
  \ TPN 时序图\n\n此类系统的求解非常复杂。Jones、Landwebber 和 Lien [29] 证明了对于图中 Merlin 类型的 TPN [21]，其可达性问题在一般情况下是不可判的。在\
  \ Ramamoorthy [7] 中，给出的证明表明使用周期枚举的 TPN 求解对于通用时序 Petri 网是 NP-完全的。这是通过构建图 5 所示的 TPN\
  \ 实现的，其中最小周期时间的计算等同于集合枚举问题。这确实引发了关于此类模型实用性的一些有趣问题。因此，存在冲突时，求解是困难或不可判的（取决于模型）；而由于缺乏建模冲突的能力，无冲突\
  \ TPN 无法对资源竞争建模，而这使用图模型的主要原因之一。最近，Jan Maggott [30] 研究了自由选择网（free choice nets）等中间模型的复杂性。\n\
  \n![FIGURE 5. 需要 NP-完全分析的 TPN.](img/pg320_Image_216.jpg)\n\nFIGURE 5. 需要 NP-完全分析的\
  \ TPN。\n\nRazouk 和 Phelps [31] 的 TPN 模型是几种不同模型的混合体。它将变态的触发分解为启用时间和触发延迟。启用时间允许并行执行，因此在启用阶段没有预选机制，但一旦启用时间完成，令牌就会分配给该变态并开始计算触发延迟。以类似于\
  \ E 网的方式，资源与变态相关，以便便于性能指标的生成。\n\n### 通用时序 Petri 网\n\n在之前的模型中，底层的 Petri 网被限制在安全网（1-界限网）类中。尽管若干报告讨论了\
  \ k-界限网的问题，但它们的技术仅限于安全网的情况（或要求在变态触发中具有无限的内部并行性）。在通用时序 Petri 网的情况下，允许使用 k-界限网，其理念是变态的预选是概率性的（且与时间无关），使得底层的标记过程形成了一个半马尔可夫过程。\n\
  \n通用时序 Petri 网（GTPN）模型 [24] 消除了对安全性的限制（但保留了界限限制）以及对冲突的限制（如无冲突或自由选择）。变态具有一个 4 元组\
  \ `(t,p,q,R)` 关联：第一个元素 `t` 是变态触发的时间；第二个元素 `p` 是提交到该变态的概率；第三个元素 `q` 是布尔值；第四个元素 `R`\
  \ 是与之相关的资源集合。类似于 E 网的方式，资源与变态相关，以便计算性能指标。\n\n\n\n\n\n底层可达集的这种等效性意味着所有普通的 Petri 网理论都适用于\
  \ SPN。然而，与普通的 Petri 网一样，可达集可能非常巨大。通常，当初始标记中的令牌（token）数量线性增加时，可达集的大小可能会出现组合级增长。这是使用这些任何一种模型作为真实系统的分析模型的主要困难。\n\
  \n考虑图 8 所示的 5 库、5 变迁连续时间随机 Petri 网。该 SPN 显示了顺序操作（`t5,t1`）、并行操作（`t2,t3`）、分支（`t1`）、汇（`t5`）以及竞争（`t4`,`t5`）。包含期望的触发速率\
  \ `λ1 = 2`、`λ2 = 1`、`λ3 = 1`、`λ4 = 3` 和 `λ5 = 2`。假设库 `pi` 中初始有一个令牌，其余库没有令牌，通过求解可达集，我们找到了五个状态。\n\
  \n![FIGURE 8. 一个随机 Petri 网示例。](img/pg323_Image_219.jpg)\n\nFIGURE 8. 一个随机 Petri\
  \ 网示例。\n\n|  || `p1` | `p2` | `p3` | `p4` | `p5` |\n| --- | --- | --- | --- | ---\
  \ | --- |\n| `M1` | 1 | 0 | 0 | 0 | 0 |\n| --- | --- | --- | --- | --- | --- |\n\
  | `M2` | 0 | 1 | 1 | 0 | 0 |\n| `M3` | 0 | 0 | 1 | 1 | 0 |\n| `M4` | 0 | 1 | 0 |\
  \ 0 | 1 |\n| `M5` | 0 | 0 | 0 | 1 | 1 |\n\n可达集同变迁速率构成了与 SPN 模型对应的马尔可夫链（图 9）。\n\n\
  ![FIGURE 9. 示例 SPN 的马尔可夫链。](img/pg323_Image_220.jpg)\n\nFIGURE 9. 示例 SPN 的马尔可夫链。\n\
  \n求解遍历性马尔可夫链，我们得到以下稳态标记概率。\n\nP[`M[1]` = .1163\nP[`M[2]` = .1860\nP[`M[3]` = .0465\n\
  P[`M[4]` = .5349\nP[`M[5]` = .1163\n\n使用稳态标记概率和特定标记中每个库的令牌数量，我们可以计算任何标记下每个库中 `mi`\
  \ 个令牌的稳态概率。这正是令牌概率密度函数。\n\nP[`m[1] = 0]` = .8837 P[`m[1] = 1]` = .1163\nP[`m[2]\
  \ = 0]` = .2791 P[`m[2] = 1]` = .7209\nP[`m[3] = 0]` = .7675 P[`m[3] = 1]` = .2325\n\
  P[`m[4] = 0]` = .8372 P[`m[4] = 1]` = .1628\nP[`m[5] = 0]` = .3488 P[`m[5] = 1]`\
  \ = .6512\n\n如果我们假设一个不同的标记，就会得到一个不同的马尔可夫链。系统中的令牌越多，马尔可夫链就越大。如果我们从库 `p[1]` 中的两个令牌开始，我们会在可达集中找到\
  \ 14 个状态。同样，如果我们从库 `p[1]` 中的三个令牌开始，我们会在可达集中找到 30 个状态。这种状态爆炸是使用这些模型处理复杂系统的主要问题之一。\n\
  \n对任意系统的延迟分析产生两种技术之一。首先，如果等效马尔可夫链具有陷阱状态（trapping states），可以计算到达其中一个陷阱状态所需的预期步数。其次，如果链是遍历的，则可以使用\
  \ Little 结果和流平衡来计算网组件的延迟。\n\n考虑图 8 中的小型 SPN 示例。让 Little 结果应用于由库 `p[2]`、`p[3]`、`p[4]`\
  \ 和 `p[5]` 以及变迁 `t[2]`、`t[3]`、`t[4]` 和 `t[5]` 组成的子系统。由于 `t[1]` 仅在 `p[1]` 包含令牌时启用，因此变迁\
  \ `t[1]` 的利用率为 11.63%。使用 `t[1]` 0.5 单位的平均服务时间，令牌通过 `p[1]` 的平均速率为每单位时间 .2326 个令牌。\n\
  \n根据流守恒，我们知道单位时间内进入子系统的令牌数 `λ` 为 .4652，这是通过 `t[1]` 流的两倍，因为 `t[1]` 是一个分支变迁。由于 `t[5]`\
  \ 是一个汇变迁，流入和流出将保持平衡。由于子系统保持令牌（它既不破坏也不产生），我们可以应用 Little 结果 `N=λT`。子系统中的平均令牌数是子系统每个库中平均令牌数之和。\n\
  \n$N = m_2 + m_3 + m_4 + m_5 = 1.7674$  (3)\n\n因此，平均而言，令牌离开后返回 `pi` 的时间为 3.8 单位时间。对于上述特殊情况，即目标是确定连续时间\
  \ SPN 中标记 `Mi` 的平均复发时间，可以应用另一种不需要令牌守恒的方法。通过观察到直到启用变迁触发的时间就是在该标记中所花费的时间，平均时间 $\\\
  tau_{M}$ 简单地为该标记中每个启用变迁 `i` 的 $(\\sum\\lambda)^{-1}$。在求解稳态概率 $P[M[i]]$ 后，返回标记 `Mi`\
  \ 的平均时间仅为 $\\tau_{Mi}/P[M_i]$。\n\n 扩展随机 Petri 网\n\n由于指数假设具有很大的限制性，一些小组选择放宽这一假设。放宽假设使得分析变得更加复杂。分析的复杂度取决于表示时间的随机变量的精确分布。一个极端是扩展随机\
  \ Petri 网 [12]，其中允许变迁时间的任意分布。\n\n通过允许触发时间的任意分布，底层随机过程不再是马尔可夫的。它可能是半马尔可夫的，允许应用已知技术，或者它可能通用到只有模拟是可能的。模拟可用于分析几乎任何过程（准确来说是广义马尔可夫过程\
  \ [5]），并且不需要生成可达集。通过不生成可达集，避免了状态空间爆炸问题。\n\nESPN 通过增加几个功能扩展自扩展。首先，变迁触发的时间分布现在是任意的。其次，允许使用抑制弧（inhibitor\
  \ arcs）。第三，增加了概率弧以方便指定替代触发。第四，允许多重（或权重）弧，使得带有系数 `k` 的简单弧等同于 Petri 网中的 `k` 个并行弧。\n\
  \n实现优先级和不随时间变化的变迁触发概率的困难，促使另一组研究人员开发了一种不同的模型，该模型在扩展随机 Petri 网的完全通用性和原始随机 Petri 网之间取得了折中。这种模型，广义随机\
  \ Petri 网，为普通的随机 Petri 网增加了一种新的变迁类型，即时变迁。\n\n\n\n\n\n在广义随机彼特网（GSPN）模型中，存在两种变迁。第一类是计时变迁（timed\
  \ transition），与普通随机彼特网中的变迁相同。第二类是即时迁移（immediate transition），是一种特殊的变迁，其触发时间为零（无限触发速率）。当即时迁移被启用时，由于其无限触发速率，它将抢占任何已启用的计时变迁。如果有多个即时迁移被启用，由于两者的速率均为无限，则无法根据相对速率确定哪一个变迁将触发。因此，即时迁移关联有一个概率，用于确定当该变迁与另一个即时迁移并发启用时触发的概率。这种概率可能具有显著依赖性。\n\
  \n在图 10 所示的 GSPN 示例中，计时变迁用小矩形表示，而即时迁移用窄条表示。\n\n![FIGURE 10. 一个 GSPN 示例。](img/pg326_Image_226.jpg)\n\
  \n图 10。 一个 GSPN 示例。\n\n$$\n\\begin{matrix} {prob\\left( {t2} \\right) =} & \\frac{M\\\
  left( {p3} \\right)}{M\\left( {p3} \\right) + M\\left( {p4} \\right)} \\\\ {prob\\\
  left( {t3} \\right) =} & \\frac{M\\left( {p4} \\right)}{M\\left( {p3} \\right) +\
  \ M\\left( {p4} \\right)} \\\\ {prob\\left( {t6} \\right) =} & {\\\\frac{M\\left(\
  \ {p3} \\right)}{M\\left( {p3} \\right) + M\\left( {p4} \\right)}~~~~~~~~~~~~~~{for}~M\\\
  left( {p3} \\right) \\neq 0~{or}~M\\left( {p4} \\right) \\neq 0} \\\\ {prob\\left(\
  \ {t7} \\right) =} & {\\\\frac{M\\left( {p4} \\right)}{M\\left( {p3} \\right) +\
  \ M\\left( {p4} \\right)}~~~~~~~~~~~~~~{for}~M\\left( {p3} \\right) \\neq 0~{or}~M\\\
  left( {p4} \\right) \\neq 0} \\\\ {prob\\left( {t6} \\right) =} & {prob\\left( {t7}\
  \ \\right) = \\frac{1}{2}~~~~~~~~~~~~~~~~~~{for}~M\\left( {p3} \\right) \\neq 0~{or}~M\\\
  left( {p4} \\right) \\neq 0} \\\\ \\end{matrix}\n$$\n(4)\n\n遗憾的是，即时迁移的加入也增加了分析的复杂性。GSPN\
  \ 的目标之一是保持对模型进行解析分析的能力。然而，某些变迁以无限速率触发的事实意味着某些标记（相应马尔可夫系统中的状态）将存在零时间。这与标记概率为零（即不发生）不同。因此，生成马尔可夫链的算法需要移除无形标记（intangible\
  \ markings，即发生但持续时间为零的标记），这包含了底层网中任何启用一个或多个即时迁移的可达状态。\n\n### 有形标记 (Tangible Markings)\n\
  \n| | `p1` | `p2` | `p3` | `p4` | `p5` | `p6` | `p7` |\n| :--- | :--- | :--- | :---\
  \ | :--- | :--- | :--- | :--- |\n| | | | | | | | |\n| `M0` | 2 | 0 | 1 | 1 | 0 |\
  \ 0 |\n| | | | | | | | |\n| `M1` | 1 | 0 | 0 | 1 | 1 | 0 |\n| | | | | | | | |\n\
  | `M2` | 1 | 0 | 1 | 0 | 0 | 1 |\n| | | | | | | | |\n| `M3` | 0 | 0 | 0 | 0 | 1\
  \ | 1 |\n| | | | | | | | |\n| `M4` | 1 | 0 | 0 | 1 | 0 | 1 |\n| | | | | | | | |\n\
  | `M5` | 1 | 0 | 1 | 0 | 1 | 0 |\n| | | | | | | | |\n| `M6` | 0 | 0 | 0 | 0 | 0\
  \ | 2 |\n| | | | | | | | |\n| `M7` | 0 | 0 | 0 | 0 | 2 | 0 |\n\n### 无形标记 (Intangible\
  \ Markings)\n\n| | `p1` | `p2` | `p3` | `p4` | `p5` | `p6` | `p7` |\n| :--- | :---\
  \ | :--- | :--- | :--- | :--- | :--- | :--- |\n| `M0` | 1 | 1 | 1 | 0 | 0 | 0 |\n\
  | | | | | | | | |\n| `M1` | 0 | 1 | 0 | 1 | 1 | 0 | 0 |\n| | | | | | | | |\n| `M2`\
  \ | 2 | 0 | 0 | 1 | 0 | 0 | 1 |\n| | | | | | | | |\n| `M3` | 0 | 1 | 1 | 0 | 0 |\
  \ 1 | 0 |\n| | | | | | | | |\n| `M4` | 2 | 0 | 1 | 0 | 0 | 0 | 1 |\n| | | | | |\
  \ | | |\n| `M5` | 1 | 0 | 0 | 0 | 0 | 1 | 1 |\n| | | | | | | | |\n| `M6` | 1 | 0\
  \ | 0 | 0 | 1 | 0 | 1 |\n| | | | | | | | |\n| `M7` | 0 | 1 | 0 | 1 | 0 | 1 | 0 |\n\
  | | | | | | | | |\n| `M8` | 0 | 1 | 1 | 0 | 1 | 0 | 0 |\n\n移除无形标记并没有增加算法的阶数，但引发了其他微妙问题。由于即时迁移需要零时间，变迁的循环可能会无限进行而不会产生任何有形状态。发现并避免此类循环是普通\
  \ SPN 和 GSPN 之间的算法差异之一。文献中提出的另一个点是，即时迁移相对于计时变迁的优先级导致了类似于 TPN（计时彼特网）中发现的问题，GSPN 模型的可达集（包括无形标记）与彼特网不同。在图\
  \ 10 所示的示例中，标记 (0,2,1,1,0,0,0) 不可能发生，因为 `p2` 中的标记只能来自迁移 `t1`。一旦 `t1` 触发，必须触发 `t2`\
  \ 或 `t3`，`t1` 才能第二次触发并将 `M(p2)` 增加到 2。\n\n### 随机彼特网 (Regenerative Stochastic Petri\
  \ Nets)\n\n随机彼特网的一个较新用途是指定仿真的结构。在 ESPN 的情况下，必须使用仿真来分析移除了指数分布触发时间限制的网。\n\n再生随机彼特网被建议作为一种通用框架，用于更正式地描述仿真程序。Haas\
  \ 和 Shedler [14] 描述了一种随机彼特网模型，其触发时间具有“新优于旧”（NBU）分布，并证明了此类模型构成了再生随机过程。在随后未发表的作品中，他们证明了\
  \ RSPN 与仿真（即广义半马尔可夫过程）之间的关系比最初认为的还要强。\n\nRSPN 模型与 SPN、GSPN 和 ESPN 模型略有不同。RSPN 模型以类似于\
  \ GSPN 和 ESPN 模型的方式向 SPN 模型添加了抑制弧（inhibitor arcs）。变迁在通常意义上是被用的。然而，触发规则非常独特。在 RSPN\
  \ 中，当变迁触发时，它从随机选择的输入位子集中移除标记（每个输入弧一个），并在随机选择的输出位子集中放置标记。因此，变迁可能不会移除启用其所需的标记，同样可能无法启用一个输入位子包含触发变迁的输出位子的后续变迁。\n\
  \n### 总结\n\n这些模型统称为性能彼特网（performance Petri nets）。这是为了从应用领域上将其与更倾向于验证和计算理论的传统彼特网模型区分开来。这一研究领域正在快速变化，最近的若干结果无疑在本综述中被遗漏了。\n\
  \n\n\n\n\n虽然此处介绍的分类具有一定的结构性，但模型之间的差异往往细微且广泛。尝试使用每种模型来真正理解它们的一些区别是非常关重要的。遗憾的是，这里给出的示例小到可以完全描述，但又小到不足以说明各种模型中可能存在的许多微妙相互作用。这里介绍的许多模型都配有软件工具，使得对更大、更有趣的问题进行分析变得可行。\n\
  \n总结，目前使用的性能佩特里网主要分为两大类。第一类是`timed Petri net`（时间性特里网），指具有确定性触发时间的模型。第二类是`stochastic\
  \ Petri net`（随机性特里网），指具有随机触发时间（基于某种分布）的模型。各种模型之间的一个正交区别在于在任何可能发生冲突的情况下，使用预选（preselection）将迁移选择概率与迁移时机解耦。\n\
  \n目前，还没有一种模型能够主导应用，尽管 `TPN` 在灵活制造领域正受到关注。显而易见，每个模型都存在明确的理论问题。然而，还没有替代方案可以避免这些模型面临的所有潜在问题。任何需要构建状态空间（即可达集）的技术都面临状态空间爆炸问题。即使是在具有受限触发条件的网中枚举环路的想法也是\
  \ `NP complete` 的。任何需要模拟的技术虽然避免了状态空间爆炸，但也丧失了任何验证能力。\n\n答案似乎在于一种不生成可达集，而是利用对特殊佩特里网更深理论工作的技术。遗憾的是，对于\
  \ `PPN`，由于其触发规则导致可达集与理论分析中使用的底层 `PN` 可达集不同，应用这些技术将极其困难。\n\n## 参考文献\n\n1. `M. Molloy`,\
