  \ 1985。\n\n\n\n实验数据通常分为实验数据和模拟数据。前者通常是对某些物理现象的测量（例如，粒子束的碰撞或分子在强磁场中产生的光谱）。后者通常是由于使用了前一个时间间隔的值，通过复杂计算而得出的结果。这两者都可以根据两个重要特征进行分类：规律性和密度。\n\
  \n### 实验特征\n\n前者指的是被测量或计算的数值点或坐标的模式（例如，在物理实验中，探测器被放置在特定的配置中；如果该配置描述的是规则网格或其他几何结构，则称该实验具有\
  \ `spatial` 空间规律性）。通常，规律性意味着可以通过计算在测量值的坐标与这些值的存储位置之间建立映射关系。相反，当存在空间不规则性时，则需要枚举数据点，并将它们的标识符与数据值一起存储。\n\
  \n后者指示是否所有潜在数据点都有与之相关的实际值（例如，在规则网格上计算的流体运动模拟数据，会对网格的每个点计算出数据值（如速度、方向等），因此数据被认为是密密的）。另一方面，在许多实验中，大量低于某些阈值的测量值会被丢弃且不记录。稀疏性意味着存在大量的空值，这些空值可以被压缩[9]。\n\
  \n### 关联数据\n\n关联数据通常分为实验`support`数据和从实验数据`generated`的数据。前者分为两种类型：配置数据和仪器数据。后者分为三类：分析数据、汇总数据和属性数据。\n\
  \n#### 配置数据\n配置数据描述了实验或模拟的初始结构。通常它们在实验或模拟过程中不会改变，但在不同实验和模拟之间可能会改变。在最后的情况下，跟踪这些变化至关重要，并将正确的配置数据与相应的实验数据相关联。\n\
  \n#### 仪器数据\n仪器数据（对正确分析实验数据至关重要）是实验中使用的不同仪器的描述及其随时间的变化。\n\n#### 分析数据\n分析数据是通过分析实验数据产生的数据；产生此类数据的分析过程可能需要几个步骤。捕获分析过程、每一步的输入和输出数据库以及步骤之间的关系非常重要。\n\
  \n#### 汇总数据\n科学数据库类似于统计数据库，处理数据集的统计摘要（聚合），通常是经过聚合的。与统计数据库的情况一样，需要组织、搜索和浏览汇总数据集合，并保留它们与源自低级数据之间的关系。\n\
  \n#### 属性数据\n属性数据代表了在材料、现象、物质等的属性组织和分类方面投入大量工作；它们是多年学习信息的总结，但遗憾的是，许多属性数据库无法在线访问。属性数据并非统一：它们包含了数值数据、图像、图表和直方图，以及文本和参考文献数据；它们通常被称为“多媒体”数据。\n\
  \n### 结论\n\n一些重要的结论是[9]：\n\n*   多维数据在科学数据库中非常普遍，需要高效管理、访问和压缩多维数据的方法。\n*   尽管科学数据库通常很大，但它们通常可以被划分为小的独立单元；这意味着可以应用并行处理。\n\
  *   科学数据库包含了多种支持数据，描述了仪器和实验配置；某些配置数据需要工程数据库系统才具备的特殊功能。\n*   科学数据的分析产生许多汇总数据集；需要特殊技术来处理分析数据和汇总数据，以管理它们的元数据、跟踪多个数据集并处理非标量数据类型（如向量和矩阵）。\n\
  *   科学数据库的历史方面（例如，测量数据的时间序列、生成不同数据汇总的历史序列等）非常重要。\n\n上述许多点涉及与统计数据库中相似的方面（特别是对数据多维方面的支持、历史方面以及对汇总数据的处理）。由于这些原因，也加上商业数据库管理系统无法以适当的方式同时支持统计和科学应用，研究人员往往将他们领域的问题合并到一个区域内[3,4,7]。\n\
  \n## 统计数据库的特征\n\n为了使数据库对统计分析有用，在数据库中建立一些特征至关重要；这些特征涉及对数据库中定量信息的充分描述（例如，应该包含下文定义的适当“元数据”）。这种描述对于理解从数据分析中得出的推理是绝对必要的。某些类型的描述或定义几乎总是包含在数据库中，但其他信息几乎从不包含。详细的分析将揭示与这种描述相关的细微差别，在没有这些描述的情况下往往无法进行建模[10]。\n\
  \n然而，对数据进行特征描述很重要，其信息性质可以是`aggregate`聚合或`disaggregate`分解的。更准确地说，我们可以区分[6]微数据（即单个事件的记录，例如，从人口普查、抽样调查获得的数据，或仅仅是关于特定公司员工、数据库客户的数据等）和宏观数据[11，即对传统数据库中的微数据应用统计数学函数产生的数据（例如，按疾病、年份、性别和地区划分的死亡表，或按工作区域、地区和年份划分的职业序列等）。\n\
  \n日常情况下，统计用户往往无法直接获得数据。这些用户通常需要参考已聚合的数据（在不同的聚合层级，取决于各种因素，如信息源、分解数据的私密性等），这些数据通常由为了收集和发布信息而建立的机构、行业、银行或其他公共或私有组织提供或要求发布其活动的统计信息：我们通常使用“数据所有者”来称呼这些信息源。\n\
  \n关于特定领域的宏观数据通常分布在不同的数据所有者之间；因此，统计用户的活动在第一阶段的特征是对来自这些不同信息源的数据进行同质化，并在可能的情况下检查可用不同聚合层级之间的语义一致性和可比性。我们将在异构数据源节中讨论这个问题。\n\
  \n\n\n\n\n关于微数据（microdata），相对于人们想要描述的数据逻辑（及概念）表示，以及对数据的处理和管理，已经有许多令人满意的解决方案 [12]。相反，人们普遍认为，传统的\
  \ `DBMS` 在许多方面无法高效地管理宏观数据（macrodata）并支持统计（及科学）应用 [5,8]。\n\n现在让我们来看看区分统计宏观数据与微数据的特征，以及在这些数据的获取、逻辑和概念表示、记忆化、查询、详述，以及更广义的管理过程中出现的问题。\n\
  \n在统计宏观数据特征的主要要点中，我们可以列出以下几（随后我们将使用“宏观数据”、“汇总数据”和“定量数据”作为同义词）：\n\n1. 它们是稳定的，这种意义是指它们代表了在时间上合并的事件；事实上，一个代表欧洲汽车生产的表格包含了根据描述它的变量分类的数据（例如：汽车公司、型号、排量、生产国、生产年份等），但相对于汽车生产的数据始终指的是已经发生的事件（汽车生产指的是过去的年份或月份，因此这些数据通常上已无法再被更改）。在这种情况下，这种“动态性”体现在数据库的扩大（增加新数据）。例如，如果关于某现象的记忆化数据在\
  \ 1986 年 6 月停止，则可以添加关于后续时段（1986 年 7 月……到 1988 年 2 月……）的关于（相同现象的）的新数据；因此，刻画汇总数据的某些变量域的实例数量增加了。\n\
  \n2. 在这些表格中，始终存在两个变量（隐式或显式表示）——“时间”和“空间”（例如，现象发生的时间和地点）。\n\n3. 表格中出现的定量数据总有一个计量单位（例如：吨或公升，但也像“数量”情况那样，只是一个简单的数字）。\n\
  \n4. 宏观数据（通常仅为数值）始终具有一种数据类型（可以是简单的“数量”，也可以是“比率”、“平均值”等），该类型取决于应用于原始微数据的函数。\n\n5.\
  \ 表格（汇总属性）中出现的每个数值（实例）都由描述它的变量实例组（元组）（类别属性）来刻画；例如，在图 1\n\nFIGURE 1.\n\n6. 在这些表格中出现“缺失值”或“稀疏数据”并不罕见；对于前者，这是所有类别属性可能值的`笛卡尔积`的直接结果。事实上，这可能是因为没有对某个类别属性的所有实例采集数据（例如，在图\
  \ l 中，1986 年和 1987 年“Dyane”型号汽车的产量没有被记录），也可能是因为它们没有任何意义（如果考虑到按性别、疾病类型等描述的死亡率表，那么女性前列腺肿瘤的死亡数据是缺失的，因为它们没有意义）。对缺失数据的适当统计处理通常取决于缺失的原因，正如我们在上一个示例中看到的，对于问卷等，逻辑结构可能会影响对缺失值的解释。\n\
  \n我们将在第 7 项中讨论统计表中空值的表示和解释。\n\n然而，关于稀疏数据，许多数据集中存在缺失数据的结构化模式。这在设计实验中尤为如此，“设计”是对自变量水平的最优稀疏覆盖。关于稀疏数据的处理的研究正在进行，以寻找节省存储、描述元数据以及优化检索的方法，同时保持逻辑描述独立于存储考虑。\n\
  \n7. 对这些表格的操作在概念上与在微数据上执行的操作不同（例如，如果考虑对一个类别属性进行重新分类：新属性的实例可以通过重组原始属性的若干实例来获得；例如，从“1\
  \ 月”、“2 月”和“3 月”变为“第一季度”）。传统的删除、插入和修改操作是稀见的，甚至是不允许的。\n\n8. 处理的数据种类比传统的 `DBMS` 大得多（矩阵、向量、时间序列、关系、时间排序集等）。\n\
  \n9. 涉及管理操作的数据量通常很大，数据库本身也很大（有时包含数亿记录）。\n\n上述内容说明了商业 `DBMS` 与统计 `DBMS` 在数据属性和数据操作方面的区别，以及用户在使用不完全合适的工具时面临的困难（通过将\
  \ `DBMS` 与统计软件包接口获得的混合系统通常被定义为 SDBMS）。\n\n## 多维数据结构与元数据\n\n多维性是 `SSDBs` 的主特征。`SSDBs`\
  \ 的许多特征和要求都可以追溯到这一特征。所描述的现象（例如，1970-1980 年美国的就业水平）通常是一个多维现象，其中例如在统计表格中出现的数值通常由一组类别或参数来区分。例如，出口国、进口国、商品、年份和月份等术语可以用于识别贸易数据，而温度、酸度、盐度、暴露时长和使用的材料等术语可以描述一个腐蚀实验。\n\
  \n在这些示例中，自然存在一个收集测量数据的多维空间。我们稍后将检查这在物理和逻辑层面是如何反映的。\n\n处理多维空间的困难由于每个维度本身可能具有复杂的（通常是分层次的）结构而进一步增加；换句话说，描述汇总数据的每个类别属性都可以进一步细分为子类；能量可以细分为石油、煤炭和天然气。单个维度的这种细分可以持续到许多层次，有时会发生重叠。表示这种复杂性需要在逻辑和用户界面层面需要特殊设施\
  \ [9]。\n\n多维性属性使得多维数据结构（如网格文件、四叉树或 K-D ）成为 `SSDBs` 吸引人的数据结构。当同时需要多维空间某个区域内的多个数据值时，这些数据结构特别有效\
  \ [14]。\n\n\n\n关于元数据在统计数据库（SSDBs）中的重要性，我们可以说：“元数据对于人类和计算机程序指定统计数据信息都是必要的。它可以提供逻辑模型的定义，并能为数据库管理员和用户提供更具体的文档细节。定义良好且区分的元数据对于允许不同的逻辑与物理表示之间、统计数据库与应用程序与用户界面之间，以及多个分布式和异构系统之间进行软件链接是必要的”\
  \ \\[*2*]]。此外，它们“在交互式环境中是关重要的，在这种环境中，任何例的输出都可以立即作为另一个程序的输入” \\[11*]]。\n\n此外，“统计元数据包含观测数据的某些数值函数（可能是向量值），这些函数可以用于计算其他统计量”\
  \ \\[15*]]。\n\n“许多统计数据库系统（SDBMS）中的研究人员重新发现，元数据不仅在数据描述中起着重要作用，在增强数据的统计处理方面也起着关键作用\
  \ \\[16*]]。\n\nMcCarthy 对元数据（包括 DBMS 研究人员所知的统计元数据）提供了一个极佳的概述。根据 McCarthy 的观点，元数据是关于数据的数据，即关于数据内容和组织的系统性描述信息，这些信息可以通过多种方式进行检索、处理和显示。“他对统计元数据的定义包含了数据库层面的默认规范、误差扩展、聚合或去聚合表达式、抑制表达式等”\
  \ \\[15*]]。\n\n正如管理数据一样，组织和管理元数据也是必要的。然而，元数据通常包含大量文本，其结构可能比纯字符串更复杂。因此，需要用能够处理文本的工具来管理元数据。大多数数据管理系统和统计软件包在这方面的能力非常有限。\n\
  \n元数据管理的要求包括特殊的数据和处理语言，这些语言包含正确的数据类型和结构，如变长文本、分层属性、向量和矩阵。其他设施应包括对元数据关键词的自动修复、元数据查询工具，以及用户查找数据库中存储主题的浏览能力\
  \ \\[6*]]。\n\n根据 DBMS 研究人员的观点，元数据具有两种属性：功能性（基于用途）和操作性（基于实际使用和存储的对象）。关于第一个属性，元数据用于以下目的：\n\
  \n1. 数据的存储和检索；例如，如果希望分析特定的人口普查区，必须检查元数据，以选择感兴趣的数据项以及作为数据检查的变量定义。\n2. 数据的呈现和显示；此类类别可能包括表格的文档和显示。在这种情况下，元数据将包括变量定义、案例名称以及其他标题和脚注信息（例如指示数据来源）。\n\
  3. 数据分析（包括可能在数据上进行的任何计算，如聚合、比较、重新分类等）。\n4. 数据的物理处理。\n\n## 异构数据\n\n\n\n\n让我们简要讨论一下主题；首先从概念层面，然后从逻辑层面来看。一个特例是语义模型\
  \ `SAM*` [22]，作者在模型中提出了一种网络结构（作为表示数据库概念设计的手段）和一种用于表示数据库实现设计的表格结构；该模型引入了一组重构操作和代数运算。\n\
  \n### 汇总数据的概念模型\n\n概念数据模型是描述现实的工具：每个模型为了实现这一目标都会使用一组有限的表示结构。抽象是建模现实中一种强大的机制。抽象是一种心理过程，当我们选择一组对象的某些特征和属性，并忽略与应用无关的其他特征时，就会使用它。\n\
  \n概念统计模型（`CSM`）在其他处有讨论 [23]，并描述了一种统计应用的概念设计方法，该方法使用两种不同的数据模型分别处理原始数据和汇总数据，其使用的表示结构和相应符号如图\
  \ 2 所示。\n\n![FIGURE 2.](img/pg387_Image_245.jpg)\n\nFIGURE 2.\n\n在概念统计模型中，概念数据库设计通用方法论（用于规范统计应用问题）的方法和指南已被采用，所采用的方法由以下三点组成：\n\
  \n1. 选择两种不同但互补的数据模型来描述原始数据和汇总数据（以提高两个层次表示的表达能力）：Chen 的 E-R 模型和对 Grass 模型的重新定义 [10,\
  \ 24]。\n2. （在方法中使用）原始数据的概念模式。\n3. 一种统计模式的设计策略，由自上而下和自底向上活动之间的有效权衡组成。典型的自上而下活动包括草案原始模式的设计、骨架统计模式的设计以及聚合子模式的设计。自底向上的活动可以是通过聚合子模式的增量合并来设计统计模式。\n\
  \n正如前面提到的，在语义模型 `SAM*`（语义关联模型）中定义了一种表结构：广义关系（或 G-关系），它使用了两类属性（类别和汇总）[27]，而关系模型的关系是这种结构的特例。该模型遵循两种通用类型的概念：原子或不可分解概念和非原子概念。相反，“关联”被定义为“将原子和/或非原子概念进行分组，以描述另一个非原子概念”。定义了七种关联类型，它们对于数据库的概念建模非常有用。在描述此类关联时，作者使用了带有标记节点和弧的网络表示法。如果不同的用户认为同一个非原子概念具有不同的语义属性，则该概念将被标记为多个关联类型名称。\n\
