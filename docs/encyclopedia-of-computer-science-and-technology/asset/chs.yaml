  \n### 现有模型的不适用性\n\n正如前面提到的，许多作者认同的一点是，许多模型并不适用于正确地表示和操作统计汇总数据。\n\n特别是，关系模型完美地解决了为用户通过“关系”表示信息以及通过“关系代数算子”操作信息（即传统的数据库微数据）的格式正确性和方法问题。这导致许多研究人员为统计数据库汇总数据也提出了相同的模型和代数。为了操作此类数据，越来越需要扩展关系代数，引入其他能够执行统计环境（以及相对数据库）典型查询的算子，并重新定义代数本身的传统算子。\n\
  \n如果一个统计表实际上是由关系模型表示的，那么将若干关系代数算子应用于表示上述表的关系，我们将得到汇总数据，其信息意义往往是虚假的。这些算子之一就是投影。例如，如果我们考虑图\
  \ 4 中的表（为了方便起见通过两个表表示），并应用以下投影算子：\n\n![FIGURE 4.](img/pg390_Image_247.jpg)\n\nFIGURE\
  \ 4.\n\n```\nΠ type of source, country, absol. value ENERGY CONSUMPTION\n```\n\n\
  \n\n\n对于图 5 中的关系 `Ri = Energy Consumption`（该关系表示了上述两个表之间的关联），我们得到了一个新关系（如图 6 所示），其汇总数据已经丧失了信息价值。事实上，意大利在\
  \ 1982 年固体燃料的消耗量假设了两个不同的数值（在特定情况下，这对于任何国家和任何年份都是如此）；这种歧义源于消除了“年份”这一属性，该属性是刻画原始数值数据的属性之一，但在消除它时没有区分这两个属性（“年份”和“能量消耗”）所具有的不同角色——描述性和汇总性。从这个例子可以推断出，关系代数在正确处理统计数据库数据方面存在局限性，因为它的算子可以生成不再表示统计表的关系。此外，这种模型在类别属性实例方面会导致元组的巨大冗余（参见图\
  \ 2 中的表格），因为它以单维的方式表示了一个本身是多维的结构（统计表）[*24*]。这种单维性应理解为：在关系中，汇总属性的实例沿着某一列的方向报告；而实际上，这些实例必须被视为多维笛卡尔空间中的点，以类别属性为轴。\n\
  \n![FIGURE 5. Energy consumption.](img/pg391_Image_248.jpg)\n\nFIGURE 5. 能量消耗。\n\
  \n![FIGURE 6. Energy consumption.](img/pg391_Image_249.jpg)\n\nFIGURE 6. 能量消耗。\n\
  \n我们将在关于 SSDBs 算子和查询语言的章节中看到，该领域的研究人员是如何应对这种不适用性的。\n\n## 汇总数据的逻辑模型\n\n在制定适用于统计数据库的逻辑数据模型时，有两种不同的方法。一种方法是尝试扩展传统数据模型，以包含统计处理中常见的概念。这种方法的示例出现在\
  \ Hebrail [*26*] 和 Tansel [*27*] 中，其中汇总集和时间的概念被添加到关系模型中（此类数据通常被称为“历史数据”）。\n\n第二种方法是开发新模型，以便终端用户使用数据。Chan\
  \ 在该领域的影响性工作 [*25*] 引入了两种抽象来组织统计信息：类别属性和汇总属性。\n\n值得注意的是，从业人员将参数（对应类别属性）和变量（对应汇总属性）区分开来，因为这有助于更好地理解内容。其主要处之一是系统能够知道应该应用何种聚合操作。\n\
  \n这种方法的示例如图图 7 所示。GRASS 模型基于一个无环有向图，具有四种节点：`S`、`T`、`A` 和 `C`。\n\n- `S` 代表概念关系（现象）。\n\
  - `T` 代表汇总数据（表级）。\n- `A` 代表聚合概念。\n- `C` 代表类别属性。\n\n`tn` 节点代表类别属性定义中的值之一。`C` 节点表示域（为了与已经引入的原始域区分，此域将是其提取自原始域的子集，并且显然可以与原始域重合）。\n\
  \n![FIGURE 7.](img/pg393_Image_250.jpg)\n\nFIGURE 7.\n\n只要不同节点在同一个表树方面不冲突（即它们具有相同的\
  \ `T` 节点），我们就可以为不同的节点（`A` 和 `C`）使用相同的标签。\n\nFigure 8 展示了使用 GRASS 模型制作的统计数据表示示例。这种图形化表示是功能性模型\
  \ Mefisto [*30*] 的一部分，该模型基于简单统计表概念 (SST)，SST 是通过对微数据（即离散数据）应用聚合函数（通常是 SUM 或 COUNT）得到的数据结构。因此，SST\
  \ 是具有以下特征的数据结构：\n\n![FIGURE 8.](img/pg394_Image_251.jpg)\n\nFIGURE 8.\n\n1. 单一汇总属性（定量或计算数据），它代表了\
  \ SST 中描述的统计现象的属性；其实例是表中的数值。\n\n\n\n\n\n2. 一组类别属性（定性数据），即明确描述汇总属性的变量。\n\n3. 一组值，我们将其称为表格的变量域（variable\
  \ domain），对应于每个类别属性；这些值通常是字母数字组成的字符串。\n\n4. 一种特定的数据类型，取决于产生汇总属性的特定聚合函数；例如，`COUNT`\
  \ 函数产生“绝对值”数据类型（例如：数量），`PERCENTAGE` 函数产生“百分比”类型等。\n\n汇总属性的每个实例都通过类别属性实例的组合（笛卡尔积）来表征。SST（统计摘要表）允许用户对原始微数据的结构以及在这些数据上为了获取\
  \ SST 所进行的聚合活动有精确的了解。\n\n在 Mefisto 模型中，SST 是一种复杂数据类型，可以用元组 `(R,g)` 表示，其中 `R` 是一个关系，其属性是\
  \ SST 类别属性，而 `g` 是一个将描述宏观数据的类别属性映射到相同宏观数据的函数。\n\n用于表示 SST 的结构形式基于数学函数，且 SST 的标签刻画了其内容。\n\
  \nMefisto 模型能够通过以下方式描述 SST：(1) 一种数据结构；(2) 一组能够操作数据的算子集。\n\n最近提出了一种新模型 STORM（统计对象表示模型）[31]，在该模型中，作者在以往模型的基础上定义了一种新的统计实体，称为“统计对象”（SO），并引入了三个不同的表示层和两个不同的表示空间。\n\
  \n简而言之，统计对象（SO）是一个复杂的数据结构，由三元组 `{u, cf}` 定义，其中：`u` 是 SO 的名称，定义了所描述现象的范围（例如，如果 SO\
  \ 的名称是“1988 年美国汽车产量”，那么该范围将由 1988 年美国生产的汽车数量组成）；`c` 是类别属性的有限集，每个属性都有其自己的定义域（其实例可以是集合值类型）；每个类别属性具有一定数量的*模态*（称为“域基数”），这对应于该类别属性或该\
  \ SO 域的实例数量；`f` 是一个函数，从相对于该 SO 的类别属性的笛卡尔积（或其子集之一）映射到 SO 自身的汇总值。\n\n若干参数可以绑定到每个 SO\
  \ 名称上；这些是 SO 的类别属性，它们在定义域中只有一个值（例如，“统计来源”，有时为“地点”和/或“时间”等）。\n\nStorm 模型定义了三个表示层，分别称为“主题”层（`T`\
  \ 层）、“统计对象”层（`S` 层）和“基础”层（`B` 层）。\n\n只有 `T` 类型节点出现在第一层（T 层）。\n\n`T` 节点代表一个主题，即一个或多个\
  \ SO 或一个或多个 `T` 节点进行分类或聚合的依据。在该层，结构是一个有向的、无环的连通图。\n\n这是一个“概念”层，意义在于 `T` 节点（或底层的\
  \ `S` 节点）可以根据随设计人员而异标准进行分组。\n\n统计用户可以根据自己的观点重新设计“视图”（这种观点在任何情况下都是“个人的”，类似于关系型数据库管理系统\
  \ RDBMS 的子模式）。\n\n所有较低层次的 `T` 节点将指向一个或多个 `S` 节点。\n\n三类节点（`S`、`A` 和 `C`）出现在第二层（S\
  \ 层）。`S` 节点代表所有的 SO 汇总属性值；每个 `S` 节点始终有一个名称（或标签）。最终的参数、数据源、数据类型和计量单位与名称相关联。\n\n`A`\
  \ 节点代表描述上述汇总属性的类别属性的聚合；这种聚合实际上是上述每个类别属性定义域实例的笛卡尔积。一个 `A` 节点甚至没有名称。\n\n`C` 节点代表一个类别属性；每个\
  \ `C` 节点都关联一个定义域。每个 `C` 节点都有一个名称；属于不同 SO 的 `C` 节点可以同相同（但在同一个 SO 中不允许出现同义词）。\n\n\
  Storm 图的示例所示图 9（T 层）和图 10。\n\n![FIGURE 9.](img/pg396_Image_252.jpg)\n\nFIGURE 9.\n\
  \n![FIGURE 10.](img/pg397_Image_253.jpg)\n\nFIGURE 10.\n\n代表 SO 的树根始终是一个 `S` 节点。\n\
  \n在 `S` 节点下方总有一个指向它的 `A` 节点。该 `A` 节点反而是两个或多个 `C` 节点的根。\n\n最后在第三层（B 层）只出现 `C` 和 `A`\
  \ 节点。`C` 节点代表“基础”（或原始）属性，S 层类别属性是从这些属性提取的。后者的定义域包含在基础属性中。\n\nStorm 模型通过在 S 层和 B\
  \ 层引入两个不同的空间，解决了类别属性与其属性实例之间的歧义。在 S 层，这些空间被称为 SO 空间和类别属性实例空间。\n\n在 B 层，这些空间分别被称为基础类别空间（内涵形式）和基础属性实例空间（外延形式）。\n\
  \nS 层提出的解决方案所示图 11。\n\n![FIGURE 11.](img/pg398_Image_254.jpg)\n\nFIGURE 11.\n\n\
  Storm 模型解决了在不同情况下（在统计现实中很常见）出现的问题。例如，当图中出现特定的依赖关系（ID、多值等），当存在不同级别的“分类”（图的对称性问题）、不同类型的“分类”（图的同质性问题）或不同的“计量单位”（图的统一性问题）时，它会对边进行标记（或者上述情况的任何组合出现在统计对象（SO）中）。我们使用上述非对称性、非同质性和非统一性为“分类属性”。\n\
  \n例如，当类别属性的实例反过来是不同的分类时，SO 的非同质性问题就会出现。\n\n例如，图 12 表格中的类别属性“就业类型”实例为“秘书”、“科学家”和“蓝领工人”。这些每个实例反过来根据不同的标准进行分类。\n\
  \n这些标准可以被认为是类别属性，分别是“工作经验”、“学位”和“类型”，它们的实例属于完全不同的域。\n\nStorm 模型提出的解决方案是在 SO 空间中通过一个*划分图*来表示这种情况，其含义显而易见，形状所示图\
  \ 13。\n\n![FIGURE 13.](img/pg399_Image_256.jpg)\n\n\n\n\n\n类别属性的改变往往随着时间而发生。例如，一个区域或国家的政治结构会随着时间而变化。Storm\
  \ 模型通过以下方式解决这一问题。\n\n例如，如果在时间 `to`，两个状态 `CA` 和 `NE` 分别由 `CA.O = <CA.l, CA.2, CA.3>`\
  \ 和 `NE.O = <NE.l, NE.2>` 识别的领土区域形成；并且在时间 `t[x]` 产生了一个新状态 `NEW_NE`，使得 `CA.O` 变为\
  \ `CA.x = <CA.l, CA.2>`，`NE.O` 变为 `NE.x = <NE.1>`，而新状态定义为 `NEW_NE = <CA.3, NE.2>`，那么类别属性或实例的语义意义的变化（在\
  \ `S` 层级）其解决方式是：通过将来自 `C` 节点的边标记为“TT”（时间），并在 `B` 层级（同时在内涵和外延上）如图 14 所示进行标记。\n\n\
  ![FIGURE 14.](img/pg400_Image_257.jpg)\n\nFIGURE 14.\n\n上述描述的情况可以通过图 15 所示的二部图表示来轻松理解。\n\
  \n![FIGURE 15.](img/pg400_Image_258.jpg)\n\nFIGURE 15.\n\n## 统计表中空值的表示与解释\n\n在统计表中，数据稀缺或空值的出现非常常见。在统计数据库的情况下，没有必要采用空值理论中那种精细的划分\
  \ [32,35]。事实上，统计学家基本上只使用两种类型的空值：未知（或不可用）和不存在（后者通常被称为“结构性零项” [34]）。空值“未知”的一个例子是，当统计表中仅报告了关于美国水果生产的数据时；如果（在这种情况下）缺失了加利福尼亚州在“80,\
  \ 81, 82”年份的数据，那么它们将是“未知”的（推测是调查后未记录，且无论如何都是不可用的）。\n\n相反，“不存在”数据的一个例子可以在统计表中找到，该表插图了按疾病种类和性别细划分的疾病报告数据；在这种情况下，缺失数据涉及\
  \ `sex = female`（女性）的“前列腺癌”或 `sex = male`（男性）的“乳腺癌”（该值将是为 0，但它是一个结构性零，因为它永远不会取到非\
  \ 0 的值）。在图 16 和图 17 中，展示了这些情况的简单案例。需要注意的是，这两种空值之间存在重要区别，特别是相对于相对边缘值（关于类别属性的总和）。特别地在前者（未知）情况下，对于存在未知值的类别属性，其总和并不是属性本身的总和（在图\
  \ 16 中，美国水果的产量总和并不是类别属性“州”的总和，因为统计表中仅列出了美国的部分州）。在后者（不存在）情况下，虽然对于图 17 来说，意大利 1988\
  \ 年前列腺癌病例的总数确实是边缘处（按“性别”汇总）中报告的总和，但通过这种方式，这些病例仅为男性总和而非整个意大利总口的信息就丢失了。\n\n![FIGURE\
  \ 16.](img/pg401_Image_259.jpg)\n\nFIGURE 16.\n\n![FIGURE 17.](img/pg402_Image_260.jpg)\n\
  \nFIGURE 17.\n\n## 操作符、查询语言与用户界面\n\n在大多数统计分析中，数据被组织成表格（平面文件），不仅在计算机中，在分析师的大脑中也是如此。生成的报告也是这种形式。因此，许多统计分析系统仅适应这种组织形式。\n\
  \n操作符必须存在于适用于用户的抽象层次，以避免用户不得不以不自然的方式编写操作符 [35]；此外，其他操作符有助于强制操作的逻辑规则。正如所指出的，数据模型的特征是：一个数据结构和一组能够处理该结构且语义上定义良好的操作符。\n\
  \n事实上，从聚合数据（如统计数据）情况下关系代数操作符的局限性出发，许多作者已经着手解决这个问题。Shoshani 对 SSDBs（大型统计数据库）中有用的传统操作符进行了良好的综述\
  \ [8]。研究人员遵循了两不同的路径：(a) 扩展关系模型（以及基于此的代数）以适应新的现实；(b) 研究并引入一种新模型，即一种新的数据结构和具有其自身处理语义的新操作符，这种模型非常适合这类现实。\n\
  \n从前者的观点来看，已经提出了不同的建议。特别是，Johnson [36] 定义了查询语言 `STRAND`，允许用户制定涉及聚合函数的查询，而无需从聚合的角度来概念化查询。他还引入了摘要集和类别属性的概念，以及在摘要集上的“汇总”和“限制”操作。使用实体关系模型框架允许了一种额外的实体类型，称为摘要集，它仅仅是通过使用聚合函数生成的数据库视图，并捕捉了类别属性的语义。此外，被指定为摘要属性的属性可以关联一个聚合函数（例如求和、平均值）或任何其他函数（定义为程序）。\n\
  \n在 SAM 模型 [22] 中，正如所示，Su 提出了一种数据结构，其中识别了两种类型的属性（类别和摘要），并且关系是上述 G 关系的一个特例。相关的代数从关系代数被重新定义，并以一种方式（通过特定的适用性条件）建立，以避免出现应用操作符导致数据无法表示相关性的的情况，同时当此类操作应用于关系时，它们表现出类似于关系代数的行为。因此，代数操作符根据它们将处理的属性类型被重新定义；这要求在每个操作符的定义中插入适用性条件。这一事实意味着用户使用的难度增加。\n\
  \n\n\n\n\n另一个建议来自 Ozsoyoglu [37]，他同时提出了扩展关系代数（ERA）和关系演算法 [38]（对 Klug 建议 39] 的扩展），以及一种统计\
  \ DBQL [40,(41](#C_020_c18.xhtml#r18_41)]。后一回顾了针对 SQL 提出的建议；特别是讨论了 ABE，这是一种类似于示例查询（query-by-example）的屏幕导向语言\
  \ [42]。在其他地方 [37]，通过两种新算子：关系形成和原始汇总表形成，实现了从关系模型的扁平表示到通过原始汇总表（PST）进行表示的转换，该表述法具有行属性和列属性的“森林”。PST\
  \ 旨在通过提供结构的二维视图，克服关系模型在多维性方面的局限性；事实上，PST 在逻辑层面上按照用户希望在输出中看到的方式用形式化描述的；然而，必须记住，在模型中，两个具有相同类别属性、但某些“行”属性与相同数量的“列”属性相互交换的\
  \ PST 是不同的结构（尽管在逻辑层面上它们具有相同的信息内容）。\n\n通过关系形成，可以从统计表中获得一个“信息等价”关系；在这样的关系上，就可以应用扩展关系代数的所有操作。通过\
  \ PST 形成，可以从满足预定义约束（函数依赖和嵌入连接依赖）的关系产生统计表。此类操作执行的过滤允许在事后删除不一致的数据。\n\n在 Ozsoyoglu\
  \ [38] 中，还引入了三个新算子（打包、解包和模板聚合），并考虑了一个固定数量的关系集合 `<R1,..., R2>`，并在其上从形式和语义上定义了一组操作（包括上述操作，即限制、集合并、集合差等）。\n\
  \nGhosh [43,(44](#C_020_c18.xhtml#r18_44)] 也提出了两种基于统计关系表（SRT）和新查询语言（与示例查询某些相似之处）的新算子。特别是，他重新定义了投影算子，并引入了\
  \ `aggregate` 算子来聚合与 SRT 不同单元相关的宏数据（一种类似于并操作的操作）。\n\n如前所述，所有这些建议都涉及到关系模型的扩展以及一些新算子的引入。\n\
  \n其他作者倾向于遵循另一条路径：即从头定义一个模型和一种新代数。第一个建议由 Chan [25] 提出。在这份报告中，作者提出了 SUBJECT（我们之前讨论过的）。Rafanelli\
  \ 和 Ricci [24] 中提出的建议也基于“聚类”和“交叉乘积”这两个概念；在这里作者提出了 GRASS 模型，并引入了前面提到的简单统计表（SST）概念。Fortunato\
  \ [45] 基于这些概念提出了一种用于统计数据的新代数。\n\n为了图化地表示构成此类代数的元素及其连接方式，我们使用了图 18 中的图表，其中有向边从输入数据结构指向输出数据结构，对应于边本身的算子。\n\
  \n![FIGURE 18.](img/pg404_Image_261.jpg)\n\nFIGURE 18.\n\n代数算子可以有一个或两个表作为输入，或者一对“关系-表”；输出通常为一个表，比较算子除外（输出是一个关系）。\n\
  \n特别是，关于前面的图，我们可以给出“汇总”算子在表上的应用示例。\n\n该操作在输出中提供一个表，其中起始表的类别属性被删除，并重新计算汇总属性的值。让我们考虑水果产量数量表（图\
  \ 19 中的 `Ti`），其特征是“地区”和“年份”作为类别属性；如果我们希望获得 1981–1983 年间的水果产量总量，即一个仅按“地区”划分水果产量的新表，我们应用汇总算子而不是类别算子“年份”。所有（相对于每个地区）关于所有年份的值（因此这些值将从表中消失）将被自动聚合。操作结果所示于图\
  \ 20。\n\n![FIGURE 19.](img/pg405_Image_262.jpg)\n\nFIGURE 19.\n\n![FIGURE 20.](img/pg405_Image_263.jpg)\n\
  \nFIGURE 20.\n\n首先提出了一种基于关系代数的统计查询语言（STAQUEL） [46]，随后是其向用户界面方面的扩展 VISTA（视觉统计查询语言）\
  \ [47]。后者是最近的一个建议，它将基于表 GRASS 表示的 STAQUEL “浸入”多窗口界面中。\n\n用户对要处理的表的图形表示进行操作，通过处理元素、抑制表变量、连接表以及定义分类标准。界面允许对输出进行图形化交互式定义，而计算所需的步骤对用户是透明的。此外，还定义了对话程序，引导用户定义需要多次交互的命令（考虑时间序列）。结果界面是一个多窗口环境，可以在其中控制控制命令的定义和执行，并允许：从简单查询开始制定复杂查询、使用模板定义打印格式以及结果的预览。\n\
  \n一张很好的图总结了五个系统元素之间界面的主要问题：(1) 终端用户 (U)；(2) 数据管理应用 (DM)；(3) 数据分析应用 (DA)；(4) 计算机和用户外设备\
  \ (M)；(5) 存储磁盘、数据库机器等 (S)。这报道于 Cable [48] 并在 21 中重新提出。\n\n![FIGURE 21.](img/pg407_Image_264.jpg)\n\
  \nFIGURE 21.\n\n另一个关于图形界面的建议是 GUIDE [49]，这是一种用于数据库探索的图形用户界面。\n\n文章描述了一种系统，它使用图形设备作为工具与复杂数据（如统计数据）建立接口。该系统为用户提供了一个图形界面。数据库架构以实体和关系类型的网络形式显示。查询可以表示为网络上的遍历路径。\n\
  \n\n\n\n在 `SSDB` 中，在允许快速访问的同时对数据压缩是该领域的主要问题之一。已知有大量的压缩技术，范围从编码到复杂的文本压缩不一；其中某些技术特别适用于\
  \ `SSDBs`，并由多位作者进行了讨论 [28,50,51]。\n\n尽管 `SSDBs` 的特征通常是包含大量的数值数据，但它们通常由大量的文本元数据支持\
  \ [77,76]。因此，可以将不同类型的压缩技术应用于不同类型的信息。\n\n正如 Bassionni 指出的 [57]，“数据压缩在任何系统中的有效性在很大程度上取决于系统中数据的特征。例如，数值字段往往具有大范围的零簇或缺失数据指示。`SSDBs`\
  \ 的这种稀疏性 [28] 是一个重要属性，对实现的整体压缩率有显著影响；许多属性的整数往往分布在很宽范围内，通常向低端偏移。因此，许多值可以使用比分布中最大长度更少的字节（或位）来存储。”\n\
  \n在后者的工作中，正如文献 52 中一样，对最重要的压缩技术进行了分析；特别重要的技术由其他人讨论过 [55–55]。空值的聚集倾向通常发生在单列内（代表单一的汇总属性）。这表明，从压缩的角度来看，转置文件（即按属性存储值，而不是作为记录或元组存储）是有益的。另一种情况会出现在（正如我们已经看到的），当并非所有类别属性的组合都是有效的；即对于无效的组合，所有汇总属性的值均为空。在这种情况下，整个条目在数据库中缺失。这种情况被称为“部分交叉卡积”。\n\
  \n是否有方法可以压缩这些“部分交叉卡积”？针对这个问题（目前尚未完全解决），多位作者给出了回答 [54,56,57]。\n\n## 安全性\n\n统计数据库的安全问题源于希望在不损害个人敏感信息的情况下提供统计信息的愿望\
  \ [28]。\n\n定义安全的另一种方式是：如果一个 `SDB` 被认为是安全的，则无法仅从接受的查询的“故事”（知识）中推断出机密信息。\n\n统计数据库\
  \ (`SDBs`) 的安全性问题从根本上说是限制数据库的使用，使得任何序列的统计查询都不足以直接或间接地推断出某类个人的机密或隐私信息 [58, 59, 60]。\n\
  \n统计数据库安全性是一个困难的问题。事实证明，简单的技术（例如限制聚合查询中符合条件的人数高于所选阈值）是行不通的。因此，提出了许多其他技术。它们包括跟踪之前的查询、将数据集预划分为聚合查询无法跨越边界的单元格（这种方法在人口普查数据中最流行）、通过数据上的样本估计聚合值，以及扰动输入或输出值\
  \ [8,29]。\n\n现在让我们定义统计数据库的“可攻破性”。如果用户通过直接或间接方法，成功违反了相对于 `SDB` 中存在的信息（聚合和/或非聚合）的个人值隐私，则称该\
  \ `SDB` 是被攻破的 [61,62,63]。这种攻破可以分为两种：正面的，如果用户成功获知了特定数据的值；负面的，如果用户成功获知某个数据不具有特定值。\n\
  \n显然，如果一个 `SDB` 既不能被正向也不能被负向攻破，它就是安全的。文献 61 提供了关于数据库“可攻破性”的良好数学论述。\n\n我们将安全性分为两种类型：内部和外部。外部控制涉及发生在管理系统之外的操作，例如个人筛选、对计算机的限制访问。内部控制通过将\
  \ SDB 分为四个区域来规范 SDB 的操作：对存储对象的访问；从一个存储对象到另一个存储对象的信息流；文件中存储的机密值的推断；通过通信线存储的机密数据的加密代码。\n\
  \n在图 22 中，关于访问，可以允许 Smith 先生读取文件 `X` 并在文件 `Y` 上写入。在图 23 中，由于拒绝了他对文件 `Y` 的访问，Brown\
  \ 先生与 Smith 先生合作制作了副本；流控制可以防止这种情况。在图 24 中，检查员利用先前的知识从统计摘要中推断机密信息；推断控制可以防止这种情况。在图\
  \ 25 中，Smith 先生非法获取了文件 `X` 的副本，但其加密代码确保内容对他没有意义。\n\n访问控制的效率基于三个假设。第一个是用户的正确识别；基于密码的识别简单且广泛使用，但需要准确的保护来防止代码识别\
  \ [64,65]。基于个人特征（声音甚至签名识别）的识别方案显然更安全但成本更高。第二个假设是拒绝未曾过的用户的访问。定期保护使用加密代码。第三个假设是特权信息被严格保护。任何用户程序都无法在受严格保护的区域进行写入。\n\
  \n推断控制可能是问题中最复杂的部分，因此吸引了研究人员最多的关注。\n\n我们可以将 `Pc` 定义为定义在 `Ci` 类个人上的抽象对象 `0`（在个人数据库的数据关系\
  \ `R` 内部）的机密命题，使得属性子列表 `A[I]` 的值满足特定关系 `R[I]`；因此这些命题是用户 `U` 不应该掌握的；`D(0)` 是关于 `0`\
  \ 的查询集；`Du` 是用户关于 `0` 的允许查询集。\n\n“特征属性”是指值可以出现在“特征公式”中的属性 [66]。\n\n\n\n\n一个查询被称为“准入的”（即在\
  \ `P[c] (0)` 中 `d ∈ D(0)`），如果它没有违反数据库管理员（DBA）所定义为“机密”的信息：\n\n`d*/→*P*[*c*] (0).`\n\
  \n我们将机密信息的“逻辑推理过程”称为以下查询的连贯序列：\n\n`(d1, . . . . , ds )`\n\n其中满足 `(d[i] ∈ D ∪ (0)\
  \ ∀ i)`，这允许违反属于集合 `P[c] (0)` 的任何命题 `P[j]` 的机密性。\n\nBeck [67] 提出的可以用于破坏安全数据库（SDB）隐私的推理型通用数学模型。实际上，“接受查询问题”提述了一个非常困难的解决问题，因为它不应该仅基于对被接受的查询所产生的知识的分析。如果用户了解刻画记录的某些属性，那么如果他同时也知道其他假设性记录是否存在，他就可以获得其他属性。简而言之，我们只列出逻辑推理的几种控制方法；更详细的信息可以在参考文献中的报告中找到。\n\
  \n这些方法可以分为两种基本类型：(1) 作用于查询准入性的方法（限制）；(2) 作用于记忆值或作用于作为查询回答提供的值的方法（扰动）[59,66,67]]；第一类方法包含了所有用于防止或控制查询是否会危及\
  \ SDB 的技术；第二类方法包括不对比查询准入性设置限制，但提供具有相当良好统计可靠性的修改后的值作为回答的技术。\n\n在涉及查询控制的方法中，我们可以引用以下：\n\
  \n1. 表限制技术 [59]\n2. 顺序控制 [68]\n3. 表大小控制 (Sm/N 则) [69]\n4. 显式风险估计 [68]\n5. 数据交换的存在性（决定变换性）\
  \ [70]\n6. 单元限制技术\n7. 查询集大小控制 [71, 72, 73]\n8. 隐式查询控制 [74]\n9. 查询重叠控制 [75,76]\n\
  10. 审计\n\n第二类演绎基于回答的失真；其中某些被称为“保护与输出方法”，例如：\n\n1. 单元抑制\n2. 分组（或汇总） [59]\n3. 分区 [77]\n\
  4. 扰动技术 [78]（此处原文为 77，根据上下文应为 78）\n\n其他被称为“基于记录的推理”，例如：\n\n1. 随机抽样 [68,72,80]],79]\n\
  2. 样本扰动 [60],71]\n3. 属性聚合 [59],66]\n4. 数值替换 [74]\n5. 噪声添加 [75],76]\n6. 差异隐私 [77]\n\
