  \ (19) 中“there”和“they”的指代对象，以及那里所指代的问题列表的开头，需要相关的知识。请注意，在通常情况下，无法在不理解含义的情况下翻译 (19)，即简单地在目标语言（TL）中使用对应的代词来实现。这是因为在某些语言中，必须显式地做出额外的选择。例如，将\
  \ (19) 翻译成希伯来语，必须在“they”的阳性和阴性形式之间做出选择。为了做到这一点，必须确定代词的指代对象。指代现象不仅包括代词，还包括定语名词短语。为了翻译\
  \ (20) *[10, p. 56]*，必须理解文中所有斜体名词短语都指代同一个概念标记。事实上，将这段话直接译成（例如）俄语）将是困难的。人类翻译人员不会使用\
  \ `ispanec`（俄语中的“西班牙人”）来翻译最后一句中的名词短语。如果对文中的共指关系没有完全理解，同样无法将不定名词短语 `a man` 直接译成俄语。\n\
  \n> (19) 他们在那里发现了许多额外的问题。\n\n> (20) 牧师被指控攻击教皇。\n\n> (里斯本，5 月 14 日) 一名*异见人士西班牙牧师*今日在此被指控企图杀死教皇。*32\
  \ 岁的胡安·费尔南德·克罗恩*被捕，此前一名*手持刺刀的男子*在周三晚上于法蒂玛祈祷时接近教皇。据警方介绍，*费尔南德*今天告诉调查法官，*他*在过去的六个月里为了这次袭击进行了训练。据称*他*声称在听到该*牧师*对其处理教会事务的批评后，教皇“看起来非常愤怒”。如果被判定有罪，该*西班牙人*将面临\
  \ 15 至 20 年的监禁。\n\n> 《泰时报》，1982 年 5 月 15 日。\n\n只有当对输入文本含义的理解达到大约时，其法律解读的数量才能与人类翻译人员所能识别的相比。然而，该领域的技术水平是，目前没有任何实际或甚至是实验性的机器翻译（MT）系统能够检测到所有甚至大部分语义、上下文和修辞意义的方面。然而，潜在地，可以为机器翻译系统添加更多复杂的层次。例如，在机器翻译系统运行的生成阶段，风格考量往往至关重要。对这些因素的研究（可以称为计算风格学）尚未成为机器翻译研究界关注的焦点。自然语言生成本身在对话、问答系统（通常是为了在数据库系统的自然语言前端生成计算机响应）的背景下已得到广泛研究。关于强大的机器翻译生成器的工作才刚刚开始不久。\n\
  \n另一个可能的研究方向（仍然是一个未知的领域）是将人类翻译的技艺作为一项专家任务进行研究。翻译人员是专家。在这个专家系统的时代，不太可能不从这个角度来研究翻译过程。当然，这产生了一些困难。其中一个重要问题是，翻译人员的专业知识是否超越了对两种语言的知识以及对翻译主题的知识。如果答案，那么专家系统方法可能会变得很有趣，因为这将提取这种额外知识并学习在计算机系统中使用它的方法。自然，高效提取这些知识可能是不可能的。然而，似乎这种知识确实存在：我们直觉地认为经验丰富的翻译人员知道比新手如何更好地进行翻译。这可能与他们更好地表达对源语言（SL）文本理解的能力有关。事实上，翻译机构认为，对于（人类）翻译人员来说，熟悉目标语言（TL）比熟悉源语言更重要。\n\
  \n## 选择\n\n对文本的分析层深度要求越高，借助计算机实现它就越困难，因此，鉴于该领域的技术水平，目前构建一个能从这种深度分析中受益的机器翻译系统可行性较低。事实上，即使是具有足够通用性的解析器和语法也无法在不经过重大修改的情况下直接拿来使用。语义分析器非常稀缺，且顶多只能为翻译所需的概念世界提供部分覆盖。能够分析话语修辞内容或其话语结构的模块则更加遥不可及。目前，在自然语言语义和语用分析问题上正在进行大量的研究。但这些研究主要是理论性的。\n\
  \n是否存在一种通过简化或避免完全分析，而在机器翻译中取得切实结果的方法？答案是带有条件的肯定的。规避完全自动消歧问题有两条主要途径。首先，可以限制输入文本的语法和词汇，从而消除大部分歧义。这是机器翻译中的子语言或子世界方法。其次，可以放弃对完全自动化的要求，允许人类参与翻译过程。正如我们等将看到的，这种机器辅助翻译的过程有许多组织方式。这些方法之间的区别不仅在于在翻译过程中交替使用自动化和人工步骤的策略上，而且在于于人类负责的子任务的性质上。\n\
  \n那些考虑构建机器翻译系统的人，在决定何种自动化程度最适合他们之前，必须权衡其项目在质量、允许开发的时间和覆盖范围方面的特殊要求。一个简化的经验法则是：允许研发的时间越少，分析模块就越浅，因此，人类在翻译过程中的参与程度就越深。\n\
  \n### 限制源语言文本的歧义\n\n子语言方法的最佳案例是 `TAUM-Meteo` 机器翻译系统，它由蒙特利大学开发，交付加拿大气象局用于将天气预报翻译成法语。该系统运行非常成功，几乎不需要人工干预。它的词汇由约\
  \ 1500 个项目组成，其中一半是地名。`TAUM-Meteo` 作为源语言使用的英语变体中，句法结构构成了英语句法结构的一个较小子集。系统中的语义歧义很少，因为它总是预期歧义词出现在其属于天气现象子世界的含义的语文中（例如，`TAUM-Meteo`\
  \ 中的 `front` 一词将被明确理解为天气锋）。寻找边界清晰、自给自足且实用的子语言是一项艰巨的任务，这也是 `TAUM-Meteo` 的成功没有被其他任何其他系统复制的原因之一。\n\
  \n### 翻译的部分自动化\n\n\n\n\n对`MT`（机器翻译）的需求很高且不断增长，大部分集中在某些学科领域，这些领域对应的子语言比天气预报的语言丰富得多，因此其可行性也较低（正如蒙特利尔小组在尝试将其系统扩展到飞机维护手册学科领域时，由于成功有限而很快学到的这一点）。为了应对今天对翻译自动化的需求，人们必须思考利用该领域已有的知识和技术的方法，为翻译过程提供某种程度的自动化。事实上，几乎所有的操作和实验性\
  \ `MT` 系统都包含某种程度的人类参与，可以说，在不久的将来，可以预计这种参与将会减少，但不会完全消失。\n\n具有部分自动化的 `MT` 系统有两个主要的分类维度。它们可以根据以下分类：\n\
  \n1. 人类而非计算机完成的工作实际份额（自动化程度）\n2. 人类参与的策略：人类是在计算机处理文本`之前`、`期间`还是`之后`进行工作的（当然，也有结合这三种策略中的部分或全部的可能性）\n\
  \n根据涉及的自动化程度，`MT` 系统从供人类译员使用的相对简单的交互式编辑和字典查词工具（此类系统支持的活动被称为机器辅助人工翻译，`MAHT`），到相当复杂的系统（其中大多数仍处于实验阶段），这些系统涉及语法有时甚至是语义分析，并提供更高水平的翻译过程自动化（这些系统执行的是人工辅助机器翻译，`HAMT`）。实现全自动且高质量的翻译仍然是一个遥远的目标，但对于某些项目来说，这是一个持续追求之的目标。\n\
  \n`MAHT` 方法的哲学由杨鲁布明大学的阿兰·梅尔比（Alan Melby）解释得最详尽。他在开发所谓的“翻译员工作站”时，承认了三个人机交互水平。一级工作站是最简单的，它本质上假设了一个完整且方便的文字处理环境，并具有访问在线字典和百科全书的便利手段。二级工作站增加了拼写检查、语料库和文本字典，并假设待翻译文本是机器可读的格式。三级工作站涉及某种程度的自动处理，可能包括一些分析。Melby\
  \ 没有具体说明这一级可以使用哪些具体手段，但显然，这种工作站处于 `MAHT` 和 `HAMT` 之间。\n\n关于人类参与的策略，三种基本可能性已被称为前编辑（prediting）、译后编辑（postediting）和交互式编辑（interactive\
  \ editing）。人类前编辑阅读输入文本并对其进行修改，使得 `MT` 系统能够自动处理。将困难且过度歧义的单词和短语替换为编辑知道程序能够处理的词汇。人类译后编辑获取\
  \ `MT` 系统的输出，并消除其中所有的不准确和错误。交互式编辑则与 `MT` 系统进行对话，由人类解决机器无法自行解决的歧义。当然，有必要建立一个特殊的界面来维持对话。提问的类型也可以不同：计算机可能会要求人类为歧义的\
  \ `SL`（源语言）单元提供 `TL`（目标语言）对应词，或者要求提供 `SL` 单元的含义，且该含义使用系统中表示含义的语言。\n\n随着过去十年复杂的交互式编程环境的发展，交互式编辑已成为一种可行的方案。以消除歧义为导的对话可以包含以下交互：\n\
  \n```\nThe word ‘pen’ means:\n* 1) 钢写笔\n* 2) 婴儿围栏\n* NUMBER»\n```\n\n为了解决指代歧义，系统可以以以下方式提问：单词\
  \ ‘she’ 指的是\n\n* 1) ‘Cathy’\n* 2) ‘我的母亲’\n* 3) ‘帆船’\n* NUMBER»\n\n交互式词义消歧确实可以相对容易地完成。然而，指代歧义将成为一个问题，因为程序必须能够找到候选指代（代词和其他指代），这本身就是一项非凡的任务。用于执行语法消歧的交互组件的设计可能很困难，且该组件本身并没有成本效益，因为对人类来说，比较语法结构树并不是日常任务。然而，语义分析具有更强的消歧能力，因此在依赖人工干预来选择合适词义的交互式编辑系统中，语法消歧可以变得没有必要。\n\
  \n直到最近，`MT` 过程中的人工干预主要采取译后编辑的形式，即将 `MT` 系统的产品提交给人类编辑员进行编辑，就像在更好的翻译机构处理人工译文一样。（在提交给\
  \ `MT` 程序之前对 `SL` 文本进行前编辑也得到了讨论和应用。）这种方法的一个重要特征是译后编辑员不需要了解 `SL`。但在实践中，此类系统的许多输出非常杂乱，以至于在不查阅\
  \ `SL` 文本的情况下对其进行编辑变成了一个大问题。\n\n在采用译后编辑的 `HAMT` 策略的系统（大多数目前的实验系统属于这一类）中，可行性和成本效益成为成功的主要标准。译后编辑方法基于这样一个前提：`MT`\
  \ 可以在计算机完全理解 `SL` 文本的情况下执行（并且应该执行）。这种信念在可行性方面是合理的。这种方法意味着 `MT` 系统本质上是人类控制翻译的辅助手段。\n\
  \n消歧过程的质量和深度（由 `MT` 系统中使用的底层语言和世界概念模型的质量决定）是判断 `MT` 系统的另一种标准。如果接受这样观点，即人类参与的本质不应该是修正系统生成的（错误的）文本，而是为系统提供知识库中未记录的额外消歧知识，就可以根据这一标准来判断\
  \ `MT` 系统。这种方法的方法论基础是交互式编辑，其对话旨在获取消歧知识，而不是基于这些知识将获得的 `TL` 对应词。这种方法与向全自动翻译逐步发展的策略兼容，因此其成功取决于基础研究的重大进展；而前者则更具工程性，其目标是在当前可行的范围内实现部分自动化。然而，译后编辑方法已经产生了被许多用途认为是足够的结果，而基于深度理解的大型系统尚未投入运行。\n\
