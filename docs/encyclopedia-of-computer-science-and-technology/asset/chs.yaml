  \ VA, 1988.\n\n**STEPHEN J. ANDRIOLE**\n\n# 智能控制\n\nDOI: [10.1201/9780367811495-5](https://doi.org/10.1201/9780367811495-5)\n\
  \n## 计算机控制系统：新范式的出现\n\n### 控制理论发展的新趋势\n\n一个新的系统工程领域已经出现，它可以被认为是人工智能、运筹学和控制理论的交叉点，并受到计算机科学进步的积极推动和刺激（见图\
  \ 1）。\n\n![图 1. 智能控制作为其科学范式的一部分。](img/pg80_Image_116.jpg)\n\n图 1. 智能控制作为其科学范式的一部分。\n\
  \n早期的控制理论旨在实现机器的“调控”和稳定运行，并为带有反馈的动力系统提供稳定且准确的运行，最终为任何预设的*控制对象*提供所需的功能，包括各种环境中的机器、人机系统，甚至是人类团队、经济系统等。在后一种表现中，控制理论被理解为更广泛的概念实体的工具，例如*系统一般理论、控制论*等。\n\
  \n\n\n\n控制理论证明比这些通用的概念实体更具可行性，主要因为控制理论领域的专家群体始终将自己与一套成熟的微积分数学体系（后来通过线性代数方法和其他数学领域的方法得到增强）联系在一起，并与理解这套数学体系（和/或相信它）的明确客户联系在一起。然而，对控制理论的结果和取向一直存在着明确的不满。\n\
  \n传统控制使用一系列设备处理各种问题，这些设备从早期蒸汽机中的速度调节器开始，到稳定目标导向的宇天器群结束。然而，以下问题被公认为在传统控制理论范式下难以解决的：\n\
  \n*   非线性系统的最优控制\n*   随机系统的最优控制\n*   6 自由度（6DOF）多关节机械器的控制\n*   冗余系统的控制\n*   自主机器人的控制\n\
  *   多传感器反馈信息系统的控制\n*   模型和/或环境初始知识不完整的系统的在线控制\n*   人类监督下的系统控制等\n\n计算机的广泛应用，特别是配备了各种变感传感器的工业计算机系统，带来了一个以不同、非传统方式审视所有这些系统的机会。上述列出的所有系统都需要一个环路，其中包含能够处理许多复杂问题的智能手段：`perception`用于组织来自多个传感器的多样化信息集；`knowledge\
  \ base`用于使系统不仅能够解释感知结果，还能将其置于确定未来操作策略和策略所需的视角中，并为规划/控制过程提交所有必要信息；`planner/controller`用于生成适当的控制序列等（参见图\
  \ 2）。\n\n![FIGURE 2. 典型智能控制器的闭环。](img/pg81_Image_117.jpg)\n\nFIGURE 2 典型智能控制器的闭环。\n\
  \n各个应用领域的大多数用户已开始使用计算机系统，并习惯通过“编写他们需要的程序”来解决问题。事实上，计算机为用户提供了一个期待已的机会，从基于模型的设备切换到浏览内存并搜索预计算指令的设备类。另一方面，人机界面广泛基于自然语言的使用、语言模型以及与广泛接口易兼容的算法。改变范式的时代已经到来。\n\
  \n长期以来，控制领域的专家们普遍认为，需要明确两个重要实体之间的区别：第一个是所谓的`控制理论`（传统的），或`自动控制理论`；第二个是始终存在周围且与传统控制理论截然不同的难以捉摸的实体。这另一个实体倾向于利用非传统方法，将其从微积分领域扩展到许多其他领域，从自动机理论开始，到语言学、模糊集、神经网络等。\n\
  \n### 传统控制\n\n传统控制理论的范式从感兴趣的对象的特定行为方面来看待对象，该方面可以用微积分体系、微分方程理论、线性代数和向量分析工具来表示。这是根据传统控制理论制定问题的方法（例如\
  \ R. Kalman, 1969）。它从系统的定义开始。\n\n*定义*。系统 `Σ`，`Δ ⊃ Σ` 是一个数学结构 `(T, X, U, Ω, Υ, Γ,\
  \ φ, η)`，由以下公定义：\n\n1.  **存在性**。存在给定的时间集 `T`、状态集 `X`、输入值集 `U`、非空的可接受输入函数集（或命令序列，或控制）\n\
  \    *   `Ω = {ω:T→U}`\n    *   一组输出值 `Y`，以及一组输出函数\n    *   `Γ = {γ:T→Y}`\n2.  **时间方向**。`T`\
  \ 是实数的一个有序子集。\n3.  **组织**。存在一个状态转移函数（或运动轨迹，或解曲线）\n    *   `φ: T × T × X × Ω → X`\n\
  \    其值是在输入 `ωΩΩ` 的作用下，从初始时间 `τΩT` 的初始状态（或事件）`x = x(τ)` 在时间 `tΩT` 产生的状态 `tΩT`。该函数具有以下属性：\n\
  \    1.  **时间方向**。函数 `φ` 定义于所有 `t ≥ τ`（而不是对于所有 `t < τ`）。\n    2.  **一致性**。对于所有 `τ∈T`，所有\
  \ `x∈X` 和所有 `ω∈Ω`，函数 `(φ(t;τ,x,ω) = x`。\n    3.  **嵌套连接，或复合**。对于任何 `t[1] < t[2]\
  \ < t[3]`，满足以下条件：\n        *   `φ(t3; t1, x, ω) = φ(t3; t2, φ(t2; t1,x,ω), ω)`\n\
  \        对于所有 `x∈X` 和对于所有 `∈Ω`。\n    4.  **因果律**。如果 `ω[1], ω[2]∈Ω` 且 `ω[1] = ω[2]`，则\
  \ `(φ(t;τ,x,ω[1]) = (φ(t;τ,x,ω[2]))`。\n4.  **传递函数映射**。存在一个映射 `η :T × X → Y`，定义输出\
  \ `y(t) = η(t)`。\n\n\n\n\n\n$\\begin{matrix} \\frac{dx}{dt} & {= F\\left( t \\right)~x~\
  \ + ~G\\left( t \\right)~u\\left( t \\right),} \\\\\\\\ y & {= H\\left( t \\right)~~x\\\
  left( t \\right),} \\\\\\\\ \\end{matrix}$\n\n其中 `F(t)` 和 `G(t)` 是表达式 `f(t,x,u(t))\
  \ = F(t)x + G(t) u(t)` 的部分，`H(t)` 是一个映射 `T → {p × n matrices}`，它来源于方程：\n\n`y(t) = η(t,x(t)) = H(t)x(t),`\n\
  \n`T = R¹`，`X` 和 `U` 是范数空间，`F(t)` 是映射 `F:T → {n × n matrices}`，`G(t)` 是映射 `G:T →\
  \ {n × m matrices}`，`n` 是状态 `x∈ R^n` 的维度，`m` 是控制 `u∈ R^m` 的维度，`p` 是输出 `y ∈R^p` 的维度。针对各种情况（如离散系统、变参数系统等），正在进行适当的调整和修改。\n\
  \n传统控制中的控制律定义为映射 `k:T × X → U`，它在每个时刻建立 `x(t)` 和 `u(t)` 的对应关系。因此，在这种公式中，我们并没有定义控制律如何对应任何控制需求。标准的控制问题定义如下：对于初始事件集\
  \ `(to,xo)` 中的每一个事件，都应该确定一个控制 `u(*)`，将该初始事件转换为目标集，并同时最小化代价泛函（P. Falb, 1969）。\n\n\
  控制问题的另一种定义明确引用了`传统控制理论`（J. J. D’Azzo, C. H. Houpis, 1981）。建议将控制问题分为以下步骤：(1) 建立性能指标集；(2)\
  \ 写下性能规范；(3) 以一组微分方程的形式建立系统模型；(4) `使用传统控制理论` 寻找原始系统的性能，如果不符合要求列表，则必须添加`级联或反馈补偿`来改进响应；(5)\
  \ 使用现代控制理论，分配整个特征结构，或设计必要的结构，以最小化指定的性能指数（这被理解为二次性能指数）。通常，人们可以很容易发现，现有关于`控制问题`的观点存在令人惊讶的缺乏统一性。\n\
  \n以下控制律的定义可以认为与控制的实践一致[*1*]：`对过程的控制意味着驱动该过程以有效实现预设的`目标。可以发现，目标的概念被包含在这一定义中。\n\n\
  ## 对传统控制理论的不满\n\n我们可以看到，后一种定义对系统或其模型字字未提。这真令人惊叹！事实上，系统本身超出了我们感兴趣的范围。传统控制领域提供了一个系统模型，然后提出了在`所选模型边界内处理这一形式化整体`的方法。`用户更感兴趣的是`控制理论，这种理论与系统模型是无关的。我们（以及用户）感兴趣的是一个`正在被考虑的过程`，以及一个`我们必须驱动该过程走向的目标`。\n\
  \n鉴于上述解决控制问题的经典方法示例，可以关注以下具有传统控制理论特征的问题：\n\n1. 模型被认为是解决问题的理论的源泉，而不是相反。（让我们选取现有的数学理论，看看哪些相似的控制问题——这是控制理论的业务。）结果是，你可以拿起一本控制理论书，却无法将其与一本微分方程理论书、线性代数书或线性算子理论书区分开来。\n\
  2. 控制问题的制定和解决并不是根据用户的需求程度来进行，而是根据现有分析和计算工具的内在能力来进行。（（这就是我能做的，我真的不在乎这种装置是否能解决你的真实问题。）控制领域的研究人员不想处理所谓的`病态问题`（ill-posed\
  \ problems）。由于幸运的是，病态问题理论似乎为线性算子领域的某类问题带来了标准化。此后，“病态问题”被理解为线性算子理论中的一个科学术语。同时，所有真实的控制问题实际上都是病态问题，无论为它们的解决方案提供了什么样的数学模型。\n\
  3. 控制问题的表述被认为是“控制人员”的特权，而不是“用户”与“控制人员”之间对话的结果。（当他既不能用环也不能用理想来辨别自己的电子化油器时，我该如何和他交流呢？）因此，技术要求及其协商不被认为是解决控制问题的一部分。处理“自然”的代价函数被认为在控制理论之外。最终，现有代价函数的现实情况通常是不经协商的，控制系统的设计者往往生活在最小化可疑（尽管是求解的）二次形式的想象世界中。最优控制器传统上被认为是最小化平均二次误差的程度。时间最小化被认为是一个没有吸引力的问题。通常，优化问题是被规避的\n\
  4. 规划不被认为是控制问题的一部分，而是被留给了 AI 人员（或用户）（他们应该规划，我根据计划跟踪运动。）关于规划的引用主要出现在动态规划的文章中，这使得动态规划与相应的\
  \ AI 方法（如搜索等）联系得更加紧密。控制的其他领域倾向于让外部人员提前规划（最好是离线）。规划的结果被认为是控制表述的一部分。同时，规划与控制之间的内在联系在所有控制问题中被感知。\n\
  \n    规划本身被认为是 AI 固有课题；它似乎更倾向于语言，并处理了从传统控制理论范式中遗漏的主题。操作目标的制定似乎是一个吸引 AI 专家的话题。代价函数是运筹学（OR）理论中的关注点。启发式搜索算法是由\
  \ AI 或 OR 专家开发的。\n\n    处理信息的问题超出了现有控制理论的范围。（一切都应该以参数、变量或控制的形式交给我——无论你如何做！）当 K-S.\
  \ Fu 开始公开讨论带有环路识别的控制系统时，发生了重大创新。识别过程极大地影响控制过程，因为控制器的词可能取决于识别结果。通常，计算机为处理信息的控制专家开启了更宽阔的视野。\n\
  \n\n\n\n\n6.  自适应与学习系统、神经网络以及其他模拟脑过程、模糊控制器、语言控制器、控制中的分形维度等。（在我那个时代，“模糊系统”意味着失败！）这个列表从被接受为控制理论一部分的项开始，向着更加深奥的领域延伸，这些领域是现代计算机控制器所需要的，由于这种需求而产生，且不能被视为严格意义上的控制理论合法工具。其中一些主题是在控制学科之外被处理的。例如，如果系统内部存在对概率特征了解不足的概率过程，那么受控运动的动力学、此类运动的稳定性条件以及此类运动的平均二次误差的最小化就无法通过控制理论方法合法地完成。因此，人们在不合法的情况下使用了这些方法。通常情况下，他们更倾向于应用一系列新的（“实用的”）技术，其跨度从程序员引入的“江湖术”式方法，到一些非常明亮、有趣且值得认真考虑的想法。\n\
  \n## 智能控制；控制理论、人工智能或计算机科学方法论的融合\n\n## 从处理孤立问题到处理作为环境一部分问题的转变\n\n传统的控制理论侧重于控制系统（CS），该系统旨在为设备（PL）提供满足某些要求的操作（图\
  \ 3）。CS 被认为独立于 PL 存在，且控制流 U 被认为是由 CS 生成的，可以被解释为某种“前馈”控制（FW）。外部“反馈”（EFB）被设计为参与 CS\
  \ 创造过程的控制工程师努力的最终结果。最初的情况确实如此。然而，很快人们理解，设备反过来会以一种内部反馈（IFB）的形式影响控制系统。在控制设计过程中，不断阐明设备的必要性，导致了一个结论：PL\
  \ 应该被表示为 CS 的一部分，而“设计控制器”意味着“设计反馈”。无疑，外围系统（EXO）影响着两者。因此，控制工程师不再集中于 (I)，而是继续对整个组合\
  \ (II) 进行分析和设计。\n\n![图 3。控制理论的焦点。](img/pg85_Image_122.jpg)\n\n图 3. 控制理论的焦点。\n\n\
  在这里发现，计算机科学的方法论倾向于改变选择模型表示形式化工具的偏好。系统通常被分解为设备和一个控制器。通过这种分解获得的 `DI` 模型（即基于微分和积分微法前提和装置的模型）的便利性，是以巨大地丧失“非结构化”信息为代价的。在\
  \ AI 方法论中，即使是数学上的非结构化信息也可以保留在逻辑或语言（或类似）表示系统中。然而，积分/微分模型的优雅性和强大性很难在 AI 框架内直接得到利用。\n\
  \n微分和积分微法装置（`DIC`）是一种强大的工具，它实际上已经预设了表示系统。尽管任何问题最初都是用技术应用语言（LTA）表述的，但由于 `DIC` 语言的限制，大部分\
  \ LTA 知识（最初与用户协商的）在解决问题的过程中无法被利用，因为 `DIC` 语言的多样性总是少于 `LTA` 语言。因此，形成了一种传统：对未来 CS\
  \ 的任何技术要求以及对 PL 现实的描述，都将先从“工程师语言”或 `LTA 表示` 翻译成 `DIC 表示` 的术语。在 `DIC` 表示内解决问题后，应当将解决方案翻译回现实世界的语言。这种将情况从一种语言翻译成另一种语言的连续翻译过程如图\
  \ 4（C_007_c5.xhtml#f5_4）所示。\n\n![图 4.基于两种表示法的设计。](img/pg87_Image_123.jpg)\n\n图 4.\
  \ 基于两种表示法的设计。\n\n无疑，包含以下内容：`TR[LTA]TR[DIC]`，这决定了输出情况 `CSS[LTA]CSS[DIC]`。显然，必须遵守\
  \ `DIC` 技术只能解决有限问题的现实。因此，控制理论采取了习惯：只尝试在 `DIC` 语言领域解决问题。几十年的这种情况导致了在 `DIC` 表示内获得的各种解决方案呈指数级增长。然而，假设为\
  \ `LTA 表示` 的实际解决方案数量并没有那么理想。所有的 LTA 活动都是由用户完成的。而这些用户现在证明是程序员。这对计算机和控制专家都产生了重大影响。结果是出现了各种技术，要求基于\
  \ `LTA 表示` 构建的控制系统不能被将技术要求从 `LTA 表示` 映射到 `DIC 表示` 的过程所简化。这些技术包含了各种计算机系统：智能机器和机器人、柔性集成制造系统、包括自主移动系统的自主设备，如\
  \ C³I 等智能控制和通信系统（这些 SDI 和类似系统）。所有系统还配备了大量的传感器（包括视觉），并在无人参与的情况下运行。将一切翻译成 `DIC` 范式的难题似乎是巨大的。实践上有有必要使用任何可用工具：在这种情况下，是\
  \ `LTA 表示`。LTA 技术由强大的工程工具——计算机的支持，计算机正被视为比计算系统更广泛的背景（图 5）。以机器人这一有限子集为例，人们很容易理解 `DIC`\
  \ 表示无法满意解决该领域的问题。计算机并不适用于 `DIC` 表示。事实上，完整的线性确定性微分方程系统是复杂的；即使对于一个简化的原型机器人，所有参数也无法准确已知，非线性和耦合被忽略了，误差在求解过程中会被放大，等等。\n\
  \n![图 5。新技术范式。](img/pg88_Image_124.jpg)\n\n图 5. 新技术范式。\n\n### 被控系统的复杂性与计算机控制器的复杂度\n\
  \n\n\n\n植物系统 `PL` 在 `CS` 的帮助下，通过一组（通常是）执行器 `A` 进行驱动，前提是 `PL` 和 `A` 参数存在不确定性（这些参数仅部分已知）。由于每个执行器都可以与系统的“子系统”或“组件”相关联，预计需要对整个系统进行分层或类似的分解（图\
  \ 6）。在分解完成后，低层包含了过多的信息单元，无法用于高层的设计。谈论“参数”假定了某些模型的存在（通常是 `DIC` 表示法中的数学模型），但事实可能并非如此。从\
  \ `LTA` 表示法中阐明的 `PL` 知识通常以这种方式呈现，导致在 `DIC` 表示法中生成的 `PL` 模型变得非常简陋，或者至少过于简单。自适应控制器似乎提供了一个很好的解决方案，但它们也试图将系统的丰富性限制在主非自适应控制器的\
  \ `DIC` 结构中。因此，高级用户转向了 `AI` 模型，因为生产系统不需要任何模型简化。\n\n![FIGURE 6. 系统的分层分解。](img/pg89_Image_125.jpg)\n\
  \nFIGURE 6. 系统的分层分解。\n\n剩余的知识（如果不想丢失的话）可以通过可用的 `AI` 方法（语言表示法、生产系统等）来处理。不确定性无法使用现有的概率模型进行判断，因为不存在构建此类模型的信息。在植物运行期间应该获得关于\
  \ `PL` 参数的新信息，因此，发现新的植物模型是控制过程的预期部分。应该考虑到预期运行模式的多样性，并必须考虑所有可能条件下的运行过程。即使对于一个简单的多关节机械臂，也无法容易回答：什么是运行的“最佳”情况，什么是“最差”情况，以及是否存在任何可以接受为“设计”情况的假设性“平均”情况。`EXO`\
  \ 正在成为 `PL` 的一部分。另一方面，由于它有许多执行器，这一点通过多个控制器显而易见。这种多执行性（multiactuation）正成为智能控制理论问题中的一个重要问题。\n\
  \n### 外系统与多执行性作为整体问题的一部分\n\n关于 `EXO` 的信息通常在实施早期是不可用的。这些信息应该在 `EXO` 的现实内部被识别，然后以适当的方式处理。这些信息包含了不同重要程度（分辨率？）的事实，应该以不同的方式进行处理。因此，产生了一种想法，根据我们对细节的兴趣，在不同的分辨率下研究\
  \ `EXO` 的现实。通过在不同分辨率下考虑 `EXO` 的不同部分，可以找到整体的一致性。\n\n建立一致性的简单方法是将 `EXO` 视为部分分解的分层结构，或者分辨率层次结构（这一概念与\
  \ `AI` 中的框架 `frame` 概念一致）。感知子系统就是这样将 `EXO` 传递给控制器的。`EXO` 的层次结构与 `PL` 的层次结构非常相似：关于世界的大部分信息（知识？）或“世界描述”应该被分解（镶嵌）为层次的分辨率部分集（图\
  \ 7）。\n\n![FIGURE 7. 多传感器系统与内部表示。](img/pg90_Image_126.jpg)\n\nFIGURE 7. 多传感器系统与内部表示。\n\
  \n（注：由于原始文本中存在大量重复的段落，根据指令“不要重复输出原文”，此处已仅翻译核心内容。）\n\n\n\n综合考虑所有因素，智能控制器的概念是以下部分的结合：(a)\
  \ 使用混合 DIC/LTA 表示对系统进行建模的方法论；(b) 不精确且不完整对象的分层模型；(c) 由多个传感器提供的关于外部系统的分层且不完整的知识，这些知识在学习过程中不断被重组；(d)\
  \ 作为计算机控制系统以及控制过程一部分的任务协商（参见图 10）。针对这种特定的考量范式，已经设计并开发了许多技术（分层控制理论、用于分层控制器的熵方法、精度随智能性降低而增加的原理等）。在这一范式内，许多可能应用的结果包括团队控制理论、模糊集理论和系统理论。控制理论的许多进展专门用于控制系统（学习与自组织系统、神经网络、基于知识的、语言的和认知控制器）。\n\
  \n![图 10. 智能控制器的结构。](img/pg93_Image_129.jpg)\n\n图 10。 智能控制器的结构。\n\n## 新学科：智能控制\n\
  \n### 学科的融合：控制理论、人工智能、运筹学\n\n那么，如何可能控制运动，更广泛地说，控制任何系统的发展，而不取决于其复杂性，不受我们将其与环境分离并定位的能力的影响，不受上下文的影响，不受可用知识的形式及其表示方法的影响呢？仅用控制理论是无法实现的。虽然它很强大，但其工具受到设计者自我施加的短视性限制，并隐藏在\
  \ DIC 表示的机制中。\n\n人工智能理论（真的有吗？）也无法完成这项任务：当涉及随变化的动态过程时，AI 就会屈服。它脱离了稳定性、可控性等思想。控制理论和人工智能都无法脱离运筹学（OR）范式：其队列和博弈情境是各种应用的典型特征。智能控制倾向在必要时将这三个学科融合在一起。这种合金看起来强大且灵活。对\
  \ 1983 年至 1988 年期间智能控制领域发表报告的分析表明，许多文章理论上很有趣，在应用上很有用，但它们无法在传统控制理论的框架内被看待。\n\n智能控制作为一个学科，预计将在以下基础上对现有的控制学科进行泛化：\n\
  \n> 对象及其控制准则与目标系统以及元目标的结合分析，这些元目标通过整个设计程序决定了协商过程\n\n> 多传感器操作过程，且在环路中进行信息（知识）的整合与识别\n\
  \n> 人机协作活动，包括对人类操作员的模仿和替替\n\n> 代表上述元素的计算机结构\n\n在这里我们对智能控制领域的情况还一无所知。上述提到的任何元素都没有得到实质性研究和分析的支持。没有与智能控制领域相确认的既有术语。“智能”一词在不同的语境下被使用，具有不同的细微差别，这在许多情况下导致了困惑。遵循传统建议和观点存在着巨大的惯性，这阻碍了智能控制思想和方法的发展。\n\
  \n系统科学的一个新领域——智能控制，正在许多重要科学学科的交叉领域兴起：自动控制、人工智能和运筹学。对这一学科的兴趣始于大约十年前，然而，智能控制的“出生日期”可以追溯到对智能控制感兴趣的科学家第一次会议日期（1985\
  \ 年 8 月，纽约特洛伊）。这次会议证明了人们对这一现象有着巨大的兴趣。在第一次会议上，确立了智能控制作为一个学科的原则。会议之后，成立了 IEEE 智能控制技术委员会。约两百名\
  \ IEEE 成员加入了新委员会。IEEE 智能控制技术内部正在进行着有趣的讨论，致力于定义智能控制并构建一份可能的智能控制课程大纲。\n\n在第二次会议上，进一步的讨论显示了人们对这一新兴学科的兴趣持续增长（1987\
  \ 年 1 月，费城）。第二次会议从第一次会议获得的原则出发，探讨了某些具体方法，并强调了许多未来展望。这次会议有更多的赞助和更广泛的参与（第一次会议仅由美国参与者组成；第二次包含了来自欧洲、日本和几个发展中国家的代表）。第三次国际会议（华盛顿特区，1988\
  \ 年 8 月）表明，术语惯例已获得大多数参与者的接受；数百名科学家成为了技术委员会的成员。\n\n### 处理知识：智能控制的显著特征\n\n“知识”这一畴不再被仅仅认为是计算机科学的特权。知识正成为智能控制系统的“关键角色”（基于知识的控制器）。知识可以定义为消除智能机器运行中不确定性的函数\
  \ [9]。Saridis 提出通过熵来衡量知识，并使用知识率作为机器智能性的衡量。以下速率很重要：吞吐量、阻塞、协调、内部决策和噪声。知识需要处理以下活动：感知、表示、认知、推理和决策（包括规划/控制）。\n\
  \n智能控制强大的思想之一是建立知识组织与智能控制器结构之间的直接联系。在传统控制理论中，知识仅隐式地涉及控制器结构和控制过程。我们还没有习惯处理这个问题（知识）。然而，我们可以预见到与知识作为控制代理相关的设计和控制方法的巨大变化。\n\
  \n这就是为什么智能控制领域的研究围绕与知识相关的两个主要主题\n\n> 知识实现：智能控制系统的结构\n\n> 知识评估：智能控制中的观测与计算\n\n消除各种任务执行中的不确定性的过程可以用`精度`来表征\
  \ [9]。由于精度值在每个层级都是有限的，因此控制层级始终与分辨率层级相关联[10, 11, 12]`。知识表示的分辨率强烈影响图 10 所示系统的所有子系统。\n\
  \n## 智能控制理论的结构与课题\n\n\n\n\n\n“智能控制”（intelligent control）一词由已故的 `K.-S. Fu` 提出*13,\
  \ 14, 15*]，他在他生命的最后十年致力于非非常规控制系统各个方面的研究与分析。智能控制的定义最初出现在文献 *1* 中，其中“智能”属性与系统展示各种特征的能力起来，而这些特征传统上处于传统控制理论专家范围之外：决策、游戏、图像识别、对不确定介质的适应、自组织、操作的规划与调度等。甚至控制问题的表述过程本身也是以非传统的方式视觉化的：不预设任何优选数学模型，大部分信息以描述性的方式呈现，在整个问题解决过程以及控制过程中，初始假设都会受到挑战。\n\
  \n显而易见的是，人工智能、机器人以及一般的智能机器的任何实际进展，只有在在机器人和其他智能机器中应用特定人工智能方法的控制应用的基础上才能实现 \\[2\\\
  ]。同样的观点对于 CAD-CAM、大型空间系统、柔性制造、无人系统、远程存在设备、自动车辆等同样有效。在过去的十年中，基于计算机应用并与工业机器人与集成制造、智能战争以及军事系统中的\
  \ C³I、空间技术等相关的新技术的广泛发展，为智能控制领域产生了许多新的扩展。融合多传感器输出、利用视觉反馈、在控制层级的不同层次上观察同一过程的不同部分，这些都帮助创建了一种新型控制器：带有环路识别的控制器\
  \ \\*[13, 14, 15*]。\n\n一旦“识别”（recognition）一词被接受，其他术语也随之而来；最重要的是“知识”（knowledge）。很显然，闭合数学模型不应处于控制系统和过程分析与合成的核心，而是基于对所执行操作及执行背景的更广泛知识的*世界表示*系统。作为智能控制理论分析对象的智能控制器的结构，将在下文中进行讨论（见图\
  \ 2, 8, 10）。\n\n符号学世界表示系统的多重优势产生了一种新型控制系统：具有语言控制的系统。从数值控制开始，语言控制器演变为基于概念的控制。一种先进的学习过程：即与新概念创建相结合的概念性学习，引起了学习领域专家的关注，并激发了在控制器中使用学习特性的兴趣\
  \ \\[*3*\\]。\n\n随着具有自适应控制和自组织系统的出现，智能控制与运筹学理论之间的强联系变得显而易见 \\[*1*\\]。现在，基于规则和其他基于知识的控制器表明，生产系统在人工智能领域经过充分处理后，已成为计算机控制器的合法部分，因此，所有这些领域——人工智能、运筹学和控制理论的融合在智能控制理论的框架内似乎是不可避免的\
  \ \\[3,*16, 17, 18*]。\n\n智能控制理论的综合预计不会仅仅是文献中机械地收集和组合所有相关的理论“小工具”。许多被遗忘或忽视的想法可以为现有理论提供养分。例如，否定问题在智能控制的知识表示系统中正变得越来越重要。“否决权”（M.\
  \ Pedelty, 1963）在某种意义上可以从区别于平庸逻辑否定的角度来被理解。（有趣的是，使用广义否定被认为是人类智能演化的主要阶段。）\n\n这门新学科的出现并没有引起大家的欢呼。众周知，许多人工智能、运筹学和控制专家并不倾向于这些学科之间的任何融合。围绕模型建立理论似乎比为了满足理论结论而建立模型要容易得多。然而，现在很清楚这种融合是不可避免的，因为这种融合的结果在机器人技术、集成制造、计算机辅助设计等许多领域早已被期待。\n\
  \n智能控制并不旨在实现特定形式工具的增量发展，正如传统控制理论中所发生的那样（后者正在从微分和积分方程理论中推导出所有可能的含义，并以一种严格一致的方式进行）。智能控制的目标更多是通过借自不同科学领域的各种科学形式理论和方法的一致融合，实现对真实环境中真实需求更充分的满足。预计智能控制作为一个学科的科学一致性，将由其解决问题的那个运行系统的一致性来提供，可以说，是由其表示的元层面的一致性来提供的。\n\
  \n## 智能控制的主要理论问题\n\n### 现实问题的适定性（III-Posedness）\n\n现实中的控制问题通常是病态的。当使用实验数据构造模型时，病态问题几乎总是会出现。假设系统模型构造为\
  \ `Au = f`，其中 `f∈F`，`A:D[A]⊃F` 是一个在度量空间 `U` 上具有非空定义域的算子，对应度量空间 `F`。当求解性、唯一性和稳定性无法满足时，就会出现病态问题。（求解性要求算子\
  \ A 的值 `Q[A]` 与 `F` 重合；唯一性要求对于任何 `u1,u2∈ D[A]`，`Au1= Au2` 意味着 `u1 = u2`；而稳定性条件要求逆算子\
  \ `A^(–1)` 在 `F` 上连续 \\*[19。）一类重要的病态问题是由输入信息中的随机误差或信息源的随机性产生的 \\[*20*\\]。通过缩小主算子的定义区域来实现*适定性*（Well-posedness，A.\
  \ Tikhonov, 1943）。如果满足以下条件，则认为问题是适定的：\n\n> 先验知道解 `u` 属于指定的集合 `M`，`D[A⊃]M`，且解 `u`\
  \ 在类 `M` 中是唯一的。\n\n> `u` 的无限小变化对应于 `(Au = f)` 中 `f` 的无限小变化，且保持解在类 `M` 中。\n\n病态问题的正则化基于这样观点：通过使用某些满足附加参数条件的辅助非负泛函，可以稳定\
  \ `f` 值的最小偏差（A. Tikhonov, 1963, 1965）。这些思想非常重要，因为它们将我们的注意力吸引解附近的区域。这意味着局部模型可能与全局模型不同。这反过来意味着关于*嵌套集合模型*的有力结论（因为对一对局部模型-全局模型的考虑可以递归地进行）。\n\
  \n\n\n\n\n# 信息获取、估计、识别、表示与控制的嵌套模型\n\n人们倾向于将这一组嵌套模型视为一种通用现象，它与计算能力有限的高效信息处理系统的一般规律相关[*18]]。任何连续逼近的方法论都表明，需要使用嵌套表示系统，并自上而下对信息的分辨率进行连续细化[*21]]。连续逼近的优势是\
  \ R. Bellman 早期工作的重点[*22]]，这些工作与存储受限的控制问题有关。\n\n一类动态系统正通过所谓的`multigrid`（多网格）方法被成功解决。信息的嵌套分层表示及其连续的检索属性（自上而下的估计、识别和控制）在信息系统和数据库中正变得常见。估计理论中的`scattering`（散射）模型似乎与表示、信息获取、估计、识别和控制的嵌套分层模型通用框架是亲缘的。可以预计，这些方法与多时间尺度分析的融合是不可避免的[*23,*24](#C_007_c5.xhtml#r5_24)]。\n\
  \n然而，这一概念方案在传统控制理论结构中并不适用。显然，嵌套层次的高层由于其低分辨率的状态表示和较慢的时间尺度，与非动态规划的典型活动（具有模糊的结果和近似的建议）相一致。显然，层级越低，精度越高，时间尺度越快（即考虑的动态模型越强）。这种从规划过程向实时控制的渐进变化对研究人员和控制工程师来说变得越来越清晰。\n\
  \n# 控制循环的嵌套层次结构\n\n考虑到上述因素，可以将图 10 所示的循环转换为控制循环的嵌套层次（参见图 11）。这种现象可以帮助我们把规划/控制视为一个联合递归过程，并以此的方式构建所有其他处理信息和知识的算法。可以看出，虽然这些循环在控制上是独立的，但它们在感知、知识组织以及规划/控制的表示垂直结构中相应地连接在一起。这种垂直链接提供了整个控制器操作的一致性。在传统控制器中，控制信息的流从未与与其他分辨率层级（从上和从下）以及其他时间尺度上的过程进行协调。\n\
  \n![FIGURE 11. 嵌套多循环结构。](img/pg98_Image_130.jpg)\n\nFIGURE 11. 嵌套多循环结构。\n\n已经证明[*10,*12](#C_007_c5.xhtml#r5_12)]，知识的嵌套层次（根据确定性和信念程度组织）意味着决策过程的嵌套层次。这导致了控制器的类似嵌套分层结构。嵌套分层控制器在自主机器人领域的早期尝试被证明是成功的。基于规划器-导航器-飞行员（Planner-Navigator-Pilot）系统模块的三层\
  \ NHC（嵌套层次控制）目前用于多个版本的移动自主机器人。然而，当时还没有引入嵌套控制循环，且尚未完全理解每个层次级上不同分辨率进行处理的关键意义。\n\n\
  图 11 所示的控制器的多分辨率循环可以被视为一个实体（“智能模块”）。该实体建立在两个相互相关的知识库之上：一个承载词表示的实体关系结构，另一个在该结构基础形成定义规划/控制操作。\n\
  \n# 循环之间代价函数的协商\n\n作为基于嵌套分层结构的成功决策过程的首批方法之一，是由 Y. C. Ho 和 K.-C. Chu 提出的*[24, 25,\
  \ 26]]：在某些情况下，动态问题等同于等静态团队决策问题，特别是对于 LQG 情况，最优控制问题可以表示为观测数据的线性函数。T. Yoshikava (1973,\
  \ 1978) 证明，在具有 N 个控制站的离散系统中，Ho 和 Chu 的（部分）嵌套信息结构可以表示为一步延迟共享信息结构，且动态规划（DP）算法是可行的。DP\
  \ 似乎是最合适且具有远前景的方法，原因如下：\n\n1. 我们在智能控制领域处理的大多数系统在本质上是非线性的、耦合且复杂的：此类系统的控制预计需要进行离线预计算查表法。\n\
  2. DP 作为一种图搜索，可以通过许多启发式方法进行增强，这些方法旨在提高算法的计算效率。\n\n选择合适的代价泛函系统变得越来越重要。目前只有少数代价分配策略可以被认为是“易于处理的”，并经过广泛应用的丰富经验验证。一种可能的替代方案是代价分配策略，在该策略中，节点选择的总代价（节点扩展可行性）被分为两部分：\n\
  \n`Cf = C[g] + C[h]` (*P. E. Heart*,*, 1968)\n\n其中 `C[g]` 是从初始节点到候选节点的代价，`C[h]`\
  \ 是节点到目标的代价估计。\n\n在没有额外信息的情况下，应使用搜索空间的接受度量确定候选节点与目标之间的最小可能距离。这种策略可以有效地引导最优解。另一种源自\
  \ Stackelberg 博弈的策略是“领导者-从者”策略。其建议与 `A*` 算法一致：比较方案时应选择最小代价的上限。在嵌套层次中，这些建议决定了决策包。\n\
  \n嵌套分辨率（通过泛化）的世界表示（例如知识类别）`C[gk]` 如下对应于嵌套分辨率（通过注意力）的世界表示（例如知识类别）`C[ak]`：\n\n$\\\
  begin{matrix} {... \\supset \\underset{}{\\\\underset{\\downarrow}{C_{gk},i - 1}}\
  \ \\supset \\underset{\\\\downarrow}{C_{gk},i}} \\supset \\underset{\\\\downarrow}{C_{gk},i\
  \ + 1}} \\supset ...}} \\\\\\\\ {... \\subset C_{ak},1 - 1} \\subset C_{{ak},i}\
  \ \\subset C_{{ak},i + 1}~ \\subset ...} \\\\\\\\ \\end{matrix}$\n\n这是这些层次结构上嵌套决策过程的主要依据。决策的排序规则基于嵌套和决策策略。给定一个嵌套的世界表示\n\
  \n`S[1]` ⊃ `S[2]` ⊃ `S[3]` ⊃ ... ⊃ `S[i]`\n\n以及一组基于接受决策策略的代价泛函，决策集将构成一个嵌套层次结构\n\n\
  `Dp` ⊃ `Dp` ⊃ `Dp` ⊃ ... ⊃ `Dp`\n\n（证明和相关的交换图见于参考文献 *12*）。\n\n# 循环中的规划\n\n\n\n\n\
  \n# 规划\n\n规划在传统上被认为是一个与控制过程分离执行的过程。对于绝大多数系统来说，这种做法是可以接受的：规划可以离线进行，而控制过程可以在给定一组高度泛化的知识单元以及若干不可改变的目标后启动。通过降低泛化水平，并将确定性和置信度保持在分辨率所需的范围内，我们可以构建一个嵌套的规划过程层级。在这个层级中，在高层级确定的理想轨迹以`操作包络`（fuzzy\
  \ envelope of operation, FEO）的形式到达低层级。新的规划在 FEO 内部以更高的分辨率进行。\n\n这种将决策的上层级（或`离线阶段`）与决策的低层及即时性能（或`在线阶段`）分离的解耦，可能是区分规划阶段与运行控制阶段、以及区分相应的子系统或任何假设需要人类持续参与的设备的最显著的特性。这种解耦在智能控制系统中是不存在的：规划与控制是统一\
  \ `HNC` 中不可分割的部分。规划与控制通过中间决策层级相关联，该层级处理在特定`泛化`水平上`需要`使用知识的`过程`，但是在更新过程完成后完成的。\n\n\
  `注意力驱动规划`意味着在这一中间层级，正在进行的运动的结果会影响泛化的结果（因为`感知`系统启动了信息更新过程）。在`规划-控制`子系统层级，我们将规划过程本身命名为`导航`，在该层级，实时更新的结果对于成功规划至关重要。感知的嵌套层级并不要求传感器的层级化，尽管这并不排除任何可行的硬件解决方案。预处理阶段的嵌套层级被视为顺序缩放或注意力聚焦的结果。缩放必须基于注意力的聚焦，否则将无法满足有限计算能力的限制。（可以发现，这一概念可以在现有的图像组织和解释理论框架内进行解释。）\n\
  \n规划过程应该在每个层级执行，并累积地构成一个相互一致结果的嵌套层级。整个问题必须基于一组关于自律系统基于知识的运动控制的新型前提，并使用其他解决方案来解决。新前提产生新的承诺，并可以在智能控制器的结构内设计出用于分级嵌套智能模块的新型规划策略。\n\
  \n规划过程在不实际移动的情况下确定理想的运动目标和/或轨迹（在较低的规划层级精度增加）。因此，规划预计将以运行期间要实现的状态（或状态序列）的描述形式生成控制系统的输入。这意味着规划系统必须实际上`预测`应该是可接受的运动轨迹，同时它应该提供代价函数的理想值。\n\
  \n`联合规划/控制过程`意味着控制系统与规划的解耦是不可能的；控制系统与规划是统一 `HNC` 中不可分割的部分。这种解耦在智能控制系统中是不存在的：规划与控制是统一\
  \ `HNC` 中不可分割的部分。规划与控制通过中间决策层级相关联，该层级处理在特定`泛化`水平上`需要`使用知识的`过程`，但是在更新过程完成后完成的。\n\n\
  规划过程应该在每个层级执行，并累积地构成一个相互一致结果的嵌套层级。整个问题必须基于一组关于自律系统基于知识的运动控制的新型前提，并使用其他解决方案来解决。新前提产生新的承诺，并可以在智能控制器的结构内设计出用于分级嵌套智能模块的新型规划策略。\n\
  \n规划过程在不实际移动的情况下确定理想的运动目标和/或轨迹（在较低的规划层级精度增加）。因此，规划预计将以运行期间要实现的状态（或状态序列）的描述形式生成控制系统的输入。这意味着规划系统必须实际上`预测`应该是可接受的运动轨迹，同时它应该提供代价函数的理想值。\n\
  \n\n\n\n\n分层似乎是一种与注意力属性相关的自然现象，且其与泛化过程具有内在的联系。事实上，计算资源的有效利用和分配需要泛化，而注意力是其工具之一。因此，通过泛化过程创建的新类标签，被视为世界表示高层的新原语。这一规则：即“低层级的类标签被视为高层级的原语”，是嵌套层次结构机制的法则之一。\n\
  \n这种识别的结果（世界的快照）包含信息，其中部分信息可能与之前的快照不同，而另一部分将保持相同（例如，关于对象之间的关系和/或它们的属性）。因此，识别只能在语境中完成，即与另一部分信息（词汇知识库）进行恒定的交互。这影响了预处理程序的集合，这些程序与智能模块的其他部分是分离的，主要是因为计算机视觉系统制造的早期经验。`phaneron`\
  \ 中包含信息的合理分配应当与寻找 `phaneron` 结构（或图像解释）的过程同步进行。\n\n### 嵌套动态规划\n\n`Bellman` 的最优性原理对于随机问题可以表述为：在任何时刻，无论当前信息和过去的决策如何，剩余决策对于当前信息集必须构成一个最优策略。`Bar-Shalom`\
  \ (1981) 已经证明在不完全观测马尔可夫过程的情况下，可以应用随机动态规划。“规划-导航-飞行（或引导）-执行器控制（或执行）”的序列是所考虑的信息结构中嵌套层次搜索的直接结果。嵌套动态规划（`NDP`）方法源于文献\
  \ 12 给出的交换图和分析。它指出，应该根据以下规则，通过连续的自上向下和自下向上程序找到最优控制。\n\n- **规则 1。** `NDP` 应首先在具有完整（可用）世界表示的信息系统的最通用层上执行。这显然从系统最低层级（“执行器”）的角度来看会导致一个非常模糊的解决方案。然而，这在以后提供了实质性的优势：世界的很大部分将在后的低层级考虑中排除在外。\n\
  \n- **规则 2。** `NDP` 按自上向下逐层连续执行。每个连续较低层级的搜索子空间受到上一个较高层级解决方案的约束，该方案被重计算到下一个较低层级的分辨率。在上层级被视为最优解的区域，在低层级被视为独立决策的带（区域）。然而，由于在执行过程中在给定层级出现了额外信息，低层级的最优解可能需要寻找独立决策包之外的内容。在这种情况下应应用规则\
  \ 3。\n\n- **规则 3。** 在实际运动过程中，由于新信息，给定层级确定的最优轨迹必须违反分配边界，则应将此新信息提交给上层（必须进行适当的泛化，并必须更新信息结构）。这将产生一个新的自上向下的\
  \ `NDP` 过程。\n\n- **规则 4。** 当新信息的到达受限时（例如受“视觉极限”限制），则通过连续的子目标创建过程进行规划嵌套过程的递归。\n\n\
  映射嵌套层次 `{mi},i...` 是规划/控制系统的输入。实际上，这种嵌套层次是在子系统 `M` 和 `C` 之间的交互过程中生成的。让我们演示这一交互过程是如何进行的：\n\
  \n![](img/pg132_Image_140a.jpg)\n\n行 1 显示了两个嵌套层次：一个基于泛化（映射 `{Mi}`），另一个基于注意力焦点（映射\
  \ `{mi}`）。集合的层次结构是通过在每层应用 `NDP` 算法的集合层次结构得到的（行 2）。为了实现这一点，在嵌套层次结构上添加嵌套层次结构。为了计算一个集合，每层应用\
  \ `NDP` 的结果被增强到有意义的一致映射划分；其中一种可能的算法是“凸包”。该系统随后处于从顶层到低层的闭环路水平，并在收敛后，获得控制器指令系统。\n\n\
  控制算法的层级构成了“团队成员”的嵌套层次结构，它们使用“初始范围”、约束和由上层精炼的代价泛函来将结果提交给低层级。\n\n### 智能控制中的表示\n\n\
  计算机科学与控制理论融合的主流环境改变了表示的体系论。`AI`、`OR` 和控制理论传统上在表示问题上有不同的处理方法。在过去，控制理论对适当的世界表示问题的关注有限。基于积分微法的模型被认为是处理控制问题的主要工具。目标和控制策略通常被隐式地描述。在智能控制系统中，这种传统的表示方法正变得不再从心。\n\
  \n#### 系统表示的般问题\n\n在传统的控制理论中，系统被视为一组表示输入和输出的时间函数的序对。给出了描述系统未来行为所需的极少量过去信息。因此，假设对一组积分/微分方程进行分析。这套装置意味着接受多种惯例，这些惯例限制了过程的形状以及过程与系统之间关系的特质。\n\
  \n#### 系统建模与识别\n\n无疑，对象和控制器都只是近似值。对于许多实际情况，这种简化是可以接受的。建模过程基于对结构化系统的识别。有趣的是，在具有自识别能力的先进控制系统背景之外，严格引入的结构化或参数化识别程序的需求从未被充分重视。与此同时，对系统识别的严格方法变得至关重要，否则应用所有控制方法论的后续步骤将无法获得系统表示的支持，因为表示必须基于相同的初始假设。\n\
  \n#### 各阶数的分析模型\n\n基于系统的分解（通常在直觉水平上进行），构建的 `DIC` 模型复杂且阶数很高，即使在简单的情况下也是如此。已知许多降阶技术。最强大的是基于一种“优雅”的过程，将系统分解为使得子系统具有很低的阶数，或者以矩阵形式表示，从而便于计算模型。所有技术都使用了基于经验的启发式方法。\n\
  \n\n\n\n\n*微分与积分演算*\n\n在许多情况下，微分与积分（DIC）模型无法提供闭式解，或者无法生成替代闭式解的优雅计算模型。此时需要应用计算模型，这要求对系统进行某种在线、甚至是离线的仿真。这种情况在需要进行积分、系统结构随时间变化、模拟自动机等情况下频繁发生。布尔非分析控制器与借自人工智能的产生系统惊人地相似。动态规划算法与逻辑或的关联程度，与它们目前与控制理论领域的关联程度是相当的。\n\
  \n### 智能控制系统嵌套分层知识表示的通用概念\n\n嵌套分层知识表示（NHKR）的概念在智能控制理论中具有工具性作用。所有的分层知识表示系统以及所有的分层控制结构都基于这一概念。该概念涵盖了嵌套分层细化、多网格方法等。分层控制系统中众知的“随着智能化降低而精度提高”的原理\
  \ [5,9] 与嵌套分层知识表示的概念相关联。为了将这一概念与现有的信息表示结构联系起来，我们还将使用术语：`空间知识的多分辨率（金字塔型）表示`。（后者术语通常用于计算机视觉和图像处理领域（见\
  \ S. Tanimoto, T. Pavlidis [1975] 和 L. Uhr [1972]）。然而，我们*仅*将世界信息视为控制知识的可能来源。）智能控制感兴趣的知识多分辨率（金字塔型）表示方面，是表示分辨率与系统识别（识别）能力之间的关系。信息获取过程（例如感知）的分析证实了信息组织与\
  \ NHKR 结构之间的亲性。\n\n视觉分层的多分辨率思想与嵌套分层控制思想之间存在着显著的对应关系。事实上，在最高表示分辨率下计算控制序列是不可能的：计算时间太长了。在最低分辨率下获得的快速计算结果也是不可用的：结果太模糊了。然而，通过注意力焦点的引导，从一个层逐渐移动到另一个层来扫描所有分辨率级，并细化初始的模糊（且快速）结果，在不清晰的结果明确之前仅在其附近进行搜索。同样明显，分辨率嵌套现象可以成功应用于图像和/或概念这两种情况。随后，为了图像识别和解释调用`侧向搜索`过程，正如我们预期的，也用于规划/控制目的。\n\
  \n### 词典知识库：面向上下文的解释的语义网络\n\n从这个角度来看，这种技术更为重要，因为对图像信息的处理以及对语义网络的处理可以使用相同的方法。此时，图像和语义网络都可以被视为查找表（LUT）[例如，用于产生系统的规则表（用于图像解释、运动控制等）]。将多分辨率知识组织的原理扩展到语义网络领域是合理的，然后在语义网络的分辨率层级上执行侧向搜索程序。D.\
  \ Waltz (1985) 的最新结果似乎遵循了这一发展方向。\n\n因此，LUT 可以被视为子句的`有序`列表（当然，假设逻辑是多值的，并带有对定量数据的模糊和/或概率性质的赋值）。LUT\
  \ 可以以图的形式呈现。分配给子句的定量值应被理解为图中边的权重代价。由于任何逻辑推论都可以被解释为`因果方向性`，因此图可以是有向的。我们将感兴趣的是在语义图中定义顶点字符串或路径，其中二元关系“连接到”具有一个`值`。\n\
  \n\n\n\n\nTKB 被视为一组相关性语句的集合，这些语句被认为是各种决策支持系统的良式公式（WFF）。显而易见，知识由离散元素组成，这些元素稍后被称为知识单元，并被解释为确定整体关系图部分的相关性语句。当我们谈论知识时，指的是实际具有意义的表示知识（即，我们在这里并不感兴趣讨论世界表示系统中所代表的现实本质）。人们普遍认同工程师处理的是两类知识：声明性知识（declarative）和程序性知识（procedural）。虽然没有人确切知道这两种类型之间的区别是什么，但可以假设程序性知识是关于适用于声明性知识的操作符的信息（即：对于\
  \ TKB 给出的知识单元，可以应用哪些程序）。在文献中，可以找到另一种解释，它将“程序”一词与系统内的“动作”联系起来。我们通过简单地将动词替换为相应的名词，将系统内的动作纳入声明性知识的领域。\n\
  \n每个声明性 WFF 都可以属于两组之一：`existential`（存在性陈述），包括关于对象及其之间关系的陈述；以及 `transitive`（变化陈述）。这两种知识单元都以蕴含形式（子句）呈现。在描述\
  \ TKB 表示时，不断讨论语言学（逻辑学、人工智能）、集合论方法与另一种描述情况的向量分析方法（它们在本质上没有区别）之间的模拟是合理的。因此，当我们使用“变量”和“映射”术语时，同时指的是“存在性陈述”和“连接陈述”。在代数语言中，存在性陈述被理解为变量（`x,\
  \ y, z,. . ..`），而它们之间的连接陈述被理解为单个映射（`x → y, τ → ζ,. . .`）。\n\n## 控制目的的知识组织\n\n面向控制的知识组织理论被认为是智能控制器（Intelligent\
  \ Controller）的一部分。该理论专注于运动知识库模型的开发、算法结构，以及自主或半自主系统最优运动系统的设计。智能控制理论利用了这样一个事实：自主机器人现有控制结构（大部分是基于知识的）之间的相似性，揭示了作为智能控制器功能部分的面向目标的知识处理的若干内部机制。\n\
  \n简单来说，任何智能控制器都被组织成一个人类决策者团队，允许使用许多为人类团队开发的高效解决方案，例如具有领导者—跟随者的斯坦克尔贝尔格策略（Stackelberger\
  \ strategies）等。团队控制理论的发展是直接面向人类团队的应用。事实证明，团队控制理论的重要应用可以在机器人领域确定，智能控制器属于此类。与团队理论一样，智能控制器理论处理在特定策略下运行的决策者的协调活动，在需要协调决策策略的条件下制定决策。与团队理论一样，智能控制器理论需要特定的信息结构。然而，与团队理论不同，智能控制器处理的是计算机、控制器和机器，而不是人类。\n\
  \n智能控制器是控制理论以及知识库理论的一个较新应用领域。在智能控制器领域，术语、定义、技术或坚实的结果尚不明确。目前还没有一种一致的理论来处理用于机器人自控的描述性、结构不良的知识。尽管显而易见，合理利用先前操作的经验可以作为构建高效控制器的方便且有效的工具。拒绝任何寻找与此控制技术领域相关的非标准控制建议的尝试都是不妥的。这对于自主智能机器人尤为重要，因为操作只有在大量编码专家知识的基础上才能进行，而传统的控制解决方案由于无法实时运行而无法使用。在所有情况下，如果安排了一种高效的计算程序以实现智能控制器的实时操作，则控制被认为是可实现的。因此，重点在于那些不会导致\
  \ NP 困难问题的解决方案。将控制系统以一种允许易处理解决方案的形式进行表示的问题具有重大意义。在基于知识的控制器中，这个问题具有特定的内容：应适用于适当知识量化的信息结构。\n\
  \n## D 结构的一般特征\n\n描述性世界表示（D 结构）可以被形式化为全局语义网络，或者所有可能的标签及其之间关系的列表。D 结构被认为是统计文本分解的结果，其中文本被理解为所有与控制问题相关的可用论文、文档、专家叙述或其他被动源。假设文本在问题的特定语境内是可解释的，且该问题被认为在特定的话域（UOD）内是可理解的。UOD\
  \ 由词表形式给出的单词和表达式表示，这些不是正式 D 结构的一部分，但对用户可用，并用于其解释。\n\n被动知识源是指那些不是控制器的一部分、且不与控制器进行动态交互的源。给定一个被动源，D\
  \ 结构是每对标签之间关系的列表，该列表被认为代表了文中所有的相关知识。由于全局 D 结构是一个抽象，人们会有兴趣构建一个局部 D 结构，该结构仅在特定问题的语境下有意义，并进一步分解为与所选语境子集更高分辨率相关的更局部\
  \ D 结构。D 结构可以被视为一个关于标签之间关系的赋值陈述的连接列表，并可以通过以下属性进行表征。\n\n1. 该列表是开放的，在设计问题解决过程中以及系统运行的控制（学习）过程中，都可以向列表中添加新的关系。每个标签和每个关系都独立地由一个标记该标签或关系重要性的数字表征。该重要性值通过考虑\
  \ (a) 标签在代表性文本中的使用统计以及 (b) 专家意见获得。\n\n2. 该列表中引入了泛化操作，其功能是将所有的标签及其之间的所有关系组织成类。新标签被分配给类标题，这些标签被包含在初始列表中（封闭性）。实际上，这些新标签预计存在于构建良好的\
  \ D 结构的初始完整列表中（完整性）。\n\n\n\n\n\n## 3. 列表中列出的每种关系都可以被视为一个意义生成器（meaning-generator）。意义生成器预期能生成初始上下文中未提到、且可能未被意图表达的陈述。这假设引用了文中包含的关联记忆（associative\
  \ memory）。从 `D` 结构接收到的每条陈述不仅携带了显式信息（词典中的解释），还包含了从关联记忆中生成的陈述含义。现有的基于知识的控制器并不一定具备关联记忆，但应当具备。搜索（例如浏览）程序可以从关联记忆中提取隐性知识。\n\
  \n## 4. 在构建全局（抽象）`D` 结构后，它并不指代任何问题或过程。需要额外的努力将该结构引用到某个抽象参考系中，并在全局数据结构中定位一个面向问题的数据结构子集，以便在参考系内对其进行控制。选择抽象参考系是为了将标签描述为真实属性的组合。它们之间的关系仍然存在，且每个标签不再仅仅是一个单词，而是多维描述空间（`D`\
  \ 空间）中的一个点。该 `D` 结构中的每个关系反过来应该放入一个 `D` 空间中，以便用于解决问题。\n\n## 5. 这种引用系统或参考系可以以虚构向量空间的多维坐标系的形式构建。每个标签随后被假设具有若干维度。这提醒我们，每个标签都被表示为一组属性，或者最终表示为一组单词（变量）。每个属性（单词、变量）都可以被进行定量的评估。\n\
  \n## 6. 为了创建轴的列表，我们分析 `D` 结构的超图（hypergraph），因为每个能够影响控制状况的标签都应该在其中被表示。描述特定标签所需的轴列表，是所有与所考虑的标签相连的所有其他标签的列表（总超图）。每个标签仅由其他标签定义，不能具有未被任何标签描述的维度。\n\
  \n## 7. 施加的信息受到硬件（成本、架构复杂性和计算时间）以及软件（算法复杂度）的限制。这些因素在某种程度上由 `D` 结构的连接性水平决定（如果描述是完整的，则\
  \ `n` 个节点有 `2^n` 种关系）。在实践中，关系的数量可以根据当前任务进行限制。这从本质上取决于表示的最高（最精细）的分辨率水平。分辨率反过来由原语层表示的最小可区分单元（单词）决定。\n\
  \n### D 结构的数学属性\n\n在 `D` 结构中可以寻求以下数学属性。\n\n`D`-结构是一个场（偏序）或一个四元组 `(Δ, +, ·, ⇒)`，其中\
  \ `Δ` 是一个加法下的阿贝尔群（abelian group），单位元素为 `e`，`+` 和 `·` 是运算，`⇒` 是一组（弱、部分）序关系集合。（如果运算（`·`）是交换的（`a\
  \ · b = b · a`），则该群为阿贝尔群，其中符号 `=` 意味着“同余”。如果两个元素的组成元素等价，且每对组分元素之间的对应关系也等价，则这两个元素被认为是同的；等价是一种自反性、传递性和对称性的关系，对于等价性我们使用符号\
  \ `↔`。一个每个元素均可逆的单元（monoid）是一个群。单元是一个有序三元组 `(W,», ⇒)`，其中 `W` 是带值单词的部分序（`⇒`）子集（偏序集，posets），（`·`）是一个结合二元运算）。\n\
  \n最小偏序对是任何由关系 `⇒` 连接的单词对，在 `D` 结构中被命名为陈述（或规则）。带值单词定义为一个符号（标签）和一个与该符号关联的实数。`W` 的任意\
  \ `Η` 子集 `W(W�⊃H)` 上的二元关系 `⇒[i]` 是一个规则，因为它“决定”了对于任何给定的 `a,b ∈ W`，是否满足（ `a⇒[i]b`\
  \ 成立）。单元的元素是单词，可以通过一组由实数评估的其它单词来表征。换句话说，存在一个从单词空间到实数空间的映射。稍后我们将利用单词作为 `D` 结构元素利用的这一独特性，为\
  \ `D` 结构的表示建立一个向量空间。\n\n任何关系都被视为一个带值的陈述（与实数关联的陈述）。场 `Δ` 包含具有不同关系 `⇒[i]` 的各种子集。这些关系的类型将在稍后讨论。单词（标签）是一个格（lattice），因为它是一个偏序集，且对于单词的所有子集都存在上界（supremum）和下界（infimum）。我们可以看到，`D`\
  \ 结构的每个元素（单词）都是一组也是 `D` 结构元素的其它单词。这些单词中的每一个反过来又一组也是 `D` 结构元素的单词。这种递归提供了一种单词解释的嵌套层级律法。如果需要执行的递归分解次数是有限（考虑局部\
  \ `D` 结构），那么我们就得到一个世界表示的层级。顶部单词的有限集合由问题公式决定。\n\n如果 `D` 结构是一个群，那么 `D` 结构的非空子集 `Η`\
  \ 被称为子群，如果对于所有 `x,y∊ H`，满足 `x · y e Η` 且 `x^(−1)e Η`，其中 `x^(−1)` 是 `xe Δ` 的逆元。存在唯一的元素\
  \ `e£ Δ`，使得对于任意元素 `aG Δ`，都有 `ea = a = ae`。对于每个 `ae Δ`，存在 `a^(−1)e Δ` 使得 `a^(−1)\
  \ a = e = aa`。群积应被视为一个映射 `m:A* τ Δ—» Δ`（符号 → 用于映射）。`Δ` 上的序与加法和乘法运算的，如下：对于所有 `a,b,C£\
  \ Δ`，`bⅸ c` 意味着 `a + c`，且如果 `a ⇒ e`，则 `ab ⇒ ac`。\n\n## D 结构上的运算\n\n加法解释为连接（或最小成本连接），它被定义为\
  \ `Δ` 中从 `x` 到 `y` 的路径（最小成本）（`x,y∊ Δ`）。路径（最小成本）被理解为 `D` 结构中陈述的字符串（关联的单词对）`τ ⇒ a,\
  \ a ⇒ b,... ,m ⇒ η, η⇒ y`，它被指定为描述路径序列的节点字符串 `(x,a,b, . . . ,m,n,y)`。该路径用于评估路径起点和终点之间关系的陈述。两个字符串的连接指定了起始单词到结束单词的路径（最小成本），并将两个字符串作为强制性组成部分。对于连接，我们将使用符号\
  \ `P`（指向路径）。\n\n乘法解释为合并，它被定义为 `D` 结构中 V 形的生成。类似于连接，可以提供最小成本的合并。`D` 结构中的 V 形定义为两个格（单词）`a,be\
  \ Δ` 以及一个格 `c∊ Δ`，该格是 `a` 和 `b` 的共同子格（即 `a ⊃ c, b ⊃ c`），这也意味着 `a nb = c`。合并是一种类生成过程：格\
  \ `c` 是类生成属性。因此，我们将该过程称为一种泛化运算（operation generalization），并使用符号 `G`（指向泛化）。\n\n###\
  \ 通过合并生成类：属于有意义的簇\n\n\n\n\nD 结构可以被解释为特定分辨率下的 $\\epsilon$-网（A. N. Kolmogorov, 1953），也可以被解释为具有不同尺度的嵌套\
  \ $\\epsilon$-网系统，其中尺度被定义为某层分辨率与最低层分辨率之间的比率。显然，上层中每个较大的瓦片（tiles）都是层次结构中下层较小瓦片集合的“泛化”。在上层中选择其中一个瓦片（集中注意力）意味着在下层中选择一个特定的较小瓦片子集。\n\
  \n我们假设 $\\epsilon$-网可以由任何类型的世界描述技术构建。描述可以是定量的，可以代表确定可测变量的度量，那么 $\\epsilon$-网就展示了该世界表示中被测离散值之间的关系结构。描述也可以是定量的（例如语言的），此时\
  \ $\\epsilon$-网将传递表示世界对象和过程的标签（或单词）之间的关系知识。我们认为这种知识表示结构在两种情况下都是通用的，并将其命名为 `D structure`（描述性结构）。\n\
  \n“泛化”一词尚未被恰当地定义；在此阶段，我们将假设这种对泛化的松散解释，仿佛我们正在处理一个统一集合中分离知识单元的算子。我们想强调的是，瓦片嵌入层次结构中显示的包含关系\
  \ $X \\supset X \\supset x$ 具有比“尺寸缩放”更重要且广泛的含义。包含谓词 $\\supset$ 有“属于某一类”的意思。在空间知识的情况下，这种属于与某些空间邻域有关，空间被理解为物理空间。然而，人们可以讨论状态空间、加权属性空间等，而“属于某个空间邻域类”的概念变得接近逻辑学科中理解的“泛化”含义。那么，状态空间的离散化将同时有助于：(a)\
  \ 考虑所需的最小间隔，(b) 属于意义邻域的类层次结构。\n\n上层较大瓦片之间的关系可以被视为下层对应子集瓦片之间对应关系的泛化表示。这不仅意味着该瓦片本身的属性被泛化了，它与其他瓦片的关系也被泛化了。\n\
  \n### 类生成\n\n类生成基于抽象原理：存在一个集合，使得：\n\n```\n(∀x) [x \\in H \\leftrightarrow f[x]]\n\
  ```\n\n其中 $\\Delta \\supset H$，\n\n$f(.)$ 是一个带变量的 `WFF`，这意味着如果公式化关于某个属性的 `WFF`，就可以找到一个集合\
  \ $H$，使得该集合的所有成员都具有该属性（类生成属性）。我们的意图是以这种方式表示知识，使得广义上的（对于一个类）每个 `WFF` 都是具体实例化（对于该类的成员）的\
  \ `WFF` 的泛化。因此，一个集合被认为属于一个类，当且仅当它具有该特定类的生成属性时，即：\n\n```\na \\in {x | f{x}} \\leftrightarrow\
  \ f(a).\n```\n\n换句话说，广义上的（对于一个类）任何 `WFF` 都是具体实例化（对于该类的成员）的 `WFF` 的泛化。因此，一个集合被认为属于一个类，当且仅当它具有该特定类的生成属性。\n\
  \n### 准确性与分辨率\n\n`D structure` 的分辨率由状态空间的离散化决定。\n\n\n\n\n在所有这些情况下，某些定义较模糊的程序（如“决策”）的重要性都会随之增加。当不确定性的数量很大时，`DIC`\
  \ 模型的信度（尤其是高阶模型）非常低。不确定性表示主题可以揭示 `DIC` 表示和 `D` 结构适用性的最重要标准。对这两种表示方法的应用比较领域的分析尚未完成。未来的研究将展示这两种方法之间的关系，证明何时两种方法都是适用的，以及何时它们不能相互替。\n\
  \n## 控制理论的重新审视\n\n许多问题对于统一在“智能控制”标签下的研究、开发和应用活动具有说明性。我们在这里涉及了这些问题中的一些，它们可以对上述该领域状况的分析进行补充。\n\
  \n### 反馈概念\n这一宏大概念的整体性应该基于处理不同方法（包括基于计算机实现的传统控制器和智能控制器）的广泛经验，给出新的、妥的解释。在“智能控制”的框架内，反馈与前馈之间的区别正变得模糊。事实上，考虑到所谓的“前馈”概念，人们很容易地看到：(a)\
  \ 它包含了“早期”规划的元素；(b) 假设反馈信号是存在的，而不仅仅是缺失。因此，基于对过程某些期望的规划与对设备、控制系统和环境真实状态的测量相结合，被理解为简单反馈概念的预期进展。利用这一原理的反馈控制显式地采用了控制的在线算法。这类控制已经经过大量研究，文献中存在大量算法。离线（耗时的）算法通常需要使用查找表，这是最近的进展。由于允许超过用户要求的误差，因此假设需要进一步的反馈补偿，控制结果被视为对后续跟踪的规划。\n\
  \n### 最优控制\n智能控制器有助于理解为不存在非最优的控制。任何需要控制的系统都应该在关于时间、精度、能量或任何其他令用户和/或设计者感兴趣的收益与损失的强最优或弱最优性条件下进行控制。即使最优性问题不是显性的，它也总是隐含的。控制理论专家不应该以作为控制专家的“愿望”形式选择最优性标准来利用用户。有趣的是，控制理论历史上的\
  \ `LQG` 时代及其许多成就，为目前最优控制理论的发展带来了许多障碍。由于方便地选择了“愿望”并获取结果，研究人员规避了对除二次形式以外的任何最优性标准的探索。多标准优化没有得到应关注：它太“依赖上下文”，太倾向于\
  \ `OR` 和 `AI`。\n\n因此，当优化问题在相当复杂的水平上提出时，引入了启发式方法来对控制表示进行适当近似。所应用的理论和获得的解的僵化证明是短暂的。准最优搜索算法的应用导致了对动态规划兴趣的复兴。人们很容易将\
  \ `Pontryagin principle` 视为使用变分方法的定性结果，而非分析结果。性能标准通常基于引入某些类似于效用函数的性能标准。“时间”、“误差”和“能量消耗”是关注的主要因素。系统的效率（与系统组件的能量损失相关）提供了系统可靠性的准确衡量。\n\
  \n大多数最优规则传统上由控制和 `OR` 理论者引入。容许控制被引入最优控制理论中。“效用”理论首次被应用于 `OR`。在大规模系统中，使用 `OR` 方法论及其所有的“帕累托最优策略”和风险评估（这在传统的控制学科中是不受欢迎的）是不可避免的。\n\
  \n### 神经元、自动机、网络、学习\n\n**麦卡洛-皮特 (MCP) 神经元。** 自动机与人类智能结构之间的类比证明比最初设想的要强。`MCP` 神经元和其他类似的基础元素是构建现代多处理器计算机系统的基础。后产生系统恰好是处理基于\
  \ `MCP` 神经元的系统的适当理论工具。\n\n**带记忆的自动机。** 从科学角度来看，自动机理论被证明最适合描述多处理器计算机系统的“拟人”属性，特别是学习。自动机理论是计算机语言数学理论（包括后产生系统）的合法发展。20\
  \ 世纪 60 年代，自动机理论被认为是控制理论的一部分（例如 `M. Arbib`, 1963）。现在工程界对 `LQG` 范式的局限性已经很清楚，自动机理论作为一种控制工具在智能控制理论内复兴。\n\
  \n**感知器与神经网络。** 学习和自组织问题首先在“控制”社区内讨论。然而，解决方案的手段是在 20 世纪 70 年代后期在 `AI` 社区内确定的。早期感知器（`F.\
  \ Rosenblatt`, 1958）在没有足够计算机的基础上无法成功。目前，感知器设备的所有变体都被标记为神经网络。这些是具有适应和学习特性的智能控制系统的自然（即使不是最好的）组件。显然，`D`\
  \ 结构可以被视为一类神经网络或多层线性感知器的特殊模型。\n\n**自适应与自组织控制：带有学习和识别的控制。** “自适应控制”一词借自心理学和生理学，表示一种“行为主义”控制方法。自适应系统基于处理不确定性的各种启发式原理。自组织的属性具有某种拟人性。学习被认为是感兴趣属性的同义词。两种学习（定量和概念）之间的区别现在才成为关注的焦点。定性调整与概念创建的触发效应之间的巨大差异尚未获得足够的关注。\n\
  \n在这里，应该特别强调“观测者”的作用。概念学习需要多种模态传感器的假设，使得单一感知模态的系统仅适用于定量学习。在具有多种感知模态的观测者中，可以考虑两种策略：按照先验计划的顺序应用模态，以及在输入信息序列中串行/并行应用感知模态。无疑，目前现代控制理论中呈现的“观测者”理论，当系统发展到智能控制领域时，应该得到实质性的开发和改变。\n\
  \n### “深奥”控制器：通过认知实现语言控制器\n\n\n\n\n# 语言与基于知识的控制\n\n在语言系统中，表示系统和对表示进行操作的多种选择似乎是非常成效的。基于\
  \ `QEM`（定量演化模型）进行推理而非计算已被证明不仅具有吸引力，而且富有成效。我们不是估算量化变化，而是对变化进行推理！`D` 结构无疑是这类控制器中过程的合法模型。\n\
  \n## 模糊系统与模糊控制器\n\n语言控制器与模糊控制器之间没有太大区别。它们的区别在于使用定量方法和定性方法的领域。模糊集和系统理论为进一步利用语言表示开辟了许多前景前景，可以基于推理系统以及\
  \ `QEM` 实现非常高效的定量控制。\n\n## 认知控制器\n\n当知识库非常大且感知非常多样化时，智能控制器的运行就接近于人类认知。这里的关键问题是怎样组织知识，以便找到对新\
  \ `states`（世界描述）的解释，从而形成新的任务表述。具有分层感知和分层知识库的分层系统与人类认知活动非常相似。人类认知有许多比喻模型，然而，它们缺乏在智能控制系统中使用的方向感。应该警告研究人员不要直接吸收认知心理学术语，这些术语可能带有不当的内涵。\n\
  \n## AI、运筹学（OR）与控制理论之间的交互\n\n智能控制理论确实存在。但到为止，尚未以严格且一致的形式呈现。主要的陈述、技术和应用分散在各个领域的不同资源中。它吸收了来自传统科学领域的几乎一切，并由文献\
  \ `1` 中定义的方向函数结合在一起。\n\n### 植入 AI 程序中的控制功能与属性\n\n“控制”是产生系统的内在组成部分。它被解释为规则应用的安排和调度机制。对于控制理论专家来说，“规则”与“控制”等同于一个控制系统。AI\
  \ 与控制理论中控制概念的相互联系是一个待进一步研究的问题。控制算法的功能对应于智能控制的定义。控制策略被认为是规则库的一部分，该规则库根据“外部”标准和当时生成的偏好概念对环境进行持续评估而更新。因此，最优性要求在不同情况下可能意味着不同的操作，即规则库的不同子集。\n\
  \n### GPS 的控制定向\n\nGPS（通用问题求解器）传统上被理解为系统顾问。然而，它的建议可以被视为“下级控制器”的“输入”。\n\n1. “状态—动作”形式的产生规则。`GPS`\
  \ 和许多其他产生系统的输入和输出都是“状态—动作”形式，其中状态被理解为状态描述，“动作”则是控制。\n2. 分层产生系统 (HPS)。`HPS` 通过将“控制部分”递归解释为上层的“规则部分”，从传统的产生系统中获得。\n\
  3. 推理引擎与决策判别器。推理引擎（即产生系统）在获得“动作”的优选方案后产生输出。决策判别器是产生系统的内部组件。\n\n### 规划理论中的控制元素\n\n\
  规划被理解为一种基于预测状态并将预测结果与期望的状态发展进行比较，从而寻找适当控制的技术。基于世界表示分辨率分层的分层系统描述在规划理论中是传统的。在所有层级发现的控制“嵌套”满足了一致性要求。规划在“反馈—前馈”二元性框架和产生系统概念内进行分析。\n\
  \n### AI、运筹学与控制理论的功能相互植入\n\n运筹学（OR）在启发式方法、规则分级和逻辑表示方面的程度与控制理论相同。大多数涉及事件流和队列理论的公理和假设都是基于启发式的。优化、调度和协调是运筹学与控制理论的共同元素。\n\
  \n控制理论采用的各种系统模型与大多数 AI 构建具有相似的启发性：(a) 模型结构化，(b) 阶降低，(c) 设计输入、输出、状态等。当提出问题时使用模型结构化、建模或基于语言模型（并非总是显式的）时，会对分析结果产生影响。\n\
  \n大多数情况下，控制算法基于隐藏的语言构造底层逻辑结构，而这些结构通常不被分析。在各种替代方案之间进行选择、定性和/或定量的判别是一种宝贵的控制功能，但在控制理论内部没有得到足够的关注。\n\
  \n1. 判别函数以公理的形式引入；其背后的逻辑结构并不总是被清晰感知。\n2. 切换时间、Bang 控制（bang-bang control）具有有趣的内部逻辑结构、一组隐含接受的规则假设以及算法底层的启发式；该主题尚未得到充分分析。\n\
  \n## 智能控制中的启发式\n\n### 算法的启发式策略\n\n最初在运筹学中创建的所有搜索算法（分支限界和其他搜索算法）都是基于多种搜索启发式的，并被应用于动态规划理论。线性、非线性和动态规划的所有主要思想都是基于类\
  \ AI 的启发式构建（包括分解和聚合方法）。\n\n控制理论采用的各种系统模型与大多数 AI 构建具有相似的启发性：(a) 模型结构化，(b) 阶降低，(c)\
  \ 设计输入、输出、状态等。特别是当在提出问题时使用模型结构化、建模或基于语言模型的标准时，会影响分析结果。\n\n## 智能控制器的特性\n\n分层系统的标准情况是在层次结构的每一层考虑冗余、识别、学习等。\n\
  \n### 精度增加智能降低的原则\n\n该原则旨在同时考虑不同分辨率的表示（框架分解）、嵌套的分层分辨率以及规划视野。所有层级中最精确的——下级控制器，冗余最少，准确性最高，且使用“选择”功能的需求最低。\n\
  \n### 不同智能水平下的不同 AI 应用\n\n拟人化结构（如“规划员”、“导航员”、“飞行员”）说明了 AI 应用在不同水平是不同的。水平越低，传统控制理论的应用越高，AI\
  \ 的应用越低。不同层级的协调功能被理解为分解层级子任务性能的聚合功能。这些功能与 AI 技术紧密相关。\n\n### 人机交互\n\n可以预期半智能操作，这需要与人类操作员持续通信，或偶尔让操作员参与。语言命令识别与知识库的语言、控制器的逻辑以及通信媒介相关。与操作员交互的语言的选择应能增强系统运行的方式。\n\
  \n\n\n\n\n与环境的交互基于多种感官感知系统，这些系统被认为是智能控制系统所必需的。多感官融合应当能够处理不完整和动态的信息。因此，冗余性成为一种有助于识别、泛化、分解和假设生成的属性。\n\
  \n### 更新世界表示\n这一过程使得多感官融合（尤其是视觉传感器的使用）非常重要。世界地图的更新是通过识别过程完成的。发现此类系统增加了许多新属性。任务和世界地图是面向问题的知识库进行协调分解的结果。\n\
  \n### 协调运动控制\n在协作功能中协调多个机器人的问题（机器人团队控制）并不是唯一的可能应用示例。任何系统和设备的联合操作都构成了协作问题或对抗性活动。协作可以分为两类：属于同一个协调器的协作系统，或属于两个或多个不同协调器的系统。\n\
  \n### 确定实时分配\n持续的问题分解与聚合机制机制最终决定了低级控制器的实时分配，该控制器应根据规范以 `Dl` 模型、逻辑结构等形式表示。\n\n###\
  \ 智能控制的结构\n智能控制的结构应该反映需要此类操作的智能机器的规范。目前已知的智能机器组包括：智能机械臂、移动自主系统、CAD/CAM 系统、飞机、航天器、导弹等。需要对规范进行彻底分析以确定上述规范集。\n\
  \n### 具有智能属性的结构\n需要重新努力在智能控制理论框架内考虑以下所有结构：\n\n1. **具有学习能力的结构。** 现有的定量学习理论应该通过植入识别属性的任务来补充。\n\
  2. **具有适应性的结构。** 基于带有识别的学习，传统的自适应系统可以得到大幅改进。\n3. **具有自组织的结构。** 这些活动不能被程序化。系统的“自我”负责定义更新系统知识库的方法。\n\
  4. **具有概念创建结构的。** 考虑到学习系统的演变（概念学习与定量学习），概念创建的需求是显而易见的。因此，“创造性”的一些元素应该刻画任何智能控制系统。然而，智能控制中定义的类人操作无法涵盖“创造性”一词所包含的所有组件。\n\
  \n另一方面，日益明显的是，虽然怀疑但可能的“创造性控制”领域将不再被触及。事实上，`U. Grenander` 在刚性数学理论框架内对“图像生成器”的处理，似乎对其群分布分析的自然延伸，这种分析以一种有趣的方式早于范畴理论内部的模糊集和系统理论。许多近期报告直接或接地思考了适用于智能控制理论的概念创建理论的基础。\n\
  \n* **e. 具有自主运行的结构。** 自主系统构成了智能控制系统发展的下一步。\n* **f. 具有协作的结构。** 如前所述，协作是指团队（机器人、手臂、腿等）内部以目标为导向的交互。\n\
  * **g. 具有自我复制的结构。** 在长期任务中，自我复制在经济上可能是行的。\n\n### “规划者-导航员-飞行员”概念\n文献 *11* 描述了一个具有这种结构的认知智能控制器的示例。在具有大型自组织知识库和概念学习的系统中，应该预期智能控制器具有直觉功能。这可以被视为智能控制领域开发的下一个阶段。\n\
  \n### 智能控制计算机系统\n\n#### 五代计算机作为开发智能控制系统的基础\n考虑到对五代计算机的预期，它们是智能控制器最合适的计算机基础。\n\n\
  ### 执行器\n显然，智能控制系统必须处理关于过程、内部状态和环境的冗余且同时不完整的信息。另一方面，这些信息部分可能是矛盾的。知识库应该能够处理这些信息的属性，并维持过程图像以及论域图像。分解和聚合（泛化）应该在线进行，即世界的像素级结构，以及除冯·诺依曼原理以外原则的处理和便利性。\n\
  \n目前，我们可以在以下不同“品种”的计算机讨论使用智能控制系统的不同结果：逻辑思考型计算机、创造思考型计算机以及具有自我意识的计算机。这些区别只有在自组织的基础上才能发展。\n\
  \n### 信息密集型系统\n自组织、自发展的知识库对于信息密集型系统（`IIS`）是理想的。`IIS` 的结构应该具有概念创建和面向目标的属性。\n\n####\
  \ 智能控制的语言和架构\n该主题应该认为是未来智能控制发展最重要的重点之一。层次嵌套控制理论不仅为自主机器人生成概念架构，还建议了一些计算机架构以及处理问题的技术。\n\
