  \ S. Roth 编），World Scientific, Singapore, 1986.\n\n**AUSTIN BLAQUIERE**\n\n# 大脑与信息研究\n\
  \nDOI: [10.1201/9780367811493](https://doi.org/10.1201/9780367811493)\n\n人类记忆最迷人的方面之一：尽管个体神经细胞不断丢失，记忆仍能持续，这使得许多研究者考虑了分布式记忆的概念。1,\
  \ 2, 3, 4, 5, 6, 7。对于分布式记忆（更像全息图而非照片）来说，它自然具有对存储单元丢失的相对免疫力：单个存储位包含着关于许多事件的叠加信息。为了获取单个事件，必须从许多位中收集信息。\n\
  \n此外，与快速且准确地执行大量顺序操作的现代计算机不同，中枢神经系统的工作速度较慢，且在单元水平上可能并不十分精确，循环周期无法短于几毫秒。然而，我们可以在几秒内做出复杂的决策。这强烈地表明大脑中存在大量的并行处理——这一观点在检查视网膜等组件时几乎是显而易见的。\n\
  \n现在通常认为，突触不仅是存储信息（例如记忆）的手段，而且是在神经元之间传输信息的手段。通过可变突触与其他神经元连接的大型神经元网络，为本文讨论的分布式并行系统提供了生理基础（见图\
  \ 1）。\n\n\n\n\n\n![图 1. 一个理想的分布映射。`F` 中 N 个输入神经元中的每一个都通过单个理想接头连接到 `G` 中 N 个输出神经元中的每一个。（只画了连接到\
  \ `i` 的连接。）](img/pg46_Image_82.jpg)\n\n图 1. 一个理想的分布映射。`F` 中 N 个输入神经元中的每一个都通过单个理想接头连接到\
  \ `G` 中 N 个输出神经元中的每一个。（只画了连接到 `i` 的连接。）\n\n神经元与神经元之间的实际突触连接通常是复杂且冗余的；我们通过将轴突和树突之间的这种多突触替换为单个理想接头，对网络进行了理想化，这在逻辑上总结了来自\
  \ `F` 库中神经元 `j` 的传入轴突分支与 `G` 库中输出神经元 `i` 的树突之间所有突触接触（图 2）。\n\n![图 2. 一个理想的突触接头。](img/pg46_Image_84.jpg)\n\
  \n图 2. 一个理想的突触接头。\n\n尽管神经元的发放率以复杂且非线性的方式依赖于触前电位，但通常有一个定义良好的线性区域，在该区域内，一些非常有趣的网络属性已经显而易见。因此，我们将注意力集中在阈值以上、饱和以下的区域，在该区域，`G`\
  \ 中神经元 `i` 的发放率 `gi` 是由 `F` 中所有神经元 `f[j]` 的发放率映射而来的：\n\n$gi = \\sum\\limits\\_{j\
  \ = 1}^{N}~A\\_{ij}f\\_{j}$(1)\n\n在此过程中，我们将神经元（或可能是一小群神经元）的平均发放率以及瞬时信号的时间平均值视为重要的。我们进一步利用了神经元已知的整合特性。\n\
  \n然后我们可以将 `[Aij]`（`N²` 个理想接头的突触强度）视为一个矩阵或映射，它将我们从 `F` 空间的一个向量引导到 `G` 空间的向量。这将 `F`\
  \ 空间中的神经活动 `f = (f[1], f[2]... f[N])` 映射为 `G` 空间中的神经活动 `g = (g[1],... g[N])`，可以用紧凑的形式写作：\n\
  \n`g = Af` (2)\n\n已经证明，分布映射 `A` 可以以高度精确的方式作为一种内容寻址的记忆，其中“逻辑”是关联的结果，也是记忆本身性质的产物（[5]）。\n\
  \n`N²` 个接头 `A[ij]` 包含了分布记忆的内容。特定的接头强度 `A[ij]` 可能由几个具有不同寿命的若干成分组成，这些成分被认为对应不同的生理或解剖效应（例如，触前囊泡数量的变化、突触后受体数量的变化、Ca+\
  \ 水平和/或可用性的变化，以及树突生长或收缩时可能发生的解剖学变化）。这样，我们就有可能实际记忆内容（即使在没有额外学习的情况下）会随时间变化。对于一个双组件系统，我们可能有：\n\
  \n`Aij = A[ij]^((long))(t) + A[ij]^((short))(t)` (3)\n\n其中 `Aij` 代表某时刻 `t` 的记忆，而\
  \ `A[ij]^((long))` 和 `A[ij]^((short))` 具有长短寿命。因此随着时间的推移 `Aij)` 将衰减，留下 `Aij = A[ij]^((long))`。短期记忆成分中的内容是否转移到长期成分中可能取决于某些全局信号，取决于短期成分中所含信息的价值。\n\
  \n从这个角度来看，长期和短期记忆的位点本质上是相同的。在任何给定时间，都只有一个记忆。长期和短期记忆的区别在于 `A[ij]` 不同成分的寿命。\n\n现在我们问如何将一个类型为\
  \ `A` 的映射放入网络中。`A` 的第 `ij` 个元素，\n\n$\\text{A}\\_{ij}=\\sum\\limits\\_{\\mu\\nu}\\\
  {~~cμν~~~~g}\\_{i}^{\\mu}\\{~~f}\\_{j}^{v}$(4)\n\n是所有映射信号 `f^v` 的 `j` 组件与适用于回忆或关联的响应\
  \ `gμ` 的 `i` 组件的加权和。这种形式可以通过对元素 `A[ij]` 增加每个输入 `f` 和输出 `g` 的累加来获得：\n\n`δA[ji] ~\
  \ g[i] f[i]` (5)\n\n这种 `δA[ij]` 正比于触前和触后神经元 `i` 和 `j` 实际发放率的乘积。（这是 Hebb 形式的一种实现\
  \ [8]）。对 `A` 增加此类关联 `gμ×f^v` 最终导致上一节讨论的映射。\n\n仅依赖于输入的突触修改（如在海斑中观察到的类型 [9]）足以构建一个简单的记忆——一种区分见过与未见过的记忆，但无法区分不同的输入。然而，构建上述形式的映射需要取决于神经元不同位置信息的突触修改：我们称之为双点（或多点）修改。\n\
  \n为了使这种现象发生，信息必须从例如轴突瘤传递到要修改的突触接头。这意味着神经元内部存在信息通信的手段——在上述示例中，方向与电信号流动相反（[5]）。例如，接头\
  \ `ij` 必须具有发放率 `fj`（局部可用）的信息以及发放率 `gi`（较远，[见图 3]）。一种可能是来自树突的整合电信号在细胞体中产生化学或电响应，这种响应控制轴突的激冲率，同时通过反向激冲向树突末端传递慢电位的信息。\n\
  \n![图 3. 双点修改。](img/pg48_Image_88.jpg)\n\n图 3. 双点修改。\n\n上述讨论引出了一个核心问题：什么样的局部组织原理在大规模网络中作用时，能够产生观察到的高级心理过程复杂行为？不需要假设这种机制（被认为涉及突触修改）在神经系统的所有部分或所有动物中都以完全相同的方式运行。然而，人们希望存在某些基本的相似性，使得对某个制备中该机制的详细分析可以得出具有普遍性的结论。我们关注视觉皮层，是因为在大脑这一区域进行的大量实验工作（特别是猫和猴的第\
  \ 17 区）强烈表明，人们观察到的是依赖于皮层细胞局部和全局可用信息的突触修改过程。\n\n\n\n\n上一代的实验工作——从 Hubel 和 Wiesel\
  \ 的开创性工作 \\[*10*, *11*\\]——表明，成年猫视觉皮层（第 17、18 和 19 区）中存在某些细胞，它们以精确且高度调谐的方式对外部模式产生反应——即具有特定方向并沿给定方向移动的特定条纹或边缘。随后的大量工作表明，此类皮层细胞的数量和响应特征是可以被改变的\
  \ \\*[12, 13, 14, 15*]。特别观察到的是，对视觉模式具有高度特异性响应的皮层细胞相对比例，随着动物在关键期内的视觉经历发生非常显著的变化 \\\
  *[16, 17, 18, 19*\\]。\n\n大多数幼猫在出生后第一周末首次睁眼。要评估此时纹状皮层中是否存在方向选择性细胞并非易事：此时很少有细胞对视觉产生反应，且其响应的主要特征通常是“迟钝性”和“易疲性”。然而，人们普遍的共识是，只要皮层细胞受到可靠的视觉刺激（例如在第\
  \ 2 周时），无论动物之前的视觉经历如何，某些细胞都会表现出方向选择性 \\*[17, 18, 19, 20*\\]。\n\n如果动物在正常视觉环境（NR）中饲养并自由活动，方向选择性会发育并扩展到第\
  \ 17 区的所有视觉细胞；在大约 6 周大时，会达到完全的“特异化”和正常的双眼视（约占响应性细胞的 80%） \\[*19*\\]。然而，如果动物从出生到\
  \ 6 周大都完全在黑暗中饲养（DR），则记录不到或仅记录少数方向选择性细胞（取决于作者和分类标准，在 0–15%之间）；然而，优势眼的分布似乎不受影响 \\\
  *[13,16, 17, 18, 19,21*\\]。对于出生时缝合眼睑、从而剥夺模式视觉（BD）的动物，在 6 周大时（甚至在 24 个月以后）仍有较高比例（视觉兴奋细胞的\
  \ 12–50%）具有方向选择性，且双眼细胞的比例低于正常水平 \\*[22, 23, 24, 25, 26*\\]。\n\n在所有视觉剥夺范式中，让一只眼睛相对于另一只具有优势可能产生最显著的影响。如果在“关键”时期（大约\
  \ 3 周到 12 周之间）进行单眼缝合（MD），双眼视会迅速流失，并有利于睁眼的一侧 \\*[22, 27*\\]。在这个阶段，打开闭合的眼睛并关闭有视觉经验的眼睛可能会导致优势眼的完全反转\
  \ \\*23*\\]。也可以获得不偏向任何一只眼睛的双眼视功能障碍，例如通过诱发人工斜视 \\*28*\\]或通过交替单眼遮蔽，使两只眼睛获得等量的视觉刺激\
  \ \\*29*\\]。在下来的内容中……\n\n\n\n使得第 $j$ 个突触接头 `mj` 的值随时间变化，该变化是关于准局部和时间平均局部变量 `c` 和\
  \ $\\overline{c}$，以及全局变量 `X`、`Y`、`Z` 的函数，通过函数 `φ` 以及局部变量 `dj` 的函数来实现。关键函数 `φ` 所示图\
  \ 5。\n\n具有特别意义的是 `φ` 在修改阈值 `Θ[M]` 处符号的翻转，以及 `Θ[M]` 随细胞平均输出 $\\overline{c}$ 变化的变异性（非线性变化）。在一种简单的情况下：\n\
  \n`Θ[M] = (c)²(9)`\n\n`φ` 的负区域和正区域的出现驱动了细胞在正常环境中产生选择性。这是因为细胞对模式的响应是：对于输出 `c` 低于阈值（`φ`\
  \ 为负）的模式，响应减弱；而对于输出 `c` 高于阈值（`φ` 为正）的模式，响应增强。阈值随细胞平均输出 $\\overline{c}$ 的非线性变化，使得阈值处于一个特定的位置，最终将一种模式与其他所有模式隔离开。此外，它还提供了系统的稳定性属性。\n\
  \nBCM 详细分析了这种形式修改的后果。其结果（如在接下来概述的通路分析中修改的那样）通常与我们可能认为的上一代经典实验的结果是一致的。\n\n![图 5.\
  \ BCM 修改函数。](img/pg51_Image_97.jpg)\n图 5。 BCM 修改函数。\n\n在正常环境中，神经元会变为双眼视觉选择性。在不同的环境中（例如单眼剥夺），这种行为遵循上述理论的结果。\n\
  \n为了更好地验证这些观点，必须将上述单个神经元置于具有解剖和生理学特征的网络中。对于视觉皮层，这暗示了一个网络，其中抑制性和兴奋性细胞接收来自侧膝节（LGN）以及彼此的输入。这种网络的简化形式，视觉皮层\
  \ IV 层的解剖和生理结构所示图 6]，已被 Scofield 和 Cooper 研究。在公式 (6) 的网络泛化中，我们写道：\n\n![图 6. 简化网络。](img/pg51_Image_97.jpg)\n\
  图 6。 简化网络。\n\n`c_{i} = m_{i}^{d} + \\sum_{j} L_{ij}c_{j}`\n\n其中 `L[ij]` 是皮内连接。\n\
  \nScofield 和 Cooper 对上述类似于单个神经元的网络进行了分析，表明在适当的皮内连接条件下，单眼剥夺会导致神经元趋向于双眼选择性状态。因此，这与\
  \ BCM 关于选择性的结论是一的 31]。然而，皮内连接的非零事实意味着，通过抑制性突触的单眼剥夺会导致选择性的改变。这一结果与单眼剥夺后抑制性突触作用的实验观察是一致的\
  \ 32]。这意味着，通过 GABA 抑制剂消除抑制性突触会揭示这些响应 33]。\n\n上述理论的一个意料之外的结果是选择性和优势侧主性之间的联系。BCM 扩展到平均场网络的分析表明，在单眼剥夺的情况下，非偏好输入是闭眼响应的必要部分。因此，细胞对开眼的选择性越高（增加非偏好输入），闭眼就越趋向于零，从而增加了开眼的优势侧主性\
  \ 34]。\n\n![图 7a. 选择性和优势侧主性的发育。](img/pg53_Image_100.jpg)\n图 7a。 选择性和优势侧主性的发育。\n\n\
  为了通过实验测试这些观点，确定单眼剥夺引起的优势侧主性转移*期间*发生了什么是重要的。Saul 和 Daniels (1986) 进行了一项在黑暗饲育后进行单眼视觉的实验。他们的结果证实了优势侧主性和选择性之间的预期相关性图\
  \ 7b]。\n\n![图 7b. 左眼 c ² 与右眼的选择性。](img/pg54_Image_101.jpg)\n图 7b。 左眼 `c`² 与右眼的选择性。\n\
  \n上述网络理论的一个结果是，上一代在视觉皮层获得的实验结果主要可以由侧膝节（LGN）到皮层突触的修改来解释，而皮内突触的变化极小。因此，这开启了学习主要发生在\
  \ LGN 突触的可能性。\n\n另一种被考虑一段时间的替代假设是，皮内突触在学习期间的皮层回路修改中承担了巨大责任（例如，参考文献 35）。特别，有人建议单眼剥夺导致的优势侧主性转移是由于\
  \ GABA 能神经元的活动增加，即开眼抑制了闭眼。Sillito 在正常猫中记录了视觉上无响应的细胞可以通过离子电导入 GABA 来“去掩蔽”36]。因此，推测视觉剥夺的小猫中许多无响应的细胞正被抑制是不合理的。这些数据共同暗示了一个可能的假设：在小猫纹状体中，GABA\
  \ 能神经元通过形成新突触来响应感觉剥夺。这一假设意味着，在缺乏正常丘脑输入的皮层区域，GABA 能突触的密度或强度会增加；在单眼剥夺的情况下，这些区域对应于闭眼优势侧主性柱以及剥夺眼侧的单眼段。另一方面，上述理论表明，GABA\
  \ 能神经元感觉剥夺的反应非常小。这一假设已经在最近的一系列实验中得到了测试 37]。\n\n\n\n\n为了研究 GABA 能性突触的分布，Bear 等通过免疫细胞化学法在纹状皮层中定位了\
  \ `GAD` [*37]。虽然免疫细胞化学不是一种定量测量，但他们认为，局限于剥夺眼优势区域的变化可以通过这种方法轻易检测到。作为 GABA 突触密度的定量估计，他们通过化学手段测量了纹状皮层匀浆中\
  \ `GAD` 的活性。\n\n他们在 12 只单侧移除眼球的小猫中，没有发现 `GAD` 阳性斑点分布发生变化的证据。尽管所研究的单眼剥夺期均足以引起纹状皮层发生生理性眼优势转移，但第四层斑点的条带仍然保持均匀。即使在产生代谢酶`细胞色素氧化酶`\
  \ 水平变化的条件下，`GAD` 的免疫反应性也没有改变。对 `GAD` 活性的测量显示，在去眼小猫与对照组小猫的双眼段之间，以及去眼动物的单眼段之间，均没有一致或显著的差异。\n\
  \n这一结论与网络分析惊人地一致，如前所述，网络分析表明抑制性突触对经验的修饰程度远低于兴奋性突触。除了对“学习部位”具有意义外，这种假设还为复杂网络的分析引入了重要的简化模型。\n\
  \n目前最令人兴奋的项目之一是试图寻找突触修饰的分子基础。已经提出了一种基于 `NMDA` 受体的 `BCM` 型修饰分子模型。在该模型中，`BCM` 修饰阈值被确定为\
  \ `NMDA` 受体通道的电压依赖性开启。这种识别的结果是：电压依赖性必须根据细胞活动的历史发生。\n\n用这种语言表述，许多问题变得显而易见。其中：适应新的平均发放频率需要多久？分子模型对于各种神经递质的相互作用说明了什么？我们能把修改细胞与受调节器作用的细胞连接起来吗？（例如，如果抑制性细胞修改较少，也许它们受调节器的作用也较小？）。发育期的规则是否与成人的重组规则相同？\n\
  \n关于预测的危险性，你已经受到了充分警告；现在我将大胆谈谈未来。首先想象一下，如果大脑如何运作和组织信息的问题已经解决，结果会怎样？显然，这将带来医学应用，治疗和改善各种生理和心理障碍的可能手段。此外，还将新的信息处理手段——计算机的组织。我们极有可能通过电子复制信息处理功能，使我们拥有共享我们学习能力并能够复制我们推理过程的机器。此类设备将成为我们今天所说的计算机的标准组件。\n\
  \n我猜这将逐板地发生——智能组件对传统机器的逐渐侵入——就像新皮层逐渐主导大脑一样。未来的`Aegis 战斗系统`将由这类机器主导。\n\n但这个问题在我们有生内能解决吗？当我十年前开始在这一领域工作时，人们的观点是：这是一个有趣的问题，但在我们生前无法解决。今天，时尚变了。每个人都在谈论并行处理、连接机和神经网络。十年前被视为异端并面临被处之危险的事，现在已成为公认的宗教；但仅仅改变宗教是不够的，起作用的是细节。\n\
  \n目标是构建能够学习、能够根据环境修改行为的系统——因此它们在某种程度上是自组织的。但使这些系统有效运行的架构细节本身并不是自组织的——那才是我们必须构建的。仅仅建造硬件、连接元素，并在对可能实现的目标没有真实理解的情况下观察会发生是不够的。我希望目前对该领域的热热不会因为结果没有像有时所承诺的那样快而减退。\n\
