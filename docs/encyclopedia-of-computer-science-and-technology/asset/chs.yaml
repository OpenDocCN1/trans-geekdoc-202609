  \ UCB/CSD 86/289, 1985。\n\n7. C，“UNIX 环境下的翻译缓冲区”，Computer (1988)。\n\n8. P，“页关联缓存”，Microprocessors\
  \ Microsystems (1988)。\n\n9. D，“第 13 届计算机架构国际会议”，东京, 1986。\n\n10. R，“多处理器架构的无关内存管理”，IEEE\
  \ Transact. Computers (1988)。\n\n11. J，“计算机系统架构”，Computer Science Press, Inc., 1980。\n\
  \n12. S，“高性能管理方案”，Computer (1986)。\n\n13. V，“OS/2 虚拟管理”，Byte (1988)。\n\n14. H，“将\
