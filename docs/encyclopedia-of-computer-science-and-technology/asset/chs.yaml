  \ Associates 的 `TESS` 支持 `SLAM-II` 和 `GPSS/H`\n* CACI 的 `SIMFACTORY` 为 `SIMSCRIPT\
  \ II.5` 提供图形动画\n\n## 参考文献\n\n1. [H.] B. Woolf, (ed.), Webster’s New Collegiate Dictionary,\
