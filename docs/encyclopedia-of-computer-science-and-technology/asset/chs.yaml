  \ and S. Wang, J. Mgmt. Inform. Sys., 5, 102–127 (1989).\n\n\n\n系统的常用字典定义是“一组定期相互作用或相互依赖的物品，它们形成一个统一的整体”\
  \ [`*1*]。对系统的另一种观点是，现实中的一个界定区域，我们对该区域进行关注分析，以实现某些目标。因此，系统的概念是一个相对的概念。为了我们的目的，我们将采用以下系统的定义：一组实体随时间共同相互作用，以实现一个或多个目标的集合。\n\
  \n一个`entity`（实体）是一个具有独立存在意义的对象或项目。实体的特征是一组`attributes`（属性）。实体在系统中的角色和行为是其`attributes`的函数。因此，系统的三个要求是：（1）实体，（2）实体之间的关系或交互，以及（3）对实体与其属性之间关系的了解。随后可以根据拉丁语前缀\
  \ `sub` 的含义结合之前定义的词 `systems` 来定义子系统`subsystem`）。`sub` 意味着处于下方、底下或下之下。因此，从数学术语来说，子系统是系统实体的一个不真子集，但它仍然满足系统的要求。它是包含在一个系统中的另一个系统。\n\
  \n正是基于这种系统知识，我们将对制造系统进行方法研究。用于分析的系统始终是某个更大系统的一部分，否则它不存在。\n\n### 制造系统\n\n`manufacture`（制造）一词实际上意味着“手工制造”。这与\
  \ `usufacture`（使用）——“对已制造之物的使用”，即在自然界发生的情况相反。制造更现代、更常见的含义可能是“通过组件原材料物理或化学性质的转换、改变或重构而生产的”。这里的意图是消除读者的误解，即不要认为制造过程中对旧定义中的“手工制造”要求有字面上的强制要求。相反，它的含义是作为一个与“自然发生”并列的案例出现。我们将关注制造，即涉及应用于自然发生的、加工过的或合成材料的物理和/或化学转换的过程。\n\
  \n因此，制造系统是指通过一系列过程使原材料输入在物理或化学性质上被转换、改变或重构，以生产最终产品。该系统由相互作用和相互关联的实体组成，这些实体构成了在产品转换中实现特定最终结果所需的材料转换过程。\n\
  \n制造系统存在四个层次。其中最基础的第一个是`materials transformation level`（材料转换层次）。这是机器层次，或者是材料从一种形式或状态变为另一种状态的层次。在这里，关注重点是机器、材料以及材料通过的过程。示例包括对金属零件进行加工以及通过注塑生产塑料零件。\n\
  \n制造系统的第二层次是`process control level`（过程控制层次）。在这一层次，关注重点是机器的集成及其控制，以实现制造规范。它可能涉及对过程的自动控制或计算机控制。然而，其目标是生产具有所需质量的数量产品。示例包括用于加工零件的`CNC`程序，以及确定塑料零件从模具中弹出的正确时间的控制程序。\n\
  \n过程控制的第三层次是`production planning and control level`（生产计划与控制层次）——将时间跨度以及该跨度内的生产需求整合到过程中。（注：原文此处有大量重复句，译文已按要求去重并保留核心含义）。\n\
  \n\n\n\n制造流生产车间是一种用于低单位成本、高度专业化生产以及最小物料处理成本的大规模生产设置。机器或加工设备被放置在需要的地方，以最大限度地缩短生产时间需求。理想情况下，产品从输入到最终检查的流动应该是顺畅的，人工操作和体力劳动次数最少。\n\
  \n在制造操作中，可以发现这些类型系统的各种组合。用于研究的系统可能是这些类型之一、这些类型的组合，或者是其中一种类型的子系统。现代“柔性制造系统”（或 `FMS`）试图通过通过引入制造流生产车间的许多特征和优势，来实现批量生产设施的自动化。\n\
  \n### 运筹学/管理科学方法\n\n运筹学人员或管理科学家的方法是构建一个情景的 `model` 以研究系统。模型有多种类型。其中包括形象模型、类比模型和符号模型。构建模型是为了表示真实世界系统中的实体或实体组及其相互作用。构建模型以表示某种情况的过程被称为\
  \ `modeling`（建模）。\n\n模型捕捉其所代表的真实世界情况本质的程度被称为模型的 `fidelity`（保真度）。低保真度（低真实）模型是指与其真实对应物不准确的表示。相反，“高保真”一词在录音领域已长期使用，指的是模型所构建表示的情景的高质量再现。低保真度的模型被称为抽象模型。同样，低抽象程度的模型具有良好保真度的模型。\n\
  \n如果一个模型具有良好的保真度，则被认为是有效的。在复杂模型中，可能具有良好的组件保真度，但在建模的相互作用中存在错误。在这种情况下，系统模型是非有效的。验证（validation）的过程是检查模型及其相互作用组件，以确定它们结合起来提供了对现实的准确表示。这一过程通常涉及仿真模型。简单的符号模型很少需要验证。在仿真中，这种验证可以涉及程序测试、生成的随机变量测试、主观模型验证以及历史验证。\n\
  \n#### 制造中系统建模的价值\n\n模型是某个抽象水平上真实情景的表示。如果模型在建模者关心的主要领域是准确的表示，它就能提供有价值的信息。使用模型允许随意愿地以任何所需的方式改变所建模的情景，以评估各种变化的影响。此类变化会扰乱真实世界。它们会遇到相关人员的抵抗，因为这些人员感到变化构成了威胁。许多变化将极其昂贵，以在大多数情况下这种成本是不可接受的。通过模型，变化可以在人员不产生抵抗的情况下以非常合理的成本进行。所进行的研究可以用于开发单一的变化程序或模式，以获得所需的结果。在开发该目标并获得管理层对其实施的同意后，可以实施单一的变化程序。这可以减少系统演变中最昂贵的部分，即通过研究变化的影响来确定应该进行哪些变化。\n\
  \n用于研究的系统建模程序是非常效益的。这种有效性源于通过建模过程以相对较低成本定义程序、步骤或政策，从提高系统性能中节省成本。它还大大减少了评估建议变化的影响所需的时间，因为计算机研究通常比对真实系统进行实验需要短得的时间。\n\
  \n#### 仿真作为 OR/MS 方法的工具\n\n仿真（Simulation）意味着“使类似于”。它被定义为开发系统的数学—逻辑模型，并在数字计算机上对模型进行实验性操作。该定义中提到了仿真的两个基本步骤：(1)\
  \ 模型开发和(2) 实验。模型开发涉及构建系统的数学—逻辑表示，并准备计算机程序以允许模型模拟系统的行为。一旦我们有了系统的有效模型，仿真研究的第二阶段就会发生；即对模型进行\
  \ `experimentation`（实验），以确定系统对输入变量变化的响应。\n\n模型是选择选择来捕捉研究系统的重要特征的手段。模型必须具有系统实体的表示，并反映这些实体参与的活动。\n\
  \n1. 问题定义：解决的问题的陈述。这包括对所研究系统的概括描述和边界的初步定义。\n2. 设定目标：通过仿真研究要回答的问题。这一步允许对系统及其边界进行进一步定义。\n\
  3. 模型构建：根据系统实体、每个实体的属性或特征、这些实体参与的活动以及系统可能处于的状态来捕捉系统基本特征的过程。\n4. 数据收集：收集允许建模者开发每个实体基本描述的数据信息，并为重要的系统参数开发概率分布。\n\
  5. 编码：将系统模型翻译成可在处理器上执行的计算机程序的过程。\n6. 验证：确保计算机程序运行正常的过程。\n7. 确认：通过将模型行为与可以观察的真实系统比较，确定模型模仿真实系统，并修改模型以提高其表示真实系统的能力。验证和确认的结合对于建立模型的可信度至关重要，以便根据仿真研究得出的系统决策能够得到可靠支持。\n\
  8. 实验设计：确定可以通过仿真评估的替代方案，选择重要的输入变量及其适当的水平，选择仿真运行的长度和重复次数。\n9. 生产运行与分析：评估所选输入变量对所选系统性能指标的影响，并确定是否需要更多运行。\n\
  10. 仿真报告：记录仿真程序，报告仿真研究的结果，并根据仿真研究对真实系统提出建议。这些建议的实施通常是组织中相应经理决策的结果。\n\n无论仿真建模工作的应用背景如何，都应该遵循这种方法。Law\
  \ 特别描述了这种方法在制造系统中的应用。\n\n\n\n\n\n系统模拟有几种常见的方法或取向。这些方法涉及对被模拟系统的观察方式。第一种取向是**事件类型**。这种方法模拟了当事件发生时系统发生的变化。建模者定义了系统中发生的事件以及随这些事件发生的变化。\n\
  \n**活动扫描取向**方法涉及描述系统实体参与的活动，并规定活动开始和结束的先决条件。这种技术主要用于连续系统模拟。\n\n**过程取向**方法涉及与特定类别实体相关的活动、延迟和事件的顺序。需要开发逻辑来处理这些活动模式。该逻辑在高级别的仿真语言中通过单个语句进行定义。然后，可以重新排列这些不同的语句，以模拟实体通过所表系统的移动。\n\
  \n现在既然我们已经介绍了系统、制造系统和仿真建模的基本概念，我们将转向模拟制造系统可以采用的方法。\n\n## 制造系统的仿真\n\n制造系统模拟模型的开发始于选择一种合适的语言，将概念模型翻译到该语言中。尽管目前已经有了许多功能强大的仿真语言，甚至有针对制造的高度专门的“现成”仿真程序，但到目前为止，大多数仿真都是使用\
  \ `FORTRAN` 或 `PASCAL` 等高级通用语言开发的。本节描述了开发制造系统仿真模型涉及的基本概念，并讨论了用于实现这些概念的一些通用语言和专用语言。\n\
  \n### 开发制造系统模型\n\n上一节讨论了系统和系统模型概念。在概念模型翻译成仿真程序之前，必须采用给定的“世界观”。本节描述了一个通用的仿真建模概念，该概念适用于这里将讨论的大多数语言，但使用了通常与制造系统相关的术语来表述这些原则。\n\
  \n> **系统**：一组实体的集合（例如，机器、工件、操作员等），它们随着时间的推移相互作用，以实现一个或多个目标。\n\n> **模型**：系统的抽象表示，通常包含数学和/或逻辑关系，通过状态、实体及其属性、资源、集合、事件、活动、延迟和过程来描述系统。\n\
  \n> **系统状态**：变量的集合，包含了描述系统在任何时刻所需的信息（例如，系统中每台机器的运行状态）。\n\n> **实体**：系统中任何在模型中需要显式表示的物体或组件（例如，机器、工件、操作员、维修工）。\n\
  \n> **属性**：给定实体的属性（例如，给定工单的优先级、工件进入系统的时间、零件的质量状态）。\n\n> **资源**：一类特殊的实体，为主要实体提供某种形式的服务（例如，机器或维修维修工）。\n\
  \n> **集合**：一组关联实体的集合，按照某种逻辑方式排序（例如，机器处的工件队列）。\n\n> **事件**：改变系统状态的瞬时发生事件（例如，一批工件到达机器，或机器故障）。\n\
  \n> **活动**：一段指定长度的持续时间，其持续时间在活动开始时是已知的（例如，机器的故障时间、故障机器的修理时间）。\n\n> **延迟**：一段未知长度的持续时间，其仅在延迟结束时才已知（例如，工件在队列中等待服务的时间）。\n\
  \n> **过程**：主要实体在穿过系统时遇到的活动、延迟和事件的顺序（例如，工件穿过柔性制造单元的过程）。\n\n这里区分了“主要实体”和“资源”。主要实体是代表制造系统目标的实体，如工件或装配体。资源是对主要实体或其他资源执行动作的实体。例如，机器（资源）对工件（主要实体）执行操作。\n\
  \n维修工（资源）修理故障的机器（资源）。某些仿真语言（如 `GASP-IV`）没有这种主要实体和资源之间的区分，将它们都归类为“实体”。然而，`SIMAN`\
  \ 就是需要这种区分的语言示例。\n\n### 仿真语言\n\n用于仿真的基本语言分为高级语言（`FORTRAN`、`PASCAL`等）、通用仿真语言（`GASP-IV`、`SLAM-II`、`SIMAN`等）以及专用仿真程序（`PASAMS`、`XCELL`等）。本节将讨论这些语言在仿真建模中的作用。\n\
  \n### 高级语言\n\n可以认为，在高级编程语言中开发的计算机仿真模型多于任何其他类型的仿真工具。`FORTRAN` 在早期大型机上的广泛应用使其成为所有编码仿真模型中最流行的语言之一。\n\
  \n高级语言是一种看起来更像人类语言而非机器语言的计算机语言，设计用于许多不同类型的计算机。高级语言使用编译器将其翻译成机器语言。机器语言对于其所设计的计算机是唯一的。在高级语言中编写由一组指令组成的程序，通过编译产生相应的机器语言指令，并在计算机上执行。高级语言的示例包括\
  \ `FORTRAN`、`PASCAL`、`BASIC` 和 `C`。\n\n`FORTRAN` 是 `FORmula TRANslator`（公式翻译器）的缩写，它是为了主要使用计算机进行大型数值计算的科学家和工程师的需求设计的。作为第一种商用高级语言，`FORTRAN`\
  \ 仍然是编程语言中最知名且应用最广泛的。目前的标准 FORTRAN 语言是 `FORTRAN 77`，它在文档 `ANSI X3.9–1978` 中进行了描述。\n\
  \n\n\n\n\n关于仿真的早期经典处理方法是由 Tocher [*10`] 的。McMillan 和 Gonzalez `*11`] 在另一部处理决策模型计算机方法的经典著作中，阐述了使用\
  \ `FORTRAN` 进行仿真建模的方法。Schmidt 和 Taylor [*12`]] 描述了如何在 `FORTRAN` 中对所有关键仿真函数进行编码，并展示了其在排队、库存控制、可靠性和维护等标准工业工程应用中的用途。作为一个用\
  \ `FORTRAN` 开发的制造仿真模型示例，Savsar 和 Biles [*13`]] 提供了一个包含 600 行的程序，用于自动化生产流水线模型。该模型允许用户输入一组描述所研究生产线的数据，模拟系统直到满足选定的统计标准，并获得提供特定生产力改进建议的输出。它在评估生产线沿存储能力以及维护策略对生产吞吐量的影响时特别有用。\n\
  \n`PASCAL` 是一种高级编程语言，其开发目标是高度结构化、易于阅读且尽可能无歧义。它主要旨在作为教学语言，一种在任何计算机上都廉廉且易于实现的真正标准语言。`PASCAL`\
  \ 在微型计算机开发早期的主要优势是它需要的内存比 `FORTRAN` 少，因此可以在 64K 内存机器上运行。Vasudev 和 Biles [*14`]]\
  \ 描述了一种以 `PASCAL` 为基础语言的通用微型计算机仿真语言。这项开发的主要目的是实现在小内存微型计算机上的仿真建模，随着大内存（512K 及以上）成本下降，这一目标已变得不那么重要。Biles\
  \ 和 Bathina [*6`]] 开发了 `PASAMS`，这是一种基于 `PASCAL` 的自动化制造系统仿真模型，它允许用户从输入数据中完全描述制造配置，模拟特定期间的生产，并获得显示选决策变量对生产吞吐量和机器利用率影响的输出。此类仿真程序的一个重要特性是它允许用户在设置灵活制造单元时评估替代的物料处理方案。这种评估可以在下一批生产单元设置之初几乎实时地进行。\n\
  \n20 世纪 70 年代末由贝尔实验室开发的操作系统 `UNIX` 的出现，也极大地促进了 `C` 作为一种高级语言的地位 [*15`]]。`C` 语言因为是贝尔实验室开发的两种较早语言\
  \ `A` 和 `B` 的继者而得名，它是 `UNIX` 编写编码的基础语言，因此在那些使用 `UNIX` 作为操作语言的计算机上应用时具有优势。`C` 是 8\
  \ 位计算机的自然选择，因为它比其他高级语言需要的机器语言指令集要小得多，但在较大的计算机上也找到了许多应用。\n\n`BASIC`（初学者通用符号代码）是另一个自微型计算机出现以来受到青睐的高级语言示例。`BASIC`\
  \ 主要作为教学工具开发，简单且易于学习。\n\n尽管高级语言在科学领域被广泛使用，但它们在运行时间方面存在若干缺点。`UNIX` 的出现也促进了 `C`。下一节将探讨这些提供了仿真所需所有标准设施的通用语言。\n\
  \n### 通用语言\n\n最著名的通用语言有 `GASP-IV`、`SIMSCRIPT`、`GPSS`、`SLAM` 和 `SIMAN`。\n\n`GASP-IV`\
  \ [*3`]] 是一组 `FORTRAN` 子程序，旨在方便使用 `FORTRAN` 进行事件调度方法的建模。它由 30 多个子程序组成，涵盖了仿真所需的所有设施。程序员必须提供一个主程序、一个初始化例程、事件例程，以及如果需要的话，一个针对特定问题的报告。程序员的一项基本要求是提供名为\
  \ `EVNTS` 的子程序，它将程序控制引导到特定的事件子程序，提供与状态变化相应的逻辑。主程序必须包含 `CALL GASP` 语句来启动仿真。`GASP`\
  \ 子程序确定事件日历中的下一个事件，并使用索引 `NEXT` 调用 `EVNTS` 以指定即将发生的事件。`GASP-IV` 不仅允许离散事件建模，还允许连续和组合建模。后提到的\
  \ `SLAM-II` 保留了 `GASP-IV` 的所有建模特性。\n\n`SIMSCRIPT II.5` [*16`]] 是一种通用仿真语言，其提供的设施专门用于辅助开发离散事件仿真模型。作为一种仿真语言，它允许事件调度或过程交互视角。作为一种科学语言，它的功能至少与\
  \ `FORTRAN`、`PL/1`、`ALGOL` 或 `PASCAL` 相当。在 `SIMSCRIPT` 中完成许多编程任务比在 `FORTRAN` 中更高效（即程序员的时间更少）。`SIMSCRIPT`\
  \ 程序可以使用类英语的语句以自由格式风格编写；这种程序几乎是自文档的，可以很容易地向非程序员人员解释。与 `GASP-IV` 一样，`SIMSCRIPT` 提供自动维护未来事件列表和时间推进/事件调度算法、自动维护集合（包括从集合中添加和删除实体的操作）、自动收集请求的统计数据以及随机数和随机变量生成。\n\
  \n\n\n\n\nSIMSCRIPT II.5 的世界观基于实体（entities）、属性（attributes）和集合（sets）。实体被分为永久和临时两种。永久实体代表系统中在整个仿真期间将留在系统中的对象。例如制造单元模型中固定数量的机器，或物料处理模型中固定数量的输运工具。临时实体代表某些对象，例如制造模型中的工件，它们“到达”系统，停留一段时间，然后“离开”系统。模型中活跃的临时实体数量在仿真过程中可能会发生显著变化。实体可以具有属性，关联实体可以属于某个集合。\n\
  \n一个 SIMSCRIPT 程序由序言（preamble）、主程序、事件例程和普通子程序组成。如所述，时间推进例程、随机数生成例程和统计收集例程是自动提供的。序言通过定义所有实体及其属性以及它们可能所属的集合对系统进行静态描述。它还定义了全局变量（用于部分定义系统状态），并列出了要在某些变量上收集的统计数据。大量的变量会被自动维护。例如，`TIME.V`\
  \ 代表仿真时钟。如果 `QUEUE` 是一个集合的名字，`N.QUEUE` 就是集合中的实体数量。主程序读取输入参数的值，初始化系统状态并产生第一个事件。事件例程由时间推进子程序自动调用，而该子程序又由主程序中的\
  \ `START SIMULATION` 语句激活。普通子程序可以从任何事件例程或主程序调用。\n\n### GPSS\n\nGPSS [17] 是一种高度结构化的特殊用途仿真语言，使用过程交互方法。它面向排队仿真。通过框图提供了系统描述。被称为“事务”（transactions）的临时实体会被创建，并可以被形象地描绘为流经框图。因此，GPSS\
  \ 可用于任何实体（例如工件）可以被视为通过系统（例如队列网络）的情况。GPSS 并不是像 FORTRAN 或 SIMSCRIPT 那样的过程化语言；它是一种用于描述某些特定类型系统的结构化方法。随后，GPSS\
  \ 处理器获取此描述（即：框图）并自动执行仿真。时间推进/事件调度机制对用户是透明的。\n\nGPSS（通用目的仿真系统）最初由 IBM 的 Geoffrey\
  \ Gordon 在大约 1960 年开发。大多数大型计算机系统都有某种形式的 GPSS。可以在 Schriber [17] 中找到 GPSS 的介绍。最新且最强大的\
  \ GPSS 实现版本 GPSS/H 是由 Wolverine Software（Falls Church, VA）的 Henriksen [18] 开发的。\n\
  \n自 20 世纪 60 年代以来，GPSS 可能是世界上最广泛的离散事件仿真语言。这种受欢迎的原因有两个：语言易学以及构建复杂模型所需的时间较短。另一方面，GPSS\
  \ 也有一些缺点，其中某些可能导致程序员在无意中开发出无效的模型。GPSS/H 消除了大部分这些缺点。\n\nGPSS 的两个主要概念是事务（transactions）和块（blocks）。一个\
  \ `block` 可以用图形符号或 GPSS 语言中的单个语句表示。GPSS 中有 40 多个标准块。每个块代表典型系统中可能发生的特定操作或事件。这些块被排列成一个表示过程的框图。代表活跃动态实体的\
  \ `Transactions` 可能会被形象地描绘为流经框图。事务通过系统所需的每条路径都必须在框图中表示，而框图可以有分支。系统的有限资源由预定义的 GPSS\
  \ 实体（设施和存储）表示。`facility` 本质上是一个单个服务器，`storage`是一组并行服务器。会自动收集设施和存储的统计数据。\n\n### 示例\n\
  \n以下示例自 Schriber [17]，说明了 GPSS 应用于单线单服务排队系统。工件被发送到钻床，工件到达钻床的间隔时间分布在 `15.0 ± 4.5`\
  \ 分钟。钻一个工件所需的时间也分布在 `13.5 ± 3.0` 分钟。工件按先来服务的顺序处理。该系统在 GPSS 中建模，收集三个输出变量：(a) 处理 100\
  \ 个工件的时间；(b) 线中的平均工件数；(c) 在线上的平均时间。\n\n图 1 显示了该模型的框图。图 2 展示了 GPSS 模型文件，它将框图转换为处理器可理解的语句。图\
  \ 3 显示了处理 100 个工件的选仿真输出。\n\n表 1 单线单服务模型八次独立重复的统计摘要。\n\n| | | 等待钻床的工件 |\n| --- |\
  \ --- | --- |\n| 重复次数 | 处理 100 个工件的时间 | 平均等待数量 | 平均等待时间 |\n| 1 | 1489.0 | 0.215\
  \ | 3.172 |\n| 2 | 1544.7 | 0.130 | 1.995 |\n| 3 | 1488.6 | 0.193 | 2.851 |\n| 4\
  \ | 1522.8 | 0.064 | 0.970 |\n| 5 | 1507.8 | 0.199 | 3.001 |\n| 6 | 1527.5 | 0.110\
  \ | 1.667 |\n| 7 | 1561.2 | 0.049 | 0.770 |\n| 8 | 1503.0 | 0.152 | 2.259 |\n| 平均值\
  \ | 1518.1 | 0.139 | 2.090 |\n| 标准差 | 2597.0 | 0.062 | 0.910 |\n\n表 2 由表 1 重复得出的\
  \ 90%置信区间。\n\n| | | 等待钻床的工件 |\n| --- | --- | --- | --- |\n| 处理 100 个工件的时间 | 平均等待数量\
  \ | 平均等待时间 |\n| [1499.5, 1536.7] | [0.094, 0.184] | [1.434, 2.737] |\n\n\n\n\n\n\
  # SLAM-II\n\nSLAM-II \\[*5*\\] 是一种基于 FORTRAN 的通用仿真语言，它允许事件调度导向、过程交互导向，或者两者的结合。SLAM-II\
  \ 的事件调度部分与之前描述的 GASP-IV 非常相似。SLAM-II 的过程交互部分在许多方面与 GPSS 相似。本节简要描述 SLAM-II 的过程交互部分，该软件由\
  \ Pritsker and Associates, Inc.（印第纳州西拉法叶）营销。\n\n要使用 SLAM-II 的过程交互方法，分析人员需要开发一个由节点和分支组成的网络，代表系统中的过程。在系统中流动的对象被称为实体（entities）。SLAM-II\
  \ 对实体的定义类似于 GPSS 事务（transaction）。这些实体是动态的；它们流过一个过程。请记住，过程是实体在流过系统时所面临的一系列事件和活动。系统的完整\
  \ SLAM-II 网络模型代表了实体通过系统时可能采取的所有路径。要运行该模型，仿真器会将网络表示直接翻译成计算机语句，并输入到 SLAM-II 处理器。SLAM-II\
  \ 会自动处理事件调度、时间推进算法、文件操作（如实体的添加和删除）、大量统计收集以及随机样本生成。通过其自动文件处理功能，SLAM-II 可以轻松管理基于 FIFO（先进先出）或\
  \ LEFO（后先进出）的队列，也可以根据某些属性（如优先级）对实体进行排序和处理。与 GPSS 不同，SLAM-II 内置了用于各种统计分布的随机变量生成器。\n\
  \n## 网络结构\n\n一个 SLAM-II 网络由分支和节点组成。分支代表时间的流逝；即它代表一种活动。此外，一个分支也可以代表有限数量的服务器。分支被编码为\
  \ `ACTIVITY` 语句。节点用于表示到达事件（`CREATE`节点）、延迟或条件等待（`QUEUE`节点）、离开事件（`TERMINATE` 节点）以及其他典型的系统动作。\n\
  \n## 案例研究\n\n以下问题来自 Pritsker \\[*5*\\]，说明了 SLAM-II 的仿真建模方法。组装好的电视机在生产最后阶段通过一系列测试站。在这些站点中的最后一个，会对比电视机的垂直控制设置进行测试。如果发现设置功能不正常，电视机将被路由到调整站进行必要的调整。调整后，电视机将循环回到上一个检查站再次进行检查。通过最终检查的电视机将被路由到包装区域。图\
  \ 4 是检查/调整过程的示意图。\n\n![FIGURE 4 电视机检查/调整模型示意图（来自文献 57）。](img/pg253_Image_174.jpg)\n\
  \nFIGURE 4 电视机检查/调整模型示意图（来自文献 57）。\n\n图 5 显示了对应电视检查调整过程的 SLAM-II 网络。第一个节点是 `CREATE`节点，模拟了电视机到达最终检查站的到达。到达间隔时间在\
  \ 3.5 到 7.5 分钟之间均匀分布。标记为 `INSP` 的节点是 `QUEUE`节点，用于存放等待检查的电视机。从 `INSP` `QUEUE`节点发出的分支代表检查活动。如标记所示，活动\
  \ 1 具有 2 个并行服务器，每个服务器根据 6.0 到 12.0 分钟之间的均匀分布进行检查。当两个服务器都忙时，到达 `INSP` `QUEUE`节点的实体被存储在文件\
  \ 1 中，如 `QUEUE`节点符号上的数字 1 所示。检查后，实体移动到 `GOON`节点，在那里根据概率路由到调整处（0.15 的概率）或包装处（0.85\
  \ 的概率）。去往调整处的实体移动到 `ADJT` `QUEUE`节点。调整活动是活动 2，其在 20.0 到 40.0 分钟之间均匀分布，实体被路由回 `INSP`\
  \ `QUEUE`节点。活动 2 由单个服务器执行。路由到包装的实体移动到 `COLCT`节点，该节点收集实体在系统中花费的统计数据。图 6 给出了电视检查调整的网络语句。图\
  \ 7 提供了了此的摘要报告。\n\n![FIGURE 4 电视机检查/调整模型示意图（来自文献 57）。](img/pg253_Image_174.jpg)\n\
  \nFIGURE 4 电视机检查/调整模型示意图（来自文献 57）。\n\n![FIGURE 5 电视检查调整过程网络（来自文献 57）。](img/pg255_Image_178)\n\
  \nFIGURE 5 电视检查调整过程网络（来自文献 57）。\n\n![FIGURE 6 电视检查调整的网络语句（来自文献 57）。](img/pg255_Image_179)\n\
  \nFIGURE 6 电视检查调整的网络语句（来自文献 57）。\n\n![FIGURE 7 电视检查调整过程的摘要报告（来自文献 57）。](img/pg256_Image_180)\n\
  \nFIGURE 7 电视检查调整过程的摘要报告（来自文献 57）。\n\n## SIMAN 概述\n\nSIMAN 是一种用于通用系统的离散/连续仿真语言，尽管它被设计为特别适用于制造系统。SIMAN\
  \ 的一个特点是它区分了系统模型框架和实验框架。系统模型框架定义了系统的静态动态特性。相比之下，实验框架定义了运行模型以生成特定输出数据的实验条件。\n\nSIMAN\
  \ 的主要建模导向是过程视图，通过构建框图来描述实体在系统中移动时遇到的队列、活动和延迟。如果使用事件导向，则使用一组 FORTRAN 子程序来增强或替换框图。\n\
  \n\n\n\n当将钢锭放入炉中时，炉温的降低量为炉温与钢锭温度之差，再除以炉内钢锭的数量。该炉子根据以下微分方程进行加热：\n\n$\\overset{\\\
  dot}{F} = \\left( 2600 - F \\right) \\times 2$\n\n其中 `F` 是炉温。钢锭在炉内加热过程中的温度变化由以下微分方程描述：\n\
  \n${\\overset{\\dot}{P}}\\_{j} = {\\left( F - P\\_{j} \\right){xh}\\}_{j}}$\n\n\
  其中 `P[j]` 是第 $j$ 个坑位内钢锭的温度。符号 $\\overset{\\dot}{F}$ 和 `P[j]` 分别代表时间导数 $dF/dt$ 和\
  \ $dP[j]/dt$。\n\n变量 `h[j]` 是第 $j$ 个坑位内钢锭的加热系数，等于 1 加上一个均值为 .05、标准差为 .01 的正态分布样本。\n\
  \n钢锭在炉中持续被加热，直到最热的钢锭温度达到 2200 °F。然后，取出所有温度大于 2000°F 的钢锭。\n\n该系统模拟了 100 小时，以确定炉的利用率、钢锭的加热时间、炉温以及冷库中钢锭的数量。初始炉温为\
  \ 1100°F。\n\n此示例使用 SIMAN 的离散/连续组合特征进行建模。钢锭在系统中的流动使用框图建模，而钢锭温度和炉温度被建模为连续状态变量。\n\n\
  我们通过在问题变量与 SIMAN 数组 `S` 和 `D` 元素之间建立等效关系，开始开发模型的连续组件。我们令 `S(J)`（其中 `J` 等于 1 到 10）代表第\
  \ $y$ 个坑位内钢锭的温度，值为 0 表示该坑位为空。炉温由 `S(l1)` 表示，变量 `S(12)` 是最热钢锭的温度。这些变量总结如下：\n\n$\\\
  begin{matrix} {S{\\left( J \\right) = P\\_{j}}} & {j = 1,...,10} \\\\ {D\\left(\
  \ J \\right) = {\\overset{\\dot}{P}}\\_{j}} & {j = 1,...,10} \\\\ {S\\left( 11 \\\
  right) = F} & \\\\\\\\ {D\\left( 11 \\right)\\overset{\\dot}{F}} & \\\\\\\\ {S\\\
  left( 12 \\right) = \\underset{j}{\\max}P\\_{j}} & {j = 1,...,10} \\\\ {X\\left(\
  \ J \\right) = h\\_{j}} & {J = 1,...,10} \\\\ \\end{matrix}$\n\n此示例的子程序 `STATE`如图图\
  \ 8 所示。初始情况下，`S(12)` 设置为 0.0。在 `DO` 循环中，会对每个钢锭的温度与 `S(12)` 进行比较，在每个温度超过 `S(12)`\
  \ 的情况下，`S(12)` 被重置为该钢锭的温度。通过这种方式，`S(12)` 将返回最大钢锭温度。`DO` 循环的最后一条语句计算每个钢锭温度的变化率。在\
  \ `DO` 循环之后，计算炉温的变化率。\n\n![FIGURE 8 浸式炉模型 SLMAN 模型的 STATE 子程序（来自文献 4）](img/pg258_Image_182)\n\
  FIGURE 8 浸式炉模型 SLMAN 模型的 STATE 子程序（来自文献 4）。\n\n框图列表如图图 9 所示。离散模型由两个部分组成，将分别描述。第一部分中的实体代表流经系统的钢锭。钢锭在\
  \ `CREATE` 模块中生成，其到达系统的时间被标记在属性 1 中。钢锭在 `QUEUE` 模块中于文件 1 等待一个容量为 10 的单位资源 `PIT`。一旦钢锭占用了\
  \ `PIT`，将使用 `FIND` 模块确定可用坑位的索引，通过测试 `X(J)` 是否等于零（这表示坑位 `J` 是空的）来进行判断。随后将 `X(J)`\
  \ 设置为钢锭的加热系数，并为 `S(J)` 分配钢锭的初始温度。接着在 `BRANCH` 模块进行测试，以判断钢锭是否在冷库中等待过。如果当前时间 `TNOW`\
  \ 大于 `A(l)`，则说明钢锭在冷库中等待过，因此分支到模块 `COLDBANK`，在该模块钢锭温度被重置为 40，并在当前时间标记属性 1。无论何种情况，钢锭到达标记为\
  \ `FURNACE` 的 `ASSIGN` 模块，此处炉温 `S(l1)` 将根据炉温与钢锭温度之差除以炉内钢锭的数量而降低。钢钢锭进入 `QUEUE` 模块，在文件\
  \ 2 中等待直到接收信号 `J`。接收信号 `J` 后，释放 `PIT`。\n\n![FIGURE 9 浸式炉模型 SIMAN 模型的框列表（来自文献 4）](img/pg258_Image_183)\n\
  FIGURE 9 浸式炉模型 SIMAN 模型的框列表（来自文献 4）。\n\n第二个模型部分监控钢锭温度，并通过 `WAIT` 模块从炉中释放钢锭。`DETECT`\
  \ 模块监控钢锭温度何时达到 2200 °F。随后对索引 `J` 从 1 到 10 进行搜索，释放所有温度大于 2000°F 的钢锭。对于每个释放的钢锭，实体分支到标记为\
  \ `RELEASE` 的 `SIGNAL` 模块，发送信号以结束 `WAIT` 操作，并将坑 `J` 的加热系数设置为 0。为了表示坑位为空，`S(J)` 被设置为\
  \ 0。此示例的实验如图图 10 所示。`CONTINUOUS` 元素规定模型使用 11 个微分方程和 1 个状态方程。根据此规范，SIMAN 随时间解释 `D(l)`\
  \ 到 `D(l1)` 的值，以获取 `S(l)` 到 `S(ll)` 的值。\n\n![FIGURE 10](img/pg259_Image_184)\nFIGURE\
  \ 10\n\n此示例的 SIMAN 摘要报告如图 11 所示。在 100 小时的模拟期间，有 30 个钢锭完成了处理，平均加热时间为 19.36 小时。在此期间，平均炉利用率为\
  \ 7.2，冷库队列中最多有 5 个钢锭。平均炉温为 2012°F。\n\n![FIGURE 11 浸式炉模型 SIMAN 摘要报告（来自文献 4）](img/pg260_Image_185)\n\
  FIGURE 11 浸式炉模型 SIMAN 摘要报告（来自文献 4）。\n\n### 专用仿真语言\n\n除了 FORTRAN、PASCAL、BASIC 和 C\
  \ 等高级编程语言，以及通用仿真语言如 GASP-IV、GPSS、SIMSCRIPT II.5、SLAM-II 和 SIMAN 之外，还有许多高度专用的仿真产品允许用户对制造系统进行建模。Biles\
  \ 和 Bathina [*6]] 描述了 PASAMS，一种基于 PASCAL 的灵活制造系统计算机仿真模型。PASAMS 是一个紧凑的程序，非常适用于微机。用户与程序交互以开发并仿真包含机器、机器人、输送带、自动引导车辆\
  \ (AGV)、工件和组装的模型。用户无需承担学习编程语言或仿真语言的任务，而是根据真实组件来描述系统。这种高度专用的方法的缺点是无法轻易应用于其他类型的系统。\n\
  \n\n\n\nXCELL+ 是另一种用于制造系统建模的高度专业化方法。它结合了计算机图形和菜单驱动的数据输入系统。如[图 12]所示，XCELL+ 高度依赖制造系统的原理图图形模型。它使用符号图形而非写实图像图形，但利用颜色来增加一次性有效显示的信息量。\n\
