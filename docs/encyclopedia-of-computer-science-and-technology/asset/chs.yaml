  \ `14f` 中，歧义的来源不同：男人进入了一个房间，而不是其他地方。\n\n有时在处理文本时，很难或无法唤起标准的脚本，甚至是更通用的记忆组织包（MOP），来将文本与过去经验中的典型设置和事件联系起来。但如果只需确定文本所属的子世界，将会有巨大的帮助。因此，(16)\
  \ [9*] 将根据文本属于监狱还是拳击子世界，以两种截然不同的方式进行翻译。当然，自动检测子世界并不是一项容易的任务。\n\n```\nRocky 慢慢从垫子上站起来，计划逃跑。他停顿了一下。情况不太好。最困扰他的是被关起来，因为对他的指控很弱。他考虑了自己的处境。锁很固，但他认为自己可以打破它。\n\
