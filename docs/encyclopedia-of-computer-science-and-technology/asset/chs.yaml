  \ NIRENBURG**\n\n# 磁磁盘\n\nDOI: [10.1201/9780367811495-9](https://doi.org/10.1201/9780367811495-9)\n\
  \n## 引言\n\n在信息处理领域，主要使用两种介质进行磁存储：纵向移动的磁带和旋转磁磁盘。它们的前身是磁鼓（即旋转圆柱体）。磁磁盘（与磁带相比）的优势在于访问时间短且存储容量高。未来，另一类旋转介质将变得更加重要：光盘和磁光盘（可擦写和不可擦写）。\n\
  \n### 分类\n\n### 共同属性\n\n所有类型的磁磁盘和驱动器共有的属性如下：\n\n> 磁盘是平整的圆盘（硬性或柔性），两面涂有磁化层，该层具有各种属性（涂层厚度、矫顽力、润滑）。\n\
  \n> 记录是在同心磁道上进行的，这与只有一条螺旋线形“磁道”的胶片不同。磁道数量是指示容量的重要参数，其变化范围很大。另一个常用但重要性较低的参数是磁道密度（即单位半径长度磁道数），以每毫米磁道（`tpmm`）或每英寸磁道（`tpi`）表示。\n\
  \n> 每个磁道都有一个编号。对于硬磁盘，磁头悬浮在表面上方。对于软盘，磁头与表面接触。磁盘两侧半径相同的一对磁道称为圆柱体。\n\n> 每个磁道被划分为若干扇区。驱动器的主要特征之一是访问时间。这是从请求数据开始到数据可用瞬间之间的时间。\n\
  \n### 属性属性\n\n磁磁盘在几个方面存在差异：\n\n| 方面 | 描述 |\n| :--- | :--- |\n| 结构 | 硬磁盘或软磁盘 |\n\
  | 尺寸 | 各种直径 |\n| 配置 | 单盘；卡匣；磁盘组 |\n| 运行 | 可移动磁盘；不可移动、固定磁盘 |\n| 存储容量 | 格式化容量；未格式化容量\
  \ |\n| 标准化 | 标准化；非标准化 |\n\n## 结构\n\n“经典”类型的硬磁盘是磁头悬浮在表面上方的。正常运行期间的飞行高度约为 `2 μm`（`80\
  \ in`），这是相对于磁头而言的。\n\n对平整和其他属性有非常严格的要求。即使是微小的灰尘颗粒也会导致“头撞”，这通常不仅损坏磁头还会损坏表面。当这种情况发生时，磁盘将无法使用，数据可能会丢失。第二种硬磁盘是\
  \ 1973 年左右引入的“威士磁盘”（Winchester disk）。这些磁盘的表面经过润滑处理。涂层中润滑剂允许磁头在起飞和降陆期间与磁盘接触。飞行高度为\
  \ `0.4 μm`（`16 in`），与经典类型相比小得多。因此，威士磁盘对灰尘非常敏感，必须通过外壳密封来防止污染。这些磁盘被广泛应用于个人计算机等。\n\n\
  软磁盘有多个名称。标准化中使用的“官方”名称是`柔性磁盘卡匣`（`FDC`）。除了`floppy disk`（软盘）之外，`diskette`一词在近几年变得越来越流行。普通软盘在接触状态下工作，即一个或两个磁头直接与介质接触。良好的头-磁盘接触是正确读写操作的重要前提。比较两种头-介质条件（硬磁盘的悬浮磁头与软盘的接触磁头），可以得出结论：接触意味着摩擦，会导致磁头和/或表面的磨损，因此磁头和软盘的寿命有限。悬浮磁头并非如此，其介质寿命理论上是无限的。因此，硬磁盘更可靠。\n\
  \n## 运行\n\n磁磁盘可以采用不同的配置。单盘主要作为固定磁盘使用；此类磁盘无法从驱动器中取出。可移动单盘始终装在卡匣中，卡匣有两种：顶入和前入。多个磁磁盘的可移动组合称为磁盘组。标准磁盘组包含多达\
  \ 12 块单盘。\n\n\n\n\n\n可移动式磁盘可以装载或从 `drive 1` 或 `drive 2` 移除。换句话说，可移动式磁盘可以在不同的驱动器或数据处理系统中使用。然而，通用数据交换的前提是标准化，而现代磁盘并不存在这种标准。在许多情况下，数据交换被限于某一个制造商的系统。磁盘盒、磁盘卡盒和软盘属于可移动式磁盘一类。非可移动式磁盘是固定磁盘，通常是温彻斯特式（Winchester\
  \ type）。一个或多个磁性磁盘永久地安装在它们的驱动器中。市场上还有“可拆卸固定式”磁盘。在这种情况下，固定磁盘连同其驱动器可以从系统中拆下。如果需要保护存储在固定磁盘上的秘密或机密数据，这是一种方便的解决方案。一个重要的操作参数是旋转速度。对于标准化的可移动式磁盘卡盒和磁盘盒，转速为每分钟\
  \ `2400` 次。固定磁盘的这一数字更高，通常在每分钟 `3600` 次。\n\n对于软盘卡盒，转速要低得多：`200 mm mm (`8in`): `360/min`，`130\
  \ mm (`5.25 in`): `300/min` 和 `360/min`，以及 `90 mm (`3.5 in`): `300/min` 和 `600/min`。\n\
  \n# 存储容量\n\n从用户的角度来看，容量是最重要的特征之一。它表示磁盘上可以存储的数据量，通常以 `bytes`、`kbytes` 或 `Mbytes`\
  \ 为单位。但需要注意的是，容量是以两种不同的方式陈述或计算的，因此会有两个不同的数字。\n\n磁盘的“未格式化容量”是一个虚拟数字；它并不代表实际的数据容量。由于这个数字始终大于“格式化容量”，因此它在广告中被广泛使用。但对于用户来说，只有“格式化容量”才是重要的，因为这个数字能够准确地告诉他磁盘上真正可以存储多少量的数据。\n\
  \n这两种规格之间的区别是什么？容量又是如何计算的？\n\n## 未格式化容量\n\n未格式化容量是在不考虑任何格式化的情况下，可记录字节的最大数量。这意味着假设每个磁道都连续且完整地记录了“0”或“1”（取决于记录方法）。因此，磁盘的未格式化容量是以下项的乘积：\n\
  \n* 每个磁道的最大字节数 ×\n* 磁道数 ×\n* 可记录侧面数\n\n唯一的微小问题在于计算每个磁道的字节数。对于所有标准软盘，线性记录密度规定为：每弧度的磁通变化次数（`ftprad`）。对于现代记录模式，例如改进频率调制（`MFM`），一个磁通变化代表一个位。八个位一组组成一个字节。弧度是角度的单位。与更常用的单位度不同，一个弧度对应于\
  \ `360°` 除以 `2π`。因此，等于磁盘旋转一整圈的磁道的磁通变化次数计算如下：\n\n```\n\\begin{matrix} \\\\ \\frac{\\\
  \\text{fluktransitions}}{\\text{track}} & & {\\\\frac{\\\\text{fluktransitions}}{\\\
  text{rad}} \\times 2\\\\pi = \\\\frac{\\\\text{bits}}{\\text{track}}} \\\\ \\\\\
  \ \\\\ \\frac{\\\\text{bytes}}{\\text{track}} & & {\\\\frac{1}{8}\\{~~~~~~~~~~~}\\\
  \\frac{\\\\text{bits}}{\\text{track}}} \\\\ \\\\ \\\\ \\end{matrix}\n```\n\n有一个实际示例：`2\
  \ Mbyte` `90 mm (`3.5 in`)`软盘的未格式化容量 `C[u]`（`15,916 ftprad`、`80 tracks`、`2 sides`）为：\n\
  \n```\n$C_{u} = \\frac{2\\pi \\times 15,916 \\times 80 \\times 2}{8} = 2,000,063\\\
  text{bytes} \\approx 2\\text{Mbytes}$\n```\n\n在某些情况下，磁磁盘的线性密度规格以每毫米位（`bpmm`）或每英寸位（`bpi`）给出。这种信息毫无意义，因为至少对于“普通”记录方法，密度始终取决于磁道直径。密度在外磁道最低，在最内磁道最高。如果以\
  \ `bpi` 密度，只有在结合指定的磁道时才有意义。\n\n## 格式化容量\n\n对于某种标准格式，实际格式化容量是以下项的乘积：\n\n* 每个扇区的数据字节数\
  \ ×\n* 每个磁道的扇区数 ×\n* 每个侧面的磁道数 ×\n* 侧面数\n\n对于使用标准 `MS-DOS`（Micro Soft Disk-Operating\
  \ System）格式的 `2 Mbyte` `90 mm (`3.5 in`)`软盘，格式化容量 `C[f]` 为\n\n```\n*C[*f*] = 512 × 18 × 80 × 2 = 1, 474, 560bytes\
  \ ≈1.47Mbyte\n```\n\n对于这类软盘，格式化容量仅为未格式化容量的 74%。\n\n# 磁磁盘的标准化\n\n### 为什么要标准化？\n\n\
  当提到标准化材料时，每个人首先想到的是螺丝或写张格式。这是正确的，因为所有互换材料都必须标准化，否则无法进行交换，因此磁介质有很多标准。这些标准有两个主要目的：\n\
  \n* 未记录介的规格（尺寸和其他物理特性）使得不同驱动器之间的物理交换成为可能，并使国家和国际贸易得以进行。\n* 记录介质的标准（记录方法、磁道布局、代码、格式和文件结构）使得数据能够在数据处理系统之间进行交换。\n\
  \n驱动器没有标准。制造商对驱动器或磁头所需的所有要求都包含在媒体标准中。\n\n### 标准化组织\n\n在国际上，有两个机构负责该领域的标准化工作：\n\n\
  * 国际标准化组织 (`ISO`）\n* 国际电工委员会 (`IEC`）\n\n在 `1987` 年之前，`ISO` 的技术委员会 `TC97`（信息处理系统）负责硬磁盘和软盘的标准化。由于这两个国际组织在信息处理方面的任务交织在一起，`1988`\
  \ 年成立了一个新的联合技术委员会（`IEC/JTC1`）。\n\n在国家范围内，不同国家有几个标准化机构。例如，在美国有美国国家标准协会（`ANSI`）。磁磁盘和软盘的国家标准在多大程度上基于国际标准。所有国家的趋势都是使它们与\
  \ `ISO` 标准一致，因为由于差异总会产生问题。\n\n欧洲计算机制造商协会（`ECMA`）的标准也广为人知。这些标准通常在较短的时间内创建，至少与 `ISO`\
  \ 耗时的程序相比。在许多情况下，`ECMA` 标准因此是 `ISO` 标准的“先驱”，随之还有相应的国家标准。尽管 `ECMA` 不是像 `ISO` 或 `IEC`\
  \ 那样的“官方”组织，但这些 `ECMA` 标准非常重要。\n\n有时会提到“事实标准”或“行业标准”，但不清楚它们的含义。这些表达通常用于没有标准的情况。\n\
  \n### 标准化程度\n\n旧类型磁磁盘和软盘的标准规定了“完全数据交换的最低要求”。什么是数据交换？它不仅是指经典或典型的案例，即磁盘从系统 `A` 的驱动器拆下，移动到另一个系统\
  \ `B` 并安装在此处的驱动器上以读取系统 `A` 写入的数据。例如，交换问题也可能发生在运行单个 `PC` 时需要更换软盘驱动器。在这种情况下，新驱动器必须能够读取旧驱动器写入的数据。\n\
  \n\n\n\n\n因此，标准化的任务是规定磁磁盘以及间接规定其驱动器、其读写电子设备、控制器等的所有要求。以下可以作为一个示例：90 mm（3.5 英）软盘的标准包含超过\
  \ 100 个维度。每个维度都有公差，即使在关于公差、温度和湿度的最坏情况下，每盘软盘在互换时也必须正常工作。\n\n对于现代类型的威士硬盘（Winchester\
  \ disks），对于未记录磁盘的磁特性、磁道格式或仅针对标签尚不存在标准。在尺寸方面，则以其他磁盘或软盘作为参照。\n\n## 标准化磁磁盘\n\n标准化的磁盘分为类：\n\
  \n> 可移动式硬质磁盘（磁盘盒、磁盘装），用于专业系统（例如，在计算或数据处理中心）。标准化类型请参阅表 1。\n\n表 1. 标准化硬磁磁盘\n\n| ISO\
