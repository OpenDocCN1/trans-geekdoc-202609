  - 3. 列表中列出的每种关系都可以被视为一个意义生成器（meaning-generator）。意义生成器预期能生成初始上下文中未提到、且可能未被意图表达的陈述。这假设引用了文中包含的关联记忆（associative
    memory）。从 `D` 结构接收到的每条陈述不仅携带了显式信息（词典中的解释），还包含了从关联记忆中生成的陈述含义。现有的基于知识的控制器并不一定具备关联记忆，但应当具备。搜索（例如浏览）程序可以从关联记忆中提取隐性知识。
- - '##'
  - 4. 在构建全局（抽象）`D` 结构后，它并不指代任何问题或过程。需要额外的努力将该结构引用到某个抽象参考系中，并在全局数据结构中定位一个面向问题的数据结构子集，以便在参考系内对其进行控制。选择抽象参考系是为了将标签描述为真实属性的组合。它们之间的关系仍然存在，且每个标签不再仅仅是一个单词，而是多维描述空间（`D`
    空间）中的一个点。该 `D` 结构中的每个关系反过来应该放入一个 `D` 空间中，以便用于解决问题。
- - '##'
  - 5. 这种引用系统或参考系可以以虚构向量空间的多维坐标系的形式构建。每个标签随后被假设具有若干维度。这提醒我们，每个标签都被表示为一组属性，或者最终表示为一组单词（变量）。每个属性（单词）都可以进行定量的评估。
