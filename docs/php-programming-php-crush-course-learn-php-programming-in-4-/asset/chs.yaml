  \ id=\"last_name\" name=\"last_name\" maxlength=\"80\">\n    <label for=\"age\"\
  >年龄</label>\n    <input type=\"number\" id=\"age\" name=\"age\" min=\"1\" max=\"\
  100\">\n    <label for=\"gender\">性别</label>\n    <select id=\"gender\" name=\"\
  gender\">\n        <option value=\"Male\">男性</option>\n        <option value=\"\
  Female\">女性</option>\n    </select>\n    <label for=\"relationship\">关系</label>\n\
  \    <input type=\"text\" id=\"relationship\" name=\"relationship\" maxlength=\"\
  80\">\n    <input type=\"submit\" name=\"submit\" value=\"添加\">\n</form>\n```\n\n\
  让我们拆解一下并看看最有趣的部分。在处理信息之前，我们必须检查这些信息是否由表单提交。我们通过一个 `if` 语句并使用 PHP 内置函数 `isset()`\
  \ 来实现，该函数检查变量是否为空。我们将关联数组 `$_POST` 作为参数传入。它包含了输入表单的所有值。该数组通过表单的 post 方法传递给脚本：\n\n\
  ```php\nif(isset($_POST['submit'])) {\n```\n\n在条件语句内部，我们声明了一个数组来检查我们是否不小心遗漏了任何表单输入：\n\
  `$null_fields = array();`\n\n接下来，在将值发送到数据库之前，我们开始检查数组中的任何值是否为空。如果是，将其添加到 `$null_fields`\
  \ 数组中；否则，我们创建一个变量并存储它们。我们只需看一个 `if…else` 语句，因为：\n\n```php\nif (empty($_POST['first_name']))\
  \ {\n    $null_fields[] = '名字';\n} else {\n    $first_name = trim($_POST['first_name']);\n\
  }\n```\n\n我们对 `$_POST` 中的其余值也执行此操作。警告：这可能不是在数据进入数据库之前验证数据最安全的方法。对于这一点，我们需要使用正则表达式，那是一个高级话题。我们只是试图保持保持简单。\n\
  \n接下来，我们必须检查 `$null_fields` 数组是否为空。这意味着所有数据都已提交：\n\n```php\nif (empty($null_fields))\
  \ {\n```\n\n如果我们处于该条件内部，意味着所有数据都已提交，我们可以查询数据库。我们使用 `INSERT TO` 语句将数据插入 `FamilyMembers`\
  \ 表中。我们遵循向表中插入数据的规则，确保变量的顺序与它们在表中定义的顺序一致。在创建查询字符串之前，我们声明了一个额外变量作为主键的空值传入。我们还确保参数的数量与表字段匹配：\n\
  \n```php\n$null_variable = NULL;\n$sql = \"INSERT INTO FamilyMembers VALUES ('$null_variable',\
  \ '$first_name', '$last_name', '$age', '$gender', '$relationship')\";\n```\n\n接下来我们使用\
  \ `mysqli_query()` 操作数据库，将连接和查询字符串作为参数，同时检查返回的错误。失败时返回 `FALSE`。如果发现错误，我们将显示它们以便修复。如果没有发现错误，我们将输出成功消息：\n\
  \n```php\nif (!mysqli_query($conn, $sql)) {\n    die ('Error: ' . mysqli_error($conn));\n\
  } else {\n    echo \"成员已输入!\";\n}\n```\n\n所以现在我们处理了用户输入所有数据的情况，但如果他漏掉了任何内容，我们将通过\
  \ `foreach` 循环遍历 `$null_fields` 数组并将它们显示在屏幕上：\n\n```php\nelse {\n    echo \"你需要输入以下数据：<br\
  \ />\";\n    foreach ($null_fields as $null_field) {\n        echo $null_field .\
  \ \"<br />\";\n    }\n}\n```\n\n之后，我们退出检查 `$_POST` 数组是否为空的条件并关闭数据库连接：\n`mysqli_close($conn);`\n\
  \n然后在 PHP 标签之后，我们再次显示表单，允许 PHP 脚本自调用以便我们可以继续输入。\n\n## 总结\n\n情况就是这样！在本章之前，我们分别学习了\
  \ PHP 和 MySQL，而本章旨在将两者结合，并展示如何使用它们来生成动态内容。修改网站以满足你的需求并不难，因为你现在已经具备了这种能力。\n\n在本章中，我们创建了一个存储数据库连接的配置文件，并在整个网站中使用它建立数据库连接，并通过查询来存储和检索数据。我们创建了一个允许你查看已添加到数据库的家庭成员信息的页面。\n\
  \n# 结语\n\n“教育是点燃火火焰，而不是填满一个容器。” —— 苏格拉底\n\n这本书到此结束，但并不是你学习的终点。你仍然需要出去学习还可以用 PHP\
  \ 和 MySQL 做哪些其他事情，并对这些概念有更深入的理解。尽管在此，我诚地希望你已经具备了足够的知识，能够根据 PHP 和 MySQL 的基础知识完成你需要的工作。\n\
  \n\n\n\n\n# 第一小时：PHP 基础\n在第一小时中，我们涵盖了 PHP 的基础知识，如注释、变量、常量和运算符。在此之前，我们学习了如何安装服务器软件包\
  \ `XAMPP`，以获取服务器提供 `Apache` 服务。我们运行了 PHP 脚本并在屏幕上显示了整洁的消息。我们还选择了一个酷的文本编辑器来编写优美的 PHP\
  \ 代码。\n\n# 第二小时：控制流与函数\n在第二小时，我们更深入地学习了 PHP 基础，并了如何编写条件语句，允许我们根据指定的条件执行代码块。接着，我们学习了如何使用\
  \ `while` 和 `for` 循环来遍历代码，直到满足特定条件。然后，我们学习了如何通过 `functions` 封装代码块并在程序中复用它们。我们以参数的形式向函数传递信息，函数会在对这些信息进行操作后返回部分结果。最后，我们学习了如何将数据集合存储在\
  \ `arrays` 中以及如何遍历它们。\n\n# 第三小时：MySQL\n在第三小时，我们学习了 `MySQL`。我们学习了如何调出命令行提示符并输入 `MySQL`\
  \ 命令来执行各种操作，例如创建和删除数据库；创建、修改和删除表；检索、插入、更新和删除表中的数据。\n\n# 第四小时：集成\n在第四章也是最后一章中，我们学习了如何结合使用\
  \ `PHP` 和 `MySQL` 为我们正在制作的简单网站创建动态内容，我们正在列出我们喜欢的家庭成员及其详细信息。\n\n# 结语\n这些都是为绝对初学者提供的知识，他们需要清晰的示例和解释来快速引导。祝愿你未来的事业一切顺利，我相信你正走在实现梦想的道路上。很高兴能帮上忙。\n\
