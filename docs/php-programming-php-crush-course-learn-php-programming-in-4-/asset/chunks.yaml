    \ their server and you can test and deploy your dream site right there. But I'm\
    \ guessing you really want to test it locally and quickly. So, we will install\
    \ a local server that makes your very own computer become a test server.\n\nThere\
    \ are many servers you can install on your local machine such as XAMP, WAMP (for\
    \ windows), and MAMP for Mac OS X, etc., but this book covers XAMP. It is a free\
    \ open source cross platform web server package available for Windows, Mac and\
    \ Linux. \n\nGo to this website\n\n[https://www.apachefriends.org/index.html](#part0000_split_011.html#_Installing_a_Web)\
    \ \n\nand download the latest version of XAMP for windows (the same steps can\
    \ be easily translated to Mac OSX or Linux). Once the download is finished, locate\
    \ the file on your local machine and double-click it to install it.\n\nSimple!\
    \ Now PHP and MySQL are ready for use.\n\nNOTE: If you have an antivirus running\
    \ at this time, it may interfere with the process. You might want to switch it\
    \ off until the server is done installing to avoid any potential problems.\n\n\
    ## Installing a Text Editor\n\nNow, you will need a text editor to write some\
    \ beautiful PHP. Ideally, any text editor would do, even the default notepad on\
    \ windows or terminal for Mac OS X can be used when writing PHP. We will use notepad++\
    \ because it has some nifty features which can contribute towards writing clean\
    \ and efficient code in a fast way, such as syntax highlighting and auto complete.\n\
    \nPlus it’s free!\n\nThis text editors will save you time and a world of pain\
    \ by just downloading it here [Installing a Text Editor](#part0000_split_012.html#_Installing_a_Text) \
    \ and installing it. Just remember that any text will do. So even if you don’t\
    \ have notepad++, you can use whatever you like.\n\n## Starting Apache to run\
    \ PHP scripts\n\nNow that you have installed XAMPP, you need to start the apache\
    \ web service in order for the browser to be able to run PHP scripts. To do this,\
    \ open up the Control Panel of XAMPP by double clicking on its icon. By default,\
    \ it should start Apache automatically, but you can start it manually by clicking\
    \ “Start” as in the picture below:\n\n![C:\\\\Users\\\\Dr Rager\\\\Desktop\\\\\
    apache.png](images/00001.jpeg)\n\nNOTE: Some other applications installed on your\
    \ computer can cause Apache not to start because they are using the same port\
    \ Apache is configured to e.g. Skype. If that is the case, just stop those services\
    \ and start Apache again.\n\n## Creating Your First PHP Script\n\nThis part is\
    \ fairly easy to do. All you have to do is follow these steps:\n\n### Step 1 -\
    \ Create the PHP file\n\nOpen up your text editor and create a regular text file\
    \ and place the following code into it:\n\n<!DOCTYPE html>  \n\n<html>  \n\n             \
    \ <body>\n\n                            <?php  \n\n                           \
    \               echo \"My first PHP script!\";  \n\n                           \
    \ ?>\n\n              </body>  \n\n</html>\n\nThe file still looks like your basic\
    \ HTML file except that you embed PHP code between tags <?php and ?>. The echo\
    \ statement just outputs everything that comes after it to the screen. In our\
    \ case, this will be “My first PHP script!\". We shall see this in action in a\
    \ moment.\n\nAnd all you have to remember is that every PHP statement ends with\
    \ a semicolon (Except for comments. We will look at those later in the hour).\n\
    \nSave the file as “example.php”.\n\n### Step 2 - Place it in the Root Directory\
    \ of XAMPP\n\nGrab the file “example.php” that you just created and place it in\
    \ the root directory of your server in the folder named \"htdocs\", and Whalla!\
    \ You are ready to run it in your browser.\n\nTIP: To find the root directory,\
    \ you can look for it on your local machine or you could just open up the XAMPP\
    \ Control Panel and click the “Explorer” button, as shown in the picture below,\
    \ to bring up the root folder and then locate the htdocs folder and place the\
    \ file in there:\n\n![C:\\\\Users\\\\Dr Rager\\\\Desktop\\\\ROOT.png](images/00002.jpeg)\n\
    \nNOTE: The folder to place your PHP files will be different with each server.\
    \ For example; you place them in the folder named www if you are using WAMP.\n\
    \n### Step 3 - Run It in the Browser\n\nOpen up your browser (Google Chrome or\
    \ Firefox are recommended) and type the following:\n\n[http://localhost/example.php](http://localhost/example.php)\n\
    \nPress Enter and you should see the following window below:\n\n![C:\\\\Users\\\
    \\Dr Rager\\\\Desktop\\\\example.png](images/00003.jpeg)\n\nThere you go! If you\
    \ follow those steps, you should be able to run all other scripts created in this\
    \ chapter.\n\n## PHP Basics\n\n### Comments\n\nWant to leave messages for your\
    \ future self or other members of your team? Then comments save you the trouble\
    \ of having to remember your train of thought and make for an excellent way to\
    \ document what your thoughts were at the time. They can also be used to exclude\
    \ certain pieces of code all together.\n\n// This is a single line comment\n\n\
    \\# This is another single line comment\n\n/\\*  \n\n              This is a comment\
    \ block. Everything in here will be ignored and can               span multiple\
    \ lines.  \n\n\\*/\n\n### Variables\n\nTo build your dream website, you will need\
    \ data and a way to store this data. It can be a name, a number, a date or a picture.\
    \ PHP offers a way for you to store them in memory by using a variable.\n\nEach\
    \ variable in PHP is preceded by the $ sign followed by the variable name without\
    \ any spaces in between the sign and variable name:\n\n$myInt = 10;\n\nLet us\
    \ see some of this in action with the following code:\n\n<!DOCTYPE html>  \n\n\
    <html>  \n\n              <body>  \n\n                            <?php  \n\n\
                                              $txt = \"My second PHP script!\";  \n\
    \n                                          echo $txt;  \n\n                           \
    \ ?>  \n\n              </body>  \n\n</html>\n\nIf you run this script in the\
    \ browser, it should out put the following:\n\n\"My second PHP script!\";\n\n\
    Few more things to remember about variables:\n\n*   They are case sensitive. This\
    \ means $name and $naMe are two different variables\n\n*   They must always start\
    \ with a letter or underscore\n\n*   They cannot start with numbers\n\n*   They\
    \ can only contain alpha numeric values"
