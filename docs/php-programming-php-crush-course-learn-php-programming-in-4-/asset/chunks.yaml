- fmt: "\nYou can take a break after this part and let it all sink in and make another\
    \ cup of coffee.\n\nIn the third hour we tackle MySQL and its commands, but first\
    \ we learn how to access the command line. Then we move on to the commands that\
    \ let us create and delete databases; create, alter and delete tables; insert,\
    \ select, update and delete data in the tables.\n\nFinally, in the final hour,\
    \ we put PHP and MySQL together and create a simple website to show you how these\
    \ two work together hand in hand.\n\nLet us get to it. Grab your first cup of\
    \ coffee!\n\n# Chapter 1 - Hour 1: Installing and PHP Basics\n\n\"The way to get\
    \ started is to take the first step with dream-powered optimism.\" - Debasish\
    \ Mridha\n\nThis chapter we will cover:\n\n*   Installing a web server\n*   Installing\
    \ a text editor\n*   Starting Apaches to run PHP scripts\n*   Creating and running\
    \ a PHP script\n*   PHP basics (comment, variables, operators, constants, strings)\n\
    \nBear with me a little. I know that the first chapter of almost every programming\
    \ book piles on the theory to make sure you know what you are getting yourself\
    \ into. I won't lie; even in this short book, we still have to go through it a\
    \ little. Just a little bit of it to cover some basics of PHP. But that is for\
    \ later on during the hour. For now you need to install the server and choose\
    \ an appropriate text editor to use when writing PHP code!\n\n## Installing a\
    \ Web Server\n\nYour first real step to PHP mastery has led you here. You can't\
    \ just run PHP in a browser like you do with HTML. To run PHP, you are going to\
    \ need a server installed on your local machine in order for the browser to parse\
    \ PHP scripts and run MySQL queries to the database to return results. Alternatively,\
    \ you can use a host that supports PHP and MySQL so that they can upload it to\
    \ their server and you can test and deploy your dream site right there. But I'm\
    \ guessing you really want to test it locally and quickly. So, we will install\
    \ a local server that makes your very own computer become a test server.\n\nThere\
    \ are many servers you can install on your local machine such as XAMP, WAMP (for\
    \ windows), and MAMP for Mac OS X, etc., but this book covers XAMP. It is a free\
    \ open source cross platform web server package available for Windows, Mac and\
    \ Linux. \n\nGo to this website\n\n[https://www.apachefriends.org/index.html](#part0000_split_011.html#_Installing_a_Web)\
    \ \n\nand download the latest version of XAMP for windows (the same steps can\
    \ be easily translated to Mac OSX or Linux). Once the download is finished, locate\
    \ the file on your local machine and double-click it to install it.\n\nSimple!\
    \ Now PHP and MySQL are ready for use.\n\nNOTE: If you have an antivirus running\
    \ at this time, it may interfere with the process. You might want to switch it\
    \ off until the server is done installing to avoid any potential problems.\n\n\
    ## Installing a Text Editor\n\nNow, you will need a text editor to write some\
    \ beautiful PHP. Ideally, any text editor would do, even the default notepad on\
    \ windows or terminal for Mac OS X can be used when writing PHP. We will use notepad++\
    \ because it has some nifty features which can contribute towards writing clean\
    \ and efficient code in a fast way, such as syntax highlighting and auto complete.\n\
    \nPlus it’s free!\n\nThis text editors will save you time and a world of pain\
    \ by just downloading it here [Installing a Text Editor](#part0000_split_012.html#_Installing_a_Text)\
    \ and installing it. Just remember that any text will do. So even if you don’t\
    \ have notepad++, you can use whatever you like.\n\n## Starting Apache to run\
    \ PHP scripts\n\nNow that you have installed XAMPP, you need to start the apache\
    \ web service in order for the browser to be able to run PHP scripts. To do this,\
    \ open up the Control Panel of XAMPP by double clicking on its icon. By default,\
    \ it should start Apache automatically, but you can start it manually by clicking\
    \ “Start” as in the picture below:\n\n![C:\\\\Users\\\\Dr Rager\\\\Desktop\\\\\
    apache.png](images/00001.jpeg)\n\nNOTE: Some other applications installed on your\
    \ computer can cause Apache not to start because they are using the same port\
    \ Apache is configured to e.g. Skype. If that is the case, just stop those services\
    \ and start Apache again.\n\n## Creating Your First PHP Script\n\nThis part is\
    \ fairly easy to do. All you have to do is follow these steps:\n\n### Step 1 -\
    \ Create the PHP file\n\nOpen up your text editor and create a regular text file\
    \ and place the following code into it:\n\n```html\n<!DOCTYPE html>  \n<html>\
    \  \n    <body>\n        <?php  \n            echo \"My first PHP script!\"; \
    \ \n        ?>\n    </body>\n</html>\n```\n\nThe `echo` statement outputs everything\
    \ that comes after to the screen. The file still looks like `<?php` and `?>`.\
    \ Save the file as `example.php`.\n\n### Step 2 - Place it in Root of XAMPP\n\n\
    Grab `example.php` and place it in the `htdocs` folder.\n\nNOTE: To find the root,\
    \ you can open XAMPP.\n\n![C:\\\\Users\\\\Dr Rager\\\\Desktop.png](images/00002.jpeg)\n\
    \n### Step 3 - Run in the Browser\n\nOpen up your browser (Google Chrome are recommended)\
    \ and type:\n\n`http://localhost/example.php`\n\n![C:\\\\Users\\\\Dr Rager\\\\\
    Desktop.png](images/00003.jpeg)\n\nThere go!\n\n## PHP Basics\n\n### Comments\n\
    \nWant to leave messages for your future self or other team? Then comments save\
    \ you the trouble of having to remember what.\n\n```php\n// This is a single line\n\
    // This is another single line\n\n/*\nThis is a comment. It can span multiple\
    \ lines.\n*/\n```\n\n### Variables\n\nTo build your dream website, you will need\
    \ data and a way to store this data. PHP offers a way to store them in memory\
    \ using a variable. Each variable is preceded by the `$` sign.\n\nLet us see some\
    \ of this action with the following code:\n\n```html\n<!DOCTYPE html>  \n<html>\
    \  \n    <body>\n        <?php  \n            $txt = \"My second PHP script!\"\
    ;  \n            echo $txt;\n        ?>\n    </body>\n</html>\n```\n\nIf you run\
    \ this script in the browser, it should output the following:\n\n\"My second PHP\
    \ script!\"\n\nFew more things to remember about variables:\n\n*   They are case\
    \ sensitive. This means `$name` and `$naMe` are two different variables\n*   They\
    \ must always start with a letter or underscore\n*   They cannot start with numbers\n\
    *   They can only contain alpha numeric values\n"
  raw: "You can take a break after this part and let it all sink in and make another\
    \ cup of coffee.\n\nIn the third hour we tackle MySQL and its commands, but first\
    \ we learn how to access the command line. Then we move on to the commands that\
    \ let us create and delete databases; create, alter and delete tables; insert,\
    \ select, update and delete data in the tables.\n\nFinally, in the final hour,\
    \ we put PHP and MySQL together and create a simple website to show you how these\
    \ two work together hand in hand.\n\nLet us get to it. Grab your first cup of\
    \ coffee!\n\nChapter 1 - Hour 1: Installing and PHP Basics\n\n\"The way to get\
    \ started is to take the first step with dream-powered optimism.\" - Debasish\
    \ Mridha\n\nThis chapter we will cover:\n\n*   Installing a web server\n\n*  \
    \ Installing a text editor\n\n*   Starting Apaches to run PHP scripts\n\n*   Creating\
    \ and running a PHP script\n\n*   PHP basics (comment, variables, operators, constants,\
    \ strings)\n\nBear with me a little. I know that the first chapter of almost every\
    \ programming book piles on the theory to make sure you know what you are getting\
    \ yourself into. I won't lie; even in this short book, we still have to go through\
    \ it a little. Just a little bit of it to cover some basics of PHP. But that is\
    \ for later on during the hour. For now you need to install the server and choose\
    \ an appropriate text editor to use when writing PHP code!\n\n## Installing a\
    \ Web Server\n\nYour first real step to PHP mastery has led you here. You can't\
    \ just run PHP in a browser like you do with HTML. To run PHP, you are going to\
    \ need a server installed on your local machine in order for the browser to parse\
