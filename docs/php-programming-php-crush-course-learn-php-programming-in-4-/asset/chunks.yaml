    \ command line to select the database we just created, and then press enter:\n\
    \nUSE music;\n\nWARNING: Don’t forget to select the database otherwise you will\
    \ get errors when you try to create tables etc.\n\nNOTE: the command-line prompt\
    \ will let you know which database you have selected. It should look something\
    \ like this “Maria DB \\[music\\]>”.\n\n## Creating, Altering and Deleting Tables\n\
    \nNow that we have selected out database, let’s create some tables. The first\
    \ table we will create is about information on the artist.\n\nIt is good practice\
    \ (and headache saving) to first check if any tables with the same name exists\
    \ because you can’t create two tables with the same name in the same database.\
    \ If one is found, it is deleted along with its data. So, be careful with this\
    \ command especially if the table is related to other tables.\n\n### Creating\
    \ Tables\n\nWe create the table as follows:\n\nCREATE TABLE Album\n\n(  \n\n             \
    \ AlbumIDsmallint unsigned NOT NULL auto\\_increment PRIMARY KEY,  \n\n             \
    \ AlbumNamevarchar(255) NOT NULL,  \n\n              AlbumArtistvarchar(80) NOT\
    \ NULL,  \n\n              AlbumType ENUM('A', 'E', 'M') NOT NULL,  \n\n             \
    \ numTracksvarchar(3) NOT NULL,  \n\n              DateReleasedDATE NOT NULL \
    \ \n\n);\n\nTIP: When typing large commands it is easy to mess up. Especially\
    \ when using thecommand line. If this happens just press the up arrow on your\
    \ keyboard to bring up previous commands and use the left and right arrows to\
    \ navigate to where you messed up and fix.\n\nTo see the list of tables in you\
    \ database, enter the following piece of code:\n\nSHOW tables;\n\nYou see the\
    \ following output:\n\n+-----------------+  \n\n| Tables\\_in\\_music |  \n\n\
    +-----------------+  \n\n| album           |  \n\n+-----------------+\n\nWhen\
    \ you press Enter, the following table will be added to the music database. Let\
    \ us break down what is happening:\n\n1.  Creating the Album Table  \n\n    CREATE\
    \ TABLE Artists () creates a new table and the lines inside the parenthesis define\
    \ the table’s structure.\n\n2.  Giving Each Album a Unique ID\n\nThe field (or\
    \ column) AlbumsID has the following properties:\n\n*   smallint unsigned (unsigned\
    \ small integer) – this means we can store artists in the range 32,278 to – 32,767.We\
    \ will look at the common data types that you will be working with later on in\
    \ the chapter.\n\n*   NOT NULL – this means the field cannot be left blank when\
    \ creating a record.\n\n*   auto\\_increment – this just means that you don’t\
    \ have to enter anything in the field. When a record is created, it will be assigned\
    \ a new value by MySQL.\n\n*   PRIMARY KEY -Each table can only have one Primary\
    \ Key. It is used to uniquely identify a record/row in a database and, once created,\
    \ it can never be changed. This makes it quicker to find (at the expense of some\
    \ storage space).\n\n3.  Adding the AlbumName Field\n\nNext we create a field\
    \ to store the name of the album. The data type varcharstands for variable number\
    \ of character and stores a string of up to 225 characters.\n\n4.  Adding the\
    \ AlbumArtist Field\n\nThis field also stores a variable number of characters\
    \ and its string is limited to only 80 characters.\n\n5.  Adding the AlbumType\
    \ Enumerated Type Field  \n\n    The enumerated type ENUM is a string object that\
    \ has set of values that are allowed. In our case, the allowed values are ‘L’\
    \ for Long Play (LP), ‘E’ for Extended Play (EP) and ‘M’ for a mix tape.\n\n6.\
    \  Adding the numTracks Field\n\nIf this seems wrong to you, then you have been\
    \ paying attention! This field is used to store the number of tracks the album\
    \ has and should be a numeric type and not a string type. This was done intentionally\
    \ to demonstrate how to change the data type and name of a field/column later\
    \ of in the chapter.  \n\n7.  Adding DateReleased Field  \n\n    The last line\
    \ created stores the date the album was released. The date data type is used to\
    \ store date values.\n\nLet us look at some of the common data types that you\
    \ will be using:\n\n*   Numeric Types\n\n1.  INT: whole number 2^31 to -2^31 –\
    \ 1\n\n2.  FLOAT: Decimal spaces 1.1E38 to -1.1E37\n\n3.  Double: Decimal spaces\
    \ 1.7E308 to -1.7E307\n\n*   String Types\n\n1.  CHAR: fixed length character\
    \ string\n\n2.  VARCHAR: Character string with a variable length\n\n3.  ENUM:\
    \ A character string that has a limited number of total values which you must\
    \ define\n\n*   Date and Time\n\n1.  DATE: YYYY:MM:DD\n\n2.  TIME: HH:MM:SS\n\n\
    3.  DATETIME:YYYY-MM-DD HH:MM:SS\n\n4.  YEAR: YYYY\n\n### Altering Tables\n\n\
    Sometime you can make a mistake or may just wish to changes things in your table.\
    \ Luckily, you can do so with MySQL by altering the table using MySQL statements.\
    \ We will look at changing table and column names, and changing data types.\n\n\
    First we need to look at the table we just created by the typing following command\
    \ to describe our table. We should be able to see its structure in the command\
    \ line:\n\nDESCRIBE Album;\n\nYou should see the following output:\n\n+--------------+----------------------+------+-----+---------+----------------+\
    \  \n\n| Field        | Type                 | Null | Key | Default | Extra         \
    \ |  \n\n+--------------+----------------------+------+-----+---------+----------------+\
    \  \n\n| AlbumID      | smallint(5) unsigned | NO   | PRI | NULL    | auto\\_increment\
    \ |  \n\n| AlbumName    | varchar(255)         | NO   |     | NULL    |               \
    \ |  \n\n| AlbumArtist  | varchar(80)          | NO   |     | NULL    |               \
    \ |  \n\n| AlbumType    | enum('A','E','M')    | NO   |     | NULL    |               \
    \ |  \n\n| numTracks    | varchar(3)           | NO   |     | NULL    |               \
    \ |  \n\n| DateReleased | date                 | NO   |     | NULL    |               \
    \ |  \n\n+--------------+----------------------+------+-----+---------+----------------+\n\
    \nLooks like we can indeed change a few things:\n\n1.  Changing the Table Name\n\
    \nSeems the singular form “Album” doesn’t make much sense as a table is used to\
    \ store multiple records. We should use the plural form and change it from Album\
    \ to Albums. Just so it makes more sense.\n\nHere is how we change the table name:\n\
    \nRENAME TABLE Album to Albums;\n\nIf we enter the show tables command we should\
    \ see the table name has changed:\n\n              +-----------------+  \n\n             \
    \ | Tables\\_in\\_music |  \n\n              +-----------------+  \n\n             \
    \ | albums          |  \n\n              +-----------------+\n\n2.  Changing The\
    \ Data Type of numTracks\n\nThe field numTracks should not be a string type but\
    \ numeric. The following code should change its data type to the appropriate one:\n\
    \n              ALTER TABLE Albums  \n\n              MODIFY COLUMN numTrackssmallint(2)\
    \ NOT NULL;\n\n3.  Changing the Column Name fornumTracks\n\nIt seems we are still\
    \ not done with the field numTracks. We need to change it to make it a little\
    \ more readable by changing it from numTracks to NumberOfTracks.\n\n             \
    \ ALTER TABLE Albums  \n\n              CHANGE numTracksNumberOfTrackssmallint(2)\
    \ NOT NULL;\n\nNOTE: we still have to define the data type even when changing\
    \ the name of the column\n\nWith the following changes, when we enter the statement\
    \ to describe the table, we should see the following:\n\n+----------------+----------------------+------+-----+---------+----------------+"
