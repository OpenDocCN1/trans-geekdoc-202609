    \ we made a mistake and named Coldplay as Coldplays in one of the records. This\
    \ can be corrected by updating that record using the `UPDATE` statement.\n\nIf\
    \ we output the record now with the following code:\n\n```sql\nSELECT AlbumID,\
    \ AlbumName, AlbumArtist\nFROM Albums;\n```\n\nThe output should be:\n\n```\n\
    +---------+---------------------------+--------------+\n| AlbumID | AlbumName\
    \                 | AlbumArtist  |\n+---------+---------------------------+--------------+\n\
    |       1 | Rush of Blood to the Head | Coldplays    |\n|       2 | Dirty Gold\
    \               | Angel Haze   |\n|       3 | Back to the Woods         | Angel\
    \ Haze   |\n|       4 | Parachutes                | Coldplay      |\n|       5\
    \ | 1989 (Delux Edition)      | Taylor Swift |\n|       6 | Prospekts March  \
    \         | Coldplay      |\n|       7 | Random Access Memories    | Daft Punk\
    \    |\n|       8 | X & Y                     | Coldplay      |\n+---------+---------------------------+--------------+\n\
    ```\n\nWe update that recode like this:\n\n```sql\nUPDATE Albums\nSET AlbumArtist\
    \ = 'Coldplay'\nWHERE AlbumID = 1;\n```\n\nWarning: Don’t omit the `WHERE` clause\
    \ or all the records in the table will be updated.\n\nIf we output it now, we\
    \ should see the record has been updated:\n\n```\n+---------+---------------------------+--------------+\n\
    | AlbumID | AlbumName                 | AlbumArtist  |\n+---------+---------------------------+--------------+\n\
    |       1 | Rush of Blood to the Head | Coldplay      |\n|       2 | Dirty Gold\
    \               | Angel Haze   |\n|       3 | Back to the Woods         | Angel\
    \ Haze   |\n|       4 | Parachutes                | Coldplay      |\n|       5\
    \ | 1989 (Delux Edition)      | Taylor Swift |\n|       6 | Prospekts March  \
    \         | Coldplay      |\n|       7 | Random Access Memories    | Daft Punk\
    \    |\n|       8 | X & Y                     | Coldplay      |\n+---------+---------------------------+--------------+\n\
    ```\n\n## Deleting Records in a Tables\n\nTo delete records in a table, we use\
    \ the `DELETE` statement. The following example deletes the record/row from the\
    \ table with an `AlbumID` of 1:\n\n```sql\nDELETE FROM Albums\nWHERE AlbumID =\
    \ 1;\n```\n\nWarning: Don’t omit the `WHERE` clause or all the records in the\
    \ table will be deleted.\n\nNow we output the records in the table. We will limit\
    \ the number of columns to only `AlbumID`, `AlbumName` and `AlbumArtist`. The\
    \ record with an `AlbumID` of 1 should be missing from the `result_set` because\
    \ it has been deleted.\n\n```\n+---------+------------------------+--------------+\n\
    | AlbumID | AlbumName              | AlbumArtist  |\n+---------+------------------------+--------------+\n\
    |       2 | Dirty Gold               | Angel Haze   |\n|       3 | Back to the\
    \ Woods         | Angel Haze   |\n|       4 | Parachutes                | Coldplay\
    \      |\n|       5 | 1989 (Delux Edition)      | Taylor Swift |\n|       6 |\
    \ Prospekts March           | Coldplay      |\n|       7 | Random Access Memories\
    \    | Daft Punk    |\n|       8 | X & Y                     | Coldplay      |\n\
    +---------+------------------------+--------------+\n```\n\nIf you want to delete\
    \ all records in the table, the following `DELETE` statement will do:\n\n```sql\n\
    DELETE from Albums;\n```\n\n## Summary\n\nOkay, now that you are familiar with\
    \ `MySQL` and can access it using the command line and use it to create and delete\
    \ databases; create, alter and delete tables; select, insert, update, and delete\
    \ data; and do other neat things with data like filtering and ordering it the\
    \ way you want using `MySQL` commands, it is the time to move on and look at how\
    \ we can use `PHP` and `MySQL` together to create a simple website where you add\
    \ records to a database of favorite artists.\n\n### Chapter 4 - Hour 4: PHP and\
    \ MySQL: The Dynamic Duo “A language that doesn’t affect the way you think is\
    \ not worth” – Alan J. Perils\n\nIn this chapter we will cover:\n* Creating the\
    \ Family Database\n* Creating and Inserting into the Family Members Table\n* Creating\
    \ a PHP configuration the Website\n* Creating the Index Page\n* Creating the Form\
    \ to Input Data\n* Creating the Member Added Page\n\nThink of seeing your two\
    \ favorite artists performing together. This is what it should like at this movement\
    \ as we about see `PHP` (mostly `PHP`) together to create a website. By now you\
    \ should be able to imagine the good music these two can make together. The website\
    \ is simple; let’s say you want to keep track of family members online. We will\
    \ create a simple website that lets you add them (if like them) to a database\
    \ so you don’t always have to remember who they are. We will forego a lot of security\
    \ features just to keep it simple and other functions but this simple example\
    \ should be enough to get you on your way. By now you have a fairly grasp of `PHP`\
    \ and can use the command line to type `SQL` commands. We will need both. So make\
    \ sure both `Apache` and `MySQL` are running in `XAMPP` (See Chapter 1 and Chapter\
    \ 3 on how to enable `Apache` and `MySQL` respectively). So let us started!\n\n\
    ### Creating Family Database\n\nOpen up the command line and fire up the MySQL\
    \ Client and login as the `root` (see Chapter 3). Create the Database by entering\
    \ the following code:\n\n```sql\nCREATE DATABASE Family;\n```\n\nThen select the\
    \ database in order to use it:\n\n```sql\nUSE Family;\n```\n\n### Create and Inserting\
    \ Values into the Family Members Table\n\nNow we create the table that stores\
    \ the information. It should look like this:\n\n| Family Members |\n| --- |\n\
    | Member ID |\n| First Name |\n| Last Name |\n| Age |\n| Gender |\n| Relationship\
    \ |\n\nThe code to create the tables as follows:\n\n```sql\nCREATE TABLE FamilyMembers\n\
    (\n    MemberIDint unsigned NOT NULL auto_increment PRIMARY KEY,\n    FirstNamevarchar(80)\
    \ NOT NULL,\n    LastNamevarchar(80) NOT NULL,\n    Age int(3) unsigned NOT NULL,\n\
    \    Gender ENUM ('Male', 'Female') NOT NULL,\n    Relationship varchar(80) NOT\
    \ NULL\n);\n```\n\nWhen we describe the table we get something like this:\n\n\
    ```\n+--------------+-----------------------+-----+-----++----------------+\n\
    | Field        | Type                  | Null | Key | Default | Extra        \
    \   |\n+--------------+-----------------------+-----+-----++----------------+\n\
    | MemberID      | int unsigned          | NO   | PRI |         | auto_increment\
    \  |\n| FirstName    | varchar(80)           | NO   |     |         |        \
    \         |\n| LastName     | varchar(80)           | NO   |     |         | \
    \                |\n| Age          | int(3) unsigned       | NO   |     |    \
    \     |                 |\n| Gender        | enum('Male','Female') | NO   |  \
    \   |         |                 |\n| Relationship | varchar(80)           | NO\
    \   |     |         |                 |\n+--------------+-----------------------+-----+-----++----------------+\n\
    ```\n\nThen we insert values into the tables:\n\n```sql\nINSERT INTO FamilyMembers\
    \ VALUES\n(NULL, 'Robert', 52, 'Male', 'Father'),\n(NULL, 'Martha', 49, 'Female',\
    \ 'Mother'),\n(NULL, 'Doreen', 18, 'Female', 'Sister'),\n(NULL, 'Jace', 13, 'Female',\
    \ 'Adoptive Sister'),\n(NULL, 'Benson', 22, 'Male', 'Brother'),\n(NULL, 'Timothy',\
    \ 23, 'Male', 'Cousin');\n```\n\nWhen we select all the records in the table,\
    \ we see something like this:\n\n```\n+----------+-----------+---------------+--------+-----------------+\n\
    | MemberID | FirstName | LastName | Age | Gender | Relationship     |\n+----------+-----------+---------------+--------+-----------------+\n\
    |       1 | Robert    | Williams |  52 | Male   | Father          |\n|       2\
    \ | Martha    | Williams |  49 | Female | Mother          |\n|       3 | Doreen\
    \    | Williams |  18 | Female | Sister          |\n|       4 | Jace      | Williams\
    \ |  13 | Female | Adoptive Sister |\n|       5 | Benson    | Williams |  22 |\
    \ Male   | Brother         |\n|       6 | Timothy   | James    |  23 | Male  \
    \ | Cousin           |\n+----------+-----------+---------------+--------+-----------------+\n\
    ```\n"
