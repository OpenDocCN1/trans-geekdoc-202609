  trans: "\n\n```php\nif ($x < 10) {\n    echo \"$x is less than 10!\";\n}\n?>\n```\n\
    Output:\n5 is less than 10!\n\n### if…elseif 语句\n\n`if…elseif` 语句在表达式求值为真时执行 `if`\
    \ 代码块，在当表达式求值为假时执行另一个 `if` 代码块。\n\n让我们稍微修改一下之前的示例。以下代码将输出“50 is greater than 20!”，它位于第二个代码块，因为它满足第二个条件。赋值给\
    \ `$x` 的值是 `50`，它在第一个条件上返回 `false`：\n\n```php\n<?php\n$x = 50;\nif ($x < 10) {\n\
    \    echo “$x is less than 10!”;\n} else if ($x > 20) {\n    echo “$x is greater\
    \ than 20!”;\n}\n?>\n```\nOutput:\n50 is greater than 20!\n\n### if…elseif…else\
    \ 语句\n\n与 `if…elseif` 语句相同。区别在于当所有其他条件都失败时，将执行最后一个代码块。\n\n下面的示例将输出“15 is between\
    \ 10 and 20!”，因为 `$x` 的值为 `15`。它需要小于 10 以满足第一个条件，大于 20 以满足第二个条件，否则它就于 10 和 20\
    \ 之间：\n\n```php\n<?php\n$x = 15;\nif ($x < 10) {\n    echo “$x is less than 10!”;\n\
    } else if ($x > 20) {\n    echo “$x is greater than 20!”;\n}else {\n    echo “$x\
    \ is between 10 and 20!”;\n}\n?>\n```\nOutput:\n15 is between 10 and 20!\n\n###\
    \ switch 语句\n\n`switch` 语句将表达式的值与 `cases` 进行匹配。如果找到匹配项，则执行与 `case` 关联的代码。如果未找到匹配项，则使用\
    \ `default` 语句。`break` 语句防止代码跳转到下一个 `case`。\n\n在下面的示例中，将对 `$lunch` 的值进行所有 `cases`\
    \ 的检查，看是否有任何一个匹配。在这种情况下，输出将是“Burgers are yummy!”，因为那是对应的 case。\n\n```php\n<?php\n\
    $lunch = “burger”;\nswitch ($lunch) {\n    case “cereal”:\n        echo “Cereal\
    \ You had breakfast for lunch!”;\n        break;\n    case “salad”:\n        echo\
    \ “Salad makes a healthy lunch!”;\n        break;\n    case “burger”:\n      \
    \  echo “Burgers are yummy!”;\n        break;\n    default:\n        echo “looks\
    \ you skipped lunch. That is not good!”;\n}\n?>\n```\nOutput:\nBurgers are yummy!\n\
    \n## 循环\n\n以下是 PHP 中的循环语句列表：\n\n* `while`\n* `do…while`\n* `for`\n* `foreach`\n\
    \n我们将详细介绍每一个循环。\n\n### while 循环\n\n`while` 循环在指定条件保持为真的情况下重复执行代码块。\n\n下面的代码显示了当\
    \ `$x` 小于或等于 `5` 时的值。如果条件为真，则将其输出到屏幕上，然后递增，直到条件返回为假：\n\n```php\n<?php\n$x = 1;\n\
    while ($x <= 5) {\n    echo “The value of x is: ” . $x . “<br />”;\n    $x++;\n\
    }\n?>\n```\nOutput:\nvalue of x is: 1\nvalue of x is: 2\nvalue of x is: 3\nvalue\
    \ of x is: 4\nvalue of x is: 5\n\n### do…while 循环\n\n`do…while` 循环只要指定条件保持为真就会重复执行代码块。\n\
    \n下面的代码显示了当 `$x` 大于或等于 `0` 时的值。它至少执行一次代码，将其输出到屏幕，然后递减，直到条件返回为假：\n\n```php\n<?php\n\
    $x = 5;\ndo {\n    echo “The value of x is: ” . $x . “<br />”;\n    $x--;\n} while\
    \ ($x >= 0);\n?>\n```\nOutput:\nvalue of x is: 5\nvalue of x is: 4\nvalue of x\
    \ is: 3\nvalue of x is: 2\nvalue of x is: 1\nvalue of x is: 0\n\n### for 循环\n\n\
    `for` 循环按照指定的次数执行代码块。为了让循环工作需要三件事：\n\n1. 初始化：这是声明变量并设置值的地方 `$x = 1`。\n2. 条件：检查循环是否继续\
    \ `$x <= 5`。\n3. 递增：当循环结束时增加 `$x` 的值 `$x++`。\n\n```php\n<?php\nfor ($x = 1; $x\
    \ <= 5; $x++) {\n    echo “The value of x is: ” . $x . “<br />”;\n}\n?>\n```\n\
    Output:\nvalue of x is: 1\nvalue of x is: 2\nvalue of x is: 3\nvalue of x is:\
    \ 4\nvalue of x is: 5\n\n### foreach 循环\n\n遍历数组中每个元素的循环。它会对数组中的每个元素执行代码块。\n\n\
    下面的代码遍历数组中的所有元素，并将元素输出到屏幕：\n\n```php\n<?php\n$foods = array(“cereal”, “salad”,\
    \ “burgers”, “fries”);\nforeach ($foods as $food) {\n    echo “$food <br />”;\n\
    }\n?>\n```\n\n## 函数\n\n函数是程序中可以重复使用的代码段。函数接收一个或多个输入（称为参数），并对它们进行某些操作。函数在完成后有时会返回一个值。\n\
    \n关于函数的几点注意事项：\n\n* 它们对大小写不敏感\n* 在被代码调用之前，它们不会自动执行\n* PHP 有超过 1000 个内置函数可以满足你的需求\n\
    \n### 创建函数\n\n创建自己的函数非常简单；只需以 `function` 关键字开头，后跟函数名。之后将你的代码放在两个大括号 `{` 和 `}`\
    \ 之间，分别称为左括号和右括号。现在你可以根据需要多次使用该函数。这节省了每次都重写代码的麻烦。\n\n下面的代码演示了一个向屏幕输出消息的函数\n\n\
    ```php\n<?php\nfunctionechoMessage() {\n    echo “Hello, I am a PHP function!”;\n\
    }\nechoMessage();\n?>\n```\n\n### 函数参数\n\n有时你可以向函数传递信息以便对其进行操作。这些信息被称为参数，并放在括号中。你可以通过逗号分隔添加多个参数。\n\
    \n下面的示例显示了一个接收两个数字作为参数并进行相减的函数：\n\n```php\n<?php\nfunctionsubFunction($num1, $num2)\
    \ {\n    $diff = $num1 - $num2;\n    echo “The difference between $num1 and $num2\
    \ is: ” . $diff;\n}\n?>\n```\n\n"
- fmt: "\n```php\nsubFunction(5, 6);\n?>\n```\n\nOutput:\nThe difference between 5\
    \ and 6 is: -1\n\n### Function that Return a Value\n\nA function can not only\
    \ accept information, but they can also give it back in form of a return value.\
    \ Just write the `return` keyword followed by the value or object you wish the\
    \ function to return. This stops execution of the function.\n\nIn the following\
    \ example we use the function to add to numbers and then return the sum. We then\
    \ assign the sum of numbers to the variable `$return_val` then output that to\
    \ the screen.\n\n```php\n<?php\nfunction addFunction($num1, $num2) {\n    $sum\
    \ = $num1 + $num2;\n    return $sum;\n}\n$return_val = addFunction(20, 15);\n\n\
    echo \"The value returned by the function is: \" . $return_val;\n?>\n```\n\nOutput:\n\
    The value returned by this function is: 5\n\n### Default Values for Parameters\n\
    \nIn case a function that needs parameters is called without any parameters, we\
    \ can specify a default value for that parameter instead.\n\nIn the example below,\
    \ we call a function three times. We don’t pass a value in the first function\
    \ call just so we demonstrate the difference:\n\n```php\n<?php\nfunction PrintName($name\
    \ = \"Jack\") {\n    echo \"Hi, my name is $name <br />\";\n}\nPrintName(); //\
    \ will use the default value of Jack\nPrintName(\"Jill\");\nPrintName(\"Adam\"\
    );\n?>\n```\n\nOutput:\nHi, my name is Jack\nHi, my name is Jill\nHi, my name\
    \ is Adam\n\n## Arrays\n\nAn array is data structure that can store multiple values\
