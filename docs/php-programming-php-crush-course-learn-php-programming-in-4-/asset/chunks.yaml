    \ a very simple website where you add records to a database of our favorite artists.\n\
    \nChapter 4 - Hour 4: PHP and MySQL: The Dynamic Duo\n\n“A language that doesn’t\
    \ affect the way you think is not worth knowing” – Alan J. Perils\n\nIn this chapter\
    \ we will cover:\n\n*   Creating the Family Database\n\n*   Creating and Inserting\
    \ Values into the Family Members Table\n\n*   Creating a PHP configuration File\
    \ the Website\n\n*   Creating the Index Page\n\n*   Creating the Form to Input\
    \ Data\n\n*   Creating the Member Added Page\n\nThink of seeing your two favorite\
    \ artists performing together. This is what it should feel like at this movement\
    \ as we are about see PHP and MySQL (mostly PHP) work together to create a website.\
    \ By now you should be able to imagine the good music these two can make together.\n\
    \nThe website is simple; let’s say you want to keep track of your family members\
    \ online. We will create a simple website that lets you add them (if you like\
    \ them) to a database so you don’t always have to remember who they are. We will\
    \ forego a lot of security features just to keep it simple and other functions\
    \ but this simple example should be enough to get you on your way.\n\nBy now you\
    \ have a fairly good grasp of PHP and can use the command line to type SQL commands.\
    \ We will need both. So make sure both Apache and MySQL are running in XAMPP (See\
    \ Chapter 1 and Chapter 3 on how to enable Apache and MySQL respectively).\n\n\
    So let us get started!\n\n## Creating Family Database\n\nOpen up the command line\
    \ and fire up the MySQL Client and login as the ‘root’ (see Chapter 3).\n\nCreate\
    \ the Database by entering the following code:\n\nCREATE DATABASE Family;\n\n\
    Then select the database in order to use it:\n\nUSE Family;\n\n## Create and Inserting\
    \ Values into the Family Members Table\n\nNow we create the table that stores\
    \ the information. It should look like this:\n\n| Family Members |\n\n| --- |\n\
    \n| Member ID |\n\n| First Name |\n\n| Last Name |\n\n| Age |\n\n| Gender |\n\n\
    | Relationship |\n\nThe code to create the tables looks as follows:\n\nCREATE\
    \ TABLE FamilyMembers\n\n(\n\n              MemberIDint unsigned NOT NULL auto\\\
    _increment PRIMARY KEY,\n\n              FirstNamevarchar(80) NOT NULL,\n\n             \
    \ LastNamevarchar(80) NOT NULL,\n\n              Age int(3) unsigned NOT NULL,\n\
    \n              Gender ENUM ('Male', 'Female') NOT NULL,\n\n              Relationship\
    \ varchar(80) NOT NULL\n\n);\n\nWhen we describe the table we get something like\
    \ this:\n\n+--------------+-----------------------+------+-----+---------+----------------+\n\
    \n| Field        | Type                  | Null | Key | Default | Extra         \
    \ |\n\n+--------------+-----------------------+------+-----+---------+----------------+\n\
    \n| MemberID     | int(10) unsigned      | NO   | PRI | NULL    | auto\\_increment\
    \ |\n\n| FirstName    | varchar(80)           | NO   |     | NULL    |               \
    \ |\n\n| LastName     | varchar(80)           | NO   |     | NULL    |               \
    \ |\n\n| Age          | int(3) unsigned       | NO   |     | NULL    |               \
    \ |\n\n| Gender       | enum('Male','Female') | NO   |     | NULL    |               \
    \ |\n\n| Relationship | varchar(80)           | NO   |     | NULL    |               \
    \ |\n\n+--------------+-----------------------+------+-----+---------+----------------+\n\
    \nThen we insert values into the tables:\n\nINSERT INTO FamilyMembers VALUES \n\
    \n(NULL, 'Robert', 'Williams', 52, 'Male', 'Father'),\n\n(NULL, 'Martha', 'Williams',\
    \ 49, 'Female', 'Mother'),\n\n(NULL, 'Doreen', 'Williams', 18, 'Female', 'Sister'),\n\
    \n(NULL, 'Jace', 'Williams', 13, 'Female', 'Adoptive Sister'),\n\n(NULL, 'Benson',\
    \ 'Williams', 22, 'Male', 'Brother'),\n\n(NULL, 'Timothy', 'James', 23, 'Male',\
    \ 'Cousin');\n\nWhen we select all the records in the table, we see something\
    \ like this:\n\n+----------+-----------+----------+-----+--------+-----------------+\n\
    \n| MemberID | FirstName | LastName | Age | Gender | Relationship    |\n\n+----------+-----------+----------+-----+--------+-----------------+\n\
    \n|        1 | Robert    | Williams |  52 | Male   | Father          |\n\n|       \
    \ 2 | Martha    | Williams |  49 | Female | Mother          |\n\n|        3 |\
    \ Doreen    | Williams |  18 | Female | Sister          |\n\n|        4 | Jace     \
    \ | Williams |  13 | Female | Adoptive Sister |\n\n|        5 | Benson    | Williams\
    \ |  22 | Male   | Brother         |\n\n|        6 | Timothy   | James    |  23\
    \ | Male   | Cousin          |"
