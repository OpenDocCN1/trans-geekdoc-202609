- fmt: "\n# PHP Programming\n\nPHP Crush Course! Learn PHP Programming in 4 hours!\
    \ PHP for Beginners - Smart and Easy ways to learn PHP & MySQL\n\n## Book Description\n\
    \n\"Learn PHP in 4 Hours!\" promises to give you complete introductory knowledge\
    \ to PHP and MySQL. You will be able to get started on your journey to building\
    \ awesome dynamic websites that help you achieve your dreams in no time.\n\nThis\
    \ book contains definitions that are straightforward, examples that are short\
    \ and sweet and explanations that ensure mastery of the basics very quickly.\n\
    \nYou will be able to blast through this book while gaining deep knowledge that\
    \ prepares you to tackle the advanced features of both PHP and MySQL while simultaneously\
    \ being able to do something very useful with the best practices. This is an amazing\
    \ educational book!\n\n### What is in the book?\n\nIntroduction to PHP Programming\n\
    \nChapter 1 – Hour 1: Installation and PHP \nWe discuss installation of a web\
    \ server package and show how to use it to run PHP script. We also cover some\
    \ of the basics of PHP\n\nChapter 2 – Hour 2: More PHP Basics\nWe dive deeper\
    \ into the basics of PHP\n\nChapter 3 – Hour 3: MySQL Basics\nWe discuss how to\
    \ access the command line to enter MySQL commands and use them to work with data\
    \ in the database\n\nChapter 4 – Hour 4: PHP and MySQL\nWe consolidate the knowledge\
    \ and use both PHP and MySQL to create a very simple website with dynamic content\n\
    \nLet's get started! \n\n## Table of Content\n\n- [Introduction](#part0000_split_003.html#introPHP)\n\
    - [Chapter 1 - Hour 1: Installing and PHP Basics](#part0000_split_010.html#ch1php)\n\
    - [Chapter 2 - Hour 2: More PHP Basics](#part0000_split_030.html#ch2php)\n- [Chapter\
    \ 3 - Hour 3: MySQL Basics](#part0000_split_051.html#ch3php)\n- [Chapter 4 - Hour\
    \ 4: PHP and MySQL: The Dynamic Duo](#part0000_split_075.html#ch4php)\n- [Conclusion](#part0000_split_099.html#ConclPHP)\n\
    \n## Introduction\n\n“You cannot open a book without learning something.” - Confucius\n\
    \nPeople learn PHP for many reasons. Every language has a bit of a learning curve\
    \ and one can get bogged down in two much theory that it can make it unappealing\
    \ because the task ahead seems odious. Maybe you want to build a simple blog or\
    \ something as advanced as a massive online e-commerce site with thousands of\
    \ products up for sale. It is hard to know where to start getting the needed knowledge.\n\
    \nIf you are looking for a way to get going fast in order to make you visions\
    \ a reality then you have come to the right place! This books aims at getting\
    \ you started on your journey to PHP and MySQL mastery in 4 hours! It does this\
    \ by telling you the most important stuff you need to know to get started quickly\
    \ for the absolute beginner, in either PHP or MySQL, so you get to doing useful\
    \ stuff as quickly as possible.\n\nThis is not a comprehensive guide to PHP and\
    \ MySQL that covers all the aspects but a crash course that gives you a practical\
    \ guide on how to do really cool basic things with PHP and MySQL on their own\
    \ and together. The two can get pretty advanced but with the knowledge in this\
    \ book, you should be able to get that prototype up and running as you tackle\
    \ the more advanced topics.\n\nA little knowledge of HTML and CSS will be needed\
    \ before because, really, PHP is just a language that is used to produce web pages\
    \ and its final output is HTML. We will go over all the basics of PHP and MySQL\
    \ and finally put it all together and build simple web site where you will be\
    \ able to store a records of your favourite artists using the dynamic duo.\n\n\
    The basics are all you need to get going in 4 hours (and this book, of course)\
    \ is all you need.\n\nBut what is PHP or MySQL and why do you need it to accomplish\
    \ this previously impossible task?\n\n### A Short Introduction to PHP\n\nPHP stands\
    \ for Hypertext Processor. It is a server side scripting language that is used\
    \ to produce dynamic web content among other things. This means that everything\
    \ PHP does is not done on the computer that is used to view the web pages, called\
    \ the client, but a specialised computer called a server that houses all the webpages\
    \ that you are viewing on the client machine.\n\nBeing a scripting language means\
    \ that PHP can't really be used to make standalone applications that run on your\
    \ computer as it is designed to only do things when an event happens within web\
    \ pages like; clicking on a link or getting form data when a web form is sent.\n\
    \nYou can embed PHP into your HTML web pages and produce pages that are customised\
    \ according to the information you get from your users. This ends up making webpages\
    \ more exciting rather than if they were just static.PHP can be used to produce\
    \ web pages because its final output is HTML.\n\nIt is very efficient in the server\
    \ side, widely used, cross-platform (runs on Windows, Linux, UNIX, Mac OS X, etc.)\
    \ and easier to learn than any other fully featured language like C, Java or Perl.\
    \ \n\nPHP is also very powerful. If you ever doubt its power, just look carefully\
    \ at the link in your browser next time you decide to log on to Facebook. You\
    \ will notice that the largest social networking site on the planet is powered\
    \ by PHP! Even Wikipedia (That site which tells you everything you need to know)\
    \ is powered by PHP. That is the power that is behind PHP, and it makes it a good\
    \ alternative to its competitors such as Microsoft’s Active Server Pages (ASP).\n\
    \nIt also has an active community that can really help you in a bind and always\
    \ active.\n\nAccording to the [http://www.w3schools.com](http://www.w3schools.com)\
    \ page; this is what PHP will allow you to do:\n- PHP can generate dynamic content\n\
    - PHP can create, open, read, write, delete, and close files on the server\n-\
    \ PHP can collect form data\n- PHP can send and receive cookies\n- PHP can add,\
    \ delete, modify data in your database (that is why it is a perfect match for\
    \ MySQL)\n- PHP can encrypt data\n\n### A Short Introduction to MySQL\n\nMySQL\
    \ is a popular open source relational database that uses SQL as its base. It enables\
    \ you to store, retrieve and manipulate data. It is a highly efficient and scalable\
    \ solution that is also cost effective.\n\nMany web based programs (including\
    \ computer programs) use databases to store their information. Things like social\
    \ applications need a place to store user information, pictures, comments etc.\
    \ that is where a database like MySQL comes in handy and makes storing and retrieving\
    \ large amounts of information a breeze.\n\nSQL, often pronounced as sequel, stands\
    \ for Structured Query Language. It is simply a language designed for management\
    \ of data by databases like MySQL. They use SQL to send and retrieve data using\
    \ specialised commands that really aren’t that hard to learn. And most importantly,\
    \ for this book, you can embed SQL into programming languages like PHP.\n\nAlso,\
    \ MySQL is open source and is available for free and can be changed by modifying\
    \ the source code, if particular features don’t suit your fantacy.\n\n## What\
    \ We Will Cover in This Book\n\nThis book is separated into four main chapters\
    \ or hours that help you get to the heart of PHP and SQL and send you on your\
    \ way to being a master in no time.\n\nIn the first hour we will spend time installing\
    \ the much needed web server package called XAMPP. I recommend that you download\
    \ it here: [https://www.apachefriends.org/index.html](https://www.apachefriends.org/index.html)\
    \ before we start that chapter. This will enable us to run examples throughout\
    \ this book. Then we shall pick a text editor for our PHP code. Then we will look\
    \ at how to run PHP scripts and, finally, we shall cover some of the basics of\
    \ PHP, such as comments, variables, constants and operators.\n\nThe examples in\
    \ this book can be typed out or, to save time, copied and then pasted into your\
    \ code editor or command line interface.\n\nIn the second hour, we shall continue\
    \ with PHP and cover conditional statements, Loops, Arrays and functions. After\
    \ this chapter, you should consider yourself well acquainted with PHP to tackle\
    \ further advanced topics.\n"
