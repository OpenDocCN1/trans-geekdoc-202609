    \ they run out elements. Next we discussed how to call code multiple times in\
    \ a program by putting them in a function, and also how to pass them information\
    \ and have them return values to us. Finally, we looked into numeric and associative\
    \ arrays. We created them and returned values by either accessing them directly\
    \ or looping through them.\n\nNow you are ready to take a breather from PHP and\
    \ make another cup of coffee. This only gets more interesting!\n\nChapter 3 -\
    \ Hour 3: MySQL Basics\n\n“Tell me and I forget, teach me and I may remember,\
    \ involve me and I learn.” - [Benjamin Franklin](http://www.goodreads.com/author/show/289513.Benjamin_Franklin)\n\
    \nIn this chapter we will cover: \n\n*   Start MySQL\n\n*   Create and Deleting\
    \ Databases\n\n*   Creating, Reading, Updating and Deleting Tables (CRUD)\n\n\
    Now that we have looked into PHP, let's look at what enables the PHP to populate\
    \ webpages with content. That would be a database such as MySQL. We will look\
    \ at most of the things you need to know in order to consider yourself a master\
    \ of the basics of MySQL and do what you need to for that next step in achieving\
    \ your dreams.\n\n This will be a breeze as we will learn how to do some really\
