    \ define('DB\\_PASSWORD','');\n\n              define('DB\\_HOST','localhost');\n\
    \n              $conn = @mysqli\\_connect(DB\\_HOST, DB\\_USER, DB\\_PASSWORD,\
    \ DB\\_NAME);\n\n?>\n\nNow we need to check if the connections succeeded or not.\
    \ If it didn’t, we display the appropriate error message and stop execution of\
