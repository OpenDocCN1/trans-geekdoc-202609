    \ `$dairy[0] = \"yogurt\"`, `$dairy[1] = \"ice cream\"`, `$dairy[2] = \"cheese\
    \ cake\"`\n\nThe example below shows how to get values from a numeric array using:\n\
    \n```php\n<?php\n$dairy = array(\"yogurt\", \"ice cream\", \"cheese cake\");\n\
    // accessing values by their index\necho \"I to eat \" . $dairy[0] . \", \" .\
    \ $dairy[1] . \" and \" . $dairy[2] . \"!\";\n// PHP built in function that returns\
    \ the number of elements in the array\n$arrayCount = count($dairy);\n// looping\
    \ through a numeric array using for loop\nfor ($i = 0; $i < $arrayCount; $i++)\
    \ {\n    echo $dairy[$i] . \"<br />\";\n}\n?>\n```\n\nOutput:\nI to eat yoghurt,\
    \ ice cream and cheese cake!\nyogurt\nice cream\ncheese cake\n\n### Associative\
    \ Array\n\nUse strings as their index that make for a strong association between\
    \ key and value.\n\nThere are two ways to create associative arrays. We will demonstrate\
    \ by using prices of suits:\n1. First method: `$suit_prices = array(\"batman\"\
    \ => 4000, \"arrow\" => 1500, \"superman\" => 0);`\n2. Second method: `$suit_prices[\"\
    batman\"] => 4000;`, `$suit_prices[\"arrow\"] => 1500;`, `$suit_prices[\"superman\"\
    ] => 0;`\n\nNote: When outputting values of associative arrays, don’t put the\
    \ associative array inside double quotes, otherwise, the values won’t get outputted.\n\
    \nThe example below demonstrates how to access value for an associative array:\n\
    \n```php\n<?php\n$suit_prices = array(\"batman\" => 4000, \"arrow\" => 1500, \"\
