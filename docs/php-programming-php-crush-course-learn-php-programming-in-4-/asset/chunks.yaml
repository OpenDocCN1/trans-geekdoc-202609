    \ 13, \"2005-06-01\");\n\nSeems we like Coldplay a bit too much. Who doesn’t?\n\
    \n## The SELECT Statement\n\nThe SELECT statement allows you to retrieve data\
    \ from a data base. The following example demonstrates how to use SELECT statement\
    \ to retrieve all the records from the Albums table:\n\nSELECT \\* FROM Albums;\n\
    \nThe output should be something like this:\n\n+---------+---------------------------+--------------+-----------+----------------+--------------+\n\
    \n| AlbumID | AlbumName                 | AlbumArtist  |AlbumType | NumberOfTracks\
    \ | DateReleased |\n\n+---------+---------------------------+--------------+-----------+----------------+--------------+\n\
    \n|       1 | Rush of Blood to the Head | Coldplays    | A         |            \
    \ 12 | 2002-08-02   |\n\n|       2 | Dirty Gold                | Angel Haze  \
    \ | A         |             16 | 2013-12-30   |\n\n|       3 | Back to the Woods        \
    \ | Angel Haze   | M         |             13 | 2015-09-15   |\n\n|       4 |\
    \ Parachutes                | Coldplay     | A         |             10 | 1999-07-10  \
    \ |\n\n|       5 | 1989 (Delux Edition)      | Taylor Swift | A         |            \
    \ 15 | 2014-10-27   |\n\n|       6 | Prospekts March           | Coldplay    \
    \ | E         |              8 | 2008-09-21   |\n\n|       7 | Random Access Memories   \
    \ | Daft Punk    | A         |             14 | 2013-05-13   |\n\n|       8 |\
    \ X & Y                     | Coldplay     | A         |             13 | 2005-06-01  \
    \ |\n\n+---------+---------------------------+--------------+-----------+----------------+--------------+\n\
    \nTo select specific columns we use the following SELECT statement:\n\nSELECT\
    \ AlbumName, AlbumArtist, DateReleased, NumberOfTracks\n\nFROM Albums;\n\nThe\
    \ output should be:\n\n+---------------------------+--------------+--------------+----------------+\n\
    \n| AlbumName                 | AlbumArtist  |DateReleased | NumberOfTracks |\n\
    \n+---------------------------+--------------+--------------+----------------+\n\
    \n| Rush of Blood to the Head | Coldplays    | 2002-08-02   |             12 |\n\
    \n| Dirty Gold                | Angel Haze   | 2013-12-30   |             16 |\n\
    \n| Back to the Woods         | Angel Haze   | 2015-09-15   |             13 |\n\
    \n| Parachutes                | Coldplay     | 1999-07-10   |             10 |\n\
    \n| 1989 (Delux Edition)      | Taylor Swift | 2014-10-27   |             15 |\n\
    \n| Prospekts March           | Coldplay     | 2008-09-21   |              8 |\n\
    \n| Random Access Memories    | Daft Punk    | 2013-05-13   |             14 |\n\
    \n| X & Y                     | Coldplay     | 2005-06-01   |             13 |\n\
    \n+---------------------------+--------------+--------------+----------------+\n\
    \n## The WHERE Clause\n\nSometimes you will need to filter out records and select\
    \ only those records that fulfil a certain criterion. This is where the WHERE\
    \ clause comes into play as the following example demonstrates:\n\nSELECT AlbumName,\
    \ AlbumArtist, DateReleased, NumberOfTracks\n\nFROM Albums\n\nWHERE AlbumArtist\
    \ = 'Coldplay'\n\nThis should output:\n\n+-----------------+-------------+--------------+----------------+\n\
    \n| AlbumName       | AlbumArtist | DateReleased | NumberOfTracks |\n\n+-----------------+-------------+--------------+----------------+\n\
    \n| Parachutes      | Coldplay    | 1999-07-10   |             10 |\n\n| Prospekts\
    \ March | Coldplay    | 2008-09-21   |              8 |\n\n| X & Y           |\
    \ Coldplay    | 2005-06-01   |             13 |\n\n+-----------------+-------------+--------------+----------------+\n\
    \nNOTE: This example was done on a text field, hence, the single quotes on the\
    \ value we want to check against. You can check against numeric fields too. Just\
    \ remove the single quotes and make sure you type a numeric value that corresponds\
    \ to the numeric data type of that field.\n\nYou can further filter out the record\
    \ using the ANDandOR operators to narrow down the results further:\n\nThe AND\
    \ operator displays records that match both conditions of the criterion:\n\nSELECT\
    \ AlbumName, AlbumArtist,AlbumType\n\nFROM Albums\n\nWHERE AlbumArtist = 'Coldplay'\
    \ AND AlbumType = 'A';\n\nThe output should display results where the AlbumName\
    \ is Coldplay and the AlbumType is ‘L’. If any record doesn’t match that criterion,\
    \ it will be excluded:\n\n+------------+-------------+-----------+\n\n| AlbumName \
    \ |AlbumArtist | AlbumType |\n\n+------------+-------------+-----------+\n\n|\
    \ Parachutes | Coldplay    | A         |\n\n| X & Y      | Coldplay    | A        \
    \ |\n\n+------------+-------------+-----------+\n\nThe OR operator is used to\
    \ return records that match either of the one of the criterion specified.\n\n\
    SELECT AlbumName, AlbumArtist, AlbumType\n\nFROM Albums\n\nWHERE AlbumType = 'E'\
    \ OR AlbumType = 'M';\n\nIn the above example, any record that has either AlbumType\
    \ of ‘E’ or AlbumType of ‘M’ will be displayed. The rest will be excluded. The\
    \ output should be as follows:\n\n+-------------------+-------------+-----------+\n\
    \n| AlbumName         | AlbumArtist | AlbumType |\n\n+-------------------+-------------+-----------+\n\
    \n| Back to the Woods | Angel Haze  | M         |\n\n| Prospekts March   | Coldplay   \
    \ | E         |\n\n+-------------------+-------------+-----------+\n\n## The ORDER\
    \ BY Keyword\n\nIn order to sort the result\\_set (the table returned by a SELECT\
    \ statement) by one or more columns, we use the ORDER BY keyword and specify whether\
    \ it should be in descending or ascending order:\n\nSELECT AlbumName, AlbumArtist\n\
    \nFROM Albums\n\nORDER BY AlbumArtist ASC;\n\nNOTE: By default, they are sorted\
    \ in ascending order. This means that if we leave out the ASC keyword, it would\
    \ not make a difference. We can sort them in descending order by replacing ASC\
    \ with DESC in the above example.\n\nThat should output records in ascending order\
    \ based on the name of the artist of the album:\n\n+---------------------------+--------------+\n\
    \n| AlbumName                 | AlbumArtist  |\n\n+---------------------------+--------------+\n\
    \n| Dirty Gold                | Angel Haze   |\n\n| Back to the Woods        \
    \ | Angel Haze   |\n\n| Parachutes                | Coldplay     |\n\n| Prospekts\
    \ March           | Coldplay     |\n\n| X & Y                     | Coldplay    \
    \ |\n\n| Rush of Blood to the Head | Coldplays    |\n\n| Random Access Memories   \
    \ | Daft Punk    |\n\n| 1989 (Delux Edition)      | Taylor Swift |\n\n+---------------------------+--------------+\n\
    \n## The UPDATE Statement"
