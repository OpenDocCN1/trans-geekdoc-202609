  trans: "\n\n```html\n<th>Relationship</th>\n</tr>';\n```\n\n好了，列的部分就完成了。现在我们需要动态地逐行显示行，以防有很多数据。以下代码实现了这一功能：\n\
    \n```php\nwhile ($row = mysqli_fetch_array($response)){\n\n    echo '<tr\n   \
    \             <td>' . $row['MemberID'] . '</td>\n                <td>' . $row['FirstName']\
    \ . '</td>\n                <td>' . $row['LastName'] . '</td>\n              \
    \  <td>' . $row['Age'] . '</td>\n                <td>' . $row['Gender'] . '</td>\n\
    \                <td>' . $row['Relationship'] . '</td>\n          </tr>';\n}\n\
    ```\n\n在上面的代码中，我们使用循环来遍历通过 `mysqli_fetch_array()` 函数从 `response` 获取的数组，并将 `$response`\
    \ 变量作为参数传递。我们将从函数获取的值（也是一个包含行字段的数组）赋值给变量 `$row`，并在周围嵌入 HTML 标签，从而根据数组中元素的数量动态地创建新的表格行。\n\
    \n然后我们关闭表格，动态显示数据就完成了：\n\n```php\necho '</table>';\n```\n\n但如果因为某些错误导致数据库没有响应该怎么办？这种情况可能会发生。在这种情况下，我们在\
    \ `if` 语句之后添加一个 `else` 语句，使用 `mysqli_error` 函数显示错误信息，并将连接作为参数传递：\n\n```php\nelse{\
    \ \n    echo \"Cound not get a response from database \" .             mysqli_error($conn);\n\
    }\n```\n\n最后，我们使用 `mysqli_close` 函数关闭数据库连接，并将连接作为参数，索引页就写完了：\n\n```php\nmysqli_close($conn);\n\
