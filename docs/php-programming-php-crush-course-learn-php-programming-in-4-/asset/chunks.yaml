    together to create dynamic content for a simple website we were making a list
    of our favorite family members and their details.


    # Conclusion

    All this is knowledge for the absolute beginner who needs something to quickly
    guide them with clear examples and explanations. I wish you well in your futures
    endeavors and I believe you are well on your way to achieving your dreams. Glad
    I could help.

