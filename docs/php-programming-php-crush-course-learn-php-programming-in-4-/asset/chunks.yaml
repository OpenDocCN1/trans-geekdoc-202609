    \ the website. The code for file should look something like this:\n\n<!DOCTYPE\
    \ html>\n\n<html>\n\n<head>\n\n<link rel=\"stylesheet\" type=\"text/css\" href=\"\
    css/main.css\">\n\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/table\\\
    _styling.css\">\n\n</head>\n\n<body>\n\n<div id=\"container\">\n\n<div id=\"header\"\
    >\n\n<h2>My Family</h2>\n\n</div>\n\n<div id=\"btn\\_add\">\n\n<a href=\"form.php\"\
    >ADD</a>\n\n</div>\n\n<div id=\"content\">\n\n<?php\n\nrequire\\_once('config.php');\n\
    \n                                                        $sql = \"SELECT MemberID,\
    \ FirstName, LastName, Age, Gender, Relationship\n\n                           \
    \                                                         FROM FamilyMembers\"\
    ;\n\n                $response = @mysqli\\_query($conn, $sql);\n\n             \
    \                                           if ($response){\n\necho '<table>\n\
    \n                                                                                   \
    \ <tr>\n\n                                                                     \
    \                             <th>Member ID</th>\n\n                           \
    \                                                                       <th>First\
    \ Name</th>\n\n                                                                     \
    \                             <th>Last Name</th>\n\n                           \
    \                                                                       <th>Age</th>\n\
    \n                                                                                   \
    \               <th>Gender</th>\n\n                                                       \
    \                                           <th>Relationship</th>\n\n             \
    \                                                                       </tr>';\n\
    \n                                                                      while\
    \ ($row = mysqli\\_fetch\\_array($response)){\n\n                                         \
    \                                           echo '<tr>\n\n                           \
    \                                                                       <td>'\
    \ . $row\\['MemberID'\\] . '</td>\n\n                                         \
    \                                                         <td>' . $row\\['FirstName'\\\
    ] . '</td>\n\n                                                                     \
    \                             <td>' . $row\\['LastName'\\] . '</td>\n\n             \
    \                                                                                    \
    \ <td>' . $row\\['Age'\\] . '</td>\n\n                                         \
    \                                                         <td>' . $row\\['Gender'\\\
    ] . '</td>\n\n                                                                     \
    \                             <td>' . $row\\['Relationship'\\] . '</td>\n\n             \
    \                                                                       </tr>';\n\
    \n                                                                      }\n\n\
                                                                          echo '</table>';\n\
    \n                                                        } \n\n             \
    \                                           else { \n\n                           \
    \                                           echo \"Cound not get a response from\
    \ database \" . mysqli\\_error($conn);\n\n                                         \
    \               }\n\n                                                        mysqli\\\
    _close($conn);\n\n                                          ?>\n\n</div>\n\n</div>\n\
    \n</body>\n\n</html>\n\nThere is quite a lot going on here but we will not get\
    \ into it all. We also won’t be discussing any of the HTML and CSS as this book\
    \ assuming you have some basic knowledge of those and how to link external style\
    \ sheets.\n\nFirstly, in the PHP code, we include the config.php file by calling\
    \ the require\\_once function and passing the path to the file as a parameter\
    \ (we pass in a relative path since the configuration file). This will allow us\
    \ to access our database connection we defined in that file:\n\nrequire\\_once('config.php');\n\
    \nNext we create the query string that will be used to retrieve data from database\
    \ using SQL and assign it to the variable$sql:\n\n$sql = \"SELECT MemberID, FirstName,\
    \ LastName, Age, Gender, Relationship FROM FamilyMembers\";\n\nWe use aSELECTstatement\
    \ to select the fields we wish to display from the FamilyMemberstable following\
    \ the same syntax rules we would use on the command line.\n\nThen we send the\
    \ query to the database using the mysqli\\_query function and pass in the connection\
    \ variable, which is now accessible because we included the config.php, and the\
    \ query string then assign the return value to the $response variable:\n\n$response\
    \ = @mysqli\\_query($conn, $sql);\n\nAfter that, we check if we got a response\
    \ from the database using an if statement:\n\nif ($response){\n\n}\n\nIf we got\
    \ a response from the database,  we create a with a table row and table headers\
    \ by embedding HTML in PHP code and echoing that inside the if statement:\n\n\
    echo '<table>\n\n              <tr>\n\n                            <th>Member\
    \ ID</th>\n\n                            <th>First Name</th>\n\n             \
    \               <th>Last Name</th>\n\n                            <th>Age</th>\n\
    \n                            <th>Gender</th>"
