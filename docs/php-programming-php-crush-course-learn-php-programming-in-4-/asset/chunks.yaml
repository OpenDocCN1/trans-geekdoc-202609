  trans: '

    回顾我们目前展示的一些记录，似乎我们在其中一条记录中犯了错误，将 Coldplay 命名为了 Coldplays。这可以通过使用 `UPDATE` 语句更新该记录来纠正。


    如果现在现在使用以下代码输出该记录：


    ```sql

    SELECT AlbumID, AlbumName, AlbumArtist

    FROM Albums;

    ```


    输出应该是：


    ```

    +---------+---------------------------+--------------+

    | AlbumID | AlbumName                 | AlbumArtist  |

    +---------+---------------------------+--------------+

    |       1 | Rush of Blood to the Head | Coldplays    |

    |       2 | Dirty Gold               | Angel Haze   |

    |       3 | Back to the Woods         | Angel Haze   |

    |       4 | Parachutes                | Coldplay      |

    |       5 | 1989 (Delux Edition)      | Taylor Swift |

    |       6 | Prospekts March           | Coldplay      |

    |       7 | Random Access Memories    | Daft Punk    |

    |       8 | X & Y                     | Coldplay      |

    +---------+---------------------------+--------------+

    ```


    我们像这样更新该记录：


    ```sql

    UPDATE Albums

    SET AlbumArtist = ''Coldplay''

    WHERE AlbumID = 1;

    ```


    警告：不要省略 `WHERE` 子句，否则表中的所有记录都将被更新。


    如果现在输出它，我们应该看到记录已经过更新：


    ```

    +---------+---------------------------+--------------+

    | AlbumID | AlbumName                 | AlbumArtist  |

    +---------+---------------------------+--------------+

    |       1 | Rush of Blood to the Head | Coldplay      |

    |       2 | Dirty Gold               | Angel Haze   |

    |       3 | Back to the Woods         | Angel Haze   |

    |       4 | Parachutes                | Coldplay      |

    |       5 | 1989 (Delux Edition)      | Taylor Swift |

    |       6 | Prospekts March           | Coldplay      |

    |       7 | Random Access Memories    | Daft Punk    |

    |       8 | X & Y                     | Coldplay      |

    +---------+---------------------------+--------------+

    ```


    ## 在表中删除记录


    要删除表中的记录，我们使用 `DELETE` 语句。以下示例删除了表中 `AlbumID` 为 1 的记录/行：


    ```sql

    DELETE FROM Albums

    WHERE AlbumID = 1;

    ```


    警告：不要省略 `WHERE` 子句，否则表中的所有记录都将被删除。


    现在我们输出表中的记录。我们将列限制为仅包含 `AlbumID`、`AlbumName` 和 `AlbumArtist`。`AlbumID` 为 1 的记录应该已经从
    `result_set` 中出现，因为它已经被删除。


    ```

    +---------+------------------------+--------------+

    | AlbumID | AlbumName              | AlbumArtist  |

    +---------+------------------------+--------------+

    |       2 | Dirty Gold               | Angel Haze   |

    |       3 | Back to the Woods         | Angel Haze   |

    |       4 | Parachutes                | Coldplay      |

    |       5 | 1989 (Delux Edition)      | Taylor Swift |

    |       6 | Prospekts March           | Coldplay      |

    |       7 | Random Access Memories    | Daft Punk    |

    |       8 | X & Y                     | Coldplay      |

    +---------+------------------------+--------------+

    ```


    如果你想删除表中的所有记录，使用以下 `DELETE` 语句即可：


    ```sql

    DELETE from Albums;

    ```


    ## 总结


    好了，现在你已经熟悉了 `MySQL`，并且可以使用命令行访问它，用它创建和删除数据库；创建、修改和删除表；选择、插入、更新和删除数据；并使用 `MySQL`
    命令对数据进行其他漂亮的操作，如按你想要的方式进行过滤和排序。

