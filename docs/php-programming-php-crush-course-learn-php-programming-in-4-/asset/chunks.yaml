                  define('DB\\_USER','root');\n\n              define('DB\\_PASSWORD','');\n\
    \n              define('DB\\_HOST','localhost');\n\n              $conn = @mysqli\\\
    _connect(DB\\_HOST, DB\\_USER, DB\\_PASSWORD, DB\\_NAME);\n\n              if\
    \ (!$conn) { \n\n                            die('Could not connect: ' . mysqli\\\
