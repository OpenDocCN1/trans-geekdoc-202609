    ### Deleting Tables


    The code below can be used to delete a table and all its data from the database:


    ```sql

    DROP TABLE table_name;

    ```


    Where `table_name` is the name of the table you wish to delete.


    ## Inserting Records into a Table


    We use the `INSERT INTO` statement in order to insert new records in a table.


    ```sql

    INSERT INTO Albums VALUES

    (NULL, "Rush of Blood to the Head", "Coldplays", ''A'', 12, "2002-08-02"),

    (NULL, "Dirty Gold", "Angel Haze", ''A'', 16, "2013-12-30"),

    (NULL, "Back to the Woods", "Angel Haze", ''M'', 13, "15-09-15"),

    (NULL, "Parachutes", "Coldplay", ''A'', 10, "1999-07-10"),

    (NULL, "1989 (Delux Edition)", "Taylor Swift", ''A'', 15, "2014-10-27"),

    (NULL, "Prospekts March", "Coldplay", ''E'', 8, "2008-09-21"),

    (NULL, "Random Access Memories", "Daft Punk", ''A'', 14, "2013-05-13"),

    (NULL, "X & Y", "Coldplay", ''A'', 13, "2005-06-01");

    ```


    Seems like Coldplay a bit much.


    ## The SELECT Statement


    The `SELECT` statement allows you to retrieve data from a base. Following example
    demonstrates how to use `SELECT` to retrieve all records from the `Albums` table:


    ```sql

    SELECT * FROM Albums;

    ```


    The output should be something like:


    | AlbumID | AlbumName | AlbumArtist | AlbumType | NumberOfTracks | DateReleased
    |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1 | Rush of Blood to the Head | Coldplays | A | 12 | 2002-08-02 |

    | 2 | Dirty Gold | Angel Haze | A | 16 | 2013-12-30 |

    | 3 | Back to the Woods | Angel Haze | M | 13 | 2015-09-15 |

    | 4 | Parachutes | Coldplay | A | 10 | 1999-07-10 |

    | 5 | 1989 (Delux Edition) | Taylor Swift | A | 15 | 2014-10-27 |

    | 6 | Prospekts March | Coldplay | E | 8 | 2008-09-21 |

    | 7 | Random Access Memories | Daft Punk | A | 14 | 2013-05-13 |

    | 8 | X & Y | Coldplay | A | 13 | 2005-06-01 |


    To select specific columns we use the following `SELECT` statement:


    ```sql

    SELECT AlbumName, AlbumArtist, DateReleased FROM Albums;

    ```


    The output should be:


    | AlbumName | AlbumArtist | DateReleased | NumberOfTracks |

    | :--- | :--- | :--- | :--- |

    | Rush of Blood to the Head | Coldplays | 2002-08-02 | 12 |

    | Dirty Gold | Angel Haze | 2013-12-30 | 16 |

    | Back to the Woods | Angel Haze | 2015-09-15 | 13 |

    | Parachutes | Coldplay | 1999-07-10 | 10 |

    | 1989 (Delux Edition) | Taylor Swift | 2014-10-27 | 15 |

    | Prospekts March | Coldplay | 2008-09-21 | 8 |

    | Random Access Memories | Daft Punk | 2013-05-13 | 14 |

    | X & Y | Coldplay | 2005-06-01 | 13 |


    ## The WHERE Clause


    Sometimes you will need to filter out records and select only those records that
    fulfil a criterion. This is where the `WHERE` clause comes into play as the following
    example demonstrates:


    ```sql

    SELECT AlbumName, AlbumArtist, DateReleased, NumberOfTracks FROM Albums WHERE
    AlbumArtist = ''Coldplay'';

    ```


    This should output:


    | AlbumName | AlbumArtist | DateReleased | NumberOfTracks |

    | :--- | :--- | :--- | :--- |

    | Parachutes | Coldplay | 1999-07-10 | 10 |

    | Prospekts March | Coldplay | 2008-09-21 | 8 |

    | X & Y | Coldplay | 2005-06-01 | 13 |


    **NOTE**: This example was done on a text field, hence, the single quotes on the
    value we want to check against. You can check against numeric fields too. Just
    remove the single quotes and make sure you type a numeric value that corresponds
    to the numeric data type of that field.


    You can further filter out the record using the `AND` and `OR` operators to narrow
    down the results further:


    The `AND` operator displays records that match both conditions of the criterion:


    ```sql

    SELECT AlbumName, AlbumArtist, AlbumType FROM Albums WHERE AlbumArtist = ''Coldplay''
    AND AlbumType = ''A'';

    ```


    The output should display results where the `AlbumName` is Coldplay and the `AlbumType`
    is ‘A’. If any record doesn’t match that criterion, it will be excluded:


    | AlbumName | AlbumArtist | AlbumType |

    | :--- | :--- | :--- |

    | Parachutes | Coldplay | A |

    | X & Y | Coldplay | A |


    The `OR` operator is used to return records that match either of the one criterion:


    ```sql

    SELECT AlbumName, AlbumArtist, AlbumType FROM Albums WHERE AlbumType = ''E'' OR
    AlbumType = ''M'';

    ```


    In the above example, any record that has `AlbumType` of ‘E’ or `AlbumType` of
    ‘M’ will be displayed. The rest will be excluded. The output should be:


    | AlbumName | AlbumArtist | AlbumType |

    | :--- | :--- | :--- |

    | Back to the Woods | Angel Haze | M |

    | Prospekts March | Coldplay | E |


    ## The ORDER BY Keyword


    In order to sort the result set by one or more columns, we use the `ORDER BY`
    keyword and specify whether it should be in descending or ascending order:


    ```sql

    SELECT AlbumName, AlbumArtist FROM Albums ORDER AlbumArtist ASC;

    ```


    **NOTE**: By default, they are sorted in ascending order. This means that if we
    leave out the `ASC` keyword, it would not make a difference. We can sort them
    in descending order by replacing `ASC` with `DESC` in the above example.


    That should output records in ascending order based on the name of the artist
    of the album:


    | AlbumName | AlbumArtist |

    | :--- | :--- |

    | Dirty Gold | Angel Haze |

    | Back to the Woods | Angel Haze |

    | Parachutes | Coldplay |

    | Prospekts March | Coldplay |

    | X & Y | Coldplay |

    | Rush of Blood to the Head | Coldplays |

    | Random Access Memories | Daft Punk |

    | 1989 (Delux Edition) | Taylor Swift |


