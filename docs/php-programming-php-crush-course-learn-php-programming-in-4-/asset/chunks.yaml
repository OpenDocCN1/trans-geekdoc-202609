- fmt: "\nNow we are done with the command line (but not MySQL), so we can close that.\n\
    \n# Create PHP configuration File for the Website\n\nWe must first create a folder\
    \ and name it `Family` and place it in the `htdocs` folder. This folder is located\
    \ in the root directory of our XAMPP installation. Then we create a file called\
    \ `config.php` and place it in the root folder of our website.\n\n> **Warning:**\
    \ for security pur-pouse this file needs to be placed outside of the server because,\
    \ while it is not easy to read PHP through the browser, it can happen if the server\
    \ is misconfigured. But since we want to keep this as simple as possible, we will\
    \ place it here.\n\nNext we define the constants needed to establish out connection\
    \ string that we shall use to connect to the music database:\n\n```php\n<?php\
    \  \ndefine('DB_NAME', 'Family');  \ndefine('DB_USER', 'root');  \ndefine('DB_PASSWORD',\
    \ '');   \ndefine('DB_HOST', 'localhost');  \n?>\n```\n\n> **Warning:** for security\
    \ reason, putting in a plain text password is a major security risk. You can use\
    \ `hash()` and store the hash in the configuration file `config.php`. Then you\
    \ can check if the entered password matches the hash when logging in.\n\nThen\
    \ we establish the connection string by passing in the constants; host name, username,\
    \ password, and database name to the method that establishes the connection:\n\
    \n```php\n<?php\ndefine('DB_NAME','Family');\ndefine('DB_USER','root');\ndefine('DB_PASSWORD','');\n\
    define('DB_HOST','localhost');\n$conn = @mysqli_connect(DB_HOST, DB_USER, DB_PASSWORD,\
    \ DB_NAME);\n?>\n```\n\nNow we need to check if the connections succeeded or not.\
    \ If it didn’t, we display the appropriate error message and stop execution of\
    \ the PHP script:\n\n```php\n<?php\ndefine('DB_NAME','Family');\ndefine('DB_USER','root');\n\
    define('DB_PASSWORD','');\ndefine('DB_HOST','localhost');\n$conn = @mysqli_connect(DB_HOST,\
    \ DB_USER, DB_PASSWORD, DB_NAME);\nif (!$conn) {\n    die('Could not connect:\
    \ ' . mysqli_error());\n}\n?>\n```\n\nAnd that’s it for establishing the connection\
    \ string. This script will be required by every PHP script needs to connect to\
    \ the database to work.\n\n# Creating the Index Page\n\nNow we need to create\
    \ the landing page which shall list family members that are in our database in\
    \ a table. We are going to add some CSS (by linking to external sheets) to create\
    \ an attractive table to display our data. We create a file named `index.php`\
    \ and place it root of the website. The code should look something like this:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <link rel=\"stylesheet\" href=\"\
    css/main.css\">\n    <link rel=\"stylesheet\" href=\"css/table_styling.css\">\n\
    </head>\n<body>\n    <div id=\"container\">\n        <div id=\"header\">\n   \
    \         <h2>My Family</h2>\n        </div>\n        <div id=\"btn_add\">\n \
    \           <a href=\"form.php\">ADD</a>\n        </div>\n        <div id=\"content\"\
    >\n<?php\n            require_once('config.php');\n            $sql = \"SELECT\
    \ MemberID, FirstName, LastName, Age, Gender, Relationship FROM FamilyMembers\"\
    ;\n            $response = @mysqli_query($conn, $sql);\n            if ($response){\n\
    \                echo '<table>\n                    <tr>\n                   \
    \     <th>Member ID</th>\n                        <th>First Name</th>\n      \
    \                  <th>Last Name</th>\n                        <th>Age</th>\n\
    \                        <th>Gender</th>\n                        <th>Relationship</th>\n\
    \                    </tr>';\n                while ($row = mysqli_array($response)){\n\
    \                    echo '<tr>\n                        <td>'.$row['MemberID'].'</td>\n\
    \                        <td>'.$row['FirstName'].'</td>\n                    \
    \    <td>'.$row['LastName'].'</td>\n                        <td>'.$row['Age'].'</td>\n\
    \                        <td>'.$row['Gender'].'</td>\n                       \
    \ <td>'.$row['Relationship'].'</td>\n                    </tr>';\n           \
    \     }\n                echo '</table>';\n            }\n            else {\n\
    \                echo \"Cound not get a response from database \" . mysqli_error($conn);\n\
    \            }\n            mysqli_close($conn);\n    ?>\n        </div>\n   \
    \ </div>\n</body>\n</html>\n```\n"
  raw: "+----------+-----------+----------+-----+--------+-----------------+\n\nNow\
