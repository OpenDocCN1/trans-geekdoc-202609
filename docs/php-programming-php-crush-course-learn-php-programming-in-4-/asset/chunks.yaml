  trans: "\n\nPHP 是一种弱类型语言，因此你不需要为变量定义数据类型。PHP 将根据赋值给变量的值，自动将变量转换为正确的数据类型。\n\n以下是你将用到的常用数据类型列表：\n\
    \n- `Integer`（整数）– 整数\n- `Float`（浮点数）– 小数\n- `String`（字符串）– 字符串或字符\n- `Boolean`（布尔）–\
    \ 真或假\n- `Array`（数组）– 多个项目\n- `Object`（对象）– 由类定义的对象\n\n你可以通过变量来实现与示例相同的结果：\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<<body>\n    <?php\n        $txt = \"third\"\
    ;\n        echo \"My \" .  $txt .\" PHP script!\";\n    ?>\n</body>\n</</html>\n\
    ```\n\n在例例中，我们使用句号（`.`）将两个字符串连接在一起，因为它用于连接两个字符串，并将连接后的字符串输出到屏幕上。\n\n## 常量\n\n\
    常量类似于变量，不同之处在于它们的值不能被更改或未定义。\n\n当定义一个常量时，我们使用 `define()` 方法，后面跟着括号内的参数，这些参数为它提供名称和一个值。下面的示例显示了如何定义常量：\n\
    \n```php\n<?php\n    define(\"MESSAGE\", \"Happy Learning!\");  //定义常量的函数\n  \
    \  echo MESSAGE;\n?>\n```\n\n输出：\nHappy Learning!\n\n与变量不同，你实际上可以在定义值之后再添加一个参数（接受一个布尔值）来指定你是否想要常量不区分大小写（默认认为\
    \ false）：\n\n```php\n<?php\n    define(\"MESSAGE\", \"Happy Learning!\", true);\n\
    \    echo MESSAGE;\n?>\n```\n\n关于常量需要记住的规则：\n- 它们必须以字母或下划线开头（不需要以 `$` 开头）\n- 它们在整个脚本中全局有效\n\
    \n## 运算符\n\nPHP 使用运算符来对变量和值执行各种操作。我们现在来看 PHP 组使用的运算符。\n\n### 算术运算符\n\n这些是对值上执行数学运算并返回结果的运算符：\n\
    \n| 示例 | 运算符 | 结果 |\n| :--- | :--- | :--- |\n| `$x + $y` | 加法 | `$x` 和 `$y` 的和\
    \ |\n| `$x - $y` | 减法 | `$x` 和 `$y` 的差 |\n| `$x * $y` | 乘法 | `$x` 和 `$y` 的积 |\n\
    | `$x / $y` | 除法 | `$x` 和 `$y` 的被除 |\n| `$x % $y` | 取模 | `$x` 除以 `$y` 的余数 |\n\
    | `$x ** $y` | 幂 | `$x` 的 `$y` 次方的结果（PHP 5.6 新增） |\n\n### 赋值运算符\n\n这些运算符用于为变量设置值：\n\
    \n| 赋值 | 等同于 | 描述 |\n| :--- | :--- | :--- |\n| `$x = $y` | | 获取 `$y` 的值并将其赋给 `$x`\
    \ |\n| `$x += $y` | | 获取 `$x` 和 `$y` 的和并将结果设置为 `$x` |\n| `$x -= $y` | | 获取 `$x`\
    \ 和 `$y` 的差并将结果设置为 `$x` |\n| `$x *= $y` | | 获取 `$x` 和 `$y` 的积并将结果设置为 `$x` |\n\
    | `$x /= $y` | | 获取 `$x` 和 `$y` 的被除并将结果设置为 `$x` |\n| `$x %= $y` | | 获取 `$x` 除以\
    \ `$y` 的余数并将结果设置为 `$x` |\n\n### 比较运算符\n\nPHP 中的比较运算符用于比较两个值：\n\n| 示例 | 名称 | 结果\
    \ |\n| :--- | :--- | :--- |\n| `$x == $y` | 等于 | 如果 `$x` 和 `$y` 相等 |\n| `$x ===\
    \ $y` | 全等 | 如果 `$x` 和 `$y` 相等且类型相同 |\n| `$x != $y` | 不等于 | 如果 `$x` 和 `$y` 不相等\
    \ |\n| `$x <> $y` | 不等于 | 如果 `$x` 和 `$y` 不相等 |\n| `$x !== $y` | 不全等 | 如果 `$x`\
    \ 和 `$y` 不相等或类型不同 |\n| `$x > $y` | 大于 | 如果 `$x` 大于 `$y` |\n| `$x < $y` | 小于 |\
    \ 如果 `$x` 小于 `$y` |\n| `$x >= $y` | 大于等于 | 如果 `$x` 大于等于 `$y` |\n| `$x <= $y` |\
    \ 小于等于 | 如果 `$x` 小于等于 `$y` |\n\n### 逻辑运算符\n\n逻辑运算符用于组合布尔值值（我们将在接下来的小时内讨论条件语句），以得到真或假的结果：\n\
    \n| 示例 | 运算符 | 结果 |\n| :--- | :--- | :--- |\n| `$x && $y` | 与 | 如果 `$x` 和 `$y`\
    \ 均为真 |\n| `$x || $y` | 或 | 如果 `$x` 或 `$y` 至少有一个为真 |\n| `!$x` | 非 | 如果 `$x` 不为真\
    \ |\n| `$x and $y` | 与 | 如果 `$x` 和 `$y` 至少有一个为真 |\n| `$x xor $y` | 异或 | 如果 `$x`\
    \ 或 `$y` 仅有一个为真 |\n\n### 增/递减运算符（三元运算符）\n\n这些运算符也称为三元运算符，用于增加或减少变量的值：\n\n| 示例\
    \ | 名称 | 结果 |\n| :--- | :--- | :--- |\n| `++$x` | 前置增 | 将 `$x` 增加一 |\n| `$x++`\
    \ | 后置增 | 将 `$x` 增加一 |\n| `--$x` | 前置减 | 将 `$x` 减少一 |\n| `$x--` | 后置减 | 将 `$x`\
    \ 减少一 |\n\n### 字符串运算符\n\n这些是专门为字符串设计的运算符：\n\n| 示例 | 名称 | 结果 |\n| :--- | :--- |\
    \ :--- |\n| `$str1 . $str2` | 连接 | 返回 `$str1` 和 `$str2` 的连接 |\n| `$str1 .= $str2`\
    \ | 连接赋值 | 将 `$str2` 追加到 `$str1` |\n\n### 数组运算符\n\n这些是用于比较数组的运算符（我们将在接下来的小时内讨论）：\n\
    \n| 示例 | 运算符 | 结果 |\n| :--- | :--- | :--- |\n| `$x + $y` | 并 | `$x` 和 `$y` 的并集\
    \ |\n| `$x == $y` | 等于 | 如果 `$x` 和 `$y` 具有相同的键值对 |\n| `$x === $y` | 全等 | 如果 `$x`\
    \ 和 `$y` 相等且类型相同 |\n\n## 第 2 章 - 第 2 小时：更多 PHP 基础\n\n“说话很廉价。给我看代码。” – Thomas C.\
    \ Gale\n\n在本章中我们将涵盖：\n\n-   条件语句\n-   循环\n-   数组\n-   函数\n\n这部分我们将深入探讨 PHP 基础并学习很多酷的东西。你已经完成了基础部分的蔬菜，现在是肉部分。\n\
    \n## 条件语句\n\n条件语句允许在代码中进行一些决策。它们根据程序员指定的条件被评估为真还是假来执行不同的操作。\n\n以下是 PHP 中使用的条件语句列表：\n\
    \n-   if 语句\n-   if…else 语句\n-   if…else if…else 语句\n-   switch 语句\n\n让我们详细查看每一个。\n\
    \n### if 语句\n\nif 语句评估表达式，结果为真，则执行代码块。如果评估结果为假，则代码块被忽略。\n\n下面的示例如果条件为真，将输出“5 小于\
    \ 10!”，否则，代码块将被忽略：\n\n```php\n<?php\n    $x = 5;\n```\n\n## 总结\n\n到为止，我们已经涵盖了你开始并运行\
    \ PHP 所需的很多内容。我们安装了一个名为 XAMPP 的 Web 服务器软件包，它带有 APACHE Web 服务，允许我们在浏览器中运行 PHP 脚本。你现在应该已经足够的知识来创建和运行\
    \ PHP 脚本，并了解如何向屏幕输出信息。我们还涵盖了 PHP 的一些基础知识，如变量和常量，并查看了一些运算符；其中一些在接下来的小时内将很有用。\n\n\
    让我们继续吧！\n\n"
- fmt: "\n```php\nif ($x < 10) {\n    echo \"$x is less than 10!\";\n}\n?>\n```\n\
    Output:\n5 is less than 10!\n\n### The if…elseif Statement\n\nThe `if…elseif`\
    \ statement executes a code `if` block if the expression evaluated as true and\
    \ another code `if` that that expression is evaluated as false.\n\nLet us alter\
    \ the previous example a bit. The following code will output “50 is greater than\
    \ 20!” which is on the second code block because it satisfies the second condition.\
    \ The value assigned to `$x` is `50` and it will return false on the first condition:\n\
    \n```php\n<?php\n$x = 50;\nif ($x < 10) {\n    echo “$x is less than 10!”;\n}\
    \ else if ($x > 20) {\n    echo “$x is greater than 20!”;\n}\n?>\n```\nOutput:\n\
    50 is greater than 20!\n\n### The if…elseif…else Statement\n\nSame as the `if…elseif`\
    \ statement. The difference is that when all other conditions fail, the last code\
    \ block is executed.\n\nIn The example below will output “I5 is between 10 and\
    \ 20!” because `$x` is `15`. It needs to be less than 10 to satisfy the first\
    \ condition, and greater than 20 to satisfy the second condition, otherwise, it\
    \ is between 10 and 20:\n\n```php\n<?php\n$x = 15;\nif ($x < 10) {\n    echo “$x\
    \ is less than 10!”;\n} else if ($x > 20) {\n    echo “$x is greater than 20!”;\n\
    }else {\n    echo “$x is between 10 and 20!”;\n}\n?>\n```\nOutput:\nI5 is between\
    \ 10 and 20!\n\n### Switch Statement\n\nA `switch` statement matches the value\
    \ of an expression with `cases`. If a match is found, the code associated with\
    \ `case` is executed. When no match is found, the `default` statement is used.\
    \ The `break` statement prevents the code from jumping into the next `case`.\n\
    \nIn the example below the value of `$lunch` will be checked against all the `cases`\
    \ to see if any of them match. In this case, the output will be “Burgers are yummy!”\
    \ since that is the corresponding case.\n\n```php\n<?php\n$lunch = “burger”;\n\
    switch ($lunch) {\n    case “cereal”:\n        echo “Cereal You had breakfast\
    \ for lunch!”;\n        break;\n    case “salad”:\n        echo “Salad makes a\
    \ healthy lunch!”;\n        break;\n    case “burger”:\n        echo “Burgers\
    \ are yummy!”;\n        break;\n    default:\n        echo “looks you skipped\
    \ lunch. That is not good!”;\n}\n?>\n```\nOutput:\nBurgers are yummy!\n\n## Loops\n\
    \nHere is a list of looping statements in PHP:\n\n* `while`\n* `do…while`\n* `for`\n\
    * `foreach`\n\nWe shall go into each one in detail.\n\n### The While Loop\n\n\
    The `while` loop executes a block of code repeatedly as long as the specified\
    \ condition remains true.\n\nThe code below shows the value of `$x` if it is less\
    \ than or equal to `5`. If the condition is true, it gets outputted to screen\
    \ and then incremented until the condition returns false:\n\n```php\n<?php\n$x\
    \ = 1;\nwhile ($x <= 5) {\n    echo “The value of x is: ” . $x . “<br />”;\n \
    \   $x++;\n}\n?>\n```\nOutput:\nvalue of x is: 1\nvalue of x is: 2\nvalue of x\
    \ is: 3\nvalue of x is: 4\nvalue of x is: 5\n\n### The Do…While Loop\n\nExecutes\
    \ the block of code at least once then loops through until the specified condition\
    \ becomes false.\n\nThe example below shows the value of `$x` being outputted\
    \ to the screen then subtracted by one at least once, then is checked to see if\
    \ it is greater than zero. If it is, then it repeats the process until becomes\
    \ less than zero:\n\n```php\n<?php\n$x = 5;\ndo {\n    echo “The value of x is:\
    \ ” . $x . “<br />”;\n    $x--;\n} while ($x >= 0);\n?>\n```\nOutput:\nvalue of\
    \ x is: 5\nvalue of x is: 4\nvalue of x is: 3\nvalue of x is: 2\nvalue of x is:\
    \ 1\nvalue of x is: 0\n\n### The For Loop\n\nLoops through a code block a specified\
    \ number of times. There are three things needed for the loop to work. And the\
    \ example below has all:\n\n1. `Initialization`: this is where a variable is declared\
    \ to start the loop counter. This is `$x = 1` in our example. This means that\
    \ `$x` is the initializer and it is set to start at `1`.\n2. `Condition`: This\
    \ is the second part of the loop where we check if the loop counter matches a\
    \ condition. When it returns false, the loop stops execution of the code block.\
    \ Our condition in the example is `$x <= 5`.\n3. `Increment`: When the loop ends,\
    \ this part of the code is executed once then the loop repeats. This is where\
    \ we can do some operations to the loop counter. In our case we increase the value\
    \ of `$x` by one with `$x++`.\n\n```php\n<?php\nfor ($x = 1; $x <= 5; $x++) {\n\
    \    echo “The value of x is: ” . $x . “<br />”;\n}\n?>\n```\nOutput:\nvalue of\
    \ x is: 1\nvalue of x is: 2\nvalue of x is: 3\nvalue of x is: 4\nvalue of x is:\
    \ 5\n\n### The For each Loop\n\nA loop that goes through each element found in\
    \ an array. It executes a block of code with each element found in the array until\
    \ it runs out.\n\nThe code below loops through all the elements of an array then\
    \ outputs the value of the element to the screen:\n\n```php\n<?php\n$foods = array(“cereal”,\
    \ “salad”, “burgers”, “fries”);\nforeach ($foods as $food) {\n    echo “$food\
    \ <br />”;\n}\n?>\n```\n\n## Functions\n\nA function is a piece of code that can\
