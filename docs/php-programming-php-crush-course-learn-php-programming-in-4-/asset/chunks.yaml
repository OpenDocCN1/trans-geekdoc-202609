  trans: "\n完成这一部分后你可以休息一下，让这些内容融入脑海，然后去泡杯咖啡。\n\n在第三小时，我们将处理 MySQL 及其命令，但首先我们要学习如何访问命令行。然后，我们将学习创建和删除数据库的命令；创建、修改和删除表格；以及在表中插入、查询、更新和删除数据的命令。\n\
    \n最后，在最后一个小时，我们将 PHP 和 MySQL 结合，创建一个简单的网站，向你展示这两个工具是如何紧密合作的。\n\n让我们开始吧。拿起你的第一杯咖啡！\n\
    \n# 第 1 章 - 第 1 小时：安装与 PHP 基础\n\n“开始的方法是带着梦想的乐观主义迈出第一步。” - Debasish Mridha\n\n\
    本章将涵盖：\n\n*   安装 Web  服务器\n*   安装文本编辑器\n*   启动 Apache 以运行 PHP 脚本\n*   创建并运行 PHP\
    \ 脚本\n*   PHP 基础（注释、变量、运算符、常量、字符串）\n\n请稍等我一下。我知道几乎每本编程书籍的第一章都会堆砌大量的大量的理论，以确保你了解自己正在面对什么。我不我不骗你；即使在这本简短的书中，我们仍然需要稍微过一遍。只需要过一点点，涵盖\
    \ PHP 的一些基础知识。那是为了本小时后面之后的内容。现在，你需要安装服务器，并选择一个合适的文本编辑器来编写 PHP 代码！\n\n## 安装 Web\
    \ 服务器\n\n你通往 PHP 的第一个真正步骤带你来到了这里。你不能像运行 HTML 那样直接在浏览器中运行 PHP。要运行 PHP，你需要在本地机器上安装服务器，以便浏览器解析\
    \ PHP 脚本并在数据库上运行 MySQL 查询返回结果。或者，你可以使用支持 PHP 和 MySQL 的主机，这样你可以将其上传到他们的服务器，并直接在那里测试和部署你的梦想网站。但我猜你真的想在本地快速地测试。因此，我们将安装一个本地服务器，让你自己的电脑变成一台测试服务器。\n\
    \n你可以在本地机器上安装许多服务器，例如 XAMP、WAMP（适用于 Windows）以及适用于 Mac OS X 的 MAMP 等，本书涵盖了 XAMP。它是一个免费的开源跨平台\
    \ Web 服务器包，适用于 Windows、Mac 和 Linux。\n\n访问此网站\n\n`www.apachefriends.org/index.html`\
    \ \n\n并下载适用于 windows 的最新版本 XAMP（同样的步骤可以轻松适用于 Mac OSX 或 Linux）。下载完成后，在本地机器上找到该文件并双击它进行安装。\n\
    \n简单！现在 PHP 和 MySQL 已经准备就绪。\n\n注意：如果你此时正在运行防病毒软件，它可能会干扰安装过程。你可能希望在服务器安装完成之前将其关闭，以避免任何潜在问题。\n\
    \n## 安装文本编辑器\n\n现在，你需要一个文本编辑器来编写优美的 PHP。理想情况下，任何文本编辑器都可以，即使是 Windows 默认的记事本或 Mac\
    \ OS X 的终端都可以用于编写 PHP。我们将使用 notepad++，因为它具有一些实用的功能，有助于快速编写整洁高效的代码，例如语法高亮和自动补全。\n\
    \n而且它是免费的！\n\n只需在此安装文本编辑器 下载并安装，这些文本编辑器将为你节省大量时间并避免许多痛苦。只需记住，任何文本都可以。所以即使你没有 notepad++，也可以可以使用任何你喜欢的工具。\n\
    \n## 启动 Apache 运行 PHP 脚本\n\n现在你已经安装了 XAMPP，你需要启动 apache Web 服务，以便浏览器能够运行 PHP 脚本。要做到这一点，双击图标打开\
    \ XAMPP 控制面板。默认情况下，它应该会自动启动，但你可以通过点击下图中的“Start”手动启动：\n\n![XAMPP 控制面板](img/00001.jpeg)\n\
    \n注意：电脑上安装的某些应用程序可能会导致 Apache 无法启动，只需停止那些服务并重新启动。\n\n## 创建你的第一个 PHP 脚本\n\n这部分非常简单。你只需要遵循以下步骤：\n\
    \n### 第一步 - 创建 PHP 文件\n\n打开你的文本编辑器，创建一个普通的文本文件并将以下代码放入其中：\n\n```html\n<!DOCTYPE\
    \ html>  \n<html>  \n    <body>\n        <?php  \n            echo \"My first\
    \ script!\";  \n        ?>\n    </body>\n</html>\n```\n\n`echo` 语句会将之后的所有内容输出到屏幕上。文件仍然看起来像\
    \ `<?php` 和 `?>`。将文件保存为 `example.php`。\n\n### 第二步 - 将其放在 XAMPP 根目录下\n\n获取 `example.php`\
    \ 并将其放入 `htdocs` 文件夹。\n\n注意：要找到根目录，你可以打开 XAMPP。\n\n![XAMPP 根目录](img/00002.jpeg)\n\
    \n### 第三步 - 在浏览器中运行\n\n打开你的浏览器（推荐 Google Chrome）并输入：\n\n`http://localhost/example.php`\n\
    \n![浏览器结果](img/00003.jpeg)\n\n搞定！\n\n## PHP 基础\n\n### 注释\n\n想给未来的自己或团队成员留下信息吗？那么注释可以省去你记忆的麻烦。\n\
    \n```php\n// 这是一个单行注释\n// 这是另一个单行注释\n\n/*\n这是一个注释。它可以跨越多行。\n*/\n```\n\n### 变量\n\
    \n为了构建你的梦想网站，你需要数据以及存储这些数据的方法。PHP 提供了使用变量将它们存储在内存的方法。每个变量都以 `$` 符号开头。\n\n让我们通过以下代码查看一些操作：\n\
    \n```html\n<!DOCTYPE html>  \n<html>  \n    <body>\n        <?php  \n        \
    \    $txt = \"My second PHP script!\";  \n            echo $txt;\n        ?>\n\
    \    </body>\n</html>\n```\n\n如果你在浏览器中运行此脚本，它应该输出以下内容：\n\n\"My second PHP script!\"\
    \n\n关于变量还有几点需要记住：\n\n*   它们是大小敏感的。这意味着 `$name` 和 `$naMe` 是两个不同的变量\n*   变量必须以字母或下划线开头\n\
    *   变量不能以数字开头\n*   变量只能包含字母数字\n"
- fmt: "\nPHP is a loosely type language and therefore you don't need to define the\
    \ data types for variables. PHP will automatically convert the variable to the\
    \ correct data type depending on the value assigned to it.\n\nHere is a list of\
    \ the common data types you will work with:\n\n- `Integer` – Whole numbers\n-\
    \ `Float` – Decimal numbers\n- `String` – String or characters\n- `Boolean` –\
    \ true or false\n- `Array` – Multiple items\n- `Object` – An Object defined by\
    \ a class\n\nYou can achieve the same result as the example above by using variables:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n    <?php\n        $txt = \"third\"\
    ;\n        echo \"My \" .  $txt .\" PHP script!\";\n    ?>\n</body>\n</html>\n\
    ```\n\nIn this example we are joining two strings together using the period (`.`)\
    \ as it is used to concatenate two strings together and outputting the concatenated\
    \ string to the screen. \n\n## Constants\n\nConstants are like variables except\
    \ that their values cannot be changed or undefined.\n\nWhen define a constant\
    \ we use `define()` method followed by parameters in the parenthesis that give\
    \ it a name and a value. The following example shows how to define a constant:\n\
    \n```php\n<?php\n    define(\"MESSAGE\", \"Happy Learning!\");  //function that\
    \ defines a constant\n    echo MESSAGE;\n?>\n```\n\nOutput:\nHappy Learning!\n\
    \nUnlike variables, you can actually specify whether you want the constant to\
    \ be case-insensitive or not by adding one more parameter, that takes a Boolean,\
    \ after the value is defined (default is false):\n\n```php\n<?php\n    define(\"\
    MESSAGE\", \"Happy Learning!\", true);\n    echo MESSAGE;\n?>\n```\n\nSome rules\
    \ to remember about constants:\n- They must start with a letter and underscore\
    \ (they don’t need to start with `$`)\n- They global across the entire script\n\
    \n## Operators\n\nPHP uses operators to perform various operations of variables\
    \ and values. We shall now look at the operators used by PHP groups.\n\n### Arithmetic\
    \ Operators\n\nThese are operators that perform mathematical operations on values\
    \ and return results:\n\n| EXAMPLE | OPERATOR | RESULT |\n| :--- | :--- | :---\
    \ |\n| `$x + $y` | Addition | Sum of `$x` and `$y` |\n| `$x - $y` | Subtraction\
    \ | The difference between `$x` and `$y` |\n| `$x * $y` | Multiplication | The\
    \ Product of `$x` and `$y` |\n| `$x / $y` | Division | The dividend of `$x` and\
    \ `$y` |\n| `$x % $y` | Modulus | The remainder of `$x` divided by `$y` |\n| `$x\
    \ ** $y` | Exponent | Result of `$x` to `$y` power (New to PHP 5.6) |\n\n### Assignment\
    \ Operators\n\nThese operators are used to set values to variables:\n\n| ASSIGNMENT\
    \ | SAME AS | DESCRIPTION |\n| :--- | :--- | :--- |\n| `$x = $y` | | Gets the\
    \ value of `$y` and sets it to `$x` |\n| `$x += $y` | | Gets the sum of `$x` and\
    \ `$y` and sets the result into `$x` |\n| `$x -= $y` | | Gets the difference of\
    \ `$x` and `$y` and sets the result into `$x` |\n| `$x *= $y` | | Gets the product\
    \ of `$x` and `$y` and sets the result into `$x` |\n| `$x /= $y` | | Gets the\
    \ dividend of `$x` and `$y` and sets the result into `$x` |\n| `$x %= $y` | |\
    \ Gets the remainder of `$x` divided by `$y` and sets the result into `$x` |\n\
    \n### Comparison Operators\n\nComparison operators in PHP are used to compare\
    \ two values:\n\n| EXAMPLE | NAME | RESULT |\n| :--- | :--- | :--- |\n| `$x ==\
    \ $y` | Equal | Returns true if both `$x` and `$y` are equal |\n| `$x === $y`\
    \ | Identical | Returns true if both `$x` and `$y` are equal and have the same\
    \ data type |\n| `$x != $y` | Not equal | Returns true if both `$x` and `$y` are\
    \ not equal |\n| `$x <> $y` | Not equal | Returns true if both `$x` and `$y` are\
    \ not equal |\n| `$x !== $y` | Not identical | Returns true if both `$x` and `$y`\
    \ are not equal, or if they don’t have the same data type |\n| `$x > $y` | Greater\
    \ than | Returns true if `$x` is greater than `$y` |\n| `$x < $y` | Less Than\
    \ | Returns true if `$x` is less than `$y` |\n| `$x >= $y` | Greater than or equal\
    \ | Returns true if `$x` is greater than or equal to `$y` |\n| `$x <= $y` | Less\
    \ Than or equal | Returns true if `$x` is less than or equal `$y` |\n\n### Logical\
    \ Operators\n\nLogical operators are what we use to combine conditional statements\
    \ (which we will cover in the next hour) in order to get a true or false result:\n\
    \n| EXAMPLE | NAME | RESULT |\n| :--- | :--- | :--- |\n| `$x && $y` | And | Returns\
    \ true if both `$x` and `$y` are true |\n| `$x || $y` | Or | Returns true either\
    \ `$x` or `$y` are true |\n| `!$x` | Not | Returns true if `$x` is not true |\n\
    | `$x and $y` | And | Returns true if both `$x` and `$y` are true |\n| `$x or\
    \ $y` | Or | Returns true either `$x` or `$y` are true |\n| `$x xor $y` | Xor\
    \ | Returns true if `$x` is less than `$y` |\n\n### Increment/Decrement (Ternary)\
    \ Operators\n\nThese operators, also known as ternary operators, increase/decrease\
    \ a variable’s value by one:\n\n| EXAMPLE | NAME | RESULT |\n| :--- | :--- | :---\
    \ |\n| `++$x` | Pre-increment | Adds one to `$x`, then returns `$x` |\n| `$x++`\
    \ | Post-increment | Returns `$x`, then adds one to `$x` |\n| `--$x` | Pre-decrement\
    \ | subtracts one from `$x`, then returns `$x` |\n| `$x--` | Post-decrement |\
    \ Returns `$x`, then subtracts one from `$x` |\n\n### String Operator\n\nThese\
    \ are operators that are specially designed for strings:\n\n| EXAMPLE | NAME |\
    \ RESULT |\n| :--- | :--- | :--- |\n| `$str1 . $str2` | Concatenation | Returns\
    \ the concatenation of `$str1` and `$str2` |\n| `$str1 .= $str2` | Concatenation\
    \ assignment | Append `$str2` to `$str1` |\n\n### Array Operators\n\nThese are\
    \ operators that used to compare arrays (which we will discuss in the next hour):\n\
    \n| EXAMPLE | OPERATOR | RESULT |\n| :--- | :--- | :--- |\n| `$x + $y` | Union\
    \ | Union of `$x` and `$y` |\n| `$x == $y` | Equality | If `$x` and `$y` have\
    \ the same value/key pairs, the result is true |\n| `$x === $y` | Identity | Returns\
    \ true if `$x` and `$y` are equal and have the same data type |\n\n## Chapter\
    \ 2 - Hour 2: More PHP Basics\n\n“Talk is cheap. Show me the code” – Thomas C.\
    \ Gale\n\nIn this chapter we will cover:\n\n-   Conditional Statements\n-   Loops\n\
    -   Arrays\n-   Functions\n\nThis is the part where we dive a little deeper into\
