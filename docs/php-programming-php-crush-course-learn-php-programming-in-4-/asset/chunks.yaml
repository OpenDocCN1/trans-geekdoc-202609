  trans: "\n现在我们已经完成了命令行操作（但尚未完成 MySQL），所以可以将其关闭。\n\n# 为网站创建 PHP 配置文件\n\n我们必须首先创建一个命名为\
    \ `Family` 的文件夹，并将其放在 `htdocs` 文件夹中。该文件夹位于我们 XAMPP 安装的根目录下。然后，我们创建一个名为 `config.php`\
    \ 的文件，并将其放在网站的根目录下。\n\n> **警告：** 为了安全考虑，此文件需要放置在服务器外部，因为虽然通过浏览器读取 PHP 并不容易，如果服务器配置不当，这种情况可能会发生。但由于我们想尽可能保持简单，我们将将其放在这里。\n\
    \n接下来，我们定义了建立连接字符串所需的常量，我们将使用该字符串来连接音乐数据库：\n\n```php\n<?php  \ndefine('DB_NAME',\
    \ 'Family');  \ndefine('DB_USER', 'root');  \ndefine('DB_PASSWORD', '');   \n\
    define('DB_HOST', 'localhost');  \n?>\n```\n\n> **警告：** 出于安全考虑，明文密码是一个重大的安全风险。你可以使用\
    \ `hash()` 并哈希值存储在配置文件 `config.php` 中。这样在登录时，你就可以检查输入的密码是否与哈希值匹配。\n\n然后，通过通过将主机名、用户名、密码和数据库名称传递给建立连接的方法来建立连接字符串：\n\
    \n```php\n<?php\ndefine('DB_NAME','Family');\ndefine('DB_USER','root');\ndefine('DB_PASSWORD','');\n\
    define('DB_HOST','localhost');\n$conn = @mysqli_connect(DB_HOST, DB_USER, DB_PASSWORD,\
    \ DB_NAME);\n?>\n```\n\n现在我们需要检查连接是否成功。如果没有成功，我们将显示相应的错误消息并停止 PHP 脚本的执行：\n\n```php\n\
    <?php\ndefine('DB_NAME','Family');\ndefine('DB_USER','root');\ndefine('DB_PASSWORD','');\n\
    define('DB_HOST','localhost');\n$conn = @mysqli_connect(DB_HOST, DB_USER, DB_PASSWORD,\
    \ DB_NAME);\nif (!$conn) {\n    die('Could not connect: ' . mysqli_error());\n\
    }\n?>\n```\n\n建立连接字符串的操作就此结束。每个需要连接到数据库的 PHP 脚本都需要此脚本才能运行。\n\n# 创建索引页\n\n现在我们需要创建一个落地页，该页面将以表格的形式列出数据库中的家庭成员。我们将一些\
    \ CSS（通过链接外部表格）来创建一个吸引人的表格以显示我们的数据。我们创建一个名为 `index.php` 的文件并将其放在网站的根目录。代码应该如下：\n\
