  trans: "\n让我们通过输入以下命令来创建一个数据库：\n\n```sql\nCREATE DATABASE music;\n```\n\n始终记住此点：\n\
    \n- 从现在开始，所有输入的语句和命令都应该以分号或 `/g` 结尾。否则客户端将认为你仍在输入命令，导致其不会执行。\n- 虽然不是强制要求的，但因为命令行对大小不敏感，MySQL\
    \ 命令通常使用大写字母，以区分命令与数据库名、表名、列和行等内容。\n\n要删除数据库，只需输入：\n\n```sql\nDROP database_name;\n\
    ```\n\n其中 `database_name` 是你想要删除的数据库名称。\n\n现在我们已经创建了数据库，我们需要选择它以便创建表。在命令行中输入以下内容来选择我们刚刚创建的数据库，然后按回车：\n\
    \n```sql\nUSE music;\n```\n\n警告：不要忘记选择数据库，否则当你在尝试创建表等操作时将会遇到错误。\n\n注意：命令行提示符会告诉你你选择了哪个数据库。它看起来应该像这样：`Maria\
    \ DB [music]>`。\n\n## 创建、修改和删除表\n\n现在我们已经选择了数据库，让我们创建一些表。我们将创建的第一张表是关于艺术家信息的。\n\
    \n良好的习惯（也是为了避免很多头恼）是先检查是否存在同名的表，因为你不能同一个数据库中创建两个同名的表。如果找到了同名表，它将连同数据一起被删除。因此，在使用此命令时要小心，特别是当表与其他表相关时。\n\
    \n### 创建表\n\n我们如下创建表：\n\n```sql\nCREATE TABLE Album\n(  \n    AlbumID smallint\
    \ unsigned NOT NULL auto_increment PRIMARY KEY,  \n    AlbumName varchar(255)\
    \ NOT NULL,  \n    AlbumArtist varchar(80) NOT NULL,  \n    AlbumType ENUM('A',\
    \ 'E', 'M') NOT NULL,  \n    numTracks varchar(3) NOT NULL,  \n    DateReleased\
    \ DATE NOT NULL  \n);\n```\n\n提示：在输入长命令时很容易出错，特别是在使用命令行时。如果发生这种情况，只需按键盘上的上箭头调出之前的命令，并使用左、右箭头导航到出错的地方进行修复。\n\
    \n要查看数据库中的表列表，请输入以下代码：\n\n```sql\nSHOW tables;\n```\n\n你将看到以下输出：\n\n```\n+-----------------+\
    \  \n| Tables_in_music |  \n+-----------------+  \n| album           |  \n+-----------------+\n\
    ```\n\n当你按下回车键时，下面的表将被添加到数据库中。让我们分析一下正在发生什么：\n\n1. **创建 Album 表**：`CREATE TABLE()`\
    \ 创建新表，括号内的行定义了表的结构。\n2. **为每个专辑分配唯一 ID**：字段（列）`AlbumID` 具有以下属性：\n   - `smallint\
    \ unsigned`（无符号整数）——这意味着我们可以在 `0` 到 `65,535` 范围内存储数据。 \n   - `NOT NULL` —— 意味着在创建记录时该字段不能为空。\n\
    \   - `auto_increment` —— 意味着你不需要在该字段中输入任何内容。当创建记录时，MySQL 会为其分配一个新值。\n   - `PRIMARY\
    \ KEY` - 每个表只能有一个主键。它用于唯一标识数据库中的记录/行，且一旦创建，它永远不会更改（这将是以牺牲一些存储为代价的）。\n3. **添加 AlbumName\
    \ 字段**：接下来创建一个字段来存储专辑名称。数据类型 `varchar` 表示最多 255 个可变字符。\n4. **添加 AlbumArtist 字段**：此字段存储可变字符，并限制为\
    \ 80 个。\n5. **添加 AlbumType 字段**：枚举类型 `ENUM` 是一个有一组允许值的字符串对象。在我们的情况下，允许的值为 `'L'`（长胶\
    \ Long Play）、`'E'`（扩展播放 Extended Play）和 `'M'`（混合 mix）。\n6. **添加 numTracks 字段**：如果你觉得这不对，说明你很专注！此字段用于存储专辑拥有的曲目数量，应该是数值类型而不是字符串类型。这样做是为了演示以后如何更改字段的数据类型。\n\
    7. **添加 DateReleased 字段**：最后创建的一行存储专辑的发行日期。`date` 数据类型用于存储日期值。\n\n让我们来看你将使用的一些常用数据类型：\n\
    - **数值类型**：`INT`（整数 -2³¹ 到 2³¹-1）、`FLOAT`（小数 -1.1E-38 到 1.1E37）、`Double`（小数 -1.7E-308\
    \ 到 1.7E307）。\n- **字符串类型**：`CHAR`（固定长度字符串）、`VARCHAR`（变长字符串）、`ENUM`（具有有限值的字符字符串）。\n\
    - **日期和时间**：`DATE` (`YYYY-MM-DD`）、`TIME` (`HH:MM:SS`）、`DATETIME` (`YYYY-MM-DD\
    \ HH:MM:SS`）、`YEAR` (`YYYY`）。\n\n### 修改表\n\n有时你可能会出错，或者只是想更改表中的内容。幸运的是，你可以通过 MySQL\
    \ 的 `ALTER` 语句来实现。我们将查看更改表名和数据类型。首先，我们需要通过输入以下命令来查看我们刚刚创建的表：\n\n```sql\nDESCRIBE\
    \ Album;\n```\n\n你应该看到以下输出：\n\n```\n+--------------+----------------------+-----++----------------+\n\
    | Field       | Type                 | Null | Default | Extra           |\n+--------------+----------------------+-----++----------------+\n\
    | AlbumID     | smallint(5) unsigned | NO    | NULL    | auto_increment |\n| AlbumName\
    \   | varchar(255)         | NO    | NULL    |                 |\n| AlbumArtist\
    \ | varchar(80)          | NO    | NULL    |                 |\n| AlbumType  \
    \ | enum('A','E','M')   | NO    | NULL    |                 |\n| numTracks   |\
    \ varchar(3)           | NO    | NULL    |                 |\n| DateReleased|\
    \ date                 | NO    | NULL    |                 |\n+--------------+----------------------+-----++----------------+\n\
    ```\n\n我们确实可以更改：\n\n1. **更改表名**：单数形式“Album”作为表名并不太合理，因为表用于存储多条记录。我们应该使用复数形式使其符合逻辑。以下是更改表名的方法：\n\
    \n```sql\nRENAME TABLE Album TO Albums;\n```\n\n如果我们输入 `show tables` 命令，应该看到表名已经更改：\n\
    \n```\n+-----------------+\n| Tables_in_music |\n+-----------------+\n| albums\
    \           | \n+-----------------+\n```\n\n2. **更改 numTracks 的数据类型**：`numTracks`\
    \ 字段不应该是字符串类型而是数值。以下代码应将其数据类型更改为相应的：\n\n```sql\nALTER TABLE Albums MODIFY COLUMN\
    \ numTracks smallint(2) NOT NULL;\n```\n\n3. **更改 numTracks 的列名**：看起来我们还没有处理完\
    \ `numTracks` 字段。我们需要更改它使其更具可读性，从 `numTracks` 更改为 `NumberOfTracks`。\n\n```sql\n\
    ALTER TABLE Albums CHANGE numTracks NumberOfTracks smallint(2) NOT NULL;\n```\n\
    \n注意：即使更改列名，我们仍然需要定义数据类型。经过这些更改后，当我们输入描述表的语句时，应该看到以下内容：\n\n"
