    \ Starting MySQL Client\n\nWhat we are to be doing for this hour is entering MySQL\
    \ commands using the command-line of the MySQL client that comes with XAMPP by\
    \ opening up Windows command prompt and navigating to the root folder of where\
    \ XAMPP is installed.\n\nWhen you open command prompt, enter the below command\
    \ to navigate to the \"C\" drive, Assuming XAMPP is installed there, and then\
    \ press enter after that:\n\ncd \\\\\n\nNow, navigate to where the executable\
    \ for the client is installed to start it. That is in xampp->mysql->bin by entering\
    \ the following command and then pressing enter:\n\ncdxampp\\\\mysql\\\\bin\n\n\
    Once there, type the following command:\n\nmysql -u your\\_username -p\n\nReplace\
    \ \"your\\_username\" with your actual username. This is \"root\" by default.\
    \ You will then be asked to enter your password. Once you do that, press enter.\
    \ The password is blank by default and you really ought to change that for security\
    \ reasons. But that is beyond the scope of this book.\n\nIf you notice with command-line\
    \ is being prompted by something called MariaDB. Don't get confused because it\
    \ is just a community-developed fork of the MySQL relational database management\
    \ system. A large number of SQL commands will still work and unlike the previous\
    \ MySQL prompt, it lets you known which database you have selected. \n\nNow we\
    \ are ready to get started!\n\nTIP: Alternatively you can use the phpmyadmin interface\
    \ to create databases and table with just a few clicks. You can also type SQL\
    \ commands there but since we want to get hard-core as fast as possible, we won't\
    \ be doing that. Besides, nothing in this hour has been hard so far, I hope.\n\
    \n## Creating and Deleting a Database"
