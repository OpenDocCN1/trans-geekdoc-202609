  trans: "\n\n```php\nsubFunction(5, 6);\n?>\n```\n\n输出:\n5 和 6 之间的差是：-1\n\n### 返回值的函数\n\
    \n函数不仅可以接受信息，还可以以返回值的的形式将其传回。只需编写 `return` 关键字，后跟上你希望函数返回的值或对象即可。这会停止函数的执行。\n\n\
    在接下来的示例中，我们使用函数将两个数字相加并返回和。然后我们将数字之和赋值给变量 `$return_val`，然后将其输出到屏幕上。\n\n```php\n\
    <?php\nfunction addFunction($num1, $num2) {\n    $sum = $num1 + $num2;\n    return\
    \ $sum;\n}\n$return_val = addFunction(20, 15);\n\necho \"The value returned by\
    \ the function is: \" . $return_val;\n?>\n```\n\n输出:\n函数返回的值是：5\n\n### 参数的默认值\n\
    \n如果在调用需要参数的函数时没有传递任何参数，我们可以为该参数指定一个默认值。\n\n在下面的示例中，我们调用了三次函数。我们在第一次函数调用时没有传递值，仅仅是为了演示这种差异：\n\
    \n```php\n<?php\nfunction PrintName($name = \"Jack\") {\n    echo \"Hi, my name\
    \ is $name <br />\";\n}\nPrintName(); 将 将使用默认值 Jack\nPrintName(\"Jill\");\nPrintName(\"\
    Adam\");\n?>\n```\n\n输出:\nHi, my name is Jack\nHi, my name is Jill\nHi, my name\
    \ is Adam\n\n## 数组\n\n数组是一种可以在单个变量中存储多个值的数据结构。每个值都与一个键关联，该键用于识别和返回它。\n\n### 数值数组\n\
    \n这些是使用数字作为索引的数组。索引默认从零开始。\n\n创建数值数组有两种方法：\n1. 这种方法会自动分配索引：`$dairy = array(\"\
    yogurt\", \"ice cream\");`\n2. 这种方法手动分配索引：`$dairy[0] = \"yogurt\"`, `$dairy[1]\
    \ = \"ice cream\"`, `$dairy[2] = \"cheese cake\"`\n\n下面的示例展示了如何使用以下方法从数值数组中获取值：\n\
    \n```php\n<?php\n$dairy = array(\"yogurt\", \"ice cream\", \"cheese cake\");\n\
    // 通过索引访问值\necho \"I to eat \" . $dairy[0] . \", \" . $dairy[1] . \" and \" .\
    \ $dairy[2] . \"!\";\n// PHP 内置函数，返回数组中的元素个数\n$arrayCount = count($dairy);\n//\
    \ 使用 for 循环遍历数值数组\nfor ($i = 0; $i < $arrayCount; $i++) {\n    echo $dairy[$i]\
    \ . \"<br />\";\n}\n?>\n```\n\n输出:\nI to eat yoghurt, ice cream and cheese cake!\n\
    yogurt\nice cream\ncheese cake\n\n### 关联数组\n\n使用字符串作为索引，这使得键和值之间建立了强有关联。\n\n创建关联数组有两种方法。我们将通过西装的价格来演示：\n\
    1. 第一种方法：`$suit_prices = array(\"batman\" => 4000, \"arrow\" => 1500, \"superman\"\
    \ => 0);`\n2. 第二种方法：`$suit_prices[\"batman\"] = 4000;`, `$suit_prices[\"arrow\"\
    ] = 1500;`, `$suit_prices[\"superman\"] = 0;`\n\n注意：在输出关联数组的值时，不要将关联数组放在双引号内，否则值将无法输出。\n\
    \n下面的示例演示了如何访问关联数组的值：\n\n```php\n<?php\n$suit_prices = array(\"batman\" => 4000,\
    \ \"arrow\" => 1500, \"superman\" => 0);\necho \"The Bat suit costs: \" . $suit_prices['batman']\
    \ . \"<br />\";\necho \"The Green Arrow suit costs: \" . $suit_prices['arrow']\
    \ . \"<br />\";\necho \"The Superman suit costs: \" . $suit_prices['superman']\
    \ . \"<br />\";\n?>\n```\n\n输出:\nThe Bat suit costs: 4000\nThe Green Arrow suit\
    \ costs: 1500\nThe Superman suit costs: 0\n\n"
- fmt: "\nLet's start by creating a database by entering the following command:\n\n\
    ```sql\nCREATE DATABASE music;\n```\n\nAlways remember this:\n\n- From here onwards,\
    \ all statements and commands typed should end with semicolon or `/g`. Otherwise\
    \ the client will think you are still typing the command and it won’t execute.\n\
    - Although not required, because command line is not case sensitive, MySQL commands\
    \ are typed in uppercase letters to distinguish between commands and things like\
    \ database names, table names, columns and rows.\n\nTo delete the database it\
    \ is as easy as entering:\n\n```sql\nDROP database_name;\n```\n\nWhere `database_name`\
    \ is the name of the database you want to drop.\n\nNow that we have created our\
    \ database, we need to select it in order to create tables. We type the following\
    \ into you command line to select the database we just created, and then press\
    \ enter:\n\n```sql\nUSE music;\n```\n\nWARNING: Don’t forget to select the database\
    \ otherwise you will get errors when you try to create tables etc.\n\nNOTE: the\
    \ command-line prompt will let you know which database you have selected. It should\
    \ look something like this `Maria DB [music]>`.\n\n## Creating, Altering and Deleting\
    \ Tables\n\nNow that we have selected out database, let’s create some tables.\
    \ The first table we will create is about information on the artist.\n\nIt is\
    \ good practice (and headache saving) to first check if any tables with the same\
    \ name exists because you can’t create two tables with the same name in the same\
    \ database. If one is found, it is deleted along with its data. So, be careful\
    \ with this command especially if the table is related to other tables.\n\n###\
    \ Creating Tables\n\nWe create the table as follows:\n\n```sql\nCREATE TABLE Album\n\
    (  \n    AlbumID smallint unsigned NOT NULL auto_increment PRIMARY KEY,  \n  \
    \  AlbumName varchar(255) NOT NULL,  \n    AlbumArtist varchar(80) NOT NULL, \
    \ \n    AlbumType ENUM('A', 'E', 'M') NOT NULL,  \n    numTracks varchar(3) NOT\
    \ NULL,  \n    DateReleased DATE NOT NULL  \n);\n```\n\nTIP: When typing large\
    \ commands it is easy to mess up. Especially when using the command line. If this\
    \ happens just press the up arrow on your keyboard to bring up previous commands\
    \ and use the left and right arrows to navigate to where you messed up and fix.\n\
    \nTo see the list of tables in you database, enter the following piece of code:\n\
    \n```sql\nSHOW tables;\n```\n\nYou see the following output:\n\n```\n+-----------------+\
    \  \n| Tables_in_music |  \n+-----------------+  \n| album           |  \n+-----------------+\n\
    ```\n\nWhen you press Enter, the following table will be added to the database.\
    \ Let us break down what is happening:\n\n1. **Creating Album**: `CREATE TABLE()`\
    \ creates a new table and the lines inside the parenthesis define the table’s\
    \ structure.\n2. **Giving Each Album Unique ID**: The field (or column) `AlbumID`\
    \ has the following properties:\n   - `smallint unsigned` (unsigned integer) –\
    \ this means we can store in the range `0` to `65,535`. \n   - `NOT NULL` – this\
    \ means the field cannot be left blank when creating a record.\n   - `auto_increment`\
    \ – this means you don’t have to enter anything in the field. When a record is\
    \ created, it will be assigned a new value by MySQL.\n   - `PRIMARY KEY` - Each\
    \ table can only have one Primary Key. It is used to uniquely identify a record/row\
    \ in a database and once created, it never be changed (at the expense of some\
    \ storage).\n3. **Adding AlbumName Field**: Next create a field to store the name\
    \ of the album. The data type `varchar` stands for variable number of characters\
    \ up to 255.\n4. **Adding AlbumArtist Field**: This field stores variable number\
    \ of characters and is limited to 80.\n5. **Adding AlbumType Field**: The enumerated\
    \ type `ENUM` is a string object that has a set of allowed values. In our case,\
    \ allowed values are `'L'` (Long Play), `'E'` (Extended Play) and `'M'` (mix).\n\
    6. **Adding numTracks Field**: If this seems wrong to you, you have been paying\
    \ attention! This field is used to store the number of tracks the album has and\
    \ should be numeric type not a string type. This was done to demonstrate how to\
    \ change the data type of a field later.\n7. **Adding DateReleased Field**: The\
    \ last line created stores the date the album was released. The `date` data type\
    \ is used to store date values.\n\nLet us look at some of the common data types\
    \ you will be using:\n- **Numeric Types**: `INT` (whole number -2^31 to 2^31-1),\
    \ `FLOAT` (Decimal spaces -1.1E-38 to 1.1E37), `Double` (Decimal spaces -1.7E-308\
    \ to 1.7E307).\n- **String Types**: `CHAR` (fixed length string), `VARCHAR` (string\
    \ with variable length), `ENUM` (character string that has a limited number of\
    \ values).\n- **Date and Time**: `DATE` (`YYYY-MM-DD`), `TIME` (`HH:MM:SS`), `DATETIME`\
    \ (`YYYY-MM-DD HH:MM:SS`), `YEAR` (`YYYY`).\n\n### Altering Tables\n\nSometimes\
    \ you can make a mistake or just wish to change things in your table. Luckily,\
    \ you can do so with MySQL by `ALTER` statements. We will look at changing table\
    \ names and data types. First we need to look at the table we just created by\
    \ typing the following command to describe our table:\n\n```sql\nDESCRIBE Album;\n\
    ```\n\nYou should see the following output:\n\n```\n+--------------+----------------------+-----+---------+----------------+\n\
    | Field       | Type                 | Null | Default | Extra           |\n+--------------+----------------------+-----+---------+----------------+\n\
    | AlbumID     | smallint(5) unsigned | NO    | NULL    | auto_increment |\n| AlbumName\
    \   | varchar(255)         | NO    | NULL    |                 |\n| AlbumArtist\
    \ | varchar(80)          | NO    | NULL    |                 |\n| AlbumType  \
    \ | enum('A','E','M')     | NO    | NULL    |                 |\n| numTracks \
    \  | varchar(3)           | NO    | NULL    |                 |\n| DateReleased|\
    \ date                 | NO    | NULL    |                 |\n+--------------+----------------------+-----+---------+----------------+\n\
    ```\n\nWe can indeed change:\n\n1. **Changing the Table Name**: The singular form\
    \ “Album” doesn’t make much sense as a table is used to store multiple records.\
    \ We should use the plural form and change it to `Albums` so it makes more sense.\
    \ Here is how we change the table name:\n\n```sql\nRENAME TABLE Album TO Albums;\n\
    ```\n\nIf we enter the `show tables` command we should see the table name has\
    \ changed:\n\n```\n+-----------------+\n| Tables_in_music |\n+-----------------+\n\
    | albums           | \n+-----------------+\n```\n\n2. **Changing The Data Type\
    \ of numTracks**: The field `numTracks` should not be a string type but numeric.\
    \ The following code should change its data type to the appropriate one:\n\n```sql\n\
    ALTER TABLE Albums MODIFY COLUMN numTracks smallint(2) NOT NULL;\n```\n\n3. **Changing\
    \ the Column Name for numTracks**: It seems we are still not done with the field\
    \ `numTracks`. We need to change it to make it a little more readable by changing\
    \ it from `numTracks` to `NumberOfTracks`.\n\n```sql\nALTER TABLE Albums CHANGE\
    \ numTracks NumberOfTracks smallint(2) NOT NULL;\n```\n\nNOTE: we still have to\
    \ define the data type even when changing the name of the column. With the following\
    \ changes, when we enter the statement to describe the table, we should see the\
    \ following:\n"
