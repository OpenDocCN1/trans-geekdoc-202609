    # 第 4 章：为什么 AI 对企业很重要？


    目前，然而，我们对人脑的组织方式还不够了解，无法构建一个在一般意义上与人类一样或更聪明的人工大脑。 ![](img/image_rsrc8V.jpg)


    根据研究机构 IDC 的数据，到 2025 年，全球产生的数据量将达到 175 兆字节（即 175 亿太字节），相比 2018 年产生的 33 兆字节数据，增长了惊人的
    430%。对于致力于数据驱动决策的公司来说，数据的激增将是一大利好。大型数据集是推动现有业务运营改进并催生新业务线的至关重要的深入分析的原材料。然而，如果没有
    AI，公司无法利用这些数据存储。正如作家 Mary K. Pratt 在其文章“数据驱动运营业务追求中 AI 的重要性”中报道的那样，AI 和大数据在 21
    世纪商业成功中发挥着共生作用：深度学习（AI 的一个子集）处理大型数据存储，以识别大数据中的微妙模式和相关性，这些模式和相关性可以为公司带来竞争优势；同时，AI
    做出有意义预测的能力——即探究事情的真相，而非模仿人类偏见——需要高质量的数据，并且通常需要大量的数据。AI 对 21 世纪商业的重要性已被比作 20 世纪初电力的战略价值，当时电气化改造了制造业等行业，并创造了大众传播等新行业。“AI
    是战略性的，因为当今商业的规模、范围、复杂性和动态性都极其极端，人类已无法在没有人工智能的情况下进行管理，”Bain & Company 合伙人兼董事 Chris
    Baum 对 TechTarget 表示。AI 在近未来对商业最大的影响源于其自动化和增强当今由人类完成的工作的能力。预计使用 AI 实现的劳动收益将扩大并超过当前工作场所自动化工具所取得的收益。并且通过分析海量数据，AI
    不会简单地自动化工作任务，而是会生成完成任务的最高效方式，并随着情况变化即时调整工作流程。AI 已经在许多领域增强了人类工作，从协助医生进行医疗诊断，到帮助呼叫中心员工更有效地处理客户查询和投诉。在安全领域，AI
    正在被用于自动响应网络安全威胁并优先处理需要人工关注的威胁。银行正在使用 AI 来加快和支持贷款处理并确保合规。（参见“当前和潜在用例”部分。）但 AI 也将消除当今由人类完成的许多工作——这是工人的一大担忧，如下文关于
    AI 的益处和风险的章节所述。


    ## 企业中 AI 的益处


    目前，大多数公司希望利用 AI 来优化现有运营，而不是从根本上转变其商业模式。上述提到的生产率和效率提升是企业实施 AI 最常被引用的益处。以下是 AI 为企业带来的五个额外关键益处：


    • 改善客户服务。AI 加快和个性化客户服务的能力是企业期望从 AI 中获得的顶级益处之一，在 2019 年 MIT Sloan 波士顿咨询集团的一项研究中，它在
    AI 回报中排名第 2。管理层和


    • 改善监控。AI 实时处理数据的能力意味着组织可以实现近乎即时的监控；例如，工厂车间正在使用图像识别软件和机器学习模型在质量控制过程中监控生产并标记问题。


    • 加快产品开发。AI 能够缩短开发周期，并减少设计与商业化之间的时间，从而更快地实现开发资金的投资回报率。


    • 提高质量。组织希望通过在以前手动完成或使用传统自动化工具（如提取、转换和加载）完成的任务上使用 AI，来减少错误并提高对合规标准的遵守程度。财务对账是机器学习例如已大幅降低成本、时间和错误的一个领域。


    • 商业模式创新与扩张。像亚马逊、爱彼迎、优步等数字原生企业当然已经利用 AI 来帮助实施新的商业模式。传统公司可能会发现 AI 赋能的商业模式转型难以推行，据
    Google 和 Baidu 的 AI 发展先驱、现任 Landing AI 首席执行官兼联合创始人 Andrew Ng 表示。他提供了一套六步指南，帮助传统公司落地
    AI。


    ## AI 风险


    企业有效使用 AI 面临的最大风险之一是员工不信任。许多员工害怕和不信任 AI，或者仍然不相信其在工作场所的价值。许多布鲁金斯学会的研究表明，对工作被取消的担忧并非没有根据。一份来自“自动化与人工智能：机器如何影响人与地方”的报告估计，未来十年约有
    3600 万个工作“面临高度自动化风险”。最容易被取消的工作集中在办公室行政、生产、运输和食品准备领域，但该研究发现，到 2030 年，几乎每个职业都将在某种程度上受到
    AI 赋能自动化的影响。（Gartner 曾表示，2020 年 AI 将是净积极的工作推动因素，消除 180 万个工作岗位，同时创造 230 万个工作岗位。）


    更令人立即担忧的是，人们普遍对 AI 在工作场所的价值持怀疑态度：根据 Gartner 2019 年 CIO 议程调查，42% 的 IT 和业务高管受访者并不完全理解在工作场所使用的人工智能优势。报告指出，对未知的恐惧导致了部分这种怀疑态度，并补充说，业务和
    IT 领导者必须接受量化 AI 对员工利益的挑战。公司必须努力将 AI 与具体的 KPI（如收入增加和节省的时间）联系起来，并培训员工掌握在 AI 赋能的工作场所中所需的新技能。如果没有员工的信任，AI
    的益处将付诸东流，德勤咨询 LLP 的 AI 管理董事 Beena Ammanath 在一篇关于企业在实施该技术时必须面对的顶级 AI 风险的文章中对 TechTarget
    表示。“有些情况下，算法运行得非常好，但员工没有接受培训或没有动力去使用它，”Ammanath 说。考虑工厂车间上一个 AI 系统的例子，它确定制造机器何时需要停机维护。最好的
    AI 解决方案可以被制定出来，这可能有 99.998% 的正确性，并且它还可能提示工厂工人关闭机器。但如果最终用户对机器没有信心，这并不罕见，那么 AI 将被视为失败，”Ammanath
    说。随着 AI 模型变得更加复杂，可解释性——理解 AI 如何得出结论——将变得越来越难以向需要信任 AI 来做决策的一线员工传达。根据本报告中关于可解释
    AI 技术的专家访谈，公司必须把用户放在首位：数据科学家应专注于向特定领域专家提供相关信息，而不是深入模型工作原理的细节。


