    human intelligence, or cognitive functions which refers to the ability to think
    and decide. Broad or Strong AI simply refers to artificial general intelligence
    (`AGI`), that concentrates on the creation of sophisticated machines that can
    imitate and successfully accomplish any intellectual task, most especially the
    ones human beings can do. The ability to analyze and come up with solutions for
    intelligent components can be broken down into the following parts:


    • The ability to interchange knowledge from different domains and apply it into
    different settings.


    • The capability to plan for the future, based on prior knowledge and experience.


    • The capacity to adapt to any changes being made in the surrounding environment.


    In addition to the components mentioned, some back-hand aspects of a strong, or
    general AI include the abilities to solve complex puzzles, reason, along with
    the capacity to display intelligence and common sense.


    With that said, several specialists, and researchers tend to differ with the somewhat
    limiting definition of Strong AI, stating their uncertainty in classifying Strong
    AI as intelligent, simply because it can emulate the cognitive abilities of the
    human brain, like the ability to communicate. Bearing witness to the rather newfound
    notion of the legitimacy of how we define Strong AI, is the Turing test, which
    represents a system in which human beings are rendered unable to distinguish between
    the cognitive abilities between a human and a machine. The Turing test puts a
    machine, an interrogator, and a human in a conversational setting. If the interrogator
    fails to distinguish between the machine and human, the Turing test is passed.
    Keeping the Turing test in mind, the inexplicit surrounding the definition of
    Strong AI has become obviously evident. For starters, as demonstrated by the Turing
    test, if an AI can successfully replicate the ability to communicate- can we classify
    it as smart? The dilemma surrounding the age-old question of what classifies as
    intelligence only gets more challenging to answer when you take into account the
    Chinese Room test, which aims to check whether a machine understands Chinese,
    or simulates the ability to understand Chinese. John Searle, the creator of the
    Chinese Room test, states that without the process of understanding, it’s impossible
    to determine whether a strong AI is just a glorified version of a less smart simulation.
    Additionally, philosophers different experts, researchers and ascribe the capacity
    to experience consciousness as a Strong AI system, that sets the mark very high
    for artificial intelligence to achieve in general.


    ### Weak AI


    As we mentioned above in the run-off-the-mill conventional definition of Weak
    AI, the term refers to any AI that responds to situations based on a prefed set
    of information. However, by the varying definitions of Strong AI, it’s quite easy
    to conclude that all the artificial technology we’ve created up until this point
    is technically Weak AI. With that said, the implications of the Weak AI generate
    an image in which AI systems are inefficient in accomplishing against intellectual
    tasks, which isn’t the case. Instead, weak, or the much better alternative, narrow
    AI applies to technologies that advance progressively in complexity as times change.
    Today, Weak AI is represented by speech identification, chatbots, or even self-driving
    or driverless cars like Tesla. A couple of years ago, however, the situation was
    completely different as modern technologies of the time, such as OCR (`Optical
    Character Recognition`), were considered as artificial intelligence.


    ### Theory of mind


    This type of as-yet-unrealized AI is defined as capable of understanding human
    motives and reasoning and therefore able to deliver personalized results based
    on an individual''s motives and needs. Also referred to as artificial general
    intelligence (`AGI`), theory of mind AI can learn with fewer examples than limited
    memory machines; it can contextualize and generalize information, and extrapolate
    knowledge to a broad set of problems. Artificial emotional intelligence, or the
    ability to detect human emotions and empathize with people, is being developed,
    but the current systems do not exhibit theory of mind and are very far from selfawareness,
    the next milestone in the evolution of AI.


    ### Self-aware AI aka artificial superintelligence


    This type of AI is not only aware of the mental state of other entities but is
    also aware of itself. Self-aware AI, or artificial superintelligence (`ASI`),
    is defined as a machine with intelligence on par with human general intelligence
    and in principle capable of far surpassing human cognition by creating ever more
    intelligent versions of itself.

