  trans: "\n\n# 为预测患者再入院风险的机器学习模型\n\n为预测患者再入院风险的机器学习模型，例如，医生可能希望了解其背后的医学原因，而出院规划师可能希望了解再入院的可能性。\n\
    \n# 三大 AI 风险摘要\n\n以下是上文引用文章中讨论的三大 AI 风险摘要：\n\n• **AI 错误。** 虽然 AI 可以消除人为错误，但有问题的数据、训练数据不佳或算法中的错误可能导致\
    \ AI 错误。而且，由于 AI 系统通常处理大量交易，这些错误可能会被危险地放大。“人类一天可能会犯 30 个错误，但每天处理数百万笔交易的机器人会放大任何错误，”Bain\
    \ & Company 的 Brahm 表示。\n\n• **不道德的公司需要和意外做法。** 为防范不道德的 AI。企业领导者可能熟悉有关一些法官用于判刑和决定保释的基于\
    \ AI 的风险预测工具中存在种族偏见的报告。公司还必须警惕使用 AI 进行商业决策的意外后果。一个例子是连锁杂货店利用 AI 根据其他杂货店的竞争情况来确定价格。在竞争很少或没有竞争的贫困社区，合理的建议可能是提高食品价格，但这是连锁杂货店打算采取的策略吗？\n\
    \n• **关键技能的侵蚀。** 这是一种很少被考虑但并非不重要的 AI 风险。在涉及波音 737 Max 飞机的两起空难之后，一些专家表示担忧，飞行员正在失去基本飞行技能——或者至少是运用这些技能的能力——因为飞机驾驶舱中越来越依赖\
    \ AI。尽管这些是极端案例，但这些事件应该引发关于企业可能希望在其人力员工中保留哪些关键技能的问题，随着 AI 的使用扩大，Brahm 表示。\n\n#\
