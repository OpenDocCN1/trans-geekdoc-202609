    # Chapter 1: 什么是人工智能？


    improve sharpen free up cybersecurity, workers from everyday tasks, improve existing
    products and point the way to new products. It is hard to think of an area in
    the enterprise where AI -- the simulation of human processes by machines, especially
    computer systems -- will not have a deep impact.


    人工智能（AI）可以描述为计算机科学的一个广泛分支，该分支深度关注机器能够胜任执行通常需要人类智能的任务的智能开发。AI 是一门跨学科科学，拥有各种方法，但机器学习和深度学习的技术进步正在引发几乎全球科技行业每个领域的范式转变。


    企业领导者已决心使用 AI 来增强其业务并确保投资获得丰厚回报，但 nonetheless，在多个方面面临巨大挑战：


    • 人工智能领域正在迅速变化，因为正在进行大量的 AI 研究。全球最大的公司、研究机构和政府正在支持 AI 方面的重大研究计划。


    • AI 的应用场景多种多样：AI 可以应用于公司或人类面临的任何问题。在新型病毒爆发期间，AI 在全球遏制传播、检测热点、改善患者护理、识别疗法和开发疫苗的努力中发挥着重要作用。随着我们最终走出疫情，分析机构
    Forrester Research 预计，随着公司努力增强抵御其他灾难的韧性，对 AI 赋能的硬件和软件机器人的投资将激增。


    • 要获得 AI 的价值，企业领导者必须了解 AI 的工作原理、AI 技术可以轻松应用于其业务的领域以及不能应用的领域——鉴于上述原因，这是一项艰巨的任务。


    这篇面面俱到的指南为成为超级智能的人工智能商业消费者提供了基础。这始于对 AI 工作原理及 AI 主要类型和意义的简要解释。你将了解 AI 对公司的意义，包括对
    AI 主要优势及其带来的技术和伦理风险的讨论；当前和潜在的 AI 应用场景；将 AI 应用程序纳入现有业务流程的挑战；以及推动该领域发展的一些技术进步。在整个指南中，我们包含指向
    TechTarget 文章的超链接，这些文章提供了所讨论主题的更多细节和见解。


    ## AI 如何工作？


    企业中完成的许多任务并非自动化，而是需要一定程度的智能。什么是智能，尤其是在工作环境下，并不容易界定。广义上讲，智能是获取知识并将其应用以实现结果的能力：采取的行动与具体情况相关，而非机械重复。让机器以这种方式运行，通常就是人工智能所指的含义。


    但正如 AI 专家所强调的，AI 没有单一或简单的定义。在 2016 年国家科学与技术委员会关于为 AI 未来做准备的报告中，作者指出，AI 的定义因从业者而异。有些人将
    AI 描述为一种计算机化系统，其表现出通常被认为需要智能的行为。另一些人将 AI 定义为能够理性地解决复杂问题，或在遇到的任何现实事件中采取必要行动以实现其目标和愿景的系统，报告中这样写道。


    此外，作者解释，什么是智能机器是一个移动的目标：一旦被认为需要 AI 的问题得到解决，它很快就会被视为“常规数据处理”。


    在基本层面上，AI 编程专注于三种认知技能：学习、推理和自我纠正。


    • AI 编程的学习方面侧重于获取数据并创建将数据转化为功能性信息的规则。这些规则称为算法，为计算系统提供完成特定任务的逐步指令。


    • 推理方面涉及 AI 在一组算法中选择最合适的算法以在特定情境下使用的能力。


    • 自我纠正方面侧重于 AI 逐步调整和改进结果，直到实现预期目标的能力。


    # Chapter 2: AI 演进：4 种 AI 类型


    具有人类类似智能的机器概念可以追溯到古代，例如希腊神话中提到的金属自动机，以及埃及工程师建造的自动机雕像。基于计算机系统的现代 AI 通常被认为始于 20
    世纪 50 年代中期，当时在达特茅斯学院校园的一次夏季会议上提出了“人工智能”这一术语。


    自那时起，AI 在企业中的作用时兴时衰，经历了两段被称为 AI 冬天的时期，当时资金和行业兴趣有所下降。尽管有这些停滞期，AI 仍在不断发展。几十年来，计算机科学家、数学家和其他领域的专家一直致力于通过改进算法或硬件来推动该领域的发展。


    ![](img/image_rsrc8U.jpg)


    在文章“4 种主要 AI 类型详解”中，作者 David Peterson 描述了智能如何从能够执行简单分类和模式识别任务的现代 AI 系统，演变为能够利用历史数据进行预测的系统。得益于深度学习（即从数据中学习的
    AI）的革命，机器智能在 21 世纪迅速发展，带来了自动驾驶汽车以及虚拟助手 Alexa 和 Siri 等突破性产品。


    尽管有感知机器人是流行文化中的常见元素，但展现人类水平通用智能和意识的 AI 类型仍在开发中。


    以下是 Peterson 文章中概述的四类 AI 及其特征摘要：


    ## 反应式 AI


    这种早期 AI 类型中使用的算法缺乏记忆且具有反应性：也就是说，给定特定输入，输出始终相同。使用这种类型 AI 的机器学习模型对简单的分类和模式识别任务有效。它们可以考虑大量数据并产生看似智能的输出，但无法分析包含不完整信息或需要历史理解的场景。


    ## 有限记忆机器


    有限记忆机器中的底层算法基于我们对人脑工作原理的理解，并旨在模仿我们神经元的连接方式。这种机器的“深度学习”可以处理复杂的分类任务，并利用历史数据进行预测；它还能够处理复杂任务，例如自动驾驶。


    for a clear explanation of three terms that are often used interchangeably but
    have important distinctions. While AI sometimes yields superhuman performance
    in these fields, we still have a long way to go before AI can actually compete
    with human intelligence. For now, there is no AI that can learn the way humans
    do, that is, with just a few examples. AI needs to be trained on mountains of
    data to understand any topic. We still don''t have algorithms that are capable
    of transferring their understanding of one domain to another. For instance, if
    we learn a game such as StarCraft, we can play StarCraft II just as quickly. But
    for AI, it''s a whole new world and it must learn each game from scratch.


    Human intelligence also possesses the ability to link meanings. For instance,
    consider the word "human." We can identify humans in pictures and videos, and
    AI has also gained that capability. But we also know what we should anticipate
    from humans: We never expect a human to have four wheels and emit carbon like
    a car. Yet, there is no AI that can even tell what was wrong with the sentence
    I just wrote. So, AI''s definition is a moving target. We were amazed when AI
    algorithms got so sophisticated that they outperformed expert human radiologists
    but later learned about their limitations. That''s why we now distinguish between
    the current "narrow" AI and the human-level version of AI that we are pursuing:
    artificial general intelligence.


    ## 什么是机器学习？


    机器学习是 AI 的一个子集——它是我们开发的模仿人类智能的 AI 算法之一。另一种 AI 类型是符号 AI 或老派 AI（GOFAI），即使用 if-then
    条件的基于规则的系统。机器学习标志着 AI 发展的一个转折点。在机器学习之前，我们试图教会计算机每个决策的方方面面。这使得过程完全可见，算法也能处理许多复杂场景。


    ### 机器学习与深度学习


    在最复杂的形式中，AI 会遍历许多决策分支并找到结果最好的一个。这就是 IBM 的深蓝被设计用来击败加里·卡斯帕罗夫下棋的方式。但有许多事情我们根本无法通过基于规则的算法来定义：例如，人脸识别。基于规则的系统需要检测不同的形状，如圆形，然后确定它们的位置以及在什么其他对象内，以便构成一只眼睛。更别问程序员如何编写检测鼻子的代码了！


    机器学习采用完全不同的方法，让机器通过摄入大量数据并检测模式来自行学习。许多机器学习算法使用统计公式和大数据来运行，可以说，我们在大数据方面的进步以及收集的海量数据，最初使机器学习成为可能。


    用于分类和回归的一些机器学习算法包括线性回归、逻辑回归、决策树、支持向量机、朴素贝叶斯、k-近邻、k-means、随机森林和降维算法。


    ## 什么是深度学习？


    深度学习是机器学习的一个子集。它仍然涉及让机器从数据中学习，但它标志着 AI 演进的一个重要里程碑。深度学习是基于我们对神经网络的理解而开发的。基于神经网络构建
    AI 的想法自 20 世纪 80 年代就已存在，但直到 2012 年深度学习才真正获得关注。


    就像机器学习得益于我们产生的海量数据一样；深度学习的普及得益于变得更便宜的计算能力（以及其算法的进步）。深度学习实现了原本仅靠机器学习无法实现的更智能的结果。


    考虑前面的人脸识别示例：为了检测人脸，我们应该给 AI 什么样的数据，它又该如何学习该寻找什么，考虑到我们能提供的唯一信息是像素颜色？深度学习利用多层信息处理，每一层逐渐学习数据越来越复杂的表示。早期层可能学习颜色，接下来的层学习形状，再下一层学习这些形状的组合，最后学习实际对象。


    深度学习在对象识别方面取得了突破，其发明使 AI 在多个领域迅速发展，包括自然语言理解。深度学习目前是我们开发的最先进的 AI 架构。有几种深度学习算法，包括卷积神经网络、循环神经网络、长短期记忆网络、生成对抗网络和深度置信网络。


    # Chapter 3: 总结：AI 与机器学习与深度学习


    与 AI 不同，机器学习和深度学习有非常明确的定义。我们曾认为是 AI 的东西会随时间而变化。例如，光学字符识别（OCR）曾被认为是 AI，但现在不再是。然而，在今天的定义下，一个在数千份手写体上训练并能够学习将其转换为文本的深度学习算法，将被认为是
    AI。


    机器学习和深度学习都代表了 AI 演进的重大里程碑，随着我们朝着今天所称的人工通用智能迈进，未来可能会有更多里程碑。


    尽管有限记忆机器在某些任务上远超典型的人类表现，但在其他方面仍落后于人类智能。它们需要大量训练数据来学习人类只需几个示例即可掌握的任务，并且容易受到异常值或对抗性示例的影响。这种“弱或窄
    AI”反映了当前 AI 发展的状态。正如 Peterson 所指出的，有些人认为该领域可能正在遇到瓶颈。


    ## 用新视角理解强 AI 与弱 AI


    在信息时代，人工智能的影响可以体现在最微不足道的任务中。从我们早上醒来时指示 Amazon 的 Alexa 播放的歌曲，到我们经常交谈的聊天机器人，我们的现代生活完全沉浸在为我们学习、为我们思考并帮助我们做出更好决策的机器中。


    话虽如此，然而，不断演变的网络安全威胁格局中，网络犯罪分子正在转向 AI，并将其作为工具对个人和组织造成破坏。幸运的是，AI 也可以用于对抗网络安全，这是大多数高管和网络安全专家共享的信念。


    无论 AI 和机器学习对生活产生了多么深远的影响，人工智能所追求的首要目标是：创造一台足够强大、足够智能、能够处理各种环境下任何水平认知难度的机器——这与人脑的运作方式非常相似。


