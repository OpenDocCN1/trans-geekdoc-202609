    # Chapter 4: Why Is AI Important In The Enterprise?


    Currently, however, we don''t know enough about how the human brain is organized
    to build an artificial one that is as, or more, intelligent in a general sense.
    ![](image_rsrc8V.jpg)


    According to research firm IDC, by 2025, the volume of data generated worldwide
    will reach 175 zettabytes (that is, 175 billion terabytes), an astounding 430%
    increase over the 33 zettabytes of data produced by 2018. For companies committed
    to data-driven decision-making, the surge in data will be a boon. Large data sets
    are the raw material for the vital indepth analysis that drives improvements in
    existing business operations and leads to new lines of business. Companies cannot
    capitalize on these data stores, however, without AI. As writer Mary K. Pratt
    reported in her article "Importance of AI in the business quest for data-driven
    operations," AI and big data play a symbiotic role in 21st century business success:
    Deep learning, a subset of AI, processes large data stores to identify the subtle
    patterns and correlations in big data that can give companies a competitive edge;
    simultaneously, AI''s ability to make meaningful predictions -- to get at the
    truth of a matter rather than mimic human biases -- requires high-quality data
    and usually vast amounts of it. AI''s importance to 21st century business has
    been compared to the strategic value of electricity in the early 20th century,
    when electrification transformed industries like manufacturing and created new
    ones like mass communications. "AI is strategic because the scale, scope, complexity
    and the dynamism in business today is so extreme that humans can no longer manage
    it without artificial intelligence," Chris Baum, partner and director at Bain
    & Company, told TechTarget. AI''s biggest impact on business in the near future
    stems from its ability to automate and augment jobs that today are done by humans.
    Labor gains realized from using AI are expected to expand upon and surpass those
    made by current workplace automation tools. And by analyzing vast volumes of data,
    AI won''t simply automate work tasks, but will generate the most efficient way
    to complete a task and adjust workflows on the fly as circumstances change. AI
    is already augmenting human work in many fields, from assisting doctors in medical
    diagnoses to helping call center workers deal more effectively with customer queries
    and complaints. In security, AI is being used to automatically respond to cybersecurity
    threats and prioritize those that need human attention. Banks are using AI to
    speed up and support loan processing and to ensure compliance. (See section "Current
    and potential use cases.") But AI will also eliminate many jobs done today by
    humans -- a major concern to workers, as described in the following sections on
    benefits and risks of AI.


    ## Benefits of AI in the enterprise


    Most companies at this juncture are looking to use AI to optimize existing operations
    rather than radically transform their business models. The aforementioned gains
    in productivity and efficiency are the most cited benefits of implementing AI
    in the enterprise. Here are five additional key benefits of AI for business:


    • Improved customer service. The ability of AI to speed up and personalize customer
    service is among the top benefits businesses expect to reap from AI, ranked No.
    2 among AI payoffs in a 2019 research study by MIT Sloan Boston Consulting Group.
    Management and


    • Improved monitoring. AI''s capacity to process data in real time means organizations
    can implement near-instantaneous monitoring; for example, factory floors are using
    image recognition software and machine learning models in quality control processes
    to monitor production and flag problems.


    • Faster product development. AI enables shorter development cycles and reduces
    the time between design and commercialization for a quicker ROI of development
    dollars.


    • Better quality. Organizations expect a reduction in errors and increased adherence
    to compliance standards by using AI on tasks previously done manually or done
    with traditional automation tools, such as extract, transform and load. Financial
    reconciliation is an area where machine learning, for example, has substantially
    reduced costs, time and errors.


    • Business model innovation and expansion. Digital natives like Amazon, Airbnb,
    Uber and others certainly have used AI to help implement new business models.
    Traditional companies may find AI-enabled business model transformation a hard
    sell, according to Andrew Ng, a pioneer of AI development at Google and Baidu
    and currently CEO and co-founder of Landing AI. He offered a six-step playbook
    for getting AI off the ground at traditional companies.


    ## AI risks


    One of the biggest risks to the effective use of AI in the enterprise is worker
    mistrust. Many employees fear and distrust AI or remain unconvinced of its value
    in the workplace. Anxieties about job elimination are not unfounded, according
    to many Brookings Institute, studies. A report from the "Automation and Artificial
    Intelligence: How Machines Are Affecting People and Places," estimated that some
    36 million jobs "face high exposure to automation" in the next decade. The jobs
    most vulnerable to elimination are in office administration, production, transportation
    and food preparation, but the study found that by 2030, virtually every occupation
    will be affected to some degree by AI-enabled automation. (Gartner has stated
    that in 2020, AI will be a net-positive job motivator, eliminating 1.8 million
    jobs while creating 2.3 million jobs.)


    Of more immediate concern is the prevailing skepticism about AI''s value in the
    workplace: 42% of IT and business executives surveyed do not completely comprehend
    the Artificial Intelligence advantages and that is used in the workplace, according
    to Gartner''s 2019 CIO Agenda survey. Fear of the unknown accounts for some of
    this skepticism, the report stated, adding that business and IT leaders must take
    on the challenge of quantifying the benefits of AI to employees. Companies must
    strive to tie AI to tangible KPIs, such as increased revenue and time saved, as
    well as train employees in the new skills they will need in an AI-enabled workplace.
    Without worker trust, the benefits of AI will come to naught, Beena Ammanath,
    AI managing director at Deloitte Consulting LLP, told TechTarget in an article
    on the top AI risks businesses must confront when implementing the technology.
    There are cases whereby the algorithm works extremely well, but the worker isn''t
    trained or energized to use it," Ammanath said. Consider the example of an AI
    system on a factory floor that determines when a manufacturing machine must be
    shut down for maintenance. The best AI solution can be framed up, and this could
    be 99.998% correct and it could also be prompting the factory worker to shut off
    the machine. But if the end user doesn''t have confidence on the machine, which
    isn''t abnormal, then AI will be seen as a failure," Ammanath said. As AI models
    become more complex, explainability - understanding how an AI reached its conclusion
    -will become ever-harder to convey to frontline workers who need to trust the
    AI to make decisions. Companies must put users first, according to the experts
    interviewed in this report on explainable AI techniques: Data scientists should
    focus on providing the information relevant to the particular domain expert, rather
    than getting into the weeds of how a model works.

