    # Chapter 1: What is Artificial Intelligence?


    improve sharpen free up cybersecurity, workers from everyday tasks, improve existing
    products and point the way to new products. It is hard to think of an area in
    the enterprise where AI -- the simulation of human processes by machines, especially
    computer systems -- will not have a deep impact.


    Artificial intelligence (AI) can be described as a broad-ranging branch of computer
    science that is deeply concerned with machines competent development of smart
    of performing duties that usually needs human intelligence. AI is an interdisciplinary
    science with various approaches, but the technological advancements in machine
    learning as well as deep learning are developing a paradigm shift in virtually
    every sector of the tech industry all the globe.


    Enterprise leaders have determined to use AI to enhance their businesses and ensure
    a great return on their investments, nonetheless, face big challenges on multiplex
    fronts:


    • The domain of artificial intelligence is changing rapidly because of the tremendous
    amount of AI research being done. The world''s biggest companies, research institutions
    and governments around the globe are supporting major research initiatives on
    AI.


    • There are a multitude of AI use cases: AI can be applied to any problem facing
    a company or to humankind writ large. In the novel virus outbreak, AI is playing
    an important role in the global effort to contain the spread, detect hotspots,
    improve patient care, identify therapies and develop vaccines. As we eventually
    emerge from the pandemic, analyst firm Forrester Research expects investment in
    AIenabled hardware and software robotics to surge as companies strive to build
    resilience against other catastrophes.


    • To reap the value of AI, enterprise leaders must understand how AI works, where
    AI technologies can be easily used in their businesses and where they cannot --
    a daunting proposition for the reasons cited above.


    This wide-ranging directs to enterprise AI delivers the building blocks for becoming
    a supersmart business consumer of artificial intelligence. this starts with a
    brief explanation of how AI works and the main types significance of of AI. You
    will learn about the AI to companies, including a discussion of AI''s principal
    advantages and the technical and ethical risks it poses; present and potential
    AI use cases; the challenges of incorporating AI applications into existing business
    processes; and some of the technological advancements driving the field forward.
    Throughout the guide, we include hyperlinks to TechTarget articles that provide
    more detail and insights on the topics discussed.


    ## How Does AI Work?


    Many of the tasks done in the enterprise are not automatic but require a certain
    amount of intelligence. What characterizes intelligence, especially in the context
    of work, is not simple to pin down. Broadly defined, intelligence is the capacity
    to acquire knowledge and apply it to achieve an outcome: The action taken is related
    to the particulars of the situation rather than done by rote. Getting a machine
    to perform in this manner is what is generally meant by artificial intelligence.


    But as AI experts take pains to state, there is no single or simple definition
    of AI. In a 2016 report by the National Science and Technology Council on preparing
    for the future of AI, the authors noted that definitions of AI vary from practitioner
    to practitioner. Some persons described AI as loosely as a computerized system
    that displays behavior that is normally thought of as requiring intelligence.
    Others define AI as a system competent of rationally solving complicated problems
    or taking necessary actions to achieve its goals and vision in whatever real-world
    incidents it encounters" the report stated.


    Moreover, what qualifies as an intelligent machine, the authors explained, is
    a moving target: A problem that is considered to require AI quickly becomes regarded
    as "routine data processing" once it is solved.


    At a basic level, AI programming focuses on three cognitive skills: Learning,
    reasoning and selfcorrection.


    • The learning aspect of AI programing points on obtaining data and creating rules
    for how to turn data into functional information. The rules, called algorithms,
    provide computing systems with step-bystep instructions on how to complete a specific
    task.


    • The reasoning aspect involves AI''s ability to choose the most appropriate algorithm,
    among a set of algorithms, to use in a particular context.


    • The self-correction aspect focuses on AI''s ability to progressively tune and
    improve a result until it achieves the desired goal.


    # Chapter 2: Evolution Of AI: 4 Types Of AI


    The concept of a machine with human-like intelligence dates to ancient times,
    represented in the metal automatons referred to in Greek myths, for example, and
    by the animatronic statues built by Egyptian engineers. Modern AI based on computer
    systems is generally cited as beginning in the mid-1950s when the term artificial
    intelligence was coined at a summer conference on the campus of Dartmouth College.


    Since then, AI''s role in the enterprise has waxed and waned, experiencing two
    periods known as AI winters when funding and industry interest lagged. Despite
    these fallow periods, AI continued to evolve. Over the decades, computer scientists,
    mathematicians and experts in other fields have strived to advance the field either
    by improving the algorithms or the hardware.


    ![](image_rsrc8U.jpg)


    In his article "4 main types of AI explained," author David Peterson described
    intelligence evolved from how modern artificial AI systems capable of simple classification
    and pattern recognition tasks to systems capable of using historical data to make
    predictions. Propelled by a revolution in deep learning -- i.e., AI that learns
    from data -- machine intelligence has advanced rapidly in the 21st century, bringing
    us such breakthrough products as selfdriving cars and virtual assistants Alexa
    and Siri.


    Although sentient robots are a fixture of popular culture, the type of AI that
    demonstrates humanlevel general intelligence and consciousness is a work-in-progress.


    Here are the four categories of AI outlined in Peterson''s article and a summary
    of their characteristics:


    ## Reactive AI


    Algorithms used in this early type of AI lack memory and are reactive: That is,
    given a specific input, the output is always the same. Machine learning models
    using this type of AI are effective for simple classification and pattern recognition
    tasks. They can consider huge chunks of data and produce a seemingly intelligent
    output, but they are incapable of analyzing scenarios that include imperfect information
    or require historical understanding.


    ## Limited memory machines


    The underlying algorithms in limited memory machines are based on our understanding
    of how the human brain works and designed to imitate the way our neurons connect.
    This type of machine "deep learning" can handle complex classification tasks and
    use historical data to make predictions; it also is capable of complex tasks,
    such as autonomous driving.


    for a clear explanation of three terms that are often used interchangeably but
    have important distinctions. While AI sometimes yields superhuman performance
    in these fields, we still have a long way to go before AI can actually compete
    with human intelligence. For now, there is no AI that can learn the way humans
    do, that is, with just a few examples. AI needs to be trained on mountains of
    data to understand any topic. We still don''t have algorithms that are capable
    of transferring their understanding of one domain to another. For instance, if
    we learn a game such as StarCraft, we can play StarCraft II just as quickly. But
    for AI, it''s a whole new world and it must learn each game from scratch.


    Human intelligence also possesses the ability to link meanings. For instance,
    consider the word "human." We can identify humans in pictures and videos, and
    AI has also gained that capability. But we also know what we should anticipate
    from humans: We never expect a human to have four wheels and emit carbon like
    a car. Yet, there is no AI that can even tell what was wrong with the sentence
    I just wrote. So, AI''s definition is a moving target. We were amazed when AI
    algorithms got so sophisticated that they outperformed expert human radiologists
    but later learned about their limitations. That''s why we now distinguish between
    the current "narrow" AI and the human-level version of AI that we are pursuing:
    artificial general intelligence.


    ## What Is Machine Learning?


    Machine learning is a subset of AI -- it''s one of the AI algorithms we''ve developed
    to mimic human intelligence. The other type of AI would be symbolic AI or good
    old-fashioned AI (GOFAI), i.e. rule-based systems using if-then conditions. Machine
    learning marks a turning point in AI development. Before machine learning, we
    tried to teach computers all the ins and outs of every decision they had to make.
    This made the process fully visible, and the algorithm could take care of a number
    of complex scenarios too.


    ### Machine learning vs. deep learning


    In its most complex form, the AI would traverse a number of decision branches
    and find the one with the best results. That is how IBM''s Deep Blue was designed
    to beat Garry Kasparov at chess. But there are many things we simply cannot define
    via rule-based algorithms: for instance, face recognition. A rule-based system
    would need to detect different shapes such as circles, then determine how they
    are positioned and within what other objects, so that it would constitute an eye.
    And don''t ask programmers how to code for detecting a nose!


    Machine learning takes an entirely different approach and lets the machines learn
    by themselves, by ingesting vast amounts of data and detecting patterns. Many
    machine learning algorithms use statistics formulas and big data to function,
    and it is arguable that our advancements in big data and the vast data we collected
    enabled machine learning in the first place.


    Some of the machine learning algorithms used for classification and regression
    include linear regression, logistic regression, decision trees, support vector
    machines, naive Bayes, k-nearest neighbors, kmeans, random forest and dimensionality
    reduction algorithms.


    ## What Is Deep Learning?


    Deep learning is a subset of machine learning. It still involves letting the machine
    learn from data, but it marks an important milestone in AI''s evolution. Deep
    learning was developed based on our understanding of neural networks. The idea
    of building AI based on neural nets has been around since the 1980s, but it wasn''t
    until 2012 that deep learning got real traction.


    Just like machine learning owes its bloom to the vast amount of data we produced;
    deep learning owes its adoption to the much cheaper computing powers that became
    available (as well as advancements in its algorithm). Deep learning enabled much
    smarter results than were originally possible with machine learning.


    Consider the face recognition example from earlier: In order to detect a face,
    what kind of data should we give to the AI and how should it learn what to look
    for, given that the only information we can provide is pixel colors? Deep learning
    makes use of layers of information processing, each gradually learning more and
    more complex representations of data. The early layers may learn about colors,
    the next ones learn about shapes, the following about combinations of those shapes
    and finally actual objects.


    Deep learning demonstrated a breakthrough in object recognition, and its invention
    made AI quickly advance on several fronts, including natural language understanding.
    Deep learning is currently the most sophisticated AI architecture we have developed.
    There are several deep learning algorithms, including convolutional neural networks,
    recurrent neural networks, long short-term memory networks, generative adversarial
    networks and deep belief networks.


    # Chapter 3: Wrapping Up: AI Vs. Machine Learning Vs. Deep Learning


    Contrary to AI, machine learning and deep learning have very clear definitions.
    What we considered AI changes over time. For instance, object character recognition,
    or OCR, used to be considered AI, but no longer is. However, a deep learning algorithm
    trained on thousands of handwritings and able to learn to convert those to text,
    by today''s definition, would be considered AI.


    Machine learning and deep learning both represent great milestones in AI''s evolution,
    and there will probably be many others as we head for what we today call artificial
    general intelligence.


    Despite the ability to far outdo typical human performance in certain tasks limited
    memory machines lag behind human intelligence in other respects. They require
    huge amounts of training data to learn tasks humans learn with just a few examples,
    and they are vulnerable to outliers or adversarial examples. This type of "weak
    or narrow AI" reflects the current state of AI development. As Peterson noted,
    some believe the field may be hitting a wall.


    ## Understanding Strong vs. Weak AI in a New Light


    In the Information Age, the impact of Artificial Intelligence can be realized
    in the most futile of tasks. From the song we instruct Amazon’s Alexa to play
    when we wake up in the morning to the chatbots, we converse with frequentlyour
    modern lives are wholly immersed in machines that learn for us, think for us,
    and help us make better decisions.


    With that said, however, the ever-evolving cybersecurity threat landscape sees
    cybercriminals turning to AI, and then using it as a tool to wreak havoc on individuals
    and organizations. Fortunately, AI can also be utilized in the fight against cybersecurity,
    which is a belief shared by a majority of executives and cybersecurity specialists
    as well.


    Regardless of the deep-rooted impact that AI and Machine Learning have had on
    the life, the primary goal that Artificial Intelligence seeks out to fulfill is
    this: to create a machine very powerful and smart and capable enough to handle
    any level of cognitive difficulty, in a variety of different settings- which is
    quite similar to how human brains function.


    ## Trending AI Articles


    1\. The AI Job Wars: Episode I

