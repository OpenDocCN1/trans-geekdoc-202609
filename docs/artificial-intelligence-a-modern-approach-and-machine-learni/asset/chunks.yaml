    ## 2\. 从感知器到深度神经网络


    ## 3\. 用于求解微分方程的神经网络


    ## 4\. 将你的树莓派打造为自制 Google Home


    一般而言，AI 生态系统将 AI 程序划分为两类，即弱人工智能和强人工智能。不过，随着时间和技术的进步，我们需要重新审视对 AI 及其分类的看法，以及它们所承担的重要性（如果有的话）。


    不过，在深入探讨之前，让我们先了解这些术语的含义。你认为“强人工智能”和“弱人工智能”这两个术语是什么意思？通常，当谈话围绕人工智能展开时，人们经常提到 Apple
    的 Siri 和 Amazon 的 Alexa 等示例，却没有意识到这代表了对 AI 生态系统的一种非常有限的看法。如前所述，在 AI 方面有两大基础类别，即所谓的“强”和“弱”人工智能。也就是说，弱人工智能（或称窄人工智能）是指专注于单一任务并基于预设算法工作的任何
    AI 程序。弱人工智能的机制仅限于组织能力，而非 AI 理解所给方向的能力。例如，当你询问 Siri 最近的餐厅时，算法会理解“最近”和“餐厅”等关键词，并根据其已获取的信息做出相应回应。与其说是聪明，不如说预设的算法让弱人工智能表现得智能。另一方面，强人工智能（或称通用人工智能）复制了人脑的认知能力。强人工智能程序、机器或软件不依赖单纯的组织能力，而是依赖组装和关联来处理数据。就像人脑的工作方式一样，很难说强人工智能会如何回应特定关键词，只能说它会根据对所提供数据的评估和反应做出独立决策。在厘清“基础”定义后，我们必须分析这些定义在当今技术时代如何成立，尤其是当我们考虑到
    AI 对现代网络安全解决方案日益增长的影响时。我们可以说强人工智能和弱人工智能之间有什么区别吗？在理解强人工智能和弱人工智能之间的区别时，网络安全专家往往忽略上述定义背后的深层含义。为了更深入、更清晰地了解强人工智能与弱人工智能，因此我们需要比上述定义所代表的内容挖掘得更深一些。为了尽快阐明几点，我们将分别仔细分析两种
    AI 的定义，从强人工智能（或通用人工智能）开始。


    ### 强人工智能


    如前所述，强人工智能的传统定义指出，该术语指的是一种旨在复制人类智能或认知功能（即思考和决策的能力）的人工智能形式。广义或强人工智能简单指人工通用智能（`AGI`），专注于创建能够模仿并成功完成任何智力任务（尤其是人类能够完成的任务）的复杂机器。分析并为智能组件提出解决方案的能力可以分解为以下几个部分：


    • 从不同领域交换知识并将其应用于不同环境的能力。


    • 基于先前知识和经验为未来制定计划的能力。


    • 适应周围环境中任何变化的能力。


    除了上述组件外，强人工智能（或通用人工智能）的一些背后方面还包括解决复杂谜题、推理以及展示智能和常识的能力。


    话虽如此，一些专家和研究人员倾向于对强人工智能略显局限的定义持不同意见，他们表示不确定是否仅仅因为强人工智能能够模仿人脑的认知能力（例如沟通能力）就将其归类为智能。见证我们定义强人工智能的合法性这一相当新颖概念的是图灵测试，它代表了一种系统，在这种系统中，人类无法区分人类和机器的认知能力。图灵测试将一台机器、一个提问者和一个人置于对话环境中。如果提问者无法区分机器和人类，则图灵测试通过。牢记图灵测试，围绕强人工智能定义的含糊性已变得显而易见。首先，如图灵测试所示，如果
    AI 能够成功复制沟通能力，我们能否将其归类为智能？当你考虑到中文房间测试时，围绕什么是智能这一古老问题的困境就更难回答了，中文房间测试旨在检查机器是否理解中文，或者模拟理解中文的能力。中文房间测试的创建者
    John Searle 表示，如果没有理解过程，就不可能确定强人工智能只是一个更聪明的模拟的华丽版本。此外，不同的哲学家、专家、研究人员将体验意识的能力归因于强人工智能系统，这为人工智能的整体实现设定了非常高的标准。


    ### 弱人工智能


    如前所述，在弱人工智能的常规定义中，该术语指的是任何基于预设信息集响应情况的 AI。然而，根据强人工智能的不同定义，很容易得出结论：到目前为止我们创建的所有人工智能技术在技术上都是弱人工智能。话虽如此，弱人工智能的含义描绘了一幅图景，即
    AI 系统在完成智力任务方面效率低下，但事实并非如此。相反，弱人工智能（或更好的替代方案，窄人工智能）适用于随着时间推移而逐渐复杂化的技术。今天，弱人工智能体现在语音识别、聊天机器人，甚至像特斯拉这样的自动驾驶或无人驾驶汽车上。然而，几年前，情况完全不同，当时的现代技术，例如
    OCR（`Optical Character Recognition`），被视为人工智能。


    ### 心智理论


    这种尚未实现的 AI 类型被定义为能够理解人类动机和推理，因此能够根据个人的动机和需求提供个性化结果。也称为人工通用智能（`AGI`），心智理论 AI 可以用比有限记忆机器更少的示例进行学习；它可以对信息进行情境化和概括，并将知识外推到广泛的问题集合中。人工情感智能，即检测人类情感并与人共情的能力，正在开发中，但当前系统不表现出心智理论，并且距离自我意识（AI
    演进的下一个里程碑）还很远。


    ### 自我意识 AI 即人工超级智能


    这种 AI 不仅意识到其他实体的心理状态，还意识到自身。自我意识 AI，或人工超级智能（`ASI`），被定义为一种与人类通用智能相当的机器智能，原则上能够通过创建越来越智能的自身版本来远远超越人类认知。


    '
