    ## Chapter 6: Artificial Intelligence Trends: Giant Chips, New CPUs, Neuro-Symbolic
    AI


    It is hard to overestimate how much development is being done on artificial intelligence
    by vendors, governments and research institutions -- and how quickly the field
    is changing. On the hardware side, startups are developing new and different ways
    of organizing memory, compute and networking that could reshape the way leading
    enterprises design and deploy AI algorithms. At least one vendor has begun testing
    a single chip about the size of an iPad that, as detailed in this report on AI
    giant chips, can move data around thousands of times faster than existing AI chips.
    Even accepted wisdom -- such as the superiority of GPUs vs. CPUs for running AI
    workloads -- is being challenged by leading AI researchers. A team at Rice University,
    for example, is working on a new category of algorithms, called SLIDE (Sub-LInear
    Deep Learning Engine), that promises to make CPUs practical for more types of
    algorithms. CPUs, of course, are commodity hardware -present everywhere and cheap
    compared to GPUs. "If we can design algorithms like SLIDE that can run AI directly
    on CPUs efficiently, that could be a game changer," Anshumali Shrivastava, assistant
    professor in the department of computer science at Rice, told TechTarget. On the
    software side, scientists in academia and industry are pushing the limits of current
    applications of artificial intelligence. In the feverish quest to develop sentient
    machines that rival human general intelligence, traditional antagonists in AI
    are burying the hatchet. Proponents of symbolic AI -- methods that are based on
    high-level symbolic representations of problems, logic and search -- are joining
    forces with proponents of data-intensive neural networks to develop AI that is
    good at both capturing compositional and causal structure (symbolic AI) and capable
    of the image recognition and natural language processing feats performed by deep
    neural networks. This neurosymbolic approach would allow machines to reason about
    what they see, representing a milestone in the evolution of AI. "Neuro-symbolic
    modeling is one of the most exciting areas in AI right now," Brenden Lake, assistant
    professor of psychology and data science at New York University, told TechTarget.
    Read our feature story on this groundbreaking research and its implications for
    the future of AI.


    ## AI-Powered Mobile Apps


    Listen to me as I speak and say things, do what I say and give me exactly what
    I demand of you”, – these commands are currently the best way to describe the
    ancient times of kings, whereby everyone was circumscribed to obey their wish.
    Now, the time has come for everyone to say the command and let the followers do
    the rest. The recent developments in Artificial Intelligence have been of tremendous
    benefit to humans, helping to provide easier and more accurate ways to get tasks
    done. Today we’re going to see some Artificial Intelligence powered Mobile Apps
    that help to attain this task much easier.


    ### 1) Google Assistant


    ![](image_rsrc8Y.jpg)


    Google Assistant is a sophisticated artificial intelligence-powered, virtual support
    that was developed by Google, which is originally accessible on mobile and other
    smart home devices. Unlike the manufacturer’s previous virtual assistance Now,
    Google Assistant can engage in two-way communications. Assistant originally emerged
    far back in May 2016 as part of Google’s messaging app Allo strategy, and its
    voice-activated speaker Google Home. Now you can use Google Assistant in all Android-powered
    mobile phones.


    ### 2) Microsoft Cortana


    ![](image_rsrc8Z.jpg)


    Cortana is a virtual assistant which was created and designed by Microsoft for
    the following purposes: Windows 10, Windows 10 Mobile, as well as Windows Phone
    8.1, Invokesmart speaker, Microsoft Band, Surface Headphones is not also left
    out, Xbox One, iOS, Android, Windows Mixed Reality, and Amazon Alexa. Cortana
    can help you to set up reminders, also it recognizes natural voice without the
    requirement for any form of keyboard input, and it answers questions using data
    from the Bing search engine. Additionally, this can be used to send emails, search
    for your desired products or anything you are in search for on the internet.


    ### 3) Hound


    Hound is another AI based app that uses your own voice to search things. It is
    extremely fast and accepts your natural voice. You don’t need to learn extra keyword
    phrases for using this app. It tells you about the Weather, temperature, Navigation,
    Directions, Uber fare estimates, journey time, make calls, news search, video
    search, stock price and lot more.


    ### 4) Recent News


    Recent News is an artificial intelligence news aggregation app which is used mainly
    on Android devices. Its algorithm works reading habits. Using your by studying
    users reading habit, past behavior and interest, the app will help to keep users
    updated on any latest articles, news, and other important informed.

