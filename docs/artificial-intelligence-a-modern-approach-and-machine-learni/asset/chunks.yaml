    \ AI 用例的示例，附有链接到解释每个用例的 TechTarget 文章。\n\n![](img/image_rsrc8W.jpg)\n\n## 金融服务\n\
    \n人工智能正在改变银行的运营方式和客户的银行业务方式。阅读有关 Chase Bank、JPMorgan Chase、Bank of America、Wells\
    \ Fargo 及其他银行巨头如何目前使用 AI 来自动化客户服务，并帮助简化后台流程的深度文章“AI 用例在银行业创造机会，改进系统”。\n\n## 制造业\n\
    \n协作机器人，又称协作机器人（cobots），正在与人类一起在装配线和仓库中工作，充当一双额外的手；工厂正在使用 AI 来预测维护需求；机器学习算法检测购买习惯以预测生产计划的产品需求。阅读有关这些\
    \ AI 实施和潜在新 AI 应用的“制造业中 10 个 AI 用例”。\n\n## 农业\n\n5 万亿美元的农业行业正在使用 AI 来种植更健康的作物，减少工作量并组织数据。阅读\
    \ Cognilytica 分析师 Kathleen Walch 关于农业使用 AI 技术的深入探讨，以及 John Deere 的 AI 之旅。\n\n\
    ## 法律\n\n文档密集型法律行业正在使用 AI 来节省时间并改善客户服务。律师事务所正在部署机器学习来挖掘数据并预测结果；使用计算机视觉来分类文档并从中提取信息，以及使用自然语言处理来解释信息请求。观看\
    \ Vince DiMascio 谈论他的团队如何在他担任 CIO 和 CTO 的大型移民律师事务所中应用 AI 和机器人流程自动化。\n\n## 教育\n\
    \n除了自动化评分考试的繁琐过程外，AI 还被用于评估学生并根据他们的需求调整课程。收听这段与卡内基梅隆大学计算机科学学院人机交互和心理学教授 Ken Koedinger\
    \ 的播客，了解机器学习如何提供关于人类如何学习的见解，并为个性化学习铺平道路。\n\n## IT 服务管理\n\nIT 组织正在使用自然语言处理来自动化\
    \ IT 服务的用户请求。他们正在将机器学习应用于 ITSM 数据，以便更丰富地了解其基础设施和流程。深入了解组织如何使用 AI 来优化 IT 服务，阅读“ITSM\
    \ 中 10 个 AI 和机器学习用例”。\n\n# AI 用例的演变\n\n企业中 AI 用例的范围不仅在扩大，而且在当前市场不确定性的影响下也在演变。随着公司努力应对冠状病毒大流行及其后果，AI\
    \ 将帮助公司了解如何转型以保持相关性和盈利能力，Aible（一家 AI 平台提供商）的 CEO Arijit Sengupta 表示。“在当前的新冠病毒紧急情况中，最重要的用例将集中于情景规划、假设测试和假设验证，”Sengupta\
    \ 对 TechTarget 表示。但是，模型构建将必须变得更加敏捷和迭代。例如，预测模型可以推送给销售人员，而销售人员反过来成为向模型提供实时经验数据以进行持续分析的关键参与者。话虽如此，对于任何用例，在不确定时期，获取最终用户反馈至关重要，这是因为最终用户将了解尚未在数据中显现的事情，Sengupta\
    \ 表示。要了解 AI 用例在八个领域如何演变，请阅读记者 George Lawton 的信息丰富的文章“企业 AI 用例正在快速变化”。\n\n# 企业中的采用\n\
    \n关于企业中 AI 采用的最新研究断言，AI 部署正在增加。例如，到 2022 年，Gartner 预计每家公司的 AI 项目平均数量将增长到 35 个，比\
    \ 2020 年预计的平均 10 个项目增加了 250%。但是，AI 采用的增长是否像预期的那样强劲，或者是否会如预测的那样实现，还有待商榷。正如 Gartner\
    \ 所指出的，企业 AI 采用率从 2019 年的 4% 增加了 10 个百分点至 14%。企业 AI 采用率从 2019 年的 4% 增加了 10 个百分点至\
    \ 14%。很明显，公司在部署 AI 时仍然面临许多挑战。\n\n已经部署 AI 的公司正在意识，弄清楚如何进行 AI 并不等同于使用 AI 来赚钱。正如\
    \ Lawton 在关于 AI 中“最后一英里”交付问题的深度报告中所记录的，企业发现将 AI 技术编织到现有业务流程中比构建或购买承诺优化这些流程的复杂\
    \ AI 模型要困难得多。Deloitte Omnia AI 的经理 Ian Ziao 估计，大多数公司部署了 10% 到 40% 的机器学习项目。\n\n\
    阻碍公司将 AI 集成到其业务流程中的挑战包括以下几点：\n\n• 缺乏最后一英里基础设施——例如，机器人流程自动化、集成平台即服务和低代码平台，这些是将\
    \ AI 连接到业务所需的；\n\n• 缺乏能够评估 AI 适用于什么的领域专家，具体来说，是弄清楚流程中哪些决策元素可以由 AI 自动化，以及如何随后重新设计流程；以及\n\
    \n"
