    ## 第 6 章：人工智能趋势：巨型芯片、新型 CPU 与神经符号 AI


    很难高估供应商、政府和研究机构在人工智能方面投入的开发力度，以及该领域变化之快。在硬件方面，初创公司正在开发组织内存、计算和网络的新颖且不同的方式，这可能重塑领先企业设计和部署
    AI 算法的方式。至少有一家供应商已开始测试一款约 iPad 大小的单芯片，如本报告中关于 AI 巨型芯片的详细内容所示，其数据移动速度比现有 AI 芯片快数千倍。即使是公认的智慧——例如
    GPU 相对于 CPU 运行 AI 工作负载的优越性——也正受到领先 AI 研究人员的挑战。例如，莱斯大学的一个团队正在开发一种名为 SLIDE（Sub-LInear
    Deep Learning Engine）的新算法类别，该算法有望使 CPU 更适合更多类型的算法。当然，CPU 是商品硬件，无处不在，且相比 GPU 价格低廉。“如果我们能设计出像
    SLIDE 这样可以高效在 CPU 上直接运行 AI 的算法，那可能会成为游戏规则的改变者，”莱斯大学计算机科学系助理教授 Anshumali Shrivastava
    对 TechTarget 表示。在软件方面，学术界和工业界的科学家们正在推动当前人工智能应用的极限。在开发可与人类通用智能相媲美的有感知机器的热切探索中，AI
    领域的传统对手正在握手言和。符号 AI 的支持者——基于问题、逻辑和搜索的高级符号表示的方法——正与数据密集型神经网络的支持者联手，开发既能擅长捕捉组合性和因果结构（符号
    AI），又能执行深度神经网络完成的图像识别和自然语言处理壮举的 AI。这种神经符号方法将使机器能够推理其所见之物，代表着 AI 演进的一个里程碑。“神经符号建模目前是
    AI 中最令人兴奋的领域之一，”纽约大学心理学和数据科学助理教授 Brenden Lake 对 TechTarget 表示。阅读我们关于这项开创性研究及其对
    AI 未来影响的专题报道。


    ## AI 驱动的移动应用


    听我说，当我说话并说出事情时，照我说的做，并给我要求你做的一切”，——这些命令目前是描述古代国王时代的最佳方式，当时每个人都被限制必须服从他们的意愿。现在，每个人都该发出命令，让追随者去完成其余事情。人工智能的最新发展对人类大有裨益，帮助提供更轻松、更准确的方式来完成任务。今天我们将看到一些人工智能驱动的移动应用，它们能帮助更轻松地完成这项任务。


    ### 1) Google Assistant


    ![](img/image_rsrc8Y.jpg)


    Google Assistant 是由 Google 开发的一款复杂的人工智能驱动虚拟助手，最初可在移动设备和其他智能家居设备上使用。与制造商之前的虚拟助手
    Now 不同，Google Assistant 可以进行双向通信。Assistant 最初于 2016 年 5 月作为 Google 的消息应用 Allo
    策略及其语音激活扬声器 Google Home 的一部分出现。现在，你可以在所有 Android 驱动的移动手机上使用 Google Assistant。


    ### 2) Microsoft Cortana


    ![](img/image_rsrc8Z.jpg)


    Cortana 是由微软为以下用途创建和设计的虚拟助手：Windows 10、Windows 10 Mobile，以及 Windows Phone 8.1、Invoke
    智能扬声器、Microsoft Band、Surface 耳机、Xbox One、iOS、Android、Windows Mixed Reality 和 Amazon
    Alexa。Cortana 可以帮助你设置提醒，还能在无需任何键盘输入的情况下识别自然语音，并使用 Bing 搜索引擎的数据回答问题。此外，它还可用于发送电子邮件、搜索你想要的产品或在互联网上搜索任何内容。


    ### 3) Hound


    Hound 是另一款基于 AI 的应用，它使用你自己的声音来搜索事物。它速度极快，并接受你的自然语音。你不需要学习额外的关键词短语来使用此应用。它可以告诉你天气、温度、导航、路线、Uber
    车费估算、行程时间、拨打电话、新闻搜索、视频搜索、股票价格等更多信息。


    ### 4) Recent News


    Recent News 是一款人工智能新闻聚合应用，主要用于 Android 设备。其算法通过阅读习惯工作。通过研究用户的阅读习惯、过去行为和兴趣，该应用将帮助用户了解任何最新文章、新闻和其他重要信息。


    '
