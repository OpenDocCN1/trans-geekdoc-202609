    ## Part II (Chapters 9–14)


    Part II focuses on the networking technologies and fabric designs that support
    distributed AI workloads in modern data centers. It explains how `RoCEv2` enables
    direct GPU-to-GPU memory transfers over Ethernet, and how congestion control mechanisms
    like `DCQCN`, `ECN`, and `PFC` ensure lossless high-speed transport. You’ll also
    learn about AI-specific load balancing techniques, including flow-based, flowlet-based,
    and per-packet spraying, which help avoid bottlenecks and keep GPU throughput
    high. Later chapters examine GPU collectives such as `AllReduce`—used to synchronize
    model parameters across all workers—along `ReduceScatter` and `AllGather` operations.
    The book concludes with a look at rail-optimized topologies that keep multi-rack
    GPU clusters efficient and resilient.


    This book is not a configuration or deployment guide. Instead, it equips you with
    the theory and technical context needed to begin deeper study or participate in
    cross-disciplinary conversations with AI engineers and systems designers. Architectural
    diagrams and practical examples clarify complex processes—without diving into
    implementation details. Readers are expected to be familiar with routed Clos fabrics,
    BGP EVPN control planes, and VXLAN data planes. These technologies are assumed
    knowledge and are not covered in the book.


    Whether you''re designing next-generation GPU clusters or simply trying to understand
    what happens inside them, this book provides the missing link between AI workloads
    and network architecture.


