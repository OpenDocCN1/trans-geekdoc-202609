- raw: 'To address this, one can build a partially connected fabric where each leaf
    connects to a distinct subset of spines, and each spine serves a subset of leafs.
    This breaks the symmetry required for hash polarization to occur. Even if all
    leaf switches produce the same hash result, the next-hop cannot be the same for
    every leaf — because that spine may not be reachable by all of them. This intentional
    topological asymmetry ensures that traffic is distributed across multiple spine
    switches regardless of hash outcomes.


    Such structured cabling approaches often rely on deterministic design patterns
    and can scale efficiently while reducing the risk of bottlenecks caused by hash
    polarization. The result is improved load distribution without relying solely
    on hash tuning or adaptive forwarding mechanisms.


    ## References


    *   \[1\]    NVIDIA DGX SuperPOD: Scalable Infrastructure for AI Leadership Reference
    Architecture, October 2021


    *   \[2\]    Kun Qian – Alibaba Cloud, et al., “Alibaba HPN: A Data Center Network
    for Large Language Model Training”. ACM SIGCOMM, August 4-8, 2024, Sydney, NSW,
    Australia


