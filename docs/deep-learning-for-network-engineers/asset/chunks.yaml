- raw: 'If congestion worsens and the queue continues to grow, the buffer may reach
    the xOFF threshold. At this point, the switch sends PFC pause frames hop by hop
    to upstream devices. These devices respond by temporarily stopping traffic for
    that specific priority queue, helping prevent packet loss.


    Resuming Traffic:


    Once the buffer has drained and the queue drops below the xON threshold, the switch
    sends a resume message (a PFC frame with a quanta value of 0). This tells the
    upstream device it can start sending traffic again.


    ### Why ECN Must Precede xOFF


    It is very important that the ECN thresholds (WRED minimum and maximum) are used
    before the xOFF threshold is reached for three main reasons:


    Graceful Rate Adaptation: Early ECN marking helps the GPU NIC (sender) reduce
    its transmission rate gradually. This smooth adjustment avoids sudden stops and
    leads to more stable traffic flows.


    Avoiding Unnecessary PFC Events: If the sender adjusts its rate early with ECN
    feedback, the buffers are less likely to fill up to the xOFF level. This avoids
    the need for abrupt PFC pause frames that can cause head-of-line blocking and
    backpressure on the network.


    Maintaining Fabric Coordination: With early ECN marking, the sender receives feedback
    before congestion becomes severe. While the ECN signal is not shared directly
    with other switches, the sender''s rate adjustment helps reduce overall pressure
    on the network fabric.


    What Happens If xOFF Is Reached Before ECN Marking?


    Imagine that the ingress queue on Spine Switch 1 (from Rail Switch A) fills rapidly
    without ECN marking:


    Sudden Pause: The buffer may quickly hit the xOFF threshold and trigger an immediate
    PFC pause.


    Downstream Effects: An abrupt stop in traffic from Rail Switch A leads to sudden
    backpressure. This can cause head-of-line blocking and disturb GPU communication,
    leading to performance jitter or instability at the application level.


    Oscillations: When the queue finally drains and reaches the xON threshold, traffic
    resumes suddenly. This can cause recurring congestion and stop-and-go patterns
    that hurt overall performance.


    By allowing ECN to mark packets early, the network gives the sender time to reduce
    its rate smoothly. This prevents abrupt stops and helps maintain a stable, efficient
    fabric.


    Figure 11 recaps how the example DCQCN process works:


    Time t1: (1) Traffic associated with priority queue 3 on Rail-1’s egress interface
    1 crosses the WRED minimum threshold.


    Time t2: (2) Rail-1 begins randomly marking ECN bits as 11 on packets destined
    for GPU-0 on the Host-3.


    Time t3: (3) The RDMA NIC starts sending CNP messages to the sender GPU-1 on Host-1.


    Time t4: (4) In response to the CNP message, the sending GPU-0 on Host-1 reduces
    its transmission rate by holding packets longer in its egress queue. (5) At the
    same time, egress queue 3 on Rail-1 remains congested. (6) Since packets cannot
    be forwarded from ingress interface 2 to egress interface 1’s queue 3, ingress
    interface 3 also becomes congested, eventually crossing the PFC xOFF threshold.


    Time t5: (7) As a result, Rail-1 sends a PFC xOFF message to Spine-A over Inter-Switch
    Link 3. (8) In response, Spine-A halts forwarding traffic for the specified pause
    duration.


    Time t6: (9) Due to the forwarding pause, the egress queue of interface 3 on Spine-A
    becomes congested, which in turn (10) causes congestion on its ingress interface
    2.


    Time t7: (11) The number of packets waiting in egress queue 3 on interface 1 of
    Rail-1 drops below the WRED minimum threshold. (12) This allows packets from the
    buffer of interface 3 to be forwarded.


    Time t8: (13) The packet count on ingress interface 3 of Rail-1 falls below the
    PFC xON threshold, triggering the PFC resume/unpause message to Spine-A. (14)
    Spine-A resumes forwarding traffic to Rail-1.


    After the PFC resume message is sent, Spine-A starts forwarding traffic again
    toward Rail-1. The congestion on Spine-A’s interface 3 gets cleared as packets
    leave the buffer. This also helps the ingress interface 2 on Spine-A to drain.
    On Rail-1, as interface 1 can now forward packets, queue 3 gets more room, and
    the flow to GPU-0 becomes smoother again.


    The RDMA NIC on the sender GPU monitors the situation. Since there are no more
    CNP messages coming in, the GPU slowly increases its sending


    rate. At the same time, the ECN marking on Rail-1 stops, as queue lengths stay
    below the WRED threshold. Traffic flow returns to normal, and no more PFC pause
    messages are needed.


    The whole system stabilizes, and data can move again without delay or packet loss.


    ![](main-113.jpg)


    Figure 11-7: DCQCN: ECN and PFC Interaction .


    ### DCQCN Configuration


    Figure 11-8 shows the six steps to enable DCQCN on a switch. The figure assumes
    that the RDMA NIC marks RoCEv2 traffic with DSCP 24.


    First, we classify the packets based on the DSCP value in the IPv4 header. Packets
    marked with DSCP 24 are identified as RoCEv2 packets, while packets marked with
    DSCP 48 are classified as CNP.


    After classification, we add an internal QoS label to the packets to place them
    in the correct output queue. The mapping between internal QoS labels and queues
    is fixed and does not require configuration.


    Next, we define the queue type, allocate bandwidth, and set ECN thresholds. After
    scheduling is configured, we enable PFC and set its threshold values. A common
    rule of thumb for the relationship between ECN and PFC thresholds is: xON < WRED
    Min < WRED Max < xOFF.


    To apply these settings, we enable them at the system level. Finally, we apply
    the packet classification to the ingress interface and enable the PFC watchdog
    on the egress interface. Because PFC is a sub-TLV in the LLDP Data Unit (LLDPDU),
    both LLDP and PFC must be enabled on every interswitch link.


    ![](main-114.jpg)


    Figure 11-8: Applying DCQCN to Switch.


    #### Step 1: Packet Classification


    The classification configuration is used to identify different types of traffic
    based on their DSCP values. In our example we have one for RoCEv2 traffic and
    another for Congestion Notification Packets (CNP). The “class-map type qos match-any
    ROCEv2” line defines a class map named “ROCEv2” that matches any packet marked
    with DSCP value 24, which is commonly used for RDMA traffic. Similarly, the “class-map
    type qos match-any CNP” defines another class map named “CNP” that matches packets
    marked with DSCP value 48, typically used for congestion signaling in RDMA environments.
    These class maps serve as the foundation for downstream policies, enabling differentiated
    handling of traffic types. Note that the names “ROCEv2” and “CNP” are not system-reserved;
    they are simply user-defined labels that can be renamed, as long, as the references
    are consistent throughout the configuration.


    class-map type qos match-any ROCEv2


    match dscp 24


    class-map type qos match-any CNP


    match dscp 48


    Example 11-1: Classification.


    #### Step 2: Internal QoS Label for Queueing


    The marking configuration assigns internal QoS labels to packets that have already
    been classified. This is done using a policy map named QOS\_CLASSIFICATION, which
    refers to the previously defined class maps. Within this policy, packets that
    match the “ROCEv2” class are marked with qos-group 3, and those matching the “CNP”
    class are marked with qos-group 7. Any other traffic that doesn''t fit these two
    categories falls into the default class and is marked with qos-group 0. These
    QoS groups are internal identifiers that the switch uses in later stages for queuing
    and scheduling, to decide how each packet should be treated. Just like class maps,
    the name of the policy map itself is user-defined and can be anything descriptive,
    provided it is correctly referenced in other parts of the configuration.


    policy-map type qos QOS\_CLASSIFICATION


    class ROCEv2


    set qos-group 3 class CNP


    set qos-group 7 class class-default


    set qos-group 0


    Example 11-2: Marking.


