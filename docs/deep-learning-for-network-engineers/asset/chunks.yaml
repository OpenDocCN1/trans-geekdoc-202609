    在图 2-2 的右侧，我们有一个二维误差空间。在这个空间中，一条对称的抛物线可视化了误差函数。该曲线以期望值为中心，在我们的示例中期望值为 `1.0`。横轴代表模型输出
    `ŷ`，纵轴代表误差 `E`。例如，如果模型预测值为 `1.7`，你可以从水平轴上的该点画一条垂直线，与抛物线相交。在我们的案例中，这个交点显示了 `0.245`
    的误差项。在现实场景中，误差格局通常有许多峰值和谷值，而不是简单的对称曲线。


    均方误差（`MSE`）是一种衡量预测值与期望值之间差异的损失函数。它为模型提供了一个整体误差值，也称为损失（loss）或代价（cost），指示预测偏离实际有多远。


    接下来，通过对损失函数关于模型权重求导来计算梯度。该梯度显示了误差增长最快的方向和幅度。在 `Backward Pass`（反向传播）期间，算法计算每个权重的梯度。通过向梯度的相反方向移动（使用一种称为
    `Gradient Descent`/梯度下降的方法），算法调整权重以减少损失。这个过程会重复多次，使得模型输出逐渐接近期望值。`Backward pass`
    过程在 `Learning Rate`（学习率）章节之后进行了详细解释。


    接下来的章节将介绍 `Backward Pass` 期间执行的过程和计算。


    ![](img/main-11.jpg)


    图 2-2: 均方误差。


    ## Learning Rate


    除了确定误差应该减少的方向，该过程还需要知道每个调整步的大小。这由 `Learning Rate` 定义。`Learning Rate` 的值影响了在 `Backward
    Pass` 的每次迭代中，权重根据梯度调整的程度。较小的 `Learning Rate` 会导致微小、渐进的变化，这可能导致训练速度较慢，但收敛更稳定。相反，较大的
    `Learning Rate` 可以通过更大幅度的调整来加速训练，但它可能会越过最优值并导致不稳定性。因此，选择合适的 `Learning Rate` 对于有效且高效的训练至关重要。这在图
    23 中所示。我们将在 `Backward Pass` 部分重新回到 `Learning Rate`。


    ![](img/main-12.jpg)


    图 2-3: 学习率。


    ## Backward Pass


    `Forward Pass` 生成模型输出 `ŷ`，然后用它计算模型误差 `E`。`ŷ` 越接近期望值 `y`，误差就越小，表示模型性能越好。`Backward
    Pass` 作为 `Backpropagation`（反向传播）算法的一部分，其目的是在训练期间调整模型的权重参数，其方向使模型的预测逐渐接近期望值 `y`。


    在图 2-4 中，模型的输出 `ŷb` 取决于 `neuron-b` 的加权和 `zb`。这个加权和 `zb` 而是通过输入值 `ya` 乘以其相关的权重
    `w1` 来计算。同样的过程也适用于 `neuron-a`。`Backpropagation` 算法不能直接修改激活函数的结果或加权和本身。它不能直接更改输入值。相反，它计算权重调整，然后用这些调整来更新模型的权重。


    图 2-4 展示了这种依赖链，并提供了 `Backpropagation` 算法如何确定权重调整的概述。接下来的章节将详细解释这一过程。


    ![](img/main-13.jpg)


    图 2-4: 反向传播概述：反向传播依赖链。


    稍显拥挤的图 2-5 展示了 `backpropagation` 算法的组件及其关系和依赖关系。图由三个主要部分组成。最右侧的部分描述了误差函数的计算。中间和左侧的部分概述了定义和调整新权重值的步骤。接下来将详细解释整个反向传播过程，一步一步地进行。


    ![](img/main-14.jpg)


    图 2-5: 反向传播概述。


    ### Partial Derivative for Error Function – Output Error


    训练模型的目标是最小化误差，这意味着我们希望 `ŷb`（模型的预测/输出）尽可能地接近 `y`（期望值）。


    在计算出误差 `E (=0.245)` 后，我们计算误差函数关于 `yb (=1.7)` 的偏导数，它显示了 `ŷb` 的微小变化如何影响误差 `E`。当输入值中的一个保持不变时（即
    `yb (=1.7)`），该导数被称为偏导数。


    ```

    MSE'' = - (ŷb - y)

    ```


    ### Partial Derivative for Activation Function


    在计算出输出误差后，我们计算激活函数 `f(b)` 的导数。`neuron-b` 使用 `ReLU` 激活函数，该函数规定如果函数输出大于 0，则导数为 1；否则为
    0。


    ```

    f''(b)=1, if yb > 0

    0, if yb <= 0

    ```


    ### Error Term for Neurons


    `neuron-b` 的误差项通过将误差函数的偏导数乘以激活函数的导数计算得出。这意味着我们它将模型的误差反向传播。


    ```

    Error term (Enb) = MSE'' * f''(b) = 0.7 * 1 = 0.7

    ```


    ![](img/main-16.jpg)


    图 2-7: 反向传播 – Neuron-b 的误差项。


    在计算出 `neuron-b` 的误差项后，反向传播移动到前一层（即隐藏层），计算 `neuron-a` 的误差项。首先，该过程计算下一层（在示例中为输出层）中所有连接神经元的
    `w ⋅ E` 的加权和。然后将该和乘以激活函数的导数 `f''(a)`。由于 `neuron-a` 只连接到 `neuron-b`，其误差项计算如下。


    ```

    Ean = w1 * Enb * f''(a) = 0.4 * 0.7 * 1 = 0.28

    ```


    ![](img/main-17.jpg)


    图 2-8: 反向传播 – Neuron-a 的误差项。


    ### Gradient Calculation


    在计算出每层所有神经元的误差项后，算法同时计算所有权重参数的梯度。每个梯度通过将输入值乘以相应的误差项确定。


    在我们的示例中，连接 `x1` 到 `neuron-a` 的 `wa1` 梯度通过将输入值 `x1 (=3.0)` 乘以 `neuron-a` 的误差项 `Ena
    (= 0.28)` 计算，结果为 `0.84`。同样，`neuron-b` 中的 `wb1` 梯度通过将 `neuron-a` 激活函数的输出 `y (=3.0)`
    乘以 `neuron b` 的误差项 `Enb (=0.7)` 计算，得到 `2.1` 的梯度。


