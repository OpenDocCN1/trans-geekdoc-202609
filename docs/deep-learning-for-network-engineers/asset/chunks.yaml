    To keep things simple, Figure 7-2 uses two-dimensional vectors in the embedding
    matrix. Instead of complete sentences, we use words, which can be categorized
    into four groups: female, male, adult, and child.


    The first word, "Wife," appears in the lookup table with the token value `2`.
    The corresponding word vector in the lookup table for token `2` is `[-3.5, -3.0]`.
    The second word, "Mother," is assigned the token `3`, which is associated with
    the word vector `[-2.5, +2.0]`, and so on.


    ![](main-53.jpg)


    Figure 7-2: Word Tokenization and Word Embedding.


    In Figure 7-3, we have a two-dimensional vector space divided into four quadrants,
    representing gender (male/female) and age (child/adult). Tokenized words are mapped
    into this space.


    At the start of the first iteration, all words are placed randomly within the
    two-dimensional space. During training, our goal is to adjust the word vector
    values so that adults are positioned on the positive side of the Y-axis and children
    on the negative side. Similarly, males are placed in the negative space of the
    X-axis, while females are positioned on the positive side.


    ![](main-54.jpg)


    Figure 7-3: Words in the 2 Dimensional Vector Space in the Initial State.


    Figure 7-4 illustrates how words may be positioned after successful training.
    All words representing a male adult are placed in the upperleft quadrant (adult/male).
    Similarly, all other words are positioned in the two-dimensional vector space
    based on their corresponding age and gender.


    ![](main-55.jpg)


    Figure 7-4: Words in the 2 Dimensional Vector Space After Training.


    In addition to grouping similar words, such as "adult/female," close to each other
    in an n-dimensional space, there should also be positional similarities between
    words in different quadrants. For example, if we calculate the Euclidean distance
    between the words `Father` and `Mother`, we might find that their distance is
    approximately `4.3`. The same pattern applies to word pairs like `Nephew-Niece`,
    `Brother-Sister`, `Husband-Wife`, and `Father-in-Law–Mother-in-Law`.


    However, it is important to note that this example is purely theoretical. In practice,
    Euclidean distances in high-dimensional word embeddings are not fixed but vary
    depending on the training data and optimization process. The relationships between
    words are often better captured through cosine similarity rather than absolute
    Euclidean distances.


    ![](main-56.jpg)


    Figure 7-5: Euclidean Distance.


    ## Positional Embeddings


    Since input text often contains repeated words with different meanings depending
    on their position, an LLM must distinguish between them. To achieve this, the
    word embedding process in Natural Language Processing (NLP) incorporates a Positional
    Encoding Vector alongside the Word Embedding Vector, resulting in the final word
    representation.


    In Figure 7-6, the sentence "The sky is clear, so she finally decided to clear
    the backyard" contains the word `clear` twice. Repeated words share the same token
    ID instead of receiving unique ones. In this example, the `is` is assigned token
    ID `2`, and `clear` is assigned `5`. These token IDs are then mapped to vectors
    using a word embedding lookup table. However, without positional encoding, words
    with different meanings would share the same vector representation.


    Focusing on `clear` (token ID `5`), it maps to the word embedding vector `[+2.5,
    +1.0]` from the lookup table. Since token IDs do not capture word position, identical
    words always receive the same embedding.


    Positional encoding is essential for capturing context and semantic meaning. As
    shown in Figure 7-6, each input word receives a Positional Encoding Vector (`PE`)
    in addition to its word embedding. `PE` can either be learned and adjusted during
    training or remain fixed. The final Word Embedding Vector is computed by combining
    both the Word Embedding Vector and Positional Encoding Vector.


    ![](main-57.jpg)


    Figure 7-6: Tokenization – Positional Embedding Vector.


    ### Calculating the Final Word Embedding


    Figure 7-7 presents the equations for computing the final word embedding by incorporating
    positional embeddings. There are three variables:


    * `Position (pos)`: The word’s position in the sentence. In our example, the first
    occurrence of `clear` is the fourth word, so `pos = 4`.

    * `Dimension (d)`: The depth of the vector. We use a 2-dimensional vector, so
    `d = 2`.

    * `Index (i)`: Specifies the axis of the vector: `0` for the x-axis and `1` for
    the y-axis.


    The positional embedding is computed using the following equations:


    * `x-axis`: `sin(pos/10000^(2i/d))`, where `i = 0`

    * `y-axis`: `cos(pos/10000^(2i/d))`, where `i = 1`


    For `clear` at position `4`, with `d = 2`, the resulting 2D positional vector
    is `[-0.8,+1.0]`. This vector is then added to the input word embedding vector
    `[+2.5, +1.0]`, resulting in the final word embedding vector `[+1.7, +2.0]`.


    Figure 7-7 also shows the final word embedding for the second occurrence of `clear`,
    but the computation is omitted.


    ![](main-58.jpg)


    Figure 7-7: Finals Word Embedding for the 4^(th} Word.


    ## Transformer Architecture


    ### Introduction


    Sequence-to-sequence (seq2seq) language translation and Generative Pretrained
    Transformer (GPT) models are subcategories of Natural Language Processing (NLP)
    that utilize the Transformer architecture. Seq2seq models are typically using
    Long Short-Term Memory (LSTM) networks or encoder-decored based Transformers.
    In contrast, GPT is an autoregressive language model that uses decoder-only Transformer
    mechanism. The purpose of this chapter is to provide an overview of the decoder-only
    Transformer.


    The Transformer consists of stacks of decoder modules. A word embedding vector,
    a result of the tokenization and embedding, is fed as input to the first decoder
    module. After processing, the resulting context vector is passed to the next decoder,
    and so on. After the final decoder, a softmax layer evaluates the output against
    the complete vocabulary to predict the next word.


    ### Self-Attention Mechanism


    Rather than feeding the embedded word vector (i.e., token embedding plus positional
    encoding) directly into the decoder layers, the Transformer first computes the
    `Query (Q)`, `Key (K)`, and `Value (V)` vectors from the word vector. These vectors
    are then used in the self-attention mechanism. Initially, the query vector is
    multiplied by the key vectors using matrix multiplication. The result is then
    divided by the square root of the dimension of the key vectors (scaled dot product)
    to obtain the logits. The logits are processed by a softmax layer to compute probabilities.
    The SoftMax prediction results are multiplied with the value vectors to produce
    a context vector.


    Before feeding the context vector into the feedforward network, it is summed with
    the original word embedding (which includes positional encoding) via a residual
    connection. Finally, the output is normalized using layer normalization.


    ### Feedforward Network


    Each decoder module consists of an attention layer, Add &Normalization layer and
    a feedforward network (`FFNN`).


    The basic architecture of the FFNN in the decoder is designed so that the input
    layer has as many neurons as the dimension of the context vector. The hidden layer,
    in turn, has four times as many neurons as the input layer, while the output layer
    has the same number of neurons as the input layer. This design guarantees that
    the output vector of the FFNN has the same dimension as the context vector. Like
    the attention block, the FFNN block also employs residual connections and normalization.


    ![](main-59.jpg)


    Figure 7-8: Decoder-Only Transformer Architecture.


    ### Query, Key and Value Vectors

