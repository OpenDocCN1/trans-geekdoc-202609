    in units of 512 bit times.


    For a 400 Gbps interface:


    - `1 bit time` = `1 / 400,000,000,000` seconds ≈ `2.5 picoseconds`

    - `1 quanta` = `512 × 2.5 ps` = `1.28 nanoseconds`

