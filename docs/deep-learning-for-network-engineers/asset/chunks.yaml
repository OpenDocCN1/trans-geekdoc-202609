    首先，当两个 GPU 之间打开一个 `Queue Pair (QP)` 队列对时，所有的梯度同步流量通常通过该 `QP` 发送。从网络的角度来看，这看起来是
    GPU 之间的一个大流。在深度学习训练中，根据模型的大小，梯度数据可以达到数百兆（MB）甚至几个兆（GB）。因此，当它通过一个 `QP` 发送时，网络将其视为单条高带宽流。这种流量通常被称为“大象流”（elephant
    flow），因为它会占据链路带宽的大部分。当多个大流被哈希到同一个条上行链路或骨干端口时，就会出现问题。如果发生这种情况，其中一条链路可能会过载，而其他链路仍处于未充分利用的状态。这就是我们在
    AI 集群中看到哈值极化（hash polarization）和头阻塞（head-of-line blocking）的原因之一。哈值极化是指 `ECMP`（等价多路传输）转发中使用的负载均衡哈希算法导致流量在多个可用路径上的分布不均的状态。


    例如，如图 10-5 所示，`Host-1` 中的 `GPU-0` 和 `Host-2` 中的 `GPU-0` 都以 200 Gbps 的速率向 `GPU-1`
    发送流量。`Rail Switch A` 中的 `ECMP` 哈希函数为这两个流都选择了指向 `Spine 1` 的链路。这导致一条骨干链路负载了 400
    Gbps 的流量，而另一条则保持空闲。这在 AI 集群中是一个严重问题，因为训练任务在 GPU 之间产生大量的东西向流量，且通常以线速率运行。当由于哈值极化导致流量分布不均时，某些链路变得拥塞，而其他链路空闲。这会导致数据包延迟和重传，从而减慢梯度同步并降低整体训练速度。在大规模集群中，即使是微小的不平衡也会对作业完成时间和资源效率产生显著影响。


    ![](img/main-104.jpg)


    图 10-5：`ECMP` 哈值极化。


    在之前的章节中，我们探讨了影响基于 GPU 的 AI 集群性能和可靠的一些关键挑战，例如链路拥塞、单点故障、头阻塞以及 `ECMP` 路由中的哈值极化。


    本书的其余部分将重点关注如何缓解甚至完全避免这些问题。我们将研究设计选择、传输优化、网络感知调度以及备性拓扑结构，这些有助于提高 AI 架构的鲁健性和效率。


    ## 参考文献


    * [1] Yunhong Xu, Keqiang He, Rui Wang, Minlan Yu, Nick Duffield, Hassan Wassel,
    Shidong Zhang, Leon Poutievski, Junlan Zhou, Amin Vahdat, Hashing Design in Modern
    Networks: Challenges and Mitigation Techniques. Texas A&M University, Harvard
    University, Google. [https://www.usenix.org/system/files/atc22_slides_xu.pdf]

    * [2] Head-of-line blocking, Wikipedia, [https://en.wikipedia.org/wiki/Head-of_line_blocking]


    # 第 11 章：拥塞避免


    正如前章节“出口接口拥塞”所解释的，到 GPU 服务器的 Rail 链路以及交换机间的链路在梯度同步期间都可能变得拥塞。在 AI 架构后端网络中，实施专门为
    `RDMA` 工作负载设计的拥塞控制机制至关重要，因为拥塞会减慢学习过程，甚至单个数据包丢失就可能重启整个训练过程。


    本节首先介绍显式拥塞通知 (`ECN`) 和基于优先级的流量控制 (`PFC`)，这是现代无损以太网中的两种基础技术。`ECN` 允许交换机在检测到拥塞时标记数据包而不是丢弃它们，使终端能够主动做出。而
    `PFC` 提供了逐优先级流量控制，可以在暂停某些流量类别的同时允许其他流量继续流动。


    最后，我们描述了数据中心量化拥塞通知 (`DCQCN`) 如何结合 `ECN` 和 `PFC`，为 AI 集群中的 `RoCEv2` 流量提供可扩展且无损的传输机制。


    ## 无拥塞的 GPU 到 GPU RDMA 写操作


    图 11-1 展示了两个 GPU 之间标准的远程内存访问 (`RDMA`) 写操作。此示例演示了 `Host-1` 上的 `GPU-0` 如何将本地梯度（`∇₁`
    和 `∇₂`）从内存传输到 `Host-2` 上的 `GPU-0`。两个 GPU 都使用支持 `RDMA` 的网卡，通过 200 Gbps 上行链路连接到
    `Rail Switch A`。


    `RDMA Write` 操作通过以下七步进行：


    1. 为了启动数据传输，`Host-1` 上的 `GPU-0` 通过 PCIe 总线通过预先建立的 `Queue Pair 0x123456` 向其 `RDMA
    NIC` 提交工作请求。

    2. `RDMA NIC` 通过将 `OpCode` (`RDMA Write`) 和 `Queue Pair Number` (`0x123456`) 插入
    `InfiniBand Transport Header` (`IBTH`)，来对请求进行编码。它将 `IBTH` 和 `RETH`（图中未显示）头部用以太网、IP、UDP
    和以太网头部封装。网卡在 IP 头的 `ToS` 字节中将 `DSCP` 值设置为 24，并将 `ECN` 位设置为 10（表示支持 `ECN` 的传输）。`DSCP`
    值确保交换机可以识别并优先处理 `RoCEv2` 流量。目标 UDP 端口设置为 `4791`（图中未显示）。

    3. 在 `Ethernet1/24` 上接收到数据包后，`Rail switch` 根据 `DSCP` 值将流量分类。

    4. 交换机将 `DSCP` 24 映射到 `QoS-3`。

    5. `QoS Group 3` 使用针对 RDMA 优化的带宽分配和拥塞避免参数（WRED Min、Max）。

    6. 队列上的数据包计数未超过 `WRED minimum`，因此数据包在不修改的情况下转发。

    7. `Host-2` 上的 `RDMA NIC` 接收数据包，剥离以太网、IP 和 UDP 头部，并处理 `RDMA` 头部。负载直接交付到 `Host-2`
    上 `GPU-0` 的内存中，完成 `RDMA Write` 操作。


    ![](img/main-105.jpg)


    图 11-1：正常情况 DMA 操作概述。


    ## 显式拥塞通知 ECN


    由于梯度同步需要无损网络服务，因此建立能够在缓冲区溢出前做出响应的主动拥塞检测系统至关重要。该系统还包含一种信号机制，允许接收端在需要时请求发送端降低传输速率或临时暂停流量。


    数据中心量化拥塞通知 (`DCQCN`) 是一种为 `RoCEv2` 设计的拥塞控制方案，它利用了显式拥塞通知 (`ECN`) 和优先级流量控制 (`PFC`)
    进行主动队列管理。本节关注 `ECN`。


    在 IPv4 中，`ToS`（服务类型）字节的最后两位预留用于 `ECN` 标记。通过两个位定义了四种 `ECN` 编码点：


    * 00 – 不支持 ECN 的传输 (`Not-ECT`)

    * 01 – 支持 ECN 的传输 (`ECT`)

    * 10 – 支持 ECN 的传输 (`ECT`)

    * 11 – 拥塞体验 (`CE`)


    图 11-2 展示了当出口接口 `Ethernet2/24` 发生拥塞时如何使用 `ECN` 防止数据包丢失。`ECN` 基于两个队列阈值运行：`WRED
    Minimum` 和 `WRED Maximum`。当队列深度超过 `WRED Minimum` 但低于 `WRED Maximum` 时，交换机开始随机将转发的数据包标记为
    `ECN` 11 (`拥塞体验`)。如果队列深度超过 `WRED Maximum`，则所有数据包都被标记为 `ECN` 11。`丢弃阈值`（Drop Threshold）定义了超出此限制后不再被标记而是直接丢弃的上限。


