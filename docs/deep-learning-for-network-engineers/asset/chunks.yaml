    The Output Gate controls how much of this activated output is shared as the public
    output. In this example, the output gate is fully open (outputting 1), allowing
    the word “is” to be published as the final output.


    ## An Overview of an LSTM-Based RNN


    Figure 6-5 illustrates an LSTM-based RNN model featuring two LSTM layers and a
    SoftMax layer. The input vectors `X1` and `X2`, along with the cell output `ht-1`
    from the previous time step, are fed into all LSTM cells in the input layer. To
    keep the figure simple, only two LSTM cells are shown per layer.


    The input vectors pass through gates, producing both the internal cell state and
    the cell output. The internal states are stored using a Constant Error Carousel
    (CEC) to be utilized in subsequent time steps. The cell output is looped back
