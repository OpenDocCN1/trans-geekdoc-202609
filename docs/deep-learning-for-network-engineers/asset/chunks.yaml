    网络时代


    手册系列 – 第 X 部分


    网络工程师深度学习指南：理解 AI 数据中心中的流量模式与网络需求


    Toni Pasanen, `CCIE28158`


    版权 © Toni Pasanen，保留所有权利。


    第一版 - 2025 年 5 月 18 日


    特别感谢 Magnus Ekman 出版了那本精彩的著作：


    《Learning Deep Learning: Theory and Practice of Neural Networks, Computer Vision,
    Natural Language Processing, and Transformers Using TensorFlow》（2021 年 8 月 17
    日）。


    这是我在编写“深度学习”章节时的主要参考文献，这也是为什么它在第 1 至 7 章中被列为首要来源。


    这本书献给我的小只黑狗，它每天都会带我远离电脑进行长距离散步——四到五次。它大慷地同意让我再次将它那漂亮的脸放在书的封面上，让这本书不仅仅属于我，也属于我们。


    ![](img/main-2.jpg)


    # 关于作者


    Toni Pasanen, `CCIE No. 28158`（路由与交换），是 Fsas Technologies 的首席网络架构师和高级工程师。他精通数据中心网络，包括传统的交换网络和现代的
    `BGP EVPN/VXLAN` Clos 拓扑，以及 AI 数据中心。除了本地数据中心网络外，Toni 还是云网络专家，特别是在 `Microsoft Azure`
    和 `Amazon Web Services (AWS)` 领域。


    尽管他目前的重点是 AI 数据中心解决方案，但 Toni 也设计并实现了跨多个领域的广泛网络，包括基于 MPLS 的 WAN 和数据中心（例如 `MPLS-VPLS`）。在担任思科官方学习合作伙伴工作期间，他还教授过路由、交换、MPLS
    和 QoS 等网络技术。


    自 2019 年以来，Toni 撰写了十本关于网络技术的书籍：


    《Virtual Extensible LAN – VXLAN: A Practical Guide to VXLAN Solution》，2019 年 8
    月。


    《LISP Control-Plane in Campus Fabric: A Practical Guide to Understand the Operation
    of Campus Fabric》，2020 年 2 月。


    《VXLAN Fabric with BGP EVPN Control-Plane: Design Considerations》，2020 年 9 月。


    《Object-Based Approach to Cisco ACI: The Logic Behind the Application Centric
    Infrastructure》，2020 年 12 月。


    《Cisco SD-WAN: A Practical Guide to Understand the Basics of Cisco Viptela Based
    SD-WAN Solution》，2021 年 5 月。


    《Network Virtualization: LISP, OMP, and BGP EVPN Operation and Interaction》，2021
    年 8 月。


    《AWS Networking Fundamentals: A Practical Guide to Understand How to Build a Virtual
    Datacenter into the AWS Cloud》，2021 年 1 月。


    《Azure Networking Fundamentals: A Practical Guide to Understand How to Build a
    Virtual Datacenter into the Azure Cloud》，2022 年 8 月。


    《Azure Networking Handbook: A Comprehensive Guide to Help You Step into the World
    of Azure Networking》，2023 年 8 月。


    《Deep Learning for Network Engineer: Understanding Traffic Patterns and Network
    Requirements in the AI Data Center》，2025 年 5 月。


    # 关于这本书


    在过去的过去的十年里，已经出版了多本关于深度学习（DL）和数据中心网络的优秀书籍。然而，我还没有找到一本能同时涵盖这两者的书。


    ## 那么，什么是深度学习？


    深度学习是机器学习（ML）的一个子领域。其核心是关于人工神经元的。通过在层之间连接许多神经元，我们构建了神经网络。在前向传播过程中，模型会做出预测。然后将此预测结果与正确标签进行比较以计算误差。在反向传播过程中，模型使用该误差来更新其参数。这个过程被称为
    `backpropagation`（反向传播）。


    ## 为什么网络工程师应该关注？


    现代 AI 模型可能极大，通常超过单台服务器（节点内）的容量。跨服务器（节点间）的参数同步对网络提出了严格的要求：高吞吐量、超低延迟和零丢包。在以太网中实现这些目标具有挑战性，但通过
    InfiniBand 或以太网是可以实现的。


    ## 本书是什么，不是什么


    本书提供的是理论和概念概述。它不是一份配置指南。由于重点是深度学习过程，因此没有涵盖接入层或管理网络的章节。存储网络也不在讨论范围内。这本书的目标是帮助读者（特别是网络专业人士）掌握深度学习如何影响数据中心的“大局”。


    ## 最后的说明


    在我之前所有的书中，我使用的是 10 号字体和单倍行间距。在本书中，我字体增大到 11 号，行间距调整为 1.15。这并不是为了增加页数，而是为了让阅读体验更舒适。我也尝试确保图表及其对应的解释出现在同一页，这有时会产生一些留白。


    # 本书的结构


    ## 第一部分 - 第 1-8 章：深度学习与深度神经网络


    本书的这一部分为理解现代 AI 构建和训练奠定了理论基础。介绍了人工神经元的结构和作用，并逐渐扩展到深度学习架构和并行训练方法。


    ### 人工神经元与前馈网络（第 1-3 章）


    旅程从人工神经元（也称为感知机）开始，它是神经网络最小的功能单元。它通过两个关键步骤运行：执行输入与权重之间的矩阵乘法，然后应用非线性激活函数来产生输出。


    通过在层之间连接许多神经元，我们构建了前馈神经网络（FNN）。FNN 适用于基础分类和回归任务，并通通更高级架构的阶石。


    ### 特殊架构：CNN、RNN 和 Transformer（第 3-9 章）


    在涵盖了 FNN 之后，这部分深入探讨了为特定数据类型设计的模型：


