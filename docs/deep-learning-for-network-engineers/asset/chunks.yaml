    \ B, on GPUs 0b and 1b, respectively. This setup enables a layer-wise model parallelism\
    \ strategy across four GPUs.\n\nIn this example, four mini-batches are processed\
    \ sequentially by GPU 0a on Host A. At time step t₁, GPU 0a performs a matrix\
    \ multiplication and applies an activation function to produce the first intermediate\
    \ output, y₁. This result is stored in its local VRAM and then transferred to\
