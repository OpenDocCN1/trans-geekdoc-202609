- raw: "If the test dataset is divided across multiple GPUs, gradients must be synchronized\
    \ before computing the actual weight-based adjustment values. Each GPU sums all\
    \ received gradients, including its own. The sum is then averaged by dividing\
    \ it by the number of GPUs. This process is explained in detail in Chapter 8.\
    \ Next, the GPUs synchronize these averaged gradients to ensure that each one\
    \ uses the same values when calculating the final weight adjustments. This process\
    \ is part of a data parallelization strategy, where the training dataset is too\
    \ large to fit into a single GPU’s memory and is split into micro-batches. Each\
    \ GPU processes its micro-batches using the same model with the same parameters.\n\
    \n![](main-18.jpg)\n\nFigure 2-9: The Backward Pass – Gradient for Neurons.\n\n\
    ### Weight Adjustment\n\nThe weight adjustment value is computed by multiplying\
    \ the gradient, averaged in our example, by the learning rate η. We use a learning\
    \ rate of 0.012. This results in a weight adjustment of 0.042 for weight wa1 and\
    \ 0.105 for weight wb1.\n\nThe weight adjustment values are then subtracted from\
    \ the initial weights. This yields an updated weight of 0.058 (0.1-0.042) for\
    \ wa1 and 0.295 (0.4-0.105) for wb1.\n\n![](main-19.jpg)\n\nFigure 2-10: The Backward\
    \ Pass – Compute New Weight Values.\n\n## The Second Iteration - Forward Pass\n\
    \nAfter updating all the weight values, including those associated with biases,\
    \ the backpropagation process begins the second iteration of the forward pass.\
    \ As shown in Figure 2-11, the model output \U0001D466\U0001D466^b = 1.28 is very\n\
    \nclose to the expected value y = 1.0. The new MSE = 0.007 is significantly lower\
    \ than the initial MSE = 0.245 computed in the first iteration.\n\n![](main-20.jpg)\n\
    \nFigure 2-11: The Second Iteration of the Forward Pass.\n\nIn Figure 2-12, we\
    \ have two 2-dimensional error spaces. Using the initial weight values, the model\
    \ output is 1.7, resulting in an MSE of 0.245. After adjusting the weights, the\
    \ model prediction is 1.119, reducing the MSE to 0.007.\n\n![](main-21.jpg)\n\n\
    Figure 2-12: Results Comparison.\n\n## Network Impact\n\nIn figure 2-13 we have\
    \ a fully-connected Feed Forward Neural Network (FFNN) with four layers; input\
    \ layer, two hidden layers, and output layer. Training data set is split into\
    \ two batches, A and B, which are processed by GPU-A and GPU-B.\n\nAfter computing\
    \ a model prediction during the forward pass, the backpropagation algorithm begins\
    \ the backward pass by calculating the gradient (output error) for the error function.\
    \ Once computed, the gradients are synchronized between the GPUs. The algorithm\
    \ then averages the gradients, and the process moves to the preceding layer. Neurons\
    \ in the preceding layer calculate their gradient by multiplying the weighted\
    \ sum of their connected neurons’ averaged gradients and connected weight with\
    \ the local activation function’s partial derivative. These neuron-based gradients\
    \ are then synchronized over connections (the process is explained in detail in\
    \ chapter 14). Before the process moves to the preceding layer, gradients are\
    \ averaged. The backpropagation algorithm executes the same process through all\
    \ layers.\n\nIf packet loss occurs during the synchronization, it can ruin the\
    \ entire training process, which would need to be restarted unless snapshots were\
    \ taken. The cost of losing even a single packet could be enormous, especially\
    \ if training has been ongoing for several days or weeks. Why is a single packet\
    \ so important? If the synchronization between the gradients of two parallel neurons\
    \ fails due to packet loss, the algorithm cannot compute the average, and the\
    \ neurons in the preceding layer cannot calculate their gradient. Besides, if\
    \ the connection, whether the synchronization happens over NVLink, InfiniBand,\
    \ Ethernet (RoCE or RoCEv2), or wireless connection, causes a delay, the completeness\
    \ of the training slows down. This causes GPU under-utilization which is not efficient\
    \ from the business perspective.\n\n![](main-22.jpg)\n\nFigure 2-13: Backward\
    \ Pass – Gradient Synchronization and Averaging.\n\n## References\n\n*   *   \\\
    [1\\]    Magnus Ekman, “Learning Deep Learning: Theory and Practice of Neural\
    \ Networks, Computer Vision, Natural Language Processing, and Transformers Using\
    \ TensorFlow”, 17 Aug. 2021\n\n    *   \\[2\\]    Goodfellow, I., Bengio, Y.,\
    \ & Courville, A. (2016, November 18). Deep Learning. MIT Press.\n\n[https://www.deeplearningbook.org/](https://www.deeplearningbook.org/)\n\
    \n*   *   \\[3\\]    Nielsen, M. (2015). Neural Networks and Deep Learning – Chapter\
    \ 2: How the Backpropagation Algorithm Works. Determination Press.\n\n[http://neuralnetworksanddeeplearning.com/chap2.html](http://neuralnetworksanddeeplearning.com/chap2.html)\n\
    \n*   *   \\[4\\]    LeCun, Y., Bottou, L., Orr, G. B., & Müller, K. R. (2012).\
    \ Efficient BackProp. In Neural Networks: Tricks of the Trade (pp. 9–50). Springer.\n\
    \n[https://yann.lecun.com/exdb/publis/pdf/lecun-98b.pdf](https://yann.lecun.com/exdb/publis/pdf/lecun-98b.pdf)\n\
