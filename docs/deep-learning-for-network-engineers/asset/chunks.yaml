    specifies it''s a Priority-based Pause (PFC) message.

    - `Class Enable Vector (CEV)`: This 8-bit field indicates which priority queues
    should be paused. Each bit corresponds to one of the 8 possible traffic classes
    (0–7). For example, if bit 3 is set to 1, it tells the sender to pause traffic
    for priority queue 3 while all other bits remain 0. In our case, the `CEV` is
    `0000 1000`. Note that the rightmost bit represents queue 0.

    - `Quanta Field(s)`: For each enabled priority (bit set to 1), a corresponding
