    that processes sequential data across four time steps. The model consists of three
    layers: the input LSTM layer, a hidden LSTM layer, and a SoftMax output layer.
    Each gray square labeled "LSTM" represents a layer containing `n` LSTM cells.


    At the first time step, the input value `x1` is fed to the LSTM cells in the input
    layer. Each LSTM cell computes its internal cell state (`C`), applies it to the
    output activation function, and produces a cell output (`ht`). This output is
    passed both to the LSTM cells in the next time step via recurrent connections
    and to the LSTM cells in the hidden layer at the same time step as an input vector.


    The LSTM cells in the hidden layer repeat the process performed by the input layer
    LSTM cells. Their output (`ht`) is passed to the SoftMax layer, which computes
    probabilities for each possible output class, generating the model''s predictions
    (`y1`). The cell output is also passed to the next time step on the same layer.


    The figure also depicts the autoregressive mode, where the output of the SoftMax
    layer at the initial time step `t1` is fed back as part of the input for the next
