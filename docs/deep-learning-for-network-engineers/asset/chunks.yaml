    * [6] Wikipedia contributors. (n.d.). Prewitt operator. Wikipedia. https://en.wikipedia.org/wiki/Prewitt_operator


    Spatial features refer to the characteristics of an image that describe the relationship
    between pixels based on their positions. These features capture the spatial structure
    of the image, such as edges, corners, textures, shapes, and patterns, which are
    essential for recognizing objects and understanding the visual content.


    # Chapter 5: Recurrent Neural Networks


    ## Introduction

    So far, this book has introduced two neural network architectures. The first one,
    the Feed-Forward Neural Network (`FNN`), works well for simple tasks, such as
    recognizing handwritten digits in small-sized images. The second one, the Convolutional
    Neural Network (`CNN`), is designed for processing larger images. CNNs can identify
    objects in images even when the location or orientation of the object changes.


    This chapter introduces the Recurrent Neural Network (`RNN`). Unlike `FNNs` and
    `CNNs`, an `RNN`’s inputs include not only the current data but also all the inputs
    it has processed previously. In other words, an `RNN` preserves and uses historical
    data. This is achieved by feeding the output of the previous time step back into
    the hidden layer along with the current input vector.


    Although `RNNs` can be used for predicting sequential data of variable lengths,
    such as sales figures or a patient’s historical health records, this chapter focuses
    on how `RNN` can perform character-based text autocompletion. The upcoming chapters
    will explore word-based text prediction.


    ## Text Datasets

    For training the `RNN` model, we typically use text datasets like IMDB Reviews
    or the Wikipedia Text Corpus. However, in this chapter, we simplify the process
    by using a tailored dataset containing only the word "alley". Figure 5-1 illustrates
    the steps involved.


    * 1. Splitting the text into characters: First, we break the word into its individual
    letters (e.g., a, l, l, e, y).

    * 2. Index mapping: Each character is assigned an index number, which maps it
    to a one-hot-encoded vector. For example, the letter “a” is assigned index 0,
    corresponding to the one-hot vector `[1, 0, 0, 0]`.

    * 3. Sequence creation: Finally, we define the sequence of characters to predict.
    For example, when the input character is “a” (input vector `[1, 0, 0, 0]`), the
    model should output the letter “l” (output vector `[0, 0, 1, 0]`).


    ![](main-41.jpg)


    Figure 5-1: Recurrent Neural Networks – Text Dataset and One-Hot Encoding.

