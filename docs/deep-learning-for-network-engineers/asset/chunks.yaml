    在图 7-3 中，我们有一个被分为四个象限的二维向量空间，代表性别（男/女）和年龄（儿童/成年）。分词后的单词被映射到这个空间中。


    在第一次迭代开始，所有单词被随机放置在二维空间内。在训练过程中，我们的目标是调整单词向量的值，使得成年人位于 Y 轴的正半，儿童位于负半。同样，男性被放在
    X 轴的负空间，而女性则位于正半轴。


    ![](img/main-54.jpg)


    图 7-3：初始状态下二维向量空间中的单词。


    图 7-4 展示了单词在成功训练后可能的位置。所有代表成年男性的单词都被放在左上象限（成年/男性）。同样，所有其他单词根据其相应的年龄和性别放置在二维向量空间中。


    ![](img/main-55.jpg)


    图 7-4：训练后二维向量空间中的单词。


    除了将相似单词（如“成年/女性”）在 n 维空间中彼此靠近之外，不同象限之间的单词之间也存在位置相似性。例如，如果我们计算 `Father”（父亲）和 `Mother”（母亲）之间的欧氏距离，可能会发现它们的距离约为
    `4.3`。同样的模式也适用于词对，如 `Nephew-Niece`（侄子-女侄）、`Brother-Sister`（兄弟-姐妹）、`Husband-Wife`（丈夫-妻子）以及
    `Father-in-Law–Mother-in-Law`（公婆）。


    但注意的是，这个例子纯粹是理论性的。在实践中，高维单词嵌入中的欧氏距离并不是固定的，而是取决于训练数据和优化过程。单词之间的关系通常通过余弦相似性而非绝对欧氏距离来更好地捕捉。


    ![](img/main-56.jpg)


    图 7-5：欧氏距离。


    ## 位置嵌入 (Positional Embeddings)


    由于输入文本通常包含重复单词，且其含义取决于所在位置，大语言模型（LLM）必须区分它们。为了实现这一点，自然语言处理（NLP）中的单词嵌入过程在单词向量旁边还结合了位置编码向量，从而形成最终的单词表示。


    在图 7-6 中，句子“The sky is clear, so she finally decided to clear the backyard”中出现了两次
    `clear`。重复单词共享相同的标记 ID（token ID），而不是接收唯一的 ID。在这个示例中，`is` 被分配了标记 ID `2`，而 `clear`
    被分配了 `5`。然后，这些标记 ID 通过单词嵌入查找表映射为向量。然而，如果没有位置编码，不同含义的单词将共享相同的向量表示。


    关注 `clear`（标记 ID `5`），它映射到查找表中的单词嵌入向量 `[+2.5, +1.0]`。由于标记 ID 不捕捉单词的位置，相同的单词始终接收相同的嵌入。


    位置编码对于捕捉上下文和语义含义至关重要。如图 7-6 所示，每个输入单词除了其单词嵌入外还接收一个位置编码向量（`PE`）。`PE` 可以在训练期间进行学习和调整，也可以保持固定。最终的单词嵌入向量通过结合单词向量和位置编码向量计算得出。


    ![](img/main-57.jpg)


    图 7-6：分词——位置嵌入向量。


    ### 计算最终单词嵌入


    图 7-7 展示了通过结合位置嵌入计算最终单词嵌入的公式。有三个变量：


    *   `Position (pos)`：单词在句子中的位置。在我们的示例中，`clear` 第一次出现是第四个单词，所以 `pos = 4`。

    *   `Dimension (d)`：向量的深度。我们使用 2 维向量，所以 `d = 2`。

    *   `Index (i)`：指定向量的轴：`0` 代表 x 轴，`1` 代表 y 轴。


    位置嵌入使用以下公式计算：


    *   `x-axis`：`sin(pos/10000^(2i/d))`，其中 `i = 0`

    *   `y-axis`：`cos(pos/10000^(2i/d))`，其中 `i = 1`


    对于位置在 `4` 的 `clear`，当 `d = 2` 时，生成的二维位置向量为 `[-0.8,+1.0]`。然后，将该向量加到输入单词嵌入向量 `[+2.5,
    +1.0]` 上，得到最终的单词嵌入向量 `[+1.7, +2.0]`。


    图 7-7 还显示了 `clear` 第二次出现的最终单词嵌入，但省略了计算过程。


    ![](img/main-58.jpg)


    图 7-7：第 4 个单词的最终单词嵌入。


    ## Transformer 架构


    ### 简介 (Introduction)


    序列到序列（seq2seq）语言翻译和生成式预训练 Transformer（GPT）模型是自然语言处理（NLP）的子类，它们利用 Transformer 架构。seq2seq
    模型通常使用长短期记忆（LSTM）网络或基于编码器-解码器的 Transformer。相比之下，GPT 是一种使用仅解码器 Transformer 机制的自回归语言模型。本章的目的是提供仅解码器
    Transformer 的概述。


    Transformer 由堆叠的解码器模块组成。嵌入向量（分词和嵌入的结果）作为输入馈给第一个解码器模块。处理后，生成的上下文向量传递给下一个解码器，依此类推。在最后一个解码器之后，softmax
    层会对整个词汇表中的输出进行评估，以预测下一个单词。


    ### 自注意力机制 (Self-Attention Mechanism)


    Transformer 不是直接将嵌入的单词向量（即标记嵌入加上位置编码）输入解码器层，而是首先从单词向量计算出 `Query (Q)`、`Key (K)`
    和 `Value (V)` 向量。这些向量随后被用于自注意力机制。最初，使用矩阵乘法将查询向量与键向量相乘。然后将结果除以键维的平方根（缩放点积），以获得逻辑值（logits）。逻辑值通过
    softmax 层处理以计算概率。SoftMax 预测结果与值向量相乘，产生上下文向量。


    在将上下文向量馈入前馈网络之前，通过残差连接将其与原始单词嵌入（包含位置编码）相加。最后，使用层归一化对输出进行处理。


    ### 前馈网络 (Feedforward Network)


    每个解码器模块由注意力层、加一化层（Add &Normalization）和一个前馈网络（`FFNN`）组成。


    解码器中 FFNN 的基础架构设计为输入层具有与上下文向量维度相同的神经元。隐藏层则是输入层的四倍，而输出层的神经元数量与输入层相同。这种设计确保了 FFNN
    输出向量的维度与上下文向量相同。与注意力块一样，FFNN 块也采用了残差连接和归一化。


    ![](img/main-59.jpg)


    图 7-8：仅解码器 Transformer 架构。


    ### 查询、键和值向量


