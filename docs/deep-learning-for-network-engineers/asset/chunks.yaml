    ## 基于 DSCP 的优先级流控制 (PFC)


    优先级流控制 (`PFC`) 是一种旨在网络拥塞时通过根据优先级级别选择性暂停流量来防止丢包的机制。虽然原始 `IEEE 802.1Qbb` 标准运行二层，使用以太网头中的优先级代码点
    (`PCP`) 字段，但 AI 织网依赖于三层转发，传统的基于二层的 PFC 不再适用。为了在路由（层 3）网络中扩展无损行为，使用了基于 DSCP 的 PFC。


    在基于 DSCP 的 PFC 中，IP 头中的区分服务代码点 (`DSCP`) 字段识别流量类或优先级。交换机将特定的 `DSCP` 值映射到内部流量类和队列。如果入站接口发生拥塞且特定优先级队列填充超过阈值，交换机可以向发送端交换机发送
    `PFC` 暂停帧，指示其临时停止发送该类流量——就像在二层 `PFC` 中一样，但现在是基于三层分类触发的。


    这种行为与显式拥塞通知 (`ECN`) 不同，后者也运行在三层，但通过标记数据包而不是停止流量来信号拥塞。`ECN` 作用于出口，通知接收者通知发送者随时间降低传输速率。相比之下，`PFC`
    立即作用于入口，实时暂停流量流以避免缓冲区溢出和丢包。


    `PFC` 依赖于两个阈值来控制流：`xOFF` 和 `xON`。`xOFF` 阈值定义了优先级队列达到拥塞状态时交换机生成暂停帧的点。一旦触发，上游设备将停止该类流量的传输。交换机持续监控缓冲区占用率，当水平下降到
    `xON` 阈值以下时，它会针对受影响的优先级发送一个 `Quanta` 值为 `0` 的 `PFC` 帧。这通知上游设备恢复该特定优先级队列的传输。


    `PFC` 正确运行的关键要求是提供缓冲区余量（headroom）。交换机必须为每个优先级类预留足够的缓冲区空间，以在暂停帧传播到发送端并生效期间容纳传输中的流量。


    基于 DSCP 的 PFC 在路由网络上实现了无损数据包交付，这对于 `RoCEv2` (基于融合以太网的 RDMA) 等技术特别重要，因为即使是微小的丢包也会导致性能大幅下降。


    ### 三层路由接口上基于 DSCP 的 PFC 过程


    过程概述：此示例说明了基于 DSCP 的优先级流控制如何在织网中运行。我们通过一个四步的过程，从缓冲区溢出开始到流量暂停结束。


    #### 步骤 1：交换机 C 缓冲区溢出（出口）


    在 GPU 集群中，多个 GPU 正向 `Switch C` 发送高吞吐 RDMA 流量。出口接口 `E12/24` 变得拥塞。由于出口队列 `3` 溢出，来自入口队列
    `3` 的包无法放置。


    #### 步骤 2：超过 xOFF


    优先级队列 `3` 有两个阈值：


    - `xOFF` 阈值：缓冲区使用超过此电平时触发暂停。

    - `xON` 阈值：当缓冲区排空足够时触发恢复。


    一旦入口接口 `E3/24` 上的优先级队列 `3` 超过其 `xOFF` 阈值，交换机将采取立即行动，通过生成暂停消息防止丢包。在这种情况下发送端是 `Spine
    Switch 1`，它通过接口 `E3/24` 向 `Switch C` 发送流量。


    #### 步骤 3：生成 PFC 帧（MAC 控制帧）


    为了暂停发送端，`Switch C` 生成一个以太网 MAC 控制帧：


    - Ethertype 0x808：表示 MAC 控制帧，用于暂停操作（标准化为 `802.3x`）。在此帧内部，`PFC` 码 `0x0101` 指定为优先级暂停（PFC）消息。

    - 类启用向量 (CEV)：这是一个 8 位字段，指示哪些优先级队列应该暂停。每个位对应 8 个可能的流量类（0–7）。例如，如果位 3 设置为 1，则告诉发送端暂停优先级队列
    3 的流量，而所有其他位保持 0。在我们情况下，`CEV` 为 `0000 1000`。注意最右侧的位代表队列 0。

    - 节量子字段 (Quanta Field)：对于每个启用的优先级（位设置为 1），都会指定相应的 `quanta` 值。该值定义了暂停的持续时间，以 512
    比特时间为单位。


    对于 400 Gbps 接口：


    - `1 bit time` = `1 / 400,000,000,000` 秒 ≈ `2.5 皮秒`

    - `1 quanta` = `512 × 2.5 ps` = `1.28 纳秒`


