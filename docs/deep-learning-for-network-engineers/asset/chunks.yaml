  trans: '


    如果测试数据集跨越多个 GPU，则在计算实际的权重调整值之前，必须同步梯度。每个 GPU 都会累加所有到的梯度，包括其自身的梯度。然后通过除以 GPU 的数量对总和取平均。该过程在第
    8 章中进行了详细说明。接下来，GPU 同步这些平均后的梯度，以确保每个 GPU 在计算最终权重调整时使用相同的值。这一过程是数据并行化策略的一部分，即训练数据集太大无法放入单个
    GPU 的内存中，因此被分成多个微批（micro-batches）。每个 GPU 使用相同的模型和相同的参数处理这些微批。


    ![](img/main-18.jpg)


    图 2-9：反向传播 – 神经元的梯度。


    ### 权重调整


    权重调整值是通过将示例中平均后的梯度乘以学习率 `η` 计算得。我们使用了 `0.012` 的学习率。这导致权重 `wa1` 的调整量为 `0.042`，权重
    `wb1` 的调整量为 `0.105`。


    然后将权重调整值从初始权重中减去。这使得 `wa1` 的更新权重为 `0.058 (0.1-0.042)`，`wb1` 的更新权重为 `0.295 (0.4-0.105)`。


    ![](img/main-19.jpg)


    图 2-10：反向传播 – 计算新权重值。


    ## 第二次迭代 - 前向传播


    在更新所有权重值（包括与偏置相关的权重）之后，反向传播过程开始第二次前向传播。如图 2-11 所示，模型输出 `𝑦^b = 1.28` 非常接近预期值 `y
    = 1.0`。新的 `MSE = 0.007` 显著低于第一次迭代计算出的初始 `MSE = 0.245`。


    ![](img/main-20.jpg)


    图 2-11：前向传播的第二次迭代。


    在图 2-12 中，我们有两个二维误差空间。使用初始权重值，模型输出为 `1.7`，导致 `MSE` 为 `0.245`。调整权重后，模型预测值为 `1.119`，将
    `MSE` 降低到 `0.007`。


    ![](img/main-21.jpg)


    图 2-12：结果比较。


    ## 网络影响


    在图 2-13 中，我们有一个四层的全连接前馈神经网络（FFNN）；包括：输入层、两个隐藏层和一个输出层。训练数据集分为两个批次 `A` 和 `B`，分别由
    `GPU-A` 和 `GPU-B` 处理。


    在前向传播期间计算出模型预测值后，反向传播算法通过计算误差函数的梯度（输出误差）开始反向传播。一旦计算，梯度会在 GPU 之间进行同步。算法随后对梯度取平均值，并移动到前一层。前一层中的神经元通过将与其连接的神经元的平均梯度与连接权重加权和乘以局部激活函数的偏导数，来计算自身的梯度。这些基于神经元的梯度随后通过连接进行同步（该过程在第
    14 章中详细说明）。在过程移动到前一层之前，会对梯度进行平均处理。反向传播算法通过所有层执行相同的过程。


    如果在同步期间发生丢包，可能会破坏整个训练过程，除非提前拍摄了快照（snapshots），否则需要重新启动。即使丢失单个数据包的代价也是巨大的，特别是当训练已持续几天或几周时。为什么单个数据包如此重要？如果两个并行神经元之间的梯度同步由于丢包而失败，算法将无法计算平均值，前一层的神经元也无法计算梯度。此外，如果通过
    `NVLink`、`InfiniBand`、`Ethernet`（`RoCE` 或 `RoCEv2`）或无线连接进行同步会导致延迟，训练进度就会降低。这会导致
    GPU 利用率不足，从业务角度来看是不高效的。


    ![](img/main-22.jpg)


    图 2-13：反向传播 – 梯度同步与平均。


    ## 参考文献


    - [1] Magnus Ekman, “Learning Deep Learning: Theory and Practice of Neural Networks,
    Computer Vision, Natural Language Processing, and Transformers Using TensorFlow”,
    2021 年 8 月 17

    - [2] Goodfellow, I., Bengio, Y., & Courville, A. (2016, 11 月 18). Deep Learning.
    MIT Press. [`www.deeplearningbook.org/`](https://www.deeplearningbook.org/)

    - [3] Nielsen, M. (2015). Neural Networks and Deep Learning – 第 2 章: How the Backpropagation
    Algorithm Works. Determination Press. [`neuralnetworksanddeeplearning.com/chap2.html`](http://neuralnetworksanddeeplearning.com/chap2.html)

    - [4] LeCun, Y., Bottou, L., Orr, G. B., & Müller, K. R. (2012). Efficient BackProp.
    In Neural Networks: Tricks of the Trade (pp. 9–50). Springer. [`yann.lecun.com/exdb/publis/pdf/lecun-98b.pdf`](https://yann.lecun.com/exdb/publis/pdf/lecun-98b.pdf)


