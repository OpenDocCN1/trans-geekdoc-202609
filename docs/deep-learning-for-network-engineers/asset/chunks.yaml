    图 3-2 和 3-3 展示了多分类任务的前向传播过程。`Input Layer` 将 28 x 28 像素图像展平为 784 个输入参数，每个参数代表一个像素的强度（0
    = 黑色，255 = 白色）。这 784 个输入值随后被传递给 `Hidden Layer` 中的所有 128 个神经元。隐藏层中的每个神经元都会接收所有
    784 个输入，且每个输入都与一个唯一的权重相关。因此，128 个神经元中的每一个都拥有 784 个权重参数，隐藏层的权重参数总数为 100,352 个。


    在 `hidden layer` 中，每个神经元计算其输入的加权求和（`= 矩阵乘法`），然后对结果应用 `ReLU` 激活函数。这个过程产生了 128 个激活值，隐藏层中的每个神经元对应对应一个。


    接下来，这 128 个激活值被送入 `Output Layer`，该层由 10 个神经元组成（对应 MNIST 数据集的 10 个可能类别）。每个输出神经元都连接到来自隐藏层的所有
    128 个激活值。因此，输出层的权重参数数量为 1280。同样，每个神经元通过计算其输入的加权求和来执行矩阵乘法。该计算结果被称为 `logit`。


    在输出层中，对这些 logits 应用了 `SoftMax` 激活函数。`SoftMax` 首先以欧拉数 `e` 为底计算每个 logit 的指数。然后，它计算这些指数之和，在本例中该和为
    24.813。每个类别的概率（记为 $\hat{y}$）通过将每个神经元的指数除以所有指数之和来计算得出。


    在这个例子中，对应类别“5”的输出神经元产生了最高概率，这意味着模型预测图像中的数字是 5。然而，由于该预测在第一次迭代中是错误的，模型将在反向传播期间调整其权重。


    在我们的模型中，我们有 101,632 个权重参数。神经网络中存储每个权重参数所使用的位数取决于为模型选择的数值精度。32 位浮点数（`FP32` – 单精度）是使用的标准精度，每个权重使用
    32 位（4 字节）表示。这种格式提供了良好的精度，但对于大型模型来说可能非常消耗内存。为了减少内存占用并提高速度，许多现代硬件系统使用 16 位浮点数（`FP16`
    – 半精度），其中每个权重使用 16 位（2 字节）表示。还有 64 位浮点数（`FP64` – 双精度），它使用 64 位（8 字节），提供了比 `FP32`
    更高的和更大的范围，但是以增加内存占用为代价的。


    在我们的模型中，使用 `FP32`，权重参数所需的内存为 406,528 字节（4 × 101,632）。


    ![](img/main-24.jpg)


    图 3-2：前向传播 – 概率计算。


    ### 交叉熵损失 (Cross-Entropy Loss)


    在我们的示例中，最高概率值（0.244）由神经元 5 提供，尽管预期值本应由神经元 9 产生。接下来，算法通过对预期神经元的概率值取对数来计算 `cross-entropy
    loss`，正如独热编码（one-hot）定义的那样。


    ### 反向传播 (Backward Pass)


    ### 梯度计算 (Gradient Computing)


    在前向传播之后，我们需要计算损失函数对每个权重的梯度。这个梯度表示了权重微小变化对损失函数的影响程度。通过链式法则，我们将误差从输出层向输入层层传播。


    ### 权重调整 (Weight Adjustment)


    在计算出梯度后，模型根据梯度来更新权重。更新公式通常为 $w = w - \eta \cdot \nabla w$，其中 $w$ 是权重，$\eta$ 是学习率，$\nabla
    w$ 是梯度。学习率决定了权重更新的幅度。


    ### 权重更新 (Weight Update)


    通过不断地重复前向传播、反向传播和权重更新，模型逐渐减少损失函数的值，从而提高分类准确性。

