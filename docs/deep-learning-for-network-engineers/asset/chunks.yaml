    ## LLDP with DCBX


    PFC negotiation is performed using the Link Layer Discovery Protocol (LLDP), which
    carries Data Center Bridging eXchange (DCBX) TypeLength-Value (TLV) structures.
    At the time of writing, DCBX exists in two versions: IEEE and CEE. The IEEE mode
    (defined in 802.1Qbb and 802.1Qaz) is standards-based and supported by most modern
    data center switches from various vendors. This mode is also known as DCBXv2.
    Some older Cisco Nexus models support only the Cisco/Converged Enhanced Ethernet
