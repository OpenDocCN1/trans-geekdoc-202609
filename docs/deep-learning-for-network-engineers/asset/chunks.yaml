    \ packet arrives at Host 2, the RDMA NIC uses the Virtual Address information\
    \ in the `RETH` header to write the payload directly into memory block 2C.\n\n\
    ![](main-115.jpg)\n\nFigure 12-1: RDMA WRITE First.\n\n### RDMA Write Middle\n\
    The second message has the opcode `RDMA Write Middle` and `PSN` 2, which tells\
