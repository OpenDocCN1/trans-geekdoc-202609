    在上面的示例计算中，假设输入值 `x1` 和 `x2` 为零。如果没有偏置项（bias term），无论权重参数有多大，激活值都将为零。因此，偏置项允许神经元在所有输入值均为零时产生非零输出。


    ### ReLU 激活函数


    Sigmoid 激活函数的一种轻量级替代方案是 `ReLU`（线性整流单元）。`ReLU` 激活函数对于小于等于零的值是非线性的对于大于零的值是线性的。这意味着如果加权之和
    `z ≤ 0`，则输出为零；如果 `z > 0`，输出等于 `z`。


    从计算角度来看，`ReLU` 比 Sigmoid 函数需要的 CPU 周期更少。图 1-6 展示了 `z = 4.8` 如何被 `ReLU` 处理，得到输出值
    `𝑦𝑦^ = 4.8`。图还展示了 `ReLU` 的两种常用表示法。第一种表示法规定：


    - 如果 `z > 0`，返回 `z`。

    - 如果 `z ≤ 0`，返回 `0`。


    第二种表示法写为 `MAX(0,z)`，简单意味着在 `0` 和 `z` 之间选择较大值。


    ![](img/main-9.jpg)


    图 1-6：带有 `ReLU` 激活函数的人工神经元。


    ## 网络影响


    人工神经元是神经网络的最小单元。神经元的大小取决于它与输入节点的连接情况。每个连接都有一个相关的权重参数，通常是一个 32 位的值。在我们的示例中，有 2
    个连接和和一个偏置，神经元的大小为 `3 x 32 bits = 96 bits`。


    虽然我们在这个示例中没有定义输入的大小，但假设每个输入 `(x)` 是一个 8 位值，这意味着输入数据占用 `2 x 8 bits = 16 bits`。因此，我们的单个神经元“模型”需要
    96 位权重加上 16 位输入数据，总计需要 112 位内存。这个规模足够小，不需要并行化。此外，权重参数、输入值、加权之和的结果以及神经元的输出都必须存储以便处理。


    然而，如果神经网络模型结合输入数据的内存需求超过了 GPU 的内存容量，则需要并行化策略。数据可以分布在单个服务器内的多个 GPU 上，并通过高速 NVLink
    进行同步。如果作业必须在多个 GPU 服务器之间进行划分，则同步将通过后端网络进行，该网络必须提供无损、高速的数据包转发。


    并行化策略将在下一章中讨论，该章将介绍使用反向传播算法的前馈神经网络，并在后续专门讨论并行化的章节（第 8 章）中介绍。


    ## 总结


    深度学习利用由人工神经元组成的的神经网络。人工神经元模拟了生物神经元的结构和操作。输入数据通过连接输入神经元，每个连接都有自己的权重参数。神经元利用这些权重计算输入的加权之和，即激活前值。结果随后通过激活函数得到激活后值，或神经元的实际输出。本章讨论的激活函数是非线性的
    `ReLU`（线性整流单元）和逻辑 Sigmoid 函数。


