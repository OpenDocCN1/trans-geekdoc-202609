- raw: 'This design resembles the dual-rail concept used in scalable AI clusters,
    but NVIDIA’s SU approach calls for two separate physical switches per rail, which
    provides full physical isolation. Dual-rail-per-switch hits a middle ground in
    terms of CapEx and OpEx: fewer switches are required than in the single-rail model,
    and operational complexity is reduced compared to multi-rail. It’s often a good
    choice for intermediate-scale environments where some fault tolerance and cost
    control must be balanced.


    Figure 13-11 illustrates a dual-rail-per-switch design, where the switch interfaces
    are divided evenly between two separate rails. Rail 1 uses interfaces 1 through
    16 and is assigned to subnet 10.0.1.0/25 (VLAN 101). Rail 2 uses interfaces 17
    through 32 and is assigned to subnet 10.0.128.0/25 (VLAN 102). Each VLAN has its
    own MAC address table, and the rail switch serves as the default gateway for both.
    The individual /25 subnets are redistributed into the BGP process and summarized
    as 10.0.1.0/24 for advertisement toward the spine layer.


    ![](main-135.jpg)


    Figure 13-11: Dual-Rail Switch.


    #### Single-Rail-per-Switch


    This model offers the highest level of physical isolation. Each switch forms a
    single rail, serving its connected GPU servers through one subnet and one VLAN.
    No logical separation is needed, as each rail is entirely independent in hardware.
    As a result, a switch failure affects only the GPU servers attached to that specific
    rail, yielding a small, predictable failure domain.


    The design closely aligns with NVIDIA’s Scalable Unit (SU) architecture, in which
    each rack or rack group includes its own rail switch, and horizontal scaling is
    achieved by repeating modular, self-contained units.


    While this model demands the highest CapEx, due to the one-to-one mapping between
    switches and rails, it offers major operational advantages. Configuration is simpler,
    troubleshooting is faster, and the risk of cascading faults is minimized. There
    is no need for route summarization, or custom BGP redistribution logic. Over time,
    these benefits help drive down OpEx, particularly in large-scale or mission-critical
    GPU clusters.


    To ensure optimal hardware utilization, it is important to align the number of
    GPU servers per rack with the switch’s port capacity. Otherwise, underutilized
    ports can lead to inefficiencies in infrastructure cost and resource planning.


    Figure 13-12 illustrates a simplified single-rail-per-switch topology. All interfaces
    from 1 to 32 operate within a single rail, configured with subnet 10.0.1.0/24
    and VLAN 101. The rail switch serves as the default gateway, and because the full
    /24 subnet is used without subnetting, route summarization is not needed.


    ![](main-136.jpg)


    Figure 13-12: Single-Rail Switch.


    ### AI Fabric Architecture Conclusion


    Figure 13-13 illustrates one way to describe the overall architecture of an AI
    Fabric. It is divided into three domains. The first domain, called the Segment,
    includes GPU hosts and Rail switches. The second domain, the Pod, aggregates multiple
    segments using Spine switches. In cases where NCCL builds a topology where cross-rail
    inter-host traffic is first copied to


    the local GPU memory (located on the destination rail) and then sent over the
    GPU NIC to the remote GPU via the correct Rail switch, a Pod architecture with
    Spine switches may not be necessary. The third domain, multi-Pod, interconnects
    multiple pods using Super Spine switches, enabling large-scale AI Fabric deployments.
    Figure 13-10 also depicts global settings and properties shared across the AI
    Fabric backend network.


    #### Segment: GPU I/O Topology and Rail Switch Fabric Profile


    GPU I/O Topology: Each GPU connects to the network through a NIC. You can either
    dedicate a NIC to each GPU or share one NIC among multiple GPUs. NICs may have
    single, dual, or quad ports and support speeds such as 100, 200, or 400 Gbps.
    The interconnect type can be InfiniBand, RoCEv2, or NVLink. A segment typically
    includes multiple hosts.


    Rail Switch Fabric Profile: Rail switches connect directly to GPU hosts. Each
    rail handles a group of NIC ports. You can map rails one-to-one to switches for
    physical isolation or map multiple rails per switch for logical isolation. In
    the latter case, two or more rails can be mapped per switch depending on performance
    and capacity requirements. Rail switches are responsible for ingress packet classification
    and for mapping RoCEv2 traffic to the correct queues.


    #### Pod: Spine Switch Profile:


    Spine switches aggregate multiple Rail switches, forming a Pod that consists of
    n segments. Spine switches enable cross-rail communication between GPUs. They
    use high-density, high-speed ports. When the Spine layer is used, the result is
    a 2-tier, 3-stage architecture.


    #### Multi-Pod: Super Spine Switch Profile


    Super Spine switches provide inter-Pod connectivity. They are built with very
    high port density to support all connected Spine switches. When the Super Spine
    layer is used, the architecture becomes a 3-tier, 5-stage fabric.


    #### Global AI Fabric Profile


    All layers are governed by the Global AI Fabric Profile. This profile defines
    the control plane (eBGP, iBGP, BGP EVPN), the data plane (Ethernet, VXLAN), Layer
    3 ECMP strategies (flow-based, flowlet-based, or perpacket), congestion control
    mechanisms (ECN marking, PFC), inter-switch link monitoring (BFD), and global
    MTU settings.


    ![](main-137.jpg)


    Figure 13-13: AI fabric Architecture Description.


    ### Hash Polarization


    In 2-tier or 3-tier topologies, there is an inherent risk of hash polarization.
    Consider a fully connected Clos topology with four leaf switches and four spine
    switches. Each leaf connects to all spine switches and uses ECMP (Equal-Cost Multi-Path)
    to distribute traffic across these equal-cost paths. When each leaf receives a
    flow from its locally connected host, and all flows are destined for the same
    endpoint, the ECMP hash function on each leaf determines which spine switch to
    use as the next hop.


    If the ECMP hash function on all leaf switches produces the same result — for
    example, all leafs selecting the same spine switch as the next hop — then that
    spine becomes a bottleneck. It receives all flows and must forward them toward
    the destination, typically through the same inter-switch link. This can lead to
    buffer overflows or congestion on that path.


    This scenario, where multiple flows are consistently mapped to the same next-hop
    due to deterministic hash outcomes and similar flow characteristics, is known
    as hash polarization. It often arises when the entropy in the fields used for
    ECMP hashing (e.g., source and destination IP addresses and ports) is low. When
    flows have similar headers and the hash function lacks variability, traffic is
    not evenly spread across available paths.


    Hash polarization can be mitigated in several ways. These include increasing entropy
    in the hash inputs, tuning the hash algorithm to better distribute flows, or using
    adaptive techniques like flowlet-based load balancing or congestion-aware rehashing.
    However, one effective method to eliminate hash polarization is through topological
    design — specifically, by altering the cabling pattern between leaf and spine
    switches.


    Even if ECMP hashing is deterministic, it is possible to physically design the
    topology so that not all leaf switches are connected to the same subset of spines.
    In a traditional Clos network, every leaf connects to every spine. If each leaf
    applies the same hash function and flow headers are similar,


    traffic can converge on the same spine — causing the exact polarization problem
    described earlier.'
