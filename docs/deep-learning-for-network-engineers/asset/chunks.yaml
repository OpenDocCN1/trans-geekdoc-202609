    # Chapter 6: Long Short-Term Memory


    ## Introduction


    As mentioned in the previous chapter, Recurrent Neural Networks (RNNs) can have
    hundreds or even thousands of time steps. These basic RNNs often suffer from the
    gradient vanishing problem, where the network struggles to retain historical information
    across all time steps. In other words, the network gradually "forgets" historical
    information as it progresses through the time steps.


    One solution to address the horizontal gradient vanishing problem between time
    steps is the use of Long-Term Memory (LSTM) based RNN instead of basic RNN. LSTM
    cells can preserve historical information across all time steps, whether the model
    contains ten or several thousand time steps.


    Figure 6-1 illustrates the overall architecture of an LSTM cell. It includes three
    gates: the Forget gate, the Input gate (a.k.a. Remember gate), and the Output
    gate. Each gate contains input neurons that use the Sigmoid activation function.
    The reason for employing the Sigmoid function, as shown in Figure 5-4 of the previous
    chapter, is its ability to produce outputs in the range of 0 to 1. An output of
    0 indicates that the gate is "closed," meaning the information is excluded from
    contributing to the cell''s internal state. An output of 1, on the other hand,
    means that the information is fully utilized in the computation. However, the
    sigmoid function never gives an exact output of zero. Instead, as the input value
    becomes more and more negative (approaching negative infinity), the output gets
    closer and closer to zero, but it never actually reaches it. Similarly, the sigmoid
    function''s output approaches one as the input value becomes very large (approaching
    positive infinity). However, just like with zero, the function never exactly reaches
    one; it only gets very close.


    As a one way of completely closing any of the gates, you may set a threshold value
    manually and define, for example, that the outputs less than `0.01` are interpreted
    as zero (gate closed). The same principle applies to gate opening, you can set
    the threshold to, for example, output higher than `0.95` are interpreted as one
    (gate fully open). However, instead of hard coded threshold, consider alternatives
    like smooth activation adjustments.

    [/content]

