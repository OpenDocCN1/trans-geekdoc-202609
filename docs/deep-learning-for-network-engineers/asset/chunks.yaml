    Since the switch cannot forward all the data at wire speed, it stores some of
    the packets in the buffer, causing congestion. Similar congestion may also occur
    at the spine switches. As explained earlier in Chapter 12, egress buffer overflow
    may trigger `ECN` (Explicit Congestion Notification) and `PFC` (Priority Flow
    Control) mechanisms to prevent packet loss.


    ![](main-118.jpg)


    Figure 12-4: Layer 3 Load balancing.


    ## Flowlet-Based Load Balancing with Adaptive Routing


    Adaptive routing is a dynamic method that actively monitors link utilization and
    reacts to network congestion in real time. In Figure 12-5, the `5-tuple` hash
    algorithm initially selects the same uplink for all flowlets, just like in the
    previous example. However, once the utilization of the interswitch link between
    `Rail-1` and `Spine-1` goes over threshold, the adaptive routing mechanism detects
    the increased load and starts redirecting some of the flowlets to an alternate,
    less congested path, through `Spine-2`.


    By distributing the flowlets across multiple paths, adaptive routing helps to
    reduce buffer buildup and avoid potential packet drops. This not only improves
    link utilization across the fabric but also helps maintain consistent throughput
    for time-sensitive operations like `RDMA-based gradient synchronization`. In AI
    workloads, where delays or packet loss can slow down or even interrupt training,
    adaptive routing plays a critical role in maintaining system performance.


    ![](main-119.jpg)


    Figure 12-5: Dynamic Flow Balancing.


    ## Packet-Based Load Balancing with Packet Spraying


    Packet spraying is a load balancing method where individual packets from the same
    flow are distributed across multiple equal-cost paths. The idea is to use all
    available links evenly and reduce the chance of congestion on any single path.


    In a `RoCEv2`-based AI backend network, however, packet spraying presents serious
    challenges. `RoCEv2` relies on lossless and in-order packet delivery. When packets
    are sprayed over different paths, they can arrive out of order at the destination.
    This packet reordering can disrupt RDMA operations and reduce the overall performance
    of GPU-to-GPU communication.


    ![](main-120.jpg)


    Figure 12-6: Packet Spraying: OpCode: `RDMA Write First, Middle, and Last`.


    ### RDMA Write Only


    NVIDIA’s `RDMA NICs` starting from `ConnectX-5` support the `RDMA Write Only`
    operation, where a `RETH` header is included in every packet. Figure 12-7 shows
    how the `RDMA NIC` uses the `OpCode: RDMA Write Only` in the `IBTH` header for
    each message. With this `OpCode`, every message also includes a `RETH` header,
    which holds information about the destination memory block reserved for the data
    carried in the payload. This allows the receiving `RDMA NIC` to write data directly
    to the correct memory location without relying on prior messages in the transfer
    sequence.


    `RDMA Write Only`, when combined with `Packet-Based Load Balancing` using `Packet
    Spraying`, brings significant benefits. Since each packet is selfcontained and
    includes full memory addressing information, the network fabric can forward individual
    packets over different paths without worrying about packet ordering or context
    loss. This enables true flowlet or even per-packet load balancing, which helps
    spread traffic more evenly across available links, avoids hotspots, and reduces
    queuing delays.


    ![](main-121.jpg)![](main-122.jpg)![](main-123.jpg)![](main-124.jpg)


    Figure 12-7: Packet Spraying: OpCode: `TDMA Write Only`.


    ## Configuring Per-Packet Load Balancing on Cisco Nexus Switches


    At the time of writing, Cisco `Nexus 9000 Series Cloud Scale` switches (`9300-FX3`,
    `GX`, `GX2`, and `HX-TOR`), starting from `NX-OS` Release `10.5(1)F`, support
    `Dynamic Load Balancing` (`DLB`)—including flowlet-based and per-packet (packet
    spraying) load balancing. `DLB` is supported on Layer 3 physical interfaces in
    IP-routed and `VXLAN` fabrics for unicast `IPv4` and `IPv6` traffic.


    When `DLB` is enabled, egress QoS and access policies are not applied to flows
    using `DLB`. Similarly, `TX SPAN` configured on an egress interface does not capture
    `DLB` traffic. For hardware and software support details, refer to Cisco’s official
    documentation.


    Example 12-1 shows a basic configuration for enabling per-packet load balancing:


    ```

    switch(config)# hardware profile dlb

    switch(config-dlb)# dlb-interface Eth1/1

    switch(config-dlb)# dlb-interface Eth1/2

    switch(config-dlb)# mac-address aa:bb:cc:dd:ee:ff

    switch(config-dlb)# mode per-packet

    ```


    Example 12-1: Configuring Per-Packet Load Balancing Packet Spraying.


    Note: The `DLB MAC` acts as a virtual next-hop MAC address. It’s not tied to any
    specific physical interface. This decouples the MAC from the physical path, allowing
    the switch to choose a different egress port for each packet. The same `DLB MAC`
    address must be configured on all participating switches. If you do not specify
    a `DLB MAC`, the default `DLB MAC` `00:CC:CC:CC:CC:CC` is applied.


    ## References


    * [1] V. Xu, et al., “Fully Adaptive Routing Ethernet”, February 25, 2024, Internet-Draft:
    `draft-xu-lsr-fare-02`.

    * [2] Paul Congdon, Yolanda Yu, “Technologies for the Lossless Network for Data
    Centers”, March 18, 2018.

    * [3] Advait Dixit, et al., Purdue University, “On the Impact of Packet Spraying”.

    * [4] Chu Chen, et al., “HF²: RDMA Fine-Tuning”.

    * [5] Cisco Nexus 9000 Series NX-OS Guide.

    [/content]


