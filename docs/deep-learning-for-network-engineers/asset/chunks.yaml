- raw: 'This gating mechanism enables LSTM cells to selectively retain or discard
    information, allowing the network to manage long-term dependencies effectively.


    ![](main-46.jpg)


    Figure 6-1: Long Short-Term Memory Cell – Architectural Overview.


    ## LTSM cell operation


    In addition to producing input for the next layer (if one exists), the output
    (h) of the LSTM cell serves as input for the next time step via the recurrent
    connection. This process is like how neurons in a basic RNN operate. The LSTM
    cell also has a cell state (C), which is used to retain historical information
    utilizes the Constant Error Carousel (CEC) mechanism, which feeds back the cell
    state (C) into the computation process where the new cell state is calculated.
    The following sections briefly describe the processes how an LSTM cell computes
    the cell state (C), and the cell output (h), and explains the role of the gates
    in the process.


    ### Forget Gate


    The Forget Gate (FG) adjusts the extent to which historical data is preserved.
    In Figure 6-2, the cell state Ct-1 represents historical data computed by the
    identity function during a preceding time step. The cell state (C ) represents
    an LSTM cell internal state, not the LSTM cell output (h), and it is used for
    protecting historical data for gradient vanishing during the BPTT. The adjustment
    factor for Ct-1 is calculated by a neuron using the Sigmoid activation function
    within the FG.


    The neuron in the FG uses shared, input specific weight matrices for the input
    data (X1) and the input received from the preceding LSTM cell''s output (ht-1).
    These weight matrices are shared across FG neurons over all time steps, like the
    approach used in a basic Recurrent Neural Network (RNN). As described in the previous
    chapter, this sharing reduces the computational requirements for calculating weight
    adjustment values during Backpropagation Through Time (BPTT). Additionally, the
    shared weight matrices help reduce the model memory utilization by limiting the
    number of weight variables.


    In the figure, the matrix WFG1 is associated with the input received from the
    preceding time step, while the matrix UFG1 is used for the new input value X1.
    The weighted sum (WFG1 ⋅ ht-1)\+ (UFG1 ⋅ X1) is passed through the Sigmoid activation
    function, which produces the adjustment factor for the cell state value Ct-1.
    The closer the output of the sigmoid function is to the value one, the more the
    original value affects the calculation of the new value. The same applies to opposite
    direction, the closer the output of the sigmoid function is to zero, the less
    the original value affects the calculation of the new value.


    Finally, the output of the FG, referred to as XFG, is computed by multiplying
    the Sigmoid output by the cell state Ct-1.


    ![](main-47.jpg)


    Figure 6-2: Long Short-Term Memory Cell – Forget Gate.


    ### Input Gate


    The Input Gate (IG) determines to what extent the input X1 and the output ht-1
    from the preceding time step affect the new cell state Ct. For this process, the
    LSTM cell has two neurons. In Figure 6-3, the internal neuron of IG uses the Sigmoid
    function, while the Input Activation neuron leverages the ReLU function. Both
    neurons use input-specific weight matrices in the same way as the Forget Gate.
    The Input Gate neuron feeds the weighted sum (WIG1 ⋅ ht-1) + (UIG1 ⋅ X1) to the
    sigmoid function. The output determines the proportion in which new input values
    X1 and ht-1 influence the computation of the cell''s internal value. The closer
    the sigmoid function''s output is to one, the more the original value influences
    the new value. Conversely, the closer the output is to zero, the less it influences
    the new value. The Input Activation neuron feeds the weighted sum (WIA1 ⋅ ht-1)
    + (UIA1 ⋅ X1) to the ReLU function. The output is then multiplied by the output
    of the Sigmoid function, providing the result of the Input Gate. At this phase,
    the LSTM cell has computed output for both Forget Gate (XFG) and Input Gate (XIG).
    Next, the LSTM feeds these values to the Identification Function.


    ![](main-48.jpg)


    Figure 6-3: Long Short-Term Memory Cell – Input Gate.


    ### Output Gate


    The Output Gate determines whether the output of the Output Activation neuron
    (ReLU) is fully published, partially published, or left unpublished. The factor
    of the Output Gate is calculated based on the input value X1 and the output ht-1
    from the previous time step. That said, all Sigmoid neurons and the ReLU Input
    Activation function use the same inputs, and they leverage shared weight matrices.
    The input to the Output Activation neuron is the sum of the outputs from the Forget
    Gate (Xfg) and the Input Gate (Xig). In the figure, the sum is represented as
    f(x) = Xfg + Xig. The operation is computed by a neuron that uses the Identification
    function (idF). The original output of the Identification function is preserved
    as the internal cell state (C) for the next time step through the CEC (Constant
    Error Carousel) connection. The output of the Identification Function is then
    passed to the ReLU Output Activation function. This output is multiplied by the
    result of the Output Gate, producing the actual cell output h1. This value serves
    as input to the same LSTM cell in the next time step. In a multilayer model, the
    cell output is also used as input for the subsequent layer.


    ![](main-49.jpg)


    Figure 6-4: Long Short-Term Memory Cell – Output Gate.


    ## LTSM-based Recurrent Neural Network


    ### Recap of the Operation of an LSTM Cell


    The previous section introduced the construction and operation of a single Long
    Short-Term Memory (LSTM) cell. This section briefly discusses an LSTM-based Recurrent
    Neural Network (RNN). Before diving into the details, let’s recap how an individual
    LSTM cell operates with a theoretical, non-mathematical example.


    Suppose we want our model to produce the sentence: “It was cloudy, but it is raining
    now.” The first part of it refers to the past, and one of the LSTM cells has stored
    the tense “was” in its internal cell state. However, the last portion of the sentence
    refers to the present. Naturally, we want the model to forget the previous tense
    “was” and update its state to reflect the current tense “is.”


    The Forget Gate plays a role in discarding unnecessary information. In this case,
    the forget gate suppresses the word “was” by closing its gate (outputting 0).
    The Input Gate is responsible for providing a new candidate cell state, which
    in this example is the word “is.” The input gate is fully open (outputting 1)
    to allow the latest information to be introduced.


    The Identification function computes the updated cell state by summing the contributions
    of the forget gate and the input gate. This updated cell state represents the
    memory for the next time step. Additionally, the updated cell state is passed
    through an Output Activation function, which provides the cell’s output.


    The Output Gate controls how much of this activated output is shared as the public
    output. In this example, the output gate is fully open (outputting 1), allowing
    the word “is” to be published as the final output.


    ## An Overview of an LSTM-Based RNN


    Figure 6-5 illustrates an LSTM-based RNN model featuring two LSTM layers and a
    SoftMax layer. The input vectors X1 and X2, along with the cell output ht-1 from
    the previous time step, are fed into all LSTM cells in the input layer. To keep
    the figure simple, only two LSTM cells are shown per layer.


    The input vectors pass through gates, producing both the internal cell state and
    the cell output. The internal states are stored using a Constant Error Carousel
    (CEC) to be utilized in subsequent time steps. The cell output is looped back
    as an input vector for the next time step. Additionally, the cell output is passed
    to all LSTM cells in the next layer.


    Finally, the SoftMax layer generates the model''s output. Note that Figure 6-5
    depicts a single time step.


    ![](main-50.jpg)


    Figure 6-5: LSTM based RNN Layer Model.'
