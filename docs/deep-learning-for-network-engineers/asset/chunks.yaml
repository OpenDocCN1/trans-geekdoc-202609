    图 5-4 展示了 Sigmoid 激活函数的 S 曲线。它展示了函数输出（`y`）如何随输入（`z`）的变化而变化。图表说明了当输入值超过 `2.2` 或低于
    `-2.2` 时，变化率如何显著减慢。在这些阈值之外，当输入值接近 `5.5` 和 `-5.5` 时，从学习的角度来看，变化率变得可以忽略不计。这种行为可能是由于糟糕的初始权重分配策略导致的，即初始权重值过小或太大，可能导致随时反向传播（BPTT）向错误的方向调整权重。这个问题通常被称为神经元饱和。


    图中展示的另一个问题是，当输入值小于 `-5` 时，Sigmoid 激活函数的输出（`y`）实际上几乎为零。例如，当 `z = -5` 时，`y = 0.0998`，但当
    `z = -7` 时，`y` 降至仅 `0.0009`。这些“几乎为零”输出值的问题在于神经元变得“死亡”了，意味着它的输出（`y`）对模型的学习过程影响微乎其微。在
    RNN 模型中，神经元的输出在循环层作为隐藏状态（`h`）被用，接近零的值会导致神经元“忘记”之前时间步的输入。


    ![](img/main-44.jpg)


    图 5-4：S 曲线 Sigmoid 函数的问题


    图 5-5 展示了一个具有五个时间步的假设 RNN。这个示例说明了从后续时间步的角度来看，由于例如，如果时间步 1 的 Sigmoid 激活函数输出（`h1`）为
    `0.0007`，那么时间步 2 的对应值（`h2`）与 `h1` 为零的情况相比仅增加 `0.0008`。


    同样，在具有 1000 个时间步的 RNN 中，学习过程在随时反向传播（BPTT）期间容易梯度消失问题。随着梯度跨越许多时间步反向传播，由于反复乘以较小的值（例如
    Sigmoid 激活函数的导数），梯度通常会指数级缩小。这可能导致学习曲线进入平台期或下降，导致权重更新不佳和学习效果欠佳。在严重情况下，学习过程可能会实际上停止，阻止模型达到预期的性能。


    ![](img/main-45.jpg)


    图 5-5：RNN 与“被遗忘”的历史。


    在使用循环神经网络（RNN）的数据并行策略时，输入数据批次被分布在多个 GPU 上，每个 GPU 在其分配的批次上独立运行相同的模型。在随时反向传播（BPTT）过程中，每个
    GPU 为其部分数据局部计算梯度。这些梯度然后在所有 GPU 之间同步（通常通过取平均值），以确保共享模型参数的一致更新。


    由于权重矩阵是共享模型的一部分，在每个训练步骤之后更新的权重在所有 GPU 上保持同步。这种同步确保了所有 GPU 在随后的正向和反向传播中使用相同的模型。然而，由于
    RNN 的顺序性质，BPTT 必须逐步计算梯度，这在处理长序列时仍然会限制扩展性。尽管如此，数据并行通过分发负载和减少每个 GPU 的计算负担来加速训练。


    我们也可以为 RNN 实现模型并行化策略，该策略在正向传播期间同步激活值，并在反向传播期间同步梯度。


    由于同步过程，并行策略会显著影响网络利用率，具体取决于我们同步的内容和速率。接下来的几章将重点介绍不同的并行策略。


