    All ranks then use this unique ID to initialize their local NCCL communicators,
    ensuring they join the same communication group. This distribution phase is critical:
    the NCCL Unique ID acts as a bootstrap mechanism, allowing all GPU processes to
    join the same communication group and participate in collective operations like
    all-reduce and broadcast.


    ![](main-142.jpg)


    Figure 14-3: Redistribution NCCL unique Id over TCP Socket.


    ![](main-143.jpg)![](main-144.jpg)


    # NCCL Broadcast Collective and Model Parameter Synchronization


    At this point, each process already has a local copy of the model, and all GPUs
    are ready to begin synchronized training. The first step is to ensure that every
    GPU starts with identical model parameters. NCCL handles this automatically, using
    the chosen communication topology.


    After the master process (rank 0, running on GPU 0 of Host A) shares the NCCL
    Unique ID with all other processes over TCP sockets, the NCCL library builds a
    tree topology. This topology is used for sending model parameters to all other
    GPUs using the `Broadcast` collective. Figure 14-4 illustrates how the master
    process, running on GPU 0 of Host A, distributes its model parameters to all other
    processes. GPUs with global rank IDs 1-3 are on the same host as the master process,
    so NCCL uses direct memory copy over high-speed NVLink. These transfers happen
    without involving the CPU or operating system, and no Queue Pairs are needed,
    making intra-node communication extremely fast and efficient.


    If GPUs are located on different hosts, NCCL sets up Queue Pairs (QPs) to create
    fast, direct data paths between the master process and remote processes. These
    connections use the backend network, which in our example is a routed Layer 3
    Clos Fabric (the network layout is excluded for simplicity).


    ![](main-145.jpg)


    Figure 14-4: Model Parameters Distribution by Master Rank 0.


    # Gradient Synchronization Using AllReduce Collective


    After synchronizing model parameters, the first iteration of the forward pass
    begins simultaneously on all GPUs in the cluster. During the forward pass, GPU-specific
    mini-batches are processed through all layers of the model by performing matrix
    multiplications followed by activation function operations at each layer. After
    computing the model output `y`, each GPU starts the backward pass. Let’s assume
    the last layer has 1024 parameters and each GPU computes gradients for all 1024
    parameters. These gradients are stored in a reserved memory region called a `bucket`.


    Next, each GPU divides its bucket into four chunks, each containing 256 gradients
    (since 1024 parameters / 4 GPUs = 256 gradients). At this point, every GPU has
    four chunks labeled `A–D`, each with 256 gradients. When using the `AllReduce`
    collective in a unidirectional ring topology, the operation is implemented as
    `ReduceScatter` followed by `AllGather`.


    In our example, shown in figure 14-5, we have two nodes (Host A and Host B), each
    with four GPUs. Every GPU has computed 1024 gradients and organized them into
    four chunks (`A–D`) in `VRAM`. In this example, GPU 0 (with global rank 0) is
    responsible for averaging chunk `A`, rank 1 (Blue GPU 1) for chunk `B`, rank 2
    (Green GPU 0) for chunk `C`, and rank 3 (Yellow GPU 1) for chunk `D`. Intra-node
    GPU connections use high-speed NVLink, while inter-node connections use RoCEv2.


    ![](main-146.jpg)


    Figure 14-5: AllReduce in Ring Topology with ReduceScatter and AllReduce Operations.


    ## ReduceScatter: First Iteration


    In Figure 14-6, the ring topology from Figure 14-5 is still in use, but the GPUs
    are laid out in a linear sequence for easier visualization of the `AllReduce`
    data flow. During the `ReduceScatter` phase of `AllReduce` operation, each rank
    sends the chunk it is responsible for to the next rank in the ring:


    - `Rank 0` sends `A0` to `Rank 1`

    - `Rank 1` sends `B1` to `Rank 2`

    - `Rank 2` sends `C2` to `Rank 3`

    - `Rank 3` sends `D3` to `Rank 0`


    Each of these chunks contains gradients for a specific portion of the parameter
    space, and each rank is responsible for reducing (i.e., summing) that portion
    across all GPUs as data circulates around the ring.


    ![](main-147.jpg)[](main-148.jpg)[](main-149.png)[](main-150.jpg)


    Figure 14-6: ReduceScatter: The First Iteration.


    Figure 14-7 shows the status of gradient synchronization after the first send
    iteration in the `ReduceScatter` phase. At this point, each GPU has sent its assigned
    chunk to the next GPU in the ring topology and has also received one chunk from
    its neighbor:


    - `Rank 0` has received `D3` from `Rank 3`

    - `Rank 1` has received `A0` from `Rank 0`

    - `Rank 2` has received `B1` from `Rank 1`

    - `Rank 3` has received `C2` from `Rank 2`


    After this first send (iteration 1 of the `ReduceScatter` phase), each GPU still
    holds three original chunks in local memory plus one partially reduced chunk.
    Each GPU adds the received chunk to its local version of the same chunk. For example,
    `rank 0` adds `D3` to `D0` (`chunk D = D0 + D3`). This is only the first reduction.
    To complete the full reduction for its assigned chunk, each GPU must receive and
    sum the corresponding chunks from the remaining GPUs over the next three iterations.
    By the end of the `ReduceScatter` phase (after three iterations in a 4-GPU ring),
    each GPU holds exactly one fully reduced chunk, though not necessarily the one
    it originally.


    ![](main-151.jpg)


    Figure 14-7: ReduceScatter: Chunks After the First Iteration.


    ## ReduceScatter: Second Iteration


    The figure 14-8 shows the second iteration of the `ReduceScatter` phase:


    - `Rank 0` sends the partially averaged chunk `D` (Sum of `D3 + D0`) to `Rank
    1`

    - `Rank 1` sends the partially averaged chunk `A` (Sum of `A0 + A1`) to `Rank
    2`

    - `Rank 2` sends the partially averaged chunk `B` (Sum of `B1 + B2`) to `Rank
    3`

    - `Rank 3` sends the partially averaged chunk `C` (Sum of `C2 + C3`) to `Rank
    0`


    ![](main-152.jpg)[](main-153.jpg)[](main-154.jpg)[](main-155.jpg)[](main-156.jpg)


    Figure 14-8: ReduceScatter: The Second Iteration.


    ![](main-157.jpg)


    After the second `ReduceScatter` iteration, each rank now holds:


    - One chunk that has been partially reduced twice (local chunk + two remote chunks)

    - Two original chunks that have not yet been involved in any communication

    - One chunk that was sent out during this iteration


    Here’s the specific status per rank:


    **Rank 0:**

    - Holds partially reduced chunk `C = C2 + C3 + C0` (just received from `Rank 3`
    and added to local `C0`)

    - Still has original chunks `A0` and `B0`

    - Sent out chunk `D = D3 + D0`


    **Rank 1:**

    - Holds partially reduced chunk `D = D3 + D0 + D1`

    - Still has original chunks `B1` and `C1`

    - Sent out chunk `A = A0 + A1`


    **Rank 2:**

    - Holds partially reduced chunk `A = A0 + A1 + A2`

    - Still has original chunks `C2` and `D2`

    - Sent out chunk `B = B1 + B2`


