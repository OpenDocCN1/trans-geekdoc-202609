    However, a port-based layout becomes extremely messy when describing larger implementations.
    Therefore, the common practice is to reference the rail number instead of individual
    switch interface identifiers.


    ![](main-130.jpg)


    Figure 13-6: Interface Block to Rail Mapping.


    |  ||  ||  ||  ||  ||  ||  ||  |


    | --- | --- | --- | --- | --- | --- | --- | --- |


    |  ||  ||  ||  ||  ||  ||  ||  |


    Figure 13-7 provides an example showing how each NIC is now connected to a rail
    instead of being directly mapped to a specific physical interface. In this approach,
    each rail represents a logical group of physical interfaces, simplifying the overall
    design and making larger deployments easier to visualize and document.


    In our example "Host-Segment" (an unofficial name), we have four hosts, each equipped
    with eight GPUs — 32 GPUs in total. Each GPU has a dedicated 200 Gbps dual-port
    NIC. All GPUs are connected to two rail switches over a 2 × 200 Gbps MLAG, providing
    400 Gbps of transmission speed per GPU.


    ![](main-131.jpg)


    Figure 13-7: Example Figure of Connecting 32 Dual-Port NICs 8 Rails on 2 Switches.


    Figure 13-8 shows how multiple Host-Segments can be connected. The figure illustrates
    a simplified two-tier, three-stage Clos fabric topology, where full-mesh Layer
    3 links are established between the four Rail switches (leaf switches) and the
    Spine switches. The figure also presents the link capacity calculations. Each
    Rail switch has 32 × 100 Gbps connections to the hosts, providing a total downlink
    capacity of 3.2 Tbps.


    Since oversubscription is generally not preferred in GPU clusters — to maintain
    high performance and low latency — the uplink capacity from each Rail switch to
    the Spine layer must also match 3.2 Tbps. To achieve this, each Rail switch must
    have uplinks capable of an aggregate transfer rate of 3.2 Tbps. This can be implemented
    either by using native 800 Gbps interfaces or by forming a logical Layer 3 port
    channel composed of two 400 Gbps links per Spine connection. Additionally, Inter-Switch
    capacity can be increased by adding more switches in the Spine layer. This is
    one of the benefits of a Clos fabric: the capacity can be scaled without the need
    to replace 400 Gbps interfaces with 800 Gbps interfaces, for example.


    This topology forms a Pod and supports 64 GPUs in total and provides a non-blocking
    architecture, ensuring optimal east-west traffic performance between GPUs across
    different Host-Segments.


    In network design, the terms "two-tier" and "three-stage" Clos fabric describe
    different aspects of the same overall topology. "Two-tier" focuses on the physical
    switch layers (typically Leaf and Spine) and describes the depth of the topology,
    offering a hierarchy view of the architecture. Essentially, it''s concerned with
    how many switching layers are present. On the other hand, three-stage Clos describes
    the logical data path a packet follows when moving between endpoints: Leaf–Spine–Leaf.
    It focuses on how data moves through the network and the stages traffic flows
    through. Therefore, while a two-tier topology refers to the physical switch structure,
    a three-stage Clos describes the logical path taken by packets, which crosses
    through three stages: Leaf, Spine, and Leaf. These two perspectives are complementary,
    not contradictory, and together they provide a complete view of the Clos network
    design.


    ![](main-132.jpg)


    Figure 13-8: AI fabric – Pod Design.


    Figure 13-9 extends the previous example by adding a second 64-GPU Pod, creating
    a larger multi-Pod architecture. To interconnect the two Pods, four Super-Spine
    switches are introduced, forming an additional aggregation layer above the Spine
    layer. Each Pod retains its internal two-tier Clos fabric structure, with Rail
    switches fully meshed to the Spine switches as described earlier. The Spine switches
    from both Pods are then connected northbound to the Super-Spine switches over
    Layer 3 links.


    Due to the introduction of the Super-Spine layer, the complete system now forms
    a three-tier, five-stage Clos topology. This design supports scalable expansion
    while maintaining predictable latency and high bandwidth between GPUs across different
    Pods. Like the Rail-to-Spine design, maintaining a non-blocking architecture between
    the Spine and SuperSpine layers is critical. Each Spine switch aggregates 3.2
    Tbps of traffic from its Rail switches; therefore, the uplink capacity from each
    Spine to the Super-Spine layer must also be 3.2 Tbps.


    This can be achieved either by using native 800 Gbps links or logical Layer 3
    port channels composed of two 400 Gbps links per Super-Spine connection. All Spine
    switches are fully meshed with all Super-Spine switches to ensure high availability
    and consistent bandwidth. This architecture enables seamless east-west traffic
    between GPUs located in different Pods, ensuring that inter-Pod communication
    maintains the same non-blocking performance as intra-Pod traffic.


    ![](main-133.jpg)


    Figure 13-9: AI fabric – Multi-Pod Design.


    ### Rail Desings in GPU Fabric


    When building a scalable, resilient GPU network fabric, the design of the rail
    layer, the portion of the topology that interconnects GPU servers via Top-of-Rack
    (ToR) switches, plays a critical role. This section explores three different models:
    Multi-rail-per-switch, Dual-rail-per-switch, and Single-rail-per-switch. All three
    support dual-NIC-per-GPU designs, allowing each GPU to connect redundantly to
    two separate switches, thereby removing the Rail switch as a single point of failure.


    #### Multi-Rail-per-Switch


    In this model, multiple small subnets and VLANs are configured per switch, with
    each logical rail mapped to a subset of physical interfaces. For example, a single
    48-port switch might host four or eight logical rails using distinct Layer 2 and
    Layer 3 domains. Because all logical rails share the same physical device, isolation
    is logical. As a result, a hardware or software failure in the switch can impact
    all rails and their associated GPUs, creating a large failure domain. This model
    is not part of NVIDIA’s validated Scalable Unit (SU) architecture but may suit
    test environments,


    development clusters, or small-scale GPU fabrics where hardware cost efficiency
    is a higher priority than strict fault isolation. From a CapEx perspective, multi-rail-per-switch
    is the most economical, requiring fewer switches.


    Figure 13-10 illustrates the multi-rail-per-switch architecture, where each rail
    is implemented as a separate VLAN-subnet pair mapped to a subset of switch ports.
    In the figure, interfaces 1–4 are assigned to subnet 10.0.1.0/28 and VLAN 101,
    while interfaces 5–8 are mapped to subnet 10.0.2.0/28 and VLAN 102. Each VLAN
    maintains its own MAC address table, learning GPU NIC MACs through ingress traffic.
    Although not shown in the figure, the Rail switch acts as the default gateway
    for all eight VLANs. The figure also illustrates the BGP process when a Clos architecture
    with a spine layer is used to connect rail switches. All directly connected subnets
    are installed into the local Routing Information Base (RIB) as connected routes.
    These routes are then imported into the BGP Loc-RIB. Next, the routes pass through
    the BGP output policy engine, where they are aggregated into a single summary
    route: 10.0.1.0/24. This aggregate is placed into the BGP Adj-RIB-Out. When the
    BGP Update message is sent to a peer, the NEXT\_HOP attribute is set accordingly.


    ![](main-134.jpg)


    Figure 13-10: Multi-Rail per Switch.


    #### Dual-Rail-per-Switch


    While dual-rail-per-switch improves manageability and is easier to scale, it shares
    the same limitation: both logical rails reside within a single physical switch,
    so the failure domain remains large. A single switch failure or misconfiguration
    affects both rails and all associated GPUs.'
