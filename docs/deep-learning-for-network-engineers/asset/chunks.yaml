- raw: 'As pointed out in the Introduction, the word embedding vector is not used
    as input to the first decoder. Instead, it is multiplied by pretrained Query,
    Key, and Value weight matrices. The result of this matrix multiplication, dot
    product, produces the Query, Key, and Value vectors, which are use as inputs,
    and are processed through the Transformer. Figure 7–9 show the basic workflow
    of this process.


    ![](main-60.jpg)


    Figure 7-9: Query, Key, and Value Vectors.


    Let’s take a closer look at the process using numbers. After tokenizing the input
    words and applying positional encoding, we obtain a final 5dimensional word matrix.
    To reduce computation cycles, the process reduces the dimension of the Query vector
    from 5 to 3. Because we want the Query vector to be three-dimensional, we use
    three 5-dimensional column vectors, each of which is multiplied by the word vector.


    ![](main-61.jpg)


    Figure 7-10: Calculating the Query Vector.


    Figure 7–11 depicts the calculation process, where each component of the word
    vector is multiplied by its corresponding component in the Query weight matrix.
    The weighted sum of these results forms a threedimensional Query vector. The Key
    and Value vectors are calculated using the same method. The same Query, Key, and
    Value (Q, K, V) weight matrices are used across all words (tokens) within a single
    self-attention layer in a Transformer model. This ensures that each token is processed
    in the same way, maintaining consistency in the attention computations. However,
    each decoder layer in the Transformer has its own dedicated Q, K, and V weight
    matrices, meaning that every layer learns different transformations of the input
    tokens, allowing deeper layers to capture more abstract representations.


    ![](main-62.jpg)


    Figure 7-11: Calculating the Query Vector.


    ### Attention Layer


    Figure 7-12 depicts what happens in the first three components of the Attention
    layer after calculating the Query, Key, and Value vectors. In this example, we
    focus on the word “clear”, and try to predict the next word. Its Query vector
    is multiplied by its own Key vector as well as by all the Key vectors generated
    for the preceding words. Each multiplication produces its own score. Note that
    the score values shown in the figure are theoretical and are not derived from
    the actual Qv × Kv matrix multiplication; however, the remaining values are based
    on these calculations. Additionally, in our example, we use one-dimensional values
    (instead of actual vectors) to keep the figures and calculations simple. In reality,
    these are n-dimensional vectors.


    After the Qv × Kv matrix multiplication, the resulting scores are divided by the
    square root of the vector depth, yielding logits, i.e., the input values for the
    softmax function. The softmax function then computes the exponential of each logit
    (using Euler’s number, approximately 2.71828) and divides each result by the sum
    of all exponentials. For example, the value 3.16, corresponding to the first word,
    is divided by 482.22, resulting in a probability of 0.007. Note that the sum of
    the probabilities is 1.0. Softmax ensures that the attention scores sum to 1,
    making them interpretable as probabilities and helping the model decide which
    input tokens to focus on when generating an output. In our example, the token
    for the word “clear” has the highest probability at this stage. The word “decided”
    has the second highest probability score (0.210), which indicates that the semantics
    of “clear”, which has the highest probability score (0.665), can be interpreted
    as an verb answering the question: “What she decided to do?


    ![](main-63.jpg)


    Figure 7-12: Attention Layer, the First Three Steps.


    Next, the SoftMax probabilities are multiplied by each token''s Value vector (matrix
    multiplication). The resulting vectors are then summed, producing the Context
    vector for the token associated with the word “clear.” Note that the components
    of the Value vectors are example values and are not derived from actual computations.


    ![](main-64.jpg)


    Figure 7-13: Attention Layer, the Fourth Step.


    ### Add & Normalization


    As the final step, the Word vector, which includes positional encoding, is added
    to the context vector via a Residual Connection. The result is then passed through
    a normalization process, where the vector’s components are summed and divided
    by the vector’s dimension, yielding the mean (µ). This mean value is then used
    for standard deviation calculation: the mean is subtracted from each of the three
    vector components, and the results are squared. These squared values are then
    summed, divided by three (the vector’s dimension), and the square root of this
    result gives the final output vector \[1.40, -0.55, -0.87\] of the Add & Normalize
    layer.


    ![](main-65.jpg)


    Figure 7-14: Add & Normalize Layer – Residual Connection and Layer Normalization.


    ### Feed Forward Neural Network


    Within the decoder module, the feedforward neural network uses the output vector
    from the Add & Normalize layer as its input. In our example, the FFNN have one
    neuron in input layer for each component of the vector. This layer simply passes
    the input values to the hidden layer, where each neuron first calculates a weighted
    sum and then applies the ReLU activation function. In our example, the hidden
    layer contains nine neurons (three times the number of input neurons). The output
    from the hidden layer is then fed to the output layer, where the neurons again
    compute a weighted sum and apply the ReLU activation function. Note that in transformer-based
    decoders, the FFNN is applied to each token individually. This means that each
    token-related output from the attention layer is processed separately by the same
    FFNN model with shared weights, ensuring a consistent transformation of each token''s
    representation regardless of its position in the sequence.


    ![](main-66.jpg)


    Figure 7-15: Fully Connected Feed Forward Neural Network (FFNN).


    The final decoder output is computed in the Add & Normalize layer, similarly as
    Add & Normalize after the attention layer. This produces the decoder output, which
    is used as the input for the next decoder module.


    ![](main-67.jpg)


    Figure 7-16: Add & Normalize Layer – Residual Connection and Layer Normalization.


    ### Next Word Probability Computation – SoftMax Function


    The output of the last decoder module does not directly represent the next word.
    Instead, it must be transformed into a probability distribution over the entire
    vocabulary. First, the decoder output is passed through a weight matrix that maps
    it to a new vector, where each element corresponds to a word in the vocabulary.


    For example, in Figure 7-17 the vocabulary consists of 12 words. These words are
    tokenized and linked to their corresponding word embeddings vector. That said,
    the word embedding matrix serves as a weight matrix.


    ![](main-68.jpg)


    Figure 7-17: Hidden State Vector and Word Embedding Matrix.


    Figure 7-18 illustrates how the decoder output vector (i.e., the hidden state
    h) is multiplied by all word embedding vectors to produce a new vector of logits.


    |  ||  ||  ||  ||  |


    | --- | --- | --- | --- | --- |


    |  ||  ||  ||  ||  |


    |  ||  ||  ||  ||  |


