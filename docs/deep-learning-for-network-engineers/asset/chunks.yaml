    \n# 第 12 章：基于流、流单元（Flowlet）和包的负载均衡\n\n## 引言\n尽管 BGP 支持传统的基于流层等成本路径 (`ECMP`) 流量负载均衡方法，但它并不适用于基于\
    \ RoCEv2 的 AI 后端网络。这是因为 GPU 到 GPU 之间的通信会产生巨大的巨型流（elephant flows），支持 RDMA 的网卡以线速传输这些流。这些流很容易导致后端网络出现拥塞。\n\
    \n在 `ECMP` 中，单个流的所有数据包遵循相同的路径。如果该路径发生拥塞，`ECMP` 不会调整或重新路由流量。这导致网络中的带宽利用率不均。某些链路过载，而其他链路则处于闲置状态。在多个高带宽流同时发生的\
    \ AI 工作负载中，这种不平衡会降低性能。\n\n深度学习模型严重依赖于 `all-reduce`、`all-gather` 和 `broadcast`\
    \ 等集合操作。这些操作在 GPU 之间产生密集的流量模式，且通常以每秒太比特的速度运行。如果这些流没有均匀分布，单一拥塞路径就会减慢整个训练任务。\n\n\
    本章介绍了两种传统的基于层 3 `ECMP` 的流负载均衡的替代方法：1) 基于自适应路由的流单元负载均衡，以及 2) 基于包喷洒（Packet Spraying）的包负载均衡。两者旨在改进基于\
    \ RoCEv2 的 AI 后端网络的流量分布，传统的基于流的路由往往会导致拥塞和链路利用率不足。这些高级方法旨在更高效地处理 AI 工作负载的独特流量模式。\n\
    \n## RDMA WRITE 操作\n在探索负载均衡解决方案之前，让我们先来看一个 RDMA WRITE 内存拷贝操作如何工作的简化示例。在图 12-1\
    \ 中，我们有两个 GPU 服务器：Host 1 和 Host 2，每个服务器有一个 GPU。此时，内存已经分配并注册，双方都创建了队列对 (`QP`)，因此数据传输可以开始。\n\
    \n在 Host 1 的 GPU-0 上，梯度存储在绿色、橙色和蓝色标记的内存区域。每个颜色区域代表本地内存的一部分，将被写入 Host 2 的 GPU-0。为了传输数据，Host\
    \ 1 上的 RDMA 网卡将写操作拆分为三个流单元（绿色、橙色和蓝色）。它不是将整个数据块作为单个连续流发送，而是将每个流单元视为同一个 RDMA 写操作的一个段。\n\
    \n### RDMA Write First（首次写入）\n第一条消息的载荷中带有 RDMA 扩展传输头部 (`RETH`)。该头部告诉接收端 RDMA 网卡，入站数据应该写入远程内存的哪个位置。在我们的示例中，来自\
    \ Host 1 GPU-0 内存块 1B 的数据写入 Host 2 GPU-0 的内存块 2C。\n\n`RETH` 包含 `R_Key`，它提供了写入远程内存区域的权限。它还包含了正在传输的数据长度以及\
    \ Host 2 上目标内存位置的虚拟地址。\n\nInfiniBand 基础传输头部 (`IBTH`) 中的操作码被设置为 `RDMA Write First`，表示这是序列中的第一个消息。`IBTH`\
    \ 还描述了分区密钥（接口标识符）、目标队列对编号以及数据包序列 (`PSN`)，后者有助于确保数据包按正确顺序进行处理。\n\n当第一个数据包到达 Host\
    \ 2 时，RDMA 网卡使用 `RETH` 头部中的虚拟地址信息将载荷直接写入内存块 2C。\n\n![](img/main-115.jpg)\n\n图\
    \ 12-1：RDMA WRITE First。\n\n### RDMA Write Middle（中间写入）\n第二条消息的操作码为 `RDMA Write\
    \ Middle`，`PSN` 为 2，这告诉接收者该数据包在 `PSN` 为 1 的第一个包之后。该流单元的载荷紧接在上一个块写入 Host 2 的内存块\
    \ 2D。RDMA 网卡确保根据 `PSN` 维持顺序，得益于第一个数据包的原始偏移量，它确切知道将数据放在哪里。\n\n![](img/main-116.jpg)\n\
    \n图 12-2：RDMA WRITE Middle。\n\n### RDMA Write Last（最后写入）\n第三条消息的操作码为 `RDMA Write\
    \ Last`，表示这是序列中的最后消息。其 `PSN` 为 3，紧接在 `PSN` 2 之后。该数据包中的载荷被写入紧随 2D 之后的内存块 2E。\n\n\
    ![](img/main-117.jpg)\n\n图 12-3：RDMA WRITE Last。\n\n在多包 RDMA 写操作中，每个流单元代表从源 GPU\
    \ 传输到目标 GPU 的连续数据块。数据包内的数据必须按顺序到达，因为只有第一个数据包在 RDMA 扩展传输头部 (`RETH`) 中包含了完整的地址信息。该头部告诉接收者数据应该写入内存的哪个位置。\n\
    \n标记为 `RDMA Write Middle` 和 `RDMA Write Last` 的数据包取决于此信息，并且必须遵循数据包序列 (`PSNs`)\
    \ 定义的顺序。如果数据包乱序交付，接收端 RDMA 网卡无法立即处理它们。相反，它必须将其保存在内存中，等待缺失的早期数据包到达。这种缓冲增加了内存使用和处理开销。在高速环境中，这会导致性能下降甚至丢包，特别是当缓冲区在重负载下填满时。\n\
    \n## 层 3 ECMP 的流负载均衡\n图 12-4 展示了在 AI 架构后端网络中使用基于流的负载均衡时的问题。在我们的示例中，有四台主机，每台主机配备两个\
    \ GPU：GPU-1 和 GPU-2。连接 GPU-1 的 RDMA 网卡连接到交换机 Rail-1，连接 GPU-2 的 RDMA 网卡连接到 Rail-2。Rail-1\
    \ 和 Rail-2 网卡之间的流量通过 Spine-1 或 Spine-2 转发。\n\n我们使用基础的数据并行策略，将训练数据集划分为小批并分布在所有\
    \ 8 个 GPU 上。为了保持示例简单，图 12-4 只显示了从 Host 1、2、3 上的 GPU-1 到 Host 4 上 GPU-2 的 `all-reduce`\
    \ 梯度同步流。在实际训练中，所有 GPU 之间会进行全网状 all-reduce 操作。\n\n作为起点，最左侧三个主机的 GPU-1 开始 RDMA 过程，将数据从其内存拷贝到\
    \ Host 4 GPU-2 的内存中。这些 GPU-1 都连接到 Rail-1。RDMA 网卡并没有发送一个大流，而是将数据拆分为流单元（即大传输中的小突发）。这些流单元到达\
    \ Rail-1 交换机，五元组 L3 ECMP 哈希算法不幸地为三个流选择了相同的上行链路。\n\n"
