    ### ReLU Activation Function


    A lighter alternative to the Sigmoid activation function is ReLU (Rectified Linear
    Unit). The ReLU activation function is non-linear for values less than or equal
    to zero and linear for values greater than zero. This means that if the weighted
    sum z ≤ 0, the output is zero. If z > 0, the output is equal to z.


    From a computational perspective, ReLU requires fewer CPU cycles than the Sigmoid
    function. Figure 1-6 illustrates how z = 4.8 is processed by ReLU, resulting in
    an output value of 𝑦𝑦^ = 4.8. The figure also shows two common notations for ReLU.
    The first notation states:


    *   •    If z > 0, return z.


    *   •    If z ≤ 0, return 0.


    The second notation, written as MAX(0,z), simply means selecting the greater value
    between 0 and z.


    ![](main-9.jpg)


    Figure 1-6: Artificial Neuron with a ReLU Activation Function.


    ## Network Impact


    A single artificial neuron is the smallest unit of a neural network. The size
    of the neuron depends on its connections to input nodes. Every connection has
    an associated weight parameter, which is typically a 32-bit value. In our example,
    with 2 connections and bias, the size of the neuron is 3 x 32 bits = 96 bits.


    Although we haven’t defined the size of the input in this example, let’s assume
    that each input (x) is an 8-bit value, giving us 2 x 8 bits = 16 bits for the
    input data. Thus, our single neuron "model" requires 96 bits for the weights plus
    16 bits for the input data, totaling 112 bits of memory. This is small enough
    to not require parallelization. Besides, the weight parameters and input values,
    the result of weighted sum and the neuron output must be stored for processing.


    However, if the memory requirement of the neural network model combined with the
    input data exceeds the memory capacity of a GPU, a parallelization strategy is
    needed. The data can be split across multiple GPUs within a single server, with
    synchronization happening over highspeed NVLink. If the job must be divided between
    multiple GPU servers, synchronization occurs over the backend network, which must
    provide lossless, high-speed packet forwarding.


    Parallelization strategies will be discussed in the next chapter, which introduces
    a Feedforward Neural Network using the Backpropagation algorithm, and in later
    chapters dedicated to Parallelization (Chapter 8).


    ## Summary


    Deep Learning leverages Neural Networks, which consist of artificial neurons.
    An artificial neuron mimics the structure and operation of a biological neuron.
    Input data is fed to the neuron through connections, each with its own weight
    parameter. The neuron uses these weights to calculate a weighted sum of the inputs,
    known as the pre-activation value. This result is then passed through an activation
    function, which provides the post-activation value, or the actual output of the
    neuron. The activation functions discussed in this chapter are the non-linear
    ReLU (Rectified Linear Unit) and logistic Sigmoid functions.


