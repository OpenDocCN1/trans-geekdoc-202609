    # 第 7 章：大语言模型 (LLM)


    ## 引言


    本章介绍了基于 Transformer 的大模型（LLMs）的基本操作，重点关注基础概念，而非任何特定模型，例如 OpenAI 的 GPT（生成式预训练 Transformer）。


    本章从分词（tokenization）和词嵌入（word embeddings）开始，将输入单词转换为模型可以处理的格式。接下来，解释了 Transformer
    组件如何利用解码器架构进行输入处理和预测。


    本章有两个主要目标。首先，解释了 LLM 如何理解单词的上下文。例如，单词“clear”可以根据上下文作为动词（请清理桌子。）也可以作为形容词（天空很晴明。）。其次，讨论了由于模型规模巨大、海量数据集以及涉及的计算复杂性，为什么
    LLM 需要在数百甚至数千个 GPU 上进行并行化处理。


    ## 分词器与词嵌入矩阵


    作为第一步，我们将词汇表导入模型。训练大语言模型（LLMs）使用的词汇表通常由通用术语和领域特定术语混合组成，包括基础词汇、技术术语、学术和正式语言、习语、文化引用以及同义词和反义词。每个单词和字符都存储在词汇查找表中，并分配一个唯一的标记（token）。这个过程被称为分词。


    许多 LLM 使用字节对编码（BPE），它将单词分为子词单元。例如，“unhappiness”一词可能被拆分为“un”、“happi” 和“ness”。BPE
    被广泛使用是因为它有效地平衡了词汇大小和分词效率。在我们的示例中，我们使用完整的单词。


    图 7-1 展示了词汇中的单词与其对应的标记之间的关系。标记值从 2 开始，因为 0 留给填充（padding），1 留给未知单词。


    每个标记代表一个单词，通过词嵌入查找表映射到向量。这些向量的集合形成了词嵌入矩阵。向量的维度决定了它能编码多少上下文信息。


    例如，考虑单词“clear”。二维向量可以将其区分为形容词或动词，但缺乏进一步的上下文。通过增加维度，模型可以捕捉更多上下文并更好地理解单词的意思。在句子“The
    sky was clear”中，“The sky was”暗示“clear”是一个形容词。然而，如果我们把句子改为“She decided to clear
    the backyard of junk，”，“clear”现在是一个动词。更多的维度允许模型更有效地利用周围单词进行预测词预测。例如，GPT-3 使用 12288
    维向量。考虑到 GPT-3 使用的 50000 个词汇表大小，词嵌入矩阵的维度为 12288 × 50000，产生了 614,400,000 个参数。


    上下文大小定义为向量的序列长度，决定了模型在预测下一个单词时会考虑多少先前的单词。在 GPT-3 中，上下文大小为 2048 个标记。


    ![](img/main-52.jpg)


    图 7-1：分词与词嵌入矩阵。


    ### 词嵌入


    作为第一步，当我们将输入单词输入自然语言处理（NLP）模型时，必须将它们转换为模型可以理解的格式。这是一个两步过程：


    - **分词**：每个单词从词汇表中被分配一个相应的标记（token）。

    - **词嵌入**：然后将这些标记 ID 通过词嵌入查找表映射到向量。


