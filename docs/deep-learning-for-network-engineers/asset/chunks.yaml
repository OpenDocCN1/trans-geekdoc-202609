    Model Parallelism is used when a neural network model is too large to fit into
    the memory of a single GPU. In this approach, different layers of the model are
    assigned to different GPUs. Each GPU is responsible for executing the computations,
    such as matrix multiplications and activation functions, associated with its designated
    layers. This allows the model to be trained across multiple GPUs without requiring
    the entire model to be loaded into each one.


    Pipeline Parallelism, in turn, is a common implementation of model parallelism,
    further optimizes training by dividing each training batch into smaller micro-batches.
    These micro-batches are processed in a pipelined manner across the GPUs. While
    one GPU is working on a forward pass for one micro-batch, another GPU can start
    processing the next micro-batch, thereby increasing hardware utilization and throughput.


    ### 1st. Time Step — Active GPUs: 25% - Idle GPUs: 1a, 0b, 1b


    In Figure 8-3, we have two GPU nodes, Host A and Host B, each equipped with two
    GPUs. The first hidden layer is initialized on `GPU 0a`, while the second hidden
    layer runs on `GPU 1a`. The third hidden layer and the output layer are placed
    on Host B, on `GPU 0b` and `GPU 1b`, respectively. This setup enables a layer-wise
    model parallelism strategy across four GPUs.


    In this example, four mini-batches are processed sequentially by `GPU 0a` on Host
    A. At time step `t₁`, `GPU 0a` performs a matrix multiplication and applies an
    activation function to produce the first intermediate output, `y₁`. This result
    is stored in its local VRAM and then transferred to the VRAM of `GPU 1a` using
    Direct Memory Access (`DMA`) over a high-speed `NVLink` connection.


    At this stage, the overall cluster GPU utilization is only 25%, since only `GPU
    0a` is actively computing. Although data is being copied to `GPU 1a`, that GPU
    is not yet active because the `DMA` transfer bypasses the GPU''s.


    ![](main-72.jpg)


    Figure 8-3: Model Parallelism with Pipeline Parallelism – Time Step 1.


    ### 2nd. Time Step — Active GPUs: 50% - Idle GPUs: 0b, 1b


    At time step `t₂`, `GPU 0a` begins processing the second mini-batch by performing
    matrix multiplication and applying the activation function to produce output `y₂`.
    This output is stored in its local VRAM and then transferred to `GPU 1a` via `DMA`
    over `NVLink`, just like in the previous step.


    Meanwhile, `GPU 1a`, which received `y₁` during time step `t₁`, now becomes active.
    It reads `y₁` from its VRAM, processes it through the second hidden layer, and
    produces an output. This result is then transferred to remote `GPU 0b`, which
    holds the third hidden layer. The transfer occurs over the backend Ethernet network
    using `RoCEv2` (`RDMA` over Converged Ethernet version 2).


    At this stage, `GPUs 0a` and `GPU 1a` are actively computing, and `GPU 0b` is
    receiving data via `RDMA`. However, `GPU 0b` is not yet actively computing.


    ![](main-73.jpg)


    Figure 8-4: Model Parallelism with Pipeline Parallelism – Time Step 2.


    ### 3rd. Time Step— Active GPUs: 75% - Idle GPUs: 1b


    At time step `t₃`, the pipeline continues to fill. `GPU 0a` begins processing
    the third mini-batch `X3` by performing matrix multiplication and activation on
    the input, producing `y₃`. This output is stored in its local VRAM and transferred
    to `GPU 1a` over `NVLink` using `DMA`.


    Simultaneously, `GPU 1a` processes the output `y₂`, received at `t₂` from `GPU
    0a`, through the second hidden layer. The resulting activation value is transferred
    over the backend network to `GPU 0b` on Host B.


    At the same time, `GPU 0b` begins processing `y₁` from its local VRAM. This intermediate
    result, originally received at `t₂`, is now passed through the third hidden layer.
    Once processed, the output is stored local VRAM, from where it is copied to VRAM
    of remote `GPU 1b` for final output layer computation.


    All of these operations occur concurrently across the GPUs, effectively utilizing
    the pipeline. At this point, three out of the four GPUs are performing computation,
    raising the cluster''s GPU utilization to 75%.


    ![](main-74.jpg)


    Figure 8-5: Model Parallelism with Pipeline Parallelism – Time Step 3.


    ### 4th. Time Step— Active GPUs: 100% - Idle GPUs: none


    At time step `t₄`, the pipeline is fully active. `GPU 0a` processes the fourth
    mini-batch `X4`, producing output `y₄` and transferring it to `GPU 1a` over `NVLink`.
    Simultaneously, `GPU 1a` processes `y₃` and sends the result to `GPU 0b` on Host
    B over the backend Ethernet network using `RoCEv2`.


    At the same time, `GPU 0b` processes `y₂`. Once completed, the output is transferred
    locally over `NVLink` to `GPU 1b`, which begins computing the final output layer
    for `y₁`, related to the first mini-batch `X1`.


    At currently step `t₄`, all four GPUs are actively computing, and the pipeline
    reaches maximum throughput. GPU utilization is now 100%.


    In addition to the forward computation, `GPU 1b` now initiates the backward pass
    related to the first mini-batch. It calculates the model error `E₁` from the model
    output `𝑦𝑦^[1]` and propagates it backward to `GPU 0b`. At the same time, `GPU
    1b` computes the weight adjustment values for the weight vectors related to first
    mini-batch `X₁` and updates its local weights. These updated weights will then
    be used in the next iteration of the forward pass during matrix multiplication.


    ![](main-75.jpg)


    Figure 8-6: Model Parallelism with Pipeline Parallelism – Time Step 4.


    ### 5th. Time Step — Active GPUs: 75% - Idle GPUs: 0a


    At time step `t₅`, the system continues forward while also propagating the backward
    pass.


    Forward Pass: `GPU 0a` is now idle, having completed all mini-batches. `GPU 1a`
    processes `y₄`, received from `GPU 0a`, transferring its output `y₄` to `GPU 0b`
    using `RoCEv2`.


    Backward pass: `GPU 0b` computes `E₁` in the previous time step to update the
    weight vectors related to the first mini-batch `X₁`. `GPU 1b` computes the weight
    adjustment values for the weight vectors related to first mini-batch `X₁` and
    updates its local weights. These updated weights will then be used in the next
    iteration of the forward pass during matrix multiplication.


    Additionally, Figures 8-8 through 8-12 depict how GPU utilization changes across
    the time steps during the backward pass.

