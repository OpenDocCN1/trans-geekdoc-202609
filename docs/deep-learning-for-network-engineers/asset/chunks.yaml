  trans: '

    当神经网络模型大到无法放入单个 GPU 内存中时，可以使用模型并行。在这种方法中，模型的不同层被分配到不同的 GPU 上。每个 GPU 负责执行与其层相关的矩阵乘法和激活函数计算。这允许在不需要将整个模型加载到每个
    GPU 的情况下进行跨 GPU 训练。


    流水线并行是模型并行的一种常见实现，它通过将每个训练批次划分为更小的微次（micro-batches）来进一步优化训练。当一个 GPU 处理批次的前向传播时，另一个
    GPU 可以开始处理下一个批次，从而提高硬件利用率和吞吐量。


    ### 第一时间步——活跃 GPU：25% - 空闲 GPU：1a, 0b, 1b


    在图 8-3 中，我们有两个 GPU 节点 Host A 和 B，每个配备两个 GPU。第一个隐藏层位于 `GPU 0a`，而第二个隐藏层运行在 `GPU
    1a`。第三个隐藏层和输出层分别放在 Host B 的 `GPU 0b` 和 `GPU 1b` 上。这种设置实现了跨 GPU 的层级模型并行。


    在这个示例中，四个批次由 Host A  `GPU 0a` 顺序处理。在时间步 `t₁`，`GPU 0a` 执行矩阵乘法并应用激活函数产生第一个输出 `y₁`。该结果存储在它的本地
    VRAM 中，然后通过高速 `NVLink` 连接使用直接内存访问（`DMA`）传输到 `GPU 1a` 的 VRAM。


    此时，集群的 GPU 利用率仅为 25%，因为只有 `GPU 0a` 正在计算。尽管数据正在拷贝到 `GPU 1a`，但该 GPU 尚未活跃，因为 `DMA`
    传输跳过了 GPU 的[等待]。


    图 8-3：带流水线线的模型并行——时间步 1。


    ### 第二时间步——活跃 GPU：50% - 空闲 GPU：0b, 1b


    在时间步 `t₂`，`GPU 0a` 开始处理第二个批次，执行矩阵乘法并应用激活函数产生输出 `y₂`。该输出存储在它的本地 VRAM 中，然后通过 `NVLink`
    通过 `DMA` 传输到 `GPU 1a`，与上一步相同。


    与此同时，在时间步 `t₁` 接收到 `y₁` 的 `GPU 1a` 现在变为活跃。它从 VRAM 中读取 `y₁`，通过第二个隐藏层进行处理，并产生输出。该结果随后传输到持有第三隐藏层的远程
    `GPU 0b`。传输通过后端以太网使用 `RoCEv2`（融合以太网上的 `RDMA`）发生。


    此时，`GPU 0a` 和 `GPU 1a` 正在活跃计算，`GPU 0b` 通过 `RDMA` 接收数据。然而，`GPU 0b` 尚未活跃计算。


    图 8-4：带流水线线的模型并行——时间步 2。


    ### 第三时间步——活跃 GPU：75% - 空闲 GPU：1b


    在时间步 `t₃`，流水线继续填充。`GPU 0a` 开始处理第三批次 `X3`，对输入执行矩阵乘法和激活，产生 `y₃`。该输出存储在它的本地 VRAM
    中，并通过 `NVLink` 使用 `DMA` 传输到 `GPU 1a`。


    同时，`GPU 1a` 处理从 `GPU 0a` 在 `t₂` 接收到的输出 `y₂`，通过第二个隐藏层。产生的激活值通过后端网络传输到 Host B 上的
    `GPU 0b`。


    同一时间，`GPU 0b` 开始从它的本地 VRAM 处理 `y₁`。这个最初在 `t₂` 接收到的中间结果现在通过第三个隐藏层。处理完成后，输出存储在本地
    VRAM 中，然后从那里拷贝到远程 `GPU 1b` 的 VRAM 以进行最后的输出层计算。


    所有这些操作都在 GPU 上并发发生，有效地利用了流水线。此时，四个 GPU 中的三个三个 GPU 正在执行计算，将集群的 GPU 利用率提高到 75%。


    图 8-5：带流水线线的模型并行——时间步 3。


    ### 第四时间步——活跃 GPU：100% - 空闲 GPU：无


    在时间步 `t₄`，流水线完全活跃。`GPU 0a` 处理第四批次 `X4`，产生输出 `y₄` 并通过 `NVLink` 将其传输到 `GPU 1a`。同时，`GPU
    1a` 处理 `y₃`，并通过后端以太网使用 `RoCEv2` 将结果发送到 Host B 上的 `GPU 0b`。


    同一时间，`GPU 0b` 处理 `y₂`。处理完成后，输出本地通过 `NVLink` 传输到 `GPU 1b`，后者开始计算针对第一批次 `X₁` 的输出层。


    在当前步骤 `t₄`，四个 GPU 都在活跃计算，流水线达到了最大吞吐量。GPU 利用率现在为 100%。


    除了前向计算外，`GPU 1b` 现在启动第一批次的反向传播。它从模型输出计算模型误差 `E₁` 并反向传播到 `GPU 0b`。同时，`GPU 1b` 计算与第一批次
    `X₁` 相关的权重向量调整值，并更新其本地权重。这些更新后的权重将在下一次前向传播的迭代中生效。


    ### 第五时间步——活跃 GPU：75% - 空闲 GPU：0a


    在时间步 `t₅`，系统在继续前向传播的同时也在传播反向传播。


    前向传播：`GPU 0a` 已完成所有批次，现在处于空闲状态。`GPU 1a` 处理从 `GPU 0a` 接收的 `y₄`，通过 `RoCEv2` 将其输出
    `y₄` 传输到 `GPU 0b`。


    反向传播：`GPU 0b` 在上一个时间步计算 `E₁` 以更新与第一批次 `X₁` 相关的权重向量。`GPU 1b` 计算与第一批次 `X₁` 相关的权重向量调整值并更新其本地权重。


    此外，图 8-8 至 8-12 描述了在反向传播期间 GPU 利用率随时间步的变化。

