    这种门控机制允许 LSTM 单元选择性地保留或丢弃信息，使网络能够有效管理长期依赖。


    ![](img/main-46.jpg)


    图 6-1：长短期记忆单元 – 架构概述。


    ## LTSM 单元操作


    除了为下一层产生输入（如果存在）外，LSTM 单元的输出（`h`）通过循环连接作为下一个时间步的输入。这一过程类似于基础 RNN 中神经元的运行方式。LSTM
    单元还有一个单元状态（`C`），它利用恒定误差误差（CEC）机制来保留历史信息，该机制将单元状态（`C`）反馈到计算过程中，并在其中计算出新的单元状态。接下来的章节将简要描述
    LSTM 单元计算单元状态（`C`）和单元输出（`h`）的过程，并解释门控在这一过程中的作用。


    ### 遗忘门


    遗忘门（`FG`）调整历史数据的保留程度。在图 6-2 中，单元状态 `Ct-1` 代表在前一时间步中通过恒等函数计算的历史数据。单元状态（`C`）代表 LSTM
    单元的内部状态，而不是 LSTM 单元的输出（`h`），它用于在反向传播传播（BPTT）期间保护历史数据防止梯度消失。`Ct-1` 的调整因子由神经元在 `FG`
    中使用 Sigmoid 激活函数计算。


    `FG` 中的神经元使用共享的、特定输入的权重矩阵来处理输入数据（`X1`）和从上一个 LSTM 单元输出接收的输入（`ht-1`）。这些权重矩阵在所有时间步的
    `FG` 神经元之间共享，类似于基础循环神经网络（RNN）中使用的方法。如上一章所述，这种共享减少了在通过时间的反向传播（BPTT）期间计算权重调整值的计算需求。此外，共享权重矩阵通过限制权重变量的数量有助于减少模型的内存占用。


    在图中，矩阵 `WFG1` 与从上一个时间步接收的输入相关，而矩阵 `UFG1` 则用于新的输入值 `X1`。加权和 `(WFG1 ⋅ ht-1) + (UFG1
    ⋅ X1)` 通过 Sigmoid 激活函数，产生单元状态值 `Ct-1` 的调整因子。sigmoid 函数的输出越接近数值 1，原始值对新值计算的影响越大。反之亦然，sigmoid
    函数的输出越接近 0，原始值对新值计算的影响越小。


    最后，`FG` 的输出（称为 `XFG`）通过 Sigmoid 输出与单元状态 `Ct-1` 相乘计算得出。


    ![](img/main-47.jpg)


    图 6-2：长短期记忆单元 – 遗忘门。


    ### 输入门


    输入门（`IG`）决定输入 `X1` 和上一个时间步的输出 `ht-1` 在多大程度上影响新的单元状态 `Ct`。对于这一过程，LSTM 单元有两个神经元。在图
    6-3 中，`IG` 的内部神经元使用 Sigmoid 函数，而输入激活神经元利用 ReLU 函数。两个神经元以与遗忘门相同的方式使用特定输入的权重矩阵。输入门神经元将加权和
    `(WIG1 ⋅ ht-1) + (UIG1 ⋅ X1)` 传递给 sigmoid 函数。输出了新输入值 `X1` 和 `ht-1` 影响单元内部数值计算的比例。sigmoid
    函数输出越接近 1，原始值对新值的影响越大。相反，输出越接近 0，它对新值的影响越小。输入激活神经元将加权和 `(WIA1 ⋅ ht-1) + (UIA1
    ⋅ X1)` 传递给 ReLU 函数。输出随后与 Sigmoid 函数的输出相乘，得到输入门的结果。在此阶段，LSTM 单元已经计算了遗忘门（`XFG`）和输入门（`XIG`）的输出。接下来，LSTM
    将这些值传递给恒等函数。


    ![](img/main-48.jpg)


    图 6-3：长短期记忆单元 – 输入门。


    ### 输出门


    输出门决定输出激活神经元（ReLU）的输出是完全发布、部分发布还是不发布。输出门的因子是根据输入值 `X1` 和上一个时间步的输出 `ht-1` 计算的。尽管如此，所有的
    Sigmoid 神经元和 ReLU 输入激活函数使用相同的输入，并利用共享的权重矩阵。输出激活神经元的输入是遗忘门（`Xfg`）和输入门（`Xig`）输出之和。在图中，该和表示为`f(x)
    = Xfg + Xig`。该操作由使用恒等函数（`idF`）的神经元计算。恒等函数的原始输出通过 CEC（恒定误差误差）连接保留作为下一个时间步的内部单元状态（`C`）。恒等函数的输出随后传递给
    ReLU 输出激活函数。该输出与输出门的结果相乘，产生实际的单元输出 `h1`。该值作为下一个相同 LSTM 单元的输入。


    ![](img/main-49.jpg)


    图 6-4：长短期记忆单元 – 输出门。


    ## 基于 LSTM 的循环神经网络


    ### LSTM 单元操作回顾


    上一节介绍了单个长短期记忆（LSTM）单元的构造和操作。本节将简要讨论基于 LSTM 的循环神经网络（RNN）。在深入细节之前，让我们通过理论示例回顾 LSTM
    单元是如何运行的。


    假设我们希望模型生成句子：“It was cloudy, but it is raining now（以前多云，但现在正在下雨）。”句子子的部分指的是过去，一个
    LSTM 单元在其内部状态中存储了“was”。然而，最后一部分指的是现在。自然地，我们希望模型忘记之前的“was”，并更新状态以反映当前。


    遗忘门在丢弃不需要的信息方面起作用。在这种情况下，遗忘门通过关闭门（输出 0）抑制“was”。输入门负责提供新的单元状态，在我们的示例中是“is”。输入门完全打开（输出
    1），允许引入最新的信息。


    恒等函数通过累加遗忘门和输入门的贡献来计算更新的单元状态。这个更新的单元状态代表了下一个时间步的记忆。此外，更新的单元状态传递给输出激活函数，提供单元的输出。


    输出门控制部分激活输出作为公开输出。在示例中，输出门完全打开（输出 1），允许发布“is”作为最终输出。


    ### RNN 模型


    图 6-5 展示了一个具有两个 LSTM 层和一个 SoftMax 层的基于 LSTM 的 RNN 模型。输入向量 `X1` 和 `X2` 以及上一个时间步的单元输出
    `ht-1` 被送入输入层所有的 LSTM 单元。为了保持图形简单，每层只显示了两个 LSTM 单元。


    输入向量通过门，产生内部单元状态和单元输出。内部状态使用恒定误差误差（CEC）存储，以便在后续时间步中使用。单元输出被循环回作为下一个时间步的输入向量。此外，单元输出被传递给下一层所有的
    LSTM 单元。


    ![](img/main-50.jpg)


    图 6-5：基于 LSTM 的 RNN 层模型。


