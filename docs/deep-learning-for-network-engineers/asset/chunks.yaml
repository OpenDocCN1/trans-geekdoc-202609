    14 Chapter 1: Artificial Neuron


    # Chapter 2:    Backpropagation Algorithm


    ## Introduction


    The previous chapter explained the operation of a single artificial neuron. It
    covered how input values are multiplied by their respective weight parameters,
    summed together, and combined with a bias term. The resulting value, z, is then
    passed through a non-linear sigmoid function, which squeezed a neuron’s output
    value 𝑦𝑦^ between 0 and 1.


    In this chapter, we form the smallest possible Feed Forward Neural Network (FFNN)
    model using only two neurons. While this is far from a Deep Neural Network (DNN),
    a simple NN with two neurons is sufficient to explain the Backpropagation algorithm,
    which is the focus of this chapter.


    The goal is to demonstrate the training process and illustrate how the Forward
    Pass (computation phase) first generates a model output, 𝑦𝑦^. The algorithm then
    evaluates the model’s accuracy by computing the error term using Mean Squared
    Error (MSE). The first training iteration rarely, if ever, produces a perfect
    output. To gradually bring the training result closer to the expected value, the
    Backward Pass (adjustment and communication phase) calculates the magnitude and
    direction by which the weight values should be adjusted. We are using a supervised
    training process with a prelabeled test dataset, although it is not shown in Figure
    2-1. Chapter Three covers the training datasets in detail.


    After the training process is completed, we use a test dataset to evaluate the
    model''s performance. Test dataset also contains input data and labels, but these
    labels are not used during training. Instead, after training is complete, the
    model is evaluated on the test dataset to measure its performance. At this phase,
    we measure how well the predictions from the training and test phases align. When
    the model produces the expected results on the test dataset, it can be taken into
    production.


    ## Forward Pass


    Figure 2-1 illustrates how neuron-a computes a weighted sum from three input values,
    adds a bias term, and produces a pre-activation value za. This value is then passed
    through the Sigmoid activation function. The output 𝑦𝑦^a from neuron-a serves
    as an input for neuron-b, which processes it and generates the final model output
    𝑦𝑦^b. Since these computational steps were covered in detail in Chapter 1, we
    will not repeat them here.


    As the final step of the Forward Pass, we apply the error function E to the model
    output. The error function measures how far model output 𝑦𝑦^b is from expected
    value y. We use the Mean Squared Error (MSE), which is computed by subtracting
    the expected value from the model’s output, squaring the result, and multiplying
    it by 0.5 (or equivalently, dividing by two).


    ![](main-10.jpg)


    Figure 2-1: An Overview of a Complete Forward Pass Process.'
