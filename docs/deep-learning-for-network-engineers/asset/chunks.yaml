    In Figure 4-8, we use a pre-labeled 96 x 96 RGB image for training. An RGB image
    has three color channels: red, green, and blue for each pixel. It is possible
    to apply all kernels to each color channel individually, resulting in 3 x 8 =
    24 output channels. However, we follow the common practice of applying the kernels
    to all input channels simultaneously, meaning the eight Kirsch kernels have a
    depth of 3 (matching the RGB channels). Each kernel processes the RGB values together
    and produces one output channel. Thus, each neuron uses 3 (width) x 3 (height)
    x 3 (depth) = 27 weight parameters for calculating the weighted sum. With a stride
    value of one, the convolution process generates eight 94 x 94 output channels.
    The formula for calculating weighted sum:


    ```

    z = sum_{w=1}^3 (w[w, h, d] * k[w, h, d]) + b

    ```


    ![](main-37.jpg)


    Figure 4-8: The First Convolution Layer – Convolution Process.


    ### The First Convolution Layer: MaxPooling

    To reduce the size of the output channels from the first convolution layer, we
    use MaxPooling. We apply eight 2 x 2 kernels, each with a depth of 8, corresponding
    to the output channels. All kernels process the channels simultaneously, selecting
    the highest value among the eight channels. MaxPooling with this setting reduces
    the size of each output channel by half, resulting in eight 47 x 47 output channels,
    which are then used as input channels for the second convolution layer.


    ![](main-38.jpg)


    Figure 4-9: The First Convolution Layer – MaxPooling.


    ### The Second Convolution Layer

    Figure 4-10 shows both the convolution and MaxPooling processes. The eight 47
    x 47 output channels produced by the first convolution layer are used as input
    channels for the second convolution layer. In this layer, we use 16 kernels whose
    initial weight values are randomly selected and adjusted during the training process.
    The kernel size is set to 3 x 3, and the depth is 8, corresponding to the number
    of input channels. Thus, each kernel calculates a weighted sum over 3 x 3 x 8
    = 72 parameters with 72 weight values. All 16 kernels produce new 45 x 45 output
    channels by applying the `ReLU` activation function. Before flattening the output
    channels, our model applies a `MaxPooling` operation, which selects the highest
    value within the kernel area (`region`). This reduces the size of the output channels
    by half, from 45 x 45 to 22 x 22.


    If we had used the original image without convolutional processing as input to
    the fully connected layer, it would have been 27,648 input parameters (96 x 96
    x 3). Thus, the two convolution layers reduce the number of input parameters to
    7,744 (22 x 22 x 16), which is approximately 72% reduction.


    ![](main-39.jpg)


    Figure 4-10: The Second Convolution Layer – Convolution and MaxPooling.


    ### Fully Connected Layers

    Before feeding the data into the fully connected layer, the multidimensional 3D
    array (`3D tensor`) is converted into a 1D vector. This produces 7,744 input values
    (22 x 22 x 16) for the input layer. We use 4,000 neurons with the `ReLU` activation
    function in the first hidden layer, which is approximately half the number of
    input values. In the second hidden layer, we have 1,000 neurons. The last layer,
    the output layer, has 10 neurons using the `SoftMax` function.


    ![](main-40.jpg)


    Figure 4-11: Fully Connected Layer – Convolution and MaxPooling.


    ### Backpropagation Process

    In Fully Connected Neural Networks (`CNNs`), every neuron has its own set of weights.
    In contrast, Convolutional Neural Networks (`CNNs`) use parameter sharing, where
    the same filter (`kernel`) is applied across the entire image. This approach not
    only reduces the number of parameters but also enhances efficiency. Additionally,
    backpropagation in `CNNs` preserves the spatial structure of the input data through
    convolution and pooling operations. This helps the network learn spatial features
    like edges, textures, and patterns. In contrast, `FNNs` flatten the input data
    into a 1D vector, losing any spatial information and making it harder to capture
    meaningful patterns in images.


