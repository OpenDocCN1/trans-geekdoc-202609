    ## Backward Pass


    The `Forward Pass` produces the model output `ŷ`, which is then used to compute
    the model error `E`. The closer `ŷ` is to the expected value `y`, the smaller
    the error, indicating better model performance. The purpose of the `Backward Pass`,
    as part of the `Backpropagation` algorithm, is to adjust the model’s weight parameters
    during training in a direction that gradually moves the model’s predictions closer
    to the expected values `y`.


    In Figure 2-4, the model’s output `ŷb` depends on the weighted sum `zb` of `neuron-b`.
    This weighted sum `zb`, in turn, is calculated by multiplying an input value `ya`
    by its associated weights `w1`. The same process applies to `neuron-a`. `Backpropagation`
    algorithm cannot directly modify the results of an activation function or the
    weighted sum itself. Nor can it alter the input values directly. Instead, it calculates
    weight adjustments, which are then used to update the model’s weights.


    Figure 2-4 illustrates this dependency chain and provides a high-level overview
    of how the `Backpropagation` algorithm determines weight adjustments. The following
    sections will explain this process in detail.


    ![](main-13.jpg)


    Figure 2-4: Backpropagation Overview: Backward Pass Dependency Chain.


    The somewhat crowded Figure 2-5 illustrates the components of the `backpropagation`
    algorithm, along with their relationships and dependencies. The figure consists
    of three main blocks. The rightmost block depicts the calculation of the error
    function. The middle and left blocks outline the steps for defining and adjusting
    new weight values. The complete backward pass process is explained next in detail,
    one step at a time.


    ![](main-14.jpg)


    Figure 2-5: The Backward Pass Overview.


    ### Partial Derivative for Error Function – Output Error


    The goal of training a model is to minimize the error, meaning we want `ŷb` (the
    model''s prediction/output) to get as close as possible to `y` (the expected value).


    After computing the error `E (=0.245)`, we compute the partial derivative of the
    error function with respect to `yb (=1.7)`, which shows how small changes in `ŷb`
    affects the error `E`. A derivative is called partial when one of its input values
    is held constant (i.e., `yb (=1.7)`).


    ```

    MSE'' = - (ŷb - y)

    ```


    ### Partial Derivative for Activation Function


    After computing the output error, we calculate the derivative of the activation
    function `f(b)`. `neuron-b` uses `ReLU` activation function, which states that
    if the function’s output is greater than 0, the derivative is 1; otherwise, it
    is 0.


    ```

    f''(b)=1, if yb > 0

    0, if yb <= 0

    ```


    ### Error Term for Neurons


    The error term for `neuron-b` is calculated by multiplying the partial derivative
    of the error function by the derivative of the activation function. This means
    we propagate the model''s error backward using it.


    ```

    Error term (Enb) = MSE'' * f''(b) = 0.7 * 1 = 0.7

    ```


    ![](main-16.jpg)


    Figure 2-7: The Backward Pass – Error Term for Neuron-b.


    After computing the error term for `neuron-b`, the backward pass moves to the
    preceding layer, the hidden layer, to calculate the error term for `neuron-a`.
    First, the process computes a weighted sum of `w ⋅ E` across all connected neurons
    in the next layer, output layer in our example. This sum is then multiplied by
    the derivative of the activation function, `f''(a)`. Since `neuron-a` is only
    connected to `neuron-b`, its error term is calculated as.


    ```

    Ean = w1 * Enb * f''(a) = 0.4 * 0.7 * 1 = 0.28

    ```


    ![](main-17.jpg)


    Figure 2-8: The Backward Pass – Error Term for Neuron-a.


    ### Gradient Calculation


    After computing the error terms for all neurons in every layer, the algorithm
    simultaneously calculates gradients for all weight parameters. Each gradient is
    determined by multiplying the input value by the corresponding error term.


    In our example, the gradient for `wa1`, which connects `x1` to `neuron-a`, is
    calculated by multiplying the input value `x1 (=3.0)` by the error term `Ena`
    of `neuron-a (= 0.28)`, resulting in a gradient of `0.84`. Similarly, the gradient
    for `wb1` in `neuron-b` is computed by multiplying the output `y (=3.0)` of the
    activation function from `neuron-a` by the error term `Enb` of `neuron b (=0.7)`,
    yielding a gradient of `2.1`.

