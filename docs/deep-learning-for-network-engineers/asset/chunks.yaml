- raw: 'The queuing configuration defines how traffic is scheduled and prioritized
    on the output interfaces, based on the internal QoS groups that were assigned
    earlier. This is handled by a policy map named “QOS\_EGRESS\_PORT,” which maps
    traffic to different hardware output queues. Each queue is identified by a class,
    such as c-out-8q-q7 (fixed names: 8q = eight queues, q7 = queue number 7). For
    example, queue 7 is configured with priority level 1, which gives it strict priority
    over all other traffic. Queue 3 is assigned bandwidth remaining percent 50, meaning
    that it is guaranteed half of the remaining bandwidth after strict-priority traffic
    has been serviced. In addition to bandwidth allocation, queue 3 includes congestion
    management features through the random-detect command. This enables Weighted Random
    Early Detection (WRED), a mechanism that helps avoid congestion by randomly mark
    packets as queue depth increases. The minimum-threshold and maximum-threshold
    define the WRED minimum and maximum values (from 150 KB to 3000 KB) at which packets
    begin marked. The drop-probability 7 determines the likelihood of packet mark
    when the maximum threshold is reached, with higher numbers indicating higher marking
    rates. The weight 0 setting controls how queue size is averaged. A weight of 0
    means use instantaneous queue depth (no averaging). Finally, ecn enables Explicit
    Congestion Notification, allowing network devices to signal congestion without
    dropping packets, without the ecn option switch drops packet based on WRED min/max
    values. The remaining queues are configured with either zero percent of remaining
    bandwidth, effectively disabling


    them for general use, or with a share of the remaining bandwidth. This queuing
    policy ensures that RoCEv2 traffic receives adequate resources with congestion
    feedback, while CNP messages always get through with strict priority.


    policy-map type queuing QOS\_EGRESS\_PORT


    class type queuing c-out-8q-q6


    bandwidth remaining percent 0


    ...


    class type queuing c-out-8q-q3


    bandwidth remaining percent 50


    random-detect minimum-threshold 150 kbytes maximum-threshold 3000 kbytes drop-probability
    7 weight 0 ecn


    ...


    class type queuing c-out-8q-q7


    priority level 1


    Example 11-3: Queuing (Output Scheduling).


    #### Step 4: Enable PFC for Queue


    The Network QoS configuration defines the low-level, hardware-based characteristics
    of traffic handling within the switch, such as enabling lossless behavior and
    setting the maximum transmission unit (MTU) size for each traffic class. In this
    example, the policy-map type network-qos qos\_network is used to configure how
    traffic is handled inside the switch fabric. Under this policy, the class type
    network-qos c-8q-nq3 is associated with pause pfc-cos 3, which enables Priority
    Flow Control (PFC) on Class of Service (CoS) 3. This is critical for RoCEv2 traffic,
    which depends on a lossless transport layer. The MTU is also defined here, with
    bytes (jumbo frame) set for class 3 traffic.


    policy-map type network-qos qos\_network class type network-qos c-8q-nq3


    mtu 9216


    pause pfc-cos 3


    Example 11-4: Queuing (Output Scheduling).


    #### Priority Flow Control Watchdog


    The Priority Flow Control (PFC) watchdog is a mechanism that protects the network
    from traffic deadlocks caused by stuck PFC pause frames. In RDMA environments
    like RoCEv2, PFC is used to create lossless classes of traffic by pausing traffic
    flows instead of dropping packets. However, if a device fails to release the pause
    or a misconfiguration causes PFC frames to persist, traffic in the affected class
    can become permanently blocked, leading to what is called a "head-of-line blocking"
    condition. To mitigate this risk, the priority-flow-control watch-dog-interval
    on command enables the PFC watchdog feature. When enabled, the switch monitors
    traffic in each PFC-enabled queue for signs of persistent pause conditions. If
    it detects that traffic has been paused for too long, indicating a potential deadlock,
    it can take corrective actions, such as generating logs, resetting internal counters,
    or even discarding paused traffic to restore flow.


    priority-flow-control watch-dog-interval on Example 11-5: Priority Flow Control
    (PFC) Watchdog.


    #### Step 5: Bind and Apply QoS Settings


    System-level QoS policies bind all the previously defined QoS components together
    and activate them across the switch. This is done using the system qos configuration
    block, which applies the appropriate policy maps globally. The service-policy
    type network-qos qos\_network command activates the network-qos policy defined
    earlier, ensuring that MTU sizes and PFC configurations are enforced across the
    switch fabric. The command service-policy type queuing output QOS\_EGRESS\_PORT
    applies the queuing policy at the output interface level, enabling priority queuing,
    bandwidth allocation, and congestion management as traffic exits the switch. These
    system-level bindings are essential because, without them, the individual QoS
    policies, classification, marking, queuing, and fabric-level configuration, would
    remain inactive. By applying the policies under system qos, the switch is instructed
    to treat


    traffic according to the rules and priorities defined in each policy map. This
    final step ensures end-to-end consistency in QoS behavior, from ingress classification
    to fabric transport and egress scheduling, providing a complete and operational
    quality-of-service framework tailored for latency-sensitive, lossless applications
    like RoCEv2.


    system qos


    service-policy type network-qos qos\_network


    service-policy type queuing output QOS\_EGRESS\_PORT Example 11-6: Priority Flow
    Control (PFC) Watchdog.


    #### Step 6: Interface-Level Configuration


    The interface-level configuration attaches the previously defined QoS policies
    and enables PFC-specific features for a given port. In our example, the configuration
    is applied to Ethernet2/24, but the same approach can be used for any interface
    where you need to enforce QoS and PFC settings. The first command, priority-flow-control
    mode auto, enables Priority Flow Control (PFC) on the interface in auto-negotiation
    mode. This means the interface will automatically negotiate PFC with its link
    partner, allowing for lossless traffic handling by pausing specific traffic classes
    instead of dropping packets. The priority-flow-control watch-dog command enables
    the PFC watchdog for this interface, which ensures that if any PFC pause frames
    are stuck or persist for too long, the watchdog will take corrective action to
    prevent a deadlock situation. This helps maintain the overall health of the network
    by preventing traffic congestion or blockages due to PFC-related issues.


    Lastly, the service-policy type qos input QOS\_CLASSIFICATION command applies
    the QoS classification policy on incoming traffic, ensuring that packets are classified
    and marked according to their DSCP values as defined in the QOS\_CLASSIFICATION
    policy. This classification enables downstream QoS treatment, including proper
    queuing, scheduling, and priority handling.


    interface Ethernet 2/24


    priority-flow-control mode auto


    priority-flow-control watch-dog


    service-policy type qos input QOS\_CLASSIFICATION


    Example 11-7: Interface Level Configuration.


    ## References


    *   *   \[1\]    Nemanja Kamenica, Cisco, Network Best Practices for Artificial
    Intelligence Data Centre, Cisco Live, BRKDCN-2921,


    [https://www.ciscolive.com/c/dam/r/ciscolive/emea/docs/2024/pdf/BR](https://www.ciscolive.com/c/dam/r/ciscolive/emea/docs/2024/pdf/BR)
    KDCN-2921.pdf


    *   *   \[2\]    Class of Service User Guide (Routers and EX9200 Switches) Understanding
    PFC Using DSCP at Layer 3 for Untagged Traffic, January 2021.


    [https://www.juniper.net/documentation/us/en/software/junos/cos/topics/con](https://www.juniper.net/documentation/us/en/software/junos/cos/topics/con)
    cept/cos-lossless-l3-dscp-pfc-understanding.html'
