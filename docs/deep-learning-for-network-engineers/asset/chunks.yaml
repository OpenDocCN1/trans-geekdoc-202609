    \n# Chapter 12:    Flow, Flowlet, and Packet-Based Load Balancing\n\n## Introduction\n\
    \nThough BGP supports the traditional Flow-based Layer 3 Equal Cost Multi-Pathing\
    \ (ECMP) traffic load balancing method, it is not the best fit for a RoCEv2-based\
    \ AI backend network. This is because GPU-to-GPU communication creates massive\
    \ elephant flows, which RDMA-capable NICs transmit at line rate. These flows can\
    \ easily cause congestion in the backend network.\n\nIn ECMP, all packets of a\
    \ single flow follow the same path. If that path becomes congested, ECMP does\
    \ not adapt or reroute traffic. This leads to uneven bandwidth usage across the\
    \ network. Some links become overloaded, while others remain idle. In AI workloads,\
    \ where multiple high-bandwidth flows occur at the same time, this imbalance can\
    \ degrade performance.\n\nDeep learning models rely heavily on collective operations\
    \ like all-reduce, all-gather, and broadcast. These generate dense traffic patterns\
    \ between GPUs, often at terabit-per-second speeds. If these flows are not evenly\
    \ distributed, a single congested path can slow down the entire training job.\n\
    \nThis chapter introduces two alternative load balancing methods to traditional\
    \ Flow-Based with Layer 3 ECMP: 1) Flowlet-Based Load Balancing with Adaptive\
    \ Routing, and 2) Packet-Based Load Balancing with Packet Spraying. Both aim to\
    \ improve traffic distribution in RoCEv2-based AI backend networks, where conventional\
    \ flow-based routing often leads to congestion and underutilized links. These\
    \ advanced methods are designed to handle the unique traffic patterns of AI workloads\
    \ more efficiently.\n\n## RDMA WRITE Operation\n\nBefore we explore the load balancing\
    \ solution, let’s first walk through a simplified example of how the RDMA WRITE\
    \ memory copy operation works. In Figure 12-1, we have two GPU servers: Host 1\
    \ and Host 2, each with one GPU. By this point, the memory has already been allocated\
    \ and registered, and the Queue Pair (QP) has been created on both sides, so the\
    \ data transfer can begin.\n\nOn GPU-0 of Host 1, gradients are stored in memory\
    \ regions highlighted in green, orange, and blue. Each colored section represents\
    \ a portion of local memory that will be written to GPU-0 on Host 2. To transfer\
    \ the data, the RDMA NIC on Host 1 splits the write operation into three flowlets\
    \ (green, orange, and blue). Rather than sending the entire data block as a single\
    \ continuous stream, each flowlet is treated as a segment of the same RDMA Write\
    \ operation.\n\n### RDMA Write First\n\nThe first message carries the RDMA Extended\
    \ Transport Header (RETH) in its payload. This header tells the receiving RDMA\
    \ NIC where in the remote memory the incoming data should be written. In our example,\
    \ data from memory block 1B of GPU-0 on Host 1 is written to memory block 2C of\
    \ GPU-0 on Host 2.\n\nThe RETH contains the R\\_Key, which gives permission to\
    \ write to the remote memory region. It also includes the length of the data being\
    \ transferred and the virtual address of the target memory location on Host 2.\n\
    \nThe operation code in the InfiniBand Base Transport Header (IBTH) is set to\
    \ RDMA Write First, indicating that this is the first message in the sequence.\
    \ The IBTH also describes the Partition Key (interface identifier), the Destination\
    \ Queue Pair number, and the Packet Sequence Number (PSN) that helps ensure packets\
    \ are processed in the correct order.\n\nWhen this first packet arrives at Host\
    \ 2, the RDMA NIC uses the Virtual Address information in the RETH header to write\
    \ the payload directly into memory block 2C.\n\n![](main-115.jpg)\n\nFigure 12-1:\
    \ RDMA WRITE First.\n\n### RDMA Write Middle\n\nThe second message has the opcode\
    \ RDMA Write Middle and PSN 2, which tells the receiver that this packet comes\
    \ after the first one with PSN 1. The payload of this Flowlet is written right\
    \ after the previous block, into memory block 2D on Host 2. The RDMA NIC ensures\
    \ that the order is maintained based on PSNs, and it knows exactly where to place\
    \ the data thanks to the original offset from the first packet.\n\n![](main-116.jpg)\n\
    \nFigure 12-2: RDMA WRITE Middle.\n\n### RDMA Write Last\n\nThe third message\
    \ has the opcode RDMA Write Last, indicating that this is the final message in\
    \ the sequence. With PSN 3, it follows directly after PSN 2. The payload in this\
    \ packet is written into memory block 2E, which comes directly after 2D.\n\n![](main-117.jpg)\n\
    \nFigure 12-3: RDMA WRITE Last.\n\nIn a multi-packet RDMA Write operation, each\
    \ Flowlet represents a continuous block of data being transferred from the source\
    \ GPU to the destination GPU. Data within packets must arrive in the correct order\
    \ because only the first packet includes the full addressing information in the\
    \ RDMA Extended Transport Header (RETH). This header tells the receiver where\
    \ in memory the data should be written.\n\nPackets marked as RDMA Write Middle\
    \ and RDMA Write Last depend on this information and must follow the sequence\
    \ defined by the Packet Sequence Numbers (PSNs). If packets are delivered out\
    \ of order, the receiving RDMA NIC cannot process them immediately. Instead, it\
    \ must hold them in memory and wait for the missing earlier packets to arrive.\
    \ This buffering increases memory usage and processing overhead. In high-\n\n\
    speed environments, this can lead to performance degradation or even packet drops,\
    \ especially when buffers fill up under heavy load.\n\n## Flow-Based Load Balancing\
    \ with Layer 3 ECMP\n\nFigure 12-4 depicts the problem with flow-based load balancing\
    \ when used in an AI fabric backend network. In our example, we have four hosts,\
    \ each equipped with two GPUs: GPU-1 and GPU-2. The RDMA NICs connected to GPU-1s\
    \ are linked to switch Rail-1, and the RDMA NICs connected to GPU-2s are linked\
    \ to Rail-2. Traffic between NICs on Rail-1 and Rail-2 is forwarded through either\
    \ Spine-1 or Spine-2.\n\nWe use a basic data parallelization strategy, where the\
    \ training dataset is divided into mini-batches and distributed across all eight\
    \ GPUs. To keep the example simple, Figure 12-4 only shows the all-reduce gradient\
    \ synchronization flow from the GPU-1s on Hosts 1, 2, and 3 to the GPU-2 on Host\
    \ 4. In real-world training, a full-mesh all-reduce operation takes place between\
    \ all GPUs.\n\nAs a starting point, the GPU-1s on the three leftmost hosts begin\
    \ the RDMA process to copy data from their memory to the memory of GPU-2 on Host\
    \ 4. These GPU-1s are all connected to Rail-1. Instead of sending one large flow,\
    \ the RDMA NICs split the data into flowlets, small bursts of data from the larger\
    \ transfer. These flowlets arrive at the Rail-1 switch, where the 5tuple L3 ECMP\
    \ hash algorithm unfortunately selects the same uplink for all three flows."
