    based on `DSCP 48`, which is associated with `CNP` traffic in the QoS configuration.

    3. `DSCP 48` maps the packet to QoS group `7`, which is reserved for congestion
    feedback signaling.

    4. `QoS group 7` is associated with strict-priority egress queue `7`, ensuring
    that `CNP` packets are forwarded with the highest priority. This guarantees that
    congestion signals are not delayed behind other types of traffic.

