- raw: '▪ Local Buffer Address and Length: Describes the location in local device
    memory from which data is written to SCN memory, along with the length of the
    data.


    ▪ Local Memory Key (L\_Key): Used for accessing the local memory buffer.


    ▪ Send Flag: Indicates that successful processing of the WR should be signaled
    to the application through the Completion Queue.


    ▪ Remote Buffer Address: Specifies the target memory location on the SCN.


    ▪ Remote Key (R\_Key): Used for accessing the remote memory buffer on the SCN.
    The R\_Key is received over management connection from the SCN.


    The NIC retrieves the Work Request from the send queue. Based on the WR information,
    it constructs an InfiniBand Base Transport Header (IB BTH), which includes the
    P\_Key and Destination QP identifier obtained during


    the connection initiation process. Because of the Reliable Connection service
    type, the Ack Required value is set to Yes.


    The RDMA Write operation requires an RDMA Extended Transport Header (RETH), which
    details the destination memory buffer, R\_Key, and data length. The IB BTH and
    RETH headers are encapsulated within Ethernet/IP/UDP headers. The destination
    port 4791 in the UDP header indicates that the next header is IB BTH.


    Wrapped inside Eth/IP/UDP/IB BTH/RETH headers the data is forwarded towards the
    SCN.


    ![](main-95.jpg)![](main-96.jpg)


    ![](main-97.jpg)


    Figure 9-5: Work Request Message – Step 1.


    When the SCN receives the RDMA Write message, it checks the received P\_Key and
    assigns the ingress port. Additionally, it validates the R\_Key to ensure it matches
    what was published to the CCN over the management connection. After these validations,
    the NIC translates the virtual device memory address to physical memory access
    and sends the RDMA Write information to the QP’s Receive Queue. Finally, once
    the RDMA write operation is completed, the application is notified via the Completion
    Queue that the job is done.


    ![](main-98.jpg)![](main-99.jpg)


    Figure 9-6: Work Request Message – Step 2.


