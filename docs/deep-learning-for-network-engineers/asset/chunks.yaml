  trans: '


    第一个隐藏层分布在 `GPU A1` 和 `GPU B1` 之间，两者都位于同一台服务器。神经元 1–3 的权重矩阵位于 `GPU A1`，而神经元 4–6
    的权重矩阵位于 `GPU B1` 中。`GPU A1` 与 `GPU B1` 之间的 GPU 间通信通过 `NVLinks` 进行，我将其称为高速域（`HsD`）。


    第二个隐藏层分布在同一台服务器的 `GPU A2` 和 `GPU B2` 之间。`GPU A2` 保存神经元 1–2 的权重矩阵，而 `GPU B2` 包含神经元
    3–4 的权重矩阵。`GPU A2` 与 `GPU B2` 之间的 GPU 连接同样利用了 `NVLinks`。


    输出层划分在 `GPU A3` 和 `GPU B3` 之间，均位于同一台服务器。神经元 1 的权重矩阵存储在 `GPU A3` 中，而神经元 2 的权重矩阵在
    `GPU B3` 中。GPU 间通信通过 `NVLinks` 进行。


    此外，`GPU A1`、`GPU A2` 和 `GPU A3` 通过后端网络上的 `Rail Switch-1` 联。同样，`GPU B1`、`GPU B2`
    和 `GPU B3` 通过后端网络上的 `Rail Switch-2` 连接。


    ![](img/main-87.jpg)


    图 8-18：前馈层中的张量、模型和流水线并行。


    ### 反向传播


    #### 前向传播


    第一个隐藏层 (H1)：`H1` 的输入（ `Add & Norm` 步骤之后 `Self-Attention` 块的输出（上下文向量）与 `GPU A1`
    和 `GPU B1` 共享。每个 GPU 然后执行其本地矩阵乘法。在本地计算完成后，使用 `All-Gather` 操作在 `GPU A1` 和 `GPU
    B1` 之间同步部分输出。这种同步确保了在传递到下一阶段之前计算出完整的 `H1` 输出（`ynA1+B1`）。由于 `GPU A1` 和 `GPU B1`
    位于同一台服务器上，通信通过 `NVLink` 在高速域内进行。


    在流水线并行的背景下，`H1` 构成了一个流水线阶段。一旦其基于上下文向量的输出完全组装完成，就会发送到负责下一层的 GPU。具体而言，`GPU A1` 和
    `GPU B1` 首先传递从第一个上下文向量计算出的输出（`C1`），然后 GPU 处理下一个上下文向量。这种通信通过后端网络进行。`GPU A1`、`GPU
    A2` 和 `GPU A3` 连接到同一个轨道交换机，因此 `RDMA` 数据包仅通过一个交换机。相同的设计适用于 `GPU B1`、`GPU B2` 和
    `GPU B3`。


    第二个隐藏层 (H2)：来自 `H1` 的完整输出（在上一阶段同步后获得）被流水线传输到 `GPU A2` 和 `B2`。这些 GPU 中的每一个各自执行矩阵乘法。在本地计算之前，`GPU
    A2` 和 `GPU B2` 的部分输出通过 `All-Gather` 操作同步，形成完整的 `H2` 输出（`ynA2+B2`）。隐藏层与输出层之间的同步与之前的隐藏层模型相同。这种在每个阶段使用张量并行并在跨阶段使用流水线并行的混合方法有助于平衡多个
    GPU 之间的计算负载和内存使用，同时减少空闲时间。尽管本节的重点是张量并行，但也讨论了流水线并行，因为大语言模型（LLMs）在训练过程中可以同时处理多个句子。另一方面，在推理回答问题时，LLMs
    使用自回归词预测。在此过程中，`Transformer` 的最终 `SoftMax` 层在词表上计算概率以预测下一个 token。预测的 token 然后转换为单词并映射到新
    token。查找过程为 token 分配位置嵌入，用于计算输入 `Transformer` 层的 `Query`、`Key` 和 `Value` 向量。因此，在推理阶段不需要流水线并行。


    #### 反向传播


    误差从前馈神经网络 (`FFNN`) 层反向传播到 `Self-Attention` 层。`Transformer` 中的反向传播遵循顺序，误差首先从输出层传播到
    `FFNN` 层，从那里继续反向传播到 `Self-Attention` 机制。过程从输出层开始，使用 `SoftMax` 函数和交叉熵损失计算误差。该误差随后反向通过
    `FFNN` 层，计算权重矩阵的梯度。由于 `FFNN` 权重被拆分在多个 GPU 上，每个 GPU 计算其本地梯度。然后执行 `AllReduce` 操作以同步这些梯度，确保在继续之前所有
    GPU 都有正确的权重更新。一旦 `FFNN` 权重梯度完成同步，误差传播回 `Self-Attention` 层。在这里，计算 `Query` (`Q`)、`Key`
    (`K`) 和 `Value` (`V`) 矩阵。由于这些矩阵在前向传播期间被拆分在 GPU 上，在计算梯度之前必须收集缺失的 `Q` 和 `K`。使用 `All-Gather`
    操作跨 GPU 收集 `Q` 和 `K` 值。一旦每个 GPU 拥有完整的 `Q` 和 `K` 矩阵，就会本地计算梯度。本地计算完成后，执行 `All-Reduce`
    操作以确保在更新权重之前所有 GPU 都有同步的梯度。


    两个层完成梯度计算和同步后，优化器更新权重并开始下一次迭代。关键通信阶段包括在梯度计算前通过 `All-Gather` 组装所需的 `Q` 和 `K` 值，以及在权重更新前通过
    `All-Reduce` 同步梯度。


    ## 参考文献


    * [1] Dean, J., Corrado, G., Monga, R., Chen, K., Devin, M., Le, Q. V., Mao, M.
    Z., Ranzato, M., Senior, A., Tucker, P., Yang, K., & Ng, A. Y. (2012, January
    1). Large Scale Distributed Deep Networks. Advances in Neural Information Processing
    Systems, 25, 1223–1231. [`papers.nips.cc/paper_files/paper/2012/file/6aca97005c68f120682381f6`](https://papers.nips.cc/paper_files/paper/2012/file/6aca97005c68f120682381f6)
    6102863-Paper.pdf

    * [2] Huang, Y., Cheng, Y., Bapna, A., Firat, O., Chen, D., Chen, M. X., Lee,
    H., Ngiam, J., Le, Q. V., Wu, Y., & Chen, Z. (2019, June 10). GPipe: Efficient
    Training of Giant Neural Networks using Pipeline Parallelism. Advances in Neural
    Information Processing Systems, 32. [`arxiv.org/pdf/1811.06965.pdf`](https://arxiv.org/pdf/1811.06965.pdf)

    * [3] Nararayanan, D., Santhanam, K., Zhao, Y., Shoeybi, M., LeGresley, P., Patwary,
    M., Thakur, A., Prabhumoye, S., Hall, J., Houston, M., & Zaharia, M. (2021, March
