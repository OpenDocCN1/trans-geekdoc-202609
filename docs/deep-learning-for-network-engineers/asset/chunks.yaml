    If congestion worsens and the queue continues to grow, the buffer may reach the
    `xOFF` threshold. At this point, the switch sends `PFC` pause frames hop by hop
    to upstream devices. These devices respond by temporarily stopping traffic for
    that specific priority queue, helping prevent packet loss.


    ### Resuming Traffic


    Once the buffer has drained and the queue drops below the `xON` threshold, the
    switch sends a resume message (a `PFC` frame with a quanta value of `0`). This
    tells the upstream device it can start sending traffic again.


    ### Why ECN Must Precede xOFF


    It is very important that the `ECN` thresholds (`WRED` minimum and maximum) are
    used before the `xOFF` threshold is reached for three main reasons:


    *   **Graceful Rate Adaptation**: Early `ECN` marking helps the `GPU NIC` (sender)
    reduce its transmission rate gradually. This smooth adjustment avoids sudden stops
    and leads to more stable traffic flows.

    *   **Avoiding Unnecessary PFC Events**: If the sender adjusts its rate early
    with `ECN` feedback, the buffers are less likely to fill up to the `xOFF` level.
    This avoids the need for abrupt `PFC` pause frames that can cause head-of-line
    blocking and backpressure on the network.

    *   **Maintaining Fabric Coordination**: With early `ECN` marking, the sender
    receives feedback before congestion becomes severe. While the `ECN` signal is
    not shared directly with other switches, the sender''s rate adjustment helps reduce
    overall pressure on the network fabric.


    ### What Happens If xOFF Is Reached Before ECN Marking?


    Imagine that the ingress queue on `Spine Switch 1` (from `Rail Switch A`) fills
    rapidly without `ECN` marking:


    *   **Sudden Pause**: The buffer may quickly hit the `xOFF` threshold and trigger
    an immediate `PFC` pause.

    *   **Downstream Effects**: An abrupt stop in traffic from `Rail Switch A` leads
    to sudden backpressure. This can cause head-of-line blocking and disturb `GPU`
    communication, leading to performance jitter or instability at the application
    level.

    *   **Oscillations**: When the queue finally drains and reaches the `xON` threshold,
    traffic resumes suddenly. This can cause recurring congestion and stop-and-go
    patterns that hurt overall performance.


    By allowing `ECN` to mark packets early, the network gives the sender time to
    reduce its rate smoothly. This prevents abrupt stops and helps maintain a stable,
    efficient fabric.


    Figure 11 recaps how the example `DCQCN` process works:


    *   **Time t1**: (1) Traffic associated with priority queue `3` on `Rail-1`’s
    egress interface `1` crosses the `WRED` minimum threshold.

    *   **Time t2**: (2) `Rail-1` begins randomly marking `ECN` bits as `11` on packets
    destined for `GPU-0` on `Host-3`.

    *   **Time t3**: (3) The `RDMA NIC` starts sending `CNP` messages to the sender
    `GPU-1` on `Host-1`.

    *   **Time t4**: (4) In response to the `CNP` message, the sending `GPU-0` on
    `Host-1` reduces its transmission rate by holding packets longer in its egress
    queue. (5) At the same time, egress queue `3` on `Rail-1` remains congested. (6)
    Since packets cannot be forwarded from ingress interface `2` to egress interface
    `1`’s queue `3`, ingress interface `3` also becomes congested, eventually crossing
    the `PFC xOFF` threshold.

    *   **Time t5**: (7) As a result, `Rail-1` sends a `PFC xOFF` message to `Spine-A`
    over `Inter-Switch Link 3`. (8) In response, `Spine-A` halts forwarding traffic
    for the specified pause duration.

    *   **Time t6**: (9) Due to the forwarding pause, the egress queue of interface
    `3` on `Spine-A` becomes congested, which in turn (10) causes congestion on its
    ingress interface `2`.

    *   **Time t7**: (11) The number of packets waiting in egress queue `3` on interface
    `1` of `Rail-1` drops below the `WRED` minimum threshold. (12) This allows packets
    from the buffer of interface `3` to be forwarded.

    *   **Time t8**: (13) The packet count on ingress interface `3` of `Rail-1` falls
    below the `PFC xON` threshold, triggering the `PFC` resume/unpause message to
    `Spine-A`. (14) `Spine-A` resumes forwarding traffic to `Rail-1`.


    After the `PFC` resume message is sent, `Spine-A` starts forwarding traffic again
    toward `Rail-1`. The congestion on `Spine-A`’s interface `3` gets cleared as packets
    leave the buffer. This also helps the ingress interface `2` on `Spine-A` to drain.
    On `Rail-1`, as interface `1` can now forward packets, queue `3` gets more room,
    and the flow to `GPU-0` becomes smoother again.


    The `RDMA NIC` on the sender `GPU` monitors the situation. Since there are no
    more `CNP` messages coming in, the `GPU` slowly increases its sending.


    ![Figure 11](main-11.jpg)

