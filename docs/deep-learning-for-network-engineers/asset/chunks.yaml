- raw: 'Figure 5-2 illustrates a simplified view of the RNN training process. In the
    previous section, we explained how one-hot encoding is used to produce an input
    vector for training. For example, the character “a” is represented by the input
    vector \[1, 0, 0, 0\], which is fed into the hidden layer. Each neuron in the
    hidden layer has its own dedicated weight matrix associated with the input vector.


    ### Weight Matrices in RNNs


    The weight values associated with input vectors are denoted as U, while the weights
    for the recurrent connections (connections between neurons across time steps)
    are noted as W. This separation is a standard way to distinguish weights for input
    processing from those used in recurrent operations.


    ### Weighted Sum Calculation in the Hidden Layer


    The neurons in the hidden layer calculate the weighted sum of the input vector.
    Only the sequence corresponding to the 1 in the input vector contributes to the
    calculation, as all other sequences result in zero when multiplied. This calculation
    also includes a bias term. For example, if the weight matrix for the input vector
    \[1, 0, 0, 0\] is \[Un1, Un2, Un3, Un4\], only the weight Un1 contributes to the
    sum.


    The result of this weighted sum for the initial time step is denoted as h^((-1t)).
    This result is "stored" and used as an input for the next time step. After calculating
    the weighted sum, it is passed through an activation function, and the resulting
    activation values are fed into the output layer.


    ### Output Layer Operations


    In our example, there are two output neurons for simplicity, but in real-life
    scenarios, the output layer typically contains the same number of neurons as the
    input vector dimensions (four in this case). Each output neuron calculates a weighted
    sum of its inputs, producing a value known as a logit. These logits are passed
    through the SoftMax activation function, which converts them into probabilities
    for each output neuron. Note, SoftMax function is discussed in chapter 3 – Multi-Class
    Classification.


    In this example, the output neuron with the highest probability corresponds to
    the third position (not shown in the figure). This results in the output vector
    \[0, 0, 1, 0\], which represents the character “l.”


    ![](main-42.jpg)


    Figure 5-2: Recurrent Neural Networks – Basic Operation.


    ## Comparison with Feed-Forward Neural Networks (FNNs)


    So far, this process resembles that of a Feed-Forward Neural Network (FNN). Input
    vectors are passed from the input layer to the hidden layer, where the neurons
    compute weighted sums and apply an activation function. Since the hidden and output
    layers are fully connected, the hidden layer''s activation values are passed to
    the output layer.


    ## Moving to the Second Time Step


    At the second time step, the output vector \[0, 0, 1, 0\], along with the weighted
    sum h^(n(t-1)) from the previous step, is used to calculate the new weighted sum.
    This calculation also includes a bias term. Since the same model is used at every
    time step, the weight matrices remain unchanged. At this time step, only the weight
    Un3 contributes to the sum, as it corresponds to the non-zero value in the input
    vector. The rest of the process follows the same steps as in the initial time
    step. Once time step 1 is completed, the process advances to time step 2, repeating
    the same calculations. This sequence continues until the training is completed.


    ## Backward Pass in Recurrent Neural Networks


    The backward pass in RNNs is called Backpropagation Through Time (BPTT) because
    it involves propagating errors not only through the network layers but also backward
    through time steps. If you think of time steps as stacked layers, the BPTT process
    requires fewer computation cycles and memory than Feed-Forward Neural Network
    (FNN), because RNN uses shared weight matrices across the layers while FMM has
    assigned per-layer weight values. Like RNN, the Convolutional Neural Network (CNN),
    introduced in Chapter 4, leverages shared weight matrices but within a layer not
    between the layers.


    ## Challenges of a RNN Modell


    Figure 5-3 shows the last two time steps of our Recurrent Neural Network (RNN).
    At the time step n (on the left side), there are two inputs for the weighted sum
    calculation: Xn (the input at the current time step) and ht-1 (the hidden state
    from the previous time step).


    First, the model calculates the weighted sum of these inputs. The result is then
    passed through the neuron’s activation function (Sigmoid in this example). The
    output of the activation function, ht , is fed back into the recurrent layer on
    the next time step, n+1. At time step n+1, the ht is combined with the input Xn
    to calculate weighted sum. This result is then passed through the activation function,
    which now produces the model''s prediction, 𝑦𝑦^ (y hat). These steps are part
    of the Forward Pass process.


    As the final step in the forward pass, we calculate the model''s accuracy using
    the Mean Square Error (MSE) function (explained in Chapter 2).


    If the model''s accuracy is not close enough to the expected result, it begins
    the Backward Pass to improve its performance. The most used optimization algorithm
    for minimizing the loss function during the backward pass is Gradient Descent,
    which updates the model''s parameters step by step.


    The backward pass process starts by calculating the derivative of the error function
    (i.e., the gradient of the error function with respect to the output activation
    value) to determine the Output Error.


    Next, the Output Error is multiplied with the derivative of the activation function
    to compute the local Error Term for the neuron. (i.e., the derivative of the activation
    function with respect to its input is the local gradient, which determines how
    the activation values changes in response to its input change.) The error terms
    are then propagated through all time steps to calculate the actual Weight Adjustment
    Values.


    In this example, we focus on how the weight value associated with the recurrent
    connection is updated. However, this process also applies to


    weights linked to the input values. The neuron-specific weight adjustment values
    are calculated by multiplying the local error term with the corresponding input
    value and the learning rate.


    The difference between the backward pass process in a Feedforward Neural Network
    (FNN) and a Recurrent Neural Network (RNN) is that the RNN uses Backpropagation
    Through Time (BPTT). In this method, the weight adjustment values from each time
    step are accumulated during backpropagation. Optionally, these accumulated gradients
    can be averaged over the number of time steps to prevent the gradient magnitude
    from becoming too large for long sequences. This averaging is the default behavior
    in implementations using TensorFlow and PyTorch frameworks (PyTorch is explained
    in detail in Chapter 14).


    Since the RNN model uses shared weight matrices across all time steps, only one
    weight parameter per recurrent connection needs to be updated. In this simplified
    example, we have one recurrent connection because there is only one neuron in
    the recurrent layer. However, in real-world scenarios, RNN layers often have hundreds
    of neurons and thousands of time steps.


    ![](main-43.jpg)


    Figure 5-3: Overview of the Weight Adjustment Process.


    ### Saturated Neurons'
