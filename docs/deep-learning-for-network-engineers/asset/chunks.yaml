- raw: "First, when two GPUs open a Queue Pair (QP) between each other, all gradient\
    \ synchronization traffic is typically sent over that QP. From the network point\
    \ of view, this looks like one large flow between the GPUs. In deep learning training,\
    \ gradient data can be hundreds of megabytes or even gigabytes, depending on the\
    \ model size. So, when it is sent over one QP, the network sees it as a single\
    \ high-bandwidth flow. This kind of traffic is often called an elephant flow,\
    \ because it can take a big share of the link bandwidth. This becomes a problem\
    \ when multiple large flows are hashed to the same uplink or spine port. If that\
    \ happens, one link can get overloaded while others remain underused. This is\
    \ one of the reasons we see hash polarization and head-of-line blocking in AI\
    \ clusters. Hash polarization is a condition where the load-balancing hash algorithm\
    \ used in ECMP (Equal-Cost Multi-Path) forwarding results in uneven distribution\
    \ of traffic across multiple available paths.\n\nFor example, in Figure 10-5,\
    \ GPU-0 in Host-1 and GPU-0 in Host-2 both send traffic to GPU-1 at a rate of\
    \ 200 Gbps. The ECMP hash function in Rail Switch A selects the link to Spine\
    \ 1 for both flows. This leads to a situation where one spine link carries 400\
    \ Gbps of traffic, while the other remains idle. This is a serious problem in\
    \ AI clusters because training jobs generate large volumes of east-west traffic\
    \ between GPUs, often at line rate. When traffic is unevenly distributed due to\
    \ hash polarization, some links become congested while others are idle. This causes\
    \ packet delays and retransmissions, which can slow down gradient synchronization\
    \ and reduce the overall training speed. In large-scale clusters, even a small\
    \ imbalance can have a noticeable impact on job completion time and resource efficiency.\n\
    \n![](main-104.jpg)\n\nFigure 10-5: ECMP Hash-Polarization.\n\nIn the previous\
    \ sections, we explored some of the key challenges that can impact performance\
    \ and reliability in GPU-based AI clusters, such as link congestion, single points\
    \ of failure, head-of-line blocking, and hash polarization in ECMP routing.\n\n\
    The rest of this book focuses on how these problems can be mitigated or even fully\
