    图 4-10 展示了卷积和 MaxPooling 过程。第一卷积层产生的 8 个 47 x 47 输出通道被用第二卷积层的输入通道。在这一层中，我们使用 16
    个卷积核，其初始权重值是随机选择的并在训练过程中进行调整。卷积核大小设置为 3 x 3，深度为 8，对应输入通道的数量。因此，每个卷积核通过 3 x 3 x
    8 = 72 个参数和 72 个权重值计算一个加权和。所有 16 个卷积核通过应用 `ReLU` 激活函数产生新的 45 x 45 输出通道。在展平输出通道之前，我们的模型应用了
    `MaxPooling` 操作，它选择卷积核区域（`region`）内的最大值。这使得输出通道的大小减了一半，从 45 x 45 减到 22 x 22。


    如果我们使用未经过卷积处理的原始图像作为全连接层的输入，将会有 27,648 个输入参数（96 x 96 x 3）。因此，两个卷积层将输入参数减少到 7,744（22
    x 22 x 16），减少了约 72%。


    ![](img/main-39.jpg)


    图 4-10：第二卷积层 – 卷积和 MaxPooling。


    ### 全连接层

    在将数据输入全连接层之前，多维 3D 数组（`3D tensor`）被转换为 1D 向量。这为输入层产生了 7,744 个输入值（22 x 22 x 16）。我们在第一个隐藏层使用了
    4,000 个带有 `ReLU` 激活函数的神经元，这大约是输入值的一半。在第二个隐藏层中，我们有 1,000 个神经元。最后一层输出层有 10 个使用 `SoftMax`
    函数的神经元。


    ![](img/main-40.jpg)


    图 4-11：全连接层 – 卷积和 MaxPooling。


    ### 反向传播过程

    在全连接神经网络（`CNNs`）中，每个神经元都有自己的一组权重。相比之下，卷积神经网络（`CNNs`）使用了参数共享，即在整个图像上应用同一个滤波器（`kernel`）。这种方法不仅减少了参数的数量，还提高了效率。此外，`CNNs`
    中的反向传播通过卷积和池化操作保留了输入数据的空间结构。这有助于网络学习边缘、纹理和模式等空间特征。相反，`FNNs` 将输入数据展平为 1D 向量，丢失了任何空间信息，并更难以捕捉图像中有意义的模式。


    ### 参考文献

    * [1] Magnus Ekman, “Learning Deep Learning: Theory and Practice of Neural Networks,
    Computer Vision, Natural Language Processing, and Using TensorFlow”, 2021 年 8
    月 17 日。

    * [2] Yann LeCun, Corina Cortes, Christopher J.C. Burges: The MNIST database of
    handwritten digits. 2010 年 10 月。https://www.lri.fr/~Master2/MNIST_doc.pdf

    * [3] Goodfellow, I., Bengio, Y., & Courville, A. (2016,11.18). Deep Learning.
    MIT Press. https://www.deeplearningbook.org/

    * [4] IBM. (n.d.). What are Convolutional Neural Networks? https://www.ibm.com/think/topics/convolutional-neural-networks

    * [5] Wikipedia contributors. (n.d.). Kirsch operator. Wikipedia. https://en.wikipedia.org/wiki/Kirsch_operator

    * [6] Wikipedia contributors. (n.d.). Prewitt operator. Wikipedia. https://en.wikipedia.org/wiki/Prewitt_operator


    空间特征指的是图像中根据像素位置描述像素之间关系的特征。这些特征捕捉了图像的空间结构，如边缘、纹理和模式。


    # 第 5 章：循环神经网络


    ## 引言

    到目前为止，本书介绍了两种神经网络架构。第一个是前馈神经网络（`FNN`），它适用于简单任务，如识别小型图像中的手写数字。第二个是卷积神经网络（`CNN`），它设计用于处理图像。CNN
    能够在物体位置变化的情况下识别物体。


    本章介绍了循环神经网络（`RNN`）。与 `FNN` 和 `CNN` 不同，`RNN` 的输入不仅包含当前数据，还包含之前处理的所有输入。换句话说，`RNN`
    保留并使用了历史数据。这是通过将上一个时间步的输出连回隐藏层来实现的。虽然 `RNN` 可以预测变长度的序列数据（例如销售数据或患者的历史健康记录），但本章关注
    `RNN` 如何进行基于字符的文本完成。后续章节将探索基于单词的文本预测。


    ## 数据集

    训练 `RNN` 模型通常使用如 IMDB 评论或 Wikipedia 文本语料库等数据集。然而，我们将使用包含单词“alley”的定制数据集来简化过程。图
    5-1 展示了涉及步骤。


    * 1. 将文本拆分为字符：首先，我们将单词拆分为单个字母（例如 a, l, l, e, y）。

    * 2. 索引映射：每个字符都被分配一个索引，将其映射到独热编码向量。例如，字母“a”被分配索引 0，对应于独热向量 `[1, 0, 0, 0]`。

    * 3. 创建序列：最后，我们定义要预测的字符序列。例如，当输入字符为“a”（输入向量 `[1, 0, 0, 0]`）时，模型应该输出字母“l”（输出向量
    `[0, 0, 1, 0]`）。


    ![](img/main-41.jpg)


    图 5-1：循环神经网络 – 文本数据集和独热编码。

