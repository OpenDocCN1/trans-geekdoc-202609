    GPU 本地完成。当所有 GPU 位于同一服务器内时，通常会使用 `NVLink` 等高速互连技术来促进快速的 GPU 间通信。我们将在后面的章节中介绍服务器内部内存传输及其对性能的影响。


    考虑到模型训练可能跨越数天甚至数周，因此 GPU 之间的通信（特别是跨服务器通信）必须是无损且能够维持线率性能的，关键。为了防止网络问题导致训练损失，应该定期保存检查点（模型权重快照）。在梯度交换过程中，即使丢失一个数据包也可能导致模型发散或任务失败，从而需要重新启动。


