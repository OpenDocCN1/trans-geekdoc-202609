  trans: "\n\n# 通过已建立的 TCP Socket 分发 NCCL Unique ID\n\n当所有节点（ranks）都与主进程（节点 ID 0）建立\
    \ TCP 连接后，下一步是分发 NCCL Unique ID。主进程生成此标识符，并通过已建立的 TCP 连接将其发送所有其他节点（1 到 7）。\n\n\
    这些连接通常运行在前端或管理网络上，取决于集群配置。图 14-3 展示了从主进程角度看到的连接状态。\n\nNCCL Unique ID 作为作业的命名空间标识符，确保只有同一个训练作业的进程才能参与同一个通信组。这在多个分布式作业可能在同一组节点并发运行的环境中尤为重要。唯一\
    \ ID 隔离了不同的作业，防止了不相关进程之间的交叉干扰。随后，所有节点使用此唯一 ID 初始化本地的 NCCL 通信器，确保它们加入同一个通信组。分发阶段至关重要：NCCL\
    \ Unique ID 充当了引导机制，允许所有 GPU 进程加入同一个通信组，并参与 all-reduce 和 broadcast 等集合操作。\n\n\
    ![](img/main-142.jpg)\n\n图 14-3：通过 TCP Socket 重新分发 NCCL Unique ID。\n\n![](img/main-143.jpg)![](img/main-144.jpg)\n\
    \n# NCCL Broadcast 集合操作与模型参数同步\n\n此时，每个进程已经拥有模型的本地副本，所有 GPU 都已准备好开始同步训练。第一步是确保每个\
    \ GPU 启动时具有相同的模型参数。NCCL 使用所选的通信拓扑自动处理。\n\n在主进程（节点 0，运行在 Host A 的 GPU 0 上）通过 TCP\
    \ Socket 与所有其他进程共享 NCCL Unique ID 后，NCCL 库会构建树形拓扑。该拓扑用于通过 `Broadcast` 集合操作向所有其他\
    \ GPU 发送模型参数。图 14-4 展示了运行在 Host A GPU 0 上的主进程如何将其模型参数分给所有其他进程。全局节点 ID 为 1-3 的\
    \ GPU 与主进程在同一主机上，因此 NCCL 通过高速 NVLink 进行直接内存拷贝。这些传输在不涉及 CPU 或操作系统的情况下完成，且不需要队列对（Queue\
    \ Pairs），使得节点内通信极其快速且高效。\n\n如果 GPU 位于不同的主机上，NCCL 会建立队列对（QPs），在主进程与远程进程之间创建快速、直接的数据路径。这些连接使用后端网络，在我们的示例中，这是一个路由的三层\
    \ Clos 架构（为了简单起见，此处排除了网络布局）。\n\n![](img/main-145.jpg)\n\n图 14-4：主节点 0 分发模型参数。\n\
    \n# 使用 AllReduce 集合进行梯度同步\n\n同步模型参数后，集群中所有 GPU 同时开始第一次迭代的前向传播。在前向传播过程中，GPU 特有的小批量数据（mini-batches）通过模型的所有层，在每层执行矩阵乘法后进行激活函数操作进行处理。计算出模型输出\
    \ `y` 后，每个 GPU 开始反向传播。假设最后一层有 1024 个参数，每个 GPU 计算这 1024 个参数的梯度。这些梯度存储在一个名为 `bucket`\
    \ 的预留内存区域中。\n\n接下来，每个 GPU 将其 bucket 分为四块，每块包含 256 个梯度（因为 1024 个参数 / 4 个 GPU =\
    \ 256 个梯度）。此时，每个 GPU 拥有四个标记为 `A–D` 的块，每块有 256 个梯度。在单向环形拓扑中使用 `AllReduce` 集合操作时，该操作实现为\
    \ `ReduceScatter` 后接 `AllGather`。\n\n在我们的示例中（如图 14-5 所示），有两个节点（Host A 和 Host B），每个节点有四个\
    \ GPU。每个 GPU 都计算了 1024 个梯度，并将它们组织在 `VRAM` 中的四块（`A–D`）。在此示例中，GPU 0（全局节点 0）负责平均块\
    \ `A`，节点 1（蓝色 GPU 1）负责块 `B`，节点 2（绿色 GPU 0）负责块 `C`，节点 3（黄色 GPU 1）负责块 `D`。节点内 GPU\
    \ 连接使用高速 NVLink，而节点间连接使用 RoCEv2。\n\n![](img/main-146.jpg)\n\n图 14-5：环形拓扑中带有 ReduceScatter\
    \ 和 AllReduce 操作的 AllReduce。\n\n## ReduceScatter：第一次迭代\n\n在图 14-6 中，图 14-5 中的环形拓扑仍然在使用，但\
    \ GPU 采用线性排列，以便更直观地可视化 `AllReduce` 数据流。在 `AllReduce` 操作的 `ReduceScatter` 阶段，每个节点将其负责的块发送给环中的下一个节点：\n\
    \n- `Rank 0` 将 `A0` 发送给 `Rank 1`\n- `Rank 1` 将 `B1` 发送给 `Rank 2`\n- `Rank 2` 将\
    \ `C2` 发送给 `Rank 3`\n- `Rank 3` 将 `D3` 发送给 `Rank 0`\n\n这些块中的每一个包含参数空间特定部分的梯度，随着数据绕环形循环，每个节点负责在所有\
    \ GPU 上对该部分进行归约（即求和）。\n\n![](img/main-147.jpg)[](main-148.jpg)[](main-149.png)[](main-150.jpg)\n\
    \n图 14-6：ReduceScatter：第一次迭代。\n\n图 14-7 显示了 `ReduceScatter` 阶段第一次发送迭代后的梯度同步状态。此时，每个\
    \ GPU 都已将其分配的块发送给环形拓扑中的下一个 GPU，并从邻居处接收了一个块：\n\n- `Rank 0` 从 `Rank 3` 接收了 `D3`\n\
    - `Rank 1` 从 `Rank 0` 接收了 `A0`\n- `Rank 2` 从 `Rank 1` 接收了 `B1`\n- `Rank 3` 从 `Rank\
    \ 2` 接收了 `C2`\n\n在第一次发送（`ReduceScatter` 阶段的第 1 次迭代）之后，每个 GPU 在本地内存中仍持有三个原始块加一个部分归约的块。每个\
    \ GPU 将接收到的块加到其本地相同块的版本中。例如，`rank 0` 将 `D3` 加到 `D0`（`chunk D = D0 + D3`）。这只是第一次归约。为了完成其分配块的完整归约，每个\
    \ GPU 必须在接下来的三次迭代中接收并求加其余 GPU 对应的块。当 `ReduceScatter` 阶段结束时（在 4 GPU 环中迭代三次后），每个\
    \ GPU 正好持有一个完全归约的块，尽管不一定是它原始的那一个。\n\n![](img/main-151.jpg)\n\n 图 14-7：ReduceScatter：第一次迭代后的状态。\n\
    \n## ReduceScatter：第二次迭代\n\n图 14-8 显示了 `ReduceScatter` 阶段的第二次迭代：\n\n- `Rank 0`\
    \ 将部分归约的块 `D`（`D3 + D0`）发送给 `Rank 1`\n- `Rank 1` 将部分归约的块 `A`（`A0 + A1`）发送给 `Rank\
    \ 2`\n- `Rank 2` 将部分归约的块 `B`（`B1 + B2`）发送给 `Rank 3`\n- `Rank 3` 将部分归约的块 `C`（`C2\
    \ + C3`）发送给 `Rank 0`\n\n![](img/main-152.jpg)[](main-153.jpg)[](main-154.jpg)[](main-155.jpg)[](main-156.jpg)\n\
    \n图 14-8：ReduceScatter：第二次迭代。\n\n![](img/main-157.jpg)\n\n在第二次 `ReduceScatter`\
    \ 迭代后，每个节点现在持有：\n\n- 一个已归约两次的块（本地块 + 两个远程块）\n- 两个尚未参与任何通信的原始块\n- 一个在本次迭代中发送出的块\n\
    \n以下是每个节点的具体状态：\n\n**Rank 0:**\n- 持有部分归约块 `C = C2 + C3 + C0`（刚从 `Rank 3` 接收并加到本地\
    \ `C0`）\n- 仍持有原始块 `A0` 和 `B0`\n- 发出了块 `D = D3 + D0`\n\n**Rank 1:**\n- 持有部分归约块\
    \ `D = D3 + D0 + D1`\n- 仍持有原始块 `B1` 和 `C1`\n- 发出了块 `A = A0 + A1`\n\n**Rank 2:**\n\
    - 持有部分归约块 `A = A0 + A1 + A2`\n- 仍持有原始块 `C2` 和 `D2`\n- 发出了块 `B = B1 + B2`\n\n"
