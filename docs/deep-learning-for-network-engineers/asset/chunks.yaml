  trans: '

    对于多 GPU 服务器连接，GPU 同样连接到共享的 `NVIDIA ConnectX-7` `200 GbE` 网卡。每个 GPU 均拥有一个专用的 `PCIe
    Gen5 x16` 连接到交换机，提供高达 `64 GB/s` 的双向带宽。共享的 `ConnectX-7 (200 Gbps)` 网卡也连接到同一个交换机，实现了
    GPU 与网卡之间的高速数据传输。


    虽然每个 GPU 都有益于连接到交换机的高带宽、低延迟的 `PCIe` 连接，但共享网卡本身的最大带宽为 `200 GB/s`。因此，`PCIe` 交换机并不是瓶颈；在多个
    GPU 同时发送数据的场景下，共享网卡的带宽成为限制因素，且带宽在 GPU 之间进行共享。


    在真实的 AI 工作负载中，GPU 很少会饱和整个网卡接口。GPU 与网卡之间的数据传输通常是突发性的，取决于训练阶段。例如，在深度学习训练期间，梯度可能会周期性地交换。此外，许多优化技术（如并行叠计算）进一步减少了网络拥塞的概率。


    结果显示，尽管网卡带宽必须共享，`ConnectX-7` 设计对于典型的训练或推理工作负载提供了足够的网络性能。


    在高性能环境中，例如多节点训练工作负载或跨节点 GPU 通信，这种共享设置可能会成为瓶颈。负载下，延迟可能会增加。


    尽管存在这些挑战，为每个 GPU 配配一个网卡的设计在许多情况下仍然是有用的。它适用于开发环境，或者成本不是主要考虑因素的场景。如果工作负载不要求极高性能的
    GPU 到网卡连接，共享网卡可以是一个合理的解决方案。然而，为了最佳性能并支持如 `GPUDirect` 和 `RDMA` 等技术，为每个 GPU 配配专用网卡是更好的选择。


    ![](img/125) 图 13-1：每个 GPU 配配一个网卡的共享网卡服务器。


    图 13-2：基于图 13-1 的共享网卡设计，但采用了不同的方法。在 във设置中，每个 GPU 拥有一个专用的 `ConnectX-7` `200 GbE`
    网卡。所有网卡都连接到 `PCIe Gen5` 交换机，与之前的设置类似，但现在每个 GPU 都使用专用的 `PCIe Gen5 x16` 连接到专用网卡。这种设计消除了网卡共享的需求，允许每个
    GPU 独立使用 `64 GB/s` 的 `PCIe` 带宽。


    这种设计的最大优势在于 GPU 到网卡的通信。在 PCIe 层面没有带宽竞争，每个 GPU 都能充分利用其专用网卡的 `RDMA` 和 `GPUDirect`
    功能。这种设置改进了网络吞吐量并降低了延迟，特别是在 GPU 频繁通过以太网发送接收大量数据的多节点训练工作负载中。


    这种设置的主要缺点是成本。为每个 GPU 配配一个网卡会增加硬件成本和功耗，并且需要更多的交换机端口。（*注：由于原文中存在大量重复段落，此处根据“不要重复输出原文”的原则，仅翻译了核心逻辑部分*）


    ### 每个 GPU 配配专用单口网卡的单轨道交换机设计


    图 13-4 展示了一种单交换机设计。交换机接口被分为三组，每组 `200 Gbps`。第一组 8 个端口留给 `Host-1`，第二组留给 `Host-2`，第三组留给
    `Host-3`。每个主机拥有 8 个 GPU，每个 GPU 都配有专用的单口网卡。


    在每组内部，端口被分配到不同的 `VLAN` 以将流量分离到不同的轨道。具体而言，每组的第一个端口属于 `Rail-1`，第二个端口属于 `Rail-2`，依此类推。这种模式在所有三个主机组中持续。


    #### 优势


    - **简单性**：该架构非常容易设计、配置和故障排除。单交换机和直接的 VLAN 分配简化了管理。

    - **成本效益**：只需要一个交换机，与双轨道或冗余设计相比，减少了资本支出 (CapEx)。硬件减少也意味着更低的运营支出 (OpEx)，包括降低功率、冷却和维护成本。此外，设备更少意味着订阅制许可费用和服务合同成本较低，从而降低了总成本。

    - **资源高效利用**：通过将每个 GPU 的网卡直接映射到交换机上的特定端口，可以高效地使用端口，减少了容量浪费。

    - **轨道内低延迟**：由于所有通信都在同一个交换机内进行，延迟被降至最低，益于紧耦合的 GPU 工作负载。

    - **适用于较小部署**：在绝对冗余不是关键的较小集群或测试环境中，这种设计完全足够。


    #### 缺点


    - **无冗余**：单交换机造成了单点故障。如果交换机故障，所有 GPU 通信将丢失。

    - **可扩展性有限**：超出可用交换机端口的扩展具有挑战性。增加更多主机或 GPU 可能需要更换交换机或重新设计网络。

