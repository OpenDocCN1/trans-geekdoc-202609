  trans: '

    由于交换机无法以线线速率转发所有数据，它会将某些数据包存储在缓冲区，导致拥塞。类似的拥塞也可能发生在 spine 交换机上。正如第 12 章前面解释过的，出口缓冲区溢出可能会触发
    `ECN`（显式拥塞通知）和 `PFC`（优先级流控制）机制以防止丢包。


    ![](img/main-118.jpg)


    图 12-4：三层负载均衡。


    ## 基于流的自适应负载均衡


    自适应路由是一种动态方法，能够积极监控链路利用率并实时对网络拥塞做出响应。在图 12-5 中，`5-tuple` 哈希算法初始为所有流（flowlets）选择相同的上行链路，与上一个示例相同。然而，一旦
    `Rail-1` 和 `Spine-1` 之间交换机链路的利用率超过阈值，自适应路由机制会检测到负载增加，并将某些流重定向到通过 `Spine-2` 的另一条拥塞程度的路径。


    通过将流分布在多个路径上，自适应路由有助于减少缓冲区堆积并避免潜在的丢包。这不仅提高了整个织网的链路利用率，还有助于维持如 `RDMA-based gradient
    synchronization` 等等时间敏感型操作的一致吞吐量。在 AI 工作负载中，延迟或丢包可能会减慢甚至中断训练，自适应路由在维护系统性能方面起着至关重要的作用。


    ![](img/main-119.jpg)


    图 12-5：动态流均衡。


    ## 基于数据包的数据包喷洒负载均衡


    数据包喷洒（Packet spraying）是一种负载均衡方法，将来自同一流的单个数据包分布在多个等成本路径上。其理念是均匀地使用所有可用链路，减少单路径发生拥塞的概率。


    然而，在基于 `RoCEv2` 的 AI 后端网络中，数据包喷洒面临着严峻挑战。`RoCEv2` 依赖于无损且有序的数据包交付。当包被洒到不同路径上时，它们可能会无序到达目的地。这种数据包重排序可能会破坏
    RDMA 操作并降低 GPU 到 GPU 通信的整体性能。


    ![](img/main-120.jpg)


    图 12-6：数据包喷洒：OpCode：`RDMA Write First, Middle, and Last`。


    ### RDMA 仅写


    从 `ConnectX-5` 开始的 NVIDIA `RDMA NICs` 支持 `RDMA Write Only` 操作，每个数据包中包含一个 `RETH`
    头部。图 12-7 显示了 `RDMA NIC` 如何在每条消息的 `IBTH` 头部中使用 `OpCode: RDMA Write Only`。通过此 `OpCode`，每条消息还包含一个
    `RETH` 头部，该头部包含为负载中携带的数据预留的目标机内存块的信息。这允许接收端 `RDMA NIC` 直接将数据写入正确的内存位置，而无需依赖传输序列中之前的消息。


    当 `RDMA Write Only` 与使用数据包喷洒的 `Packet-Based Load Balancing` 时，会带来显著收益。由于每个数据包都是自包含的且包含了完整的内存地址信息，网络织网可以在不同路径上转发单个数据包，而无需担心数据包顺序或上下文丢失。这实现了真正的流级甚至是逐包的负载均衡，有助于将流量更均匀地分布在可用链路上，避免热点并减少队列延迟。


    ![](img/main-121.jpg)![](img/main-122.jpg)![](img/main-123.jpg)![](img/main-124.jpg)


    图 12-7：数据包喷洒：OpCode：`TDMA Write Only`。


    ## 在 Cisco Nexus 交换机上配置逐包负载均衡


    在编写时，从 `NX-OS` 版本 `10.5(1)F` 开始的 Cisco `Nexus 9000 系列 Cloud Scale` 交换机（`9300-FX3`、`GX`、`GX2`
    和 `HX-TOR`）支持动态负载均衡（`DLB`）包括基于流和逐包（数据包喷洒）负载均衡。在 IP 路由和 `VXLAN` 织网中的三层物理接口上，`DLB`
    支持单播 `IPv4` 和 `IPv6` 流量。


    当启用 `DLB` 时，出口 QoS 和访问策略将不应用于使用 `DLB` 的流。同样，在出口接口上配置的 `TX SPAN` 不会捕获 `DLB` 流量。有关硬件和软件支持详情，请参考
    Cisco 官方文档。


    示例 12-1 显示了启用逐包负载均衡的基本配置：


    ```

    switch(config)# hardware profile dlb

    switch(config-dlb)# dlb-interface Eth1/1

    switch(config-dlb)# dlb-interface Eth1/2

    switch(config-dlb)# mac-address aa:bb:cc:dd:ee:ff

    switch(config-dlb)# mode per-packet

    ```


    示例 12-1：配置逐包负载均衡（数据包喷洒）。


    注意：`DLB MAC` 充当虚拟下一跳 MAC 地址。它没有绑定到任何特定的物理接口。这使得 MAC 与接口解耦，允许交换机为每个数据包选择不同的出口。`DLB
    MAC` 必须在所有参与的交换机上配置。


    参考文献


    * [1] V. Xu, et al., “Adaptive”, February 25, 2024.

    * [2] Paul Congdon, Yolanda Yu, “Lossless Network for Data Centers”, March 18.

    * [3] Advait Dixit, et al., “Impact of Packet Spraying”, Purdue University.

    * [4] Chu Chen, et al., “HF²: RDMA Fine-Tuning”.

    * [5] Cisco Nexus 9000 Series NX-OS Guide.

    [/content]


