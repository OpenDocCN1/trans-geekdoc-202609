    # 第 4 章：卷积神经网络


    ## 引言


    前一章节解释了如何使用前馈神经网络（FNNs）对 MNIST 数据集中的 28 x 28 像素手写数字进行多分类。虽然 FNN 处理此类任务效果良好，但在处理更大的、高分辨率的彩色图像时，它们存在显著局限性。


    在神经网络术语中，图像的每个 RGB 值被视为一个输入特征。例如，一张尺寸为 3.937 x 3.937 英寸的高分辨率 600 dpi 彩色图像包含约 558
    万像素，产生大约 1700 万个 RGB 值。


    如果我们使用全连接 FNN 进行训练，所有这 1700 万个输入值都会馈到第一个隐藏层的每一个神经元中。每个神经元必须根据这 1700 万个输入计算加权和。存储权重所需的内存取决于所使用的数值精度格式。例如，使用
    16 位浮点（FP16）格式时，每个权重需要 2 字节。因此，每个神经元的内存需求约为 32 MB。如果第一个隐藏层有 10,000 个神经元，存储该层权重所需的总内存将达到
    316 GB GB。


    相比之下，卷积神经网络（CNNs）在卷积层内的所有神经元之间使用称为内核（或滤波器）的共享权重矩阵。例如，如果我们使用 3 x 3 卷积核，每个颜色通道只有
    9 个权重。这在正向和反向传播过程中都显著减少了内存占用和计算成本。


    FNN 用于图像识别的另一个局限性是它们将每个像素视为一个独立单元。因此，FNN 无法捕捉像素之间的空间关系，导致它们在物体在帧内移动时无法识别同一物体。此外，FNN
    无法检测边缘或其他重要特征。另一方面，CNN 具有名为“平移不变性”的属性，这允许模型即使在轻微移动（沿 x 和 y 轴的小位移）的情况下也能识别模式。这有助于
    CNN 更准确地分类对象。此外，CNN 对微小的旋转或缩放变化更具鲁棒性，尽管它们可能仍需要数据增强或专门的网络架构来处理更复杂的变换。


    ## 卷积层


    ### 卷积过程


    卷积过程目的是从图像中提取特征，并在通过全连接层之前减少输入参数的数量。卷积操作使用称为内核或滤波器的共享权重矩阵，并在卷积层的所有神经元之间共享。在该示例中，我们使用了
    Prewitt 算子，它由两个 3 x 3 卷积核组成，具有固定权重值，用于检测垂直和水平边缘。


    在第一步中，这两个卷积核置于输入图像的第一个区域上，每个像素值与相应的内核权重相乘。接下来，过程计算加权和 `z=0`，并将结果通过 `ReLU` 激活函数。生成的激活值
    `ff(z)=0` 贡献于基于神经元的输出通道。


    由于我们的输入图像是没有任何通道的灰度图像（与 RGB 图像不同），它只有一个输入通道。通过使用两个内核，我们得到了两个输出通道：一个用于检测垂直边缘，另一个用于检测水平边缘。计算输出通道大小的公式：


    高度 = (图像 h – 卷积核 h)/步长 (Stride)


    宽度 = (图像 w – 卷积核 w)/步长 (Stride)


    ![](img/main-30.jpg)


    图 4-1：卷积层——步长一


    在第一步中，这两个卷积核置于输入图像的第一个区域上，每个像素值与相应的内核权重相乘。接下来，过程计算加权和 `z=0`，并将结果通过 `ReLU` 激活函数。生成的激活值
    `ff(z)=0` 贡献于基于神经元的输出通道。


    由于我们的输入图像是没有任何通道的灰度图像（与 RGB 图像不同），它只有一个输入通道。通过使用两个内核，我们得到了两个输出通道：一个用于检测垂直边缘，另一个用于检测水平边缘。计算输出通道大小的公式：


    高度 = (图像 h – 卷积核 h)/步长 (Stride) = (6-3)/1 + 4


    宽度 = (图像 w – 卷积核 w)/步长 (Stride) = (6-3)/1 + 4


    在第一步中，这两个卷积核置于输入图像的第一个区域上，每个像素值与相应的内核权重相乘。接下来，过程计算加权和 `z=0`，并将结果通过 `ReLU` 激活函数。生成的激活值
    `ff(z)=0` 贡献于基于神经元的输出通道。


    由于我们的输入图像是没有任何通道的灰度图像（与 RGB 图像不同），它只有一个输入通道。通过使用两个内核，我们得到了两个输出通道：一个用于检测垂直边缘，另一个用于检测水平边缘。计算输出通道大小的公式：


    高度 = (图像 h – 卷积核 h)/步长 (Stride) = (6-3)/1 + 4


    宽度 = (图像 w – 卷积核 w)/步长 (Stride) = (6-3)/1 + 4


    在第一步中，这两个卷积核置于输入图像的第一个区域上，每个像素值与相应的内核权重相乘。接下来，过程计算加权和 `z=0`，并将结果通过 `ReLU` 激活函数。生成的激活值
    `ff(z)=0` 贡献于基于神经元的输出通道。


    由于我们的输入图像是没有任何通道的灰度图像（与 RGB 图像不同），它只有一个输入通道。通过使用两个内核，我们得到了两个输出通道：一个用于检测垂直边缘，另一个用于检测水平边缘。计算输出通道大小的公式：


    高度 = (图像 h – 卷积核 h)/步长 (Stride) = (6-3)/1 + 4


    宽度 = (图像 w – 卷积核 w)/步长 (Stride) = (6-3)/1 + 4


    ![](img/main-31.jpg)


    图 4-2：卷积层——步长二


    ![](img/main-32.jpg)


    图 4-3：卷积层——步长五


    在 main 步中，卷积核向右移动一步（步长为 1）以覆盖下一个区域。通过 `ReLU` 激活函数的输出对于第一个输出通道为 `ff(z)=99`；第二个输出通道为
