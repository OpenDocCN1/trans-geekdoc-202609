    \ (`Sum of A0 + A1 + A2`) to `Rank 3`.\n* `Rank 3` sends the partially averaged\
    \ chunk `B` (`Sum of B1 + B2 + B3`) to `Rank 0`.\n\n![](main-168.jpg)[](main-169.jpg)\n\
    \nFigure 14-10: ReduceScatter: the Third Iteration.\n\nAfter the third `ReduceScatter`\
    \ iteration, the `ReduceScatter` phase is complete. Each rank now holds one fully\
    \ reduced chunk, which includes contributions from all four GPUs. However, these\
    \ fully reduced chunks are not located on their original owner ranks. Each rank\
    \ receives one final chunk and completes its reduction by summing it with its\
    \ local copy. At this point:\n\n* `Rank 0` holds fully reduced chunk `B = B1 +\
    \ B2 + B3 + B0`\n* `Rank 1` holds fully reduced chunk `C = C2 + C3 + C0 + C1`\n\
    * `Rank 2` holds fully reduced chunk `D = D3 + D0 + D1 + D2`\n* `Rank 3` holds\
    \ fully reduced chunk `A = A0 + A1 + A2 + A3`\n\n![](main-170.jpg)[](main-171.png)[](main-172.png)[](main-173.jpg)\n\
    \nFigure 14-11: ReduceScatter: Chunks After the Third Iteration.\n\nThe `ReduceScatter`\
    \ operation is the first step in the `Ring AllReduce` process and is responsible\
    \ for aggregating gradient data across all GPUs in a distributed training setup.\
    \ Its goal is to compute the sum (or average) of each gradient. At the end of\
    \ the `ReduceScatter` phase:\n\n* Each GPU holds one fully reduced chunk, which\
    \ includes contributions from all four GPUs.\n* The reduced chunk is not necessarily\
    \ local to the GPU that now holds it, it’s owned by a different rank.\n\n### AllGather:\
    \ The first Iteration\n\nNow that the `ReduceScatter` phase has completed, the\
    \ `AllGather` phase begins. Its job is to distribute the fully reduced chunks\
    \ back to all GPUs, so that each one ends up with a complete, synchronized copy\
    \ of all gradients, ready to be used to update the model.\n\nIn the first iteration\
    \ of `AllGather`:\n\n* Each GPU sends the fully reduced chunk it currently holds\
    \ to the next GPU in the ring.\n* At the same time, it receives a new reduced\
    \ chunk from the previous GPU.\n\nHere’s what happens on each rank during this\
    \ iteration:\n\n* `Rank 0` sends reduced chunk `B` to `Rank 1` and receives chunk\
    \ `A` from `Rank 3`.\n* `Rank 1` sends reduced chunk `C` to `Rank 2` and receives\
    \ chunk `B` from `Rank 0`.\n* `Rank 2` sends reduced chunk `D` to `Rank 3` and\
    \ receives chunk `C` from `Rank 1`.\n\n![](main-174.jpg)\n\nFigure 14-12: AllGather:\
    \ The First Iteration.\n\nEach rank now holds two reduced chunks: the one originally\
    \ during `ReduceScatter`, and one received from its neighbor. This process continues\
    \ for three iterations, after which all GPUs will have a complete set of gradients.\n\
    \n![](main-175.jpg)[](main-176.jpg)[](main-177.jpg)[](main-178.jpg)[](main-179.jpg)\n\
    \nFigure 14-13: AllGather: The First Iteration.\n\n### AllGather: The Second Iteration\n\
    \nIn the second iteration, each GPU sends the most received chunk to the next\
    \ GPU. This continues the process of distributing fully reduced chunks to all\
    \ peers.\n\nHere’s what happens:\n\n* `Rank 0` sends reduced chunk `A` (received\
    \ from `Rank 3`) to `Rank 1`.\n* `Rank 1` sends reduced chunk `B` (received from\
    \ `Rank 0`) to `Rank 2`.\n* `Rank 2` sends reduced chunk `C` (received from `Rank\
    \ 1`) to `Rank 3`.\n* `Rank 3` sends reduced chunk `D` (received from `Rank 2`)\
    \ to `Rank 0`.\n\n![](main-180.jpg)\n\nFigure 14-14: AllGather: The Second Iteration.\n\
    \nEach rank now holds three reduced chunks:\n\n* `Rank 0` has `A`, `B`, and `D`.\n\
    * `Rank 1` has `B`, `C`, and `A`.\n* `Rank 2` has `C`, `D`, and `B`.\n* `Rank\
    \ 3` has `D`, `A`, and `C`.\n\n![](main-181.jpg)[](main-182.jpg)[](main-183.jpg)[](main-184.jpg)[](main-185.jpg)\n\
    \nFigure 14-15: AllGather: Chunks After the Second Iteration.\n\n### AllGather:\
    \ Third Iteration\n\nIn the final `AllGather` iteration, each GPU sends the chunk\
    \ it received during the second iteration to the next GPU. After this operation,\
    \ all GPUs have all four chunks.\n\n* `Rank 0` sends chunk `C` to `Rank 1`.\n\
    * `Rank 1` sends chunk `D` to `Rank 2`.\n* `Rank 2` sends chunk `A` to `Rank 3`.\n\
    * `Rank 3` sends chunk `B` to `Rank 0`.\n\n![](main-186.jpg)[](main-187.jpg)[](main-188.jpg)[](main-189.jpg)[](main-190.jpg)\n\
    \nFigure 14-16: AllGather: The Third Iteration.\n\n### Finalizing the AllReduce\
    \ Operation\n\nAt the end of the `AllGather` phase, each GPU holds a complete,\
    \ fully reduced set of all gradients, in our example, 1024 values that represent\
    \ the sum of corresponding gradients from all GPUs. This means the synchronization\
    \ is now complete: all GPUs have identical gradient vectors, and model consistency\
    \ across the cluster is guaranteed. \n\nHowever, the goal of distributed training\
    \ is typically to compute the average gradient, not the sum. To achieve this,\
    \ each GPU simply divides each of the 1024 values by the number of participating\
    \ GPUs, in our case, four. This is a local operation, performed independently\
    \ on each GPU, without further communication.\n\nBecause all GPUs perform this\
    \ averaging on the same data, the result remains consistent across the cluster.\
    \ No additional synchronization is needed after this step. The model is now ready\
    \ for a consistent weight update across all GPUs, and the next training iteration\
    \ can begin.\n"
  trans: '


    * 持有部分还原的块 `B = B1 + B2 + B3`

    * 仍然保留原始块 `A3` 和 `D3`

    * 发送块 `C = C2 + C3`


    ![](img/main-158.jpg)[](main-159.jpg)[](main-160.jpg)[](main-161.jpg)[](main-162.jpg)[](main-163.jpg)[](main-164.jpg)[](main-165.png)[](main-166.png)[](main-167.jpg)


    图 14-9: ReduceScatter：第二次迭代后的块（Chunks）。


    ### ReduceScatter：第三次迭代


    图 14-10 显示了 `ReduceScatter` 阶段的第三次迭代：


    * `Rank 0` 将部分平均的块 `C`（`Sum of C2 + C3+ C0`）发送到 `Rank 1`。

    * `Rank 1` 将部分平均的块 `D`（`Sum of D3 + D0 + D1`）发送到 `Rank 2`。

    * `Rank 2` 将部分平均的块 `A`（`Sum of A0 + A1 + A2`）发送到 `Rank 3`。

    * `Rank 3` 将部分平均的块 `B`（`Sum of B1 + B2 + B3`）发送到 `Rank 0`。


    ![](img/main-168.jpg)[](main-169.jpg)


    图 14-10: ReduceScatter：第三次迭代。


    在第三次 `ReduceScatter` 迭代之后，`ReduceScatter` 阶段完成。每个 rank 现在持有一个完全还原的块，包含了所有四个 GPU
    的贡献。然而，这些完全还原的块并不位于它们原始的所有者 rank 上。每个 rank 接收一个最终块，并通过将其与本地副本求和来完成还原。此时：


    * `Rank 0` 持有完全还原的块 `B = B1 + B2 + B3 + B0`

    * `Rank 1` 持有完全还原的块 `C = C2 + C3 + C0 + C1`

    * `Rank 2` 持有完全还原的块 `D = D3 + D0 + D1 + D2`

    * `Rank 3` 持有完全还原的块 `A = A0 + A1 + A2 + A3`


    ![](img/main-170.jpg)[](main-171.png)[](main-172.png)[](main-173.jpg)


    图 14-11: ReduceScatter：第三次迭代后的块（Chunks）。


    `ReduceScatter` 操作是 `Ring AllReduce` 过程的第一步，负责在分布式训练设置中聚合所有 GPU 的梯度数据。它的目标是计算每个梯度的和（或平均值）。在
    ReduceScatter` 阶段结束时：


    * 每个 GPU 持有一个完全还原的块，包含了所有四个 GPU 的贡献。

    * 还原后的块并不一定位于当前持有它的 GPU 本地，它属于一个不同的 rank。


    ### AllGather：第一次迭代


    现在 `ReduceScatter` 阶段已经完成，`AllGather` 阶段开始。它的工作是将完全还原的块分发回所有 GPU，以便每个 GPU 最终获得一个完整的、同步的梯度副本，准备用于更新模型。


    在 `AllGather` 的第一次迭代中：


    * 每个 GPU 将其当前持有的完全还原的块发送到环形中的下一个 GPU。

    * 同时，它会从上一个 GPU 接收一个新的还原块。


    以下是在此迭代中每个 rank 发生的情况：


    * `Rank 0` 将还原块 `B` 发送到 `Rank 1`，并从 `Rank 3` 接收块 `A`。

    * `Rank 1` 将还原块 `C` 发送到 `Rank 2`，并从 `Rank 0` 接收块 `B`。

    * `Rank 2` 将还原块 `D` 发送到 `Rank 3`，并从 `Rank 1` 接收块 `C`。


    ![](img/main-174.jpg)


    图 14-12: AllGather：第一次迭代。


    每个 rank 现在有两个还原块：一个是 `ReduceScatter` 期间原始的，另一个是从邻居那里接收的。这个过程将持续三次迭代，之后所有 GPU 将拥有一组完整的梯度。


    ![](img/main-175.jpg)[](main-176.jpg)[](main-177.jpg)[](main-178.jpg)[](main-179.jpg)


    图 14-13: AllGather：第一次迭代。


    ### AllGather：第二次迭代


    在第二次迭代中，每个 GPU 将最近收到的块发送到下一个 GPU。这继续了将完全还原的块分发给所有节点的过程。


    以下是发生的情况：


    * `Rank 0` 将还原块 `A`（从 `Rank 3` 接收）发送到 `Rank 1`。

    * `Rank 1` 将还原块 `B`（从 `Rank 0` 接收）发送到 `Rank 2`。

    * `Rank 2` 将还原块 `C`（从 `Rank 1` 接收）发送到 `Rank 3`。

    * `Rank 3` 将还原块 `D`（从 `Rank 2` 接收）发送到 `Rank 0`。


    ![](img/main-180.jpg)


    图 14-14: AllGather：第二次迭代。


    每个 rank 现在持有三个还原块：


    * `Rank 0` 拥有 `A`、`B` 和 `D`。

    * `Rank 1` 拥有 `B`、`C` 和 `A`。

    * `Rank 2` 拥有 `C`、`D` 和 `B`。

    * `Rank 3` 拥有 `D`、`A` 和 `C`。


    ![](img/main-181.jpg)[](main-182.jpg)[](main-183.jpg)[](main-184.jpg)[](main-185.jpg)


    图 14-15: AllGather：第二次迭代后的块（Chunks）。


    ### AllGather：第三次迭代


    在最后一次 `AllGather` 迭代中，每个 GPU 将其在第二次迭代中收到的块发送到下一个 GPU。此操作之后，所有 GPU 都拥有所有的块。


    * `Rank 0` 将块 `C` 发送到 `Rank 1`。

    * `Rank 1` 将块 `D` 发送到 `Rank 2`。

    * `Rank 2` 将块 `A` 发送到 `Rank 3`。

    * `Rank 3` 将块 `B` 发送到 `Rank 0`。


    ![](img/main-186.jpg)[](main-187.jpg)[](main-188.jpg)[](main-189.jpg)[](main-190.jpg)


    图 14-16: AllGather：第三次迭代。


    ### 完成 AllReduce 操作


    在 `AllGather` 阶段结束时，每个 GPU 都持有一个完整的、完全还原的梯度集合，在我们的示例中，1024 个值代表了所有 GPU 对应梯度的和。这意味着同步已经完成：所有
    GPU 拥有相同的梯度向量，保证了集群内模型的一致性。


    然而，分布式训练的目标通常是计算平均梯度，而不是和。为了实现这一点，每个 GPU 只需将 1024 个值中的每个值除以参与 GPU 的数量（在本例中为四个）。这是一个本地操作，在每个
    GPU 上独立执行，无需进一步的通信。


    由于所有 GPU 都在相同的数据上进行平均值计算，结果在集群中保持一致。此步之后不需要额外的同步。模型现在准备好在所有 GPU 上进行一致的权重更新，并可以开始下一次训练迭代。


