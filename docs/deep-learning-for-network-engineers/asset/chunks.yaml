    正如引言所示，词嵌入向量并不直接作为第一个解码器的输入。相反，它与预训练的 `Query`、`Key` 和 `Value` 权重矩阵相乘。这种矩阵乘法的结果（即点积）产生了
    `Query`、`Key` 和 `Value` 向量，这些向量作为输入并通过 Transformer 处理。图 7–9 显示了该过程的基本工作流。


    ![](img/main-60.jpg)


    图 7-9：Query、Key 和 Value 向量。


    让我们用数字仔细观察这一过程。在对输入词进行分词并应用位置编码后，我们得到了最终的 5 维词矩阵。为了减少计算周期，该过程将 `Query` 向量的维度从
    5 降到 3。由于我们希望 `Query` 向量是三维的，使用了三个 5 维列向量，每个向量都与词向量相乘。


    ![](img/main-61.jpg)


    图 7-10：计算 Query 向量。


    图 7–11 展示了计算过程，其中词向量的每个分量与其在 `Query` 权重矩阵中对应的分量相乘。这些结果的加权和形成了一个三维 `Query` 向量。`Key`
    和 `Value` 向量使用相同的方法计算。在 Transformer 模型的自注意力层中，所有词（标记）都使用相同的 `Query`、`Key` 和 `Value`
    (`Q, K, V`) 权重矩阵。这确保了每个标记以相同的方式被处理，保持了注意力计算的一致性。然而，Transformer 中的每个解码层都有自己特定的
    `Q`、`K` 和 `V` 权重矩阵，这意味着每一层都在学习输入标记的不同变换，允许深层能够捕获更抽象的表示。


    ![](img/main-62.jpg)


    图 7-11：计算 Query 向量。


    ### 注意力层


    图 7-12 展示了在计算 `Query`、`Key` 和 `Value` 向量后，注意力层前三个分量发生的情况。在这个例子中，我们关注单词“clear”，并尝试预测下一个词。它的
    `Query` 向量与其自身的 `Key` 向量相乘，并与为前面的词生成的所有 `Key` 向量相乘。每次乘法都会产生自己的分数。注意，图中显示的分数值是理论上的，并非来自实际的
    `Qv × Kv` 矩阵乘法；然而，其余值是基于这些计算的。此外，在示例中，我们使用一维值（而不是实际向量）来保持图表和计算的简单。现实中，这些是 n 维向量。


    在 `Qv × Kv` 矩阵乘法之后，得到的分数除以向量深度的平方根，得到 logits，即 softmax 函数的输入值。然后，softmax 函数计算每个
    logit 的指数（使用欧拉数，约 2.71828），并将每个结果除以所有指数之和。例如，对应于第一个词的数值 3.16 被除以 482.22，得到 0.007
    的概率。注意，概率之和为 1.0。Softmax 确保注意力分数之和为 1，使其可以作为概率具有可解释性，并帮助模型在生成输出时决定应该关注哪些输入标记。在我们的示例中，单词“clear”的标记在此阶段具有最高概率。单词“decided”具有第二高概率分数（0.210），这表明具有最高概率分数（0.665）的“clear”的语义可以解释为回答问题的动词：“她决定做什么？”


    ![](img/main-63.jpg)


    图 7-12：注意力层，前三个步骤。


    接下来，将 SoftMax 概率与每个标记的 Value 向量相乘（矩阵乘法）。得到的向量随后求和，产生与单词“clear”相关的上下文向量（Context
    vector）。注意，Value 向量的分量是示例值，并非来自实际计算。


    ![](img/main-64.jpg)


    图 7-13：注意力层，第四步。


    ### 加与归一化 (Add & Normalization)


    作为最后一步，包含位置编码的词向量通过残差连接（Residual Connection）加到上下文向量。然后将结果通过归一化处理，将向量的分量求和并除以向量维度，得到平均值
    (`µ`)）。然后使用该平均值计算标准差：从三个向量分量中的每一个减去平均值，并对结果进行平方。然后将这些平方值求和，除以 3（向量维度），该结果的平方根给出
    Add & Normalize 层的最终输出向量 `[1.40, -0.55, -0.87]`。


    ![](img/main-65.jpg)


    图 7-14：Add & Normalize 层 – 残差连接与层归一化。


    ### 前馈神经网络 (Feed Forward Neural Network)


    在解码器模块中，前馈神经网络使用 Add & Normalize 层的输出向量作为输入。在我们的示例中，FFNN 的输入层为向量的每个分量有一个神经元。该层仅将输入值传递到隐藏层，每个神经元首先计算加权和，然后应用
    ReLU 激活函数。在我们的示例中，隐藏层包含九个神经元（输入神经元数量的三倍）。隐藏层的输出随后馈到输出层，神经元再次计算加权和并应用 ReLU 激活函数。注意，在基于
    Transformer 的解码器中，FFNN 应用于每个标记。这意味着来自注意力层的每个标记通过相同的权重单独处理。


    ![](img/main-66.jpg)


    图 7-15：全连接前馈网络。


    最终解码器输出在 Add & Normalize 层中计算，类似于注意力层。这产生了解码器输出，作为下一个解码器模块的输入。


    ![](img/main-67.jpg)


    图 7-16：Add & Normalize 层。


    ### 下一个词概率计算 – Soft 函数


    解码器模块的输出并不代表下一个词。相反，它必须被转换为整个词表上的概率分布。首先，解码器输出通过一个权重矩阵映射到一个新向量，其中每个元素对应词表中的一个词。例如，在图
    7-17 中，词表包含 12 个词。这些词被分词并与其词嵌入关联。也就是说，词嵌入矩阵作为权重矩阵。


    ![](img/main-68.jpg)


    图 7-17：隐藏状态向量与词嵌入矩阵。


    图 7-18 展示了解码器输出向量（即隐藏状态 `h`）如何与词向量相乘以产生一个新的 logits 向量。


    |  ||  ||  ||  ||  |

    | --- | --- | --- | --- | --- |

    |  ||  ||  ||  ||  |

    |  ||  ||  ||  ||  |

    |  ||  ||  ||  ||  |

    |  ||  ||  ||  ||  |

    |  ||  ||  ||  ||  |

    |  ||  ||  ||  ||  |

    |  ||  ||  | |

    |  ||  ||  ||  ||  |

    |  ||  ||  ||  ||  |

    |  ||  ||  ||  ||  |

    |  ||  ||  ||  ||  |

    |  ||  ||  ||  ||  |

    |  ||  ||  ||  ||  |


    |


    图 7-18：Logits 计算 – 隐藏状态与完整词表的点积。


    接下来，将 SoftMax 函数应用于 logits。该函数通过对每个 logit 取指数并对以所有指数值之和进行归一化，将 logits 转换为概率。结果是一个概率分布，其中每个值代表选择特定词作为下一个标记的概率。

