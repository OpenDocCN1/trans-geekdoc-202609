    # Chapter 14: GPU Cluster Communication Model


    The focus of this chapter is to describe what is needed to start a training job
    and give an overview what happens during the job. In that sense, this is a kind
    of closing chapter for our “Deep Learning in AI DC journey”. Figure 14-1 shows
    a high-level, yet simplified architecture and the main building blocks of two
    GPU hosts, each with four GPUs and their external network connections. Both hosts
    are part of the same training cluster. As a prerequisite in our example, the following
    software packages are installed on both hosts:


    PyTorch with CUDA and NCCL Support: PyTorch is a deep learning framework that
    manages the entire training workflow, including data loading, model definition,
    parallel execution, and gradient synchronization. It defines the structure of
    the neural network, such as the number of layers, neurons per layer, activation
    functions, and initializes the weights automatically.


    CUDA (Compute Unified Device Architecture): CUDA is a parallel computing platform
    and API model from NVIDIA. PyTorch uses CUDA for memory allocation for the data
    you move from CPU memory (DRAM) to GPU memory (VRAM), including batch tensors,
    model weights, and intermediate variables during the forward/backward passes.
    In the forward pass, CUDA does matrix multiplication, computes neuron output values
    y using the activation functions (e.g., ReLU, Tanh, Sigmoid) and computes the
    model error. CUDA also handles the backward pass, where it calculates gradients
    needed for weight updates and updates local weights.


    NCCL (NVIDIA Collective Communication Library): NCCL is a multiGPU, topology-aware
    collective algorithm designed for high-performance data exchange between GPUs,
    especially in multi-GPU and multi-node systems. It is used during the gradient
    communication phase of training, where computed gradients are exchanged between
    GPUs. For example, after CUDA computes gradients on each GPU, NCCL transfers those
    gradients to other GPUs using collective communication operations. At the time
    of writing, NCCL supports the following operations: AllReduce, Broadcast, Reduce,
    AllGather, and ReduceScatter.


    PyTorch, CUDA, and NCCL processes and dependencies are explained detail in upcoming
    section.


    ![](main-138.jpg)![](main-139.jpg)![](main-140.jpg)


    Figure 14-1: GPU Cluster overall Communication Model.


    ## Distributing NCCL Unique Id for GPUs in a Training Cluster


    Before GPUs across multiple nodes can communicate efficiently during distributed
    training, they must first agree on a shared context, a communicator, that defines
    who is participating and how data will be exchanged. To enable this, the NVIDIA
    Collective Communications Library (NCCL) requires a special identifier known as
    the NCCL Unique ID. This ID is generated once by a designated master process and
    then shared with all other processes in the training job. It acts as a session
    identifier, ensuring that every participating GPU process joins the same communication
    group. Without it, there would be no common reference point for building the communication
    topologies (such as rings or trees) used in operations like AllReduce or Broadcast.
    In essence, the NCCL Unique ID enables coordinated initialization and makes collective
    communication possible in a distributed GPU environment. The NCCL Unique ID is
    distributed over TCP connection. The following two section describes the process.


    ### Opening TCP Socket to Master Node


    When the training job is launched using the torchrun command shown in Figure 14-2,
    PyTorch’s distributed framework starts one process per GPU on each node. These
    processes are later identified by their global rank ID. Typically, the process
    with rank ID 0 is assigned the master role, which means it creates and distributes
    the NCCL Unique ID to all other processes (i.e., ranks running on other GPUs).


    The global rank IDs are calculated by multiplying the --node\_rank=n variable
    with the --nproc\_per\_node=4 value (processes per node) and then adding the local
    GPU rank. This results in the following global rank IDs:


    Host A: GPU 0 - Rank ID: 0 \* 4 + 0 = 0


    Host A: GPU 1 - Rank ID: 0 \* 4 + 1 = 1


    Host A: GPU 2 - Rank ID: 0 \* 4 + 2 = 2


    Host A: GPU 3 - Rank ID: 0 \* 4 + 3 = 3


    Host B: GPU 0 - Rank ID: 1 \* 4 + 0 = 4


    Host B: GPU 1 - Rank ID: 1 \* 4 + 1 = 5


    Host B: GPU 2 - Rank ID: 1 \* 4 + 2 = 6


    Host B: GPU 3 - Rank ID: 1 \* 4 + 3 = 7


    Since GPU 0 on Host A (node rank 0) has the global rank ID 0, it becomes the master
    rank. PyTorch opens a TCP listener on this GPU at 192.168.10.101:12345, using
    the values of --master\_addr=192.168.10.101 and --master\_port=12345. The script
    parameter --nnodes=2 specifies that there are two nodes in the cluster, and


    *   *   \--nproc\_per\_node=4 indicates that four processes (one per GPU) are
    running on each node. Armed with this information, the master rank expects 7 connection
    requests (from ranks 1 through 7).


    All other ranks start a three-way handshake process for opening TCP socket with
    the master process. The ranks 4-7 on the host B use --master\_addr = 192.168.10.101
    as a destination IP address, while local ranks 1-3 use the loopback IP address
    127.0.0.1. All ranks use the --master\_port=12345 as destination TCP port.


    This connection phase enables a rendezvous process, during which the master distributes
    the NCCL Unique ID so that GPUs can form a communication topology for collective
    operations.


    There is a loose but useful analogy between the NCCL rendezvous process and the
    Rendezvous Point (RP) in Layer 3 multicast networking. In both cases, the rendezvous
    acts as a coordination mechanism. The NCCL rendezvous process distributes a unique
    NCCL identifier from a master process to all GPU processes participating in distributed
    training. Similarly, a multicast RP serves as a shared point which distributes
    the data frames from the sender to multiple receivers.


    ![](main-141.jpg)


    Figure 14-2: Opening TCP Socket with the Master Rank.'
