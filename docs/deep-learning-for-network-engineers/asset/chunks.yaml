  trans: '


    队列配置定义了基于早先分配的内部 QoS 组，在输出接口上如何调度和优先处理流量。这由名为 `QOS_EGRESS_PORT` 的策略映射（policy map）处理，它将流量映射到不同的硬件输出队列。每个队列由一个类（class）标识，例如
    `c-out-8q-q7`（固定名称：`8q` = 八个队列，`q7` = 7 号队列）。例如，队列 7 被配置为优先级级别 1，使其对所有其他流量都具有严格优先级。队列
    3 分配了剩余带宽百分比的 50%，这意味着在处理完严格优先流量后，它被保证获得剩余带宽的一半。除了带宽分配外，队列 3 还通过 `random-detect`
    命令包含了拥塞管理功能。这启用了加权随机检测检测（WRED），该机制通过在队列深度增加时随机标记数据包来避免拥塞。`minimum-threshold` 和
    `maximum-threshold` 定义了开始标记标记的 WRED 最小和最大值（从 150 KB 到 3000 KB）。`drop-probability`
    7 决定了达到最大阈值时标记标记的概率，数字越大表示标记率越高。`weight` 0 设置控制队列大小的平均方式。权重为 0 意味着使用瞬时队列深度（不进行平均）。最后，`ecn`
    启用了显式拥塞通知，允许网络设备在不丢弃数据包的情况下信号拥塞；如果不开启 `ecn` 选项，将根据 WRED 最小/最大阈值丢弃数据包。剩余队列被配置为剩余带宽的
    0%（实际上是禁用了它们的常规用途）或占据剩余带宽的份额。此队列策略确保了 RoCEv2 流量在具有拥塞反馈的情况下获得足够的资源，同时 CNP 消息始终能通过严格优先级通过。


    ```

    policy-map type queuing QOS_EGRESS_PORT

    class type queuing c-out-8q-q6

    bandwidth remaining percent 0

    ...

    class type queuing c-out-8q-q3

    bandwidth remaining percent 50

    random-detect minimum-threshold 150 kbytes maximum-threshold 3000 kbytes drop-probability
    7 weight 0 ecn

    ...

    class type queuing c-out-8q-q7

    priority level 1

    ```


    示例 11-3: 队列（输出调度）。


    ### 第 4 步：为队列启用 PFC


    网络 QoS 配置定义了交换机内部流量处理的底层、基于硬件的特性，例如启用无损行为以及为每个流量类设置最大传输单元（MTU）大小。在本示例中，使用 `policy-map
    type network-qos qos_network` 来配置流量在交换机背板内部的处理方式。在此策略下，类类型 `type network-qos c-8q-nq3`
    与 `pause pfc-cos 3` 关联，这在服务类别（CoS） 3 上启用了优先级流控制（PFC）。这对于 RoCEv2 流量至关重要，因为它依赖无损传输层。在这里也定义了
    MTU，为类 3 流量设置了字节（巨型帧）。


    ```

    policy-map type network-qos qos_network

    class type network-qos c-8q-nq3

    mtu 9216

    pause pfc-cos 3

    ```


    示例 11-4: 队列（输出调度）。


    ### 优先级流控制看狗


    优先级流控制（PFC）看狗是一种保护网络免受因卡住的 PFC 暂停帧导致流量死死的机制。在 RoCEv2 等 RDMA 环境中，PFC 通过暂停流量流而不是丢弃数据包来创建无损流量类。然而，如果设备未能释放暂停或由于配置错误导致
    PFC 帧持续存在，受影响类中的流量可能会被永久阻塞，导致所谓的“头部阻塞”状态。为了降低这种风险，使用 `priority-flow-control watch-dog-interval
    on` 命令启用看狗。当启用后，交换机会监控流量，如果检测到 PFC 暂停时间过长（潜在死锁），可以采取修正措施，丢弃数据包。


    ```

    priority-flow-control watch-dog-interval on

    ```


    示例 11-5: 优先级流控制看狗。


    ### 第 5 步：绑定并应用 QoS 设置


    系统级 QoS 将早先定义的 QoS 策略绑定在一起并在交换机上应用。使用 `system qos` 块应用网络 QoS 策略。`policy-map type
    network-qos qos_network` 命令激活了交换机背板内部流量的处理方式，确保 MTU 大小和 PFC 配置。`policy-map type
    queuing output QOS_EGRESS_PORT` 命令在输出端应用队列策略，启用流量分类。通过应用 `system qos`，指令交换机根据策略定义的规则和优先级处理流量，这确保了端到端
    QoS 行为的一致性。


    ```

    system qos

    policy-map type network-qos qos_network

    policy-map type queuing output QOS_EGRESS_PORT

    ```


    示例 11-6: 优先级流控制看狗。


    ### 第 6 步：接口级配置


    接口级配置将之前定义的 QoS 策略附加到特定端口。在示例中，配置应用于 `Ethernet2/4`，但相同的方法适用于任何需要强制 QoS 的接口。第一个命令
    `priority-flow-control mode auto` 在接口上以自动模式启用优先级流控制。这意味着接口将与对端自动协商 PFC，通过暂停特定类而不是丢弃数据包来实现无损流量。`priority-flow-control
    watch-dog` 命令为此接口启用 PFC 看狗，确保如果 PFC 暂停帧卡住或持续过久，看狗将采取修正措施以防止死锁。这有助于防止由于 PFC 相关问题导致网络阻塞。


    最后，`service-policy type qos input QOS_CLASSIFICATION` 命令对输入流量应用 QoS 策略，确保数据包根据
    `QOS_CLASSIFICATION` 策略定义的 DSCP 值进行分类和标记。这种分类启用了下游 QoS 处理，包括正确的队列、调度和优先级处理。


    ```

    interface Ethernet 2/24

    priority-flow-control mode auto

    priority-flow-control watch-dog

    service-policy type qos input QOS_CLASSIFICATION

    ```


    示例 11-7: 接口级配置。


