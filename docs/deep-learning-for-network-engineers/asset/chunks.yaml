    much the weight is updated during training.


    Figure 3-5 illustrates the computation from two perspectives: neuron 9 in the
    output layer and neuron 1 in the hidden layer.


    ![](main-27.jpg)


    Figure 3-5: Backward Pass - Weight Adjustment Value.


    ### Weight Update


    Figure 3-6 depicts how the new weight value is obtained by adding the adjustment
    value to the initial weight value.


    ![](main-28.jpg)


    Figure 3-6: Backward Pass – Computing New Value for the Weight Parameter.


    So far, we have explored how the backpropagation algorithm works in multi-class
    classification using a single GPU. In this section, we examine the scenario where
    the input dataset exceeds the memory capacity of a single GPU. To handle this,
    we adopt a data parallelization strategy that splits the training data across
    multiple GPUs. We also analyze the strategy from a network utilization standpoint.


    In Figure 3-7, the training data is divided into mini-batches. The first half
    of the mini-batches is stored in system memory (DRAM-1) on Server-1, and the second
    half in system memory (DRAM-2) on Server-2. This setup illustrates a common situation:
    when the data cannot fully fit into a GPU’s VRAM, inactive mini-batches remain
    in system memory and are transferred as needed. Meanwhile, the active mini-batch
    and the model weights are loaded into the VRAM.


    In our example, each mini-batch contains 64 grayscale images, each of size 32
    × 32 pixels, meaning 1,024 input features per image. The first hidden layer contains
    128 neurons, and the output layer contains 10 neurons.


    The total number of weight parameters is as follows:


    *   Input to hidden layer: 64 images × 128 neurons × 1,024 inputs = 8,388,608
    weights

    *   Hidden to output layer: 128 neurons × 10 neurons = 1,280 weights

    *   Bias weights: 128 (hidden layer) + 10 (output layer) = 138 bias values

