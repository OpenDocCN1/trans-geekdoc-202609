    ![](main-79.jpg)


    Figure 8-10: Model Parallelism with Pipeline Parallelism – Time Step 8.


    ### 9^(th). Time Step — Two Active GPUs: Two Idle GPUs: Overall GPU Utilization
    50%


    * `GPU 1a` computes new weights for the fourth mini-batch `X₄`.

    * `GPU 0a` computes new weights for the third mini-batch `X₃`.


    ![](main-80.jpg)


    Figure 8-11: Model Parallelism with Pipeline Parallelism – Time Step 9.


    ### 10^(th). Time Step — One Active GPU: three Idle GPUs: Overall GPU Utilization
    25%


    * `GPU 0a` computes new weights for the fourth mini-batch `X₄`.


    ![](main-81.jpg)


    Figure 8-12: Model Parallelism with Pipeline Parallelism – Time Step 10.


    After completing the backward pass process, the second iteration of forward pass
    can be initialized.


    Figure 8-13 gives an overall view of pipelined model parallelization. This kind
    of illustration is often used to explain the concept, as it clearly shows the
    challenge of underutilized GPU resources. The white boxes indicate periods when
    the GPUs are idle. As you can see, the overall GPU utilization in the figure isn''t
    great. There are several research efforts and practical solutions that can improve
    this and make training much more efficient. But the goal here is simply to explain
    the basic idea behind pipelined model parallelization. It''s up to the reader
    to dig deeper into the topic if they''re interested.


    ![](main-82.jpg)


    Figure 8-13: Pipeline Bubble.


    ## Tensor Parallelism


    The previous section described how Pipeline Parallelism distributes entire layers
    across multiple GPUs. However, Large Language Models (LLMs) based on transformer
    architectures contain billions of parameters, making this approach insufficient.


    For example, GPT-3 has approximately 605 million parameters in a single self-attention
    layer and about 1.2 billion parameters in a feedforward layer, and these figures
    apply to just one transformer block. Since GPT-3 has 96 transformer blocks, the
    total parameter count reaches approximately 173 billion. When adding embedding
    and normalization parameters, the total increases to roughly 175 billion parameters.
    The number of parameters in a single layer alone often exceeds the memory capacity
    of a single GPU, making Pipeline Parallelism insufficient. Additionally, performing
    large matrix multiplications on a single GPU would be extremely slow and inefficient.
    Tensor Parallelism addresses this challenge by splitting computations within individual
    layers across multiple GPUs rather than assigning whole layers to separate GPUs,
    as done in Pipeline Parallelism.


    Chapter 7 introduces Transformer architecture but for memory refreshing, figure
    8-14 illustrates a stack of decoder modules in a transformer architecture. Each
    decoder module consists of a Self-Attention layer and a Feedforward layer. The
    figure also shows how an input word, represented by `x1`, is first mapped to a
    token. The token, in turn, receives a positional word embedding vector through
    lookups in the word embedding and position embedding tables.


    The resulting word vector is used to compute Query (`Q`) and Key (`K`) matrices,
    which, in turn, produces logits via dot products. These logits are then passed
    through the `SoftMax` function. The resulting matrix from the `SoftMax` function
    is multiplied with the Value (`V`) matrices. After Add & Normalization computation,
    the resulting matrix is fed into the Feedforward, fully connected, neural network.


    ![](main-83.jpg)


    Figure 8-14: An Overview of a Transformer Architecture.


    ### Self-Attention Layer


    In most cases, the word embedding matrix fits within a single GPU. This is because
    a typical embedding matrix is approximately 200 MB, which is significantly smaller
    than large Transformer layers that can contain billions of parameters.


    Another reason for keeping the embedding matrix on a single GPU is efficient lookup
    operations. Unlike large matrix multiplications, embedding lookups are memory-efficient
    and do not impose significant computational overhead. Splitting the embedding
    matrix across multiple GPUs would introduce high communication costs, as each
    GPU would store only a fraction of the vocabulary. This would require frequent
    crossGPU communication for token lookups, increasing latency and reducing efficiency.
    After the embedding lookup, the embedding vectors are broadcasted to all GPUs
    before the Transformer computations start.


    However, in very large-scale models (such as GPT-3 with 175 billion parameters),
    embeddings may be sharded across multiple GPUs using distributed embeddings or
    model parallelism techniques. One approach is row-wise parallelism, where the
    vocabulary is split across GPUs, and each GPU stores only a fraction of the embeddings,
    handling lookups for the tokens it owns.


    Figure 8-15 illustrates how the positional word embedding matrix (`Eepv`) is multiplied
    with the Query (`Q`), Key (`K`), and Value (`V`) matrices to produce the corresponding
    `Q`, `K`, and `V` vectors. The Query and Key vectors are then used as inputs to
    the self-attention layer.


    ![](main-84.jpg)


    Figure 8-15: Local Query (Q), Key (K), and Value (V) Matrices.


    Figure 8-16 illustrates how the Query, Key, and Value matrices are sharded across
    two GPUs. The first fragments of these matrices are assigned to `GPU A1`, while
    the second fragments are assigned to `GPU A2`. The positional word embedding matrix
    (`Eevp`) is also distributed between `GPU A1` and `GPU A2`. Matrix multiplication
    is then performed between the corresponding fragment of `Eevp` and the respective
    shards of the `Q`, `K`, and `V` matrices.


    ![](main-85.jpg)


    Figure 8-16: Shared Query (Q), Key (K), and Value (V) Matrices.


    Figure 8-17 illustrates the cross-GPU communication involved in the forward pass
    of the Self-Attention layer when using Tensor Parallelism. In this example, both
    the word embedding, and positional embedding matrices fit within `GPU A1`. After
    computing the positional word embeddings for the input words, the resulting vectors
    are broadcasted to `GPU A2`.


    Since we are using Tensor Parallelism, the Query (`Q`), Key (`K`), and Value (`V`)
    matrices are partitioned across `GPU A1` and `GPU A2`. Once each GPU has computed
    its assigned slices of the `Q`, `K`, and `V` vectors, the `Q` and `K` vectors
    are shared between GPUs using an `All-Gather` operation. This ensures that each
    GPU receives the missing parts of the `Q` and `K` matrices, reconstructing the
    complete matrices across GPUs. Only the `Q` and `K` matrices are synchronized;
    the `V` matrix remains local to each GPU.


    The `Q` and `K` matrices are then used in the Self-Attention layer, where the
    first operation is a matrix multiplication between the Query vectors and Key vectors
    for all tokens. The process is explained in detail in Chapter 7. The resulting
    scores are used to compute logits, which are inputs to the `SoftMax` function,
    using scaled dot-product attention. The output of the `SoftMax` function is then
    multiplied by the local fragment of the `V` matrix on each GPU.


    The `SoftMax` operation produces a Context Vector (`Cv`) for each input word,
    which serves as the input to the Feedforward Neural Network (`FFN`) layer. That
    said, the `SoftMax` in the self-attention layer is not the final prediction layer,
    it’s used to compute attention weights. The feedforward network processes the
    context vectors token representations produced by self-attention, not the predicted
    token. The final prediction is typically made by a separate output projection
    followed by a `SoftMax` over the vocabulary.


    ![](main-86.jpg)


    Figure 8-17: Tensor Parallelism in Self-Attention Layer.


    ### Feedforward Layer


    Figure 8-18 illustrates a Feedforward layer in the decoder module of a transformer.
    The feedforward network consists of two hidden layers and an output layer. In
    addition to Tensor Parallelism, we also employ Model Parallelism with Pipeline
    Parallelism.

