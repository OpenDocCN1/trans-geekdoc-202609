    The first hidden layer is split between `GPU A1` and `GPU B1`, both located in
    the same server. The weight matrices for neurons 1–3 reside in `GPU A1`, while
    the weight matrices for neurons 4–6 are in `GPU B1`. The inter-GPU communication
    between `GPU A1` and `GPU B1` occurs over `NVLinks`, which I refer to as the High-speed
    Domain (`HsD`).


    The second hidden layer is distributed across `GPU A2` and `GPU B2` within the
    same server. `GPU A2` holds the weight matrices for neurons 1–2, while `GPU B2`
    contains the weight matrices for neurons 3–4. The inter-GPU connection between
    `GPU A2` and `GPU B2` also utilizes `NVLinks`.


    The output layer is divided between `GPU A3` and `GPU B3`, both residing in the
    same server. The weight matrix for neuron 1 is stored in `GPU A3`, while the weight
    matrix for neuron 2 is in `GPU B3`. Inter-GPU communication occurs over `NVLinks`.


    Additionally, `GPU A1`, `GPU A2`, and `GPU A3` are interconnected via `Rail Switch-1`
    across the Backend Network. Similarly, `GPU B1`, `GPU B2`, and `GPU B3` are connected
    via `Rail Switch-2` across the Backend Network.


    ![](main-87.jpg)


    Figure 8-18: Tensor, Model and Pipeline Parallelism in Feedforward Layer.


    ### Backpropagation


    #### Forward pass


    First Hidden Layer (H1): The input to `H1`, the output of the `Self-Attention`
    block after the `Add & Norm` step (context vectors), is shared with `GPU A1` and
    `GPU B1`. Each GPU then performs its local matrix multiplication. After these
    local computations are complete, the partial outputs are synchronized between
    `GPU A1` and `GPU B1` using an `All-Gather` operation. This synchronization ensures
    that the complete `H1` output (`ynA1+B1`) is calculated before it is passed to
    the next stage. Because `GPU A1` and `GPU B1` reside on the same server, the communication
    occurs over a high-speed domain via `NVLink`.


    In the context of pipeline parallelism, `H1` constitutes one pipeline stage. Once
    its context vector-based output is fully assembled, it is sent to the GPUs responsible
    for the next layer. Specifically, `GPU A1` and `GPU B1` first pass the output
    computed from the first context vector (`C1`), and then the GPUs process the next
    context vector. This communication occurs over the backend network. `GPU A1`,
    `GPU A2`, and `GPU A3` are all connected to the same rail switch, so the `RDMA`
    packets traverse only one switch. The same design applies to `GPU B1`, `GPU B2`,
    and `GPU B3`. If communication between GPUs connected to different rail switches
    is required, the rail switches must be interconnected via spine switches.


    Second Hidden Layer (H2): The complete output from `H1` (obtained after synchronization
    in the previous stage) is pipelined to `GPU A2` and `B2`. Each of these GPUs performs
    its own local matrix multiplication. As before, after the local computations,
    the partial outputs from `GPU A2` and `GPU B2` are synchronized via an `All-Gather`
    operation, forming the complete `H2` output (`ynA2+B2`).


    The synchronization and forwarding between hidden layer 2 and output layer, and
    within an output layer follow the same model as in the previous hidden layers.


    This hybrid approach, using tensor parallelism within each stage and pipeline
    parallelism across stages, helps balance the computational load and memory usage
    across the six GPUs while minimizing idle time.


    Although the focus of this section is on tensor parallelism, pipeline parallelism
    is also discussed because large language models (LLMs) can process multiple sentences
    from their vocabulary simultaneously during the training process.


    On the other hand, during the inference when answering to our questions, LLMs
    use autoregressive next-word prediction. In this process, the final `SoftMax`
    layer of the `Transformer` calculates the probabilities over the vocabulary to
    predict the next token. This predicted token is then converted into a word and
    mapped to a new token. The lookup process assigns the token a positional embedding
    vector, which is used to compute the `Query`, `Key`, and `Value` vectors that
    feed into the `Transformer`''s self-attention layer. Consequently, pipeline parallelism
    is not required during the inference phase.


    #### Backward pass


    The error propagates backward from the Feedforward Neural Network (`FFNN`) layer
    to the `Self-Attention` layer. The backpropagation process in a `Transformer`
    follows a sequential order, meaning the error from the output propagates first
    to the `FFNN` layer, and from there, it continues backward to the `Self-Attention`
    mechanism.


    The process begins at the output layer, where the error is computed using the
    `SoftMax` function and cross-entropy loss. This error is then backpropagated through
    the `FFNN` layer, where gradients for the weight matrices are computed. Since
    the `FFNN` weights are split across multiple GPUs in Tensor Parallelism, each
    GPU computes its local gradient. An `AllReduce` operation is then performed to
    synchronize these gradients across GPUs, ensuring that all GPUs have the correct
    weight updates before proceeding.


    Once the gradients for the `FFNN` weights are synchronized, the error propagates
    back to the `Self-Attention` layer. Here, gradients for the `Query` (`Q`), `Key`
    (`K`), and `Value` (`V`) matrices are computed. Since these matrices were split
    across GPUs during the forward pass, the missing `Q` and `K` fragments must be
    gathered before calculating gradients. An `All-Gather` operation is used to collect
    `Q` and `K` values across GPUs. Once each GPU has a complete `Q` and `K` matrix,
    it computes the required gradients locally. After the local gradient computation,
    an `All-Reduce` operation is performed to ensure all GPUs have the synchronized
    gradients before updating the weights.


    After both layers complete their gradient computations and synchronizations, the
    optimizer updates the weights, and the next iteration begins. The key communication
    phases include `All-Gather` for assembling required `Q` and `K` values before
    gradient computation and `All-Reduce` for synchronizing gradients before weight
    updates.


    ## References


    * [1] Dean, J., Corrado, G., Monga, R., Chen, K., Devin, M., Le, Q. V., Mao, M.
    Z., Ranzato, M., Senior, A., Tucker, P., Yang, K., & Ng, A. Y. (2012, January
    1). Large Scale Distributed Deep Networks. Advances in Neural Information Processing
    Systems, 25, 1223–1231. [https://papers.nips.cc/paper_files/paper/2012/file/6aca97005c68f1206823815f6](https://papers.nips.cc/paper_files/paper/2012/file/6aca97005c68f1206823815f6)
    6102863-Paper.pdf

    * [2] Huang, Y., Cheng, Y., Bapna, A., Firat, O., Chen, D., Chen, M. X., Lee,
    H., Ngiam, J., Le, Q. V., Wu, Y., & Chen, Z. (2019, June 10). GPipe: Efficient
    Training of Giant Neural Networks using Pipeline Parallelism. Advances in Neural
    Information Processing Systems, 32. [https://arxiv.org/pdf/1811.06965.pdf](https://arxiv.org/pdf/1811.06965.pdf)

    * [3] Nararayanan, D., Santhanam, K., Zhao, Y., Shoeybi, M., LeGresley, P., Patwary,
    M., Thakur, A., Prabhumoye, S., Hall, J., Houston, M., & Zaharia, M. (2021, March
    5). Efficient Large-Scale Language Model Training on GPU Clusters using Megatron-LM.
    Proceedings of the 5th MLSys Conference. [https://arxiv.org/pdf/2104.04473.pdf](https://arxiv.org/pdf/2104.04473.pdf)

    * [4] Shoeybi, M., Patwary, M., Puri, R., LeGresley, P., Casper, J., & Catanzaro,
    B. (2019, December 8). Megatron-LM: Training MultiBillion Parameter Language Models
    Using Model Parallelism. arXiv preprint.

