    此暂停帧会被发送回发送者 `Spine Switch 1`。由于基于 `DSCP` 的分类映射回优先级队列 3，且这些交换机共享相同的映射，`Spine Switch
    1` 将正确解释此操作。


    ### 步骤 4：Spine Switch 1 暂停优先级队列 3 的传输


    在在其连接到 `Rail Switch C` 的接入接口 `E3/24` 上接收到 `PFC` 帧后，`Spine Switch 1` 会检查类使能向量（class
    enable vector）。


    - 由于 `bit 3` 被设置，交换机知道在出接口接口 `E3/24` 上暂停传输所有映射到优先级队列 3（在示例中 `DSCP` 值为 `24`）的帧。


    其他优先级队列的流量继续不受影响。


    `Spine Switch 1` 会拦截优先级 3 流量的传输，直到接收到随后的 `quanta = 0` 的 `PFC` 帧（表示“恢复”），或发生暂停持续超时，之后在未收到另一个暂停之前，交换机将恢复发送。


    ![](img/main-108.jpg)![](img/main-109.jpg)![](img/main-110.jpg)


    图 11-4：优先级流控制 – 暂停帧。


    以下示例展示了当拥塞在路由层 3 架构中持续存在时，优先级流控制 (`PFC`) 事件是如何向上游级联的。该场景基于之前的案例，即 `Spine Switch
    1` 暂停了发往 `Rail Switch C` 的流量。现在，我们观察该暂停如何影响源自 `Rail Switches A` 和 `B` 的流量。


    ### 步骤 5：Spine Switch 1 到 Rail Switch C 的出队列出现拥塞


    如前面的图所示，`Spine Switch 1` 接收来自 `Rail Switch C` 的 `PFC` 帧，并通过暂停其出接口 `E3/24`（指向 `Rail
    Switch C`）上的优先级队列 3 流量做出响应。由于该接口不再发送流量，通过 `Rail Switch C` 发往 `GPU-3` 的帧开始在 `Spine
    Switch 1` 的出队列 3 中堆积。这种堆积导致了影响交换机接入侧的反压力。


    ### 步骤 6：Spine Switch 1 接入接口超过 xOFF 阈值


    `Spine Switch 1` 接收来自 `Rail Switch A`（接口 `E1/24`）和 `Rail Switch B`（接口 `E2/24`）的入流量。两台交换机都在发送映射到优先级队列
    3 的流量（例如 `DSCP` 24）。当通往 `Rail Switch C` 的出队列满且无法排空，接口 `E1/24` 和 `E2/24` 上对应的接入缓冲区也开始填充，特别是队列
    3。最终，两个接入接口的 `xOFF` 阈值被超过，表明拥塞现在已影响到这些端口新数据包的接收。


    ### 步骤 7：Spine Switch 1 向 Rail Switch A 和 B 发送 PFC 暂停帧


    为了避免接入缓冲区溢出导致丢包，`Spine Switch 1` 在 `E1/24` 和 `E2/24` 上生成 `PFC` MAC 控制帧。类使能向量的
    `bit 3` 已设置，指示发送者暂停对应优先级队列 3 的流量。其中包含一个合适的 `quanta` 值来定义暂停持续时间。这些控制帧分别返回 `Rail
    Switch A` 和 `Rail Switch B`。


    ### 步骤 8：Rail Switches A 和 B 暂停发往 Spine Switch 1 的队列 3 流量


    接收到 `PFC` 帧后，`Rail Switch A` 和 `Rail Switch B` 解释类使能向量并暂停所有映射到优先级队列 3 的流量（例如 `DSCP`
    24），同时继续转发不受影响的其他优先级队列的流量。这标志着拥塞的上游传播：通往 `GPU-3` 路径上的单一瓶颈可以触发一直回溯到多个源交换机的 PFC
    响应。


    ![](img/main-111.jpg)


    图 11-5：优先级流控制 – 级联效应。


    ### 步骤 9a – 14：下游恢复与拥塞恢复


    图 11-6 阐了基于 `PFC` 的拥塞恢复过程如何从 `Rail Switches A` 和 `B` 一延伸到 `GPU NICs`，同时解决了 `Rail
    Switch C` 处的初始拥塞。


    由于之前的 `PFC` 暂停帧的影响：


    - `Rail Switch A` 和 `Rail Switch B` 已暂停向 `Spine Switch 1` 发送优先级队列 3 流量。

    - 反之，`Spine Switch 1` 已暂停了其在接口 `E3/24` 上发往 `Rail Switch C` 的出流量。


    这种暂停允许队列 3 清空拥塞。一旦达到 `xOFF` 阈值，`Spine Switch 1` 会发送一个 `quanta = 0` 的 `PFC` 帧，信号恢复。这传回
    `Rail Switches A` 和 `B`，允许它们恢复发送优先级队列 3 流量。


