    104 Chapter 7: Large Language Model (LLM)


    # Chapter 8: Parallelism Strategies in Deep Learning


    ## Introduction


    Figure 8-1 depicts some of the model parameters that need to be stored in GPU
    memory: a) Weight matrices associated with connections to the preceding layer,
    b) Weighted sum (`z`), c) Activation values (`y`), d) Errors (`E`), e) Local gradients,
    f) Remote gradients (`∇`), g) Learning rates (`LR`), and h) Weight adjustment
    (`w`). In addition, a single GPU may not have enough memory. To address this limitation,
    an appropriate parallelization strategy must be chosen. This chapter introduces
    the most common strategies include Data Parallelism, Model Parallelism, Pipeline
    Parallelism, and Tensor Parallelism.


    ![](main-70.jpg)


    Figure 8-1: Overview of Neural Networks


    ## Data Parallelism


    In data parallelization, each GPU has an identical copy of the model. This approach
    is effective when the model fits within a single GPU. In Figure 8-2, the batch
    is split into eight micro-batches. The first micro-batches are processed by `A1`,
    while the remaining micro-batches are processed by `A2`. Both GPUs share the model,
    but process different data. During the forward pass, the GPUs generate a prediction.
    After computing the model error, the backpropagation starts. The error is propagated
    backward to calculate the derivative of the model for each weight. These gradients
    are synchronized across GPUs, then summed and divided by the number of GPUs.


    In our simple two-GPU example, this process does not generate excessive network
    traffic, the gradients are synchronized across the GPUs, although the GPUs can
    use 100% of their NIC capacity. However, if hundreds or thousands of GPUs are
    used, the network traffic becomes significantly larger. Inter-GPU network communication
    within a single server (using `PCIe`, `NVLink`) or between multiple servers (over
    `InfiniBand`, `Ethernet`) requires packet forwarding with minimal latency and
    in a lossless manner. Minimal latency is required to keep the training time as
    short as possible, while lossless transport is essential because training will
    pause if even a packet is lost during synchronization. In the worst-case scenario,
    if no snapshot of the training progress is taken, the entire training must be
    restarted from the beginning.


    ## Power Consumption Example


    Consider the electricity costs if training had already been running for two months
    and had to be restarted due to a single packet loss.


    - A single GPU consumes roughly 350W under full load.

    - Total power consumption for 50,000 GPUs: `350 W * 50,000 = 17,500,000 W = 17.5
    MW`.

    - For two months (60 days = 1,440 hours) of training: `17.5 MW * 1,440 hours =
    25,200 MWh = 25,200,000`.

    - If electricity costs $0.10 per kWh, the total training cost will be: `25,200,000
    kWh * 0.10 = 2,520,000 USD`.


    ![](main-71.jpg)


    Figure 8-2: Data Parallelism Overview

