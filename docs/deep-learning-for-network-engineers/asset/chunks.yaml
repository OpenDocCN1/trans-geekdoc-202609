    * [3] Goodfellow, I., Bengio, Y., & Courville, A. (2016, November 18). Deep Learning.
    MIT Press. https://www.deeplearningbook.org/

    * [4] IBM. (n.d.). What are Convolutional Neural Networks? https://www.ibm.com/think/topics/convolutional-neural-networks

