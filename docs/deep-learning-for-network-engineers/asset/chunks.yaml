    # 封底介绍


    《面向网络工程师的深度学习》（Deep Learning for Network Engineers）弥合了 AI 理论与现代数据中心网络基础设施之间的鸿沟。本书为想要理解深度神经网络（DNN）如何工作——以及
    GPU 集群如何在大规模下进行通信的网络专业人士提供了技术基础。


    ## 第一部分（第 1–8 章）


    第一部分解释了深度学习的数学原理和架构原理。从人工神经元和激活函数的构建块开始，然后介绍了用于基础模式识别的前馈神经网络（FNNs）、用于更高级图像识别的卷积神经网络（CNNs）、用于序列数据的循环神经网络（RNNs），以及使用自注意力机制进行大规模语言建模的
    Transformer。最后几个章节介绍了当模型或数据集无法放入单个 GPU 时所使用的并行训练策略。


    - **数据并行（Data parallelism）**：将训练数据集划分到多个 GPU 上，每个 GPU 使用相同的模型副本处理不同的小批次（mini-batches）。

    - **流水线并行（Pipeline parallelism）**：将模型划分为顺序阶段并分布在不同的 GPU 上。

    - **张量（或模型）并行（Tensor (or model) parallelism）**：当单层模型无法放入内存时，将大模型层进一步拆分到多个 GPU
    上。这些方法使得训练任务能够在大规模 GPU 集群中高效扩展。


    ## 第二部分（第 9–14 章）


    第二部分侧重于支持现代数据中心分布式 AI 工作负载的网络技术和拓扑设计。它解释了 `RoCEv2` 如何通过以太网实现直接的 GPU 间内存传输，以及 `DCQCN`、`ECN`
    和 `PFC` 等拥塞控制机制如何确保无损高速传输。你还将学习针对 AI 的负载均衡技术，包括基于流、基于流组（flowlet）和逐包喷洒（per-packet
    spraying），这些有助于避免瓶颈并保持高 GPU 吞吐量。后续章节检查了 GPU 集合操作，例如 `AllReduce`（用于在所有工作节点之间同步模型参数）、`ReduceScatter`
    和 `AllGather` 操作。书最后介绍了轨道优化拓扑（rail-optimized topologies），以确保跨机架 GPU 集群的高效性和韧性。


    本书并非配置或部署指南。相反，它为你提供了所需的理论和技术背景，以便开始深入学习或与 AI 工程师及系统设计师进行跨学科对话。架构图和实际示例阐明了复杂的过程——而无需深入实现细节。读者应熟悉路由
    Clos 架构、BGP EVPN 控制平面和 VXLAN 数据平面。这些技术被视为已知知识，书中不再详细介绍。


    无论你是在设计下一代 GPU 集群，还是仅仅试图理解其内部运行机制，本书都提供了 AI 工作负载与网络架构之间缺失的环节。


