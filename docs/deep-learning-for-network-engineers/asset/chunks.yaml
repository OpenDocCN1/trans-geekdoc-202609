    *   **Potential Oversubscription**: With all GPUs sending and receiving traffic
    through the same switch, there’s a risk of oversubscription, especially under
    heavy AI workload patterns where network traffic bursts are common.

    *   **Difficult Maintenance**: Software upgrades or hardware maintenance on the
    switch impact all connected hosts, making planned downtime more disruptive.

    *   **Not Suitable for High Availability (HA) Requirements**: Critical AI workloads,
    especially in production environments, often require dualrail (redundant) networking
    to meet high availability requirements. This design would not meet such standards.


    Single rail designs are cost-efficient and simple but lack redundancy and scalability,
    making them best suited for small or non-critical AI deployments.


    ![](main-128.jpg)


    Figure 13-4: Single Rail Switch Design: GPU with Single Port NIC.


    ### Dual-Rail Switch Topology with Dedicated, Dual-Port NICs per GPU


    In this topology, each host contains 8 GPUs, and each GPU has a dedicated dual-port
    NIC. The NICs are connected across two independent Rail switches equipped with
    200 Gbps interfaces. This design ensures that every GPU has redundant network
    connectivity through separate switches, maximizing performance, resiliency, and
    failover capabilities.


    Each Rail switch independently connects to one port of each NIC, creating a dual-homed
    connection per GPU. To ensure seamless operations and redundancy, the two switches
    must logically appear as a single device to the host NICs, even though they are
    physically distinct systems.


    #### Benefits


    *   **High Availability**: The failure of a single switch, link, or NIC port does
    not isolate any GPU, maintaining system uptime.

    *   **Load Balancing**: Traffic can be distributed across both switches, maximizing
    bandwidth utilization and reducing bottlenecks.

    *   **Scalability**: Dual-rail architectures can be extended easily to larger
    deployments while maintaining predictable performance and redundancy.

    *   **Operational Flexibility**: Maintenance can often be performed on one switch
    without service disruption.


    #### Drawbacks


    *   **Higher Cost**: Requires two switches, twice the number of cables, and dual-port
    NICs, increasing CapEx and OpEx.

    *   **Complexity**: Managing a dual-rail environment introduces more design complexity
    due to Multi-Chassis Link Aggregation (`MLAG`).

    *   **Increased Power and Space Requirements**: Two switches and more cabling
    demand more rack space, power, and cooling.


    #### Challenges of Multi-Chassis Link Aggregation (MLAG)


    To create a logical channel between dual-port NICs and two switches, the switches
    must be presented as a single logical device to each NIC. MultiChassis Link Aggregation
    (`MLAG`) is often used for this purpose. `MLAG` allows a host to see both switch
    uplinks as part of the same `LAG` (Link Aggregation Group).


    Another solution is to assign the two NIC ports to different VLANs without bundling
    them into a `LAG`, though this approach may limit bandwidth utilization and redundancy
    benefits compared to `MLAG`.


    `MLAG` introduces several challenges:


    *   **MAC Address Synchronization**: Both switches must advertise the same MAC
    address to the host NICs, allowing the two switches to appear as a single device.

    *   **Port Identification**: A common approach to building `MLAG` is to use the
    same interface numbers on both switches. Therefore, the system must be capable
    of uniquely identifying each member link internally.

    *   **Control Plane Synchronization**: The two switches must exchange state information
    (e.g., MAC learning, link status) to maintain a consistent and synchronized view
    of the network.

    *   **Failover Handling**: The switches must detect failures quickly and handle
    them gracefully without disrupting existing sessions, requiring robust failure
    detection and recovery mechanisms.


    #### Vendor-Specific MLAG Solutions


    The following list shows some of the vendor proprietary `MLAG`:


    *   **Cisco Virtual Port Channel (vPC)**: Cisco''s `vPC` allows two Nexus switches
    to appear as one logical switch to connected devices, synchronizing MAC addresses
    and forwarding state.

    *   **Juniper Virtual Chassis / MC-LAG**: Juniper offers Virtual Chassis and `MC-LAG`
    solutions, where two or more switches operate with a shared control plane, presenting
    themselves as a single switch to the host.

    *   **Arista MLAG**: Arista Networks implements `MLAG` with a simple peerlink
    architecture, supporting independent control planes while synchronizing forwarding
    state.

    *   **NVIDIA/Mellanox MLAG**: Mellanox switches also offer `MLAG` solutions, often
    optimized for HPC and AI workloads.


    #### Standards-Based Alternative: EVPN ESI Multihoming


    Instead of vendor-specific `MLAG`, a standards-based approach using Ethernet Segment
    Identifier (`ESI`) Multihoming under `BGP EVPN` can be used. In this model:


    *   Switches advertise shared Ethernet segments (`ESIs`) to the host over `BGP
    EVPN`.

    *   Hosts see multiple physical links but treat them as part of a logical redundant
    connection.

    *   `EVPN ESI Multihoming` allows for interoperable solutions, but typically adds
    more complexity to the control plane.


    ![](main-129.jpg)


    Figure 13-5: Dual Rail Design: GPU with Single Port.


    ### Cross-Rail Communication over NVLink


    In the single- and dual-rail topologies (Figures 13-4 and 13-5), each GPU is connected
    to a NIC, which connects to a specific switch. However, there is no direct switch-switch
    rail interconnect. For example, consider a memory copy where GPU-2 (connected
    to Rail 3) on Host-1 needs to send data to GPU-3 (connected to Rail 4). The path
    must traverse multiple stages:


    1.  **Intra-Host Transfer**: The data is first copied over `NVLink` from `GPU-2`
    to `GPU-3` within Host-1.

    2.  **NIC Transmission**: Once the data resides in `GPU-3`’s memory, it can be
    sent out through `GPU-3`’s NIC, which connects to Rail 4.

    3.  **Inter-Host Transfer**: The packet travels over Rail 4 through one of the
    Rail switches to reach Host-2.

    4.  **Destination Reception**: Finally, the data is delivered to `GPU-3` on Host-2.


    This method ensures that each network link (and corresponding NIC) is used according
    to its assigned rail without needing direct switch-to-switch interconnects.


    To coordinate and optimize such multi-step communication, NVIDIA Collective Communications
    Library (`NCCL`) plays a critical role. `NCCL` automatically handles `GPU-to-GPU`
    communication across multiple nodes and rails, selecting the appropriate path,
    initiating memory copies over `NVLink`, and scheduling transmissions over the
    correct NICs — all while maximizing bandwidth and minimizing latency. The upcoming
    chapter will explore `NCCL` in greater detail.


    Figure 13-6 illustrates how the upcoming topology in Figure 13-7 maps NIC-to-Rail
    connections, transitioning from a switch interface-based view to a rail-based
    view. Figure 13-6 shows a partial interface layout of a Cisco Nexus 9348D-GX2A
    switch and how its interfaces are grouped into different rails as follows:


    *   **Rail-1 Interfaces**: 1, 4, 7, 10

    *   **Rail-2 Interfaces**: 13, 16, 19, 22

    *   **Rail-3 Interfaces**: 25, 28, 31, 34

    *   **Rail-4 Interfaces**: 37, 40, 43, 46

    *   **Rail-5 Interfaces**: 2, 5, 8, 11

    *   **Rail-6 Interfaces**: 14, 17, 20, 23

    *   **Rail-7 Interfaces**: 26, 29, 32, 35

