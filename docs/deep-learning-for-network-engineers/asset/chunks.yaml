    # Chapter 10:    Challenges in AI Fabric Design


    ## Introduction


    Figure 10-1 illustrates a simple distributed GPU cluster consisting of three GPU
    hosts. Each host has two GPUs and a Network Interface Card (NIC) with two interfaces.
    Intra-host GPU communication uses high-speed NVLink interfaces, while inter-host
    communication takes place via NICs over slower PCIe buses.


    GPU-0 on each host is connected to Rail Switch A through interface E1. GPU-1 uses
    interface E2 and connects to Rail Switch B. In this setup, interhost communication
    between GPUs connected to the same rail passes through a single switch. However,
    communication between GPUs on different rails goes over three hops Rail–Spine–Rail
    switches.


    In Figure 10-1, we use a data parallelization strategy where a training dataset
    is split into six micro-batches, which are distributed across the GPUs. All GPUs
    use the shared feedforward neural network model and compute local model outputs.
    Next, each GPU calculates the model error and begins the backward pass to compute
    neuron-based gradients. These gradients indicate how much, and in which direction,
    the weight parameters should be adjusted to improve the training result (see Chapter
    2 for details).


    ![](main-100.jpg)


    Figure 10-1: Rail-Optimized Topology.


    ## Egress Interface Congestions


    After computing all gradients, each GPU stores the results in a local memory buffer
    and starts a communication phase where computed gradients are shared with other
    GPUs. During this process, the data (gradients) is being sent from one GPU and
    written to another GPU''s memory (RDMA Write operation). RDMA is explained in
    detail in Chapter 9.


    Once all gradients have been received, each GPU averages the results (AllReduce)
    and broadcasts the aggregated gradients to the other GPUs. This ensures that all
    GPUs update their model parameters (weights) using the same gradient values. The
    Backward pass process and gradient calculation are explained in Chapter 2.


    Figure 10-2 illustrates the traffic generated during gradient synchronization
    from the perspective of GPU-0 on Host-2. Gradients from the local host’s GPU-1
    are received via the high-speed NVLink interface,


    while gradients from GPUs in other hosts are transmitted over the backend switching
    fabric. In this example, all hosts are connected to Rail Switches using 200 Gbps
    fiber links. Since GPUs can communicate at line rate, gradient synchronization
    results in up to 800 Gbps of egress traffic toward interface E1 on Host-2, via
    Rail Switch A. This may cause congestion, and packet drops if the egress buffer
    on Rail Switch A or the ingress buffer on interface E1 is not deep enough to accommodate
    the queued packets.


    ![](main-101.jpg)


    Figure 10-2: Congestion During Backward Pass.


    ## Single Point of Failure


    The training process of a neural network is a long-running, iterative task where
    GPUs must communicate with each other. The frequency and pattern of this communication
    depend on the chosen parallelization strategy. For example, in data parallelism,
    communication occurs during the backward pass, where GPUs synchronize gradients.
    In contrast, model parallelism and pipeline parallelism involve communication
    even during the forward pass, as one GPU sends activation results to the next
    GPU holding the subsequent layer. It is important to understand that communication
    issues affecting even a single GPU can delay or interrupt


    the entire training process. This makes the AI fabric significantly more sensitive
    to single points of failure compared to traditional data center fabrics.


    Figure 10-3 highlights several single points of failure that may occur in real-world
    environments. A host connection can become degraded or completely fail due to
    issues in the host, NIC, rail switch, transceiver, or connecting cable. Any of
    these failures can isolate a GPU. While this might not seem serious in large clusters
    with thousands of GPUs, as discussed in the previous section, even one isolated
    or failed GPU can halt the training process.


    Problems with interfaces, transceivers, or cables in inter-switch links can cause
    congestion and delays. Similar issues arise if a spine switch is malfunctioning.
    These types of failures typically affect inter-rail traffic but not intra-rail
    communication. A failure in a rail switch can isolate all GPUs connected to that
    rail, creating a critical point of failure for a subset of the GPU cluster.


    ![](main-102.jpg)


    Figure 10-3: Single-Point Failures.


    ## Head-of-Line Blocking


    In this example GPU clusters, NCCL (NVIDIA Collective Communications Library)
    has built a topology where gradients are first sent from GPU-0 to GPU-1 over NVLink,
    and then forwarded from GPU-1 to other GPU-1s via Rail switch B.


    However, this setup may lead to head-of-line blocking. This happens when GPU-1
    is already busy sending its own gradients to the other GPUs, and now it also needs
    to forward GPU-0’s gradients. Since the PCIe and NIC bandwidth is limited, GPU-0’s
    traffic may need to wait in line behind GPU-1’s traffic. This queueing delay is
    called head-of-line blocking, and it can slow down the whole training process.
    The problem is more likely to happen when many GPUs rely on a single GPU or NIC
    for forwarding traffic to another rail. Even if only one GPU is overloaded, it
    can cause delays for others too.


    ![](main-103.jpg)


    Figure 10-4: Head-of-Line Blocking.


