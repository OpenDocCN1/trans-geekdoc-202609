    *   • Rail-8 接口：38, 41, 44, 47


    然而，在描述较大的实现时，基于端口的布局会变得极其混乱。因此，通常的做法是引用轨道编号而不是单个交换机接口标识符。


    ![](img/main-130.jpg)


    图 13-6：接口块到轨道的映射。


    |  ||  ||  ||  ||  ||  ||  ||  | | |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    |  ||  ||  ||  ||  ||  ||  ||  | | |


    图 13-7 提供了一个示例，显示每个 NIC 现在如何连接到轨道（rail），而不是直接映射到特定的物理接口。在这种方法中，每个轨道代表物理接口的逻辑组，简化了整体设计，并使大规模部署更于可视化和文档记录。


    在我们的示例“Host-Segment”（一个非官方名称）中，我们有四台主机，每个主机配备了八个 GPU —— 总共 32 个 GPU。每个 GPU 都有一个专用的
    200 Gbps 双口 NIC。所有 GPU 都通过 2 × 200 Gbps MLAG 连接到两个轨道交换机，为每个 GPU 提供了 400 Gbps 的传输速度。


    ![](img/main-131.jpg)


    图 13-7：在 2 台交换机上连接 32 个双口 NIC 到 8 个轨道的示例图。


    图 13-8 显示了如何连接多个 Host-Segment。该图说明了一个简化的两层三级 Clos 织网拓扑，其中在四个轨道交换机（叶节点交换机）和骨干交换机（Spine
    switches）之间建立了全网状第 3 层链路。该图还展示了链路容量计算。每个轨道交换机与主机有 32 × 100 Gbps 的连接，提供了 3.2 Tbps
    的总下行容量。


    由于 GPU 集群通常不倾向于过度订阅（oversubscription）——为了保持高性能和低延迟——从每个轨道交换机到骨干层的上行容量也必须匹配 3.2
    Tbps。为了实现这一点，每个轨道交换机必须具有聚合传输速率达到 3.2 Tbps 的上行。这可以通过使用原生的 800 Gbps 接口，或者通过为每个骨干连接形成由两个
    400 Gbps 链路组成的逻辑第 3 层端口通道来实现。此外，可以通过在骨干层添加更多交换机来增加交换机间的容量。这是 Clos 织网的优点之一：可以扩展容量，而无需将
    400 Gbps 接口替换为 800 Gbps 接口（例如）。


    这种拓扑形成了一个 Pod，总共支持 64 个 GPU，并提供了非阻塞架构，确保了不同 Host-Segment 之间 GPU 之间的最佳东西向流量性能。


    在网络设计中，“两层”和“三级”Clos 织网术语描述的是同一整体拓扑的不同方面。“两层”侧重于物理交换机层（通常是 Leaf 和 Spine）并描述了拓扑的深度，提供了架构的分层视图。本质上，它关注存在多少层交换层。另一方面，三级
    Clos 描述了数据包在端点之间移动时遵循的逻辑数据路径：Leaf–Spine–Leaf。它关注数据如何通过网络以及流量流经的阶段。因此，虽然两层拓扑指的是物理交换机结构，但三级
    Clos 描述的是数据包所走的逻辑路径，该路径跨越三个阶段：Leaf、Spine 和 Leaf。这两个视角是互补的，并不矛盾，它们共同提供了完整的 Clos
    网络设计视图。


    ![](img/main-132.jpg)


    图 13-8：AI 织网 – Pod 设计。


    图 13-9 通过添加第二个 64-GPU Pod 扩展了之前的示例，创建了一个更大的多 Pod 架构。为了互连这两个 Pod，引入了四台超骨干（Super-Spine）交换机，在骨干层之上形成了一个额外的聚合层。两个
    Pod 之间的互连通过这四台超骨干交换机实现。每个 Pod 保留了二层结构，通过骨干交换机进行全网状。由于超骨干交换机的引入，整个系统形成了三层五级 Clos
    拓扑。这种非阻塞架构允许在不同 Pod 之间保持高带宽。为了确保 3.2 Tbps 的带宽具有这种可扩展性，每个轨道交换机到超骨干层的上行容量必须匹配 3.2
    Tbps。为了实现这一点，每个轨道交换机必须具有聚合传输速率达到 3.2 Tbps 的上行。这可以通过使用原生的 800 Gbps 接口，或者通过为每个骨干连接形成由两个
    400 Gbps 链路组成的逻辑第 3 层端口通道来实现。此外，可以通过在骨干层添加更多交换机来增加交换机间的容量。这是 Clos 织网的优点之一：可以扩展容量，而无需将
    400 Gbps 接口替换为 800 Gbps 接口（例如）。


    ![](img/main-133.jpg)


    图 13-9：AI 织网 – 多 Pod 设计。


    ### GPU 织网中的轨道（Rail）


    在构建可扩展、韧性的 GPU 织网时，轨道层通过机顶交换机（ToR）互连 GPU 的部分至关重要。本节探讨了三种不同的模型：单交换机多轨道、单交换机双轨道和单交换机单轨道。所有三种都支持双口
    NIC 设计，允许每个 GPU 冗余连接到两个独立的交换机，从而消除了。


    #### 单交换机多轨道


    在这种模型中，每个交换机配置了多个小型子网和 VLAN。例如，一个 48 端口交换机可能承载四个或八个逻辑轨道。由于所有逻辑轨道共享同一个物理设备，隔离是逻辑上的。结果是，交换机的硬件或软件故障会影响所有轨道及其关联的
    GPU。这种模型不是 NVIDIA 验证的单元（SU）架构的一部分，但可能测试环境、开发集群或硬件效率优先的小规模 GPU 织网。从资本支出（CapEx）的角度来看，单交换机多轨道是最经济的，因为它需要的交换机少。


    图 13-10 展示了单交换机多轨道架构，每个轨道实现为映射到交换机端口的独立 VLAN-子网对。在图中，接口 1–4 分配给 `10.0.1.0/28`
    和 `VLAN 101`，而接口 5–8 映射到 `10.0.2.0/28` 和 `VLAN 102`。每个 VLAN 维护自己的 MAC 地址表，通过入站流量学习
    GPU 的 MAC。虽然图中未显示，轨道交换机作为所有 VLAN 的默认网关。该图还插图了在使用带有骨干层的 Clos 架构时的 BGP 过程。所有直接连接的子网都作为连接路由安装到本地路由数据库（RIB）中。这些路由随后被导入
    BGP `Loc-RIB`。接下来，路由通过 BGP 输出策略引擎，在那里它们被聚合为单一摘要路由：`10.0.1.0/24`。该聚合路由被放入 BGP `Adj-RIB-Out`
    中。当向对端发送 BGP 更新消息时，`NEXT_HOP` 属性会进行相应的设置。


    ![](img/main-134.jpg)


    图 13-10：单交换机多轨道。


    #### 单交换机双轨道


    虽然单交换机双轨道改进了管理性且更容易扩展，但它存在相同的局限性：两个逻辑轨道都位于同一个物理交换机内，因此故障域仍然很大。单个交换机的故障或配置错误会影响两个轨道以及所有关联的
    GPU。


    '
