    快速且可靠地做出响应，就像熟练的柔道高手在比赛中本能反应一样。


    训练过程的持续取决于多个因素，例如数据集大小、网络架构、硬件以及选择的并行化策略（如果需要）。训练神经网络需要多次迭代，有时甚至是数万次，在每次迭代的结束时，模型的输出值将与实际值进行比较。如果这两个值之间的差异不够小，则会调整网络以提高性能。整个过程可能需要几个月，但结果是一个能够准确、快速响应的系统，提供极佳的用户体验。


    本章从讨论人工神经元及其功能开始。然后我们转向前馈神经网络（FFNN）模型，首先解释其分层结构以及输入数据如何通过称为前向传播（Forward Pass,
    FP）的过程进行流动。接下来，我们将检查 FFNN 如何在反向传播（Backward Pass, BP）期间进行调整，这是通过最小化误差来微调模型。FP 和
    BP 的结合被称为反向传播算法。


    ## 人工神经元


    人工神经元，也称为感知机，是任何神经网络的基础构建块。它作为一个计算单元工作，分两个阶段处理输入数据。首先，它收集并处理所有输入（矩阵乘法），然后应用激活函数。图
    1-1 展示了不包含复杂数学函数的基本过程（稍后我会为感兴趣的读者解释这些）。在左侧，我们有一个偏置项（bias term）和两个输入值 `x1` 和 `x2`。偏置和输入通过可调整的权重参数
    `w0`、`w1` 和 `w2` 分别连接感知机。在初始训练阶段，权重值是随机生成的。


    ### 加权和与激活函数


    第一步，神经元计算输入 `x1` 和 `x2` 的加权和并加上偏置。加权和意味着每个输入都乘以其相应的权重参数，将结果相加，并将偏置加到总和中。偏置值设置为
    1，因此它的贡献始终等于其权重参数的值。我将在本章稍后的部分解释偏置项的作用。加权和的结果表示为 `z`，作为预激活值。然后，该值通过非线性激活函数，产生神经元的实际输出
    $\hat{y}$（y-hat）。在解释激活函数语境下非线性的含义以及为什么要使用它之前，请考虑以下几点：馈入神经元的输入值可以是负无穷（-∞）到正无穷（+∞）之间的任何数字。此外，可能存在数千个输入值。因此，加权和可能会变成非常大的正值或负值。


    现在，考虑具有数千个神经元的神经网络。在前馈神经网络（FFNN）中，神经元被组织成层：输入层、一个或多个隐藏层和一个输出层。如果输入值仅通过加权和计算并传递到下一层，神经元的输出将随每一层线性增长。即使我们应用线性激活函数，同样的问题仍然存在——输出将不断增加。由于大量的神经元和巨大的输入值，这种不受控制的增长可能会导致过度的计算需求，减慢训练过程。非线性激活函数有助于将输出值保持在可控的范围内。例如，S
    型的 Sigmoid 激活函数会将神经元的输出压缩到 0 到 1 之间的范围，即使对于非常大的输入值也是如此。


    回到图 1-1，我们首先将输入值与其相应的权重参数相乘，求和，然后加上偏置。由于偏置值为 1，因此在公式中仅使用其关联权重参数来表示它是合理的。如果我们将结果
    `z` 画在二维图表的水平轴上，并向上画一条垂直线，我们就能得到直线与 S 曲线相交处的神经元输出值 `y`。就是如此。自然地，这个过程有一个数学定义和方程，如图
    1-2 所示。


    在继续之前，还有一点需要注意。在下方的图中，每个权重都有一个关联的调节旋钮。这些旋钮仅仅是视觉上的表示，用来指示权重值是可调参数，当模型输出不够接近预期结果时，将通过反向传播算法进行调整。反向传播过程将在专门的章节中详细介绍。


    ![](img/main-4.jpg)


    图 1-1：人工神经元的架构。


    图 1-2 显示了计算加权和和 Sigmoid 函数的数学方程。加权和方程中希腊字母是 `Σ`（大写 Sigma）。Sigma 符号下方的小写 `i` 设置为
    1，表示加权和计算从第一对元素开始：输入 `x1` 及其对应的权重 `w1`。符号 `n=2` 指定了包含在加权和计算中的成对元素总数。在我们的示例中，输入值及其相应的权重都包含在内。


    计算加权和后，我们加上偏置项。结果 `z` 然后通过 Sigmoid 函数，产生输出 $\hat{y}$。Sigmoid 函数通常用希腊字母 `σ`（小写
    sigma）表示。


    图 1-2 下方的方程显示了如何计算 Sigmoid 函数。为了得到分数的分母，将欧数（`e≈2.71828`）方 `-z` 次，然后与 1 相加。最终输出只是该和的倒数。


    ![](img/main-5.jpg)


    图 1-2：人工神经元背后的数学。


    可以使用点积（dot products）用更简单的方式表示公式，点积在线性代数常用。点积经常出现在研究论文和深度学习文献中。


    在图 1-3 中，输入值和权重都排列为列向量。输入向量的符号使用大写 `X`，而权重向量用大写 `W` 表示。虽然这些在技术上是向量，但为了演示目的，将它们说明为简单的矩阵并不是主要问题。通常来说，矩阵具有多行多列，正如你以后将学到的样。


    点积执行简单的矩阵乘法，如图所示。这大大简化了计算。


    ![](img/main-6.jpg)


    图 1-3：带点积的矩阵乘法。


    ### 偏置项


    图 1-4 和 1-5 显示了偏置权重的变化如何影响加权和并水平移动 `z`。这反过来改变了 Sigmoid 函数的输出和神经元的输出输出。在图 1-4 中，偏置、输入
    `x1` 和输入 `x2` 的初始权重值分别为 `+0.3`、`+0.5` 和 `-0.3`。计算出的加权和为 `z=4.8`。对 `z=4.8` 应用 Sigmoid
    函数得到输出值 0.992。图 1-4 可视化了这个过程：`z=4.8` 位于水平轴上，与 S 曲线的交点结果为 0.992。


    ![](img/main-7.jpg)


    图 1-4：人工神经元的构造。


    现在，我们将与偏置相关的权重 `w0` 从 `+0.3` 调整到 `-4.0`。结果是加权和从 `4.84` 减少到 `0.50`，使 `z` 在水平轴上左移
    4.3 步。对 `z` 应用 Sigmoid 函数，神经元的输出从 0.992 减少到 0.622。


    ![](img/main-8.jpg)


    图 1-5：人工神经元的构造。

