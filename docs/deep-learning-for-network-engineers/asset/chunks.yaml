    # Chapter 13: Backend Network Topologies


    ## Introduction


    Although there are best practices for AI backend networks, such as Data Center
    Quantized Congestion Control (`QCN`) for congestion avoidance, rail-optimized
    Clos fabrics, and Layer 2 Rail-Only topologies for small-scale implementations,
    each vendor offers its own design. This approach is beneficial because validated
    designs are thoroughly tested, and when you build your system based on the vendor’s
    recommendations, you receive full vendor support and avoid having to reinvent
    the wheel.


    However, instead of focusing on any vendor’s design, this chapter explains general
    design principles for building a resilient, non-blocking, and lossless Ethernet
    backend network for AI workloads.


    Before diving into backend network design, this chapter first provides a high-level
    overview of a GPU server based on NVIDIA `H100` GPUs. The first section introduces
    a shared NIC architecture, where 8 GPUs share two NICs. The second section covers
    an architecture where each of the 8 GPUs has a dedicated NIC.


    ### Shared NIC


    Figure 13-1 illustrates a shared NIC approach. In this example setup, NVIDIA `H100`
    GPUs `0–3` are connected to `NVSwitch` chips `1-1`, `1-2`, `1-3`, and `1-4` on
    baseboard-1, while GPUs `4–7` are connected to `NVSwitch` chips `2-1`, `2-2`,
    `2-3`, and `2-4` on baseboard-2. Each GPU connects to all four `NVSwitch` chips
    on its respective baseboard using a total of 18 `NVLink 4` connections: 5 links
    to `1-1`, 4 links to `1-2`, 4 links to `1-3`, and 5 links to `1-4`.


    The `NVSwitch` chips themselves are paired between the two baseboards. For example,
    chip `1-1` on baseboard-1 connects to chip `2-1` on baseboard-2 with four `NVLink`
    connections, chip `1-2` connects to chip `2-2`, and so on. This design forms a
    fully connected crossbar topology across the entire system.


    Thanks to this balanced pairing, GPU-to-GPU communication is very efficient whether
    the GPUs are located on the same baseboard or on different baseboards.

