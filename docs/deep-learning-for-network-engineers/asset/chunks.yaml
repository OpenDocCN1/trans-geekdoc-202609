    The following example shows how Priority Flow Control (PFC) events can cascade
    upstream when congestion persists in a routed Layer 3 fabric. This scenario builds
    on the earlier case, where Spine Switch 1 paused traffic to Rail Switch C. Now,
    we observe how that pause affects traffic originating from Rail Switches A and
    B.


    ### Step 5: Congestion on Spine Switch 1 Egress Queue to Rail Switch C


    As described in the previous figure, Spine Switch 1 received a PFC frame from
    Rail Switch C and responded by pausing traffic on priority queue 3 on its egress
    interface E3/24 (towards Rail Switch C). Because this interface is no longer sending
    traffic, frames destined for GPU-3 via Rail Switch C begin to accumulate in Spine
    Switch 1’s egress queue 3. This build-up causes backpressure that impacts the
    ingress side of the switch.


    ### Step 6: xOFF Threshold Exceeded on Spine Switch 1 Ingress Interfaces


    Spine Switch 1 receives incoming traffic from Rail Switch A (interface E1/24)
    and Rail Switch B (interface E2/24). Both switches are sending traffic mapped
    to priority queue 3 (e.g., DSCP 24). As the egress queue to Rail Switch C becomes
    full and cannot drain, the corresponding ingress buffers on interfaces E1/24 and
    E2/24 also begin to fill up, specifically for queue 3. Eventually, the xOFF thresholds
    on both ingress interfaces are exceeded, indicating that congestion is now impacting
    the reception of new packets on these ports.


    ### Step 7: Spine Switch 1 Sends PFC Pause Frames to Rail Switch A and B


    To avoid dropping packets due to ingress buffer overflow, Spine Switch 1 generates
    PFC MAC Control frames on both E1/24 and E2/24. The class enable vector has bit
    3 set, instructing the sender to pause traffic corresponding to priority queue
    3. A suitable quanta value is included to define the pause duration. These control
    frames travel back to Rail Switch A and Rail Switch B respectively.


    ### Step 8: Rail Switches A and B Pause Queue 3 Traffic to Spine Switch 1


    Upon receiving the PFC frames, both Rail Switch A and Rail Switch B interpret
    the class enable vector and pause all traffic mapped to priority queue 3 (e.g.,
    DSCP 24), still forwarding traffic on other priority queues unaffected. This marks
    the upstream propagation of congestion: a single bottleneck on the path to GPU-3
    can trigger PFC reactions all the way back to multiple source switches.


    ![](main-111.jpg)


    Figure 11-5: Priority Flow Control – Cascading Effect.


    ### Steps 9a – 14: Downstream Resume and Congestion Recovery


    Figure 11-6 illustrates how the PFC-based congestion recovery process extends
    from Rail Switches A and B all the way to the GPU NICs, while simultaneously resolving
    the initial congestion at Rail Switch C.


    As a result of the earlier PFC pause frames:


    *   •    Rail Switch A and Rail Switch B have paused sending priority queue 3
    traffic to Spine Switch 1.


    *   •    In turn, Spine Switch 1 has paused its own egress traffic toward Rail
    Switch C on interface E3/24.


    This pause allows queue 3 on Rail Switch C’s egress interface E12/24 (toward GPU-3)
    to drain, as no new traffic is arriving, and the GPU continues to consume incoming
    data.


    Once the buffer utilization for priority queue 3 drops below the configured xON
    threshold, Rail Switch C initiates congestion recovery.


    *   •    It sends a MAC Control Frame (Ethertype 0x8808) back to Spine Switch
    1.


    *   •    The class enable vector has bit 3 set (indicating priority queue 3).


    *   •    The quanta value is set to 0, signaling that it is now safe to resume
    transmission.


    Upon receiving this resume message, Spine Switch 1 can begin sending traffic again
    on priority queue 3, restoring throughput toward GPU-3 and continuing the flow
    of RDMA traffic through the network. This recovery mechanism operates consistently
    across the entire AI fabric.


