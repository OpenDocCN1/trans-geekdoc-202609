    42 Chapter 3: Multi-Class Classification


    # Chapter 4: Convolutional Neural Networks


    ## Introduction


    The previous chapter explained how Feed-forward Neural Networks (FNNs) can be
    used for multi-class classification of 28 x 28 pixel handwritten digits from the
    MNIST dataset. While FNNs work well for this type of task, they have significant
    limitations when dealing with larger, high-resolution color images.


    In neural network terminology, each RGB value of an image is treated as an input
    feature. For instance, a high-resolution 600 dpi RGB color image with dimensions
    3.937 x 3.937 inches contains approximately 5.58 million pixels, resulting in
    roughly 17 million RGB values.


    If we use a fully connected FNN for training, all these 17 million input values
    are fed into every neuron in the first hidden layer. Each neuron must compute
    a weighted sum based on these 17 million inputs. The memory required for storing
    the weights depends on the numerical precision format used. For example, using
    the 16-bit floating-point (FP16) format, each weight requires 2 bytes. Thus, the
    memory requirement per neuron would be approximately 32 MB. If the first hidden
    layer has 10,000 neurons, the total memory required for storing the weights in
    this layer would be around 316 GB.


    In contrast, Convolutional Neural Networks (CNNs) use shared weight matrices called
    kernels (or filters) across all neurons within a convolutional layer. For example,
    if we use a 3 x 3 kernel, there are only 9 weights per color channel. This reduces
    memory usage and computational costs significantly during both the forward and
    backward passes.


    Another limitation of FNNs for image recognition is that they treat each pixel
    as an independent unit. As a result, FNNs do not capture the spatial relationships
    between pixels, making them unable to recognize the same object if it shifts within
    the frame. Additionally, FNNs cannot detect edges or other important features.
    On the other hand, CNNs have a property called translation invariance, which allows
    the model to recognize patterns even if they are slightly shifted (small translations
    along the x and y axes). This helps CNNs classify objects more accurately. Furthermore,
    CNNs are more robust to minor rotations or scale changes, though they may still
    require data augmentation or specialized network architectures to handle more
    complex transformations.


    ## Convolution Layer


    ### Convolution Process


    The purpose of the convolution process is to extract features from the image and
    reduce the number of input parameters before passing them through fully-connected
    layers. The convolution operation uses a shared weight matrix called kernels or
    filters, which are shared across all neurons within a convolutional layer. In
    this example, we use the Prewitt operator, which consists of two 3 x 3 kernels
    with fixed weight values for detecting vertical and horizontal edges.


    In the first step, these two kernels are positioned over the first region of the
    input image, and each pixel value is multiplied by the corresponding kernel weight.
    Next, the process computes the weighted sum, `z=0`, and the result is passed through
    the `ReLU` activation function. The resulting activation values, `ff(z)=0`, contribute
    to the neuron-based output channels.


    Since our input image is a grayscale image without color channels (unlike an RGB
    image), it has only one input channel. By using two kernels, we obtain two output
    channels: one for detecting vertical edges and the other for detecting horizontal
    edges. The formula for calculating the size of the output channel:


    Height = (Image h – Kernel h)/Stride + bias = (6-3)/1 + 1 = 4


    Width = (Image w – Kernel w)/Stride + bias = (6-3)/1 + 1 = 4


    ![](main-30.jpg)


    Figure 4-1: Convolution Layer – Stride One.


    After calculating the first value for the output channel using the image values
    in the first region, the kernel is shifted one step to the right (stride of 1)
    to cover the next region. The convolution process calculates the weighted sum
    based on the values in this region and the weights of the kernel. The result is
    then passed through the `ReLU` activation function. The output of the `ReLU` activation
    function differs for the first output channel, it is `ff(z)=99`; for the second
    output channel, it is `ff(z)=0`.


    ![](main-31.jpg)


    Figure 4-2: Convolution Layer – Stride Two.


    Figure 4-3 depicts the fifth stride.


    ![](main-32.jpg)


    Figure 4-3: Convolution Layer – Stride Five.


    The sixteenth stride, shown in Figure 4-4, is the last one. Now output channels
    one and two are filled.


    ![](main-33.jpg)


    Figure 4-4: Convolution Layer – Stride Sixteenth.


    Figure 4-5 shows how the convolution process found one vertical edge and zero
    horizontal edge from the input image. The convolution process produces two output
    channels, each with a size of 4 × 4 pixels, while the original input image was
    6 × 6 pixels.


    ![](main-34.jpg)


    Figure 4-5: Convolution Layer – Detected Edges


    ### MaxPooling


    MaxPooling is used to reduce the size of output channels if needed. In our example,
    where the channel size is relatively small (4 × 4), MaxPooling is unnecessary,
    but we use it here to demonstrate the process. Similar to convolution, MaxPooling
    uses a kernel and a stride. However, instead of fixed weights associated with
    the kernel, MaxPooling selects the highest value from each covered region. This
    means there is no computation involved in creating the new matrix. MaxPooling
    can be considered as a layer or part of the convolution layer. Due to its non-computational
    nature, I see it as part of the convolution layer rather than a separate layer.


    ![](main-35.jpg)


    Figure 4-6: Convolution Layer: MaxPooling


    ### The First Convolution Layer: Convolution


    In this section, we take a slightly different view of convolutional neural networks
    compared to the preceding sections. In this example, we use the Kirsch operator
    in the first convolution layer. It uses 8 kernels for detecting vertical, horizontal,
    and diagonal edges. Similar to the Prewitt operator, the Kirsch operator uses
    fixed weight values in its kernels. These values are shown in Figure 4-7.


    ![](main-36.jpg)


    Figure 4-7: Kirsch Operator.

