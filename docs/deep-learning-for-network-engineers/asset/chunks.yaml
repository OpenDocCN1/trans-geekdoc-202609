    in a match.


    The duration of the training process depends on several factors, such as dataset
    size, network architecture, hardware, and selected parallelization strategies
    (if need). Training a neural network requires multiple iterations, sometimes even
    tens of thousands, where, at the end of each iteration, the model''s output is
    compared to the actual value. If the difference between these two values is not
    small enough, the network is adjusted to improve performance. The entire process
    may take months, but the result is a system that responds accurately and quickly,
    providing an excellent user experience.


    This chapter begins by discussing the artificial neuron, and its functionality.
    We then move on to the Feedforward Neural Network (FFNN) model, first explaining
    its layered structure and how input data flows through it in a process called
    the Forward Pass (FP). Next, we examine how the FFNN is adjusted during the Backward
    Pass (BP), which fine-tunes the model by minimizing errors. The combination of
    FP and BP is known as the Backpropagation Algorithm.


    ## Artificial Neuron


    An artificial neuron, also known as a perceptron, is a fundamental building block
    of any neural network. It functions as a computational unit that processes input
    data in two phases. First, it collects and processes all inputs (matrix multiplication),
    and then applies an activation function. Figure 1-1 illustrates the basic process
    without the complex mathematical functions (which I will explain later for those
    interested in studying them). On the left-hand side, we have a bias term and two
    input values, x1 and x2. The bias and inputs are connected to the perceptron through
    adjustable weight parameters: w0, w1, and w2, respectively. During the initial
    training phase, weight values are randomly generated.


    ### Weighted Sum and Activation Function


    As the first step, the neuron calculates the weighted sum of inputs x1 and x2
    and adds the bias. A weighted sum simply means that each input is multiplied by
    its corresponding weight parameter, the results are summed, and the bias is added
    to the total. The bias value is set to one, so its contribution is always equal
    to the value of its weight parameter. I will explain the purpose of the bias term
    later in this chapter. The result of the weighted sum is denoted as z, which serves
    as a pre-activation value. This value is then passed through a non-linear activation
    function, which produces the actual output of the neuron, 𝑦𝑦^ (y-hat). Before
    explaining what non-linearity means in the context of activation functions and
    why it is used, consider the following: The input values fed into a neuron can
    be any number between negative infinity (-∞) and positive infinity (+∞). Additionally,
    there may be thousands of input values. As a result, the weighted sum can become
    a very large positive or negative value.


    Now, think about neural networks with thousands of neurons. In Feedforward Neural
    Networks (FFNNs), neurons are structured into layers: an input layer, one or more
    hidden layers, and an output layer. If input values were only processed through
    the weighted sum computation and passed to the next layer, the neuron outputs
    would grow linearly with each layer. Even if we applied a linear activation function,
    the same issue would persist—the output would continuously increase. With a vast
    number of neurons and large input values, this uncontrolled growth could lead
    to excessive computational demands, slowing down the training process. Non-linear
    activation functions help keep output values within a manageable range. For example,
    an S-shaped Sigmoid activation function squeezes the neuron’s output to a range
    between 0 and 1, even for very large input values.


    Let’s go back to Figure 1-1, where we first multiply the input values by their
    respective weight parameters, sum them, and then add the bias. Since the bias
    value is 1, it is reasonable to represent it using only its associated weight
    parameter in the formula. If we plot the result z on the horizontal


    axis of a two-dimensional chart and draw a vertical line upwards, we obtain the
    neuron’s output value y at the point where the line intersects the S-curve. Simple
    as that. Naturally, there is a mathematical definition and equation for this process,
    which is depicted in Figure 1-2.


    Before moving on, there is one more thing to note. In the figure below, each weight
    has an associated adjustment knob. These knobs are simply a visual representation
    to indicate that weight values are adjustable parameters, which will be tuned
    by the backpropagation algorithm in case the model output is not close enough
    to expected result. The backpropagation process is covered in detail in a dedicated
    chapter.


    ![](main-4.jpg)


    Figure 1-1: An Architecture of an Artificial Neuron.


    Figure 1-2 shows the mathematical equations for calculating the weighted sum and
    the Sigmoid function. The Greek letter used in the weighted sum equation is Σ
    (uppercase Sigma). The lowercase i is set to 1 beneath the Sigma symbol, indicating
    that the weighted sum calculation starts from the first pair of elements: input
    x1 and its corresponding weight w1. The notation n=2 specifies the total number
    of paired elements included in the weighted sum calculation. In our example, both
    input values and their respective weights are included.


    After computing the weighted sum, we add the bias term. The result, z, is then
    passed through the Sigmoid function, producing the output 𝑦𝑦^. The Sigmoid function
    is commonly represented by the Greek letter σ (lowercase sigma).


    The lower equation in Figure 1-2 shows how the Sigmoid function is computed. To
    obtain the denominator for the fraction, Euler’s number (e≈2.71828) is raised
    to the power of -z and then summed with 1. The final output is simply the reciprocal
    of this sum.


    ![](main-5.jpg)


    Figure 1-2: The Math Behind an Artificial Neuron.


    The formulas can be expressed in an even simpler manner using dot products, which
    are commonly used in linear algebra. Dot products frequently appear in research
    papers and deep learning literature.


    In Figure 1-3, both input values and weights are arranged as column vectors. The
    notation for the input vector uses an uppercase X, while the weight vector is
    denoted by an uppercase W. Although these are technically vectors, it is not a
    major issue to illustrate them as a simple matrix for demonstration purposes.
    Generally speaking, a matrix has more than one row and column, as you will learn
    later.


    The dot product performs a straightforward matrix multiplication, as shown in
    the figure. This greatly simplifies the computation.


    ![](main-6.jpg)


    Figure 1-3: Matrix Multiplication with Dot Product.


    ### Bias term


    Figures 1-4 and 1-5 illustrate how changes in the bias weight parameter affect
    the weighted sum and shift z horizontally. This, in turn, changes the output of
    the Sigmoid function and the neuron’s final output.


    In Figure 1-4, the initial weight values for the bias, input x1, and input x2
    are +0.3, +0.5, and -0.3, respectively. The calculated weighted sum is z=4.8.
    Applying the Sigmoid function to output z=4.8, we obtain an output value of 0.992.
    Figure 1-4 visualizes this process: z=4.8 is positioned on the horizontal axis,
    and the intersection with the S-curve results in an output of 0.992.


    ![](main-7.jpg)


    Figure 1-4: Construct of an Artificial Neuron.


    Now, we adjust the weight w0 associated with the bias from +0.3 down to -4.0.
    As a result, the weighted sum decreases from 4.84 to 0.50, shifting z 4.3 steps
    to the left on the horizontal axis. Applying the Sigmoid function to z, the neuron’s
    output decreases from 0.992 to 0.622.


    ![](main-8.jpg)


    Figure 1-5: Construct of an Artificial Neuron.'
