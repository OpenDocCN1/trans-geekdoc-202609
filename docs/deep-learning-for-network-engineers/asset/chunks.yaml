    First, when two GPUs open a `Queue Pair (QP)` between each other, all gradient
    synchronization traffic is typically sent over that `QP`. From the network point
    of view, this looks like one large flow between the GPUs. In deep learning training,
    gradient data can be hundreds of megabytes or even gigabytes, depending on the
    model size. So, when it is sent over one `QP`, the network sees it as a single
    high-bandwidth flow. This kind of traffic is often called an elephant flow, because
    it can take a big share of the link bandwidth. This becomes a problem when multiple
    large flows are hashed to the same uplink or spine port. If that happens, one
    link can get overloaded while others remain underused. This is one of the reasons
    we see hash polarization and head-of-line blocking in AI clusters. Hash polarization
    is a condition where the load-balancing hash algorithm used in `ECMP` (Equal-Cost
    Multi-Path) forwarding results in uneven distribution of traffic across multiple
    available paths.


    For example, in Figure 10-5, `GPU-0` in `Host-1` and `GPU-0` in `Host-2` both
    send traffic to `GPU-1` at a rate of 200 Gbps. The `ECMP` hash function in `Rail
    Switch A` selects the link to `Spine 1` for both flows. This leads to a situation
    where one spine link carries 400 Gbps of traffic, while the other remains idle.
    This is a serious problem in AI clusters because training jobs generate large
    volumes of east-west traffic between GPUs, often at line rate. When traffic is
    unevenly distributed due to hash polarization, some links become congested while
    others are idle. This causes packet delays and retransmissions, which can slow
    down gradient synchronization and reduce the overall training speed. In large-scale
    clusters, even a small imbalance can have a noticeable impact on job completion
    time and resource efficiency.


    ![](main-104.jpg)


    Figure 10-5: `ECMP` Hash-Polarization.


    In the previous sections, we explored some of the key challenges that can impact
    performance and reliability in GPU-based AI clusters, such as link congestion,
    single points of failure, head-of-line blocking, and hash polarization in `ECMP`
    routing.


    The rest of this book focuses on how these problems can be mitigated or even fully
    avoided. We will look at design choices, transport optimizations, network-aware
    scheduling, and alternative topologies that help improve the robustness and efficiency
    of the AI fabric.


    ## References


    * [1] Yunhong Xu, Keqiang He, Rui Wang, Minlan Yu, Nick Duffield, Hassan Wassel,
    Shidong Zhang, Leon Poutievski, Junlan Zhou, Amin Vahdat, Hashing Design in Modern
    Networks: Challenges and Mitigation Techniques. Texas A&M University, Harvard
    University, Google. [https://www.usenix.org/system/files/atc22_slides_xu.pdf]

    * [2] Head-of-line blocking, Wikipedia, [https://en.wikipedia.org/wiki/Head-of-line_blocking]


    # Chapter 11: Congestion Avoidance


    As explained in the preceding chapter, “Egress Interface Congestions,” both the
    Rail switch links to GPU servers and the inter-switch links can become congested
    during gradient synchronization. It is essential to implement congestion control
    mechanisms specifically designed for `RDMA` workloads in AI fabric back-end networks
    because congestion slows down the learning process and even a single packet loss
    may restart the whole training process.


    This section begins by introducing Explicit Congestion Notification (`ECN`) and
    Priority-based Flow Control (`PFC`), two foundational technologies used in modern
    lossless Ethernet networks. `ECN` allows switches to mark packets, rather than
    dropping them, when congestion is detected, enabling endpoints to react proactively.
    `PFC`, on the other hand, offers per-priority flow control, which can pause selected
    traffic classes while allowing others to continue flowing.


    Finally, we describe how Datacenter Quantized Congestion Notification (`DCQCN`)
    combines `ECN` and `PFC` to deliver a scalable and lossless transport mechanism
    for `RoCEv2` traffic in AI clusters.


    ## GPU-to-GPU RDMA Write Without Congestion


    The figure 11-1 illustrates a standard Remote Direct Memory Access (`RDMA`) Write
    operation between two GPUs. This example demonstrates how `GPU-0` on `Host-1`
    transfers local gradients (`∇₁` and `∇₂`) from memory to `GPU-0` on `Host-2`.
    Both GPUs use `RDMA`-capable NICs connected to `Rail Switch A` via 200 Gbps uplinks.


    The `RDMA Write` operation proceeds through the following seven steps:


    1. To initiate the data transfer, `GPU-0` on `Host-1` submits a work request to
    its `RDMA NIC` over the PCIe bus over the pre-established `Queue Pair 0x123456`.

    2. The `RDMA NIC` encodes the request by inserting the `OpCode` (`RDMA Write`)
    and `Queue Pair Number` (`0x123456`) into the `InfiniBand Transport Header` (`IBTH`).
    It wraps the `IBTH` and `RETH` (not shown in the figure) headers with Ethernet,
    IP, UDP, and Ethernet headers. The NIC sets the `DSCP` value to 24 and the `ECN`
    bits to 10 (indicating `ECN`-capable transport) in the IP header''s `ToS` octet.
    The `DSCP` value ensures that the switch can identify and prioritize `RoCEv2`
    traffic. The destination UDP port is set to `4791` (not shown in the figure).

    3. Upon receiving the packet on `Ethernet1/24`, the `Rail switch` classifies the
    traffic as `RoCEv2` based on the `DSCP` value of 24.

    4. The switch maps `DSCP` 24 to `QoS-3`.

    5. `QoS Group 3` uses egress priority queue 3, which is configured with bandwidth
    allocation and congestion avoidance parameters (`WRED Min`, `WRED Max`, and Drop
    thresholds) optimized for RDMA.

    6. The packet count on queue 3 does not exceed the `WRED minimum`, so packets
    are forwarded without modification.

    7. The `RDMA NIC` on `Host-2` receives the packet, strips off the Ethernet, IP,
    and UDP headers, and processes the `RDMA` headers. The payload is delivered directly
    into the memory of `GPU-0` on `Host-2`, completing the `RDMA Write` operation.


    ![](main-105.jpg)


    Figure 11-1: Overview of Remote DMA operation Under Normal Condition.


    ## Explicit Congestion Notification ECN


    Because gradient synchronization requires a lossless network service, it is essential
    to have a proactive congestion detection system that can respond before buffer
    overflows occur. This system must also include a signalling mechanism that allows
    the receiver to request the sender to reduce its transmission rate or temporarily
    pause traffic when necessary.


    Data Center Quantum Congestion Notification (`DCQCN`) is a congestion control
    scheme designed for `RoCEv2` that leverages both Explicit Congestion Notification
    (`ECN`) and Priority Flow Control (`PFC`) for active queue management. This section
    focuses on `ECN`.


    In IPv4, the last two bits (bits 6 and 7) of the `ToS` (Type of Service) byte
    are reserved for `ECN` marking. With two bits, four `ECN` codepoints are defined:


    * 00 – Not ECN-Capable Transport (`Not-ECT`)

    * 01 – ECN-Capable Transport (`ECT`)

    * 10 – ECN-Capable Transport (`ECT`)

    * 11 – Congestion Experienced (`CE`)


    Figure 11-2 illustrates how `ECN` is used to prevent packet drops when congestion
    occurs on egress interface `Ethernet2/24`. `ECN` operates based on two queue thresholds:
    `WRED Minimum` and `WRED Maximum`. When the queue depth exceeds the `WRED Minimum`
    but remains below the `WRED Maximum`, the switch begins to randomly mark forwarded
    packets with `ECN` 11 (`Congestion Experienced`). If the queue depth exceeds the
    `WRED Maximum`, all packets are marked with `ECN` 11. The `Drop Threshold` defines
    the upper limit beyond which packets are no longer marked but instead dropped.

