    ![](img/main-33.jpg)


    图 4-4：卷积层——步长十六


    图 4-5 显示了卷积过程从图像中检测出一个垂直边缘和零水平边缘。卷积过程产生了两个输出通道，每个大小为 4 x 4 像素，而原始输入图像为 6 x 6 像素。


    ![](img/main-34.jpg)


    图 4-5：卷积层——检测边缘


    ### 最大池化（MaxPooling）


    需要时用于减少通道的大小。在我们的示例中，通道尺寸较小（4x4），MaxPooling 并不是必要的，但我们在这里使用它来演示该过程。与卷积类似，MaxPooling
    使用内核和步长。然而，与内核固定权重不同，MaxPooling 从每个覆盖的区域选择最大值。这意味着创建新矩阵不涉及计算。MaxPooling 可以被视为一个层，也可以是卷积层的一部分。由于其非计算性质，我将其视为卷积层的一部分，而不是独立的层。


    ![](img/main-35.jpg)


    图 4-6：卷积层：最大池化


    ### 第一个卷积层：卷积


    在本节中，与之前的章节相比，我们对卷积神经网络采用了不同的视角。在该示例中，我们在第一个卷积层使用了 Kirsch 算子。它使用 8 个卷积核来检测垂直、水平和对角边缘。与
    Prewitt 算子类似，Kirsch 算子在其内核中使用了固定权重值。这些值如图 4-7 所示。


    ![](img/main-36.jpg)


    图 4-7：Kirsch 算子。

