- raw: 'Figures 3-2 and 3-3 illustrate the forward pass process for multi-class classification.
    The Input Layer flattens the 28 x28 pixel image into 784 input parameters, where
    each parameter represents the intensity of a pixel (0 = black, 255 = white). These
    784 input values are then passed to all 128 neurons in the Hidden Layer. Each
    neuron in the hidden layer receives all 784 inputs, and each of these inputs is
    associated with a unique weight. Therefore, each of 128 neurons have 784 weight
    parameters, and total weight parameter count of hidden layer is 100 352.


    In the hidden layer, each neuron computes the weighted sum ( = Matrix Multiplication)
    of its inputs and then applies the ReLU activation function to the result. This
    process produces 128 activation values, one for each neuron in the hidden layer.


    Next, these 128 activation values are fed into the Output Layer, which consists
    of 10 neurons (corresponding to the 10 possible classes for the MNIST dataset).
    Each output neuron is connected to all 128 activation values from the hidden layer.
    Therefore, the weight parameter counts in the output layer is 1280. Again, each
    neuron does matrix multiplication by computing a weighted sum of its inputs. The
    result of this calculation is called a logit.


    In the output layer, the SoftMax activation function is applied to these logits.
    SoftMax first computes the exponential of each logit, using Euler’s number e as
    the base. Then, it computes the sum of these exponentials, which in this example
    is 24.813. The probability for each class (denoted as 𝑦𝑦^) is calculated by dividing
    each neuron’s exponential by the sum of all exponentials.


    In this example, the output neuron corresponding to class "5" produces the highest
    probability, meaning the model predicts the digit in the image is 5. However,
    since this prediction is incorrect in the first iteration, the model will adjust
    its weights during backpropagation.


    In our model, we have 101,632 weight parameters. The number of bits used to store
    each weight parameter in a neural network depends on the numerical precision chosen
    for the model. The 32-bit floating point (FP32 – single precision) is the standard
    precision used, where each weight is represented using 32 bits (4 bytes). This
    format offers good precision but can be memory-intensive for large models. To
    reduce memory usage and increase speed, many modern hardware systems use 16-bit
    floating point (FP16 – half precision), where each weight is represented using
    16 bits (2 bytes). There is also 64-bit floating point (FP64 – double precision),
    which uses 64 bits (8 bytes), providing more precision and a larger range than
    FP32, but at the cost of increased memory usage.


    In our model, using FP32, the memory required for the weight parameters is 406,528
    bytes (4 × 101,632).


    ![](main-24.jpg)


    Figure 3-2: Forward pass – Probability Computation.


    ### Cross-Entropy Loss


    In our example, the highest probability value (0.244) is provided by neuron 5,
    though the expected value should be produced by neuron 9. Next, the algorithm
    computes the cross-entropy loss by taking the logarithm of the probability value
    for the expected neuron, as defined by the one-hot encoded label. In our example,
    the probability of the digit being 8, computed by neuron 9, is 0.181. The cross-entropy
    loss is calculated by taking the log of 0.181, resulting in 0.734.


    ![](main-25.jpg)


    Figure 3-3: Forward pass – Cross-Entropy Loss.


    ## Backward Pass


    ### Gradient Computing


    The gradient for the neurons in the output layer is calculated by subtracting
    the ground truth values (from the one-hot encoded label) from the probabilities
    produced by the SoftMax function. This simplified gradient expression is a result
    of combining the SoftMax activation with the crossentropy loss, which cancels
    out more complex derivative terms. While the cross-entropy loss influences the
    training process, its derivative is implicitly included in this simplified gradient
    expression.


    For neurons in the hidden layer, the gradient is computed by taking the weighted
    sum of the gradients from the connected output neurons. This sum is then multiplied
    by the derivative of the hidden neuron''s activation function (such as ReLU).
    The formula for this computation is shown in Figure 3-4.


    ![](main-26.jpg)


    Figure 3-4: Backward pass - Gradient Calculation.


    ### Weight Adjustment Values


    After calculating the gradients for all neurons, the backpropagation algorithm
    determines the weight adjustments. While this process was explained in the previous
    chapter, let''s briefly recap it here. Each weight adjustment is computed by multiplying
    the gradient of the neuron it connects to (the downstream neuron) by the input
    that passed through that weight during the forward pass. This product represents
    the gradient of the weight. The actual adjustment is then calculated by multiplying
    this gradient by the learning rate — a shared hyperparameter that controls how
    much the weight is updated during training.


    Figure 3-5 illustrates the computation from two perspectives: neuron 9 in the
    output layer and neuron 1 in the hidden layer.


    ![](main-27.jpg)


    Figure 3-5: Backward Pass - Weight Adjustment Value.


    ### Weight Update


    Figure 3-6 depicts how the new weight value is obtained by adding the adjustment
    value to the initial weight value.


    ![](main-28.jpg)


    Figure 3-6: Backward Pass – Computing New Value for the Weight Parameter.


    So far, we have explored how the backpropagation algorithm works in multi-class
    classification using a single GPU. In this section, we examine the scenario where
    the input dataset exceeds the memory capacity of a single GPU. To handle this,
    we adopt a data parallelization strategy that splits the training data across
    multiple GPUs. We also analyze the strategy from a network utilization standpoint.


    In Figure 3-7, the training data is divided into mini-batches. The first half
    of the mini-batches is stored in system memory (DRAM-1) on Server-1, and the second
    half in system memory (DRAM-2) on Server-2. This setup illustrates a common situation:
    when the data cannot fully fit into a GPU’s VRAM, inactive mini-batches remain
    in system memory and are transferred as needed. Meanwhile, the active mini-batch
    and the model weights are loaded into the GPU’s VRAM.


    In our example, each mini-batch contains 64 grayscale images, each of size 32
    × 32 pixels, meaning 1,024 input features per image. The first hidden layer contains
    128 neurons, and the output layer contains 10 neurons.


    The total number of weight parameters is as follows:


    *   •    Input to hidden layer:


    64 images × 128 neurons × 1,024 inputs = 8,388,608 weights


    *   •    Hidden to output layer:


    128 neurons × 10 neurons = 1,280 weights


    *   •    Bias weights:


    128 (hidden layer) + 10 (output layer) = 138 bias values


    Once the forward pass (computation phase) is complete, the backward pass begins.
    In this phase, gradients are computed for all neurons using the backpropagation
    algorithm.


    To synchronize gradients across GPUs, we use the All-Reduce collective communication
    model (detail explanation in chapter 14), which aggregates gradients from each
    GPU and ensures that all GPUs have consistent copies of the model. In our multi-server
    setup, this synchronization takes place over the network using Remote Direct Memory
    Access (RDMA), a mechanism that allows one server’s GPU to access another server’s
    GPU memory directly, bypassing CPU intervention and avoiding the traditional network
    stack. This form of RDMA (typically via RoCE or InfiniBand, explained in detail
    in chapter 9) is essential for minimizing latency and maximizing throughput across
    the cluster.


    During gradient synchronization, the GPU’s network interface controller (NIC)
    transmits data at line rate, often resulting in close to 100% link utilization.
    Once synchronization is complete, each GPU averages the gradients and computes
    updated weight values.'
