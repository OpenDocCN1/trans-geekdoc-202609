  fmt: "\n-\n\n- **Convolutional Neural Networks (CNNs)**: Optimized for spatial data\
    \ like images, CNNs use filters to extract local features such as edges, textures,\
    \ and shapes, while keeping the model size efficient through weight sharing.\n\
    - **Recurrent Neural Networks (RNNs)**: Designed for sequential data like text\
    \ and time series, RNNs maintain a hidden state that captures previous input history.\
    \ This allows them to model temporal dependencies and context across sequences.\n\
    - **Transformer-based Large Language Models (LLMs)**: Unlike RNNs, Transformers\
    \ use self-attention mechanisms to weigh relationships between all tokens in a\
    \ sequence simultaneously. This architecture underpins state-of-the-art language\
    \ models and enables scaling to billions of parameters.\n\n## Parallel Training\
    \ and Scaling Deep Learning (Chapter 8)\n\nAs models and datasets grow, training\
    \ them on a single GPU becomes impractical. This section explores the three major\
    \ forms of distributed training:\n\n- **Data Parallelism**: Each GPU holds a replica\
    \ of the model but processes different mini-batches of input data. Gradients are\
    \ synchronized at the end of each iteration to keep weights aligned.\n- **Pipeline\
    \ Parallelism**: The model is split across multiple GPUs, with each GPU handling\
    \ one stage of the forward and backward pass. Micro-batches are used to keep the\
    \ pipeline full and maximize utilization.\n- **Tensor (Model) Parallelism**: Very\
    \ large model layers are broken into smaller slices, and each GPU computes part\
    \ of the matrix operations. This approach enables the training of ultra-large\
    \ models that don't fit into a single GPU's memory.\n\n## Part II – Chapters 9\
    \ – 14: AI Data Center Networking\n\nThis part of the book focuses on the network\
    \ technologies that enable distributed training at scale in modern AI data centers.\
    \ It begins with an overview of GPU-to-GPU memory transfer mechanisms over Ethernet\
    \ and then moves on to congestion control, load balancing strategies, network\
    \ topologies, and GPU communication collectives.\n\n### RoCEv2 and GPU-to-GPU\
    \ Transfers (Chapter 9)\n\nThe section starts by explaining how Direct Memory\
    \ Access (`DMA`) is used to copy data between GPUs across Ethernet using `RoCEv2`\
    \ (`RDMA over Converged Ethernet version 2`). This method allows GPUs located\
    \ in different servers to exchange large volumes of data without CPU involvement.\n\
    \n### DCQCN: Data Center Quantized Congestion Notification (Chapters 10 - 11)\n\
    \nRoCEv2’s performance depends on a lossless transport layer, which makes congestion\
    \ management essential. To address this, `DCQCN` provides an advanced congestion\
    \ control mechanism. It dynamically adjusts traffic flow based on real-time feedback\
    \ from the network to minimize latency and packet loss during GPU-to-GPU communication.\n\
    \n- **Explicit Congestion Notification (ECN)**: Network switches mark packets\
    \ instead of dropping them when congestion builds. These marks trigger rate adjustments\
    \ at the sender to prevent overload.\n- **Priority-based Flow Control (PFC)**:\
    \ `PFC` ensures that traffic classes like `RoCEv2` can pause independently, preventing\
    \ buffer overflows without stalling the entire link.\n\n### Load Balancing Techniques\
    \ in AI Traffic (Chapter 12)\n\nIn addition to congestion control, effective load\
    \ distribution is critical for sustaining GPU throughput during collective communication.\
    \ This section introduces several techniques used in modern data center fabrics:\n\
    \n- **Flow-based Load Balancing**: Assigns entire flows or flowlets to paths based\
    \ on real-time link usage or hash-based distribution, improving path diversity\
    \ and utilization.\n- **Flowlet Switching**: Divides a flow into smaller time-separated\
    \ bursts (\"flowlets\") that can be load-balanced independently without reordering\
    \ issues.\n- **Packet Spraying**: Distributes packets belonging to the same flow\
    \ across multiple available paths, helping to avoid link-level bottlenecks.\n\n\
    ### AI Data Center Network Topologies (Chapter 13)\n\nNext, the section discusses\
    \ design choices in the East-West fabric—the internal network connecting GPU servers.\
    \ It introduces topologies such as:\n\n- **Top-of-Rack (ToR)**: Traditional rack-level\
    \ switching used to connect servers within a rack.\n- **Rail and Rail-Optimized\
    \ Designs**: High-throughput topologies tailored for parallel GPU clusters. These\
    \ layouts improve resiliency and throughput, especially during bursty communication\
    \ phases in training jobs.\n\n### GPU-to-GPU Communication (Chapter 14)\n\nThe\
    \ part concludes with a practical look at collective communication patterns used\
    \ to synchronize GPUs across the network. These collectives are essential for\
    \ distributed training workloads:\n\n- **AllReduce**: Each GPU contributes and\
    \ receives a complete, aggregated copy of the data. Internally, this is implemented\
    \ in two phases:\n    1. **ReduceScatter**: GPUs exchange partial results and\
    \ compute a portion of the final sum.\n    2. **AllGather**: Each GPU shares its\
    \ computed segment so that every GPU receives the complete aggregated result.\n\
    \    - **Broadcast**: A single GPU (often `rank 0`) sends data—such as communication\
    \ identifiers or job-level metadata—to all other GPUs at the start of a training\
    \ job.\n\n## Target Audience\n\nI wrote this book for professionals working in\
    \ the data center networking domain—whether in architectural, design, or specialist\
    \ roles. It is especially intended for those who are already involved in, or are\
    \ preparing to work with, the unique demands of AI-driven data centers. As AI\
    \ workloads reshape infrastructure requirements, this book aims to provide the\
    \ technical grounding needed to understand both the deep learning models and the\
    \ networking systems that support them.\n\n## Disclaimers\n\nThe content of this\
