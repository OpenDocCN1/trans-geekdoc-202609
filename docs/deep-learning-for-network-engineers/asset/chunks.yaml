    ![](img/main-79.jpg)


    图 8-10：结合流水线并行的模型并行——时间步 8。


    ### 第 9 次时间步 — 两个活跃 GPU：两个空闲 GPU：整体 GPU 利用率 50%


    * `GPU 1a` 计算第四个小批次 `X₄` 的新权重。

    * `GPU 0a` 计算第三个小批次 `X₃` 的新权重。


    ![](img/main-80.jpg)


    图 8-11：结合流水线并行的模型并行——时间步 9。


    ### 第 10 次时间步 — 一个活跃 GPU：三个空闲 GPU：整体 GPU 利用率 25%


    * `GPU 0a` 计算第四个小批次 `X₄` 的新权重。


    ![](img/main-81.jpg)


    图 8-12：结合流水线并行的模型并行——时间步 10。


    在完成反向传播过程后，就可以就可以初始化第二次前向传播迭代。


    图 8-13 展示了流水线模型并行的整体视图。这种图解通常用于解释该概念，因为它清晰地展示了 GPU 资源利用不足的挑战。白色方框表示 GPU 空闲的时期。如你所见，图中整体
    GPU 利用率并不理想。目前有一些研究工作和实践方案可以改进并让训练变得高效得多。但这里的目标仅仅是解释流水线模型并行的基本原理。如果读者感兴趣，可以自己深入研究该主题。


    ![](img/main-82.jpg)


    图 8-13：流水线气泡（Pipeline Bubble）。


    ## 张量并行 (Tensor Parallelism)


    前一节描述了流水线并行如何将整个层分布在多个 GPU 上。然而，基于 Transformer 架构的大语言模型（LLMs）包含数十亿参数，这使得这种方法不再够用。


    例如，GPT-3 在单个自注意力层中有约 6.05 亿参数，在馈送层中有约 12 亿参数，而这些数字仅适用于一个 Transformer 块。由于 GPT-3
    有 96 个 Transformer 块，总参数量达到约 175 亿。加上嵌入和归一化参数，总数增加到约 1750 亿参数。仅单层的参数数量通常就会超过单个
    GPU 的内存容量，使得流水线并行不从心。此外，在单个 GPU 上执行大型矩阵乘法将极其缓慢且低效。张量并行通过将单个层内部的计算划分到多个 GPU，而不是像流水线并行那样将整个层分配给不同的
    GPU，从而解决了这一挑战。


    第 7 章介绍了 Transformer 架构，但为了刷新记忆，图 8-14 展示了 Transformer 架构中的解码器模块。每个解码器模块由一个自注意力层和一个馈送层组成。该图还展示了由
    `x1` 表示的输入词如何首先映射到标记（token）。该标记通过词嵌入表和位置嵌入表中的查找接收位置词嵌入向量。


    生成的词向量用于计算查询 (`Q`) 和键 (`K`) 矩阵，然后通过点积产生 logits。这些 logits 随后被通过 `SoftMax` 函数。`SoftMax`
    函数生成的矩阵与值 (`V`) 矩阵相乘。在进行加法与归一化（Add & Normalization）计算后，生成的矩阵被馈入馈送、全连接神经网络。


    ![](img/main-83.jpg)


    图 8-14：Transformer 架构概览。


    ### 自注意力层


    在大多数情况下，词嵌入矩阵可以放入单个 GPU 中。这是因为一个典型的嵌入矩阵约为 200 MB，远小于包含数十亿参数的大型 Transformer 层。


    将嵌入矩阵保留在单个 GPU 上的另一个原因是高效的查找操作。与大型矩阵乘法不同，嵌入查找是内存高效的，且不会产生显著的计算开销。将嵌入矩阵划分到多个 GPU
    上会引入高昂通信成本，因为每个 GPU 只存储词表的一部分。这会导致标记查找时需要频繁的跨 GPU 通信，增加延迟并降低效率。在嵌入查找之后，在 Transformer
    计算之前，嵌入向量会被广播到所有 GPU。


    然而，在极大规模模型中（例如具有 175 亿参数的 GPT-3），嵌入可以使用分布式嵌入或模型并行技术分片到多个 GPU 上。一种方法是行并行，将词表划分到各个
    GPU 之间，每个 GPU 仅存储嵌入的一部分，并处理其所属标记的查找工作。


    图 8-15 展示了位置词嵌入矩阵 (`Eepv`) 如何与查询 (`Q`)、键 (`K`) 和值 (`V`) 矩阵相乘，以产生相应的 `Q`、`K` 和
    `V` 向量。查询和键向量随后作为自注意力层的输入。


    ![](img/main-84.jpg)


    图 8-15：本地查询 (Q)、键 (K) 和值 (V) 矩阵。


    图 8-16 展示了如何将查询、键和值矩阵分片到两个 GPU 上。这些矩阵的第一片段分配给 `GPU A1`，而第二个片段分配给 `GPU A2`。位置词嵌入矩阵
    (`Eevp`) 也分布在 `GPU A1` 和 `GPU A2` 之间。然后在 `Eevp` 的对应片段与 `Q`、`K`、`V` 矩阵的各自分片之间执行矩阵乘法。


    ![](img/main-85.jpg)


    图 8-16：共享查询 (Q)、键 (K) 和值 (V) 矩阵。


    图 8-17 展示了在使用张量并行时自注意力层前向传播涉及的跨 GPU 通信。示例中，词嵌入和位置嵌入矩阵都可以放入 `GPU A1`。在计算出输入词的位置词嵌入后，生成的向量被广播到
    `GPU A2`。


    由于我们使用了张量并行，查询 (`Q`)、键 (`K`) 和值 (`V`) 矩阵被划分在 `GPU A1` 和 `GPU A2` 上。一旦每个 GPU 计算了其分配的
    `Q`、`K` 和 `V` 向量切片，使用 `All-Gather` 操作在 GPU 之间共享 `Q` 和 `K` 向量。这确保每个 GPU 接收到 `Q`
    和 `K` 矩阵的缺失部分，从而在 GPU 之间重建完整的矩阵。只有 `Q` 和 `K` 矩阵会被同步；`V` 矩阵留在本地。


    `Q` 和 `K` 矩阵随后用于自注意力层，其中第一个操作是所有标记的查询向量与键向量之间的矩阵乘法。该过程在第 7 章中详细解释。生成的评分通过缩放点积注意力计算
    logits 作为 `SoftMax` 函数的输入。`SoftMax` 函数的输出与每个 GPU 上 `V` 矩阵的本地片段相乘。


    `SoftMax` 操作为每个输入词产生一个上下文向量 (`Cv`)，作为馈送神经网络 (`FFN`) 层的输入。尽管如此，自注意力层中的 `SoftMax`
    并不是最终预测层，它用于计算注意力权重。馈送网络处理的是自注意力产生的上下文向量标记表示，而不是预测的标记。最终预测通常由单独的输出投影以及随后对词表进行
    `SoftMax` 完成。


    ![](img/main-86.jpg)


    图 8-17：自注意力层中的张量并行。


    ### 馈送层


    图 8-18 展示了 Transformer 解码器模块中的馈送层。馈送网络由两个隐藏层和一个输出层组成。除了张量并行，我们还采用了结合流水线并行的模型并行。


