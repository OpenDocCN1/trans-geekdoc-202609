    第一个单词“Wife”（妻子）出现在查找表中，其标记值为 `2`。查找表中对应于标记值 `2` 的单词向量为 `[-3.5, -3.0]`。第二个单词“Mother”（母亲）被分配标记
    `3`，它关联的单词向量为 `[-2.5, +2.0]`，依此类推。


