    from this point on the horizontal axis to meet the parabolic curve. In our case,
    this intersection shows an error term of 0.245. In real-life scenarios, the error
    landscape often has many peaks and valleys rather than a simple symmetric curve.


    The Mean Squared Error (MSE) is a loss function that measures the difference between
    the predicted values and the expected values. It provides an overall error value
    for the model, which is also called the loss or cost, indicates how far off the
    predictions are.


    Next, the gradient is computed by taking the derivative of the loss function with
    respect to the model''s weights. This gradient shows both the direction and the
    magnitude of the steepest increase in error. During the Backward Pass, the algorithm
    calculates the gradient for each weight. By moving in the opposite direction of
    the gradient (using a method called Gradient Descent), the algorithm adjusts the
    weights to reduce the loss. This process is repeated many times so that the model
    output gradually becomes closer to the expected value. The Backward pass process
    is explained right after the Learning Rate section.


    The following sections will cover the processes and computations performed during
    the Backward Pass.


    ![](main-11.jpg)


    Figure 2-2: Mean Square Error.


    ## Learning Rate


    Besides determining the direction in which the error should be reduced, the process
    also needs to know the size of each adjustment step. This is defined by the Learning
    Rate. The Learning Rate value affects how much the weights are adjusted in response
    to the gradient during each iteration of the Backward Pass. A small Learning Rate
    leads to small, gradual changes, which may result in slower training but a more
    stable convergence. On the other hand, a large Learning Rate can speed up training
    by making larger adjustments, yet it might overshoot the optimal values and cause
    instability. Therefore, choosing the right Learning Rate is crucial for effective
    and efficient training. This is illustrated in the Figure 23. We will get back
    to Learning Rate in the Backward Pass section.


    ![](main-12.jpg)


    Figure 2-3: Learning Rate.


    ## Backward Pass


    The Forward Pass produces the model output ŷ, which is then used to compute the
    model error E. The closer ŷ is to the expected value y, the smaller the error,
    indicating better model performance. The purpose of the Backward Pass, as part
    of the Backpropagation algorithm, is to adjust the model’s weight parameters during
    training in a direction that gradually moves the model’s predictions closer to
    the expected values y.


    In Figure 2-4, the model’s output ŷb depends on the weighted sum zb of neuron-b.
    This weighted sum zb, in turn, is calculated by multiplying an input value ya
    by its associated weights w1. The same process applies to neuron-a. Backpropagation
    algorithm cannot directly modify the results of an activation function or the
    weighted sum itself. Nor can it alter the input values directly. Instead, it calculates
    weight adjustments, which are then used to update the model’s weights.


    Figure 2-4 illustrates this dependency chain and provides a high-level overview
    of how the Backpropagation algorithm determines weight adjustments. The following
    sections will explain this process in detail.


    ![](main-13.jpg)


    Figure 2-4: Backpropagation Overview: Backward Pass Dependency Chain.


    The somewhat crowded Figure 2-5 illustrates the components of the backpropagation
    algorithm, along with their relationships and dependencies. The figure consists
    of three main blocks. The rightmost block depicts the calculation of the error
    function. The middle and left blocks outline the steps for defining and adjusting
    new weight values. The complete backward pass process is explained next in detail,
    one step at a time.


    ![](main-14.jpg)


    Figure 2-5: The Backward Pass Overview.


    ### Partial Derivative for Error Function – Output Error


    The goal of training a model is to minimize the error, meaning we want 𝑦𝑦^b (the
    model''s prediction/output) to get as close as possible to y (the expected value).


    After computing the error E (=0.245), we compute the partial derivative of the
    error function with respect to yb (=1.7), which shows how small changes in 𝑦𝑦^b
    affects the error E. A derivative is called partial when one of its input values
    is held constant (i.e., not adjusted by the algorithm). In our example, the expected
    value y is constant input. The result of the partial derivative of the error function
    indicates how the predicted output 𝑦𝑦^b should change to minimize the model’s
    error.


    We use the following formula for computing the derivative of the error function:


    MSE^′ = - (𝑦𝑦 - 𝑦𝑦𝑦𝑦)


    MSE^′ = - (1.0 - 1.7)


    MSE^′ = 0.7


    Since the model output yb =1.7 is too high, the positive gradient suggests that
    it should be lowered by 0.7, which is the derivative of the error function (MSE’).
    This makes perfect sense because by subtracting the MSE''s 0.7 from the model
    output yb = 1.7, we obtain 1.0, which matches the expected value.


    ![](main-15.jpg)


    ### Partial Derivative for the Activation Function


    After computing the output error, we calculate the derivative of the activation
    function f(b) with respect to zb. Neuron-b uses a ReLU activation function, which
    states that if the function’s output is greater than 0, the derivative is 1; otherwise,
    it is 0. In our case, the result of the activation function f(b)=1.7, so the derivative
    is 1.


    𝑓𝑓 ^′ (𝑦𝑦) = ^


    1, if 𝑓𝑓(𝑦𝑦) >0


    0, if 𝑓𝑓(𝑦𝑦) ≤ 0


    ### Error Term for Neurons


    The error term for neuron-b is calculated by multiplying the partial derivative
    of the error function MSE’ = 0.7, by the derivative of the neuron''s activation
    function 𝑓𝑓^′(𝑦𝑦)= 1.0. This means we propagate the model''s error backward using
    it as a base value for finetuning the model accuracy (i.e., refining new weight
    values). This is why the term backward pass fits perfectly for the process.


    Error term (Enb) for Neuron-b = MSE’ ⋅ 𝑓𝑓^′(𝑦𝑦) = 0.7 ⋅ 1 = 0.7


    ![](main-16.jpg)


    Figure 2-7: The Backward Pass – Error Term for Neuron-b.


    After computing the error term for neuron-b, the backward pass moves to the preceding
    layer, the hidden layer, to calculate the error term for neuron a. First, the
    process computes a weighted sum of w ⋅ E across all connected neurons in the next
    layer, output layer in our example. This sum is then multiplied by the derivative
    of the activation function, 𝑓𝑓′(a). Since neuron-a is only connected to neuron-b,
    its error term is calculated as w1⋅ Enb ⋅ 𝑓𝑓′(a), resulting error term for neuron-a,
    Ean = 0.4 ⋅ 0.7 ⋅ 1= 0.28.


    ![](main-17.jpg)


    Figure 2-8: The Backward Pass – Error Term for Neuron-a.


    ### Gradient Calculation


    After computing the error terms for all neurons in every layer, the algorithm
    simultaneously calculates gradients for all weight parameters. Each gradient is
    determined by multiplying the input value by the corresponding error term.


    In our example, the gradient for weight wa1 , which connects input x1 to neuron-a,
    is calculated by multiplying the input value x1 (=3.0) by the error term Ena of
    neuron-a (= 0.28), resulting in a gradient of 0.84. Similarly, the gradient for
    weight wb1 in neuron-b is computed by multiplying the output y (=3.0) of the activation
    function from neuron-a by the error term Enb of neuron b (=0.7), yielding a gradient
    of 2.1.'
