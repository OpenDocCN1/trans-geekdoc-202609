    values `X1` and `ht-1` influence the computation of the cell''s internal value.
    The closer the sigmoid function''s output is to one, the more the original value
    influences the new value. Conversely, the closer the output is to zero, the less
    it influences the new value. The Input Activation neuron feeds the weighted sum
    `(WIA1 ⋅ ht-1) + (UIA1 ⋅ X1)` to the ReLU function. The output is then multiplied
    by the output of the Sigmoid function, providing the result of the Input Gate.
    At this phase, the LSTM cell has computed output for both Forget Gate (`XFG`)
    and Input Gate (`XIG`). Next, the LSTM feeds these values to the Identification
    Function.


    ![](main-48.jpg)


    Figure 6-3: Long Short-Term Memory Cell – Input Gate.


    ### Output Gate


    The Output Gate determines whether the output of the Output Activation neuron
    (ReLU) is fully published, partially published, or left unpublished. The factor
    of the Output Gate is calculated based on the input value `X1` and the output
    `ht-1` from the previous time step. That said, all Sigmoid neurons and the ReLU
    Input Activation function use the same inputs, and they leverage shared weight
    matrices. The input to the Output Activation neuron is the sum of the outputs
    from the Forget Gate (`Xfg`) and the Input Gate (`Xig`). In the figure, the sum
    is represented as `f(x) = Xfg + Xig`. The operation is computed by a neuron that
    uses the Identification function (`idF`). The original output of the Identification
    function is preserved as the internal cell state (`C`) for the next time step
    through the CEC (Constant Error Carousel) connection. The output of the Identification
    Function is then passed to the ReLU Output Activation function. This output is
    multiplied by the result of the Output Gate, producing the actual cell output
    `h1`. This value serves as input to the same LSTM cell in the next time step.
    In a multilayer model, the cell output is also used as input for the subsequent
    layer.


    ![](main-49.jpg)


    Figure 6-4: Long Short-Term Memory Cell – Output Gate.


    ## LTSM-based Recurrent Neural Network


    ### Recap of the Operation of an LSTM Cell


    The previous section introduced the construction and operation of a single Long
    Short-Term Memory (LSTM) cell. This section briefly discusses an LSTM-based Recurrent
    Neural Network (RNN). Before diving into the details, let’s recap how an LSTM
    cell operates with a theoretical, non-mathematical example.


    Suppose we want our model to produce the sentence: “It was cloudy, but it is raining
    now.” The first part of it refers to the past, and one of the LSTM cells has stored
    the tense “was” in its internal state. However, the last portion refers to the
    present. Naturally, we want the model to forget the previous tense “was” and update
    its state to reflect the current.


    The Forget Gate plays a role in discarding unnecessary information. In this case,
    the forget gate suppresses the word “was” by closing its gate (outputting 0).
    The Input Gate is responsible for providing a new cell state, which in this example
    is “is.” The input gate is fully open (outputting 1) to allow the latest information
