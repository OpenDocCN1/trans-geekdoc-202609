  trans: "\n\n-\n\n- **卷积神经网络 (CNNs)**：针对图像等空间数据进行了优化，CNN 使用卷积过滤器来提取边缘、纹理和形状等局部特征，同时通过权重共享保持模型尺寸的高效。\n\
    - **循环神经网络 (RNNs)**：为文本和时间序列等序列数据而设计，RNN 维护一个隐藏状态以捕捉之前的输入历史。这使得它们能够对跨序列的时间依赖和上下文进行建模。\n\
    - **基于 Transformer 的大语言模型 (LLMs)**：与 RNN 不同，Transformer 使用自注意力机制同时权衡序列中所有 token\
    \ 之间的关系。这种架构构成了最先进语言模型的基础，并使扩展到数十亿级参数成为可能。\n\n## 并行训练与深度学习的扩展（第 8 章）\n\n随着模型和数据集的增长，在单个\
    \ GPU 上进行训练变得变得不切实际。本节探讨了分布式训练的三种主要形式：\n\n- **数据并行 (Data Parallelism)**：每个 GPU\
    \ 都持有一个模型副本，但处理不同的输入数据小批量（mini-batches）。在每次迭代结束时同步梯度以保持权重对齐。\n- **流水线并行 (Pipeline\
    \ Parallelism)**：模型被划分到多个 GPU 上，每个 GPU 处理前向和反向传播的一个阶段。使用微小批量（micro-batches）来保持流水线满载并最大化利用率。\n\
    - **张量（模型）并行 (Tensor/Model Parallelism)**：将巨大的模型层拆分为更小的切片，每个 GPU 计算矩阵操作的一部分。这种方法允许训练无法放入单个\
    \ GPU 内存的超大模型。\n\n## 第二部分 – 第 9-14 章：AI 数据中心网络\n\n本书的这部分关注在现代 AI 数据中心实现大规模分布式训练的网络技术。它概述了基于以太网的\
    \ GPU 到 GPU 内存传输机制，然后转向拥塞控制、负载均衡策略、网络拓扑和 GPU 通信集合（collectives）。\n\n### RoCEv2\
    \ 与 GPU 到 GPU 传输（第 9 章）\n\n本节首先解释了如何使用直接内存访问（`DMA`）通过 `RoCEv2`（基于收敛以太网的 RDMA 版本\
    \ 2）跨以太网拷贝数据。这种方法允许位于不同服务器的 GPU 在不涉及 CPU 的情况下交换大量数据。\n\n### DCQCN：数据中心量化拥塞通知（第\
    \ 10-11 章）\n\nRoCEv2 的性能取决于无损传输层，这使得拥塞管理至关重要。为了解决这个问题，`DCQCN` 提供了一种先进的拥塞控制机制。它根据网络的实时反馈动态调整流量，以最小化\
    \ GPU 到 GPU 通信期间的延迟和丢包。\n\n- **显式拥塞通知 (ECN)**：当拥塞堆积时，网络交换机标记包而不是丢弃包。这些标记触发发送端的速率调整以防止过载。\n\
    - **基于优先级的流量控制 (PFC)**：`PFC` 确保如 `RoCEv2` 等流量类可以独立暂停，防止缓冲区溢出而不阻塞整个链路。\n\n### AI\
    \ 流量中的负载均衡技术（第 12 章）\n\n除了拥塞控制，有效的负载分布对于在集合通信期间维持 GPU 吞吐量至关重要。本节介绍了现代数据中心织网中使用的几种技术：\n\
    \n- **基于流的负载均衡 (Flow-based Load Balancing)**：根据实时链路使用情况或哈希分布将整个流或流组（flowlets）分配到路径，提高路径多样性和利用率。\n\
    - **流组切换 (Flowlet Switching)**：将流划分为时间间隔较小的突发数据（“流组”），可以在不产生重排序问题的情况下独立进行负载均衡。\n\
    - **数据包裁剪 (Packet Spraying)**：将属于同一流的数据包分布在多个可用路径上，有助于避免链路瓶颈。\n\n### AI 数据中心网络拓扑（第\
    \ 13 章）\n\n接下来，本节讨论了东西向织网（连接 GPU 服务器的内部网络）的设计选择。它引入了如下拓扑结构：\n\n- **机架顶交换机 (ToR)**：用于连接机架内服务器的传统机架级交换。\n\
    - **轨道与轨道优化设计 (Rail and Rail-Optimized Designs)**：为并行 GPU 集群定制的高吞吐量拓扑。这些布局提高了韧性和吞吐量，特别是在训练作业的突发通信阶段。\n\
    \n### GPU 到 GPU 通信（第 14 章）\n\n本部分以用于跨网络同步 GPU 的实用集合通信模式作为结束。这些集合操作对于分布式训练工作负载至关重要：\n\
    \n- **AllReduce**：每个 GPU 贡献并接收一份完整的、聚合后的数据副本。在内部，它分两个阶段实现：\n    1. **ReduceScatter**：GPU\
    \ 交换部分结果并计算最终和的一部分。\n    2. **AllGather**：每个 GPU 共享其计算的分段，以便每个 GPU 接收到完整的聚合结果。\n\
    - **广播 (Broadcast)**：单个 GPU（通常是 `rank 0`）在训练任务开始时将数据（如通信标识符或任务级元数据）发送给所有其他 GPU。\n\
    \n## 目标读者\n\n我写这本书是为了数据数据中心网络领域的专业人士——无论是担任架构、设计还是专家角色。它特别针对那些已经参与或正准备应对 AI 驱动数据中心独特需求的人员。随着\
    \ AI 工作负载重塑基础设施需求，本书旨在提供理解深度学习模型以及支持这些模型的网络系统所需的技术基础。\n\n## 免责声明\n\n本书的内容完全基于作者的个人经验、研究和测试。未经过\
