- raw: 'For inter-GPU server connection, GPUs are also connected to a shared NVIDIA
    ConnectX-7 200 GbE NIC through a PEX89144 PCIe Gen5 switch. Each GPU has a dedicated
    PCIe Gen5 x16 link to the switch, providing up to 64 GB/s of bidirectional bandwidth
    (32 GB/s in each direction) between the GPU and the switch. The ConnectX-7 (200Gbps)
    NIC is also connected to the same PCIe switch, enabling high-speed data transfers
    between remote GPUs and the NIC through the PCIe fabric.


    While each GPU benefits from a high-bandwidth, low-latency PCIe connection to
    the switch, the NIC itself has a maximum network bandwidth of 200 GbE, which corresponds
    to roughly 25 GB/s. Therefore, the PCIe switch is not a bottleneck; instead, the
    NIC’s available bandwidth must be shared among all eight GPUs. In scenarios where
    multiple GPUs are sending or receiving data simultaneously, the NIC becomes the
    limiting factor, and the bandwidth is divided between the GPUs.


    In real-world AI workloads, however, GPUs rarely saturate both the PCIe interface
    and the NIC at the same time. Data transfers between the GPUs and the NIC are
    often bursty and asynchronous, depending on the training or inference pipeline
    stage. For example, during deep learning training, large gradients might be exchanged
    periodically, but not every GPU constantly sends data at full speed. Additionally,
    many optimizations like gradient compression, pipeline parallelism, and overlapping
    computation with communication further reduce the likelihood of sustained full-speed
    congestion.


    As a result, even though the NIC bandwidth must be shared, the shared ConnectX-7
    design generally provides sufficient network performance for typical AI workloads
    without significantly impacting training or inference times.


    In high-performance environments, such as large-scale training workloads or GPU
    communication across nodes, this shared setup can become a bottleneck. Latency
    may increase under load, and data transfer speeds can slow down.


    Despite these challenges, the design is still useful in many cases. It is well-suited
    for development environments, smaller models, or setups where cost is a primary
    concern. If the workload does not require maximum GPU-to-network performance,
    sharing a NIC across GPUs can be a reasonable and efficient solution. However,
    for optimal performance and full support for technologies like GPUDirect RDMA,
    it is better to use a dedicated NIC for each GPU.


    ![](main-125.jpg)


    Figure 13-1: Shared NIC GPU Server.


    ### NIC per GPU


    Figure 13-2 builds on the shared NIC design from Figure 13-1 but takes a different
    approach. In this setup, each GPU has its own dedicated ConnectX-7 200 GbE NIC.
    All NICs are connected to the PCIe Gen5 switch, just like in the earlier setup,
    but now each GPU uses its own PCIe Gen5 x16 connection to a dedicated NIC. This
    design eliminates the need for NIC sharing and allows every GPU to use the full
    64 GB/s PCIe bandwidth independently.


    The biggest advantage of this design is in GPU-to-NIC communication. There is
    no bandwidth contention at the PCIe level, and each GPU can fully utilize RDMA
    and GPUDirect features with its own NIC. This setup improves network throughput
    and reduces latency, especially in multinode training workloads where GPUs frequently
    send and receive large amounts of data over Ethernet.


    The main drawback of this setup is cost. Adding one NIC per GPU increases both
    hardware costs and power consumption. It also requires more switch ports and cabling,
    which may affect system design. Still, these trade-offs are often acceptable in
    performance-critical environments.


    This overall design reflects NVIDIA’s DGX and HGX architecture, where GPUs are
    fully interconnected using NVLink and NVSwitch and each GPU is typically paired
    with a dedicated ConnectX or BlueField NIC to maximize network performance. In
    addition, this configuration is well suited for rail-optimized backend networks,
    where consistent per-GPU network bandwidth and predictable east-west traffic patterns
    are important.


    ![](main-126.jpg)


    Figure 13-2: Dedicated NIC per GPU.


    Before moving to the design sections, it is worth mentioning that the need for
    a high-performance backend network, and how it is designed, is closely related
    to the size of the neural networks being used. Larger models require more GPU
    memory and often must be split across multiple GPUs or even servers. This increases
    the need for fast, low-latency communication between GPUs, which puts more pressure
    on the backend network.


    Figure 13-3 shows a GPU server with 8 GPUs. Each GPU has 80 GB of memory, giving
    a total of 640 GB GPU memory. This kind of setup is common in high-performance
    AI clusters.


    The figure also shows three examples of running large language models (LLMs) with
    different parameter sizes:


    *   •    8B model: This model has 8 billion parameters and needs only approximately
    16 GB of memory. It fits on a single GPU if model parallelism is not required.


    *   •    70B model: This larger model has 70 billion parameters and needs approximately
    140 GB of memory. It cannot fit into one GPU, so it must use at least two GPUs.
    In this case, the GPUs communicate using intrahost GPU connections across NVLink.


    *   •    405B model: This large model has 405 billion parameters and needs approximately
    810 GB of memory. It does not fit into one server. Running this model requires
    at least 10 GPUs across multiple servers. The GPUs must use both intra-GPU connections
    inside a server and inter-GPU connections between servers.


    This figure highlights how model size directly affects memory needs, and the number
    of GPUs required. As models grow, parallelism and fast GPU interconnects become
    essential.


    ![](main-127.jpg)


    Figure 13-3: Model Size and Required GPUs.


    ## Design Scenarios


    ### Single Rail Switch Design with Dedicated, Single-Port NICs per GPU


    Figure 13-4 illustrates a single rail switch design. The switch interfaces are
    divided into three groups of eight 200 Gbps interface each. The first group of
    eight ports is reserved for Host-1, the second group for Host-2, and the third
    group for Host-3. Each host has eight GPUs, and each GPU is equipped with a dedicated,
    single-port NIC.


    Within each group, ports are assigned to different VLANs to separate traffic into
    different logical rails. Specifically, the first port of each group belongs to
    the VLAN representing Rail-1, the second port belongs to Rail-2, and so on. This
    pattern continues across all three host groups.


    #### Benefits


    *   •    Simplicity: The architecture is very easy to design, configure, and troubleshoot.
    A single switch and straightforward VLAN assignment simplify management.


    *   •    Cost-Effectiveness: Only one switch is needed, reducing capital expenditure
    (CapEx) compared to dual-rail or redundant designs. Less hardware also means lower
    operational expenditure (OpEx), including reduced power, cooling, and maintenance
    costs. Additionally, fewer devices translate to lower subscription-based licensing
    fees and service contract costs, further improving the total cost of ownership.


    *   •    Efficient Use of Resources: Ports are used efficiently by directly mapping
    each GPU’s NIC to a specific port on the switch, minimizing wasted capacity.


    *   •    Low Latency within the Rail: Since all communications stay within the
    same switch, latency is minimized, benefiting tightly-coupled GPU workloads.


    *   •    Sufficient for Smaller Deployments: In smaller clusters or test environments
    where absolute redundancy is not critical, this design is perfectly sufficient.


    #### Drawbacks


    *   •    No Redundancy: A single switch creates a single point of failure. If
    the switch fails, all GPU communications are lost.


    *   •    Limited Scalability: Expanding beyond the available switch ports can
    be challenging. Adding more hosts or GPUs might require replacing the switch or
    redesigning the network.'
