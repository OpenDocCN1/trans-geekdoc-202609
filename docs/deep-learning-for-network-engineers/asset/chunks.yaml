    # 第 6 章：长短期记忆


    ## 引言


    如上一章所述，RNN 可能具有数百甚至数千个时间步。这些基础 RNN 经常遭受梯度消失问题，即网络难以跨所有时间步保留信息。换句话说，随着时间的进行，网络逐渐“忘记”历史信息。


    解决时间步之间梯度消失问题的一种方案是使用长短期记忆（LSTM）网络替代基础 RNN。无论模型包含十还是几千个时间步，LSTM 都能保留历史信息。


    图 6-1 展示了 LSTM 单元的架构。它包含三个门：遗忘门、输入门（又称记忆门）和输出门。每个门包含使用 Sigmoid 激活函数的神经元。使用 Sigmoid
    函数的原因（如上一章图 5-4 所示）是它能够产生 0 到 1 之间的输出。输出 0 表示门“关闭”，意味着该信息被排除在单元内部状态之外。输出 1 反之意味着该信息在计算中被充分利用。然而，sigmoid
    函数永远给出精确的零输出。相反，随着输入值变得越来越负（趋于负无穷），输出会越来越接近零，但永远不会真正达到。同样，当输入值变得非常大时（趋于正无穷），sigmoid
    函数的输出接近 1。然而，和零一样，函数永远不会精确达到 1；它只是非常接近。


    作为完全关闭任何门的一种方法，你可以手动设置一个阈值，并定义将小于 `0.01` 的输出解释为零（门关闭）。同样的原理也适用于打开门，你可以设置阈值，例如将大于
    `0.95` 的输出解释为一（门完全打开）。然而，与其使用硬编码阈值，不如考虑更平滑的激活调整等替代方案。

