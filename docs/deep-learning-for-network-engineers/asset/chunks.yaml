    # Chapter 7: Large Language Model (LLM)


    ## Introduction


    This chapter introduces the basic operations of Transformer-based Large Language
    Models (LLMs), focusing on fundamental concepts rather than any specific models,
    such as OpenAI’s GPT (Generative Pretrained Transformer).


    The chapter begins with an introduction to tokenization and word embeddings, which
    convert input words into a format the model can process. Next, it explains how
    the transformer component leverages decoder architecture for input processing
    and prediction.


    This chapter has two main goals. First, it explains how an LLM understands the
    context of a word. For example, the word “clear” can be used as a verb (Please,
    clear the table.) or as an adjective (The sky was clear.), depending on the context.
    Second, it discusses why LLMs require parallelization across hundreds or even
    thousands of GPUs due to the large model size, massive datasets, and the computational
    complexity involved.


    ## Tokenizer and Word Embedding Matrix


    As a first step, we import a vocabulary into the model. The vocabulary used for
    training large language models (LLMs) typically consists of a mix of general and
    domain-specific terms, including basic vocabulary, technical terminology, academic
    and formal language, idiomatic expressions, cultural references, as well as synonyms
    and antonyms. Each word and character are stored in a word lookup table and assigned
    a unique token. This process is called tokenization.


    Many LLMs use Byte Pair Encoding (BPE), which splits words into subword units.
    For example, the word "unhappiness" might be broken down into "un," "happi," and
    "ness." BPE is widely used because it effectively balances vocabulary size and
    tokenization efficiency, particularly for handling rare words and sub-words. For
    simplicity, we use complete words in all our examples.


    Figure 7-1 illustrates the relationship between words in the vocabulary and their
    corresponding tokens. Token values start from 2 because token 0 is reserved for
    padding and token 1 for unknown words.


    Each token, representing a word, is mapped to a Word Embedding Vector, which is
    initially assigned random values. The collection of these vectors forms a Word
    Embedding Matrix. The dimensionality of each vector determines how much contextual
    information it can encode.


    For example, consider the word “clear.” A two-dimensional vector may distinguish
    it as either an adjective or a verb but lacks further contextual information.
    By increasing the number of dimensions, the model can capture more context and
    better understand the meaning of the word. In the sentence “The sky was clear,”
    the phrase “The sky was” suggests that "clear" is an adjective. However, if we
    extend the sentence to “She decided to clear the backyard of junk,” the word "clear"
    now functions as a verb. More dimensions allow the model to utilize surrounding
    words more effectively for next-word prediction. For instance, GPT-3 uses 12,288-dimensional
    vectors. Given a vocabulary size of 50,000 words used by GPT-3, the Word Embedding
    Matrix has dimensions of 12,288 × 50,000, resulting in 614,400,000 parameters.


    The context size, defined as the sequence length of vectors, determines how many
    preceding words the model considers when predicting the next word. In GPT-3, the
    context size is 2,048 tokens.


    ![](main-52.jpg)


    Figure 7-1: Tokenization and Word Embedding Matrix.


    ### Word Embedding


    As a first step, when we feed input words into a Natural Language Processing (NLP)
    model, we must convert them into a format the model can understand. This is a
    two-step process:


    - **Tokenization**: Each word is assigned a corresponding token from a lookup
    table.

    - **Word Embedding**: These token IDs are then mapped to vectors using a word
    embedding lookup table.

