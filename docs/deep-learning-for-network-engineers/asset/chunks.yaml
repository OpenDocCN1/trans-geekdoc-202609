    “the” receives the highest probability score and is predicted as the next word.


    ## Conclusion


    We use pretty simple examples in this chapter. However, GPT-3, for example, is
    built on a deep Transformer architecture comprising 96 decoder blocks. Each decoder
    block is divided into three primary sublayers:


    - **Attention Layer**: This layer implements multi-head self-attention using four
    key weight matrices, one each for the query, key, and value projections, plus
    one for the output projection. Together, these matrices account for roughly 600
    million trainable parameters per block.

    - **Add & Normalize Layers**: Each block employs two residual connections paired
    with layer normalization. The first Add & Normalize operation occurs immediately
    after the Attention Layer, and the second follows the Feed-Forward Neural Network
    (`FFNN`) layer. Although essential for stabilizing training, the parameters in
    each normalization step are relatively few, typically on the order of tens of
    thousands.

    - **Feed-Forward Neural Network (FFNN) Layer**: The `FFNN` consists of two linear
    transformations with an intermediate expansion (usually about four times the model’s
    hidden size). This layer contributes approximately 1.2 billion parameters per
    block.


    Aggregating the parameters from all 96 decoder blocks, and including additional
    parameters from the token embeddings, positional encodings, and other components,
    the entire GPT-3 model totals around 175 billion trainable parameters. This is
    why parallelism is essential: the training process must be distributed across
    multiple GPUs and executed according to a selected parallelization strategy. The
    second part of the book discusses about Parallelization.


