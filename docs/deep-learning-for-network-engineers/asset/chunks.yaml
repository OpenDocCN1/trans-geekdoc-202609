  trans: '


    远程直接内存访问（RDMA）架构实现了高性能计算（HPC）环境中计算节点（CN）之间的高效数据传输。基于收敛以太网的 RDMA 版本 2（RoCEv2）利用路由
    IP 织网作为 RDMA 消息的传输网络。由于 RDMA 数据包流的特性，传输网络必须提供无损、低延迟的数据包传输。RoCEv2 解决方案在传输层使用 `UDP`，它无法处理由网络拥塞引起的数据包丢失（交换机或接收端计算节点上的缓冲区溢出）。为了避免缓冲区溢出问题，使用了优先级流控制（PFC）和显式拥塞通知（ECN）作为信号机制，通过请求较低的数据包传输速率来对缓冲区阈值违规做出响应（第
    11 节详细描述了这些内容）。


    在介绍 RDMA 进程之前，让我们简要查看一下我们的示例计算节点。图 9-1 展示了我们的示例计算节点（CN）。客户端和服务器 CN 都配有一个图形处理器（GPU）。该
    GPU 拥有一个带有单接口的具备 RDMA 能力的网卡（`RNIC`）。此外，GPU 具有具有直接连接的设备内存单元，绕过了 CPU。在现实中，一个 CN
    可能拥有多个 GPU，每个 GPU 都有多个内存单元。CN 内部的 GPU 内通信通过高速 `NVLink` 进行。与远程 CN 的连接通过网卡发生，网卡至少有一个高速上行端口/接口。


    图 9-1 还展示了堆叠式细粒度 3D DRAM（FG-DRAM）解决方案的基本思想。在我们的示例中，有四个垂直连接的 DRAM 芯片，每个芯片被分为八个
    Bank（库）。每个 Bank 包含四个内存数组，每个数组由行和列组成，包含内存单元（通过电荷指示位是设置为 1 还是 0 的晶体管）。FG-DRAM 允许跨
    DRAM 分组为 Rank（秩），从而增加了内存容量和带宽。


    接下来的章节将介绍当客户端计算节点想要从其设备内存数据写入服务器计算节点的设备内存时所需的进程和操作。我将在后面的章节中讨论无损 IP 织网的设计模型和要求。


    ![](img/main-88.jpg)


    图 9-1：细粒度 DRAM 高层架构。


    ![](img/main-89.jpg)![](img/main-90.jpg)


    ## RDMA 进程概述


    后续章节的重点是概述当我们的示例应用程序从客户端计算节点（CCN）的设备内存数据写入服务器计算节点（SCN）的设备内存时涉及的进程。本节分为四个段落：


    *   a) 内存分配与注册，b) 队列对创建，c) 连接建立，以及 d) 从 CCN 和 SCN 的角度来看写操作。


    ### 内存分配与注册


    首先，我们分配一个保护域（`PD`）。你可以将 PD 视为 IP 网络中的一个租户。它能够为你的对象创建一个专用的、私有的环境，类似于传统网络中的虚拟路由和转发（`VRF`）实例，其中“对象”是
    IP 地址和路由表。在分配 PD 后，我们从物理设备内存中分配一个内存块并对其进行注册。在内存注册过程中，我们定义了内存块的大小并设置了其访问权限。在我们的示例中，我们将
    CCN 中注册内存的访问权限设置为“本地读取”（Local Read），将 SCN 中的设置为“远程写入”（Remote Write）。接下来，我们将注册的设备内存空间与
    PD 关联。


    注意，分配的物理内存可能不是连续的；因此，注册过程创建了一个虚拟的、连续的内存块。由于这些过程，我们获得了一个本地内存访问密钥，或 `L_Key`。当我们为
    RDMA 写操作注册内存并分配“远程写入”权限时，我们会获得一个远程内存密钥，或 `R_Key`。SCN 的情况正是如此。`R_Key` 通过管理连接发送到
    CCN（这超出了本章的范围）。在此阶段，两个节点都注册了与 PD 关联的设备内存。此外，还生成了 `L_Keys` 和 `R_Keys`。


    ![](img/main-91.jpg)


    图 9-2：内存分配与注册。


    ![](img/main-92.jpg)


    ### 创建队列对


    工作队列（`WQ`）是 RNIC 与设备内存之间双向的虚拟通信通道。WQ 由两个队列组成：发送队列（用于 RDMA 发送和写操作）和接收队列（用于接收操作）。队列对（`QP`）由这两个队列组成。完成队列（`CQ`）用于通知应用完成状态。在创建队列对时，我们指定服务类型（可靠连接或不可靠连接：点对点或数据报：多点）。在我们的示例中，我们使用的是可靠连接（`RC`）。在创建队列对时，我们将其绑定到相同的
    PD。为了在计算节点之间建立通信通道，网卡上的端口必须属于同一个分区。在创建队列对后，我们查询特定的 `P_Key`，将 QP 状态设置为 `INIT`（初始化），并设置
    `P_Key` 值。在连接建立过程中，CCN 向 SCN 发送 `P_Key`。


    你可以将 `P_Key` 视为队列对的虚拟连接标识。


    ![](img/main-93.jpg)


    图 9-3：创建队列对。


    ### RDMA 连接建立


    在此阶段，CCN 上的应用程序通过向 SCN 上的应用程序发送连接请求（`REQ`）消息来启动连接初始化。REQ 消息包含了本地标识符（`LID`）和通道适配器的全局唯一标识符（Local
    CA GUID``Local CA GUID 标识网卡，而本地通信标识符标识网卡端口。REQ 消息还携带了本地 QP 号（`0x12345678`）、QP
    服务类型（可靠连接）、起始数据序列号（`PSN: 0x00abc`）、`P_Key` 值（`0x8012`）以及负载大小（1024）。


    来自 SCN 的回复消息描述了本地和远程通信标识符、QP 号和 PSN。CCN 回复回复消息的是就绪（`RTU`）消息。在连接初始化过程中，QP 的状态从
    `INIT` 转换到就绪发送和就绪接收。连接建立后，CCN 上的应用程序就可以开始 RDMA 写过程。


    ![](img/main-94.jpg)


    图 9-4：RDMA 连接建立。


    '
