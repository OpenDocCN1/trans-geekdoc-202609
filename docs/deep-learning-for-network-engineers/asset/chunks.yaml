    # About This Book


    Several excellent books have been published over the past decade on Deep Learning
    (DL) and Datacenter Networking. However, I have not found a book that covers these
    topics together—as an integrated deep learning training system—while also highlighting
    the architecture of the datacenter network, especially the backend network, and
    the demands it must meet. This book aims to bridge that gap by offering insights
    into how Deep Learning workloads interact with and influence datacenter network
    design.


    ## So, what is Deep Learning?


    Deep Learning is a subfield of Machine Learning (ML), which itself is a part of
    the broader concept of Artificial Intelligence (AI). Unlike traditional software
    systems where machines follow explicitly programmed instructions, Deep Learning
    enables machines to learn from data without manual rule-setting.


    At its core, Deep Learning is about training artificial neural networks. These
    networks are mathematical models composed of layers of artificial neurons. Different
    types of networks suit different tasks—Convolutional Neural Networks (CNNs) for
    image recognition, and Large Language Models (LLMs) for natural language processing,
    to name a few.


    Training a neural network involves feeding it labeled data and adjusting its internal
    parameters through a process called backpropagation. During the forward pass,
    the model makes a prediction based on its current parameters. This prediction
    is then compared to the correct label to calculate an error. In the backward pass,
    the model uses this error to update its parameters, gradually improving its predictions.
    Repeating this process over many iterations allows the model to learn from the
    data and make increasingly accurate predictions.


    ## Why should network engineers care?


    Modern Deep Learning models can be extremely large, often exceeding the memory
    capacity of a single GPU or CPU. In these cases, training must be distributed
    across multiple processors. This introduces the need for highspeed communication
    between GPUs—both within a single server (intranode) and across multiple servers
    (inter-node).


    Intra-node GPU communication typically relies on high-speed interconnects like
    NVLink, with Direct Memory Access (DMA) operations enabling efficient data transfers
    between GPUs. Inter-node communication, however, depends on the backend network,
    either InfiniBand or Ethernet-based. Synchronization of model parameters across
    GPUs places strict requirements on the network: high throughput, ultralow latency,
    and zero packet loss. Achieving this in an Ethernet fabric is challenging but
    possible.


    This is where datacenter networking meets Deep Learning. Understanding how GPUs
    communicate and what the network must deliver is essential for designing effective
    AI data center infrastructures.


    ![](main-3.jpg)


    ## What this book is—and isn’t


    This book provides a theoretical and conceptual overview. It is not a configuration
    or implementation guide, although some configuration examples are included to
    support key concepts. Since the focus is on the Deep Learning process, not on
    interacting with or managing the model, there are no chapters covering frontend
    or management networks. The storage network is also outside the scope. The focus
    is strictly on the backend network.


    The goal is to help readers—especially network professionals—grasp the “big picture”
    of how Deep Learning impacts data center networking.


    ## One final note


    In all my previous books, I’ve used font size 10 and single line spacing. For
    this book, I’ve increased the font size to 11 and the line spacing to 1.15. This
    wasn’t to add more pages but to make the reading experience more comfortable.
    I’ve also tried to ensure that figures and their explanations appear on the same
    page, which occasionally results in some white space.


    I hope you find this book helpful and engaging as you explore the fascinating
    intersection of Deep Learning and Datacenter Networking.


    ## How this book is organized


    ## Part I – Chapters 1-8: Deep Learning and Deep Neural Networks


    This part of the book lays the theoretical foundation for understanding how modern
    AI models are built and trained. It introduces the structure and purpose of artificial
    neurons and gradually builds up to complete deep learning architectures and parallel
    training methods.


    Artificial Neurons and Feedforward Networks (Chapters 1 - 3)


    The journey begins with the artificial neuron, also known as a perceptron, which
    is the smallest functional unit of a neural network. It operates in two key steps:
    performing a matrix multiplication between inputs and weights, followed by applying
    a non-linear activation function to provide an output.


    By connecting many neurons across layers, we form a Feedforward Neural Network
    (FNN). FNNs are ideal for basic classification and regression tasks and provide
    the stepping stone to more advanced architectures.


    Specialized Architectures: CNNs, RNNs, and Transformers (Chapters 3 - 9)


    After covering FNNs, this part dives into models designed for specific data types:'
