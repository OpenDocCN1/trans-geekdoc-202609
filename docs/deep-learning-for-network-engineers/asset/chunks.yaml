  trans: '


    图 5-2 展示了 RNN 训练过程的简化视图。在上一节中，我们解释了如何使用独热编码来生成用于训练的输入向量。例如，字符“a”由输入向量 `[1, 0,
    0, 0]` 表示，该向量被输入隐藏层。隐藏层中的每个神经元都有一个与输入向量相关的专用权重矩阵。


    ### RNN 中的权重矩阵

    与输入向量相关的权重值标记为 `U`，而循环连接（跨时间步的神经元之间的连接）的权重标记为 `W`。这种分离是区分输入处理权重与循环操作权重的标准方法。


    ### 隐藏层中的加权之和计算

    隐藏层中的神经元计算输入向量的加权之和。只有输入向量中与 1 对应的序列对计算有贡献，因为所有其他序列在相乘时结果为零。该计算还包含一个偏置项。例如，如果输入向量
    `[1, 0, 0, 0]` 的权重矩阵为 `[Un1, Un2, Un3, Un4]`，则只有权重 `Un1` 对总和有贡献。


    初始时间步的此加权之和的结果标记为 `h^((-1t))`。该结果被“存储”并作为下一个时间步的输入。在计算加权之和后，它通过激活函数，生成的激活值被输入到输出层。


    ### 输出层操作

    在我们的示例中，为了简单起见有两个输出神经元，但在实际场景中，输出层包含的神经元数量与输入向量维度相同（在本例中为四个）。每个输出神经元计算其输入的加权之和，产生一个称为
    logit 的值。这些 logit 通过了 `SoftMax` 激活函数，该函数将其每个输出神经元的概率。注意，`SoftMax` 函数在第 3 章——多分类分类中进行了讨论。


    在这个示例中，概率最高的输出神经元对应于第三位置（图中未显示）。这产生了输出向量 `[0, 0, 1, 0]`，它代表字符“l”。


    ![](img/main-42.jpg)


    图 5-2：循环神经网络 – 基础操作。


    ### 与前馈神经网络 (FNNs) 的比较

    到目前为止，这个过程类似于前馈神经网络 (FNN)。输入向量从输入层传递到隐藏层，神经元在那里计算加权之和并应用激活函数。由于隐藏层和输出层是全连接的，隐藏层的激活值被传递到输出层。


    ### 移动到第二个时间步

    在第二个时间步，输出向量 `[0, 0, 1, 0]`连同上一步的加权之和 `h^(n(t-1))` 用于计算新的加权之和。该计算也包含一个偏置项。由于每个时间步都使用相同的模型，权重矩阵保持不变。在这个时间步，只有权重
    `Un3` 对总和有贡献，因为它对应于输入向量中的非零值。其余过程遵循与初始时间步相同的步骤。一旦完成时间步 1，过程将进展到时间步 2，重复相同的计算。这一序列一直持续到训练完成。


    ### 循环神经网络中的反向传播

    RNN 中的反向传播被称为随时间反向传播 (BPTT)，因为它不仅通过网络层进行传播误差，还通过时间步反向传播误差。如果你将时间步想象为堆叠的层，那么 BPTT
    过程所需的计算周期和内存比前馈神经网络 (FNN) 少，因为 RNN 在层之间使用共享权重矩阵，而 FNN 为每层分配了特定的权重值。与 RNN ，第 4
    章引入的卷积神经网络 (CNN) 也利用共享权重矩阵，但是在层内部而非层之间。


    ### RNN 模型的挑战

    图 5-3 显示了我们的循环神经网络 (RNN) 的最后两个时间步。在时间步 `n`（左侧），有两个输入用于加权之和计算：`Xn`（当前时间步的输入）和 `ht-1`（来自上一个时间步的隐藏状态）。


    首先，模型计算这些输入的加权之和。然后将结果通过神经元的激活函数（本例中为 `Sigmoid`）。激活函数的输出 `ht` 被馈回下一个时间步 `n+1`
    的循环层中。在时间步 `n+1` 时，`ht` 与输入 `Xn` 结合以计算加权之和。该结果随后通过激活函数，该函数现在产生模型的预测值 `𝑦^` (y hat)。这些步骤是正向传播过程的一部分。


    作为正向传播的最后一步，我们使用均方误差 (MSE) 函数（在第 2 章中解释）计算模型的准确率。


    如果模型的准确率与预期结果不够接近，它将开始反向传播以提高性能。在反向传播期间最小化损失函数最常用的优化算法是梯度下降，它逐步更新模型参数。


    反向传播过程始于计算误差函数的导数（即误差函数相对于输出激活值的梯度），以确定输出误差 (Output Error)。


    接下来，将输出误差与激活函数的导数相乘，以计算神经元的局部误差项 (Error Term）（即激活函数对其输入的导数是局部梯度，它决定了激活值如何响应输入的变化）。然后，将误差项传播到所有时间步，以计算实际的权重调整值。


    在这个示例中，我们关注与循环连接相关的权重值的更新。然而，这一过程也适用于链接输入值的权重。神经元特定的权重调整值是通过局部误差项与相应输入值以及学习率相乘计算的。


    ### 饱和神经元


