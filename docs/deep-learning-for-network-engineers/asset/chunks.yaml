    weight adjustment values during Backpropagation Through Time (BPTT). Additionally,
    the shared weight matrices help reduce the model memory utilization by limiting
    the number of weight variables.


    In the figure, the matrix `WFG1` is associated with the input received from the
    preceding time step, while the matrix `UFG1` is used for the new input value `X1`.
