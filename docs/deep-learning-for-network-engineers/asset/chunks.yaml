- raw: 'In Figure 11-2, GPU-0 on Host-1 transfers gradient values from its local memory
    to the memory of GPU-0 on Host-2. Although not shown in the figure for simplicity,
    other GPUs connected to the same rail switch also participate in the synchronization
    process with GPU-0 on Host-2. Multiple simultaneous elephant flows towards GPU-0
    reach the rail switch, causing egress queue 3 on interface Ethernet2/24 to exceed
    the WRED Maximum threshold. As a result, the switch begins marking outgoing packets
    with ECN 11 (step 6), while still forwarding them to the destination GPU.


    ![](main-106.jpg)


    Figure 11-2: Congested Egress Interface – ECN Congestion Experienced.


    After receiving a data packet marked with ECN 11, the destination RDMA NIC must
    inform the sender about network congestion. This is accomplished using a Congestion
    Notification Packet (CNP), which provides feedback at the RDMA transport layer.


    *   1\.    Upon detecting the ECN 11 in the IP header’s ToS bits of an incoming
    packet, the RDMA NIC on Host-2 generates a CNP message. It sets the OpCode in
    the IBTH header to 0x81, identifying the message as a CNP. Besides the FECN bit
    is set to 1, indicating that the NIC experienced congestion. The Queue Pair number
    used for the original memory copy (e.g., 0x123456) is reused, ensuring the feedback
    reaches the correct sender-side transport context. In the IP header, the DSCP
    field is set to 48, allowing switches to distinguish the CNP from standard RoCEv2
    data traffic.


    *   2\.    When the CNP reaches the Rail switch (interface Ethernet2/24), it is
    classified based on DSCP 48, which is associated with CNP traffic in the QoS configuration.


    *   3\.    DSCP 48 maps the packet to QoS group 7, which is reserved for congestion
    feedback signaling.


    *   4\.    QoS group 7 is associated with strict-priority egress queue 7, ensuring
    that CNP packets are forwarded with the highest priority. This guarantees that
    congestion signals are not delayed behind other types of traffic.


    *   5\.    The switch forwards the CNP to the originating NIC on Host-1. Because
    of the strict-priority handling, the feedback arrives quickly even during severe
    congestion.


    *   6\.    Upon receiving the CNP, the sender-side RDMA NIC reduces its transmission
    rate for the affected Queue Pair by increasing inter-packet delay. This is achieved
    by holding outgoing packets longer in local buffers, effectively reducing traffic
    injection into the congested fabric.


    As transmission rates decrease, the pressure on the egress queue at the Rail switch’s
    interface Ethernet1/14 (connected to Host-2) is gradually relieved. Buffer occupancy
    falls below the WRED Minimum Threshold, ending ECN marking. Once congestion is
    fully cleared, the RDMA NIC slowly ramp up its transmission rate. This gradual
    marking strategy helps prevent sudden traffic loss and gives the sender time to
    react by adjusting its sending rate before the buffer overflows.


    ![](main-107.jpg)


    Figure 11-3: Receiving NIC Generates CNP - Sender NIC Delay Transmit.


    ## DSCP-Based Priority Flow Control (PFC)


    Priority Flow Control (PFC) is a mechanism designed to prevent packet loss during
    network congestion by pausing traffic selectively based on priority levels. While
    the original IEEE 802.1Qbb standard operates at Layer 2, using the Priority Code
    Point (PCP) field in Ethernet headers, AI Fabrics rely on Layer 3 forwarding,
    where traditional Layer 2-based PFC is no longer applicable. To extend lossless
    behavior across routed (Layer 3) networks, DSCP-based PFC is used.


    In DSCP-based PFC, the Differentiated Services Code Point (DSCP) field in the
    IP header identifies the traffic class or priority. Switches map specific DSCP
    values to internal traffic classes and queues. If congestion occurs on an ingress
    interface and a particular priority queue fills beyond a threshold, the switch
    can send a PFC pause frame back to the sender switch, instructing it to temporarily
    stop sending traffic of that class—just as in Layer 2 PFC, but now triggered based
    on Layer 3 classifications.


    This behavior differs from Explicit Congestion Notification (ECN), which operates
    at Layer 3 as well but signals congestion by marking packets instead of stopping
    traffic. ECN acts on the egress port, informing the receiver to notify the sender
    to reduce the transmission rate over time. In


    contrast, PFC acts immediately at the ingress port, pausing traffic flow in real
    time to avoid buffer overflows and packet drops.


    PFC relies on two thresholds to control flow: xOFF and xON. The xOFF threshold
    defines the point at which the switch generates a pause frame when a priority
    queue reaches a congested state. Once triggered, upstream devices halt transmission
    of that traffic class. The switch continuously monitors its buffer occupancy,
    and when the level drops below the xON threshold, it sends a PFC frame with a
    Quanta value of 0 for the affected priority. This signals the upstream device
    that it can resume transmission for that specific priority queue.


    A key requirement for PFC to function correctly is the provisioning of buffer
    headroom. The switch must reserve enough buffer space per priority class to accommodate
    in-flight traffic while the pause frame propagates to the sender and takes effect.


    DSCP-based PFC enables lossless packet delivery over routed networks, which is
    especially important for technologies like RoCEv2 (RDMA over Converged Ethernet
    v2), where even minimal packet loss can cause significant performance degradation.


    DSCP-Based PFC Process over a Layer 3 Routed Interface (Example Scenario)


    This example illustrates how DSCP-based Priority Flow Control (PFC) operates across
    a routed Layer 3 fabric during congestion. We walk through a four-step process,
    beginning with buffer overflow and ending with traffic pausing on the correct
