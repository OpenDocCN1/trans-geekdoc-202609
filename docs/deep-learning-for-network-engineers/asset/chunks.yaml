    - If the `pause quanta` is set to maximum value `0xFFFF` (65535), the pause duration
    is roughly 83.9 microseconds.


    This pause frame is sent back to the sender `Spine Switch 1`. Since the `DSCP`-based
    classification maps back to priority queue 3, and the switches share the same
    mapping, `Spine Switch 1` will interpret this correctly.


    ### Step 4: Spine Switch 1 Pauses Transmission on Priority Queue 3


    Upon receiving the `PFC` frame on its ingress interface `E3/24` connected to `Rail
    Switch C`, `Spine Switch 1` examines the class enable vector.


    - Since `bit 3` is set, the switch knows to pause transmission of all frames mapped
    to priority queue 3 (`DSCP` value `24` in our example) on egress interface `E3/24`.


    Traffic for other priority queues continues unaffected.


    `Spine Switch 1` holds off transmission of priority 3 traffic until it receives
    a subsequent `PFC` frame with `quanta = 0`, indicating “resume,” or a pause duration
    timeout occurs, after which the switch resumes sending unless another pause is
    received.


    ![](main-108.jpg)![](main-109.jpg)![](main-110.jpg)


    Figure 11-4: Priority Flow Control – Pause Frame.


    The following example shows how Priority Flow Control (`PFC`) events can cascade
    upstream when congestion persists in a routed Layer 3 fabric. This scenario builds
    on the earlier case, where `Spine Switch 1` paused traffic to `Rail Switch C`.
    Now, we observe how that pause affects traffic originating from `Rail Switches
    A` and `B`.


    ### Step 5: Congestion on Spine Switch 1 Egress Queue to Rail Switch C


    As described in the previous figure, `Spine Switch 1` received a `PFC` frame from
    `Rail Switch C` and responded by pausing traffic on priority queue 3 on its egress
    interface `E3/24` (towards `Rail Switch C`). Because this interface is no longer
    sending traffic, frames destined for `GPU-3` via `Rail Switch C` begin to accumulate
    in `Spine Switch 1`’s egress queue 3. This build-up causes backpressure that impacts
    the ingress side of the switch.


    ### Step 6: xOFF Threshold Exceeded on Spine Switch 1 Ingress Interfaces


    `Spine Switch 1` receives incoming traffic from `Rail Switch A` (interface `E1/24`)
    and `Rail Switch B` (interface `E2/24`). Both switches are sending traffic mapped
    to priority queue 3 (e.g., `DSCP` 24). As the egress queue to `Rail Switch C`
    becomes full and cannot drain, the corresponding ingress buffers on interfaces
    `E1/24` and `E2/24` also begin to fill up, specifically for queue 3. Eventually,
    the `xOFF` thresholds on both ingress interfaces are exceeded, indicating that
    congestion is now impacting the reception of new packets on these ports.


    ### Step 7: Spine Switch 1 Sends PFC Pause Frames to Rail Switch A and B


    To avoid dropping packets due to ingress buffer overflow, `Spine Switch 1` generates
    `PFC` MAC Control frames on both `E1/24` and `E2/24`. The class enable vector
    has `bit 3` set, instructing the sender to pause traffic corresponding to priority
    queue 3. A suitable `quanta` value is included to define the pause duration. These
    control frames travel back to `Rail Switch A` and `Rail Switch B` respectively.


    ### Step 8: Rail Switches A and B Pause Queue 3 Traffic to Spine Switch 1


    Upon receiving the `PFC` frames, both `Rail Switch A` and `Rail Switch B` interpret
    the class enable vector and pause all traffic mapped to priority queue 3 (e.g.,
    `DSCP` 24), still forwarding traffic on other priority queues unaffected. This
    marks the upstream propagation of congestion: a single bottleneck on the path
    to `GPU-3` can trigger `PFC` reactions all the way back to multiple source switches.


    ![](main-111.jpg)


    Figure 11-5: Priority Flow Control – Cascading Effect.


    ### Steps 9a – 14: Downstream Resume and Congestion Recovery


    Figure 11-6 illustrates how the `PFC`-based congestion recovery process extends
    from `Rail Switches A` and `B` all the way to the `GPU NICs`, while simultaneously
    resolving the initial congestion at `Rail Switch C`.


    As a result of the earlier `PFC` pause frames:


    - `Rail Switch A` and `Rail Switch B` have paused sending priority queue 3 traffic
    to `Spine Switch 1`.

    - In turn, `Spine Switch 1` has paused its own egress traffic toward `Rail Switch
    C` on interface `E3/24`.


    This pause allows queue 3 to clear congestion. Once the `xOFF` threshold is met,
    `Spine Switch 1` sends a `PFC` frame with `quanta = 0`, signaling a resume. This
    propagates back to `Rail Switches A` and `B`, allowing them to resume sending
    priority queue 3 traffic.

