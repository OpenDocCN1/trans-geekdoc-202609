    # 第 13 章：后端网络拓扑


    ## 引言


    尽管 AI 网络有许多最佳实践，例如数据中心拥塞控制（QCN）、优化 Clos 织网和二层 Rail 拓扑，但每个厂商都有自己的设计。然而，本章并不关注任何特定厂商的设计，而是解释了构建弹性、无损
    AI 后端网络的通用原则。


    在深入研究后端网络之前，本章首先提供了基于 NVIDIA `H100` GPU 服务器的高级概述。第一部分介绍了共享网卡架构，8 个 GPU 共享两个网卡。第二部分涵盖了每个
    8 个 GPU 都配有一个专用网卡的架构。


    ### 共享网卡


    图 13-1 展示了共享网卡方法。在此示例设置中，NVIDIA `H100` GPU `0–3` 连接到底板 1 上的 `NVSwitch` 芯片 `1-1`、`1-2`、`1-3`
    和 `1-4`，而 GPU `4–7` 连接到底板 2 上的 `2-1`、`2-2`、`2-3` 和 `2-4`。每个 GPU 连接到其各自底板上的四个 `NVSwitch`
    芯片，总共使用 18 条 `NVLink 4` 连接：5 条到 `1-1`、4 条到 `1-2`、4 条到 `1-3` 以及 5 条到 `1-4`。


    `NVSwitch` 芯片本身在底板之间进行配对。例如，底板 1 上的芯片 `1-1` 与底板 2 上的芯片 `2-1` 有四个 `NVLink` 连接，芯片
    `1-2` 连接到 `2-2`，依此类推。这种设计在整个系统中形成了一个全连接交叉拓扑结构。


    得益于这种平衡配对，无论 GPU 位于同一块底板还是不同的底板，GPU 之间 get 通信都是非常高效的。

