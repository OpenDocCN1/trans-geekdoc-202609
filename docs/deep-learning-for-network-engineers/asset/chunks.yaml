    # Chapter 1: Artificial Neuron


    ## Introduction


    Before diving into the somewhat complex world of deep learning, let’s first consider
    how humans learn new skills through repetition, feedback, and guidance.


    Judo, as a martial art, serves as a good example. I trained in judo for over 20
    years. During that time, I learned which throwing techniques to use to take down
    an opponent efficiently by leveraging their movement, energy, and reactions. But
    how did I learn that?


    Through a supervised training process.


    Our coach first taught us the throwing techniques and explained the situations
    in which they work best. We then practiced them, starting with static drills where
    the opponent stood still. Once the basic movement was learned, we moved on to
    pre-arranged sequences that introduced movement and timing.


    Mastering these techniques required thousands of repetitions. Even then, perfect
    performance was not guaranteed, due to variables such as the opponent’s movement,
    strength, body length, technical level, and so on.


