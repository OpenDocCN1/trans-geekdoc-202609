    # 图 7-19：概率计算 - 向 SoftMax 函数添加 Logits


    最后，选择概率最高的词作为下一个标记（token）。然后，通过标记到词的查找将该标记映射回其对应的单词。这启动了下一次迭代，在迭代中，标记被转换为其词嵌入向量，并与位置编码结合，为下一次迭代创建实际词嵌入。


    ![](img/main-69.jpg)


    # 图 7-20：词到标记以及标记到词的嵌入过程。


    在理论上，我们的简单示例展示了模型可以为正确的单词分配最高概率。例如，通过分析单词“clear”相对于其前置词的位置，模型能够推断出上下文。当上下文暗示某个动作指向已知目标时，冠词“the”会获得最高概率分并预测为下一个单词。


    ## 结论


    我们在本章中使用了非常简单的示例。然而，例如 GPT-3 是构建在包含 96 个解码器块的深度 Transformer 架构上的。每个解码器块被分为三个主要的子层：


    - **注意力层 (Attention Layer)**：该层使用四个关键权重矩阵实现多头自注意力，分别用于查询（query）、键（key）和值（value）投影，外加一个输出投影。这些矩阵总计每个块贡献了约
    6 亿个可训练参数。

    - **添加与归一化层 (Add & Normalize Layers)**：每个块采用两个与层归一化配对的残差连接。第一个 Add & Normalize
    操作紧在注意力层之后，第二个跟随在前馈神经网络（`FFNN`）层之后。尽管这对于稳定训练至关重要，但每个归一化步骤中的参数相对较少，通常在万级水平。

    - **前馈神经网络 (FFNN) 层**：`FFNN` 由两个线性变换组成，并配有一个中间扩展层（通常是模型隐藏层大小的 4 倍）。该层每个块贡献了约 12
    亿个参数。


    汇总所有 96 个解码器块的参数，并加上来自标记嵌入、位置编码和其他组件的额外参数，整个 GPT-3 模型总计约为 1750 亿可训练参数。这就是为什么并行化至关重要的原因：训练过程必须分布在多个
    GPU 上，并根据选定的并行化策略执行。书的第二部分将讨论并行化。


    ## 参考文献


    - [1] Magnus Ekman, “Learning Deep Learning: Theory and Practice of Neural Networks,
    Computer Vision, Natural Language Processing, and Transformers Using TensorFlow”,
    17 Aug. 2021

    - [2] Vaswani, A., Shazeer, N., Parmar, N., Uszkoreit, J., Jones, L., Gomez, A.
    N., Kaiser, Ł., & Polosukhin, I. (2017, June 12). Attention Is All You Need. arXiv.
    [https://arxiv.org/abs/1706.03762]

    - [3] Google Developers. (2024, April). LLMs: What''s a Large Language Model?
    [https://developers.google.com/machine-learning/crash-course/llm/transformers]

    - [4] IBM. (2025, March 28). What is a Transformer Model? [https://www.ibm.com/think/topics/transformer-model]

    - [5] TrueFoundry. (2023, March). Transformer Architecture in Large Language Models.
    [https://www.truefoundry.com/blog/transformer-architecture]


    104 第 7 章：大语言模型 (LLM)


    # 第 8 章：深度学习中的并行策略


    ## 引言


    图 8-1 描述了需要存储在 GPU 内存中的一些模型参数：a) 与前层连接相关的权重矩阵，b) 加权和 (`z`)，c) 激活值 (`y`)，d) 误差
    (`E`)，e) 局部梯度，f) 远程梯度 (`∇`)，g) 学习率 (`LR`), 以及 h) 权重调整 (`w`)。此外，单个 GPU 可能内存不足。为了解决这一限制，必须选择合适的并行化策略。本章介绍了最常用的策略，包括数据并行、模型并行、流水线并行和张量并行。


    ![](img/main-70.jpg)


    图 8-1：神经网络概述


    ## 数据并行


    在数据并行化中，每个 GPU 都有一个模型的副本。当模型能够放入单个 GPU 时，这种方法是有效的。在图 8-2 中，批次（batch）被分成 8 个微批次（micro-batches）。前几个微批次由
    `A1` 处理，而剩余的微批次由 `A2` 处理。两个 GPU 共享同一个模型，但处理不同的数据。在前向传播期间，GPU 生成预测。在计算出模型误差后，开始反向传播。误差向后传播，以计算模型每个权重的导数。这些梯度在
    GPU 之间进行同步，然后求和并除以 GPU 的数量。


    在我们简单的双 GPU 示例中，这个过程不会产生过量的网络流量，梯度在 GPU 之间同步，尽管 GPU 可以使用其 100% 的 NIC 容量。然而，如果使用成百或数千个
    GPU，网络流量将变得巨大。单个服务器内的 GPU 间通信（使用 `PCIe`、`NVLink`）或跨服务器通信（通过 `InfiniBand`、`Ethernet`）需要低延迟且无损的数据包转发。低延迟是为了尽可能缩短训练时间，而无损传输是关重要的，因为如果在同步期间丢失数据包，训练将暂停。在最坏的情况下，如果没有训练进度的快照，整个训练必须从头开始。


    ## 功耗示例


    考虑训练已经运行了两个月，由于单个数据包丢失而必须重启的电力成本。


    - 单个 GPU 在满载下消耗消耗 350W。

    - 50,000 个 GPU 的总功耗：`350 W * 50,000 = 17,500,000 W = 17.5 MW`。

    - 训练两个月（60 天 = 1440 小时）：`17.5 MW * 1440 hours = 25,200 MWh = 25,200,000`。

    - 如果电价为每度 0.10 美元，则总训练成本为：`25,200,000 kWh * 0.10 = 2,520,000 美元`。


    ![](img/main-71.jpg)


    图 8-2：数据并行概述


