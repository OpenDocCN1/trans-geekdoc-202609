  trans: '

    这种设计类似于可扩展 AI 集群中使用的双轨（dual-rail）概念，但 NVIDIA 的 `SU` 方案要求每轨配备两个独立的物理交换机，从而提供了完全的物理隔离。每交换机双轨在资本支出（CapEx）和运营支出（OpEx）之间取得了平衡：它比单轨模型所需的交换机更少，且与多轨模型相比降低了操作复杂性。对于必须平衡某些容错能力和成本控制的中等规模环境，这通常是一个很好的选择。


    图 13-11 展示了每交换机双轨的设计，其中交换机接口均匀分布在两个独立的轨道上。轨道 1 使用接口 `1` 到 `16`，并分配给子网 `10.0.1.0/25`（`VLAN
    101`）。轨道 2 使用接口 `17` 到 `32`，并分配给子网 `10.0.128.0/25`（`VLAN 102`）。每个 `VLAN` 都有自己的
    MAC 地址表，且轨道交换机作为两者的默认网关。各个 `/25` 子网被重新分配到 `BGP` 进程中并汇总为 `10.0.1.0/24` 向脊网层（spine
    layer）发布。


    ![](img/main-135.jpg)


    图 13-11：双轨交换机。


    ## 每交换机单轨 (Single-Rail-per-Switch)


    该模型提供了最高级别的物理隔离。每台交换机形成一个单一轨道，通过一个子网和一个 `VLAN` 为其连接的 GPU 服务器服务。不需要逻辑隔离，因为每个轨道在硬件上是完全独立的。因此，交换机故障只会影响连接到该特定轨道的
    GPU 服务器，产生小且可预测的故障域。


    该设计与 NVIDIA 的可扩展单元（`SU`）架构紧密结合，在该架构中，每个机架或机架组包含自己的轨道交换机，通过重复模块化、自包含的单元来实现水平扩展。


    虽然由于交换机与轨道之间的一一一映射，该模型需要最高的 CapEx，但它具有重大的运营优势。配置更简单，故障排除速度更快，且级联故障的风险降最低。不需要进行路由汇总或自定义
    `BGP` 重分发逻辑。随着时间的推移，这些优势有助于降低 OpEx，特别在大规模或任务关键 GPU 集群中。


    为了确保最优的硬件利用率，将每机架的 GPU 服务器数量与交换机的端口容量对齐非常重要。否则，端口不足会导致基础设施成本和资源规划的效率低下。


    图 13-12 展示了一个简化的每交换机单轨拓扑。从 `1` 到 `32` 的接口都在单轨内运行，配置为子网 `10.0.1.0/24` 和 `VLAN 101`。轨道交换机作为默认网关，由于使用了整个
    `/24` 子网而未划分子网，因此不需要路由汇总。


    ![](img/main-136.jpg)


    图 13-12：单轨交换机。


    ## AI Fabric 架构结论


    图 13-13 展示了描述 AI Fabric 总体架构的一种。它分为三个领域。第一个领域称为 `Segment`（段），包括 GPU 主机和轨道交换机。第二个领域
    `Pod` 使用 `Spine`（脊）交换机聚合多个 `Segment`。在 `NCCL` 构建的拓扑中，跨轨主机间流量首先复制到本地 GPU 内存（位于目标轨道），然后通过
    GPU NIC 经正确的轨道交换机发送到远程 GPU 的情况下，可能不需要带有 `Spine` 交换机的 `Pod` 架构。第三个领域是多 Pod，它使用
    `Super Spine`（超脊）交换机连接多个 `Pod`，从而实现大规模的 AI Fabric 部署。图 13-10 还描绘了跨 AI Fabric 后端网络共享全局设置和属性。


