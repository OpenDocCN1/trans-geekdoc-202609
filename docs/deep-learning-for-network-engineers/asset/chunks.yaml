    |  ||  ||  ||  ||  |


    Figure 7-18: Logits Calculation – Dot Product of Hidden State and Complete Vocabulary.


    Next, the SoftMax function is applied to the logits. This function converts the
    logits into probabilities by exponentiating each logit and then normalizing by
    the sum of all exponentiated logits. The result is a probability distribution
    in which each value represents the likelihood of selecting a particular word as
