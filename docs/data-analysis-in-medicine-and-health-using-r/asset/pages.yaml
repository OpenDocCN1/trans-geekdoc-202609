    And true enough, the two Cox modes are different (p-value < 0.0001). We will choose\
    \ the larger model.\n\n# ## II.12 Adding Interaction in the Model\n\nInteraction\
    \ in the model is an interesting phenomenon. To illustrate how we manage interaction\
    \ term, let's start with a model with two covariates, gcs, stroke type and dm.\
    \ In this model, based on clinical knowledge and curiosity, we would develop a\
    \ two-way interaction term between gcs and stroke type. This interaction term\
    \ (a product from gcs and stroke type) means the relationship between stroke type\
    \ and risk for death is heterogeneous in different values of gcs.\n\nLet's assign\
    \ stroke type as st and it is either 1 (HS) or 0 (IS)\n\n```\n$g(t, st, gcs, dm,\
    \ \\beta) = ln[h_0(t) + st\\beta_1 + gcs\\beta_2 + (st \\times gcs)\\beta_3 +\
    \ dm\\beta_4]$\n```\n\nAnd therefore the log hazard function becomes\n\n```\n\
    $[g(t, st = 1, gcs, dm, \\beta) - g(t, st = 0, gcs, dm, \\beta)]\n= ln[h_0(t)\
    \ + 1\\beta_1 + gcs\\beta_2 + (1gcs)\\beta_3 + dm\\beta_4] - \nln[h_0(t) + 0\\\
    beta_1 + gcs\\beta_2 + (0gcs)\\beta_3 + dm\\beta_4]\n= \\beta_1 + gcs\\beta_3$\n\
    ```"
