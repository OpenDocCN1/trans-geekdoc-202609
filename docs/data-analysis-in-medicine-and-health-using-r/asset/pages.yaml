    # Model-to-model AIC comparison


    We may also compare the models that we fit so far by Akaike information criterion

    (AIC). Recall that R uses AIC for stepwise automatic variable selection, which
    was

    explained in Linear Regression chapter.


    ```

    AIC(pois_attack1, pois_attack2, pois_attack3,

    pois_attack_all1, pois_attack_allx)

