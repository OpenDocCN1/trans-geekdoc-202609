    Next, we can assess the model fit by a scatter plot,


    ```

    plot_slr = ggplot(coronary, aes(x = dbp, y = chol)) + geom_point() + geom_smooth(method
    = lm)

    _slr

    ```


    This plot allows the assessment of normality, linearity and equal variance assumptions.
    We expect an elliptical/oval shape (normality) and equal scatter of dots above
    and below the prediction line (equal variance). These aspects indicate a linear
    relationship between chol and dbp (linearity).'
