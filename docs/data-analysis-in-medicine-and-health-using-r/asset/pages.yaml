  md: "# 4.12 More Complex Plots\n\nThe objective of creating plot using multiple\
    \ (more than two variables) is to enable users to visualize a more complex relationship\
    \ between more than two variables. Let us take a visualization for variable year,\
    \ variable life expectancy and variable continuity.\n\nThis book uses black and\
    \ white text, so we add the scale_color_grey() + codes. If readers want to see\
    \ the color of the plot, just delete this line scale_color_grey().\n\n```\nggplot(data\
    \ = gapminder) +\n  geom_point(mapping = aes(x = year,\n                     \
    \         y = lifeExp,\n                             colour = continent)) +\n\
    \  scale_color_grey() +\n  theme_bw()\n```\n\n![](img/2bc6b006fe018e0018b86f206ab98644_63_0.png)\n\
    \nFrom the scatterplot of these three variables, you may notice that.\n\n+   -\
    \ European countries have a high life expectancy\n- African countries have a lower\
    \ life expectancy\n- One country in Asia looks like an outlier (very low life\
    \ expectancy)\n- One country in Africa looks like an outlier too (very low life\
    \ expectancy)\n\nNow, we will replace the third variable with Gross Domestic Product\
    \ gdpPerCap and correlates it with the size of gdpPerCap."
  merge: -1
  img_proc: true
- pgno: 64
  md: "```\nggplot(data = gapminder) +\ngeom_point(mapping = aes(x = year,\n     \
