  md: "# 8.II Multiple Binary Logistic Regression\n\nThere are multiple factors that\
    \ can contribute to the outcomes of stroke. Hence, there is a strong motivation\
    \ to include other independent variables or covariates to the model. For example,\
    \ in the case of stroke:\n\n+   It is unlikely that only one variable (gcs or\
    \ stroke type) is related to stroke. Stroke like other cardiovascular diseases\
    \ has many factors affecting the outcome. It makes more sense to consider adding\
    \ other independent variables that we believe are important independent variables\
    \ for stroke outcome in the model.\n\n+   by adding covariates in the model, we\
    \ can estimate the adjusted log odds. These log odds indicate the relationship\
    \ of a particular covariate independent of other covariates. In epidemiology,\
    \ we can always this as adjustment. An adjustment is important particularly when\
    \ we have confounding effects from other independent variables.\n\n+   interaction\
    \ term can be generated (the product of two covariates) and added to the model\
    \ to be estimated.\n\nTo add or not add variables is a big subject on its own.\
    \ Usually it is governed by clinical experience, subject matter experts and some\
    \ preliminary analysis. You may read the last chapter of the book to understand\
    \ more model building and vari-selection.\n\nLet's expand our model and include\
    \ gcs, stroke type, sex, dm, sbp and age in the model. We will name this model\
    \ as fatal_mv. As we have more than one independent variables in the model, we\
    \ will call this as multiple binary logistic regression.\n\nTo estimate the multiple\
    \ logistic regression model in R:\n\n```\nfatal_mv1 <-\nglm(status = gcs + stroke_type\
    \ + sex + dm + sbp + age,\n     data = fatal,\n     family = binomial(link = 'logit'))\n\
    summary(fatal_mv1)\n```\n\n```\n##\n## Call:\n## glm(formula = status ~ gcs +\
    \ stroke_type + sex + dm + sbp + age\n```"
