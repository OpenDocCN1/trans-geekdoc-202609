- pgno: 286
  md: "Here, we can see the summary of our imputation model:\n\n+   1. Number of multiple\
    \ imputation\n2. Imputation methods\n3. PredictorMatrix\n\nWe can further assess\
    \ the full predictor matrix from the model.\n\n```\nregImp$predictorMatrix\n\n\
    ## age race chol cad sbp db bmi gender\n## age 0 1 1 1 1 1 1\n## race 1 0 1 1\
    \ 1 1 1\n## chol 1 1 0 1 1 1 1\n## cad 1 1 1 0 1 1 1\n## sbp 1 1 1 1 0 1 1\n##\
    \ dbp 1 1 1 1 1 0 1\n## bmi 1 1 1 1 1 1 0\n## gender 1 1 1 1 1 1 1\n```\n\nThe\
    \ predictor matrix denotes the variable to be imputed at the left side and the\
    \ predictors at the top of the column. 1 indicates a predictor while 0 zero indicates\
    \ a nonpredictor. This predictor matrix can be changed accordingly if needed by\
    \ changing 1 to 0 (a predictor to a non-predictor) or vice versa. If the diagonal\
    \ is O the variable is not allowed to imput itself.\n\nAs an example, to imput\
    \ missing values in age, all of the variables are used as predictors except for\
    \ age itself in the predictor matrix. So, the outcome (y) in linear regression\
    \ equation will be the imputed variable.\n\n> $\\hat{y} = \beta_0 + \\beta_1x_1\
    \ + \\beta_2x_2 + ... + \\beta_kx_k$\n\nSo, the above equation for imputed age\
    \ in the first row of the predictor matrix will be:\n\n```\n$age = \\beta_0 +\
    \ \\beta_1(race) + \\beta_2(chol) + \\beta_3(cad) + \\beta_4(sbp) + \\beta_5(dbp)\
    \ + \\beta_6(gender)$\n```\n\nAlthough it seems we imput all the missing values\
    \ in each variable separately, actually in each imputation model will run separately.\
    \ So, in our data, on top of the imputation model for age, we have other imputation\
    \ models for race and chol variables. Fortunately, we do not have to concern much\
    \ about which variable to be used as a predictor as mice() will automatically\
    \ select the useful predictors for each variables with missing values. Further\
    \ information on how mice do this automatic selection can be assessed by typing\
    \ quickpred() in the RStudio console."
