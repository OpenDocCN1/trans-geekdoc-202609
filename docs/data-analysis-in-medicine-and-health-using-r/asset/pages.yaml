    An R script is simply a text file containing (almost) the same commands that you
    would enter on the command line of R. ( almost refers to the fact that if you
    are using sink() to send the output to a file, you will have to enclose some commands
    in print() to get the same output as on the command line.


    R packages are extensions to the R statistical programming language. R packages
    contain code, data and documentation in a standardized collection format that
    can be installed by users of R, typically via a centralized software repository
    such as CRAN (the Comprehensive R Archive Network).




    For beginners, you may start by writing some simple codes. Since these codes are
    written in R language, we call these codes as R scripts. To do this, go to File,
    then click R Script


    +   - File -> R Script

    - In Windows OS, users can use this shortcut CTRL-SHIFT-N'
