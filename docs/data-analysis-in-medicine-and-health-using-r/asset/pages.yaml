  md: '# 13


    # # Introduction to Missing Data Analysis




    At the end of the chapter, readers will be able to:


    +   - To perform a simple imputation

    - To perform a single imputation

    - To perform a multiple imputation




    Missing data can significantly affect the performance of predictive risk modeling,
    an important technique for developing medical guidelines. The two most commonly
    used strategies for managing missing data are to impute or delete values, and
    the former cause bias, while the latter can cause both bias and loss of statistical
    power. Several techniques designed to deal with missing data are described and
    applied to an illustrative example. These methods include complete-case analysis,
    available-case analysis, as well as single and multiple imputation.


    Researchers should report the details of missing data and appropriate methods
    for dealing with missing values should be incorporated into the data analysis.




    Missing data is a common issue in research. The causes of missing data should
    be investigated and more data should be collected if possible. There are three
    types of missing data:


    +   1. Missing completely at random (MCAR)'
  merge: -1
  img_proc: true
- pgno: 274
  md: '![](img/2bc6b006fe018e0018b86f206ab98644_274_0.png)


    Source: Modified from Schafer and Graham (2002).


    # FIGURE 13.1


    Illustration of missing data mechanism for the three types of missing data. The
    data is made up of X and Y. X represents a variable with completely observed values,
    Y represents a variable with missing values, Z represents a cause of missing values
    and R represents an indicator variable that identify missing and observed values
    in Y, in other words, the missing


    +   2. Missing at random (MAR)

    3. Missing not at random (MNAR)


    Missing data is classified as MCAR if the missingness is unrelated to the data.
    For example, medical records that are lost to flood and laboratory equipment mal-function.
    In other words, the data is missing totally by chance. We can relate this example
    to Figure 13.1, the missingness R is not related to the data itself, which is
    a combination of variables with completely observed values, X and variables with
    partly missing values, Y, MCAR is ideal and more convenient, though MAR is more
    common and realistic.


    Missing data is said to be MAR if the missingness is related to other values that
    we completely observed, not to the variable with missing values itself. For example,
    an older person is more likely to complete a survey compared to the younger person.
    So, the missingness is related to age, a variable that has been observed in the
    data. Similarly, if information on income is more likely to be missing for older
    individuals as they are more cautious to reveal a sensitive information as opposed
    to younger individuals. Thus, the missingness is related to age, which should
    be a variable that we collected during the survey. The similarity between the
    two examples is that we completely observed the variable age. Another example
    of MAR is missing a certain medical form do not include information in the form.
    However, new updated medical form includes this information. As the missingness
    is not related to the variable with missing values itself and we have the information
    that patients use an old or a new medical form, we can classify this missingness
    as MAR. We can see from all the examples that the missingness, R is related to
    other variables that we completely observed, X, but not to the variable with missing
    values, Y as illustrated in Figure 13.1.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# 13.4 Preliminaries


    Lastly, the missing data is considered MNAR if the missingness is related to the
    variable with missing values itself and other variables with completely observed
    values as well. Also, the missingness is considered MNAR if the causes completely
    unknown to. In other words, we cannot logically deduce that the missing data fit
    MCAR or MAR types. For example, missing a weight information for an obese individuals
    as the normal weighing scale may not be able to weigh the individuals. According
    to 13.1, the pattern of missingness is considered MNAR as the missingness, R is
    related to the variable with partly missing values itself, Y. However, we can
    be sure of this without a further investigation about the mechanism of missingness
    and its causes. MNAR is the most problematic type among the three. There are a
    few approaches to differentiate between MCAR and MAR-MNAR. However, an approach
    to differentiate between MAR and MNAR yet to be proposed. Thus, we need to use
    a logical reasoning to differentiate between the two types.


    Alternatively, Figure 13.1 can be represented mathematically as follows:


    ```

    MCAR : P(R|Z)

    MAR : P(R|X, Z)

    MNAR : P(R|X, Y, Z)

    ```


    In MCAR, the missingness is completely related to the cause of missing data, Z,
    which is unrelated to variables with completely observed values, X and variables
    with missing values, Y. However, MAR allows the missingness to be related to X,
    on top of Z. MNAR requires the missingness related to X, Y, and Z.


    # 13.4 Preliminaries


