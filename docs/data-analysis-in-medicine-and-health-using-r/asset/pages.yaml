- pgno: 153
  md: '# Binary Logistic Regression




    At the end of the chapter, the readers will be able


    +   * to understand the concept of simple and multiple binary logistic regression

    * to perform simple binary logistic regression

    * to perform multiple binary logistic regression

    * to perform model assessment of binary logistic regression

    * to present and interpret results from binary logistic regression




    A binary variable is a categorical outcome that has two categories or levels.
    In medical and health research, the binary outcome variable is very common. Some
    examples where the outcome is binary include:


    +   * survival status; when the status of cancer patients at the end of treatment
    is coded as either alive or dead

    * relapse status; when the status of a patient is coded as either relapse or not
    relapse

    * satisfaction level; when patients come to clinics are asked if they are satisfied
    or not satisfied with the service

    * glucose control; when patients were categorized as either good control or poor
    control based on HbA1c


    In statistics, the logistic model (or logit model) is a statistical model that
    models the probability of an event taking place by having the log-odds for the
    event be a linear combination of one or more dependent variables. In a binary
    logistic regression model, the dependent variable has two levels (categorical).'
  merge: -1
  img_proc: true
- pgno: 154
  md: "# 8.3 Logistic Regression Model\n\nThe logistic model (or logit model) is used\
    \ to model the probability of a particular class or event occurring, such as pass\
    \ or fail, win or lose, alive or dead or healthy or sick.\n\nMore specifically,\
    \ binary logistic regression is used to model the relationship between a covariate\
    \ or a set of covariates and an outcome variable which is a binary variable.\n\
    \n# 8.4 Dataset\n\nWe will use a dataset named stroke.dta which in STATA format.\
    \ These data come from a study of hospitalized stroke patients. The original dataset\
    \ contains 12 variables, but our main variables of interest are:\n\n+   * status:\
    \ Status of a patient during hospitalization (alive or dead)\n* gcs: Glasgow Coma\
    \ Scale on admission (range from 3 to 15)\n* stroke_type: IS (Ischemic Stroke)\
    \ or HS (Hemorrhagic Stroke)\n* sex: female or male\n* dm: History of Diabetes\
    \ (yes or no)\n* sbp: Systolic Blood Pressure (mmHg)\n* age: age of patient on\
    \ admission\n\nThe outcome variable is variable status. It is labeled as either\
    \ dead or alive, which is the outcome of each patient during hospitalization.\n\
    \n# 8.5 Logit and Logistic Models\n\nThe simple binary logit and logistic models\
    \ refer to a model with only one covariate (also known as independent variable).\
    \ For example, if the covariate is gcs (Glasgow Coma Scale), the simple logit\
    \ model is written as:\n\n```\n$$\\hat{g}(x) = ln \\frac{\\hat{\\pi}(x)}{1-\\\
    hat{\\pi}(x)}$\n```\n\nwhere $\\hat{g}(x)$ is the log odds for a given value of\
    \ gcs. And the odds for a given value of GCS is written as $\\hat{\beta}_0 + \\\
    hat{\beta}_1(gcs)$"
  merge: -1
  img_proc: true
- pgno: 155
  md: "# 8.6 Prepare Environment for Analysis\n\nThe simple logistic model is all\
    \ written as:\n\n```\n$$\\pi(x) = \\frac{exp^{\beta_0+\beta_1 gcs}}{1+exp^{\b\
    eta_0+\beta_1 gcs}}$\n```\n\nThe $\\pi(x) = E(Y|x)$ represents the conditional\
    \ mean of $Y$ given $x$ when the logistic distribution is used. This is also simply\
    \ known as the predicted probability of death for given value gcs.\n\nIf we have\
    \ decided (based on clinical expertise and literature review) that a model that\
    \ could explain death counts of gcs, stroke type, sex, dm and age, then the logit\
    \ model can be expanded to:\n\n```\n$$\\hat{g}(x) = \\hat{\beta}_0+\\hat{\beta}_1(gcs)+\\\
    hat{\beta}_2(stroketype)+\\hat{\beta}_3(sex)+\\hat{\beta}_4(dm)+\\hat{\beta}_5(sbp)+\\\
    hat{\beta}_6(age)$\n```\n\nThese are the odds for death given certain gcs, sbp\
    \ and age values and specific categories of stroke type, sex, and diabetes. The\
    \ probability of death is\n\n```\n$$\\pi(x) = \\frac{exp^{\\beta_0+\\beta_1(gcs)+\\\
    beta_2(stroketype)+\\beta_3(sex)+\\beta_4(dm)+\\beta_5(sbp)+\\beta_6(age)}}{1+exp^{\\\
    beta_0+\\beta_1(gcs)+\\beta_2(stroketype)+\\beta_3(sex)+\\beta_4(dm)+\\beta_5(sbp)+\\\
    beta_6(age))}$\n```\n\nIn many datasets, some independent variables are either\
    \ discrete or nominal scale variables. Which include race, sex, treatment group,\
    \ and age categories. Including them in the model is inappropriate as if they\
    \ were interval scale variables. In some statistical software, these variables\
    \ are represented by numbers. However, be careful; these numbers are used merely\
    \ as identifiers or labels for the groups.\n\nIn this situation, assuming that\
    \ one of the independent variables is obesity type, we will use method designed\
    \ variables (or dummy variables). Suppose, for example, which is coded as \"Class\
    \ 1\", \"Class 2\" and \"Class 3\". In this case, there are 3 levels or categories,\
    \ hence two design variables $(D-1)$ are necessary, let's say D1 and D2. One possible\
    \ coding strategy is that when the patient is in \"Class 1\" the two design variables\
    \ would both be set to zero. In this example, \"Class 1\" is the reference category.\
    \ When the patient is in \"Class 2\", then D1 is set as 1 and D2 as 0; when the\
    \ patient is in \"Class 3\", we will then set D1 as 0 and D2 and 1. All these\
    \ coding assignments can be done automatically in the software. To interpret,\
    \ we must know which category is the reference.\n\n# 8.6 Prepare Environment for\
    \ Analysis\n\n# 8.6.1 Creating an RStudio project\n\nStart a new analysis task\
    \ by creating a new RStudio Project. To this,"
