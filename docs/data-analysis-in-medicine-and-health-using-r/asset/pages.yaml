  md: "# 228 11 Survival Analysis: Kaplan-Meier and Cox Proportional Hazard (PH) Regression\n\
    \nhigher-order terms in a model representing interactions between covariates.\
    \ These are also called effect modifiers.\n\nLet's decide based on our clinical\
    \ expertise and statistical significance, we would model a Cox PH model with these\
    \ covariates.\n\n+   - stroke_type\n- gcs\n- referral_from\n\nThe reason these\
    \ covariates were selected was because we found that both gcs and stroke type\
    \ are statistically significant. We also believe that the patients are referred\
    \ to hospital may increase the severity of stroke. On the other hand, we assumed\
    \ variables sex, sbp, dbp and wbc are not clinically important risk factors for\
    \ stroke death.\n\nIn addition to, we foresee that stroke type and death is mediated\
    \ through gcs. For example, patients that suffer from hemorrhagic stroke will\
    \ suffer more severe bleeding. This will lead to poorer gcs and poor survival\
    \ status. So, by adding both gcs and stroke, we can estimate the total effect\
    \ from stroke type to death and the effect mediated through gcs.\n\nTo estimate\
    \ Cox PH model with stroke_type, gcs and referral_from:\n\n```\nstroke_mv <-\n\
    coxph(Surv(time = time2,\n  event = status == 'dead') ~ stroke_type + gcs + referral_from,\n\
    \  data = stroke)\ntidy(stroke_mv, exponentiate = TRUE, conf.int = TRUE)\n```\n\
    \n```\n## # A tibble: 3 x 7\n## ## term estimate std.error p.value conf.low conf.high\n\
    ## ## <chr> <dbl> <dbl> <dbl> <dbl> <dbl>\n## # 1 stroke_typeIS 0.835 0.345 -0.523\
    \ 6.01e-1 0.424 1.64\n## # 2 gcs 0.847 0.0358 -4.63 3.72e-6 0.790 0.909\n## #\
    \ 3 referral_fromnon-hosp- 0.824 0.322 -0.602 5.47e-1 0.439 1.55\n```\n\nor we\
    \ may use tbl_regression(stroke_mv) for a better output\n\n```\ntbl_regression(stroke_mv)\
    \ %>%\nas_gt()\n```"
