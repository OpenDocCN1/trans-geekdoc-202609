  md: '# 5


    # Data Wrangling




    At the end of the chapter, readers will be able to


    +   - understand the role of data wrangling

    - understand the basic capabilities of dplyr package

    - acquire skills to perform common data wrangling using dplyr and forcats packages




    Data wrangling removes errors and combines complex data sets to make them more
    accessible and easier to analyze. Due to the rapid expansion of the amount of
    data and data sources available today, storing and organizing large quantities
    of data for analysis is becoming increasingly necessary.




    Data wrangling is also known as Data Mung or Data Transformation. It is loosely
    the process of manually converting or mapping data from one "raw" into another
    format. The process allows for more convenient consumption of the data. You can
    find more information at mode analytics webpage


    Data wr is also referred to as data munging. It is the process of transforming
    and mapping data from one "raw" into another format to make it more appropriate
    and valuable for downstream purposes such as analytics. The goal of data wrangling
    is to ensure quality and valuable data. Data analysts typically spend the majority
    of their time in the process of data wrangling becoming to the actual analysis
    of the data. Almost all data require data wrangling


    > https://community.modeanalytics.com/sql/tutorial/data-wrangling-with-sql/'
  merge: -1
  img_proc: true
