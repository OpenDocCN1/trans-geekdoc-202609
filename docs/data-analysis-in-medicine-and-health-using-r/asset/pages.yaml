- pgno: 15
  md: '# Preface


    We wrote this book to help new R programming users with limited programming and
    statistical backgrounds. We understand the struggles they are going through to
    move from point-and-click statistical software such as SPSS or MS Excel to move
    code-centric software such as R and Python. From our experiences, frustration
    sets early in learning this code-centric software. It often demotivates new users
    to the extent that they ditch them and return to using point-and-click statistical
    software. This book will minimize these struggles and gently help these excited
    but fragile users to learn quickly and effectively the codes and workflows to
    perform data and statistical analysis using the R programming language.


    This book''s audience includes postgraduate students, public health researchers,
    epidemiologists and biostaticians. From our experiences teaching students in the
    public health, epidemiology and biostatistics programs at the School of Medical
    Sciences, Universiti Sains Malaysia. Between KIM and WNA, we have over 30 years
    of experience and training undergraduate and postgraduate students. As mentioned
    earlier, most of our postgraduate students are dentists in the public health,
    epidemiology or biostatistics programs at the School of Medical Sciences, Universiti
    Sains Malaysia.


    The courses we teach include basic and advanced statistics, multivariable data
    analysis, structural equation modeling, advanced numerical data analysis and categorical
    data analysis. This book, we believe, will achieve its objective. The main objective
    is to help new R programming users (such as our undergraduate and postgraduate
    students) understand the R programming language, make plots, explore data, summarize
    data and perform statistical analyses inside RStudio IDE. We also provide the
    interpretation of graphs, tables and statistical models relevant to our students
    and us. They do not have strong mathematical and statistical grounds; however,
    in their career, they are very involved with collecting, analyzing and interpreting
    data. We do work at medical and health institutions and organizations. Their applied
    knowledge and skills in data analysis and epidemiological and statistical models
    will help them draw health policies and make evidence-based public health interventions.


    We used the markdown package¹ and the bookdown package² to write this book inside
    RStudio IDE. We are truly grateful to all the people who have developed them


    > ¹https://rmarkdown.rstudio.com/

    ²https://github.com/rstudio/bookdown'
  merge: -1
  img_proc: true
