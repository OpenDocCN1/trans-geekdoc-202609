- pgno: 259
  md: '# 12


    # Parametric Survival Analysis


    # 12.1 Objectives


    At the end of the chapter, readers will be able


    +   • to understand the basic concept of parametric survival analysis

    • to understand the common parametric survival analysis models such as the exponential
    regression model and the Weibull survival mode.

    • to perform the analysis for the exponential regression model and the Weibull
    regression model


    # 12.2 Introduction


    Survival analysis, the Cox proportional hazard (PH) regression is very popular
    to model the association between the time-to-event with covariates or independent
    variables. It is also a form of Generalized Linear Models. Cox PH regression is
    a semi-parametric survival analysis model.


    The Cox Proportional Hazard model is the most popular technique to analyze the
    effects of covariates on survival time but under certain circumstances parametric
    models may offer advantages over Cox''s model. In addition to Cox proportional
    regression model, there is an additional class of survival models, called the
    parametric survival models. With parametric models such as linear regression,
    logistic regression and Poisson regression, the outcome is assumed to follow some
    distribution.


    Researchers in medical sciences often tend to prefer semi-parametric instead of
    parametric models because of fewer assumptions but some recommend under certain
    circumstances, parametric models estimate the parameters more efficient. In parametric
    models, we often use maximum likelihood procedures to estimate the unknown parameters
    and this technique and its interpretation are familiar for researchers. Also accelerated
    failure time can be used as relative risk with similar interpretation in Cox PH
    regression.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'In the parametric survival models, the distribution of the outcome (i.e. the
    time to event) is specified in terms of unknown parameters. The interests in parametric
    models include:


    +   - determining the acceleration factor and/or

    - determining the hazard ratio.


    The common parametric models include:


    +   - Exponential survival model

    - Weibull survival model and

    - log-logistic survival model.




    A fully parametric model has some advantages (Lemeshow et al., 2008):


    +   - full maximum likelihood may be used to estimate the parameters

    - the estimated coefficients or transformations of them can provide clinically
    meaningful estimates of effect

    - fitted values from the model can provide survival time

    - residuals can be computed as differences between observed and predicted values
    of time


    An analysis of censored time-to-event data using a parametric model can almost
    have the look and feel of a normal-errors linear regression analysis.




    The shape of the survival or hazard curve is informative of the process and provides
    substantive issues. Parametric models mean the outcome is assumed to follow some
    distributions. This also means that the outcome follows some family of distributions
    of similar form BUT with unknown parameters. In parametric survival analysis all
    parts of the model are specified, but the hazard function and the effect of all
    covariates.


    The strength of this is that estimation is easier and estimated survival curves
    are smoother as they draw information from the whole data. The main drawback to
    parametric methods is that they require extra assumptions that may not be appropriate.
    Parametric models have proportional hazard metrics and accelerated failure time
    (AFT) metrics. AFT models allow covariates to predict survival. Often, no analytic
    solution for the MLE exists. In such cases, a numerical approach must be taken.
    A popular method is to use Newton Raphson.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# 12.3 Parametric Survival Analysis Model


    Again, a parametric survival model is one of which survival time (the outcome)
    is assumed to follow a known distribution. The parametric models specify the baseline
    hazard and the baseline hazard indicates which model to be used, for example:


    +   1. Weibull model

    2. Log-logistic model

    3. Log-normal model

    4. Exponential model

    5. Generalized Gamma model


    For parametric survival models, time is assumed to follow some distribution whose
    probability density function f(t) can be expressed in terms of unknown parameters.
    Once a probability density function is specified for survival time, the corresponding
    survival and hazard functions can be determined.


    The survival function can also be expressed in terms of hazard function by exponentating
    the cumulative hazard function. Probability density function can also be expressed
    as the product of the hazard and survival, f(t) = h(t)S(t)


    Many parametric models are Accelerated Failure Time (AFT) models rather than Proportional
    Hazard models. And remember, Constant Hazard fulfills Proportional Hazard assumption,
    but Proportional Hazard does not mean a model has Constant Hazard.




    Parametric models can be presented either as a proportional hazard models or accelerated
    failure time (AFT) models. Parametric models that have both the proportional hazards
    models and accelerated failure time models are:


    +   1. Exponential model

    2. Weibull model


    If we take the Exponential model as an example, in the exponential survival model
    with a single covariate, X then the hazard function for the proportional hazard
    model is:


    ```

    h(t) = exp(β₀+β₁x)

    h(t) = exp(β⁰expβ₁x)

    h(t) = h₀expβ₁_x

    ```




    Again, if we take the Exponential model with a single covariate, X then the hazard
    function for the AFT model is'
