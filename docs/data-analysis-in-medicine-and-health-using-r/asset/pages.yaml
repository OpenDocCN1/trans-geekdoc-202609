    # 7.5.3 Univariate analysis


    For the analysis, we fit the SLR model, which consists of only one predictor (univariate).
    Here, chol is specified as the outcome, and dbp as the predictor. In glm, the
    formula is specified as outcome - predictor. Here, we specify chol as the formula
    in glm.


    We fit and view the summary information of the model as,


    ```

    slr_chol = glm(chol - dbp, data = coronary)

    summary(slr_chol)

    ```'
