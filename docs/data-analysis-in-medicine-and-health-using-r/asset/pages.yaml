- pgno: 18
  md: '# RStudio IDE


    RStudio is an integrated development environment (IDE) for R. It includes a console
    and syntax-highlighting editor that supports direct code execution and tools for
    plotting, history, debugging and workspace management.


    RStudio is available in open source and commercial editions and runs on the desktop
    (Windows, Mac, and Linux) or in a browser connected to RStudio Server or RStudio
    Workbench (Debian/Ubuntu, Red Hat/CentOS and SUSE Linux).


    # RStudio Cloud


    RStudio Cloud by R facilitates the learning of R. Anyone can sign up and start
    using RStudio on the cloud. It is one of the quickest ways to learn R.


    Using RStudio Cloud, we do not have to install R on our local machine. RStudio
    Cloud allows collaboration between R teachers and students. It also helps colleagues
    work together on R projects.


    RStudio described it as a lightweight, cloud-based solution that allows anyone
    to share, teach and learn data science online. And it also adds that by using
    this platform, we can


    +   - analyze our data using the RStudio IDE directly from our browser

    - share projects with our team, class, workshop or the world

    - teach data science with R to our students or colleagues

    - learn data science in an instructor-led environment or with interactive tutorials


    RStudio Cloud has the free and the commercial version (which is unfortunately
    very affordable). To start using RStudio Cloud, visit https://rstudio.cloud/.
    On the page, click ''Sign Up''.


    With RStudio Cloud, there is almost nothing to configure and you do not need dedicated
    hardware, installation or annual purchase contract required. Individual users,
    instructors and students only need a browser to do, share, teach and learn data
    science.'
  merge: -1
  img_proc: true
