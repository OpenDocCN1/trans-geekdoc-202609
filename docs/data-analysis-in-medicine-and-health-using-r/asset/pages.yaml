- pgno: 175
  md: '# Multinomial Logistic Regression




    At the end of this chapter, readers should be:


    +   - to understand the concept of logistic regression model to analyze data with
    polychotomous (multinomial) outcome

    - to estimate parameters of interest in a logistic regression model from data
    with polychotomous (multinomial) outcome

    - to make inference based on a logistic regression model from data with polychotomous
    (multinomial) outcome

    - to predict the outcome based on a logistic regression model from data with polychotomous
    (multinomial) outcome

    - to perform model checking of logistic regression model from data with polychotomous
    (multinomial) outcomes




    Some data with multinomial outcomes, in which the outcome variable is a nominal
    or polychotomous variable with more than two levels. In multinomial outcome, the
    outcome has no natural ordering. If it has, then it is best treated as an ordinal
    outcome data. For these data, we can modify the binary logistic model to make
    estimation and inference (Kleinbaum, 2010; Hosmer et al., 2013).


    Variables with more than two levels are known as either:


    +   1. multinomial data

    2. polychotomous data

    3. polytomous data


    If we use logistic regression to such data, then the analysis is known as polychotomous
    or multinomial logistic regression. Again, the polychotomous outcome does'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'not have any natural order. When the categories of the outcome variable do
    have a natural order, ordinal logistic regression is preferred.


    # 9.3 Examples of Multinomial Outcome Variables


    Examples of data with polychotomous outcome variables (with more than two levels)
    include:


    +   - disease symptoms that have been classified by subjects as being absent,
    mild, moderate, or severe,


    +   - tumour invasiveness classified as in situ, locally invasive, metastatic,
    or - patient preferred treatment regimen, selected among three or more options
    for example oral medication only, oral medication plus injection medication or
    injection only.


    A numerical outcome can be categorized based on different cut-off points. The
    newly created categorical variable is now either treated as a nominal, polychotomous
    or multinomial outcome, or as an ordinal outcome. That justifies the use of multinomial
    logistic regression.


    # 9.4 Models for Multinomial Outcome Data


    With a multinomial outcome data, an extension of logistic regression know as multinomial
    logit or multinomial logistic regression can be performed. one of the categories
    of the outcome variable is designated as the reference category and each of the
    other levels is compared with this reference. The choice of reference category
    can be arbitrary and is at the discretion of the researcher. Most software set
    use the first category as the reference (also known as the baseline category)
    by default.


    Other models that can analyze data with polychotomous outcome include:


    +   1. Stereotype logistic regression - each independent variable has one value
    for each individual


    +   2. Alternative–specific variables'
  merge: -1
  img_proc: true
