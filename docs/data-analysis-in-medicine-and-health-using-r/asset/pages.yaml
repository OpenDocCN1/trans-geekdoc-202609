    | ## 3 res_infeyes | 0.426 | 0.157 | 2.71 | 0.00779 | 0.124 | 0.742 |

    | ## 4 ghql12 | 0.0495 | 0.00812 | 6.10 | 0.000000143 | 0.0337 | 0.0656 |


    Note that there are no changes to the coefficients to the standard Poisson regression
    and the quasi-Poisson regression. We also interpret the quasi-Poisson regression
    model output in the same way as that of the Standard Poisson regression model
    output.


    # 10.7 Summary


    In this chapter, we went through the basics about Poisson regression for count
    and rate data. We performed the analysis for each and learned how to assess the
    model fit for the regression models. We learned how to nicely present and interpret
    the results. In addition, we also learned how to utilize the model for prediction.To
    un-derstand more about the concept, analysis workflow and interpretation of count
    data analysis including Poisson regression, we recommend texts from the Epidemiology:
    Study Design and Data Analysis book (Woodward, 2013) and Regression Models for
    Categorical Dependent Variables Using Stata book (Long et al., 2006).'
