  md: '![](img/2bc6b006fe018e0018b86f206ab98644_90_0.png)


    FIGURE 5.1

    Main parts of data wrangling.


    before further analysis. There are three main parts to data wrangling (Wickham
    and Grolelemund, 2017).


    # 5.3 Data Wrangling with dplyr Package


    # 5.3.1 dplyr package


    dplyr is a package grouped inside tidyverse collection of packages. dplyr package
    is very useful to munge, wrangle, or transform your data. It is a grammar of data
    manipulation. It provides a consistent set of verbs that help you solve the most
    common data manipulation challenges. This tidyverse webpage^2 has more information
    and examples.


    # 5.3.2 Common data wrangling processes


    The common data wrangling processes include:


    +   - reducing the size of dataset by selecting certain variables (or columns)

    - generating new variable from existing variables

    - sorting observation of a variable

    - grouping observations based on certain criteria

    - reducing variables to groups in order to estimate summary statistics


    # 5.3.3 Some dplyr functions


    For the procedures listed above, the corresponding dplyr functions are


    +   - dplyr::select() — to select a number of variables from a dataframe

    - dplyr::mutate() — to generate a new variable from existing variables

    - dplyr::arrange() — to sort observation of a variable

    - dplyr::filter() — to group observations that fulfill certain criteria'
  merge: -1
  img_proc: true
