  md: '# 7.6.5 Interaction


    Interaction is the combination of predictors that requires interpretation of their
    regression coefficients separately based on the levels of the predictor. For example,
    we need separate interpretation of the coefficient for dbp depending on race group:
    Malay, Chinese or Indian. This makes interpreting our analysis complicated as
    we can no longer interpret each coefficient on its own. Most, of the time, we
    pray not to have interaction in our regression model. We fit the model with a
    two-way interaction term,


    ```

    summary(glm(chol) - dbp * race, data = coronary)


    ## Call:

    ## glm(formula = chol - dbp * race, data = coronary)


    ## Deviance Residuals:

    ## Min 1Q Median 3Q Max

