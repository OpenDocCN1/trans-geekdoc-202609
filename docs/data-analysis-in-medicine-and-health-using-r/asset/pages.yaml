    \ +\ntheme_bw())\n```\n\n![](img/2bc6b006fe018e0018b86f206ab98644_64_0.png)\n\n\
    You will notice that ggplot2 automatically assigns a unique level of the aesthetic\
    \ (here, a unique color) to each value of the variable, a process known as scaling.\
