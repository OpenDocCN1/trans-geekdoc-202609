  md: '# 11.17 Summary


    In this chapter, we briefly describe the concept of survival analysis data, two
    common types of survival analysis (Kaplan–Meier and Cox PH regression) and provide
    skills to perform the analysis using R. We illustrate how to test for survival
    estimates for two samples and how to model the time-to-event data using single
    and multiple covariates in Cox PH regression. For further understanding of the
    survival analysis concepts and application, excellent texts include Survival Analysis:
    A Self-Learning Text (Kleinbaum and Klein, 2005) and Applied Survival Analysis:
    Regression Modeling of Time-to-Event Data (Lemeshow et al., 2008).'
