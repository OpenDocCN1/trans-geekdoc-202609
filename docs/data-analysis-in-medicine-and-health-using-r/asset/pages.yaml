    # 11.13 The Proportional Hazard Assumption


    # 11.13.1 Risk constant over time


    The most important assumption in Cox regression is the proportionality of the
    hazards over time. It refers to the requirement that, the hazard functions are
    multiplicatively related and that their ratio is constant over survival time or
    it simply says that the estimated HR does not depend on time.


    A check of the proportional hazards assumption can be done by looking at the parameter
    estimates $\beta_1, \dots, \beta_p$ over time. And we can safely assume proportional
    hazards when the estimates do not vary over time. In many settings, in order to
    test the PH assumption, we can employ two-step procedure for assessing:


    +   * calculate covariate-specific tests

    * plot the scaled and smoothed-scaled Schoenfeld residuals obtained from the model.


    # 11.13.2 Test for PH assumption


    In many statistical software, the null hypothesis of constant regression coefficients
    can be tested, both globally as well as for each covariate. In R, this can be
    done using the `cox.zph()` function from the `survival` package.'
