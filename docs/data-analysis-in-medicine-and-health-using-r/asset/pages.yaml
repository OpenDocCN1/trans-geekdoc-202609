  md: '# 10.3 Prepare R Environment for Analysis


    # 10.3.1 Libraries


    For this chapter, we will be using the following packages:


    +   - tidyverse: a general and powerful package for data transformation

    - psych: for descriptive statistics

    - gsummary: for coming up with nice tables for results

    - broom: for tidying up the results

    - epiDisplay: an epidemiological data display package


    These are loaded as follows using the function library(),


    ```

    library(tidyverse)

    library(psych)

    library(gtsummary)

    library(broom)

    ```


    For epiDisplay, we will use the package directly using epiDisplay::function_name()
    instead. We did not load the package as we usually do with library(epiDisplay)
    because it has some conflicts with the packages we loaded above.


    # 10.4 Poisson Regression for Count


    # 10.4.1 About Poisson regression for count


    Poisson regression models the linear relationship between:


    +   - outcome: count variable (e.g. the number of hospital admissions, parity,
    cancerous lesions and asthma attacks). This is transformed into the natural log
    scale.

    - predictor(): numerical variables (e.g. age, blood pressure and income) and categorical
    variables (e.g. gender, race and education level).


    We might be interested in knowing the relationship between the number of asthma
    attacks in the past year with sociodemographic factors. This relationship can
    be explored by a Poisson regression analysis.


    Multiple Poisson regression for count is given:


    ```

    ln(count outcome) = intercept + coefficients × numerical predictors + coefficients
    × categorical predictors

    ```'
