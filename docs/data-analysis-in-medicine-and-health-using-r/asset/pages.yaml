- pgno: 143
  md: '# 7.6 Multiple Linear Regression


    we have hundreds of variables, it is impossible to select variables by eye-ball
    judgment. So, in this case, how to perform the variable selection? To explore
    the significance of the variables, we may perform stepwise selection. It is important
    to know stepwise selection is meant for exploratory research. For confirmatory
    analysis, it is important to rely on expert opinion for the variable selection.
    We may perform forward, backward or both forward and backward selection combined.


    Forward selection starts with an intercept or empty model without variable. It
    proceeds by adding one variable after another. R. Akaike information criterion
    (AIC) is used as the comparative goodness-of-fit measure and model quality. The
    stepwise selection, it seeks to find the model with the lowest AIC iteratively
    and the steps are shown in the output. More information about AIC can be referred
    to Hu (2007) and Wikipedia (2022).


    ```

    # forward

    mlr_chol_stepforward = step(slr_chol0, scope = dbp + bmi + race,

    direction = "forward")


    ## Start: AIC=637.99

    ## chol - 1


    ## D Deviance AIC

    ## + dbp 1 228.64 600.34

    ## + race 2 241.68 613.43

    ## + bmi 1 272.17 635.20

    ## <none> 278.77 637.99


    ## Step: AIC=600.34

    ## chol - dbp


    ## D Deviance AIC

    ## + race 2 213.40 590.55

    ## <none> 228.64 600.34

    ## + bmi 1 227.04 600.37


    ## Step: AIC=590.55

    ## chol - dbp + race


    ## D Deviance AIC

    ## <none> 213.40 590.55

    ## + bmi 1 211.36 590.63

    ```


    Backward selection starts with a model containing all variables. Then, it proceeds
    by removing one variable after another, of which it aims to find the model with
    the lowest AIC.'
