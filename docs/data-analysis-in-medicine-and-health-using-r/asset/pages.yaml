  md: '# 4.9 Load the Packages


    # 4.8 Read Data


    R can read almost (if not all) types of data. The common data formats in data
    and statistical analysis include


    +   - comma-separated files (.csv)

    - MS Excel file (.xlsx)

    - SPSS file (.sav)

    - Stata file (.dta)

    - SAS file (.sas)


    However, it would help if you had user-connected packages to read data from statistical
    software. For example: haven and rio packages.


    Below we show the functions to read SAS, SPSS and Stata files using the haven
    package.


    +   1. SAS: read_sas() reads .sas7dat + .sas7cat files and read_xpt() reads SAS
    transport files (version 5 and version 8). write_sas() writes .sasbat files.

    2. SPSS: read_sav() reads .sav files and read_port() reads the older .por files.
    write_sav() writes .sav files.

    3. Stata: read_dta() reads .dta files (up to version 15), write_dta() writes .dta
    files (versions 8-15).


    Sometimes, users may want to analyze data stored in databases. Some examples of
    common databases format are:


    +   1. MySQL

    2. SQLite

    3. Postgres

    4. MariaDB


    To read data from databases, you must connect your RStudio IDE with the database.
    There is an excellent resource to do this on the Databases Using R webpage


    # 4.9 Load the Packages


    The ggplot2 package is one of the core member of tidyverse metapackage (https://www.tidyverse.org/).
    So, whenever we load the tidyverse package, we automatically'
