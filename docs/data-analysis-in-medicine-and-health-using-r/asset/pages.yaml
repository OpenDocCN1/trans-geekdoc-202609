  md: '# 5.4 Preparation


    +   - dplyr::group_by() and dplyr::summarize() – reduce variable to groups in
    order to provide summary statistic


    # 5.4 Preparation


    # 5.4.1 Create a new project or set the working directory


    It is essential to ensure you know where your working directory is. The recommended
    practice is to create a new project every time you want to start a new analysis
    with R. To do so, create a new project by File -> New Project. If you do not start
    with an R new project, you still need to know the location of your working directory
    on your computer.


    So, again we emphasize that every time you want to start processing your data,
    please sure:


    +   - use R project. It is much easier and cleaner to start your work with a new
    R project. Once you have done or need to log off your computer, close the project
    and reopen the next time you need to.


    +   - if you are not using R project, you are inside the correct working directory.
    Type getwd() to display the active working directory. And to set a new working
    directory, use the function setwd(). Once you know where your working directory
    is, you can start reading or importing data into your working directory.


    Once the project, you can import your data if necessary.


    # 5.4.2 Load the libraries


    Remember, there are several packages you can use to read the data into R. R can
    read almost all (if not all) types of data format. For example, we know that common
    data formats are:


    +   - SPSS (.sav) format,

    - Stata (.dta) format,

    - SAS format,

    - MS Excel (.xlsx) format

    - Comma-separated values .csv format.


    However, there are other formats, too, such as data in DICOM format. DICOM data
    includes data from CT scans and MRI images. There are data in shapefile format
    to store geographical information. Three packages - haven, rio, readr and foreign
    packages - are very useful to read or import your data into R memory.'
  merge: -1
  img_proc: true
