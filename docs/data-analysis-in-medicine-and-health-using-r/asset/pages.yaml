- pgno: 203
  md: '# 10.4 Poisson Regression for Count


    The best model is the one with the lowest AIC, which is the model model with the
    interaction term. However, since the model with the interaction term differ slightly
    from the model without interaction, we may instead choose the simpler model with
    the interaction term.


    # Scaled Pearson chi-square statistic


    Pearson chi-square statistic divided by its df gives rise to scaled Pearson chi-square
    statistic (Fleiss, et al., 2003). The closer the value of this statistic to 1,
    the better is the model fit. First, Pearson chi-square statistic is calculated
    as


    ```

    $$\chi_P^2 = \sum_{i=1}^{n} \frac{(y_i - \hat{y}_i)^2}{\hat{y}_i}$

    ```


    easily obtained in R as follows:


    ```

    x2 = sum(asthma$attack - pois_attack_all$fitted)^2 /

    pois_attack_all$fitted)

    ```


    Then we obtain scaled Pearson chi-square statistic $\chi_P^2/df$, where $df =
    n - p$. $n$ is the number of observations row(asthma) and $p$ is the number of
    coefficients-parameters we estimated for the model length(pois_attack_all$coefficients).


    ```

    df = nrow(asthma) - length(pois_attack_all$coefficients)

    sx2 = x2 / df; sx2

    ```


    ## [1] 1.052376


    The value of sx2 is 1.052, is close to 1. This indicates good model fit.


    It is actually easier to obtain scaled Pearson chi-square by changing the family
    = "poisson" to family = "quasipoisson" in the glm specification, viewing the dispersion
    value from the summary of the model. It works scaled Pearson chi-square is an
    estimator of the overdispersion parameter in a quasi-Poisson regression model
    (Fleiss, et al., 2003). We will discuss about quasi-Poisson regression later towards
    this end of this chapter.


    ```

    qpois_attack_all_sum = summary(glm(attack - res_inf + ghq12,

    data = asthma, family = "quasipoisson")

    ```


    ## [1] 1.052383'
