- pgno: 238
  md: "• patients are withdrawn from the study\nIn censored patients, we do not know\
    \ the exact time for them to develop the event.\nTo explore how to incorporate\
    \ a regression model-like structure into the hazard function, we can model the\
    \ hazard function using:\n\n```\n$h(t) = \\theta_0$$\n```\n\nThe hazard function\
    \ is a rate, and because of that it must be strictly positive. To constrain $\\\
    theta$ at greater than zero, we can parameterize the hazard function as:\n\n```\n\
    $h(t) = \\exp^{\theta_0}$$\n```\n\nSo for a covariate $x$ the log-hazard function\
    \ is\n\n```\n$ln[h(t.x)] = \\beta_0 + \\beta_1(x)$\n```\n\nand the hazard function\
    \ is\n\n```\n$h(t.x) = e.exp^{\theta_0+\\beta_1(x)}$\n```\n\nThis is the exponential\
    \ distribution which is one example of a fully parametric hazard function. Fully\
    \ parametric models accomplish two goals simultaneously:\n\n+   • It describes\
    \ the underlying distribution of survival time (error component)\n• It characterizes\
    \ how distribution changes as a function of the covariates (system-atic component).\n\
    \nHowever, even though fully parametric models can be used to accomplish the above\
    \ goals, the assumptions required for their error components may be unnecessarily\
    \ stringent or unrealistic. One option is to have a fully parametric regression\
    \ structure but leave their dependence on time unspecified. The models that utilize\
    \ this approach are called semiparametric regression models.\n\n# 11.10.1 Cox\
    \ proportional hazards regression\n\nIf we take our dataset, for example, where\
    \ to compare the survival experience of stroke patients on different types of\
    \ stroke (Ischemic stroke or Hemorrhagic stroke), one form of a regression model\
    \ for the hazard function that addresses the study goal is:\n\n```\n$h(t,x,\\\
    beta) = h_0(t)r(x,\\beta)$\n```\n\nWe can see that the hazard function is the\
    \ product of two functions:\n\n+   • The function, $h_0(t)$, characterizes how\
    \ the hazard function changes as a function of survival time."
  merge: -1
  img_proc: true
- pgno: 239
  md: "# 11.10 Semi-Parametric Models in Survival Analysis\n\n+   - The function,\
    \ $r(x, \beta)$, characterizes how the hazard function changes as a function of\
    \ subject covariates.\n\n$h_0(t)$ is frequently referred to as the baseline hazard\
    \ function. Thus the baseline hazard function is, in some sense, a generalization\
    \ of the intercept or constant term found in parametric regression models.\n\n\
    The hazard ratio (HR) depends only on the function $r(x, \beta)$. If the function\
    \ ratio $HR(t, x_1, x_0)$ has a clear clinical interpretation then, the actual\
    \ form of the baseline function is of little importance.\n\nWith this parameterization\
    \ the hazard function is\n\n```\n$h(t, x, \\beta) = h_0(t)exp^{x\\beta}$\n```\n\
    \nand the hazard ratio is\n\n```\n$HR(t, x_1, x_0) = exp^{\beta(x_1-x_0)}$\n```\n\
    \nThis model is referred to in the literature by a variety of terms, such as the\
    \ Cox, the Cox proportional hazards model or simply the proportional hazards model.\n\
    \nSo, for example, if we have a covariate that is a dichotomous (binary), such\
    \ as stroke type: we have a value of $x_1 = 1$ and $x_0 = 0$, for HS and IS, respectively,\
    \ then the hazard ratio becomes\n\n```\n$HR(t, x_1, x_0) = exp^{\\beta}$\n```\n\
    \nIf the value of the coefficient is $\\beta = Ln(2)$, then the interpretation\
    \ is that HS is dying at twice ($exp^{\\beta}=2$) the rate of patients with IS.\n\
    \n\n\nIf you remember that by using Kaplan-Meier (KM) analysis, we could estimate\
    \ the survival probability. And using the log-rank or peito-peto test, we could\
    \ compare the survival between categorical covariates. However, the disadvantages\
    \ of KM include:\n\n+   - To categorize numerical variable to compare survival\n\
    - It is a univariable analysis\n- It is a non-parametric analysis\n\nWe also acknowledge\
    \ that the fully parametric regression models in survival analysis has stringent\
    \ assumptions and distribution requirements. To, overcome the limitations of the\
    \ KM analysis and the fully parametric analysis, we can model our survival data\
    \ using the semi-parametric **Cox proportional hazards regression.**"
  merge: -1
  img_proc: true
- pgno: 240
  md: "# 11.11 Estimation from Cox Proportional Hazards Regression\n\n# 11.11.1 Simple\
    \ Cox PH regression\n\nUsing our stroke dataset, we will estimate the parameters\
    \ using the Cox PH regression. Remember, in our data, we have\n\n+   1. the time\
    \ variable : time2\n2. the event variable : status and the event of interest is\
    \ dead. Classified that other are considered as censored.\n3. date variables :\
    \ date of admission (doa) and date of discharge (dod)\n4. all covariates\n\nLet's\
    \ take stroke type as the covariate of interest:\n\n```\nstroke_type <- \ncoxph(Surv(time\
    \ = time2,\n    event = status == 'dead') ~ stroke_type,\n    data = stroke)\n\
    summary(stroke_type)\n```\n\n```\n// Call:\n// coxph(formula = Surv(time = time2,\
    \ event = status == \"dead\") =\n//     stroke_type, data = stroke)\n//\n// n\
    \ = 213, number of events = 48\n//\n//             exp(coef) se(coef)        \
    \  z Pr(|z|)\n// stroke_type  -0.6622   0.5157   0.3172 -2.088  0.0368  0.9602\n\
    // --\n// Signif. codes: 0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 '     ' 1\n\
    //\n//             exp(coef) exp(-coef) lower  upper .95\n// stroke_type     \
    \     0.5157   1.939    0.277  0.9602\n//\n// Concordance = 0.623 (se = 0.045\
    \ )\n// Likelihood ratio test= 4.52 on 1 df,  p=0.03\n// Wald test           =\
    \ 4.36 on 1 df,  p=0.04\n// Score (logrank) test = 4.48 on 1 df,  p=0.03\n```\n\
    \nBut for nicer output (in a data frame format), we can use tidy(). This will\
    \ give us\n\n+   • the estimate which is the log hazard. If you exponentiate it,\
    \ you will get hazard ratio"
