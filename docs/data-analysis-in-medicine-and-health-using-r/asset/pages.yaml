  md: '# R, RStudio and RStudio Cloud




    At the end of the chapter, the readers will


    +   - be introduced to the R programming language

    - be introduced to RStudio IDE

    - be introduced to RStudio Cloud. RStudio Cloud is a platform where users can
    run RStudio on the cloud

    - be able to install R on their local machine

    - be able to install RStudio IDE on their local machine

    - understand how to install LaTeX editor (Miktex or Tex Live and MacTeX). A LaTeX
    editor is optional but required if users want to render PDF outputs

    - understand the structure of R scripts work

    - understand R packages and R Taskview




    R is a language and environment for statistical computing and graphics. It is
    a GNU project similar to the S language and environment developed at Bell Laboratories.
    R provides a wide variety of statistical (linear and nonlinear modeling, classical
    statistical tests, time-series analysis, classification, clustering) and graphical
    techniques and is highly extensible.


    One of R''s strengths is the ease with which well-designed publication-quality
    plots can be produced, including mathematical symbols and formulae where needed.
    R is available as Free Software under the terms of the Free Software Foundation''s
    GNU General Public License in source code. It compiles and runs on various UNIX
    platforms and similar systems (including FreeBSD and Linux), Windows and macOS.'
  merge: -1
