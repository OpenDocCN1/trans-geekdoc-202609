    # 5.9.3 Recoding variables


    We use this function to recode from old to new levels. For example:


    ```

    stroke %>%

    mutate(cat_sbp2 = recode(cat_sbp, "120" = "120 or less",

    "121-130" = "121 to 130",

    "130" = "131 or higher"))

    stroke %>%\ count(cat_sbp2)

    ```


    ```

    ## A tibble: 3 x 2

    ## cat_sbp2 n

    ## <fct> <int>

    ## 1 120 or less 25

    ## 2 121 to 130 16

    ## 3 131 or higher 172

    ```


    # 5.9.4 Changing the level of categorical variable


    Variable cat_sbp Will be ordered as


    +   - less or 120, then

    - 121-130, then

    - 131 or higher'
