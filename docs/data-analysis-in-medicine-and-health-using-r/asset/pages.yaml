    If you run the `library()` code and then get this message **there is no package
    called tidyverse**, it means the package is still unavailable in your R library.
    So, if you receive the error message while loading the **tidyverse** package,
    you must install it.


    To install an R package for **tidyverse**, type `install.package("tidyverse")`
    in the Console. Once the installation is complete, type `library(tidyverse)` again
