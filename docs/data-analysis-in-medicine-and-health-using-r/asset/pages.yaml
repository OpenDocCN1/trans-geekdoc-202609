    \ 3.61\n## dm=yes 72 9.41 14.6 1.85 3.61\n##\n## Chisq=3.6 on 1 degrees of freedom,\
    \ p= 0.06\n```\n\n# II.10 Semi-Parametric Models in Survival Analysis\n\nOne advantage\
    \ of time-to-event data (from a cohort study) is the ability to estimate the hazard\
    \ or risk to develop the event (outcome). However, the challenge in the cohort\
    \ study is the presence of censoring. Censoring can happen due to\n\n+   - patients\
    \ leave the study (loss to follow-up) randomly\n- patients do not experience the\
    \ event at the termination of the study"
