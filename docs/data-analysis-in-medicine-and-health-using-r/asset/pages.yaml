    # 7.5.4 Model fit assessment


    It is important to assess well the SLR model reflects the data. First, we can
    assess this by R², which is the percentage of the variance for the outcome that
    is explained by the predictor. In simpler words, to what extent the variation
    in the values of the outcome is caused/explained by the predictor. This ranges
    from 0% (the'
