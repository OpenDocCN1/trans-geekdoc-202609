    # 4.10 Read the Dataset


    In this chapter, we will use two datasets, the *gapminder* dataset and the peptic
    ulcer dataset. The *gapminder* dataset is a built-in dataset in the **gapminder**
    package. You can read more about *gapminder* from https://www.gapminder.org/ webpage.
    The gapminder website contains many useful datasets and shows excellent graphics,
    made popular by the late Dr Hans Rosling.


    To load the **gapminder** package, type:'
  merge: -1
  img_proc: true
