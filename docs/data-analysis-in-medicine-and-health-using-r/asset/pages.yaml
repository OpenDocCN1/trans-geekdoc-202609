- pgno: 1
  md: '# Data Analysis in Medicine and Health Using R


    In medicine and health, data are analyzed to guide treatment plans, patient care
    and control and prevention policies. However, in doing so, researchers in medicine
    and health often lack the understanding of data and statistical concepts and the
    skills in programming. In addition, there is also an increasing demand for data
    analyses to be reproducible, along with more complex data that require cuttingedge
    data and statistical analysis and modeling. This book provides readers with both
    the fundamental concepts of data and statistical analysis and modeling. It also
    has the skills to perform the analysis using the R programming language, which
    is the lingua franca for statisticians. The topics in the book are presented in
    a sequence to minimize the time to help readers understand the objectives of data
    and statistical analysis, learn the concepts of statistical modeling and acquire
    the skills to perform the analysis. The R codes and datasets used in the book
    will be made available on GitHub for easy access. The book will also be live on
    the website bookdown.org, a service provided by RStudio, PBC, to host books written
    using the bookdown package in the R programming language.'
  merge: -1
  img_proc: true
- pgno: 2
  md: '# Analytics and AI for Healthcare


    *Series Editor: Nilmini Wickramasinghe, Swinburne University of Technology*


    About the Series

    Artificial Intelligence (AI) and analytics are increasingly being applied to various
    healthcare settings. AI and analytics are salient to facilitate better understanding
    and identifying key insights from healthcare data in many areas of practice and
    enquiry in healthcare including the genomic, individual, hospital, community and/or
    population levels.


    The Chapman & Hall/CRC Press Analytics and AI in Healthcare Series aims to help
    professionals upskill and leverage the techniques, tools, technologies and tactics
    of analytics and AI to achieve better healthcare delivery, access and outcomes.


    The series covers all areas of analytics and AI as applied to healthcare. It will
    look at critical areas, including prevention, prediction, diagnosis, treatment,
    monitoring, rehabilitation and survivorship.


    Explainable Artificial Intelligence in Healthcare: Unboxing Machine Learning in
    Pre-processing and Medical Imaging


    Edited by Mehul S Raval, Mohendra Roy, Tolga Kaya, and Rupal Kapdi


    Data Analysis in Medicine and Health Using R

    Kamarul Imran Musa, Wan Nor Afif Wan Mansor, and Tengku Muhammad Hanis


    For more information about this series visit: https://www.routledge.com/analytics-and-ai-for-healthcare/book-series/Aforhealth'
  merge: -1
  img_proc: true
