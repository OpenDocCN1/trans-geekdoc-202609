    # 5.9 Data Transformation for Categorical Variables


    # 5.9.1 forcats package


    Data transformation for categorical variables (factor variables) can be facilitated
    using the forcats package.


    # 5.9.2 Conversion from numeric to factor variables


    Now, we will convert the integer (numerical) variable to a factor (categorical)
    variable. For example, we will generate a new factor (categorical) variable named
    high_bp from variables sbp and dbp (both double variables). We will label high_bpas
    High or Not High.

    The criteria:


    +   - if sbp >= 130 or dbp >= 90 then labeled as High, else is Not High


    ```

    stroke <- stroke%

    mutate(high_bp = if_else(sbp >= 130 | dbp >= 90

    ```


    ```

    ## # tibble: 2 x 2

    ##   high_bp n

    ##   <chr> <int>

    ## 1 High 177

    ## 2 Not High 36

    ```


    alternatively, you can use cut()


    ```

    stroke <- stroke%

    mutate(cat_sbp = cut(sbp, breaks = c(-Inf, 120, 130, Inf),

    n      labels = c(''<120'', ''121-130'', ''>130'')))

    stroke %>% count(cat_sbp)

    ```


    ```

    ## # tibble: 3 x 2

    ```'
