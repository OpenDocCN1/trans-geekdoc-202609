    * VIM: for missing data exploration

    * naniar: for missing data exploration

    * tidymverse: for data wrangling and manipulation

    * gtsmary: to provide a nice result in


    ```

    library(mice)

    library(VIM)

    library(naniar)

    library(tidyverse)

    library(gtsmary)

    ```'
