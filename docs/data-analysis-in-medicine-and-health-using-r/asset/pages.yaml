- pgno: 223
  md: '# # Survival Analysis: Kaplan–Meier and Cox Proportional Hazard (PH) Regression




    At the end of the chapter, the readers will be


    +   - to understand the basic concept of non-parametric survival analysis such
    as the Kaplan–Meier estimates and the semi-parametric survival analysis such as
    the Cox proportional hazard (PH) regression.

    - to perform the Kaplan–Meier analysis

    - to test the hypothesis of the survival distributions for two samples.

    - to perform the simple (univariate) Cox PH regression analysis

    - to perform the multiple (multivariable) Cox PH regression analysis




    Regression concerns the relationship between a response variable and one or more
    exploratory variables. The independent variables are also called covariates. Some
    common regression analysis in health and medicine is linear regression, logistic
    regression, Poisson regression and Cox proportional hazards regression. Linear
    regression falls under the general model while the three regression models fall
    under the generalized linear regression.


    Survival analysis is also known as duration analysis or time-to-event analysis.
    This analysis is useful in follow studies where participants or patients are followed-up
    until they develop the event of interest. Examples of such studies include the
    retrospective or prospective cohort studies.


    Sometimes people confuse and wrongly think that the survival analysis is only
    applicable to the study of survival (where the event of interest is either alive
    or death condition). It is not. Any study that involves both the duration of follow
    up (in days or weeks or months) and the event of interest can be considered suitable
    for survival'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'analysis. So, survival or duration analysis is performed on data that has duration
    until an event occurs.


    In health and medicine studies, this event can be of interest, for example:


    +   - relapse after treatment

    - death after diagnosis

    - recurrence of disease

    - treatment success


    And for variable time, it can be in any form such as days, weeks, years or event
    minutes. If we combine them together (with the event of interest) then it can
    be-:


    +   - months to relapse

    - years from diagnosis to death

    - weeks before recurrence

    - days taken from the start of treatment to treatment success


    # 11.3 Types of Survival Analysis


    There are three main types of survival analysis:


    +   - the non-parametric survival analysis for example Kaplan–Meier estimates.

    - the semi-parametric survival analysis for example Cox proportional hazards (PH)
    regression.

    - the parametric survival analysis for example Weibull parametric survival analysis.


    In medical literature, we usually perform the non-parametric analysis for example
    the Kaplan–Meier estimates at the beginning of the analysis to understand the
    trend of survival probabilities. Following that, we perform simple (univariable)
    or multiple (multivariable) Cox proportional hazard (PH) regression model. If
    we are sure with the distribution of the risk and aim to estimate the survival
    time, then we can perform parametric survival analysis.


