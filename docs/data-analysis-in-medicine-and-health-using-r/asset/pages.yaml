  md: "# 2 Scripts and R Packages\n\n![](img/2bc6b006fe018e0018b86f206ab98644_34_0.png)\n\
    \n# Fitting Linear Models\n\nDescription\n\nlm is used to fit linear models. It\
    \ can be used for carry out, simple regression analysis of variance and covariance\
    \ (although R may provide a more convenient interface for these)\n\nUsage\n\n\
    ```\nlm(formula, data, subset, weights, na.action,\n      method = \"qr\", x =\
    \ TRUE, y = FALSE, qr = TRUE,\n      singular.ok = TRUE, model = NULL, offset\
    \ = ...)\n```\n\nArguments\n\n+   - formula: an object of class \"formula\" or\
    \ one that can be connected to that class; a symbolic description of the model\
    \ to be fitted. Details of the model specification are given under 'Details'\n\
    - data: an optional data frame, list or environment (which can be coerced to data.frame)\
    \ containing the variables. If not found, the variables are taken from the environment\
    \ in which `lm` is called.\n- subset: an optional subset of observations to be\
    \ used in the fitting process\n- weights: an optional vector of weights to be\
    \ used in the fitting process. Should be NULL or a numeric vector; if non-ordinary\
    \ weights are used, they must be orthogonal.\n- na.action: how to handle missing\
    \ values if the data contains NAs. The default is set by the na.action setting\
