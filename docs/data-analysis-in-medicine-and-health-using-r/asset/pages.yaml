  md: "# 12.4 Analysis\n\n# 12.4.7 Weibull (accelerated failure time)\n\nWe first\
    \ start with estimating a Weibull parametric survival model which will return\
    \ an accelerated failure metric:\n\nTo do this, we will be using the survreg()\
    \ function\n\n```\nwei.mod.aft <- survreg(Surv(survivtime, status) ~ age + surgery\
    \ + marital,\n               data = d1, dist = 'weibull')\nsummary(wei.mod.aft)\n\
    ```\n\n```\n## Call:\n## survreg(formula = Surv(survivtime, status) ~ age + surgery\
    \ +\n##             marital, data = d1, dist = \"weibull\"\n##             Value\
    \ Std. Error z p\n## (Intercept) 0.19724 34.58 2e-16\n## age\n## surgeryYes\n\
    ## maritalSeparated/divorced/widowed\n## maritalSingle\n## Log(scale)\n## Scale=\
    \ 1.23\n```\n\n```\n## Weibull distribution\n## Loglik(model)= -5365.4 Loglik(intercept\
