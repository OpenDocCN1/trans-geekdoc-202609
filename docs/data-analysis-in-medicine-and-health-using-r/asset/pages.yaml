- pgno: 209
  md: "# 10.5 Poisson Regression for Rate\n\n# 10.5.1 About Poisson regression for\
    \ rate\n\nAt times, the count is proportional to a denominator. For example, given\
    \ the same number of deaths, the death rate in a small population will be higher\
    \ than the rate in a large population. If we were to compare the number of deaths\
    \ between the population, it would not make a fair comparison. Thus, we may consider\
    \ adding denominators in the Poisson regression modeling in form of offsets. This\
    \ denominator could be the unit of time of exposure, for example person-years\
    \ of cigarette smoking.\n\nAs mentioned before, counts can be proportional specific\
    \ denominators, giving rise to rates. We may model these denominators as offsets.\
    \ Again, these denominators could be stratum size or unit time of exposure. Multiple\
    \ Poisson regression for rate is specified by adding the offset in the form of\
    \ the natural log of the denominator $t$. This is given as,\n\n```\n$ln($\bar{y})\
    \ = ln(t) + b_0 + b_1x_1 + b_2x_2 + ... + b_px_p$\n```\n\n# 10.5.2 Dataset\n\n\
    The data on the number of lung cancer cases among doctors, cigarettes per day\
    \ of smoking and the respective person-years at risk of lung cancer are given\
    \ in `smoke.csv`. The person-years variables serves as the offset for our analysis.\
    \ The original data came from Doll (1971), which were analyzed in the context\
    \ of Poisson regression by From (1983) and Fliss et al. (2003). The dataset contains\
    \ four variables:\n\n+   1. `smoke_yrs`: Years of smoking (categorical) [15-19,\
    \ 204-24, 25-29, 30-34, 35-39, 40-44, 45-49, 50-54, 55-59]\n2. `cig_day`: Cigarettes\
    \ per day (numerical).\n3. `person_yrs`: Person-years at risk of lung cancer (numerical).\n\
    4. `case`: Number of lung cancer cases (count).\n\nThe dataset is loaded as,\n\
    \n```\nsmoke = read.csv(\"data/smoke.csv\")\n```\n\nThen, we look at its data\
    \ structure,\n\n```\nstr(smoke)\n```\n\n```\n# 'data.frame': 63 obs. of 4 variables:\n\
    ```"
  merge: -1
  img_proc: true
