  md: '# 2.5 Working Directory


    Setting and knowing the R working directory is very important. Our working directory
    will contain the R codes, the R outputs, datasets or ever resources or tutorials
    that can help us using in R project or during our R analysis/


    The working directory is just a folder. Moreover, the folder can contain many
    subfolders. We recommend the folder contain the dataset (if you want to analyze
    your data locally) and other objects. R will store many other R objects created
    during R session.


    Type this to locate the working directory:


    ```

    getwd()

    # [1] "C:/Users/drkim/Downloads/multivariate_data_analysis/multivariate_data_analysis"

    ```


    # 2.5.1 Starting a new R job


    There are two ways to start a new R project:


    +   - create a new Project from RStudio IDE. This is the method that we recommend.

    - setting your working directory using the setwd() function.


    # 2.5.2 Creating a new R project


    We highly encourage users to create a new R project. To do this, users can


    +   - go to File -> New Project


    When you use project type, click New Project


    # 2.5.3 Location for dataset


    Many data analysts use data stored on their local machines. R will read data and
    usually store this data in data format or class. When you read your data into
    RStudio, you will save the dataset in the environment pane. RStudio saves it to
    the RAM (random access memory). So you must know the size of your computer RAM.
    How much is your RAM for your machine? The bigger the RAM, the larger R can read
    and store your data in the computer''s memory.


    The data read (in memory) will disappear once you close RStudio. The source dataset
    will stay in its original location, so there will be no change to your original
    data (be happy!) unless you save the data frame in the memory and replace the
    original file. However, we do not recommend you do this.'
  merge: -1
