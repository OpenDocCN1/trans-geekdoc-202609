- pgno: 147
  md: '# Multiple Linear Regression




    For MLR, we assess the model fit by $R^2$ and histogram and scatter plots of residuals.
    Residuals, in simple term, are the discrepancies between the observed values (dots)
    and the predicted values (by the fit MLR model). So, the lesser the discrepancies,
    the better is the model fit.


    # Percentage of variance explained, $R^2$


    First, we obtain the $R^2$ values. In comparison to the $R^2$ obtained for the
    SLR, we include $adj = TRUE$ here to obtain an adjusted $R^2$. The adjusted $R^2$
    here is the $R^2$ with penalty for the number of predictors $p$. This discourages
    including too many variables, which might be unnecessary.


    ```

    rsq(mlr_chol_sel, adj = TRUE)

    ```


    ```

    # [1] 0.2227869

    ```


    # Histogram and box-and-whiskers plot


    Second, we plot a histogram and box-and-whiskers plot to assess the normality
    of raw/unstandardized residuals of the MLR model. We expect normally distributed
    residuals to indicate a good fit of the MLR model. Here, we have a normally-distributed
    residuals.


    ```

    rraw_chol = resid(mlr_chol_sel)

    hist(rraw_chol)

    ```


    ```

    boxplot(rraw_chol)

    ```


    # Scatter plots


    Third, we plot a standardized residuals (Y-axis) vs standardized predicted values
    (X-axis) plot. Similar to the one for SLR, this allows assessment of normality,
    linearity and equal variance assumptions. The dots should form elliptical/oval
    shape (normality) and scattered roughly above and below the zero line (equal variance).
    Both indicate linearity. Our plot below shows that the assumptions are met.


    ```

    rstd_chol = resid(mlr_chol_sel) # standardized residuals

    pstd_chol = scale(predict(mlr_chol_sel)) # standardized predicted values

    plot(rstd_chol - pstd_chol, xlab = "Std predicted", ylab = "Std residuals"

    abline(0, 0) # normal, linear, equal variance

    ```'
  merge: -1
  img_proc: true
