- pgno: 131
  md: '# #7


    # Linear Regression




    After completing this chapter, the readers are expected to


    +   - understand the concept of simple and multiple linear regression

    - perform simple linear regression

    - perform multiple linear regression

    - perform model fit assessment of linear regression models

    - present and interpret the results of linear regression analyses




    Linear regression is one of the most common statistical analyses in medical and
    health sciences. Linear regression models the linear (i.e. straight line) relationship
    between:


    +   - **outcome**: numerical variable (e.g. blood pressure, BMI and cholesterol
    level).

    - **predictors/independent variables**: numerical variables and categorical variables
    (e.g. gender, race and education level).


    In simple words, we might be interested in knowing the relationship between the
    cholesterol level and its associated factors, for example gender, age, BMI and
    lifestyle. This can be explored by linear regression analysis.




    Linear regression is a type of generalized linear models (GLMs), which also includes
    other outcome types, for example categorical and count. In subsequent chapters,
    we will cover these outcome types in form of logistic regression and Poisson regression.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'Basically, the relationship between the outcome and predictors in linear regression
    is structured as follows,


    ```

    numerical outcome = numerical predictors

    + categorical predictors

    ```


    More appropriate forms of this relationship will explained later under simple
    and multiple linear regressions sections.


    # 7.4 Prepare R Environment for Analysis


    # 7.4.1 Libraries


    For this chapter, we will be using the following packages:


    +   - **foreign**: for reading SPSS and STATA datasets

    - **tidyverse**: a general and powerful package for data transformation

    - **psch**: for descriptive statistics

    - **gtsummary**: for coming up with nice tables for results and plotting the graphs

    - **ggplot2, ggpubr, GGally**: for plotting the graphs

    - **rsq**: for getting $R^2$ value from a GLM model

    - **broom**: for tidying up the results

    - **car**: for vari() function


    These are loaded as follows the function `library()`,


    ```

    library(foreign)

    library(tidyverse)

    library(psch)

    library(gtsummary)

    library(ggplot2)

    library(ggpubr)

    library(GGally)

    library(rsq)

    library(broom)

    library(car)

    ```


    # 7.4.2 Dataset


    We will use the `coron.dta` dataset in STATA format. The dataset contains the
    total cholesterol level, their individual characteristics and intervention groups
    in a hypothetical clinical trial. The dataset contains 200 observations for nine
    variables:'
