  md: '# 4


    # # Data Visualization




    In this chapter, readers will:


    +   - be introduced to the concept of data visualization

    - able to understand the ingredients for good graphics

    - able to generate plots using ggplot packages

    - able to save plots in different formats and graphical settings


    In our physical book, the plots will be published in black and white text. Because
    of that, some of the R codes that come with ggplot2 will have an additional line
    of code such as scale_colour_grey() + scale_line_grey() to make sure the plots
    suit the black and white text inside our physical book. The online version of
    our book on the bookwebsite¹ shows the plots in color.




    Many disciplines view data visualization as a modern equivalent of visual communication.
    It involves the creation and study of the visual representation of data. Data
    visualization requires "information that has been abstracted in schematic form,
    including attributes or variables for the units of information". You can read
    more about data visualization on this wikipedia² page and another wikipedia³ page.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 4.3 History and Objectives of Data Visualization


    In his 1893 book, which carried the title The Visual Display of Quantitative Information,
    the author Edward Tufte defines graphical displays and principles for effective
    graphical display. The book mentioned, “Excellence in statistical graphics consists
    of complex ideas communicated with clarity, precision and efficiency”.


    Visualization is the process of representing data graphically and interacting
    with these representations. The objective is to gain insight into the data. Some
    of the processes are outlined in Watson IBM webpage


    # 4.4 Ingredients for Good Graphics


    Good graphics are essential to convey the message from your data visually. They
    will complement the text for your books, reports or manuscripts. However, you
    need to make sure that while writing for graphics, you need to consider these
    ingredients:


    +   - You have good data

    - Priorities on substance rather than methodology, graphic design, the technology
    of graphic production or something else

    - Do not distort what the data has to say

    - Show the presence of many numbers in a small space

    - Coherence for large data sets

    - Encourage the eye to compare different pieces of data

    - Graphics reveal data at several levels of detail, from a broad overview to the
    fine structure

    - Graphics serve a reasonably clear purpose: description, exploration, tabulation
    and decoration

    - Be closely integrated with a data set''s statistical and verbal descriptions.


    # 4.5 Graphics Packages in R


    There are several packages to create graphics in R. They include packages that
    perform general data visualization or graphical tasks. The others provide specific
    graphics for certain statistical or data analyses.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# 4.6 ggplot2 Package


    The popular general-purpose graphics in R include: which means it is loaded every
    time we open R


    +   - **graphics**: a base R package, a user-contributed package by RStudio, so
    you must install it first time you use it. as a standalone package but also comes
    with **tidyverse** package

    - **ggplot2**: this is a user-contributed package. It provides the ability to
    display multivariate relationships, and it improves on the base-R graphics. This
    package ports the creation of trellis graphs: graphs that display a variable or.

    - **lattice**: this is a user-contributed package.


    A few examples of more specific graphical packages include:


    +   - **surminer**: The R package provides functions for facilitating survival
    analysis and visualization. It contains the function `ggsurvival()` for drawing
    easily and ready-to-publish survival curves with the number at risk table and
    censoring point.

    - **sjPlot**: Collection of plotting and table output functions for data visualization.
    Using sjPlot, you can make plots for various statistical analyses including simple
    and cross-tabulated frequencies, histograms, box plots, (generalized) linear models,
    mixed effects models, principal component analysis and correlation matrices, clusters,
    scatters, plots, stacked scales, and effects plots of regression models (including
    interaction terms).


    Except for **graphics** package (a base R package), other packages such as **ggplot2**
    and **lattice** need to be installed into your R library if you want to use them
    for the first time.


    # 4.6 The ggplot2 Package


    We will focus on using the **ggplot2** package for this book. The **ggplot2**
    package is an elegant, and versatile general graphics package in R. It implements
    the **grammar of graphics** concept. This concept''s advantage is that it fastens
    the process of learning graphics. It also facilitates the process of creating
    complex graphics


    To work with ggplot2, remember that at least your R codes


    +   - start with `ggplot()`

    - identify which data to plot data = Your Data

    - state variables to plot for example `aes(x = Variable on x-axis, y = Variable
    on y-axis)` for bivariate

    - choose type of graph, for example `geom_histogram()` for histogram, and `geom_points()`
    for scatterplots


    The official website for ggplot2 is here https://ggplot2.tidyverse.org/ which
    is an excellent resource. The website states that ggplot2 is a plotting system
    for R, based'
