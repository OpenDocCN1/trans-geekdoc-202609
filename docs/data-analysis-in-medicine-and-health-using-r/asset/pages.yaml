- pgno: 193
  md: '# 10


    # Poisson Regression




    After completing this chapter, the readers are expected to


    +   - understand the basic concepts behind Poisson regression for count and rate
    data

    - perform Poisson regression for count and rate

    - perform model fit assessment

    - present and interpret the results of Poisson regression analyses




    Poisson regression is a regression analysis for count and rate data. As mentioned
    before in Chapter 7, it is a type of generalized linear models (GLMs) whenever
    the outcome is. It also accommodates rate data, as we will see shortly. Although
    count and rate data are very common in medical and health sciences, in our experience,
    Poisson regression is underutilized in medical research. Most often, researchers
    end up using linear regression because they are more familiar with it and lack
    of exposure to the advantage of using Poisson regression to handle count and rate
    data.


    Count is discrete numerical data. Although it is convenient to use linear regression
    to handle the count outcome by assuming the count or discrete numerical data (e.g.
    the number of hospital admissions) as continuous numerical data (e.g. systolic
    blood pressure in mmHg), it may result in illogical predicted values. For example,
    by using linear regression to predict the number of asthmatic attacks in the past
    year, we may end up with a negative number of attacks, which does not make any
    clinical sense! So it is recommended that medical researchers get familiar with
    Poisson regression and make use of it whenever the outcome variable is a count
    variable.


    Another reason for using Poisson regression is whenever the number of cases (e.g.
    deaths and accidents) is small relative to the number of events (e.g. alive and'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'no accident), then it makes more sense to just get the information from the
    cases in a population of interest, instead of also getting the information from
    the non-cases as typical cohort and case-control studies. For example, in the
    publicly available COVID-19 data, only the number of deaths were reported along
    with some basic sociodemographic and clinical information for the cases. Whenever
    the information for the non-cases are available, it is quite easy to use logistic
    regression for the analysis.


    Basically, Poisson regression models the linear relationship between:


    +   **outcome**: count variable (e.g. the number of hospital admissions, parity,
    cancerous lesions and astumatic attacks). This is transformed into the natural
    log scale.

    **predictors/independent variables**: numerical variables (e.g. age, blood pressure
    and income) and categorical variables (e.g. gender, race and education level).


    We might be interested in knowing the relationship between the number of astumatic
    attacks in the past year with sociodemographic factors. This relationship can
    be explored by a Poisson regression analysis.


    Basically, for Poisson regression, the relationship between the outcome and predictors
    is:


    ```

    natural log of count outcome = numerical predictors

    + categorical predictors

    ```


    At times, the count is proportional to a denominator. For example, given the same
    number of deaths, the death rate in a small population will be higher than the
    rate in a large population. If we were to compare the number of deaths between
    the populations, it would not make a fair comparison. Thus, we may consider adding
    denominators in the Poisson regression modeling in the form of offsets. This denominator
    could also be the unit of exposure, for example person-years of cigarette smoking.
    This will be explained later under Poisson regression for rate section.


    In the previous chapter, we learned that logistic regression allows us to obtain
    the odds ratio, which is approximately the relative risk given a predictor. For
    Poisson regression, by taking the exponent of the coefficient, we obtain the rate
    ratio RR (also known as incidence rate ratio IRR),


    ```

    RR = exp(b_p)

    ```


    for the coefficient b_p of the p''s predictor. This is interpreted in similar
    way to the odds ratio for logistic regression, which is approximately the relative
    risk given a predictor.'
