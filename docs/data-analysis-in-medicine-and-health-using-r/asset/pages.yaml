    # 8.9 Estimate the Regression Parameters


    As we assume the outcome variable (status) follows binomial distribution, we will
    perform binary logistic regression. Logistic regression allow us to estimate the
    re-cursion parameters β, or the log odds in a dataset where the outcome follows
    binomial or bernoulli distribution.


    To achieve the objective, we do this in two steps:


    +   - The simple binary logistic regression or the univariate logistic regression:
    In this analysis, there is only one independent variable or covariate in the model.
    This is also known as the crude or unadjusted analysis.

    - The multiple binary logistic regression or the multivariable logistic regression:
    Here, we expand our model and include two or more independent variables (covariates).
    The multiple binary logistic regression model is an adjusted model, and we can
    obtain the estimate of a particular covariate independent of the other covariates
    in the model.


    # 8.10 Simple Binary Logistic Regression


    Simple binary logistic regression model has a dependent variable and only one
    independent (covariate) variable.


    In our dataset, for example, we are to model a simple binary logistic regression
    using'
