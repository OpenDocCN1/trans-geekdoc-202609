- pgno: 134
  md: "# 7.5 Simple Linear Regression\n\n# 7.5.1 About simple linear regression\n\n\
    Simple linear regression (SLR) models linear (straight line) relationship between:\n\
    \n+   - **outcome**: numerical variable.\n- **ONE predictor**: numerical/categorical\
    \ variable.\n\nNote: When the predictor is a categorical variable, this is typically\
    \ analyzed by one-way ANOVA. However, SLR can also handle a categorical variable\
    \ in the GLM framework.\n\nWe may formally represent SLR in form of an equation\
    \ as follows,\n\n$$\\numerical \\text{ outcome} = \\text{intercept} + \\text{coefficient}\
    \ \\times \\text{predictor}$\n\nor in a shorter form using mathematical notations,\n\
    \n$$\\hat{y} = b_0 + b_1x_1$$\n\nwhere $$\\hat{y}$ (pronounced y hat) is the predicted\
    \ value of the outcome.\n\n# 7.5.2 Data exploration\n\nLet say, for the SLR we\
    \ are interested in knowing whether diastolic blood pressure (predictor) is associated\
    \ with the cholesterol level (outcome). We explore the variables by obtaining\
    \ the descriptive statistics and plotting the data distribution.\n\nWe obtain\
    \ the descriptive statistics of the variables,\n\n```\ncorary() %>%select(chol,\
    \ dbp) %>%describe()\n\n## vars n mean median trimmed mad min max range skew kurtosis\n\
    ## chol 1 200 6.20 1.18 6.19 6.18 1.18 4 9.35 5.35 0.18 -0.31\n## dbp 2 200 82.31\
    \ 12.90 80.00 81.68 14.83 56 120.00 64.00 0.42 -0.33\n##\nse se\n## chol 0.08\n\
    ## dbp 0.91\n```\n\nand the histograms and box-whiskers plots,\n\n```\nhist_chol\
    \ <- ggplot(corary, aes(chol)) + \ngeom_histogram(color = \"black\", fill = \"\
    white\") \nhist_dbp <- ggplot(corary, aes(dbp)) +\n```"
  merge: -1
  img_proc: true
