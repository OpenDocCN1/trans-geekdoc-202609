    By default, mice() use predictive mean matching (pmm) for a numerical variable,
    binary logistic regression (logreg) for a categorical variable with two levels
    and multinomial regression or polytomous logistic regression (polyreg) for a categorical
    variable with more than two level. mice() will not assign any method for variable
    with non-missing values by default (by " in the section of imputation method above).


    We are going to change the method for numerical variable (age and chol) to a linear
    re-


    ```

    meth <- iniMethod

    mice[c(1,3)] <- "norm.predict"

    meth


    ## age race chol cad sbp

    ## "norm.predict" "polyreg" "norm.predict" "" ""

    ## dbp bmi gender

    ## "" " ""

    ```


    mice() function contains a few arguments:


    +   - m: number of imputed sets (will be used in the multiple imputation laten)

    - method: to specify a method of imputation

    - predictorMatrix: to specify predictors for imputation

    - printFlag: print history on the R console

    - seed: random number for reproducibility


    ```

    regImp <- mice(corNA%%= select(-id),

    m = 1, method = meth, printFlag = F, seed = 123)

    regImp

    ```


    ```

    ## Class: mids

    ## Number of multiple imputations: 1

    ## Imputation methods:


    ## age race chol cad sbp

    ## "norm.predict"" "polyreg" "norm.predict" "" ""

    ## dbp bmi gender

    ## "" " " ""

    ## PredictorMatrix:

    ## age race chol cad sbp bmi gender

    ## age 0 1 1 1 1 1 1

    ## race 1 1 1 1 1 1 1

    ## chol 1 1 0 1 1 1 1

    ## cad 1 1 1 0 1 1 1

    ## sbp 1 1 1 1 0 1 1

    ## dbp 1 1 1 1 1 0 1

    ```'
