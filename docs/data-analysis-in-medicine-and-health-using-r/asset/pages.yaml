  md: "# 8.15 Adding an Interaction Term\n\nNow, let's be economical, and just keep\
    \ variables such as gcs, stroke type and age in the model. We will name this multivariable\
    \ logistic model as fatal_mv2:\n\n```\nfatal_mv2 <-\nglm(status ~ gcs + stroke_type\
    \ + age,\n  data = fatal,\n  family = binomial(link = 'logit'))\n```\n\nNow we\
    \ will perform model comparison again:\n\n```\nanova( fatal_mv1,\n  fatal_mv2,\
    \ test = 'Chisq')\n```\n\n```\n## Analysis of Deviation Table\n##\n## Model 1:\
    \ status = gcs + stroke_type + sex + dm + sbp + age\n## Model 2: status = gcs\
    \ + stroke_type + age\n| | Res. Df | Res. Dev Deviance | Pr(>Chi) |\n|---|---|---|---|\n\
    | # 1 | 219 | 159.34 | |n| # 2 | 222 | 161.51 | -2.1743 | 0.537 |\n```\n\nThe\
    \ p-value is above the threshold of 5% set by us. Hence, we do not want to reject\
    \ the null hypothesis (null hypothesis says that both models are not statistically\
    \ different). Our approach also agrees with Occam's razor principle; always choose\
    \ simpler model. In this case, fatal_mv2 is simpler and deserves further exploration.\n\
    \n# 8.15 Adding an Interaction Term\n\nInteraction effect occurs when the effect\
    \ of one variable depends on the value of another variable (in the case of two\
    \ interacting variables). Interaction effect is common in regression analysis,\
    \ ANOVA, and in designed experiments.\n\nTwo-way interaction term involves two\
    \ risk factors and their effect on one disease outcome. If the effect of one risk\
    \ factor is the same strata defined by the other, then there is no interaction.\
    \ When the effect of one risk factor is different within strata defined by the\
    \ other, then there is an interaction; this can be considered as biological interaction.\n\
    \nStatistical interaction in the regression model can be measured based on the\
    \ ways that risks are calculated (modeling). The presence of statistical interaction\
    \ may not reflect true interaction."
