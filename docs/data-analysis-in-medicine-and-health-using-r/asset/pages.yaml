    ## AIC: 592.23


    ## Number of Fisher Scoring iterations: 2

    ```


    From the output, there is no evidence that suggests the presence of interaction
    because the included interaction term was insignificant. In R, it is easy to fit
    interaction by *, e.g. dbp * race will automatically includes all variables involved.
    This is equal to specifying glm(chol - dbp + dbp:race, data = coronary), where
    we can use : to include the interaction.'
