    \ for data wrangling:\n\n```\npep_age <- pep %>% group_by(outcome) %>%%\nsummarize(mean_age\
    \ = mean(age))\nep_age\n## # tibble: 2 x 2\n## outcome mean_age\n## <chr>    \
    \     <dbl>\n## 1 alive         58.2\n## 2 dead          65.3\n```\n\nAnd the\
    \ ggplot2 part to make the plot:\n\n```\nggplot(pep_age, mapping = aes(x = outcome,\
    \ y = mean_age)) +\nge_col()\n```\n\n![](img/2bc6b006fe018e0018b86f206ab98644_116_0.png)\n\
    \nWe can combine both tasks dplyr and ggplot together that will save time:\n\n\
    ```\npep %%\ngroup_by(outcome) %%\nsummarize(mean_age = mean(age)) %%\nggplot(mapping\
    \ = aes(x = outcome, y = mean_age, fill = outcome)) +\nge_col() + \nyab(\"Mean\
    \ age (Years)\") + \nxlab(\"Outcome of ulcer\") + \nscale_fill_grey() + \ntheme_bw()\n\
    ```"
