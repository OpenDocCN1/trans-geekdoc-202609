- pgno: 83
  md: 'Let''s get back to the original script. Now that the dictionary is ready, we
    split the customer-submitted `$string` into an array of words, so `lemony snicket`
    becomes an array of `lemony` and `snicket`.


    We then check each word against pspell''s dictionary. Note that pspell doesn''t
    like commas, so we remove the comma from the word before checking. If the word
    is longer than three characters, we check the spelling. If pspell detects a misspelling,
    we do the following:


    +   1. We ask pspell to suggest an array of potential spellings for us.

    +   2. We take the most likely spelling (the first item in the `$suggestion array`)
    and overwrite the old misspelled word with the new suggested word.

    +   3. We set the `$suggested_replacement` flag to `True` to let us know at the
    end of the loop that we found a misspelled word somewhere in `$string`.


    At the end of the loop, we check `$suggested_replacement` to see if there are
    any misspelled words. If so, we join the corrected words in `$string` with spaces
    and return that value. If there are no such words, we return null, indicating
    no misspellings.


    # Adding a Custom Dictionary to pspell


    If a word isn''t in the default dictionary, you can''t easily add it. However,
    you can create a custom dictionary for use in conjunction with pspell''s default
    dictionary. Here''s how to do it:


    Create a PHP-writable folder on your site and initialize the new dictionary there.
    Use the following script to create a new dictionary file `custom.pws` in the directory
    `path` on your server:


    ```

    <?

    $dict_config = pspell_config_create(''en'', ''american'');

    pspell_config_personal($dict_config, ''path/custom.pws'');

    pspell_config_ignore($dict_config, 2);

    pspell_config_mode($dict_config, PSPELL_FAST);

    $dictionary = pspell_new_config($dict_config);

    ?>

    ```


    This is the script from the previous section but with one critical change: the
    addition of the `pspell_config_personal()` call that initializes a personal dictionary
    file. If no dictionary file is present, pspell creates an empty one for you.


    You can add as many words as you like to your dictionary using this function:


    ```

    pspell_add_to_personal($dictionary, word);

    ```'
