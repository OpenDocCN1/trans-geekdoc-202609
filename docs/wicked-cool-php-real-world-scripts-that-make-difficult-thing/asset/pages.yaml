- pgno: 87
  md: '# Putting It All Together


    You’ve now seen all of the essential building blocks of regular expressions.

    On their own, they don’t do much, but when you put them together, you can

    create very powerful expressions. However, it’s important to remember two

    things: first, it does take practice to learn how to create complex expressions,

    and second, you should always build even the most complicated expressions

    one step at a time. Let’s walk through how the following regular expression

    works:


    ```

    /<a\s+[^>]*href="[^"]+"/i

    ```


    This regular expression matches an HTML anchor tag that has a link

    inside. Here’s how the pieces break down:


    +   1. All anchor tags start with <a, so this is the first piece.

    +   2. Some whitespace must appear next, otherwise we’d match nonsense

    +      such as <apple>. Therefore, \s+ appears next.

    +   3. Now, we want to match any characters in the tag up to the link, because

    +      there might be some extra attributes such as target="blank" present. Tags

    +      ends with >, so we use [^>]* to match zero or more characters that aren’t

    +      >. If this step doesn’t sound very intuitive, you are correct. Typically,

    +      you’d realize the need for it (or, at least, only have the patience to
    deal

    +      with it) after writing the rest of the expression.

    +   4. Link attributes start with href="", so we place that next. (For the sake
    of

    +      simplicity, for now we’re ignoring the fact that some people leave out
    the

    +      quotes.)

    +   5. Now we’re at the first character of the link. We want to match the whole

    +      link. Therefore, we can use the same trick as in step 3; [^"]+ matches
    one

    +      or more link characters.

    +   6. To match the single quote that ends the attribute, we put in a double

    +      quotation mark ("). This might seem unnecessary because we’ve already

    +      matched the link, but it’s usually best to follow up on our patterns just
    a

    +      little so that we don’t accidentally match complete garbage.

    +   7. The tag and attribute names in HTML are case insensitive, so we add the

    +      i modifier to the end of the expression after the delimiter.


    As you can see, matching patterns with regular expressions is fairly

    simple. Now it’s time to actually learn how to use them in PHP.


    # Matching and Extracting with Regular Expressions


    PHP includes several regular expression functions. The easiest are the ones

    that tell you if there are any matches, what the matches are, and the locations'
