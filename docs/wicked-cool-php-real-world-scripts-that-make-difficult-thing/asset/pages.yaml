- pgno: 34
  md: '# 2


    # CONFIGURING PHP


    ![](img/19183d2b75bf6b509317c631c0e7b817_34_0.png)


    As with any software package, PHP has many configuration options that affect how
    it runs. Most of those options aren’t significant, but there are a few important
    ones that every programmer should know.


    In addition, there are many add-ons for PHP, called libraries, that add new capabilities
    to PHP. For example, the cURL extension allows your server to send form data to
    other servers and process the data that gets sent back. Mcrypt, another useful
    extension, allows you to easily perform high-end encryption so you can store sensitive
    data securely.


    This chapter shows you the settings that programmers frequently use in PHP and
    when you’d want to use them.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# # Configuration Settings and the php.ini File


    Most novice programmers treat PHP''s default settings as if they were a tenant
    moving into an apartment complex—afraid to make changes lest it cost them their
    security deposit. But you should really think of PHP as your house. You''re going
    to live here for a while, so why not rearrange the furniture and knock down a
    wall or two?


    **NOTE** Depending on your webserver host, you may not be able to change the settings
    yourself. However, good hosting services should be willing to make the change
    for you, and many high-end server hosts allow you to alter directives with a user-specific
    configuration file.


    PHP''s settings are in a file called php.ini that you can view and change with
    any text editor. The settings are arranged into sections and look something like
    this:


    ```

    max_execution_time = 30 ; Maximum execution time

    max_input_time = 60 ; Maximum input parsing time

    memory_limit = 8M ; Maximum memory a script may consume

    ```


    You set configuration parameters with an equal sign (=). A semicolon (;) denotes
    a comment; however, there are a few exceptions with semicolons in some parameters.
    If you''d like to change a setting permanently, make a backup of your php.ini,
    edit the original, and restart Apache. If you''d rather change it on a per-script
    basis, use the ini_set() function.


    # ## Locating Your php.ini File


    Sometimes it can be a little difficult to track down the location of php.ini on
    your system, especially if there are multiple instances of a PHP installation.
    Here are a few ways of finding it:


    +   - On Unix systems, look in /usr/lib or /usr/local/lib. It should be in the
    lib directory of wherever you installed PHP.

    +   - On Windows, try C:\php.

    +   - Call the phpinfo() function in a PHP script (see the following section for
    more detail). The location appears in the output near the beginning with the label
    Configuration File (php.ini) Location.

    +   - On many Unix systems, the locate php.ini command returns all filenames that
    match php.ini.


    **NOTE** Many settings aren''t in the default php.ini file; PHP uses defaults
    for the values not specified. A listing of the default settings for PHP can be
    found at http://www.php.net/manual/en/ini.php.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# #8: Revealing All of PHP’s Settings


    PHP has many features, but not all may be enabled or built in your installation.

    If you want to see what your particular PHP installation has, a very simple

    script can show you everything. However, the danger with this script is that it

    shows _so much_ information that it practically hands a blueprint to potential

    crackers that says, "Here. These are the weak points. Please break into my

    system." Therefore, you should delete this script as soon as you’re finished

    with it.


    ```

    <?php

    phpinfo();

    ?>

    ```


    The phpinfo() function prints everything that PHP knows about its

    configuration. I do mean _everything_. Not only does it show you the status of

    every single available PHP setting, the location of the php.ini file, and your

    PHP version, but it also tells you what version of webserver software you’re

    running, what extensions are compiled with PHP, and what the server API is.

    It’s very useful for looking at configuration options and to be certain you’ve

    properly installed and enabled a needed feature.


    To run the script, visit the page with your web browser. Don’t forget to

    delete it when finished.


    # #9: Reading an Individual Setting


    Sometimes phpinfo()can be overkill if you know what you’re looking for.

    For example, you may just want to find out whether magic quotes is turned

    on or check an include path. Furthermore, phpinfo() won’t help you if

    you’re writing a script that behaves one way if a setting is enabled and

    another way if it’s not.


    To get the value of a particular configuration setting, use the ini_get()

    function as follows:


    ```

    <?php

    echo "The register_globals value is ". ini_get(''register_globals'');

    ?>

    ```


    Give ini_get() a valid configuration parameter name, and it returns the

    current setting on the current server. The setting is returned as a regular

    value, so you can print it, assign it to a variable, and so on. However, there

    are two small things that you should be aware of.'
  merge: -1
  img_proc: true
- pgno: 37
