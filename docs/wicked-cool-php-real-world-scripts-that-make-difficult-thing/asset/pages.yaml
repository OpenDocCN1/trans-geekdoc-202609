    Turning on error reporting causes PHP to print error messages to the

    screen before processing the rest of the program. (This makes it impossible

    to set cookies in the event of an error, so don''t plan on changing cookie

    values the first time you turn on error reporting.)


    # Common Error Messages


    The three most common error messages are worth understanding.


    ```

    Notice: Undefined variable: var in script.php on line n

    ```


    This message means that you are using a variable that you have not

    defined earlier in the script. This can happen in a variety of circumstances:


    +   • You misspelled a variable name.


    +   • You have a conditional that contains a variable definition, such as this:


    ```

    if ($fred == "I''m Fred") {

    $he_is_fred = "yes";

    }

    ```


    +   • You''re concatenating a variable without ever having explicitly declared
    it.


    The next problem is one you''re more likely to see in older PHP code

    that you''re trying to use in your program:


    ```

    Notice: Use of undefined constant k - assumed ''k'' in script.php on line n

    ```


    This warning message usually means that you''re passing a string to a

    function without encapsulating it in quotes. In other words, you''ve used

    something like strtolower(string) instead of strtolower("string").


    Finally, there is a common error message that you can get when

    accessing an array:


    ```

    Notice: Undefined index: i in script.php on line n

    ```


    In practical terms, this means that you tried to read $array[i], but $array

    was not defined at the index i. This error often pops up when you''re getting

    a value from a form via $_POST or $_GET, but there was no value stored in either'
