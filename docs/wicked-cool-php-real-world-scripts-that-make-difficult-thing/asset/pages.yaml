- pgno: 114
  md: "We need to determine what we want to call the file on the server. When doing\
    \ so, we want to ensure that there are no weird characters in the name and that\
    \ we won't be able to leave the target directory by adding a bunch of slashes\
    \ (/). You can do this in one shot with a regular expression that removes any\
    \ character you don't recognize. After you're finished, $newname contains the\
    \ new name for the uploaded file:\n\n```\n/* Delete any unwanted characters in\
    \ the target name. */\nif ($newname) {\n    $newname = preg_replace('/[^A-Za-z0-9_.-]/',\
    \ '', $newname);\n} else {\n    $newname = preg_replace('/[^A-Za-z0-9_.-]/', '',\
    \ $upfile_name);\n}\n```\n\nIt's time to start validating the parameters. First,\
    \ we check to see if the target subdirectory is in our valid list:\n\n```\n/*\
    \ Validate parameters. */\nif (!in_array($location, $target_dirs)) {\n    /* Invalid\
    \ location */\n    die(\"invalid target directory.\");\n} else {\n    $urlroot\
    \ .= \"/$location\";\n}\n```\n\nHere's a sanity check to make sure that PHP actually\
    \ uploaded a file:\n\n```\nif (!$upfile) {\n    /* No file */\n    die(\"no file\
    \ for upload.\");\n}\n```\n\nNow it's time to validate the data itself. We initialize\
    \ the file types that we want to accept and then use getimagesize() to get the\
    \ dimensions of the uploaded image and its type ($attr appears later in the script).\n\
    \n```\n/* Verify file type. */\n$file_types = array(\n    \"image/jpeg\"  => \"\
    jpg\",\n    \"image/pjpeg\" => \"jpg\",\n    \"image/gif\"   => \"gif\",\n   \
    \ \"image/png\"   => \"png\",\n);\n$width = null;\n$height = null;\n\n/* Extract\
    \ MIME type and size for the image. */\n$img_info = getimagesize($upfile);\n$upfile_type\
    \ = $img_info[\"mime\"];\nlist($width, $height, $t, $attr) = $img_info;\n```"
  merge: -1
  img_proc: true
- pgno: 115
  md: "Using the parameters just extracted, we make sure that the image is in an acceptable\
    \ format, figure out what its suffix should be, and ensure that it is not too\
    \ large:\n\n```\n/* Validate type. */\nif (!file_types[$ufile_type]) {\n    die(\"\
    image must be in JPEG, GIF, or PNG format.\");\n} else {\n    $file_suffix = $file_types[$ufile_type];\n\
    }\n/* Validate size. */\nif ($width > $max_width || $height > $max_height) {\n\
    \    die(\"size $width x $height exceeds maximum $max_width x $max_height.\");\n\
    }\n```\n\nEvery now and then, someone uploads a file with an incorrect suffix.\
    \ This isn't really that big of a deal, but it does mess up the MIME type when\
    \ the server sends it. Because we now know the correct suffix, we coerce that\
    \ suffix by chopping off any possible incorrect suffix and adding our own. Someone\
    \ may also mistype a suffix, and this step also corrects that by simply tacking\
    \ on the correct suffix. For example, foo.jpg might become foo.jpg.jpg. Although\
    \ you also could try to correct for that, you would find yourself second-guessing\
    \ users who really ought to learn how to type. After determining this final name\
    \ for the uploaded file, we assign its full pathname to $new_fullpath:\n\n```\n\
    /* Force file suffix. */\n$newname = preg_replace('/\\.(jpe?g|gif|png)$/i', \"\
    \");\n$newname .= $file_suffix;\n$new_fullpath = \"$root/$location/$newname\"\
    ;\n```\n\nNow that we have the final name, we can verify that the file does not\
    \ already exist when set to no-overwrite mode:\n\n```\nif ((!$overwrite_images)\
    \ && file_exists($new_fullpath)) {\n    die(\"file exists; will not overwrite.\"\
    );\n}\n```\n\nNow it's time to copy the file into its final location and make\
    \ sure the copy was successful:\n\n```\n/* Copy the file into final location.\
    \ */\nif (!copy($ufile, $new_fullpath)) {\n    die(\"copy failed.\");\n}\n```"
  merge: -1
  img_proc: true
- pgno: 116
  md: "If we've made it this far, then the upload was successful, and all we need\
    \ to do is print some HTML to give the user a link:\n\n```\n$image_url = \"$urlroot/$sname\"\
    ;\n\n/* Display status. */\nprint \"HTML for image:</strong><br><textarea cols=\\\
    \"80\\\" rows=\\\"4\\\">\";\nprint \"<img src=\\\"$image_url\\\" $attr alt=\\\"\
    $upfile_name\\\" border=\\\"0\\\"/>;\";\nprint \"</textarea><br>\";\nprint '<a\
    \ href=\"upload.html\">Upload another image?</a>';?>\n```\n\n# Using the Script\n\
    \nThis script requires that all target directories in $target_dirs be writeable\
    \ by PHP. In addition, you need the GD module, a PHP add-in that allows PHP to\
    \ analyze and create image files. Most servers have this installed by default,\
    \ but if yours does not, refer back to “#18: Adding Extensions to PHP” on page\
    \ 27. That’s it; all you need to do is point the browser at upload.html, and PHP\
    \ will do the rest.\n\n# What Can Go Wrong?\n\nAside from the usual permissions\
    \ problems, the biggest issue is security. As it stands, any schmo who has access\
    \ to this script’s URL can upload as many images as they like and possibly overwrite\
    \ yours. If this script is outside a firewall, you may want to combine this script\
    \ with a login function to prevent unauthorized access, as shown in “#63: A Simple\
    \ Login System” on page 116.\n\n# Hacking the Script\n\nYou can impose a cap on\
    \ the size of any given file by looking at the $_FILES['upfile']['size'] variable.\
    \ Just put in a line like this:\n\n```\nIf ($_FILES['upfile']['size'] > $max_size)\
    \ {\n\t$_fatal_error = \"This file is larger than $max_size bytes.\";\n}\n```\n\
    \nNOTE You may also want to have a look at “#13: Preventing Users from Uploading\
    \ Large Files” on page 25, which shows you how to set a global upload file size\
    \ limit.\n\n# #55: Reading a Comma-Separated File\n\nOne common programming task\
    \ is to transform data from Excel spreadsheets into some useful form, such as\
    \ HTML or rows in a MySQL table. If we all had to work in Excel (XLS) format,\
    \ then this would be a real problem. Fortunately, in both Excel and OpenOffice.org,\
    \ you can export an Excel"
