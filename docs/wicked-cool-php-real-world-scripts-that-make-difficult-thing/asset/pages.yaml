  md: "# Hacking the Script\n\nThis script can return negative values if the second\
    \ timestamp comes before the first. For example, if $timestamp_1 is from July\
    \ 7, 2008, and $timestamp_2 is July 1, 2008, the difference is returned as 6 days.\
    \ If all you care about is the total difference, then put in this bit of code\
    \ to replace the $time_lapse = $timestamp_2 - $timestamp1 segment:\n\n```\nif\
    \ ($timestamp2 > $timestamp1) {\n    $time_lapse = abs($timestamp2 - $timestamp1);\n\
    }\n```\n\nThis will always return a positive value (or, at worst, zero), no matter\
    \ what order the dates are in.\n\nNow that we've seen the details of PHP dates\
    \ and times, let's finish with a short discussion of MySQL dates and times.\n\n\
    # MySQL Date Formats\n\nMuch like PHP, MySQL 5 uses a form of timestamp, but in\
    \ its native form, it is not compatible with the PHP timestamp. MySQL has three\
    \ time/date field types: DATE (a date), TIME (a time), and DATETIME (a date and\
    \ a time). MySQL also has a special date field type called TIMESTAMP, which works\
    \ like DATETIME but automatically updates to the current timestamp with every\
    \ insert and update and has a different internal storage mechanism.\n\nThere are\
    \ numerical ways of representing data in your queries for these types, but it's\
    \ much easier to use a string in your SQL. For example, you can use 2008-09-26\
    \ as a date, 13:23:56 as a time, and 2008-09-26 13:23:56 as a date and time. To\
    \ convert a PHP timestamp in $timestamp into a form suitable for MySQL, use this\
    \ code:\n\n```\ndate('Y-m-d H:i:s', $timestamp)\n```\n\nAlthough you can store\
    \ PHP/Unix timestamps as INT(10), it really helps to use the native MySQL formats,\
    \ because you will be able to use the data independently of PHP. To get a PHP\
    \ timestamp from a SELECT query, use the SQL UNIX_TIMESTAMP() function, as in\
    \ this skeleton example:\n\n```\nSELECT UNIX_TIMESTAMP(my_date) FROM table;\n\
    ```\n\nMySQL 5 has a lot of very useful date functions, such as DATE_FORMAT and\
    \ DATE_ADD. For a complete list, check out the online documentation at http://www.mysql.com/."
  merge: -1
  img_proc: true
- pgno: 106
  md: '# # 7


    # # WORKING WITH FILES


    ![](img/19183d2b75bf6b509317c631c0e7b817_106_0.png)


    File manipulation is an important part of PHP programming. To accomplish your
    task, you may need to create text files on the fly, read tab-delimited files to
    import huge chunks of data, or perhaps even create cache files for speeding up
    your server and reducing processor overhead.


    # ## File Permissions


    In order to do any useful file operations, PHP needs permission to access files.
    On most webservers, PHP can read files easily enough, but it does not have the
    necessary permissions to create and alter files. This is a *good thing*, because
    universal file write access usually gives hackers carte blanche to do whatever
    they like with your server.


    On Unix servers, there are three sets of permissions for owner, group, and world.
    The user ID that owns the file is the *owner*, and every user on the system is
    *world* (we won’t discuss *group* in this book; set the group permissions to the
    permissions of world).'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Secure servers treat PHP as a very unprivileged user that does not have write
    access to anything on the system. You don’t want PHP to have any rights on the
    machine because external users influence at least part of what PHP does. If they
    find some way to compromise PHP, you don’t want that to carry over to the rest
    of your system.


    There are three basic ways to access a file, so there are three kinds of file
    permissions: read, write, and execute. They’re independent, so, for example, you
    can grant read and execute permission without granting write access.


    +   Read allows PHP to read a file, that is, examine its contents. For directories,
    read access gives permission to see the contents of the directory (but not necessarily
    access the contents; see Execute below).


    +   Write allows PHP to change the contents of the file, remove the file (delete
    it), and (in a directory) create a new file or subdirectory.


    +   Execute allows PHP to run programs. This is usually a bad idea, since it allows
    the server to run malicious programs. If you’ve set your server up properly for
    the Web, PHP scripts should run just fine without execute permission. Execute
    permission has a different meaning in directories; it allows for access to the
    files inside the directory (assuming you have read access to those files). Therefore,
    you often need to set execute permissions in conjunction with read access on directories.


    Most files are set to read by default for user, group, and world permission sets.
    In addition, the user normally has write access. Directories are the same, except
    they nearly always have execute permission set when the read permission set is
    set.


    If you want PHP to create new files (and you need to do so for several scripts
    in this book), you need to create a directory where PHP has write access.


    The most common way to set permissions is an absolute one, where you set the user,
    group, and world at once with a three-digit numeric code. For example, the code
    for user read/write, group read, world read is 644, with 6 for user, 4 for group,
    and 4 for world. Each digit is a bitfield. The most practical values are as follows:


    +   0: no permissions

    +   4: read permissions

    +   5: read/execute permissions

    +   6: read/write permissions

    +   7: read/write/execute permissions


    There are two primary ways to set permissions: with an FTP program and on the
    command line. Let’s look at both.


    # Permissions with an FTP Program


    Most FTP programs allow you to set permissions for files and directories. You
    can usually right-click the directory and look for an option such as CHMOD,'
  merge: -1
