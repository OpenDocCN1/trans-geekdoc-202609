  md: '# 11


    # USING cURL TO INTERACT WITH WEB SERVICES


    ![](img/19183d2b75bf6b509317c631c0e7b817_156_0.png)


    The Internet holds a lot of very useful data: UPS can tell you exactly how much
    it costs to ship a five-pound package from Baton Rouge, Louisiana, to Hartford,
    Connecticut. Authorize.net can tell you whether a customer has enough credit left
    on his debit card to buy a $60 book from your site. But in each case, you need
    to know how to ask for the information.


    In order to find the information, the first thing you need is the cURL PHP library
    to handle the connection between your webserver and other webservers. The idea
    is to make your scripts act like clients, similar to the way web browsers work.
    You can ask cURL to do anything from retrieving the HTML from a web page to directly
    accessing an XML-based web service. There are three basic ways to access data:


    +   - Download the site’s web page to pick through the HTML. Chapter 5 contained
    an example: “#41: Creating a Screen Scraper” on page 75.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '+   Post query parameters to a website, and pick through the results.


    +   Use an XML-based web service to access data, and use an XML parser to access
    the results. You’ll encounter several different access protocols, such as SOAP
    (Simple Object Access Protocol) and REST (REpresentational State Transfer; usually
    this is just a fancy term for sending POST or GET parameters). Don’t expect much
    consistency. Even two sites that provide the same type of data will probably have
    completely different output formats and access methods.


    You’ll also need a subset of the following libraries, depending on what you need
    to do:


    +   1. cURL (the library and the PHP extension). See “#18: Adding Extensions to
    PHP” on page 27 if you do not have the extension.


    +   2. OpenSSL for accessing secure sites.


    +   3. XML for parsing data from web services. Most PHP servers include this by
    default.


    # #68: Connecting to Other Websites


    To illustrate how the PHP cURL functions work, let’s look at how to make a connection
    to a web page and retrieve its data. First, create a cURL connection handle with
    the curl_init() function:


    ```

    $c = curl_init();

    ```


    Now use the curl_setopt() function to specify the connection settings. The most
    important setting is the target URL. Call the function as follows, with CURLOPT_URL
    as the option name and the last argument the desired URL:


    ```

    curl_setopt($c, CURLOPT_URL, "http://www.google.com/");

    ```


    By default, cURL enables certain features that are either not useful or get in
    the way of normal page processing. One of these features is including the HTTP
    header with the output. You can turn it off as follows:


    ```

    curl_setopt($c, CURLOPT_HEADER, false);

    ```


    Similarly, cURL automatically prints the accessed page instead of returning it
    as a string. You need a string if you intend to analyze the page somehow, so use
    the CURLOPT_RETURNTRANSFER option to say that you want the output as a string:


    ```

    curl_setopt($c, CURLOPT_RETURNTRANSFER, true);

    ```


    You’re now ready to access the page with the curl_exec() function:


    ```

    $page_data = curl_exec($c);

    ```'
