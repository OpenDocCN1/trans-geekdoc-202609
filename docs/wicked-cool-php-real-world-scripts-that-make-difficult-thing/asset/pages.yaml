    This function works for most casual client-access needs. From here on, we''ll
    illustrate how to satisfy the myriad extra requirements of some websites and services.


    # #69: Using Cookies


    If your application requires that you log in to a server that has cookie-based
    authentication, then you need to enable a cookie collection system in cURL. The
    idea is that when you access a page, cURL stores the cookies it receives in a
    file (called the _cookie jar_), and upon subsequent accesses, you want cURL to
    check that file for any cookies that it should send to the server.


    Typically, you need to add two configuration lines: the first to set the write
    location and the second to set the read location:


    ```

    curl_setopt(c, CURLOPT_COOKIEJAR, ''cookiejar'');

    curl_setopt(c, CURLOPT_COOKIEFILE, ''cookiejar'');

    ```


    Here, c is a cURL connection handle, and _cookiejar_ is a PHP-writable file.


    The biggest problem with this scheme is that it does not work with parallel connections;
    if you have more than one process using the same cookie jar, then they''ll all
    have the same session, trample each other, or worse. You can get around this by
    inserting the PHP process ID (use getmypid()) into the cookie jar filename. However,
    if you do so, make sure that you clean up by removing the cookie jar file when
    you''re finished, or you will have a really big collection of cookie jars on your
    hands that may confuse subsequent processes.


    # #70: Transforming XML into a Usable Form


    XML (eXtensible Markup Language) is one of the most popular products of the markup
    language fad. It''s designed to provide standard interchange formats for any kind
    of data. Though XML is bloated and tremendously inefficient, most web services
    now use XML in their output, and some services even require XML as input. Therefore,
    you likely will need to deal with it at some point.


    The best way to get started with XML is to parse a piece of it—that is, verify
    that the data is valid XML and examine the data. You''d think that with all of
    the hype that accompanied the introduction of XML, someone would have come up
    with an easy way to work with it. Unfortunately, for many years,'
