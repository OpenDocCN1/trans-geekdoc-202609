  md: "If strtotime() can't translate your request at all, it will return either false\
    \ (on PHP version 5.1 or later) or -1 (on earlier versions of PHP). The -1 result\
    \ in particular can be troubling, since it means that strtotime()'s failures will\
    \ often be read by the date-processing functions as December 31, 1969, also known\
    \ as one second before the epoch date.\n\n# Verifying Dates with strtotime()\n\
    \nYou can sometimes use strtotime() to verify that a date is within a valid date\
    \ range. For example, if you're allowing the user to input a date in the form\
    \ of 2008-01-01, you can verify that the date input is correct by using strtotime().\
    \ Of course, whether the date is valid is another thing. A user could input yesterday\
    \ and it would pass as true. If you're putting a date into a database, for instance,\
    \ you should use an additional layer of date checking to ensure that you get a\
    \ valid field. The following script checks a user-supplied date to see if it falls\
    \ in a valid range and then transforms it into a date format for your database:\n\
    \n```\n<?php\n$user_supplied_date = $_GET['date'];\n$user_timestamp = strtotime($user_supplied_date);\n\
    \n// Beginning/end of valid date range\n$start_date = strtotime('2008-01-01');\n\
    $end_date = strtotime('2009-01-01');\n\nif ($user_timestamp < $start_date ||\n\
    \    $user_timestamp >= $end_date) {\n    die('Date does not fall within the valid\
    \ range of dates');\n}\n\n$database_date = date('Y-m-d', $user_timestamp);\n//\
    \ Now use $database_date in a database query.\n\n?>\n```\n\nNOTE You'll see how\
    \ to use the date() formatting function later in this chapter.\n\n# Creating Timestamps\
    \ from Date Values\n\nIf you know the precise date and time you need, you can\
    \ create a timestamp with the mktime() function. To use the mktime() function,\
    \ you need the hour, the minute, the second, the number of the month, the day,\
    \ and the year of the timestamp you want to create.\n\nFor example:\n\n```\n$future_date\
    \ = mktime($hour, $minute, $second, $month, $day, $year);\n```"
