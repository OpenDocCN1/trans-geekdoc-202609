    # ## INTERMEDIATE PROJECTS


    ![](img/19183d2b75bf6b509317c631c0e7b817_170_0.png)


    This final chapter includes three sets of scripts that implement common features
    on many content-based websites: a voting system, an electronic card service, and
    a blog. These are all just starting points. Although they certainly work as presented,
    to use them in production, you will want to adapt them to your own needs and fit
    them to your security model.


    All of these projects use MySQL to store data. The table structure and queries
