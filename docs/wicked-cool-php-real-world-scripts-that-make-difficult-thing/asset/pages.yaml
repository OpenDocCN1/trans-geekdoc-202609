    # Hacking the Script


    You can go crazy with a script like this: categorize to your heart''s content,

    follow a few links, or whatever. However, one very useful exercise is figuring

    out how to break the original URL into its component pieces so that you can

    make local (relative) links into full URLs.


    # #42: Converting Plaintext into HTML-Ready Markup


    One annoying web aspect of programming is that HTML and plaintext

    aren''t compatible, yet they are frequently used interchangeably. People type

    things into text areas of forms in plaintext, but chances are pretty good you

    want to display them in HTML.


    Here''s an example of something that you might find on a form:


    ```

    Hey folks,


    I recently had my brain removed as a part of my therapy. I am fine,

    and I can now enjoy Pauly Shore movies with my friends.


    Sincerely,


    Fred

    ```


    Because there are no <BR /> or <P> tags in the markup for line breaks, it

    looks like this when pumped back into a web browser as HTML:


    ```

    Hey folks, I recently had my brain removed as a part of my therapy.

    I am fine, and I can now enjoy Pauly Shore movies with my friends.

    Sincerely, Fred

    ```


    Although blindly echoing whatever text the user gives you is a bad idea

    because you leave yourself open to XSS attacks, let''s ignore that for now (you

    can read more about how to get rid of this stuff in "#20: Preventing Basic XSS

    Attacks" on page 37) and assume that you trust the user.


    The simplest way to convert the newlines to HTML is with the nl2br()

    PHP function. Unfortunately, this method is rather inflexible because it

    translates every newline into a <br> tag. If you have HTML mixed in with the

    plaintext, it can start to look ugly. Take this sample HTML:


    ```

    <table>

    <tr><td>Hi, I''m a row in a table

    </td></tr>

    </table>

    ```'
