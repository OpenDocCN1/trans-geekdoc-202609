    \ = \"your_key_id\";\n$search->Request->SearchIndex = \"Music\";\n$search->Request->Keywords\
    \ = \"Merle Haggard\";\n```\n\nTo perform the search, run the client's itemSearch()\
    \ method:\n\n```\n$r = $client->itemSearch($search);\n```\n\nIf everything goes\
    \ well, the XML results appear in $r. You can access this object in much the same\
    \ way you would a SimpleXML instance:\n\n```\nforeach ($r->Items->Item as $item)\
    \ {\n    $attributes = $item->ItemAttributes;\n    if (is_array($attributes->Artist))\
    \ {\n        $artist = implode($attributes->Artist, \", \");\n    } else {\n \
    \       $artist = $attributes->Artist;\n    }\n    print \"artist: $artist; title:\
    \ $attributes->Title<br />\";\n}\n?>\n```\n\nThis is remarkably easy to use if\
    \ you happen to know how everything works. Unfortunately, most of the time, you\
    \ won't know how everything works. WSDL files often have no accompanying documentation.\
    \ So assuming that you know how to read WSDL or you have a browser, you can find\
    \ all of the methods available to the client, and you will know which parameters\
    \ the methods expect, but you won't know what the parameters do. Furthermore,\
    \ even though you will know what the responses from the methods will look like,\
    \ you won't even know exactly what it is the methods are supposed to do. Part\
    \ of the reason is that it's hard to be concrete about documentation when you\
    \ don't know which programming language or SOAP implementation you're dealing\
    \ with. Moreover, no one wants to document it.\n\nPerformance is another serious\
    \ issue. In the preceding example, PHP needs to fetch the WSDL file, parse its\
    \ XML, and then set up an entirely new class and instance based on the WSDL content.\
    \ This is exceptionally inefficient, especially considering that you normally\
    \ just need to send a few short parameters to a service. PHP does cache the WSDL\
    \ files that it sees (other languages may require you to generate and compile\
    \ code based on the WSDL, which isn't any better)."
