    # #66: Creating a CAPTCHA (Security) Image


    Because many examples in this book use cURL to connect to and interact with websites,
    you know how easy it is to automate interactions with websites. You also know
    that if you have a site feature that you want no one but a real human to work
    with, you need to protect it. Otherwise, you may (at the very least) find your
    site completely overrun by spam comments. One way around this problem is to dynamically
    draw an image containing text that a user must'
