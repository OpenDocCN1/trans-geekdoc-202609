- pgno: 79
  md: '# What Can Go Wrong?


    Three common problems can arise. First, as mentioned previously, you should always
    use the triple equals (===) instead of the double (==) in a comparison. The triple
    equals ensures that the values and the types of the terms are the same. This is
    important because you can get 0 as a valid position from strpos() and an empty
    string as a valid return value for strstr() and strrpos(), and both of these match
    False with ==.


    Second, these functions are case sensitive. Using strstr($string, ''Approved'')
    in the example above returns False. The case-insensitive versions of strpos(),
    strrpos(), and strstr() are stripos(), stripos, and stristr().


    Finally, remember that this checks for very simple substrings, not words. If you
    need to do something fancy, such as finding words that start with *approv*, including
    *approval* and *approved* but not *disapprove*, you need something more powerful:
    regular expressions. We’ll see how to use them in “#39: Regular Expressions” on
    page 69.


    # #37: Replacing Substrings


    Use the str_replace() function to perform a simple string replacement. Here’s
    how to replace *wabbit* with *duck* in a string taken from a cartoon:


    ```

    $string = "It''s wabbit season!";

    print(str_replace("wabbit", "duck", $string));

    ```


    Notice that str_replace() does not replace the substring in the original string.
    If you''d like to do that, reassign it to the original string:


    ```

    $string = str_replace("wabbit", "duck", $string);

    ```


    str_replace() has several extra features. To replace only the first n occurrences
    of a substring, add the number as a fourth parameter (this is especially handy
    for replacing just the first occurrence):


    ```

    str_replace("wabbit", "duck", $string, n);

    ```


    To delete all occurrences of a substring, just use an empty string as the replace
    argument:


    ```

    $string = str_replace("wabbit", "", $string);

    ```


    You can tell str_replace() to replace multiple substrings by placing them in an
    array:


    ```

    $ugly_words = array("hamburger", "bacon", "bucket o''grease");

    $string = str_replace($ugly_words, "Atkins-friendly foods", $string);

    ```'
