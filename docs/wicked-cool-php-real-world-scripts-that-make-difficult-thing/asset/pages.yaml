- pgno: 78
  md: "```\n```php\n$lowercase_words = array(\"of \", \"a \", \"the \", \"and \",\
    \ \"an \", \"or \");\n$string = ucwords(strtolower($string));\n$string = str_replace($uppercase_words,\
    \ $lowercase_words, $string);\n// Uppercase the first word.\nreturn ucfirst($string);\n\
    }\n?>\n```\n```\n\nFinally, if you’re working with names, ucwords(strtolower())\
    \ eradicates preexisting capitalizations, so a name such as McMurdo becomes Mcmurdo.\
    \ If it’s very important that you preserve these cases, but you still need to\
    \ compare strings in PHP, use strcasecmp(str1, str2), which ignores case when\
    \ comparing str1 and str2.\n\n# #36: Finding Substrings\n\nPHP has several functions\
    \ that find a substring in a string. Your choice depends on what you want to do\
    \ with the result. Here are three basic substring functions:\n\n+   * strpos()\
    \ finds the position of the substring’s first occurrence.\n+   * strrpos() finds\
    \ the position of the last occurrence of the substring. Use this function in conjunction\
    \ with substr() to extract everything past that point in the string.\n+   * strstr()\
    \ returns everything after the first occurrence of the substring.\n\nAll three\
    \ of these functions return False if the substring isn’t present. Because both\
    \ a position and a string can evaluate to False when used in a conditional, it’s\
    \ very important that you check the type of the return value, as shown in the\
    \ following script:\n\n```\n```php\n<?php\n$string = \"I approve of Senator Foghorn's\
    \ performance in the War on Buttermilk. My name is Ferrett Steinmetz, and I approved\
    \ this message.\";\n$search_term = \"approve\";\n// Does it appear in the string?\n\
    $pos = strpos($string, 'approve');\nif ($pos === False) {\n    print \"$term not\
    \ in string\\n\";\n} else {\n    print \"position: $pos\\n\";\n    print \"last\
    \ position: \" . strval(strrpos($string, $search_term)) . \"\\n\";\n    print\
    \ strstr($string, $search_term) . \"\\n\";\n    // Prints \"approve of Senator\
    \ Foghorn's ... \"\n    print substr($string, strpos($string, $search_term)) .\
    \ \"\\n\";\n    // Prints \"approved this message.\"\n}\n?>\n```\n```"
