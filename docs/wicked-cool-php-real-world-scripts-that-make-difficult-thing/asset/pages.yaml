  md: 'You can omit arguments from the right; in this case, mktime() uses the values
    from the current time. For example, mktime(12, 00, 0) creates a timestamp value
    of noon on the month, day, and year of today. You have to pass mktime() actual
    numbers, not strings with numbers in them. It may seem annoying, but mktime(''12'',
    ''05'', ''2008'') causes errors.


    **NOTE** If you''re creating a date with mktime(), it''s generally best to set
    a default hour of 12, just in case your server has an issue with time zones. For
    example, some servers are set to use UTC, but if PHP is set to use Eastern Standard
    Time, creating a timestamp for a date starting at midnight might not register
    as that date for another four hours.


    A common programmer''s trick is to use the date() (see "#47: Formatting Dates
    and Times" below) and strtotime() functions to get the current month or day for
    use in a mktime() statement.


    For example, this line of code uses the date() function to get the current month
    in 01-12 number format and then inserts it into the month position of the mktime()
    function:


    ```

    $first_of_this_month = mktime(0, 0, 0, intval(date("m")), 1);

    ```


    And this snippet of code uses the strtotime() function to get the next month in
    timestamp format and then converts that timestamp into both a 01–12 month number
    and a four-digit year for use in the mktime() function. (Note that we specifically
    use the year here in case of a December-to-January annual rollover, where December
    15''s next month would also be next year.)


    ```

    $next_month_timestamp = strtotime("+1 month");

    $first_of_next_month = mktime(0, 0, 0, intval(date("m",

    $next_month_timestamp)), 1, intval(date("Y", $next_month_timestamp)));

    ```


    Of course, the mktime() function isn''t enough sometimes, because we not only
    work with months and days, we work with weeks. That''s when we want strtotime().


    One final function that works well in conjunction with mktime() is checkdate(),
    which checks a month, a day, and year for a valid date. The return value of true
    or false indicates whether this is a date that exists on the calendar. For example,
    checkdate(12, 31, 2008) returns true, whereas checkdate(2, 31, 2008) returns false.


    Now that you''ve seen how to create and manipulate dates in PHP, let''s look at
    how to print them out.


    # #47: Formatting Dates and Times


