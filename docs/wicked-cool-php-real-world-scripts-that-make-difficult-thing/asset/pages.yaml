  md: '# 5


    # WORKING WITH TEXT AND HTML


    ![](img/19183d2b75bf6b509317c631c0e7b817_74_0.png)


    Learning how to find, transform, and delete words is a critical skill for any
    webmaster. Some of the functions in this chapter are fairly simple, but I''ll
    mention them just in case you haven''t seen them. The more complex functions utilize
    _regular expressions_, a powerful part of PHP that every webmaster needs to know.
    Let''s start with some of the more elementary string operations.


    # #34: Extracting Part of a String


    For my day job, I sell collectible cards (think baseball cards with a fantasy
    twist). One of the interesting things about collectible cards is that people frequently
    search for cards in plural form—for example, _Shivan Dragons_ instead of _Shivan
    Dragon_. This caused problems with our card lookup system because customer input
    of _Shivan Dragons_ would not return any rows from a'
