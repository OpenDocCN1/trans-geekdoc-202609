    \ use a combination of object- and array-access syntax:\n\n```\nprint $data->sins->sin[0];\n\
    ```\n\nThe output is gluttony; if you wanted to access the bad puns node, you'd\
    \ look at $data->sins->sin[1]. If you omit the array index ($data->sins->sin),\
    \ you'll get the first element of the array; this is handy if you know that there\
    \ is a single element.\n\nYou can look at a node's attributes using array indexes\
    \ as well, except this time the indexes are keys instead of numbers. For example,\
    \ to find out what type of sin bad puns is, use the following:\n\n```\nprint $data->sins->sin[1][\"\
