- pgno: 89
  md: "```\n[1] => Array (\n    [0] => a.php\n    [1] => 13\n    )\n)\n```\n\n# Extracting\
    \ All Matches\n\nTo extract all of the matches of a regular expression, use preg_match_all().\
    \ This function works just like preg_match(), but the match array has a different\
    \ structure, and the return value is the number of matches found. Let’s say that\
    \ you use $matches as the match array again with the same example as the grouping\
    \ in the previous section. Now $matches[0] corresponds to the first set of matches—$matches[0][0]\
    \ is the entire matching substring and $matches[0][1] is the string match inside\
    \ the grouping (a.php). And $matches[1] is an array of the same structure that\
    \ corresponds to the next match, so $matches[1][1] is b.php in our example.\n\n\
    This can get really ugly, especially if you add a PREG_OFFSET_CAPTURE parameter,\
    \ because that parameter replaces all of the strings in the match array with another\
    \ layer of arrays, just as it did with preg_match(). Again, remember print_r();\
    \ it can be invaluable here.\n\n# Replacing Substrings with Regular Expressions\n\
    \nThe preg_replace() function works much like preg_match(), but it also replaces\
    \ matched substrings and returns the result. Let’s start with a simple example,\
    \ where we want to see what happens if we use deb to replace any occurrence matching\
    \ /fr+ed/ in $s:\n\n```\nprint preg_replace('/fr+ed/', 'deb', $s);\n```\n\nThis\
    \ is great, but there’s more power to unlock. Let’s say that you want to use part\
    \ of the original string—instead of just deb, you want to keep the es from the\
    \ original string. In this case, fred becomes deb, freed becomes deeb, and so\
    \ on. To do this, group the relevant part of the regular expression, and then\
    \ use a backreference in the replacement. Here’s how to do it in this example:\n\
    \n```\nprint preg_replace('/fr(e)+d/', '$1b', $s);\n```\n\nThe grouping is done\
    \ with parentheses as before, and the backreference is the $1 in the replacement,\
    \ meaning the first group. If you have more than one group, use $2, $3, and so\
    \ on to reference them. The entire match is in $0.\n\n> **NOTE** You may see backreferences\
    \ with a backslash (\\0, \\1, \\2, and so on). This is older syntax with the same\
    \ meaning."
