    \ browser. Notice how extracting the version is much easier here:\n\n```\n} else\
    \ if (preg_match('/firefox/i', $agent)) {\n    $browser_info[\"name\"] = \"Firefox\"\
    ;\n    $agent = stristr($agent, \"Firefox\");\n    $agent = explode(\"/\", $agent);\n\
    \    $browser_info[\"version\"] = $agent[1];\n```\n\nSafari claims to use something\
    \ “like Gecko,” the Mozilla engine. However, because we use Gecko as a test for\
    \ the various versions of Mozilla, we need to check for Safari first:\n\n```\n\
    } else if (preg_match('/safari/i', $agent)) {\n    $browser_info[\"name\"] = \"\
    Safari\";\n    $agent = stristr($agent, \"Safari\");\n    $agent = explode(\"\
    /\", $agent);\n    $browser_info[\"version\"] = $agent[1];\n```\n\nNetscape Navigator,\
    \ of course, is a version of Mozilla:\n\n```\n} else if (preg_match('/netscape/i',\
    \ $agent)) {\n    $browser_info[\"name\"] = \"Netscape Navigator\";\n    $agent\
    \ = stristr($agent, \"Netscape\");\n```"
