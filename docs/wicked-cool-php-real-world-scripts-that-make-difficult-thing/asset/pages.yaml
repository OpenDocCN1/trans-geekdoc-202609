  md: "of the matches. Let's start with the preg_match() function, which looks for\
    \ a single match:\n\n```\n<?php\n$s = 'blah<a href=\"a.php\">blah</a><a href=\"\
    b.php\">blah</a>';\nif (preg_match('/<a\\s+[^>]*href=\"[^\"]+\"/i', $s, $matches))\
    \ {\n    print \"match: $matches[0]\";\n}\n?>\n```\n\nHere we're checking a string\
    \ against the regular expression from the previous section. preg_match() takes\
    \ at least two arguments: the expression and the search string. An additional\
    \ $matches argument tells preg_match() to put the first matching substring inside\
    \ a $matches array. In this case, only one element goes into this array, so we\
    \ can access it at $matches[0].\n\nContinuing with this example, what if you want\
    \ only the link in the match, not the characters that precede it? You can use\
    \ grouping in your regular expression to demarcate the part you want to see:\n\
    \n```\npreg_match('/<a\\s+[^>]*href=\"([^\"]+)\"/i', $s, $matches);\n```\n\nWe\
    \ indicate the grouping here with the parentheses around [^\"]+. Now if there\
    \ is a match, $matches[0] still contains the entire matching string, but $matches[1]\
    \ contains the match inside the first grouping (in this case, a.php). If there\
    \ were more groupings, they would be referenced with $matches[2], $matches[3],\
    \ and so on.\n\nAt this point, it might be prudent to remind you of the $print_r()\
    \ function, which prints the entire contents of an array. It can be really useful\
    \ when you're trying to figure out how your match array works, especially if you\
    \ want to find the character index of the matches as well, because the format\
    \ of the match array changes if you want to know that information. To get that\
    \ information, add a PREG_OFFSET_CAPTURE parameter:\n\n```\npreg_match('/<a\\\
    s+[^>]*href=\"([^\"]+)\"/i', $s, $matches, PREG_OFFSET_CAPTURE);\n```\n\nNow if\
    \ there's a match, $matches[0] and $matches[1] still contain the information for\
    \ the entire match and the groupings, but instead of strings, they are arrays.\
    \ The first element in one of these arrays is the match string; the second is\
    \ the index of the match. Here's the slightly compressed output of print_r($matches)\
    \ from our example:\n\n```\nArray (\n    [0] => Array (\n        [0] => <a href=\"\
    a.php\"\n        [1] => 4\n    )\n)\n```"
