- pgno: 174
  md: "# # Processing the Ballot\n\nThe role of vote_process.php is to add a vote\
    \ to the database if the vote is valid. Start by loading the database configuration\
    \ and making sure that the poll and answer parameters are numbers.\n\n```\n<?php\n\
    require_once(\"vote_config.php\");\n\n$poll = $_POST['poll'];\n$answer = $_POST['answer'];\n\
    if (!is_numeric($poll) || !is_numeric($answer)) {\n die(\"Invalid poll or answer\"\
    );\n}\n```\n\nWe can verify that the poll ID and answer are actually valid by\
    \ looking for rows that match them in the database. If they check out, a join\
    \ on the poll and answer tables with these keys will result in exactly one row.\
    \ However, it’s good enough just to see if there are no results to this query:\n\
    \n```\n/* Look up the poll and answer. */\n$sql = \"SELECT A.answer_ID\n FROM\
    \ poll P, answer A\n WHERE P.ID = A.ID\n AND P.ID = $poll\n AND A.answer_ID =\
    \ $answer\";\n\n$result = @mysql_query($sql, $db) or die (mysql_error());\nif\
    \ (mysql_num_rows($result) == 0) {\n die(\"Invalid poll or answer.\");\n}\n```\n\
    \nIf we’ve gotten this far, we can verify that the user has not already voted\
    \ and insert a vote row into the vote table if everything checks out:\n\n```\n\
    /* Check for prior votes. */\nif (!$_COOKIE[\"poll_voted_$poll\"]) {\n /* Insert\
    \ the vote. */\n $sql = \"INSERT INTO `vote` ( `answer_ID` , `ID`)\n VALUES ($answer,\
    \ $poll)\";\n $result = @mysql_query($sql, $db) or\n die (\"Couldn't insert: \"\
    . mysql_error());\n```\n\nIf we were successful at inserting the vote, we can\
    \ set the cookie that indicates that the user has already voted. This cookie will\
    \ expire in 30 days.\n\n```\n/* Mark the poll as voted. */\nsetcookie(\"poll_voted_$poll\"\
    , \"1\", time() + (60*60*24 * 30));\n}\n```"
