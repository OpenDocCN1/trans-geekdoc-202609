  md: "At this point, cURL accesses the page and returns the page data, which PHP\
    \ assigns to $page_data. Finally, clean up after the connection with curl_close():\n\
    \n```\ncurl_close($c);\n```\n\nThis is a good start; you can now access web data\
    \ via the GET method.\nBut what if you need to use the POST method to submit form\
    \ data? In this\ncase, you need to set more options with curl_setopt(). Let’s\
    \ build a function\ncalled retrieve_page() that can access pages with the GET\
    \ or POST methods.\n\nThe function takes two arguments: a URL to access and an\
    \ optional\narray of POST parameters (the array has parameter names as keys and\n\
    the parameter values as its values). If it doesn’t receive this second argument,\n\
    the function uses the GET method. The first part of the function builds a query\n\
    string from the parameter array in the form param1=value1&param2=value2[...],\n\
    much like it would appear in a GET query, except that it does not include\nthe\
    \ leading question mark. Fortunately, PHP has a built in http_build_query()\n\
    function to create a query string from an array, so all we really need to do is\n\
    verify the parameter array:\n\n```\nfunction retrieve_page($url, $post_parameters\
    \ = null) {\n/* Connects to a site using POST or GET; fetches data */\n$query_string\
    \ = null;\nif (!is_null($post_parameters)) {\n    if (!is_array($post_parameters))\
