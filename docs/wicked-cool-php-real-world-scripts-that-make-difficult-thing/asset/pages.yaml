    ```


    The mcrypt() function requires several pieces of information:


    +   The data to encrypted.


    +   The passphrase used to encrypt and unlock your data, also known as the key.


    +   The cipher used to encrypt the data, which is the specific algorithm used
    to encrypt the data. This script uses MCrypt_SERPENT-256, but you can choose from
    an array of fancy-sounding ciphers, including MCrypt_TWOFISH192, MCrypt_RC2, MCrypt_DES,
    and MCrypt_LOKI97.


    **NOTE** To find out which ciphers are available on your server, check out “#8:
    Revealing All of PHP’s Settings” on page 21, and then head to the “Mcrypt” section
    on the phpinfo() page. If Mcrypt is available, you will see two sections: “Supported
    Cipher” and “Supported Modes.” Use them, exactly as written, to encrypt your data.


    +   The mode used to encrypt the data. There are several modes you can use, including
    Electronic Codebook and Cipher Feedback. This script uses MCRYPT_MODE_CBC, Cipher
    Block Chaining.


    +   An initialization vector—also known as an IV, or a seed—an additional bit
    of binary data used to seed the encryption algorithm. That is, it’s something
    extra thrown in to make the algorithm harder to crack.


    +   The length of the string needed for the key and IV, which vary by cipher and
    block. Use the mcrypt_get_key_size() and mcrypt_get_block_size() functions to
    find the appropriate length; then trim the key value to the appropriate length
    with a handy substr() function. (If the key is shorter than the required value,
    don’t worry—Mcrypt pads it with zeros.)


    If someone steals both your data and your passphrase, they can just cycle through
    the ciphers until finding the one that works. Thus, we apply the additional security
    of using the md5() function on the key before we use it, so even having both data
    and passphrase won’t get the intruder what she wants.'
