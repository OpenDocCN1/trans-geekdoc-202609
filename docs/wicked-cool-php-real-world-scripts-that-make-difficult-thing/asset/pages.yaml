  md: 'Words added to the dictionary are temporary unless you save them. Once you''ve
    finished adding words, add this line to the end of your script:


    ```

    pspell_save_wordlist($dictionary);

    ```


    Next, use the pspell_config_personal() call as above in any other script, and
    your new dictionary is ready for use alongside the default dictionary.


    # What Can Go Wrong?


    Remember that pspell chokes on punctuation that isn''t normally found in words—commas,
    semicolons, colons, and so on. You should strive to remove these from your words
    before adding them to your custom dictionary.


    # #39: Regular Expressions


    Sooner or later, you''ll have to roll up your sleeves and learn about regular
    expressions, which are the most powerful tools available for matching text. Want
    to find all the words within angle brackets in order to strip HTML code out of
    a string? You''ll need regular expressions. Want to find any IP addresses in a
    string? Want to make sure a user-chosen password isn''t just a sequence of numbers
    (like 123456) or that it contains a mixture of uppercase and lowercase letters?
    Trying to sort through bad data in a database, and it turns out that your data
    entry people have listed a product''s condition as nearmint, near/mint, near mint,
    and near-mint? You can use regular expressions to do all of these tasks.


    However powerful regular expressions are, you should be aware that they can be
    difficult to read. For example, the following expression is cryptic unless you
    read it character by character:


    ```

    /^([1-9]|\*\?)(?\d{3})[?].[.- ]*\d{3}[.- ]*\d{4})$/

    ```


    It looks like garbage at first, but this regular expression matches a phone number
    in a string. That''s the trade-off of regexes; they do phenomenal things, but
    you have to build them character by character like the world''s largest house
    of cards; mess up one character, and your entire pattern falls apart.


    Let''s go through the basics of regular expressions.


    # Regular Expression Basics


    PHP has two kinds of regular expressions: POSIX Extended and Perl-Compatible.
    The POSIX Extended functions generally start with ereg and the Perl-Compatible
    with preg. There are minor syntax differences between the two and sometimes performance
    differences. The Perl-Compatible syntax is very popular, and we''ll use those
    functions in this book.'
