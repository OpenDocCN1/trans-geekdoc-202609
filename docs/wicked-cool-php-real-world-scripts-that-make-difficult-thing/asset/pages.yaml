- pgno: 216
  md: '# # WICKED COOL JAVA


    # Code Bits, Open-Source Libraries, and Project Ideas


    by BRIAN D. EUBANKS


    Wicked Cool Java contains 101 fun, interesting, and useful ways to get more out
    of Java. Full of example code and ideas for combining that code into useful projects,
    this book is perfect for hobbyists and professionals looking for tips and open
    source projects to enhance their code and make their jobs easier. Topics include
    converting a non-XML text structure into XML using a parser generator, experimenting
    with a Java simulator for the Cell Matrix, creating dynamic music and sound in
    Java, working with open source class libraries for scientific and mathematical
    applications, and much more.


    NOVEMBER 2005, 248 PP., $29.95 ($40.95 CDN)


    ISBN 978-1-59327-061-2


    ![](img/19183d2b75bf6b509317c631c0e7b817_216_0.png)


    # # RUBY BY EXAMPLE


    # Concepts and Code


    by KEVIN C. BAIRD


    There may be no better way to learn how to program than by dissecting real, representative
    examples written in your language of choice. Ruby by Example analyzes a series
    of Ruby scripts, examining how the code works, explaining the concepts it illustrates,
    and showing how to modify it to suit your needs. Baird''s examples demonstrate
    key features of the language (such as inheritance, encapsulation, higher-order
    functions, and recursion), while simultaneously solving difficult problems (such
    as validating XML, creating a bilingual program, and creating command-line interfaces).
    Each chapter builds upon the previous one, and each key concept is highlighted
    in the margin to make it easier for you to navigate through the book.


