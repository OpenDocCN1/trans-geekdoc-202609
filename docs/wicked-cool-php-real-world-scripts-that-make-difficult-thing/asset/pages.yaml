- pgno: 14
  md: '# INTRODUCTION


    ![](img/19183d2b75bf6b509317c631c0e7b817_14_0.png)


    This book is for the developer who has stumbled on to PHP and wants to know how
    to get things done. You should know the basics of programming, and chances are
    you’ve seen many online code samples. But you may be wondering why some examples
    are much more complicated than others when they do the same thing.


    Care has been taken to keep the examples in this book as simple as possible and
    to explain as much as possible about every piece of code. To keep client and server
    code confusion to a minimum, there isn’t much JavaScript here. Everyone’s impatient,
    so Chapter 1, “The FAQs of Life—The Scripts Every PHP Programmer Wants (or Needs)
    to Know,” contains quick solutions to everyone’s favorite little tasks and problems.
    After you calm down, take a look at Chapter 2, “Configuring PHP,” to find out
    how you should install and configure PHP—quite a large number of problems arise
    from misconfiguration. Continuing in this vein, Chapter 3, “PHP Security,” deals
    with keeping your scripts secure.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Chapter 4, “Working with Forms,” returns to basics—specifically, how to get
    user input from forms and other dynamic input sources. Chapter 5, “Working with
    Text and HTML,” shows how to process text and strings with a number of tools,
    including regular expressions. Chapter 6, “Working with Dates,” discusses how
    to work with times and dates in PHP and MySQL, and Chapter 7, “Working with Files,”
    deals with file manipulation.


    With these fundamentals covered, Chapter 8, “User and Session Tracking,” covers
    the details of session tracking and management. With multiple users on a complex
    website, it’s important to keep track of what each user is doing so that one user’s
    session doesn’t interfere with another’s.


    Chapter 9, “Working with Email,” and Chapter 10, “Working with Images,” cover
    email and image manipulation, respectively. These tasks are often ill-suited for
    webserver scripts, so the chapters describe relatively lightweight tasks that
    can add significant value to your site.


    In Chapter 11, “Using cURL to Interact with Web Services,” you’ll learn how to
    make your server interact with web services on other sites via XML.


    Finally, Chapter 12, “Intermediate Projects,” contains three fun little projects
    that can be incorporated into larger websites. These projects build on what you’ve
    learned elsewhere in the book.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# # 1


    # THE FAQs OF LIFE—THE SCRIPTS EVERY PHP PROGRAMMER WANTS (OR NEEDS) TO KNOW


    ![](img/19183d2b75bf6b509317c631c0e7b817_16_0.png)


    The scripts contained in this chapter answer several questions that clog PHP forums
    and discussion groups all over the world. They include the following:


    +   - How do I add Previous/Next links to my shopping cart?

    +   - Is there an easy way to make every other row in my table a different color?

    +   - I have a big array that I need to sort—help!

    +   - What''s the best templating system to make the same HTML enclose my data
    on every page?


    Although there are more complicated scripts later in this book, and many others
    that you may find more valuable, these scripts answer the questions that I see
    again and again. The only thing these beginning scripts have in common is that
    they''re either the things that everyone should know or the things that everyone
    wants to know. Hand this chapter to a beginning PHP programmer you love. She''ll
    thank you for it.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'NOTE If you''re not afraid to start rooting around on your webserver, Chapter
    2 will also help the beginning PHP scripter and can make life a lot easier for
    the midlevel PHP programmer. You might want to go there next.


    # #1: Including Another File as a Part of Your Script


    Most serious applications have a core library of variables and scripts that are
    used on almost every page. For example, if you''re writing a shopping cart that
    connects to a MySQL database, you could declare the MySQL login name and password
    on each page of your cart. But what if you need to change the password? Changing
    and uploading every file in your shopping cart could become a huge issue.


    Rather than declaring the password in each of your page scripts, you can store
    that name and password in a separate file. You can then include that file as a
    part of your script, and whatever variables you declare in that file will be declared
    in your script!


    Furthermore, you can store long scripts or functions in a separate file and include
    them only when you need them. For example, the function that gets real-time UPS
    shipping quotes is 24KB worth of XML processing goodness, but you use it only
    when someone chooses UPS as a shipping option. Why not store it in ups_ship_quotes.php
    and call it only when necessary?


    In fact, almost all heavy-duty PHP applications have a file called something like
    config.php, which declares the critical variables that every page needs to know,
    such as the MySQL name and password. Those same applications also store frequently
    used scripts in different directories. Programmers then mix and match, taking
    the check-to-see-if-a-user-is-logged-in script from one directory, including the
    get-the-relevant-data-from-the-database script from another directory, and writing
    a central script that screens the data based on whether the user is logged in
    or not.

    And here''s how to do it.


    ```

    <?php

    require_once("/path/to/file.php");

    ?>

    ```


    The file that you give to require_once() is now a part of your script, exactly
    as if you had cut and copied the contents of the file into your script. You can
    even include HTML files to create a crude templating system.


    No matter what you name the file, PHP tries to read it as if it were valid PHP.
    As with any PHP file, you need the <?php and ?> markers around the PHP code in
    your included file; otherwise, PHP simply prints the entire file (even if it''s
    a binary).'
  merge: -1
  img_proc: true
- pgno: 18
  md: "You can use require_once() just like any other statement, so feel free to embed\
    \ it into control structures.\n\n```\nif ($we_need_this_file === true) {\n   \
    \ require_once(\"needed_file.php\");\n}\n```\n\n# What Can Go Wrong?\n\nSeveral\
    \ things can go awry when you’re including a file.\n\n# The path to the script\
    \ is wrong.\n\nIf this happens, the script returns a fatal error and dies. If\
    \ you’d like to ensure that the script will run even if it can’t find an include\
    \ file, use include_once() instead of require_once().\n\n# The path to the script\
    \ is correct, but the script is in a forbidden directory.\n\nThis can happen if\
    \ you’ve configured the open_basedir setting to restrict the directories that\
    \ PHP can access. Web developers restrict access to important files and directories\
    \ for security purposes. We’ll show you how to change directory permissions in\
    \ “#16: Restricting the Files that PHP Can Access ” on page 26.\n\n# The include\
    \ file has a blank line or space before or after the code in the PHP script.\n\
    \nIf your script sets cookies or does anything else to create a nonstandard HTTP,\
    \ it must do so before sending any output to the browser. Remember, PHP prints\
    \ anything outside of its <?php and ?> markers in an include file. Therefore,\
    \ if you have a blank line before or after these markers, that line will be sent\
    \ to the browser just as if it was plain HTML, and once HTML is sent to the browser,\
    \ cookies cannot be set and sessions cannot be started. If you’re including a\
    \ script, make sure it has no whitespace outside the PHP tags. Be especially careful\
    \ of spaces after the ?> end marker, because you normally can’t see them when\
    \ editing.\n\n**NOTE** Cookies are used for tracking users and storing hidden\
    \ information. See Chapter 8 for more details.\n\n# The include file can be viewed\
    \ by non-PHP methods.\n\nYou can store PHP variables in any file regardless of\
    \ its filename, but if you don’t specifically configure Apache to make those files\
    \ unreadable, Apache can serve them up as plaintext to anyone who asks. Therefore,\
    \ anyone who knows the names of your include files can read everything in them\
    \ if you’re not careful.\n\nNeedless to say, storing your MySQL passwords and\
    \ master account names in a place where anyone with Internet Explorer can see\
    \ them is not considered good security practice."
  merge: -1
  img_proc: true
- pgno: 19
  md: "To tighten security, you can place include files outside the web directories\
    \ (preferably in a password-protected directory) so people can access the script\
    \ only through FTP. In fact, if you're dealing with sensitive information such\
    \ as credit card authorization data, you should feel obligated to do so.\n\nNOTE\
    \ We'll see how to validate a credit card number in “#30: Validating a Credit\
    \ Card” on page 52.\n\n# You're in include overload.\n\nI once purchased a shopping\
    \ cart program because it was written in PHP, and I planned to customize the scripts\
    \ to fit my business. Imagine my surprise when I found out that the central module\
    \ of the cart's script (where people added, deleted, and adjusted items) consisted\
    \ of 7 includes, 12 lines of actual code, and 3 Smarty templates. I opened one\
    \ of the included files, and it was—you guessed it—a series of three additional\
    \ includes.\n\nIncludes can make your code very compact. But take it from me:\
    \ If you're trying to decipher how a hyper-included script works, it's a living\
    \ hell. For the sake of other programmers and future generations, please don't\
    \ include a file without a comment that tells people what that included file does.\
    \ Thank you.\n\n# You're using unchecked variables as include filenames.\n\nAlthough\
    \ you can do something like include($file) to open the correct script depending\
    \ on what a user chooses, doing so may allow a hacker to include any file in the\
    \ site with a bit of tweaking or, depending on your server settings, a file on\
    \ his site, which then breaks into your server. In fact, a couple of PHP-based\
    \ worms rely on badly written scripts like this. Moreover, these types of scripts\
    \ are far more prone to strange bugs and are generally impossible to read.\n\n\
    If you must include a range of files with a variable, use a script like the one\
    \ shown in “#28: Making Sure a Response Is One of a Set of Given Values” on page\
    \ 51 to verify that the filenames are permissible, which prevents someone from\
    \ opening your root password file.\n\n# #2: Highlighting Alternate Row Colors\
    \ in a Table\n\nWhen you have lots of information presented in rows, such as topics\
    \ in a forum or line items in a shopping cart, individual rows are much easier\
    \ to read when every other row is a slightly different color. The first step is\
    \ to define colors for table rows in your style sheet.\n\n```\ntr.row1 {\n   \
    \ background-color: gray;\n}\n\ntr.row2 {\n    background-color: white;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 20
  md: "There are two style classes here for table row tags (<tr>), row1 and row2.\
    \ As with any CSS, you can place this inside a preexisting CSS file that your\
    \ document includes or enclose it within <style> </style> tags in your document\
    \ head.\n\nNow let's define a function that alternately returns these classes.\
    \ There's a little trick here—you pass an integer variable to this function by\
    \ reference. The function automatically updates this variable so that you can\
    \ make repeated calls without worrying about the current state of the table:\n\
    \n```\n```php\nfunction table_row_format(&$row_counter) {\n    // Returns row\
    \ class for a row\n    if ($row_counter & 1) {\n        $row_color = \"row2\"\
    ;\n    } else {\n        $row_color = \"row1\";\n    }\n    $row_counter++;\n\
    \    return $row_color;\n}\n```\n```\n\nNow let's see how to use this function.\
    \ First, let's set up an SQL query to some rows of data from the table described\
    \ in the appendix and start the table formatting:\n\n```\n```php\n$sql = \"SELECT\
    \ product_name FROM product_info\";\n$result = @mysql_query($sql, $db) or die;\n\
    \necho \"<table>\";\n```\n```\n\nThe rest is easy; we just need to initialize\
    \ the row state variable (here, $i), repeatedly call table_row_format($i) to get\
    \ the alternating row style classes, and then give each row the correct class\
    \ attribute. Finally, we close the table:\n\n```\n```php\n$i = 0;\nwhile($row\
    \ = mysql_fetch_array($result)) {\n    /* Print results. */\n    $row_class =\
    \ table_row_format($i);\n    echo \"<tr class=\\\"$row_class\\\\\"><td>$row[product_name]</td></tr>\"\
    ;\n}\necho \"</table>\";\n```\n```\n\nThe key to using the table_row_format()\
    \ function is understanding how it works. You always initialize an integer variable\
    \ for the state, but it doesn't matter what the value is, because table_row_format()\
    \ takes care of it for you.\n\n# # Hacking the Script\n\nThere are a million cheap\
    \ tricks you can do with the style sheet. For more details on CSS, consult the\
    \ online resource of your choice, or take a look at Cascading Style Sheets: The\
    \ Definitive Guide, 2nd Edition, by Eric Meyer (O'Reilly"
  merge: -1
  img_proc: true
- pgno: 21
  md: "Media, 2004). Perhaps more interestingly, you can easily convert this function\
    \ into an object-oriented table formatter. Instead of explicitly declaring a state\
    \ variable, you can make a class with a private variable to keep track of the\
    \ state. The constructor and destructor open and close the table tags, respectively.\
    \ Here's what the class looks like:\n\n```\n```php\nclass AltTable {\n  function\
    \ __construct() {\n    $this->state = 0;\n    print \"<table>\";\n  }\n  function\
    \ __destruct() {\n    print \"</table>\";\n  }\n  function print_row($row) {\n\
    \    if ($this->state & 1) {\n      $row_color = \"row2\";\n    } else {\n   \
    \   $row_color = \"row1\";\n    }\n    print \"<tr class=\\\"$row_color\\\">\"\
    ;\n    foreach ($row as $value) {\n      print \"<td>$value</td>\";\n    }\n \
    \   print \"</tr>\";\n    $this->state++;\n  }\n}\n```\n```\n\nAnd here's how\
    \ to use the class (assume that the query is the same as the preceding example):\n\
    \n```\n```php\n$mytable = new AltTable;\nwhile($row = mysql_fetch_row($result))\
    \ {\n  /* Print results. */\n  $mytable->print_row($row);\n}\nunset($mytable);\n\
    ```\n```\n\nAt first glance, you may think that this is great because it's a little\
    \ easier to use—you don't have to mess with a state variable, the print_row()\
    \ method can handle any number of columns, and you don't even have to write any\
    \ HTML to start and finish the table. This is certainly a great advantage if all\
    \ your tables look the same. However, this tidiness is at the cost of flexibility\
    \ and some efficiency. Sure, you can add methods and attributes to do some fancy\
    \ stuff such as add table headers, but you need to ask yourself if it's really\
    \ worth it."
  merge: -1
