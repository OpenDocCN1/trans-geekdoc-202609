- pgno: 145
  md: 'type in order to post a comment (or perform some other human-only action, such
    as voting or rating). If you get the correct text from the user, the user is probably
    human.


    This sort of test is named CAPTCHA, for *Completely Automated Public Turing Test
    to Tell Computers and Humans Apart*. It has two drawbacks. First, if you''re blind,
    you can''t read the text from the CAPTCHA image. Visually impaired people can
    use the Internet with the help of voice software to read the pages aloud, but
    this software can''t interpret images without the descriptive alt attribute. A
    CAPTCHA locks out these users.


    Furthermore, a CAPTCHA doesn''t always work. Spammers are always looking for ways
    around your roadblocks. One of the more creative ways is linking the CAPTCHA image
    to a spammer-owned porn site with a label of INPUT THIS PHRASE AND SEE NAKED PEOPLE!
    Then some lonely guy inputs the password, which is then passed back to your site.


    With these two shortcomings in mind, you should use CAPTCHAs sparingly and weigh
    them against alternatives such as the Akismet scanner. The CAPTCHA presented here
    is simple (see Figure 10-1 for a screenshot), but it is effective. To use it,
    your PHP must have the GD graphics library with Freetype support. To see if you
    have GD support, use phpinfo() as described in “#8: Revealing All of PHP’s Settings”
    on page 21. The output contains a section on GD with Freetype information if everything
    is okay. If the section is not there, rebuild PHP as described in “#18: Adding
    Extensions to PHP” on page 27.


    ![](img/19183d2b75bf6b509317c631c0e7b817_145_0.png)


    # Figure 10-1: A CAPTCHA interface


    You also need one or more fonts in the same directory as the script. It’s best
    to go with fonts that are at least halfway readable. There are two pieces to this
    system:


    +   1. The main part is a script that creates CAPTCHA images. These images have
    irregular backgrounds, with strange swaths of color and lines running both horizontally
    and vertically. Then the script picks a passphrase, stores it in the `$_SESSION[''tt_pass'']`
    variable, and draws each letter in the passphrase differently. Finally, it sends
    the image output.


    +   2. The second piece is a script to compare a CAPTCHA form’s input with the
    `$_SESSION[''tt_pass'']` variable. The script here is a simple demonstration,
    but because the image-generator script does most of the work, you won’t need to
    do much to make it fit your own needs.'
