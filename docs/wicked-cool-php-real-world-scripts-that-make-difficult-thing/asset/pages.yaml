  md: "Depending on how much you actually care, this may be all you need.\nHowever,\
    \ if you feel some pressing need to see if a user is coming from a\nproxy server,\
    \ the following code looks for a proxy server and checks for an\nunderlying client\
    \ IP address:\n\n```\n/* Look for proxy servers. */\nif ($_SERVER[\"HTTP_CLIENT_IP\"\
    ]) {\n    $proxy_ip = $_SERVER[\"HTTP_CLIENT_IP\"];\n} else if ($_SERVER[\"HTTP_X_FORWARDED_FOR\"\
    ]) {\n    $proxy_ip = $_SERVER[\"HTTP_X_FORWARDED_FOR\"];\n}\n```\n\nThe problem\
    \ with looking for clients behind proxy servers is that many\nusers employ a proxy\
    \ because they're behind a private network. An IP address\non a private network\
    \ is useless to you because it's not unique and provides no\ndemographic value.\
    \ In this case, it's better to use the original IP address. The\nfollowing code\
    \ looks for a valid IP address, and if the address is valid, it\ndetermines whether\
    \ it's on a private network. If the network is private, we\nuse the original IP\
    \ address:\n\n```\n/* Look for a real IP address underneath proxies. */\nif ($proxy_ip)\
    \ {\n    if (preg_match(\"/^([0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+)/\",\n        $proxy_ip,\
    \ $ip_list)) {\n        $private_ip = array(\n            '/^0\\./',\n       \
    \     '/^127\\.0\\.0\\.1/',\n            '/^192\\.168\\..*/',\n            '/^172\\\
    .16\\..*/',\n            '/^10\\..*/',\n            '/^224\\..*/',\n         \
    \   '/^240\\..*/',\n        );\n        $client_ip = preg_replace($private_ip,\
    \ $client_ip, $ip_list[1]);\n    }\n}\n```\n\nFinally, we return what we think\
    \ the IP address is:\n\n```\nreturn $client_ip;\n}\n```\n\nPHP stores the user\
    \ agent information in the $_SERVER['HTTP_USER_AGENT']\nvariable. Unfortunately,\
    \ this string is convoluted and does not follow a stan-\ndard. For example, here\
