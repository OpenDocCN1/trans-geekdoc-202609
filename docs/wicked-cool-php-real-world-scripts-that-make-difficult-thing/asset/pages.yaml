- pgno: 46
  md: 'you, looking through your server''s settings and guessing at the correct values
    needed to install this program. Type ./configure at the prompt.


    Some extensions require you to put additional flags after the configure command
    in order to get it to work properly. For example, the Mcrypt extension requires
    you to type ./configure --disable-nls --disable-posix-threads in order to guarantee
    compatibility with Apache. Since this is library-specific, look through the tutorials
    and README files to see if there are any specific configure flags you need to
    set for your package.


    +   6. Build and install the package. In Unix, make is a standard utility for
    compiling and installing a package. First, type make to compile the package. You''ll
    see the commands that build the package as they are run. Then, type make check
    to run any self-tests that come with the package (sometimes there are no tests,
    so don''t worry about those cases). Finally, type make install to install the
    extension. The install process appears onscreen. When it''s done, your extension
    will be installed.


    +   7. Create a phpinfo() script. Oh, you thought you were finished? Sorry, chief,
    but all you''ve done is to install the extension on your server. Now you have
    to actually reinstall PHP and tell it where the extension is and how to use it.


    phpinfo() (see "#8: Revealing All of PHP''s Settings" on page 21) gives you the
    full settings of your server. About a third of the way down on the first page
    of your phpinfo() script, you will find a section that says Configure Command.
    In it, there will be a cryptic list of things that looks something like this:


    ```

    `./configure'' ''--with-apxs=/usr/local/apache/bin/apxs'' ''--with-xml'' ''--enable-bcmath''
    ''--enable-calendar'' ''--enable-ftp'' ''--enable-magic-quotes'' ''--with-mysql''
    ''--enable-discard-path'' ''--with-pear'' ''--enable-sockets'' ''--enable-track-vars''
    ''--enable-versioning'' ''--with-zlib''`

    ```


    If you want to reinstall PHP as you currently have it, this would be the command
    you''d use—almost. First, remove the single quotes around the configure command
    to give you something like this:


    ```

    `./configure ''--with-apxs=/usr/local/apache/bin/apxs'' ''--with-xml'' --enable-bcmath
    ''--enable-calendar'' ''--enable-ftp'' ''--enable-magic-quotes'' ''--with-mysql''
    ''--enable-discard-path'' ''--with-pear'' ''--enable-sockets'' ''--enable-track-vars''
    ''--enable-versioning'' ''--with-zlib''`

    ```


    The purpose of this step is that when you add an extension such as GD, you don''t
    want to lose the existing extensions you already have installed. Copy this configure
    information into a text file, and then add appropriate --with statements to the
    end of it. For example, if you were adding Mcrypt to this server, you''d add --with-mcrypt
    to the end of it. Check the extension documentation to find the right --with parameter.'
