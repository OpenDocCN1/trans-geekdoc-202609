- pgno: 110
  md: "# Hacking the Script\n\nMany scripts process file data line by line instead\
    \ of saving it into one huge variable. This comes up fairly often, especially\
    \ when you're looking at lists of items generated by other programs. (\"#55: Reading\
    \ a Comma-Separated File\" on page 101 shows you an example of when you'd want\
    \ to examine each line individually.) To do this, just change the inside of the\
    \ loop, as in this example, which prints every line that matches bob.\n\n```\n\
    while ( ! feof($fd) ) {\n    $file_data = fgets($fd, 5000);\n    if (strstr($file_data,\
    \ 'bob') != FALSE) {\n        print $file_data;\n    }\n}\n```\n\nNotice how the\
    \ .= append operator from the original script changed to the = assignment operator\
    \ here. It's subtle but very important.\n\nDepending on how your server is configured,\
    \ you may be able to use fopen() to read data from a URL, such as this:\n\n```\n\
    $fr = fopen('http://www.yahoo.com', 'r');\n```\n\nHowever, if you're running your\
    \ own server, you should be very careful about allowing fopen() to access files\
    \ outside your website; some PHP-specific worms have used fopen() in very nasty\
    \ ways. Essentially, you have to be very careful about filenames—make sure that\
    \ the user doesn't have any say in the filenames that fopen() accesses! You can\
    \ shut down fopen() by setting allow_url_fopen to false, as shown in “Configuration\
    \ Settings and the php.ini File” on page 20. For a more powerful alternative,\
    \ use cURL to access websites, as shown in Chapter 11.\n\n# What Can Go Wrong?\n\
    \nThe most common error occurs when PHP does not have permission to read the file.\
    \ There are some files that PHP just shouldn't look at (password files, for example),\
    \ and you may get an error message if you try to open one of these. Check the\
    \ permissions, as shown in “File Permissions” on page 91.\n\nThis leads to discussion\
    \ of a bigger issue: never, ever allow a user to open a file before verifying\
    \ that the user has any business opening that file. Remember that you can't trust\
    \ what the user is going to send to you. If you base filenames too closely on\
    \ user data, it's entirely possible that a user could access any file on your\
    \ site. Essentially, you need rules that absolutely restrict directory access\
    \ for files on your site.\n\nYou should also verify data from files that users\
    \ attempt to upload. See “#54: Uploading Images to a Directory” on page 97 for\
    \ an example of how to verify file type, location, size, and more."
  merge: -1
