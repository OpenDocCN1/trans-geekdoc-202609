- pgno: 108
  md: "Set Permissions, or Properties. A dialog box should appear. If all else fails,\n\
    of course, read the documentation that comes with the FTP program.\n\nFor a directory,\
    \ you should normally set the permissions to 755 (as shown\nbelow), which is Unix\
    \ code for owner read/write/execute, group read/execute, world\nread/execute.\
    \ Set the properties, and click OK. For files, the mode should be\n644, which\
    \ is the same except without the execute bits.\n\n# The Command Line\n\nIf you\
    \ have access to a Unix shell prompt, you can use a much more direct\nmethod to\
    \ change the permissions of a directory so that the owner can write\nand everyone\
    \ else can read and execute. Just type the following:\n\n```\nchmod 755 directory\n\
    ```\n\n# What Can Go Wrong?\n\nAmong the several problems that could occur is\
    \ that your ISP could be run-\nning PHP as a different user than your login. In\
    \ this case, you may need to set\nworld write permissions, and your ISP may automatically\
    \ detect and disallow\nthis. If so, you’ll just have to settle for read access\
    \ to files, and there’s plenty\nyou can do with just that.\n\nKeep in mind that\
    \ giving write access to a directory potentially opens you\nto a number of security\
    \ problems. You should never let PHP run any files in a\nwritable directory—in\
    \ fact, you should keep that directory off-limits to the\nwebserver. If you’re\
    \ not careful about how your scripts name and access files,\nyou could be in for\
    \ a heap of trouble.\n\n# #50: Placing a File’s Contents into a Variable\n\nLet’s\
    \ say that you want to put all of the content of a text file into a variable so\n\
    that you can access it later. This is a good introduction to file access, because\n\
    it shows all of the basic steps. Here’s how you would place the contents of\n\
    file.txt into the $file_data variable:\n\n```\n<?php\n$file_data = '';\n\n$fd\
    \ = fopen('file.txt', 'r');\nif (!$fd) {\n    echo \"Error! Couldn't open the\
    \ file.\";\n    die;\n}\n\nwhile (! feof($fd)) {\n    $file_data .= fgets($fd,\
    \ 5000);\n```"
