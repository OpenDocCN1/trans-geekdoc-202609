- pgno: 124
  md: "This is a very simple example, but as you can see, it illustrates how sessions\
    \ can make your life a lot easier when you need to create a multipart form or\
    \ track other state information.\n\n# What Can Go Wrong?\n\nJust as you would\
    \ do when setting a cookie, you must place session_start() early in the script\
    \ before you send any data, so that the server can set up the session ID on the\
    \ client. Otherwise, the client won’t accept the session ID, and the server will\
    \ be unable to associate the client with a session.\n\n# #58: Checking to See\
    \ If a User’s Browser Accepts Cookies\n\nTo see if a browser accepts cookies,\
    \ you must check in two distinct steps, in two distinct web requests. The client’s\
    \ browser must make two requests because the browser sets a cookie only when it\
    \ gets a response from the first request.\n\nYou can serve both requests with\
    \ one script, but you have to be careful not to put the browser in an infinite\
    \ loop. The idea is to check for the cookie, and if the cookie is not set, you\
    \ must try to set it and reload the page. But you want to reload only once, so\
    \ you also have to tell the script that it is doing a reload to prevent it from\
    \ loading yet again if the cookie is not set.\n\nThis is a small script, but because\
    \ you run the risk of infinitely reloading pages, you have to be careful. The\
    \ first thing we do is check to see if the cookie we’re testing is already set.\
    \ If so, since the browser supports cookies, there’s nothing left to do:\n\n```\n\
    <?php\nif (isset($_COOKIE[\"test\"])) {\n    print \"Cookies enabled.\";\n```\n\
    \nIf this cookie does not exist, then there are two possible situations: First,\
    \ the browser may not accept cookies. However, we won’t know for sure until the\
    \ *second* time we load the page, and we need to know when the browser has reloaded\
    \ the page. To achieve this, we’ll set a GET parameter called testing on the second\
    \ access. If this parameter exists and the cookie doesn’t exist, then we know\
    \ that the browser isn’t sending cookies:\n\n```\n} else {\nif (isset($_REQUEST[\"\
    testing\"])) {\n    print \"Cookies disabled.\";\n```\n\nHowever, if the cookie\
    \ doesn’t exist and the testing parameter does not exist, then this is the first\
    \ time that the browser has accessed the page. Therefore, we want to set the cookie\
    \ and then reload the page, this time"
  merge: -1
  img_proc: true
- pgno: 125
  md: "setting the testing parameter to indicate that it's a second access. You'll\
    \ see how the location header works in the following section.\n\n```\n} else {\n\
    \    setcookie(\"test\", \"1\", 0, \"/\");\n    header(\"Location: $_SERVER[PHP_SELF]?testing=1\"\
    );\n}\n?>\n```\n\nIt's extremely important that you do not forget to include the\
    \ testing parameter. If you omit it, the page will reload infinitely if the browser\
    \ does not support cookies.\n\nThis script isn't terribly intuitive to read, because\
    \ the first pieces that the user encounters do not correspond to the first lines\
    \ of code. However, it is so small that you can easily understand it entirely,\
    \ and once you do that, you should have no problems with it.\n\n# #59: Redirecting\
    \ Users to Different Pages\n\nRedirecting users to new pages is a fact of life\
    \ when programming dynamic websites. The primary reason is that you often need\
    \ to redirect a user after making session state changes. For example, when you\
    \ add an item to a shopping cart, you want the user to go to a page such as the\
    \ current shopping cart, and you don't want to add another one of the same item\
    \ to the cart again if you reload that shopping cart page. Most sites achieve\
    \ this with a script that processes the state change and then redirects to the\
    \ page that they want the user to see.\n\nThere are essentially two ways to do\
    \ it. The first and preferred way is to use the HTTP Location header, like this:\n\
    \n```\n<\\?\nheader(\"Location: new_page.php\");\n\\?>\n```\n\nThe header() function\
    \ sends raw HTTP headers to the user's browser. Therefore, you need to do this\
    \ before sending any other output to the browser, just as you would when setting\
    \ a cookie.\n\nThere are two advantages to this method. First, it is instant,\
    \ and the intermediate script does not appear in a web browser's history. Second,\
    \ because it is HTTP based, it does not require a web browser to process; automatic\
    \ web crawlers and programs such as wget understand it.\n\nHowever, if you would\
    \ like to show an intermediate page to the user with a delay, you need to use\
    \ a different method that uses the HTML <meta> tag. It's pretty simple; to send\
    \ a user to a different page after displaying the current page for five seconds,\
    \ put the following in your HTML header:\n\n```\n<meta http-equiv=\"Refresh\"\
    \ content=\"5;URL= new_page.php\" />\n```"
  merge: -1
