- pgno: 61
  md: "with parameters when you put a script on the Web, because they might be trying\
    \ to discover an easier way to use your site (though they could be attempting\
    \ something altogether less beneficial).\nTo ensure that your server is safe,\
    \ you must verify all data that your scripts receive.\n\n# Verification Strategies\n\
    \nThere are two approaches to checking form data: blacklisting and whitelisting.\n\
    *Blacklisting* is the process of trying to filter out all bad data by assuming\
    \ that form submissions are valid and then explicitly seeking out bad data. In\
    \ general, this technique is ineffective and inefficient. For example, let’s say\
    \ that you’re trying to eliminate all “bad” characters from a string, such as\
    \ quotes. You might search for and replace quotation marks, but the problem is\
    \ that there will *always* be bad characters you didn’t think of of. In general,\
    \ blacklisting assumes that most of the data you receive is friendly.\nA better\
    \ assumption to make about form data you’re receiving is that it’s inherently\
    \ malicious; thus, you should filter your data in order to *accept* only valid\
    \ data submissions. This technique is called *whitelisting*. For example, if a\
    \ string should consist of only alphanumeric characters, then you can check it\
    \ against a regular expression that matches only an entire string of A-Za-z0-9.\
    \ Whitelisting may also include forcing data to a known range of values or changing\
    \ the type of a value. Here is an overview of a few specific tactics:\n\n+   •\
    \ If the value should be a number, use the `is_numeric()` function to verify the\
    \ value. You can force a value to an integer using the `intval()` function. If\
    \ the value should be an array, use `is_array()`.\n+   • If the value should be\
    \ a string, use `is_string()`. To force it, use `strval()`.\n+   • If the value\
    \ should be null, use `is_null()`.\n+   • If the value should be defined, use\
    \ `isset()`.\n\n# WHITELISTING INTEGERS\n\nHere’s a typical example of how you\
    \ might whitelist for a numeric value. If the data is not numeric, then you use\
    \ a default value of zero (of course, this assumes that zero is an acceptable\
    \ value):\n\n```\nif ( ! is_numeric($data) ) {\n    // Use a default of 0.\n \
    \   $data = 0;\n}\n```\n\nIn the case of integers, there is an alternative if\
    \ you know that all integer values are safe. Using `$data = intval($data);` forces\
    \ `$data` to its integral value. This technique is called *typecasting*."
