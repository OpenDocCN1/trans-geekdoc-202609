- pgno: 39
  md: '$_POST or $_GET under that name. In practical terms, it usually means that
    the user didn''t check the appropriate box or radio button (thus not giving it
    a value), or the variable wasn''t passed on in the URL in a GET request.


    You should disable this script error checking on your live site, because not only
    will users see it and bug you, but it will also interfere with cookies, meaning
    that you may have session-tracking problems.


    # #11: Suppressing All Error Messages


    Sometimes you may have a script that works fine, but PHP still insists on kicking
    up a fuss. In other instances, if something should go wrong, you don''t want your
    users to see an ugly error message (which reveals the sort of information hackers
    just love to see).


    Fortunately, you can suppress all error messages through a setting in your php.ini
    file:


    ```

    display_errors = Off

    ```


    You should use this setting in your production environment so that you don''t
    have to worry about the Internet at large seeing your PHP diagnostic messages.


    If you need to see these diagnostic messages to root out problems, use the following
    configuration setting to send the messages to the Apache log:


    ```

    log_errors = On

    ```


    If you like, you can even send the diagnostics to the syslog or a file by setting
    the error_log parameter to syslog or filename.


    Your development environment is another story; there, you want as many diagnostic
    messages as you can stand. With the display_errors configuration setting on, you
    can set the error_reporting parameter in php.ini to a bitfield of your choosing
    (see the example php.ini file that comes with PHP for more details). However,
    if one script is being a particular pain in your development environment, and
    you just want it to shut up, use this function call in your script as a stopgap
    measure:


    ```

    error_reporting(0);

    ```


    # #12: Extending the Run Time of a Script


    At one point, the company I work for changed its online shopping carts, forcing
    me to write a script to convert 250MB of stored product data from the old cart''s
    format into the new cart''s format. The script worked perfectly, but I was evaluating
    and transforming so much data that PHP kept timing out my program after 30 seconds,
    long before it had a chance to finish.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'That''s when I discovered a handy-dandy little extension that allowed me

    to get the job done. The following line, when added to the beginning of a

    script, allows the script to take up to 240 seconds to finish.


    ```

    ini_set(max_execution_time, "240");

    ```


    The max_execution_time configuration parameter controls the longest

    allowable time a script is allowed to run before it''s automatically shut down.

    Be careful of abusing this parameter. If your script can''t run in four minutes

    or less, you''re either working on a much larger database than most people

    ever will, your script is terribly inefficient, or you''re using the wrong pro-

    gramming language.


    # What Can Go Wrong?


    Your server could be running in safe mode, which disables the run-time

    alteration of max_execution_time.


    Also, double-check your code. Maybe you''ve got an infinite loop some-

    where, or maybe you''re running a loop inside a loop that does nothing.


    # #13: Preventing Users from Uploading Large Files


    If you want to keep your users from uploading 70GB MPEGs of the latest

    Star Wars movie, you can set a maximum file size when users are uploading

    files to your server. (For information on how to process uploaded files, see

    “#54: Uploading Images to a Directory” on page 97.)


    ```

    upload_max_filesize = 500K

    ```


    You can specify the maximum file size in one of three ways:


    +   • An integer (indicating the total number of bytes)

    +   • Using a number and an M to indicate megabytes, as in 2M (2 megabytes)

    +   • Using a number and a K to indicate kilobytes, as in 8K (8 kilobytes)


    In any case, your users will now be unable to upload anything greater

    than the size you set. The default is 2MB.


    # #14: Turning Off Registered Global Variables


    PHP has a legacy misfeature that makes it slightly easier to access GET and

    POST parameters. For example, if there is a POST parameter named myparm,

    PHP can automatically extract it and put it in a variable named $myparm.

    Unfortunately, this is a tremendous security risk, because you can set any

    global variable this way, and if you forget to initialize a variable, the user

    could manipulate vulnerable parts of your script.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'You can disable this feature by turning the register_globals variable to Off
    in your server''s php.ini file:


    ```

    register_globals = Off

    ```


    Fortunately, this feature is turned off on PHP versions 4.2 or higher. However,
    it''s such a problem that you should always double-check.


    # #15: Enabling Magic Quotes


    Magic Quotes is a handy utility used by server hosts to protect against SQL Injection
    Attacks (as shown in “#19: SQL Injection Attacks ” on page 35). The idea is that
    whenever a form passes a variable to a PHP script, Magic Quotes automatically
    escapes all single quotes, double quotes, and backslashes with a backslash, turning
    "Ferrett''s Book" into "Ferrett\''s Book".


    If you''re using MySQL, this isn''t an ideal solution—you should use the MySQL-tailored
    mysql_real_escape_string() function instead—but in a pinch, Magic Quotes will
    do. Here''s how to enable it in your php.ini file:


    ```

    magic_quotes_gpc = 1

    ```


    # What Can Go Wrong?


    If you don''t have Magic Quotes turned on, you''ll have to use the mysql_real_escape_string()
    function to ensure that the data is escaped. However, if you use this function
    on form data when Magic Quotes is also enabled, you''ll double the number of backslashes,
    turning "Ferrett''s Book" into \"Ferrett\\''s Book\". As you can see, it pays
    to be consistent, because the strings in your database tables can accumulate backslashes
    if you''re not careful.


    # #16: Restricting the Files that PHP Can Access


    If you''re worried about a malignat PHP script accessing system files (such as
    your password file), you can limit the directories that PHP has access to with
    the open_basedir setting. When open_basedir is enabled, PHP cannot open or otherwise
    manipulate any files outside of the defined directories. Here''s a php.ini example
    that limits access to /home/www:


    ```

    open_basedir = /home/www

    ```


    You can add access to multiple directories by separating them with a colon (:)
    for Unix or a semicolon (;) in Windows.


    > NOTE By default, PHP will allow access to the specified directory and all subdirectories
    below. If you''d like to limit this to only the files in the specified directory,
    add a slash to the end of the path; for example, /home/www/.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# What Can Go Wrong?


    If your users need to upload files, a temporary file directory stores these files
    until you process them with your scripts. Because this directory is traditionally
    far away from the rest of the PHP files, you must remember to add it to the open_basedir
    access list.


    # #17: Shutting Down Specific Functions


    Let’s say that you have decided that the exec() function, which allows a PHP script
    to run commands directly on the server, is too dangerous. You can disable PHP
    functions individually, locking out the security risks while allowing the rest
    to run just fine. Here’s an example of how to disable a number of functions in
    your php.ini file:


    ```

    disable_functions = system, exec, passthru, shell_exec, proc_open

    ```


    # #18: Adding Extensions to PHP


    If you’re a serious developer, eventually you’ll hit the limits of a stock PHP
    build. Although PHP has plenty of built-in capability, it does not have native
    encryption, graphics, a convenient way to access other web pages, or XML data
    access functions.


    The way PHP accomplishes these tasks is through a number of extensions that employ
    third-party libraries to do the hard work. Some of the handier extensions are
    as follows.


    # cURL


    cURL allows your PHP server to access other websites, sending and receiving information
    via a URL-like protocol. (You’ll most commonly use HTTP, which lets you talk to
    other web pages, and FTP, which allows you to upload and download files.) In practical
    terms, this means you can have your server imitate a web browser, go to other
    sites, and download their web pages into a variable of your choosing.


    cURL is a vital tool for any serious online shopping cart, because it allows you
    to approve credit card charges and get live shipping quotes for customers. You
    use cURL to connect and send transaction data to another company’s server. The
    server replies, telling you information such as whether the charge was approved
    or denied and why.


    # Mcrypt


    Ever need to encrypt something? Any sensitive information in cookies or sessions
    should be encrypted for security’s sake, and if you’re storing anything valuable
    like credit card numbers or other personal information, you definitely want to
    make sure that it can’t be accessed via a raw database dump. Thankfully, the Mcrypt
    library allows you to perform high-level encryption without knowing anything about
    encryption techniques! (I’ll show you how to use Mcrypt in “#23: Encrypting Data
    with Mcrypt” on page 41.)'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# # GD


    If you want to create graphics on demand or just get image information when you
    need it, GD is the library for you. GD allows you to work with JPEGs and GIF files,
    either creating them as you need them for things like charts, or altering them
    to create thumbnails of existing images.


    # ## MySQL


    A completely vanilla build of PHP doesn''t know how to access a database. Fortunately,
    since MySQL and PHP are like Zan and Jayna, most PHP-enabled webservers have the
    necessary MySQL libraries installed by default, so most people never know that
    the `mysql_connect()` function is part of an extension.


    Other PHP extensions include SOAP (which allows you to access web services), PDF,
    and Verisign Payment Pro. It may seem like a great idea to add every extension
    in existence to PHP, but remember that each extension you add can slow initialization
    time and add security holes. Furthermore, extensions that aren''t common often
    don''t have someone actively maintaining them, leaving you without an upgrade
    path.


    # ### Adding PHP Extensions


    Now that you know what''s available through extensions, let''s explore how to
    install them. The first step is to see if you already have what you''re looking
    for.


    # ### Checking to See If Extensions Are Already Loaded


    Many webservers have the more useful extensions installed by default, so before
    you go through the bother of installing an extension, first check to be certain
    you don''t have it already installed and loaded.


    The easiest way to check for extensions is run the `phpinfo()` function (described
    in "#8: Revealing All of PHP''s Settings" on page 21). Page through the output,
    searching for your library. For example, if MySQL is enabled, you''ll see a section
    like this:


    ```

    mysql


    MySQL Support => enabled


    ...

    ```


    If this doesn''t work out for you, or you think it''s a little slow, there are
    other things you can try.


    An extension adds new functions to PHP—for example, cURL adds functions such as
    `curl_init()` and `curl_setopt()`, Mcrypt adds `mcrypt_encrypt()` and `mcrypt_decrypt()`,
    and so on. But let''s say that Mcrypt _isn''t_ installed. In that case, PHP doesn''t
    know anything about `mcrypt_decrypt()`—it''s just an undefined function.'
  merge: -1
  img_proc: true
