  md: "request per second). Start by creating a SoapClient instance with the location\
    \ of the WSDL document:\n\n```\n<?php\n$client = new SoapClient(\"http://webservices.amazon.com/AWSECommerceService/\n\
    AWSECommerceService.wsdl\");\n?>\n```\n\nNow you need to set up an object for\
    \ the request you want to send. Set up an object called $search containing nodes\
