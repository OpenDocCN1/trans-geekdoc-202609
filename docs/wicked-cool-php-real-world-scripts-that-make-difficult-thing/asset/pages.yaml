  md: "accessing XML data was ruthlessly complicated; as a result, a myriad of parsing\
    \ systems appeared, such as DOM and SAX. If you've ever been confused by the 27,000\
    \ different XML extensions available in PHP, you now know why.\n\nThe good news\
    \ is that somewhere along the way, people realized that most of the time they\
    \ were just parsing the XML data into a tree composed of a bunch of nested arrays,\
    \ so that programmers could use normal data-access tools such as operators and\
    \ indexes. A new generation of parsers appeared to serve this purpose; PHP 5 includes\
    \ such an extension, called SimpleXML.\n\nHere's some sample XML to get us started\
    \ with SimpleXML:\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<preaching>\n\
    <sins>\n    <sin type=\"deadly\">gluttony</sin>\n    <sin type=\"minor\">bad puns</sin>\n\
    \    <sin type=\"required\">flatulence</sin>\n</sins>\n</preaching>\n```\n\nThis\
    \ XML contains nested nodes, data, and attributes, so it covers most of what you'll\
    \ ever encounter. To parse it with SimpleXML, load the data into a string and\
    \ create a SimpleXMLElement object from the string:\n\n```\n$xs = file_get_contents(\"\
    test.xml\");\n$data = new SimpleXMLElement($xs);\n```\n\n**NOTE** _You can use\
    \ simplexml_load_file() to create the object from a file instead of using this\
