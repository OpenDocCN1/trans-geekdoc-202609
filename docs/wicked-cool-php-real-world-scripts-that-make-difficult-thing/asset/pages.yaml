  md: "<br />s inserted randomly wherever there's whitespace) while ignoring existing\
    \ <p>s and <br />s. Consider the following code:\n\n```\nprint autop('A haiku\
    \ is five         <br />\nSyllables on other lines\nSeven in the middle ');\n\
    ```\n\nRunning this fragment results in this output:\n\n```\n<p>A haiku is five\
    \         </p>\n<p>Syllables on other lines<br />\nSeven in the middle\n</p>\n\
    ```\n\nThe autop() function has three basic phases: cleanup, replacement, and\
    \ tag stripping. Before detailing each phase, we need to look at the grouping\
    \ modifiers found throughout the function. In particular, what does (?:stuff)\
    \ mean in a regular expression?\n\nIt's a grouping that is identical to (stuff),\
    \ but the ?: tells the regular expression parser not to backreference this grouping.\
    \ That is, you want to know about the value inside the parentheses, but you want\
    \ to use features of grouping—pattern repetition on a grouping, options, and so\
    \ on. This makes it a lot easier to keep track of the groupings that you actually\
    \ do care about, especially if you have to insert a grouping after you've written\
    \ a lot of code that depends on a certain backreference. Consider this expression\
    \ from the autop() code:\n\n```\n!</(/?(?:table|ul|ol|li|pre|form|blockquote|h[1-6]))>!\n\
    ```\n\nThis means find any tag with either table, ul, ol, li, pre, form, blockquote,\
    \ or h1 through h6. But all Matthew Mullenweg cares about here is the grouping;\
    \ it allows him to specify many tags in a single regular expression.\n\nWithout\
    \ getting into a line-by-line script analysis, the workflow of autop() is as follows:\n\
    \n+   1. **Cleanup.** The autop() script replaces all instances of multiple <br>s\
    \ with newlines, changes any cross-platform newlines to work on Unix (Unix uses\
    \ a simple \\n, while Windows uses \\r\\n), and reduces any arbitrarily large\
    \ strings of newlines down to a pair of lines.\n+   \n+   2. **Replacement.**\
    \ autop() finds any newline, followed by text, followed by two newlines and replaces\
    \ the newlines with proper paragraph tags, as in <p>Stuff</p>.\n+   \n+   3. **Tag-stripping.**\
    \ autop() looks for any block-level HTML elements (such as numbered lists and\
    \ tables) that a <p> or <br> would screw up and removes those <p> and <br> tags."
