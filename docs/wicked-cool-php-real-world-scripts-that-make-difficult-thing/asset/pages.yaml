  md: 'The system requires two database tables. The first is named card_list and has
    this structure:


    ```

    CREATE TABLE `card_list` (

    `ID` INT NOT NULL AUTO_INCREMENT ,

    `description` MEDIUMTEXT NOT NULL ,

    `content` VARCHAR( 500 ) NOT NULL ,

    `category` VARCHAR(20) NOT NULL ,

    `width` INT NOT NULL ,

    `height` INT NOT NULL ,

    `thumbnail` VARCHAR(120),

    PRIMARY KEY ( `ID` )

    ) TYPE = MYISAM ;

    ```


    Each row is a card. Set the content field to the HTML of the card that you want
    to show—it can be an image tag, an embedded Flash file, or even plaintext. The
    thumbnail field is for a preview on the card choice page; it’s not required. Here
    is a simple example card:


    ```

    INSERT INTO card_list

    (description, content, category, width, height, thumbnail)

    VALUES

    ("birthday card 1", "<b>Happy Birthday!</b> (1)", "birthday",

    600, 300, NULL );

    ```


    The cards_sent table tracks sent cards. When you first implement the system, this
    table is empty:


    ```

    CREATE TABLE `cards_sent` (

    `sent_ID` INT NOT NULL AUTO_INCREMENT ,

    `sender_email` VARCHAR( 50 ) NOT NULL ,

    `sender_name` VARCHAR( 50 ) NOT NULL ,

    `recip_email` VARCHAR( 50 ) NOT NULL ,

    `recip_name` VARCHAR( 50 ) NOT NULL ,

    `message` MEDIUMTEXT NOT NULL ,

    `token` VARCHAR( 32) NOT NULL ,

    `ID` INT NOT NULL ,

    `notified` TINYINT NULL ,

    PRIMARY KEY ( `sent_ID` )

    ) TYPE = MYISAM ;

    ```


    Here is card_include.php, the script that configures the MySQL connection and
    contains a function named card_display():


    ```

    <?php

    $connection = @mysql_connect("localhost","db_login","db_password") or die(mysql_error()));

    $db = @mysql_select_db("wcphp", $connection) or die(mysql_error()));


    function display_card($card) {

    print ''<div style="height: '' . $card["height"] . '';'' .

    '' width: '' . $card["width"] . '';''"

    ```'
