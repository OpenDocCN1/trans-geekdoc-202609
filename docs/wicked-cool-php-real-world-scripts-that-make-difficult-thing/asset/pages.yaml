- pgno: 66
  md: "# #28: Making Sure a Response Is One of a Set of Given Values\n\nAs I told\
    \ you earlier, you can _never_ assume that the data passed on by a form is safe.\
    \ Let’s look at this simple form item:\n\n```\n<SELECT NAME=\"card_type\">\n<OPTION\
    \ value=\"visa\">Visa</OPTION>\n<OPTION value=\"amex\">American Express</OPTION>\n\
    <OPTION value=\"mastercard\">MasterCard</OPTION>\n</SELECT>\n```\n\nHow do you\
    \ ensure that the data you’re looking at is really Visa, American Express, or\
    \ MasterCard? Simple: You store the data in array keys and then look at the array\
    \ to make sure that there’s an exact match. Here’s an example:\n\n```\n<?php\n\
    $credit_cards = array(\n    \"amex\" => true,\n    \"visa\" => true,\n    \"mastercard\"\
    \ => true,\n);\n$card_type = $_POST[\"card_type\"];\nif ($credit_cards[$card_type])\
    \ {\n    print \"$card_type is a valid credit card.\";\n} else {\n    print \"\
    $card_type is not a valid credit card.\";\n}\n```\n\n# Hacking the Script\n\n\
    One advantage of this method of data storage is that you can temporarily disable\
    \ an item by changing its value to false. You can also alter the script slightly\
    \ to provide both verbose values and data values. For example, you may store American\
    \ Express cards in your database as _amex_, but when the name of the card is displayed\
    \ on the screen you want it to show up as _American Express_.\n\nIn that case,\
    \ you can use a map to remember what’s what by storing the database value as the\
    \ key in the array and the display name as the value. The following example demonstrates\
    \ that technique.\n\n```\n<?php\n$credit_cards = array(\n    \"amex\" => \"American\
    \ Express\",\n    \"visa\" => \"Visa\",\n    \"mastercard\" => \"MasterCard\"\
    ,\n);\n$card_type = $_POST[\"card_type\"];\nif (count($credit_cards[$card_type])\
    \ > 0) {\n    print \"Your payment type: $credit_cards[$card_type].\";\n} else\
    \ {\n    print \"Invalid card type.\";\n}\n```"
