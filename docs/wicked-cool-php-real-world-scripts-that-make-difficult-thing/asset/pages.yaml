  md: "The blog_index.php script starts off by checking for a category parameter.\
    \ If this parameter exists, the index should display only entries of that category.\
    \ To do so, create an SQL WHERE clause to limit the query that you will see very\
    \ soon, but make sure that you sanitize the input parameter first. If there is\
    \ no category, set its variables to empty strings.\n\n```\n<?php\nrequire_once(\"\
    blog_config.php\");\n\nif ($_REQUEST[\"category\"]) {\n  $category = mysql_escape_string($_REQUEST[\"\
    category\"]);\n  $where_clause = \"WHERE category = '$category'\";\n  $smarty->assign(\"\
    category\", $category);\n} else {\n  $where_clause = \"\";\n  $smarty->assign(\"\
    category\", \"\");\n}\n}\n```\n\nFormulate and run the SQL query as follows:\n\
    \n```\n$sql = \"SELECT title, category, teaser,\n             UNIX_TIMESTAMP(entry_time)\
    \ AS entry_time, ID\n             FROM blog_entries\n             $where_clause\n\
    \             ORDER BY entry_time DESC\n             LIMIT 0, 20\";\n$result =\
    \ @mysql_query($sql, $connection) or die (mysql_error());\nif (mysql_num_rows($result)\
    \ == 0) {\n  die('No entries in this blog.');\n}\n```\n\nAssuming that the query\
    \ was successful, you can go straight to building the array that you're going\
    \ to assign to the $blog_items Smarty variable:\n\n```\n$items = array();\nwhile\
    \ ($row = mysql_fetch_array($result)) {\n  $items[] = array(\n  \"ID\"       =>\
    \ $row[\"ID\"],\n  \"date\"     => date(\"F dS Y, h:ia\", $row['entry_time']),\n\
    \  \"title\"    => $row['title'],\n  \"teaser\"   => $row[\"teaser\"],\n  \"category\"\
    \ => $row[\"category\"],\n  \"category_parm\" => urlencode($row[\"category\"]),\n\
    \  );\n}\n$smarty->assign(\"blog_items\", $items);\n```"
