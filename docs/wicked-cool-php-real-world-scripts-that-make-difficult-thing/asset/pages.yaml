  md: "Now load the image into memory based on the file extension. The GD imagecreatefromformat()\
    \ functions return an image resource handle. One thing you'll notice right away\
    \ is that there is no error checking here, primarily because `mkthumb()` assumes\
    \ that you've taken care of the prerequisites. If you need error checking, check\
    \ `$src_image` afterward to see if it exists.\n\n```\n```php\nif (preg_match('/\\\
    .gif$/i', $filename)) {\n    $src_image = imagecreatefromgif($filename);\n} else\
    \ if (preg_match('/\\.png$/i', $filename)) {\n    $src_image = imagecreatefrompng($filename);\n\
    } else {\n    /* Assume JPEG by default. */\n    $src_image = imagecreatefromjpeg($filename);\n\
    }\n```\n```\n\nNow extract the pixel width and height from the image with the\
    \ `imagesx()` and `imagesy()` functions:\n\n```\n```php\n$width = imagesx($src_image);\n\
    $height = imagesy($src_image);\n```\n```\n\nYou resize the image only when the\
    \ original image is larger than the maximum thumbnail dimensions, so check to\
    \ see if this is the case:\n\n```\n```php\nif (( $height > $thumb_height ) ||\
    \ ( $width > $thumb_width )) {\n```\n```\n\nWhen resizing an image, you need to\
    \ know the final image dimensions in pixels. You can't use the maximum thumbnail\
    \ height and width, because the original image is probably not square. If you\
    \ try to shoehorn a non-square rectangle into a square, you will end up with a\
    \ distorted image. To solve this problem, find the longest side of the original\
    \ image, and then create a scaling ratio based on the ratio between length of\
    \ the longest side and the length of the thumbnail side:\n\n```\n```php\n/* Create\
    \ a thumbnail. */\nif ($width > $height) {\n    $ratio = $thumb_width / $width;\n\
    } else {\n    $ratio = $thumb_height / $height;\n}\n```\n```\n\n**WARNING** The\
    \ reason the maximum thumbnail dimensions are square in this function is that\
    \ the preceding logic errs for general rectangles. If you try to put a `200 ×\
    \ 400` image into a `100 × 400` thumbnail profile, `$ratio` is `1`, and you end\
    \ up with a `200 × 400` thumbnail (see the following code). That size is larger\
    \ than the desired maximum thumbnail size. Fixing this problem is not difficult,\
    \ but it is left as an exercise to the reader."
