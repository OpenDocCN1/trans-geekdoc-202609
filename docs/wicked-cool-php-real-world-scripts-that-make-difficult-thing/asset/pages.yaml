- pgno: 117
  md: "file into CSV (comma-separated value) format. CSV format is a fancy way to\
    \ say that it's a text file with one line per data row, with commas between the\
    \ fields in the row. It looks like this:\n\n```\n\"Airport\", \"City\", \"Activity\"\
    \n\"LON\", \"London\", \"Museums\"\n\"PAR\", \"Paris\", \"Dining\"\n\"SLC\", \"\
    Salt Lake City\", \"Skiing\"\n```\n\nAlthough you may think that this is just\
    \ a matter of grabbing lines and splitting them using a comma as a delimiter,\
    \ you have to worry about quotes, backslashes, and other minor details of the\
    \ format. However, most languages have a built-in to deal with this stuff, and\
    \ PHP is no exception. Processing CSV files is a breeze with the built-in fgetcsv()\
    \ function. It works just like fgets(), except that it returns an array containing\
    \ the current line's row values instead of a string. Here's a very simple script\
    \ to process an uploaded CSV file from the csvfile field in a form:\n\n```\n<table>\n\
    <tr>\n<th>Field 1</th>\n<th>Field 2</th>\n<th>Field 3</th>\n</tr>\n<?php\n\n$fn\
    \ = $_FILES[\"csvfile\"][\"tmp_name\"];\n\n$fd = fopen($fn, \"r\");\n\nwhile (!feof($fd))\
    \ {\n    $fields = fgetcsv($fd);\n    print \"<tr>\";\n    print \"<td>$fields[0]</td><td>$fields[1]</td><td>$fields[2]</td>\"\
    ;\n    print \"</tr>\";\n}\nfclose($fd);\n?>\n</table>\n```\n\nAs you can see,\
    \ this script prints the first three columns of the CSV file in HTML table format.\n\
    \nSometimes you'll get a tab-delimited file instead of a CSV file. To read one\
    \ of those, just change the line with fgetcsv() to something like this:\n\n```\n\
    $fields = fgetcsv($fd, 0, \"\\t\");\n```\n\nThe third parameter is the delimiter;\
    \ be sure to use double quotes with \\t. That second parameter is the maximum\
    \ length of line in the CSV file. Set it to 0 if you don't want a length limit."
  merge: -1
  img_proc: true
- pgno: 118
  md: '# # 8


    # USER AND SESSION TRACKING


    ![](img/19183d2b75bf6b509317c631c0e7b817_118_0.png)


    The World Wide Web''s initial design was little more than a series of static pages
    and media. The design made it easy to publish and navigate pages, but the Web
    truly became useful when sites began to offer dynamic content. Much of this content
    is specific to a session—a shopping cart, for instance, is session data; it is
    generally unique to one browser (or user).


    The tools and techniques for tracking web sessions are afterthoughts and hacks—ones
    that happen to do a somewhat reasonable job. Sometimes things get messed up, and
    you must be careful about security (as ever), but PHP can remove some of the complexity
    for you.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# # Using Cookies and Sessions to Track User Data


    To find out what a specific user is doing on your site, you need to store information
    about that user, such as the username, password, time between visits, preferences,
    and so on. In web programming, two popular techniques for this are cookies and
    sessions.


    # ## Cookies


    *Cookies* are small pieces of data that you store on the user’s computer. When
    the user accesses more than one page on your site, the user’s browser sends any
    valid cookies on those accesses back to your server. Because storing any kind
    of data on a user’s computer without her knowledge is a potential security risk,
    you don’t have direct control over how to store cookies. There are certain rules
    that the browser (and user) sets up, and if you follow the rules, the browser
    will accept your cookies and will send them back under the correct circumstances.
    An accepted cookie is said to be *set*.


    # ### Advantages


    +   - Cookies can store information for years.

    +   - Cookies work well with the kind of distributed, load-balanced webservers
    necessary for high-traffic sites, because all of the data is on the user’s computer.


    # ### Disadvantages


    +   - You need to be careful to follow the rules or lots of browsers will not
    accept your cookies, and they won’t tell you of that refusal.

    +   - Cookies are limited in size (it’s generally best not to exceed 512Kb).

    +   - Users can easily delete the cookies if they want to.

    +   - Cookies are generally specific to one user on one computer. If a user switches
    to another computer, he generally will not use any of the old cookies.


    # ## Sessions


    *Sessions* consist of a unique session ID and some sort of storage mechanism on
    your server. Because the data is on your server, the user doesn’t get a chance
    to manipulate it.


    # ### Advantages


    +   - Even though most sessions work by setting the session ID in a cookie, PHP
    and other web programming systems have ways to make sessions work without cookies.
    Therefore, this method almost always works.

    +   - You can store as much session data as you like.

    +   - Users cannot typically view or edit session data, and if they do, you have
    control over that editing process.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Disadvantages


    +   - Sessions are normally specific to one browser window or one browser process.
    When you close that window, unless you store the session ID as a persistent cookie,
    the user won’t get the old data back. However, with a login system, you can associate
    a session ID with a username.

    +   - Out of the box on PHP, sessions are server specific. If you have a sales
    server and a content server, the sales server won’t see any session data from
    the content server. You can customize the session storage system to solve this
    problem.

    +   - Because the session ID is data that a user reads and sends, unless you take
    precautions, it’s possible for snoopers to get access to sessions.


    In abstract terms, you can think of sessions as enhanced cookies. There’s still
    certain data (such as the session ID) that the user’s computer gets in some way,
    but the real data is always on your server. There are many different implementations
    of session technology, but the basic idea is always the same. Remember, though,
    if there’s some data that you don’t want users to read or modify, you should put
    it in a session, not a cookie. You need to do the same verification process for
    cookies that you would for any form data, because it comes from the client and
    therefore is easy to fabricate.


    # #56: Creating a “Welcome Back, Username!” Message with Cookies


    One cheap parlor trick that many websites employ is displaying “Welcome back”
    to returning users. If you tell the site your name, it can greet you by name.


    To illustrate one way to do this, here is a script that can store user information
    in a cookie and display the cookie if available:


    ```

    ```php

    <?php

    if (isset($_REQUEST["user_name"])) {

    setcookie("stored_user_name", $_REQUEST["user_name"], time() + 604800, "/");

    $_COOKIE["stored_user_name"] = $_REQUEST["user_name"];

    }

    if (isset($_COOKIE["stored_user_name"])) {

    $user = $_COOKIE["stored_user_name"];

    print "Welcome back, <b><?=$user?></b>";

    } else {

    ?>

    <form method="post">

    User name: <input type="text" name="user_name" />

    </form>

    <?php

    }

    ```

    ```'
