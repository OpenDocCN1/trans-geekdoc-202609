- pgno: 27
  md: "# #5: Turning an Array into a Nonarray Variable That Can Be Restored Later\n\
    \nAlthough arrays are tremendously useful, there are some places where they’re\
    \ just not welcome. You can’t directly store an array inside a cookie or a session,\
    \ for instance. MySQL and XML can’t handle the native PHP array type, either.\n\
    \nFortunately, there’s a way to transform PHP arrays into strings that you can\
    \ store nearly anywhere: the serialize() function. Here’s a script that illustrates\
    \ how this function works (assume $alacarte is the same as it was in the preceding\
    \ section):\n\n```\n<?php\n$menu = array(\n \"appetizer\" => \"fruit\",\n \"entree\"\
    \ => \"roast beef\",\n \"dessert\" => $alacarte);\n$menu_s = serialize($menu);\n\
    echo $menu_s;\n?>\n```\n\nRunning this script produces the following output:\n\
    \n```\nPEa:3:{s:9:\"appetizer\";s:5:\"fruit\";s:6:\"entree\";s:10:\"roast beef\"\
    ;s:7:\"dessert\";a:3:{i:0;s:19:\"chocolate ice cream\";i:1;s:15:\"vanilla pudding\"\
    ;i:2;s:15:\"snozzberry whip\";}}\n```\n\nYou can store this value nearly anywhere—in\
    \ cookies, databases, hidden POST input fields, and so on. When you need to restore\
    \ the serialized array to a real array, use deserialize(), as follows:\n\n```\n\
    $menu = deserialize($menu_s);\n```\n\n# What Can Go Wrong?\n\nserialize() is a\
    \ wonderful function, but there are a couple of things you should know. First,\
    \ people can read serialized arrays fairly easily, so if you’re storing sensitive\
    \ arrays in cookies or sessions, you probably want to encrypt them first so that\
    \ intruders can’t sniff your data. (See \"#23: Encrypting Data with Mcrypt\" on\
    \ page 41.)\n\nDon’t abuse this function. If you find yourself consistently storing\
    \ arrays in databases, or if you start getting serialized strings, you should\
    \ probably redesign your database structure or storage mechanism."
  merge: -1
  img_proc: true
- pgno: 28
  md: "Finally, you should avoid passing serialized arrays along with the HTTP GET\
    \ method, because URLs have a fairly short finite length.\n\n# #6: Sorting Multidimensional\
    \ Arrays\n\nOne perennial programming task is to sort complicated arrays. For\
    \ example, let's say that you have this array:\n\n```\n$items = array(\n array(\"\
    name\" => \"Mojo Nixon\", \"price\" => 19.96, \"quantity\" => 2),\n array(\"name\"\
    \ => \"ABBA\", \"price\" => 14.99, \"quantity\" => 1),\n array(\"name\" => \"\
    Iced Earth\", \"price\" => 12.96, \"quantity\" => 4),\n);\n```\n\nYour goal is\
    \ to sort this by the name key in each subarray. PHP, like many other scripting\
    \ languages, has a sort function named usort() that sorts by a user-defined comparison\
    \ function. In other words, you can sort an array by any criteria you like, and\
    \ you don’t need to fuss with the mechanics of sorting algorithms. The name-based\
    \ sorting script with usort() boils down to this:\n\n```\nfunction name_cmp($a,\
    \ $b) {\n return strcasecmp($a[\"name\"], $b[\"name\"]);\n}\n\nusort($items, \"\
    name_cmp\");\n```\n\nIf this script looks simple, that’s because it is. The user-defined\
    \ comparison function is called name_cmp. usort() and uses the comparison function\
    \ to compare two elements. Those elements are the arguments (here, $a and $b).\
    \ All you need to do in your comparison function is figure out how $a relates\
    \ to $b:\n\n+   - If $a is less than $b, it should return -1.\n+   - If $a is\
    \ equal to $b, it should return 0.\n+   - If $a is greater than $b, it should\
    \ return 1.\n\nBecause $a and $b are arrays in our comparison function, and we’re\
    \ interested in the values under the name keys in these arrays, we want to compare\
    \ $a[\"name\"] and $b[\"name\"]. This is easy enough to do with a bunch of if/then\
    \ statements, but because these are strings, you should use the strcasecmp() built-in\
    \ function for speed, clarity, and bug avoidance.\n\n**NOTE** There's a PHP function\
    \ called array_multisort() that attempts to be a catchall solution for multidimensional\
    \ array sorting. It’s ruthlessly complicated; you’re probably better off avoiding\
    \ it."
  merge: -1
  img_proc: true
- pgno: 29
  md: "# Hacking the Script\n\nThe most obvious modification you can make to the comparison\
    \ function is to add extra criteria in case two elements are equal. Using our\
    \ previous example, here's how to sort by price in case the names are the same:\n\
    \n```\nfunction name_cmp($a, $b) {\n    $r = strcasecmp($a[\"name\"], $b[\"name\"\
    ]);\n    if ($r == 0) {\n        if ($a[\"price\"] < $b[\"price\"]) {\n      \
    \      $r = -1;\n        } elseif ($a[\"price\"] > $b[\"price\"]) {\n        \
    \    $r = 1;\n        } else {\n            $r = 0;\n            /* Not strictly\
    \ necessary; $r is already 0. */\n        }\n    }\n    return($r);\n}\n```\n\n\
    # #7: Templating Your Site with Smarty\n\nMost sites have a consistent look and\
    \ feel. Although the dynamic content in the middle of the page may change, there's\
    \ usually a header, a navigation bar on the side, and maybe an advertisement or\
    \ two. There are simple ways to achieve this, from custom header-printing functions\
    \ to include files. Depending on the size of your site, these solutions may work\
    \ fine, but the larger and more complicated your content becomes, the more tedious\
    \ making changes can get.\n\nThe most common templating solution is Smarty (http://smarty.php.net/).\
    \ With Smarty, you create templates with variables. In other words, you can create\
    \ one HTML file with placeholders for PHP-created data. In addition, you can include\
    \ other Smarty templates inside a template, allowing you to better organize and\
    \ edit pieces of your site. Once you get really familiar with Smarty, you can\
    \ cache data and speed up your site considerably, but that's an advanced technique\
    \ outside the scope of this book.\n\nWhat follows is enough to get you up and\
    \ running for most sites.\n\n# Installing Smarty\n\nFollow these steps to install\
    \ Smarty on your server.\n\n+   1. Create a directory on your server within the\
    \ web root named *smarty* to store the core Smarty files.\n+   2. Go to http://smarty.php.net/\
    \ and download the latest version of Smarty. Decompress and extract it to a folder\
    \ on your computer.\n+   3. Transfer all Smarty files from your computer to the\
    \ smarty directory on your server."
  merge: -1
  img_proc: true
- pgno: 30
  md: '+   4. On your server, create another directory called *templates* for your
    Smarty templates. Create two subdirectories here: *html* for the raw templates
    and *compile* for Smarty-compiled templates.


    +   5. Make the compile directory writeable by the webserver. If you’re not sure
    how to do that, “File Permissions” on page 91 will show you the way.


    +   6. In the templates directory, create (or upload) a file called smarty_initialize.php,
    containing the following:


    ```

    <?php

    define ("SMARTY_DIR", "/path/to/web/root/smarty/");

    require_once (SMARTY_DIR."Smarty.class.php");

    $smarty = new Smarty;

    $smarty->compile_dir = "/path/to/web/root/templates/compile";

    $smarty->template_dir = "/path/to/web/root/templates/html";

    ?>

    ```


    Four aspects of the smarty_initialize.php file are very important:


    +   - The SMARTY_DIR constant points at the Smarty library directory.

    +   - To load the library, smarty_initialize.php requires the Smarty.class.php
    file.

    +   - Because Smarty is object-oriented, you must create a new Smarty object.
    This script does so with $smarty = new Smarty.

    +   - Smarty needs to know where your template and compile directories are. Two
    object attributes (compile_dir and template_dir) control this location.


    Now that you’ve got Smarty set up, it’s time to learn how to use it.


    # ## A Brief Smarty Tutorial


