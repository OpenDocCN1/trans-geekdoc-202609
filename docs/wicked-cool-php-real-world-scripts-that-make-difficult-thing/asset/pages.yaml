- pgno: 62
  md: '# # Using $_POST, $_GET, $_REQUEST, and $_FILES to Access Form Data


    In Chapter 2, we showed you how to turn off the register_globals setting that
    automatically sets global variables based on form data.

    To shut down this dangerous setting, refer to "#14: Turning Off Registered Global
    Variables" on page 25. How do you use $_POST, $_FILES, and $_GET to retrieve form
    data? Read on.


    # # #25: Fetching Form Variables Consistently and Safely


    You should pull form data from predefined server variables. All data passed on
    to your web page via a posted form is automatically stored in a large array called
    $_POST, and all GET data is stored in a large array called $_GET. File upload
    information is stored in a special array called $_FILES (see "#54: Uploading Images
    to a Directory" on page 97 for more information on files). In addition, there
    is a combined variable called $_REQUEST.


    To access the username field from a POST method form, use $_POST[''username''].
    Use $_GET[''username''] if the username is in the URL. If you don’t care where
    the value came from, use $_REQUEST[''username''].


    ```

    <?php


    $post_value = $_POST[''post_value''];

    $get_value = $_GET[''get_value''];

    $some_variable = $_REQUEST[''some_value''];


    ?>

    ```


    $_REQUEST is a union of the $_GET, $_POST, and $_COOKIE arrays. If you have two
    or more values of the same parameter name, be careful of which one PHP uses. The
    default order is cookie, POST, then GET.


    There has been some debate on how safe $_REQUEST is, but there shouldn’t be. Because
    all of its sources come from the outside world (the user’s browser), you need
    to verify everything in this array that you plan to use, just as you would with
    the other predefined arrays. The only problems you might have are confusing bugs
    that might pop up as a result of cookies being included.


    # # #26: Trimming Excess Whitespace


    Excess whitespace is a constant problem when working with form data. The trim()
    function is usually the first tool a programmer turns to, because it removes any
    excess spaces from the beginning or end of a string. For example, " Wicked Cool
    PHP " becomes "Wicked Cool PHP." In fact, it’s so handy that you may find yourself
    using it on almost every available piece of user-inputted, non-array data:


    ```

    $user_input = trim($user_input);

    ```'
