- pgno: 26
  md: "+   3. A second query extracts at most $items_per_page rows from the table,\n\
    +      starting at $start_number.\n+   4. The row data is formatted.\n+   5. The\
    \ create_navbar() function creates the navigation bar; the formatted\n+      bar\
    \ goes in the $navbar variable.\n+   6. The script prints the formatted navigation\
    \ bar and data.\n\n# #4: Printing the Contents of an Array\n\nLet's say that you\
    \ have been adding and subtracting items from an array,\nbut you're running into\
    \ some problems. What you really need is to view the\ncontents of an array as\
    \ they were at a specific line in your script. There's a\nreally easy way to do\
    \ this that doesn't get *nearly* the attention that it should\nfrom PHP tutorials\
    \ around the world—the print_r() function! Here's an\nexample:\n\n```\n<?php\n\
    $alacarte = array(\"chocolate ice cream\",\n    \"vanilla pudding\",\n    \"snozberry\
    \ whip\");\n$menu = array (\"appetizer\" => \"fruit\",\n    \"entree\" => roast\
    \ beef,\n    \"dessert\" => $alacarte);\nprint_r($menu);\n?>\n```\n\nThe print_r()\
    \ function prints arrays onscreen in a format that humans\ncan read. This is especially\
    \ handy when you're dealing with *multidimensional\narrays* (which, if you're\
    \ not familiar with the term, are arrays that contain\nother arrays). Feed an\
    \ array to print_r(), and you get a simple plaintext\ndisplay. Because it uses\
    \ whitespace but no HTML markup, you may need to\nview the page source to see\
    \ it as it is meant to be seen. The previous sample\nresults in this output:\n\
    \n```\nArray\n(\n    [appetizer] => fruit\n    [entree] => roast beef\n    [dessert]\
    \ => Array\n    (\n        [0] => chocolate ice cream\n        [1] => vanilla\
    \ pudding\n        [2] => snozberry whip\n    )\n)\n```"
