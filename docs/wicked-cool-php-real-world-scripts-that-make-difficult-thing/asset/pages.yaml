    ;\n\nif ($upfile) {\n    mkthumb($upfile, $thumb_filename);\n    print \"<img\
    \ src=\\\"$thumb_filename\\\" />\";\n} else { ?>\n    <form action=\"thumb.php\"\
    \ enctype=\"multipart/form-data\" method=\"post\">\n    Upload an image:<br />\n\
    \    <input name=\"upfile\" type=\"file\" /><br />\n    <input name=\"Submit\"\
    \ type=\"submit\" value=\"Upload Image\" />\n    </form>\n    <?\n}\n?>\n```\n\
    \nObviously, this script makes a *lot* of assumptions, and you’d never want to\
    \ use it for general users. Again, use “#54: Uploading Images to a Directory”\
    \ on page 97 for a full-blown image uploader.\n\nThere are several optimizations\
    \ that you can do for mkthumb() in order to suit your particular needs. For example,\
    \ JPEG is a lossy format. If you make a thumbnail of a cartoon-style GIF or PNG,\
    \ the resulting thumbnail will be of poor quality. To fix this problem, you may\
    \ elect to write in the PNG format with the imagepng() function instead of imagejpeg().\
    \ You could also try to get tricky and resize into the image’s original format.\
    \ However, this may backfire on you, because GIF images have a limited color map,\
    \ and when you resize an image, the color map tends to change.\n\nOverall, though,\
    \ beware of trying to be *too* tricky with PHP image manipulation. PHP is typically\
    \ used on demand, so you have little time for fancy operations. In addition to\
    \ the user getting impatient, the webserver won’t let a script run for very long."
