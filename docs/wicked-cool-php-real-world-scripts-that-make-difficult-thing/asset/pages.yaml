- pgno: 85
  md: "One of the peculiarities of Perl-Compatible functions is that you need to enclose\
    \ the expression within delimiter characters. Most developers use the slash (/)\
    \ because it is similar to the way we search for regular expressions in the vi\
    \ editor.\n\nLet's say that you want to see if the word *fred* is in a string.\
    \ The regular expression for that is just *fred*; it requires no special characters\
    \ or modifiers. Here's how we'd put it to use with the `preg_match()` function:\n\
    \n```\nif (preg_match('/fred/', 'I saw Alfred over there')) {\n    print 'I found\
    \ fred!';\n}\n```\n\nNotice that the regular expression is a string, and the delimiter\
    \ characters (the slashes) are inside the string. In addition, you should try\
    \ to use the PHP single quotes instead of the double quotes, because PHP does\
    \ not use variable expansion and escape sequences inside single-quoted strings.\
    \ Regular expression syntax often clashes with escape sequences in double-quoted\
    \ strings.\n\n**NOTE** A different delimiter such as the pipe (|) is handy when\
    \ you have a slash-filled expression; for example, a URL.\n\nThe delimiters in\
    \ Perl-Compatible regular expressions are there mostly to make Perl people more\
    \ comfortable and to confuse beginners, but they allow an extra set of features\
    \ called *modifiers*, which you enable by placing extra characters after the second\
    \ delimiter. The most common modifier is i, which makes the regular expression\
    \ case insensitive. Therefore, if you wanted to search for *fred*, *Fred*, *FRED*,\
    \ *fRed*, and so on, your regular expression would be /fred/i.\n\n# Special Character\
    \ Sequences\n\nTo make regular expressions more compact and expand their utility,\
    \ you can use a number of characters and sequences that match special circumstances.\
    \ The most elementary (but still extremely useful) of these is the dot (.), which\
    \ matches any character except a newline. So, for example, a regular expression\
    \ of /f.ed/ matches *fled*, *fed*, *fled*, and so on. To match an actual dot (or\
    \ anything else that is a special character) in a string, use a backslash; /f\\\
    .ed/ matches only a string that contains *f.red*.\n\nHere are a few other character\
    \ sequences that come in handy:\n\n+   - `^` matches the beginning of the string.\
    \ For example, /^fred/ matches *fred* and *frederick* but not *alfred*.\n+   -\
    \ `$` matches the end of the string. /fred$/ matches *fred* and *alfred* but not\
    \ *frederick*.\n+   - `\\s` matches a whitespace character, such as a space or\
    \ a tab.\n+   - `\\S` matches any non-whitespace character.\n+   - `\\d` matches\
    \ any decimal digit (0–9)."
