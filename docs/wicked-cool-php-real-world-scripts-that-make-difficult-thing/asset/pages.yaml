- pgno: 59
  md: '# Using the Script


    The make_password() function returns a string, so all you need to do is supply

    the length of the string as an argument:


    ```

    <?php

    $fifteen_character_password = make_password(15);

    ?>

    ```


    The function works as follows:


    +   1. The function makes sure that $num_chars is a positive nonzero integer.

    +   2. The function initializes the $password variable to an empty string.

    +   3. The function initializes the $accepted_chars variable to the list of characters
    the password may contain. This script uses all lowercase letters and the numbers
    0 through 9, but you can choose any set of characters you like.

    +   4. The random number generator needs a seed, so it gets a bunch of random-like
    values. (This isn’t strictly necessary on PHP 4.2 and later.)

    +   5. The function loops $num_chars times, one iteration for each character in
    the password to generate.

    +   6. For each new character, the script looks at the length of $accepted_chars,
    chooses a number between 0 and the length, and adds the character at that index
    in $accepted_chars to $password.

    +   7. After the loop completes, the function returns $password.'
