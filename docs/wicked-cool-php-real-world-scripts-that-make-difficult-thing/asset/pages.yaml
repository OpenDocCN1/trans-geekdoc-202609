  md: "```\n$next_navbar = \"<a href=\\\"\"\n$current_page?start=$nextnumber\\\">\
    \ - Next&gt;&gt;</a><br\\\";\n}\n} else {\n    // Print normally.\n    $navbar\
    \ .= \"<a href=\\\"$current_page?start=$nav_count\\\">\"\n    [$page_count] </a>\\\
    \";\n}\n$nav_count += $items_per_page;\n$page_count++;\n}\n$navbar = $prev_navbar\
    \ . $navbar . $next_navbar;\nreturn $navbar;\n}\n?>\n```\n\nLet's assume you're\
    \ going to use this script to process information that you're retrieving from\
    \ a database. Two things will make the display accurate and efficient:\n\n# Show\
    \ only a subset of rows from your database.\n\nIf the idea is to show only 25\
    \ items per page, then you should write a SQL query that returns only 25 items.\
    \ (Okay, you could select everything and then loop through the entire result set,\
    \ sifting through thousands of rows until you find the 25 you want, but there\
    \ is a better way.) Furthermore, you want to show a specific 25 items. Pulling\
    \ the first 25 items from the database isn't helpful when the user wants to look\
    \ at products #176 through #200.\n\nFortunately, both objectives are easily accomplished\
    \ with the SQL LIMIT clause, which retrieves only a set number of rows from a\
    \ database. Your SQL query should look something like this:\n\n```\nSELECT * FROM\
    \ your_table\nWHERE conditions\nLIMIT $start_number, $items_per_page\n```\n\n\
    When added to the end of a query, the LIMIT clause pulls only a selected number\
    \ of rows from the result set. For example, placing LIMIT 75, 25 at the end of\
    \ a query retrieves 25 rows from the database, starting at the 75th row.\n\n**NOTE**\
    \ If you use a number for the starting row that's greater than the number of rows,\
    \ MySQL returns no data. For example, if you run LIMIT 200, 25 and there are only\
    \ 199 rows in your table, you get an empty result set instead of an error. Well-written\
    \ programs account for empty sets by using an if (mysql_num_rows($result) > 0)\
    \ check."
