- pgno: 111
  md: "# #51: Creating and Writing to a File\n\nHere's how to write a string to a\
    \ file:\n\n```\n<?\n$file_data = \"Hello, file.\\nSecond line.\";\n$fd = fopen('file.txt',\
    \ 'w');\nif (!$fd) {\n    echo \"Error! Couldn't open/create the file.\";\n  \
    \  die;\n}\nfwrite($fd, $file_data);\nfclose($fd);\n?>\n```\n\nNotice that this\
    \ script explicitly includes newlines. When viewed on a Unix machine, the file\
    \ looks like this:\n\n```\nHello, file.\nSecond line.\n```\n\nThe separator between\
    \ the two lines is called a newline. On Unix and Macs, it's a single character\
    \ represented in PHP as \\n inside double quotes. However, in Windows and Macs,\
    \ the newline is the \\r\\n sequence (\"carriage return, then newline\").\n\n\
    Therefore, if you actually care about cross-platform text file readability, you\
    \ need to be a little careful. A Unix text file appears as one big line in Windows,\
    \ and a Windows text file has a carriage return before the end of each line.\n\
    \nYou can explicitly state the newline as \\r\\n if you like, but if you're really\
    \ worried about portability, add a t to the end of the mode in fopen(), so the\
    \ mode is wt. This automatically translates \\n to \\r\\n on Windows.\n\n# #52:\
    \ Checking to See If a File Exists\n\nfopen() generates error messages if you're\
    \ trying to open a file that doesn't exist, as do other functions such as unlink(),\
    \ when you attempt to delete a nonexistent file. To see if a file exists before\
    \ you perform a file operation, use the file_exists() function in a test condition:\n\
    \n```\n<?\nif (file_exists('file.txt')) {\n    print 'OK, file.txt exists.';\n\
    }\n```\n\nAs you can see, this function returns true if the file exists and false\
    \ if it does not."
  merge: -1
  img_proc: true
- pgno: 112
  md: "# #53: Deleting Files\n\nTo remove a file on Unix, use the unlink() function:\n\
    \n```\n<?\nif (unlink(\"file.txt\")) {\n    echo \"file.txt deleted.\";\n} else\
    \ {\n    echo \"file.txt: delete failed.\";\n}\n?>\n```\n\nYou need the proper\
    \ permissions to delete a file, of course. However, the biggest danger here is\
    \ that you can delete a file that you didn't mean to delete. When you delete a\
    \ file in Unix, it's gone; there's no undelete or trash can. The only way you\
    \ might get something back is from your system administrator's backups.\n\nAnd\
    \ be careful here if you plan to have user actions deleting files. This is dangerous\
    \ for every reason discussed and for every other file operation discussed so far.\n\
    \n# #54: Uploading Images to a Directory\n\nPeriodically uploading 5 or 10 photos\
    \ a week to a webserver is a bother. When I was updating my webserver, I had to\
    \ save photos on my hard drive, start the FTP client, put them on the site, and\
    \ then send the URL to anyone interested. There are a lot of image gallery programs\
    \ that do this, but most are very complicated; I wanted to see if I could do something\
    \ a little simpler.\n\nLike any good lazy programmers, I decided to automate the\
    \ process, coming up with a fairly foolproof system that allows users to upload\
    \ pictures (and pictures only) into a directory. The features I wanted to incorporate\
    \ would block excessively large images and generate HTML complete with height\
    \ and width attributes. The first part of the system is a script called upload.html\
    \ that takes the image input data:\n\n```\n<table border=\"0\" cellpadding=\"\
    10\">\n<form action=\"image_process.php\" enctype=\"multipart/form-data\" method=\"\
    post\">\n<tr>\n<td valign=top><strong>Image file:</strong></td>\n<td><input name=\"\
    upfile\" type=\"file\"><br>\nImage files must be in JPEG, GIF, or PNG format.\n\
    </td>\n</tr>\n<tr>\n<td valign=\"top\"><strong>Target directory:</strong></td>\n\
    <td>\n<select name=\"location\">\n<option value=\"article\" selected>Article Images</option>\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 113
  md: "```\n<option value=\"banners\">Banners/Advertisements</option>\n</select>\n\
    </td>\n</tr>\n<tr>\n<td valign=\"top\"><strong>Filename (Optional):</strong></td>\n\
    <td><input name=\"newname\" type=\"text\" size=\"64\" maxlength=\"64\"></td>\n\
    </tr>\n<tr>\n<td colspan=\"2\">\n<div align=\"center\"><input type=\"submit\"\
    \ value=\"Upload Image\"></div>\n</td>\n</tr>\n</form>\n</table>\n```\n\nHere's\
    \ the image_process.php script that processes this form. The first thing we need\
    \ to do is set some configuration variables:\n\n```\n<?php\n/* Configuration */\n\
    \n$root = \"/home/www/wcphp/images\"; /* Image directory root */\n$urlroot = \"\
    http://www.example.com/images\"; /* URL root */\n$max_width = 420; /* Max width\
    \ */\n$max_height = 600; /* Max height */\n$overwrite_images = false; /* Allow\
    \ overwrite */\n\n/* Permitted subdirectories */\n$target_dirs = array(\"article\"\
    , \"banners\");\n\n/* End config */\n```\n\nSet the $root variable to where you\
    \ want to store images and the $urlroot to where you'd go to look at them from\
    \ a web browser. The items in $target_dirs are subdirectories in $root. These\
    \ are the only locations where you will allow users to store images.\n\nWith the\
    \ configuration out of the way, let's first check to see if the script will work—it\
    \ all depends on the availability of the getimagesize() function:\n\n```\nif (!function_exists(getimagesize))\
    \ {\n\tgetimagesize() required.\");\n}\n```\n\nExtracting the field information\
    \ from the form follows standard procedure:\n\n```\n/* Get upload information.\
    \ */\n$location = strval($_POST['location']);\n$newname = strval($_POST['newname']);\n\
    $upfile = $_FILES['upfile']['tmp_name'];\n$upfile_name = $_FILES['upfile']['name'];\n\
    ```"
