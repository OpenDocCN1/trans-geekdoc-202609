- pgno: 171
  md: '# #74: A User Poll


    Online polls may not be very useful for empowering the people, but they are great
    tools for figuring out how you might want to spin your content in order to keep
    users interested, optimize page views, or irritate as many people as you can.
    The best part about online polls is that they are extremely easy to implement.
    The one shown here supports multiple polls, so its questions and answers are not
    hardcoded.


    For a typical online poll, you should not worry much about ballot stuffing, since
    it rarely matters. To keep most people from voting more than once, we''ll use
    a cookie-based system. This is easy to circumvent, but for most purposes, the
    stakes are so low that no one cares. If you need something better, use a login
    system for voter registration.


    There are four scripts in the online poll:


    +   - vote_form.php: Displays a ballot to the user

    +   - vote_process.php: Processes a ballot

    +   - vote_tally.php: Shows the poll results

    +   - vote_include.php: Connects to the database


    There are three database tables. The poll table contains the questions:


    ```

    CREATE TABLE `poll` (

    `ID` INT NOT NULL AUTO_INCREMENT ,

    `question` MEDIUMTEXT NOT NULL ,

    PRIMARY KEY (`ID`)

    ) TYPE = MYISAM ;

    ```


    The answers table contains the answers for the questions in the poll table. The
    ID field is meant for joining with the ID field of the poll table:


    ```

    CREATE TABLE `answer` (

    `answer_ID` INT NOT NULL AUTO_INCREMENT ,

    `ID` INT NOT NULL ,

    `answer` MEDIUMTEXT NOT NULL ,

    PRIMARY KEY (`answer_ID`)

    ) TYPE = MYISAM ;

    ```


    The vote table contains the votes. The ID and answer_ID fields mirror those of
    the poll and answer tables.


    ```

    CREATE TABLE `vote` (

    `ID` INT NOT NULL ,

    `answer_ID` INT NOT NULL ,

    INDEX (`ID`)

    ) TYPE = MYISAM ;

    ```'
