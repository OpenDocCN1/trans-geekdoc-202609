- pgno: 123
  md: "Notice that there is an extra submit button for clearing session values (you'll\
    \ see how this works soon). Here's the sessionview.php script that stores the\
    \ form data and gives the user the opportunity to go back and edit the values.\
    \ First, we start the session and check to see if the name and/or color have been\
    \ sent as form data. If they have, we set those values as session variables:\n\
    \n```\n<?\nsession_start();\n\nif ($_REQUEST[\"name\"]) {\n    $_SESSION[\"name\"\
    ] = $_REQUEST[\"name\"];\n}\n\nif ($_REQUEST[\"color\"]) {\n    $_SESSION[\"color\"\
    ] = $_REQUEST[\"color\"];\n}\n}\n```\n\nThe next part checks to see if the user\
    \ pressed the Clear Details button on the form. If this is the case, then we use\
    \ unset() to clear the session values:\n\n```\nif ($_REQUEST[\"clear\"]) {\n \
    \   unset($_SESSION[\"name\"]);\n    unset($_SESSION[\"color\"]);\n}\n```\n\n\
    Now we know that the $_SESSION array contains all of the correct values, so we\
    \ can print the user's information based on those values:\n\n```\n$name = $_SESSION[\"\
    name\"];\n$color = $_SESSION[\"color\"];\n\nif ($name) {\n    print \"Your name\
    \ is <b>$name</b>.<br />\";\n}\nif ($color) {\n    print \"Your favorite color\
    \ is <b>$color</b>.<br />\";\n}\n```\n\nFinally, we give the user a chance to\
    \ go back and edit the details or clear the values. We've done all of the work\
    \ in our scripts already, so we just need to provide hyperlinks to the correct\
    \ places:\n\n```\nprint ' <a href=\"sessionform.php\">Edit details</a>';\nprint\
    \ ' | <a href=\"sessionview.php?clear=1\">Clear values</a>';\n?>\n```"
