- pgno: 128
  md: 'And here''s Firefox on Linux:


    ```

    Mozilla/5.0 (X11; U; Linux i686; en-US; rv:1.8.1.4) Gecko/20070515 Firefox/2.0.0.4

    ```


    The reason why user agent strings look like blatant lies is that most browsers
    try to trick the server into believing that they''re something else. Here, the
    Internet Explorer user agent claims to be Mozilla (the code name for Netscape
    Navigator). Opera calls itself Mozilla, and then it says that it''s Explorer (MSIE
    6.0), and at the end, it finally tells you that it''s Opera. Although this behavior
    is completely idiotic, it''s not half as stupid as optimizing pages for particular
    browsers in the first place.


    The only pieces of the user agent string that you should actually care about are
    the browser, version, and operating system, because these tell you something about
    your users. For example, if you see an unusually large proportion of Mac users,
    part of your market base probably likes to buy expensive gadgets for the sole
    purpose of looking stylish. Here''s a function that tries to extract the browser
    and operating system information into a usable form. It''s ugly, but in this case,
    we have to fight ugly with ugly.


    First, let''s initialize the output array and put the browser identification string
    into the $agent variable:


    ```

    function find_browser() {

    // Determine OS, version, and type of client browsers.

    $browser_info = array(

    "name" => "Unknown",

    "version" => "Unknown",

    "OS" => "Unknown",

    );

    // Get the User Agent.

    if (!empty($_SERVER["HTTP_USER_AGENT"])) {

    $agent = $_SERVER["HTTP_USER_AGENT"];

    }

    ```


    Now, let''s look for the user''s operating system. This is relatively easy, because
    the operating system strings are unique:


    ```

    // Find operating system.

    if (preg_match(''/win/i'', $agent)) {

    $browser_info["OS"] = "Windows";

    } else if (preg_match(''/mac/i'', $agent)) {

    $browser_info["OS"] = "Macintosh";

    } else if (preg_match(''/linux/i'', $agent)) {

    $browser_info["OS"] = "Linux";

    }

    ```


    Then the tough part of figuring out the browser details begins. The order in which
    we check for browsers is important, because some browser strings say that they
    are several other browsers. The biggest offender is'
