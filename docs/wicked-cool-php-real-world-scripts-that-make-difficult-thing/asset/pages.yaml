- pgno: 47
  md: '**NOTE** If you''ve overridden the tar directory structure and placed your
    library into a folder that''s not the default, you''ll need to add the path to
    the --with flag so that PHP can find it. This has happened in the apxs (Apache
    Extension Tool Synopsis) library in our example above, and the --with-apxs=/usr/local/apache/bin/apxs
    flag tells PHP that apxs is stored in the /usr/local/apache/bin/apxs directory.


    +   **8.** **Fetch and unpack a new PHP source distribution; then change to that
    directory.** You can unpack the PHP source code just as you did for the library
    source code previously. If you already have a previous source code tree of PHP,
    you can use that, but run `make clean` there beforehand.


    +   **9.** **Copy the configure command you created earlier from your text file,
    paste it onto the command prompt, and press ENTER to run it.** This reconfigures
    PHP with the new library, preserving any old libraries.


    +   **10.** **Make PHP.** Run `make`, and then run `make install`. There will
    be a long wait as each command builds and installs all of PHP''s components.


    **NOTE** If you have made any changes to your .ini files, as shown earlier in
    this chapter, they may be overwritten with the defaults when PHP is recompiled.
    Take a look afterward to verify that your settings have been preserved.


    +   **11.** **Restart Apache.** Run the `apachectl graceful` command.


    +   **12.** **Test PHP.** First, try running a generic "Hello, world!" script
    to ensure that PHP is up and running without error, and then try running a couple
    of library-specific functions to see whether the new library works properly.


    # **What Can Go Wrong?**


    There are so many things that can go wrong during the build process that it''s
    almost impossible to list them all. Although many errors are complicated, and
    many of them are library specific so that you will need to seek specific advice,
    three common problems pop up all the time.


    The first major problem that could happen is that your distribution or release
    may not have the software development packages installed. You need the C compiler
    and various "development" versions of many other libraries so you can build code
    against them.


    Second, you may need to configure PHP using a --with parameter that has an explicit
    path; for example, --with-mcrypt=/usr/lib/mcrypt.


    The other common glitch is that you could have configured the extension''s library
    package incorrectly. As mentioned earlier, you should configure Mcrypt with the
    --disable-nls --disable-posix-threads flags; otherwise, you may crash Apache.
    Other libraries require similar tweaking in order to work smoothly with PHP and
    Apache. Check the FAQs, man pages, and README files for details.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 3


    # PHP SECURITY


    ![](img/19183d2b75bf6b509317c631c0e7b817_48_0.png)


    When offering an Internet service, you must always keep security in mind as you
    develop your code. It may appear that most PHP scripts aren''t sensitive to security
    concerns; this is mainly due to the large number of inexperienced programmers
    working in the language. However, there is no reason for you to have an inconsistent
    security policy based on a rough guess at your code''s significance. The moment
    you put anything financially interesting on your server, it becomes likely that
    someone will try to casually hack it. Create a forum program or any sort of shopping
    cart, and the probability of attack rises to a dead certainty. Here are a few
    general security guidelines.


    **Don''t trust forms.** Hacking forms is trivial. Yes, by using a silly JavaScript
    trick, you may be able to limit your form to allow only the numbers 1 through
    5 in a rating field. The moment someone turns JavaScript off in their browser
    or posts custom form data, your client-side validation flies out the window.'
  merge: -1
  img_proc: true
- pgno: 49
  md: "Users interact with your scripts primarily through form parameters, and therefore\
    \ they’re the biggest security risk. What’s the lesson? _Always validate the data\
    \ that gets passed to any PHP script in the PHP script._ “Verification Strategies”\
    \ on page 46 shows how to validate discrete data. In this chapter, we show you\
    \ how to analyze and protect against cross-site scripting (XSS) attacks, which\
    \ can hijack your user’s credentials (and worse). You’ll also see how to prevent\
    \ the MySQL injection attacks that can taint and destroy your data.\n\n# Don’t\
    \ trust users.\n\nAssume that every piece of data your website gathers is laden\
    \ with harmful code. Sanitize every piece, even if you’re positive that nobody\
    \ would ever try to attack your site. Paranoia pays off.\n\n# Turn off global\
    \ variables.\n\nThe biggest security hole you can have is having the register_globals\
    \ configuration parameter enabled. Mercifully, it’s turned off by default in PHP\
    \ 4.2 and later. Refer to “#14: Turning Off Registered Global Variables” on page\
    \ 25 to disable this setting.\n\nNovice programmers view registered globals as\
    \ a convenience, but they don’t realize how dangerous this setting is. A server\
    \ with global variables enabled automatically assigns global variables to any\
    \ form parameters. For an idea of how this works and why this is dangerous, let’s\
    \ look at an example.\n\nLet’s say that you have a script named _process.php_\
    \ that enters form data into your user database. The original form looked like\
    \ this:\n\n```\n<input name=\"username\" type=\"text\" size=\"15\" maxlength=\"\
    64\">\n```\n\nWhen running process.php, PHP with registered globals enabled places\
    \ the value of this parameter into the $username variable. This saves some typing\
    \ of accessing them through $_POST['username'] or $_GET['username']. Unfortunately,\
    \ this also leaves you open to security problems, because PHP sets a variable\
    \ for _any_ value sent to the script via a GET or POST parameter, and that is\
    \ a big problem if you didn’t explicitly initialize the variable and you don’t\
    \ want someone to manipulate it.\n\nTake the script below, for example—the $authorized\
    \ variable is true, it shows confidential data to the user. Under normal circumstances,\
    \ the $authorized variable is set to true _only_ if the user has been properly\
    \ authenticated via the hypothetical authenticated_user() function. But if you\
    \ have register_globals active, anyone could send a GET parameter such as authorized=1\
    \ to override this:\n\n```\n<?php\n// Define $authorized = true only if user is\
    \ authenticated\nif (authenticated_user()) {\n    $authorized = true;\n}\n?>\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The moral of the story is that you should follow the procedure in "#25: Fetching
    Form Variables Consistently and Safely" on page 47 to access form data. It doesn''t
    sound like it would happen often, but exploits for register_globals are second
    only to XSS attacks in PHP. Furthermore, global variables can lead to much subtler
    issues that *will* cause bugs later on in your code.


    # Recommended Security Configuration Options


    There are several PHP configuration settings that affect security features. Here
    are the ones that I use for production servers (see Chapter 2 for how to set them):


    +   * register_globals set to off. See the previous discussion.

    +   * safe_mode set to off. This parameter doesn''t really make anything safe.

    +   * error_reporting set to off: This is visible error reporting that sends a
    message to the user''s browser if something goes wrong. For production servers,
    use error logging instead (see "#11: Suppressing All Error Messages" on page 24).
    Development servers can enable error logging as long as they''re behind a firewall.

    +   * Disable these functions: system(), exec(), passthru(), shell_exec(), proc_open(),
    and popen(). See "#17: Shutting Down Specific Functions" on page 27.

    +   * open_basedir set for both the /tmp directory (so that session information
    can be stored) and the web root so that scripts cannot access files outside a
    selected area.

    +   * expose_php set to off. This feature adds a PHP signature that includes the
    version number to the Apache headers. Why would you want to do that?

    +   * allow_url_fopen set to off. This isn''t strictly necessary if you''re careful
    about how you access files in your code—that is, you validate all input parameters.

    +   * allow_url_include set to off There''s really no sane reason for anyone to
    want to access include files via HTTP.


    In general, if you find code that wants to use these features, you shouldn''t
    trust it. Be especially careful of anything that wants to use a function such
    as system()—it''s almost certainly flawed.


    With these settings now behind us, let''s look at some specific attacks and the
    methods that will help you protect your server.


    # #19: SQL Injection Attacks


    Because the queries that PHP passes to MySQL databases are written in the powerful
    SQL programming language, you run the risk of someone attempting an _SQL injection
    attack_ by using MySQL in web query parameters. By inserting malicious SQL code
    fragments into form parameters, an attacker attempts to break into (or disable)
    your server.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Let’s say that you have a form parameter that you eventually place into

    a variable named $product, and you create some SQL like this:


    ```

    $sql = "select * from pinfo where product = ''$product''";

    ```


    If that parameter came straight from the form, use database-specific

    escapes with PHP’s native functions, like this:


    ```

    $sql = ''Select * from pinfo where product = ''"" .

    mysql_real_escape_string($product) . ''""'';

    ```


    If you don’t, someone might just decide to throw this fragment into the

    form parameter:


    ```

    39''; DROP pinfo; SELECT ''FOO

    ```


    Then the result of $sql is:


    ```

    select product from pinfo where product = ''39''; DROP pinfo; SELECT ''FOO''

    ```


    Because the semicolon is MySQL’s statement delimiter, the database

    processes these three statements:


    ```

    select * from pinfo where product = ''39''

    DROP pinfo

    SELECT ''FOO''

    ```


    Well, there goes your table.


    Note that this particular syntax won’t actually work with PHP and MySQL,

    because the mysql_query() function allows just one statement to be processed

    per request. However, a subquery will still work.


    To prevent SQL injection attacks, do two things:


    +   • Always validate all parameters. For example, if something needs to be a

    +   number, make sure that it’s a number.


    +   • Always use the mysql_real_escape_string() function on data to escape any

    +   quotes or double quotes in your data.


    > NOTE To automatically escape any form data, you can turn on Magic Quotes. See
    "#15:

    > Enabling Magic Quotes" on page 26.


    Some MySQL damage can be avoided by restricting your MySQL user

    privileges. Any MySQL account can be restricted to only do certain kinds

    of queries on selected tables. For example, you could create a MySQL user

    who can select rows but nothing else. However, this is not terribly useful for

    dynamic data, and, furthermore, if you have sensitive customer information,

    it might be possible for someone to have access to some data that you didn’t

    intend to make available. For example, a user accessing account data could

    try to inject some code that accesses another account number instead of the

    one assigned to the current session.'
  merge: -1
  img_proc: true
- pgno: 52
  md: "# #20: Preventing Basic XSS Attacks\n\nXSS stands for _cross-site scripting_.\
    \ Unlike most attacks, this exploit works on the client side. The most basic form\
    \ of XSS is to put some JavaScript in user-submitted content to steal the data\
    \ in a user's cookie. Since most sites use cookies and sessions to identify visitors,\
    \ the stolen data can then be used to impersonate that user—which is deeply troublesome\
    \ when it's a typical user account, and downright disastrous if it's the administrative\
    \ account. If you don't use cookies or session IDs on your site, your users aren't\
    \ vulnerable, but you should still be aware of how this attack works.\n\nUnlike\
    \ MySQL injection attacks, XSS attacks are difficult to prevent. Yahoo!, eBay,\
    \ Apple, and Microsoft have all been affected by XSS. Although the attack doesn't\
    \ involve PHP, you _can_ use PHP to strip user data in order to prevent attacks.\
    \ To stop an XSS attack, you have to restrict and filter the data a user submits\
    \ to your site. It is for this precise reason that most online bulletin boards\
    \ don't allow the use of HTML tags in posts and instead replace them with custom\
    \ tag formats such as [b] and [linkto].\n\nLet's look at a simple script that\
    \ illustrates how to prevent some of these attacks. For a more complete solution,\
    \ use SafeHTML, discussed later in this chapter.\n\n```\nfunction transform_HTML($string,\
    \ $length = null) {\n // Helps prevent XSS attacks\n\n // Remove dead space.\n\
    \ $string = trim($string);\n\n // Prevent potential Unicode codec problems.\n\
    \ $string = utf8_decode($string);\n\n // HTMLize HTML-specific characters.\n $string\
    \ = htmlentities($string, ENT_NOQUOTES);\n $string = str_replace(\"#\", \"&#35;\"\
    , $string);\n $string = str_replace(\"%\", \"&#37;\", $string);\n\n $length =\
    \ intval($length);\n if ($length > 0) {\n   $string = substr($string, 0, $length);\n\
    \ }\n return $string;\n}\n```\n\nThis function transforms HTML-specific characters\
    \ into HTML literals. A browser renders any HTML run through this script as text\
    \ with no markup. For example, consider this HTML string:\n\n```\n<STRONG>Bold\
    \ Text</STRONG>\n```\n\nNormally, this HTML would render as follows:\n\n```\n\
    Bold Text\n```"
  merge: -1
  img_proc: true
- pgno: 53
  md: 'However, when run through transform_HTML(), it renders as the original input.
    The reason is that the tag characters are HTML entities in the processed string.
    The resulting string from HTML() in plaintext looks like this:


    ```

    &lt;STRONG&gt;Bold Text&lt;/STRONG&gt;

    ```


    The essential piece of this function is the htmlentities() function call that
    transforms <, >, and & into their entity equivalents of &lt;, &gt;, and &amp;.
    Although this takes care of the most common attacks, experienced XSS hackers have
    another sneaky trick up their sleeve: Encoding their malicious scripts in hexadecimal
    or UTF-8 instead of normal ASCII text, hoping to circumvent your filters. They
    can send the code along as a GET variable in the URL, saying, “Hey, this is hexadecimal
    code, but could you run it for me anyway?” A hexadecimal example looks something
    like this:


    ```

    <a href="http://host/a.php?variable=%22%3e

    %3c%53%43%52%49%50%54%54%45%44

    %6f%73%66%dd%65%74%68%89%69%e6%7f%d6%1c%c6%93%39%69%6f%75%73%c3%c2%f5%43%43%52

    %49%50%54%3e">

    ```


    But when the browser renders that information, it turns out to be:


    ```

    <a href="http://host/a.php?variable="> <SCRIPT>DoSomethingmalicious</SCRIPT>

    ```


    To prevent this, transform_HTML() takes the additional steps of converting # and
    % signs into their entity, shutting down hex attacks, and converting UTF-8–encoded
    data.


    Finally, just in case someone tries to overload a string with a very long input,
    hoping to crash something, you can add an optional $length parameter to trim the
    string to the maximum length you specify.


    # #21: Using SafeHTML


    The problem with the previous script is that it is simple, and it does not allow
    for any kind of user markup. Unfortunately, there are hundreds of ways to try
    to sneak JavaScript past someone''s filters, and short of stripping all HTML from
    someone''s input, there''s no way of stopping it.


    Currently, there''s no single script that''s guaranteed to be unbreakable, though
    there are some that are better than most. As you''ll learn in more detail in “Verification
    Strategies” on page 46, there are two approaches to security, whitelisting and
    blacklisting, and whitelisting tends to be less complicated and more effective.


    One whitelisting solution is the SafeHTML anti-XSS parser from PixelApes. SafeHTML
    is smart enough to recognize valid HTML, so it can hunt and strip any dangerous
    tags. It does its parsing with another package called HTMLSax.


    To install and use SafeHTML, do the following:


    +   1. Go to http://pixel-apes.com/safehtml/?page=safehtml and download the latest
    version of SafeHTML.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '+   2. Put the files in the classes directory on your server. This directory
    contains everything that SafeHTML and HTMLSax need to function.

    +   3. Include the SafeHTML class file (safehtml.php) in your script.

    +   4. Create a new SafeHTML object called $safehtml.

    +   5. Sanitize your data with the $safehtml->parse() method.


    Here''s a complete example:


    ```

    <?php

    /* If you''re storing the HTMLSax3.php in the /classes directory, along

    with the safehtml.php script, define XML_HTMLSAX3 as a null string. */

    define(XML_HTMLSAX3, '''');

    // Include the class file.

    require_once(''classes/safehtml.php'');

    // Define some sample bad code.

    $data = "This data would raise an alert <script>alert(''XSS Attack'')</script>";

    // Create a safehtml object.

    $safehtml = new safehtml();

    // Parse and sanitize the data.

    $safe_data = $safehtml->parse($data);

    // Display result.

    echo ''The sanitized data is <br />'' . $safe_data;

    ?>

    ```


    If you want to sanitize any other data in your script, you don''t have to create
    a new object; just use the $safehtml->parse() method throughout your script.


    # What Can Go Wrong?


    The biggest mistake you can make is assuming that this class completely shuts
    down XSS attacks. SafeHTML is a fairly complex script that checks for almost everything,
    but nothing is guaranteed. You still want to do the parameter validation that
    applies to your site. For example, this class doesn''t check the length of a given
    variable to ensure that it fits into a database field. It doesn''t check for buffer
    overflow problems.


    XSS hackers are creative and use a variety of approaches to try to accomplish
    their objectives. Just look at RSnake''s XSS tutorial at http://ha.ckers.org/xss.html
    to see how many ways there are to try to sneak code past someone''s filters. The
    SafeHTML project has good programmers working overtime to try to stop XSS attacks,
    and it has a solid approach, but there''s no guarantee that someone won''t come
    up with some weird and fresh approach that could short-circuit its filters.


    > **NOTE** For an example of the powerful effects of XSS attacks, check out http://namb.la/popular/tech.html,
    which shows a step-by-step approach to creating the JavaScript XSS worm that overloaded
    the MySpace servers.'
  merge: -1
  img_proc: true
- pgno: 55
  md: "# #22: Protecting Data with a One-Way Hash\n\nThis script performs a one-way\
    \ transformation on data—in other words, it can make a hash signature of someone's\
    \ password, but you can't ever decrypt it and go back to the original password.\
    \ Why would you want to do that? The application is in storing passwords. An administrator\
    \ doesn't need to know users' passwords—in fact, it's a good idea that only the\
    \ user knows his or her password. The system (and the system alone) should be\
    \ able to identify a correct password; this has been the Unix password security\
    \ model for years. One-way password security works as follows:\n\n+   1. When\
    \ a user or administrator creates or changes an account password, the system hashes\
    \ the password and stores the result. The host system discards the plaintext password.\n\
    +   \n+   2. When the user logs in to a system via any means, the entered password\
    \ is again hashed.\n+   \n+   3. The host system throws away the plaintext password\
    \ entered.\n+   \n+   4. This newly hashed password is compared against the stored\
    \ hash.\n+   \n+   5. If the hashed passwords match, then the system grants access.\n\
    \nThe host system does this without ever knowing the original password; in fact,\
    \ the original value is completely irrelevant. As a side effect, should someone\
    \ break into your system and steal your password database, the intruder will have\
    \ a bunch of hashed passwords without any way of reversing them to find the originals.\
    \ Of course, given enough time, computer power, and poorly chosen user passwords,\
    \ an attacker could probably use a dictionary attack to figure out the passwords.\
    \ Therefore, don't make it easy for people to get their hands on your password\
    \ database, and if someone does, have everyone change their passwords.\n\n# ENCRYPTION\
    \ VS. HASHING\n\nTechnically speaking, this process is not encryption. It is a\
    \ hash, which is different from encryption for two reasons:\n\n+   * Unlike in\
    \ encryption, data cannot be decrypted.\n+   * It's possible (but extremely unlikely)\
    \ that two different strings will produce the same hash. There's no guarantee\
    \ that a hash is unique, so don't try to use a hash as something like a unique\
    \ key in a database.\n\n```\n```\nfunction hash_ish($string) {\n    return md5($string);\n\
    }\n```\n```\n\nThe md5() function returns a 32-character hexadecimal string, based\
    \ on the RSA Data Security Inc. Message-Digest Algorithm (also known, conveniently\
    \ enough, as MD5). You can then insert that 32-character string into your database,\
    \ compare it against other md5'd strings, or just adore its 32-character perfection."
  merge: -1
  img_proc: true
- pgno: 56
  md: "# Hacking the Script\n\nIt is virtually impossible to decrypt MD5 data. That\
    \ is, it's _very_ hard. However, you still need good passwords, because it's still\
    \ easy to make a database of hashes for the entire dictionary. There are online\
    \ MD5 dictionaries where you can enter 06d80e8bc0b50a49a509b49f24f24e8c805 and\
    \ get a result of \"dog.\" Thus, even though MD5s can't _technically_ be decrypted,\
    \ they're still vulnerable—and if someone gets your password database, you can\
    \ be sure that they'll be consulting an MD5 dictionary. Thus, it's in your best\
    \ interests when creating password-based systems that the passwords are long (a\
    \ minimum of six characters and preferably eight) and contain both letters and\
    \ numbers. And make sure that the password isn't in the dictionary.\n\n# #23:\
    \ Encrypting Data with Mcrypt\n\nMD5 hashes work just fine if you never need to\
    \ see your data in readable form. Unfortunately, that's not always an option—if\
    \ you offer to store someone's credit card information in encrypted format, you\
    \ need to decrypt it at some later point.\n\nOne of the easiest solutions is the\
    \ Mcrypt module, an add-in for PHP that allows high-grade encryption. The Mcrypt\
    \ library offers more than 30 ciphers to use in encryption and the possibility\
    \ of a passphrase that ensures that _only_ you (or, optionally, your users) can\
    \ decrypt data. To use Mcrypt, recompile PHP data with Mcrypt support, as explained\
    \ in “#18: Adding Extensions to PHP” on page 27.\n\nLet's see some hands-on use.\
    \ The following script contains functions that use Mcrypt to encrypt and decrypt\
    \ data:\n\n```\n<?php\n\n$data = \"Stuff you want encrypted\";\n$key = \"Secret\
    \ passphrase used to encrypt your data\";\n$cipher = \"MCRYPT_SERPENT_256\";\n\
    $mode = \"MCRYPT_MODE_CBC\";\n\nfunction encrypt($data, $key, $cipher, $mode)\
    \ {\n// Encrypt data\n\nreturn (string)\n    base64_encode\n    (\n    mcrypt_encrypt\n\
    \    (\n    $cipher,\n    substr(md5($key),0,mcrypt_get_key_size($cipher, $mode)),\n\
    \    $data,\n    $mode,\n    substr(md5($key),0,mcrypt_get_block_size($cipher,\
