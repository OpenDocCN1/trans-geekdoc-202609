  md: "```\nWHERE V.ID = $poll\";\n\n$result = @mysql_query($query, $db) or die (\"\
    mysql error: \" . mysql_error());\n$row = mysql_fetch_array($result);\n$num_total_votes\
    \ = $row[\"num_total_votes\"];\n```\n\nNow it's time for the big query that gets\
    \ the counts for each vote. This is\na perfect place to use the LEFT JOIN clause\
    \ along with SQL grouping to classify\nall of the votes. Though this query is\
    \ a little more complicated than anything\nwe've shown in this book so far, it's\
    \ easy to dissect and understand:\n\n```\n$query = \"SELECT A.answer, A.answer_ID,\
    \ count(V.answer_ID) as num_votes\nFROM answer A\nLEFT JOIN vote V\nON V.ID =\
    \ A.ID\nAND V.answer_ID = A.answer_ID\nWHERE A.ID = $poll\nGROUP BY A.answer_ID\n\
    ORDER BY num_votes DESC, A.answer ASC\n\";\n```\n\n```\n$result = @mysql_query($query,\
    \ $db) or die (\"mysql error: \" . mysql_error());\n```\n\nWith the query results\
    \ ready to roll, we prepare the HTML header and\nthe first piece of the page:\n\
    \n```\nprint \"<html><head><title>Poll: $question</title></head><body>\";\nprint\
