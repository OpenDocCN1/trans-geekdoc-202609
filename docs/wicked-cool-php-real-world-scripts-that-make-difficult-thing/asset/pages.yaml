  md: "Now, what do we do when a user adds a comment?\n\n# Adding Comments\n\nThe\
    \ script that adds comments to entries, blog_comment.php, is the only one in this\
    \ system that doesn’t have a template, because it doesn’t display anything. Recall\
    \ from the preceding section that it takes three parameters: ID, comment, and\
    \ name, for the entry ID, comment content, and name of the person making the comment.\
    \ The first step is to make sure that entry ID is valid:\n\n```\n<?php\nrequire_once(\"\
    blog_config.php\");\n\n$ID = intval($_REQUEST[\"ID\"]);\n/* Look up the blog posting;\
    \ make sure it’s real. */\n$query = \"SELECT title FROM blog_entries WHERE ID\
    \ = $ID\";\n$result = mysql_query($query, $connection) or die(mysql_error());\n\
    if (mysql_num_rows($result) != 1) {\n\theader(\"Location: blog_index.php\");\n\
    \texit;\n}\n```\n\nThen we sanitize the comments and name by removing all HTML\
    \ inside. If there’s still something left by the time we’re through with that,\
    \ we insert it into blog_comments table:\n\n```\n$name = mysql_escape_string(strip_tags($_REQUEST[\"\
    name\"]));\n$comment = mysql_escape_string(strip_tags($_REQUEST[\"comment\"]));\n\
    $comment = nl2br($comment);\n\nif (!empty($name) && !empty($comment)) {\n\t$query\
    \ = \"INSERT INTO blog_comments\n\t\t(ID, comment, name)\n\t\tVALUES ($ID, '$comment',\
    \ '$name')\";\n\tmysql_query($query, $connection) or die(mysql_error());\n}\n\
    ```\n\nWhen this is complete, we finish by sending the user back to the blog entry\
    \ page, which now (in theory) includes the user’s own two cents:\n\n```\nheader(\"\
    Location: blog_display.php?ID=$ID\");\n?>\n```\n\nThe only thing we’re missing\
    \ in our blog system now is an index page.\n\n# Creating a Blog Index\n\nThe greeting\
    \ page that shows the most recent blog entries is similar to the blog entry page,\
