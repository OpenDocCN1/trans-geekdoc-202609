- pgno: 58
  md: 'An intruder would need the function, the data, and the passphrase all at once—and
    if *that* is the case, they probably have complete access to your server, and
    you’re hosed anyway.


    There’s a small data storage format problem here. Mcrypt returns its encrypted
    data in an ugly binary format that causes horrific errors when you try to store
    it in certain MySQL fields. Therefore, we use the base64encode() and base64decode()
    functions to transform the data into a SQL-compatible alphabetical format and
    retrieve rows.


    # Hacking the Script


    In addition to experimenting with various encryption methods, you can add some
    convenience to this script. For example, rather than providing the key and mode
    every time, you could declare them as global constants in an included file (see
    “#1: Including Another File as a Part of Your Script” on page 2).


    # #24: Generating Random Passwords


    Random (but difficult-to-guess) strings are important in user security. For example,
    if someone loses a password and you’re using MD5 hashes, you won’t be able to,
    nor should you want to, look it up. Instead, you should generate a secure random
    password and send that to the user. Another application for random number generation
    is creating activation links in order to access your site’s services. Here is
    a function that creates a password:


    ```

    <?php

    function make_password($num_chars) {

    if ((is_numeric($num_chars)) &&

    ($num_chars > 0) &&

    (! is_null($num_chars))) {

    $password = '''';

    $accepted_chars = ''abcdefghijklmnopqrstuvwxyz1234567890'';

    // Seed the generator if necessary.

    srand(((int)((double)microtime()*1000003)));

    for ($i=0; $i<$num_chars; $i++) {

    $random_number = rand(0, (strlen($accepted_chars) -1));

    $password .= $accepted_chars[$random_number] ;

    }

    return $password;

    }

    }

    ?>

    ```'
