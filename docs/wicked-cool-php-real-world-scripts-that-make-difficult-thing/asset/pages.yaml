- pgno: 130
  md: "```\n$agent = explode(\"/\", $agent);\n$browser_info[\"version\"] = $agent[1];\n\
    ```\n\nFinally, if we're looking at a Gecko-based browser, we know that it's probably\
    \ Mozilla or a variant:\n\n```\n} else if (preg_match('/Gecko/i', $agent)){\n\
    \    $browser_info[\"name\"] = 'Mozilla';\n    $agent = stristr($agent, \"rv\"\
    );\n    $agent = explode(\"/\", $agent);\n    $agent = explode(\" \", $agent[1]);\n\
    \    $browser_info[\"version\"] = $agent[1];\n}\nreturn $browser_info;\n}\n```\n\
    \nAs previously mentioned, this function is about as clumsy as they come, because\
    \ it just haphazardly pokes away at the user agent string until it finds information\
    \ that looks halfway intelligible. Even when you have this function, you still\
    \ need to store the information somewhere and make sense of it. If you have access\
    \ to your own web log files, you should consider a log file analyzer solution\
    \ such as awstats (http://awstats.sourceforge.net/) that can extract a wealth\
    \ of information, including IP addresses and browsers.\n\n# #62: Session Timeouts\n\
    \nUsers should not stay logged in to high-security sites for prolonged periods\
    \ of time. If someone walks away from a session on a site such as PayPal, someone\
    \ else could walk up to the computer and move around some cash. Therefore, such\
    \ sites use session timeouts to automatically log out users who haven't done anything\
    \ for a short period of time (such as 10 minutes). It's important to note that\
    \ you shouldn't do this if the site does not require such high security, because\
    \ it is annoying to users.\n\nHere are two functions that implement session timeouts.\
    \ Notice that the timeout variables are in session variables—you can't trust this\
    \ information to a browser, so you must keep it on your own server. The first\
    \ function validates the login session:\n\n```\nfunction login_validate() {\n\
    \    /* Set the timeout on a login session. */\n    /* Default timeout is ten\
    \ minutes (600 seconds). */\n    @session_start();\n    $timeout = 600;\n    $_SESSION[\"\
    expires_by\"] = time() + $timeout;\n}\n```\n\nNOTE If you're confident that the\
    \ session has already started by the time you call this function, you can remove\
    \ the @session_start() call."
  merge: -1
  img_proc: true
- pgno: 131
  md: "The second function checks the current login to see if the session has expired.\
    \ If the session is valid, it resets the session timeout:\n\n```\nfunction login_check()\
    \ {\n @session_start();\n /* Checks for session activity timeout. */\n $exp_time\
    \ = intval($_SESSION[\"expires_by\"]);\n if (time() < $exp_time) {\n /* Session\
    \ still valid; refresh the time. */\n login_validate();\n return true;\n } else\
    \ {\n /* Session expired; remove session variable. */\n unset($_SESSION[\"expires_by\"\
    ]);\n return false;\n }\n}\n```\n\nThe reason for two separate functions is that\
    \ when the user logs in for the first time, you need to set the timeout for the\
    \ first time with login_validate(). Even though setting the timeout is a very\
    \ simple process, it's important to be consistent, because you may make things\
    \ more complicated later.\n\nUsing login_check() is fairly simple. Here's an example\
    \ of how you would protect pages that you need to access with a login at login.php:\n\
    \n```\n<?\n if (!login_check()) {\n header(\"Location: login.php\");\n exit(0);\n\
    \ }\n ?>\n```\n\nAs with any session-based user tracking, remember that you must\
    \ run session_start() at the beginning of the script, before any headers. These\
    \ functions ignore errors from session_start() because there may be previous invocations\
    \ of session_start().\n\n# #63: A Simple Login System\n\nOn certain websites,\
    \ you want a simple authentication system for administrative purposes. Smaller\
    \ sites with just a couple of administrators don't require a fully fledged login\
    \ system with individual usernames; you just want to keep out the riffraff. One\
    \ example of such a site would be \"#54: Uploading Images to a Directory\" on\
    \ page 97.\n\nHere is the code for single-user authentication. The general idea\
    \ is to set a session variable named $_SESSION[\"auth\"] to completed when logged\
    \ in.\n\nWe define the password first. As usual, we do not store plaintext passwords.\
    \ This one is an MD5 hash—you need to change the string to one that you generate\
    \ for yourself. You'll see how to do this shortly."
  merge: -1
  img_proc: true
- pgno: 132
  md: "```\n<?\n $enc_passwd = \"206bfaa5da7422d2f497239dcf8b96f3\";\n```\n\nNow let's\
    \ start by defining what to do when someone logs out (signified by a logout parameter).\
    \ First, we set the session variable to incomplete, send the user to a generic\
    \ page (here, index.php), and exit:\n\n```\nsession_start();\nif ($_REQUEST[\"\
    logout\"]) {\n    $_SESSION[\"auth\"] = \"incomplete\";\n    header(\"Location:\
    \ index.php\");\n    exit(0);\n}\n```\n\nIf the user is logging in, she'll do\
    \ it through a pwd parameter. To see if the password is correct, we MD5-hash the\
    \ parameter and compare the hash against the encrypted password. If everything\
    \ checks out, we validate the session variable and send the user to a home page.\
    \ You may not need to do this redirection depending on how your site sends form\
    \ parameters. However, the danger is always that you may be trying to change something\
    \ that requires a login, and then you log in, but as you are logging in, you lose\
    \ the original parameters that you were trying to work with. It's safer to send\
    \ new logins to some sort of home page.\n\n```\nif ($_REQUEST[\"pwd\"]) {\n  \
    \  if (md5($_REQUEST[\"pwd\"]) == $enc_passwd) {\n        $_SESSION[\"auth\"]\
    \ = \"completed\";\n        header(\"Location: index.php\");\n        exit(0);\n\
    \    }\n}\n```\n\nIf we've gotten to this point, we know that we're not logging\
    \ in or out, so all we have to do is check to see if the user is already logged\
    \ in. Remember that this is in the $_SESSION[\"auth\"] variable, so we check that.\
    \ If the user is not logged in, we give the user the opportunity to log in by\
    \ printing a login form, and then exit. You could also do this by redirecting\
    \ the user to a special login page if you want to make it look better, but it's\
    \ important that you always exit after redirecting or printing the form. Past\
    \ this point you don't want to let PHP do anything that a logged-in user is able\
    \ to do!\n\n```\n$authed = $_SESSION[\"auth\"];\nif ($authed != \"completed\"\
    ) {\n    ?><html><head></head><body>\n    <form method=\"post\">\n    Enter password:\
    \ <input type=\"password\" name=\"pwd\" />\n    </form>\n    </body></html><?php\n\
    \    exit(0);\n}\n?>\n```"
  merge: -1
  img_proc: true
- pgno: 133
  md: 'To use this script, call it login.php and require it at the beginning of any
    script that should have authentication. When a client first encounters the page,
    the script prints a login form and exits before giving any other code a chance
    to run.


    To set a new password for the script, run this script to generate the new password''s
    hash, and then set the $enc_passwd string to the output:


    ```

    <\?

    print md5("newpassword");

    \?>

    ```


    Remember that this is a very simple login system. You can augment it by adding
    the session timeout code from the preceding section, but if you find yourself
    asking for more features, you probably want to start from a fully tested login
    system. There are several free systems available on the Internet—they''re definitely
    worth checking out.'
  merge: -1
  img_proc: true
- pgno: 134
  md: "# 9\n\n# WORKING WITH EMAIL\n\n![](img/19183d2b75bf6b509317c631c0e7b817_134_0.png)\n\
    \nYou won't need to manipulate much email in PHP, but one thing that you will\
    \ need to do is send confirmation messages to users and administrators about account\
    \ settings, orders, and so on. The easiest way to send email in PHP is with the\
    \ mail() function. If your mail server is set up correctly, and you need only\
    \ to send messages to yourself, then this is probably the only function you'll\
    \ ever need.\n\nHere's a simple script to illustrate how mail() works. Replace\
    \ user@example.com with a working email address:\n\n```\nif (mail('user@example.com',\
    \ 'PHP email test', 'It worked!')) {\n    echo \"Mail sent.\";\n} else {\n   \
    \ echo \"Mail delivery failed.\";\n}\n```"
  merge: -1
  img_proc: true
- pgno: 135
  md: 'If this script says *Mail sent.* when run, check the target email to verify
    that it actually did work. The subject should be *PHP email test* and the body
    should be *It worked!*


    The `mail()` function, like any other system that sends email, is susceptible
    to problems in the mail-delivery system. You may need to fix your mail server''s
    configuration to get things working. However, because there is so much junk in
    email now, a malformed or irregular mail header may cause a remote server to reject
    your email without telling you. In addition, when you send attachments or add
    HTML text, you have to do a lot more work. The next section shows you how overcome
    these problems with PHPMailer.


    # #64: Using PHPMailer to Send Mail


    PHPMailer is an open source email package that supports attachments, multiple
    recipients, SMTP authentication, and a large number of other features. It''s well
    tested and relatively easy to use and upgrade. You need only include the core
    PHPMailer file as a part of your script, and you''re ready to go.


    # Installing PHPMailer


    Just follow these steps to install PHPMailer:


    +   1. Download the core PHPMailer files from http://phpmailer.sourceforge.net/.

    +   2. Create a directory called *phpmailer* on your server to store the core
    PHPMailer files.

    +   3. Extract the PHPMailer files into the phpmailer directory.

    +   4. Determine your mail transport method. PHPMailer has three different methods
    to send email: `mail`, `sendmail`, and `smtp`. The default is `mail`, which uses
    the PHP `mail()` function discussed in the preceding section. It''s the easiest
    to configure, assuming that your webserver''s mail is configured correctly. If
    this method doesn''t work, you have two remaining options:

    +      a. You can provide PHPMailer with an SMTP server to talk to. SMTP stands
    for Simple Mail Transfer Protocol, the most common protocol for transporting email
    messages. To configure PHPMailer for SMTP, you need the SMTP server hostname.
    If the server requires SMTP authentication (as most do), you need a username and
    password for that server. Your ISP will be able to tell you the details about
    its SMTP server settings.

    +      b. If your webserver uses `sendmail` or a package with a `sendmail`-compatible
    binary (such as Postfix) you can configure PHPMailer to use this to send mail.
    You need to know the `sendmail` binary location where the core `sendmail` executable
    resides. It''s usually `/usr/sbin/sendmail` or `/usr/lib/sendmail`.'
  merge: -1
  img_proc: true
- pgno: 136
  md: "5. Adjust the PHPMailer default settings by editing the class.phpmailer.php\
    \ file. You'll want to change the settings in the Public Variables section at\
    \ the top of the file. The most important settings are as follows:\n\n+   - var\
    \ $Mailer = \"mail\"; The method PHPMailer uses to send email. Set this to mail,\
    \ sendmail, or smtp, as determined in step 4.\n+   - var $From = \"root@localhost\"\
    ; The default origin email address.\n+   - var $FromName = \"Root User\"; The\
    \ default name associated with the default email address.\n+   - var $Host = \"\
    \"; The SMTP server you want to use when using SMTP to connect. Check with your\
    \ ISP for details. You can list multiple SMTP servers separated by semicolons\
    \ (;) in case the first SMTP server is down or rejects the email.\n+   - var $SMTPAuth\
    \ = false; If your SMTP server requires authentication to send emails, set this\
    \ to true. If you set this, you must also set the following two variables.\n+\
    \   - var $Username = \"\"; When using SMTP authentication, the username on the\
    \ SMTP server.\n+   - var $Password = \"\"; The password associated with $Username,\
    \ if necessary.\n+   - var $Helo = \"\"; The name of your webserver, such as www.example.com.\n\
    \nAfter changing any necessary configuration variables, you're ready to see a\
    \ simple script that sends a test message.\n\n# Using the Script\n\nMake sure\
    \ the class.phpmailer.php file is in your include path, and try this script:\n\
    \n```\n<?php\ninclude_once(\"class.phpmailer.php\");\n$mail = new PHPMailer();\n\
    $mail->ClearAddresses();\n$mail->AddAddress('theferrett@theferrett.com', 'The\
    \ Ferrett');\n$mail->From = 'you@example.com';\n$mail->FromName = 'Your Name';\n\
    $mail->Subject = 'Test Message Subject';\n$mail->Body = 'This is the test message\
    \ body.';\nif ($mail->Send()) {\n    echo \"Message sent.\";\n} else {\n    echo\
    \ $mail->ErrorInfo;\n}\n?>\n```"
  merge: -1
  img_proc: true
- pgno: 137
  md: 'PHPMailer has an object-oriented interface. You need to create an object ($mail
    in the preceding example) and then set some attributes and call some methods to
    set up the message. When you''ve finished, use the object''s Send() method to
    send the message. This method returns true if PHPMailer was able to hand the message
    to its delivery agent. If there was a problem at this stage, you''ll find the
    details in the ErrorInfo variable.


    Here is an overview of the methods and attributes used in the example:


    ```

    $mail->AddAddress(email_address, real_name)

    ```


    Add a recipient for the current message. email_address is the address of the recipient,
    and real_name is the real name of the recipient (or, at least, what you''d rather
    call the recipient).


    ```

    $mail->ClearAddresses()

    ```


    This line clears the current recipient address list. Because the AddAddress()
    method doesn''t remove previous addresses, you run the risk of sending a message
    to someone many times if you send messages in a loop using a single PHPMailer
    object. Therefore, you should get into the habit of clearing the recipient list
    before you do anything with a message or after you call the Send() method.


    ```

    $mail->isHTML = true|false

    ```


    If this attribute is set to true, PHPMailer uses HTML instead of plaintext. You
    can embed pretty pictures with HTML, but not all mail clients want to support
    HTML. See the following attribute if this is a problem.


    ```

    $mail->AltBody = text

    ```


    If you set the isHTML attribute to true, you can set the AltBody attribute to
    a text-only equivalent of the message body.


    # Adding Attachments


    If you want to attach files to messages, use this method:


    ```

    $mail->AddAttachment(path, name, encoding, type)

    ```


    The parameters are as follows:


    **path**   The full pathname of the file that you want to attach.

    **name**   The new name for the attached file. For example, if the file is called
    011100.jpg on your system, but you want it to be called product_sample.jpg, set
    this parameter to product_sample.jpg. This parameter is'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'optional, but you should always include it in order to make certain that you
    cause the recipient''s client to save the attachment correctly.


    encoding The attachment''s encoding. The default is base64, which is perfect for
    binary attachments.


    type The MIME type of the attachment. The default is application/octet-stream,
    which is fine for most files. In certain cases, you may want to change this setting.
    For example, image/jpeg is appropriate for JPEG images. However, unless you know
    what you''re doing, it''s best to leave this setting alone and let the recipient''s
    email client figure it out.


    To send the message with the attachment, use the normal PHPMailer Send() method.
    If you need to clear the attachments in an object (for example, if you''re iterating
    through recipients and each has a unique attachment), use this method:


    ```

    $mail->ClearAttachments()

    ```


    Finally, if you have an attachment in a PHP variable, you can use the AddStringAttachment()
    method to include an attachment. It''s just like AddAttachment(), but instead
    of the path parameter, use a PHP string or variable instead.


    # What Can Go Wrong?


    If you''re using the mail() function to send mail, you need to make sure that
    PHP can actually do so. If it cannot, use SMTP or sendmail instead.


    When using STMP to send email, you might get this error message:


    ```

    SMTP Error: The following recipients failed [email@example.com]

    ```


    In most cases, this means that there was an error connecting to the SMTP server.
    You could have mistyped the SMTP hostname, or the SMTP server might be down. However,
    the most common case is that the server requires SMTP authentication. Make sure
    that SMTPAuth is set to true, set the correct username and password for that server,
    and try again.


    It''s important to remember that email can be complicated. There are a thousand
    reasons a given email might not go through to a specific address. The email address
    could be incorrect, your server could be blacklisted as a spam server, or a server
    may not like your attachments—and that''s just the beginning.


    The best way to debug a problem is to start with a plaintext message to an address
    that is known to work. From there, you can delve into server logs to find particular
    problems.'
  merge: -1
  img_proc: true
- pgno: 139
  md: "# #65: Using Email to Verify User Accounts\n\nOn sites that have user accounts,\
    \ some people create accounts just to cause trouble. Perhaps someone will post\
    \ a bunch of ridiculous comments to your bulletin board or try to overwhelm some\
    \ other part of your system. A common problem with online stores is that someone\
    \ may place an order and use a fake email address because he or she doesn't want\
    \ to be spammed, making it difficult for you to reach that person if you need\
    \ to ask a question about the order.\n\nOne fairly effective way to verify that\
    \ your users are real is to force them to validate an email address. When you\
    \ first create the user account, keep it disabled until the user clicks on a verification\
    \ link in an email message. Accessing the link activates the account.\n\nThis\
    \ section illustrates a system that keeps track of new users who haven't yet activated\
    \ their accounts. When a user tries to log in to your system, you can first check\
    \ to see if the account hasn't been activated. You need the following components:\n\
    \n+   • A MySQL database\n\n+   • A pending_logins table with two fields: a login\
    \ and a key. You can create this table with the following SQL (we're using a field\
    \ called ukey because key is a reserved keyword):\n\n```\nCREATE TABLE pending_logins\
    \ (\n 'login' varchar(32), 'ukey' varchar(32),\n PRIMARY KEY ('login'),\n INDEX\
    \ (ukey));\n```\n\n+   • PHPMailer, already installed and in the phpmailer directory\n\
    \nThere are three functions in all: a verification generator, an activator, and\
    \ a verifier. All of these functions assume that you have already validated the\
    \ login name as a MySQL-safe string, because they always appear inside other code.\
    \ Let's first look at the verification-generator function. You need to place a\
    \ call into your account-generation code to generate a key for unlocking the account\
    \ and then send that key to the user's email address. The first part generates\
    \ a random 32-character string of lowercase letters to serve as a key to unlock\
    \ the account:\n\n```\nfunction make_verification($login, $email, $db) {\n /*\
    \ Generate an account verification link and send it to the user. */\n /* Generate\
    \ key. */\n $key = \"\"; $i = 0;\n while ($i < 32) {\n $key .= chr(rand(97, 122));\n\
    \ $i++;\n }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 140
  md: "Next we place the key in the pending_logins table. Because the login is\nthe\
    \ primary key, and therefore multiple rows per login are not allowed, we\nmake\
    \ sure that there are no preexisting rows; then we insert the data into\nthe table:\n\
    \n```\n/* Place the key in the table; first delete any preexisting key. */\n$query\
    \ = \"DELETE FROM pending_logins WHERE login = '$login'\";\nmysql_query($query,\
    \ $db);\n$query = \"INSERT INTO pending_logins (login, ukey) VALUES ('$login',\n\
    '$key')\";\nmysql_query($query, $db);\nif (mysql_error($db)) {\n    print \"Key\
    \ generation error.\";\n    return false;\n}\n```\n\nNow we need to generate the\
    \ URL that the user must visit to activate\nthe account. Obviously, you'll need\
    \ to change this to your own server name\nand activation script, but make sure\
    \ that you send the key as a parameter\nsomewhere:\n\n```\n/* Activation URL */\n\
    $url = \"http://accounts.example.com/activate.php?k=$key\";\n```\n\nAll that's\
    \ left to do is send the email to the user. You'll likely want to\ncustomize this\
    \ part as well.\n\n```\ninclude_once(\"phpmailer/class.phpmailer.php\");\n$mail\
    \ = new PHPMailer();\n$mail->ClearAddresses();\n$mail->AddAddress($email, $login);\n\
    $mail->From = 'generator@example.com';\n$mail->FromName = 'Account Generator';\n\
    $mail->Subject = 'Account verification';\n$mail->Body = \"To activate your account,\
    \ please click\non the account generation URL below:\n\n$url\n\";\nif ($mail->Send())\
    \ {\n    print \"Verification message sent.\";\n} else {\n    print $mail->ErrorInfo;\n\
    \    return false;\n}\nreturn true;\n```"
  merge: -1
  img_proc: true
- pgno: 141
  md: "To use this function, call it as follows (`db` is a MySQL database handle that\
    \ you have opened previously). It returns true if the account was placed in the\
    \ pending_logins table and PHPMailer was able to send the activation message:\n\
    \n```\nmake_verification(login, email_address, db)\n```\n\nNow that we have the\
    \ verification part out of the way, the next part is a function to activate an\
    \ account when the user clicks on the link. The first thing to do is to sanitize\
    \ the key sent to us in case the user goofed up or someone is trying to break\
    \ in. Because the generator used only lowercase characters, we'll just throw out\
    \ anything that doesn't fit:\n\n```\nfunction activate_account($key, $db) {\n\
    /* Activate an account based on a key. */\n\n/* Clean up the key if necessary.\
    \ */\n$key = preg_replace(\"/[^a-z]/\", \"\", $key);\n```\n\nNow we see if the\
    \ key is bogus or not. If it's not even in the pending_logins table, there's nothing\
    \ to do, and we return false to indicate that we didn't do anything:\n\n```\n\
    $query = \"SELECT login FROM pending_logins WHERE ukey = '$key'\";\n$c = mysql_query($query,\
    \ $db);\nif (mysql_num_rows($c) != 1) {\n    return false;\n}\n```\n\nIf we get\
    \ this far, we know that the key exists in the table, so all we need to do is\
    \ remove that row to activate the login. Notice that we don't even need to know\
    \ what the login name is.\n\n```\n$query = \"DELETE FROM pending_logins WHERE\
    \ ukey = '$key'\";\nmysql_query($query, $db);\nif (mysql_error($db)) {\n    return\
    \ false;\n}\nreturn true;\n}\n```\n\nTo use this function, call it as follows:\n\
    \n```\nactivate_account($_REQUEST[\"k\"], $db)\n```"
  merge: -1
  img_proc: true
- pgno: 142
  md: "The final piece is a function that you need to place inside your user login\
    \ code to determine whether the account is active or not. If an account has not\
    \ been activated, it has a row in the pending_logins table. Therefore, you need\
    \ only look up a username in that table:\n\n```\n```\nfunction is_active($login,\
    \ $db) {\n  /* See if an account has been activated. */\n  $query = \"SELECT count(*)\
    \ AS c FROM pending_logins WHERE login = '$login'\";\n  $c = mysql_query($query,\
    \ $db);\n  if (mysql_error($db)) {\n    return false;\n  }\n  $r = mysql_fetch_array($c);\n\
    \  if (intval($r[\"c\"]) > 0) {\n    return false;\n  }\n  return true;\n}\n```\n\
    ```\n\nThere are many things you may need to do to this system to make it fit\
    \ in with your site. For example, you can add a timestamp field to the table so\
    \ that you can cull inactive accounts that are never verified. There may be many\
    \ other reasons to deactivate an account; in that case, you need to store a reason\
    \ for deactivation in the table. You may even want to include the activation key\
    \ in the main login table. The activation mechanism illustrated here is specifically\
    \ meant to plug into foreign login systems with minimal pain."
  merge: -1
  img_proc: true
