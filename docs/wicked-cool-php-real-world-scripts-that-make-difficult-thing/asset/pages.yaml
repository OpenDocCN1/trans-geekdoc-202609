- pgno: 95
  md: "# # #43: Automatically Hyperlinking URLs\n\nMost forum and blog software automatically\
    \ convert URLs in posts and comments into hyperlinked text. You could probably\
    \ think of a simple way to implement this feature in your own site by matching\
    \ http:// and then using a backreference to add an anchor tag around it. However,\
    \ what if someone is actually using an anchor tag? Then you'd get a real mess!\n\
    \nTherefore, you need to think of a way to make sure that the URL is not already\
    \ inside an anchor tag. You might think of using the grouping modifier ?!, which\
    \ says reject anything that matches this group. However, this works in a regular\
    \ expression only if the unwanted group follows what you want to match, because\
    \ of the way regular expressions work—they consume input one character at a time\
    \ and never look back. Therefore, you need a feature called a lookbehind assertion\
    \ that essentially states check this condition when you get a match later on in\
    \ the regular expression. To denote a negative lookbehind assertion, use a ?<\
    \ ! grouping modifier.\n\nThis said, here's the code for autolinking URLs, where\
    \ we don't want to disturb anything that is prefixed by the href=\" that you'd\
    \ find in an anchor tag:\n\n```\n```php\npreg_replace('|(?!<href=\")(https?://[A-Za-z0-9\\\
    +=-._/*]@\\'$:;&!%?+]+)|i',\n     '<a href=\"$1\">$1</a>',\n     $string);\n```\n\
    ```\n\nMost of this regular expression is a character class containing the valid\
    \ characters in a URL. Obviously, there are numerous variations on this theme—checking\
    \ for valid domains, looking for exceptions on other weird HTML, looking for a\
    \ trailing dot or comma, and so on. You probably needn't get too carried away.\n\
    \n# # #44: Stripping HTML Tags from Strings\n\nRegular expressions are useful,\
    \ but they're not the solution to every problem. Let's say that you plan to display\
    \ possibly HTML-rich text inside another HTML page, and you need to strip out\
    \ any possibly harmful HTML. Use the strip_tags() function:\n\n```\n```php\n<?php\n\
    \ print strip_tags($string);\n ?>\n```\n```\n\nTo add a few tags that you think\
    \ users should be able to use, add an extra string parameter containing the open\
    \ tags that you want to permit:\n\n```\n```php\nprint strip_tags($string, \"<i><b><p>\"\
    );\n```\n```\n\nThis function is just one of many text-processing functions that\
    \ PHP offers as an alternative to regular expressions or other do-it-yourself\
    \ solutions. It's always worth a trip to the PHP manual to see if there's a built-in\
    \ for your needs. But don't be afraid to get your hands dirty when necessary."
  merge: -1
  img_proc: true
- pgno: 96
  md: '# WORKING WITH DATES


    ![](img/19183d2b75bf6b509317c631c0e7b817_96_0.png)


    This chapter shows you how to work with dates and times with PHP. Web programs
    often involve an extensive amount of extraction, manipulation, comparison, and
    display of dates. The task gets more involved when you add MySQL to the mix. But
    first, let’s talk about the native time format on your server.


    # How Unix Time Works


    Before going into detail about how to work magic with dates, I have to get into
    the basics of how POSIX-compliant Unix/Linux servers (and thus, PHP) keep time.
    Fortunately, it''s a fairly simple system.


    Midnight, January 1, 1970, is when time “began” for Unix computers. In Unix parlance,
    that timestamp is 0, and it’s called the epoch date.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Any date since then is calculated as the number of seconds that have elapsed
    between January 1, 1970, and that time. For example, as I write this at 12:17:25
    PM on January 11, 2008, 1,200,082,645 seconds have passed since that fabled date.
    Thus, the timestamp as I write this is—you guessed it—1200082645.


    This scheme makes manipulating dates in PHP relatively easy as long as you don’t
    need to show the date in a readable format. For example, you can jump ahead a
    day by adding (60 x 60 x 24) seconds to the current timestamp or go back one hour
    by subtracting 3,600 seconds. Table 6-1 is a handy chart to reference when working
    with timestamps.


    # Table 6-1: Common Time Increments as Measured in Seconds


    | Seconds | Time |

    | --- | --- |

    | 60 | One minute |

    | 3,600 | One hour |

    | 28,800 | Eight hours |

    | 86,400 | One day |

    | 604,800 | One week |


    Because the timestamp is just a number, you can easily compare two timestamps.
    If one timestamp is greater than a second timestamp, then the first timestamp
    corresponds to the later date of the two. This is particularly handy when you
    compare against the current timestamp.


    In addition to extracting, manipulating, and storing timestamps, this chapter
    shows you how to convert them to readable dates and get other details, such as
    the day of the week. In addition, we’ll touch on how to work with date formats
    in MySQL.


    # #45: Getting the Current Timestamp


    To get the current timestamp, call the time() function with no arguments. The
    return value is the current timestamp on the server. This simple example prints
    the current time:


    ```

    echo ''The current timestamp is '' . time();

    ```


    You can also assign the returned value of the timestamp() function to variables,
    like so:


    ```

    $time = time();

    ```


    Many PHP date-related functions take a timestamp argument, and most of them use
    the current time if you don’t supply that parameter. For example, the date() function
    returns a formatted date string in a custom format (like Nov 1, 2006), by using
    the syntax date("format", timestamp). But if you don’t'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'give it a timestamp, the default is the current time. This means that for most
    of the time functions, you don’t even need to include time() as a parameter if
    you want to work with the current timestamp.


    **NOTE** A timestamp is always expressed as UTC (Coordinated Universal Time, a
    very precise worldwide time standard). However, date/time display functions use
    your server’s time zone to figure out the local time to display. For example,
    a timestamp of 1136116800 would be 1:00 AM on a Middle European Time (MET) server,
    but 7:00 PM the previous day on a server set using Eastern Standard Time.


    # #46: Getting the Timestamp of a Date in the Past or Future


    Now that you know how to get the current timestamp, let’s explore how to determine
    some other timestamps close to the current time. For example, you can extract
    yesterday’s timestamp or, say, next Friday’s. There are two general methods for
    finding these values:


    +   - Determining the timestamp based on a string

    +   - Determining the timestamp from date values (which can be a bit trickier)


    # Creating Timestamps from a String


    The strtotime() function can sometimes be a PHP programmer’s best friend. Just
    as its name suggests, strtotime() generates a timestamp from an English date-phrase,
    such as April 1 or Friday. These strings can be either relative to the current
    date or absolute. Table 6-2 outlines some of the possibilities.


    | Invocation | Output (as a timestamp) |

    | :--- | :--- |

    | strtotime("Friday") | Friday at midnight |

    | strtotime("+1 week Friday") | The Friday after next at midnight |

    | strtotime("+1 week") | A week from right now |

    | strtotime("-2 months") | Two months ago from right now |

    | strtotime("October 1, 2008") | October 1, 2008, at midnight |

    | strtotime("2008-10-01") | October 1, 2008, at midnight |

    | strtotime("Friday 12:01 p.m.") | Friday at 12:01 PM |

    | strtotime("+7 days 12:01 p.m.") | Seven days from now at 12:01 PM |


    Although most date formats work with strtotime(), some cause strtotime() to choke—and
    it’s not always obvious which ones work and which ones don’t. For example, strtotime("2008-10-01")
    works fine, but strtotime("10-01-2008") produces a weird time that translates
    to June 28, 2015. For consistent results, use full ISO 8601–compliant dates (see
    http://www.cl.cam.ac.uk/~mgk25/iso-time.html), which take the form of YYYY-MM-DD.
    This format is particularly important because it is one of several that MySQL
    understands, as you will see in “MySQL Date Formats” on page 90.'
