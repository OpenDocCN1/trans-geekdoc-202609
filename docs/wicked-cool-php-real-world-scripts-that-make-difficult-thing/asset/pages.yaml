    # Hacking the Script


    There are a number of things you can do to adapt this system for your own needs.
    First, you need a graphical interface for poll administration. You should have
    the ability not only to create new polls but also to activate or disable polls.


    You can make the poll embeddable. That is, instead of having the poll come up
    in its own page, you can transform the poll into a set of functions. Then, when
    displaying a page, you can put the ballot in place with a <div> tag. The best
    part of an embedded poll is that you can make the results AJAX enabled. When the
    user clicks the Vote button, have the browser run JavaScript code that casts the
    vote and then replaces the ballot with the poll results.


    Finally, you could think about other ways to ensure that users do not vote twice.
    To do so, you need to couple the vote table with a login system. Add an indexed
    field for a login ID, and then check this table instead of using a cookie to see
    if the user has already voted.


    # #75: Electronic Greeting Cards


    Electronic greeting cards have been around almost since the Web became popular.
    They’re nothing fancy. Just come up with some card content, add some code to display
    the content, then add a few features, such as notification of pickup, and you’ve
    got an e-card service.


    The system in this section consists of four scripts. As with the preceding section,
    they contain a minimum amount of code; you can customize them as you see fit.


    +   - **card_choose.php** Displays available cards

    +   - **card_send.php** Presents a form for sending a particular card and sends
    the card

    +   - **card_show.php** Displays the card to the recipient and notifies the sender
    that it has been viewed

    +   - **card_include.php** Sets up the database connection and includes a utility
    function'
