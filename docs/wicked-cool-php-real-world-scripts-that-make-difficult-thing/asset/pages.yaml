- pgno: 60
  md: '# 4


    # WORKING WITH FORMS


    ![](img/19183d2b75bf6b509317c631c0e7b817_60_0.png)


    Forms are how your users talk to your scripts. To get the most out of PHP, you
    must master forms. The first thing you need to understand is that although PHP
    makes it easy to access form data, you must be careful of how you work with the
    data.


    # Security Measures: Forms Are Not Trustworthy


    A common mistake that novices make is to trust the data provided by an HTML form.
    If you have a drop-down menu that only allows the user to enter one of three values,
    you must still check those values. As mentioned in Chapter 3, you also cannot
    rely on JavaScript to stop people from sending whatever they like to your server.
    Your site’s users can write their own form in HTML to use against your server;
    users can also bypass the browser entirely and use automatic tools to interact
    with web scripts. You should assume that people will mess around'
