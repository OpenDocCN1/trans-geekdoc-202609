- pgno: 69
  md: "This function has two main stages. The first determines card type, and the\
    \ second determines whether the card checksum is correct. If the card passes both\
    \ tests, the return value is the card type as a string. If a card is invalid,\
    \ you get false (you can change this return value to whatever you like with the\
    \ $false variable).\n\nThe first stage is where the big trick comes in, where\
    \ we determine the card type and confirm the prefix in one quick step. Credit\
    \ card numbers follow a certain format. For example, all Visas start with 4 and\
    \ have 13 or 16 digits, all MasterCards start with 51 through 55 and have 16 digits,\
    \ and all American Express cards start with 34 or 37 and have 15 digits. These\
    \ rules are easily expressed in a few regular expressions, and because they are\
    \ unique rules, we can map the regular expressions to card types in an array called\
    \ $card_regexes. To check for a valid format, we just cycle through the regular\
    \ expressions until one matches. When we get a match, we set $card_type and move\
    \ to the next stage. If no expressions match, we return failure.\n\nThe checksum\
    \ test for the credit card number uses a mod 10 algorithm, a reasonably simple-to-implement\
    \ check that does the following:\n\n+   • It starts with a checksum value of 0.\n\
    +   • It runs through the credit card number digit-by-digit from right to left.\n\
    +   • If the current digit has an odd index (that is, every other digit, starting\
    \ at index 0), the digit is doubled. If the value of the doubled digit is over\
    \ 9, the two numbers are added together and added to the checksum (so an 8 becomes\
    \ 16, which becomes 1 + 6, which becomes 7). Otherwise the current (doubled if\
