- pgno: 77
  md: "# #35: Making a String Uppercase, Lowercase, or Capitalized\n\nOne occasional\
    \ problem with PHP is that MySQL supports case-insensitive character fields, but\
    \ strings in PHP are case sensitive. In a query, MySQL makes no distinction between\
    \ the words *Ferrett*, *FERRETT*, and *FerReTt*, but as strings in PHP, they have\
    \ nothing in common. So in PHP you may need to change the case of characters in\
    \ a string before you compare or print them.\n\nPHP has three essential functions\
    \ that convert string case: `strtolower()`, `strtoupper()`, and `ucwords()`. Here\
    \ is a sample of them in action:\n\n```\n<?\n$string = \"hey h0w arE yoU doinG?\"\
    ;\necho strtoupper($string);\n// Displays \"HEY HOW ARE YOU DOING?\"\n\necho strtolower($string);\n\
    // Displays \"hey how are you doing?\"\n\necho ucwords(strtolower($string));\n\
    // Displays \"Hey How Are You Doing?\"\n?>\n```\n\nThe functions work as follows:\n\
    \n+   * `strtoupper()` changes all of the characters in a string to uppercase.\n\
    +   * `strtolower()` changes all of the words in a string to lowercase.\n+   *\
    \ `ucwords()` converts the first letter of each word in a string to uppercase.\n\
    \n**NOTE** *Notice that this script has a small trick; we used strtolower() before\
    \ using ucwords(). Otherwise, the output would be HeY HOw ArE YoU DoinG?*\n\n\
    # What Can Go Wrong?\n\nThere are a few hitches with `ucwords()`; the first is\
    \ that it doesn’t capitalize letters after a nonletter character, so a string\
    \ like *mrs. johnston-brown* would become *Mrs. johnston-brown* and *ac/dc* would\
    \ be *Ac/dc*. If this bothers you, then you can create a function that uses regular\
    \ expressions to explode the given string into an array of its individual words,\
    \ then use `ucwords()` to capitalize each word, and finally join it back together\
    \ into a single string.\n\nA second concern is that `ucwords()` capitalizes certain\
    \ words that shouldn’t be capitalized, such as *and*, *or*, and *a*. If you want\
    \ to use proper headline style, you can write a simple function that uses `str_replace()`\
    \ to fix these words:\n\n```\n<?\nfunction fussy_capitalize($string) {\n    //\
    \ Uppercase, but leave certain words in lowercase\n    $uppercase_words = array(\"\
    Of \", \"A \", \"The \", \"And \", \"An \", \"Or \");\n```"
  merge: -1
