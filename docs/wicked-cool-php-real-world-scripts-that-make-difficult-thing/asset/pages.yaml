- pgno: 76
  md: "To see how you can use substrings in everyday programming, let's go back to\
    \ the Shivan Dragons example. Recall that users might search for Shivan Dragons,\
    \ but a single item may have a listing for Shivan Dragon. This code fragment shows\
    \ one way to deal with this situation:\n\n```\n$sql = \"SELECT * FROM product_table\
    \ WHERE product_name = '$user_input'\";\n$result = @mysql_query($sql, $connection);\n\
    \nif (mysql_num_rows($result) == 0) {\n    // There were zero rows in the result\
    \ set (no matching products).\n    if (substr($user_input, -1) == 's') {\n   \
    \     // The last character in the string is an \"s\".\n        $user_input =\
    \ substr_replace($user_input, '', -1);\n        // Remove last character in the\
    \ string (the s).\n        // Do another SQL query with the updated $user_input.\n\
    \        $sql = \"SELECT * FROM product_table WHERE product_name = '$user_input'\"\
    ;\n        $result = @mysql_query($sql, $connection);\n    }\n}\n```\n\nThis algorithm\
    \ first checks the inventory against the string in $user_input. If there are no\
    \ matches _and_ the last character of $user_input is an s, it tries again without\
    \ the s. Regardless of the last character, after running the algorithm you can\
    \ examine the query result in $result.\n\n# Hacking the Script\n\nOne problem\
    \ with this fragment is that you may have inventory under both Shivan Dragons\
    \ and Shivan Dragon. As is, the script returns results for only one of these cases,\
    \ and the search results are inconsistent, depending on the availability of the\
    \ plural. For example, if you have one item listed as Shivan Dragons and two listed\
    \ at Shivan Dragon, you’ll get just the first item, but without the first item\
    \ in the inventory, you’d get the other two.\n\nYou can add this functionality\
    \ by using the substr() check to add to your SQL query instead of replacing it\
    \ entirely. Here's how:\n\n```\n$sql = \"SELECT * FROM product_table WHERE product_name\
    \ = '$user_input'\";\nif (substr($user_input, -1) == 's') {\n    // The last character\
    \ in the string is an \"s\".\n    // Add another possibility to the WHERE clause.\n\
    \    $sql .= \" OR product_name = '' . substr_replace($user_input, '', -1) . ''\"\
    ;\n}\n$result = @mysql_query($sql, $connection);\n```\n\nThis is a considerably\
    \ different approach, because it involves using a single SQL query to do all the\
    \ work. Instead of trying a second query only when the first fails, the idea is\
    \ to add another part to the OR clause in the query if the user input ends with\
    \ an s."
  merge: -1
