- pgno: 86
  md: 'You can find many others in the PHP manual, but these are the essentials.


    # # Pattern Repeaters


    Now it’s time to start unlocking the real power of regular expressions by specifying
    how patterns can repeat. Let’s start with the asterisk character (*), which means
    *match zero or more of whatever character or subexpression precedes the *. For
    example, the expression /fr*ed/ matches fed, fred, fried, frrred, and so on.


    Combine this with the dot character and you have a DOS-style wildcard; /fr.*ed/
    matches any string with an fr followed by any characters, and followed by ed;
    this includes fred, fried, fritterpated, and endless others.


    The plus sign (+) repeater is similar, except that it means *one or more* instead
    of *zero or more*. Therefore, /fr.+ed/ does not match fred, but it matches anything
    else that /fr.*ed/ can.


    The question mark (?) repeater means zero or one. For example, /photo-?synthesis/
    matches photosynthesis and photo-synthesis.


    Finally, you can specify a custom number of repetitions by using curly braces
    ({}). /fr.{3}ed/ matches anything containing fr, followed by three arbitrary characters,
    followed by ed. You can specify minimum and maximum occurrences as well; for example,
    {3,5} means *three to five instances*.


    **NOTE** *Remember that you need to use a backslash if you want one of these characters
    literally! For example, to match fred?, use /fred\\?/, not /fred?/.*


    # # Grouping


    The next regular expression trick we’ll look at is how to group a series of characters
    in parentheses. The grouping simply means that you can use a repeater for a subexpression
    rather than a single character. For example, in the expression /f(re)+d/, the
    (re)+ means to match re one or more times. Therefore, the whole expression matches
    fred, fre red, freered, and so on.


    Another feature that you often see inside groupings is the pipe (|) to tell PHP
    to match on either the left or the right side of the pipe. The expression /milk
    (and|or) meat/ matches both *milk and meat* and *milk or meat*. Another slightly
    more advanced example is /fred(ing|ed)?/, which matches *freding*, *freded*, and
    *fred*.


    # # Character Classes


    The final syntax that we’ll explore is how to use square brackets ([ ]) to create
    a character class; that is, a set of characters that can pass as a single-character
    match. Use a dash to indicate a range of characters; for example, [0-9] matches
    any number of numeric characters, and [0-9a-fA-F] matches any hexadecimal character.


    Using a caret (^) as the first character within a set of square brackets creates
    an inverted character class; that is, it will match everything except the characters
    in the brackets. For example, [^0-9] matches anything that’s not 0 through 9.'
