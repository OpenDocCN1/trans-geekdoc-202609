    # #29: Using Multiple Submit Buttons


    Occasionally you want a form that does two separate things depending on which
    button a user clicks—one button updates a post while the other button deletes
    it. You can put two forms on one page that will send the user to two separate
    pages, but then you have to worry about inserting redundant information into both
    forms, not to mention that this would be unbearable to the user.


    In HTML, buttons also have values, and you can read those values. Construct your
    form as follows:


    ```

    <form action="process.php" method="post">

    <input name="postid" type="hidden" value="1234">

    <input name="action" type="submit" value="Update">

    <input name="action" type="submit" value="Delete">

    </form>

    ```


    Now, in process.php, access $_POST[''action''] to get the button the user clicked.


    # #30: Validating a Credit Card


    Here’s a brief overview of how online credit card transactions work. First, you
    need to find a merchant solution (an online provider, such as Authorize.net or
    Secpay.com) that provides you with a merchant account. This account is like a
    bank account, except that it allows you to process charges for credit card transactions.
    The merchant provider typically charges a per-transaction fee for each credit
    card action.


    If you have a physical store that accepts credit cards, you almost certainly have
    a merchant solution. However, not all merchant solutions offer online transactions.
    The ones that do offer online transactions give you access to a payment gateway,
    a secure server for processing credit card charges. Usually, the transactions
    occur via an XML datastream. You can use cURL to exchange XML with the payment
    gateway (see Chapter 11 for more details).


    However, you can do some preliminary form validation work before talking to the
    payment gateway to save on transactions and transaction fees and possibly speed
    things for the user if they typed their credit card number incorrectly. It turns
    out that you can weed out completely incorrect credit card numbers with an easy
    algorithm. Furthermore, you can even determine a credit card type from a valid
    number. Keep in mind, though, that passing these tests is no guarantee that a
    card isn’t stolen or canceled or that it belongs to a different person.'
  merge: -1
