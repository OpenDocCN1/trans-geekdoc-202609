- pgno: 24
  md: 'Now that you have only the rows that you want, you still need to do one other
    thing.


    # Count the total number of rows in your result set.


    Result set is a fancy SQL way of saying “whatever data is returned after all the
    where statements are processed.” We need the total count to know what page we’re
    currently on and how many more pages we have to go until we’ve finished. Without
    the total count, we might display a Next link when there are no more items to
    see, and we wouldn’t be able to tell the user how many more pages there are to
    look at.


    Your SQL query should look like this:


    ```

    SELECT count(*) AS count FROM your_table

    WHERE conditions

    ```


    Once you’ve gotten this valuable information, you then plug three pieces of information
    into the create_navbar() function. The create_navbar() function contains several
    variables, so let’s look at each of them:


    +   - **$current_page** The current page that contains the navigation bar. In
    this script, we use the `$_SERVER["PHP_SELF"]` special variable, which is always
    set to the current page without the hostname and any GET parameters. For example,
    in a script accessed at http://example.com/navbar.php?start=0, `$current_page`
    would be set to /navbar.php.


    +   - **$start_number** The starting row number. For example, if the user is looking
    at rows 100 through 125, the start number is 100. This number is passed on via
    the GET method in the URL as the startnum parameter. The default is 0.


    +   - **$items_per_page** The number of rows users see on each page. For example,
    if you have 100 rows of data, an $items_per_page value of 25 results in four pages
    with 25 rows each. The same 100 rows with an $items_per_page value of 50 produces
    a scant two pages. And if the $items_per_page value is 200, a set of 100 rows
    has no navigation bar, because everything fits in a single page. This script’s
    default $items_per_page value is 50.


    +   - **$count** The total number of data rows. I showed you how to get this information
    in “Count the total number of rows in your result set” above.


    +   - **$nav_count** This variable starts at 0 and keeps incrementing by $items_per_page
    until it is greater than $count. When the value exceeds $count, the script has
    reached the end of result set—and thus the end of the navigation bar.


    +   - **$page_count** The number of pages in the result set.


    +   - **$nav_passed** A temporary variable that is set to Y the first time $nav_count
    exceeds $start_number; in other words, when we’re looking at the current page.
    This allows us to highlight the current page number in the navigation bar display.'
  merge: -1
  img_proc: true
