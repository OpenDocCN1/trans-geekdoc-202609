    # D. Methodology :


    After preprocessing, the durian images are trained and validated using the Non-Destructive
    Techniques. The Machine learning algorithms namely SVM, Bayes, and Random Forest
    are used to compare the classification accuracy of the ripening Durian Fruit.


    The performance measure with SVM shows that the classification of the fruits.
    The Durian images are classified on maturity level. With the training sample of
    75% and testing of 25% the classification showed a better result.


    These supervised algorithms analyze the training dataset. Algorithms namely Bayes,
    Logistic Regression, and Simple Neural Networks are more simple to understand,
    very fast to learn from the data. While these are more constrained and have limited
    complexity of working with simpler models with a minimum number of dataset. On
    the other hand, K-Nearest Neighbour decision with CART and SVM are more robust
    and give better accuracy for prediction. These algorithms are of risk in overfitting
    the training data.


    From the literature, it is found that 80-83% classification is obtained using
    a logistic support vector machine. In fact, the classification model for the SVM
    model is based on sample data with 89.33%. The prediction of data using SVM with
    above above is is considered feasible and efficient.


