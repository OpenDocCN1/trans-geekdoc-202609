    # V CONCLUSION


    From the results obtained using state of art techniques of machine learning can
    be finalized that the fruits can be classified efficiently by size, shape, color,
    and texture. From this work, SVM was applied to evaluate the ripeness of durian
    fruit. SVM model of the spectral analysis data showed acceptable results. Color
    features and edge detection were used to determine the gray scale images at optimal
    wavelength. SVM model using the 300 combined dataset of ripe fruits showed the
    best results of 89.3% of classification. Unlike the ripe and random fruits were
    rarely misclassified with each method


    In future, more than 500 samples with wider variation and internal quality of
    durian fruits at different ripeness stage will be needed for better identification
    of ripeness roughness. Further enhancement in this work would be classification
    based on ANN. ANN is also a highly successful tool for dataset classification
    with more number of sample images. The dataset are the combination of training,
    learning and testing which yields in better accuracy.'
