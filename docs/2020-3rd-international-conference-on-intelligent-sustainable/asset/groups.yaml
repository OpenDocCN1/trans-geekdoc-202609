    Abstract—Eating fruits is good for health and an excellent source of vitamins
    and minerals. But fruits are unripe if not fully ripened. Ripening of durian is
    an important phase in Pomology development. The various machine learning techniques
    were proposed to detect the classification of fruits. This paper provides a special
    approach to identify the features of different classes of durian fruits. Durian
    is known as the most unique and sweetest fruits in South Asia.


    to help with high production and minimal loss. ML techniques give an analysis
    of the high-quality fruits of data. It greatly gives the fastest output with better
    accuracy.


    For the necessary determination of the fruits, the process is divided into two
    phases of Pre-Processing and Classification which the fruit data set is demonstrated.
    In the first phase, the data are preprocessed on its features like size, texture,
    and color. All the above features are identified the fruit can be identified separately
    from other features of the plants such as leaves, flowers, branches, etc. The
    second phase is the classification of the fruit. If the Destructive technique
    is applied to the fruits in the future they become waste and only help in the
    future.


    Destructive Machine learning techniques were used to SVM, Random Forest. The results
    obtained are accuracy of 89.3% using SVM and 84.3% using Random Forest.


    Keywords—Classification, Machine Learning, SVM, Decision Tree, KNN, Random Forest.


    This study goes for Non-Destructive method in predicting the classification of
    durian based on performance level, accuracy, and speed using machine learning
    techniques. Generally, the results are classified as Unripe, Ripe, and Pulpy.


    # ## INTRODUCTION


    Durian is one of the sweetest fruits. It is popularly known as “king of fruits”,
    due to its sweet creamy taste and very strong odor; however are area in India
    has has high demand. Growing, as it is one of the most profitable fruits for farmers
    and exporters. The farmers only harvest those that have fallen from the durian
    tree %100% harvest before they are fully ripened which compromises the quality
    and the Brix level does not reach its maximum. As a result, the Musang king variety
    is sweeter and better than the Monthong durian Malaysia, farmers do not pick the
    fruit from the tree, but wait for it to fall naturally. Hence, the farmers experience
    huge loss without exporting.


    The images usually undergo pre-processing before the training and testing process
    in techniques. In this phase, a filter is applied to remove the noise and to soften
    the captured image. The three pre-processing steps applied in this work are Filtering
    the Image, Color Enhancement, and using Contrast enhancement. Filtering is a technique
    used for smoothing and Color enhancements are used to improve the enhancement
    of image. On the other hand, the contrast helps in the manipulation of pixels
    to increase the contrast. Linear and Non-Linear transformation of the images are
    done in this process.


    The main objective of this durian classification is to detect, identify and classify
    the features of an image. After the non-destructive identification of fruits,
    the performance is measured using machine learning


    Ripening of durian fruits is not an easy task which is high time consumes, inaccurate
    in prediction, and also needs skills. This work explains how different types of
    algorithms for the early detection of ripening durian are applied for the determination
    of the classification of durian fruit.'
