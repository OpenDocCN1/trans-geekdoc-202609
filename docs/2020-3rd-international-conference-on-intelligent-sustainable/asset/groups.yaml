    performance accuracy is measured by applying the algorithm in Durian. The effective
    use of the Machine learning algorithm is to improve the classification rate and
    minimize execution time. Techniques using Support Vector Machine, K-Nearest Neighbor,
    Decision Tree, and Neural Network are applied to the extracted datasets of fruits.
    These techniques help in the identification of the performance using graph.


    In this paper, the author used the digital imaging technique with an effective
    random forest algorithm for the successful classification of papaya fruit based
    on its ripeness. The color features were computed using RGB, HSV, and Lab* methods.
    By combining the image features with the machine learning algorithm which has
    a higher accuracy than the other two methods, the classification on-datasets was
    performed, in which the accuracy of 94.3% and 97.4% were obtained respectively.
    This method gave a satisfying result based on the firmness of the papaya fruit
    and achieved the performance of 78.1% with the machine learning techniques.


    The organization of this research paper is as follows: Section I introduces the
    problem. Section II discusses literature review and the problem statement. Section
    III the details of the proposed method, based on feature extraction and classification
    methods. IV presents the experimental results. The concluding remarks are presented
    in Section V.


    For detecting ripeness of Gooseberry fruit a combination of 4 machine learning
    techniques with 3 color spaces was proposed and evaluated in this paper [4]. Here
    author used a first pre-processing method of samples, image acquisition, image
    enhancement, and segmentation process of converting it to the mean value of the
    RGB color space was converted to HSV and Lab. Finally, the performance of ANN,
    DT, SVM, and KNN were combined to classify the fruit based on its ripeness. After
    performing the classification using SVM with the RGB color space yielded the performance
    accuracy and f-measure. The performance over the three color spaces showed 89.339%
    of variance and performance of.


    # II LITERATURE REVIEW


    This Literature work explains in detail the methods used for the classification
    of different types of fruits based on its size, shape, color, and texture ripening
    of fruits. There are a couple of image classification methods discussed heretofore.
    In this review the comparison is made with all the machine learning techniques
    used along with the performance obtained.


    Using of Hyper-spectral approach was presented in [1] for the performance improvement
    in Strawberry fruit classification. HI spectral imaging technique was used to
    evaluate the quality, ripeness, and fruit features that were affected by the strawberry.
    The spectral data, wavelength, and texture features were extracted from HI. The
    Texture features like color, roughness, intensity, firmness extracted using the
    technique. The author used the SVM for classification, by using the fruit datasets
    from hyperspectral images at over 71.67%.


    In this paper [8] the author explains the evaluation of the non-destructive internal
    quality of the fruit pear. The types of fruit peers Conference and Cupeña were
    used. To detect the indoors, the supervised vector machine alone with X-ray tomography
    was proposed. Classifier trained on data achieved high results when compared with
    ‘Compera’. The classifier SVM improved an accuracy above 85% depending on the
    cultivator and value of features used. This method needed to increase inspection
    speed and reduce the cost of equipment.


    In this study presented [2], the author used automatic image processing for the
    identification of bananas fruit ripeness. The ripeness ripening is done under
    nine in which (Un-ripe, Semi-ripe, Mid-ripe, and Full-ripe) of the fruit were
    prepared and an artificial neural network framework was applied. This approach
    helped in the classification of fruit based on color, identified spots on the
    fruit, and the Tiuana statistical features performed compared with the Supervised
    techniques of SVM, KNN, DT, and Naive Bayes. Results reveal that the proposed
    ANN system has the highest overall recognition rate, which is 87.25%,


