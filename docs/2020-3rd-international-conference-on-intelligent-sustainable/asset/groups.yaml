    ## 结论


    通过使用先进机器学习技术获得的结果可以得出，可以根据大小、形状、颜色和纹理对水果进行高效分类。在这项工作中，SVM 被用于评估榴莲果的成熟度。光谱分析数据的
    SVM 模型显示了可以接受的结果。利用颜色特征和边缘检测来确定最佳波下的灰度图像。使用 300 个成熟水果组合数据集的 SVM 模型显示了最佳分类结果，分类准确率为
    89.3%。与成熟水果和随机水果相比，每种方法都很少发生误分类。


    未来，需要超过 500 个具有更广泛变异和不同成熟阶段内部质量的榴莲样本，以更好地识别成熟度粗糙度。这项工作的进一步增强将是基于 ANN 的分类。ANN 也是用于大量样本图像数据集分类的高度成功工具。数据集是训练、学习和测试的结合，从而产生更高的准确率。


