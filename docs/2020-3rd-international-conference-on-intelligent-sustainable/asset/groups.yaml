    ### Feature Extraction based on edge detection :


    The purpose of this method is to significantly determine the edge of durian fruit
    with that of background images. The Canny Edge Detector is a technique that utilizes
    algorithms to determine the edges of images. The steps implemented:


    - (a) Smoothing of the durian image by Applying Gaussian extension and to reduce
    the noise with the following:

    - (b) Canny filter is used for edge detection. This process of detection is identified
    by calculating the gradient of image intensity at every pixel of an image.


