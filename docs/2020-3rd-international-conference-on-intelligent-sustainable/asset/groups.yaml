    ### Pre-processing based on color spaces:


    This process is applied to perform smoothing of the durian image by resizing the
    image to 100*100 pixels. An image generally consists of RGB color components which
    represent themselves. This RGB is used to determine the mean and median deviation.
    First, the RGB is converted to Gray and then to HSV. HSV color space determines
    the color in terms of Hue, Saturation, and Value. In which the Hue represents
    the color Saturation represent the vibrancy and Vibrant fruits brightened with
