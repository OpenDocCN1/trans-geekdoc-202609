    摘要—多吃水果对健康有益，是维生素和矿物质的极佳来源。但水果如果没有完全成熟，就是未成熟的。榴果的成熟是果实学发展中的一个重要阶段。各种机器学习技术被提出用于检测水果的分类。本文提供了一种特殊方法来识别不同种类榴果的特征。榴果被称为南亚最独特、最甜的水果，有助于提高产量并减少损失。机器学习技术对高质量的水果数据进行了分析。它以更好的准确率极大提供了最快的输出。


    为了对水果进行必要的判定，该过程被分为预处理和分类两个阶段，并展示了水果数据集。在第一阶段，根据尺寸、纹理和颜色等特征对数据进行预处理。识别上述所有特征后，水果可以与植物的其他特征（如叶子、花、枝条等）区分来。第二阶段是水果的分类。如果对水果应用破坏性技术（Destructive
    technique），则可以进行水果分类。机器学习技术对高质量的水果数据进行了分析。它以更好的准确率极大提供了最快的输出。


