    Description


    The world of technology progresses so quickly that we often don’t realize how
    far we’ve come. Over the last 20 years, technologies such as data science, artificial
    intelligence, the Internet of Things, and blockchain have transformed the world
    of business, industry, and society.


    These emerging technologies offer a wide range of opportunities. However, they
    also create new challenges businesses must face, such as developing new business
    models, discovering the best adoption strategies, designing the best digital transformation
    strategies, and more.


    This book is a practical guide to two of the most important emerging technologies:
    data science/AI and blockchain. With broad applicability across all sectors, decision
    makers would greatly benefit from understanding these fields. And that is why
    we cover a wide range of topics in an easy-to-access manner that everyone can
    understand.


    This book contains it all, from easy-to-understand descriptions of the technologies
    themselves to more in-depth explanations on how they can be used. Other topics
    this book covers include data strategy, business models to start new AI-based
    businesses, types of blockchain, data science processes, and much more.


    After reading this book, you’ll have a much better understanding of how you can
    use data science/AI and blockchain in your business to create transformation,
    improvements, and positive change.


    Keywords


    artificial intelligence; AI; blockchain; machine learning; data science; data
    strategy; business model; emerging tech


