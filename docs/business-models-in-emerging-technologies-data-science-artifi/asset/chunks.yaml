- raw: 'Subsequently, the digital document’s data would be used, and special algorithms
    would be applied to create a unique signature. Hash functions (special mathematical
    functions) are usually used to derive these signatures. They act as a unique identifier,
    akin to a bar or QR code, but only applicable to that document.


    The signature is then registered on the blockchain by connecting the signature
    to an action or transaction on the ledger.


    Of course, if one takes advantage of decentralized storage systems like IPFS,
    the complete certificate can be uploaded, providing another layer of authentication.


    Next, the content can be verified using blockchain technology.


    This means determining the document’s unique signature via the algorithm the issuer
    used to create the signature. Then, one would use the issuer’s application to
    search for the signature on the blockchain. If the two signatures match, the certificate
    is valid.


    ***DNV: A Case Study***


    Many companies are attempting to create solutions that will automate issuing and
    verifying paper documents (“[DNV.Com](http://DNV.Com)—When Trust Matters” n.d.).
    DNV relies on a blockchain-based solution that relies on QR code technology to
    issue and validate supply-chain certificates.


    With DNV, the certificates are stored on a private or permissioned blockchain
    network. This means that only DNV (the issuers) can create new certificates or
    change the data. They can also take advantage of the technology’s other benefits,
    such as decentralization, encryption, and authentication.


    While only DNV can update the data, everyone has access to the blockchain to verify
    and authenticate certificates.


    How Does It Work?


    When the company issues a certificate, they digitize the data, and each certificate
    is assigned a digital identity. As such, all certificates are traceable and have
    been tagged, with the original stored safely on the nodes that make up the blockchain.


    In parallel, the data the certificate contains is managed in the company’s production
    system. The end result is an immutable transaction that is secure and transparent.
    This makes it easy to discover fraud because the blockchain will quickly show
    if any certificates are outdated or forgeries.


    To check authenticity, all certificates feature embedded QR codes that can be
    scanned by any device that has a QR scanner. A search is conducted on the blockchain,
    and the certificate details will be shown. Thus, anyone can check the claims of
    a company and the validity of the certificate.


    DNV also has a public certificate checker that can be used to check the validity
    of a certificate.


    ***Hanseaticsoft: Another Case Study***


    Hanseaticsoft is a consortium that is developing a seafarer certification system
    based on blockchain technology (“Cloud Fleet Manager by Hanseaticsoft” n.d.).
    The goal is to streamline and speed up various processes encumbered by current
    certificate management systems that are all paper-based, the absence of safety
    document verification, and no access to validate the training and safety certification
    of seafarers.


    All the aforementioned can cause many problems for ship operators, regulatory
    and port authorities, and crew management agencies in securing and insuring crew
    members.


    The consortium has brought together a wide array of stakeholders who support or
    rely on crew certification, including shipping companies such as Maersk, Heidmar,
    and PTC Holdings Crop.


    Other tech enablers with certification expertise are also involved, such as providers
    of maritime platforms like Navozyme and C-LOG.


    The project will focus on demonstrating the effectiveness of using a digital certification
    and endorsement process that will rely on a digital repository to store and authenticate
    verified documentation and training logs and an approval system.


    Essentially, the system would allow individual seafarers to manage certificates
    when they are originally issued. It will also make it easier for maritime administrations
    to manage cross-jurisdiction renewal and endorsement. At the same time, crew management
    firms will be better able to keep track of seafarers to crew vessels. Finally,
    ship owners will be able to access an overview of their crew, along with their
    certifications and endorsements.


    Blockchain in Shipping


    While we discussed how blockchain could improve supply chains earlier, let’s look
    more closely at how it can help the shipping industry.


    ***IoT and Blockchain in the Shipping Industry***


    IoT refers to everyday objects that can connect to each other and beyond using
    the Internet, which allows them to send and receive data. For example, think of
    a smart refrigerator that can connect to the Internet and order groceries you
    are low on.


    IoT is quite prevalent in shipping because companies deploy sensors on ships,
    cargo, and containers to track their status for a variety of data processing purposes
    such as optimizing fuel consumption, improving craft and cargo data management,
    improving predictive maintenance, reducing emissions, and much more.


    Adding blockchain to the IoT mix provides a verifiable, permanent, and secure
    way of recording the data these smart devices process. The blockchain guarantees
    that all the data in the ledger has been verified by the network’s peers and fulfilled
    all the necessary conditions.


    The quality of the data is essential when it comes to data analytics. As the saying
    goes, garbage in, garbage out, regardless of how advanced and sophisticated the
    algorithms to analyze the data are.


    A blockchain-based network of these interconnected devices will be able to interact
    with the world around them and make decisions without the need for human involvement,
    which will increase efficiency, lower costs, and, as a result, improve overheads.


    Digitizing Paper-Based Processes


    Despite being in the so-called digital age, shipping transactions still involve
    ridiculous amounts of paperwork, from sales contracts and charter party agreements
    to bills of lading and letter of credit. The list is endless.


    While all this paperwork is a necessary evil, the problem is that it results in
    cumbersome operations because many of the stakeholders involved rely on the generation,
    authorization, and distribution of a large volume of paper documents. All these
    documents must be passed along a chain of numerous parties, with each having to
    take some form of action, such as initiation of payment, collection and delivery
    of cargo, and so on.


    With blockchain technology, all these paper-based operations could be eliminated.
    All the actors involved in the transaction could rely on blockchain and smart
    contract technology to remain in contact, carry out physical transactions, store
    and share encrypted information, carry out their contractual obligations, issue
    and receive instructions, and make secure payments.


    Traceability of Valuable Items


    Combining blockchain and tagging technology means that products can be tracked
    throughout the supply chain, from their origin to their final destination. Not
    only will this increase consumer trust, but it will also make it easier to achieve
    law and standard compliance.


    Some would argue that tracing products throughout their journey is one of the
    most powerful and logical applications of blockchain technology.


    With blockchain, there is only truth. Everyone has access to immutable records
    that track items from creation to distribution, which can be extremely beneficial
    for high-value products such as electronics, designer goods, pharmaceuticals,
    and more.


    Reducing and Authenticating Counterfeit Products


    Blockchain’s transparency will streamline processes in the shipping world by allowing
    companies to monitor cargo capacity in real time, thereby addressing potential
    supply chain bottlenecks before they occur.'
