- raw: 'There is also the Industrial Internet of Things (IIoT). It is an extension
    of the IoT as it focuses on the technologies that apply to industrial and manufacturing
    environments. As with the IoT, the IIoT is about connecting a range of different
    devices, equipment, and machines in an industrial setting.


    However, where the IIoT is making the biggest impact is in narrowing the gap between
    IT (information technology) and OT (operational technology).


    Traditionally in the manufacturing sector, IT and OT were completely separate,
    with little connectivity or integration. So, for example, Customer Relationship
    Management (CRM), accounting, and sales apps that are part of IT would have no
    integration with the equipment, systems, and platforms that produce the products
    on the factory floor.


    IIoT technologies are playing an important role in facilitating the integration
    of IT and IIoT, improving productivity, efficiency, and oversight in manufacturing
    organizations.


    ***3D Printing***


    3D printing has already disrupted multiple industries. In health care, medical
    professionals are printing prosthetics and replicas of bones, organs, and blood
    vessels, all tailored to a specific patient.


    It can also help reduce waste, build homes for everyone, provide clothing, feed
    the homeless, and more.


    Essentially, this is a technology that, when combined with all the other emerging
    tech, can eventually lead us to making whatever we need with the push of a button,
    from vehicles to food.


    Even simple applications are being transformed by 3D printing, such as producing
    a prototype of product currently being developed. 3D-printed prototypes can be
    produced in a fraction of the time and at a fraction of the cost with less costly
    equipment. This is just one other example of how 3D printing really is a gamechanger.


    ***5G Technology***


    5G is already taking the world by storm as it offers faster speeds, more capacity,
    and reduced latency for mobile networks. In other words, more data can be transferred
    at much higher speeds, which will drive significant change in our society.


    For example, it could help improve public safety in emergencies. The ability to
    handle higher volumes of high-quality video means that authorities can more effectively
    analyze emergencies, thereby leading to more effective responses.


    5G technology is also a key driver of the IoT, plus it enables highly innovative
    edge computing solutions. Those edge computing solutions don’t just mean data
    can be collected from almost anywhere. 5G technology also means that data can
    also be processed at the edge, improving performance.


    There are multiple reasons why 5G is important to Industry 4.0. First, 5G enables
    faster communication between systems, platforms, and equipment. This reduces latency
    to a point that is close to wired connections, so helps to optimize production
    processes where physical connections are impractical.


    5G technologies also make it possible to transmit critical communications reliably
    and in real time. This was not possible previously when the only option was 4G
    technologies. Not only does the reliability, speed, and low latency of 5G have
    productivity implications but also safety benefits.


    ***Quantum Computing***


    Quantum computers will be able to solve many computationally impossible problems,
    which will revolutionize many industries.


    For example, quantum computing can help scientists discover and develop new drugs
    much faster. At the same time, in finances, these systems can provide better analytics
    and help improve trading, data speed, and transactions.


    While this technology is in its infancy, quantum computing has usage applications
    across a wide range of areas. Enhancing risk management is one example, as well
    as enabling manufacturers to achieve faster and more customer-centric production.
    Business strategies such as mass customization are set to become the norm as quantum
    computing develops further.


    Quantum computing will also see the introduction of sensors that are smaller and
    more sensitive. This will not only have benefits for the products that manufacturing
    companies produce but it will also help to improve manufacturing processes, given
    the importance of sensors in developing smart factories.


    Metrology is another area of manufacturing that quantum computing is predicted
    to have a significant impact. For many manufacturers, metrology is an essential
    driver for quality assurance and, by extension, optimizing manufacturing processes.
    Metrology technologies and solutions that utilize quantum computing will take
    the field to another level, providing manufacturing organizations with new data
    and insights, as well as achieving even greater levels of measurement accuracy
    and process repeatability.


    ***Robotics***


    Progress in robotics is accelerating, and we’ve already seen automation implemented
    in the manufacturing industry, leading to increased efficiencies. But robotics
    continues to evolve and, as AI and ML progress, it won’t be long before robots
    can take over many more of the jobs that humans have to do now.


    As robots become more prevalent, productivity will rise, and the economy will
    grow. However, we will also see a shift in society as the types of jobs humans
    do will change.


    One area of robotics that is rapidly advancing in the Industry 4.0 era is the
    development of robotic solutions that work alongside people. This type of equipment
    is often referred to as cobots. From autonomous vehicles to manufacturing and
    assembly lines, the efficiency gains that can be made with cobots and similar
    technologies is significant.


    It isn’t just efficiency and productivity gains, either, as cobots also have significant
    health and safety implications, helping to keep workers safe even in the harshest
    of conditions.


    Then there is the concept of the lights-out factory, where robots are responsible
    for 100 percent of manufacturing and assembly processes, and are able to operate
    24 hours a day, 7 days a week. They can do this without taking holidays, without
    making mistakes, and without getting tired or sick. We are still some distance
    away from this concept becoming a reality on anything like a widespread basis,
    and there are some who believe it won’t be feasible. However, the lights out factory
    is the general direction of travel.


    There are many reasons for this, and advances in robotic technologies are high
    up on that list. There are also other, more traditional considerations that are
    important too. Access to labor is one that can’t be ignored. In many industries,
    upgrading production lines with robots isn’t about replacing people. Instead,
    it is about changing a process because they are finding it increasingly difficult
    to recruit and train the right skills.


    Summary


    The Fourth Industrial Revolution is happening right now. This revolution is being
    driven by multiple technologies that are disrupting the world individually. However,
    when one combines these technologies, they will drive even greater levels of change.


    Robotics is an excellent example. We started with robots that had to be programmed
    to perform the tiniest action. When we needed them to do something different,
    the code had to be changed. They certainly couldn’t learn or think on their own.
    But AI and ML are changing that.


    This book will focus on two of the biggest emerging technologies, namely AI/data
    science and blockchain. We’ll look at what these emerging technologies are and
    how they’re changing the world. The reason we focus on these is because they are
    the most popular ones, and they add the most value out of all other technologies.
    Indeed, while 5G is a great facilitator of telecommunications, and IoT generates
    massive amounts of data, they require methods borrowed from data science in order
    to generate value, and any applications of this kind can work synergistically
    with blockchain. Also, robotics can be seen as an application of AI, which is
    related to data science.'
