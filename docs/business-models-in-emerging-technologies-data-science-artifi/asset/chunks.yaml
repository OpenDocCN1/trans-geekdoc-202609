    # 新兴技术中的商业模式：数据科学、人工智能与区块链


    ## 描述

    技术领域进展之快，以至于我们往往没有意识到已经走了多远。在过去的 20 年里，`data science`、`artificial intelligence`、`Internet
    of Things` 以及 `blockchain` 等技术改变了商业和社会的世界。这些新兴技术提供了广泛的机会。然而，它们也带来了企业必须面对的挑战，例如开发新的商业模式、发现最佳采用策略以及数字化转型。本书是关于两种最重要的新兴技术——`data
    science/AI` 和 `blockchain` 的实用指南。由于在所有领域具有广泛的适用性，决策者将从这些这些领域受益。这就是为什么我们以易于理解的方式涵盖了广泛的话。


    ## 关键词

    `artificial intelligence`; `AI`; `blockchain`; `machine learning`; `data science`;
    `data strategy`; `business model`; `emerging tech`


    ## 目录

