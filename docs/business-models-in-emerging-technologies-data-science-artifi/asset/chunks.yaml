- raw: 'If you facilitate an environment where they can learn these new technologies,
    you stand a better chance of keeping them. However, don’t forget that once they
    do expand their skill sets, you might have to increase their compensation accordingly
    to keep them on board.


    ***The Academic Connection***


    Another way to motivate a data scientist is to provide them with funding for attending
    conferences. Many data scientists are closely connected to academia and have a
    habit of reading and/or writing papers, as well as going to conferences. This
    is a good thing for everyone because they keep their skills sharp and are always
    in the know about the latest advancements in data science.


    Some of the top data science conferences a PhD-level data scientist will be interested
    in attending include:


    • ICML—The International Conference on Machine Learning


    • NeurIPS—Neural Information Processing Systems


    • SIGKDD—ACM SIGKDD International Conference on Knowledge Discovery and Data Mining


    • ECML-PKDD—European Conference on Machine Learning and Knowledge Discovery in
    Databases


    • AI Stats


    Change Your Hiring Mindset


    When it comes to hiring a data scientist, you will have to change your mindset
    somewhat. Most employers take the same tack as they would when trying to fill
    any other role in their business. This usually means that they’ll ask about a
    data scientist’s experience in a specific field.


    The problem with this is that data scientists often look to fields they haven’t
    worked in before because they want to learn something new and avoid boredom. Working
    with data in a new area is far more interesting than doing the same thing over
    and over again.


    Now, you might think that hiring a data scientist without experience in your field
    is a mistake. After all, you don’t want to be the one funding a data scientist’s
    education, do you?


    Well, this is the precise wrong way to think about it because a data scientist
    isn’t defined by the field they’re experienced in but by their skill set, which
    is applicable to any field. As long as they have the tools, they can work in any
    domain, even if they’ve never seen it before.


    Think of it like a dog trainer and behavioral specialist. While the trainer might
    work more frequently with Collies, for example, they are just as capable of training
    any other breed of dog, from English Bulldogs to Rottweilers. The tools and skills
    are the same, regardless of the breed they are working with.


    Another problem is that employers don’t always understand exactly what they’re
    asking for. A frequent issue is that the human resources department will ask for
    someone with five years of experience in a particular technology, only to discover
    that the technology in question has only been around for two years, so it’s not
    possible to have that much experience.


    Therefore, it’s generally a better idea to focus on the breadth of a data scientist’s
    knowledge and skills rather than just experience.


    Data scientists are often boxed into a field because employers don’t understand
    how data scientists work and what their skill sets mean. So, a data scientist
    who has worked in finance, for example, would use tools such as predictive modeling
    and time series. These tools, however, aren’t just limited to finance. They could
    be used just as effectively in other fields such as retail and health care.


    The problem is that an employer will see how experienced the data scientist is
    with finances and assume that their skill set is only applicable to that particular
    field. This means that they could be missing out on a great opportunity to hire
    an outstanding data scientist.


    In other words, you need to change your mindset when it comes to choosing the
    right person for the job because data scientists don’t fit the usual mold.


    Data Science Tribes


    Data scientists can be categorized into large and small tribes based on how they
    became data scientists.


    Unlike other professions, which usually involve the same path to become qualified,
    such as an accountant or a doctor, a person can become a data scientist in a variety
    of ways. Therefore, data scientists can be split into three major tribes and three
    minor tribes (Kampakis 2018b).


    The major tribes are comprised of computer scientists, statisticians, and quantitative
    specialists from other fields.


    The minor tribes can be separated into self-taught data scientists, software platform
    users, and domain specialists ([Figure 4.1](#Chapter04.xhtml#fig4.1)).


    ***The Major Tribes***


    As previously stated, the three major tribes are computer scientists, statisticians,
    and other quantitative specialists. Let’s take a closer look at each one.


    Computer Scientists


    Computer scientists have degrees in computer science, such as masters or PhDs
    in ML. The main benefit is that these types of data scientists are excellent at
    computer-related things such as coding, databases, and software. However, they
    often overlook traditional statistical techniques and theory, which are necessary
    or at least helpful in certain situations.


    ![images](images/fig4.1.jpg)


    ***Figure 4.1 The tribes of data scientists***


    These types of data scientists are often a good option for ML tasks, like predictive
    modeling. They tend to have experience in Kaggle competitions, which is an excellent
    example of this type of problem.


    Kaggle is a platform where people can engage in analytics and predictive modeling
    competitions, though it should be noted that Kaggle has joined Google Cloud (“The
    Beginner’s Guide to Kaggle” 2017). Essentially, companies upload data sets, and
    then people compete to come up with the best possible model in terms of predicting
    and describing the data sets. It’s an efficient way to discover the best approach
    for a specific predictive modeling task through crowdsourcing.


    A computer scientist is a great option for small companies and startups because
    you can give them a data set for which you just want to find a good algorithm
    to predict something. They have excellent coding skills so they can easily integrate
    their work with the rest of platform.


    They also have great database skills, which means that they can do a lot of data
    engineering work. Even if you have your own data engineers, it’s still worth working
    with a computer scientist because it’s easy for them to retrieve data and turn
    it into something usable, among other things.


    It should be noted, though, that their lack of theoretical knowledge of statistics
    makes them inadequate for some situations, especially when you need research design.


    Statisticians


    Statisticians have degrees in statistics, as the name implies, or even in ML.
    However, while they have good theoretical knowledge, they rarely have the necessary
    coding or database skills.


    Statisticians are your best option if you are interested in research design or
    statistical modeling. Therefore, if your goal is to discover the driving factors
    behind something or design an experiment, your best option is a statistician.


    You also want to turn to a statistician if you’re looking to model advanced complex
    problems while requiring a transparent modeling process.


    Owing to their in-depth math and theory training, they are also effective at critiquing
    the work of other data scientists.


    The main concern is that they generally have limited coding and database skills,
    which will lead to system integration issues. This will make the whole process
    more challenging and time-consuming.


    Some statisticians are also inexperienced with predictive modeling, though the
    latter is more aligned with ML and rarely considered to be vital to statistics.


    Check if they have any Kaggle experience and make sure that they have a minimum
    familiarity with ML concepts, such as cross-validation if you want to use their
    skills for predictive modeling.


    Other Quantitative Specialists'
