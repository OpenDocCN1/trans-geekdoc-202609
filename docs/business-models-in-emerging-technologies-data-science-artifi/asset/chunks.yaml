    ## 第 2 章


    ### 面向非技术人员的数据科学/AI 简介


    在这一章中，我们将深入探讨数据科学，讨论它的定义以及为什么它有用。我们将涵盖数据科学的简史，并观察构成它的核心领域。本章的目标是为非技术读者提供关于该领域的一个良好的简要概述，并理解它可以应用在何处以及为什么。


    数据科学由多个学科组成。因此，为了很好地掌握数据科学，我们需要观察构成这一研究领域的核心学科。不过，让我们先回顾一下这一切是如何开始的。


    #### 数据科学简史


    尽管数据科学随着数据生成量的增加而变得更加流行，但它已经存在一段时间了。许多人将约翰·图基（John Tukey）视为推向统计学边界并催生数据分析科学化这一概念的人之一（Leonhardt
    2000）。


    Tukey 在 1962 年写了《分析的未来》（*The Future of Analysis*），当时他是普林斯顿大学的教授，并在贝尔实验室开发计算机的统计方法（Tukey
    1962）。


    在文章中，他鼓励学术统计学家参与数据分析的整个过程，而不仅仅是关注统计理论。他指出区分探索性数据分析和确认性数据分析是多么重要，这是创建数据科学领域的第一步。


    虽然其他人无疑对我们今天所知的数据科学产生了重大影响，但 Tukey 是首批倡导此类领域重要性的人之一。然而，直到 21 世纪初，数据科学才才真正开始起飞。原因是千禧交之之际出现了几种趋势的汇聚：


    1. 互联网的兴起；

    2. 更廉价的存储和计算能力；

    3. 云计算的兴起；

    4. 生成数据量的增加。


    这四种趋势的汇聚使数据成为一种宝贵的资源，有些人将数据称为“新石油”。这激励了数据科学领域的重新出现，作为一种统一的力量将曾经分散的领域结合。


    #### 数据科学的核心领域


    更深入地观察数据科学的历史意味着深入研究它的三个核心领域：`AI`、`ML` 和 `statistics`。多年来还有其他趋势兴起又衰落：数据挖掘、模式识别、控制论等。这些术语通常描述了试图在机器内部重建智能，或开发从数据中提取见解技术的科学方法。然而，主要领域是
    `AI`、`ML` 和 `statistics`，我们将在接下来的章节中深入探讨这些。


    ##### 深入观察 AI


    `AI` 正如其名。人们正试图让机器像人类一样思考。用更技术性的术语来说，这意味着赋予机器逻辑推理、自我纠正和学习的能力。写出来可能听起来很简单。事实并非如此。即使只是模糊地实现这些目标，你大量的数据和大量的计算能力。


    经典的 `AI` 于 1956 年诞生于达特茅学院，当时五个人汇聚在一起，他们后来成为了 `AI` 研究的创始人和领导者。他们是艾伦·纽维尔（CMU）、赫伯特·西蒙（CMU）、约翰·马卡锡（MIT）、马文·明斯基（MIT）和亚瑟·塞缪尔（IBM）（Russell,
    Norvig, and Davis 2000）。


    虽然其他人无疑对我们今天所知的数据科学产生了重大影响，但 Tukey 是首批倡导此类领域重要性的人之一。然而，直到 21 世纪初，数据科学才才真正开始起飞。原因是千禧交之之际出现了几种趋势的汇聚：


    1. 互联网的兴起；

    2. 更廉价的存储和计算能力；

    3. 云计算的兴起；

    4. 生成数据量的增加。


    这四种趋势的汇聚使数据成为一种宝贵的资源，有些人将数据称为“新石油”。这激励了数据科学领域的重新出现，作为一种统一的力量将曾经分散的领域结合。


