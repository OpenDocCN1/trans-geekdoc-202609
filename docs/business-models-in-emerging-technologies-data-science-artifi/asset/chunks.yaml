- raw: 'Financial analysis involves the use of a lot of statistical information to
    help investors make decisions. For example, Forex trading relies on the analysis
    of financial data, including historical price movement, a country’s economic data,
    and much more. It also involves using a wide range of indicators that are calculated
    using statistical information, such as the moving average.


    The same applies to stocks, where investors make decisions on which stock to invest
    in based on variables such as price/earnings ratios and dividend yields. Some
    might even conduct a comparison between the market average and the results of
    an individual stock.


    Marketing


    Statistics is also highly useful in marketing. Electronic scanners at retail checkout
    counters collect data for various marketing research applications. AC Nielsen,
    an information supplier, purchases this data from grocery stores, then processes
    it and sells statistical summaries to manufacturers and distributors, among others.


    Companies will spend a lot of money to obtain this kind of data because it can
    be used to determine production necessities and even assist in developing new
    products.


    Production


    Quality control is an essential application of statistics in manufacturing. Various
    statistical quality control charts are used to monitor the output of the manufacturing
    process, such as an x-bar chart, which can be used to monitor average output.


    For example, let’s say that a machine fills containers with 1.5 ounces of cream.
    Sporadically, an employee will select a sample of containers and calculate the
    average number of ounces in the sample. This average value is then plotted on
    an x-bar chart.


    A plotted value above the upper control limit indicates that the machine is overfilling
    the containers, whereas a plotted value below the lower control limit indicates
    underfilling. The process continues as long as the plotted value falls between
    the upper and lower control limits. Otherwise, adjustments are made to ensure
    the average is where it should be.


    Economics


    Economists frequently predict the future of the economy or certain aspects of
    it. They use a variety of statistical information to make these predictions, such
    as forecasting GDP, inflation rates, and more. However, these predictions are
    often made using ML.


    Information Systems


    Information systems administrators handle the daily operations of the company’s
    computer networks. They use various statistical information to assess performance
    and make adjustments to ensure that the system is functioning optimally.


    ***The Pitfalls of Statistics***


    One of the biggest problems with statistics is that people tend to trust them
    blindly simply because they appear to be facts. After all, when someone presents
    you with information, and it’s backed by what looks like accurate data in the
    form of numbers, ratios, percentages, graphs, charts, and so on, you’re far more
    likely to believe what you’re being told.


    However, it is very easy to use statistics to lie to people. While it’s not always
    a matter of bad intentions, even human error can lead to skewed results, which
    can cause problems.


    Therefore, it’s essential that you understand how statistics can be used to distort
    facts. This way, you will be more aware and less likely to make poor decisions
    because you’ve been misled.


    Here are some of the ways in which you can be lied to using statistics:


    Lying Using Charts


    One way statistics can be used to mislead an audience is by lying to people using
    charts that contain spurious correlations. They seem to make sense at first glance
    but have no connection one to another.


    For example, here is one chart that correlates the divorce rate in Maine with
    the per capita consumption of margarine ([Figure 2.2](#Chapter02.xhtml#fig2.2)).


    Here’s another chart that attempts to correlate worldwide noncommercial space
    launches with sociology doctorates awarded in the United States ([Figure 2.3](#Chapter02.xhtml#fig2.3)).
    Now, these might seem like interesting statistics and, separately, they certainly
    are. However, when you try to establish a correlation between these facts, it’s
    a bit ridiculous.


    For example, the first chart seems to imply that as divorce rates decline in Maine,
    so too does the consumption of margarine. Some enterprising individuals might
    attempt to convince you that margarine has affected the divorce rate, and the
    less margarine people eat, the less likely they are to get a divorce.


    The second chart seems to imply that an increase in sociology doctorates has led
    to a rise in the number of worldwide noncommercial space launches. Now, you might
    scoff and say that it’s quite obvious there are no correlations between these
    variables. After all, how can the number of sociology doctorates awarded in the
    United States affect space launches? However, what happens is that people use
    variables that might seem to have a tangential connection to each other to attempt
    to convince you that a spurious correlation is fact.


    ![images](images/fig2.2.jpg)


    ***Figure 2.2 Divorce rate in Maine***


    *Sources:* National vital statistics reports and U.S. department of agriculture


    ![images](images/fig2.3.jpg)


    ***Figure 2.3 Worldwide noncommercial space launches***


    *Source:* Federal aviation administration and national science foundation


    A spurious correlation means that someone is trying to correlate two variables
    that don’t really have an underlying theory that holds up to scrutiny. They are
    simply comparing two variables that aren’t connected. Furthermore, it’s important
    to remember that correlation doesn’t necessarily imply causation.


    For example, the consumption of margarine is in no way related to the number of
    divorces in Maine. After all, it’s not like a spread can have such an impact on
    people’s relationships. You might go so far as to say that an argument over margarine
    led to a divorce. However, if people are arguing over margarine so much that they
    end up divorcing, there are many other underlying issues, and margarine is only
    an excuse rather than a cause.


    However, if we were to attempt to correlate the consumption of margarine and income
    in the margarine industry, then the correlation would make sense because the two
    are connected.


    In some charts, people can be tricked even more because things like reversing
    the X- and Y-axis can lead to mistaken conclusions. For example, suppose the numbers
    along the X-axis decrease while those on the Y-axis increase. In that case, this
    will lead to an erroneous visual representation, which is another way to attempt
    to force a correlation.


    So, just remember that even if there might seem to be a significant correlation
    between two variables, that doesn’t actually mean there is a relationship between
    the two.


    Another way you can be lied to with charts is by using different types of scales
    in the same chart. For example, you can use different scales to make items seem
    as if they’re closer to each other.


    Another way to lie is to change the scale. If you close in on the scale, a variable’s
    evolution might seem choppy. However, when you zoom out, it looks far more stable.


    For example, if you take a snapshot of last year’s performance of the Dow Jones
    industrial index (simply google “Dow Jones chart”) you will see that growth has
    stalled ([Figure 2.4](#Chapter02.xhtml#fig2.4)). But if you look at a multidecade
    chart, you will see that the index has been rising over the long run ([Figure
    2.5](#Chapter02.xhtml#fig2.5)). An analyst who focuses on recent developments
    might get worried, while someone focused more on the long run can be reassured
    that the economy will simply keep growing. Graph interpretation can be quite subjective
    at times, and this is why a decision maker must always be skeptical and critical
    of any graph interpretations.


    Embellishing With Descriptive Statistics


    Descriptive statistics can also be used to mislead people, and one way to do so
    quite easily is through measures of centrality and summary metrics.'
