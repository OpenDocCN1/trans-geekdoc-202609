    # A Short Intro to Statistics


    Statistics can be split into two branches: descriptive and inferential statistics.


    Descriptive statistics is what most people consider statistics to be. It involves
    collecting data, using summary metrics such as the name and data visualization.


    On the other hand, inferential statistics is what most people in the field consider
    to be statistics. It involves more advanced concepts such as sampling and inferring
    values of the population parameters.


    ## Descriptive Statistics


    Descriptive statistics involves organizing, summarizing, and presenting data so
    everyone can understand and make use of it. To do this, there are two sets of
    methods, namely numerical methods to describe data and graphical methods for data
    presentation (“Understanding Descriptive and Inferential Statistics | Laerd Statistics”
    n.d.).


    Numerical methods encompass metrics not only for data location, such as the `mean`,
    `median`, and `mode` but also measures of data variability, such as `variance`
    and `standard deviation`.


    Graphical methods for data representation include bar charts, histograms, pie
    charts, and more.


    Many analytics products in the market, such as `Tableaux` or other dashboards,
    are usually focused on descriptive statistics. While descriptive statistics are
    simple, they can be very effective and easily understood by anyone.


    ## Inferential Statistics


    Inferential statistics represents the majority of the field because that’s where
    the work is really done, while descriptive statistics represents a tiny fraction.


    Inferential statistics comprises a group of methods you can use to draw conclusions
    or inferences about the traits of a whole population based on sample data.


    In essence, inferential statistics allows you to quantify uncertainty. So, for
    example, let’s say that you want to figure out something about a group of people.
    It could be something like the average age of the population.


    If you were dealing with a small population, say maybe a few hundred people, then
    you could measure everyone’s age and calculate the average. However, when you
    try to do that for an entire country, for example, that might have a population
    of 20 million people, it will be practically impossible. Well, at least unfeasible
    from a cost and effort viewpoint.


    So, if studying every individual is impractical, there must be an alternative.
    That’s where inferential statistics comes in. It involves taking a sample of the
    population you are attempting to study and expressing uncertainty through probability
    distribution. You’re essentially turning uncertainty into a quantifiable metric,
    which then allows you to run calculations. That is what permits statistical modeling
    and hypothesis testing.


    What you do is take a sample of a thousand people, which covers as wide a demographic
    as possible and then extrapolate their average age to the entire population of
    20 million. While demographic conformity is not absolutely necessary, it does
    lead to more accurate results.


    For example, consider deaths caused by the coronavirus. There were many conversations
    over the first few months of the pandemic about the actual mortality rate of the
    disease. Many disagreements arose between statisticians. At least some of those
    deaths attributed to `COVID-19` were caused by other conditions. Still, at the
    same time, some covid-related deaths, especially before tests became available,
    were attributed to other illnesses. This is a classic problem of inferential statistics:
    trying to decipher the value of an underlying variable, given a sample.


    Another interesting inferential issue around COVID-19-related deaths is related
    to definitions and attribution. Let’s say someone had severe underlying conditions
    and would probably die within the next month. If this person died and then tested
    positive for `COVID-19`, was the illness the cause of death or the underlying
    conditions?


    The topic of attribution raises more of a philosophical discussion and is encountered
    in many health-related discussions. For example, who is the true culprit of the
    obesity epidemic? The companies selling unhealthy food, the advertisers, or the
    people buying it? While many people will have strong opinions on the subject,
    it is difficult to attribute this phenomenon to a single factor completely. This
    is where inferential statistics can help provide more clarity by quantifying each
    factors’ contribution.


    ## The Benefits of Statistics


    All this might sound very interesting, but you’re probably wondering how statistics
    can help you in business as a decision maker.


    First, you’re probably already using descriptive statistics in some shape or form.
    Profit and loss forecasts are just one example of using statistics in a business
    setting.


    Inferential statistics, on the other hand, can be used to answer specific questions
    regarding the importance of a variable. It can also answer questions about differences
    in population.


    The main things you’ll be using inferential statistics for are hypothesis testing
    and statistical modeling. While forecasting is another beneficial area, it is
    somewhat more technical, and it can often be achieved using `ML` more easily than
    through statistics.


    Hypothesis testing is generally used for finding out the value of a population
    parameter or making comparisons.


    Working out the value of a population basically means that you are looking to
    determine the specific value, such as average height, average income, and average
    age. Comparisons involve analyzing the differences and/or similarities among parameters.
    One example would be exploring differences based on gender. So, you would look
    at whether men earn more or less money in a specific job than women.


    In business, especially online, you might have already heard of `A/B testing`,
    which is a form of comparison. So, when you test two calls-to-action against each
    other to determine which generates the highest conversion rate, you are conducting
    a comparison-based hypothesis test.


    Statistical modeling is what you use when you want to figure out if one variable
    affects another.


    So, let’s say you’ve conducted your comparison-based hypothesis test on your calls-to-action
    to determine which is more effective at achieving conversions. You’ve established
    which one is more successful, but you also want to learn what other variables
    could be affecting your conversion rate. To do so, you would use statistical modeling.


    Essentially, you plug your variables into the model and may discover that everything.
    from the button’s position on the page and the color of the text to the headline
    and content, affects conversion rates. You can also determine to what degree these
    variables affect conversion rates. For example, you might find that the headline
    and call-to-action play only a small part in why people are converting and that
    the main draw is the offer itself.


    ## Applications of Statistics in Business and Economics


    In today’s digital world, we have vast amounts of statistical data available to
    us at our fingertips. The most effective business leaders and decision makers
    are aware of the value of this data and can use it effectively.


    ### Accounting


    Accounting companies often use statistical sampling methods when they conduct
    audits for clients. For example, let’s say that an accounting company wants to
