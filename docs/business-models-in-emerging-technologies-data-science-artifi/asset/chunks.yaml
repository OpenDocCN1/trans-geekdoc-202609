- raw: 'The tribe of other quantitative specialists is comprised of people who come
    from fields that are heavy in math, such as physics, actuarial science, mathematics,
    econometrics, and so on. These specialists might also have degrees in statistics
    or ML.


    These people are special because they frequently not only have a solid skillset
    but also provide creativity and out-of-the-box thinking, which is essential in
    data science. If the problem you’re dealing with is in their field of expertise,
    then these are definitely people that you seriously need to consider hiring.


    Of course, there is a drawback. Other quantitative specialists frequently lack
    effective training in ML or statistics, which can create issues in particular
    situations. Thus, it all depends on the person when it comes to quantitative specialists.


    Owing to their lack of formal education in the field, you might have to do a little
    extra research to discover how effective they really are. Look for examples of
    their work on Kaggle or GitHub before you decide to hire them.


    The fact that they’re self-taught is not a criticism as many highly successful
    and effective people in the world are self-taught. It just means that you need
    to make sure that their skills are on the level you need them to be.


    Other quantitative specialists tend to be people who have studied for one field
    and discovered that the money they can earn isn’t all that great. Or, they had
    a lot of difficulty finding a good job. Then they discovered that data science
    pays really well, so they decided to branch out. For example, a chemist could
    decide to create a few mini-projects, upload them to GitHub, or enroll in a few
    competitions on Kaggle to find a job as a data scientist.


    Personal experience shows that the most effective data scientists from this tribe
    are those who have trained to be physicists. This is because physics is full of
    applied math, which means that they can easily understand ML papers, since it’s
    essentially the same type of math. Physicists also need to have some coding skills,
    which means that their skillset is often in line with what ML requires.


    Other quantitative specialists will often be experts in their particular field,
    which could prove useful. For example, if your problem is related to econometrics,
    you might want to hire someone who is experienced in econometrics and has a little
    bit of ML knowledge.


    The drawback is that some of these people will try to fake it. To get the job,
    they’ll go through a few tutorials and online courses for a few weeks. Suddenly,
    they think they’re a data scientist. You have to be very careful with these types
    of people because they can do significant damage to your project.


    However, this in no way means that you shouldn’t look at people who don’t have
    a lot of experience. If they’re honest about it and can show that they’re smart
    and willing to learn, there’s no reason not to give them a chance. Just make sure
    to put them in junior roles under more experienced supervision.


    Convergence Point


    All the tribes generally converge after about five or six years of experience.
    When someone has been working for a few years and they’ve taken part in between
    10 and 30 projects, let’s say, and they work in different fields for various companies,
    they end up developing a significant range of skills. A PhD is just an added bonus.


    At this point, they’ve done some coding and picked up all sorts of skills and
    knowledge. They’re also quite aware of what’s available, in terms of methods and
    techniques. Even if they don’t know how to implement them, they still know how
    a problem should be solved and will know who to speak to in order to get the work
    done. Sometimes, it’s not as important to have the skill yourself, but to be aware
    of your limits and to know what solutions are available and how to get to the
    people who can implement them.


    When you find a person like this with a lot of experience across the board, you
    don’t really want to concern yourself with their background. What they’ve learned
    over the years is more important, as well as whether they have the skills and
    awareness to help you.


    The problem is that some people might look like they have a lot of experience
    but it’s actually limited. They may have worked on the same one or two projects
    for multiple years. While they are very experienced, it’s only in a narrow niche.
    These aren’t the people we’re referring to.


    The people we’re referring to have been proactive in learning new things, such
    as becoming more experienced with R, or Python, they’ve done a little research
    design, and so on.


    ***The Small Tribes***


    The small or minor tribes are less populated and those included here tend not
    to be data scientists but people with analytical skills. The three minor tribes
    are the self-taught, the software platform specialist, and the domain specialist.


    Self-taught people have usually studied an unrelated, random field, though, in
    some cases, it might be software development. They may have taken part in a few
    Kaggle competitions and that’s the limit of their experience.


    While other quantitative specialists encompassed in the larger tribes might be
    self-taught in certain respects, their field of study has already provided them
    with some skills that can easily translate to data science.


    In this case, we’re talking about someone who’s studied art history, for example.
    They then discover that there aren’t a lot of professional opportunities in their
    field, and they decide to become a data scientist.


    Then there’s the software platform specialist. They just know how to use that
    specific tool and they can offer a lot of value for money if you only have a simple
    problem to solve. If all you’re looking for is some reporting, for example, then
    this type of person is your best bet because they’ll offer the best value for
    money.


    You also don’t have to be concerned about them getting bored, like you would if
    you tried to get someone who has a PhD in deep learning to do the same thing.


    However, you can’t turn to them for more complicated problems because you will
    end up in that danger zone we discussed earlier in the chapter. Without a proper
    background in math and statistics, they’ll only be able to apply the tool in certain
    situations, and they definitely aren’t people you want building models or predictive
    tools.


    The domain specialist is someone with extensive ML knowledge but only in a specific
    niche. One example is someone who specializes in deep learning and computer vision.
    They might have done undergrad work or hold a master’s degree or PhD in computer
    vision.


    If your problem is related to computer vision, then they are definitely the best
    option. However, if you have a different type of problem, these aren’t the people
    you want to turn to. While it won’t be hard for them to pick up new skills, it
    will take some time.


    Like the software platform specialist, domain specialists can also fall into the
    danger zone. They’ll believe that the skills they already have can be applied
    to any problem, even if that’s not the case.


    As previously mentioned, though, you should be open to people who know their limitations
    and want to expand their skill sets. These are the people who know it will take
    them a few months to learn the particulars of any field, but they are more than
    willing to do the work and put in the effort. Sometimes this is the best approach
    because you’ll gain a very loyal data scientist since not many companies are willing
    to support people when it comes to improving themselves.


    Building a Data-Centric Culture


    When it comes to a data-centric culture, you need to look at it on three levels.


    At the **management level**, it’s all about using logic and data to drive decision
    making rather than your gut.


    In an organization with a data science culture, at the management level, your
    gut should not be making an appearance unless you’re at lunch. It’s also about
    being data driven and data informed.'
