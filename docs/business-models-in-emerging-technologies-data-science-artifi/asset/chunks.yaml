    (usually far faster than that) instead of days. Therefore, multiple approaches
    can be attempted in far shorter time frames, leading to better performance and
    quicker progress.


    ## Other Subfields of Data Science


    Besides AI, ML, and statistics, data science also has other subfields, such as:


    - Cybernetics, developed by Wiener in 1947;

    - Artificial neural networks developed by `McCulloch` and `Pitts` in 1943;

    - Computational intelligence developed in 1990;

    - Data mining developed by `Gregory Piatetsky-Shapiro` in 1990 (McCulloch and
    Pitts 1943; Conway and Siegelman 2005; Russel and Norvig 2003; Samuel 1959; Piatetsky-Shapiro
    1994).


    The main problem for those not in the field is that all these terms have fluid
    definitions. Take two people with different research backgrounds, and they’ll
    often give you different definitions for the same thing. While some conceptual
    differences exist, it often becomes difficult to tell unless you know who’s doing
    the talking. This is where the idea of data science came in. It simply made things
    a lot easier to explain. Saying a data scientist is someone who works with data
    is far simpler than trying to explain every field and subfield involved.

