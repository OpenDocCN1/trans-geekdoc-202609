- raw: '• Blockchain is a particular instantiation of distributed ledger technology.
    It surfaced with a paper by the entity known as Satoshi Nakamoto in 2008.


    • Blockchain bundles transactions together in what is known as a “block.” It allows
    transactions over a trustless network of peers.


    • There are many applications of blockchain and more are coming out every day,
    from decentralized finance to the metaverse.


    [CHAPTER 6](#Contents.xhtml#ch6)


    [Blockchain Case Studies](#Contents.xhtml#ch6)


    Blockchain technology has a wide range of applications and, as a result, offers
    benefits in numerous industries ([Figure 6.1](#Chapter06.xhtml#fig6.1)). Let’s
    look at how blockchain can improve various industries and sectors, including finance,
    cybersecurity, shipping, and even the metaverse.


    Blockchain in Finance


    Blockchain technology will eventually completely change financial services as
    we know them today, bringing about greater efficiency and transparency. One area
    where blockchain will undoubtedly change things significantly is capital markets.


    All those involved in capital markets will benefit from blockchain solutions,
    including issuers, fund managers, investors, and regulators. Let’s look at some
    of the benefits the different categories of market participants will enjoy.


    ***Issuers***


    Blockchain will make it easier, faster, and cheaper for issuers to access capital,
    thanks to programmable digital securities and assets. They will be able to issue
    new securities in a few minutes, and the associated rights and obligations will
    be encoded and automated.


    Thus, issuers and those who facilitate new issues will be able to accelerate the
    speed at which they obtain funding, resulting in cheaper and faster growth, along
    with increased profitability.


    Since issuers will be able to program the terms and conditions into the assets
    they are issuing, these assets will be far more flexible and customizable. Blockchain
    will also increase transparency and efficiency because investors will be able
    to access real-time updates via a single interface.


    ![images](images/fig6.1.jpg)


    ***Figure 6.1 Applications of blockchain***


    Another advantage of blockchain is that issuers will be able to fractionalize
    each asset. Breaking the asset down into units that are more affordable and easier
    to transfer means that issuers will be able to enjoy a more diverse investor base
    and greater liquidity.


    The lower barrier to entry also means that smaller issuers will have more opportunities.
    Furthermore, current issuers will also be able to profit because they’ll access
    new markets and new types of securities.


    ***Fund Managers***


    At its core, blockchain makes it possible for people to trade assets while ensuring
    the transaction is registered on a verifiable ledger. In other words, systemic
    risks and those of defaulting are reduced significantly because funds are more
    quickly and transparently settled and cleared.


    As the transactions will be processed faster, fund managers will have more available
    capital instead of having it tied up in various transactions. They will, therefore,
    be able to use and allocate said capital more efficiently.


    Funds will also benefit from reduced costs as their operations become more efficient
    due to simplifying various processes and functions such as accounting, administration,
    fund servicing, and allocations.


    Furthermore, we will likely see a wide range of new financial instruments and
    products based on blockchain technology. Thus, funds will be able to further diversify
    their portfolios with novel assets.


    Even though many more financial products will be on the market, their structure
    will be simpler because they will feature specific programmed standards.


    Additionally, the ability to issue digital assets and split existing assets into
    multiple units will provide funds with a broad investor base. This is especially
    beneficial as younger investors are more likely to invest in digital assets.


    ***Investors***


    Investors will benefit significantly from blockchain technology because it will
    provide a level of flexibility no investor has ever seen before. Issuers will
    be able to issue new securities faster and at a lower cost, which means they’ll
    be able to customize new instruments to the needs and desires of each investor.


    As issuers will be able to create investment vehicles that match investors’ risk
    appetite, time horizon, and desire for return, the relationship between investor
    and issuer will change significantly and become far stronger, creating a bond
    that hasn’t been seen before.


    Investors want to make as much money as possible with as little risk as possible.
    A large contributor to risk is limited liquidity. However, the new financial instruments
    and digital assets will be programmable and, therefore, carry a lower transaction
    cost, which will increase their potential liquidity and enable investors to manage
    their risk better. In conjunction with better connectivity and higher efficiency
    in capital markets, investors will benefit from a higher degree of liquidity and
    a lower cost of capital.


    The blockchain ledger will also provide investors with better insights into the
    quality of an asset, making it easier for them to do their due diligence and reducing
    investment risk.


    ***Regulators***


    Regulators are often stuck between a rock and a hard place. They’re either criticized
    for getting too involved in capital markets or not acting quickly enough to prevent
    disasters, as was the case with the 2008 Global Financial Crash.


    With blockchain, though, regulatory organizations and agencies will automate a
    wide range of functions, including compliance and auditing. In addition, since
    multiple institutions will use the same network to monitor the asset life cycle
    and their portfolios, regulators will spend more time analyzing and predicting
    risk instead of trying to figure out the systems each company uses and how they
    represent their transactions.


    Blockchain will also make it possible to minimize any friction that currently
    arises in labor and time-intensive processes regulators must deal with, thereby
    streamlining these regulatory and legal processes. Overhead costs will also drop
    as a result, and it might even be possible to prevent certain types of systemic
    risk.


    ***A Quick Look at How Blockchain Can Be Used in Capital Markets***


    Let’s look at some use cases of blockchain technology in capital markets.


    Issuance


    Issuance is the process of creating securities or other investment instruments
    that are sold to investors to raise capital. Some of the ways blockchains can
    help include:


    • Creating digital representations of existing assets and completely new digital
    assets.


    • Customizing and streamlining securitization of securities and financial instruments.


    • Enabling new business models like decentralized crowdfunding to raise capital
    more efficiently.


    Sales and Trading


    Sales and trading are essential functions of investment banks and refer to purchasing
    and selling various financial instruments, including securities. Blockchain makes
    it easier to bring digital securities to market by employing various mechanisms,
    including:


    • Bilateral negotiations


    • Centralized exchanges


    • Decentralized exchanges


    • Matching algorithms


    • Auctions


    Blockchain offers a wide range of new opportunities, including creating new digital
    financial instruments tailored to investor needs.


    Collateral Management


    The current processes used for collateral management are highly inefficient and
    slow due to the need for manual reconciliation and the physical delivery of the
    financial instruments. This limits the ability to react to quickly changing market
    conditions.


    There’s also the problem of siloed information, making it virtually impossible
    to get a high-level overview of collateral assets.'
