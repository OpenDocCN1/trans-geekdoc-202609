  fmt: '

    Blockchain streamlines collateral management processes by digitizing the holdings
    and registering them in a single and optimized location. Furthermore, smart contracts
    can improve precision by automating margin calls while invoking preset rules for
    every relationship.


    ## Exchanges


    Blockchain can streamline exchange operations for a wide range of the functions
    they perform. This technology will help reduce trading fees while also ensuring
    quicker clearing and settlement, leading to lower overheads and improved processes.


    The transparent ledger can also help exchanges when it comes to verifying data
    and access rights. Furthermore, it could even act as a robust warning system regarding
    trading activity.


    ## Clearing and Settlement


    Clearing refers to updating accounts and preparing to transfer securities and
    money, while settlement refers to actually completing the exchange.


    Entities can program smart contracts to match transfers and payments via off-chain
    cash payments, stablecoins, or cryptocurrencies. In terms of settlement, a variety
    of models can be used for matching that consider the market’s liquidity needs
    as well as risk tolerance. Such models include deferred settlement, atomic settlement,
    and deferred net settlement.


    ## Blockchain Applications in Supply Chains


    Supply chains have become increasingly complex and, in many cases, global, which
    means that their management involves various demanding processes. Moreover, all
    these processes need to be perfectly orchestrated and synchronized as they involve
    numerous actors and have many moving parts.


    As a result, the connections required to distribute goods and services have evolved
    from a chain to resemble a web. The problem is that when these processes grow
    to include multiple stages and a wide range of agents spanning numerous countries,
    transparency tends to decline. As more people become part of the process, complexity
    increases, as do the challenges.


    Blockchain technology can benefit all the main parts that an active supply chain
    consists of, namely:


    * Development sourcing

    * Production logistics

    * Information systems management

    * Coordination


    Supply chain management also includes other essential fields, such as logistics,
    shipping, freight, trucking, and other cargo transport forms. And blockchain can
    benefit any area where systems need to be streamlined in multiple ways.


    Companies can significantly improve overly complex and sluggish supply chains,
    thanks to blockchain. The end-to-end decentralized processes offered by blockchain-based
    supply chain solutions have led to industries changing the way they do business.


    Massive companies such as `IBM` have become aware of what blockchain can do for
    managing supply chains and, as a result, have already started work on solutions
    to help.


    In some cases, the technology has already been implemented. As a result, experts
    feel that blockchain stands a good chance of becoming a “universal operating system”
    for supply chain management, a bit like `Windows` or `iOS` for PCs and Macs, respectively.


    Blockchain could streamline such tasks as:


    * Registering the quantity of assets and their transfer as they move between the
    different points in the supply chain.

    * Tracking all trade-related documents, including purchase and change orders,
    receipts, and shipment notifications.

    * Assigning or validating the properties or certifications of various products,
    such as establishing whether food is fair trade or organic.

    * Associating serial numbers, digital tags, bar codes, and the like to physical
    goods.

    * Providing suppliers and vendors with all the information they need regarding
    manufacturing processes, assembly, delivery, and product maintenance.


    Thanks to blockchain, companies involved in the supply chain will enjoy benefits
    such as:


    * Improved transparency as the product’s journey throughout the supply chain will
    be documented every step of the way, thereby revealing the real origin. This will
    help improve trust and reduce the current bias that supply chains suffer from.

    * Increased scalability because it is possible to have almost any number of users
    accessing the network from an unlimited number of touchpoints.

    * Improved security, thanks to a shared ledger that cannot be modified unilaterally
    and features codified rules, which could result in the reduction or elimination
    of process and system audits.


    ### Introducing TradeLens From Maersk and IBM


    Maersk and `IBM` teamed up and created `TradeLens`, which is a blockchain-based
    shipping solution (“TradeLens | Digitizing Global Supply Chains” n.d.). The goal
    is to improve the efficiency and security of global trade while encouraging innovation
    in the industry by bringing parties together to support sharing of information
    and improving transparency.


    As of this writing, the two companies had already announced that 94 organizations
    were actively involved or had agreed to participate in the open-standard platform.
    Thus, the `TradeLens` platform already included many participants, including port
    and terminal operators, global container carriers, customs authorities, cargo
    owners, and more.


    Relying on `IBM` blockchain technology, `TradeLens` helps improve collaboration
    between multiple trading partners by ensuring everyone has access to a single,
    shared view of a particular transaction without giving away private and confidential
    information.


    As a result, shippers, shipping companies, freight forwarders, port and terminal
    operators, inland transport firms, and customs authorities can improve the efficiency
    of their interactions because they have access to shipping data and documents
    in real time, including sensor and IoT information.


    Thanks to smart contracts, `TradeLens` makes it possible for the different parties
    involved in international trade to collaborate easily and effectively.


    The platform also comes with a trade document module named `ClearWay`. This module
    allows the collaboration of importers/exporters, customs brokers, customs authorities,
    other government agencies, and NGOs in various processes and information sharing.
    As expected with blockchain, all these collaborations are supported by a secure
    audit trail that can’t be challenged.


    The `TradeLens` platform will reduce obstacles impeding global trade while also
    making international supply chains more efficient. It will make a containerized
    shipping trade platform available, which means that the whole supply chain environment
    will be connected.


    Supported by blockchain technology and developed on an open technology stack,
    the platform will deal with issues such as lack of visibility and documentation
    problems.


    Essentially, it ensures that all the parties involved in a global shipping transaction
    will be able to see the entire supply chain from start to finish and easily and
    securely access data pertinent to these transactions in real time.


    It will also improve efficiencies, thanks to the digitization and automation of
    paperwork. End users will be able to securely submit, stamp, and approve documents
    beyond organizational and national borders.


    ## Blockchain in KYC, Notarization, and Certificates


    Blockchain and distributed ledger technology will also eliminate the likelihood
    of fraudulent activity or errors regarding the authenticity of legal documentation
    and its content. Certificates and other legal documents can be issued and verified
    on a public or private ledger, providing a verifiable trail.


    Currently, most industries verify this information manually via paper documents.
    Unfortunately, this is a time-intensive and resource-heavy process.


    So, how would this work with blockchain?


    First, the signature or fingerprint of the document would have to be issued on
    the blockchain. This would mean converting the records into a digital file, such
    as a `pdf` that one could also attach metadata to.

    '
  trans: '

    区块链通过将持有物数字化并将其注册在单一且优化的位置，简化了抵押品管理流程。此外，智能合约可以在自动执行保证金通知的同时，为每个关系调用预设规则，从而提高精度。


    ## 交易所


    区块链可以简化交易所所执行的广泛范围内的操作。这项技术将帮助降低交易费用，同时确保更快速的清算和结算，从而降低开销并改进流程。


    透明的账本在验证数据和访问权限方面也能为交易所提供帮助。此外，它甚至可以作为有关交易活动的强有力警报系统。


    ## 清算与结算


    清算（Clearing）是指更新账户并准备转移证券和资金，而结算（Settlement）则是指实际完成交易。


    实体可以编写智能合约，通过链外现金支付、稳定币或加密货币来匹配转账和支付。在结算方面，可以使用多种模型进行匹配，这些模型考虑了市场的流动性需求和风险承受。。模型包括延迟结算、原子结算和延迟净结算。


    ## 区块链在供应链中的应用


    供应链变得越来越复杂，且在许多情况下是全球性的，这意味着其管理涉及各种严苛的流程。此外，所有这些流程都需要完美的编排和同步，因为它们涉及许多参与者并有许多变动。


    结果是分发货物和服务所需的连接已经从链演变为类似于网络。问题是，当这些流程增长到包含多个阶段和跨越多个国家的广泛代理时，透明度往往会下降。随着更多人参与流程，复杂性增加了，挑战也随之增加。


    区块链技术可以惠及活跃供应链组成的所有主要部分：


    * 开发采购

    * 生产物流

    * 信息系统管理

    * 协调


    供应链管理还包括其他关键领域，如物流、运输、货运、卡车和其他货物形式。区块链可以惠及任何需要多种方式简化系统的领域。


    得益于区块链，可以显著改进过于复杂和缓慢的供应链。基于区块链的供应链解决方案提供的端到端去中心化流程已改变了行业的运营方式。


    像 `IBM` 这样的大公司已经意识到区块链管理供应链的价值，并已开始开发相关的解决方案。


    在某些情况下，该技术已经实施。因此，专家们认为区块链很有可能成为供应链管理的“通用操作系统”，就像 `Windows` 和 `iOS` 分别用于 PC 和
    Mac 一样。


    区块链可以简化此类任务：


    * 记录资产在供应链不同点之间移动时的数量和转移。

    * 跟踪所有与贸易相关的文档，包括采购单和变更单、收据和装运通知。

    * 分配或验证各种产品的属性或认证，例如确定食品是否为公平贸易或有机。

    * 将序列号、数字标签、条形码等与实体货物关联。

    * 为供应商和供应商提供有关制造工艺、组装、交付和产品维护的所有信息。


    得益于区块链，参与供应链的实体将享受到利益：


    * 透明度提高，因为产品在整个供应链中的旅程每一步都将被记录，从而揭示真实的来源。这将有助于提高信任并减少供应链目前遭受的偏见。

    * 可扩展性增强，因为几乎任何数量的用户都可以从无限的触点访问网络。

    * 安全性提高，得益于无法被单方面修改的共享账本和编码规则特征，这可能会减少或消除流程和系统审计。


    ### 由马士基和 IBM 推出 TradeLens


    马士基和 `IBM` 合作创建了 `TradeLens`，这是一个基于区块链的航运解决方案（“TradeLens | 数字化全球供应链”，无日期）。其目标是提高全球贸易的效率和安全性，通过汇聚双方支持信息共享并提高透明度来推动行业创新。


    截至本文写作，两家公司已宣布有 94 个机构积极参与或同意参加该开放标准平台。因此，`TradeLens` 平台已包含许多参与者，包括港口和码头运营商、全球集装箱运输公司、海关当局、货主等。


    依靠 `IBM` 的区块链技术，`TradeLens` 通过确保每个人都能访问特定交易的单一共享视图，而不泄露隐私机密信息，帮助改善多个贸易伙伴之间的协作。


    因此，货主、运输公司、货运代理、港口和码头运营商、内运公司和海关当局可以提高互动效率，因为他们可以实时访问运输数据和文档，包括传感器和物联网信息。


    得益于智能合约，`TradeLens` 使国际贸易中的不同方能够轻松高效地协作。


    该平台还带有一个名为 `ClearWay` 的贸易文档模块。该模块允许进出口商、报关行、海关当局、其他政府机构和非政府组织（NGO）在各种流程和信息共享中进行协作。正如区块链所预期的，所有这些协作都受到一个不可挑战的安全审计追踪的支持。


    `TradeLens` 平台将减少阻碍全球贸易的障碍，同时使国际供应链更加高效。它将提供一个集装箱运输贸易平台，这意味着整个供应链环境将连接起来。


    在区块链技术支持并基于开放技术栈开发的基础上，该平台将解决缺乏可见性和文档问题等问题。


    本质上，它确保了全球海运交易的所有方能够从头到尾查看整个供应链，并实时、安全地访问与这些交易相关的数据。


    得益于文件的数字化和自动化，效率也将提高。终端用户能够跨组织和边界安全地提交、盖章和批准文档。


    ## 区块链用于 KYC、公证和证书


    区块链和分布式账本技术还将消除有关法律文件及其真实性的欺诈活动或错误。证书和其他法律文件可以在公共或私有账本上发布和验证，提供可验证的轨迹。


    目前，大多数行业通过纸质文档手动验证这些信息。不幸的是，这是一个耗时且耗资源的过程。


    那么，这在区块链上是如何工作的呢？


    首先，文件的签名或指纹必须在区块链上发布。这意味着需要记录转换为数字文件，例如一个可以附加元数据的 `pdf` 文件。

    '
