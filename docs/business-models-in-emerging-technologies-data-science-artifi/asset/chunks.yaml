- raw: 'The AI bible component refers to internal knowledge in the sense that businesses
    need to create a foundation of knowledge to achieve full AI adoption. This includes
    frameworks for maintaining existing AI projects and deploying new AI systems.


    ***Data***


    When it comes to data, two overarching elements are vital: data access and quality
    and data value.


    Companies should be prepared to run pilot data science projects to determine what
    works best for their situation. Without hands-on experience and experimentation,
    a company will waste time and resources without any valuable insights to show
    for it.


    Experimentation is also essential because it can provide companies with the insights
    needed to improve data quality.


    Furthermore, businesses must improve data accessibility. Unfortunately, many companies
    still run using old models where data is often siloed by department (or even more
    granular), which completely derails any chance of turning data into something
    usable. Therefore, improving accessibility so that everyone who needs access to
    the data can quickly find what they need is essential.


    Data governance policies are one essential way to achieve this improved level
    of accessibility.


    In terms of data value, companies need to develop ways to maintain, store, and
    access the data they already have. Protocols should be implemented to detail clear
    instructions regarding how to handle and maintain existing data assets.


    Furthermore, data only really has value if it’s being used consistently. In other
    words, businesses need to be using their data all the time. Otherwise, they’ll
    never be able to determine what is valuable and what isn’t.


    ***Culture***


    The fact is that AI adoption often lags due to culture. People in the “know” might
    be all gung-ho about adopting something new, but many aren’t that knowledgeable
    and are often worried about change.


    Even when adoption occurs, the results aren’t the best because crucial parties
    are still on the fence and don’t understand what’s going on.


    Therefore, it’s critical that all stakeholders understand what benefits can be
    derived from AI and how to gain those benefits. And it all starts with a willingness
    to experiment and iterate.


    It means understanding that it won’t be perfect from the start, which is why iteration
    is necessary. With every iteration, the result will improve significantly. However,
    expecting miracles out of the gate is a recipe for disaster because when those
    expectations aren’t met, stakeholders might start pointing fingers.


    Experimentation is just as critical as iteration. After all, if you don’t try
    anything, you’ll have difficulty figuring out what works. And with how quickly
    AI is advancing practically every day, there is always something new to try that
    might deliver far better results than expected.


    It’s also essential to learn the value of cross-functional collaboration. An AI
    project will only be successful if the key stakeholders and teams collaborate.
    Therefore, it’s vital for companies to remove silos and promote communication
    and collaboration between departments.


    ***Talent***


    Talent is one of the most important aspects. Without the right talent, companies
    won’t be able to achieve the best possible results. In fact, without the right
    team with a good leader, a business is far more likely to fail than succeed, which
    is why getting the right people on board is so critical.


    ***Where Is Your Business?***


    Based on the statements that follow, determine your business AI maturity level,
    which will help you determine what you need to work on to get closer to your goal
    of full AI adoption.


    Knowledge


    1. No knowledge of AI or data science.


    2. The organization has some understanding, but this is limited to its technical
    team.


    3. The middle management has an understanding of how data science/AI could be
    applied to its respective function.


    4. The c-suite has a strategic understanding of AI, and it has a data strategy,
    perhaps even hiring someone at the c-level to oversee it.


    Data


    1. The organization is simply collecting data.


    2. The organization is utilizing data.


    3. The organization has data quality checks in place.


    4. The organization has some ideas about data products or has created some data
    products, including products for internal use (e.g., dashboards) or external use
    (customer-facing).


    Data-Driven Culture


    ![images](images/fig7.1.jpg)


    ***Figure 7.1 Stages of a data-driven culture***


    ***Table 7.1 Skill gap analysis to determine talent needs***


    | **Analysis** || **1** || **2** || **3** || **4** || **5** || **Summary** |


    | **Existing Resource** || **Existing (Retrain)** || **New Hire** || **Consultant**
    || **Service Provider/Partner** |


    | **Data Governance** ||   ||   ||   ||   ||   ||   |


    | **Data Quality** ||   ||   ||   ||   ||   ||   |


    | **Data Architecture** ||   ||   ||   ||   ||   ||   |


    | **Developer** ||   ||   ||   ||   ||   ||   |


    | **Data Infrastructure/Engineer** ||   ||   ||   ||   ||   ||   |


    | **Analyst and BI (business intelligence)** ||   ||   ||   ||   ||   ||   |


    | Change/Technical Project Managers ||   ||   ||   ||   ||   ||   |


    Assessing Blockchain Capabilities and Potential


    In this section, we present a framework that can help an organization understand
    whether blockchain can be applied to a particular problem.


    After you answer these questions, you’ll have a better idea of whether blockchain
    is suited for your business or not. You’ll also know if blockchain is the best
    solution for the problem you’re tackling. Essentially, this framework is meant
    to help you figure out if blockchain will help your business and what type of
    solution you’re looking for.


    ***Business***


    1. What problem do you need to solve?


    2. If the problem doesn’t require solving at least one issue related to the following,
    blockchain might not be the right option.


    a. Costs


    b. Efficiency


    c. Redundancy


    d. Trust


    e. Transparency


    f. Security


    g. Censorship


    3. What sort of coordination is necessary?


    a. Is it an internal or external solution?


    b. If it’s external, is the ecosystem developed enough in terms of:


    i. Developers


    ii. Academia


    iii. Industry bodies


    iv. Customers


    v. Corporates and institutions


    vi. Entrepreneurs and small and medium businesses


    vii. Investors


    viii. Suppliers


    4. Is it a B2C or B2B problem? B2C issues will be subject to more demanding regulatory
    requirements, and creating the right ecosystem will also be more challenging.


    5. How complex and novel is the solution?


    a. Is it a solution that requires a low level of novelty and coordination, making
    it less expensive and more highly focused?


    b. Does the solution consist of high-novelty innovations requiring fewer users
    to generate value right away?


    c. Is it a solution that comprises low-novelty innovation but a high degree of
    coordination with outside stakeholders?


    d. Is the solution one where a lot of innovation and coordination is necessary,
    making it a transformative solution?


    ***Technology***


    1. What type of blockchain would be best suited for the solution you’ve developed?


    2. Is the ecosystem for your distributed ledger technology sufficiently developed,
    that is, do you already have a DApp for your solution?


    3. What other solution could you use other than blockchain? In other words, would
    a relational database achieve the same thing?


    ***Legal***


    1. Is your solution so innovative that there’s no regulatory precedent?


    2. If rules and legislation exist, how friendly is the jurisdiction?


    a. In terms of where your company will be located?


    b. In terms of where your customers are located?


    3. Do you have access to any financial and legal guidance?


    a. Can you get help through existing regulations?


    b. Do you have any AML (Anti-Money Laundering) or KYC (Know Your Customer) issues
    to tackle, and can you get help?


    4. Do you have to consider any other directives and regulations, such as GDPR?


    a. Do you have access to assistance regarding privacy and digital identity issues?'
  fmt: "\nThe AI bible component refers to internal knowledge in the sense that businesses\
    \ need to create a foundation of knowledge to achieve full AI adoption. This includes\
    \ frameworks for maintaining existing AI projects and deploying new AI systems.\n\
    \n## Data\n\nWhen it comes to data, two overarching elements are vital: data access\
    \ and quality and data value.\n\nCompanies should be prepared to run pilot data\
    \ science projects to determine what works best for their situation. Without hands-on\
    \ experience and experimentation, a company will waste time and resources without\
    \ any valuable insights to show for it.\n\nExperimentation is also essential because\
    \ it can provide companies with the insights needed to improve data quality.\n\
    \nFurthermore, businesses must improve data accessibility. Unfortunately, many\
    \ companies still run using old models where data is often siloed by department\
    \ (or even more granular), which completely derails any chance of turning data\
    \ into something usable. Therefore, improving accessibility so that everyone who\
    \ needs access to the data can quickly find what they need is essential.\n\nData\
    \ governance policies are one essential way to achieve this improved level of\
    \ accessibility.\n\nIn terms of data value, companies need to develop ways to\
    \ maintain, store, and access the data they already have. Protocols should be\
    \ implemented to detail clear instructions regarding how to handle and maintain\
    \ existing data assets.\n\nFurthermore, data only really has value if it’s being\
    \ used consistently. In other words, businesses need to be using their data all\
    \ the time. Otherwise, they’ll never be able to determine what is valuable and\
    \ what isn’t.\n\n## Culture\n\nThe fact is that AI adoption often lags due to\
    \ culture. People in the “know” might be all gung-ho about adopting something\
    \ new, but many aren’t that knowledgeable and are often worried about change.\n\
    \nEven when adoption occurs, the results aren’t the best because crucial parties\
    \ are still on the fence and don’t understand what’s going on.\n\nTherefore, it’s\
    \ critical that all stakeholders understand what benefits can be derived from\
    \ AI and how to gain those benefits. And it all starts with a willingness to experiment\
    \ and iterate.\n\nIt means understanding that it won’t be perfect from the start,\
    \ which is why iteration is necessary. With every iteration, the result will improve\
    \ significantly. However, expecting miracles out of the gate is a recipe for disaster\
    \ because when those expectations aren’t met, stakeholders might start pointing\
    \ fingers.\n\nExperimentation is just as critical as iteration. After all, if\
    \ you don’t try anything, you’ll have difficulty figuring out what works. And\
    \ with how quickly AI is advancing practically every day, there is always something\
    \ new to try that might deliver far better results than expected.\n\nIt’s also\
    \ essential to learn the value of cross-functional collaboration. An AI project\
    \ will only be successful if the key stakeholders and teams collaborate. Therefore,\
    \ it’s vital for companies to remove silos and promote communication and collaboration\
    \ between departments.\n\n## Talent\n\nTalent is one of the most important aspects.\
    \ Without the right talent, companies won’t be able to achieve the best possible\
    \ results. In fact, without the right team with a good leader, a business is far\
    \ more likely to fail than succeed, which is why getting the right people on board\
    \ is so critical.\n\n## Where Is Your Business?\n\nBased on the statements that\
    \ follow, determine your business AI maturity level, which will help you determine\
    \ what you need to work on to get closer to your goal of full AI adoption.\n\n\
    ### Knowledge\n\n1. No knowledge of AI or data science.\n2. The organization has\
    \ some understanding, but this is limited to its technical team.\n3. The middle\
    \ management has an understanding of how data science/AI could be applied to its\
    \ respective function.\n4. The c-suite has a strategic understanding of AI, and\
    \ it has a data strategy, perhaps even hiring someone at the c-level to oversee\
    \ it.\n\n### Data\n\n1. The organization is simply collecting data.\n2. The organization\
    \ is utilizing data.\n3. The organization has data quality checks in place.\n\
    4. The organization has some ideas about data products or has created some data\
    \ products, including products for internal use (e.g., dashboards) or external\
    \ use (customer-facing).\n\n### Data-Driven Culture\n\n![images](images/fig7.1.jpg)\n\
    \n**Figure 7.1 Stages of a data-driven culture**\n\n**Table 7.1 Skill gap analysis\
    \ to determine talent needs**\n\n| Analysis | 1 | 2 | 3 | 4 | 5 | Summary |\n\
    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| **Existing Resource** |\
    \ **Existing (Retrain)** | **New Hire** | **Consultant** | **Service Provider/Partner**\
    \ | | |\n| Data Governance | | | | | | |\n| Data Quality | | | | | | |\n| Data\
    \ Architecture | | | | | | |\n| Developer | | | | | | |\n| Data Infrastructure/Engineer\
    \ | | | | | | |\n| Analyst and BI (business intelligence) | | | | | | | |\n| Change/Technical\
    \ Project Managers | | | | | | |\n\n## Assessing Blockchain Capabilities and Potential\n\
    \nIn this section, we present a framework that can help an organization understand\
    \ whether blockchain can be applied to a particular problem.\n\nAfter you answer\
    \ these questions, you’ll have a better idea of whether blockchain is suited for\
    \ your business or not. You’ll also know if blockchain is the best solution for\
    \ the problem you’re tackling. Essentially, this framework is meant to help you\
    \ figure out if blockchain will help your business and what type of solution you’re\
    \ looking for.\n\n### Business\n\n1. What problem do you need to solve?\n2. If\
    \ the problem doesn’t require solving at least one issue related to the following,\
    \ blockchain might not be the right option.\n    a. Costs\n    b. Efficiency\n\
    \    c. Redundancy\n    d. Trust\n    e. Transparency\n    f. Security\n    g.\
    \ Censorship\n3. What sort of coordination is necessary?\n    a. Is it an internal\
    \ or external solution?\n    b. If it’s external, is the ecosystem developed enough\
    \ in terms of:\n        i. Developers\n        ii. Academia\n        iii. Industry\
    \ bodies\n        iv. Customers\n        v. Corporates and institutions\n    \
    \    vi. Entrepreneurs and small and medium businesses\n        vii. Investors\n\
    \        viii. Suppliers\n4. Is it a B2C or B2B problem? B2C issues will be subject\
    \ to more demanding regulatory requirements, and creating the right ecosystem\
    \ will also be more challenging.\n5. How complex and novel is the solution?\n\
    \    a. Is it a solution that requires a low level of novelty and coordination,\
    \ making it less expensive and more highly focused?\n    b. Does the solution\
    \ consist of high-novelty innovations requiring fewer users to generate value\
    \ right away?\n    c. Is it a solution that comprises low-novelty innovation but\
    \ a high degree of coordination with outside stakeholders?\n    d. Is the solution\
    \ one where a lot of innovation and coordination is necessary, making it a transformative\
    \ solution?\n\n### Technology\n\n1. What type of blockchain would be best suited\
    \ for the solution you’ve developed?\n2. Is the ecosystem for your distributed\
    \ ledger technology sufficiently developed, that is, do you already have a `DApp`\
    \ for your solution?\n3. What other solution could you use other than blockchain?\
    \ In other words, would a relational database achieve the same thing?\n\n### Legal\n\
    \n1. Is your solution so innovative that there’s no regulatory precedent?\n2.\
    \ If rules and legislation exist, how friendly is the jurisdiction?\n    a. In\
    \ terms of where your company will be located?\n    b. In terms of where your\
    \ customers are located?\n3. Do you have access to any financial and legal guidance?\n\
    \    a. Can you get help through existing regulations?\n    b. Do you have any\
    \ `AML` (Anti-Money Laundering) or `KYC` (Know Your Customer) issues to tackle,\
    \ and can you get help?\n4. Do you have to consider any other directives and regulations,\
    \ such as `GDPR`?\n    a. Do you have access to assistance regarding privacy and\
    \ digital identity issues?\n"
  trans: "\n\nAI 圣经组件（AI bible component）指的是内部知识，意味着企业需要建立知识基础以实现全面的 AI 应用。这包括用于维护现有\
    \ AI 项目和部署新 AI 系统的框架。\n\n## 数据\n\n在涉及数据时，有两个重大的关键要素至关重要：数据访问性与质量，以及数据价值。\n\n公司应该准备好运行试点数据科学项目，以确定哪种方案最适合自己的情况。如果没有实操经验和实验，公司将浪费时间和资源，且无法产出任何有价值的见解。\n\
    \n实验也至关重要，因为它可以为公司提供改进数据质量所需的见解。\n\n此外，企业必须提高数据的可访问性。遗憾的是，许多公司仍在使用旧模式模式，数据通常按部门（甚至更细粒的粒度）被孤立，这完全阻碍了将数据转化为可用内容的任何机会。因此，提高可访问性，让每个需要访问数据的人都能快速找到他们需要的内容是至关重要的。\n\
    \n数据治理政策是实现这种改进的可访问性的核心途径之一。\n\n在数据价值方面，公司需要开发维护、存储和访问已有数据的方法。应该实施相关协议，详细说明如何处理和维护现有数据资产的清晰指令。\n\
    \n此外，数据只有在持续使用时才真正具有价值。换句话说，企业需要一直使用他们的数据。否则，他们永远无法确定哪些是有价值的哪些不是。\n\n## 文化\n\n\
    事实是，AI 的采用往往由于文化原因而滞后。“圈内人士”可能对采用新事物充满热情，但许多人并没有那么懂行，并且经常对变化感到担忧。\n\n即使发生了应用，结果也不是理想的，因为关键方仍然持保留态度，并且不发生了什么。\n\
    \n因此，让所有利益相关者理解从 AI 中可以获得什么收益以及如何获得这些收益至关重要。这一切始于对实验和迭代的意愿。\n\n这意味着要理解它从一开始就不会是完美的，这就是为什么迭代是必要的。通过每一次迭代，结果都会显著提高。然而，一开场就期待奇迹是灾难的根源，因为当这些期望落空时，利益相关者可能会开始互相指责。\n\
    \n实验与迭代同样重要。毕竟，如果你不尝试任何东西，就很难发现什么方案是有效的。考虑到 AI 几乎每天都在飞速发展，总会有新事物可以尝试，并可能带来比预期好得多的结果。\n\
    \n学习跨部门协作的价值也至关重要。AI 项目只有在关键利益相关者和团队协作时才会获得成功。因此，公司消除信息孤岛并促进部门间的沟通与协作至关重要。\n\n\
    ## 人才\n\n人才是最重要的方面之一。没有合适的人才，公司将无法获得最好的结果。事实上，如果没有由优秀领导者的合适团队，企业失败的可能性远大于成功，这就是为什么招募合适的人才至关重要。\n\
    \n## 你的企业处于什么阶段？\n\n根据以下陈述，确定你的企业 AI 成熟度，这将帮助你确定需要在哪些方面努力，以实现全面 AI 应用的目标。\n\n\
    ### 知识\n\n1. 对 AI 或数据科学一无所知。\n2. 组织有一定的了解，但仅限于其技术团队。\n3. 中层管理理解数据科学/AI 如何应用于其各自的职能。\n\
    4. 高管层对 AI 有战略性的理解，并拥有数据战略，甚至可能聘请了 C 级人员来监督。\n\n### 数据\n\n1. 组织仅仅在收集数据。\n2. 组织正在利用数据。\n\
    3. 组织已经建立了数据质量检查机制。\n4. 组织对数据产品有一些想法，或已经创建了一些数据产品，包括内部使用的（如仪表板）或外部使用的（面向客户）产品。\n\
    \n### 数据驱动文化\n\n![images](img/fig7.1.jpg)\n\n**图 7.1 数据驱动文化的阶段**\n\n**表 7.1 用于确定人才需求的技能差距分析**\n\
    \n| 分析 | 1 | 2 | 3 | 4 | 5 | 总结 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\
    \ :--- |\n| **现有资源** | **现有（重新培训）** | **新聘** | **顾问** | **服务提供商/合作伙伴** | | |\n\
    | 数据治理 | | | | | | | |\n| 数据质量 | | | | | | | |\n| 数据架构 | | | | | | | |\n| 开发人员\
    \ | | | | | | | |\n| 数据基础设施/工程师 | | | | | | | |\n| 分析师和 BI（商业智能） | | | | | | |\
    \ |\n| 变更/技术项目经理 | | | | | | | |\n\n## 评估区块链能力与潜力\n\n在本节中，我们提供了一个框架，可以帮助组织理解区块链是否适用于特定问题。\n\
    \n在回答这些问题后，你将更清楚地了解区块链是否适用于你的业务。你也将知道区块链是否是你正在解决问题的最佳解决方案。基本上，这个框架旨在帮助你判断区块链是否有助于你的业务。\n\
    \n### 业务\n\n1. 你需要解决的问题是什么？\n2. 如果问题涉及以下至少一点，区块链可能不是选择：\n    a. 成本\n    b. 效率\n\
    \    c. 冗余\n    d. 信任\n    e. 透明度\n    f. 安全性\n    g. 审查\n3. 需要什么样的协作？\n    a.\
    \ 是内部还是外部解决方案？\n    b. 如果是外部的，以下生态系统是否足够成熟：\n        i. 开发人员\n        ii. 学术界\n\
    \        iii. 行业机构\n        iv. 客户\n        v. 企业\n        vi. 创业者和中小企业\n    \
    \    vii. 投资者\n        viii. 供应商\n4. 是 B2C 还是 B2B 问题？B2C 面临更严格的监管要求，创建合适的生态系统也更有挑战性。\n\
    5. 解决方案的复杂性和新颖性如何？\n    a. 它是否是一个对新颖性和协作要求较低、成本更低且更集中的解决方案？\n    b. 它是否包含高新颖性的创新，且不需要大量用户即可产生价值？\n\
    \    c. 它是否是一个新颖性低但需要与利益相关者高度协作的解决方案？\n    d. 它是否是一个需要大量创新和协作的具有变革性的解决方案？\n\n\
    ### 技术\n\n1. 哪种区块链最适合你的解决方案？\n2. 分布式账技术的生态系统是否足够成熟，即你是否为你的解决方案开发了 `DApp`？\n3.\
    \ 除了区块链，还可以使用什么其他方案？换句话说，关系数据库能否实现？\n\n### 法律\n\n1. 你的解决方案是否创新到没有监管先例？\n2. 如果存在规则法规，该司法管辖区的友好程度如何？\n\
    \    a. 根据公司所在地？\n    b. 根据客户所在地？\n3. 你是否可以获得财务和法律指导？\n    a. 你能否通过现有法规获得帮助？\n\
    \    b. 你是否有需要解决的 `AML`（反洗钱）或 `KYC`（了解您的客户）问题，并能否获得帮助？\n4. 你是否需要考虑其他指令和法规，例如 `GDPR`？\n\
    \    a. 你是否可以获得有关隐私和数字身份问题的协助？\n\n"
