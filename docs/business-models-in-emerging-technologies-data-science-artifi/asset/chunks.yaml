    ### 前言

    技术领域进展之快，以至于我们往往没有意识到已经走了多远。在过去的 20 年里，`data science`、`artificial intelligence`、`Internet
    of Things` 以及 `blockchain` 等技术改变了商业和社会的世界。这些新兴技术提供了广泛的机会。然而，它们也带来了企业必须面对的挑战，例如开发新的商业模式、发现最佳采用策略以及数字化转型。本书是关于两种最重要的新兴技术——`data
    science/AI` 和 `blockchain` 的实用指南。由于在所有领域具有广泛的适用性，决策者将从这些这些领域受益。


    我们正淹没在数据中！数据管理金字塔（也称为 DIKW 金字塔）探讨了数据、信息、知识和智慧之间的层次关系，如图 1 所示。我们注意到分析水平上存在明显的层次结构。如果将其转化为业务语言，我们可以得到一个底部是影响的金字塔，随后是通往洞察的智能，最后是创新(2)。


    提升数据分析水平并不容易。从数据中获取价值洞察是一项艰巨的任务。我们往往缺乏所需的专业知识，这是因为洞察并没有在某个工具或报告中呈现出来。要将信息转化为可操作的洞察，需要知道如何从多个源收集数据，然后连接这些转化为有意义知识的节点。


