- raw: 'The use-case approach is more top-down and occurs when the organization has
    a particular problem that they need solved. They might start by employing someone
    to help with the design of a plan and to come up with a solution for their specific
    problem. Then, they look at how the findings are relevant to other situations.


    ***Where to Start***


    The first step is to map how your organization uses data. You need to be aware
    of how data flows within your organization, from when it’s collected all the way
    to how it’s used.


    You want to get your employees to understand how important strategy and innovation
    are while rewarding good behavior, which is essential for data scientists. They
    often want recognition and to feel as if they’re making a difference. So, promote
    good work and show others how effective your data scientists are.


    You also want to create an embedded culture, as this is the most effective way
    to break down silos and improve communication. Your data scientists must work
    closely with developers, product owners, managers, and other stakeholders. This
    is essential to ensuring that research is relevant, results are implemented, and
    they have a positive effect within the firm.


    Key Takeaways


    • There are different types of data scientists. The main ones are: the ML specialist,
    the statistician, and the quantitative specialist.


    • Integrating data scientists within an organization requires the right culture.


    • Creating the right culture requires overcoming resistance to change. Some organizations
    prefer to focus on small projects first, and others prefer a more disruptive approach.


    [CHAPTER 5](#Contents.xhtml#ch5)


    [An Introduction to Blockchain](#Contents.xhtml#ch5)


    Blockchain is a decentralized, digital ledger that is used to record transactions
    across many computers so that the records cannot be altered retroactively without
    the alteration of all subsequent blocks and the collusion of the network.


    Since the seminal paper by Satoshi Nakamoto (2008), blockchain has risen as one
    of the most important trends in technology with applications ranging from finance,
    to supply chains, and more.


    In this chapter, we’ll be exploring everything a nontechnical decision maker needs
    to know about blockchain. We’ll start with the history of money, and how this
    incentivized the creation of blockchain technology, before moving on to other
    types of application ([Figure 5.1](#Chapter05.xhtml#fig5.1)).


    The Evolution of Money and Payment Systems


    Commerce has been around for a very long time, even before money, as we know it
    today, came into being. Remember that commerce is defined as the exchange of goods,
    services, or something of value between entities.


    Therefore, people weren’t exchanging goods or services for money when commerce
    first came about. Instead, other forms of payment were used.


    Of course, since then, money and payment systems have changed significantly. Instead
    of exchanging livestock, for example, we use things such as credit cards and cryptocurrency.
    In other words, we can pay for things anytime we like, no matter where we are.


    So, let’s look at how money and payment systems evolved from the very beginning.


    ![images](images/fig5.1.jpg)


    ***Figure 5.1 A history of blockchain***


    ***Bartering***


    Commerce first started with bartering, which simply means that people would exchange
    goods and services for other goods and services. For example, a farmer might need
    a hoe to till his field. He’d go to the blacksmith and offer to pay with the vegetables
    he cultivated. Both parties benefited since the farmer would get the hoe while
    the blacksmith would get food in exchange.


    At the time, livestock was considered a measure of wealth. The more cows, or sheep
    you owned, the wealthier you were, which is why livestock was often used to barter
    for goods and services.


    ***Coins***


    One problem with bartering was that it could be complicated. You had to plan out
    what you needed and transport the goods in advance. So instead, some ancient civilizations
    would use beads and shells as a form of payment, making them the original coins.


    The advantage was portability. It was easier to carry shells and beads than heavy
    goods. They would act as an IOU, so people could get what they needed right away.


    Eventually, precious metals replaced beads and shells as they had inherent value.
    In other words, it was no longer an IOU because the coin itself had value due
    to the precious metal it was made of.


    Among the first recorded uses of gold and silver coins is attributed to the people
    of the ancient civilization of Lydia.


    ***Leather as Currency***


    In ancient China, people used white deerskin as currency. The principle was similar
    to the cash we use today, but the “notes” were much larger. In fact, this money
    could have been as big as one square foot of leather.


    ***Paper Money***


    Initially developed by the Chinese, paper money had a problem. It was difficult
    to figure out its value and maintain it. Other problems included not only the
    production process but also inflation. So, paper money eventually fell out of
    use. In fact, it came and went throughout ancient history because of its challenges.


    ***Gold***


    In 1816, England set gold as a standard of value. Subsequently, Europe began to
    use gold as a standard to measure the value of banknotes. In other words, each
    banknote was worth a particular amount of gold. However, it should be noted that
    to issue a banknote for a certain amount of gold, the bank had to have the equivalent
    amount of gold in their reserves.


    In 1900, the United States adopted the same standard. Then, in 1913, the Federal
    Reserve system was established. Among other things, the Federal Reserve had to
    ensure that checks and notes could be converted for gold and would always be honored.


    ***Credit Cards***


    The 20th century saw the rise of the credit card. It initially started with retailers
    offering consumers credit, including department stores and gas stations. They
    created cards that would make it easier for people to spend money.


    ***The U.S. Dollar***


    In 1933, deflation was a severe problem that was only getting worse in the United
    States. Therefore, the country did away with the gold standard so Americans wouldn’t
    exchange their banknotes for gold and deplete the gold supply.


    From that point on, the Federal government officially backed the monetary system,
    though the United States would allow foreign governments to trade in their dollars
    for gold until 1971. This practice was ended over the concern that the U.S. gold
    supply would dwindle.


    ***Online Payment Systems***


    The 1990s saw the rise of the Internet, which naturally led to many people shopping
    online. As a result, a wide range of payment systems arose that enabled people
    to pay for their online purchases. Evidence suggests that one of the first companies
    to perform an online transaction was Pizza Hut because people could order via
    their website as far back as 1994.


    ***Mobile Payments***


    As more and more people used mobiles, mobile payment systems developed. The first
    transaction was registered in 1997 and is owed to Coca-Cola and their special
    vending machines that allowed consumers to pay via text message.


    Since then, mobile has become one of the most popular forms of payment. People
    can pay at any time, regardless of where they are, and merchants can receive payments
    without needing a cash register or traditional POS.


    The Rise of Bitcoin and Blockchain


    The idea of blockchain, also known as distributed ledger technology (DLT), has
    been around for quite a while. In fact, it was first presented by Stuart Haber
    and W. Scott Stornetta in 1991 (Beyer 2018). However, it wasn’t until 2008, when
    Satoshi Nakamoto released a white paper with Bitcoin’s blockchain, that certain
    challenges were solved, and the practical applications became obvious (Nakamoto
    2008).'
