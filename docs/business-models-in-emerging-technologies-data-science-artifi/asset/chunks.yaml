    different types of blockchain may differ.” Public blockchains, for example, are
    aimed at the general public, as the name implies. Conversely, private blockchain
    networks are designed for “invitation-only users and their networks” (Parizo n.d.).


    #### Public Blockchain


    The public blockchain allowed the creation of Bitcoin and helped make DLT popular.
    This type of network eliminates issues inherent to centralization, such as reduced
    security and minimal transparency.


    With `DLT`, the data isn’t stored in a single place but distributed across a peer-to-peer
    network, which is where the name comes from.


    However, since it is decentralized, there must be a way to verify that the data
    is authentic, which is where the consensus algorithm we already discussed comes
    in. Essentially, the network.


    #### Advantages of Public Blockchain

    One major advantage of public blockchains is that they are independent.


    #### Disadvantages of Public Blockchain

    Like with anything, public blockchains have certain disadvantages.


    #### Use Cases of Public Blockchain

    Public blockchains are used mainly for the mining and exchange of cryptocurrencies,
    such as Bitcoin.


    #### Private Blockchain


    A private blockchain consists of a network controlled by a single entity or that
    functions in a restricted environment. Though it operates as a public blockchain
    in terms of decentralization and using a peer-to-peer network, a private blockchain
    is much smaller.


    #### Advantages of Private Blockchain

    A private blockchain is, in essence, like a company’s internal network.


    #### Disadvantages of Private Blockchain

    Some claim that private blockchains can’t be called true blockchains because the
    whole idea is of decentralization without a single entity in control.

