- raw: 'No one knows who Satoshi Nakamoto is as the name is a pseudonym. Many suspect
    that the pseudonym represents a group rather than being one person.


    Blockchain is what makes Bitcoin possible, and we can’t really talk about one
    without talking about the other. This technology has developed by leaps and bounds
    since 2008 and has the potential to affect every industry.


    Essentially, blockchain is a large electronic system that allows you to build
    applications, with currency being just one of them. Interestingly, it wasn’t until
    around 2014 that people realized the technology behind Bitcoin could be used for
    many other things.


    In essence, blockchain consists of a transparent and decentralized ledger that
    makes a permanent record of a transaction between two people without the need
    for another party to authenticate it. The result is a highly efficient process
    that significantly lowers transaction costs.


    When companies realized how powerful blockchain was, many began investing in and
    exploring the technology to understand its full potential. Though we haven’t yet
    scratched the surface, blockchain has already proven that it can affect everything
    from supply chains and health care to contract management and voting.


    Around 2013, Vitalik Buterin, the cofounder of Bitcoin magazine, became frustrated
    with Bitcoin’s limitations and pushed for a more flexible blockchain. However,
    the Bitcoin community didn’t agree. So, Buterin went on to develop the second
    public blockchain, which he called Ethereum.


    The biggest difference between Ethereum and Bitcoin is that the former can record
    other transactions such as contracts and loans, whereas the Bitcoin blockchain
    is dedicated to currency.


    Ethereum came to market in 2015, and people can use it to create smart contracts.
    Furthermore, these smart contracts can be automatically processed based on various
    conditions set within the blockchain.


    At the moment, the key driver of blockchain is the “proof of work” concept. Essentially,
    a very complicated and expensive computer calculation is done (a process referred
    to as “mining”) to create a block, which consists of multiple transactions.


    Subsequently, the miners will verify the legitimacy of the transactions within
    the block by solving a proof of work problem. Once again, these problems are very
    complicated and require a lot of computing power to solve, making them extremely
    expensive.


    The first miner who finds the solution is provided with a reward, and the transaction
    is saved on the blockchain.


    Interestingly, Ethereum developers want to switch to a more accessible consensus
    system referred to as “proof of stake.”


    The goal is to verify transactions and reach a consensus on the blockchain. However,
    the process differs in that the new block’s creator is selected using a deterministic
    approach, “depending on its wealth, also defined as a stake” (“Proof-of-Stake
    (PoS)” n.d.).


    The miners, known as foragers, don’t receive a reward. Instead, they earn transaction
    fees. Some support the shift due to the lower cost required to obtain a distributed
    type of consensus.


    What Is Blockchain?


    As previously explained, blockchain consists of a decentralized ledger of permanent
    records within a network where information is stored. It’s a distributed database
    stored digitally on multiple computers.


    What makes blockchain special is that it ensures the validity and safety of the
    recorded data and, therefore, establishes trust without the need to get a third
    party involved.


    The difference between a traditional database and blockchain lies in how the data
    is structured. In a blockchain, the data is organized in groups, referred to as
    blocks. Each block can only hold a certain amount of data, after which it is closed
    and connected to the block that was filled before it, creating a data chain known
    as the blockchain.


    Any new data collected after a block has been closed and added to the chain is
    stored in a new block, which will also be closed and added to the chain when filled.


    The advantage of this approach is that it creates a timeline that can’t be tampered
    with, especially when it is implemented in a decentralized way. For example, when
    a block is full, it can no longer be altered and is added to the chain with a
    timestamp.


    While a blockchain can store all sorts of information, it has primarily been used
    as a transaction ledger, such as with Bitcoin.


    When it comes to Bitcoin, blockchain technology has been applied using a decentralized
    approach, meaning that a single person or group can’t control it. Instead, all
    the people on the blockchain maintain collective control.


    Furthermore, a decentralized blockchain is immutable, meaning that the data cannot
    be changed, deleted, or destroyed, making it irreversible.


    In essence, the idea of using blockchain is to allow people who don’t trust each
    other to share important data securely and so that it cannot be tampered with.


    Understanding How Blockchain Works


    Blockchain is made up of three vital elements: blocks, nodes, and miners.


    As previously explained, every chain consists of multiple blocks. However, every
    block contains data, a nonce, and a hash.


    The nonce is a 32-bit whole number that is generated randomly when the block is
    created. The nonce then creates a block header hash, which is a 256-bit number
    connected to the nonce.


    So, when the first block in a chain is created, the attached nonce spawns the
    cryptographic hash. The data that is then registered within that block will forever
    be connected to the nonce and hash.


    Miners create new blocks on the blockchain, with each block featuring a unique
    nonce and hash. However, every block also references the hash of the block before
    it, which makes mining difficult, especially on a large chain.


    The way mining works is that special software is used to solve very complicated
    math problems that allow miners to find a nonce that can generate an acceptable
    hash. Considering that a nonce is 32 bits and a hash is 256, there are approximately
    4 billion combinations, and only one is correct. When a miner finds the right
    combination, their block is added to the chain.


    If anyone wants to change an earlier block in the chain, they also have to mine
    all the subsequent blocks. This is why it’s tough to tamper with blockchain technology.
    While it is possible, it is prohibitively expensive and requires a lot of time
    and computing power to the point where it’s simply not worth it.


    When a miner successfully mines a block, meaning that they found the right nonce
    and hash, all the nodes on the network accept the change, and the miner receives
    a financial reward.


    Nodes are any form of electronic device that can maintain a copy of the blockchain
    and ensure that network continues to function.


    Every node has a copy of the blockchain. The network must approve the new block
    for the chain to be updated. Every action on the blockchain can easily be viewed
    and verified, and each participant is provided with a unique number that shows
    what transactions they performed.


    By combining easily accessible and transparent information with an accountability
    system, the blockchain can maintain its integrity and ensure trustworthy transactions
    between people ([Figure 5.2](#Chapter05.xhtml#fig5.2)).


    ***Cryptography and Blockchain***


    When it comes to blockchain, cryptography ensures that the transactions and participants
    are secure. It also ensures that operations can be independent of a central authority
    while also providing protection against double-spending.


    For a long time, the concept of double-spending was a major issue with cryptocurrencies.
    The idea of double-spending is that a unit of cryptocurrency could be spent twice
    since digital information is relatively easy to duplicate by someone who knows
    what they’re doing. Thanks to how blockchain works, this is no longer a concern.


    So, how does cryptography work in terms of blockchain?'
  fmt: '

    No one knows who Satoshi Nakamoto is as the name is a pseudonym. Many suspect
    that the pseudonym represents a group rather than being one person.


    Blockchain is what makes Bitcoin possible, and we can’t really talk about one
    without talking about the other. This technology has developed by leaps and bounds
    since 2008 and has the potential to affect every industry.


    Essentially, blockchain is a large electronic system that allows you to build
    applications, with currency being just one of them. Interestingly, it wasn’t until
    around 2014 that people realized the technology behind Bitcoin could be used for
    many other things.


    In essence, blockchain consists of a transparent and decentralized ledger that
    makes a permanent record of a transaction between two people without the need
    for another party to authenticate it. The result is a highly efficient process
    that significantly lowers transaction costs.


    When companies realized how powerful blockchain was, many began investing in and
    exploring the technology to understand its full potential. Though we haven’t yet
    scratched the surface, blockchain has already proven that it can affect everything
    from supply chains and health care to contract management and voting.


    Around 2013, Vitalik Buterin, the cofounder of Bitcoin magazine, became frustrated
    with Bitcoin’s limitations and pushed for a more flexible blockchain. However,
    the Bitcoin community didn’t agree. So, Buterin went on to develop the second
    public blockchain, which he called Ethereum.


    The biggest difference between Ethereum and Bitcoin is that the former can record
    other transactions such as contracts and loans, whereas the Bitcoin blockchain
    is dedicated to currency.


    Ethereum came to market in 2015, and people can use it to create smart contracts.
    Furthermore, these smart contracts can be automatically processed based on various
    conditions set within the blockchain.


    At the moment, the key driver of blockchain is the “proof of work” concept. Essentially,
    a very complicated and expensive computer calculation is done (a process referred
    to as “mining”) to create a block, which consists of multiple transactions.


    Subsequently, the miners will verify the legitimacy of the transactions within
    the block by solving a proof of work problem. Once again, these problems are very
    complicated and require a lot of computing power to solve, making them extremely
    expensive.


    The first miner who finds the solution is provided with a reward, and the transaction
    is saved on the blockchain.


    Interestingly, Ethereum developers want to switch to a more accessible consensus
    system referred to as “proof of stake.”


    The goal is to verify transactions and reach a consensus on the blockchain. However,
    the process differs in that the new block’s creator is selected using a deterministic
    approach, “depending on its wealth, also defined as a stake” (“Proof-of-Stake
    (PoS)” n.d.).


    The miners, known as foragers, don’t receive a reward. Instead, they earn transaction
    fees. Some support the shift due to the lower cost required to obtain a distributed
    type of consensus.


    ## What Is Blockchain?


    As previously explained, blockchain consists of a decentralized ledger of permanent
    records within a network where information is stored. It’s a distributed database
    stored digitally on multiple computers.


    What makes blockchain special is that it ensures the validity and safety of the
    recorded data and, therefore, establishes trust without the need to get a third
    party involved.


    The difference between a traditional database and blockchain lies in how the data
    is structured. In a blockchain, the data is organized in groups, referred to as
    blocks. Each block can only hold a certain amount of data, after which it is closed
    and connected to the block that was filled before it, creating a data chain known
    as the blockchain.


    Any new data collected after a block has been closed and added to the chain is
    stored in a new block, which will also be closed and added to the chain when filled.


    The advantage of this approach is that it creates a timeline that can’t be tampered
    with, especially when it is implemented in a decentralized way. For example, when
    a block is full, it can no longer be altered and is added to the chain with a
    timestamp.


    While a blockchain can store all sorts of information, it has primarily been used
    as a transaction ledger, such as with Bitcoin.


    When it comes to Bitcoin, blockchain technology has been applied using a decentralized
    approach, meaning that a single person or group can’t control it. Instead, all
    the people on the blockchain maintain collective control.


    Furthermore, a decentralized blockchain is immutable, meaning that the data cannot
    be changed, deleted, or destroyed, making it irreversible.


    In essence, the idea of using blockchain is to allow people who don’t trust each
    other to share important data securely and so that it cannot be tampered with.


    ## Understanding How Blockchain Works


    Blockchain is made up of three vital elements: blocks, nodes, and miners.


    As previously explained, every chain consists of multiple blocks. However, every
    block contains data, a `nonce`, and a `hash`.


    The `nonce` is a 32-bit whole number that is generated randomly when the block
    is created. The `nonce` then creates a block header hash, which is a 256-bit number
    connected to the `nonce`.


    So, when the first block in a chain is created, the attached `nonce` spawns the
    cryptographic `hash`. The data that is then registered within that block will
    forever be connected to the `nonce` and `hash`.


    Miners create new blocks on the blockchain, with each block featuring a unique
    `nonce` and `hash`. However, every block also references the `hash` of the block
    before it, which makes mining difficult, especially on a large chain.


    The way mining works is that special software is used to solve very complicated
    math problems that allow miners to find a `nonce` that can generate an acceptable
    `hash`. Considering that a `nonce` is 32 bits and a `hash` is 256, there are approximately
    4 billion combinations, and only one is correct. When a miner finds the right
    combination, their block is added to the chain.


    If anyone wants to change an earlier block in the chain, they also have to mine
    all the subsequent blocks. This is why it’s tough to tamper with blockchain technology.
    While it is possible, it is prohibitively expensive and requires a lot of time
    and computing power to the point where it’s simply not worth it.


    When a miner successfully mines a block, meaning that they found the right `nonce`
    and `hash`, all the nodes on the network accept the change, and the miner receives
    a financial reward.


    Nodes are any form of electronic device that can maintain a copy of the blockchain
    and ensure that network continues to function.


    Every node has a copy of the blockchain. The network must approve the new block
    for the chain to be updated. Every action on the blockchain can easily be viewed
    and verified, and each participant is provided with a unique number that shows
    what transactions they performed.


    By combining easily accessible and transparent information with an accountability
    system, the blockchain can maintain its integrity and ensure trustworthy transactions
    between people ([Figure 5.2](#Chapter05.xhtml#fig5.2)).


    ## Cryptography and Blockchain


    When it comes to blockchain, cryptography ensures that the transactions and participants
    are secure. It also ensures that operations can be independent of a central authority
    while also providing protection against double-spending.


    For a long time, the concept of double-spending was a major issue with cryptocurrencies.
    The idea of double-spending is that a unit of cryptocurrency could be spent twice
    since digital information is relatively easy to duplicate by someone who knows
    what they’re doing. Thanks to how blockchain works, this is no longer a concern.


    So, how does cryptography work in terms of blockchain?

    '
  trans: '


    没有人知道中本聪是谁，因为这个名字是一个假名。许多人怀疑这个假名代表的是一个团体而不是某个人。


    区块链是比特币成为可能的基础，我们无法在不谈论其中的情况下谈论另一个。这项技术自 2008 年以来取得了飞速发展，并具有影响每个行业的潜力。


    从本质上说，区块链是一个大型电子系统，允许构建应用程序，而货币只是其中之一。有趣的是，直到 2014 年左右，人们才意识到比特币背后的技术可以用于许多其他事情。


    本质上，区块链由由一个透明且去中心化的账本组成，它能够对两个人之间的交易进行永久记录，而不需要第三方的进行身份验证。其结果是一个高度高效的过程，显著降低了交易成本。


    当公司意识到区块链有多么强大时，许多公司开始投资并探索这项技术，以理解其全部潜力。尽管我们还未触及一角，但区块链已经证明了它可以影响从供应链、医疗保健到合同管理和投票的所有领域。


    2013 年左右，《比特币杂志》的联合创始人维塔里克·布特林（Vitalik Buterin）对比特币的局限性感到沮丧，并推动开发更灵活的区块链。然而，比特币社区并没有同意。于是，布特林开发了第二个公共区块链，并命名为以太坊。


    以太坊和比特币最大的区别在于，前者可以记录合约和贷款等交易，而比特币专门用于货币。


    以太坊于 2015 年面，人们可以使用它来创建智能合约。此外，这些智能合约可以根据区块链内部的各种条件自动处理。


    目前，区块链的主要驱动力是“工作量证明”（proof of work）概念。本质上，通过执行一个非常复杂且昂贵的计算机计算（该过程被称为“挖掘”）来创建一个区块，该区块包含多个交易。


    随后，矿工通过解决工作量证明问题来验证区块内交易的合法性。再次，这些问题非常复杂，需要大量的计算能力来解决，使其变得极其昂贵。


    第一个找到解决方案的矿工将获得奖励，交易将保存在区块链上。


    有趣的是，以太坊开发者想要切换到一种更易访问的共识机制，被称为“权益证明”（proof of stake）。


    目标是验证交易并在区块链上达成共识。然而，其过程不同在于，新区块的创建者是使用确定性方法选择的，“取决于其财富，也定义为质押”（“Proof-of-Stake
    (PoS)” n.d.）。


    被称为搜索者（foragers）的矿工不获得奖励。相反，他们获得交易费。一些人支持这种转变，因为获得分布式类型共识所需的成本较低。


    ## 什么是区块链？


    如前所述，区块链是由网络中存储信息的永久记录的去中心化账本组成的。它是以数字形式存储在多台计算机上的分布式数据库。


    区块链的特殊之处在于，它确保了所记录数据的有效性和安全性，因此在不需要引入第三方的情况下建立了信任。


    传统数据库与区块链之间的区别在于数据结构的方式。在区块链中，数据被组织成组，称为“区块”。每个区块只能容一定量的数据，填满后它就会被关闭并连接到之前填满的区块，从而创建一个被称为区块链的数据链。


    在区块关闭并添加到链中之后收集的任何新数据都将存储在一个新区块中，该区块在填满后也将被关闭并添加到链中。


    这种方法的优势是它创建了一个无法篡改的时间线，特别是当它以去中心化的方式实施时。例如，当一个区块满时，它就无法再更改，并带有时间戳被添加到链中。


    虽然区块链可以存储各种信息，但它主要被用作交易账本，例如比特币。


    提到比特币时，区块链技术采用了去中心化的方法，这意味着单个人或一个团体无法控制它。相反，区块链上的所有人共同着集体控制权。


    此外，去中心化的区块链是不可更改的，这意味着数据无法被更改、删除或破坏，使其具有不可逆性。


    从本质上说，使用区块链的想法是让互不信任的人安全地共享重要数据，确保其不会被篡改。


    ## 理解区块链是如何运作的


    区块链由三个关键元素组成：区块、节点和矿工。


    如前所述，每个链都由多个区块组成。然而，每个区块都包含数据、一个 `nonce` 和一个 `hash`。


    `nonce` 是一个在创建区块时随机生成的 32 位整数。然后，`nonce` 创建一个区块头哈希值，这是一个与 `nonce` 连接的 256 位数字。


    因此，当链中的第一个区块被创建时，附带的 `nonce` 会产生加密哈希 `hash`。随后在该区块内注册的数据将永远与 `nonce` 和 `hash`
    相连。


    矿工在区块链上创建新区块，每个区块都具有独特的 `nonce` 和 `hash`。然而，每个区块还会引用其前一个区块的 `hash`，这使得挖掘变得困难，特别是在一条大链上。


    挖掘的运作原理是使用特殊软件来解决非常复杂的数学题，让矿工能够找到一个可以生成可接受 `hash` 的 `nonce`。考虑到 `nonce` 是 32 位而
    `hash` 是 256 位，大约有 40 亿种组合，而只有一种是正确的。当一个矿工找到正确的组合时，他们的区块就会添加到链中。


    如果有人想更改链中较早的区块，他们必须挖掘之后所有的区块。这就是为什么篡改区块链技术非常困难。虽然这可行，但成本高得惊人，并且需要大量的时间和计算能力，变得完全不值得。


    当矿工成功挖掘出一个区块时（意味着他们找到了正确的 `nonce` 和 `hash`），网络上的所有节点都会接受该更改，矿工将获得奖励。


    节点是任何可以维护区块链副本并确保网络继续运行的电子设备。


    每个节点都有区块链的副本。网络必须批准新区块，链才能更新。区块链上的每项操作都可以被查看和验证，每个参与者都将获得一个唯一的数字，显示他们执行的交易。


    通过将易于访问和透明的信息与问责机制相结合，区块链可以维护其完整性，并确保人与人之间的信任交易（图 5.2](#Chapter05.xhtml#fig5.2)）。


    ##加密与区块链


    加密确保了交易和参与者的安全。它还确保了操作可以独立于中央机构，同时防止双重花费。


    '
