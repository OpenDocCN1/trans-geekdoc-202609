- raw: 'The consensus in the business world today is that we need to be better at
    analyzing our data. The issue at hand is how? Data scientists today work with
    data to create these insights, and businesses benefit from clear and actionable
    results from data analysis. However, this will not be possible when we consider
    the volume and sources of the data we will deal with. To take the business to
    that next level of data analysis, we can turn to emerging technologies, specifically
    artificial intelligence (AI).


    AI can help solve the problem of analyzing data in motion—this is data coming
    in real time—as it can process information and analyze thousands of pieces of
    information drawn from multiple levels and from varied sources, which can yield
    “live” results within seconds. Therefore, implementing AI-powered insights can
    change the way we do marketing and how we make strategic decisions.


    We do, however, also need to make sure the results are explainable. A business
    needs to understand how the intelligence was used to give the resulting insights.
    We need a clear concept of why we are getting these results.


    Explainable AI for business will be an important consideration in the implementation
    process of new business models. This means understanding the connections and associations
    that link the information and why the AI system saw them as significant.


    It will be essential to ensure there are no broken links in the data and information
    that is used or misalignment in the objectives that the AI applies. It will also
    be valuable from an ethical point of view to ensure that there is accountability
    and to avoid bias in the decision-making process when business insights are based
    on AI analysis.


    As we find ourselves at the dawn of the Fourth Industrial Revolution, we know
    that the line between the physical, digital, and virtual worlds will become blurred
    as they are linked together through IoT sensors and simulators. As a result, we
    will become a more cyber society.


    This industrial revolution is going to be more powerful than the previous ones.
    We are no longer dealing with just one new technology but with multiple powerful
    emerging technologies that are all interlinked and can work together. These technologies
    are just as powerful and impactful as electricity was 150 years ago or the Internet
    was 40 years ago. And just like when electricity and the Internet were introduced,
    the world will never be the same again.


    This time, however, we have an entirely new phenomenon taking place. We don’t
    have just one, but multiple emerging technologies all introduced at once. AI,
    blockchain, augmented and virtual reality, and the IoT will change every aspect
    of life as we know it. It is predicted that it will be many times more impactful
    than any previous industrial revolution.


    A change like that will see the introduction of new ways of doing things. It will
    mean new business models, communication channels, and immersive social environments.
    Businesses need to stay informed with the changing landscape and plan ahead. A
    strong understanding of the impact that these technologies will have on their
    customers and their business will ensure that they start to find ways to implement
    strategies in time.


    A business that doesn’t understand customer journey analytics (2–5 years from
    plateau of productivity) and social analytics (less than two years from plateau
    of productivity), based on the Gartner Hype Cycle for Digital Marketing in 2021
    (Gartner 2021), is likely to be left behind when this analysis is required to
    reach and understand the target audience. Real-time marketing is 5 to 10 years
    away, according to the same hype cycle (Gartner 2021), which indicates that businesses
    should know how to analyze data in real time to do real-time marketing effectively
    by the end of this decade. For a company to be ready to collect, secure, and analyze
    data on impact, we need to fully understand these technologies and their capabilities.


    Data scientists have been working on understanding how businesses can utilize
    emerging technologies and find solutions to suggest applications and new business
    models that will help with the implementation and analysis. However, many companies
    are still in the dark, and alarm bells are ringing that time is running out. The
    need to evolve quickly to stay relevant in the world of tomorrow should be top
    on the strategic agenda.


    We can visualize emerging technologies as working as the human body does. AI is
    the brain where information is processed and analyzed to give us knowledge and
    insights that lead to wisdom. Virtual reality and augmented/mixed reality are
    the senses—a way to see and appreciate new content and environments that immerse
    us into new experiences. Blockchain is our immune system—the chain of protection
    that secures the system. The IoT is the nervous system, where multiple sensors
    collect information and send it to the brain for processing. Finally, 5G is the
    fuel that keeps it all running—like glucose in the body. And just like our body
    works as one connected system, with each part relying on the other, so too do
    these technologies rely on each other for information, analysis, security, and
    fuel.


    Emerging technologies will change how we communicate, work, educate, live, socialize,
    and do business. We can prepare by understanding the implications and working
    toward new business models that will inspire innovation.


    —Dr. M Zinopoulou


    [CHAPTER 1](#Contents.xhtml#ch1)


    [What Are Emerging Technologies?](#Contents.xhtml#ch1)


    We are in the midst of what many are calling the “Fourth Industrial Revolution.”
    With so many emerging technologies that are changing our society, it’s an accurate
    description. And, like the three previous industrial revolutions, our world will
    evolve to a completely new level.


    But what are emerging technologies?


    Emerging technologies represent any technology with massive potential that hasn’t
    been fully realized. It can be old or new tech. The key is that it can completely
    change society, either through its development or application.


    Gene therapy is an example of an older technology that can still be classed as
    emerging tech. Developed in the early 1990s, gene therapy still has a lot of potential
    that hasn’t been explored.


    More recent innovations that are classed as emerging technologies include artificial
    intelligence (AI)/data science, blockchain, Internet of Things (IoT), 3D printing,
    5G, quantum computing, and robotics ([Figure 1.1](#Chapter01.xhtml#fig1.1)). These
    are all technologies that are still in their infancy. Yet, they have already significantly
    changed the world we live in.


    As these technologies evolve, the degree of change will amplify until we reach
    a point where society will be completely different from even a few years ago.
    A quick look at history proves that this is exactly what will happen.


    The History of Technological Disruption


    Humanity’s history is peppered with technological disruption. Throughout our existence,
    technology has played a significant role in our society.


    ![images](images/fig1.1.jpg)


    ***Figure 1.1 Emerging technologies***


    From humanity’s invention of the wheel and the development of agriculture to the
    harnessing of electricity and the invention of computers, many of our significant
    leaps of societal progress can be attributed to technological progress.


    Take the First Industrial Revolution. Starting around 1760, it introduced mechanical
    production, thanks to the invention of the steam engine. Suddenly, people didn’t
    have to do everything by hand. Steam-powered machines could do a lot of the hard
    work—they could also do it faster and often better.


    People could also travel faster and more easily, thanks to steamships and trains,
    basically making the world a smaller place. It also saw the rise of the middle
    class.'
