    [Foreword](#Contents.xhtml#fm3)


    We are currently drowning in data! The data management pyramid, also known as
    the DIKW pyramid, examines the hierarchical relationship between data, information,
    knowledge, and wisdom as shown in [Figure F.1](#Foreword.xhtml#figf.1). We note
    that there is a distinct hierarchy in the level of analysis of data. If we translate
    this for the business of tomorrow, we could have the pyramid showing impact at
    the base, followed by intelligence that leads to insights and finally innovation
    ([Figure F.2](#Foreword.xhtml#figf.2)). The first level would include any data
    that has an **Impact** on the business. The analysis of that data in depth would
    yield **Intelligence** that can be collated into valuable **Insights** and used
    to inform the next level of business **Innovation.**


    Currently, we have analytics tools available that can help analyze data to obtain
    basic information. But unfortunately, that is not always enough. Discovering that
    the target audience is 21 to 24-year-olds living in the United Kingdom and using
    at least two social media platforms daily is an example of the basic information
    we can pull from data. However, using this kind of information as the basis for
    business decisions can be like trying to analyze a book’s storyline and characters
    based on two or three chapters.


    Reaching the next level of data analysis is not easy. Getting valuable insights
    from data is a Herculean task. We often lack the expertise to do so, and that
    is because insights are not reported in a tool or presented in a report somewhere.
    To convert information into actionable insights, one needs to know how to collect
    data from multiple sources and then connect the dots that translate into meaningful
    knowledge. And we need true insights to be able to utilize data. The growth of
    the Internet of Things (IoT) and 5G technology will see more connected devices
    than ever before and the flow of real-time data as a result. As consumers begin
    to rely on wearables while becoming more immersed in digital experiences, we will
    have to find new ways to measure the impact that those experiences leave. New
    metrics will emerge as vital in understanding behavior patterns, and we will have
    to find more advanced ways for understanding what the data is saying.


