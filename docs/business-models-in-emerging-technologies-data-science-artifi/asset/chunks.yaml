    the numbers along the `X-axis` decrease while those on the `Y-axis` increase.
    In that case, this will lead to an erroneous visual representation, which is another
    way to attempt to force a correlation.


    So, just remember that even if there might seem to be a significant correlation
    between two variables, that doesn’t actually mean there is a relationship between
    the two.


    Another way you can be lied to with charts is by using different types of scales
    in the same chart. For example, you can use different scales to make items seem
    as if they’re closer to each other.


    Another way to lie is to change the scale. If you close in on the scale, a variable’s
    evolution might seem choppy. However, when you zoom out, it looks far more stable.


    For example, if you take a snapshot of last year’s performance of the Dow Jones
    industrial index (simply google “Dow Jones chart”) you will see that growth has
    stalled (`[Figure 2.4](#Chapter02.xhtml#fig2.4)`). But if you look at a multidecade
    chart, you will see that the index has been rising over the long run (`[Figure
    2.5](#Chapter02.xhtml#fig2.5)`). An analyst who focuses on recent developments
    might get worried, while someone focused more on the long run can be reassured
    that the economy will simply keep growing.


    ### Embellishing With Descriptive Statistics


    Descriptive statistics can also be used to mislead people, and one way to do so
    quite easily is through measures of centrality and summary metrics.

    '
  trans: '

    财务分析涉及使用大量的统计信息来帮助投资者做出决策。例如，外汇交易依赖于对财务数据的分析，包括历史价格走势、某国家的经济数据等。它还涉及使用各种通过统计信息计算出的指标，例如移动平均线。


    这种情况也同样股票市场，投资者根据市盈率和股息收益率等变量来决定投资哪些股票。某些人甚至会对市场平均水平与单只股票的结果进行比较。


    ## 营销


    统计学在营销领域也非常有用。零售收银台的电子扫描仪为各种营销研究应用收集数据。艾森·尼尔森（AC Nielsen）作为一家信息供应商，从杂货店购买这些数据，然后对其进行处理，并将统计摘要卖给制造商、分销商等。


    公司会投入大量资金来获取此类数据，因为它们可以用于确定生产必要性，甚至辅助开发新产品。


    ## 生产


    质量控制是统计学在制造业中的一项重要应用。各种统计质量控制图用于监测制造过程的输出，例如 `x-bar chart`，它可以用于监控平均输出。


    例如，假设某机器向容器内装入 1.5 盎司的奶油。员工会随机抽取一组容器作为样本，并计算样本中的平均盎司数。然后，将该平均值绘制在 `x-bar chart`
    上。


    绘图值高于上限控制限表示机器容器装填过度，而绘图值低于下限控制限则表示装填不足。只要绘图值落在上限和下控制限之间，该过程就会持续。否则，将进行调整以确保平均值处于正确位置。


    ## 经济


    经济学家经常预测经济的未来或经济的某些方面。他们使用各种统计信息来做出这些预测，例如预测 GDP、通胀率等。然而，这些预测通常是使用 `ML` 完成的。


    ## 信息系统


    信息系统管理员处理公司计算机网络的日常运营。他们使用各种统计信息来评估性能并进行调整，以确保系统处于最佳状态运行。


    ## 统计学的陷阱


    统计学最大的问题之一是，人们倾向于盲目信任它们，仅仅因为它们看起来像是事实。毕竟，当有人向你展示信息，而这些信息由数字、比率、百分比、图表、图图等形式的看似准确的数据支持时，你更有可能相信你所听的内容。


    然而，利用统计学来欺骗人们是非常容易的。这并不总是出于恶意，但即使是人为错误也可能导致结果偏颇，从而引发问题。


    因此，理解统计学如何被用来扭曲事实至关重要。这样，你就会更有警觉，并且不太因为被误导而做出错误的决策。


    以下是你可以利用统计学被欺骗的几种方式：


    ### 使用图表撒谎


    统计学用于误导观众的一种方法是使用包含虚假相关性的图表来欺骗人们。这些图表乍看似乎合理，但彼此之间没有任何联系。


    例如，这里有一张图表显示了缅因州的离婚率与人均人形油消耗量的相关性（图 2.2`）。


    这是另一张图表，试图将全球非商业太空发射次数与美国授予的社会学博士学位相关联（图 2.3`）。现在，这些看起来可能是有趣的统计数据，而且单独来看它们确实如此。然而，当你试图在这些事实之间建立相关性时，就有些滑稽。


    例如，第一张图表似乎意味着随着缅因州离婚率的下降，人形油的消耗也随之下降。一些进取的个人可能会试图说服你人形油影响了离婚率，人们吃的人形油越少，离婚的可能性就越低。


    另一张图表似乎意味着随着缅因州离婚率的下降，人形油的消耗也随之下降。一些进取的个人可能会试图说服你人形油影响了离婚率，人们吃的人形油越少，离婚的可能性就越低。

