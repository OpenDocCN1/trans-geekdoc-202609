- raw: 'Perhaps in this stage, it would make sense to test the model in a real, lightweight
    setting with real users. While the model may be performing well in a development
    environment, it may not perform as well as you expect in a production environment
    if the data doesn’t quite match real life or there are any factors that have been
    overlooked while developing the model.


    **Deployment:** If you get to the stage you are happy with the model results,
    congratulations! You are almost at the point where you can derive business value
    from the project. The final stage of the project is the deployment stage, where
    you must decide how the model will be running in production. Common questions
    to ask here are:


    • How often will the model be run on new data? Batch predictions or real time?


    • How will the model communicate with the input and output systems? Does an API
    (Application Programming Interface) need to be designed?


    • How will you monitor the performance of the model over time? Who will be responsible
    for this?


    • How often does the model need to be retrained? Ideally, this question should
    be answered during the evaluation phase as you understand how the model performance
    decays over time.


    Process 2: Microsoft Team data science Process. Microsoft defines the Team Data
    Science Process (Microsoft n.d.) as follows:


    *The Team Data Science Process (TDSP) is an agile, iterative data science methodology
    to deliver predictive analytics solutions and intelligent applications efficiently.
    TDSP helps improve team collaboration and learning by suggesting how team roles
    work best together. TDSP includes best practices and structures from Microsoft
    and other industry leaders to help toward the successful implementation of data
    science initiatives. The goal is to help companies fully realize the benefits
    of their analytics program.*


    The process is defined by the following key components:


    1. A data science life cycle definition.


    2. A standardized project structure.


    3. Infrastructure and resources for data science projects.


    4. Tools and utilities for project execution.


    For the context of what we’ve been discussing in this chapter, the data science
    life cycle definition is the most relevant. Components 2 to 4 are incredibly useful
    when getting to the implementation, and I encourage you to check it out on Microsoft’s
    website. For the rest of this section, we’ll only focus on the life cycle.


    The life cycle defined in this project borrows a lot from the CRISP-DM methodology
    described in the last section but reinforces the importance of making the process
    *iterative* and, above all, iterating between each main phase of the project rather
    than only iterating through the full cycle. The life cycle can be summarized by
    the following diagram ([Figure 3.3](#Chapter03.xhtml#fig3.3)).


    As you can see from the diagram, the four main phases of the life cycle are:


    • Business Understanding


    • Data Acquisition and Understanding


    • Modeling


    • Deployment


    This can be mapped almost like-for-like to CRISP-DM, with the only exceptions
    being that Data Understanding and Data Preparation have been collapsed into Data
    Acquisition and Understanding, and Modeling and Evaluation have been collapsed
    into Modeling. Given this similarity, please refer to the previous section for
    detailed explanations on the kind of activities carried out in each phase.


    ![images](images/fig3.3.jpg)


    ***Figure 3.3 Data science life cycle***


    The important area to emphasize in this section is the iterative nature of the
    process. Being agile in the way you approach data science development will undoubtedly
    give you an advantage in delivering quality projects on time. It is very rare
    to go through the process once. It would mean having the perfect problem definition,
    knowing exactly what data you need to solve the problem, and then developing and
    deploying the perfect model. That doesn’t happen. There will be surprises and
    lessons along the way that will change previously held assumptions in the process.


    In the Business Understanding phase, you will come up with an initial plan for
    how you’re going to solve the problem that you’ve set out and what data you will
    need to train a model. Once the plan is created, the first step is to explore
    the data you have identified to see if the quality and quantity are sufficient.
    The findings from this phase will provide some new information, such as whether
    there is any missing data for the data points you wish to extract or whether there
    is an imbalance of training examples (e.g., the majority of your users are male;
    therefore, your algorithm might suffer in accuracy for female users). It is vital
    to revisit the documents prepared in the Business Understanding phase to update
    the assumptions and the proposed approaches. Likewise, the modeling phase might
    prove that some method of approaching the problem is infeasible, which would need
    updating in the Business Understanding documents.


    However, the most common feedback loop from the diagram is the interaction between
    the Data Acquisition and Understanding phase and the Modeling phase. As explained
    in the AI Principles section, starting with the simplest model you can think of
    on a small subset of your entire data is beneficial. The model will likely not
    be very accurate. However, exploring the model’s errors may give you a clue as
    to what other data points will help it improve.


    For example, I worked on a project where we were building recommender systems
    to recommend books to children. We found, from initial models, that the recommendations
    were irrelevant for children since their preferences change so quickly as they
    grow up. From this, we were able to identify that knowing the child’s age would
    improve the model considerably by making more age-specific recommendations.


    Over the lifetime of a project, there will be many iterations across this loop,
    and you want to make sure that you record the findings along the way so that you
    have some traceability of the data points that have been tested and what approaches
    have worked or not worked.


    Lastly, once you have a satisfactory model and are ready to deploy, there will
    be some back and forth between the Deployment phase and the Modeling and Data
    Acquisition and Understanding phases as you try to discover the optimal approach
    to deploying a model. The model will need to access new data from your production
    databases, so you need to consider how and where the data is stored and where
    the predictions of the model will be stored. Similarly, will the model be deployed
    through an API or run as a scheduled job to train and output new predictions?
    The response to this may require some changes in the Modeling phase to ensure
    the model is suitable for your requirements.


    Microsoft has released a Github repository that anyone can use to get started
    with the process: [https://github.com/Azure/Azure-TDSP-ProjectTemplate](https://github.com/Azure/Azure-TDSP-ProjectTemplate).


    Process 3: Tesseract Academy’s 2-Actor Process. Tesseract Academy’s 2-actor process
    focuses not so much on how the data strategy interacts with the business but more
    on the interpersonal dynamics between the data scientist and the business leader.


    The previous processes do a good job of breaking down the steps required to complete
    a data science project. Tesseract Academy’s process takes a more person-centric
    view, focusing a lot on the challenges and misinterpretations that can take place
    between the two main actors of any data science project: the key business stakeholder
    and the data science lead.


    This process is an excellent complement to the other processes outlined here and
    can help you uncover any challenges that might arise. The process assumes that
    a company does not have a data science function and can be very useful for organizations
    embarking on that journey. Companies that have been working with data for a long
    time will find that many of the challenges outlined in this process might not
    exist for them.'
