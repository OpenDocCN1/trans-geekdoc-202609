    人工智能的资金已经枯竭，不久后，美国通过了 1969 年的曼斯菲尔修正案（Mansfield Amendment）。该修正案规定，`DARPA` 只资助具有明确目标且能产生军事可用技术解决方案的研究。结果产生的时间越短越好。


    将《莱蒂尔报告》（Lighthill report）作为进一步证明，认为人工智能生成对现实世界有用的东西还需要很长一段时间，`DARPA` 停止了任何与人工智能相关的资助。事实上，到
    1974 年，要为任何基于人工智能的项目寻找极少量的资金已几乎是不可能的了（美国国家研究委员会，1999 年）。


    卡内基梅隆大学的语音理解研究计划也加剧了这一问题。`DARPA` 的目标是获得一个飞行员可以使用来控制战斗机的系统。虽然研究团队开发出一个能理解英语的系统，但词汇必须按照特定的顺序说出。`DARPA`
    觉得他们被骗了，因为该系统完全没有达到他们的要求。因此，在 1974 年，他们取消了资助（Crevier 1993；McCorduck 2004；美国国家研究委员会，1999
    年）。


    到 1985 年，由于各种专家系统的商业成功，对人工智能的兴趣被重新点，超过 10 亿美元的资金被分配给人工智能研究。结果，产生了一个支持人工智能领域的整个行业。


    ## 机器学习：将人工智能推向新高度


    虽然经典的人智能研究带来了广泛且有益的发现和发展，但它 true 并不是我们在科幻小说中看到的那种能够真正独立思考的机器。它需要更多的支持，而这机器学习（ML）大显身场的地方。机器学习让我们更接近人类大脑，因为它旨在赋予机器超越其程序设定的能力，即在人类教给它的功能之外进行学习和改进。


    因此，机器学习的核心在于开发算法，这些算法能够从提供的信息中进行学习，但也能对尚未分析过的数据得出结论并做出预测。


    亚瑟·塞缪尔（Arthur Samuel）是人工智能和计算机游戏的先驱，他在 1959 年于 IBM 工作期间首次提出了“机器学习”这一术语。他表示，机器学习的目标是赋予计算机在不需要经过编程的情况下进行学习的能力（Samuel
    1959）。


    尽管人们可能认为机器学习和经典人工智能将保持纠缠状态，但由于专注于逻辑化的、基于知识的方法，两者出现了裂痕。机器学习变成了一个独立的领域，并在 20 世纪
    90 年代获得了巨大的关注。机器学习不再担忧如何创造真正的人工智能，而是转向为更具实践性的问题开发解决方案。


    机器学习仍然人工智能的一个子领域，但它采取的方法与到今为止人工智能研究中所采取的方法几乎完全相反。


    经典人工智能采用的是基于规则的、自上而下的方法，这意味着为计算机提供规则，它们必须遵循这些规则以获得所需的结果。这种方法的主要问题是需要大量的人工输入。


    本质上，如果你是系统设计者，你就必须考虑可能出现的每一个变量和突发情况，然后为之创建一套规则。遗憾的是，由于系统使用 `IF`/`THEN` 方法，它不能很好地处理不确定性。


    这会产生严重的问题，因为生活中很少有事情是那么简单，特别是当你试图创建复杂的软件时。如果 `IF`（`事件 A`）发生，不能保证 `THEN`（`行动 B`）就是最佳解决方案，甚至不是解决方案。例如，`IF`（`下雨`）并不总是导致
    `THEN`（`带伞`）。毕竟，你完全可以待在室内完全避雨。


    这甚至不是最重要的问题。真正的问题是，系统知道提供这个答案的唯一原因是它已经被告诉该做什么。这并不符合机器学习和人工智能的终极目标，即创建一个能够独立思考的机器。


    相比之下，机器学习从另一端开始，采用自下向上、数据驱动的方法。换句话说，在机器学习中，数据被用于教计算机做什么。这类似于授人以鱼，而不是直接给他鱼吃。


    通过机器学习，除了给计算机喂数据外，没有多少的人工输入。因此，机器可以更有机地处理不确定性，这正是目标，因为世界是由概率而非确定性组成的。


    ## 统计学


    统计学是数据科学的另一个核心领域。它起源 17-18 世纪，最终导致了现代数据分析的关键方面，包括回归、显著性检验和预测。


    传统上，统计学处理小样本，主要是因为当时数据收集必须亲自完成。此外，一切都必须手工计算，因此解决一个模型可能需要几周。


    统计学与机器学习的主要区别在于，你必须用统计学来验证和确认你的假设。然而，机器学习的核心在于完成任务和提出问题。虽然统计学提供了更多的透明度和可解释性，但机器学习带来了惊人的进步和性能。


    然而，机器学习依赖于计算，这意味着模型可以在几分钟内解决（通常比这更快），而不是花几天。因此，可以在更短的时间内尝试多种方法，从而获得更好的性能和更快的进展。


    ## 数据科学的其他子领域


    除了人工智能、机器学习和统计学之外，数据科学还有其他子领域，例如：


    - 控制论：由维纳在 1947 年开发；

    - 人工神经网络：由`McCulloch`和`Pitts`在 1943 年开发；

    - 计算智能：开发于 1990 年；

    - 数据挖掘：由`Gregory Piatetsky-Shapiro`在 1990 年开发（McCulloch and Pitts 1943；Conway
    and Siegelman 2005；Russell and Norvig 2003；Samuel 1959；Piatetsky-Shapiro 1994）。


    '
