- raw: 'Sandbox


    The Sandbox is a blockchain game that allows people to discover a virtual world.
    It includes NFTs, environments created by users, and all sorts of other content.


    This project has grown into a complex environment that relies on Ether and its
    native token (SAND) to run the game’s economy.


    Players have the option of creating a digital avatar and identity to which they
    can connect a crypto wallet to manage their SAND tokens, NFTs, and other assets.
    Players can also create virtual items and games.


    ***NFT Projects***


    Bored Ape Yacht Club


    Bored Ape Yacht Club is a collection of NFTs made up of cartoon apes created by
    an algorithm that used 170 different traits, from expressions to clothing to added
    items. There are 10,000 of these cartoon apes in the collection. It is a project
    built on the Ethereum blockchain, so Ether is used to purchase Bored Ape NFTs.


    Bored Ape Yacht Club is owned by Yuga labs and launched in 2021. Buying and owning
    a Bored Ape NFT gives you intellectual property rights over the image. In other
    words, you become the owner of the original cartoon ape artwork. This ownership
    is recorded on the blockchain. Ownership of a Bored Ape NFT means you also become
    a member of a private online club.


    Sales since its launch are in excess of U.S. $1 billion. In fact, Bored Ape Yacht
    Club is an NFT project that has set new standards, becoming the highest priced
    NFTs on the market and leading the NFT sales charts for much of the first quarter
    of 2022.


    The average purchase price of a Bored Ape NFT is hundreds of thousands of dollars,
    with many of them owned by celebrities. Snoop Dogg, Eminem, Paris Hilton, Serena
    Williams, and Jimmy Fallon are among the Bored Ape NFT celebrity owners. The company
    Adidas also owns a Bored Ape NFT.


    The price for a Bored Ape NFT varies, often depending on how rare it is. For example,
    there are only 26 Bored Ape NFTs where the cartoon ape is depicted with a slice
    of pizza hanging out of its mouth.


    It hasn’t all been smooth sailing for the Bored Ape Yacht Club, though. The designs
    have come in for criticism in some quarters, and it has suffered cyberattacks,
    including a hack on its Discord chat channel.


    Despite the challenges, all 10,000 Bored Ape NFTs sold out. They are now traded
    on OpenSea, the NFT marketplace.


    The success of the Bored Ape Yacht is often put down to the fact that owners of
    Bored Ape NFTs can use the image however they want, including to make money or
    as a digital identity. The high price tags for Bored Ape NFTs also make them a
    status symbol, increasing their appeal.


    Cryptopunks


    Cryptopunks is an NFT project that is similar to the Bored Ape Yacht Club, as
    it is also a collection of NFTs built on the Ethereum blockchain. It predates
    Bored Ape, however, as it was launched in 2017. It was launched by Larva Labs,
    but Cryptopunks is now owned by Yuga Labs, the people behind Bored Ape Yacht Club.


    The concept of Cryptopunks is based on the punk scene in London, with further
    inspiration taken from music from artists like Daft Punk. There are 10,000 Cryptopunks
    in the collection, about two-thirds of which are male and the rest female. Like
    Bored Ape NFTs, Cryptopunks NFTs were created by an algorithm. Those Cryptopunks
    with the rarest character traits are typically the most valuable. There are different
    character types, as well, with the rarest usually claiming the biggest price tags.


    Cryptopunks is widely recognized as having sparked widespread interest in NFTs,
    although the original Cryptopunks NFTs were essentially given away for free. Today,
    they are most commonly traded on the NFT marketplace OpenSea. They don’t sell
    for as much as Bored Ape NFTs, but they are still in a six-figure price range.


    Total sales of Cryptopunks NFTs are now over U.S. $2 billion, with some being
    sold at mainstream auction houses like Christies.


    There are a few reasons why Cryptopunks NFTs have been popular and continue to
    be sought after. The fact that they are one of the oldest NFT projects is a key
    consideration. They were also the first to use algorithmically created images,
    and approach now copied by many other NFT projects, including Bored Ape Yacht
    Club.


    The fact that each Cryptopunks NFT is unique is also a factor in their popularity.
    Like Bored Ape NFTs, they are used online as digital identities. When Yuga Labs
    acquired the Cryptopunks intellectual property, it granted all Cryptopunks owners
    full commercial rights over their NFTs.


    Key Takeaways


    • There are many applications of blockchain in different fields. In this chapter,
    we covered finance, shipping, cybersecurity, file sharing, and the metaverse.


    • Blockchains applications usually help with issues of trust, or unnecessary friction.


    • In the metaverse, blockchain has become a prominent characteristic primarily
    through the use of NFT ownership and new monetization avenues.


    • Two of the most popular NFT projects are the Bored Ape Yacht Club and Cryptopunks.
    Many more are definitely going to appear in the future.


    [CHAPTER 7](#Contents.xhtml#ch7)


    [Where Do You Stand Now on the Maturity Curve?](#Contents.xhtml#ch7)


    The maturity curve is a way to think about the level of adoption for a certain
    technology. There are different stages in this curve, each more mature than the
    previous one. The initial stage, called Innovation Trigger, is where innovative
    companies experiment with new technologies.


    When they see that there is some competitive advantage in using it, they start
    investing more in it and move to the next stage—Early Adopter—when they start
    using it on a larger scale. However, it’s not until later that you will see the
    full adoption of the technology by most companies—Late Majority—when it has become
    mainstream.


    Emerging technologies present unique opportunities and challenges, as many organizations
    find it challenging to adopt disruptive technologies due to their revolutionary
    nature, which often requires a change in mindset.


    This final chapter will provide some frameworks to assess your organization’s
    capabilities and the industry’s potential to be disrupted by AI and blockchain.


    Assessing AI/Data Science Capabilities


    We propose a framework to assist organizations in evaluating their AI and data
    science capabilities.


    The framework has been developed from a series of workshops with senior executives
    from across a number of industries. We address the need for a common language
    to discuss AI and data science capabilities and how they can be assessed. The
    framework provides a common understanding of the terminology and a set of key
    indicators for measuring current and potential AI and data science capabilities.


    AI Maturity


    The concept of AI maturity related to a company refers to the different levels
    of adoption and determines how much value that business can derive from AI solutions.
    To achieve full adoption, however, companies must tackle four key components:


    1. Knowledge


    2. Data


    3. Culture


    4. Talent


    Let’s look more closely at each of these.


    ***Knowledge***


    Knowledge has two subcomponents, namely conceptual understanding and the AI bible.
    In terms of conceptual understanding, key stakeholders must know how AI works,
    including basic AI terms and components and an idea of representative use-cases.


    This doesn’t mean that management suddenly needs to learn to code. However, they
    must have an understanding of why their business’ data is valuable and why the
    format is just as vital. They also need to learn how algorithms leverage data
    and what sorts of results can be obtained from such algorithms.


    In terms of representative use-cases, it’s essential for key stakeholders to understand
    what others in their industry are doing with AI (and why they’re succeeding.)
    So, for example, a business in the e-commerce space should be aware of how Amazon
    is leveraging AI to boost their business.'
