  trans: "\n第四步是部署。在第三和第四步中，主要的执行者是数据科学家和解决方案架构师。在这种情况下，结果通过仪表板进行交流。我们示例中的仪表板可能包含评论分类和词云（图\
    \ 3.8）。\n\n在最后一个阶段——验收，项目负责人和项目经理会重新介入并将一切整合在一起。由项目经理编写的最终报告确保了所有内容已记录在案，项目可以定稿。\n\
    \n# 案例研究 4：计算机视觉与算法偏见\n\n本案例研究将调查三个有趣的挑战：计算机视觉、算法偏见和数据隐私。\n\n假设你正在开发一种软件，该软件可以通过安装在商店内的摄像头提取有关商店人员的信息。该应用程序不仅可以计算客流量，还可以计算商店内不同人员的特征，例如性别、年龄、种族等。\n\
    \n你决定将使用通用的计算机视觉解决方案，例如 `Google Vision` 或 `IBM Watson`。\n\n这里需要注意的一个重要点是，这是一个特殊情况。原因是这个用例还涉及合规性、监管和伦理问题。让我们来看看为什么：\n\
    \n首先，公司必须确保不存储个人的隐私数据。这指的是实际图像或对个人的出的推断（例如年龄）。可能取决于地理地区，具体的法律要求会有不同，但无疑会有各种法律上的复杂性。\n\
    \n其次，应用程序应该确保不会对某些类型的人产生偏见。众所周知，计算机视觉算法可能会对少数群体产生偏见。《时代》杂志的一篇著名文章证明了计算机视觉 `API`\
    \ 如何可能将奥普拉·温妮瑞（Oprah Winfrey）误认为男性，例如（“人工智能在性别和种族偏见上存在问题”，未注日期）。\n\n鉴于这里的主要挑战涉及业务的不同部分，Tesseract\
    \ Academy 的双执行者模型可能非常有用。该模型的益处是它非常灵活，因此它也适用于挑战不仅是技术性质的情况。这一过程背的关键在于它列出了项目可能面临的所有挑战。因此，决策者和数据科学家可以确保在处理特定挑战时达成步调一致。\n\
    \n## 析：Tesseract Academy 的双执行者模型\n\n现在，让我们重新回顾这一过程。\n\n1.  **问题定义**\n    a. 领域专家\n\
    2.  **选择正确的数据**\n    a. 领域专家\n    b. 数据科学家\n3.  **问题的解决方案**\n    a. 数据科学家\n4.\
    \  **通过可操作的洞察创造价值**\n    a. 数据科学家和 领域专家\n\n*问题定义。* 在这种特殊情况下，核心问题定义是的。业务所有者想要了解商店人员的具体统计数据，例如性别、年龄和种族。\n\
    \n然而，核心问题定义需要扩展。我们还需要添加：\n\n1. 数据隐私\n2. 消除偏见\n\n这些点将指导问题的解决方案。\n\n决策者还定义了业务应该采用通用解决方案，而不是在内部自行开发自己的解决方案。\n\
    \n*选择正确的数据。* 在这种情况下，数据是来自商店内摄像头的直接馈送。因此，摄像头必须是高品质的，网络必须有足够的带宽将数据传输到 `API`。\n\n\
    数据隐私属于这一步。记住，数据管理涉及决策者和数据科学家。虽然数据科学家负责技术方面，但决策者需要确保业务符合合规性。\n\n他们两人需要决定的是如何将数据喂给\
    \ `API`，以及不同选择的影响。数据是会被存储在某处然后发送吗？还是会实时发送？\n\n*问题的解决方案。* 考虑到扩展的问题定义和决策者施加的限制，数据科学家必须定义正确的解决方案并制定攻击计划。在这种情况下，攻击计划不涉及数据分析，而是对市场上的解决方案进行比较。\n\
    \n具体来说，数据科学家将在主要的计算机视觉提供商之间进行 `A/B 测试`，并识别哪些最好。数据科学家可能需要去商店并在真实条件下测试这些系统。\n\n\
    *通过可操作的洞察创造价值。* 通常，可操作的洞察是在数据分析后得出的。在这种情况下，数据科学家和决策者需要持续监控运行的前几个月，以确保其符合预期。可能会出现影响结果的问题，但这些可能与\
    \ `API` 无关，例如摄像头的问题。\n\n下表 3.3 总结了上述所有见解。\n\n***表 3.3 Tesseract Academy 双执行者模型总结***\n\
    \n| **问题定义** | 1. 获取统计数据 2. 数据隐私 3. 无偏见 |\n| :--- | --- |\n| **选择正确的数据（数据管理）**\
    \ | 1. 摄像头数据流 2. 数据隐私 |\n| **问题的解决方案** | 1. 发现最佳 API 2. 在真实条件下测试 API |\n| **通过可操作的洞察创造价值**\
    \ | 1. 确保 API 按预期工作 2. 根据需要重新审模型 |\n\n## 核心要点\n\n- 数据策略被定义为“一份活的文档，定义了业务从技术和组织角度如何进行设置”。\n\
    - 数据科学开发与软件开发不同。管理数据科学项目需要遵循数据科学流程。\n- 有不同的数据科学流程，流行的包括 `CRISP-DM` 和 Tesseract\
    \ Academy 的双执行者流程。\n"
