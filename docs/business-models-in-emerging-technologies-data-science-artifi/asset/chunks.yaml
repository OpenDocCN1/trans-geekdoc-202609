- raw: 'The essence of data science is that it allows us to take data and do useful
    things with it. While there are certainly all sorts of complex definitions available
    that cover tools and methodologies, at its core, data science is all about doing
    useful things with data.


    A Dive Into ML for a Decision Maker


    As we’ve seen, ML is vital to data science and can even be considered the next
    step up from classic AI. The main objective for ML is to enable computers to learn
    by being fed data rather than being explicitly programmed to do something.


    Machine learning can be split into three major approaches: supervised learning,
    unsupervised learning, and reinforcement learning ([Figure 2.1](#Chapter02.xhtml#fig2.1)).


    Supervised learning involves showing the machine what you want by providing examples.
    So, let’s say you want it to organize a set of photos by separating them into
    images with humans and images containing vegetables. You’d provide an example
    of a photo with a human and one of a vegetable, making sure to label each appropriately.
    Then, the computer can sort the remaining images based on the labels you provided.


    With unsupervised learning, you just provide the computer with the photos and
    allow it to organize them based on the different traits it can identify itself,
    without labels or human supervision.


    Finally, with reinforcement learning, the system learns by making mistakes and
    receiving rewards when it gets things right. The computer analyzes the actions
    it took and the outcomes of those actions.


    ![images](images/fig2.1.jpg)


    ***Figure 2.1 Types of machine learning***


    ***Supervised Learning***


    In supervised learning, algorithms learn by example with some form of supervision.
    It’s almost like having a teacher supervising students, except that the students
    are algorithms in this case.


    When you train such an algorithm, you provide training data consisting of inputs
    paired with the correct outputs. The machine will analyze the data in the training
    phase, looking for patterns that align with the desired outputs. So, you give
    the computer a bunch of photos of vegetables, and you tell it what each vegetable
    is. The computer analyzes this data to determine the pattern that leads to the
    correct conclusion. It will determine that an eggplant is oblong and dark purple,
    whereas a tomato is round and red.


    Subsequently, after training has been completed, you can feed that algorithm new
    inputs, and it will classify the new data based on the training data it received.
    Therefore, it will classify oblong, dark purple objects as eggplants and round,
    red items as tomatoes.


    The role of the supervisor is to correct the algorithm every time it makes a mistake.
    However, since the algorithm is constantly learning, it will eventually get to
    the point where it no longer makes mistakes.


    It is, by far, the most popular flavor of ML. It is the primary technology used
    in task automation.


    Supervised learning can be split into two categories: classification and regression.


    Classification Models


    Classification requires the algorithm to be provided with data that has been assigned
    to categories. The algorithm then takes inputs and assigns the categories based
    on the provided training data, like our previous example.


    In real-world applications, the simplest example would be categorizing e-mails
    as spam or not spam, which is a binary classification problem.


    The way it works is that the algorithm is provided with e-mails that are spam
    and e-mails that are not spam. It looks for the common features among each category.
    It will then use these patterns to classify unseen e-mails as either spam or not
    spam. As you already know, it doesn’t always work right. However, every time you
    tell it that it’s made a mistake, the algorithm learns. If you think about it,
    a decade ago, spam algorithms were wrong far more frequently than they are now.
    This is because every time someone marks an e-mail as not spam or vice versa,
    the algorithm learns. Considering that hundreds of millions of people use the
    same e-mail system (Gmail, for example), that’s a lot of data for the algorithm
    to learn from.


    Classification models can be used for other things, such as whether the value
    of a stock or commodity will rise or fall. They can also include more categories,
    so they don’t have to be binary. For example, if you want to figure out who will
    win a talent competition with multiple contestants.


    Regression Models


    Regression, on the other hand, is a predictive statistical process. In this case,
    the algorithm tries to determine important relationships between dependent and
    independent variables. The goal is for the algorithm to be able to forecast actual
    numbers, such as sales and income.


    In other words, instead of trying to figure out if the value of a commodity will
    rise or fall, we want to figure out what the price will be in seven days. Or,
    instead of determining whether a student will fail or pass a test, we want to
    know what grade they’ll get. Maybe instead of attempting to figure out if the
    temperature this winter will be higher or lower, we want to know by how much.
    While these issues are related, they still represent different problems from their
    classification versions.


    Most fields contain classification and regression problems. However, you must
    remember that these problems can be solved in multiple ways.


    For example, let’s say that you’re a forex trader and you want to predict how
    the U.S. dollar will perform over the next few weeks so you can profit. You can
    use a classification model to figure out if it’s going up or down, which will
    tell you whether to go short or long. However, you could also use a regression
    model for a more specific prediction, such as what price the EUR/USD will be trading
    at tomorrow.


    In the first case, the situation is a little nebulous. While you might make a
    profit, the risk is far greater than if you were to use a regression model, which
    will give you more information to make an effective decision.


    The idea is that each approach will give you different types of information that
    will impact performance and, ergo, the strategy you employ.


    ***Unsupervised Learning***


    In unsupervised ML, an algorithm will infer patterns from data without the benefit
    of a targeted or labeled outcome. This type of learning cannot be applied to classification
    or regression problems because you don’t know what the output might be, making
    it impossible to train the algorithm like normal.


    In other words, unsupervised learning is all about the algorithm learning from
    data on its own and usually refers to clustering. This means that the training
    data you provide the algorithm only has inputs, without the desired outputs. Instead,
    the algorithm clusters the inputs based on the patterns it identifies. The system
    tries to find significant regularities that it can group. It involves no supervision.


    With no guidance, this approach to ML can be challenging because the problems
    tend to be poorly defined. Unsupervised learning is effective, though, in helping
    to determine the data’s underlying structure. Also, human interpretation is generally
    necessary, at the very least close to the end of the pipeline.


    Unsupervised learning can discover patterns you wouldn’t have otherwise known
    about. However, the reality is that it’s not as effective as supervised learning.
    Another factor that makes supervised learning more applicable to practical problems
    is that, with unsupervised learning, you have no way of figuring out the accuracy
    of the results.


    Unsupervised learning is generally best used when you don’t have any information
    related to the desired outcome. One such example would be determining the target
    market of a completely new product. However, if you want to know more about your
    existing target market, then you’re better off using supervised learning.'
