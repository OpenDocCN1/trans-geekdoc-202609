    **Theodosis (Theo) Mourouz** 是密码学家和信息安全专家，对学术和工业界都有浓厚兴趣。他在伦敦大学学院 (UCL) 获得密码学博士学位。他是
    Consulting 的执行合伙人。


    **Gerard Cardoso** 是数据科学家和 AI 战略师，其使命是让大众理解数据科学并教他们如何思考数据。他曾为从初创公司到集团的各类企业提供建议。


    **Marialena Zinoulou** 是伦敦帝国学院 (Imperial College London) 战略营销与管理硕士课程的讲师，也是伦敦大学学院
    (UCL) 的客座讲师。


