- raw: 'It’s also being used in things like graphic design with plugins and apps that
    can remove backgrounds from photos while maintaining the full integrity of the
    subject. If you’ve ever tried to remove a background, you know how difficult it
    can be.


    If it’s not something you’ve attempted, then trust us when we say that, before
    deep learning enabled the creation of these apps, you needed a lot of time and
    patience. Even then, you still weren’t guaranteed to get a result as good as these
    apps can offer in a fraction of the time.


    It’s a bit like the difference between hand painting one of those eggs with highly
    complex designs and painting your bedroom wall with a spray gun.


    In conclusion, deep learning has allowed us to achieve some incredible things
    with machines and will continue to do so. Some believe that it might lead us to
    true AI, whereas others say that progress has plateaued. The big question for
    AI researchers is: what comes after deep learning? Only time will tell.


    ***Other Types of ML***


    Quite a few other types of ML exist, including recommender systems, NLP, active
    learning, semisupervised learning, and weak supervision.


    Recommender systems are designed to predict user interest and make recommendations
    accordingly. These are some of the most powerful ML systems used by retailers
    online to boost sales (Rodriguez 2018).


    Consider Amazon, which has an excellent recommender system. Every time you log
    in, Amazon will recommend products or books they think you might like based on
    previous purchases and visits.


    Spotify or Netflix use similar data to make recommendations in terms of the content
    you might enjoy. For example, if you watch a lot of action movies and crime dramas,
    then Netflix will recommend similar films and TV shows.


    In ML, **Natural Language Processing** and text analytics involve the use of algorithms
    and AI to understand text, which can range from Facebook comments and online reviews
    to e-mails and regulatory documents (Barba 2020).


    **Active learning** refers to the process of prioritizing data that must be labeled,
    so it has the highest impact on training a supervised model (Solaguren-Beascoa
    2020).


    **Semisupervised learning** combines supervised and unsupervised ML methods so
    that an algorithm learns from data sets that include labeled and unlabeled data
    (“Semi-Supervised Machine Learning” n.d.).


    **Weak supervision or weakly supervised learning** comprises a variety of approaches,
    including:


    • Inexact supervision, where the training data is provided with only coarse-grained
    labels;


    • Incomplete supervision that features data sets with only one subset that has
    labels;


    • Inaccurate supervision, where the labels aren’t always ground truth (Zhou 2018).


    ***For Decision Makers: How to Use Machine Learning***


    Machine learning really shines in cases where automation or prediction are needed.
    Irrespective of the actual form of ML being used in most cases, it is applied
    to the following cases:


    1. Humans are performing a repetitive task, which also allows them to label data.
    The labeled data can then be used to train a ML model to replace the human. The
    most prominent example of this is computer vision and applications such as face
    recognition or recognizing certain entities in a photo (e.g., humans vs animals).


    2. Predicting something about the future or an unknown quantity: credit scoring,
    spam detection, forecasting, customer churn all are viable applications of ML.


    Understanding when and how to apply ML is a skill that takes a long time to master.
    However, a decision maker can just use the aforementioned heuristics to get a
    feeling of when they could use it. What is more important from a decision maker’s
    perspective is making sure that there is a data strategy in place that can facilitate
    the use of ML. This is covered in the next chapter.


    A Brief Intro to Statistics for the Decision Maker


    Statistics is one of the core fields of data science. It was the first discipline
    to deal with data collection and analysis in a systematic way. In this section
    we will provide a brief overview of that area, as it can help us better understand
    the domain of data science.


    Statistics is the study of how to collect, organize, analyze, and interpret numerical
    information and data. It encompasses both the science of uncertainty and the technology
    of extracting information from data.


    It is a vital tool for any data scientist and is used to help us make decisions.
    This field employs a variety of methodologies that enable data scientists to do
    a variety of things, including:


    • Design experiments and interpret results to improve product decision making;


    • Develop models to predict signals;


    • Mold data into insights;


    • Understand a wide range of variables, including engagement, conversions, retention,
    leads, and more;


    • Make intelligent estimations;


    • Use data to tell the story.


    From a decision maker’s perspective, statistics is important to understand, and
    also to get a good understanding of how they fit into the whole narrative of data
    science. While the discipline of statistics cannot be considered an emerging field
    (since it has been around for more than 200 years), it has found new uses in the
    era of big data.


    Many data science applications, which could be considered emerging tech, are based
    on simple applications of statistics. Therefore, getting a good understanding
    of the basic uses of statistics can help put things into perspective as to how
    technologies and methodologies evolve and adapt as technology advances.


    ***A Little History About Statistics***


    Statistics is a branch of mathematics dating back to approximately the 18th century.
    It was humanity’s first attempt to analyze data systematically and is at the base
    of modern data analysis. It led to the development of summary statistics, regression
    classification, significant testing, forecasting, and more. Some prominent individuals
    in this field include Ronald Fisher, Karl Pearson (and his son Egon Pearson),
    and Jerzy Neyman.


    Statistics is different from other data analysis fields because it focuses more
    on the theoretical soundness of the models and has traditionally dealt with smaller
    samples. This is mainly due to historical reasons because data had to be collected
    in person until relatively recently. It’s only since the advent of the Internet
    that we can collect data remotely, allowing for much larger sample sizes.


    As you can imagine, collecting data in person was not only expensive but also
    time-consuming, which meant that small sample sizes were the norm. Furthermore,
    until computers became part of our lives, calculations had to be done manually.
    While the results were extrapolated to the entire population using a margin of
    error, those calculations still took time. Today, solving a model might take seconds,
    but in the 18th century, it would’ve taken days or weeks.


    There’s also a different mentality when it comes to statistics. As this field
    is rooted in math, it is very strict on model assumptions and development. These
    assumptions must be validated and verified before you can do anything else. On
    the other hand, in ML, the goal is to achieve the objective and ask questions
    later.


    One crucial difference between ML and statistics, for example, is that ML has
    led to impressive performance, even though statistics is far more transparent
    and has a higher degree of interpretability. The thing is that the high-level
    performance ML offers means that we’ve been able to achieve things that were previously
    thought impossible.


    While some statisticians are completely against ML because of the reduced level
    of transparency and lack of theory, the fact is that statistics and ML work hand-in-hand.
    They are also both tools the data scientist can and should use depending on the
    situation. In other words, if you want interpretability, then you should turn
    to statistics. On the other hand, if you’re looking for performance and predictive
    power, then ML is the way to go.'
