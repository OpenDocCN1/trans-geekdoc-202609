    # Sandbox


    `Sandbox` 是一个允许人们探索虚拟世界的区块链游戏。它包含了 `NFTs`、由用户创建的环境以及各种其他内容。


    该项目已成长为一个复杂的环境，依赖 `Ether` 及其原生代币 (`SAND`) 来运行游戏经济体系。


    玩家可以选择创建一个数字头像和身份，并为其连接加密钱包以管理他们的 `SAND` 令牌、`NFTs` 和其他资产。玩家还可以创建虚拟物品和游戏。


    ## NFT 项目


    ### 无聊猴游艇俱乐部 (Bored Ape Yacht Club)


    `Bored Ape Yacht Club` 是一个 `NFTs` 集合，由算法生成的卡通猩猴组成，该算法使用了 170 种不同的特征，从表情、服装到添加物品不等。该集合中共有
    10,000 只卡通猩猴。这是一个构建在 `Ethereum` 区块链上的项目，因此使用 `Ether` 来购买 `Bored Ape NFTs`。


    `Bored Ape Yacht Club` 由 `Yuga labs` 所有，并于 2021 年推出。购买并拥有 `Bored Ape NFT` 意味着你对该图像拥有知识产权。换句话说，你成为了原始卡通猩猴艺术品的所有者。这种所有权记录在区块链上。拥有
    `Bored Ape NFT` 也意味着你成为了一个私人在线俱乐部的成员。


    自推出以来，销售额超过了 10 亿美元。事实上，`Bored Ape Yacht Club` 是一个设定了新标准的 `NFT` 项目，成为市场上价格最高的
    `NFTs`，并在 2022 年第一季度的大部分时间内位居 `NFT` 销售榜。


    `Bored Ape NFT` 的平均购买价格为数十万美元，其中许多由名人拥有。`Snoop Dogg`、`Eminem`、`Paris Hilton`、`Serena
    Williams` 和 `Jimmy Fallon` 都是 `Bored Ape NFT` 的名人所有者。`Adidas` 公司也拥有一只 `Bored Ape
    NFT`。


    `Bored Ape NFT` 的价格各不相同，通常取决于其稀有程度。例如，只有 26 只 `Bored Ape NFTs` 的卡通猩猴嘴里叼着一片披萨。


    尽管如此，`Bored Ape Yacht Club` 的发展并非一帆风顺。其设计在某些领域遭到了批评，并遭受了网络攻击，包括对其 `Discord` 聊天道的黑客。


    尽管面临挑战，所有 10,000 只 `Bored Ape NFTs` 已售罄。它们现在在 `NFT` 市场 `OpenSea` 上交易。


    `Bored Ape Yacht` 的成功通常归功于 `Bored Ape NFTs` 的所有者可以随心意愿使用该图像，包括赚钱或作为数字身份。`Bored
    Ape NFTs` 的高价也使其成为身份象征，增加了它们的吸引力。


    ### Cryptopunks


    `Cryptopunks` 是一个 `NFT` 项目，与 `Bored Ape Yacht Club` 类似，因为它也是构建在 `Ethereum` 区块链上的
    `NFTs` 集合。然而，它早于 `Bored Ape`，因为它于 2017 年推出。它由 `Larva Labs` 推出，但 `Cryptopunks`
    现在由 `Bored Ape Yacht Club` 背后团队 `Yuga Labs` 所有。


    `Cryptopunks` 的概念基于伦敦的朋克场景，进一步的灵感来自 `Daft Punk` 等艺术家的音乐。该集合中有 10,000 个 `Cryptopunks`，其中三分之二是男性，其余是女性。与
    `Bored Ape NFTs` 一样，`Cryptopunks NFTs` 是由算法创建的。具有最稀有角色特征的 `Cryptopunks` 通常最有价值。存在不同的角色特征。


    本最后一章将提供一些框架，以评估贵组织的能力以及行业被 AI 和区块链颠覆的潜力。


    ## 核心要点


    - AI 在不同领域有许多应用。

    - 我们涵盖了金融、运输和网络安全领域的区块链技术。

    - 由于颠覆性技术的革命性，许多组织发现采用这些技术具有挑战性。


    ## 评估 AI/数据科学能力


    我们提出了一个框架来帮助组织评估其 AI 和数据科学能力。该框架是根据与多个行业高管进行的一系列研讨会开发的。


    ## AI 成熟度


    与公司的 AI 成熟度概念指的是不同的采纳水平，并决定了该业务可以从 AI 解决方案中获得多少价值。然而，要实现完全采用，公司必须解决四个关键部分：


    1. 知识

    2. 数据

    3. 文化

    4. 人才


    ### 知识


    知识有两个子部分，即概念理解和 AI 圣经。在概念理解方面，关键利益相关者必须了解 AI 如何工作，包括基础 AI 术语和组件以及代表性用例的想法。这并不意味着管理层突然需要学习编码。然而，他们必须理解为什么业务数据是有价值的，以及为什么格式同样关重要。他们还需要学习算法如何利用数据，以及从此类算法可以获得什么样的结果。


    '
