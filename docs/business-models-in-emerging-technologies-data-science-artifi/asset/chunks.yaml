- raw: 'You have three main measures of centrality: the median, the mode, and the
    mean.


    The mean represents the average of a set of numbers, which is basically where
    you add all the numbers together and divide the result by the number of variables
    you added together. The median is the central value in a list of numbers, and
    the mode is the value that shows up most frequently in a list.


    If a distribution is symmetrical, these three values will fall on the same point.
    However, if the distribution is positively skewed, the mean will be lighter than
    the median, and the median will be lighter than the mode. If the distribution
    is negatively skewed, then the opposite happens.


    It’s important to note this because most distributions in life aren’t symmetrical.
    For example, let’s say that a company pays its CEO $300,000 per year, while the
    rest of the 10 employees earn $50,000 per year each.


    ![images](images/fig2.4.jpg)


    ***Figure 2.4 Dow Jones industrial index for 2020***


    ![images](images/fig2.5.jpg)


    ***Figure 2.5 Dow Jones industrial index long-term trend***


    Depending on what you want to achieve, you can present different numbers. In this
    case, the median might be $50,000 per year, but the mean is $72,000 per year.


    A company could advertise the mean figure, which would make people think that
    that’s what they could earn, but the company is unwilling to pay more than $50,000
    per year for anybody other than the CEO.


    This way, they could trick potential employees into accepting a job because they
    believe they will eventually earn $72,000, when in fact, they’ll never receive
    more than $50,000. It might seem underhanded—it is, in case you were wondering—but
    not as unusual as you might think.


    *Sampling Biases.* Sampling biases can also lead to less than accurate data that
    can cause problems in the decision-making process. While there are quite a few
    different sampling biases, we will be looking at five: the selection bias, the
    area bias, the self-selection bias, the leading question bias, and social desirability
    bias, as they are the most common in business.


    Two very famous cases of sampling bias are the forecasting of the Brexit vote
    in Britain and the 2016 presidential election in the United States. The forecasters
    in both cases got it completely wrong, because of bias that got introduced into
    the sample and completely invalidated most statistical models that were used (Kampakis
    2016).


    *Selection Bias.* The selection bias is the most significant. In fact, the other
    types of bias can actually be seen as related or even as subcategories of selection
    bias.


    Selection bias occurs when the sample being used is not representative of the
    whole. Something is going on that ensures the subjects or items in the sample
    are special somehow, while other subjects are left out.


    One interesting example of selection bias is the attempt of the U.S. government
    to increase the survival rate of U.S. aircraft during the Second World War.


    The initial attempt was conducted after investigators analyzed planes that had
    survived. The recommendation was to add more armor to the areas that had received
    the most amount of damage. When the armor was mounted, instead of leading to a
    higher rate of survivability, the exact opposite happened. The extra armor made
    the planes heavier, slower, and far less agile, making it easier for the enemy
    to destroy them. Furthermore, the aircraft that survived still had significant
    amounts of damage in the same areas.


    The government turned to Abraham Wald, who was a statistician. He realized that
    selection bias was taking place. In other words, instead of looking at what was
    important, the investigators made their decisions based on planes that had survived
    the damage they received. That’s when Wald concluded that the areas that required
    protection were actually the areas that were sensitive and hadn’t been damaged.
    Once those areas were reinforced, survivability increased (Mangel and Samaniego
    1984).


    This is an interesting way that you can use statistics without even conducting
    any significant analysis. Wald had to understand that selection bias was taking
    place, which allowed them to fix the problem.


    *Area Bias.* Area bias refers to attempting to generalize results from one area
    to another. This poses many problems, especially when you’re trying to cross cultures.


    For example, if you conduct marketing research in the United States, and you attempt
    to apply the results to another area, such as the Middle East, you’re going to
    have a big surprise. The cultural, financial, lingual, and many other differences
    will have a significant impact, basically making those results null and void.


    *Self-Selection Bias.* Self-selection bias refers to the increased likelihood
    of a person deciding to participate in a study because of traits they already
    have.


    For example, if you conduct a study on using makeup, you are more likely to get
    people participating in the survey who use makeup frequently than those who don’t
    at all or do so rarely.


    The problem is that this leads to a nonrepresentative sample. Of course, this
    depends on what you’re attempting to achieve. However, if you want the sample
    to be truly representative, you need to talk to people who use makeup and who
    don’t use makeup or use it rarely.


    *Leading Questions Bias.* A very easy way to get the answers you want rather than
    the truth is to use leading questions in your questionnaires. For example, if
    you ask someone if they believe teachers aren’t paid enough and the answers you
    provide them are:


    (a) Yes, they should earn more;


    (b) No, they should not earn more;


    (c) No opinion.


    Most people will say A; teachers should definitely be paid more. This is because
    people want to be nice and provide what seem like socially acceptable answers.
    Plus, the way the question was phrased only really gives them one option.


    *Social Desirability Bias.* Social desirability bias occurs when people want to
    paint themselves in a better light, which is almost always. So, if you pose questions
    about social desirability issues, your data will be skewed because nobody wants
    to admit they don’t fall in line with societal expectations. So, for example,
    if you ask someone how frequently they donate to charity, or how often they recycle,
    or how much food they throw away, you are unlikely to receive accurate answers.


    If someone tells you that they only throw out 3 percent of the food they buy,
    they are probably not telling the truth since throwing away food is not exactly
    considered socially acceptable as it’s a massive waste. So, they will provide
    an answer they feel is more socially acceptable instead of the truth.


    Lying With Inferential Statistics


    Some believe that it’s impossible to lie with inferential statistics. Unfortunately,
    that’s not exactly accurate. It might be challenging to lie with inferential statistics,
    but it can still be done.


    This takes place a lot in research. When testing a hypothesis, you’ll get a *p*\-value.
    This value needs to be below a certain threshold for the tests to have statistical
    significance. Generally speaking, this threshold is 0.05.


    A theory says that a significant number of research papers have *p*\-values that
    are unusually close to 0.05. In other words, the results of these papers seem
    significant, but only by a tiny margin, because the value of *p* is just below
    0.05, allowing them to meet the condition of the statistical significance.


    The theory in question says that this is being done on purpose. Academia is a
    very competitive environment, and people have to publish papers, or they’ll end
    up without a job. So, people are basically under pressure to make the results
    look as if they are statistically significant. One way to achieve this is by conducting
    multiple experiments until you get the results you want.'
