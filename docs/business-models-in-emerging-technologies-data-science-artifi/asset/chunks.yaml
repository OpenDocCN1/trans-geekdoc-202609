- raw: '| ***Do the simplest thing that could possibly work*** || When starting any
    project (this also applies to non-AI or ML projects), it often helps to refer
    back to the 80/20 rule and think about the simplest thing that gets you most of
    the way there with little development. This tactic has two clear advantages:1.
    You may find that the simplest method you can think of already delivers enough
    value. Otherwise, you have a better idea of how far from the target performance
    this simple method gets you, which can be useful to understand the complexity
    of the problem.2. A simple method will force you to think more about the whole
    end-to-end solution (data inputs/outputs, pipelines) rather than focus on building
    a complicated algorithm. This will uncover any unexpected surprises that might
    arise when deploying this algorithm, and these can be handled in parallel while
    the algorithm is improved and research is underway. |


    ![images](images/fig3.1.jpg)


    ***Figure 3.1 Data science hierarchy of needs***


    The processes outlined here are all slight variations on each other while following
    a common set of principles on how to approach data science projects. If you are
    to take anything from this section, it should be these principles. The final processes
    should fit your project style and requirements rather than shifting your ways
    of working to fit these processes. These processes are guidelines and best practices,
    but real projects are messy so always think about what types of processes will
    suit your specific set of circumstances.


    Process 1: CRISP-DM. CRISP-DM (Cross-Industry Standard Process for Data Mining)
    is perhaps the most popular process used to plan a typical data science project.
    The purpose of CRISP-DM is to clearly define the phases that make up a data science
    project and to understand how those phases interact with each other.


    Unlike the Microsoft Team Data Science Process described as follows, CRISP-DM
    does not concern itself with the lower-level details of how work is managed or
    the roles and responsibilities in the team. Instead, CRISP-DM is a high-level
    framework that will help you to understand what kind of work is carried out in
    each phase of the project and also the deliverables that could be expected. Above
    all, though, CRISP-DM emphasizes the iterative nature of a data science project
    and is flexible to move between phases in response to new learnings and findings
    during the project.


    ![images](images/fig3.2.jpg)


    ***Figure 3.2 Six main phases of the CRISP-DM process***


    Six main phases are described as part of the CRISP-DM process ([Figure 3.2](#Chapter03.xhtml#fig3.2)):


    1. Business Understanding


    2. Data Understanding


    3. Data Preparation


    4. Modeling


    5. Evaluation


    6. Deployment


    **Business Understanding**: The first phase sets out the context for the project
    by focusing on three main areas: (a) defining the business objectives, (b) identifying
    the project requirements, and (c) building a project plan.


    Setting clear business objectives is arguably the most important part of the process,
    because these will be continually referred back to throughout the project to make
    important decisions. Think about a primary goal that you are seeking to achieve
    and any related questions that would be useful to address. Once you have these,
    consider which metrics will most accurately track the progress toward achieving
    the primary business objective. It is dangerous to define a project outcome that
    is not measurable as it may lead to a misunderstanding within the team of whether
    the project is moving in the right direction. Also, it is common for project teams
    to go down rabbit holes that may not contribute to moving the needle on the business
    objective, so having metrics to track will be useful to course correct.


    Once the business objectives have been agreed upon, consider the key requirements
    and dependencies for the project. It is best to have a data scientist involved
    in this process to validate the feasibility of the project with the specified
    data and resources. The requirements can be split into several categories, such
    as project resources, data, and computing resources.


    While there are many uncertainties at this phase of the project, it can be helpful
    to draw up a high-level project plan with key milestones you want to hit. As data
    science projects are quite exploratory and uncertain in nature, make sure to be
    realistic in your timelines and add a good amount of buffer to avoid unexpected
    delays.


    **Data Understanding:** This is always the first step of any data scientist when
    approaching a new problem. The outcome of this phase is to verify that there is
    enough data and that it is of a high enough quality to build accurate models.


    Common pitfalls in the data are variables having lots of missing values, the correct
    variables not being collected for the project, or there being noise in the data
    due to some error in the collection process. The data understanding phase should
    seek to extract these insights and validate any preconceived assumptions about
    what the data is describing. A typical output of this phase is a report that highlights
    the findings and any immediate actions that might need to be taken to correct
    errors in the data.


    **Data Preparation:** The precursor to the modeling phase is the preparation phase.
    A data scientist will select the appropriate data from the various identified
    data sources and perform data cleaning and wrangling exercises to transform it
    into a state that will allow it to be inputted into a data science model.


    This phase will be repeated several times throughout the project, as you will
    undoubtedly learn and experiment with different data points and different processing
    methods to improve modeling results. You will often hear the phrase “Garbage In,
    Garbage Out,” and this is also true of modeling—often, the best improvements in
    data science models are generated by carefully selecting the input data and processing
    it in creative ways rather than fine-tuning the model parameters.


    **Modeling:** The modeling phase involves researching and developing the most
    appropriate models for the use case. There is a lot of uncertainty in this phase
    of the project, as models don’t always transfer across use cases, even when the
    use cases are very similar. Owing to this, it is important to start with simple
    models and then iterate from there as you build up an understanding of the limitations
    of the simple models. There are many open-source libraries and packages that make
    it easy to get started with prebuilt models; we have listed a few at the end of
    the document relating to each use case.


    Before beginning any model development, make sure you have a clear understanding
    of which model evaluation metrics will be used to compare and select the best
    models, for example do you prioritize precision or recall? This depends vastly
    on your use case and the cost of different errors.


    As described previously, the modeling phase and data preparation phase are tightly
    linked. Each model is based on slightly different assumptions of the data, so
    the data may need to be processed differently for each model. Furthermore, models
    can be improved through better feature engineering (which variables you feed into
    the model from the raw input data).


    **Evaluation:** As opposed to the model evaluation that forms a part of the modeling
    phase, the evaluation phase here is about determining how well the project is
    measuring up to the overall business objectives set out at the beginning of the
    project. At this stage, you will undoubtedly have learned a lot about the data,
    and the complexities of the project, meaning you may choose to revisit the business
    objectives slightly based on your learnings.'
