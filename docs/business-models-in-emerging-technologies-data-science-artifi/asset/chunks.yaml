- raw: 'Funding for AI dried up, and, soon after, the 1969 Mansfield Amendment was
    passed in the United States. The amendment stated that DARPA was to only fund
    research with a clear objective and would result in technological solutions that
    the military could use. The shorter the timeframe for results, the better.


    Using the Lighthill report as further proof that it would be a long while before
    AI generated anything useful for real-world applications, DARPA stopped funding
    anything AI-related. In fact, by 1974, it became practically impossible to find
    even the smallest amount of funding for any AI-based projects (National Research
    Council (U.S.) 1999).


    The Speech Understanding Research program at Carnegie Mellon also contributed
    to the problem. DARPA’s goal had been to obtain a system that pilots could use
    to control fighter planes. While the research team came up with a system that
    understood English, the words had to be said in a particular order. DARPA felt
    that they had been tricked as the system didn’t even come close to what they wanted.
    So, in 1974, they canceled the grant (Crevier 1993; McCorduck 2004; National Research
    Council (U.S.) 1999).


    By 1985, though, after the commercial success of various expert systems, interest
    in AI had been rekindled, and more than $1 billion was allocated to AI research.
    As a result, an entire industry developed to support the field of AI.


    ***Machine Learning: Taking AI to a New Level***


    While classic AI research led to a wide range of beneficial discoveries and developments,
    it wasn’t really AI as we see in science fiction, with machines that could truly
    think for themselves. More was required, which is where ML comes in.


    Machine learning is what gets us closer to the human brain because it’s meant
    to give a machine the ability to become more than its programming. To learn and
    improve beyond what we’ve taught it to do.


    Therefore, ML is all about developing algorithms that can learn from the information
    they’ve been provided with, but that can also draw conclusions and make predictions
    pertaining to data they haven’t yet analyzed.


    Arthur Samuel, a pioneer in AI and computer gaming, first came up with the term
    of ML in 1959 while working at IBM. He stated that the goal of ML was to provide
    computers with the ability to learn without being programmed to do so (Samuel
    1959).


    Though one would assume that ML and classic AI would remain entangled, a rift
    occurred due to the focus on logical, knowledge-based approaches. ML became a
    separate field and gained significant traction in the 1990s. Rather than worrying
    about creating true AI, ML shifted toward developing solutions for more practical
    issues.


    Machine learning remains a subfield of AI, but the approach it took was virtually
    the opposite of what had been done so far in AI research.


    Classic AI worked with a rule-based, top-down approach, meaning that computers
    were provided with rules, which they had to follow to get to the desired result.
    The main concern with this approach was the significant amount of human input
    necessary.


    Essentially, if you’re the one designing the system, you have to think of every
    possible variable and eventuality that could arise and then create a set of rules
    for it. Unfortunately, since the system uses an IF/THEN approach, it doesn’t handle
    uncertainty well.


    This can create significant problems because very few things are quite that straightforward
    in life, especially if you’re trying to create complicated software. IF (EVENT
    A) occurs, there’s no guarantee that THEN (ACTION B) is the best solution or even
    the solution at all. For example, IF (RAINING) doesn’t always lead to THEN (TAKE
    AN UMBRELLA). After all, you could always stay indoors and avoid the rain altogether.


    That’s not even the most significant issue. The real problem is that the only
    reason the system knows to provide this answer is that it has already been told
    what to do. That isn’t in line with the ultimate goal of ML and AI, namely, to
    create a machine that can think for itself.


    In contrast, ML starts at the other end, using a bottom-up, data-driven approach.
    In other words, in ML, data is used to teach the computer what to do. It’s akin
    to the principle of teaching a man to fish rather than giving him the fish.


    With ML, other than feeding the computer the data, there isn’t much human input.
    Therefore, the machine can handle uncertainty more organically, which is the goal
    because the world consists more of probabilities than certainties.


    With our rain/umbrella example, a machine would be fed with tons of data that
    it would analyze. It would see that, in some cases, when it’s raining out, people
    will take umbrellas. In others, though, they will wait indoors until the rain
    has passed. It would look for patterns to differentiate when each event occurred,
    and it might discover that with lighter rain and warmer temperatures, people are
    more likely to brave the weather with an umbrella. However, if it’s cold out and
    raining heavily, people are more likely to stay indoors. It picks up patterns,
    which it does by learning from the data it has been provided with.


    Machine learning became very popular after the widespread adoption of the World
    Wide Web helped generate unprecedented amounts of data for the first time in human
    history. This, in combination with cheaper computing costs, has made ML the dominant
    approach in data science. These days, AI is practically synonymous with ML.


    ***Statistics***


    Statistics is another core field of data science. It first came about in the 17th–18th
    centuries and was the first way people analyzed data in an organized, systematic
    fashion (Willcox 1938). It eventually led to the development of all the key aspects
    of modern data analysis, including regression, significant testing, summary statistics,
    and forecasting.


    Traditionally, statistics dealt with small samples, mainly because of when it
    was developed. It’s only relatively recently that we have become able to gather
    data remotely—at least when you consider how long the field of statistics has
    been around. When it was first developed, all data collection had to be done in
    person. Furthermore, everything had to be calculated by hand, so solving a model
    could take weeks.


    The main difference between statistics and ML is that you must first validate
    and verify your assumptions with statistics. With ML, however, it’s all about
    getting things done and asking questions later. While statistics offers a lot
    more transparency and interpretability, ML has led to amazing advances and performance.


    However, ML does rely on computing, which means that models can be solved in minutes
    (usually far faster than that) instead of days. Therefore, multiple approaches
    can be attempted in far shorter time frames, leading to better performance and
    quicker progress.


    ***Other Subfields of Data Science***


    Besides AI, ML, and statistics, data science also has other subfields, such as:


    • Cybernetics, developed by Norbert Wiener in 1947;


    • Artificial neural networks developed by McCulloch and Pitts in 1943;


    • Computational intelligence developed in 1990;


    • Data mining developed by Gregory Piatetsky-Shapiro in 1990 (McCulloch and Pitts
    1943; Conway and Siegelman 2005; Russel and Norvig 2003; Samuel 1959; Piatetsky-Shapiro
    1994).


    The main problem for those not in the field is that all these terms have fluid
    definitions. Take two people with different research backgrounds, and they’ll
    often give you different definitions for the same thing. While some conceptual
    differences exist, it often becomes difficult to tell unless you know who’s doing
    the talking. Sometimes, it gets so complicated that even people who study these
    fields end up confused.


    This is where the idea of data science came in. It simply made things a lot easier
    to explain. Saying a data scientist is someone who works with data is far simpler
    than trying to explain every field and subfield involved.'
