  trans: '

    此外，最后，如果 CEO 拥有良好的直觉，或者公司已经对有用的模式进行了初步研究（例如客户细分），将会有帮助。这些信息不仅可以为推荐系统的设计提供参考，还可以用于创建一个简单的基于规则的推荐系统，作为更高级版本的基准。


    ## 问题定义：糟糕的情景


    在糟糕的情景下，CEO 属于以下两类之一：


    1. 他们说“想用数据做一些有用的事情”，但并不确定具体是什么。

    2. 他们说想要一个推荐系统，但对涉及的所有细节和问题一无所知。


    第一种情况非常常见，大多数数据科学家都会为此做准备。在这种情况下，数据科学家将花一些时间向 CEO 解释数据科学，进一步了解业务，并发现最佳的进展方向。如果
    CEO 在聘用数据科学家之前完成了这些准备工作，情况会更好，因为这些工作通常需要一到两个月。


    第二种情况要棘手得多。CEO 可能对自己想要的东西很有信心，但他们忽略了许多关键话题：


    1. 他们可能忽略了推荐系统与 UX/UI 在结果显示和数据收集方式上的交互。

    2. 他们对客户没有真正的了解。

    3. 他们不确定自己想要什么样的指标。这个项目的成功标准是什么样的？


    因此，如果例如网站需要进行大量的重新设计以显示推荐内容并收集相关数据，那么第一点可能会成为巨大的问题。第 2 点和第 3 点往往同时出现。有时，人们对某个项目充满热情，但客户并真的不知道自己在寻找什么。仅仅是更多的销售额吗？更多的互动吗？要增加多少？


    预测成功的水平是不可能的。然而，项目结束时客户才意识到自己对结果不满意的情况也并不罕见，因为他们从初就无法表达自己的期望。例如，如果客户认为推荐系统会使销售额翻倍，这可能是不现实的。数据科学家可以解释什么可能更可行，或者他们如何创建一个不断改进的系统。


    在某些情况下，客户对新 AI 系统的期望持有潜意识的想法，但直到最后时刻事情进展不符合意愿时，他们才意识到这些想法。


    ## 案例研究 2：需求预测


    需求预测是零售等行业中的常见问题。如果企业能够成功做到这一点，就可以优化其供应链和订单以实现利润最大化。让我们以 Leotard Clothes 为例。这是一家销售猫咪灵感服装的零售商。


    他们的仓库空间有限，而且由于使用了特殊面料，生产衣服需要大量的时间和资源。此外，他们使用了许多外包承包商，这意味着成本会随着生产数量而变化。生产超过需求的衣服将显著增加每月成本，但如果生产的衣服较少，公司仍然可以盈利。承包商的另一个问题是，某些情况下会出现材料短缺。Leotard
    Clothes 理想希望能提前几个月预订面料。


    因此，对他们来说，预测需求至关重要，这样他们就知道每个月生产多少件衣服。


    让我们看看 Leotard Clothes 如何使用 CRISP-DM 方法预测需求。


    ### 分析：CRISP-DM


    回顾 CRISP-DM 流程。CRISP-DM 过程中描述了六个主要阶段（图 3.6`）：


    1. 业务理解

    2. 数据理解


    ![images](img/fig3.6.jpg)


    **图 3.6 CRISP-DM 流程的六个主要阶段**


    3. 数据准备

    4. 建模

    5. 评估

    6. 部署


    第一步（业务理解）是关键。虽然预测是公司想做的，但他们希望在运营的背景下进行此。这意味着需求预测被用于优化资源配置。


    这一步直接与第五步（评估）相连。为什么呢？因为在评估 `ML pipeline` 时，我们需要识别结果如何转化为业务行动。由于预测是一个回归问题，报告的指标将是
    `Mean Absolute Error`（平均绝对误差）或 `Root Mean Squared Error`（均方根误差）。但什么是好分数呢？这与业务密切相关。


    在某些领域，性能 1% 的差异可以转化为数百万美元。在其他领域，5% 的差异可能意义不大。


    ![images](img/fig3.7.jpg)


    **图 3.7 团队科学流程示例**


    1. 仓库有足够的空间。

    2. 第 1 点要求衣服被售出。

    3. 第 1 点也要求材料与需求匹配。


    因此，当我们预测需求时，关键挑战在于如何确保仓库有足够的空间。所以，这应该是我们的主要关注点。`图 3.7` 中讨论的其他步骤。


    ## 案例研究 3：自然语言处理


    让我们看看如何使用团队科学流程来分解一个问题。假设我们正在处理一家名为 Zappo 的在线零售商。该公司对在其社交媒体上运行自然语言处理感兴趣，以了解如何改进。


    我们首先注意到有四位参与者：


    1. 项目负责人

    2. 数据科学家

    3. 项目经理

    4. 解决方案架构师


    根据流程，解决方案架构师负责确保公司内部业务理解。流程还定义了一些需要实现的技术任务。例如，在第一步中，仓库由项目负责人而非数据科学家创建，从而清晰地划分了角色之间的职责。


    在我们的案例中，项目负责人需要定义衡量什么。例如，公司可以选择衡量：


    1. 对产品评论的情感分析。

    2. 帖文互动的预测。

    3. 互动指标的时间序列分析。


    因此，我们可以立即看到，“使用 NLP 研究社交媒体”这一通用任务会立即拆解为多个不同的任务。每个任务都应该单独处理。所以，我们可以假设该案例中的公司决定专注于第一个任务并进行情感分析。流程的第二个阶段涉及数据科学家，他们负责产生报告。你可以看到，数据科学家的第一个输出是易于向管理层传递的内容。该流程显然对业务理解了高度重视。同时，解决方案架构师将开始研究部署的细节。


    ![images](img/fig3.8.jpg)


    **图 3.8 情感分析仪表板**


    *来源：* Faction A 2018


    第三步建模由数据科学家运行各种情感分析算法并对其进行比较。该阶段的输出是一份模型报告。同样，这有助于跟踪项目的进展并向业务利益相关者传递价值。

    '
