    `A data strategy is a living document …` —A data strategy should not be a document
    that takes months to develop and then is put to one side, gathering dust for no
    one to read again. By all means, the data strategy can be a document, a presentation,
    or whatever other medium you choose, but above all, it should be a living document—meaning
    that it is constantly updated and refreshed as the business evolves.


    `… defines how the business is setting itself up, both from a technical and organizational
    perspective…` —A good data strategy should ideally cover both the engineering
    and infrastructure approach and how you plan to structure the organization and
    teams to make the most of your data.


    `… to proactively manage and leverage data …` —By creating a data strategy, you
    make sure that you take proactive measures to make the business as resilient as
    possible and give it as much of a competitive advantage as early as possible.


    `… toward the long-term business strategy`—Last but certainly not the least, a
    data strategy should not exist in isolation from the rest of the business. Instead,
    a good data strategy will have the business strategy as its north star, and all
    of the plans should stem from this.


    # Why Is a Data Strategy Important?


    Have you ever wondered what happens every minute on the Internet? Google processes
    3.8 million search queries, 4.5 million videos are watched on YouTube, 188 million
    e-mails are sent, and approximately 700,000 hours are watched on Netflix. As our
    lives have become increasingly digital, the interactions we have with products
    and services can be recorded and observed like never before.


    What do Nike, L’Oreal, Vodafone, and Transport for London have in common? On the
    face of it, all of these businesses operate in different markets and offer completely
    different products. However, they are all data-driven businesses.


    In recent decades, data has transformed from being a side effect of products to
    one of the most valuable assets in a business. Data is multifaceted in the way
    it can add value. Still, one can broadly categorize the areas where data adds
    value as operational improvements, customer insights, and data as a product.


    ## 1. Operational Improvements


    - Data can improve or even fully automate processes within our businesses. For
    example, Verizon uses data to triage customer service calls and thus optimize
    their call centers. In addition, data-rich business areas such as supply chain
    logistics are prime targets to be automated.

    - Another example of this is how Netflix has invested large sums into optimizing
    the production process so they can create original content at scale (Kumar, Misra,
    Walraven, Sharan, Azarnoush, Chen, and Govind 2018).


    ## 2. Customer Insights


    - Many of today’s most popular services use data as a tool to deliver a better
    product experience for the customer. For example, LinkedIn uses your past interactions
    to recommend posts you may be interested in. Spotify’s `Discover Weekly` is another
    fantastic example of using data and `ML` to generate recommendations and increase
    user engagement.


    ## 3. Data as a Product


    - Finally, data in and of itself can add immense value to the business as a new
    revenue stream. Typically, this area of value will only be relevant once a company
    has scaled to thousands of users and is generating significant amounts of data,
    but it should not be underestimated.

    - Owning large amounts of user data can greatly increase the value of a company
    in the eyes of an acquirer. IBM acquired Weather Underground as part of a deal
    that was valued at approximately `$2 billion` by *The Wall Street Journal*, demonstrating
    the value of the data they possessed to IBM. While IBM didn’t disclose how the
    data would be used, it is clear that there are integrations of weather data within
    many other aspects of the business (e.g., `IoT`) since weather data can affect
    device failure. Sometimes, even data that does not seem valuable can hide a wealth
    of information.


    Keep these areas in mind as we explore how to build a good data strategy, as they
    will help guide your thinking.


    Even the European Union has acknowledged the importance of data in the future,
    outlining their own data strategy. The goal is to create a single data marketplace
    to level the playing field in competing against the big tech companies that own
    vast amounts of valuable data (“European Data Strategy” n.d.).


    Now that you are convinced that every business is a data business, it becomes
    clearer that a company needs an effective strategy to extract as much value as
    possible from the data it collects. Oftentimes, especially at the earliest stages
    of a business, data collection can be expensive in terms of time and money. A
    well-thought-out data strategy helps to zoom in on which data will unlock the
    most value and hopefully kick off the data flywheel.


    Throughout my work, I have often seen these two types of situations, as shown
    in [Table 3.1](#Chapter03.xhtml#tab3.1).


    So, what do these two cases have in common? In both cases, a data strategy can
    save the day. In the first case, a data strategy would have provided the company
    with tons of additional revenue. In the second case, a correctly implemented data
    strategy could provide the start-up with a competitive advantage in addition to
    increased revenues.


    ### Table 3.1 Data strategy situations


    | | **Situation 1** | **Situation 2** |

    | --- | --- | --- |

    | ***Use Case*** | A company wants to conduct a statistical analysis. As the problem
    is investigated, it becomes clear that data could have been collected to improve
    the analysis, but it is not available. | A start-up requires some sort of data
    science service. As the discussion about the system progresses, it becomes clear
    that the requested service depends on many different kinds of data. The collection
    and storage of this data expose new avenues for monetization that can help improve
    the start-up’s revenue strategy. |

    | ***Explanation*** | This is an example of what I like to call data debt, where
    the lack of planning for future projects has led to the company not collecting
    all the necessary data. As we will see in the following, a good data strategy
    will describe the projects a company wishes to aim for in the coming `12–24 months`,
    along with the data required to deliver good results on those projects. Having
    a data scientist as part of the planning process will help make sure that you
    are covering your bases on all the data you should collecting for the project.
    | In this particular situation, the impact of planning for a specific data science
    project is that more opportunities are discovered to leverage the data in the
    overall revenue strategy. Often, the brainstorming around a data strategy can
    go backward and forward. While thinking of the data required for one project,
    you may discover other projects and opportunities open up using that same data.
    |

    | ***Example*** | A car rental company wants to forecast demand for the upcoming
    months to create customized deals for each client. The company is not keeping
    information regarding the marital status and the age of its users. This information
    could have been very easily collected on its platform throughout all these years
    of operation. However, since this was not done, the company has to settle for
    a suboptimal model with reduced performance. | A common case is a recommender
    system. A recommender system can benefit from all kinds of information about the
    users: age, gender, purchases, and possibly other things. Designing the platform
    to improve information collected from its users results in an extensive and comprehensive
    database that can boost the recommender system’s effectiveness and can also be
    used for other purposes. For example, this information could be used to better
    manage discount deals, improve advertising, or even enhance the user experience.
    |

