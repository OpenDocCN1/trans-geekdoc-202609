- raw: 'At the **employee level**, it’s about hiring data scientists and managing
    them effectively. You need to find the right people and create a friendly environment
    for them.


    At the **organizational level**, building the right culture means mixing together
    the right elements from the management and employee levels. The result is a data-centric
    organization. You will then be able to maximize the effectiveness of data science
    from the beginning data collection stages all the way to application. At this
    point, you’ll start seeing real benefits.


    Understanding the Concepts of Data Informed and Data Driven


    Data informed means that a person or organization is using data and the context
    of data in their conversation and decision-making processes. If someone is using
    dashboards and KPIs (Key Performance Indicators), they are data informed (Kampakis
    2018a).


    Being data driven, though, means taking things to the next level. This is when
    you start applying smarter and more complex algorithms and methodologies to acquire
    and analyze the data. It also means more advanced decision-making processes because
    you either rely completely on the algorithm to make the decision, or you at least
    consider the algorithm’s conclusions.


    Most companies should try to get to the data-driven stage. Once there, you can
    rely on data and data science to help you when it comes to making disruptive decisions.
    In some situations, data science could completely replace human decision making.


    Being data driven doesn’t necessarily mean that the algorithm has to make every
    decision, but it does mean that you use algorithmic outputs in the decision-making
    process throughout at least part of the organization.


    The advantage is that your organization will become far more efficient, and your
    decision-making process will also be more effective. A recommender system, for
    example, will make better decisions than a human in terms of what a return customer
    might like or want (Kampakis 2019).


    There’s also the consideration of scale. If you want to scale up, like Amazon,
    you aren’t going to be able to manually make recommendations. Instead, you’re
    going to have to rely on an algorithm.


    However, keep in mind that if you don’t use data the right way, you can end up
    making poor decisions that lead to expensive and incorrect actions.


    The problem is that if you’re not using data the right way, and you don’t have
    the right theory, or you didn’t run the right tests, you end up making the wrong
    decisions. Even worse, you’re completely confident in those decisions because
    you believe you used an effective scientific approach.


    The easiest way to overcome this problem is to employ data scientists who know
    what they’re doing. Of course, you also need to have the right culture to allow
    the scientists to interact with other divisions effectively.


    ***What Does a Data-Centric Organization Look Like?***


    First, you have a 360-degree view of what is happening when it comes to data and
    data science. Data science is its own division, which means the scientist is free
    to explore new things, even if they might create disruptions.


    The data scientist also has more responsibility, which can be motivating but can
    also be risky. Since you have a complete view of the situation, though, you can
    reduce the risk.


    You also have effective reporting and communication channels between all the essential
    departments, especially when it comes to the developers and data scientists, but
    also between the data scientists and management.


    This is vital because the work the data scientist does should have an impact.
    However, you also need to know what data is being collected, how it’s being used,
    and how it’s all being implemented.


    It’s essential to be aware in terms of data collection because there are legal
    issues regarding data privacy, which means you need to know exactly how data is
    being collected and used.


    You also need to know what the data scientist is working on and to ensure that
    it is being implemented and used positively in your organization. It’s essential
    to have effective communication channels because then different divisions can
    scrutinize the work of others to ensure that the work being carried out is relevant
    to the organization.


    How to Build a Data Science Culture


    This first step to building a data science culture is determining why you need
    data science. Three common scenarios exist in business:


    1. Data science is a vital part of your business, maybe you work in robotics,
    or your organization is tech-focused in some way. In this case, you probably have
    the knowledge to do it yourself.


    2. You want to improve the efficiency of the company you run.


    3. You might want to improve sales, so you’re looking for a good recommender system
    or other tools and/or algorithms that can help.


    Once you understand why you need data science, you’ll be able to determine what
    your next step should be. You will encounter problems, though, and one of these
    is resistance to change.


    ***Resistance to Change***


    Smaller firms and start-ups tend to be more flexible, so resistance to change
    won’t be much of an issue if you fall into this category. However, if you are
    a big organization, you might have a few problems.


    You’ll find that there are three types of resistance to change, namely cultural,
    personal, and intellectual.


    **Cultural resistance to change** is when you have a big and traditional organization
    with multiple layers of management that don’t really see the value of data science.
    Or, you’re operating in a field that doesn’t have much to do with math, data,
    and statistics, so selling the rest of the firm on the idea will be a challenge.


    **Personal resistance to change** can happen in smaller companies as well as big
    ones, and that’s when you have employees who don’t like to change on a personal
    level.


    This frequently happens when the employees simply don’t see any benefit from changing.
    They don’t see the advantages of doing anything, such as exporting a database
    or trying to implement an algorithm.


    **Intellectual resistance to change** occurs when people are afraid of what they
    don’t understand. Many people are still concerned about artificial intelligence
    (AI) because they worry we will end up facing a situation like in Terminator where
    Skynet took over the world.


    Intellectual resistance to change tends to be infrequent in organizations because
    most people understand that data can be useful in improving efficiency and sales.
    However, if you find that there is some intellectual resistance to change, a good
    solution is to hire a data officer. This person can own the data and show people
    how effective and useful it can be.


    ***The Journey to Change***


    The first step in your journey to change involves determining how data scientists
    will get you to your destination. This requires creating an environment that’s
    friendly to data science where scientists can talk about it and attempt to carry
    out projects that have significant impact.


    While change might be slow, it will help if people can see results. They’ll understand
    the benefits and will become more willing to adopt something new.


    Finding someone to champion the whole process is also essential. A champion can
    create enthusiasm and bring everyone else on board. Your champion has to be a
    high-ranking employee who really believes in the new approach. They also have
    to be popular and someone that your employees will listen to, regardless of what
    they’re saying.


    ***How to Start***


    You can implement a data science culture either with baby steps or on a use-case
    basis.


    If you’re going to start with baby steps, that means collecting tons of data and
    ensuring the decision makers learn about data science. Then, you’ll use simple
    graphs and stats, which means you will become more data informed. The next step
    will be to hire someone to provide further insights from the data.'
