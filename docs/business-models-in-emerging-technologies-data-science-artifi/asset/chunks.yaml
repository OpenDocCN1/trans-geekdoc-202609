- raw: 'The fourth step is deployment. In the third and the fourth steps, the main
    actors are the data scientist and the solution architect. The results, in this
    case, are communicated through a dashboard. The dashboard in our example could
    contain things such as classifications of reviews and a word cloud ([Figure 3.8](#Chapter03.xhtml#fig3.8)).


    In the final stage, acceptance, the project lead and the project manager come
    back into play and bring everything together. A final report, written by the project
    manager, ensures that everything has been documented and the project can be finalized.


    Case Study 4: Computer Vision and Algorithmic Bias


    This case study will investigate three interesting challenges: computer vision,
    algorithmic bias, and data privacy.


    Let’s say that you are developing a piece of software that can extract information
    about the people in a retail store by using cameras installed in the store. This
    application can be used to calculate not only footfall but also the characteristics
    of the different people in the store, such as gender, age, race, and so on.


    You have decided that you will use a commoditized solution for computer vision
    such as Google Vision or IBM Watson.


    Something important to note here is that this is a special case. The reason is
    that this use case also touches upon issues of compliance, regulation, and ethics.
    Let’s see why:


    First, the company will have to make sure that the individuals’ private data is
    not stored. This refers to the actual images or inferences made about an individual,
    such as age. It is likely that, depending on the geographical region, the exact
    legal requirements will be different, but there will undoubtedly be various legal
    complications.


    Secondly, the application should make sure that it is not biased against certain
    types of people. It is well known that computer vision algorithms can be biased
    against minorities. A famous article by *Time* demonstrated how a computer vision
    API might mistake Oprah Winfrey for a man, for example (“Artificial Intelligence
    Has a Problem With Gender and Racial Bias” n.d.).


    Given that the main challenges here touch upon different parts of the business,
    Tesseract Academy’s 2-actor model could be very useful. The benefit of this model
    is that it is very flexible, so it can also be applied in circumstances where
    the challenge is not only of a technical nature. The key point behind this process
    is that it lays out all the challenges that the project might face. Therefore,
    the decision maker and the data scientist can make sure they are on the same page
    when tackling a particular challenge.


    Analysis: Tesseract Academy’s 2-Actor Model


    So, let’s revisit the process.


    1. Problem definition


    a. Domain expert


    2. Choosing the right data


    a. Domain expert


    b. Data scientist


    3. Solution of the problem


    a. Data scientist


    4. Creating value through actionable insights


    a. Data scientist AND domain expert


    *Problem Definition.* In this particular case, the core problem definition is
    clear. The business owner wants to know specific statistics about the people in
    a store, such as gender, age, and race.


    However, the core problem definition needs to be extended. We also need to add:


    1. Data privacy


    2. Elimination of bias


    These points are going to inform the solution to the problem.


    The decision maker has also defined that the business should go for a commoditized
    solution, instead of developing their own solution internally.


    *Choosing the Right Data.* In this case, the data is a direct feed coming from
    cameras located inside the store. Therefore, the cameras must be of high quality,
    and the network must have enough bandwidth to feed the data to the API.


    Data privacy falls under this step. Remember that data management involves both
    the decision maker and the data scientist. While the data scientist is responsible
    for the technical aspects, the decision maker needs to ensure that the business
    is compliant.


    What they both need to decide upon is how the data can be fed to the API and what
    are the implications of the different choices. Is the data going to be stored
    somewhere and then sent? Or is it going to be sent in real time? How does this
    affect costs for data storage and network usage?


    *Solution to the Problem.* Given the extended problem definition and the constraints
    imposed by the decision maker, the data scientist has to define the right solution
    and come up with an attack plan. In this case, the attack plan does not involve
    data analysis but rather the comparison of different solutions in the market.


    More specifically, the data scientist will have to run A/B tests between all major
    computer vision service providers and identify which ones seem to work best. The
    data scientist might have to go to the store and test these systems in real time
    in realistic conditions.


    *Creating Value Through Actionable Insights.* Typically, actionable insights are
    derived after data has been analyzed. In this case, the data scientist and the
    decision maker will have to constantly monitor the system or the first few months
    of operation to ensure it works as expected. All sorts of problems could arise
    that could affect the result, but that might not be related to the API, such as
    issues with the cameras.


    The following [Table 3.3](#Chapter03.xhtml#tab3.3) summarizes all of the above
    insights.


    ***Table 3.3 Summary of Tesseract Academy’s 2-actor model***


    | **Problem definition** || 1. Get statistics2. Data privacy3. No bias |


    | --- | --- |


    | **Choosing the right data (data management)** || 1. Data feed from cameras2.
    Data privacy |


    | **Solution of the problem** || 1. Discover the best API2. Test APIs in realistic
    conditions |


    | **Creating value through actionable insights** || 1. Ensure that the API works
    as expected2. Revisit the model if required |


    Key Takeaways


    • Data strategy is defined as “*a* ***living*** *document that defines how the
    business is setting itself up, both from a technical and organizational perspective,
    to proactively manage and leverage data towards the long-term business strategy.*”


    • Data science development is different to software development. Managing a data
    science project requires following a data science process.


    • There are different processes for data science, some popular ones being CRISP-DM
    and the Tesseract Academy’s 2-actor process.


    [CHAPTER 4](#Contents.xhtml#ch4)


    [Hiring/Managing Data Scientists and Building a Data-Centric Culture](#Contents.xhtml#ch4)


    To be able to hire a good data scientist, you first need to understand what to
    look for. You need to know not only the traits of a good data scientist but also
    what skills they should have. Furthermore, to manage data scientists effectively,
    you need to understand what drives them. That’s exactly what we’ll be looking
    at in this chapter.


    Understanding How a Data Scientist’s Mind Works


    A good data scientist needs to have quite a few skills, but some are more important
    than others. Data scientists need to have math and statistics knowledge, hacking
    skills, and substantive expertise. If even one of these is missing, then, while
    the person might be incredibly smart, they are still not a data scientist.


    ***Hacking Skills***


    When we say hacking, we’re not actually referring to someone having the ability
    to get through the Pentagon’s firewalls. What we actually mean is that a data
    scientist needs to have outstanding computer knowledge.


    However, this doesn’t necessarily mean that they need a degree in computer science.
    After all, plenty of people are excellent hackers or have made a fortune in technology
    from developing software without having a degree at all.


    The important part is that the data scientist has to be able to think algorithmically,
    understand vectorized operations, and work with text files at the command line.
    If they don’t have the skills, they can’t possibly be a data scientist.


    ***Math and Statistics Knowledge***'
