    `数据策略是一份活的文档……` ——数据策略不应该是一个花费数月时间开发，然后被置在一边、积灰且无人问津的文档。无论如何，数据策略可以是一份文档、一份演示文稿或你选择的任何其他媒介，但最重要的是，它应该是一份活的文档——意味着随着业务的演进，它在不断地更新和刷新。


    `…… 定义了业务如何从技术和组织角度进行规划……` ——一个良好的数据策略理想情况下应该同时涵盖工程和基础设施方法，以及你计划如何组织团队，以最大限度地利用你的数据。


    `…… 主动管理和利用数据……` ——通过创建数据策略，你确保自己采取了积极措施，使业务尽可能具有韧性，并尽早地赋予其竞争优势。


    `…… 迈向长期业务战略` ——最后但同样重要的一点是，数据策略不应孤立于业务的其他部分而存在。相反，良好的数据策略将以业务战略作为其北极星，所有的计划都应该源于此。


    # 为什么数据策略很重要？


    你是否好奇过互联网上每分钟都会发生什么？Google 每分钟处理 380 万次搜索查询，YouTube 上有 450 万次视频观看，发送 1.8 亿封电子邮件，Netflix
    的观看时长约为 70 万小时。随着我们的生活日益数字化，我们与产品和服务之间的互动可以以前所未有的方式被记录和观察。


    耐克（Nike）、欧莱雅（L’Oreal）、沃达（Vodafone）和伦敦交通（Transport for London）有什么共同点？上看，所有这些企业经营不同的市场，提供完全不同的产品。然而，它们都是数据驱动型企业。


    在过去的几里，数据已经从产品的副作用变成了企业最有价值的资产之一。数据增加价值的方式是多层。尽管如此，人们可以将数据产生价值的领域大致分类为：运营改进、客户洞察和数据产品。


    ## 1. 运营改进


    - 数据可以改进甚至完全自动化我们业务中的流程。例如，Verizon 使用数据对客户服务电话进行分诊，从而优化其呼叫中心。此外，供应链物流等数据丰富的业务领域是自动化的首选目标。

    - 另一个例子是 Netflix 投入巨资优化生产流程，以便他们大规模地创作原创内容（Kumar, Misra, Walraven, Sharan, Azarnoush,
    Chen, and Govind 2018）。


    ## 2. 客户洞察


    - 今天许多最流行的服务使用数据作为工具，为客户提供更好的产品体验。例如，LinkedIn 使用你过去的互动来推荐你可能感兴趣的文章。Spotify 的 `Discover
    Weekly` 是另一个利用数据和 `ML` 来生成推荐并增加用户参与度的绝佳案例。


    ## 3. 数据作为产品


    - 最后，数据本身可以作为新的收入流为业务增加巨大价值。通常，这种价值只有在公司规模扩大到数千名用户并产生大量数据时才会变得相关，但不应被低估。

    - 拥有大量用户数据可以大大提高公司在收购者眼中的价值。IBM 收购了 Weather Underground，据《华尔街日报》报道，这笔交易价值约为 `$2
    billion`，证明了他们所拥的数据对 IBM 的价值。虽然 IBM 没有透露如何使用这些数据，但很明显，在业务的许多其他方面（例如 `IoT`）都有天气数据的整合，因为天气数据会影响设备故障。有时，即使看似没有价值的数据也可能隐藏着丰富的信息。


    在我们探索如何构建良好的数据策略时，请记住这些领域，因为它们将引导你的思考。


    即使是欧盟也承认数据在未来的重要性，并概述了了自己的数据战略。目标是创建一个单一的数据市场，以便在与拥有大量价值数据的科技巨头竞争时做到公平竞争（“欧洲数据战略”n.d.）。


    现在你已经确信每家企业都是数据业务企业，这变得更加清晰：公司需要一个有效的策略从其收集的数据中提取尽可能多的价值。通常，特别是在业务的早期阶段，数据收集在时间和金钱方面可能是昂贵的。一个经过深思的数据策略有助于专注于哪些数据将释放最大的价值，并希望启动数据飞轮。


    在我的工作过程中，我经常看到这两种情况，如 表 3.1 所示。


    那么，这两个案例有什么共同点呢？在两种情况下，数据策略都能扭转局面。在第一种情况下，数据策略将为公司提供大量的额外收入。在第二种情况下，正确实施的数据策略可以为初创公司提供除收入增加之外的竞争优势。


    ### 表 3.1 数据策略情况


    | | **情况 1** | **情况 2** |

    | --- | --- | --- |

    | ***用例*** | 一家公司想要进行统计分析。随着问题的调查，很明显本可以收集数据来改进分析，但这些数据并不可用。 | 一家初创公司需要某种数据科学服务。随着对系统的讨论进行，很明显请求的服务取决于许多不同类型的数据。这些数据的收集和存储揭示了新的变现途径，可以帮助改进初创公司的收入战略。
    |

    | ***解释*** | 这是我所称的“数据债”的例子，由于对未来项目缺乏规划，导致公司没有收集所有必要的数据。正如我们将在下文中看到的，良好的数据策略将描述公司希望在未来
    `12–24 months` 内实现的项目，以及实现这些项目以交付良好结果所需的数据。在规划过程中引入数据科学家将有助于确保你涵盖了该项目应收集的所有数据。
    | 在这种特定情况下，为特定数据科学项目规划的影响是发现了更多利用数据进行整体收入战略的机会。通常，围绕数据战略的头脑风暴可以向前也可以向后。在思考某个项目所需的数据时，你可能会发现利用相同数据开启的其他项目和机会。
    |

    | ***示例*** | 一家租车公司想要预测未来几个月的需求，为每个客户创建定制优惠。该公司没有保留有关其用户婚姻状况和年龄的信息。这些信息在多年运营中本可以很容易在其平台上收集到。然而，由于没有这样做，公司不得不接受一个性能下降的次优模型。
    | 一个常见的案例是推荐系统。推荐系统可以从有关用户的各种信息中受益：年龄、性别、购买以及可能的其他事情。设计平台以改进从用户那里收集的信息会产生广泛全面的数据库，可以提高推荐系统的有效性，还可以用于其他用途。例如，这些信息可以用于更好地管理折扣优惠、改进广告，甚至提升用户体验。
    |


    '
