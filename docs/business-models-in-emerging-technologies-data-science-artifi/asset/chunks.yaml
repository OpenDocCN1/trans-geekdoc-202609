  trans: "\n在这个过程中，有两个主要的参与者和四个步骤。主要参与者是 `domain expert`（领域专家或关键业务利益相关者）和 `data scientist`（或者在数据科学团队中，即团队负责人）。\n\
    \n这四个步骤概述如下。在每个步骤下，你将找到负责完成该步骤的人员。\n\n1. 问题定义\n   a. 领域专家\n2. 选择合适的数据（数据管理）\n\
    \   a. 领域专家\n   b. 数据科学家\n3. 问题的解决\n   a. 数据科学家\n4. 通过可操作的洞察创造价值\n   a. 数据科学家和\
    \ 领域专家\n\n### 问题定义\n这是定义关键问题的地方。这项工作由 `domain expert`（以及关键业务利益相关者）完成。为什么是 `domain\
    \ expert` 而不是 `data scientist`？因为没有能比真正参与业务的人更擅长谈论业务的问题了。虽然 `data scientist` 可能会带来一些外部知识，但\
    \ `domain expert` 才是真正应该理解其组织所有细节的人。这意味着他们应该能够列出一系列相关的问题/挑战。\n\n`data scientist`\
    \ 之前可能在该领域工作过，可能有一些很棒的主意，这些想法可以直接拿来用。然而，即便如此，`domain expert` 也需要对业务问题至少有一个清晰的认识，才能真正掌控提议解决方案并据此对任何建议进行优先级排序。\n\
    \n这里并不要求 100%具体。例如，一个缺乏 `data science` 知识的 `domain expert` 可能发现很难对业务问题提供明确的描述。这没关系，只要他们能够提供整体业务和一些关键性能指标的准确图景即可。\n\
    \n这里的危险在于表述模糊，并且无法向 `data scientist` 解释预期关键指标或结果是什么。解决挑战需要 `data scientist` 确保他们正在针对正确的目标进行优化，然后将这些结果传给\
    \ `domain expert`，使收益显而易见。第一步对于实现这一目标至关重要。\n\n### 选择合适的数据（数据管理）\n这很棘，因为需要 `data\
    \ scientist` 和 `domain expert` 的协同。在理想的世界里，业务从第一天起就遵循数据策略。数据是干净且质量良好的。领域相对简单，数据中没有噪声。遗憾的是，这是例外而非常态。\n\
    \n在大多数情况下，企业并没有遵循数据策略。这意味着 `data scientist` 可能会遇到许多问题，例如：\n1. 缺失值；\n2. 重要且有效的变量未被收集；\n\
    3. 数据收集的粒度错误（例如，按月而不是按天）。\n\n同样，这里存在一个来自领域的巨大危险。其中一位作者曾与一家生产雷达设备的公司合作。他为他们开发了一个算法，但当公司更换了芯片组时，算法停止工作了。问题源于两个芯片组固有的噪声以及硬件的其他版本差异。作者和公司都不知道升级芯片组不会改进算法，而是需要完全重新训练。\n\
    \n所以，完成这一步骤的最佳方法是通过 `data scientist` 和 `domain expert` 之间的往来沟通。不要做任何假设！不要假设数据是正确、准确或缺乏噪声的。对任何早期的、非常成功的结果都要非常怀疑。更有可能你遇到的是数据泄露（data\
    \ leakage），而不是惊人的数据。\n\n数据泄露的一个例子是：输入变量与结果变量高度相关，但在测试时通常无法获得。例如，如果你正在预测季度销售额，有人添加了一个指示销售额高低的二变量，这会导致性能飙升。但这个变量是在回顾过去之后才创建的。\n\
    \n### 问题的解决\n这一步取决于 `data scientist`。如果前面的步骤执行得当，将会拥有：\n1. 对业务问题的清晰定义。\n2. 一组良好的数据。\n\
    \n现在 `data scientist` 需要做的是：\n1. 确定成功的关键指标。\n2. 使用各种数据科学方法解决问题。\n\n这让我们进入了第四步。\n\
    \n### 通过可操作的洞察创造价值\n到目前为止，`domain expert` 和 `data scientist` 组合实现了：\n1. 对问题的共同理解。\n\
    2. 检查了数据质量。\n3. 创建了解决方案。\n\n现在是这两个参与者协同工作的时候。`domain expert` 必须理解并批准解决方案。`data\
    \ scientist` 必须将其转化为可衡量的结果，使收益变得清晰。\n\n### 案例\n让我们来看几个案例，使上述内容更容易理解。\n\n#### 案例\
    \ 1：推荐系统\n推荐系统对于任何电子商务及其他领域都是非常有价值的工具。Spotify 使用推荐系统识别你喜欢的歌曲。Amazon 使用推荐系统推荐产品。Netflix\
    \ 使用推荐系统预测你将观看电影或节目。\n\n所以，在这个案例中，我们将处理一家名为 Zookla 的虚拟公司。Zookla 是一家运动服装和设备的在线零售商。公司由\
    \ 10 人组成，包括开发人员、业务发展人员以及深度参与日常运营的 CEO。公司最近筹集了 500 万美元，并建立数据科学部门。Zookla 聘请了一位数据科学家来处理为期六个月的项目。\n\
    \n### 分析：Tesseract Academy 双演员模型\n我们将从 Tesseract Academy 的双演员模型角度来分析该项目。以下是流程的回顾：\n\
    1. 问题定义\n   a. 领域专家\n2. 选择合适的数据（数据管理）\n   a. 领域专家\n   b. 数据科学家\n3. 问题的解决\n   a.\
    \ 数据科学家\n4. 通过可操作的洞察创造价值\n   a. 数据科学家和 领域专家\n\n#### 问题定义：理想情况\n在理想的情况下，CEO 清楚什么是推荐系统以及它如何提高利润。CEO\
    \ 也对这在屏幕上看起来是什么样了如指。展示推荐系统有很多。例如，Amazon 使用以下两种方式：“经常一起购买”和“购买此商品的人还购买了”，如图 3.4\
    \ 所示。\n\n```\n(Figure 3.4)\n```\n\n另一方面，Spotify 根据你喜欢的歌曲创建自定义播放列表，如图 3.5 所示。\n\
    \n```\n(Figure 3.5)\n```\n"
