- raw: 'However, a data science strategy is less effective if it is not implemented
    from the early stages. This is why it is important to consider it as an integral
    plan of the product roadmap and the business plan. One of my favorite sayings
    is “failing to plan is planning to fail,” which couldn’t be more true for a data
    strategy.


    How to Define a Data Strategy


    Now that we’ve introduced the importance of having a data strategy, you must be
    wondering what the best process is to build a data strategy. There are many approaches
    that people favor online, each with its own pros and cons. The approach described
    as follows is one that we’ve had success with when working with small- to medium-sized
    businesses looking to build a roadmap for working with data.


    ***Start With Your Business Strategy***


    A data strategy cannot exist in isolation of a coherent business strategy. The
    type of work you undertake will largely depend on objectives your business is
    looking to meet in the short- to medium term.


    For example, imagine Company A (a B2C company) has just launched—or is about to
    launch—its first product to market. Presumably, one of their strategic priorities
    for the following year might be to rapidly acquire users and ensure that retention
    and engagement are high. Given these priorities, the data team must focus on building
    the right foundation to collect and analyze the necessary data to make rapid iterations
    on the product if necessary. In this example, this would form a core part of the
    data strategy.


    *Note that the business strategy will change from time to time, and so it is important
    that the data strategy also adapts to meet any new objectives or priorities.*


    If you have a clear idea of your strategic priorities as a business, then feel
    free to skip to the section on data use cases. Otherwise, in the following section,
    we will describe an exercise that should help you focus on what is most important
    for the business right now.


    Exercise 1: Defining Your Strategic Priorities


    First, a company needs to identify why it exists—what we’ll call its *vision*.
    This vision is the North Star for the company, and it should answer the question,
    “What will the world look like in 10 years with our company?” It should be bold,
    grand, and aspirational because, even if you never get there, it gives everyone
    in your company a sense of direction and purpose.


    Following the vision statement, you should create your mission statement. This
    is a more short-term-focused description of **why** the organization does what
    it does, **what** it does, **who** it does it for, and **how** it does it. The
    mission statement should feel as if it’s within your grasp and is something you
    are clearly working toward in the present.


    Lastly, from the mission statement, one can derive their strategic priorities.
    The whole point of defining the vision and mission is that you should start seeing
    a path from the organization’s current state to reach that North Star and this
    path is your strategy! All that’s left is defining the strategy into concrete
    priorities.


    When going through this exercise with business owners in the past, we like to
    break down the business into its parts and get a feeling for where the areas for
    improvement are. The components we use to define a business are:


    • Product


    • Growth Marketing/Sales


    • Internal Operations (People and processes)


    • Business Model/Finance


    These components will vary slightly depending on the type of business you’re building,
    so change those as you see fit.


    Once we’ve defined these components, the next step is to brainstorm some areas
    of work or improvement for each component (using a whiteboard tool or similar).
    It should come as no surprise that the more people that are involved from different
    parts of the business, the better the perspective you’ll gain on each component.


    However, keep in mind that each additional person will make the brainstorming
    session longer, making it more difficult to dive deeper into each employee’s opinions.


    The output of this brainstorming exercise will be a set of ideas and suggestions
    for areas of work for the business going forward. You should begin to see certain
    themes emerging within each of the components or even across components. Take
    some time with the group to cluster all the thoughts and ideas into logical groups
    and decide which ones likely deserve the most attention in the coming year. These
    should form the foundation of your business strategy.


    ***Build Your Data Use Cases***


    From your strategic priorities, you can start to ideate what the data use cases
    could be to support the delivery of that strategy. A **data use case** is a well-contained
    and well-defined project that relates to completing one of your strategic objectives.
    The data use cases that you define will form your key priorities for the year
    ahead, and from these data use cases, you can begin to formulate a plan of your
    data activities.


    Some examples of data use cases are:


    • Build a self-serve analytics capability in the company;


    • Reduce the cost of delivery of service for a particular product;


    • Deliver a more personalized customer experience;


    • Reduce customer churn.


    A good number of data use cases would be 3 to 5 for a year, including 1 to 2 quick
    wins. A quick win data use case serves several purposes, namely that you can demonstrate
    near-immediate value from the data side of the business to get more buy-in from
    the rest of the business. Also, delivering a project end-to-end can help to uncover
    any unexpected issues before beginning work on any bigger projects.


    Once you have identified your data use cases, you can start to break down what
    will be required to deliver each of them and what considerations to make before
    embarking on any of them. The areas you need to think about for each data use
    case are:


    • Data requirements: Do you require any specific data to deliver the project?
    A data scientist will be able to guide you regarding the type of data that may
    be required for a project and the quantity.


    • Key project resources: Think about the roles that will be required to deliver
    on your project—this could cover not only data engineers, data scientists, and
    data analysts but also any business owners, project/product managers, and so on.
    Also, think about which people in the business may be impacted by this project
    and need to be involved as stakeholders.


    • Technology: Are there any technical dependencies before the project can be successfully
    implemented? Will the data architecture/infrastructure have to be modified to
    get all the required data?


    It is useful to think of these areas for all data use cases together, so you can
    spot overlapping requirements across projects and better coordinate resources.


    ***Data Architecture***


    Having a clear idea of how your data is architected is imperative for long-term
    success and continuous innovation. As your organization scales, the amount of
    data in your organization will scale, and often in a nonlinear manner since each
    new user could potentially be creating more data than previous users as your product
    grows and improves.


    In the early stages of a company, the cost of switching from one database or architecture
    type to another is manageable. It can often be done without too much service downtime.
    Compare that with an organization like Slack, which spent three years (from 2017
    to 2020) migrating their data architecture from active–active clusters to a tool
    called Vitess (Ganguli, Iaquinti, Zhou, and Chacon 2020). Clearly, the amount
    of due diligence, thought, and work put into this migration is eons above one
    that a start-up with fewer than a thousand users would have to make to move from
    NoSQL to a SQL database, for example.'
