- raw: 'In this process, there are two main actors and four steps. The main actors
    are the **domain expert** (or key business stakeholder) and the **data scientist**
    (or, in the case of a data science team, the team leader).


    The four steps are outlined as follows. Under each step, you will find the person
    who is responsible for completing it.


    1. Problem definition


    a. Domain expert


    2. Choosing the right data (data management)


    a. Domain expert


    b. Data scientist


    3. Solution of the problem


    a. Data scientist


    4. Creating value through actionable insights


    a. Data scientist AND domain expert


    **Problem definition**: This is where the key problem is defined. This is done
    by the domain expert (and key business stakeholder). Why is it the domain expert
    instead of the data scientist? Because no one can speak better about the problems
    of the business than someone who is actually part of the business. While a data
    scientist might bring some external knowledge, the domain expert is the one who
    should really understand all the intricacies of their organization. This means
    that they should be able to pose a list of relevant problems/challenges.


    The data scientist may have worked in this field before and might have some great
    ideas, which can be used straight out of the box. However, even if that’s the
    case, the domain expert needs to have at least a clear idea of the business problems
    to really own the proposed solution and prioritize any suggestions accordingly.


    There is no requirement here to be 100 percent specific. For example, a domain
    expert who lacks an understanding of data science might find it challenging to
    provide an unambiguous description of the business’s problems. That’s fine, as
    long as they can give an accurate picture of the overall business and some key
    performance indicators.


    The danger here is being vague and unable to explain what the expected key metrics
    or results are to the data scientist. Solving the challenge requires the data
    scientist to make sure they are optimizing for the right target and then communicating
    these results to the domain expert so that the benefit becomes clear. This first
    step is crucial in achieving this goal.


    **Choosing the right data (data management):** This is tricky because it requires
    the synergy of both the data scientist and the domain expert. In an ideal world,
    the business has followed a data strategy from day zero. The data is clean and
    of good quality. The domain is relatively simple, and there is no noise in the
    data. Unfortunately, this is the exception rather than the rule.


    In most cases, a business will not have followed a data strategy. This means that
    the data scientist might encounter many issues, such as:


    1. Missing values;


    2. Important and useful variables not being collected;


    3. Data being collected at the wrong level of granularity (e.g., month instead
    of day).


    Similarly, there is a significant danger here coming from the domain. One of the
    authors worked with a company producing a radar device. He developed an algorithm
    for them, but when the company changed the chipset, the algorithm stopped working.
    The problem was due to the noise inherent in the two chipsets and some other version
    differences in the hardware. Both the author and the company were unaware that
    upgrading the chipset wouldn’t improve the algorithm, but rather it would require
    complete retraining.


    So, the best way to walk through this step is through a back-and-forth between
    the data scientist and the domain expert. Make no assumptions! Do not assume that
    the data is correct, accurate, or lacks noise. Be very skeptical of any early,
    very successful results. It is more likely that you have data leakage rather than
    amazing data.


    An example of data leakage is when an input variable correlates very highly with
    the outcome variable but wouldn’t usually be available at the test time. For example,
    if you are forecasting quarterly sales and someone is adding a binary variable
    indicating whether sales were high or low, this would cause performance to spike.
    But this variable was created after looking into the past.


    **Solution of the problem:** This step comes down to the data scientist. If the
    previous steps have been done correctly, the following things will be in place:


    1. A clear definition of the problem and the business.


    2. A good, clean set of data.


    The data scientist now needs to do the following:


    1. Identify the key metrics of success.


    2. Solve the problem using a variety of data science methods.


    This takes us to step 4.


    **Creating value through actionable insights**: So far, the domain expert–data
    scientist duo have achieved the following:


    1. Built a common understanding of the problem.


    2. Checked the quality of the data.


    3. Created a solution.


    Now it’s time for the two actors to work in complete synergy. The data scientist
    has to explain to the domain expert how the solution really addresses the problem
    outlined in step 1. The decision maker has to understand and approve this solution.
    The solution needs to be translated in measurable results. This way, the domain
    expert can integrate it into the overall company strategy, and the data scientist
    can have a measure of performance to use as a benchmark when further improving
    the solution.


    Case Studies


    Let’s take a look at a few case studies to make all the above easier to understand.


    ***Case Study 1: The Recommender System***


    A recommender system is an invaluable tool for any e-commerce business and beyond.
    Spotify uses a recommender system to best identify the songs you are going to
    like. Amazon is using a recommender system to recommend products to you. And Netflix
    uses a recommender system to try and predict what movies or shows you will watch
    for hours.


    So, in this case study, we will deal with a fictional company called Zookla. Zookla
    is an online retailer of sports clothes and equipment. The company consists of
    10 people and includes software developers, business development, and the CEO,
    who is still very much involved in day-to-day operations. The company recently
    raised $5 million and wants to establish a data science function. The first thing
    they care most about is creating a recommender system.


    Zookla hires a data scientist to deal with this on a six-month contract.


    Analysis: Tesseract Academy’s 2-Actor Model


    We will analyze the project from the perspective of Tesseract Academy’s 2-actor
    model. Here is a reminder of the process:


    1. Problem definition


    a. Domain expert


    2. Choosing the right data (data management)


    a. Domain expert


    b. Data scientist


    3. Solution of the problem


    a. Data scientist


    4. Creating value through actionable insights


    a. Data scientist AND domain expert


    So, let’s see the good and the bad scenario for each step.


    Problem Definition: Good Scenario


    In a good scenario, the CEO has a good idea of what a recommender system is and
    how it could improve profits. The CEO also has a good idea of what this would
    look like on the screen. There are many ways to present a recommender system.
    For example, Amazon uses the following two ways: “frequently bought together”
    and “customers who bought this also bought,” As depicted in [Figure 3.4](#Chapter03.xhtml#fig3.4).


    ![images](images/fig3.4.jpg)


    ***Figure 3.4 Example of the Amazon recommender system in action***


    ![images](images/fig3.5.jpg)


    ***Figure 3.5 Examples of the Spotify recommender system in action***


    Spotify, on the other hand, creates custom playlists based on the songs you like,
    as shown in [Figure 3.5](#Chapter03.xhtml#fig3.5).


    And obviously, there are many other ways to present recommendations, such as a
    list or tiles (e.g., Netflix).


    The way recommendations are presented interacts with the UI/UX (User Interface/User
    Experience). And the way the UX/UI is designed affects how the data is collected.
    It’s essential to be aware of these interplays.'
