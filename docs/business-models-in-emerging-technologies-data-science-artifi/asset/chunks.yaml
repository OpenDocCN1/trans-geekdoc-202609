- raw: 'Cryptography allows people to send messages that are secured to each other.
    The person sending the message uses a key and an algorithm to encrypt their data.
    They then send the message to the other participant. The person receiving the
    message decrypts it, using the right key and algorithm, so they can see the original
    data.


    ![images](images/fig5.2.jpg)


    ***Figure 5.2 How blockchain works***


    The encryption key is the most critical part of cryptography because it makes
    the message, transaction, or data unreadable for a person who is not authorized
    to see it. It can only be processed by the person who was meant to receive the
    message.


    While Bitcoin doesn’t specifically use this type of cryptography to hide the transactions,
    the transactions are still anonymous because there is no need to supply personal
    information.


    For example, all you have to do is open a cryptocurrency wallet, and you are assigned
    a public and a private key. You don’t have to supply any personal information
    because all the transactions are already trusted as they are being conducted through
    the blockchain.


    Some of the cryptography methods used for cryptocurrencies include symmetric encryption
    cryptography, asymmetric encryption cryptography, and hashing.


    Symmetric Encryption Cryptography


    In symmetric encryption cryptography, the same key is used to encrypt and decrypt
    the message. The advantage of this form of encryption is that it’s simple to implement
    and requires little operational overhead. However, the drawbacks include challenges
    with scaling and problems with keeping the shared key secure.


    Asymmetric Encryption Cryptography


    With asymmetric encryption cryptography, two different keys are used for the encryption
    and decryption of the data. One key is public, and it can be shared openly, such
    as the address of your wallet. Conversely, only the owner knows the private key.


    In this case, the message will be encrypted using the public key, but only the
    recipient’s private key can decrypt it.


    This encryption approach helps not only with encryption but also authentication.
    In terms of authentication, the public key checks the related private key for
    the actual sender. When it comes to encryption, only the person holding the correct
    private key can decrypt the message.


    Hashing


    Hashing efficiently verified the transaction data’s integrity on the network.
    It ensures that no tampering occurs with the structure of the data on the blockchain
    and encodes account addresses. It makes mining possible and is a vital component
    in the encryption of transactions that take place between accounts.


    Discover the Different Types of Blockchain Technology


    Currently, there are four primary types of blockchain networks: public, private,
    consortium or federated, and hybrid. Each of these has pros and cons, with some
    being better suited for certain applications than others.


    Espae Hong, the head of CBDC Blockchain Research Institute, explains, “While the
    blockchain technology behind projects is the same, the target end-users of the
    different types of blockchain may differ.” Public blockchains, for example, are
    aimed at the general public, as the name implies. Conversely, private blockchain
    networks are designed for “invitation-only users and their networks” (Parizo n.d.).


    ***Public Blockchain***


    The public blockchain allowed the creation of Bitcoin and helped make DLT popular.
    This type of network eliminates issues inherent to centralization, such as reduced
    security and minimal transparency.


    With DLT, the data isn’t stored in a single place but distributed across a peer-to-peer
    network, which is where the name comes from.


    However, since it is decentralized, there must be a way to verify that the data
    is authentic, which is where the consensus algorithm we already discussed comes
    in. Essentially, the network’s participants come to an agreement in terms of what
    state the ledger is currently in with proof of work and proof of stake consensus
    methods, among others.


    A public blockchain has no restrictions and doesn’t require any permissions, which
    means that anyone with access to the Internet can join the platform and act as
    a node. This person can view current and past data, as well as conduct mining
    activities.


    Data or transactions that have been validated cannot be changed, though anyone
    can verify said transactions, identify bugs, or suggest changes as the code tends
    to be open source.


    Advantages


    One major advantage of public blockchains is that they are independent. It doesn’t
    matter what organization or which person started it. As long as there are devices
    still connected to the network, the blockchain will continue to operate, even
    if the founding organization (or person) no longer exists.


    Some public blockchains provide rewards to encourage users to commit the computing
    power necessary to keep the network up and running.


    Public blockchains are also transparent, meaning that anyone on the network can
    view the data. Furthermore, these networks are also largely secure, as long as
    people are strict about following protocols.


    Disadvantages


    Like with anything, public blockchains also have certain disadvantages. For example,
    it can be quite slow considering the amount of “work” that goes into verifying
    a transaction.


    Furthermore, an organization cannot limit access or usage. The problem is that
    a bad actor who gains 51 percent or more of the network’s computing power can
    change it however they like.


    Another problem with a public blockchain is that it can be challenging to scale.
    As more devices join the network, it slows down until it’s pretty much crawling.


    Use Cases


    Public blockchains are used mainly for the mining and exchange of cryptocurrencies,
    such as Bitcoin. However, these networks also shine in situations where a clear
    chain of custody is required, such as public records of ownership and notarization
    of affidavits.


    This type of network is also a good option for organizations that are fully transparent,
    such as nongovernmental organizations and other social support groups. They are
    not recommended for private businesses.


    ***Private Blockchain***


    A private blockchain consists of a network controlled by a single entity or that
    functions in a restricted environment. Though it operates as a public blockchain
    in terms of decentralization and using a peer-to-peer network, a private blockchain
    is much smaller.


    Furthermore, users must be invited to join the network because it’s usually set
    up inside an organization. These types of networks are also known as enterprise
    or permissioned blockchains.


    Advantages


    A private blockchain is, in essence, like a company’s internal network. It’s the
    equivalent of an intranet, where public blockchains are the equivalent of the
    Internet.


    Thus, the company that controls the private blockchain can do the same things
    as it does with a traditional network, including setting permission levels, authorizations,
    security, and accessibility.


    So, a company could allow only specific nodes to see, edit, or add data, while
    others would only be able to see the data. The organization can also restrict
    access so other parties would only be able to view certain data.


    A big advantage of private blockchains is that they’re very fast because they’re
    so small. Therefore, they can complete transactions much faster than a public
    blockchain.


    Disadvantages


    Some claim that private blockchains can’t be called true blockchains because the
    whole idea is of decentralization without a single entity in control. Trust is
    also a problem because a central node determines what is and isn’t valid.


    Security can also be an issue because there are fewer nodes, and if some of them
    turn out to be bad actors, the whole consensus method becomes null and void. The
    proprietary code backing these blockchains can also cause security issues because
    it can’t be audited or confirmed by independent users.


    Use Cases'
