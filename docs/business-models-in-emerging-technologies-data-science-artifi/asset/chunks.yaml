    you can find research where the results are significant, but this is only because
    the model assumptions aren’t being met and not because the researcher intended
    to deceive.


    Case Studies and Examples


    Here are some examples where data science can make a significant impact on business.


    ***Preventive Maintenance Becomes Predictive Maintenance***


    Preventive maintenance is a key aspect of business for many firms across a wide
    range of industries because of the reduction of unplanned down-time. The latter
    can negatively affect the bottom line, which is why preventive maintenance is
    so valuable.


    Like with any other aspect of business, improving maintenance efficiency is a
    big priority for many firms, especially those that rely on a lot of expensive
    machinery. Companies operating in industries such as manufacturing, shipping,
    oil and gas, rail, and freight can all benefit.


    The goal of regular maintenance is to minimize failures, maximize the life of
    a machine, and ensure optimal performance and efficient operation.


    The most common approach is for firms to use a maintenance schedule based on recommendations
    made by the manufacturer of the equipment or vehicles. It’s just like with your
    car, where the manufacturer recommends you change the oil after 10,000 miles,
    for example.


    This isn’t a bad approach at all. It’s certainly better than guessing or waiting
    for something to break down. However, it isn’t ideal because failures still happen.
    The fact is that no one can plan for every situation and predict every issue.


    For example, a manufacturer might recommend that you change fuel filters every
    5,000 hours of operation, but that’s in ideal operating conditions. If the diesel
    hasn’t been the best quality or the machine is operating in very dusty or sandy
    conditions, the change will need to come sooner unless you want a lot of other
    problems to occur.


    Avoiding unplanned downtime due to failures and breakdowns is essential because
    this downtime can be very expensive. It leads to a significant loss of revenue
    through lost output and reduced productivity.


    The better alternative is planned downtime because you can plan to conduct maintenance
    at a time when the machine being inoperable will cause the least amount of problems.
    The key is figuring out when that is.


    Many firms are turning to data and predictive analytics to solve their issues
    with maintenance scheduling (Kampakis 2020a).


    In manufacturing, for example, the sensors on a production line can collect almost
    any information you need. You can then store and analyze the data. Algorithms
    can then use the data to determine when a failure might occur. This process is
    referred to as predictive maintenance.


    The predictive maintenance algorithms being used at the moment are usually based
    on ML, so their accuracy improves as they get better at identifying situations
    when failures are possible.


    Furthermore, the whole process can be automated, which means that predictive analytics
    can work out when maintenance is necessary to avoid failure. It can also determine
    the best time for maintenance to occur to ensure it is the least disruptive, based
    on a variety of factors such as demand.


    Predictive maintenance offers significant boosts in productivity, improves customer
    service, reduces costs, and improves profits. As Google trends show, it has become
    very popular and will continue to increase in popularity as more firms understand
    the benefits.


    Using AI and Data Science to Fight COVID-19


    Owing to the novel coronavirus dubbed COVID-19, the world is facing a crisis that
    no one thought could occur in the modern world. At the time of this writing, the
    death toll has almost reached one million on a global scale with a total of 31.4
    million cases of infection, and the crisis is still ongoing, with many experts
    warning of a second wave of mass infections.


    Many organizations have turned to AI and data science to help in this time of
    crisis (Kampakis 2020b). The White House and the Allen Institute for AI have released
    a database of 29,000 research articles on the coronavirus family. These articles
    have been modified to ensure they are machine-readable by NLP libraries.


    Using AI, researchers hope they will be able to generate new insights from all
    the work that’s already been done into understanding this virus family.


    The data set has also been put up as a Kaggle challenge to take advantage of crowdsourcing
    to come up with new insights and possible solutions.


    AI can also assist in detecting people who are very vulnerable to infection and
    developing severe complications from the virus. Medical Home Network uses such
    a system to first address those patients who are most in need of medical care.


    AI can also help to create vaccines. A team from Australia’s Flinders University
    designed an AI that managed to develop a drug on its own for the first time. While
    the technology is still in its infancy and not much help fighting COVID-19, it
    could be vital for a future pandemic.


    AI can also help to reduce the strain on health care networks, with chatbots replacing
    doctors to answer simple questions. For example, Ask-Sophie helps patients determine
    whether they have a common cold or COVID-19 (“Check Your Symptoms | Medicare”
    n.d.).


    Traditional predictive analytics can also help forecast the future. Researchers
    in Israel, for example, are relying on AI to predict when the next breakout might
    occur, so they are in a better position to prevent it. The Israelis don’t have
    a large number of tests available, so they need to be careful how they use them.
    They are, therefore, handing out questionnaires daily and relying on data science
    to work out which clusters of people could be infected.


    Hiring the Right Person


    As it has become clear by now, data science is a big and convoluted field, primarily
    because it is an aggregation of different scientific disciplines. This means that
    there are many different types of data scientists, and hiring one can be a fairly
    complicated process, as backgrounds can vary. A ML specialist might have a very
    different skillset from a pure statistician. We are looking into the topic of
    hiring and managing data scientists in [Chapter 4](#Chapter04.xhtml#rch4) later
    on.


    Key Takeaways


    • Data science is a term that aggregates many different fields. The core ones
    being AI, ML, and statistics.


    • The most popular types of ML are supervised and unsupervised learning. There
    are other subtypes, such as active learning and recommender systems, which can
    be useful for certain types of businesses.


    • Statistics is broken down into descriptive and inferential statistics. The most
    interesting applications (like statistical modeling) fall within the spectrum
    of inferential statistics.


    • When working with statistical methods it’s important to try and avoid potential
    biases that might creep into the data.


    • Hiring and managing a data scientist is not always easy, because there are data
    scientists of many different backgrounds.


    [CHAPTER 3](#Contents.xhtml#ch3)


    [What Is a Data Strategy?](#Contents.xhtml#ch3)


    Now that we have covered a high-level overview of data science, we move on to
    talk about data strategy. This is key for any business that wants to generate
    value from its data, and it is just as important as hiring the right person.


    There are many varying definitions of a data strategy on the Internet, but a good
    definition would be the following:


    *A data strategy is a* ***living*** *document that defines how the business is
    setting itself up, both from a technical and organizational perspective, to proactively
    manage and leverage data towards the long-term business strategy.*


    This definition is made up of several key components:'
