- raw: 'That doesn’t mean unsupervised learning doesn’t have its place. Some ways
    you can apply unsupervised learning are for clustering, anomaly detection, association
    mining, and latent variable models.


    Clustering


    With clustering, you can categorize the data into groups based on their similarity.
    It’s not an approach that’s widely used for applications such as customer segmentation,
    though, because it tends to overestimate how similar the groups are and doesn’t
    see the data points as separate entities.


    The biggest issue is that these types of problems are generally not well defined.
    For example, if you give an algorithm a series of images of various animals, the
    resulting clustering might not be relevant to your needs.


    These images can be clustered in several ways, such as by color, type of animal,
    or habitat. None of these approaches are technically wrong, but some might be
    more useful than others.


    The effectiveness of the result depends mainly on what your goal is. Therefore,
    it’s important to have a well-defined goal and to experiment until you get it
    right. The good news is that if you test various algorithms, in the end, you will
    find one that works.


    Anomaly Detection


    Anomaly detection is useful for finding unusual information in your data. If something
    is unusual or anomalous in the data set, these algorithms will find it.


    These algorithms have a wide range of realworld applications, especially for things
    like spotting fraudulent transactions. They can also be used to spot spikes in
    sales of various products but are just as helpful in detecting hackers.


    Association Mining


    Association mining is often used for basket analysis because it effectively identifies
    items that appear together frequently in your data. It’s often used to help determine
    correlations in transactional, sales, and even medical data.


    Latent Variable Models


    Latent variable models are used to make the data easier to analyze and come in
    during the preprocessing phase. These models are effective for doing things such
    as lowering the number of features in a set of data, also known as dimensionality
    reduction, or even splitting the data up into multiple components.


    With dimensionality reduction, the goal is to group together large numbers of
    variables into a lower number of factors, making the data easier to interpret.
    One of the most widely used techniques is factor analysis.


    An example is the Big Five Personality Inventory, which was developed by gathering
    data from a large number of people and applying factor analysis to group the answers
    into five overall factors. Based on the Big Five personality theory, our personalities
    can be categorized as:


    • Extraversion


    • Agreeableness


    • Conscientiousness


    • Neuroticism


    • Openness to experience


    However, each of these major factors is made up of a wide range of variables.
    For example, an extroverted personality is characterized by friendliness, cheerfulness,
    assertiveness, and much more.


    Dimensionality reduction can be applied to many other problems, including user
    demographics and customer data.


    ***Reinforcement Learning***


    Many experts believe reinforcement learning to be one of the keys to unlocking
    real AI because of the vast potential it holds. Moreover, it is growing at an
    accelerated pace and producing a wide range of algorithms for various applications.


    Reinforcement learning is based on a punishment/reward system. It’s a little like
    training your pet pooch. If you want to teach Fido to sit on command, you’ll give
    him the command, show him what you want, and reward him with a treat. For a while,
    you continue to reward him every time he gets it right to reinforce the behavior.


    When Fido doesn’t listen to you, you usually have to repeat what you want until
    he does it and then reward him. Not receiving a reward is generally “punishment”
    enough for him to get that he’s done wrong.


    With an algorithm, things work slightly differently, but in essence, they are
    the same. For example, let’s consider a robot learning to walk. If the step it
    takes is too long, it loses its balance and tips over. That’s the punishment.
    So, it will keep changing the length of its step until it can move without falling
    over, which is the reward.


    Or consider the same robot attempting to navigate a maze. Things are a little
    more complex here because it’s not just an immediate solution. In the previous
    example, adjusting the length of the step will yield immediate results. With a
    maze, the first few steps might be right, until it reaches a dead-end and has
    to backtrack until it finds open space.


    You might be wondering what the point is. Well, consider some real-world applications.
    Reinforcement learning is used for such things as driverless cars, robot vacuum
    cleaners, and more. Without reinforcement learning, your vacuum cleaner would
    keep slamming into the same obstacle instead of backing up to move around it.


    Reinforcement learning is the closest thing to learning like a human. Consider
    that any skill you learn and develop is based on experience. Therefore, the more
    you practice, the better you get. However, it all boils down to reward/punishment.
    You’ve learned by discovering what works and what doesn’t.


    Consider chess. The more you play, the better you get. That’s because you amass
    more and more experience on what works and what doesn’t in different situations.


    Reinforcement learning for machines works much the same way, which is why so many
    consider it to have so much potential. It allows for the resolution of very complex
    problems in a variety of environments.


    ***Deep Learning***


    Deep learning studies neural networks that have multiple layers, also known as
    deep neural networks. A neural network is made up of neurons and the pathways
    that connect them, a bit like a connect-the-dots picture. The human brain is the
    most powerful computer that exists, so it makes sense for us to model artificial
    computers on something that already works so well.


    In deep learning, artificial neural networks are used to help machines learn more
    quickly, more effectively, and at far greater volumes. It has been used to solve
    various problems that were believed to be unsolvable, such as natural language
    processing (NLP), speech recognition, and computer vision.


    At a very basic level, the way it works is that the input is generated from observation,
    which is then added to a layer. That layer generates an output, which becomes
    the input for the following layers until you get to the final output.


    For example, when you look at a picture of an eggplant, you know it’s an eggplant.
    But how do you know it’s an eggplant and not an airplane or a basketball?


    Your eyes see a specific shape and a specific color, and, based on experience,
    it translates those inputs into an abstract concept you understand. All this information
    is filtered from your eyes through multiple layers until it becomes an eggplant
    rather than an airplane.


    Software applications such as Siri, Cortana, or Dragon Naturally Speaking can
    all understand you because of deep learning. It’s also what allows these applications
    to learn and improve the more they interact with you.


    This also applies to image or song recognition. Want to find out what a specific
    song is? Just get your app to listen to it, and it will be able to identify it.
    Likewise, want to find a particular item you can see in the real world? Take a
    photo of it, and the app will find it for you online.


    Deep learning can also be used to generate language. OpenAI’s GPT-3 is a very
    impressive model that can create articles so realistic that it is practically
    impossible to figure out a machine writes them.


    Another application for deep learning is that it has given computers the ability
    to identify different subjects in an image, such as being able to tell that chickens,
    horses, cats, and humans are different things.'
