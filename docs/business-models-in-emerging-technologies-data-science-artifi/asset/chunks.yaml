- raw: 'Also, finally, it helps if the CEO has good intuition or the company has done
    some preliminary research on useful patterns (e.g., customer segmentation). These
    can not only help inform the design of a recommender system, but they can also
    be used to create a simple rule-based recommender that could be used as a benchmark
    for a more advanced version.


    Problem Definition: Bad Scenario


    In the bad scenario, the CEO falls into one of these two groups:


    1. They say they “want to do something useful with data,” but they are not sure
    what that is.


    2. They say they want a recommender system, but they are oblivious to all the
    details and issues that this entails.


    The first scenario is pretty common and most data scientists would be prepared
    for it. In this case, the data scientist will take some time to explain data science
    to the CEO, learn more about the business, and discover the best way forward.
    The CEO would have been better off if they had done this preparatory work before
    hiring a data scientist because the result is one to two months of work.


    The second case is much trickier. The CEO might be confident in what they want,
    but they might be ignoring a lot of critical topics:


    1. They might be ignoring the interaction between the recommender system and UX/UI
    in how results are displayed and how data are collected.


    2. They have no real understanding of their customers.


    3. They are not sure what metrics they are after. What would success look like
    for this project?


    So, the first point can be a huge problem if, for example, the website requires
    an extensive redesign to display recommendations and collect relevant data. Points
    2 and 3 often come together. Sometimes, there is lots of enthusiasm about a project,
    but the client does not really know what they’re looking for. Is it simply more
    sales? More engagement? How much more?


    It is not possible to forecast the level of success. However, it is not uncommon
    for a project to finish and for the client to realize they are not happy with
    the results because they couldn’t verbalize their expectations from the onset.
    For example, if a client believes that a recommender system would double sales,
    this is likely unrealistic. The data scientist could explain what might be more
    feasible or how they could create a constantly improving system.


    There are cases where clients hold latent beliefs about the expectations surrounding
    new AI systems, but even they are not aware of them until the last minute when
    things don’t seem to be going the way they wanted them to go.


    ***Case Study 2: Forecasting Demand***


    Forecasting demand is a common problem in industries like retail. If a business
    can successfully do it, it can optimize its supply chains and orders to maximize
    margins. Let’s take the example of Leotard Clothes. This is a retailer that sells
    cat-inspired clothes.


    They have limited space in their warehouses, and producing clothes takes a significant
    amount of time and resources due to the special fabrics used. Also, they use many
    outside contractors, which means that costs will vary according to manufacturing
    volume. Manufacturing more clothes than the demand will significantly increase
    monthly costs, but if they manufacture fewer clothes, the company can still make
    a profit. Another issue with contractors is that there were shortages of material
    in some cases. Leotard Clothes would ideally like to preorder fabric a few months
    in advance.


    Hence for them, predicting demand is vital so that they know how many clothes
    to manufacture each month.


    Let’s see how Leotard Clothes can use the CRISP-DM approach to forecast demand.


    Analysis: CRISP-DM


    Let’s revisit the CRISP-DM process. Six main phases are described as part of the
    CRISP-DM process ([Figure 3.6](#Chapter03.xhtml#fig3.6)):


    1. Business Understanding


    2. Data Understanding


    ![images](images/fig3.6.jpg)


    ***Figure 3.6 Six main phases of the CRISP-DM process***


    3. Data Preparation


    4. Modeling


    5. Evaluation


    6. Deployment


    The first step (business understanding) is key. While forecasting is what the
    company wants to do, it wants to do this within the context of its operations.
    This means that forecasting demand is being used to optimize the allocation of
    resources.


    This step is directly connected to the fifth step (evaluation). Why is that? Because
    when evaluating a ML pipeline, we need to identify how results are translated
    into business actions. Since forecasting is a regression problem, the reported
    metrics will be something like the Mean Absolute Error or the Root Mean Squared
    Error. But what is a good score? This is very much business related.


    There are domains where a difference of 1 percent in performance can translate
    into millions of dollars. In other fields, a difference of 5 percent might not
    mean much. In this particular example, the interest is in ensuring the following:


    ![images](images/fig3.7.jpg)


    ***Figure 3.7 Example of the Teams Data Science Process***


    1. There is enough space in the warehouse.


    2. Point 1 requires that the clothes are sold, and there is enough demand.


    3. Point 1 also requires that the materials ordered align with the demand.


    Hence, while we are predicting demand, the key challenge is how to make sure that
    the warehouse has enough space. So, this should be our main focus.


    The rest of the steps in CRISP-DM are pretty standard in any data science project.
    Most data scientists will follow a similar process, even if they do not explicitly
    phrase it. We leave the analysis here because the Teams Data Science Process (discussed
    in [Figure 3.7](#Chapter03.xhtml#fig3.7)) covers some of these steps in greater
    depth.


    Case Study 3: Natural Language Processing


    Let’s see how we could use the Teams Data Science Process to break down a given
    problem. Suppose we are dealing with an online clothes retailer called Zappo.
    The company is interested in running natural language processing on its social
    media accounts to better understand how they could be improved.


    The first thing we notice is that there are four actors:


    1. Project lead


    2. Data scientist


    3. Project manager


    4. Solution architect


    According to the process, the solution architect is responsible for ensuring a
    proper business understanding within the company. The process also defines some
    technical tasks that need to be achieved. For example, in the first step, the
    repository is created by the project lead instead of the data scientist, hence
    clearly separating responsibilities between the different roles.


    In our case, the project lead needs to define what would be measured. For example,
    the company could choose to measure:


    1. Sentiment analysis on user comments about its products.


    2. Prediction of post engagement.


    3. Time series analysis of engagement metrics.


    So, we can immediately see that a general task of “using NLP to study social media”
    immediately breaks down into multiple different tasks. Each task should be treated
    separately. So, we can assume that the company in this use case decided to focus
    on the first task and go with sentiment analysis.


    The second stage of the process involves the data scientist, who is responsible
    for producing a report. You can see that the first output of the data scientist
    is something that can be easily communicated to the management. The process clearly
    places significant emphasis on business understanding. At the same time, the solution
    architect will start working on the deployment specifics. In our case, this would
    be about the choice of database, setting up APIs to extract data from social media,
    and so on.


    ![images](images/fig3.8.jpg)


    ***Figure 3.8 A sentiment analysis dashboard***


    *Source:* Faction A 2018


    The third step, modeling, consists of the data scientist running various sentiment
    analyses algorithms and comparing them. The output of this stage is a model report.
    Again, this helps keep track of how the project is progressing and communicating
    value to the business stakeholders.'
