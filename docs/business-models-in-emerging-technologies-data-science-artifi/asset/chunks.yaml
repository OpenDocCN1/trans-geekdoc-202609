- raw: '*Deterioration of Models.* ML models are called “models” because they are
    ultimately trying to accurately represent some behavior occurring in the real
    world. For example, a model that aims to forecast how many ice creams can be sold
    in a day will be modeling the behavior of ice cream demand across a population.
    Say that the temperature on a given day was given as an input to model the impact
    temperature has on ice cream sales. The model will likely find a positive correlation
    between temperature and ice cream sales, and sales will, in all likelihood, be
    predicted relatively accurately.


    We all know that the world we live in is incredibly complex and that behaviors
    change over time. This means that any model trained on historical data will be
    more and more out of date as the world changes and adapts to new circumstances.
    In the case of our ice cream model, there could be an increased awareness over
    time that ice creams are unhealthy because of their sugar content, leading to
    a slight decrease in ice cream sales over time. Our model would not accurately
    represent the real world since a day with the same temperature as a day a year
    ago will lead to fewer sales. This means our model will need to be **retrained**
    to capture the change in behavior.


    This phenomenon is extremely common across all areas of ML and leads to models
    needing to be retrained periodically for the accuracy to not deteriorate over
    time. A more representative example of this in the real world is the example of
    fraud detection, where criminals are always coming up with new ways to defraud
    institutions; hence models need to adapt to be able to detect these new types
    of fraud. This reality means that a model is never in its “final state,” adding
    another layer of complexity to AI projects.


    *Hard to Forecast.* It may be tempting to think that because one solution to an
    AI problem worked to solve another problem very similar to your own, this solution
    will also work on your problem. For example, you may be building an e-commerce
    store and find an implementation of a recommender system built on another store
    that has worked well. However, the reality is that the underlying distribution
    of the data used to train these models is different. Therefore, you will need
    a different solution for your specific problem.


    Consider this example further. On the surface, the data needed to train the recommender
    system is almost identical. There is a group of products with some product metadata.
    Next, there are the users, each with their own characteristics. Lastly, there’s
    a set of interactions between users and the products. Even so, the same implementation
    of a recommender system works for one website but not for another. How can this
    be?


    There could be many explanations for this phenomenon, but ultimately it comes
    down to the fact that the distributions generating this data are not the same.
    In layman’s terms, people on one website could be completely different from those
    on the other website, with various purchasing behaviors and motivations. One model
    might be great at accurately representing the population’s behavior on one website
    but be bad for the other website. Sometimes you may get lucky, and a slightly
    different set of the model hyperparameters could be enough to solve your specific
    problem. Other times, you might need to look for an entirely different algorithm
    to solve your problem.


    *Hard to Measure Progress.* Even as an experienced data scientist, it can sometimes
    be very hard to fully understand why a model isn’t performing well. Typically
    a fair amount of manual inspection is required to figure out why some training
    examples are being predicted inaccurately, which could even mean looking example
    by example at what features may be confusing the model. This reality means that
    it is even harder to determine what changes will lead to any significant improvements
    in performance.


    It is possible to struggle for weeks as you run several experiments and tune certain
    model parameters that result in only a 1 to 2 percent improvement in the model.
    Until you suddenly discover a new input feature that improves the model by 10
    to 20 percent! Progress in an AI project is very chronologically nonlinear, and
    it can be challenging at the beginning of a project to know when you’ll make that
    breakthrough that will make your model viable to deploy.


    I have witnessed many projects where, for weeks, it felt like that breakthrough
    was coming, to no avail. When is it the time to decide that enough effort has
    been expended on one solution hypothesis? There are many possible rabbit holes
    to go down for any solution, making this question very difficult to answer. The
    “definition of done” is certainly not clear for an ML project, as your team may
    feel that the extra performance can be obtained. But at what cost? It is imperative
    to come back to business value to determine whether pursuing that extra model
    performance will deliver any benefit.


    *Principles for Agile AI Development.* While the previous section describes the
    difficulties of estimating and delivering an AI project relative to a software
    project, there are some tactics that organizations can implement to give themselves
    a leg up when it comes to becoming an AI-powered organization ([Table 3.2](#Chapter03.xhtml#tab3.2)).


    *Data Science Processes.* There are many different ways to implement a data science
    project. This has led to the creation of some processes that formalize some of
    the steps required. In this section, we will explore some of these processes.


    ***Table 3.2 Agile AI development***


    | ***Define your company’s mission and nearterm strategy*** || This topic was
    covered extensively in the first section of the chapter, but it is so important
    that it should be included here again. Not only should you take the time to define
    this, but once you have it, make sure that the ML applications that you work on
    directly impact your north star metrics. |


    | --- | --- |


    | ***Follow the data science hierarchy of needs*** || The data science hierarchy
    of needs (Rogati 2017) places AI at the top of the pyramid (think self-actualization
    if you are familiar with Maslow’s hierarchy of needs). Before you can effectively
    build AI into your organization, crucial aspects need to be developed, such as
    data collection mechanisms and the ability to run data analytics on your connected
    data. [Figure 3.1](#Chapter03.xhtml#fig3.1) shows the full data science hierarchy
    of needs that you should follow as a path toward building an AI-driven organization.
    |


    | ***Build data labeling into your product*** || Building labeled data sets for
    ML applications is expensive, particularly when you must outsource the labeling
    to external services. If you can build a mechanism in your product that encourages
    users to label data (e.g., categorizing a transaction in your banking app), you
    will organically build a large enough dataset to train an ML model. |


    | ***Make your first AI project a simple one*** || Andrew Ng, the cofounder of
    Coursera and [Landing.ai](http://Landing.ai), preaches this tactic in his playbook
    to usher organizations into the world of AI. There are many direct and indirect
    benefits of working on a simple AI project first, but mainly it (a) delivers immediate
    value to the organization, (b) secures buy-in from stakeholders that AI is a valuable
    area to invest in, and (c) delivers a successful project will boost team morale
    and have knock-on effects for future projects. |


    | ***Make sure the problem is very well defined*** || The more precisely you can
    describe the problem you’re trying to solve, the more you can narrow down approaches
    that may solve the problem. Consider what edge cases your algorithm might face
    and how it should approach those. It really helps to try to solve the problem
    manually first, as a team, so you have a few examples to base your discussion
    on and start to exclude or include potential solution approaches. |'
