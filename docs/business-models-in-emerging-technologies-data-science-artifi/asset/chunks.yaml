- raw: 'For example, if a bank sends money from a client account to another account
    at a different bank, both the sending and the receiving bank must verify that
    the transfer was valid. They must also check that the funds were not only sent
    correctly but also appropriately received.


    To make sure that the money in one account is reduced by the right amount while
    the money in the receiving account is increased correctly means both banks have
    to conduct multiple checks. Basically, they need to make sure the money wasn’t
    magically created and that it doesn’t vanish into thin air. Another issue is that
    some of the checks are manual, making the whole process incredibly time-consuming.


    With Corda, this reconciliation could be completely eliminated because a transaction
    can only be committed when all the parties confirm that the inputs and outputs
    are correct. The transaction won’t go through if someone is not in agreement.


    ***Nonfungible Tokens (NFTs)***


    A nonfungible token or NFT is an irreplaceable crypto asset, making it unique,
    and it is a representation of a digital or nondigital asset. Some of the underlying
    assets can be:


    • Collectibles


    • GIFs


    • Music


    • Animation


    • Video


    • Signatures


    • Car deed


    • Legal documents


    Conversely, Bitcoin is fungible, which means you can trade one Bitcoin for another
    and still have the same thing.


    What makes NFTs so popular is that only one person can own them at a time. Ownership
    is determined by a unique ID and other data, while ownership and transfer are
    managed via smart contracts. So, you can prove ownership that is authenticated
    by a digital token on the blockchain.


    Many creators are taking advantage of NFTs because they allow other people to
    invest in them. They’re also used as a speculative asset, with people buying NFTs
    to hold on to until their value increases.


    Ethereum was the first blockchain to support NFTs. It has a system called ERC-721,
    which allows for the creation of unique tokens on the Ethereum blockchain. Since
    then, many other blockchains have come to support NFTs like Solana and Tezos.


    ***Decentralized Finance***


    Decentralized finance is a new form of finance that is emerging in the world.
    It is a type of financial system that does not rely on centralized authorities
    to manage transactions.


    Some well-known examples are shown below.


    Uniswap


    Launched in 2018, Uniswap is a cryptocurrency exchange based on the Ethereum blockchain.
    It is a decentralized cryptocurrency exchange, making it different from the more
    mainstream exchanges that exist such as Binance and Coinbase. These are examples
    of centralized exchanges, so there is a single entity or company that operates
    and controls the exchange.


    With Uniswap, there is no central controlling authority. This means the buying
    and selling of cryptocurrencies like Bitcoin takes place on a blockchain using
    smart contracts.


    Curve Finance


    Curve Finance is another decentralized exchange running on the Ethereum blockchain.
    The main difference between Curve Finance and Uniswap is that Curve Finance specifically
    focuses on stablecoins. Stablecoins are still cryptocurrencies, but their price
    is linked to another financial instrument, such as a mainstream currency, another
    cryptocurrency, or a commodity.


    Many people also use Curve Finance to swap tokens to something different that
    has a similar price. Curve Finance is used for this because of its favorable pricing
    formula.


    Yearn Finance


    Yearn Finance is a suite of tools that people use to optimize their crypto assets
    and maximize their returns. The tools primarily facilitate trading and lending
    and, as the platform is decentralized, they remove the need for an intermediary.


    AAVE


    AAVE is a decentralized finance platform that allows users to lend and borrow
    cryptocurrencies. As it is decentralized, there are no intermediaries involved
    in the lending or borrowing process.


    Borrowers on AAVE must first allocate collateral to the platform. They can then
    only borrow up to the amount that they have on AAVE. Those lending on AAVE earn
    interest, plus they are fully in control of how much they lend.


    ***The Metaverse***


    The metaverse is what people are calling the Internet of the future that will
    consist of virtual worlds connected to each other. These virtual worlds will allow
    users to connect to them using augmented or virtual reality interfaces and share
    experiences with others. They will allow for a much greater level of immersion.


    And blockchains will be a crucial component of the success of the metaverse. They
    will allow for things such as virtual currencies, game creation, and play, NFTs
    that will allow people to own items in the virtual world, and much more.


    More importantly, blockchain will ensure that all the data in the metaverse is
    secure and protected. When you consider that the goal is for people to live part
    of their lives in this virtual world, protecting people’s information will be
    more important than ever.


    Some popular metaverse projects are the following:


    Decentraland


    Decentraland has been in development since 2015, but it only became publicly available
    in 2020. It is essentially a virtual world that users can access through their
    browser. Users can make purchases, such as buying plots of virtual land, with
    the transactions being processed either through NFTs (which represent the plots
    of land) or the MANA cryptocurrency.


    The platform is built on Ethereum and although largely currently considered a
    game, the team behind Decentraland have a vision of it becoming a globally used
    virtual world.


    Axie Infinity


    Axie Infinity is a game developed by a Vietnamese software company. It is Ethereum-based,
    where players mint and collect NFTs. In February 2022, the game had generated
    more than U.S. $4 billion in NFT sales.


    The game centers on Axies. These are creatures that players of Axie Infinity collect
    as pets. Players can breed, raise, and battle their Axies, with the aim being
    to collect as many as possible. Players can also use the in-game NFTs to purchase
    a range of other items to expand their collection of Axies and progress through
    the game. This includes virtual land. In November 2021, a plot of virtual land
    on Axie Infinity was sold for U.S. $2.3 million.


    The game is popular in the Philippines, where players often group together and
    where some use the game as their main source of income.


    Sandbox


    Sandbox brings together multiple technologies on a single gaming platform, including
    blockchain, NFTs, DeFi, and the metaverse. In essence, it is a virtual world where
    players create or customize a range of different elements, from games within the
    main game to digital assets such as land, equipment, or fighting behaviors.


    Players can then monetize whatever they create by turning them into NFTs and offering
    them for sale on the in-game marketplace. The cryptocurrencies used to facilitate
    these transactions is SAND, a cryptocurrency that is native to the game.


    As with many other platforms and projects in the metaverse space, Sandbox is Ethereum
    based and is designed to be used by anyone, including people who don’t have technical
    skills.


    Star Atlas


    Star Atlas is another game in the metaverse, although this one is set in space
    and in the future. It is a strategy game, but it doesn’t use Ethereum. Instead,
    it uses the Solana blockchain. In terms of gameplay, however, it is similar to
    other offerings on the market, as players primarily create, customize, collect,
    and trade various in-game elements as NFTs.


    The goal of the game is to discover new planets as you travel through space, finding
    the treasures that those planets hold. Players can take on various roles, such
    as an engineer or aviator, with the gameplay including elements of fighting, crafting,
    and farming.


    One of the things that makes Star Atlas stand out from some other metaverse projects
    is how realistic the graphics look. One of the ways it achieves this is by using
    the Unreal Engine.


    Key Takeaways'
