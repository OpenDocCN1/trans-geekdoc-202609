- raw: 'A data scientist requires math and statistics knowledge to analyze data and
    extract insights. Without this knowledge, they don’t know what methods or models
    to apply, so even if they’ve gotten the data into usable shape with their hacking
    skills, they can’t move further than that.


    While a PhD in statistics isn’t required for a data scientist to be effective
    at what they do, they do need to be aware of how to develop and work with mathematical
    and statistical models. They must also be able to interpret the results.


    ***Substantive Expertise***


    Substantive expertise refers to the fact that a data scientist must have knowledge
    of a particular field. In other words, they need to understand the subject matter
    and not just the technical side of things. This way, the data scientist can apply
    their other skills to the data so that they can achieve their objective. Essentially,
    this means that you want a data scientist in health care, for example, to have
    some health care experience and expertise. While this is not a prerequisite per
    se (data science tools can be applied to any problem), a data scientist should,
    at least, be willing to acquire the necessary domain knowledge when entering a
    new field.


    ***All Three Skillsets Are Necessary***


    Only having two of these skills is not enough. For example, an excellent code
    hacker who knows math and statistics but has no substantive expertise might be
    great for ML, but it doesn’t make them a data scientist.


    Someone with substantive expertise and knowledge of math and statistics might
    be great for research, but they will not be a data scientist. Academia is mainly
    made up of people with these two skillsets.


    The biggest problem starts when you have a person who is excellent with computers
    and has substantive expertise. It can actually make them dangerous. They know
    just enough to put together what looks like a legitimate analysis, but they don’t
    understand how they reached their conclusions.


    They have the skills to apply analytics to a problem. However, they don’t have
    the theoretical foundation to ensure that they are doing the right thing. So,
    they might run a statistical test but could be using mistaken assumptions.


    So, a competent data scientist needs to have all three skill sets, namely hacking,
    math and science knowledge, and substantive expertise.


    What Motivates a Data Scientist?


    If you want to manage data scientists effectively, you need to understand what
    motivates them. While each individual will have different motivations, data scientists
    share a variety of traits that can make them difficult to understand for people.
    This is because they have so many skills that it is difficult to put them in a
    particular box.


    A data scientist isn’t just a geek who knows math and statistics and can make
    computers sing. They also have outstanding communication and visualization skills,
    which means they can communicate effectively not only with senior management but
    also with clients and other stakeholders. It also makes some great storytellers,
    which can be vital in a business setting.


    Data scientists are also curious about data and passionate about the business.
    They constantly want to improve and learn more, and while they might want to solve
    problems and influence things, they don’t want authority. They tend to be strategic,
    proactive, creative, and innovative people who like to work with others.


    Many of them need to be mentally stimulated, and solving problems is simply what
    they do. They are innately curious and are driven to grow, which often means that
    they love learning new things and expanding their skills.


    So, when you think of what motivates a data scientist, you need to think beyond
    a paycheck. While a data scientist might come on board for great pay, they might
    not stay on board if they aren’t being challenged or if they feel their work isn’t
    being utilized effectively.


    If you put your data scientist in a position in which they are doing a lot of
    repetitive work, their level of engagement will plummet, and you’ll find them
    with one foot out the door.


    In other words, if they have to spend inordinate amounts of time cleaning up data
    or performing any other task that is as exciting as watching paint dry, you are
    going to end up with someone who wants to leave your employment as quickly as
    they can.


    Another concern is mental engagement. What we mean by this is if you ask them
    to solve problems that are simple and pose no challenge, they aren’t going to
    appreciate it. That doesn’t mean that you will always be able to provide them
    with challenges and that simple problems don’t have to be solved. At the same
    time, though, consider that if you are hiring a data scientist, you should capitalize
    on their skill set.


    After all, you wouldn’t hire a rocket scientist to perform preventative maintenance
    on an airplane, would you? While he’d be fully capable of doing it, the concern
    is that, out of boredom, the rocket scientist will turn your plane into a spaceship.


    Essentially, a rocket scientist will perform the preventative maintenance if required,
    but he won’t do as good a job as he could for the simple reason that he’s completely
    bored.


    Hiring Data Scientists: What Does a Data Scientist Want?


    There is a shortage of data scientists, but the demand is exceedingly high. Essentially,
    this high demand means that data scientists are in a position of power and can
    choose what projects to work on.


    As an example, a somewhat decent data scientist working in London will be contacted
    by between 1 and 10 recruitment agents every week. So, to improve the odds of
    you hiring the right person, you need to be aware of what to offer them.


    So, what does a data scientist want?


    ***Good Compensation***


    The first thing you need to look at, of course, is compensation. Data scientists
    not only need money to live, like any human, but they also want to know that they
    are appreciated and are being compensated appropriately.


    ***The Team***


    Some data scientists are more social than others and prefer working in teams where
    they are on the same wavelength as everybody else. This often means that they
    flourish in less formal cultures, though they might sometimes do better working
    from home. When someone has to spend lots of time thinking, a quiet environment
    at home might be more beneficial than an office space.


    While you can’t exactly change your entire company culture for one person, you
    can consider this preference and try to make some allowances to foster a better
    working relationship.


    ***Types of Challenges***


    Data scientists thrive on challenge, though the type of challenge and/or problem
    they are dealing with also matters. For example, some might prefer a particular
    field, such as health care or environmental issues, while others might prefer
    working on problems that affect society.


    Another bias they might have could be related to the type of problem. For example,
    some data scientists prefer working on problems that encompass text data.


    However, while these are just surface concerns, if you dig down, you often find
    that the key is that data scientists like to do and learn new things all the time.


    ***The Technology Stack***


    The type of technology used will also play an important role because some data
    scientists will prefer working with systems they are already familiar with, while
    others want to give something new a go. One general trait that most data scientists
    share is that they don’t want to work with legacy code and old technology.


    While this will involve you talking to the data scientist in question, keep in
    mind that many of these people often like to learn new technologies. This could
    be simply because they want to better themselves, or because they enjoy the challenge,
    or because they want to earn better pay.'
