- raw: 'The lesson here is that putting some careful consideration into your data
    and systems architecture early on can pay great dividends in the future. There
    are countless stories of organizations spending millions of dollars trying to
    fix data silos and merging data from countless sources to get a single version
    of the truth. Not to mention the potential sum in lost opportunities because of
    how difficult it was to quickly prototype and test new ideas.


    The business case for putting some serious thought into the data architecture
    is irrefutable. However, in reality, there is a fine balancing act between spending
    endless hours designing the perfect architecture and implementing your best idea
    at the moment to move quickly.


    If one follows the thinking of agile methodology, one can only make decisions
    under existing knowledge, and any assumption about what the future holds is just
    that, an assumption. Therefore, don’t obsess over the perfect architecture, especially
    if there is still a lack of clarity around the product’s future. Instead, it’s
    more important to move quickly, test your assumptions, and keep iterating toward
    product-market fit.


    ***Data Governance***


    Managing data across the organization is more than a technical or infrastructure
    challenge. It also relies heavily on the kind of *governance* a company puts in
    place to ensure that data is traceable, clearly defined, and accessible to only
    the people who need it. As with data architecture discussed previously, the scale
    of a data governance program should be proportional to the scale of data a business
    holds, meaning don’t weigh down the business with too much process early on.


    A good place to start on data governance early is building a companywide data
    dictionary. A data dictionary is a living document where all the raw and derived
    data that exists in an organization should be defined clearly. For any derived
    data, there should be an explanation of the original source of the data and any
    transformations applied to it. Building a data dictionary should highlight any
    areas of confusion or misunderstanding about the data and serve to align everyone
    in the company on where to search for data to create reports or metrics. It is
    also recommended to assign someone responsible for each data source. Those people
    can be contacted if any issues arise with the data or if people have questions
    or concerns.


    Another crucial aspect of data governance is the processes required by law under
    regulations such as the General Data Protection Regulation (GDPR) or the California
    Consumer Privacy Act (CCPA). Again, a data dictionary will help massively in identifying
    what kind of personal data you hold about users and you can record the answers
    to questions such as:


    • Why is this personal data necessary?


    • How long is this data archived for after a user becomes inactive?


    • What third-party software are we sharing this data with?


    ***Managing an AI Project***


    The field of product management for software has been rising in popularity throughout
    the 20th and 21st centuries, as academics and entrepreneurs have been designing
    new approaches to manage the complexity of software projects. Most notably, this
    has led to the explosion of agile methodology, making it the go-to methodology
    for delivering products that users love.


    While software development has had decades to learn and mature, AI product development
    is still in its infancy. As a result, AI product development presents new challenges
    not seen in software development: there are more unknowns, outcomes are nondeterministic,
    and there has been an influx of new tools, infrastructure, and processes to support
    AI development that people have to become familiar with.


    However, perhaps most impactful is that AI shifts the concept of engineering from
    a deterministic process to a probabilistic one. With all these challenges in mind,
    one would think that the process to approach AI projects would need to differ
    from software. However, the reality is that most companies we’ve interacted with
    that are working on AI projects tend to shoehorn typical agile software methodology
    to fit with these new kinds of projects.


    In this section, we will explore in further detail why AI projects differ from
    software projects, and how product management practices should shift to deal with
    this shifting paradigm.


    Why Are AI Projects Different to Software Projects?


    As mentioned previously, the difference can be described at a high level by the
    fact that AI development is much more of a probabilistic process than a deterministic
    one. The following four areas describe in more detail how these projects differ
    and will help to clarify this concept some more:


    *Unpredictability.* In traditional software projects, one can think of an overall
    project simplistically as a composition of functions where each function takes
    an input, applies some heuristics and processing to that input. As a result, the
    function returns an output.


    When all these small unit functions are put together, one can create all sorts
    of wonderful applications. Since each function has been coded explicitly, it is
    simple enough to understand the behavior of each function by looking at what each
    line of code is doing. Doing so can help you understand not just typical test
    cases but also any edge cases that might cause the function to break. For example,
    if a function applies the logarithmic function to a set of inputs, any negative
    input will break it, so one can write some logic to reject any negative inputs.


    If we continue this analogy in trying to explain the world of AI, one can think
    of AI as an approach to solving problems where we have pairs of input and output
    examples, and we’re training a model to **replicate the function that converts
    the inputs into the outputs**. A simple case would be, if we had the pairs (1,
    1), (2, 4), (3, 9), (7, 49), and (8, 64), then we would want our model to learn
    that the function is *y = x*².


    In reality, the examples of input, output pairs that we work with represent much
    more complicated functions than this, which makes ML such a valuable tool in the
    toolkit. Now, say we’ve built a model, and we wanted to understand the behavior
    of the resulting function like was explained in the software project. We can no
    longer examine each line of code to understand what the function is doing since
    the model built is represented by some learned parameters that mix with the input
    in some mathematical formula.


    This makes it much harder to understand the failure points of the function or
    model because it is more unclear how a model would behave with unseen inputs.
    This is particularly difficult with the recent rise in deep learning, as deep
    learning models are much more of a black-box approach than more simple ML approaches.
    Since the inner workings of the functions are hard to analyze and understand,
    it becomes much harder to understand and verify edge cases, as well as understand
    in what cases the model is likely to fail.


    Another consequence of models learning the functions from input and output pairs
    is that ML models are never 100 percent correct (although they can come pretty
    close in some types of tasks). This means that organizations need to understand
    how to manage cases where models predict outputs incorrectly. In some cases, such
    as recommending new songs, the cost of a bad recommendation is not so high. However,
    in more serious applications, such as the automatic detection of cancer, a wrong
    prediction can have drastic consequences, so processes need to be put in place
    to deal with this.'
