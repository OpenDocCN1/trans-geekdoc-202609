    ## 模型退化


    机器学习模型被称为“模型”，是因为它们最终都在试图准确地表征现实世界中发生的某些行为。例如，一个旨在预测每天能售出多少冰淇淋的模型，将对整个人群的冰淇淋需求行为进行建模。假设将某天的温度作为输入，以模拟温度对冰淇淋销量的影响。模型可能会发现温度与冰淇淋销量之间存在正相关关系，并且销量可能会预测得相对准确。


    我们都知道，我们居住的世界极其复杂，行为会随着时间而改变。这意味着，任何在历史数据上训练的模型都会随着世界的变化和对新情况的适应变得越来越过时。在我们的冰淇淋模型中，随着时间的推移，人们可能会意识到冰淇淋因为含糖量而不健康，导致冰淇淋销量随时间推移略有下降。我们的模型将无法准确代表真实世界，因为与一年前温度相同的今天，销量会更少。这意味着我们的模型需要被`retrained`（重新训练）以捕捉行为的变化。


    这种现象在机器学习的所有领域非常常见，导致模型需要定期重新训练，以防止准确性随时间退化。现实世界上更具代表性的例子是欺诈检测，犯罪分子一直在发明新方法来欺骗机构；因此，模型需要适应以能够检测这些新类型的欺诈。这种现实意味着模型永远没有其“最终状态”，这为
    AI 项目增加了另一层复杂性。


    ## 难以预测


    人们可能倾向于认为，因为某个 AI 问题的解决方案解决了另一个与你的问题非常相似的问题，那么这个解决方案也适用于你的问题。例如，你可能正在建立一个电子商务商店，并发现基于另一个商店构建的推荐系统效果良好。然而，现实情况是，训练这些模型所使用的底层数据分布是不同的。因此，你针对自己的特定问题需要不同的解决方案。


    进一步考虑这个例子。从表面上看，训练推荐系统所需的数据几乎是相同的。有一组产品，带有一些产品元数据。接下来是用户，每个人都有自己的特征。最后，是一组用户与产品之间的交互作用。尽管如此，同一个推荐系统实现对一个网站有效，但对另一个网站却无效。这怎么可能呢？


    这种现象可能有许多解释，但归根结底是因为产生这些数据的分布是不相同的。通俗地说，一个网站上的人可能与另一个网站的人完全不同，具有各种购买行为和动机。一个模型可能非常擅长准确表征一个网站上的人的行为，但对另一个网站却很糟糕。有时你可能会走运，一组略有不同的模型超参数可能足够解决你的特定问题。在其他时候，你可能需要寻找完全不同的算法来解决你的问题。


    ## 难以衡量进展


    即使是一个经验丰富的数据科学家，有时也很难完全理解为什么模型性能不佳。通常，需要大量的手动检查来找出为什么某些训练示例的预测不准确，这可能意味着要逐个示例地查看哪些特征可能会误导模型。这种现实意味着，要确定哪些变化会导致性能的显著提高变得更加困难。


    你可能会挣扎几周，运行多次实验并调整某些模型参数，结果模型性能只提升了 1% 到 2%。直到某一天，你突然发现了一个新的输入特征，它能让模型提升了 10%
    到 20%！AI 项目的进展在时间维度上是非常是非线性的，在项目开始时，知道何时能取得那个让你的模型具有部署价值的突破是具有挑战性的。


    我见证过许多项目，在几周时间里，感觉突破快要来了，但最终无果而。什么时候是时候对一个方案假设投入了足够精力了？任何解决方案都有许多可能掉进去的“兔子洞”（rabbit
    holes），使得这个问题很难回答。对于 ML 项目来说，“完成的定义（definition of done）”显然并不清晰，因为你的团队可能认为还可以获得额外的性能。但代价是什么呢？必须回归业务价值，以确定追求额外的模型性能是否会带来任何收益。


    ## 敏捷 AI 开发原则


    虽然上一节描述了 AI 相较于软件项目在估算和交付方面的困难，但组织可以实施一些策略，以便在成为 AI 驱动型组织的过程中占据优势（参见`表 3.2`）。


    ## 数据科学流程


    实现一个数据科学项目有有许多不同的方法。这导致了一些格式化所需步骤的产生。在本节中，我们将探索其中的一些流程。


    ***表 3.2 敏捷 AI 开发***


    | 定义公司的使命和近期战略 | 这一主题在章节的第一部分已经详细讨论过，但因为它如此重要，在这里再次包含。你不仅应该花时间定义它，而且一旦定义，要确保你所做的
    ML 应用直接影响你的极星指标。 |

    | :--- | :--- |

    | 遵循数据科学需求层次 | 数据科学需求层次（Rogati 2017）将 AI 放在金字塔的顶部（如果你熟悉马斯洛需求层次，可以类比）。在将 AI 构建到组织中之前，需要开发关键方面，例如数据收集机制和对连接数据运行分析的能力。`图
    3.1` 显示了你在构建 AI 驱动组织过程中应该遵循完整数据科学需求。 |

    | 将数据标注构建到产品中 | 为 ML 应用构建标记数据集是昂贵的，特别是外包。如果你可以在产品中构建一种鼓励用户标注数据的机制（例如在你的银行应用程序中对交易进行分类），你就能有机地建立一个足够训练
    ML 模型的数据集。 |

    | 让你的第一个 AI 项目尽可能简单 | Coursera 和 `Landing.ai` 的创始人吴恩达在他引导组织进入 AI 世界的蓝书中推崇这一策略。首先研究简单的
    AI 项目有很多直接和间接的好处，但最重要的是 (a) 为组织提供了即时价值，(b) 获得了利益相关对 AI 是值得投资的领域的认可，(c) 完成一个成功的项目将提振士气，并对未来的项目产生连锁反应。
    |

    | 确保问题定义得非常清晰 | 你越精确地描述你试图解决的问题，就越能缩小可能解决问题的方法范围。考虑你的算法可能会遇到哪些边界情况以及它应该如何处理这些情况。首先让团队尝试手动解决问题非常有帮助，这样你就有了一些示例作为讨论的基础，并开始排除或包含潜在的解决方案方法。
    |


