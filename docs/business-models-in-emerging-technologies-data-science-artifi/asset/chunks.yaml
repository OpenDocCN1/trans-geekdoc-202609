- raw: 'Therefore, these two technologies are what a decision maker really needs to
    know about right now.


    We’ll also be looking at why businesses need to adopt these technologies to remain
    competitive. After all, history proves that lagging in tech adoption will only
    lead to obscurity.


    Key Takeaways


    • The term “emerging technologies” refers to a group of technological advancements
    that have come to define industry 4.0.


    • The key technologies of this revolution are: AI/data science and blockchain.


    [CHAPTER 2](#Contents.xhtml#ch2)


    [An Introduction to Data Science/AI for the Nontechnical Person](#Contents.xhtml#ch2)


    In this chapter we will delve deeper into data science, and discuss what it is,
    and why it’s useful. We will cover the brief history of data science and take
    a look at the core fields that compose it. The aim of this chapter is to give
    to the nontechnical reader a good brief overview of that area and understand where
    it can be applied and why.


    Data science is made up of multiple disciplines. So, to get a good grasp of what
    data science is, we need to look at the core disciplines that make up this field
    of study. First, though, let’s take a quick look at how it all started.


    Brief History of Data Science


    Though data science became more popular with the increase of data generation,
    it has been around for a while. Many look to John Tukey as one of the people who
    pushed the boundaries of statistics and gave birth to the concept of data analysis
    as a science (Leonhardt 2000).


    Tukey wrote *The Future of Analysis* in 1962, while he was a professor at Princeton
    University and working at Bell Labs to develop statistical methods for computers
    (Tukey 1962).


    In the article, he encouraged academic statisticians to get involved in the entire
    process of data analysis instead of just focusing on statistical theory. He pointed
    out how important it was to distinguish between exploratory and confirmatory data
    analysis, which was the first step to creating the field of data science.


    While others certainly had a significant impact on data science as we know it
    today, Tukey was among the first to advocate for the importance of such a field.
    However, it took some time until the early 2000s for data science to really take
    off. The reason is that the turn of the millennium saw a few trends converging:


    1. The rise of the Internet;


    2. Cheaper storage and computing power;


    3. The rise of cloud computing;


    4. The rise in the volumes of data being generated.


    The convergence of those four trends made data a valuable resource, with some
    calling data the new oil. This incentivized the re-emergence of the field of data
    science as a unifying force into what used to be disparate fields.


    The Core Fields of Data Science


    Taking a closer look at the history of data science means delving into its three
    core fields: AI, ML, and statistics. There are many other trends that have risen
    and fallen over the years: data mining, pattern recognition, cybernetics, and
    more. These terms often describe scientific approaches that tried to recreate
    intelligence inside a machine, or developed techniques to extract insights from
    data. However, the primary fields are AI, ML, and statistics, and we will delve
    into these in more depth over the next few chapters.


    ***A Closer Look at AI***


    AI is exactly what it sounds like. People are trying to get machines to think
    like humans. In more technical terms, this means giving a machine the ability
    to reason logically, self-correct, and learn. Written out as it is, it might sound
    simple. It isn’t. To even come vaguely close to achieving these goals, you need
    a lot of data and a lot of computing power.


    Classic AI came into being in 1956 at Dartmouth College, when five men came together
    who would go on to become the founders and leaders of AI research. They were Allen
    Newell (CMU), Herbert Simon (CMU), John McCarthy (MIT), Marvin Minsky (MIT), and
    Arthur Samuel (IBM) (Russell, Norvig, and Davis 2010; McCorduck 2004).


    It really started, though, with Marvin Minsky, who would become known as the father
    of AI. He wanted to create an intelligent machine, which we would call AI and
    define it as the science of making machines perform tasks that would require intelligence
    if done by men (Whitby 1996).


    To figure out how to achieve such a monumental goal, one must start by understanding
    the human brain, especially intuition, representing our capacity for logical reasoning.


    Logical reasoning refers to the ability to draw logical conclusions based on various
    facts, such as:


    “If all soldiers are in the army, and John is a soldier, then John is in the army.”


    This is a simple conclusion to draw for a human, of course. However, it’s far
    more complicated for a machine to do it. To do so, humans constructed a set of
    rules with which they programmed the computer. Using this rule-based or symbolic
    approach, reasoning algorithms developed the ability to draw these logical conclusions.
    This gave birth to the rise of the “expert systems” market.


    An early example of an expert system is MYCIN. The system was designed to diagnose
    infections and figure out what bacteria was the underlying cause.


    Developed in the 1970s at Stanford University, the system relied on around 600
    rules (Buchanan and Shortliffe 1984). Users would answer a series of questions.
    Based on these answers, the system would come up with a list of which bacteria
    could be the culprits. The results would be sorted in order of probability, along
    with a confidence score and explanations of how the conclusion was reached. The
    system would also recommend a course of treatment.


    At a 69 percent accuracy rate, the system proved to be better at diagnostics than
    inexperienced doctors and on par with some experts (Yu, Victor, Fagan, Wraith,
    Clancey, Scott, Hannigan, Blum, Buchanan, and Cohen 1979).


    The system’s success relied on the fact that it had been fed a significant amount
    of data obtained by interviewing clinicians, diagnosticians, and other health
    care experts, who offered up their experience and expertise. It relied on an IF
    (condition) THEN (conclusion) methodology.


    The system was never used in a clinical setting, though. First, it required a
    lot of computing power and would still take 30 minutes to come up with a diagnosis.
    In a real-world environment, this was far too long.


    Legal and ethical concerns also came up, mainly connected to who would be liable
    if the system made a mistake, either in the diagnosis or the recommended treatment.


    Despite it not being used in the real world, MYCIN still played an important role
    because many other rule-based programs in various fields were developed based
    on it.


    Unfortunately, the development of AI experienced a series of setbacks. Otherwise,
    the field would have been far more advanced. These setbacks are popularly referred
    to as AI winters and are, basically, periods when the world lost interest in AI.


    For example, in 1967, Marvin Minsky was confident that it would take no more than
    a generation to solve the problem of creating AI. However, by 1982, he was no
    longer so confident as he admitted it was one of the most difficult problems science
    had ever faced (Allen 2001).


    The two main AI winters that set everything back were between 1974 and 1980 and
    from 1987 to 1993. The first winter was caused by several events that resulted
    in the belief that AI didn’t have any real-world applications.


    The first of these events was a report written by Sir James Lighthill, who believed
    that AI was a waste of time. He proposed that other sciences could achieve everything
    AI was doing and went on to imply that even the best algorithms set forth by the
    field of AI couldn’t help with any problems in the real world (Lighthill 1973).'
