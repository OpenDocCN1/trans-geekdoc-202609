    The FATF reacted to the request by adopting changes to its Recommendations to
    “explicitly clarify that they apply to financial activities involving virtual
    assets, and also added two new definitions in the Glossary, ‘virtual asset’ (VA)
    and ‘virtual asset service provider’ (VASP),” as explained in the guidance issued
    in 2019.” According to the FATF, a VA is a “digital representation of value that
    can be digitally traded, or transferred, and can be used for payment or investment
    purposes.” This definition is broad enough to allow the future inclusion of new
    technologies. VASPs are essentially defined as legal persons conducting exchange,
    transfer, and safekeeping of VAs.


    # International Standards in Practice


    The FATF Recommendation relating to VAs, in essence, requires VASPs to act like
    a bank. Do you recall all the paperwork you had to do when you opened your bank
    account, and all the efforts your bank put into proving your identity and background?
    Do you know all the information you have to provide to your bank if a sudden and
    unexpected sum appeared on your account?


    This is what crypto exchanges are now obliged to do. I still remember that the
    first time I opened an account with a crypto exchange many years ago, the only
    Know Your Customer (KYC) they performed was asking me to provide an email address.
    Full stop. Those days are gone now. Onboarding a client, for a crypto exchange,
    means a lengthy process of progressively deeper questions and documents that must
    be provided.


    The recommendations also extended the so-called *travel rule* to crypto transactions.
    Providers of virtual assets need to collect and share customer data for transactions
    over a certain threshold (USD/EUR 1,000). The originator’s information “travels”
    together with the transaction to the receiving VASP. According to the FATF Interpretive
    Note to Recommendation 16, the originator and beneficiary information should include
    the following:


    +   - Originator''s name and account number

    +   - Originator''s address, national identity number, date and place of birth

    +   - Beneficiary''s name and account number


    * FATF. (June 2019). Guidance for a risk-based approach to virtual assets and
    virtual asset service providers. https://www.fatf-gafi.org/media/fatf/documents/recommendations/RBA-VA-VASPs.pdf'
