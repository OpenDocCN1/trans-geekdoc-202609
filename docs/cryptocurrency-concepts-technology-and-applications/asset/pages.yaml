    # Option Valuation Methods


    So far, the chapter covered various option strategies that the investor can use
    to benefit based on his or her view on the direction of the cryptocurrency spot
    price (S). Using the right option strategy, based on the view of how the cryptocurrency
    will perform in the future, the investor used two input variables—the exercise
    price (X) and premium (p)—to determine the potential payoff (O), profit (π), and
    holding period return (HPR%) at various cryptocurrencies spot prices (S) by expiration
    day (t) or cryptocurrency spot price at expiration (St). For the call option buyer,
    the payoff is either S – X or 0 if the X > S, and for the put option buyer, the
    payoff is either S – X or 0 if the S > X. To obtain such an option, the investor
    needs to pay a premium (p), representing the upfront money or the bet per cryptocurrency
    and hoping the cryptocurrency spot price by expiration day (St) covers the original
    bet.


    This section of the chapter will focus on various valuation methods to calculate
    the fair premium that the investor should pay to receive such a payoff. The thinking
    and calculations should be very similar to betting on a game of chance. Using
    probability concepts, for example, someone who bets on a coin toss with two outcomes
    has a 50% chance of winning and a 50% chance of losing. In this'
