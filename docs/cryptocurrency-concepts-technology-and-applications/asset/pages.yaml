    the winner will be paid $60 if it turns out to be a 6. The likelihood (probability)
    that on one single throw the die will turn out to be 6 is one in six (1/6), and
    the probability of not getting a 6 is five out of six (5/6). To evaluate what
    a fair bet would be based on these games of chance, the formula starts with the
    following decision tree, shown in Figures 11.12a and 11.12b.


