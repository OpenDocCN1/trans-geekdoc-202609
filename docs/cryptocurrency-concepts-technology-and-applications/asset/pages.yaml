- pgno: 145
  md: '# Chapter 7


    # Following the Virtual Money: Investigating Crypto-Based Money Laundering and
    Confiscating Virtual Assets


    Federico Paesano


    Basel Institute on Governance


    # The Crypto Bombshell


    In June 2011, I attended a cyber-crime conference in Prague to learn about emerging
    trends and techniques employed by money launderers to hide their ill-gotten gains.
    I expected to learn nothing new. As a former financial investigator from Italy,
    I had seen plenty of ingenious money laundering schemes over the years. And in
    my new training role at the Swiss-based Basel Institute on Governance, my colleagues
    and I were working hands-on with law enforcement officers responsible for investigating
    and prosecuting financial crimes in many different countries. What else could
    there be that we hadn’t already seen?


    Then a police officer from the U.S. state of Indiana came on stage and dropped
    a bombshell. Apparently, some criminals had just discovered that they could'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'move money from one country to another, bypassing the financial system, in
    a matter of seconds, completely anonymously.


    “They are using Bitcoin, a form of virtual money,” he said. He was not able to
    really explain what this Bitcoin was. He simply said that it was similar to in-game
    tokens that you buy and sell but have no real value outside the games, with the
    difference that you could cash out in the real world and effectively move money
    to another jurisdiction, completely under the radar of law enforcement. Even then,
    I could sense something new and exciting was happening, both for citizens seeking
    freer access to financial markets and for criminal investigators seeking to trace
    and recover illicit money.


    Fast forward. It is 7 April 2014. A group of investigators from all over the world
    is gathering in a room at the University of Basel. Two FBI officers share how
    they were able to take down the first drug market in the world, Silk Road. This
    was a place that resembled Amazon® or eBay®, but the products on sale were illegal
    goods such as drugs, fake passports, and counterfeited money. The marketplace
    had vendors, their profiles and reputations, listings and ‘product’ reviews.


    Silk Road was attractive because it was perceived to be highly anonymous. Buyers
    could have their favorite drugs sent to their homes through the regular postal
    service. What made it possible to stay anonymous, both for clients and vendors,
    was the fact that all the transactions were performed in Bitcoin. Moreover, the
    service was hidden behind The Onion Router (TOR), an encryption software that
    allows people to visit places like Silk Road without revealing their IP address.
    The two agents described how they were able to track down the identity of the
    creator of Silk Road, locate the servers where the marketplace was hosted, and,
    crucially, to find the private keys to unlock more than 170,000 Bitcoins he had
    amassed.


    The workshop organizers—the Basel Institute on Governance, Interpol and Europol—decided
    to make this ‘group’ permanent and launched the Working Group on Criminal Finances
    and Cryptocurrencies. From this first meeting, in which just one case was shared,
    the topic ballooned in the law enforcement community in the following years. 2021
    saw the Working Group’s 5th Global Conference on Criminal Finances and Cryptocurrencies,
    which was attended by more than 2,000 attendees from law enforcement, academia,
    and the private sector. Numerous cases were discussed and analysed.


    * Federal Bureau of Investigation (25 October 2013). Manhattan U.S. Attorney announces
    seizure of additional $28 million worth of Bitcoins belonging to Ross William
    Ulbricht, alleged owner and operator of “Silk Road” website. https://archives.fbi.gov/archives/newyork/press-releases/2013/manhattan-u.s.-attorney-announces-seizure-of-additional-28-million-worth-of-bitcoins-belonging-to-ross-william-ulkbricht-alleged-owner-and-operator-of-silk-road-website'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'This story describes very well how cryptocurrencies have evolved in the last
    12 years from an obscure phenomenon known to a few to a global payment method
    used by millions of people. Obviously, criminals are among those using them, but
    the unlawful use of cryptocurrencies accounts for only a small part of their overall
    use. Illicit activity accounted for just 0.34% of transactions, according to Chainalysis*,
    one of the leading analytic companies in this field.*


    As we have seen in the examples above, until a few years ago there were only a
    few investigators in the world who had encountered cryptocurrencies in the course
    of their work, and even fewer who had actually successfully conducted an investigation
    leading to the confiscation of the assets. In the next sections, we will analyze
    and discuss:


    +   - The problems posed by cryptocurrencies during a criminal or financial investigation

    +   - How the analysis of the blockchain has evolved over time and what information
    is possible nowadays to extract

    +   - The legal framework that has been built in this field

    +   - The investigative techniques that can be adopted by law enforcement

    +   - How criminals and the crypto community are reacting to law enforcement’s
    efforts

    +   - How asset recovery is (or is not) different when it comes to cryptocurrencies


    # See No Evil, Hear No Evil, Investigate No Evil


    # Moving Under the Radar


    “Criminals are not using cryptocurrencies in this country.” I can’t even remember
    how many times I’ve heard those words while sitting with investigators and prosecutors.
    When I prepare for a crypto-related training program for law enforcement, I usually
    travel in advance to the country where the training will be conducted to learn
    about the local judicial system. And that answer always puzzles me. Is it the
    only place in the world where criminals have decided to completely neglect this
    new opportunity to move their proceeds undisturbed? Digging deeper, it always
    becomes clear that most probably the truth is that they have probably encountered
    cryptocurrencies in their investigations, but'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'they failed to detect them. According to research by Chainalysis,* almost no
    country in the world has been left untouched by the wave of adoption that occurred
    in the last few years. And there is no reason to believe that, in a place where
    ordinary people are using new technologies, criminals are not doing the same.
    Quite the opposite: criminals are always the first to take advantage of new techniques,
    leveraging the so-called *legislative gap*. This refers to the time it takes for
    law enforcement to understand a new threat and develop countermeasures and for
    legislators to empower them with the appropriate legal framework.


    What is preventing law enforcement from investigating cryptocurrencies successfully?
    Mainly two things: On the one hand, we have to acknowledge that it is a completely
    new phenomenon, and some investigators still lack basic IT understanding. It is
    not surprising that many are scared that they will never be able to catch up and
    understand something so innovative. On the other hand, many are still convinced
    that in order to investigate and confiscate cryptocurrency, one needs to become
    a cybercrime expert who spends hours and hours behind lines of programming code.
    This is far from the truth. What investigators need is the ability to detect the
    activity. And to detect it, one needs to understand how cryptocurrency works and
    moves.


    # Basic Elements That All Investigators Need to Know


    If I want to use crypto, I will start by getting a *wallet*. This could be a piece
    of software on my phone or laptop, or alternatively a *hardware wallet*, a small
    machine that I connect to my laptop when I need to make a transaction. The wallet
    will create for me two main things. The first is an *address*, an identifier (think
    about it as the equivalent of a bank account number) that I can share with anybody.
    This identifier will be used by whoever wants to send me some money.


    Together with it, the wallet will create the corresponding *private key*, a sort
    of password that I can use to spend any money that I receive to that address.
    The private key must be kept secret, because whoever has access to it can use
    it to spend that money. In fact, the private key would be the ultimate target
    of a crypto investigation, as taking control of the suspect’s private key is what
    allows An address and its private key are mathematically linked. (See Figure 7.1)


    In fact, the private key is nothing but a random number generated by the wallet
    from which the corresponding address is generated through a process called *hashing*.
    Hashing is the process of converting a certain input (in this case a private key)
    into another value, called output or *hash*, using a mathematical'
  merge: -1
  img_proc: true
- pgno: 149
  md: '![](img/f08f3915c6e1afa13e4417a1426bd7c3_149_0.png)


    Figure 7.1 A Bitcoin Address and Its Corresponding Private Key


    algorithm. The generated value is unique and constitutes a *fingerprint* of the
    input. A good hash function is one-way only, meaning that by looking at the output,
    one cannot calculate what the input was. This is the reason why I can share my
    crypto address with anyone, but no one will be able to use it to calculate the
    corresponding private key.


    All transactions performed with a cryptocurrency are permanently stored on a ledger,
    called a *blockchain*. This ledger is replicated on thousands of computers by
    users who decide to be part of the network. All blockchains are publicly available
    and can be navigated using one of the many available blockchain explorers.


    In Figure 7.2 we can see a typical Bitcoin transaction:


    +   1. Transaction''s unique identifier

    +   2. Timestamp

    +   3. Sending address (and the amount sent)

    +   4. Receiving address (and the amount received)

    +   5. Change going back to the sender (and the amount returned)


    One can click on any of the addresses shown and see each and every transaction
    done by the individual address. Blockchain explorers are a powerful tool if correctly
    used. Even if a transaction doesn''t tell anything about its sender and receiver,
    it is permanently stored in the blockchain for possible future deanonymization,
    as we will see later. What is important to notice, however, is that while a cash
    transaction leaves no trace whatsoever, a crypto transaction will leave indelible
    evidence. And this takes us to the analysis of the blockchain.


    ![](img/f08f3915c6e1afa13e4417a1426bd7c3_149_1.png)


    Figure 7.2 A Bitcoin Transaction (Source: blockchain.info, https://www.blockchain.com/btc/tx/ba5ee0ac93ca861d21a9b423d248bafcb24e81a456747cb0958e764dbd014d11)'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Analyzing the Blockchain


    # How Heuristics Help


    The first time I laid my eyes on Silk Road, I was shocked. How could it possibly
    be that all those people are selling drugs online? How is it possible that they
    are able to receive the payments anonymously? In fact, the market relied on the
    use of Bitcoins as the only means of payment because of its perceived anonymity.
    If the only information shown in the blockchain is a meaningless string of numbers
    and letters to represent senders and recipients of transactions, they would be
    left completely in the dark ... or not?


    And then a paper proved that this assumption was completely misleading. In “A
    fistful of bitcoins: Characterizing payments among men with no names” by Sarah
    Meiklejohn and others, the researchers for the first time described how they used
    heuristics to cluster together crypto addresses. Imagine sitting with the bank
    account number of your suspect and having a tool that can immediately disclose
    if this individual has any other bank accounts anywhere in the world, without
    the need of a subpoena or a lengthy mutual legal assistance request. Clustering
    means looking at the blockchain and using some techniques to “cluster together”
    addresses that are likely controlled by the same person. Those techniques include
    multi-input, one-time change address, and optimal change heuristics.


    * Meiklejohn, S., Pomarole, M., Jordan, G., Levchenko, K., McCoy, D., Voelker,
    G. M., and Savage, S. (2013). A fistful of Bitcoins: Characterizing payments among
    men with no names. IMC 2013—Proceedings of the 13th ACM Internet Measurement Conference,
    127–139). https://doi.org/10.1145/2504730.2504747

    † Also known as common-input-ownership heuristic, it assumes that all the inputs
    in a transaction are controlled by the same entity. This heuristic is first mentioned
    in the original Bitcoin paper by Satoshi Nakamoto. However, it is not entirely
    true because multiple parties can co-sign a transaction using special software
    (CoinJoin), which spends inputs controlled by different entities.

    ‡ Since it is difficult to send the exact specified amount of funds to the recipient
    of a transaction, the remainder of the funds are to be returned to the sender
    via change address. This is similar to having to pay 1 USD to someone, and having
    only a 5 USD note available. The payor will get 4 USD back as change. When a transaction
    has two outputs, one of the two is generally the change going back to the sender.
    Therefore, the address receiving the change is controlled by the sender. Several
    techniques can be used to assess which of the outputs constitute the change.

    § The assumption here is that a consumer wallet will not, by design, spend outputs
    unnecessarily. One can therefore assume that the change is the amount which is
    smaller than any of the spent inputs.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'An investigator can use the techniques described above to understand whether
    the address controlled by a suspect is part of a cluster, therefore deanonymizing
    all the addresses that the target controls. In most cases, an investigation will
    start with an identified suspect, and the aim of the investigation is to uncover
    where the proceeds of crime have gone, especially if a money-laundering investigation
    has been initiated.


    However, if the investigators’ target is an unknown or anonymous address, sometimes
    they have to admit defeat and look for help. The most common option is to seek
    the assistance of one of the many blockchain analysis companies which have flourished
    in recent years. They have deeper visibility into the blockchain and can automate
    research that would keep a police officer busy for months, using block explorers
    and open-source intelligence (OSINT).


    # Linking Clusters to the Real World


    Once the clusters are identified and labelled by those companies, the second step
    involves naming those labels. This is done in many different ways, such as web-scraping
    for self-disclosed addresses. It is not uncommon for individuals to claim the
    ownership of an address.


    It used to be common practice in forums related to crypto to include in the signature
    a crypto address in order to receive tips and donations. Many programmers develop
    tools and platforms for free and then seek donations via bitcoin payments.


    Another technique used to deanonymize services (exchanges, providers, custodians)
    is to open an account with them and send a tiny amount of cryptocurrency. The
    receiving address, by definition controlled by the service targeted, will be then
    searched inside an existing cluster; once found, it will deanonymize the entire
    cluster.


    Even when it is not possible to directly deanonymize the target address, one has
    to simply broaden the search. Put yourself in the criminal’s shoes: you have your
    proceeds of crime already in cryptocurrency, or you are using crypto to launder
    your funds. You will eventually want to cash out and lay your hands on fiat currency
    that you can then spend directly or deposit in a bank account. You will probably
    try to obfuscate the origin of your cryptocurrency in some way (more later!),
    but sooner or later you will need to use an exchange to convert your money.


    This is exactly what law enforcement authorities look for—that is, the moment
    criminals are depositing their funds to have them converted. What blockchain analysis
    will try to discover is if the targeted address has interacted with an exchange
    a few hops before or after the transaction you are looking at.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# The Regulation Dilemma


    # How to Harmonize Regulations in a Borderless Industry


    Surprisingly, the popularity of Bitcoin started in June 2011, when two senators
    from the United States’ asked federal authorities to investigate and take down
    the Silk Road drug market. The unexpected consequence was that an unknown technology
    used by only a small group of enthusiasts was “advertised” on the main media outlets,
    and both Bitcoin and Silk Road became popular overnight. Since then, the legal
    framework surrounding cryptocurrencies has evolved, with sudden bursts and frequent
    interruptions, often with conflicting interests from different regulators and
    different jurisdictions.


    The United States led the way: in 2013, FinCEN, the U.S. Financial Intelligence
    Unit, said cryptocurrencies do not “have legal tender status in any jurisdiction.”
    In the same year, instead of trying to regulate the sector, other countries decided
    to ban Bitcoin outright. In December 2013, the Chinese government, with its Notice
    on Guarding Against the Risks of Bitcoin, mandated that all Chinese banks were
    prohibited from accepting Bitcoin payments to and from exchanges. Even if Japan
    was the first country, in 2016, to introduce regulation (probably due to the fact
    that a Japanese crypto exchange, Mt. Gox, lost almost the entire 850,000 bitcoins
    it was holding for customers), most of the regulators around the world still didn’t
    feel the urge to regulate the space.


    The first international effort was put forward in 2018. Following the G20 Leaders’
    Summit, in which the 20 leading economies agreed that cryptocurrencies didn’t
    pose a risk to financial stability, it was requested that the Financial Action
    Task Force‡ (FATF) should further clarify how its anti-money-laundering standards
    apply to virtual assets. Those standards are set out in the so-called FATF Recommendations,
    a framework of measures which countries should implement in order to combat money
