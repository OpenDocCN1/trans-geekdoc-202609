- pgno: 63
  md: '# Chapter 3


    # How Much to Invest,

    If Any, in Bitcoin?


    Anthony L. Loviscek


    Seton Hall University


    # Introduction


    With trust in financial institutions compromised by the turmoil of the global
    financial crisis of 2008–2009, Satoshi Nakamoto, a pseudonym for a person or a
    group, created Bitcoin on January 3, 2009, begetting the cryptocurrency movement.
    A medium of exchange not pegged to any financial intermediary or controlled by
    any organization, it relies on “blockchain” technology that resembles multilateral
    contractual obligations among its cooperative participants. The outcome has been
    a peer-to-peer network of transaction activity that, in turn, has fostered over
    18,000 currently circulating cryptocurrencies. As the most widely used cryptocurrency,
    at 19 million units, Bitcoin comprises over 40% of the market.


    However revolutionary and sustained Bitcoin may be as a currency, one that is
    free from inflationary pressures and monetary stimulus, its stronger draw has
    been as a “store of value,” or as an investment play. For instance, its meteoric
    rise from $0.20 on 264,000 transactions on December 2010 to $42,587 and 37 billion
    transactions by December 2021 has led to a market capitalization cresting at $1.3
    trillion in late 2021, registering an extraordinary compound annual'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'return of 205.1%. Its return is nearly seven times that of the high-performing,
    high-profile stocks of Amazon® and Apple® for the same period, and nearly 14 times
    that of the benchmark S&P 500.* Its high-level performance has led to bullishly
    upbeat forecasts of $100,000 by 2022–2023 (DeMatteo, 2022; Asford and Curry, 2022),
    $500,000 by decade’s end, and up to $1,000,000 in the long term (Kharpal, 2021).


    This outsized higher return, however, has not come without a significant price:
    outsized volatility. For example, closing at $455 in December 2013, Bitcoin leaped
    to $991 by February before plummeting to $263 by March, followed by jumping to
    $564 in July before settling at $303 by December 2014, a one-year volatility of
    123.61%. By comparison, the Vanguard 500 Index, an accurate approximation for
    the S&P 500, registered a volatility of 8.18%, or 93% lower. Even the relatively
    high 24% volatilities each for Apple and Amazon during the period were 80% lower.
    More recently, investors saw a price spring from $29,361 in July 2021 to $68,789
    by November 2021 only to watch it plummet to $26,350 by May 2022. Such volatility
    presents a formidable challenge for accurate return forecasting. Zweig (2022)
    describes it as “get(ting) crypto right but still play(ing) it wrong” when attempting
    to profit from its movements.


    With the classic investment return-to-risk paradigm in focus, these observations
    lead to the following question: to what degree, if any, should Bitcoin be part
    of an asset allocation strategy? This question motivates this study.


    As impressive as Bitcoin''s return performance has been to date, given shares
    traded and gains earned, the price of overlooking the volatility of Bitcoin—or
    any security, for that matter—can be significant: in the case of Bitcoin, the
    high probability of loss, or risk, especially in light of the documented loss-aversion
    effect. Studies show that investors feel a loss in utility associated with negative
    returns that exceeds the gain in satisfaction from positive returns, often leading
    to selling winning positions too early but holding losing positions too long (Kahneman,
    Knetsch, and Thaler 1991; Gal and Rucker 2018; Merkle 2020). Translated, the feeling
    concerning the loss of money can be quite painful. Supporting this point, Glumov
    (2013) shows tolerance toward risk dropped to a record low following the global
    financial crisis of 2007–2009, in which fewer than 10% of individual investors
    surveyed could be classified as having above-average tolerance for risk.


    Although the volatility of Bitcoin and the potential loss-aversion effect weigh
    on its asset allocation, views on a percentage allocation are buoyant, ranging
    from 2%–10% (Kassar 2022; Krueger 2022), with a reported weight of as high


    * During the same period, Amazon and Apple registered annual returns each of approximately
    30%, while the S&P 500 recorded a gain of approximately 16%.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'as 20% (Stankiewicz 2022). An objective assessment of these allocations, however,
    is not apparent. Such an assessment, or gathering of empirical evidence, would
    include, for example, results based on an optimization strategy, such as the minimization
    of risk given an expected rate of return. Without such evidence, investors are
    left with little more than scattered subjective views, which do not inspire confidence.
    Furthermore, recourse to the academic and professional investment literatures
    for cogent and compelling guidance is found largely wanting. The most relevant
    studies look at the diversification potential of cryptocurrencies (e.g., Wu and
    Pandy 2014; Guesmi, Saadi, Abid, and Ftiti 2019; Liu 2019; Li, Jiang, Wei, and
    Wang 2021). Although these studies are constructive in demonstrating the potential
    diversification benefits of cryptocurrencies, they do not offer a prescription
    on the percentage allocation.


    To address the question, this study applies modern portfolio theory to construct
    a series of stock portfolios from the Standard & Poor’s 100—a broad equity market
    index—that also include Bitcoin. The application is based on mean-variance optimization.
    It is unique in at least two respects: First, it uses the model of Black and Litterman
    (1992), well known in applications of portfolio analysis, to construct a series
    of portfolios to determine if an allocation to Bitcoin exists. Second, given the
    results in the first stage, it compares the performance of the portfolios with
    that of Bitcoin alone and with that of a broad market index to determine a percentage
    allocation strategy, if any, that can guide investment decisions in light of the
    varied asset allocation recommendations expressed in the literature.


    The focus is on active individual investors—namely, those who construct portfolios
    with the expectation of market-beating performance. In this study, performance
    is assessed by applying the well-known “reward-to-variability” portfolio performance
    ratio of Sharpe (1994).* Accordingly, the focus is not only on return but also
    on risk, as approximated by the volatility of rates of return. The central issue
    is whether the return-to-risk of Bitcoin is high enough to enhance portfolio performance,
    as displayed in the weight assigned to it. A higher weight signifies the potential
    for a high added value, while a lower weight points to a low added value.


    # ## A Look at the Literature


    Because Bitcoin has only existed since 2009, the literature is still in an early
    stage; however, research is accelerating. Sharma, Jain, Mahendru, and Bansal'
  merge: -1
  img_proc: true
- pgno: 66
  md: '(2019) offer a worthy starting point in their overview of research on Bitcoin
    and cryptocurrencies. They examine 121 articles and find that topics on prices,
    rates of return, volatility, financial indicators, and regulation dominate the
    literature. Although Bitcoin does serve as a (limited) medium of exchange similar
    to conventional currencies, Glaser et al. (2014) conclude that the larger volume
    of Bitcoin use is for speculative investment purposes. This observation, which
    evidence to date continues to support, serves to focus this literature review
    on Bitcoin either as a market-beating asset or as an addition to a portfolio.


    In a seminal paper, Gandal and Halaburda (2014) examine the co-movement of cryptocurrencies
    for the purpose of identifying opportunities for triangular arbitrage, or the
    search for anomalous performance that exceeds that of “the market.” Although they
    find little evidence of arbitrage, they uncover signs that such potential exists.
    Urquhart (2016) employs five different time series tests, concluding that Bitcoin
    is inefficiently priced, which points to profitable opportunities based on historical
    data, a result inconsistent with the concept of an informationally efficient market.
    Nadarajah and Chu (2017), however, counter this conclusion in their findings based
    on a power transformation of Bitcoin returns.


    Still, Hong (2017) finds evidence of time series momentum in Bitcoin trading,
    discovering persistence in prices up to eight weeks before a mean reversion downturn,
    suggesting market inefficiency and thus the opportunity for above-average returns.
    Bariviera (2017) draws the same conclusion, although the move toward efficient
    pricing is apparent over the longer term. Caporale, Gli-Alana, and Plastun (2018)
    uncover evidence of past prices being correlated with future prices, another sign
    of inefficient pricing. Cheah, Mishra, Parhi, and Zhang (2018) find evidence of
    long-term memory in Bitcoin pricing, another outcome that is inconsistent with
    market information efficiency.


    Hattori and Ishida (2020) investigate how investors seek arbitrage in the Bitcoin
    spot and futures markets through the Chicago Board of Exchange. As expected, under
    normal conditions, arbitrage opportunities are difficult to uncover, but not during
    “crashes,” in which large profitable opportunities arise. In addition to Bitcoin’s
    trading behaviors on exchanges, Holub and Johnson (2019) examine bid–ask spreads
    and closing prices on local platforms. They find significant deviations from exchange
    prices, pointing to market inefficiencies and signaling opportunities for abnormal
    returns.


    Using high-frequency data, Nazir and Kumar (2019) come to the same conclusion
    as frequency increases. Vidal-Tomás (2020), however, finds that inefficiency occurs
    only at frequencies of one minute and weekly, concluding that daily data offer
    the most efficient frequency. Beyond the time series tests for market efficiency,
    Hu, Hwang, Jain, and Washam (2020) uncover evidence of price manipulation in Bitcoin
    across 519 million orders, representing additional'
