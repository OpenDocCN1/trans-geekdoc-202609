  md: 'underlying crypto in three key areas: unanimity, parties and vote-trading,
    and special interest groups.


    # ## Public Choice Issue 1: Unanimity


    One of the key questions that emerged within the voting literature is how to handle
    decision rules outside the market where allocations are unlikely to benefit all
    parties. One of the core suggestions that emerges from the public choice literature
    is the implementation of unanimity or near unanimity rules in these situations,
    where all parties agree to the outcome. This way, everyone gets some benefit from
    the decision. However, a unanimity rule makes it harder to reach a final decision,
    as everyone involved must reach the same conclusion.


    Unanimity connotes consensus, or full agreement among a group. In theory, more
    unanimity means more consensus, which means more voters are in agreement. Economic
    analysis emphasizes that individuals make decisions based on their unique interests,
    not necessarily the interests of the group.


    Therefore, consensus is achieved when the final decision coincides with everyone’s
    own interests. Within blockchain, Bitcoin, a decentralized network with no clear
    government, changes its protocols and policies through consensus and through the
    decisions of each individual acting without the necessity of a voting procedure.
    Network participants need to overwhelmingly agree to use a particular process
    for it to become standard practice among the miners.


    # ## Public Choice Issue 2: Parties and Vote-Trading


    Another issue raised by public choice scholars is that the institutional arrangements
    incentivize public officials to vote-trade, especially among party allies, to
    maximize their own interests. Politicians make deals with each other to push their
    political agendas by agreeing to vote for another’s legislation if they will return
    the favor.


    For instance, a politician from Nebraska may vote in favor of wind energy subsidies
    if his peer from South Carolina votes for legislation that subsidizes farm interests.
    They vote in favor of legislation that benefits a different state despite the
    lack of direct positive impacts for their constituents. They engage in vote-trading
