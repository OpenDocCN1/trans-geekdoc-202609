    In addition to the budget maximization model of bureaucratic action, public choice
    scholars also recognize the ability of congressional committees to influence bureaucrats.
    This is known as the congressional dominance model. Public choice scholars observe
    that in many areas of public policy, bureaucrats mirror the opinions of the legislators
    that maintain power or influence over them.


    Both budget maximization and congressional dominance provide public choice scholars
    with key insights with respect to blockchain and cryptocurrency regulation. Following
    the budget maximization model, one can assume the agencies will seek to maximize
