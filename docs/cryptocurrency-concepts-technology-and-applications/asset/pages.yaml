  md: 'monetary policy, smoother cross-border transactions, and more efficient financing

    to support sustainable development goals such as circular economy goals (see,
    for

    example, Taskinsoy 2021; Jossey 2022; Ozili 2022a; Edwards 2021; Ozili 2022d).


    Regarding CBDC design, Taskinsoy (2021) and Sethaput and Innet (2021)

    argue that CBDCs should have the properties of cash or paper money, should

    be implemented using blockchain technology to execute and settle peer-to-peer

    transactions, should be minimally invasive, and the benefits should outweigh

    its cost. However, Edwards (2021) and Soderberg (2022) suggest that a smooth

    rollout of CBDCs in all countries will be difficult, but such difficulty can be

    surmounted through international collaboration and coordination.


    Several recent policy studies in the literature have called for caution in issuing

    a CBDC. For instance, Jossey (2022) points out that CBDCs could become

    a powerful tool that governments can use to exert undue economic and social

    control on the life of citizens, and many central banks are pushing to adopt

    CBDC to seek self-preservation and relevance in the digital age and not necessa-

    rily because CBDC introduces any lasting benefits in the life of citizens.


    Rizk (2022) showed that issuing CBDC may present legal issues, especially

    if central bank laws do not authorize CBDC to be issued to the general popu-

    lation. Taskinsoy (2021) and Ozili (2022a) identified other challenges and risks

    associated with CBDC adoption, such as CBDC design tradeoffs, a possible run

    on bank deposits, data privacy issues, the reduction of private commercial bank

    intermediation, and the decline in the use of ATMs.


    From the review of recent studies above, it can be seen that despite the many

    benefits which CBDC can offer, there are important risks that should be under-

    stood and mitigated for CBDCs to have a lasting positive impact on society.


    # 4.3.2 CBDC Developments in Africa


    A review of publicly available information shows that few African countries have

    shown interest in issuing a CBDC. African countries such as Kenya, Ghana,

    Zimbabwe, Tanzania, Egypt, Morocco, Uganda, and Zambia have indicated

    interest in exploring the issuance of a CBDC. Meanwhile, Nigeria has already

    issued a CBDC. The high level of cryptocurrency activities in Nigeria in 2021

    was a major factor that influenced Nigeria’s central bank to issue a CBDC. The

    central bank of Nigeria barred Nigerian banks from facilitating cryptocurrency

    trading and activities; soon after, the central bank issued a CBDC known as the

    eNaira (Ozili 2022c).


    Other African countries such as Ghana, Mauritius, and South Africa have

    already launched a pilot CBDC project which is presently being tested. Afri-

    can countries that have not reached a decision on whether to issue a CBDC

    include Rwanda, Cameroon, Sao Tome and Principe, and Djibouti. The factors'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'responsible for the low interest in CBDC among African central banks include
    low smartphone penetration, lack of political support for central banks to issue
    a CBDC, the underdeveloped payment system, widespread digital illiteracy, refusal
    of merchants to accept digital payment, and increased cyber-attacks on existing
    technological infrastructure (Ozili 2022a).


    # 4.3.3 CBDC Developments in Europe


    Policy discussions about CBDC in Europe have emerged recently. Existing policy
    discussion about CBDC in Europe show that there are plans to develop a digital
    euro for countries in the European Union. Boonstra (2022) argues that the creation
    of a well-developed digital euro will help to restore the international position
    of the euro, which has been stagnating in the last decade, and the digital euro
    can improve cross-border trade outside the Eurozone.


    Grünewald, Zellweger-Gutknecht, and Geva (2021) show that the European Central
    Bank (ECB) plans to issue a digital euro that will be used by all countries in
    the European Union, and the issuance of digital euro will help EU countries to
    fulfill their monetary policy mandate and role as lender of last resort (Panetta
    2021). The push to issue a digital euro is largely due to the potential threat
    from big tech firms, who are also issuing their own private digital currencies
    to compete with traditional money (Mayer 2019). The ECB''s digital euro will be
    able to track users, which is in stark contrast with cryptocurrencies, which do
    not permit the tracking of users (Mayer 2019).


    European countries outside the European Union, such as the United Kingdom, Turkey,
    Iceland, Albania, Ukraine, and Russia, are also researching and exploring the
    issuance of a CBDC. The purpose of researching and exploring the issuance of a
    CBDC by European countries is to develop advanced knowledge and expertise about
    CBDC to enable European countries to decide the exact use case of CBDC that is
    appropriate for their economies.


    # 4.3.4 CBDC Developments in the Region of the Americas


    Observations from publicly available information show that only the Bahamas and
    the Eastern Caribbean Currency Union have issued a CBDC in this region, while
    other countries in the region are still exploring the possibility of issuing a
    CBDC. The Bahamas issued the Sand Dollar CBDC, primarily to increase financial
    inclusion and to prevent illicit financial flows. The Eastern Caribbean Currency
    Union issued a digital currency to improve the efficiency of payments and to increase
    financial inclusion. These countries have a large number of unbanked adults, and
    there are expectations that the issuance of a CBDC can help financial services
    providers to reach more unbanked adults in these'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'countries. Other countries such as the United States, Mexico, Peru, and Canada
    are still building expertise and knowledge to determine the appropriate and best
    use case of CBDC in their countries, while countries such as Brazil and Jamaica
    have already launched pilot CBDC tests.


    # 4.3.5 CBDC Developments in Asia


    Compared to Europe and Africa, the most advanced CBDC in the world is found in
    Southeast Asia in China, which is the only country in the region that has issued
    an operational CBDC. Wang (2022) showed that China issued a two-tiered CBDC “e-CNY”
    that will become a substitute for cash in circulation and will coexist with physical
    money. However, Wang argued that the sustainability of the e-CNY would be influenced
    by economic, political economy, legal, regulatory, and governance factors in China.


    Didenko and Buckley (2021) argue that even though China leads the way in issuing
    a CBDC in the region, the China CBDC bears some risks, which need to be properly
    understood. They state that now is not the time for countries in the region to
    issue a CBDC; rather, central banks in the region should begin laying the groundwork
    for building specific knowledge and expertise about CBDC. Other Asian countries
    such as India, Cambodia, Singapore, the Philippines, South Korea, the United Arab
    Emirates, and Hong Kong are exploring the case for issuing and operationalizing
    a CBDC.


    # 4.3.6 CBDC Developments in Oceania


    Several policy discussions in the Oceania region point to a general lack of interest
    in issuing a CBDC just yet, and central banks in the Oceania region have argued
    that there is no strong policy case to do so at this time. For instance, central
    bankers in Australia (according to Richards et al. 2020; Emery 2019; and Richards
    2021) argue that there is a weak policy case for issuing a CBDC at the moment.
    This is because Australia’s existing electronic payments system, also known as
    the New Payments Platform (NPP), already provides households and businesses with
    a wide range of safe, fast, convenient, and low-cost payment services, which CBDC
    also promises to offer. Therefore, issuing a CBDC to act as a payments alternative
    in Australia would be an unnecessary duplication of the existing payment systems.


    Meanwhile, in New Zealand, Hawkesby and Wadsworth (2020) assert that the central
    bank (or Reserve Bank) of New Zealand has no plans to issue a CBDC at the moment
    but it will closely monitor global CBDC development to identify the right time
    to do so. Other countries in the region have not shown a strong intention to issue
    a CBDC.'
