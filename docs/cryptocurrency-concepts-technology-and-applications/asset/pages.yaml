- pgno: 219
  md: '# VI. Implications


    We began with the slogan that Bitcoin is digital gold. The slogan isn’t literally
    true, and isn’t intended to be. It’s an analogy or comparison. Is the analogy
    useful? Is it more illuminating than misleading? We’re now in a position to evaluate
    such questions.


    To state the obvious points of disanalogy: Bitcoin is synthetic and digital, whereas
    gold is a naturally occurring physical element. Human beings have used gold as
    a monetary good for thousands of years; Bitcoin is a little more than a decade
    old. Bitcoin and gold do not behave the same in markets, either. Gold’s price
    isn’t _that_ far off today (around $1,800/oz) from where it was 10 years ago (around
    $1,500/oz), and it has traded between $1,000 and $2,000 for the entire interval.


    Bitcoin price, by contrast, has shown _tremendous_ volatility. It traded below
    $20 10 years ago, reached a high of over $69,000 in 2021, and trades around $20,000
    today (Summer 2022), over 75% down from the peak—a point not missed in mainstream
    price coverage.* This volatility limits Bitcoin’s potential as a short-term medium
    of exchange and sets its market reception apart from gold’s, which is tame by
    comparison.


    The points of analogy are perhaps more interesting: like gold and other physical
    commodities, Bitcoin has a non-zero marginal cost of production. No one can mine
    more gold or more Bitcoin without _paying_ (whether by paying to blast through
    rock, as with gold, or for electricity and processor cycles, as with Bitcoin).†
    Bitcoin is finite in both stock and flow: its total supply is capped, and additions
    to that supply in the meantime remain slow and steady. Gold is often thought to
    have similar properties—a finite total supply, with additions via mining of perhaps
    2% per year (though new ore discoveries could change these expectations and shock
    markets accordingly).


    Gold and Bitcoin are, furthermore, censorship resistant in an important sense.
    One can transfer physical gold without relying on mediating authorities: simply
    hand over a gold coin to your counterparty. (However, the point does not apply
    to paper claims for gold.) So, too, can one transfer Bitcoin without relying on
    mediating authorities. Simply sign a transaction and broadcast it to the Bitcoin
    network. These points of similarity reveal something important: Bitcoin is, like
    gold, neutral. Neutral in initial issuance, neutral in ongoing monetary policy,
    neutral in transfer. And this makes Bitcoin special—perhaps unique—among cryptocurrencies.


    In sum: the slogan that Bitcoin is or could be digital gold isn’t just a metaphor,
    and it isn’t mainly about Bitcoin’s market reception. It’s about Bitcoin as


    * https://www.nytimes.com/2022/05/12/technology/cryptocurrencies-crash-bitcoin.html


    † Selgin (2015), accordingly, classifies Bitcoin as a “synthetic commodity” money.'
