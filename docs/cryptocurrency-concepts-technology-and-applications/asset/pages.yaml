  md: '# Chapter 12


    # The Role of Blockchain and Smart Contracts in International Relations


    Stephan Unger* and Hossein Hassani**


    *Saint Anselm College; **University of Tehran


    # 12.1 Introduction


    This chapter deals with the current and potential role of blockchain technology
    in the context of international relations. The development of blockchain technology
    spreads increasingly across various branches and sectors, from IT to financial
    and politics applications. The most important characteristic of this development
    is the implementation of a more efficient and more secure data verification—more
    efficient because it enables a decentralized storage within the network, and more
    secure because the data is secured by the proof of work concept, which is independent
    of a centralized server or entity.


    The utilization of smart contracts enables users to newly set up the network of
    international relations and make it more resilient and secure. Since smart contracts
    allow any logic to be implemented on top of transactions, any type of relationship,'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'agreement, planned course of action, defined goals, organizational searches,
    and constraints can be included in the establishment of a smart contract.


    A smart contract logic may include distributions of budget allocations, negotiations
    of policy changes, implementations of agreements, and mitigation of disputes.
    Since the resolution is automated, potential conflicts could be resolved even
    before they emerge. The basic functions of a smart contract (i.e., to exchange
    money, property rights, securities, or anything else of value) allow one to define
    rules under which they are automatically enforced. Once executed, the outcome
    is stored on a blockchain in an immutable way and can be used not only for recordkeeping
    but also as an input for future optimization (Hines 2021).


    The advantages over a human-centered approach are obvious: the elimination of
    human errors and emotional behavior, faster and safer execution, minimization
    of costs, resolution of conflicts, and the construction of a more resilient system.
    The potential of smart contracts ranges from simple process optimization to the
    resolution of geo-political conflicts.


    Almostall smartcontractor blockchain applications associated with geopolitical
    risk deal with the mitigation of trading risk through hedging, but not the actual
    implementation into the political decision-making process.


    However, Saveiyev (2017) is one of the few researchers to investigate the potential
    implications of smart contracts in contract law. He analyzes legal issues associated
    with the application of existing contract law provisions to so-called smart contracts,
    or “agreements existing in the form of software code implemented on the blockchain
    platform, which ensures the autonomy and self-executive nature of smart contract
    terms based on a predetermined set of factors.” He outlines the peculiarities
    of blockchain technology, as currently implemented in Bitcoin cryptocurrency,
    which forms the core of smart contracts.


    Blockchain has already been tested for geopolitical risk assessment and decision-making.
    Lithopia is a prototype of a fictional blockchain-managed village that uses satellite
    and drone data to trigger smart contracts on the open-source blockchain platform
    Hyperledger®. The project is testing the possibility of anticipatory governance
    of emerging blockchain and distributed ledger technologies (DLTs) by involving
    stakeholders in the design process over templates. The goal is to question the
    promises of blockchain governance happening over automation and smart contracts
    and to offer an alternative to the misuses of emerging technologies in the so-called
    predictive and anticipatory design (Kera et al. 2019).


    Van Bodegraven (2017) highlights the ethical and design issues arising with the
    emergence of anticipatory design and predictive user experiences. Also, Guston
    (2014) dives into the roles of new technology in governance and policy making.
    He elaborates the notion of anticipatory governance, which is “a broad-based capacity
    extended through society that can act on a variety of inputs to manage emerging
    knowledge-based technologies while such management is still possible.” While he'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'mainly applies the concept of anticipatory governance to nano-technology in
    the U.S., his theoretical framework is also relevant to the integration of smart
    contracts and blockchain technology into today’s decision-making processes.


    Wright and De Filippi (2015) explore the benefits and drawbacks of this emerging
    decentralized technology and argue that its widespread deployment will lead to
    expansion of a new subset of law, which they term _Lex Cryptographia_: rules administered
    through self-executing smart contracts and decentralized (autonomous) organizations.


    They argue that as blockchain technology becomes widely adopted, centralized authorities,
    such as governmental agencies and large multinational corporations, could lose
    the ability to control and shape the activities of disparate people through existing
    means. From this, they imply that there will be an increasing need to focus on
    how to regulate blockchain technology and how to shape the creation and deployment
    of these emerging decentralized organizations in ways that have yet to be explored
    under current legal theory (Wright and De Filippi 2015).


    Cannarsa (2018) highlights the difference between natural language, in which contracts
    are written, and computer language, in which codes are written. He argues that
    courts will play an important role, through interpretation, in disclosing the
    “true meaning” of a contract. Coding contracts and relying on computer-code language
    can hence have a significant impact on the civil law approach and bring the two
    legal systems closer as far as contract drafting and contract interpretation are
    concerned (Cannarsa 2018).


    Oxford Analytica (2020) stresses the existing problems which manifest a barrier
    for smart contracts to be implemented in the current regulatory framework. Experiments
    were conducted which tested the technology for its potential to save time and
    money and for its capacity to boost transparency of the financial sector. However,
    these trials have exposed major limitations of the technology’s design. The identified
    constraints include, for example, that only some governments have amended legislation
    to include blockchain-based transactions; more would need to follow to aid legal
    certainty. Another major hurdle to wider adoption of smart contracts is the lack
    of effective dispute resolution mechanisms and that simpler contracts executed
    through blockchain could lower administrative costs (Oxford Analytica 2020).


    However, blockchain technology will find its way not only into geopolitics but
    also into space politics. De Filippi and Leiter (2021) argue that blockchain technology
    is relevant for outer space because it fosters novel narratives advancing possible
    futures characterized by new modes of governance. They illustrate how the possible
    applications of blockchain technology could be applied to outer space governance.


    Most applications of blockchain technology utilize issued tokens to speculate
    on or hedge against outcomes of geopolitical actions. Bouri et al. (2020) investigate'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'whether price discontinuities in cryptocurrencies are jointly related to large
    swings in geopolitical risk. They examine the jump incidence of daily returns
    for Bitcoin and other leading cryptocurrencies and study the co-jumps between
    cryptocurrencies and the geopolitical risk index using logistic regressions. They
    find that the price behavior of all cryptocurrencies under study fluctuates, but
    only Bitcoin jumps are dependent on jumps in the geopolitical risk index, which
    indicates that Bitcoin is a hedge against geopolitical risk.


    Su et al. (2020) investigate the role of the Bitcoin currency in avoiding and
    surpassing the risks that are associated with global geopolitical events. They
    perform Granger causality tests in order to explore the mutual influences between
    geopolitical risks and Bitcoin prices and find that there are positive and negative
    influences that stem from geopolitical risks toward Bitcoin prices. Further literature
    (Selmi et al. 2022) shows that Bitcoin, and thus the underlying blockchain technology,
    is used to mitigate geopolitical risk.


    Overall, it is important to stress that even though blockchain technology has
    the power and potential to solve many decision-making problems—for example, through
    implementation of smart contracts—the final decision-making body or oversight
    entity should always be and remain human beings. The reason for this lies in the
    complexity of new situations which might overwhelm even the smartest machine-learning
    algorithms, not only because of a lack of historical data to learn from, but also
    because of situations which change the rules.


    We base our analysis about the potential applications of blockchain in international
    relations on the theoretical framework provided by Allison (1971). His main assertion
    is that the interactions between countries cannot be reduced to actions between
    two players. Instead, the decision-making process in international relations underlies
    the decision-making process by many players on many different levels, even though
    they are or can be embedded within the same country.


    Graham (1971) proposes three models which account for this distinction of different
    entities involved in decision-making processes—a rational actor model, an organizational
    process model, and a government politics model. The rational actor model attempts
    to explain international events by recounting the aims and calculations of nations
    or governments. The organizational process model attempts to explain international
    events by processes and procedures of large organizations that constitute a government.
    The government politics model attempts to explain international events by the
    outcomes of bargaining games among players in national governments.


    We will now explore in detail the potential of blockchain technology in the context
    of international relations by analyzing the three theoretical models of international
    relations by Allison (1971) and evaluate which role smart contracts and blockchain
    could play and take over in the corresponding frameworks. We present these three
    proposed models describing international relations and show'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'how blockchain technology and smart contracts can be applied to each. Each
    of the models offers a variety of possible adaption points where smart contracts
    can take over processes, optimize them, and execute them in a highly efficient
    way.


    # 12.2 Models of International Relations


    # 12.2.1 The Rational Actor Model


    The first model, the rational actor model, assumes that decisions are made and
    actions are taken by governments as primary actors. The action is chosen according
    to a calculated solution to a strategic problem. This corresponds to the classical
    model in international relations, which explains an occurrence in foreign policy
    by the rational action chosen by a government. What are the basic concepts of
    rational action?


    In the rational actor model, the goals and objectives of the players can be expressed
    through payoffs, utility, or preference, which represent the value or utility
    of alternative sets of consequences. Therefore, their values can be ranked, and
    depending on their assigned utility, the rational actor would choose the action
    with the highest value. Applied to a blockchain, any entry on a distributed ledger
    can be ranked as well. These entries can then be used by a smart contract to automatically
    execute the action with the highest value.


    Alternatives can be represented as a decision tree, and consequences are outcomes
    of choice if a particular alternative was chosen. Choice represents a selection
    of alternatives whose consequences rank highest in the decision-maker’s payoff
    function—hence, predictive behavior that can be fully explained in terms of the
    goals the actor is trying to achieve. The nature of machine-learning algorithms
    are decision trees which learn from backward propagation and error optimization.
    The application of such learning algorithms can be the basis of a smart contract
    which approximates the optimal choice among various alternatives through simulation
    and automatically executes the action which realizes the highest payoff.


    The underlying assumption in the rational actor model is that rational choice
    consists of value-maximizing adaption within the context of a given payoff function,
    fixed alternatives, and known consequences. The divergence in the choice of action
    for an actor, and thus for an analyst who tries to forecast an actor’s action,
    arises when it comes to the tradeoff between rational choice and optimal choice.
    As optimal choice assumes limited rationality, this leads to a potential overlook
    of a wide range of values and consequences.


    This problem will be solved by the implementation of smart contracts, since a
    rule-based framework needs to be set up in order for the algorithm to take into
    account the wide range of values and consequences. Through simulation, all'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'potential outcomes can be calculated, and only the ones which fulfill the pre-set
    requirements are executed.


    The problem in reality is that there doesn''t exist a pattern of activity for
    which one cannot write a large number of objective functions such that the pattern
    of activity maximizes each function. Machine-learning algorithms would change
    this situation. Depending on the calculation capacity, algorithms can perform
    almost infinite scenario calculations which can even generate new objective functions
    such that a pattern of activity maximizes each function.


    One approach to tackle this problem is to package activities of various officials
    of government as actions chosen by a unified actor, analogous to an individual
    human being. All these packaging activities correspond to blockchain entries and
    verifications, which can then be used for simulations and determination of optimal,
    respectively rational action, depending on the chosen objective function.


    # 12.2.2 The Organizational Behavior Model


    Organizational choice requires the generation of all possible alternatives, the
    assessment of the probabilities of all consequences, and the evaluation of each
    set of consequences for all relevant goals. This leads to a comprehensive rationality
    in the behavior of organizations. Nevertheless, there exist five deviations from
    comprehensive rationality due to the physical and psychological limitations of
    humans working in organizations which become obsolete with the implementation
    of blockchain technology. These deviations are factored problems, satisficing,
    search, uncertainty avoidance, and repertoires.


    Factored problems are problems which are so complex that humans split them up
    into quasi-independent parts. Blockchain technology functions algorithmically.
    Satisficing often replaces optimization, which means that a “good enough” solutions
    often satisfies. Due to the automatic and sequential processing of operations
    through algorithms, all ledgers are screened, and a global optimum can be found
    with enough available calculation power.


    When it comes to search, organizations very often generate alternatives by relatively
    stable, sequential search processes which create a very limited spectrum. The
    same characteristic applies to the search process in a blockchain. The decentralized
    nature of a blockchain and parallel mining process allows one to search without
    limiting the spectrum.


    Uncertainty avoidance makes organizations reluctant to base actions on estimates
    of an uncertain future. This problem can be tackled by a blockchain as well, since
    smart contracts can be programmed in such a way that they take into account several
    potential outcomes and automatically execute a certain task. Repertoires refer
    to action programs which constitute the range of effective choice in recurring
    situations. Artificial Intelligence can be integrated into smart contracts such'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'that they extend the range of choices, even in recurring situations, and thus
    avoid repetitive behavior.


    The limitation of organizational learning is often characterized by a process
    wherein behavior remains stable but goals change over time. In such a case, smart
    contracts would need to be adapted or re-programmed. Another point where smart
    contracts can be helpful is the identification of a threshold when certain goals
    are not only not met, but also can’t be reached anymore, and thus might indicate
    a deviation toward a new goal which would need to be defined.


    Organizational routines in a new context pose uncertainty, which smart contracts
    can minimize by evaluating the ledgers of all nodes in the network, simulating
    potential outcomes, and choosing the action which meets the pre-determined goals
    as closely as possible. If governmental leaders intend to trigger several different
    organizations’ programs simultaneously, smart contracts would definitely perform
    more efficiently in parallel execution of these actions.


    # 12.2.3 The Governmental Model


    The governmental model assumes that the leaders at the top of organizations are
    players in a competitive game. According to Allison (1971), these leaders are
    bargaining along regularized circuits among players positioned hierarchically
    within the government. Therefore, in this model, government behavior is not assumed
    to be an organizational output but rather a result of bargaining games. The characteristics
    of the governmental model is that the players don’t focus only on single strategies
    but on many diverse intra-national problems. This implies that there is no consistent
    set of strategic objectives, but of national, governmental, and personal goals.


    In order to include intra-governmental agreements into smart contracts, all parties
    need to join the blockchain. The verification process could even promote trans-national
    cooperation if the participating servers are distributed across the different
    nation states, thus contributing to the joint effort of running a blockchain and
    all associated smart contracts and tokens on it.


    Allison (1971) suggests that decisions need to be decentralized because of the
    broad spectrum of foreign policy problems. The blockchain network would fulfill
    this requirement because any node on the network could perform a certain action
    through the execution of a smart contract made by the node and verified by the
    whole network.


    As we can see, blockchain technology both flattens hierarchies by taking out bargaining
    advantages through automatization and shifts negotiation skills to an earlier
    stage in the smart contract rule determination. The shift of the education and
    skill set of negotiators over time surrounding the negotiation of the rules performed
    by the smart contract will create a stable environment which will not be exposed
    to uncertainty or decision fluctuations arising out of evolving situations.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# 12.3 Conclusion


    This chapter presents the potential roles of blockchain technology in international
    relations and what impact the replacement or enhancement of human-centered diplomacy
    by the implementation of blockchain technology and smart contracts would have.
    The three theoretical models by Allison (1971) constitute a description and reasoning
    of decision-making processes in international relations, to which blockchain technology
    and smart contracts can be applied to.


    His three proposed models are the rational actor model, the organizational behavior
    model, and the governmental model. Each of the models is described, including
    its potential interconnection points to blockchain technology. We describe which
    role smart contracts could play in each model—that is, through tokenization and
    automatized allocation of governmental budget resources according to rule-based
    smart contract executions.


