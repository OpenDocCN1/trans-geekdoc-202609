    in any particular order, and although countries may differ in the degree to which
    they find such activities egregious,† these are nevertheless the points of utmost
    international concern (Corbet et al. 2020; Sanz-Bas 2021; Chohan 2017a; Irina
    2018; DoJ 2020; FATF 2019). These are presented in Figure 8.1.


    ![](img/f08f3915c6e1afa13e4417a1426bd7c3_169_0.png)


    Figure 8.1 Legal Concerns Regarding Cryptocurrencies (Source: Author''s elaboration)


    # Hacks and Thefts


    As a category of digital instruments, cryptocurrencies are invariably vulnerable
    to hacks; and as a category of money, they are invariably vulnerable to thefts
    (Krupa et al. 2021; Angerer et al. 2021; Joo et al. 2019; Smith 2019). The two
    go hand in


    * For example, there are edicts against cryptocurrencies based on Shariah Law,
    which stipulate that cryptocurrency should be illegal based on the excessively
    speculative nature of its returns and the absence of a derivation from an underlying
    value source (see Chohan, 2017a); such considerations are not universal, however,
    and so are omitted from this general-view paper.


    † For example, some countries are expressing significant concerns about the impact
    of cryptocurrency mining on their power grids, but this can be treated as more
    of a nuisance rather than crime per se. Similarly, cryptocurrencies appear to
    mirror the same conditions of wealth inequality in their ownership that one would
    find in traditional economies (Chohan, 2022c), but inequality is not criminal
    per se, reflecting more of a moral consideration bound in philosophical precepts
    rather than one requiring legal regulation.'
