    | 1/2020 | Difficulty bomb delay | |

    | 8/2021 | Fee market changes, w/ fee burn | |

    | 9/2022 | Proof-of-Stake (scheduled) | |


    Figure 10.7 A History of Changes to Ethereum''s and Bitcoin''s Monetary Policies


    Bitcoin is also special in how users of all stripes stridently commit to its automated
    issuance schedule. The schedule has never changed in design, though developers
    have had to patch bugs to ensure that it behaves as intended. Bitcoin stands in
    stark contrast to Ethereum in this regard. The latter has changed its monetary
    policy routinely throughout its existence. (See Figure 10.7.)


    Ethereum''s ever-changing monetary policy owes, in large part, to pockets of influence
    within its own community—the presence and continuing involvement of founder Vitalik
    Buterin, as well as the sway of the Ethereum Foundation, which has had a trademark
    on the ''Ethereum'' name since the network originally launched.*


    Centralized sources of influence have exercised their power in ways small and
    large throughout its history. The most famous is the DAO hard fork of 2016, which
    left the old network (“Ethereum classic”) behind and instituted a new network
    (“Ethereum”), all to undo an exploit that, though permissible within the stated
    rules, resulted in unexpected and wide losses among DAO participants.† We have
    no opinion on whether this was a good decision, but it speaks to the centralization
    and manipulability of the second largest cryptocurrency network.


    In contrast, Bitcoin''s more robust commitment to decentralization has led to
    more trust in the stability of its native asset. In recent years, we''ve begun
    to see commitments to hold Bitcoin in the treasuries of publicly traded companies
    (e.g., Tesla®, Microstrategy®, and Square/Block) and efforts to make Bitcoin legal
    tender in nation-states like El Salvador and the Central African Republic.'
