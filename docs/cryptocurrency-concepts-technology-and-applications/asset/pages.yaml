  md: 'The wins or losses of these games of chance represent the option payoff, and
    the outcome from the toss of a coin and throw of a die represent the cryptocurrency
    spot price. This probability formula concept can be used to determine the fair
    bet that the player needs to pay up front to enter this game; this fair bet represents
    the premium that the investor needs to pay upfront to have the right to exercise
    such an option when there is a positive payoff outcome. The challenge is to derive
    such probabilities when the investor is betting on the direction of the cryptocurrency
    in the future. Such direction is measured by historical cryptocurrency spot price
    movements, expressed in statistics as the variance ($\sigma^2$) of the cryptocurrency
    spot price or standard deviation ($\sigma$). A few such valuation models that
    use cryptocurrencies spot price variances and standard deviations are the binomial
    option pricing model and Black-Scholes.*


    # Binomial Option Pricing Model: Single-Period Probability Method


    The binomial option pricing model (BOPM) continuously measures the two possible
    outcomes of the cryptocurrency, up or down, from any point in time until expiration.
    As the spot price of cryptocurrency goes up, the probability it will continue
    to go up can change versus the probability of going down from that new level.
    The up (u) and down (d) values are derived from historical experiences and are
    used in the BOPM to derive such probabilities. The probability of the cryptocurrency
    spot price’s (S) going up or down is ultimately measured to be the fair bet or
    the premium an investor is willing to pay to meet his or her expectation. Figure
    11.13 uses an example on how to calculate the premium using BOPM.


    Figure 11.13 shows there is a 50% probability that the price of Bitcoin will go
    up from its current level of $47,000 to $56,400 and a 50% probability that it
    will go down to $42,300 within the measurable period, in this case one year. The
    probability calculation is as follows:


    ```

    p = \frac{[(1 + i) - d]}{u - d} = \frac{[(1 + 0.05) - 0.90]}{1.20 - 0.90} = \frac{1.05
    - 0.90}{1.20 - 0.90} = \frac{0.15}{0.30} = 0.5 \text{ and } i - p = 0.5

    ```


    If the price of Bitcoin goes up to $56,400, the call option payoff will be $6,400
    (C = max (0, S – X) = max (0, $56,400 – $50,000). If the price of Bitcoin goes
    down to $42,300, the call option will be out of the money, and the payoff will
    be $0 based on C = max (0, S – X) = max (0, $42,300 – $50,000). Given the


