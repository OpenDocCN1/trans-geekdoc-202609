  md: '# # Chapter 9


    # Cryptocurrencies, Blockchain, and Public Choice


    Ryan M. Yonk and David Waugh


    American Institute for Economic Research


    # ## Introduction


    Nobel Economist James M. Buchanan famously described Public Choice as “politics
    without romance” (Buchanan 1984) to show the political world not through the normative
    lens of the noble civic but through a more pragmatic and realistic view. For at
    least the last half-century, the public choice research program has worked to
    provide a greater understanding of the political world through the application
    of economic tools.


    What Buchanan and the other early public choice scholars sought was something
    that stripped away romantic perceptions. They instead applied positive analysis
    to the realm in which political decisions are made. These scholars used the tools
    of economics to analyze non-market decisions that coordinate political and economic
    activity. While the field has developed over the course of the last half-century,
    this commitment to positive analysis remains the hallmark of public choice analysis.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'In applying this positive analysis to non-market, coordinated decisions, the
    core of public choice relies on two principles: (1) that individuals have preferences,
    and (2) that they will take action to achieve those preferences. These two simple
    observations of economic coordination rest upon our understanding of market exchange.
    These principles, which are banal in the economic sphere, remain revolutionary
    when applied in the public sector. Myriad scholars, including James M. Buchanan,
    Elinor Ostrom, William Riker, and Gordon Tullock, built an understanding of politics
    from the perspective of coordinated exchange. Their theory of government uses
    actual observations of how political decisions are made by emphasizing the incentive
    structures that shape their decisions. This theory replaces normative claims about
    government with concrete explanations of what truly happens.


    Public choice applies the analytical techniques of economics to examine political
    actors and processes. Essentially, it is “the application of economics to political
    science” (Mueller 1976). Within the economic literature of the 1940s and 1950s,
    economists criticized the market for failures in the form of greed or institutional
    misalignment. Buchanan and Tullock* took these critiques of market actors and
    applied them to politics. Public choice focuses on the decision-making at the
    individual level (whereas “the people” or “society” at large is not the unit of
    analysis). Groups do not make choices but individuals—as the fundamental actors—do
    (Shughart 2018).


    Traditionally, in political science and most understandings of civics, it is presumed
    that individuals in government have the public’s best interest in mind while eschewing
    their personal interests. Public choice theorists reject this romantic notion,
    arguing that politicians are no different from any other rationally self-interested
    agent with their own utility expectations. Political actors face different constraints,
    incentives, and decision-making pathways, which suggests that once they are elected
    they do not evolve from being rational agents who maximize self-interest to enlightened
    public servants. Public choice scholars take the position that one cannot simply
    elect “better people” to fix problems, as all elected officials and bureaucrats
    have the same contextual incentivizing structures and self-interest (Buchanan
    1984).


    As a research program and approach to understanding collective decision-making,
    public choice has a history, stemming from multiple Nobel Prize–winning research
    agendas in economics,† that takes the best available tools and uses them to better
    understand how rules, incentives, and expectations can lead to different outcomes
    in the political world. Public choice—in the face of political


    * Buchanan and Tullock are the founders of the Virginia School of Public Choice.
    There are other schools of public choice, such as the Bloomington and Rochester
    Schools.

    † Nobel Prize winners include James Buchanan and Elinor Ostrom.'
