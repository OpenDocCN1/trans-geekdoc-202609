    # Buying Put Options


    A put option is a contract that gives the holder the right, not the obligation,
    to sell cryptocurrency at exercise price (X), at and before the expiration date,
    no matter what happens to the price of the cryptocurrency. Of course, if the investor
    has the right to sell the set number of cryptocurrencies at a set price, he or
    she is then hoping that the price of the cryptocurrency goes down significantly
    and can profit from the difference, representing a bearish view on the cryptocurrency.


    For example, the June put option on Bitcoin with an exercise price of $60,000
    entitles its owner to buy Bitcoin at a price of $60,000 by the third Friday of
    June (contract expiration date). If the Bitcoin goes down to $40,000 before the
    third week of June, the option holder will buy it at $40,000 from the market and
    exercise the right to sell it at $60,000, profiting from the $20,000 difference.
