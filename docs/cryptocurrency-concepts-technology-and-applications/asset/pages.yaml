    # # International Harmonization Efforts


    While the previous two sections of this chapter have highlighted (1) broad categories
    of legal risks and (2) broad typologies of regulatory postures, this section considers
    international efforts to consolidate or harmonize cryptocurrency regulations across
    national boundaries. This effort is important above all because of the trans-boundary
    (or even boundaryless) nature of cryptocurrency, as their owners, dealers, and
    miners can locate and relocate themselves in adaptive ways. In some instances,
    such as in Venezuelan refugees’ exodus to Colombia, the boundarylessness has proven
    to be a blessing (DiSalvo 2019; Rendon 2021). In far more cases, however, and
    as discussed in previous sections of this chapter, the transboundary nature of
    cryptocurrency creates various types of risks.


    Yet the global financial regulatory system is highly imbalanced, inefficient,
    distorted, and politicized, even before one begins to address cryptocurrency;
    it is riddled with tax havens, duplicious actors, arbitrage strategies, and armies
    of lawyers and accountants who legally and illegally perpetuate a distorted world
    system (Dupuis and Gleason 2020; Shehu 2012; Chohan 2020; Killick and Parody 2007;
    Storm 2013). Most observers of international financial regulation admit this but
    then consider how cryptocurrency is likely to worsen the system still further
    (Szwajdler 2021; Nabilou and Prum 2019; Matei and Baks 2019; Chohan 2021c; Larkin
    et al. 2021), and so something needs to be done, and global regulators must start
    somewhere!


    In this regard, there are several major initiatives that are pushing for better
    harmonization. The first is the FATF, which has issued guidelines for virtual
    assets (a category larger than crypto alone) that are somewhat stringent (Chohan
    2021a) because they include stipulations such as the travel rule, which ground
    cryptocurrency in the traditional banking system. The FATF’s guidelines are prescriptive
    but set out a rigorous template for a tough international approach to cryptocurrency
    in view of AML/CFT risks.'
