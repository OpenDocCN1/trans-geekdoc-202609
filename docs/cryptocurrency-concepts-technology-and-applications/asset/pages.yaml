  md: 'governance decisions are automated. Automation of decisions can pertain to
    systemic changes (e.g., hard and soft forks), rules of operations, or system functions
    (e.g., DApps). Three possible forms of automation can take place in blockchain
    governance: fettered governance, semi-autonomous governance, and automated governance.


    In *fettered governance*, human agents hold all decision rights, and the decisions
    are implemented by the consent and collaborative actions of actors. Currently,
    most of the blockchain platforms operate on fettered governance, where the operations
    (e.g., verification, order of transactions, voting, etc.) are controlled by humans,
    be it centralized or decentralized.


    In *semi-autonomous governance*, automated agents supply certain governance functions.
    Here the access to off-chain data through oracles* and convergence of platform
    functions with other digital technologies such as AI and IoT can supplement the
    role of automated agents. For instance, through the injection of AI technologies
    in blockchain networks, it is possible to improve the capacities of smart contract
    management and introduce more efficient mining processes to reduce energy consumption
    (Hassani et al. 2018). A case in point is the QTUM blockchain, where in the case
    of problematic gas prices for certain operations (e.g., higher prices for processing
    blocks than creating them), smart contracts can temporarily increase the gas prices
    for the problematic operations to mitigate malign attacks on the network. These
    so-called decentralized governance protocols (DGP) provide an alternative to hard
    and soft forks for hotfixes without disrupting the user experience (Bosankic 2018).


    In *automated governance*, new digital technologies and advanced data analytics
    techniques supplemented by exogenous data sources can create complex automated
    governance mechanisms. For example, the terra0 project in the Netherlands aims
    to create self-governing ecosystems for the management of publicly owned natural
    resources such as forests by utilizing remote sensing, AI, token, and blockchain
    technologies.† The project envisions a DAO, where the satellite imagery through
    smart contracts designates the trees that can be harvested before damaging the
    forest too much, and that automatically trades licenses to cut the trees to vendees.
    The generated income is used to purchase shares of land from the actual landowners
    in the form of tokens, creating a non-human–owned property capable of utilizing
    its economic unit.


    A decision toward the removal of the human element is closely linked with the
    embedded values in the sectoral area of application. The salience of efficiency'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'and cost-effectiveness principles may insinuate the replacement of certain
    functions and organizations in public services with non-human–controlled DAOs
    or automated agents. Yet again, the cultural and behavioral reservations may suggest
    certain roles and decisions that can be automated to be left in the hands of actual
    people. Furthermore, the adaptation of automated solutions needs to comply with
    the existing capacities and practices at the user level. A core consideration
    here is assessing to what extent people can manage their digital identities and
    assets and whether they need custodian organizations in governance.


    # Conclusion


    Governance is a core challenge and yet one of the central value propositions of
    blockchain technology. In this chapter, I highlighted the key dimensions of how
    to approach the governance question in a blockchain-based system. Each type of
    governance decision is interlinked to each other at a techno-social level. System
    designers need to be aware of these interlinkages across various types of governance
    decisions. This does not mean that there is a hierarchy or a sequence of governance
    decisions that can be deduced from the presented model. Rather, the design of
    blockchain governance would require an iterative process of assessment where not
    only IT experts but also business and ethical experts may take part.


    Depending on the area of application, legislative, market, political-administrative,
    and socio-technological framework conditions may accentuate certain choices in
    blockchain governance. The existence or absence of a regulatory framework concerning
    data privacy, token technology, smart contracts, and DAOs can limit the available
    choices in governance design. Furthermore, trust dynamics among the blockchain
    network and public values connected to the area of application are also crucial
    to assessing the design choices in blockchain-based solutions. These social factors
    complement and are influenced by the presence or absence of technological means
    and capabilities in the network of users.


    Lastly, the multifaceted and value-laden challenges connected with the governance
    question is leading to innovative and tech-driven approaches across blockchain
    communities. Bounded curves, quadratic voting, and token economic models are some
    evolving innovative solutions to regulate the behavior of users and communities
    in blockchain networks. These solutions are currently tested and developed in
    fringe networks outside of the mainstream enterprise applications. However, their
    innovative character to address certain conundrums in the “governance paradox”
    and challenges of the financial and institutional systems appear to be promising
    and interesting for the future applications of this technology.'
