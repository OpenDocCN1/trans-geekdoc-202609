    # Covered Option Trading Strategy Contracts


    Covered option strategies are buying or selling options primarily for hedging
    purposes. The covered option strategy is typically one in which the investor buys
    or sells options in conjunction with buying or selling the underlying cryptocurrency
    from which the option’s premium prices are derived. Another reason to use the
    covered strategy is to enhance the overall exposure by maximizing the gain on
    both the underlying cryptocurrency and the option securities. The following three
    strategies are protective puts, covered calls, and a combination of the two called
    collars.


    # Protective Put Strategy


    A protective put is a strategy in which the investor buys or owns the underlying
    cryptocurrency and simultaneously buys put options to hedge his or her holdings
    in case the price of the cryptocurrency drops. This is like buying insurance on'
