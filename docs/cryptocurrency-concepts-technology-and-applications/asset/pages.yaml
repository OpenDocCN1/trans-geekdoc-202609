    There are numerous derivatives developed based on cryptocurrencies. One of the
    most significant is the token. Ethereum blockchain infrastructure projects execute
    smart contract projects to create tokens on top of the blockchain. These tokens
    enable applications in different kinds: utility tokens enable digital access to
    an application; payment tokens enable purpose-specific currencies for a designated
    service; and security tokens enable the contractual relations for certain claims
    of assets.'
