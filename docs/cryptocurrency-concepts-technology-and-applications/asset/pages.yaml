    Within economics, Nobel Prize winner Ronald Coase highlighted a proposition about
    how legal disputes can be resolved outside of the court system (Coase 1960). Public
    choice scholars have often suggested just such a solution when considering ways
    around the requirement for enforcement. Using Coasian logic, they suggest that
    when an externality exists, parties could theoretically bargain to come to a resolution,
    provided that transaction costs are low and property rights are clearly defined.
    Ultimately, parties may come to a more optimal decision without third-party involvement.
    Coase (1960) acknowledges that,'
