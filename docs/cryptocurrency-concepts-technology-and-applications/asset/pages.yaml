- pgno: 159
  md: 'we want the foreign jurisdiction (and the VASP) to take, what we can reasonably
    expect, and what they will expect from our request.


    First we need to bear in mind the information that VASPs collect from clients
    and are available to law enforcement upon a properly formalized request. VASPs
    receive a variety of data depending on the activity a client wants to perform.
    While sometimes it is sufficient to provide some basic data and an email address
    to open an account, things change dramatically when this person wants to deposit,
    trade, or withdraw funds, and also according to the volume of those transactions.
    A normal KYC process will see the client providing:


    +   - Name, date and place of birth, all proved by the submission of a proper
    form of identification (ID), often required to be held in front of a camera where
    the person can be seen holding the ID to compare the document and the face

    +   - Residency, usually by submitting utility bills or bank documents proving
    the place of residence

    +   - Source of wealth, when the client deposits fiat currency to be exchanged
    into crypto

    +   - Source of funds, when the client deposits crypto


    Moreover, VASPs also see and collect the IP address used to connect to the service
    and maybe also store the unique configuration of the client’s machine (operating
    system, browser, cookies, two-factor authentication). The entire account (deposits
    and withdrawals) and trading history will also be available. In the case of a
    legal person, among the information provided there will also be incorporation
    documents and, in some cases, beneficial owners.


    What must investigators focus on when writing a request for assistance? A few
    things can definitely make the difference between a successful cooperation and
    a painstakingly long and ineffective process:


    +   - Use of the proper language. When filing a request, be aware of the correct
    terminology: there is a huge difference between an address, a wallet, and an account.
    Ethereum is different from Bitcoin and from Monero, and they all have a different
    address style. Do your homework and research the terminology before writing.

    +   - Attach addresses and transaction IDs in plain text within a Word or Excel
    document to allow the VASP to copy-paste that data. Copying from a PDF may lead
    to mistakes.

    +   - Reach out to the VASP before writing the request. Most VASPs have big compliance
    departments that will be happy to communicate with investigators in advance and
    even guide them while they write the letter. They can help investigators to use
    the right terminology, ask for the correct data, and avoid pointless back and
    forth of letters.'
