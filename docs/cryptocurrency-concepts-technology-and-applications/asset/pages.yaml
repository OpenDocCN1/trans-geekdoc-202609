  md: '# Chapter 10


    # Bitcoin Is King


    Andrew M. Bailey* and Craig Warmke**


    *Yale-NUS College, **Northern Illinois University


    # I. Introduction


    Kerrygold® butter is legendary. For a time, it was the only butter Americans could
    find from grass-fed cows. Rich yellow, flavor dense, and imbued with magical Irish
    qualities. Best butter in the world, and suitable even for blending with morning
    coffee. Unique.


    But a visit to Ireland shows something else. Go there and you might be served
    Connacht Gold for breakfast. Connacht—a province, much like Kerry, a county. If
    this doesn''t shake your confidence in the uniqueness of Kerrygold, just wait
    till you see the wall of butters at the Supervalu in Dingle. They''re all yellow,
    and Irish, and seem quite nice. Perhaps Kerrygold isn''t as special as it might
    seem.


    This essay isn''t about Kerrygold. It isn''t about bovine “gold” in general, either.
    It’s about digital gold—Bitcoin. Many think that Bitcoin is even less special
    among cryptoassets than Kerrygold is among Irish butters. After all, 13,457 such
    assets now have some kind of market value. Many have charismatic leaders, slicker
    marketing, more apparent utility, and, from time to time, more appealing trading
    opportunities. Some pundits think Bitcoin''s best days are over. A boomer coin.
    Perhaps Bitcoin isn''t as special as it might seem.*


    * For some comparisons among cryptocurrencies and their design tradeoffs, see
    Bailey et al. (2021a, 2021b).'
