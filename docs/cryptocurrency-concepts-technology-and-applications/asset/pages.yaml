- pgno: 202
  md: 'Yet Bitcoin has enjoyed the top spot in market capitalization among cryptocurrencies
    for 13 years. The market knows something. What it knows, in our view, is that
    Bitcoin _is_ special. But its intrinsic machinery—what it is in itself—doesn''t
    fully explain why. Bitcoin is also special because of its founding, culture, and
    product-market fit. Nothing else comes close on these points of comparison. This
    gap between Bitcoin and everything else has implications for policy-making, journalism,
    and academic research.


    So, in what follows, we''ll explain why Bitcoin is the king of cryptocurrencies—as
    of today, all 13,457 of them—and what that crown signifies. We begin with a brief
    description of what Bitcoin is and how it works.


    # ## II. Function


    The Bitcoin network offers final settlement without authorities. It offers final
    settlement in the sense that transactions are effectively irreversible—Bitcoin
    has no chargebacks, for example. And it offers this finality without authorities
    like banks or payment providers to oversee, settle, and clear transactions. The
    network''s transactions occur in the network''s native asset, also known as Bitcoin.
    The network has three main players:


    +   1. Users, who send and receive Bitcoin to and from each other.

    +   2. Nodes, computers that run the Bitcoin software and serve as the network''s
    referees. They reject any invalid transactions and curate the Bitcoin ledger.

    +   3. Miners, computers that run the Bitcoin software and compete to produce
    blocks of valid transactions for the ledger. About every 10 minutes, a miner successfully
    produces a block and thereby enjoys that block''s transaction fees, as well as
    a predefined amount of Bitcoin in accordance with Bitcoin''s automated issuance
    schedule. A successful block requires a trial-and-error search for the solution
    to a mathematical puzzle.


    Network incentives promote honest behavior among these participants. Nodes reject
    transactions that attempt to spend already spent Bitcoin. They also reject any
    blocks that reward miners beyond the permitted amount.


    Someone could conceivably spend the same Bitcoin twice by writing a new version
    of the ledger—an alternative chain of blocks—that erases the original spend and
    then inserts a new one. But this would likely require a cost-prohibitive amount
    of energy. Nodes on the network endorse the version of the ledger most likely
    to be the most energy-intensive—a probabilistic calculation stemming from the
    difficulty required to mine each block in the chain. So in order to succeed, the


    * For the different pieces that came together in Bitcoin, see Narayanan and Clark
    (2017).


    † For technical explainers, see Antonopoulos (2017), Rosenbaum (2019), and Warmke
    (2021).'
