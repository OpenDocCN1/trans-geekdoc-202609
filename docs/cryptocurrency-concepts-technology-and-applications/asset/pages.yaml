    The investments at the secondary market are guided by fundamental analyses, statistical
    analyses, and modeling. as well as technical analyses conducted by market participants
    and the media. This is similar to the analytical framework used by the foreign
    exchange market (FOREX), regarding cryptocurrencies as foreign fiat money. However,
    there are some vital differences. Table 1.3 provides some examples of such differences.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Table 1.3 Different Market Analyses Foci When Viewing Cryptocurrencies as
    Foreign Currencies


    | Foreign Exchange Market Analysis | Cryptocurrency Market Analysis |

    |---|---|

    | Changes in monetary policy matter. | Only monetary policies that are related
    to cash inflows and outflows matter. |

    | Changes in fiscal policy are of interest. | Government spending is less relevant.
    |

    | Changes in economic data are important. | Economic data from large economies
    are only relevant when they affect cash inflows and outflows. |

    | Changes in geopolitical conditions matter. | Geopolitical events are less relevant.
    |

    | Celebrities are less relevant. | Celebrity tweets and attitudes significantly
    affect the market. |

    | Government acceptance is not an issue. | Governments'' acceptance affects the
    market significantly. |

    | Social media and individual investors are less influential. | Social networks
    and individual investors are very influential. |


    The secondary market transaction is facilitated by the financial service providers.
    The two most important groups of providers are the wallet and the exchange. A
    cryptocurrency wallet allows an investor to store their cryptocurrencies and manage
    transactions. It implies the direct and active users of cryptocurrencies for transaction
    purposes. On the other hand, a cryptocurrency exchange refers to a website or
    service where one can sell or buy digital currency or convert fiat currency into
    digital currency.


    Some widely-used wallets include Coinbase®, Mycelium®, Exodus®, Electrum®, Ledger®,
    and Trezor®, along with traditional investment service providers such as PayPal®,
    Venmo®, and Robinhood®. On the other hand, the number of cryptocurrency users
    skyrocketed between 2017 and 2022. The digital asset custody platform Blockchain.com
    records the number of unique crypto wallets, presented in Table 1.4. This table
    also provides a forecast of the future number of unique crypto wallets.


    The count of wallet users is not to be confused with the population who own a
    share of cryptocurrencies. The latter is larger because it includes the investors
    who hold cryptocurrencies as financial assets instead of using them as a medium
    of exchange in real economy transactions. A more comprehensive review related
    to the wallet users is the cryptocurrency exchanges, which serve both purposes
    of investments and transactions.'
