  md: 'counterparty VASPs, compliance for private and unhosted wallets conducting
    transactions with VASPs, interoperability challenges, and the _sunrise problem_.


    The sunrise problem is nothing new. It happens every time a new regulation affecting
    a global phenomenon is not implemented seamlessly and simultaneously. From a crypto
    compliance point of view, the issue starts when a client of VASP A (an exchange),
    which operates in a jurisdiction where the travel rule is implemented, wants to
    send money to a person using VASP B, located where the travel rule is not a regulatory
    obligation or is not implemented yet. VASP A, adhering to its obligations, will
    transmit an information request to VASP B, which will not respond because it doesn’t
    have the same requirements in its jurisdiction.


    Has the FATF Recommendation helped law enforcement in taking down criminal activity
    related to cryptocurrencies? The answer is definitely yes. I have helped many
    investigators to trace illicit transactions in the form of ransom\* payments on
    the blockchain. While in the past it was hard to even locate many VASPs, let alone
    serve a subpoena and get a reply, the increasingly stringent regulations have
    dramatically improved the situation, as we will see in the next section.


    # Law Enforcement: Staying One Step Ahead


