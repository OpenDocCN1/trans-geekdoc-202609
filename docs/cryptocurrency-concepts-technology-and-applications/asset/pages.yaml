  md: 'attacker would have to re-mine all the intervening blocks from the original
    spend and then outpace the rest of the network in creating new blocks. With that
    kind of energy expenditure, the attacker would likely profit much more from forgoing
    the attack altogether to net the rewards from mining honestly.


    You might have heard that the cultivation of Bitcoin''s ledger makes it slow and
    expensive. In one sense, this is true. Bitcoin''s ledger updates, on average,
    every 10 minutes, and each transaction includes a fee to whichever miner produces
    the block that includes it. But each block is small—due to Bitcoin''s consensus
    rules, the maximum block size is somewhere between two and four megabytes. At
    today''s average transaction size of around 650 bytes, users shouldn''t expect
    to squeeze much more than around 2,000–3,000 transactions in a typical block.*
    With blocks every 10 minutes, this averages to about three to five transactions
    per second.


    There is, accordingly, a fee market: transaction fees are bids for space in the
    ledger. The more data your transaction involves, the more space on the ledger
    it''ll take and the more you''ll have to pay. When the network buzzes with activity,
    users bid over one another—no matter how big or small a payment one seeks. Small
    value payments become uneconomical. So Bitcoin''s blockchain lacks the transaction
    throughput of a global payments network. Visa® alone handles, on average, about
    1,400 transactions per second, at a cost most are willing to pay.


    However, unlike Bitcoin, Visa doesn''t offer transaction finality. They can and
    do reverse transactions. Visa isn''t a final settlement layer. Visa transactions
    settle, instead, through banks and, ultimately, master accounts with the Federal
    Reserve. So we can think of Visa as a payments layer built atop the Federal Reserve.†
    In much the same way, Bitcoin has payment layers built atop, and which ultimately
    settle on, its blockchain. So we should instead compare Visa to one of these,
    the most important of which is the lightning network.


    Technical details aside, users on the lightning network enjoy the security of
    Bitcoin''s ledger to send and receive Bitcoin nearly instantaneously and practically
    for free.‡ The current median fee of one satoshi (the smallest unit of Bitcoin)
    means that transactions cost a fraction of a penny.§ And its theoretical throughput
    far exceeds Visa''s own. Amazingly, lightning accomplishes this feat without trusted
    intermediaries. Consequently, apples to apples and oranges to oranges; Bitcoin
    is to Fedwire as lightning is to Visa. The main difference in each case is that
    the Bitcoin side works without trusted intermediaries.


