    and dice throw, respectively. Using the probability formulas derived from the
    decision tree, the bets are calculated as follows:


    $$ \text{Coin toss bet} = \frac{1}{2} (\$20) + \frac{1}{2} (\$0) = \$10 $$


    $$ \text{Die toss bet} = \frac{1}{6} (\$60) + \frac{5}{6} (\$0) = \$10 $$'
