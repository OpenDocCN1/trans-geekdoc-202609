    Singapore, are mandating exchanges to operate exclusively with licenses that enforce
    the travel rule. Other countries, such as Canada, are still working on it, trying
    to find the best solution. The U.S. had the rule technically already in place,
    but it was rarely enforced.


    In the FATF’s first 12-month review of the implementation of these new regulations
    in June 2020, it was noticed that there are numerous problems hampering the efforts
    toward a harmonized implementation. These include identifying'
