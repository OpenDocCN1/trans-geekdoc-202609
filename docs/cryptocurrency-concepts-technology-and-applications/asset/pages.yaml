    # Covered Call Strategy


    A covered call strategy is a one in which the investor buys or owns the underlying
    cryptocurrency and simultaneously sells a call option of the cryptocurrency. This
    is a popular, low-risk strategy commonly referred to as writing covered calls.
    What’s interesting is that selling uncovered calls is the riskiest option strategy,
    with possible unlimited losses, but selling calls while you own the cryptocurrency
    is thought of as the most conservative strategy.


    An example of who would be using such a strategy is an investor who is planning
    to sell the cryptocurrency soon at a higher-than-market level, so instead of setting
    up a limit order that instructs his or her broker to sell the cryptocurrency when
    that higher price is met, he or she could sell the equivalent one cryptocurrency
    in call options, receiving the premium at a set future price. If the cryptocurrency
    hits that higher price, instead of paying the difference between the exercise
    price and that market price as a seller of calls, he or she can deliver the cryptocurrency
    at that price or sell the cryptocurrency in the market and cover the call option
    obligation from the profit made from selling the cryptocurrency.


