    # Smart Contracts and the Law


    The most significant blockchain innovation with respect to the law are smart contracts.
    While it is not expected that they will replace large swaths of the judicial system
    in the near future, their application is of interest to public choice scholars
    who study how the law works. In theory, smart contracts might allow for the replacement
    of the political judiciary with what appears to be the outset of a form of adjudication
    rooted in code rather than judicial interpretation. In the near term, however,
    it appears smart contracts can be used today to reduce the costs of enforcing
    certain transactions. Levi et al. (2018) argues,


    Smart contracts are presently best suited to execute automatically two types of
    “transactions” found in many contracts: (1) ensuring the payment of funds upon
    certain triggering events and (2) imposing financial penalties if certain objective
    conditions are not satisfied. In each case, human intervention, including through
    a trusted escrow holder or even the judicial system, is not required once the
    smart contract has been deployed and is operational, thereby reducing the execution
    and enforcement costs of the contracting process (Levi et al. 2018).


    While smart contracts can replace some of the traditional contracts present in
    today''s world, they are not risk free. As Carter and Jeng (2021) describe, they
    are simply “code that automates actions.” Because they replace human agreements
    and enforcement mechanisms with code, they shift risk from human error to code
    error. For example, technical exploits (hacks) of smart contracts are common.
