    anonymous features or cryptography of a cryptocurrency, then it ceases to be a
    cryptocurrency, and this could lead to its collapse.


    Another implication of the emergence of CBDC for cryptocurrency is the emergence
    of stablecoins, which have made cryptocurrency more appealing to governments and
    members of societies (Bullmann, Klemm, and Pinna 2019).'
