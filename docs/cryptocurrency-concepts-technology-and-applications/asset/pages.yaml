- pgno: 101
  md: '# Chapter 5


    # Blockchain Governance: To Govern, or Not to Govern?


    Evrim Tan


    KU Leuven, Belgium


    Disruptive innovation at the helm of digital technologies is the defining characteristic
    of our time. Blockchain, along with artificial intelligence, big data, robotics,
    quantum computers, and many other up-and-coming technologies will be a key component
    of creating automated, decentralized, and human-machine hybrid systems, which
    will highly likely define in a not-so-distant future our systems of transactions
    in business, societal, and government domains.


    But why is blockchain a key technology in this transformation? The importance
    of this technology is that it provides a viable solution to the agency problem—the
    trade-off between the delegation of authority and the control of the agent’s act.
    The agency problem occurs when a legitimate actor in governance delegates some
    part of its authority to a trusted party and in return relinquishes some control
    in governance. In a blockchain, the information is archived in a distributed ledger
    that is shared across a network of users where every participant (called node)
    has a copy of the ledger and records all transactions.


    By agreeing on a form of consensus mechanism, nodes validate the transactions,
    provide an immutable (or nearly immutable) record of transactions, and ensure
    traceability. In this way, blockchain ensures nearly unhackable decentralized
    systems'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'of encrypted data, without a need for a centralized authority to ensure the
    continuity of the system.


    By creating an autonomous, transparent, secure distributed system, blockchain-based
    systems may enable the removal of intermediaries in any system of governance as
    trustees replacing them with an algorithmic confidence system (Tan and Rodrigo
    Müller 2021; De Filippi et al. 2020).


    This feature upholds a tremendous potential to redesign the global financial system,
    election systems, and government in a more transparent, efficient, and effective
    way (Tapscott and Tapscott 2016). Theoretically, blockchain can disrupt any system
    of transactions in which the legitimacy to control lies within a higher institutional
    authority or within the constituents.


    This technological feature of blockchain makes the question of governance a contradictory
    and convoluted concept, as not everyone agrees that governance without a centralized
    control is feasible or desirable. The failure of the Libra association* or the
    low uptake of blockchain-based systems in the public sector (Lindman et al. 2020)
    are cases in point. The global system is based on the supremacy of governments
    and big businesses that keep the control of monetary policies and regulations.


    Centralized power structures in government and business domains would like to
    reap the benefits of this technology, such as higher efficiency due to reduced
    transaction costs and higher security through distributed ledgers, without necessarily
    losing control of the means and authority in governance. For the communitarian
    initiatives and crypto-anarchist communities, on the contrary, the true value
    of this technology is in creating a new global financial and social order without
    governments or big companies dictating the rules of the games. The true challenge
    for these initiatives is designing a governance system around the code and ensuring
    decentralized action of communities in acting for the benefit of everyone.


    An additional level of complexity is the fact that that blockchain as a technology
    re-establishes the importance of trust and legitimacy in the initial policy and
    system design phase instead of the implementation. The rules of transactions are
    set at the design phase, and once a decision is made, a change in the system requires
    the consent of authorized users. Furthermore, blockchains can confirm the genuineness
    of a transaction, but whether a given input in a transaction is genuine or the
    transaction rules are fairly established is beyond the technical scope of blockchains.
    Therefore, “who will be authorized to make changes in the system?” and “what are
    the rules/procedures to follow in the change of the'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'system?” are key questions for blockchain governance. Vili Lehdonvirta calls
    these inherent contradictions of blockchain governance a “governance paradox,”
    as once you address these questions of governance, blockchain loses its value
    over conventional data infrastructures because you are already trusting some organization
    or process to make the rules (Werbach 2018).


    As a technology whose most salient feature is to build trust in governance processes
    without a need for a trusted third party, understanding what to govern and how
    to govern is fundamental for the application of blockchain technology. This question
    will be the central focus of this chapter. First, various theoretical approaches
    to blockchain governance within different disciplines will be discussed. Then,
    what does governance entail in blockchain-based systems will be examined, followed
    by what type of governance decisions need to be made by system designers.


    # Theoretical Approaches to Blockchain Governance


    The conceptual scope of blockchain governance largely varies within different
    disciplines. For instance, in the information and computer-science literature,
    blockchain governance often focuses on the way decision rights, incentives, and
    accountabilities are arranged in a blockchain network to encourage desirable behavior
    in the use of resources (e.g., Beck et al. 2018; Rikken et al. 2019; Van Pelt
    et al. 2021).


    In business management literature, blockchain governance is conceptualized as
    the process by which individuals and groups with ongoing relationships bargain
    about how to adapt to changes within an institutional environment (e.g., Allen
    et al. 2020; Daluwathumullagamage and Sims 2020; Gruin 2020).


    In the economics literature, and more specifically commons scholarship, blockchain
    governance is associated with polycentric systems operating simultaneously at
    many different levels of interaction, and governance decisions are perceived as
    similar to the governance of community-pool resources (e.g. Howell, Potgieter,
    and Sadowski 2019).


    In an earlier study, we found out that there are three categories of studies in
    the literature on the way they operationalize blockchain governance (Tan et al.
    2022). The first category of studies focuses on the infrastructure of the blockchain
    (e.g., Ertz and Boily 2019; Ozdemir, Ar, and Erol 2020). In those studies, blockchain
    governance is embedded in the technical design of blockchain infrastructure, and
    the research focus is on elucidating how different choices by system designers
    about blockchain architecture, blockchain applications, and technical standards
    shape blockchain governance.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'The second category is about the operational processes of blockchain governance
    and captures the technical design choices and algorithms that affect the information
    exchanges, transactions, and collective actions between users (e.g., De Filippi
    and Loveluck 2016; Reijers et al. 2018; Van Pelt et al. 2021). Decision-making
    through on-chain and off-chain methods, initiative, and consensus mechanisms are
    at the foci of this category.


    In the third category, blockchain is treated as a governance technology that allows
    decentralized, algorithmic, and automated forms of governance to implement policy
    decisions (e.g., Allen et al. 2020; Yeung and Galindo 2019). In those studies,
    blockchain governance focuses on the regulation, organization, and control of
    the blockchain-based system in a particular institutional framework.


    Based on the systematic literature published in Tan et al. (2022), we have developed
    a conceptual framework that embeds these different approaches into a holistic
    approach. The framework identifies micro, meso, and macro levels and a total of
    nine types of governance decisions to address in blockchain-based systems. The
    presumption is that governance decisions at each level are connected, and decisions
    at one level may dictate the choices at another level. In the remainder of the
    chapter, this framework will be used to elucidate the complexity of blockchain
    governance at each level of governance.


    # Micro-Level Governance


    Micro-level governance is about the choices of system designers regarding the
    infrastructure of a blockchain-based system. The decisions concerning the infrastructure
    architecture of blockchain, modular applications of smart contracts and decentralized
    applications, and interoperability of the blockchain-based system with the existing
    IT infrastructure fall under this category.


    # Infrastructure Architecture


    Blockchains can have permissionless/permissioned and public/private forms (Hileman
    and Rauchs 2017). The difference between public and private blockchains is about
    who owns the data infrastructure. The difference between permissionless and permissioned
    systems is about the restrictions imposed on network participants in terms of
    read, write, and audit/commit functions. In the former, anyone can participate
    in the network and validate the transactions taking place on the platform; in
    the latter, only selected entities are authorized to validate the transactions.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'These classifications are not exclusive to each other, and it is possible to
    have a public and private blockchain with varying degrees of permission models
    (see Hileman and Rauchs 2017). For instance, the two most well-known blockchain
    platforms, Bitcoin and Ethereum², are public and permissionless blockchains. Hyperledger
    Fabric, R3Corda, and Quorum are some examples of technology developers that provide
    build-in tools for permissioned systems applicable to public and private blockchains.


    The merits of different types of blockchains vary technically concerning decentralization,
    security, scalability, speed, throughput, privacy/confidentiality, trust, and
    finality dimensions. On the one hand, public and permissionless blockchains engender
    better trust and security for data infrastructure while experiencing a lack of
    scalability and performance issues. On the other hand, private and permissioned
    blockchains are largely developed and preferred by private enterprises (e.g. IBM®,
    Microsoft®) as they allow a certain extent of control of the data privacy and
    the governance of the system.


    The choices with the blockchain infrastructure call for value-laden governance
    decisions tied to several trade-off conditions. These trade-off conditions are
    related to the performance of blockchain infrastructure in delivering the expected
    values. According to Kannengießer et al. (2019), there are 23 endogenous trade-off
    conditions among seven DLT properties (usability, performance, flexibility, security,
    transparency, law and regulation, and community) that vary according to the design
    choice with infrastructure architecture. For example, if the purpose of the blockchain-based
    system is to enhance trust among users, the system architecture should prioritize
    transparency, which can come at the expense of other properties (e.g., usability,
    performance, flexibility). The key takeaway is that the choice of blockchain infrastructure
    requires a self-assessment of the expected added value to the system of transactions.


    # Application Architecture


    Blockchain infrastructures are predisposed to particular limitations in blockchain
    governance. However, these limitations can be mitigated through the use of decentralized
    applications (DApps) and smart contracts.


    DApps are open-source coded digital applications or programs that exist and run
    on a blockchain or P2P network of computers. Through DApps, users can access blockchain
    networks and engage with other users for different purposes (e.g., storage of
    data space). Each DApp comes with certain advantages and disadvantages (e.g.,
    finality, speed, scalability, energy consumption, etc.) based on their consensus
    and incentive mechanisms, which makes choosing a DApp inherently a governance
    decision. It is also possible through modular DApps to'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'anchor values in a non-blockchain system or a private blockchain to a public
    blockchain. Therefore, it is possible to circumvent certain trade-offs between
    DLT properties (e.g., performance vs. security) through the use of DApps.

    Smart contracts are mechanisms that contain digital assets of two or more involved
    parties, where assets are distributed automatically according to predefined response
    actions when trigger conditions are met (Governatori et al. 2018). DApps access
    the blockchain network through smart contracts, which enforce the term of the
    agreement between two parties. Through the combination of smart contracts and
    DApps, it is possible to create decentralized autonomous organizations (DAO) where
    the operational rules are encoded on blockchain in the form of smart contracts,
    and DAOs can autonomously or semi-autonomously operate without centralized control
    or third-party intervention (Wang et al. 2019). These new forms of organizations
    can redefine the mechanisms of control and coordination in governance systems.


    # Interoperability


    Blockchain interoperability refers to the ability of a blockchain network to share,
    see, and access information across existing data management systems in the public
    and private domains without the need for an intermediary to do the exchange.


    There are three types of blockchain interoperability challenges:

    First is the lack of standardization from technical protocols to smart contracts
    that connect auxiliary technologies such as AI, verifiable credentials, and wallet
    solutions in blockchain platforms (Janssen et al. 2020).


    Second, blockchains are by design not interoperable with each other (Lafourcade
    and Lombard-Platet 2020). Several solutions have been proposed to facilitate cross-chain
    transactions, such as facilitating messaging via a management chain, using cross-chain
    cryptocurrency for atomic asset transfers, or direct communication via hardware
    connections using TLS or smart contracts, each with its unique set of problems
    to solve (Johnson et al. 2019).


    Third, interoperability challenges can arise from the specific needs in the sectoral
    area of application. For example, Zhang et al. (2017) identify particular interoperability
    challenges in the healthcare sector concerning the evolvability, flexibility,
    extent, and continuity of data exchange across various data providers.


    Interoperability challenges can affect blockchain governance choices in two possible
    ways. First, they can preclude the scalability of blockchain-based solutions and
    thereby limit the use of blockchain only to specific functions (e.g., data verification
    through verifiable credentials). The lack of scalability can further undermine
    the applicability of decentralized and permissionless systems. Second, the technology
    choices of stakeholder organizations in a blockchain ecosystem can elevate one
    blockchain infrastructure and associated governance choices over'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'others and establish it de facto as the system architecture choice in sectoral
    and geographical areas. As such, the interoperability requirements across blockchain
    networks may delimit available governance choices at the micro level.


    # Meso-Level Governance


    Meso-level governance concerns the interactions among the network community upon
    which the blockchain-based system rests. A blockchain-based system relies on the
    interactions among different types of users such as miners, verifiers (or node
    operators), core developers, token holders, content producers, and network users.
    Governance decisions at the meso level set up how decision-making among these
    actors is managed, what type of incentive mechanisms support system maintenance,
    and how consensus mechanisms affect the role of actors in blockchain governance.


    # Decision-Making Mechanism


    The decision-making mechanism varies between on-chain and off-chain governance
    processes (Reijers et al. 2018). In on-chain governance, stakeholders participate
    in discussions and decisions through the protocol itself, and when a decision
    is reached through a voting procedure or surpasses a threshold user number, the
    protocol adapts automatically to the decision. In on-chain governance, the way
    that the engagement and decision-making take place is encoded directly in the
    underlying infrastructure. For example, during the introduction of soft-fork activation
    protocols to Bitcoin (i.e., BIP 8 or BIP 9), miners used on-chain means to signal
    their support for the proposed upgrade. When 95% of blocks signaled support for
    the upgrade, the changes are enforced automatically after a short period. The
    strength of on-chain governance is its enforcement mechanism—when a decision is
    agreed upon, it is implemented by following the rules embedded in the code.


    Off-chain governance refers to the endogenous and exogenous rules and processes
    of deliberations around the protocol that contribute to the operations and development
    of blockchain-based systems (Reijers et al. 2018). For example, Bitcoin developers
    share their improvement proposals (BIPs) through a mailing list, and Ethereum
    collects improvement proposals (EIPs) on Github (Ehrsam 2017). The miners can
    decide whether to adopt the improvement proposals in practice.


    Although off-chain governance presents a more democratic alternative and allows
    an incremental adaptation, it preserves an inherent security risk in permissionless
    systems. The miners of the system are rent-seekers, and they do not'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'necessarily preserve the technical expertise to evaluate a proposal. Therefore,
    an initially benign-looking software modification initiated by a malicious actor
    can create security risks in the future (Finck 2018).


    Both governance processes infer some trade-offs for system designers. On-chain
    governance brings the trade-off between efficient decision-making and transition
    processes whilst risking destabilization to political dissonance. Off-chain governance
    brings the trade-off between enhancing the political consensus in the decision-making
    and transition processes whilst making the system security vulnerable to the rent-seeking
    behavior of the miners.


    It is also possible to develop hybrid systems, where some decisions can be taken
    through on-chain processes, whereas others can be through off-chain processes.
    Or innovative solutions in weighting votes might be used to mitigate risks associated
    with voting mechanisms. For instance, quadratic voting—a voting mechanism that
    allows users to invest in additional votes to express their support for a given
    issue more strongly—can increase the legitimacy of decision-making processes in
    on-chain governance.


    In addition, depending on the blockchain protocol, some actors may hold veto rights
    over certain decisions, or some decisions can be open only to certain actors to
    vote on. Here the institutional framework, area of application, and country-specific
    conditions may dictate different actors to take a more prominent role in the on-chain
    and off-chain governance processes.


    Since a core added value of blockchain is to establish confidence in processes
    where there is a lack of it, the decision-making mechanisms may need to prioritize
    the involvement of the relevant actors and increase the level of transparency
    in the design and operation of blockchain applications. The challenge is establishing
    an inclusive decision-making mechanism that creates legitimacy in blockchain governance
    without deadlocking the system (e.g., Bitcoin block size debate). A democratic
    constitution of blockchain governance may be needed to establish the rules and
    roles of the verifiers, developers, and users of the system.


    # Incentive Mechanism


    In the Bitcoin whitepaper, Nakamoto (2008) introduced an incentive mechanism to
    ensure the continuous engagement of Bitcoin users in network maintenance. Both
    in Bitcoin and Ethereum blockchains, this mechanism relies on monetary rewards
    in the form of blockchain cryptocurrency, which aligns the individual rent-seeking
    behavior with the overall benefit of the platform. Alternatively, allocations
    of tokens and reputation scores that grant the users enhanced access to platform
    functions and weighted voting rights in decision-making processes can be some
    non-monetized rewards.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'Not only the methods of incentivizing but also the way that consensus protocols
    incentivize the miners and verifiers can have drastic implications for the overall
    blockchain governance. For instance, the PoW mechanism of Bitcoin, alongside the
    monetary incentive mechanism, has paved the way for the consolidation of mining.
    Consequently, big mining pools have emerged across the globe, and specialized
    hardware among miners has become widespread. Currently, it is estimated that four
    big mining pools on the Bitcoin network and two mining pools on the Ethereum network
    control over 50% of transactions (De Filippi and Wright 2018, 40). This consolidation
    of power undermines the distributed and decentralized features of blockchain networks,
    even for the big ones such as Bitcoin and Ethereum, and risks the legitimacy and
    trust invested in on-chain governance mechanisms.


    Another related governance decision is about the disincentivizing effect of transaction
    fees. Transaction fees are the cost of actions in a particular blockchain, such
    as transactions or executions of smart contracts (e.g., “gas” in Ethereum). The
    disincentivizing effect of transaction fees and the incentivizing effect of rewards
    to miners create the conditions of trade-offs and rational choice calculations
    for the users and miners to engage with blockchain. For instance, in May 2011,
    during the Dogecoin crisis and the rush in NFT projects, the transaction fees
    on the Ethereum network had increased seven-fold in a short period.* In case the
    cost outweighs the anticipated benefits of engagement, some blockchain applications
    can lose their attractiveness, or miners might find less value to support the
    blockchain altogether, adversely affecting the security of the blockchain (De
    Filippi and Wright 2018, 41).


    # Consensus Mechanism


    A consensus mechanism is at the core of blockchain-based systems to coordinate
    the decentralized actions of users in deciding which information can be added
    to the blockchain. Different consensus mechanisms exist, but most blockchains
    rely on either Nakamoto consensus (or PoW) that ties mining capability to computing
    power or Byzantine consensus that uses staking to assign miners, such as proof-of-stake
    (PoS) and delegated proof-of-stake (DPoS). There are also proof-of-authority (PoA)
    systems, where a lower number of nodes or master-nodes take the role of transaction
    validators. Each of these consensus mechanisms has advantages and disadvantages
    over others, and their affinity toward decentralized or centralized governance
    structures varies.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'PoW is mostly used in permissionless, public blockchains, such as Bitcoin and
    Ethereum,* where the users validate the transactions by solving complex mathematical
    puzzles through the computing power of the hardware. The advantage of the PoW
    system is its stability to deter cyberattacks (e.g., denial-of-service attacks)
    while maintaining a distributed system governance. However, its vulnerability
    to 51% attack, high energy cost, increasing centralization of mining operations,
    and low transaction throughput are some of the significant challenges for PoW-based
    systems. Especially, increased strain on the environment imposed by the high energy
    demand of PoW-based systems reduces their likelihood of preference for public
    sector projects.¹⁰


    In PoS, the mining power is attributed to nodes in the proportion of tokens (or
    coins) held by nodes instead of their computing powers. Node operators lock away
    a stake for the right to participate in block creation, and nodes with bigger
    stakes have higher chances to be selected to verify transactions. A transaction
    fee is paid to the node operator in return for the transaction verification. In
    the case of fraudulent transactions or any misbehavior, the node loses the right
    to participate in staking.


    The difference in DPoS is that the token holders choose a small number of nodes
    as delegates by staking tokens with different candidates. If the delegate is chosen
    for block creation, a fraction of the reward is allocated to those who voted for
    the delegate. In some systems, decision-making power is associated with the delegation
    of tokens where delegates may have the capability to monitor and amend network
    parameters such as fees, block size, block rewards, and the length of the transaction
    cycle (Karjalainen 2020). The advantage of PoS is that it is less susceptible
    to 51% attacks and more scalable with higher transaction throughput, but it is
    assumed as less secure than completely decentralized PoW systems (EdChain 2018).


    In PoA systems, unlike the PoS and PoW systems, the identity of the validator
    is known, and the assumption is that the reputation of the validator plays the
    role of stake. The advantage of PoA systems is that they can achieve much higher
    throughput as a result of the lower number of validators, and they are suited
    for both private and public networks. However, the downside is that PoA is not
    imbued with the sense of security derived from decentralized consensus mechanisms,
    and the nodes, therefore, need to be kept uncompromised. Hence


    * In 2020, Ethereum launched a series of upgrades called Ethereum 2.0, which includes
    a transition to PoS.


    † For example, during the initial design process of European Blockchain Services
    Infrastructure (EBSI), the European Commission announced its intention to avoid
    PoW for the anticipated system.'
