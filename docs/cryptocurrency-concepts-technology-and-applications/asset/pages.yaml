    # Buying and Selling Straddles


    A straddle contract involves a buy of both calls and puts at the same exercise
    price. This contract gives the holder the right, not the obligation, to buy or
    sell cryptocurrencies at a set exercise price (X) at and before the expiration
    date, no matter what happens to the price of the cryptocurrency. The strategy
    for buying both call and put options represents the view of buying against the
    price of the cryptocurrency’s volatility. This is a strategy in which the investor
    expects that, for example, Bitcoin will move significantly (scenario based) up
    or down based on a coming announcement.


    As an example, let’s say that the government will decide if they will use or not
    use Bitcoin as a major currency. If it’s approved, the Bitcoin price is expected
    to increase significantly, and the straddle holder will be exercising the option
    (supported by the call option side of the straddle) to buy it at the exercise
    price (X). If the government announces that it does not approve using Bitcoin
    as one of the acceptable currencies, then it is expected to significantly decline.
    The seller of a straddle is hoping that the news will not have as much as of an
    effect on the price of cryptocurrency and that it will stay within the break-even
    points.


    Of course, the best-case scenario for the seller of straddles and the worst-case
    scenario for the buyer of straddles is when the cryptocurrency expires at the
    exercise price (S = X). For example, let’s assume that the May call and put options
    for Bitcoin with an exercise price of $50,000 entitles its owner to buy or sell
    it at price of $50,000 at any time up until the third week of May (contract expiration
    date). If Bitcoin goes above $50,000 by the expiration day, the straddle option
    holder will exercise the right to buy it at $50,000, respectively, and get paid
    the difference. If Bitcoin goes below $50,000 by the expiration day, the straddle
    option holder will exercise the right to sell it at $50,000, respectively, and
    get paid the difference. To purchase the straddle option, the investor needs to
    pay both call and put premiums upfront. Figure 11.3 shows the payoff, profit,
