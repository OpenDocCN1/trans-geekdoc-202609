    a low exercise price and selling the call option with a high exercise price with
    the same expiration date. To remember this strategy, think of an investor who
    is bullish on the cryptocurrency. He or she will be buying cryptocurrency at its
    low price, anticipating selling it at a higher price in the future, as is the
    case for bull call spreads. The investor buys the low exercise call price and
    sells the high exercise price in the hopes that the cryptocurrency price will
    go up.


    Spread strategies such as bull call spreads are conservative strategies with maximum
    profit and maximum loss because an investor is giving up the significant upside
    to be protected on the downside. Figure 11.8 (on page 216) shows a bull call spread
