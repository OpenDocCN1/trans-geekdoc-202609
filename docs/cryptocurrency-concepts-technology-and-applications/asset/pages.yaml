  md: '# Chapter 6


    # Cryptocurrency Crime


    Arianna Trozze


    University College London


    # Introduction


    As cryptocurrencies have gained popularity since the creation of Bitcoin in 2008,
    so too has crime involving them risen. In 2021, victims lost approximately $14
    billion to cryptocurrency crime, an increase of 79% from the previous year (Chainalysis
    2022). This figure includes many, but not all, of the types of crime we discuss
    in detail in this chapter. Research from 2018 estimated that, at the time, 46%
    of all Bitcoin transactions involved illicit activity—attributed to 26% of all
    its users at the time—totaling $76 billion per year (Foley et al. 2019). Many
    of the crimes contributing to more recent figures also involve newer segments
    of the wider cryptocurrency space, such as decentralized finance (DeFi) and non-fungible
    tokens (NFTs).


    This chapter provides an overview of crimes involving cryptocurrencies. It first
    introduces the concepts of crypto-enabled and crypto-dependent crimes, which offer
    a framework for categorizing the types of crime discussed later in the chapter.
    It also describes the characteristics of cryptocurrencies which may facilitate
    their use by criminals. The chapter then gives an overview of the various types
    of crime that involve cryptocurrencies, including types of fraud, cyber-crimes,
    cryptocurrency mining crimes, money laundering, terrorism financing,'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'sanctions evasion, tax evasion, darknet marketplaces, bribery and corruption,
    and cryptocurrency-adjacent crimes. Finally, we consider crimes associated with
    particular areas of the larger cryptocurrency ecosystem—namely, DeFi and NFTs—and
    offer conclusions about cryptocurrencies and criminal activity.


    # Crypto-Enabled and Crypto-Dependent Crimes


    Many crimes committed involving cryptocurrencies are not new; criminals use cryptocurrencies
    to commit crimes like money laundering and fraud in new ways. Scholars, therefore,
    distinguish between crypto-enabled and crypto-dependent crime. Crypto-enabled
    crimes are merely facilitated by cryptocurrencies (for example, sanctions evasion
    or Ponzi schemes), while crypto-dependent ones require cryptocurrencies (for example,
    fake cryptocurrency services or cryptocurrency mining–related crimes). Criminals
    often commit crypto-enabled crimes in novel ways—for example, Ponzi schemes coded
    into smart contracts (Kamps et al. 2022; Trozze et al. 2022).


    # Characteristics of Cryptocurrencies That Facilitate Crime


    Cryptocurrencies’ characteristics make their use attractive to criminals. The
    ecosystem enjoys low barriers to entry (users merely require an internet-connected
    device). Cryptocurrencies are also pseudo-anonymous, and many cryptocurrency service
    providers do not collect anti-money laundering (AML) or Know Your Customer (KYC)
    information. Currently, no global, centralized authority regulates cryptocurrencies,
    further incentivizing their use. Both international and domestic cryptocurrency
    transactions are low-cost and irrevocable. Their security may also entice criminals.
    Finally, the most secure way to store cryptocurrencies is using a hardware wallet
    no larger than a flash drive, making them much less cumbersome to transport than
    physical cash (Kethineni and Cao 2020).


    # Types of Cryptocurrency Crimes


    There is evidence of cryptocurrencies’ use in various types of fraud, including
    fraudulent investment schemes, market manipulation, social-engineering'
