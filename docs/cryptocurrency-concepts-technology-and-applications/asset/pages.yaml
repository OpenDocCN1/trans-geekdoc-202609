  md: '# Chapter 4


    # Global Central Bank Digital Currency Research and Developments: Implication
    for Cryptocurrency


    Peterson K. Ozili


    Central Bank of Nigeria


    # 4.1 Introduction


    Central bank digital currency (CBDC) is part of the ongoing change and disruptive
    financial innovation occurring in the modern financial system. Historically, financial
    innovation lies within the realm of private sector agents such as regulated financial
    institutions and financial technology companies. They develop innovative ideas
    and create innovative financial products which the central bank or the regulator
    may approve or disallow. This means that the originator of disruptive financial
    innovations are primarily private sector agents, not the central bank. This historical
    understanding is important because it helps to understand why issuing a CBDC is
    a significant venture for any central bank because issuing'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'a CBDC presents an opportunity for central banks to innovate, even though central
    banks are not innovative by nature.


    Discussions about CBDC first emerged in 2017. Policy and academic discussions
    about CBDC became popular in mid-2019 and during the 2020–2022 COVID-19 pandemic.
    During this time, there was optimism that CBDC would present an opportunity for
    a central bank to innovate and expand the usefulness of money as a medium of exchange,
    a payment alternative, and a tool to improve the conduct of monetary policy. Other
    widely acknowledged benefits of issuing a CBDC include its potential to facilitate
    cross-border payments, decrease cash management costs, increase financial inclusion,
    and offer a relatively low transaction cost on CBDC financial transactions (Mancini-Griffoli
    et al. 2018; Ozili 2022a).


    To fully understand why CBDC exists today, we need to understand the meteoric
    rise in cryptocurrencies. The first cryptocurrency was developed in 2008. Since
    then, cryptocurrency began to gain traction from 2012 to 2017 and rose to prominence
    globally in 2019. Large volumes of financial activities were carried out using
    cryptocurrencies, also known as private digital currencies. The uncontrollable
    rise of many cryptocurrencies, their widespread usage by members of society, and
    their ability to evade all forms of regulation became a major concern for financial
    system regulators in many countries (Ozili 2022b).


    Regulators and central banks had serious concerns that cryptocurrency activities
    might pose systemic risks to the financial system and threaten financial stability
    (Kim and Kwon 2022). The perceived threat from cryptocurrency activities gave
    central banks an added motivation to take seriously the possibility of issuing
    a central bank digital currency as a counter-reaction to the rise of cryptocurrency
    (Berentsen and Schär 2018). Since then, many central banks have announced that
    they are researching CBDCs, while other central banks have stated that they will
    launch a pilot CBDC project sooner or later (Barontini and Holden 2019).


    Central banks’ push to issue and adopt CBDC have been met with mixed reactions.
    Some think that central banks do not have the technological sophistication that
    is needed to develop and operate a CBDC in a sustainable way (Panetta 2018). Others
    argue that since existing money alternatives, such as debit cards and credit cards,
    are working very well, a lot of people will not use CBDC if a central bank issues
    it as a payment alternative; therefore, there is no strong reason for a central
    bank to do so (Emery 2019). Others also argue that existing legal and political
    bottlenecks may frustrate the effort of central banks in developing a CBDC (Bossu
    et al. 2020).


    Despite the potential benefits and bottlenecks that may be encountered by central
    banks in issuing and adopting a CBDC, there is no doubt that CBDCs are fast becoming
    a necessary invention or innovation that cannot be resisted for too long. Central
    banks that are not interested in issuing a CBDC now will'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'eventually become interested in issuing a CBDC later—it is only a matter of
    time. The question that needs to be asked is whether CBDC can coexist with cryptocurrency
    or whether cryptocurrency either has to be banned in order to allow CBDC to thrive
    in society at the expense of cryptocurrency or should be regulated, which means
    it will lose some of its anonymity features.


    But to answer these questions, there is a need to first understand what a CBDC
    is in terms of definitions and in comparison to cryptocurrency. It is also important
    to identify the important CBDC research in the world as well as the factors influencing
    CBDC issuance and adoption. The purpose of this chapter is to present a discussion
    of central bank digital currency. The chapter begins with the definition of CBDC
    and compares CBDC with cryptocurrency. It also reviews the recent CBDC research
    in the literature and offers a global perspective on the state of CBDC research
    in the world. Thereafter, it identifies the factors influencing CBDC issuance
    and adoption. Finally, the chapter draws some implications of recent CBDC development
    for cryptocurrency.


    CBDC research is growing in the literature, although it still represents a small
    part of the financial innovation literature. Notable studies in the recent CBDC
    literature include Kim and Kwon (2022); Allen et al. (2020); Auer and Böhme (2020);
    Ward and Rochemont (2019); Ozili (2022a); and Agur, Ari, and Dell’Ariccia (2022).
    Much focus in the CBDC literature has been placed on CBDC design and how CBDC
    can be used for retail and wholesale purposes (see, for example, Allen et al 2020;
    Auer and Böhme 2020; Agur, Ari, and Dell’Ariccia 2022; Ward and Rochemont 2019).


    Policy studies in the literature have examined the benefits of using cash and
    CBDC together rather than using only CBDC or cash (see, for example, Davoodalhosseini
    2021; Armelius, Claussen, and Hull 2021). Other studies identified the risks that
    CBDC would pose to the stability of the financial system, such as a possible run
    on commercial bank deposits and cybersecurity risks (see, for example, Kim and
    Kwon 2022; Bindsell 2020).


    More importantly, several studies stress the need for collaboration among central
    banks in developing an effective central bank digital currency, which also provides
    an opportunity for central banks to learn from each other (Barontini and Holden
    2019).


    The discussion in this chapter contributes to the literature in the following
    ways: it offers a perspective on the need for CBDC, it identifies and discusses
    the global CBDC research around the world, and it identifies CBDC as an innovation
    designed to either coexist with cryptocurrency or to counteract the growth of
    cryptocurrency.


    The rest of the chapter is organized as follows: Section 2 presents the conceptual
    background, defines CBDC, and describes the similarities and differences between
    CBDC and cryptocurrencies. Section 3 presents a review of recent CBDC'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'research and the research in various regions of the world. Section 4 draws
    some implications for cryptocurrency. The conclusion is presented in Section 5.


    # 4.2 Conceptual Background


    This section presents a simple definition of central bank digital currency. It
    also presents some technical definitions of CBDC in the literature. The similarities
    and differences between CBDC and cryptocurrencies are presented in this section.


    # 4.2.1 CBDC Definitions


    In simple terms, CBDC is the electronic form of fiat money. There are technical
    definitions of CBDC in the literature. For instance, Meaning et al. (2018, 4)
    defined CBDC “as an electronic, fiat liability of a central bank that can be used
    to settle payments or as a store of value.” Kiff et al. (2020, 9) defined CBDC
    as “a digital representation of a sovereign currency issued by a central bank
    and is a liability of a jurisdiction’s central bank or other monetary authority”
    (paraphrased). Ward and Rochemont (2019, 3) defined a CBDC as “a digital form
    of central bank money that is different from balances in traditional reserve or
    settlement accounts.” Kumhof & Noone (2018, 4) defined CBDC as “electronic central
    bank money that (i) can be accessed more broadly than reserves, (ii) potentially
    has much greater functionality for retail transactions than cash, (iii) has a
    separate operational structure to other forms of central bank money, allowing
    it to potentially serve a different core purpose, and (iv) can be interest bearing,
    under realistic assumptions paying a rate that would be different to the rate
    on reserves.”


    # 4.2.2 Similarities and Differences Between CBDCs and Cryptocurrencies


    One similarity between CBDCs and cryptocurrencies is that they are are both electronic
    forms of money. Secondly, they are both delivered on blockchain and distributed
    ledger technology. Thirdly, they can both be used privately to facilitate transactions
    where both parties agree to do so.


    The differences between CBDCs and cryptocurrencies are as follows:


    +   - CBDCs are a broad range of digital currencies issued by central banks, while
    cryptocurrencies are a broad range of privately issued digital assets or privately
    issued digital currencies (Richards 2021; Ozili 2022a).'
  merge: -1
  img_proc: true
- pgno: 89
  md: '+   - The value of CBDC is always pegged to a ratio of 1:1 with the physical
    currency equivalent, while most cryptocurrencies are not pegged to a ratio of
    1:1 with any physical currency, excluding stablecoins (Klein, Gross, and Sandner
    2020).

    +   - CBDCs are denominated in the currency of the sovereign issuer, while cryptocurrencies
    are not.

    +   - CBDCs are backed by the issuing central bank and rely on trust in the central
    bank or the government, while cryptocurrencies are not backed by any issuer and
    they rely on users’ trust in the software protocol that controls the system (Kiff
    et al. 2020).

    +   - All CBDC can be used as perfect money substitutes, while cryptocurrencies,
    including stablecoins, are not perfect money substitutes because they do not have
    the key attributes of money: they are rarely used or accepted as a means of payment
    for retail purchases in everyday life, they are not used as a unit of account,
    and their prices are often volatile (Richards 2021).


    # ## 4.3 CBDC Research and Developments around the World


    This section presents a concise overview of recent central bank digital currency
    research and developments in several regions of the world. It also shows interest
    in information about CBDC relative to cryptocurrency.


    # ## 4.3.1 Recent CBDC Research in the Literature


    Recent CBDC studies, such as Virtanen (2021), show that a major factor driving
    the global interest in CBDC is the decline in cash usage and the need for better
    settlement systems. Khiaonarong and Humphrey (2022) confirm this claim in their
    empirical analysis. They examined 25 countries from 2012 to 2019 and showed that,
    prior to CBDC adoption, the use of cash for payments had been declining over the
    years. They argue that the observed reduction in cash use across countries can
    speed up the adoption of retail CBDC if central banks issue them.


    Other recent studies in the literature identify the benefits of issuing CBDC,
    such as reduced transaction cost, decrease in tax evasion, decrease in financial
    crime, greater financial inclusion, greater protection against illegal activity,
    lower cost of migrants’ remittances, lower seigniorage cost, improved conduct
