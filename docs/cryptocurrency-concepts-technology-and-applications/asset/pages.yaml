  md: 'cases of malfeasance or loss. By not treating cryptocurrency as subject to
    existing financial supervision, some countries leave the onus on users to engage
    with it, but at their own peril. The clarification to be made here is that, while
    governments in Level 3 may not consider cryptocurrency to be a proper form of
    money for the purposes of financial supervision, this does not mean that licenses,
    registrations, and other forms of bureaucratic boxes mustn’t be checked; rather,
    it simply means that cryptocurrency often falls under alternate guidelines or
    outside the guidelines that are intended for the traditional financial sector.


    Level 4 in Table 8.1 is a more constricted form of tolerance, wherein cryptocurrencies
    might be allowed for some purposes but not others. For example, a country may
    allow the possession and trading of crypto but forbid mining (Russia), allow ownership
    but restrict payability in transactions (Indonesia), or allow people to mine and
    transact in crypto but not via traditional banking channels (Cambodia). It is
    worth mentioning here that regulations are subject to change, and what is being
    observed as of this writing may change in due course.


    Level 5 in Table 8.1 is a peculiar case in which a country does not have official
    guidelines or statements regarding cryptocurrency, pursuant to further evolution
    in the space. Pakistan is a noteworthy case in this regard, since the State Bank
    (the monetary authority) does not comment decisively on cryptocurrency, even though
    the volume of trade in cryptocurrency might exceed tens of billions of dollars
    (Chohan 2017a). This “strategic ambiguity” allows the State Bank of Pakistan to
    avoid domestic and international pressure (from the FATF, for example), particularly
    since other AML/CFT concerns are continually (and perhaps excessively, for political
    reasons, see Chohan 2020) raised in the country’s context.


    Beyond this, there are Level 6 countries in Table 8.1 in which cryptocurrencies
    are simply prohibited for all purposes: ownership, mining, transactions, and everything
    else. Bolivia and Nepal are smaller economies that have adopted this stance, but
    the most prominent economy to do so is China, which has instead piloted a central
    bank digital currency (CBDC) (as digital yuan) as a centrally governed digital
    currency. CBDCs are discussed in further detail in the next section, but it is
    worth mentioning here that they do differ substantially from cryptocurrency as
    they are typically understood.


    Countries that ban cryptocurrency entirely tend to cite the issues raised in the
