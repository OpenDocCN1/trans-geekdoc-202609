- pgno: 167
  md: '# # Chapter 8


    # # Regulatory and Legal Issues in Cryptocurrencies


    Usman W. Chohan


    Centre for Aerospace & Security Studies (CASS)


    Islamabad, Pakistan


    # ## Introduction


    The aims of this chapter are (1) to examine the legality of cryptocurrency across
    various jurisdictions, and to (2) consider the salient legal issues that impact
    the cryptocurrency space. This is a difficult exercise on several levels, since
    there is considerable variation among countries in terms of their tolerance for
    crypto and at times the shifting attitude among regulators toward crypto; and,
    perhaps most importantly, there is a growing litany of concerns about criminality
    and ill intent among some portion of the cryptocurrency community (Larkin et al.
    2021; Corbet et al. 2020; Sanz-Bas et al. 2021; Smith 2019; Dyntu and Dykysi 2018).*


    One must, therefore, write such a chapter with the recognition that, although
    a universal ban on cryptocurrencies now seems (nearly) out of the question, the


    * To make it more accessible, the tenor of this chapter is tailored toward an
    informed but non-specialist audience, and it therefore avoids the excessive use
    of specialist jargon from the fields of computer science, law, or economics.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'finer points of legal attitudes and regulatory actions risk changing markedly
    over time (Matei and Baks 2019). At the same time, there are efforts to harmonize
    international responses toward cryptocurrency regulation (Chohan 2021a), but they
    face hindrances based on legal precepts (Bailey et al. 2021), regulatory sophistication
    (Irina 2018), financial oversight capabilities (Chohan 2019, 2022a), economic
    conditions (Szwajdler 2021), and sociocultural norms (Busse et al. 2020; Ben Saad
    et al. 2022) that come in a great variety around the world.


    On this point, it is worth explicitly mentioning that this chapter assumes the
    reader to have a rudimentary knowledge of cryptocurrency, which is otherwise covered
    in the various chapters of this volume, in addition to useful reviews for non-experts
    elsewhere (see Chodhury 2019; Nica et al. 2021; Kher et al. 2021; Chohan 2017a).
    The world of cryptocurrency is evolving at a rapid pace, and it is difficult for
    regulators (or anyone else, for that matter) to remain abreast of the breakneck
    pace of change in a specialist field of considerable technical sophistication
    (Garcia-Corral et al. 2022; Matei and Baks 2019; Bailey et al. 2021).


    Regulatory responses to cryptocurrency have consistently been described as reactive
    (Chohan 2017a, b), and this problem is inherent since one can never prejudge the
    path dependency of decentralized and amorphous technologies (Szwajdler 2021).
    In addition, one cannot shrug away the fact that cryptocurrency is an especially
    lucrative domain—with a market capitalization that approximates $2.5 trillion
    as of this writing—which is a quantum of wealth large enough to keep the stakes
    high for criminals, private institutions, ordinary citizens, and governments alike
    (Corbet et al. 2020; Ben Saad et al. 2022).


    With all this in mind, and given the constraints of brevity in covering such a
    vast topic, the chapter is structured as follows: First, I highlight the primary
    legal concerns that apply to all jurisdictions grappling with cryptocurrencies,
    specifically those concerns which pertain to various types of criminality. Second,
    I consider the differing legal treatments of cryptocurrencies along a spectrum
    (mostly-to-least tolerant) and assign various jurisdictions along that spectrum
    accordingly. Finally, I discuss international efforts to harmonize cryptocurrency
    regulation and oversight and offer some prognostications about the future of cryptocurrency
    legality in light of aforementioned issues.


    # Major Legal Concerns in Cryptocurrency


    This section covers broad categories of legal concern regarding cryptocurrency,
    particularly in terms of their attenuation toward various degrees of criminality
    as would be understood in most jurisdictions. These include hacks and thefts,
    frauds and scams, money laundering and tax evasion, and terrorist financing and'
