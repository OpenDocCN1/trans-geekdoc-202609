  md: 'expiration date. To remember this strategy, think of an investor who is bearish
    on cryptocurrency; he or she will be shorting or selling the cryptocurrency at
    its high price today and buying the cryptocurrency back at a lower price in the
    future, as is the case for bear put spreads. The investor buys the high exercise
    put price and sells the low exercise price in the hopes that the cryptocurrency
    price will drop. Spread strategies such as bear put spreads are conservative strategies
    with maximum profit and minimum loss because the investor is giving up the significant
    upside of the cryptocurrency’s going down to be protected on the downside if it
    goes down.


    Figure 11.9 (on next page) shows a put bear spread strategy in which the investor
    buys the 60,000 June puts, paying a $14,110 premium, and sells the 40,000 June
    puts, receiving a $2,500 premium, calculating a net premium paid of $11,610. The
    investor in this case is bearish, expecting the price of Bitcoin to drop lower
    than $40,000 to maximize the $9,390 per Bitcoin ($20,000 – $11,610). Obviously,
    if the price of Bitcoin increases above $60,000, the maximum loss will be capped
    at $11,610. The break-even price of Bitcoin is calculated at $48,390 ($60,000
    – $11,610). Figure 1.9 shows the payoff, profit maximum profit, and maximum loss
    at various Bitcoin prices.


    # Bull Put Vertical Spreads


    Bull put spreads are vertical spreads that involve buying a put option with a
    low exercise price and selling a put option with a high exercise price with the
    same expiration date. Like the bull call spreads previously discussed, this strategy
    is bullish, even though the investor is buying put options. Bull put spreads sound
    like mixed thinking, as typically an investor who buys puts has a more pessimistic
    view on the cryptocurrency while the spread is called bull, which represents an
    optimistic strategy. The strategy here, though, is still bullish. The investor
    is hoping that the cryptocurrency stays high so the options are not exercised,
    and the investor can keep the net premium received.


    In all spread strategies where there is contradiction between puts and bulls or
    calls with bears, the net proceeds are received by the investor. Figure 11.10
    shows a bull put spread strategy in which the investor buys the $30,000 April
    puts, pays a $90 premium, sells the $50,000 April calls, and receives a $4,200
    premium, calculating a net premium received of $4,110. The investor in this case
    is bullish, expecting the price of Bitcoin to go up or stay higher than $50,000
    to keep the $4,110 per Bitcoin proceeds he or she received. Obviously, if the
    price of Bitcoin drops below $30,000, the maximum loss will be capped at $15,890
    ($30,000 – $50,000 + $4,110). The break-even price of Bitcoin is calculated at
    $45,990 ($50,000 – $4,110). Figure 11.10 shows the payoff and profit at various
    Bitcoin prices.'
