- pgno: 179
  md: 'architecture that underpins these types. Traditional cryptocurrency may, however,
    be supplanted or significantly marginalized in such circumstances (Viñuela et
    al. 2020; Pocher and Veneris 2021).


    # # Concluding Remarks


    Cryptocurrency was originally intended as something lying outside the purview
    of traditional financial/legal systems (Chohan 2017c, 2019a). Yet its wider adoption,
    ever-increasing complexity, and lucrative nature have amplified the stakes for
    all participants in the field, not least the regulators. At the same time that
    their popularity has grown, a string of nefarious criminal acts have also been
    found closely associated with a minority of cryptocurrency actors.


    These acts are of sufficient severity as to mobilize legal and regulatory institutions
    to curtail the possible public value destruction from such activities (Chohan
    2022a). Hacks, thefts, frauds, scams, money laundering, tax evasion, terrorist
    financing, and rogue state and non-state actions all raise considerable alarm
    among regulatory public managers. They also bring what is otherwise a promising
    area of intellectual, numismatic, technological, and monetary innovation into
    disrepute.


    Countries have responded to the emergence of cryptocurrency in a variety of ways,
    from extreme positivity to outright hostility. Their responses may vary with time,
    as new events shape their regulatory postures. Yet while they grapple with this
    new technology at a national or subnational level, the truth about virtual assets
    is that they are transboundary in nature and therefore require concerted international
    action. This is easier said than done, given that the present system of international
    regulation is highly distorted and imperfect in many ways. However, efforts are
    being made to harmonize regulation.


    But a larger factor which looms over the subject is that nations may introduce
    sovereign substitutes to the decentralized cryptocurrencies (CBDCs), which would
    resolve (to a degree, at least) many of the criminal aspects of cryptocurrency
    abuse.


    Nevertheless, the pace of innovation in the cryptocurrency space, and the lucrative
    nature of its dealings, lead one to surmise that the dialectic between the agents
    and the regulators (Dupuis and Gleason 2020) will continue to evolve, and at a
    continually feverish pace.


