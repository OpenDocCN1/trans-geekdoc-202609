  md: 'inherently ineffective, given that the Russians can bypass them with cryptocurrency
    as a primary medium (see Flitter and Yaffe-Bellany 2022). The wherewithal that
    state, semi-state, and non-state actors possess means that cryptocurrency faces
    a political backlash beyond the technocratic arguments for financial stability
    (Prosek et al. 2021), and this puts further pressure on lawmakers and regulators
    to reassess their tolerance toward cryptocurrency regulation.


    # # A Spectrum of Regulatory Responses


    In light of the foregoing discussion about the various forms of illegal and criminal
    activity to which cryptocurrencies are made subject, one may observe a spectrum
    of legal attitudes toward cryptocurrency as an asset class and medium of exchange
    (Chohan 2017a, b). As noted earlier, this variety of attitudes can be explained
    by a multitude of factors, including legal precepts (Bailey et al. 2021), regulatory
    sophistication (Irina 2018), financial oversight capabilities (Chohan 2019, 2022a),
    economic conditions (Szwajdler 2021), and sociocultural norms (Busse et al. 2020;
    Ben Saad et al. 2022), all of which differ among countries.


    There are some countries which are favorably disposed to cryptocurrency but expect
    it to fall within a reasonable ambit of regulation (U.S. and Canada being prime
    examples). Then there are a few countries which either have considered or which
    are considering the treatment of cryptocurrency (or at least Bitcoin) as an entirely
    legal instrument at par with their sovereign monetary issuance (with El Salvador
    at the vanguard).


    There are yet some countries which maintain a deliberate ambiguity about the legality
    of cryptocurrency and await further legal and technological developments to inform
    their considered opinion while remaining aloof from international pressures (Pakistan
    is a prime example). At the same time, some countries have swayed from once exhibiting
    a level of tolerance to later enforcing outright bans (China), but have sought
    alternatives such as Central Bank Digital Currencies (CBDCs).


    Conversely, some other countries which once banned cryptocurrencies have moved
    toward their reinstatement subject to a regulatory framework (e.g., India). Still
    other countries have partial restrictions on cryptocurrency use, whether stopping
    it as a means of payment while tolerating it as a store of value (Indonesia) or
    stopping banks from processing cryptocurrency transactions (Cambodia), among other
    iterations. The various typologies of cryptocurrency legality are laid out in
    Table 8.1.


    Although it is beyond the scope of this chapter to examine each of the typologies
