    # Collars


    A collar option strategy is one in which holders of cryptocurrency want to hedge
    their downside by giving up the upside. In previous sections that discussed protective
    puts, the investor obtained a protective put to hedge his or her investment in
    case the cryptocurrency declines, but it costs money to buy put options. The collar
    option strategy is customized to minimize or eliminate the premiums paid to buy
    puts by selling calls at a much higher level of cryptocurrency. Basically, collars
    are a combination of protective puts and covered calls.


    Figure 11.6 shows an example in which the investor holding one Bitcoin with a
    current price of $47,000 wants to set up a floor to cap his or her losses at $30,000
    by buying the May puts. The June puts cost $900 per Bitcoin. The investor scans
    the pricing page and finds that the June $60,000 calls is $1,530. Given that the
    premiums match, he or she enters a collar option contract and buys the June $30,000
    puts and sells the $60,000 calls, netting the premiums and receiving $630 ($1,530
    – $900). Figure 11.6 shows the HPR of Bitcoin at various scenarios of the cryptocurrency
    (using a range of $10,000–$100,000).


