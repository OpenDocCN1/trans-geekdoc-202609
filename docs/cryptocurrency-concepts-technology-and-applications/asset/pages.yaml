    # Macro-Level Governance


    Macro-level governance focuses on the rules and norms that affect the power distribution,
    coordination, and control across the blockchain network. More specifically, how
    the decision-making rights are distributed across network actors, what type of
    accountability mechanisms are in place, and who controls and oversees the implementation
    processes fall under the scope of macro-level governance.


    # Power Distribution


    Power distribution in a blockchain network takes shape in different degrees of
    decentralization. Centralized governance happens when a specific group of people
    or organizations make the governance decisions, and the decision-making processes
    can be organized through off-chain or on-chain processes.


    A semi-centralized or hybrid governance happens when some governance decisions
    (e.g., conflict resolution) are taken only by a centralized board of directors,
    and some other governance decisions (e.g., concerning the network of users or
    platform functions) can be taken with an additional on-chain voting procedure
    by the platform users.


    Polycentric governance occurs when different clusters of actors (e.g., miners,
    developers, nodes) hold different roles and responsibilities in blockchain governance,
    and governance necessitates taking into account what the others are doing (Stephan
    et al. 2019).


    Decentralized governance happens when decision-making processes are not dominated
    by a single actor or a group of actors; rather the decisions are taken by the
    majority of users operating in the blockchain network, either through on-chain
    voting processes or coordinated mining action. Here the choice architecture of
    voting processes and the openness of propositions to the public may influence
    the decentralized nature of the governance structure. Furthermore, in open-source
    decentralized systems, improvement proposals and DApps can be introduced directly
    by network users without the interference of an intermediary actor (e.g., developers).


    It is important to underline that certain organizational structures may have different
    affinities for particular governance choices at micro or meso levels. For example,
    while centralized governance might be more suitable for permissioned blockchain-based
    systems, polycentric or decentralized governance may be more'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'suitable for permissionless systems. Or, while PoA may be more suitable for
    semi-centralized systems, PoS and PoW may be more suitable for polycentric or
    decentralized systems.


    It is also possible that the power relations of actors may alter an initially
    different-looking governance structure into another. For example, if on-chain
    governance processes in PoW or PoS-based systems are dominated by a few large
    operators who control most of the mining resources and/or token holdings, an initial
    decentralized governance structure may act as a semi-centralized or polycentric
    governance structure. Or, if off-chain governance processes are dominated by a
    few specialized influential players, a centralized governance structure may act
    like a semi-centralized or polycentric structure.


    # Accountability Mechanism


    Accountability is about how rules in governance (e.g., dispute resolution, change
    management) are regulated and enforced. Following Treib et al.’s typology (2007),
    four forms of accountability mechanisms can be identified in blockchain governance:
    coercion, voluntarism, targeting, and framework regulation. These four types are
    distinguished along two dimensions: the type of instruments applied (legally binding
    legislation or soft law) and the approach to enforcement (flexible or rigid).


    Coercion is characterized by binding regulative instruments prescribing detailed
    and fixed standards in the implementation. In the blockchain context, coercion
    can be captured by the concept of lex cryptographica (de Filippi and Wright 2018).
    Lex cryptographica means that the rules of exchanges are inbuilt codes, and as
    such code becomes the law in blockchain governance. Through the use of smart contracts,
    rewards and sanctions are executed automatically, creating a deterministic system
    of governance. The challenge with transposing law into code is that codes are
    written ex-ante, in strict and formalized language, and therefore, code-based
    rules need to be predictable and leave no room for interpretation (de Filippi
    and Wright 2018). This inherently limits the applicability of code-based rules
    in areas where the contingencies and conditionalities cannot be determined a priori.


    Voluntarism is based on legally non-binding instruments and defines broad goals
    in implementation. In the blockchain context, this mode of governance is captured
    by soft forks. A soft fork does not change the structure of blockchain, but it
    modifies the functions of blockchain. The implementation of a soft fork relies
    on the coordinative action of the majority of users to implement the suggested
    changes. The changes enter into force only if the majority of the network’s mining
    power adopts them. Otherwise, the soft fork fails, and the old chain remains unchanged.
    In the case of political dissonance among different groups'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'of users in a blockchain network, a soft fork presents a flexible instrument
    to modify the system. For example, when no political consensus was achieved among
    the blockchain community to change the Bitcoin block size (i.e., the 1-megabyte
    rule), a segregated witness through a user-activated soft fork was used. Given
    that the consensus rules of Bitcoin are controlled by the economic majority, the
    economic majority was able to activate segregated witness on their own, bypassing
    the blocking miners.


    Targeting uses non-binding recommendations, but unlike voluntarism, it relies
    on detailed descriptions for regulations. In the blockchain context, targeting
    practices are often used for the introduction of improvement proposals and DApps
    in a blockchain network. Through improvement proposals (e.g., BIPs), anyone can
    suggest software changes, which are subsequently evaluated and debated by the
    network community. If the proposal reaches community consensus, it is considered
    final. In the implementation of improvement proposals, users exercise agency in
    deciding whether or not to install new software.


    Finally, framework regulation creates binding rules for users, but unlike coercion,
    users have freedom of choice whether or not to accept the policy options. This
    accountability mechanism in the blockchain context is best captured by hard forks.
    A hard fork occurs when a rule change is adopted in blockchain protocol and the
    nodes of the newest version of a blockchain no longer accept the older version
    of the blockchain. In the case of a hard fork, all nodes are meant to work by
    the new rules to upgrade their software. Otherwise, a permanent split from the
    previous version of the blockchain occurs, and resulting in two different blockchains
    being created.


    A famous case of a hard fork occurred in the Ethereum blockchain following the
    DAO hack in 2016, where $50 million worth of funds held by the platform was hijacked
    by exploiting a bug in the system (Finck 2018). Following the hack, a philosophical
    debate broke out in the community about the right course of action. The non-intervention
    faction argued that changing the code would undermine the immutability of the
    code and thereby the “code is law” notion of the governance system. The others
    argued for rewriting the transaction history by creating a hard fork in the system
    to reduce the likelihood of judicial action. Eventually, a hard fork was accepted
    by the majority of the miners, creating effectively a new chain based on the older
    version of the transaction history before the hack occurred (Finck 2018). Yet
    the split resulted in the creation of two blockchains—namely, Ethereum Classic
    and Ethereum.


    # Control Mechanism


    The last macro-level governance question is about what type of control mechanisms
    are placed in the implementation of decisions and to what extent the'
