- pgno: 21
  md: '# Preface


    In 2012, *Forbes* had a cover story that the Data Scientist is the “Sexiest Job
    of the 21st Century.” Even though data science has certainly grown in stature
    over the years, and the demand for data scientists still outstrips the supply
    of data science talent, a new “hot” player has recently entered the market to
    vie for this new title. The new player is the “Cryptocurrency” or Digital Currency
    Analyst.


    Whatever I read, as of late, has something about Bitcoin, crypto zone, cryptocurrency,
    blockchain, digital assets, and the like. Whether the source is more industry-based
    or academic research, there certainly appears to be a growing interest in the
    field of cryptocurrency.


    *The New York Times* had a cover story on March 24, 2022, titled “Time to Enter
    the Crypto Zone?,” and they talked about institutional investors pouring billions
    into digital tokens, salaries being taken in Bitcoins, and even Bitcoin ATMs in
    grocery stores. Certainly, we have seen ups and downs in crypto, but it has a
    kind of alluring presence that tempts one to include crypto as part of one’s portfolio.
    Those who are “prime crypto-curious” investors are usually familiar with the tech/pop
    culture and feel they want to diversify a bit in this fast-moving market.


    Even universities are beginning to offer more courses and create “Centers on Cryptocurrency.”
    Some universities are even requiring their students who take a crypto course to
    pay the course tuition via cryptocurrency.


    With this growing interest and fascination about the crypto industry and cryptocurrency
    in general, I felt it was appropriate timing to assemble a book with many leading
    worldwide contributors to discuss the concepts, technologies, and issues associated
    with cryptocurrency. As such, we are covering a wide array of crypto-related topics,
    including blockchain, NFTs, data analytics and AI, crypto crime, crypto industry,
    crypto regulation, options, crypto and public choice, consumer confidence, Bitcoin
    et al., crypto research challenges and opportunities,'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'and others. We present various viewpoints on where this cryptoindustry is heading
    and point out both the advantages and limitations of this emerging field.


    Further evidence of the importance of crypto was demonstrated by the White House''s
    moving toward developing a policy approach on crypto. On March 9, 2022, President
    Biden signed an executive order on “Ensuring Responsible Development of Digital
    Assets.” The European Union, as of March 25, 2022, is also well on its way to
    passing the landmark regulatory framework Markets in Crypto Assets (MiCA) for
    governing crypto assets.


    Thus, the time is ripe for publishing this book! I would like to thank the wonderful
    contributors to this book, as well as the reviewers and those at Taylor & Francis
    for all their helpful assistance and to Theron Shreve and Susan Culligan of DerryField
    Publishing Services for their help in production. In addition, I would like to
    thank both Seton Hall University and Columbia University (my new home) for allowing
    me to think creatively in exploring this emerging topic. And, of course, my wife
    and family continue to give me the energy and love to make it all worthwhile!


    Jay Liebowitz, D.Sc.

    Executive-in-Residence for Public Service

    Columbia University Data Science Institute'
  merge: -1
  img_proc: true
