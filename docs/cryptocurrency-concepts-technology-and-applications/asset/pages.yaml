  md: 'Another (more collaborative) approach is that led by the U.S. Department of
    Justice (DoJ 2020), which asks for the cooperation of agencies both inside and
    outside the U.S. to work together on targeting specific violators (usually the
    most dangerous parties). The DoJ''s law enforcement–centered approach is inherently
    reactive and requires considerable will on the part of other institutions to be
    forthcoming in cooperation, but it does strike at the heart of the most egregious
    players who pose the greatest regulatory risk.


    Other major multilateral institutions have also engaged with cryptocurrency regulation,
    such as the United Nations, the IMF, and the World Bank. However, their efforts
    are comparatively lackluster. By contrast, the G20 central bankers have been working
    together, along with the Bank of International Settlements (BIS) and the FATF,
    to develop ways to cooperate on cryptocurrency harmonization. The G20 central
    bank efforts are likely to provide the most concrete results in due course regarding
    regularization of standards on cryptocurrencies, since central bankers have the
    highest stake in the macrofinancial/macroprudential stability and are also armed
    with the maximum wherewithal to take action (see Nabilou and Prum 2019; Chohan
    2021a, 2022b). As such, because of their role in financial stability and oversight
    (Chohan 2020), central banks are seen as key national institutions in the cryptocurrency
    regulatory domain at the international level (Nabilou and Prum 2019).


    That said, central bankers may face a conflict of interest in developing mutually
    recognized global guidelines, given that their own offices might be pursuing powerful
    alternatives to existing cryptocurrency, most notably in the form of CBDCs. CBDCs
    may resemble cryptocurrencies in the sense that they are *virtual assets* (FATF
    2019), but their philosophical underpinnings and practical implications differ
    significantly. For one, cryptocurrency is inspired by the *cryptoanarchist* ethos
    (see review in Chohan 2017c), which argues for decentralized, empowering, autonomous
    approaches to financial liberation in cyberspace, detached from the shackles of
    government oversight. Central banks, as the issuing authority for CBDCs, would
    have disproportionate control on monetary dynamics (Yuxuan et al. 2018) and surveillance
    and privacy (Pocher and Veneris 2021). Depending on the legislation that governs
    central banks, these issues may raise legality and monetary questions of their
    own.


    The counter-argument in favor of CBDCs is that the problems listed earlier in
    this chapter (hacks and thefts, frauds and scams, AML/CFT, tax evasion) are much
    better addressed through proactive and direct central bank oversight, perhaps
    even more so than with the current financial system, although challenges may occur
    in the incipient phases of implementation (Brunnermeier and Niepelt 2019; Viñuela
    et al. 2020). Insofar as regulatory attitudes are concerned, the countries that
    fall into Levels 4–6 of Table 8.1 may feel more comfortable gravitating toward
    Level 2 or 3 as CBDCs come into effect, given the sovereign monetary authority
    and legal'
