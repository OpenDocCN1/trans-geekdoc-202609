    In Table 7.1, we can see a quick comparison of the travel rule as mandated by
    the Bank Secrecy Act and under the FATF and the required information.


    Even cross-border transactions below the USD/EUR 1,000 threshold must include
    the names and account numbers of the originator and beneficiary, but those will
    not be verified unless there is a suspicion of money laundering or terrorist financing.
    The travel rule involves the careful handling of data, the need for privacy, and
    the use of due diligence measures.


    # Implementation—Patchy but Positive


