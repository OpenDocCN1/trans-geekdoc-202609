    Vantage Market Research (2022) anticipates that the compound annual growth rate
    of cryptocurrencies will be 6.9% in the 2020s, with the top market players Bitmain®
    (China), Nvidia® (United States), Xilinx® (United States), and Intel® (United
    States).'
