    The lesson we draw is partly normative and partly descriptive. The normative point
    is this: Bitcoin’s founding is fair in one very important respect: the rules of
    its monetary system apply to all. We do not claim that pre-mines and the like
    are always morally wrong or dubious. We do not even claim that they are universally
    undesirable for investors. But a founding history without insiders and with creators
    who obey the same rules as anyone else is attractive.


    The descriptive point follows from this: the market has recognized Bitcoin as
    king for 13 years. Participants know that it is more fair than many alternatives
    and accordingly favor Bitcoin in their market behavior. Bitcoin’s fair launch
    has, we suspect, played an important though subtle role in resolving the bootstrapping
    problem. It has credibility because it came to be in a credibly neutral way.


    # ## Leaderless Money


    Satoshi—like Keyser Söze—walked away.


