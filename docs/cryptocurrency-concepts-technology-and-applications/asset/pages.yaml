  md: 'schemes, fraudulent services and tokens, and other types of scams and fraud.
    Additional types of crimes involving cryptocurrencies include cybercrimes like
    ransomware and hacks, cryptocurrency mining crimes, money laundering, terrorist
    financing, sanctions evasion, tax evasion, darknet markets, bribery and corruption,
    and what we refer to as crypto-adjacent crimes. Figure 6.1 (above) offers a visual
    summary of these crime types.


    # Fraud


    # Investment Schemes


    Ponzi schemes and high-yield investment schemes are commonplace in the cryptocurrency
    arena, with Bartoletti et al. (2019) finding evidence of 184 Ponzi schemes on
    Ethereum alone in 2019. In a Ponzi scheme, fraudsters promise investors absurdly
    high interest rates for their investments. They pay these returns to the original
    investors by using new investors’ funds, until the scheme can no longer find new
    victims (Bartoletti et al. 2018; Baum 2018; Przyzmont 2016; Reddy and Minnaar
    2018; Vasek 2017; Vasek and Moore 2015).


    Initial coin offering (ICO) scams are another popular type of cryptocurrency-based
    fraudulent investment scam. ICOs are similar to traditional initial public offerings,
    except they sell a new cryptocurrency rather than shares to investors to fundraise.
    Fraudulent ICOs may also involve theft, pump-and-dump schemes, or Ponzi schemes
    (Barnes 2018; Baum 2018). Investors lost $687.4 million from just 10 popular ICO
    scams (Karimov and Wójcik 2021).


    Scholars also observe cryptocurrency-based pyramid schemes. These schemes involve
    participants earning money for recruiting other members, rather than through the
    goods and services the company purports to provide (Jiaying 2020).


    # Market Manipulation


    Various types of manipulation run rampant in cryptocurrency markets, particularly
    for coins with a low market capitalization. Market manipulation refers to any
    attempt by market participants to alter the price of a cryptocurrency (ur Rehman
    et al. 2020). There is evidence of the following types of market manipulation
    in cryptocurrency markets: pump-and-dump schemes (Kamps and Kleinberg 2018); wash
    trading (Cong et al. 2021); ticker-stuffing (Nomics 2019); spoofing (Twomey and
    Mann 2020); and stop-loss hunting (Banton 2021; CoinBureau 2018).


    Pump-and-dump schemes involve a party’s buying large volumes of a low market capitalization
    cryptocurrency, followed by a coordinated misinformation campaign which entices
    victims to also purchase this cryptocurrency. This increase'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'in demand, in turn, increases the price of the asset (the “pump”). Following
    this price increase, the fraudster sells their holdings (the “dump”) for a profit,
    crashing the price (Barnes 2018; Baum 2018; Chen et al. 2019). One study of 412
    pump-and-dump schemes in 2018 and 2019 finds they produce a monthly “aggregate
    artificial trading volume” of $6 million (Xu and Livshits 2019).


    Wash trading refers to a party’s selling a cryptocurrency among accounts they
    control (or to colluding parties) (Financial Conduct Authority 2021). Preliminary
    research suggests that up to 70% of trading volume on unregulated exchanges may
    involve wash trading (Cong et al. 2021). Ticker-stuffing is a related type of
    fraud, whereby a fraudster falsifies the volume metrics on a trading ticker (Nomics
    2019).


    Spoofing is an act criminalized by the U.S. Dodd Frank Act in 2010, which also
    occurs in cryptocurrency markets. A party places orders they intend to cancel
    to manipulate prices (Commodity Futures Trading Commission, n.d.). Finally, stop-loss
    hunting refers to large-scale holders of cryptocurrency manipulating prices to
    reach stop-loss level (levels traders set at which to automatically sell their
    assets). If they succeed—thereby activating these stop-losses—the price of the
    cryptocurrency will plummet further and the fraudster can purchase it more cheaply
    (Banton 2021; CoinBureau 2018).


    # Social Engineering


    Social engineering attacks—which are present in traditional online banking and
    other areas of cyberspace, such as phishing, SIM swapping, and impersonation scams—also
    occur in cryptocurrency markets. Phishing refers to a fraudster’s making a fake
    version of an existing cryptocurrency website, email, or other communication,
    which tricks victims into inputting private information into the fake site (Chen
    et al. 2020). This could, for example, involve a fake email from a cryptocurrency
    wallet provider requesting the victim’s private key or seed phrase. SIM swapping
    involves attackers using social engineering to get enough information about a
    victim to convince their mobile phone provider to move the victim’s SIM card to
    one controlled by the attacker (Lee et al. 2020). The attacker can then complete
    multi-factor authentication involving the victim’s mobile phone number and gain
    access to the victim’s cryptocurrency accounts.


    In 2020, police arrested a man for allegedly stealing $50 million in cryptocurrency
    in this manner (Duhaime 2020). Finally, in impersonation scams, a fraudster may
    impersonate someone of authority (for example, a federal employee) or a celebrity
    to lure victims into joining a cryptocurrency investment scam (Australian Competition
    & Consumer Commission 2020; Lucking and Aravind 2020).'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Fraudulent Services and Tokens


    Fraudulent cryptocurrency services and tokens are crypto-dependent frauds (Kamps
    et al. 2022). Fake cryptocurrency exchanges and fake cryptocurrency wallets generally
    steal the cryptocurrencies transferred to them (Vasek et al. 2017; Vasek and Moore
    2015). They may also involve phishing applications, whereby fake cryptocurrency
    exchanges and wallets imitate existing ones and try to trick victims into using
    them (Xia, Wang, Zhang, et al. 2020). Fake mixers also exist which similarly steal
    users’ funds (Möser et al. 2013).

    Finally, fake tokens may involve complete scams (where developers will often “rug
    pull” the project, see DeFi Crime Risks, below [Xia et al. 2021; Xu et al. 2022]),
    seek to impersonate existing tokens (again, often using traditional phishing techniques
    [Higgins 2017]), or advertise scam tokens purported to be associated with existing
    projects for which there is currently no token. Xia et al. (2021) found that,
    at the time of their research, 50.14% of tokens on the decentralized exchange
    Uniswap® were scam tokens.


    # Other Scams and Frauds


    There are various other types of scams and frauds present in the cryptocurrency
    space of which scholars have, at least, anecdotal evidence. These include:


    +   • Giveaway scams. A scammer promises to give victims something of value if
    they send them a cryptocurrency. The victim never receives the gift (Xia, Wang,
    Luo, et al. 2020).


    +   • Donation scams. Fraudsters pretend to be from a charity raising money using
    cryptocurrency for a cause.


    +   • Airdrop scams. Airdrops involve a cryptocurrency project transferring free
    cryptocurrency (usually in the project’s native governance token) to reward early
    adopters. In the case of airdrop scams, fraudsters may send victims counterfeit
    tokens (Gao et al. 2020) or may try to get victims to approve access to their
    online wallet (under the guise that this authorizes the airdrop transfer) and
    then drain their funds.


    +   • Advance-fee fraud. Advance-fee frauds are old frauds which are now sometimes
    carried out with cryptocurrencies. A scammer requests a victim sends them cryptocurrency,
    promising to return the original amount and more. Instead, the fraudster steals
    the original funds transferred to them (Phillips and Wilder 2020).


    +   • Romance scams. Cryptocurrency-based romance scams occur similarly to traditional
    romance scams, whereby a fraudster builds a fake romantic'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'relationship with the victim and then requests cryptocurrency from them (which,
    ultimately, they steal) (Navarro 2019).


    +   • Arbitrage scams. Arbitrage scams refer to some scam in connection with a
    scheme to profit off price imbalances across the cryptocurrency market (Gao et
    al. 2020).


    +   • Other blackmail and extortion scams. Cryptocurrency blackmail scams involve
    a criminal''s extorting an individual for cryptocurrency. This may include “sextortion”,
    where a criminal threatens to release sexual information or nude photos of a victim
    if they do not send cryptocurrency (O’Malley and Holt 2022; Paquet-Clouston et
    al. 2019). Another type of blackmail scam involved a criminal''s threatening to
    spread COVID-19 if the victim does not send cryptocurrency (Xia, Wang, Luo, et
    al. 2020). Cases of kidnapping (and subsequent extortion) also exist (Kethineni
    and Cao 2020).


    +   • Mining scams. Mining scams refer to a scheme where criminals tell victims
    they are investing in a mining program; victims never receive their original investment
    or the promised returns (Vasek 2017; Vasek and Moore 2015) (see Cryptocurrency
    Mining Crimes, below, for related crimes).


    Other frauds include identity theft, insider trading, securities fraud, commodities
    fraud, and wire fraud, which refer to the statutory definitions of the same. Again,
    many of these, such as giveaway scams, romance scams, and advance-fee fraud, are
    crypto-enabled scams, while airdrop scams and mining scams are crypto-dependent
    crimes.


    # Other Cybercrimes


    # Ransomware


    Ransomware is a type of malware that encrypts a victim’s files; once they pay
    the demanded ransom to the attackers (in cryptocurrency), their files are decrypted
    (Conti et al. 2018). Attackers often request ransom payment in Bitcoin or privacy
    coins like Monero (Paquet-Clouston et al. 2019). Ransomware-as-a-service facilitates
    this phenomenon, whereby would-be criminals can purchase ready-made ransomware
    to deploy. Ransomware operators also often allow users to infect other computers
    instead of paying the ransom in order to decrypt their files, further facilitating
    its spread (Conti et al. 2018).


    There are more than 500 ransomware families; WannaCry, one of the most prolific,
    reached 300,000 victims from 150 countries (Paquet-Clouston et al. 2019). According
    to blockchain analytics firm Chainalysis (2022), ransomware payments amounted
    to $692 million in 2020 and $602 million in 2021 (compared to only'
  merge: -1
  img_proc: true
- pgno: 126
  md: '$152 million in 2019). However, Paquet-Clousten et al. (2019) urge caution
    in applying these estimates, given the commercial motivations of their source.
    They analyzed 35 families of ransomware between 2013 and mid-2017 and found ransom
    payments reached $12,768,536 during that time. The proceeds from one ransomware
    family, Locky, account for 50% of this figure (Paquet-Clouston et al. 2019).


    Individual schemes range in profitability, from $4,173.12 (the value of the 9.9990
    BTC earned at the time) for KeRanger to $2,220,909.12 (the value of the 5,351.2329
    BTC received at the time) (Conti et al. 2018). Cryptowall utilized “infection
    vectors, such as phishing emails, browser exploit kits, and even drive-by downloads
    via Google Drive” (Ahn et al. 2016). The malware also automatically evolved and
    self-encrypted to evade antivirus software detection (Ahn et al. 2016).


    # Hacks (and Theft)


    Hackers have successfully attacked both centralized and decentralized cryptocurrency
    exchanges. One study examined 30 Bitcoin hacks, finding that, depending on when
    the criminals converted their funds to fiat currency, they amounted to between
    $7 and $88 billion (Charoenwong and Bernardi 2021). Many exchanges have poor security
    practices, which hackers exploit (Carlisle and Izenman 2019). In fact, 20 of the
    aforementioned hacks involved security breaches; human errors and insider threats
    each caused five (Charoenwong and Bernardi 2021).


    Recent hacks include the $325 million Wormhole exploit in February 2022, the $540
    million Ronin bridge attack in March 2022, and the $611 million Poly Network hack
    in August 2021 (Tidy 2022). Also, many hacks can be attributed to North Korean
    state-sponsored hackers such as the Lazarus Group, including the Coincheck hack
    in 2018 (worth $534 million at the time) and the Bithumb hack of 2018 (worth up
    to $43 million in various cryptocurrencies at the time) (Carlisle and Izenman
    2019).


    One of the largest (and, perhaps, most famous) exchange hacks was the Mt. Gox
    hack of 2014. A hack of one of the company’s auditors preceded this attack in
    2011, at which point the attacker changed the price of Bitcoin on the exchange
    to $0.01, stole clients’ private keys, and purchased cheap Bitcoin, ultimately
    making off with 2,000 BTC. Then, in 2014, attackers stole the private key file
    for the exchange’s Bitcoin wallet and stole 850,000 BTC (Charoenwong and Bernardi
    2021).


    # Cryptocurrency Mining Crimes


    Nefarious actors exploit the cryptocurrency mining process in numerous ways. One
    example is _cryptojacking_, a type of malware that uses the infected computer'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'to mine cryptocurrency on behalf of the attacker (Kamps et al. 2022). Estimates
    put the total expected revenue from a cryptojacking scheme at $300,000 per month
    (Kfir 2020). Cryptojacking is a particularly common tactic for mining Monero cryptocurrency
    (Kamps et al. 2022). Covert pre-mines are another type of cryptocurrency mining
    crime whereby a project claims there is cap on the supply of its cryptocurrency,
    but someone is able to mine more. Bitcoin Private is an example of this, with
    $3.9 million in coins covertly pre-mined prior to its launch (Kamps et al. 2022).


    Finally, *miner front-running* (also called *miner extractable value*) refers
    to Ethereum miners ordering transactions (including their own) in a way that generates
    profit for them based on upcoming transactions they observe in the Ethereum mempool*
    (Daian et al. 2019). This is similar to traditional financial market front-running,
    where a trader trades an asset before an upcoming non-public trade (that is known
    to them) which will affect the asset''s price (Mitchell 2021).


    In cryptocurrency markets, miners could execute trades to manipulate prices based
    on knowledge they obtained about upcoming trades (Xu et al. 2022) or extract profits
    by copying a trade in the mempool, executing theirs first, and stealing the original
    trader''s profit. They could also deploy bots to this end (Daian et al. 2019).
    Miner extractable value also includes back-trading (making a trade after another
    for financial gain) or sandwich attacks (combining front-running and back-running)
    (Xu et al. 2022).


    # **Money Laundering**


    *Money laundering* is a key cryptocurrency crime concern. Europol estimated that
    in 2018 criminals laundered $5.5 billion using cryptocurrencies (Corcoran 2018).
    Money laundering is the process of integrating proceeds of crime into the financial
    system so they can be used without being connected to the predicate offense from
    which they derived. Scholars have also pointed to the risk of the use of DeFi
    (Wronka 2021b) and NFTs (Das et al. 2022)for money laundering.


    Cryptocurrency-based money laundering tends to follow the same process of placement,
    layering, and integration seen in fiat-based money laundering (Desmond et al.
    2019). Placement means putting the “dirty” money into the financial system (Albrecht
    et al. 2019). In the case of cryptocurrencies, this would take the form of a criminal
    depositing fiat currency into a cryptocurrency exchange (Durrant and Natarajan
    2019).


    The layering process follows, where money launderers seek to obfuscate the origin
    and trail of their funds (Albrecht et al. 2019).


    * A node''s mechanism for keeping track of unconfirmed transactions that the node
    has seen (but have not yet been added to a block) (Binance Academy [n.d.]).'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'Criminals may use the following tactics to execute layering through cryptocurrencies:
    creating many cryptocurrency accounts, using cryptocurrency mixing services, and
    exchanging cryptocurrencies for other cryptocurrencies (or moving them to other
    blockchains), particularly privacy coins and chains (called *chain hopping*; see
    Raza and Raza [2021]; Durrant and Natarajan [2019]). The money-laundering process
    concludes with integration, which means using the once-dirty money for “mainstream
    economic activity” (Albrecht et al. 2019) and mingling it with other “clean” funds
    (Durrant and Natarajan 2019). In cryptocurrency-based money laundering this may
    involve holding and investing some cryptocurrencies and/or exchanging them for
    fiat currencies (Durrant and Natarajan 2019).


    Mixers and *tumblers* are common tools for laundering cryptocurrencies. Mixers
    let a group of users combine their inputs and outputs from multiple transactions
    into one transaction. Blockchains record this as a single transaction, and it
    is not possible to tell which outputs came from which user—i.e., the blockchain
    may show one Bitcoin was sent from each of A, B, and C addresses to D, E, and
    F addresses, but it would be impossible to tell if A’s Bitcoin went to address
    D, address E, or address F.


    One study evaluated the “success” of mixers in obfuscating fund origins and found
    that two of the three mixers studied were successful (Möser et al. 2013). Other
    cryptocurrency-based tools money launderers use include Bitcoin ATMs and gambling
    services (Fanusie and Robinson 2018).


    The Coincheck Exchange hackers (allegedly North Korean state-sponsored hackers;
    see Carlisle and Izeman 2019) used several of these techniques to launder the
    proceeds of their crime (Tsuchiya and Hiramoto 2021). The hackers stole $530 million
    of the cryptocurrency NEM in January 2018 by infecting a Coincheck terminal with
    malware and stealing the private keys for the hot wallet containing the exchange’s
    NEM. They sent the stolen funds to 18 addresses and then sent them to many, many
    other addresses to obfuscate the trail of the funds. The attackers created their
    own exchange, through which they offered to exchange NEM for Bitcoin or Litecoin
    at a 15% discount.


    Through this process, the stolen NEM reached more than 130,000 other cryptocurrency
    addresses. The foundation which created NEM tried to use a “mosaic tagging system”
    to trace the stolen coins, but the hackers thwarted these efforts by “sending
    the marked NEM to those who had contacted them by sending messages or a small
    amount of NEM” (Tsuchiya and Hiramoto 2021). Only 30% of the stolen funds have
    so far been located and been subject to enforcement action in Japan (Tsuchiya
    and Hiramoto 2021).


    Criminals also use cryptocurrencies to launder proceeds of “offline” drug crimes.
    For example, organized criminal groups have used cryptocurrencies like'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Bitcoin to launder the proceeds of their drug crimes (Majumder et al. 2019).
    However, cash remains a more viable money-laundering method for crimes of this
    nature (Butler 2019).


    # ## Terrorism Financing


    There is a dearth of systematic, academic research on cryptocurrencies being used
    for *terrorism financing*; much research is speculative. Research reports specific
    case studies, showing that the risk is non-negligible (Kfir 2020). Interviews
    with both terrorist financers themselves and compliance and prevention experts
    confirm the same (Teichmann 2018). However, there remains controversy over the
    severity of its threat (Kfir 2020). For example, in 2018, the European Parliament
    considered that only a handful of such cases existed and that the advantages of
    using cryptocurrencies for terrorist financing did not outpace current methods
    (Butler 2019).


    There is anecdotal evidence of extremist groups using the dark web to purchase
    weapons, drugs, and fake documents or to sell stolen antiquities (Kfir 2020; Teichmann
    2018). The U.S. government has prosecuted cases involving soliciting cryptocurrencies
    for the Islamic State in Iraq and the Levant (see, for example, *United States
    of America v. Ali Shukri Amin* 2015; Kethineni and Cao 2020). Case studies of
    terrorist financing using cryptocurrencies have involved social media or other
    online campaigns (Dyntu and Dykgyi 2019; Kethineni and Cao 2020; Kfir 2020), taking
    out loans and credit cards using false identities to buy cryptocurrencies to send
    to terrorist groups (Majumder et al. 2019), as well as kidnapping and ransom (Teichmann
    2018).


    Cryptocurrencies may not yet be used in terrorism financing for various reasons.
    First, mainstream adoption of cryptocurrencies is insufficient, and it remains
    difficult to purchase goods and services with them (Internal Revenue Service Criminal
    Investigation 2021; Kfir 2020). Technological barriers to their use may also exist
    among terrorist groups (Kfir 2020). There also remains concern about whether cryptocurrency
    use is permissible under Islamic law (Kfir 2020). Finally, cryptocurrency prices
    remain very volatile, which may detract from their attractiveness to terrorists
    (Internal Revenue Service Criminal Investigation 2021).


    # ## Sanctions Evasion


    Much of the information on *sanctions evasion* involving cryptocurrencies comes
    from private companies, think tanks, or news media, particularly spurred by the
    Russian invasion of Ukraine in February 2022. However, some hypothetical'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'academic research does exist. Furthermore, court cases point to the use of
    crypto-currencies to evade sanctions, with news of the first criminal cryptocurrency-based
    sanctions evasion case being brought in the U.S. (Hansen 2022). Various cryptocurrency-related
    entities and addresses, such as the Chatex cryptocurrency exchange, have been
    on the U.S. Office of Foreign Assets Control sanctions list (Akartuna et al. 2022),
    reflecting a subset of companies which specifically cater to sanctioned businesses
    and individuals (Kfir 2020).


    As with terrorist financing, there remains some debate over the level of risk
    cryptocurrencies pose to sanctions evasion (Wronka 2021a). For example, concerns
    about the risk of Russian oligarchs using cryptocurrencies to evade sanctions
    may be overstated. This is, in part, due to the transparent nature of many blockchains,
    like the Bitcoin blockchain, and the ability to link public keys to known individuals
    in many cases.


    Furthermore, to transfer cryptocurrency into fiat currencies (to spend them),
    users need to use an exchange (even if they use privacy coins), many of which
    are regulated, have KYC requirements, and ban sanctioned individuals. Using blockchain
    analysis, detection of sanctioned individuals using even non-regulated exchanges
    is likely. In addition, many exchanges still do not allow users to exchange funds
    from mixers (Feeney 2022). Finally, most exchanges operating in Russia have limited
    liquidity available for users, to the tune of about $200,000 compared to $22 million
    on U.S. exchanges, creating further difficulties for oligarchs wishing to use
    cryptocurrencies to evade sanctions (Mazzola and Goroch 2022).


    However, countries like North Korea, Venezuela, and Iran have sought to evade
    sanctions using cryptocurrencies (Kfir 2020). Venezuela discussed issuing its
    own cryptocurrency to evade sanctions. Iran has taken up Bitcoin mining; its services
    account for 44.5% of all Bitcoin mining. They earn revenue lost to sanctions against
    purchasing their oil. They also use this Bitcoin to import necessary goods (Wronka
    2021a).


    North Korea uses state-sponsored cybercrime (often involving cryptocurrency) to
    evade sanctions and earn revenue for its weapons program (Macfarlane 2020). In
    2015, South Korean intelligence agencies “estimated that North Korea employs up
    to 6,000 cyber-warfare experts, a number that has likely grown since then” (Carlisle
    and Izenman 2019). This includes the Lazarus Group (Carlisle and Izenman 2019).


    North Korea carried out the WannaCry ransomware attack and various cryptocurrency
    exchange hacks (for example, the Youbit hack in 2017 and, likely, the aforementioned
    Coincheck hack). Estimates put the value of the country’s cryptocurrency holdings
    between $15 million and $210 million. Some also suggest they have sold drugs on
    darknet marketplaces and engaged in cryptocurrency mining (including through cryptojacking)
    (Carlisle and Izenman 2019).'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Tax Evasion


    Cryptocurrencies have long been considered as a risk for *tax evasion* due to
    certain of their inherent characteristics—namely, their anonymous (or, more accurately,
    pseudo-anonymous) nature and the lack of reliance on financial institutions to
    use them (Marian 2013). Privacy coins, such as Monero in particular, pose a risk
    of tax evasion (Noked 2018).


    Furthermore, there is no global centralized reporting structure for cryptocurrency
    holdings in the way there is for traditional bank accounts (Kossow and Dykes 2018).
    In 2021, the IRS seized $3.5 billion in cryptocurrency. However, much of this
    comes from the Silk Road darknet marketplace case (Internal Revenue Service Criminal
    Investigation 2021).


    # Darknet Marketplaces


    *Darknet marketplaces* exist on the dark web, which is part of the deep web. The
    deep web is a section of the internet not indexed by search engines and which
    is only accessible “through specific software, configurations, or authorization”
    (Cronin 2018). Generally, one accesses it through a TOR browser, which employs
    a distributed network to obscure users’ IP addresses.


    Darknet marketplaces serve as brokers for drugs, cybercrime-as-a-service, counterfeit
    goods, stolen credentials, fake documents, human trafficking, and child pornography,
    among other illicit goods and services (Cronin 2018). Perhaps the most famous
    darknet marketplace was the Silk Road, which the U.S. government took down in
    2013; its founder, Ross Ulbricht, is serving life in prison (Burrus 2018). Since
    then, law enforcement worldwide closed several darknet marketplaces, such as ItalianMafiaBrussels
    and Dark HunTor (Bahamazava and Nanda 2022).


    As with ransomware, some have attributed the growth in darknet marketplaces to
    the growth of cryptocurrencies because users make darknet market purchases with
    them (Almaqableh et al. 2022). Over time, darknet marketplaces have exhibited
    a shift from the use of Bitcoin to Monero, particularly after Monero’s 2017 privacy
    update (Bahamazava and Nanda 2022).


    In 2018, Europol estimated darknet marketplace spending at $1 billion, with 62%
    of this revenue coming from drug trades (Bahamazava and Nanda 2022). As of October
    2018, there were 23 active darknet marketplaces (White et al. 2019). However,
    it is important to note that “offline” drug trade remains more significant. The
    Silk Road earned $100 million per year in sales commissions for all products;
    the total value of the global cocaine trade alone is around $38 billion (Butler
    2019).'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# **Bribery and Corruption**


    There is no systematic research about the use of cryptocurrencies for *bribery
    and corruption*, although scholars acknowledge their risk in this regard (Teichmann
    and Falker 2020; Wawrosz and Łánský 2021). However, some also note that the transparency
    of many blockchains could reduce the risk of their use in corruption (Kossow and
    Dykes 2018; Wawrosz and Łánský 2021). Research shows that in countries where corruption
    is relatively high (but not beyond a certain amount), cryptocurrency use tends
    to be higher (Wawrosz and Łánský 2021). Further research confirmed these findings
    (Alnasaa et al. 2022).


    # **Cryptocurrency-Adjacent Crimes**


    We refer to *cryptocurrency-adjacent crimes*, where crimes occurred which purported
    to involve cryptocurrencies or related products and services but, in fact, did
    not. One example of this is the Cryptoqueen case, in which Ruja Ignatova allegedly
    stole billions in a Ponzi scheme involving “OneCoin.” She claimed OneCoin was
    a cryptocurrency; however, it never even existed (BBC 2019).


    # **Crime Risks Associated with Specific Types of Cryptocurrency Technology**


    Novel aspects of the cryptocurrency ecosystem, such as decentralized finance (DeFi)
    and non-fungible tokens (NFTs), exhibit unique crime types, as shown in Figure
    6.1 (on page 95). Figure 6.2 depicts the relationships among crime types present
    in DeFi, NFTs, and the wider cryptocurrency space.


    # **DeFi Crime Risks**


    In addition to and including some of the aforementioned crime risks, DeFi exhibits
    unique crime types. DeFi refers to an ecosystem of products and services built
    and delivered through smart contracts, which imitate traditional financial products
    and services (such as currency exchange, lending, insurance, and derivatives trading),
    except they allow parties to interact directly in a trustless, permissionless
    manner and retain custody of their own funds (Schär 2021).


    Some of the crime types present in the wider cryptocurrency space which commonly
    affect DeFi are miner extractable value (Daian et al. 2019), market manipulation
    (including pump-and-dump schemes (Hamrick et al. 2021; Mazorra et al. 2022) and
    wash trading (Qin et al. 2021; Victor and Weintraud'
