- pgno: 160
  md: '# Hosted vs Unhosted Wallets


    The situation above refers to a so-called _hosted_ wallet, meaning a wallet that
    is held with a VASP. It is important to remember that, in this case, the suspect
    doesn’t control the private keys, since they are in the possession of the VASP.
    The suspect only has a credit with the exchange that is holding the money for
    them. The VASP is the only entity that can freeze the funds and allow an effective
    seizure.


    This is not the case when we consider _unhosted wallets_, where the suspect is
    the person directly controlling their funds and the corresponding private keys.
    The latter will then be the main target during the investigation. In the case
    of a hosted wallet, locating the funds controlled by a VASP is sufficient to ask
    the service to freeze the assets, with no recourse from the suspect—locating the
    private key is the real objective when dealing with unhosted wallets.


    First of all, investigators will look for red flags that a suspect is holding
    cryptocurrency:


    +   • Software or apps on the suspect’s devices (phones, laptops). In order to
    receive, manage, and send cryptocurrency, a person needs to install a wallet.
    A wallet is a software that creates the keypair (private key/address), which is
    then used by the user to send and accept transactions. The presence of a wallet
    could be an indicator of the use of cryptocurrency.


    +   • Browser history. If the suspect is using a VASP to hold and manage their
    cryptocurrency, traces could be available in the web browser. User IDs and passwords
    could equally be saved by the browser.


    +   • Hardware wallets. Possession of this device, a sort of cold wallet that
    stores private keys inside the machine, is a strong indicator of the control of
    cryptocurrency.


    As we have seen, investigative techniques are constantly evolving. Law enforcement
    is slowly acquiring the necessary knowledge to trace and locate money laundered
    through the use of virtual currencies, and an increasing number of tools are becoming
    available to help them, such as blockchain analytics firms. To counter that, criminals
    are becoming more sophisticated and are adopting countermeasures to hide their
    traces deeper in (and outside) the blockchain.


    # Emerging Criminal Strategies


    # Catching the Wave


    It is always the same story. When a new technology becomes available that can
    be exploited to make it easier to launder money, criminals will immediately jump
    on it. For a few months or years, they will be able to enjoy a double advantage,'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'legislative and investigative. The former is a direct consequence of the time
    needed for legislators to become aware of a potential threat, understand the new
    technology, and then discuss and define a possible legal framework to allow law
    enforcement to try and stop the illegitimate use of the new tools.


    Investigators, in turn, need to understand how criminals are covering their tracks
    and their unique laundering processes. They then need time and budget to develop
    new strategies. The first wave is used by criminals naively, without the need
    for highly sophisticated strategies. But once a legal framework is there and law
    enforcement become accustomed to this new typology of criminal activity, a second
    wave will break. This one will take advantage of newly developed secondary tools
    and mechanisms built on top on the tool.


    We have seen this in cryptocurrencies, too. While until a few years ago criminals
    were successfully using Bitcoin to cover their tracks what we described above
    has proven to be enough for law enforcement to fight back. The victory is ephemeral,
    though: it’s a never-ending cat-and-mouse game, and the cryptocurrency world is
    evolving rapidly.


    # A Snapshot of Criminal Strategies


    At the time of writing, criminals are starting to use new strategies:


    +   - Non-regulated exchanges are where criminals go to turn their crypto back
    to fiat money. They are located in jurisdictions where the regulation is lax and
    not in line with the FATF Recommendations. Clients are not identified, and a formal
    KYC process is light or non-existent. Exchanges of this type can choose to operate
    in countries which are notoriously secretive when it comes to sharing financial
    information or replying to requests for mutual legal assistance.

    +   - Decentralized exchanges emerged within the framework of decentralized finance
    (DeFi), which allows financial instruments to avoid intermediaries such as banks,
    brokers, and exchanges. This new typology of exchange is non-custodial and therefore
    unable to be subpoenaed, with the consequence that funds can’t be frozen on request.
    Money is exchanged thanks to self-executing smart contracts that allow peer-to-peer
    trading.

    +   - Chain hopping. While it is sometimes difficult to follow transactions on
    a blockchain, imagine having to follow the trail of money through a multitude
    of blockchains. This is what chain-hopping does. Using this layering technique
    means converting one cryptocurrency into another, swapping funds from one blockchain
    into the next. Criminals, for example, can obtain Bitcoins which are subsequently
    swapped for one or more privacy-focused cryptos such as Monero to disguise their
    origin.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '+   • Mixers. Mixers can be used to obfuscate the real origin of funds by mixing
    different streams of identifiable cryptocurrency. “Tainted” funds are sent to
    the service, which mixes them together with those of other users in a sort of
    “pool.” Funds that are then withdrawn by users (minus a fee collected by the mixer)
    are not the same as the ones they originally deposited.


    +   • Online casinos. Money launderers can turn to online casinos to clean their
    cryptocurrency. The scheme is very simple: deposit your dirty money into a gambling
    site, pretend to play a few games, withdraw your now legitimate coins, and declare
    them as “winnings.”


    +   • Dark markets. Using dark markets is also frequently used to launder cryptocurrency
    and disguise its real origin. When one opens an account and deposits crypto, the
    money is kept by the market in one or more pooled accounts. When a user withdraws
    their funds, they are not taken from the original address used for the deposit
    but from another one that is completely unrelated. This makes it difficult to
    understand the original criminal activity committed before the deposit.


    +   • Crypto ATMs. Crypto ATMs are automated teller machines connected to the
    internet that allow customers to buy and sell cryptocurrencies. While some perform
    KYC checks on clients and identify users when they deposit or withdraw funds,
    many crypto ATM firms allow customers to operate their machines without any sort
    of identification.


    +   • Privacy coins. If Bitcoin and Ethereum don''t prove themselves as anonymous
    as initially thought, criminals can still turn to privacy coins such as Monero.
    They obscure the flow of money and make it more difficult to trace transactions
    on the respective blockchains. While they work in ways similar to the other cryptocurrencies,
    they use stealth addresses, where the sender of a transaction is required to create
    a random, one-time address on behalf of the recipient. The recipient can therefore
    have all incoming payments going to unique addresses that cannot be linked to
    any specific entity. Another feature used by privacy-focused cryptocurrencies
    are ring signatures. With most cryptocurrencies, transactions on the blockchain
    clearly show who the sender is, even if they are behind a crypto address. Ring
    signatures, on the other hand, can be performed by any member of a group of users,
    making it impossible to understand which member''s key was used to generate the
    signature.


    # # Confiscation: Deterring Crypto-Enabled Crime


    # ## Seeking the Key to the Crypto Treasure


    Undoubtedly, when it comes to criminalized digital assets, one of the main hurdles
    is locating and confiscating them. Many still believe that knowing that a criminal'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'holds crypto in a specific address and linking those funds to the originating
    criminal activity is sufficient. While this may lead to a conviction, if the person
    or their family and associates can still enjoy their illicit proceeds, that doesn’t
    completely remove the incentive to commit the crime. In contrast, a successful
    confiscation can allow the money to be returned to the victims and deter further
    crimes from being committed by removing the financial incentive.


    Once the cryptocurrency has been tracked and the address in which it sits had
    been identified, law enforcement needs to move those funds away from that address
    as soon as possible to prevent them from being used or transferred. If a transaction
    can be initiated by anyone possessing the address’s private key, locating the
    cryptocurrency is not enough, for two reasons:


    +   • First, the investigators cannot consider the money under their control if
    they don’t possess the private key of the target address.


    +   • Second, anyone with that private key can spend the fund. Imagine a criminal
    holding crypto who shared her private key with an accomplice. She might have left
    him with the instructions to move the funds if she gets arrested. Once the investigation
    moves to the recovery of the assets, they will find an empty address, as cryptocurrency
    has been moved to another location, and they have to start tracking it all over.


    There are therefore two crucial steps involved:


    +   1. Finding the private key of the target address.


    +   2. Moving the funds to an address under the control of law enforcement.


    As we have seen before, when hosted wallets are involved, VASPs can be subpoenaed
    and, since they control the private keys, they can also prevent the funds from
    being transferred out of control. The major obstacle comes when the suspect is
    holding cryptocurrency in a unhosted wallet—one that they control themselves.
    In most cases, the treasure trove can be scattered over the suspect’s devices.
    A search at their premises must be conducted, and any possible evidence must be
    seized to take possession of the private keys.


    What to look for? Let’s have a look at where a private key can be stored:


    +   • Mobile phones can have wallets installed in the form of apps. Those wallets
    can give access to the funds, and a transaction can be initiated from the mobile
    phone, sending the cryptocurrency to a wallet controlled by the investigators.
    The browser history can be scrutinized for possible clues.


    +   • Computers can also have wallets as applications, as seen above. The browser
    must be also analyzed, since some can have wallets installed as extensions.


    +   • Hardware wallets, which we have encountered in previous sections, are an
    obvious target. Taking possession of them allows the investigators to locate and
    move the funds.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '+   • When a user initializes a wallet, be it an app or a hardware wallet,
    they are prompted to create a *backup seed*. This is a list of 12 or 24 words
    that can be used to restore the wallet in case of loss, damage, or intentional
    wipe-out of the wallet. This list can be crucial: investigators can try to restore
    a wallet using the seized list of words, recreating the wallet on their device
    and allowing them to secure the funds elsewhere. The list can be written anywhere.
    Law enforcement officers have found seeds written on the pages of a TV manual,
    in a suitcase in a closet, and on a gum wrapper.* Seeds can also be engraved on
    steel plates to improve durability.


    # Crypto before the Court


    Tracing the funds, locating the private key, and moving the cryptocurrency to
    a secure wallet is useless if the evidence is not admissible in a trial. It must
    have been obtained keeping in mind the existing legislation and best-practice
    procedure. In order to be used in court, It must be possible to prove that the
    evidence has not been corrupted, manipulated, or altered. This is possible thanks
    to the properties of *hashing*, as we have seen before: the evidence obtained
    is immediately hashed and electronically fingerprinted, so that any change to
    the original material is immediately visible. In fact, even the tiniest change
    to the input (the files under seizure) will lead to a change to the resulting
    hash. This makes it trivial to prove or disprove the authenticity of digital evidence.


    Finally, the ultimate goal of the confiscation is to sell the cryptocurrency and
    dispose of the proceeds to compensate victims. The United States Marshals Service
    was the first to take this route with the Bitcoins confiscated during the Silk
    Road case in 2014. More used to the disposal of boats, artworks, jewelry, villas,
    and cars, they followed a similar approach by auctioning off the Bitcoins they
    had seized. Nowadays, law enforcement can count on private firms to store and
    sell the crypto. Often law enforcement will ask themselves when it would be the
    right moment to realize the cryptocurrency they have confiscated: virtual assets
    are volatile, and their value when it comes to sell the assets may be drastically
    different than what it was at the time of seizure.


