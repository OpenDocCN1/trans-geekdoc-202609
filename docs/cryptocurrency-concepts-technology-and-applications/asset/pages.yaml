  img_proc: true
- pgno: 133
  md: '![](img/f08f3915c6e1afa13e4417a1426bd7c3_133_0.png)


    Figure 6.2 Relationships Among DeFi, NFT, and Cryptocurrency Crime Types


    2021; Wang et al. 2021), fraudulent investment schemes (Mazorra et al. 2022; Xia
    et al. 2021), and smart contract fraud and hacks (Katona 2021; Schär 2021).


    Private sector research (Chainalysis 2022) also points to the use of DeFi in money
    laundering; however, this is yet to be confirmed through peer-reviewed academic
    research. In particular, scholars have raised concerned about the use of stablecoins
    (cryptocurrencies whose value is pegged to a government-issued fiat currency and
    a key component of the DeFi ecosystem) for money laundering, as they shield criminals
    from the volatility of other cryptocurrencies (Dyson et al. 2018).


    Types of crime which are specific to DeFi include oracle attacks (Gudgeon et al.
    2020; Schär 2021), governance attacks (Gudgeon et al. 2020; Werner et al. 2021),
    and flash loan abuse (Caldarelli and Ellul 2021; Gudgeon et al. 2020; Qin et al.
    2021; Wang et al. 2021; Xu et al. 2022). These types of attacks often facilitate
    some of the other cryptocurrency crime types observed in the wider cryptocurrency
    ecosystem.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'DeFi smart contracts often extract information from some external data source
    (called an *oracle*) (Kamps et al. 2022). *Oracle attacks* refer to manipulation
    of these sources of information (oftentimes price information) (Gudgeon et al.
    2020; Schär 2021). *Flash loan attacks* involve a DeFi innovation called a *flash
    loan*, which is “an uncollateralized loan that is borrowed and repaid in a single
    . . . transaction” (Kamps et al. 2022). If the loan is paid back at the end of
    the transaction, the transactions which use the loan are successful. Otherwise,
    the transaction and the loan are reversed. Flash loans enable various attacks
    which would ordinarily require more significant amounts of capital, such as oracle
    attacks, governance attacks, other types of market manipulation, and other crimes
    (Kamps et al. 2022).


    The February 18, 2020, bZx* platform exploit is an example of an oracle attack
    to cause price manipulation, facilitated by flash loans, from which victims lost
    2,699.97 ETH. In this case, attackers, through a flash loan, manipulated the sUSD/ETH
    trading pair and then bought sUSD. They used this newly purchased sUSD to buy
    more ETH to repay the original loan, ultimately profiting $634,000 (Qin et al.
    2021).


    Many DeFi projects and protocols are governed in a decentralized manner through
    decentralized autonomous organizations (DAOs). In the case of DAOs, users who
    hold governance tokens can vote on the use of funds and future of the protocol
    through smart contracts. *Governance attacks* exploit this mechanism, in which
    a nefarious party (or colluding parties) obtains a majority of the available governance
    tokens and votes in a manner that benefits them but not the protocol (Werner et
    al. 2021).


    For example, they may vote to release the entirety of the DAO’s funds to themselves.
    The literature explores a theoretical governance attack on MakerDAO; researchers
    conclude an attacker could obtain enough governance tokens to carry out a governance
    attack either through crowdfunding mechanisms or using flash loans (Gudgeon et
    al. 2020).


    *Rug pulls* are a fraudulent investment scam unique to DeFi and NFTs (Mazorra
    et al. 2022). They are a type of exit scam that occurs when founders of a project
    disappear and either (a) steal all the funds deposited into that protocol, or
    (b) remove the liquidity for the project’s token (Kamps et al. 2022). Scammers
    may use influencers or advertising to bolster the pretense of their project’s
    credibility or combine rug pulls with airdrop or arbitrage scams or pump-and-dump
    schemes (Xia et al. 2021).


    One of the most popular decentralized exchanges, SushiSwap, suffered from a $14
    million rug pull early in its existence; the founder ultimately returned the funds
    and the protocol flourished (Smith 2021). Research found 26,957 instances of rug
    pulls on the Uniswap decentralized exchange alone (Mazorra et al. 2022).'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'There are three distinct types of rug pulls: the *simple rug pull*, the *sell
    rug pull*, and the *smart contract trap door* (Mazorra et al. 2022). Simple rug
    pulls are the most common (with 24,870 of the 26,957 rug pulls in one study fitting
    this category [Mazorra et al. 2022]) and involve developers removing liquidity
    from the protocol. A sell rug pull refers to a fraudster creating a token and
    adding some of its total supply to a liquidity pool (and keeping the rest for
    themselves).


    Once enough investors have swapped other (credible) tokens for the newly created
    token, using the initial liquidity the developer provided, the developer will
    swap the rest of their personal supply for the credible tokens (Mazorra et al.
    2022). This may be combined with other efforts to make the token appear legitimate
    and reassuring investors on Telegram® or Discord® servers (while actually selling
    all their tokens) (Mackenzie and Bërzîna 2021).


    Finally, a smart contract trap door rug pull involves designing a token smart
    contract with rug pull–related features. For example, the *mintable* function
    allows a sell rug pull scammer to recoup their original liquidity by automatically
    creating new tokens to remove the liquidity (Mazorra et al. 2022; Xia et al. 2021).


    Other examples include mechanisms that secretly charge users a fee for using,
    minting, swapping, or burning the token (also referred to as *advance fee tokens*)
    (Xia et al. 2021) or functions that permit the developer to control an external
    account that interacts with their smart contract (Mazorra et al. 2022). The possibilities
    for smart-contract trap-door rug pulls are diverse, and it is impossible to identify
    all possible attack vectors for them.


    # **NFT Crime Risks**


    NFTs are digital records of ownership and authenticity of some asset (which may
    be digital or physical) created by smart contracts and stored on a blockchain.
    They are not directly exchangeable for other NFTs—i.e., they are *non-fungible*.
    NFTs suffer from various types of fraud and market manipulation (Das et al. 2022),
    as well as *intellectual property crime* (such as copyright infringement violations
    and counterfeiting) (Çağlayan Aksoy and Özkân Üner 2021; Das et al. 2022). In
    terms of counterfeiting, one analysis revealed 322 NFT collections with similar
    names, a total of 2,438,496 identical image URLs, and 59,425 identical or nearly
    identical NFT images on the OpenSea® NFT marketplace. With regard to potential
    criminal copyright infringement, several legal questions remain outstanding, but
    it does seem to pose an issue (Çağlayan Aksoy and Özkân Üner 2021).


    Types of fraud involving NFTs include forging verification badges, impersonation,
    tampering with off-chain records, and secretly changing royalty costs. Market
    manipulation is also particularly widespread. One type of common market manipulation
    in NFT marketplaces is spoofing (also called *bid pollution*),'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'of which, according to one study, 16,215 instances occurred on OpenSea and
    15,369 on Rarible® (another NFT marketplace). Scholars also observed shill bidding
    and bid shielding, which serve to raise and lower auction bids, respectively.


    Shill bidding affected 282 NFT collections, allowing sellers to profit $13,014,662.
    Bid shielding saved users between $200.77 and $152,606.31 across 316 instances
    on OpenSea. Finally, wash trading is rampant, with some suspecting major projects
    like CryptoKitties® and Decentraland® of benefiting from it. Scholars identified
    9,393 incidences of wash trading, generating $96,858,093 (Das et al. 2022). Another
    study found that between January 2018 and mid-November 2021, wash trading “may
    have inflated the authentic trading volumes by as much as $149.5m for the period”
    (von Wachter et al. 2022).


    There is also concern over the use of NFTs for money laundering (particularly
    as NFT marketplaces generally do not collect KYC or AML information [Das et al.
    2022]) and tax evasion (Sundaravelu 2021). In fact, HM Revenue and Customs in
    the UK recently seized its first NFT (BBC 2022). Rug pulls are also prevalent
    in the world of NFTs (Das et al. 2022). Finally, the U.S. Department of Justice
    recently charged its first insider trading case involving NFTs (United States
    Department of Justice 2022).


    # Conclusions


    Cryptocurrency crime has risen with cryptocurrency’s popularity (Chainalysis 2022).
    Certain characteristics of cryptocurrencies, such as their pseudo-anonymity, low
    barriers to entry, and irrevocable transactions, facilitate their use in criminal
    activities (Kethineni and Cao 2020). Many of the crimes observed in the cryptocurrency
    space, such as various types of fraud, are crypto-enabled in nature; incorporating
    cryptocurrencies represents a novel way to execute these types of crime.


    However, there is also evidence of some crypto-dependent crimes, such as cryptocurrency
    mining crimes. There is a plethora of evidence of certain types of crime involving
    cryptocurrencies, such as fraud, money laundering, cybercrimes, mining crimes,
    and darknet marketplace crimes. Crimes such as terrorism financing, sanctions
    evasion, tax evasion, and bribery and corruption require further research, but
    anecdotal and speculative research suggests they are occurring with cryptocurrencies
    to some extent. As the space evolves (for example, with the advent of DeFi and
    NFTs), we see new types of both crypto-enabled crime (such as intellectual property
    crime) and crypto-dependent crime (such as governance attacks). As these and other
    areas of the cryptocurrency ecosystem evolve, new types of crypto-dependent crime
    are likely to arise.'
