  md: '# V. Layer Zero


    Whereas lightning network is layer 2 and the Bitcoin network is layer 1, we can
    think of “layer 0” as the people who develop and support the entire Bitcoin ecosystem.
    There are several such groups: software developers, node runners, miners, users,
    companies, and, finally, the group of hedge funds, traders, and venture capitalists.
    These aren’t mutually exclusive, but the groups often have competing interests.
    Some of these competing interests relate to Bitcoin’s history as a credibly neutral
    money.


    Bitcoin’s software developers have a reputation for moving slowly precisely so
    that they don’t break things. One major reason for caution: nodes that run different
    versions of the software risk a chain split that creates a new ledger with a new
    cryptocurrency. So it’s of utmost importance that proposed changes don’t split
    the network, whether by accident or disagreement. But, as other networks develop
