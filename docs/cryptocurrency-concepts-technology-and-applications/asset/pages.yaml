  md: 'Figure 11.20 shows that the European call option should be priced at $3.048
    and the put option at $3,667, with hedge ratios of ⁴⁄₉ and ⁵⁄₉, respectively.
    The ⁴⁄₉ hedge ratio for the call option suggests that the investor that is seeking
