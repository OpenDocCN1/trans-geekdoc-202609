    for every four Bitcoins (cover call). For a protective put strategist, he or she
    needs to buy nine put contracts for every five Bitcoins.


    # Summary


    Options have been around since the tulip mania of 1636, when options on tulips
    were widely traded on speculation that tulip prices would continue to soar. Cryptocurrency
    doubters have compared the tulip mania with the significant increase in Bitcoin
    price between 2015 and 2017, and 2019 and 2021, predicting a similar fate. While
    these rapid price increases were followed by sharp retractions, major cryptocurrency
    markets generally remained stable, and prices have continued to rise long term.


    Options markets first began to develop for Bitcoin in 2018, and interest in these
    options helped propel further innovation in the industry. Despite the controversial
    surrounding this new technological disruption of this digital asset, major investment
    firms, government regulatory agencies such as the SEC, and major exchanges including
    the Chicago Mercantile Exchange (CME) have continued to develop derivatives markets
    in step with each other. These markets provide investors with the ability to hedge
    risk and implement complex trading strategies in ways not previously possible.


    The options market for cryptocurrencies has been only one of the latest introductions
    to the cryptocurrency momentum in recent years. When CME introduced Bitcoin and
    Ethereum futures a few years ago, it provided an efficient tool to access exposure
    for these cryptocurrencies and manage risk in a more regulated market than traditional
    cryptocurrency exchanges. These cryptocurrency options follow very closely the
    equity options model, in which the investor has a view of the price and buys or
    sells calls and puts based on this view. As a result, many of the option trading
    strategies used on equity markets can be used on cryptocurrency markets as well.


    The purchase of options is used primarily for hedging investors’ underlying exposure
    or for speculating on the direction of the price with minimal investment. Given
    the recent volatility of the cryptocurrency market, the volume of options trading
    has picked up significantly and is expected to continue to grow as more portfolio
    managers discover this new asset class as a result of increasing interest from
    their customers.'
