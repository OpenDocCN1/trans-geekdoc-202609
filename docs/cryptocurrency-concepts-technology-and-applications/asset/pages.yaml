  md: 'risk-free rate. Before the Black-Scholes formula is stated, the chapter will
    focus on these five variables and other statistical concepts.


    # Five Variables


    All option valuation methods are consistent, using the same five variables: the
    current spot price (cryptocurrency) as the underline asset, the exercise or future
    price, the variance or standard deviation representing the volatility, the time,
    and the risk-free rate described below.


    +   1. Current Spot Price (S₀) of Cryptocurrency. Like the BOPM, the current price
    of the underlying spot price of the cryptocurrency is one of the most important
    variables in determining the intrinsic value of the expected option payoff in
    the future. As mentioned earlier, the relationship between the current cryptocurrency
    price and the future exercise price is the first natural comparison to determine
    how high the spot needs to go to exceed the exercise price for a call option and
    how low the cryptocurrency needs to go below the exercise price for a put option.
    The value, or intrinsic value, of S – X and X – S for the call option and put
    option payoffs, respectively, is the basis of the Black-Scholes formula.


    +   2. Exercise Price (X). This is the future price of the underlying cryptocurrency
    at expiration of the option. This price is constant, and the investor is constantly
    comparing the current spot price (S) to the exercise price as the expiration time
    comes near and the intrinsic value of S – X or X – S is expanding or contracting
    to calculate the call option and put option payoff, respectively.


    +   3. Volatility and Standard Deviation (σ). This is the volatility measured
    by the standard deviation of the historical underlying cryptocurrency price as
    it changes from day to day, week to week, or month to month. Bigger swings in
    the spot price of the underlying cryptocurrency translate to higher volatility
    and a higher standard deviation. Basically, this swing determines how probable
    it is for the cryptocurrency to go higher or lower than the constant exercise
    price. The higher the standard deviation, the more likely the cryptocurrency will
    be in the money, with positive intrinsic value of S – X or X – S for the call
    and put option, respectively. The higher the standard deviation, the higher the
    expected option premium.


    +   4. Time (t). Time to maturity or time to option expiration is an important
    variable to measure the value of the option. In general, the premium paid to buy
    the option is higher if there is more time to exercise. It also gives a higher
    chance for the cryptocurrency to reach the exercise price.'
