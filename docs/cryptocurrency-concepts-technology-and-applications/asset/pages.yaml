  md: 'perfectly anonymous on the web is a mammoth task where one small distraction
    or a computer glitch can reveal the real identity hiding behind a string of characters.
    A recent case, described in the box below, gracefully summarizes this concept.


    # "Welcome to Video": Taking Down the Biggest Child Abuse Website*


    In the course of an investigation, agents of the U.S. National Crime Agency found,
    on a suspect’s laptop, the login credentials for a website called “Welcome to
    Video” (WtV). This website was one of the rare spots in the dark web where people
    could access, upload, and download child sexual abuse material (CSAM) in exchange
    for Bitcoins. What very often prevents investigators from taking down websites
    like this is the widespread use of anonymity tools such as T+ or I2P.†


    The same would have happened with WtV if the investigators had taken the usual
    approach. Instead, they treated this case like a financial investigation and applied
    a “follow-the-money” approach. When NCA agents identified some Bitcoin addresses
    used on the website, they reached out to Chainalysis, one of the leading blockchain
    analysis firms. What they immediately realized was that users and administrators
    of WtV, despite hiding in the dark web and using cryptocurrency to pay inside
    the service, were very naive both when it came to getting their hands on bitcoin
    to access WtV and when they wanted to cash out their proceeds.


    Many users had simply acquired Bitcoins from crypto exchanges and then sent them
    directly to WtV from their personal wallets. The proceeds from the website were
    often liquidated directly to a few exchanges in South Korea, which also provided
    a possible location for the mastermind behind it. Since the service didn’t include
    any options for the users to take their funds out of the website, all the transactions
    leaving WtV’s wallet were going to the admin’s pockets.


    The crucial decision to treat this case as a financial investigation meant that
    agents from the U.S. Internal Revenue Service were brought in. The first mistake
    that the agents noticed, when they had the gruesome task of examining WtV’s pages,
    was that the video’s thumbnails were naïvely not being anonymized.


    * This case is beautifully illustrated in Andy Greenberg’s article Inside the
    Bitcoin Bust That Took Down the Web’s Biggest Child Abuse Site, published on Wired,
    7 April 2022. https://www.wired.com/story/tracers-in-the-dark-welcome-to-video
    -crypto-anonymity-myth/

    † TOR, short for The Onion Router, is free software that enables anonymous communication
    over the internet directing traffic through a free, worldwide, volunteer network
    that conceals a user’s location.

    ‡ The Invisible Internet Project is an anonymizing layer that allows peer-to-peer
    communication. Anonymity is achieved by encrypting the user’s traffic and sending
    it through a volunteer-run network.'
