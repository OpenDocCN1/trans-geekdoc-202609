    # Selling Call and Put Options


    Selling call and put options are contracts in which the seller has the obligation
    to sell or buy cryptocurrencies when the buyer exercises his or her option at
    the exercise price. The seller of an option receives the premium and is hoping
    that the price of cryptocurrency remains out of the money until expiration, so
    he or she can keep the premium. Selling uncovered or naked call options is the
    most dangerous play, since the loss could be unlimited if, for example, Bitcoin
    significantly rises above the exercise price. Selling uncovered or naked puts
    is also very dangerous—for example, if Bitcoin goes down to zero. It''s usually
    advised to sell call or put options in conjunction with either holding Bitcoin
    (covered later in this chapter) or in combination with a buy of a call option
    (also covered later in this chapter).


