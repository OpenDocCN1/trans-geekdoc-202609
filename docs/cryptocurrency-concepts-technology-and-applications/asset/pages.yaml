    # ## IV. Founding


    # ### Bootstrapping Money


    As with legacy institutions, Bitcoin’s appeal doesn’t lie only in its intrinsic
    or technical features, or even in its capacity to solve problems. It also lies
    in its history and founding values.‡


    Imagine that you wanted to create a new money. The goal here would be two-fold:
    to craft a new monetary species and to nurture its network—to grow the class of
    people who treated it as money. These are not easy goals. You might mint a batch
    of units—magical beans, as it were—and award them all to yourself. Without doing
    much more, those beans would be about as useful as an invented language known
    only to you. Somehow those beans need to get into other hands, and circulate from
    there. So you might instead give them away. That would assure some distribution.
    But distribution isn’t enough. You also need to get people to value your beans
    as money. And it’s hard to get people to value something that they’ve only ever
    freely received.


    Perhaps then, you could sell them, first to friends and family, and later to others.
    But this, too, would have limits. Why should anyone want to treat as money these
    magical beans you sold or dispensed to your inner circle? And why should anyone
    trust you not to mint more beans and dilute the value of the ones


