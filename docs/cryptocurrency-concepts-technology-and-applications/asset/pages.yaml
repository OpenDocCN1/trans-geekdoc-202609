  md: '# Buying Call Options


    A traditional call option is a contract that gives the holder the right, not the
    obligation, to buy the cryptocurrency a set price, called the exercise price (X),
    at and before the set date, referred to as the expiration date, no matter what
    happens to the price of the cryptocurrency. Of course, if the holder has the right
    to buy the cryptocurrency at a set price, he or she is hoping that the price of
    the cryptocurrency will go up significantly. The holder can then profit from the
    difference, representing a bullish view on the cryptocurrency.


    Demonstrated in Figure 11.1, the June call option on Bitcoin with an exercise
    price of $50,000 entitles its owner to buy one Bitcoin at a price of $50,000 by
    the third Friday of June (contract expiration date). If the Bitcoin goes to $60,000
    before the third week of June, the option holder will exercise the right to buy
    Bitcoin at $50,000 and then turn around and sell it to the market at $60,000,
    receiving gross proceeds of $10,000. If the Bitcoin goes below $50,000, the option
    holder will let the contract expire without exercising. To purchase the option,
    the investor needs to pay upfront a set price per share called a premium. In this
    example, the buyer of the June option will need to pay $4,300. Figure 11.1 shows
    the payoff, profit, holding period return (HPR), and break-even (BE) of Bitcoin
    during various scenarios and prices (using a range of $20,000–$100,000).


    Figure 11.1 (on next page) shows that if the price of Bitcoin is below $50,000,
    the call option is not exercisable since the spot price (S) minus the exercise
    price (X) will be negative, indicating an out-of-the-money option. At $50,000,
    where the spot price (S) is equal to the exercise price (X), the call option is
    at the money and not exercisable since there is zero payoff (S – X = 0). If the
    price of Bitcoin is higher than $50,000, the call option is exercisable and is
    therefore an in-the-money option. It’s important to note that being in the money
    does not necessarily mean that the option is profitable. It means that there will
    be a payoff if exercised.


    Using the example in Figure 11.1, it shows that if the price of Bitcoin is at
    $60,000 on the last day, then the investor needs to exercise the option. In that
    case, the payoff per share is $10,000 (S – X = payoff or $60,000 – $50,000 = $10,000),
    and the investor will always exercise the option when the Bitcoin price is higher
    than the exercise price, even if the transaction is not profitable. In this case,
    the investor will show profit because he or she receives $10,000, which more than
    covers the $4,300 premium, calculating a profit of $5,700.


    If the investor had locked in the June $30,000 level, for example, and the price
    of Bitcoin is now at $40,000, the investor will still exercise, even if the $10,000
    payoff in this case is lower than the $14,000 premium shown in Figure 11.1. Since
    the investor paid a $14,000 premium for the option, if exercised at any price
    in the money, the investor can recover some of the initial loss (premium paid).
    Instead of losing the entire premium of $14,000, by exercising the call option
    at $40,000, the'
