  md: 'hand, unfortunately, since the purposes of hacking and thievery find common
    cause among criminal actors.


    In simplified language, hacking can be accomplished in multiple ways (see technical
    breakdowns in Hu and You 2021; Arsi et al. 2022), but it generally relies on (1)
    overwhelming the production (mining) process with computing power; (2) breaking
    into owners’ wallets (keys); or (3) intercepting/hijacking transactions; and among
    these, the second category is the most universally understood definition as well
    as the most common.


    Theft, for the purposes of reference here, can refer to three sorts of expropriations:
    (1) ransomware attacks which hijack computers and restore them in exchange for
    cryptocurrency payments, (2) extracting code from wallets (keys), or (3) hijacking/rewiring/re-engineering
    transactions, the second category being the most common. There are many instances
    of significant hacks and thefts over the short time that cryptocurrency has existed
    (Hu and You 2021; Krupa et al. 2021; Arsi et al. 2022), but a few incidents warrant
    particular mention, as follows:


    +   1. Mt. Gox. The Japanese cryptoexchange Mt. Gox was, in its heyday (circa
    2013), the largest Bitcoin exchange in the world, handling more than 70% of the
    global volume of Bitcoin transactions (Ito and Howe 2016). It was first hacked
    in 2011, and $8.8 million was stolen, but a gradual hemorrhaging of its hot wallet
    over time accumulated into nearly 850,000 bitcoins being siphoned off ($600 million
    at the time), and this was because fake Bitcoins were being pushed onto the exchange
    as well. This was the largest security breach of its kind until then, and it was
    premised on the absence of a version control security software, which meant that
    hackers could re-engineer new versions of the exchange without sufficient deterrence.
    Given the scope of losses, many lawsuits were filed by customers against the company
    (thus initiating a legal-recourse element), which are still being addressed through
    a civil rehabilitation plan.


    +   2. Coincheck. Coincheck is another cryptoexchange worthy of mention because
    of the size of the breach and theft. In January 2018, malicious actors broke into
    the exchange using a phishing attack, which spread malware across the system and
    the hot wallets, grabbing hold of cryptocurrency worth $534 million at the time.
    To date, this has been the largest single attack on an exchange.


    +   3. Continental Pipeline. Continental Pipeline is part of the U.S. energy infrastructure,
    which suffered a massive ransomware attack in May 2021. The size of the attack
    was significant because it halted all pipeline transmission, leading to fuel shortages
    across the eastern United States. It is pertinent to the criminality of cryptocurrencies
    because the ransomware attackers demanded 75 Bitcoin ($4.4 million at the time)
    in exchange for'
