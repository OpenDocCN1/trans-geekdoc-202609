    # Transaction Costs


    Intermediaries exist in part to detect, prevent, and reverse fraud. Their bottom
    lines require that they levy fees on every transaction. In traditional systems,
    different kinds of transfers call for different plumbing through the financial
    system and specialized business models. One familiar kind of transfer in the United
    States is consumer spending through credit cards. A credit card transaction ultimately
    involves several intermediaries—the card’s issuing bank (e.g., Chase), the credit
    card company (e.g., Visa), and the merchant’s bank (e.g., PNC). Clearance and
    settlement of the payment usually takes a few days. So multiple companies with
    large payrolls need to skim off the top. As a result, consumers often pay 1.5–3%
    in transaction fees.


    Remittances take another route through the world’s financial plumbing. Someone
    in one country sends funds to someone in another country, and depending on the
    particular route one takes, this usually involves at least the money transfer
    operator as well as the intermediaries that send and receive the funds on each
    end, respectively. Everyone takes a cut, especially if an intermediary exchanges
    one currency for another.


