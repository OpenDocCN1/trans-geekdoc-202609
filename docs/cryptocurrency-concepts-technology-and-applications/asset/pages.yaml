    I was navigating the most well-known Bitcoin forum in 2013. People were discussing
    the possibility that cryptocurrency used for criminal activity could be traced
    and confiscated by law enforcement. Bitcoin was perceived to be almost untraceable,
    and criminals could achieve almost perfect anonymity simply by using it. At the
    time, this was not far from the truth. Knowledge about Bitcoin among investigators
    was really poor. I am sure that most of the law enforcement officers would not
    have been able to detect the use of cryptocurrency even if it


