    # Portfolio Analysis and the Black-Litterman Model


    Portfolio analysis rests on three fundamental equations, as follows*:


    ```

    E(R_p) = \sum_{i=1}^n w_i E(R_i)

    (1)

    ```


    ```

    \sigma_p^2 = \sum_{i=1}^n \sum_{j=1}^n w_i w_j \sigma_i \sigma_j \rho_{ij}

    (2)

    ```


    ```

    \sum_{i=1}^n w_i = 1,

    (3)

    ```


    * Although the equations are in mean-variance form, convention has led to the
    use of standard deviation in place of variance as a measure of risk, which is
    frequently referred to as volatility.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'where,


    \( E(R_p) \)


    = expected rate of return on a portfolio of securities;


    \( \sigma_p^2 \)


    = variance of the portfolio as a measure of risk;


    \( \sigma_i \sigma_j \rho_{ij} \)


    = covariance of the returns of the securities comprised by the


    portfolio; and


    \( w_i \)


    = weight assigned to each security.


    Because the analysis in this study is restricted to “long-only” portfolios, \(
    w_i \ge 0 \).

    This is to state that “shorting” of securities does not apply. The objective is
    to

    minimize portfolio risk subject to an expected return—namely, minimizing

    equation (2) subject to equation (1). It leads to the positive relationship between

    expected return and risk. Although this quadratic is relatively easy to optimize,

    the results are often out of step with reality, as Benninga (2008, 349) expresses:


    > It is possible to come away from a standard textbook discussion of portfolio
    opti-

    > mization with the impression that a fixed set of mechanical optimization rules,

    > combined with a bit of knowledge about personal preferences, suffices to define

    > an investor’s optimal portfolio. Anyone who has tried to implement portfolio

    > optimization using market data knows that the results are often a nightmare.


    Why is this so? Although historical data are useful for estimating portfolio

    risks, the same does not apply for expected returns. In other words, past results

    are often not an accurate indicator of future returns, as cogently expressed by

    Elton (1999). This is the motivation for the model of Black and Litterman

    (1992). Rather than relying strictly on historical returns, it estimates expected

    returns from the capital asset pricing model (CAPM), which models expected

    returns, as follows:


    \( E(R_i) = \beta_i [E(R_m) - R_f], \)


    (4)


    where,


    \( E(R_i) \)


    = expected rate of return on security \( i \);


    \( E(R_m) \)


    = expected rate of return on “the” market;


    \( [E(R_m) - R_f] \)


    = the reward for assuming additional risk, a risk premium;


    \( R_f \)


    = a “risk-free” rate of return; and


    \( \beta_i \)


    = index of systematic, or market, risk normalized around 1.0,

    defined as the covariance of the rates of return on security \( i \)

    relative to the variance of the rates of return on “the” market.'
