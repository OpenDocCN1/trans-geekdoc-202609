  md: '# Option Premium Calculations Based on European Structure


    The probability calculations for both the call and put option premiums are the
    same. After the investor calculates the call and put option payoffs for the second
    period, the probability is applied to the upper/upper, upper/lower, and lower/lower
    payoffs as follows:


    # Call Option Premium


    Cu = \frac{p(Cu^2)+(1-p)(Cud)}{(1+i/f)}   and   Cd = \frac{p(Cud)+(1-p)(Cd^2)}{(1+i/f)}


    and then C = \frac{p(Cu)+(1-p)(Cd)}{(1+i/f)}


    # Put Option Premium


    Pu = \frac{p(Pu^2)+(1-p)(Pud)}{(1+i/f)}   and   Pd = \frac{p(Pud)+(1-p)(Pd^2)}{(1+i/f)}


    and then P = \frac{p(Pu)+(1-p)(Pd)}{(1+i/f)}


    # Option Premium Calculations Based on American Structure


    The probability calculations for both the call and put option premiums are the
    same. After the investor calculates the call and put option payoffs for the first
    period, the probability is applied to the upper and lower payoffs as follows:


    # Call Option Premium


    C = \frac{[p(C higher payoff) + (1 - p)(C lower payoff)]}{(1 + i/f)}


    # Put Option Premium


    P = \frac{[p(P lower payoff) + (1 - p)(P higher payoff)]}{(1 + i/f)}


