- pgno: 220
  md: 'a piece of neutral infrastructure—rather more like a natural physical element
    than, say, the U.S. dollar. Suppose that’s right. Suppose that Bitcoin is digital
    gold. What might follow? We’ll offer a few suggestions under the categories of
    policy-making, journalism, and academic research.


    # Policy-Making


    Bitcoin has, in fact, already won as a globally neutral monetary network. Nurturing
    the Bitcoin network, using Bitcoin as a reserve asset, or making payments over
    Bitcoin would be analogous to deploying gold within the monetary system—only digital,
    more portable, more divisible, easier to audit and verify, and more difficult
    to confiscate.


    So attempts to ban Bitcoin or limit its use will meet strong resistance.* It is
    native to the internet and, as a result, extremely difficult to tamp down. In
    this regard, we liken Bitcoin to cryptography. Whereas cryptography provides censorship-resistant
    communication, Bitcoin provides censorship-resistant communication of value. And
    just as the efforts to limit the strength and spread of cryptography failed in
    the 1990s, we expect that it will be similarly difficult to limit the strength
    and spread of Bitcoin.†


    Whether this is good or bad overall is the subject for another time. But there’s
    widespread evidence that Bitcoin is helping the underbanked, as well as those
    who suffer under authoritarian rule and runaway inflation.‡ There’s also wisdom
    in not wasting resources fighting the inevitable.


    # Journalism


    We must not assume that cryptocurrencies share more in common than they, in fact,
    do. Bitcoin leads them all precisely because no one leads it. The policy must
    begin here from a place of understanding—not of cryptocurrency in general, but
    of Bitcoin in particular. The general category isn’t going anywhere precisely
    because Bitcoin, itself, isn’t going anywhere. We owe it special attention. Too
    often, journalists lump Bitcoin in with all other cryptocurrency projects. And
    while these other projects benefit from the association, Bitcoin’s reputation
    suffers from it. More often, journalists should distinguish between Bitcoin and
    “crypto.” Our slogan: not Bitcoin only, but Bitcoin first.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Research


    Bitcoin’s victory as neutral money should have downstream consequences for academic
    research, too. Presently, there is only one research center mostly devoted to
    Bitcoin—MIT’s Digital Currency Initiative—and it has a near-exclusive focus on
    computer science. There are several other research centers devoted to cryptocurrency
    overall, with very few researchers working on Bitcoin exclusively. If we were
    to apportion research and research centers to importance and long-lasting impact,
    however, we’d find the reverse.


    We need more Bitcoin-first research and research centers precisely because Bitcoin
    is, by far, the most likely to have a long-lasting impact on our world. And, since
    Bitcoin is so highly interdisciplinary, such centers should be full of experts
    from all the different disciplines that touch on it—economics and computer science,
    of course, as well as law, philosophy, political science, and business. And we
    should devote more resources to understanding it rather than projects which, like
    Icarus, fly too close to the sun before flaming out.


    # VII. Conclusion


    Bitcoin is not the king of money. That honor goes to the U.S. dollar. But Bitcoin
    is the king of cryptocurrencies. Bitcoin is the most valuable, most secure, and
    most credibly neutral internet-native asset in the world. Arguably, it is the
    most valuable cryptocurrency precisely because it is the most secure and credibly
    neutral.


    Yet all kings pass away. How long, then, will the dollar or Bitcoin reign over
    their respective domains? And in the meantime, how far will Bitcoin extend its
    boundaries? This question inspires several others, for those who have an imagination.
    How many more countries will adopt it as legal tender? Will countries use it to
    evade sanctions someday? Will Bitcoin serve as a major reserve asset, used in
    international trade? Will countries look to sign treaties to limit each other’s
    hashrate? How many lives will it save? Will it overtake physical gold’s market
    capitalization? Will the lightning network make other payment processors and remittance
    services obsolete? What new kinds of crime might it enable—or disable, for that
    matter? How many central banks will it undermine? These questions strike some
    as silly. But we take them quite seriously. And we’d like to encourage others
    to take them seriously, too.


    * We thank Bradley Rettler and Troy Cross for helpful comments and critique. Disclosures:
    The authors are both fellows with the Bitcoin Policy Institute, a Bitcoin research
    think tank. In addition, Craig Warmke writes for Atomic.Finance, a Bitcoin finance
    startup company. The authors regularly use Bitcoin and fiat currencies, including
    USD and SGD.'
