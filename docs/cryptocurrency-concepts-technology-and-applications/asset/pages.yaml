  img_proc: true
- pgno: 173
  md: 'one and the same, as one can occur without the other (see typologies in Storm
    2013). Bitcoin and other cryptocurrencies are therefore seen as both AML and tax
    evasion risks (Slattery 2014).


    On the tax-evasion side specifically, some authors have argued that cryptocurrencies
    are “super tax havens” because they could become the “weapon-of-choice” for tax
    evaders (Marien 2013, p.38). Given the gravity of the tax evasion risk (Matei
    and Baks 2019), tax authorities in many countries have begun to synchronize their
    efforts with financial regulatory bodies and law enforcement agencies. For example,
    in the United States, cryptocurrency is treated as “property” for taxation purposes
    and either a “security” or a “commodity” for regulatory purposes (depending on
    its size, see Chohan 2022a-b).


    Because of this, the Internal Revenue Service (IRS), which is the federal tax
    authority in the U.S., works with the Securities and Exchange Commission (SEC)
    and Commodities Futures Trading Commission (CFTC), along with the Department of
    Justice (DoJ) to combat the legal issues from multiple angles, including the tax
    evasion element (Chohan 2021a, 2022a; DoJ 2020).


    # Terrorist Financing and Rogue Actors


    Although money laundering and terrorist financing are often lumped together for
    the purposes of tracking international illicit finance (AML/CFT [countering the
    financing of terrorism]), in this chapter the fears of terrorist financing and
    rogue actors (whether state actors, semi-state actors, or non-state actors) are
    given separate treatment because of the gravity and the motives of their actions
    (Killick and Parody 2007).


    The most worrying category pertains to rogue states, who can muster the wherewithal
    to engage in hacks and thefts of exchanges and private wallets, so as to extract
    coins for use in financing illicit projects by bypassing sanctions regimes put
    in place against them.


    The next most worrying category includes terrorist outfits’ using similar approaches
    to bypass sanctions and international anti-terror oversight measures (Chohan 2021a).
    The U.S. DoJ has done extensive work on this front and found instances of both
    sorts of parties engaging with cryptocurrency in illicit ways, as for example
    the Iranian and North Korean governments, or Al-Qaeda and ISIS subgroups and sympathizers
    (DoJ 2020).


    Cryptocurrency is therefore viewed as an “unconventional” but very serious challenge
    (Dostov and Shust 2014), because it effectively becomes the battleground for ideological
    and nationalistic interests, along with arenas of contestation through economic
    warfare.


    As of this writing, the Russo-Ukrainian conflict is growing, and Western countries
    have announced a swathe of economic sanctions, larger in scope than those declared
    in the past. However, many observers are dismissing the sanctions as'
