    knowledge required to operate certain departments and agencies. While bureaucrats
    maintain the moniker of “civil servants,” public choice scholars study them through
    the same lens as they would any other utility-maximizing individual.


    As Benson (1995) explains, “(1) Only individuals act and make decisions, (2) people
