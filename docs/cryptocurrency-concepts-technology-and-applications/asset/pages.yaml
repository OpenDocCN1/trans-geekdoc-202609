- pgno: 172
  md: 'guidelines and warnings being issued about investing in such a volatile, high-risk,
    and vulnerable space (Chohan 2017a, b). Many countries (e.g., U.K., Lithuania,
    Australia, U.S.) have indeed issued statements (see example in Clayton and Giancarlo
    2018) to that effect, urging the public to remain cautious in proceeding with
    cryptocurrency.


    # # Money Laundering and Tax Evasion


    Money laundering is a very serious and systemic concern regarding cryptocurrency,
    as it can be easily used to engage in transactions that would sidestep the traditional
    financial system with comparative ease. For this reason, it is frequently described
    as “a convenient tool for money laundering” (Dyntu and Dykysi 2018).


    Much work has been done to identify the scope and threat presented by the use
    of cryptocurrency for anti-money laundering (AML) purposes, and the findings of
    the literature largely point to a grave threat that requires proactive regulatory
    action at both a national and international scale (Dyntu and Dykysi 2018; Barone
    and Masciandaro 2019; Dupuis and Gleason 2020; DoJ 2020; Chohan 2017b, 2021a,
    2022a).


    Cryptocurrency can be traded through multiple accounts from multiple locations,
    and their tracks can be muddled to a large (but not complete) extent. Furthermore,
    their exchange does not (despite international efforts to this effect, see FATF
    2019) need to be grounded in traditional regulatory oversight of Know-Your-Customer
    (KYC) procedures by banks or governments.


    Recognizing this, a significant effort has been made by regulators and law enforcement
    agencies to try to curb money laundering efforts (see FATF 2019; DoJ 2020; Chohan
    2017b, 2021a, 2022a). At the crux of these initiatives lie the principles of coordination
    and regularization, with the former recognizing the transboundary nature of the
    problem and the arbitrage among jurisdictions, and the latter recognizing that
    an entirely parallel system of monetary exchange poses a threat to the traditional
    financial system with time.


    Coordination is a function of willful capacity and information sharing efforts
    by multiple jurisdictions, while regularization is a function of embedding cryptocurrency-based
    transactions in the existing banking architecture. Efforts along these lines have
    been mired by challenges including reticence in cooperation (Chohan 2021a) and
    the complexity of the technologies (Chohan 2022a), but at the same time, in terms
    of regulatory/legal concerns behind the outlawing of cryptocurrency in certain
    jurisdictions (Chohan 2017a), money laundering remains a foremost consideration,
    to the extent that cryptocurrency is at times accused of being “the new face”
    of money laundering (Mabunda 2018).


    An important corollary to money laundering is tax evasion, since both are often
    seen as part of the larger problem of illicit finance, although the two are not'
