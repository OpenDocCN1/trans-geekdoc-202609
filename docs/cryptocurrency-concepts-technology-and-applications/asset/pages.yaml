- pgno: 27
  md: '# Chapter 1


    # Cryptocurrency Industry:

    A Review of Current and

    Future Trends


    Huijian Dong


    School of Business, New Jersey City University

    Teacher''s College, Columbia University


    This chapter summarizes the current state of cryptocurrencies and expands their
    development trajectories to shed light on the industry outlook. The topics introduce
    the nature of each cryptocurrency, evaluate cryptocurrencies as financial assets,
    and assess cryptocurrencies as money. Each topic in this chapter starts from the
    current trend review and concludes with future trends in the specific area.


    The first topic, _different cryptocurrencies: timeline of development_, reviews
    the development path of the major cryptocurrencies and provides the prospect of
    their status in the coming decade. This topic also sets the groundwork by articulating
    multiple concepts that are interchangeably used by stakeholders. Such groundwork
    avoids obfuscating the issue under discussion by identifying the misinterpretation
    oftentimes seen.


    The second topic, _cryptocurrencies: market development_, illustrates the players
    at the marketplace and explains the related financial instruments. The key elements
    are the primary market, the secondary market, the exchanges, and transaction service'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'providers such as wallets. The related financial instruments are cryptocurrencies
    and their derivatives, including futures contracts, options, exchange-traded funds
    (ETF), and cryptocurrency tokens. This topic regards cryptocurrencies as a financial
    asset rather than as money.


    The third topic, *cryptocurrencies, financial markets, and monetary policies*,
    reviews the interaction of the price of cryptocurrency with other financial assets
    and monetary policies. These reviews help provide a clear outlook of cryptocurrency
    prices and transactions. This topic approaches cryptocurrencies from the unit
    of account function as money.


    The fourth topic, *development of cryptocurrency goods and services market and
    factors market*, makes an inventory of the existing use of cryptocurrencies in
    the conventional goods and services market. This market is often referred to as
    the *real economy*. The primary focus of this topic is to observe the acceptance
    of cryptocurrencies in the transactions that provide nonmonetary utility among
    individuals and organizations around the world.


    The secondary focus is to point out the issues with cryptocurrencies that prevent
    them from being widely accepted as a quasi-fiat money. Furthermore, the view of
    cryptocurrency''s being an element of the factors market initiates a new angle
    by examining the current and future status of cryptocurrencies with respect to
    three factors: human capital, financial capital, and resource capital (Myers and
    Czarnezki 2021).


    Unlike the second topic, which views cryptocurrencies as financial assets, this
    topic explores the future trend that cryptocurrencies serve as the infrastructure
    to incubate financial assets. This topic approaches cryptocurrencies from the
    medium of exchange function and the store of value function as money.


    The last and fifth topic, *the outlook of the development of cryptocurrency*,
    provides the projected path of cryptocurrencies in the next decade. It starts
    from the number of different types of crypto, the market capitalization, and the
    trading volumes and forecasts the financial market development of cryptocurrencies.
    This topic also marks several important milestones that cryptocurrencies need
    to conquer to be recognized as quasi-fiat money. This topic concludes by depicting
    the ideal characters of the cryptocurrencies.


    # # Different Cryptocurrencies: Timeline of Development


    Although currency has been developed and utilized by humans for thousands of years,
    there are only two types of currency: physical money and script money. The former
    refers to shells, precious metals, or even cigarettes; the latter refers to notes
    that have trivial value but are trusted to have physical value empowered'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'by the issuers. Cryptocurrencies are script moneys whose credits are established
    on decentralized technological outputs and the expectation that such outputs would
    be widely embraced, especially by trusted authorities (e.g., in September 2021,
    Salvadoran President Nayib Bukele announced that El Salvador would become the
    first country in the world to accept Bitcoin as legal tender, alongside the U.S.
    dollar) and large institutions (e.g., J.P. Morgan Chase announced its development
    of JPM coin on February 14, 2019, and Meta (then Facebook®) announced its development
    of Libra on June 18, 2019).


    According to Howarth (2022), by the end of 2013, there were over 50 different
    cryptocurrencies. And by the end of 2014, this figure had increased by approximately
    10 times to more than 500. As of March 2022, there are 18,465 total cryptocurrencies
    in circulation, though two-thirds of them do not have significant values that
    are monetarily influential. They are mainly traded in North America, Europe, and
    Asia. According to Howarth (2022), as a continent, Asia has more than four times
    more cryptocurrency users than any other continent. As of April 2022, the cryptocurrencies
    with the largest market capitalizations are presented in Table 1.1.


    # Table 1.1 Cryptocurrencies with the Largest Market Capitalizations


