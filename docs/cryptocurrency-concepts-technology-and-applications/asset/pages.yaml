- pgno: 67
  md: 'evidence counter to efficient pricing. Other studies pointing to mispricing
    include those by Day et al. (2021) on the profitability of using Bollinger bands,
    a method based on charting stock prices; Hung, Liu, and Yang (2021) on the destabilizing
    behavior of retail Bitcoin traders; and Nepp and Karpeko (2022) on the impact
    of “collective hysteria” on Bitcoin pricing.


    A related strand of research deals with a characteristic of investor behavior
    referred to as “herding.” Classified under a field called “behavioral finance,”
    the study of the impact of psychology on financial decision-making, herding occurs
    when investors tend to trade either consciously or unconsciously on one side of
    the market rather than performing their own analyses. Such behavior can lead to
    market mispricing. As evidence in equity markets, Dorn, Huberman, and Sengmueller
    (2008), Barber, Odean, and Zhu (2009), and Merli and Roger (2013) each uncover
    herding behavior among retail investors, a tendency that appears more salient
    than among professional investors. Regardless, the evidence points to investors
    mimicking their own past activities, however inaccurate such activities are for
    estimating expected return.


    The same observation applies to cryptocurrency markets. Ballis and Drakos (2020)
    uncover clear signals of herding, attributing it to irrational investing that
    is unrelated to individual investor’s views. Their conclusions align with those
    of Nepp and Karpeko (2022) on “collective hysteria” among Bitcoin traders. Junior,
    Palazzi, Taveras, and Klotzle (2020) obtain similar evidence, finding that herding
    occurs across market conditions, as revealed in both price and volatility. Yarovaya,
    Matkovskyy, and Jalan (2021) acknowledge the presence of herding in cryptocurrency
    markets but caution on its prevalence, as they are unable to find evidence of
    a “black swan” during the global pandemic.


    Gemayal and Preda (2022) provide evidence of herding behavior during both bull
    and bear markets but find that herding is significantly more prevalent during
    bearish periods. They also show that herding is almost natural when information
    is sporadic and hard to find. They also find evidence of investors first acting
    on fundamental information before being overwhelmed by emotional reaction based
    on the feelings of “missing out.”


    The collective evidence points to inefficient pricing—a finding that aligns with
    exceptions to “weak form” efficiency, which states that past price and volume
    data, no matter how compelling, cannot systematically be used to achieve above-market
    performance. This signals an incentive for Bitcoin to be incorporated into portfolios.
    As compelling as the evidence may be, however, studies to date concentrate on
    the behavior of Bitcoin but without providing guidance to investors on the percentage
    allocation.


    As a cryptocurrency, Bitcoin is a unique asset. As such, it may have diversification
    potential. In an early study, Wu and Pandy (2014) advance the analysis by using
    optimization techniques to demonstrate efficiency gains from Bitcoin'
