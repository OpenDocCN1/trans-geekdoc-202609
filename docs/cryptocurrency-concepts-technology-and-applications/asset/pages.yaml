    This chapter looks through the public choice lens to explore how collective decisions
    can be impacted by technological innovations in cryptocurrency. We rely on the
    traditional public choice research agenda to analyze how crypto''s blockchain
    technology might influence our understanding of political and policy decisions.
    We present a set of illustrative case studies about non-market decision-making
    that have been thoroughly studied in public choice research. These case studies
    investigate whether cryptocurrency technology can potentially help improve decision-making.
    We argue that developments in crypto technology illuminate the institutional arrangements
    surrounding non-market decision-making and can perhaps alleviate some public choice
    problems.


    Our approach offers unique insights on the relationship between the emerging crypto
    technology and public choice thought. In each case, we identify an issue raised
    in the public choice literature and then explore how the emerging cryptocurrency
    technology—and in some instances the currency itself—provides new insights on
    non-market decision-making. Our core question specifically explores whether blockchain
    technology allows for new ways to coordinate political and economic activity and
    what the implications of those new ways might be.


    # Cryptocurrency, Blockchain, and Decentralized Autonomous Organizations (DAOs)


    To provide context for our discussion of the common public choice problems, explaining
    the technology behind the development of most cryptocurrencies—namely, blockchains—is
    necessary. Put simply, blockchains are continuous strings of information. They
    are growing records of information, bundled into blocks and chained together,
    using cryptography, which is a technique in solving codes. One of the most common
    uses of blockchain is in the form of a ledger for digital currencies. Unlike typical
    money, cryptocurrencies are solely electronic and are not backed by a physical
    currency or asset. Each cryptocurrency network, such as Bitcoin or Ethereum, maintains
    a blockchain that serves as a ledger or record for every transaction that takes
    place (Waugh 2022). The blockchain links together blocks, or bundles of transactions,
    in a time-stamped sequence that can be publicly viewed.


    It is important to note that cryptocurrency blockchains are decentralized. They
    do not require a third-party to maintain them. They achieve consensus, or deciding
    what is valid and what is not, via a consensus mechanism. The most popular cryptocurrency
    consensus mechanisms are known as proof-of-work (PoW) and'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'proof-of-stake (PoS). On PoW blockchains, blocks are created through *mining*.
    For each block of the chain, miners (computers) compete to solve a cryptographic
    puzzle, using the processing power of their computers. This process requires a
    significant amount of resources in the form of computing power and electricity.
    Once the first miner solves the problem, a block of the verified transaction is
    added to the chain, and the transaction becomes a part of the permanent record.
    In exchange for its work, the miner receives a reward in cryptocurrency, which
    provides the incentive for them to expend their computing power to mine more blocks.


    Mining is the “work” in the term proof-of-work. Miners use their computing power,
    or work, to “prove” the network. Because the network creates a permanent record
    of verified transactions, PoW eliminates the need for a central authority and
    provides a decentralized validation record.


    As for proof-of-stake, network participants “stake” or lock up their crypto assets,
    in exchange for becoming validators of the blockchain. Validators are randomly
    selected by the network to verify the blockchain. PoS validators are similar to
    PoW miners, but instead of work, their stake allows them to validate the network.
    Campbell Harvey argues in *DeFi and the Future of Finance*,


    > Validators make themselves available by staking their cryptocurrency and then
    they are randomly selected to propose a block. The proposed block needs to be
    attested by a majority of the other validators. Validators profit by both proposing
    a block as well as attesting to the validity of others’ proposed blocks (Harvey
    2021).


    In both PoW and PoS, consensus over the blockchain, or the ledger of each network,
    is arrived at without the need for a centralized actor to ensure that the ledger
    is valid.


    # Smart Contracts


    One innovation that provides a useful example of the potential for blockchain
    to influence collective decision-making is a *smart contract*. Smart contracts,
    which


    * Nick Szabo conceptualized the smart contract in 1994. He defined it as “a computerized
    transaction protocol that executes the terms of a contract. The general objectives
    of smart contract design are to satisfy common contractual conditions (such as
    payment terms, liens, confidentiality, and even enforcement), minimize exceptions
    both malicious and accidental, and minimize the need for trusted intermediaries.
    Related economic goals include lowering fraud loss, arbitration and enforcement
    costs, and other transaction costs.”'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'are commonly deployed on the Etheruem blockchain network, allow for individuals
    to write code on top of existing code, creating new products that “live” on that
    blockchain. Harvey et al. (2021) observe that smart contracts are “code that lives
    on a blockchain, can control assets and data, and define interactions between
    the assets, data, and network participants.” They allow for the automatic execution
    of an agreement, usually a transaction, based on the directions written into their
    code. Thus, individuals and institutions can automate transactions without the
    need for a third party or intermediary. These applications built using smart contracts
    are called *decentralized applications* or dApps. Once dApps are built, individuals
    can interact peer-to-peer across the app without the need for a central decision-maker.


    One of the most significant innovations that emerge from dApps is *decentralized
    autonomous organizations* (DAOs). DAOs are digital organizations that are owned
    and managed by their members and governed by a smart contract on the blockchain.
    The smart contract functions as a set of by-laws, similar to a constitution, which
    outlines rules governing how the DAO operates and how future changes to the rules
    can be made.


    Once the smart contract programming has been finalized and the funds raised and
    deposited in a financial intermediary, the DAO is deployed on the blockchain,
    where transactions and changes to the DAO are transparent, verifiable, and approved
    by members (Waugh and Wright 2022). Members can join the DAO by voluntarily acquiring
    governance tokens in the DAO. DAOs serve a variety of purposes—such as a freelancing
    network, investment fund, neighborhood watch, or community management tool—for
    community centers such as a park. DAOs raise funds via selling tokens or shares,
    similar to a direct public offering, through which engagement is voluntary and
    requires affirmative action.


    The implications of DAOs, as well as programs that live on top of the blockchain
    technology, provide a potential alternative to the issues raised by public choice
    scholars in the study of non-market decision-making. To illustrate this potential,
    we review three traditional cases studied by public choice scholars, and how these
    technologies, particularly DAOs, can help alleviate them.


    # Illustrative Case 1: Questions of Voting: Unanimity, Parties, Coalitions/Interest
    Groups


    Our first illustrative case examines the potential for blockchains to influence
    some of the common public choice issues that arise in the use of voting to make
    collective decisions. We explore whether expanded opportunities for democracy
    from an institutional perspective can emerge from the use of the technology'
