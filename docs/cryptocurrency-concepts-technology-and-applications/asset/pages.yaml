    # 4.4 CBDC Adoption: Implications for Cryptocurrency


    The emergence of CBDCs has several implications for cryptocurrency’s survival.
    The first implication is the potential for CBDCs to replace cryptocurrencies (Allen,
    Gu, and Jagtiani 2022). A well-developed CBDC can completely displace cryptocurrency
    from societies if cryptocurrency developers do not ensure a responsible and orderly
    development of cryptocurrencies. Recently, cryptocurrencies, or crypto assets,
    have become more suitable for use as speculative assets rather than as money (Nguyen
    et al. 2019). The high valuation of cryptocurrencies and their high volatility
    have made them unattractive to be used as money. This can lead to loss of confidence
    in using cryptocurrency for day-to-day retail transactions.


    Another implication of the emergence of CBDC for cryptocurrency relates to the
    need to regulate all types of digital currencies in the formal payment system.
    The adoption of CBDC raises serious debate about whether a CBDC should coexist
    with cryptocurrencies in the formal payment system through cryptocurrency regulation
    (Bolt, Lubbersen, and Wierts 2022). This is a sensitive topic, because such regulation
    may require cryptocurrencies to lose some or all of their anonymity features or
    cryptographic properties, which is the essential feature that makes it a cryptocurrency.
    If regulation completely removes the'
