    It''s a real pickle, one long studied by monetary economists and historians. How
    can we bootstrap a new money?* The problem is especially pressing for new private
    monies. States can force citizens to pay taxes in a given monetary species, thus
    ensuring non-zero demand for that species, no matter its origins or intrinsic
    technical features. Not so for typical non-state actors; they must find another
    way to persuade others to treat their new units as money.


    Here is how Satoshi Nakamoto, Bitcoin''s pseudonymous creator, approached the
    problem:


    # Fair Distribution


    Bitcoin''s creator didn''t freely mint money for himself, his friends, or other
    insiders. There is exactly one way to mint new Bitcoin: to complete proofs of
    work—that is, to burn electricity and processor cycles in the discovery of new
    blocks and to claim the accompanying reward of newly minted Bitcoin. No exceptions.


    So Satoshi had to pay for his Bitcoin, just like anyone else. He did not make
    magic beans out of thin air and hawk them at the local market. He bought them
    from nature, just like anyone else, and the price was energy. Minting requires
    mining. So the marginal cost of production for Bitcoin is non-zero, and it''s
    a price anyone must pay if they wish to mine it. Mining has also been open to
    all since the network launched. So although Bitcoin has early adopters, it has
    no insiders.


    Not all cryptocurrencies follow this model. Some, in stark contrast to Bitcoin,
    involve early rewards or pre-mines for their creators and other insiders. Here,
    the marginal cost of production for new monetary units is effectively zero, and
    early insiders acquire their units under different rules than others. Under a
    so-called “pre-mine,” creators do not purchase their coins from nature in a free
    and open competition. Instead, they mint their units for free and sell some to
    others. Here is a typical allocation of tokens from a new network called Optimism
