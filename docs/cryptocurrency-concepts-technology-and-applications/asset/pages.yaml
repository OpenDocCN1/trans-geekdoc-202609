    # # Cryptocurrencies, Financial Markets, and Monetary Policies


    The prices and trading volumes of cryptocurrencies are significantly affected
    by regulations and government recognition, as Warren (2020) suggests. As this
    is one of the dominating factors for the entire industry, this chapter leaves
    it for a separate chapter of elaborations by simply reminding the audience regarding
    its significance.


    The prices and trading volumes of cryptocurrencies are also highly cointegrated
    with the global money supply. This implies that cryptocurrencies are still widely
    considered investment objectives rather than foreign currencies. Typically speaking,
    fiat monies are only regarded as investment objectives engaged in high-leverage
    transactions. In the case that the supply of a fiat money increases significantly,
    other fiat monies'' values appreciate simultaneously, ceteris paribus. However,
    in the case of cryptocurrencies, the oversupply of fiat money brings incremental
    cash inflows to cryptocurrencies. Figure 1.1 reports the cryptocurrencies'' prices
