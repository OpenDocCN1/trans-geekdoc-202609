  md: 'Investors should also be aware of an unsystematic risk in Bitcoin that is not
    reflected in the numbers: non-regulatory risk. Because Bitcoin does not trade
    on established exchanges, such as those found on stocks, bonds, and commodities,
    and its activities are not regulated by a central authority that promotes smooth
    and transparent operations, it is subject to theft. For example, on February 8,
    2020, the Department of Justice uncovered a conspiracy to launder $4.5 billion
    in stolen cryptocurrency. Such an instance is not unique because cryptocurrency
    exchanges are essentially (unregulated) platforms that are easy targets for criminals.


    Non-regulatory risk, however, is not limited to safety issues. Bitcoin is subject,
    for example, to the threat of price manipulation given its concentrated ownership.
    As of 2022, the top 10% of Bitcoin miners control an estimated 90% of the mining,
    with 50 miners dominating 50% of the capacity. Such concentration raises the specter
    not only of price inefficiency but also of price “unfairness,” should manipulation—even
    its perception—occur, which is rarely a major issue on established exchanges.
    As one more concern, because Bitcoin trades on platforms without a central governing
    body, an investor is unable to recover a lost password (which is recoverable in
    a regulated exchange). The unfortunate result is lost access forever to investment
    gains.


    # Conclusion


    Bitcoin has captured the attention of investors unlike any asset in recent times,
    compellingly so by registering a decade-long rate of return of over 200%, with
    daily transaction activity well into the billions. This gain, however, has come
    with the price of high volatility, from an average of up to 15 times higher than
    that of the Vanguard 500 Index. As a result, accurate estimates of expected return
    can be especially difficult, which raises the central question in this study:
    how much to invest, if any, in Bitcoin? Interviews from the financial media answer
    this question with an asset allocation range of 2% to 10%. This range, however,
    is largely subjective, lacking in objective evidence, such as from an optimization
    method in which risk is minimized for an expected return. Furthermore, recourse
    from the academic and professional literatures is limited at best.


    This study addresses this question by applying the Black-Litterman model of portfolio
    analysis to the stocks comprised by the S&P 100 with Bitcoin. The analysis runs
    from January 2011 through December 2021, one of the longest to date in an examination
    of the cryptocurrency. A series of three-year optimized portfolios, in which risk
    is minimized for an expected rate of return, reveals only a very small allocation:
    an average of 0.37%, much lower than published views'
