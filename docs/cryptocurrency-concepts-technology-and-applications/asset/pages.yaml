  md: 'spot price of the cryptocurrency being in the money and N(d2) representing
    the probability of being out-of-the-money, are as follows:


    ```

    d1 = \frac{\ln(\frac{S}{X})+ \left(i+\frac{\sigma^2}{2}\right)t}{\sigma\sqrt{t}}
    \text{ and } d2 = d1 - \sigma\sqrt{t}

    ```


    where S is the current spot price of the cryptocurrency, X is the exercise price,
    i is the risk-free rate, t is time to expiration, and σ is the standard deviation.

    The Black-Scholes formula for call option (C) and put option (P) are as follows:


    ```

    C = S N(d1) - Xe^{-it}N(d2) \text{ and } P = Xe^{-it}[1 - N(d2)] - S [1 - N(d1)]

    ```


    For example, let''s assume that the current spot price of Bitcoin (S) is $47,000
    and the future exercise price (X) that expires in 6 months is $50,000. This out-of-the-money
    call option and in-the-money put option have a standard deviation (σ) of 0.40.
    Given the risk-free rate of 5%, what is the fair value for both call and put option
    premiums?


    # Input


    ```

    S = $47,000

    X = $50,000

    t = 0.50 (6 months)

    i = 5.0%

    σ = .40

    ```


    # Formulas


    ```

    d1 = \frac{\ln \left(\frac{47k}{50k}\right) + \left(0.05 + \frac{.4^2}{2}\right)
    0.50}{0.40\sqrt{0.5}} = 0.0110

    ```


    and


    ```

    d2 = 0.01110 - 0.2828 = -0.2718

    N(d1) = N(0.0110) = 0.5044

    N(d2) = N(-0.2718) = 0.3929

    ```


    The call option calculated using the Black-Scholes formula:


    ```

    C = 47k (0.5044) - 50k e^{-(0.05)(0.5)} (0.33929) :

    = 23.71k - 50k (0.9753)(0.3929) = 4.55

    ```'
