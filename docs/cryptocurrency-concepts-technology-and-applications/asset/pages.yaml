    # Put Call Parity


    The investor needs to calculate either the call option or the put option, and
    given that the probability concepts used are the same pricing for the same period,
    the call price should be in parity of the put price. The difference between the
    call premium and the put premium should equal the intrinsic value S – X or X –
    S, with the exception that the X will be adjusted to represent the present value,
    since the exercise price is in the future. The call put parity is as follows:


    C – P = S – PV (X) or C – P = S – Xe^{-it}


    If an investor knows the call price and needs to determine the put price and vice
    versa, the formulas translate to the following:


    C = S – Xe^{-it} + P and P = Xe^{-it} – S + C


    Using this example where the current price of Bitcoin is $47,000 and the future
    exercise price (X) that expires in six months is $50,000, the call option is priced
    at $4,547.88. Given the risk-free rate of 5%, what is the fair value of the put
    option premium? Using the call put parity formula, calculate the put option as
    follows:


    P = X – S + C = 50k – 47k + 4.55k = 6.31k


    # Hedge Ratio (h) and Leverage (Borrowing) Methods: Using BOPM


    There is another method that can be used to determine the option pricing, which
    is like the BOPM discussed above, but instead of using the probability, the values
    can be derived by using the leverage method. This leverage method is important
    when the investor is using the BOPM valuation to determine the fully hedged position
    for option strategies, such as covered calls and protective puts. The method to
    calculate the call price is demonstrated. This six-step method shown in Figure
    11.20 first determines the hedge ratio and then, using a leverage component, calculates
    the fair value of both call and put options.'
