    # Public Choice Issue 3: Special Interest Groups


    The third issue emerges from the tendency of vote-trading and forming party coalitions.
    Special interest groups (SIGs) seek _rents_, or “comparative advantage[s] in the
    market” (Cowden, Prinzinger, and Prinzinger 2009). SIGs will lobby politicians
    to further their personal goals, and when those goals can be aligned with those
    of the politician (namely, reelection) they often succeed in obtaining those rents.


    These groups earn political allies to progress interests that may or may not align
    with the public interest. SIGs receive concentrated benefits, while the costs
    may be dispersed among the general public. For example, domestic car manufacturers
    may lobby Congress to raise tariffs against foreign car manufacturers. While domestic
    manufacturers may benefit by offering relatively cheaper cars compared to their
    foreign competitors and garnering more customers, consumers face higher overall
    prices and fewer options in the car market.


    # The Impact of Innovative Crypto-Linked Technology on Voting and Unanimity Rules


    Popular blockchains, such as the Bitcoin and Ethereum blockchains, allow us to
    observe a form of unanimity in action. When upgrades to the software protocols
    are proposed, unanimity must arise in order for change to occur. Upgrades to the
    software protocols can be viewed as amendments to the constitution of each blockchain
    network, which require consensus in order to implement them on the blockchain.


    For example, decisions surrounding upgrades to the Bitcoin blockchain must follow
    the Bitcoin Improvement Proposal (BIP) process. BIPs can be large or small changes
    to the protocol or to the BIP process itself. They begin with a draft, become
    a proposal, and are eventually accepted. BIPs that significantly change Bitcoin
    take years to go through this process. Since Bitcoin is decentralized, nodes,
    or computers that run the Bitcoin blockchain, ultimately decide whether BIPs are
    implemented through choosing which version of Bitcoin they want to run. BIPs that
    significantly change the Bitcoin network require a high level of consensus.


    Sandor (2022) notes that, “A BIP that proposes implementation with a soft fork
    [small change] requires a ‘clear miner majority,’ meaning that over 90% of nodes
    have to approve to upgrade. These are called ‘Consensus BIPs.’” Ultimately, blockchains,
    such as Bitcoin, de-facto elect to use consensus, a variation of unanimity, as
    a pre-condition for making significant changes to the network.'
