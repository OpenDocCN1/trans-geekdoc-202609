- pgno: 204
  md: 'But there’s one more main difference between Bitcoin and the world of traditional
    finance. Unlike the U.S. dollar and other fiat currencies, Bitcoin has a non-discretionary
    monetary policy. Whereas the Federal Reserve manipulates the money supply by tinkering
    with interest rates, Bitcoin has an automated issuance schedule. Bitcoin has a
    maximum supply of 21 million Bitcoin, which it’ll reach around the year 2140.
    Issuance consists in the above-mentioned mining block rewards. At network launch
    in 2009, the reward was 50 BTC every block. Every four years, this reward halves;
    today it sits at 6.25 BTC. All of this is auditable—anyone may run the Bitcoin
    software to verify that the rules have been followed—and the result is an asset
    with capped supply and highly predictable issuance. As a result, no one can trade
    on insider knowledge about Bitcoin’s monetary policy. And yet in the last year
    alone, three highly ranked officials with the Federal Reserve have resigned due
    to several, let’s say, well-timed trades.


    There is one important point of commonality between Bitcoin’s monetary network
    and the dollar’s. If you wish to send value using dollars (via cash, a Visa transaction,
    a bank transfer, PayPal®, etc.), you must first acquire the native token of that
    network—the dollar. So also with Bitcoin. If you wish to send value using the
    Bitcoin network, you must first acquire some Bitcoin. And once you have some,
    you may send it (via an on-chain transaction, via lightning, or through some other
    method). One enters the Bitcoin network just as one enters the dollar network—by
    earning, purchasing, being gifted, finding, stealing, or otherwise coming into
    possession of its native token.


    In sum, Bitcoin is growing into a self-sufficient monetary stack without trusted
