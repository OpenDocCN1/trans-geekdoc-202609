  md: '# Chapter 11


    # Cryptocurrency Options Strategy, Analysis, and Valuation


    # Christopher Droussiotis


    Seton Hall University


    # Equity and Cryptocurrency Option Markets: Overview


    Options play a significant role in the financial markets. These types of securities’
    values are derived from other securities such as stocks or bonds and, in recent
    years, cryptocurrencies. Options and futures are derivative securities, meaning
    their payoff is dependent on other securities’ price movements. Option contracts
    are traded in many exchange markets such as the Chicago Board Option Exchange
    (CBOE), Chicago Mercantile Exchange (CME), and over-the-counter markets. These
    option contracts include two types of options: *call* options and *put* options.
    Each type can be used in conjunction with the other for-certain strategies. The
    strategies described in this chapter can be used for buying or selling *uncovered*
    or *covered* option contracts. Uncovered or *naked* options are speculative strategies
    and entail buying or selling options without owning the underlying investment,
    stock, or cryptocurrency. Covered strategies involve buying or selling option
    securities in conjunction with owning the underlying stock or cryptocurrency.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'There are two types of option contract structures: American and European. The
    American option contract is structured such that the buyer of the option can exercise
    his or her right to buy or sell the stock or cryptocurrency anytime from the day
    the contract is signed until expiration. The European option contract is structured
    such that the investor can only exercise the option on the expiration day. The
    investor can get out of both options anytime by selling his or her contract at
    the market premium until expiration. Due to their unique structure, American and
    European type options are traded at different premium prices. The valuation methods
    discussed later in the chapter take into consideration each of these structures.


    When it comes to comparing the equity options market to the cryptocurrency options
    market, the differences are everywhere distinct. For starters, cryptocurrency
    options trade 24 hours a day, seven days a week. Another difference is that the
    contract size for cryptocurrencies can vary not only by the exchange, but also
    by the coin. The major cryptocurrency markets include Binance®, Deribit, OKEx®,
    BitMex®, and the traditional exchange of CME®. Most of these markets are not regulated
    in the United States and have varying levels of licensing and regulation from
    governments around the world. The largest exchange in the world, Deribit, offers
    contracts representing 1 BTC, with a minimum contract size of 0.1.


    In addition, most of these cryptocurrency option contracts are structured as European
    types. Deribit uses cash settlement, and contracts expire at 4 AM ET Saturday.
    Deribit only accepts deposits and withdrawals in cryptocurrency. The CME Group
    offers Bitcoin derivative trading with rules similar to their other derivative
    markets; however, CME uses Bitcoin futures as the underlying asset, rather than
    Bitcoin itself.


    Regarding the more than 10,000 cryptocurrencies that are in circulation, exchanges
    usually only offer derivative markets on the major ones, including Bitcoin and
    Ethereum. Since this is very new to the markets, the option trading volume can
    be very low at times. All cryptocurrency contracts use the blockchain technology,
    but decentralized finance (DeFi) allows individuals to enter cryptocurrency option
    contracts that settle by code rather than an exchange. DeFi allows countless possibilities
    for automation, such as algorithmic market making, but suffers from vulnerability
    to scams and hacks because of its reliance on code.


    # Uncovered (Naked) Option Trading Strategy Contracts


    Uncovered, or naked, options are buying or selling options primarily on speculation,
    where the investor does not hold any ownership in the underlying asset—in this
    case stock or cryptocurrency—from which the option premium is derived. The following
    three strategies are buying and selling call options, put options, and straddles.'
