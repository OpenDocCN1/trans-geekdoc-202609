- pgno: 96
  md: 'Stablecoins are cryptocurrencies that are pegged to a hard currency in a ratio
    of 1:1. Stablecoins can address some problems of cryptocurrencies; for example,
    they can mitigate the volatility problem of cryptocurrency (Smales 2021).


    However, they also create inefficiencies and liquidity risks in the financial
    system, which is undesirable to financial system regulators. For this reason,
    many CBDC advocates argue that CBDCs, not stablecoins, will be the operational
    currency in the modern financial system and in the future, simply because CBDC
    design offers benefits that outweigh the benefits of stablecoins (Allen, Gu, and
    Jagtiani 2022).


    Finally, CBDCs also have their own challenges. For instance, interest-bearing
    CBDCs can lead to a run on bank deposits, which poses funding risks to commercial
    banks (Garratt and Zhu 2021). Also, many countries have a weak digital payment
    infrastructure that could lead to financial exclusion for many people if CBDCs
    are deployed using insufficient technological infrastructure. There is also the
    risk of cyber attacks if CBDCs are deployed using insufficient technological infrastructure,
    as well as the risk of unwarranted and inappropriate government surveillance of
    the CBDC transactions of individuals and corporations (Atako 2021).


    Despite these challenges, CBDCs appear to offer more benefits that are very appealing
    and advantageous compared to its risks. For instance, they can make payments cheaper,
    safer, faster, and more reliable. In contrast, cryptocurrencies and stablecoins
    have not yet proven themselves to offer cheaper or faster payments. This is making
    CBDC become more appealing than cryptocurrencies and stablecoins for day-to-day
    transactions.


    # 4.5 Conclusion


    This chapter presented a discussion of central bank digital currency research
    and developments. It defined CBDC and highlighted the differences and similarities
    between CBDC and cryptocurrency. The review of recent CBDC research showed that
    CBDC can offer numerous benefits and also pose some risks. There have been calls
    to exercise caution in developing and adopting CBDC. Central banks are being urged
    to seek international collaboration and coordination in developing a CBDC. Regarding
    CBDC developments, only a few countries have issued a CBDC. Many countries have
    shown interest in researching the possibility of issuing a CBDC, while other countries
    are building specific knowledge and expertise about CBDCs before deciding to do
    so.


    Interest in information about CBDC is also growing among members of the public,
    and such interest may lead to a decline in interest about cryptocurrency.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'The emergence of CBDC presents many implications for cryptocurrency. Firstly,
    it might lead to calls for the regulation of cryptocurrency; it can lead to the
    acceptance of stablecoins, even though the benefits of stablecoins do not outweigh
    the benefits of issuing a CBDC; and finally, the general benefits of CBDC for
    society may outweigh the risks, thereby making it more attractive than cryptocurrency.


    In the future, central banks will seek to retain greater control of the financial
    and monetary systems, even as cash is being used less in society. Central banks’
    desire to innovate by issuing their own digital currency paints a grim future
    for private digital currencies. This is because central banks have the legal authority
    to ban the use of private digital currency in the financial system.


    However, the power of central banks to ban cryptocurrencies can be diminished
    by political and legal bottlenecks, as legal rules may prevent central banks from
    banning private digital currencies that are used for privately negotiated transactions.
    These bottlenecks create an uncertain future for cryptocurrency but leave a more
    certain future for CBDC. Only the future can tell whether CBDC and cryptocurrency
    will coexist or whether CBDCs will bring an end to the era of private digital
    currencies, also known as cryptocurrencies.


