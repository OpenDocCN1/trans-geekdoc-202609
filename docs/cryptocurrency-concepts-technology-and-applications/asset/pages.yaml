  md: 'They displayed an IP address located in South Korea, confirming the initial
    suspicion. The agents subpoenaed the exchanges used to cash out money from WtV
    and were able to identify the suspect as a Korean man living outside Seoul.


    Investigators were confronted with a terrible dilemma: to arrest the suspect and
    take down the website could have been the end of the investigation. But what about
    the users? Most of the material uploaded to WtV was original, meaning that users
    were uploading material that they had filmed themselves. Shutting the website
    down would have left hundreds of child abusers free to continue their criminal
    activity, ruining the lives of hundreds of children.


    What they did instead was brilliant in investigative terms but also horrific in
    personal ones. They traced users’ payments to the website back to the exchanges
    where the Bitcoins were purchased. This entailed watching thousands of videos
    displaying disgusting and atrocious actions towards children, often only one or
    two years old, being abused, looking for clues that could unveil their locations.


    When the first users’ identities were made available to them, the agents made
    other appalling discoveries. One suspect was a U.S. Homeland Security Investigations
    agent in Texas. Another was the assistant principal of a high school in Georgia.
    One suspect appeared to be a former congressional staffer now working at a renowned
    environmental organization. Another was a Border Patrol agent who, as investigators
    disclosed, was uploading videos in which he was abusing his stepdaughter.


    After having identified and arrested these and many other child abusers, the agents
    finally arrested the mastermind in South Korea and seized the website. They found
    more than 250,000 videos, making Welcome to Video the biggest child sexual abuse
    materials case in history.


    This case illustrates some important aspects which investigators should always
    keep in mind. First, many criminal investigations, when the crime itself generates
    proceeds of crime, can be treated like a financial investigation. Often, following
    the money can take you where other means will prove unsuccessful. Cui bono? The
    destination of the money trail can reveal the crime’s perpetrators. Moreover,
    in this case we can see the crucial role of cooperation between jurisdictions.


    # Cooperation Across Borders and with VASPs


    By nature, cases involving cryptocurrency are cross-border investigations, and
    mutual legal assistance (MLA) requests are the key to seeking and obtaining help
    from other countries. Tracing crypto payments to and from VASPs is not enough:
    once we have identified the exchange that was used to buy or sell the currency,
    we need to have clearly in mind the process involved, which actions'
