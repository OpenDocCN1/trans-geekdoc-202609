- pgno: 47
  md: '# Chapter 2


    # Investor Attention in Cryptocurrency Markets


    Lee Smales


    University of Western Australia


    # Introduction


    Human beings face cognitive constraints when performing tasks and making decisions.
    Attention to one task diverts attention from another, and while it may be easy
    to focus attention on a single task, it is more difficult to divide attention
    among several tasks (Kahneman 1973). Choosing an optimal portfolio is a particularly
    complex task faced by investors. In making this decision, they face myriad choices,
    and this is as true in cryptocurrency markets—where more than 10,000 cryptocurrencies
    are currently listed—as it is in traditional markets for stocks and bonds. Theoretically,
    a rational investor will calculate the cost and benefit of every possible combination
    of assets before making an investment decision. In reality, the virtually limitless
    number of potential combinations means that investors adopt mental shortcuts,
    or heuristics, to simplify the decision-making process.


    Focusing on assets that attract investor attention is an example of one such shortcut,
    and one that potentially introduces bias into the investment decision. Because
    the terms are sometimes (incorrectly) used interchangeably in the literature,
    it is'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'important to differentiate the concept of *investor attention* from that of
    *investor sentiment*. Smales (2021) explains that *attention* occurs when investors
    are aware of the existence of information, whereas *sentiment* is the mood-biased
    interpretation of that information and its likely impact on asset prices. Lim
    and Teoh (2010) note that the influence of sentiment on prices can be intensified
    in the presence of greater investor attention.


    Because investors have limited attention, they will pay more attention to information
    that is salient, easy to access, and straightforward to process. Non-salient information
    and difficult-to-process information is ignored. Unless there is important news,
    such as that triggered by large price changes, then investors will not usually
    pay attention to a particular asset. In the case of cryptocurrencies, the substantial
    price volatility, alongside explosive market growth, and the occasional market
    plunge, has garnered a significant amount of attention. Indeed, cryptocurrencies
    have captured the attention of academics (Figure 2.1) and global media (Figure
    2.2), in addition to that of investors.


    Examining the effect of behavioural factors, such as investor attention, on cryptocurrency
    markets is particularly important since, in contrast to traditional assets, they
    often have little intrinsic value, and so prices cannot be explained by fundamentals.
    The aim of this chapter is to provide an overview of research on the topic of
    investor attention, with a particular focus on cryptocurrency markets.


    ![](img/f08f3915c6e1afa13e4417a1426bd7c3_48_0.png)


    **Figure 2.1** Academic Articles Mentioning Bitcoin and Cryptocurrency. A line
    chart showing the number of academic articles that mention Bitcoin or cryptocurrency,
    and the Bitcoin price, in each year from 2010 to 2021. From 2016, the number of
    articles increases quickly, peaking near to 25,000, as the Bitcoin price surges.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/f08f3915c6e1afa13e4417a1426bd7c3_49_0.png)


    Figure 2.2 Media Articles Mentioning Bitcoin and Cryptocurrency. A line chart
    showing the number of media articles that mention Bitcoin or cryptocurrency, and
    the Bitcoin price, in each year from 2010 to 2021. From 2016, the number of articles
    increases quickly, peaking near to 129,000, as the Bitcoin price surges.


    The chapter proceeds as follows: The next section presents several of the most
    commonly used proxies for investor attention, incorporating both indirect and
    direct measures. The following section then briefly introduces the research regarding
    the effects of investor attention in the context of stock markets. This provides
    a framework from which it is possible to understand the mechanism by which investor
    attention may influence cryptocurrencies. The subsequent section then discusses
    the emerging research that specifically relates to investor attention in cryptocurrency
    markets, including various measures of attention and the impact on returns, liquidity,
    volatility, and crash risk. Finally, some concluding remarks are provided.


    # Measures of Investor Attention


    Many different metrics have been used to proxy for investor attention. Initially,
    indirect measures related to market activity and attention-grabbing events were
    used. More recently, technological innovations have permitted the use of direct,
    or revealed, measures of investor sentiment.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Turning to indirect measures first, because investors are more likely to trade
    when paying attention, abnormal trading volume offers one proxy (Gervais et al.
    2001; Barber and Odean 2008; Hou et al. 2009). Similarly, investors are more likely
    to pay attention to stocks that have important news releases, produce extreme
    returns (Barber and Odean 2008), or hit upper price limits (Seasholes and Wu 2007).
    Grullon et al. (2004) offer another indirect proxy of investor attention when
    relating a firm’s overall visibility, measured by advertising spend, to stock
    market liquidity. Specific to cryptocurrencies, Sabah (2020) argues that the number
    of new venues accepting cryptocurrencies as a form of payment is a novel proxy
    of attention and can be linked to return volatility.


    However, market activity can be driven by a multitude of other factors that are
    unrelated to investor attention. It is also the case that investors are not necessarily
    conscious of new information unless they read it. In recent years, the most commonly
    used measures of investor attention in cryptocurrency markets have been those
    that utilize web-based tools such as Google® search volume (e.g., Philippas et
    al. 2019; Liu and Tsyvinski 2021; Liu et al. 2022; Smales 2022a), Twitter® frequency
    (e.g., Shen et al. 2019; Al Guindy 2021; Choi 2021), and Wikipedia® page visits
    (Kristoufek 2013). Since Googling, tweeting, or accessing a Wikipedia page all
    require an action to be taken, these proxies may be thought of as direct measures
    of investor attention. News disseminated via social media could be considered
    more important for cryptocurrency markets owing to the similar audience attributes
    and because traditional media has a perceived lack of coverage of these new markets
    (Kraaijeveld and De Smedt 2020).


    # Google Search Volume


    Da et al. (2011) were among the first to utilize Google search volume as a measure
    of attention for retail investors, and it has been widely used since. This metric
    is based on the frequency of Google searches for particular keywords. It is argued
    that Google search volume provides a direct measure of attention, since investors
    who are Googling a particular keyword are undeniably paying attention to that
    item, or in the case of searching for an asset name, are paying attention to that
    asset. Since Google accounts for approximately 90% of global internet search volume
    (Smales 2022a), searches should be indicative of the search behavior of the broad
    population.


    Google search volume may be obtained from Google Trends (https://trends.google.com/),
    and it is currently available from January 2004. Data on search queries is normalized
    so that numbers are in the range zero to 100 (inclusive) and are based on the
    frequency of searches for that topic in proportion to all searches for all topics
    within a particular geographical region. This means that a lower Google search
    volume score does not always means that there are fewer'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'searches for that topic, just that the proportion of searches for that topic
    relative to all others has fallen. A value of 100 indicates that the search query
    is extremely active for that particular time and location. In some cases, it makes
    sense to focus on specific countries or continents, but it is also possible to
    consider global searches. Google Trends applies filters to remove duplicate searches,
    searches with special characters, and searches made by very few people.


    Two issues should be considered when using Google search volume. First, the data
    frequency provided by Google Trends decreases as the sample period increases.
    Daily data is available for periods up to three months, weekly data for periods
    up to five years, and monthly data for longer intervals. Since Google search volume
    is standardised according to the specific time interval selected, it may be necessary
    to adjust the data when using different intervals. For instance, normalization
    would be required for daily data over a two-year sample period or weekly data
    over a 10-year sample period. Bleher and Dimpl (2019a,b) discuss this process
    in detail and provide an algorithm as one solution.


    Second, the choice of search term or key word is important. Da et al. (2011) note
    possible ambiguity arises since an internet user may search a company name for
    reasons unrelated to investing (e.g., online shopping), and this is more problematic
    if the name has multiple meanings (e.g., “Apple”). It’s also possible that investors
    will access information on a specific firm using different variations of its name.
    Da et al. (2011) overcome this ambiguity by using stock tickers. This is an equally
    problematic issue for cryptocurrencies which have taken ambiguous names such as
    Avalanche, Stellar, and Tether, and where names can have a tendency to be similar
    (Cahill and Liu 2021).


    Figure 2.3 (on next page) illustrates the generally positive relationship between
    the price of Bitcoin (BTC) and Google search volume for the “Bitcoin” and “Cryptocurrency”
    search terms. The implications for this relationship are discussed in more detail
    later in the chapter.


    # Other Direct Measures


    Twitter offers another internet-based measure of investor attention that has been
    used to explain cryptocurrency market activity (e.g., Philippas et al. 2019; Shen
    et al. 2019; Al Guindy 2021; Choi 2021; Liu and Tsyvinski 2021). Al Guindy (2021)
    suggests that Twitter is a good measure because, in addition to demonstrating
    attention is paid when tweets are liked, it reveals the extent to which investors
    spread information when tweets are retweeted. Shen et al. (2019) argue that, since
    their tweets involve commentary and market predictions, Twitter is more likely
    to be used by well-informed investors with cryptocurrency knowledge. Twitter is
    also used by (some) investment professionals and news organisations to advertise
    their other services.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/f08f3915c6e1afa13e4417a1426bd7c3_52_0.png)


    Figure 2.3 Google Search Volume and Bitcoin Prices. A line chart showing the Bitcoin
    price and Google search volume for Bitcoin and cryptocurrency monthly from 2011
    to 2021. Search volume peaks are in late 2017 and early 2021, which coincides
    with Bitcoin price highs.


    Since institutional investors can access professional news services, such as Bloomberg®
    and Reuters®, it is likely that Google search volume is most relevant as a proxy
    for attention by retail investors. Ben-Rephael et al. (2017) offers an alternate
    measure that focuses on institutional investors. Using news searching and reading
    activity on Bloomberg terminals, they construct a measure of abnormal institutional
    investor attention. They report that institutional attention leads retail attention
    and responds more promptly to news events in stock markets.


    # Investor Attention in Stock Markets


    Investor attention has been shown to have a substantial and widespread influence
    on stock markets, with two competing theories attempting to explain the market
    response: choice asymmetry and information discovery.


    Choice asymmetry (Odean 1999; Barber and Odean 2008) contends that investors face
    the problem of choosing among a large investment universe when buying stocks and
    so only buy attention-grabbing stocks—stocks that have recently experienced extreme
    returns or abnormally high trading volume. In contrast, when looking to sell stocks,
    investors typically only sell stocks they own'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'and so face a less significant problem. This theory is not necessarily applicable
    to institutional investors because they have additional resources to cope with
    the issue of limited attention, and an ability to short-sell means they may also
    face a significant search problem when selling stocks.


    Information discovery offers an alternate explanation. Andrei and Hasler (2014)
    developed a theoretical model that explains the effect of investor attention on
    stock return volatility and risk premium. Their model suggests that when investors
    are paying attention to news, this new information is quickly incorporated into
    prices, resulting in higher volatility and a larger risk premium. In this case,
    greater attention helps to improve market efficiency in making returns less predictable
    (Vozlyublennaia 2014). This theory is also consistent with markets responding
    to news only when investors pay attention to it (Huberman and Regev 2001).


    Relatedly, the market response may also depend on the quantity of competing information
    (or stimuli). For instance, Peress and Schmidt (2020) find that days on which
    retail investors are distracted by unrelated news events (e.g., the O. J. Simpson
    trial) are associated with lower volatility, while the earnings drift is stronger
    for announcements on days with many other announcements (Hirshleifer et al. 2009)
    and when institutional investors are not paying attention (Ben-Rephael et al.
    2017).


    The empirical results are not definitive. On the one hand, several articles identify
    a positive relationship between investor attention and individual stock returns.
    Barber and Odean (2008) note that buying of attention-grabbing stocks stimulates
    higher trading volume, leading to higher price pressure and magnifying the response
    to news events, which is consistent with Gervais et al. (2001) and Jiang et al.
    (2021). Da et al. (2011) show that higher investor attention is related to positive
    stock returns and first-day IPO returns.


    In contrast, there is evidence that global stock index returns (Chen 2017; Smales
    2021) and U.S. stock sector returns (Smales 2020a) are negatively related to investor
    attention. Smales (2020a; 2021) suggests this is because retail investors are
    searching for information to resolve uncertainty about their household concerns
    rather than specifically for stock purchases, and so is consistent with information
    discovery reasoning.


    Prior to focusing on cryptocurrency, it is worthwhile discussing two additional
    concepts that provide a link between investor attention in stock and cryptocurrency
    markets. First, Peng and Xiong (2006) note that, owing to attention capacity constraints,
    investors tend to focus on market- and sector-wide news, rather than firm-specific
    information. One potential implication for the cryptocurrency market is that investors
    focus their attention on market-wide news or use a proxy for the overall market,
    such as Bitcoin. This may then explain why Bitcoin is so important for explaining
    returns across the cryptocurrency market (Smales 2020b).'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Second, it is possible that investors make a conscious attempt to focus on
    particular information. Peng (2005) generates a model that shows investors allocate
    greater attention toward more volatile assets since they generate greater potential
    reward. Given the much higher level of return volatility exhibited by cryptocurrencies,
    this may offer one explanation as to why so much attention is focused on cryptocurrency
    markets.


    # Investor Attention in Cryptocurrency Markets


    As mentioned in the prior sections, there are several characteristics of cryptocurrency
    markets that make them particularly prone to behavioral factors, and specifically
    limited investor attention. First, cryptocurrencies offer little intrinsic value,
    and so returns are more likely to be determined by behavioral influences.


    Second, until cryptocurrencies started to attain legitimacy among institutional
    investors, likely alongside the introduction of Bitcoin futures in 2017, the speculative
    nature of the market primarily appealed to retail investors. Lucey at al. (2022)
    suggest these investors may interpret information in a unique way compared to
    institutional investors. Since Google search volume is often attributed as a measure
    of retail investor attention, it may be particularly relevant to cryptocurrency
    markets.


    Third, the large number of cryptocurrencies, many of which disappear after a short
    time only to be replaced by new offerings, creates a predicament when having to
    choose among them. Finally, investors (and media) pay attention to the cryptocurrency
    market because it experiences high levels of volatility and so regularly generates
    a significant amount of news.


    Just as with stock markets, several different proxies for investor attention are
    considered for cryptocurrency markets. Although Wikipedia page visits and accepting
    venues are also found within the literature, the most used proxies are Google
    search volume and Twitter tweets and re-tweets.


    Before considering the effects of investor attention on cryptocurrency markets,
    it is worthwhile contemplating the causes of investor attention in these novel
    instruments. Urquhart (2016) proposes that at least some of the attention on Bitcoin
    is a result of its innovative features, simplicity, and transparency. Consistent
    with the stock market literature, there is evidence that investor attention is
    related to positive past returns (Lin 2021) and realized volatility (Urquhart
    2018) and tends to be concentrated on those cryptocurrencies that generate the
    most news (Subramaniam and Chakraborty 2020).


    There appears to be mixed evidence as to whether the relationship is uni- or bi-directional.
    Urquhart (2018) shows a uni-directional causal relationship from'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'returns to attention, whereas Dastgir et al. (2019) and Smales (2022a) note
    bi-direction causality, with the former noting this is concentrated in the tails
    of the distribution.


    Earlier, it was noted that cryptocurrency names are often similar. Launched in
    2008. Bitcoin was the original cryptocurrency and still accounts for around 40%
    of market capitalisation. Cahill and Liu (2021) note a preponderance of “copycat”
    cryptocurrencies that have a name similar to Bitcoin (e.g., Wrapped Bitcoin, Bitcoin
    Cash, Bitcoin SV), and a search today would reveal at least 100 offerings. These
    copycats have high initial returns but low survival rates. Cahill and Liu (2021)
    suggest that investors pay attention to these cryptocurrencies because the names
    are less complex (more familiar) and so information is easier to process.


    Since cryptocurrency is a novel technology, valuation is more uncertain than in
    mature markets, and so the name may be a signalling tool for investors. This is
    not dissimilar to the “dotcom” effect documented by Cooper et al. (2001), which
    found a substantial stock price response around the announcement of corporate
    name changes. They argue that investors have a fear of missing out in new technologies
    and so buy shares in firms that may be only loosely connected the technology.
    In a case of “history rhyming,” Cahill et al. (2020) note positive abnormal returns
    for firms acknowledging interest in blockchain. As a pertinent side note, after
    observing frequent bubbles and crashes in cryptocurrencies, Harris (2003) suggests
    that bubbles often start when buyers become overly optimistic about the growth
    of new markets and the potential of new technologies.


    We now consider the influence of investor attention on specific aspects of cryptocurrency
    markets. Owing to the early launch and market dominance, many of the early studies
    focused on Bitcoin, but more recently it has become common to evaluate a wider
    range of cryptocurrencies.


    # Returns


    Much research is devoted to understanding the relationship between investor attention
    and cryptocurrency returns. This is not surprising given the potential opportunity
    for substantial returns should a profitable trading strategy be determined. Unfortunately,
    the empirical evidence is mixed so far, with estimated results dependent on the
    sample period chosen, methodology used, and set of cryptocurrencies considered.


    Focusing on Bitcoin, Urquhart (2018), Bleher and Dimpfl (2019a), and Smales (2022a)
    find that returns are not caused by investor attention, whereas Kristoufek (2013)
    and Philipas et al. (2019) find that investor attention has a strong causal relationship
    with prices, particularly during periods of higher uncertainty.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Expanding the consideration set to a broader range of cryptocurrencies seems
    to provide greater confirmation of a statistically significant relationship between
    investor attention and returns. Subramaniam and Chakraborty (2020) find that high-quantile
    spikes in investor attention led to increased returns; Li et al. (2021) note interdependence
    between investor attention and returns using wavelet-based quantile Granger causality;
    and Lin (2021) finds bi-directional causality when using Granger Causality tests,
    but not when using vector autoregression models. Smales (2022a) considers a set
    of 20 leading cryptocurrencies and finds a positive relationship between investor
    attention and returns, with the effect heightened during the COVID-19 pandemic.
    Using proxies generated from Google search volume and Twitter, Liu and Tsyvinski
    (2021) find that high investor attention predicts high future returns up to six
    weeks ahead. In a similar vein, investor attention is shown to generate momentum
    in the cryptocurrency market (Sockin and Xiong 2020). Liu et al. (2022) find that
    momentum occurs at times of high investor attention and is greater for the large
    and well-known coins that receive more attention. In general, this positive attention–return
    relationship is consistent with the “choice-asymmetry” stock market literature
    and the purchase of attention-grabbing assets (Barber and Odean 2008).


    On a related note, Ibikunle et al. (2020) investigate the influence of investor
    attention on the price discovery process for Bitcoin. They find that, whereas
    informed trading is not related to attention, more uninformed trading activity
    tends to occur when attention levels are high. As a result, price efficiency tends
    to drop during periods of heightened attention.


    # Volatility and Crash Risk


    Identifying the relationship between investor attention and cryptocurrency returns
    may help to formulate profitable trading strategies; however, it is also important
    to understand the risk associated with such investments. Understanding the effect
    of investor attention on volatility (and related crash risk) can aid investors
    in grasping inherent risk and is also useful for regulators (and other policy
    makers) in identifying circumstances of heightened risk.


    Aside from Urquhart (2018), the general empirical finding is that investor attention
    is positively related to cryptocurrency volatility. Bleher and Dimpfl (2019a)
    suggest that retail investors find information via Google searches that leads
    to trading activity and an associated increase in Bitcoin return volatility. Similarly,
    Shen et al. (2019) discover that the frequency of tweets drives Bitcoin trading
    volume and realized volatility.


    Al Guindy (2021) and Smales (2022a) show that investor attention is positively
    related to volatility for the 20 largest cryptocurrencies, with greater distractions
    associated with lower volatility (Al Guindy 2021). Likewise, Sabah (2020)'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'finds that a one-standard deviation increase in new crypto-accepting business
    venues increases volatility by nearly 20%.


    Smales (2022b) investigates whether investor attention has a connection with cryptocurrency
    crash risk, finding that there is a significant relationship but that it is concentrated
    in the tails of the crash risk distribution. The attention–crash risk relationship
    is positive when crash risk is low and negative when crash risk is high. The positive
    attention–volatility relationship is consistent with the theoretical stock market
    model of Andrei and Hasler (2014). That is, an increased level of investor attention
    results in a higher volatility because more attention allows information to be
    reflected into prices more quickly.


    # Liquidity


    Liquidity is another important component of market activity. Without sufficient
    liquidity, it is not possible to buy and sell cryptocurrencies easily or quickly,
    and implementation of any trading strategies would be prohibitively expensive.


    Smales (2022a) finds that higher levels of investor attention can reduce liquidity,
    largely because of the greater volatility associated with this attention. Conversely,
    Choi (2021) finds an increase in Twitter activity leads to a short-term improvement
    in liquidity, while Yao et al. (2021) find that investor attention reduces idiosyncratic
    risk for cryptocurrencies by increasing liquidity. This effect is more noticeable
    for newer and smaller cryptocurrencies, which are absent from the sample used
    by Smales (2022a).


    # Concluding Remarks


    Since its 2009 inception, the cryptocurrency market has grown tremendously, and
    with a market capitalisation approaching $1.2 trillion (having peaked near $3
    trillion), it is a non-trivial market. Similar to the novel technologies that
    have come before (e.g., railroads, telephones, and the internet), cryptocurrencies
    offer great potential but are difficult to understand. Their unique characteristics
    might reshape the entire financial ecosystem, democratising the system in the
    process, but there is great uncertainty as to the precise mechanism by which this
    will occur.


    Since cryptocurrencies are essentially a piece of code that does not typically
    generate cashflows, it is argued that they lack intrinsic value, and so any value
    that is ascribed to them is likely to be driven by behavioral factors. The substantial
    price gains and extreme return volatility exhibited by cryptocurrencies has grabbed
    the attention of a range of investors, suggesting that investor attention is a
    particularly important behavioral factor to consider.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'Initially, cryptocurrency investors were primarily individuals—retail investors
    who are perhaps less aware of behavioral biases but more affected by them. More
    recently, institutional investors have started to take a larger role in the cryptocurrency
    market, and so it is possible that the influence of behavioral factors will evolve
    over time. Therefore, it is important to gain a better understanding of investor
    behavior in cryptocurrency markets. This will help investors to determine the
    best way in which to allocate capital and aid policymakers as they consider how
    to avoid an accumulation of systemic risk as the market continues to grow.


    It seems that the measures and theories concerning investor attention in stock
    markets can also help to explain the influence of investor attention in cryptocurrency
    markets. A range of indirect (extreme returns, abnormal trading volume) and direct
    (Google search volume, Twitter frequency, Wikipedia page visits) proxies are utilised.
    Recent empirical studies for a wide range of cryptocurrencies have found a positive
    attention–return relationship that is consistent with the purchase of attention-grabbing
    stocks (Barber and Odean 2008) and a positive attention–volatility relationship
    consistent with an information discovery model (Andrei and Hasler 2014).


