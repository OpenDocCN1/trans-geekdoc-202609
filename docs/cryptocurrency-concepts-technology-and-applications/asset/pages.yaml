- pgno: 171
  md: 'a software that would gradually unpack the computerized systems held hostage.
    Due to the decentralized and largely (but not entirely) anonymous nature of blockchain-based
    systems, it was thought that cryptocurrency hacks and thefts would not be traceable.
    However, considerable work by law enforcement institutions, particularly the FBI,
    demonstrated in the Continental case that the perpetrators of hacks and thefts
    can, with sufficient effort, be located.


    These examples indicate that hacks and thefts remain a significant consideration
    in the legal aspect of cryptocurrency use. Individuals, exchanges, companies,
    and other stakeholders remain vulnerable, not least because of the lucrative nature
    of the space and versatility of attacks that can be executed.


    # Frauds and Scams


    Cryptocurrency is premised on the notion of trustlessness (Chohan 2019a), which
    implies that parties can engage in cryptocurrency transactions without needing
    to know or trust one another. However, the notion of trustlessness has been exaggerated
    over time because trust is required in many elements of the cryptocurrency economy
    (Chohan 2019b; Zhang et al. 2021; Karimov and Wojcik 2021; Sanz-Bas et al. 2021),
    particularly when it comes to initial coin offerings (ICOs; see Karimov and Wojcik
    2021; Chohan 2019b).


    ICOs involve the emission of new tokens (cryptocurrency coins) on the internet.
    This is a space riddled with scams and fraudulent activities, and today social
    media, as an example, refuses to put up advertisements of ICOs. The proliferation
    of unregulated digital instruments has come with a groundswell of misinformation,
    misleading claims, and scam-artistry, which has caused tens of billions of dollars
    of damage to unwitting investors (Zhang et al. 2021; Sanz-Bas et al. 2021).


    The most significant cryptocurrency scam to date was Bitconnect, whose false marketing
    (“40% returns guaranteed”) and dissolution as a Ponzi scheme led to a loss of
    $3.5 billion dollars (Chohan 2022b). Other significant Ponzi scheme approaches
    which caused considerable damage to investors include Pincoin (Vietnam, $870m
    losses to 32,000 people); ACChain (China, $80m); and Plexcoin (USA, $20m). Although
    ICOs are not as common today as in the past decade, there are new blockchain-based
    technologies which are gaining in popularity, such as non-fungible tokens (NFTs,
    see Chohan 2021b) and decentralized finance (DeFi, see Schuëffel 2021; Chohan
    2021c). These much-hyped emergent fields raise serious concerns of scam-artistry
    and fraud and thus require careful regulatory and legal attention.


    It should also be noted that the scope of scams and frauds is widely spread around
    the world and is not the singular purview of any specific jurisdiction. This allows
    for lesson-drawing for countries from the experience of one another and to'
