- pgno: 70
  md: 'The model, which relies on one factor only, is simple, stating that the only
    variable driving expected return is the beta, with the risk premium measuring
    the incremental gain per increase in beta.


    There is precedent in the literature for the Black-Litterman application, as seen,
    for example, in Wu and Pandy (2014); Bessler, Opfer, and Wolff (2014); and Loviscek
    (2021). It has a two-step Bayesian foundation. The first one is the estimation
    of the CAPM to determine the expected returns. This begins with the estimation
    of the beta for each security from a simple time series model of volatility, or
    risk, as follows:


    $(R_{i,t} - R_f) = \beta_i (R_{m,t} - R_f) + e_{i,t} \quad (5)$


    where all terms are defined as before and \(e_i\) is an error term. In this equation,
    beta is the coefficient, whereas it is the variable in the CAPM. Again, the beta
    is the index of systematic risk, and as such, the model is one of risk, where
    the variance of \(e_i\) measures idiosyncratic, or unpredictable, risk—that is,
    risk that is unique to the security (e.g., unexpected death of a CEO, loss of
    a key patent, underperformance relative to expectations, failed product, etc.).
    This risk is diversifiable; however, its counterpart, systematic risk, is not
    diversifiable because it is linked to market conditions. Although multi-factor
    modeling is often a preferred choice, Frazzini and Pedersen (2014), Cederberg
    and O''Doherty (2015), and Kolari, Liu, and Huang (2021) support the CAPM when
    applied within a portfolio framework.


    The estimated returns align with equilibrium expected returns that replace the
    expected returns based exclusively on historical data. After the estimation of
    the CAPM returns, a “reverse optimization” determines the market-capitalized weights
    (Idzorek 2011), which lead to the implied returns consistent with portfolio optimization.
    To explain, after the estimation of the CAPM expected returns, along with the
    risks and covariances, the model maximizes a reward-to-variability ratio attributed
    to Sharpe (1994), leading to the respective weights for each security.


    To get to the final step—the CAPM equilibrium returns—an investor has two choices:
    either use CAPM returns in the optimization process or supplement the CAPM returns
    with additional information in the optimization, such as private information,
    mean reversion, momentum, or mispricing estimates. This study uses the first choice,
    effectively assuming that markets are informationally efficient.


    These returns are considered to be the “prior” estimates within the Bayesian framework
    because they do not include the additional information that occurs in the second
    choice (i.e., the posterior estimates), in which an investor assumes that markets
    are inefficient by “tilting” the expected return on the portfolio to capture the
    additional information.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Either way, the optimization process includes an estimate of a risk-aversion
    coefficient ($\lambda$). It can be estimated by the CAPM risk premium, $[E (R_m)
    - R_f]$, relative to the variance of the portfolio. It represents a return–risk
    tradeoff that is central to portfolio analysis. During the reverse optimization,
    it scales the estimates of the variance–covariance matrix. Combined with the capitalized
    market weights, the result is the implied vector of equilibrium returns, as follows:


    ```

    \(\Pi = \lambda\Sigma w_m\) (6)

    ```


    where,


    +   - \(\Pi\) is the implied excess equilibrium return vector ($N \times 1$ column
    vector);

    +   - \(\lambda\) is the risk-aversion coefficient, which incorporates the expected
    return-risk tradeoff;

    +   - \(\Sigma\) is the variance–covariance matrix of excess returns ($N \times
    N$ matrix); and,

    +   - \(w_m\) is the market capitalization weights ($N \times 1$ column vector)
    of the assets.*


    The optimization procedure used here is standard, as opposed to those that rely
    on “shrinkage” of the data or other means of data arrangement (Jorion 1991). Incorporated
    into the optimization, the estimates from equation (4) embody an exponentially
    weighted moving average (EWMA) coefficient of 0.97, as reportedly used by major
    financial institutions (Hoadley 2017). It weighs more recent observations more
    heavily than older observations, helping to capture any possible momentum effects.
    It is defined as follows:


    ```

    $EWMA_{i,t} = \gamma R_{i,t} + (1-\gamma)EWMA_{i,t-1}$ (7)

    ```


    where,


    +   - $EWMA_{i,0} = $ arithmetic average of the historical rates of return;

    +   - $R_{i,t} = $ rate of return on security $i$ at time $t$;

    +   - $n = $ number of observations, including $EWMA_{i,0}$; and

    +   - $\gamma = 0 < \gamma \le 1$, which determines the length of the memory,
    in this case, 0.97.


    * Formally, $N$ assets make up the market, with $M_p$ representing the market
    portfolio and \(\Sigma\) representing the variance–covariance matrix. The equilibrium
    expected returns on the securities, in the form of a vector, have a mean of $\mu$,
    with $\lambda$ reflecting risk tolerance. The equilibrium CAPM expected returns
    are \(\Pi = \lambda \Sigma P_M\). The optimal portfolio $M_p^* = \Sigma^{-1} \mu
    / \lambda\).'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# ## Data


    The stocks come from the Standard & Poor’s 100, a subset of the S&P 500. It records
    the prices of large-capitalization companies, including the largest, such as Apple,
    Amazon, ExxonMobil, Merck®, and Walmart®. With the focus on individual investors,
    the prices originate from Yahoo® Finance and are monthly, running from December
    2010 through December 2021. Compared to the current literature, the period represents
    one of the longest to date, increasing confidence compared to studies based on
    as few as three years. In addition, it incorporates the full recovery from the
    global financial crisis of 2008–2009, the financial market downturn from the global
    pandemic of 2020, and the recovery from it.


    To estimate equation (4), the Vanguard 500 Index represents the market rate of
    return, or Rm. The three-month U.S. Treasury bill rate approximates the risk-free
    rate of return, or Rf, which come from the Federal Reserve Bank of St. Louis.
    Three years of monthly data were used to construct each of the Black-Litterman
    portfolios. For example, the first portfolio consists of rates of return across
    the companies from January 2011 through December 2013. The next portfolio is based
    on the rates of return from January 2012 through December 2014, and so up through
    January 2019 through December 2021.


    Although most firms listed in 2010 are also listed in 2011, such as Apple, Amazon,
    and Merck, this is not the case for all firms, such as Meta Platforms (i.e., previously
    Facebook®), which was not listed until 2015, and Tesla®, which was not listed
    until 2021.


    In other instances, firms listed at the beginning were later removed, such as
    Alcoa®, Allstate®, and Baker Hughes Holdings. As a result, the data had to be
    adjusted accordingly from one year to the next. Moreover, there was the occurrence
    of mergers, such as AbbVie®’s purchase of Allergan®, which was a member of the
    S&P 100 from 2015 to the first quarter of 2019, or the buy-out of Celgene®, another
    one-time member of the S&P 100, by Bristol Myers Squibb® in 2019. In these cases,
    the risk-free rate of return replaced the months remaining in the year of purchase.
    For example, in the case of Celgene, its final stock price was in November 2019.
    As a result, its return for December was the monthly U.S. Treasury bill rate for
    December 2019.


