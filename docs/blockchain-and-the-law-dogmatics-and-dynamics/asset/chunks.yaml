    因此，`DLT MTFs` 是仅允许交易 `DLT financial instruments` 的 `MTFs`（《DLT 试点制度》第 2 条第 6 点）。另一方面，`DLT
    SSs` 是对 `DLT financial instruments` 进行交易结算的结算系统，无论这些结算系统是否已根据第 98/26/EC 号指令获得指定和通知（因此不受限于该指令中“系统”的定义），且它们允许对
    `DLT financial instruments` 进行初始记录或提供与 `DLT financial instruments` 相关的托管服务——《DLT
    试点制度》第 2 条第 7 点。最后，`DLT TSSs` 是结合了 `DLT MTF` 和 `DLT SS` 提供服务的 `DLT MTFs` 或 `DLT
    SSs`——《DLT Pilot Regime》第 10 点。


    由于这是一个实验性制度，对于准入金融工具的类型和数量预见了以下限制——《DLT 试点制度》第 3 条第 1 款：


    * 发行人市值或临时市值低于 5 亿欧元的股票；

    * 发行规模低于 10 亿欧元的债券、其他形式的证券债务或货币市场工具（衍生品或复杂产品除外）；

    * 集合投资计划管理资产市场价值低于 5 亿欧元的份额。


    准入 `DLT market infrastructure` 交易或在其上记录的所有 `DLT financial instruments` 的总市值不得超过
    60 亿欧元；如果准入新的 `DLT financial instrument` 交易或初始记录导致总市值达到该数值，则该 `DLT market infrastructure`
    将不再允许该 `DLT financial instrument` 交易或注册——《DLT 试点制度》第 3 条第 2 款。然而，上述所有阈值均为从属性，考虑到国家主管机构可能会设定较低的阈值——《DLT
    试点制度》第 3 条第 6 段。


    假设在 `DLT market infrastructure` 上准入交易或注册的所有 `DLT financial instruments` 总市值已达到
    90 亿欧元。在这种情况下，`DLT market infrastructure` 的运营商将启动过渡策略并通知国家主管机构——《DLT 试点制度》第 3
    条第 3 款。


    关于授予 `DLT market infrastructures` 运营商的豁免，`DLT MTFs` 可以豁免于 2014/65/EU 号指令规定的中介义务。传统的
    `MTFs` 仅允许投资公司、信贷机构和其他具有足够交易能力和专业知识并维持充分资源和组织安排的人员作为成员或参与者。因此，传统的二级市场交易如下方的图 6.1
    所示：![Fig. 6.1 ¶ Traditional Market Operation. ¶ Source The authors](img/540017_1_En_6_Fig1_HTML.png)


    图 6.1 ¶ 传统市场运营。 ¶ 作者所有


    在上述图中，我们包含了执行上述中介业务的经纪人，这些实体负责接收并向 `MTF` 传输投资者的订单。对于执行其管理的实体和管理结算系统的 `CSD` 来说，这是必要的。


    然而，加密资产交易平台为零售投资者提供了直接访问，这很大程度上是因为分布式账本技术为数字媒介中的价值流通提供了更高的安全性。因如此，《DLT 试点制度》允许主管机构根据
    `DLT MTF` 运营商的请求，临时豁免该中介义务，以向零售投资者提供直接访问并允许他们在自己的账户上进行交易。(¹⁶³) ![Fig. 6.2 ¶ DLT
    MTF operation. ¶ Source The authors](img/540017_1_En_6_Fig2_HTML.png)


    图 6.2 ¶ DLT MTF 运营。 ¶ 作者所有


    由于投资者可以直接访问 `DLT MTF`，因此不需要经纪人。结果是我们在市场交易中仅发现两个服务提供商（`DLT MTF` 运营商和 `CSD`）。对于零售投资者直接访问
    `DLT MT` 定义了某些条件，这些条件需要由国家主管机构进行评估。此外，这些机构可能要求 `DLT MTF` 运营商采取额外的投资者保护措施——《DLT
    试点制度》第 4 条第 2 款。


    根据《DLT 试点制度》第 5 条，旨在运营 `DLT SS` 的 `CSD` 可在提供适当理由的情况下向国家主管机构申请遵守 (EU) No 909/2014
    号条例的豁免（包括）：


    * 第 2(1) 条第 (4)、(9) 和 (28) 小项——无形形式、转让指令和证券账户的定义；

    * 第 3、37 和 38 条——账面形式的记录、发行的完整性和证券保护；

    * 第 6 和 7 条——防止和处理结算失误的措施；

    * 第 19 条——活动和服务的扩展与外包；

    * 第 33、34 和 35 条——参与要求、透明度和通报程序；

    * 第 39 和 40 条——结算终结和现金结算；

    * 第 50、51 和 53 条——CSD 之间的接入。


    在上述规则中，我们重点介绍了两个特定豁免。首先是豁免通过信贷机构或投资公司进行中介的义务，这允许零售投资者直接访问由 `DLT SS` 运营的结算系统。第二个豁免涉及现金结算实体（使用银行货币）在《DLT
    试点制度》下开发解决方案，以便接入商业货币或使用“电子货币令牌”。(¹⁶⁴)


    对于 `DLT TSSs` 运营商，它们可以申请 `DLT MTFs` 和 `DLT SSs` 享有的豁免，前提是符合豁免附带条件以及主管当局要求的任何补偿措施——《DLT
    试点制度》第 6 条。尽管如此，我们展示了获得所有豁免的 `DLT TSS` 运营模式，如下图 6.3 所示：![Fig. 6.3 ¶ DLT TSS operation.
    ¶ Source The authors](img/540017_1_En_6_Fig3_HTML.png)


    图 6.3 ¶ DLT TSS 运营。 ¶ 作者所有


    由于自然人可以直接参与市场和结算系统，因此不需要经纪人。此外，《DLT 试点制度》允许同一实体管理交易和结算系统。这种豁免组合使得市场上仅由一个实体提供服务，这非常接近当前加密资产市场参与者的意图。


    《DLT 试点制度》还为 `DLT market infrastructures` 运营商提供系列额外要求，即：(i) 资金、担保或 `DLT financial
    instrument` 损失时的责任；(ii) 破产时的保护措施；(iii) 特定报告义务；(iv) 运营风险管理——《DLT 试点制度》第 7 条。


    这些额外要求对于避免与分布式账本技术或 `DLT market infrastructure` 运营方式相关的风险是必要的。例如，`DLT market infrastructure`
    运营商需要告知其计划如何开展活动，以及分布式账本技术的使用与传统 `MTF` 或运营结算系统的 `CSD` 提供服务的方式有何不同。

