    \ permissioned. The Bitcoin blockchain, for example, is a public, permissionless,\
    \ blockchain system, while a blockchain system that controls the supply chain\
    \ of a private company, say, may be a private and permissioned one that restricts\
    \ the nodes to the company’s members. In other words, a blockchain will have different\
    \ characteristics, depending on its purpose.\n\nIn a TJ system, different combinations\
    \ of networks can exist. A private and permissioned blockchain can be used for\
    \ digital identification matters, with sensitive information secure in a database\
    \ controlled by one entity. A public and permissionless blockchain, like Bitcoin’s,\
    \ can also exist for a funding and donations platform to support the TJ pillars.\
    \ There are several possibilities, which can be tailored to requirements and the\
    \ local context.\n\nUsing all the tools mentioned above, blockchain has evolved\
    \ and is now at the leading edge of a new technological revolution, creating a\
    \ trustless but trustworthy environment for transactions without the necessity\
    \ for a central controller party.\n\nAlthough initially used for financial transactions,\
    \ the technology can record any type of information, and can be used for various\
    \ purposes. It is this feature that makes blockchain a general-purpose technology.\n\
    \n## 3.3 Transitional Justice and the Effectiveness of Using Blockchain\n\nTransitional\
    \ justice is broadly discussed in the international community. It has also been\
    \ applied in several situations around the globe, which are the subject of extensive\
    \ literature and case studies.\n\nThe United Nations Secretary-General first published\
    \ a report in 2004 addressed to the UN Security Council regarding aspects of the\
    \ rule of law and TJ in post-conflict situations.^([^(48)](#fn48))\n\nThe UN has\
    \ refined its understanding of TJ mechanisms, or pillars, via the Guidance Note\
    \ of the Secretary-General^([^(49)](#fn49))\n\nAlthough there are several definitions\
    \ of TJ, most authors follow a similar understanding to the one contained in UN\
    \ reports. In this regard, transitional justice is \n\n> the full range of processes\
    \ and mechanisms associated with a society’s attempt to come to terms with a legacy\
    \ of large-scale past abuses, in order to ensure accountability, serve justice\
    \ and achieve reconciliation.^([^(50)](#fn50))\n\n> \n\n> Even though there are\
    \ different understandings and concepts regarding TJ, its pillars and approaches,\
    \ a broad consensus of scholars understand that there are four preliminary pillars\
    \ of TJ, namely prosecution, truth commissions, institutional reform, and reparations.^([^(51)](#fn51))\n\
    \n> \n\n> One constant critique in TJ approaches, however, is that they regularly\
    \ ensure restorative and retributive justice, with prosecutions and truth commissions,\
    \ in a Western approach. Such a method undermines the TJ processes, removing the\
    \ protagonism of the local society to the international/Western community, resulting\
    \ in local ownership being lost. TJ approaches also fail to address the root causes\
    \ of the conflict, such as socioeconomic structures and social inequalities.^([^(52)](#fn52))\n\
    \n> \n\n> The intention now is to elucidate what the pillars of TJ are, and then\
    \ propose new systems using blockchain technology in each TJ mechanism.\n\n> \n\
    \n> ### 3.3.1 Truth Commissions\n\n> \n\n> A Truth Commissions (TC) or Truth and\
    \ Reconciliation Commissions (TRC) deals with the pursuit of truth in a non-judicial\
    \ way, which is one of the principal elements when dealing with past atrocities.\
    \ According to “Truth Seeking,” a publication by the International Center for\
    \ Transitional Justice (ICTJ),^([^(53)](#fn53))\n\n> \n\n> TCs are usually constituted\
    \ by an executive decree or by law and take into consideration the specific characteristics\
    \ of each country’s situation.^([^(54)](#fn54))\n\n> \n\n> Such an essential and\
    \ decisive organism of TJ has specific characteristics and considerations that\
    \ must be observed to be as effective as possible.^([^(55)](#fn55))\n\n> \n\n\
    > Truth Commissions can also be Truth and Reconciliation Commissions (TRC), which\
    \ also pursue reconciliation. Some specialists understand TRC as an organ that\
    \ does not merely seek the truth of past abuses but understands the role of reconciliation\
    \ in such contexts. Reconciliation works adds another layer of challenge, which\
    \ is why only some truth commissions have added the notion of reconciliation to\
    \ their name and approach, the most well-known example being the South African\
    \ TRC.^([^(56)](#fn56))\n\n> \n\n> Notwithstanding the above, it is also important\
    \ to mention unofficial truth projects (UTPs). Such projects resemble TCs in that\
    \ they promote the historical reconstruction of past abuses in a specific place\
    \ and time. However, the main difference between official and unofficial truth\
    \ commissions is that TCs have the official sanction of the State, whereas UTPs\
    \ do not.^([^(57)](#fn57))\n\n> \n\n> However, against a background of limited\
    \ human and financial resources, significant outreach policies and structures\
    \ for public awareness and participation, information gathering may be a challenge\
    \ in some cases.^([^(58)](#fn58))\n\n> \n\n> Truth Commissions may suffer from\
    \ limited resources due primarily to the State’s pressure and influence. In several\
    \ cases, States are unwilling to engage in uncovering the truth, and for that\
    \ reason, TCs may suffer from fewer contributions from States.^([^(59)](#fn59))\n\
    \n> \n\n> Due to their unofficial status UTPs depend on private investment from\
    \ institutions or civil society to survive and, therefore, have an even greater\
    \ lack of resources than their officially backed counterparts, the TCs.^([^(60)](#fn60))\n\
    \n> "
