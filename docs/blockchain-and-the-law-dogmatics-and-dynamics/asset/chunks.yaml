    onto the blockchain, the oracle to be used and ensuring that the smart contract
    retains a sufficient value of cryptocurrency to give effect to any order entered
    against the parties. The concept of delayed execution for appeals and the possible
    stay of execution in prescribed circumstances will also need to be catered for.
    Such an agreement will be detailed and technical in nature and will likely form
    the subject matter of much negotiation between the parties. The agreement itself
    may also become the subject of dispute between the parties. These elements of
    complexity render the adoption of such an agreement relatively unattractive. It
    may be however that in due course a standard form of agreement can be adopted
    should blockchain execution become more widely practised.


    ### 5.5 Conclusion


    It is clear from what is set out in this chapter that conventional means of execution
    in South Africa holds little appeal to a litigant with an order in its favor.
    The process is, as explained, time consuming and expensive.


    An alternative to the *status quo* could be on-blockchain execution using smart
    contracts. The benefits to the parties are evident—speed of execution and certainty
    of payment is a boon to any litigant.


    This is particularly so where both parties stand to gain, such as where both a
    claim and counterclaim is concerned, or either party stands to profit from security
    for costs put up in litigation.


    While the proposal is novel, certainly in a South African context, as cryptocurrencies
    and blockchain technology become more widely used and gain legitimacy in commerce,
    so could the use of smart contract execution, to the benefit of the litigious
    process as a whole.

