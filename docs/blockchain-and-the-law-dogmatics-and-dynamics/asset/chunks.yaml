    Therefore, `DLT MTFs` are `MTFs` that only admit to trading `DLT financial instruments`
    (Article 2, point 6 of the DLT Pilot Regime). On the other hand, `DLT SSs` are
    settlement systems that settle transactions on `DLT financial instruments`, irrespective
    of the fact that these settlement systems have been designated and notified under
    Directive 98/26/EC (so as not to be limited to the definition of “system” of this
    Directive), and that allow either the initial recording of financial instruments
    DLT or the provision of safekeeping services in relation to DLT financial instruments—Article
    2, point 7, of the DLT Pilot Regime. Finally, `DLT TSSs` are `DLT MTFs` or `DLT
    SSs` that combine the services provided by a `DLT MTF` and a `DLT SS`—Article
    2, point 10, of the DLT Pilot Regime.


    As this is an experimental regime, the following limitations are foreseen as to
    the type and volume of admitted financial instruments—Article 3(1) of the DLT
    Pilot Regime:


    * Shares whose issuer has a market capitalization or provisional market capitalization
    of less than € 500 million;

    * Bonds, other forms of securitized debt or money market instruments (except derivatives
    or complex products) with an issue size below € 1 billion;

    * Units in collective investment undertakings whose market value of assets under
    management is less than € 500 million.


    The aggregate market value of all the `DLT financial instruments` admitted to
    trading or recorded in a `DLT market infrastructure` may not exceed € 6 billion,
    and if the admission to trading or the initial recording of a new `DLT financial
    instrument` results in an aggregate market value reaching that value the `DLT
    market infrastructure` does not admit that `DLT financial instrument` to trading
    or registration—Article 3(2) of the DLT Pilot Regime. However, all the above-mentioned
    thresholds are subsidiary, considering that the national competent authorities
    may establish lower thresholds—Article 3, paragraph 6, of the DLT Pilot Regime.


    Suppose the aggregate market value of all `DLT financial instruments` admitted
    to trading on a `DLT market infrastructure` or registered on a `DLT market infrastructure`
    has reached € 9 billion. In such case, the operator of the `DLT market infrastructure`
    activates the transition strategy and notifies the national competent authority—Article
    3(3) of the DLT Pilot Regime.


    Regarding exemptions granted to operators of `DLT market infrastructures`, `DLT
    MTFs` can be exempted from the intermediation obligation under Directive 2014/65/EU.
    Traditional `MTFs` are only allowed to admit as members or participants investment
    firms, credit institutions and other persons with a sufficient level of trading
    capacity and expertise and who maintain adequate resources and organizational
    arrangements. Therefore, a traditional secondary market transaction can be presented
    as can be seen in Fig. [6.1](#540017_1_En_6_Chapter.xhtml#Fig1) below: ![Fig.
    6.1 ¶ Traditional Market Operation. ¶ Source The authors](images/540017_1_En_6_Chapter/540017_1_En_6_Fig1_HTML.png)


    Fig. 6.1 ¶ Traditional Market Operation. ¶ Source The authors


    In the above diagram, we have included the brokers that perform the intermediation
    referred to above, being the entities responsible for the reception and transmission
    of the investors’ orders to the `MTF`. It is necessary for an entity that performs
    its management and a `CSD` that manages the settlement system.


    However, crypto-assets trading platforms provide direct access to retail investors,
    not least because of the greater security that distributed ledger technologies
    provide for the circulation of value in a digital medium. For this reason, the
    DLT Pilot Regime allows the competent authority to grant, upon request by an operator
    of a `DLT MTF`, a temporary exemption from that intermediation obligation to provide
    direct access to retail investors and allow them to trade on their own accounts.([^(163)](#fn163))
    ![Fig. 6.2 ¶ DLT MTF operation. ¶ Source The authors](images/540017_1_En_6_Chapter/540017_1_En_6_Fig2_HTML.png)


    Fig. 6.2 ¶ DLT MTF operation. ¶ Source The authors


    Brokers are not required due to the direct access of investors to the `DLT MTF`.
    As a result, we only find two service providers (the operator of the `DLT MTF`
    and the `CSD`) in a market transaction. Certain conditions are defined for retail
    investors to have direct access to a `DLT MT`, which need to be assessed by the
    national competent authority. In addition, those authorities may require additional
    investor protection measures from the operators of `DLT MTF`—Article 4(2) of the
    DLT Pilot Regime.


    Pursuant to Article 5 of the DLT Pilot Regime, a `CSD` aiming to operate a `DLT
    SS` may apply to national competent authorities, subject to appropriate reasoning,
    for the following exemptions from Regulation (EU) No 909/2014 (inter alia):


    * Article 2(1), subparagraphs (4), (9) and (28)—definitions of dematerialized
    form, transfer order and securities account;

    * Articles 3, 37 and 38—recording in book-entry form, the integrity of the issue
    and protection of securities;

    * Articles 6 and 7—measures to prevent and address settlement fails;

    * Article 19–extension and outsourcing of activities and services;

    * Articles 33, 34 and 35—requirements for participation, transparency, and communication
    procedures;

    * Articles 39 and 40—settlement finality and cash settlement;

    * Articles 50, 51 and 53—access between CSDs.


    Within the referred rules, we highlight two specific exemptions. We start with
    the exemption to the obligation of intermediation through a credit institution
    or an investment firm, which allows retail investors direct access to settlement
    systems operated by a `DLT SS`. The second exemption relates to cash settlement
    entities (in central bank money) to develop innovative solutions under the DLT
    Pilot Regime, facilitating access to commercial bank money or using «electronic
    money tokens».([^(164)](#fn164))


    With regard to operators of `DLT TSSs`, they can apply for the same exemptions
    available to both operators of `DLT MTFs` and `DLT SSs`, provided they comply
    with the conditions attached to the exemptions and any compensatory measures required
    by the competent national authorities—Article 6 of the DLT Pilot Regime. That
    said, we present an operation on a `DLT TSS` where all the exemptions have been
    granted, as can be seen in Fig. [6.3](#540017_1_En_6_Chapter.xhtml#Fig3) below:
    ![Fig. 6.3 ¶ DLT TSS operation. ¶ Source The authors](images/540017_1_En_6_Chapter/540017_1_En_6_Fig3_HTML.png)


    Fig. 6.3 ¶ DLT TSS operation. ¶ Source The authors


    Since natural persons can participate directly in the market and settlement system,
    brokers are not required. In addition, the DLT Pilot Regime allows the same entity
    to manage the trading and settlement systems. The combination of exemptions thus
    allows for only one entity to provide services in the market, coming close to
    what is intended by the current players from the market on crypto-assets.


    The DLT Pilot Regime also provides for a set of additional requirements for operators
    of DLT market infrastructures, namely: (i) liability in the event of loss of funds,
    guarantees or a DLT financial instrument; (ii) protection measures in the event
    of insolvency; (iii) specific reporting duties; and (iv) operational risk management—Article
    7 of the DLT Pilot Regime.


    The additional requirements are necessary to avoid risks related to distributed
    ledger technology or how the DLT market infrastructure would operate. An operator
    of a DLT market infrastructure is, for example, required to inform members, participants,
    issuers, and clients how it intends to carry out its activities and how the use
    of distributed ledger technology differs from the way services are typically provided
    by a traditional MTF or a CSD operating a securities settlement system.

