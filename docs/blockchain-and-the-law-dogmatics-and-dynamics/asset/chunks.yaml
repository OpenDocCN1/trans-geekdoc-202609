    The second is that a South African court or arbitral tribunal will not issue an
    order payable in cryptocurrency. Any judgment or award entered will ordinarily
    be in South African Rands.


    The third is that any judgment handed down by a court or arbitral tribunal, will
    be submitted to the parties in written form, either by email or through the South
    African High Court’s case management system.


    On this point, Ortolani takes the view that: “The mechanism of oracles can be
    readily applied to arbitration; a smart contract can defer to the decision of
    a third party adjudicator, such as an arbitral tribunal, and determine the final
    recipient of certain disputed assets on the basis of a ruling made by that oracle.
    In other words, the external information retrieved by the smart contract could
    be an arbitral award, and software script could be used to enforce the outcome
    of the procedure.”


    Whilst this is no doubt possible in theory, delivering on the promise of seamless
    interaction between a software script and an arbitral award to execute a smart
    contract is unlikely to be standard in South Africa for the foreseeable future,
    requiring the intermediation of a human actor serving as oracle.


    The fourth is that the value of cryptocurrencies are notoriously volatile.


    The fifth, which emerges from the process described above and the notional difficulties
    which might arise, is that the parties will have to conclude a written agreement
    regulating the disparate aspects involved in smart contract execution. The agreement
    will have to regulate issues such as the creation of the smart contract code,
    the blockchain platform which will be used, the manner of conversion of South
    African Rands to cryptocurrency, the way the outcome of the suit will be submitted
    onto the blockchain, the oracle to be used and ensuring that the smart contract
    retains a sufficient value of cryptocurrency to give effect to any order entered
    against the parties. The concept of delayed execution for appeals and the possible
    stay of execution in prescribed circumstances will also need to be catered for.
    Such an agreement will be detailed and technical in nature and will likely form
    the subject matter of much negotiation between the parties. The agreement itself
    may also become the subject of dispute between the parties. These elements of
    complexity render the adoption of such an agreement relatively unattractive. It
    may be however that in due course a standard form of agreement can be adopted
    should blockchain execution become more widely practised.


