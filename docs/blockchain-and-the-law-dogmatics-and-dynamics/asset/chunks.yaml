    \ apparatus is fascinating from a technical side. Public administration is *the*\
    \ centralized social institution per excellence, even if it can be divided into\
    \ departments or different administrations (e.g., regional, municipal, federal.).\
    \ In the end, it is the public sector (the State, in its multiple formations)\
    \ that controls the protocol, even if having a blockchain can bring gains in efficiency\
    \ and transparency.\n\n## 1.6 Conclusions\n\nFour years after the hype, blockchain\
    \ continues to deliver at its slow pace. The modern world—particularly the modern\
    \ communication and media—expects immediate and impactful results to be pleased.\
    \ Once these are over, attention moves to the next big thing. That is the cycle\
    \ of modern life if we want to be realistic.\n\nAlthough there is already an extensive\
    \ and profound body of research, the fact is that we are still at the beginning.\
    \ One thing is to cover a project, a proof-of-concept, a promise, or something\
    \ potential, and another is to cover an existing, active, and established reality.\
    \ Blockchain adoption is growing, as is blockchain development, which brings new\
    \ faces and features that, on the one hand, help simplify comprehension and impact\
    \ of the initial challenges (governance decentralization, for a start). However,\
    \ on the other hand, it also brings new forms of complexity (e.g., yearn finance,\
    \ DeFi, and staking operations). There is also more regulation and awareness,\
    \ as well as some mainstream adoption of ideas, such as token issuing, NFTs, and\
    \ central bank digital currencies.\n\nThere is still much to research, much to\
