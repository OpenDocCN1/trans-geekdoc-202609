    ## 前言


    区块链和分布式账本技术（DLTs）是我们时代主要的科技发展之一。DLTs 是计算机协议，旨在通过不同的参与者以分布式方式存储和管理数据。根据中本聪（Satoshi
    Nakamoto）的话，区块链是受比特币（首种基于无信任的支付系统）启发的某种 DLT 的名称。自那以后，改进和扩展加密货币容量的新技术层出不穷，改变了区块链的面貌。


    目前，区块链领域存在海量（且不断增长）的项目。虽然随着 DeFi（去中心化金融）协议和产品的新兴领域正争夺建立去中心化市场，但加密交易所已经受到监管。区块链和加密货币被视为逃避执法部门的危险产品并伪装成简单主张的日子已远去。


    该技术的支持者认为，区块链具有从根本上改变商业关系的潜力（无论是企业对企业还是企业对消费者），将商业信任从市场代理和中介转移到运行在全球范围内计算机分布式协议的基于算法信任的计算机程序。区块链技术带来了我们思考和交换价值方式的范式转变。其创新和颠覆潜力已在各行业得到广泛认可。然而，任何新技术都会带来必须应对的法律和监管挑战。


    法律与区块链之间存在着复杂的关系：该技术的隐私、去中心化和自动化核心原则与关于稳定性和责任的经典法律标准冲突，尽管过去几年已经颁布了新法律。


    从 2018 年至 2020 年，我们在诺瓦法学院举办了三期关于区块链技术法律影响的短期研究生课程。这些课程是葡萄牙大学开设的首此类课程，各种葡萄牙及国际的学者、企业家、律师和监管者都参与了其中。本书浓缩了这三门课程教学内容的“精华”，涉及法律标准和规则应用于区块链的复杂问题。


    本书延续了课程的国际化结构，包含八章，致力于区块链或基于分布式账本的创新与法律之间的通用及特定交叉。


    本书由 Martinho Lucas Pires 撰写的章节《区块链与法律：设定底线》（第 1 章）开始。


