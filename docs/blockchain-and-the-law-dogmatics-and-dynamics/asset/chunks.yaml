    Therefore, the objective of the blockchain network to assist in reconciliation
    relies on two aspects. The first is indirect, where blockchain acts in other TJ
    pillars, improving their effectiveness, but with the condition that these pillars
    have a built-in reconciliatory approach.


    The second aspect is the creation of a comprehensive system, based on an umbrella
    perspective, driven by a blockchain network, where the information of different
    sectors of TJ can be exchanged between the nodes. Building a completely interchangeable
    TJ data share network for specific markets will foster reconciliation because
    it will reunite and distribute information from various TJ fronts, allowing the
    fast, secure and decentralized exchange of data between the mechanisms.


    So, in a state-of-the-art situation, a broad network powered by a public permissioned
    blockchain system would allow every node (represented by the TJ pillars) to communicate
    and transact information between themselves. Only nodes with permission would
    be able to input transactions into the network, but all information would be publicly
    available.


    ## 3.4 Conclusion


    This chapter has analyzed how blockchain technology could be related to transitional
    justice processes, verifying each of the five TJ pillars in a state-of-the-art
    blockchain situation.


    Blockchain technology creates new paradigms for the transaction of information
    in a decentralized, instantaneous, and secure way. It has created new types of
    money and assets in borderless environments. It has also allowed a more thorough
    audit of goods in the production chain, ensuring better standards within the entire
    ecosystem. At the same time, several governments have been focusing on its potential
    to modernize the public sector and make it more efficient.


    The characteristics of blockchain technology: decentralized control, a shared
    view of the truth, cross-border collaboration, auditing of data, and the exchange
    of information/value through digital tokens, combined with its possible public
    or private, and permissionless or permissioned, network designs could be of great
    assistance in more sensitive fields, such as transitional justice, especially
    when the government is viewed as not trustworthy.


    Yet, transitional justice is a field of international human rights and humanitarian
    law that deals with the past. It works in very complex conditions which, in many
    cases, lack proper funding for the proper project implementation. Also, there
    are issues of trust and belonging among nationals and victims. The path towards
    achieving a reconciliation is a winding one and demands a lot of energy, planning,
    political will, and resources. As a volatile environment, TJ cannot afford mistakes
    in its undertakings, since it could lead to the return, or worsening, of hostilities.


    However, as mentioned before, there is not one single approach to all TJ cases.
    Blockchain devices, which can adequately adapt to several situations and serve
    multiple purposes, are suitable for dealing with different demands in a faster,
    secure, and transparent way.


    Although new, blockchain technology has a lot to prove. The potential of blockchain
    technology to increase effectiveness indifferent areas, and also underpin other
    prominent technologies, such as the Internet of Things (IoT), or Artificial Intelligence
    (AI), makes it a very appealing option for several situations. Having a system
    that does not solely rely on the government itself, but also integrates the international
    community and the civic population, in a shared view of the truth, is an excellent
    idea.


    In a state-of-the-art blockchain concept, as analyzed in this chapter, the technology
    demonstrates that it would be extremely beneficial to enhancing efficiency in
    a comprehensive and holistic TJ approach, making reconciliation a more manageable
    process. Inclusion of different society sectors and the international community,
    with the use of an integrated umbrella blockchain system that encompasses all
    TJ pillars and other essential features can be a reality with blockchain technology.
    Faster and secure data transactions between permissioned nodes, in a publicly
    available system, can enhance transparency of processes and improve their outreach.
    Each TJ pillar can also have its own blockchain system incorporating its specific
    needs and characteristics. Since each piece of information can be tokenized, the
    tokens can be freely transacted between the nodes and networks.


    Although blockchain is a technology that enhances the transaction and storage
    of auditable data, its use to empower local populations and victims—providing
    access to and participation in TJ processes and according people their economic,
    social, and cultural rights—can change the socio-political and economic relationships
    present in post-conflict societies.


    It is important, however, to consider the challenges that implementing blockchain
    systems face. There are technological hurdles to overcome in regions where there
    is a lack of proper internet connectivity or equipment, as well as the existing
    legal limitations in some countries. It is also worth mentioning that due to is
    novelty and complexity, blockchain technology is still extremely expensive.


    In TJ situations, awareness of these issues is amplified due to their complex
    environments, and it is well known that errors could cost the lives of innocent
    people. Issues of mistrust between international actors and States, lack of public
    participation, lack of political will, underfunding, and other problems add more
    complexity to processes. Therefore, one must take into thorough consideration
    how positive can blockchain be and whether other technologies would be more suitable
    in any given situation. Questions of viability and value are crucial in determining
    whether blockchain technology will be the best choice in concrete situations.


    This chapter does not intend to impose blockchain as a full-package TJ solution,
    but rather proposes this ground-breaking technology as one of several tools that
    TJ could use to implement, to best effect, mechanisms for reconciliatory processes
    that result in lasting peace. As such, despite the challenges blockchain faces,
    it is a technology worthy of serious consideration.


