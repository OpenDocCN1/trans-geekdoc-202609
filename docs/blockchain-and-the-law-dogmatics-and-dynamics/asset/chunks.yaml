- fmt: "\nAdditionally, commissions and fees charged by or through the intermediation\
    \ of crypto-assets service providers are also taxed at a rate of 4%, when the\
    \ provider or client is domiciled in Portugal, being the tax charged to the client\
    \ (item 30 of Table General of the Stamp Tax and articles 3(3)(w) and 4(9) of\
    \ the Stamp Tax Code). It is determined that, when the service provider is located\
    \ outside Portugal, the person who has to settle the tax is the intermediary in\
    \ Portugal or, if there is no intermediary, a representative appointed by the\
    \ service provider (article 2(1)(u) of Stamp Tax Code).\n\nFinally, in order to\
    \ enable not only compliance but also enforcement, article 124-A PIT Code also\
    \ includes `reporting obligations`, by establishing that custody service providers\
    \ and trading platform managers have to report annually all operations with crypto-assets\
    \ performed with their intervention to the Tax Authorities. Also on reporting\
    \ obligations (this will not amend the taxation of crypto-assets), a relevant\
    \ international new standard results from an `Organization for Economic Cooperation\
    \ and Development (OECD)` publication known as the `Crypto-Asset Reporting Framework\
    \ (CARF)``.([^(126)](#fn126))`\n\nLastly, on 8 December 2022, the European Commission\
    \ adopted the already planned `proposal for a Council Directive amending Directive\
    \ 2011/16/EU (DAC8 proposal)`^([^(127)](#fn127))\n\n© T.M.C. Asser Press and the\
