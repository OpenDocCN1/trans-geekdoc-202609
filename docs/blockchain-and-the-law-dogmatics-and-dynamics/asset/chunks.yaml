    相反，私有链不需要保证无许可或去中心化。不保证这些特性的优势在于，私有链部署允许对谁可以参与网络以及信息如何在网络中流动进行完全控制。因此，私有链部署通常受到那些在数据管理实践中需要更高确定性的大型企业以及政府的青睐。此外，由于私有链不是无许可或去中心化的，关于它们实际上是否属于区块链还存在疑问。特别是，私有链的反对者通常认为，少数实体可能保留运行区块链网络的代码控制权，并可能反转交易或删除在公共区块链网络中被认为是合法的交易记录。


    那么，区块链实际上解决了什么问题？区块链解决的首要问题之一是信任问题。传统的数字系统（如在线支付平台）需要用户信任第三方促进交易。如果第三方遭到黑客攻击或决定采取不实行为，这种信任就很容易被打破。


    虽然区块链是强大且创新的技术，但它们也创造了几个必须解决的问题。区块链的主要问题之一是其复杂性。区块链系统通常难以理解和实施，需要特殊的知识和技能。这种复杂性可能会产生准入门槛，限制能够有效利用该技术的组织和个人数量。此外，区块链可能是资源密集型的，运行它需要大量的计算能力和能量消耗。这可能会引发环境担忧并限制区块链系统的可扩展性。最后，区块链交易的匿名性可能给执法部门和监管机构带来挑战，因为很难识别并追究那些在区块链网络上从事非法活动人员的责任。总体来说，虽然区块链提供了许多优势，但仔细考虑并解决与该技术相关的挑战和缺点至关重要。


    ## 2.4 结合区块链与选举


    政府可能出于多种原因对将区块链技术与选举感兴趣。使用区块链进行选举的主要优点之一是其提供的预期安全性和透明度。通过创建一个看似不可篡改的交易记录，区块链技术提供了防止选民欺诈和篡改的承诺，确保选举结果准确可靠。此外，区块链可能通过简化选民注册、选票发放和计票来帮助提高选举过程的效率。这可能会减少错误和延迟的可能性，提供更快、更可靠的选举结果。区块链技术可能非常适合选民注册等工作，因为一个人是否注册投票与其是否已经投票是不同的问题。


    政府对结合区块链与选举感兴趣的另一个原因是增加选民参与度。通过使用基于移动设备的区块链系统，政府可以让公民投票变得更容易更方便，特别是对于那些面临传统投票方式障碍的人，例如身体残障、地理隔离或行动不便等。这有助于提高投票率，并确保所有公民在政治过程中都有发言权。总体来说，通过利用区块链技术的优势，政府可能创建更安全、高效且具有包容性的选举系统，增强民主治理的合法性和有效性。


    虽然区块链技术具有提高选举过程安全性和效率的潜力，但也有几个原因导致政府在将区块链与选举结合时犹豫。主要的担忧之一是实施区块链系统的复杂性和成本。区块链技术需要专业的知识和技能才能有效实施，这会为政府和选举官员带来准入门槛。此外，实施区块链系统的成本可能是高得无法接受的，特别是对于发展中国家或资源有限的国家。这使得确保所有公民都能获得安全可靠的选举系统变得具有性。


    结合区块链与选举的另一个担忧是技术问题和漏洞的风险。虽然区块链技术通常是安全的，但它无法受到黑客攻击或其他形式的网络攻击的影响。这可能会产生外部干预选举过程的可能性，从而损害选举结果的合法性并削弱公众对民主过程的信任。此外，区块链交易的匿名性可能使得难以确保只有合格的选民参与选举，这会给选民识别和防欺诈带来挑战。总体来说，尽管区块链技术有很多潜在优势，但政府在选举过程中实施区块链之前，必须仔细考虑潜在的缺点和挑战。


    全球范围内，选举一段时间以来一直面临选举基础设施遭受网络攻击的威胁。2017 年，国际民主与选举援助协会（International IDEA）举办了一场关于网络安全与选举的圆讨会。活动期间讨论了三点。首先，了解选举过程面临网络攻击的潜在风险和漏洞，并制定减轻这些风险的策略至关重要。其次，政府机构、选举官员和其他利益相关者之间需要加强协作与协调，以实施有效的网络安全措施。最后，通过确保选举结果安全透明，并让公民获得有关选举过程和网络安全风险的准确信息，维护公众对选举过程的信任信心至关重要。圆讨会强调了在选举过程中解决网络安全问题的重要性，以确保民主选举的完整性和合法性。


    正是在这种环境下，各国政府开始寻求将区块链技术应用于选举。美国已经有来自不同政治光谱的各种实体呼吁为选举实施区块链解决方案。


    例如，2018 年在塞拉利昂，一家名为 Agora 的瑞士组织使用了其专有的私有链系统帮助审计塞拉利昂总统选举的结果。


    在选举中使用区块链最成功的尝试，莫过于 Voatz 公司到为止所做的。Voatz 是一家总部位于美国的私人公司，专注于构建利用区块链的移动选举平台。


    但并非所有专家都同意基于区块链投票是一个好主意。2020 年 11 月发表的一篇论文认为，基于区块链投票可能会导致选举发生变化，而人们甚至没有意识到这些变化的发生。


    ## 2.5 结论


