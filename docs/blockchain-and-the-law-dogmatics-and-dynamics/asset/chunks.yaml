- fmt: "\nElections are the bedrock of modern democracy, and our modern world is a\
    \ technological one with problems unimaginable to the Ancient Greeks and Romans.\
    \ Given the stakes involved and the ever-growing threat of cyber-attacks on election\
    \ systems around the world it is understandable that governments wish to employ\
    \ seemingly more secure methods of voting. That said, not every technological\
    \ tool is necessarily a good fit for every problem.\n\nBlockchain technology allows\
    \ for the creation of append-only ledgers of transaction data that are tamper-evident,\
    \ tamper-resistant, public and auditable, and enable new forms of human cooperation.\
    \ Voting is a kind of double-spend problem where you do not wish to allow people\
    \ to vote more than once. The siren song of the blockchain fixing elections is\
    \ forgivable, but governments must take care. Quick fixes rarely are quick or\
    \ fixes. The blockchain may be a good use of creating digital cash, but that does\
    \ not mean it can obviate all the problems facing modern elections today. Additional\
    \ research into how to integrate blockchain systems into existing election systems\
    \ is needed before those election systems are thrown out and replaced with a ledger\
    \ system not designed to solve election problems.\n\n© T.M.C. Asser Press and\
    \ the author(s) 2024 F. Pereira Coutinho et al. (eds.)Blockchain and the LawInformation\
    \ Technology and Law Series37[https://doi.org/10.1007/978-94-6265-579-9_3](https://doi.org/10.1007/978-94-6265-579-9_3)\
    \ Begin Abstract \n\n# 3. What Are the Limits of Blockchain? Considerations on\
    \ the Use of Blockchain in Transitional Justice Processes\n\nRenato Gomide M.\
    \ de Almeida (1) Eça de Queiroz Street, 279, Ap 4 Vila Mariana, São Paulo, SP,\
    \ 04011-031, Brazil Renato Gomide M. de Almeida Email: `renato.g.m.almeida@gmail.com`\n\
    \n## 3.1 Introduction\n## 3.2 What Is Blockchain?\n## 3.3 Transitional Justice\
    \ and the Effectiveness of Using Blockchain\n### 3.3.1 Truth Commissions\n###\
    \ 3.3.2 Prosecution\n### 3.3.3 Restoring Democratic Institutions\n### 3.3.4 Reparations\n\
    ### 3.3.5 Reconciliation\n## 3.4 Conclusion\n## References\n\n## Abstract\nBlockchain\
    \ technology has the capacity to change how people live, communicate with each\
    \ other, acquire products, store information, and exchange data. Such a technology—one\
    \ that is able to perform in different segments and which is being called a general-purpose\
    \ technology, just like the internet,—can be useful in transitional justice processes.\
    \ This chapter intends to analyze the use of blockchain technology as a new component\
    \ within transitional justice processes (see Sect. `3.3.2`), understand how blockchain\
    \ would behave as part of a transitional justice scenario (see generally Sect.\
    \ `3.3`), by considering a state-of-the-art situation (see Sect. `3.3.5`). More\
    \ specifically, the chapter analyzes how blockchain could be incorporated into\
    \ important aspects of transitional justice: criminal prosecutions, truth commissions,\
    \ reparations, the restoration of democratic institutions, and reconciliation.\n\
