    \ [7](#540017_1_En_7_Chapter.xhtml) look at the novel central bank digital currency,\
    \ or CBDC, and its implications on anonymity. And, in Chap. [8](#540017_1_En_8_Chapter.xhtml),\
    \ Ágata Ferreira concludes the book by discussing the specific relationship between\
    \ smart contracts and the law, looking at the advantages of smart contracts and\
    \ addressing the scholarly legal debate surrounding their implementation and use.\n\
    \nAll in all, this book provides a comprehensive overview of the intersection\
    \ between blockchain and the law. It delves into the legal implications of blockchain\
    \ technology and how it is being treated under existing legal frameworks. It also\
    \ explores the potential of blockchain to reshape the legal landscape and how\
    \ the law will continue to evolve in response to the growing use of blockchain.\
    \ The book offers valuable insights into the complex relationship between blockchain\
    \ and the law. It provides a well-rounded understanding of the legal implications\
    \ of blockchain and how it can be leveraged for the benefit of society.\n\nWe\
    \ would like to acknowledge and thank all the authors for their outstanding contribution\
    \ to this volume and especially thank Frank Bakker and Kiki van Gurp from T.M.C.\
    \ Asser Press for accepting this volume for publication and all the patience with\
    \ the editing process. We wish all our readers an enjoyable and rewarding reading.\n\
