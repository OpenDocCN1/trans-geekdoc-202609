    In response to that proposition, other scholars find it necessary to ‘remind the
    basic principles of contract law’ and to acknowledge smart contracts’ ‘limited
    potential impact on contract or the legal system in general’.^([^(244)](#fn244))


    Smart contracts also highlight the tensions and have the potential to shift the
    boundaries between public and private domain. They enable novel forms of economic
    exchange between individuals, which may challenge the established transacting
    forms and test the established divide between private and public domain. Karlstrøm
    states that this unfettered freedom to transact when subjected to blockchain code
    may have in fact an opposite, disempowering effect of commercial relations becoming
    ‘rigid, irreversible and non-negotiable’. Technology like blockchain may render
    social relations ‘increasingly rigid, at the cost of a loss of dynamism and consequently
    of a sense of freedom and responsibility’.^([^(245)](#fn245))


    # 8.5 Selected Smart Contracts Legislation


    ## 8.5.1 The United States


    Despite an increasing interest in and recognition of smart contracts, only a handful
    of countries have formulated a regulatory response to smart contracts. In the
    US, smart contracts legislative initiatives by US states are relatively narrow
    and govern only selected issues, mostly limited to defining smart contracts and
    recognition of their electronic form and signatures. Until April 2019, various
    US states have considered 133 blockchain technology related laws. However, only
    7 related to smart contracts and only a few of those have been passed successfully.^([^(246)](#fn246))


    Arizona was the pioneer of smart contracts legislation in the United States.^([^(247)](#fn247))


    Few states stand out as more progressive and address smart contracts in a more
    comprehensive way. For example, Nevada enacted a bill (Bill 398)^([^(248)](#fn248))


    Finally, BTA prohibits local governments from imposing any limits or requirements
    on the use of blockchain or smart contracts, including taxes, fees, or certification
    requirements. The `BTA` provides a high degree of legal clarity to the use of
    smart contracts and clarifies their legal status and effect. Finally, Wyoming
    stands out with 13 blockchain laws enacted to provide a comprehensive legal framework
    designed to foster innovation and promote the blockchain industry. It has many
    novel features and defines a smart contract as an automated transaction or any
    substantially similar analogue, which is comprised of code, script or a programming
    language that executes the terms of an agreement, and which may include taking
    custody of and transferring an asset, or issuing executable instructions for these
    actions, based on the occurrence or non-occurrence of specified conditions.^([^(249)](#fn249))


    Smart contract legislative initiatives in US states have been criticized for their
    hasty passage and unforeseeable effects.^([^(250)](#fn250))


    Introduction of multiple definitions of smart contracts and expressly giving them
    the legal status can also contribute to uncertainties around established legal
    doctrines and application of existing federal regulations, such as the Uniform
    Electronic Transaction Act, which is often considered as already sufficient for
    electronic signatures and smart contracts.^([^(251)](#fn251))


    Two US federal regulatory and supervisory agencies, the US Commodity Futures Trading
    Commission (`CFTC`) and the US Securities and Exchange Commission, also address
    smart contracts through their investigations and clarifying guidance. The `CFTC`
    even issued a primer on smart contracts addressing the benefits, risks, and legal
    issues of smart contracts.^([^(252)](#fn252))


    ## 8.5.2 Europe


    The first country in the world to pass regulations on smart contracts is Belarus.
    A presidential decree from December 2017 defines a smart contract as a program
    code intended to function in the transaction block ledger (`blockchain`), or another
    distributed information system, for the purposes of automated performance and
    execution of transactions or performance of other legally significant actions.
    The decree granted the right to conduct performance and execution of transactions
    by means of smart contracts in the special zone called the Park of High Technologies.
    A Russian legislator introduced digital assets into the Russian civil law system
    by amending the Russian Civil Code in 2019 to include the concepts of digital
    right and smart contracts. Smart contracts are recognized as means of a contract
    performance, not as a special type of contract, hence they can be now legally
    applied to any type of transaction in Russia.^([^(253)](#fn253))


    Italy is the first European country to regulate distributed ledger technology
    and smart contracts in a general manner without reference to any specific industry
    or application.^([^(254)](#fn254))


    At the European Union level, an uncertainty concerning the legality of smart contracts
    and their enforceability in cross-border situations has also been recognized and
    the draft report of the Committee of Legal Affairs emphasized that the upcoming
    Digital Services Act provides an opportunity to assess the requirements for smart
    contracts to be considered legally valid. The Committee called on the European
    Commission to assess the legality and enforcement of smart contracts in cross-border
    situations, and to make proposals for the appropriate legal framework. The report
    strongly recommends that smart contracts include mechanisms that can halt their
    execution to protect weaker parties and ensure that the rights of creditors in
    insolvency and restructuring are respected.^([^(255)](#fn255))


    ## 8.5.3 United Kingdom


    The `UKJT` published a statement in December 2019 on the status of crypto-assets
    and smart contracts under the law of England and Wales.^([^(256)](#fn256))


    # 8.6 Conclusions


    Smart contracts generate significant interest, have substantial potential, and
    offer major benefits. The potential of smart contracts has been recognized by
    the industry, legal community and recently by some regulators and legislators
    as well. `UKJT` confirmed that ‘in legal terms, crypto-assets and smart contracts
    undoubtedly represent the future`,^([^(257)](#fn257))


    Smart contracts are not unified. They vary from simple, straightforward, standardized
    payment instructions to sophisticated instruments capable of the autonomous performance
    of a complicated sequence of actions. With the increased use of smart contracts
    more legal clarification, legislative recognition and regulatory guidance will
    be needed. The intersection of technology and law presents challenges and, although
    regulating smart contracts is ‘an exceptionally difficult task’,^([^(258)](#fn258))


    Several aspects of smart contracts challenge the legal community, but they are
    unlikely to undermine established legal systems and in principle there seem to
    be no major obstacles for smart contracts use and no dramatic legal reforms necessary
    to embrace them. The legislators’ response has been limited so far and tends to
    address basic definitions, legal recognition, and evidential admissibility of
    smart contracts. Smart contracts should remain firmly on the agenda of the legislators,
    who should thoroughly consider this technological development and monitor it closely,
    stepping in to provide legal clarity, support innovation and mitigate risks.

