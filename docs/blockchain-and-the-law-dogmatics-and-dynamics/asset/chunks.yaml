    Nelson M. Rosario in Chap. [2](#540017_1_En_2_Chapter.xhtml) adventures into assessing
    the promises and shortfalls of blockchain-based structures for voting. In Chap.
    [3](#540017_1_En_3_Chapter.xhtml), Renato Gomide Martinez de Almeida discusses
    the use of blockchain in transitional justice processes, by exploring its application
    in criminal prosecutions, truth commissions, reparations, in restoring democratic
    institutions and in reconciliation. In Chap. [4](#540017_1_En_4_Chapter.xhtml),
    Marta Carmo looks at the evolution of the tax treatment of crypto assets in Portugal,
    explaining and deconstructing the approaches by the Portuguese tax authorities
    that lead to the country in certain media circles being named as a “crypto tax
    haven”.


    In Chap. [5](#540017_1_En_5_Chapter.xhtml), George Daniel Raath dives into the
    topic of blockchain in the execution of judgments in the context of South Africa.


    João Vieira dos Santos and Guilherme Maia in Chap. [6](#540017_1_En_6_Chapter.xhtml)
    consider the legislative initiative of the European Union in setting up a DLT
    Pilot Regime and assess its possible impact on DeFi products. Anjeza Beja and
    Bernardo Correia Barradas in Chap. [7](#540017_1_En_7_Chapter.xhtml) look at the
    novel central bank digital currency, or CBDC, and its implications on anonymity.
    And, in Chap. [8](#540017_1_En_8_Chapter.xhtml), Ágata Ferreira concludes the
    book by discussing the specific relationship between smart contracts and the law,
    looking at the advantages of smart contracts and addressing the scholarly legal
    debate surrounding their implementation and use.


    All in all, this book provides a comprehensive overview of the intersection between
    blockchain and the law. It delves into the legal implications of blockchain technology
    and how it is being treated under existing legal frameworks. It also explores
    the potential of blockchain to reshape the legal landscape and how the law will
    continue to evolve in response to the growing use of blockchain. The book offers
    valuable insights into the complex relationship between blockchain and the law.
    It provides a well-rounded understanding of the legal implications of blockchain
    and how it can be leveraged for the benefit of society.


    We would like to acknowledge and thank all the authors for their outstanding contribution
    to this volume and especially thank Frank Bakker and Kiki van Gurp from T.M.C.
    Asser Press for accepting this volume for publication and all the patience with
    the editing process. We wish all our readers an enjoyable and rewarding reading.


    Francisco Pereira Coutinho Bernardo Correia Barradas Martinho Lucas Pires Lisbon,
    Portugal May 2023


