  trans: '


    此外，诚实信用原则在 `GTL` 第 104 条第 1)款中得到了保障。该项法律规定规定，如果税务机关（`TA`）在法庭上的行为违反此前向纳税人提供的约束性信息的内容，或者其在诉讼中的行为与相同情况下通常采取的做法不同，则可能根据恶意诉讼规则被处以财务罚款。然而，约束性裁决存在实务局限性：`TA`
    在出具约束性裁决后，并没有义务遵守所有属于同一准则范围的情况。相反，`TA` 与相同内容之间的联系是一种*双方之间（*inter partes*）的关系，因为禁止
    `TA` 仅针对请求纳税人的特定案件采取不同于裁决的方向进行.^#fn90)


    简而言之，尽管现有的约束性裁决具有实际意义，但 `TA` 仅对提出请求的个人纳税人具有约束力，且仅限于该请求涵盖的事实（事实上，纳税人可以根据 `GTL`
    第 68 条第 29)款对裁决提出上诉）。因此，尽管 `TA` 的“行为变更具有可责备性”，在阅读和解释约束性裁决时仍需谨慎，并考虑到诚实信用、信任以及平等原则。


    最后，如果 `TA` 以面对面、电话或通过“*e-balcão*”提供解释^#fn91


    ## 4.3 根据《企业所得税法》对加密资产征税


    ### 4.3.1 企业所得税法：简述^#fn92)


    葡萄牙 `CIT` 征收所有相关纳税人获得的所有收入（`CIT Code` 第 1 条）。`CIT Code` 第 2 条规定了若干实体为纳税人，例如：(i)
    在葡萄牙领土内设有总部或有效管理的商业公司或商业形式的民事公司、合作社、公司以及受公法或私法监管的其他法人；(ii) 在葡萄牙领土内设有总部或有效管理的无法律人格实体，其收入在自然人或法人拥有的情况下分别不属于
    `PIT` 或 `CIT` 的征税范围；^#fn93)


    根据 `CIT Code` 第 3 条，应纳税额取决于纳税人的类型，但对于上述第 (i) 项中主要从事商业、工业或农业活动的实体^#fn94


    该法典的第 4 条规定，对于在葡萄牙领土内设有总部或有效管理的法人和其他实体，`CIT` 对其总收入征税，包括在在该领土外获得的收入（全球收入原则）；而对于在葡萄牙领土内既没有总部也没有有效管理的实体，`CIT`
    仅对在该处获得的收入征税（属地原则或来源原则）。一般 `CIT` 税率为 21%，应纳税额在 25,000 欧元以下的中小型企业适用 17% 的优惠税率（见
    `CIT Code` 第 87 条第 1)和第(2)款）。


    ### 4.3.2 加密资产利润与会计视角的重要性


    `CIT Code` 下的纳税人可能通过加密资产获得多种收入，这些收入可能构成其应纳税利润。例如，它可能通过出售加密资产获得收益，通过提供与这些资产有关的服务获得佣金，通过销售涵盖加密资产行业的产品或服务获得收入，或者可能对其进行挖矿。在所有这些情况下，根据
    `CIT Code` 的征税方式与纳税人通过生产和销售椅子、提供图像咨询服务或任何其他业务活动获得收入完全相同，因为这些活动属于业务性质的经济经营，并完全被
    `CIT Code`（即其第 3 条）所涵盖。


    `TA` 尚未就加密资产和 `CIT` 发布过任何约束性裁决、一般性信息或其他解释。然而，葡萄牙注册会计师协会（“OCC”）于 2019 年 3 月 22
    日发布了关于加密货币的 `PT22246` 号技术意见。^#fn95


    由于 `CIT` 根据其法典确立的调整对利润征税，且起点是会计，因此会计在此背景下具有重要意义，人们应该问（从会计角度来看）：加密货币是严格意义上的（*stricto
    sensu*）无形资产还是库存？证券代币是金融工具吗？实用代币是无形资产还是与客户的合同？


    关于加密货币，国际财务报告解释委员会（`IFRIC`）于 2019 年 6 月发布了一份更新，在其中讨论了加密货币在国际财务报告准则（`IFRS`）下的性质，得出其属于国际会计准则（`IAS`）38“无形资产”的结论，“理由是
    (a) 它能够从持有者处分离并单独出售或转让；以及 (b) 它没有赋予持有者获得固定或确定数量货币单位的权利”，从而排除了作为金融资产（`IAS 32` 第
    11 段）或现金（`IAS 32` 第 AG3 段）。此外，如果实体在日常业务过程中持有加密资产待售，则该项持有属于库存（`IAS 2`）。^#fn96


    此外，经济合作发展组织（OECD）表示，虽然目前还没有关于加密资产的正式会计指南，但有应用现有的一般会计原则，即其经济目的、与之相关的权利和义务以及资产获得内在价值的方式。因此，证券代币可以被视为受
    `IFRS 9` 约束的金融资产，而实用代币可以被视为根据 `IFRS 15` 处理的商品和服务的预付款.^#fn97


    总之，尽管在会计视角上存在一些不确定性（这会影响 `CIT`），但如果纳税人从加密资产获得收入，只要满足上述主观和客观条件，该收入将构成 `CIT Code`
    的应纳税额。


    ## 4.4 根据《个人所得税法》对加密资产征税


    ### 4.4.1 个人所得税法：简述^#fn98)


    所有在葡萄牙领土内的居民自然人^#fn99


    > 第 1 条

    > 应纳税额

    > 1—个人所得税对以下各项收入的年度价值征税，在扣除相应的扣除额和免税后，即使是源于非法行为的收入：

    > A 表：工资收入

    > B 表：业务和专业收入

    > E 表：资本收入

    > F 表：财产收入

    > G 表：资本利得

    > H 表：养老金收入

    > 2—收入无论是以货币形式还是实物形式，无论在何处获得，以何种货币获得，均须征税。


