    # Volume 37 Information Technology and Law Series


    **Editor-in-Chief**

    Simone van der Hof (Center for Law and Digital Technologies), Leiden University,
    Leiden, The Netherlands


    **Series Editors**

    * Jef Ausloos (University of Amsterdam, Amsterdam, The Netherlands)

    * Stephan Dreyer (Leibniz-Institut für Medienforschung, Hamburg, Germany)

    * Gloria González Fuster (Law, Science, Technology & Society Studies (LSTS), Vrije
    Universiteit Brussel (VUB), Brussels, Belgium)

    * Inge Graef (University of Tilburg, Tilburg, The Netherlands)

    * Aleksandra Kuczerawy (Centre for IT and IP, KU Leuven, Leuven, Belgium)

    * Eva Lievens (Faculty of Law, Law & Technology, Ghent University, Ghent, Belgium)

    * Aurelia Tamo-Larrieux (Faculty of Law, Maastricht University, Maastricht, The
    Netherlands)


    The *Information Technology & Law Series* was an initiative of IT *e* R, the national
    programme for information Technology and Law, which was a research programme set
    up by the Dutch government and The Netherlands Organisation for Scientific Research
    (NWO) in The Hague. Since 1995 IT *e* R has published all of its research results
    in its own book series. In 2002 IT *e* R launched the present internationally
    orientated and English language *Information Technology & Law Series*. This well-established
    series deals with the implications of information technology for legal systems
    and institutions. Manuscripts and related correspondence can be sent to the Series’
    Editorial Office, which will also gladly provide more information concerning editorial
    standards and procedures.


    **Editors**

    * Francisco Pereira Coutinho (Department of Law, Nova School of Law, Lisbon, Portugal)

    * Martinho Lucas Pires (Department of Law, Universidade Católica Portuguesa, Lisbon,
    Portugal)

    * Bernardo Correia Barradas (World Bank Group, Lisbon, Portugal)


