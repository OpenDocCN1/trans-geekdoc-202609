    Still, one practical difficulty may arise: what is the exchange rate to Euros
    that one should apply? The `PIT Code` establishes in its article `23` the rules
    for values fixed in a currency without legal tender in Portugal (the equivalence
    to Euro should be determined by the official quotation of the respective currency,
    at the day resulting from those rules). However, this is not the appropriate solution
    since crypto-currencies are not technically currency.


    1. (a) At the officially established price;

    2. (b) By the official purchase quotation;

    3. (c) In the case of goods, by the purchase quotation on the Lisbon merchandise
    exchange or, if there is no such quotation, by the average price of the respective
    year or the last one determined, and which are included in the city stowage;

    4. (d) For the prices of similar goods or services published by the National Statistics
    Institute;

    5. (e) At market value, under conditions of competition.


    Since there is no official prices or quotations for crypto-assets, in our opinion,
    we should use market value (available in exchanges platforms). This was, for instance,
    the `IRS` solution on income resulting from an airdrop of crypto-currency in the
    sequence of a hard fork, determining that the taxable basis is measured by the
    respective market value.


    ## 4.5 Taxing Crypto-assets under the Value Added Tax Code


    ### 4.5.1 The Value Added Tax Code: A Brief Introduction


    The transfers of goods and the provision of services (as defined, respectively,
    in articles `3` and `4` of the `VAT Code`) carried out in Portugal, for consideration,
    by a taxable person acting as such, imports of goods (article `5` of the same
    Code) and intra-Community operations carried out in the national territory, as
    defined and regulated in the `VAT Regime for Intra-Community Transactions` are
    subject to VAT—article `1` of the `VAT Code`.


    Article `2` of the `VAT Code` establishes who are the taxable persons, among which
    we should highlight the natural or legal persons who, in an independent and habitual
    manner, carry out activities of production, trade or provision of services, including
    extractive, agricultural and free-trade activities, as well as those who, of the
    same carry out a single taxable transaction, provided that such transaction is
    connected with the exercise of the aforementioned activities, wherever this occurs,
    or when, regardless of that connection, such transaction fulfils the real impact
    of `PIT` or `CIT` (paragraph `a` of the same article).


    There are some exemptions, namely the ones related to the types of activity (article
    `9` of the `VAT Code`) and those related to turnover (article `53` of the same
    Code). The `VAT` rates are defined in article `18` of the `Code` and in the attached
    tables, being the general tax rate `23%`, intermediate tax rate `13%` and the
    reduced tax rate `6%` (for mainland).


    ### 4.5.2 The European Court of Justice Hedqvist Case


    In this landmark case there was a request for a preliminary ruling on whether
    transactions to exchange a traditional currency for the `Bitcoin` or vice versa
    (held by Mr. Hedqvist’s company) were subject to VAT. Article `2` of the `VAT
    Directive` started by noting that virtual currencies with bidirectional flow are
    not electronic money. Additionally, the `ECJ` decided that there is a consideration.
    Subsequently, the `ECJ` concluded that article `135(1)(d)` of the `VAT Directive`
    (which exempts `transactions, including negotiation, concerning deposit and current
    accounts, payments, transfers, debts and other negotiable instruments, but excluding
    debt collection`) was not applicable because `Bitcoin` is contractual mean of
    payment. However, it considered that the exemption provided by article `135(1)(e)`
    (`transactions, including negotiation, concerning currency, bank notes and coins
    used as legal tender, with the exception of collectors’ items, that is to say,
    gold, silver or other metal coins or bank notes which are not normally used as
    legal tender or coins of numismatic interest`) was applicable because if it covered
    only traditional currencies, the `ECJ` would be depriving such provision of a
    part of its effects since it is intended to alleviate the difficulties associated
    with determining the taxable amount and the amount of deductible VAT. Consequently,
    the transactions `sub judice` are exempted from VAT since they were covered by
    article `135(1)(e)` of the `VAT Directive`.


    Lastly, the `ECJ` stated that this type of transactions do fall under the scope
    of article `135(1)(f)` of the same Directive (`transactions, including negotiation
    but not management or safekeeping, in shares, interests in companies or associations,
    debentures and other securities, but excluding documents establishing title to
    goods, and the rights or securities referred to in Article 15(2)`) because `Bitcoin`
    was neither a security conferring a property right nor a security of comparable
    nature.


    ### 4.5.3 The Sale of Cryptocurrencies


    There is also a binding ruling in Portugal regarding the sale of cryptocurrencies
    for `VAT` purposes in which the applicant questioned what the legal framework
    is (and also are the documental procedures) for sales of `Bitcoin` through an
    electronic platform.


    The `TA` began by clarifying that `Bitcoin` is a virtual currency and that the
    transaction in question would be a costly service provision (art. 4 of the `VAT
    Code`) because it is not a transfer of tangible goods. If these transactions are
    carried out against consideration by a `VAT` taxable person, in the exercise of
    an economic activity, they constitute transactions subject to tax (articles `1(1)(a)`
    and `2(1)(a)` of the `VAT Code`), where the taxable amount corresponds to the
    amount of the consideration (article `16(1)` of the same Code).


    However, the transaction will be exempt from `VAT` because Article `9(27)(d)`
    of the `VAT Code` exempts `transactions, including trading, whose object is currency,
    bank notes and coins, which are legal means of payment, with the exception of
    coins and banknotes that are not normally used as such, or that have a numismatic
    interest`.


    Therefore, this binding ruling closely follows the `Hedqvist Case` and shows that
    it is necessary that a `VAT` taxable person pursues an economic activity (under
    schedule B of `PIT` or `CIT`), i.e., that the activity is carried out in an independent
    and habitual manner (art. 2 of VAT Code).


    ### 4.5.4 Mining


    The last binding ruling on these matters published by the `TA` was on remuneration
    with cryptocurrency through `mining`.


    However, despite this ruling, it is doubtful that there is an actual consideration,
    not only because in the case above the activity is not provided to anyone in particular
    (instead, it is provided to a `pool`).


    Table 4.2: Value added tax committee’s conclusions on mining


    | Activity | Subject to VAT? | If so, exempt? |

    | --- | --- | --- |

    | Mining Activities | • *Out of scope*: The fact that the payment of a transaction
    fee by a `Bitcoin` user is not a necessary condition for successfully sending
    bitcoins (and thus for receiving a verification service supplied by the miner)
    may be indicative of there not being a direct link between the consideration and
    the service. Besides, the provision of a mining service does not create for the
    miner the right to receive a consideration in exchange, which could imply the
    nonexistence of a legal synallagmatic relationship between him and the recipient
    of the verification services (the user whose transaction request the miner has
    validated). | | |

