  trans: '

    最后，我希望能够解释并揭示日益普及的区块链所带来的重大法律挑战，并对法律和市场如何从这里演变提出一些思考。鉴于该主题已有许多著作，我将保持简练并概括一些观点，特别是在讨论加密资产和智能合约时——本书的其他章节将以更深入的方式探讨这些主题。


    ## 1.2 法律的“现象”


    如果我们希望尽可能简单——鉴于本章的局限性，简单化是必须的——那么对法律的即时定义或或少如下所示：法律是特定社区内生效的一套规则体系，由权威机构制定，并根据正义标准组织个人和集体行为。当然，当我们评估该定义所包含的所有内容时，任何法律定义（即使是最直接、最浅显的）都难以陷入第二层解读的困境。我们说的规则是什么？什么是社区？什么是权威机构？我们为什么需要组织行为？此外，什么是正义？让我们对这句话进行解构，以获得对法律现象更全面（但仍具有某种简单实用性）的视角。


    法律是一套规则体系——通过这一表达，我的意思是法律是一组语言陈述的规范，这些陈述通常是指令性的。^(⁵)


    法律规范的目的是建立某种秩序，即建立一个对外部个人和集体行为存在预期的空间。^(⁶)


    就其本身而言，“秩序”是一个非常正式且空洞的概念。任何法律秩序（特定政治社区或社区的规则集）都是在特定的价值观和原则下建立的。^(⁷)


    以下考虑是最复杂的，因为它们涉及到“法律是意志的产物”的问题。当我们说权威机构颁布法律时，我的意思是（并且我怀疑读者立刻会这样假设的）法律是政治行动的形式。^(⁸)


    关于法律有一种更具社会性的观点，它关注的与其说是行使自上而下的统治权威权力，不如说是从社区通过日常互动涌出的法律的集体表达。法律的社会表达被称为“习俗”，通过习俗，人们根据对法律强制义务的集体认知来行动，而这可能与实法（例如统治者制定的法律）相冲突。^(⁹)


    因此，我们可以说法律现象由政治社区内的行为规则、其意义、应用和维护组成。某些规则是政治制造的；它们被颁布，且社区的统治当局保证其效力。然而，其他规则可能产生于集体协议，或通过与社区成员反复定期的互动产生。一种（自由）法律秩序将具有命令性的统治，同时允许出现大的私人秩序空间。


    法律运作（法律的颁布、执行和审判）由每个社区在其领土内完成（社区也可能允许其他外部实体对其行使法律权力，例如在某些条件下允许联邦或涉及有限政策领域的国际组织）。基本法律问题集和一般性答案在每个国家从根本上是相同的：集体与政治权力之间的关系受宪法管辖，宪法规定了被治者和政府的权利与义务。相比之下，社区成员之间的关系遵循“知情同意下的自由承诺”逻辑，对于质疑或违反人们相互之间所立承诺的行为，则适用责任规则。每个社区之间存在许多差异——例如：在知情同意下什么构成自由承诺、在何种情况下产生责任，以及证明过错所需的程度（等规则）——因为每个社区在其特定的语境下都应该有其对正确和正义的定义。从现实主义和某种本质主义的角度来看，这些是关于法律的主要结构性点，旨在履行其引导行为和实现有序生活的功能。


    ## 1.3 区块链的“现象”


    区块链首先是一种技术：一种“科学发现的实际（特别是工业上）应用的形式”。^(¹⁰)


    最著名的区块链协议是比特币。比特币协议在技术和意识形态上的重要性不应被低估。大多数关于区块链及其原则、益处及其问题和风险的描述，指的是比特币协议的特征。其基本假设是广为人知的：比特币通过去中心化的点对点网络在人类之间建立了一个价值交换系统（在这种情况下，价值指的是关于名为比特币令牌属性的信息，该令牌将作为一种全球数字货币使用）。所谓的去中心化，意思是交易双方之间没有中间人：网络及其用户控制整个过程。网络中两个具有加密身份的人同意交换他们的代币，并通过他们各自的加密身份签署交易来向网络传达他们的意图。网络接收所有交易，一旦另一个用户（称为矿工）解决了自动生成的谜题，网络中一个新区块就会形成，交易被插入、盖上戳并按时间顺序排列。一旦用户在链上确认该区块，交易就会被密封，任何人都可以看到区块并检查信息，但无法更改它。^(¹¹)


    比特币的去中心化主张具有第二个重要意义：缺乏统治权威，例如董事会。其创建者中本丰（Satoshi Nakamoto）的匿名性有助于为比特币注入灵魂，并将其管理交给社区。这意味着协议治理具有高度摩擦性，正如某些事件所示，例如
    `SegWit` 更新和 `blocksize wars`。^(¹²)


    随之后的大多数区块链协议开发方式有所不同，即使它们从比特币和中本丰那里汲取了技术和意识形态的灵感。通用的术语框架用于区分第一代协议（基本上是比特币）与第二代（以太坊）以及第三代（例如，ano、Algorand）。^(¹³)


    对于第二代和第三代协议，去中心化仅存在于第一个意义上。在第二个意义上，其存在性并不明显。虽然理论上这些协议没有中央正式权威，但协议创始人通常是“公众”人物，通常拥有良好的在线形象和重要的商业愿景。在某些情况下，协议由私人实体（基金会、公司）支持，这些实体拥有足够的资金和人力（主要是开发者）来行动并影响协议的运行。例如，以太坊基金会支持硬叉以更改代码中的漏洞的方式。^(¹⁴)


