    \ the form in which it is earned.\n\nOnly the income from those schedules is taxed\
    \ and the annual taxable amount is subject to progressive taxation up to 48%,\
    \ plus an additional solidarity tax with a rate of 2,5% applicable to taxable\
    \ income exceeding € 80,000 up to € 250,000 and of 5% applicable to taxable income\
    \ exceeding € 250,000. However, there are some types of income taxed with autonomous\
    \ or final tax rates—both usually of 28%.^([^(100)](#fn100))"
