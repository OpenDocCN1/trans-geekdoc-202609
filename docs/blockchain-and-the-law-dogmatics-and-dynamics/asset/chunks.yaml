    ## Abstract

    Smart contracts raise a number of interesting legal issues. An ongoing legal debate
    concerns a number of potential legal pitfalls related to smart contracts, including
    the existence of a valid, binding legal contract, the ability to reconcile the
    immutability of blockchain records with contractual deficiencies, governing law
    and applicable jurisdiction, consumer protection, anti-money laundering/combating
    the financing of terrorism (AML/CFT) requirements, implications of automated,
    unstoppable execution, as well as privacy and confidentiality of smart contracts
    deployed on borderless decentralized blockchain networks. This chapter provides
    an overview of the most commonly invoked advantages of smart contracts and highlights
    the fervor of the scholarly legal debate surrounding smart contracts. It also
    presents a range of legislative initiatives taken so far in response to the smart
    contracts phenomenon.


    **Keywords:** Smart contracts, Contract law, Automation, rights and duties, Private
    autonomy.


    ## 8.1 Introduction

    Smart contracts are being deployed across a range of sectors, including the financial
    sector, public sector, supply chain management, and the automobile, real estate,
    insurance, and health care industries.


    Smart contracts raise a number of interesting legal issues despite contract laws
    being a fairly well-developed area of law and contractual freedom being widely
    recognized across most jurisdictions.


    The first section introduces the origins of smart contracts and their revival
    with the dawn of blockchain technology. The second section explains most commonly
    invoked benefits of smart contracts and examines their merits. The third section
    provides an overview of the ongoing legal scholarship debate. The fourth section
    analyses selected smart contracts legislative initiatives across various jurisdictions.
    The final section offers concluding remarks.


    ## 8.2 Origins

    Nick Szabo, a computer scientist and legal theorist, first coined the phrase “smart
    contracts” in the 1990s and gave an example of a vending machine as a ‘canonical
    real-life example, which we might consider to be the primitive ancestor of smart
    contracts’.


    Smart contracts pre-exist blockchain technology, but blockchain has enabled the
    progress of smart contracts from simple automated contracts to fully autonomous
    self-executing and self- performing contracts built on decentralized platforms
    and supported by a blockchain ecosystem.


    ## 8.3 Advantages

    Smart contracts’ enthusiasts emphasize the benefits of efficiency resulting from
    the attributes of automation, standardization, and transparency.


    Smart contracts’ optimists envision commercial activity through the exclusive
    use of smart contracts ‘avoiding the high costs of contract drafting, judicial
    intervention, opportunistic behavior, and the inherent ambiguities of written
    language’.


    For libertarians, smart contracts are considered an embodiment of individual self-determination
    and autonomy due to their self-contained rules and the ability to contract free
    from state interference.


    Fairfield notes disintermediation of smart contracts shifts consumer protection
    from courts, which have a history of ‘longstanding refusal to enforce contract
    terms proffered by consumer’, to automated consumer-grade purchasing agents.


    ## 8.4 Legal Debate

    The idea of a self-executing software that automatically and autonomously implements
    contractual terms on a peer-to-peer and immutable basis remains legally problematic.
    Legal debates are often prompted by claims that code should be treated as a ‘foreign
    legal system’.


    ### 8.4.1 Is a Smart Contract a Contract?

    Legal community has been grappling with the question of whether smart contracts
    are contracts in a legal sense. Much of this confusion is due to terminological
    misconceptions and an overlap of law and technology, which resulted in intense
    scholarly debates. Some of them produced a rebuttal of smart contracts as neither
    smart nor contracts.


    Some authors believe, that unlike traditional contracts, smart contracts follow
    simple conditional `if–then` logic, whereas the matrix of traditional contracts
    is based on consensual connection, a meeting of the minds, within a binary sequence
    of the ‘offer and acceptance’.


    Contract law fundamentals of each legal system determine what is required to create
    a valid and binding contract. Common law, like English law, requires three elements:
    offer, acceptance, and consideration for valid contract formation. The UK Jurisdiction
    Task Force (UKJT) has recently stated that a ‘smart contract is capable of satisfying
    those requirements just as well as a more traditional or natural language contract,
    and a smart contract is therefore capable of having contractual force’.


    ### 8.4.2 Code is Law?

    ‘Code is law’ became a libertarian ideal upheld by some smart contracts’ proponents,
    according to which technology alone provides sufficient regulatory parameters
    to govern smart contracts. The phrase ‘code is law’ was coined by Lessig and has
    since been used to denote the notion that the underlying software code becomes
    de facto a regulator of the architecture and infrastructure of cyberspace. Code
    as a regulator of cyberspace is not a new idea. Self-regulation of cyberspace
    is described by Reidenberg.


    Mik counters the proposition that ‘code is law’ as applicable to smart contracts
    by saying that such ideas ‘falsely assume that it is technically feasible to encode
    every aspect of a transaction and that it is legally permissible to exclude the
    operation of the legal system’.


    Following the emergence of blockchain technology, De Filippi and Wright took the
    notion ‘code is law’ one step further, by introducing an idea of Lex Cryptographia,
    a new paradigm of law representing the ‘world where ideals of individual freedom
    and emancipation might come true’.


    Blockchain based smart contracts programmed by using Turing complete programming
    script, which allows any natural language expression to be translated into a code,
    brought a new dimension to the notion of cyberspace self-regulation. Lex Cryptographia
    is being defined as a new subset of law, as ‘rules administered through self-executing
    smart contracts and decentralized (autonomous) organizations. In this model, ‘law
    and code may merge, so that the only way for people to infringe the law is to
    effectively break the code’. To facilitate assimilation of law into code, laws
    could evolve towards code-like expressions, which could lead to ‘law progressively
    turning into code’.

