  trans: '


    尽管如此，可能会出现一个实际操作困难：应该采用什么种兑欧元汇率？`PIT Code` 在其第 `23` 条中规定了在葡萄牙没有法定货币的货币中确定价值的规则（与欧元的等值应根据这些规则所产生的日期的相应货币的官方报价来确定）。然而，这并不是合适的解决方案，因为加密货币在技术上并不属于货币。


    1. (a) 按照官方确立的价格；

    2. (b) 按照官方买入报价；

    3. (c) 对于货物，按照利斯本商品交易所的买入报价；若无此类报价，则按照该年度或上一次确定的平均价格计算，且该价格已包含在城市仓储费内；

    4. (d) 按照国家统计局公布的货物或服务的价格；

    5. (e) 在竞争条件下，按市场价值计算。


    由于加密资产没有官方价格或报价，我们认为，应该使用市场价值（在交易所平台可获得）。例如，`IRS` 对于硬分叉序列中加密货币空投所得的解决方案是，确定纳税基础是按相应的市场价值衡量的。


    ## 4.5 增值税法下加密资产的征税


    ### 4.5.1 增值税法：简介介绍


    在葡萄牙境内，由纳税人以其身份有偿地进行的货物转让和服务的提供（分别在 `VAT Code` 的第 `3` 条和第 `4` 条中定义）、货物进口（该法第 `5`
    条）以及根据《社区内交易增值税制度》的定义和监管、在国家领土内开展的社区内交易，均须缴纳增值税（VAT）——详见 `VAT Code` 的第 `1` 条。


    `VAT Code` 的第 `2` 条规定了谁是纳税人，其中我们应该重点关注以独立且习惯的方式从事生产、贸易或服务提供活动（包括开采、农业和自由贸易活动）的自然人或法人，以及同样从事单次应税交易的人，只要该交易与上述活动的开展有关（无论发生在何地），或者无论是否具有此类关联，该交易都产生了
    `PIT` 或 `CIT` 的实际影响（该条第 `a` 段）。


    存在一些豁免规定，即与活动类型相关的豁免（`VAT Code` 第 `9` 条）以及与营业额相关的豁免（该法第 `53` 条）。`VAT` 税率在法典第 `18`
    条及附表中定义，其中一般税率为 `23%`，中间税率为 `13%`，优惠税率为 `6%`（针对大陆地区）。


    ### 4.5.2 欧洲法院 Hedqvist 案


    在这一里程碑案件中，曾就将传统货币兑换 `Bitcoin` 或反之（由 Hedqvist 先生的公司持有）的交易是否缴纳增值税提出了预裁请求。`VAT Directive`
    的第 `2` 条首先指出，具有双向流的虚拟货币不是电子货币。此外，`ECJ` 认定存在对价。随后，`ECJ` 得出 `VAT Directive` 第 `135(1)(d)`
    条（豁免“涉及存款和活期账户、支付、转账、债务和其他可转让证券的交易（包括谈判），但不包括债务收回”）不适用，因为 `Bitcoin` 是一种合同支付手段。然而，它认为第
    `135(1)(e)` 条提供的豁免适用（“涉及货币、作为法定货币使用的纸币和硬币的交易（包括谈判），收藏品除外，即金、银或其他不通常作为法定货币使用的金属币或纸币，或具有钱币收藏价值的硬币”），因为如果涵盖了所有货币，由于增值税的目的是减轻确定计税基础的困难，`subjudice`（本案中）的交易将免于缴纳增值税。


    最后，`ECJ` 指出此类交易不属于 `135(1)(f)` 条的范围（“涉及股份、权益、债券和其他证券的（包括管理或保管），但不排除证明物权的文件”），因为
    `Bitcoin` 既不是授予物权的证券，也不是证券。


    ### 4.5.3 加密货币的销售


    在葡萄牙，还有一份关于增值税目的加密货币销售的约束性裁决，在该裁决中，申请人询问了通过电子平台销售加密货币的法律框架。


    `TA` 首先澄清，`Bitcoin` 是一种虚拟货币，且相关交易属于有偿服务提供（`VAT Code` 第 `4` 条），因为它不是货物的转让。如果这些交易是由纳税人在从事经济活动时有偿开展的，则构成了应税交易（`VAT
    Code` 第 `1(a)` 条和第 `2(a)` 条），其计税基础对应对价金额（该法第 `16(1)` 条）。


    然而，该交易将免缴增值税，因为 `VAT Code` 第 `9(27)(d)` 条豁免“涉及货币、作为法定货币使用的纸币和硬币的交易（包括交易），但不通常作为此类使用的或具有钱币收藏价值的”。


    因此，该约束性裁决密切遵循 `Hedqvist 案`，并显示纳税人必须从事经济活动（根据 `PIT` 或 `CIT` 的附件 B），即该活动是以独立且习惯的方式进行的（增值税法第
    2 条）。


    ### 4.5.4 挖矿


    `TA` 发布的此类问题的最后一份约束性裁决是关于通过`挖矿`获得报酬。


    然而，尽管有此裁决，对于是否存在实际对价仍存怀疑，不仅在上述案例中，活动并非提供给特定个人（而是提供给`pool`）。


    表 4.2：增值税委员会关于挖矿的结论


    | 活动 | 是否属于增值税范围？ | 如果是，是否豁免？ |

    | --- | --- | --- |

    | 挖矿活动 | • *超出范围*：`Bitcoin` 用户支付交易费并非成功发送比特币（因此并非获得矿工所提供的验证服务）的必要条件，这可能表明对价与服务之间没有直接联系。
