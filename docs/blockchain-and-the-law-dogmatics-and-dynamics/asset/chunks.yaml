- fmt: "\nAt the time of granting a specific authorization, operators of DLT market\
    \ infrastructures should also have a credible exit strategy in case the DLT Pilot\
    \ Regime is discontinued, the specific authorization or some of the exemptions\
    \ granted are withdrawn, or the thresholds for DLT financial instruments are exceeded.\
    \ Such strategy should include how to transition or revert from their operations\
    \ based on distributed ledger technology to traditional market infrastructures—Article\
    \ 7(7) of the DLT Pilot Regime.\n\nNational competent authorities are those designated\
    \ under Article 67 of `Directive 2014/65/EU`, under Article 11 of `Regulation\
    \ (EU) No 909/2014` or otherwise by the Member States—Article 2(21) of the DLT\
    \ Pilot Regime. These authorities provide `ESMA` with all relevant information\
    \ before granting a specific authorization—Articles `8(6)`, `9(6)` and `10(7)`\
    \ of the DLT Pilot Regime. This is because `ESMA` may provide the national competent\
    \ authority with a non-binding opinion on the exemptions requested or on the appropriateness\
    \ of the type of distributed ledger technology used, where necessary to promote\
    \ consistency and proportionality of the exemptions or where necessary to ensure\
    \ investor protection, market integrity and financial stability—Articles `8(7)`,\
    \ `9(7)` and `10(8)` of the DLT Pilot Regime.\n\nThe national competent authority\
    \ examining an application submitted by an operator of a DLT market infrastructure\
    \ has the possibility to refuse to grant a specific authorization if there are\
    \ reasons to believe that the DLT market infrastructure would not be able to comply\
    \ with applicable provisions established by the Union law or provisions of national\
    \ law falling outside the scope of Union law, if there are reasons to believe\
    \ that the DLT market infrastructure would pose a risk to investor protection,\
    \ market integrity or financial stability, or if the application constitutes an\
    \ attempt to circumvent existing financial requirements—Articles. `8(10)`, `9(10)`\
    \ and `10(10)` of the DLT Pilot Regime.\n\nAfter the specific authorization has\
    \ been granted, competent authorities have the power to withdraw a specific authorization\
    \ or any exemptions granted to a DLT market infrastructure where an anomaly has\
    \ been detected in the underlying technology or in the services provided and activities\
    \ undertaken by the operator of the DLT market infrastructure if that anomaly\
    \ is not outweighed by the benefits provided by the service and activities in\
    \ question, where the operator of the DLT market infrastructure has breached any\
    \ obligations attached to authorizations and exemptions granted by the competent\
    \ authority, or where the operator of the DLT market infrastructure has registered\
    \ financial instruments which exceed the thresholds for DLT financial instruments\
    \ or which do not comply with other conditions applying to such instruments provided\
    \ for in the DLT Pilot Regime—Articles `8(12)`, `9(12)` and `10(12)` of the DLT\
    \ Pilot Regime.\n\n`ESMA` must submit a report to the European Commission by 24\
    \ March 2026, which includes a cost–benefit analysis in order to determine the\
    \ extension of the DLT Pilot Regime for a new period of up to three years, the\
    \ extension of the regime to other types of financial instruments, its modification,\
    \ its conversion into a permanent regime or its termination—Article 14 of the\
    \ DLT Pilot Regime. The DLT Pilot Regime entered into force on 22 June 2022, with\
    \ most of the rules being applicable as of 23 March 2023—Article 19 of the DLT\
    \ Pilot Regime.\n\nTo implement this Regulation is important to mention that the\
    \ rules on securities recording systems are not harmonized at the EU level.\n\n\
    ## 6.3 What Is DeFi?\n\nDeFi (Decentralized Finance) is an ecosystem of decentralized\
    \ applications (dapps).\n\nDeFi may comprise a provision of financial services\
    \ by multiple participants, intermediaries, and end-users across various jurisdictions,\
    \ with a purely technological infrastructure to facilitate interactions between\
    \ agents.\n\nIn this chapter, we give an overview of the DeFi ecosystem by describing\
    \ the technical infrastructure of the technology and the different applications\
    \ within the financial industry.\n\n### 6.3.1 DeFI Architecture\n\nThis sub-chapter\
    \ illustrates a simplified version of DeFi's structure by providing a general\
    \ and non-technical overview of its layers. DeFi uses a hierarchical multi-layered\
    \ architecture with different purposes. It differentiates between three main layers,\
    \ as is shown in Fig. [6.4]: the settlement, the protocol, and the interface layers.\n\
    \n![Fig. 6.4 ¶ DeFi layered system. Source The authors](images/540017_1_En_6_Chapter/540017_1_En_6_Fig4_HTML.png)\n\
    \nFig. 6.4 ¶ DeFi layered system. Source The authors\n\n1. **I. The Settlement\
    \ Layer (Layer One)**:\n   Layer One consists of the `DLT`.\n\n2. **II. The Protocol\
    \ Layer (Layer Two)**:\n   Layer Two comprises the compiler and the ability to\
    \ create Application Programming Interfaces (API). A compiler is a program that\
    \ converts current high-level to low-level programming languages.\n   Layer Two\
    \ includes the programming languages that may be compiled, such as `Solidity`\
    \ or `Python`, smart contract.\n\n3. **III. The Interface Layer (Layer Three)**:\n\
    \   Layer Three creates user-oriented applications that allow users to interact\
    \ with an application through a web page. The purpose of interfaces is to enable\
    \ the program to enforce the properties embedded in the code via objects familiar\
    \ to most users, such as text boxes, buttons, or any interaction on a web page.\n\
    \n### 6.3.2 DeFi Categories\n\nThis sub-chapter aims to describe the current major\
    \ applications of DeFi. There are categories termed “stablecoins” and “derivatives”,\
    \ which formally refer to the representation of a particular instrument; however,\
    \ the scope of this sub-chapter is to determine the applications at a protocol\
    \ level. As a result, those terms are merely used for technical ease of reference.\n\
    \nCurrently, DeFi has seven major classes:\n\n1. **IV. Stablecoins**: Stablecoins\
    \ are crypto-assets that typically transact on a distributed ledger and rely on\
    \ cryptographic validation techniques to be transacted, intending to achieve stable\
    \ value relative to fiat currencies. In principle, stablecoins allow users to\
    \ protect the nominal value of their holdings.\n   * **V. Fiat-backed stablecoins**\
    \ aim to maintain a stable value by being collateralized by the fiat currency\
    \ that they may represent.\n   * **VI. Asset-backed stablecoins** aim to maintain\
    \ a stable value via collateralization of several fiat currencies, one or more\
    \ commodities, other crypto-assets, or a basket of such assets.\n   * **VII. Algorithmic\
    \ stablecoins** Algorithmic stablecoins aim to maintain a stable value via inbuilt\
    \ stabilization functions that provide for the increase or decrease of the supply\
    \ of such crypto-assets in response to changes in demand.\n\nDecentralized stablecoins\
    \ (b., c.) aim to solve the trust issue that may arise from fiat-backed stablecoins\
    \ (a.). Ideally, decentralized stablecoins are created in a decentralized manner\
    \ via an over-collateralization or algorithmic method, operate fully on decentralized\
    \ ledgers, are governed by decentralized autonomous organizations, and anyone\
    \ can publicly audit their reserves. Thus, one can conclude that the core components\
    \ of a decentralized stablecoin are as follows:\n\n* **Collateral**: This is the\
    \ store of primary value for a stablecoin. The collateral per se can be exogenous\
    \ and primarily used in other protocols; endogenous, where the collateral was\
    \ created to be collateral within the protocol or implicit, where the design lacks\
    \ an explicit collateral store.\n"
