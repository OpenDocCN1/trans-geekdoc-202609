    \ be them among users, network founders, miners, and the like; enforcement of\
    \ local rules can sometimes prove challenging and can be inadequate for it may\
    \ risk tampering with the creative side of the phenomenon; new rules should be\
    \ enacted in some cases, but the most significant change that has to come is cultural,\
    \ concerning computational literacy and understanding of how digital technologies\
    \ develop. If there are notes I would like to suggest regarding a blockchain framework\
    \ and the law, these are the ones.\n\n© T.M.C. Asser Press and the author(s) 2024\
