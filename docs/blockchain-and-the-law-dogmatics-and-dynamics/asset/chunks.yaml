  raw: "    The second is that a South African court or arbitral tribunal will not\
    \ issue an order payable in cryptocurrency. Any judgment or award entered will\
    \ ordinarily be in South African Rands.^([^(150)](#fn150))\n\n    The third is\
    \ that any judgment handed down by a court or arbitral tribunal, will be submitted\
    \ to the parties in written form, either by email or through the South African\
    \ High Court’s case management system.^([^(151)](#fn151))\n\n    On this point,\
    \ Ortolani takes the view that: “*The mechanism of oracles can be readily applied\
    \ to arbitration; a smart contract can defer to the decision of a third party\
    \ adjudicator, such as an arbitral tribunal, and determine the final recipient\
    \ of certain disputed assets on the basis of a ruling made by that oracle. In\
    \ other words, the external information retrieved by the smart contract could\
    \ be an arbitral award, and software script could be used to enforce the outcome\
    \ of the procedure.*”^([^(152)](#fn152))\n\n    Whilst this is no doubt possible\
    \ in theory, delivering on the promise of seamless interaction between a software\
    \ script and an arbitral award to execute a smart contract is unlikely to be standard\
    \ in South Africa for the foreseeable future, requiring the intermediation of\
    \ a human actor serving as oracle.\n\n    The fourth is that the value of cryptocurrencies\
    \ are notoriously volatile.^([^(153)](#fn153))\n\n    The fifth, which emerges\
    \ from the process described above and the notional difficulties which might arise,\
    \ is that the parties will have to conclude a written agreement regulating the\
    \ disparate aspects involved in smart contract execution. The agreement will have\
    \ to regulate issues such as the creation of the smart contract code, the blockchain\
    \ platform which will be used, the manner of conversion of South African Rands\
    \ to cryptocurrency, the way the outcome of the suit will be submitted onto the\
    \ blockchain, the oracle to be used and ensuring that the smart contract retains\
    \ a sufficient value of cryptocurrency to give effect to any order entered against\
    \ the parties. The concept of delayed execution for appeals and the possible stay\
    \ of execution in prescribed circumstances will also need to be catered for. Such\
    \ an agreement will be detailed and technical in nature and will likely form the\
    \ subject matter of much negotiation between the parties. The agreement itself\
    \ may also become the subject of dispute between the parties. These elements of\
    \ complexity render the adoption of such an agreement relatively unattractive.\
    \ It may be however that in due course a standard form of agreement can be adopted\
    \ should blockchain execution become more widely practised.\n\n    ### 5.4.3 Benefits\
    \ to the Parties\n\n    A seemingly simple yet fundamental question that must\
    \ be asked is why the parties would agree to blockchain execution at all? The\
    \ advantages from the claimant’s perspective are clear. Any order obtained will\
    \ be executed upon immediately and the cumbersome traditional execution process\
    \ negated. The process is automated on-blockchain and therefore free from human\
    \ interference. The claimant would be guaranteed payment and a recalcitrant debtor\
    \ will not have the ability to evade satisfaction of the order. Once the smart\
    \ contract executes, the payment is final and cannot be reversed. The result will\
    \ therefore be immutable. The process is swift and cost effective. All these factors\
    \ redound to the claimant’s benefit.\n\n    From the defendant’s perspective,\
    \ the advantage is less clear. Even a defendant acting in good faith might be\
    \ hesitant to commit a substantial sum of cryptocurrency to a smart contract for\
    \ an extended period whilst litigious proceedings are ongoing, simply to suit\
    \ the convenience of a claimant. Such a defendant might take the view that when\
    \ judgment is handed down, it will comply with the judgment in the ordinary course.\n\
    \n    There are however two scenarios in which a defendant may well be inclined\
    \ to agree to be bound upfront to on-blockchain execution. The first is where\
    \ the defendant wishes to institute a counterclaim against the claimant. The second\
    \ is where the defendant wishes to obtain security for costs (explored more fully\
    \ below).\n\n    Counterclaims in South African law are provided for in Uniform\
    \ Rule 24, which permits a defendant to deliver a claim in reconvention against\
    \ the claimant, at the time of pleading to the claimant’s suit.^([^(154)](#fn154))\n\
    \n    In such a scenario, where Party B might wish to institute a counterclaim\
    \ against Party A, the prospect of both parties committing to on-blockchain execution\
    \ would make sense to both litigants—both parties will be claimants in the dispute\
    \ and benefit from receiving immediate redress by way of the pre-agreed smart\
    \ contract execution.\n\n    This is particularly so where time is of the essence\
    \ to both parties. For instance, the parties may choose to arbitrate their dispute\
    \ using the Arbitration Foundation of South Africa’s Expedited Rules, which are\
    \ expressly aimed at ensuring that the dispute is speedily resolved.^([^(155)](#fn155))\n\
    \n    ### 5.4.4 Security for Costs\n\n    A second basis upon which a defendant\
    \ is likely to agree to on-blockchain execution, is where the defendant stands\
    \ to gain from such execution in respect of security for costs. In the scenario\
    \ detailed above, Party A was required to render security for the costs of the\
    \ litigation to Party B. Security for costs is furnished in terms of Uniform Rule\
    \ 47, which permits a litigant to seek security for the costs which it may incur\
    \ in litigation from the other party to the suit.^([^(156)](#fn156))\n\n    Whilst\
    \ the Rule does not prescribe which form security for costs must take, it is established\
    \ practice that it takes the form of a bank guarantee.^([^(157)](#fn157))\n\n\
    \    As is clear, the process of obtaining such a guarantee is (like traditional\
    \ execution) a laborious and expensive undertaking. It requires payment to the\
    \ bank concerned of a fee or commission to issue the guarantee and maintain the\
    \ account in which the funds are held. Also, whilst the funds are held by the\
    \ bank subject to the guarantee, the interest earned on the amount deposited is\
    \ usually of a nominal nature, leading to a depreciation of the amount held over\
    \ time.\n\n    This being so, it may be attractive for a defendant (Party B in\
    \ our scenario), to agree to on-blockchain execution and the putting forward of\
    \ a possible judgment amount as part of the smart contract, provided that the\
    \ claimant (Party A in our scenario) is willing to do the same in respect of any\
    \ security for costs agreed to between the parties. Party B will in this event\
    \ enjoy the certainty of knowing that no bank guarantee is required nor need it\
    \ be presented for payment if the claimant’s suit is successfully dismissed—rather,\
    \ the dismissal will be actioned on-blockchain and the costs due to the defendant\
    \ paid to it by means of pre-agreed smart contract execution. Party B may particularly\
    \ be inclined to agree to this where it believes the claimant’s suit has little\
    \ prospect of success.\n\n    ## 5.5 Conclusion\n\n    It is clear from what is\
    \ set out in this chapter that conventional means of execution in South Africa\
    \ holds little appeal to a litigant with an order in its favour. The process is,\
    \ as explained, time consuming and expensive.\n\n    An alternative to the *status\
    \ quo* could be on-blockchain execution using smart contracts. The benefits to\
    \ the parties are evident—speed of execution and certainty of payment is a boon\
    \ to any litigant.\n\n    This is particularly so where both parties stand to\
    \ gain, such as where both a claim and counterclaim is concerned, or either party\
    \ stands to profit from security for costs put up in litigation.\n\n    While\
    \ the proposal is novel, certainly in a South African context, as cryptocurrencies\
    \ and blockchain technology become more widely used and gain legitimacy in commerce,\
    \ so could the use of smart contract execution, to the benefit of the litigious\
    \ process as a whole."
