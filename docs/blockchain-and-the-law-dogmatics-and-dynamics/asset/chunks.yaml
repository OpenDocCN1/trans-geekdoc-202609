    Conversely, private blockchains need not guarantee permissionless nor decentralization.
    The advantages to not guaranteeing those characteristics are that private blockchain
    deployments allow for complete control over who may participate in the network
    as well as how information flows through the network. As such, private blockchain
    deployments are often favored by large corporations who require more certainty
    in their data management practices as well as by government entities. Additionally,
    since private blockchains are not permissionless or decentralized there is a question
    of whether they are in fact blockchains at all. In particular, detractors of private
    blockchains often believe that a small number of entities may retain control of
    code to run the blockchain network, as well as reverse transactions or delete
    transaction entries that would have been considered legitimate in a public blockchain
    network.


    So, what problems do blockchains actually solve? One of the primary issues that
    blockchains address is the problem of trust. Traditional digital systems, such
    as online payment platforms, require users to trust a third party to facilitate
    transactions. This trust can be easily broken if the third party is hacked or
    decides to act dishonestly.


    While blockchains are a powerful and innovative technology, they also create several
    problems that must be addressed. One of the primary issues with blockchains is
    their complexity. Blockchain systems are often difficult to understand and implement,
    requiring specialized knowledge and expertise. This complexity can create barriers
    to entry, limiting the number of organizations and individuals who can effectively
    utilize the technology. Additionally, blockchains can be resource-intensive, requiring
    significant computing power and energy consumption to operate. This can create
    environmental concerns and limit the scalability of blockchain systems. Finally,
    the anonymity of blockchain transactions can create challenges for law enforcement
    and regulatory agencies, as it can be difficult to identify and hold accountable
    those who engage in illegal activities on blockchain networks. Overall, while
    blockchains offer many benefits, it is essential to carefully consider and address
    the challenges and drawbacks associated with the technology.


    ## 2.4 Combining Blockchains and Elections


    Governments may be interested in combining blockchain technology and elections
    for several reasons. One of the primary benefits of using blockchain for elections
    is the assumed increased security and transparency it provides. By creating a
    supposed immutable record of transactions, blockchain technology provides a promise
    to prevent voter fraud and tampering, ensuring that election results are accurate
    and trustworthy. Additionally, blockchain may help improve the efficiency of the
    electoral process by streamlining voter registration, ballot distribution, and
    vote counting. This may reduce the potential for errors and delays, providing
    faster and more reliable election results. Blockchain technology may be an excellent
    fit for something like voter registration, because whether someone is registered
    to vote or not is a different problem than whether someone has voted or not.


    Another reason governments may be interested in combining blockchain and elections
    is to increase voter participation. By using mobile-based blockchain systems,
    governments can make it easier and more convenient for citizens to vote, particularly
    those who may face barriers to traditional voting methods, such as physical disabilities,
    geographic isolation, or mobility issues. This can help increase voter turnout
    and ensure that all citizens have a voice in the political process. Overall, by
    leveraging the benefits of blockchain technology, governments may be able to create
    more secure, efficient, and inclusive electoral systems, enhancing the legitimacy
    and effectiveness of democratic governance.


    While blockchain technology has the potential to improve the security and efficiency
    of the electoral process, there are several reasons why governments may be hesitant
    to combine blockchain and elections. One of the primary concerns is the complexity
    and cost of implementing blockchain systems. Blockchain technology requires specialized
    knowledge and expertise to implement effectively, which can create barriers to
    entry for governments and electoral officials. Additionally, the cost of implementing
    blockchain systems can be prohibitive, particularly for developing countries or
    those with limited resources. This can make it challenging to ensure that all
    citizens have access to secure and reliable electoral systems.


    Another concern with combining blockchain and elections is the potential for technical
    issues and vulnerabilities. While blockchain technology is generally secure, it
    is not immune to hacking or other forms of cyber-attack. This can create the potential
    for external interference in the electoral process, which can undermine the legitimacy
    of election results and weaken public trust in the democratic process. Additionally,
    the anonymity of blockchain transactions can make it difficult to ensure that
    only eligible voters are participating in the election, which can create challenges
    for voter identification and fraud prevention. Overall, while blockchain technology
    has many potential benefits, governments must carefully consider the potential
    drawbacks and challenges before implementing blockchain in the electoral process.


    All around the world, elections have been under the threat of cyber-attack on
    their election infrastructure for some time now. In 2017, The International Institute
    for Democracy and Electoral Assistance (International IDEA) hosted a roundtable
    discussion on cybersecurity and elections. Three points were discussed during
    the event. Firstly, it is essential to understand the potential risks and vulnerabilities
    of the electoral process to cyber-attacks, and to develop strategies to mitigate
    these risks. Secondly, there is a need for greater collaboration and coordination
    among government agencies, electoral officials, and other stakeholders to ensure
    effective cybersecurity measures are implemented. Finally, it is crucial to maintain
    public trust and confidence in the electoral process by ensuring that election
    results are secure and transparent, and that citizens have access to accurate
    information about the electoral process and cybersecurity risks. The roundtable
    discussion highlighted the importance of addressing cybersecurity concerns in
    the electoral process to ensure the integrity and legitimacy of democratic elections.


    It is in this environment that governments everywhere turn to the appeal of blockchain
    technology to be used in elections. There have been calls in the United States
    to implement blockchain solutions for elections from a variety of entities across
    the political spectrum.


    For example, in 2018 in Sierra Leone, a Swiss organization named Agora used their
    proprietary private blockchain system to help audit the results of the presidential
    election in Sierra Leone.


    The most successful attempt to use blockchain in elections has to be what the
    company Voatz has been able to do thus far. Voatz is a private company based in
    the United States focused on building a mobile elections platform that utilizes
    a blockchain.


    Not all experts agree that blockchain based voting is a good idea though. A paper
    published in November of 2020 argued that blockchain based voting could result
    in changes to elections without even realizing the changes occurred.


    ## 2.5 Conclusion

