    根据概念验证^(208)


    欧盟委员会通过新的拟议反洗钱/反恐怖融资条例，^(209)


    在表 7.1 中，我们总结了上述讨论的 CBDC 设计中不同匿名性层级的优缺点。表 7.1


    CBDC 设计中不同匿名性层级的优缺点


    | | 完全匿名 | 部分匿名 | 无匿名 |

    | --- | --- | --- | --- |

    | 优点 | 除形式外外，CBDC 将将像现金一样。人们将更容易接受它，因为他们对使用现金的感知没有变化，他们将继续像以前一样进行现金支付。根据 Kahn
    等人 (2005) 和 Mc Andrews (2017) 的观点，收款方和支付方可能更支持这一选项，因为他们可能想减少身份盗取的风险、交易对手跟他们回家并进行攻击的可能性，或者像定向广告和推销（垃圾信息）等无害的烦扰。人们越快接受新的数字货币，其实现和成功分发就越容易。
    | 部分匿名允许较低金额的/或在特定时间内进行有限次数的匿名交易。而对于高价值交易或超过特定阈值的交易，他们必须进行身份识别。这一选项允许人们以安全的方式进行高价值交易，同时为低价值支付的执行提供灵活性。
    | 确保金融交易的完整性。确保资金丢失或被盗时的全额覆盖或保护。 |

    | 缺点 | 增加了洗钱/融资的风险，因为它可能被用于犯罪活动；资金丢失时没有安全和保护，因为持有者无法证明资金属于自己。这对于依赖现金且金融包容率低的经济体来说尤为不利。对货币的信任可能会受到质疑。
    | 需要机构密切合作和协调，以确保充分遵守既定的匿名限额。^(210) | 人和交易将不断被追踪和识别。因此，个人在交易中的隐私受到监控。这可能为政府的监控和审查提供机会（例如法治薄弱、机构无能且政治问责较少的国家）。^(211)
    无法保证客户数据不会因政治原因被误用或遭受网络攻击。由于反洗钱目的需要央行进行密切监控，而这是它过去未参与过的活动，因此也可能产生声誉风险。 |


    *来源* 作者


    ## 技术方案


    虽然技术发展的飞速可能是一个积极因素，但这并不能帮助央行在设计 CBDC 的决策过程中。通常情况下，央行在中心化账本系统中运行，而 DLT 解决方案（其中区块链无疑是最广为人知的）带来了一种新的技术选择。由于
    DLT 仍处于发展阶段，它在处理能力和适用性方面带来了许多不确定性。尽管如此，央行之间并没有拥采用 DLT 作为发行 CBDC 的主要技术的通用方法。


    处于 CBDC 测试或试点高级阶段的央行正在评估 DLT 应用与中心化账本的对比，以识别限制和局限性。中国人民银行（`PBC`）已经在试点中测试了 DLT，认定其处理交易的能力有限，特别是在交易量巨大的日子。因此，`PBC`
    承诺采用`混合架构`，这意味着 DLT 将在有限区域使用，同时也允许其他技术出现在其核心中心化账本上。乌拉圭中央银行在电子比索的第二次试点中也可以遵循类似的方法。第一次试点并非基于
    DLT。


    巴哈马中央银行（CBOB）——全球首个发行 CBDC（沙哈元）的中央银行，以及尼日利亚中央银行的 CBDC（电子纳拉）——都在部署 DLT.^(213)


