    One possible solution to this problem is to gather public financial aid by crowdfunding
    projects based on blockchain. Donors would receive tokens from their operations,
    as compensation (i.e., discount on products) or, in other cases, securities issued
    by the company.


    Crowdfunding is a fundraising method where many people financially contribute
    small amounts to a project via the internet and receive rewards from the project.


    Nonetheless, in a TJ situation where a TC needs funds to carry out its work properly,
    initiatives such as crowdfunding are a viable option. Due to the elimination of
    the mediator party in blockchain systems, the funds invested would go directly
    to the truth commission’s funds. A crowdfunding initiative would also allow broader
    participation by the global community since anyone with an internet connection
    and sufficient resources to make a minimal contribution could donate. In a blockchain
    system, cryptocurrencies could also be incorporated to provide another donation
    payment system. In return for a donation, the TC could issue a utility token which
    would, say, give the donor access to documents from the commission that are not
    yet available to the public, or some other incentive.


    Another problem caused by a lack of resources is the restricted outreach capacity
    of TCs that would otherwise enable public participation in truth processes. TCs
    have an important social role, and social involvement is essential to their work
    and legitimacy.


    One other challenge faced by TCs is managing data issues, especially with regard
    to the gathering, analyzing and cataloging of each piece of information. It can
    present enormous problems, especially nowadays, when new technologies, such as
    smartphones with video or audio recording capabilities, and social media, can
    generate and disseminate a fantastic amount of data very rapidly.


    For both issues, it is important to state that, in a blockchain system, the transfer
    of information is extremely fast and, with the use of a smartphone in places with
    an internet connection, lots of different data points can be collected and audited
    and be immediately accessed by users.


    In a public blockchain system, all the information exchanged can be accessed by
    anyone with an internet connection and a smartphone, which improves the system’s
    transparency and outreach. Also, the network can be permissioned, meaning that
    users must ask for permission to trade and insert information into the platform.
    So, the system controller (that could be the TC itself or another controller)
    can allow only specific users to interact with the network. It can provide another
    layer of legitimacy, as well as better control of the information gathered.


    In that sense, as the information in the network is confirmed, the nodes (users)
    could stamp it as valid information. The logic here is similar to a supply chain
    process, but with pieces of data instead of products. So, as the data flows through
    the different validation processes, it becomes more legitimate, and since the
    entire process is publicly available, it is also transparent for civil society.
    Therefore, cases of misinformation and excessive useless data are controlled and
    minimized.


    ### 3.3.2 Prosecution


    Prosecution of perpetrators, also known as retributive justice, is the most traditional
    way to bring those responsible for crimes to account.


    Nowadays, the State has the primary jurisdiction to conduct the prosecutions,
    with the assistance of TJ programs, enhancing and reinforcing judicial capabilities.


    The ICC has suffered criticisms, though, due to its undermining role as a human
    security agent for the local populations and Its own *in locus* personnel, and
    as a complementary organism in retributive and distributive justice, intended
    to assist the other TJ mechanism and national courts with expertise and infrastructure.


    Still, there are also procedural challenges that may arise in prosecuting processes,
    such as securing pieces of evidence, identification of perpetrators, the protection
    of victims and witnesses, international cooperation between States and the ICC,
    preservation of evidence and sharing of information.


    Blockchain technology can provide a data share network for specific markets, where
    all information can be accessed and transacted by all nodes. In a public permissioned
    system, transactions have an additional degree of trust.


    In that sense, issues of securing and sharing information are solved, and, with
    only specific nodes being able to insert data, information exchanged is controlled
    by only those entities involved in the prosecution process. Notwithstanding, all
    data is stored in the network, meaning that no central authority has absolute
    custody of what is transacted, thereby adding another layer of protection to the
    system.


    The use of blockchain to gather information on victims and witnesses could be
    of crucial help since organizations with authorization to add blocks in the system
    could go directly to meet these people to take their statements, with anonymity
    granted by the network. In other words, such actions could introduce another layer
    of protection to victims, witnesses, and the local team responsible for collecting
    such statements.


    Blockchain technology could also help the ICC to monitor and assist local personnel
    and national courts with the exchange of information. Having the ICC as one node
    in a blockchain system would facilitate the international transfer of data between
    different national and international groups and promote faster responses to local
    situations. For example, the collection of a statement of a victim *in locus*
    would allow immediate access to this data by the ICC, permitting accuracy and
    agility in the decision-making processes of the ICC as well as those of the authorities
    and civil organizations to which the Court has access. A pre-established international
    blockchain network, with international organizations, such as the UN and the ICC,
    as nodes and other international actors, such as NGOs, could be a solution for
    faster response times. The network owner could allow the participation of other
    members for a specific situation, and then remove them later on.


    In addition to the above, and as a solution proposed by TCs, the ICC could initiate
    a crowdfunding project based in blockchain, allowing financial support from any
    sponsor, and establish the possibility for funding via cryptocurrencies as well.
    The use of cryptocurrencies could have a positive impact since their use could
    simplify the funding processes and make it cheaper. The ICC could use such funding
    support to promote its actions as a complementary organization, as discussed,
    and also financially support local organizations, such as hybrid courts, TC projects
    and reparations programs via the Trust Fund for Victims (TFV). Therefore, the
    ICC could enhance its complementary function as a body pursuing all types of justice
    and as a human security agent.


    As demonstrated, the use of blockchain technology for prosecution purposes in
    a TJ situation is similar to its use in TC situations, since it intends to improve
    the efficiency of operational aspects, such as the exchange of information between
    several actors.


    ### 3.3.3 Restoring Democratic Institutions


    After periods of violence, usually caused by the State, there is distrust regarding
    the State and its institutions, especially as regards the preservation of rights.
    Inn such contexts, certain State institutions could symbolize the State regime
    and, therefore, should be dismantled or changed to regain public trust.


    According to the UN Guidance Note to TJ,

