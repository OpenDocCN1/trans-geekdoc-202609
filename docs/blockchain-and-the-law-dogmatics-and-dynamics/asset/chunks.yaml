    156.  Rule 47(1) of the Uniform Rules provides that: “47(1) A party entitled and
    desiring to demand security for costs from another shall, as soon as practicable
    after the commencement of proceedings, deliver a notice setting forth the grounds
    upon which such security is claimed, and the amount demanded.”[↩](#fnref156)


    157.  Erasmus: Superior Court Practice RS 16, 2021, D1-648.[↩](#fnref157)


    158.  Available at: [https://​ec.​europa.​eu/​info/​publications/​200924-digital-finance-proposals\_​en](https://ec.europa.eu/info/publications/200924-digital-finance-proposals_en).
    Accessed 3 May 2023.[↩](#fnref158)


    159.  See in this respect, among others, Maia and Santos [2022](#540017_1_En_6_Chapter.xhtml#CR11);
    Zetzsche et al. [2020a](#540017_1_En_6_Chapter.xhtml#CR22).[↩](#fnref159)


    160.  Convergently, Zetzsche and Woxholth [2021](#540017_1_En_6_Chapter.xhtml#CR21),
    p 4.[↩](#fnref160)


    161.  Specific authorizations and exemptions should be of a temporary nature,
    for a maximum period of six years from the date the specific authorization is
    granted and should only be valid for the duration of the DLT Pilot Regime—Articles
    8(11) and 9 (11) of the DLT Pilot Regime.[↩](#fnref161)


    162.  DLT financial instruments can also be said to be crypto-assets that qualify
    as financial instruments, as the MiCA defines “crypto-asset” as a digital representation
    of value or rights that can be transferred and stored electronically using distributed
    ledger technology or similar technology. The DLT Pilot Regime also took the opportunity
    to clarify that financial instruments issued using distributed ledger technology
    fall within the definition of “financial instrument” in Directive 2014/65/EU by
    including an amendment to Article 4.[↩](#fnref162)


    163.  The system of holding indirectly through a financial intermediary presents
    obvious problems related to the multiplicity of intermediaries involved, *vd*.
    Correia [2017](#540017_1_En_6_Chapter.xhtml#CR1), p 72.[↩](#fnref163)


    164.  “Electronic money token” is a category of crypto-assets established in MiCA,
    defined as a type of crypto-asset the main purpose of which is to be used as a
    means of exchange and that purports to maintain a stable value by referring to
    the value of a fiat currency that is legal tender.[↩](#fnref164)


    165.  *Vd*. Zetzsche and Woxholth [2021](#540017_1_En_6_Chapter.xhtml#CR21), p
    14.[↩](#fnref165)'
