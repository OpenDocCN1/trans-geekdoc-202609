- fmt: "\n- **Taxable**: New bitcoins received automatically by the miner from the\
    \ Bitcoin system every time that a verification service is supplied could possibly\
    \ be seen as constituting a consideration for a taxable service.\n- Despite the\
    \ fact that Bitcoin transactions carried out for free are in theory possible,\
    \ in practice Bitcoin users pay fees (used as a default by most digital wallets);\
    \ and it seems almost impossible to imagine users would be willing to wait days\
    \ or weeks before a transaction is verified (which could be the case if no fee\
    \ is paid).\n- **Exempt**: Mining activities could be seen as exempt pursuant\
    \ to `Article 135(1)(e)` of the VAT Directive, on the grounds of them being services\
    \ directly concerning currency.\n- **Exempt**: Mining activities could be treated\
    \ as exempt pursuant to `Article 135(1)(d)` of the VAT Directive on the basis\
    \ of them fulfilling in effect the specific, essential functions of an exempt\
    \ supply (the transfer of bitcoins itself).\n\n*Source* Value Added Tax Committee—European\
    \ Commission 2016\n\nLastly, one should note that precisely because the ECJ’s\
    \ decision does not cover mining, and as `Table [4.3](#540017_1_En_4_Chapter.xhtml#Tab3)`\
    \ below exemplifies, there is still no VAT neutrality in the EU: Table 4.3 \n\n\
    ### Mining VAT Treatment in Some EU Member States\n\n| State | Taxation |\n| :---\
    \ | :--- |\n| France | Revenue received from cryptocurrency mining activities\
    \ is subject to VAT as a supply of services. |\n| Germany | Revenue received from\
    \ cryptocurrency mining activities is generally outside the scope of VAT. |\n\
    | Spain | Revenue received from cryptocurrency mining activities is generally\
    \ outside the scope of VAT. |\n| Sweden | Revenue received from crypto mining\
    \ activities is generally outside the scope of VAT. |\n\n*Source* The author^([^(117)](#fn117))\n\
    \n## 4.6 Conclusions\n\nIn the crypto-assets context, one should note the importance\
    \ of the principle of tax legality because if the facts do not fulfil the provision\
    \ of a statutory tax law, there is no taxable event (so the taxpayer should not\
    \ be subject to tax). The principle of legal certainty is also relevant, especially\
    \ in new and complex areas. Binding rulings by the Portuguese `TA` are an important\
    \ available instrument to any taxpayer since they clarify the interpretation of\
    \ tax law. They are publicly known, which brings greater legal certainty to taxpayers,\
    \ through the predictability of the `TA`’s behavior. However, the `TA` is only\
    \ bound on those facts and to the taxpayer who submitted the request.\n\nA taxable\
    \ person under the `CIT Code` may obtain several sorts of income with crypto-assets\
    \ and all of them contribute for its taxable profit since those activities are\
    \ economic operations of a business nature and then perfectly covered by the `CIT\
    \ Code`, namely its `article 3`. As the `OCC` noted, the accounting income should\
    \ consider the accounting standards, namely the `IFRIC` updates.\n\nIn the case\
    \ of natural persons, income from crypto-assets is taxed under the `PIT Code`\
    \ only if we can fit it into one of the six schedules of income. The `TA` concluded\
    \ that income resultant from the sale of cryptocurrencies is not capital gains\
    \ because they are not securities. Still, one may question whether some crypto-assets\
    \ are actually atypical securities under `article 1(g)` of the `Securities Code`.\
    \ `TA`’s interpretation gives more legal certainty because there is no need of\
    \ casuistic analysis. Still, in light of the `CMVM` communication and considering\
    \ that the wording used by the `TA` was “at this time”, it is not impossible that\
    \ the `TA` changes its position. However, there is no indication that it is going\
    \ to happen. Instead, the `TA` concluded that the sale of crypto-currency is not\
    \ taxable under the Portuguese tax system unless by its regularity it constitutes\
    \ a professional or business activity of the taxpayer, in which case it will be\
    \ taxed as business or professional income. Additionally, considering that the\
    \ income of any schedule can be paid in cash or in kind, if a `PIT` income is\
    \ paid with crypto-assets, we should apply `article 24` of the same Code, which\
    \ provides successive rules for cash equivalence for income in kind.\n\nLastly,\
    \ in the `Hedqvist` case, `ECJ` concluded the sale of bitcoins was a supply of\
    \ services VAT exempt by `article 135(1)(e)` of the VAT Directive, although they\
    \ are not money since virtual and traditional currency should have the same treatment\
    \ for the purposes of that exemption. Following this case, the Portuguese `TA`\
    \ considered that the sale of cryptocurrencies was also exempted VAT under `Article\
    \ 9(27)(d)` of the `VAT Code`. Finally, also based in the same case, the Portuguese\
    \ `TA` concluded that mining would benefit from the same exemption.\n\n## 4.7\
    \ Afterword^([^(118)](#fn118))\n\nSince the last revision of the chapter, several\
    \ relevant developments occurred that we believe important to be. The first is\
    \ the significant impact that the **Portuguese Budget State Law for 2023**^([^(119)](#fn119))\n\
    \nIn this line, `PIT Code` has now a definition of crypto-assets: “any digital\
    \ representation of value or rights that may be transferred or stored electronically\
    \ using distributed ledger or similar technology”. This concept does not include\
    \ unique crypto-assets that are not fungible, i.e., NFTs^([^(120)](#fn120))\n\n\
    Another relevant amendment to `PIT Code` is the new regime in case of sale of\
    \ cryptocurrencies and other crypto-assets: `article 10(1)(k)` now qualifies the\
    \ onerous transfer of crypto-assets (that are not securities)^([^(121)](#fn121))\n\
    \nAs for other types of income, it is relevant to note the simplified regime of\
    \ **schedule B (business and professional income)**: in `article 4(1)(o)` of `PIT\
    \ Code`, there is now an express qualification as commercial and industrial activity\
    \ of operations related to crypto-assets, including mining, and with the validation\
    \ of crypto-asset transactions through mechanisms of consensus. Furthermore, within\
    \ the scope of simplified taxation regime^([^(122)](#fn122))\n\nIt should also\
    \ be noted that now `article 5(2)(u)` of `PIT Code`, qualifies as capital income\
    \ (schedule E) any forms of remuneration resulting from operations related to\
    \ crypto-assets (subject to a rate of 28%, with an option for taxation at general\
    \ tax rates). This income is exempt from withholding at source (regardless of\
    \ the form it takes—that is, even when paid in fiat) and, when it is paid in the\
    \ form of crypto-assets, it is taxed under category G (capital gains) in accordance\
    \ with `article 5(11)`, in which case the above rules apply.\n\nAs for Corporate\
    \ Income Tax, what was written in chapter III remains unchanged. However, in `CIT`\
    \ there is also a simplified regime, that now provides for the inclusion of income\
    \ related to crypto-assets in determining the taxable amount, applying the coefficients\
    \ `0.95` in the case of income from mining crypto-assets and `0.15` in the case\
    \ of other income related to crypto-assets (`article 86.-B (1)(b)` and (e) of\
    \ `CIT Code`). As for the Value Added Tax (VAT), what was said in Chapter V has\
    \ not changed^([^(123)](#fn123))\n\nA novelty is the express provision that in\
    \ the case of acquisition of real estate with crypto-assets, i.e., exchange between\
    \ real estate and crypto-assets, for the purpose of determining the taxable basis\
    \ of Municipal Tax on Onerous Transfers of Real Estate (IMT),^([^(124)](#fn124))\n\
    \nAnother important legislative novelty is in terms of Stamp Tax^([^(125)](#fn125))\n"
