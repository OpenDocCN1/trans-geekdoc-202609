    # 1. Blockchain and the Law: Setting the Floor


    Martinho Lucas Pires (1) Católica Law School, Palma de Cima, 1649-023 Lisbon,
    Portugal. Martinho Lucas Pires Email: `martinholucaspires@ucp.pt`


    ## 1.1 Introduction

    ## 1.2 The Legal “Phenomenon”

    ## 1.3 The Blockchain “Phenomenon”

    ## 1.4 The Law in Blockchain

    ## 1.5 The Law for Blockchain

    ## 1.6 Conclusions


    ## Abstract

    Blockchain and the law has over the past years become a field in which a multitude
    of developments have taken place, and the tendency is for that progress to continue.
    However, due to the seemingly never-ending stream of publications and ongoing
    developments in the blockchain and crypto markets, the essence of the topic—concerning
    the legal effects and consequences of the growing adoption of blockchain based-technologies
    and their applications such as crypto and smart contracts—risks becoming a little
    lost. This chapter discusses the problem of blockchain and the law at its most
    basic and fundamental levels, and in so doing considers the essential traits of
    blockchain and the essential traits of law, looking into how both are related,
    and how new developments should be deployed, in a way that is faithful to the
    technology’s promise and capacity, and to the law’s function as the main tool
    for social order.


    Keywords: Blockchain Law Regulation Crypto Smart contracts End Abstract


    ## 1.1 Introduction

    In the first quarter of 2021, Bitcoin, Ethereum, and almost every other crypto
    asset posted new all-time prices in what was seen as the beginning of a new bull
    market. Enthusiasts lauded the price rise and attributed it to the growing adoption
    of crypto and blockchain protocols by corporations and investors alike from the
    whole economic spectrum: corporations like `Tesla` and `Micro Strategy`, traditional
    legacy players such as `banks`, and even States such as `Ethiopia`. Roughly four
    years after the last bull market and the end of the “hype cycle” of blockchain,
    2021 seemed poised to be the year when the technology would start to succeed.
    According to proponents, its success would herald a new era of digitalization
    of transfers of value.


    Ironically, another crypto-related phenomenon peaked during those difficult years
    of the bear market (roughly between the beginning of 2018 and the end of 2020,
    if one is to draw the correct historical lines). The rise of the crypto-economy
    led to a lively and intense strand of publishing and research on all things crypto
    and blockchain. Legal academia was no exception. There were countless articles
    and books, thesis (master’s and Ph.D. level), reports, and working papers published
    on the matter.


    It is typical for lawyers and law researchers to hop in the wagon of technological
    developments whenever something seems sufficiently innovative to bring profound
    changes to how people interact. However, no one could have predicted the quick
    and intense growth of the area of the studies of blockchain and the law. Legal
    scholars received blockchain enthusiastically, launching themselves in adopting
    and researching this new technology and new form of economy, organization, and
    community-building. Blockchain and distributed ledger technologies seemed to herald
    a new era of social disruption based on solid and provocative concepts such as
    decentralization, `smart contracts`, and digital money. Despite adoption being
    slow, the promise of blockchain to digitalize value and its allure was so appellative
    that two of the most prominent authors of the movement decided to coin a term
    to describe the new form of law that would deal with the developments of blockchain
    technology – developments that, according to said authors, “traditional” law could
    not answer. `Lex cryptographica` was to be the new, “revolutionary” law that would
    deal with `automated contracts` (whatever those were), autonomous organizations
    (idem), and the emergent token economy.


    Being part of the “movement” of blockchain and the law by researching, counselling,
    organizing courses, teaching courses, participating in conferences, and publishing
    on the topic, I must confess, almost four years since the start, that the enthusiasm
    about blockchain and the law always looked, in a way, a bit overhyped. Call me
    a realist (I accept it gladly) or a conservative (less so). However, it always
    seemed that arguments supporting the exceptionality of blockchain as a social
    phenomenon and its “revolutionary” character went beyond reason and more into
    the realm of philosophical speculation. It is true that the blockchain phenomenon,
    despite its complexities, poses challenges to the operation of law.


    Nevertheless, the law is also a rich and complex reality, composed of rules and
    their implementation, values, and social perception, of its politics. The terms
    and principles governing legal relations, their method, and dogmatic are as old
    as humanity’s existence. The law is, in this regard, the greatest legacy institution
    there is. That is why I argue that the legal challenges of blockchain technology
    are not completely “revolutionary” nor “innovative” per se, from a legal, dogmatic
    perspective, and most of them can be resumed and solved in terms of `contract`
    and `liability`. The other cases must be tackled through innovative solutions
    that respect the purpose and structure of the technology and the good developments
    it brings. Another question concerns the capacity of State-made law and national
    authorities to enforce this market’s regulation effectively. However, that is
    another issue, one not of law but of administrative action and adjudication.


    The present introductory chapter develops this argument, in an attempt to, in
    2022, when the boom almost went bust, frame the basic structural features of the
    connection between the phenomena of blockchain and the law, the tensions they
    raise, and to assess them from a critical point of view. Call it an attempt to
    draw a framework for understanding the basics of what is at stake within the problem
    of blockchain and the law.


    For this purpose, I divide the contribution into four sections. The first section
    concerns a discussion of law and its phenomenon, explaining what law is essentially
    about and how is represented and expressed from a practical and realist perspective.
    The second section discusses the blockchain phenomenon, its many dimensions, contradictions,
    and innovations. The third section looks at the supposedly disruptive effect of
    innovations brought by `DLTs` and assesses them from the more structural perspective
    of law—in other words, it looks at the law existent in the blockchain phenomenon.
    The fourth section considers what legal changes the blockchain market could and
    should accommodate; changes that would bring more conceptual and practical precision.

