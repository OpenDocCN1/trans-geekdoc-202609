    针对这一主张，其他学者认为有必要“提醒合同法的基本原则”，并承认智能合约对合同或整个法律体系的“潜在影响有限”。^(²⁴⁴)


    智能合约也凸显了紧张关系，并具有改变公共领域与私有领域边界的潜力。它们实现了个人之间新颖经济交换形式，这可能挑战现有的交易形式，并测试既有的公有与私有领域划分。Karlstrøm
    表示，在区块链代码的约束下，这种不受限制的交易自由实际上可能会产生相反的、削权的效应，使商业关系变得“僵化、不可逆转且不可谈判”。区块链等技术可能导致社会关系变得“日益僵化，并牺牲活活性以及随之而来的自由感和责任感为代价”。^(²⁴⁵)


    # 8.5 精选智能合约立法


    ## 8.5.1 美国


    尽管人们对智能合约的兴趣和认可日益增加，但只有少数国家对智能合约制定了监管应对措施。在美国，各州对智能合约的立法倡议相对狭窄，仅涵盖选定的问题，大多局限于定义智能合约以及对其电子形式和签名的认可。截至
    2019 年 4 月，美国各州已审考虑了 133 项与区块链技术相关的法律。然而，只有 7 项与智能合约有关，且其中极少数已成功通过.^(²⁴⁶)


    亚利桑那州是美国智能合约立法的先驱.^(²⁴⁷)


    少数几个州被认为更具进步性，并以更全面的方式处理智能合约。例如，内华达州通过了一项法案（Bill 398）(²⁴⁸)


    最后，BTA 禁止地方政府对区块链或智能合约的使用实施任何限制或要求，包括税收、费用或认证要求。`BTA` 为智能合约的使用提供了高程度的法律清晰度，并明确了其法律地位和效。最后，怀俄米州脱颖而出，其颁布了
    13 部区块链法律，提供了一个旨在促进创新和推动区块链行业的全面法律框架。它具有许多新颖特征，并将智能合约定义为自动化交易或任何实质上类似的类似物，其由代码、脚本或编程语言组成，用于执行协议条款，并可能根据特定条件的发生或不发生对资产进行托管和转移，或为这些操作发布可执行的指令.^(²⁴⁹)


    美国各州的智能合约立法倡议因通过仓促和产生不可预的影响而受到批评.^(²⁵⁰)


    引入多种智能合约的定义并明确赋予其法律地位，也可能导致既有法律原则和现有联邦法规（如《统一电子交易法》）的应用产生不确定性，而该法通常被认为对于电子签名和智能合约已经足够了.^(²⁵¹)


    两个美国联邦监管和监督机构——美国商品期货交易委员会（`CFTC`）和美国证券交易委员会也通过其调查和澄清指导来处理智能合约。`CFTC` 甚至发布了一份关于智能合约的手，阐述了智能合约的益处、风险和法律问题.^(²⁵²)


    ## 8.5.2 欧洲


    世界上第一个通过智能合约法规的国家是白俄罗斯。2017 年 12 月的一项总统令将智能合约定义为旨在在交易区块账本（区块链）或其他分布式信息系统中运行的程序代码，用于自动履行和执行交易，或履行其他具有法律意义的行为。该法令授予了名为“高科技园区”的特区内通过智能合约进行交易履行和执行的权利。俄罗斯立法者在
    2019 年通过修订《俄罗斯民法典》，将数字资产引入俄罗斯民法体系，纳入数字权利和智能合约的概念。智能合约被认可为合同履行的手段，而非特殊类型的合同，因此它们现在可以合法地应用于俄罗斯的任何类型的交易.^(²⁵³)


    意大利是第一个以通用方式监管分布式账本技术和智能合约的国家，不参考任何特定行业或应用.^(²⁵⁴)


    在欧盟层面，关于智能合约合法性及其在跨境情况下的执行力的不确定性也得到了认可，法律事务委员会的草案报告强调，即将出台的数字服务法》提供了一个评估智能合约被视为法律有效所需的要求的机会。委员会要求欧盟委员会评估智能合约在跨境情况下的合法性和执行力，并为适当的法律框架提出建议。报告强烈建议智能合约应包含可以停止执行的机制，以保护弱势方，并确保债权人在破产和重组中的权利得到尊重.^(²⁵⁵)


    ## 8.5.3 英国


    `UKJT` 在 2019 年 12 月发布了一份关于英格兰和威尔士法律下加密资产和智能合约状态的声明.^(²⁵⁶)


    # 8.6 结论


    智能合约产生了巨大的兴趣，具有巨大的潜力，并提供了主要的利益。行业、法律界最近一些监管机构和立法者也认可了智能合约的潜力。`UKJT` “从法律角度来看，加密资产和智能合约无疑代表了未来”，^(²⁵⁷)


    智能合约并非统一的。它们从简单、直接、标准化的支付指令到能够自主执行一系列复杂动作的复杂工具不等。随着智能合约的使用增加，需要更多的法律澄清、立法认可和监管指导。技术与法律的交叉提出了挑战，尽管监管智能合约是一项“异常艰巨的任务”，^(²⁵⁸)


    智能合约的某些方面挑战了法律界，但不太可能破坏既有的法律体系，原则上讲，智能合约的使用似乎没有重大障碍，也不需要剧烈的法律改革来接纳它们。到目前为止，立法者的反应有限，倾向于解决智能合约的基本定义、法律认可和证据效力问题。智能合约应留在立法者的议程中，立法者应该充分考虑这一技术发展并密切监测，介入提供法律清晰度，支持创新并降低风险。


