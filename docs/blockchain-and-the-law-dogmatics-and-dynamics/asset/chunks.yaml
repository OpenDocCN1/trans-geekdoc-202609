    - **Agents**: The collateral providers and the stablecoin users.

    - **Governance**: The functions and parameters that govern the protocol.

    - **Issuance**: A mechanism to control the issuance of stablecoins.

    - **Oracles**: A mechanism to import external data onto the blockchain, such as
    price feeds.

    - **Lending and Borrowing Markets**: These protocols aim to provide lending and
    borrowing services to anyone who collateralizes their crypto-assets and uses them
    to obtain loans. Lenders can also earn a yield on their assets by contributing
    to lending pools and earning interest in such assets.


    Due to the nature of DeFi and blockchain, where borrowers are pseudo-anonymous,
    there are no mechanisms to identify the agent, access his credit score and ability
    to repay the loan, and enforce any legal proceedings against a default. To prevent
    borrowers from defaulting on their debt obligation and creating a credit risk
    for the loaners, borrowers must collateralize their position to cover the debt
    value. Due to the historical volatility and illiquidity of the various crypto-assets,
    an over-collateralization is required. If the underlying asset''s market price
    crashes, it will not affect the lending market funds since sufficient collateral
    would cover the borrower''s debt value. The debt is usually issued against USD
    or stablecoins representing USD.


    The borrower must ensure that the collateral value is always above a pre-determined
    liquidation threshold set by the protocol, or the "liquidators" can purchase the
    locked collateral at a discount and close the borrower''s debt position.


    ### IX.

    #### **Exchanges (DEXs)**: DEXs “were born from the desire to address the vulnerabilities
    of centralized platforms”.


    ### X.

    #### **Order Book DEX**: maintaining the state of an order book is a computationally
    expensive task, and, given the design of trustless and public distributed ledger
    technologies, it is not feasible to host it on-chain. Consequently, a user wanting
    to execute an order will sign a transaction allowing the DEX to execute the trade
    on his behalf when certain conditions are met. Orders are matched manually or
    algorithmically; however, this will always involve a degree of trust in off-chain
    mechanisms.


    ### XI.

    #### **Automated Market Maker (AMM)**: AMM is a decentralized protocol that relies
    on a mathematical formula to price assets. The AMM does not require an order book
    since the assets are priced according to a pricing algorithm. The liquidity to
    create the market is provided by the liquidity providers.


    The liquidity providers provide funds to a liquidity pool, where reserves for
    two or more assets are locked into a smart contract. Each liquidity provider receives
    newly minted liquidity tokens representing their share of a pool''s liquidity.
    A trade may occur when a user deposits an asset, thus providing more liquidity
    for that particular asset, and withdraws the reserves of one or more other tokens
    deposited in the pool. As the reserve ratios for a pool''s assets change as liquidity
    is withdrawn and added, a liquidity provider may receive a different token ratio
    upon his liquidity share than the ratio he initially deposited. This risk is known
    as impermanent loss.


    ### XII.

    #### **Derivatives**: Derivatives are contracts that derive their value from the
    performance of an underlying asset, event, or outcome. Without an underlying to
    derive its value from, derivatives per se are valueless.


    Since the development of derivatives contracts to help reduce the risk for farmers,
    the uses and types of derivatives contracts and the derivatives market size have
    increased significantly. Derivatives can be used to manage risks associated with
    the underlying, but they may also increase risk exposure for the other party to
    the contract. Nowadays, derivatives are no longer just used to reduce risk but
    are also part of the investment strategies of many fund managers and retail investors.


    ### XIII.

    #### **Typical Derivatives**: Typical derivatives contracts, where futures and
    options are included, can be defined by having an underlying size and price, an
    expiration date, and a settlement mechanism.


    ### XIV.

    #### **Perpetual Swaps**: These contracts are a mix of future contracts and contracts-for-difference,
    where there is no set expiry date, and the settlement may be satisfied via the
    delivery of the underlying asset. Furthermore, traders may decide to keep their
    position by providing a funding transaction if their position is underfunded.


    ### XV.

    #### **Synthetic Assets**: are collateral-backed tokens whose value fluctuates
    depending on the underlying asset reference index without directly taking a position
    in that asset. Some platforms allow the creation of crypto-backed synthetic assets
    that provide on-chain price exposure to commodities, stocks, indices, or other
    assets.


    ### XVI.

    #### **Portfolio Management**: DeFi protocols allow the automation of on-chain
    assets portfolio management. Crypto-assets are deposited and pooled into smart
    contracts and allocated according to an investment strategy encoded in the smart
    contract or managed by a pool manager. The investment strategy may vary from rebalancing
    the portfolio.


    ### XVII.

    #### **Payments**: Blockchain allows anyone to send value without a trusted intermediary
    or depository; however, a transaction may take some time to be confirmed and irreversible
    in the blockchain. DeFi payment protocols allow for processing instant and high-volume
    micropayments that may remove the risk of delegating custody of the crypto-assets
    to trusted third parties.


    ### XVIII.

    #### **Insurance**: Insurance is a risk management strategy in which an individual
    receives financial protection or reimbursement against losses from an insurance
    company in an unfortunate incident. DeFi insurance protocols are, so far, restricted
    to on-chain risk coverage, where any agent may purchase cover for unintended uses
    of code in any smart contract offered from the list of the insurance protocol.
    When an event similar to “The DAO” hack happens, the agent would be covered from
    any financial losses resulting from such hacking.


    ## 6.4 How Does the DLT Pilot Regime Match with DeFi?


    One of the purposes of the DLT Pilot Regime is to take advantage of the potential
    of DLT, a transformative technology in the financial sector, in reducing intermediaries
    and, subsequently, transaction costs. This purpose is related to multiple benefits,
    such as enhanced efficiency, transparency, and competition in relation to trading
    and settlement activities.


    In this context, many repetitive business processes, namely the input of transaction
    data separately in each layer of the custody chain, together with costly reconciliation,
    can be eliminated.

