  trans: '


    如果双方对争议进行仲裁，情况也并无不同。在仲裁程序中作出的裁决并非自动执行。相反，这取决于《仲裁法》第 `31` 节。


    因此，在我们的示例中，A 方需要向法院提出申请，B 方有权对此提出反对，要求将其有利于其方的裁决转化为法院命令。只有在完成这一步后，A 方才能根据 `Uniform
    Rules 45` 和 `46` 对该裁决（现已封装在法院命令中）进行执行。


    进一步假设，如果 B 方在南非法院的管辖范围之外拥有资产，A 方的处境将更加严峻。为了扣封这些资产，A 方需要在该管辖区寻求对其法院判决或仲裁裁决的认可。如果判决或裁决获得认可，必须遵循该管辖范围内传统的执行手段。相反，如果由于某种原因判决或裁决未获得认可，A
    方在相应管辖区内将没有进一步的救济办法。


    总结之，《统一规则》中规定的传统执行手段并不适用于快速执行判决，这往往使其对诉讼人缺乏吸引力。


    如果确实如此，链上执行能否提供一种替代方案呢？


    ## 5.3 智能合约


    据提议，答案在于运行在区块链协议上的自动执行型“智能合约”。在从实际角度探讨这一提议之前，考虑智能合约的功能机制及其能力是有帮助的。


    智能合约的概念起源于 1994 年尼克·萨萨博（Nick Szabo）发表的《智能合约》论文。


    尽管对智能合约的法律定义尚未达成共识，


    麦金尼（McKinney）等人（McKinney et al）识别了智能合约共同具备的三个特征。


    因此，智能合约并非传统意义上的合同，而是一个计算机程序，在特定条件发生时执行预定义的交易。这方面的例子可能是一个股票购买交易，其中一方以定义价格出售股票，另一方希望购买。智能合约能够匹配卖方的报价与买方的接受，一旦匹配完成，交易将自动执行，即通过将股票转移至买方的经纪账户，并将交易款项记入卖方的经纪账户来完成扣款。


    对于本文的论证而言，智能合约的一个重要特征是它们构建在区块链协议之上。


    在满足合同要求时，智能合约可用于在双方之间分配数字货币。


    智能合约（即其代码的执行）可以根据指定的且受信任的第三方“链外”信息进行触发，这利用了区块链“预言机”（oracles）。预言机是连接区块链与区块链外部系统的实体，使智能合约能够根据现实世界的输入进行执行。


    库卢（Koulu）通过一个天气赌注的实际案例解释了智能合约运作的概念。


    ## 5.4 在南非法律背景下的应用


    将智能合约概念应用于南非法院命令的快速执行问题时，两个主要的用例场景脱颖而出。


    ### 5.4.1 执行


    #### 5.4.1.1 智能合约的实施


    诉讼双方可以利用智能合约，在诉讼结束前通过智能合约的执行将双方约束在判决执行上，从而消除根据 `Uniform Rules 45` 和 `46` 进行执行的需要。


    回到我们的示例，A 方和 B 方可以在争议开始时约定，通过执行智能合约以加密货币的形式支付判决债务。具体何时达成约定取决于情况，但必须在判决做出之前。很可能，如果能达成此类协议，将在诉讼开始（传达传票时）或签署仲裁协议时完成。（如果拖得太晚，认为案件进展对自己不利的一方可能会不情意同意。）


    每方都可以开设一个钱包，并将诉讼所需的加密货币转入其中。随后，双方需要编写或已编写好一个智能合约，该合约根据预言机的通知，如果获得有利于 A 方的判决则向
    A 方支付等额金额；或者如果诉讼被驳回，则向 B 方支付诉讼费用。


    在预言机通知最终结果后，智能合约将执行并实现已发生的场景。如果存在上诉的可能性，智能合约必须在执行前为上诉通知或任何上诉裁决留出空间。


    明确，同意这种行动方案的结果是完全绕过了 `45` 和 `46` 规则规定的法院认可的执行步骤。所提议的内容最终与发布法院命令或仲裁裁决且败诉方自愿履行没有区别。


    主要的区别在于，在使用智能合约执行判决时，这种自愿履行在任何命令发布之前就已经预先在流程之中。


    ### 法律与实务考量


    至关重要的是，双方必须意识到，法院或仲裁庭不会监督智能合约的达成过程，也不会以任何方式参与其形成，原因有三。首先，法院在争议结果出来之前不会干涉执行，除非被专门要求这样做（例如为了签发马雷瓦禁令，*Mareva*
    injunction）。


    ### 5.4.2 块链执行法院命令的实际障碍


    虽然在《统一规则》范围之外执行智能合约的提议在理论上听起来很简单，但存在着许多实际困难。


    首先，该过程在本质上是技术性和新颖的。诉讼人可能需要适应允许代码执行诉讼结果的概念，并信任区块链过程能够恰当地实现结果。他们可能会对必须从零开始编写所需的智能合约感到望而却步（无论是由讼人自己完成还是第三方完成）。有趣的是，似乎截至
    2021 年 2 月，已经有了针对该技术的发展工作，这未来可能允许诉讼人使用具有易用用户界面的标准程序来编写他们的智能合约。


