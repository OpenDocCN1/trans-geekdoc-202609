    The more central banks advance with their CBDC implementation projects, the more
    questions and doubts arise related to legal and regulatory implications. This
    is due to the fact that CBDC is not just a technical project, whose successful
    implementation relies solely on technological issues. Beside the policy and political
    issues which may arise, and which vary from jurisdiction to jurisdiction, a careful
    assessment of legislative aspects should be undertaken. Central banks laws and
    monetary laws are at the forefront in this regard, but other primary legislation
    such as commercial banks laws, tax laws, private laws, payment systems and payment
    services laws, data protection laws, AML/CFT laws etc. could also be subject to
    evaluation and probably revision.^215


    ## 7.5 Difference Between Central Bank Money and Private Money—Legal Mandate


    Making use of the definition mentioned in Introduction above, CBDC represents
    a liability of the central bank. Comparable to cash in circulation or to commercial
    bank accounts with central banks which represent a liability account at the central
    banks’ balance sheet, CBDC will receive similar treatment. These funds are issued
    by the central bank either in a physical (cash in circulation) or digital form
    (CBDC and commercial banks accounts) and as such they fall within the definition
    of central bank money. On the other hand, the funds that customers have deposited
    with commercial banks are private money that belongs to them and as such are registered
    as a liability in the balance sheet of the commercial banks. The creation of central
    banks liabilities is closely linked with the legal mandate of central banks. But
    although central banks have been providing a digital form of cash to commercial
    banks or to the government, they have thus far not provided any to the general
    public. Therefore, the current “cash in circulation” liability account is related
    always to the physical cash in circulation rather than to its digital form. As
    such, relevant central bank laws should clearly authorize,^216


    ## 7.6 Legal Tender


    Many central banks around the world are the sole legally mandated authority to
    issue legal tender currency in their jurisdiction. Some of the applicable laws
    limit the issuance of currency to banknotes and coins only and some others use
    a broader wording without limiting the issuance of currency to banknotes and coins.^217


    What about issuing a digital form of legal tender currency? Technically speaking,
    that could be possible by amending central banks laws and clearly designating
    CBDC as legal tender currency. But this is not just a matter of legal technicality.
    A legal tender physical currency is widely accessible and usable by the entire
    population as a means of payment, which unfortunately could not be the case for
    a digital form. Hence, the designation as legal tender of a digital currency could
    be considered as unfair to disadvantaged social groups such as older people, disabled
    people or people who are digitally or financially excluded,^218


    ## 7.7 El Salvador Case


    To conclude this chapter, and although not entirely related with the topic at
    hand, we present the country case of El Salvador that, in 2021, adopted Bitcoin
    as legal tender. This may be useful and instructive since the Salvadorean case
    presents some aspects that can be relevant for a CBDC implementation: the provision
    of legal tender directly to the public by the central bank and authorities (such
    as in the payment of governmental allowances and benefits), the adjustment by
    the population to “official” digital channels (such as government sponsored wallets),
    and the granting of legal tender status to a non-physical currency.


    ### 7.7.1 Country Context


    El Salvador is a small country^219


    The cost of transferring money from the USA to El Salvador has been decreasing
    over time. According to the World Bank database, in the first quarter of 2021
    the average total cost of sending US$ 200.00 was 2.91% of the amount sent compared
    to 3.13% in the fourth quarter of 2020 and 3.53% in the fourth quarter of 2019.^220


    On the other hand, the financial inclusion level in El Salvador is very low. According
    to the latest Global Findex survey issued in 2021, only 31% of the adult population
    has an account in a financial institution compared to 29% in 2017, hence a slight
    increase in financial account ownership figures. This is much lower compared to
    the global data results, where the share of adults who have an account with a
    financial institution or through a mobile money service rose from 68 to 74% worldwide.
    The main reason cited from the survey respondents (54%) for not having an account
    was that the financial services were too expensive. Although 70% of the remittance
    receivers are women, only 24% of them have an account. Most of the remittance
    household recipients (94%) use the money to cover their daily consumption and
    around 79% can be classified as poor or at risk of falling into poverty.^221


    ### 7.7.2 Bitcoin as Legal Tender


    The president of El Salvador announced in June 2021 that he would send proposed
    legislation to the Congress to make Bitcoin legal tender in the country. Part
    of the announced reasons behind this decision included the opportunity to promote
    the formal economy and enhance financial inclusion as well as the possibility
    to allow Salvadoreans to transfer billions of remittances easier, cheaper, and
    faster.^222


    Despite the IMF and World Bank concerns,^223


    Nevertheless, one year later, data shows that the use of Bitcoin has not been
    embraced by the population as it was initially expected by authorities and crypto
    enthusiasts. The Government claimed in January 2022 that in El Salvador there
    were 4 million users of Bitcoin^224


    Small business owners and individuals list as main issues the volatility of the
    virtual currency which made people lose money, logistical problems due to the
    limited number of available ATMs around the country for cash exchange and technical
    issues not resolved from the Chivo customer service.^225


    Despite all the challenges and setbacks, the El Salvador case is not expected
    to remain isolated. In April 2022, the Central African Republic became the second
    country in the world to adopt bitcoin as legal tender.^226


    Nevertheless, considering the skepticism and concerns coming from international
    bodies, such as the IMF and the World Bank, and the reliance that many countries
    have on these institutions in terms of financial support and assistance, but also
    the risks that Bitcoin and other cryptocurrencies may pose due to their volatility
    and absence of control by the regulators, the decision of implementing Bitcoin
    or other cryptocurrencies as legal tender must be weighed carefully against the
    country priorities and the financial wealth of the population. The current status
    of the crypto-market, in particular following the collapse of `Terra Luna`^227

