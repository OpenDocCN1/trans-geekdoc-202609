    # Blockchain Overview


    Anonymity is another characteristic that ensures security for the users. To access
    a blockchain system and to transact with others, users must have a pair of private-public
    keys, where both keys have identification numbers and are protected with encryption.
    The `private-key` gives the user private access to the system (and contains personal
    information such as login and password), and activates the `public-key`, which
    functions as the user’s identification.


    When dealing with specific situations, other features can be added to a blockchain
    platform. There are other attributes that might be crucial when dealing with TJ,
    such as scenarios, and these have to be considered when designing the architecture
    of a blockchain system for this purpose.


    Smart contracts is a blockchain technology that allows all transactions to occur
    automatically, depending exclusively on the initiatives of both parties to the
    transaction.


    Usually, blockchain systems are publicly available and no permission to participate
    is needed. However, there are other types of blockchain systems that are a better
    fit for TJ requirements.


    When considering TJ, it is worth noting that blockchain technology systems can
    be divided into two groups: public and private networks. The public one is how
    `Bitcoin` blockchain operates, as a publicly available network where anyone can
    see what is transacted. A private network, on the other hand, is not open to the
    public and is constituted by an owner who decides who can have access to the system.


    Also, the system can determine how users interact with the platform. The division
    is between permissionless and permissioned systems. Permissionless systems allow
    any user to be part of the transaction and consensus network, as in the case of
    the `Bitcoin` blockchain, where anyone with enough capabilities can integrate
    and operate within the system. A permissioned network, by contrast, restricts
    participation in the system to only those with permission granted by the owner
    of the network to do so.


    In brief, a blockchain system can be either public or private and be permissionless
    or permissioned. The `Bitcoin` blockchain, for example, is a public, permissionless,
    blockchain system, while a blockchain system that controls the supply chain of
    a private company, say, may be a private and permissioned one that restricts the
    nodes to the company’s members. In other words, a blockchain will have different
    characteristics, depending on its purpose.


    In a TJ system, different combinations of networks can exist. A private and permissioned
    blockchain can be used for digital identification matters, with sensitive information
    secure in a database controlled by one entity. A public and permissionless blockchain,
    like `Bitcoin`’s, can also exist for a funding and donations platform to support
    the TJ pillars. There are several possibilities, which can be tailored to requirements
    and the local context.


    Using all the tools mentioned above, blockchain has evolved and is now at the
    leading edge of a new technological revolution, creating a trustless but trustworthy
    environment for transactions without the necessity for a central controller party.


    Although initially used for financial transactions, the technology can record
    any type of information, and can be used for various purposes. It is this feature
    that makes blockchain a general-purpose technology.


    ## 3.3 Transitional Justice and the Effectiveness of Using Blockchain


    Transitional justice is broadly discussed in the international community. It has
    also been applied in several situations around the globe, which are the subject
    of extensive literature and case studies.


    The United Nations Secretary-General first published a report in 2004 addressed
    to the UN Security Council regarding aspects of the rule of law and TJ in post-conflict
    situations.


    The UN has refined its understanding of TJ mechanisms, or pillars, via the `Guidance
    Note of the Secretary-General`.


    Although there are several definitions of TJ, most authors follow a similar understanding
    to the one contained in UN reports. In this regard, transitional justice is:


    > the full range of processes and mechanisms associated with a society’s attempt
    to come to terms with a legacy of large-scale past abuses, in order to ensure
    accountability, serve justice and achieve reconciliation.


    > Even though there are different understandings and concepts regarding TJ, its
    pillars and approaches, a broad consensus of scholars understand that there are
    four preliminary pillars of TJ, namely prosecution, truth commissions, institutional
    reform, and reparations.


    > One constant critique in TJ approaches, however, is that they regularly ensure
    restorative and retributive justice, with prosecutions and truth commissions,
    in a Western approach. Such a method undermines the TJ processes, removing the
    protagonism of the local society to the international/Western community, resulting
    in local ownership being lost. TJ approaches also fail to address the root causes
    of the conflict, such as socioeconomic structures and social inequalities.


    > The intention now is to elucidate what the pillars of TJ are, and then propose
    new systems using blockchain technology in each TJ mechanism.


    ### 3.3.1 Truth Commissions


    A Truth Commissions (`TC`) or Truth and Reconciliation Commissions (`TRC`) deals
    with the pursuit of truth in a non-judicial way, which is one of the principal
    elements when dealing with past atrocities. According to “Truth Seeking,” a publication
    by the International Center for Transitional Justice (`ICTJ`),


    `TCs` are usually constituted by an executive decree or by law and take into consideration
    the specific characteristics of each country’s situation.


    Such an essential and decisive organism of TJ has specific characteristics and
    considerations that must be observed to be as effective as possible.


    Truth Commissions can also be Truth and Reconciliation Commissions (`TRC`), which
    also pursue reconciliation. Some specialists understand `TRC` as an organ that
    does not merely seek the truth of past abuses but understands the role of reconciliation
    in such contexts. Reconciliation works adds another layer of challenge, which
    is why some truth commissions have added the notion of reconciliation to their
    name and approach, the most well-known example being the South African `TRC`.


    > Notwithstanding the above, it is also important to mention unofficial truth
    projects (`UTPs`). Such projects resemble `TCs` in that they promote the historical
    reconstruction of past abuses in a specific place and time. However, the main
    difference between official and unofficial truth commissions is that `TCs` have
    the official sanction of the State, whereas `UTPs` do not.


    > However, against a background of limited human and financial resources, significant
    outreach policies and structures for public awareness and participation, information
    gathering may be a challenge in some cases.


    > Truth Commissions may suffer from limited resources due primarily to the State’s
    pressure and influence. In several cases, States are unwilling to engage in uncovering
    the truth, and for that reason, `TCs` may suffer from fewer contributions from
    States.


    > Due to their unofficial status `UTPs` depend on private investment from institutions
    or civil society to survive and, therefore, have an even greater lack of resources
    than their officially backed counterparts, the `TCs`.

