    \ to Article 5 of the DLT Pilot Regime, a CSD aiming to operate a DLT SS may apply\
    \ to national competent authorities, subject to appropriate reasoning, for the\
    \ following exemptions from Regulation (EU) No 909/2014 *(inter alia)*: \n\n*\
    \   Article 2(1), subparagraphs (4), (9) and (28)—definitions of dematerialized\
    \ form, transfer order and securities account;\n\n*   Articles 3, 37 and 38—recording\
    \ in book-entry form, the integrity of the issue and protection of securities;\n\
    \n*   Articles 6 and 7—measures to prevent and address settlement fails;\n\n*\
    \   Article 19–extension and outsourcing of activities and services;\n\n*   Articles\
    \ 33, 34 and 35—requirements for participation, transparency, and communication\
    \ procedures;\n\n*   Articles 39 and 40—settlement finality and cash settlement;\n\
    \n*   Articles 50, 51 and 53—access between CSDs.\n\nWithin the referred rules,\
    \ we highlight two specific exemptions. We start with the exemption to the obligation\
    \ of intermediation through a credit institution or an investment firm, which\
    \ allows retail investors direct access to settlement systems operated by a DLT\
    \ SS. The second exemption relates to cash settlement entities (in central bank\
    \ money) to develop innovative solutions under the DLT Pilot Regime, facilitating\
    \ access to commercial bank money or using «electronic money tokens».^([^(164)](#fn164))\n\
    \nWith regard to operators of DLT TSSs, they can apply for the same exemptions\
    \ available to both operators of DLT MTFs and DLT SSs, provided they comply with\
    \ the conditions attached to the exemptions and any compensatory measures required\
    \ by the competent national authorities—Article 6 of the DLT Pilot Regime. That\
    \ said, we present an operation on a DLT TSS where all the exemptions have been\
    \ granted, as can be seen in Fig. [6.3](#540017_1_En_6_Chapter.xhtml#Fig3) below:\
    \ ![Fig. 6.3 ¶ DLT TSS operation. ¶ Source The authors](images/540017_1_En_6_Chapter/540017_1_En_6_Fig3_HTML.png)\n\
    \nFig. 6.3 ¶ DLT TSS operation. ¶ *Source* The authors\n\nSince natural persons\
    \ can participate directly in the market and settlement system, brokers are not\
    \ required. In addition, the DLT Pilot Regime allows the same entity to manage\
    \ the trading and settlement systems. The combination of exemptions thus allows\
    \ for only one entity to provide services in the market, coming close to what\
    \ is intended by the current players from the market on crypto-assets.\n\nThe\
    \ DLT Pilot Regime also provides for a set of additional requirements for operators\
    \ of DLT market infrastructures, namely: (i) liability in the event of loss of\
    \ funds, guarantees or a DLT financial instrument; (ii) protection measures in\
    \ the event of insolvency; (iii) specific reporting duties; and (iv) operational\
    \ risk management—Article 7 of the DLT Pilot Regime.\n\nThe additional requirements\
    \ are necessary to avoid risks related to distributed ledger technology or how\
    \ the DLT market infrastructure would operate. An operator of a DLT market infrastructure\
    \ is, for example, required to inform members, participants, issuers, and clients\
    \ how it intends to carry out its activities and how the use of distributed ledger\
    \ technology differs from the way services are typically provided by a traditional\
    \ MTF or a CSD operating a securities settlement system."
