    \ \n\n## Abstract\n\nThis chapter analyzes the taxation of crypto-assets in Portugal\
    \ and the approach taken by the local tax authorities on crypto-assets and selected\
    \ related topics. After summarizing some relevant features of the Portuguese tax\
    \ system, the chapter discusses the taxation of profits arising from crypto-assets\
    \ under the Corporate Income Tax, as well as the importance of the accounting\
    \ perspective for such taxation. Subsequently, the chapter delves into the topics\
    \ of Personal Income Tax, namely vis-à-vis the sale of cryptocurrencies, other\
    \ types of income and some practical considerations. Finally, taking the Hedqvist\
    \ case (see Sect. [4.5.2](#540017_1_En_4_Chapter.xhtml#Sec17)) as its departure\
    \ point, the tax authority’s position on Value Added Tax on the sale of cryptocurrencies\
    \ and mining is scrutinized.\n\nKeywords Taxation Principle of tax legality Crypto-assets\
    \ qualification End Abstract \n\n## 4.1 Introduction\n\nCrypto-assets are complex\
    \ phenomena from several perspectives, including from the tax one. This chapter\
    \ explores the Portuguese tax point of view in a non-exhaustive but critical manner,\
    \ assuming that the reader is not familiar with the Portuguese tax system. However,\
    \ it takes from granted that the reader is familiar with the main contextual,\
    \ conceptual and regulatory issues around crypto-assets. Therefore, the chapter\
    \ tries to provide some insights on the typical tax concerns, namely on the Portuguese\
    \ tax authority (“TA”) position.\n\nSection [4.2](#540017_1_En_4_Chapter.xhtml#Sec10)\
    \ provides a brief overview of some relevant features of the Portuguese tax system,\
    \ namely the principle of tax legality, the principle of legal certainty and the\
    \ possibility of any taxpayer to request binding rulings from the TA. This section\
    \ is relevant in portraying the main uncertainties, struggles and the relative\
    \ importance of such binding rulings.\n\nSubsequently, the analysis moves into\
    \ Corporate Income Tax (“CIT”). After a short introduction to this tax, the chapter\
    \ provides a general framework that we consider to be applicable to companies\
    \ and other entities subject to CIT that obtain profits derived from crypto-assets,\
    \ as well as the importance of the accounting standpoint. Curiously, there is\
    \ no known TA position on this regard.\n\nAfterwards, the chapter covers the Personal\
    \ Income Tax (“PIT”), providing a quick outline of this tax as well. However,\
    \ in this case, there’s a known TA position (on the sale of cryptocurrencies)\
    \ which is scrutinized with a critical lens. Then, the chapter discusses other\
    \ types of income and lays down some thoughts on practical difficulties that may\
    \ arise in this regard.\n\nFinally, the last section focuses on Value Added Tax\
    \ (“VAT”), encompassing as well brief introductions to the Portuguese VAT Code\
    \ and to the well-known European Court of Justice (“ECJ”) Hedqvist decision and\
    \ a review on the two TA binding rules on VAT (one on the sale of cryptocurrencies\
    \ and a second on mining).\n\n## 4.2 Overview of Some Relevant Features of the\
    \ Portuguese Tax System\n\n### 4.2.1 The Principle of Tax Legality and Its Importance\
    \ in the Context of Crypto-assets\n\nCrypto-assets are a recent reality. Legal\
    \ systems should be flexible enough to keep up with the current landscape but\
    \ in the case of tax law such systems and flexibility should be circumscribed\
    \ by the principle of legality. In fact, “\\[t\\]*he principles of people’s sovereignty\
    \ and separation of powers themselves require that the legal type of tax is discussed\
    \ and approved by parliaments*”.^([^(86)](#fn86))\n\nThe principle of legality\
    \ not only means that tax rules should be approved by the Parliament^([^(87)](#fn87))\n\
    \nThus, for instance, if one sells a crypto-currency, the resulting income will\
    \ only be taxed if and only when the tax law covers such type of income. But if\
    \ the tax law does not cover one crypto-phenomenon, there is no taxable event.\
    \ To sum up, *nullum tributum sine lege* is very important also in the context\
    \ of crypto-assets.\n\n### 4.2.2 The Principle of Legal Certainty and the Binding\
    \ Rulings\n\nThe principle of legal certainty in tax application (connected with\
    \ the principle of legality),^([^(88)](#fn88))\n\nGiven the difficulties in qualifying\
    \ the new realities underlying crypto-assets, especially if we consider that these\
    \ economic events are not always well understood by decision-makers, this principle\
    \ gains a greater relevance. Consequently, the importance of binding rulings by\
    \ the TA stands out since they clarify the interpretation of tax law.\n\nArticle\
    \ 68 of the GTL allows any taxpayer to request a binding ruling on his or her\
    \ specific tax situation, by stating the relevant facts (as long as they were\
    \ not subject to a tax audit) and usually by providing a proposal of the respective\
    \ legal framework.^([^(89)](#fn89))\n\nAs we will see below, there are already\
    \ some published binding rulings by the TA regarding several situations related\
    \ to cryptocurrencies, which allows economic actors to predict up to a certain\
    \ degree the tax consequences of their acts (insofar as for cases similar to those\
    \ in the binding rulings)."
