    ### About the Editors and Contributors


    #### Francisco Pereira Coutinho

    is Associate Professor at NOVA School of Law in Lisbon, Portugal, where he directs
    the Observatories of Portuguese Legislation and Data Protection Law, as well as
    the Moot Court Program. Specialized in Public International Law and European Constitutional
    Law, his research and teaching interests further encompass comparative constitutional
    law, data protection law, and media law.


    #### Martinho Lucas Pires

    is Teaching Assistant in the Law School of Universidade Católica Portuguesa, in
    Lisbon, Portugal, and of Counsel at DLA Piper. His research interests include
    financial regulation, regulation of crypto and DLTs, Fintech, and constitutional
    theory.


    #### Bernardo Correia Barradas

    is Lawyer and Consultant in the Payment Systems Development Group of the World
    Bank Group, currently based in Aix-en-Provence, France. His research interests
    include new technologies applied to payments, CBDC, financial inclusion, and financial
    market infrastructures.


    #### Contributors

    - **Anjeza Beja**: Prokop Myzegari, Tirana, Albania

    - **Marta Carmo**: Banco BPI, Lisbon, Portugal

    - **Bernardo Correia Barradas**: Aix-en-Provence, France

