- fmt: '

    Blockchain has been uppermost in the news almost uninterruptedly since it entered
    the mainstream with the appearance of several different crypto-assets (This term
    includes cryptocurrencies, virtual assets, virtual currencies, digital assets,
    digital currencies, and similar definitions used worldwide, and encompasses “tokens”
    used or classified as payment tokens, security tokens, utility tokens, and stablecoins,
    among others.) and its availability to the general public. The interest of the
    authorities (in particular during the last half of 2022) has been growing exponentially
    and is leading to a renewed focus on what was, until now, known as the Crypto
    “Wild West” ([https://www.wsj.com/articles/sec-will-police-cryptocurrencies-to-maximum-possible-extent-chair-gary-gensler-says-11628007567](https://www.wsj.com/articles/sec-will-police-cryptocurrencies-to-maximum-possible-extent-chair-gary-gensler-says-11628007567).)
    Further to the legal and regulatory considerations arising from the crypto ecosystem,
    authorities have also been looking into the possibilities that can be harnessed
    from its underlying technologies and concepts, and testing solutions such as those
    related to land registry, social-benefits management, patent protection and digital
    currencies issued by central banks (Central Bank Digital Currencies or `CBDCs`).
    To be noted, however, is that all those activities, although they could use blockchain
    or DLT-based solutions, do not necessarily need to. This includes `CBDC`, which
    can be issued and managed through blockchain-type solutions, traditional methods,
    or a combination thereof. In this chapter we consider the topic of `CBDC`, what
    it is and its implications with a particular emphasis on anonymity—an aspect that
    we believe will be of the utmost importance within the implementation of `CBDC`
    by central banks around the world, in particular when, and if, central banks from
    major and advanced economies move forward with `CBDC` solutions.


    Keywords Blockchain Central Bank Digital currency CBDC Crypto End Abstract


    ## 7.1 Introduction


    `CBDC` is the topic of the day. Central banks’ interest and public interventions
    on `CBDCs` have turned more positive since late 2018, with a rapid increase starting
    in the second half of 2020 and the first quarter of 2021.^([^(199)](#fn199))


    The widely accepted definition is that `CBDC is central bank-issued digital money
    denominated in the national unit of account, and it represents a liability of
    the central bank`. `CBDC` can be “retail” (i.e. for general purpose), or “wholesale”,
    for restricted access by financial institutions. The main prominent difference
    between `CBDC` and cash, is the form. `CBDC` comes in a digital form, unlike cash
    which comes in physical coins and banknotes.


    According to the results of the third Bank for International Settlements (`BIS`)
    survey on central bank digital currency,^([^(200)](#fn200))


    Beside the above, the `BIS` survey also pointed out some implicit motivations
    making central banks consider `CBDC`, such as the preservation of the monetary
    sovereignty of one country’s currency.^([^(201)](#fn201))


    The abovementioned motivations or policy goals were confirmed by a more recent
    study published by the International Monetary Fund (`IMF`).^([^(202)](#fn202))


    Despite the different motivations and potential benefits, `CBDC` implementation
    is associated with several implications which need to be carefully considered
    by central banks. These include the legal implications of `CBDC` implementation
    such as legal tender adoption, as well as cyber risks, data privacy, accounting
    implications and financial stability. On the other hand, technological alternatives,
    still emerging, require careful assessment to appropriately address and fulfil
    the policy goals mentioned above.


    Another relevant aspect related to the design features of `CBDC`, that is still
    largely under discussion among the different authorities, is the anonymity as
    to the ownership of, and transactions in, digital currencies issued by central
    banks. In terms of ownership, currently banknotes are largely anonymous, whilst
    transactions, above a certain limit, on bank or payment accounts can be traced
    due to national `AML/CFT` (anti-money laundering and countering the financing
    of terrorism) requirements.


    But is it legally possible to have a central bank digital currency fully or at
    least, partially anonymous? Or will central banks and other authorities use this
    opportunity to finally fully track money used by corporations and individuals
    and address `AML/CFT` risks? How will the public react to all this? And what about
    the technology? Are central banks more in favor of using centralized technology
    based on centralized ledgers? Or are they favoring the use of decentralized ledger
    technologies, such as blockchain, as a more suitable option for implementing `CBDC`?


    Since the topics above may become a significant issue when it comes to the public’s
    willingness to adopt and use digital currencies, and also when it comes central
    banks’ constraints on issuing `CBDC`, we have decided to analyze in this chapter
    the abovementioned questions, respectively based on the legal framework in the
    European context and based on some central banks’ decisions on the technology
    choices.


    ## 7.2 Anonymity Options and Author’s Survey Results


    In October 2020, seven central banks together with the `BIS` published a report^([^(203)](#fn203))


    *   coexistence with cash and other types of money in a flexible and innovative
    payment system;

    *   any introduction should support wider policy objectives and do no harm to
    monetary and financial stability;

    *   features should promote innovation and efficiency.


    Considering that the main feature of cash is that there is no record of either
    identity or the transactions themselves, it won’t be that easy from a customer’s
    point of view moving into a fully traceable means of payment (aside from other
    features that may, from a technical point of view, be implemented with `CBDC`
    such as limits or restrictions on certain type of payments, reversibility, and
    application of negative interest rates). Nevertheless, full anonymity is not considered
    a plausible option in the abovementioned report. Although addressing `AML/CFT`
    concerns is not listed among the primary motivations from a central bank perspective,
    the latter is expected to comply with these rules when issuing `CBDC` to the public.


    According to a paper issued by Bech and Garratt ([2017](#540017_1_En_Chapter.xhtml#CR2))^([^(204)](#fn204))


    The Bank of England (`BoE`) in its Discussion Paper published in 2020^([^(205)](#fn205))


    ### 7.1 But How Much Do Consumers Value Anonymity in Payments and in CBDC if Issued
    by a Central Bank for General Use?


    For the purposes of this chapter, we undertook a survey where 104 people participated.
    Our target group was mostly people who had either a solid theoretical knowledge
    or a basic one about `CBDC`, including central bankers/regulators (40%), private
    payment service providers (14%), development/international organizations (11%),
    lawyers/consultancy (13%), and academia (10%). The participants are from four
    continents, with a slight majority coming from Europe (55%). Three main questions
    were addressed to the participants, which are further detailed below.


    To the question on “*how much do you value anonymity to protect your privacy when
    making payment transactions online*”, most of the respondents (77%) answered that
    they do not value it that much since they generally trust the regulated and supervised
    payment service providers, although, they mostly prefer credit institutions’ online
    payment applications to make their payments. Only 21% answered that they are very
    sensitive to anonymity and as a result they never make payment transactions online
    as they don’t want to share their personal data with any payment platform.

    '
