    解决这一问题的可能方法是通过基于区块链的众筹项目来收集公共财政援助。捐赠者将获得运营产生的代币作为补偿（即产品折扣），或者在其他情况下获得公司发行的证券。


    众筹是一种筹资方式，即许多人通过互联网向某个项目贡献小额资金，并获得该项目的奖励。


    然而，在转型正义（TJ）需要资金来妥善开展工作的 TJ 情境下，众筹等倡议是一个可行的选择。由于区块链系统消除了中间方，投入的资金将直接进入真相委员会的资金。众筹倡议还允许全球社区更广泛地参与，因为任何拥有互联网连接和足够资源进行微小贡献的人都可以进行捐赠。在区块链系统中，还可以引入加密货币作为另一种捐赠支付系统。作为捐赠的回报，真相委员会可以发行实用代币，例如，让捐赠者获得委员会尚未公开的文档或其他激励措施。


    资源匮乏导致的另一个问题是，真相委员会的触达能力有限，而这种能力本可以使公众参与真理发现过程。真相委员会承担着重要的社会角色，社会参与对于它们的工作和合法性至关重要。


    真相委员会面临的另一个挑战是数据管理问题，特别是关于每条信息的收集、分析和编目。这可能会带来巨大的问题，尤其是现在，新科技（如具有视频或音频录制功能的智能手机）和社交媒体可以迅速生成并传播海量数据。


    对于这两个问题，重要的一点是，在区块链系统中，信息的传输极快，在有互联网连接的地方使用智能手机，可以收集并审计许多不同的数据点，并让用户立即访问。


    在公共区块链系统中，所有交换的信息都可以被任何拥有互联网连接和智能手机的人访问，这提高了系统的透明度和触达范围。此外，网络可以是许可制的，这意味着用户必须请求许可才能在平台上进行交易并向平台插入信息。因此，系统控制器（可以是真相委员会本身或其他控制者）可以只允许特定用户与网络交互。这可以提供另一层合法性，并对收集到的信息进行更好的控制。


    从这个意义上说，随着网络中信息的被确认，节点（用户）可以将其标记为有效信息。这里的逻辑类似于供应链流程，但使用的是数据片段而不是产品。因此，随着数据流经不同的验证过程，它变得越来越合法，而且由于整个过程是公开的，对于公民社会来说也是透明的。因此，误导信息和过度无用数据的情况得到了控制和最小化。


    ### 3.3.2 起诉


    对犯罪分子进行起诉（称为报复性正义）是使犯罪者承担责任的最传统方式。


    如今，国家拥有诉讼的首要管辖权，并在 TJ 项目的协助下增强和加强司法能力。


    然而，国际刑事法院（ICC）遭受了批评，原因在于其作为当地人口人类安全代理的削弱作用，以及其自身的实地（*in locus*）人员，而且它作为报复性和分配性正义的补充机制，旨在通过专业知识和基础设施协助其他
    TJ 机制和国家法院。


    尽管如此，起诉过程中仍可能出现程序性挑战，例如证据的获取、犯罪分子的识别、受害者和证人的保护、国家与国际刑事法院之间的国际合作、证据的保存以及信息的共享。


    区块链技术可以为特定市场提供数据共享网络，所有节点都可以访问和交易所有信息。在公共许可系统中，交易具有更高程度的信任。


    从这个意义上说，信息的保护和共享问题得到了解决，由于只有特定节点能够插入数据，交换的信息仅由参与起诉过程的实体控制。尽管如此，所有数据都存储在网络中，这意味着没有中央机构对交易内容具有绝对托管权，从而为系统增加了另一层保护。


    使用区块链收集受害人和证人的信息可能是巨大的帮助，因为有授权在系统中添加区块的组织可以直接去见这些人并听取他们的证词，并获得网络提供的匿名性。换句话之，此类行动可以为受害者、证人以及负责收集此类证词的当地团队引入另一层保护。


    区块链技术还可以帮助国际刑事法院监控并协助当地人员和国家法院进行信息交换。将国际刑事法院作为区块链系统中的一个节点将促进不同国家和国际团体之间的数据传输，并对当地情况做出快速反应。例如，实地（*in
    locus*）受害者的证词收集可以让国际刑事法院立即访问这些数据，从而提高法院以及其接触的当局和公民组织决策的准确性和敏捷性。预先建立的国际网络（以联合国和国际刑事法院等国际组织为节点）可以作为快速响应的解决方案。网络所有者可以允许其他成员参与，并在随后将其移除。


    除上述之外，作为真相委员会提出的解决方案，国际刑事法院可以发起基于区块链的众筹项目，允许任何赞助者提供支持，并建立通过加密货币融资的可能性。加密货币的使用可能产生积极影响，因为其使用可以简化资金流程并降低成本。国际刑事法院可以使用此类资金支持来促进其作为补充机构的行动，并通过基金基金支持当地组织（如混合法院、真相委员会项目和赔偿计划）。因此，国际刑事法院可以加强其作为追求所有类型正义的机构和人类安全代理的补充功能。


    如所示，在 TJ 情境下将区块链技术用于起诉与其在真相委员会情境下的使用类似，因为它旨在提高运营方面的效率，例如多个参与者之间的信息交换。


    ### 3.3.3 恢复民主机构


    根据联合国转型正义指南，


