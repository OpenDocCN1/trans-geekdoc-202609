    自从几种不同的加密资产出现并进入主流视野以来，区块链几乎从未中断地处于新闻焦点（该术语包括加密货币、虚拟资产、虚拟货币、数字资产、数字货币以及全球范围内使用的类似定义，并涵盖了被用或分类为支付代币、证券代币、实用代币和稳定币等“代币”），并已向公众开放。监管机构的兴趣（特别是在
    2022 年下半年）呈指数级增长，这正导致人们重新关注此前被称为加密货币“荒西部”的领域（[`www.wsj.com/articles/sec-will-police-cryptocurrencies-to-maximum-possible-extent-chair-gary-gensler-says-11628007567`](https://www.wsj.com/articles/sec-will-police-cryptocurrencies-to-maximum-possible-extent-chair-gary-gensler-says-11628007567)）。除了加密生态系统带来的法律和监管考虑外，当局还在研究从其底层技术和概念中利用的可能性，并测试了如土地登记、社会福利管理、专利保护以及中央银行发行的数字货币（中央银行数字货币或
    `CBDCs`）相关的解决方案。值得注意的是，所有这些活动可以使用区块链或基于分布式账本（DLT）的解决方案，但并不一定需要。这包括 `CBDC`，它可以通过区块链类型的解决方案、传统方法或两者的结合进行发行和管理。在本章中，我们考虑了
    `CBDC` 主题、定义及其影响，并特别强调了匿名性——我们认为在世界范围内中央银行实施 `CBDC` 的过程中，这一点至关重要，特别是当主要和先进经济体的中央银行推进
    `CBDC` 解决方案时。


    关键词：区块链 中央银行数字货币 CBDC 加密 结束 摘要


    ## 7.1 引言


    `CBDC` 是当今的话题。自 2018 年后期以来，中央银行对 `CBDCs` 的兴趣和公众干预变得更加积极，从 2020 年下半年和 2021 年第一季度开始快速增长^¹⁹⁹。


    广泛接受的定义是：`CBDC 是由中央银行发行、以国家记账单位计价的数字货币，它代表了中央银行的负债`。`CBDC` 可以是“零售型”（即用于通用），也可以是“批发型”（即供金融机构限制性访问）。`CBDC`
    与现金之间的主要区别在于形式。`CBDC` 以数字形式存在，不像以实体硬币和纸币形式存在的现金。


    根据国际银行（`BIS`）对中央银行数字货币的第三次调查结果^²⁰⁰，


    除了上述因素，`BIS` 调查还指出了一些让中央银行考虑 `CBDC` 的隐含动机，例如维护国家货币货币主权^²⁰¹。


    上述动机或政策目标已国际货币基金组织（`IMF`）近期发布的一项研究得到证实^²⁰²。


    尽管动机和潜在收益各异，但 `CBDC` 的实施涉及中央银行需要审慎考虑的多种影响。这些包括 `CBDC` 实施的法律影响（如法定货币的采纳），以及网络风险、数据隐私、会计影响和金融稳定。另一方面，仍在出现的技术替代方案需要经过仔细评估，以适当应对并实现上述政策目标。


    另一个与 `CBDC` 设计特征相关的相关方面（目前在不同机构之间仍有很大争议）是关于中央银行发行数字货币的所有权及其交易的匿名性。在所有权方面，目前纸币在很大程度上是匿名的，而银行或支付账户上超过一定限的交易由于国家
    `AML/CFT`（反洗钱和反恐怖主义融资）要求是可以追溯的。


    但在法律上，中央银行数字货币是否有可能完全或至少部分匿名？或者，中央银行和其他机构是否会利用这一机会，最终完全追踪公司和个人使用的资金，并解决 `AML/CFT`
    风险？公众会对这一切何反应？技术方面又如何？中央银行是倾向于使用基于中心化账本的中心化技术，还是它们更倾向于使用分布式账本技术（如区块链）作为实施 `CBDC`
    的更合适选择？


    由于上述主题在涉及公众采纳和使用数字货币的意愿，以及在涉及中央银行发行 `CBDC` 的限制时，可能会成为重大问题，因此我们决定在本章中分别基于欧洲背景下的法律框架和某些中央银行对技术选择的决定来分析上述问题。


    ## 7.2 匿名方案与作者调查结果


    2020 年 10 月，七家中央银行联合 `BIS` 发布了一份报告^²⁰³




    *   在灵活且创新的支付系统中与现金和其他类型的货币共存；

    *   任何引入都应支持更广泛的政策目标，不对货币和金融稳定造成损害；

    *   特征应促进创新和效率。


    考虑到现金的主要特征是既没有身份记录也没有交易本身的记录，从客户的角度来看，转向完全可追溯的支付手段并非易事（除了从技术角度看可以通过 `CBDC` 实现的其他特征，如对某些类型支付的限制或约束、可逆性以及负利率的应用）。尽管如此，在上述报告中，完全匿名并不被认为是一个可行的方案。尽管解决
    `AML/CFT` 担忧未列为中央银行视角的主要动机之一，但预计后者在向公众发行 `CBDC` 时将遵守这些规则。


    根据 Bech 和 Garratt 发表的一篇论文 (2017)^²⁰⁴


    英国银行（`BoE`）在其 2020 年发表的讨论书中^²⁰⁵


    ### 7.1 但消费者对支付以及由中央银行发行的通用 CBDC 中的匿名性价值有多有多如何？


    为了本章的内容，我们进行了一项 104 人参与的调查。我们的目标群体主要是对 `CBDC` 拥有坚实或基础理论知识的人，包括中央银行家/监管机构（40%）、私人支付服务提供商（14%）、开发/国际组织（11%）、律师/咨询公司（13%）以及学术界（10%）。参与者来自四大大陆，大部分人来自欧洲（55%）。向参与者提出了三个主要问题，详细说明如下。


    关于“*在在线进行支付交易时，你多大重视保护隐私的匿名性*”，大多数受访者（77%）回答说他们并不那么重视，因为他们通常信任受监管和监督的支付服务提供商，尽管他们大多数倾向于使用信用机构的在线支付应用程序进行支付。只有
    21%的人回答说他们对匿名性非常敏感，因此他们从不在在线进行支付交易，因为他们不想与任何支付平台分享个人数据。

