- fmt: "\nTherefore, in the case of natural persons, income from crypto-assets is\
    \ taxed under the `PIT Code` only if it fits into one of these six schedules of\
    \ income. And in that case, as it results from `article 1(2)`, the taxation will\
    \ be levied regardless the payment is made in kind or in cash (regardless of the\
    \ currency used). This was the interpretative path that the `TA` followed in the\
    \ binding ruling described below in the following subsections.\n\n### 4.4.2 The\
    \ Sale of Cryptocurrencies\n\nThe first binding ruling in Portugal regarding crypto-assets\
    \ was issued in 2016. \n\nThe `TA` started by asserting that cryptocurrencies\
    \ “are not currencies” because they do not have legal tender or discharging power\
    \ in Portugal. Further, the case under analysis was about gains obtained with\
    \ the purchase and sale of virtual currency units or exchange at the exchange\
    \ rate of cryptocurrency by fiat currency (whatever it may be). The income generated\
    \ by this activity could, in theory, be integrated into three different schedules\
    \ of income: `G` (capital gains), `E` (capital income) or `B` (business or professional\
    \ income).\n\n### 4.4.3 Capital Gains?\n\nThe `TA` analyzed whether this income\
    \ could be considered capital gains under `article 10` of the `PIT Code` (noting\
    \ that it entails a closed typification), putting the following hypotheses: \n\
    \n* The `TA` considered that this is not a disposal of shares neither the cryptocurrencies\
    \ confer rights to receive any amount;\n* It is also not a derivative financial\
    \ product, as its valuation is not based on any underlying asset;\n* Finally,\
    \ it defended that cryptocurrencies are not yet securities since they cannot be\
    \ subsumed at this time to `article 1` of the `Securities Code`.\n\nHowever, one\
    \ may question if some crypto-assets could be qualified as atypical securities\
    \ since `article 1(g)` of the `Securities Code` provides that “Other titles representing\
    \ similar legal situations provided they are market tradeable” are considered\
    \ securities. In fact, the Portuguese Securities Market Commission (`CMVM`) issued\
    \ a Press Release stating that a token launched in an Initial Coin Offering (`ICO`)\
    \ could be qualified as an atypical security if it is a document representing\
    \ homogeneous legal situations susceptible to transmission on the market, but\
    \ a case-by-case analysis is always necessary, given the complexity and variability\
    \ of this reality.\n\nIt is not unprecedented to have difficulties or differences\
    \ in qualifying cryptocurrencies, namely in what concerns income resulting from\
    \ their purchase and sale among official entities. On this see Table `4.1` below\
    \ for the US example on qualification of cryptocurrencies by different relevant\
    \ public authorities. Table 4.1 Example of USA\n\n| Cryptocurrencies qualification\
    \ | Entity |\n| :--- | :--- |\n| Money | • Financial crimes enforcement network;Office\
    \ of foreign assets control |\n| Property | • Internal revenue services |\n| Commodities\
    \ | • Commodity futures trading commission |\n| Securities | • Securities and\
    \ exchange commission |\n\n*Source* The author\n\nHowever, this can raise a problem\
    \ in Portugal, since `article 11(2)` of the `GTL` establishes that whenever the\
    \ tax rules use terms specific to other branches of law, they must be interpreted\
    \ in the same manner as they are under such branches unless a different interpretation\
    \ is directly provided by law. Thus, *prima facie* the `TA` should follow the\
    \ interpretation made by `CMVM`. On the other hand, the `TA` interpretation gives\
    \ more legal certainty because there is no need of casuistic analysis. Still,\
    \ in light of `CMVM` communication (which was issued almost two years later than\
    \ the binding ruling) and considering that the wording used by the `TA` was “at\
    \ this time”, it is not impossible that the `TA` changes its position. However,\
    \ as far as we know, there is no indication that it is going to happen.\n\n###\
    \ 4.4.4 Capital Income?\n\n`article 5(1)` of the `PIT Code` establishes that income\
    \ from capital are the legal fruits or any economic advantages, whatever their\
    \ nature or denomination, whether in cash or in kind, arising, directly or indirectly,\
    \ from patrimonial elements, assets, rights or legal situations, of a movable\
    \ nature, as well as the respective modification, transfer or termination, with\
    \ the exception of gains and other income taxed in other categories. The `TA`\
    \ noted that this rule is drafted in an open manner and that `article 5` provides\
    \ some examples of taxable events (but not the only ones). Thus, in schedule `E`\
    \ the taxable income is the one resulting from the mere application of capital\
    \ is taxed, i.e., the rights produced without impairment to the substance of the\
    \ producer. Since the case under analysis was the income resulted from the sale\
    \ of the right, the binding ruling concluded that it was not capital income.\n\
    \n### 4.4.5 Business or Professional Income?\n\nLastly, the binding ruling analyzed\
    \ the case under schedule `B`, enunciating that in such case the income is taxed\
    \ according to the exercise of an activity and not according to the origin of\
    \ the income (i.e., regardless of whether the income results from sales, legal\
    \ fruits, or has any other nature), under `article 3(1)` of the `PIT Code`. Further,\
    \ the exercise of the activity is determined by its regularity and by the orientation\
    \ of such activity to obtain profits.\n\nIn case of existence of a business or\
    \ professional activity, the taxpayer is obliged to comply with the declarative\
    \ obligations contained in `article 3(6)` of the `PIT Code`—to issue an invoice\
    \ or equivalent document (electronic invoice-receipt), whenever he or she makes\
    \ a sale or provides a service. In this case, taxation occurs at general progressive\
    \ rates.\n\nThen the binding ruling concluded that the sale of crypto-currency\
    \ is not taxable under the Portuguese tax system unless if its regularity it constitutes\
    \ a business or professional activity, in which case it will be taxed under schedule\
    \ `B`. Therefore, one should question how to differentiate a regular activity\
    \ from an occasional activity? These are indeterminate concepts and disputes may\
    \ arise from their interpretation. However, we are not aware of any cases in which\
    \ the `TA` is taxing this income, apart from those in which the taxpayer declared\
    \ the beginning of a business and professional activity related with cryptocurrencies.\
    \ In fact, the `ECJ` (albeit with regard to VAT), has already stated that the\
    \ practice of a certain set of acts of mere exercise of wealth management is not,\
    \ *per se*, likely to be seen as the result of the exercise of an economic activity.\n\
    \n### 4.4.6 Other Types of Income and Some Practical Considerations\n\nThere are\
    \ no other public understandings of the `TA` regarding PIT and crypto-assets.\
    \ Nevertheless, here follow some additional thoughts, considering that `article\
    \ 1(2)` of the `PIT Code` determines the taxation of income, whether paid in cash\
    \ or in kind. In our opinion, crypto-assets may be qualified as payments in kind\
    \ and if the parties under a contract agree with such a form of payment, there\
    \ is no obstacle to that from a tax perspective. Therefore, for instance, if one\
    \ receives crypto-assets as payment for goods sold or services rendered under\
    \ schedule `B`, it will be taxed at the general progressive rates. Or if a salary\
    \ is paid with cryptocurrencies, it will be taxed under schedule `A`, also at\
    \ the general progressive rates. If a landlord accepts crypto-assets to settle\
    \ the rent, it will be taxed under schedule `F` with an autonomous taxation of\
    \ 28%.\n"
