    So far, I have not touched on tokens and cryptocurrencies. The Bitcoin protocol
    generated, as an incentive, its token: a digital representation of value stored
    in a user’s wallet and registered in the protocol. The token’s purpose was to
    be used as a payment mechanism, as a currency; hence, all protocol tokens (stored
    through cryptographic means) were called cryptocurrencies. In the crypto economy,
    the token serves two functions: an economic incentive for the decentralized consensus
    mechanism to work and a product—in other words, as the element that makes the
    protocol valuable.


    The value of Bitcoin comes from its use as a currency—payment mechanism, story
    of value or unit of account (the jury is still out there for which one is Bitcoin
    better equipped to handle). However, other tokens have different uses. For example,
    `Ether` is used to pay for storage pace and transaction fees in the `Ethereum`
    network; `Filecoin` enables users to store data in the `Filecoin` protocol; `Tezos`
    enables holders to vote on the protocol’s governance; `Ada`, when staked with
    a pool, generates dividends for its holders. Some tokens represent securities
    that are used as collateral that are issued through public offerings. In short:
    tokens represent different value types, such as rights, currencies, agreements,
    property… To consider them solely as currencies is inadequate, thereby the preferred
    term being crypto assets, given the multiplicity of utilities they can have.


    Nevertheless, market practice divided tokens in terms of function. This division
    has subsequently been adopted by public institutions, including EU regulators,
    in enacting the proposed Market in Crypto Assets Regulation (`MiCA`).


    Tokens are, arguably, the most known facet of the blockchain phenomenon. They
    are the central pieces for the functioning of the protocols and have become an
    easy source of liquidity. Tokens can be exchanged in seconds, between people,
    with minimum or no intervention from intermediaries, thus reducing transaction
    costs. Nevertheless, despite their functionality, they have a speculative tendency,
    generating a kind of alternative (and less sophisticated) financial market that
    is still beginning to attract other, more traditional institutional players such
    as banks and corporations. Another critical factor of the crypto market (and another
    ironic twist on the decentralization promise of `DLT`) is that several entities
    of the token economy are centrally managed (such as example, wallet providers,
    exchanges, and custodians). It is unclear to what extent the attention afforded
    to the economic value of tokens does not soak all the interest in protocol development
    and adoption.


    ## 1.4 The Law in Blockchain


    Blockchain is a technology and an economic reality. As a communication technology,
    it is used to progress human interaction; as an economic reality, it is a production
    of value. In both ways, blockchain is a social phenomenon and, therefore, a legal
    one too.


    Where is the law in blockchain? Put: whenever there is an agreement between two
    or more people. People download the protocol and run it, accepting that action
    to participate in a joint enterprise. By participating in the enterprise, they
    subject themselves to the protocol rules of governance and functioning. If a malicious
    intent wrongs their legitimate expectations, they have the right to claim damages
    from those who wronged them. Suppose they were not wronged, and there were legitimate
    expectations that they were, by downloading the protocol, participating in a risky
    activity. In that case, they are at their peril without solid legal protection.


    Users of the network transact with one another. Transactions are subject to legal
    rules and principles. They use a `smart contract`, but a smart contract is a way
    of executing the transaction and not a legal agreement subject to specific rules
    that are “alegal”. After all, programmable code is a language written by people
    and can represent declarations and agreements.


    The picture above is simplistic, I admit, and does not consider some complex situations.
    For example, regarding the rights and duties of participants in the network: if
    a miner fails to mine a block and insert a transaction from a user, can he/she
    claim damages against the miner for loss of profit? If the protocol’s code has
    a bug, and that bug enables the running of illegal transactions, which is to be
    responsible? The protocol’s creator, the foundation/company that created and takes
    care of the protocol’s maintenance? The freelance programmers and developers that
    dedicate their time (often subsidized by grants from the founding companies, foundations,
    or protocol investors)? What about voting and participation? Do I have a right
    to transparency by staking and voting in protocol governance? In the case of a
    hard fork that I did not agree with, can I claim damages against people that supported
    it? Moreover, what is the rules (contract rules, corporate rules) applicable to
    the situation?


    The question of applicable law and jurisdiction is a matter of international private
    law that holds an essential set of rules for deciding the law applicable to the
    relation and the forum. An article by `Andrew Dickinson` is elucidative in showing
    that, despite the difficulties, it is possible to discern what are the rules applicable
    to a situation connected with a `blockchain`.


    It is also essential to consider the differences between protocols when assessing
    the legal implications of the rights and duties of users. For example, in terms
    of expectations and agreements: the majority of the most-valuable protocols by
    market cap are enterprise or corporate-backed protocols with marketing structures
    in place. Individual users rarely deal directly with the protocol; instead, they
    deal with third-party companies (or, if you do not want to avoid the irony of
    it all: intermediaries) that are directly connected with the protocol. Most users
    will be legally protected (at least on paper) by the agreements signed with service
    providers. As for users (e.g., companies, institutions, and States) that wish
    to participate in the protocol, they are also protected given that they relate
    directly with the protocol’s backers: the foundations and companies that created
    the protocol and have an interest in it to succeed. Expectations are agreed upon
    and legally established ex-ante, with a clear identification of the parties and
    their corresponding duties. Therefore, the risks of governance decentralization
    are somewhat mitigated.


    The bottom line is that when duly considered in their meaning and upon understanding
    the true extent of practical implications, the challenges of “decentralization”
    and automated processing (or `smart contracts`) are not as complex as initially
    believed. Decentralization is not an antonym to law: it has existed for a long
    time, particularly in political systems such as federalism and feudalism. It means
    that power (of deciding, commanding, or ruling) is not (or not entirely) in the
    hands of one central entity or group but instead distributed by many points.


    Blockchain is a private endeavor, a market created by people and managed by people,
    even if based on digital platforms with automated mechanisms of interaction in
    place. People establish the rules through agreement and within the space of autonomy
    the law provides for them. If there is a problem with the code, in terms of how
    something is impossible to achieve (for example, data privacy), it is necessary
    for the code to be amended, which can happen.

