    147. 《统一规则》（Uniform Rules）第 49(1) 条在通常情况下允许有 15 天的时间提交上诉申请。如果双方可以使用这一选择（这在仲裁中可能被排除），则执行必须延迟这段时间。↩


    148. 马雷瓦禁令（Mareva injunction）涉及一种临时禁止，根据该禁止，被申请人阻止处置资产，以规避申请人认为其将来将获得的判决。该命令的设计是为了防止被申请人将其置于申请人无法触及的地方。参见
    Harms 2008, 第 426 段。↩


    149. 一项专利申请于 2021 年 2 月 1 日以专利号 US 10,909,644 B2 提交，寻求为“基于区块链的判决执行”注册专利。摘要将该专利描述为：“此处披露了方法、系统和装置，包括编码在计算机存储器上的计算机程序。一种方法包括：接收与基于区块链的应用程序账户相关的请求，用于收集法院命令中颁发的货币裁决金；确定债权人、债务人和货币裁决金金额；根据区块链上的数据确定该账户与债权人相关；根据数据识别债权人的支付账户以及一个或多个余额大于或等于货币裁决金金额的债务人账户；从债务人的一个或多个支付账户转移货币裁决金金额到债权人的支付账户；并记录经过验证的时间戳。”访问
