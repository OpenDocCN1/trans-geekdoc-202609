    © T.M.C. Asser Press 及作者(们) 2024 F. Pereira Coutinho 等人 (编) 区块链与法律 信息技术与法律系列 37
    [`doi.org/10.1007/978-94-6265-579-9_1`](https://doi.org/10.1007/978-94-6265-579-9_1)


    # 1. 区块链与法律：设定基础


    Martinho Lucas Pires (1) 卡特利亚法学院，Palma de Cima, 1649-023 Lisbon, Portugal. Martinho
    Lucas Pires 邮箱：`martinholucaspires@ucp.pt`


    ## 1.1 引言

    ## 1.2 法律“现象”

    ## 1.3 区块链“现象”

    ## 1.4 区块中的法律

    ## 1.5 针对的法律

    ## 1.6 结论


    ## 摘要

    在过去的几年里，区块链与法律已成为一个发生了大量发展的领域，且这种进步趋势仍在持续。然而，由于区块链和加密货币市场层出不穷的出版物和持续的发展，该主题的本质——关于日益广泛应用的区块链技术及其应用（如加密货币和智能合约）的法律影响和后果——面临着某种迷失的风险。本章从最基础和根本的层面讨论了区块链与法律的问题，并在此考虑了区块链的本质和法律的本质特征，探讨了两者之间的关系，以及应当如何部署新进展，使其既忠于技术的承诺和能力，又符合法律作为社会秩序主要工具的功能。


    关键词：区块链法律 监管 加密货币 智能合约 摘要


    ## 1.1 引言

    2021 年第一季度，比特币、以太坊以及几乎所有其他加密资产都创了历史新高，这被视为新一轮牛市的开始。狂热分子对价格上涨赞誉有加，并将其归功于整个经济领域的企业和投资者对加密货币和区块链协议日益增长的采用：包括如`Tesla`和`Micro
    Strategy`这样的公司、传统的传统参与者（如`银行`），甚至像`埃塞俄比亚`这样的国家。在上一次牛市和区块链“炒作周期”结束大约四年后，2021 年似乎是这项技术开始成功的一年。根据支持者的说法，它的成功将预示着价值转移数字化的新纪元。


    讽刺的是，另一个加密相关的现象在那些艰难的熊市期间达到了顶点（如果准确划分历史时期，大约在 2018 年初到 2020 年底）。加密经济的兴起引发了关于加密和区块链的活跃出版和研究。法律学术也不例外。关于这个问题发表了无数文章、书籍、论文（硕士和博士）、报告和工作论文。


    对于律师和法律研究人员来说，每当某事物似乎足够创新性并能深刻改变人们互动的方式时，跟上技术发展的潮流是典型的做法。然而，没有人能预测到区块链与法律研究领域如此快速且剧烈的增长。法学者们热情地欢迎区块链，投入投入到采用和研究这种新技术以及这种经济、组织和社区建设的形式中。区块链和分布式账本技术似乎预示着基于去中心化、`smart
    contracts`和数字货币等坚实且具有挑衅性的概念的社会变革新时代。尽管采用过程缓慢，但区块链将价值数字化的承诺及其吸引力是如此巨大，以至于该运动中两位最著名的作者决定创造一个术语，来描述处理区块链技术发展的新法律形式——根据这些作者的话，“传统”法律无法回答这些发展。`Lex
    cryptographica`将成为新的、“革命性”法律，用于处理`automated contracts`（无论它们是什么）、自治组织（同上）以及新兴的代币经济。


    作为区块链与法律“运动”的一员，通过研究、咨询、组织课程、教授课程、参加会议和在该主题上发表文章，我必须承认，在开始后的近四年时间里，对区块链和法律的热情在某种程度上似乎一直有些过度炒作了。叫我为现实主义者吧（我乐意接受），或保守主义者（没那么认同）。然而，那些支持区块链作为社会现象的特异性及其“革命性”特征的论点似乎超出了理性，进入了哲学推测领域。诚然，区块链现象尽管具有复杂性，对法律的运作带来了挑战。


    尽管如此，法律也是一个丰富且复杂的现实，由规则及其执行、价值观、社会认知及其政治组成。规范法律关系的术语和原则、其方法和教义学与人类的存在一样古老。在这方面，法律是存在的最伟大的遗产机构。这就是为什么我认为，区块链技术的法律挑战从法律教义学的角度来看并不完全是“革命性的”或“创新的”，大部分问题可以在`contract`（合同）和`liability`（责任）方面进行总结和解决。其他案例必须通过创新的解决方案来处理，这些解决方案要尊重技术的目的、结构以及其所带来的良好发展。另一个问题涉及国家制定法律和国家当局有效执行该市场监管的能力。然而，那是另一个问题，不属于法律问题，而是行政行动和裁决问题。


    本引言章节阐述了这一论点，试图在 2022 年（即热潮几乎崩盘之时），勾勒区块链现象与法律之间联系的基本结构性特征，它们引发的张力，并从批判性的视角对其进行评估。可以将其看作是对区块链与法律问题的核心构建一个框架的尝试。


    为了实现这一目的，我将贡献分为四个部分。第一部分涉及对法律及其现象的讨论，解释法律本质是什么，以及如何从实践和现实的角度进行表现和表达。第二部分讨论区块链现象及其多个维度、矛盾和创新。第三部分研究`DLTs`带来的创新所产生的颠覆性影响，并从更具结构性的法律视角对其进行评估——即研究区块链现象中存在的法律。第四部分考虑区块链市场可以和应该接纳的法律变革；这些变革将带来更多概念和实践上的精确性。


