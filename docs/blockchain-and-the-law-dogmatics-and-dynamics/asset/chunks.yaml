    \ such as decentralization, smart contracts, and digital money. Despite adoption\
    \ being slow, the promise of blockchain to digitalize value and its allure was\
    \ so appellative that two of the most prominent authors of the movement decided\
    \ to coin a term to describe the new form of law that would deal with the developments\
    \ of blockchain technology – developments that, according to said authors, “traditional”\
    \ law could not answer. “Lex cryptographica” was to be the new, “revolutionary”\
    \ law that would deal with automated contracts (whatever those were), autonomous\
    \ organizations (idem), and the emergent token economy.^([³](#fn3))\n\nBeing part\
    \ of the “movement” of blockchain and the law by researching, counselling, organizing\
    \ courses, teaching courses, participating in conferences, and publishing on the\
    \ topic, I must confess, almost four years since the start, that the enthusiasm\
    \ about blockchain and the law always looked, in a way, a bit overhyped. Call\
    \ me a realist (I accept it gladly) or a conservative (less so). However, it always\
    \ seemed that arguments supporting the exceptionality of blockchain as a social\
    \ phenomenon and its “revolutionary” legal character went beyond reason and more\
    \ into the realm of philosophical speculation. It is true that the blockchain\
    \ phenomenon, despite its complexities and contradictions, poses challenges to\
    \ the operation of law.^([⁴](#fn4))\n\nNevertheless, the law is also a rich and\
    \ complex reality, composed of rules and their implementation, values, and social\
    \ perception, of its politics. The terms and principles governing legal relations,\
    \ their method, and dogmatic are as old as humanity’s existence. The law is, in\
    \ this regard, the greatest legacy institution there is. Legal terms and principles\
    \ have evolved, accompanying, and accommodating our technical progress. Law is\
    \ a phenomenon of social order and power that is impossible to avoid or overcome.\
    \ That is why I argue that the legal challenges of blockchain technology are not\
    \ completely “revolutionary” nor “innovative” per se, from a legal, dogmatic perspective,\
    \ and most of them can be resumed and solved in terms of the frameworks of contract\
    \ and liability. The other cases must be tackled through innovative solutions\
    \ that respect the purpose and structure of the technology and the good developments\
    \ that it brings. Another question concerns the capacity of State-made law and\
    \ national authorities to enforce this market’s regulation effectively. However,\
    \ that is another issue, one not of law but of administrative action and adjudication.\n\
    \nThe present introductory chapter develops this argument, in an attempt to, in\
    \ 2022, when the boom almost went bust, frame the basic structural features of\
    \ the connection between the phenomena of blockchain and the law, the tensions\
    \ they raise, and to assess them from a critical point of view. Call it an attempt\
    \ to draw a framework for understanding the basics of what is at stake within\
    \ the problem of blockchain and the law.\n\nFor this purpose, I divide the contribution\
    \ into four sections. The first section concerns a discussion of law and its phenomenon,\
    \ explaining what law is essentially about and how is represented and expressed\
    \ from a practical and realist perspective. The second section discusses the blockchain\
    \ phenomenon, its many dimensions, contradictions, and innovations. The third\
    \ section looks at the supposedly disruptive effect of innovations brought by\
    \ DLTs and assesses them from the more structural perspective of law—in other\
    \ words, it looks at the law existent in the blockchain phenomenon. The fourth\
    \ section considers what legal changes the blockchain market could and should\
    \ accommodate; changes that would bring more conceptual and practical precision."
