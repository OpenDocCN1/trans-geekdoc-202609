    ## Preface


    Blockchains and distributed ledger technologies (DLTs) are one of the major technological
    developments of our times. DLTs are computer protocols designed for storing and
    managing data in a distributed manner through different participants. Blockchain
    is the name attributed to a type of DLT that were inspired by Bitcoin, the first
    trustless-based payment system, as per the words of Satoshi Nakamoto. Since then,
    new technologies improving and expanding the capacity of the cryptocurrency have
    appeared, morphing blockchain.


    Currently, there is an enormous offer (and continuously growing) of projects in
    the blockchain landscape. While new sectors have emerged with DeFi protocols and
    products fighting to establish a decentralized market, crypto exchanges have become
    regulated. Long gone are the days in which blockchain and crypto were looked on
    as dangerous products, with the sole purpose of escaping law enforcement, and
    disguised as simplistic claims.


    Proponents of the technology argue that blockchain has the potential to substantially
    alter commercial relations, either those that are business-to-business or those
    that are business-to-consumer, by switching commercial trust from market agents
    and intermediaries to computer programs based on algorithmic trust that run on
    protocols distributed by computers all over the world. Blockchain technology has
    brought about a paradigm shift in the way we think about and exchange value. Its
    potential for innovation and disruption has been widely recognized across various
    industries. However, any new technology brings legal and regulatory challenges
    that must be navigated.


    The law and blockchain have a difficult relationship: the core principles of privacy,
    decentralization, and automation of the technology conflict with classic juridical
    standards concerning stability and liability, although new laws have been enacted
    during the past years.


    From 2018 to 2020, we organized at Nova Law School three short post-graduate courses
    on the legal impacts of blockchain technology. These courses were the first of
    their kind to be offered in Portuguese universities, and a variety of Portuguese
    and international academics, entrepreneurs, lawyers, and regulators participated.
    This book condenses a “best of” of the sessions taught in those three courses,
    dealing with issues relating to the convoluted application of legal standards
    and rules to blockchain.


    Staying true to the international structure of the courses, the book contains
    eight chapters dedicated to general and more specific intersections between blockchain
    or DLT-based innovations and the law.


    The book starts with Martinho Lucas Pires’ chapter entitled “Blockchain and the
    Law: Setting the Floor” (Chap. 1).

