    To the question of “what type of anonymity would you prefer (counterparty versus
    third party)", if that was a choice put to them, most of the respondents (around
    39%) said they would prefer to have full anonymity. For those who choose between
    the two types, only 10% preferred counterparty anonymity and 30% third party anonymity.
    Within this category, it appears that people are more concerned about the type
    of information that payment service providers collect and administrate compared
    to the information collected by the recipients of funds. 21% of respondents were
    indifferent to any of the options.


    The final question was about the respondents’ concerns about anonymity if the
    central bank itself were to issue a CBDC. Considering that a significant part
    of the respondents came from central banks, the results to this answer were not
    unsurprising. The most preferred answer (58%) was that they are aware of the risks
    associated with anonymity in payment transactions (e.g., AML/CFT) and therefore
    they would expect that anonymity be applied only for payments below a certain
    threshold. This seems to be the same approach that different jurisdictions are
    applying for cash payments for anti-money laundering and counter terrorism financing
    purposes. Still, there were 26% of participants who said that they would expect
    the CBDC to be fully anonymous, same as cash so that the central bank won’t be
    able to track or monitor their transactions or spending habits. This result is
    in line with the result of the first question, where 21% answered they were concerned
    about privacy and didn’t want to share their personal data with any payment platform.
    16% of the respondents fully embraced the possibility of a non-anonymous CBDC
    because they consider it as a good opportunity for central banks to address informality
    in the economy. As a result of this survey, we extracted the following outcomes:


    > Firstly: anonymity does not seem to be a general concern for our audience because
    sharing their true identity with regulated payment service providers is not a
    novelty. They are already used to sharing personal data with payment service providers,
    although most of them prefer credit institutions.^([206](#fn206))


    > Secondly: if people were to choose, they would prefer making completely anonymous
    transactions, but on the other hand they understand the importance of not doing
    so for the economy as a whole. Therefore, the AML/CFT requirements currently applied
    for cash payments, which require identification for payments above a certain threshold,
    are endorsed by them as a solution and are expected to be applied as well for
    CBDCs. This might be trickier for central banks which are planning to issue directly
    CBDC to the public, as they will have to establish their own monitoring structures
    and capacities to ensure this.


    Based on the comprehensive analysis of the European Central Bank (ECB)^^([207](#fn207))


    According to the proof of concept^([208](#fn208))


    The European Commission, through the new proposed regulation on AML/CFT,^([209](#fn209))


    In Table [7.1](#540017_1_En_7_Chapter.xhtml#Tab1), we summarize the pros and cons
    of the different levels of anonymity in a CBDC design discussed above. Table 7.1


    Pros and cons of the different levels of anonymity in a CBDC design


    | | Full anonymity | Partial anonymity | No anonymity |

    | --- | --- | --- | --- |

    | Pros | The CBDC will be cash-like, except for the form. People will embrace
    it more easily since their perception of using cash will not be different and
    they will continue making payments in cash as they have been doing. According
    to Kahn et al ([2005](#540017_1_En_7_Chapter.xhtml#CR6)) and Mc Andrews (2017),
    payees and payers might support this option more because they may want to reduce
    the risk of identity theft, the possibility that the counterparty might follow
    them home and assault them, or more innocuous annoyances like directed advertising
    and solicitations (spamming). The faster people embrace the new digital currency,
    the easier it will be implemented and successfully distributed. | Partial anonymity
    enables anonymous transactions for lower amounts and/or for a limited number of
    transactions within a certain time. While for high value transactions or above
    a certain threshold, they will have to be identified. This option enables people
    to perform high value transactions in a secure way while also providing flexibility
    for the execution of low value payments. | Ensures integrity of the financial
    transactions Ensures full coverage of funds or protection if money is lost or
    stolen. |

    | Cons | Increases risk of ML/FT since it could be used for criminal activities;
    no security and protection if money is lost since the holder cannot prove it belonged
    to him or her. This is particularly problematic for economies relying on cash
    and low financial inclusion rates. Trust in the currency could be questioned.
    | Requires close institutional cooperation and coordination to ensure that established
    limits for being anonymous are duly respected.^([210](#fn210)) | People and transactions
    will be traceable and identified constantly. Hence individuals’ privacy in transactions
    is monitored. This could create opportunity for more surveillance and censorship
    from Governments (e.g., countries with weak rule of law, incapable institutions,
    and little political accountability).^([211](#fn211)) There is no assurance that
    the customers’ data will not be misused for political reasons or subject to cyber-attacks.
    Since close monitoring will be required from the central bank for AML purposes,
    which is an activity it has not been involved in the past, reputational risks
    might also arise. |


    *Source* The authors


    ## Technological Options


    While a fast pace in technological development can be a positive factor, this
    is not helping central banks in their decision-making process in designing CBDCs.
    Typically, central banks operate in a centralized ledger system, while DLT solutions,
    of which blockchain is arguably the best known, brought to the forth a new technological
    choice. Since DLT is still in a developing phase, it brings a lot of uncertainties
    related to its capacity and suitability. That being said, there is not a universal
    approach among central banks to embrace DLT as the main technology enabling the
    issuance of CBDC.


    Central banks which are in advanced phases of CBDC testing or piloting are assessing
    DLT application versus centralized ledgers to identify constraints and limitations.
    The People’s Bank of China (`PBC`) which has already tested DLT in its pilots,
    decided that it has limited capacity to process transactions, especially on days
    with high levels of transactions. For this reason, the `PBC` has committed to
    a `hybrid architecture`, meaning that the DLT will be used in limited areas, allowing
    also for other technologies to be featured on its core centralized ledger. A similar
    approach could be followed by the Central Bank of Uruguay in the second pilot
    of the e-peso. The first pilot was not based on DLT.


    The Central Bank of the Bahamas (CBOB)—the first central bank in the world to
    issue a CBDC (Sand Dollar) and the Central Bank of Nigeria CBCD (e-Naira) are
    both deploying DLT.^([213](#fn213))

