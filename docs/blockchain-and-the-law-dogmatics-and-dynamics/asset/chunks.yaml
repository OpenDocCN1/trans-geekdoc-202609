    # 第 37 卷 信息技术与法律系列


    **主编**

    Simone van der Hof（法律与数字技术中心，莱顿大学，荷兰莱登）


    **丛书主编**

    * Jef Ausloos（阿姆斯特丹大学，荷兰阿姆斯特丹）

