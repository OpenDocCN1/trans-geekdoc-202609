    \ choice. Since DLT is still in a developing phase, it brings a lot of uncertainties\
    \ related to its capacity and suitability. That being said, there is not a universal\
    \ approach among central banks to embrace DLT as the main technology enabling\
    \ the issuance of CBDC.\n\nCentral banks which are in advanced phases of CBDC\
    \ testing or piloting are assessing DLT application versus centralized ledgers\
    \ to identify constraints and limitations. The People’s Bank of China (PBC) which\
    \ has already tested DLT in its pilots, decided that it has limited capacity to\
    \ process transactions, especially on days with high levels of transactions. For\
    \ this reason, the PBC has committed to a “hybrid architecture”, meaning that\
    \ the DLT will be used in limited areas, allowing also for other technologies\
    \ to be featured on its core centralized ledger. A similar approach could be followed\
    \ by the Central Bank of Uruguay in the second pilot of the e-peso. The first\
    \ pilot was not based on DLT.\n\nThe Central Bank of the Bahamas (CBOB)—the first\
    \ central bank in the world to issue a CBDC (Sand Dollar) and the Central Bank\
    \ of Nigeria CBCD (e-Naira) are both deploying DLT.^([^(213)](#fn213)) ![Fig.\
    \ 7.1 ¶ Current CBDC implementation trends and use case review. ¶ Source The authors](images/540017_1_En_7_Chapter/540017_1_En_7_Fig1a_HTML.png)\n\
    \nFig. 7.1 ¶ Current CBDC implementation trends and use case review.^([^(214)](#fn214))\
    \ ¶ *Source* The authors\n\n## 7.4 Major Legal Implications of CBDC Implementation"
