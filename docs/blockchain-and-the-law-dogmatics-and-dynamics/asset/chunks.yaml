    随着各国央行推进央行数字货币（CBDC）实施项目，涉及法律和监管影响的问题和疑问也随之增加。这是因为 CBDC 不仅仅是一个技术项目，其成功实施不仅取决于技术问题。除了可能出现的政策和政治问题（这些问题因司法管辖区的不同而异），还应对对立法方面进行仔细评估。央行法和货币法处于领先地位，但其他首要法律如商业银行法、税法、私法、支付系统和支付服务法、数据保护法、反洗钱/反恐怖主义（AML/CFT）法等可能需要评估并修订.²¹⁵


    ## 7.5 央行货币与私人货币的区别——法律授权


    利用上述部分提到的定义，CBDC 代表央行的负债。与流通现金或在央行的商业银行账户（代表央行负债表上的负债账户）类似，CBDC 将获得类似的对待。这些资金由央行以物理（流通现金）或数字形式（CBDC
    和商业银行账户）发行，因此它们属于央行货币的定义。另一方面，客户存商业银行的资金是属于他们自己的私人货币，因此登记在商业银行的负债表负债中。央行负债的创造与央行的法律授权密切相关。但尽管央行一直向商业银行或政府提供数字形式的现金，但到目前为止尚未向公众提供任何此类服务。因此，目前的“流通现金”负债账户始终与物理现金而非其数字形式相关。因此，相关的央行法应明确授权²¹⁶


    ## 7.6 法定货币


    全球许多央行是其所在司法管辖区内发行法定货币的唯一法律授权机构。某些适用法律将货币发行仅限于纸币和硬币，而另一些法律使用了更广泛的措辞，未将货币发行限制在纸币和硬币.²¹⁷


    发行数字形式的法定货币如何？从技术上讲，通过修订央行法并将 CBDC 明确指定为法定货币是可能性的。但这不仅仅是一个法律技术问题。法定物理货币可以全范围内广泛地获取和使用并作为支付手段，遗憾的是，数字形式可能无法做到这一点。因此，将数字货币指定为法定货币可能被认为对老年人、残障人士或在数字或财务上被排除在外的人等弱势群体不公平，²¹⁸


    ## 7.7 萨尔瓦瓦案例


    总结本章，尽管与当前主题并非完全相关，但我们介绍了萨尔瓦瓦的案例，该国在 2021 年采用比特币作为法定货币。这可能有用且具有启发性，因为萨尔瓦瓦案例展示了一些与
    CBDC 实施相关的方面：央行和当局直接向公众提供法定货币（例如支付政府津贴和福利）、民众对“官方”数字渠道（如政府赞助钱包）的适应以及授予非物理货币法定地位。


    ### 7.7.1 国家背景


    萨尔瓦瓦是一个小国²¹⁹


    从美国向萨尔瓦瓦汇款的成本随着时间的推移不断下降。根据世界银行数据库，2021 年第一季度发送 200 美元的平均总成本占汇款金额的 2.91%，而 2020
    年第四季度为 3.13%，2019 年第四季度为 3.53%.²²⁰


    另一方面，萨尔瓦瓦的金融包容水平很低。根据 2021 年发布的最新全球金融普普调查（Global Findex），只有 31% 的成年人在金融机构开有账户，而
    2017 年为 29%，因此金融账户拥有率略有上升。这与全球数据结果相比低得多，全球范围内拥有金融机构账户或移动货币服务账户的成年人比例从 68% 增加到
    74%。调查受访者（54%）提到没有账户的主要原因是金融服务太贵。尽管 70% 的汇款接收者是女性，但只有 24% 的女性拥有账户。大多数汇款家庭接收者（94%）将这些钱用于日常消费，大约
    79% 可归类为贫困或面临贫困风险的人.²²¹


    ### 7.7.2 比特币作为法定货币


    萨尔瓦瓦总统于 2021 年 6 月宣布将向国会提交法案，使比特币成为该国的法定货币。此决定的原因之一包括促进正式经济和增强金融包容性，以及允许萨尔瓦瓦人更容易、更廉价、更快地转账数十亿美元的汇款.²²²


    尽管面临国际货币基金组织（IMF）和世界银行的担忧，²²³


    然而，一年后的数据显示，比特币的使用并没有像当局和加密爱好者最初预期的那样被民众接受。政府在 2022 年 1 月声称，萨尔瓦瓦有 400 万比特币用户²²⁴


    小企业主和个人列出的主要问题是虚拟货币的波动性导致人们亏钱、由于范围内可兑换现金的 ATM 数量有限导致的物流问题，以及 Chivo 客服未解决的技术问题.²²⁵


    尽管面临所有挑战和挫折，萨尔瓦瓦案例预计不会保持孤立状态。2022 年 4 月，中非共和国成为世界上第二个采用比特币作为法定货币的国家.²²⁶


    然而，考虑到来自国际机构（如国际货币基金组织和世界银行）的怀疑和忧虑，以及许多国家对这些机构在财政支持和援助方面的依赖，同时也考虑到比特币和其他加密货币由于其波动性和缺乏监管控制而可能带来的风险，将实施比特币或其他加密货币作为法定货币的决定必须根据国家优先事项和人口的财务状况进行仔细权衡。目前加密市场的现状，特别是在
    `Terra Luna` 崩溃之后²²⁷


