    \ Begin Abstract \n\n# 5. Blockchain Execution of Judgements—A Possibility in\
    \ South Africa?\n\nGeorge Daniel Raath^([1](#540017_1_En_5_Chapter.xhtml#Aff12)\
    \ [ ](#540017_1_En_5_Chapter.xhtml#ContactOfAuthor1)) (1) MinterEllison, Constitution\
    \ Place, 1 Constitution Avenue, Canberra, Australia George Daniel Raath Email:\
    \ [daniel.raath@minterellison.com] 5.1 [Introduction](#540017_1_En_5_Chapter.xhtml#Sec1)\
    \ 5.2 [Traditional Methods of Execution of Judgments Under South African Law](#540017_1_En_5_Chapter.xhtml#Sec2)\
    \ 5.3 [Smart Contracts](#540017_1_En_5_Chapter.xhtml#Sec3) 5.4 [Application in\
    \ the South African Legal Context](#540017_1_En_5_Chapter.xhtml#Sec4) 5.4.1 [Execution](#540017_1_En_5_Chapter.xhtml#Sec5)\
    \ 5.4.2 [Practical Impediments to Implementation of Blockchain Execution of Court\
    \ Orders](#540017_1_En_5_Chapter.xhtml#Sec7) 5.4.3 [Benefits to the Parties](#540017_1_En_5_Chapter.xhtml#Sec8)\
    \ 5.4.4 [Security for Costs](#540017_1_En_5_Chapter.xhtml#Sec9) 5.5 [Conclusion](#540017_1_En_5_Chapter.xhtml#Sec10)\
    \ [References](#540017_1_En_5_Chapter.xhtml#Bib1)\n\n## Abstract\n\nExecuting\
    \ court orders via conventional methods in South Africa can be costly and time\
    \ consuming. An alternative to the `status quo` could be on-blockchain execution\
    \ using smart contracts. This would afford the parties the dual benefits of irrevocability\
    \ and immutability—thus, speed of execution and certainty of payment. This chapter\
    \ considers conventional execution methods available to a successful litigant\
    \ under South African law (Sect.5.2). It then considers the concept and attributes\
    \ of execution on the blockchain (Sect.5.3), as well as two possible use cases\
    \ of blockchain execution applied in South African context and possible impediments\
    \ to their adoption (Sect.5.4).\n\nKeywords Execution of judgments Blockchain\
    \ Smart contracts South African law\n\n## 5.1 Introduction\n\nAs any litigant\
    \ will know who has obtained a court order or arbitration award that remains unsatisfied,\
    \ an order without the means to successfully execute it is largely meaningless.([^(128)](#fn28))\n\
    \nThis chapter will consider the possibility of using blockchain to execute court\
    \ orders, from the vantage point of a litigant in South Africa, relying on South\
    \ African law.\n\nIn doing so, the chapter will first consider conventional execution\
    \ methods available to a successful litigant under South African law (Sect.5.2).\
    \ It will then consider the concept and attributes of execution on the blockchain\
    \ (Sect.5.3). It will thereafter consider two possible use cases of blockchain\
    \ execution applied in South African context and possible impediments to their\
    \ adoption (Sect.5.4).\n\n## 5.2 Traditional Methods of Execution of Judgments\
    \ Under South African Law\n\nConsider the following scenario: Party A institutes\
    \ a commercial claim in South Africa against Party B. Both companies are domiciled\
    \ in South Africa. The claim is brought either in the High Court, via conventional\
    \ litigation, or in arbitration proceedings pursuant to an arbitration agreement\
    \ between the parties. Party A, for reasons relevant to the suit, is required\
    \ to furnish Party B with security for costs.([^(129)](#fn129))\n\nParty A, now\
    \ holding a judgment against Party B, is entitled to execute on its judgment against\
    \ the assets of party B.([^(130)](#fn130))\n\nAs a starting point, `Rule 45` requires\
    \ the judgment creditor (Party A) to have issued with the registrar of the High\
    \ Court a writ of execution for attachment of the assets of the judgment debtor\
    \ (Party B).([^(131)](#fn131))\n\nThis having been done, the writ is provided\
    \ to the sheriff of the court, who is required to attend at the judgment debtor’s\
    \ place of business to “demand satisfaction of the writ and, failing satisfaction…demand\
    \ that so much movable and disposable property be pointed out as he may deem sufficient\
    \ to satisfy the said writ, and failing such pointing out…search for such property.”([^(132)](#fn132))\n\
    \nOnce the sheriff has prepared an inventory of the goods attached, they are sold\
    \ at an execution sale, by public auction to the highest bidder, to satisfy the\
    \ judgment in whole or in part.([^(133)](#fn133))\n\n`Rule 45` also makes provision\
    \ for the attachment by sheriff of incorporeal assets (such as shares or claims)\
    \ pursuant to a writ issued for the attachment of those assets,([^(134)](#fn134))\n\
    \nImmovable property may similarly be attached in terms of `Rule 46`, however\
    \ the process to do so is more onerous. In terms of `Rule 46`, before a writ is\
    \ issued for the attachment of immovable property, a further order must be sought\
    \ from the court declaring the property executable for the judgment debt owing\
    \ by the judgment debtor.([^(135)](#fn135))\n\nAs can be gleaned from the process\
    \ described above, relying on traditional methods of execution of judgments is\
    \ time consuming. For Party A to ultimately obtain satisfaction of its judgment\
    \ against Party B will take several months if not years, particularly if a writ\
    \ against movables under `Rule 45` remains unsatisfied and a court needs to be\
    \ approached for an order declaring any immovable property which Party B owns\
    \ executable. Simply obtaining a sale in execution date from the sheriff can take\
    \ several months with the actual sale date being some further months into the\
    \ future.\n\nThe process is also costly. For each attendance by a sheriff a fee\
    \ is charged according to a predetermined court tariff.([^(136)](#fn136))\n\n\
    To compound the judgment creditor’s difficulties, `Rule 45A` of the Uniform Rules\
    \ permits a judgment debtor to apply for a stay of execution for such period as\
    \ a court deems fit.([^(137)](#fn137))\n\nIn consequence, even post judgment and\
    \ leaving aside any possible appeals against the judgment handed down, if the\
    \ judgment debtor is able to raise a *bona fide* dispute to the judgment debt,\
    \ it is possible to obtain a stay of execution of the order, to the further prejudice\
    \ of the judgment creditor.\n"
