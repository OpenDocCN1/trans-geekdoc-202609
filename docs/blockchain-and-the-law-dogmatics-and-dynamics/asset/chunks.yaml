- fmt: '

    The use of blockchain technology in Governments is a subject of broad debate nowadays.
    Uses of the technology in several fields has the potential to improve public bureaucracy,
    creating accountability in administrative decisions taken.


    Blockchain could be used not only to promote transparency in decisions made by
    States, but it could also help in other TJ processes associated with the restoration
    of democratic institutions, in vetting processes, and in education.


    All vetting processes and other structural reforms of public organs could be made
    accountable to an oversight body that would have its procedures publicly available
    in an open-source blockchain system. Also, all the decisions made would be time-stamped
    and validated, in digital format, and stored on the network. In that way, all
    decisions of public organs would be publicly audited via blockchain by an oversight
    institution.


    Regarding the creation of educational programs focused on international human
    rights and humanitarian law standards for public employees as well as for future
    generations, blockchain technology can be helpful by monitoring an educational
    chronogram. A human rights educational system, based on international standards,
    and powered by blockchain and smart contracts, could be developed in these situations.
    Employees would log into the system with their identification (or digital ID),
    and lessons would be based on modules that are available via smart contracts,
    according to the user’s frequency or examination for which they are sitting, thereby
    giving the authorities better control over the educational programs of government
    employees and students within the education system.


    The measures outlined above are deeply politicized. In other words, there must
    be a political will to put these measures into practice, regain public trust,
    and promote accountability. Blockchain has the advantage of functioning on the
    procedural spectrum, providing enhanced transparency, and greater economy.


    Blockchain can also be helpful in other areas of government, such as in the fight
    against corruption.


    ### 3.3.4 Reparations


    Another essential pillar in TJ is reparations. It is not only presented in several
    international norms but also is considered an international principle by the UN
    General Assembly via Resolution 60/147 of 2006.


    Some types of reparations can be linked to the other pillars. In any case, reparations
    should always be proportional to the harm suffered. The different types of reparations
    are: restitution (of the victim’s previous conditions), compensation (of any economically
    assessable damage suffered by the victim), rehabilitation (relating to any medical
    and psychological problems that the victim may have as a result of the harm caused),
    satisfaction (in the form of truth-seeking, memorialization, an official apology,
    or judicial or administrative sanctions) and guarantees of non-repetition (by
    means of institutional reform of the State apparatus, primarily in the justice
    and security sectors).


    Despite the State’s obligation to promote their adequacy and effectiveness, however,
    reparations programs still face some challenges. They include the outreach of
    the reparations program (“completeness”).


    Reparations tend to be broader in scope, since they deal not only with individualized
    compensation measures but encompass several rights violated that materialize in
    the personal, collective, civic, as well as political, economic, social, and cultural
    spheres in psychological and concrete ways.


    Issues regarding which violations will be contemplated and the types of reparations
    that will be granted need to be taken into consideration. However, such problems
    are generally discussed with political bias and also represent a challenge to
    foreign actors that monitor TJ processes.


    In this area, too, blockchain technology applications can help to create a comprehensive
    reparations system, one that can assist with delivering aid to victims and track
    their needs.


    Due to the transparency and traceability characteristic of blockchain technology,
    reparations—especially financial reparations—can be tracked to ensure that the
    correct amount is paid to the correct victim. Notwithstanding, such capabilities
    can also be used to monitor health products and other goods destined for specific
    communities and victims, via a production chain concept.


    Regarding land restitution, blockchain technology can provide a new way to register
    land. Even when land restitution is not possible, States could provide government
    securities or vouchers as a form of compensation for the loss of the land, which
    would create a secondary market of such securities.


    One of the principal characteristics of blockchain technology is to ensure economic
    inclusivity for unbanked people.


    Regarding identification and access of victims to reparations programs, blockchain
    technology can store victims’ identifications via digital IDs, and use biometric
    identity systems (i.e., digital and iris scans).


    A system like this could be integrated into a worldwide donation procedure based
    on cryptocurrency, which would make it possible for anyone to donate to reparations
    programs. Management of such an infrastructure can be done by the `ICC`, via the
    `TFV` (Trust Fund for Victims) and States. An integrated international approach
    to deliver reparations could be a positive solution to help States to afford reparations
    measures.


    Reparations management is expensive for governments.


    ### 3.3.5 Reconciliation


    The UN Guidance Note has National Consultations as its fifth pillar.


    Reconciliation is understood as a long-term social process through which psychosocial
    healing takes place, but which needs the actors to play an active role in forming
    new relations of peaceful coexistence.


    Issues of truth-seeking, justice and accountability, socioeconomic equality, forgiveness,
    and dialogue between antagonists are essential to foster reconciliation, as is
    the outreach of actions to encompass the entire population of the region concerned.


    Despite all these issues, reconciliation is deeply dependent on contextual structure,
    which means that each case needs specific measures that will efficiently apply
    to the situation at hand.


    Understanding reconciliation as TJ’s fifth pillar means that it should be at the
    center of every TJ process. The movement of reconciliation is the movement of
    TJ, where the use of the other mechanisms must be connected to a common purpose.
    Reconciliation is not seen as a final objective but rather part of the TJ process.
    However, including reconciliation as the central pillar of TJ means that reconciliation
    is not only a process but also an end in itself.


    The other pillars of TJ can, however, work separately while not aiming specifically
    at a reconciliatory process, which is likely to lead to fragile and brief periods
    of peace.


    Blockchain technology can develop a reconciliatory umbrella network, where all
    TJ mechanisms can exchange data between themselves, in a faster and secure way,
    to understand how to achieve the common ground required for reconciliation properly.


    Blockchain technology can also assist in reconciliation indirectly by acting on
    the other pillars. All the potential uses of blockchain listed above will, indirectly,
    help in the reconciliatory process, if their approaches aim at reconciliation.

    '
