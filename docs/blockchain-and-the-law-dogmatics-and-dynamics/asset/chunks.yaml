    Marta Carmo (1) Banco BPI，里斯本，葡萄牙。邮箱：marta.carmo@novalaw.unl.pt


    ## 摘要


    本章分析了葡萄牙对加密资产的征税，以及当地税务机关对加密资产及选定相关主题采取的方法。在总结葡萄牙税制的一些相关特征后，本章讨论了企业所得税下源于加密资产利润的征税问题，以及会计准则对此类征税的重要性。随后，本章深入探讨了个人所得税的主题，特别是涉及加密货币出售、其他类型的收入以及一些实际考虑因素。最后，以
    Hedqvist 案（见第 4.5.2 节）为出发点，审视了税务机关对加密货币出售和挖矿征增值税的立场。


    **关键词：** 税收原则、税务合法性原则、加密资产界定 结束


    ## 4.1 引言


    加密资产从多个角度来看都是复杂的现象，其中包括税务角度。本章以一种非详尽但具有批判性的方式探讨了葡萄牙的税务观点，假设读者对葡萄牙税制并不熟悉。然而，它默认读者对加密资产周围的主要背景、概念和监管问题是熟悉的。因此，本章试图对典型的税务关注点提供一些见解，特别是关于葡萄牙税务机关（`TA`）的立场。


    第 4.2 节简要概述了葡萄牙税的一些的相关特征，即税务合法性原则、法律确定性原则，以及纳税人向 `TA` 请求约束性裁决的可能性。本节在描绘主要的不确定性、挣扎和……具有重要意义。


    ## 4.2 葡萄牙税制的一些相关特征概述


    ### 4.2.1 税务合法性原则及其在加密资产背景下的重要性


    加密资产是近期现实。法律体系应该足够灵活以跟上现状，但在税法领域，此类体系的灵活性受到合法性原则的限制。事实上，“主权和权力分立原则本身要求税收的种类必须由议会讨论并批准”。


    合法性原则不仅意味着税法应通过议会的批准。


    因此，例如，如果有人出售了加密货币，只有在且当税法涵盖此类收入时，其产生的收入才会被征税。但如果税法没有涵盖某一加密现象，则不存在应税事件。总之，*nullum
    tributum sine lege*（无法则不税）在加密资产背景下也非常重要。


    ### 4.2.2 法律确定性原则与约束性裁决


    税务适用中的法律确定性原则（与合法性原则相关），考虑到界定加密资产底层新现实的困难，特别是考虑到决策者并不总是能理解这些经济事件，这一原则获得了更大的性。因此，`TA`
    约束性裁决的重要性脱颖而出，因为它们澄清了对税法的解释。


    GTL 第 `68` 条允许任何纳税人就其特定的税务状况请求约束性裁决，其方法是陈述相关事实（只要这些事实未经过税务审计），并通常提供一份相应的法律框架建议。


    正如我们将在下方看到的，`TA` 已经发布了一些关于加密货币相关若干情况的约束性裁决，这使得经济参与者能够在一定程度上预判其行为的税务后果（对于与约束性裁决中案例相似的情况而言）。


