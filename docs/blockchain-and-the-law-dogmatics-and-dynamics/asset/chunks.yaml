    The DLT Pilot Regime allows an investment firm or market operator under MiFID
    II to operate a DLT TSS and allows the same exemptions as those available to operators
    of DLT MTFs and of DLT SSs, including the obligation of intermediation in the
    access of retail investors to the market infrastructure as a member or participant.


    Figure [6.2](#540017_1_En_6_Chapter.xhtml#Fig2) represents the traditional operation
    of trading and settlement services. What a DLT TSS can do to that traditional
    operation under the DLT Pilot Regime is eliminate the need for brokers and a CSD
    to access the market, custody and settlement (represented by the crosses in Fig.
    [6.2](#540017_1_En_6_Chapter.xhtml#Fig2)). With a DLT TSS, only one operator is
    needed in the value chain of a financial instruments market.


    However, it is important to consider that in some DeFi applications, no natural
    or legal person performs or provides trading or settlement services.^([^(190)](#fn190))


    Firstly, the term is used in the Settlement Layer, where a network of nodes comprises
    a permissionless blockchain through peer-to-peer connections between unrelated
    and independent agents, rather than relying on a central server or a central organization.
    This axis of decentralization is referred to as the architectural distribution.^([^(191)](#fn191))


    Secondly, the term may refer to the decentralization of crypto-assets custody
    (non-custodial crypto-assets by an intermediary). In traditional finance, custody
    is a core financial service in which the custodian holders in safekeeping assets
    on behalf of the client. Usually, this service is endorsed by the custodian’s
    reputation and the legal and regulatory framework. The core reason for using custodians
    is the security of not having the assets lost or stolen. As a result, security
    and trustworthiness become symbiotic pertaining to the safekeeping of assets.
    With the technological forthcoming of DeFi applications, the solution for proving
    trustworthiness without endorsement from central authorities is via a robust,
    resistant, and transparent technical implementation of a set of functions, in
    which only the client/user has access to the assets deposited in a particular
    smart contract.^([^(192)](#fn192))


    Thirdly, the term is referred to the decentralization of management, organization,
    and ownership of a protocol. Even though this type of decentralization is fundamental
    across all Layers, there is a clear trend of “decentralized governance” across
    DeFi protocols. Organizations that seek to emulate the operation of a corporate
    entity through code and integrate decentralized governance features within their
    protocols are usually known as Decentralized Autonomous Organizations (DAOs),^([^(193)](#fn193))


    Since DeFi is not composed of watertight compartments,^([^(194)](#fn194))


    Intermediation is fundamental for finance operations, as commercial banks, investment
    banks, stockbrokers, mutual funds, insurance companies and stock exchanges form
    the fabric of all frameworks of modern financial structures.^([^(195)](#fn195))


    As noted by Organization for Economic Cooperation and Development (OECD) and the
    Financial Stability Board (FSB), most DeFi projects often exist along a spectrum
    of centralization, depending on the stage of development of the application,^([^(196)](#fn196))


    Additionally, as stated in the latest recommendations of the Financial Action
    Force (FATF), DeFi applications often run on a distributed ledger but still have
    a central party, such as creating and launching an asset.^([^(197)](#fn197))


    Lastly, DeFi applications are likely to evolve into increasingly centralized platforms
    with the emergence of new DeFi incumbents.^([^(198)](#fn198))


    In conclusion, DLT Pilot Regime can cover some DeFi categories, such as DEXs and
    stablecoins. Naturally, it will be impossible to have “true” decentralized applications
    within the DLT Pilot Regime because this requires an operator to be liable for
    the provision of services. Even so, this will be an important step for disintermediation
    and fostering non-custodial business models.

