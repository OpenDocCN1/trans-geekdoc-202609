    \ Blockchain and the Law Information Technology and Law Series 37[https://doi.org/10.1007/978-94-6265-579-9_6](https://doi.org/10.1007/978-94-6265-579-9_6)\
    \ \n\n# 6. The DLT Pilot Regime and DeFi\n\nGuilherme Maia and João Vieira dos\
    \ Santos\n(1) BCAS, Floor 1, Mompalao Buildings, Tower Street, Msida, MSD 1825,\
    \ Msida, Malta (2) Lusófona University and Portuguese Securities Market Commission\
    \ (CMVM), R. Laura Alves 4, 1050-124 Lisbon, Portugal\n\nGuilherme Maia (Corresponding\
    \ author) Email: `guilhermeinvestimento@gmail.com`\nJoão Vieira dos Santos Email:\
    \ `p6583@ulusofona.pt`\n\n## 6.1 Background of the DLT Pilot Regime\n\n## 6.2\
    \ What is the DLT Pilot Regime?\n\n## 6.3 What Is DeFi?\n### 6.3.1 DeFI Architecture\n\
    ### 6.3.2 DeFi Categories\n\n## 6.4 How Does the DLT Pilot Regime Match with DeFi?\n\
    \n## Abstract\n\nThis chapter discusses the new DLT (Distributed Ledger Technology)\
    \ Pilot Regime issued by the EU, considering its use and applicability regarding\
    \ DeFi (Decentralized Finance). As set out in the ESMA (European Securities and\
    \ Markets Authority) Report on crypto-assets, the authorities are having difficulties\
    \ interpreting the existing legal requirements, discussing their application to\
    \ crypto-assets and DLT structures. The DLT Pilot Regime is intended to operate\
    \ in a way akin to a regulatory sandbox, permitting and framing the operation\
    \ of market infrastructures that process trades in crypto-assets qualified as\
    \ financial instruments and that otherwise would not be allowed to operate or\
    \ would be subject to excessive and burdensome requirements. The regime aims to\
    \ create legal certainty in view of the rules currently defined for secondary\
    \ markets in financial instruments, particularly if these rules are fully suited\
    \ to DLT and crypto-assets while also ensuring the protection of investors, market\
    \ integrity and financial stability.\n\n**Keywords:** DLT, DLT pilot regime, Blockchain,\
    \ Capital markets union, Crypto\n\n## 6.1 Background of the DLT Pilot Regime\n\
    \nThe European Commission on 24 September 2020 adopted a new package on “Digital\
    \ Finance”, which includes digital finance and retail payments strategies, as\
    \ well as legislative proposals on crypto-assets and digital resilience. The first\
    \ need concerns introducing rules in an area that is not yet regulated, concerning\
    \ crypto-assets that do not qualify as other instruments of the European Union's\
    \ financial legislation. The second need is related to adapting some rules applicable\
    \ to crypto-assets that qualify as financial instruments to respect the principle\
    \ of technological neutrality and not create obstacles to innovation.\n\nFor the\
    \ first case, the European Commission has presented a proposal for a European\
    \ Regulation on Markets in Crypto-assets, better known as `MiCA`. This last proposal\
    \ intends to implement an approach similar to that of a regulatory sandbox with\
    \ a more specific focus on only trading in crypto-assets qualified as financial\
    \ instruments on market infrastructures. \n\nAs set out in the ESMA Report on\
    \ crypto-assets, the authorities encounter difficulties interpreting the existing\
    \ requirements when they qualify as financial instruments. Some rules are unsuitable\
    \ for distributed ledger technologies (hereinafter also referred to as `DLT`)\
    \ and are mainly related to the secondary market. This understanding has some\
    \ correspondence in the market, where several public offerings of crypto-assets\
    \ qualified as financial instruments have already been made; however, experiences\
    \ in the secondary market are much scarcer.\n\nAddressing these setbacks in the\
    \ secondary market for crypto-assets qualified as financial instruments could\
    \ boost the primary market by ensuring more liquidity for these instruments issued\
    \ and traded through distributed registration technologies. The proposal itself\
    \ explicitly addresses this issue by stating in one of its recitals the following:\
    \ “Without a secondary market able to provide liquidity and to enable investors\
    \ to buy and sell such assets, the primary market for crypto-assets that qualify\
    \ as financial instruments will never expand in a sustainable way”.\n\nThe negotiations\
    \ on this proposal have ended, and on 2 June 2022, the `Regulation (EU) 2022/858`\
    \ of the European Parliament and the Council (hereinafter referred to as `DLT\
    \ Pilot Regime`) on a pilot regime for market infrastructures based on distributed\
    \ registry technology and amending `(EU) No 600/2014` and `No 909/2014` was published.\n\
    \n## 6.2 What is the DLT Pilot Regime?\n\nThe `DLT Pilot Regime` allows market\
    \ infrastructures using distributed ledger technologies to be temporarily exempted.\
    \ Additionally, it is an optional regime, not preventing financial market structures\
    \ such as multilateral trading facilities (`MTFs`), organized trading facilities\
    \ (`OTFs`), central securities depositories (`CSDs`) and central counterparties\
    \ (`CCPs`), from carrying out their trading and post-trading activities for crypto-assets\
    \ that qualify as financial instruments. The `DLT Pilot Regime` allows ESMA and\
    \ competent authorities to gain experience on the specific opportunities and risks\
    \ of distributed ledger technologies.\n\nThe de-facto scope of the `DLT Pilot\
    \ Regime` is limited to the conditions applicable to the operation of market infrastructures\
    \ based on `DLT`, the authorizations for their use and the supervision of competent\
    \ authorities and ESMA. In terms of a subjective matter, the Regulation applies\
    \ to investment firms, market operators and `CSDs`.\n\nOnly such entities may\
    \ operate `DLT market infrastructures`, with one important exception: new entrants.\
    \ It was determined that access to the `DLT Pilot Regime` should not be limited\
    \ to incumbents, so an entity that is not authorized under `Regulation (EU) No\
    \ 909/2014` or `Directive 2014/65/EU` may apply for an authorization under that\
    \ Regulation or Directive, respectively, and at the same time for a specific authorization\
    \ under the `DLT Pilot Regime`—Articles `8(2)`, `9(2)` and `10(2)`.\n\nIn such\
    \ cases, the national competent authority should not assess whether that entity\
    \ meets the requirements of `Regulation (EU) No 909/2014` or `Directive 2014/65/EU`\
    \ for which an exemption under the `DLT Pilot Regime` has been requested. This\
    \ means those entities are legal persons with limited authorizations as they can\
    \ only operate `DLT market infrastructures` in accordance with the `DLT Pilot\
    \ Regime`. Their authorization should be withdrawn upon the expiry of their specific\
    \ authorization unless the entities submit a complete application for authorization\
    \ to be a `CSD` under `Regulation (EU) No 909/2014` or an investment firm or a\
    \ market operator under `Directive 2014/65/EU`.\n\nThe `DLT Pilot Regime` introduces\
    \ this new status regarding the `DLT market infrastructures`—Article `2`, point\
    \ `5`. It includes `DLT MTFs`, `DLT SSs` (settlement systems) and `DLT TSSs` (trading\
    \ and settlement systems). Also important for this new status was the introduction\
    \ of another concept, that of `DLT financial instruments`, which correspond to\
    \ financial instruments that are issued, recorded, transferred, and stored through\
    \ a distributed ledger technology—Article `2`, point `11`.\n"
