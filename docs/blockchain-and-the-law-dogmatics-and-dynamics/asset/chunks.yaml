    # 3. 区块链的局限性是什么？关于在过渡正义过程中使用区块链的思考


    Renato Gomide M. de Almeida (1) Eça de Queiroz Street, 279, Ap 4 Vila Mariana,
    São Paulo, SP, 04011-031, Brazil Renato Gomide M. de Almeida Email: `renato.g.m.almeida@gmail.com`


