- fmt: "\nThe position is no different should the parties have arbitrated their dispute.\
    \ Awards issued in arbitration proceedings are not automatically executable. Rather,\
    \ `Sect. 31` of the `Arbitration Act`.\n\nIn our example therefore, Party A would\
    \ be required to institute a court application, which Party B would be entitled\
    \ to oppose, seeking that the award in its favour be made an order of court. Only\
    \ once this has been done, will Party A be able to execute upon the award (now\
    \ encapsulated in a court order), relying on `Uniform Rules 45` and `46`.\n\n\
    Assuming further that Party B owns assets beyond the jurisdiction of South African\
    \ courts, Party A’s position is exacerbated. To attach those assets, Party A would\
    \ be required to seek the recognition of its high court judgment or arbitral award\
    \ in that jurisdiction. If the judgment or award is recognised, the traditional\
    \ means of execution in that jurisdiction would have to follow. Conversely, if\
    \ the judgment or award is not recognised for whatever reason, there is no further\
    \ recourse available to Party A in that jurisdiction. \n\nIn summary therefore,\
    \ traditional means of execution as provided for in the `Uniform Rules` do not\
    \ lend themselves to swift execution of judgments, often rendering them unattractive\
    \ to litigants.\n\nIf that is so, could on-blockchain execution offer an alternative?\n\
    \n## 5.3 Smart Contracts\n\nThe answer, it is proposed, lies in the use of self-executing\
    \ ‘smart contracts’ which operate on a blockchain protocol. Before exploring the\
    \ proposal in practical terms, it is useful to consider how smart contracts function\
    \ and what their capabilities are.\n\nThe concept of smart contracts originated\
    \ in 1994, by the publication of Nick Szabo’s ‘Smart Contracts’ paper.\n\nWhilst\
    \ there is no unanimity as to the legal definition of smart contracts,\n\nMcKinney\
    \ et al. identify three characteristics that smart contracts share.\n\nA smart\
    \ contract is therefore not a contract in the traditional sense but is rather\
    \ a computer program that executes a pre-defined transaction upon the happening\
    \ of certain conditions. An example of this might be a purchase of shares transaction,\
    \ in which one party sells shares at a defined price, which another party wishes\
    \ to purchase. A smart contract may be capable of matching the seller’s offer\
    \ with the purchaser’s acceptance, and the moment the match takes place the transaction\
    \ is self-executed by means of the shares being transferred to the purchaser’s\
    \ brokerage account and the seller’s brokerage account being credited with the\
    \ proceeds.\n\nAn important feature of smart contracts for purposes of the present\
    \ argument is that they are built on a blockchain protocol.\n\nSmart contracts\
    \ can be used for allocating digital currency between two parties upon the requirements\
    \ of the contract being fulfilled.\n\nThe smart contract (i.e., the execution\
    \ of its code) can be triggered with reference to specified and trusted third\
    \ party ‘off chain’ information, making use of blockchain ‘oracles’. Oracles are\
    \ entities that connect blockchains to systems external to the blockchain, enabling\
    \ smart contracts to execute based upon inputs from the real world.\n\nKoulu explains\
    \ the concept of smart contract functioning by way of a practical example of a\
    \ weather bet.\n\n## 5.4 Application in the South African Legal Context\n\nApplying\
    \ the concept of smart contracts to the question of expedited execution of court\
    \ orders in South Africa, two primary use cases come to the fore.\n\n### 5.4.1\
    \ Execution\n\n#### 5.4.1.1 Implementation of the Smart Contract\n\nSmart contracts\
    \ may be harnessed by litigating parties to obviate the need for execution in\
    \ terms of `Uniform Rules 45` and `46`, by binding the parties to judgment enforcement\
    \ through smart contract execution, prior to the litigation having been finalised.\n\
    \nGoing back to our example, Party A and B could, at inception of their dispute,\
    \ agree that the judgment debt will be paid in cryptocurrency through the execution\
    \ of a smart contract. When exactly this will be agreed depends on the circumstances,\
    \ save that it will have to be prior to judgment being issued. Likely, if such\
    \ an agreement can be reached, it will be done at inception of the suit, when\
    \ summons is served, or the arbitration agreement is signed. (If left too late,\
    \ a party who felt that the matter was not progressing in its favour may be reticent\
    \ to agree to smart contract execution).\n\nEach party can open a wallet into\
    \ which the necessary amount of cryptocurrency for purposes of the suit is transferred\
    \ (alternatively the amount is transferred to the smart contract). The parties\
    \ would then be required to code or have coded a smart contract which, upon notification\
    \ by the oracle of the outcome, would make payment to Party A of an amount equal\
    \ to the judgment if judgment is obtained in favour of Party A, or if the suit\
    \ is dismissed, makes payment to Party B of the security for costs.\n\nUpon notification\
    \ by the oracle of the final result the smart contract will execute and give effect\
    \ to whichever of the scenarios has come to pass. The smart contract will have\
    \ to make provision for the delivery of notices of appeal or the determination\
    \ of any appeals, prior to execution, should the possibility of appeal be available.\n\
    \nTo be clear, agreeing on this course of action has the result that the usual\
    \ court sanctioned execution steps under Rules `45` and `46` are bypassed completely.\
    \ What is proposed is ultimately no different to a court order or arbitration\
    \ award being issued and the losing party complying with the outcome voluntarily.\n\
    \nThe main distinction is that, in using a smart contract to give effect to the\
    \ judgment, such voluntary compliance is built into the process up front, ahead\
    \ of any order being issued.\n\n### Legal and Practical Considerations\n\nCrucially,\
    \ the parties must be aware that a court or arbitral tribunal will not oversee\
    \ the process of smart contract agreement or be involved in any manner in its\
    \ formation, for three reasons. First, a court will not concern itself with execution\
    \ prior to the outcome of a dispute, save if it is specifically approached to\
    \ do so (for instance for the issuing of a *Mareva* injunction).\n\n### 5.4.2\
    \ Practical Impediments to Implementation of Blockchain Execution of Court Orders\n\
    \nWhile the proposal of smart contract execution outside of the ambit of the `Uniform\
    \ Rules` may sound simple in theory, several practical difficulties present themselves.\n\
    \nThe first is that the process is by its nature technical and novel. The litigants\
    \ may need to adjust to the concept of permitting code to execute the result of\
    \ litigation and be comfortable with trusting the blockchain process to give effect\
    \ appropriately to the result. They may be put off by the concept of having to\
    \ code the smart contract required from scratch (whether this is done by the litigants\
    \ themselves or an external party). Interestingly, it appears that as at February\
    \ 2021 there are already developments under way to standardise the technology\
    \ that may in due course permit litigants to use a standardised program with an\
    \ accessible user interface to code their smart contract.\n"
