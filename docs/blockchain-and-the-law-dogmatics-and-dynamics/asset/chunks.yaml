- fmt: '

    This chapter discusses the opportunities and perils associated with adopting blockchain-based
    systems to solve longstanding problems in elections. The chapter covers some of
    the historical problems in elections and how they were solved, as well as some
    of the benefits of blockchain technologies. Several attempts to apply blockchain
    solutions to the election domain are analyzed and potential paths forward are
    suggested.


    **Keywords:** Blockchain, Elections, Crypto, Distributed ledger technology, Election
    administration, Election systems, Political science, Nelson Rosario,


    Founder and Partner at Rosario Tech Law, LLC and Adjunct Law Professor at Illinois
    Tech, Chicago-Kent College of Law, 435 W. Diversey Pkwy, Suite 1A, 60614 Chicago,
    IL, USA


    End Abstract


    ## 2.1 Introduction


    As the old saying goes: it is the counting of votes that matters, not the votes
    themselves. This cynical saying is generally attributed to the former Soviet dictator
    Joseph Stalin, though it is likely Stalin never said this as the provenance of
    the saying is contested, but even so the sentiment crosses generations.^([([^(22)](#fn22))


    The provenance of our votes, and the assurance that comes with knowing that your
    vote `counted` the way that you intended is what builds trust in elections and
    their results. In this environment, many people see blockchain technology as a
    solution to build out a digital system of voting. As one example, former US Presidential
    candidate Andrew Yang famously suggested moving voting in the USA to a mobile-based
    blockchain system.^([([^(23)](#fn23))


    Blockchains are an effective solution to the “double-spend” problem^([([^(24)](#fn24))


    According to IBM, a blockchain is “a shared, immutable ledger that facilitates
    the process of recording transactions and tracking assets in a business network.”^([([^(25)](#fn25))


    Although blockchains may be an effective solution for the “double-spend” problem,
    as applied to cryptocurrencies and other digital assets, they are not, on their
    own, a good solution for electronic voting. The reality is that blockchain technology
    requires a lot of additional changes to an electoral system to add value.


    This chapter begins by looking at the intersection of blockchain technology and
    elections. The relevant background on both blockchain and elections is explored
    covering their history, characteristics, as well as some benefits and drawbacks.
    Then the chapter turns to the reasons for the growing interest in using blockchain
    for elections. In particular, the current state of the art regarding blockchain
    and elections is examined, and the potential benefits and drawbacks of using this
    technology for voting systems is explored.


    The key requirements for elections and the technological deficiencies of blockchains
    to solve elections are explained to demonstrate to the reader that blockchains
    are not a good solution for electronic voting. By the end of this chapter, readers
    will have a better understanding of how technology, in particular blockchain technology,
    may or may not be used in elections and the potential implications of using this
    technology moving forward.


    ## 2.2 Elections


    An election is one of the key elements of a political system, and instituting
    any changes to an election process requires a nuanced understanding beyond what
    many people may realize. While individuals have little difficulty envisioning
    the act of voting on the day of the election, the massive administrative structure
    necessary to facilitate such an event is often overlooked. Election systems have
    developed over time, resulting in the complex systems we see today, with historical
    antecedents in civilizations like Greece and Rome. For example, Athens around
    the 5th century BCE used a direct democracy-style system, while the Roman Republic
    employed elections to select a variety of officials across its government.


    The evolution of elections over time has led to various types of elections, including
    general elections, local elections, and referendums. However, modern elections
    have become more complex and incorporate democratic systems such as first-past-post^([([^(26)](#fn26))


    Elections are typically characterized by suffrage, secret ballots, competition,
    and administration. For example, there must be some measure of suffrage for citizens
    to participate. The ballots used to cast vote should be kept secret to protect
    individuals’ privacy as well as mitigate reprisals. Elections should be free and
    fair and occur at regular intervals.


    It is essential to understand the complexity of election systems, including their
    historical context and development, to appreciate the challenges involved in ensuring
    they are conducted fairly and transparently. While many individuals may take for
    granted fundamental tenets of democracy, it is critical that lawyers, government
    regulators and academics remain attentive to the election process to ensure it
    operates efficiently and effectively.


    As already discussed, elections have long been considered a cornerstone of democratic
    societies, providing citizens with a mechanism to elect their leaders and actively
    participate in the political process. Elections provide a variety of very important
    benefits to society. One of the key benefits of elections in modern democracies
    is the representation they afford to citizens. Through the democratic process
    of voting, citizens are empowered to select officials whose policies and positions
    align with their values, beliefs, and preferences. As such, elections serve as
    a critical means of ensuring that the government is truly representative of the
    people it serves.


    In addition to representation, elections also play a critical role in promoting
    accountability among elected officials. By providing constituents with the power
    to select their leaders, elections create a system of checks and balances that
    ensures elected officials are accountable to the people they serve. This accountability
    ensures that elected officials remain responsive to the needs of their constituents,
    promoting good governance and reducing the likelihood of corruption and abuse
    of power.


    Elections also play a vital role in maintaining political stability by providing
    a peaceful means of transferring power. Regularly held elections may ensure that
    political power is not concentrated in the hands of a single group or individual,
    and may reduce the likelihood of political instability, unrest, or violence. The
    peaceful transition of power through elections also helps promote confidence in
    the political process and create a sense of continuity and stability within the
    government.


    Finally, elections may confer legitimacy upon elected officials, as they are chosen
    by the people to represent their interests. The ideal way to achieve this is by
    providing a transparent and fair process for selecting leaders, and in that way
    elections help ensure that elected officials are perceived as legitimate representatives
    of the people they serve. This legitimacy is critical for promoting stability,
    building public trust in the government, and promoting effective governance. Ultimately,
    elections are a critical component of democratic societies, playing a vital role
    in promoting representation, accountability, stability, and legitimacy.

