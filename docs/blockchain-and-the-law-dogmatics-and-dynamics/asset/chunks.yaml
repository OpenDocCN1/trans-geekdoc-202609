    In the end, I hope to be able to explain and expose the significant legal challenges
    posed by the growing adoption of blockchain and present some thoughts on how law
    and the market can evolve from here. Given what has already been written on the
    topic, I will be concise and generalize some points, particularly when discussing
    crypto assets and smart contracts—other chapters in this book will take on those
    subjects in greater depth.


    ## 1.2 The Legal “Phenomenon”


    If we wish to be simple—and, given the limits of our chapter, simplicity is a
    must—an immediate definition of what the law is would be more or less the following.
    Law is a system of rules in force within a particular community, laid down by
    an authoritative institution, which organizes individual and collective behavior
    according to a criterion of justice. Of course, it is difficult for any definition
    of the law, even the most straightforward and immediate, not to succumb to the
    second reading when we assess all that the definition includes. What do we mean
    by rules? What is a community? What is an authoritative institution? Why do we
    need to organize our behavior? Moreover, what is justice? Let us then deconstruct
    the sentence for a more comprehensive view (but still somewhat simple and practical)
    of the legal phenomenon.


    Law is a system of rules—by this expression, I mean that law is a set of norms
    of linguistic statements that, in general, are prescriptions.^([⁵](#fn5))


    The purpose of legal norms is to establish some order, that is, some space of
    existence where expectations concerning external individual and collective behavior
    are set.^([⁶](#fn6))


    Order, stated as such, is a very formal and empty concept. Any legal order (the
    set of rules of a given political community or community) is established under
    specific values and principles.^([⁷](#fn7))


    The following considerations are the most complicated, for they deal with the
    question of law being the product of a will. When stating that an authoritative
    institution enacts a law, what I mean (and what, I suspect, readers immediately
    assume) is that law is a form of political action.^([⁸](#fn8))


    There is a more social view of the law that is not so much concerned with exercising
    the power of top-down ruling authority but with the collective expression of law
    emerging from the community through routine interactions. The social expression
    of law is called custom, whereby people act according to a collective perception
    of what is legally mandatory, which can be at odds with positive law (e.g., law
    made by the rulers).^([⁹](#fn9))


    Therefore, we can say that the legal phenomenon consists of rules of conduct,
    their meaning, application, and upholding within a political community. Some rules
    are politically made; they are enacted, and the ruling authorities of the community
    guarantee their efficacy. Other rules, however, can be born out of a collective
    agreement or through repeated and regular interaction with the community members.
    A (liberal) legal order will have imperative ruling while allowing for large spaces
    of private ordering.


    The legal operation (enactment, enforcement, and adjudication of the law) is done
    by each community within its territory (it is also possible for communities to
    allow other external entities to exercise legal powers over them, e.g., federations,
    international organizations under certain conditions and concerning limited policy
    areas). The set of fundamental legal problems and general answers are fundamentally
    the same in every State: relations between the collectivity and the political
    power are ruled by a constitution that establishes the rights and duties of the
    governed and the government. In contrast, relations between the community members
    follow the logic of free commitment under knowledgeable consent, with liability
    rules applicable for actions that question or violate commitments people entered
    with one another. There are many differences among each community—for example:
    what constitutes free commitment under knowledgeable consent, under which liability
    arises, and the degree of fault that is necessary to show, among other rules—because
    each community shall have its version of what is right and just, within its specific
    context. From a realist and a rather essentialist point of view, these are the
    primary structural points concerning law to fulfil its function of orienting behavior
    and enabling an orderly life.


    ## 1.3 The Blockchain “Phenomenon”


    Blockchain is, first and foremost, a technology: a form “of practical, especially
    industrial, use of scientific discoveries”^([^(10)](#fn10))


    The most famous blockchain protocol is Bitcoin. The technical and ideological
    importance of the Bitcoin protocol should not be underestimated. Most of what
    is described as blockchain, its principles, benefits, and its problems and risks
    refer to the Bitcoin protocol’s characteristics. The basic assumption is widely
    known: Bitcoin established a system for exchanging value (in its case, value refers
    to information regarding the property of a token known as Bitcoin that would serve
    as a global digital currency) among people through a decentralized peer-to-peer
    network. By decentralized, the idea is that there is no intermediary between the
    parties to the transaction: the network and its users control the process. Two
    people in the network with cryptographic identities agree to exchange their tokens
    and communicate their intention to the network by signing off on the transaction
    with their respective cryptographic identities. The network receives all transactions,
    and as soon as another user (called the miner) solves an automatically generated
    puzzle, a new block in the network is formed, and the transaction is inserted,
    timestamped, and put in chronological order. As soon as users confirm the block
    within the chain, the transaction is sealed, and anyone can see the block and
    check the information but not change it.^([^(11)](#fn11))


    The decentralization claim in Bitcoin has a second, significant meaning: the lack
    of ruling authority, such as a board of directors. The anonymity of its creator,
    Satoshi Nakamoto, helped to insufflate Bitcoin and to leave its management in
    the hands of the community. This means that protocol governance is highly frictional,
    as some events have shown, such as the `SegWit` update and the `blocksize wars`,^([^(12)](#fn12))


    The majority of blockchain protocols that followed were developed differently,
    even if they took technical and ideological inspiration from Bitcoin and Nakamoto.
    A common framework of terms is used to distinguish between first-generation protocols
    (basically, Bitcoin) from second-generation (Ethereum) and third-generation (e.g.,
    Cardano, Algorand).^([^(13)](#fn13))


    For second and third-generation protocols, decentralization exists only in the
    first meaning. In the second meaning, its existence is less obvious. Although
    there is, supposedly, no central formal authority over the protocols, the protocol
    founders are “public” figures, usually with a solid online presence and important
    commercial aspirations. In some cases, protocols are supported by private entities
    (foundations, companies) with sufficient funds and human capital (mainly developers)
    to act and influence how the protocol is to be run. For example, the way the Ethereum
    foundation supported a hard fork to change a bug in a code^([^(14)](#fn14))

