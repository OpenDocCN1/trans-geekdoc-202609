    Nelson M. Rosario 在第 2 章节中探讨了基于区块链的结构在投票中的潜力与局限性。在第 3 章节中，Renato Gomide Martinez
    de Almeida 讨论了区块链在转型正义过程中的应用，探索了其在刑事起诉、真相委员会、赔偿、恢复民主机构以及和解过程中的作用。在第 4 章节中，Marta
    Carmo 关注了葡萄牙对加密资产税务收处理的演变，解释并解构了葡萄牙税务当局采取的方法，这些方法导致该国在某些媒体圈中被称为“加密避税天堂”。


    在第 5 章节中，George Daniel Raath 深入探讨了南非背景下执行判决中的区块链问题。


    João Vieira dos Santos 和 Guilherme Maia 在第 6 章节中考虑了欧盟建立分布式账本技术（DLT）试点机制的立法计划，并评估了其对
    DeFi 产品的可能影响。Anjeza Beja 和 Bernardo Correia Barradas 在第 7 章节中研究了新型央银行数字货币（CBDC）及其对匿名性的影响。在第
    8 章节中，Ágata Ferreira 通过讨论智能合约与法律之间的特定关系结束了本书，探讨了智能合约的优势并应对了围绕其实施和使用的学术法律争论。


    总而言，本书为区块链与法律的交叉领域提供了全面的概述。它深入了区块链技术的法律影响以及在现有法律框架下的处理方式。它还探索了区块链重塑法律格局的潜力，以及法律如何应对日益增长区块链的使用不断演进。这本书为区块链与法律之间复杂的关系提供了宝贵的见解，使读者对区块链的法律影响以及如何利用它造福社会有更全面的理解。


    我们感谢所有作者对本书做出的卓越贡献，并特别感谢 T.M.C. Asser Press 的 Frank Bakker 和 Kiki van Gurp 接受本书的出版，并感谢他们在编辑过程中所有的耐心。我们祝所有读者阅读愉快，获益匪浅。


    Francisco Pereira Coutinho Bernardo Correia Barradas Martinho Lucas Pires 葡萄牙，利斯本
    2023 年 5 月


