    ## 摘要

    智能合约引发了许多有趣的法律问题。目前正在进行的法律辩论涉及与智能合约相关的潜在法律陷阱，包括有效且具有约束力的法律合同的存在、区块链记录的不可篡改性与合同缺陷之间的协调、准据法和适用管辖权、消费者保护、反洗钱/打击恐怖融资（AML/CFT）要求、自动化且不可停止执行的影响，以及部署在无边界去中心化区块链网络上的智能合约的隐私和保密问题。本章概述了智能合约最常提到的优点，并强调了围绕智能合约的学术法律辩论的激烈。它还介绍了迄为止为应对智能合约现象所采取的一系列立法计划。


    **关键词：** 智能合约、合同法、自动化、权利与义务、私法。


    ## 8.1 引言

    智能合约正被部署于多个领域，包括金融领域、公共部门、供应链管理，以及汽车、房地产、保险和医疗保健行业。


    尽管合同法是一个相当发达的法律领域，且合同自由在大多数司法管辖区都得到了广泛认可，智能合约仍然引发了许多有趣的法律问题。


    第一部分介绍了智能合约的起源及其随着区块链技术的黎明而复兴。第二部分解释了智能合约最常被提到的优点并考察了其价值。第三部分概述了正在进行的法律学术辩论。第四部分分析了不同司法管辖区选定的智能合约立法计划。最后一部分提供了结论性意见。


    ## 8.2 起源

    计算机科学家兼法律理论家尼克·萨博（Nick Szabo）在 20 世纪 90 年代首次创造了“智能合约”这一术语，并以自动自动售卖机作为一个“典型的现实生活案例，我们认为它可以是智能合约的原始祖先”。


    智能合约存在于区块链技术之前，但区块链使得智能合约从简单的自动化合约进步为构建在去中心化平台上并由区块链生态系统支持的完全自主执行和自我履行的合同。


    ## 8.3 优点

    智能合约的支持者强调了自动化、标准化和透明化属性带来的效率优势。


    智能合约的乐观者设想通过专门使用智能合约，商业活动可以“避免合同起草的高成本、司法干预、机会主义行为以及书面语言固有的模糊性”。


    对于自由主义者来说，智能合约由于其自包含的规则以及不受国家干预的能力，被认为是个人自我决定和自主的体现。


    费尔菲德（Fairfield）指出，智能合约的去中间化将消费者保护从法院（法院历史上“长期拒绝执行消费者所提供的合同条款”）转移到了自动化的消费者级购买代理。


    ## 8.4 法律辩论

    这种在点对点和不可篡改的基础上自动自主执行合同条款的自执行软件的想法在法律上仍然存在问题。法律辩论通常由代码应被视为一种“外来法律系统”的主张引发。


    ### 8.4.1 智能合约是合同吗？

    法律界一直在努力智能合约在法律意义上是否为合同。这种困惑很大程度上源于术语的误解以及法律与技术的重叠，导致了激烈的学术辩论。其中一些甚至产生了对智能合约的反驳，认为它们既不是智能的也不是合同。


    一些作者认为，与传统合同不同，智能合约遵循简单的条件 `if–then` 逻辑，而传统合同的矩阵是基于“要约与承诺”的二进制序列中的共识连接，即意图的合。


    每个法律体系的合同法基础决定了创建一个有效且具有约束力的合同需要什么。普通法（如英国法）要求三个要素：要约、承诺和对价，以构成有效合同的形成。英国管辖权工作组（UKJT）近期表示，“智能合约满足这些要求的能力与更传统的或自然语言合同一样好，因此智能合约能够具有合同效力”。


    ### 8.4.2 代码即法律？

    据描述，“代码即法律”（Code is law）成为一些智能合约支持者维护的自由主义理想，根据这一观点，仅凭技术本身就提供了足够的监管参数来管理智能合约。“代码即法律”这一说法由莱西格（Lessig）创造，从以后被用来表示底层软件代码事实上成为了网络空间架构和基础设施的监管者。代码作为网络空间的监管者并不是一个新观点。里登堡（Reidenberg）描述了网络空间的自我监管。


    米克（Mik）反驳了“代码即法律”适用于智能合约的命题，认为此类观点“错误地假设在技术上编码交易的每一个方面是可行的，并且在法律上排除法律系统的运行是允许的”。


    在区块链技术出现后，德菲皮（De Filippi）和赖特（Wright）将“代码即法律”的概念向前推了一步，引入了加密法（Lex Cryptographia）的概念，这是一种新的法律范式，代表“个人自由和解放理想可能实现的世界”。


    使用图灵完备脚本编写的区块链智能合约允许任何自然语言表达式翻译成代码，这为网络空间自我监管的概念引入了新的维度。加密法被定义为法律的新子集，即“通过自执行智能合约和去中心化（自主）组织管理的规则”。在这种模型中，“法律和代码可能会合并，因此人们违反法律的唯一方法就是有效地破解代码”。为了促进法律融入代码，法律可以向类代码的表达演进，这可能导致“法律逐渐变成代码”。

