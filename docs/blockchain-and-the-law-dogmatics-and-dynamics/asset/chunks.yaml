    University of Technology, Faculty of Administration and Social Sciences, Warsaw,
    Poland

    - **Renato Gomide M. de Almeida**: São Paulo, SP, Brazil

    - **Martinho Lucas Pires**: Católica Law School, Lisbon, Portugal

