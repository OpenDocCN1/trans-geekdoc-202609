  raw: "Elections are the bedrock of modern democracy, and our modern world is a technological\
    \ one with problems unimaginable to the Ancient Greeks and Romans. Given the stakes\
    \ involved and the ever-growing threat of cyber-attacks on election systems around\
    \ the world it is understandable that governments wish to employ seemingly more\
    \ secure methods of voting. That said, not every technological tool is necessarily\
    \ a good fit for every problem.\n\nBlockchain technology allows for the creation\
    \ of append-only ledgers of transaction data that are tamper-evident, tamper-resistant,\
    \ public and auditable, and enable new forms of human cooperation. Voting is a\
    \ kind of double-spend problem where you do not wish to allow people to vote more\
    \ than once. The siren song of the blockchain fixing elections is forgivable,\
    \ but governments must take care. Quick fixes rarely are quick or fixes. The blockchain\
    \ may be a good use of creating digital cash, but that does not mean it can obviate\
