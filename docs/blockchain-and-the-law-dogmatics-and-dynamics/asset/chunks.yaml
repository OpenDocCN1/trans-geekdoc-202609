    对于“你更倾向于哪种匿名性（交易对手还是第三方）”这个问题，如果让让他们进行选择，大多数受访者（约 39%）表示他们倾向于完全匿名。在在这两种类型之间选择的人中，只有
    10%倾向于交易对手匿名，30%倾向于第三方匿名。在这一类别中，人们似乎更关注支付服务提供商收集和管理的信息类型，而不是由资金接收方所收集的信息。21%的受访者对任何选项都持中立态度。


    最后一个问题是关于受访者对央行自身发行 CBDC 时匿名性的忧虑。考虑到很大一部分受访者来自中央银行，这一问题的结果并不出人意料。最青青的答案（58%）是，他们意识到支付交易中匿名性相关的风险（例如反洗钱/反恐怖融资），因此他们希望匿名性仅适用于低于特定阈值的支付。这似乎与不同司法辖区为了反洗钱和反恐怖融资目的而对现金支付采取的方法相同。尽管如此，仍有
    26%的参与者表示，他们希望 CBDC 像现金一样完全匿名，这样央行就无法追踪或监控他们的交易或消费习惯。这一结果与第一个问题的结果一致，即 21%的人回答说他们担心隐私，且不想与任何支付平台共享个人数据。16%的受访者完全接受非匿名
    CBDC 的可能性，因为他们认为这是央行解决经济中非正规化问题的良好机会。根据这项调查，我们提取出以下结论：


    > 首先：匿名性似乎并不是我们受众的普遍关注点，因为与监管的支付服务提供商共享真实身份并不是新鲜事。他们已经习惯了与支付服务提供商共享个人数据，尽管大多数人更倾向于信用机构。


    > 其次：如果人们可以选择，他们会倾向于进行完全匿名的交易，但另一方面，他们理解不这样做对整体经济的重要性。因此，目前适用于现金支付的反洗钱/反恐要求（要求对超过特定阈值的支付进行身份识别）被他们认可为一种解决方案，并预计也将应用于
    CBDC。这对于计划直接向公众发行 CBDC 的央行来说，这可能更加棘手，因为它们必须建立自己的监控结构和能力来确保这一点。


