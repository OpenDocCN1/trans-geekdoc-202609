    Additionally, the principle of good faith and trust is safeguarded in article
    104(1) of the `GTL`. This legal provision establishes that the `TA` can be sentenced
    to a financial penalty under the rules on litigation in bad faith if it acts in
    court against the content of binding information previously provided to the taxpayer
    or when its behavior in the process differs from that usually adopted in identical
    situations. However, there are practical limitations on binding rulings: the `TA`,
    pursuant the issuance of a binding ruling is not obliged to comply with all situations
    that fall within the scope of that same guideline. On the contrary, the connection
    of the `TA` to the content of the same is an *inter partes* connection since the
    `TA` is forbidden to proceed in a direction different from the ruling only in
    relation to the specific case of the requesting taxpayer.^#fn90)


    In short, despite the practical relevance of the existing binding rulings, the
    `TA` is only bound before the individual taxpayer who made the request and only
    regarding the facts covered by said request (in fact, a taxpayer may appeal against
    the ruling under article 68(29) of the `GTL`). Therefore, one needs to be careful
    when reading and interpreting a binding ruling, despite the “reprehensibility
    of changes in behavior” by the `TA`, taking into account the principles of good
    faith, trust and also equality.


    Finally, if the `TA` gives an explanation in person, by telephone or by “*e-balcão*”^#fn91


    ## 4.3 Taxing Crypto-assets under the Corporate Income Tax Code


    ### 4.3.1 The Corporate Income Tax Code: A Brief Introduction^#fn92)


    The Portuguese `CIT` is levied on all income obtained by the respective taxable
    persons (article 1 of the `CIT Code`). Article 2 of the `CIT Code` qualifies as
    taxable person several entities, such as (i) the commercial companies or civil
    companies in commercial form, cooperatives, public companies and other legal persons
    governed by public or private law, with head office or effective management in
    Portuguese territory; (ii) entities without legal personality, with head office
    or effective management in Portuguese territory, whose income is not taxable on
    `PIT` or on `CIT`, respectively in the ownership of natural or legal persons;^#fn93)


    The taxable basis depends on the type of taxable person, under article 3 of the
    `CIT Code`, but for entities above under (i) that are primarily engaged in a commercial,
    industrial or agricultural activity^#fn94


    Article 4 of the same Code establishes that for legal persons and other entities
    with head office or effective management in Portuguese territory, the `CIT` is
    levied on the totality of their income, including that obtained outside that territory
    (worldwide income principle) while for those without head office nor effective
    management in Portuguese territory the `CIT` is only levied on income obtained
    therein (territorial or source principle). The general `CIT` tax rate is 21% and
    there is a reduced tax rate of 17% to Small and Medium-Sized Enterprises for a
    taxable basis until € 25,000 (v. article 87(1) and (2) of the `CIT Code`).


    ### 4.3.2 Profits with Crypto-assets and the Importance of the Accounting Perspective


    A taxable person under the `CIT Code` may obtain several sorts of income with
    crypto-assets that may contribute to its taxable profit. For instance, it may
    obtain gains from sales of crypto-assets, obtain commissions for rendering services
    related with these assets, obtain income derived from the sale of products or
    services that cover the crypto-asset industry or it may mine them. In all these
    cases, the taxation under the `CIT Code` is exactly the same that it would be
    if the taxable person obtained income with producing and selling chairs, render
    image consulting services or any other business activity since those activities
    are economic operations of a business nature and then perfectly covered by the
    `CIT Code`, namely its article 3.


    The `TA` has not yet issued any binding ruling, generic information or other interpretation
    regarding crypto-assets and `CIT`. However, the Portuguese Chartered Accountants
    Association (“OCC”) published its Technical Opinion no. `PT22246`, of 22-03-2019
    on cryptocurrencies.^#fn95


    Since `CIT` taxes the profit with the corrections established in its Code and
    the starting point is the accounting, it has a remarkable importance in this context,
    and one should ask (from an accounting perspective): are cryptocurrencies *stricto
    sensu* intangible assets or inventories? Are security tokens financial instruments?
    Are utility tokens intangible assets or contracts with clients?


    Regarding holdings of cryptocurrencies, the International Financial Reporting
    Interpretations Committee (`IFRIC`) released in June 2019 an update in which it
    discussed the nature of a cryptocurrency under the International Financial Reporting
    Standards (`IFRS`), concluding that it is an intangible asset under the International
    Accounting Standard (`IAS`) 38 “on the grounds that (a) it is capable of being
    separated from the holder and sold or transferred individually; and (b) it does
    not give the holder a right to receive a fixed or determinable number of units
    of currency”, excluding the qualification as a financial asset (Paragraph 11 of
    `IAS 32`) or as Cash (Paragraph AG3 of `IAS 32`). Additionally, if an entity holds
    cryptocurrencies for sale in the ordinary course of business, that holding is
    Inventory (`IAS 2`).^#fn96


    Furthermore, the Organization for Economic Cooperation and Development (OECD)
    stated that although there is currently no formal accounting guidance available
    on crypto-assets, it is necessary to apply the existing general accounting principles,
    namely their economic purpose, the rights and liabilities associated with them,
    and the way the assets derive their inherent value. Consequently, a security token
    could be considered as a financial asset subject to `IFRS 9`, and utility tokens
    can be considered as a prepayment for those goods and services, treated under
    `IFRS 15`.^#fn97


    To conclude, although there are some uncertainties under the accounting perspective
    (which have impact in the `CIT``), if a taxable person obtains income from a crypto-asset,
    such income will contribute for the taxable basis under the `CIT Code`, provided
    that the subjective and objective requirements above are fulfilled.


    ## 4.4 Taxing Crypto-assets under the Personal Income Tax Code


    ### 4.4.1 The Personal Income Tax Code: A Brief Introduction^#fn98)


    All natural persons resident in the Portuguese territory^#fn99


    > Article 1

    >

    > Taxable Basis

    >

    > 1—The personal income tax is levied on the annual value of the income from the
    following schedules, even when resulting from unlawful acts, after making the
    corresponding deductions and allowances:

    >

    > Schedule A—Employment income;

    >

    > Schedule B—Business and professional income;

    >

    > Schedule E—Capital Income;

    >

    > Schedule F—Property income;

    >

    > Schedule G—Capital gains;

    >

    > Schedule H—Pensions.

    >

    > 2—The income, whether in money or in kind, is subject to taxation, wherever
    it is obtained, the currency and the form in which it is earned.


    Only the income from those schedules is taxed and the annual taxable amount is
    subject to progressive taxation up to 48%, plus an additional solidarity tax with
    a rate of 2,5% applicable to taxable income exceeding € 80,000 up to € 250,000
    and of 5% applicable to taxable income exceeding € 250,000. However, there are
    some types of income taxed with autonomous or final tax rates—both usually of
    28%.^#fn100

