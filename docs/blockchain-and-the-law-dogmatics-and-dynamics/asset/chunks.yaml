- fmt: '

    The situation with Bitcoin is the most difficult one from this perspective. The
    anonymity of Nakamoto, together with the lack of a centralized structure behind
    the protocol and the multiple actors that are, in one way or another, invested
    in it, makes it very challenging to find adequate legal protection for users and
    to understand the rights and duties of each actor within the network. There is
    some form of legal practice, call it a digital-community custom at play, in the
    way the members of the Bitcoin community established procedures for updating the
    network.


    ### 1.5 The Law for Blockchain


    Blockchain is thus a legal phenomenon because the law covers and regulates blockchain
    and its developments and interactions. Another question is if this “coverage”
    (or regulation) is adequate. I will try to provide some ideas in this section.


    The law receives social and technical phenomena under its terms. The operation
    of law, however, is complex, with a significant role afforded to hermeneutics
    and interpretation. The more open the meaning of rules is, the bigger the capacity
    of the law to adapt to new phenomena. One excellent example is the definition
    of what constitutes security under EU law, which is open enough to include any
    manifestation of value that works as an investment instrument.


    Is law “adaptive” enough to deal with blockchain and its developments? We have
    seen that private law rules can deal with several situations of blockchain technology.
    However, the space of autonomy of private law ends, and some things that tamper
    with the greater adoption of blockchain are not permitted. For example, it is
    generally not legal to establish a negotiation system of financial instruments
    in a decentralized blockchain. It is also illegal (or at least devoid of legal
    effects) to represent a property title from a house, car, or corporate store as
    a cryptographic token; it is necessary to execute the act through a prescribed
    form of legal act (like a public deed, regarding real estate acquisitions). Although
    some regulation establishes incorporation criteria for people exercising an economic
    activity with “virtual assets” to prevent money laundering, it is unclear whether
    credit institutions can add tokens to their portfolio or not.


    The most significant legal challenge of blockchain is not dogmatic but practical:
    DLTs are global protocols operated by several people, spread around the world,
    with transactions being done in a peer-to-peer way among different jurisdictions.
    Identities are cryptographically drawn, and pseudonyms are used, which makes it
    difficult sometimes to locate and enforce. Global cooperation and technical expertise
    of law enforcement and courts are necessary. Global recognition of crypto assets
    in a form of legal category could also help with financial and tax regulation.


    In sum, legal rules must enable digitalization for the blockchain revolution to
    succeed (and the digitalization of value to occur). There are already rules over
    automated decision-making and processing, but not much concerning digitalizing
    identities, certificates, public deeds, or other forms of authenticated data.
    Moreover, most of these property certificates are issued by public institutions
    or accredited actors, such as notaries. To think of a “decentralized” State apparatus
    is fascinating from a technical side. Public administration is the centralized
    social institution per excellence, even if it can be divided into departments
    or different administrations (e.g., regional, municipal, federal.). In the end,
    it is the public sector (the State, in its multiple formations) that controls
    the protocol, even if having a blockchain can bring gains in efficiency and transparency.


    ### 1.6 Conclusions


    Four years after the hype, blockchain continues to deliver at its slow pace.

