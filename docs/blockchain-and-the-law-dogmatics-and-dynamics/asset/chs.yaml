- "# 区块链与法律：教义学与动态学\n\n\n\n\n\n**主编**\nSimone van der Hof（法律与数字技术中心，莱顿大学，荷兰莱登）\n\n\
  **丛书主编**\n* Jef Ausloos（阿姆斯特丹大学，荷兰阿姆斯特丹）\n* Stephan Dreyer（莱布尼兹媒体研究所，德国汉堡）\n* Gloria\
  \ González Fuster（法律、科学、技术与社会研究中心 (LSTS)，布鲁塞尔自由大学 (VUB)，比利布鲁塞尔）\n* Inge Graef（蒂尔伯格大学，荷兰蒂尔伯格）\n\
  * Aleksandra Kuczerawy（IT 与知识产权中心，鲁文汶大学，比利时鲁文芬）\n* Eva Lievens（法学院、法律与技术学院，根特大学，比利时根特）\n\
  * Aurelia Tamo-Larrieux（法学院，马斯特里赫特大学，荷兰马斯特里里赫特）\n\n\n**编辑**\n* Francisco Pereira\
  \ Coutinho（法学院，诺瓦法学院，葡萄牙里斯本）\n* Martinho Lucas Pires（法学系，葡萄牙天主教大学，葡萄牙里斯本）\n* Bernardo\
  \ Correia Barradas（世界银行集团，葡萄牙里斯本）\n\n\n\n## 前言\n\n区块链和分布式账本技术（DLTs）是我们时代主要的科技发展之一。DLTs\
  \ 是计算机协议，旨在通过不同的参与者以分布式方式存储和管理数据。根据中本聪（Satoshi Nakamoto）的话，区块链是受比特币（首种基于无信任的支付系统）启发的某种\
  \ DLT 的名称。自那以后，改进和扩展加密货币容量的新技术层出不穷，改变了区块链的面貌。\n\n目前，区块链领域存在海量（且不断增长）的项目。虽然随着 DeFi（去中心化金融）协议和产品的新兴领域正争夺建立去中心化市场，但加密交易所已经受到监管。区块链和加密货币被视为逃避执法部门的危险产品并伪装成简单主张的日子已远去。\n\
  \n该技术的支持者认为，区块链具有从根本上改变商业关系的潜力（无论是企业对企业还是企业对消费者），将商业信任从市场代理和中介转移到运行在全球范围内计算机分布式协议的基于算法信任的计算机程序。区块链技术带来了我们思考和交换价值方式的范式转变。其创新和颠覆潜力已在各行业得到广泛认可。然而，任何新技术都会带来必须应对的法律和监管挑战。\n\
  \n法律与区块链之间存在着复杂的关系：该技术的隐私、去中心化和自动化核心原则与关于稳定性和责任的经典法律标准冲突，尽管过去几年已经颁布了新法律。\n\n从 2018\
  \ 年至 2020 年，我们在诺瓦法学院举办了三期关于区块链技术法律影响的短期研究生课程。这些课程是葡萄牙大学开设的首此类课程，各种葡萄牙及国际的学者、企业家、律师和监管者都参与了其中。本书浓缩了这三门课程教学内容的“精华”，涉及法律标准和规则应用于区块链的复杂问题。\n\
  \n本书延续了课程的国际化结构，包含八章，致力于区块链或基于分布式账本的创新与法律之间的通用及特定交叉。\n\n本书由 Martinho Lucas Pires\
  \ 撰写的章节《区块链与法律：设定底线》（第 1 章）开始。\n\n\n\n\n\nNelson M. Rosario 在第 2 章节中探讨了基于区块链的结构在投票中的潜力与局限性。在第\
  \ 3 章节中，Renato Gomide Martinez de Almeida 讨论了区块链在转型正义过程中的应用，探索了其在刑事起诉、真相委员会、赔偿、恢复民主机构以及和解过程中的作用。在第\
  \ 4 章节中，Marta Carmo 关注了葡萄牙对加密资产税务收处理的演变，解释并解构了葡萄牙税务当局采取的方法，这些方法导致该国在某些媒体圈中被称为“加密避税天堂”。\n\
  \n在第 5 章节中，George Daniel Raath 深入探讨了南非背景下执行判决中的区块链问题。\n\nJoão Vieira dos Santos\
  \ 和 Guilherme Maia 在第 6 章节中考虑了欧盟建立分布式账本技术（DLT）试点机制的立法计划，并评估了其对 DeFi 产品的可能影响。Anjeza\
  \ Beja 和 Bernardo Correia Barradas 在第 7 章节中研究了新型央银行数字货币（CBDC）及其对匿名性的影响。在第 8 章节中，Ágata\
  \ Ferreira 通过讨论智能合约与法律之间的特定关系结束了本书，探讨了智能合约的优势并应对了围绕其实施和使用的学术法律争论。\n\n总而言，本书为区块链与法律的交叉领域提供了全面的概述。它深入了区块链技术的法律影响以及在现有法律框架下的处理方式。它还探索了区块链重塑法律格局的潜力，以及法律如何应对日益增长区块链的使用不断演进。这本书为区块链与法律之间复杂的关系提供了宝贵的见解，使读者对区块链的法律影响以及如何利用它造福社会有更全面的理解。\n\
  \n我们感谢所有作者对本书做出的卓越贡献，并特别感谢 T.M.C. Asser Press 的 Frank Bakker 和 Kiki van Gurp 接受本书的出版，并感谢他们在编辑过程中所有的耐心。我们祝所有读者阅读愉快，获益匪浅。\n\
  \nFrancisco Pereira Coutinho Bernardo Correia Barradas Martinho Lucas Pires 葡萄牙，利斯本\
