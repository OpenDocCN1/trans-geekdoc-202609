  \ Pires 邮箱：`martinholucaspires@ucp.pt`\n\n\n## 摘要\n在过去的几年里，区块链与法律已成为一个发生了大量发展的领域，且这种进步趋势仍在持续。然而，由于区块链和加密货币市场层出不穷的出版物和持续的发展，该主题的本质——关于日益广泛应用的区块链技术及其应用（如加密货币和智能合约）的法律影响和后果——面临着某种迷失的风险。本章从最基础和根本的层面讨论了区块链与法律的问题，并在此考虑了区块链的本质和法律的本质特征，探讨了两者之间的关系，以及应当如何部署新进展，使其既忠于技术的承诺和能力，又符合法律作为社会秩序主要工具的功能。\n\
  \n\n## 1.1 引言\n2021 年第一季度，比特币、以太坊以及几乎所有其他加密资产都创了历史新高，这被视为新一轮牛市的开始。狂热分子对价格上涨赞誉有加，并将其归功于整个经济领域的企业和投资者对加密货币和区块链协议日益增长的采用：包括如`Tesla`和`Micro\
  \ Strategy`这样的公司、传统的传统参与者（如`银行`），甚至像`埃塞俄比亚`这样的国家。在上一次牛市和区块链“炒作周期”结束大约四年后，2021 年似乎是这项技术开始成功的一年。根据支持者的说法，它的成功将预示着价值转移数字化的新纪元。\n\
  \n讽刺的是，另一个加密相关的现象在那些艰难的熊市期间达到了顶点（如果准确划分历史时期，大约在 2018 年初到 2020 年底）。加密经济的兴起引发了关于加密和区块链的活跃出版和研究。法律学术也不例外。关于这个问题发表了无数文章、书籍、论文（硕士和博士）、报告和工作论文。\n\
  \n对于律师和法律研究人员来说，每当某事物似乎足够创新性并能深刻改变人们互动的方式时，跟上技术发展的潮流是典型的做法。然而，没有人能预测到区块链与法律研究领域如此快速且剧烈的增长。法学者们热情地欢迎区块链，投入投入到采用和研究这种新技术以及这种经济、组织和社区建设的形式中。区块链和分布式账本技术似乎预示着基于去中心化、`smart\
  \ contracts`和数字货币等坚实且具有挑衅性的概念的社会变革新时代。尽管采用过程缓慢，但区块链将价值数字化的承诺及其吸引力是如此巨大，以至于该运动中两位最著名的作者决定创造一个术语，来描述处理区块链技术发展的新法律形式——根据这些作者的话，“传统”法律无法回答这些发展。`Lex\
  \ cryptographica`将成为新的、“革命性”法律，用于处理`automated contracts`（无论它们是什么）、自治组织（同上）以及新兴的代币经济。\n\
  \n作为区块链与法律“运动”的一员，通过研究、咨询、组织课程、教授课程、参加会议和在该主题上发表文章，我必须承认，在开始后的近四年时间里，对区块链和法律的热情在某种程度上似乎一直有些过度炒作了。叫我为现实主义者吧（我乐意接受），或保守主义者（没那么认同）。然而，那些支持区块链作为社会现象的特异性及其“革命性”特征的论点似乎超出了理性，进入了哲学推测领域。诚然，区块链现象尽管具有复杂性，对法律的运作带来了挑战。\n\
  \n尽管如此，法律也是一个丰富且复杂的现实，由规则及其执行、价值观、社会认知及其政治组成。规范法律关系的术语和原则、其方法和教义学与人类的存在一样古老。在这方面，法律是存在的最伟大的遗产机构。这就是为什么我认为，区块链技术的法律挑战从法律教义学的角度来看并不完全是“革命性的”或“创新的”，大部分问题可以在`contract`（合同）和`liability`（责任）方面进行总结和解决。其他案例必须通过创新的解决方案来处理，这些解决方案要尊重技术的目的、结构以及其所带来的良好发展。另一个问题涉及国家制定法律和国家当局有效执行该市场监管的能力。然而，那是另一个问题，不属于法律问题，而是行政行动和裁决问题。\n\
  \n本引言章节阐述了这一论点，试图在 2022 年（即热潮几乎崩盘之时），勾勒区块链现象与法律之间联系的基本结构性特征，它们引发的张力，并从批判性的视角对其进行评估。可以将其看作是对区块链与法律问题的核心构建一个框架的尝试。\n\
  \n为了实现这一目的，我将贡献分为四个部分。第一部分涉及对法律及其现象的讨论，解释法律本质是什么，以及如何从实践和现实的角度进行表现和表达。第二部分讨论区块链现象及其多个维度、矛盾和创新。第三部分研究`DLTs`带来的创新所产生的颠覆性影响，并从更具结构性的法律视角对其进行评估——即研究区块链现象中存在的法律。第四部分考虑区块链市场可以和应该接纳的法律变革；这些变革将带来更多概念和实践上的精确性。\n\
  \n\n\n\n最后，我希望能够解释并揭示日益普及的区块链所带来的重大法律挑战，并对法律和市场如何从这里演变提出一些思考。鉴于该主题已有许多著作，我将保持简练并概括一些观点，特别是在讨论加密资产和智能合约时——本书的其他章节将以更深入的方式探讨这些主题。\n\
  \n## 1.2 法律的“现象”\n\n如果我们希望尽可能简单——鉴于本章的局限性，简单化是必须的——那么对法律的即时定义或或少如下所示：法律是特定社区内生效的一套规则体系，由权威机构制定，并根据正义标准组织个人和集体行为。当然，当我们评估该定义所包含的所有内容时，任何法律定义（即使是最直接、最浅显的）都难以陷入第二层解读的困境。我们说的规则是什么？什么是社区？什么是权威机构？我们为什么需要组织行为？此外，什么是正义？让我们对这句话进行解构，以获得对法律现象更全面（但仍具有某种简单实用性）的视角。\n\
  \n法律是一套规则体系——通过这一表达，我的意思是法律是一组语言陈述的规范，这些陈述通常是指令性的。^(⁵)\n\n法律规范的目的是建立某种秩序，即建立一个对外部个人和集体行为存在预期的空间。^(⁶)\n\
  \n就其本身而言，“秩序”是一个非常正式且空洞的概念。任何法律秩序（特定政治社区或社区的规则集）都是在特定的价值观和原则下建立的。^(⁷)\n\n以下考虑是最复杂的，因为它们涉及到“法律是意志的产物”的问题。当我们说权威机构颁布法律时，我的意思是（并且我怀疑读者立刻会这样假设的）法律是政治行动的形式。^(⁸)\n\
  \n关于法律有一种更具社会性的观点，它关注的与其说是行使自上而下的统治权威权力，不如说是从社区通过日常互动涌出的法律的集体表达。法律的社会表达被称为“习俗”，通过习俗，人们根据对法律强制义务的集体认知来行动，而这可能与实法（例如统治者制定的法律）相冲突。^(⁹)\n\
  \n因此，我们可以说法律现象由政治社区内的行为规则、其意义、应用和维护组成。某些规则是政治制造的；它们被颁布，且社区的统治当局保证其效力。然而，其他规则可能产生于集体协议，或通过与社区成员反复定期的互动产生。一种（自由）法律秩序将具有命令性的统治，同时允许出现大的私人秩序空间。\n\
  \n法律运作（法律的颁布、执行和审判）由每个社区在其领土内完成（社区也可能允许其他外部实体对其行使法律权力，例如在某些条件下允许联邦或涉及有限政策领域的国际组织）。基本法律问题集和一般性答案在每个国家从根本上是相同的：集体与政治权力之间的关系受宪法管辖，宪法规定了被治者和政府的权利与义务。相比之下，社区成员之间的关系遵循“知情同意下的自由承诺”逻辑，对于质疑或违反人们相互之间所立承诺的行为，则适用责任规则。每个社区之间存在许多差异——例如：在知情同意下什么构成自由承诺、在何种情况下产生责任，以及证明过错所需的程度（等规则）——因为每个社区在其特定的语境下都应该有其对正确和正义的定义。从现实主义和某种本质主义的角度来看，这些是关于法律的主要结构性点，旨在履行其引导行为和实现有序生活的功能。\n\
  \n\n区块链首先是一种技术：一种“科学发现的实际（特别是工业上）应用的形式”。^(¹⁰)\n\n最著名的区块链协议是比特币。比特币协议在技术和意识形态上的重要性不应被低估。大多数关于区块链及其原则、益处及其问题和风险的描述，指的是比特币协议的特征。其基本假设是广为人知的：比特币通过去中心化的点对点网络在人类之间建立了一个价值交换系统（在这种情况下，价值指的是关于名为比特币令牌属性的信息，该令牌将作为一种全球数字货币使用）。所谓的去中心化，意思是交易双方之间没有中间人：网络及其用户控制整个过程。网络中两个具有加密身份的人同意交换他们的代币，并通过他们各自的加密身份签署交易来向网络传达他们的意图。网络接收所有交易，一旦另一个用户（称为矿工）解决了自动生成的谜题，网络中一个新区块就会形成，交易被插入、盖上戳并按时间顺序排列。一旦用户在链上确认该区块，交易就会被密封，任何人都可以看到区块并检查信息，但无法更改它。^(¹¹)\n\
  \n比特币的去中心化主张具有第二个重要意义：缺乏统治权威，例如董事会。其创建者中本丰（Satoshi Nakamoto）的匿名性有助于为比特币注入灵魂，并将其管理交给社区。这意味着协议治理具有高度摩擦性，正如某些事件所示，例如\
  \ `SegWit` 更新和 `blocksize wars`。^(¹²)\n\n随之后的大多数区块链协议开发方式有所不同，即使它们从比特币和中本丰那里汲取了技术和意识形态的灵感。通用的术语框架用于区分第一代协议（基本上是比特币）与第二代（以太坊）以及第三代（例如，ano、Algorand）。^(¹³)\n\
  \n对于第二代和第三代协议，去中心化仅存在于第一个意义上。在第二个意义上，其存在性并不明显。虽然理论上这些协议没有中央正式权威，但协议创始人通常是“公众”人物，通常拥有良好的在线形象和重要的商业愿景。在某些情况下，协议由私人实体（基金会、公司）支持，这些实体拥有足够的资金和人力（主要是开发者）来行动并影响协议的运行。例如，以太坊基金会支持硬叉以更改代码中的漏洞的方式。^(¹⁴)\n\
  \n\n\n\n\n到目前为止，我还没有涉及代币和加密货币。比特币协议作为一种激励生成了其代币：一种存储在用户钱包中并在协议中注册的价值数字表示。代币的目的是作为一种支付机制，即货币；因此，所有协议代币（通过加密手段存储）都被称为加密货币。在加密经济中，代币起到两种作用：一是去中心化共识机制运行的经济激励，另一个是产品——换句话，它是使协议具有价值的元素。\n\
  \n比特币的价值在于其作为货币的使用——支付机制、价值尺度或计账单位（关于比特币更擅长处理哪一种，目前尚无定论）。然而，其他代币有不同的用途。例如，`Ether`\
  \ 用于支付 `Ethereum` 网络中的存储空间和交易费用；`Filecoin` 使用户能够在 `Filecoin` 协议中存储数据；`Tezos` 允许持有者对协议治理进行投票；`Ada`\
  \ 在质押到池中时会为持有者产生分红。某些代币代表通过公开发行的、作为抵押品的证券。简而言之：代币代表不同类型的价值，如权利、货币、协议、财产……仅将它们视为货币是不够的，因此考虑到它们具有多种用途，更优选的术语是“加密资产”。\n\
  \n尽管如此，市场实践根据功能对代币进行了划分。这种划分随后被公共机构（包括欧盟监管机构）采纳，并落实于拟议《加密资产市场法规》（`MiCA`）。\n\n代币可以说是是区块链现象最为人知的方面。它们是协议运行的核心部分，并已成为易的流动性来源。代币可以在几秒钟内人之间交换，且无需或极少需要人的干预，从而降低了交易成本。然而，尽管具有这些功能，它们具有投机倾向，产生了一种替代（且不那么成熟）金融市场，这种市场正开始吸引其他更传统的机构参与者，如银行和公司。加密市场的另一个关键因素（也是对\
  \ `DLT` 去中心化承诺的另一个讽刺转折）是，代币经济中的几个实体是集中管理的（例如钱包提供商、交易所和托管机构）。尚清楚对代币经济价值的关注在多大程度上没有吸收对协议开发和应用的兴趣。\n\
  \n\n区块链既是一项技术，也是一种经济现实。作为一种通信技术，它用于推进人类互动；作为一种经济现实，它是价值的产物。在这两个方面，区块链都是一种社会现象，因此也是一种法律现象。\n\
  \n法律在区块链中何在？假设只要两个或更多人之间存在协议。人们下载并运行协议，接受这种行为以参与一项共同事业。通过参与该事业，他们使自己受协议治理和运行规则的约束。如果恶意意图损害了他们的合法预期，他们有权向侵害他们的人索要赔偿。假设他们没有受到损害，并且有合法预期认为他们通过下载协议参与了一项高风险活动。在这种情况下，在没有坚实法律保护的情况下，他们将自担风险。\n\
  \n网络用户之间进行交易。交易受法律规则和原则的约束。他们使用 `smart contract`，但智能合约是执行交易的一种，而不是受特定规则约束的法律协议（而这些规则是“法律之外”的）。毕竟，可编程代码是人编写的语言，可以代表声明和协议。\n\
  \n我承认，上面的图景是简化的，没有考虑到一些复杂的情况。例如，关于网络参与者的权利和义务：如果矿工未能挖掘出一个区块并插入用户的交易，他/她是否可以向矿工索要利润损失？如果协议代码存在漏洞，且该漏洞允许非法交易的运行，应该由谁负责？协议的创建者、创建并负责协议维护的基金会/公司？还是投入时间的自由职业程序员和开发者（其时间通常由创始公司、基金会或协议投资者的资助提供）？投票和参与又是怎样的？通过在协议治理中进行质押和投票，我是否拥有透明度的权利？在发生我不同意的硬分叉的情况下，我能向支持该分叉的人索要赔偿吗？此外，适用于该情况的规则（合同规则、公司规则）是什么？\n\
  \n适用法和管辖权问题是国际私法领域，它拥有一套核心规则，用于决定适用于该关系的法律和审判地。`Andrew Dickinson` 的一篇文章具有启发性，它表明尽管存在困难，但仍可能识别出与\
  \ `blockchain` 相关的情况的适用规则。\n\n在评估用户权利义务的法律影响时，考虑协议之间的差异也至关重要。例如，在预期和协议方面：市值最高的协议中，大多数是企业或公司支持的协议，并拥有完善的营销结构。个人用户很少直接与协议交互；相反，他们与直接连接协议的第三方公司（或者，如果你不想避免这一切的讽刺：中介）交互。大多数用户（至少在面上）受到与服务提供商签署协议的保护。对于希望参与协议的用户（例如公司、机构和国家），由于他们直接与协议支持者相关（创建协议并希望成功的基金会和公司），他们也受到了保护。预期是事先约定并法律化的，并明确了双方及其相应的义务。因此，治理去中心化的风险在某种程度上得到了缓解。\n\
  \n底线是，在充分考虑其含义并理解其实际影响真实范围后，“去中心化”和自动化处理（或 `smart contracts`）的挑战并没有最初想象的那么复杂。去中心化并不是法律的反义词：它长期以来存在，特别是在联邦制和封建制等政治体系中。\n\
  \n区块链是一项私人活动，一个由人创建并人管理的市场，即使它是基于具有自动交互机制的数字平台。\n\n\n\n\n从这个角度来看，比特币的情况是最复杂的。中本（Nakamoto）的匿名性，加上协议背后缺乏中心化结构，以及以某种方式参与或投入其中的多个参与者，使得为用户寻找充分的法律保护，以及理解网络中每个参与者的权利和义务变得极具挑战性。在比特币社区成员建立网络更新程序方面，存在着某种形式的法律实践，可以称之为“数字社区惯例”在起作用。\n\
  \n### 1.5 区块链法\n\n因此，区块链是一种法律现象，因为法律涵盖并监管了区块链及其发展和互动。另一个问题是，这种“覆盖”（或监管）是否充分。我将在本节中尝试提供一些观点。\n\
  \n法律在法律术语范围内接收了社会和技术现象。然而，法律的运作是复杂的，解释学和解读在其中起着重要作用。规则含义的开放性越高，法律适应新现象的能力就越强。一个极佳的例子是欧盟法律对什么是“证券”的定义，它足够开放，涵盖了任何作为投资工具发挥作用的价值表现形式。\n\
  \n法律是否具有足够的“适应性”来处理区块链及其发展？我们已经看到，私法规则可以处理区块链技术的几种情况。然而，私法的自治空间是有边界的，而且某些阻碍区块链更广泛采用的行为是不被允许的。例如，在去中心化的区块链中建立金融工具的交易系统通常是不合法的。将房屋、汽车或公司商店的财产权表示为加密代币也是非法的（或至少没有法律效力）；有必要通过规定的法律行为形式（例如关于房地产收购的公证书）来执行该行为。尽管某些监管规定了从事“虚拟资产”经济活动的人员的注册标准，以防止洗钱，但尚不清楚信贷机构是否可以将代币加入其投资组合。\n\
  \n区块链面临的最重大法律挑战不是教义上的，而是实务上的：分布式账本技术（DLTs）是由分布在全球的几个人运行的全球协议，交易在不同管辖区之间以对点的方式进行。身份是通过加密抽取的，并使用了伪名，这使得有时难以进行定位和执行。执法部门和法院的全球合作以及技术专业知识是必不可少的。在法律类别上对加密资产进行全球认可也有助于金融和税收监管。\n\
  \n总而言之，法律规则必须支持数字化，区块链革命才能成功（并实现价值的数字化）。目前已经有了关于自动化决策和处理的规则，但关于身份、证书、公证书或其他形式的认证数据的数字化规则并不多。此外，大多数此类财产证书是由公共机构或经授权的实体（如公证员）颁发的。从技术角度来看，想象一个“去中心化”的国家机器是迷人的。公共行政是典型的中心化社会机构，即使它可以被划分为部门或不同的行政机构（例如地区、市政、联邦）。最终，仍然是公共部门（多种形式的国家）控制着协议，尽管拥有区块链可以带来效率和透明度方面的收益。\n\
  \n\n在炒作四年之后，区块链继续以其缓慢的速度持续发展。\n\n\n\n\n本章讨论了采用基于区块链的系统解决选举中长期存在的问题所面临的机遇与风险。章节涵盖了选举中的某些历史性问题及其解决方法，以及区块链技术的优势。文章分析了将区块链解决方案应用于选举领域的多次尝试，并对未来的可能路径提出了建议。\n\
  \n\nRosario Tech Law, LLC 创始人兼合伙人，伊利诺伊理工大学芝加哥-肯特法学院兼职教授，435 W. Diversey Pkwy, Suite\
  \ 1A, 60614 Chicago, IL, USA\n\n摘要结束\n\n\n俗话所说：重要的是计票数，而不是选票本身。这句愤世嫉俗的话语通常被归于前苏联独裁者约瑟夫·斯大林，尽管斯林可能从未说过这话，因为这句话的来源尚有争议，但尽管如此，这种情感已经跨越了世代.^(([²²)\n\
  \n我们选票的来源，以及知道你的选票按照你预期的方式被`counted` 的这种保证，是建立对选举及其结果信任的基础。在这种环境下，许多人将区块链技术视为构建数字投票系统的解决方案。例如，美国前总统竞选人杨广曾著名地建议将美国的投票转为基于移动的区块链系统.^(([²³)\n\
  \n区块链是解决“双重花费”问题的有效解决方案^(([²⁴)\n\n根据 IBM 的说法，区块链是“一种共享的、不可篡改的账本，旨在简化业务网络中记录交易和跟踪资产的过程。”^(([²⁵)\n\
  \n尽管区块链在应用于加密货币和其他数字资产时，可能是解决“双重花费”问题的有效方案，但它们本身并不是电子投票的良良好解决方案。实是情况是，区块链技术需要对选举系统进行大量的额外更改才能产生价值。\n\
  \n本章从区块链技术与选举的交汇点开始。探讨了区块链和选举的相关背景，涵盖了它们的历史、特征以及一些优缺点。然后，章节转向了对使用区块链进行选举兴趣日益增加的原因。特别是考察了区块链与选举的现状，并探讨了将此技术用于投票系统的潜在优势与弊端。\n\
  \n文中解释了选举的关键要求，以及区块链在解决选举问题上的技术缺陷，以向读者证明区块链并不是电子投票的良好解决方案。在本章结束处，读者将能够更好地理解技术（特别是区块链技术）可能或可能无法被用于选举中，以及未来使用该技术的潜在影响。\n\
  \n\n选举是政治体系的关键要素之一，对选举过程的任何改变都要求具备超出许多人可能意识到的范围的、细致的理解。虽然个人在想象选举当天的投票行为时并不困难，但促进此类活动所需的海量行政结构往往被忽视。选举系统随着时间的推移而发展，形成了我们今天看到的复杂系统，其历史渊源可以追溯到希腊和罗马等文明。例如，公元前\
  \ 5 世纪左右的雅典使用了类似于直接民主风格的系统，而罗马共和国则通过选举来选拔政府的各种官员。\n\n选举随时间的演变导致了各种类型的选举，包括大选、地方选举和公投。然而，现代选举变得更加复杂，纳入了如领先者制^(([²⁶)\
  \ 等民主制度。\n\n选举通常以普选权、秘密投票、竞争和管理为特征。例如，公民必须拥有某种程度的选举权才能参与。用于投票的选票应保持保密，以保护个人隐私并减轻报复的风险。选举应该是自由、公正的，并定期举行。\n\
  \n理解选举系统的复杂性（包括其历史背景和发展）对于领会确保其公正、透明地进行所面临的挑战至关重要。虽然许多人可能将民主的基本原则视为理所当然，但律师、政府监管机构和学者保持关注选举过程以确保其高效、有效运行是至关重要的。\n\
  \n\n除了代表性外，选举在促进民选官员的问责制方面也起着关键作用。通过赋予选民选择领导者的权力，选举建立了一个制衡体系，确保民选官员对其服务的人民负责。这种问责制确保了民选官员对选民的需求保持响应，促进了良好治理并减少了腐败和滥用权力的可能性。\n\
  \n选举通过提供和平权力交接手段，在维护政治稳定方面发挥着至关重要的作用。定期举行的选举可以确保政治权力不会集中在单一群体或个人手中，并可能减少政治不稳定、动荡或暴力的可能性。通过选举实现的和平权力交接也有助于增强对政治过程的信心，并在政府内部创造一种连续性和稳定性。\n\
  \n最后，选举可能赋予民选官员合法性，因为他们是由人民选出代表其利益的。实现这一点的理想方式是提供一个透明公正的领导人产生过程，通过这种方式，选举有助于确保民选官员被视为其人民的合法代表。这种合法性对于促进稳定、建立公众对政府的信任以及促进有效治理至关重要。\n\
  \n\n\n\n\n\n选举是民主社会的关键基石，但它并非没有缺陷。首先，选举的行政成本高昂，涉及选民注册、前端选票制作以及后端选票计票等巨额支出，这使得某些国家难以以定期且公平的方式举行选举。这可能导致选民投票率低，从而稀释选举结果的合法性并削弱民主进程，使得确保当选官员代表其服务的民众变得具有挑战性。\n\
  \n此外，选举容易受到操纵、欺诈、选民压制和外部干预，这些都可能危害民主进程的完整性，导致公众信任下降，甚至引发政治动荡、动荡和暴力。\n\n总而言之，虽然选举是民主社会不可或缺的方面，但在设计和实施选举系统时，必须仔细考虑其缺点，包括成本、低投票率和易受操纵。确保选举的益处不被缺点所抵消，并使选举过程保持公平、透明并对所服务的民众负责至关重要。技术解决方案并非解决这些现实问题的万灵药。\n\
  \n\n事实上，所有选举都面临着一系列共同关注的问题。技术（如`区块链技术`）具有彻底改变选举过程的潜力，但也引发了对选举安全性和完整性的担忧。最受关注的问题之一是选民欺诈，即个人或组织通过填票造票、买票或冒充选民等活动来操纵选举过程。在选举过程中使用技术具有缓解这些担忧的潜力，诸如`生物识别识别`、`区块链技术`和其他安全措施可以帮助确保选票的准确性和完整性。这些都是合法的担忧，但填票造票的盛行仍是一个问题。\n\
  \n与在选举中使用技术相关的另一个主要关注问题是选民压制。系统性地阻止或阻碍某些群体投票的努力（通常针对边缘化群体）可能会损害选举结果的合法性并削弱民主进程。虽然技术可以增加投票的便利性（例如`移动投票`或`在线投票`），但它也引发了对安全潜在操纵的担忧，因此在便利性与安全性之间取得平衡至关重要。\n\
  \n最后，在选举中使用技术也引发了对外部干预的担忧。外国势力试图通过黑客攻击、虚假信息活动或为特定候选人提供资金支持等方法影响选举结果，这会破坏民主进程的完整性并导致政治动荡。\n\
  \n\n为了解决上述担忧，政策制定者采取了多种方法。政策制定者和选举官员的一个关注领域是实施`选民身份识别法`。要求选民提供身份证明以验证其资格可能有助于防止选民欺诈并确保选票的完整性。然而，确保这些法律不会不成比例地影响边缘社区或侵犯个人隐私权至关重要。\n\
  \n另一个重点领域是选举监督。独立观察员或组织可以监督选举以确保透明并识别潜在的违规行为。技术的使用（如`区块链`）有助于增加透明度并提高选举监督的准确性。\n\
  \n竞选资金监管是选举过程另一个关键组成部分。这些法律规范政治竞选资金以防止腐败和过度影响。技术的使用（如`在线筹款平台`）可以帮助提高竞选资金的透明度和问制。但必须确保这些平台不促进非法或不道德的行为。\n\
  \n投资更安全的投票系统、改进选民注册流程以及为选举官员提供更好的培训对于加强选举进程至关重要。技术的使用（例如可能的`生物识别识别`和`区块链`）可以帮助提高选票的安全性和准确性。然而，确保这些系统对所有公民开放，且不会为投票制造不必要的障碍至关重要。\n\
  \n增加透明度对于维护选举进程的完整性至关重要。这可以通过技术实现，例如与技术社区进行开放式互动以及实时选举监控。但必须确保这些透明努力不会侵犯个人隐私权或为选举过程制造不必要的障碍。通过平衡技术益处与安全、隐私和透明度的需求，我们可能确保选举过程保持公平、便利并对所有公民负责。\n\
  \n\n`区块链技术`植根于 2009 年`比特币`（Bitcoin）加密货币的发展。\n\n`区块链技术`的特点包括不同程度的去中心化、不可篡改性和安全性。去中心化是指`区块链交易`存储在分布式计算机网络中，而不是存储在中心位置。不可篡改性是指一旦交易记录在`区块链`上，就难以更改或删除。安全性通过使用`加密算法`来实现，确保只有获得授权的方可以执行和修改`区块链交易`。\n\
  \n虽然`区块链技术`有许多潜在益处，包括增加信任、安全效率，但它也有一些缺点。这些缺点包括潜在的高能耗、可扩展性问题以及实施`区块链系统`的复杂性。此外，在选举中使用`区块链技术`引发了对隐私、安全和访问性的担忧，因此在选举过程中仔细考虑`区块链技术`的潜在益处和缺点至关重要。\n\
  \n`区块链`究竟是什么？`区块链`是一种组织信息的新方式，依赖于人们熟悉的现有技术。其中一种定义是，`区块链`是一种“有序的、回链链接的交易区块的数据结构”。\n\
  \n公共`与`与私有链链之间存在区别。`公共区块链`是那些无需许可且去中心化的区块链。`公共区块链`最著名的例子是`比特币区块链`和`以太坊区块链`。当我们说这些区块链是无需许可的时，意味着只要拥有参与所需的正确软件，世界上任何地方的任何人都可以加入这些区块链网络。当我们说这些网络是去中心化的时，意味着交易数据分布在计算机网络中，没有中央机构或中介控制信息流。这确保了没有单一实体可以操纵或更改数据，从理想上讲提供了更高的安全性和透明度。\n\
  \n\n\n\n相反，私有链不需要保证无许可或去中心化。不保证这些特性的优势在于，私有链部署允许对谁可以参与网络以及信息如何在网络中流动进行完全控制。因此，私有链部署通常受到那些在数据管理实践中需要更高确定性的大型企业以及政府的青睐。此外，由于私有链不是无许可或去中心化的，关于它们实际上是否属于区块链还存在疑问。特别是，私有链的反对者通常认为，少数实体可能保留运行区块链网络的代码控制权，并可能反转交易或删除在公共区块链网络中被认为是合法的交易记录。\n\
  \n那么，区块链实际上解决了什么问题？区块链解决的首要问题之一是信任问题。传统的数字系统（如在线支付平台）需要用户信任第三方促进交易。如果第三方遭到黑客攻击或决定采取不实行为，这种信任就很容易被打破。\n\
  \n虽然区块链是强大且创新的技术，但它们也创造了几个必须解决的问题。区块链的主要问题之一是其复杂性。区块链系统通常难以理解和实施，需要特殊的知识和技能。这种复杂性可能会产生准入门槛，限制能够有效利用该技术的组织和个人数量。此外，区块链可能是资源密集型的，运行它需要大量的计算能力和能量消耗。这可能会引发环境担忧并限制区块链系统的可扩展性。最后，区块链交易的匿名性可能给执法部门和监管机构带来挑战，因为很难识别并追究那些在区块链网络上从事非法活动人员的责任。总体来说，虽然区块链提供了许多优势，但仔细考虑并解决与该技术相关的挑战和缺点至关重要。\n\
  \n\n政府可能出于多种原因对将区块链技术与选举感兴趣。使用区块链进行选举的主要优点之一是其提供的预期安全性和透明度。通过创建一个看似不可篡改的交易记录，区块链技术提供了防止选民欺诈和篡改的承诺，确保选举结果准确可靠。此外，区块链可能通过简化选民注册、选票发放和计票来帮助提高选举过程的效率。这可能会减少错误和延迟的可能性，提供更快、更可靠的选举结果。区块链技术可能非常适合选民注册等工作，因为一个人是否注册投票与其是否已经投票是不同的问题。\n\
  \n政府对结合区块链与选举感兴趣的另一个原因是增加选民参与度。通过使用基于移动设备的区块链系统，政府可以让公民投票变得更容易更方便，特别是对于那些面临传统投票方式障碍的人，例如身体残障、地理隔离或行动不便等。这有助于提高投票率，并确保所有公民在政治过程中都有发言权。总体来说，通过利用区块链技术的优势，政府可能创建更安全、高效且具有包容性的选举系统，增强民主治理的合法性和有效性。\n\
  \n虽然区块链技术具有提高选举过程安全性和效率的潜力，但也有几个原因导致政府在将区块链与选举结合时犹豫。主要的担忧之一是实施区块链系统的复杂性和成本。区块链技术需要专业的知识和技能才能有效实施，这会为政府和选举官员带来准入门槛。此外，实施区块链系统的成本可能是高得无法接受的，特别是对于发展中国家或资源有限的国家。这使得确保所有公民都能获得安全可靠的选举系统变得具有性。\n\
  \n结合区块链与选举的另一个担忧是技术问题和漏洞的风险。虽然区块链技术通常是安全的，但它无法受到黑客攻击或其他形式的网络攻击的影响。这可能会产生外部干预选举过程的可能性，从而损害选举结果的合法性并削弱公众对民主过程的信任。此外，区块链交易的匿名性可能使得难以确保只有合格的选民参与选举，这会给选民识别和防欺诈带来挑战。总体来说，尽管区块链技术有很多潜在优势，但政府在选举过程中实施区块链之前，必须仔细考虑潜在的缺点和挑战。\n\
  \n全球范围内，选举一段时间以来一直面临选举基础设施遭受网络攻击的威胁。2017 年，国际民主与选举援助协会（International IDEA）举办了一场关于网络安全与选举的圆讨会。活动期间讨论了三点。首先，了解选举过程面临网络攻击的潜在风险和漏洞，并制定减轻这些风险的策略至关重要。其次，政府机构、选举官员和其他利益相关者之间需要加强协作与协调，以实施有效的网络安全措施。最后，通过确保选举结果安全透明，并让公民获得有关选举过程和网络安全风险的准确信息，维护公众对选举过程的信任信心至关重要。圆讨会强调了在选举过程中解决网络安全问题的重要性，以确保民主选举的完整性和合法性。\n\
  \n正是在这种环境下，各国政府开始寻求将区块链技术应用于选举。美国已经有来自不同政治光谱的各种实体呼吁为选举实施区块链解决方案。\n\n例如，2018 年在塞拉利昂，一家名为\
  \ Agora 的瑞士组织使用了其专有的私有链系统帮助审计塞拉利昂总统选举的结果。\n\n在选举中使用区块链最成功的尝试，莫过于 Voatz 公司到为止所做的。Voatz\
  \ 是一家总部位于美国的私人公司，专注于构建利用区块链的移动选举平台。\n\n但并非所有专家都同意基于区块链投票是一个好主意。2020 年 11 月发表的一篇论文认为，基于区块链投票可能会导致选举发生变化，而人们甚至没有意识到这些变化的发生。\n\
  \n\n\n\n\n选举是现代民主的基石，而我们的现代世界是一个科技世界，面临着古希腊和罗马人无法想象的问题。鉴于涉及的利益以及全球选举系统面临的日益增长的网络攻击威胁，政府希望采用看似更安全的投票方法是可以理解的。尽管如此，并非每种技术工具都适用于所有问题。\n\
  \n区块链技术允许创建仅追加的交易数据账本，这种账本具有防篡改性、防攻击性、公开性和可审计性，并能够实现人类合作的新形式。投票是一种“双重花费”问题，因为你不允许人们投票多次。区块链修复选举的诱惑是可以原谅的，但政府必须谨慎。快速的权宜之计往往不是快速的，也不是真正的解决方案。区块链在创建数字货币方面可能是很好的用途，但并不意味着它可以消除当今选举面临的所有问题。在将这些选举系统抛弃并替换为并非为解决选举问题的账本系统之前，需要对如何将区块链系统整合到现有的选举系统中进行额外研究。\n\
  \n\n# 3. 区块链的局限性是什么？关于在过渡正义过程中使用区块链的思考\n\nRenato Gomide M. de Almeida (1) Eça de\
  \ Queiroz Street, 279, Ap 4 Vila Mariana, São Paulo, SP, 04011-031, Brazil Renato\
  \ Gomide M. de Almeida Email: `renato.g.m.almeida@gmail.com`\n\n## 3.2 什么是区块链\n\
  ### 3.3.1 真相委员会\n### 3.3.3 恢复民主机构\n### 3.3.5 和解\n\n## 摘要\n区块链技术有改变人们生活、交流、获取产品、存储信息和交换数据的方式。这种技术能够在不同领域运行，并被称为像互联网一样的通用技术，在过渡正义过程中可能有用。本章旨在通过分析区块链技术作为过渡正义过程中的新组件的使用（参见第\
  \ `3.3.2` 节），理解区块链作为过渡正义场景的一部分如何表现（泛指第 `3.3` 节），并现状（参见第 `3.3.5` 节）。具体而言，本章分析了区块链如何整合到过渡正义的重要方面：刑事起诉、真相委员会、赔偿、民主机构的恢复以及和解。\n\
  \n\n技术的使用曾局限于国家行为体，这些通常是过渡正义和人权局势中的主要犯罪者，这反过来导致这些工具在犯罪者手中被垄断。然而，近年来，这种垄断变得不再剧烈，新技术（如雷达、数字媒体、应用程序、无人机和开源地图）在非国家行为体中变得更加常见。这使得公民能够更好地记录和传输违规行为，帮助针对这些行为准备更具实质性且更好的程序。这些技术有能力改变犯罪者与过渡正义维护者之间的权力平衡，因为这些曾经专为少数人掌握的技术现在已成为公民社会现实的一部分，使得能够收集和更好地分析有关滥用行为的信息。\n\
  \n过渡正义不断利用新技术来提高其在不同领域的效率。从识别和寻回人员，\n\n从这个意义上说，遵循一种通用技术\n\n本章旨在就使用区块链如何帮助解决当前问题创造新的视角。如果如果被理解为一种具有可审计交易、存储能力和在不同领域工作能力的通用技术，区块链可能非常适合适应过渡正义的需求。在区块链中，所交易的是信息的数字表示（一个数字代币），\n\
  \n本章分为两个部分。第一部分（`3.2`）旨在简要建立区块链的概念，而第二部分（`3.3`）将利用 Sarkin 的五大支柱理论阐过渡正义的一些主要元素，并提出使用区块链作为这些支柱的催化剂的新程序。\n\
  \n结论表明，区块链技术在包括过渡正义在内的不同领域具有巨大的潜力。它在各个领域（如数据共享、数字识别、资金筹集和钱物的分配，以及以更快、更安全和公开的方式对文档进行时间戳）的能力对于过渡正义场景具有重要价值。然而，必须记住区块链具有技术局限性，并考虑它可能如何影响过渡正义计划。最后，分析区块链如何协助过渡正义项目的唯一方法是理解每一个案例。\n\
  \n首先，重要的是定义什么是区块链技术，特别是它的技术方面，然后进一步决定在什么条件下其应用是可能的。在过渡正义（TJ）过程中，存在许多潜在的应用，例如人口的数字识别和文档的数字注册（即土地登记）。\n\
  \n区块链技术首次向世界介绍是在中本聪明关于比特币的论文中。\n\n简而言之，区块链作为一种使用“区块”的“点对点”版本的电子交易运行\n\n交易是记录在“区块”中的加密信息片段，这些片段以链的形式组织（因此名为“区块链”）。随着交易的发展，产生了一个数学问题，导致出一个加密数字，即区块的“指纹”。\n\
  \n另一个重要方面是，区块的哈希值包含了其所属链上之前区块的信息。因此，更改先前的区块将相应更改（重新计算）链上的后续区块。\n\n\n\n\n\n\n匿名性是另一个确保用户安全的特性。为了访问区块链系统并与他人进行交易，用户必须拥有一对私公密钥，这两个密钥都具有识别码并受到加密保护。`private-key`（私钥）赋予用户访问系统的私权限（包含登录和密码等个人信息），并激活\
  \ `public-key`（公钥），后者作为用户的身份标识。\n\n在处理特定情况时，可以为区块链平台添加其他功能。在处理过渡正义（TJ）时，可能还有其他关重要的属性，例如场景，在为此目的设计区块链系统架构时，必须考虑这些因素。\n\
  \n智能合约是一种区块链技术，允许所有交易自动发生，完全取决于交易双方的发起。\n\n通常，区块链系统是公开的，不需要许可即可参与。然而，还有其他类型的区块链系统更符合\
  \ TJ 的需求。\n\n在考虑 TJ 时，值得注意的是区块链技术系统可以分为两类：公链和私有链。公链是 `Bitcoin` 区块链运行的方式，它是一个任何人查看交易内容的公开网络。另一方面，私有网络不对公众开放，由所有者组成，由所有者决定谁可以访问系统。\n\
  \n此外，系统还可以决定用户如何与平台交互。这种划分分为无许可系统和许可系统。无许可系统允许任何用户参与交易和共识网络，就像 `Bitcoin` 区块链一样，任何具有足够能力的人都可以在系统中集成和运行。相比之下，许可网络将系统的参与限制在仅获得网络所有者许可的人员。\n\
  \n简而言之，区块链系统可以是公开的也可以是私有的，可以是无许可的也可以是经过许可的。例如，`Bitcoin` 区块链是一个公开、无许可的区块链系统，而控制私有公司供应链的区块链系统可能是一个私有且许可的系统，将节点限制在公司成员内部。换句话说，区块链的特征将根据其用途而有所不同。\n\
  \n在 TJ 系统中，可能存在不同的网络组合。私有且许可的区块链可用于数字识别事务，将敏感信息安全地存储在由实体控制的数据库中。公开且无许可的区块链（如 `Bitcoin`\
  \ 那样）也可以用于资金和捐赠平台，以支持 TJ 的支柱。存在多种可能性，可以根据需求和当地背景进行定制。\n\n通过使用上述所有工具，区块链已经演进，并现在处于新技术革命的前沿，为交易创造了一个无需中心控制方的、去中心化但可信赖的环境。\n\
  \n尽管最初用于金融交易，但该技术可以记录任何类型的信息，并用于各种用途。正是这一特征使区块链成为一种通用技术。\n\n\n过渡正义在国际社会中被广泛讨论。它也被应用于全球的几种情况，这些情况是大量文献和案例研究的主题。\n\
  \n联合国秘书长于 2004 年首次发布了提交给联合国安全会的报告，涉及冲突后情况下法治和 TJ 方面的问题。\n\n联合国通过《秘书长说明书》（`Guidance\
  \ Note of the Secretary-General`）完善了对 TJ 机制（或支柱）的理解。\n\n尽管 TJ 有多种定义，但大多数作者遵循与联合国报告中内容相似的理解。在这方面，过渡正义是指：\n\
  \n> 与社会试图解决过去大规模侵权遗留问题相关的系列过程和机制，以确保问责制、维护正义并实现和解。\n\n> 尽管对 TJ 的支柱和方法存在不同的理解和概念，但学者们达成广泛共识，认为\
  \ TJ 有四个初步支柱，即：诉讼、真相委员会、制度改革和赔偿。\n\n> 然而，TJ 方法中的一个持续存在的批评意见是，它们通常通过诉讼和真相委员会以西方方法确保恢复性正义和报复性正义。这种方法削弱了\
  \ TJ 进程，将当地社会的主体性转移到了国际/西方社区，导致了地方所有权的丧失。TJ 方法还未能解决冲突的根源，例如社会经济结构和社会不平等问题。\n\n>\
  \ 现在的意图是阐明 TJ 的支柱是什么，然后在每种 TJ 机制中使用区块链技术提出新的系统。\n\n\n真相委员会（`TC`）或真相与和解委员会（`TRC`）以非司法方式追求真相，这是处理过去暴行行为时的主要元素之一。根据过渡正义国际中心（`ICTJ`）的出版物《寻求真相》：\n\
  \n`TCs` 通常根据行政命令或法律设立，并考虑每个国家情况的特定特征。\n\n这种 TJ 中至关且具有决定性的机构具有特定的特征和考虑因素，必须遵守这些因素才能尽可能地发挥作用。\n\
  \n真相委员会也可以是真相与和解委员会（`TRC`），它们也追求和解。一些专家将 `TRC` 理解为一个不仅寻求过去侵权真相，而且理解和解在此类背景下作用的机构。和解工作增加了另一层挑战，这也就是为什么某些真相委员会在他们的名称和方法中加入了“和解”的概念，最为人知的例子是南非的\
  \ `TRC`。\n\n> 尽管如此，提到非官方真相项目（`UTPs`）也很重要。这些项目与 `TCs` 相似之处在于，它们促进对特定时间和地点过去侵权行为的历史重建。然而，官方与非官方真相委员会之间的主要区别在于，`TCs`\
  \ 拥有官方授权，而 `UTPs` 没有。\n\n> 然而，在人力和财务资源有限的背景下，针对公众意识和参与的大规模推广政策和结构，某些情况下信息收集可能是一个挑战。\n\
  \n> 真相委员会可能由于国家的压力和影响而遭受资源有限的问题。在某些情况下，国家不愿揭露真相，由于由于原因，`TCs` 获得国家的贡献较少。\n\n> 由于其非官方身份，`UTPs`\
  \ 依靠机构或公民社会的私人投资来生存，因此比其官方支持的对应机构 `TCs` 资源更加匮乏。\n\n\n\n\n解决这一问题的可能方法是通过基于区块链的众筹项目来收集公共财政援助。捐赠者将获得运营产生的代币作为补偿（即产品折扣），或者在其他情况下获得公司发行的证券。\n\
  \n众筹是一种筹资方式，即许多人通过互联网向某个项目贡献小额资金，并获得该项目的奖励。\n\n然而，在转型正义（TJ）需要资金来妥善开展工作的 TJ 情境下，众筹等倡议是一个可行的选择。由于区块链系统消除了中间方，投入的资金将直接进入真相委员会的资金。众筹倡议还允许全球社区更广泛地参与，因为任何拥有互联网连接和足够资源进行微小贡献的人都可以进行捐赠。在区块链系统中，还可以引入加密货币作为另一种捐赠支付系统。作为捐赠的回报，真相委员会可以发行实用代币，例如，让捐赠者获得委员会尚未公开的文档或其他激励措施。\n\
  \n资源匮乏导致的另一个问题是，真相委员会的触达能力有限，而这种能力本可以使公众参与真理发现过程。真相委员会承担着重要的社会角色，社会参与对于它们的工作和合法性至关重要。\n\
  \n真相委员会面临的另一个挑战是数据管理问题，特别是关于每条信息的收集、分析和编目。这可能会带来巨大的问题，尤其是现在，新科技（如具有视频或音频录制功能的智能手机）和社交媒体可以迅速生成并传播海量数据。\n\
  \n对于这两个问题，重要的一点是，在区块链系统中，信息的传输极快，在有互联网连接的地方使用智能手机，可以收集并审计许多不同的数据点，并让用户立即访问。\n\n\
  在公共区块链系统中，所有交换的信息都可以被任何拥有互联网连接和智能手机的人访问，这提高了系统的透明度和触达范围。此外，网络可以是许可制的，这意味着用户必须请求许可才能在平台上进行交易并向平台插入信息。因此，系统控制器（可以是真相委员会本身或其他控制者）可以只允许特定用户与网络交互。这可以提供另一层合法性，并对收集到的信息进行更好的控制。\n\
  \n从这个意义上说，随着网络中信息的被确认，节点（用户）可以将其标记为有效信息。这里的逻辑类似于供应链流程，但使用的是数据片段而不是产品。因此，随着数据流经不同的验证过程，它变得越来越合法，而且由于整个过程是公开的，对于公民社会来说也是透明的。因此，误导信息和过度无用数据的情况得到了控制和最小化。\n\
  \n\n对犯罪分子进行起诉（称为报复性正义）是使犯罪者承担责任的最传统方式。\n\n如今，国家拥有诉讼的首要管辖权，并在 TJ 项目的协助下增强和加强司法能力。\n\
  \n然而，国际刑事法院（ICC）遭受了批评，原因在于其作为当地人口人类安全代理的削弱作用，以及其自身的实地（*in locus*）人员，而且它作为报复性和分配性正义的补充机制，旨在通过专业知识和基础设施协助其他\
  \ TJ 机制和国家法院。\n\n尽管如此，起诉过程中仍可能出现程序性挑战，例如证据的获取、犯罪分子的识别、受害者和证人的保护、国家与国际刑事法院之间的国际合作、证据的保存以及信息的共享。\n\
  \n区块链技术可以为特定市场提供数据共享网络，所有节点都可以访问和交易所有信息。在公共许可系统中，交易具有更高程度的信任。\n\n从这个意义上说，信息的保护和共享问题得到了解决，由于只有特定节点能够插入数据，交换的信息仅由参与起诉过程的实体控制。尽管如此，所有数据都存储在网络中，这意味着没有中央机构对交易内容具有绝对托管权，从而为系统增加了另一层保护。\n\
  \n使用区块链收集受害人和证人的信息可能是巨大的帮助，因为有授权在系统中添加区块的组织可以直接去见这些人并听取他们的证词，并获得网络提供的匿名性。换句话之，此类行动可以为受害者、证人以及负责收集此类证词的当地团队引入另一层保护。\n\
  \n区块链技术还可以帮助国际刑事法院监控并协助当地人员和国家法院进行信息交换。将国际刑事法院作为区块链系统中的一个节点将促进不同国家和国际团体之间的数据传输，并对当地情况做出快速反应。例如，实地（*in\
  \ locus*）受害者的证词收集可以让国际刑事法院立即访问这些数据，从而提高法院以及其接触的当局和公民组织决策的准确性和敏捷性。预先建立的国际网络（以联合国和国际刑事法院等国际组织为节点）可以作为快速响应的解决方案。网络所有者可以允许其他成员参与，并在随后将其移除。\n\
  \n除上述之外，作为真相委员会提出的解决方案，国际刑事法院可以发起基于区块链的众筹项目，允许任何赞助者提供支持，并建立通过加密货币融资的可能性。加密货币的使用可能产生积极影响，因为其使用可以简化资金流程并降低成本。国际刑事法院可以使用此类资金支持来促进其作为补充机构的行动，并通过基金基金支持当地组织（如混合法院、真相委员会项目和赔偿计划）。因此，国际刑事法院可以加强其作为追求所有类型正义的机构和人类安全代理的补充功能。\n\
  \n如所示，在 TJ 情境下将区块链技术用于起诉与其在真相委员会情境下的使用类似，因为它旨在提高运营方面的效率，例如多个参与者之间的信息交换。\n\n\n根据联合国转型正义指南，\n\
  \n\n\n\n\n区块链技术在政府中的应用目前是一个广受讨论的话题。该技术在多个领域具有改进公共行政管理的潜力，并为所做的行政决策建立问责机制。\n\n区块链不仅可以用于提高国家决策的透明度，还可以协助与恢复民主机制相关的其他过渡正义（TJ）进程、审查程序以及教育。\n\
  \n所有的审查程序和其他公共机构的结构性改革都可以向一个监督机构负责，该机构的程序将在开放源代码区块链系统中公开。此外，所有做出的决策都将以数字格式进行时间戳和验证，并存储在网络上。这样来，公共机构的所有决策都将由监督机构通过区块链进行公开审计。\n\
  \n针对面向公职人员及未来世代的国际人权和人道主义法标准的教育计划，区块链技术可以通过监控教育时间表提供帮助。在这些情况下，可以开发出基于国际标准、由区块链和智能合约驱动的人权教育系统。员工使用其身份（或数字\
  \ ID）登录系统，课程将根据用户的频率或其参加的考试基于通过智能合约提供的模块，从而使当局对政府员工和教育系统中学生的教育计划有更好的控制。\n\n上述措施具有深刻的政治色彩。换句话说，必须有政治意愿将这些措施落实，重建公众信任并促进问责。区块链的优势在于可以在程序层面上运行，提供更高的透明度和更大的经济效益。\n\
  \n区块链在政府的其他领域也很有帮助，例如反腐败。\n\n\n过渡正义的另一个核心支柱是赔偿。它不仅出现在多项国际规范中，还被联合国大会通过 2006 年第 60/147\
  \ 号决议视为一项国际原则。\n\n某些类型的赔偿可以与其他支柱相关。在任何情况下，赔偿应与其所遭受的损害成比例。赔偿的不同类型包括：恢复（受害者先前的状况）、补偿（受害者遭受的任何可经济评估的损失）、康复（与受害者因损害可能产生的任何医疗和心理问题有关）、慰藉（寻求真相、纪念、正式道歉或司法或行政制裁的形式）以及不重复保证（通过国家机器机构的制度改革，主要在司法和安全部门）。\n\
  \n尽管国家有义务促进赔偿的充分性和有效性，但赔偿计划仍面临一些挑战。其中包括赔偿计划的覆盖范围（“完整性”）。\n\n赔偿的范围往往更广，因为它们不仅涉及个人补偿措施，还涵盖了被侵犯的多种权利，这些权利在个人、集体、公民以及政治、经济、社会文化领域以心理和具体的方式体现。\n\
  \n关于将考虑哪些违反行为以及授予何种类型的赔偿需要考虑。然而，此类问题通常带有政治偏见，并且对监测过渡正义进程的外国参与者构成了挑战。\n\n在该领域，区块链技术的应用也可以帮助建立全面的赔偿系统，协助向受害者提供援助并追踪的需求。\n\
  \n由于区块链技术的透明性和可溯性，赔偿——特别是财务赔偿——可以被追踪以确保向正确的受害者支付正确的金额。尽管如此，这些功能还可以通过生产链概念用于监测特定社区和受害者的健康产品和其他。\n\
  \n在土地恢复方面，区块链技术可以提供注册土地的新方法。即使无法实现土地恢复，国家也可以提供政府证券或券作为失去土地的补偿形式，这将为此类证券创建一个二级市场。\n\
  \n区块链技术的主要特征之一是确保没有账户的人获得经济包容性。\n\n关于受害者识别和参与赔偿计划，区块链技术可以通过数字 ID 存储受害者的身份，并使用生物识别系统（即数字和虹膜扫描）。\n\
  \n此类系统可以集成到基于加密货币的全球捐赠程序中，使任何人都能向赔偿计划捐赠。此类基础设施的管理可以由 `ICC` 通过 `TFV`（受害者信托基金）和国家进行。一种交付赔偿的整合国际方法可以是帮助国家负担赔偿措施的积极解决方案。\n\
  \n赔偿管理对政府来说是昂贵的。\n\n\n联合国指导意见将“国家咨询”作为其第五支柱。\n\n和解被理解为一个长期的社会过程，通过这一过程进行心理治愈，但需要参与者在形成新的和平共处关系中发挥积极作用。\n\
  \n寻求真相、正义和问责、社会经济平等、宽恕以及敌对之间的对话对于促进和解至关重要，涵盖相关地区全体人口的行动范围也同样如此。\n\n尽管存在所有这些问题，和解深度依赖于背景结构，这意味着每个案件都需要特定的措施，以有效地适用于当前的情况。\n\
  \n将和解视为过渡正义的第五大支柱，意味着它应该处于每个过渡正义进程的核心。和解的运动就是过渡正义的运动，其他机制的使用必须与共同目标相联系。和解不被视为最终目标，而是过渡正义过程的一部分。然而，将和解作为过渡正义的核心支柱意味着和解不仅是一个过程，本身也是一个目标。\n\
  \n然而，过渡正义的其他支柱可以独立运作，但其目标并非专门指向一个和解过程，这可能导致脆弱且短暂的和平期。\n\n区块链技术可以开发一个和解伞状网络，所有过渡正义机制之间可以用更快速、更安全的方式交换数据，以理解如何正确实现和解所需的共同基础。\n\
  \n区块链技术还可以通过作用于其他支柱间接协助和解。如果上述列出的所有区块链潜在用途旨在和解，那么它们都将间接地有助于和解过程。\n\n\n\n因此，区块链网络协助调解的目标依赖于两个方面。第一个是间接的，即区块链在其他过渡正义（TJ）支柱中发挥作用提高其有效性，但前提是这些支柱内置了调解方法。\n\
  \n第二个方面是创建一个基于伞形视角、由区块链网络驱动的综合系统，其中过渡正义不同部门的信息可以在节点之间交换。为特定市场建立完全通的过渡正义数据共享网络将促进调解，因为它将重新整合并分配来自各个过渡正义前线的信息，允许机制之间进行快速、安全且去中心化的数据交换。\n\
  \n因此，在最先进的情况下，由公共许可区块链系统驱动的广义网络将允许每个节点（由 TJ 支柱代表）之间进行通信和信息交易。只有获得许可的节点才能向网络中输入交易，但所有信息都是公开的。\n\
  \n\n本章分析了区块链技术如何与过渡正义过程相关联，并在最先进的区块链情况下验证了五个 TJ 支柱中的每一个。\n\n区块链技术为以去中心化、瞬时且安全的方式进行交易创造了新范式。它在无边界环境中创造了新类型的货币和资产。它还允许对生产链中的货物进行更彻底的审计，确保了整个生态系统中更好的标准。同时，许多政府一直关注其在公共部门现代化和提高效率方面的潜力。\n\
  \n区块链技术的特点：去中心化控制、共享的真相视图、跨界协作、数据审计以及通过数字令牌进行信息/价值交换，结合其可能的公共或私有、无许可或许可网络设计，可以对更敏感的领域（如过渡正义）提供极大帮助，特别是在政府被视为不可信的情况下。\n\
  \n然而，过渡正义是一个处理过去问题的国际人权法和人道主义法领域。它在非常复杂的条件下运作，在许多情况下缺乏实施妥善项目的适当资金。此外，国民和受害者之间存在信任和归属感问题。实现调解的道路是曲折的，需要大量的能量、规划、政治意愿和资源。作为一个脆弱的环境，过渡正义在其事业中承担不起错误，因为这可能导致敌对行为回归或恶化。\n\
  \n然而，如前所述，没有一种单一的方法适用于所有的 TJ 案例。区块链设备可以充分适应多种情况并发挥多种用途，适用于以更快、安全和透明的方式处理不同的需求。\n\
  \n尽管区块链是新的技术，但它还有很多待证明。区块链技术在不同领域增加有效性的潜力，以及支撑其他重要技术（如物联网 IoT 或人工智能 AI）的潜力，使其在多种情况下都成为一个极具吸引力的选择。拥有一个不完全依赖于政府本身，而且整合国际社区和公民群体并在共享真相视图的系统，是一个极佳的主意。\n\
  \n在本章分析的最先进的区块链概念中，该技术证明了它对于增强全面和整体过渡正义方法的效率极有益，使调解成为一个更易于管理的过程。将不同的社会部门和国际社区纳入其中，并使用涵盖所有\
  \ TJ 支柱和其他基本特征的集成伞形区块链系统，可以通过区块链技术成为现实。在公开系统中，许可节点之间快速、安全的数据交易可以增强流程的透明度并提高其覆盖范围。每个\
  \ TJ 支柱也可以有自己的区块链系统，纳入其特定的需求和特征。由于每条信息都可以被令牌化，令牌可以在节点和网络之间自由交易。\n\n尽管区块链是一种增强可审计数据交易和存储的技术，但将其用于赋能当地民众和受害者——根据其经济、社会和文化权利提供访问\
  \ TJ 过程的机会并参与——可以改变冲突后社会存在的社会政治和经济关系。\n\n然而，考虑实施区块链系统面临的挑战是非常重要的。在缺乏适当互联网连接或设备的地区，有需要克服的技术障碍，以及一些国家现有的法律限制。同样值得提到的是，由于其新颖性和复杂性，区块链技术仍然极其昂贵。\n\
  \n在 TJ 情况下，由于环境复杂，对这些问题的意识被放大，众所周知错误可能导致无辜生命的代价。国际行为者与国家之间的不信任问题、缺乏公众参与、缺乏政治意愿、资金不足以及其他问题增加了过程的复杂性。因此，必须彻底考虑区块链有多大的积极作用，以及在任何情况下其他技术是否更合适。可行性和价值问题对于决定区块链技术是否是具体情况下的最佳选择至关重要。\n\
  \n本章并非旨在将区块链作为全包式的 TJ 解决方案，而是提出这一突破性技术作为 TJ 可用于实现的多种工具之一，以最佳效果实施导致持久和平的调解过程机制。因此，尽管区块链面临挑战，但它是一项值得认真考虑的技术。\n\
