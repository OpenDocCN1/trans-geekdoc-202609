  \ 5.1 引言 5.2 南非法律下执行判决的传统方法 5.3 智能合约 5.4 在南非法律背景下的应用 5.4.1 执行 5.4.2 区块链执行法院令在实施中的实际阻碍\
  \ 5.4.3 对当事方的利益 5.4.4 诉讼费用担保 5.5 结论 参考文献\n\n## 摘要\n\n在南非，通过传统方法执行法院命令可能成本高昂且耗费时间。`现状`的替代方案可以是使用区块链进行链上执行。这将为当事人提供不可撤销和不可篡改性的双重利益。本章考虑了南非法律下的传统执行方法（第\
  \ 5.2 节），探讨了区块链执行的概念和属性（第 5.3 节），并介绍了区块链执行在南非背景下的两种可能应用案例以及实施的可能障碍（第 5.4 节）。\n\n\
  \n\n由于任何诉讼人都知道，如果获得的法院命令或仲裁裁决未得到执行，没有执行手段将基本上毫无意义。(¹²⁸)\n\n本章将从南非诉讼人的角度，考虑使用区块链执行法院命令的可能性。它将首先考虑南非法律下的传统执行方法（第\
  \ 5.2 节），然后考虑区块链执行的概念和属性（第 5.3 节），随后考虑区块链执行在南非背景下的两种可能应用案例以及实施的可能障碍（第 5.4 节）。\n\n\
  \n考虑以下场景：A 对 B 在南非提起商事诉讼。两家公司均居住在南非。该诉讼要么通过高等法院通过诉讼提出的，要么根据双方之间的仲裁协议在仲裁程序中提出的。由于诉讼相关原因，A\
  \ 需要为 B 提供诉讼费用担保。(¹²⁹)\n\n现在持有对 B 判决的 A 有权对其资产进行执行。(¹³⁰)\n\n作为起点，`规则 45`要求判权人（A）向高等法院书记员签具针对债务人（B）资产的执行令。(¹³¹)\n\
  \n完成此操作后，执行令将交给法警，法警要求前往债务人的营业场所“要求履行执行令，若未履行……则要求指定足够的动产和可处置财产以满足该执行令，若未能指定……则寻找此类财产。”(¹³²)\n\
  \n一旦法警准备好被扣押物品的清单，它们将在执行拍卖中拍卖给出价最高者，以全部或部分履行判决。(¹³³)\n\n`规则 45`还规定了根据签具扣押此类资产的执行令，由法警扣押无形资产（如股份或债权）。(¹³⁴)\n\
  \n不动产同样可以根据`规则 46`进行扣押，但执行该操作的程序更为繁琐。根据`规则 46`，在签具扣押不动产的执行令之前，必须获得法院的进一步命令，宣布该财产可用于执行债务人欠下的判金。(¹³⁵)\n\
  \n从上述描述的过程中可以看出，依赖传统的判决执行方法非常耗费时间。对于 A 而言，最终获得对 B 判决的履行可能需要几个月，甚至几年，特别是当根据`规则 45`针对动产的执行令未获履行，且需要向法院申请宣布\
  \ B 拥有的任何不动产可执行时。仅仅从法警处获得执行拍卖日期可能花费几个月，而实际的拍卖日期则在几个月之后。\n\n该过程也成本高昂。法警每出一次面都会根据预设的法院收费标准收取费用。(¹³⁶)\n\
  \n为了加剧判权人的困境，统一规则`规则 45A`允许债务人申请在法院认为的期限内推迟执行。(¹³⁷)\n\n因此，即使在判决做出后且不考虑对已出的判决进行可能的上诉，如果债务人能够对判决金提出真实的争议，仍可能获得执行的中止，从而进一步损害判权人的利益。\n\
  \n\n\n\n\n如果双方对争议进行仲裁，情况也并无不同。在仲裁程序中作出的裁决并非自动执行。相反，这取决于《仲裁法》第 `31` 节。\n\n因此，在我们的示例中，A\
  \ 方需要向法院提出申请，B 方有权对此提出反对，要求将其有利于其方的裁决转化为法院命令。只有在完成这一步后，A 方才能根据 `Uniform Rules 45`\
  \ 和 `46` 对该裁决（现已封装在法院命令中）进行执行。\n\n进一步假设，如果 B 方在南非法院的管辖范围之外拥有资产，A 方的处境将更加严峻。为了扣封这些资产，A\
  \ 方需要在该管辖区寻求对其法院判决或仲裁裁决的认可。如果判决或裁决获得认可，必须遵循该管辖范围内传统的执行手段。相反，如果由于某种原因判决或裁决未获得认可，A\
  \ 方在相应管辖区内将没有进一步的救济办法。\n\n总结之，《统一规则》中规定的传统执行手段并不适用于快速执行判决，这往往使其对诉讼人缺乏吸引力。\n\n如果确实如此，链上执行能否提供一种替代方案呢？\n\
  \n\n据提议，答案在于运行在区块链协议上的自动执行型“智能合约”。在从实际角度探讨这一提议之前，考虑智能合约的功能机制及其能力是有帮助的。\n\n智能合约的概念起源于\
  \ 1994 年尼克·萨萨博（Nick Szabo）发表的《智能合约》论文。\n\n尽管对智能合约的法律定义尚未达成共识，\n\n麦金尼（McKinney）等人（McKinney\
  \ et al）识别了智能合约共同具备的三个特征。\n\n因此，智能合约并非传统意义上的合同，而是一个计算机程序，在特定条件发生时执行预定义的交易。这方面的例子可能是一个股票购买交易，其中一方以定义价格出售股票，另一方希望购买。智能合约能够匹配卖方的报价与买方的接受，一旦匹配完成，交易将自动执行，即通过将股票转移至买方的经纪账户，并将交易款项记入卖方的经纪账户来完成扣款。\n\
  \n对于本文的论证而言，智能合约的一个重要特征是它们构建在区块链协议之上。\n\n在满足合同要求时，智能合约可用于在双方之间分配数字货币。\n\n智能合约（即其代码的执行）可以根据指定的且受信任的第三方“链外”信息进行触发，这利用了区块链“预言机”（oracles）。预言机是连接区块链与区块链外部系统的实体，使智能合约能够根据现实世界的输入进行执行。\n\
  \n库卢（Koulu）通过一个天气赌注的实际案例解释了智能合约运作的概念。\n\n## 5.4 在南非法律背景下的应用\n\n将智能合约概念应用于南非法院命令的快速执行问题时，两个主要的用例场景脱颖而出。\n\
  \n### 5.4.1 执行\n\n#### 5.4.1.1 智能合约的实施\n\n诉讼双方可以利用智能合约，在诉讼结束前通过智能合约的执行将双方约束在判决执行上，从而消除根据\
  \ `Uniform Rules 45` 和 `46` 进行执行的需要。\n\n回到我们的示例，A 方和 B 方可以在争议开始时约定，通过执行智能合约以加密货币的形式支付判决债务。具体何时达成约定取决于情况，但必须在判决做出之前。很可能，如果能达成此类协议，将在诉讼开始（传达传票时）或签署仲裁协议时完成。（如果拖得太晚，认为案件进展对自己不利的一方可能会不情意同意。）\n\
  \n每方都可以开设一个钱包，并将诉讼所需的加密货币转入其中。随后，双方需要编写或已编写好一个智能合约，该合约根据预言机的通知，如果获得有利于 A 方的判决则向\
  \ A 方支付等额金额；或者如果诉讼被驳回，则向 B 方支付诉讼费用。\n\n在预言机通知最终结果后，智能合约将执行并实现已发生的场景。如果存在上诉的可能性，智能合约必须在执行前为上诉通知或任何上诉裁决留出空间。\n\
  \n明确，同意这种行动方案的结果是完全绕过了 `45` 和 `46` 规则规定的法院认可的执行步骤。所提议的内容最终与发布法院命令或仲裁裁决且败诉方自愿履行没有区别。\n\
  \n主要的区别在于，在使用智能合约执行判决时，这种自愿履行在任何命令发布之前就已经预先在流程之中。\n\n### 法律与实务考量\n\n至关重要的是，双方必须意识到，法院或仲裁庭不会监督智能合约的达成过程，也不会以任何方式参与其形成，原因有三。首先，法院在争议结果出来之前不会干涉执行，除非被专门要求这样做（例如为了签发马雷瓦禁令，*Mareva*\
  \ injunction）。\n\n### 5.4.2 块链执行法院命令的实际障碍\n\n虽然在《统一规则》范围之外执行智能合约的提议在理论上听起来很简单，但存在着许多实际困难。\n\
  \n首先，该过程在本质上是技术性和新颖的。诉讼人可能需要适应允许代码执行诉讼结果的概念，并信任区块链过程能够恰当地实现结果。他们可能会对必须从零开始编写所需的智能合约感到望而却步（无论是由讼人自己完成还是第三方完成）。有趣的是，似乎截至\
  \ 2021 年 2 月，已经有了针对该技术的发展工作，这未来可能允许诉讼人使用具有易用用户界面的标准程序来编写他们的智能合约。\n\n\n\n\n\n第二是，南非法院或仲裁庭不会发布以加密货币支付的指令。任何录取的判决或裁决通常将以南非兰的形式进行。\n\
  \n第三是，任何由法院或仲裁庭作出的判决都将以书面形式提交给双方，通过电子邮件或通过南非高级法院的案件管理系统提交。\n\n关于这一点，Ortolani 认为：“预言机（oracles）机制可以很容易应用于仲裁；智能合约可以听从第三方裁决者（如仲裁庭）的裁定，并根据该预言机所作出的裁决，确定某些争议资产的最终接收者。换句话说，智能合约检索的外部信息可以是仲裁裁决，可以使用软件脚本来执行程序的结果。”\n\
  \n尽管这在理论上无疑是可能的，但要实现软件脚本与仲裁裁决之间无缝交互以执行智能合约的承诺，在可预见的未来不太可能成为南非的标准做法，这需要充当预言机的人员进行中介。\n\
  \n第四是，加密货币的价值具有众所名的波动性。\n\n第五，根据上述描述的过程以及可能出现的理论困难，是双方必须签署一份书面协议，来规范智能合约执行涉及的各个方面。协议必须规范诸如智能合约代码的创建、将使用的区块链平台、南非兰兑换加密货币的方式、诉讼结果提交到区块链的方式、将使用的预言机，并确保智能合约保留足够的加密货币价值，以使针对双方的任何指令生效。还需要考虑上诉的延迟执行概念以及在规定情况下可能的中止执行。此类协议在性质上将是详细且具有技术性的，并可能成为双方大量谈判的主题。协议本身也可能成为双方争议的主题。这些复杂性元素使得采用此类协议具有较小的吸引力。然而，如果区块链执行变得更加广泛，，未来可能会采用一种标准的协议形式。\n\
  \n### 5.4.3 对双方的好处\n\n第二是，南非法院或仲裁庭不会发布以加密货币支付的指令。任何录取的判决或裁决通常将以南非兰的形式进行。\n\n第三是，任何由法院或仲裁庭作出的判决都将以书面形式提交给双方，通过电子邮件或通过南非高级法院的案件管理系统提交。\n\
  \n关于这一点，Ortolani 认为：“预言机机制可以很容易应用于仲裁；智能合约可以听从第三方裁决者（如仲裁庭）的裁定，并根据该预言机所作出的裁决，确定某些争议资产的最终接收者。换句话说，智能合约检索的外部信息可以是仲裁裁决，可以使用软件脚本来执行程序的结果。”\n\
  \n尽管这在理论上无疑是可能的，但要实现软件脚本与仲裁裁决之间无缝交互以执行智能合约的承诺，在可预见的未来不太可能成为南非的标准做法，这需要充当预言机的人员进行中介。\n\
  \n第四是，加密货币的价值具有众所名的波动性。\n\n第五，根据上述描述的过程以及可能出现的理论困难，是双方必须签署一份书面协议，来规范智能合约执行涉及的各个方面。协议必须规范诸如智能合约代码的创建、将使用的区块链平台、南非兰兑换加密货币的方式、诉讼结果提交到区块链的方式、将使用的预言机，并确保智能合约保留足够的加密货币价值，以使针对双方的任何指令生效。还需要考虑上诉的延迟执行概念以及在规定情况下可能的中执行。此类协议在性质上将是详细且具有技术性的，并可能成为双方大量谈判的主题。协议本身也可能成为双方争议的主题。这些复杂性元素使得采用此类协议具有较小的吸引力。然而，如果区块链执行变得更加广泛，未来可能会采用一种标准的协议形式。\n\
  \n### 5.4.4 诉讼费用\n\n第二是，南非法院或仲裁庭不会发布以加密货币支付的指令。任何录取的判决或裁决通常将以南非兰的形式进行。\n\n第三是，任何由法院或仲裁庭作出的判决都将以书面形式提交给双方，通过电子邮件或通过南非高级法院的案件管理系统提交。\n\
  \n关于这一点，Ortolani 认为：“预言机机制可以很容易应用于仲裁；智能合约可以听从第三方裁决者（如仲裁庭）的裁定，并根据该预言机所作出的裁决，确定某些争议资产的最终接收者。换句话说，智能合约检索的外部信息可以是仲裁裁决，可以使用软件脚本来执行程序的结果。”\n\
  \n尽管这在理论上无疑是可能的，但要实现软件脚本与仲裁裁决之间无缝交互以执行智能合约的承诺，在可预见的未来不太可能成为南非的标准做法，这需要充当预言机的人员进行中介。\n\
  \n第四是，加密货币的价值具有众所名的波动性。\n\n第五，根据上述描述的过程以及可能出现的理论困难，是双方必须签署一份书面协议，来规范智能合约执行涉及的各个方面。协议必须规范诸如智能合约代码的创建、将使用的区块链平台、南非兰兑换加密货币的方式、诉讼结果提交到区块链的方式、将使用的预言机，并确保智能合约保留足够的加密货币价值，以使针对双方的任何指令生效。还需要考虑上诉的延迟执行概念以及在规定情况下可能的中止执行。此类协议在性质上将是详细且具有技术性的，并可能成为双方大量谈判的主题。协议本身也可能成为双方争议的主题。这些复杂性元素使得采用此类协议具有较小的吸引力。然而，如果区块链执行变得更加广泛，未来可能会采用一种标准的协议形式。\n\
  \n## 5.5 结论\n\n从本章的内容可以看出，南非传统的执行方式对于获得判决的诉讼人来说缺乏吸引力。正如所解释的，该过程既耗时又昂贵。\n\n现状的替代方案可以是使用智能合约进行链上执行。这对双方的好处显而易见——执行速度和支付的确定性对任何诉讼人来说都是福音。\n\
  \n在双方都能受益的情况下，例如涉及诉讼和反诉时，或任何一方都能从诉讼费用担保中获利时，尤为如此。\n\n虽然这一提议在南非背景下是新颖，但随着加密货币和区块链技术的更广泛使用并在商业上获得合法性，智能合约执行的使用也可能普及，从而使整个诉讼流程获益。\n\
