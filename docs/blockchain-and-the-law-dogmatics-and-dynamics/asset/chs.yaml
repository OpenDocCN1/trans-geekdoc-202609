  \ 4.5.3 加密货币的出售\n\n### 4.5.4 挖矿\n\n## 4.6 结论\n\n## 4.7 后记\n\n## 参考文献\n\n\n\n\n\n\
  此外，诚实信用原则在 `GTL` 第 104 条第 1)款中得到了保障。该项法律规定规定，如果税务机关（`TA`）在法庭上的行为违反此前向纳税人提供的约束性信息的内容，或者其在诉讼中的行为与相同情况下通常采取的做法不同，则可能根据恶意诉讼规则被处以财务罚款。然而，约束性裁决存在实务局限性：`TA`\
  \ 在出具约束性裁决后，并没有义务遵守所有属于同一准则范围的情况。相反，`TA` 与相同内容之间的联系是一种*双方之间（*inter partes*）的关系，因为禁止\
  \ `TA` 仅针对请求纳税人的特定案件采取不同于裁决的方向进行.^#fn90)\n\n简而言之，尽管现有的约束性裁决具有实际意义，但 `TA` 仅对提出请求的个人纳税人具有约束力，且仅限于该请求涵盖的事实（事实上，纳税人可以根据\
  \ `GTL` 第 68 条第 29)款对裁决提出上诉）。因此，尽管 `TA` 的“行为变更具有可责备性”，在阅读和解释约束性裁决时仍需谨慎，并考虑到诚实信用、信任以及平等原则。\n\
  \n最后，如果 `TA` 以面对面、电话或通过“*e-balcão*”提供解释^#fn91\n\n## 4.3 根据《企业所得税法》对加密资产征税\n\n###\
  \ 4.3.1 企业所得税法：简述^#fn92)\n\n葡萄牙 `CIT` 征收所有相关纳税人获得的所有收入（`CIT Code` 第 1 条）。`CIT Code`\
  \ 第 2 条规定了若干实体为纳税人，例如：(i) 在葡萄牙领土内设有总部或有效管理的商业公司或商业形式的民事公司、合作社、公司以及受公法或私法监管的其他法人；(ii)\
  \ 在葡萄牙领土内设有总部或有效管理的无法律人格实体，其收入在自然人或法人拥有的情况下分别不属于 `PIT` 或 `CIT` 的征税范围；^#fn93)\n\n\
  根据 `CIT Code` 第 3 条，应纳税额取决于纳税人的类型，但对于上述第 (i) 项中主要从事商业、工业或农业活动的实体^#fn94\n\n该法典的第\
  \ 4 条规定，对于在葡萄牙领土内设有总部或有效管理的法人和其他实体，`CIT` 对其总收入征税，包括在在该领土外获得的收入（全球收入原则）；而对于在葡萄牙领土内既没有总部也没有有效管理的实体，`CIT`\
  \ 仅对在该处获得的收入征税（属地原则或来源原则）。一般 `CIT` 税率为 21%，应纳税额在 25,000 欧元以下的中小型企业适用 17% 的优惠税率（见\
  \ `CIT Code` 第 87 条第 1)和第(2)款）。\n\n### 4.3.2 加密资产利润与会计视角的重要性\n\n`CIT Code` 下的纳税人可能通过加密资产获得多种收入，这些收入可能构成其应纳税利润。例如，它可能通过出售加密资产获得收益，通过提供与这些资产有关的服务获得佣金，通过销售涵盖加密资产行业的产品或服务获得收入，或者可能对其进行挖矿。在所有这些情况下，根据\
  \ `CIT Code` 的征税方式与纳税人通过生产和销售椅子、提供图像咨询服务或任何其他业务活动获得收入完全相同，因为这些活动属于业务性质的经济经营，并完全被\
  \ `CIT Code`（即其第 3 条）所涵盖。\n\n`TA` 尚未就加密资产和 `CIT` 发布过任何约束性裁决、一般性信息或其他解释。然而，葡萄牙注册会计师协会（“OCC”）于\
  \ 2019 年 3 月 22 日发布了关于加密货币的 `PT22246` 号技术意见。^#fn95\n\n由于 `CIT` 根据其法典确立的调整对利润征税，且起点是会计，因此会计在此背景下具有重要意义，人们应该问（从会计角度来看）：加密货币是严格意义上的（*stricto\
  \ sensu*）无形资产还是库存？证券代币是金融工具吗？实用代币是无形资产还是与客户的合同？\n\n关于加密货币，国际财务报告解释委员会（`IFRIC`）于\
  \ 2019 年 6 月发布了一份更新，在其中讨论了加密货币在国际财务报告准则（`IFRS`）下的性质，得出其属于国际会计准则（`IAS`）38“无形资产”的结论，“理由是\
  \ (a) 它能够从持有者处分离并单独出售或转让；以及 (b) 它没有赋予持有者获得固定或确定数量货币单位的权利”，从而排除了作为金融资产（`IAS 32` 第\
  \ 11 段）或现金（`IAS 32` 第 AG3 段）。此外，如果实体在日常业务过程中持有加密资产待售，则该项持有属于库存（`IAS 2`）。^#fn96\n\
  \n此外，经济合作发展组织（OECD）表示，虽然目前还没有关于加密资产的正式会计指南，但有应用现有的一般会计原则，即其经济目的、与之相关的权利和义务以及资产获得内在价值的方式。因此，证券代币可以被视为受\
  \ `IFRS 9` 约束的金融资产，而实用代币可以被视为根据 `IFRS 15` 处理的商品和服务的预付款.^#fn97\n\n总之，尽管在会计视角上存在一些不确定性（这会影响\
  \ `CIT`），但如果纳税人从加密资产获得收入，只要满足上述主观和客观条件，该收入将构成 `CIT Code` 的应纳税额。\n\n## 4.4 根据《个人所得税法》对加密资产征税\n\
  \n### 4.4.1 个人所得税法：简述^#fn98)\n\n所有在葡萄牙领土内的居民自然人^#fn99\n\n> 第 1 条\n> 应纳税额\n> 1—个人所得税对以下各项收入的年度价值征税，在扣除相应的扣除额和免税后，即使是源于非法行为的收入：\n\
  > A 表：工资收入\n> B 表：业务和专业收入\n> E 表：资本收入\n> F 表：财产收入\n> G 表：资本利得\n> H 表：养老金收入\n> 2—收入无论是以货币形式还是实物形式，无论在何处获得，以何种货币获得，均须征税。\n\
  \n\n\n\n因此，对于自然人而言，加密资产收入只有在符合 `PIT Code` 中六种收入类别之一时才需要缴纳个人所得税。在这种情况下，根据 `article\
  \ 1(2)` 的规定，无论支付是以实物形式还是现金形式（无论使用何种货币），都将征收税。这就是 `TA` 在下文小节描述的约束性裁决中所遵循的解释性路径。\n\
  \n\n葡萄牙关于加密资产的第一份约束性裁决发布于 2016 年。\n\n`TA` 首先断言加密货币“不是货币”，因为它们在葡萄牙不具有法币地位或清偿能力。此外，所分析的案例涉及通过买卖虚拟货币单位或以法定货币（无论何种货币）按加密货币汇率兑换获得的收益。该活动产生的收入在理论上可以纳入三种不同的收入类别：`G`（资本利得）、`E`（资本收益）或\
  \ `B`（经营或专业收入）。\n\n### 4.4.3 资本利得？\n\n`TA` 分析了此类收入是否可以被视为 `PIT Code` `article 10`\
  \ 下的资本利得（注意这涉及封闭式的分类），并提出了以下假设： \n\n* `TA` 认为这既不是股份的处置，加密货币也没有赋予获得任何金额的权利；\n* 它也不属于衍生金融产品，因为其估值并非基于任何底层资产；\n\
  * 最后，它辩称加密货币尚未属于证券，因为它们目前无法被归入 `Securities Code` `article 1` 的范畴。\n\n然而，人们可能会质疑某些加密资产是否可以被认定为非典型证券，因为\
  \ `Securities Code` `article 1(g)` 规定，“代表类似法律状况且具有市场可交易性的其他权益”属于证券。事实上，葡萄牙证券市场委员会（`CMVM`）发布的一份新闻稿声明，首次代币发行（`ICO`）中发行的代币如果它是代表可以在市场上传输的同质法律状况的文件，则可以被认定为非典型证券，但鉴于这种现实的复杂性和多变性，始终需要进行个案分析。\n\
  \n在官方机构之间对加密货币的认定（特别是在涉及买卖产生的收入方面）存在困难或差异并非未曾先例。这一点请参见下表 `4.1` 关于美国不同相关公共机构对加密货币认定的示例。表\
  \ 4.1 美国的示例\n\n| 加密货币认定 | 实体 |\n| :--- | :--- |\n| 货币 | • 联邦金融犯罪执法网络；外国资产办公室 |\n\
  | 财产 | • 联邦国税局 |\n| 大宗商品 | • 大商品期货交易委员会 |\n| 证券 | • 证券交易所委员会 |\n\n*来源* 作者\n\n然而，这在葡萄牙可能会引发问题，因为\
  \ `GTL` `article 11(2)` 规定，每当税收规则使用其他法律分支的特定术语时，必须按照该分支的规定进行解释，除非法律直接提供了不同的解释。因此，*从表面上看*（*prima\
  \ facie*），`TA` 应该遵循 `CMVM` 的解释。另一方面，`TA` 的解释提供了更高的法律确定性，因为不需要进行案例分析。尽管如此，考虑到 `CMVM`\
  \ 的公告（其发布时间比约束性裁决晚了近两年）且 `TA` 使用的措辞是“此时”，`TA` 改变立场并非不可能。然而，据我们所知，没有迹象表明这将发生。\n\n\
  \n`PIT Code` `article 5(1)` 规定，资本收益是指法律果实或任何经济利益，无论其性质或名称如何，无论是现金还是实物，直接或间接产生于动产性质的要素、资产、权利或法律状况，以及相应的变更、转让或终止，但在其他类别中征税的收益和其他收入除外。`TA`\
  \ 注意，该规则的起草是开放式的，`article 5` 提供了某些应税事件的示例（但并非唯一）。因此，在 `E` 类别中，应税收入是由于纯粹资本的应用而产生并征税的，即在不损害生产者实质内容的情况下产生的权利。由于所分析的案例是出售该权利产生的收入，该约束性裁决得出结论这不是资本收益。\n\
  \n### 4.4.5 经营或专业收入？\n\n最后，约束性裁决分析了 `B` 类别下的案例，阐述在这种情况下，收入是根据活动的开展征税的，而不是根据收入的来源（即无论收入源于销售、法律果实还是任何其他性质），根据\
  \ `PIT Code` `article 3(1)`。此外，活动的开展取决于其经常性和该活动获取利润的导向。\n\n在存在经营或专业活动的情况下，纳税人义务履行\
  \ `PIT Code` `article 3(6)` 规定的申报义务——每当其销售或提供服务时，必须开具发票或等效文件（电子发票收据）。在这种情况下，按一般累进税率征税。\n\
  \n随后，约束性裁决得出结论，加密货币的出售在葡萄牙税制下不征税，除非其经常性构成了经营或专业活动，在这种情况下，将在 `B` 类别下征税。因此，人们应该质疑如何区分经常性活动和偶然活动？这些是不确定的概念，可能会因其解释产生争议。然而，我们没有发现任何\
  \ `TA` 对此类收入征税的案例，除非纳税人宣布开始与加密货币相关的经营和专业活动。事实上，欧洲法院（`ECJ`）（尽管是增值税）已经表示，从事纯粹财富管理行为本身本身可能被视为从事经济活动的结果。\n\
  \n\n`TA` 关于个人所得税（PIT）和加密资产没有其他公开解释。尽管如此，考虑到 `PIT Code` `article 1(2)` 决定了无论以现金还是实物形式支付的收入的征税情况，这里有一些额外的思考。在我们看来，加密资产可以被认定为实物支付，如果合同各方同意这种支付形式，那么从税收角度来看没有障碍。例如，如果人在\
  \ `B` 类别下通过销售商品或提供服务获得加密货币作为支付，将按一般累进税率征税。如果用加密货币支付工资，将在 `A` 类别下征税，同样按一般累进税率征税。如果房东接受加密货币来支付租金，将在\
  \ `F` 类别下征税，适用 28% 的自主征税率。\n\n\n\n\n尽管如此，可能会出现一个实际操作困难：应该采用什么种兑欧元汇率？`PIT Code` 在其第\
  \ `23` 条中规定了在葡萄牙没有法定货币的货币中确定价值的规则（与欧元的等值应根据这些规则所产生的日期的相应货币的官方报价来确定）。然而，这并不是合适的解决方案，因为加密货币在技术上并不属于货币。\n\
  \n1. (a) 按照官方确立的价格；\n2. (b) 按照官方买入报价；\n3. (c) 对于货物，按照利斯本商品交易所的买入报价；若无此类报价，则按照该年度或上一次确定的平均价格计算，且该价格已包含在城市仓储费内；\n\
  4. (d) 按照国家统计局公布的货物或服务的价格；\n5. (e) 在竞争条件下，按市场价值计算。\n\n由于加密资产没有官方价格或报价，我们认为，应该使用市场价值（在交易所平台可获得）。例如，`IRS`\
  \ 对于硬分叉序列中加密货币空投所得的解决方案是，确定纳税基础是按相应的市场价值衡量的。\n\n\n### 4.5.1 增值税法：简介介绍\n\n在葡萄牙境内，由纳税人以其身份有偿地进行的货物转让和服务的提供（分别在\
  \ `VAT Code` 的第 `3` 条和第 `4` 条中定义）、货物进口（该法第 `5` 条）以及根据《社区内交易增值税制度》的定义和监管、在国家领土内开展的社区内交易，均须缴纳增值税（VAT）——详见\
  \ `VAT Code` 的第 `1` 条。\n\n`VAT Code` 的第 `2` 条规定了谁是纳税人，其中我们应该重点关注以独立且习惯的方式从事生产、贸易或服务提供活动（包括开采、农业和自由贸易活动）的自然人或法人，以及同样从事单次应税交易的人，只要该交易与上述活动的开展有关（无论发生在何地），或者无论是否具有此类关联，该交易都产生了\
  \ `PIT` 或 `CIT` 的实际影响（该条第 `a` 段）。\n\n存在一些豁免规定，即与活动类型相关的豁免（`VAT Code` 第 `9` 条）以及与营业额相关的豁免（该法第\
  \ `53` 条）。`VAT` 税率在法典第 `18` 条及附表中定义，其中一般税率为 `23%`，中间税率为 `13%`，优惠税率为 `6%`（针对大陆地区）。\n\
  \n\n在这一里程碑案件中，曾就将传统货币兑换 `Bitcoin` 或反之（由 Hedqvist 先生的公司持有）的交易是否缴纳增值税提出了预裁请求。`VAT\
  \ Directive` 的第 `2` 条首先指出，具有双向流的虚拟货币不是电子货币。此外，`ECJ` 认定存在对价。随后，`ECJ` 得出 `VAT Directive`\
  \ 第 `135(1)(d)` 条（豁免“涉及存款和活期账户、支付、转账、债务和其他可转让证券的交易（包括谈判），但不包括债务收回”）不适用，因为 `Bitcoin`\
  \ 是一种合同支付手段。然而，它认为第 `135(1)(e)` 条提供的豁免适用（“涉及货币、作为法定货币使用的纸币和硬币的交易（包括谈判），收藏品除外，即金、银或其他不通常作为法定货币使用的金属币或纸币，或具有钱币收藏价值的硬币”），因为如果涵盖了所有货币，由于增值税的目的是减轻确定计税基础的困难，`subjudice`（本案中）的交易将免于缴纳增值税。\n\
  \n最后，`ECJ` 指出此类交易不属于 `135(1)(f)` 条的范围（“涉及股份、权益、债券和其他证券的（包括管理或保管），但不排除证明物权的文件”），因为\
  \ `Bitcoin` 既不是授予物权的证券，也不是证券。\n\n### 4.5.3 加密货币的销售\n\n在葡萄牙，还有一份关于增值税目的加密货币销售的约束性裁决，在该裁决中，申请人询问了通过电子平台销售加密货币的法律框架。\n\
  \n`TA` 首先澄清，`Bitcoin` 是一种虚拟货币，且相关交易属于有偿服务提供（`VAT Code` 第 `4` 条），因为它不是货物的转让。如果这些交易是由纳税人在从事经济活动时有偿开展的，则构成了应税交易（`VAT\
  \ Code` 第 `1(a)` 条和第 `2(a)` 条），其计税基础对应对价金额（该法第 `16(1)` 条）。\n\n然而，该交易将免缴增值税，因为 `VAT\
  \ Code` 第 `9(27)(d)` 条豁免“涉及货币、作为法定货币使用的纸币和硬币的交易（包括交易），但不通常作为此类使用的或具有钱币收藏价值的”。\n\n\
  因此，该约束性裁决密切遵循 `Hedqvist 案`，并显示纳税人必须从事经济活动（根据 `PIT` 或 `CIT` 的附件 B），即该活动是以独立且习惯的方式进行的（增值税法第\
  \ 2 条）。\n\n\n`TA` 发布的此类问题的最后一份约束性裁决是关于通过`挖矿`获得报酬。\n\n然而，尽管有此裁决，对于是否存在实际对价仍存怀疑，不仅在上述案例中，活动并非提供给特定个人（而是提供给`pool`）。\n\
  \n\n| --- | --- | --- |\n| 挖矿活动 | • *超出范围*：`Bitcoin` 用户支付交易费并非成功发送比特币（因此并非获得矿工所提供的验证服务）的必要条件，这可能表明对价与服务之间没有直接联系。\
  \ | | |\n\n\n\n\n\n-   **应纳税**：矿工每当提供一次验证服务时，从比特币系统自动接收的新比特币，可能被视为构成应纳税服务的对价。\n\
  -   尽管理论上可以免费进行比特币交易，但在实践中，比特币用户通常会支付手续费（这是大多数数字钱包的默认设置）；而且几乎无法想象用户会愿意等待几天或几周才让交易得到验证（如果不支付手续费，可能会出现这种情况）。\n\
  -   **免税**：根据《增值税指令》`Article 135(1)(e)`，挖矿活动可以被视为免税，理由是它们属于直接涉及货币的服务。\n-   **免税**：根据《增值税指令》`Article\
  \ 135(1)(d)`，挖矿活动可以被视为免税，基于它们实际上履行了免税供应的特定核心功能（比特币本身的转让）。\n\n*来源* 欧盟委员会增值税委员会 2016\
  \ 年\n\n最后，应该注意到，正是因为欧洲法院（ECJ）的裁决并未涵盖矿业，并且如下表`Table 4.3`所示，欧盟仍然不存在增值税中性：表 4.3\n\n\
  ### 某些欧盟成员国的矿业增值税处理\n\n| 国家 | 税收 |\n| :--- | :--- |\n| 法国 | 从加密货币挖矿活动获得的收入作为服务供应需缴纳增值税。\
  \ |\n| 德国 | 从加密货币挖矿活动获得的收入通常不属于增值税范围。 |\n| 西班牙 | 从加密货币挖矿活动获得的收入通常不属于增值税范围。 |\n|\
  \ 瑞典 | 从加密货币挖矿活动获得的收入通常不属于增值税范围。 |\n\n*来源* 作者^(¹¹⁷)\n\n\n在加密资产背景下，应当注意到税收合法原则的重要性，因为如果事实不符合法定税收的规定，就不存在应纳税事件（因此，纳税人不应缴纳税）。法律确定性原则也同样相关，特别是在新的且复杂的领域。葡萄牙税务局（`TA`）的约束性裁决是任何纳税人可用的一项重要工具，因为它们阐明了税法的解释。这些裁决是公开的，通过`TA`行为的可预测性，为纳税人带来了更大的法律确定性。然而，`TA`\
  \ 仅对相关事实以及提交请求的纳税人具有约束力。\n\n`CIT Code`项下的纳税人可以通过加密资产获得多种收入，所有这些收入都构成了应纳税利润，因为这些活动属于业务性质的经济经营，并完全被`CIT\
  \ Code`涵盖（即其`article 3`）。正如`OCC`指出的，会计收入应考虑会计标准，即`IFRIC` 更新。\n\n对于个人而言，只有当我们能将加密资产收入归入六类收入清单之一时，才根据`PIT\
  \ Code`对加密资产收入征税。`TA`得出结论认为，出售加密货币产生的收入不属于资本利得，因为它们不是证券。尽管如此，人们可能会质疑某些加密资产是否实际上是《证券法》`article\
  \ 1(g)`项下的非典型证券。`TA`的解释提供了更大的法律确定性，因为不需要进行个案分析。尽管如此，考虑到`CMVM`的公告，并考虑到`TA` 使用的措辞是“此时”，`TA`改变其立场并非不可能。然而，没有迹象表明这将发生。相反，`TA`得出结论认为，在葡萄牙税制下，出售加密货币是不征税的，除非其定期性构成了纳税人的职业或业务活动，在这种情况下将作为业务或职业收入征税。此外，考虑到任何清单的收入都可以以现金或实物支付，如果`PIT`收入是用加密资产支付的，我们应当适用该法规定的`article\
  \ 24`，该条款为实物收入的现金等值提供了连续规则。\n\n最后，在`Hedqvist`案中，`ECJ`得出出售比特币是根据《增值税指令》`article 135(1)(e)`免增值税的服务供应，尽管它们不是货币，但为了该豁免目的，虚拟货币和传统货币应何相同。在此案之后，葡萄牙`TA`认为出售加密货币也根据《增值税法》`Article\
  \ 9(27)(d)`免增值税。最后，同样基于该案，葡萄牙`TA`得出结论认为挖矿将从相同的豁免中受益。\n\n\n自本章上次修订以来，发生了若干我们认为重要的相关进展。第一是**葡萄牙\
  \ 2023 年预算法**^(¹¹⁹) 的重大影响。\n\n在这方面，`PIT Code`现在对加密资产有了定义：“使用分布式账本或类似技术进行电子传输或存储的价值或权利的任何数字表示”。该概念不包括非同质的独特加密资产，即\
  \ NFT^(¹²⁰)\n\n`PIT Code`的另一项相关修订是关于加密货币和其他加密资产出售的新制度：`article 10(1)(k)`现在规定加密资产（非证券）的有偿转让符合条件^(¹²¹)。\n\
  \n对于其他类型的收入，值得注意的是**B 类（业务和职业收入）**的简化征收制度：在`PIT Code`的`article 4(1)(o)`中，现在将加密资产相关活动明确为商业工业活动，包括挖矿，并通过共识机制验证加密资产交易。此外，在简化征收制度范围内^(¹²²)\n\
  \n还应注意，`PIT Code`的`article 5(2)(u)`现在将加密资产相关活动的任何形式界为资本收入（E 类，率为 28%，也可按普通税率缴税）。此类收入免于预扣（无论何种形式——即使是用法币支付），当以加密资产形式支付时，根据`article\
  \ 5(11)`按 G 类（资本利得）征税，在这种情况下适用上述规则。\n\n对于企业所得税，第三章的内容保持不变。然而，`CIT`也有简化制度，现在规定在确定应纳税额时纳入加密相关收入，挖矿加密收入适用系数`0.95`，其他加密相关收入适用`0.15`（`CIT\
  \ Code``article 86.-B (1)(b)`和(e)）。对于增值税（VAT），第五章的内容没有变化^(¹²³)\n\n另一项重要的立法创新是明确规定，在加密货币购买房地产的情况下（即房地产与加密资产的交换），为了确定房地产有偿转让市政税（IMT）的课税基数，^(¹²⁴)\n\
  \n另一项重要的立法创新是印花税方面的^(¹²⁵)\n\n\n\n\n此外，由加密资产服务提供商收取或通过其中介收取的佣金和费用也按 4% 的税率征税，当提供者或客户居住在葡萄牙时，该税款由客户缴纳（见印花税总表第\
  \ 30 项，以及《印花税法》第 3(3)(w)条和第 4(9)条）。规定，当服务提供者位于葡萄牙境外时，缴纳税款的人为葡萄牙的中介机构；如果没有中介机构，则为服务提供者指定的代表（《印花税法》第\
  \ 2(1)(u)条）。\n\n最后，为了不仅实现合规而且实现执法，《个人所得税法（PIT Code）》第 124-A 条还包括`报告义务`，规定托管服务提供者和交易平台经理必须每年向税务机关报告其参与的所有加密资产操作。关于报告义务的此外（这不会改变加密资产的征税规定），一项相关的国际新标准源于`经济合作与发展组织（OECD）`的一份出版物，被称为`加密资产报告框架（CARF）`。(¹²⁶)\n\
  \n最后，2022 年 12 月 8 日，欧盟委员会通过了已计划的`修订第 2011/16/EU 指令的理事会指令建议（DAC8 建议）`^(¹²⁷)\n\n\n\
