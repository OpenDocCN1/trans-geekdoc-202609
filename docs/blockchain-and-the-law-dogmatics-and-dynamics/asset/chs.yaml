  João Vieira dos Santos 邮箱：`p6583@ulusofona.pt`\n\n## 6.1 DLT 试点机制的背景\n\n## 6.2 什么是\
  \ DLT 试点机制？\n\n## 6.3 什么是 DeFi？\n### 6.3.1 DeFi 架构\n### 6.3.2 DeFi 分类\n\n## 6.4\
  \ DLT 试点机制如何匹配 DeFi？\n\n## 摘要\n\n本章讨论了欧盟发布的新的 DLT（分布式账本技术）试点机制，考虑了其在 DeFi（去中心化金融）方面的使用和适用性。正如欧洲证券及市场（ESMA）关于加密资产的报告所述，监管机构在解释现有的法律要求、以及讨论将其应用于加密资产和\
  \ DLT 结构方面面临着困难。DLT 试点机制旨在以类似于监管沙盒的方式运行，允许并规范市场基础设施的操作，这些基础设施处理被界定为金融工具的加密资产交易，而这些交易在情况下是不允许运营或将面临过度且沉重的要求的。该机制旨在为目前定义的金融工具二级市场规则建立法律确定性，特别是当这些规则能够完全适用于\
  \ DLT 和加密资产，同时确保投资者保护、市场完整性和金融稳定时。\n\n**关键词：** DLT、DLT 试点机制、区块链、资本市场联盟、加密货币\n\n\
  ## 6.1 DLT 试点机制的背景\n\n欧洲委员会于 2020 年 9 月 24 日通过了一项关于“数字金融”的新方案包，其中包括数字金融和零售支付战略，以及关于加密资产和数字韧性的立法提案。第一个需求涉及在一个尚未受监管的领域引入规则，针对不符合欧盟金融立法其他工具定义的加密资产。第二个需求涉及调整某些适用于被界定为金融工具的加密资产的规则，以尊重技术中立原则且不为创新制造障碍。\n\
  \n对于第一种情况，欧洲委员会提交了《加密资产市场条例》草案，即广为人知的 `MiCA`。这项提议旨在实施一种类似于监管沙盒的方法，但更具体地关注在市场基础设施上交易的被界定为金融工具的加密资产。\n\
  \n正如 ESMA 关于加密资产的报告所述，监管机构在加密资产界定为金融工具时，在解释现有要求方面遇到困难。某些规则不适用于分布式账本技术（以下也称为 `DLT`），且主要与二级市场有关。这种理解在市场上具有一定的对应关系，因为已经进行了多次被界定为金融工具的加密资产公开发行；然而，二级市场的经验要稀缺得多。\n\
  \n解决被界定为金融工具的加密资产二级市场中的这些挫折，可以通过确保通过分布式注册技术发行和交易的此类工具具有更多流动性，从而促进一级市场。该提案本身通过在其一个序言中明确了这个问题，指出：“如果没有能够提供流动性并允许投资者买卖此类资产的二级市场，被界定为金融工具的加密资产一级市场将无法以可持续的方式扩张”。\n\
  \n关于该提案的谈判已经结束，欧洲议会和理事于 2022 年 6 月 2 日发布了 `Regulation (EU) 2022/858`（以下简称 `DLT 试点机制`），关于基于分布式注册技术的市场基础设施的试点机制，并修订了\
  \ `(EU) No 600/2014` 和 `No 909/2014`。\n\n## 6.2 什么是 DLT 试点机制？\n\n`DLT 试点机制` 允许使用分布式账本技术的市场基础设施获得临时豁免。此外，它是一项可选机制，并不阻止金融市场结构（如多边交易设施\
  \ `MTFs`、组织化交易设施 `OTFs`、中央证券托管机构 `CSDs` 和中央对手 `CCPs`）对被界定为金融工具的加密资产开展交易和交易后活动。`DLT\
  \ 试点机制` 允许 ESMA 和主管机构获得分布式账本技术特定机会和风险的经验。\n\n`DLT 试点机制`的实际范围限于适用于基于 `DLT` 的市场基础设施运营条件、使用的授权以及主管机构和\
  \ ESMA 的监管。在标的方面，该条例适用于投资公司、市场运营者和 `CSDs`。\n\n只有此类实体可以运营 `DLT 市场基础设施`，但有一个重要的例外：新准入者。确定接入\
  \ `DLT 试点机制` 的不应局限于现有经营者，因此未根据 `Regulation (EU) No 909/2014` 或 `Directive 2014/65/EU`\
  \ 授权的实体可以分别申请该条例或指令下的授权，并同时申请 `DLT 试点机制`下的特定授权——第 `8(2)`、`9(2)` 和 `10(2)` 条。\n\n\
  在此类情况下，国家主管机构不应评估该实体是否符合 `Regulation (EU) No 909/2014` 或 `Directive 2014/65/EU`\
  \ 的要求，只要其已申请 `DLT 试点机制`下的豁免。这意味着这些实体是具有有限授权的法人，因为它们只能根据 `DLT 试点机制`运营 `DLT 市场基础设施`。在特定授权到期后，其授权应撤销，除非实体提交了根据\
  \ `Regulation (EU) No 909/2014` 成为 `CSD` 或根据 `Directive 2014/65/EU` 成为投资公司或市场运营者的完整授权申请。\n\
  \n`DLT 试点机制` 引入了 `DLT 市场基础设施`的新地位——第 `2` 条第 `5` 点。它包括 `DLT MTFs`、`DLT SSs`（结算系统）和\
  \ `DLT TSSs`（交易和结算系统）。对于这种新地位同样重要的是了另一个概念，即 `DLT 金融工具`，它对应于通过分布式账本技术发行、记录、传输和存储的金融工具——第\
  \ `2` 条第 `11` 点。\n\n\n\n\n因此，`DLT MTFs` 是仅允许交易 `DLT financial instruments` 的 `MTFs`（《DLT\
  \ 试点制度》第 2 条第 6 点）。另一方面，`DLT SSs` 是对 `DLT financial instruments` 进行交易结算的结算系统，无论这些结算系统是否已根据第\
  \ 98/26/EC 号指令获得指定和通知（因此不受限于该指令中“系统”的定义），且它们允许对 `DLT financial instruments` 进行初始记录或提供与\
  \ `DLT financial instruments` 相关的托管服务——《DLT 试点制度》第 2 条第 7 点。最后，`DLT TSSs` 是结合了 `DLT\
  \ MTF` 和 `DLT SS` 提供服务的 `DLT MTFs` 或 `DLT SSs`——《DLT Pilot Regime》第 10 点。\n\n由于这是一个实验性制度，对于准入金融工具的类型和数量预见了以下限制——《DLT\
  \ 试点制度》第 3 条第 1 款：\n\n* 发行人市值或临时市值低于 5 亿欧元的股票；\n* 发行规模低于 10 亿欧元的债券、其他形式的证券债务或货币市场工具（衍生品或复杂产品除外）；\n\
  * 集合投资计划管理资产市场价值低于 5 亿欧元的份额。\n\n准入 `DLT market infrastructure` 交易或在其上记录的所有 `DLT\
  \ financial instruments` 的总市值不得超过 60 亿欧元；如果准入新的 `DLT financial instrument` 交易或初始记录导致总市值达到该数值，则该\
  \ `DLT market infrastructure` 将不再允许该 `DLT financial instrument` 交易或注册——《DLT 试点制度》第\
  \ 3 条第 2 款。然而，上述所有阈值均为从属性，考虑到国家主管机构可能会设定较低的阈值——《DLT 试点制度》第 3 条第 6 段。\n\n假设在 `DLT\
  \ market infrastructure` 上准入交易或注册的所有 `DLT financial instruments` 总市值已达到 90 亿欧元。在这种情况下，`DLT\
  \ market infrastructure` 的运营商将启动过渡策略并通知国家主管机构——《DLT 试点制度》第 3 条第 3 款。\n\n关于授予 `DLT\
  \ market infrastructures` 运营商的豁免，`DLT MTFs` 可以豁免于 2014/65/EU 号指令规定的中介义务。传统的 `MTFs`\
  \ 仅允许投资公司、信贷机构和其他具有足够交易能力和专业知识并维持充分资源和组织安排的人员作为成员或参与者。因此，传统的二级市场交易如下方的图 6.1 所示：![Fig.\
  \ 6.1 ¶ Traditional Market Operation. ¶ Source The authors](img/540017_1_En_6_Fig1_HTML.png)\n\
  \n图 6.1 ¶ 传统市场运营。 ¶ 作者所有\n\n在上述图中，我们包含了执行上述中介业务的经纪人，这些实体负责接收并向 `MTF` 传输投资者的订单。对于执行其管理的实体和管理结算系统的\
  \ `CSD` 来说，这是必要的。\n\n然而，加密资产交易平台为零售投资者提供了直接访问，这很大程度上是因为分布式账本技术为数字媒介中的价值流通提供了更高的安全性。因如此，《DLT\
  \ 试点制度》允许主管机构根据 `DLT MTF` 运营商的请求，临时豁免该中介义务，以向零售投资者提供直接访问并允许他们在自己的账户上进行交易。(¹⁶³) ![Fig.\
  \ 6.2 ¶ DLT MTF operation. ¶ Source The authors](img/540017_1_En_6_Fig2_HTML.png)\n\
  \n图 6.2 ¶ DLT MTF 运营。 ¶ 作者所有\n\n由于投资者可以直接访问 `DLT MTF`，因此不需要经纪人。结果是我们在市场交易中仅发现两个服务提供商（`DLT\
  \ MTF` 运营商和 `CSD`）。对于零售投资者直接访问 `DLT MT` 定义了某些条件，这些条件需要由国家主管机构进行评估。此外，这些机构可能要求 `DLT\
  \ MTF` 运营商采取额外的投资者保护措施——《DLT 试点制度》第 4 条第 2 款。\n\n根据《DLT 试点制度》第 5 条，旨在运营 `DLT SS`\
  \ 的 `CSD` 可在提供适当理由的情况下向国家主管机构申请遵守 (EU) No 909/2014 号条例的豁免（包括）：\n\n* 第 2(1) 条第 (4)、(9)\
  \ 和 (28) 小项——无形形式、转让指令和证券账户的定义；\n* 第 3、37 和 38 条——账面形式的记录、发行的完整性和证券保护；\n* 第 6 和\
  \ 7 条——防止和处理结算失误的措施；\n* 第 19 条——活动和服务的扩展与外包；\n* 第 33、34 和 35 条——参与要求、透明度和通报程序；\n\
  * 第 39 和 40 条——结算终结和现金结算；\n* 第 50、51 和 53 条——CSD 之间的接入。\n\n在上述规则中，我们重点介绍了两个特定豁免。首先是豁免通过信贷机构或投资公司进行中介的义务，这允许零售投资者直接访问由\
  \ `DLT SS` 运营的结算系统。第二个豁免涉及现金结算实体（使用银行货币）在《DLT 试点制度》下开发解决方案，以便接入商业货币或使用“电子货币令牌”。(¹⁶⁴)\n\
  \n对于 `DLT TSSs` 运营商，它们可以申请 `DLT MTFs` 和 `DLT SSs` 享有的豁免，前提是符合豁免附带条件以及主管当局要求的任何补偿措施——《DLT\
  \ 试点制度》第 6 条。尽管如此，我们展示了获得所有豁免的 `DLT TSS` 运营模式，如下图 6.3 所示：![Fig. 6.3 ¶ DLT TSS operation.\
  \ ¶ Source The authors](img/540017_1_En_6_Fig3_HTML.png)\n\n图 6.3 ¶ DLT TSS 运营。\
  \ ¶ 作者所有\n\n由于自然人可以直接参与市场和结算系统，因此不需要经纪人。此外，《DLT 试点制度》允许同一实体管理交易和结算系统。这种豁免组合使得市场上仅由一个实体提供服务，这非常接近当前加密资产市场参与者的意图。\n\
  \n《DLT 试点制度》还为 `DLT market infrastructures` 运营商提供系列额外要求，即：(i) 资金、担保或 `DLT financial\
  \ instrument` 损失时的责任；(ii) 破产时的保护措施；(iii) 特定报告义务；(iv) 运营风险管理——《DLT 试点制度》第 7 条。\n\n\
  这些额外要求对于避免与分布式账本技术或 `DLT market infrastructure` 运营方式相关的风险是必要的。例如，`DLT market infrastructure`\
  \ 运营商需要告知其计划如何开展活动，以及分布式账本技术的使用与传统 `MTF` 或运营结算系统的 `CSD` 提供服务的方式有何不同。\n\n\n\n\n在授予特定授权时，分布式账技术（DLT）市场基础设施的运营者还应具备可靠的退出策略，以防\
  \ DLT 试点制度终止、特定授权或某些获得的豁免被撤销，或超过 DLT 金融工具的阈值。此类策略应包括如何从基于分布式账技术的运营向传统市场基础设施进行转换或回溯——DLT\
  \ 试点制度第 7(7) 条。\n\n国家主管机构是指根据 `Directive 2014/65/EU` 第 67 条、`Regulation (EU) No\
  \ 909/2014` 第 11 条或通过成员国其他方式指定的机构——DLT 试点制度第 2(21) 条。这些机构在授予特定授权之前，应向 `ESMA` 提供所有相关信息——DLT\
  \ 试点制度第 `8(6)` 条、`9(6)` 条和 `10(7)` 条。这是因为在必要促进豁免的一致性和比例性时，或在必要确保投资者保护保护、市场完整性和金融稳定时，`ESMA`\
  \ 可能向国家主管机构提供关于所请求豁免的非约束性意见，或关于所用分布式账技术类型适用性的意见——DLT 试点制度第 `8(7)` 条、`9(7)` 条和 `10(8)`\
  \ 条。\n\n审查 DLT 市场基础设施运营者提交申请的国家主管机构有权拒绝授予特定授权，前提是有有理由相信 DLT 市场基础设施将无法遵守联盟法确定的适用规定或不属于联盟法范围的国家法律规定；有理由相信\
  \ DLT 市场基础设施将对投资者保护、市场完整性或金融稳定构成风险；或者该申请构成了规避现有金融要求的尝试——DLT 试点制度第 `8(10)` 条、`9(10)`\
  \ 条和 `10(10)` 条。\n\n在授予特定授权后，如果在底层技术或 DLT 市场基础设施运营者提供的服务和活动中检测到异常，且该异常未被相关服务和活动提供的收益所抵消，主管机构有权撤销授予\
  \ DLT 市场基础设施的特定授权或任何豁免；或者当 DLT 市场基础设施运营者违反主管机构授予的授权和豁免所附带的任何义务，或者 DLT 市场基础设施运营者注册的金融工具超过了\
  \ DLT 金融工具的阈值，或不符合 DLT 试点制度规定的适用于此类工具的其他条件——DLT 试点制度第 `8(12)` 条、`9(12)` 条和 `10(12)`\
  \ 条。\n\n`ESMA` 必须在 2026 年 3 月 24 日之前向欧盟委员会提交报告，其中包括成本效益分析，以决定 DLT 试点制度延长至最长三年、将该制度扩展到其他类型的金融工具、对其进行修改、转换为永久制度或将其终止——DLT\
  \ 试点制度第 14 条。DLT 试点制度于 2022 年 6 月 22 日生效，大部分规则自 2023 年 3 月 23 日起适用——DLT 试点制度第 19\
  \ 条。\n\n在实施本条例时，重要的是，证券记录系统的规则在欧盟范围内尚未统一。\n\n## 6.3 什么是 DeFi？\n\nDeFi（去中心化金融）是一个去中心化应用程序（dapps）的生态系统。\n\
  \nDeFi 可能包括跨多个管辖区的多个参与者、中间者和终端用户提供的金融服务，并具有纯技术基础设施以促进代理人之间的交互。\n\n在本章中，我们将通过描述该技术的底层基础设施以及金融行业内的不同应用，对\
  \ DeFi 生态系统进行概述。\n\n### 6.3.1 DeFi 架构\n\n本小节通过对其分层提供通用且非技术的概述，说明了 DeFi 结构的简化版本。DeFi\
  \ 使用具有不同目的的分级多层架构。如图 [6.4] 所示，它分为三个主要层：结算层、协议层和接口层。\n\n![Fig. 6.4 ¶ DeFi layered\
  \ system. Source The authors](img/540017_1_En_6_Fig4_HTML.png)\n\n图 6.4 ¶ DeFi 分层系统。来源：作者\n\
  \n1. **I. 结算层（第一层）**:\n   第一层由 `DLT` 组成。\n\n2. **II. 协议层（第二层）**:\n   第二层包含编译器和创建应用程序接口（API）的能力。编译器是一种将当前高级编程语言转换为低级编程语言的程序。\n\
  \   第二层包括可以编译的编程语言（如 `Solidity` 或 `Python`）、智能合约。\n\n3. **III. 接口层（第三层）**:\n   第三层创建了面向用户的应用程序，允许用户通过网页与应用程序交互。接口的目的是让程序能够通过大多数用户熟悉的对象（如文本框、按钮或网页上的任何交互）来执行代码中嵌入的属性。\n\
  \n### 6.3.2 DeFi 分类\n\n本小节旨在描述 DeFi 的当前主要应用。存在被称为“稳定币”和“衍生品”的类别，它们正式指的是特定工具的表示；然而，本小节的范围是确定协议级别的应用。因此，这些术语仅用于技术参考的方便。\n\
  \n目前，DeFi 有七大类：\n\n1. **IV. 稳定币**: 稳定币是通常在分布式账本上交易并依赖加密验证技术进行交易的加密资产，旨在实现相对于法币的稳定价值。原则上，稳定币允许用户保护其持有的名义价值。\n\
  \   * **V. 法币支持的稳定币** 旨在通过其可能代表的法币作为抵押来维持稳定价值。\n   * **VI. 资产支持的稳定币** 旨在通过多种法币、一件或多种商品、其他加密资产或此类资产的篮进行抵押来维持稳定价值。\n\
  \   * **VII. 算法稳定币** 算法稳定币旨在通过内置的稳定函数维持稳定价值，这些函数根据需求变化提供此类加密资产供应的增加或减少。\n\n去中心化稳定币（b、c）旨在解决法币支持的稳定币（a）可能产生的信任问题。理想情况下，去中心化稳定币通过超抵押或算法方法以去中心化的方式创建，完全在去中心化账本上运行，由去中心化自治组织治理，并且都可以公开审计其储备金。因此，可以得出去中心化稳定币的核心组件如下：\n\
  \n* **抵押**: 这是稳定币主要价值的存储处。抵押本身可以是外生的（主要用于其他协议）、内生的（抵押是作为该协议内的抵押而创建的）或内含的（设计缺乏显式的抵押存储处）。\n\
  \n\n\n\n\n- **代理人 (Agents)**：抵押品提供者和稳定币用户。\n- **治理 (Governance)**：管理协议的函数和参数。\n\
  - **发行 (Issuance)**：一种控制稳定币发行的机制。\n- **预言机 (Oracles)**：将外部数据（如价格喂）导入到区块链的机制。\n-\
  \ **借贷市场 (Lending and Borrowing Markets)**：这些协议旨在为任何抵押其加密资产并以此获得贷款的人提供借贷服务。贷款人还可以通过向贷款池贡献资产并赚利息来获取收益。\n\
  \n由于 DeFi 和区块链的特性，借款人是伪匿名的，没有机制可以识别代理人、访问其信用评分和还款能力，并对违约执行任何法律程序。为了防止借款人违反债务义务并给贷款人带来信用风险，借款人必须抵押其仓以覆盖债务价值。由于各种加密资产的历史波动性和流动性不足，因此需要超额抵押。如果底层资产的市场价格崩溃，不会影响贷款市场资金，因为足够的抵押品可以覆盖借贷人的债务。债务通常以美元或代表美元的稳定币发行。\n\
  \n借款人必须确保抵押品价值始终高于协议设置的预清算阈值，否则“清算者”可以折价购买锁定抵押品并关闭借款人的债务仓位。\n\n### IX.\n#### **交易所\
  \ (DEXs)**：DEX 的“诞生源于解决中心化平台漏洞的渴望”。\n\n### X.\n#### **订单簿去交易所 (Order Book DEX)**：维护订单簿状态是一项计算密集型任务，且鉴于无信任和公共分布式账本技术的设计，在链上托管它是不可行的。因此，想要执行订单的用户将签署交易，允许\
  \ DEX 在满足某些条件时代表其执行交易。订单通过手动或算法进行匹配；然而，这始终将涉及对链下机制的某种程度的信任。\n\n### XI.\n#### **自动做市器\
  \ (AMM)**：AMM 是一种去中心化协议，依赖数学公式对资产进行定价。AMM 不需要订单簿，因为资产是根据定价算法定价的。创建市场的流动性由流动性提供者提供。\n\
  \n流动性提供者将资金注入流动性池，其中两种或多种资产的储备被锁定在智能合约中。每个流动性提供者都会收到新铸造的流动性代币，代表其在池中流动性的份额。用户存款资产时可能会发生交易，从而为该特定资产提供更多流动性，并提取池中存入的一个或多个其他代币的储备。由于池资产的比例随着流动性的提取和增加而变化，流动性提供者根据其流动性份额获得的代币比例可能与其最初存入的不同。这种风险被称为无常损失。\n\
  \n### XII.\n#### **衍生品 (Derivatives)**：衍生品是其价值源自底层资产、事件或结果表现的合约。如果没有可以衍生其价值的底层资产，衍生品本身是没有价值的。自从开发用于帮助农民降低风险的衍生品合约以来，衍生品合约用途、类型以及衍生品市场规模显著增加。衍生品可用于管理与底层资产相关的风险，但它们也可能增加合约另一方的风险敞口。如今，衍生品不再仅仅用于降低风险，也是许多基金经理和零售投资者投资策略的一部分。\n\
  \n### XIII.\n#### **典型衍生品 (Typical Derivatives)**：典型的衍生品合约（包括期货和期权）可以定义为具有底层规模和价格、到期日和结算机制。\n\
  \n### XIV.\n#### **永续合约 (Perpetual Swaps)**：这些合约是期货合约和差价合约的混合体，没有固定的到期日，结算可以通过交付底层资产来实现。此外，如果交易者的仓位资金不足，他们可能会通过提供资金交易来保留其仓位。\n\
  \n### XV.\n#### **合成资产 (Synthetic Assets)**：抵押品支持的代币，其价值根据底层资产参考指数而波动，而不直接持有该资产。某些平台允许创建加密资产支持的合成资产，提供对商品、股票、指数或其他资产的链上价格暴露。\n\
  \n### XVI.\n#### **组合管理 (Portfolio Management)**：DeFi 协议允许链上资产管理的自动化。加密资产被存款并汇总到智能合约中，并根据智能合约中编码的投资策略或由池经理进行分配。投资策略可能涉及组合再平衡。\n\
  \n### XVII.\n#### **支付 (Payments)**：区块链允许任何人无需信任的中介或托管人发送价值；然而，交易在区块链上需要一些时间才能确认并变得不可逆。DeFi\
  \ 支付协议允许处理即时且高量的微支付，这可能消除将加密资产托管给信任第三方的风险。\n\n### XVIII.\n#### **保险 (Insurance)**：保险是一种风险管理策略，个人在发生不幸事件时从保险公司处获得财务保护或赔偿。DeFi\
  \ 保险协议到目前仍限于链上风险覆盖，任何代理人都可以为保险协议列表提供的任何智能合约的意外使用购买保障。当发生类似于“The DAO”黑客攻击的事件时，代理人将获得此类黑客攻击造成的任何财务损失保障。\n\
  \n## 6.4 DLT 试点计划如何与 DeFi 匹配？\n\nDLT 试点计划的目的之一是利用分布式账本技术（金融领域的变革性技术）的潜力，减少中间介并随后降低交易成本。这一目的与交易和结算活动中的效率、透明度和竞争等多种收益有关。\n\
  \n在这种背景下，许多重复的业务流程（即在托管链的每一层单独输入交易数据）以及昂贵的对账，可以被消除。\n\n\n\n\nDLT 试点制度（DLT Pilot\
  \ Regime）允许 MiFID II 下的投资公司或市场运营者运营分布式账本交易结算系统（DLT TSS），并允许其享有与 DLT MTF 和 DLT SS\
  \ 运营者相同的豁免待遇，包括作为成员或参与者在引导零售投资者接入市场基础设施时履行中介业务的义务。\n\n图 6.2 展示了交易和结算服务的传统运营模式。在\
  \ DLT 试点制度下，DLT TSS 对这种传统运营的作用是消除了经纪人和中央结算机构（CSD）访问市场、托管和结算的需求（由图 6.2 中的交叉表示）。通过\
  \ DLT TSS，金融工具市场的价值链中只需要一个运营者。\n\n然而，重要的是，在某些 DeFi 应用中，没有自然人或法律实体执行或提供交易或结算服务^(¹⁹⁰)。\n\
  \n首先，该术语用于结算层，其中节点网络通过无关且独立的代理之间的点对点连接构成一个无许可区块链，而不是依赖于中央服务器或中央组织。这种去中心化轴被称为架构分布^(¹⁹¹)。\n\
  \n其次，该术语可能指加密资产托管的去中心化（由中介提供的非托管型加密资产）。在传统金融中，托管是一项核心金融服务，托管人代表客户保管资产。通常，这项服务由托管机构的声誉以及法律监管框架背书。使用托管机构的核心原因是确保资产不丢失或不被盗。因此，安全性和信任度在资产保管方面是共生关系。随着\
  \ DeFi 应用的技术出现，在没有中央机构背书的情况下证明信任度的解决方案，是通过对一组功能进行稳健、抗抗性且透明的技术实现，其中只有客户/用户有权访问存储在特定智能合约中的资产^(¹⁹²)。\n\
  \n第三，该术语指的是协议管理、组织和所有权的去中心化。尽管这种去中心化在所有层级都是基础性的，但 DeFi 协议中存在着明显的“去中心化治理”趋势。那些通过代码模拟公司实体运营并在其协议中集成去中心化治理功能的组织通常被称为去中心化自治组织（DAO），^(¹⁹³)。\n\
  \n由于 DeFi 并非由密封隔舱组成，^(¹⁹⁴)，\n\n中介对于金融运营是关重要的，因为商业银行、投资银行、股票经纪、共同基金、保险公司和交易所形成了现代金融结构所有框架的基础^(¹⁹⁵)。\n\
  \n正如经济合作组织（OECD）和金融稳定委员会（FSB）所出的，大多数 DeFi 项目通常存在于中心化的光谱上，这取决于应用程序的发展阶段^(¹⁹⁶)。\n\n\
  此外，正如金融行动特别工作组（FATF）最新建议所示，DeFi 应用通常运行在分布式账本上，但仍存在一个中心方，例如创建和发行资产^(¹⁹⁷)。\n\n最后，随着新\
  \ DeFi 现有者的出现，DeFi 应用可能会演变为日益中心化的平台^(¹⁹⁸)。\n\n结论是，DLT 试点制度可以涵盖某些 DeFi 类别，例如去中心化交易所（DEXs）和稳定币。自然，在\
  \ DLT 试点制度内拥有“真正的”去中心化应用是不可能的，因为这要求运营者对服务的提供负责。尽管如此，这将是去介化和促进非托管业务模式的重要一步。\n\n\n\
  \n自从几种不同的加密资产出现并进入主流视野以来，区块链几乎从未中断地处于新闻焦点（该术语包括加密货币、虚拟资产、虚拟货币、数字资产、数字货币以及全球范围内使用的类似定义，并涵盖了被用或分类为支付代币、证券代币、实用代币和稳定币等“代币”），并已向公众开放。监管机构的兴趣（特别是在\
  \ 2022 年下半年）呈指数级增长，这正导致人们重新关注此前被称为加密货币“荒西部”的领域（[`www.wsj.com/articles/sec-will-police-cryptocurrencies-to-maximum-possible-extent-chair-gary-gensler-says-11628007567`](https://www.wsj.com/articles/sec-will-police-cryptocurrencies-to-maximum-possible-extent-chair-gary-gensler-says-11628007567)）。除了加密生态系统带来的法律和监管考虑外，当局还在研究从其底层技术和概念中利用的可能性，并测试了如土地登记、社会福利管理、专利保护以及中央银行发行的数字货币（中央银行数字货币或\
  \ `CBDCs`）相关的解决方案。值得注意的是，所有这些活动可以使用区块链或基于分布式账本（DLT）的解决方案，但并不一定需要。这包括 `CBDC`，它可以通过区块链类型的解决方案、传统方法或两者的结合进行发行和管理。在本章中，我们考虑了\
  \ `CBDC` 主题、定义及其影响，并特别强调了匿名性——我们认为在世界范围内中央银行实施 `CBDC` 的过程中，这一点至关重要，特别是当主要和先进经济体的中央银行推进\
  \ `CBDC` 解决方案时。\n\n关键词：区块链 中央银行数字货币 CBDC 加密 结束 摘要\n\n## 7.1 引言\n\n`CBDC` 是当今的话题。自\
  \ 2018 年后期以来，中央银行对 `CBDCs` 的兴趣和公众干预变得更加积极，从 2020 年下半年和 2021 年第一季度开始快速增长^¹⁹⁹。\n\n\
  广泛接受的定义是：`CBDC 是由中央银行发行、以国家记账单位计价的数字货币，它代表了中央银行的负债`。`CBDC` 可以是“零售型”（即用于通用），也可以是“批发型”（即供金融机构限制性访问）。`CBDC`\
  \ 与现金之间的主要区别在于形式。`CBDC` 以数字形式存在，不像以实体硬币和纸币形式存在的现金。\n\n根据国际银行（`BIS`）对中央银行数字货币的第三次调查结果^²⁰⁰，\n\
  \n除了上述因素，`BIS` 调查还指出了一些让中央银行考虑 `CBDC` 的隐含动机，例如维护国家货币货币主权^²⁰¹。\n\n上述动机或政策目标已国际货币基金组织（`IMF`）近期发布的一项研究得到证实^²⁰²。\n\
  \n尽管动机和潜在收益各异，但 `CBDC` 的实施涉及中央银行需要审慎考虑的多种影响。这些包括 `CBDC` 实施的法律影响（如法定货币的采纳），以及网络风险、数据隐私、会计影响和金融稳定。另一方面，仍在出现的技术替代方案需要经过仔细评估，以适当应对并实现上述政策目标。\n\
  \n另一个与 `CBDC` 设计特征相关的相关方面（目前在不同机构之间仍有很大争议）是关于中央银行发行数字货币的所有权及其交易的匿名性。在所有权方面，目前纸币在很大程度上是匿名的，而银行或支付账户上超过一定限的交易由于国家\
  \ `AML/CFT`（反洗钱和反恐怖主义融资）要求是可以追溯的。\n\n但在法律上，中央银行数字货币是否有可能完全或至少部分匿名？或者，中央银行和其他机构是否会利用这一机会，最终完全追踪公司和个人使用的资金，并解决\
  \ `AML/CFT` 风险？公众会对这一切何反应？技术方面又如何？中央银行是倾向于使用基于中心化账本的中心化技术，还是它们更倾向于使用分布式账本技术（如区块链）作为实施\
  \ `CBDC` 的更合适选择？\n\n由于上述主题在涉及公众采纳和使用数字货币的意愿，以及在涉及中央银行发行 `CBDC` 的限制时，可能会成为重大问题，因此我们决定在本章中分别基于欧洲背景下的法律框架和某些中央银行对技术选择的决定来分析上述问题。\n\
  \n## 7.2 匿名方案与作者调查结果\n\n2020 年 10 月，七家中央银行联合 `BIS` 发布了一份报告^²⁰³\n\n\n\n*   在灵活且创新的支付系统中与现金和其他类型的货币共存；\n\
  *   任何引入都应支持更广泛的政策目标，不对货币和金融稳定造成损害；\n*   特征应促进创新和效率。\n\n考虑到现金的主要特征是既没有身份记录也没有交易本身的记录，从客户的角度来看，转向完全可追溯的支付手段并非易事（除了从技术角度看可以通过\
  \ `CBDC` 实现的其他特征，如对某些类型支付的限制或约束、可逆性以及负利率的应用）。尽管如此，在上述报告中，完全匿名并不被认为是一个可行的方案。尽管解决\
  \ `AML/CFT` 担忧未列为中央银行视角的主要动机之一，但预计后者在向公众发行 `CBDC` 时将遵守这些规则。\n\n根据 Bech 和 Garratt\
  \ 发表的一篇论文 (2017)^²⁰⁴\n\n英国银行（`BoE`）在其 2020 年发表的讨论书中^²⁰⁵\n\n### 7.1 但消费者对支付以及由中央银行发行的通用\
  \ CBDC 中的匿名性价值有多有多如何？\n\n为了本章的内容，我们进行了一项 104 人参与的调查。我们的目标群体主要是对 `CBDC` 拥有坚实或基础理论知识的人，包括中央银行家/监管机构（40%）、私人支付服务提供商（14%）、开发/国际组织（11%）、律师/咨询公司（13%）以及学术界（10%）。参与者来自四大大陆，大部分人来自欧洲（55%）。向参与者提出了三个主要问题，详细说明如下。\n\
  \n关于“*在在线进行支付交易时，你多大重视保护隐私的匿名性*”，大多数受访者（77%）回答说他们并不那么重视，因为他们通常信任受监管和监督的支付服务提供商，尽管他们大多数倾向于使用信用机构的在线支付应用程序进行支付。只有\
  \ 21%的人回答说他们对匿名性非常敏感，因此他们从不在在线进行支付交易，因为他们不想与任何支付平台分享个人数据。\n\n\n\n\n对于“你更倾向于哪种匿名性（交易对手还是第三方）”这个问题，如果让让他们进行选择，大多数受访者（约\
  \ 39%）表示他们倾向于完全匿名。在在这两种类型之间选择的人中，只有 10%倾向于交易对手匿名，30%倾向于第三方匿名。在这一类别中，人们似乎更关注支付服务提供商收集和管理的信息类型，而不是由资金接收方所收集的信息。21%的受访者对任何选项都持中立态度。\n\
  \n最后一个问题是关于受访者对央行自身发行 CBDC 时匿名性的忧虑。考虑到很大一部分受访者来自中央银行，这一问题的结果并不出人意料。最青青的答案（58%）是，他们意识到支付交易中匿名性相关的风险（例如反洗钱/反恐怖融资），因此他们希望匿名性仅适用于低于特定阈值的支付。这似乎与不同司法辖区为了反洗钱和反恐怖融资目的而对现金支付采取的方法相同。尽管如此，仍有\
  \ 26%的参与者表示，他们希望 CBDC 像现金一样完全匿名，这样央行就无法追踪或监控他们的交易或消费习惯。这一结果与第一个问题的结果一致，即 21%的人回答说他们担心隐私，且不想与任何支付平台共享个人数据。16%的受访者完全接受非匿名\
  \ CBDC 的可能性，因为他们认为这是央行解决经济中非正规化问题的良好机会。根据这项调查，我们提取出以下结论：\n\n> 首先：匿名性似乎并不是我们受众的普遍关注点，因为与监管的支付服务提供商共享真实身份并不是新鲜事。他们已经习惯了与支付服务提供商共享个人数据，尽管大多数人更倾向于信用机构。\n\
  \n> 其次：如果人们可以选择，他们会倾向于进行完全匿名的交易，但另一方面，他们理解不这样做对整体经济的重要性。因此，目前适用于现金支付的反洗钱/反恐要求（要求对超过特定阈值的支付进行身份识别）被他们认可为一种解决方案，并预计也将应用于\
  \ CBDC。这对于计划直接向公众发行 CBDC 的央行来说，这可能更加棘手，因为它们必须建立自己的监控结构和能力来确保这一点。\n\n基于欧洲中央银行（ECB）的综合分析^^(207)\n\
  \n根据概念验证^(208)\n\n欧盟委员会通过新的拟议反洗钱/反恐怖融资条例，^(209)\n\n在表 7.1 中，我们总结了上述讨论的 CBDC 设计中不同匿名性层级的优缺点。表\
  \ 7.1\n\nCBDC 设计中不同匿名性层级的优缺点\n\n| | 完全匿名 | 部分匿名 | 无匿名 |\n| --- | --- | --- | ---\
  \ |\n| 优点 | 除形式外外，CBDC 将将像现金一样。人们将更容易接受它，因为他们对使用现金的感知没有变化，他们将继续像以前一样进行现金支付。根据 Kahn\
  \ 等人 (2005) 和 Mc Andrews (2017) 的观点，收款方和支付方可能更支持这一选项，因为他们可能想减少身份盗取的风险、交易对手跟他们回家并进行攻击的可能性，或者像定向广告和推销（垃圾信息）等无害的烦扰。人们越快接受新的数字货币，其实现和成功分发就越容易。\
  \ | 部分匿名允许较低金额的/或在特定时间内进行有限次数的匿名交易。而对于高价值交易或超过特定阈值的交易，他们必须进行身份识别。这一选项允许人们以安全的方式进行高价值交易，同时为低价值支付的执行提供灵活性。\
  \ | 确保金融交易的完整性。确保资金丢失或被盗时的全额覆盖或保护。 |\n| 缺点 | 增加了洗钱/融资的风险，因为它可能被用于犯罪活动；资金丢失时没有安全和保护，因为持有者无法证明资金属于自己。这对于依赖现金且金融包容率低的经济体来说尤为不利。对货币的信任可能会受到质疑。\
  \ | 需要机构密切合作和协调，以确保充分遵守既定的匿名限额。^(210) | 人和交易将不断被追踪和识别。因此，个人在交易中的隐私受到监控。这可能为政府的监控和审查提供机会（例如法治薄弱、机构无能且政治问责较少的国家）。^(211)\
  \ 无法保证客户数据不会因政治原因被误用或遭受网络攻击。由于反洗钱目的需要央行进行密切监控，而这是它过去未参与过的活动，因此也可能产生声誉风险。 |\n\n*来源*\
  \ 作者\n\n## 技术方案\n\n虽然技术发展的飞速可能是一个积极因素，但这并不能帮助央行在设计 CBDC 的决策过程中。通常情况下，央行在中心化账本系统中运行，而\
  \ DLT 解决方案（其中区块链无疑是最广为人知的）带来了一种新的技术选择。由于 DLT 仍处于发展阶段，它在处理能力和适用性方面带来了许多不确定性。尽管如此，央行之间并没有拥采用\
  \ DLT 作为发行 CBDC 的主要技术的通用方法。\n\n处于 CBDC 测试或试点高级阶段的央行正在评估 DLT 应用与中心化账本的对比，以识别限制和局限性。中国人民银行（`PBC`）已经在试点中测试了\
  \ DLT，认定其处理交易的能力有限，特别是在交易量巨大的日子。因此，`PBC` 承诺采用`混合架构`，这意味着 DLT 将在有限区域使用，同时也允许其他技术出现在其核心中心化账本上。乌拉圭中央银行在电子比索的第二次试点中也可以遵循类似的方法。第一次试点并非基于\
  \ DLT。\n\n巴哈马中央银行（CBOB）——全球首个发行 CBDC（沙哈元）的中央银行，以及尼日利亚中央银行的 CBDC（电子纳拉）——都在部署 DLT.^(213)\n\
  \n\n\n\n\n随着各国央行推进央行数字货币（CBDC）实施项目，涉及法律和监管影响的问题和疑问也随之增加。这是因为 CBDC 不仅仅是一个技术项目，其成功实施不仅取决于技术问题。除了可能出现的政策和政治问题（这些问题因司法管辖区的不同而异），还应对对立法方面进行仔细评估。央行法和货币法处于领先地位，但其他首要法律如商业银行法、税法、私法、支付系统和支付服务法、数据保护法、反洗钱/反恐怖主义（AML/CFT）法等可能需要评估并修订.²¹⁵\n\
  \n## 7.5 央行货币与私人货币的区别——法律授权\n\n利用上述部分提到的定义，CBDC 代表央行的负债。与流通现金或在央行的商业银行账户（代表央行负债表上的负债账户）类似，CBDC\
  \ 将获得类似的对待。这些资金由央行以物理（流通现金）或数字形式（CBDC 和商业银行账户）发行，因此它们属于央行货币的定义。另一方面，客户存商业银行的资金是属于他们自己的私人货币，因此登记在商业银行的负债表负债中。央行负债的创造与央行的法律授权密切相关。但尽管央行一直向商业银行或政府提供数字形式的现金，但到目前为止尚未向公众提供任何此类服务。因此，目前的“流通现金”负债账户始终与物理现金而非其数字形式相关。因此，相关的央行法应明确授权²¹⁶\n\
  \n## 7.6 法定货币\n\n全球许多央行是其所在司法管辖区内发行法定货币的唯一法律授权机构。某些适用法律将货币发行仅限于纸币和硬币，而另一些法律使用了更广泛的措辞，未将货币发行限制在纸币和硬币.²¹⁷\n\
  \n发行数字形式的法定货币如何？从技术上讲，通过修订央行法并将 CBDC 明确指定为法定货币是可能性的。但这不仅仅是一个法律技术问题。法定物理货币可以全范围内广泛地获取和使用并作为支付手段，遗憾的是，数字形式可能无法做到这一点。因此，将数字货币指定为法定货币可能被认为对老年人、残障人士或在数字或财务上被排除在外的人等弱势群体不公平，²¹⁸\n\
  \n## 7.7 萨尔瓦瓦案例\n\n总结本章，尽管与当前主题并非完全相关，但我们介绍了萨尔瓦瓦的案例，该国在 2021 年采用比特币作为法定货币。这可能有用且具有启发性，因为萨尔瓦瓦案例展示了一些与\
  \ CBDC 实施相关的方面：央行和当局直接向公众提供法定货币（例如支付政府津贴和福利）、民众对“官方”数字渠道（如政府赞助钱包）的适应以及授予非物理货币法定地位。\n\
  \n### 7.7.1 国家背景\n\n萨尔瓦瓦是一个小国²¹⁹\n\n从美国向萨尔瓦瓦汇款的成本随着时间的推移不断下降。根据世界银行数据库，2021 年第一季度发送\
  \ 200 美元的平均总成本占汇款金额的 2.91%，而 2020 年第四季度为 3.13%，2019 年第四季度为 3.53%.²²⁰\n\n另一方面，萨尔瓦瓦的金融包容水平很低。根据\
  \ 2021 年发布的最新全球金融普普调查（Global Findex），只有 31% 的成年人在金融机构开有账户，而 2017 年为 29%，因此金融账户拥有率略有上升。这与全球数据结果相比低得多，全球范围内拥有金融机构账户或移动货币服务账户的成年人比例从\
  \ 68% 增加到 74%。调查受访者（54%）提到没有账户的主要原因是金融服务太贵。尽管 70% 的汇款接收者是女性，但只有 24% 的女性拥有账户。大多数汇款家庭接收者（94%）将这些钱用于日常消费，大约\
  \ 79% 可归类为贫困或面临贫困风险的人.²²¹\n\n### 7.7.2 比特币作为法定货币\n\n萨尔瓦瓦总统于 2021 年 6 月宣布将向国会提交法案，使比特币成为该国的法定货币。此决定的原因之一包括促进正式经济和增强金融包容性，以及允许萨尔瓦瓦人更容易、更廉价、更快地转账数十亿美元的汇款.²²²\n\
  \n尽管面临国际货币基金组织（IMF）和世界银行的担忧，²²³\n\n然而，一年后的数据显示，比特币的使用并没有像当局和加密爱好者最初预期的那样被民众接受。政府在\
  \ 2022 年 1 月声称，萨尔瓦瓦有 400 万比特币用户²²⁴\n\n小企业主和个人列出的主要问题是虚拟货币的波动性导致人们亏钱、由于范围内可兑换现金的\
  \ ATM 数量有限导致的物流问题，以及 Chivo 客服未解决的技术问题.²²⁵\n\n尽管面临所有挑战和挫折，萨尔瓦瓦案例预计不会保持孤立状态。2022 年\
  \ 4 月，中非共和国成为世界上第二个采用比特币作为法定货币的国家.²²⁶\n\n然而，考虑到来自国际机构（如国际货币基金组织和世界银行）的怀疑和忧虑，以及许多国家对这些机构在财政支持和援助方面的依赖，同时也考虑到比特币和其他加密货币由于其波动性和缺乏监管控制而可能带来的风险，将实施比特币或其他加密货币作为法定货币的决定必须根据国家优先事项和人口的财务状况进行仔细权衡。目前加密市场的现状，特别是在\
  \ `Terra Luna` 崩溃之后²²⁷\n\n\n\n\n\nAgata Ferreira，波波兰理工大学行政与社会科学学院，行政法与公共政策系，Pl.\
  \ Politechniki 1, Warsaw, 00-661, Poland。\n邮箱：`agata.ferreira@pw.edu.pl`\n\n## 摘要\n\
  智能合约引发了许多有趣的法律问题。目前正在进行的法律辩论涉及与智能合约相关的潜在法律陷阱，包括有效且具有约束力的法律合同的存在、区块链记录的不可篡改性与合同缺陷之间的协调、准据法和适用管辖权、消费者保护、反洗钱/打击恐怖融资（AML/CFT）要求、自动化且不可停止执行的影响，以及部署在无边界去中心化区块链网络上的智能合约的隐私和保密问题。本章概述了智能合约最常提到的优点，并强调了围绕智能合约的学术法律辩论的激烈。它还介绍了迄为止为应对智能合约现象所采取的一系列立法计划。\n\
  \n**关键词：** 智能合约、合同法、自动化、权利与义务、私法。\n\n## 8.1 引言\n智能合约正被部署于多个领域，包括金融领域、公共部门、供应链管理，以及汽车、房地产、保险和医疗保健行业。\n\
  \n尽管合同法是一个相当发达的法律领域，且合同自由在大多数司法管辖区都得到了广泛认可，智能合约仍然引发了许多有趣的法律问题。\n\n第一部分介绍了智能合约的起源及其随着区块链技术的黎明而复兴。第二部分解释了智能合约最常被提到的优点并考察了其价值。第三部分概述了正在进行的法律学术辩论。第四部分分析了不同司法管辖区选定的智能合约立法计划。最后一部分提供了结论性意见。\n\
  \n## 8.2 起源\n计算机科学家兼法律理论家尼克·萨博（Nick Szabo）在 20 世纪 90 年代首次创造了“智能合约”这一术语，并以自动自动售卖机作为一个“典型的现实生活案例，我们认为它可以是智能合约的原始祖先”。\n\
  \n智能合约存在于区块链技术之前，但区块链使得智能合约从简单的自动化合约进步为构建在去中心化平台上并由区块链生态系统支持的完全自主执行和自我履行的合同。\n\n\
  ## 8.3 优点\n智能合约的支持者强调了自动化、标准化和透明化属性带来的效率优势。\n\n智能合约的乐观者设想通过专门使用智能合约，商业活动可以“避免合同起草的高成本、司法干预、机会主义行为以及书面语言固有的模糊性”。\n\
  \n对于自由主义者来说，智能合约由于其自包含的规则以及不受国家干预的能力，被认为是个人自我决定和自主的体现。\n\n费尔菲德（Fairfield）指出，智能合约的去中间化将消费者保护从法院（法院历史上“长期拒绝执行消费者所提供的合同条款”）转移到了自动化的消费者级购买代理。\n\
  \n## 8.4 法律辩论\n这种在点对点和不可篡改的基础上自动自主执行合同条款的自执行软件的想法在法律上仍然存在问题。法律辩论通常由代码应被视为一种“外来法律系统”的主张引发。\n\
  \n### 8.4.1 智能合约是合同吗？\n法律界一直在努力智能合约在法律意义上是否为合同。这种困惑很大程度上源于术语的误解以及法律与技术的重叠，导致了激烈的学术辩论。其中一些甚至产生了对智能合约的反驳，认为它们既不是智能的也不是合同。\n\
  \n一些作者认为，与传统合同不同，智能合约遵循简单的条件 `if–then` 逻辑，而传统合同的矩阵是基于“要约与承诺”的二进制序列中的共识连接，即意图的合。\n\
  \n每个法律体系的合同法基础决定了创建一个有效且具有约束力的合同需要什么。普通法（如英国法）要求三个要素：要约、承诺和对价，以构成有效合同的形成。英国管辖权工作组（UKJT）近期表示，“智能合约满足这些要求的能力与更传统的或自然语言合同一样好，因此智能合约能够具有合同效力”。\n\
  \n### 8.4.2 代码即法律？\n据描述，“代码即法律”（Code is law）成为一些智能合约支持者维护的自由主义理想，根据这一观点，仅凭技术本身就提供了足够的监管参数来管理智能合约。“代码即法律”这一说法由莱西格（Lessig）创造，从以后被用来表示底层软件代码事实上成为了网络空间架构和基础设施的监管者。代码作为网络空间的监管者并不是一个新观点。里登堡（Reidenberg）描述了网络空间的自我监管。\n\
  \n米克（Mik）反驳了“代码即法律”适用于智能合约的命题，认为此类观点“错误地假设在技术上编码交易的每一个方面是可行的，并且在法律上排除法律系统的运行是允许的”。\n\
  \n在区块链技术出现后，德菲皮（De Filippi）和赖特（Wright）将“代码即法律”的概念向前推了一步，引入了加密法（Lex Cryptographia）的概念，这是一种新的法律范式，代表“个人自由和解放理想可能实现的世界”。\n\
  \n使用图灵完备脚本编写的区块链智能合约允许任何自然语言表达式翻译成代码，这为网络空间自我监管的概念引入了新的维度。加密法被定义为法律的新子集，即“通过自执行智能合约和去中心化（自主）组织管理的规则”。在这种模型中，“法律和代码可能会合并，因此人们违反法律的唯一方法就是有效地破解代码”。为了促进法律融入代码，法律可以向类代码的表达演进，这可能导致“法律逐渐变成代码”。\n\
  \n\n\n\n针对这一主张，其他学者认为有必要“提醒合同法的基本原则”，并承认智能合约对合同或整个法律体系的“潜在影响有限”。^(²⁴⁴)\n\n智能合约也凸显了紧张关系，并具有改变公共领域与私有领域边界的潜力。它们实现了个人之间新颖经济交换形式，这可能挑战现有的交易形式，并测试既有的公有与私有领域划分。Karlstrøm\
  \ 表示，在区块链代码的约束下，这种不受限制的交易自由实际上可能会产生相反的、削权的效应，使商业关系变得“僵化、不可逆转且不可谈判”。区块链等技术可能导致社会关系变得“日益僵化，并牺牲活活性以及随之而来的自由感和责任感为代价”。^(²⁴⁵)\n\
  \n# 8.5 精选智能合约立法\n\n### 8.5.1 美国\n\n尽管人们对智能合约的兴趣和认可日益增加，但只有少数国家对智能合约制定了监管应对措施。在美国，各州对智能合约的立法倡议相对狭窄，仅涵盖选定的问题，大多局限于定义智能合约以及对其电子形式和签名的认可。截至\
  \ 2019 年 4 月，美国各州已审考虑了 133 项与区块链技术相关的法律。然而，只有 7 项与智能合约有关，且其中极少数已成功通过.^(²⁴⁶)\n\n\
  亚利桑那州是美国智能合约立法的先驱.^(²⁴⁷)\n\n少数几个州被认为更具进步性，并以更全面的方式处理智能合约。例如，内华达州通过了一项法案（Bill 398）(²⁴⁸)\n\
  \n最后，BTA 禁止地方政府对区块链或智能合约的使用实施任何限制或要求，包括税收、费用或认证要求。`BTA` 为智能合约的使用提供了高程度的法律清晰度，并明确了其法律地位和效。最后，怀俄米州脱颖而出，其颁布了\
  \ 13 部区块链法律，提供了一个旨在促进创新和推动区块链行业的全面法律框架。它具有许多新颖特征，并将智能合约定义为自动化交易或任何实质上类似的类似物，其由代码、脚本或编程语言组成，用于执行协议条款，并可能根据特定条件的发生或不发生对资产进行托管和转移，或为这些操作发布可执行的指令.^(²⁴⁹)\n\
  \n美国各州的智能合约立法倡议因通过仓促和产生不可预的影响而受到批评.^(²⁵⁰)\n\n引入多种智能合约的定义并明确赋予其法律地位，也可能导致既有法律原则和现有联邦法规（如《统一电子交易法》）的应用产生不确定性，而该法通常被认为对于电子签名和智能合约已经足够了.^(²⁵¹)\n\
  \n两个美国联邦监管和监督机构——美国商品期货交易委员会（`CFTC`）和美国证券交易委员会也通过其调查和澄清指导来处理智能合约。`CFTC` 甚至发布了一份关于智能合约的手，阐述了智能合约的益处、风险和法律问题.^(²⁵²)\n\
  \n### 8.5.2 欧洲\n\n世界上第一个通过智能合约法规的国家是白俄罗斯。2017 年 12 月的一项总统令将智能合约定义为旨在在交易区块账本（区块链）或其他分布式信息系统中运行的程序代码，用于自动履行和执行交易，或履行其他具有法律意义的行为。该法令授予了名为“高科技园区”的特区内通过智能合约进行交易履行和执行的权利。俄罗斯立法者在\
  \ 2019 年通过修订《俄罗斯民法典》，将数字资产引入俄罗斯民法体系，纳入数字权利和智能合约的概念。智能合约被认可为合同履行的手段，而非特殊类型的合同，因此它们现在可以合法地应用于俄罗斯的任何类型的交易.^(²⁵³)\n\
  \n意大利是第一个以通用方式监管分布式账本技术和智能合约的国家，不参考任何特定行业或应用.^(²⁵⁴)\n\n在欧盟层面，关于智能合约合法性及其在跨境情况下的执行力的不确定性也得到了认可，法律事务委员会的草案报告强调，即将出台的数字服务法》提供了一个评估智能合约被视为法律有效所需的要求的机会。委员会要求欧盟委员会评估智能合约在跨境情况下的合法性和执行力，并为适当的法律框架提出建议。报告强烈建议智能合约应包含可以停止执行的机制，以保护弱势方，并确保债权人在破产和重组中的权利得到尊重.^(²⁵⁵)\n\
  \n### 8.5.3 英国\n\n`UKJT` 在 2019 年 12 月发布了一份关于英格兰和威尔士法律下加密资产和智能合约状态的声明.^(²⁵⁶)\n\n\
  ## 8.6 结论\n\n智能合约产生了巨大的兴趣，具有巨大的潜力，并提供了主要的利益。行业、法律界最近一些监管机构和立法者也认可了智能合约的潜力。`UKJT`\
  \ “从法律角度来看，加密资产和智能合约无疑代表了未来”，^(²⁵⁷)\n\n智能合约并非统一的。它们从简单、直接、标准化的支付指令到能够自主执行一系列复杂动作的复杂工具不等。随着智能合约的使用增加，需要更多的法律澄清、立法认可和监管指导。技术与法律的交叉提出了挑战，尽管监管智能合约是一项“异常艰巨的任务”，^(²⁵⁸)\n\
  \n智能合约的某些方面挑战了法律界，但不太可能破坏既有的法律体系，原则上讲，智能合约的使用似乎没有重大障碍，也不需要剧烈的法律改革来接纳它们。到目前为止，立法者的反应有限，倾向于解决智能合约的基本定义、法律认可和证据效力问题。智能合约应留在立法者的议程中，立法者应该充分考虑这一技术发展并密切监测，介入提供法律清晰度，支持创新并降低风险。\n\
