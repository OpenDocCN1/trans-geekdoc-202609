    consists of two layers i.e. up-sampling layer and a dropout layer with the dimensional
    filter of size 3 x 3 (up-sampling) and dropout equal to 0.2. The model uses the
    concatenation of the output features of the expansion and contracting path using
    the attention gate. Here, a 3 x 3 convolution and ReLU are used for processing.
    The last layer of the model is the regression layer which helps to map the output
    to the desired segmented region.


    # 3.3.3. Attention gate


    As the name suggests Attention refers to the focus on a specific object. Here,
    in the proposed architecture, the attention logic is used between the layers to
    put emphasis only on relevant activation maps during model training. This helps
    to place the attention on a specific imaging part rather than on the complete
    image. Based on learning,


    attention can be classified as Soft attention and Hard attention. The main difference
    between these attention types is given as Hard attention picks image patches one
    at a time to pay attention and requires Reinforcement learning with Monte Carlo
    sampling. On the other hand, in Soft attention weights can be used on multiple
    patches of the image to determine the relevancy and the back-propagation approach
    can be used for the model training. In this work, soft attention is used with
    the encoder-decoder model.


    As shown in Fig. 5, during decoding, most of the spatial information which is
    to be recreated is imprecise. Thus, the model uses skip connections that concatenate
    the information from the down-sampling with the up-sampling. However, this can
    result in many redundant low-level features because at the initial layers the
    feature representation is quite poor. Therefore, introducing soft attention at
    skip connections can suppress much of the activations from outside of region-of-interest
    (ROI) and minimizes the number of redundant features to carry forward. The basic
    flow mechanism of soft attention is shown in Fig. 7.


    The detailed step-wise working and execution of the attention gate with skip connection
    are explained in Algorithm 1.'
