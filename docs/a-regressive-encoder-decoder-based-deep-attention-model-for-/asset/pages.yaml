    # 1. Introduction


    Computer-aided systems, attributed to the power of artificial intelligence, can
    help radiologists in various aspects. These systems are commonly used in medical
    imaging for various tasks such as segmentation, localization, prediction, and
    classification. The backbone of such systems is the sophisticated and advanced
    algorithms that make the task easier and automated. This automation assists radiologists
    in accurately predicting abnormalities and making a better diagnosis.


    The ultrasound-based diagnosis in radiology is considered to be complex compared
    to other imaging like CT, MRI, and X-ray due to the unclear visualization of the
    inner anatomy of the human organs as seen in other imaging modalities. Radiologists
    use ultrasounds to evaluate the brain, spine, and hips. Moreover, it also helps
    guide biopsies and heart disease conditions. But, the most commonly used application
    of ultrasound is seen for problems related to abdominal. One such application
    is during pregnancy when females need to undergo an ultrasound-based assessment
    by gynecologists.


    For pregnant females, the most important recommended diagnosis by the gynecologist
    is an assessment of the fetus using Ultrasound Imaging. In prenatal care, ultrasound
    imaging is a widely used mechanism and must require in every trimester. Gynecologists
    are particularly interested in monitoring fetal development and examining various
    biological parameters during each trimester [1]. In clinical routine checkups,
    the assessment of the fetus''s head circumference is the essential measurement
    for fetus''s growth monitoring, estimating gestational age and estimating the
    expected delivery date [2]. Also, trimester-wise ultrasound imaging can help to
    monitor the organs of the newborn in the fetus itself. The trimester-based sample
    ultrasound images of a random patient are shown in Fig. 1. Such analysis of the
    ultrasound image not only requires the latest machines but also the expertise
    of the radiologist for manual interpretation.


    Therefore, computer-aided automated (CAD) systems, can be beneficial for radiologists
    to make better & faster decisions. The automated segmentation of the fetus''s
    head is a key aspect of this scenario. Recently researchers are using Machine
    Intelligence-based algorithms [3–5] or


