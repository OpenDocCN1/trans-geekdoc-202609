    # 3.4. Eclipse fitting and dimension assessment


    The last phase of the proposed methodology is the post-processing of the segmented
    output map, called eclipse fitting. As the shape of the fetus is in ellipse and
    also the available ground truth is in form of the ellipse, the fitting of the
    eclipse is an important part of the methodology. The fitment of the eclipse on
    the ultrasound image can help to make the assessment of the parameters easily
    and predicts the growth of the fetus.


    An ellipse is defined as the locus of all those points in a two-dimensional plane
    where the distance addition from two fixed points, also known as foci, in the
    plane remains constant. This constant ratio is called the eccentricity of an ellipse
    which demonstrates its elongation. The description of the ellipse is shown in
    Fig. 8.


    It is to be noted that the shape of the eclipse is in form of an oval, where the
    longest bisection in middle along the x-axis is called the major axis and the
    smallest bisection along the y-axis is called the minor axis. The distance between
    the center (intersection of major and minor axis) to surface points is called
    the semi-major axis and semi-minor axis. The area enclosed by the eclipse is given
    by the Eq. (8):


    Area under eclipse = \(\pi * |\frac{M}{2}| * |\frac{m}{2}|\) (8)


