    \ as:\n\n+   1. Angular Flip: It is a skeleton axis where the input sample is\
    \ flipped along the directional axis with an angle of \\(\\theta = 180\\). It\
    \ resulted in the transformation of the image in a ratio of 1:1 i.e. for a single\
    \ image we get one more image with a different orientation.\n\n+   2. Oriential\
    \ Rotate: It is the rotation of the input sample into the selected range of the\
    \ directional orientation values. Here, the selected range of \\(\\theta\\) falls\
    \ in the range of \\([-15, 15]\\) with the sliding unit of 5 units. This resulted\
    \ in the 7 different values of \\(\\theta\\) i.e. \\(-15, -10, -5, 0, 5, 10, 15\\\
    ). Out of these, the \\(\\theta = 0\\) is dropped as it generated the same image\
    \ as of input. Thus, an overall of six different images of the input image is\
    \ generated using this augmentation approach.\n\n+   3. Random Cropping: It is\
    \ an augmentation technique that allows us to take the random subsets of an input\
    \ image and further can be used for the model training. Most of the time this\
    \ approach gives generalized results as the region of interest is not always visible\
    \ in the whole image. Here, we used the random selection of the \\(45 \\times\
    \ 45\\) window region in four directions i.e. up, down, left, and right. Thus\
    \ for a single image, four sub-regions can be generated.\n\nIn an overall summary\
    \ of augmentation, we can get angular flip (1), Oriential Rotate(6), and Random\
    \ Cropping(4) images for a single image i.e. 11 times of the dataset. Finally,\
    \ the whole dataset is now having 10,989 images available for model training after\
