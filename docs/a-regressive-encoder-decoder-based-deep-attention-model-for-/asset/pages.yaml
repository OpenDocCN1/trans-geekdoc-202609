    ![](img/6b6056dba6e110e45c1a1524eb95a7df_8_0.png)


    where, l,l represents the length, M represents the Major axis, and m represents
    the minor axis.


    In medical terminology, these axes have different names to understand. The major
    axis is known as OccipitoFrontal Diameter (OFD) and the minor axis is known as
    Bi-parietal Diameter (BPD). The fetus’s head circumference is thus calculated
    by using Eq. (8) and can be re-written as Eq. (9):


    Head Circumference = \(\pi * \frac{(OFD + BPD)}{2}\) (9)


    # 4. Experimentation results


    # 4.1. Dataset description


    To evaluate the performance of the proposed model the experimentation is carried
    out on the publicly available dataset of Fetus ultrasound images. The dataset
    was released in the year 2018 as one of the grand challenges on Automated measurement
    of Head circumference.


    The dataset consists of 1334 2D-ultrasound images of the standard plane to measure
    the head circumference. The overall dataset is divided into two subsets i.e. Training
    and Testing. The training set consists of 999 2D ultrasound image samples and
    a test set have 335 images. All the images are of equal size with the dimension
    of 800 x 540 pixels having pixel sizes ranging from 0.052 to 0.326 mm. The details
    of the individual image pixel size are presented in the files ‘training_set_pixel_size_and_HC.csv’
    and ‘test_set_pixel_size.csv’. Moreover, the training set also has ground truth
    availability with the annotation of the head circumference. The details of the
    annotated head circumference for all training images are also present in the file‘training_set_pixel_size_and_HC.csv’.
    The sample dataset description with annotations is presented in Fig. 9.


    # 4.2. Dataset normalization


    Using the dataset, and its pre-processing, it is identified that the data samples
    have a non-scalar image dimension of 800 x 540 pixels. Thus the dataset is initially
    normalized to make each image to be of dimension 224 x 224 pixels. Besides this,
    the dataset is analyzed with the limitation of the less number of training samples
    availability for model learning. Thus, to minimize the artifacts due to overfitting
    and underfitting the dataset size need to be increased. This has to be done using
    the data augmentation approaches.


    Here four traditional machine learning data augmentation approaches are used i.e.
    flip, rotate, translate, and crop operations. Using these four operations the
    dataset strength is increased by 11 times of


