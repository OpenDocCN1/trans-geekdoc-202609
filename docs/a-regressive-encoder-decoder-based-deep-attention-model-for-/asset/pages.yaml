    2. Precision, Recall, and F1-Score: These metrics are commonly used in binary
    segmentation tasks. Precision measures the proportion of correctly predicted positive
    instances (true positives) out of all predicted positive instances. Recall (also
    known as sensitivity) measures the proportion of true positive instances correctly
    identified out of all actual positive instances. F1-score is the harmonic mean
    of precision and recall, providing a single value to assess overall segmentation
    performance. Mathematically, it is given as:


    \(Precision = \frac{TP}{TP + FP}\) \n\(Recall = \frac{TP}{TP + FN}\) \n\(F1 -
    Score = \frac{2 * Precision * Recall}{Precision + Recall}\) (15)


