    \ 28 x 28 |\n| 密集块 2 | 12 | 1 x 1, 3 x 3 | 28 x 28 |\n| 卷积 + 平均池化 | 1 | 1 x 1,\
    \ 3 x 3, 步幅 2 | 28 x 28, 14 x 14 |\n| 密集块 3 | 36 | 1 x 1, 3 x 3 | 14 x 14 |\n\
    | 卷积 + 平均池化 | 1 | 1 x 1, 3 x 3, 步幅 2 | 14 x 14, 7 x 7 |\n| 密集块 4 | 24 | 1 x 1,\
    \ 3 x 3 | 7 x 7 |\n\n解码中唯一的区别是使用跳跃连接，其中相同的分层解码输出和编码输出通过注意门进行拼接，如小节 3.3.3 中详细描述。从技术上讲，特征图扩展路径的每个迭代步骤都包含一个\
    \ 2 x 2 转置卷积，它将特征数量减半。上采样由两个层组成，即上采样层和一个丢弃层，其维度滤波器大小为 3 x 3（上采样），丢弃率等于 0.2。该模型使用注意门对扩展路径和收缩路径的输出特征进行拼接。这里，使用\
    \ 3 x 3 卷积和 ReLU 进行处理。模型的最后一层是回归层，它有助于将输出映射到所需的分割区域。\n\n## 3.3.3. 注意门\n\n正如名称所示，注意是指对特定对象的关注。在提议的架构中，注意逻辑用于层之间，以便在模型训练期间仅对相关的激活图进行强调。这有助于将注意力放在特定的成像部分，而不是整个图像。基于学习，\n\
    \n注意力可分为软注意力和硬注意力。这些注意力类型的主要区别在于，硬注意力一次选择一个图像补丁进行关注，并需要使用蒙特卡洛采样的强化学习。另一方面，在软注意中，可以在图像的多个补丁上使用权重来确定相关性，并且可以使用反向传播方法进行模型训练。在本工作中，软注意力与编码器-解码器模型一起使用。\n\
