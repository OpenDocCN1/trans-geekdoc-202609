    other metrics which are used in this work are the Dice coefficient, Mean average
    percentage error, and Hausdorff Distance. The experimentation results with these
    metrics using the proposed model give Dice-97.31%, MAPE-0.65%, and HD-1.09% on
    training data. Dice-96.30%, MAPE-0.71%, and HD-1.11% accurate results.


