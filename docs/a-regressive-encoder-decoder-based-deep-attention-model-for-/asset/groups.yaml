    # ## 6. Conclusion and future work


    This paper presents the new encoder-decoder model incorporated with the power
    of the Attention gate with the regression layer to segment the fetus head from
    the 2D ultrasound images. The proposed model is designed by using the dense blocks
    in the encoding and decoding phase to minimize the problem related to gradient
    descent. It is a must to use dense blocks because in the proposed model the soft
    attention gate is used with skip connections to minimize the error loss. This
    soft attention basis is the backpropagation where the gradients are used.


    The proposed model is used to do semantic segmentation of the fetus''s head from
    the 2D ultrasound images. Later, the segmented result is post-processed with the
    help of the eclipse fitting, as the fetus is of shape oval. Thus, the proper fitting
    of the eclipse helps to map the segmented result on the ultrasound image. In the
    end, the fetus dimensional analysis is performed that can estimate the appropriate
    size of the fetus to check its growth. The result analysis by using the proposed
    methodology helps to identify the fetus with good precision having an average
    absolute head circumference difference of 0.354 mm.


    The proposed model is trained on the dataset of 10,989 images (after augmentation)
    and tested on the dataset of 335 images. The average absolute head circumference
    difference of the testing dataset is 0.387 mm. The experimentation results are
    found satisfactory as the model can achieve the best performance even when experimented
    with different statistical performance metrics. Besides head circumference analysis,
    other metrics which are used in this work are the Dice coefficient, Mean average
    percentage error, and Hausdorff Distance. The experimentation results with these
    metrics using the proposed model give Dice-97.31%, MAPE-0.65%, and HD-1.09% on
    training data. Dice-96.30%, MAPE-0.71%, and HD-1.11% accurate results.


    Besides the above metrics, the performance of the model is also evaluated on some
    other benchmark metrics that were used for segmentation like IoU, Precision, Recall,
    and F-measure. The experimentation with these metrics also proves the efficacy
    of the model with the achieved values of IoU-0.96, Precision-0.94, Recall-0.94,
    and F1-score-0.94. The model is also compared with some other benchmark deep models
    used for the segmentation of objects in different domains of


