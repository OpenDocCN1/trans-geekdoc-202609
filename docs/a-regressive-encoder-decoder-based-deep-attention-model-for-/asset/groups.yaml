    \n![](img/6b6056dba6e110e45c1a1524eb95a7df_5_0.png)\n\n图 5. 带有注意门和回归层的提议编码器-解码器模型的扩展块架构。\n\
    \n分割输出。因此，在编码阶段使用了密集块。使用密集块的优势总结如下：\n\n- 密集块减少了参数数量，并在参数使用上更高效。\n- 密集块激励特征重用并增强特征传播。\n\
    - 密集连接具有正则化效果，可减少小型训练集上图像分割任务的过拟合。\n- 与不区分模型网络深度的其他深度编码器架构相比，使用密集连接时参数数量会减少。\n\
    \n因此，编码器中的每个块都是密集块，它对早期特征向量进行迭代拼接。每个密集块包含一定数量的层，即 N 层。该密集块的直接连接总数为 (N*(N + 1))/2。\n\
    \n提议的架构在编码阶段使用了 4 个密集块，每个长度为 4，即每个密集块包含 4 层，每层包含批归一化、2D 卷积滤波器和 ReLU 激活，并与跳跃连接拼接，如图\
    \ 6 所示。编码的架构描述在表 1 中说明。\n\n网络的第一层是输入层，它使用大小为 7 x 7 的 96 个滤波器和等于 2 的步幅将图像作为输入。这产生了大小为\
    \ 112 x 112 x 96 的特征描述符。然后将输出与大小为 3 x 3 和步幅等于 2 的滤波器进行最大池化，以得到大小为 56 x 56 的减小输出。\n\
    \n之后，编码器使用了四个密集块。这些层在密集块中重复多次，次数由表 1 中的计数指示。还应注意的是，对于前三个密集块，输出进一步使用 2D 卷积进行处理，以减少特征图的通道数，其中卷积的尺寸为\
    \ 1 x 1，平均池化的尺寸为 3 x 3，步幅等于 2。在编码阶段结束时，产生大小为 7 x 7 的输出向量以生成分割输出。\n\n## 3.3.2.\
    \ 解码器\n\n提议架构的下半部分是解码器，它只是编码器的转置。这一阶段的目标是将编码器提取的低维编码特征投影到更高的分辨率，以进行语义分割。它由以与编码阶段完全相反的方式进行的数据上采样组成。\n\
    \n![](img/6b6056dba6e110e45c1a1524eb95a7df_6_0.png)\n\n| 层 | 数量 | 尺寸 | 维度 |\n\
    | :--- | :--- | :--- | :--- |\n| 输入 | 1 | - | 224 x 224 x 3 |\n| 卷积 1 | 1 | 7\
    \ x 7, 96, 步幅 2 | 112 x 112 |\n| 最大池化 | 1 | 3 x 3, 步幅 2 | 56 x 56 |\n| 密集块 1 |\
