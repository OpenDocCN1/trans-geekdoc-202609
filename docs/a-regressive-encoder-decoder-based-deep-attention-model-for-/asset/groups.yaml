    尽管如此，研究人员也关注了对各种器官胎儿几何结构的评估。[12]中报道的最新研究之一使用机器学习工具对超声图像中的胎儿大脑进行分割。这项经过临床验证的工作使用第一孕期成像进行分割过程。除了2D成像，一些工作还使用3D体积，利用随机森林方法对超声图像中的胎儿大脑进行评估[13]。报道的工作展示了良好的分割结果，然而，数据集的样本图像数量较少。


    此外，还有报道使用深度学习方法对胎儿头部进行自动分割的研究。[14]中报道的工作使用多任务深度模型，利用不同孕期的超声图像来估计胎儿头周。文献还探讨了使用基于编码器-解码器深度网络的注意力网络来对胎儿进行分割[15]。在许多地方，超声图像数据集的选择来自一些开源网站，尤其是在线挑战。一项关于使用大挑战数据集对方法进行评估和比较的研究在[16]中提出。


    在过去，一些方法使用深度模型对超声胎儿图像中的大脑进行分割[17,18]。这些工作的动机是探索使用计算机辅助系统对胎儿大脑进行自动诊断。然而，这两项研究的目标不同，[17]中报道的工作介绍了用于分割的
    UNet 模型，而[18]中提出的工作引入了分类方面来识别超声成像中正常和异常的胎儿平面。[19]中提出的工作使用深度模型，利用从 1792 名患者收集的
    12,400 张图像的数据集，将胎儿平面分为 3 个类别，其目标几乎相似但方法论不同。


    一些研究人员还设计了轻量级 CNN 深度模型，用于头周语义分割[20]。该研究的目标是在超声 2D 图像中定位胎儿头部。该方法使用传统的 LinkNet 架构[21]作为提议的轻量级模型设计的骨干网络。除此之外，一些作者还关注了先前用于其他应用领域的深度模型的利用。一项这样的工作在[22]中报道，其中名为多特征金字塔
    UNet (MFP-UNet) 的模型用于语义分割。使用该模型的目的是克服传统 UNet 模型的局限性。


    对胎儿头部分割的广泛文献研究表明，基于深度学习的模型，尤其是基于编码器-解码器的网络架构，是从超声图像中对胎儿头部进行语义分割最广泛使用的架构。然而，所声称的结果使用广泛的统计措施进行性能计算，获得了良好的分割结果。然而，仍有通过模型升级提高准确性的空间。本着这一目标，本文提出了一种新框架，将回归与注意力相结合应用于编码器-解码器网络架构，以增强胎儿分割及其头周的结果。


    ## 3. 提出的深度架构设计


    在本工作中，提出了一种深度模型的新设计，以编码器-解码器为基础，并包含注意力门，用于超声图像中的胎儿头部分割。该工作进一步扩展，使用 2D 超声图像查找胎儿头部的尺寸。所提工作被视为一个自动化
    CAD 系统，它采用了带有回归的基于注意力的编码器-解码器模型的高级机器学习算法，以最小化网络中的损失。


    ### 3.1. 提出的网络架构的框架设计


    所提议的网络架构的设计框架如图 2 所示。有三个模块，即预处理、模型训练和后处理。这三个模块的集成构建将导致胎儿头部的分割以及对胎儿头周的直接评估。


    最初，输入影像数据集经过预处理，然后进行数据增强以增加数据集大小。扩展后的数据集进一步用于模型训练。在此项提议的工作中，提出了一种用于胎儿头部分割的新深度学习模型。所提模型基于编码器-解码器方法，并包含注意力和回归层。这个模型训练是框架的第二个模块。后来，在第三个模块中，使用测试输入图像对模型进行评估，然后进行后处理操作以发现分割胎儿头部的尺寸。后处理操作包括椭圆拟合、尺寸图和区域周径评估。每个模块的详细信息将在随后的小节中讨论。


    ### 3.2. 图像预处理


    如图 2 所示，所提框架的第一个模块是输入图像的预处理。该模块将包括输入图像归一化，然后进行数据增强。


    ### 3.2.1. 图像归一化


    在基于 AI 的应用中，图像归一化是在将数据集馈送到模型进行训练之前使用的一种过程。在此，数据集样本使用大小和强度值的常见统计分布进行处理。通常，该过程既包括空间归一化，也包括强度归一化。


    空间归一化意味着使用缩放、线性变换甚至变形，使整个数据集图像具有相同的空间关系。空间归一化的主要目标是使数据集在大小和强度值分布方面保持一致。而在归一化中，多个图像中的整体像素值将具有相同的统计分布。众所周知，伪影会在图像中造成不均匀性，可以通过归一化来纠正。因此，在处理超声图像之前，框架使用对输入数据集图像的预处理。


    在本工作中，对输入图像（灰度或 RGB）进行 Min-Max 归一化，以保持强度分布的一致性。由于 8 位图像由 0 到 255 之间的像素强度表示，因此使用给定的
    Eq. (1) 对数字图像进行线性归一化。


    ```

    OutputChannel = 255 * (Input Channel - min) / (max - min) (1)

    ```


    其中，max 和 min 是输入图像的最大和最小像素值表示。


    在此，如果输入图像是灰度图，则只需归一化一个通道。但是，对于 3 通道输入图像（即 RGB），则需要使用相同的标准对每个通道进行归一化。


    ![](img/6b6056dba6e110e45c1a1524eb95a7df_3_0.png)


    图 3 显示了示例图像归一化及其相应的输出。


    ### 3.3. 设计所提注意力编码器-解码器回归架构


    本工作的主要目标是从超声图像中分割胎儿头部。为此，提出了一种由注意力和回归层驱动的新编码器-解码器模型，用于胎儿头部分割。所提模型受传统模型设计框架的启发，这些框架使用深度神经架构解决了各种生物分割问题[23]。带回归层的所提模型的基本架构如图
    4 所示。


    该模型使用卷积块和跳跃连接设计，该连接将高维特征向量与解码器部分的输出特征集体连接起来。这有助于使最终预测结果更加可靠和准确。模型设计及其相关组件的详细描述将在以下小节中讨论。


    ### 3.3.1. 编码器


    经过仔细评估，发现所提模型架构分为两半，即编码器和解码器。模型的第一半称为编码器，是密集卷积块的集合，随后进行最大池化，将输入图像下采样为多个层级的特征表示。所提模型的扩展图如图
    5 所示。


    在编码阶段，选择密集块具有特殊目的。如图 5 所示，模型包含带有跳跃连接的软注意力门，如后续小节 3.3.3 所述，该门使用反向传播。反向传播通常会遇到梯度消失的问题，并在
    the 中引入不规则性。


    '
