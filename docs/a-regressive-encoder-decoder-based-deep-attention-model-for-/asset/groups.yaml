    Deep Network-based algorithms [6] for fetus head segmentation. The literature
    presents several methods based on fetus'' head segmentation using an ellipse-based
    bounding box, considering that the fetus'' shape is elliptical. However, machine
    learning-based algorithms lead to the loss of visual anatomy providing only segments
    based on user-defined criteria.


    This paper introduces a novel model for fetus'' head segmentation using a deep
    learning approach and thus minimizes the dependency on user-defined criteria.
    The proposed model is distinct as compared with traditional models like UNet in
    many aspects including network architecture incorporating regression layer with
    attention. The key difference between the two models is given as:


    +   • Output Representation: The UNet model is primarily used for pixel-wise semantic
    segmentation, where the goal is to classify each pixel in the input image into
    different predefined classes or labels. It produces a segmentation mask where
    each pixel is assigned a specific class label. Whereas, the Encoder-Decoder-based
    Deep Attention Model with a regression layer is designed for localization and
    instance segmentation tasks. Instead of predicting class labels for each pixel,
    this model aims to directly regress the bounding box coordinates or segmentation
    masks for specific objects or regions of interest. The regression layer outputs
    the coordinates or pixel-wise values that define the extent or boundary of the
    object.


    +   • Task Focus: The UNet model is commonly used for tasks such as segmenting
    organs or structures in medical images, where the emphasis is on identifying and
    classifying different regions of interest within the image. It is suitable for
    scenarios where the boundaries between different classes are distinct and well-defined.
    On the other hand, the Encoder-Decoder-based Deep Attention Model with a regression
    layer is more suitable for tasks that require precise localization or instance
    segmentation, such as detecting and segmenting specific objects or regions within
    an image. By directly regressing the bounding box coordinates or segmentation
    masks, this model can provide more accurate localization and fine-grained segmentation
    results, even in scenarios where objects may have complex shapes or overlapping
    boundaries.


    +   • Network Architecture: The UNet model follows a symmetric encoder-decoder
    architecture with skip connections to capture both local and global information.
    It is commonly composed of convolutional layers, pooling layers for down-sampling,
    and transposed convolutional layers for up-sampling. In contrast, the Encoder-Decoder-based
    Deep Attention Model with a regression layer may also utilize an encoder-decoder
    architecture with attention mechanisms for capturing informative regions. However,
    it


    incorporates an additional regression layer at the end of the network, which directly
    predicts the coordinates or pixel-wise values defining the object of interest.
    This regression layer enables the model to perform precise localization and regression-based
    instance segmentation.


    The main contributions of the manuscript are described as follows:


    +   1. The paper proposes a novel architecture that combines a regressive encoder-decoder
    network with an attention mechanism. This architecture enables the model to learn
    both global and local features of the ultrasound images, while the attention mechanism
    helps to focus on informative regions for more accurate segmentation.


    +   2. The proposed model directly predicts the bounding box coordinates of the
    fetal head. This regression-based approach allows for more precise localization
    and segmentation of the fetal head.


    +   3. The paper introduces a deep attention mechanism within the model that allows
    the model to focus on relevant regions of the ultrasound images, enhancing the
    accuracy of fetal head segmentation. The attention mechanism assigns different
    weights to different spatial locations, emphasizing informative regions while
    suppressing irrelevant areas.


    +   4. The paper describes the training process of the proposed model, including
    the use of a large dataset of annotated 2D ultrasound images. Additionally, it
    discusses the utilization of various data augmentation techniques to increase
    the diversity of the training data.


    The rest of this paper is organized as follows: The description of the existing
    works on Fetus analysis that was used as a theoretical foundation is presented
    in Section 2. Section 3, gives insight into the proposed model design using the
    regression-based attention deep UNet model. Section 4, demonstrates the evaluation
    results of the proposed model when experimented with the state-of-art benchmark
    dataset of the fetus'' head. The comparative analysis of the proposed model with
    the existing literature and benchmark models are presented in Section 5. Finally,
    Section 6 presents the overall conclusion of the proposed methodology with the
    future work directions that guides the extension of the work in the near future.


