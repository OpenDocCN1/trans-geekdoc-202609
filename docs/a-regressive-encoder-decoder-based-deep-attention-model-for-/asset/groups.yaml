    \n图 7. 每个跳跃连接的注意门描述。\n\n### 算法 1. 带有跳跃连接的注意门工作原理。\n\n要求：向量 x 和 g  \n确保：向量 g 应取自网络的下一较低层。\
    \  \n尺寸（滤波器 x 高度 x 宽度）：x <- 64x64x64  \n尺寸（滤波器 x 高度 x 宽度）：g <- 32x32x32  \n卷积：向量\
    \ x 经过步幅卷积后，更新后的维度为 x <- 64x32x32  \n卷积：向量 g 与 1x1 滤波器卷积后，维度为 x <- 64x32x32。 \
    \ \n元素求和：将两个向量按元素相加为 x + g。这产生了较大的对齐权重和相对较小的非对齐权重。  \n维度降低：向量 x + g 的结果先经过 ReLU\
    \ 激活处理，然后经过 1x1 卷积滤波器处理，以将维度减少到 (x + g) <- 1x32x32。  \n特征缩放：向量通过 sigmoid 层处理，将向量缩放到\
    \ [0,1] 范围内。越接近 1 的系数值表示相关性更强的特征，称为注意力权重。  \n上采样：注意力权重使用三线性插值进行上采样，维度为 x <- 64x64。\
