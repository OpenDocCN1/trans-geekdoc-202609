    在训练带有回归层的编码器-解码器注意力模型时，需要设置多个超参数。通常，超参数的最优值可能因特定数据集和问题而异。然而，实验和调整通常是找到给定任务最佳超参数配置所必需的。在此基于模型的实验中使用的最佳组合如表
    2 所示：


    ## 3.4. 椭圆拟合与尺寸评估


    所提方法的最后阶段是对分割输出图进行后处理，称为椭圆拟合。由于胎儿的形状呈椭圆，且可用的地面真值也以椭圆形式存在，因此椭圆拟合是该方法的重要组成部分。在超声图像上拟合椭圆有助于轻松评估参数并预测胎儿的生长。


    椭圆定义为二维平面上所有这些点的轨迹，即到平面上两个定点（亦称为焦点）的距离之和保持不变。这个常数比值称为椭圆的离心率，表明其伸长程度。椭圆的描述如图 8
    所示：


    需要注意的是，椭圆的形状呈椭圆形，其中沿 x 轴的最长平分线称为长轴，沿 y 轴的最短平分线称为短轴。中心（长轴和短轴的交点）到表面点的距离称为半长轴和半短轴。椭圆所围成的面积由公式
    (8) 给出：


    Area under ellipse = \(\pi * |\frac{M}{2}| * |\frac{m}{2}|\) (8)


    | 超参数 | 值 |

    |---|---|

    | 层数 | 编码 - 4, 解码 - 4 |

    | 时代数 | 300 |

    | 卷积滤波器 (L1) | 20 |

    | 卷积滤波器大小 | 3 x 3 |

    | 最大池化滤波器 | 3 x 3 |

    | 步长 | 2 |

    | 优化器 | Adam |

    | 学习率 | 0.001 |

    | 损失函数 | 二元加权交叉熵 |

    | | 均方误差 |

    | 批量大小 | 32 |

    | 丢弃率 | 0.4 |


    ![](img/6b6056dba6e110e45c1a1524eb95a7df_8_0.png)


    其中，L 表示长度，M 表示长轴，m 表示短轴。


    在医学术语中，这些轴有不同的名称以便理解。长轴称为枕额直径（OFD），短轴称为双顶直径（BPD）。因此，胎儿头围可使用公式 (8) 计算，并可改写为公式 (9)：


    Head Circumference = \(\pi * \frac{(OFD + BPD)}{2}\) (9)


    ## 4. 实验结果


    ## 4.1. 数据集描述


    为评估所提模型的性能，实验在公开可用的胎儿超声图像数据集上进行。该数据集于 2018 年发布，是自动头围测量挑战的大挑战之一。


    该数据集包含 1334 个用于测量头围的标准平面 2D 超声图像。整个数据集分为两个子集，即训练集和测试集。训练集包含 999 个 2D 超声图像样本，测试集包含
    335 幅图像。所有图像尺寸相同，尺寸为 800 x 540 像素，像素大小范围从 0.052 到 0.326 mm。各个图像的像素大小详情列在文件 ‘training_set_pixel_size_and_HC.csv’
    和 ‘test_set_pixel_size.csv’ 中。此外，训练集还包含带有头围标注的地面真值。所有训练图像的标注头围详情也列在文件 ‘training_set_pixel_size_and_HC.csv’
    中。带标注的示例数据集描述如图 9 所示：


    ## 4.2. 数据集归一化


    使用该数据集及其预处理后，发现数据样本具有非标量图像尺寸 800 x 540 像素。因此，最初将数据集归一化，使每个图像的尺寸为 224 x 224 像素。除此之外，还分析了数据集在模型学习可用训练样本数量较少方面的局限性。因此，为了尽量减少由于过拟合和欠拟合造成的伪影，需要增加数据集大小。这必须使用数据增强方法来完成。


    此处使用了四种传统的机器学习数据增强方法，即翻转、旋转、平移和裁剪操作。使用这四种操作，数据集规模增加了原始数据集的 11 倍

    <sup>1</sup> https://zenodo.org/record/1327317

    <sup>2</sup> https://hc18.grand-challenge.org/

    ![](img/6b6056dba6e110e45c1a1524eb95a7df_9_0.png)

    。这使得整个数据集共有 10,989 幅 2D 图像。此注释的一个重要方面是，对训练样本和标注样本按原始图像处理的相同顺序重复操作。这些增强及其对数据集的影响详情如下：


    - 1. 角度翻转：它是一个骨架轴，输入样本沿方向轴以 \(\theta = 180\) 的角度翻转。这导致图像以 1:1 的比例进行转换，即对于单幅图像，我们会得到一幅方向不同的图像。

    - 2. 方向旋转：它是将输入样本旋转到选定的方向取值范围内。此处，\(\theta\) 的选定范围在 \([-15, 15]\) 之间，滑动单位为 5 个单位。这产生了
    7 个不同的 \(\theta\) 值，即 \(-15, -10, -5, 0, 5, 10, 15\)。其中，\(\theta = 0\) 被舍弃，因为它生成了与输入相同的图像。因此，使用此增强方法生成了输入图像的总共六幅不同图像。

    - 3. 随机裁剪：它是一种增强技术，允许我们获取输入图像的随机子集，并进一步用于模型训练。大多数情况下，此方法可提供泛化结果，因为感兴趣区域并不总是在整个图像中可见。此处，我们在上、下、左、右四个方向上随机选择
    \(45 \times 45\) 窗口区域。因此，对于单幅图像，可生成四个子区域。


    总体而言，对于单幅图像，可通过增强获得 1 款角度翻转、6 款方向旋转和 4 款随机裁剪图像，即数据集的 11 倍。最后，增强后，整个数据集现有 10,989
    幅图像可供模型训练。


    ## 4.3. 用于评估性能的指标


    在所提工作中，使用 Dice 系数、头围差异、豪斯多夫距离和平均绝对百分误差作为性能评估指标。


    这些指标的数学符号如公式 10-13 所示：


    - 1. Dice 系数 (DC)：定义为使用分割输出和地面真值的像素数量进行比例评估，给定为：


    \(\text{Dice Coefficient (DC)} = \frac{2 * (Seg_{Area} \cap Grt_{Area})}{|Seg_{Area}|
    + |Grt_{Area}|}\) (10)


    其中，\(Grt_{Area}\) 是地面真值区域，\(Seg_{Area}\) 是从分割部分提取的区域。


    - 2. 头围差异 (DHC)：定义为分割区域和地面真值的胎儿头周长评估之差，给定为：


    头围差异 (DHC) = \(P_{Seg} - P_{Grt}\) (11)


    其中，\(P_i\) 表示周长，\(i \in\)（分割区域，地面真值）


    - 3. 平均绝对百分误差 (MAPE)：定义为相对于可用地面真值的绝对百分误差，给定为：


    \(MAPE = \frac{MAE}{Grt} . 100\) (12)


    其中 MAE 是平均绝对误差，由以下公式给出：


    \(MAE = \frac{1}{N} \sum_{i=1}^{N} (S_i - G_i)\)


    此处，\(S_i\) 是分割输出中的像素概率，\(G_i\) 是可用地面真值中的实际像素概率。


    - 4. 豪斯多夫距离 (HD)：给定为两个轮廓点之间的距离，并在所有此类组合中找到最大值。给定为：


    \(HD(Seg, Grt) = max (h(Seg, Grt), h(Grt, Seg))\) (13)


    其中，

    \(h(Seg, Grt) = max_{s \in Seg} min_{g \in Grt} \|p - g\|\)

    \(h(Grt, Seg) = max_{g \in Grt} min_{s \in Seg} \|g - p\|\)


    其中，Seg 表示分割空间中的像素 (\(s_1, s_2, ...., s_n\))，Grt 表示地面真值中的像素 (\(g_1, g_2, ....,
    g_n\))。


    除了上述文献中用于分析胎儿头部分割结果的特定指标外，还有一些其他性能指标被视为分割任务的基准。这些指标如下：


    - 1. 交并比 (IoU) 或 Jaccard 索引：IoU 测量预测分割掩码与地面真值掩码之间的重叠。它计算为交叉区域与


