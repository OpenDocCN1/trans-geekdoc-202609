  md: '# 7.4.2 TURIDITY SENSOR


    Turbidity sensor generates voltage output through measurement of light scattering
    caused by suspended particles. Turbidity is measured in Nephelometric Turbidity
    Units (NTU) (Baldwin et al., 2019). The turbidity sensor is shown in Figure 7.3.


    # 7.4.3 OXIDATION REDUCTION POTENTIAL (ORP) SENSOR


    ORP sensors are similar to pH sensor and in some cases they are combined together.
    The ORP sensor uses a different reference solution, typically KCL Ag/Ag-Cl. A
    signal conditioner is required to interface the ORP sensor with the microcontroller
    (Cloete et al., 2016). ORP values are expressed in millivolts (mV). The ORP sensor
    is shown in Figure 7.4.


