    # 10.4.1 DESCRIPTIVE STATISTICAL ANALYSIS


    In this research, the estimation of the chosen parameters were made up of different
    sets of input and output variables as shown in the statistical Table 10.2. In
    addition, the degree and type of relationship between the influent and effluent
    was investigated using the correlation matrix and descriptive statistical analysis.
    R was evaluated to determine the extent of linear interaction between the influent
    and effluent variables. The concept of R is to predict a variable using a linear
    function that acts as a tentative indicator of a possible correlation between
    the set of variables. As presented in Table 10.3, the R-value in bold shows the
    statistical and significant variables with a probability less than 0.05 (p<0.05).
    This indicates a high degree of linear correlation. Additionally, the R values
    with the negative sign suggests that the two variables have an inverse interaction
    between them. Furthermore, the weakness observed by R showed that it is important
    to apply more robust methods in complex modelling iterations. the evaluation of
    R was also important in the pre-analysis of the data and generation of the data-driven
    models, since the directional sign (positive or negative) shows the relationship
    between the dimension and proportionality of the variables (dependent and independent).


    As mentioned earlier, two different models based on dominant factors were generated
    to predict the ORP of the S. molecule treatment system. This could be better understood
    by considering the correlation matrix between the parameters as indicated in Figure
    10.1.


    The choice of two combinations is primarily focused on the analysis of linear
    sensitivity techniques. Several authors have noted the significance of applying
    the non-linear sensitivity input variables methods in determining the most critical
    factors (Hadi et al., 2019; Nourani & Sayah, 2012).


    From Figure 10.1, the Spearman Pearson Correlation demonstrates how effectively
    a linear function can be used to explain the relationship between the water quality
    variables. The direction or the sign does not affect the strength of the correlation.
    In other words, a positive correlation implies that an increase in the first parameter
    is proportional to an increase in the second parameter, whereas a negative coefficient
    implies an inverse relationship, in which as one increases, the second parameter
    decreases (Abba et al., 2020; Ghali et al., 2020; Eisinga et al., 2013).


    Except for ORPr and TEMPr in the case of TDS and TURBt, respectively, all the
    WO variables displayed unsatisfactory relationship with the target variables,
    although previous studies (Elkiran et al., 2019; Hadi et al., 2019) discouraged
    the application of classical linear input variable methods and suggested the use
    of non-linear methods. The non-linear methods can be used for selection of inputs
    and determination of linear patterns between two or more variables. Additionally,
    according to Figure 10.1, TEMPr (0.5) has the highest correlation coefficient
    with TDS, while ORPr emerged as the least correlated variable. In the case of
    TURBt, TEMPt has the highest positive relationship with the TEMPr emerged. For
    ORPt, the highest positive variables were ORPr. This kind of relationship is quite
    non-linear in nature and, hence requires urgent attention of non-linear models
    to address them. This statement is in line with various studies in the field of
    WWTP (Abba & Elkiran, 2017).'
