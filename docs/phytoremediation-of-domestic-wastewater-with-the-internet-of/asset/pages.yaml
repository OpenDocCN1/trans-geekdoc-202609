    the prediction of TURBIT depicted reasonable accuracy in the performance criteria
    of the methods. However, a satisfactory outcome was obtained from the different
    combinations of M1 and M2. From the simulation of TURBIT, M1 with four combinations
    (TURB, ORP, TDS and TEMP) proved to be the best for all the models in comparison
    with M2 (TURB, ORP, TDS). From the point of view, it was crucial in the prediction
    of the water quality parameters.


    9.4 and 9.5 represent the time-series graphs between the observed and predicted
    TURBIT concentrations by M1 and M2 for ANN, SVM, ANFIS and MLR. Further evaluation
    of the time-series findings demonstrates that ANN-M1, SVM-M1, ANFIS-M1 and MLR-M1
    gave a satisfactory outcome, while an acceptable precision was obtained for both
    ANN-M2, SVM-M2, ANFIS-M2 and MLR-M2. The promising potential of the ANFIS model
    was not surprising, since it is an emerging non-linear hybrid model and has demonstrated
    more excellent predictive abilities in different fields (Ahmed et al., 2017; Alas
    et al., 2020; Gaya et al., 2014; Yaseen et al., 2018). The quantitative examination
    of ANFIS-M1 in terms of MSE=0.0001 and RMSE=0.0071 performed better than ANN,
    SVM and MLR. Similarly, this outcome demonstrated that the influence of each independent
    model behaves differently for the same input combinations. Additionally, time-series
    graphs are useful methods for representation of different statistical scenarios.'
