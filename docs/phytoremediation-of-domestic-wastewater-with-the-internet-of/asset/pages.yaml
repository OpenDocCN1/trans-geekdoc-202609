    was installed at the discharge point of the secondary wastewater. Additionally,
    a detachable tray sheet perforated with 20 holes of 10–15 mm diameter was used
    to hold the plants vertically in place. Figure 5.2 illustrates the dimensions
    of the constructed hydroponic system. Furthermore, the constructed hydroponic
    ponds served as a shallow pond system for the cultivation of the aquatic plants
    and phytoremediation of the domestic wastewater.


    # 5.4.3 SOURCES OF THE PLANT SAMPLES


    *P. stratiotes* and *E. crassipes* plants were obtained within the premises of
    the research site, while *S. molesta* plants was collected from MRB nursery, Kajang,
    Selangor. The plants were rinsed with water to remove unwanted particles before
    weighing the fresh plants into each of the constructed treatment systems containing
    the influent water samples.


    # 5.4.4 METHOD OF PLANT CULTIVATION


    The selected plants were cultivated according to the methods reported by Kutty
    et al. (2009) and Rezania et al. (2015), with adjustments in the acclimatization
    period and retention time. The plants were cultivated in three stages. In the
    first stage, 100g of the fresh *P. stratiotes*, *S. molesta* and *E. crassipes*
    were cultivated in separate hydroponic tanks containing the influent water samples
    from the secondary treated water. The plants were allowed to acclimatize in the
    systems for 5 days prior to the sampling study.'
