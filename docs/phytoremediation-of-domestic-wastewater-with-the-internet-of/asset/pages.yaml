    interactions between lakes, river and groundwater hydrology in order to gain a
    better understanding of the underlying science (Whitehead et al., 2019). However,
    target 6.3 of the UN''s Sustainable Development Goals (SDGs) is aimed at enhancing
    water quality through lower pollution, preventing and reducing the release of
    harmful chemicals (United Nations, 2018). Thus, effective decision making and
    policy systems are required to address these issues on a national and worldwide
    scale (Whitehead et al., 2019). Wireless sensors are opted to monitor water quality
    parameters including oxidation–reduction potential (ORP), chlorine, pH, temperature
    and turbidity. In most water quality detection sensors, the sensing component
    is constructed based on chemical, physical and biological parameters of water
    (Dong et al., 2015).


