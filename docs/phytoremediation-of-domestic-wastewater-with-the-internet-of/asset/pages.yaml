  md: '# # Case Study

    Monitoring and Evaluation of Phytoremediation System Using Internet of Things
    (IoT) and Machine Learning Techniques


    #  9.1 INTRODUCTION


    Over the past century, there has been increasing efforts worldwide devoted to
    the development of water quality models (Whitehead et al., 2019). Monitoring activities
    can help in understanding, protecting and improving aquatic habitat. Water quality
    data analysis helps in quantifying environmental changes and develop management
    practices. Therefore, water quality monitoring network is a key element for managing
    and protecting water environment as it captures information about the state of
    water systems (Jiang et al., 2020). Additionally, smart water quality monitoring
    is regarded as the future water quality monitoring technique that enhances efficient
    data collection, communication, data analysis and early warning (Dong et al.,
    2015). Data transferred between sensors and the core network such as internet
    of things (IoT) technology generate data more frequently and also offloads computation
    to the cloud (Saravanan et al., 2018). For example, IoT environmental sensor is
    a valuable tool for monitoring and modelling environmental phenomena (Edmondson
    et al., 2018; Mustafa et al., 2021c). Additionally, sensors are connected to an
    ARM-based chipboards as the Arduino microprocessors, ESP32, ESP8266 and Raspberry
    Pi microcomputer to collect data that can be viewed by a computer and interpreted
    using Artificial Intelligence (AI) Chowdury et al., 2019; Mustafa et al., 2021c).
    Furthermore, a lot of research has been reported using IoT sensors for measuring
    water quality parameters (Saravanan et al., 2018). Nevertheless, little or no
    study has been done to integrate the application of smart Arduino IoT system and
    machine learning techniques for monitoring and prediction of water quality parameters
    in phytoremediation of domestic wastewater using Salvinia molesta plants. Thus,
    this study aims to bridge this gap.


    Moreover, the efficiency of S. molesta plants in phytoremediation of domestic
    wastewater has been reported (Hayder & Mustafa, 2021; Mustafa et al., 2021a);'
