  md: '# Cultivation of Aquatic Plants for Wastewater Treatment


    been used in phytoremediation of wastewater due to their ability to trap and degrade
    pollutants in wastewater. Nurmini and Felani (2015) studied the phytoremediation
    of liquid waste from tapioca industry using E. crassipes plants for 28days. The
    study only considered seven WQ parameters. Faisal and Zhang (2015) investigated
    the potentials of E. crassipes in the treatment of industrial effluent. The findings
    demonstrated up to 92.5% 83.7% COD, 91.8% TSS, 62.3% TDS, 80% TS, 71.6% NH₄-N,
    67.5% NO₃, 90.2% PO₃, 9.7% Cs, 95.1% Ni, 99.9% Hg and 83.4% Pb reduction. Additionally,
    Qin et al. (2016) investigated the phytoremediation of domestic wastewater using
    water hyacinth and water lettuce. The result of the study indicated that E. crassipes
    obtained a total of 58.64% accumulating capacity for nitrogen. This result can
    be attributed to the leaf area and higher root activity (71,79–98.34 µ/g/h), root
    biomass (kg/m²), net photosynthetic rate (20.2 µmol/m²/S), active absorption area
    (0.31–0.36/m² fresh weight) and large root surface (0.97–1.10 mg/m²) fresh weight.
    Khare and Lal (2017) studied the potentials of E. crassipes in sewage treatment
    seven-week constructed wetland system of 5×4 ft×2.5 ft dimension to investigate
    the potentials. The physicochemical tests were restricted to turbidity TDS, BOD,
    DO, EC, COD, pH, K, and nitrogen. Goswami and Das (2018) E. crassipes plants in
    synthetic wastewater containing different concentrations of Cu in Hoagland solution.
    The findings of the research indicated up to 55%–57% Cu reduction efficiency was
    obtained from the initial concentration of 5–10 mg/L Cu after 21 days. In addition,
    Nash et al. (2019) estimated the survival level and nutrient uptake of E. crassipes
    in Sago mill effluent (SME). The experiment was carried out in glass aquariums
    of 30cm (length)×30cm (width)×30cm (depth) under controlled conditions for 30
    days.


    Furthermore, Safauldeen et al. (2019) used varying quantities of E. crassipes
    (8, 10 and 12 clumps) and retention times in phytoremediation of batik wastewater.
    Additionally, Sayago (2019) designed a sustainable method for phytoremediation
    of wastewater and generation of bioethanol using E. crassipes. In the study, the
    harvested E. crassipes biomass was loaded into bioreactors for bioethanol generation.
    The study proved the dual applications of E. crassipes for phytoremediation of
    wastewater and generation of biofuel using hydrolysis process. Parwin and Paul
    (2019) employed E. crassipes in the treatment of K for a 4-week period. Water
    quality parameters including turbidity, total hardness, NO₂-N, TDS, NH₄-N, K+,
    PO³⁻-P, EC, sulfate and bicarbonate were analyzed. Although the study evaluated
    the reduction efficiency and concentration factor, retention time and the estimated
    quantity of the plants used in the research were not mentioned. Besides, it is
    important to understand the nutrient assimilation, nutrient storage, nutrient
    uptake rates and growth rate of macrophytes.


    Nevertheless, it was observed that recent research on phytoremediation of wastewater
    required considerable effort and maintenance. Despite phytoremediation techniques
    improving the quality of the wastewater, the long-time monitoring and the vast
    area required for constructed wetlands make the approach labour intensive. Thus,
    the use of phytoremediation techniques in the treatment of wastewater needs to
    be restricted. However, the importance of developing a simple, efficient and feasible
    technology such as hydroponic systems for phytoremediation of wastewater within
    a short period cannot be overemphasized.'
