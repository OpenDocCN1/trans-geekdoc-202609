    and $CO_2$ by microorganisms (Jasim, 2020). At the same time, suspended solids
    are primarily eliminated through physical sedimentation. Similarly, the removal
    of dissolved phosphorus and nitrogen is essential in nutrient-removal wastewater
    treatment systems. The toxicity of non-ionized ammonia compounds to fish and other
    aquatic species is another consequence of nitrogen compounds in wastewater effluents.
    Howeverever, conventional wastewater treatment is divided into preliminary, primary,
    secondary and tertiary stage (Asiwal et al., 2016). The brief description of preliminary,
    secondary and tertiary stages is presented in the next section.


    # 2.3 PRELIMINARY TREATMENT OF WASTEWATER


    In the preliminary phase of wastewater treatment, solid debris transported by
    sewers are removed. These solid debris be floating particles such as wood, feces,
    grains of rock or sand and rags. The sewage is passed through holes or chambers
    to remove floating debris, and at regular intervals, the built-up waste on the
    bars is scraped off (Jasim, 2020). Grits are removed by reducing the flow velocity
    to a point where the silt and grit settle, while the organic solids remain suspended
    (Abdel-Raouf et al., 2019).'
