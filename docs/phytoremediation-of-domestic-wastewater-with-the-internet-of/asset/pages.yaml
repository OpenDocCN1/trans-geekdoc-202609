  md: '# Water Quality Monitoring in Wastewater Phytoremediation


    # 6.2.5 DETERMINATION OF COD


    The COD tests were conducted in accordance the United States Environmental Protection
    Agency (USEPA) Reactor Digestion Method (8000) at 610nm with DR 3900 spectrophotometer
    at 830nm programmed on 430 COD detectable range of 3–150 mg/L (HACH, 2014). The
    COD samples were prepared by transferring 2ml of the sample into COD digestion
    reagent. The mixture was then placed in a preheated DRB200 reactor at a temperature
    of 150°C for 2 hours. After the heating, the mixture was allowed to cool before
    inserting into the spectrophotometer programmed at 435 COD HR. The results displayed
    by the spectrophotometer were recorded. The same procedure was used to carry out
    the COD analysis for all the samples.


    # 6.2.6 DETERMINATION OF PHOSPHATE


    The phosphate analysis was performed USEPA method 365.2 and 4500-P-E standard
    for wastewater. The ascorbic acid method (HACH method 8084) was performed using
    phosVer 3 Phosphate Reagent Powder Pillows with a HACH DR3900 spectrophotometer
    at 830nm that allows high-detection range (0.02–2.50 mg/L PO3-) programmed on
    a 490 P React PP (HACH, 2019). The sample was prepared by filling 10mL of the
    sample into a sample cell, one sachet of phosVer 3 Phosphate Reagent Powder was
    transferred into the sample cell, followed by vigorous shaking of the mixture
    for 20–30 seconds. After that, the mixture was allowed to settle for 2 minutes
    before placing in the sample holder of the spectrophotometer. The results obtained
    recorded. The same procedure was used in analysing the phosphate concentration
    of all the samples.


    # 6.2.7 DETERMINATION OF AMMONIA NITROGEN


    The ammonia test of the influent and effluent waters was analysed following USEPA
    method 350.2 wastewater analysis using the Nessler method (HACH method 8038) with
    a HACH DR3900 spectrophotometer (program 380N, Ammonia Ness) at a wavelength of
    425nm and a noticeable range of 0.02–2.50 mg/L NH-N (HACH, 2019). The sample was
    prepared by filling the mixing cylinder with 25mL of the sample, three drops of
    mineral stabilizer and polyvinyl dispersing agent transferred into the 25mL sample
    and the mixture was inverted several times, followed by the addition of 1 mL of
    Nessler reagent. The mixture was inverted severally to obtain a homogeneous mixture.
    Thereafter, the mixture was allowed to settle for 1 minute before transferring
    10mL of the mixture into a sample cell. The 10mL sample placed in a sample holder
    in the spectrophotometer. The results displayed were recorded. The same procedure
    was used in analysing the remaining samples.


    # 6.2.8 DETERMINATION OF NITRATE


    The nitrate analysis of the influent and effluent samples was conducted according
    to Cd reduction method (HACH method 8039) using Nitaver 5 Nitrate Reagent'
