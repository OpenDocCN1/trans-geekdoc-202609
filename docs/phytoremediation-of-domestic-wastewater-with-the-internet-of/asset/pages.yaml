  md: '# Microalgae Cultivation


    # 3.2 MICROALGAE


    Microalgae also called seaweeds are organisms that perform photosynthesis using
    carbon dioxide, resulting in the production of useful substances as biomass (Lee
    & Lavoie, 2013). It has been estimated that there are around 150,000 micro microgae
    species grouped into eight phyla: Xanthophyta, Chlorophyta, Phaeophyta, Diatom,
    Euglenophyta, Pyrophophyta, Rhodophyta and Chyrsophyta. They usually develop in
    nutrient-rich marine environment such as fresh and marine water, municipal wastewater
    (Zhou et al., 2012), industrial wastewater and animal wastewater (Hu et al., 2013)
    that contains enough quantity of carbon, nitrogen and phosphorus.


    The future of algae-derived products is currently trending upwards. Additionally,
    Mehta et al. (2018) postulated that by the year 2024, the global demand for microalgae
    products would be about 143 million US dollars. Furthermore, Chlorella vulgaris
    and Bacillus braii species contain high amounts of lipids which indicates a strong
    potential for biodiesel production (Najafi et al., 2011). According to Chisti
    (2007), algae are the sole renewable source of biofuels and are anticipated to
    be significantly less harmful to the environment and the global food supply chain
    than traditional biofuel-producing crops. Microalgae are more suitable for biofuel
    lignocellulosic materials due to their inherent high lipid content, semi-steady
    state production and suitability in a variety of climates (Miao et al., 2004).
    Microal biofilms are distinguished by high caloric value, low viscosity and density,
    making them a better fuel compared to plant biofuels (Clarens et al., 2010).


    Microalgae can be cultivated in open, or hybrid systems for the production of
    feedstock or biomass. Open systems are the most cost-effective, but they have
    the drawback of having little to regulate contamination from predators, whereas
    photobioreactors (PBR) may be employed in closed systems. In other words, PBR
    offers a beneficial method for controlling culture factors including carbon dioxide,
    temperature, light and pH with high financial investment. In contrast, hybrid
    systems integrate the closed and open systems in a two-stage cultivation process
    that accommodates the culturing of the inoculum using photobioreactors in the
    initial stage, followed by cultivation of the algae in the second stage using
    open ponds. The type of technique to be employed is the planned use of the biomass
    and the environmental parameters of the production site (Aratoni et al., 2019).
    Despite the benefits of microalgae-derived biofuels over other plants, the production
    of biofilms from algae cannot account for a significant portion of the global
    supply of liquid fuels due to the numerous obstacles that hinder the processes.
    In this respect, different techniques and instruments such as high-rate algal
    ponds, photobioreactors and microfuel cells have been used for effective microalgae
    cultivation for treatment of wastewater and biomass recovery, which is further
    discussed in the next section.


    In this regard, several approaches and equipment including high-rate algal ponds,
    photobioreactors and microfuel cells have been employed for successful microalgae
    culture for wastewater treatment and biomass recovery. These techniques are covered
    in more detail in the following sections.'
