    # 4.5.3.3 Description of E. crassipes


    E. crassipes plants are composed of stalked rosette leaves, feathery roots, slender
    root stocks and flowers arranged in clusters of leaf axils. The leaves are broadly
    circular, gently curved, often undulating sides and have a diameter and height
    of 10–20cm and 0.5–1 m, respectively. Additionally, the leaves are dark green
    in colour and are borne on inflated petioles resembling bladders (Ecoport, 2011).
    The leaf veins are numerous, thick, longitudinal and densely packed. As the axial
    bud develops, leaves arise by rupturing a tabular leaf-like structure called a
    prophyll. Furthermore, the flowers have six petals with purplish-blue colour and
    yellow uppermost (Ecoport, 2011). The diagram of the plants displaying the flowers
    is presented in Figure 4.4.


    # 4.5.3.4 Potentials of E. crassipes Plants


    in Phytoremediation of Wastewater

    E. crassipes has a high potential for phytoremediation of wastewater through biological,
    chemical and physical processes (Mayo & Hanai, 2017). The plants have'
