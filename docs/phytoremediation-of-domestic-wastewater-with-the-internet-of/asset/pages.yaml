    Phytoremediation of Domestic Wastewater


    #  6.2.1 DETERMINATION OF PH


    The test for pH was performed using a pH meter (SCHMELZ Rev V2.0, TPS Pty Ltd.,
    Australia). The pH probe was stirred in the water samples until a consistent and
    precise pH value was achieved. Additionally, the pH measurements were conducted
    at a temperature of 25°C (Instruments, 2000).


    #  6.2.2 DETERMINATION OF COLOUR


    The colour test for all the samples was performed using DR3900 spectrophotometer
    (HACH, Loveland, Co., USA), programmed on 120 colour 455 nm (APHA, 2017). The
    samples were prepared by filling 10mL of the samples into separate sample cells.
    The blank sample was used to calibrate the spectrophotometer to zero before inserting
    the sample cells containing each of the water samples. The readings displayed
    on the spectrophotometer were recorded. This procedure was repeated thrice for
    each sample and the average result was recorded.


    #  6.2.3 DETERMINATION OF TURBIDITY


    The turbidity tests were conducted using HANA HI 93703 microprocessor turbidimeter
    that peaked at 890 nm with a range of 0–1000 NTU. The test was performed by filling
    25mL of the samples into separate sample cells. The sample cells containing each
    of the samples were placed in the turbidimeter and the readings were recorded.
    This procedure was repeated thrice for each sample and the average outcome was
    recorded.


    #  6.2.4 DETERMINATION OF BOD₅


    The difference in the water samples before and after 5days of incubation is used
    to determine the BOD in water (Aiyikaike et al., 2019). DO meter with model HQ40d
    (HACH, Loveland, Co., USA) portable analyser as described by the dilution method
    (8043) was used to measure the DO of the samples. The samples were prepared by
    adding 15 mL of the sample bottle and the aerated solution of BOD nutrient was
    added up to the mark of 300mL. Thereafter, the probe of the DO meter was inserted
    in the sample and stirred, the meter was set to measure the DO and the procedure
    was repeated thrice to get a constant reading before recording. Furthermore, the
    samples were incubated at 20°C for 5 days (IS: 3025 P44) and the DO measurement
    was repeated as DOfinal. The BOD concentration was obtained using Equation 6.1
    (APHA, 2005):


    ```

    BOD_x(mg/L) = \frac{DO_{initial} - DO_{final}}{Volume\ of\ sample}$

    ```


    where DO_{initial} and DO_{final} are the initial and final dissolved oxygen,
    respectively.'
