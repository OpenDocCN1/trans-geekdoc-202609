  md: '# Water Quality Monitoring Using Internet of Things (IoT)


    # 7.4.4 TOTAL DISSOLVED SOLIDS (TDS) SENSOR


    TDS sensor is used to measure the dissolved solids in water samples. TDS sensor
    can be connected to IoT systems for easy application (Anuradha et al., 2018).
    Additionally, TDS sensors accept input and output voltage ranging from 3.3–5.5V
    and 0–2.3V, respectively, making them suitable with 3.3 or 5 V control systems.
    The excitation source is an alternating current signal that prevents the probe
    from being polarized and extends the durability of the probe. TDS sensor has a
    measuring range of 0–1000ppm (Baldwin et al., 2019). TDS sensor is waterproof
    and can be used in hydroponic systems and wastewater treatment plants (WWTP) monitoring
    (Anuradha et al., 2018). The TDS sensor is shown in Figure 7.5.


    # 7.5 LIQUID CRYSTAL DISPLAY (LCD)


    LCD device is a flat panel that adjusts the light-modulating characteristics of
    liquid crystals and polarizers to display different characters and symbols. LCDs
    consist of 16-character and 2-line alphanumeric (16×2) LCD interface linked to
    the microcontroller, which enables the device to connect to E-block I/O ports.
    The data on the LCD is in serial format and can be powered by a 5 V source. The
    optimum source of 5 V is the E-block’s Multi programmer or 5 V fixed power source
    (Priyadharshini et al., 2018). The LCD is shown in Figure 7.6.


