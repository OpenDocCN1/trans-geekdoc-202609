- pgno: 15
  md: '# Impacts of SDGs in Wastewater Management


    # 1.2.1 DOMESTIC WASTEWATER


    Wastewater from households has been classified into different colours based on
    their usage (Shi et al., 2018). Wastewater from kitchen and bathroom usage is
    classified under grey water. Urine with minimal flushing water is classified as
    yellow water, grey faecal from the toilet is categorized as black water (De Gisi
    et al., 2015). Grey water is often described as urban wastewater generated from
    showers, hand basins and kitchen sinks. Additionally, kitchen grey water contains
    high BOD, variable thermolerant coliforms and cleaning agents (detergents). In
    contrast, bathroom grey water has a high concentration of suspended particles,
    hair and turbidity from cleaning chemicals such as toothpaste, soap and shampoo.
    Furthermore, it has lower BOD concentrations and thermolerant coliforms loads.
    According to a previous study, laundry and kitchen grey water contain much more
    organic and physical contaminants than bathroom grey water. All grey water types
    have a high degree of biodegradability regard to COD (Metcalf & Eddy, 2003). However,
    phosphorus and nitrogen are deficient due to absence of faeces and urine in bathroom
    grey water. Similarly, laundry grey water is also deficient in phosphorus due
    to the application of phosphorous-free detergent in laundry. Powdered laundry
    detergent is the main source of pollution in grey water. Many of them have a high
    concentration of salts and phosphorus, and they are alkaline in nature. Long-term
    application of laundry water in gardens may result in shifting of plants and salt
    build-up in the soil (De Gisi et al., 2015).


    # 1.2.2 INDUSTRIAL WASTEWATER


    The word "industrial wastewater" refers to wastewater discharged from various
    industrial processes (Ahmed et al., 2021). Water is used in industries for different
    purposes, including manufacturing of goods, heating and cooling of industrial
    processes, firefighting, dissolving of solvents, and transportation of waste matter
    and raw materials. Pollutants such as zinc (Zn), chromium (Cr), copper (Cu), lead
    (Pb), iron (Fe), cadmium (Cd), nickel (Ni), arsenic (As) and mercury (Hg) can
    be present in industrial wastewater depending on the type of manufacturing or
    commercial activities carried (Wang & Yang, 2016). Furthermore, industrial wastewater
    is divided into inorganic and organic wastewater. In general, treating wastewater
    is tough because it necessitates an individual analysis of the set-ups and the
    construction of specific treatment plants on an industry-specific basis. For example,
    organic contaminants are maintained in the secondly treated wastewater even after
    the primary biological treatment has taken place. Power plants, food/beverage
    industries, steel/iron production plants, industrial laundries, oil and gas fracking
    plants, metal-finishing and mining are examples of industries that generate wastewater
    (Liu et al., 2014).


    # 1.2.3 MUNICIPAL WASTEWATER


    Municipal wastewater is a mixture of domestic and industrial wastewater (Guldhe
    et al., 2017). The characteristics of municipal wastewater depend on the source,
    and it'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 4


    # Phytoremediation of Domestic Wastewater


    is significantly influenced by local activities. Municipal wastewater contains
    organic compounds and nutrients such as phosphorus, nitrogen and basic metal ions
    for aquatic plant growth. In general, municipal wastewater contains less phosphorus
    and nitrogen than agricultural wastewater. Animal wastewater is commonly nutrient-dense,
    particularly in nitrogen and phosphorus (Zhu et al., 2019). Additionally, the
    concentration of nutrients in agricultural wastewater remains highly variable
    depending on the wastewater source. Furthermore, agricultural wastewater contains
    fungicides, insecticides, herbicides and antibiotics (Cai et al., 2013).


    # 1.3 STRATEGIES FOR EFFECTIVE MANAGEMENT OF WASTEWATER


    The management of wastewater is an essential part of comprehensive integrated
    water resources management. The majority of water users rely on sufficient levels
    of water quality. Water quality protection and management are increasingly becoming
    the focus of major efforts and costs in water management (Lucks & Van, 2005).
    Consequently, wastewater management has a long history. Generally, the difficulties
    encountered in wastewater management are largely due to the absence of uniform
    definitions, reporting guidelines and a central repository for wastewater treatment
    data (Malik et al., 2015). Therefore, wastewater management entails proper handling
    of wastewater in order to protect the environment and economic, public health
    and social stability (Metcalf & Eddy, 2003). Water protection and sanitation are
    the main goals of wastewater management. This means that wastewater must be sufficiently
    clean to be used for drinking and washing, irrigation and commercial purposes
    by industries. Nevertheless, different strategies are required for efficient wastewater
    management depending on the location, source of the wastewater, population size,
    technical capacity, economic development and source of governance in place. Additionally,
    the strategies can differ based on the level of quality needed for safe disposal
    and end users. Thus, wastewater management should reflect the economic, social
    and environmental needs of the end users (Corcoran et al., 2010). Additionally,
    economic assessment and evaluation must be discussed in wastewater management
    research with the objective of connecting natural resource with the population
    and benefits to the wider community (Cetković et al., 2022). Moreover, effective
    approaches of wastewater management would address global water scarcity challenges
    and relieve pressure on water bodies. Notwithstanding, implementation of wastewater
    management must take into account different treatment methods, stakeholders, environmental
    laws and policies of waste disposal, as well as any external costs and benefits
    associated with the reuse choice (Garcia & Parmangat, 2015).


    # 1.4 CONTRIBUTIONS OF SUSTAINABLE DEVELOPMENT GOALS (SDGs) IN PROMOTING WASTEWATER
    MANAGEMENT


    Ever since the adoption of the sustainable development goals (SDGs), the crucial
    problems listed have worldwide recognition. The United Nations (UN) considered
    the SDGs for water due to its significance to humans and aquatic species.'
  merge: -1
