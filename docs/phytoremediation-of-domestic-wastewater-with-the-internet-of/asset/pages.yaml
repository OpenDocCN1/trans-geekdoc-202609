    From Table 9.2, it is evident that ANN, SVM, ANFIS and MLR were capable of modelling
    the turbidity of the S. molesta treatment system; this was proved by considering
    the statistical indicators (R, R², MSE and RMSE). The (\*) indicates the best
    model. The visual inspection of the data indicated that M1 was superior to M2
    for all models. Additionally, ANFIS-M1* was observed to perform better than ANN,
    SVM and MLR. Thus, overall in TURBIT modelling.


