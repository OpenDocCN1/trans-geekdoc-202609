  md: '# 3 Microalgae Cultivation for Wastewater Treatment and Bioenergy Generation


    # 3.1 INTRODUCTION


    The demand for clean energy and water on a daily basis has increased as a consequence
    of population growth, industrialization, urbanization and other factors affecting
    the economy and society. As a result, the search for renewable clean energy sources
    have become increasingly important (Alipoor & Saidi, 2017). Fossil fuels are the
    primary energy source at the moment; however, they are rapidly depleted and cannot
    be easily regenerated over the course of a human lifetime. High usage of fossil
    fuels is the main driver of greenhouse gas emissions into the atmosphere and climate
    change. Hence, to fulfill the rising demand for energy and for the environment,
    it is essential to prioritize the development of environmentally benign energy
    sources. The combination of energy and water recovery from municipal or industrial
    wastewater might be a potential solution to these concerns because wastewater
    is made up of free energy, water and nutrients that can enhance plant growth.
    Moreover, waste is a resource that can be transformed into useful materials for
    the manufacturing of new products, source of nutrients or energy. Consequently,
    the generation and disposal of waste is a worldwide problem that is expected to
    worsen on all continents (Kaza et al., 2018). The production of water per year
    is expected to amount to 2.1 billion tonnes, while water bodies are estimated
    to decrease each day. Effective waste treatment processes have become increasingly
    important. Therefore, to achieve ecological sustainability in the area of waste
    management, a pyramid of waste hierarchy has been developed by the European Waste
    Framework Directive (EC, 2008). The waste hierarchy is presented in Figure 3.1.


    Furthermore, renewable energy sources are predicted to suffice all energy demands
