  md: '# 10.2.6 MULTILINEAR REGRESSION (MLR)


    MLR is used in determining the level of variation between two or more variables.
    MLR of Y (dependent variable) on X (independent variable) is defined as (Chen
    & Liu, 2015):


    ```

    y = b_0 + b_1x_1 + b_2x_2 + b_3x_3 + \cdots + b_ix_i \quad (10.15)

    ```


    x_i is the value of the ithth predictor, b_0 is the regression constant and b_i
    is the coefficient of the ithth predictor.


    # 10.3 MODEL VALIDATION AND PERFORMANCE EVALUATION


    The model performance was determined by splitting the predicted data obtained
    from the ANN, SVM, ANFIS and MLR simulations into 70% training (1548) and 30%
    testing (663) data. To monitor the performance of the models, different evaluation
    criteria namely coefficient of correlation (R), coefficient of determination (R²),
    mean square error (MSE) and root mean square error (RMSE) were used. The model
    performance parameters are formulated as follows:


    ```

    R = 1 - \frac{\sum_{i=1}^n (A_i - P_i)^2}{\sum_{i=1}^n (A_i - \bar{A})^2} \quad
    (10.16)

    ```


    ```

    R^2 = 1 - \frac{\sum_{i=1}^n (A_i - P_i)^2}{\sum_{i=1}^n (A_i - \bar{A})^2} \quad
    (10.17)

    ```


    ```

    MSE = \frac{\sum_{i=1}^n (A_i - P_i)^2}{n} \quad (10.18)

    ```


    ```

    RMSE = \sqrt{\frac{\sum_{i=1}^n (A_i - P_i)^2}{n}} \quad (10.19)

    ```


    where A_i, \bar{A} and P_i represent the actual values in ith daily, the average
    of actual values and predicted values, respectively, while n represents the number
    of data.


