  md: '# #5 Phytoremediation of Wastewater in Hydroponic Systems


    # ## 5.1 INTRODUCTION


    Hydroponic system can be described as a technique of plant cultivation in the
    absence of soil (Aires, 2018). Hydroponic ponds can be used to grow aquatic plants
    in nutrient-rich effluent. This method is regarded as an essential stage in wastewater
    phytoremediation, in which plant break down the excess presents in wastewater
    (Norström et al., 2004). Therefore, the application of hydroponic systems would
    promote sustainable method for effective wastewater management (Baddadi et al.,
    2019). Hydroponic systems are classified based on the type of nutrient feeding
    (Hussain et al., 2014). Furthermore, they may be divided into two broad groups:
    nutrient and hydroponic systems that do not require a substrate (Cooper, 1979).
    The substrate-based culture methods enable root anchoring and serve as a medium
    for microbe attachment, as well as water-nutritional flywheels (Magwaza et al.,
    2020). Beside, factors such as sunlight, plants, wastewater composition and growth
    of microorganism play a significant role for effective treatment of wastewater
    and biomass production in hydroponic systems. The plant root system also promotes
    the growth of microorganisms by generating metabolites that act as food for the
    bacteria, enhancing the rate of nitrification and denitrification process in biological
    wastewater treatment (Magwaza et al., 2020). Additionally, hydroponic cultivation
    using wastewater would promote low-cost cultivation of crops and biomass, ensuring
    food security and creating income for underprivileged (Snow et al., 2008).


    # ## 5.2 OVERVIEW OF HYDROPONIC SYSTEMS IN WASTEWATER TREATMENT


    Hydroponics is derived from the Greek words hydro (water) and ponos (labour).
    In most cases, the hydroponic system is usually used for the tertiary stage treatment
    of wastewater (Yang et al., 2015). The construction of hydroponic systems for
    wastewater requires a multidisciplinary approach that incorporates design principles
    from the fields of civil engineering, biology, chemistry and biochemistry. Additionally,
    a greenhouse is introduced in the design to enhance the biological treatment system.
    The main purpose of the greenhouse is to provide climatic conditions that favor
    plant growth by protecting plants from adverse weather conditions, including temperatures,
    excessive precipitation and severe winds. The primary goal of the greenhouse


    DOI: 10.1201/9781003359586-5'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'is to create eco-friendly conditions that would protect cultivated plants from
    adverse weather elements including wind, temperature and precipitation. Then,
    it is best to supplement sunlight, energy and CO2 to increase yield, particularly
    during winter season. However, it was discovered that a number of design factors
    connected to the design of hydroponics for wastewater treatment impede the construction
    standards (Magwaza et al., 2020). Additionally, wastewater treatment using hydroponic
    systems involves biological, chemical and physical processes with interaction
    between plant roots, microorganisms and nutrients. These systems are similar to
    constructed wetlands (Wetipat, 2008). Furthermore, hydroponic systems are more
    sustainable, economical and environmentally friendly for use in wastewater remediation
    than constructed wetlands. Unlike the hydroponic systems, constructed wetland
    treatment systems utilizes plants with minimal economic value to break down contaminants
    from wastewater (Vaillant et al., 2003). Moreover, hydroponic systems are easy
    to maintain, requiring less energy and can be implemented onsite within a small
    space (Abe et al., 2010).


    # 5.3 NUTRIENT RECOVERY BY AQUATIC PLANTS


    Tertiary treatment may be utilized to polish wastewater that has passed through
    the primary and secondary stages of conventional treatment methods. Tertiary treatment
    of effluents is a progression of extra strides following secondary treatment to
    further reduce the amount of phosphorus, nitrogen, metals, organics, phosphates
    and turbidity in wastewater. Summary, tertiary sewage is treated when the wastewater
    is used for drinking, agricultural and leisure purposes (Garba & Pepper, 2015).
    Besides, plants play a significant role in supplying oxygen through its roots,
    which aid the processes that lead to degradation of pollutants (Stewart et al.,
    2008). These processes include absorption of nutrients and heavy metals, denitrification
    and nitrification, and other biological processes in the treatment systems. Furthermore,
    absorption of inorganic and organic pollutants through volatilization is the essential
    process of nutrient uptake (Stewart et al., 2008). Thus, emergent, submerged and
    floating macrophytes have been used in reducing pollutants from different types
    of wastewater (Murad et al., 2014). This is due to the ability of the macrophytes
    to grow in the wastewater while accumulating and storing contaminants or nutrients
    in their roots and shoots through hydroponic cultivation of plants and transporting
    into polluted waters (Sharma & Gaur, 1995). Macrophytes accumulate substantial
    amount of pollutants: phosphates, nitrates, ammonia, heavy metals, reactive compounds
    and toxic compounds at low cost using energy eco-friendly approaches with limited
    waste disposal. They also produce large quantities of biomass roots through the
    use of renewable resources. Recently, the discovery of aquatic plants as phytoremediators
    and feedstock for the production of biofuels has led to its usage for gathering
    nutrients from the roots to the rhizosphere and to filter suspended solids. Several
    researchers maintain that macrophytes can discharge oxygen from roots to encompassing
    rhizosphere while providing aerobic conditions for nitrification occurrence.'
