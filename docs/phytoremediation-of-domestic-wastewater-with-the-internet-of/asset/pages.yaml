- pgno: 73
  md: '# # 6 Water Quality Monitoring in Wastewater Phytoremediation


    # ## 6.1 INTRODUCTION


    The search for long-term approach to curb and manage water pollution is crucial
    to the public, policy makers and the government. Water pollution occurs due to
    persistent inflow of pollutants from nonpoint and point sources into aquatic ecosystems.
    In general, physical (colour, turbidity, temperature and taste), chemical (phosphate,
    ammoniacal nitrogen and nitrates) and biological parameters are often used to
    assess water quality. Furthermore, the biological, chemical and physical properties
    of water determine its quality and application for a range of purposes, as well
    as preservation and protection of aquatic habitats (Omer, 2019). The biodegradation
    and dilution of organic and inorganic compounds allow aquatic environment to adapt
    and make up for variations in water quality parameters (Loucks & Van Beek, 2005).


    Nevertheless, hydroponic and built wetlands for phytoremediation techniques have
    demonstrated to be an efficient, low-cost and sustainable technology for integrating
    wastewater treatment and biomass production. Furthermore, hydroponic systems require
    small space and facilitate the production of valuable crops and plants of high
    economic importance during wastewater remediation processes. The main advantage
    of constructed wetlands is that it covers a wide range of applications as it can
    be used in habitat formation, flood control and wastewater decontamination. Thus,
    this chapter investigates the efficiency of different plants in tertiary treatment
    of domestic wastewater using hydroponic systems at different retention times based
    on different physicochemical analysis.


    # ## 6.2 CASE STUDY: WATER QUALITY MONITORING IN PHTOREMEDIATION OF DOMESTIC WASTEWATER


    The pH, colour, chemical oxygen demand (COD), biochemical oxygen demand (BOD₂),
    phosphate, ammonia nitrogen and nitrate level of the influent and effluent samples
    were determined using the procedures described below. The influent (untreated)
    samples were collected after secondary treatment, while the effluent (treated)
    samples were collected from the hydroponic tanks after aquatic plant cultivation.'
