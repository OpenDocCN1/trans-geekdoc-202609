    The study by Guo et al. (2015) was restricted to the applications of two ML models
    (ANN and SVM) and three performance criteria in forecasting the TN concentration
    of effluent from treatment plant (WWTP) using MATLAB software. The data was normalized
    to 1 and -1, while Darajah et al. (2017), Elfansi et al. (2017) and Parveen et
