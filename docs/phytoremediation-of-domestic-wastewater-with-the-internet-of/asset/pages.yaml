    # 3.6 CONCLUSION


    Researchers have extensively examined and reported on the curing of microalgae
    for wastewater treatment procedures and bioenergy generation. It can be deduced
    that these biological techniques are feasible for large-scale integration of wastewater
    remediation and energy production, if the aforementioned limitations surrounding
    HRAPs, photoreactors and MFCs are overcome. These limitations have led to the
    application of microalgae for simultaneous wastewater remediation and bioenergy
    production tedious and less attractive to a certain level that has resulted in
    making the produces expensive, uncompetitive with the conventional fossil fuels
    and Invariably, there is the need to find other alternatives through exploring
    the potentials of other aquatic plant species such as giant salvinia, water hyacinth
    and water lettuce for wastewater treatment and bioenergy generation to meet with
    the rising demand for clean water and development of sustainable energy sources.


