  md: '# Phytoremediation of Wastewater in Hydroponic Systems


    # 5.4 CASE STUDY: DEMONSTRATION OF AQUATIC PLANTS CULTIVATION IN WASTEWATER


    The cultivation of aquatic plants for nutrient uptake using hydroponic systems
    involves different stages. The stages are described in the subsequent sections.


    # 5.4.1 CULTIVATION AREA


    The cultivation of the plants was performed using a lab-scale hydroponic system.
    The cultivation area was situated in Kajang (2°58''04" N, 101°43''35" E), Selangor,
    Malaysia. The yearly average temperature of the environment is 27°C. Additionally,
    the sewage treatment plant was separated into different chambers, where wastewater
    is treated at the primary and secondary stages before being released into natural
    environment. Figures 5.1 shows the location of the research site (Adapted from
    Google Earth).


    # 5.4.2 RESEARCH SETUP


    Four rectangular hydroponic ponds measuring 670 mm (length)×420 mm (width)×220
    mm (depth) were built for the cultivation of the macrophytes. A thick glass of
    6mm was placed in the centre of the pond to act as tray support and tank divider,
    separating the influent and effluent flow of the water sample. Additionally, the
    digital timer and the submersible pump control the inlet and outlet water pipes.
    The control timer was connected to a power source located 40m away from the hydroponic
    system. It regulates the inflow of the influent and outflow of the effluent water
    in the hydroponic system at the fixed retention time. The submersible


