    response surface methodology (RSM) and ANN approaches in studying the phytoremediation
    of arsenic uptake by Ludwigia octovalis. Furthermore, Nourani et al. (2018) applied
    four ML models (FFNN, SVM, MLR and ANNFIS methods) in predicting the water quality
    indicators (TN, BOD and COD) of Nicosia WWTP. It was observed that ANNFIS outperforms
    all other models owing to the fuzzy concept capacity to deal with process uncertainty.


    Vo et al. (2019) and Kumar et al. (2019) explored different regression models
    in their research. In contrast, Farzi and Borghei (2019) and Kumar et al. (2021)
    combined regression and ML models. Furthermore, Kumar and Deswal (2020a) conducted
    a comparative study on random forest (RF), MSP and ANN modelling techniques in
    predicting the reduction of phosphorus from rice mill wastewater. The data were
    divided into 70% and 30% for training and testing the model. The modelling findings
    suggest that ANN outperforms the MSP5 tree and RF modelling, while Kumar and Deswal
    (2020b) applied three statistical parameters (RMSE, R², and MAE) to analyse the
    model accuracy of linear regression (LR), ANN and MSP5.'
