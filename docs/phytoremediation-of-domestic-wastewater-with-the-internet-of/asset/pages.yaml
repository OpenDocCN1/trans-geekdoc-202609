  md: '# 8 Machine Learning Techniques in Water Quality Monitoring


    # 8.1  INTRODUCTION


    Environmental issues and inadequate resources have promoted interest in searching
    for cost-effective strategies for water resource management. Data-driven and physical
    methods have been used in forecasting of water quality (WQ) parameters, estimation
    of sediment load and discharge in hydrological researches. The physical approach,
    on the other hand, has certain limitations, such as high cost and long time requirements.
    Currently, machine learning (ML) techniques have been effectively deployed in
    water treatment plants to complement analytical methods in monitoring, measurement
    and forecasting of WQ index. ML tools are capable of modelling and forecasted
    non-linear systems and historical data within a short period. Thus, this chapter
    describes the development, applications, advantages and disadvantages of machine
    learning techniques such as artificial neural network (ANN), support vector machine
    (SVM), adaptive neuro-fuzzy inference system (ANFIS), error ensemble learning
    and classical method (multilinear regression (MLR)) in the evaluation and prediction
    of water quality models. Furthermore, case studies on applications of ANN, SVM,
    ANFIS and MLR in bioremediation of wastewater were explored.


    # 8.2  CONCEPT OF MACHINE LEARNING (ML) TECHNIQUES IN BIOREMEDIATION OF WASTEWATER


    Artificial intelligence (AI) is a subfield in computer science that deals with
    the simulation of human intellect in contexts (Bagheri et al., 2019). Machine
    learning (ML) is a branch of AI and computer science that applies data and algorithms
    to perform classification, pattern recognition and prediction on data by learning
    from existing data. ML techniques have been used by different researchers because
    of their simplicity, accuracy and high operational speed (Rajanee et al., 2019).
    Furthermore, AI approaches have been employed in different engineering fields
    due to their ability to address practical water treatment challenges (AI Aani
    et al., 2019; Fan et al., 2018), monitor water quality (Elkiran et al., 2019)
    and water resource management (Xu et al., 2019; Zhao et al., 2020). Additionally,
    many studies have used AI models in monitoring and water assessment parameters
    including turbidity, temperature, pH, chemical oxygen demand (COD), suspended
    solids (SS), biochemical oxygen demand (BOD) and ammonia nitrogen in water plants'
  merge: -1
  img_proc: true
