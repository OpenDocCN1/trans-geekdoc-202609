    in 250 mL bottles. The collected water samples were transferred to the environmental
    laboratory for water quality tests. In the second stage of the cultivation process,
    the influent and effluent water samples were collected every 2 days at 24 hours
    retention time. In some cases, the water samples were preserved in a refrigerator
    before laboratory analysis.'
