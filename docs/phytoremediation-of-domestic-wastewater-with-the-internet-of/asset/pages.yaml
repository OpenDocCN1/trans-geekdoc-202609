    # 6.2.9 STATISTICAL ANALYSIS


    The readings of the physicochemical analysis were recorded in triplicate and the
    average were expressed as mean ±standard deviation. Additionally, Microsoft® Excel
    statistical package was used in calculating the mean and standard deviation. Analysis
    of variance (ANOVA) IBM® SPSS version 25 package was used in evaluating the significance
    of difference and t-test (SPSS, 2017). Equations 6.2 and 6.3 were used in calculating
    the dilution factor and percentage reduction efficiency (Valipour et al., 2015).


    ```

    $Dilution\ factor = \frac{Total\ volume\ of\ diluted\ sample}{Volume\ of\ wastewater\
    sample}$ \quad (6.2)

    ```


    ```

    $Reduction\ efficiency\(\%) = \frac{Ci - Ce}{Ci} \times 100$ \quad (6.3)

    ```


    Where Ci is the influent concentration and Ce is the effluent concentration.


