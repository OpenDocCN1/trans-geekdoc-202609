    can double in bio-mass within a period of 2–3 days due to asexual reproduction.
    The plants thrive at pH levels between 5–8. *S. molesta* can withstand temperatures
    between 5°C and 40°C (Madsen & Wersal, 2008). However, they perish within 2hours
    of exposure to temperatures below -3°C or above 43°C. In addition to this, they
    are sensitive to changes in nutrients. The discharge of agricultural effluents
    into rivers, lakes and streams increases the possibility of high yield of these
    plants as any increase in nutrient availability will significantly impact on the
    plant growth. This is due to phosphorus and nitrogen determining its growth rates
    and morphological characteristics. Likewise, the development of *S. molesta* is
    heavily restricted by salinity (Madsen & Wersal, 2008).'
