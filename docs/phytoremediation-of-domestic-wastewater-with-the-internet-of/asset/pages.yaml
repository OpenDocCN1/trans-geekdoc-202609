  md: '# Phytoremediation of Wastewater in Hydroponic Systems


    The presence of nutrients accelerated the growth of the plants, making them more
    effective in reducing the contaminants present in the influent samples. Similarly,
    this result supports the findings of Ansari et al. (2017), who stated that wastewater
    is a source of nutrients, water and energy, which encourages plants to grow, reproduce
    and survive when employed in phytoremediation of wastewater processes. Furthermore,
    nitrogen and phosphorus are macronutrients that are required by all plants. Nitrogen
    is an essential component of all living creatures it is found in DNA, protein,
    amino acids, nucleicic acid (RNA) and other cell components (Adhikari et al.,
    2020). The residual nutrients present after the primary and secondary treatment
    of the raw domestic wastewater were the primary source of phosphates, ammonia
    nitrogen and nitrate in the treatment systems.


    # 5.6 MANAGEMENT OF THE HARVESTED AQUATIC PLANTS


    Aquatic plants used in wastewater treatment have high growth rates. Aquatic plants
    that exhibit this characteristic are considered invasive, as they are capable
    of rapid colonization (Fletcher et al., 2020). Here, exists a critical link between
    the application of macrophytes in wastewater treatment and approaches for management
    of invasive plants (Fletcher et al., 2020). However, it is more appropriate to
    incorporate these plants as part of an integrated management strategy that successfully
    curtails the spread of the plants and remediation of polluted water (Yan et al.,
    2016). Additionally, when considering wastewater treatment using aquatic plants,
    environmental managers should conduct preliminary study to determine the optimum
    balance of the nutrient input/output and plant removal capacity, as well as other
    best practices. Manual technique (hand removal method) of aquatic harvesting plants
    is more suitable for lab-scale hydroponic system. Moreover, the hand removal method
    is tedious and time consuming, but it allows careful removal of selected unwanted
    water (Quill et al., 2015).


    # 5.7 CONCLUSION


    Macrophytes are important in biological wastewater treatment due to their ability
    in eliminating contaminants depending on the retention time, nature of pollutants,
    ambient conditions and plant features. Emergent, submerged and floating macrophytes
    have been used in reducing pollutants from wastewater sources. This is due to
    the ability of the macrophytes to grow in the wastewater in their roots and shoots
    through accumulating and storing contaminants or nutrients in their roots and
    through hydroponic cultivation of plants and transplanting into polluted waters.
    Furthermore, the outcome of the RGR demonstrated that the macrophytes grow efficiently
    from Day 0 to day 14. Similarly, the trend of the RGR indicated that the plants
    tripled in weight within the 14days of the sampling study. The high density observed
    by E. crasses could be attributed to the long roots. In addition, the high growth
    observed in the three plants was ascribed to the longer retention of 24 hours,
    which provided the plants with enough time to use the available nutrients present
    in the wastewater as food for their growth. Additionally, this finding revealed
    that the plants are capable of absorbing phosphates, nitrate and ammonia as nourishment.'
