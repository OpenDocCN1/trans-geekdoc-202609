    #  5.5 CASE STUDY: RELATIVE GROWTH RATE (RGR) OF AQUATIC PLANTS IN PHYTOREMEDIATION
    SYSTEMS


    Growth rate (RGR) is a parameter used in estimating plant growth. In this case
    study, RGR for E. crassipes, P. stratiotes and S. molesta at 24 hours retention
    was evaluated. The harvesting of the plants was carried out once a week from the
    2 weeks cultivation of the plants in hydroponic systems. The results were calculated
    using the equation below (Valipur et al., 2015). The graph of the RGR against
    the cultivated plants is presented in Figure 5.5.


    ```

    Relative growth rate (%) = \frac{ln Q_2 - ln Q_1}{r_2 - r_1} \times 100

    ```


    $Q1$ and $Q2$ are the dry weight of the plants at times $r1$ and $r2$, respectively.

    According to Figure 5.5, it can be seen that the test plants grow efficiently
    from day 0 to day 14. The pattern of the RGR showed that the plants tripled in
    weight within the 14 days of the sampling study. *E. crassipes* reached the highest
    growth with $2.5 \pm 0.0$ g/g/d, followed by *S. molesta* with $1.33 \pm 0.05$
    g/g/d and *P. stratiotes* with $0.92 \pm 0.02$ g/g/d at the end of the sampling
    period attributed to the long roots. ANOVA tests revealed a statistical difference
    between the growth rate of the individual test plants. Similarly, the high growth
    observed in the three plants was ascribed to the longer retention of 24 hours,
    which provided the plants with enough time to use the available nutrients present
    in the wastewater as food for their growth. Additionally, this finding revealed
    that the plants are capable of absorbing phosphates, nitrate and ammonia as nourishment.


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_68_0.png)


    FIGURE 5.5 Graph of RGR (g/g/d) against cultivated plants.'
