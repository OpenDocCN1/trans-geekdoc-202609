    # 8.5 ADAPTIVE NEURO-FUZZY INFERENCE SYSTEM (ANFIS)


    ANFIS is a soft computing technique designed by Jang (1993), and has been used
    in complex system control, modelling and parameter estimation (Şahin & Erol, 2017).
    In addition, ANFIS is a hybrid system that combines the characteristics of fuzzy
    logic with neural networks. The neural networks are supervised learning algorithms
    that predict future values using historical data. On the other hand, fuzzy logic
    uses the control signal from firing the rule. The generated rule is based on historical
    data and is completely random. However, the neural network selects the rule base
    in the ANFIS method through BP and approximates the non-linear system setup of
    the IF–THEN rules (fuzzy logic) incorporated into the model technique. This is
    done to enhance the applicability and performance of the ANFIS technique, making
    it a universal estimator (Mathur et al., 2016), neural networks learn from the
    data, though it is difficult to comprehend the weight and neurons'
