    where $x, x_{norm}, x_{min}$ and $x_{max}$ are the observed value, normalized
    value, the minimum and maximum values of the variable, respectively.

    In terms of feature selection, if the correlation is less than 10.5, it implies
    that there is a low correlation (weak association) between the input and the target
    variable. Furthermore, the validation methods were implemented using a different
    approach. The holhout approach was used in this study. The data was randomly assigned
    to two sets: calibration and validation (verification), which is a variation on
    k-fold cross-validation (Tsioptias et al., 2016).


