    # 9.2.3 WATER QUALITY PARAMETERS USED


    The water quality parameters used in the modelling and evaluation of the turbidity
    (TURBt) are given in Table 9.1.


    # 9.2.4 INFLUENT AND EFFLUENT CONCENTRATION OF TURBIDITY


    In most cases, high turbidity in water can cause increased water temperatures
    because suspended particles absorb heat and reduce the amount of light penetrating
    the water and high levels of suspended solids. Additionally, turbidity is an optical
    property that does not directly reflect the quantity or type of suspended solids
    (Kit et al., 2005). The time-series and boxplots for influent and effluent concentrations
    of the S. molesta are presented in Figure 9.3. Boxplot is a graphical illustration
    of statistical datasets based on five-number summary. The five-number summary
    describes the first quarter, third quarter, median, minimum and maximum. EViews
    software was used in plotting the boxplot graphs.


    # 9.3 RESULTS AND DISCUSSION


    As stated earlier, this research applied ANN, SVM, ANFIS and ML models in predicting
    the water quality parameters of S. molesta treatment system. Two models were generated
    for the evaluation and the model validation was conducted using four performance
    criteria. The results obtained are presented and discussed.


    # 9.3.1 RESULTS OF TURBt (ANN, SVM, ANFIS, and MLR)


    In the ANN simulation, the maximum number of MSE, iterations and learning rate
    were fixed as 0.0001, 10,000 and 0.01, respectively. The log sigmoid and purlin
    was observed to be the best activation functions for the hidden and output layers,
    respectively. Furthermore, in order to generate the optimal models, the appropriate
    number of hidden nodes must be selected to avoid over-fitting, whereas inadequate
    neurons'
