    training phase of the model (Ghiasi et al., 2016). ANFIS builds a fuzzy inference
    system based on the training examples. The most frequently used fuzzy inference
    systems are the Sugeno and Mandani systems. The distinction between the two inference
    systems is that the former is either linear or constant while the latter is non-linear
    (Şahin & Erol, 2017).


    In general, ANFIS is a FNN structure comprised of neuro-fuzzy system components
    at each layer. The ANFIS model utilizes the Sugeno model within an adaptive framework
    to learn and adaptation. The framework enables more systematic ANFIS modelling,
    making it less reliant on expert. Additionally, the ANFIS structure is illustrated
    in Figure 8.5, Adapted from Nourani et al. (2018). The advantages and drawbacks
