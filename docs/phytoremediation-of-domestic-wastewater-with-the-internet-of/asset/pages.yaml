    of domestic wastewater is largely based on empirical studies that investigated
    the efficiency of aquatic plants in the reduction of pollutants from domestic
    wastewater. Furthermore, there is no report in recent literature on the applications
    of Arduino IoT devices with MATLAB software for predicting and monitoring of ORP
    water quality parameter in phytoremediation of domestic wastewater using ANN,
    SVM, ANFIS and MLR models. Moreover, ORP is used in determining the oxidation
    and reduction potential of water samples. It is an important parameter that governs
    the biochemical processes because it indicates the level of pollutants present
    in water based ORP is crucial in water quality monitoring because on the oxidation
    and reduction properties such as microbial disinfection, nitrification and denitrification
    reactions, manganese and iron compound precipitation, and corrosion of drinking
    water distribution pipes (Mamun et al., 2019). A positive ORP value indicates
    that the substance is an oxidizing agent, whereas a negative reading suggests
    that it is a reducing agent.


