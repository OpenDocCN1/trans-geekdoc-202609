    # 9.4 CONCLUSION


    This research proposed the applications of IoT device, machine learning models
    (ANN, SVM, ANFIS) and one classical method (MLR) in monitoring and modeling the
    turbidity reduction of the influent wastewater treatment using S. molesta plants.
    The descriptive analysis and correlation matrix was mapped to investigate the
    extent, degree and type of relation between the influent and effluent parameters.
    The correlation coefficient (R) was evaluated to determine the extent of TURBI
    achieved fit using an AI-based model with the ranking order of ANFIS>SVM>ANN>MLR
    for M1 and ANN>ANFIS>MLR for M2. This outcome shows that AI could capture the
    complex non-linear patterns between the WQ variables for both calibration and
    verification. Furthermore, taking into account the outcome of the single model
    and variation in the models, it can be inferred that there is a need for further
    studies to develop a degree of consistency between the observed and predicted
    datasets in terms of the values.


