    technology and microbial fuel cells (MFCs) are some of the technologies that have
    been used in the treatment of wastewater. On the other hand, these methods have
    drawbacks such as complex mode of operation, time consumption, high cost and energy.
    According to McCarthy et al. (2011), high energy of about0.3–0.6 kWh/m³ was consumed
    in the treatment of wastewater using activated sludge method. Additionally, Singh
    et al. (2016) reported that 0.78 kg CO₂/m³ is the average carbon intensity for
    WWTPs. As a result, high energy requirement poses a major setback on the economic
    burden in applications of biological methods in WWTPs (Li et al., 2017). Therefore,
    development of sustainable and energy-neutral technologies for applications in
    WWTPs has become crucial. Hence, different countries around the world are employing
    cheap and eco-friendly technologies such as phytoremediation in wastewater treatment
    (George & Gabriel, 2017). Phytoremediation technique of wastewater treatment using
    hydroponic systems is cost-effective, energy efficient and simple to operate (Worku
    et al., 2018).


    # 2.8 CONCLUSION


    Globally, improving water infrastructure is necessary, since water conservation
    is crucial to securing a reliable supply of clean water. Water is an essential
    resource not only for the survival of all species, but also for human economic
    growth. Large volume of wastewater is produced from agriculture, households and
    industries. Wastewater reuse has been identified as an attractive solution to
    the global problem of water shortage. Wastewater can be reused after treatment
    for different beneficial purposes. Wastewater that has been properly treated for
    drinkable purpose provides a new source of water. Furthermore, adoption of wastewater
    remediation can ease global water shortages while promoting clean water supply
    and protecting the environment.


