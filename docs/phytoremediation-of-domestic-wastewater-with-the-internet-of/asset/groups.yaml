    of the samples were placed in the turbidimeter and the readings were recorded.
    This procedure was repeated thrice for each sample and the average outcome was
    recorded.


    #  6.2.4 DETERMINATION OF BOD₅


    The difference in the water samples before and after 5days of incubation is used
    to determine the BOD in water (Aiyikaike et al., 2019). DO meter with model HQ40d
    (HACH, Loveland, Co., USA) portable analyser as described by the dilution method
    (8043) was used to measure the DO of the samples. The samples were prepared by
    adding 15 mL of the sample bottle and the aerated solution of BOD nutrient was
    added up to the mark of 300mL. Thereafter, the probe of the DO meter was inserted
    in the sample and stirred, the meter was set to measure the DO and the procedure
    was repeated thrice to get a constant reading before recording. Furthermore, the
    samples were incubated at 20°C for 5 days (IS: 3025 P44) and the DO measurement
    was repeated as DOfinal. The BOD concentration was obtained using Equation 6.1
    (APHA, 2005):


