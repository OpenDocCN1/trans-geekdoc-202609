    SVM 通过使用结构风险最小化（SRM）归纳原理实现了高泛泛化能力（Vapnik, 1998）。SVM 是一种用于回归和二分类的监督学习算法。它们属于一类被称为核方法的机器学习技术，有时也称为核机。SVM
    最初设计用于解决分类问题，但其应用已扩展到用于函数估计的回归类应用（Raghavendra & Deka, 2014）。SVM 与多层感知器（MLP）和径向基函数（RBF）相似，因为网络权重通过求解带有线性不等式约束的二次规划获得（Dibike
    等人，2000）。


    尽管 SVM 仅使用时间较短，但已被证明是不同领域回归和分类的可靠且胜任的算法。SVM 在回归中用于从一组输入变量中估计单个输出变量（Khan & Couliblay,
    2006）。该技术的优点是 SVM 的预测准确性优于其他方法，包括决策树、最近邻和神经网络。此外，SVM 算法涉及费尔马原理（1638）、拉格朗日原理（1788）和库恩-泰库勒原理（1951）的应用（Raghavendra
    & Deka, 2014）。此外，可以通过基本概念更好地理解 SVM 算法：软边界 SVM、硬边界 SVM、核函数和超平面（Raghavendra & Deka,
