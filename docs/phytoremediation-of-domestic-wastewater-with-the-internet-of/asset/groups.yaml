    the stored nutrients into the environment (Ting et al., 2018). However, phytoremediation
    is limited to the depth and surface area occupied by the plants, slow growth and
    the increasing time required for biomass generation. Additionally, it is not possible
    to completely prevent contaminant leaching into groundwater using plant-based
    remediation systems. The toxicity of contaminated land and the general condition
    of the soil can have impact on plant survival.


    ## 4.3 MECHANISMS OF PHTOREMEDIATION


    The mechanisms of phytoremediation can be categorized into phytegradation, phytoextraction,
    phytostabilization, phytovolatilization and rhizofiltration (Ting et al., 2018).
    The description of each type of mechanism is presented in Table 4.1 and Figure
    4.1. Additionally, Table 4.2 outlines the advantages and drawbacks of phytoremediation
    methods used in the treatment of wastewater.


    ## 4.4 THE ROLES OF AQUATIC PLANTS IN PHTOREMEDIATION OF WASTEWATER


    The effectiveness of macrophytes in treating contaminants is dependent on the
    concentration of the pollutants, retention time, plant features (root system and
    species) and environmental factors (temperature, pH) (Anand et al., 2017). Besides,
    submerged plants (Ruppia maritima, Egeria densa, Myophyllum aquaticum, Najas marina,
    Hyrophila corymbosa, Vallisneria americana, Hydrilla verticulata and Marina),
    emergent plants (Typha spp., Justicia americana, Distichlis spart., Phagmites
    australis, Imperata littoral, Cyperus spp., Nymphaea spp., Hydrochla carinensis,
    Nuphar lutea, Iris virginica and Diosantia virgiana) and free-floating macrophytes
    (Riccia fluctuans, Spirodela polyrhiza, Pistia stratiotes, Landoltia punctata,
    Salvinia molesta, Marsella mutica, Lemma spp., Azolla pinnata and Eichhornia crassipes)
    have been utilized in remediation of wastewater (Ekuperi et al., 2019; USDA, 2019).
    In this context, the available records for macrophyte species that have been used
    in phytoremediation of agricultural, industrial and domestic wastewater are presented
    in Tables 4.3 and 4.4.


    ## Cultivation of Aquatic Plants for Wastewater Treatment


    ### TABLE 4.1

    Mechanisms of Phytoremediation


    | Techniques | Mechanisms | Advantages |

    |---|---|---|

    | Phytegradation | Plants and microorganisms either convert or destroy organic
    pollutants into non-toxic compounds within the rhizosphere or plant tissues. |
    Waste reduction and biomass generation for bioenergy production. |

    | Phytoextraction | It is a natural process through which plants absorb, translocate
    and accumulate organic inorganic substances from the environment. Plant roots
    absorb pollutants along with nutrients and water. The pollutants are not destroyed
    but stored in the leaves and shoots of the plants. | The removal of contaminants
    is economical and permanent. |

    | Phytostabilization | Heavy metals and other contaminants are immobilized in
    the soil via sorption by roots, precipitation and complexation instead of decomposition.
    | Prevents soil erosion, and no need for disposal of hazardous waste. |

    | Phytovolatilization | Contaminants are absorbed by plants and transpired through
    the xylem, where they are further converted into volatile forms and released into
    the environment as gaseous chemicals through the leaves. Phytovolatilization method
    can be used to remove heavy metals and organic contaminants from the environment.
    | Pollutants can be directly discharged into the atmosphere |

    | Rhizofiltration | Pollutants are absorbed through the root surface, precipitated
    in the root zone or other plant components. | Pollutants are retained in the roots
    after in situ and ex situ application. |


