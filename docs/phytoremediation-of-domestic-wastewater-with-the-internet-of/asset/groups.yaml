    sp.*）和水龟菜对纺织缝纫污染染料、铅、铜和铁的植物修复性能，实验持续了 7 天。由于资源脉冲会影响大型植物种的代谢、生长模式、生理和生态（Tan 等人，2019），因此未记录剑浮萍的化学计量稳态指数以及资源脉冲的影响。因此，应当考虑剑浮萍在植物修复过程中的代谢、生理和优化。然而，这可能取决于废水的类型，因为废水中含有含有污染物和营养物质的混合物。高生物量包含约
