    ## 3.3 高产藻池


    高产藻池（HRAPs）被描述为用于产生生物燃料的浅水水池（Craig et al., 2014）。高产藻池由于其在废水处理中的潜力受到了重新关注（Young
    et al.（Atia, 2016）。此外，高产藻池需要巨大的表面积来处理生物燃料（Atia, 2016）。因此，光生物反应器（PBR）在封闭系统中是可持续的（Atia,
    2016）。此外，光生物反应器（PBR）可以用于封闭系统。


    Arashiro 等人（2019）评估了废水处理中高产藻池的有效性，并关注了光生物反应器（PBR）在其中的应用。高产藻池在初始阶段用于藻类培养（Arashiro
    et al., 2019）。尽管微藻衍物生物燃料具有许多优势，但由于许多阻碍因素，无法通过高产藻池实现生物质生产（Arashiro et al., 2019）。在这方面，使用光生物反应器（PBR）等技术的高产藻池将在文中详细介绍。因此，不使用光生物反应器进行废水处理将不会影响效率，反而可以减少维护成本和足迹。


    ## 3.4 光生物反应器（PBRs）与膜生物反应器（MBRs）


    在生长过程中使用的反应器类型是影响微藻产率的主要变量之一。不同的光生物反应器分类为平板式、柱式、膜式光生物反应器（Moreno-Garcia et al.,
    2017）。与开放系统相比，在光生物反应器中培养微藻需要投入照明、循环系统、培养基和二氧化碳，但由于其污染率低，更容易维护。


    最近，膜生物反应器（MBRs）用于废水处理受到了广泛关注（Di Bella et al., 2018; Mannina et al., 2017a）。MBR
    应用了集成选择膜生物工艺来实现最终固液分离。通常，MBR 提供优良的水质、体积负荷率、低足迹和长污泥留存时间，在废水处理固液分离方面表现出色（Collivarginelli
    et al., 2016）。此外，MBR 具有良好的固固能力，允许以较高的生物质浓度运行，从而可以使用较小的反应器并最小化足迹需求。然而，膜堵塞是 MBR
    操作的主要缺点（Cosenza et al., 2013; Xiong et al., 2016）。膜曝气导致的高能耗也是 MBR 的缺点（Mannina
    et al., 2017b）。


