    such as regression and time series problems, clustering and classification and
    web ranking algorithm (Kazieno et al., 2013). The fundamental element of ensemble
    learning is the base learner, which is generated using a base learning algorithm.
    The general formula for ensemble learning is presented in Equation 8.3 (Kazieno
    et al., 2013).


    $$P_{e}(x) = \sum_{i=1}^{n} p_{i}(x)$$


    where $p(x)$ and $P_{e}(x)$ represent single predictor and ensemble with $n$ total
    number of predictors.


    ## Machine Learning Techniques in Water Quality Monitoring


    Training Set


