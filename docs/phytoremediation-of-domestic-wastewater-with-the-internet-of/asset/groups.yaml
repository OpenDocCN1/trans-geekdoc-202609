    # Solving the Shortage of Clean Water through Wastewater Treatment


    ## 2.1 INTRODUCTION


    Wastewater treatment is primarily concerned with the protection of public health
    and environment. In the past, there was no specific method for wastewater treatment.
    As an alternative, wastewater from buildings was channelled into canals and gutters,
    where it was finally transferred into bodies of water as streams, lakes and sea
    (Cisneros et al., 2018). This natural treatment method based on dilution was sufficient
    due to lower population density and industrial activities, which resulted in the
    release of severe pollution load into the environment compared to present times.
    Localities that rely on water for drinking and other domestic use frequently suffer
    eutrophication and disease epidemics (Jasim, 2020). Additionally, it has been
    shown that wastewater contains significant concentrations of organic contaminants,
    necessitating the adoption of extra treatment stages and control mechanisms (Armah
    et al., 2020). Furthermore, wastewater treatment plants (WWTPs) are designed to
    ensure that the effluent is free from pollutants such as biochemical oxygen demand
    (BOD), suspended solids (TSS) and chemical oxygen demand (COD) (Jasim, 2020).
    Advances in research have led to the introduction of new approaches in removing
    excess nutrients from wastewater (Al-Ghouti et al., 2019). Among them, the conventional
    treatment techniques are characterized by high energy consumption, long processes,
    carbon emission, odour, high cost of sludge discharge and high cost. These act
    as barriers to the development of sustainable growth in wastewater treatment (Li
    et al., 2019; Sun et al., 2016). On the contrary, biological methods feature ecologically
    natural treatment systems due to their cost-effectiveness, process flexibility
    (energy-efficient/solar-driven) and environmentally friendly advantages compared
    to other treatment methods (Ma et al., 2016; Zhu et al., 2008). The view of a
    wastewater treatment plant (WWTP) is shown in Figure 2.1.


    ## 2.2 CONVENTIONAL SEWAGE TREATMENT TECHNOLOGY


    Conventional wastewater treatment involves the removal of colloidal bacteria,
    suspended solids, biochemical oxygen demand (BOD), and nutrients such as phosphorous,
    nitrate-nitrogen, nitrite-nitrogen and ammonia-nitrogen from wastewater. BOD can
    be removed through the oxidation of organic matter to water


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_22_0.png)


    **FIGURE 2.1** View of wastewater treatment plant (WWTP).


    and $CO_2$ by microorganisms (Jasim, 2020). At the same time, suspended solids
    are primarily eliminated through physical sedimentation. Similarly, the removal
    of dissolved nitrogen is essential in wastewater treatment. However, wastewater
    treatment is divided into preliminary, secondary and tertiary (Asiwal et al.,
    2016). The stages of preliminary and secondary are presented in the next section.


    ## 2.3 PRELIMINARY TREATMENT OF WASTEWATER


    In the preliminary phase of wastewater, solid debris are removed. The sewage is
    passed through chambers to remove floating debris, and at regular intervals, the
    built-up waste is scraped off (Jasim, 2020).


    ## 2.4 PRIMARY TREATMENT OF WASTEWATER


    In the primary stage, the wastewater is transferred to sedimentation tanks to
    remove settleable solids by gravity. A sedimentation tank can be used in the removal
    of BOD (Singh et al., 2021).


    ## 2.5 SECONDARY TREATMENT OF WASTEWATER


    Secondary treatment of wastewater tends to reduce the BOD concentration by removing
    organic materials. This is accomplished mostly through a heterotrophic population
    that uses constituents for energy and growth. Biofilms are bonded to a fixed surface
    in the biofilm reactors and the organic molecules are absorbed and broken down
    aerobically. Whereas in dispersed form, microorganism growth rates are allowed
    to mix freely with the wastewater and are retained in suspension by mechanical
    agitation during the treatment process. Numerous researchers have demonstrated
    that biological systems can eliminate over 90% of pollutants present in wastewater.


    ## 2.6 TERTIARY TREATMENT OF WASTEWATER


    The tertiary treatment method was designed to completely eliminate all organic
    compounds through chemical or biological methods (Jimin, 2020). Modern treatment
    techniques are complex procedures such as carbon adsorption, chemical precipitation,
    reverse osmosis or ozonation. These approaches include those that target specific
    nutrients, such as phosphorus or nitrogen. Therefore, primary and secondary treatment
    methods are used in WWTPs to remove organic waste and easily settled contaminants.
    However, due to the discharge of metals and refractory organics, the secondary
    treatment effluent is laden with phosphorus and inorganic nitrogen contributing
    to eutrophication and other long-term concerns (Abdel-Raouf et al., 2012).


    ## 2.7 BIOLOGICAL METHOD OF WASTEWATER TREATMENT


    Over the last 50 years, different methods for abatement of pollution have been
    introduced. Since the last two decades, researchers have been concerned about
    the possibility of using macrophytes in the biological treatment of wastewater
    (Moore et al., 2009). These approaches, which favour biological-based treatment
    over traditional procedures, are supported by government regulations and popular
    opinion (Ekperusi et al., 2019). Anaerobic treatment, Anammox technology, algal

