    is highly complicated, dynamic and non-stationary.


    # 7.3 HARDWARE DESIGN OF THE ARDUINO IoT SYSTEM


    Arduino is an open source software and hardware application that excels in interpret-
    and analysing data from a variety of sources to carry out programmed operations.
    The coding language of the Arduino system is easy to implement in various projects.
    In addition, the Arduino system is inexpensive, capable of managing multiple tasks,
    simplifies complicated tasks and is compatible with all desktop operating systems.
    Furthermore, the software and hardware of the Arduino systems are constantly expanded
    and enhanced with code libraries and third-party bodies. The Arduino code is separated
    into three sections; variables are defined and third-party libraries are incorporated
    at the start of the code. The set-up, which in the second section, commands the
    information sources used in the code to start. The last section is called the
    loop, which controls and runs the code. Furthermore, the Arduino board consists
    of sensor nodes made of PIC microcontroller, liquid crystal display (LCD) and
    sim card, which are used in determining the water level, turbidity, total dissolved
    solid (TDS), temperature, oxidation reduction potential (ORP), pH and gases. The
    Arduino UNO is connected to the internet through an external Wi-Fi module while
    the sensors are placed in the water samples. The information gathered by the sensors
    is shown on the LCD and transmitted to the Open Source IoT Website on computer
    (Piyadharsini et al., 2018). Geetha and Gouthami (2017) developed a smart water
    quality monitoring system coupled with Wi-Fi module controller to measure the
    conductivity, pH and turbidity of water samples. Furthermore, Qin et al. (2018)
    designed an electrochemically modified water monitoring device consisting of probes
    with inkjet-printed pH, temperature and chlorine sensors. Figure 7.1 illustrates
    the connection diagram of IoT system.


    # 7.4 SENSOR NODES OF THE ARDUINO IoT SYSTEM


    # 7.4.1 TEMPERATURE SENSOR


    DF Robot sensor is mostly used in measuring the temperature of the surrounding.
    Temperature sensors are classified into different categories, including thermometers,
    register temperature detectors, thermocouples, infrared semiconductors, solid-state
    temperature sensors and thermistors. The sensing capability of these sensors varies
    from one sensor to the other (Paul, 2018). A thermistor is made up of resistor
    that varies with temperature. Due to its resistive nature, the voltage across
    the terminals must be read using an excitation source. In most cases, thermistor'
