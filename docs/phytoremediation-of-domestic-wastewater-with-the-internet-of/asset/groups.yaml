    ### 8.2 水处理中的机器学习 (ML) 概念


    人工智能（AI）是计算机科学的一个分支，涉及人类智能。机器学习（ML）是 AI 的一个分支，应用数据进行分类、模式识别和预测。AI 方法已成功应用于水处理，原因是其简单、准确且速度快。机器学习分为监督学习和无监督学习。监督学习用于建立输入与输出值之间的关系，而无监督学习不提供结果。


    ### 8.3 人工神经网络 (ANN)


    人工神经网络是一种通过突触权重过程处理信息的数学模型。通常，神经网络由紧密耦合的单元组成，以类似于神经系统的方式分析数据。神经网络的发展包括数据的收集和预处理、处理、训练和测试、数据划分、输入选择、激活函数和学习算法。激活函数可以是线性的、正切、高斯或逻辑的，取决于所选的学习算法和缩放技术。最常应用于水质和废水监测的激活函数是正切函数和逻辑函数。此外，由于其极的适应性、改进的输入输出映射、容错、非线性和自学习特性，ANN
    可以应用于新的函数近似范式。


