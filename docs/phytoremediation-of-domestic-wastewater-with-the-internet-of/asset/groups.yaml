    # Cultivation of Aquatic Plants for Wastewater Treatment


    sole representative of the Pistiodea subfamily of Araceae. The diversity of this
    tax-onomically unique species, which is the only free-floating aquatic plant,
    is shown by the many synonyms and outdated sub-specific names (Neuenschwander
    et al., 2009). The detailed taxonomy of P. stratiotes is presented in Table 4.


    # 4.5.1.3 Description of P. stratiotes


    P. stratiotes is a freshwater herb characterized by dense, succulent buds, thick
    sto-lon, translucent, and fibrous roots. The plants are round in shape with height
    and width of 6-12 and 5 cm, respectively. They float on the surface of water,
    with their roots underneath the floating leaves. Additionally, they are pale green
    in colour, with parallel veins and edges, and are coated in small hairs that create
    basket-like structures that trap bubbles, hence increasing the resist-ance of
    the plants. The flowers are covered in the centre of the plants and are die-ous.
    Upon successful fertilization, small green berries developed (Akobundu & Agyakura,
    1998).


    # 4.5.1.4 Growth of P. stratiotes


    P. stratiotes is an evergreen perennial plant that naturally forms large floating
    colonies in tropical and subtropical waterways (Lima et al., 2013). The temperature
    resist-ance of P. stratiotes ranges from 15°C to 35°C, while the maximum temperature
    ranges from 22°C to 30°C and pH of 6.5–7.2 (Rivers, 2002). However, P. stratiotes
    is vulnerable to frost and can resist salt concentrations of 1.6% and above CABI,
    2019). P. stratiotes exhibits asexual reproduction, which is prone to break and
    propagation of the buds, seeds, or stolon. The seeds are easily transported by
    water across great distances as they float during the first 2 days of maturity.
    A short stolon connects the mother and daughter plants, forming thick mats. Typically,
    develop-ment (growth) usually occurs with the formation of smaller daughter plants
    con-nected to the original growth by stolon (Labrada & Fornasari, 2002). The diagram
    displaying the leaves of P. stratiotes is presented in Figure 4.


