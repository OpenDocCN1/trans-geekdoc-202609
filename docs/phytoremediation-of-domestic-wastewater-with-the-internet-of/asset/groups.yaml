    图 8.6 SAE 的结构。


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_117_1.png)

    图 8.7 WAE 的结构。


    此外，集成学习分为简单平均集成（SAE）、加权平均集成（WAE）和非线性神经网络集成（NNE）。SAE、WAE 和 NNE 的结构分别如图 8.6、8.7
    和 8.8 所示。


    ## 8.8 用于废水植物修复的 ANN、SVM、ANFIS 和 MLR 的开发


    本节介绍了 ANN、SVM、ANFIS 和 MLR 在废水植物修复中的最新应用。根据之前的工作发现，机器学习技术（ANN、SVM 和 ANFIS）由于在预测涉及大量变量的水质参数方面具有卓越的性能，在复杂废水处理系统的建模中变得越来越流行。此外，可以使用不同的机器学习模型，例如
    Kumar 和 Deswal（2020b）使用 LR、ANN、RF 和 MSP 来预测四种水生植物的磷去除情况。因此，Nadiri 等（2018）报告说，应用不同的机器学习进行水质参数的预测和预测将允许比使用单一机器学习模型更稳健的对比研究。


    Guo 等（2015）的研究局限于使用 MATLAB 软件两种机器学习模型（ANN 和 SVM）和三个性能标准来预测污水处理厂（WWTP）出水总氮（TN）的浓度。数据被归一化为
    1 和 -1，而 Darajah 等（2017）、Elfansi 等（2017）和 Parveen 等（2019）在他们的研究中仅使用了一个模型。Titah
    等（2018）采用响应面法（RSM）和 ANN 方法研究了八叶水藻（Ludwigia octovalis）对砷吸收的植物修复。此外，Nourani 等（2018）应用了四种机器学习模型（FFNN、SVM、MLR
    和 ANNFIS 方法）预测尼科西亚污水处理厂的水质指标（TN、BOD 和 COD）。观察到由于模糊概念处理过程不确定性的能力，ANNFIS 优于所有其他模型。


    Vo 等（2019）和 Kumar 等（2019）在他们的研究中探索了不同的回归模型。相比之下，Farzi 和 Borghei（2019）以及 Kumar
    等（2021）结合了回归和机器学习模型。此外，Kumar 和 Deswal（2020a）对随机森林（RF）和 ANN 进行了研究。


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_118_0.png)

    图 8.8 NNE 的结构。


    ## 8.9 结论


    本章讨论了用于水质监测的 ANN、SVM、ANFIS 和 MLR 的开发。


