    \ accuracy (Cloete et al., 2016). The DF Robot temperature sensor is shown in\
    \ Figure 7.2.\n\n## Water Quality Monitoring Using Internet of Things (IoT)\n\n\
    ### 7.5 LIQUID CRYSTAL DISPLAY (LCD)\n\nLCD is an output device for displaying\
    \ information, such as text, images, or video. It is commonly used in electronic\
    \ devices like calculators, watches, and mobile phones. The LCD works by using\
    \ liquid crystals to block or pass light. The liquid crystals are controlled by\
    \ an electric field, which changes their orientation and allows light to pass\
    \ through. The LCD is composed of a grid of pixels, each of which can be turned\
    \ on or off. The pixels are arranged in rows and columns, and the information\
    \ is formed by the state of these pixels. The LCD is used in a wide variety of\
    \ applications because of its low power consumption and clear display. In this\
    \ project, the LCD is used to display the water quality parameters measured by\
    \ the sensors. The LCD is connected to the Arduino via I2C communication, which\
    \ simplifies the wiring. The LCD is shown in Figure 7.5. \n\n![](img/144ee7fe73d0b07144cc2acec5d1c144_105_0.png)\n\
    \nFIGURE 7.5 Total solids (TDS).\n\n![](img/144ee7fe73d0b07144cc2acec5d1c144_105_1.png)\n\
    \nFIGURE 7.6 Liquid crystal.\n\n## WI-FI MODULE\n\nWi-Fi is a wireless technology\
    \ that allows devices to connect to the internet. It is used in a wide variety\
    \ of devices, including laptops, smartphones, and IoT devices. The Wi-Fi module\
    \ is a component that provides Wi-Fi connectivity to a device, allowing it to\
    \ communicate with an access point. The Wi-Fi module is used in this project to\
    \ transmit the water quality data to the internet. The Wi-Fi module is connected\
    \ to the Arduino via serial communication. The Wi-Fi module is shown in Figure\
    \ 7.7.\n\n![](img/144ee7fe73d0b07144cc2acec5d1c144_106_0.png)\n\nFIGURE 7.7 Wi-Fi\
    \ module.\n\n## GSM MODULE\n\nGSM is a communication standard that allows devices\
    \ to communicate over cellular networks. It is used in a wide variety of devices,\
    \ including mobile phones and IoT devices. The GSM module is a component that\
    \ provides GSM connectivity to a device, allowing it to communicate with a cellular\
    \ network. The GSM module is used in this project to transmit the water quality\
    \ data to the internet. The GSM module is connected to the Arduino via serial\
    \ communication. The GSM module is shown in Figure 7.8.\n\n![](img/144ee7fe73d0b07144cc2acec5d1c144_106_1.png)\n\
    \nFIGURE 7.8 Arduino board.\n\n## Water Quality Monitoring Using Internet of Things\
    \ (IoT)\n\nEdit Sketch Help\n\n![](img/144ee7fe73d0b07144cc2acec5d1c144_107_0.png)\n\
    \n```cpp\n/*\nProject: IOT with SIM7600\nBoard: Arduino\n*/\n\n#define TX 8\n\
    #define RX 5\n#define PNR 6\n#define TemperaturePin A0\n#define HumidityPin //\
    \ meter output\n#define YRES // analog reference value(Volt)\n#define COUNT 500\
    \ // sum of sample\n#define VOLTAGE A3 // number of samples\n#define OFFSET 0\
    \ // system voltage\n#define ArrayLength 40 \n#define Interval 60\n\n#include\
    \ <SoftwareSerial.h>\n#include <LiquidCrystal_I2C.h>\n\nSoftwareSerial sim7600(TX,RX);\n\
    LiquidCrystal_I2C lcd(0x27,16,2);\n\nvoid setup() {\n  MODE_BAUD;\n  MODE_IF;\n\
    \  MODE_CONNECT;\n  MODE_INIT;\n  MODE_SETTING;\n  MODE_YIELDS;\n}\n```\n\n##\
    \ 7.8 CODING DEVELOPMENT OF THE IoT System (IDE)\n\nThe Arduino integrated development\
    \ environment is used in writing and uploading the code into the microcontroller.\
    \ Arduino code is also called sketches. The sketch is processed and assembled\
    \ into C++ and includes a number of custom methods and functions. The environment\
    \ is Arduino code compilation, it is uploaded to the board memory. The IDE and\
    \ sketch (codes) are shown in Figure 7.9.\n\n## 7.9 CONCLUSION\n\nIoT systems\
    \ have been used in several industries for control functions and process monitoring.\
    \ IoT-based water quality monitoring is superior to traditional methods because\
    \ it is eco-friendly, fast, cheap and does not require harmful chemicals. Furthermore,\
    \ the incorporation of IoT systems in wastewater treatment systems as phytiation\
    \ would enable efficient monitoring of nutrient uptake and early detection of\
    \ contamination. Additionally, the application of IoT devices in water quality\
    \ monitoring would act as a big leap for researchers, government agencies and\
    \ stakeholders in reporting, regulating and policy making of waste discharge laws\
    \ that would safeguard natural water bodies.\n"
