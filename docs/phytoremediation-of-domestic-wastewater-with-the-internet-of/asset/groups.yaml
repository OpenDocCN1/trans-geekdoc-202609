    # #5 水培系统中的废水植物修复


    ## 5.1 引言


    水培培养系统可以被描述为一种无土壤植物栽培技术（Aires, 2018）。水培池可用于在富含营养的废水中水生植物。这种方法被认为是废水植物修复的关键阶段，其中植物会分解废水中的过量存在物（Norström
    et al., 2004）。因此，水培系统的应用将促进一种有效废水管理的可持续方法（Baddadi et al., 2019）。水培系统根据营养供给的类型进行分类（Hussain
    et al., 2014）。此外，它们可以分为两大类：营养液系统和不需要基质的水培系统（Cooper, 1979）。基于基质的培养方法能够使根系锚定，并作为微生物附着的介质以及水-营养循环的飞轮（Magwaza
    et al., 2020）。


    此外，光照、植物、废水成分和微生物生长等因素对水培系统中废有效处理和生物量的生产起着重要作用。植物根系通过产生作为细菌食物的代谢物来促进微生物的生长，增强生物废水处理中硝化和反硝化过程的速率（Magwaza
    et al., 2020）。此外，利用废水的水培培养将促进作物和生物量的低成本栽培，确保粮食安全并为弱势群体创造收入（Snow et al., 2008）。


    ## 5.2 废水处理中水培系统的概览


    水培源于希腊语单词“hydro”（水）和“ponos”（劳动）。在大多数情况下，水培系统通常用于废水的的三级处理（Yang et al., 2015）。用于废水处理的水培系统的建设需要一种多学科的方法，结合了土木工程、生物学、化学和生物化学领域的设计原则。此外，设计中引入了温室以增强生物处理系统。温室的主要目的是通过保护植物免受恶劣天气（包括温度、过度降水和强风）提供有利于植物生长的气候条件。


    温室的主要目标是创建生态友好条件，保护培养植物免受风、温度和降水等不利天气因素的影响。然后，最好补充阳光、能量和CO2以增加产量，特别是在冬季季节。然而，研究发现与废水处理水培设计相关的若干设计因素阻碍了建设标准（Magwaza
    et al., 2020）。此外，使用水培系统处理废水涉及植物根、微生物和营养物质之间相互作用的生物、化学和物理过程。这些系统类似于人工湿地（Wetipat,
    2008）。此外，与人工湿地相比，水培系统用于废水修复更具可持续性、经济效益且环保。与水培系统不同，人工湿地处理系统利用经济价值极的植物来分解废水中的污染物（Vaillant
    et al., 2003）。此外，水培系统易于维护，耗能较低，并可以在小空间内实施（Abe et al., 2010）。


    ## 5.3 水生植物的营养回收


    三级处理可用于抛光经过传统处理方法一级和二级阶段的废水。出水的三级处理是二级处理之后的额外步骤进展，旨在进一步减少水中磷、氮、金属、有机物、磷酸盐和浊度。简而言之，当废水用于饮用、农业和娱乐目的时，对污水进行三级处理（Garba
    & Pepper, 2015）。此外，植物通过根部供应氧气起着重要作用，这有助于导致污染物降解的过程（Stewart et al., 2008）。这些过程包括处理系统中的营养物质和重金属吸收、反硝化和硝化，以及其他生物过程。


    此外，通过挥发作用吸收无机和有机污染物是营养吸收的关键过程（Stewart et al., 2008）。因此，挺生、沉水和浮生植物被用于减少不同类型的废水污染物（Murad
    et al., 2014）。水培培养使植物积累了大量的磷酸盐、硝酸盐、氨、活性化合物和毒性（Sharma & Gaur, 1995）。植物植物通过根系释放氧气，为硝化的发生提供好氧条件。


    ## 5.4 案例研究：废水中植物的培养演示


    利用水培系统进行水生植物培养涉及多个阶段。这些阶段将在后续章节描述。


    ### 5.4.1 培养区域


    植物的培养使用实验室规模的水培系统进行。培养区域位于马来西亚雪兰莪加厂（2°58''04" N, 101°43''35" E）。环境的年平均温度为27°C。此外，污水处理厂被分为不同的室，废水在那里经过一级和二级处理。


    ### 5.4.2 实验设置


    建立了四个尺寸为670 mm（长）×420 mm（宽）×220 mm（深）的矩形水培池用于培养植物。在池中心放置了一块6mm厚的玻璃作为托架和隔板，将进流分开。连接到距离40米外电源的数字定时器和潜水泵调节固定停留时间的流入和出水。此外，一个带有直径10-15
    mm的20个孔的可拆卸托盘板用于垂直固定植物。


    ### 5.4.3 植物样品来源


    *P. stratiotes*和*E. crassipes*植物在研究场地的范围内获得，而*S. molesta*植物则从加厂的MRB苗圃收集。在将植物放入每个构建的处理系统之前，用水清洗以去除杂质。


    ### 5.4.4 植物培养方法


    所选植物根据Kutty等（2009）和Rezania等（2015）报道的方法进行培养，并对适应期和停留时间进行了调整。植物分三个阶段培养。第一阶段，将100g新鲜的*P.
    stratiotes*、*S. molesta*和*E. crassipes*在含有二级处理水样的独立水培箱中培养。在采样研究之前，让植物在系统中适应5天。


