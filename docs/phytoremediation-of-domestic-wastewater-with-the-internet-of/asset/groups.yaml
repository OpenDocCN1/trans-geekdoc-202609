    ## 4.5.2 SALVINIA MOLESTA PLANTS


    Salvinia molesta D.S. Mitchell commonly called Salvinia or giant salvinia is an
    aquatic plant of the Salvinaceae family. Salvinia was derived from Antonio M.
    Salvinia, while molesta is a Greek term for irritation, tolerance or nuisance
    (Nelson, 2009. 2009). S. molesta has a high nutrient absorption capacity of 8mg/g
    of plant tissue per day.


    ### 4.5.2.1 Distribution of S. molesta


    S. molesta is an ancient plant that originates from Southeastern Brazil and has
    existed for over 70 years. It was initially discovered outside the territory of
    Sri Lanka in 1939. S. molesta rapidly became a general weed issue in Sri Lanka
    that plagues paddies, decreases flow in water system (irrigation) and blocks transportation
    canal routes. Globally, S. molesta was considered one of the most harmful weeds
    (McFarland et al., 2004; Pérez-Consuegera et al., 2017). Furthermore, the plant
    was mainly found in tropical and subtropical regions of over 20 countries including
    Malaysia, Indonesia, Africa, Papua New Guinea, India, Singapore, Australia, Trinidad,
    Guyana, Zealand, Philippines, Fiji, Columbia and Madagascar (McFarland et al.,
    2004; Pérez-Consuegera et al., 2017).


    ### 4.5.2.2 Taxonomy of S. molesta


    S. molesta belongs to a monogeneric family. The plant was originally thought to
    be a subspecies of S. auriculata. However, it reclassified in 1972 based on fruiting
    bodies or male sporocarps (Nelson, 2009). There are 12 species of S. molesta,
    seven of which originate from the new world. The detailed taxonomy of S. molesta
    is presented in Table 4.6.


    #### TABLE 4.6

    #### Taxonomy of S. molesta


    | Domain | Eukaryote |

    | :--- | :--- |

    | Kingdom Plantae | Subkingdom Tracheobionta |

    | Phylum Pteridophyta | Class Liliopsida |

    | Order Hydroperteridales | Family Salviniaceae |

    | Genera | Water spangles, African pyg, water moss, giant salvinia, Australian
    azolla., Kariba weed, water fern (McFarland et al., 2004; Ramachandra et al.,
    2017) |

    | Species | S. molesta, S. oblongifolia, S. natan, S. cucullata (Nagalingam et
    al., 2008; Pérez-Consuegera et al., 2017), S. hergozi, S. minima Baker, S. liboda
    Raddi, S. radula, S. auriculata, S. sprucei (Avila & Funk, 2016), S. hastata Desv;
    S. martyni Spruce (McFarland et al., 2004) |


    ### 4.5.2.3 Description of S. molesta


    S. molesta is made up of fronds that come in whorls of three leaves, with the
    first being rooted, buoyant and emergent, and the third leaf is submerged and
    separated to root. The buoyant fronds are arranged in oblong form, while the matured
    plants develop in the form of eggs. Additionally, the top surface contains linear
    papillae, which is composed of four hairs at the distal end that are connected
    at their tips to create an inverted bladder. The cage-like structure of the end
    is an active trap that enables the plant to be resistant in water. The upper surface,
    papillae and end hairs of the plants are waterproof, while the lower layer of
    the plants has an affinity for water. Over, the plant exhibits considerable variation
    in response to environmental factors such as available space, availability of
    nutrient and habitat. Additionally, it varies in size from less than 1.5 to 6
    cm (GISD, 2005; Piter et al., 2003). Figure 4.3 presents the diagram of S. molesta
    leaves.


    ### 4.5.2.4 Growth of S. molesta


    The growth of S. molesta depends on several factors including temperature, pH,
    nutrients and salinity (Madsen & Wersal, 2008). In proper conditions, S. molesta
    are prevalent as the plants can double in biomass within a period of 2–3 days
    due to asexual reproduction. The plants thrive at pH levels between 5–8. S. molesta
    can withstand temperatures between 5°C and 40°C (Madsen & Wersal, 2008). However,
    they perish within hours of exposure to temperatures below 5°C or above 43°C.
    In addition to this, they are sensitive to changes in nutrients. discharge of
    agricultural effluents into rivers and streams increases the possibility of high
    yield of these plants as any increase in nutrient availability will significantly
    impact the plant growth. Likewise, the development of S. molesta is heavily restricted
    by salinity (Madsen & Wersal, 2008).


    ### 4.5.2.5 Nutrient Uptake by S. molesta Plants in Phytoremediation of Wastewater


    S. molesta is a macrophyte that has been used in wastewater phytoremediation because
    of its rapid growth and potential to break down contaminants in wastewater (Hariyadi
    et al., 2013; Kumari et al., 2017). Pavithra and Kousar (2016) investigated the
    effectiveness of S. molesta in remediation of textile sewing. WQ et al. (2017)
    analysed the potentials of giant salvinia in remediation of wastewater for 16
    days. Physicochemical parameters including turbidity, COD, NO3, PO3⁻, and NH4⁺
    were performed on the treated wastewater. The outcome of the research showed that
    the excess nutrients present in the wastewater were lower to 0.50 mg/L NO3, 0.17
    mg/L (95%) PO3⁻, and 2.62 mg/L NH4+. Macophytes could store and absorb phosphorus,
    and their development rate is dependent on the phosphorus content in the wastewater.
    Abeyawardhana et al. (2017) employed S. molesta and L. gibba in the remediation
    of industrial wastewater. WQ analysis was conducted on the wastewater at a detention
    time of 24 hours. The results demonstrated that up to 72.63%, 73.44% TN, 74.85%
    Pb, 66.39% Ni, 65.2% Fe, 69.81% Cu and 81.66% Cr was reduced by S. molesta plants.
    Despite the duration of the sampling study not being mentioned by the authors,
    the results of the heavy metals and nutrient reductions at 24 hours detention
    time revealed that S. molesta plants are effective in improving the contaminated
    wastewater. Furthermore, reduction efficiency evaluation is critical, as it has
    accepted as standard criteria for estimating the amount of nutrients removed during
    phytoremediation processes.


    Additionally, Tangandu and Puri (2017) investigated the COD and BOD removal from
    batik wastewater using E. dense and S. molesta plants. It was observed that stress
    conditions were observed in the S. molesta plants on the fourth day of the cultivation
    period. This could be attributed to the exposure of S. molesta in the concentrated
    wastewater, implying that wastewater was hazardous to the plant. Another study,
    Hanafiah et al. (2018) investigated the performance of lettuce and giant salvinia
    in the treatment of wastewater. The findings established the effectiveness of
    S. molesta and P. stratiotes in polishing wastewater.


    Furthermore, da Silva et al. (2018) evaluated the potentials of S. molesta in
    the remediation of polluted wastewater. They also investigated the functions of
    peroxidase, ascorbate peroxidase, catalase and superoxide dismutase in S. molesta
    resistance to arsenite. The results of the study indicated that S. molesta had
    a higher proficiency for reducing toxic effect in the polluted water. Sreekumar
    and John (2018) studied the potentials of giant salvinia in phytoremediation of
    pest water for bioaccumulation of Cd and Zn heavy metals. However, previous research
    failed to investigate the potentials of S. molesta in treatment of domestic wastewater,
