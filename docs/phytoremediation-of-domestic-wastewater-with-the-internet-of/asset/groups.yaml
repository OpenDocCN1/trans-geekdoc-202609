    commercial, industrial, agricultural activities, domestic, storm water or sewer
    infiltration. The composition of wastewater varies to the source. Similarly, wastewater
    is made up of biological, chemical and physical compounds that may have a detrimental
    effect on the water quality, rendering it unfit for human consumption and hazardous
    to aquatic life. Anthropogenic activities from agricultural and domestic activities
    release waste product as ammonia (NH₃), phosphorus (P), nitrate (NO₃) and potassium
    (K) into water bodies. Consequently, this brings eutrophication in the aquatic
    environment (Sukač et al., 2015). Thus, complete recovery or removal of nutrients
    from wastewater should be treated as a fundamental and crucial process before
    disposal into natural bodies to protect natural waters (Hu et al., 2012).


    Furthermore, one of the key components of the 2030 sustainable development goals
    (SDGs) is to improve water quality. The conventional wastewater treatment methods
    which involve multiple processes fail in the complete removal of water pollutants.
    These residues contain certain amount of nutrients (nitrogen, phosphorus and heavy
    metals) and pathogens that cause the spread of diseases such as typhoid, cholera,
    and skin irritation and promote the rapid growth of aquatic plants in rivers and
    lakes (Kutty et al., 2009; Meena et al., 2019). Therefore, the search and exploration
    of affordable and renewable methods of wastewater treatment such as phytoremediation
    has become crucial. The applications of aquatic plants (macrophytes) in phytoremediation
    are not new (Akinbile et al., 2015). Phytoremediation technique uses the plant
    root system in absorbing excess nutrients from wastewater (Nwachukwu & Osuji,
    2007; U et al., 2013). However, the potentials of aquatic plants in phytoremediation
    processes depend on the characteristics and origin of the wastewater (Ng et al.,
    2017). The diagram of wastewater is presented in Figure 1.1.


