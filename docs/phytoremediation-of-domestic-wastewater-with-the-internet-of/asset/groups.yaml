    混合物与大多数柴油储存和分发设备兼容，无需对发动机进行任何改装（Balat, 2011），而较高的混合比例如 B100，被用于许多经过少量或未修改的发动机中（Dembilir,
    2005）。由于生物柴中含有少量的氧气，它改善了燃烧效率并降低了碳氢、烟尘和一氧化碳的排放。与柴油相比，生物柴表现出更好的闪点、芳香族含量、生物降解性、硫含量和更优越的环境可持续性特性（Attia
    & Hassaneen, 2016）。然而，生物柴的价格和纯度取决于制造过程中使用的原料种类。地理位置、季节性作物多样化和原油价格是其他考虑因素。目前，由于对高纯度的需求导致原料成本高昂，生物柴的成本明显高于石油柴油（Mohammed
    et al., 2014）。


    ## 3.2 微藻


    微藻也被称为海藻，是利用二氧化碳进行光合作用的有机体，产生作为生物质的有用物质（Lee & Lavoie, 2013）。据估计，约有 15 万种微藻，分为八门：黄藻门、绿藻门、褐藻门、硅藻门、裸藻门、火藻门、红藻门和金藻门。它们通常生长在营养丰富的海洋环境中，如淡水和海水、市政废水（Zhou
    et al., 2012）、工业废水和动物废水（Hu et al., 2013），这些水体含有足够数量的碳、氮和磷。


    藻类衍物产品的未来目前呈上升趋势。此外，Mehta 等人（2018）假设，到 2024 年，全球对微藻制品的需求约为 14.3 亿美元。此外，普通小球藻和布氏芽杆菌物种含有大量的脂质，表明其在生物柴生产方面具有巨大潜力（Najafi
    et al., 2011）。根据 Chisti（2007）的观点，藻类是唯一的可再生生物燃料来源，预计对环境和全球食品供应链的危害远低于传统的生产生物燃料作物。由于微藻固有的高含脂量、半稳态生产以及适应各种气候的特性，微藻更适合生产生物燃料木质素材料（Miao
    et al., 2004）。微藻生物膜具有高热值、低粘度和低密度的特征，与植物生物燃料相比，它们是更好的燃料（Clarens et al., 2010）。


    微藻可以在开放式或混合系统中进行培养，以生产原料或生物质。开放式系统最具成本效益，但微藻生物膜具有高热值、低粘度和低密度的特征，与植物生物燃料相比，它们是更好的燃料（Clarens
    et al., 2010）（*注：此处原文逻辑似乎有重复，翻译按字意保留*）。...（此处由于原文多处重复提到微藻生物膜和开放式系统，已遵循原文完整翻译）。


