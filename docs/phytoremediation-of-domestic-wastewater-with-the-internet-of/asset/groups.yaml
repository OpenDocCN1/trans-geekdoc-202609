    观察到，模拟 ORP 在 M1 和 M2 中均通过 SVM>ANN>ANFIS>MLR 的机器学习机器学习模型实现了更好的拟合。此外，根据 RMSE 对机器学习模型进行数学比较，ANFIS
    和 ANN 的预测准确性提高了 5%。因此，非线性框揭示了 ORP 模型准确且有值的预测能力。此外，MLR 在 M1 和 M2 模型中表现出的整体不佳性能可归因于基于线性输入-输出关系的机器学习技术。Gaya
