    # 10.5 CONCLUSION


    This research applied ML tools (ANN, SVM, ANFIS and MLR) in modelling and predicting
    of the ORP parameters of S. molea treated wastewater. It was found that both the
    classical and AI-based models were capable of modelling the ORPt. This was proved
    by considering the statistical indicators (R², MSE and RMSE). The visual investigation
    of the models indicated that model 1 (M1) is superior to M2 for all the models.
    This is attributed to the fact that M1 contained additional input variables which
    served as the dominant and significant variables. Additionally, it could be observed
    that SVM-M1 performed best with the lowest MSE criteria. The overall proved merit
    for all the AI-based models. The accuracy of the ML models over the linear models
    was a 7% increment. Similarly, the developed models can play a significant and
    pivotal role in providing an inexpensive and fast method of water quality monitoring
    compared to the traditional laboratory analysis. These AI models are robust and
    can predict water pollution, and serve as a guide for authorized government and
    non-governmental agencies to develop effective strategies and manipulations for
    better water sustainability and management.


