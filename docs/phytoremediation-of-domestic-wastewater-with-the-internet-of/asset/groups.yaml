    # 7 Water Quality Monitoring Using Internet of Things (IoT)


    # 7.1 INTRODUCTION


    About 2 billion people worldwide use the internet to browse, exchange information,
    social networking and many other applications. The internet is a breakthrough
    for connecting with machines and intelligent objects to collect, interpret, compute
    and coordinate data (Miorandi et al., 2012). IoT is a fast-emerging soft technology
    that is used in industries for monitoring and management processes. The advancement
    of smart infrastructure and the proliferation of IoT opportunities in wastewater
    sector for the collection and reporting of real-time data on sewage conditions
    for operation management (Edmondson et al., 2018). However, due to the complexities
    and sensitivity of the wastewater treatment processes, there is a need to apply
    different approaches to obtain accurate and real-time conditions of wastewater
    quality. Real-time data access can be obtained using remote IoT monitoring such
    as Arduino wireless sensor devices. Data collected at monitoring sites can be
    visualized on a server computer (Chowdery et al., 2019). In the aspect of water
    quality monitoring, wireless sensor devices provide significant benefits in terms
    of communication, instant installation and remote operational cost (Priyadarshini
    et al., 2018).


    # 7.2 INTERNET OF THINGS (IoT) IN WASTEWATER MONITORING


    IoT has been used as an integrated system in applications ranging from smart power
    grids to smart wearables, intelligent supply chains and smart cities (Thombre
    et al., 2016). IoT has attracted tremendous attention in establishing a network
    for receiving and receiving information through sensors. This invention has the
    capacity to enhance the operation of large sewage systems. IoT can be used in
    environmental research, water quality monitoring and controlling system, monitoring
    of air pollution and snow level, detection of early earthquake and forest fire,
    and prevention of avalanche (Andersson & Hossain, 2014). Additionally, IoT environmental
    sensor is a valuable tool for monitoring and modelling phenomena (Edmondson et
    al., 2018). Additionally, sensors are connected to a network of different chipboards
    such as the Arduino microprocessors, ESP32, ESP8266 and ARM-based Raspberry pi
    microcontroller to collect data that can be visualized and evaluated using a computer
    and artificial intelligence (AI) models (Chowdery et al., 2019). For example,
    Chen and Han (2018) monitored the conductivity, dissolved oxygen (DO), salinity,
    temperature, presumptive Enterocci, E. coli, total coliforms


