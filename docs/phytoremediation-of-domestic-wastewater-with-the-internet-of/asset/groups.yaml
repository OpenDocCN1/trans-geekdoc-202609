    # 3.3 HIGH-RATE ALGAL PONDS (HRAPs)


    High-rate algal ponds (HRAPs) can be described as shallow runway ponds used for
    microalgae cultivation and wastewater treatment (Crag et al., 2014). HRAPs are
    gaining renewed attention due to their ability to treat wastewater with low cost
    and low energy. These systems enhance microalgal biomass generation which can
    be used as feedstock and valuable biofuels production (Young et al., 2017). It
    is worth noting that they can be deployed where environmental conditions are favourable
    for optimal microalgae development. Additionally, HRAP is a natural system that
    promotes sustainable technique for wastewater treatment due to its potential in
    lowering greenhouse gas emissions during nutrient uptake (Acién, 2016). However,
    enormous surface area is required for effective wastewater treatment and biomass
    productivity is a key barrier to the adoption and proliferation of HRAP technology
    (Acién, 2016). Hence, it is necessary to redesign the maintenance and operational
    systems of HRAPs by eliminating the primary treatment from the entire process.
    Furthermore, the potentials of HRAP technology in remediation of wastewater and
    bioenergy generation have been the focus of recent research.'
