    ## 10.5 结论


    本研究将机器学习工具（ANN、SVM、ANFIS 和 MLR）应用于 S. molesta 处理废水中 ORP 参数的建模和预测。研究发现，经典模型和基于
    AI 的模型都能对 ORP 进行建模。这通过考虑统计指标（R²、MSE 和 RMSE）得到了证明。对模型的视觉调查表明，对于所有模型，模型 1 (M1) 均优于
    M2。这归因于 M1 包含了作为主导变量额外输入变量。此外，可以观察到 SVM-M1 在最低 MSE 标准下表现最好。所有基于 AI 模型均证明了其优势。机器学习相对于线性模型的准确性提高了
    7%。同样，与传统的实验室分析相比，开发的模型在提供廉价且快速的水质监测方法方面可以起到重要且关键的作用。这些 AI 模型是稳健的，可以预测水污染，并为授权政府和非政府机构开发有效的策略和操作以提高水可持续性提供指导。


