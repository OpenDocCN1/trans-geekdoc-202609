    to two sets: calibration and validation (verification), which is a variation on
    k-fold cross-validation (Tsioptias et al., 2016).


    ### 10.2.3 ARTIFICIAL NEURAL NETWORK (ANN)


    In this study, feedforward neural network (FFNN) structures were implemented,
    and their effectiveness was evaluated and compared with the SVM, ANFIS and multilinear
    model (MLR). The proposed two-model combinations (M1 and M2) were trained with
    three-layer (input, hidden and output) ANN architecture in which the number of
    hidden nodes is greater than the number of inputs. The FFNN was built for predicting
    the ORP of the effluent water samples using four input variables, $X_i$ $(i=1,
    ..., 4)$ (temperature, turbidity, TDS and ORP of the influent samples). The $n+1$
    formula was used in selecting the hidden nodes, it has a better degree generalization
    that helps in preventing over-fitting issues. As a result, insufficient nodes
    can hinder the performance training and validation of the network (Ahmed & Sarma,
    2007; Guo et al., 2015).


    ### 10.2.4 CONCEPT OF SUPPORT VECTOR MACHINE (SVM)


    In this study, the model prediction was generated using SVM. Additionally, the
    two models were trained using cubic, linear, fine Gaussian, polynomial, coarse
    Gaussian and medium Gaussian kernel with a cross-validation of 10. After 100 iterations,
    it was discovered that the fine Gaussian kernel resulted in the optimum fit model
    for predicting the effluent water quality. For a given set of training data $\{(x_i,
    d_i)\}$, $(x_i$ is the input vector, $d_i$ is the actual value and $N$ is the
    total number of data patterns), the general SVM function is given in Equations
    10.2–10.7.


    ```

    $y = f(x) = w\phi(x) + b$

