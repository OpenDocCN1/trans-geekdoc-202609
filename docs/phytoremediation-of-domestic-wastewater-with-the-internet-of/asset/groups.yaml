    此外，生物燃料最早由鲁道夫·柴塞尔引入。简单的木柴或更复杂的燃料，如生物柴、生物航空燃料、生物乙醇和生物油，都是生物燃料的示例。目前，生物柴燃料已应用于汽车发动机，作为柴油的直接替代品或混合燃料的成分（Demiraj,
