    数据预处理和特征选择阶段在开发 AI 模型的初始步骤至关重要。这一过程对任何数据的预测准确性都有显著影响（Hayder et al., 2020; Hsu
    et al., 2011）。本研究使用了从 2 周内通过测量 ORP（S. molesta 处理系统的进水和出水）获取的 2211 条时间序列数据。因此，生成的数据使用描述性统计、敏感性分析和归一化进行了预处理。与其他
    AI 算法一样，ANN 受益于数据标准化。输入数据通常会被调整以标准化每个变量的尺度。在本研究中，使用公式 10.1 将数据归一化到 [0,1] 范围用于训练（Hayder
    et al., 2020; Hsu et al., 2011）。


    ```

    $X_{norm} = \frac{x - x_{min}}{x_{max} - x_{min}} \quad (10.1)$

    ```


    其中 $x, x_{norm}, x_{min}$ 和 $x_{max}$ 分别是观测值、归一化值、变量的最小值和最大值。


    在特征选择方面，如果相关性小于 0.5，意味着输入与目标变量之间的相关性较低（弱关联）。此外，验证方法采用了不同的方案。本研究使用了留出法（holout approach）。数据被随机分配到两组：校准和验证（验证），这是
    k 折交叉验证的一种变体（Tsioptias et al., 2016）。


    ### 10.2.3 人工神经网络 (ANN)


    在本研究中，实施了前馈神经网络 (FFNN) 结构，并将其有效性与 SVM、ANFIS 和多线性模型 (MLR) 进行了评估和比较。提出的两种模型组合（M1
    和 M2）使用三层（输入、隐藏和输出）ANN 架构进行训练，其中隐藏节点数大于输入节点数。构建 FFNN 是为了四个输入变量 $X_i$ $(i=1, ...,
    4)$（进水样本的温度、浊度、 TDS 和 ORP）预测出水样本的 ORP。选择隐藏节点时使用了 $n+1$ 公式，它具有更好的泛化能力，有助于防止过拟合问题。结果，节点不足会阻碍网络的训练和验证（Ahmed
    & Sarma, 2007; Guo et al., 2015）。


    ### 10.2.4 支持向量机 (SVM) 概念


    在本研究中，模型预测使用 SVM 生成。此外，两个模型使用了立方、线性、精细高斯、多项式、粗高斯和中等高斯核，并通过 10 次交叉验证。发现精细高斯核对于预测出水水质的最优拟合模型。对于给定的训练数据集
    $\{(x_i, d_i)\}$（$x_i$ 是输入向量，$d_i$ 是实际值，$N$ 是数据模式的总数），通用 SVM 函数由方程 10.2–10.7 给出。


    ```

    $y = f(x) = w\phi(x) + b$

    ```


    ```

    $Minimize: \frac{1}{2}\|w\|^2 + C\left(\sum_{i=1}^{N}(\xi_i + \xi_i^*)^2\right)$

    ```


    ```

    $Subject to: \begin{cases} w\phi(x_i) + b_i - d_i \le \varepsilon + \xi_i^* \\
    d_i - w\phi(x_i) + b_i \le \varepsilon + \xi_i^* \\ \xi_i, \xi_i^* \ge 0 \quad
    i=1, 2, ..., N \end{cases}$

    ```


    ```

    $w^* = \sum_{i=1}^{N}(\alpha_i - \alpha_i^*)\phi(x_i)$

    ```


    SVM 的最终形式可以表示为：


    ```

    $f(x, \alpha_i, \alpha_i^*) = \sum_{i=1}^{N}(\alpha_i - \alpha_i^*)K(x, x_i) +
    b

    ```


    ```

    $k(x_1, x_2) = \exp(-\gamma||x_1 - x_2||^2)$

    ```


    其中 $\gamma$ 是核参数。


    ### 10.2.5 自适应神经模糊系统 (ANFIS) 概念


    ANFIS 是一个由每层的神经-模糊组件组成的 FFNN 结构。ANFIS 模型利用自适应系统框架内的 Sugeno 模型来促进学习和适应。本研究中的模糊推理对于模型
    1 有四个输入和一个输出，对于模型 2 有三个输入和一个输出。ANFIS 架构可以通过假设有两个输入 x 和 y 来描述。一阶 Sugeno 模糊“如果-那么”规则如下：


    ```

    Rule 1: 如果 ($x$ 是 $A_1$) 且 ($y$ 是 $B_1$), ($f_1 = p_1x + q_1 + r_1$)

    ```


    ```

    Rule 2: 如果 ($x$ 是 $A_2$) 且 ($y$ 是 $B_2$), ($f_2 = p_2x + q_2 + r_2$)

    ```


    $A_i$ 和 $B_i$ 是模糊集，$f_i$ 是输出，$p_i, q_i,$ 和 $r_i$ 是训练过程中确定的参数。用于实现规则的 ANFIS 架构所示：


    ```

    Layer 1: $Q_i^1 = \mu_{Ai}(x)$ 对于 $i=1,2$ 或 $Q_i^1 = \mu_{Bi}(x)$ 对于 $i=3,4$

    ```


    ```

    Layer 2: $Q_i^2 = w_i \mu_{Ai}(x) \mu_{Bi}(y)$ 对于 $i=1,2$

    ```


    ```

    Layer 3: $Q_i^3 = \frac{W_i}{W_1 + W_2} i =1,2$

    ```


    ```

    Layer 4: $Q_i^4 = w_i(p_ix + q_iy + r_i) = \bar{w}_i f_i$

    ```


    $p_i, q_i,$ 和 $r_i$ 是结果参数。


    ```

    Layer 5: $Q_i^5 = w_i(p_ix + q_iy + r_i) = \frac{\sum w_i f_i}{\sum w_i}$

    ```


    为了本研究，开发 ANFIS 模型的优化参数（特别是隶属函数 MF：高斯、梯形和三角形）是使用试错法选择的。反传播和混合学习之间的最佳算法被用于优化 MF；随后，混合学习作为训练算法。误差调优设置为
    0.005，训练和测试阶段的迭代在 30 到 70 之间。


    ### 10.2.6 多线性回归 (MLR)


    MLR 用于确定两个或多个变量之间的变化水平。模型定义如下（Chen & Liu, 2015）：


    ```

    $y = b_0 + b_1x_1 + b_2x_2 + b_3x_3 + \cdots + b_ix_i$

    ```


    $x_i$ 是预测变量的值，$b_0$ 是常数，$b_i$ 是系数。


    ### 10.3 模型验证与性能评估


    ANN、SVM、ANFIS 和 MLR 的模型性能通过将预测数据划分为 70% 训练和 30% 测试来确定。为了监控模型性能，使用了不同的评估准则，即相关系数
    (R)、决定系数 (R²)、均方误差 (MSE) 和均方根误差 (RMSE)。模型参数公式如下：


    ```

    $R = 1 - \frac{\sum_{i=1}^n (A_i - P_i)^2}{\sum_{i=1}^n (A_i - \bar{A})^2}$

    ```


    ```

    $R^2 = 1 - \frac{\sum_{i=1}^n (A_i - P_i)^2}{\sum_{i=1}^n (A_i - \bar{A})^2}$

    ```


    ```

    $MSE = \frac{\sum_{i=1}^n (A_i - P_i)^2}{n}$

    ```


    ```

    $RMSE = \sqrt{\frac{\sum_{i=1}^n (A_i - P_i)^2}{n}}$

    ```


    其中 $A_i, \bar{A}$ 和 $P_i$ 分别代表实际值、实际值的平均值和预测值，而 $n$ 代表数据数量。


    ## 10.4 结果与讨论


    本节讨论了 S. molesta 处理系统 ORP 水质参数的预测和评估结果。


    ### 10.4.1 描述性统计分析


    在该研究中，所选参数的估计由不同的输入输出变量组成，如表10.2所示。此外，使用相关矩阵和描述性统计分析研究了进水和出水之间关系的程度和类型。评估 R 以确定进水出水变量之间的线性交互程度。R
    的概念是使用线性函数预测变量，该函数作为变量集之间可能相关性的初步指标。如表 10.3 所示，加粗的 R 值显示概率小于 0.05 (p<0.05) 的统计学显著变量。这表明存在高度的线性相关性。此外，带有负号的
    R 值表明两个变量之间存在反向交互。此外，R 观察到的弱性表明，在复杂建模中应用更稳健的方法很重要。R 的评估在数据预分析和数据驱动模型的生成中也很重要，因为方向符号（正或负）显示了维度与比例之间的关系。


