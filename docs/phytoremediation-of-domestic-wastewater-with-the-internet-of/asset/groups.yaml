    FIGURE 8.2 Maximum separation hyperplane. Adapted from Raghavendra and Deka (2014).


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_113_1.png)


    FIGURE 8.3 Linear separation in feature space. Adapted from Raghavendra and Deka
    (2014).


    ## 8.5 ADAPTIVE NEURO-FUZZY INFERENCE SYSTEM (ANFIS)


    ANFIS is a hybrid system that combines the neural networks with fuzzy logic, designed
    by Jang (1993), and has been used in control (Şahin & Erol, 2017). The framework
    allows ANFIS to learn from the data (Mathur et al., 2016).


    ### TABLE 8.1 Advantages and Disadvantages of ANN Techniques


    | Advantages | Disadvantages |

    | :--- | :--- |

    | ANN does not require prior understanding of the structure or connections between
    the controlling parameters (Sharghi et al., 2018). | ANN is incapable of producing
    explicit models their operations are not clear (Basheer & Hajmner, 2000). |

    | ANN can forecast complex hydrological processes (Adeyemo et al., 2018). | The
    optimal network architecture for each model may differ (Basheer & Hajmner, 2000).
    |

    | In comparison to other modelling techniques, ANN methods are relatively low
    demand for computational tasks (Dinu et al., 2017). | It is challenging to prioritize
    an acceptable model since there are no standard criteria to regulate the design
    and development of ANN model (Basheer & Hajmner, 2000). |

    | ANN requires little knowledge of the data or scenario to give a satisfactory
    result (Sharghi et al., 2018). | ANN inability to incorporate information derived
    from physical principles serves as a constraint in their use (Basheer & Hajmner,
    2000). |

    | ANN models exhibit compactness, model flexibility and the capacity to self-adapt
    to a given dataset (Sharghi et al., 2018). | They are prone to over-fitting and
    over-parameterization issues (Adeyemo et al., 2018). |


    ### TABLE 8.2 Advantages and Disadvantages of SVM


    | Advantages | Disadvantages |

    | :--- | :--- |

    | SVM achieves high generalization capability through the use of structural risk
    minimization (SRM) induction principle (Vapnik, 1998). | SVM models become complex
    and expensive (Yu et al., 2006). |

    | SVM is used in regression to estimate a single output variable from a collection
    of input variables (Khan & Couliblay, 2006). | It is difficult to understand (Raghavendra
    & Deka 2014). |

    | The advantage of this technique is that the prediction accuracy of SVM outperforms
    others approaches including decision trees, nearest neighbours and neural networks.
    | The selection of appropriate hyperparameters is on trial and error (coica 2013).
    |

    | SVM algorithms involve the application of the principle of Fermat (1638), principle
    of Lagrange (1788) and principle of Kuhn-Tucker (1951) (Raghavendra & Deka, 2014).
    | The model is dependent (Raghavendra & Deka 2014). |

    | SVM algorithms can be better understood through fundamental concepts: the soft-margin
    SVM, the hard-margin SVM, kernel function and hyperplane (Raghavendra & Deka,
