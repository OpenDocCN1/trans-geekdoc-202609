    # 3.5 MICROBIAL CELL FUEL (MFC)


    Microbial cell fuel is a device that harnesses bacteria to directly transform
    organic substrates into electrical energy. This device is one of the emerging
    technologies that simultaneously removes organic matter in wastewater and generates
    power. MFCs have been used to treat low-strength wastewater with low footprint
    (Rittmann, 2008; Watanabe, 2008). MFC is made up of cathode, electrode medium
    and anode, microorganisms and proton exchange membrane (PEM). The microorganisms
    are found in the anode compartment of the MFC, and they utilize substrates Nicotinamide
    dinucleotide (NADH) transports these electrons (Choudhry et al., 2017). Furthermore,
    MFCs offer several advantages for treatment of wastewater such that no aeration
    is required, power is generated from pollutants, there is a possible reduction
    in waste sludge production and the growth of active microorganisms is promoted
    while treating wastewater. However, they have appreciable functional stability
    under ambient temperature for electron transfer, whereas anaerobic digesters do
    not have this problem since they effectively use the microbial community without
    cell immobilization (Pharm et al., 2006). Additionally, large contact area is
    required for biofilm to accumulate on the anode when MFCs are employed for wastewater
    treatment. Furthermore, low catalytic rate of the microorganisms is another disadvantage
    of using MFC (Du et al., 2007). Meanwhile, the anaerobic environment in the MFC
    anodic cathode does not allow for efficient nutrient removal. As a result, an
    MFC that can quickly aid in nutrient uptake is promising for future development
    (Choudhry et al., 2017). Previous research has shown that MFC is effective for
    removing organic materials from within a suitable retention time. Ishii et al.
    (2008) showed that a mixed culture from sludge could produce 22% more energy from
    Geobacter sulfurducens in culture in a single-chamber MFC with an air cathode.
    Pure culture is more effective than mixed culture in understanding the mechanics
    of electricity production and developing strategies to improve process parameters,
    while mixed culture is better than pure culture in wastewater treatment because
    they utilize different type of substrates (Chaudhuri & Lovley, 2003). Furthermore,
    the bacteria utilized in MFC should be electrochemically active and capable of
    withstanding the reaction temperatures (Rabaey & Verstraete, 2005). Other bacteria
    including Desulfobulbus propionicus, Klebsiella pneumoniae and Rhodopseudomonas
    demonstrate prospect for power generation in MFCs (Sharma & Kundu, 2010). Future
    study in this area should focus on screening, microbial identification and their
    capacity for wastewater treatment and bioenergy generation.'
