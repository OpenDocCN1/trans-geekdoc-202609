    ## 生活废水的植物修复


    ### 4.1 引言


    污染是影响人类健康的健康问题之一。天然水源受到了农业和生活垃圾中有机和无机物的影响（Dipu 等, 2010）。大气环境问题是由于水中存在的有机和无机溶解物导致的（Thongtha
    等, 2014）。同样，水污染对农业产生了负面影响，导致金属进入食物链（George & Gabriel, 2017）。因此，在排放之前对废水进行有效处理至关重要（Davery
    等, 2019）。此外，植物（水生植物）具有吸收工业、农业和生活废水中重金属、有机和无机物、纳米颗粒、放射元素和药物化合物的能力，无论是二级还是三级处理。这可以通过根系过滤、植物提取、植物稳定、植物挥发、植物分解或植物转化来实现。


    此外，水生植物培养的水培系统符合环境友好废水处理方法的所有前提。


