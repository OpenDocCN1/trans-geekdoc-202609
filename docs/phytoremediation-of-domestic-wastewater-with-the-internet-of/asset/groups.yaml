    # Cultivation of Aquatic Plants for Wastewater Treatment


    # TABLE 4.1

    Mechanisms of Phytoremediation


    | Techniques | Mechanisms | Advantages |

    |---|---|---|n| Phytegradation | Plants and microorganisms either convert or destroy
    organic pollutants into non-toxic compounds within the rhizosphere or plant tissues.
    | Waste reduction and biomass generation for bioenergy production. |

    | Phytoextraction | It is a natural process through which plants absorb, translocate
    and accumulate organic inorganic substances from the environment. Plant roots
    absorb pollutants along with nutrients and water. The pollutants are not destroyed
    but stored in the leaves and shoots of the plants. | The removal of contaminants
    is economical and permanent. |

    | Phytostabilization | Heavy metals and other contaminants are immobilized in
    the soil via sorption by roots, precipitation and complexation instead of decomposition.
    | Prevents soil erosion, and no need for disposal of hazardous waste. |

    | Phytovolatilization | Contaminants are absorbed by plants and transpired through
    the xylem, where they are further converted into volatile forms and released into
    the environment as gaseous chemicals through the leaves. Phytovolatilization method
    can be used to remove heavy metals and organic contaminants from the environment.
    | Pollutants can be directly discharged into the atmosphere |

    | Rhizofiltration | Pollutants are absorbed through the root surface, precipitated
    in the root zone or other plant components. | Pollutants are retained in the roots
    after in situ and ex situ application.|


