    # 图 4.1 植物修复的机制。


    ### 表 4.2

    废水处理中植物修复的优点与缺点


    | 优点 | 缺点 |

    |---|---|

    | 需要的资本和能量低（Ahmad 等，2017） | 植物修复局限于浅池（Ahmad 等，2017） |

    | 环境友好型（Parnian 等，2016） | 污染物对植物的毒性（植物毒性）（Ahmad 等，2017） |

    | 利用自然和可再生资源（Ng 等，2017） | 与传统方法相比，需要更的时间（Ahmad 等，2017） |

    | 产生的二次废物较少（Parnian 等，2016） | 植物垫成为有害昆虫的滋生地 |

    | 碳足迹较小（Anand 等，2017） | 污染物进入食物链的倾向 |

    | 水质修复和营养回收（Anand 等，2017） | |

    | 用于原料的生物质产生（Parnian 等，2016） | |


    ## 4.5 *Pistia stratiotes* 在废水修复中的应用


    *Pistia stratiotes*（大眼萍）在废水修复中的应用成为了一种受关注的策略。


    ### 4.5.1 *Pistia stratiotes* 的特性


    *Pistia* 也被称为浮萍，它是最常见的浮叶大型水生植物（Neenschwander 等，2009）。该属名源于拉丁语“pistos”，意为“水”，暗示了其生长环境。它在富营养的环境中繁殖。*P.
    stratiotes* 的生长速度与 *E. crassipes* 相似（60-110 吨/顷）。水生植物在处理中的潜力已得到许多作者的详尽研究和综述（Dhir
    等，2009；Mahmood 等，2005；Wickramasinghe & Jayawardanda，2018）。用于废水处理的植物修复方法可以根据三个原理运行：(1)
    筛选和培养良好的水生植物候选植物；(2) 植物吸收并降解过剩的营养物质；以及(3) 收割修复系统产生的植物生物质并进行有效利用（Lu 等，2010）。腐烂的植物组织会将储存的营养物质释放到环境中（Ting
    等，2018）。然而，植物修复受限于植物占据的深度和表面积、生长缓慢以及产生生物质所需的时间增加。此外，无法利用基于植物的修复系统完全防止污染物渗入地下水。受污染土地的毒性以及土壤的总体状况会对植物的生存产生影响。


