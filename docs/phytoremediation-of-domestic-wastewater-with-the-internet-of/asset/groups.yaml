    # 1.2 SOURCES OF WASTEWATER IN OUR ENVIRONMENT


    Wastewater is classified as industrial, municipal, agricultural and domestic wastewater.
    Households generate wastewater from showers, dishwashers, laundry and flush toilets.
    Figure 1.2 depicts the major types of wastewater (Edokpayayi et al., 2017). Additionally,
    wastewater can be transported through combined sewer or sanitary sewer. In other
    words, the phrases “water reclamation” and “wastewater reuse” apply to the treatment
    of wastewater to make it beneficial within the acceptable water quality standards.
    In general, water reuse is the application of reclaimed water for useful purpose.
    Additionally, the word “reclaimed” is frequently interchanged with “recycled water”
    (Asano et al., 2007).


