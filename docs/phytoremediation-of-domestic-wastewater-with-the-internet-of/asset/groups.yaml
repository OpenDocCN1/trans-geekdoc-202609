    The authors used statistical parameters to compare the SVM and MLR models. The
    results obtained showed that the correlation coefficient (R) and average absolute
    relative error (AARE) for the SVM-based model are 0.993 and 6.88%, respectively,
    while those of the MLR were 0.8393 and 74.54%; Furthermore, Kumar et al. (2019)
