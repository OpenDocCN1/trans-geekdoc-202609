    # Cultivation of Aquatic Plants for Wastewater Treatment


    # 4.5.3 Eichhornia CRASSIPES PLANTS


    Eichhornia crassipes (Mart.) Solms also called water hyacinth is a notorious aquatic
    to the Amazon Basin of South America. The plant belongs to the pickerweed family
    (Pondertiaceae) and is considered one of the worst weed plants on the planet (Woldichael
    et al., 2011). Water hyacinth has been used in the bioaccumulation of pollutants
    by BOD, COD, phenols, pesticides, minerals, heavy metals and radioactive elements
    in phytoremediation (Khare & Lal, 2017).


    # 4.5.3.1 Distribution of E. crassipes


    E. crassipes are among the most distributed macrophytes in the world. They are
    usually found between 38°N and 38°S and were first identified as ornamental plant
    in the USA, South East Asia and South Africa in the 19th century. The weed plant
    believed to spread easily in ponds and lakes of different parts of the world because
    of its attractive lavender flowers. Additionally, in 1988 E. crassipes was first
    discovered in Lake Kyoga (Uganda) in the zones circumscribing Lake Victoria. The
    plants were able to survive and grow in Lake Victoria because of the favourable
    habitat and absence of physical disturbance such as pests, fish and other biota
    (Gichuki et al., 2012).


    # 4.5.3.2 Taxonomy of E. crassipes


    E. crassipes belongs to the Pondertiaceae family, a taxonomically complicated
    family that was reclassified as a member of the Comminales. E. crassipes is the
    only pantropical weed plant that has been identified. Except for Eichhornia natans
    (P. Beauv.), this family of mostly neropical freshwater aquatics has eight additional
    genera and species that originates from South America (Coetzee et al., 2009).
    The detailed taxonomy of E. crassipes is presented in Table 4.7.


    # TABLE 4.7

    Taxonomy of E. crassipes


    | Kingdom | Plantae |

    | --- | --- |

    | Subkingdom | Tracheobionta |

    | Supervision | Spermatophyta |

    | Division | Magnoliophyta |

    | Class | Liliopsida |

    | Subclass | Liliididae |

    | Order | Liliales |

    | Family | Pondertiaceae |

    | Genus | Eichhornia kunth |

    | Species | Eichhornia crassipes (Mart.) Solms |

    | Common name | Water hyacinth |

    | Habitat | Surface of lakes, canals, ponds and rivers or mid of shallow waters
    (Ecoport, 2011, Pieterse, 1997). The most favourable conditions are K, N, P, low-salinity
    water, absence of natural predators, sunlight and optimum temperature of 25–30°C,
    while optimum pH is between 6 and 8.'
