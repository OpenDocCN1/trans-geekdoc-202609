    ## 表 8.3：ANFIS 的优点与缺点


    | 优点 | 缺点 |

    | :--- | :--- |

    | 在 ANFIS 技术中，模型的训练独立于专家知识（Srisaeng et al., 2015）。 | ANFIS 技术对模糊规则的初始数量（聚类数量）敏感（Salleh
    et al., 2017）。随着模糊规则数量的增加，计算复杂度随之增加（Salleh et al., 2017）。 |

    | ANFIS 能够同时数值和语言知识。此外，它应用了人工神经网络（ANN）对数据分类和识别模式的能力（Srisaeng et al., 2015）。与 ANN
    相比，ANFIS 模型更容易使用，且产生的内存错误更少（Şahin & Erol, 2017）。ANFIS 方法具有学习速度快、适应能力强和非线性能力（Şahin
    & Erol, 2017）。 | |


    ## 表 8.4：MLR 的优点与缺点


    | 优点 | 缺点 |

    | :--- | :--- |

    | MLR 可以非常有效地检测离群值和异常值（Rahman et al., 2012）。 | 过拟合问题在 MLR 中非常普遍（Rahman et al.,
    2012）。精度随着数据集线性性的降低而降低（Rahman et al., 2012）。 |

    | MLR 是一种用于分析两个或多个回归因子与响应变量之间关系的技术（Rahman et al., 2012）。这种方法在观察性研究中尝试解释混杂变量时大有益处（Rahman
    et al., 2012）。 | |


    ## 8.7 误差集成学习方法


    集成学习是一种机器学习技术，通过通过整合多个同质或异构模型来提高预测的最终性能（Baba et al., 2015）。在解决问题时，与单一模型相比，这种方法能提供更精确的结果。集成技术已应用于回归和时间序列问题、聚类和分类以及网络排名算法等领域（Kazieno
    et al., 2013）。集成学习的基础元素是基础学习器，它通过基础学习算法生成。集成学习的通用公式如公式 8.3 所示（Kazieno et al.,
    2013）。


    $$P_{e}(x) = \sum_{i=1}^{n} p_{i}(x)$$


    其中 $p(x)$ 和 $P_{e}(x)$ 分别代表单一预测器和总共 $n$ 个预测器的集成。


    ## 水质监测中的机器学习技术


    训练集


