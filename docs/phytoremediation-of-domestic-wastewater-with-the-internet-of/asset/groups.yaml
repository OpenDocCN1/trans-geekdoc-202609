    ## 3.3 HIGH-RATE ALGAL PONDS (HRAPs)


    High-rate algal ponds (HRAPs) can be described as shallow ponds used for microalgae
    cultivation and wastewater treatment (Craig et al., 2014). HRAPs are gaining renewed
    attention due to their ability to treat wastewater with low cost and low energy.
    These systems enhance microalgal biomass generation which can be used as feedstock
    and valuable biofuels production (Young et al., 2017). It is worth noting that
    they can be deployed where environmental conditions are favourable for optimal
    microalgae development. Additionally, HRAP is a natural system that promotes sustainable
    technique for wastewater treatment due to its potential in lowering greenhouse
    gas emissions during nutrient uptake (Atia, 2016). However, enormous surface area
    is required for effective wastewater treatment and biomass productivity is a key
    barrier to the adoption and proliferation of HRAP (Atia, 2016). Hence, it is necessary
    to redesign the maintenance and operational systems of HRAPs by eliminating the
    primary treatment from the entire process. Furthermore, the potentials of HRAP
    technology in remediation of wastewater and bioenergy generation have been the
    focus of recent research.


    Arashiro et al. (2019) evaluated the efficacy of wastewater treatment and biomass
    generation using High-rate algal ponds with treatment (HRAP-PT) and high-rate
    algal ponds without treatment (HRAP-noPT) configurations used for the study. Water
    quality of the wastewater samples including turbidity, temperature, dissolved
    oxygen (DO), pH, total suspended solids (TSS), chlorophyll-a and volatile suspended
    solids (V) was assessed. The results obtained demonstrated that there were no
    appreciable changes in nutrient uptake of the HRAP-PT and HRAP-noPT in terms of
    wastewater treatment. In addition, the difference between the systems depended
    more on the inert materials introduced into the HRAP-noPT. Additionally, the outcome
    reported by Arashiro et al. (2019) supports the theory put out by Posadas et al.
    (2017), which claimed that, based on a theoretical analysis, primary treatment
    is necessary in municipal wastewater treatment. Utilizing the HRAP technology
    without primary treatment to HRAP will not influence the efficiency of wastewater
    treatment, rather it would minimize maintenance, lower expenses and footprint
    in HRAP systems.


    ## 3.4 PHOTOBIOREACTORS (PBRs) AND MEMBRANE BIOREACTORS (MBRs)


    The type of reactor utilized during the growing process is one of the main variables
    that affects the productivity of microalgae biomass. Different kinds of photobioreactors
    are classified as tabular, column, membrane and flat photobioreactors (Moreno-Garcia
    et al., 2017). In comparison to open systems, microalgae cultivation in photobioreactors
    involves higher capital expenditures for lighting, circulation system, culture
    medium and CO2 feed, although it is easier to maintain due to its low contamination
    rate and better productivity compared to the open systems.


    Recently, there has been a lot of attention in the use of membrane bioreactors
    (MBRs) for the treatment of wastewater (Di Bella et al., 2018; Mannina et al.,
    2017a). MBR applies biological processes that incorporate perme-selective membrane
    for final solid-liquid separation. Generally, MBR offers excellent effluent quality
    with volumetric loading rate, low footprint and high sludge retention times, and
    is excellent in solid-liquid separations in wastewater treatment (Collivarginelli
    et al., 2016). Additionally, MBRs have good capacity for solid retention, which
    allows operation with higher biomass concentration compared with conventional
    sludge activation system, resulting in the ability to use lower volume reactors
    and minimal footprint requirement. Nonetheless, membrane fouling is the major
    drawback associated with MBR operations (Cosenza et al., 2013; Xiong et al., 2016).
    High energy consumption caused by membrane aeration is also a disadvantage of
    MBRs (Mannina et al., 2017b). Recently, Di Trapani et al. (2019) used membrane
    bioreactors for the treatment of wastewater. The findings demonstrated that total
    resistance to filtration was observed, which is probably related to fast deposition
    of particles on the membrane surface. This outcome might be attributed to granule

