    The model performance of the ANN, SVM, ANFIS and MLR was determined by splitting
    the predicted data into 70% training and 30% testing. To monitor the performance
    of the models, different evaluation criteria namely coefficient of correlation
    (R), coefficient of determination (R²), mean square error (MSE) and root mean
    square error (RMSE) were used. The model parameters are formulated as follows:


    ```

    $R = 1 - \frac{\sum_{i=1}^n (A_i - P_i)^2}{\sum_{i=1}^n (A_i - \bar{A})^2}$ (10.16)

    ```


    ```

    $R^2 = 1 - \frac{\sum_{i=1}^n (A_i - P_i)^2}{\sum_{i=1}^n (A_i - \bar{A})^2}$
    (10.17)

    ```


    ```

    $MSE = \frac{\sum_{i=1}^n (A_i - P_i)^2}{n}$ (10.18)

    ```


    ```

    $RMSE = \sqrt{\frac{\sum_{i=1}^n (A_i - P_i)^2}{n}}$ (10.19)

    ```


    where $A_i, \bar{A}$ and $P_i$ represent the actual values, the average of actual
    values and predicted values, respectively, while $n$ represents the number of
