    # TABLE 8.2

    Advantages and Disadvantages of SVM


    Advantages


    SRM principle provides SVM with the desirable property to maximize the margin.
    Hence, the generalization ability does not deteriorate and is capable of unforeseen
    unseen scenario (Raghavendra & Deka, 2014).


    SVM input vectors are versatile. Thus, variables like wind speed, temperature
    and relative humidity can easily be incorporated into the model (Moghadhian et
    al., 2008).


    SVM is capable of identifying and incorporating support vectors during the training
    phase, preventing the model from being influenced by non-support vectors. They
    enable the model to perform effectively in noisy environments (Han et al., 2007).


    SVMs have the ability to reconstruct historical events in order to enhance future
    predictions by using lessons learned in the past (Han et al., 2007).


    SVM is capable of providing reliable and robust classification results. Therefore,
    they can assist in the efficient evaluation of relevant information (Raghavendra
    & Deka, 2014).


    Disadvantages


    Poor model extrapolation occurs when there is inconsistency in the previous data,
    since the model is dependent on the past record as support vectors (Raghavendra
    & Deka, 2014).


    SVM provides point predictions, and it is not suitable for probabilistic forecasting
    (Raghavendra & Deka, 2014).


    SVM is difficult to understand due to the intrinsic complexity required in mapping
    non-linear input space into a high-dimensional feature space (Tripathi et al.,
    2006).


    The selection of appropriate hyper parameters and kernel functions is based on
    trial and error (Ccoica, 2013).


    SVM models become complex and expensive when dealing with large datasets (Yu et
    al., 2006).


