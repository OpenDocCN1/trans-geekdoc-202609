    此外，SVM 执行的基本原理是将输入向量线性或非线性映射到潜在更高维的特征空间中。核函数的类型决定了映射过程。然而，SVM 训练是为了解决过拟合问题而开发的，它擅长处理大量特征（Vapnik,
