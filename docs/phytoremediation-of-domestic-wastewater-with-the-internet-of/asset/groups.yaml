    等人（2015）发现水龟菜在 45 天的消化时间后产生了约 9667.33 ml 的生物量。


    ## 4.5.2 大根浮萍植物（SALVINIA MOLESTA PLANTS）


    大根浮萍（*Salvinia molesta* D.S. Mitchell），通常称为浮萍或大浮萍，是萍蓝科的一种水生植物。Salvinia 源自 Antonio
    M. Salvinia，而 molesta 是一个希腊词，意为骚扰、耐受或麻烦之源（Nelson, 2009. 2009）。大根浮萍具有很高的养分吸收能力，每天植物组织可吸收
    8mg/g。


    ### 4.5.2.1 大根浮萍的分布


    大根浮萍是一种起源于巴西东南部的古老植物，已存在了 70 多年。它最初于 1939 年在斯里兰卡境外被发现。大根浮萍在斯里兰卡迅速成为一种普遍杂草问题，危害稻田、减少水系（灌溉）流量并阻塞运输运河通道。在全球范围内，大根浮萍被认为是最有害的杂草之一（McFarland
    等人，2004; Pérez-Consuegera 等人，2017）。此外，该植物主要发现于 20 多个国家的热带和亚热带地区，包括马来西亚、印度尼西亚、非洲、巴布亚新几内亚、印度、新加坡、澳大利亚、三角岛、圭亚、新西兰、菲律宾、斐斐、哥伦比亚和马达加斯加（McFarland
    等人，2004; Pérez-Consuegera 等人，2017）。


    ### 4.5.2.2 大根浮萍的分类


    大根浮萍属于单属科。最初被认为是圆叶萍（*S. auriculata*）的一个亚种。然而，1972 年根据果实体或雄性孢子对其进行了重新分类（Nelson,
    2009）。大根浮萍共有 12 种，其中 7 种起源于新大陆。大根浮萍的详细分类见表 4.6。


    #### 表 4.6

    #### 大根浮萍的分类


    | 域 (Domain) | 真核生物 (Eukaryote) |

    | :--- | :--- |

    | 植物界 (Kingdom Plantae) | 植物维亚 (Subkingdom Tracheobionta) |

    | 蕨类植物门 (Phylum Pteridophyta) | 百叶纲 (Class Liliopsida) |

    | 水生蕨目目 (Order Hydroperteridales) | 萍科 (Family Salviniaceae) |

    | 属 (Genera) | 满萍、非洲小萍、水苔、大根浮萍、澳洲满藻、卡里巴杂草、水蕨 (McFarland 等人，2004; Ramachandra 等人，2017)
    |

    | 种 (Species) | *S. molesta, S. oblongifolia, S. natan, S. cucullata* (Nagalingam
    等人，2008; Pérez-Consuegera 等人，2017), *S. hergozi, S. minima Baker, S. liboda Raddi,
    S. radula, S. auriculata, S. sprucei* (Avila & Funk, 2016), *S. hastata Desv;
    S. martyni Spruce* (McFarland 等人，2004) |


    ### 4.5.2.3 大根浮萍的描述


    大根浮萍由三叶为轮的叶片组成，第一片叶生根、具有浮力且出水，而第三片叶则没水并分离生根。漂浮的叶片呈长圆形，而成熟的植物呈卵状发育。此外，上表面含有线性乳头，由末端的四根毛组成，这些毛在顶端连接形成一个倒置的囊状。末端的笼状结构是一个主动陷阱，使植物能够在水中保持抗性。植物的上表面、乳头和末端毛是防水的，而植物的下层对水有亲力。此外，植物对环境因素（如可用空间、养分可用性和生境）的响应表现出显著的变化。此外，其大小从小于
    1.5 cm 到 6 cm 不等（GISD，2005; Piter 等人，2003）。图 4.3 展示了大根浮萍叶片的示意图。


    ### 4.5.2.4 大根浮萍的生长


    大根浮萍的生长取决于几个因素，包括温度、pH、养分和盐度（Madsen & Wersal, 2008）。在适当条件下，大根浮萍非常流行，因为由于无性繁殖，其生物量可以在
    2–3 天内倍增。植物在 pH 5–8 之间生长茂盛。大根浮萍能承受 5°C 到 40°C 之间的温度（Madsen & Wersal, 2008）。然而，它们在暴露于低于
    5°C 或高于 43°C 的温度几小时内就会死亡。此外，它们对养分的变化非常敏感。农业废水进入河流和溪流增加了这些植物高产的可能性，因为养分可用性的任何增加都会显著影响植物的生长。同样，大根浮萍的发展受到盐度的严重限制（Madsen
    & Wersal, 2008）。


    ### 4.5.2.5 废水植物修复中大根浮萍的养分吸收


    大根浮萍是一种大型植物，因其生长迅速且具有分解废水污染物的潜力而被用于废水植物修复（Hariyadi 等人，2013；Kumari 等人，2017）。Pavithra
    和 Kousar (2016) 研究了大根浮萍在缝纫废水修复中的有效性。WQ 等人（2017）分析了大根浮萍在 16 天修复废水的潜力。对废水进行了物理化学参数分析（浊度、pH、COD等）。研究结果显示废水中的过剩养分降至
    0.50 mg/L NO3、0.17 mg/L PO3⁻ 和 2.62 mg/L NH4。大型植物可以储存吸收磷，其发育取决于水的磷含量。Abeyawardhana
    等人（2017）利用大根浮萍和龟菜（*L. gibba*）修复工业废水。在 24 小时的水留时间内对废水进行了 WQ 分析。结果表明，大根浮萍减少了 72.63%
    的污染物、73.44% TN、74.85% Pb、66.39% Ni、65.2% Fe、69.81% Cu 和 81.66% Cr。尽管作者未提到采样时长，但
    24 小时的重金属和营养分减少结果表明大根浮萍对改善废水是有效的。此外，去除效率的评估至关重要，因为它被认为是植物修复过程中去除养分数量的标准。


    此外，Tangandu 和 Puri (2017) 研究了利用密藻和大根浮萍从蜡染废水中去除 COD 和 BOD。观察到在培养期的第四天，大根浮萍植物出现了压力状态。这可能归因于大根浮萍暴露在浓缩水中，意味着废水对植物是有害的。另一项研究（Hanafiah
    等人，2018）研究了龟菜和大根浮萍在废水处理中的性能。结果确立了大根浮萍和剑浮萍在处理废水方面的有效性。


