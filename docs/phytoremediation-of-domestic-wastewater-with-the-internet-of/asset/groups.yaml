    40 Phytoremediation of Domestic Wastewater


    # 4.5.2.5 Nutrient Uptake by S. molesta Plants in Phytoremediation of Wastewater


    S. molesta is a macrophyte that has been used in wastewater phytoremediation because
    of its rapid growth and potential to break down contaminants in wastewater (Hariyadi
    et al., 2013; Kumari et al., 2017). Pavithra and Kousar (2016) investigated the
    effectiveness of S. molesta in remediation of textile sewing. WQ et al. (2017)
    analysed the potentials of giant salvinia in remediation of wastewater for 16
    days. Physicochemical parameters including turbidity, COD, NO$_3$, PO$_3^{−}$,
    and NH$_4^+$ were performed on the treated wastewater. The outcome of the research
    showed that the excess nutrients present in the wastewater were lower to 0.50
    mg/L NO$_3$, 0.17 mg/L (95%) PO$_3^{3}$, and 2.62 mg/L NH$_4$. Macophytes could
    store and absorb phosphorus, and their development rate is dependent on the phosphorus
    content in the wastewater. Abeyawardhana et al. (2017) employed S. molesta and
    L. gibba in the remediation of industrial wastewater. WQ analysis was conducted
    on the wastewater at a detention time of 24 hours. The results demonstrated that
    up to 72.63%, 73.44% TN, 74.85% Pb, 66.39% Ni, 65.2% Fe, 69.81% Cu and 81.66%
    Cr was reduced by S. molesta plants. Despite the duration of the sampling study
    not being mentioned by the authors, the results of the heavy metals and nutrient
    reductions at 24 hours detention time revealed that S. molesta plants are effective
    in improving the contaminated wastewater. Furthermore, reduction efficiency evaluation
    is critical, as it has accepted as standard criteria for estimating the amount
    of nutrients removed during phytoremediation processes.


    Additionally, Tangandu and Puri (2017) investigated the COD and BOD removal from
    batik wastewater using E. dense and S. molesta plants. It was observed that stress
    conditions were observed in the S. molesta plants on the fourth day of the cultivation
    period. This could be attributed to the exposure of S. molesta in the concentrated
    wastewater, implying that wastewater was hazardous to the plant. Another study,
    Hanafiah et al. (2018) investigated the performance of lettuce and giant salvinia
    in the treatment of wastewater. The findings established the effectiveness of
    S. molesta and P. stratiotes in polishing wastewater.


    Furthermore, da Silva et al. (2018) evaluated the potentials of S. molesta in
    the remediation of polluted wastewater. They also investigated the functions of
    peroxidase, ascorbate peroxidase, catalase and superoxide dismutase in S. molesta
    resistance to arsenite. The results of the study indicated that S. molesta had
    a higher proficiency for reducing toxic effect in the polluted water. Sreekumar
    and John (2018) studied the potentials of giant salvinia in phytoremediation of
    pest water for bioaccumulation of Cd and Zn heavy metals. However, previous research
    failed to investigate the potentials of S. molesta in treatment of domestic wastewater,
    pharmaceutical, radioactive, nanoparticle and polymer-based materials using different
    weight (density) and retention times. Numerous reports have shown that the lipid
    content of giant salvinia was between 15.72% and 19.97% depending on the pre-treatment
    technique used. Kaur et al. (2018) stated the state of unsaturated fats in giant
    salvinia is C14:0; C14:1; C16:0; C16:1; C18:0; C18:1; C20:1; C20:4 and C22:0,
    comprising saturated (63.59%), polyunsaturated (0.73%) and saturated (33.16%)
    fats. Therefore, giant salvinia is a promising biomass for biofuel generation.'
