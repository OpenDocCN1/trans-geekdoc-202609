    \ 系统的软件和硬件通过代码库和第三方实体不断扩展和增强。Arduino 代码分为三个部分：代码开头处定义变量并引入第三方库；第二部分是设置（setup），命令代码中使用的信息源启动；最后部分称为循环（loop），负责控制和运行代码。此外，Arduino\
