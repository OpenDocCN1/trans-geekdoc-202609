    # Water Quality Monitoring in Wastewater Phytoremediation


    2.71 mg/L (S. molesta) and 3.45 mg/L (E. crassipes) was recorded at 12 hours retention
    time again 8.52 mg/L average nitrate reduction of the influent samples. The overall
    average nitrate reduction of 4.03 mg/L (P. striatiotes), 4.85 mg/L (S. molesta)
    and 3.95 mg/L (E. crassipes) were obtained for the 24 hours retention time again,
    the 24 hours retention time demonstrated a better nitrate uptake than the 6 and
    12 hours retention time. Additionally, the findings of this investigation revealed
    that S. molesta, and E. crassipes exhibited the highest efficiency in nitrate
    uptake compared to P. striatiotes plants at 12 and 24 hours retention time. Similarly,
    the fast growth observed in the three test plants was due to high nitrate assimilations
    at 12 and 24 hours retention time. At 12, S. molesta (82.9%) performed better
    than E. crassipes (68.38%) and P. striatiotes (68.06), while the trend of nitrate
    reduction efficiency for the test plants at 6 hours retention time was in the
    order of P. striatiotes > E. crassipes > S. molesta. Furthermore, the influent
    samples were polished to class I from the 6th day to the 14th day at 24 hours
    retention time. Other species have long fibrous roots that offer a large surface
    area for microbial, chemical and nutrient absorption (Akinbile et al., 2015).
    Additionally, the findings obtained at 24 hours time coincide with the results
    reported by Nivetha et al. (2016). Ingersoll and Baker (1998) recorded nitrate
    removal of up to 90% for E. crassipes, 51% for P. striatiotes and 36% for S. molesta
    in phytoremediation. Ayyasam et al. (2009) reported up to 61%–83% nitrate removal
    by E. crassipes from contaminated water, although the findings from this study
    are not in support of contaminated water, Ng et al. (2017), which phytoremediation
    of wastewater using S. molesta yielded up to 36% (phosphate), 19% (nitrate) and
    31% (ammonia).


    # 6.4 CONCLUSION


    This chapter presented the outcome of research on the potential of selected macro-phytes
    in phytoremediation of wastewater. The results obtained from this research prove
    that the three aquatic plants were efficient in tertiary treatment of wastewater
    at different retention times. Thus, the lowering efficiency trend for the three
    systems following the pattern of 24 hours > 12 hours>6 hours. Furthermore, the
    results of this investigation suggested that the 6 hours retention time was insufficient
    for the test plants to absorb or break down the ammonia nitrogen contained in
    the influent samples. In most cases, the highest removal efficiencies were recorded
    on the 12th and 14th days. Therefore, it is clear from these findings that retention
    time is a crucial factor that influences and regulates the rate of nitrate uptake
    and assimilation by phytoremediation systems.


