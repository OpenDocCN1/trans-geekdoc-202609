    44


    Phytoremediation of Domestic Wastewater


    # 4.6 CONCLUSION


    This chapter presents the significance of macrophrophy in the wastewater. The
    evaluation of aquatic weed plants can be beneficial in these processes as they
    have tremendous capacity to absorb contaminants from water and they can be easily
    cultivated and managed. High-valued compounds used as feedstock for the generation
    of a wide scope of products by aquatic plants, as they are a promising sustainable
    wellspring of supplements. Biomass obtained from phytoremediation can be utilized
    for biofuel and energy production, or for charcoal generation, fertilizer and
    food supplement.


