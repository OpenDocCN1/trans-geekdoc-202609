    # # Case Study

    Monitoring and Evaluation of Phytoremediation System Using Internet of Things
    (IoT) and Machine Learning Techniques


    #  9.1 INTRODUCTION


    Over the past century, there has been increasing efforts worldwide devoted to
    the development of water quality models (Whitehead et al., 2019). Monitoring activities
    can help in understanding, protecting and improving aquatic habitat. Water quality
    data analysis helps in quantifying environmental changes and develop management
    practices. Therefore, water quality monitoring network is a key element for managing
    and protecting water environment as it captures information about the state of
    water systems (Jiang et al., 2020). Additionally, smart water quality monitoring
    is regarded as the future water quality monitoring technique that enhances efficient
    data collection, communication, data analysis and early warning (Dong et al.,
    2015). Data transferred between sensors and the core network such as internet
    of things (IoT) technology generate data more frequently and also offloads computation
    to the cloud (Saravanan et al., 2018). For example, IoT environmental sensor is
    a valuable tool for monitoring and modelling environmental phenomena (Edmondson
    et al., 2018; Mustafa et al., 2021c). Additionally, sensors are connected to an
    ARM-based chipboards as the Arduino microprocessors, ESP32, ESP8266 and Raspberry
    Pi microcomputer to collect data that can be viewed by a computer and interpreted
    using Artificial Intelligence (AI) Chowdury et al., 2019; Mustafa et al., 2021c).
    Furthermore, a lot of research has been reported using IoT sensors for measuring
    water quality parameters (Saravanan et al., 2018). Nevertheless, little or no
    study has been done to integrate the application of smart Arduino IoT system and
    machine learning techniques for monitoring and prediction of water quality parameters
    in phytoremediation of domestic wastewater using Salvinia molesta plants. Thus,
    this study aims to bridge this gap.


    Moreover, the efficiency of S. molesta plants in phytoremediation of domestic
    wastewater has been reported (Hayder & Mustafa, 2021; Mustafa et al., 2021a);'
  - '[PAGE 126]


    Mustafa & Hayder, 2020a, 2020b, 2021a, 2021b, 2021c, 2021d). Mustafa and Hayder
    (2021c) investigated the best conditions for efficient applications of water lettuce,
    giant salvia and water hyacinth in improving the quality of low-strength domestic
    wastewater. Dhendrianti and Soetedjo (2021) employed Thingspeak as an IoT technology
    to monitor the phytoremediation of wastewater processes. In their proposed real-time
    monitoring system, several phytoremediation models were implemented on embedded
    hardware and connected to the Thingspeak IoT platform. Armendy et al. (2020) applied
    intelligent system and multipilayer neural network for predictive analysis of
    the chemical oxygen demand (COD) in industrial wastewater treatment process. Therefore,
    this research proposed the integration of IoT intelligent system, machine learning
    tools and classical method using the data collected from the phytoremediation
    process in modelling and prediction of the turbidity water quality parameter.
    This research would provide support in decision making related to the application
    of phytoremediation process in treatment plants.


    # 9.2 DEVELOPMENT OF INTERNET OF THINGS (IoT)-BASED SALVINIA MOLESTA PLANTS IN
    WASTEWATER TREATMENT


    The Arduino Board used in this research consists of sensor nodes made of PIC microcontroller,
    liquid crystal display (LCD) and sim card, which was used reading the turbidity
    of influent and effluent water samples. The Arduino Uno was connected to the internet
    through an external Wi-Fi module while the sensor nodes were inserted in the water
    samples. The data from the sensors was displayed on the liquid crystal display
    and directly to the computer. The connection diagram for an IoT system is shown
    in Figure 9.1.


    # 9.2.1 COLLECTION OF DATA


    The Arduino IoT device used to monitor the phytoremediation of the influent wastewater
    cultivated with S. molesta plants. The 2211 water quality parameter data was generated
    from the IoT monitoring system. The generated IoT data was processed using descriptive
    statistic, sensitivity analysis and normalization in order to clean and filter
    the raw data to obtain a uniform input and output data. Figure 9.2 depicts the
    data collection process of the influent and effluent water samples.


    # 9.2.2 MODELLING AND PREDICTION OF THE TURBIDITY (TURB)


    The programming execution was performed in MATLAB®R2020a (9.8.0.1417392) based
    on the 2211 data extracted from the Arduino IoT device. Machine learning techniques
    such as artificial neural network (ANN), support vector machine (SVM) and adaptive
    neuro-fuzzy inference system (ANFIS), classical method and multilayer regression
    (MLR) were employed in the modelling and prediction of the turbidity parameter.
    Two models (M1 and M2) were generated for the evaluation and the model validation
    was conducted using four performance criteria. The data from'
