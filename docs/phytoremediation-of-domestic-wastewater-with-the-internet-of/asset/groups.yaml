    ## 生活用废水的植物修复


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_24_0.png)


    图 2.2 废水处理阶段。


    技术和微生物燃料电池（MFCs）是一些已用于废水处理的技术。然而，这些方法具有运行模式复杂、耗时、成本和能量消耗高等缺点。根据 McCarthy等人（2011）的研究，使用活性污泥法处理废水消耗了约
    0.3–0.6 kWh/m³ 的高能。此外，Singh等人（2016）报告说，废水处理厂（WWTPs）的平均碳强度为 0.78 kg CO₂/m³。因此，高能耗对生物法在废水处理厂中的应用经济负担构成了主要障碍（Li
    等，2017）。因此，开发用于废水处理厂的可持续和能源中性技术已变得至关重要。因此，世界各国正在采用廉价且环保的技术（如植物修复）来处理废水（George
    & Gabriel, 2017）。利用水培系统进行废水处理的植物修复技术具有成本效益、能源高效且操作简单（Worku 等，2018）。


    ## 2.8 结论


    在全球范围内，改善水利基础设施是必要的，因为节水对于确保可靠的清洁水供应至关重要。水不仅是所有物种生存生存资源，也是人类经济增长的保障。农业、家庭和工业产生了大量的废水。废水回用被认为是解决全球缺水问题的一种极具吸引力的解决方案。废水经过处理后可以不同的有用途。经过饮用水处理的废水提供了新的水源。此外，采用废水修复可以在促进清洁水供应和保护环境的同时，缓解全球水短缺问题。


