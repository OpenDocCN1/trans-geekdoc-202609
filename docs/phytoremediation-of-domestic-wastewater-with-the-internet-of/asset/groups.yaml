    天。该研究未报道植物在进入 KWW 之前在自来水中进行驯化的过程。此外，Yasar 等人（2018）对利用剑浮萍和苦芦苇（*Phragmites karka*）培养的垂直流和水平湿地系统进行了对比研究，其水留时间为
