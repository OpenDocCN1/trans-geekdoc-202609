    ## M2-浊度验证数据


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_134_0.png)


    图 9.8 验证阶段观测值与预测浊度之间的二维泰勒图。


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_134_1.png)


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_134_2.png)


    图 9.9 (a) MSE 和 (b) RMSE 在训练和验证中的误差图。


    复杂模型的各个方面面，或计算不同模型之间的相对能力（Taylor, 2001）。图 9.8 表示了 M1 和 M2 的观测值与预测浊度之间的泰勒图。此外，9.9
    和 9.10 代表了训练和验证中的误差图，以及观测模型与预测模型之间的边缘相关性。使用 MS Excel 绘制了误差。


    从 9.8 可以明显看出，模拟的浊度（TurbT）使用 ML 模型改进了拟合效果，M1 的排名顺序为 ANFIS>SVM>ANN>MLR，M2 为 ANN>SVM>ANFIS>MLR。这表明
    ML 技术可以捕获训练和验证阶段 W 变量之间复杂的非线性模式。此外，ML 模型与 RMSE 的数值比较显示，由于ANFIS-MI 分别使 SVM-M1 和
    ANN-M1 的预测准确性下降了 31% 和 24%（见图 9.9）。此外，ANFIS 模型与观测数据之间达到了最佳拟合。这可能归功于 ANFIS 结构，因为它整合了模糊推理的优势和神经网络的自学习能力，因此具有很强的去噪能力（Rajaee
    et al., 2009）。此外，记录在中的结果


    植物修复系统的监测与评估


    ## 相关性矩阵


    | | 观测 (Obser) | ANNM1 | SVMM1 | ANFIS |

    |---|---|---|---|---|---|

    | 观测 (Obser) | | 0.66 | 0.77 | 0.62 | 0.25 |

    | ANNM1 | 0.66 | | 0.85 | 0.79 | 0.40 |

    | SVMM1 | 0.77 | 0.85 | | 0.82 | 0.33 |

    | ANFIS | 0.62 | 0.79 | 0.82 | | 0.25 |

    | MLRM1 | 0.25 | 0.40 | 0.33 | 0.25 | |


    ## 相关性矩阵


    | | 观测 (Obser) | ANNM2 | SVMM2 | ANFIS | MLRM2 |

    |---|---|---|---|---|---|

    | 观测 (Obser) | | 0.43 | 0.66 | 0.35 | 0.35 |

    | ANNM2 | 0.43 | | 0.66 | 0.69 | 0.14 |

    | SVMM2 | 0.66 | 0.66 | | 0.51 | 0.31 |

    | ANFIS | 0.35 | 0.69 | 0.51 | | -0.06 |

    | MLRM2 | 0.35 | 0.14 | 0.31 | -0.06 | |


    图 9.10 验证阶段观测模型与预测模型之间的边缘内部相关性。


    研究结果与 Nourani 等人 (2018) 报告的结果一致。他们的发现表明，由于模糊概念具有处理不确定性的能力，ANFIS 模型优于所有其他模型。Nemati
    等人 (2015) 报告说，当 MLR、ANN 和 ANFIS 模型用于估计香港大埔河的水质参数时，MLR 模型在估算溶解氧（DO）方面没有高精细度。此外，Al-Mukhtar
    和 Al-Yaseen (2019) 采用 ANFIS、ANN 和 MLR 神经网络对建模和预测伊拉克南部 Abu-Zariq 泽地的溶解性固体（TDS）和电导（EC）进行预测。他们发现
    ANFIS 模型优于 MLR 和 ANN。对 S. molesta 处理系统中的 TURBI 浓度进行更精确、更高效的预测将有助于对植物修复过程进行有效管理。因此，本研究中使用的
    ML 技术非常适合应用于决策和管理过程中。


    如图 9.10 所示，观测浊度的散点图、R 分布和 1:1 线在与预测的 ANFIS 以及其他基于 AI 的模型的边缘相关比较中非常接近。对 S. molesta
    处理系统中的 TURBI 浓度进行更精确、更高效的预测将有助于对植物修复过程进行有效管理。因此，本研究中使用的 ML 技术非常适合应用于决策和管理过程中。


    ## 9.4 结论


    本研究提议了 IoT 设备、机器学习模型（ANN、SVM、ANFIS）和一种经典方法（MLR）在利用 S. molesta 植物监测和建模进水废水处理浊度降低方面的应用。通过描述性分析和相关性矩阵调查了进水和出水参数之间关系的范围、程度和类型。评估了相关系数（R）以确定关系的程度。


