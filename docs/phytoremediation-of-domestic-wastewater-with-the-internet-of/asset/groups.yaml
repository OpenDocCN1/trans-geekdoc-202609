    # 水培系统中的废水植物修复


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_67_0.png)


    图 5.3 凤眼 (P. stratiotes)、S. molesta 和水萍 (E. crassipes) 的第一阶段培养。


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_67_1.png)


    图 5.4 不同重量的 *S. molesta* 植物的第二阶段培养。


    在第二阶段，将 70g、140g 和 280g 的鲜 *S. molesta* 植株置于三个含有进水水样的构建的人工处理系统中进行培养和驯化。选择不同的水留时间和植物重量，是为了优化废水处理的运行流程和条件，并为原料应用收割植物（见图
    5.3 和图 5.4）。


    ## 5.4.5 水样采集方法


    每 2 天在 6、12 和 24 小时的水留时间进行一次采样，持续 14 天。进水样直接从二次处理排放口收集，出水样则从每个水培水箱收集。进水和出水样在 250
    mL 瓶中进行无菌收集。采集的水样被转移到环境实验室进行水质检测。在培养过程的第二阶段，每 2 天在 24 小时水留时间收集一次进、出水样。在某些情况下，水样在实验室分析前保存在冰箱中。


    ## 5.5 案例研究：植物修复系统中水生植物的相对生长速率 (RGR)


    生长速率 (RGR) 是用于估计植物生长参数。在本案例研究中，评估了 *E. crassipes*、*P. stratiotes* 和 *S. molesta*
    在 24 小时水留时间下的 RGR。在植物于水培系统中培养 2 周后，每周进行一次植物收割。结果使用以下公式计算（Valipur 等人，2015）。RGR
    与培养植物的关系图如图 5.5 所示。


    相对生长速率 (%) = $\frac{ln Q_2 - ln Q_1}{r_2 - r_1} \times 100$


    $Q1$ 和 $Q2$ 分别是植物在 $r1$ 和 $r2$ 时的干重。


    根据图 5.5 可以看出，测试植物从第 0 天到第 14 天生长效率很高。RGR 的趋势显示，植物在 14 天采样研究内重量增加了三倍。*E. crassipes*
    在采样期结束时的生长速率最高，为 $2.5 \pm 0.0$ g/g/d，其次是 *S. molesta* 的 $1.33 \pm 0.05$ g/g/d
    和 *P. stratiotes* 的 $0.92 \pm 0.02$ g/g/d，这归功于其根系。方差分析 (ANOVA) 测试显示不同测试植物之间的生长速率存在统计学差异。同样，在三种植物中观察到的高生长归因于
    24 小时的较长水留，这为植物提供了充足的时间利用废水中的可用营养分作为生长养分。此外，这一发现表明植物能够吸收磷酸盐、硝酸盐和氨作为营养。


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_68_0.png)


    图 5.5 RGR (g/g/d) 与培养植物的关系图。


    # 水培系统中的废水植物修复


    营养盐的存在加速了植物的生长，使其能更有效地减少进水样中的污染物。同样，这一结果支持了 Ansari 等人 (2017) 的发现，他们认为废水是营养盐、水和能量的来源，在应用于废水植物修复过程中，能促进植物的生长、繁殖和生存。此外，氮和磷是所有植物所需的宏量元素。氮是所有生物的重要组成部分，存在于
    DNA、蛋白质、氨基酸、核酸 (RNA) 和其他细胞组分中（Adhikari 等人，2020）。原生活废水经过初次处理后的残留营养盐是处理系统中磷酸盐、氨氮和硝酸盐的主要来源。


    ## 5.6 收割水生植物的管理


    用于废水处理的水生植物具有高生长速率。具有这种特征的水生植物被认为是侵入性的，因为它们能够快速定殖（Fletcher 等人，2020）。在这里，大型植物在废水处理中的应用与侵入性植物的管理方法之间存在着关键联系（Fletcher
    等人，2020）。然而，将这些植物作为综合管理策略的一部分更为合适，该策略可以成功遏制植物的扩散并修复污染水（Yan 等人，2016）。此外，在考虑使用水生植物处理废水时，环境管理人员应进行初步研究，以确定营养输入/输出与植物移除能力之间的最佳平衡，以及其他最佳实践。水生植物收割的人工技术（手工摘除法）更适用于实验室规模的水培系统。此外，手工摘除法虽然费力且耗时，但可以细致地去除不需要的水（Quill
    等人，2015）。


    ## 5.7 结论


    大型植物在生物废水处理中具有重要性，因为它们能够根据水留时间、性质、环境条件和植物特征来消除污染物。挺生、沉水和浮生大型植物已通过移栽到污染水中，通过在其根部和地上部分积累储存营养盐来减少水源污染物。此外，RGR
    的结果表明植物从第 0 天到第 14 天生长高效。同样，RGR 的趋势表明植物在 14 天的采样研究内重量增加了三倍。*E. crassipes* 观察到的高密度归因于
    24 小时的较长水留，这为植物提供了充足的时间利用废水中的可用营养分作为生长养分。此外，这一发现表明植物能够吸收磷酸盐、硝酸盐和氨。


