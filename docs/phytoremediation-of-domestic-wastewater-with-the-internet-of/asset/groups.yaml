    图 7.2 DF Robot 温度传感器。\n\n## 7.4 ARDUINO IoT 系统的传感器节点\n\n### 7.4.1 温度传感器\n\nDF\
    \ Robot 传感器主要用于测量环境温度。温度传感器分为不同的类别，包括温度计、电阻式温度检测器、热电偶、红外半导体、固态温度传感器和热敏电阻。这些传感器的感知能力因传感器而异（Paul,\
    \ 2018）。热敏电阻由随温度变化的电阻组成。由于其电阻特性，必须使用激励源读取端子间的电压。在大多数情况下，使用 DF Robot 的热敏温度传感器，因为它具有更大的设计控制性，并可用于\
    \ 300°C 以下的应用，适用于在环境温度下工作的系统。电压通过正温度系数（PTC）或负温度系数（NTC）与温度成正比。由于其便携性和准确性，热敏传感器已应用于不同的领域（Cloete\
    \ 等人，2016）。DF Robot 温度传感器如图 7.2 所示。\n\n## 使用物联网 (IoT) 进行水质监测\n\n### 7.4.2 浊度传感器\n\
