    ### 8.2 CONCEPT OF MACHINE LEARNING (ML) IN WASTEWATER


    Artificial intelligence (AI) is a subfield of computer science that deals with
    human intellect. Machine learning (ML) is a branch of AI that applies to data
    for classification, pattern recognition, and prediction. AI approaches have been
    successfully used in water treatment due to their simplicity, accuracy, and speed.
    ML is divided into supervised and unsupervised learning. Supervised learning is
    used to develop the relationship between input and output values, whereas unsupervised
    learning does not provide outcomes. ML algorithms such as ANFIS, ANN, DLNN, SVM
    and decision tree are the black boxes being applied in water management.


    ### 8.3 ARTIFICIAL NEURAL NETWORK (ANN)


    ANN is a mathematical model that is used to process information in a synaptic
    weight and brain-like learning process. Generally, ANN comprises tightly coupled
    units called neurons to analyse data in a manner comparable to the central nervous
    system. The development of ANN involves the collection and pre-processing of data,
    handling, network training and testing, data splitting, selection of inputs, activation
    function, and learning algorithm. The activation function could be linear, hyperbolic
    tangent, Gaussian, or logistic depending on the selected learning algorithm and
    scaling technique. The most frequently used activation functions in water and
    wastewater monitoring are the hyperbolic tangent and logistic sigmoid functions.
    Additionally, ANN can be applied in novel paradigms for function approximation
    owing to its great characteristics of adaptability, improved input and output
    mapping, fault tolerance, nonlinearity, and self-learning.

