    # 1 可持续发展目标 (SDGs) 在废水管理中的影响


    ## 1.1 引言


    废水可以被描述为受人类活动污染的水。废水是由于各种目的而被“使用”的水，包括商业、工业、农业活动、生活、雨水或下水道渗入。废水的成分随来源而异。同样，废水由生物、化学和物理化合物组成，这些化合物可能对水质产生不利影响，使其不适合人类饮用并对水生生物产生危害。来自农业和生活的活动活动会将废物如氨（NH₃）、磷（P）、硝酸盐（NO₃）和钾（K）释放到水体。因此，这导致了水生环境的富营养化（Sukač
    et al., 2015）。因此，在进入自然水体之前，将废水中的营养完全回收或去除应被视为一个基础且关键的过程，以保护天然水（Hu et al., 2012）。


    此外，2030年可持续发展目标（SDGs）的关键组成部分之一是改善水质。传统的废水处理方法涉及多个工艺，无法完全去除水污染物。这些残留物含有一定量的营养物质（氮、磷和重金属）和病原体，会导致伤寒、霍乱和皮肤刺激等疾病的传播，并促进河流和湖泊水生植物的快速生长（Kutty
    et al., 2009; Meena et al., 2019）。因此，寻找和探索负担得起且可持续的废水处理方法（如植物修复）已变得至关重要。水生植物（大型植物）在植物修复中的应用并非新鲜事（Akinbile
    et al., 2015）。植物修复技术利用植物根系吸收废水中的过量营养物质（Nwachukwu & Osuji, 2007; U et al., 2013）。然而，水生植物在植物修复过程中的潜力取决于废水的特性和来源（Ng
    et al., 2017）。废水示意图如图1.1所示。


