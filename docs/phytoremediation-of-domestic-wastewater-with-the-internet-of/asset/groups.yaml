    Furthermore, ensemble learning is categorized into simple averaging ensemble (SAE),
    weighted averaging ensemble (WAE) and non-linear neural network ensemble (NNE).
    The structures of SAE, WAE and NNE are presented in Figures 8.6, 8.7 and 8.8,
    respectively.


    ## 8.8 DEVELOPMENT OF ANN, SVM, ANFIS AND MLR FOR PHYTOREMEDIATION OF WASTEWATER


    This subsection presents recent applications of ANN, SVM, ANFIS and MLR in phytoremediation
    of wastewater. From previous work, it was discovered that ML techniques (ANN,
    SVM and ANFIS) have gained popularity in modelling complex wastewater treatment
    systems owing to their excellent performance in predicting WQ parameters involving
    large number of variables. Additionally, it is possible to use different ML models,
    like the one of Kumar and Deswal (2020b) who used LR, ANN, RF and MSP to predicting
    phosphorous removal using four aquatic plants. Thus, Nadiri et al. (2018) reported
    that the application of different ML for forecasting and predicting of water parameters
    would allow robust comparison study than using single ML model.


    The study by Guo et al. (2015) was restricted to the applications of two ML models
    (ANN and SVM) and three performance criteria in forecasting the TN concentration
    of effluent from treatment plant (WWTP) using MATLAB software. The data was normalized
    to 1 and -1, while Darajah et al. (2017), Elfansi et al. (2017) and Parveen et
    al. (2019) employed only one model in their study. Titah et al. (2018) employed
    response surface methodology (RSM) and ANN approaches in studying the phytoremediation
    of arsenic uptake by Ludwigia octovalis. Furthermore, Nourani et al. (2018) applied
    four ML models (FFNN, SVM, MLR and ANNFIS methods) in predicting the water quality
    indicators (TN, BOD and COD) of Nicosia WWTP. It was observed that ANNFIS outperforms
    all other models owing to the fuzzy concept capacity to deal with process uncertainty.


    Vo et al. (2019) and Kumar et al. (2019) explored different regression models
    in their research. In contrast, Farzi and Borghei (2019) and Kumar et al. (2021)
    combined regression and ML models. Furthermore, Kumar and Deswal (2020a) conducted
    a study on random forest (RF) and ANN.


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_118_0.png)

    FIGURE 8.8 Structure of NNE.


    ## 8.9 CONCLUSION


    This chapter discussed the development of ANN, SVM, ANFIS and MLR for water quality
    monitoring.

