    ## 6 废水植物修复中的水质监测


    ### 6.1 引言


    寻找抑制和管理水污染的长期方法对于公众、决策制定者和政府来说至关重要。水污染的发生是因为污染物从非面源和点源持续流入水生生态系统。通常，使用物理参数（颜色、浊度、温度和气味）、化学参数（磷酸盐、氨氮和硝酸盐）和生物学参数来评估水质。此外，水的生物、化学和物理特性决定了其质量在各种用途中的应用，以及对水生栖息地的保护和维持（Omer,
    2019）。有机和无机化合物的生物降和稀释使水生环境适应并补偿水质参数的变化（Loucks & Van Beek, 2005）。


    尽管如此，水生和人工湿地的植物修复技术已被证明是整合废水处理与生物量生产的高效、低成本且可持续的技术。此外，水生系统占地面积小，并在废水修复过程中便于生产高经济价值的作物和植物。人工湿地的主要优点是其应用范围广泛，可用于栖息地形成、防洪和废水净化。因此，本章根据不同的物理化学分析，研究了不同植物在不同水力时间内利用水生系统对生活废水进行三级处理的效率。


    ### 6.2 案例研究：生活废水植物修复中的水质监测


    使用下列程序测定了进水和出水样本的 pH、颜色、化学需氧（COD）、生化需氧（BOD₂）、磷酸盐、氨氮和硝酸盐水平。进水（未处理）样本在二级处理后收集，出水（已处理）样本从水生植物培养后的水生箱中收集。


    生活废水的植物修复


    #### 6.2.1 pH 的测定


    使用 pH计（SCHMELZ Rev V20）进行 pH 测试。将 pH 电极在水样中搅拌，直到获得一致且精确的 pH 值。此外，pH 测量在25°C 的温度下进行（TPS
    Pty Ltd., 澳大利亚）。


    #### 6.2.2 颜色的测定


    使用分光度计进行颜色测试。在 455 nm 波长下测量进水和出水样本的颜色。


    #### 6.2.3 浊度的测定


    使用浊度计进行浊度测试。在 890 nm 波长下测量进水和出水样本。


    #### 6.2.4 BOD 的测定


    通过培养法测定 BOD。


    #### 6.2.5 COD 的测定


    使用分光度计进行 COD 测试。


    #### 6.2.6 磷酸盐的测定


    使用抗坏酸法测定磷酸盐。


    #### 6.2.7 氨氮的测定


    使用内氏试法测定氨氮。


    #### 6.2.8 硝酸盐的测定


    使用镉还原法测定硝酸盐。


