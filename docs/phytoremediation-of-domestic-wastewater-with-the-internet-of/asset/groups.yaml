    # #5 Phytoremediation of Wastewater in Hydroponic Systems


    # ## 5.1 INTRODUCTION


    Hydroponic system can be described as a technique of plant cultivation in the
    absence of soil (Aires, 2018). Hydroponic ponds can be used to grow aquatic plants
    in nutrient-rich effluent. This method is regarded as an essential stage in wastewater
    phytoremediation, in which plant break down the excess presents in wastewater
    (Norström et al., 2004). Therefore, the application of hydroponic systems would
    promote sustainable method for effective wastewater management (Baddadi et al.,
    2019). Hydroponic systems are classified based on the type of nutrient feeding
    (Hussain et al., 2014). Furthermore, they may be divided into two broad groups:
    nutrient and hydroponic systems that do not require a substrate (Cooper, 1979).
    The substrate-based culture methods enable root anchoring and serve as a medium
    for microbe attachment, as well as water-nutritional flywheels (Magwaza et al.,
    2020). Beside, factors such as sunlight, plants, wastewater composition and growth
    of microorganism play a significant role for effective treatment of wastewater
    and biomass production in hydroponic systems. The plant root system also promotes
    the growth of microorganisms by generating metabolites that act as food for the
    bacteria, enhancing the rate of nitrification and denitrification process in biological
    wastewater treatment (Magwaza et al., 2020). Additionally, hydroponic cultivation
