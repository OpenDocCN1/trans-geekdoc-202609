    ## 用于废水处理的水生植物培养


    ## 4.5.3 凤心蓝（Eichhornia CRASSIPES PLANTS）


    Eichhornia crassipes (Mart.) Solms 也称为水葫芦，是南美亚马逊盆地臭名昭昭的水生植物。该植物属于浮萍科（Pondertiaceae），被认为是地球上最严重的杂草之一（Woldichael
    et al., 2011）。在植物修复工程中，水葫芦已用于 BOD、COD、酚类、农药、矿物质、重金属和放射性元素的污染物生物富集（Khare & Lal,
    2017）。


    ### 4.5.3.1 凤心蓝的分布


    空心蓝是世界上分布最广的大生植物之一。它们通常分布于北纬 38° 至南纬 38° 之间，最早于 19 世纪在美国、东南亚和南非被鉴定为观赏植物。这种杂草因其迷人的紫色花朵，被认为可以在世界各池塘和湖泊中易扩散。此外，1988年空心蓝首次在维多利亚湖周边的基奥加湖（乌干达）发现。由于环境良好且缺乏害虫、鱼类和其他生物的物理干扰，这些植物能够在维多利亚湖生存并生长（Gichuki
    et al., 2012）。


    ### 4.5.3.2 凤心蓝的分类学


    空心蓝属于浮萍科，这是一个分类学上复杂的科，已被重新归类为龟甲目（Comminales）。空心蓝是已鉴定的唯一全热带杂草。除了水葫芦（*Eichhornia
    natans* 外），这个主要由热带淡水水生植物组成的科还有八个源自南美的属种（Coetzee et al., 2009）。凤心蓝的详细分类情况见表 4.7。


    #### 表 4.7：凤心蓝的分类学


    | 界 | 植物界 (Plantae) |

    | :--- | :--- |

    | 亚界 | 管植物亚界 (Tracheobionta) |

    | 门 | 种子植物门 (Spermatophyta) |

    | 纲 | 被子植物纲 (Magnoliophyta) |

    |  Class | 单子植物纲 (Liliopsida) |

    | 亚纲 | 百合亚纲 (Liliididae) |

    | 目 | 百合目 (Liliales) |

    | 科 | 浮萍科 (Pondertiaceae) |

    | 属 | 凤心蓝属 (Eichhornia kunth) |

    | 种 | 凤心蓝 (Eichhornia crassipes (Mart.) Solms) |

    | 通名 | 水葫芦 (Water hyacinth) |

    | 栖息地 | 湖泊、运河、池塘和河流表面或浅水中部（Ecoport, 2011, Pieterse, 1997）。最有利条件是 K、N、P、低盐水、无天然天敌、阳光以及
    25–30°C 的最佳温度，最佳 pH 值在 6 到 8 之间。 |


    ## 42 生活废水的植物修复


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_54_0.png)


    图 4.4 凤心蓝叶片的描述。


    ### 4.5.3.3 凤心蓝的描述


    凤心蓝植物由有柄莲生叶片、羽状根、细长的根茎和排列在叶腋簇中的花组成。叶片呈宽圆形，轻微弯曲，边缘通常呈波状，直径和高度分别为 10–20cm 和 0.5–1
    m。此外，叶片呈深绿色，生长在像气囊一样的膨胀叶柄上（Ecoport, 2011）。叶脉多而厚、呈纵向且排列密集。随着腋芽发育，叶片通过破裂一个称为原叶片（prophyll）的板状叶状结构产生。此外，花有六片瓣，呈紫蓝色，顶部为黄色（Ecoport,
    2011）。显示花的植物示意图见图 4.4。


    ### 4.5.3.4 凤心蓝植物在废水植物修复中的潜力


    凤心蓝通过生物、化学和物理过程在废水植物修复方面具有巨大潜力（Mayo & Hanai, 2017）。由于这些植物能够捕获并降解废水中的污染物，已被用于废水修复。Nurmini
    和 Felani (2015) 研究了利用凤心蓝植物对木薯工业废水进行为期 28 天的植物修复。研究仅考虑了七个水质（WQ）参数。Faisal 和 Zhang
    (2015) 调查了凤心蓝在工业废水处理中的潜力。结果显示，去除率高达 92.5%（COD 83.7%）、91.8% TSS、62.3% TDS、80% TS、71.6%
    NH₄-N、67.5% NO₃、90.2% PO₃、9.7% Cs、95.1% Ni、99.9% Hg 和 83.4% Pb。此外，Qin 等人 (2016)
    研究了利用水葫芦和苦水菜对生活废水进行植物修复。研究结果表明，凤心蓝获得了共 58.64% 的氮累积能力。这一结果可归功于较大的叶面积和更高的根系活性（71,79–98.34
    µ/g/h）、根生物量（kg/m²）、净光合速率（20.2 µmol/m²/S）、活性吸收面积（0.31–0.36/m² 鲜重）以及较大的根表面鲜重（0.97–1.10
    mg/m²）。Khare 和 Lal (2017) 在尺寸为 5×4 ft×2.5 ft 的七周人工湿地系统中研究了凤心蓝在污水处理中的潜力。物理化学测试限于浊度、
    TDS、BOD、DO、EC、COD、pH、K 和氮。Goswami 和 Das (2018) 研究了含有不同浓度 Cu 的 Hoagland 溶液的合成废水中的凤心蓝。研究结果显示，在
    21 天后，初始浓度为 5–10 mg/L 的 Cu 获得了 55%–57% 的去除效率。此外，Nash 等人 (2019) 估了凤心蓝在西米粉坊厂废水（SME）中的生存水平和营养吸收情况。实验在
    30cm（长）×30cm（宽）×30cm（深）的玻璃水箱中受控条件下进行了 30 天。


    此外，Safauldeen 等 (2019) 使用不同数量的凤心蓝（8、10 和 12 丛）和不同的停留时间对蜡染废水进行植物修复。此外，Sayago (2019)
    设计了一种利用凤心蓝进行废水植物修复和产生生物乙醇的可持续方法。研究中，收获的凤心蓝生物量被装入生物反应器中产生生物乙醇。该研究证明了凤心蓝通过水解过程用于废水修复和生物燃料生产的双重应用。Parwin
    和 Paul (2019) 利用凤心蓝进行了为期 4 周的 K 处理。分析了水质参数包括浊度、总硬度、NO₂-N、TDS、NH₄-N、K+、PO³⁻-P、EC、硫酸和碳酸氢盐。尽管该研究评估了去除效率和浓度因子，但并未提到在研究中使用的植物估计数量。此外，理解营养同化和营养储存也是重要的。


    ## 4.6 结论


    本章介绍了水生大生植物对废水处理的意义。


