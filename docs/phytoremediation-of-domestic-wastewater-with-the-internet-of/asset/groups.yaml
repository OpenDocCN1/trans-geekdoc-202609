    # 生活废水的植物修复


    处理（Almukhtar 等，2018）。此外，在气温较暖的国家，通过培养水生植物进行废水净化过程更为合适。由于这些优势，它有潜力成为发展中国家的理想选择（Mawgaza
    等，2020）。此外，由于具有更高的污染物吸收能力和更快的生长速度，水生植物在废水处理方面的效果比陆生植物更有效（Singh 等，2012）。此外，水生植物在处理中的潜力已得到许多作者的详尽研究和综述（Dhir
    等，2009；Mahmood 等，2005；Wickramasinghe & Jayawardanda，2018）。用于废水处理的植物修复方法可以根据三个原理运行：(1)
    筛选和培养良好的水生植物候选植物；(2) 植物吸收并降解过剩的营养物质；以及(3) 收割修复系统产生的植物生物质并进行有效利用（Lu 等，2010）。腐烂的植物组织会将储存的营养物质释放到环境中（Ting
    等，2018）。然而，植物修复受限于植物占据的深度和表面积、生长缓慢以及产生生物质所需的时间增加。此外，无法利用基于植物的修复系统完全防止污染物渗入地下水。受污染土地的毒性以及土壤的总体状况会对植物的生存产生影响。


    ## 4.3 植物修复的机制


    植物修复的机制可分为植物降解、植物提取、植物稳定、植物挥化作用和根系过滤（Ting 等，2018）。每种类型机制的描述如表 4.1 和图 4.1 所示。此外，表
    4.2 概述了了用于废水处理的植物修复方法的优点和缺点。


    ## 4.4 水生植物在废水植物修复中的作用


    大型水生植物处理污染物的有效性取决于污染物的浓度、截留时间、植物特征（根系和物种）以及环境因素（温度、pH 值）（Anand 等，2017）。此外，沉水植物（*Ruppia
    maritima*、*Egeria densa*、*Myophyllum aquaticum*、*Najas marina*、*Hyrophila corymbosa*、*Vallisneria
    americana*、*Hydrilla verticulata* 和 *Marina*）、挺生植物（*Typha spp.*、*Justicia americana*、*Distichlis
    spart.*、*Phagmites australis*、*Imperata littoral*、*Cyperus spp.*、*Nymphaea spp.*、*Hydrochla
    carinensis*、*Nuphar lutea*、*Iris virginica* 和 *Diosantia virgiana*）以及浮叶大型水生植物（*Riccia
    fluctuans*、*Spirodela polyrhiza*、*Pistia stratiotes*、*Landoltia punctata*、*Salvinia
    molesta*、*Marsella mutica*、*Lemma spp.*、*Azolla pinnata* 和 *Eichhornia crassipes*）已用于废水修复（Ekuperi
    等，2019；USDA，2019）。在此背景下，已用于农业、工业和生活废水植物修复的大型水生植物物种的可用记录见表 4.3 和表 4.4。


    ### 用于废水处理的水生植物培养


    ### 表 4.1

    植物修复机制


    | 技术 | 机制 | 优点 |

    |---|---|---|

    | 植物降解 (Phytegradation) | 植物和微生物在根际内或植物组织内将有机污染物转化或破坏为无毒化合物。 | 减少废物并产生用于生物能生产的生物质。
    |

    | 植物提取 (Phytoextraction) | 这是一个自然过程，植物通过该过程从环境中吸收、转移和积累有机无机物质。植物根吸收污染物以及营养物质和水。污染物没有被破坏，而是储存在植物的叶子和芽中。
    | 去除污染物是经济效益且永久的。 |

    | 植物稳定 (Phytostabilization) | 重金属和其他污染物通过根系的吸附、沉淀和络合固定在土壤中，而不是被降解。 | 防止土壤侵蚀，且不需要处置有害废物。
    |

    | 植物挥化作用 (Phytovolatilization) | 污染物被植物吸收并通过木质部蒸腾，在那里它们被进一步转化为挥发形式，并通过叶片以气体化学物质的形式释放到环境中。植物挥化法可用于去除环境中的重金属和有机污染物。
    | 污染物可以直接排放到大气中 |

    | 根系过滤 (Rhizofiltration) | 污染物通过根部表面吸收，在根部或其他植物部位中沉淀。 | 在原位和离位应用后，污染物保留在根部。 |


