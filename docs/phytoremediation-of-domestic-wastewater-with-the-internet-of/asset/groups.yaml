    # Solving the Shortage of Clean Water through Wastewater Treatment


    # 2.4 PRIMARY TREATMENT OF WASTEWATER


    In the primary stage, the wastewater is transferred to sedimentation tanks to
    remove the settleable solids by gravity. A well-built sedimentation tank can be
    used in the removal of BOD. Pathogen removal during primary treatment varies depending
    on the rates of different organisms (Singh et al., 2021).


    # 2.5 SECONDARY TREATMENT OF WASTEWATER


    Secondary treatment of wastewater tends to reduce the BOD concentration by removing
    organic materials. This is accomplished mostly through a heterotrophic bacterial
    population that uses constituents for energy and growth. The aerobic oxidation
    of BOD is accomplished through a variety of biological processes. These biological
    processes are categorized based on whether their microbial population is growing
    in a fixed film or in a dispersed form. Biofilms are bonded to a fixed surface
    in the biofilm reactors and the organic molecules are absorbed and broken down
    aerobically. Whereas in dispersed form, microorganism growth rates are allowed
    to mix freely with the wastewater and are retained in suspension by mechanical
    agitation during the treatment process. Numerous researchers have demonstrated
    that biological systems can eliminate over 90% of pollutants present in wastewater
    (Asiwal et al., 2016).


    # 2.6 TERTIARY TREATMENT OF WASTEWATER


    The tertiary treatment method was designed to completely eliminate all organic
    compounds through chemical or biological methods (Jimin, 2020). The biological
    approach functions better than chemical processes, which are generally too expensive
    to install in most locations and may result in secondary contamination. Modern
    treatment techniques are complex procedures such as carbon adsorption, chemical
    precipitation, reverse osmosis or ozonation. These approaches include those that
    target specific nutrients, such as phosphorus or nitrogen (Asiwal et al., 2016).
    Therefore, primary and secondary treatment methods are used in WWTPs to remove
    organic waste and easily settled contaminants in wastewater. However, due to the
    discharge of metals and refractory organics, the secondary treatment effluent
    is laden with phosphorus and inorganic nitrogen contributing to eutrophication
    and other long-term concerns (Abdel-Raouf et al., 2012). The stages of wastewater
    treatment are presented in Figure 2.2 (Adapted from Asiwal et al., 2016).


