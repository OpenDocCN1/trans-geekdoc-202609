    # 20

    # 生活废水的植物修复


    不稳定性发生在破碎颗粒的平均尺寸减小时，这缩短了膜的寿命。此外，膜产水的质量将符合水质标准，提供了一种更清洁、更可持续的废水处理技术。


    ## 3.5 微生物燃料电池 (MFC)


    微生物燃料电池是一种利用细菌将有机底物直接转化为电能的设备。这种设备是能够同时去除废水中有机物并发电的新兴技术之一。MFC 已用于处理占地面积低浓度废水（Rittmann,
    2008; Watanabe, 2008）。MFC 由阴极、电极介质、阳极、微生物以及质子交换膜（PEM）组成。微生物位于 MFC 的阳极室中，它们利用底物烟酰胺二核苷酸还原氢
    (NADH) 运送这些电子（Choudhry et al., 2017）。


    此外，MFC 在废水处理方面具有若干优势，例如不需要曝气、利用污染物产生能量、可能减少污泥的产生，并在处理废水的同时促进活性微生物的生长。然而，它们在环境温度下的电子传递具有明显的功能稳定性，而厌氧消化器没有这个问题，因为它们在没有细胞固化的情况下有效利用了微生物群（Pharm
    et al., 2006）。此外，当 MFC 用于废水处理时，需要较大的接触面积使生物膜在阳极上积累。此外，微生物的催化速率低是使用 MFC 的另一个缺点（Du
    et et al., 2007）。


    同时，MFC 中的厌氧环境不利于高效去除营养盐。因此，一种能够快速辅助营养吸收的 MFC 在未来发展非常有前景（Chen et al., 2017）。之前的研究表明，MFC
    在适当的停留时间内能有效去除有机材料。Ishii 等人（2008）显示，混合培养物从带有空气阴极的单室 MFC 中多产生 22% 的能量。纯培养在理解发电机理和制定改进参数的策略方面比混合培养更有效，而混合培养优于纯培养，因为它们利用了不同类型的底物（Chaudhuri
    & Lovley, Rabaey & Verstraete, 2003）。此外，MFC 中的细菌应具有电化学活性并能够耐受温度变化（Sharma & Kundu,
    2010）。


    ## 3.6 微藻培养


    ## 3.6 结论


    研究人员已广泛研究并报告了微藻在废水处理和生物能生产中的应用。可以推断，如果能克服上述围绕高负荷池（HRAPs）、光反应器和 MFC 的局限性，这些生物技术对于废水修复和能源生产的大规模整合是可行的。这些限制限制了微藻同时用于废水修复和生物能生产的应用，导致产品成本昂贵，与传统化石燃料缺乏竞争力。因此，有必要通过探索其他水生物种（如大浮萍、水葫芦和生菜）在废水处理中的潜力来寻找替代方案，以满足日益增长的清洁水需求和可持续能源的发展。


