    # 4.5 APPLICATIONS OF P. STRATIOTES, S. MOLESTA AND E. CRASSIPES IN PHYTOREMEDIATION
    OF WASTE


    # 4.5.1 PISTIA STRATIOTES PLANTS


    *Pistia* also referred to as water lettuce is among the most abundant free-floating
    macrophytes (Neenschwander et al., 2009). The genus name was originated from the
    Latin word “pistos”, which translates as “water” and alludes to the aquatic characteristics
    of the plant. It proliferates in water with high nutrient content. P. stratiotes
    grows at a similar rate as E. crassipes (60–110 t/ha/year) and has a proclivity
    for weedy behaviour (Mishima et al., 2008). Additionally, P. strati is a potential
    candidate for wastewater phytoremediation due to its availability, low-cost harvesting
    and capability to tolerate temperatures ranging from 21°C to 30°C (Aswathy, 2017).


    # 4.5.1.1 Distribution of P. stratiotes


    P. stratiotes is mostly found in slow-flowing rivers, ponds, streams or lakes
    (Akobundu & Agyakwa, 1998). The plant is prevalent in continents, excluding Antarctica
    and Europe. There is the possibility that the original spread occurred through
    ballast water on ships sailing from South America. Currently, P. stratiotes is
    the most distributed macrophytes in the world, especially in Africa, and is commercially
    available as an ornament for ponds (Labrada & Fornasai, 2002).


    # 4.5.1.2 Taxonomy of P. stratiotes


    P. stratiotes is among the Araceae family and was first described by three ancient
    Egyptians and two Greek philosophers. Presently, monospecific P. stratiotes is
    the'
