    ## Cultivation of Aquatic Plants for Wastewater Treatment


    ### 4.1 INTRODUCTION


    Pollution is among the core health-threatening issues affecting our environment.
    Natural water sources have been affected by organic and inorganic from agricultural
    and domestic waste (Dipu et al., 2010). Environmental problems in the atmosphere
    are a result of organic and inorganic soluble found in wastewater which leads
    to pollution (Thongtha et al., 2014). Similarly, water pollution has a detrimental
    effect on agriculture, resulting in metals into the food chain (George & Gabriel,
    2017). Hence, effective wastewater treatment before discharge into the environment
    is critical (Davery et al., 2019). Furthermore, macrophytes (aquatic plants) have
    the capacity to absorb pollutants including heavy metals, organic and inorganic,
    nanoparticles, radioactive elements, and pharmaceutical compounds in industrial,
    agricultural and domestic wastewater either at secondary or tertiary processes.
    This could be through rhizofiltration, phytoextraction, phytostabilization, phytovolatilization,
    phytegradation or phytotransformation.


    Besides, the construction of hydroponic systems for the cultivation of aquatic
    plants meets all prerequisites of environmentally friendly methods for wastewater.

