    sanitation, 10% continue to live in regions with severe shortages and untreated
    sewage is released into the environment. These indicators have only become available
    as a result of the SDG''s impact. Additionally, through the SDGs, awareness and
    attention is being brought to the wastewater crisis, as with awareness comes.
    Furthermore, awareness created by the SDGs, a lot of countries and non-governmental
    organizations around the world are providing services geared towards the mitigation
    of wastewater.


    Moreover, another multifaceted problem of wastewater management is further aggravated
    by climate change. Climate change is also one of the concerns of the SDGs (SDG
    13 aims to combat climate change and its impacts) (UN, 2018). Consequently, climate
    change has a dual effect on wastewater management and water resources through
    changes in precipitation, temperature, storm-related changes and sea level rise.
    Hence, extreme weather events caused by climate change will result in more untreated
    wastewater. As a result, the need for wastewater management is increasingly mandatory
    (Singh & Tiwari, 2021). Therefore, SDG of combating climate change could positively
    improve wastewater management.


    ## 1.5 CONCLUSION


    The recycling of wastewater is spreading throughout the world, particularly in
    areas where water shortage restricts the growth of economic sectors like manufacturing
    and agriculture. In addition, water reuse prevents the discharge of wastewater
    into water bodies, as it offers an alternative to other investments to preserve
    natural water bodies. Nevertheless, different strategies are required for wastewater
    management depending on the location, source of the wastewater, population size,
    technical capacity, economic development and system of governance in place. Additionally,
    strategies for wastewater management can differ on the level of quality needed
    for safe disposal and end users. Thus, wastewater management should the economic,
    social and environmental needs of the end users. Furthermore, the successful achievement
    of SDGs would contribute in maintaining sustainable wastewater management, ensuring
    clean and adequate water supply, safe and environment for all.


