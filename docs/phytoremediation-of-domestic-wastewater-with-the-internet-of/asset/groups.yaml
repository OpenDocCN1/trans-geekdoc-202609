    # 4 Cultivation of Aquatic Plants for Wastewater Treatment


    # 4.1 INTRODUCTION


    Pollution is among the core health-threatening issues affecting our environment.
    Natural water sources have been negatively affected by organic and inorganic pollutants
    from agricultural, industrial and domestic waste (Dipu et al., 2010). Environmental
    problems in the atmosphere are a result of organic and inorganic soluble found
    in wastewater which leads to water pollution (Thongtha et al., 2014). Similarly,
    water pollution has a detrimental effect on agriculture, resulting in water metals
    into the food chain (George & Gabriel, 2017). Hence, effective wastewater treatment
    before discharge into the environment is critical for preventing water pollution
    (Davery et al., 2019). Furthermore, macrophytes (aquatic plants) have the capacity
    to absorb pollutants including heavy metals, organic and inorganic, nanoparticles,
    radioactive elements, and pharmaceutical compounds in industrial, agricultural
    and domestic wastewater sources either at secondary or tertiary processes. This
    could be through rhizofiltration, phytoextraction, phytostabilization, phytovolatilization,
    phytegradation or phytotransformation. As a result, we need to improve the quality
    of treated water to meet up with international standard requirements. The combination
    of energy and recovery of water from domestic or industrial wastewater sources
    through cultivation of aquatic plants could be a possible solution to tackle problems
    of water scarcity and the depleting fossil fuels.


    # 4.2 PHTOREMEDIATION OF WASTEWATER


    Phytoremediation techniques have been used for decades. In the 19th century, yellow
    calamine violet, Thlaspi caerulescens, Viola calaminaria and Alpine pennyc of
    water flower plants reported to accumulate large quantities of metals (Sharma
    & Pandey, 2014). Phytoremediation is an innovative technique that utilizes plants
    roots for degradation of pollutants in soils, sludge, sediments and water (Wickramasinghe
    & Jayawardena, 2018). Plant survival is influenced by the condition and toxicity
    of the contaminated soil. Bioremediation systems based on plants have gained interest
    as potential strategies for cleaning up contaminated soil and water. Many plant
    species have demonstrated considerable as as phytmediation agents. Among these
    plants are grasses, and a variety of monocots and dicots (Raju et al., 2010).


    Besides, the construction of hydroponic systems for the cultivation of aquatic
    plants meets all prerequisites of environmentally friendly methods for wastewater'
