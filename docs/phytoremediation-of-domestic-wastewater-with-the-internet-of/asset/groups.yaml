    ## 8.6 MULTILINEAR REGRESSION (MLR)


    Multilinear regression analysis, also referred to as multiple regression, is a
    statistical method used in investigating and analysing the relationship between
    variables. It is a statistical method that involves mathematical equations that
    relate the variate to independent variables (Amid & Gushanish, 2017). In MLR,
    the variable to be modelled is known as the dependent variable, whereas the input
    data are known as the explanatory or independent variable. Linear regression model
    is used to predict the values of a dependent variable using linear relationship
    with one or more predictors (Abba et al., 2017).

