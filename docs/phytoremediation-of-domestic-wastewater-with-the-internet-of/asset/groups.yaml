    # Phytoremediation of Wastewater in Hydroponic Systems


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_67_0.png)


    FIGURE 5.3 First-stage cultivation of P. stratiotes, S. molesta and E. crassipes.


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_67_1.png)


    FIGURE 5.4 Second-stage cultivation of different weights of S. molesta plants.


    In the second stage, 70, 140 and 280 g of the fresh S. molesta plants were cultivated
    and acclimated in three constructed treatment systems containing the influent
    water samples. The different retention time and weight of the plant was selected
    in order to optimize the operational process and conditions for the wastewater
    treatment and harvesting of the plants for feedstock applications (Figures 5.3
    and 5.4).


    ## 5.4.5 Method of Water Sample Collection


    Sampling was conducted every 2 days at 6-, 12- and 24-hour detention times for
    14 days. The influent samples were collected directly from the discharge point
    of the secondary treatment, while the effluent samples were collected from each
    of the hydroponic tanks. The influent and effluent samples were collected aseptically
    in 250 mL bottles. The collected water samples were transferred to the environmental
    laboratory for water quality tests. In the second stage of the cultivation process,
    the influent and effluent water samples were collected every 2 days at 24 hours
    retention time. In some cases, the water samples were preserved in a refrigerator
    before laboratory analysis.


    ## 5.5 CASE STUDY: RELATIVE GROWTH RATE (RGR) OF AQUATIC PLANTS IN PHYTOREMEDIATION
    SYSTEMS


    Growth rate (RGR) is a parameter used in estimating plant growth. In this case
    study, RGR for E. crassipes, P. stratiotes and S. molesta at 24 hours retention
    was evaluated. The harvesting of the plants was carried out once a week from the
    2 weeks cultivation of the plants in hydroponic systems. The results were calculated
    using the equation below (Valipur et al., 2015). The graph of the RGR against
    the cultivated plants is presented in Figure 5.5.


    Relative growth rate (%) = $\frac{ln Q_2 - ln Q_1}{r_2 - r_1} \times 100$


    $Q1$ and $Q2$ are the dry weight of the plants at times $r1$ and $r2$, respectively.


    According to Figure 5.5, it can be seen that the test plants grow efficiently
    from day 0 to day 14. The pattern of the RGR showed that the plants tripled in
    weight within the 14 days of the sampling study. *E. crassipes* reached the highest
    growth with $2.5 \pm 0.0$ g/g/d, followed by *S. molesta* with $1.33 \pm 0.05$
    g/g/d and *P. stratiotes* with $0.92 \pm 0.02$ g/g/d at the end of the sampling
    period attributed to the long roots. ANOVA tests revealed a statistical difference
    between the growth rate of the individual test plants. Similarly, the high growth
    observed in the three plants was ascribed to the longer retention of 24 hours,
    which provided the plants with enough time to use the available nutrients present
    in the wastewater as food for their growth. Additionally, this finding revealed
    that the plants are capable of absorbing phosphates, nitrate and ammonia as nourishment.


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_68_0.png)


    FIGURE 5.5 Graph of RGR (g/g/d) against cultivated plants.


    # Phytoremediation of Wastewater in Hydroponic Systems


    The presence of nutrients accelerated the growth of the plants, making them more
    effective in reducing the contaminants present in the influent samples. Similarly,
    this result supports the findings of Ansari et al. (2017), who stated that wastewater
    is a source of nutrients, water and energy, which encourages plants to grow, reproduce
    and survive when employed in phytoremediation of wastewater processes. Furthermore,
    nitrogen and phosphorus are macronutrients that are required by all plants. Nitrogen
    is an essential component of all living creatures it is found in DNA, protein,
    amino acids, nucleicic acid (RNA) and other cell components (Adhikari et al.,
    2020). The residual nutrients present after the primary and secondary treatment
    of the raw domestic wastewater were the primary source of phosphates, ammonia
    nitrogen and nitrate in the treatment systems.


    ## 5.6 MANAGEMENT OF THE HARVESTED AQUATIC PLANTS


    Aquatic plants used in wastewater treatment have high growth rates. Aquatic plants
    that exhibit this characteristic are considered invasive, as they are capable
    of rapid colonization (Fletcher et al., 2020). Here, exists a critical link between
    the application of macrophytes in wastewater treatment and approaches for management
    of invasive plants (Fletcher et al., 2020). However, it is more appropriate to
    incorporate these plants as part of an integrated management strategy that successfully
    curtails the spread of the plants and remediation of polluted water (Yan et al.,
    2016). Additionally, when considering wastewater treatment using aquatic plants,
    environmental managers should conduct preliminary study to determine the optimum
    balance of the nutrient input/output and plant removal capacity, as well as other
    best practices. Manual technique (hand removal method) of aquatic harvesting plants
    is more suitable for lab-scale hydroponic system. Moreover, the hand removal method
    is tedious and time consuming, but allows careful removal of unwanted water (Quill
    et al., 2015).


    ## 5.7 CONCLUSION


    Macrophytes are important in biological wastewater treatment due to their ability
    in eliminating contaminants depending on retention time, nature of, ambient conditions
    and plant features. Emergent, submerged and floating macrophytes have been used
    in reducing pollutants from wastewater sources through accumulating and storing
    nutrients in their roots and shoots through transplanting into polluted waters.
    Furthermore, the outcome of RGR demonstrated that plants grow efficiently from
    day 0 to day 14. Similarly, the trend of RGR indicated that plants tripled in
    weight within the 14 days of the sampling study. The high density observed by
    E. crassipes could be attributed to the longer retention of 24 hours, which provided
    the plants with enough time to use the available nutrients present in the wastewater
    as food for their growth. Additionally, this finding revealed that the plants
    are capable of absorbing phosphates, nitrate and ammonia.


