    is propagated back to the network until a satisfactory output is obtained (Gaya
    et al., 2014). Among the several ANN architectures, the three-layer FFNN is the
    most frequently employed (Haykin, 1999). Figure 8.1 presents the ANN–FFNN network
    structure (Adapted from Nourani et al. 2018). Additionally, the use of ANN methods
    has both advantages and drawbacks. Table 8.1 highlights the advantages and disadvantages
    of ANN techniques.


    ## 8.4 SUPPORT VECTOR MACHINE (SVM)


    SVM achieves high generalization capability through the use of structural risk
    minimization (SRM) induction principle (Vapnik, 1998). SVM is a type of supervised
    learning algorithm that is used in regression and binary classification. They
    fall under a class of machine learning techniques known as kernel methods and
    they are sometimes referred to as kernel machines. SVM was initially designed
    to solve classification issues, but its use has been extended to include regression-type
    applications for function estimation (Raghavendra & Deka, 2014). SVMs are similar
    to multilayer perceptron (MLP) and radial basis (RBF), since the weight of the
    network is obtained by solving quadratic programming with linear inequality constraints
    (Dibike et al., 2000).


    Despite SVM has only been used for a short time, it has proven to be a reliable
    and competent algorithm for regression and classification in different fields.
    SVMs are used in regression to estimate a single output variable from a collection
    of input variables (Khan & Couliblay, 2006). The advantage of this technique is
    that the prediction accuracy of SVM outperforms others approaches including decision
    trees, nearest neighbours and neural networks. Furthermore SVM algorithms involve
    the application of the principle of Fermat (1638), principle of Lagrange (1788)
    and principle of Kuhn-Tucker (1951) (Raghavendra & Deka, 2014). Additionally,
    SVM algorithms can be better understood through fundamental concepts: the soft-margin
    SVM, the hard-margin SVM, kernel function and hyperplane (Raghavendra & Deka,
    2014). Figures 8.2 and 8.3 illustrate the SVM algorithms, Adapted from Raghavendra
    and Deka (2014). Therein, the advantages and disadvantages of SVM are described
    in Table 8.


    Furthermore, the fundamental principle of the SVM execution is the linear or non-linear
    mapping of the input vectors into a potentially higher dimension of feature space.
    The type of kernel function determines the mapping process. However, SVM training
    was developed to address the issue of over-fitting and it excels at processing
    a large number of features (Vapnik, 1998). The network architecture of SVM algorithm
    is presented in Figure 8.4. Adapted from Nourani et al. (2018).


