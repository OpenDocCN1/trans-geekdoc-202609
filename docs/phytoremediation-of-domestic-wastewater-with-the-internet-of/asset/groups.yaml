    # Machine Learning Techniques in Water Quality Monitoring


    # 8.9 CONCLUSION


    This chapter discussed the development of ANN, SVM, ANFIS, MLR and error ensemble
    learning approach for phytoremediation of wastewater. The aforementioned literature
    showed that two or more performance criteria are used in evaluating the accuracy
    of the models. R, R² and RMSE are the most frequently used performance criteria
    for evaluation of the selected models. Furthermore, feature selection and data
    normalization process are critical at the first stage of model development. This
    may negatively affect the prediction accuracy of the data. Another factor that
    influences the performance and accuracy of the model is the volume of the data
    and the choice of the input variables. Here, we recommend using a stepwise model-building
    approach or an analytical method like the cross-correlation methodology to choose
    input variables based on historical data. In this view, available data for phytoremediation
    of wastewater is largely based on empirical studies. Therefore, we propose the
    application of ML tools and four performance criteria (R, R², MSE and RMSE) for
    predicting and evaluating WQ data obtained from IoT devices owing to the fact
    that more research is required to developing models that would enhance WQ monitoring
    in phytoremediation of wastewater.


