  - '[PAGE 104]


    # 7.4.2 TURIDITY SENSOR


    Turbidity sensor generates voltage output through measurement of light scattering
    caused by suspended particles. Turbidity is measured in Nephelometric Turbidity
    Units (NTU) (Baldwin et al., 2019). The turbidity sensor is shown in Figure 7.3.


    # 7.4.3 OXIDATION REDUCTION POTENTIAL (ORP) SENSOR


    ORP sensors are similar to pH sensor and in some cases they are combined together.
    The ORP sensor uses a different reference solution, typically KCL Ag/Ag-Cl. A
    signal conditioner is required to interface the ORP sensor with the microcontroller
    (Cloete et al., 2016). ORP values are expressed in millivolts (mV). The ORP sensor
    is shown in Figure 7.4.


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_104_0.png)


    FIGURE 7.3 Turbidity sensor.


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_104_1.png)


    FIGURE 7.4 Oxidation reduction potential (ORP) sensor.'
  - '[PAGE 105]


    # Water Quality Monitoring Using Internet of Things (IoT)


    # 7.4.4 TOTAL DISSOLVED SOLIDS (TDS) SENSOR


    TDS sensor is used to measure the dissolved solids in water samples. TDS sensor
    can be connected to IoT systems for easy application (Anuradha et al., 2018).
    Additionally, TDS sensors accept input and output voltage ranging from 3.3–5.5V
    and 0–2.3V, respectively, making them suitable with 3.3 or 5 V control systems.
    The excitation source is an alternating current signal that prevents the probe
    from being polarized and extends the durability of the probe. TDS sensor has a
    measuring range of 0–1000ppm (Baldwin et al., 2019). TDS sensor is waterproof
    and can be used in hydroponic systems and wastewater treatment plants (WWTP) monitoring
    (Anuradha et al., 2018). The TDS sensor is shown in Figure 7.5.


    # 7.5 LIQUID CRYSTAL DISPLAY (LCD)


    LCD device is a flat panel that adjusts the light-modulating characteristics of
    liquid crystals and polarizers to display different characters and symbols. LCDs
    consist of 16-character and 2-line alphanumeric (16×2) LCD interface linked to
    the microcontroller, which enables the device to connect to E-block I/O ports.
    The data on the LCD is in serial format and can be powered by a 5 V source. The
    optimum source of 5 V is the E-block’s Multi programmer or 5 V fixed power source
    (Priyadharshini et al., 2018). The LCD is shown in Figure 7.6.


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_105_0.png)


    FIGURE 7.5 Total dissolve solids (TDS) sensor.


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_105_1.png)


    FIGURE 7.6 Liquid crystal display (LCD).'
  - '[PAGE 106]


    # WI-FI MODULE


    Wi-Fi is a wireless network that connects devices to the internet. Wi-Fi compatible
    devices can be linked to cyberspace through LAN web and wireless point within
    the range of about 20 m indoors and a larger compass outdoors to allow the internet
    reach within the capability of an internet-connected wireless meshwork (Chowdury
    et al., 2019). The Wi-Fi module is shown in Figure 7.7.


    # GLOBAL SYSTEM MOBILE (GSM SHIELD)


    GSM modules are available in a variety of shapes and sizes, each having a particular
    function. The IoT board consists of SIM900 GPRS modem for internet connectivity
    and controller that converts all input UART data to GPRS-based online data. The
    module is interfaced with Arduino mega and it is controlled by AT command through
    UART. It requires 12 V power source from an AC 100–240 V to DC 12 V 2A power adapter
    (Paul, 2018). The GSM compartment is shown in Figure 7.8.


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_106_0.png)


    FIGURE 7.7 Wi-Fi module.


    ![](img/144ee7fe73d0b07144cc2acec5d1c144_106_1.png)


    FIGURE 7.8 Arduino board showing the GSM compartment.'
