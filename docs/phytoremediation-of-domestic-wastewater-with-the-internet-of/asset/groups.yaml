    *S. molesta* and *E. crassipes* treatment systems, respectively. Finally, the
    maximum reduction efficiencies of 62.2% (*P. stratiotes*), 84.6% (*S. molesta*)
    and 74.6% (*E. crassipes*) were recorded. Additionally, ANOVA tests between the
    influent and the effluent samples were found to be significant (p<0.05).


    According to Figure 6.6, it was revealed that the turbidity concentration of the
    influent samples was lowered on the second day from 23.63±0.18 to 9.5±1.32 NTU,
    4.06±1.45 NTU and 4.72±0.03 NTU for *P. stratiotes*, *S. molesta* and *E. crassipes*
    treatment systems, respectively. As a result, *P. stratiotes*, *S. molesta*, and
    *E. crassipes* treatment systems recorded reduction efficiencies of 58%, 82.8%
    and 80%, respectively. The three treatment systems also showed a consistent pattern
    of decreasing the turbidity as number of sampling days increases. Furthermore,
    slight changes were observed on the fourth and sixth days, followed by an onward
    increase in the reduction efficiency from the *E. crassipes* treatment system.
    Furthermore, *S. molesta* exhibited the highest removal efficiency of 94%, followed
    by *P. stratiotes* with 91%, and *E. crassipes* with 89.3%. Additionally, the
    ANOVA test showed a significant difference (p<0.05) between the influent and effluent
    samples.


    Turbidity is the clarity of water (APHA, 2007), as a result of suspended matter
    found in water. *P. stratiotes*, *S. molesta*, and *E. crassipes* plants in reduction
    of the influent water samples at varied detention times of 6, 12 and 24 hours
    for 2 weeks. At 6 hours retention, the overall turbidity value was 7.58 NTU (*P.
    stratiotes*), 12.8 NTU (*S. molesta*) and 9.6 NTU (*E. crassipes*) against 22.2
    NTU (influent turbidity), while the average value of 9.9 NTU (*P. stratiotes*),
    6.2 NTU (*S. molesta*) and 9.8 NTU (*E. crassipes*) was observed at 12 hours retention
    28.9 NTU of the influent samples. At 24 hours retention time, the turbidity value
    of 7.1 NTU (*P. stratiotes*), 3.7 NTU (*S. molesta*) and 5.9 NTU (*E. crassipes*)
    was recorded against 34.9 NTU of the influent samples. In the overall experiment,
    up to 93.9% reduction efficiency was observed. These results demonstrated the
    effectiveness of *P. stratiotes*, *S. molesta* and *E. crassipes* plants in improving
    the water quality characteristics of the influent samples. Furthermore, *S. molesta*
    treatment system at 24 hours retention time provided the ideal conditions for
    lowering the turbidity level. However, it was discovered that the ability of *S.
    molesta* plants in absorbing the pollutants declined at 6 and 12 hours retention
    times. Beside, the roots were observed to retain and filter the suspended solids
    via rhizofiltration. The long hairy roots of the selected plants facilitated the
    rhizofiltration process. Plant roots have an electrical current which facilitates
    digestion and assimilation of the suspended particles by the plants (Johnson,
    1993). Additionally, phytoremediation process using hydroponic system improved
    the quality of the influent samples by providing a conducive environment for the
    trapped suspended particle to sediment at the ground level of the pond. Polished/filtered
    water remained at the top level of the pond. These results demonstrated the efficacy
    of the test plants in refining the influent samples to Malaysian water standard
    of class I (5 NTU) from the 10th to the 14th days at 24 hours retention time.
    Similarly, Aswathy (2017) reported up to 85.66% turbidity reduction efficiency
    in phytoremediation of kitchen wastewater using *P. stratiotes* after 10 days
    detention time. Additionally, Parwin and Paul (2019) recorded up to 86.75% turbidity
    removal in wastewater remediation using *E. crassipes*.


