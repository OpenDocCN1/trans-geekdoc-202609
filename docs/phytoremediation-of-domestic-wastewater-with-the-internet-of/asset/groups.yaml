    ## 3 Microalgae Cultivation for Wastewater Treatment and Bioenergy Generation


    ### 3.1 INTRODUCTION


    The demand for clean energy and water on a daily basis has increased as a consequence
    of population growth, industrialization, urbanization and other factors. As a
    result, the search for renewable energy sources have become increasingly important
    (Alipoor & Saidi, 2017). Renewable energy sources including wind, biomass, hydro,
    geothermal, marine and solar energy are essential for the world''s future energy
    needs (Edenhofer et al., 2011). Biomass is considered to be a unique and attractive
    green energy feedstock by its abundance in nature, annual regeneration and easy
    storage (Nansauer et al., 2013). Natural and derived biomass materials are the
    two types of waste sources that originate waste products (Demirbaş, 2008).

