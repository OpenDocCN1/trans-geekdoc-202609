  mdcn: "\n\n# 孟加拉国登热研究：利用机器学习根据外部因素预测登热感染概率\n\nMd. Sanzidur Islam\nCSE 部门\nDaffodil\
    \ International University\n孟加拉达卡\nsanzidul.cse@diu.edu.bd\n\nShakur Akhtar Khushu\n\
    CSE 部门\nDaffodil International University\n孟加拉达卡\nshaharun.cse@diu.edu.bd\n\n\
    Akam Shahar Azad Raby\nCSE 部门\nDaffodil International University\n孟加拉达卡\nshaharans.cse@diu.edu.bd\n\
    \nDr. Touhid Bhuiyan\nDaffodil International University \nheadase@diaffodility.edu.bd\n\
    \n**摘要—** 2019 年的登热爆发是孟加拉的一个重大高峰，特别是全国范围内发现了约 179 人和 101,354 例确诊病例。孟加拉等发展中国在控制登热的医疗和人员资源方面存在局局限。尽管如此，本工作研究了根据发热、疼痛、畏光、头痛等某些外部因素预测感染登热的机会。本文在接受检测前排除发热。因此，患者可能会因其变化出现一些初期症状，并对获取初步治疗的检测产生依赖。使用了不同的机器学习模型来预测概率，并实现了接近\
    \ 100% 的准确率。\n\n亚洲地区，但通过早期的预防性措施来减少病例数量 [11]。经济赤字会导致任何国家在资金问题、治疗成本高昂等问题上遭受家庭层面的经济损失，除非他们在早期阶段保持健康\
    \ [12-13]。由于孟加拉国这种不稳定的状态，在检测前应该对登热采取措施。通过代表某些外部因素的预测监测系统可以实现有效控制。登热病毒包括在极早期出现某些非特异性症状，并通常从高热开始。由于登热最初的高热造成了巨大负担，目前还没有成熟的登热疫苗。\n\
    \n**关键词** 机器学习模型、登热病、解剖症状。\n\n## I. 引言\n\n登热（DF）和登革出血性发热（DHF）是高风险的蚊传播疾病，伴有严重症状的急性发热\
    \ [1]。当登热通过蚊子叮咬传播时，会表现出严重症状 [2]。这种公共流行病遍布热带和亚热带地区。19 世纪 1850 年代，菲律宾发现并已知登热。多年来，登热一直是南亚地区的主要健康问题，由相关形式引起\
    \ [4]。登热影响了 128 个国家，占一半的人口，大多数人都会经历一次 [3]。1964 年，孟加拉国首次被识别为“达卡热”，后来可能是由于达卡的情况可能规模。首份官方报告显示\
    \ 2000 年死亡人数较高，约 600 例病例和低于 100 人死亡 [6-7]，2010 年至 2011 年该疾病反复发 [8]。2020 年的现状显示登热也影响了多达\
    \ 300 万人。\n\n为了减轻登热负担，重点关注了达卡中心现有 400 例登热病例。约 70 人呈阳性，约 30% 的登热报告。包括根据其行为处于发热阳性或阴性的\
    \ 10 至 12 级患者。所提系统提到了孟加拉国的公共卫生，因为近年来我们的方法与人相当不同。该预测可以轻松预测严重和非严重的住院情况。在农村地区，它使得诊断更加方便。机器学习的反思在每个领域都有广泛的反响。其中生物医学领域也涵盖了\
    \ ML 分析。在开始处理之前。\n\n## III. 方法论\n\n方法论部分使用了模型规格的统计和分析分析相结合。因此，在本节中说明了从数据开始到处理机器学习模型的工作方法，并简要介绍了适当的\
    \ ML 分类器，所提出的“登热阳性及预测”具有必要步骤如下。\n\n### A. 研究目标\n\n预测研究主题有助于更好地理解发展、未来趋势和创新。研究转型的摘要显示了数据处理的属性响应并非研究刻意意图的终点，而是在处理我们的登热病例发生情况后，通过多种\
    \ ML 学习分类进行预测。\n\n### B. 数据收集\n\n由于对登热未来概率的研究需要登热病的相关数据。因此，预测相当能捕捉外部症状。这就是为什么必须创建一个包含两类患者（如登热阳性）的数据集。因此，我们准备了一个包含\
    \ 40 个病例的数据集，其中 70% 的数据由阳性病例组成，其他 30% 的数据为孟加国的阴性病例。根据对阳性和阴性病例的分析以获得良好的准确率，确定哪些病例的症状未被分类用于登热预测。\n\
    \nNazim Karim 等人 [16] 介绍了孟加拉国达卡市 2000 年至 2008 年的8 年数据生产，机器学习算法是线性回归。登热病的特征通过气候变化的验证对引起病例的情况有很大影响。\n\
    \nBenjamin M. Alexander 等人 [17] 展示了曼谷和单一地区超出登热病例的逻辑回归和 SVM 线性及二分类。登热数据集的结果用于预测目的的初始模型。通过二分类进行登热事件几乎花费了\
    \ 5 年的感染，生成了 95% 级别的准确率。\n\nJonas Perez [15] 解释了双峰登热研究，这需要机器学习分类。超过 100 个国家受到登热的影响，通过这种一致性，在感染后\
    \ 72 小时内识别出双极峰值。\n\nAhmed 等人 [19] 通过 ARIMA 模型和 K-H 模型分析对登热和 DHF 情况进行了预测。登热感染数据集数据集为\
    \ 2001 年至 2006 年，这意味着 6 年的数据集，声称 2007 年至 2008 年 6 月阳性病例减少。尽管 K-H 模型和 ARIMA 的说明暴露了\
    \ ARIMA 时间序列模型的困境，但与成功的序列不同，其原因是 MAPE 分数为 9.6。K-Held(K-H) 模型结合敏感性分析的 MAPE 值为 17.21。该部分显示了按周的明显差异。\n\
    \nHani M Abbas 等人 [14] 通过 ANN 估计识别了确诊病例的登热预测分析。马来西亚自 2007 年受到该疾病的巨大影响。马来西亚登热病例需要高系数\
    \ 0.96。神经网络需要输入序列，数据检测为 70% 和 30%。4 个特征如温度、湿度等指数产生相关性和 RMSE 误差。\n\nNangeetha 等人\
    \ [18] 揭示了 SVM 机器学习算法在泰国四个地区降水、温度和密度方面的有效性。变量分析显示登热情况显示是否是发热或。增加了 SVM 机器学习算法在系数和\
    \ RMSE 分数上的 77% 准确率转折点。在四个地区预测期间，温度和密度与登热分离，而非降水可能引起登热，为了进一步检查，我们使用了 10 折验证。\n\
    \n"
