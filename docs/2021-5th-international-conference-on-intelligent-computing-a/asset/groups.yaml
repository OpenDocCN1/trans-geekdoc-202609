    ## V. 结论


    孟加拉登热病爆发的研究影响了大型部门。在没有登热的城市地区，从儿童到老年人的所有病例每天感染。公共医疗每天建立阳性登热病例治疗。许多病例恢复良好，其他病例可能不需要住院。在本研究中，尝试使用基于分类系统的方法，我们识别登热是阳性还是阴性。我们的结果显示登热在孟加拉很流行，大多数病例为阳性，少数为阴性。清理数据集后，机器学习分类器应用于这些病例上，性能非常幸运，例如
    100% 和 99% 的准确率。同样，SVM 和 LR 也提供了准确率。根据分析，此处机器学习分类预测中只有 ANN 和 KNN 两个模型预测准确，准确率为
    65% 和 71%。在，阳性病例的登热病预测可以准确预测 ANN、DT、RF、SVM、LR 等五个模型。


