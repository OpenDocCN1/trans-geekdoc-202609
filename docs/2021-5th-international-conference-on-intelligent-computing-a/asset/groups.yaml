    ## C. 数据预处理与模型


    数值表示需要通过从登热病例收集数据进行预处理。根据病例，我们在训练集中收集了超过 70% 的阴性登热病例。我们的结果数据集存在来自测试集的缺失值。在分析开始时，有一些必要的步骤，第一步是预处理数据。通过划分数据并将编码数据传输到新数据，训练数据能够准确地运行到模型中。用于
    DP 预测的数据案例现在可以准确地分类登热病例并合并输出分类。


    病例在标签编码下进行预处理，并根据下一个病例是否匹配相似性通过预测进行一个真或假的陈述述。当该方法采用 CSV 部分的数值统计时，机器学习分类程序通过对登热数据集的登热预测卓越地执行，分类器的准确率具有最佳性能。根据输出，优化模型的关键方面是混淆矩阵、精确率和其他结果。由于我们使用不同的分类器来评估登热预测的性能，分类器结果将在下一节显示。通过监督学习和无监督学习应用多变量分类，健康是为人知的。结合登热数据的背景研究，支持基于
    RF [24]、DT [25]、NB [26]、LR [27]、ANN [28] 的数据馈送过滤器。机器学习分类器高度推荐用于任何登热预测，因为对这些分类器的研究非常丰富。


    ## IV. 实验与讨论


    ### A. 模型训练


    机器学习分类器保持着特定的卓越性，因为为了获得实验结果进行了描述性分析。数据被分为训练集和测试集两部分，登热病例分析涉及 400 多个病例中的 12 个特征，这些特征由几个分类器覆盖。在登热数据集的使用过程中，使用
