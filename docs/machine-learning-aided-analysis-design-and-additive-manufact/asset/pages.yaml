    # 3.4 Conclusion


    A general theoretical model of arbitrarily shaped FGP plates is established for
    investigation of free vibration, transient, and steady-state response. The technique
    of simulate virtual springs with the spectral Chebyshev method is employed to
    simulate various constraints of arbitrary curved edges. According to the FSDT
    and Lagrangian–Ritz approach, constitutive relation and energy equation are obtained.
    With coordinate transformation and two-dimensional Chebyshev polynomials, the
    displacement components of FGP plates are expressed in a square area named computational
    domains. The solutions to vibration of FGP plates can be easily obtained by Gauss–Lucas
    iteration technique. In order to confirm the universality and correctness, sets
    of examples are carried out. As a consequence, the contributions of porosity coefficient
    and distributions are analyzed in detail, including free vibration, transient
    response, and steady-state response.


