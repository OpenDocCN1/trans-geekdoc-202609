    *Source:* Reproduction with permission from Hernández-Nava E, Smith CJ, Derguti
    F, Tammas-Williams S, Léonard F, Withers PJ, et al. The effect of density and
    feature size on mechanical properties of isostatic metallic foams produced by
    additive manufacturing. Acta Mater 2015;85:387–95. Copyright 2015, Elsevier.


    Similarly, Matheson et al [45] used the X-ray CT imaging system to reconstruct
    the open-cell foam produced by the traditional investment casting process. As
    stereo lithography (STL) file of the specimen was first generated. Then, as the
    scanned 3D structure, framed aluminum was prepared by PBF. As shown in Fig. 14.10,
    the authors carried quasi-static experiments on open cell foam prepared by traditional
    technology and additive manufacturing technology. With Ray CT, the distribution
    of collapse and fracture of open cell foams was obtained. We found that the traditional
    foam had more ligament collapse without rupture. The foams produced by PBF were
    more brittle than the traditional foam.


    Wang et al [46] used different base materials including polyurethane, polyamideide
    12, and polyamide to produce addively manufactured open-cell foams. They studied
    the macro mechanical properties and deformation mechanism of species under quasi-static
    loading. The Voronoi diagram is a typical method to generate random cells, whose
    process is similar to the physical growth of traditional foams. In the Voronoi
    diagram, a 3D finite space with $V_0$ volume is first established, the set of
    $N$ nuclei is created in this space by one. If $N$ nuclei distribute in the $V_0$
    space uniformly, a fully regular Kelvin foam (also tetrakaidecahedral foam) will
    be created, and the distance between adjacent nuclei in a Kelvin foam is given
    by:


    ```

    $d_0 = \frac{\sqrt{6}}{2} \sqrt[3]{\frac{V_0}{2N}} \quad (14.1)$

    ```'
