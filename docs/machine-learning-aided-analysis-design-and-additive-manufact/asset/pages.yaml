- pgno: 78
  md: "# Free vibration of FGP plates\n\n# 3.3.1.1 Convergence and verification\n\n\
    To test the validity and accuracy of the current CDQM for vibration prediction\
    \ of FGP plates with complex edges, a general and valid scheme is to first present\
    \ convergence examples and then compare out numerical results with this method\
    \ and the other methods, which have been validated.\n\nTables 3.2 and 3.3 demonstrate\
    \ the natural frequency of FGP quadrilateral and truncated circular plate with\
    \ respect to the truncation number of Chebyshev polynomials of first kind. Three\
    \ boundary conditions including classic and elastic constraints are applied, the\
    \ material type is selected as FGM, porosity distribution $p_0=0.2$. Geometric\
    \ properties are as for quadrilateral plate, $L_1=1$ m, $L_2=0.8$ m, $h=0.9$ m,\
    \ $\\alpha_1=80^{\\circ}$, $\\alpha_2=75^{\\circ}$, $h=0.1$ m; for elliptical\
    \ plate, $a=2$ m, $b=1$ m, $h=0.1$ m; for truncated circular plate, $r=0.4$ m,\
    \ $d=0.25$ m, $h=1$ m., frequencies of three FGP plates behave stably with increasing\
    \ the truncation number, regardless of the boundary conditions and mode numbers,\
    \ providing the correctness of this method. Comprehensively demonstrate the computational\
    \ stability and cost, truncation numbers M and N are both set to 16 in the following\
    \ works of this chapter.\n\nNext, the correctness and universality of CDQM are\
    \ verified by a set of comparison parameters $(\\Delta\\lambda)$ between Tables\
    \ 3.4 and the existing method, the frequency difference, $\\lambda = \\omega(L/\\\
    lambda)(\rho/D)^{1/2}$ for square plate and circular plate, where $D$ is the flexural\
    \ stiffness and $D=kh^3/[12(1-\nu^2)]$; Table 3.6 present the comparison of the\
    \ numerical results of CDQM and FEM. Materials of Tables 3.4 and 3.5 are both\
    \ FM1, while FMI is considered in FM2. A FGP square plate is listed in Table 3.4,\
    \ thickness-to-length ratios $h/L=0.01$ and $0.01$; porosity distribution is Type\
    \ 1, an elliptical plate that is isotropic with $a=5$ m, $b=2.5$ m and $h=0.0815$\
    \ m; while geometric properties of a circular presented in Table 3.5 is $r=1$\
    \ m and $h/r=0.01, 0.01.\n\nAccording to Tables 3.4 and 3.5, good agreements with\
    \ CDQM and reference are obtained, the various porosity distributions and boundary\
    \ conditions, geometric properties, demonstrating the correctness, and universality\
    \ of CDQM.\n\nSince its accuracy and universality, FEM is treated as a credible\
    \ and popular method to deal with complex problems. For further and validation\
    \ of correctness and universality of CDQM, a set of comparisons are conducted\
    \ in the following work. Results with CDQM and FEM of structures are shown in\
    \ Fig. 3.4 are listed in Tables 3.7–3.9, the corresponding material and geometric\
    \ parameters are as Tables 3.2–3.4 for simplification of ordering procedures,\
    \ various reliabilities composed of classic and elastic edges are considered for\
    \ diversity of data. It is visible that results with CDQM and FEM are pretty close\
    \ to each other, providing valid and credible demonstration of the correctness\
    \ and versatility of CDQM. Some corresponding mode shapes are listed in Fig. 3.5."
  merge: -1
  img_proc: true
