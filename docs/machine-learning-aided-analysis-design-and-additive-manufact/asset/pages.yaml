    # 8.1 Introduction


    Functionally graded materials (FGMs) are new types of composites obtained by mixing
    ceramic and metallic constituents [1–4]. Material properties vary continuously
    through the beam thickness in function of the mixing process. This avoids the
    stress consideration observed in laminate materials. FGMs are reserved for specific
    uses, for example, coatings of thermal barriers for turbine blades, shielding
    for military applications, automotive, and aerospace industries, biomedical materials.


    In the past decades, studies on FGM beams [5–10], plates [11–19] and shells [20–22]
    have received substantial attention, and an extensive spectrum of beam and plate
    theories has been introduced, based on the classical and the shear deformation-theory
    of beams.


    FGMs are currently in great demand by industries, requiring specific models to
    analyze their behavior and predict their responses. Many researchers have been
    interested in different FGM structures because of their wide application areas.
    Both beam models, the Euler-Bernoulli model (CBT) for thin beams and the Timoshenko
    model (SDT) for thick beams, were introduced. The CBT model ignores the transverse
    deformation. It was later proposed to account for the shear deformation into consideration,
    resulting in the SDT. Nevertheless, this second model requires a shear correction
    to satisfy the top and bottom beams'' boundary conditions, influences the results.
    The higher-order SDT aims to eliminate the faulty of CBT and for transverse deformation
    through beam thickness without providing any shear correction.


    Multiple models with various shear stress has have been proposed, for example,
    the Reddy model [23]. Thai and Vo [24] have presented various higher-order beam
    theories for FGMs. They have shown that these models are effective in the static
    and dynamic analysis of beams. Ebrahemi Jafari [25] analyzed'
