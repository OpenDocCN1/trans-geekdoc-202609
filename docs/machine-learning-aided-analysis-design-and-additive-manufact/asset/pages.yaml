    # 15.2.3 Additive manufacturing


    A commercial 3D printer called “Raise3D N2 PLUS” is used in the additive manufacturing
    process. First, we generate the computer-aided design of Voronoi foams. Secondly,
    the models are converted into stereolithography formats and transferred to a slicing
    software “IdeaMaker”. Finally, the models are sliced into sequentially layers
    and imported into the 3D printer for manufacturing. The base material of all specimens
    is a commercial polyacrylic acid called PolyMax. The density and melting point
    of printing material is 1200 kg/m³ and 170°C, respectively. The printing parameters
    are optimized to eliminate the influence on the mechanical properties of specimen.
    The layer height, extruder temperature, and speed are determined as 0.1 mm, 220°C,
    and 30 mm/s, respectively. The nozzle of this printer has a diameter of 0.4 mm
    and therefore the cell thickness of all specimens is set to 0.4 mm. Three specimens
    for each configuration are produced to check for the reproducibility of experimental
    results.


