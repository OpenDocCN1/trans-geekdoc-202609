    theta)\\varphi(x)}]$\n```\n\nin which:\n\n```\n$\\mu(\\mathbf{x}) = \\log[\\mu_{log}(\\\
    mathbf{x})] / \\sqrt{\\sigma_{log}^2(\\mathbf{x})}$,\n```\n\n```\n$\\sigma(\\\
