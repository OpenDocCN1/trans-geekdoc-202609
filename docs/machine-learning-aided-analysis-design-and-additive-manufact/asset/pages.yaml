    # 7.6.3 The influence of different porosity types


    The influences of different porosity types on buckling behaviors are discussed
    in this section, as seen in Fig. 7.4. As can be seen, T1P has the greatest mean
    values of buckling times while T4P has the least one. T2P1 and T4P1 are almost
    the same. The uncertainty of different porosity distributions has a strong influence
    on buckling loads. Taking first buckling loads (FBLs) of T1P as an example, there
    is an 18%–45% error range, which leads to discrepancies between theoretical simulations
    and experimental results.


    # 7.6.4 The influence of different graphene platelets distribution pattern


    The difference of GPL dispersion patterns is presented here, as shown in Fig.
    7.5. It can be seen that P1 beams possess the highest mean values of buckling
    loads while P3 has the least values. This is because the reinforcements dispersions
    closer to the top or bottom layers lead to stiffer beams than those near the mid-plane.


    # 7.6.5 The influence of different boundary conditions


    The effects of material properties and the random distributions of porosity and
    GPLs on boundary conditions are discussed in this subsection. The PDFs and CDFs
    of different boundary conditions for FBLs are presented in Figs. 7.6 and 7.7.
    As can be seen, there is hardly overlapping between different boundary conditions.
    The uncertainty range of C-C is the largest while C-F is the smallest.'
