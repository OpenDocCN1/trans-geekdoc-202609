    FG porous composite structures


    In fact, pioneer works regarding the uncertain structural behavior of FG structures
    have been investigated thoroughly in the past years, but limited concentrations
    are focused on the FGP structures with the consideration of nondeterministic system
    properties. For instance, Yang et al. [6] used the classical perturbation technique
    to calculate the uncertain response of FG plates with temperature loading conditions.
    Shaker et al. [7] considered the parametric sensitivity analysis upon natural
    frequency of functionally graded plates with the aid of first and second order
    reliability techniques. Subsequently, Sheokkar and Lal [8] adopted the first order
    perturbation method to evaluate the uncertain nonlinear behavior of advanced composites
    with the consideration of stochastic material properties. Considering the unique
    composition of FGP structures, the nondeterministic mechanical test against such
    material matters and needs to be investigated thoroughly.


    In this chapter, the stochastic free vibration of the FGP plates are considered.
    To obtain a robust and efficient quantification framework, the machine learning
    aided free vibration analysis (MLA-SFV) technique has been introduced for the
    FG plates through the stochastic finite element method (SSEM). Systematic properties
    of the composites can be considered and implemented into subsequently, the inherent
    relation between the input and structural vibration responses can be assessed
    through the two machine learning algorithms, namely the Gaussian process regression
    and the extended support vector regression (X-SVR). Moreover, polynomial kernels
    are used for the machine learning algorithms to enhance robustness and stability.
    By establishing the regression model, the fundamental frequencies of the FGP plate
    can be predicted with detailed statistical moments of the outputs. Reliability
    profiles [i.e., probability density function (PDF) and cumulative distribution
    function (CDF)] of the outputs can be acquired for effectively evaluating the
    structural safety for FGP plates through the theory of reliability. Different
    from the traditional uncertainty quantification methods, the MLA-SFV framework
    is capable of self-optimizing and self-updating with the varied syntactic inputs,
    also the computational efforts by using the framework can be greatly eliminated.
    Such advantageous features of the machine learning aided stochastic analysis framework
    could indeed provide some reference to the real-life composite structure applications.


