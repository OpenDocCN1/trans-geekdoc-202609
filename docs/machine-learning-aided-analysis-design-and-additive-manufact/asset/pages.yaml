    the elastic modulus $E$ is the slope at the elastic stage. The collapse stress
    $\sigma_{cr}$ is the first peak value after the plateau stage and the corresponding
    strain is the collapse strain $\varepsilon_{cr}$. The plateau stress $\sigma_{pl}$
    is defined as the average value of stress between the collapse and densification
    strain. The energy absorption method [3] is used to determine the densification
    strain $\varepsilon_D$. The energy absorption per unit volume $W$ is given by:


    ```

    $W = \int_{0} \sigma(z)dz.$

