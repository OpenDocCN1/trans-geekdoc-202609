    +   - Micromechanics models


    There are several micromechanical models to connect the micro-scale properties
    to macroscopic mechanical properties, such as the rule of mixture, shear theory
    [53], Halpin-Tsai model, Eshelby''s theory, and Mori-Tanaka model. These simplified
    models are based on specific assumptions and do not satisfy the actual demand
    of applications. For example, the influences of temperature, nanoreinforced materials,
    distribution between filler and matrix are not thoroughly considered in these
    models. Comprehensive experimental study and molecular simulations are needed
    to establish accurate and reliable micromechanics models.


    +   - Defects of FGP structures


    Although advanced additive manufacturing has been widely acknowledged for manufacturing
    scenarios that require flexibility, small-batch production, mass-customization
    applications, and functionally enhanced components, due to the uncertainty, unpredictability,
    and randomness in system parameters at different levels, the manufacture of FGPs
    using AM technology will unavoidably'
