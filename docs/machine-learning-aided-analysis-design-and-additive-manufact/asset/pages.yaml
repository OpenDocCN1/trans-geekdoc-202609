    # 9.1 Introduction


    Cellular materials are found extensively in nature [1,2] and have been widely
    used

    for high-performance devices and systems as sandwich panels and protective

    damping systems. In the past decade, a research frontier of cellular materials
    known

    as instability-based architected materials has created unusual properties such
    as

    negative Poisson'' ratio [3–6]. Specifically, architected materials are rationally

    designed materials that enable complex geometry and assembly of unit

    cells. Such programmability has been implemented at multiple scales

    [7–11]. However, most studies do only focused on the uniform and periodic

    terns. Recent advances in digital fabrication have made it possible to design
    and

    manufacture materials with arbitrary architectures that enable nonuniform properties

    and tunable responses can be achieved. Asymmetry of assembly, architecture, and
    nonuniform cells to enable target

    function at the structural level is trivial to design and such structural complexity

    will be a continuous challenge in the fields of architected materials [12].


    As the design of geometric patterns becomes, it is impossible for the

    conventional intuition-based method to feasible patterns of desired prop-

    across the entire domain. Motivated by these recent developments, we take

    initiative to apply machine learning (ML) techniques to accelerate the design
    and

    characterization of cellular materials. Emerging ML have revolutionized

    the way of doing research across all fields of study [13,14]. In material-

    cience, computation-based approaches help to gain insights into material

    behaviors and properties. Thanks to recent advances in computational power and

    robust algorithms, we have witnessed the rise of undiscovered field in comp-

    tational science [15,16]. Specifically, researchers have already shown suc-

    cess in using ML on two major categories: (1) to accelerate the prediction


