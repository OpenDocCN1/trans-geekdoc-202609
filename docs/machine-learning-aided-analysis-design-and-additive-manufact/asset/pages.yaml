    \n# 7.5 Surrogate model-based stochastic framework\n\nIn this section, a surrogate\
    \ model-based stochastic framework for FGGR porous beams is built by concerning\
    \ the random material properties, such as Young’s modules, mean density, the variance\
    \ of reinforcement grading profiles, and porosity coefficients.\n\n# 7.5.1 Chebyshev\
    \ metamodel\n\nA continuous one-dimensional function $f(x)$, defined on $[-1,1]$,\
    \ can be expressed in the terms of Chebyshev series expansion:\n\n```\n$f(x) =\
    \ f_0T_0(x) + f_1T_1(x) + ... + f_nT_n(x) + \\varepsilon \\n\\approx g(x) = f_0\
    \ + \\sum_{i=1}^{n} f_nT_i(x) \\quad (7.32)$\n```\n\n$\\varepsilon$ is the error\
    \ between target function $f(x)$ and the truncated Chebyshev series $g(x)$. For\
    \ the two-dimensional high order, CMM can be expressed as:\n\n```\n$f(x,y) = f_{0,0}T_0(x)T_0(y)\
    \ + f_{1,0}T_1(x)T_0(y) + f_{0,1}T_0(x)T_1(y) + ... + f_{n_1,n_2}T_{n_1}(x)T_{n_2}(y)\
    \ + \\varepsilon \\n\\approx g(x) = f_{0,0}T_0(x)T_0(y) + \\sum_{i_1=1}^{n_1}\
    \ f_{i_1,0}T_{i_1}(x) + \\sum_{i_2=1}^{n_2} f_{0,i_2}T_{i_2}(y) + \\sum_{i_1=1}^{n_1}\\\
    sum_{i_2=1}^{n_2} f_{i_1,i_2}T_{i_1}(x)T_{i_2}(y) \\quad (7.33)$\n```"
