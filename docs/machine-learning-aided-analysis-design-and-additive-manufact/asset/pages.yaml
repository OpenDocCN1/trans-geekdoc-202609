    # # 4.6 Conclusion


    In this chapter, free and forced vibrations of FG porous circular cylindrical
    shells are presented. In the linear free and forced vibration analysis, artificial
    springs are employed to simulate arbitrary boundary conditions. The Ritz method
    and the modal superposition method are adopted to solve the natural frequency
    and frequency response, respectively. Based on Donnell''s nonlinear shell theory,
    the nonlinear ordinary differential equations of FG porous cylindrical shells
    are derived using the Lagrange equations of motion. The method of multiple scales
    is employed to determine nonlinear frequencies of FG porous cylindrical shells.
    The forced vibration responses with internal resonance are solved by employing
    the pseudiarclength continuation technique. The results are concluded as follows:


    +   1. For relatively strong boundary constraints (such as C-C, S-S, and $k_n
    = 10^3$), the increase of porosity coefficient results in the decrease of natural
    frequencies, especially for small wavenumber numbers. However, for weak boundary
    constraints, the increase of porosity coefficient results in the increase of natural
    frequencies. The effect of porosity coefficient on fundamental frequency is significant
    for relatively strong boundary constraints (such as C-S-S and $k_n = 10^3$), but
    it is slight for weak boundary constraints characteristics.

    2. The PD-A shell processes the strongest nonlinear characteristics in nonlinear
    forced vibration of FG porous cylindrical shells, while the PD-B shell processes
    the weakest nonlinear characteristics.

    3. Porosity distribution and porosity coefficient can change the excitation amplitude
    required to excite the 1:1 internal resonance.

    4. Porosity distribution and porosity coefficient have coupled effect on the vibration
    characteristics of FG porous circular cylindrical shells.'
