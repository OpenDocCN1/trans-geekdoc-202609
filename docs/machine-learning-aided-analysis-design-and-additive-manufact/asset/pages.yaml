    instability of graphene-reinforced FG porous arches. Gao et al. [62] assessed
    the nonlinear free of FG porous nanocomposite plates resting on an elastic foundation.
    Dong et al. [63] revealed the vibration characteristics of reinforced FG porous
    cylinders with spinning motion. Wang et al. [64] focused on the free and forced
    vibration analyses of FG porous containing nonsymmetric or symmetric porosity
    distributions. Wu et al. [65] constructed an FG framework for the examination
    of porous structures and determined the dynamic features of a three-story-bay
    FG porous frame. Chen et al. [67] combined the FG homogenization and structural
    assessment in the multiscale modeling of FG porous beams and linked the cellular
    structures to overall mechanical buckling and vibration performances. Mohavedi
    et al. [66] addressed the quasistatic and dynamicions of FG metal foams and discussed
    their deformation mechanisms, plate stresses, energy efficiencies, etc. Chen et
    al. [53] built up FE models for FG porous structures with four graded morphologies
    and carried out the dynamic simulations to identify their energy absorption capacities
    under different impacts. Fan et al. [67] fabricated FG porous scaffolds via selective
    methods and explored their full compression responses numerically and experimentally,
    providing guidelines for topological porous lattice designs. Teimouri and Asgari
    [68] developed new FG porous and lattice structures using a topology optimization
    technique and evaluated the structural stiffness and crashing behavior by performing
    FE simulations and compression tests on adequately manufactured samples.


    Although the aforementioned publications individually presented a number of interesting
    perspectives on the underlying potential of this new composite form, a thorough
    summary is desired to unfold its past, present, and future to motivate the further
    advance, as given in this book.


    # 1.4 Chapters in this book


    This book covers various topics regarding the FG porous composite structures on
    the machine learning–aided analysis, design, and additive manufacturing, comprehensively
    address how to examine, shape, and fabricate with the latest techniques. The machine
    learning and additive manufacturing providing tremendous changes in the investigation
    and construction of complex geometries, opening a new window on the study of FG
    poros. Meanwhile, the traditional approach on the basis of potentially, plate,
    and shell theories associated with constitutive relations of porous media is commonly
    adopted for effective performance predictions. All these research strategies are
    employed here separately or jointly. In addition, the application potential of
    FG porous composite structures is specified. Therefore, this book endeavors to
    draw a big picture of the up-to-date research advances in this field by'
