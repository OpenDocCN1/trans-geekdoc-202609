    # ## 15.2 Specimen preparation


    # ### 15.2.1 Modeling of uniform foams


    The Voronoi model is well suited for real foams because its generation process
    is similar to the physical foaming process. Therefore it is used to build uniform
    foams [43]. Uniform foams with different cell sizes, ranging from 5 to 10 mm,
    are shown in Fig. 15.2. Specimens are marked by U5–U10, where U represents uniform
    foams followed by their average cell size. For instance, “U5” represents uniform
    foams with a cell size of 5 mm. All foams used in the quasi-static test are cubic
    with the side length of 50 mm. In the dynamic test, the specimen adhered to the
    impact bar is accelerated in the air gun, which is difficult for the high-speed
    camera to capture a specific plane of foams. Therefore in the dynamic test, the
    cross-section of the specimen is set as a cell with a diameter of 50 mm, and the
    height is the same as that used in the quasi-static test. At least five cells
    are included in all directions to avoid the size effect [45]. For each cell size,
    we build three specimens with different mesostructural geometries to support the
    reproducibility of experimental results.'
