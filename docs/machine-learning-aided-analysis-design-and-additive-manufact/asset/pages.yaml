    #  14.3.4 Lattice architectures


    Lattice architectures [63–66] have high designability. By optimizing the structural
    elements, improved mechanical properties, including specific strength and specific
    stiffness, can be achieved. This makes lattice architectures popular in structural
    lightweight design [67–75]. Moreover, the mechanical properties of lattice materials
    are also known as geometric configuration rather than chemical components, lattice
    materials are also mechanical metamaterials. While traditional manufacturing techniques
    fail to satisfy the requirement of designing lattice materials with complex configurations,
    this gap is posed to be filled by additive manufacturing technique [76–82].


    Abucciella et al. [63] focused on the cellular solids with tri periodic minimal
    surfaces (TPMS). They designed three TPMS architectures including Schwarz Primitive,
    Schoen I-wrapped cubic (IWP), and Neovius as shown in Fig. 14.17. They produced
    these models using SLS with polyamide 12 as the base material. They reported that
    IWP and Neovius architectures outperformed others in mechanical properties and
    both of them had higher stiffness and strength than the Primitive architecture.


    TPMS architectures were also investigated by Bonatti et al. [64]. They employed
    a parameterized surface-smoothing technique to derive three families of lattices
    including simple cubic (SC), face-centered cubic (FCC), and body-centered cubic
    (BCC) unit cells. They pointed out that the lattices can provide higher average
    stiffness, strength, and energy absorption capabilities than truss and lattices.
    In addition, shell lattices had geometric smoothness and the stress concentrations
    can be avoided. This better fatigue life and strength were expected to be obtained
    for shell lattices.


