    # ## 11.1 Introduction


    An advanced composite material with good performance in mechanical properties
    and functions, functionally graded materials (FGMs) are used in engineering fields,
    especially in areas such as mechanical and aviation [1]. In recent years, with
    the widespread usage of lightweight porous materials, more and more scholars have
    gradually focused their research on the properties of functionally graded porous
    (FGP) materials [2]. People’s understanding of FGPs becomes more precise with
    the deepening of research.

    While many potentials exist for the advanced composites, there are still many
    difficulties in the understanding of actual performance of materials under different
    conditions. For example, there is always a discrepancy between the real phase
    distribution of produced FGP structures and designed one owing to the inherent
    factors of uncertainty in the construction process [3]. Based on which the inevitable
    discrepancy results in actual material properties, evaluating the fundamental
    mechanical property (i.e., static response) of FGP structures. It is of great
    importance to assess the static analysis of FGP structures under various situations
    for the structural safety and maintenance purposes.

    Recently, and more researchers have focused on the FGP porous structure analysis
    and have gotten many achievements. Li et al. [4] investigated the buckling analysis
    of FGP arches with graphene platelets against uniform loads. Chen et al. [5] used
    the Timoshenko beam to study the bending performance of FGP beam under transverse
    pressure. Zhao et al. [6] considered the linear fiber vibration of FGP rectangular,
    annular plates by using the first-order shear deformation theory (FSDT) and Rayleigh–Ritz
    approach. In literature, different mechanical problems have been examined for
    the FGP beams, plates and shells, most of them concentrate on the deterministic
    structural analysis of FGP materials. That is, the inherent variations of'
