    dx_1 \cdots dx_k$

    \approx \left(\\frac{2^k}{p_1 p_2 \cdots p_k}\right)^{\eta} \sum_{j_1=1}^{p_1}
    \cdots \sum_{j_k=1}^{p_k} f(\cos\theta_{j_1}, \dots, \cos\theta_{j_k}) \cos\theta_{j_1},
    \dots, \cos\theta_{j_k}$

    ```'
