- pgno: 77
  md: "# Free and forced vibrations of functionally porous quadrilateral plates with\
    \ curved edges\n\nsome numerical examples are carried out to validate the convergence\
    \ and accuracy of CDQM first; then, the effects on structural behavior caused\
    \ by the porosity meter and distributions are comprehensively analyzed, and some\
    \ innovative results are obtained. With the purpose of verifying the versatility\
    \ of the current method for vibration of plates with curved edges, numerical results\
    \ of three typical plates are presented. In addition, several boundary conditions\
    \ including classic and elastic boundary constraints are adopted to increase the\
    \ richness of data. By introducing the virtual spring technique, the boundary\
    \ conditions, and considering values of springs as Table 3.1 [1,41].\n\nAs shown\
    \ in Fig. 3.4, geometric parameters of quadrilateral plate are $L_1, L_2$, in\
    \ terms, and interior angles $\\alpha_1,\\alpha_2,\\alpha_3,\\alpha_4$; the elliptical\
    \ plate is defined by the maximum and minimum diameter $a$ and $b$, respectively;\
    \ the geometry of truncated plate is determined by radius $(r)$ and the distance\
    \ $(d)$ from the center to the center. Boundary constraints applied to quadrilateral\
    \ plate follow the order of $L_1, L_2, L_3, L_4$, while those of truncated plate\
    \ are imposed in the order of curved edges and straight edges, the elliptical\
    \ has a single edge. Several types of materials and corresponding properties considered\
    \ here are:\n\n+   1. FM1: $E_1 = 200$ GPa; $\nu = 0.3; \rho_1 = 7850\text{kg/m}^3$\n\
    2. FM2: $E_2 = 70$ GPa; $\nu = 0.3; \rho_2 = 2700\text{kg/m}^3$\n3. FM3: $E_3\
    \ = 70$ GPa; $\nu = 0.3; \rho_3 = 2720\text{kg/m}^3$\n\n| BC | $k_u$ | $k_r$ |\
    \ $k_w$ | $K_x$ | $K_y$ |\n|---|---|---|---|---||\n| C | $10^4$ | $10^4$ | $10^4$\
    \ | $10^4$ | $10^4$ |\n| S | $10^4$ | | | | |\n| F | | | | | | |\n| SI | $10^4$\
    \ | $10^4$ | | $10^4$ | |\n| E | | $10^4$ | $10^4$ | $10^4$ | $10^4$ |\n\n![](img/90ed165a39fa708ec438fcda79319c25_77_0.png)"
