    # 1.3.2 Mechanical analysis


    Among many interesting aspects of FG porous composite structures, their superior
    mechanical behaviors have continuously been the focus of attention. To carry out
    the corresponding analysis, the effective material properties may serve as a starting
    point, where various models have been linked to the mesoscopic/microscopic geometric
    features (relative density mainly) with macroscopic parameters (such as Young’s
    modulus [49], including Meng–Kipsch model [43], Gibson–Ashley model [6,44], Christensen
    model [45], Roberts–Garbageci model [46], Chen model [47], and modified rule of
    mixture [48]. On the basis of these constitutive relations, the variations of
    material with respect to the graded properties can be identified and employed
    in the structural assessments within the framework of deformation theories: Tenshenko
    beam theory [49], first-order shear deformation of plate theory [50]; Domnell
    shell theory [51]. Consequently, the overall behaviors of FG porous structures
    are characterized by determining their critical buckling loads [49], static bending
    deformations [49], natural frequencies [52], forced vibration amplitudes [52].
    On the other hand, numerical simulations via finite element (FE) software are
    often adopted to directly construct the mesoscopic/microscopic features of graded
    cellular materials which is especially applicable for the energy absorption related
    to novel porous geometries under impacts [53–55]. Furthermore, various experimental
    works have been conducted on the manufacturing and mechanical testing of FG porous
    specimens [32,56,57].


    With the aid of these models and methods, the mechanical examination of FG porous
    composite structures has been an active area with intensive research focusing
    on the effects from graded properties on the structural performances. Chen et
    al. [49,52,58–60] systematically studied the bending, buckling, postbuckling,
    free'
