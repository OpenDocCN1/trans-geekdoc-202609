    In recent years, functionally graded (FGP) material has been increasingly applied
    in aerospace, medical devices, mechanical engineering, and other fields due to
    its unique advantages. Such material refers to a functionally graded material
    made of metal foam with pores, and its properties are affected by the type of
    pore distribution and the distribution gradient [1–3]. Compared with conventional
    homogeneous materials, FGP material has the advantages of low weight, high strength,
    excellent impact resistance, good thermal and acoustic insulation properties,
    and so on, which makes FGP materials ideal for structural elements such as beams
    and shells. Driven by the reality of engineering applications, the research on
    the free and forced vibration characteristics of FGP beams is a popular and valuable
    research topic currently.


    At present, the mainstream modeling and solution methods of FGP beam structure
    include finite element method, differential quadrature method (DQM), and Ritz
    method. Shafafi and Kazemi [6] used the generalized DQM to solve the buckling
    characteristics of a 2D FGP beam with variable section. Patil and Kadoli [7] also
    utilized DQM to establish an analytical model for bidirectional functionally graded
    beams considering pores. According to the Ritz method, Chen et al. [8] deduced
    the motion equation of the FGP beam with three types of porosity'
