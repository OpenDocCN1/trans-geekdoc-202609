- pgno: 41
  md: "Free and forced vibrations of functionally graded porous straight and curved\
    \ beams\n\nwhere the integer-valued vector of the Chebyshev polynomial v can be\
    \ expressed as:\n\n```\n$v_k = \\begin{cases} \\frac{2s}{1-k^2}, & k \\text{ even}\
    \ \\ 0, & k \\text{ odd} \\end{cases}$$\n```\n\nThe integral of multiplying three\
    \ functions is expressed in matrix form as:\n\n```\n$\\int_{-1} [f(\\varphi)]^2\
    \ R_{\rho}(\\varphi) d\\varphi = \\mathbf{f}^T \\mathbf{V}_{R_{\rho}} \\mathbf{f}$\n\
    ```\n\nin which\n\n```\n$\\mathbf{V}_{R_{\rho}} = diag(\\mathbf{c}^{-1} \\mathbf{R}_{\r\
    ho})$\n```\n\n$R_{\rho}$ is the vector of $R_{\rho}(\\varphi)$ at the Gauss–Lobatto\
    \ discrete points. According to the above formulations obtained by the spectral-Chebyshev\
    \ method, the translation and rotation displacement functions in Eq. (2.5) are\
    \ rewritten as:\n\n```\n$\\begin{bmatrix} u \\ v \\ \\theta \\end{bmatrix} = e^{-j\\\
    varphi} \\mathbf{C} \\begin{bmatrix} c \\ d \\ e \\end{bmatrix} = e^{-j\\varphi}\
    \ \\mathbf{C}q$\n```\n\nwhere the coefficients $c$, $d$, and $e$ are the coordinates\
    \ in the three directions, respectively, while $q$ denotes the generalized coordinate.\
    \ Similarly, the strain, kinetic, boundary springs, and external load energy expressions\
    \ can be reconstructed into matrix form.\n\nThe whole energy equation of FGP curved\
    \ beam subjected to external load can be expressed as:\n\n```\n$L = T - (U_e +\
    \ U_{\\theta}) + W_f$\n```\n\nBy substituting this energy equation into the Lagrange\
    \ equation, the expression in matrix form can be obtained as:\n\n```\n$(\\mathbf{M}\\\
    omega^2 - \\mathbf{K} - \\mathbf{K}_s)\\mathbf{q} = \\mathbf{F}$\n```\n\nwhere\
    \ $\\mathbf{M}$ and $\\mathbf{K}$ are the mass matrix and stiffness matrix of\
    \ the system, $\\mathbf{K}_s$ is stiffness matrix, $\\mathbf{F}$ represents force\
    \ vector, and $\\omega$ denotes the circular frequency. The specific vectors and\
    \ matrices can be expressed as:\n\n```\n$$\\mathbf{K} = \\begin{bmatrix} A_{11}q^T\\\
    mathbf{V}_{R_{\rho}}^T\\mathbf{Q} + A_{55}q^T\\mathbf{V}_{R_{\rho}}^T\\mathbf{LC}\
    \ & A_{11}q^T\\mathbf{V}_{R_{\rho}}^T\\mathbf{C} - A_{55}q^T\\mathbf{V}_{R_{\r\
    ho}}^T\\mathbf{Q} & B_{11}q^T\\mathbf{V}_{R_{\rho}}^T\\mathbf{Q} - A_{55}q^T\\\
    mathbf{V}_{R_{\rho}}^T\\mathbf{VC} \\ A_{11}c^T\\mathbf{V}_{R_{\rho}}^T\\mathbf{LC}\
    \ - A_{55}c^T\\mathbf{V}_{R_{\rho}}^T\\mathbf{Q} & A_{11}c^T\\mathbf{V}_{R_{\r\
    ho}}^T\\mathbf{C} + A_{55}c^T\\mathbf{V}_{R_{\rho}}^T\\mathbf{Q} & A_{55}c^T\\\
    mathbf{V}_{R_{\rho}}^T\\mathbf{VC} + B_{11}c^T\\mathbf{V}_{R_{\rho}}^T\\mathbf{Q}\
    \ \\ B_{11}q^T\\mathbf{V}_{R_{\rho}}^T\\mathbf{Q} - A_{55}q^T\\mathbf{V}_{R_{\r\
    ho}}^T\\mathbf{VC} & A_{55}q^T\\mathbf{V}_{R_{\rho}}^T\\mathbf{VC} + B_{11}q^T\\\
    mathbf{V}_{R_{\rho}}^T\\mathbf{Q} & D_{11}q^T\\mathbf{V}_{R_{\rho}}^T\\mathbf{Q}\
    \ + A_{55}q^T\\mathbf{V}_{R_{\rho}}^T\\mathbf{VC} \\\\end{bmatrix}$$\n```"
  merge: -1
  img_proc: true
- pgno: 42
  md: "\\mathbf{M} = \\begin{bmatrix} I_0C^T V_{R_0}C & I_1C^T V_{R_1}C & 0 \\ I_1C^T\
    \ V_{R_0}C & I_0C^T V_{R_1}C & 0 \\ 0 & 0 & I_2C^T V_{R_2}C \\end{bmatrix} \\\
    quad (2.33)\n\n\\mathbf{K}_0 = \\begin{bmatrix} k_0^0 C^T(\\varphi_0)C(\\varphi_0)\
    \ & 0 & 0 \\ 0 & k_0^1 C^T(\\varphi_0)C(\\varphi_0) & 0 \\ 0 & 0 & k_0^2 C^T(\\\
    varphi_0)C(\\varphi_0) \\end{bmatrix} + \\begin{bmatrix} k_1^0 C^T(\\varphi_1)C(\\\
    varphi_1) & 0 & 0 \\ 0 & k_1^1 C^T(\\varphi_1)C(\\varphi_1) & 0 \\ 0 & 0 & k_1^2\
    \ C^T(\\varphi_1)C(\\varphi_1) \\end{bmatrix} \\quad (2.34)\n\n\\mathbf{F} = \\\
    begin{bmatrix} F_0\\delta(\\varphi_2) \\ 0 \\end{bmatrix} \\quad (2.35)\n\n$(\\\
    mathbf{M}\\omega^2 - \\mathbf{K})\\mathbf{q} = 0 \\quad (2.36)\n\n# 2.3 Result\
    \ and discussion\n\nIn this section a unified model of FGP straight and curved\
    \ beams is established, the main purpose of which is to study the free and forced\
    \ vibration characteristics of FGP beams with various material and geometric parameters.\
    \ A series of numerical examples are provided to test the convergence, reliability,\
    \ and accuracy of the formulations in the previous section. Three classical boundary\
    \ conditions are considered, including simply supported, and free support, which\
    \ are denoted by symbols of C, S, F, respectively. For case of understanding,\
    \ the boundary conditions the FGP beam at $x=0$ and $x=L$ are connected together\
    \ to each boundary condition which is referred to by values of boundary stiffness\
    \ corresponding to Ref. [30]. To facilitate subsequent analysis and reduce uncertainties,\
    \ the geometric parameters of straight and curved beams are uniformly given as:\
    \ (a) straight beam: $L=1$ m, $h=0.1$ m, and $b=0.05$ m; (b) curved beam: $L=2$\
    \ m, $\\varphi_0=30$ degrees, $\\varphi_1=150$ degrees, $h=0.1$ m, and $b=0.05$\
    \ m; (c) elliptical beam: $a=1.5$ m, $b_v=1$ m, $\\varphi_0=0$, $\\varphi_1=\\\
    pi$, and $b=0.05$ m. Unless otherwise indicated, the dimensionless frequency is\
    \ calculated by $\\Omega = \\omega L^2\\sqrt{\rho_{max}/E_{max}}$, and the material\
    \ of FGP beams is assumed to be open-cell aluminum foam with $E_{max}=70$ GPa,\
    \ $\rho_{max}=2702$ kg/m$^3$, $v=0.3$."
