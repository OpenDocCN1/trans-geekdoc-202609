    Again, the results obtained by the present model, when thickness stretching is
    neglected, correlate with these obtained by the HSDT solution [35]. The HSDT model
    underestimates the frequencies of thick FG beams due to the stretching omitted
    by the HSDT formulation in the FG beam''s case. It is emphasized that in the HSDT
    [35] formulation, the unknown number is greater than that by the present model.


    The dimensionless frequency variation versus material parameter for an (L/h=5)
    and without taking a count of the thickness stretching is plotted in Fig. 8.12A.
    The plot shows that increasing (p) leads to a decrease of the frequencies. The
    highest frequency is achieved for (p=0, completely ceramic beam), and the lowest
    for (p→∞, completely metal beam). This can be explained by the fact that (p) leads
    to a decrease in the amount of ceramic in the mixture, which is replaced by the
    decreasing density of Young''s modulus that makes the beam softer. In this composition,
    the density of the metal is greater than the density of ceramic and the total
    mass of the FG beam increases by increasing the metal proportion in the beam,
    which makes it softer. Therefore, the frequency decreases by increasing the material
    index (p).


