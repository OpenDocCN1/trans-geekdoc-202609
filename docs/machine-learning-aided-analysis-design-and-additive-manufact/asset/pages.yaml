  md: 'the thickness and length of the beam. It is concluded that the proposed porosity
    distribution increases the linear and nonlinear natural frequencies in comparison
    to the conventional porosity distribution. Chen et al. [10] investigated the free
    and forced vibration of FG beams with nonuniform porosity distribution. It was
    found that larger porosity coefficient results in higher dynamic deflection. Nonlinear
    free vibration behavior of FG thin plates with porosities based on the classical
    plate theory was studied by Wang et al. [28]. Both even and uneven porosity distributions
    were considered. They concluded that the effect of porosity resonance reduces
    the region but that enhances the dynamic response. Anridh et al. [4] studied vibration,
    buckling, and bending of FG porous beams graphene-reinforced nanocomposite (graphene
    plateletslets, GPL/s) curved beams with a geometric shear deformation theory.
    It was found that the type of weight distribution of graphene-reinforced nanocomposite
    impacts the beam affine stiffness. The literature shows that porosity distribution
    can have a significant effect on mechanical response of structures; however, the
    effect of the that functional distribution is relatively unchanged.


    The aim of this research is to investigate the effects of higher porosity distributions
    (unidirectional and bidirectional) on the buckling, free, and forced vibration
    of porous beams. For this purpose, a mathematical model is developed using the
    Hamilton principle considering the third-order deformation theory and Karman geometrical
    nonlinearity. The Galerkin technique and harmonic balance method (HBM) are utilized
    to obtain a closed-form approximate solution. Correctness and accuracy of the
    presented methodology are verified with the literature. Subsequently, a thorough
    investigation is presented to discover the effect of the bidirectional and unidirectional
    porosity distributions on the critical buckling load and free vibration response
    of porous beams. It is found that bidirectional porosity distribution (BPD) has
    better buckling and vibration performance and these performances can even be improved
    if the high-order porosity distributions are used.


    # 6.2 Porous materials with graded porosities


    It is assumed that the beam is made of open-cell foam with two types of porosity
    distributions: bidirectional and unidirectional porosity distributions. For the
    BPD, voids are distributed unevenly along the thickness (z axis) and the length
    (x axis) of the beam. Meanwhile for the unidirectional porosity distribution (UPD),
    voids are only distributed along the thickness of the beam. The volume fraction
    of porosity is location-dependent and generally can be defined by [3]:


    ```

    $V_p = \lambda\alpha$

