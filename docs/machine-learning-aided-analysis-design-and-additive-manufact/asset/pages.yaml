  md: 'Free and freed vibrations of functionally graded porous cylindrical shells


    The strain vector ε is expressed as:


    $$\varepsilon = [\varepsilon_x, \varepsilon_{\theta}, \varepsilon_{x\theta}, \kappa_x,
    \kappa_{\theta}, \kappa_{x\theta}]^T \quad (4.9)$


    where $\varepsilon_x, \varepsilon_{\theta}$ denote the middle surface strains
    and $\kappa_x, \kappa_{\theta}$ denote the middle curvature surfaces. According
    to Sanders'' theory, the strain–displacement relation and the curvature changes
    of the middle surface can be expressed as:


    ```

    $$\varepsilon_x = \frac{\dot{u}}{L\eta}}$$

    $\varepsilon_{\theta} = \frac{1}{R}\frac{dw}{d\theta} - \frac{w}{R}$\n$\varepsilon_{x\theta}
    = \frac{1}{R}\frac{du}{d\theta} + \frac{\dv}{L\eta}} \quad (4.10)$

    ```


    ```

    $$\kappa_x = -\frac{\ddot{w}}{L^2\eta^2}}$$\n$\kappa_{\theta} = -\frac{1}{R^2}\frac{\partial^2w}{d\theta^2}
    - \frac{1}{R}\frac{\dot{w}}{R}$\n$\kappa_{x\theta} = -\frac{1}{R^2}\frac{\partial^2u}{d\theta^2}
    + \frac{2}{RL}\frac{\partial v}{d\theta} - \frac{2}{RL}\frac{\dot{\eta}}{R\\eta}}
    \quad (4.11)$

    ```


    The stress matrix S in Eq. (4.8) is given by:


    $$\begin{bmatrix} A_{11} & A_{12} & 0 & B_{11} & B_{12} & 0 \ A_{12} & A_{22}
    & 0 & B_{12} & B_{22} & 0 \ 0 & 0 & A_{66} & 0 & 0 & B_{66} \ B_{11} & B_{12}
    & 0 & D_{11} & D_{12} & 0 \ B_{12} & B_{22} & 0 & D_{12} & D_{22} & 0 \ 0 & 0
    & 0 & D_{66} & 0 & D_{66} \end{bmatrix} \quad (4.12)$


    where $A_{ij}, B_{ij}$ and $D_{ij}$ ($i, j=1, 2, 6$) denote the elements of extensensional,
    extensional-coupling, and bending matrices, respectively. They are defined as:


    ```

    $A_{ij} = \int_{-h/2}^{h/2} Q_{ij}dz, B_{ij} = \int_{-h/2}^{h/2} zQ_{ij}dz, D_{ij}
    = \int_{-h/2}^{h/2} z^2Q_{ij}dz \quad (4.13)$

    ```


    $Q_{ij}$ in Eq. (4.13) is the element of stress-strain matrix, which can be determined
    by:


    ```

    $Q_{11} = Q_{22} = \frac{E(z)}{1-\mu(z)^2}, Q_{12} = \frac{\mu(z)E(z)}{1-\mu(z)^2},
    Q_{66} = \frac{E(z)}{2(1+\mu(z))} \quad (4.14)$

    ```'
