- pgno: 43
  md: "# 2.3.1 Convergence study\n\nConsidering that the computational accuracy of\
    \ the present model is strongly related to the truncation number of the Chebyshev\
    \ polynomial, the convergence of the proposed calculation method with respect\
    \ to the truncation number $N$ that can satisfy both the computational accuracy\
    \ and the computational efficiency is determined accordingly. Convergence study\
    \ for the first three dimensionless frequency parameters of FGP straight beam,\
    \ circular- and elliptical-curved beam with distribution Type I and the porosity\
    \ coefficient of 0.5 is carried out in Table 2.1. As the truncated number increases\
    \ from 10 to 50, the dimensionless frequencies of straight beams, circular, and\
    \ elliptical beams all converge rapidly, and the convergence speed of elliptical\
    \ beams is slower than others. The present method has excellent convergence for\
    \ the three types of beam structure. When the truncated number $N$ is greater\
    \ than 30, the dimensionless frequency converges to a certain value. Therefore\
    \ the truncated number $N$ will be taken as 30 in this following research.\n\n\
    # 2.3.2 Validation\n\nAfter verifying the convergence of the current method, to\
    \ further prove the effectiveness, accuracy, and generality of the present method\
    \ and to enrich the research data, a number of comparative studies for the first\
    \ and forced vibration solution of the FGP straight beam and curved beam are shown.\
    \ To conduct a comprehensive and sufficient verification, the comparative study\
    \ mainly includes two parts: free vibration characteristics and forced vibration\
    \ characteristics. The comparison object of the first part includes literature\
    \ and Abaqus, while the latter is Abaqus. The examples listed in each part are\
    \ performed in the order of straight beams, circular-curved beams, and elliptical-curved\
    \ beams.\n\nFirstly, the dimensionless fundamental frequencies of FGP straight\
    \ beams ($l = 1$ m) with different material and parameters under different boundary\
    \ conditions are calculated by the present method. At the same time, the corresponding\
    \ results from Refs. [8,30] are listed for comparison, as in Tables 2.2–2.4. The\
    \ first-order dimensionless natural frequencies with the results of previous literature,\
    \ considering the factors including different porosity coefficients, porosity\
    \ distribution types, and boundary conditions. Table 2.3 shows the comparison\
    \ of different slerness ratio with $E = 200$ GPa, $\rho = 7850$ kg/m³, $\nu =\
    \ 0.3$. The differences of the results in Tables 2.2 and 2.3 are all small and\
    \ within a reasonable range. To be more comprehensive, Table 2.4 presents the\
    \ comparison results of the first-order dimensionless frequencies of straight\
    \ beams with different slerness ratio. The comparison difference in the table\
    \ illustrates the good accuracy of the method when applied to FGP straight beams.\
    \ Then, according to the FGP circular-curved beams, the dimensionless fundamental\
    \ frequency parameters with different porosity coefficients under C and C-F boundary\
    \ conditions, are calculated by the present and reference"
  merge: -1
  img_proc: true
