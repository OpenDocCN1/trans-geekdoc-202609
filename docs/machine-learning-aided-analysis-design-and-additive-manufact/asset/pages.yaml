    # 3.2.3 Spectral Chebyshev method


    In this chapter, the energy energies of FGP plates with complex curved edges are
    related to displacement fields and the computational strains and stresses in the
    square area the computational domain by a one-to-one mapping method [29,40] as
    shown in Fig. 3.2. Then the strain and kinematic equations are expanded with the
    Chebyshev polynomials of first kind. As a result, the problems of structural vibration
    can be easily solved.


    A typical coordinate transformation with $5 \times 5$ mapping points used herein
    is exhibited in Fig. 3.3, the corresponding shape functions are:


    ```

    $x = \sum_{i=1}^{n} \sum_{j=1}^{m} N_{ij}(\xi, \eta)x_{ij}, \quad y = \sum_{i=1}^{n}
    \sum_{j=1}^{m} N_{ij}(\xi, \eta)y_{ij} \quad (3.14)$

    ```


    where $x_{ij}$ and $y_{ij}$ are coordinates values of the mapping points in the
    $x$- $y$ coordinate system, $i$ and $j$ denote the sequence number of mapping
    points in the $x$ and $y$ directions, separately; $m$ and $n$ are the total number
    of mapping points in the $x$ and $y$ directions. $N_{ij}$ represents the basis
    function of the mapping method, the formulation is:


    ```

    $N_{ij}(\xi, \eta) = L_{i}^{m}(\xi)L_{j}^{n}(\eta) \quad (3.15)$

    ```


    ```

    $L_{i}^{m}(\xi) = \prod_{\rho \neq i}^{m} \frac{\xi - \xi_{\rho}}{\xi_i - \xi_{\rho}},
    L_{j}^{n}(\eta) = \prod_{\rho \neq j}^{n} \frac{\eta - \eta_{\rho}}{\eta_j - \eta_{\rho}}
    \quad (3.16)$

    ```


    ![](img/90ed165a39fa708ec438fcda79319c25_71_0.png)


    Figure 3.3 Mapping schematic.'
