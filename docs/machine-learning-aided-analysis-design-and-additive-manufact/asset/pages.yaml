    # ## 16.5 A predictive model of graded foam-filled tubes


    # ### 16.5.1 The existing predictive model of foam-filled tubes


    As mentioned above, the bearing capacity of FFT is supported by three components:
    thin-walled tube, foam, and the interaction between the two. Therefore a model
    is developed to predict the compressive force of FFTs, where the thin-walled tube
    part is related to its configuration, the foam part is related to its relative'
