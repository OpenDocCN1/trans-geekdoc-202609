- pgno: 161
  md: '# 5.2.5 Solving procedure


    The Lagrangian energy function under general boundary conditions can be expressed
    as:


    ```

    $L = U_s + U_{ip} + U_g - T - W_f \quad (5.30)$

    ```


    Substituting Eq. (5.13), (5.14), and (5.16)–(5.18) into Eq. (5.30) and performing
    variational operations on the unknown coefficients, a linear equation system can
    be yielded, which can be sorted and matrixed to obtain the vibration characteristics
    of the system, namely:


    ```

    $(\mathbf{K} - \omega^2\mathbf{M})mathbf{Q} = F \quad (5.31)$

    ```


    where **M** stands for the matrix of FGP shallow shells, **K** is the stiffness
    matrix, **F** represents the external excitation force vector acting on the shallow
    shell. **Q** represents the generalized coordinate vector. When no external force
    is applied to the shallow shell (i.e., the force vector in Eq. (5.31) is set as
    the zero vector), the generalized eigenvalue Eq. (5.30) required for free vibration
    analysis can then be obtained. The related dynamic equation can be stated as:


    ```

    $(\mathbf{K} - \omega^2\mathbf{M})mathbf{Q} = 0 \quad (5.32)$

    ```


    In this study, four types of loads including the rectangular, triangular, half-sine,
    and exponential pulse are mainly considered for the forced vibration analysis,
    the mathematical definition of which can be written as [47]:


    ```

    $Rectangular: F_r(t) = \begin{cases} f_r & 0 \le t \le \tau \ 0 & t > \tau \end{cases}$

    ```


    ```

    $Triangular: F_t(t) = \begin{cases} \frac{2t}{\tau}f_t & 0 \le t \le \frac{\tau}{2}
    \ -2(\frac{t}{\tau} - 1)f_t & \frac{\tau}{2} \le t \le \tau \ 0 & t \ge \tau \end{cases}$

    ```


    ```

    $Half-sine: F_s(t) = f_s\sin(\frac{\pi t}{\tau}) \begin{cases} & 0 \le t \le \tau
    \ 0 & t > \tau \end{cases}$

    ```


    ```

    $Exponential: F_e(t) = \begin{cases} f_ee^{-\frac{t}{\tau}} & 0 \le t \le \tau
    \ 0 & t > \tau \end{cases} \quad (5.33)$

    ```'
