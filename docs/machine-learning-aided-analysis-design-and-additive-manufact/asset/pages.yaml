  md: 'increase the level of variability from sources. Structural failure accidents
    caused by manufacturing defects are constantly reported in recent news (3adeept.com,
    2021 and fabbaloc.com, 2019), which cost billions of dollars in damage and loss
    of life annually (Automation.com, 2021). Despite its practical importance, however,
    little research has been conducted to assess the effects of uncertainties in designing
    lightweight structures. The resulting lack of understanding the influence of uncertainties
    may result in the practical application of novel material-structural forms, thus
    limiting the full exploration of advanced manufacturing technologies. Therefore
    it is of significant importance to consider the imperfection of FGP materials
    and quantify or detect the defects or vacancies at an early stage of designing
    FGP structures.


    # 17.4 Summary and concluding remarks


    The applications of composite structures made of FGP materials have been comprehensively
    summarized in a wide range of engineering fields, which clearly shows that FGP
    materials have broad application prospects in the future. New applications for
    FGP materials are emerging across civil engineering for protective layers, space
    engineering for lightweight aircraft, biomedical engineering for implants and
    scaffolds, etc., attracts billions of dollars investment from industry and academia.
    Nano-reinforced FGP materials further promote the development of new generation
    lightweight structures. The review covers six important application sectors and
    the existing application examples; potential application possibilities are proposed.
    The key technical gaps and future research directions have also been identified
    and highlighted;


