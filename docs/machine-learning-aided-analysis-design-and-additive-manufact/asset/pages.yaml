  md: 'reinforced plastics, aluminum alloy, and different filling steels (e.g., empty,
    honeycomb filling, and foam filling). However, foams of FFT with uniform density
    distribution cannot adapt the mechanical response of the loading end and supporting
    end to the specific load condition [30–34]. This made foams-filled tubes (FFFTs)
    popular in recent research in energy absorption.


    Since it is difficult to achieve quantitative and controllable preparation of
    foams, there are few reports on the specimen preparation and experimental study
    of GFFTs [35–43] can obtain a priori conclusions with a small cost in time and
    resources, guiding the specific experimental design and engineering applications.
    For example, Sun et al. [38] show that the structural crashworthiness of FFTs
    can be optimized by employing gradient distribution of foam density. Nighi et
    al. [43] simulated various gradient functions on FFTs and investigated the energy
    absorption diagram. Energy absorption capacities of different kinds of GFFTs have
    been compared to the optimal crashworthiness of GFFTs. It is important to note
    that the solid element is employed to simulate the internal structure and mesoscopic
    mechanism of foam and cannot accurately capture the interaction between the cell-wall
    structure of the foam and the thin-walled structure of the tube. Furthermore it
    is difficult to obtain the deformation mechanism of GFFTs and may exhibit incorrect
    physical phenomena. This indicates that mesoscopic finite element analysis is
    needed to overcome the shortcomings of the solid element modeling method.


    Furthermore, additive manufacturing (AM) enables the accurate fabrication of cellular
    structures with complex mes geometries. Many researchers have been working on
    actively manufactured cellular materials, such as metallic microlattices [44],
    cellular composites [45], auxetic cellular structures [46], polymer-derived ceramics
    [47], octet truss lattice materials [48], and smooth-lattices [49]. Using the
    mesoscopic method, AM can produce the corresponding specimen, making the mesoscopic
    geometric structure of specimens in simulation and experiment. Using mesoscopic
    finite element analysis and AM technique, this chapter serves two purposes. First,
    this work employs the AM technique according to the predetermined geometric FFTs,
    tubes with different cell sizes and foams with gradient configurations are all
    fabricated and tested under quasi-static compression. The compressive behavior
    is then reported on the experimental results. Exact geometric models used for
    the experiment are applied to the mesoscopic finite element analysis. This numerical
    work is carried out to simulate the interaction between the cell-wall structure
    of the foam and the thin-walled structure of the tube of FFTs. The obtained results
    will effectively guide the material and structural combination of energyabsorbing
    components in future engineering applications.


    The structure of this chapter is as follows. Section 16.2 introduces the preparation
    of the specimen and the settings of the mesoscopic finite element method.'
