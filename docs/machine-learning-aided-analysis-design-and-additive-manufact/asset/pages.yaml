  md: 'Compared with FGP straight beams, the research on FGP curved beams has only
    paid more and more attention recently proposed a general theoretical model for
    FGP straight and curved beams considering a variety of elastic boundaries, which
    is suitable for parametric studies. Sayyad et al. [31] provided an analytical
    solution to solve the free vibration characteristics of FGP circular beam under
    supported boundary conditions, and obtained better accuracy. Functionally graphened
    nanoplatelets-reinforced composites have received increasing attention due to
    the obvious improvement of the static and dynamic vibration characteristics of
    the arch [32–36]. Li et al. [37,38] investigated the linear and nonlinear stabilization
    mechanisms of arches, which are composed of FGP graphene nano-reinforced composites,
    and provided a series of parametric analysis for buckling loads. Furthermore,
    a temperature field was added to model the effect of temperature parameters on
    the bearing capacity of the arch [39]. On the basis of triangular shear deformation
    theory, functionally reinforced curved beams. Ganapati et al. [40] investigated
    the vibration and dynamic properties of functionally grained piezoelectric materials
    with pores, Su et al. [41] focused on the effect of porous material properties
    on the transient response of deep curved beams.


    Summarizing the existing research, the following conclusions can be drawn: in
    the published literature, research on the vibration characteristics of FGP straight
    beams has been very rich. For the FGP curved beam, as a general structure, there
    are related studies, especially for the dynamics of elliptical-curved beam. At
    the same time, there is a lack of a unified model that can solve multiple beam
    structures at the same time, which is convenient for simulating practical engineering
    applications. In addition, improving the computational efficiency of the model
    is still a research direction needs attention. Therefore, the primary purpose
    is to develop a unified analytical model for FGP straight and curved beams considering
    both symmetric and non-symmetric porosity distribution forms. The motion equations
    of FGP straight and curved beams are deduced using the spectral-Chebyshev method
    and Timoshhenko beam theory, then the vibration response is solved by the Newmark–β
    method. On this basis, the reliability and validity of the model are verified
    by comparison with the results of literature and finite element software, with
    the free vibration and forced vibration characteristics of three structural forms
    of FGP straight beam, circular-curved beam, and elliptical-curved beam are studied.


