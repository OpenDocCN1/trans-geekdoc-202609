    # 17.2.5 Defense engineering applications


    Porous materials have a good function of heat dissipation and impact energy absorption
    and can attenuate the pressure wave of intensity to achieve the effect of explosion-proof,
    which has a high application value in the field of defense engineering. Fig.17.15
    shows porous foamed materials that are not only to make anisotropic components
    on the side and front of armored vehicles impact protection materials also blast-
    and bulletproof devices for highly secured environments Romano proposed the 3D
    sandwich panels (Fig.17.16) for locating impact resistance applications, armored
    vehicles, and that the convex composite panels can absorb a similar amount of
    energy through plastic deformation with projectile impacts up to 200 m/s. In military
    aviation, aluminum foams are used to fix effect in aircraft carrier to reduce
    the rebound effect by more than 50% when the aircraft lands in the aircraft carrier,
    and aluminum foams equipment attached to a parachute land safely in heavy equipment
    air drops, which are presented by Refs. [44,45]. Moreover, porous materials signify
    the suppression of combustible gas. Wu et al. [46] studied the suppression effect
    of porous media on natural gas explosion by experiment. They determined that the
    sidewalls of the gas compartment made with porous media can have a certain explosion
    suppression effect, which is further improved with the increase of porous media
    thickness, and the least decay ratio of maximum overpressure is 8.05%.'
