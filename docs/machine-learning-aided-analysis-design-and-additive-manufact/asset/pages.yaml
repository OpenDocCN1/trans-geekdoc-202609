    can be explained by the successive deformation mode of graded foams since they
    always deform from the weakest layer to the strongest one. When a weaker layer
    is compressed, the mechanical response would stay at the plateau of the current
    layer. After the weaker layer totally collapses, a stronger layer continues to
    sustain the applied load, and the mechanical response follows a new plateau stage
    in the current layer. This behavior behaves continuously from the weakest region
