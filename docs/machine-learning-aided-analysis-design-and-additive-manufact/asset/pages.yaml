    # Conclusions


    In this paper, a refined beam theory is performed for bending vibration of the
    thick FG beams, taking into consideration thickness stretching. The transverse
    displacement is assumed to be the sum of three components, bending, and stretching
    of the thickness. This leads to reducing the number of parameters, therefore the
    number of governing equations. By using a mixing law, the FG beam effective material
    characteristics are supposed to change continuously along the direction depending
    on the volume proportion of the constituents. The governing equations are obtained
    from Hamilton''s principle and are solved by Navier solutions.


    Both the analytical and numerical results obtained in this article agree with
    those obtained with other theories with varying parameters. Sensitivity analysis
    has been performed for the thickness stretching, the main parameter and the beam
    slenderness. For this investigation, the shortest beams exhibited the greatest
    thickness-stretching impact, and this needs to be taken into consideration in
    more physically realistic simulations. Geometry and material parameters affect
    the vibrational responses of the FG beams. Finally, it is observed that the proposed
    higher-order shear and normal deformation theory is not only accurate but also
    provides an elegant and easily implementable approach for simulating beam and
    vibration behaviors of FG beams, of relevance, for example in structural design.
    The formulation itself particularly well to finite element simulations and also
    to other numerical methods employing symbolic computation for beam-bending problems,
    which will be considered in the near future. Further applications of our refined
    FG beam are planned in another contribution to consolidate our approach.


