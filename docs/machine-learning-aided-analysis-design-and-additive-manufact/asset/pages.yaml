    \n# 11.4.3 Artificial neural networks\n\nAs one compelling method, the ANN model\
    \ analysis method can be commonly used in various generics which provide only\
    \ little input information. The ANN model can get the expected outputs and results\
    \ by being trained to learn from it. Recently, many papers have proved that the\
    \ ANN models are an excellent tool for approximation and interpolation in actual\
    \ engineering applications.\n\nThe ANN is also called a neural network (NN), an\
    \ interconnected group of neurons to analyze the provided information by a mathematical\
    \ model or computational model. The most important part of the ANN method, learning\
    \ can help the ANN models to update the weight parameters at the interconnection\
    \ level of the neurons. The ANN models can be used to analyze different independent\
    \ data and predict the output for values that are different from the examples.\
    \ For example, ANN model is established by implementing the feedforward and backward\
    \ propagation (BP) algorithm based on the MATLAB® R2021b tool. BP training algorithm\
    \ has been adopted for the system it can reduce the mean squared error between\
    \ desired output and actual result. Levenberg-Marquardt (L-M) has been frequently\
    \ used as the training equation to handle diverse optimization problems.\n\nFor\
    \ instance, about the stochastic system, the Young's modulus, Poisson's ratio\
    \ can be taken as input data, and the structural response output for training\
    \ process. After number trials, the basic NN configuration is selected to have\
    \ 10 hidden layers and the number of neurons in a hidden layer is decided as shown\
