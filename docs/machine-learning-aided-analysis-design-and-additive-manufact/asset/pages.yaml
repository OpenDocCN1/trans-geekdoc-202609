    This indicates that the indeterminate impacts stiffness more significantly than
    the low-density layer one, despite the obvious difference in the layer thickness,
    is, the high-density layer is thicker than its low-density counterpart. The design
    of this FG porous beam is rather similar to a sandwich configuration, and hence
    the strong facings contribute to the overall structural rigidity in a more effective
    manner than the soft lightweight core.


    # 10.4 Conclusions


    This chapter proposes a novel framework for AI-enhanced multiscale modeling of
    FG porous structures. A database contains FE RVES with various cell morphologies
    and corresponding to the practical closed-cell aluminum foams. The deep learning
    CNN model is designed and trained to predict the effective Young''s modulus of
    RVEs simply based on their images. The structural uncertainty originated from
    CNN results (~5.926%) is revealed with a bending assessment on the FG porous three-layer
    beam. The findings show that the developed method has a great potential to quickly
    and accurately evaluate the structural performance according to the mesoscopic
    characteristics of foams extracted from images, bypassing the detailed mechanical
    modeling. The consequent behavior can be quantitatively measured.


    In the study here, 2D images provide a relatively easy path for the establishment
    of the relationship between foam morphologies and properties. However, 3D analysis
    generally gives more in-depth insights into micro- and macroproperties of cellular
    composites and the connection may also be captured by CNN models. This will be
    included into the future research.


