    # 2.4 Conclusion


    Based on the Timoshenko beam theory and spectral-Chebyshev method, a unified analysis
    of FGP straight and curved beams is established to deal with the free and forced
    vibration behaviors of FGP straight and curved beams under general boundary conditions.
    Using typical straight beams, circular-, and elliptical-curved beams as examples,
    we compared the results of free and forced vibration characteristics, which were
    solved using the spectral-Chebyshev model proposed, with the published literature
    and finite element results. Our findings indicated good convergence between these
    various methods. Our results were positively evaluated in terms of convergence,
    reliability and accuracy. In addition, the computational efficiency of the method
    has been verified to be high. The following conclusions can be drawn from a large
    number of parametric studies.


    +   1. Comparing the two porosity types, the peaks of the state-steady and transient
    displacement responses of the FGP beams with the symmetrically distributed porosity
    are smaller than those of the beam with the asymmetrically distributed porosity,
    which can improve the mechanical properties of the FGP beam, especially for the
    elliptical beam.

    2. As the porosity coefficient increases, the fundamental frequency of the FGP
    beam decreases, while the peak of displacement response increases. This phenomenon
    is more pronounced when calculating the vibration characteristics with non-symmetric
    porosity distributions.

    3. The slenderness ratio is decisive for the free and forced vibration characteristics
    due to its significant effect on the stiffness of the FGP beam. Thicker beams
    have large natural frequencies and smaller displacement response peaks.


