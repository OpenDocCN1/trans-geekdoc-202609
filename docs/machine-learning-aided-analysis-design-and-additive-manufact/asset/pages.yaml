  md: 'Once the energy expressions and the admissible functions are obtained, the
    Ritz method is employed to derive the eigenvalue equation of the FG porous cylindrical
    shell.


    Substituting Eq.(4.16) into Eq.(4.7), the kinetic energy T of the FG porous cylindrical
    shell can be expressed as:


    ```

    $T = \frac{\pi LR}{2} \rho_0^2 \int_{0}^{L} \omega^2 (U^2 + V^2 + W^2) d\etaquad
    (4.19)$

    ```


    where


    ```

    $\rho_0^2 = \int_{-L}^{L} \rho(z) dz \quad (4.20)$

    ```


    Similarly, substituting Eq.(4.16) into Eq.(4.8), the strain energy of the FG porous
    cylindrical shell is calculated by:


    ```

    $U_{\epsilon} = \frac{\pi L}{2 J_0} \int_{-L}^{L} \left( n^2 A_{66} U^2 + \frac{R^2
    A_{11}}{L^2} V^2 + 2n \left( \frac{RA_{12}}{L} + \frac{B_{12}}{L} \right) U''
    V'' \right)$\

    - 2n \left( \frac{RA_{66}}{L} + \frac{B_{06}}{L} \right) UV'' V'' + 2n \left(
    \frac{n^2 B_{12}}{L} + \frac{RA_{12}}{L} \right) U'' W'' \right)$\

    + \frac{4n^2 B_{66}}{L} UW'' - \frac{R^2 B_{66}}{L^3} U'' V'' + n^2 \left( \frac{A_{22}}{R}
    + \frac{D_{22}}{R^2} \right) V^2$\

    + \left( \frac{D_{66}}{L} + \frac{2RB_{66}}{L^2} \right) V'' W'' + 4n \left( \frac{RB_{66}}{L^2}
    + \frac{D_{06}}{L} \right) V'' W''''$\

    - 2n \left( \frac{RB_{12}}{L^2} + \frac{D_{12}}{L} \right) VW'' W'''' + 2n \left(
    \frac{n^2 B_{22}}{R} + \frac{B_{22}}{R^2} + \frac{n^2 D_{22}}{R^2} \right) W''
    W''''$\

    + A_{22} \frac{2n^2 B_{22}}{R} + \frac{n^2 D_{06}}{R^2} W^2 + 4n^2 \frac{D_{06}}{L^2}
    W^2 - \frac{R^2 D_{11}}{L^4} W''''$\

    - 2 \left( \frac{n^2 D_{12}}{L^2} + \frac{RB_{12}}{L^2} \right) WW'''' d\zeta
    \quad (4.21)$

