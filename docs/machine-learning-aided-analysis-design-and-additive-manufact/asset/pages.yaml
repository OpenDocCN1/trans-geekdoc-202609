  md: '# # 6 Improving buckling and vibration response of porous beams using higher
    order distribution of porosity


    Mohammad M. Keleshteri¹ and Jasmin Jelovica¹,²

    ¹Department of Mechanical Engineering, The University of British Columbia, Vancouver,
    BC, Canada, ²Department of Civil Engineering, The University of British Columbia,
    Vancouver, BC, Canada


    # ## 6.1 Introduction


    Developments in manufacturing technology have allowed increasing applications
    of high-quality porous materials in various fields. Porous materials have attracted
    significant attention from both industry and academia for a variety of science
    and engineering applications since they offer high design flexibility and excellent
    features such as low specific weight, high energy absorption and low thermal and
    electrical conductivity [1]. In design of porous structural components, such as
    beams, it is vital to improve their performance. The published studies focus on
    the static and dynamic behavior of porous, plates, and shells [1–40]. A brief
    literature review is presented herein.


    Bending and buckling of functionally graded (FG) porous Timoshenko beams have
    been studied by Chen et al. [11]. It was assumed that the elastic modulus is graded
    through the thickness of the beam considering porosity distribution patterns.
    It was found that porosity distribution offers better buckling capacity and can
    improve the bending resistance. Keleshteri and Jelovica [22] investigated the
    nonlinear free vibration of FG porous moderately cylindrical panels considering
    different shell theories and boundary conditions. Mechanical properties of open-cell
    foam were assumed to vary continuously through the thickness. It was found to
    enhance the dynamic response of the cylindrical panel, porosity should be avoided
    near the panels'' surfaces. Buckling behavior of two-directionally porous beams
    was studied by Tang et al. [3]. They found that the effect of the porosity direction
    is most important for the critical loading when the porosity is in the axial direction.


    Keleshteri and Jelovica [16] proposed a new porosity distribution to maximize
    linear natural features of deformable bidirectional porous beams with nonuniform
    porosity distribution. It was assumed that closed-cell voids are aligned along


