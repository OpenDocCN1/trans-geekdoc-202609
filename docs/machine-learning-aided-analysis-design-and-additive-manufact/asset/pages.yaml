    exhibit multiple plateau stresses of their composition at each uniform layer.
    At the densification stage, graded foams have similar densification stages to
    uniform foams with a similar overall relative density. Hence, the stress—strain
    curves of graded foams can be predicted by those of uniform foams with different
    relative densities.


