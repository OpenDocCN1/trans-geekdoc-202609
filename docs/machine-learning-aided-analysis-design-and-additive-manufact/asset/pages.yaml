    Several methods were explored to define the minimal surface [35,36]. For instance,
    the nodal coordinates of TPMS can be generated by integrating the Weierstrass
    function based on Enneper–Weierstrass representation [37]. Bonatti and Mohr designed
    shell-based lattice structures with TPMS topology by minimizing the principal
    curvatures of the fundamental unit as a minimal function [38]. However, the most
    adopted and simple method to generate the topology of TPMS is the level-approximation
    equation based on a summation of the Fourier series,


    $\Psi(r) = \sum_{k} F(k)\cos[2\pi r - \alpha(k)] = 0. \quad (13.3)$


    where $k$ is the reciprocal vector, $\alpha(k)$ is a phase shift, and $F(k)$ is
    the amplitude for a given vector, $k$ [35]. The series can be truncated to a function
    $\phi$ which is a combination of trigonometric functions and satisfies $\phi(x,y,z)
    = c$. If the function $\phi(x,y,z)$ is evaluated at the isosovale $c$, a surface
    can be generated with a similar topology to minimal surfaces. Many different types
    of TPMS have been discovered, and a few level-approximation equations defining
    here:


    Primitive:


    $\Phi_{Primitive}(x,y,z) \equiv \cos(w_x x) + \cos(w_y y) + \cos(w_z z) = c. \quad
    (13.4)$


