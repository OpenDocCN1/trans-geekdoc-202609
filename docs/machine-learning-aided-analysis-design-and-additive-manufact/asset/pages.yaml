    and the misegment partition technique. Jacobi polynomials are employed to express
    the displacement fields of any segment. Numerical results for the dynamics of
    the FGP plate is obtained by the Rayleigh-Ritz method, and the convergence and
    robustness are tested by comparing the results to literature and FEM. Finally,
