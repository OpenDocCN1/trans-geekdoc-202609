    #  4.1 Introduction


    Metal foams, as a kind of low density materials, are getting more and more attention
    on account of their low density, prominent energy absorption, and high thermal
    conductivity [1,2]. Because the size of the inner pores can be tailored, it is
    possible to form functionally graded (FG) porous structures, which have excellent
    mechanical properties with homogeneous structures [3-5].


    An important kind of engineering structures, circular cylindrical shells have
    excellent mechanical performance as lightweight and high strength. Thus they have
    been widely used in the shipbuilding industry, aerospace industry, machinery manufacturing
    industry, construction, etc. There are many detailed and comprehensive [6-9] on
    basic theories and solution methods of circular cylindrical shells.


    Studies on vibration of circular cylindrical shells have been extensively extended.
    Soldiers and Hadidegroud [10] solved the free vibration of isotropic cylindrical
    shells and under singly supported boundary conditions. Chung [11] investigated
    the free vibration of circular cylindrical shells with classical boundary conditions
    by introducing Fourier series. Paliwal et al. [12] analyzed the free vibration
    characteristics of circular cylindrical shells on Winkler and Paternak foundations.
    By using the Hamilton''s variational principle, Salhah and Morehab [13] proposed
    a technique for vibration analysis of cylindrical shells under harmonic forces.
    By the domain decomposition technique, Qu et al. [14] analyzed the vibration of
    uniform and stepped cylindrical shells with boundary conditions. Go et al. [15]
    developed the simplistic wave-based method for steady-state forced vibration of
    cylindrical shells with different boundary conditions.


    Fakuwa et al. [16] studied the induced vibration response of spinning cylindrical
    shells with radial bearing supports and the vibration characteristics of the shells
    were verified by frequency response testing. The above studies focus on the linear
    free vibration of cylindrical shells mostly focus on the classical boundary conditions.


