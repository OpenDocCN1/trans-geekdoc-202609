    engineering fields, there are urgent demands in theory and close correlation with
    practical applications to develop a unified method for prediction of vibration
    characteristics of FGP plates with various shapes. Therefore, the chapter is concerned
    with a unified theoretical model combining FSDT and CDQM for investigation on
    vibration characteristics of FGP plates with porosity distributions. According
    to the FSDT, the energy equations for plates are obtained first. In the meantime,
    by introducing the Lagrange transformation technique, plate with curved edges
    is mapped onto a square plate. In other words, the structural displacement fields
    can be expressed in terms of Chebyshev polynomials in computational domain, and
    the vibration problem can be solved by energy equations. Sets of numerical examples
    are carried out to verify the convergence, correctness, and versatility of this
    method. Ultimately, the contributions of porosity coefficient and distributions
    on mechanical behaviors of structures are discussed in detail.


    # 3.2 Theory analysis


    # 3.2.1 Establishment of the model


    As shown in Fig. 3.1, a general geometric model of FGP plate with arbitrary curved
    geometry is established, an orthogonal coordinate system (x, y, z) is established
    in the middle plane. The boundary edges of the plates are restrained by a set
    of linear springs ($k_x, k_y, k_z$) and a set of rotational springs ($K_x, K_y,
    K_z$), and general boundary conditions containing classic and elastic boundary
    conditions can be easily achieved by regulating the spring stiffness [38,39].
    The symmetric and asymmetric porosity distribution considered in this chapter
    are named Type 1 and Type 2, respectively.


    ![](img/90ed165a39fa708ec438fcda79319c25_67_0.png)


    Figure 3.1 Geometric model of FGP plates with complex curved edges.'
