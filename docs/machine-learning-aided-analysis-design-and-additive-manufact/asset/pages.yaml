    flexible materials. As an emerging material manufacturing technique, additive
    manufacturing has a wide range of applications, which complements the shortcomings
    of the traditional manufacturing technique. The combination of cellular solids
    and additive manufacturing provides a new research direction for key scientific
    fields such as aerospace, air transport, biomedicine, and so on. To this end,
    authors summarize potential future research topics as follows.


    First of all, additive manufacturing is not an omnotent technology and cannot
    substitute the traditional manufacturing technique. Furthermore, the additive
    manufacturing still has several disadvantages, including high cost, low densification,
    and poor strength and toughness of the produced materials. Hence, combining cellular
    and traditional manufacturing, understanding cost, material properties, and design
    flexibility, is an important problem to be solved.


    Secondly, cellular solids are used as an energy-absorbing material in impact protection.
    Although cellular solids have higher specific stiffness and strength, their absolute
    stiffness is lower than that of dense materials. In engineering applications with
    energy absorption, cellular solids are generally combined with dense metals or
    ceramics to form energy-absorbing components, such as thin-walled and sand plates.
    The cellular solid takes advantage of large plastic deformation and energy absorption,
    and the dense metal or ceramic materials the characteristics of elastic resistance
    and structural support. This energy-absorbing component can achieve optimal impact
    protection. So, the research on additively manufactured cellular solids mostly
    focuses on the material level, whereas research on additively manufactured cellular
    solids on the component or structure level remains limited.


    Finally, the application of combining cellular solids and additive manufacturing
    needs to be further explored. For example, 4D printing [101,102] and intelligent
    manufacturing [103,104] can be integrated into the current research. Recently,
    a class of robotic metamables capable of moving with multiple degrees of freedom
    was designed and manufactured [105]. This work integrated piezoceramic, metallic,
    and structural materials into a 3D architecture and the robotic metamaterials
    could actively sense and move. By combining smart metamaterials and topology optimization
    design, the application of additively manufactured cellular solids can be further
    expanded. Nevertheless, extensive investigations are needed in this area.


    # 14.5 Conclusions


    In summary, starting from the state-of-art applications and research limitations
    of cellular solids, this chapter clarifies the necessity of research on cellular
    solids combined with additive manufacturing. Currently, traditional manufacturing
    technique fails to meet the design flexibility of cellular solids, making additive
    manufacturing technology urgently needed to break the shackles of material preparation.
