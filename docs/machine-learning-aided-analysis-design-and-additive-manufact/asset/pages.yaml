  md: '(100 × 100 × 400 mm) with different hollow patterns, including cellular, triangular,
    truss, and lattice structure. Quasi-static compressive and four-point bending
    tests were applied to cubic blocks and prisms, respectively. For the compression
    test, the experiment results showed the hollow cube specimen with the lattice
    pattern had the maximum compressive strength, which was around 17%, 59%, and 99%
    higher than with cellular, triangular, and truss patterns, respectively. Compared
    with the primitive solid cubes, the compressive strengths of hollow cubic specimens
    with different hollow patterns had a relative strength range between 45% and 90%.
    Results of compressive strengths for different hollow specimens indicated the
    mechanical performance of lightweight porous structure could be significantly
    influenced by the tool path design that correlated with the stress distribution
    and deformation within the printed structure. Furthermore, the bending test results
    showed the hollow beam with a lattice pattern having the minimum tensile strength
    at the peak load, suggesting the highest capacity against the flexural deformation.
    Due to different designs in hollow beams, the crack was initiated and propagated
    from the bottom of the beam was found from each other, which could be another
    reason for the different deformation behaviors under the bending test. Overall,
    the study of Wang et al. [77] demonstrated the feasibility of optimizing the quasi-static
    mechanical performance of lightweight hollow concrete structures fabricated via
    the 3DCP method.


    When it comes to the framework-based lightweight concrete, the mechanical performance
    at a quasi-static state has also been evaluated through both experiments and a
    simulation. Nguyen-Van et al. [66] fabricated the porous concrete (100 × 100 ×
    100 mm) with the 3D-printed PLA mold as the outer shell, and the structure consisted
    of lightweight cells with three different patterns, including TPMS (such as primitive
    and gyroid) and lattice. Compression tests at the loading rate of 70 kN/min were
    executed on those three types of porous structures, and the stress-strain curves
    and failure patterns were recorded and analyzed. The results showed the lattice
    structure had the minimum compressive strength (~ 3 MPa), and primitive structure
    (~ 10 MPa). The damage pattern analysis through numerical simulation has confirmed
    the possible reason for the weak mechanical response of lattice structure in compressive
    loads, which could be the included cell walls in the lattice structure that induced
    bending-dominated effects and accelerated the fracture damage. In contrast, concrete
    structures with TPMS structures generally had the spatial arrangement of intertwined
    and interconnected curvatures, providing supporting structures for the structure
    and leading to the minimum stress concentration. Moreover, among the two types
    of TPMS structures, the primitive structure was related to have a higher strength
    than the gyroid, which could be related to the location of different extents of
    stress distribution. Finally, numerical analysis showed showed 3D-printed PLA
    framework could also play an important role in effectively improving the compressive
    strength for both primitive and gyroid structures, in contrast to the lattice
    structure where the inclusion of plastic'
