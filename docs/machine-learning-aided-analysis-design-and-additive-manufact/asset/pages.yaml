  md: '# 2.2.2 Energy formulations of functionally graded porous curved beam


    The corresponding formulation for the displacement field of FGP curved beams can
    be determined using the Timoshenko beam theory:


    ```

    $U(\varphi,y,z,t) = u(\varphi,t) + z\phi(\varphi,t)\nW(\varphi,y,z,t) = w(\varphi,t)$
    $\quad (2.5)$

    ```


    where $U$ and $W$ are the displacements at any point of FGP curved beam along
    $x$- and $z$-axis, $\phi$ represents the mid-plane component of the normal to
    the


    The normal and shear strains are denoted by symbols of $\varepsilon_{\varphi}$
    and $\gamma_{\varphi z}$, respectively. Based on small deformation hypothesis,
    the strain–displacement relations considering


    ```

    $$\begin{pmatrix} \varepsilon_{\varphi} \ \gamma_{\varphi z} \end{pmatrix} = \frac{1}{1+z/R_{\varphi}}
    \begin{pmatrix} 0 & 0 \ 0 & 1 \end{pmatrix} \begin{pmatrix} 0 \ \kappa_{\varphi}
    \end{pmatrix}$ $\quad (2.6)$

    ```


    where the superscript $0$ indicates the variable $\kappa_{\varphi}$ denotes the
    curvature, which can be expressed as:


    ```

    $\varepsilon_{\varphi}^0 = \frac{1}{R_{\varphi}} \frac{\partial u}{\partial \varphi}
    + w), k_{\varphi}^0 = \frac{1}{R_{\varphi}} \frac{\partial \Phi}{\partial \varphi},
    \gamma_{\varphi z}^0 = \frac{1}{R_{\varphi}} (\frac{\partial w}{\partial \varphi}
    - u)$ $\quad (2.7)$

    ```


    The expression of stress–strain constitutive relation obtained by applying the
    generalized Hooke’s law can be presented as:


    ```

    $$\begin{pmatrix} \sigma_{\varphi} \ \tau_{\varphi z} \end{pmatrix} = \begin{pmatrix}
    Q_{11} & 0 \ 0 & Q_{55} \end{pmatrix} \begin{pmatrix} \varepsilon_{\varphi} \
    \gamma_{\varphi z} \end{pmatrix}$ $\quad (2.8)$

    ```


    where $\sigma_{\varphi}$ and $\tau_{\varphi z}$ represent the normal and the shear
    strains, respectively. In addition, $Q_{11}$ and $Q_{55}$ are the elastic stiffness
    of FGP material, the expression of which can be written as:


    ```

    $Q_{11} = \frac{E(z)}{1-\

    u^2} = G(z)$ $\quad (2.9)$

    ```


    where the symbol of $\nu$ denotes the Poisson’s ratio. Integrating Eq. (2.8) yields
    the normal force $N_{\varphi}$, shear force $Q_{\varphi}$, and bending moment
    $M_{\varphi}$:


    ```

    $$\begin{pmatrix} N_{\varphi} \ Q_{\varphi} \end{pmatrix} = b \int_{-h/2}^{h/2}
    \begin{pmatrix} \sigma_{\varphi} \ \tau_{\varphi z} \end{pmatrix} dz$ $\quad (2.10)$

    ```'
