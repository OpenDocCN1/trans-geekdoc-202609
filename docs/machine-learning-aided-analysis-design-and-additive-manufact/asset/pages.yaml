    #  15.5 Predictive model


    Despite empirical and numerical studies have been published on the predictive
    model of graded foams. However, a predictive model that can predict the mechanical
    properties of graded foams will be very useful in material designing for engineering
    applications. In this section, elastic-plastic-hardening model for graded foams
    is established using the stress—strain relations of uniform foams. Based on the
    proposed models, the stress—strain curves of graded and uniform foams are compared
    to figure out their relationship.


    #  15.5.1 Comparison of graded foams with uniform foams


    In this chapter, specimens are loaded under quasi-static (20 m/s) compression
    where no shock wave occur. Therefore the nonmonotonic gradient distribution will
    not influence the stress—strain curves, which can be treated similarly to monotonic
    foams. Therefore only graded foams with the monotonic gradient are discussed here.


    For quasi-static tests, as shown in Fig. 15.20, since specimen “U8” has a similar
    overall relative density to graded foams, its compressive curve is similar to
    that of specimen “M1-PG.” For the same relative density, uniform and graded foams
    have similar elastic modulus and densification stages. Besides, the plateau stress
    of “M1-PG” (1.41 MPa) and “U8” (1.39 MPa) is close to each other, though “M1-PG”
    exhibits a hardening plateau stage rather than a constant one (like “U8”).'
