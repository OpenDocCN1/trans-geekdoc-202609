    # 6.3.4 Hamilton principle


    Using the Hamilton principle, equation of motion of the porous beam can be derived.
    To employ the Hamilton principle, total kinetic, potential, and nonconservative
    energies of the system need to be calculated. Total kinetic energy of the system
    can be expressed as:


    ```

    $K = \frac{1}{2} \int (\dot{U}^2 + \dot{w}^2) dV \quad (6.17)$

