  md: '# 14.2.3 Vat photopolymerization


    Vat photopolymerization generally aims at base materials of photosensitive resins.
    Under ultraviolet light, the resin is polymerized rapidly to complete the manufacturing-photopolymerization.
    Stereolithography (SLA) is the most representative technology in vat photopolymerization.
    As shown in Fig. 14.8, the system is composed of a liquid photopolymer, fabrication
    platform, laser source, and scanner system. The manufacturing process is similar
    to the SLS shown in Fig. 14.5. The difference is that the powder base material
    is replaced by the liquid resin base. The big-advantage of SLA is that it can
    produce high-resolution (submicron-level) material. However, two disadvantages
    of SLA exist, where the strength of the base material is low, and the residual
    photinitiator and uncured resin are of cytotoxicity.


    # 14.3 Additively manufactured cellular solids


    Cellular solids have outstanding flexibility in microstructure design, whose requirement
    is difficult to meet in traditional manufacturing processes. The development and
    application of various additive manufacturing techniques respond to the strong
    designability of cellular solids. Studies along cellular solid combined with additive


