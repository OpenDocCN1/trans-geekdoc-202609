  md: "$$\\bar{V}_e = \\mathbf{V}_e \\bullet \\text{diag}(\\mathbf{J})$\n\nThe symbol\
    \ $\bullet$ denotes the Hadamard product.\nBased on the previous works, the transient\
    \ response of FGP plate can be solved with the formulation as:\n\n$$\\$\\mathbf{M}\\\
    mathbf{u} + \\mathbf{C}_R\\mathbf{u} + \\mathbf{K}\\mathbf{u} = \\mathbf{F}$\n\
    \nwhere $\\mathbf{u}$, $\\dot{\\mathbf{u}}$ and $\\ddot{\\mathbf{u}}$ express\
    \ the displacement, velocity, and acceleration vector, respectively; $\\mathbf{C}_R$\
    \ is the structural damping matrix defined by\n\n$$\\mathbf{C}_R = \\beta_1\\\
    mathbf{M} + \\beta_2\\mathbf{K}$\n\nwhere $\\beta_1$ and $\\beta_2$ denote the\
    \ Rayleigh damping coefficients, which are given by\n\n$$\\beta_1 = 2\\left(\\\
    \\frac{\\omega_2^2}{\\omega_3^2}\\right)\\left(\\\\frac{1}{\\omega_1^2}-\\frac{1}{\\\
    omega_2^2}\\right), \\beta_2 = 4\\left(\\frac{\\omega_2}{\\omega_3}\\right)\\\
    left(\\frac{1}{\\omega_1\\omega_2}\\right)$\n\nin which, $\\gamma$ and $\\beta$\
    \ represent the attenuation coefficients.\nThe Newmark-\\\beta$ method is applied\
    \ to solve the transient dynamic equation, and the correlation of $\\mathbf{u}$,\
    \ $\\dot{\\mathbf{u}}$ and $\\ddot{\\mathbf{u}}$ are obtained.\n\n$$\\begin{cases}\
    \ \\ddot{\\mathbf{u}}_{i+1} = a_0\\ddot{\\mathbf{u}}_{i+1} + a_1\\dot{\\mathbf{u}}_i\
    \ + a_2\\mathbf{u}_i \\ \\dot{\\mathbf{u}}_{i+1} = a_3\\ddot{\\mathbf{u}}_{i+1}\
    \ + a_4\\dot{\\mathbf{u}}_i + a_5\\mathbf{u}_i \\end{cases}$\n\nwhere\n\n$a_0\
    \ = \\frac{1}{\\Delta t^2}, a_1 = \\frac{1}{\\Delta t}, a_3 = \\frac{1}{\\Delta\
    \ t}-1, a_5 = \\frac{\\Delta t}{2}-1, \\quad a_2 = -0.5, a_4 = 0.5$\n\nBy substituting\
    \ Eq. (3.45) into one, one obtained\n\n$$\\mathbf{M}\\ddot{\\mathbf{u}}_{i+1}\
    \ + \\mathbf{C}_R\\dot{\\mathbf{u}}_{i+1} + \\mathbf{K}\\mathbf{u}}_{i+1} = \\\
    mathbf{F}_{i+1}$\n\nIn the end, the displacement, acceleration and velocity at\
    \ time $t_{i+1}$ can be obtained.\n\n# 3.3 Results and discussion\n\nIn this subchapter,\
    \ the research content about the vibration characteristics of FGP plates with\
    \ complex curved edges is composed of three parts, namely free vibration, transient,\
    \ and steady-state response. The research sequence of each part can be concluded\
    \ as:"
