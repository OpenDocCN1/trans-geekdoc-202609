    # 17.1 Introduction


    Foams or cellular solids are materials that obtain the desired properties by utilizing
    voids [1] that can be categorized into stochastic structure and nonstochastic
    structure, as shown in Fig. 17.1.


    Cellular structures consisting of foams, honeycombs and lattices are widely used
    in industries such as aerospace engineering, civil engineering, automotive engineering,
    and biomedical engineering due to their excellent impact energy absorption, high
    specific strength, low thermal conductivity, and other special characteristics.
    Take metal foam as an example, the applications can vary from automotive engineering
    to biomedical engineering, which attracts billions of dollars investment from
    industry and academia (see Fig: 17.2).


    ![](img/90ed165a39fa708ec438fcda79319c25_432_0.png)


