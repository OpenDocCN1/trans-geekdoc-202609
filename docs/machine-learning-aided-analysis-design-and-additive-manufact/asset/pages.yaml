  md: '# For and forced vibrations of functionally graded porous quadrilateral plates
    with curved edges


    are generally made of materials with porosity, and reasonable material materials
    are obtained by regulating the porosity parameters and distributions. As a result,
    FGP plates have been widely utilized in engineering areas requiring lightweight,
    extreme temperature, high speed and strong impact resistance, as bullet trains,
    space equipment, and advanced industries [1–3]. In order to promote the mechanical
    dynamic characteristics, the foundation and key are exploring the vibration mechanism
    of FGP plates. Since the shapes of FGP plates are always irregular, it is meaningful
    in theoretical and engineering fields to develop a unified approach to analyzing
    the vibration behaviors of FGP plates with complex edges.


    A number of institutions have developed methods to predict the vibration characteristics
    of FGP structures. Barati et al. [9] studied electro-mechanical vibrational behavior
    of functionally graded piezoelectric plates via a fixed four-variable plate theory
    for the first time. CuongLe et al. [10] performed a three-dimensional (3D) numerical
    solution to the free vibration and buckling of FGP structures, showed that porosity
    of the FGP structures has influence on free vibration and buckling response. With
    the work of the first deformation theory (FSDT), Ebrahim et al. [11] analyzed
    the vibration wave of FGP cylinders with regard to parameters containing porosity
    coefficient, length-thickness ratio, radius-to-thickness ratio, circumferential
    wave number, and properties of elastic foundation. FSDT analyzed by Parsani et
    al. [12] for prediction of the free vibrations of FGP plates in contact with fluid,
    side-to-thickness ratio, length-to-width (aspect) ratio were analyzed. Foroutan
    et al. [13] developed a formulation of a fully nonlinear refined plate theory
    in a total Lagrangian approach to estimate the postbuckling and deflection of
    a sandwich FGP plate. Gao et al. [14] studied the characteristics of FGP sandwich
    plates with viscoelastic square-celled core. Gong [15] developed a cell-vertex
    finite method for analyzing FGP structures with consideration of thermal environment.
    Results show that the distribution of the porosity has a weak influence on the
    temperature and the deformation, but obviously affects the thermal stress. Hung
    et al. [16] presented an analytical approach for nonlinear buckling and postbuckling
    of FGP plate shells of which thickness varies. Taking three kinds of porosity
    distributions are investigated, and the corresponding results show that the parameters
    of porosity distribution, geometric, and foundation make remarkable effects on
    the mechanical behavior of the FGP toroidal shell. Kumar et al. [17] investigated
    the static and dynamic behavior of the exponential FGP material under the thermal-electromechanical
    coupled loads. The motion equations are deated by means of FSDT and Hamilton''s
    principle. The accuracy of their method is validated compared to the existing
    literature. As a consequence, the contribution of materials parameters, geometric
    porosities, and boundary conditions to structural dynamic performance are accounted
    for. Liu et al. [18] analyzed the dynamic behaviors of FGP plate reinforced by
    graphene platelets and surrounded by elastic foundation with elastic boundary
    constraints. Four types'
