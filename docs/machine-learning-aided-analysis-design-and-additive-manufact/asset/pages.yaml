  md: 'integrating the conventional and new methods, and offering a full-scale overview
    from analysis and design to manufacturing and application.


    The key information of each section and chapter is summarized in Fig. 1-6, in
    terms of the research subjects and material forms. Section I and Chapter 1 are
    written to provide an easy and profound understanding of the whole book by elaborating
    the general concepts of porous materials, FG porosities, and the composite structural
    forms. The related fabrication and mechanical analysis are briefed as needed.


    The following 16 chapters are divided into four sections. Section II contains
    seven chapters, where the first four aim at the fixed and forced vibrations of
    FG porous straight and curved beams (Chapter 2), quadrilateral plates and shells
    (Chapter 3), cylindrical shells (Chapter 4), and elastic foundations. Symmetric
    and asymmetric material gradations are discussed and compared to those of uniform/random
    geometries on the vibration of porous beams and shells. Chapter 6 evaluates the
    improved beam buckling and vibration responses brought by the high-order unidirectional
    and bidirectional open-cell voids. Chapter 7 investigates the impacts of stochastic
    material properties on probabilistic stability analysis of FG graphene-reinforced
    beams. Chapter 8 suggests a bending theory considering the thickness effect when
    evaluating the bending behavior of FG beams, which can be effective in the examination
    of porous composite components with graded materials. These seven chapters cover
    the deterministic and nondeterministic, buckling, vibration, and bending studies
    of FG (porous) structures based on the beam, plate, and shell theories.


    Section III consists of four chapters with a focus on the adoption of machine
    learning in the calculation of FG porous structural performance. According to
    the connection between geometric features and mechanical responses, Chapter 9
    uses a machine-learning-based framework for accelerated characterization and pattern
    generation of noncellular architectural materials. Chapter 10 develops a convolutional
    neural network model to directly predict the metal modulus from the images of
    FE representative volume elements, and conducts a structural uncertainty analysis
    on the bending of FG porous to examine the influence of uncertainty predictions.
    Chapters 11 and 12 carry out the machine learned static and free vibration analyses
    of FG porous plates, by proposing an interface to solve the uncertainty problem.
    These four chapters use different strategies incorporating machine learned techniques
    into the assessment of porous composites, offering innovative solutions to facilitate
    the traditional mechanical computations.


    Following the analysis and design of composite forms with graded porosities, Section
    IV provides insights into their efficient fabrications via 3D printing and includes
    four chapters. Chapter 13 reviews the recent advances in the performance evaluation
    of FG porous structures containing periodic minimal surfaces, and introduces the
    additive manufacturing techniques of composite materials and the digital fabrication
    of lightweight concrete structures. Chapters 14–16 outline the design and fabrication,
    mechanical behavior, and application of natively FG porous structures, where graded
    foams, lattices, and honeycombs are'
