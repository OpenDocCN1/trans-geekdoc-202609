  img_proc: true
- pgno: 225
  md: 'thermomechanical vibration of temperature-dependent FGM beams with porosities
    by using an higher-order shear deformation theory (HSDT). Aydoglu and Taskin [26]
    used the Euler–Bernoulli model and parabolic and exponential shear functions to
    examine the bending responses of a simply supported FG beam. Ben-Othmane et al.
    [27] used different bending theories to investigate an FG thick Timoshenko-beam''s
    behavior. A numerical solution for Timoshenko beam (TBT) and HSDT is presented
    by Şimş [27] using the Ritz method. Patel et al. [28] to analyze the bending responses
    of the FGM beams. An analytical solution for the thick-layered FGM beams is provided
    by Zhong and Yu [29] for various types of mechanical loads. Based on the neutral
    surface concept, Larbi [30,31] presented an efficient theory to study the bending
    vibration of thick FGM beams. Similarly, a new order of SDF theory is developed
    by Bourasma et al. [32], based on the position of the neutral surface for thick
    FG beams. Talha et al. [33–37] performed various studies on the theory using various
    high-order shear deformation theories.


    The thickness-stretching impact was introduced in analyzing the vibrational buckling
    of thick FG beams [38]. Osofero et al. [39] introduced an analysis method of buckling
    in FG sandwich beams, considering thickness-stretching and shear effects. Merazdeh
    et al. [40] also introduced the thickness-stretching effects in a new shear theory
    to analyze the bending vibration of FG beams.


    From the literature review, it is evident that there is no published work considering
    the impact of thickness stretching on the mechanical vibration of thick FG beams.
    This problem is not well investigated and there is a need for further studies.
    In this work, a refined theory is presented to analyze the bending vibration of
    the thick FG beam, with supported ends and under loading condition. This although
    provides a constant transverse displacement and avoids axial displacement through
    the depth of the beam so that there is no need for any shear correction factors.
    By supervising the deflection on the bending, shear and thickness-stretching factors,
    the governing equations are derived from Hamilton''s principle. The equations
    system obtained is presumed to change through the thick beam following the law
    of dosing. Detailed mathematical formulations are provided, and example results
    are proposed to show the relevance of the present theory and to verify its accuracy.
    Our approach presents the advantage of using less variables in comparison to other
    theories as well as the effects of thickness stretching and the influences of
    many parameters such as material index and slenderness ratio on frequency response
    and stresses. The proposed higher-order normal deformation and shear theory is
    not only accurate, but provides an elegant and easy-to-implement approach to simulating
    the bending and vibration behaviors of thick FG beams.


    # 8.2 Theoretical formulation


    # 8.2.1 Model definition


    Fig. 8.1 shows the proposed model for this study. It is a thick FG beam with length
    (L), rectangular cross-section, width (b), and height(h).'
