    \times m & \mathbf{0}_{2m} \times m \ \mathbf{0}_{2m} \times 2m & \mathbf{I}_m
    \times m & \mathbf{0}_m \times m \ \mathbf{0}_{2m} \times 2m & -\mathbf{0}_m \times
    m & \mathbf{I}_m \times m \end{bmatrix}, \quad \hat{\mathbf{e}}_k = \begin{bmatrix}
    \mathbf{e}_{2m} \ \mathbf{e}_m \ \end{bmatrix}$ (11.38)

    ```


    Where $\mathbf{I}_m \times m \in \mathbb{R}^{m \times m}, \mathbf{e}_m=[1, 1,
    \dots, 1]^T \in \mathbb{R}^m$.$\nThe ultimate regression performance of the S-XVR
    model depends on the kernel selected, and a new type of feature mapping kernel
    function, namely the Dirichlet feature mapping is proposed, which is defined recursively
    as


    ```

    $$\varphi_0^d(X) = \begin{cases} x_d, & \chi_d \in X, \ d=1, 2, \dots, n \ \Gamma(\\sum_{k=1}^n
    \alpha_k) \prod_{k=1}^n \chi_k^{\alpha_k-1} \times (1-\sum_{k=1}^n \chi_k)^{\alpha_n-1},
    , & d=n+1 \end{cases}$ (11.39)

    ```


    where $d \in \mathbb{Z}^+$ represents the degree of Dirichlet mapping function
    and the overall input data dimension is increased by 1 based on equation $\varphi_{d+1}^*(X)$.


