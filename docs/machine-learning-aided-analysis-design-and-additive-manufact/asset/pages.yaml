    # 9.4 Conclusion


    In this chapter, we investigate the response complexity of complex materials caused
    by the nonuniform geometric design. Through a combined FE modeling and clustering
    analysis, we discovered the hidden connection between a geometric feature (such
    as the layout and number of infills) and their mechanical responses for $3 \times
    3$ cellular patterns. Guided by learned geometric rules, we further characterized
    the responses of $4 \times 4$ cellular patterns with varied geometric infills
    and experimentally verified the linking between geometric features and their mechanical
    performance. As the design domain becomes larger and failure mechanisms become
    more complex, we introduce a ML method to accelerate the response of patterns
    from the testing data using a 20% training ratio. The framework is not limited
    to certain material architecture of the number of configurations, although we
    only validated the framework using $4 \times 4$ cells. We believe that Our ML-based
    framework should be capable of accelerating the material design with properties
    at the local level and improving the performance and/or functionality at the global
    level.'
