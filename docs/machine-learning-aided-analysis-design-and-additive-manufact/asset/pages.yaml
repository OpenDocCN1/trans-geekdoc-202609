- pgno: 143
  md: '![](img/90ed165a39fa708ec438fcda79319c25_143_0.png)


    **Fig. 4.23** Excitation amplitude response of the functionally generated porous
    cylindrical shell with different porosity distributions (---, stable solution;
    -- unstable solution; $e_1=0.5; \omega^*=1$).


    Excitation amplitude responses of the FG porous cylindrical shell with different
    porosity distributions are shown in Fig. 4.23. There is only one stable solution
    for the driven mode when the excitation amplitude is small. With the increase
    of the excitation amplitude, the stable solution bifurcates and another branch
    appears near 0.01. Then branch 1 of the driven mode becomes unstable. For the
    companion mode, branch 1 is always zero. At the same bifurcation point, branch
    2 appears. The branch 2 increases with the excitation amplitude. Above phenomenon
    shows that the emergence of the additional branch 2 to 1:1 internal resonance
    requires a sufficiently large excitation amplitude. It is seen that the PD-A shell
    requires the lower excitation amplitude to excite the nonzero response of the
    companion mode because branch 2 of the PD-A shell appears first.


    Fig. 4.24 illustrates excitation amplitude response of the FG porous cylindrical
    shell with various porosity coefficients. As the porosity coefficient increases,
    the excitation threshold for the 1:1 internal resonance of the PD-A shell increases,
    while that of the PD-B shell increases. It is seen that the largest pores of the
    PD-A shell are located at the middle surface of the shell, which enhances the
    stiffness of the shell. However, the case of the PD-B shell is the opposite. The
    effect of the porosity coefficient on the excitation amplitude response of the
    PD-U shell is insignificant.


    Fig. 4.25 and 4.26 show the time responses of the FG porous cylindrical shell
    with different porosity distributions and coefficients for $\omega^*=1$ (branch
    2 in Fig. 4.21), respectively. It is obvious that the phase difference between
    the companion and driven modes is $\pi/2$, which is a typical characteristic of
    traveling wave vibration. Porosity distribution and porosity coefficient mainly
    affect the peak value of the time response, while they have insignificant effect
    on the vibration period and phase of the FG porous circular cylindrical shell.'
