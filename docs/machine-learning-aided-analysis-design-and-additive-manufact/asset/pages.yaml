  md: 'FG porous nanocomposite beams with different porosity and reinforcement distributions,
    Yang et al. [14] examined the uniaxial, biaial, and shear buckling loads of FG
    GPLs reinforced plates within the framework of first-order shear deformation theory.
    The vibration and buckling behaviors of FGGR nanocomposite cylindrical shell were
    studied by Dong et al. [15,16] with the consideration of spinning motion.


    However, the defects and imperfections of nanostructures, manufacturing errors,
    as well as geometrical randomness significantly affect the mechanical behaviors
    and impede engineering practices of FGGR porous materials. It is true that all
    the above-mentioned studies achieved great success using deterministic analysis,
    while these results are underpinned by predetermined metric properties and the
    design metric between nano-sized reinforcements and metal matrix [17]. As summarized
    by researchers, the common uncertainties in FGGR materials can be classified into
    three categories [18–21]: (1) the random distributions of FGGR materials [19];
    (2) material uncertainties due to manufacturing defects [22,23]; and (3) the assumed
    mechanisms from nanoscale to macroscale by using effective material properties.
    Ghashemi et al. [24] studied the influence of effective material via metamodel
    approach. Kumar et al. [25] reported that the consideration of stochastic material
    properties is necessary in the design of such structures. Roux et al. [26] conducted
    the buckling analysis of nano-reinforced cylindrical shells in the micromechanical
    model. The stochastic eigen problem of beam-type structures was proposed by Gupta
    and Arun [27] using perturbation method. Therefore the presence of uncertainty,
    unpredictability, and randomness of the FGGR porous materials on structures is
    hardly avoidable and ignoring these effects would compromise the safety of structures.


    The influences of stochastic material geometrical parameters are not studied by
    literature comprehensively. In this work, the structural buckling performance
    of FGGR porous materials by considering stochastic material properties and random
    distributions of internal pores and nanofibers is analyzed. The noncommutative
    Chebyshev metamodel (CMM) is implemented on deterministic analysis from discrete
    singular convolution (DSC) method. By doing this, the analytical solutions can
    be easily solved and transformed into stochastic analysis in the system.


