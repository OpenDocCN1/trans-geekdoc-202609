    + \tau_{xz}\gamma_{zx}) + \sigma_{\varepsilon_z}) \right] dz \ dydx \ &= \int_{h_0}^{h_1}
    \left( \mathcal{N}_x \frac{\partial \tilde{B}u_x}{\partial\varepsilon_x} - \mathcal{M}_x
    \frac{\partial^2 \tilde{B}u_x}{\partial\varepsilon_x^2} - \mathcal{M}''_x \frac{\partial^2
    \tilde{B}u_x}{\partial\varepsilon_z^2} + 2\mathcal{M}_{xz}\frac{\partial^2 \tilde{B}u_x}{\partial\varepsilon_x\partial\varepsilon_z}}
    + \mathcal{N}_z \frac{\partial \tilde{B}\phi}{\partial\varepsilon_z} \right) dx
    \end{aligned} $$

    ```


    where, $\mathcal{N}_x, \mathcal{M}_x, \mathcal{M}''_x, \mathcal{M}_{xz},$ and
    $\mathcal{N}_z$ are the stress resultants, specified as:


    ```

    $$\begin{aligned} \mathcal{N}_x &= \int_{-h_0/2}^{h_1/2} z(z)\sigma_x bdz \ \mathcal{M}_x
    &= \int_{-h_0/2}^{h_1/2} z^2\tau(z)bdz \ \mathcal{N}_z &= \int_{-h_0/2}^{h_1/2}
    \sigma_z \frac{dy(z)}{z} \end{aligned} $$

    ```


    By using Eq. (8.7), the stress resultants given in Eq. (8.9) can be expressed
    as:


    ```

    $$\begin{aligned} \mathcal{N}_x &= \begin{bmatrix} \mathcal{A} & \mathcal{B} &
    \mathcal{C} & 0 \ \mathcal{D} & \mathcal{E} & \mathcal{F} & 0 \ \mathcal{G} &
    \mathcal{H} & \mathcal{I} & 0 \ 0 & 0 & 0 & \mathcal{A}_s \end{bmatrix} \begin{bmatrix}
    \frac{\partial \tilde{U}w_b}{\partial\varepsilon_x} \ \frac{\partial^2 \tilde{B}w_x}{\partial\varepsilon_x^2}
    \end{bmatrix} \end{aligned} $$

    ```


    ($\mathcal{A}, \mathcal{B}, \mathcal{C}, \mathcal{D}, \mathcal{E}, \mathcal{F},
    \mathcal{G}, \mathcal{H}, \mathcal{I}, \mathcal{A}_s$) are the FG stiffness expressed,
    and are given in Appendix A.


    +   - Potential energy due the external transverse load applied:


    ```

    $$\delta V^f = - \int_{0}^{l} q(x)\delta Wdx = - \int_{0}^{l} q(x)\delta(w_b +
    w_x + w_s)dx $$

    ```'
