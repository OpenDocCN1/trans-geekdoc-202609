  md: "Artificial springs implemented at the two ends of the shell are used to simulate\
    \ arbitrary boundary conditions. The potential energy of the boundary artificial\
    \ springs is expressed as:\n\n```\n$U_b = \\frac{1}{2}\\int_{0}^{2\\pi} \\left\\\
    { k_u^2[u(0, \\theta, t)]^2 + k_v^2[v(0, \\theta, t)]^2 + k_w^2[w(0, \\theta,\
    \ t)]^2 + k_{\rho}^2\\left[\\frac{\\Delta w(0,t)}{L_z}\\right]^2 \\right\\} d\\\
    theta \\n+ \\frac{1}{2}\\int_{0}^{2\\pi} \\left\\{ k_{\theta}^2[u(1, \\theta,\
    \ t)]^2 + k_{\\phi}^2[v(1, \\theta, t)]^2 + k_w^2[w(1, \\theta, t)]^2 + k_{\r\
    ho}^2\\left[\\frac{\\Delta w(1,t)}{L_z}\\right]^2 \\right\\} d\\theta \\n(4.15)\n\
    ```\n\n# 4.2.2 Solution procedure\n\nThe mode of the FG cylindrical shell in the\
    \ circumferential direction is defined as a harmonic function, and the axial mode\
    \ is selected as a polynomial. Then displacement functions can be expressed as:\n\
    \n```\n$u(\\eta, \\theta, t) = \\cos(n\\theta+\\omega t)U(\\eta) \\nv(\\eta, \\\
    theta, t) = \\sin(n\\theta+\\omega t)V(\\eta) \\nw(\\eta, \\theta, t) = \\cos(n\\\
    theta+\\omega t)W(\\eta) \\n(4.16)\n```\n\nwhere $\\omega$ is circular frequency\
    \ of vibration and $n$ is circumferential wave number. The axial mode functions\
    \ $U(\\eta)$, $V(\\eta)$, and $W(\\eta)$ expressed by the Chebyshev polynomials\
    \ can be written as:\n\n```\n$U(\\eta) = \\sum_{g=0}^{NT} a_g \\varphi_g^u(\\\
    eta) \\nV(\\eta) = \\sum_{g=0}^{NT} b_g \\varphi_g^v(\\eta) \\nW(\\\\eta) = \\\
    sum_{g=0}^{NT} c_g \\varphi_g^w(\\eta) \\n(4.17)\n```\n\nin which NT is the truncation\
    \ order; $a_g$, $b_g$, and $c_g$ are unknown coefficients; $\\varphi_g^u(\\eta)$,\
    \ $\\varphi_g^v(\\eta)$, and $\\varphi_g^w(\\eta)$ are the Chebyshev polynomials\
    \ of the first kind, of which the recurrence relations are given by:\n\n```\n\
    $\\varphi_0(\\eta) = 1, \\varphi_1(\\eta) = \\eta, \\varphi_{g+1}(\\eta) = 2\\\
    eta\\varphi_g(\\eta) - \\varphi_{g-1}(\\eta), g \\ge 1 \\n(4.18)\n```\n\nThe transformation\
    \ of coordinates from $\\eta$ to $2\\eta-1$ is necessary for applying the Chebyshev\
    \ polynomials since the Chebyshev polynomials are defined in the interval $[-1,\
    \ 1]$, while $\\eta \\in [0, 1]$."
