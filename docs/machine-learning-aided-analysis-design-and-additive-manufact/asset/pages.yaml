    # ## 13.1 Introduction


    Porous structures with microstructural architecture are in high demand for the
    construction industry as they contribute considerably to the overall performance
    in terms of high strength-to-weight ratio [1], energy absorption capacity [2],
    heat and sound insulation [3]. Many studies have been extensively considered on
    the design and optimization of lightweight cellular structures to maximize their
    tunable properties [4–6]. Tri periodic minimal surfaces TPMS are naturally optimized
    as the new generation of lightweight structures [7]. Recently, research activities
    on these functionally graded porous structures (FGPS) have grown significantly.
    Other types of FGPS are strut-based, body-centered cubic lattice, foam, and auxetic
    structures, which also offer exceptional features [3,8,9]. Furthermore, fractal-structures
    that were finely smoothed also offer an effective approach to increasing the design
    space as well as tailoring mechanical properties.


    Among all, the TPMS cellular structures are found to be superior to others in
    terms of mechanical properties [6,11,12]. Lee et al. [13] studied the mechanical
    properties of TPMS cellular structures to show their higher stiffness compared
    to lattice structures. Tran and Peng [14] investigated various types of TPMS composites
    with metallic faces under blast loading, which showed better blast-resistance
    capacity than honeycomb unit functionally graded porous sandwich panels were also
    demonstrated in another study [15,16]. In a recent investigation, Peng et al.
    [17] used both analytical, numerical, and experiments to test the bending capacity
    and absorbed energy of 3D-printed sandwiches with TPMS cores (I-graph and wrapped
    package sandwich (IWP), and Neovius cell unit). The study indicated that the band
    with TPMS-Neo core provided better performance to other units.


    However, the geometry of FGPS TPMS cellular structures is complicated due to its
    continuous-non-intersecting surfaces. The manufacturing process of these structures
    cannot be done by conventional methods [18]. Additive manufacturing (AM) or 3D
    printing—a recent advanced technology—has the ability to manufacture complex designs
    [19,20]. This technique is considered as one of the most important trends in digital
    construction, which allows the freer fabrication


