    right)^p$$\n\n(2.24a)\n\n+   $\\begin{cases} D_{ij} = j-1, & j \\text{ even} \\\
    \ D_{ij} = 2+2(j-i), & i>1, j\\ge i+1 \\text{ and } i+j \\text{ is odd} \\ D_{ij}\
    \ = 0, & \\text{otherwise} \\end{cases}$\n\n(2.24b)\n\nwhere $s = $(\\varphi_1-\\\
    varphi_0)/2$ is the scaling factor.\nThe integral expression of $f(\\varphi)$\
    \ is written as:\n\n$$\\int_{-1}^1 f(\\varphi)d\\varphi = \\mathbf{va} = \\mathbf{vC}^{-1}f$$\n\
    \n(2.25)"
