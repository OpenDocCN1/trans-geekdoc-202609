    #  17.2.1 Aerospace engineering applications


    Aircraft are widely used nowadays as the heyday of globalization, and it has always
    been a challenge to find materials which possess lightweight, temperature resistant,
    and high strength at the same time. Porous structures provide us with a good choice,
    and many attempts have been made to apply porous structures in aerospace field.
    Rosseau et al. investigated the noise reduction potential of porous trailing-edge
    noise devices at an unconventional extreme high-lift air configuration (Fig. 17.4).
    It is found that the flow resistivity is coupled with the average pore size of
    a porous material, and the reduction-frequency excess noise is always accompanied
    with a growth in high-frequency excess noise. Hoe et al. [20] proposed a combined
    experimental and numerical design of graded cellular structures for multifunctional
    aerospace application. A bird strike experiment was conducted by numerical simulation
    to compare the performance of the optimized material to that of a nonnegative
    sandwich structure [21] developed four cellular structure topologies to act as
    a vibration damper in small electric aircraft motor (Fig. 17.5). The topologies
    are found to have lower natural resonance and yield strength to weight ratio.
    Kumar et al. [22] successfully fabricated continuous fiber-reinforced graded composites,
    which have been found to possess very'
