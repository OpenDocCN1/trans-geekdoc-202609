    where $\xi$ and $\eta$ represent the coordinates in $\xi$ and $\eta$ directions,
    $L^n(\xi)$ and $L^n(\eta)$ separately denote the one dimensional basis function
    in the $\xi$ and $\eta$ directions.


    By introducing the coordinate transformations, the plate with complex curved edges
    can be transformed into a computational domain with both varieties along two axial
    directions limited in the interval of $[-1, 1]$. According to the chain rule of
    differentiation, relationships between the first partial derivatives of function
    $f$ in the Cartesian $(x, y)$ coordinate system and $f$ in the natural coordinate
    system $(\xi, \eta)$ it can be given as:


    ```

    $$\frac{\partial f}{\partial x} = |J| \left( \frac{\partial f}{\partial \xi} \frac{\partial
    \xi}{\partial x} - \frac{\partial f}{\partial \eta} \frac{\partial \eta}{\partial
    x} \right)$ $(3.17)$

    ```


    ```

    $$\frac{\partial f}{\partial y} = |J| \left( \frac{\partial f}{\partial \xi} \frac{\partial
    \xi}{\partial y} - \frac{\partial f}{\partial \eta} \frac{\partial \eta}{\partial
    y} \right)$ $(3.18)$

    ```


    ```

    $|J| = \det \begin{pmatrix} \frac{\partial \xi}{\partial x} & \frac{\partial \xi}{\partial
    y} \ \frac{\partial \eta}{\partial x} & \frac{\partial \eta}{\partial y} \end{pmatrix}$

    ```


    ```

    $J_{11} = \frac{\partial \xi}{\partial \eta} = \sum_{i=1}^{m} \sum_{j=1}^{n} N_{ij}(\xi,
    \eta) x_{ij,\eta}, J_{12} = \frac{\partial \xi}{\partial \xi} = \sum_{i=1}^{m}
    \sum_{j=1}^{n} N_{ij}(\xi, \eta) \eta_{ij}$ $(3.19)$

    ```


    ```

    $J_{21} = \frac{\partial \eta}{\partial \eta} = \sum_{i=1}^{m} \sum_{j=1}^{n}
    N_{ij}(\xi, \eta) x_{ij}, J_{22} = \frac{\partial \eta}{\partial \xi} = \sum_{i=1}^{m}
    \sum_{j=1}^{n} N_{ij}(\xi, \eta) \eta_{ij}$

    ```


    In the natural coordinate system, the function $q(\xi, \eta)$ is expressed by
    Chebyshev polynomials of first order:


    ```

    $q(\xi, \eta) \equiv \sum C_k \mathbf{a}_k$ $(3.20)$

    ```


    ```

    $C_k = C_{M-1}(\xi) \otimes C_{N-1}(\eta)$ $(3.21)$

    ```


    ```

    $C_k = \cos{[0 \cdot \cos^{-1}(\xi)], [1 \cdot \cos^{-1}(\xi)] \cdots, \cos[(M-1)
    \cdot \cos^{-1}(\xi)]}$ $(3.22)$

    ```


    ```

    $C_{N-1}(\eta) = \cos{[0 \cdot \cos^{-1}(\eta)], [1 \cdot \cos^{-1}(\eta)] \cdots,
    \cos[(N-1) \cdot \cos^{-1}(\eta)]}$ $(3.23)$

    ```


    ```

    $$\mathbf{a} = (a_{0,0}, \dots, a_{0,N-1}, a_{M-1,0}, \dots, a_{M-1,N-1})^T$ $(3.24)$

    ```


    where symbol $\otimes$ is the Kronecker product; $\mathbf{a}$ is the coefficient
    vector of expansion. $M$ and $N$ are the truncation number of polynomials, which
    separately represent the total terms of polynomials in $\xi$ and $\eta$ directions.'
