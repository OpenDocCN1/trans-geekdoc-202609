    manufacturing have produced various excellent scientific outputs. This section
    systematically introduces these works in five aspects: open-cell foam, closed-cell
    foam, 2D honeycomb, 3D lattice, and graded cellular solids.


    #  14.3.1 Open-cell foams


    The relative density of open-cell foams [44–46] is generally lower than that of
    closed-cell foams. Due to the lack of support from cell-wall, the ability of impact
    resistance and energy absorption of open-cell foams is generally weaker than that
    of closed-cell foams. However, open-cell foam has unique advantages in noise reduction
    and biological applicability, this has been widely considered by different research
    groups [47–52].


    Nava et al. [44] filled spheres in a cylindrical container to produce open-cell
    foams, represented by the area spheres. They reversely engineered the 3D model
    by inverting X-ray computed tomography. By adjusting the size of the gate, open-cell
    foams with different porosities could be produced. Finally, metal additive manufacturing
    was used to prepare the open-cell foam according to the predictions to obtain
    the final specimens with different porosities (as shown in Fig. 14.9). The authors
    carried out quasi-static compression tests on these specimens. The relationships
    between elastic modulus and yield strength with relative density were achieved,
    and the corresponding Gibson-Ashby relations were fitted.'
