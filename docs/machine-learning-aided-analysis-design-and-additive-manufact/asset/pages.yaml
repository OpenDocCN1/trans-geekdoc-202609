    # 4.3 Linear forced vibration


    # 4.3.1 Governing equations


    For the porous cylindrical shell, the vibration response is composed of the superposition
    of multiple modes. In view of computation efficiency and convergence rate, Chebyshev
    polynomials are employed here. Then the admissible functions of the cylindrical
    shell can be expressed as:


    ```

    $$\begin{aligned} u(\eta, \theta, t) &= \sum_{n=1}^{N} \sum_{m=-G}^{G} a_{nm}T_m(\eta)\cos(n\theta)e^{i\omega
    t} = \mathbf{V}_u^T\mathbf{q}_w \ v(\eta, \theta, t) &= \sum_{n=1}^{N} \sum_{m=-G}^{G}
    b_{nm}T_m(\eta)\sin(n\theta)e^{i\omega t} = \mathbf{V}_v^T\mathbf{q}_w \ w(\eta,
    \theta, t) &= \sum_{n=1}^{N} \sum_{m=-G}^{G} c_{nm}T_m(\eta)\cos(n\theta)e^{i\omega
    t} = \mathbf{V}_w^T\mathbf{q}_w \end{aligned}$

    ```'
