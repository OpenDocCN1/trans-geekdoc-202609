    foundation. The main focus of this paper is to establish a unified dynamic

    analysis model for shallow on elastic foundations. In the following

    subsections, a unified theoretical formula model will be established. Then, the

    convergence analysis and validity analysis will be carried out. Finally, the effects

    of factors on free vibration and forced vibration induced steady-state

    response and transient-state response will be investigated.


