    #  4.5.2 Results and discussion


    In the following, the nonlinear forced vibration with 1:1 internal resonance of
    the FG porous circular cylindrical shell is investigated. Unless otherwise stated,
    the geometric and material parameters are the same as those in Section 4.4.3.
    The supplementary parameters are as follows:


    $$\epsilon = 0.0053, f_d = 0.0015.$


    According to Section 4.4.3, the fundamental natural frequency corresponds to the
    mode $(m=1, n=5)$. When the excitation is equal to the natural frequency of the
    mode $(m=1, n=5)$, the driven mode $Z_s(t)$ is excited. The 1:1 resonance can
    occur between the driven and companion modes because they have the same natural
    frequencies.


    In order to calculate the nonlinear frequency response of the shell accurately
    and efficiently, the convergence study should be executed to determine the number
    of modes. Table 4.9 lists different combinations of generalized coordinates. GC2
    and GC3 take asymmetric modes and modes having $2 \times n$ circumferential axes
    into account.


    Fig. 4.18 compares the nonlinear frequency responses of the FG circular cylindrical
    shell with different combinations of generalized coordinates. It can be seen that
    the frequency of GC2 and GC3 are almost coincident. Therefore the GC combination
    is accurate enough to calculate the nonlinear frequency response of FG circular
    cylindrical shells.


    To validate the nonlinear forced vibration results, a comparison study related
    to an isotropic cylindrical shell under simply supported boundary conditions is


    Table 4.9 Generalized coordinates


    | Generalized coordinates |

    |---||

    | GC1 | $X_{1,0}^a, X_{1,1}^a, X_{1,2}^a, Y_{1,0}^b, Y_{1,1}^b, Y_{1,2}^b, Z_{1,0}^c,
    Z_{1,1}^c, Z_{1,2}^c$ |

    | GC2 | $GC1 + Z_{1,0}^d, Z_{1,1}^e, Z_{1,2}^f$ |

    | GC3 | $GC2 + Z_{3,2}^g$ |'
