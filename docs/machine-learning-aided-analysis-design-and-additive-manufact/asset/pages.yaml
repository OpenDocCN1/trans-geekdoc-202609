    \ E_2/E_1 = 1 - G_2/G_1, 0 < e_0 < 1; e_m$ is the porosity coefficient for mass\
    \ density, which can be acquired through $e_m = 1 - \rho_2/\rho_1; 0 < e_m < 1$.\
    \ The shear modulus is related with Young's modulus and Poisson's ratio $\nu$\
    \ through\nnG = E/2(1+\nu)$.\n\nFrom the material schematics, for the distribution\
    \ type 1, the maximum values of Young's modulus and mass density are located at\
    \ top and bottom surfaces of the FGP plate, while the minimum value of the properties\
    \ is on the midplane. For the distribution type 2, the maximum and minimum values\
    \ of Young's modulus and mass density are distributed on the top and bottom surfaces,\
    \ respectively. Based on the general connection of mechanical properties [9],\
    \ the above coefficients of the FGP plate can be related with:\n\n```\n$$\\frac{E_2}{E_1}\
    \ = \\left(\\frac{\rho_2}{\\rho_1}\\right)^2$ (12.3)\n```\n\n```\n$e_m = 1 - \\\
    sqrt{1 - e_0}$ (12.4)\n```\n\n# 12.3 Stochastic free vibration analysis\n\n# 12.3.1\
    \ Free vibration analysis of functionally graded porous plate\n\nFor the free\
    \ vibration analysis, typically as a multidegree-of-freedom system, the governing\
    \ equation for the free vibration analysis of FGP plate is presented as:\n\n```\n\
    $$\\mathbf{M} + \\mathbf{K} = \\mathbf{C} = 0, \\quad \\ddot{\\mathbf{u}}(t) =\
    \ d^2\\mathbf{u}(t)/dt^2$ (12.5)\n```\n\nwhere $\\mathbfddot{u}(t)$ is the acceleration\
    \ vector; $\\mathbf{u}$ is the deflection vector; $\\mathbf{M}$ and $\\mathbf{K}$\
    \ are the global mass and stiffness matrices of the FGP plate, which is assembled\
    \ from individual element mass matrices $\\mathbf{M}^e$ and stiffness matrices\
    \ $\\mathbf{K}^e$ through\n\n```\n$$\\mathbf{M}^e = \\int_{V_e} \\rho N dV, \\\
    quad \\mathbf{K}^e = \\int_{V_e} \\mathbf{B}^T\\mathbf{DB} dV$ (12.6)\n```\n\n\
    where $e$ is the individual element within the FGP plate; $\rho$ is the mass density\
    \ of the FGP plate; $\\mathbf{N}$ is the deflection interpolation matrix for an\
    \ element; $\\mathbf{B}$ is the strain deflection compatibility matrix for an\
    \ element; $\\mathbf{D}$ is the elasticity stiffness matrix; $V_e$ is the volume\
    \ of an element."
