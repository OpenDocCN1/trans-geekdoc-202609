  md: '# # An introduction to functionally graded porous materials and composite structures


    Da Chen¹,², Kang Gao³, Jie Yang⁴ and Sritawat Kitipornncha⁵

    ¹Department of Infrastructure Engineering, The University of Melbourne, VIC, Australia

    ²²School of Civil Engineering, The University of Queensland, St. Lucia, QLD, Australia

    ³School of Civil Engineering, Southeast University, Nanjing, Jiangning District,
    P.R. China

    ⁴School of Engineering University, Bundoora, VIC, Australia


    # 1.1 Porous materials


    Natural porous media, such as rocks, timbers, and biological bones, have inspired
    researchers and engineers to design lightweight composite forms by introducing
    cells into the originally homogeneous solid substances, leading to the development
    of artificial porous materials [1,2]. Not all the composites with internal pores
    should be called porous materials, as the porosity here does not refer to undesired
    defects during fabrication or usage. Instead, evenly or unevenly distributed pores
    are manually generated inside the solid matrix to achieve superior material performance
    for space applications, including reduced weight, improved absorption capacity
    and mechanical, thermal, chemical, electrical, biological, and optical behaviors.
    Note that generally speaking, cellular material is another term for porous material.


    The development of artificial porous materials has been a hot research topic and
    experienced a rapid advance in recent decades. Various porous materials were proposed
    and designed in terms of their cell frame morphologies (regular or irregular,
    open or closed, specific cell sizes, distributions, and shapes), to form cell
    walls (metal, polymer, concrete, ceramic, or glass), and the fluid phases of pores
    (gas or liquid), as illustrated in Fig. 1.1.

    The size of interval pores may vary across microscopic, mesoscopic, and macroscopic
    scales. These changeable parameters lead to the vast variety of property tailoring
    and the great potential of porous materials in achieving multifunctionalities.


    According to the geometric morphologies, porous materials are commonly classified
    into honeycombs, and lattices [3], as they are distinguished by the cell topologies;
    the randomness in cell sizes, cell shapes, and cell distributions of foams (see
    Fig. 1.2A) differentiates them from honeycombs and lattices with regularized geometries,
    of honeycombs (Fig. 1.2B) are formed by an array of identical hollow cells within
    lattices (Fig. 1.2C)'
