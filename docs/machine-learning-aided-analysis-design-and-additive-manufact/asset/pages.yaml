  md: '# Mechanical behavior of additively manufactured functionally graded porous
    structures


    Yu Duan$^{1,2,3}$, Bing Du$^{1,2}$, Xianhang Zhao$^{1,2}$, Bing Hou$^{1,2}$ and

    Yulong Li$^{1,2}$

    $^1$School of Aeronautics, Northwestern Polytechnic University, Xi''an, Shaanxi,
    P.R. China,

    2$Joint International Research Laboratory of Impact Dynamics and Its Engineering

    Applications, Northwestern Polytechnic University, Xi''an, Shaanxi, P.R. China,$3$Center

    for X-mechanics, Zhejiang University, Hangzhou, Zhejiang, P.R. China


    # 15.1 Introduction


    Cellular materials and porous structures have superior energy absorption capabilities.
    They have been widely applied in various engineering applications, including energy
    absorption, structural protection, and blast dissipation [1–5]. As a typical cellular
    material, foam exhibits excellent shock mitigation and energy absorption under
    velocities and impact loads [6–9]. It has been shown that the property of foams
    depends on their relative density, and their designability can be limited by using
    uniform-density distribution. Consequently, to improve the mechanical of foams,
    graded foams have gained attention in recent years [10–15]. By optimizing the
    distribution of cell size, morphology, or relative density, graded foams exhibit
    multiple mechanical properties without varying loads.


    There have been some limited studies on the compressive behavior of foams [16–18],
    Gupta and Ricci [16] carried out a study on micro balloon foams with a graded
    volume fraction and wall thickness. Mackey et al. [17] constructed the mechanical
    properties of graded foams with uniform foams. Zeng et al. [18] suggested that
    placing the hardest layer in contact with the striker and the weakest layer as
    the impacted layer could achieve maximum energy absorption. However these graded
    foams possess a discrete gradient with a piecewise variation of density, which
    limits the performance of these materials. To manufacture foam with a continuous
    gradient, Hangai et al. [19] fabricated continuously graded aluminum foams by
    the stir casting route. Brothers and Duan [20] density-graded foams using the
    nonuniform foambuilder and the powder-structure hybrid, respectively. Both found
    that graded foams exhibited a smoothly rising plateau, which is due to the progressive
    deformation of each component layer. Once a weaker layer fails, a stronger layer
    would supplement to sustain the applied load and stress would exceed the strength
    of the current layer.


