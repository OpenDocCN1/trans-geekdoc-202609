    # # 11.6 Conclusion


    # ## 11.6.1 Summary and conclusions


    For the chapter, a freshly developed stochastic analysis of FGP structures is
    thoroughly investigated. As an expansion of the classical FSDT, different conditions
    of spatially dependent and independent uncertainties are implemented for one complex
    uncertainty governing equation, a freshly developed framework, as the MLA-SSA,
    has been established for the evaluation of advanced FGP structures. For, the population
    NN and X-SVR are adopted to calculate the probabilistic features of the defects
    on small amount of training resources. Consequently, by using these techniques,
    more robust and efficient safety evaluation could be made for real-life composite
    applications. In the numerical investigations, by implementing the proposed framework
    in practical composite structures, the accuracy, effectiveness, and applicability
    for the MLA-SSA method were clearly demonstrated for the FGP structures.


