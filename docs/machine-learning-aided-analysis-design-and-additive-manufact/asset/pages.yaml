  md: '# 5.1 Introduction


    In fields such as aerospace and mechanical engineering, some structures are composed
    of thin-walled open cylindrical shells, spherical shells, hyperbolic parabolic
    shells, etc. These structures are characterized by a small radius of curvature
    relative to the size of the other parameters. It is customary to call the above
    structures shells reign supreme because of their excellent load-carrying capacity.
    As a result of the extremely harsh working de-nditions of these structures, it
    is of great significance to carry out comprehensive and profound analysis for
    structural design and failure assessment. In the last years, functionally graded
    porous (FGP) materials have been widely used in various industrial fields because
    they not only possess the excellent properties of functionally graded materials
    but also have superior mechanical properties, which are achieved through appropriate
    boundary distribution [1]. The aim of this chapter is to develop a unified analytical
    model for the functionally graded porous opening shell constrained by arbitrary
    boundary conditions and on an elastic foundation,


    In the past years, a considerable effort was directed towards the dynamic characteristic
    analysis of FGM structures. While the investigation of FGM structures, complex
    structures situated on elastic foundations such as shells, was relatively rare
    [2–5]. Most of the objects are simple structures such as beams, plates, and cylindrical
    shells. The research of FG shells was mostly limited to the free vibration of
    homogeneous isotropic or FGM structures. Najafizadeh and Isvandaei [5] studied
    the vibration of FG cylindrical shells with support rings arranged at arbitrary
    positions on the shell''s axial direction. Shah et al. [6] investigated the vibration
    characteristics of thin-walled FGM cylindrical shells under the framework of Love''s
    shell theory, in which the displacement was exponentially distributed along the
    radial direction. Ng et al. [7] proposed the motion equations for FG shells subjected
    to the harmonic loading and analyzed the dynamic stability by Bolin''s method.
    Yan et al. [8] studied the effects of boundary conditions, geometric parameters,
    and porosity distribution of the response of FGP shells grounded on Donnell''s
    shell theory in connection with the Galerkin method. Santos et al. [9] investigated
    the vibration characteristics of FG cylindrical shells by a semianytical method.
    Gao et al. [10] employed the analytical method to analyze the resonance of the
    FG cylindrical shell subjected to simple harmonic loads. Wan and Wu [11] studied
    the effects of pore coefficient, on the free vibration of FG cylindrical shells
    on a sinusoidal shell deformation theory. Li et al. [12] proposed a new semianytical
    method to analyze the vibration of FG cylindrical shells constrained by arbitrary
    boundary conditions using Jacobi polynomials, Fourier series as well as the Rayleigh–Ritz
    method. Zhao et al. [13] also modeled the dynamics by an energy approach and then
    analyzed the vibration of the FGP cylindrical shell. Artificial springs was used
    to model arbitrary boundary conditions and Fourier series with auxiliary functions
    was employed to express the displacement field. A semianality method was employed
    by them to analyze the vibration behavior of FGP doubly curved panels'
