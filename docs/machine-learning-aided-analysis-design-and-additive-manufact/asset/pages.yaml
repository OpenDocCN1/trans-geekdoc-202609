  md: "# 13.4 Results and discussion\n\n# 13.4.1 Mechanical\\u2019s properties\\u00u2019s\
    \ of triply periodic minimal surface composite-based structures\n\nEarly research\
    \ on lattice structures was based on a simplified analytical approach due to the\
    \ limitations of fabrication techniques. Calladine and English [85] described\
    \ two different types of structures. Type I cellular structures present a nearly\
    \ constant (if not increasing) strength under loading, while type II structures\
    \ show a softening caused by the buckling of cellular material and are more sensitive\
    \ to inertial effects. The response type of a lattice structure is determined\
    \ by the number of nodes and struts according to Maxwell Criteria [9]. To evaluate\
    \ the mechanical properties of lattice structures (Ls), an analytical model has\
    \ been described by Ashby and Gibson. They showed that relative density (\\rho*/\\\
    rho_s) is the most important characteristic in cellular materials [86]. Although\
    \ the cell shape, size, edge, and face connectivity can affect the mechanical\
    \ properties, they are neglected in this model, only considering ligament bending.\
    \ Fig. 13.12 presents the Ashby-Gibson model (A) and its deformation in bending\
    \ (B) and buckling (C)\n\nBased on these assumptions, an equation to predict the\
    \ relationship between elastic modulus and relative density is given by\n\n```\n\
    \\varnothing = C\\rho^*^n\n```\n\nwhere $\\varnothing$ is the property of interest,\
    \ $\rho^*$ is the density of the bulk material, $n$ is the density exponent, and\
    \ $C$ is the factor accounting for geometric imperfections. A geometric factor\
    \ $C<1$ for the gyroid structure would indicate imperfections in the printed lattice,\
    \ and the value of $C=1$ is the theoretical limit of the relevant property (i.e.,\
    \ defect-free). An exponent value of $n=1$ indicates the structure showing stretching-dominated\
    \ behaviors under compression, while $n=2$ indicates bending-dominated behavior\
    \ [87], where $E^*$ is the elastic modulus of cellular material, $E_s$ is the\
    \ elastic modulus of solid material, $\rho^*$ is the density of cellular\n\n![](img/90ed165a39fa708ec438fcda79319c25_332_0.png)\n\
    \nFigure 13.12 Schematic representation of the Ashby-Gibson model [86]."
