    # 8.2.5 Analytical solution for a simple supported functionally graded beam (S-S
    FG beam)


    In this section, the analytical solution is given for the case of simply supported
    functionally graded beam presented in Fig. 8.3 (S-S FG beam) under the uniform
    load distributed over its entire length.


    Analytical solutions of the motion equations are provided, based on Navier-type
    solutions. The unknown displacements $u_0, w_b, w_s$ and $\phi$ are assumed to
    be combinations of known trigonometric functions which satisfy the boundary conditions
    and unknown coefficients to be determined for each value of $\eta$.


    ```

    $$\begin{aligned} u_0(x,t) &= \sum_{n=1}^{\infty} U_n\sin(\lambda_n x)e^{i\omega_n
    t} \ w_b(x,t) &= \sum_{n=1}^{\infty} W_n\sin(\lambda_n x)e^{i\omega_n t} \ w_s(x,t)
    &= \sum_{n=1}^{\infty} V_n\sin(\lambda_n x)e^{i\omega_n t} \ \phi(x,t) &= \sum_{n=1}^{\infty}
    \Phi_n\sin(\lambda_n x)e^{i\omega_n t} \end{aligned}$

    ```


    (8.16)


    $\omega_n$ is the eigenfrequency associated with the $n$th eigen, $\lambda_n =
    n\pi/L$, and $U_n, W_n, V_n$, and $\Phi_n$ are the unknown coefficients.


    ![](img/90ed165a39fa708ec438fcda79319c25_230_0.png)


    Figure 8.3 Simply supported functionally graded beam (S-S FG beam) under uniform
    load.'
