    # 7.1 Introduction


    Functionally graded porous nanocomposites are a new class of composites by mixing
    carbon nanofillers, such as carbon nanotubes, fibers, and graphene platelets (GPLs),
    with open-cell or closed-cell foams in a specific distribution [1]. Compared to
    traditional materials, the nano-reinforced porous composites present high strength
    to weight ratio, outstanding energy absorbing capacity, and advantageous physical
    properties, especially for GPL-based nanocomposites with higher surface area and
    good dispersion ability [2]. The great potential of functionally graded graphene
    reinforced (FGGR) polymers in aerospace, civil, biomedical, defense, and automotive
    has attracted large numbers of research efforts from both academic and industrial
    sectors.


    The mechanical characteristics and structural behavior of functionally graded
    (FG) porous structures (such as beams [3], plates [4], shells [4], and arches
    [5]) have been comprehensively investigated on bending, buckling, vibration, and
    dynamic analysis. Chen et al. [6] studied the free and forced vibration of FG
    porous beams and found symmetric FG porosity distribution obtains best mechanical
    performance. The nonlinear dynamic analysis of imperfect FG metal beams was conducted
    by Gao et al. [7]. Chen et al. [8] also presented and bending analysis of FG porous
    plate using Chebyshev-Ritz method. Zhao et al. [9] analyzed free vibrations of
    FG porous rectangular plates with uniform elastic boundary conditions. Gao et
    al. [10] proposed an analytical method for the primary resonance analysis of cylindrical
