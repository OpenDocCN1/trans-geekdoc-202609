- pgno: 303
  md: "where $\\lambda(\theta)$ and $\\Phi(\theta)$ are the stochastic solutions of\
    \ eigenvalue and eigenvector. it should be noted the above equation is a stochastic\
    \ system with nondeterministic solutions, which cannot be solved directly through\
    \ analytical or mathematical formulations. To provide a valid solution to the\
    \ stochastic problem, the machine learning technique is considered as an alternative\
    \ and introduced as follows.\n\n# 12.4 Machine learning aided stochastic vibration\
    \ analysis\n\n# 12.4.1 Preliminary\n\nFor the machine learning aided stochastic\
    \ vibration analysis framework, the machine learning technique is the main tool\
    \ to investigate the underpin relation between the random inputs and the structural\
    \ outputs under different conditions. Many types of machine learning techniques,\
    \ such as response surface method (RSM) [10], artificial neural networks [11],\
    \ and Gaussian process regression (GPR) [12] have been implemented into various\
    \ physical mechanisms. Based on the traditional support vector regression (SVR)\
    \ theory, the SVR is also proposed and illustrated effective in practical engineering\
    \ uncertainty problems the distinct advantages of using machine learning technique\
    \ can be summarized as follows:\n\n+   1. Identifying the inherent relationship\
    \ between systematic uncertainties and structural responses, and make statistical\
    \ evaluations and reliability profiles over potential structural failures.\n2.\
    \ Implementing the calculation on the machine learning technique can largely reduce\
    \ the computational costs, otherwise against complicated analytical derivations\
    \ or repetitively finite element analysis simulations.\n\nThe traditional uncertainty\
    \ quantification methods normally face analytical or numerical bounds with practical\
    \ complex engineering applications, especially for nonlinear analysis involved\
    \ three-dimensional degree-of-freedom objects. The emergence of machine learning\
    \ technique serves as robust alternative to such problems, and the two of typical\
    \ algorithms (i.e., GPR, X-SVR) are explained in this chapter for illustrations.\n\
    \n# 12.4.2 Gaussian process regression\n\nFor the Gaussian process, it defines\
    \ that for any two datapoints within the function, the corresponding outputs behave\
    \ a multivariate Gaussian distribution. In GPR, assume a group of input and output\
    \ vectors as x and y, the relationship between is formulated as:\n\n```\ny = f(x)\
    \ + \\varepsilon \\quad (12.14)\n```"
