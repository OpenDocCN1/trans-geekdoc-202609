    # I. Concrete digital fabrication methods


    There are in general two categories of digital fabrication techniques for concrete
    structures depending on the usage of framework [60]. The first technique is called
    3DCP. To begin, the freshly mixed cementitious materials are extruded out of a
    nozzle to form one layer. After that, the nozzle moves up by a height and repeats
    the extrusion process that allows the subsequent filament on the upper layer to
    deposit on the existing filament on the lower layer. Ultimately, the concrete
    structure is fabricated through the layer-by-layer deposition process, and therefore
    3DCP is known as the No Formwork (free) fabrication method. A typical-set of 3DCP
    consists of the following components: (1) a concrete mixing system where raw materials
    (binder, aggregate, water, additive, etc.) are mixed to produce the freshly mixed
    concrete; (2) a pumping system where the freshly flowable concrete is transported
    by the pump to move through the hose that is linked to the printhead (nozzle);
    (3) robotic system with the controller and multiple-axis robotic manipulator,
    and the nozzle is mounted on the robotic arm that moves based on the designed
    tooling during the extrusion process [61]. An example of a 3DCP set is shown in
    Fig. 13.


    Since 3DCP adopts a de-free printing process, the quality finishes the target
    concrete structure primarily depend on the material properties of fresh concrete.
    Here three important material properties are introduced, which are key to achieving
    the 3D printed concrete structure with adequate quality. The first property is
    pumpability, meaning before extrusion the concrete needs to be flowable enough
    to be transported to the nozzle without experiencing any blockage. The second
    property is extrudability, the concrete needs to be extruded as a continuous filament
    with an unaltered material. The third property is buildability, meaning after
    the extruded concrete needs to develop green strength to resist the self-weight
    of the upper layers (achieving the minimum deformation of the overall structure).
    Generally there have been ongoing research on the relationships between concrete
    properties and material properties [62]. Besides, there is also a growing interest
    in promoting the sustainable aspect of 3DCP by replacing the raw materials (cement
    and river) with recycled materials [33,63], including (1) supplementary cementitious
    materials (such as fly ash and silica fume), substituting cement [64,65]; (2)
    waste glass particles and rubber crumb subrutting agent [66–68]; (3) cement-ferrite
    alkali-activated materials/geopolymer [69–71]; (4) limestone called clay cement
    (LC) [72,73]. The fresh properties (pumpability, extrudability, buildability)
