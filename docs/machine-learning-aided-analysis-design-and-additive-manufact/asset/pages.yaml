    # # 5.4 Conclusion


    In this chapter, the free and forced vibration model of a FGP shallow shell resting
    on an elastic foundation under arbitrary boundary conditions is established by
    adopting a spectral Chebyshev method and FSDT. The convergence and validity of
    the spectral Chebyshev models are verified by implementing a series of convergence
    tests and comparative studies. In addition, the effects of key factors, such as
    porosity, elastic foundation, boundary conditions, and load types, on vibration
    behaviors of FGP shallow shells are discussed. The main conclusions are summarized
    as follows:


    +   1. The ratio of thickness to radius has a great influence on both the steady-state
    response and the transient response. Also, with the increase of the ratio of thickness
    to radius, the vibration responses of FGP shallow shells can be suppressed.


    +   2. The change of porosity coefficient can affect the dynamic characteristics.
    Therefore the forced vibration performances of FGP shallow shells can be adjusted
    by selecting the porosity coefficient.


    +   3. The transient responses of FGP shallow shells are closely related to the
    load type. Also, for the same parameters'' configuration, the time-history amplitude
    is the largest for the'
