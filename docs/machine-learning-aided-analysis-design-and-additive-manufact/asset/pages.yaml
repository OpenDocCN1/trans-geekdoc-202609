    While most industrial applications need specific characteristics in both structural
    and functional purposes, that is a gradual change in composition or structure
    in a certain direction. Inspired by this idea, a novel composite that combines
    the advantages of functionally graded materials with the properties of porous
    materials, called functionally graded porous (FGP) materials [3], is proposed
    by controlling density/or the size of the unit cells. FGP materials are utilized
    in many specifically engineered areas with its excellent energy absorption and
    significant strength properties, which comes from special adjustments to its structural
    shape and compositional modification, especially in the form of porosity distribution,
    to achieve the form that meets engineering requirements [4,5]. Therefore FGP materials
    have been commonly selected for a wide range of engineering applications such
    as absorbing systems, porous elastic sound absorbers, heat exchangers, construction
    materials, and electromagnetic shielding (6–9).


    This chapter aims to review the applications of FGP structures in various field
    and the organization. Section 17.2 introduces the applications in aero-space engineering,
    civil engineering, automotive engineering, machinery and equipment, biomedical
    engineering, defense engineering, and energy and electronic. Section 17.3 presents
    the research gaps of the applications of gradient materials and identifies the
    future directions, by Section 17.4 which is the summary and concluding remarks.


    # 17.2 Functionally graded porous material trending applications


    Demand is increasing for advanced, lightweight materials and structures with new
    functionalities and enhanced performance to meet the ongoing targets of the UN
