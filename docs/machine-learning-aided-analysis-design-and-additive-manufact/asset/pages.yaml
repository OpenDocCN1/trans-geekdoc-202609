    # ## 17.3 Research gaps and future directions


    As an advanced material, FGP material has demonstrated great potential for applications
    in many fields, like as aerospace engineering, civil engineering, automotive engineering,
    and other engineering sectors as mentioned above. Many researches have been conducted
    numerical and experimental studies to gain a deeper understanding in this area;
    however, there are still many challenges and problems left to be solved for further
    applications in engineering fields:


    +   - The fabrication of FGP material


    Despite the fact that sophisticated production equipment and advanced manufacturing
    processes have thrown new light on making FGP materials, there are'
