- pgno: 384
  md: 'Mechanical behavior of additively graded porous structures


    carried out based on the ASTM D1621 standard. The manufactured specimens are compressed
    between two circular steel plates up to a nominal strain of 0.8 (beyond the densification
    threshold). The applied loading force $F$ is measured by the load cell and the
    corresponding normal stress is calculated by $\sigma = F/A_0$ (where $A_0$ is
    the initial cross-sectional area of specimens). The cross displacement $\Delta
    L$ is measured by the optical extensometer and the corresponding normal strain
    is calculated by $\varepsilon = \Delta L/L_0$ (where $L_0$ is initial length of
    specimens along the loading-direction). Two digital cameras are used to capture
    the global deformation evolutions for two faces of specimens. The frame rate and
    image resolution are 24 fps and $1280 \times 800$ pixels, the strain contours
    of specimens are then calculated by the digital image correlation (DIC) method.
    The DIC method matches the corresponding points between two images. To maintain
    conciseness, the detailed descriptions of the DIC method are not provided here
    and can be found in Refs., [38, 39].


    #  15.1.2 Dynamic loading


    The Split Hopkins Bar has been widely used in testing the mechanical properties
    of materials due to its accurate measurement and constant loading rate [40,41].
    Two specimens, including the direct impact test and the Taylor test, are considered
    here to investigate the crushing behaviors of additively manufactured Voronoi
    foams. In the direct impact test, a specimen is cemented on the support bar, and
    the impact bar is free to compress the specimen (Fig. 15.1A). In the Taylor test,
    the same specimen is cemented on the impact bar, and the support experiences dynamic
    impact (Fig. 15.1B). The two bars have the same diameter of 10 mm and are both
    made of Nylon PA66. The lengths of the impact bar and support bar are 400 and
    300 mm, respectively. In both, a pair of strain gauges are mounted at a distance
    of 100 mm from the specimen-support interface to record the strain pulse $\varepsilon_{bar}(t)$.
    The semiconductor strain gauges, amplify the transmission pulses in Nylon materials,
    are observed; the loading force $F$ is calculated by $F = S_{bar} E_{bar} \varepsilon_{bar}(t)$,
    where $S_{bar}$ and $E_{bar}$ are the cross-sectional area and elastic modulus
    (513 MPa) of the bar. Finally, the normal stress $\sigma$ of specimens is calculated
    via $F/A$, where $A$ is the initial cross-sectional area of specimens. It should
    be pointed out that the strain pulse recorded by the strain gauges is equal to
    that on the specimen-support bar face. It has barely influences the experimental
    results [39].


    In addition, a high-speed camera is used to capture the evolution of successive
    deformation during the dynamic test. The image resolution and frame rate are set
    to $512 \times 384$ pixels and 33,000 fps, respectively. From the recorded figures,
    the strain contours of specimens and the displacement-time histories of two bars
    can be obtained via the DIC. The relative displacement of two bars $\Delta L$
    is applied to determine the nominal strain $\varepsilon$ of specimens via $\varepsilon
    = \Delta L/l$, where $l$ is the initial length of specimens.'
