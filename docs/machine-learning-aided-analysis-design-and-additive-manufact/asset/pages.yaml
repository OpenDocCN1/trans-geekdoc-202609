    \n# 11.4 Machine learning-aided stochastic static analysis\n\n# 11.4.1 The Karhunen-Loève\
    \ expansion\n\nAccording to the deterministic static analysis, spatially independent\
    \ uncertainties can be explained by adopting the random variable to the martial\
    \ properties of Young's modulus and Poisson's ratio. For different engineering\
    \ projects, different types of random field being taken into account for various\
    \ applications based on the data collected from real-life. Hence, $H(x,\\theta)$\
    \ is used to explain the random fields of systematic properties. More specifically,\
    \ considering the continuous parameter $x\\in\\mathbb{R}$, for given parameter\
    \ $x_0$, $H(x_0,\\theta)$ is random variable, such that, $\\forall x_0\\in\\mathbb{R},\
    \ H(x_0,\\theta)~f_{H(x_0,\\cdot)}(t)$, in which, $f_{H(x_0,\\cdot)}(t)$ denotes\
    \ the PDF of the corresponding random variable; for the particular outcome $\t\
    heta_0$, $H(x_0,\\theta_0)$ denotes one possible realization of the random field."
