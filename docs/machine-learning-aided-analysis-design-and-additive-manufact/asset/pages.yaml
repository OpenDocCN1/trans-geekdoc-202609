  md: '![](img/90ed165a39fa708ec438fcda79319c25_354_0.png)


    **Figure 14.5** Schematic representation of a typical selective sintering setup.

    Source: Reproduced with permission from Wang X, Jiang M, Zhou Z, Gou J, Hui D.
    3D printing of polymer matrix composites: a review and perspective. Compos Part
    B Eng 2017;110:42–58. Copyright 2017, Elsevier.


    Selective laser sintering (SLS) and selective laser melting (SLM) are two typical
    manufacturing techniques of PBF. Take SLS as an example, as shown in Fig. 14.5,
    the system consists of a powder bed, powder supply platform, roller, laser source,
    and scanner system. Powers then, high-energy laser source is used as the heat
    source to melt the powder of the current layer. Afterward, the next layer of powder
    is covered on the previous layer by a roller. Based on the 2D plane of the scanner
    system is applied to melt a new layer of powder according to the preset processing
    path. Finally, the melting process is repeated until the entire 3D model is manufactured.
    SLM is a variant of SLS, whose processing orders are almost the same. SLS ensures
    densification through laser sources with higher energy density to produce almost
    dense products without postprocessing. SLS can better control the crystal structure
    of resulting materials and make them a higher degree of densification. SLS applies
    to a wider range of materials including polymer, metal, and alloy. However, SLM
    can only be used for specific metals and alloys, such as aluminum, and steel.


    # 14.2.2 Material extrusion


    Material extrusion firstly squeezes base material from a nozzle and forms the
    finished specimen with a 3D structure by melting and stacking according to the
    determined track. Fused filament fabrication (FFF) is the most widely used additive'
