    \n# # 16.2 Materials and methods\n\n# ## 16.2.1 Experimental set-up\n\nQuasi-static\
    \ compression tests are conducted at an initial strain rate of $10^{-3}^{-1}$.\
    \ The tests are carried out according to ASTM D1621-16 using a universal testing\
    \ machine. The specimen is compressed between two cellular plates. The applied\
    \ load $F$ and the deformation $\\Delta$ of the specimen are measured by the load\
    \ cell and optical extensometer, respectively. A digital camera is employed to\
    \ capture the global deformation during the tests. The image resolution and acquisition\
    \ frequency is $1280 \\times 800$ pixels and 50 fps, respectively.\n\n# ## 16.2.2\
    \ Construction of the mesoscopic geometric model\n\nFoam materials have pores\
    \ inside a solid base material, which is similar to the generation process of\
    \ the Voronoi model. Hence, the Voronoi model [50] is employed in this chapter\
    \ to construct the mesoscopic geometric model for the numerical simulation of\
    \ foams. The generation process of Voronoi foams can be divided into three steps.\
    \ First, a three-dimensional space is created. Second, a set of nuclei is inserted\
    \ into this space according to Voronoi tessellation. Specifically, a subsequent\
    \ nucleus is accepted only if its distance to existing nuclei is greater than\
    \ $\\delta$. Finally, all nuclei grow isotropically until they touch each other\
    \ to form a Voronoi foam. Foams with different cell sizes can be controlled by\
    \ giving different $\\delta$, resulting in different densities. The relative density\
    \ $\tilde{\rho}$ is defined as the ratio between foam density $\rho$ and the density\
    \ of material $\rho_{m}$. Foams with gradient density configuration can be achieved\
    \ by employing cell-distribution of gradient along the axial direction. For comparison,\
    \ uniform foams (UF) with uniformly distributed density are also considered. The\
    \ wall thicknesses of all foams and the wall thickness of the tube are both around\
    \ 0.4 mm (0.4 mm of the 3D printer). It is noted that when the cell wall thickness\
    \ is to a multiple of the print nozzle diameter, the 3D printer can produce more\
    \ accurate foams. The relative densities of all specimens are calculated and listed\
    \ in Table 16.1. The number in the first column represents the cell size of foams.\
    \ For example, \"UF-12\" means the specimen with a uniform density distribution\
    \ and \"GF-612\" represents the specimen with a gradient density distribution\
    \ and its cell size grows up linearly from 6 to 12 mm along the axial direction.\
    \ The diameter and length of all foams are 60 and 90 mm, respectively. It also\
    \ corresponds to the size of a thin-walled tube, where the internal diameter and\
    \ length are 60 and 90 mm, respectively. It indicates that no gap exists"
