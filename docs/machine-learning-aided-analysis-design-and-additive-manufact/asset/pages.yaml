    # ### 3.3.3  Steady-state response of FGP plates


    # #### 3.3.3.1  Verification examples


    In this part, validation examples of CDQM for steady-state response of FGP plates
    are conducted first. Fig. 3.17 shows the comparison between the steady-state response
    of FGP plates obtained with CDQM and FEM, all the structural edges are clamped.
    As shown in Fig. 3.17, excellent consistency of displacement curves with CDQM
    and FEM, demonstrates the correctness and universality of CDQM to FGP structural
    steady-state response.


    # #### 3.3.3.2  Parametric analysis for steady-state response


    Based on the previous verification in subsection 3.2.1, the next works are concerned
    with the behavior of FGP structural steady-state response with diverse porosity
    coefficients and distributions. Fig. 3.18–3.20 are carried out to evaluate the
    qualitative regularity of effects of porosity parameters on steady-state response
    of FGP plates. For one reason, we conclude that the different porosity coefficients
    $e_0$ makes a little impact on the displacement amplitudes regardless the distributions
    and geometric shapes, while displacement amplitudes with Type 2 are generally
    larger than those with Type 1. For another, the displacements move to higher frequency
    with increasing the porosity coefficient $e_0$ in case of Type 1 porosity'
