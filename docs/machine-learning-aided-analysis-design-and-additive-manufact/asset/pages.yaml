  md: 'is difficult to cover in all situations. Therefore in the following sections,
    this chapter does not distinguish between porous materials and cellular materials.
    Instead, following the classic work of Gibson and Ashby [8], both of them are
    called cellular solids, referring to materials with a large number of holes.


    As shown in Fig.14.2, cellular solids can be classified into disordered foams
    and ordered lattice structures. Materials can be open-cell and closed foams. Open
    foams are connected by edges, and there is no cell wall-filling between the edges
    [12]. Closed-cell foam refers to cellular solids with holes separated by cell
    walls [13]. A lattice structure is a kind of structural material composed of one
    or more structural units. According to its macro dimension, it can be divided
    into one-dimensional (1D) lattice (like architecture [14]), two-dimensional (2D)
    lattice (like honeycomb architecture [15]), and three-dimensional (3D) lattice
    (like oct-truss architecture [16]).


    The above discussions are limited to uniform cellular solids, which physical properties
    are uniformly distributed. However, uniform cellular solids lack design flexibility.
    To improve the mechanical properties of uniform cellular solids, many studies
    have focused on graded solids. Graded cellular solids lie at the intersection
    between gradient materials [17,18] and cellular solids [19,20]. It not only has
    design of gradient materials but also more complete deformation and excellent
    energy absorption capability than uniform cellular solids.


    So, far most of the studies have focused on numerical simulation, including two
    methods to build a graded cellular solid. On one hand, a discrete gradient is


