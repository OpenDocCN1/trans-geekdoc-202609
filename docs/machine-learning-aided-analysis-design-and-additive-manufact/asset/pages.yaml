- pgno: 159
  md: '# 5.2.4 Spectral Chebyshev method


    In the natural coordinate system, the unknown function p(x, y) of the shallow
    shell can be transformed into q(ξ, η), which can be expressed by Chebyshev polynomials
    of first kind:


    ```

    $x = \frac{a}{2}\xi + \frac{a}{2}y = \frac{b}{2}\eta + \frac{b}{2}, \xi \in[-1,
    1], \eta \in[-1, 1]$ \eqn (5.19)

    ```


    ```

    $q(\xi, \eta) \equiv C_{\q}a \eqn (5.20a)

    ```


    ```

    $C_{\q} = C_{M-1}(\xi) \otimes C_{N-1}(\eta)$ \eqn (5.20b)

    ```


    ```

    $C_{M-1}(\xi) = \{cos[0 \cdot \xi], cos[1 \cdot \xi], \dots, cos[(M-1) \cdot \xi]\}$\}$
    \eqn (5.20c)

    ```


    ```

    $C_{N-1}(\eta) = \{cos[0 \cdot \eta], cos[1 \cdot \eta], \dots, cos[(N-1) \cdot
    \eta]\}$\}$ \eqn (5.20d)

    ```


    ```

    $a = (a_{0,0}, \dots, a_{0,N-1}, a_{1,0}, \dots, a_{1,N-1}, \dots, a_{M-1,N-1})^T
    \eqn (5.20e)

    ```


    where a is the coefficient vector of expansion. M and N are the total terms of
    polynomials, which are also termed as the truncation number.

    The Gauss-Lobatto points are used for discrete sampling the rectangle domain in
    the natural coordinate system:


    ```

    $$\xi_i = -cos\left(\frac{\pi i}{M-1}\right), i=0, 1, \dots, M-1.$ \eqn (5.21)

    ```


    ```

    $$\eta_j = -cos\left(\frac{\pi j}{N-1}\right), j=0, 1, \dots, N-1.$ \eqn (5.21)

    ```


    Then the relationship between the function value vector and the expansion coefficient
    can be written as follows:


    ```

    $q = C_{\q}a, \quad a = C_{\q}^{-1}q \eqn (5.22)\nwhere

    $$q = (q_{0,0}, \dots, q_{0,N-1}, \dots, q_{M-1,0}, \dots, q_{M-1,N-1})^T$$ \eqn
    (5.23a)\n$$C = C_{M-1}(\xi) \otimes C_{N-1}(\eta)$$ \eqn (5.23b)$

    ```'
  merge: -1
  img_proc: true
- pgno: 160
  md: '$C_{M-1}(\xi) = [C_{M-1}(\xi_0); \quad C_{M-1}(\xi_1); \quad \dots \quad C_{M-1}(\xi_{M-1})]
    \quad (5.23c)$


    $C_{N-1}(\eta) = [C_{N-1}(\eta_0); \quad C_{N-1}(\eta_1); \quad \dots \quad C_{N-1}(\eta_{N-1})]
    \quad (5.23d)$


    According to the recursive property of Chebyshev polynomials, the partial derivative
    of the function $q(\xi, \eta)$ with respect to $\xi$ and $\eta$ can be calculated
    as:


    ```

    $\frac{\partial^2q}{\partial\xi\partial\eta} = [C_{M-1}(\xi)D_{M-1}^*(\xi) \otimes
    D_N_{N-1}^*(\eta)]\mathbf{q} = Q_{\xi\eta}\mathbf{q} \quad (5.24)$

    ```


    where, partial differential matrix, $D$ denotes the derivative matrix [46].

    The integral of $q(\xi, \eta)$ is calculated by the Gauss-Lobatto quadrature rule:


    ```

    $\int_{-1}^1\int_{-1}^1 q(\xi, \eta)d\xi d\eta = \mathbf{V}\mathbf{C}^{-1}\mathbf{q}
    \quad (5.25)$

    ```


    where


    ```

    $\mathbf{V} = \int_{-1}^1 C_{M-1}(\xi)d\xi \otimes \int_{-1}^1 C_{N-1}(\eta)d\eta
    = \mathbf{v}_{M-1} \otimes \mathbf{v}_{N-1} \quad (5.26)$

    ```


    $v$ denotes the integral value vector of Chebyshev polynomials:


    ```

    $v_l = \begin{cases} \frac{2}{1-k^2}, & k \text{ even} \ 0, & k \text{ odd} \end{cases}
    \quad (5.27)$

    ```


    The double integral operation of the rectangle can be calculated as:


    ```

    $\int_{-1}^1\int_{-1}^1 [q(\xi, \eta)]^2 d\xi d\eta = \mathbf{q}^T\mathbf{V}\mathbf{q}
    \quad (5.28)$

    ```


    where $\mathbf{W} = \text{diag}(\mathbf{V}\mathbf{C}^{-1})$ is the Chebyshev inner
    product matrix [46].

    The admissible displacement function of nucl can be written as:


    ```

    $\begin{bmatrix} u \ q''_1 \ v \ q''_2 \ w = e^{-j\omega t}q''_3 \ \varphi_{\xi}
    \ q''_4 \ \varphi_{\eta} \ q''_5 \end{bmatrix} = e^{-j\omega t}\mathbf{C}_{\xi\eta}\begin{bmatrix}
    a^1 \ a^2 \ a^3 \ a^4 \ a^5 \end{bmatrix} \quad (5.29)$

    ```


    where $j$ represents the imaginary unit, and $\omega$ is the circular frequency.'
