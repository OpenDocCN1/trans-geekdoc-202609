    # ## 12.1 Introduction


    Functionally graded materials (FGMs) are typical kind of effective composites
    in recent decades, which has been popular due to its continuous gradation of material
    phases along certain axis [1]. Such arrangement was proposed by Japanese scientists
    in 1980s to enhance the high temperature protection of their spacecraft under
    extreme conditions [2]. The FGMs are heterogeneous composites containing two or
    more constituents, by which the overall properties of the structure can be rigorously
    designed with diverse purposes [3]. Another type of advanced composite, the lightweight
    porous materials (i.g., metal foams) are also attracting attentions considering
    its excellent absorbing abilities in aerospace, civil engineering fields [4].
    Inspired by these two advanced materials, researchers review the potential of
    combining them as a functionally graded porous (FGP) type materials toward more
    promising properties, by implementing graded phase of pores into the microstructure
    level.


    Due to the exceptional nature of FGP structures, numbers of studies have been
    published to investigate the behavior of FGP structures under various environmental
    conditions [5]. However, there exist some critical problems that affect the appropriate
    design of FGP structures in practical engineering applications. Among which, there
    is always a discrepancy between the real phase distribution of produced FGP structures
    and procedure owing to the inherent factors of uncertainty. Subsequently, the
    inevitable discrepancy would then reflect on their actual material properties,
    eventually the mechanical performance (i.e. natural frequency) of FGP structures
    in realtime applications. Thus it is vital to investigate the stochastic free
    vibration analysis for FGP structures and deliver appropriate safety assessment
    for the advanced composite against various aspects.


