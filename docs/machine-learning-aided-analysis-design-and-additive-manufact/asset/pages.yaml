    $k_{34} = \frac{9A_{11}(L^2n^4+m^4\pi^4R^4)+(2A_{12}+4A_{60})L^2mn^2\pi^2R^2}{32L^3R^4\rho^2}
    \quad (4.107)

    ```


    Neglecting the inertia terms $\rho\ddot{u}$ and $\rho\ddot{v}$, which are insignificant
    in transverse vibration, we can solve $u_i$ and $v_i$ by combining Eq. (4.95)
    with Eq. (4.96). Inserting the results into Eq. (4.97), it yields:


    ```

    $\frac{\ddot{w}_i}{\dot{t}^2} + a_1w_i + a_3w_i^2 = 0 \quad (4.108)

    ```


    where


    ```

    $a_1 = \frac{k_{13}k_{22}k_{31}}{k_{12}k_{21}-k_{11}k_{22}} - \frac{k_{12}k_{23}k_{31}}{k_{12}k_{21}-k_{11}k_{22}}
    - \frac{k_{13}k_{21}k_{32}}{k_{12}k_{21}-k_{11}k_{22}} + \frac{k_{12}k_{23}k_{32}}{k_{12}k_{21}-k_{11}k_{22}}$

    ```


    ```

    $ - k_{33} \quad (4.109)

    ```


    ```

    $a_3 = k_{34} \quad (4.110)

    ```


    # 4.4.2 Solution procedure


    The linear inertia is obtained as:


    ```

    $\omega_j = \sqrt{a_1} \quad (4.111)

    ```


    The initial conditions are defined as:


    ```

    $w_i|_{t=0} = w_{max}, \frac{\dot{w}_i}{\dot{t}}|_{t=0} = 0 \quad (4.112)

    ```


    where $w_{max}$ is the maximum value of $w_i(t)$.'
