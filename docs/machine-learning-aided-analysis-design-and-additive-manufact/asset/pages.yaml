    bending response of FGP plates based on FSDT. Three configurations of porosity
    distributions including nonuniform, symmetric, and nonuniform asymmetric are selected.
    The Galerkin method and Fourier series are applied to solve the nonlinear algebraic
    governing equations, and the solutions are obtained by means of Newton-Raphson
    method. Results obtained provide a validation for correctness and accuracy of
    the method. In the end, parametric analyses are conducted to assess the impacts
    of the porosity coefficient and distribution, geometric parameters foundation
    parameters, and boundary conditions on the mechanical performance. Lists, lots
    of papers about FGP structures have been published [20–28].


    The aforementioned papers are almost concerned with certain structure; however,
    in order to develop adequate approaches for vibration solution of structures with
    various shapes, some researchers conducted a series of theoretical explorations
    and published comprehensive achievements. Liu et al. [29] utilized the FSDT and
    Chebyshev differential method (CDQM) to model plates with curved edges. By introducing
    the one-to-one mapping technology into CDQM, the structural displacement fields
    can be expressed in terms of Chebyshev polynomials nowadays. Abundant comparisons
    among the results with CDQM and results obtained by experiment, FEM, and existing
    methods show the accuracy and efficiency of CDQM. Zhong et al. [26] applied to
    clarify the free vibration mechanism for plates with curved edges considering
    irregular hole and curved corner. Tornabebe al. [30–36] utilized and developed
