    The strain potential energy $U_s$ of FGP shallow shell can be articulated as


    ```

    $U_s = \frac{1}{2} \int_0^h \left( N_x\varepsilon_x + N_y\varepsilon_y + N_{xy}\varepsilon_{xy}
    + M_x\kappa_x + M_y\kappa_y + M_{xy}\kappa_{xy} + Q_s\gamma_s + Q_z\gamma^0 \right)
    dz$ (5.13)

    ```


    The kinetic energy $T$ of FGP shallow shell can be expressed as:


    ```

    $T = \frac{1}{2} \int_0^h \left( \left(\frac{\partial\dot{w}}{\partial z}\right)^2
