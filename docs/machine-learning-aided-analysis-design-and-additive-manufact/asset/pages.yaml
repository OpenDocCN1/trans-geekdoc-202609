    Fig. 4.13 shows variation of nonlinear to linear frequency ratio $\omega_n/\omega_i$
    against vibration amplitude-to-thickness ratio $w_{max}/h$ of FG porous cylindrical
    shells with porosity distributions. We can see that with the increase of porosity,
    the nonlinear to linear frequency ratio increases for all types of porosity distributions.
    The FG porous cylindrical shells show hardening-spring characteristics. It is
    also found that the PD-B shell has the largest nonlinear to linear frequency ratio
    while the PD-A shell has the smallest among the three types of porosity distributions.


    In Fig. 4.14, variation of nonlinear to linear frequency ratio $\omega_n/\omega_i$
    against porosity coefficient $e_1$ is shown. As $e_1$ increases, nonlinear to
    linear frequency ratio of the PD-A shell decreases, while that of the PD-B shell
    increases. It is found that the ratio of PD-U shell is unchanged. To explain this
    phenomenon, Table 4.8 illustrates the nonlinear frequency $\omega_n$ against porosity
    coefficient of the PD-U shell. We can see that as the porosity coefficient increases,
    the nonlinear frequency decreases. Combined with Fig. 4.14, for the PD-U shell,
    it can be confirmed that the effect of the porosity coefficient on linear frequency
    is similar'
