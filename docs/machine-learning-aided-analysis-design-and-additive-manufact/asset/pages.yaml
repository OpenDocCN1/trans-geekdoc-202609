    Frequency response curves of the FG porous circular cylindrical shell for various
    kinds of porosity distribution are demonstrated in Fig. 4.21. Among these three
    types of porosity distribution, results show that the PD-A shell has the strongest
    nonlinear vibration characteristics, the PD-B shell has the weakest nonlinear
    characteristics. For comparison, the resonance region of the PD-B shell is the
    smallest, while that of the PD-A shell is the largest. It is noted that porosity
    distribution has little effect on the peak value of the frequency responses but
    mainly affects the resonance region of the shell.


    Fig. 4.22 shows frequency response curves of the FG porous circular cylindrical
    shell for different porosity coefficients. For the PD-A shell, the larger porosity
    coefficient leads to the stronger softening-spring characteristics. For the PD-B
    shell, however, the case is opposite. Besides, the porosity coefficient has little
    effect on the nonlinear vibration of the PD-U shell.'
