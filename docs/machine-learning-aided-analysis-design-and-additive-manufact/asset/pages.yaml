    FG porous composite structures


    Despite the speedy advance in the research of FG porous structures, predictions
    of their properties have been continuously intricate, induced from the random
    nature of metal foams. Although the relative density is widely regarded as a dominant
    factor, the contribution from cell arrangements can be important and changing
    stochastic porosity distributions may result in evident variances when determining
    the overall foam mechanical features. For example, Young''s modulus of closed-cell
    aluminium foams, discussed by Chen et al. [17], have a distinct variation up to
    14.38% over the same relative density, matrix material, wavy edge, and representative
    volume element (RVE) size. This inherent difference is difficult to be identified
    from the foam morphologies.


    On the other hand, the rapid development of AI-enhanced engineering provides a
    powerful tool for resolving problems [18–20], and is prone to opening up new horizons
    for cracking the aforementioned issue in the evaluation of porous structures made
    of random foams. Among various AI approaches, deep learning [21–23] has gained
    much attention of research scientists in the last decade and has been widely used
    in numerous applications. One of the factors that helped this is the massive amount
    of data available in each field. With the high computation power and advances
    in stochastic modeling and simulation of the physical phenomenon, researchers
    have used synthetic data to train models, which was not possible earlier due to
    lack of data or severe costs and resources required for acquiring such data. Deep
    learning models could be considered as a universal solution for data-driven problems
    meaning these can handle all types of data. Deep learning models such as recurrent
    neural networks (RNNs) [24], convolutional neural networks (CNNs) [25], and others
    can be incorporated into various applications based on the nature of data and
    desired outputs.


    This work adopts deep learning to measure how the stochastic distributions impact
    the metal foam behavior with a focus on the influence of random cell wall morphologies,
    exploring a new way to calculate the foam properties directly from cellular structures
    simply without building up the corresponding mechanics models. Specifically, CNNs
    are employed to investigate Young''s modulus as efficiently as possible. CNN provide
    significant insights into the correlation between images and the features they
