    The following normalized quantities are defined as:


    ```

    $$$(u,w) = \frac{(u_0,w_0)}{h}, \xi = \frac{x}{L''}, \eta = \frac{y}{L''}, \tau
    = \frac{t}{I_0}, \omega = \Omega L; \frac{A_{11}^*}{A_{11}}, \ N^* = \frac{P_x}{A_{11}}$$$

    $$(I_0, I_1, I_2) =(\frac{I_0}{I_0^2}, \frac{I_1}{I_0 I_h}, \frac{I_2}{I_h^2}),
    (a_{11}, b_{11}, d_{11}, e_{11}) = (\frac{A_{11}^*}{A_{11}''}, \frac{B_{11}^*}{A_{11}''},
    \frac{D_{11}^*}{A_{11}''}, \frac{E_{11}^*}{A_{11}''})$$$

    $$(7.27)$

    ```


    where $I_0$ and $A_{11}$ are the values of the metal beam between porous and GPLs,
    respectively, $\omega$ and $N^*$ are the normalized frequency and critical buckling
    load, respectively. By substituting Eq. (7.27) into going Eq. (7.21) and setting
    inertia terms to zero, the following equation can be obtained:


    ```

    $$$a_{11}\frac{\partial^2 u}{\partial\xi^2} + b_{11}\frac{\partial^2 \psi}{\partial\xi^2}
    = 0$$$

    $$$$k_{55}(\frac{\partial^2 w}{\partial\xi^2} + \eta\frac{\partial^2 \psi}{\partial\xi^2})
    = N^*\frac{\partial^2 w}{\partial\xi^2}$$$\$

    $$$$b_{11}\frac{\partial^2 u}{\partial\xi^2} + d_{11}\frac{\partial^2 \psi}{\partial\xi^2}
    - k\eta a_{55}(\frac{\partial^2 w}{\partial\xi^2} + \eta\frac{\partial^2 \psi}{\partial\xi^2})
    = 0$$$

    $

    $(7.28)$

    ```


    By applying the DSC method in Eq. (7.23), the following equation is given:


    ```

    $$$a_{11}F_{11}^{(1)}u + b_{11}F_{11}^{(1)}\psi = 0$$$

    $$$$k_{55}(F_{11}^{(2)}w + \eta F_{11}^{(2)}\psi) = N^*F_{11}^{(2)}w$$$\$

    $$$$b_{11}F_{11}^{(2)}u + d_{11}F_{11}^{(2)}\psi - k\eta a_{55}(F_{11}^{(2)}w
    + \eta F_{11}^{(2)}\psi) = 0$$$

    $

    $(7.29)$

    ```


    Four different boundary conditions, such as pinned-pinned (P-P), clamped-clamped
    (C-C), clamped-pinned (C-P), clamped-free (C-F), are considered:


    ```

    $$$${a_{11}F_{11}^{(1)}u + b_{11}F_{11}^{(1)}\psi = 0$$$

    $$$$F_{11}^{(1)}w + \eta F_{11}^{(1)}\psi = 0$$$

    $$$$b_{11}F_{11}^{(1)}u + d_{11}F_{11}^{(1)}\psi = 0$$}$$

    ```


    Clamped(C):u = \psi = 0


    Pinned(P):w = b_{11}F_{11}^{(1)}u + d_{11}F_{11}^{(1)}\psi = 0'
