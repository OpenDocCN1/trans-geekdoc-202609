  md: '# Design and fabrication of additively manufactured functionally graded porous
    structures


    manufacturing technique in material extrusion. As shown in Fig. 14.6, the system
    consists of a filament, drive wheel, extrusion nozzle, print bed, fabrication
    platform, and material spool. Through driving filament movement based on the material
    spool, the filament first passes through the drive wheel. It is then heated into
    a molten fluid and extruded by the extrusion nozzle. Furthermore, the extension
    nozzle moves in a 2-D space to complete the manufacturing of the current layer
    on the fabrication platform. After that, the fabrication platform keeps moving
    down to the next layer, and the extension nozzle continues to manufacture the
    structure in this layer. The entire process is repeated until the specimen is
    manufactured. FFF has many advantages including high material utilization, simple
    process, low cost, and a wide range of materials including thermoplastics and
    low melting point metals. However, due to the shortcomings like surface roughness
    and poor manufacturing accuracy, FFF is mostly used for the verification of conceptual
    models or prototype models.


    Direct ink writing (DIW) is another technique of material extrusion. From Fig.
    14.7, materials such as liquid, paste, and hydrogel are contained in the syringe.
    The syringe is pressurized by pneumatic pressure or a stepper motor. The extruded
    material is heated or induced by ultraviolet light, and the curing reaction occurs.
    The syringe can move in 3D space to manufacture 3D models. DIW is fast, efficient,
    and flexible, which allows the design and manufacture of complex structures. This
    technique is used in the additive manufacturing of ceramic materials.


    ![](img/90ed165a39fa708ec438fcda79319c25_355_0.png)


    **Fig. 14.6** Schematic representation of a typical fused filament fabrication
    setup. Source: Reproduced with permission from Wang X, Jiang M, Zhou Z, Gou J,
    Hui D. 3D printing of polymer matrix composites: a review and prospective. Compos
    Part B Eng 2017;110:442–58. Copyright 2017, Elsevier.'
