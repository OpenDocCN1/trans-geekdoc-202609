    The beam strain energy and external load work can be obtained by [16]


    ```

    Strain energy $\Lambda_r = \frac{b}{2}\int_{-0.5bh}^{0.5bh}(\varepsilon_{xx}\sigma_{xx}
    + \gamma_{xz}\sigma_{xz})dzdx \quad (10.17)

    ```


    ```

    External load work $\Lambda_p = Pw \quad (10.18)

    ```


    where $P$ is an external point load applied on the mid-length point of the beam
    ($x=L/2$). Therefore total energy functional reads $\Psi = \Lambda_r - \Lambda_p$,
    which can be solved with Ritz method [14] to determine the mid-span beam bending
    deflection $\Delta$. The beam boundary conditions are linked to the Ritz trial
    functions [52] (total number of polynomial terms = 10), and hinged-hinged (H-H)
    supports are adopted in this research.


