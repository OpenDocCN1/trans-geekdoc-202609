    instance. Yanez et al. [94] designed gyroid lattices with more materials aligned
    along the loading directions, resulting in a higher elastic modulus of graphite.


    In terms of the postyielding behaviors of solid/network phase TPMS lattices, the
    property of base material plays a dominant role in it compared to the unit cell
    topology. For example, diagram structures show plateau stress when fabricated
    with a polymeric material in the study by Maskery et al. [95]. In contrast, a
    significant drop in the stress after yielding is observed and related to the fracture
    of the struts for metallic TPMS lattices in study by Al-Ketan [3] and Yan et al.
    [89]. Fig. 13.13 presents the deformation of solid/network phase TPMS lattices
    manufactured by different materials. The differences in their postyielding behaviors
    and deformation mechanism could be explained by the fact that the base material
    has distinct ductility. When the deformation reaches a certain level, the struts
    in the lattice may be subjected to a higher local strain. As a result, local fractures
    may be observed and lead to propagating of cracks, causing catastrophic failure
    of lattices eventually if the base material is brittle. However, struts deform
    plastically when the base material is ductile. Meanwhile, there are other factors
    which may affect the deformation mechanism: (1) defects introduced by the fabrication
    process such as the microacks or void in the lattice and (2) the set-up of the
    experiments as creating lateral strain due to friction between sample and loading
    planes.


