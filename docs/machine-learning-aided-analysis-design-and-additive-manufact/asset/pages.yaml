    and the residual block, as well as the model architecture, are shown in Fig. 10.6.


    Given the nature of the predicted values, multiple loss functions were tested
    for optimal results. The Mean Absolute Error (MAE) provided significantly better
    results compared to other test functions, that is Mean Squared Error (MSE) or
    Root Mean Squared Error (RMSE). The L1 loss function is given


    ```

