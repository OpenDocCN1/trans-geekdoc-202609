  md: 'An introduction to functionally graded porous materials and composite structures


    ![](img/90ed165a39fa708ec438fcda79319c25_20_0.png)


    **Figure 1.3** Schematic illustration of sandwich structure with a porous core.


    and circular [7], and lattices (octet, kagome, tetrahedron, pyramid, cube, truncated
    pyramid, octahedron, rhombicuboctahedron, rhombic dodecahedron, and cube open-cell
    [8]), resulting in a large family of porous material subsets.


    Compared with honeycombs and lattices, foams are of relatively low manufacturing
    costs without the precise geometrical control, and can be further divided in light
    material composites for specific application exchange [9]; ceramic foams are used
    as thermal insulation and polymer foams are widely employed as thermal packaging,
    and absorption materials [10]; glass foams, produced by the recycled materials
    can be adopted as microwave absorbers and contribute to the environmental sustainability
    [11]; concrete foams are regarded as the new trend in the civil engineering construction
    and show great potential in the manufacturing of lightweight components and offshore
    structures [12]. Among all the foams, metal foams are one of the most well-developed
    composite forms and have been included in the production of crash absorbers in
    vehicles, supports in working platforms, thermal cooling devices, and buildings
    [13].


    Due to light nature, porous materials are often used for soft cores bounded by
    hard skins in the sandwich structural design, as illustrated in Fig. 1.3. It effectively
    raises the structural weight while limiting the increase in weight, enhancing
    the mechanical strength of honeycomb cells, plates, and without a huge increment
    in the base material consumption. Numerous studies have been devoted into this
    topic by exploring various configurations, fabrications, and applications of sandwich
    structures [14–18]. It is acknowledged that the possible delamination between
    hard skins and soft cores poses a threat to the structural integration and is
    induced by the significantly different material characteristics of adjacent layers.


    # 1.2 Functionally graded porous materials


    # 1.2.1 Functionally graded porosity


    Already possessing outstanding properties, porous materials may be further improved
    based on the newly developed concept of “Functionally graded (FG) porosity,” which
    is featured by the nonuniform pore distributions, that is,'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Small pores


    Small pores


    Large pores


    Large pores


    Small pores


    ![](img/90ed165a39fa708ec438fcda79319c25_21_0.png)


    **Figure 1.4** Schematic illustrations of functionally graded porosities.


    the continuously/piece-wise changing of pore size and density along one or more
    directions, as presented in Fig. 1.4. The initiative of this design is to adjust
    the material distribution with graded cellular geometries, focusing on the overall
    performance improvement and control.


    Various FG porous materials have been examined in recent years. They can be built
    up with any of the geometric morphologies (foams, honeycombs, or lattices) and
    diverse material compositions. Hangai et al. [19] fabricated the FG foams containing
    multilayers of pure Al and Al alloys, and conducted the static compression tests
    to reveal their deformation behaviors. Zhang and Wang [20] developed FG porous
    structures with open and closed-cells, and identified the variations in Young''s
    modulus induced by the porosity characteristics. Loh et al. [21] reviewed the
    3D printed porous concrete highlighted by the graded radial density inspired from
    the palm tree, and noted its potential in lightweight structural products due
    to the superior strength-to-weight ratio. Hong et al. [22] presented the FG porous
    Al2O3 ceramics with dense surface layer and investigated the structures using
    changing freezing temperatures. Du et al. [23] suggested that the graded porosity
    is able to lower the reflection and scattering of FG porous glasses for applications.


    FG porous materials are demonstrated to have novel mechanical [24], biological
    [25], thermal [26], acoustic [27], energy [28] properties. Their unique functionality
    in this book is referred to the tolerable mechanical performances for potentials
    in structural, automotive, aerospace, and defense engineering fields. For instance,
    graded porosities lead to the shifting of fundamental natural frequencies and
    can be employed in the vehicle designs to avoid resonance while remaining lightweight.
    The integrated advantages of FG porosities may offer solutions to problems that
    cannot be resolved with existing material forms.


    # 1.2.2 Fabrication


    The fabrication methods of FG porous composites highly depend on the base material
    compositions and desirable geometric parameters. Aluminum foams with graded porosities
    are one of the most investigated FG porous composite forms and can be produced
    by the following methods proposed in the open literature: powder-'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'An introduction to functionally graded porous materials and composite structures


    [29], sintering and dissolution processing [19], and friction sintering process
    [30]. Meanwhile, the manufacturing of graded foams or scaffolds based on steel,
    copper, and titanium can be achieved with a powder metallurgy route using NHHCO3
    as space holders [31], a rapid manufacturing technique using ultrasonic-asspressured
    sintering and 3D printing [32], and the powder metallurgy process with sugar pellets
    as space holders [33]. It may be noted that some of the methods are applicable
    for varying base materials, such as the space-holder technique is involved in
    the production of graded aluminum foams, steel foams, and titanium scaffolds.


    Regarding other FG porous materials, Suethao et al. [34] discussed ways to achieve
    graded polymer foams, such as gas concentration gradients; Cerro-Nicolat et al.
    [35] reported the processing of graded cellular ceramics via continuous extrusion;
    Boccaccini et al. [36] presented the graded glass porous composites with the aid
    of microwave-assisted densification of power composites; Barbasos et al. [37]
    reviewed the fabrication approaches for FG porous ceramic-, metal-, and polymer-nanocomposites.


    Additive manufacturing (3D printing) provides the possibility to shape-perfect
    complex geometry [38] as the desired pore distribution efforts have made to use
    this new technique in the development of FG porous components across various geometric
    morphologies. Wang et al. [39] proposed a design framework for additively manufactured
    cellular lattice structures with the optimized mesoscopic features. Zhang et al.
    [40] presented the 3D printed reentrant honeycombs consisting of stainless and
    polymer. Geng al. [41] introduced 3D concrete printing in the realization of lightweight
    high-performing cement-based composites with porosity gradients.


    # 1.3 Functionally graded porous composite structures


    # 1.3.1 Structural forms


    Apart from the efforts concerning FG porous material itself, a number of studies
    explored it in the structural innovation and developed FG porous composite structures
    featured with graded porosity distributions in the internal pore size, density,
    shape, cell thickness and/or material composition. The majority of current studies
    in this field devote to the performance examination on typical structural forms,
    such as beams, plates, arches, shells, and frames (see Fig. 1.5 for examples),
    concerning improvements in properties induced by FG poros. The corresponding material
    gradients are normally along the thickness of target structures but may also be
    established across other directions, such as the bidirectional FG panels with
    porosity variations in both thickness and streamwise directions [42]. These structural
    components are taken as basic elements for the assembly of a complicated system.'
