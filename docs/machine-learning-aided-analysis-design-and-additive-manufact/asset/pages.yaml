    # 6.4 Solution methodology


    In this section, the Galerkin technique is implemented to reduce the governing
    nonlinear partial differential equations (Eq. 6.27–6.29) to a set of nonlinear
    ordinary differential equations (ODEs) in time. Here, the primary resonance of
    the system is inspected when the beam is under a combination of a harmonic vertical
    load and a compressive constant axial load. The HBM is implemented to develop
    closed-form approximate solutions for the nonlinear fundamental natural frequency
    and frequency response of the system.


    # 6.4.1 Galerkin technique


    To solve the nonlinear equations of motion, first the Galerkin method is used
    to convert the set of nonlinear partial differential equations to a set of nonlinear
    ordinary differential equations. The following expansion form of generalized displacements
    is:


    ```

    $$u = \sum_{n=1}^{\infty} \hat{u}_n(x)\hat{w}_n(t)$$

    ```


    ```

    $$$\phi = \sum_{n=1}^{\infty} \hat{\phi}_n(x)\hat{\phi}_n(t)$$

    ```


    ```

    $$w = \sum_{n=1}^{\infty} \hat{w}_n(x)\hat{w}_n(t)$$

    ```


    where $\hat{u}_n$, $\hat{\phi}_n$, and $\hat{w}_n$ are the eigen-functions which
    need to satisfy the boundary condition of the problem, which here is hinged-hinged
    support. Meanwhile, $\hat{u}_n$, $\hat{\phi}_n$, and $\hat{w}_n$ are the unknown
    generalized coordinates. Inserting $u$, $\phi$, and $w$ into the governing equations
    and applying the Galerkin method yields a set of nonlinear ODEs as:


    ```

    $$$(k_{1,1} + k_{1,2})\hat{u}_n + (k_{1,3} + k_{1,4})\hat{w}_n^2 = 0$$

    ```'
