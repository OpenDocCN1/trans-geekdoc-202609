  md: 'the recent research progress on additively manufactured cellular solids is
    reviewed. Firstly, the manufacturing process of additive manufacturing commonly
    used in the preparation of cellular solids is briefly introduced. Powder fusion,
    material extrusion, and vat photopolymerization are discussed. Secondly, studies
    of cellular solids are classified into five groups: open-cell foam, closed-cell
    foam, 2D honeycomb, 3D lattice, and gradient cellular solids. Representative research
    and its significance in each class have been summarized. Finally, based on the
    current research, the authors point out major scientific issues in future work.
    Potential works include complementing the advantages of additive manufacturing
    and traditional manufacturing, additive manufacturing composite components or
    structures with cellular solids as the core material, as well as introducing 4D
    and intelligent manufacturing into additively manufactured cellular solids.


