    # 16.1 Introduction


    Despite researchers have made significant progress in investigating energy-absorbing,
    impact loading is inevitable in transportation engineering, causing accidents
    that severely endanger human life. Generally, reducing the damage of impact load
    can be achieved in two ways, including reducing the peak impact load [1–4], and
    prolonging the duration, by using the energy-absorbing component the thin-walled
    tube [5–9]. For example, as a typical energy-absorbing component while absorbing
    the impact energy below a lower load threshold. This is accomplished by the plastic
    deformation of the thin-walled tube: collapsing, folding and buckling; Consequently,
    thin-walled tubes have been widely applied to highway traffic safety, anti-bird
    impact on aircraft, astronaut recovery, and penetration of projectiles [10–16].


    In the past decades, the crashing behaviors of thin-walled tubes have been extensively
    investigated [17–23]. Andrews et al. [17] proposed a classification chart to predict
    the collapse of thin-walled circular tubes using geometry and material parameters.
    Different deformation methods including concertina, diamond, and and Euler buckling
    have been reported, respectively. Furthermore, the deformation of min-walled tubes
    can also be affected by the infiltrated material. Filling a thin-walled tube with
    foam can make effective use of the internal space but also increase the energy
    absorption capacity. It is reported that the combined energy absorption value
    of the thin-walled tube and foam is greater than used independently. This makes
    the foam-filled tube better attention [24–29]. For example, Hansen et al. [25]
    studied quasi-static and dynamic crashing behaviors of FFTs and suggested formulas
    to predict the compressive force and crushing distance of FFTs. Sun et al. [27]
    conducted a systematic experiment on FFTs. They discussed different tube materials
    (e.g., carbon fiber-


