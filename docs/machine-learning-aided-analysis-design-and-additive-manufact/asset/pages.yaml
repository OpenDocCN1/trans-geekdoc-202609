- pgno: 101
  md: 'It is known that circular cylindrical shells are often subjected to external
    forces and vibrate with large amplitudes, which needs to be described using nonlinear
    shell theories. Therefore many studies concerning the nonlinear vibration of circular
    cylindrical shells are conducted [17–24]. Chai et al. [25] studied the nonlinear
    vibration characteristics of spanning cylindrical shells with arbitrary boundary
    conditions. The effect of viscosity on the internal resonance of cylindrical shells
    was analyzed by Rosikhin and Shitnikova [26]. Under clamped boundary condition
    and uniform temperature change, Zhang et al. [27] carried out the analysis on
    the nonlinear dynamics of FG circular cylindrical shells. The 1:1:2 and 1:1:2
    internal behaviors of cylindrical shells were analyzed by Amabili [28] and Ye
    and Wang [29], respectively.


    In this chapter, free and forced vibrations of FG circular cylindrical shells
    are presented, including linear and nonlinear analyses. Arbitrary boundary conditions
    are realized by introducing the artificial spring technology. The Donnell''s shell
    theory is employed, and the Lagrange equation is adopted to derive the equations
    of FG circular cylindrical shells. Chebyshev polynomials are utilized to approximate
    the displacement of the shell. The Ritz method and the modal superposition method
    are used to solve the natural frequency and frequency response, respectively.
    Finally, nonlinear free and forced vibrations are solved using the method of multiple
    scales and the pseudo-arclength continuation technique, respectively.


    # 4.2 Linear free vibration


    A cylindrical shell with length L, thickness h, and radius R is depicted in Fig.
    4.1. The orthogonal curvilinear coordinate system (x, θ, z) is fixed on the surface
    of the cylindrical shell. Specifically, x, θ, and z are coordinates along longitudinal,
