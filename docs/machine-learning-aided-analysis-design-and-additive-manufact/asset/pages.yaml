    # 11.4.4 The extended support vector regression


    The conventional support machine vector (SVM) was proposed by Vapnik [7] and has
    been implemented into various forms with characteristics along the newly developed
    X-SVR approach. For input and output vectors of **x** and **y**, the governing
    equation for determining the hyperplanes separating two distinguish types of objects
    is described as:


    $$\hat{f}(\mathbf{x})=\mathbf{wx}^T - \gamma$


    (11.35)


    where $\mathbf{w}=[w_1, w_2, ..., w_n]^T \in \mathbb{R}^n$ is the perpendicular
    vector against the hyper plane; $\gammagamma is the bias.


    Based on the research of Feng et al. [8-10], the X-SVR approach was proposed based
    on the doubly regularized support vector regression and the regression method.
    For input and output vectors of **x** and **y**, the X-SVR creates a hyperface($\mathbf{x}$)
    to describe the relationship between the datapoints:


    $$\hat{f}(\mathbf{x})=k(\mathbf{p}_i - \mathbf{q}_j)^T - \tilde{e}_i^T G_{ij}
    \tilde{u}_j$


    (11.36)


    where $k(\)$ is the kernel-induced vector for the inputs, $\mathbf{p}_i, \mathbf{q}_j
    \in \mathbb{R}^n$ are the two positive kernelized coefficients, $\tilde{u}_j$
    is the concerned optimal solution, matrix $G_{ij}$ and vector $\tilde{e}_i$ are
    defined by:


    +   $p_{ij} = \begin{cases} 0, w_j \le 0 & -w_j, w_j < 0 \ w_j, w_j > 0, & 0,
    w_j \ge 0 \end{cases} \quad q_{ij} = j=1, ..., n$


    (11.37)'
