    # # 7.7 Conclusion


    The present study proposed the probabilistic stability analysis of FGGR porous
    beams by using stochastic porosity distributions, GPL reinforced reinforcements,
    and random material properties. The DSC method was utilized to solve the governing
    equations of analytical forms, and the nonintensive CMM was proposed to finish
    the statistical statistics of buckling analysis. Two-step validation was conducted
    to verify the proposed method, followed by a detailed study about the influences
    of material properties, porosity distributions, GPL patterns, and different boundary
    conditions on structural buckling behaviors were investigated. The following can
    be summarized:


    +   1. The stochastic behaviors, due to defects and imperfections of nanostructures,
    manufacturing errors, as well as geometrical randomness significantly affect the
    mechanical behaviors and impede engineering practices of FGGR porous materials,
    especially the porosity distribution, porosity coefficient $\alpha_c$, and GPL
    fraction weight wt.%

    2. Symmetric porosity distribution (st in the case) has the largest values of
    buckling loads, while symmetric porosity distribution (st in the middle) is the
    least one.

    3. For different boundary conditions, there is no obvious overlapping phenomenon,
    which means boundary conditions play a significant role over material properties.


