    + B_{22}z_s^2 + D_{21}\kappa_x + D_{22}\kappa_y \ Q_s &= C_{66}\gamma_s, Q_z &=
    C_{66}\gamma^0 \end{aligned}$ (5.11)

    ```


    where $\kappa$ is the shear correction factor and its value is 5/6. $A_{ij}, D_{ij}$
    ($i,j=1, 2$) are the extensensional, and extensensional-bending coefficients,
    and their values can be computed by the following expressions:


    ```

    $A_{ij} = \int_{-h/2}^{h/2} Q_{ij}dz, D_{ij} = \int_{-h/2}^{h/2} z^2 Q_{ij}dz$
    (5.12)

