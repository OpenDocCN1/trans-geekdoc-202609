    # 12.6 Conclusion


    In this chapter, the stochastic vibration analysis of FGP plate structures has
    been investigated by using different machine learning algorithms. To obtain the
    inherent relationship between the random inputs and structural outputs (i.e.,
    stochastic eigenvalues), the kernel-based GPR method and the X-SVR method are
    presented with the basis function kernel and the Generalized Gegenbauer polynomial
    then. By calculating a limited number of finite element analysis as training data,
    the corresponding regression models can be established and predict the detailed
    statistical information (i.e., mean, standard deviation) and probability profiles
    (i.e., PDF and CDF) of any order structural frequency in an efficient number.


    To illustrate the robustness of the proposed framework, one verification case
    and two practical FGP plate cases are implemented with different types of random
    properties. Observed from the results, only a small amount of training resources
    are required from the X-SVR method to efficiently predict the potential natural
    frequencies of FGP plate compared with the GPR approach. Moreover, the machine
    learning aided uncertainty quantification techniques exhibit great computational
    cost advantages over the classical MCS method, which could be referred to by the
    real-life engineering fields.'
