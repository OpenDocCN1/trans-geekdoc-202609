    # 13.5 Potential applications


    This section discusses and explores the potential applications of lightweight
    concrete structures digitally fabricated in the context of 3D printing.


    The first section is the protective concrete armor units deployed in coastal engineering.
    For the protection of coastal structures such as breakwater, these concrete armor
    units are normally fabricated in precast form with plain concrete, and a wide
    variety of armor units with various geometries have been designed and invented
    over the years, including solid units like a tripod, hexapod, tetrahedron, and
    dolos, [102]. The previous study shows that concrete armor units can be subject
    to three types of loading conditions [103], including (1) static load originating
    from the self-weight of armor units and the surrounding armor units resting on
    them; (2) dynamic pulsating load causing erosion on the marine structure; and
    (3) dynamic impact due to insensitive rigid body rotation of armor units leading
    to unit–unit impact. Notably, the dolos armor unit has been extensively applied
    for marine protection, and its mechanical performance under both static and dynamic
    loading has been well investigated [104–106]. In this case, the framework-based
    3D-printed lightweight cellular structures were proposed by Nguyen-Van et al.
    [6], namely TPS structure (primitive and gyroid), could be a potential candidate
    for the application of protective concrete armor units, due to its adequate mechanical
    performance in terms of static compressive loading and impulse resistance.


    The second potential application is the noise barrier wall structure. Previous
    studies have demonstrated the feasibility of manufacturing porous concrete slabs
    or wall panels with the adequate capability of sound absorption [107,108]. It
    should be noted here the'
