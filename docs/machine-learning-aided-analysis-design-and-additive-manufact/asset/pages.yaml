  md: 'density, and the interaction part is related to the bearing capacity of both
    the thin-walled tube, foam. Hansen et al. [25] have proposed a widely predictive
    model for the compressive force of FFTs as follows:


    ```

    $F_{avg} = F_{avg}^0 + \sigma_t \pi \left(\frac{b_n}{2}\right)^2 + C_{avg}\sqrt{\sigma_t\sigma_b}bm
    \quad (16.1)

    ```


    $F_{avg}^0$ is the contribution of the empty-walled tube, the middle term and
    the last term describe the resistance of individual foam and the interaction effect,
    respectively. $b$ and $h$ are the outer cross-section diameter and the wall thickness
    of the tube, respectively. $b_m=b-h$ and $h_m=b-2h$ are the middle cross-section
    diameter and the diameter of the foam, respectively. $\sigma_t$ is the plateau
    stress of foam. $\sigma_b$ is the characteristic stress of tube material and is
    defined as the average of yield and ultimate stress of tube material.


    # 16.5.2 The new predictive model of graded foam-filled tubes


    Although Eq. (16.1) offers a reliable method to predict the average compressive
    force of FFTs, it is difficult to apply this model directly to GFFT. As shown
    in Eq. 16.8, GF has a gradually increasing compressive strength as pressure proceeds.
    The strength of foam in Eq. (16.1) varies with increasing strain. For GFFT, this
    chapter proposes the following predictive model:


    ```

    $F_{GFFT} = F_{avg}^0 + \sigma^* \pi \left(\frac{b_n}{2}\right)^2 + C_{avg}\sqrt{\sigma^*\sigma_b}bm
    \quad (16.2)

    ```


    The first term of Eq. (16.2) can be written as [25]:


    ```

    $F_{avg}^0 = \kappa_D \sigma_b bm^{1/3}h^{5/3} \quad (16.3)

    ```


    $\kappa_D$ is a dimensionless constant for an empty-walled tube showing deformation
    method. In this chapter, $\sigma_0, b_m,$ and $h$ are identified as 52.86 MPa,
    60.4 mm, and 0.4 mm, respectively. $\kappa_D$ can be determined as 2.572 by fitting
    data. In addition, it is found that the plateau stress obeys a power law with
    the density of foams [34,51]. By fitting the experimental data into power-law
    equations, Eq. (16.4) can be obtained:


    ```

    $\frac{\sigma_{ys}^*}{\sigma_{ys}} = 0.903 \left(\frac{\rho^*}{\rho_l}\right)^{1.787}
    \quad (16.4)

    ```


    $\sigma_{ys}^*$ and $\sigma_{ys}$ are respectively the plateau stress of foams
    and the base materials. The yield stress $\sigma_{ys}$ is 52.86 MPa. Here, the
    energy absorption direction method is used to determine the plateau stress of
    UFs. The energy absorption efficiency is'
