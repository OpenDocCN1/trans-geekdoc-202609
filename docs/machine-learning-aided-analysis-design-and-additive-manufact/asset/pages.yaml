    # # 15.6 Conclusions


    This work has presented systematic investigations on the quasi-static and dynamic
    compressive behaviors of additively manufactured uniform and graded foams. The
    Voronoi-graded foams with predetermined density gradients, as well as uniform
    foams with different relative densities, are successfully fabricated by the additive
    manufacturing technique. The quasi-static and dynamic crushing behaviors of graded
    and uniform foams are investigated experimentally. Results indicate that under
    similar densities, uniform and graded foams have similar mechanical properties
    at the elastic and densification stages. However, graded foams all exhibit an
    increasing plateau, rather than a constant one of uniform foams. This is because
    the density gradient brings deformation mechanisms with a tendency to collapse
    from the lower-density region and gradually to higher-density regions. In other
    words, graded foams control stresses of each component layer. Furthermore, this
    also proposes an elastic-hardening model for predicting the mechanical behaviors
    of graded foams. Firstly, the relationship between mechanical properties and relative
    densities of uniform foams is determined. Secondly, the local relative density
    corresponding to each nominal strain is obtained through the compression process
    of a graded foam. Finally, this model is verified by our experimental results.
    Based on the model derived in this study, the quasi-static and dynamic (20 m/s
    impact) stress–strain curves of continuously graded foams can be determined without
    additional experimental work. This avoids a large number of experimental studies
    on graded foams for different engineering applications.


