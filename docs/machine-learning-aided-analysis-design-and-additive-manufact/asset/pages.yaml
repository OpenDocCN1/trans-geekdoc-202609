    # 3.3.1.2 Parametric investigation


    Analyses for free vibration of FGP plates with curved edges respect to the main
    parameters are conducted in this subsection. Figs. 3.6–8 exhibit the first natural
    frequencies of quadrilateral, elliptical, and truncated circular plate along with
    the porosity coefficient $e_0$ and distributions, all the edges are subjected
    to E and S1 constraints in order. In Figs. 3.6–8, the unified cases are easily
    found. For one reason, the thicknesses of FGP plates with the three kinds of shapes
    are sensitive to obviously with regulating $e_0$ from 0 to 0.95. For another,
    the porosity distributions also affect the free vibration of FGP plates, the influence
    caused by porosity distribution is relatively weaker compared to. The phenomenon
    can be explained by the relationship between the structural stiffness and $e_0$:
    a larger porosity'
