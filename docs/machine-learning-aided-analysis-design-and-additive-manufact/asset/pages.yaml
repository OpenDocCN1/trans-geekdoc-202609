  md: '# Free and forced vibrations of functionally graded porous straight and curved
    beams


    distribution, the natural frequency and forced vibration response of which can
    be obtained. Gao et al. [19] proposed a computational model combining Chebyshev
    method and discrete singular convolution method to analyze the effect of material
    uncertainty on the dynamic response of FGP beams. The reliability and accuracy
    of these methods been verified by researchers, but there is still room for improvement
    in their computational efficiency.


    FGP beam is one of the structures that have been extensively and deeply studied.
    Based on the premise that the porosity is related to the thickness, Jamshid and
    Arghovani [10] found that the distribution of pores with few sides and large centers
    enable most FGP beams to have good performance. Chen et al. [11] conducted a parametric
    study of the established limited FGP beam model, and also discovered that gradient
    porosity affects critical buckling load and frequency. Ebrahim and Zia [12] took
    the FGP Timoshenko beams as the research object to study its vibration characteristics,
    and explored the influence of factors such as material volume fraction and porosity
    volume. The analysis of bending [13–15], buckling [16,17], dynamic vibration characteristics
    are the important research results of the FGP beams. Pennya [20] proposed a method
    that can solve the bending response of FGP beams in hot and humid environments.
    Chen et al. [21] came to the conclusion that both the pore distribution and graphene
    platelets have huge influence on the nonlinear free vibration and postbuckling
    characteristics of the multilayer FGP graphene-reinforced composite beams. A parametric
    analysis of the elastic buckling of FGP beam was carried out by Harsha et al.
    [22], where the porosity parameters of the material were the focus of the study.
    Nguyen et al. [23] proposed a bivariate shear deformation theory for the prediction
    of buckling and vibration characteristics of symmetric porous beams and carried
    out a parametric analysis of the porosity coefficient and density type. Chen et
    al. [24] took the theoretical analysis of its low-velocity impact response, and
    found that small incursion impact loads would cause larger deflection of the beam.
    In addition, researchers have provided numerous discussions and analyses on the
    nonlinear behavior of FGP beam [25]. Chen et al. [26] applied a DQN-based Galerkin
    program to establish a theoretical analysis of vibration for FGP beams with imperfections,
    and classified the nonlinear resonance behavior of FGP beams. According to the
    method, Fouadi et al. [27] developed a solution for analyzing nonlinear bending
    characteristics of FGP beams. Based on the statistical linearization method and
    Euler beam theory, Raskheni and Ghadiri [28] studied the nonlinear random vibration
    of FGP nanobeam under elastic boundary conditions, and verified the reliability
    of their method by comparing the results with the perturbation method. Chen et
    al. [29] took the FGP sandwich beam as the research object and analyzed the influence
    of material and geometric parameters on the nonlinear free vibration characteristics
    under the clamped and simply supported boundary conditions.'
