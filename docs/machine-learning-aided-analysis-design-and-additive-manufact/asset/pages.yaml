    In terms of experimental studies, only limited works over the compressive behaviors
    of graded cellular solids such as hollow sphere agglomerates [37]. Furthermore,
    these works are mainly restricted to the graded foams with discrete gradients
    (Fig. 14.3). In Zeng''s work [36], the strongest and weakest layers were suggested
    to be the first and last layers, to enhance the energy absorption capacity of
    graded foams. Hangai et al. [37] performed the drop weight impact tests on two-layer
    foams with two different base materials. They found that the stress–strain curves
    of graded foams showed two plateau stages according to the plateau stresses of
    two layers. Nevertheless to the authors'' knowledge, studies on the experiments
    of continuously graded foams with predetermined gradients remain lacking, due
    to the difficulty of fabrication.


