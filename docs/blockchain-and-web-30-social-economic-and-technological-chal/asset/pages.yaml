  md: '# Deployed contract components


    The other set of components provides libraries to reverse engineer deployed contracts.


    **Drivers and Access to Contracts (FogComm).** This component supports the access
    to the GETH- RPC API, implementing the primitives and related type marshaling
    for accessing deployed contracts, transactions, blocks, and more [BRDD18b].


    **Blockchain Element Reification (FogLive).** This component extends FogComm by
    adding first citizen representations for blocks, transactions, and external/internal
    accounts. It also provides contract mirrors and contract proxies – built by techniques
    of reverse engineering and SmaccSol''s AST analysis – for allowing a powerful
    connection to deployed contracts. It also provides the idea of Sessions, allowing
    cached and uncached interaction with the blockchain.


    **SmartInspect.** This component leverages the implementation of contracts and
    mirrors in FogLive for gathering information. It exposes a contract''s data in
    different formats to let the programmer access fine-grained information about
    the values of variables for a given deployed contract. It lets the developers
    inspect all the aspects of a deployed contract [BRDD18b].


    **Bytecode Reverse Engineering (Fog EVM ByteCode).** This component extracts and
    interprets the stored hexadecimal code in deployed contracts, building a representation
    of the instructions and the relative memory layout. It also allows one to stream
    instructions and cut the contents into smaller pieces such as, lookup, methods,
    branching points, etc. It complements the SmartGraph and SmaccSol AST. This low-level
    information is interesting for fine-grained low-level analyses, for example, gas
    consumption analysis.


    # Transaction navigation


    **Query and Navigation (Ukulele).** This component offers a query language to
    navigate and access transactions and deployed contracts. To achieve this, it implements
    different indexing strategies based on map reduce technologies, and it leverages
    the mirrors developed in FogLive. It has a small IDE to manipulate identified
    entities [BRDD18a].


    # Foundation for smart contract static analysis


    Solidity [Eth18c] is a programming language used to specify smart contracts on
    the blockchain platforms, in particular, Ethereum [Eth14]. Solidity was originally
    designed to be the primary smart contract language for Ethereum. Even though other
    contract languages have been created for Ethereum (e.g., Serpent,'
  merge: -1
  img_proc: true
- pgno: 209
  md: '(LL), Solidity is still one of the major ones. Moreover, Solidity can also
    be used in other blockchain platforms such as Tendermint, Hyperledger Burrow,
    and Counterparty. Probably because of its popularity, a great amount of smart
    contract research deals with Solidity. Therefore, any proposed tool handling smart
    contracts should support Solidity to be well received.


    Usually, static analysis is employed to examine programming language artifacts.
    Since Solidity is a programming language and smart contracts are its artifacts,
    we use static analysis techniques to implement tools for contract understanding
    and analyses [CCI90]. At their basis, most static analysis foundation techniques
    rely on ASTs (Abstract Syntax Tree). For instance, it is much easier to create
    code inspection tools on top of an AST than to rely on the purely textual contents
    of a contract. Therefore, to build static analyses for Solidity contracts, we
    need a way to create ASTs. Consequently, we require a parser to read Solidity
    source code and output a relevant AST representation of it.


    In addition, we need a separate infrastructure from the Solidity compiler for
    the following reasons:


    +   1 Since the Parser and AST represent a foundational part of a strong analysis
    tool, we need to fully control the parser and its production to avoid unwanted
    side effects in analyses using the produced ASTs.


    +   2 Since the shape of the produced ASTs can severely impact the complexity
    of the analysis built on top, we need to control our ASTs.


    Working with JSON AST produced by the Solidity compiler did not match the aforementioned
    requirements. In addition, we wanted to integrate with Moose (a data and software
    analysis platform) because it provides a rich and versatile set of tools [NA05]
    with a large ecosystem [Ber16, LKG07]. Therefore, developing a Solidity parser
    improves the support for better code analysis in Solidity [RDDL17]. To accomplish
    this, we used SmaCC (Smalltalk Compiler-Compiler) [BLDG17], relying on an adapted
    grammar specification of the Solidity language.


    # Challenges


    The main challenge of designing a parser for Solidity is the inconsistencies among
    the documentation [Eth18c]. For example, in one part of the documentation it is
    stated that string literals are enclosed by either single or double quotes (section
    “Solidity in Depth” – “Types” – “String Literal”). However, in another part (section
    “Miscellaneous” – “Language Grammar”) only double quotes are supported to define
    string literals. On the other hand, the official parser recognizes both single
    and double quoted string literals. This is just one example of several inconsistencies
    we found [RDDL17]. We decided to follow the official parser, i.e., if something
    is parseable in the official parser, then our'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'parser should understand it as well. Even so, the inconsistencies in the documentation
    made the parser creation much more difficult because we lacked a reliable specification
    to follow.


    Another challenge to create a parser is how often the Solidity language changes.
    The language specification is not stable, and syntactic rules are added or changed
    to support new versions of Solidity. For example, in version 0.4.21 (and below),
    there was no syntactic rule to handle a constructor; they were just a function
    definition with the same name as the contract. But that changed in version 0.4.22
    (and above), where the constructor has a distinct syntax different from function
    (by using the constructor keyword). Therefore, any parser for Solidity needs to
    adapt to changes in the syntax, as the language is still under development.


    We took into account these challenges when designing and developing our Solidity
    parser for Pharo.


    # Approach: SmaCC-Solidity


    Creating a parser can be a difficult and time-consuming endeavor. Parser generators
    provide an easier way to tackle this problem [IM15]. Basically, we write the syntax
    specification using a formal grammar, and the generator automatically builds the
    parser. For example, there are many parser generation tools available now such
    as YACC [Mer93], ANTLR [Mil05], and SmaCC [BLGD17].


    Generally, we can classify a parser as either top down or bottom up. A top-down
    parser starts its productions from the root element of the grammar, working its
    way down to the bottom leaves. A bottom-up parser works vice versa, starting from
    the leaves and working up to the root. Moreover, either type of parser usually
    works on a subclass of grammars. The most common subclasses are LL(k) for top
    down and LR(k) for bottom up parsers [ALSU06].


    When we consider the Pharo Smalltalk environment, there are two prominent parser
    generation tools: PetitParser [BCDL13] and SmaCC [BLGD17]. Therefore, we had these
    two options to create our parser. We could also write the parser ourselves without
    relying on generators. We chose to develop our parser using SmaCC for the following
    reasons: (1) SmaCC requires a textual context-free grammar as input that is similar
    to the grammar provided for Solidity; (2) SmaCC generated parser can adapt more
    easily to future changes in the Solidity grammar; and (3) SmaCC produces an LR
    parser, which has interesting advantages over other types of parsers [ALSU06].
    Moreover, both PetitParser and a manually written parser would be more difficult
    to adapt and maintain than SmaCC. Therefore, we claim that SmaCC is the better
    option to create our parser.


    The SmaCC-Solidity parser is publicly available in GitHub (github.com/ smartanvil/SmaCC-Solidity).'
