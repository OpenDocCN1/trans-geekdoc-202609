    # Related work


    In this section, we discuss related work on blockchain analysis platforms and
    tools.


    Porru et al. [PPMT17] acknowledge the need to develop specialized tools and techniques
    for blockchain oriented software (BOS). The authors define the term BOS as a software
    that interacts with blockchain. The authors describe issues and challenges faced
    when working with blockchain from a software engineering point of view. They also
    analyze 1,184 GitHub projects using blockchain, and they propose new ideas and
    practices to improve the state of the art on BOS. The authors present very interesting
    research possibilities that inspired several components on the SmartAnvil platform.


    Bartoletti et al. [BLPB17] propose a framework for blockchain analytics coded
    as a Scala library. Their framework works on both Ethereum and the Bitcoin platform,
    and it employs a general-purpose abstraction layer to promote reuse. One great
    feature of the authors’ framework is the ability to integrate data from other
    sources besides blockchain, such as a NoSQL database. The authors contrast their
    framework features against five other tools, but they do not conduct a performance
    comparison. This work is interesting because the authors combine blockchain data
    with a secondary database. Unlike SmartAnvil, their framework does not support
    querying or analysis of contracts, only blocks and transactions. Moreover, the
    query language is a specific syntax based on a Scala API, and it is not as popular
    as SQL-based queries. Finally, their framework focuses only on gathering data
    and does not support other tools such as inspection or static analysis.


    Kalodner et al. [KGC+17] implemented an open-source blockchain analysis platform
    called BlockSci. They designed their platform with a specific concern for performance
    by using an in-memory database and actual pointers instead of hash linkage. For
    instance, the authors claim it is 15 to 600 times faster than other tools. They
    support the following blockchains: Bitcoin, LiteCoin, Namecoin, and Zcash. The
    authors focus their analysis on financial transactions. Therefore, their analysis
    is not well polished for blocks, and it specifically does not support smart contracts.
    This contrasts with the SmartAnvil platform, which was designed to help smart
    contract developers as well as providing tools for other first-class elements
    (such as transactions and blocks).


    Etherscan (https://etherscan.io) is also an analytics platform connected to the
    Ethereum platform and providing on-the-fly blockchain information on accounts,
    contracts, transactions, blocks, etc. Similar to SmartAnvil, Etherscan'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'also has an inspector and other tools to interact with Ethereum. Etherscan
    does not have a query language, but it supports simple searches on blockchain
    elements. Although Etherscan is free to use, it is not open source. Therefore,
    it is not possible to extend any Etherscan features or components, unlike SmartAnvil,
    which is open source to encourage developers to contribute to improving our tools.


    Remix [Eth18b] is an open-source suite of tools developed by the Ethereum Foundation.
    Although Remix is mostly recognized for its IDE component, it does provide many
    other tools such as inspection, transaction debugger, gas estimation, etc. Since
    it is developed by the Ethereum Foundation, Remix is always integrated with the
    latest Ethereum APIs. Remix is coded in JavaScript, and it is under the MIT open-source
    license. SmartAnvil shares some similar tools with Remix (e.g., inspector, parser).
    However, both suites have distinguished tools that are absent in the other. For
    instance, SmartAnvil has a query language, a smart graph, and integration with
    Moose. On the other hand, Remix has a transactional debugger and a full IDE.


    There are tools designed to improve the security of smart contracts. Oyente [LCO+16]
    is a tool that flags potential security flaws on smart contracts. Oyente uses
    static analysis on the contract binary code to make security recommendations.
    SmartCheck [TVI+18] is another tool using static analysis that identifies unsecured
    patterns on contract source code and warns the user about better practices. Bhargavan
    et al. [BDLF+16] proposed an unnamed framework to convert smart contract to their
    own functional language, F★, which was design to better verify the correctness
    and security of smart contracts. Although SmartAnvil does not support security
    verification or recommendation of smart contracts, this is important for smart
    contract developers, and we plan to add a tool for such tasks in the future.


    # Conclusion


    In this chapter, we presented a set of analysis tools showcasing our SmartAnvil
    platform to cover different aspects of smart contracts analysis. For each tool,
    we showed the importance of each and the main challenges when developing them.


    First, we presented the basic tool to support static code representation of Solidity
    smart contracts, our parser, SmaCC-Solidity. Having full control over our parser
    and its representation allows us to avoid any problems with future changes in
    the Solidity language (which is not stable). The parser is used on other SmartAnvil
    tools such as SmartInspect and SmartMetrics. Developers can use this parser to
    increase the integration between Solidity and Pharo by implementing more tool
    support, or build their own static analysis tools on the resulting AST.


    Second, we showed SmartInspect, our internal state inspector for Solidity smart
    contracts. As we explained, contracts are opaque, because once they are'
