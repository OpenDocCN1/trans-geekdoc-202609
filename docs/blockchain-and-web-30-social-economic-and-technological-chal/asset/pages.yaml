  md: 'This purchasing power volatility has rendered it fundamentally useless as a
    store of value, and most long-term holders of Bitcoin have invested in it speculatively,
    as an asset that should theoretically increase in value given its deflationary
    architecture (Weber 2016). For those who intend to use bitcoins as a medium of
    exchange, however, there is an inherent incentive to minimize the amount of time
    that bitcoins are held, since its value oscillates unpredictably. Similarly, sellers
    who accept Bitcoin as a means of payment typically quote prices that float according
    to Bitcoin’s exchange rate with an established currency such as the US dollar.
    In this sense, Bitcoin not only fails as a store of value but also as a unit of
    account, since its instability leads to prices being implicitly denominated in
    established fiat currencies.


    What the instability of many cryptocurrencies reveals is that a fixed nominal
    supply and a predictable trajectory of monetary creation cannot ensure deflationary
    tendencies proceed in any orderly manner (Harwick 2016). Absent of any centralized
    mechanism for controlling the currency’s value and supply, the price of Bitcoin
    and other cryptocurrencies are at the mercy of market speculation, which inevitably
    manifests itself in extreme volatility.


    As Figure 2.2 shows, the daily volatility of Bitcoin far exceeds stock indices
    such as the S&P 500. And these bouts of sudden appreciation and decline have been
    so severe and regular in occurrence that they rendered it nigh impossible for
    retailers and other online service providers to commit to acceptance of Bitcoin
