- pgno: 42
  md: 'What we have illustrated, however, is that blockchain technology need not serve
    such ends. By recognizing the inherently political dimension of blockchain architecture
    and, consequently, *blockchain governance*, it becomes possible to re-engineer
    the technology to the benefit and empowerment of local communities and organizations.
    In this sense, we have argued that commons-based approaches to the application
    of blockchain are possible, ongoing, and full of potential. However, such commons-based
    approaches to blockchain must temper the scope of their scaling to ensure that
    the technology is deployed locally and serves the ends of the community rather
    than aiming to spark counter-hegemonic transformations through the mere deployment
    of blockchain alone. To paraphrase Polanyi (1944/2001), commons-based projects
    must aim to embed blockchain within the community rather than seeking to embed
    social relations within the blockchain itself (as its libertarian proponents might
    advocate). In so doing, however, blockchain technology has the real potential
    to promote the kind of social relations and collective organizations needed to
    achieve blockchain’s original aim of systemic change.


    # Notes


