  md: 'To address these challenges, we proposed a query language that enables its
    users to acquire information more easily. We highlight the following benefits
    of using a query language to fetch information from blockchain: (1) describe structural
    and semantic filters to query for information; (2) reformat and transform the
    acquired data; (3) order the query results; and (4) limit the number of results
    returned.


    # Approach: Ukulele


    In this section, we present the Ukulele version 0.9, a query language designed
    to acquire information from the blockchain. Ukulele is the improvement of our
    previous work, called Ethereum Query Language (EQL) [BRDD18c]. Ukulele is publicly
    available at GitHub as part of the SmartAnvil suite (https://github.com/smartanvil/UQLL).
    Ukulele syntax is based on the SQL language. The idea is to allow users to write
    queries as close to SQL as possible to facilitate the adoption of Ukulele, since
    SQL is a very popular language [SKS11, EN10].


    Listing 13.3 shows the main elements of the Ukulele syntax. The syntax is described
    using EBNF (Extended Backus-Naur Form); we did not format the terminals identifier
    and number in double quotes to highlight that they are not literals. We omitted
    the Expression rule to not clutter the specification, but it follows a similar
    structure of SQL expressions.


    # Listing 13.3 Ukulele grammar in EBNF format


    ```

    1 <SelectStatement> ::= <SelectClause> <FromClause>

    2     [<WhereClause>] [<OrderByClause>] [<LimitClause>]

    3 <SelectClause> ::= "select" <Expression> {"," <Expression>}

    4 <FromClause> ::= "from" <SourceBind> {"," <SourceBind>}

    5 <WhereClause> ::= "where" <Expression>

    6 <OrderByClause> ::= "order" "by" <Expression> ["asc" | "desc"]

    7 <LimitClause> ::= "limit" number

    8 <SourceBind> ::= identifier "as" identifier

    9 <Expression> ::= . . .

    ```


    As we can see from Listing 13.3, the syntax for Ukulele queries is very similar
    to the “Select” statement from the SQL language. The Ukulele “Select” statement
    consists of the following clauses: select, from, where, order by, and limit. Only
    the select and from clauses are required; the others are optional clauses. We
    also like to highlight that Ukulele, similar to SQL, is also case insensitive.
    Unlike SQL, the Ukulele “Select” statement does not have a group by clause. Although
    we have plans to support a group by clause in the future, the current version
    does not allow the usage of such a clause.


    In the from clause of Ukulele, we need to use a collection. In Ukulele, a collection
    is a semantic representation of queried data. The Ukulele language has four predefined
    collections: ethereum.blocks, ethereum.transactions, ethereum.'
