- pgno: 182
  md: '![](img/a0011e82f3a3a41227dc70cd0ddb893a_182_0.png)


    Figure 11.2 Wibson app, “Data Sources” and “Offer Details”; example of one source
    selected Source: Author’s own elaboration (screenshot of app) (2018)


    data to a buyer, always monitoring where that data is, and receive a payment through
    Wibson. Thanks to blockchain, data can be always monitored by users, is encrypted
    and is not stored in any Wibson server, which only holds a record of the transaction,
    including the smart contract agreed upon between the seller and data buyer (Wallen,
    2018).


    Thus, Wibson’s model includes the following actors and exchanges:


    +   • Data sellers (registered users, mostly individuals): the app is free for
    them in monetary terms. When a transaction is completed, they win Wibson points
    (digital rewards that in the end represent money).10


    +   • Data buyers (corporations or individuals). The app is free at the moment.
    Data buyers pay for and obtain data from users, not depending on Facebook or Google
    (but, by means of Wibson). If they want notaries to validate the data, they can
    add a payment that goes to Wibson. Thus, hat these actors are supposed to obtain
    access to validated data from users in a marketplace that a priori lacks the high
    entry barriers of the Internet giants. Here, money enters in the circuit. In this
    testing version of Wibson, data buyers don’t differ from investors/partners, which,
    along with Wibson, will be the only buyers of data (Wibson, 2017 – Frequently
    asked questions).


    +   • App investors/academic partners: from universities to big companies (including
    the telecommunication industry, banks and others), these actors can play two roles.
    Some of them are the aforementioned “notaries”: they are in charge of verifying
    data (based on their own records), receiving a payment'
  merge: -1
