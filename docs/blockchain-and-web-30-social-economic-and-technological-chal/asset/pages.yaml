  img_proc: true
- pgno: 134
  md: 'block-size debate. The issue in that controversy is the implication of increasing
    the size of the blocks on the Bitcoin blockchain. On the one hand, bigger blocks
    would increase the throughput of the system, allowing for more transactions per
    minute to be processed and a potentially higher level of recognition of the cryptocurrency
    as a payment system. Opponents of the increase, however, pointed out that larger
    blocks mean that individuals with less computing resources and on slower networks
    are discouraged from participating in the mining process, while big mining consortia
    would enjoy a number of self-reinforcing advantages (van Wirdum, 2015). A larger
    block size may help the network to scale up, but it threatens the recentralization
    of the network. This dilemma has caused divisions and the ultimate schism in the
    Bitcoin community (de Filippi & Loveluck, 2016). Many members adhering to the
    “true spirit” of decentralization according to Nakamoto’s vision protected the
    cap for ideological reasons. Others disagreed and decided to create and sustain
    a forked alternative version of the Bitcoin blockchain that is still maintained
    as an independent cryptocurrency. The disagreement has demonstrated that non-architectural
    choices have important consequences on the decentralized nature and the development
    path of the technology.


    # 2. Internal control and governability


    One of the biggest challenges a decentralized system faces is its continuous maintenance
    and community governance. Every additional measure of decentralization to minimize
    external control also diminishes the control powers of the creators of the system.
    The decision-making processes that are required by the maintenance of a control-proof
    decentralized system cannot be fully automated away. The elimination of single
    points of control makes the maintenance of the system slow and the social coordination
    of the participating members cumbersome. It proved to be harder than expected
    to implement in practice the “governing without a government” vision of Nakamoto.
    The Nakamoto consensus, as a technical approach to create a self-governing system,
    is only useful to maintain a distributed nature of the ledger but is unable to
    operate on other levels where decentralization may be desirable. The technology
    that allows avoiding reliance on external intermediaries was not sufficient to
    guarantee the decentralized nature of the technology when it came to core developers,
    full nodes, or miners and other interests and stakes in the techno-social system.


    Take, for example, the current governance of the Bitcoin technology. Lacking a
    formal governance structure, the Bitcoin community coordinates ideas for improvements
    through the Bitcoin Improvement Proposal (BIP) system. It consists of a transparent
    process very similar to the code review process available on open-source and free
    software projects (de Filippi & Loveluck, 2016). Everyone can review the code
    and documentation and can make suggestions to modify and improve the system. However,
    the implementations of the code come from the team of core developers who make
    the decisions “on behalf'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'of the community)” and after the proposed BIP has an ultimate consent from
    “the consensus of the Bitcoin users”.5 From a technical point of view, this (re)centralization
    tendency around the core developer team makes sense by virtue of their technical
    skills and very frequent involvement with the code.


    The veto powers of the other members of the community act as a counter-balance
    to the power of the developer oligarchy. The blockchain core developers’ protocol
    decisions have to be approved of and implemented by miners and other nodes. In
    case they disagree with the changes, they could also make the decision to fork
    the whole chain. Compared to miners and full nodes, plain users have less veto
    power, but they still do possess some level of control, by, for example, not assigning
    market value to the tokens issued by the network.


    One can argue that these built-in control mechanisms and the possibility that
    actors can freely choose between competing chains and implementations stabilize
    and potentially counteract recentralization tendencies. Yet only in a decentralized
    network does such an indirect voting mechanism produce an effective democratic,
    horizontal self-governance of equals. In case of recentralization, there is a
    chance that this system of decentralized approval/rejection degenerates into a
    competition of highly centralized powers and leads to a potential tragedy of the
    anti-commons (Heller, 1998). This is exactly what is at stake with the current
    levels of concentration of mining power in the Bitcoin network. A small group
    of miners control more than 51 percent of mining power in the network, so it is
    relatively cheap and easy for them to prevent any changes in the protocol that
    might hurt their interests through coordination and collusion. Under such conditions,
    the built-in informal governance mechanisms in the Bitcoin network were unable
    to handle the block size disagreement, which could only be solved by the forking
    of the codebase and the network.


    The ability to maintain different versions (forks) of the blockchain and users’
    freedom to decide which version to embrace can also be read as the expression
    of technical decentralization. On the other hand, while nothing prevents already
    centralized miners to produce the code, it is difficult for a small and dispersed
    group of coders to produce sufficient amounts of capital-intensive mining power.
    This means that it is very likely that the current separation of code production
    and mining will consolidate under the miners, removing another layer of checks
    and balances which currently add to the decentralized nature of the system.


    # 3. External recognition


    While, as was stated earlier, the purported examples of Bitcoin and foundational
    blockchains like Ethereum are motivated by the goal of achieving “policy neutrality”,
    the need to build compatibilities with existing systems creates a tendency to
    recentralize. If blockchain-based systems and applications have to or want to
    interface with existing institutions, practices, and networks because'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'there is no other way to achieve their stated goals, the mere existence of
    this interface creates strong external and internal incentives for legal compliance
    and a corresponding “drift towards legality”. This drift implies that the legal,
    political, and economic systems and institutions develop the necessary tools to
    adopt the decentralized system. In a similar vein, DLTs also have to build the
    capacities to be recognizable by existing formal institutions and legal systems.
    Since legal compliance rests on parties being clearly identifiable and rights
    and obligations being well defined, this drift towards legality further creates
    pathways of recentralization. Control of the blockchain through identifiable actors
    and processes translates into control of the code, of the network, and/or of the
    decision-making process.


    From a legal perspective, the most prominent challenge for wide adoption stems
    from the need of identifying legal structures under which the constituents of
    a blockchain project can be recognized. The consequences of such a choice can
    be found in the identification of formal liable actors, in the regulation of the
    product, and, finally, in the wider adoption by society. The case of the Tezos
    Foundation demonstrates the high stakes around the external recognition of DLTs,
    the interplay between the external and internal status of a blockchain system,
    the interdependence of the external governance of a techno-social system, and
    the self-governance of the system which the project is promising to build (Lewis–Kraus,
    2018). The Tezos Foundation was established as a Swiss foundation in Zug, Switzerland.
    A foundation under Swiss jurisdiction is a popular choice for some emerging blockchain
    projects because it allows DLT developers to escape the regulations of the Securities
    and Exchange Commission in the US or similar regulatory bodies in other countries.
    However, being a Swiss foundation showed its limitations when the collapse of
    trust among board directors of the Tezos Foundation locked up the funds raised
    during the ICO. Due to regulatory governance and compliance issues, Tezos has
    yet to launch its promised network to this date, and it is named in numerous class
    action lawsuits for investor fraud and securities law violations.


    On a technological governance level, the irregular nature of code contributions
    and technological updates among core developers and community contributors appears
    to inhibit the wider adoption of DLTs in more formal economic and governance contexts.
    The assumption that the semi-formal technical governance of the software code
    of DLTs will suffice to permit its integration with governmental and corporate
    institutions is incompatible with the reality of how institutions function, especially
    in the financial sector implement technology. In these settings, trusted intermediaries
    emerge in order to formalize the technical processes and to create liable actors
    or procedural guarantees. For example, efforts to formalize code production through
    standardization and the adoption of ISO certifications to DLTs heavily centralizes/(re)
    intermediates the technological stack via the validation process by external actors.
    A priori, de facto and de jure standardization of blockchain technology can facilitate
    the integration to existing trading and economic systems.'
