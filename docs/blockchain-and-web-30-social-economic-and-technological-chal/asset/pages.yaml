  md: '# Team 3: contribution vs influence


    ![](img/a0011e82f3a3a41227dc70cd0ddb893a_101_0.png)


    This team worked across two businesses, so that the main conduit for team communication
    across both was a creative manager rather than a coder, which led to a discussion
    about the distinction between contribution and influence (see the two differing
    blue spreads). Team goals centered upon gaining a publisher for their demo game
    and establishing flat team structures long term.


    # Team 4: the Importance of dev logs


    ![](img/a0011e82f3a3a41227dc70cd0ddb893a_101_1.png)


    This university team kept daily developer (dev) logs using the basecamp software.
    Tied to dev log results, this team decided revenue shares according to time- and
    result-based contributions. The dev logs also helped to adjudicate a difficult
    team dispute when one member wasn''t seen to be pulling their weight. The team''s
    ambitions centered upon winning Tranzfuser.


    # Discussion


    One of the reasons for using social network analysis in this study was to check
    whether these communication flows influenced the distribution of Tals. From these
    results, it appears that they have a significant influence. For instance, contractors
    who work remotely are generally less embedded in the team structure, reflected
    in a tendency to allocate contractors copper Tals (monetary rewards) rather than
    silver Tals (monetary rewards combined with voting rights). Also, the project
    lead tended to commit more time than the rest of the team, all four of the founders
    interviewed were mindful to recognise the value of the emerging team identity.
    The observed Tal redistribution meeting is indicative of'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'this shift over the course of the project. The motivational value of flat management
    structures and shared value recognition was also commonly deemed to be an important
    consideration. These cultural values are likely to reflect the close interdependencies
    of collaborative game development work.


    Further research is required in order to ascertain which aspects of the emerging
    group identity might also be reflected in social networking data flows. As Team
    3’s experience made clear, for example, development contribution is not always
    the same as creative influence. This is true for both individual influence and
    the more ephemeral influence of the emerging team character or identity. Even
    if social networking data flows can document changes in group team communication
    activity, it is still unlikely that they can capture the full character of an
    emerging group identity and its influence upon creative decisions.


    Thus, although automated work tracking systems are highly convenient and useful
    ways to track contribution, they don’t capture everything. Measuring contribution
    purely according to time, for example, can miss important social considerations
    and also invites system gaming. Time-based measurements can encourage long working
    days but also potentially less productive working hours. Equally, as one interviewee
    also pointed out, a short meeting might be key to a team’s success – and yet that
    value might only become apparent months later.


    Another participant made the astute suggestion that any attempt to reward participants
    based on output needed to be contextualised by four key considerations:


    +   * Difficulty of task, because some roles are harder than others.

    +   * Time available, because some people can only work part time, or remotely.

    +   * Quality of output, because time does not always equal ability.

    +   * Prior knowledge, because in situations where team members are taking on
    a number of roles, they are just as often novice as master of those combined tasks.


    Whilst differentiating the value of individual contributions may be a useful consideration,
    it also risks team work relationships that place a strong emphasis upon hierarchical
    contribution measures. Another consideration is whether output is always the best
    measure of time efficiency. Even time spent daydreaming can become essential as
    long as it is linked to a work program and broad-based development trajectory.
    This indicates the value of a broader, sectoral analysis of workflows over time
    and also across a number of teams in order to better understand the nature and/or
    importance of these productivity peaks and troughs to the overall development
    trajectory.


    Supplemented by an open and supportive management style, automated work-tracking
    systems were most useful in terms of work contribution management. Whilst they
    didn’t necessarily motivate hard work (since creative teams are generally motivated
    by creative goals, rather than productivity outcomes'
