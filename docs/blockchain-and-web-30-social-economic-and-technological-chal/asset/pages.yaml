  md: 'Under the GDPR (European Union, 2016), individuals are entitled to two major
    rights: “right to erasure” and “right to rectification”. In this case, since both
    blockchains are immutable, how can they comply with these two individual rights?
    Further, can DApps be developed in compliance with the GDPR, even while acknowledging
    this issue?


    In this chapter, the authors first discuss the basic concepts of the GDPR. Then
    the multiple approaches for developing DApps while attending to the GDPR will
    be presented, although some may not be able to fully comply with the regulation.
    Furthermore, a series of universal steps also are provided for anyone interested
    in developing DApps to be able to fully comply with the regulation. Finally, a
    case study is considered: DFiles, an open-source DApp developed with decentralized
    technologies such as Ethereum, its smart contracts and the Interplanetary File
    System (IPFS) (Protocol Labs, 2018), while following the principles of blockchain
    software engineering (Destefanis et al., 2018). Here, we attempt to answer the
    following questions:


    +   - Can DApps be fully compliant with the GDPR?

    +   - Is it feasible to protect user data by encrypting it in Ethereum (Homestead)?


    The short answer for the first question is that DApps can in fact be compliant
    with the GDPR, albeit with severe limitations. A possible approach to ensure their
    compliance is data encryption, which leads to the second question: it was found
    that protecting personal data by encrypting it is, as of late 2018, unfeasible,
    as explored later in this chapter. Ethereum and the IPFS must rapidly improve
    to allow other privacy scenarios or at least ensure encryption is in fact possible
    for medium to large file sizes.


    # The General Data Protection Regulation


    Before the GDPR, big companies could collect, process and store their users’ data
    with less restrictions. The European Union, however, drafted a new law to further
    ensure users have their important data private and protected from organizations’
    data mishandling and possible data breaches. In May 2016, this massive legislation
    was passed and was enforceable (European Data Protection Supervisor, 2018), although
    penalties were only applicable nearly two years later, on May 25, 2018. Understanding
    the regulation in its entirety can take a few months to one to two years. For
    the sake of space, only its most important aspects are covered.


    The regulation introduces some new concepts:


    +   - **Data subject (or individual):** “any person whose personal data is being
    collected, held or processed” (EU GDPR Compliant, 2018).

    +   - **Personal data:** any information “relating to an identified or identifiable
    natural person (‘data subject’); an identifiable natural person is one'
