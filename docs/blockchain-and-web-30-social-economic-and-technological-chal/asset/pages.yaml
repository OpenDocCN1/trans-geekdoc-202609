- pgno: 150
  md: "and provenance, blockchain presents as a technological solution to a range\
    \ of both ethical and financial problems. In this context, Joseph Schumpeter's\
    \ work is well placed to help us consider how Steemit and Creative Passport, due\
    \ to their disruptive tendencies, could drive transformation in the digital music\
    \ and media economies. In addition, because each of them is a manifestation of\
    \ an accelerating desire to interact with the Internet in more autonomous and\
    \ equitable ways and because Schumpeter's work is concerned with economic modelling\
    \ at a macro scale, we can also consider how Steemit and Creative Passport might\
    \ open up perspectives around the ongoing evolution of the general socio-economic\
    \ environment.\n\n# Destructive transformation\n\nIn Capitalism, Socialism and\
    \ Democracy, Schumpeter's wider project was the contention that capitalism is\
    \ an inherently unstable and self-devouring phenomenon. Whereas Engels and Marx\
    \ concluded that the transition from capitalism to socialism would come about\
    \ via a process of violent revolution (Engels and Marx, 1848), Schumpeter looked\
    \ through a different lens. He held that capitalism was inherently unstable and\
    \ liable to collapse because of the way that it systematically undermines the\
    \ structures that it relies on, and indeed the conditions that brought it into\
    \ existence in the first place. Although Schumpeter's focus was at the macroeconomic\
    \ scale, we can nevertheless use his ideas as a backdrop to consider how it is\
    \ that we might understand Steemit and Creative Passport as agents of collision\
    \ and acceleration and keep in mind the fact that, in its original formulation,\
    \ creative destruction drew a parallel between changes at a market level, with\
    \ an overall systemic transformation:\n\n> The opening up of new markets, foreign\
    \ or domestic, and the organisational development from the craft shop and factory\
    \ to such concerns as U.S. Steel illustrate the same process of industrial mutation\
    \ that incessantly revolutionises the economic structure from within, incessantly\
    \ destroying the old one, incessantly creating a new one. This process of Creative\
    \ Destruction is the essential fact about capitalism. It is what capitalism consists\
    \ in and what every capitalist concern has got to live in.\n> \n> (Schumpeter,\
    \ 2010: 73)\n\nLater in the book, Schumpeter qualifies his vision of how creative\
    \ destruction functions at the level of economic infrastructure, suggesting that:\n\
    \n> The same economic process that undermines the position of the bourgeoisie\
    \ by decreasing the importance of the functions of entrepreneurs and capitalists,\
    \ by breaking up protective strata and institutions, by creating an atmosphere\
    \ of hostility, also decomposes the motor forces of capitalism from within.\n\
    > \n> (Schumpeter, 2010: 144)"
