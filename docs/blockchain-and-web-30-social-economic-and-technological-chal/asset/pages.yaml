  md: '# The case of Wibson: functioning, actors, exchanges and discourses – a new
    emerging intermediary


    # What is Wibson according to Wibson?


    Wibson identifies a “Challenge” in “today’s economy”: “data equals money. Unfortunately,
    it doesn’t mean money for you”, then points out guilty parties: “Giant tech companies
    cleverly use the Internet’s underlying technical protocols to capture and control
    your personal information”. Finally, Wibson proposes a “solution” to those “individuals”
    who are “the real owners of data”: “The Wibson data marketplace provides infrastructure
    and financial incentives for individuals to securely sell private information
    that is validated for accuracy, all without sacrificing personal privacy” (Wibson,
    2017). It is, according to Wibson and to sum up, “a decentralized data marketplace
    empowering individuals to monetize their own data, safely” (Wibson, 2017).


    As we suggested earlier, here we can clearly see how Wibson takes note of current
    issues on data privacy, control and transparency, on the one hand, and on data
    economics or property, on the other, to justify and promote its business. To be
    sure, it can be read in its “White Paper”, in the section that describes the “motivation”
    for the app’s launching, who these “giant tech companies” are. They “have cleverly
    used the underlying technical protocols to build layers of proprietary applications
    that capture and control massive amounts of personal data. . . . The top five
    companies (Google, Facebook, Apple, Microsoft and Amazon) boast a combined market
    value of almost $3.5 trillion” (Travizano et al., 2018: 2).


    # What is behind this “solution”?


    Wibson is a proprietary and for-profit app launched in February 2017 by Gran Data
    company. Gran Data operates in the so-called field of big data (which includes
    capture and analysis of data) since 2007. It started offering services to corporations
    and, since 2017, it intends to include “individuals” through Wibson. Although
    its headquarters are located in Silicon Valley, most of the company operates in
    Argentina, where it employs about 60 workers. First through Binaria and now through
    Wibson, the goals of the company have have always been the same: “understand market
    trends and predict users’ behavior”, selling related services (grandata.com, 2018).
    In an interview, asked about Wibson’s profit model, the cofounder said: “What
    I actually want is to use Wibson as a way to obtain data for my other company,
    Gran Data” (Jiménez, 2018).


    Based on an Ethereum blockchain, Wibson offers a digital data marketplace and
    legal advice on data transactions, mainly connecting data producers (individuals)
    with data buyers (organizations or corporations). Synthetically, once a user installs
    the app – this reduces the “community” to registered users – the app links itself
    to different data sources (social media profiles, device location and others –
    see Figure 11.2). From the app, the user can see data buyers’ offers. Meanwhile,
    the “notaries” check the fidelity of the data. Users then sell'
