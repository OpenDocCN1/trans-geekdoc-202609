  md: "examining three major ICO evaluation websites, we extended the list of success\
    \ factors reported by the literature, classifying them into project-related and\
    \ campaign-related categories and subcategories. We then drew upon the knowledge\
    \ of domain experts and built a hierarchical model of the success factors using\
    \ the subcategories as the building blocks. The resulting model explicated the\
    \ complex linkage among the success factors and highlighted the more fundamental\
    \ driving factors behind the crowdfunding success.\n\nOur findings could be used\
    \ as a theoretical basis to further study the determinants and success indicators\
