- pgno: 180
  md: 'To be sure, according to CEO of Wibson: “We are transforming personal data
    into a valuable asset which consumers can easily control and trade, just like
    more traditional assets” (Wallen, 2018).


    Through blockchain, in Wibson, what is private remains private, and all participants
    in the blockchain and Wibson are geared toward that purpose. Whether the data
    is appropriated by Facebook, Gran Data or by an individual does not call into
    question whether that data should be public and preserved from commercialization.
    This is exterior to blockchain and has to do with regulation (particularly with
    the smart contracts attached to IG). In this sense, one can ask whether the current
    cultural and institutional arena leads to a discussion of public utility, care
    and transparency of data traffic or instead contributes to installing other capitalist
    forms, keeping unaltered the balance between the public and the private.


    Related to that, some scholars have questioned the supposedly intrinsic capacity
    of these technologies to empower the community (Pel, 2015; Scott, 2014). They
    noticed that the community of users does not refer to the construction of communal
    ties, “people getting together in mutualistic self-help groups”, but to “individuals
    acting as autonomous agents”. Thus, this supposed empowerment comes “from retreating
    from trust and taking refuge in a defensive individualism mediated via mathematical
    contractual law” (Scott, 2014: 20). “Empowering individuals” through a blockchain-based
    app (Wibson, 2017), Wibson seems to be a relevant case, if not the best expression,
    of this individualism. As we will see, its incentive system contributes to it.


    In the next section we detail how Wibson works and how it describes (and justify)
    itself discursively (Figure 11.1).


    ![](img/a0011e82f3a3a41227dc70cd0ddb893a_180_0.png)


    Figure 11.1 Wibson main page (Wibson.org)

    Source: Author''s own elaboration (screenshot) (2018)'
