- pgno: 184
  md: 'as an intermediary. In short, this system enables network participants to work
    together toward a common goal, the growth of the network and the appreciation
    of the token. Through this system, finally, interests of users (in individual
    terms) and app interests converge.


    # Conclusions


    This chapter aimed to characterize an extended way of using blockchain technology
    in the field of circulation and commercialization of user-generated data through
    the case of Wibson.


    To do this, we’ve placed this for-profit and blockchain-based app in context:
    first, in the general context of informational capitalism; second and more specifically,
    in the middle of a great expansion of the commercialization of user-generated
    data and the subsequent debates that took place as a response, in economic and
    social terms. These debates came to question the role that the Internet giants
    had been playing on that regard. The time to erase those intermediaries had come,
    and the decentralized nature of blockchain would come to help in that sense.


    However, we’ve shown, first, that there is no such thing as “a blockchain” but
    different kinds of blockchains, and there are not, in this sense, “natural or
    intrinsic features” of blockchain technology. In particular, through a private
    blockchain, in Wibson, intermediaries do not disappear but change hands. Indeed,
    data brokers have changed: from Facebook or Google to Wibson, giving to “individuals”
    some monetary retribution and control of their data. In this sense, Wibson seems
    to be telling its users “Don’t trust me, I don’t store your data; trust in the
    blockchain community”. But Wibson keeps the power to regulate the permissions
    and the rules of the app. As we’ve seen, the ideas of “giving control back to
    individuals” and “pay a fair share for their data” have turned into Wibson’s discursive
    justification for its existence as a new intermediary in the growing digital data
    market. Users had already – before Wibson’s own existence – been convinced of
    the evil of giants.


    Second, but related to it: through Wibson, blockchain serves to develop another
    way of commercialization of informational goods (specifically data) on the Internet.
    Thus, Wibson helps to show that a certain degree of decentralization – controlled
    decentralization – of the data market doesn’t represent a democratization of the
    data market; it works as a tool to raise a dispute against the Internet giants
    for one of the most important sources of profit these days: user data. This is
    an inter-capitalist dispute, in which community – turned into individuals for
    profit actors – is just a medium.


    Leaning on certain attributes of the blockchain technology, apps like Wibson keep
    the disruptive potentials of the digital technologies in between the boundaries
    of capitalism. Thus, the question about nonprofit interests on data and public
    utility of data remains unanswered. If the commodification of the Internet has
    steadily advanced over the years in the realms of infrastructure, software and
    content, now it’s time for data.'
