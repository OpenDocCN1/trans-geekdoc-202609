  md: 'However, smart contracts do offer some true advantages. We provide a model
    that makes good use of these to improve the ODR process. First, the blockchain
    system provides complete transparency about the executed steps, creating an audit
    trail that is hard to forge and where details can easily be retrieved by participants.
    This leads to much higher accountability for the arbitrators in the decision-making
    process. For ODR, governments can implement regulation in the form of providing
    smart contract templates that define procedures that are legally required. Templates
    contain the standardized methods that can be executed by a multitude of ODR platforms,
    eliminating the need to implement them independently and hence reducing the degree
    of legal uncertainty in terms of compliance. Such smart contracts also provide
    a unified way to gather data about ODR outcomes and claims, thus allowing the
    effectiveness of the ODR process to be more easily analyzed and with a higher
    degree of confidence. Importantly, an efficient feedback mechanism can be implemented
    to collect opinions from participants whether or not the outcome met their expectations.
    This allows for a new form of co-regulation.


    Ultimately, smart contracts are not a panacea. First, they introduce new problems,
    as they may contain errors of two kinds: wrong procedures due to legal misunderstandings
    and errors that make the code vulnerable to exploitation. We showed that intervention
    is not easy in either case, and damage can occur fast and be hard to undo. A classic
    set of mechanisms and support infra-structure still needs to be in place to deal
    with risk assessment and risk allocation in case of errors.


