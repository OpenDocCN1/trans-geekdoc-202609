- pgno: 271
  md: 'However, as expected, the average upload time was bigger for encrypted files.
    As for medium ones, the average total transaction cost is again slightly larger
    for unencrypted files, and the average upload time is larger in encrypted files.


    In addition to this, if one compares the last recorded values for encrypted and
    unencrypted values from all categories (small, medium, large and extra large)
    in Appendices A and B, it clearly demonstrates that the last two file encryption
    times for files up to 800 MB are less than the upload elapsed time for encrypted
    files up to 14.2 MB.


    The conclusion is that encrypting files to comply with the right to erasure is
    a valuable option for small to medium files up to 14.2 MB. From there, without
    considering hardware encryption limitations, upload times tend to grow exponentially.
    For this reason, encrypting medium to extra-large files is not feasible as of
    late 2018.


    However, note that encrypting all files in DFiles could have not been necessary,
    as some would only contain data that cannot be tied to a specific individual –
    therefore not being considered personal data. The user could have selected an
    option whether or not to encrypt his files, whether or not they contain personal
    data. The problem with this is that users are not always truthful, and in this
    way they might upload sensitive files – files containing personal data about someone
    – which would be available out in the open and inside the scope of the GDPR. They
    could also resort to extortion – as data in DFiles is immutable – by uploading
    on purpose personal data about someone and then demanding money in exchange for
    their silence in telling the authorities responsible for applying fines for GDPR
    noncompliance. Therefore, file encryption, although time consuming and limited
    in the IPFS and Ethereum, is necessary to prevent these cases and to avoid communicating
    possible data breaches to the appropriate GDPR authorities.


    Blockchain technology in general, as already discussed, has a very distinct and
    important characteristic: immutability. This ensures it is attractive to several
    major companies to combat fraud and have an unmodifiable record of transactions.


    Therefore, Ethereum and the IPFS must advance to allow better privacy techniques
    unless the European Union drafts and passes laws that exempt DApps from parts
    of the GDPR that are highly difficult to comply with, such as the right to erasure.


    # Limitations and future work


    Ethereum is clearly an exciting and evolving technology. However, there are several
    limitations that had a major impact on the authors’ work. For instance, the severe
    gas cost of having smart contracts with loops discouraged its adoption in the
    DFiles core smart contract. Moreover, the lack of support for JSON objects is
    also a major aspect to take into consideration, as smart contracts in Solidity
    could potentially be more efficient if, instead of using a structure, a'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'standard JSON object was used. On top of this, IPFS clearly has a long way
    to go for DApps to become mainstream. For starters, it has a growing problem of
    storing very large files, as demonstrated by DFiles. If encryption is required,
    then the maximum file size possible is much lower. It was proved that, due to
    hardware limitations and the current state of both Ethereum and IPFS, encryption
    was only possible for small to medium files. Ethereum, IPFS and data protection
    techniques will evolve significantly in the future, which will theoretically allow
    for either better encryption techniques or other privacy ones, thus shining a
    bright light for future DApps that require data privacy and protection.


    As previously discussed, DFiles aims to demonstrate whether by encrypting personal
    data, GDPR compliance can be achieved. However, there are other problems associated
    with this approach, such as weak encryption algorithms that previously have proved
    to be highly secure. Examples of these include the MD5 and SHA1 ones (The Open
    Web Application Security Project (OWASP), 2018). For this reason, there is a slight
    possibility that the algorithms used in the most popular blockchains become obsolete
    for short periods of time – where data can be easily decrypted – before being
    replace by another, more secure one.


    In addition to this, quantum computing could very soon become a reality, and for
    a substantial period of time, all data encrypted in most blockchains such as Ethereum
    as well as all the encrypted files stored in the IPFS via the DFiles DApp could
    be easily decrypted. This is, in the authors’ opinion, the biggest threat to blockchain
    technology in the not-so-distant future.


    As for future work in DFiles, instead of using a local IPFS node, the Infura9
    node could be used. This brings several advantages, as hardware limitations are
    minimized, but it brings a new set of problems, such as that files stored in the
    Infura IPFS node have no incentive to be kept for long.


    Another aspect to improve is to deploy the DFiles smart contract to a test network
    such as Rinkeby and update the DFiles DApp to use this deployed smart contract
    instead of the local Ganache private Ethereum Blockchain. An early deployment
    has been done, but further testing is required. The smart contract is available
    in the Rinkeby test network.10


    In short, in this section, the limitations of both IPFS and Ethereum were discussed,
    including DFiles’ future work. However, there are some general conclusions that
    can be taken:


    +   • IPFS file encryption is in its infancy; therefore, there are significant
    hardware and technology limitations preventing its mass adoption.


    +   • Ethereum is a public ledger, and therefore it provides little to no privacy.
    The only possible approach is to encrypt data using other decentralized technologies
    such as the IPFS. Ethereum also has a substantial level of limitations – such
    as no JSON support and the discouragement of some computing loop instructions
    (for, while, for instance) due to high total transaction costs – that impact its
    worldwide adoption.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '+   • Encrypting personal data for GDPR compliance purposes is severely limited
    and possibly discouraged. Both the IPFS and Ethereum should be considered special
    cases of the GDPR to avoid issues with data encryption.


    # ## Conclusion


    In this chapter, first the most important GDPR concepts, in addition to the several
    lawful bases for processing personal data and the several individual rights, were
    presented. Its right to erasure interferes with blockchain immutability. On top
    of this, three scenarios were discussed concerning whether this right can or cannot
    be complied with, followed by a GDPR compliance guideline for Ethereum DApps.


    To test this guideline, a case study was developed: DFiles. It is an Ethereum
    DApp built with a mixture of centralized and decentralized technologies such as
    Ethereum and IPFS. Its main objectives are to understand whether Ethereum (Homestead)
    DApps can comply with this regulation and if protecting personal data by encrypting
    it is feasible or not.


    DFiles also adheres to the principles of blockchain software engineering by following
    the software development life cycle, albeit adapted for DApps. Its core smart
    contract is also explained, from the design patterns implemented to the main data
    structures and functions, in addition to a short presentation of its core features.
    In short, DFiles allows a user to upload and view his submitted files.


    A statistical analysis to assert the feasibility of encryption in compliance with
    the right to erasure was then performed, albeit only for some files because of
    hardware limitations. Two variants of the DApp were created: one with file encryption
    and one without. Uploaded files were divided into four categories: small (1 KB–1
    MB), medium (1 MB–20 MB), large (20 MB–200 MB) and extra large (200 MB–2 GB).


    The total transaction cost in Ether plus the total elapsed time between the user
    clicking the upload button and it being uploaded were then measured in both versions.
    Its conclusions are then presented. In short, complying with the GDPR and its
    right to erasure is only feasible for encrypted files up to 14.2 MB.


    Finally, the limitations of the case study and its future work were explained.


