    This chapter identifies and illuminates the feasible regulatory space to help
    understand how smart contracts for ODR platforms can possibly be regulated and
    embedded within current law systems. The chapter first defines smart contracts
    and explains their relationship to blockchain. It presents their capabilities
    and limitations and how they are different from conventional, more centralized
    approaches, thereby highlighting a unique contribution that is of great help for
    future ODR platforms: the enforced transparency of the dispute process. Based
    on this technical analysis, the chapter proposes an approach how smart contracts
    can be useful in ODR platforms as they are used today, such as the EU ODR platform,
    ⁹ by outlining the principles applying to arbitrators and definitions of access
    control, e.g., the need for access for state actors. The chapter presents possible
    approaches to apply smart contracts to standardize the procedures of lodging cases
    on a large scale and handling disputes in an efficient manner. The proposals are
    based on lessons learnt in the last few years in the development of smart contracts
    on the Ethereum blockchain, currently the only major blockchain that supports
    smart contracts. ¹⁰ The chapter concludes with an analysis of implications for
    future regulation and legal compliance.


    For the purpose of this chapter, we will not need to distinguish between public
    blockchains, which allow anyone to participate, and private blockchains, which
    require some form of permission by an authoritative entity (or group of entities)
    to participate. The possibilities and limitations of smart contracts are largely
    the same for both; the difference is mostly that the permission-based system used
    in private blockchain makes it easier to assign specific roles to certain participants.
    Hence, we limit ourselves to the more general case of public blockchain in the
    following discussion.


    # 2. Blockchain: distributed ledgers, consensus, and trust


    Blockchain is a form of distributed ledger technology: blockchain participants
    maintain a shared, joint view of all transactions that have ever occurred. Classically,
    solving the question how two parties can trust in the validity of a transaction
    would require intermediaries such as banks. Public blockchain replaces trusted
    intermediaries with a collective of a large network of participants that run a
    so-called consensus protocol; anyone can participate. The consensus protocol gives
    strong assurance in the validity of a transaction that the network as a whole
    has accepted. A number of consensus protocols exist. In the case of the famous
    Nakamoto consensus, employed in Bitcoin and in a variant also in today''s Ethereum,
    ¹¹ one can show that as long as a majority of the participants execute the consensus
    protocol faithfully, the entire network eventually will'
