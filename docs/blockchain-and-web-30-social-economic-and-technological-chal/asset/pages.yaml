- pgno: 159
  md: 'That blockchain should be any different is a poorly crafted hypothesis that
    is falsified by the evidence to date. We provide evidence for this argument in
    the empirical case of Bitcoin and a conceptual consideration of Ethereum’s smart
    contracts futures in relation to the decentralising media that have come before
    them. The insight garnered from integrating analysis of the blockchain with historical
    comparators shows that radical communication technologies and practices come to
    integrate into structures of political economy over time. That economy may bend
    away from control in response to these disruptions, but rarely breaks. The bending
    of expansion and contraction at play in blockchain leaves the underlying media
    ecosystem indelibly altered.


    Our discussion addresses how new technologies have origins in radical/emancipatory
    decentralisation philosophies yet are absorbed into contemporary systems while
    changing these systems in complex ways, not least in terms of how labour reorganisation
    and labour markets are reorganised in these contexts. The libertarian, anarchic,
    or indeed any other radical ideological promise built into the deployment of such
    technologies (whether blockchain or the Internet protocols they sit upon) are
    largely subsumed to the structures that they sit in, even as they shift these
    structures in new ways. We thus link blockchain media activity to socio-economic
    practices and potentials concordant with freedom and control.


    The substantive discussion surrounds how patterns of expansion and contraction
    have already been emulated by the exemplar Bitcoin in its markets, forking, and
    regulation. First though, this chapter frames and details the theoretical approach
    that we use to understand blockchain as reflective of Web 3.0 yet situated within
    larger media logics. This chapter also introduces how the radical new media technologies
    of community access television and the Internet turned into corporate regimes
    of control so as to enlighten the discussion that follows. We conclude the chapter
    with consideration of a similar arc of a second exemplar: Ethereum smart contracts.
    Our work on smart contracts presents some concluding remarks that critique blockchain
    as an abstracted media practice in terms of its tracking functions. While currently
    discussed in terms of provenance and transparency in supply chains, smart contracts
    also can be employed mercilessly as forms of visibility that become inescapable
    for their subjects. This, we feel, provides synecdoche for the passive ideology
    that undergirds blockchain.


    # Theoretical approach


    Blockchain technology stands at of the tail end of ‘Web 3.0’ while also pushing
    the definition to its limits. Web 3.0 is often defined in relation to Web 2.0’s
    emphasis on platforms for user communication, decentralised online networks, and
    focus on human-readable content as value (O’Reilly 2005). Web 3.0 emphasises platforms
    for user practices (Fuchs et al. 2010), distributed online networks paired against
    a semantic Internet of Things (Beer 2009),'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'and replacing the focus on content with a focus on machine–readable data for
    value (Russell 2014). Blockchain fits into this schema insofar as it uses digital
    code and networks to distribute value alongside information; facilitates ‘human
    programming’ through smart contracts; represents real-world organisation and governance
    within distributed algorithmic ledgers; and operationalises models of artificial
    scarcity. These traits mediate informational exchange in ways that differ from
    the affordances usually aligned with decentralised digital information as it is
    experienced by most users. Digital networks and Internet cultures typically rely
    on an ever–accelerating capacity to store, copy, and transmit data to invoke new
    ways of organising, prosecuting, and collaborating on informational problems.
    In some respects, blockchains can upend the assumptions of accelerating abundance
    with algorithmic scarcity. For instance, the model of material scarcity baked
    into the additive ‘truth’ of each blockchain or in implementations such as Bitcoin
    that designate the limited numbers of coins to be created differ from Internet
    culture norms and communication forms. This scarcity can create new types of value
    in sharing information and is supposed to encourage market-oriented behaviour
    without need for the shadow of hierarchical regulation.


    The capacity of algorithmically executed contracts or more complex fully distributed
    autonomous organisations (DAO) suggests another way that blockchain reconfigures
    the traditional notions of relationships between user, Internet intermediary,
    platform, and networks. More than having protocols shape practice (Galloway 2004),
    blockchain purports to be the rising phoenix of Lessig’s (1999) code as law –
    where cybernetic architecture at a distance controls through devices of chained
    hashes that, paradoxically, imbue freedom from traditional pressures of market,
    norms, and law. Yet in the DAO we see also the creation of the ultimate cybernetic
    bureaucracy that is unswayed by humanity or humanism and instead doles out what
    we call ‘human programming’. Here we imagine that human users are only able to
    execute the code or forgo remaining in the, otherwise ubiquitous, communication
    chains. In this context of creating a DAO-facilitated system of governance, we
    can readily conceive of a future whereby algorithmic processes have an increasingly
    significant role in governance to the point where people simply become the conscious
    linkages between disparate machinery (Marx 1857/1973). Interestingly, the first
    DAO (based on Ethereum) seems to show there actually is an option for human agency
    – hacking the code. But the hack caused a political crisis for participants’ ideals
    as they undid what the code had brought in a process that nullified the DAO –
    the observation here being that a system that attempts to iron out human ‘frailty’
    becomes vulnerable through very artifice. This case example demonstrates the vulnerability
    of code-based social engineering to the pragmatics of social practice. In doing
    so, it also highlights the pivotal role of social appropriation as an aftermath
    to social adoption. Perhaps it is this aftermath that further disrupts the relationships
    between user, Internet intermediary, platform, and networks.'
