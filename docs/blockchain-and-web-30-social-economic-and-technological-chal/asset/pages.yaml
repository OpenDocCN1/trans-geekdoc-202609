- pgno: 38
  md: 'As with any privately mined commodity, the irrevocable laissez-faire features
    that are embedded within the Bitcoin protocol and other proof-of-work cryptocurrencies
    are defenseless against the kind of monopoly tendencies and speculative spikes
    in value that are difficult to avoid. Bitcoin and other so-called ‘trustless’
    cryptocurrency architectures have merely served to promote neoliberal governmentalty
    by relying on financial subjectivity and speculative futurity as the primary impetus
    for governance on the blockchain.5 However, as we discuss in the following section,
    if we approach the problem of governance differently, sidestepping the Bitcoin
    paradox of ‘trust-in-technicalities’, blockchain can offer possibilities for developing
    and deploying the highly reliable, versatile forms of collective action, engagement,
    and exchange in open networks on behalf of projects opposed to both neoliberal
    capitalism and libertarian politics.


    # Can blockchains shed their neoliberal governmentalty?


    Despite the failure of Bitcoin and other blockchain algorithms to usher in a form
    of governance that truly disrupts the dominant logics of the present era, the
    question remains: can the neoliberal logic of financial and individual incentivization
    be extirpated from the architecture of the blockchain? If, as we have demonstrated,
    neoliberal governmentalty is coded into the protocol of Bitcoin and similar cryptocurrencies,
    then what do blockchains look like without this logic? Does the influence of neoliberal
    governmentalty taint the idea of blockchains, decentralization, or trust, or merely
    their neoliberal variants? What we suggest here is that blockchains, in fact,
    have something significant to offer commons-based projects and might be successfully
    leveraged to inculcate alternative conceptions of trust, exchange, shared governance,
    and the deployment of collective resources. The key, however, lies in a recognition
    of the fact that blockchain architectures are not merely technical designs but
    a series of political choices that always-already entail governance, as we have
    argued.


    Though neoliberal governmentalty has been a staple of the most popular applications
    of blockchain, the problem is not located in blockchains or in the ideas of decentralization,
    ‘trustless’ architecture, cryptography, or a distributed ledger. What taints blockchains
    is our contemporary socio-historical moment. Blockchain applications such as Bitcoin
    were admittedly designed to subvert this contemporary moment, even if, as we argue,
    they ultimately reinscribed neoliberal governmentalty. In fact, this is precisely
    what buttresses the allure of Bitcoin and blockchains: the financial system is
    not neutral and serves some interests and not others. Therefore, even if one disagrees
    with the politics of Bitcoin or insists correctly that Bitcoin was an unsuccessful
    design that has ultimately been appropriated by the very financial interests it
    set out to disrupt, it is nevertheless possible to imagine a commons-based approach
    to blockchain that does not simply reinscribe the logic of neoliberalism.'
