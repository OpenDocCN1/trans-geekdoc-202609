- pgno: 300
  md: 'projects nevertheless tend to attract additional funding in the last stage
    of the campaign. The funding curve of successful projects is therefore U–shaped.
    A study by Etter et al. (2013) outlines the importance of investments within the
    first four hours of the campaign. Early contributors seem to be crucial also in
    the ICO space, probably due to information cascades (Lee et al., 2018).


    **Number of early backers:** In the reward crowdfunding space, a study by Colombo
    et al. (2014) outlines the importance of the number of early backers as an important
    signal of successful crowdfunding campaigns. Another study on Swiss-based reward
    crowdfunding conducted by Beier and Wagner (2016) confirms the importance of early
    backers on the overall crowdfunding success. Finally, a study by Davies and Giovannetti
    (2018) highlights the importance of the number of early backers in the first sixth
    of the campaign and its positive effect on reward crowdfunding success.


    **Average analyst rating:** In the case of blockchain-based crowdfunding, independent
    analysts are taking part in the evaluation of such offerings. A study by Lee et
    al. (2018) finds that a high average rating by these analysts is an important
    signal to investors and can lead to a more successful ICO campaign. In the world
    where there is an absence of traditional underwriters, independent analysts seem
    to contribute when dealing with information asymmetry. In line with the previous
    finding, Fenu et al. (2018) find that a higher rating on ICOBench has a positive
    influence on ICO success.


    # White paper quality


    **White paper availability:** A working paper by Cerchiello and Toma (2018) states
    that the presence of a white paper has a positive effect on ICO success. In contrast,
    a study by Adhami et al. (2018) states that the probability of success of an ICO
    is not affected by the availability of a white paper at all. The availability
    of such a document could be unimportant because the white papers have generally
    not been audited and aren’t bound by any legal protection.


    **White paper content:** A study by (Fisch, 2018) states that longer white papers
    have a positive effect on ICO success. A poor white paper may harm an ICO, and
    if that’s the case, ventures would be better off having no white paper at all
    (Fisch, 2018). With respect to the content, more negative and specific words appear
    with higher frequency in unsuccessful ICOs (Cerchiello and Toma, 2018). Offering
    a more detailed white paper increases the chances of collecting more funds and
    of having a tradable token after the ICO finishes (Amsden and Schweizer, 2018).


    **Multi-language white paper:** Projects that offer multi-language white papers
    and websites are more likely to be completed successfully (Lee et al., 2018).
    This could be linked to the reduced language barriers that those projects face.
    It remains unclear if such an approach will lead to expansive regulatory countermeasures
    in some countries in which the tokens will be ranked as securities in the near
    future. Offering material in certain languages could increase the suspicion that
    projects are directly targeting certain countries.'
