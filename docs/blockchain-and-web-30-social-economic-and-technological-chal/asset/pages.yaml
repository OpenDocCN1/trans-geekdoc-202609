    Figure 13.2 Contract functions using SmaCC-Solidity


    should also be supported by our implementation. We used Etherscan to access Solidity
    contracts that were publicly available with their source code. All such contracts
    were correctly recognized by the official parser. Therefore, our evaluation was
    to verify if our implementation could parse them as well.


    At the time of the experiment (August 2017), Etherscan had approximately 2,700
    verified contracts in its database (in August 2018, the number of contracts was
    more than 40,000). From those 2,700, we selected only unique contracts from Solidity
    version 0.4.x, for a total of 1,175 contracts. Our implementation successfully
    parsed all 1,175 contracts. Consequently, we can claim our parser recognizes the
    same language artifacts as the official one.


    # Related work


    We selected related work from two main topics: parsing conflicts and parser generators.


    Isradaikul and Myers [IM15] describe the difficulty in solving grammar conflicts
    with LALR parser generators. They propose an algorithm that generates better counterexamples
    for LALR parsers. A counterexample shows a parsing scenario that causes an ambiguity
    conflict in the LR method. Such scenarios help developers diagnose the conflict’s
    source and identify problems in the grammar specification. The authors implemented
    their algorithm in'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'Java as an extension to the CUP parser generator, and they also evaluated their
    approach in 20 grammars against a state-of-the-art ambiguity detector. Their algorithm
    usually finds more counterexamples in less time than the compared techniques.


    Passos et al. [PBB07] proposes a methodology to resolve conflicts in the LALR
    parsing method. The authors describe the challenges for handling conflicts without
    changing the defined language. They used YACC to generate a parser for the Notus
    language to illustrate the difficulty of resolving conflicts for LALR(1). The
    authors created a tool, called SAIDE, based on their methodology, which is an
    improvement over the regular methods available to handle conflicts in LALR parsers.


    We are going to give a brief analysis of some well-known parser generation tools.
    SmaCC [BLGD17] is the parser generation tool we chose for this research. SmaCC
    can generate either LR(1) or LALR(1) bottom-up parsers. YACC [Mer93] is also a
    bottom-up LALR(1) parser generator. The original YACC was developed in C for Unix
    systems, but now we have implementations of it in several other languages. ANTLR
    [Mil05] differs from the previous tools because it is a top-down parser generator.
    ANTLR creates predictive LL(k) parsers, which is less sensitive to grammar irregularities
    than LR(1) and LL(1) parsers. There are implementations of ANTLR for languages
    such as Java, C++, C#, JavaScript, Python, and others. Unfortunately, as far as
    we know, there is no implementation of ANTLR for Pharo. Finally, PetitParser [BCDL13]
    is a scannerless parser generator that relies on parsing expression grammars.
    PetitParser is integrated with Moose, which facilitates its use on Pharo. The
    main problem with PetitParser is it does not read a grammar specification, and
    we must write the grammatic expressions using the PetitParser language.


    # Deployed smart contract analysis: inspection


    Opaqueness is the major issue to analyze contract data [BRDD18b]. Smart contracts
    are opaque in the sense that, once they are deployed in the block-chain, it is
    very difficult to verify their internal state at run-time (i.e., the state stored
    in the contract defined by its internal attributes). By contrast, nowadays any
    programming language offers simpler ways to inspect object data. Developers use
    such inspection to access run-time data during development or maintenance activities.
    Similarly, developers could benefit from smart contract run-time inspection to
    verify the currently stored data. Moreover, from a business perspective, companies
    could use contract inspection to help clients verify and understand the information
    that is actually stored in the contract.


    The difficulty of inspecting contract data is not a widely known problem [BRDD18b].
    Currently, we have few tools to inspect contract information. Alternatively, developers
    resort to other practices to acquire a contract’s internal state, such as creating
    getter functions to access data. For this reason, it is'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'important to be able to develop tools that can be used for inspecting internal
    attributes. Moreover, the general concern is that a developer should be able to
    see the values stored in his own contracts.


    Therefore, in this context, inspecting contract attributes is not only important
    but necessary for developers working with smart contracts.


    # **Challenges**


    There are many challenges to pierce through the opaqueness problem and reveal
    contract information.


    +   - **Binary and incomplete specification.** From the technical aspects, we
    only have the Ethereum API to access a binary representation of the contract.
    The first challenge we faced is an *incomplete* specification of the contract
    encoding performed by the Solidity compiler [Eth18c].

