    # **Production (and circulation)**


    The first and most obvious failure of Bitcoin has been in relation to the claims
    made about Bitcoin''s decentralized production and distribution. As Böhme et al.
    (2015) point out, there are several levels in the Bitcoin network where there
    exists significant potential for centralization: currency exchanges, digital wallet
    services, and mining pools.³ The first two of these are, strictly speaking, exogenous
    to the core protocols of Bitcoin and other cryptocurrencies since there is no
    practicable method of ensuring that users avoid the use of currency exchanges
    to swap between crypto– and fiat currencies or to forgo the convenience of relying
    on online wallet services that offer a host of security functions above and beyond
    the base cryptocurrency client. And to the chagrin of cryptocurrency''s neoliberal
    advocates, such currency exchanges and online wallets offer a lucid example of
    how even in the most free–market of online environments, monopolistic tendencies
    quickly establish themselves because early entrants gain a significant advantage
    and create immense barriers to entry for latecomers.


    Mining cartelization, however, has been an endogenous and intractable problem
    for Bitcoin''s champions. Although anyone in theory can become a miner, the chances
    of solving a block and being rewarded with bitcoins is negligible for the individual
    miner given the overwhelming competition in processing power they face. Moreover,
    the hashrate required to profitably mine Bitcoin has long since rendered personal
    PCs obsolete, and the vast majority of mining pools now rely on application-specific
    integrated circuits (ASICs), most of which are now located in China and other
    emerging market economies (EMEs), given the relative affordability of both hardware
    and electrical costs there. The costs associated with such set-ups has placed
    the necessary hardware for Bitcoin mining beyond the reach of most individuals,
    and the only recourse for most new entrants into the market is to rent a portion
    of an ASIC-based mining center''s processing power. Even then, it can take years
    before such individuals see any return on their investment, if ever.


    The cartelization of mining underscores the fact that trust is ever present in
    blockchain systems and vital for cryptocurrencies to function. Mining cartelization
    presents an inherent problem to proof-of-work blockchains, since any pool that
    acquired over 50 percent of the hashrate of the entire cryptocurrency network
    could, in theory, ''fork'' the blockchain to its advantage and begin to double-spend
    cryptocurrency tokens, rendering the blockchain illegitimate and destroying trust
    in the currency. But as Dowd and Hutchinson (2015) suggest, the monopolistic tendencies
    of cryptocurrency mining are theoretically absolute, since each individual miner
    would be best off contributing to a single mining pool, where the probability
    of success for all mining pool members'
