    # Related work


    In this section, we discuss some related work on blockchain research focused on
    search and navigation. Tools and implementations (e.g., Presto) that were not
    originated by research are not presented here.


    Morishima and Matsutani [MM18] propose a new way to search for blockchain information
    by using GPUs. They argue that blockchain full nodes could turn into a bottleneck
    for the platform if the search performance is not improved. The authors evaluate
    the performance of their approach against the existing practice and other methods
    and conclude that their proposal throughput is 3.4 times higher than the second
    highest approach. Although the work of Morishima and Matsutani is about searching
    blockchain data, it has a different purpose than Ukulele. Ukulele was designed
    to help users search for complex data. On the other hand, Morishima and Matsutani
    designed their approach to improve the performance of searching for data in blockchain
    nodes. The similarity is that both research deals with the internal structure
    of the blockchain and searching for data in that platform.


    Ruta et al. [RSI+17] discuss a new semantic-enhanced layer for blockchain platforms
    focusing on the supply chain application domain. They propose a framework for
    online object discovery to implement their layer on a Hyperledger blockchain.
    Their approach adopts a semantic matching between queries and objects, which allows
    users to find supply chain information more easily. Unlike Ukulele, there is no
    query language. However, it does use semantic information to fetch blockchain
    information. Ukulele provides a rich syntax for querying information, but it does
    not use semantic-enhanced objects and information to improve the search.


    # Discussion and related work


    In this section, we discuss our future research and tools, and then we present
    related work on blockchain analysis platforms and tool suites.


    # Future research and tool development


    As a platform, SmartAnvil should support a large range of analysis. We are focusing
    on the foundations of the tools. We see the following topics as the next components
    around SmartAnvil.


    Metrics. It is not possible to control what you do not measure, and this statement
    is the basic wisdom on why we need to use metrics [Hev97]. Metrics are useful
    to assess the internal quality of a software as well as the productivity of the
    development team. Since the ''90s, there has been a plethora of proposed'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'software metrics [LH93, CK94, LK94, HM95, BMB96, Hev97, TNM08]. The reason
    for so many different metrics is because specific domains or characteristics require
    measurements tailored for their particular needs. Usually, applying a metric designed
    for one domain to another leads to a mismatch or incompatibility. For instance,
    the domain mismatch led to the “adaptation” of procedural programming metrics
    for the object-oriented paradigm.


    Due to the extremely fast growing pace of smart contract usage, in this new software
    paradigm, measuring code quality is becoming as essential as it is in out-of-chain
    software development. However, traditional software metrics do not capture the
    specific aspects of smart contracts. Therefore, we need metrics designed for smart
    contracts.


    **Gas estimation.** In the Ethereum platform, any transaction that changes the
    internal state of a contract is charged a special resource called Gas [Eth18c].
    The name was inspired by the view that this resource is the fuel for running contracts
    [Eth16]. Therefore, Gas units correspond to the execution of computation instructions.
    The idea is to avoid infinite loops (and the halting problem), encourage efficient
    code, and make users pay for the computation resource they used.


    Even though the unused gas is refunded back to the user, optimizing this resource
    is the key to having a transaction approved quickly. Since the miner is awarded
    the used gas cost, he/she will prefer to mine transactions that optimize his/her
    gains. In this context, a better estimation of the gas by the user may encourage
    miners to process such a user’s transaction.


    Estimating how many gas units a contract function is going to require is not a
    simple task. The Remix IDE gives an estimate if the function does not contain
    loops or external calls. Consequently, Remix is not reliable to estimate gas on
    any function. Therefore, we require better estimation tools to assess the amount
    of gas consumption.


    **Security recommendations.** The number of smart contracts is growing at a fast
    rate, and developers are not yet accustomed to code in this new environment. Bad
    programming practices in a smart contract can turn into terrible security flaws
    [DMO+18]. For example, the infamous “DAO attack” was caused by insecure coding
    practices on the contract that allowed an attacker to drain approximately 50 million
    dollars’ worth of cryptocurrency [LCO+16, TVI+18]. As an analogy, we can think
    of web applications that had SQL-injections flaws, which would be simple to avoid
    if developers designed and adopted a more secure coding practice.


    Most security flaws in smart contracts can be traced to poor coding that could
    be avoided if the developer had more expertise with the environment and the programming
    language. A simple and elegant way to give such expertise to developers is to
    create a recommendation system that warns developers of problematic code and suggests
    a better way to accomplish the same program. In this context, we claim it is important
    to give security recommendations for contract developers.'
  merge: -1
  img_proc: true
