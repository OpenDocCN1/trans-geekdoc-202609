    # The short survey


    +   1 What can you tell me about your experience using the Global Tal Registry?


    For those who were unfamiliar with business practice, this simplified rights management
    system was a universally positive experience. Perceived benefits included the
    simplicity of the process combined with the ability to use it as a test bed team
    management structure. Teams that had already incorporated as a limited company
    found the Tal Registry’s more informal system less useful for their purposes.


    +   2 Are you aware it is intended to be a blockchain registration system? Would
    blockchain registration change your decision to use it again?


    Only two people were familiar enough with blockchain technologies to attempt to
    answer this question. One said they liked the idea of it being secure and anonymised.
    Another thought blockchain was used for criminal transactions, and they couldn’t
    see why it would be relevant for creative IP registration.


    +   3 What are your thoughts about also potentially sharing (anonymised) information
    on workflows, platforms, working processes and times with the broader gaming community
    using these sorts of secured, automated technologies?


    Perhaps reflective of the open-source tradition in the games industry, all bar
    3 out of 36 respondents thought this was a good idea in principle. Perceived benefits
    included the ability to gain an overview perspective regarding best practice,
    as well as the potential to hold the industry more accountable in terms of realistic
    working hours and crunch time demands. Reservations focused upon the risk to competitive
    advantage or fears regarding the loss of personal control and the risk of comparative
    critique, which underlines the potential importance of cooperative ownership of
    the data but may also reflect a lack of familiarity with this approach.'
