- pgno: 133
  md: 'decentralized blockchain projects. The recentralization (Gencer et al., 2018)
    of mining power proves to be not only a practical issue but also a political one.
    Building technological resistance to centralization of miners has become an integral
    part of new cryptocurrencies, demonstrating their belief that decentralization
    on the consensus level and above is fundamental to the design of the DLTs. For
    example, the cryptocurrency Monero opted to change its consensus validating algorithm
    every six months to resist ASIC miner centralization. These technological choices
    ultimately correspond to the decentralization ideals of the techno-social assemblage,
    while also determining the internal power balance of the community and the success
    of the project.


    With the introduction of smart contracts, the logic of decentralization reached
    the level of blockchain governance itself. This was a development to be expected:
    despite all the ideological commitment to decentralize social processes through
    technology, DLT development remained heavily centralized in terms of software
    developers and their governance mechanisms. The communities behind the code were,
    and many still are, weakly organized; they tend to lack formal institutions and
    processes; they often operate in the state of anarchy or under the rule of benevolent
    dictators; and in absence of more sophisticated conflict resolution mechanisms,
    they often have to resort to splitting (forking) the code and the networks to
    resolve their ideological or systems design differences. Consequently, the governance
    of DLTs turned out to be of central importance (de Filippi & Loveluck, 2016).
    The question that in these contexts emerged was whether the production of DLTs
    can be governed using DLT technologies themselves: is it possible to govern, in
    a decentralized manner on a decentralized technology, the production of that decentralized
    technology? In response, multiple efforts started to work on what is called the
    problem of “on-chain governance”. For example, the Tezos blockchain implements
    a decentralized modular governance model for smart contracts and decentralized
    applications that would permit more coordinated “radically decentralized protocol
    forks” (Goodman, 2014). Similarly, decentralized applications like Aragon offer
    modular decentralized organization models that can be used by companies developing
    their blockchain project or by decentralized autonomous organizations. These additional
    layers address the goal of decentralization by inserting mechanisms that would
    resist centralization tendencies on the governance and decision-making levels.


    The efforts to implement automated, decentralized decision-making mechanisms for
    the governance of blockchain-based applications and organization have provoked
    a number of conflicts between ideas of decentralization and system design. As
    will be shown later on, examples of these controversies can be found on the block-size
    debate for Bitcoin, the Tezos foundation lawsuits, and the Ethereum DAO hack (DuPont,
    2017). The ideology-driven decentralization maximalist approach could only be
    realized at the expense of other important values, such as technical efficiency,
    governability, or social recognition and diffusion. Take, for example, the now
    infamous and still ongoing'
