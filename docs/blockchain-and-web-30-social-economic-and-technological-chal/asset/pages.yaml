- pgno: 96
  md: '# Expressivity


    In this context, expressivity is both an individual and group concern. Just as
    digital environments mediate the participatory level of “influence [upon] the
    form or content” (Nakevska, van der Sanden, Funk, Hu, and Rauterberg 2017: 97),
    so too the task at hand, the team collaborating on that task and the tools employed
    to undertake that collaboration will all inform and influence that process.


    Automated working environments act like assembly spaces. For example, the sort
    of game-play that can be produced using a game development software tool suite
    like Unity, a self-described ‘game engine’, is limited by the design of the Unity
    software (UnrealForum 2018). Working within these limits, game developers can
    still build and personalise seemingly endless varieties of two-dimensional and
    three-dimensional games. Thus, the limits of the system can either be experienced
    as creative aids or as frustrations, depending on the aims and experience of the
    maker.


    In terms of expressive interactions, the more meaningful those mediated actions
    or choices are within that context, the more “agency” (Murray 2001: 394) that
    users are said to enjoy. But what sorts of meaningful agency exists in automated
    collaborations, “characterized by the fact that their core capability is algorithmic
    coordination” (Roio and Jelincic 2017), such as data sharing and proof of work?
    For some, agency is only possible when there is also some sense of personal control
    over that data. For example, the quantified self-movement embraces personal data-monitoring
    practices such as behaviour monitoring, location tracking, medical self-diagnostics
    and personal genome sequencing as a form of self-knowledge (Wolf 2010; Swan 2013).
    For others, agency equates to the chance or challenge to game the system and make
    the numbers work to personal advantage. For instance, the appeal of big data for
    corporate advantage could be classified as the appeal of uncovering the hidden
    laws or patterns in play and responding accordingly. Both of these aspects need
    to be considered in the design of any data-sharing application.


    # The study


    For this study, the Global Tal Registry tool was tested during the EGX Games Expo.
    Billed as “the UK’s biggest game event”(EGX 2018), EGX is a video game trade fair
    that gives consumers the chance to play over 200 games ahead of their official
    release and has attracted over 80,000 attendees (Batchelor 2017). During the 2018
    EGX event, 18 hopeful Franzfuser teams, each consisting of four or more budding
    games makers, gathered to show a demo game to prospective publishers and gaming
    enthusiasts, whilst also competing for further development funds.


    The UK Games Fund coined the term Tal with reference to the dual meaning of the
    word talent, first in terms of who does the work and also with reference'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'to the ancient currency of Talents. Much like shares in a company, Tals are
    a much simpler distribution of shares in creative IP. The Tal system is divided
    between those stakes that offer voting rights (silver Tals), or only revenue shares
    (copper Tals), or both. There is also a facility for external dispute resolution
    with no revenue entitlement (The gold Tal, a facility which the UK Games Fund
    holds at this point).


    In order to explore the broader implications and logistics of such an application,
    an interview-based, qualitative approach was chosen. This allows for in depth
    analysis of participant responses and gives participants more freedom to express
    their unique perspectives. Combined with observation of a Tal allocation meeting
    and hands-on social network analysis conducted by a selection of four teams, this
    study provides insight into the participatory experience of mediated collaboration,
    linked to the prospect of automated authentication.


    During the four-day 2018 EGX event held at Birmingham''s NEC Stadium from September
    20–23, a series of interviews were conducted with a sample of 36 young games makers
    (those on location at the Tranzfuser stand, available to speak with the researcher
    and familiar with the Global Tal Registry system) regarding their IP management
    approach and data-sharing practices. These opinion-based samples were then supplemented
    by an in-depth social network analysis study conducted with four members of four
    select Tranzfuser teams. Those four teams were chosen according to location (two
    were based in Scotland, where this study originated) and context: two of the teams
    had already formed a limited company prior to the competition. Also, at least
    two of these teams had experienced challenging line-up changes prior to the competition.


    Four members of each sample team were interviewed individually, apart from the
    other members of their team, and asked to represent the demo development process
    both in terms of contribution and communication flows using a hands-on method
    of social network analysis known as net-mapping developed by Schiffer and Hauck
    (Schiffer and Hauck 2010). Net-mapping generally involves visualising and making
    explicit those networks, people and things that can help a team or individual
    to achieve their goals. The process also measures the perceived reach of that
    influence. During interviews, participants first identify relevant actors of influence,
    then how and whom they influence (e.g., through fans, commissions, feedback, inspiration,
    social acceptance, etc.) and then the value or strength of their influence (articulated
    in the height of representative influence towers). In this study, the net-mapping
    technique was adjusted to demonstrate the contribution of team members to the
    development of a particular demo rather than focusing upon the influence of external
    networks. To complete the process, goals and conflicts were strategically compared
    and discussed, and communication flows mapped.


    For the purposes of this study, the net-mapping method provided an ideal way to
    help articulate team work contributions. One of the key aspects of emerging technology
    applications that this research focuses upon are the potential tensions between
    formal versus informal working methods. Thus, this method was'
