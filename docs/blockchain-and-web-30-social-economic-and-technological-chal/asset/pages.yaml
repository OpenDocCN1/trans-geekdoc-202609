  md: '# Bitcoin expands – the hope of a chain


    From a social lens, cryptocurrencies represent emerging financial technologies
    that are imbued with overlapping community values of decentralised peer-to-peer
    exchange and the use of encryption technologies to support user privacy and (pseudo-)anonymity.
    Cryptocurrencies such as Bitcoin are a recent sociotechnical innovation designed
    by their developers to disrupt the existing monetary system. The creation of Bitcoin
    is attributed to an anonymous group of developers (Nakamoto 2008), with its social
    uptake dated from 2009 (Maddox et al. 2016). The origin community contributing
    to the development and social uptake of cryptocurrencies is described by Maurer
    et al. (2013) as based upon libertarian politics, and they argue that Bitcoin
    combines practical materialism with a politics of community and trust that puts
    code front and centre. In this way, we can understand cryptocurrencies and the
    blockchain as materialising the ‘rules of engagement’, where code becomes law.
    Originating from the cypherpunk movement, this self-organising network of people
    has come together through the development and adoption of open-source cryptocurrency
    software such as which underpins Bitcoin. The social profile of members, Maurer
    argues, consists of a diverse network of interests incorporating ‘goldbugs, hippies,
    anarchists, cyberpunks, cryptographers, payment systems experts, currency activists,
    commodity traders, and the curious’ (Maurer et al. 201, p. 2).


    Similarly, Dahlberg (2010) observes the origins of the values underpinning the
    cryptocurrency community as espoused by the cyberlibertarians of the 1990s. In
    an expansionist view of an emergent, peer-to-peer technology of the time, they
    idealised the Internet as a space for democratic culture autonomous from the state
    and other forms of centralised control. This version of ‘democracy’, Dahlberg
    (2010, 333) argues, saw the subject pursuing personal liberty to satisfy private
    interests through technologically mediated networking and access to free information
    flows and individual decision making free of bureaucracy. The resonance between
    these ideas and the function of the blockchain and cryptocurrencies are clear;
    these values were articulated in the early adoption cases of Bitcoin, such as
    its use as a pseudonymous digital currency with which to buy drugs on cryptomarkets
    (Maddox et al. 2016; Barratt et al. 2016). However, Dahlberg (2010, 333–337) argues
    that Bitcoin is a technology engendered through the values of cyberlibertarianism
    2.0. Dahlberg’s definition of cyberlibertarianism 2.0 sees users as ‘cybernauts’,
    a term very similar to the psychonaut drug-use cultures engaging with cryptomarkets,
    which leverages off the metaphor of travellers to outer space who move beyond
    the reach of state regulation and social control and become responsible only to
    themselves. This autonomous agent was often articulated within the cryptomarkets
    through a notion of personal sovereignty. These sovereign astronauts of the Internet
    and perceived users of cryptocurrencies operated as, in Dahlberg’s words, ‘DIY
    prosumers freed from external constraint’. This freedom from'
