    # ## 5.2 Errors in smart contracts


    Even though code is unambiguous, smart contracts can still contain errors. Two
    kinds of errors can occur. The first kind of error we need to consider is when
    the developers of the smart contract misinterpret the (legal) meaning of ODR processes
    and implement them incorrectly. The second error occurs when the creators’ interpretation
    is correct, but their use of the programming language results in an exploitable
    bug: seemingly correct code can be the target of an attack such that the attacker
    can “take over” the smart contract, i.e., cause it to run incorrectly and execute
    steps that are controlled by the attacker and not intended by the original developer.
    Errors of the second kind can often, but not always, be detected by automated
    tools – a variety exist, e.g., the one by Brent et al.,²⁸ Kalra et al.,²⁹ or Luu
    et al.,³⁰ to name a few. Theoretical limitations make it impossible to universally
    identify all possible errors. As of today, errors of the first form cannot be
    detected automatically at all as no machine can reason about the correctness of
    a mapping of a legal interpretation to code. This is still a task for humans.


