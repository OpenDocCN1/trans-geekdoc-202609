- pgno: 219
  md: 'that are important for a blockchain remote inspector: privacy, extendibility,
    pluggability, consistency, reusability, and instrumentation. We detail the characteristics
    as follows:


    +   - **Privacy:** Inspection should not breach or compromise data privacy by
    exposing data to unauthorized users. When considering smart contracts, a lack
    of privacy is dangerous, as it could be exploited by malicious users to acquire
    illicit advantages and resources.

    +   - **Extendibility:** The inspector can be extended for other technologies.
    Ideally, a debugger or inspector should rely on a middleware that is extensible.
    For smart contracts, the inspector should be extensible over different smart contract
    languages and blockchain technologies.

    +   - **Pluggability:** The inspector can be used on existing objects without
    the need to re-instantiate the objects or the system. For contracts, this means
    we can inspect existing deployed contracts without any dependency on the contract
    side or the need to redeploy the contract. An unpluggable approach has the disadvantage
    of requiring the redeployment of a contract, which has nontrivial transactional
    costs.

    +   - **Consistency:** The representation used by the inspector must reveal the
    information in a consistent manner, i.e., the inspection must reflect the current
    state of the deployed contract.

    +   - **Reusability:** The inspector can be reused for different contracts. Lack
    of reusability would require a developer to spend time redefining the inspection
    for each individual contract.

    +   - **Instrumentation:** The inspector can alter the semantics of a process
    to assist in debugging. Basically, this is the mechanism to halt the process and
    inspect it at that point (e.g., breakpoints and watchpoints). This characteristic
    is not possible in blockchain platforms, as we cannot modify the deployed contract
    code to halt a function in the middle of its execution in the blockchain.


    We analyzed SmartInspect and two other inspectors (Remix and Etherscan) according
    to the aforementioned characteristics for inspectors. We also compared two practices
    for accessing contract data: ad-hoc decoder and getter methods (Table 13.1).


    Table 13.1 Related techniques comparison


    | Characteristic | SmartInspect | Remix | Etherscan | Decoder | Getter |

    |---|---|---|---|---|---|

    | Privacy | Yes | Yes | No | Yes | No |

    | Extendibility | Yes | No | No | No | No |

    | Pluggability | Yes | Yes | Yes | Yes | No |

    | Consistency | Yes | Yes | Yes | Yes | Yes |

    | Reusability | Yes | Yes | Yes | No | No |

    | Instrumentation | No | No | No | No | No |'
