- pgno: 41
  md: '# Incentivization


    By scaling at the community level and using share values and goals as the foundation
    of blockchain architecture, incentives do not have to mimic the speculative and
    financialized logic of established cryptocurrencies, which, as we have seen, merely
    replicate a mode of neoliberal governmentalty. Moreover, there is no need to view
    cryptocurrencies and established forms of money as mutually exclusive. For example,
    some common-based blockchains have been designed as ‘complementary currencies’.
    These currencies are designed to supplement instead of replace national currencies
    and aim to incentivize spending within local communities. The SantaCoin, for instance,
    is used at the Santarchangelo Festival. It allows festival goers to trade Euros
    into the SantaCoin and to spend their coins at participating local vendors. The
    idea is to keep money internal to the local community, building trust, networks,
    and solidarity in the process. According to the designers, the idea is to build
    “welfare from the ground up” (www.santarcangelofestival.com/en/santacoin/, 2018).
    This reminds us that money is not merely a means of exchange but an embodiment
    of social relations, which is never neutral in its design. By carefully choosing
    how we design monetary architecture – which is now possible at the local level
    through blockchain technology – new incentives can be established that foster
    collective values and relationships which run counter to the dominant logics of
    neoliberalism. This revolutionary potential in commons-based organization is what
    has commons-activists, left movements, and participatory democracy advocates so
    excited about blockchains, and with good reason.


    # Conclusion


    Social investment in blockchain technology is critical at this precise moment
    in time because it remains outside of the purview of established institutional
    interests and state control, and its potential is still boundless. Hype surrounding
    blockchains has reached fever pitch over the past few years based largely on the
    notion that the technology is inherently counter-hegemonic and disruptive of the
    state and established fiat currencies (Herian 2018). However, as we have shown
    here, there are substantial limitations to the revolutionary potential of blockchain
    technology given the dominance of libertarian blockchain architectures and their
    implicit adherence to neoliberal logics and incentives of financialized competition.
    What underlies these limitations is the fundamental belief that blockchains are
    inherently trustless and therefore free of governance. But as the history of Bitcoin
    and other cryptocurrencies has shown, by turning the spectre of homo economicus
    into an organizing principle, such blockchains have merely reproduced the worst
    traits of neoliberal governmentalty and have done little to undermine the tendencies
    towards cartelization and monopoly control. In short, cryptocurrencies with global
    ambitions of revolutionizing the established order have served as speculative
    and highly volatile digital assets, turning blockchain technology into a grotesque
    platform for financial profiteering.'
