  img_proc: true
- pgno: 211
  md: '# Illustrative example


    Usually, someone uses a parser when he/she needs to perform static analysis on
    the source code. Let’s suppose a developer wants to create a token contract. Roughly
    speaking, a token is a custom form of cryptocurrency managed by a contract. A
    token could represent loyalty points, bonds, game items, etc. In this scenario,
    the developer wants to first understand a well-used-to-ken before coding his own.
    In this example, the developer gets the GolemNetworkToken (address: 0xa74476443119A942dE498590Fe1f2454d7D4aC0d)
    contract code and decides to build a visual representation of it. By using our
    parser and some classes from the Roassal package [Ber16], a few lines of code
    (Listing 13.1) is all it needs to build a simple visualization.


    # Listing 13.1 Visualization using SmaCC-Solidity


    ```

    1 ast := SolidityParser parse: sourcecode.

    2 b := RTMondrian new.

    3 b nodes: (ast sourceunits) forEach: [:contract |

    4     (contract className = ''SolContractDefinitionNode'')

    5     ifTrue: [b shape box color: Color black.

    6     b nodes: (contract statements select:

    7     [:stt | stt className = ''SolStateVariableDefinition'']).]

    8     b shape box color: Color gray; size: [:f | f source

    9     lines size * 3].

    10    b nodes: (contract statements select:

    11    [:stt | stt className = ''SolFunctionDefinitionNode'']).]

    12   b.

    ```


    In Listing 13.1, first we get the AST from parsing source code (line 1). Then
    we create a new Roassal visualization [ABC+13] where each contract is a big gray
    box (lines 2–4). Inside each contract box, we get the state variable definitions
    (i.e., contract attributes) and create black boxes representing it (lines 5–7).
    Moreover, for each function, we also create a gray box inside the contract, and
    the size of the function is related to its lines of code (lines 8–10). Finally,
    we define a standard layout for the visualization (line 11) and “return” the visualization
    object for show (line 12). The resulting visualization shows each contract on
    a big box, with smaller boxes inside representing attributes (in black) and functions
    (Figure 13.2).


    # Evaluation


    For comparison, we verified if our parser could recognize the same Solidity contracts
    as the official parser. It is reasonable to assume that the official parser is
    the correct implementation. Therefore, any contract parsed by the official'
