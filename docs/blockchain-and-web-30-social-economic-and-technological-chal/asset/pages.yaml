  md: 'itself is less the issue than is the potential it introduces for one aspect
    of the networked self (fluidity, fractionalism, for example) to exclude the other
    (form), along with the value judgements being challenged as a result of this process.
    As rules for encoded, procedural engagement, blockchain technologies also create
    new procedural possibilities, such as financial and social value reconfiguration
    in collaboration with other variable conditions like the decision to tokenise
    or certify particular behaviours within the supply chain. By privileging a more
    collaborative, sector approach, public blockchain technologies may therefore require
    substantial business model transformations. Despite the challenges that such disruptions
    pose, the efficiencies gained as a result of the ability to break down data silos
    and support consortium actions via data-sharing technologies are driving these
    efforts (Olnes, Ubacht, and Janssen 2017).


    # Context


    Ironically, blockchain technologies create consensus on the back of self-interest
    and competition. For example, Bitcoin is still the most secure of all the cryptocurrencies
    due to a costly and energy-consuming proof-of-work authentication process driven
    by the promise of financial reward (O''Dwyer and Malone 2014). Miners compete
    to be the first to solve a complex, cryptographic puzzle in order to win the allotted
    Bitcoin cash reward (the transaction fee). Their problem-solving efforts act like
    a de facto timestamp that proves these transactions were recorded on this block,
    in this time period. The new block is given a cryptographic hash number ID that
    includes the hash of the previous block, and in this way each block in the chain
    is authorised and linked to the previous block in turn. Over time these cryptographic
    puzzles have become harder and demand more computing power to solve. In other
    words, blockchain technologies can successfully coordinate self-interest for shared
    benefits, but they are not by their nature public services, and they need to be
    designed accordingly.


    Automation is a valuable tool. It can save time and offer additional computation
    enhancements, such as GPS navigation, as much as proof of work. The challenge
    is how to best integrate automation and humanism within digitally mediated creative
    contexts. The gaming industry, which is commercialised and highly mediated but
    also motivated by collaboration and creativity goals, thus provides a helpful
    case study of the ways that formality, informality, independence, interdependence,
    machines and people might coexist.


    Whilst the blockchain is ingenious precisely because it coordinates self-interested
    profit motives, nevertheless, as the team from UK Games Fund points out in their
    “Tal Stories” white paper (Durrant and Hogarth 2016), ingenious is not the same
    as astute. As yet, no level of automation can substitute for a basic team agreement
    at the outset. Teams still need to discuss and decide responsibility for prior
    work, as well as the alignment and/or differentiations between personal and collective
    visions, “so a real ‘smart contract’ would need to read minds if it could automate
    this initial step”(Durrant and Hogarth 2016: 3).'
