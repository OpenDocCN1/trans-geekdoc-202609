  md: 'The hope that has often been expressed for smart contracts is that they can
    be used to define the terms, rules, and penalties of true, legal contracts *and*
    also automatically execute and enforce the associated obligations, with specific
    events triggering transactions. This is often referred to as “self-enforcement”.
    They can also help to simplify transactions where more than one party has to sign
    off in order for it to become valid. However, it is important to understand that
    smart contracts are still just computer programs, i.e., a collection of algorithms.
    This allows them to be utilized as means for payment, clearing, and settlement
    processes, which define ways to transfer funds and clear and settle securities
    and commodities, as well as their derivatives.<sup>17</sup> All of these are easily
    described algorithmically. In principle, this means that the procedures of handling
    dispute cases can also be encoded in a smart contract. However, smart contracts
    cannot be used to, e.g., reason about the validity of a claim if this requires
    interpretation of law. Furthermore, smart contracts always need to be invoked
    by transactions, which in turn requires the existence of a blockchain participant
    who can create such a transaction. At the time of writing, no blockchain system
    allows external events to be defined that would automatically trigger the creation
    of invoking transactions – some participant must always be involved.


    A distinctive feature of smart contracts is that invoking a method requires a
    form of payment for the execution of the method. In Ethereum, for example, the
    operations defined in a smart contract add up to a total amount of “gas” that
    is required – “gas” here being an internal unit that measures the cost of execution.
    The participant (or contract) invoking the method must offer to pay for the required
    gas. The invoking party offers a “gas price”, i.e. a conversion rate from Ethereum’s
    internal currency, Ether, to gas, and a total amount of Ether they are willing
    to pay for the invocation. A participant who chooses the transaction for inclusion
    in a block must execute the invoked method. The gas spent is awarded as Ether
    to the first participant who creates a block that includes the invoking transaction.
    Smart contracts can themselves send and receive currency as specified by their
    authors; the authors can also endow a smart contract with currency to use before
    deploying it onto the blockchain.


    Importantly, smart contracts can “protect” their methods and endowments by specifying
    conditions for access. Smart contracts have owners and who have special access
    privileges, e.g., to empty the current holding or to shut down the smart contract
    (which makes further invocations impossible). Ownership is implemented using the
    typical asymmetric cryptography of blockchain; the owner’s private key is needed
    to interact with the protected methods of a smart contract. In this sense, smart
    contracts implement the same form of access control that is common to most of
    computer security. It naturally means that all the known problems of access control
    – participants losing keys, keys being stolen, etc. – also apply to smart contracts.
