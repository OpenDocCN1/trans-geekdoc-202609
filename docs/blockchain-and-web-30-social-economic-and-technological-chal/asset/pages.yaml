- pgno: 284
  md: '# # A hierarchical structure model of success factors for (blockchain-based)
    crowdfunding


    Felix Hartmann, Xiaofeng Wang, and Maria Ilaria Lunesu


    # ## Introduction


    Crowdfunding is an important fundraising mechanism for new ventures and innovative
    projects. It is the practice of raising funds from a large number of people, typically
    using online platforms such as Kickstarter or Republic. Blockchain-based crowdfunding,
    represented by the surge of initial coin offerings (ICOs) and security token offerings
    (STOs), becomes a new and alternative form of crowdfunding and today can be considered
    one of the few functioning applications based on the blockchain technology.


    Blockchain-based crowdfunding is an emerging economic phenomenon and a state-of-the-art
    strategy to finance ventures. Compared to traditional funding models like initial
    public offerings (IPOs), venture capitals (VCs) and first generation crowdfunding,
    blockchain-based crowdfunding is still highly unregulated. Projects launching
    blockchain-based crowdfunding offer to the public a fraction of ownership (stake)
    in a new digital platform or network and/or its product or services in the form
    of tokens/coins on a blockchain. The stake (tokens/coins) could represent a utility,
    security, asset, commodity, currency or collectible. Another main distinction
    from other forms of early stage venture investments is the fast liquidity that
    cryptoassets can gain on online secondary markets (centralized/decentralized exchanges).


    The number of blockchain-based crowdfunding campaigns has increased drastically
    in the last few years. At the beginning of 2018, more established companies were
    also starting to explore the new funding opportunity. However, there is a lack
    of understanding of how to design a successful blockchain-based crowdfunding campaign
    and how to validate potential projects as an investor, partially due to the nascent
    nature of the phenomenon. A good understanding of the success factors of such
    campaigns would enable new ventures or entrepreneurs to design their blockchain-based
    fundraising initiatives properly, which in turn will help potential investors
    to seek main signals and drivers of outstanding projects. Based on this observation,
    we asked the following research question in our study:'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# *RQ: What are the success factors for blockchain-based crowdfunding campaigns,
    and how are they related to each other?*


    In this study, we focused on the success factors that are internal to a venture
    or a project, which are under the control of those who launch campaigns. External
    factors that are out of the control of individual campaigns, such as the reference
    token price during the campaign period, are out of the scope of our study.


    To answer the research question, we have applied a mixed-method approach. The
    literature review of the publications on the success factors of crowdfunding campaigns,
    especially that of ICO success factors, allowed us to identify an initial set
    of the determinants of blockchain-based crowdfunding success. Based on the list,
    we have analyzed a selected set of ICO evaluative websites to understand what
    factors were considered in practice but not reported in literature. After obtaining
    the extended list of success factors, we analyzed the relationships among them
    and built a model of the factors using interpretive structural modeling (ISM).
    The contribution of our work is a more extensive and structured understanding
    of what can lead to the success of (blockchain-based) crowdfunding campaigns.


    The remaining part of the chapter is organized as follows: The next section describes
    the success factors that have been identified in the relevant literature. The
    research process is reported in the “Research Approach” section. The “Findings”
    section details the results of the study, which is further discussed in the “Discussion”
    section. The chapter ends with the “Conclusion” section in which the contribution
    of the study is highlighted and the future work outlined.


    # ## Literature review


    During the last decade, many authors focused on crowdfunding success factors.
    Success factors are intrinsic to each crowdfunding project, and those fulfilled
    can lead to a successful campaign. There exist several, often controversial, studies
    on success factors in crowdfunding. Crowdfunding can be categorized in two main
    models: nonfinancial crowdfunding (reward and donation) and financial crowdfunding
    (equity, royalty and debt). Investors in financial crowdfunding platforms are
    different than the ones contributing to nonfinancial crowdfunding (Belleflamme
    et al., 2014). Financial crowdfunding backers do typically expected gains due
    to an increase in the value of their investments, as opposed to the potential
    reward, recognition or tax deduction in the case of nonfinancial crowdfunding.


    Blockchain-based crowdfunding can also be categorized in these two main models.
    A company can offer utility tokens, payment tokens (cryptocurrencies) or security
    tokens (Hacker and Thomale, 2017). The utility token sale can be seen as a presale
    of a future product or service. Reward crowdfunding is a traditional crowdfunding
    model where an investor contributes comparatively'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'small amounts of money to projects in return for some kind of reward. With
    this assumption, we can argue that a utility token sale shares similarities with
    nonfinancial crowdfunding such as reward-based crowdfunding. On the other hand,
    a security token sale is subjected to security regulations in many jurisdictions.
    One form of a security token offering (STO) is an equity token offering (ETO).
    In an ETO, a project sells part of its equity to a crowd of investors. With this
    assumption, it is arguable that STOs are similar to financial crowdfunding campaigns
    such as equity crowdfunding.


    First, studies indicate a relationship between traditional crowdfunding success
    factors and token sale success factors (Fisch, 2018; Adhami et al., 2018; Lee
    et al., 2018). Therefore, we reviewed the literature on reward-based crowdfunding
    success factors to detect factors important to the nonfinancial crowdfunding model
    and equity crowdfunding literature to detect factors important to the financial
    crowdfunding model.


    Nevertheless, blockchain crowdfunding campaigns have some intrinsic characteristics
    that are different from those of a traditional crowdfunding campaign or even an
    initial public offering (IPO). The information about the project is generally
    summarized in a white paper. The contained information is not bound by strict
    regulations such as the one contained in a prospectus in the case of an IPO. In
    the case of an ICO, the underlying technology is the blockchain. Smart contracts
    are tiny programs that can be uploaded to Github for third-party verification.
    The token sales are generally financed with decentralized cryptocurrencies such
    as Ether or Bitcoin, not with centralized fiat currencies, as is the case in traditional
    financing methods. For the above-argued reasons, we also reviewed recent literature
    to identify the success factors that apply to blockchain-based crowdfunding campaigns.


    We report the identified factors using two main categories: project related and
    campaign related. Table 16.1 provides an overview of these factors, further grouped
    into subcategories.


    # Project-related success factors


    # Company characteristics


    **Industry:** A study by Mamonov et al. (2017) on US-based equity crowdfunding
    sites states that crowdfunding projects in the real estate sector are by far more
    successful than those in other industries. This finding indicates that projects
    acting in certain industries will be more successful than those in other sectors.
    In the reward crowdfunding space, a study by Davies and Giovannetti (2018) finds
    evidence of great differences in the impact of project categories on the success
    of Kickstarter campaigns, with some categories positively affecting the probability
    of a project’s success. By contrast, in the blockchain crowdfunding literature,
    we find a statement that ICO valuations are not different across industries (Fisch
    et al., 2018).'
  merge: -1
  img_proc: true
