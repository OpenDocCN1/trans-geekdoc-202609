- pgno: 290
  md: '**Location:** A study by Ralcheva and Roosenboom (2016) outlines that projects
    with headquarters in big cities are generally more successful in equity crowdfunding
    in the UK. A study by Agrawal et al. (2015) suggests that the proximity of an
    artist and its funders does not impact crowdfunding success. It seems that on
    Kickstarter, US-based projects have greater chances to succeed (Colombo et al.,
    2014). It is nevertheless difficult to state if location has a significant impact
    on crowdfunding success because there are only a limited number of projects in
    certain areas (Davies and Giovannetti, 2018). The importance of location seems
    not to be uniform for all the categories of projects on Kickstarter. Projects
    on games, comics and technology are relatively less dependent on their geolocation
    to attract funding (Rakesh et al., 2015). In the blockchain crowdfunding space,
    due to regulatory restrictions and uncertainties, choosing the right jurisdiction
    to set up the company offering the tokens plays a crucial role. A paper by Adhami
    et al. (2018) comes to the conclusion that the choice of a jurisdiction of reference
    for the token sale by project promoters is appreciated and adds to the probability
    of the campaign’s success. Projects coming from certain regions seem to be more
    prone to be successful than others (Fenu et al., 2018). In contrast, a study by
    Fisch (2018) states that location of the venture does not impact on ICO valuation.


    **IPO exit strategy:** Vismara et al. (2016) find that an IPO exit strategy does
    not affect the outcome of an equity crowdfunding campaign. Projects that declared
    an exit strategy within the next five years attracted fewer investors, but the
    amount raised did not differ. In contrast to this finding, Ahlers et al. (2015)
    find a positive effect of an IPO exit proposal on fundraising success.


    # Strong partners


    **Reputable investors:** Mamonov and Malaga (2018) conducted an analysis of 133
    projects across 16 Title III equity crowdfunding sites launched between May 2016
    and February 2017. They find that there is a correlation between professional
    business angel and venture capital involvement and equity crowdfunding success.
    The positive effect on crowdfunding success could be derived by the leveraging
    effect of those reputable investors with respect to information asymmetry metric.
    Another study by Ralcheva and Roosenboom (2016) analyzes the performance of UK-based
    equity crowdfunding campaigns. The study concludes that business angel investments
    and winning grants increase the probability of campaign success. Meantime, Kim
    and Viswanathan (2013) find that investors with app development experience and
    investors with app investment experience have disproportionate influence on later
    investors in the crowd and help to reduce information asymmetry among the investor
    base. The lead investor’s credibility and his/her advocacy behaviors, as measured
    in identity certification, investment experience, percentage of their investment
    and comments for projects, are important factors affecting crowdfunding performance
    (Li et al., 2016).'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Strong early adopters


    **Corporate customers as early adopters:** A study by Mamonov and Malaga (2018)
    across 16 equity crowdfunding sites in the US found evidence of a positive correlation
    between the existence of corporate customers and equity crowdfunding success.


    # Project innovativeness


    **Intellectual capital:** Previous studies acknowledge that one of the most important
    reasons for startups to patent is to secure funds (Graham et al., 2008). Surprisingly,
    the studies of Ahlers et al. (2015) and Mamonov and Malaga (2018) find no correlation
    between intellectual capital (as measured by patents) and funding success in equity
    crowdfunding. In contrast, another study by Ralcheva and Roosenboom (2016) contends
    there is a positive relation between intellectual capital protection and equity
    crowdfunding success in the UK.


    # Product stage


    **Product development stage:** Mamonov and Malaga (2018) investigate the effects
    of the state of product development related to equity crowdfunding success. They
    find that companies in the beta or prototype phase are less likely to raise significant
    funding during their campaigns than projects that have completed product development.
    The study on equity crowdfunding in the UK by Ralcheva and Roosenboom (2016) finds
    an increase of campaign performance if a project already made a first sale. Another
    study states that the willingness to invest in an equity crowdfunding campaign
    is clearly affected by business development or achieved milestones, respectively
    (Loehre et al., 2018). These results are somewhat in contrast to the blockchain
    crowdfunding performance in 2017. Many of the projects that conducted an ICO in
    that year had not nearly completed product development but were nevertheless quite
    successful (CB Insights, 2018).


    # Team composition


    **Team size:** Mamonov and Malaga (2018) find that equity crowdfunding campaigns
    run by solo entrepreneurs were less successful than ones conducted by entrepreneurial
    teams. Ahlers et al. (2015) contend that a having a higher number of board members
    is linked to equity crowdfunding success. In a study on entrepreneurial legitimacy
    in reward-based crowdfunding, Frydrych et al. (2014) reveal that projects with
    pairs and teams demonstrate much higher success rates than projects with individuals.
    These findings imply that crowdfunding investors believe that bigger teams are
    able to handle unexpected difficulties in a much better way. A study by Stam and
    Schutjens'
  merge: -1
  img_proc: true
- pgno: 292
  md: '(2005) finds that team startups are relatively more successful than solo entrepreneur
    startups. Interestingly, this effect was only valid for the first three years
    of a venture. Larger teams might create more discussions and paralyze the decision-making
    process. Having advisors and mentors on board seems to influence equity crowdfunding
    performance positively (Ralcheva and Roosenboom, 2016). Fisch (2018), analyzing
    the effect of team size on the success of ICOs, finds no evidence of a connection
    between the number of founders and ICO success. In contrast, Cerchiello and Toma
    (2018) state that having a bigger team and more advisors has a positive effect
    on ICO success. Similarly, Amsden and Schweizer (2018) find that more advisors
    and a bigger team size in general are connected with a higher probability of tokens
    being traded after the token sale and with a higher probability of raising more
    funds. The study by Fenu et al. (2018), on the other hand, finds no relation between
    team size and ICO success.


    **Female founders:** There exist several studies that state that female founders
    are disadvantaged in traditional finance and are less likely to receive institutional
    capital, private equity and bank financing (Becker-Blease and Sohl, 2007; Bigelow
    et al., 2014; Eddleston et al., 2016). Interestingly, there exists some literature
    that states that women entrepreneurs are more successful in reward-based crowdfunding
    (Frydrych et al., 2014). Colombo et al. (2014) find that individual proponents
    who are male are less likely to receive support in terms of backers and capital
    than are females or companies. In the equity crowdfunding space, Vismara et al.
    (2016) find that female founders are able to attract the same number of investors
    but raise lower funding. Interestingly another study on gender differences in
    the contribution patterns of equity crowdfunding investors finds that female investors
    are more likely to invest in projects in which the proportion of male founders
    is higher (Mohammadi and Shafi, 2018).


    # *Team experience*


    **Previous founder experience:** In a study on success factors of crowdfunding
    projects on the Kickstarter platform, Gutsche and Sylla (2017) point out that
    founders with previous crowdfunding experience are more successful than those
    without experience. The paper highlights the importance of seeking external advice
    if the entrepreneurs and their team lack this experience. Other studies also confirm
    the importance of previous crowdfunding experience (Davies and Giovannetti, 2018).
    Backers tend to develop trust towards creators whom they have backed in the past
    (Rakete et al., 2015). Serial creators could be able to create a supportive funder
    base over time. Kim et al. (2017) find a positive effect of founders'' previous
    fundraising experience on crowdfunding success. The authors point out that this
    experience could be seen as a positive signal of founders'' capability and competency.
    On the other hand, Colombo et al. (2014) find that the number of previously created
    crowdfunding campaigns,'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'as indicators for social capital, was not significant in predicting the success
    of reward-based crowdfunding campaigns. Another study, by Mamonov and Malaga (2018),
    finds no significant relation between prior industry experience or serial entrepreneurial
    experience and equity crowdfunding success.


    **Well-connected CEO:** A study by Amsden and Schweizer (2018) finds that projects
    with well-connected CEOs (measured through LinkedIn 500+) are more likely to sell
    tokens that are tradable after the token sale and to raise more funds.


    **Team educational background:** A study by Ahlers et al. (2015) titled “Signalling
    in Equity Crowdfunding” analyzed 104 offerings between 2006 and 2011 based on
    data from the Australian Small Scale Offerings Board (ASSOB). The result shows
    that the number of team members holding an MBA was positively correlated to campaign
    success. This result could be linked to the better network those founders have
    on average. The study suggest that highly qualified board members can enhance
    the likelihood of attracting investors as well as increase the speed of raising
    capital.


    # *Founder dedication*


    **Loyal CEO:** Loyal CEOs have to offer fewer incentives to attract investors
    to their ICOs. Loyal CEOs are able to raise a higher funding amount in a shorter
    time period and lower the probability of failure significantly (Momtaz, 2018).


    **Financial commitment:** Time and money entrepreneurs dedicate to their business
    are important in the investment decision making of business angels and venture
    capital (Cardon et al., 2018; Busenitz et al., 2005; Prasad et al., 2000). This
    is in alignment with the findings of Leland and Pyle (1977), which state that
    founders anticipating success are willing to commit more of the initial investment.
    This, however, depends on the financial situation of the founders. In a research
    note on entrepreneurs financial commitment and crowdfunding success, Loehrer et
    al. (2018) clearly indicate a positive relationship between financial commitment
    of entrepreneurs and equity crowdfunding success. Furthermore, the studies by
    Gutsche and Sylla (2017) and Davies and Giovannetti (2018) state that founders
    could be able to trigger additional funding if they participate actively as backers
    to other projects on crowdfunding platforms.


    # *Social media traction*


    **Social network presence:** Mollick (2014) finds that a proponent’s number of
    Facebook friends is positively associated with the amount of capital raised in
    a crowdfunding campaign, although not having a Facebook account is better than
    having few Facebook friends. A study by Colombo et al. (2014) highlights the importance
    of internal social capital for success, measured by the number of contributors
    that are attracted during the campaign. A study by'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'Ordainini et al. (2011) underlines that initial capital raising is mostly done
    by social contacts that have been deployed outside the campaign (external social
    capital) and highlights the importance of those investments for campaign success
    because of its positive effects to increase internal social capital. A study by
    Zheng et al. (2014) demonstrates significant effects of social networks on reward
    crowdfunding success using data collected in China and the US using Facebook and
    Weibo. A study by Vismara et al. (2016) analyzed 271 UK-based equity crowdfunding
    campaigns. The study states that entrepreneurs with more LinkedIn connections
    are able to conclude a more successful campaign. In the blockchain crowdfunding
    space, a study by Davies and Giovanetti (2018) found the number of Facebook connections
    have a significant but not particularly strong effect on the probability of ICO
    success. A study by Cerchiello and Toma (2018) states that the simple presence
    of a Telegram channel can increase the likelihood of ICO campaign success. A study
    by Amsden and Schweizer (2018) states that having a communication channel on Telegram
    increases the probability of collecting more funds and that the tokens get listed
    on an exchange after the initial coin offering. Also, having an active Twitter
    account seem to have a positive influence on ICO success (Cerchiello and Toma,
    2018).


    **Network interactions updates and comments:** A study by Lukkarinen et al. (2016)
    suggests that the presence and activity of social networks is relevant for equity
    crowdfunding success. A study on equity crowdfunding in Germany come to the conclusion
    that posting updates by the entrepreneur increases subsequent investments, especially
    the subsequent day (Hornuf and Schwienbacher, 2018). A study by Gutsche and Sylla
    (2017) concludes that an ongoing dialogue with the community increases the success
    rate of campaigns. The author advises projects to interact frequently with their
    crowd, using as many channels as possible. A study by Kim et al. (2017) outlines
    that the number of comments and updates influence reward crowdfunding campaign
    success. A study by Etter et al. (2013) outlines the importance of an increase
    in Twitter messages after the start of a Kickstarter campaign. Lu et al. (2014)
    outline the importance of social media promotion activities during a Kickstarter
    campaign and its positive impact on success. A study by Rakesh et al. (2015) finds
    that rapid early promotion correlates with more promotion overall and highlights
    its importance for reward crowdfunding success. Projects promoted by influential
    Twitter users have the potential to attract more backers, and the backing habits
    of investors in Kickstarter are influenced by their social circle (Rakesh et al.,
    2015).


    **Presence on Github:** A study by Fisch (2018) states that the simple presence
    of a Github page does not affect ICO valuation. The number of stars that are connected
    to a Github account, on the other hand, seem to be a better quality signal and
    increase the probability of campaign success (Fisch, 2018). Another study by Amsden
    and Schweizer (2018) states that being present on'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'Github (e.g., posting code updates) increases the probability of the token
    getting listed after the ICO.


    # Campaign-related success factors


    # Campaign design


    **Identity disclosure:** In their study on the roles of founder and project features
    in reward-based crowdfunding, Kim et al. (2017) state that an identity disclosure
    has a positive and statistically significant relation to campaign success ratio.
    A study conducted in the Netherlands by Polzin et al. (2018) state that the information
    about the persons behind the project are especially important in reward and donation
    crowdfunding.


    **Quality signals (videos, pitches, etc.):** Several studies highlight the importance
    of quality signals and their impact on crowdfunding success (Mollick, 2014; Bi
    et al., 2017; Chan and Parhankangas, 2017; Courtney et al., 2017; Frydrych et
    al., 2014; Xu et al., 2016; Kim et al., 2017). The study by Colombo et al. (2014)
    finds no significant correlation to external links nor to the number of images
    and videos on reward crowdfunding success. The study states that these factors
    are fully mediated by early contributions. On the other hand, the study of Kuppuswamy
    and Bayus (2015) on reward crowdfunding states that a video can attract more backers.
    In terms of equity crowdfunding, Mamonov and Malaga (2018) find no direct evidence
    of video material and campaign success, but Mollick (2014) suggests that signals
    such as videos and frequent updates are associated with greater success. Spelling
    errors seem to reduce the chance of success. It seems that on established crowdfunding
    platforms like Kickstarter, video pitches become a standard, and most projects
    are offering them (Frydrych et al., 2014).


    **Share of retained equity/tokens:** The study by Ahlers et al. (2015) finds that
    retaining equity can be an effective signal to increase the likelihood of funding
    success. In other studies on equity retention and social network theory in equity
    crowdfunding, Vismara et al. (2016) and Ralcheva and Roosenboom (2016) come to
    the same result. This effect could be linked to the cost of retained equity if
    the business collapses and the potential increase in value if the project is successful.
    Founders who are convinced that the business will be successful will be more likely
    to retain as much equity as possible. Interestingly, in the blockchain-based crowdfunding
    space, the studies by Lee et al. (2018) and Amsden and Schweizer (2018) find that
    the same pattern is also true for ICOs. Projects that retain more tokens seem
    to be more successful. Lee et al. (2018) argue that “retaining more tokens could
    be an important governance indicator, the percent of tokens to be sold to investors
    measures management’s skin in the firm” and that the result could be linked to
    former studies on the positive effects of signalling equity retention. It seems
    that investors are attracted'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'by projects with a higher retention rate. Retaining a higher fraction of tokens
    could be seen as a signal of the founder’s confidence in the project. Selling
    only a fraction of the tokens gives projects the possibility to sell unsold tokens
    in future financing rounds; this is comparable to seasoned equity offerings (SEOs)
    that are used by publicly traded companies. Nevertheless, in the case of most
    token sales, the tokens are not connected to any shareholder rights such as governance.
    The managers normally remain in full control over the company. In fact, this could
    change with the new trend of security token offerings such as ETOs which would
    be bound by more prompt investor protection.


    **Lower funding target:** In the equity crowdfunding space, Lukkarinen et al.
    (2016) studied the effects of funding target amounts and their relation to campaign
    success. The authors find that a high minimum funding target has a strong negative
    correlation with the number of investors and amount raised. On the other hand,
    the study found that an overall higher funding target is positively related to
    funding success. This could be explained because investors in the equity crowdfunding
    space expect that projects need to spend more to reach a significant increase
    in valuation. In line with this result, a study on equity crowdfunding by Ralcheva
    and Roosenboom (2016) finds that successful campaigns have higher targets. In
    contrast, a study by Mamonov and Malaga (2018) finds a negative effect of the
    target amount and crowdfunding success in equity crowdfunding. Higher targets
    led to worst results. A study on equity crowdfunding conducted by Vulkan et al.
    (2016) finds that increasing the funding target by one standard deviation decreases
    the probability of success by between 11 and 18 percentage points. Vismara et
    al. (2016) and Ahlers et al. (2015) find that the target capital is related to
    a higher number of investors but does not affect the overall amount raised. In
    the reward crowdfunding space, a study by Zheng et al. (2014) states that the
    crowdfunding goal is negatively related to campaign performance in the US and
    China. Several studies on crowdfunding confirmed that bigger funding goals are
    negatively associated with the crowdfunding success ratio (Kim et al., 2017; Colombo
    et al., 2014; Molllick, 2014; Kuppuswamy and Bayus, 2015; Davies and Giovannetti,
    2018; Cordova et al., 2015). On the other hand, several studies find that successful
    campaigns with lower funding targets tend to get overfunded on average (Frydrych
    et al., 2014; Molllick, 2014; Vulkan et al., 2016). In the blockchain crowdfunding
    domain, the campaign’s upper funding target is called “hardcap”; the minimum funding
    target is called “softcap.” Interestingly, the softcap of successful and unsuccessful
    ICO campaigns are nearly identical and therefore seem to have no influence on
    campaign success. Not having a softcap nevertheless seems to have a negative relation
    to the amount raised during the ICO (Amsden and Schweizer, 2018). On the other
    hand, the hardcap of successful token sales seem to be double the size of the
    ones of unsuccessful token sales (Lee et al., 2018). The presence of a hardcap
    increases both the probability of a token getting traded and the amount raised
    (Amsden and Schweizer, 2018).'
  merge: -1
  img_proc: true
- pgno: 297
  md: '**Shorter campaign duration:** Some studies analyzed the impact of campaign
    duration to campaign success. In the equity crowdfunding space, Lukkarinen et
    al. (2016) find that campaign duration is negatively correlated with the number
    of investors but not related to the amount raised. The study propose that shorter
    campaign durations could encourage investors to act fast and signals decisiveness
    and the ability to deliver. In the reward crowdfunding space, several studies
    find that longer campaign durations have a negative impact to campaign success
    (Molllick, 2014; Kuppuswamy and Bayus, 2015; Davies and Giovannetti, 2018). Longer
    campaign duration could signal a lack of confidence. Some studies find no relation
    between reward crowdfunding campaign duration and campaign success (Colombo et
    al., 2014; Kim et al., 2017). Another study by Zheng et al. (2014) finds significant
    effects of campaign duration in China but not the US. A study by Cordova et al.
    (2015) finds a positive effect of longer campaign duration on reward crowdfunding
    success. Another study on Kickstarter found that the combination of a high funding
    target and a long funding period is associated with less successful crowdfunding
    campaigns and that shorter campaign duration is generally correlated with higher
    success; nevertheless, they found a low correlation between campaign duration
    and the funding ratio (Frydrych et al., 2014). Cordova et al. (2015) find that
    project duration increases the chances of success and leads to an increase in
    the dollar amount contributed per day on a given project.


    **Lower ticket size:** A study by Lukkarinen et al. (2016) finds that a lower
    ticket size is correlated with crowdfunding success. The ticket size is the minimum
    investment an investor has to commit to participate in a crowdfunding campaign.
    This effect could be linked to the small funding availability of unaccredited
    investors.


    **Well-differentiated reward levels:** There exists some literature on the effect
    of differentiated reward levels. Well-differentiated reward should be helpful
    to attract funding from the whole crowdfunding community because of the differing
    abilities and willingness to fund (Gutsche and Sylla, 2017) and increase the investor
    base (Kuppuswamy and Bayus, 2015). Lower reward levels could therefore lead to
    campaign failures because of the limited investor base (Kim et al., 2017). A study
    by (Frydrych et al., 2014) points out that more creative-oriented projects (e.g.,
    art, design, music, etc.) tend to have a higher number of reward levels. The study
    nevertheless found no significant effect of the average number of rewards offered
    by successful and unsuccessful campaigns. Rewards that give a sense of community
    belonging seem to have a positive effect on crowdfunding success (Colombo et al.,
    2014). It seems that reward crowdfunding investors appreciate being part of a
    community.


    **Campaign addresses markets in more than one country:** A study by Gutsche and
    Sylla (2017) highlights that it is important for projects with a higher funding
    goal to target more than one county. This gives projects the access to investors
    needed for higher crowdfunding success rates. The regulatory landscape nevertheless
    limits projects to run certain campaigns in'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'specific markets. This is the case of financial crowdfunding in Europe. There
    are no unified regulations in place, and crowdfunding platforms face several difficulties
    in offering their campaigns over national borders (European Commission, 2017).


    **Tokens allow contributors to access a specific service (or to share profits):**
    A study by Adhami et al. (2018) outlines that the right of access to services
    and the right to receive a share of company profits appear positively related
    to blockchain-based crowdfunding success.


    **Using Ethereum:** Ethereum is the most widely adopted platform to launch blockchain-based
    crowdfunding campaigns. It seems that using Ethereum to build the project can
    increase ICO valuation (Fisch, 2018). Using the Ethereum network increases the
    probability of a high participation in an ICO (Amsden and Schweizer, 2018) and
    ICO success (Fenu et al., 2018).


    **Number of tokens issued:** A study by Fisch (2018) argues that the number of
    tokens issued by the project increases the valuation of the crowdfunding campaign.
    Investors seem to be more likely to invest in a campaign where they are able to
    get more tokens for a certain investment than in projects where they have to invest
    higher amounts per token. A higher number of tokens offered also shortens the
    overall campaign duration. In fact, this characteristic seems to be a psychological
    bias. Investors seem to believe that if they get a higher amount of tokens, the
    investment is more valuable than if they get a smaller amount. This could be because
    they wrongly see tokens as a sort of equity investment.


    **KYC/pre-registration:** Interestingly, projects that conducted a know your customers
    (KYC) process are less likely to conclude token sales successfully, according
    to a study by Lee et al. (2018). In their study, they also found that, similarly,
    ICOs that required advance registration or restricted sales in certain countries
    are also less likely to proceed. This should be linked to the exclusion of investors
    from countries with tight ICO regulations such as China, South Korea and the US.


    **Presale:** Token presales seem to be strongly significant to ICO success (Adhami
    et al., 2018). If that''s the case, a pre-ICO could be an interesting method to
    test the market before launching the main sale or to finance the main sale expenses.
    Also, Lee et al. (2018) find a positive correlation between token presales and
    ICO success. A successful presale normally is covered by high net worth investors
    and can create momentum due to higher flexibility in expenditures. A study by
    Amsden and Schweizer (2018) finds that tokens offered by projects organizing a
    pre-ICO are less likely to get traded after the token sale. This could be because
    many projects collect enough money from institutional investors, and those investors
    are more risk adverse against unregulated secondary marketplaces. Those projects
    also raise fewer funds.


    **ICO bonus/discounts:** A study by Lee et al. (2018) finds that high bonus offers,
    defined as 20 percent or more, are more prevalent in failed ICOs. Bonuses can
    attract investors at an early stage but could also be considered as a negative
    signal to later stage investors who might consider the project as a lemon or scam.
    Another study, by Adhami et al. (2018), finds that bonus schemes are only marginally
    significant for the probability of success of the'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'campaign. A bonus structure can help to attract early investors but is not
    related to ICO success (Amsden and Schweizer, 2018).


    **Accepting multiple currencies (digital and fiat):** ICOs that accepted multiple
    (digital) currencies were more likely to succeed compared to ICOs that took just
    one currency. Given that major digital currencies such as BTC and ETH are drastically
    volatile, expanding the options of currencies, thus increased liquidity, can facilitate
    transactions (Lee et al., 2018). Accepting fiat currencies is negatively correlated
    with ICO success (Amsden and Schweizer, 2018). This could be because crypto investors
    are less confident in projects that are linked to traditional financial markets.


    # Campaign traction


    **Investors with large investments:** A study conducted by Ralcheva and Roosenboom
    (2016) concludes that successful equity crowdfunding campaigns in the UK are able
    to attract investors who pledge significantly higher amounts of funds. Another
    study on equity crowdfunding in the UK (conducted by Vulkan et al., 2016) finds
    that the median pledge per investor is one-third higher for successful campaigns
    compared to unsuccessful ones. Additionally, the study states that the highest
    single investment in successful campaigns accounts for 30 percent of the funding
    goal. This highlights the importance of single high-value investments to drive
    successful campaigns. A study on equity crowdfunding in Germany state that investments
    of at least 5,000 Euro during the last seven days increase the overall funding
    amount of the following day (Hornuf and Schwienbacher, 2018).


    **Early investments:** In the equity crowdfunding space, Lukkarinen et al. (2016)
    find that the amount of the share of the minimum target raised during the hidden
    phase from private networks is strongly positively related with both the final
    number of investors and the amount raised during the campaign. This effect could
    be triggered because of the later stage investors’ confidence that early backers
    have undertaken some due diligence. In the reward crowdfunding space, we found
    several studies that analyzed the impact of early investors on campaign success.
    The studies by Colombo et al. (2014) and Davies and Giovannetti (2018) in the
    reward crowdfunding space highlight the importance of early investments and their
    positive influence on the overall crowdfunding success. A study by Vulkan et al.
    (2016) on equity crowdfunding in the UK found that successful campaigns on average
    collect 50 percent of their overall target within a week after the campaign starts.
    A study by Agrawal et al. (2015) highlights the importance of early F&F investments
    to attract “external” crowdfunding investors in the royalty crowdfunding space.
    Projects that raise under 28.8 percent of the overall investment target within
    one-sixth of the campaign are at high risk of failure on Kickstarter (Colombo
    et al., 2014). A study by Kuppuswamy and Bayus (2015) states that large early
    investments decrease the number of backers in the second phase. The authors think
    that this effect is triggered by the perception of investors that the project
    will be backed by enough persons. Successful'
