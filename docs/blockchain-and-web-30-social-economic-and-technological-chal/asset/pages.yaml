- pgno: 144
  md: '# Chapter 9


    # # Disruptive blockworks


    # Blockchains and networks/ acceleration and collision


    Matthew Lovett


    # ## Introduction


    In the near quarter-century since the Federal Networking Council (NITRD, 1995)
    first defined the term ‘the Internet’, our use and our understanding of this most
    quintessentially disruptive technology has evolved considerably. And now, as a
    further iteration of the Internet is emerging and beginning to establish itself
    – a semantic web of integrated data – increasingly, blockchain technology is being
    pushed to the forefront of debates relating to what a future web might look like
    and how it could work. With decentralised, peer-to-peer communication as a core
    operating principle, along with a capacity to facilitate anonymous interaction
    across global networks, blockchain is enabling an economy, and a culture that
    is ever more concerned with privacy and authentication, to develop and grow.


    What follows is an engagement with Steemit (Steemit, 2018) and Mycelia Creative
    Passport project (Mycelia, 2018), two blockchain-based platforms designed and
    built to harness aspects of blockchain’s orientation towards authentication and
    payment systems. The emergence of blockchain technology has been concurrent with
    a period of development and change for the Internet, where an early twenty-first-century
    optimism about the capacity of digital networks to create new forms of non-hierarchical
    labour and association has been displaced by growing concerns over the widespread
    commercial domination within a supposedly open network. ‘Acceleration and collision’
    signal two aspects of contemporary discourse surrounding our techonomic environment:
    ‘accelerationism’ and ‘disruptive technology’, the former being a latter-day rewiring
    of the economist Joseph Schumpeter’s theory of ‘creative destruction’, whilst
    the latter is a term that draws on the work of the philosopher Gilles Deleuze
    and the psychoanalyst Félix Guattari and has found purchase in contemporary critical
    theory and debate.


    Initially, the chapter establishes a context in which to discuss the emergence
    of Steemit and Creative Passport in relation to two notable shifts in our conception
    and understanding of the Internet during the past twenty years, the first being
    an initial wave of optimism surrounding digital networks’ capacity'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'to create new forms of non-hierarchical labour and association, and the second,
    a more recent cynicism brought on by widespread commercial domination, defined
    by Nick Srnicek as ‘Platform Capitalism’. We then engage more fully with Steemit
    and Creative Passport in relation to Schumacherian and Accelerationist ideas to
    consider how economic theory is both implicitly and explicitly expressed in blockchain-driven
    technology, and what kind of disruption these technologies might bring.


    # Steemit


    Steemit is a micro blogging platform reminiscent of both Reddit and Twitter. On
    creating a Steemit account, users are able to engage with a range of familiar
    social media activities, including uploading text-based posts, photographs and
    links to off-site content, tagging other users and creating hashtags. According
    to the _Steem Whitepaper_, Steem, the blockchain database that drives Steemit,
    ‘is the first cryptocurrency that attempts to accurately and transparently reward
    an unbounded number of individuals who make _subjective contributions_ to its
    community’ (Steem, 2017). Steemit offers to pay users for interacting with the
    Steem ecosystem, and users are rewarded in Steem tokens for posting, voting and
    curating on the Steem platform. These tokens can be converted to Steem Dollars,
    which in themselves can by traded for Bitcoin, and thus – eventually – exchanged
    for fiat currency. According to the _Steem Blueprint_, the Steem blockchain is
    based on delegated proof of stake rather than a proof of work (PoW), and it mints
    Steem tokens at a rate of one block every three seconds. Steem sets itself aside
    from the likes of Bitcoin, stating that ‘unlike the traditional PoW means of distribution,
    where miners are competing over raw computing power, the actors in the Steem network
    are incentivised to compete in ways that add value to the network’ (Steem Blueprint,
    2018). As a result, one of Steem’s most important innovations is to have tethered
    content creation to cryptocurrency production, meaning that the blockchain captures
    users’ every interaction with Steemit and continuously distributes payment from
    the Steem ‘rewards pool’ (Steem, 2018) based on the quality of this interaction.
    Steemit is designed to be an entirely democratic platform that enables its users
    to decide on – or ‘vote’ – whether or not, and to what extent, user activity on
    Steemit (including their own) is worthy of reward. The voting process – known
    as ‘upvoting’ – is akin to ‘liking’ something on other social media platforms,
    with the addition that Steemit attaches a reward to the upvoting process itself:
    ‘If you discover a post and upvote it before it becomes popular, you can earn
    a curation reward’ (Steem, 2017). Because one of Steemit’s fundamental operating
    principles is to embrace the notion that success within social media environments
    is as much about interlinking as it is about posting, upvoting also becomes a
    strategic activity, enabling users to fully engage with the benefits of a connected
    web, where every point of contact with the web – every digitally recorded act'
  merge: -1
  img_proc: true
- pgno: 146
  md: "of creative decision making – is a potentially monetisable signpost to every\
    \ other point. Thus, via the production and validation of new connections, the\
    \ reward system acknowledges these actions as creative activities in their own\
    \ right. This is a notable departure from previous iterations of the World Wide\
    \ Web, which, as we shall see, has often allowed for an atmosphere of creativity\
    \ for its own sake, and if it has been considered as part of the online environment,\
    \ then commercial exploitation of content has increasingly been seen as the reserve\
    \ of multinationals rather than everyday users.\n\nSteemit has been designed to\
    \ work as an integrated ecosystem, one that encourages users to engage with the\
    \ platform in a number of ways, reconfiguring the social media environment as\
    \ a mixed economy of practices and behaviours, akin to ‘a game system where users\
    \ compete for attention and rewards by bringing content and adding value to the\
    \ platform’ (Steemit, 2018). Steemit is thus a wholesale rethinking of creating\
    \ and sharing, something of a blueprint for an Internet to come, where Steem’s\
    \ twin innovation of paying users for engaging with the platform whilst simultaneously\
    \ providing an overarching cloak of anonymity enables the network to proliferate\
    \ and users to prosper whilst maintaining their privacy. In addition, because\
    \ Steemit’s gamelike qualities enable it to democratise and, perhaps more importantly,\
    \ incentivise the social media environment, Steem presents a new vision of how\
    \ to harness a user’s desire to inhabit and contribute to a network. By enabling\
    \ users to track the value of Steem whilst simultaneously monitoring theirs and\
    \ their peers’ financial success, Steemit thereby fuses this desire with a newly\
    \ tooled appetite to engage with an Internet of commerce and value.\n\n# Creative\
    \ Passport\n\nCreative Passport is one of a number of ventures developed by Mycelia,\
    \ a project platform founded by the musician Imogen Heap, described on its homepage\
    \ as ‘a research and development hub for music makers’ (Mycelia, 2018). On the\
    \ introduction page, Heap explains that:\n\n> The Creative Passport is the digital\
    \ container for verified profile information, IDs, acknowledgements, works, business\
    \ partners and payment mechanisms for each music maker. Its aim is to fill a huge\
    \ gap for the industry by becoming a digital identity standard for music makers,\
    \ collectively forming the Creative Passport Database and evolving into the essential\
    \ connective hub for all music related services.\n> \n> (Heap, 2018: 3)\n\nAs\
    \ with Steemit, Creative Passport has been designed as a corrective to a perceived\
    \ flaw in the networked media environment. In the case of Creative Passport, it\
    \ is a means to ensure that musicians’ creative contributions to music-based content\
    \ are registered and rewarded and that these contributions are safeguarded"
  merge: -1
  img_proc: true
- pgno: 147
  md: 'in perpetuity by being stored on an immutable database. Heap goes on to discuss
    how earlier attempts to create an all-encompassing ‘Global Repertoire Database’
    had been unsuccessful (Heap, 2018: 5), especially the original project to create
    a GRD. Launched by the EU and involving Apple, Amazon, Google and a range of publishers
    and rights collection agencies (Music Business Worldwide, 2016), the project incurred
    costs of £8 million and was eventually abandoned in 2014. In 2017, the US Congress
    proposed a bill to create a ‘searchable digital database’ (Digital Music News,
    2017a), but this has also met with little success (Digital Music News, 2017b).
    In essence, Creative Passport is an attempt to capture and store information at
    scale, and given the sustained growth of the global music industry – with the
    IFPI’s Global Music Report 2018 reporting that revenues for recorded music had
    increased by a further 8.1 percent during 2017 (IFPI, 2018) – this is clearly
    an issue that will continue to be a source of speculation and debate until a multilateral
    solution is found. Whilst there are clear technological and ideological differences
    between Steemit and Creative Passport – Steemit being a social media platform
    designed to provide payment to users for a wide range of creative acts and interactions
    on the platform, whereas Creative Passport is an information storage facility
    for those offering commercial services within the music industry – there are also
    important similarities. Each expresses a vision of harnessing blockchain to create
    infrastructural improvements in digital music and media commerce, an aspect of
    blockchain that has all-too-easily been overlooked in the drive to see it as a
    curative for protracted and inefficient commercial transactions. Instead, what
    the designers of platforms such as Steemit and Creative Passport understand is
    that blockchain has the potential to enable us to conceive of a new paradigm for
    online communication. Worth noting at this point is that, whilst we must be careful
    to not overestimate the scale of technological change that blockchain might bring
    about, its presence is undoubtedly contributing to a rapid evolution of both our
    understanding and our expectations of how we interact with the Internet.


    # The future was bright


    In the early 2000s, a certain utopianism about how the Internet could help establish
    a more creative and equitable economy was clearly in the ascendant. Yoichai Benkler’s
    book Wealth of Networks: How Social Production Transforms Markets and Freedom
    and Charles Leadbeater’s We-Think: Mass Innovation, not Mass Production are both
    notable examples of this wave of optimism surrounding a perceived capacity for
    the Internet to create a step change in both the social and industrial spheres.
    Indeed, Benkler’s conviction was that an increasingly networked world, made possible
    by cheaper and more powerful computers, would mean that ‘nonmarket and radically
    decentralised [patterns of production would emerge] at the core, rather than at
    the periphery of most advanced economies’ (Benkler, 2006: 3). Whilst Benkler has
    certainly been proven right about the emergence of decentralised production in
    all its variances, the extent'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'to which non-market forces are influencing contemporary digital economies is
    less certain. Nonetheless, Benkler was far from alone in to what he saw as a seemingly
    inexorable slide towards a ‘winner takes all star system’ (Lanier, 2014: 35),
    where an increasingly reduced number of corporations and individuals would see
    ever-higher profits in return for their growing domination of the Internet. Lanier
    suggested that a more equitable online economy would be possible, at the expense
    of redesigning the Internet to include ‘two-way links’ (Lanier, 2014: 218), which
    would put revenue and data capture within reach of every user rather than simply
    in the hands of those who already hold the financial and information advantage.


    Such widespread harvesting of users’ daily and routine activities is a key component
    of what Nick Srnicek has described as ‘Platform Capitalism’. Srnicek’s work analyses
    the way in which commercial practices based on data gathering and analysis are
    now producing a new kind of economy:


    Platforms are a new type of firm; they are characterised by providing the infrastructure
    to intermediate between different user groups, by displaying'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'monopoly tendencies driven by network effects, by employing cross-subsidisation
    to draw in different user groups.


    (Srnicek, 2017: 48)


    As such, Srnicek presents a comprehensive description of the way in which, in
    the age of the Siren Server, different companies have developed different methods
    to exploit the web’s gold rush of digital information. Central to the question
    of how a blockchain-based platform such as Steemit operates is Srnicek’s use of
    the terms ‘network effects’ and ‘monopoly tendencies’, since both ideas find expression
    in the way that Steemit is emerging as a challenge to conventional ways of approaching
    the design and use of social media. For Srnicek, not only has the platform model
    established itself as a key component motor of the twenty-first-century global
    economy, it is also altering the way in which we engage with online networks.
    In addition, ‘by providing a digital space for others to interact in’ (Srnicek,
    2017: 48) at a more fundamental level, platforms are evolving the way in which
    we think about the production and distribution of music and music-related media,
    owing to the fact that so much of the contemporary music economy only exists within,
    and by virtue of, platform environments.


    The extent to which platforms such as Facebook, Google, Uber and Spotify have
    created processes to enable them to extract and exploit data from a range of sources
    is now widely recognised, and to an extent accepted, suggesting that our conception
    of the Internet and the types of practice that it affords is now at some remove
    from the non-market, participative cultures of the future that Leadbeater, Gauntlett
    and Benkler described. Latterly, Lanier’s and Srnicek’s analyses have been designed
    to show that whilst non-commerciality and sharing may be an experience that occurs
    at an interpersonal or local level, such transactions and exchanges are simply
    one aspect of a complex web of com-modified information flows. Furthermore, although
    collaborative and non-commercial creativity once occupied an area of discourse
    that anticipated a future Internet that was not wholly profit driven, Srnicek’s
    analysis would suggest that the opposite may well be the case and that platformisation
    is driving towards a hyper-monetisation of the online environment, where even
    the thought of a non-commercial web has become simply a quirk of history. In a
    latter-day digital landscape teeming with industrial information harvesters in
    the guise of commercial platforms, it is therefore little wonder that blockchain
    is often touted as the panacea that will finally cure the ills of our networked
    world, cutting out the ‘middleman’ of corporate exploitation and allowing us to
    keep hold of the ‘digital crumbs’ of our online identities (Tapscott, 2016).


    Clearly, Steemit and Creative Passport have emerged at a time when perceptions
    of the Internet are rapidly evolving. On one hand, the potential to integrate
    blockchain with a networked environment beyond its origins as an engine for cryptocurrency
    and anonymised exchange is considerable, whilst on the other, in the context of
    our current fixation with protecting privacy'
