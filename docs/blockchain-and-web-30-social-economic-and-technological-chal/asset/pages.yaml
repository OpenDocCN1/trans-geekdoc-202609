  md: '(Malik and Butt 2017)) and indeed can potentially demotivate workers if those
    being watched feel unsafe and lack a sense of ownership, or respect within that
    process (D’Urso 2006), nevertheless they provide useful evidence of a problem
    when issues do arise, as they can in remote teams. Each team interviewed preferred
    the transparency and camaraderie of face-to-face teamwork (which can also mitigate
    the risk of system gaming) but also valued the availability and skill of remote
    workers.


    Any ability to ease the administrative load through automation systems was generally
    welcomed. The teams that used manual dev logs regarded them as an invaluable work
    management resource and an essential aspect of their practice but also time consuming
    and easy to forget, so they require constant reminders and value reiteration.
    When doing so, care needs to be taken to ensure that they don’t overly formalise
    the creative development process and introduce the sort of prescriptive rigidity
    that Reijers and Coeckelbergh (2018) refer to, however.


    Thus, there is a lot to be gained by sharing those records beyond the immediate
    team in order to build up a collective knowledge that enables the entire sector
    to price and schedule itself and potentially also share the costs of machine learning
    analytics that support efforts to work smarter rather than harder. Ideally, such
    records would either be anonymous, or to some extent private, so that individual
    workers aren’t publicly compared without their consent and penalised as a result
    of these comparisons (a fear expressed by at least one young developer). It is
    also likely to be important that individual contributors have the right to share
    ownership of that data so that they have the option to co-opt their own work record,
    for example, and make it simultaneously available for potential recruiters in
    an automatically updated profile feed (another possibility which a few developers
    discussed, with interest).


    What blockchain registration of creative IP offers is at this point unclear. Although
    creative commons licenses have been recognised in European courts of law (CreativeCommons
    2018), the legal status of blockchain registration is still quite abstract. Blockchain
    registration systems like Ascribe, for example, are more likely to grant a sense
    of ownership rather than guaranteed legal recourse (Christies 2018). It is also
    worth bearing in mind that company registration regulations may well be complex
    for a reason, such as to ensure that companies adhere to fair trade principles.
    Without some mechanism to also promote ethical business practice, blockchain business
    registration risks becoming a strategy for compliance avoidance. Nevertheless,
    for start-ups, the process of forming a limited company can seem overwhelmingly
    complex and prohibitively costly (one participant wondered whether that was the
    point in order to prompt lucrative fines), so there is value in exploring simpler,
    more streamlined test bed structures. It may be that future solutions to the challenge
    of keeping legislative pace with the fast-changing nature of digital disruption
    is to partner something like the Global Tal Registry with a more flexible and
    responsive ethics review board system. One participant suggested that these semi-formal
    alternatives'
