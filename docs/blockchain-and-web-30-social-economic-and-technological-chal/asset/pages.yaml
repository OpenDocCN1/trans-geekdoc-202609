    # Figure 16.3 The MICMAC Analysis of Success Factors of blockchain-based crowdfunding


    Quadrant IV – Independent variables: Factors in this quadrant have strong driving
    and weak dependence power. As shown in Figure 16.3, one factor, founder dedication,
    is classified in this quadrant.


    # Discussion


    Our study revealed various determinants for the success of blockchain-based crowdfunding
    campaigns and depicted the intertwined relationships among different categories
    of success factors, both project related and campaign related.


    A confrontation of Table 16.1 and Table 16.2 surfaces the fact that only a few
    success factors reported in literature are actually used in practice by ICO evaluation
    websites. In contrast, these websites are using many new success factors that
    are not reported in literature to evaluate ICOs. On the one hand, we could question
    the scientific and theoretical base of the evaluation mechanisms employed by these
    websites; on the other hand, it can be argued that, due to the fast development
    of the blockchain landscape, the gap between research and practice would always
    exist. Our study is one proof of it.


    In the resulting model (Figure 16.2), we could see that the campaign-related factors,
    summarized into four categories, all sit at the top half of the model. They are
    relevant for the success of a crowdfunding campaign, but they are not as fundamental
    as project-related success factors, most of which are located in the bottom half
    of the model.


    White paper quality, as a campaign-related success factor subcategory, is intrinsic
    to blockchain-based crowdfunding but has only been covered by a few recent papers
    due to limited literature on the topic. In comparison, from the analysis of the
    evaluation websites, we found more factors related to white'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'paper quality: white paper comprehensiveness, white paper readability, and
    informativeness of white paper. The white paper quality category is a linkage
    variable lying in the middle of the model and therefore has both high dependency
    power and high driving power (as shown in Figure 16.3). The containing factors
    seem to be dependent on several underlying factor categories such as product quality,
    team experience, project innovativeness and team composition and influence several
    other factor categories including social media traction and campaign transparency.


    Another two campaign-related factor categories, campaign traction and campaign
    design, are both heavily dependent on nearly all other categories and have little
    driving power. Several factors connected to the campaign traction category have
    been covered in the literature such as investors with large investments, early
    investments, number of early backers and average analyst rating. On the rating
    websites we found only average analyst rating is used in ICO evaluations, and
    no new factors were identified. In terms of campaign design, it is the most covered
    factor category in literature as well as on the evaluation websites. We found
    15 factors covered in the literature; on the evaluation websites, we found five
    overlapping factors and nine new factors. Campaign design is a dependent variable
    with weak driving but strong dependence power (as shown in Figure 16.3). It is
    influenced by and influences social media traction.


    The fourth campaign-related factor category is campaign transparency. The contrast
    of Table 16.1 and Table 16.2 reveals that campaign transparency as an important
    factor category is somehow overlooked by the literature, which only reported two
    factors that can be considered relevant, that is, information transparency about
    the startup and code source is available. In contrast, ICO Monitor, one of the
    three ICO evaluation websites, puts quite significant focus on campaign transparency,
    as demonstrated in Table 16.2, and uses many concrete factors to evaluate the
    transparency of an ICO. Among these factors, many are related to the use of smart
    contracts to control ICO in a transparent manner.


    The project-related factors are subdivided into ten factor categories. They are
    located in all but one of the five hierarchy levels in the model. All Level V
    and Level IV categories are within this group. Most of them are in Level IV. The
    most fundamental factor, which is at the lowest level (Level V) of the model and
    the only element at that level, is founder dedication. We expected that the strong
    commitment of founders would impact the success of their crowd-fundraising initiatives,
    but the model highlighted how important and fundamental its impact could be. Surprisingly,
    the literature covers only two factors – loyal CEO and financial commitment. On
    the evaluation website, we found only one factor, committed founding team. Founder
    dedication has a strong driving and weak dependence power, and interestingly,
    it has a mutual influencing relationship with the strong early adopters category.


    The second lowest level (Level IV) of the model is a dense layer. The linkages
    among the categories in this level are intensive, with quite a few of them bidirectional.
    It implies that company, team, project and product,'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'the fundamental elements of a venture, always play the key role, even in a
    new and somehow unconventional fundraising mechanism. One category, company characteristics,
    has been covered in the literature, with industry, location and IPO exit strategy
    as three factors belonging to this category. Analysing the evaluation websites,
    we found IPO exit strategy as an overlapping factor and six new factors (see Table
    16.2). Company characteristics is a key variable and would impact on team composition
    and strong early adopters. It is not surprising to see company characteristics
    influence other factors; however, it is somewhat surprising to see a mutual influence
    between it and team experience as well as project innovativeness, which means
    that the latter two could impact on company characteristics. It could be argued
    that truly innovative companies in the blockchain space need to choose a certain
    favourable jurisdiction to set up, and therefore the location of the company could
    be influenced project innovativeness. In the meantime, more experienced teams
    could choose better company designs than less experienced teams.


    Team categories, i.e., team experience and team composition, are located in the
    same level. Team experience acts as a linkage variable in our model, with strong
    driving and strong dependence power. On the evaluation websites, we find team
    previous blockchain experience and team related industry experience an important
    factor for ICO success. Similarly, team composition is also a linkage category,
    dependent on founder dedication and company characteristics and driving white
    paper quality, project innovativeness and product quality. Furthermore, it has
    a mutual influence with team experience. It is worth noting that one specific
    factor in the team composition category – companies looking for key team members
    – is considered negative and therefore has an adverse impact on the crowdfunding
    success. This indicates that blockchain-based crowdfunding backers also consider
    team related factors as an important investment evaluation variable.


    Project innovativeness is also at Level IV. In the literature, we found only intellectual
    capital (patents) in the category of project innovativeness. On the evaluation
    websites, more factors were observed. As a linkage variable, product innovativeness
    is dependent on founder dedication and team composition, driving white paper quality,
    product quality and strong early adopters, and meanwhile having mutual influence
    with company characteristics and team experience.


    In the same Level IV, there are product stage and product quality. In terms of
    product stage, we didn''t find any new factors in the analysis of the evaluation
    websites. On the other side, product quality as a category only emerged in the
    analysis of the websites, not from the literature. What the specific factors are
    that can indicate product quality is yet to be understood. Both product stage
    and quality can influence strong early adopters.


    It is somehow unexpected to see that strong early adopters appears in the same
    level with other more fundamental factor categories related to company,'
