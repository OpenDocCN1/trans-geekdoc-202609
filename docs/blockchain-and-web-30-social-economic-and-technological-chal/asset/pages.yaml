  md: 'any personal information put to ‘open blockchain networks’ offers radical transparency
    that cyberlibertarians enact with pseudo–anonymous technologies of distributed
    record keeping. Rather than have personal data stored away to be cross–tabulated
    with select third parties at Facebook, or delisted to obscurity by Google, or
    discretely syphoned by security agencies, personal data on blockchains – by their
    nature – are available to publics concerned enough to look and connect the bits.


    Proponents suggest that this fact, among other unique aspects of blockchain technology,
    offer a model of oversight that upends risk and opportunity in current social,
    economic, and legal regimes. This utopian vision, we argue, is mostly unproven,
    even readily disproven. What is proven, or at least written in the histories of
    radical and decentralising new media of the past, is the double movement of a
    tide of excitement rushing in that is later swept away, leaving the ground underfoot
    radically changed, nonetheless. We suggest a homologous movement is ongoing with
    blockchain: a similar utopian vision dominates, the radical potential is present,
    and yet uptake is moving to centralised banking corporations – the antithesis
    to cryptocurrencies – adopting blockchain. We argue that Bitcoin’s tide – its
    expansive flow – has already peaked and suggest a re–conscription towards structural
    absorption is underfoot. To provide some context to this expansion–contraction
    relationship, we briefly turn to disruptive media that foreshadow blockchain’s
    deployment and social integration: CATV and the popularisation of the Internet
    itself.


    # Networked for whom?


    Community access television (CATV) and the World Wide Web (WWW), as once–new,
    now–common media, might seem like strange examples from which to profess understanding
    blockchain. Yet a brief recount of their history provides insight for Bitcoin’s
    current ideological construction and its arc of emerging practices. In separate
    times and contexts, both cable television and the Internet’s popular turn to WWW-based
    access initially appeared to be radical reconfiguring of networks. As Hu (2015,
    25) points out, the US Federal Communications Commission considered CATV as a
    way for hierarchical power structures and centralised control of content creation
    to be evened out by a two-way participatory media environment where feedback was
    content and value was found in decentralising voice.


    Under CATV, various community channels sprung up on ‘cable’ that precipitated
    a shift in what public broadcast could be. This led to decentralisation of media
    practices beyond state–run public broadcasting services to local and varied content
    by actors that were sometimes individuals, using the greatly lowered barriers
    to entry that video afforded. Access to CATV was envisioned as radically democratic.
    Indeed Joselit (2002, 153) points out how the emergence of CATV enabled ‘openness
    to unconventional television [that was] seized upon by a raucous community of
    video artists and activists equipped with a'
