- pgno: 161
  md: 'Finally, blockchain is considered Web 3.0 in that its resources and effects
    do not have to be merely informational: they do not control or inform supply chains,
    they are supply chains; they do not offer data that affect currencies, they are
    currencies. Blockchains disrupt outside of informational constraints that previous
    disruptive communication technologies have been held within. Blockchain purports
    to offer a capacity for durable connections from material objects and actions
    in a way that is relatively unique for networked protocols, code, and data. If
    in the McLuhanese sense media offers us extensions of self, blockchain flips that
    logic on its head, instead offering distributed active physical processes extensions
    back into human-consumed media ecologies.


    To take a moment to explore this ontological peculiarity somewhat further, consider
    how distributed ledgers afford a distributed permanence and action-oriented ontology
    that differs from previous conceptualisations of networked data. With action-oriented
    ontology, we play against the object-oriented ontology deployed by media scholars
    (see Arnold 2003; Parikka 2012) to point out that the makeup, meaning, and importance
    of the mediated world that blockchain creates is fashioned through considering
    the importance of ever-evolving action-rules outside of human consciousness –
    this, rather than considering the importance of external objects. It is the computational
    facility to action others – or blockchains as their own motive facilitators –
    that create objects (contracts, coins, ledgers, users). This further degrades
    a humanist position in the mediated world and reflects the ideal of trustless
    systems that developers create to obviate not only central institutions but fallible
    humans. No longer are we merely one of many objects, we are now mere subjects
    acted upon in action-oriented flows of irrevocable ledgers that provide shape
    to what is and how it may relate to other action-flows.


    More practically, the distributed permanence of blockchain offers regulators,
    or other humans caught in its grasp, a seemingly Sisyphean task of stopping the
    signal. Whether prosecuted via policies that try to stop the circulation of the
    Anarchists'' Cookbook, or implement a General Data Protection Regulation (GDPR)-type
    assurance for erasure on request, the removal of data from a blockchain would
    influence every other piece of data up the chain. This distributed permanence
    is suggested by blockchain advocates to be a fundamental feature and, quizzically,
    an action-oriented solution for any such GDPR-esque privacy concerns:


    > > Legitimate privacy concerns are best addressed not through law, but through
    decentralizing technology itself. Open blockchain networks, cryptocurrency, and
    general encryption are the backbone of a new more secure and private Internet
    on which individuals have more control over their data, and firms are less incentivized
    to track and spy on their users.

    > > (Brito 2018)


    While that is framed to highlight user autonomy, the distributed permanence of
    blockchain suggests that spying will be unnecessary. In the described instance,'
