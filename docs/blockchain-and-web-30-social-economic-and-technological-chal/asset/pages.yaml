- pgno: 1
  md: 'Blockchain is no longer just about bitcoin or cryptocurrencies in general.
    Instead, it can be seen as a disruptive, revolutionary technology which will have
    major impacts on multiple aspects of our lives. The revolutionary power of such
    technology compares with the revolution sparked by the World Wide Web and the
    Internet in general. Just as the Internet is a means of sharing information, so
    blockchain technologies can be seen as a way to introduce the next level: sharing
    value.


    *Blockchain and Web 3.0* fills the gap in our understanding of blockchain technologies
    by hosting a discussion of the new technologies in a variety of disciplinary settings.
    Indeed, this volume explains how such technologies are disruptive and comparatively
    examines the social, economic, technological and legal consequences of these disruptions.
    Such a comparative perspective has previously been underemphasized in the debate
    about blockchain, which has subsequently led to weaknesses in our understanding
    of decentralized technologies.


    Underlining the risks and opportunities offered by the advent of blockchain technologies
    and the rise of Web 3.0, *Blockchain and Web 3.0* will appeal to researchers and
    academics interested in fields such as sociology and social policy, cyberculture,
    new media and privacy and data protection.


    **Massimo Ragnedda** is a senior lecturer in mass communication at Northumbria
    University, Newcastle, UK.


    **Giuseppe Destefanis** is a lecturer in the Department of Computer Science at
    Brunel University, UK.'
  merge: -1
  img_proc: true
