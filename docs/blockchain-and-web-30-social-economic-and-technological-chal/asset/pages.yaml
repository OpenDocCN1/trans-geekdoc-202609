  md: '# SmartAnvil


    Open-source tool suite for smart contract analysis


    Stéphane Ducasse, Henrique Rocha,

    Santiago Bragagnolo, Marcus Denker,

    and Clément Francomme


    # Relevance: the need to support tool building


    Solidity''s smart contracts are new computational units with special properties
    [Eth18c]: they act as classes with aspectual concerns; they respond to message
    calls as a remote object; their memory structure is more complex than that of
    mere objects; they are obscure in the sense that, once they are deployed, it is
    difficult to access their internal state; and they reside in an append-only chain.


    There is a large spectrum of possible analyses that smart contracts could benefit
    from [DMO+18]. Some have already been proposed in the literature and others, not
    yet. Here is a non-exhaustive list: attack analysis [LCO+16, ABC17], general metric
    [TDMO18] and dedicated smart contract metrics analysis, gas consumption optimization
    [CLLZ17], gas cost prediction, dashboard [Few06], or contract visualization [ABC+13],
    to name a few.


    There is a need to support the building of new generation tools to help developers
    [DMO+18]. Such support should tackle several important aspects, taking into account
    the specificities of smart contracts: (1) the general structure and semantics
    of contracts, (2) the object nature of published contracts, and (3) the overall
    chain composed of block and transactions. Several analysis tools exist such as
    Oyente [LCO+16], BlockSci [KGC+17], and others [BLPB17, BDLF+16, Eth18b] but to
    the best of our knowledge, they focus on a single aspect of smart contracts, either
    static analysis or collecting mere data.


    In this chapter, we present SmartAnvil, an open platform to build software analysis
    tools around various aspects of smart contracts. We illustrate the general components
    and we focus on three important aspects: support for static analysis of Solidity
    smart contracts, deployed smart contract binary analysis, and blockchain navigation
    and query. SmartAnvil is open source and supports a bridge to the Moose data and
    software analysis platform.


    The contributions of this article are the descriptions of several components that
    compose the SmartAnvil open-source platform. The outline of the article is the
    following: First, we describe the general architecture and components of the platform.
    The next section describes the low-level components for static analysis, and then
    the low-level components to interact and analyze deployed'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'contracts. Next we describe blockchain navigation and query support. The

    next to last section discusses the future extensions on the platform and also

    presents the related work on blockchain analysis platforms. Finally, we make

    our final remarks and conclusions.


    # SmartAnvil: open platform architecture


    The SmartAnvil open platform is structured around several components to

    cover the different aspects of smart contract analysis. Figure 13.1 shows the

    key elements that we describe in the following. While SmartAnvil can work

    in isolation, SmartAnvil interacts with the Moose data and software analysis

    platform [NA05].


    # Solidity structural components


    **Parser/AST (SmaccSol).** The first basic but important component for

    static analysis is a parser/AST. The component SmaccSol offers a full

    parser and AST model for Solidity. It is based on the Smacc Compiler-

    Compiler framework [LBGD18, BGLD17]. This parser corrected early

    grammar errors of the Solidity language [RDDL17].


    **Graph (SmartGraph).** Based on SmaccSol, the SmartGraph component

    builds a semantic tree, where it enforces the rules that cannot be defined

    in syntax level. It also defines scopes, allowing one to easily lookup re-

    fined components, such as methods, types, parameters, arguments,

    contracts, etc. It supports powerful analyses and graph-like navigations by

    using simple queries over the tree. This component allows one to easily

    do static annotations or to build call-graphs.


    **Software Metrics (SmartMetrics).** This component mixes the infor-

    mation provided by the previous components and the information pro-

    vided by the Fog components supporting deployed contract analyses to

    offer a large set of metrics characterizing both the solidity code and the

    deployed contracts.


    ![](img/a0011e82f3a3a41227dc70cd0ddb893a_207_0.png)


    Figure 13.1 SmartAnvil components'
