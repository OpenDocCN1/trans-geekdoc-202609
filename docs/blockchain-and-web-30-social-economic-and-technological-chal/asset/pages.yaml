  md: 'and is the second most popular blockchain after Bitcoin. The latter runs on
    a permissioned and private blockchain explicitly conceived to support business
    organizations in managing their own business logic, providing the option to decide
    the desired blockchain setup, and runs “chaincode” (the equivalent of smart contracts)
    written in various programming languages, mostly in GO (https://golang.org/).


    This new scenario opened up the possibility to develop decentralized software
    applications exploiting the intrinsic blockchain features of transparency, immutability,
    anonymity, and integrity of information already reported earlier. Nevertheless,
    the blockchain technology is not solely good news; mainly due to the fact that
