  md: 'would be 1. And in practice, such tendencies have become intractable for some
    of the more established cryptocurrencies like Bitcoin and Litecoin, whose oligopolistic
    mining networks are dominated by a small number of large pools; over 90 percent
    of Bitcoin’s hashrate is distributed amongst just eight mining pools, with the
    four largest pools accounting for approximately 70 percent of the network’s processing
    power.⁴


    In the face of this competitive breakdown, Bitcoin and other proof-of-work cryptocurrencies
    effectively depend upon the good will of mining pools to never exceed the 50 percent
    hashrate mark, and there is no intrinsic failsafe to ensure that such a scenario
    could never transpire. In other words, the spectre of governance reinserts itself
    into Bitcoin’s blockchain in the form of the decisions that a small, unelected
    cabal of mining pools make, who could collectively amass the kind of power to
    debase Bitcoin, given enough hashing power. The similarity here with the kind
    of arbitrary central bank power that Nakamoto decried is glaring.


    # Value


    The second problem for the monetary validity of cryptocurrencies has been the
    erratic and unpredictable changes in value that most cryptocurrencies suffer from,
    with the price of a single Bitcoin having seen a spectacular rise in 2017 only
    to subsequently collapse at the beginning of 2018 (see Figure 2.1).


