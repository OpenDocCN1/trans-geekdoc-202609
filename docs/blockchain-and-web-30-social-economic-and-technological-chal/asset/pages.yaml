    # 5. Regulatory implications and potential from the use of smart contracts in
    ODR


    The claimed potential of blockchain-based smart contracts is to make complex exchanges
    more transparent and reduce the means of undesired interference with transactions.26


    However, traditional regulators like central banks and governments need to adapt
    to the possibilities and limitations of the new regulatory space. Concerning the
    regulation of smart contracts in ODR systems, this means striking a balance between
    the efficient processing of cases and creating an inclusive environment for increased
    participation, allowing those participants with fewer social resources to redress
    their interests in a more efficient way. Both increases, in efficiency and participation,
    may be gained by standardizing processes in code. Taking the EU ODR platform as
    described in our model as an example, EU-wide legal regulatory standards become
    easier to implement; at the same time, all participants can be given both the
    right and means to access and view the transaction record and, on a voluntary
    basis, provide feedback for the decision-making process. Importantly, a record
    of all feedback is kept, and attempts to abuse the mechanism can be tracked. In
    the following, we discuss the changed nature of co-regulation, with a particular
    focus on errors in smart contracts and regulatory implications.


    # 5.1 Changed nature of co-regulation


    This new model does not preempt regulatory manipulation as it exists in traditional
    models of regulation. Governments can still mandate certain functionality in smart
    contracts, and they can be authors of ODR smart contract templates. Co-regulation
    takes place but changes of nature: in this context, it means that many more actors
    have equal rights to view and provide feedback on the processes built into smart
    contracts. Co-regulation would imply a combined approach of regulating by code
    and regulating by law. However, in such a hybrid co-regulation approach, many
    principles need to be further clarified: how is access control defined, i.e.,
    which parts of smart contracts can be activated, updated, or deactivated, by whom,
    and under which conditions?


    This form of co-regulation opens participation in the regulatory process to any
    interested actor. Primary actors include the traditional actors as we know them
    from the regulation of financial systems, but also new intermediaries (brokers,
    dealers, and other entities interacting with end users) and finally individual
    consumers. Traditional regulators as we know them from the current financial system
    continue to exist but would adopt an additional role: the templated processing
    of ODR cases allows decisions to be analyzed on a much'
