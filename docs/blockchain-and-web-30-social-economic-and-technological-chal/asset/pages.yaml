    position challenges the prevailing notion of technology as neutral and value free.
    In the 1990s, feminist scholars celebrated the emancipatory potential of the Internet
    to close the gap of gender inequalities (Haraway, 1991; Plant, 1997; Turkel, 1995).
    Yet these claims in many ways fell short, leaving the corporeal realm behind.
    Technofeminism builds on Haraway’s vision, conceiving of technology as both a
