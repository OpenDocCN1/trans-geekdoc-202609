    In Tonelli, Pinna, Baralla and Iba (2018), an approach to the implementation of
    microservices by means of an architecture based on smart contract deployed in
    the Ethereum blockchain is presented. The architecture has two levels. The first
    level provides the ABI (the Ethereum application binary interface) for software
    applications and the user interface in which ABIs are embedded. The second layer
    is composed by the set of smart contracts running in the blockchain. In the model,
    each microservice is implemented by means of an atomic smart contract. Communication
    between levels takes place with remote procedure calls, through the Web3 Ethereum
    library 3, which includes the execution of blockchain transactions.


    In Lenarduzzi, Tonelli, Marchesi and Lunesu (2018), the management of Scrum/Kanban
    Agile software projects is designed by means of blockchain applications. The duties
    of the project owner for certifying the correctness of the outcomes are delegated
    to one or more smart contracts deployed on the Ethereum blockchain and written
    in Solidity. In the model, an agreement with the customer allows the smart contracts
    to automatically enable payments and to introduce penalties or grants on the basis
    of the outcome. Product owner duties and work can thus be relieved, allowing the
    allocation of resources to more profitable and productive tasks.


    In Marchesi, Ortu, Tonelli, Destefanis, Bracciali and Hierons (2018), the digital
    wallets produced by Parity for holding and exchanging Ethers among blockchain
    addresses and accounts in the Ethereum blockchain are examined, investigating
    problems that can arise with particular smart contract features. The paper analyzes
    a'
