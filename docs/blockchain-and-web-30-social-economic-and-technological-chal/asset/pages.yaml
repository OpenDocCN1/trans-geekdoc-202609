- pgno: 15
  md: '# Blockchain


    # A disruptive technology


    Massimo Ragnedda and Giuseppe Destefanis


    # Introducing blockchain


    Blockchain is no longer just about bitcoin or cryptocurrencies in general, but
    it can be seen as a disruptive and revolutionary technology which will have a
    major impact on multiple aspects of our lives. The revolutionary power of such
    technology can be compared with the revolution sparked by the World Wide Web and
    the Internet in general. As the Internet can be seen as a means for sharing information,
    so blockchain technologies can be seen as a way to introduce the next level: blockchain
    allows the possibility of sharing value.


    The problem solved by a blockchain is “consensus”. It revolutionizes the concept
    of trust, introducing elements for generating disruption in the financial sector.
    Currencies are therefore the first concept which can be implemented upon such
    technology, but this is only the premise. Satoshi Nakamoto conceived the Bitcoin
    electronic cash system in 2008 with the aim of producing digital coins whose control
    is distributed across the Internet rather than owned by a central issuing authority
    such as a government or a bank. It became fully operational in January 2009, when
    the first mining operation was completed, and since then it has continuously seen
    an increase in the number of users and miners. In the beginning, the interest
    in the bitcoin digital currency was purely academic, and the exchanges in bitcoins
    were limited to a restricted elite of people more interested in the cryptography
    properties than in the real bitcoin value. Nowadays bitcoins are exchanged to
    buy and sell real goods and services, as happens with traditional currencies.


    # Distributed infrastructure


    The main distinctive feature introduced by the Bitcoin system is the distributed
    infrastructure where all the transfers are recorded. To send and receive bitcoins,
    a user needs an alphanumeric code called an address. An address can be seen as
    a bank account number and can be the recipient of funds. An address is public
    information derived from a public key. No personal information is recorded in
    a blockchain, and for this reason, the Bitcoin protocol offers pseudo-anonymity.
    The consensus mechanism allows agents to transfer “value” without having a'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'third party involved in the process, which guarantees that the source actually
    owns that value which it wants to transfer and which guarantees that the recipient
    receives (or not) the value being transferred. The elimination of this third trusted
    party is a major breakthrough. If we think about how banks work at the moment
    and what they actually do, it is immediately clear that banks match the definition
    of trusted third parties. The bitcoin blockchain allows the transfer of value
    without a third party. The disruptive potential of the bitcoin consensus algorithm
    is enormous. The fact that all the transactions are public and it is not possible
    to delete them is the key which lets the consensus algorithm work. The whole transaction
    history (from the first that occurred) is accessible by anyone (any agent which
    wants check what happened from the genesis), and it cannot be changed.


    Consensus is linked with another two elements necessary to let this technology
    work: peer-to-peer networks and cryptography. The blockchain is built upon a peer-to-peer
    network, and anyone willing to join the network can do it without asking permission
    from anyone. Each node of the network exposes a constantly updated version of
    the blockchain, and this fact gives the possibility (to each node) to verify old
    and new transactions and to decide if they are valid or not. There is no possibility
    of “double spending”, and by eliminating this possibility, distributed ledgers
    introduce the concept of digital scarcity.


    Introducing scarcity in a digital world has been extremely complex. Scarcity and
    digital are almost opposite concepts, if we think, for instance, how easy is to
    duplicate a file (a music file, a document, a film). Speaking about money, it
    is easy to understand the concept of scarcity: if we have a banknote, we are sure
    that that banknote is unique, no one else can have the same one, and if someone
    tries to “make a copy” we are aware of the fact that the action is classified
    as illegal. Governments, banks, laws and agreements protect a fiat currency from
    the double–spending problem.


    # From Web 1.0 to Web 3.0


    The advent of blockchain technology brings a new era in the web, what here we
    define as the Web 3.0. The first era of the Internet was mainly characterized
    by information carried by static websites without any possibility of interaction.
    It was primarily made by information portals with flat data where users could
    “only” read and were not allowed to add any comments, reviews or feedback. A paradigmatic
    example of this first era of the Internet is the British Encyclopedia (or any
    other traditional encyclopedia) that “simply” digitalizing the content, moving
    the information from offline to online but without giving the possibilities to
    users to interact and generate new content. The Web 2.0, or second stage of the
    World Wide Web’s evolution, is characterized by the possibilities to interact,
    share information, add content and exchange data. This era, also known as participative,
    gives the possibility to all users to participate, generate content online (user-generated
    content) and easily interact with other users (usability).'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'One of the paradigms of this new era is Wikipedia, which, in contrast with
    the British Encyclopedia, can be written (and not only read) by users. The shift
    is from the “readable” phase to the “writable” phase, from passive users (simply
    consuming contents) to active users (becoming active creators of content), from
    the static to the dynamic web. In this vein, another paradigmatic example of this
    new phase is given by the advent of social media, which encourages participation
    (Jenkins, 2006), information sharing and collaboration.


    The advent of blockchain technologies brings the third era of the web, the so-called
    Web 3.0. This new era allows the transfer of value.


    The Web 3.0 is based on decentralization, without points of control and unique
    profit centres. The blockchain enables the transfer of value without a centre
    of profit or monopolistic service providers. While the advent of social media
    allowed the exchange of information among users but kept the control among a few
    private actors (generating digital oligarchy with social media companies, peer-to-peer
    ridesharing, peer-to-peer hospitality networks), blockchain technologies allow
    the possibility of creating decentralized networks without centralized points
    of control. From this stems one of the disruptive aspects of this technology that
    will enable to operate on a decentralized system without any central centre of
    profit in charge of coordinating (and taking advantage of) the network. Blockchain
    technology allows the secure transfer of information, assets and money without
    a third-party intermediary, such as banks or other financial institutions (Swan,
    2015: 15). These third-party intermediaries are not limited to banks, but it also
    includes the economic platforms of the shared economy and Web 2.0, which make
    a profit from each transaction, and popular social media platforms, which make
    profits using users’ data.


    A blockchain can be used also as a backbone infrastructure for running smart contracts,
    particular decentralized applications which can be seen as computer programs executed
    by participants in a blockchain. Smart contracts are an additional disruptive
    factor and have gained tremendous popularity in the past few years, to the point
    that billions of US dollars are currently exchanged every day through such technology.
    However, since the release of the Frontier network of Ethereum in 2015, there
    have been many cases in which the execution of smart contracts managing Ether
    coins lead to problems or conflicts. Smart contracts rely on a non-standard software
    life cycle, according to which, for instance, delivered applications can only
    be updated or bugs resolved by releasing a new version of the software. Furthermore,
    their code must satisfy constraints typical of the domain, like the following:
    they must be light; the deployment on the blockchain must take into account the
    cost in terms of some cryptovalue; their operational cost must be limited; and
    they are immutable, since the bytecode is inserted into a blockchain block once
    and forever.


    The idea of a smart contract was originally described by cryptographer Nick Szabo
    in 1997 as a kind of digital vending machine. In his paper (Szabo, 1997), he imagined
    how users could input data or value and receive a finite item from a machine.'
