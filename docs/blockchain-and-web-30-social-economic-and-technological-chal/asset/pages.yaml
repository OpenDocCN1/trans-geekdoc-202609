  md: '![](img/a0011e82f3a3a41227dc70cd0ddb893a_313_0.png)


    Figure 16.2 The model of blockchain-based crowdfunding success factors


    # 5 MICMAC analysis of the success factor


    In the last step of analysis, we classified the 14 success factors into four clusters
    as depicted by four quadrants in Figure 16.3, using the values displayed in Table
    16.5 in terms of driving power and dependency power. It provides another perspective
    on these success factors.


    Quadrant I – Autonomous variables: Factors in this quadrant have both weak driving
    as well as dependence power; they are less connected to the system. As shown in
    Figure 16.3, no success factors were classified in this quadrant.


    Quadrant II – Dependent variables: Factors in this quadrant have weak driving
    but strong dependence power. As shown in Figure 16.3, all four campaign-related
    success factors are in this quadrant: campaign design, campaign traction, white
    paper quality and campaign transparency.


    Quadrant III – Linkage variables: Factors in this quadrant have strong driving
    as well as strong dependence power, i.e., they are influenced by lower-level variables
    in the model and meanwhile significantly impact other variables. As shown in Figure
    16.3, the majority of the factors (9 out of 14) are in this quadrant.'
  merge: -1
  img_proc: true
