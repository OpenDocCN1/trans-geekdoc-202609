- pgno: 55
  md: 'enforce copyright. However, the disruptive potential of the blockchain may
    manifest itself in preventing infringement altogether by allowing copyright owners
    to track the use of their works and by powering a global updated database of music
    metadata, which will make royalty distribution smoother and fairer.


    # # Conclusions


    The blockchain, at least in its permissionless form, has the potential to disrupt
    copyright law by resolving two of its problems, namely registration and infringement.


    Currently, there are no reliable registers of copyright ownership, which creates
    problems of evidence, because it is difficult for claimants to prove the link
    between them and the infringed work, as well as to prove the time of creation.
    Current registration systems are prone to forgery, can be used as a means of censorship,
    are cumbersome, and are unfavourable to anonymous authors. A blockchain-based
    registration mechanism would resolve this problem by providing the means for a
    tamper-resistant, censorship-resistant, user-friendly, and privacy-friendly platform.


    As to copyright infringement or piracy, this is on the rise because owners cannot
    track the use of their works and because it is often difficult to know who the
    owners are, which in turn makes it virtually impossible to seek a license and
    pay the royalties. However, using the blockchain, artists could decide to transfer
    music by transferring a token signing off on the transaction with their private
    key. No unauthorised use would be possible. The blockchain, moreover, would allow
    the creation of global, constantly updated music metadata that would make it easier
    to find and reward the copyright owners.


    It is too early to assess whether blockchains will disrupt the music industry
    and fix all the problems of copyright, a body of law whose inadequacy for the
    digital age is striking (on the compatibility of the blockchain with some copyright
    principles see Bodó, B., Gervais, D., and Quintais, J. P. (2018). Blockchain and
    smart contracts: the missing link in copyright licensing? International Journal
    of Law and Information Technology, 26(4), 311–336). From this analysis, however,
    it would seem that blockchains could contribute to the resolution to some problems
    encountered by copyright owners and authors. In order to succeed, these potential
    solutions must be accompanied by a twofold caveat. First, the immature blockchain
    technology must overcome its technical issues to prove, beyond doubt, that it
    is a better proposition than the technology it is replacing. Second, it will have
    to appease the current regulatory framework to allow these technological advancements
    to achieve large-scale adoption. Whilst new regulations are not necessarily the
    best way forward, regulators should work closely with law academics and industry
    stakeholders to clarify how existing laws apply to this new technology. Indeed,
    without legal certainty, the blockchains are unlikely to unleash their disruptive
    potential.'
