  img_proc: true
- pgno: 98
  md: 'deliberately chosen to help articulate those potential nuances in an easy-to-use
    and yet also tangible visual and kinaesthetic format.


    For this task, each team member was asked to place a stack of coloured blocks
    like dominos on a piece of butcher’s paper, so that each individual stack would
    represent a different team member. Each member was also asked to represent their
    fellow team member’s comparative level of contribution by changing the height
    of the stack. Beyond these two directions, each interviewee was invited to freely
    choose the colour and placement of each block on the page. Whilst they did so,
    each participant was encouraged to explain their choices. Participants were also
    asked to complete the representation by drawing lines between the stacks in order
    to show the lines of communication between the various team members.


    Although photos of these team work development maps are shared in this paper,
    for the sake of privacy, the interview transcripts are kept private, and the researcher
    did not share them with the rest of the team without the relevant permission of
    those individuals concerned. This sort of subjective documentation can’t be taken
    as a “mirror” of an event, but the comparison of these individual “selective interpretations”
    (McCarthy and Wright 2004: 119), where some details can be withheld depending
    on what participants deem relevant or how they frame their perspective of their
    individual role within a group dynamic, can also help to build a more multidimensional
    view of the team experience.


    Bias in participant demographics was difficult to avoid due to the male-dominated
    nature of the gaming industry (Gray, Buyukozturk, and Hill 2017), and in the case
    of Franzfuser competition, a focus upon recent graduates. Participants were generally
    between the ages of 20 and 30 years old, and most had experience of undergraduate
    education, although some team members were also working on these projects as contractors.
    Only one of the 16 core team members interviewed was female, whilst two of the
    participants interviewed on location in the Franzfuser stand were also female.


    In addition to the in-depth, individual net-mapping interviews, 36 members of
    the general Franzfuser cohort were asked a shorter series of three questions:


    +   1 What can you tell me about your experience using the Global Tal Registry?

    +   2 Are you aware it is intended to be a blockchain registration system? Would
    blockchain registration change your decision to use it again?

    +   3 What are your thoughts about also potentially sharing (anonymised) information
    on workflows, platforms, working processes and times with the broader gaming community
    using these sorts of secured, automated technologies?


