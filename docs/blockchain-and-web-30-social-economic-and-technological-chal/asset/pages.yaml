    user can just write a simple query (Listing 13.9).


    # Listing 13.9 Ukulele block query example


    ```

    1  SELECT instance.itemName, instance.terminate()

    2  FROM RmodProductContracts AS instance

    3  WHERE instance.owner = ''0xca35b7d915458ef540ade6068dfe2f44e8fa733c''

    4  AND instance.state = ''RECEIVED'';

    ```


    # Evaluation


    We compared Ukulele against Presto and Web3 on the supported features designed
    for acquiring data in the blockchain. The features we analyzed were the following:


    +   - **Query language**: The implementation offers a query language to specify
    the data you want to fetch. Lack of a query language can make it more difficult
    to acquire complex information.

    +   - **Group functions**: The implementation supports the use of aggregate (group
    by) functions. Lack of group functions limits transformation on the data and what
    it is possible to acquire.'
