  md: '# The logics of technology decentralization – the case of distributed ledger
    technologies


    Balazs Bodo and Alexandra Giannopoulou


    # Distributed ledger technologies and the ideology of decentralization


    In the history of the Internet there seems to be a recurring hope that open-source,
    decentralized, and distributed digital technologies would give rise to novel,
    revolutionary modes of social, political, and economic organization, which build
    upon and reflect the intrinsic characteristics of the underlying technology. Roughly
    twenty years after J.P. Barlow’s declaration of the independence of cyberspace
    (Barlow, 1996), which heralded the birth of Web 1.0, and ten years after Benkler’s
    The Wealth of Networks (Benkler, 2006), which marked the mainstreaming of Web
    2.0, in 2016, blockchain technologies captured the imagination of a diverse group
    of social actors from crypto-anarchist software geeks, via investors, to governments.
    Their hope was, again, that technological decentralization would provide a solution
    to a wide range of problems that include the governance of the global financial
    system, the excessive power of online platforms, or the way societies maintain
    property registries.


    The term “blockchain technologies”, or distributed ledger technologies (DLTs),
    describes a wide range of technological innovations which use advanced cryptographic
    techniques to create decentralized technological network infrastructures to facilitate
    social coordination among strangers without relying on existing institutions or
    traditional intermediaries. The coordination takes place via a shared database.
    The integrity of this database is guaranteed by an algorithmic consensus among
    the members of the network. The database has no limitations on what that it contains:
    it can record time-stamped documents, transactions of unique tokens, or software
    code that allows the automatization of coordination. (Narayanan, Bonneau, Felten,
    Miller, & Goldfeder, 2016)


    Blockchain technologies brought together long existing ideas in a new constellation
    (Narayanan & Clark, 2017), which created an opportunity to see this new technology
    as a point of discontinuity, a revolutionary moment, rather than a marginal advance
    in, for example, the science of cryptography or the design of peer-to-peer systems.
    Such moments of perceived discontinuity create uncertainties around the unexplored,
    unknown potentials of the'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'technology, which, in the case of DLTs, led to widespread and enthusiastic
    speculation about an imminent political, economic, and social disruption. After
    two failures for the brave new, self-governed, autonomous world to emerge, there
    was again a widespread hope that on a decentralized and disintermediated technological
    basis, technologically empowered individuals would create horizontal, just, meritocratic,
    self-governing communities, emancipated from the oppression of states, corporations,
    and other traditional economic or political middlemen (Swan, 2015; Tapscott &
    Tapscott, 2016; Wright & de Filippi, 2015; Wright & de Filippi, 2018).


    The term “decentralization” enjoys an almost mythical status in the discourses
    around DLTs in particular and digital technologies in general. This is partly
    due to the original design of the Internet architecture, which found an effective
    safeguard against a nuclear attack on a communication network by eliminating central
    points of failure or control. This has led to more metaphorical interpretations
    of the advantages of decentralized architectures in the form of John Gilmore’s
    quote: “The Net interprets censorship as damage and routes around it” (Elmer-DeWitt,
    1993). In 2006, Benkler stressed the relevance of decentralization in similar,
    albeit seemingly less loaded terms: “[T]he primary attribute [of centralization]
    is the separation of the locus of opportunities for action from the authority
    to choose the action that the agent will undertake. . . . ‘Decentralization’ describes
    conditions under which the actions of many agents cohere and are effective despite
    the fact that they do not rely on reducing the number of people whose will counts
    to direct effective action” (Benkler, 2006, p. 62). In the context of DLTs, decentralization
    (and anonymity, not discussed here) provides immunity against laws: “It’s only
    through decentralization and anonymity that the system can remain free from outside
    influence, such as government regulation” (Van Wirdum, 2015). “Policy neutrality”
    – as legal impunity is referred to by the same text – is achieved because it’s
    difficult and costly to coordinate enforcement against many, small, geographically
    dispersed, anonymous network constituents.


    # The normative discourse on decentralization


    Decentralization in the technology discourse is rarely a descriptive category
    with its own particular costs and benefits but rather a normative ideal. Centralization
    means the rule of the few over the many, the potential for censorship, for coercion.
    Decentralization is seen as the architectural guarantee of censorship resistance
    and a safeguard against the coercive influence of any centralized, top-down force.
    The external forces of control – institutions, intermediaries, rules, laws, and
    norms – prevent the ideal, purely technological modes of private ordering, based
    on the horizontal self-organization of equal peers. The social order that is expected
    to emerge on decentralized technologies is seen as inherently superior to what
    the status quo has to offer. The teaser of'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'the Internet Archive''s Decentralized Web Summit perfectly encapsulates this
    approach to the cascading social and political impact of technological decentralization:
    “The Internet Archive’s Decentralized Web Summit is dedicated to creating the
    web we want (and the web we deserve). We are convining those who want to build
    a web that . . . remembers. Forgets. That’s safe. That cares about people. That’s
    a marketplace. That’s a public square. That learns. That’s magical. That’s fun.
    A web with many winners. A web that’s locked open for good.” Decentralization
    is a technological architecture that replaces existing modes of control and reverses
    their negative effects. It is a higher technological ideal to be strived for,
    a superior mode of technological design, a “step forward in the evolution of systems”
    ((Kelly, 2014) quoted in (Baldwin, 2018)) which could enable its users to effectively
    neutralize or counter the tyranny of states, the injustices of markets, and the
    untrustworthiness, corruptibility, or outright corruption of various middlemen.


    Looking at technological decentralization as a utopian ideal to strive for leaves
    little room for a more analytical approach. We agree with Baldwin that the actual
    extent and mode of decentralization of complex techno-social assemblages are the
    products of concrete social, political, and economic conditions “based upon a
    geopolitical decision, being a contingent choice, serving a specific historical
    function, and with appropriate cost-analysis” (2018, p. 3). In the next section
    we outline some of these forces which shape the degree of centralization of a
    techno-social system in different dimensions.


    # The logics and dimensions of decentralization


    # What are the relevant dimensions of decentralization?


    Decentralization of a complex techno-social assemblage can be discussed in relation
    both to all the resources which are necessary for the production of the assemblage
    and for all the domains the assemblage offers its products/services to. In the
    case of DLTs, they must secure inputs from a wide variety of markets: financial
    resources such as investment; human resources such as software development or
    legal expertise; technical resources such as the capacities required to mine or
    run a full node; or infrastructural resources such as access to specialized hardware,
    energy, network connectivity, or cloud services. Similarly, the concentration
    (centralization) of markets which use the services offered by or through a technology
    can also be considered: the number of users both human and institutional and their
    concentration in various dimensions, such as legal/ illicit uses, volume, and
    geography; the number and distribution of holders of different rights related
    to the technology (such as ownership, management, extraction, exclusion, etc.);
    and the distribution of costs and of any rewards.


    Decentralization, in the context of DLTs, is usually discussed in terms of software
    decentralization, which according to Buterin (2017a) has much fewer dimensions:
    (1) architectural (“How many physical computers is a system made'
