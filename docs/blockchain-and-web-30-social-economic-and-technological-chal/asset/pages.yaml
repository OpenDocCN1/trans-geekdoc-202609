- pgno: 54
  md: 'the case, either because the work had been made in the course of employment

    and therefore is owned by the employer or because ownership has been trans-

    ferred to third parties by means of a contract of copyright assignment. These

    contracts are often accompanied by the so-called paternity waiver, whereby

    the author gives up their right to be acknowledged as the author.25 If copy-

    right paternity can be waived, it is likely that it will be, because the relevant

    relationships in many creative industries are often characterised by an imbal-

    ance of bargaining power (one needs to keep in mind that the industry tends

    to ‘oblige authors and artist to enter standard-form contracts that require them

    to waive their integrity rights’ (Lionel Bently and Brad Sherman, Intellectual

    Property Law (4th ed, OUP 2014) 290)). For all these reasons, music is often

    consumed without the owners’ permission, and the system does not reward

    artists sufficiently and in a timely manner, if at all.


    Permissionless blockchains could tackle both issues. A blockchain-based

    music platform such as Mycelia can allow artists to issue a token that can

    be transferred only when the owner signs off on the transaction with their

    private key. This disincentivises end users from accessing music illegally. As

    to the music metadata’s conundrum, a public, permissionless blockchain dis-

    tributed across a peer-to-peer network may resolve the problems of copyright

    infringement by enabling the creation of a global updated database of music

    metadata. The blockchain could be the backbone of a decentralised, open-

    source global platform, controlled by no single entity, and with the potential
    to

    contain accurate, real-time, global data encompassing credits and rights own-

    ership (Wallach (n 85)). As noted by some scholars, most copyright registry are

    territorial, but the creation of a global registry would not require governments

    to trust other government or third parties, ‘(r)ather, trust can be placed in

    the mathematical certain provided by blockchain technology’ (Wright, 2015).

    Moreover, blockchain could be a technological means to practically nullify

    the practice of imposing paternity waivers, thus contributing to fixing the

    structural imbalance of power of the creative industries, music included. Once

    recorded in a blockchain platform, no one could contest the authorship and

    ownership.


    In making it easier to access copyright content legally, the blockchain can

    prevent copyright infringement. At the same time, however, it can constitute

    a problem because, in light of the distributed nature of the blockchain and its

    lack of single point of failure, infringing content cannot be taken down: once

    it is on the blockchain, it is stored in every node, potentially forever.26 In
    recent

    years, the prevailing way that copyright owners react to copyright infringement

    is not bringing lawsuits against the end users or the actual infringer but target-

    ing the intermediaries that enable said infringement (e.g., the Internet service

    providers, such as BT or Sky).27 However, in permissionless blockchains, in

    principle, there are no intermediaries or, better, the latter have a different,

    more elusive identity. The virtual impossibility of removing a file once on the

    blockchain and the inherent disintermediation is likely to make it difficult to'
