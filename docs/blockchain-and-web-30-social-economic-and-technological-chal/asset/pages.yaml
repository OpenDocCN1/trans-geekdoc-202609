    Due to the intensity of the Tranzfuser game development challenge, at EGX, team
    trust levels were rated highly amongst all present. However, at least two of the
    teams had experienced work management issues, so that trust was also conditional
    upon the demonstrated investment of other team members.


    # Team 1: team work takes priority


