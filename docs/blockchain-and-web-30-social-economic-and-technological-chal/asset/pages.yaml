  md: 'Out of the 70 experts contacted who are working for 30 investment funds, ten
    replied, and four submitted the filled Excel file. One expert is an investment
    manager at a Chinese venture capital company focusing on the blockchain industry
    and has invested in enterprises such as Huobi, Coldlar, Bocheninc, Jinse Finance,
    Lianshang Technology, etc. The second expert is a top manager of a big investment
    firm in Singapore. He is a direct investor in the blockchain and venture capital
    space, specializing in quantitative and numerical finance, mathematics, political
    economics, macroeconomics, game theory, statistics, blockchain and cryptoeconomics.
    The third one is a founder of a digital assets hedge fund based in Singapore,
    focused on blockchain-based projects, decentralized protocols and ICOs. The firm
    invested in projects such as Fantom, Zilliqa, Golem, Ethereum, Tezos and others.
    The fourth expert is an entrepreneur, a cofounder of several blockchain-related
    startups and an active investor in the blockchain and cryptocurrency space.


    The responses from the four experts were checked for interrater agreement using
    Fleiss'' kappa (which is suitable for nominal categorical data from more than
    two raters), and the result showed slight agreement among the experts (kappa =
    0.134). We then proceeded to produce a unique dataset as the input for building
    the SSIM. The data unifying process followed the rules listed here:


    +   1 If all four experts, or three out of four experts, or two out of four experts,
    agree on the relationship between two success factors, that relationship is preserved
    in the unique dataset. Among the 91 relationships (the total number of input asked
    from each expert), 77 were determined in this step.


    +   2 If four experts are divided into two pairs by two different responses, we
    calculate the frequencies of the preserved responses per expert in the first step.
    The relationship agreed upon by the pair whose combined frequencies are higher
    than those of the other pair is preserved; if the two pairs'' combined frequencies
    are equal, for each pair, Fleiss'' kappa is calculated among the pair''s responses
    and the unique responses achieved so far. The relationship specified by the pair
    with higher Fleiss'' kappa value is preserved. Among the 91 relationships, 10
    were determined in this step.


    +   3 If all four experts disagree among themselves on the relationship between
    two success factors, we disaggregate the frequencies of the preserved responses
    per expert in the first two steps. The relationship specified by the expert with
    the highest frequency is preserved. If two or more experts have the same highest
    frequency, for each of these experts, Cohen''s kappa is calculated between his/her
    responses and the unique responses achieved so far. The relationship specified
    by the expert with higher or the highest Cohen''s kappa value is preserved. Among
    the 91 relationships, four were determined in this step.


    Based on the obtained unique dataset, we built the structural self-interactive
    matrix as shown in Table 16.3.'
