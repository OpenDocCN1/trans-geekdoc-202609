  md: '# Applying smart contracts in online dispute resolutions on a large scale and
    its regulatory implications


    Janet Hui Xue and Ralph Holz


    # I. Introduction


    This chapter analyzes the feasibility of using smart contract technology to handle
    online dispute resolution (ODR) on a large scale. Online dispute resolution (ODR)
    is “referred to as the use of technology to carry out the dispute resolution process.”1
    ODR combines alternative dispute resolution (ADR) and information communication
    technology;2 it can be used for disputes arising from both online e-commerce transactions
    and offline transactions such as purchases. ODR becomes particularly relevant
    in the context of cross-border e-commerce. It can include the traditional legal
    process, although it does not usually rely on it: the traditional legal process
    often involves a court, judge, and possibly a jury to decide a dispute.3 However,
    ODR has a scalability problem: it cannot easily satisfy the sheer number of possible
    requests from millions of consumers, given how strongly e-commerce is still growing
    and the high number of intermediaries that are needed to support the financial
    transactions that ultimately enable e-commerce. Such intermediaries include a
    range of financial institutions: banks, brokers/dealers, and also other institutions
    that interact with the end users of a financial transaction; the term also includes
    infrastructure such as payment, clearing, and settlement systems.4 Several ODR
    systems exist at international and regional levels, including eBay’s ODR system5
    or the domain name dispute resolution used by ICANN.6 However, no globally viable
    ODR model has emerged yet.7 Recently, so-called smart contracts on block-chains
    have been suggested as a possible solution for “self-enforcing Online Dispute
    Resolution”.8 The claimed advantage is that smart contracts may be able to deal
    with disputes much faster and on a very large scale.


    However, smart contract technology is in its infancy, and such advanced use has
    not been sufficiently explored yet. It is not entirely clear yet what smart contract
    platforms will eventually exist and which features they will support. Expectations
    of the viability of smart contract technology may be overly optimistic; there
    is also a certain degree of confusion regarding possible features and limitations.
    Importantly, while many use cases have been proposed, very few have been analyzed
    from the perspective of legal compliance. As a result,'
