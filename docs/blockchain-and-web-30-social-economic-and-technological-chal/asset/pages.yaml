- pgno: 124
  md: '# Conclusion


    Our study concludes that blockchain-enabled journalism projects such as Civil
    have a relative advantage compared to traditional journalism models. Civil takes
    partial advantage of blockchain’s operating principles as it promotes a journalism
    ecosystem with a higher degree of transparency, equality, decentralisation and
    accountability than traditional newsrooms.


    Civil’s cryptoeconomics model incentivises community members to act in accordance
    to the Civil Constitution, which in turn would lead to higher quality journalistic
    content. A newsroom producing high-quality factual news content would naturally
    enhance news credibility and make journalism more sustainable.


    That being said, a lot of conditions and variables need to be considered for a
    platform like Civil to succeed in attracting professional journalists and cause
    a network effect where more newsrooms and readers perceive their news content
    as credible. The elephant in the room, however, is the assumption that CVL holders
    would be committed to the constitution and act predictably and rationally rather
    than try to abuse the system. It also heavily depends on the state of the health
    and effectiveness of Ethereum as the underlying technology. This exposes Civil
    as well as hundreds of other projects that use ERC-20 tokens to the risk of failure
    if Ethereum’s own cryptocurrency (ether) collapses or if the whole project is
    shut down for any reason.


    The question of voter rationality is key when considering, for example, the way
    voters would react to the publishing of a fake image or unsubstantiated information.
    Ideally, CVL holders would be able to spot such content and issue a challenge
    that would then be supported so that the newsroom is held accountable. Such a
    scenario would be a strong deterrent that would enhance the credibility of messages
    and thereby lead to higher overall news credibility of the source and the newsroom
    in question. The more high-quality newsrooms joining Civil, the higher the value
    of CVL would be, and the more profitable it becomes for all involved.


    In this chapter, we demonstrate that the blockchain can reduce the influence of
    intermediaries in the journalistic process, which in turn can reduce bias and
    lead to greater trust in the news media, making the journalism industry more sustainable.
    On the other hand, blockchain technology is best utilised for cases where intermediaries
    are totally eliminated, which is not the case of Civil. Although Civil relies
    on its community members – as peers – to properly interpret the constitution,
    the Civil team understands that it may be necessary to have intervention by the
    council to handle delicate borderline issues that are difficult to interpret.


    The fact that Civil compromises full decentralisation by appointing itself – at
    least for the initial period – as the intermediary that appoints the council to
    resolve some disputes is a major gamble that may be its Achilles heel, which could
    have unforeseen negative consequences down the line. It also poses the question
    of whether blockchain is after all the solution needed for the creation of truly
    decentralised newsrooms.'
