    # Limitations of the study


    There are several limitations in our study. First, there is a potential threat
    to the generalisability of the model we built. We were able to obtain responses
    only from a small number of experts. This limitation could affect the quality
    of the input data into the ISM process and eventually influence negatively the
    generalizability of the model. Second, it is possible that one or more experts
    made errors while filling in the Excel sheet due to time or comprehensiveness
    issues. The Excel sheet design could have been misleading. This is a potential
    threat to the internal validity of the study result. We tested the comprehensiveness
    of the sheet on several colleagues before sending it out to the experts. We also
    tried our best to ensure the reliability of the input for building the ISM by
    following a rigorously defined process to create a unique dataset.


    Another issue is that the blockchain-based crowdfunding phenomenon is still in
    its infancy. It is still unclear which direction it will take in the future. The
    last years could probably be seen as a radical outlier in the future. In the coming
    years, it will be much more difficult and more expensive to raise capital due
    to regulation and higher competition. Some of the assumptions we identified in
    our study may be valid today but could lose their validity over the next years
    or even months.


    # Conclusion


    In this chapter, we investigated the factors that could impact the success of
    blockchain-based crowdfunding campaigns, which nowadays have become an important
    means for new ventures and innovative projects to raise funds. By'
