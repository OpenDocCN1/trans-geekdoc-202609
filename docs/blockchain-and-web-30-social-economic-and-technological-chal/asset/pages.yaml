  md: 'last stage of the decomposition of what we have called feudalism (Schumpeter,
    2010: 124), and thus his ideas may yet have further prescience. Not only, as Fisher
    suggested, is advanced capitalism equipped with its own feudal lords – Gates,
    Bezos, Zuckerberg, et al. – but it is also less complete, less resolved than we
    may think. Whereas Fisher claimed that capitalism was in crisis because of the
    stasis and stagnation caused by monopolies, it may be the very fact that because
    it is a monopoly, one that is susceptible to disruption and forever in a state
    of becoming more than it was but remaining less than what it could be, that Schumpeter
    will have the last word: ‘destruction may not be the right word after all . .
    . perhaps I should have spoken of transformation’ (Schumpeter, 2010: 145). If
    Steemit and Creative Passport are agents of destructive transformation, then they
    are agents with no teleological imperative of an anticipated socialism and without
    the accelerationist’s enthusiasm for weaponising the disruptive process in order
    to achieve the downfall of capitalism. Catching the current wave of blockchain-powered
    disruption is therefore an acknowledgment that technologies, economies and socio-economic
    systems will only exist as long as they are the best solutions to the issues they
    have evolved to address. But even that will not save them, for they cannot help
    but be transformed by the very forces that brought them into being in the first
    place, which is to say, themselves.


    # Notes


    +   1 In the chapter ‘Disruption as Contingency: Music, Blockchain, Wtf?’, via
    an account of the history of the term ‘disruptive technologies’, I examine the
    way in which ‘disruption’ connects with contemporary philosophical notions of
    ‘contingency’, as expressed in the work of Quentin Meillassoux; concluding that
    a more accurate term might be ‘contingency technologies’ (Lovett, 2019).


    +   2 In the blog essay ‘Unconditional Acceleration and the Question of Praxis:
    Some Preliminary Thoughts’, the writer and blogger Edmund Berger parses the three
