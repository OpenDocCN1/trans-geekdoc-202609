- pgno: 301
  md: '# Campaign transparency


    **Information transparency about the startup:** There exist a couple of studies
    that highlight the importance of financial projections in equity crowdfunding
    (Ahlers et al., 2015; Lukkarinen et al., 2016; Polzin et al., 2018). Ahlers et
    al., 2015 find that projects that disclose no financial projections or forecasts
    collect smaller amounts during their campaigns and that the provision of more
    details about the risks is positively related to crowdfunding success. Lukkarinen
    et al. (2016) focus on the importance of the provision of sales growth, EBITDA
    margin and valuation multiples. The availability of financials seems to be positively,
    albeit not very strongly, associated with the number of investors but not significantly
    related to the amount raised. The study by Polzin et al., 2018 used data collected
    by a survey conducted in the Netherlands with 1,278 respondents. The study finds
    that the provision of financial information is important in financial crowdfunding
    (e.g., equity or debt) and less important in nonfinancial financing (e.g., donation
    and reward). A study by Gutsche and Sylla (2017) highlights the importance of
    having a strong value proposition and communicating it clearly. A study by Kim
    et al. (2017) states that the elaboration of project details is a statistically
    significant indicator of reward crowdfunding success ratio. A study by Mamonov
    et al. (2017) analyzed 17 US-based equity crowdfunding websites. The study concluded
    that process standardization and due diligence performed by crowdfunding platforms
    can effectively reduce information asymmetry and lead to better crowdfunding performance.
    Vismara et al. (2016) find a positive effect of longer pitch durations on equity
    crowdfunding success.


    **Code source is available:** A study by Adhami et al. (2018) states that the
    success of an ICO is strongly and positively affected by the presence of a set
    of codes for the blockchain project. The code source could be seen as a transparent
    proof of concept. Nevertheless, probably only a few investors are able to read
    it.


    To sum up, it can be seen clearly from the reviewed crowdfunding literature that
    various factors can influence the success of a blockchain-based crowdfunding campaign.
    However, our current understanding on these factors and their effects is not consistent
    and unanimous. Even less clear is how these factors are interrelated to affect
    jointly the eventual crowdfunding success.


    # **Research approach**


    The research process was divided in two steps based on the posed research question:
    (1) extending the success factors and (2) establishing the relationships among
    the success factors.


    # **Extending the success factors**


    A particularity of blockchain-based crowdfunding is that investors rely on evaluations
    provided by rating platforms to make investment decisions. Different'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'platforms use different evaluation mechanisms to decide the rating scores.
    Through analyzing these mechanisms, we could extract the factors that the evaluation
    websites consider important to take into consideration when evaluating a crowdfunding
    project and predicting its success. By contrasting the factors we obtained from
    this analysis to what we have obtained from literature, we could identify new
    factors that are not covered by the literature, thus extending the list of success
    factors presented in Table 16.1.


    In our previous work, we identified a list of ICO evaluation websites and assessed
    their quality using two criteria – information richness and transparency of evaluation
    mechanism (Hartmann et al., 2018). In this study, we used three of the most transparent
    rating platforms in terms of evaluation mechanism. At the time our previous work
    was published, Cryptomoon was among the three most transparent rating websites.
    By the time of this writing, the website seems to have lost its focus on ICO ratings.
    We used three of the most transparent platforms that are still operational. We
    extended the set of success factors through a careful analysis of the three ICO
    evaluation websites. For each evaluation website, we searched for the documented
    evaluation mechanism used by the website to rate ICOs. Then we conducted a qualitative
    analysis of the document using the reported success factors from the literature
    as the seed categories to identify new success factors. The result of this step
    is reported in the first part of the “Results” section.


    # Establish the relationships among the success factors


    In this step, we employed interpretive structural modeling (ISM), which is a systematic
    structure modeling approach introduced by Malone (1975) to analyze and build the
    element hierarchy connection model in graphic form. It is interpretive, as the
    judgment of experts decides whether and how the variables are related. Relying
    on expert knowledge, it disintegrates an intricate system into several elements
    and builds a multilevel structural model. It is structural because, on the basis
    of relationship, an overall structure is extracted from the complex set of variables.
    It is a modeling technique because the specific relationships and overall structure
    are portrayed in a graphical model (Sage, 1977). The hierarchical model allows
    a focused view of the implicit nature of the underlying associations between the
    variables. ISM has been used in various fields of study, such as knowledge management,
    supply chain management, project management and complex engineering problems.
    Since the purpose of this study is to develop a structured model of success factors
    for blockchain-based crowdfunding, ISM is an appropriate approach to use.


    The various steps involved in applying the ISM technique in this study are as
    below:


    +   1 Develop a structural self-interaction matrix (SSIM) of the success factors,
    which indicates pairwise relationship between the factors, using the experts’
    knowledge as input. The relationship between the two factors can be:'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'V: Factor i influences factor j;

    A: Factor i is influenced by facto j;

    X: Factors i and j influence each other; and

    O: NO relation between Factors i and j.


    +   2 Develop a reachability matrix: A set of rules are applied on the SSIM to
    transform it to a primary reachability matrix, then a final reachability matrix
    is generated by checking transitivity – transitivity of the contextual relation
    is a basic assumption in ISM which states that if element A is related to B and
    B is related to C, then A is related to C.


    +   3 Partitioning of the reachability matrix into different levels.


    +   4 Based on the relationships given in the final reachability matrix, drawing
    a directed graph (digraph) and removing the transitive links; replacing element
    nodes with the statements.


    +   5 Classification of success factors using MICMAC (Matrice d''Impacts Croisée''s
    Multiplication Appliquée a UN Classement) analysis to identify the variables that
    are influential, dependent and necessary for the development of system model.
    Its main aim is to analyse interactions, i.e., the driving and dependency power
    of the variables.


    The more detailed explanation of these steps and the intermediate and final results
    following these steps are presented in the second part of the following section.


