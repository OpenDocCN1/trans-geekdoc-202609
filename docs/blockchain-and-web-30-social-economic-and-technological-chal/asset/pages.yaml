    However, the blockchain execution model makes intervention of any kind relatively
    difficult. It would require (human) intervention by a recognized actor with an
    appropriate mandate. To fix an error of the first kind, the erroneous smart contract
    would have to be terminated and replaced or updated. This is a lengthier process
    and likely more costly than an advisory and clarification'
