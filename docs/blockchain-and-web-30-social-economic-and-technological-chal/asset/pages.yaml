  img_proc: true
- pgno: 228
  md: '+   - **Join data**: Checks whether it allows different data sources to be
    joined. Ideally, it should allow merging data from different platforms as well
    (e.g., blockchain and NoSQL).

    +   - **Views**: Indicate if the implementation supports the definition of views
    or some similar feature. Views allow the user to save his queried data for later
    usage.

    +   - **Tool support**: See if there is a tool support to specify, check, and
    show the acquired data as well as the commands used to fetch such data. Lack of
    tool support can hinder the adoption of the implementation.

    +   - **Data source**: Checks if the implementation can fetch any type of first-class
    elements stored in the blockchain.


    Web3 is the official Ethereum API coded in Javascript that implements an interface
    to the remote procedure call (RPC) protocol [Eth18a]. Web3 is not a query language;
    all data is gathered by using its API interface. Even though Web3 can access any
    data stored in Ethereum, it can only fetch by direct and sequential access. Therefore,
    the user must search the information manually among the collected data. Although
    not a very polished solution to gather data, Web3 and its underlying protocol
    is the basis to access Ethereum data. Both Ukulele and Presto use Web3 (or another
    related API) to access the blockchain platform and perform its search (Table 13.2).


    Presto is a querying engine to run SQL on other platforms, including Ethereum
    blockchain. Moreover, Presto supports full SQL syntax for querying, such as joins,
    group functions, etc. However, it does not support another auxiliary syntax, such
    as views. There is no tool support to edit queries or view the results. Another
    flaw in Presto is that it can only acquire Ethereum data related to Blocks and
    Transactions. Therefore, Presto cannot show information on contracts or accounts.


    Ukulele is a query language implemented to automate searching for information
    in Ethereum. As we previously mentioned, Ukulele is still under development, and
    the current version does not support group functions. Moreover, the current version
    of Ukulele is able to join multiple data sources from Ethereum, but it is not
    possible to merge such data with different platforms (such as NoSQL). There is
    no tool support for Ukulele, although one is currently under development. The


    Table 13.2 Related techniques comparison


    | Feature | Ukulele | Presto | Web3 |

    |---|---|---|---|

    | Query language | No | Yes | No |

    | Group functions | No | Yes | No |

    | Join data | Partial | Yes | No |

    | Views | Yes | No | No |

    | Tool support | No | No | No |

    | Data source | All | Partial | All |'
