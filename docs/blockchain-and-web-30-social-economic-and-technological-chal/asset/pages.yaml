  md: '# Managing CRM with Fabric Hyperledger blockchain technology


    Dario Puligheddu, Roberto Tonelli, and Michele Marchesi


    # Introduction


    The possibilities offered by the new and appealing blockchain technologies involve
    not only financial applications but, thanks to the advent of the new blockchain
    generation that supports smart contracts and dApp development, can currently span
    across all the applications that up to now were reserved to software systems.


    Up to a few years ago, the term blockchain was only associated with Bitcoin, the
    cryptocurrency decentralized system set up by the researcher Satoshi Nakamoto
    (Nakamoto, Bitcoin white paper), who provided the scheme and the software (https://github.com/bitcoin/bitcoin)
    for running exchanges of virtual money among owners of blockchain addresses on
    the Internet, exploiting the recent results obtained through digital cryptography,
    such as digital signatures and hashing.


    Even if the initial purpose of the project was to invent and render available
    to the Internet users a trustless cash system without the control of a central
    authority, the final result was a new software technology enabling more generally
    the management and the exchange of information across the network and able to
    grant transparency, immutability, anonymity, integrity and other welcome features
    required and desired for information management.


    Since then, blockchain technology evolved and improved rapidly, and now there
    are different blockchain brands and solutions for the most disparate purposes.
    The main improvement is certainly the possibility of running native computer programs
