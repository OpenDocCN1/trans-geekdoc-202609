- pgno: 183
  md: 'from Wibson for the task. Others can use data to do research or for other purposes
    linked to their own business (Wibson, 2018b – medium). Any organization or corporation
    that concentrates information could potentially associate with Wibson and act
    as notary. They obtain data and also, of course, invest money on the app.


    +   The app (and the company behind it): Wibson can obtain some valuable things
    and make a profit in different ways. First, it receives investments from the “partners”.
    Secondly, it receives money through the aforementioned payment from buyers that
    want verified data. Third, Wibson obtains information on user behavior (data buyers
    and sellers). Although, as we have seen, Wibson does not have access to the transacted
    data itself, like other apps and platforms, Wibson can have data of user behavior
    inside the app (logs, location, time of usage, amounts and kinds of interactions
    and transactions, interests) (Wallen, 2018). This could serve, of course, to make
    better versions of the app but also to sell related services, the so-called premium
    services, or even new apps.¹¹


    In this sense, terms and conditions of Wibson say:


    > When using the Mobile Application, we will collect data that tells us about
    your app usage. We will use this usage data internally and only for research and
    development purposes. In addition, you will have the option to share with us different
    data contained in your mobile device or phone. ... . We collect this data to conduct
    internal testing of the Mobile Application and its use by you and other users
    for the purposes of research and state-of-the-art marketing. By delivering this
    data to us, you also authorize us to transfer it to Wibson Ltd., and our academic
    partners for related purposes. (Wibson, 2017 – Privacy Policy, Terms and conditions-)


    How different are these terms from Facebook’s? Should Wibson users rely solely
    on the code, or should they also trust Wibson? Of course, Wibson reserves the
    right to “make changes to the content and Services offered on the Mobile Application
    at any time” (Wibson, 2017 – Terms and Conditions-).


    We have already seen infrastructure and exchanges between actors. To complete
    the understanding of Wibson functioning, let’s see how the “incentives system”
    works. Like Bitcoin and other blockchains, Wibson has a “token model”, called
    here “Wibson points”. Its description is going to complete the previously suggested
    idea of an individual interest moving the “community” as a “common goal”.


    To date (in its “alpha” version) and as we have mentioned, Wibson is using Wibson
    points in order to incentivize “users” to interact in the app. But in the near
    future, the “token model” is going to consist of “Wibcoins”, a Wibson cryptocurrency.
    So, to the extent that more users enter the app and the blockchain, Wibcoins will
    appreciate, and, simultaneously, Wibson will be stronger'
