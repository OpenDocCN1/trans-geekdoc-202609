- pgno: 169
  md: 'Finally, there is the ideological issue of (non)trust that is built into block-chain
    at both practical and ontological levels. First, consider Satoshi Naka-moto’s
    (2008) premise:


    The root problem with conventional currency is all the trust that’s required to
    make it work. The central bank must be trusted not to debase the currency. . .
    . Banks must be trusted to hold our money and transfer it electronically. . .
    . We have to trust them with our privacy, trust them not to let identity thieves
    drain our accounts . . . [while] e-currency based on cryptographic proof . . .
    can be secure and transactions effortless.


    The implied ideal of ‘e-currency’ does not match the reality of mismanagement
    and ‘breaches of trust’ of Bitcoin. Consider clearing houses such as Mt. Gox,
    the re-centralisation of mining and ownership of bitcoins in the market, poor
    transfer rates, and wild swings of price based off unregulated market movers as
    examples. It seems that there are pertinent trust issues in Bitcoin’s own ecology
    of practice. In the trustless (or more specifically trust-the-code) world of implementing
    blockchain, ideal human functioning imbues and requires ever expanding material
    ability to defend against software-enabled miscreants. This represents ‘the next
    level’ of neoliberal self-help rather than ‘the next level’ of Internet distributed
    communication – for students continuing to differentiate the two.


    # Conclusion


    By way of conclusion we offer some parting thoughts on the futures of Ethereum
    smart contracts and cryptocurrencies in general. To begin, consider how Ethereum
    ‘smart contracts’ relate to ‘taking the Internet to the next level’ of digital
    surveillance afforded through blockchain-based tracking and individualised data
    tracing. This solution offers surveillant technologies the likes of which could
    not be imagined though centralised brokers such as Facebook, the National Security
    Agency, or other actors. In essence, the publicity/existence of the blockchain
    draws on narratives of self-acted total information awareness and transparency.
