- pgno: 104
  md: 'might also be particularly useful for fan creation networks, which can often
    continue for many years with numerous contributors over time.


    The value of emplotment (Reijers and Coeckelbergh 2018) or formalisation is precisely
    so that agreed interactions proceed without subsequent human intervention, and
    “code is law” (Lessig 1999). As computing science theorist Kieran O’Hara argues,
    to assume that code is therefore interchangeable with law is a “dangerous fallacy”
    (O’hara 2017: 100), however. Laws are developed democratically, can be challenged
    (for example, when fraud, or duress, or compromised capacity are proven) and can
    also be broken, whereas software development is a much more opaque process (O’hara
    2017). Nevertheless, parties to coded smart contracts still have agency; they
    may negotiate the initial terms and can choose to participate, or not. When problems
    do arise, those agreements are also potentially negotiable when mechanisms are
    in place to enable this. Similarly, whilst smart contracts may lack social context
    (O’hara 2017), that can also be their strength. For example, smart contracts can
    relatively easily enforce clear-cut agreements across jurisdictions and potentially
    support that transaction as well via the provision of transparent, shared data
    (Eenmaa-Dimitrieva and Schmidt-Kessen 2017). They also enable distributed governance
    on a scale never previously possible, which in some cases is more efficient and
    can reduce the risk of conflicts of interest, or fraud (De Filippi 2018).


    # Conclusion


    This research explored what automated trust and blockchain technologies offered
    for efforts to streamline games production licensing, knowledge exchange and business
    registration. In order to better understand these questions, participants of the
    UK Games Fund’s Tranzfuser initiative were interviewed regarding their collaboration
    experience and their use of the UK Games Fund’s Global Tal Registry IP management
    tool.


    This empirical study of the collaborative experience of young game developer teams
    indicates that potential future Web 3.0 creative enterprise tools like blockchain
    business registration and data-sharing frameworks can expedite creative collaboration
    practice in a way that is potentially enhancing, if not entirely suitable for
    all contexts. Automated work records are a valuable tool to help streamline the
    licensing and creative development process, but they work best in collaboration
    with human insight. The overall value of these enhancements is likely to depend
    upon the agency of those involved.


    Whilst the emerging semantic web (Hendler 2009) can already provide disarming
    insights into the nature of human behaviour, there is still a lot that it does
    not capture, such as the amorphous and potentially transformational insights that
    only emerge through the psychological, emotional and even energetic interplay
    of human subjectivities in collaboration with systematic data flows. In terms
    of creative production processes artificial data intelligence still needs to be
    combined with social intelligence.'
