- pgno: 243
  md: '# The API-service architecture in Hyperledger


    ![](img/a0011e82f3a3a41227dc70cd0ddb893a_243_0.png)


    Figure 14.1 V2.0.0 architecture of Hyperledger (from Hyperledger white paper)


    different possible choices of the consensus algorithm, like the SOLO and Kafka
    (https://github.com/hyperledger/fabric/tree/master/orderer/consensus/solo and
    https://github.com/hyperledger/fabric/tree/master/orderer/consensus/kafka) algorithms,
    or the Simplified Byzantine Fault Tolerance, in order to bet-

    ter take into account the relationships among network participants.


    The Hyperledger Fabric White Paper specifies the main features of Fabric

    (see Figure 14.1 for the architecture). These are:


    +   - **Scalability:** The possibility of adding dynamically new nodes into the

    +   network. The execution of chaincode is kept separate, and it is possible to

    +   add nodes for distributing the traffic flow.

    +   - **Transactions:** Are deterministic, executed in a defined and constant
    time

    +   independent from the executing entity.

    +   - **Identity:** Hyperledger Fabric provides a PKI (public key infrastructure)

    +   used for the controlling resources accesses. The PKI module can be inte-

    +   grated with preexisting solutions such as LDAP or AOUTH2.

    +   - **Audit:** The possibility of performing auditing is included in Fabric,
    with

    +   managing events and a log allowing for a variety of checks based on the

    +   current network configuration.

    +   - **Advanced queries:** Fabric allows users to query the current blockchain

    +   status, with queries defined and loaded into the blockchain during deploy

    +   of the business network. They can be invoked using APIs by users. Data'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'are distributed through transaction records made by key-value pairs corresponding
    to a commit in the blockchain.


    +   - Policy services: Used for managing and controlling the policies, such as
    endorsement, consensus, and groups.

    +   - Blockchain services: Manage the distributed ledger by a peer-to-peer communication
    protocol. The data in the ledger can be updated only by reaching consensus among
    nodes processing and validating transactions. Nodes compute hashes of the dataset
    after each block.

    +   - Consensus service: This is a module that receives and executes transactions
    according to the chosen algorithm and interfaces with chaincode for checking transaction
    correctness.

    +   - Chaincode: This is software that is executed for managing transactions.
    Chaincodes are executed in safe containers (boxes) inside validating nodes and
    are responsible for processing transactions requests and for verifying their validity
    in agreement with the business logic.

    +   - Channel: Creates a virtual data partitioning to grant access to information
    and to transactions only in the part of the network participating in the channel.


    # The model


    In order to ensure security by design for a CRM managing business and enterprises
    services, we designed and implemented an architecture where the interaction between
    the different parts of the network, the services and privacy and security issues
    and policies are implemented using Hyperledger Fabric.


    In fact, every application or software system publicly connected to the Internet
    is exposed to hackers and attackers. CRMs hold personal and private data and information
    about thousands of people that are of immense value for business. The efforts
    and the resources spent on intrusions and on hacking such data in recent years
    not only constitute a hugely lucrative business but can (and have been) also used
    to undermine and influence people’s beliefs and social aspects and relationships,
    such as in the cases where the data have been used for influencing elections in
    various countries. But keeping our attention on business and enterprises’ CRM
    security, the project of a secure solution must adopt a “zero trust system” approach
    and must not rely on the public infrastructure connected to the Internet, such
    as hosting providers, connectivity solutions, servers, network devices and in
    general everything different from what runs inside endpoints, like PCs, and mobile
    and IoT devices. Zero-trust architecture also addresses threats that get inside
    the network – rather than focusing only on security issues on the perimeter like
    that performed by traditional security models – by leveraging micro-segmentation
    and granular perimeter enforcement based on user, data and location.


    The principle of “defense in depth” must be adopted, where multiple protection
    layers are used to defend the system from external attacks. In particular,'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'when analyzing web technologies, we have two systems interacting: the database
    (DB) and the web application. While the DB manages the storage and the interaction
    with data, the web applications manage the logic of the interactions among users
    and data. External users cannot interact directly with the DB and forward requests
    to the web-apps. Thus the latter are the first target, since they are exposed
    to informatics attacks being connected to the public network. If web-apps are
    not properly protected or security bugs are exploited, it is possible to steal
    data or to alter data integrity.


    Inside relational DBs, it is possible to use security features for creating profiles
    with different privileges and permissions, but it is difficult and expensive to
    develop web-apps capable of using different profiles in the various different
    contexts. Traditional applications belong to the client-server architecture, which
    relies on and trusts the infrastructure hosting the application. These in general
    do not encrypt data, and a server attack can give complete access to the database.
    So, an “app server side” hacking could provide full access to a DB. Of course
    the DB can be encrypted, but usually encryption and decryption occur inside the
    database, and interaction with applications is not involved. It is thus desirable
    to have encryption directly with the client. Furthermore, if the web frameworks
    are replaced by a network of nodes in an untrusted environment where all transactions
    are executed if approved by authorized users and all operations are performed
    only with consensus of nodes, it would be more difficult for an external attacker
    to reach all the sensitive data.


    This solution can be implemented through Hyperledger Fabric, where chaincode can
    manage interactions with databases and transactions are executed according to
    a selected consensus mechanism. In such architecture, web applications connected
    to the Internet are replaced by the Fabric blockchain. The graphical interface
    and the user interaction are delegated to an endpoint application where encryption
    is enabled on the client side end to end. The user interacts with Fabric back
    end through a channel after his requests are acknowledged by an ACL (access control
    list) and verified by chaincode, which is the only way to interact with the ledger.


    # **Processing transactions**


    Transactions are processed according to a seven-step phase. In the first step,
    the application sends a request to an endorsing peer. Then the endorsement policies
    specify the number of nodes needed to sign a request. The nodes execute the chaincode
    to deploy the request and to simulate the read/writes operations into the distributed
    ledger. In the third phase, the endorsing peers provide to the application the
    request of interaction with the blockchain, which is signed by the nodes. Then
    the application sends the transaction and the digital signature to the ordering
    service. The ordering service creates a block of transaction and delivers it to
    committing peers. These receive the transaction batch and, finally, for each transaction
    in the received block, verify the endorsement policy'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'and check if there are potential conflicting transactions. If both checks are
    confirmed, the block is inserted into the distributed ledger and the blockchain
    status is updated.


    Since only the digital signature and the read/write operations are broadcast inside
    the network, performance and scalability are optimized. The sharing of chaincode
    execution between different nodes with different tasks allows the service to be
    optimized even in the presence of overload and large transaction volumes. The
    separation of roles allows the dynamical increase of the network so that peers
    can be dynamically inserted.


    # The model architecture


    The infrastructure of application and databases servers can be replaced by a business
    network built upon Hyperledger Fabric. The data are encrypted in the client and
    stored in a private blockchain. This is used as an intermediate layer, a middleware,
    which enables clients to communicate inside and outside the organization. The
    internal communications are implemented with specific ACL policies. Every interaction
    with the data stored into the distributed ledger occurs by means of chaincode
    invoked only by authorized users. Each operation on data, before it is accepted,
    is validated by the smart contracts deployed irreversibly on the blockchain. This
    ensures automation and security because interactions among the clients and database
    are executed on the basis of an access control list containing only valid operations,
    reducing the surface for external attacks.


    Our first objective has been to realize a prototype working stand-alone where
    data flux occurs inside the software product but enabled to connect and integrate
    with preexisting external systems. Thus, we developed the client both in command
    line modality and in graphical user interface. A working example shows the synchronization
    of two folders by means of two noninteractive processes and the examination of
    data inside a graphic management system that interacts with the overall information
    system. The system can handle text whether or not it is encrypted and has been
    elaborated at “Eablock” and at “CLab” by one of the authors.


    In the example reported in Table 14.1, the client iterates inside a folder containing
    “.log” files. The content and the names of every file are encrypted and inserted
    into the blockchain. Afterwards it is possible to examine the data inside a graphical
    platform (Figure 14.2).


    The platform displays the list of the file content loaded into the blockchain
    that is recovered using user user credentials, decrypting them inside the client
    and exposed to the user.


    If an attacker were to enter into some of the nodes, the encrypted data could
    not be understood or interpreted. We enabled storing the encrypted contents as
    JSON files. Figure 14.3 shows part of a file content stored according to this
    standard.'
