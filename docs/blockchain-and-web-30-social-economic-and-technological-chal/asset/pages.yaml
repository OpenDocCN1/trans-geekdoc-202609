  img_proc: true
- pgno: 131
  md: 'up of? How many of those computers can it tolerate breaking down at any single
    time?"); (2) political ("How many individuals or organizations ultimately control
    the computers that the system is made up of?"); and (3) logical ("If you cut the
    system in half, including both providers and users, will both halves continue
    to fully operate as independent units?"). According to this classification, "Blockchains
    are politically decentralized (no one controls them) and architecturally decentralized
    (no infrastructural central point of failure) but they are logically centralized
    (there is one commonly agreed state and the system behaves like a single computer)"
    (Buterin, 2017a). This classification is only little more than a thought experiment,
    but we quote it here because it comes from one of the most influential architects
    of the blockchain technology space. It is admittedly rough and debatable, and
    indeed, various studies that measured DLTs’ decentralization suggest a number
    of additional dimensions, the (de)centralization of which may have far-reaching
    impact on the political goals technical decentralization tries to achieve. It
    has been shown that the (de)centralization at the deep networking level, such
    as bandwidth, network latency, or fairness (Gencer, Basu, Eyal, van Renesse, &
    Sirer, 2018), the control over the production of code (Azouvi, Maller, & Meiklejohn,
    2018), or various dimensions of users, such as marketplaces or web wallets (Gervais,
    Karame, Capkun, & Capkun, 2014; Srinivasan, 2017), all affect the degree of decentralization
    of DLTs. The studies also confirm that the decentralization of the different components
    of a complex techno-social assemblage are not independent of each other. Their
    mutual interdependence creates a highly dynamic system subject to often unforeseen
    external forces.


    # The forces that produce (de)centralization


    The history of the Internet is also the history of the recentralization of networks
    which were initially designed to be decentralized. DLTs are no exception to this
    rule. In recent years, we also witnessed the lack of decentralization or substantial
    recentralization of DLTs in terms of, for example, mining power, at the layer
    of core code developers or at major cryptocurrency exchanges (de Filippi & Loveluck,
    2016). In response, a number of social, and technical innovations are being proposed.
    On-chain governance is supposed to submit the governance of the technology to
    the rules encoded in the technology, supposedly making it more transparent, accountable,
    and less arbitrary. Novel consensus mechanisms such as Ethereum’s Casper² try
    to address the concentration of proof-of-work mining (Bonneau et al., 2015) and
    the cartelization of proof-of-stake approaches³. Specialized mining hardware (ASIC)
    resistant protocols are being proposed to address dynamics of recentralization
    at the levels of hardware. As these dynamics suggest, at any given time multiple,
    often interdependent forces shape the degree of centralization in often more than
    one layer of DLTs. In the following, we’ll discuss a number of such forces, which
    we were able to identify through the analysis of (1) discussions that take place
    in the generalized online'
