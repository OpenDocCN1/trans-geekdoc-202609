    # Blockchain and Wibson


    # Blockchains: from its origins to its recent applications


    Recently, Bitcoin, one of the most widespread blockchain-based cryptocurrencies,
    has attracted the world’s attention. Soon, literature noted that its truly novelty
    was its underlying technology, blockchain. Blockchain is a way to create decentralized
    peer-validated time-stamped ledgers. As Brett Scott states, “That is a fancy way
    of saying it is a method for bypassing the use of centralised officials in recording
    stuff” (Scott, 2014). More precisely, blockchain is a ledger that is distributed
    among different participants or nodes and is cryptographically protected and organized
    in mathematically related blocks of transactions in a way that cannot be altered
    (Preukschat, 2017). The more nodes it has, the stronger it becomes, to the extent
    that more participants are registering and controlling data circulation, reducing
    the possibility of double transactions. In the case of Bitcoin, it registers cash
    transactions, but it can be – and has been – applied to a wide variety of goods
    (diamonds, artistic works and now user data, etc.). Proof of existence, EverLedger,
    Ascribe, etc., are known examples (Scott, 2014; Preukschat, 2017; Herian, 2018).
    Thus, researchers began to focus on the decentralized “nature” of such technology,
    underlining its potential to “democratize” the circulation of goods and empower
    the “community” in different areas of social and economic life (Kosten, 2015;
    Azori, 2015; Vigna and Casey, 2016).


    However, starting from that limited definition, as Preukschat explains, there
    is no such thing as “a blockchain technology” (Pilkington, 2016; Yli-Huumo et
    al., 2016; Preukschat, 2017) but instead several kinds of blockchain that combine
    with other technologies to function. The decentralized, 5 open 6 and'
