  md: 'element of a strategy that operates through interests, desires, and aspirations
    rather than rights and laws. The regulatory mechanisms of neoliberalism do not
    directly curtail actions as a sovereign power. They govern by managing the conditions
    through which those actions can be produced.


    As a result, the trajectory of neoliberal governmentality generates a fundamental
    paradox; as power becomes less restrictive, less grounded in institutional mechanisms
    of regulation, it also becomes more intense, saturating the field of all possible
    actions so as to most effectively manage the conditions of competition. On one
    hand, the state is expected to set the stage for competition. On the other, the
    state is expected to avoid becoming a player in the market. As Thomas Lemke (2002)
    suggests, neoliberalism manages this basic contradiction by attempting to create
    a social reality that it suggests already exists, stating that competition is
    the basis of social relations while fostering those same relations. The contemporary
    trend away from long-term, secure work and towards temporary and precarious labour
    is not only an effective economic strategy – freeing corporations from contracts
    and the expensive commitments of health care and other benefits – it is an effective
    political strategy as well.²


    By encouraging workers to see themselves not as ‘workers’ in a social and communal
    sense, who have something to gain through solidarity and collective organization,
    but as ‘entrepreneurs of the self’, an economic perspective, that of the market,
    becomes coextensive with all of society. When it comes to monetary sovereignty,
    this expansion in the scope of economic relations has been internalized in the
    protocols that generate value on the blockchain. Bitcoin caused excitement when
    it proposed a technical solution to a problem that previously required a trusted
    intermediary – money, or, more specifically, the problem of guaranteeing and controlling
    money supplies and monitoring the repartition of funds on a global scale.


    In the same way that neoliberal governmentalty does not actually eliminate governance
    – but rather curtails the amount of regulation required from any single actor
    in the system – blockchains do not actually eliminate trust. What they do is minimize
    the amount of trust. They do this by distributing trust among different actors
    in the system by incentivizing them to compete as rational agents (read: homo
    economicus) on the terms defined by the protocol. Blockchains thus heralded the
    arrival of a digital order that effectively merges libertarian philosophies of
    governance and neoliberal precepts about value creation and distribution, by elevating
    laissez-faire to an autonomous, self-governing algorithm.


    # Where libertarian and neoliberal visions intersect


    Perhaps a more accurate way to describe blockchains is not as ‘trustless’ but
    as built on the basis of distributed trust: trusting everyone in the aggregate
