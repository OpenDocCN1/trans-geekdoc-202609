- pgno: 163
  md: 'new technology – the Portapak – and underwritten by funding’ from meagre civic
    grants to produce content. The Portapak, a compact video recorder, enabled production
    teams of one to create mobile content for later broadcast use. While broadcast
    on CATV represented a decentralised network, the means of production had sufficiently
    shifted to distributed actors creating unique aesthetic contributions to society
    through video tape. This is why Joselit (2002, 152) goes on to lament the ‘thoroughgoing
    commercialisation of cable – its rapid devolution from an open form of communication
    to a highly standardised array of entertainment products’. This presents a different
    narrative to the fall of public broadcasters themselves (Tracey 1998), which shows
    the (civic) centre not being able to hold. Instead, here we see, as part of the
    departure from that centre, the rapid distribution of voice that is simultaneously,
    if slowly, re-centralised by market forces and subsumed into hyper-commercialised
    cable TV. Indeed, this is where Hu (2015) picks up the critique of networked communications
    by offering a cultural criticism on what networks themselves are and become.


    The parallel of CATV to the WWW is not lost on either Joselite or Hu: in 2002,
    the electronic frontiers of the Internet had already been largely replaced by
    corporate dot-coms, while by 2015, new behemoths of the cloud era of Internet
    communications had arrived. Google, Apple, Facebook, and Amazon now elicit their
    own acronym, GAFA, which signals the predominance of the specific economic model
    Internet-enabled communication practice now presents. In this model, content creation
    is driven through ad consumption, with two of the GAFA firms controlling more
    than half of that advertising revenue, while the other two have each surpassed
    market capitalisation of one trillion dollars based on investor sentiment towards
    growth forecast on services that facilitate the acceleration of commerce. We can
    envision the web, then, as born from protocols that democratically expanded distributed
    content creation across linked networks and then contracted through slick interactive
    apps and services that entrench corporate control over what was once thought to
    be wild cybernetic frontiers. Web 2.0 grew up to be corporate.


    We note that radical politics of the net, whether found in apps that implement
    encryption like Signal or Tor, do exist and work to disrupt and otherwise disturb
    prevailing orders. In the context of both Signal and Tor, encryption protocols
    function to allow a degree of autonomy by users on Internet-linked systems without
    subordinating the user to any kind of platform content moderation. In this way
    they present something of a challenge to large corporate social media platforms
    that tend to be defined by content review (see Gillespie 2018). Yet Hu (2015)
    reminds us that this was always so of the Internet, subversive ideologies put
    to networks through groups like Antfarm in the same breath as RAND and Paul Baran
    (1964) considered the military applications of distributed communication. In this
    way, attempting to overlay libertarian temporality to Baran’s original graph of
    centralised, decentralised, and distributed networks through a narrative of control
    to freedom is a misreading. Control'
