  md: '# Notes


    +   1 At the moment this paper was written, the mobile app was in an “alpha” testing
    phase.


    +   2 It is worth noting that, while not identical to Wibson and without the same
    notoriety on the specialized press, other similar apps and platforms like Dock.io
    and Bitclave.com have emerged recently. Thus, this text focuses on a business
    field that, although emergent, exceeds the existence of an isolated case.


    +   3 In regulatory terms, these platforms rely on gray areas or loopholes on
    the legislation, combining the appropriation of reusable contents (such as those
    licensed under CC or GPL) with the violation of unknown user’s property rights
    (Zukerfeld, 2010). This is a different situation from that of the so called “data
    brokers”.


    +   4 We are not discussing the extent in which data itself (the so called “raw
    data”), without further treatment, produces economic value. Indeed, the usual
    distinction between data and information is difficult to sustain since algorithms
    that process data are part of the same platforms and apps in which data is produced.
    Neither is it suitable to call “workers”, and specifically unpaid workers, to
    data producers. As I have shown, based on the literature review, I am simply assuming
    data is an indispensable input that costs very little to companies in comparison
    to the great profit that it enables.


    +   5 There is no center, no “third parties”, no “intermediaries”; each node is
    equal to the next one. In Bitcoin, blockchain aims to avoid banks. In Wibson,
    blockchain aims to avoid Facebook, Google and Wibson itself centralizing data
    in their own servers.


    +   6 Anyone with minimal technical knowledge, a computer and software can became
    a user.


    +   7 Blockchain users cannot be personally identified, but their addresses can
    be traced.


    +   8 The blockchain is accessible to every Internet user, whether or not she
