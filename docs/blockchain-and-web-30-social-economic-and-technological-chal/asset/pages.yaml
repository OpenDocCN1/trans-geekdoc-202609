    # 4. A model combining smart contract technology with humans-in-the-loop


    In the following, we present a regulatory model that combines smart contracts
    and human intervention as an extension of the principles of current ODR systems.24
    The model helps improve the efficiency of handling cases that are of a common
    nature (i.e., they are very similar) while maintaining the flexibility needed
    for legal reasoning and interpretation. In this model, the transparency provided
    by the blockchain''s logging of all transactions is an invaluable source of information
    for later auditing; it also allows the collection of data about cases, complaint
    types, and outcomes for further investigation when necessary. This information
    is automatically time-stamped and available to all participants. Although we do
    not define exactly how case information is stored (e.g., supporting documents),
    we note that the blockchain itself usually does not offer such a feature. Such
    data is usually stored externally, but it can be referenced in the blockchain
    in an integrity-preserving way: any later attempt to modify referred documents
    would be immediately detectable.


    Our model is based on a proposed application for smart contracts: so-called DApps
    – distributed applications. DApps are meant to be applications whose functionality
    depends fundamentally on interactions with smart contracts on the blockchain.
    A DApp can be implemented as a stand-alone (desktop) application, as an application
    running on a server, or even as a hybrid form, e.g., as a website where part of
    the functionality is implemented on the server and another part as JavaScript,
    executed in the browser. The key feature is always the interaction with smart
    contracts, for which the deployed blockchain environment provides an execution
    environment, including messaging and integrity-preserving references to external
    storage. We note that, at present, there is a huge gap between vision and reality.
    Current proposals for DApps focus on implementing them as websites, for example,
    by having every activity recorded in smart contract transactions on the blockchain
    or providing user-friendly interfaces to interact with smart contracts. An example
    would be the experimental prediction market Augur or the micro-payment functionality
    implemented in the new Brave web browser. Crucially, the implementation as a DApp
    adds transparency and also allows the use of the blockchain currency for payments.'
