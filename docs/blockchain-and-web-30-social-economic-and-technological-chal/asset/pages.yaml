  img_proc: true
- pgno: 241
  md: '# The Hyperledger project


    Hyperledger (www.hyperledger.org) is an open-source project founded by the Linux
    Foundation in 2015 for supporting the collaborative development of distributed
    ledgers based on blockchain technology with the aim of improving collaboration
    between different sectors in distributed ledgers, giving particular attention
    to performances and reliability for supporting commercial transactions of technological
    and financial enterprises in the global distribution arena. The project includes
    and supports open and independent standards and protocols by means of a framework
    composed of specific modules, depending on the context. Among the modules there
    is blockchain for managing consensus and storage, services for identity management
    and access control, and smart contracts. Many big brands of the IT sector support
    the project, like Cisco, IBM, Intel, Hitachi, Fujitsu, SAP and others.


    # Hyperledger fabric


    Among the many platforms, Fabric constitutes an open-source blockchain framework,
    originally developed by IBM under the name IBM Open Blockchain (OBC). The idea
    behind Fabric is to support a modular structure where the different blockchain
    nodes can be configured in order to play different roles and to support the execution
    of smart contract code, called chaincode in the Fabric jargon. The architecture
    allows users to configure which consensus algorithm runs the blockchain and the
    membership services, so that each participant can play different roles and holds
    different privileges.


    A Fabric Hyperledger network includes:


    +   - Nodes, which are peers that execute chaincode, have access to the ledger,
    approve transactions and interact with the applications;

    +   - Ordering nodes, which check for network coherence and distribute approved
    transactions to the network nodes; and

    +   - MSPs (membership service providers), which are implemented as certificate
    authorities and manage the certificates used in order to authenticate members
    identities and roles.


    Fabric’s purpose is the integration in projects using a distributed ledger technology
    (DLT) as a service. The languages supported for smart contracts chaincode are
    multiple and include Go, Java, Javascript, nodejs; namely, it does not provide
    proprietary or ad-hoc programming languages, and developers can use the programming
    language they prefer or are most accustomed to. As already mentioned, it offers
    the possibility to organize private and permissioned blockchain networks. The
    advantage for a business organization is that access is not anonymous and can
    be restricted. Furthermore, policies can be defined so that different users can
    hold different access privileges. The MSP provides the'
  merge: -1
  img_proc: true
- pgno: 242
  md: "infrastructure for managing participants’ identities, and given that each member\
    \ has been previously authorized and its identity is well known, proof of work\
    \ or similar protocols can be dismissed at will for guaranteeing network security\
    \ and participants’ honesty.\n\nHyperledger Fabric can be personalized for different\
    \ needs and flavors and allows the possibility of creating channels devoted to\
    \ a subset of participants for managing a sub-blockchain network with its own\
    \ transactions hidden from the rest of the network and independent from the overall\
    \ transaction flux, the ideal situation for concurrent business or for enterprises\
    \ with different hierarchical levels. The concept of channel can also be extended\
    \ to only two participants (https://ibm.ent.box.com/v/BlockFiles).\n\nThe Fabric\
    \ distributed ledger has two components, the _world state_ and the _transaction\
    \ log_. Each node has its own copy of the ledger of each network it belongs to.\
    \ The first component, the world state, accounts for the ledger state in a given\
    \ moment, while the transaction log registers all transactions that conduced to\
    \ the current state, namely, accounting for the chronology.\n\n# # Chaincode\n\
    \nSmart contracts in Fabric are invoked by an application external to the blockchain\
    \ when it has to interact with it. In most cases, chaincode interacts only with\
    \ the world state but not with the transaction log. The chaincode can be implemented\
    \ in different high-level programming languages, like Java, JavaScript and GO.\
    \ They execute the code and make requests to the blockchain. By means of private\
    \ channels, it is possible to create a transaction belonging only to a subset\
    \ of the network. All data belonging to a channel are invisible to others. This\
    \ feature enables a simple and at the same time secure management of privacy issues.\
    \ An example of GO chaincode is shown here for executing queries on the ledger.\n\
    \n```\n```go\nfunc (s *SmartContract) queryUser(APIstub shim.ChaincodeStubInterface,\
    \ args []string) sc.Response {\n\tif len(args) != 1 {\n\t\treturn shim.Error(\"\
    Incorrect number of arguments. Expecting UserID\")\n\t}\n\n\tUserBytes, err :=\
    \ APIstub.GetState(args[0])\n\tif err != nil {\n\t\treturn shim.Error(err.Error())\n\
    \t}\n\n\treturn shim.Success(UserBytes)\n}\n```\n```\n\nAll transactions need\
    \ to be attached to the ledger in the right order even if managed by chaincode\
    \ belonging to different channels. This is managed with"
