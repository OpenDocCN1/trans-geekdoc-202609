- pgno: 155
  md: 'more efficient way, the underlying message here is that Steemit is a new way
    of thinking about how an economy can work. This is to say that, although the white
    paper talks in a language that foregrounds Schumpeter’s ‘price variable’ – in
    other words, success in the marketplace based on cost and revenue – at a more
    fundamental level, it is concerned with mapping out a radical vision for market
    forces as such. In the age of the Siren Server, we have seen a digital economy
    based on advertising revenue grow exponentially. The white paper, however, speaks
    of an economy based on engineered scarcity, wherein a range of Internet-era behaviours
    such as posting, liking, commenting and reposting have become a new form of labour.
    As such, Steemit is an experiment in determining whether or not it is possible
    to circumvent established models for online commerce.


    Steemit and Creative Passport also draw on the proposition that as a network increases
    in activity and size, so does its value. In the case of Creative Passport, not
    only does the passport as ‘container’ seek to ensure that payment is made where
    payment is due, but also, because of the anticipated increase in network connections
    that would result from the fact that the work of one creative acts as a signpost
    for another (and vice versa) – in effect turning everyone in the Creative Passport
    environment into an advertisement for everyone else – the potential for financial
    reward increases as more users join the network. Herein lies the most obvious
    difference between Steemit and Creative Passport, in that the latter is designed
    to use blockchain digital watermarking capabilities to both ensure and propagate
    payments within a conventional model of commerce (albeit one that has as yet not
    materialised online), whereas the former is a model that could sustain comparison
    with quantitative easing or the idea of a Universal Basic Income. In this context,
    given that Steem minting is happening whether or not users contribute to the Steemit
    platform, to a degree, interacting with Steemit is simply an opportunity to draw
    down the benefits of that currency creation process. The Steem Blueprint refers
    to this specifically as one of Steem’s primary innovations, claiming that ‘the
    unique properties of STEEM make it both “smart” and “social” compared to others,
    such as bitcoin and ether’ (Steem, 2017: 1). It attributes this innovation to
    the way tokens are rewarded via the rewards pool and the voting process, and states
    that ‘when combined [these two unique properties] are referred to as Proof-of-Brain,
    which is an entendre based on Proof-of-Work, meant to emphasise the human work
    required to distribute tokens to community participant’ (Steem, 2017: 1). Thus,
    Steem’s lasting innovation may be the way in which it articulates and puts forward
    solutions to much a wider issue over how the nature of markets and benefits might
    manifest on the Internet.


    Steemit and Creative Passport are projects that have been designed to operate
    in, exploit and make equitable an economic environment that is neither in need
    of being accelerated out of in stasis, and nor is it in danger of burning itself
    out. At the macro scale, Schumpeter speculates about whether capitalism is a fully
    self-contained and unique socio-economic form or if it is ‘simply’ the'
