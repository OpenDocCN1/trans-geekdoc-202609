  md: '# Blockchain and data market


    # The case of Wibson from a critical perspective


    Guillermina Yansen


    # Introduction


    Recently, Bitcoin, one of the most widespread blockchain based cryptocurrencies,
    has attracted the world''s attention. Soon, literature noted that its true novelty
    was its underlying technology, blockchain. Blockchain is a way to create decentralized
    peer-validated time-stamped ledgers, a priori transparently and anonymously. In
    the case of Bitcoin it registers cash transactions, but it can be applied to a
    variety of goods (Preukschat, 2017). Thus, researchers began to focus on the decentralized
    nature of such technology, underlining its potential to “democratize” the circulation
    of goods and empower the “community” in different areas of social and economic
    life (Kosten, 2015; Atzori, 2015; Vigna and Casey, 2016). In fact, several times,
    democracy and decentralization are used as interchangeable terms to refer to the
    potential of blockchains to disrupt different types of centralized information
    intermediaries (Scott, 2014).


    In this context, Wibson was launched.¹ Based on an Ethereum blockchain, Wibson
    is a proprietary and for-profit mobile app that intends to connect producers (and
    owners) of data (primarily individuals) with data buyers (mainly organizations
    and companies). If data producers currently freely give their data away through
    nonexclusive licenses to platforms such as Facebook or Google, which profit from
    them, Wibson proposes to data producers the opportunity of selling their data
    through the app.² Wibson tells us that “In the Wibson marketplace, citizens, for
    the first time, will be able to participate in a decentralized data marketplace
    that provides both financial incentives and control over their personal information,
    all without sacrificing privacy” (Wibson, 2017). As we will see in detail, Wibson
    is free for data sellers, charging a fee to buyers. It also offers validation
    mechanisms in which associated companies check the data (Aitken, 2018; Jiménez,
    2018). Through blockchain, Wibson promises to truly disrupt the current logic
    of social media business, “democratizing” this market. To stakeholders interested
    in obtaining data, it promises that access to users’ validated data is not going
    to be controlled and centralized by companies like Google or Facebook; avoiding
    intermediaries, entry barriers to business would be torn down or at least reduced.
    To users – data owners – Wibson'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'guarantees that they are going to be able not only to control their data but
    to receive monetary benefits from it.


    This sounds like good news. However, a critical approach must go further. In fact,
    several authors have called the attention to the evolution of blockchains, emphasizing
    various issues.


    First, there is no such thing as “a blockchain technology” (Pilkington, 2016;
    Yli-Huumo et al., 2016; Preukschat, 2017) but instead several kinds of blockchain
    that combine with other technologies to function. In this sense, the first expression
    of blockchain, the public blockchain, like the one Bitcoin is based on, is not
    the most extended. Synthetically, a public blockchain is accessible to every Internet
    user (see details in the last section – Pilkington, 2016). But now all kinds of
    private and hybrid blockchains are emerging (Shrier et al., 2016). These share
    some characteristics and differ substantially in others, such as the concentration
    of some type of information on the user community (Preukschat, 2017). This has
    brought into question the effectively decentralized and thus “democratic” natural
    or intrinsic character of blockchains, particularly focusing on those related
    to the so-called entrepreneurs in the capitalist context (Herian, 2018). Hence,
    it is worth taking into account the particular features of each blockchain. Wibson
    is a propriatory app supported by a private blockchain and linked to an increasingly
    centralized Internet in its various layers (Zukerfeld, 2010). It is worth pointing,
    thus, to a fundamental actor: the company behind the app, Gran Data, a for-profit
    actor.


    Furthermore, some scholars have questioned blockchain capacity to empower the
    community (Scott, 2014; Pel, 2015). They noticed that the community of users does
    not refer to the construction of communal ties but to “a refuge in a defensive
    individualism mediated via mathematical contractual law” (Scott, 2014: 20). In
    fact, Wibson was not born in a vacuum. The use of data by major for-profit actors
    had already been targeted by different associations and states, and that could
    be read as a background for the app’s launch. In this sense, one can ask whether
    this cultural and institutional arena leads to a discussion of public utility
    of data traffic or, instead, contributes to cement other capitalist forms without
    questioning the relationship between the public and the private sphere. There
    are thus social or exterior features of blockchains to take into account, mainly
    regulation. “Empowering individuals”, Wibson stands as a clear expression of an
    individualism that hides its commercial presence behind mathematical, “neutral”
    laws.


    In this chapter we will advance in the study of Wibson, pointing out these and
    other possible criticisms. Diverse concepts are involved in this case study (democracy,
    decentralization, transparency, governance, commercialization, etc.), and we cannot
    analyze all of them. But what we can do is to put Wibson and similar blockchain-based
    apps in their right place: first, within capitalism and in a period of increasing
    commercialization of digital information (DI), and second, in between a process
    of substitution of one kind of centralization of data market (that which includes
    Internet giants such as Facebook and Google) to another kind of centralization
    (the one that includes Wibson).'
