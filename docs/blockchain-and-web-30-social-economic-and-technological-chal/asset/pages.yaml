    only reinforced by standard blockchain architectures. Their analysis comprises
    an evaluation of the development and deployment of blockchains along each of these
    three parameters. Next, in Chapter 3, Guido Noto La Diega and James Stacey, after
    a brief introduction on general regulatory issues in the blockchain, explore the
    impact of the blockchain on copyright. They argue that the more the blockchain
    becomes widespread, the more lawmakers develop an interest in regulating it. Most
    existing regulations, policies and case law take a top-down approach and focus
    on Bitcoin and, therefore, on fraud and anti-money laundering. A more participatory
    and holistic approach would be more suitable. Indeed, it is important to involve
    all the stakeholders and keep in mind all the potential socio-legal issues if
    one wants to ensure that the blockchain unleashes its full potential and benefits
    all the players involved.


    In Chapter 4, Philippa R. Adams, Julie FrizzO-Barker, Betty B. Ackah and Peter
    A. Chow-White explore the discourses and activities around women in blockchain
