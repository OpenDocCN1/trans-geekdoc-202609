- pgno: 125
  md: 'One additional bet that Civil has taken is relying on Ethereum, which exposes
    it to the risks and vulnerabilities of the blockchain, which remains in its early
    stages of development and is expected to go through a series of changes if it
    is to become more scalable.


    Despite partial leveraging some of blockchain characteristics, we find that the
    risks involved in the project remain high. The abuse of the system by CVL holders
    is a real possibility, particularly as the identities of voters are not possible
    to verify using Civil. Nor is it clear if blockchain is the right technology to
    use for a system that relies heavily on democratic voting but where wallet addresses
    are not strictly connected to particular individuals.


    Yet according to Civil co-founder Matt Coolidge, taking risk was necessary to
    save journalism. He remains hopeful that the rewards will outweigh the risks in
    the long run, and even if Ethereum becomes unusable for whatever reason, Civil’s
    concept and framework can move to another blockchain or entirely different system
    if necessary (Coolidge, 2018a).


    We therefore see great value in continuing to follow Civil and similar projects
    to assess progress over the years and to evaluate the level and type of adoption
    by journalists and readers. While acknowledging the risks ahead, Civil CEO Iles
    argues that journalism is at a stage in which someone needs to take initiative,
    adding that “it’s foolish to say it won’t be bumpy or take time. But what is important
    is that 1) there’s a strong market need for something different, and 2) categorically,
    nothing like our approach has ever existed before” (Iles, 2018).


    The journey for Civil and other blockchain-based projects in the field of journalism
    has begun, and in the words of Maria Bustillos of Popula, “The blockchain world
    changes at a very rapid pace, so we’re kind of surfing this gigantic wave. So
    far, we’re still standing; it’s terrifying and exhilarating” (Bustillos, 2018).


