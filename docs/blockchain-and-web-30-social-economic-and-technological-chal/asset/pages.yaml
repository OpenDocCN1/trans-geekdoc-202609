  md: 'Reddit are only the most recent companies to have quietly dropped support for
    Bitcoin.


    # Governance (without governing)


    The third problem – the monetary viability of Bitcoin in the absence of any central
    authority responsible for monetary governance – is perhaps the most daunting challenge
    to Bitcoin’s survival and underscores the misplaced faith in the principle of
    *laissez-faire*. For if the value of a currency is unresponsive to economic conditions
    or, obsersely, responds to prevailing market sentiments in an uncontrollable manner,
    then that currency’s ability to effectively facilitate market exchanges becomes
    undermined by declining trust in the currency and a growing propensity to treat
    it as a speculative asset instead. As a result, governance may appear less restrictive
    and less grounded in institutional mechanisms of regulation yet simultaneously
    becomes more crucial for facilitating the field of economic conditions and market
    sentiments so as to most effectively manage the conditions of competition. In
    this regard, the ostensibly trustless architecture of Bitcoin does not eliminate
    trust or even minimize it so much as relocate trust to the protocol.


    By enabling investors on the blockchain to see themselves as ‘entrepreneurs of
    the self’, Bitcoin caused excitement when it proposed a technical solution to
    a problem that previously required a trusted intermediary. However, while neoliberalism
    is highly governed through the regulatory power of the competitive self-entrepreneur,
    there are no mechanisms in place to address the problem of guaranteeing and controlling
    monetary supply and monitoring the repartition of value on a global scale. Without
    some sort of centralized, distributed, or alternative form of participatory engagement
    that can break from the cartelization of cryptocurrency mining, the sanctity of
    the blockchain as an accurate, trustworthy, and socially transformative ledger
    for managing, distributing, and assuring the stability of a token’s value in times
    of crisis is perpetually endangered.


    The core critique of institutions by cyberlibertarian advocates of Bitcoin and
    other cryptocurrencies – i.e., that currencies can be effectively managed by non-market
    forces – condemns the very regulatory features of money that allow it to function
    in the first place. In a sense, cyberlibertarians are unable to confront the endemic
    limits of digital currencies because they stubbornly cling to the prevailing myth
    about money’s origins, a narrative that paints a picture of some anarchic ur-community
    in which the state and money were once separated and money was free to function
    efficiently as a utility-maximizing technology to avoid the encumbrances of barter
    (Gammon 2012). But even more importantly, such advocates have ignored the basic
    nature of modern money in that the only difference between money and paper lies
    with the kind of intervention brought to bear by variously constituted regulatory
    bodies that function as an ultimate guarantor of money’s *status quo* money.'
