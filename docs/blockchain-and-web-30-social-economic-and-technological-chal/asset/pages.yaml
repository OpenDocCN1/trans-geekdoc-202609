    that “there is free and unconditional participation of everyone in the process
    of determining what blocks are added to the chain, and what its current state
    is” (Buterin, 2015b in Pilkington, 2016: 230). But all kinds of private and hybrid
    blockchains are emerging (Shrier et al., 2016). These share some characteristics
    and differ substantially in others, such as the concentration of some type of
    information on the user community (Preukschat, 2017). This aspect has led some
    critics to question the effectively decentralized, and thus democratic, natural
    or intrinsic character of blockchains, particularly focusing on those related
    to the so-called entrepreneurs in the capitalist context (Herian, 2018). Furthermore,
    several authors have shown that even in Bitcoin, which runs on a public blockchain,
    the decentralization can turn into recentralization (Scott, 2014; Pel, 2015; Zukerfeld
    and Rabosto, in Schuster, 2017).


    Thus, first, it is worth taking into account the particular features of each blockchain.


    More specifically, a blockchain can be private (only participants – registered/invited
    users – can access the database or some kind of information from it) or closed
    (not everyone, but certain users can participate in registering information, including
    the possibility of setting different levels of access for different kinds of users)
    and, additionally, can establish different degrees of identification of users.
    It all depends on the design (Lessig, 2009).


    So, learning from the first public blockchains, such as that which Bitcoin is
    based on, certain models change the possibilities of usage. They keep some degree
    of decentralization because the database is distributed between nodes and none
    of them can alter the blockchain, but there is some concentration of information
    (some hierarchies between nodes) and not everyone can access it, only registered
    users. This is the case of Wibson. Wibson is a proprietary and for-profit app
    based on a private Ethereum blockchain.9 Wibson does not store data itself, but,
    as I will detail soon, concentrates other valuable information, also maintaining
    the power to change rules at any time. Indeed, as the CEO and cocreator of Wibson
    explains, through Wibson, he wants to “create a data broker fair and transparent”
    (Jiménez, 2018).


    It is thus worth pointing out a fundamental actor here: the company behind the
    app, Gran Data, a for-profit actor. This actor is the one who establishes either
    the entire design or the rules for the design (or redesign if necessary) of this
    app and the characteristics of its underlying blockchain. A new, different intermediary
    is born.


    Next, it should be noted that private or public blockchains share one feature:
    they are potentially capable of tracing DI or IG at any time and registering the
    transaction instantly on the blockchain. That is: one informational good cannot
    be in two places at the same time. In other words, blockchain constitutes an effective
    way of inhibiting replicability of ID and IG. This feature is not necessary related
    to the commercialization or non-commercialization of those IG, but could clearly
    help the former.'
