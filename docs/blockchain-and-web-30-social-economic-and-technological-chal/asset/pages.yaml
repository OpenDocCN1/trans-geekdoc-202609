- pgno: 154
  md: "# Conclusion\n\nAlthough it might be tempting to lament the passing of an Internet\
    \ which was thought to carry within its operating parameters the seeds of a new\
    \ economy where non-market practices would reconfigure our approach to creativity,\
    \ trade and sharing, we need only to turn back to Schumpeter to see that the future\
    \ form of Internet was clear from the outset:\n\n> Unlike the class of feudal\
    \ lords, the commercial and industrial bourgeoisie rose by business success. Bourgeois\
    \ society has been cast in a purely economic mould: its foundations, beams and\
    \ beacons are all made of economic material.\n> \n> (Schumpeter, 2010: 64)\n\n\
    In the case of Steemit and Creative Passport, their operating models are manifestly\
    \ different from what precedes them; both have radicalised the way that value\
    \ can be attached to digital content, and Steem's minting function almost entirely\
    \ encapsulates Schumpeter's notion of creating which it exploits. Thus, Steemit's\
    \ pay-per-post function and Mycelia's ambition to simultaneously make Creative\
    \ Passport a new kind of global database and promotional platform for creative\
    \ practitioners 'threaten' (in Schumpeterian terms) a complete displacement of\
    \ the dominant approach to hosting music and media content online and a set of\
    \ behaviours and assumptions about how we interact with online media that has\
    \ existed since the beginnings of the commercial web in the 1990s. The extent\
    \ to which the Steemit platform embodies this drive towards macro-scale disruption\
    \ comes through in the way that the Steem Whitepaper, not unlike Lanier, critiques\
    \ our current reliance on revenue from advertising as a means of underwriting\
    \ payments for content. The white paper informs us that:\n\n> With ads, a creator\
    \ can make money most easily. Without ads, monetization is difficult but the content\
    \ is richer. Creators posting to social media outlets that are connected to Steem\
    \ may monetize merely by having their work recognized (or 'liked') by the Steem\
    \ community. Blockchain-based payouts are completely digital and have no middle-man.\
    \ Therefore monetization by blockchain-based content rewards should be faster\
    \ and much lower barrier to use than monetization by advertisements.\n> \n> (Steem\
    \ Whitepaper, 2018)\n\nWhat is at stake here is that the minting and apportioning\
    \ of Steem tokens represents an entirely different payment system to one based\
    \ on leveraging advertising for payments or increasing advertising revenue by\
    \ exploiting platform users' data. Whilst the white paper is telling us that Steemit,\
    \ by removing third parties such as advertisers, is a platform that is able to\
    \ pay users in a"
