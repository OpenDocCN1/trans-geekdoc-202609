  md: 'In a classical database, when we need to search for a particular piece of information,
    we usually write a query to fetch, present, filter, and format such information.
    Database query languages like SQL provide a rich syntax to describe the data we
    want to acquire from the database. Since a blockchain can be considered a database,
    it would be better if we could use a similar way to fetch information inside the
    blocks. In this context, users could benefit from a query language providing an
    easier way to fetch, format, and present the information extract from the blockchain
    platform.


    # Challenges


    In this section, we describe in more detail the challenges when trying to acquire
    data from a blockchain. Although our research is focused on Ethereum, such problems
    are also present on other blockchain platforms as well.


    +   - **Massive data.** Blockchain databases already possess a massive amount
    of data. In December 2017, Ethereum processed, on average, 876,000 transactions
    per day [BRDD18c]. Since the data in the blockchain cannot be deleted, the number
    of recorded transactions will only grow with time. Consequently, older information
    could get overwhelmed by new transactions and become “lost in time”.

    +   - **Heterogeneous data.** Blockchain not only stores a great amount of data
    but also manages a mixture of first-class elements such as transactions, blocks,
    accounts, and smart contracts. All of the first-class elements are different but
    interrelated by hashes. Even though Ethereum allows access to any of its first-class
    elements, the heterogeneity of the elements (each one with different meaning and
    high-level representation) complicates the acquisition of information.

    +   - **Data opaqueness.** For flexibility reasons, Ethereum stores its information
    using a generic representation. Therefore, the stored data is opaque, since there
    is no metadata describing the information nor a simple way to know what was recorded.
    This opacity is useful and even necessary from the Ethereum standpoint because
    it allows the storage of arbitrary structures and behaviors. On the other hand,
    the opaqueness overcomplicates searching for information, since a user needs to
    access generic representations without any knowledge of its content.

    +   - **Direct access.** In general, blockchain only allows direct access to its
    elements by using a unique identifier. This identifier is a hash number that is
    generated for every first-class element stored in the blockchain [Bit18]. The
    Ethereum platform, in particular, can also use a unique number (related to the
    order of the element) to access blocks and transactions [Eth18a]. The direct access
    complicates the user task in finding information because he will either need to:
    (1) store the identifiers for later usage or (2) perform a sequential access to
    gather the data.'
