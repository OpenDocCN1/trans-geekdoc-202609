    an identifier such as a name, an identification number, location data, an online
    identifier or to one or more factors specific to the physical, physiological,
    genetic, mental, economic, cultural or social identity of that natural person”
    (European Union, 2016).


    +   • **Processing:** “any operation or set of operations which is performed on
    personal data or on sets of personal data, whether or not by automated means,
    such as collection, recording, organization, structuring, storage, adaptation
    or alteration, retrieval, consultation, use, disclosure by transmission, dissemination
    or otherwise making available, alignment or combination, restriction, erasure
    or destruction” (European Union, 2016).


    # Lawful basis and rights


    When processing data from data subjects, there must be a lawful basis to do so.
    These are interconnected with the data subject’s rights; some who do not apply
    under a particular lawful basis, while others may apply for almost all of them,
    as shown in Table 15.1.


    There are several lawful bases to choose from – consent, legal obligation, public
    task and legitimate interests – with consent being the most widely used in traditional
    software applications. It refers to the permission to process the personal data
    of individuals for specific purposes. It must be requested with clear, concise
    and explicit language and without pre-ticked boxes or other default consent methods
    (European Union, 2016).


    There are multiple individual rights that are new to the GDPR.

    They are all equally important, as they may apply for some lawful bases for processing
    and not to others (Table 15.1). These include rights to be informed, access, rectification,
    erasure and data portability.


    Ethereum and other blockchains generally comply with most of these rights. However,
    the main issue at stake here is the right to erasure, as it interferes with the
    immutability present in a blockchain. According to (ICO, 2018), this


