    # 6. Summary


    Smart contracts, run on blockchains, are often cited as a game-changing innovation
    that can make ODR systems more scalable. In this chapter, we have analyzed this
    view critically and mapped the regulatory space and implications of using smart
    contracts for ODR.


    We gave an in-depth description of the technology behind smart contracts and highlighted
    their technical potential but also their limitations. In terms of expressivity,
    smart contracts do not replace the human arbitrator, as they cannot reason about
    the validity of a claim in the context of law. All steps of a smart contract,
    including the creation of the initial claim and the final decision by the arbitrator,
    are triggered by participants in the ODR system.'
