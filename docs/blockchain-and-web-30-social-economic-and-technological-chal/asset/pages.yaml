    # Conclusions


    In this chapter, we reported an analysis of the use of Hyperledger Fabric for
    managing CRM in a “secure by design” approach. Information security is the main
    target CRM must address in order to protect customer data from accesses by unauthorized
    parties. The use of blockchain technology natively supports encryption anonymization
    and decentralization, allowing the CRM to be built on a zero trust system support
    where there is no need of any trust in the infrastructure hosting software components.
    This allows data to be encrypted in the client application under the user control.
    The data are available and accessible only to authorized users and unintelligible
    to others. The native digital signatures allow precise identification of the sender,
    who cannot dissociate from any action. Data integrity is natively ensured on the
    blockchain by encryption and hashing functions that allow the prevention of any
    dishonest data alteration. The encrypted data are saved on a back end based on
    blockchain. We'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'implement this scheme with a permissioned Blockchain that requires a precautionary
    verification of network participants. We use “Fabric” by Hyperledger, a project
    finalized with the creation of Blockchain for Enterprise. The permission structure
    of Hyperledger reduces the risk of security problems, allowing transactions only
    between authorized parts. With Fabric, chaincode can manage interactions with
    databases and transactions are executed according to a selected consensus mechanism.
    In such architecture, web applications connected to the Internet are replaced
    by the Fabric blockchain. The graphical interface and the user interaction are
    delegated to an endpoint application where encryption is enabled on the client
    side end to end. The user interacts with the Fabric back end through a channel
    after his requests are acknowledged by an ACL and verified by chaincode, which
    is the only way to interact with the ledger. The internal communications are implemented
    with specific ACL policies. Every interaction with the data stored into the distributed
    ledger occurs by means of chaincode invoked only by authorized users. Each operation
    on data, before being accepted, is validated by the smart contracts deployed irreversibly
    on the blockchain. This ensures automation and security because interactions among
    clients and the database are executed on the basis of an ACL (access control list)
    containing only valid operations, reducing the surface for external attacks. We
    realized a prototype working stand-alone in which data flux occurs inside the
    software product but is enabled to connect and integrate with preexisting external
    systems, and we developed the client both in command line modality and in graphical
    user interface. By means of this prototype, we show how the concept of CRM “secure
    by design” can be practically implemented relying on Fabric Hyperledger. Our research
    drives the existing research on CRM toward a blockchain approach that exploits
    the most relevant features of this new technology


