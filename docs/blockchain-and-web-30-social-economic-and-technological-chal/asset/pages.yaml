  md: 'constraint, however, is contextualised through the nodal governance practices
    within which cryptocurrencies and the blockchain are deployed.


    By drawing on Dahlberg''s (2010) notion of cyberlibertarianism 2.0 as describing
    the community values giving rise to the development of cryptocurrencies, we can
    also follow his argument that these values inform the anarchocapitalism of the
    sharing economy and the more radical anti-statism of Bitcoin. As has been argued
    previously (Maddox et al. 2016), this developer and cryptographic community share
    an overarching agenda of disrupting centralised banking within the fiat economy.
    From the cyberlibertarian lens at the core of this attitude, the fiat system was
    perceived to reinforce structural inequalities and create financial exclusion
    through the decision-making processes within the banking system that resulted
    in outcomes counter to the interests of the individual user. Whether this movement
    implies a radical capitalist individualism with a strong and radical right-wing
    view of government and the masses is outside our scope. However, we can see this
    community in its broader sense as seeking to provide radical technological solutions
    to these structural inequalities. The cryptocurrency developer community identified
    gaps and possibilities for new technological solutions to existing problems in
    the flows of money. These included lag times in the movement and reporting of
    movement of money between accounts and, secondly, the high level of ‘friction’
    between banks and mediating institutions on the transnational flows of money through
    regulations, mediation, and conversion processes. Through this focus upon innovations
    in financial technologies solving wicked problems, the nature of this community
    broadened. Extending beyond the cyberlibertarian scope, a more pragmatic social
    mix is described by Maddox et al. (2017) as incorporating those with financial
    backgrounds and those interested in emerging financial technologies and investment
    opportunities. A further cohort includes entrepreneurs interested in accessing
    new markets and business start-up opportunities opened through cryptocurrencies
    in digital spaces. Here we can see the beginning of a loop that starts with expansion
    of dreams towards an alternative technological economic future (Swartz 2017) and
    folds back through a contraction into the centralised and existing systems of
    the fiat economy.


    This dynamic of expansion and contraction of cryptocurrencies and their associated
    technologies is aptly positioned by Swartz and by Maurer et al. as traceable back
    to its origins within the cypherpunk and crypto-anarchist sub-cultures. Swartz
    (2018, 626) argues that for cypherpunks, privacy was a ‘natural right’ that could
    be achieved through cryptographic information systems outside of the influence
    of government and corporate entities. Their aims in writing code was simultaneously
    individualistic and populist; they sought to produce a communicative reality of
    free expression that gave rise to a new society predicated on privacy. For cypherpunks,
    the pseudo-anonymity of cryptocurrencies supported personal privacy by allowing
    the individual to selectively reveal personal financial and transactional information.
    This code-law is captured by Swartz in the notion of infrastructural mutualism.
    She articulates infrastructural'
