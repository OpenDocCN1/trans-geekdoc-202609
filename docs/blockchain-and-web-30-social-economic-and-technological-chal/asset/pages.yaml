    # Indicative case study: Bitcoin


    Here we consider the arc of the exemplary case of media deployed through blockchain
    technologies: Bitcoin. We critique Bitcoin’s centralisation of value and governance
    and related commercialisation of the underlying technologies. The peer-to-peer
    payments system of Bitcoin was imagined as indicative of an alternative digital
    economy built on affordances of a trustless and efficient system. This includes,
    as Maddox et al. (2016) notes, functions that were ‘intended by developers to
    engender a politically motivated discourse’ eventually subverting ‘sovereignty
    and state power’. Yet the extent that these normative considerations have been
    usurped by third parties offer a related critique: the spectacular inequality
    within cryptocurrency markets and forthcoming regulation of cryptocurrencies being
    signalled by the IMF and national governments, centralised energy concerns, and
    ongoing issues of trust demonstrate how incumbent structures reappropriate the
    blockchain to their own ends. The centre retook what was not held. Next we detail
    the expansion and contraction of the Bitcoin tide.'
