  md: '# Lightbulb concrete


    # Bronwin Patrickson


    # Introduction


    The term trustless transactions (Swan 2015; Kiviat 2015) refers to the notion
    that blockchain technologies enable trust where it wouldn''t normally exist so
    that even strangers can transact with confidence online without the need for costly
    and cumbersome third-party authentication. But what happens when technologies
    designed to automate ‘trust’ amongst strangers are applied to creative collaborations
    between colleagues? By enabling data sharing between distributed, but linked,
    ledgers accessed by a team of cooperative and yet separate entities, blockchain
    technologies are increasingly framed as tools for collaborative business models
    (Deloitte 2018).


    This study explores that potential in the context of the games industry. Games
    development involves cross-disciplinary teams of artists, animators, designers
    and programmers. Working collaboratively, this sort of creative teamwork can build
    high levels of trust. At the same time, since computer game development is a highly
    mediated craft, much of that work is tracked by the digital software programs
    that simultaneously enable it. Team members work on computers, share screens and
    also often communicate with each other through audiovisual gaming channels. Data
    about time spent, platforms used and tools employed, for example, can potentially
    be shared in order to build a collective intelligence resource for the games industry.
    For start-up teams in particular, this rich knowledge base could provide a valuable
    guide to best practice (Chen, Chiang, and Storey 2012).


    Mediation of games development processes also introduces the potential to map
    and automate complex micro payments. Automated payments of multiple, distinct
    contributors have already been successfully trialled on the Musicoin platform,
    for example, and this level of automation is likely to increase. Could the capacity
    to automatically track code changes seen in collaborative open-source coding repositories
    like Github be helpful in this regard? As society becomes increasingly systematised
    (Zimmerman 2015) and subsequently increasingly tracked (Van Dijk 2014), the question
    whether automated contribution records might potentially be linked to future licensing
    agreements is increasingly pertinent.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Despite these alluring possibilities, it is still not clear what digital collaborations
    authorised by trustless technologies might mean for the people involved, however.
    For example, a review of the literature related to blockchain technologies and
    trust in the sharing economy¹ shows that “the conceptualization of trust differs
    substantially between the (two) contexts” (Hawlitschek, Notheisen, and Teubner
    2018: 50). “Trust machines”, or blockchain systems that “industrialise trust”(Berg,
    Davidson, and Potts 2017: 2) by managing self-interest towards a cooperative goal,
    create positive expectations due to their systematic capacities to withstand human
    intervention, whereas the more multifaceted conceptions of trust in sharing economy
    contexts are more likely to collaborate with human intervention and therefore
    tend to be based upon judgements of interpersonal ability, benevolence and integrity
    (Gefen and Straub 2004; Lu, Zhao, and Wang 2010), in partnership with system design
    (Keymolen 2013). In this case, trustworthiness is signalled by a range of means
    including verification, ratings and reviews, insurances and support, web design
    and user representation (Teubner and Hawlitschek 2018). These multilayered judgements
    can be cognitive or affect based (Yang, Lee, Lee, Chung, and Koo 2016) and also
    involve power relations (Castelfranchi and Falcone 2010).


    The divergence between these two concepts of trust reflects the limits, as much
    as the specific capacities of automated trust, or the ‘(al)gorithmic authority’
    (Lustig and Nardi 2015) of the underlying smart contracts, derived from such characteristics
    as the perceived clarity of the contract and its integrity over time, as well
    as its ability to resist the subsequent manipulation (Fröwis and Böhme 2017).
    It also indicates the confusion that can arise when a term like trust that is
