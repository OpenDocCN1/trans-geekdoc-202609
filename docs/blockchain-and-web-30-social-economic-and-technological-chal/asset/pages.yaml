- pgno: 18
  md: 'More in general, smart contracts are self-enforcing agreements, i.e., contracts,
    implemented through a computer program whose execution enforces the terms of the
    contract. The idea is to get rid of a central control authority, entity or organization
    which both parties must trust and delegate such a role to the correct execution
    of a computer program. Such a scheme can thus rely on a decentralized system automatically
    managed by machines. The blockchain technology is the instrument for delivering
    the trust model envisaged by smart contracts.


    Since smart contracts are stored on a blockchain, they are public and transparent,
    immutable and decentralized, and since blockchain resources are costly, their
    code size cannot exceed domain-specific constraints. Immutability means that when
    a smart contract is created, it cannot be changed again.


    Smart contracts can be applied to many different scenarios: banks could use them
    to issue loans or to offer automatic payments; insurance companies could use them
    to automatically process claims according to agreed terms, postal companies for
    payments on delivery.


    # No border


    The power of such a structure is also given by the fact that there are no borders,
    and it is possible to transfer value everywhere with low transaction fees. Or
    at least everywhere we have access to the network. Blockchain technologies will
    be used for financial products and have opportunities in all those fields, which
    requires transparency, immutability, certainty and certification. However, one
    of the main challenges that blockchain technologies are facing is related to the
    so-called digital divide, often intended as the gap in accessing and using new
    technologies. According to recent research, it seems that the digital divide in
    terms of access is narrowing quickly, “driven by the expansion of broadband access
    in developing countries” (Nye, 2015). However, this assumption is only partly
    true. Indeed, it depends on what we intend when we say “digital divide”. If we
    consider the digital divide only a matter of accessibility, then this assumption
    might appear true. Indeed, thanks to the rapid growth of the new mobile and networking
    technologies and the expansion of broadband availability the digital divide in
    terms of the availability of the technology is narrowing at both at the national
    and international level. This definition is reductive and does not explain in
    detail the different levels of digital inequalities and how these could affect,
    in different ways, the diffusion, the uses and the benefits users can get from
    using new technologies. Indeed, there are major divisions in the type, quality,
    reliability and affordability of access both within and between nations across
    the globe. Furthermore, available and accessible information and communications
    technology (ICT) is not the only gap among users and citizens, and it is not the
    only divide that creates inequalities. For those with access we have moved from
    simple issues of an access divide (to have the material or physical access) to
    the capability divide (the ability to use, quality of provision and'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'use of) and then to the outcome divide (to the effects of utilizing digital
    media). These three elements – access, uses, and benefits – are what we define
    as the three levels of the digital divide (Ragnedda, 2017) and provide a more
    sophisticated and complete picture of the multidimensionality of digital inequalities.
    The digital divide is therefore the actual social and personal consequences of
    the divide or discrepancy in the levels of connectivity, in the level of capabilities,
    in the outcomes, in the digital and social skills, in the motivation and in a
    diversity of combinations of these measures.


    These features influence the way in which we access, use and gain benefits from
    blockchain technologies. In other words, not everybody will benefit from the advent
    of these new technologies, since inequalities in accessing (the first level of
    the digital divide), in using (the second level of the digital divide) and in
    getting tangible outcomes (the third level of the digital divide) are persistent.
    For this reason and to extend to all users the benefits of blockchain, it would
    not be enough to implement access to the technologies to offer the possibility
    of gaining advantage from their uses. Without the necessary (digital) skills,
    the confidence to use blockchain technologies and the digital capital (Ragnedda,
    2018) to “convert” the uses of technologies into concrete and tangible outcomes
    comes, the diffusion of blockchain will reinforce previous social inequalities,
    giving to the most advantageous groups more possibilities compared to their disadvantaged
    counterparts. In other terms, the full potential of this revolutionary technology
    is not fully displayed and exploited if the digital divide is not opposed and
    tackled.


    # Blockchain technologies: risks and opportunities


    This book underlines the risks and opportunities offered by the advent of blockchain
    technologies and the rise of the Web 3.0. This book, adopting an interdisciplinary
    perspective, outlines the conceptual development of these technologies in different
    disciplines, inter alia legal, sociological, media and engineering studies. The
    core analysis in the book explains how such technologies are disruptive and further
    discusses the concrete consequences of these disruptions in terms of social, economic,
    technological and legal consequences.


    Such a comparative perspective has also been underemphasized in the debate about
    blockchain, and this underemphasis leads to weaknesses in our understanding of
    decentralized technologies. We anticipate that the comparative examination of
    these features will be helpful in clarifying the dynamics and coincidences of
    the blockchain technologies in a variety of settings. This book aims at filling
    this gap by hosting an interdisciplinary and comparative discussion of blockchain
    technologies in a variety of disciplines.


    From this unified perspective, the book proceeds with three discipline-focused
    sections, each one including five chapters. The first includes case studies examining
    the socio-economic consequences of the advent of blockchain technologies, while
    the last section focuses on the technological innovations'
  merge: -1
