- pgno: 317
  md: 'product and team. We found only one factor linked to this category in the literature
    – corporate customers as early adopters. In the analysis of the evaluation websites,
    we found this factor is used by one platform. Interestingly, it is the only category
    that has a mutual relationship with founder dedication, which seems somehow to
    increase the importance of this category.


    The only two product related factor categories not located in the lower part of
    the model are social media traction (Level II) and strong partners (Level I).
    Not surprisingly, social media traction influences campaign traction. In contrast,
    it is somewhat surprising to see that strong partners is located in the top level
    of the model, as partnership is one of the fundamental aspects of a venture’s
    business model. No sound explanation could be offered based on the literature
    and our own study, except that this might be due to the (mis)interpretations of
    the experts. Studying the literature, we found the reputable investors (business
    angels, experts) factor linked to this category. Analyzing the evaluation websites,
    we extended the category with two new factors – corporate partners and working
    with respectable law/accounting firm, which are significantly important partners,
    especially in the blockchain space.


