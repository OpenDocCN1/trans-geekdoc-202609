- pgno: 151
  md: 'Thus we see the full reach of Schumpeter’s conceptual framework, encompassing
    both market dynamics within the framework of capitalism and the overarching instabilities
    of capitalism itself. As I have explored elsewhere, we inhabit a world marked
    by the ubiquitous presence of disruptive technology, where the word ‘disruption’
    – the dominant contemporary reading of the notion of creative destruction – now
    refers to the way in which new technologies, after some initial discomfort, ultimately
    alter markets and systems for the better (Lovett, 2019). Indeed, with headlines
    such as ‘The future of all industry is disruption – and that’s a good thing’,
    we are told that ‘disruption is not something to be feared. Emerging technologies
    and innovative ideas give businesses the opportunity to grow their core services
    and products, and expand into new markets’ (Accenture, 2018). The original formulation
    for ‘disruption’ in its current sense contended that disruption is a process that
    occurs at a holistic level, where not only products are disrupted but entire infrastructures,
    including supply chain chains, distribution networks, production processes and
    so on (Bower and Christensen, 1995). The influence of Bower and Christensen’s
    article, which was more a mapping of technological change and challenge to incumbent
    companies rather than a consideration of the more underlying precepts of a capitalist
    exchange system, is clearly visible in the Accenture statement. The commitment
    to embracing disruption as ‘a good thing’ is emblematic of an increasingly widespread
    aspect of the discourse surrounding disruption, where the positive and corrective
    benefits of technological disruption are a clear step away from Schumpeter’s holistic
    and systemic level analysis of capitalism. However, whilst the Accenture statement
    may well be correct to suggest that disruption at the level of a product or a
    service may well be of benefit for consumers, the prospect of having our entire
    economic macrostructure disrupted might not be so welcome.


    For Schumpeter, it was a common misconception in ‘social criticism’ that the ‘decline
    of competition’ was the cause of the ‘decline of capitalism’ (Schumpeter, 2010:
    125), and he goes on to suggest that this was – and it may well be the case that
    it remains – the reason why industrial monopolisation is seen as a ‘vice’ (Schumpeter,
    2010: 125). His approach is a manifestly practical one, and his account for the
    benefits of monopolies simply states that ‘there are superior methods available
    to the monopolist which either are not available at all to a crowd of competitors
    or are not available to them so readily’ (Schumpeter, 2010: 87). Schumpeter’s
    view was that markets do not function according to a perfect competition between
    different producers battling with each other over the ‘price variable’ (Schumpeter,
    2010: 85). Instead, competition, properly understood, occurs between an established
    and incumbent monopoly and the emergent forces and organisations which are seeking
    to enter the market. Although creative destruction might have evolved into a vision
    of technological disruption that frames the replacement of incumbents by more
    advanced and efficient innovators as necessary and corrective, Schumpeter’s original
    intention was clearly to articulate a radical reformulation of market dynamics.'
