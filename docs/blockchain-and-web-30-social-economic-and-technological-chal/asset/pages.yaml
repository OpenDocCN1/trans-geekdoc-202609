  md: 'case study where a bug discovered in a smart contract library, and perhaps
    “unsafe” programming, allowed an attack on Parity, a wallet application, causing
    the freezing of about 500,000 Ethers (about $150 million USD) in November 2017.


    In Bragagnolo, Rocha, Denker and Ducasse (2018), an application, SmartInspect,
    allows the inspection of known contracts based on its source code, focusing on
    the debugging properties of interactiveness and distribution. This reflective
    approach allows a user to see the contents of any contract instance of the given
    source code, without needing to redeploy or develop any ad-hoc code to decode
    the memory representation.


    In Sousa, Bessani and Vukolic (2018), a Byzantine fault-tolerant (BFT) ordering
    service is implemented for Hyperledger on top of the BFT-SMART state machine replication/consensus
    library, with optimizations for wide-area deployment. The results show that the
    ordering service can process up to ten thousand transactions per second and write
    a transaction irrevocably in the blockchain in half a second, even with peers
    spread across different continents.


    In Hulea, Rosu, Miron and Astilean (2018), is presented a solution for pharmaceutical
    cold chain management using distributed ledger technologies. An application framework
    based on the Hyperledger Sawtooth distributed ledger framework is proposed for
    shipment tracking that will deliver information to all stakeholders during the
    distribution phase of pharmaceutical products. The solution includes a custom
    transactions family and a sensors gateway for automatically collecting data from
    temperature tracking devices.


    In Kinkelin, Hauner, Niedermayer and Carle (2018), is presented a Byzantine fault-tolerant
    configuration management system (CMS) that provides control over administrators,
    restrains their rights and enforces separation of concerns. The configuration
    management process required multiparty authorization for critical configurations
    to prevent individual malicious administrators from performing undesired actions
    and is supported on Hyperledger Fabric.


    In this chapter we focus our attention on the applications of the blockchain technology
    to CRM (customer relationship management) systems that involve business and research
    together. We discuss a model for the realization of a management infrastructure
    that is secure by design and able to support, by proper configuration, requirements
    and procedures of a business organization. The model adopts a decentralization
    of the software product at the application level by means of blockchain technology.
    The back end is based on the open-source platform Hyperledger to support business-to-business
    and business-to-customer transactions, and a front end where the business information
    is natively protected by cryptographic techniques provided by the blockchain protocols
    in order to reduce the attack surface.


    # Customer relationship management systems


    Customer relationship management is the answer to the need of business and enterprises
    to acquire and use a huge amount of data with an analytic approach in order to
    improve their performance (Barton, 2012). It has been'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'shown that this approach can be extended to all markets and that the injection
    of a huge amount of data, with the information they carry and their analytic evaluation,
    contribute to improved productivity and profitability of about 5–6 percent on
    average. The data collection process needs three steps: combining external and
    internal information, detecting predictive models for performance, and creating
    and using informatics tool for processing information and for changing internal
    capabilities. One of the objectives is the segmentation of customers into levels
    so that the enterprise can better target offers according to the segment customers
    belong to. The purpose is the establishment of long-term relationships with customers,
    with mutual trust generating added value through adopting a one-to-one marketing
    strategy (Greenberg, 2009).


    From the perspective of customers or central (state or international) guaranty
    units, the data acquired by enterprises and business societies can be a real social
    risk, in particular when data protection is not granted or correctly taken into
    account, especially nowadays, where data on customers are collected and maintained
    in decentralized structures accessible from the network, like cloud repositories
    of web servers. As a consequence, the more recent legal regulations impose the
    approach of “privacy by design” for CRM of any exposed business enterprise, as
    in the GDPR (General Data Protection Regulation). The enhanced attention on the
    privacy normative pushed vendors to create new products for granting security
    and privacy, but since the service and the applications were already designed
    and working, were introduced as intermediate layers between the application and
    the rest of the network as an add-on, such as firewalls, intrusion detection systems,
    intrusion prevention systems, web application firewalls, next generation firewalls
    and, ultimately, artificial intelligence.


    It is, by contrast, desirable to have at one’s disposal a CRM that is secure by
    design which breaks the architecture of traditional CRM and builds its infrastructure
    on an architecture that natively implements security, privacy, transparency and
    data integrity, as well as supports for customization of accesses and polices
    permissions to different hierarchical levels – in summary, a system that can manage
    data access, storage and exchange with the flexibility and efficacy of traditional
    CRM and, at the same time manages security and integrity issues natively, as for
    blockchain technologies.


    As a solution we present a model for CRM on Hyperledger Fabric, where customization
    of the architecture is native; access permission and control, as well as transaction
    control, are implemented by design; and security, privacy, immutability and integrity
    of data are natively granted by the blockchain technology. Our approach leverages
    the trust relying on the infrastructure publicly connected to the Internet and
    relies instead on cryptography based on Hyperledger Fabric in order to exploit
    its features of permissioned and private blockchain.'
