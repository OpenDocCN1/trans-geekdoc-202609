  img_proc: true
- pgno: 175
  md: 'Wibson is a paradigmatic case to observe the way in which the potentials of
    blockchain technology are being subsumed to the logic of the commodification of
    the Internet and, thus, leaving aside the discussions about the meaning of the
    public. It represents, put bluntly, another version of capitalist dispute.


    After this introduction, this manuscript is structured as follows. In the next
    two sections, we will place blockchain technology in the context of informational
    capitalism and particularly in the field of data commodification. The final section
    will describe the functioning of blockchain in general and of Wibson in particular.
    Regarding Wibson, we will focus on (1) the actors that participate in the process
    of data production and commercialization (individual actors, investors, the company
    that owns the app, etc.), trying to clarify the types of exchanges that take place
    between them, and (2) the discursive foundations on which the app is based. Finally,
    we present the conclusions.


    This chapter is mainly theoretical. Methodologically, it is based on secondary
    sources (Wibson’s official website, white paper and forum – called “Medium” –
    and other related journalistic materials) in order to characterize Wibson App
    and its discourse. Unfortunately, there is still no academic literature addressing
    Wibson or similar apps.


    # ## A theoretical starting point: informational capitalism, informational goods
    and intellectual property


    In this work we start from the idea that the present times can be named as “informational
    capitalism” (Castells, 1997). Contrary to the notion of a “knowledge society”,
    this concept aims to stress, on the one hand, the economic and social importance
    of knowledge, particularly that which is supported on digital information (DI).
    On the other, it stresses the capitalist character of this stage. “Capitalism
    itself has undergone a process of profound restructuring” (Castells, 1997: 2).
    We mention briefly two of its structural features, those essential to this manuscript.


    First, in informational capitalism, the “productivity and competitiveness” of
    agents “fundamentally depend upon their capacity to generate, process, and apply
    efficiently knowledge-based information” (Castells, 1997: 77), more precisely
    digital information (Zukerfeld, 2010). DI differs from other kinds of knowledge
    because of its “replicability”: it can be copied with costs tending to zero. Thus,
    videos, texts, images, software, databases and, generally, all goods made of pure
    DI (here “informational goods” – IG), escape from the logic of commodification
    of traditional or non-digital goods (Cafassi, 1998; Boutang, 2004; Rullani, 2004;
    Zukerfeld, 2010). Informational goods are, in this sense, non-rival and non-excludable,
    features that could lead to treat them as public goods, non-commodifiable goods
    by nature (Ostrom and Ostrom, 1977).


    Second, related to the first, knowledge regulation (that is, intellectual property)
    has expanded and grown dramatically in recent years, acting as the characteristic
    knowledge “enclosure” of the present stage (Boutang, 1999; Zukerfeld, 2010).'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'The film, music and software industries (among others) have been applying different
    strategies to prevent the replicability of DI and informational goods (by drawing
    upon technological developments such as rights digital management or by staging
    “exemplary” trials to so-called pirates) while at the same time taking advantage
    of this replicability (using free licensed goods and even applying selective violation
    of certain intellectual property rights) (Zukerfeld, 2010). Today, the dispute
    for commoditization of DI has reached the growing field of user-generated data.
    Internet giants such as Google or Facebook take advantage and commercialize enormous
    amounts of data coming from non-profit users. Blockchain, and specifically Wibson,
    join in this dispute.


    In the next section we describe briefly the socioeconomic importance of data commoditization
    on the Internet. We do so centered on one current business model, the one with
    which Wibson aims to compete.


    # Data values: an extended business model


    For profit usage, exploitation and commercialization of big amounts of data exceed
    that related to nonprofit users of the “social media”. Even more, data has always
    been important to economic production (Rullani, 2004). From the beginning of the
    twentieth century, for example, Taylorism entered the factories, enabling capture
    of data from the working process. Also, consulting companies have done the same
    in different ways across the word, many before digital revolution. Nowadays, firms
    capture – generally through consensorship – and analyze big amounts of data from
    their own production process (Srnicek, 2017). Meanwhile, state agencies have access
    to data from citizens and use it for different purposes. The Snowden case became
    famous after revealing a business political alliance from which data of phone
    calls and platform usage had been intercepted (Van Dijk, 2014). So-called data
    brokers such as Acxiom collect, analyze and commercialize big amounts of data
    from available public records and consumer surveys, although there is not an effective
    way to prove all of their sources (Roderick, 2014). Each of these processes of
    acceding and exploiting data has its own characteristics, regulations and actors.


    This chapter refers to not all but one particular kind of capitalist exploitation
    of data, and particularly to one extended kind of business model that makes profit
    from nonprofit users’ data on the web in a specific way. Although it could combine
    different strategies, this model consists mainly of freely providing a service
    (an email, a social network, a streaming service, a search engine, etc.) in exchange
    for users’ data. That is the case of Facebook, Twitter, LinkedIn, Skype, WhatsApp,
    YouTube, Gmail, Hotmail and so on. These are for-profit platforms or apps where
    advertisers can sell us things based on the information they collect on us, being
    big information intermediaries (Zukerfeld, 2010; Van Dijk, 2014; Scott, 2014).
    As Zukerfeld (2010) poses: instead of basing their business on the enforcement
    of intellectual property rights of their outputs, excluding those who don’t pay
    for it (meaning the service or IG they offer),'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'these platforms aim to be inclusive, inviting people to freely share their
    data (bringing the inputs)³ so they profit on related services and goods.


    During recent years, this model has been subject to all kinds of debates about
    privacy boundaries, abuses and lack of transparency by corporations. In fact,
    after years of debate, in 2018 the General Data Protection Regulation (GDPR) was
    enacted, a European Union law on data protection and privacy. In particular, Cambridge
    Analytica (CA) and Facebook have recently been in the eye of the storm, since
    it came to light that CA had collected and sold to politicians big amounts of
    user data from Facebook, affecting voter opinion in different countries. However,
    the relation between Facebook and CA is not much different from those that establish
    the abovementioned platforms with other companies. Platforms and apps daily share
    users’ data with third parties for the purpose of customized marketing in exchange
    for free services. Whatever happens inside these companies (and in between them)
    happens behind the data owners’ backs.


    Privacy and transparency are truly important, surely, but they do not pose the
    only nor the main question that these current extended practices do: what about
    value? In this business model, users not only give up part of their privacy and
    control of data, but part of their economic value as producers of data⁴ (Petersen,
    2008; Zukerfeld, 2010; Fuchs, 2010; Scholz, 2014; Srnicek, 2017 and so on).


    Data serves to improve productive processes, to develop new goods and services,
    to better know and predict people’s behavior, to discover new market “needs”,
    to position a good in the more profitable place and so on. Realistic or not, the
    metaphor of data as the twenty-first-century oil serves to show the current economic
    importance of the data market (Kenney, In Olma, 2014). Generally speaking, the
    data industry is estimated to be worth more than $100 billion and growing at almost
    10% a year (The Economist, 2010). The biggest companies in the information sector
    are making great investments on data management and analytics. Axciom, a giant
    data broker from the United States, for example, “collects and analyzes over 50
    trillion data transactions a year; storing detailed entries for more than 190
    million consumers and 144 million households in the USA alone, ... recording US$11.b
    in revenues in 2011” (Roderick, 2014: 1–2). Specifically regarding the business
    model in which we’re interested, that of user-generated data, Facebook “generated
    nearly $27 billion in revenue in 2016 via its advertising products, which is equivalent
    to around $20 per monthly active user per year” (Aitken, 2018). Barely a few years
    back, Google obtained gains for over $17 million USD just on advertising sells
    (Reischl, 2008). As some scholars have pointed out, nowadays data comes potentially
    from nearly a half of the world population, and access to the Internet is growing
    fast (Kenney, in Olma, 2014; Srnicek, 2017).


    Thus, Wibson comes to operate within one of the most profitable branches of the
    information sector, potentially competing with giant companies like Facebook and
    Google. Wibson’s CEO, Mat Travizano, has said that the app is'
