- pgno: 137
  md: 'These (partial) recentralization processes do not necessarily mean that DLTs
    have failed their purported self-governing idealistic goals. Recentralization
    could create the conditions for wider adoption by formal corporate and government
    structures. Ultimately, the value of decentralization is measured against the
    value that will be derived from the wider adoption due to the embrace and approval
    of institutional actors. In any case, such approval requires that part of the
    decentralization ideal is sacrificed for a more sophisticated governance that
    includes more robust regimes built for conflict resolution, technological auditing,
    or risk management. For example, code vulnerabilities discovered on the Bitcoin
    blockchain illustrate the need for reinforcing code review processes. Similarly,
    the validation of the longest chain is still the only available predominant conflict
    resolution mechanism. It thus becomes evident that, for the moment, the safeguards
    created are still in an early stage, and since they already have demonstrated
    their shortcomings, there is ample room for improving the overall decentralized
    governance structure.


    # 4. External existential threats


    If we look at the history of the Internet, of the open-source software domain,
    of privacy enhancing technologies (PETs), or of file sharing networks, existential
    threats emerge to be the most effective drivers of technological decentralization.
    Such threats present a clear and present danger to the practices, freedoms, autonomy,
    or mere existence of technology-enabled communities and practices. The network
    topology and the protocols of the Internet were shaped by military concerns over
    the vulnerabilities of centralized communication networks and the direct threat
    of a nuclear war. The open-source software movement was galvanized by the enclosure
    of software due to the copyrightability of software code and led to the decentralization
    of the loci of software development, the political decentralization of competing
    software implementations, and the legal decentralization through FLOSS licences.
    The Tor Onion Network is a decentralized network which provides anonymous communication
    to its users (Syverson, Dingledine, & Mathewson, 2004). Its development is partly
    funded by the US intelligence services to obfuscate law enforcement and intelligence
    communications. File-sharing technologies, from Napster to the BitTorrent protocol,
    became decentralized step by step, as lawsuits identified points where rights
    holders could shut down networks (Bodó, 2011; Giblin, 2011).


    External threats do not produce absolute technological decentralization. The exact
    degree of decentralization is set by the marginal costs and benefits of the attack
    and the defense. The BitTorrent protocol decentralized p2p file sharing to the
    extent at which the extra costs associated with online copyright enforcement exceed
    the achievable extra benefits. The Tor network does not provide full anonymity;
    it only renders monitoring and deanonymization prohibitively costly for anyone
    except probably state actors. Blockchain networks are not immutable, but a 51%
    attack is usually more costly than any potential benefits'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'it can provide. Such decentralization is thus very pragmatic. While it responds
    to legal, political, or economic threats, it is also based on more or less precise
    cost-benefit estimates and tends to not spend more resources on decentralization
    than what is absolutely made necessary by the economic, technological, and political
    conditions of the external threat. In blockchain-based systems, this cost-benefit
    analysis is also modelled in advance and used to incentivize the production of
    the network. Such decentralization is also gradual and responsive and develops
    in sync with the expected changes in the nature and the shifting economics of
    external threats.


    # 5. Endogenous and exogenous economic incentives


    The development of cryptoeconomics is one of the major, possibly long-term contributions
    of the blockchain domain to science. It refers to the use of game theory to design
    economic incentive systems to encourage certain desired properties in techno-social
    systems to hold into the future and discourage others to emerge (Buterin, 2017b),
    or to a “formal discipline that studies protocols that govern the production,
    distribution, and consumption of goods and services in a decentralized digital
    economy. Cryptoeconomics is a practical science that focuses on the design and
    characterization of these protocols” (Zamfir, 2015).


    When Benkler formulated his commons-based peer production (CBPP) paradigm, his
    central concern was how to organize the production of a common resource pool through
    nonmarket incentives. The CBPP literature focuses on the intrinsic and social
    sources of motivation to explain the production of shared resources and warns
    that extrinsic, monetary incentives actually crowd out other forms of motivations
    (Benkler, 2006, pp. 92–99). In contrast, blockchain-based cryptoeconomic techno-social
    systems differ from the logic of peer production in that they have built-in remuneration
    logics in the form of cryptoassets, or native tokens, which are used to incentivize
    the production of the resources the networks needs for its operation. Tokens are
    also used to compensate for the costs that such production activity incur (in
    forms of energy costs, investment, or expertise) (Narayanan et al., 2016). The
    token-based economic systems in DLTs are thus vehicles to extract and redistribute
    value. They are also designed in a way to only allow value extraction in certain,
    limited ways which preferably prevent the reconcentration in various dimensions,
    such as value extraction power.


    The blockchain technology community has paid a great deal of attention to the
    cryptoeconomic consequences of architectural choices, i.e., how the incentive
    structures of stakeholders and the corresponding Nash-equilibria of the games
    they are locked in may change due to different, on the surface purely technical,
    decisions. The aforementioned Bitcoin block size debate is the obvious case to
    demonstrate how the game-theoretical consequences were having an effect on the
    application of a technological, architectural choice. Yet not'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'all such consequences can be modelled at the time of taking a technical decision,
    which leads to situations where exogenous economic incentives (those that weren''t
    taken into account in the design) produce recentralization and the endogenous
    incentives (those that are built in the system) are unable to prevent this – or
    in the worst case, they (unintendedly) aggravate the problem.


    As Braudel (1992) and, in his footsteps, de Landa (1996) warn us, market players
    have an inherent incentive to eliminate market competition and the rules that
    control and ensure such competition. Blockchain-based technology social systems
    are no exception to this rule. Apparently, different blockchain stakeholders find
    ways through which they can eliminate competition from the provision of services
    the network relies on, resulting in the recentralization of decentralized systems.
    This antimarket, centralizing behavior can take multiple forms. Changing the endogenous
    incentive structures through majority vote or, if that fails, through a hard fork
    is one approach. The block size debate played out exactly in this manner, and
    as the improvement protocols aiming to increase the block size were voted down
    (Andresen, 2015), a number of hard forks ensued. Alternatives like Bitcoin Cash,
    Bitcoin XT, Bitcoin Classic and Bitcoin Unlimited allow for a higher degree of
    potential centralization in exchange for higher capacity. On the other hand, exploiting
    exogenous economic factors can also lead to recentralization. To illustrate this
    point, consider the dynamics of recentralization of the Bitcoin network. The specific
    algorithm used by Bitcoin''s Proof of Work (PoW) encouraged the development of
    highly efficient, specialized mining hardware components (Dev, 2014), a market
    which turned out to be highly centralized. In a different layer, PoW mining turned
    out to be energy intensive, as both the running and the cooling of mining hardware
    requires substantial amounts of energy. Consequently, miners tend to geographically
    cluster around cheap sources of energy and cooler climates. For any given block,
    only one miner can claim the mining reward, which produces a very unpredictable
    revenue flow for each individual miner. In response, miners organized themselves
    into a very small number of extremely influential mining pools which share mining
    revenues across members in a more predictable fashion.


    Some of these centralizing economic incentives can be foreseen and mitigated on
    the technology layer. Ethereum technology developers realized quite soon that
    market concentration through cartel formation is an issue to be dealt with on
    the level of the consensus protocol: “Cryptocurrency is incredibly concentrated.
    So is mining power. Oligopolistic competition is the norm in many ‘real-life’
    markets. Coordination between a small number of relatively wealthy validators
    is much easier than coordination between a large number of relatively poor validators.
    Cartels formation is completely expected, in our context.... Blockchain architecture
    is mechanism design for oligopolistic markets” (Zamfir, 2016). Yet such solutions
    are rarely straightforward, and there is no guarantee that the protocol design
    correctly predicts all potential exogenous incentives to recentralize.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Conclusion


    At the moment, there is a wide gap between the forms and extent of decentralization,
    as prescribed by the ideology, and the practical forms in which it manifests in
    various blockchain networks. Different blockchain implementations serve as case
    studies in unexpected recentralization of a technological infrastructure designed
    to be decentralized out of pure ideological reasons. Focusing on decentralization
    as an end-goal or as an ideologically supreme design choice “conceals relations
    and systems of domination, exploitation, and alienation” (Baldwin, 2018, p. 6).
    In addition, looking at decentralization at the technical layer alone is hardly
    enough. As countless studies on technological communities clustered around decentralized
    technological infrastructures suggest, a decentralized technical architecture
    does not automatically produce decentralized governance structures or more just
    worlds in general.


    As we have seen with blockchain technology evangelists, and the Web 3.0 summit
    organizers, ideological commitment to decentralization may produce decentralization,
    but it is hardly the only and, all accounts, may not even be the most effective
    driver. Decentralization comes with severe trade-offs in terms of scalability,
    efficiency, usability, security, etc. The optimal choice in these trade-offs differs
    context by context, and there is hardly a one-size-fits all degree of decentralization
    in the many interdependent layers of a techno-social system (Wang, Vergne, & Hsieh,
    2017).


    Decentralization is a powerful architectural feature of digital technology, because
    it can raise the costs of enforcing legal rules, rights, and obligations for private
    parties and the state alike. Unlike others (Wright & de Filippi, 2018), we are
    not convinced that decentralized blockchain networks would be able to bypass or
    negate the rule of law (Quintais, Bodó, Giannopoulou, & Ferrari, 2019) and would
    lead to the replacement of law by code. But different technological designs have
    a different enforcement calculus attached to them. More decentralized technologies,
    if done right, can be more difficult to rein in. What we have tried to argue in
    this chapter was that it is important for lawyers and policymakers, as well as
    those closely involved in the development, monetization, or use of the technology,
    to understand how the regulation capacities of technological systems interact
    with, reinforce, contest, and complement the regulatory capacity of legal instruments.
    Technology and law tend to develop in tandem: law develops to address new practices
    enabled by new forms of technology, and technology development reflects legal
    developments. This interlocking coevolution of law and code has sometimes been
    referred to as an arms race or a whack-a-mole game, describing, for example, the
    relationship of copyrights and file sharing technologies. However, such an approach
    locks technology and law in a binary opposition, a mutually antagonistic struggle
    for supremacy, sovereignty, revolt, and evasion. While this is a plausible scenario,
    it is not the only one. The concept, the process, and the practical outcome of
    technology decentralization is more complex than what the code vs. law'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'approach offers, and it is definitely not only about technological sovereignty
    and legal impunity. As we have shown, the decentralization efforts, so central
    in the blockchain discourse, enable a wide variety of technology development trajectories
    which produce different configurations of how law and code could work together
    to order technology-enabled practices and processes. In that process, some outcomes
    pose less of a challenge than others. The file sharing technology development
    ultimately produced a situation in which law enforcement is only possible at the
    deepest infrastructural levels, at the wires controlled by legally not liable
    ISPs. The understandable resistance to such a drastic approach created a situation
    where a decentralized technology enables sustained infringing activity. The emergence
    of a similar outcome in the blockchain space is both possible and avoidable through
    the better understanding of the processes that drive technology development.


