  img_proc: true
- pgno: 132
  md: 'fora and in specialized venues; (2) white papers that spell out the technical,
    economic, social, and political visions of various blockchain projects. The items
    on this list roughly map onto Lessig’s (1999) pathetic dot theory – markets, architecture,
    laws, and norms – but they offer a more detailed, context-specific insight into
    the actual workings into these forces. The list is far from being complete, and
    further work is needed to fully account for all the logics that produce (de)centralization
    in a techno-social system. Yet – we believe – the most important of these forces
    are the following: (1) ideology/systems design; (2) internal control/governability;
    (3) external recognition; (4) external threats; and (5) endogenous and exogenous
    economic incentives.


    # 1. Ideology/systems design


    While the quest for technological decentralization is often seen as a highly political
    endeavour, rooted in specific, techno-libertarian, or neoliberal ideologies (Barbrook
    & Cameron, 1995; Chohan, 2017; Columbia, 2016; May, 1994; Morozov, 2014), the
    foundational paper introducing Bitcoin (Nakamoto, 2008) does not directly invest
    in introducing an ideology of decentralization. However, an indirect reference
    exists in the Bitcoin genesis block and in subsequent posts published by Nakamoto
    on the functioning of Bitcoin (Nakamoto, 2009). The message in the genesis block
    references an article in *The Times* newspaper on the proposed second bailout
    of commercial banks during the 2008 financial crisis. The Nakamoto paper describes
    a technology that can be applied without needing established, centralized, and
    trusted intermediaries. Focused on currencies, which are formed based upon the
    most centralized models, Nakamoto explains that “while the system works well enough
    for most transactions, it still suffers from the inherent weaknesses of the trust
    based model”. Nakamoto delivered a detailed road map on how to reverse this model.


    The success of Bitcoin as an incorruptible trust system incited a renewed interest
    in decentralization as a technological solution to power inequalities and inspired
    the generalization of the Bitcoin idea. The Ethereum white paper (Buterin, 2013)
    presented blockchain technology as an underlying infrastructure that could apply
    the impersonal disintermediated trustless model proposed by the Nakamoto paper
    to “more than just money”. Ethereum introduced decentralized applications (Dapps)
    and decentralized autonomous organisations (DAOs), all running on a peer-to-peer
    network instead of running on a centralized computer.


    Yet decentralized technologies are proven to be prone to occasional recentralization
    due to forces we discuss later. For example, some blockchain technology architects,
    like Zamfir (2016), are focusing their work on the direct and indirect incentives
    which may lead to the recentralization of power in decentralized blockchain networks.
    More specifically, the preferred method of establishing consensus on the blockchain
    has been a dividing issue among different projects. Miner competition in validating
    blocks is an essential part of'
