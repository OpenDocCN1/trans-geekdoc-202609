- pgno: 29
  md: '# # The block is hot


    # ## A commons-based approach to the development and deployment of blockchains


    # *Sune Sandbeck, A.T. Kingsmith, and Julian von Bargen*


    # ## Introduction


    Blockchains are hot right now. To better understand why, we must examine the political
    conditions that underpin them. David Golumbia (2016) has illustrated in vivid
    detail the affinities between Bitcoin’s technical infrastructures – which replace
    a ‘trusted’ third party such as the state or platform with cryptographic proofs
    – and right-wing economic thought during the twentieth century, embodied in the
    likes of the John Birch Society and the Chicago School of Economics. Whether viewed
    as a database, a network, or a distributed ledger, it is clear that blockchain
    is much more than code or a computational tool for time-stamping data records
    and transaction. Not only does Bitcoin not exhaust the potential of cryptocurrencies,
    but cryptocurrencies do not exhaust the potential of blockchains. In fact, to
    mistake the tokens that accompany blockchains as always being cryptocurrencies
    is a misleading assumption that precludes alternative applications of blockchains
    beyond neoliberal incentivizing schemes.


    A blockchain is a distributed ledger or database shared across a digital network.
    What makes it different from most information that runs across the Internet is
    that blockchains are – like the early Internet – distributed, peer-to-peer systems.
    What makes a blockchain a blockchain is that every node in the network updates
    and maintains the distributed ledger independently, rather than leaving a master
    list in the possession of a single authority or host computer. This innovation
    caused exhilaration among defenders of the original model of the Internet because
    it reinvigorated old hopes for a decentralized information system beyond the control
    of any one authority, while also innovating on the classic model of the Internet
    by adding cryptography and a protocol to govern incentivization. By solving the
    problems of authenticity and authorization without a centralized authority, blockchains
    are said to amplify the capacity of bottom-up and non-hierarchical organizational
    structures, echoing a longing for the now lost (or more accurately never achieved)
    classical model of the Internet.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'In other words, as Rachel O''Dwyer (2016) observes, what blockchain offers
    is the possibility of cooperation without trust. Bitcoin and other cryptocurrencies
    are often propagated as a ‘trustless architecture’ – a *stand-in* for trust in
    the absence of traditional intermediaries such as local communities and regional
    regulators. O''Dwyer (2016) stresses that this configuration is actually something
    quite different from fostering or building trust. The claim being made by cyberlibertarians
    and other supporters is not that we can engineer greater levels of cooperation
    or trust in friends, institutions, or governments but that we can dispense with
    social and institutional relations altogether in favour of a purely technical
    solution. Through seemingly innocuous choices to limit algorithmically the supply
    of bitcoins or by requiring computational ‘proof of work’ to create new coins,
    such political commitments, as Golumbia (2016) emphasizes, are integrated into
    the technical design of the system.


    The history of blockchain, so far, has shown limited applications of the technology
    outside of financial speculation and risky investments in pursuit of spectacular
    returns. A central part of this dynamic is driven by core assumptions about the
    relationship between the technical architectures of blockchain and neoliberal
    modes of social and political governance. As the last decade has shown, there
    is no linear-causal relationship between decentralization in technical systems
    and egalitarian or equitable practices socially, politically, or economically
    (O''Dwyer 2016). Importantly, as Maurizio Lazzarato (2013) points out, features
    of neoliberalism such as decentralization, horizontality, and structurelessness
    are not so much threats to institutionalized regulatory mechanisms but an ideal
    solution to many of the impasses of classical liberal economics that generates
    the illusion of ‘governance with governing’.


    By conflating technical architectures with social or political modes of organization,
    blockchain supplants trust with the technical efficiency of the protocol (Galloway
    2004). This chapter is focused primarily on what is – and what will be – at stake
    in blockchain’s continuing embeddedness in the logics of neoliberalism. Through
    that lens, we begin by examining the transformation of classical liberal relations
    of exchange into neoliberal relations of competition. What is most important for
    us is the ways in which this shift in economic relations from exchange to competition
    constitutes a new mode of ‘governmentality’, or expansion in the scope of economic
    subjectivity that has been internalized in the protocols generating value on the
    blockchain.


    In drawing out these internalizations, we examine the monetary arguments advanced
    by cyberlibertarians to support Bitcoin as an ideal form of currency against fiat
    money, the latter considered to be defective at its core since it relies on a
    state-sanctioned authority for trust and legitimacy. To do so, we survey the problems
    with assumptions underlying the protocols of Bitcoin before turning to three broader
    social and political factors that affect blockchains: *production, value,* and
    *governance*. The goal of this first section is to strip the blockchain of the
    neoliberal baggage generated by the incentivization scheme of Bitcoin. Finally,
    we conclude by investigating what other options might exist'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'for developing and deploying the highly reliable, versatile forms of collective
    action in open networks made possible with blockchains on behalf of projects opposed
    to both neoliberal capitalism and libertarian politics. In this regard, we argue
    that the problem with most existing blockchain applications is not that they attempt
    to incentivize governmentality but rather that they attempt to incentivize the
    wrong kind of governmentality. In the final section, we focus primarily on attempts
    to incentivize a conception of trust as produced for sharing, recorded through
    an open and participatory consensus process and actualized as a sharing commons.


    # Homo economicus


    Neoliberalism is the restoration not only of class power – of capitalism as the
    only possible economic system – but of capitalism as fully synonymous with reality.
    What is imposed (or what is ‘restored’) is a shift from ‘homo economicus’ or ‘economic
    (hu)man’ as an exchanging creature to a competitive one whose tendency to compete
    must be fostered. Jason Read (2009, p. 28) summarizes the profound effects of
    this shift: “while exchange was considered to be natural, competition is understood
    by the neoliberals of the twentieth century to be an artificial relation that
    must be protected against the tendency for markets to form monopolies and interventions
    by the state”. This fundamental increase in the scope of economic rationality
    in neoliberal economics – the assertion that economics is coextensive with all
    of society, all of rationality – is not a natural state, but, as Michel Foucault
    (2008) catalogues, a form of naturalized ‘governmentality’ that requires constant
    intervention and management.


    Competition necessitates this constant intervention on the part of the state,
    not on the market, but on the conditions of the market. By making desirable activities
    accessible and undesirable activities socially and political costly, governmentality
    can influence the parameters of choice so as to render certain outcomes more likely
    when subjects calculate their ‘rational’ interests (Lazzarato 2015).¹ In this
    way, neoliberalism subordinates state power to the conditions of the marketplace,
    the implication being that ‘political problems’ can be recast in technical terms.
    The operative terms of this recasting are no longer rights but interest, investment,
    and competition. Whereas classical liberalism presumes rights that can be exchanged
    – as Read (2009) observes, the legal subject of the liberal state (*homo juridicus*)
    is constituted through the exchange of the social contract – neoliberalism offers
    the inalienable reality of the market.


    In order to produce the illusion of ‘governance without governing’, actors must
    have a great deal of freedom to act – to ‘choose’ between competing strategies.
    This choice is not a reality but a transformation of ideology in terms of its
