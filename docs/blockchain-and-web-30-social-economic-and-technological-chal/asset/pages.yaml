  md: "# Notes\n\n+   1 The authors are grateful to the anonymous reviewers for their\
    \ helpful comments. Nonetheless, the responsibility for any errors and opinions\
    \ rests with the authors. This chapter has been a collaborative enterprise, but\
    \ Guido Noto La Diega is responsible for the legal sections and James Stacey for\
    \ the technical ones.\n+   \n+   2 These are the computers that are connected\
    \ to the blockchain network. All blockchain-based applications are made up of\
    \ nodes. However, who can become a node and the level of involvement that is permissible\
    \ by each node will differ depending on the type of blockchain application deployed.\
    \ Nodes store a local copy of the blockchain. ‘Full’ nodes store a copy of the\
    \ blockchain in its entirety, while ‘light’ nodes only hold a portion of the blockchain\
    \ needed to verify transactions (Bacon (n 14) 11).\n+   \n+   3 Yaga (n 2) 38\
    \ underlines, however, that trust is needed even in supposedly trustless systems,\
    \ e.g., trust in the cryptographic technologies and that users are not colluding\
    \ in secret. For other critical remarks, see Carl, Uggla, and Hallström Carl-Johan,\
    \ ‘Is It as Trustless as They Say?: A Functional Analysis of the Blockchain and\
    \ Trust’ (2018).\n+   \n+   4 Consensus mechanisms, however, do not always lead\
    \ to correct execution results, because participants may be affected by economic\
    \ interests in the smart contracts, as pointed out by Chen, L., Xu, L., Gao, Z.,\
    \ Lu, Y., & Shi, W. (2018). ‘Tyranny of the Majority: On the (Im)possibility of\
    \ Correctness of Smart Contracts’. IEEE Security & Privacy, 16(4), 30–37.\n+ \
    \  \n+   5 In the UK, for example, the Financial Conduct Authority believe that\
    \ most initial coin offerings (ICOs) are unregulated, but they take a case-by-case\
    \ approach to decide whether ICOs fall within their remit – Financial Conduct,\
    \ Consumer warning about the risks of Initial Coin Offerings (‘ICOs’) (FCA, 2017).\n\
    +   \n+   6 Peter Yeoh, ‘Regulatory Issues in Blockchain Technology’ (2017) 25\
    \ JFRC 196, 200.\n+   \n+   7 On the problem of ‘legal hysteresis’, i.e., the\
    \ delay with which innovation is necessarily regulated, see Roberto Pardolesi,\
    \ ‘‘Software”, “property rights” e diritto d’autore: il ritorno dal paese delle\
    \ meraviglie’. (1987) 3, II Foro it., 300. The idea was applied to copyright regulation\
    \ by Guido Noto La Diega, ‘In Light of the Ends. Copyright Hysteresis and Private\
    \ Copy Exception after the British Academy of Songwriters, Composers and Authors\
    \ (BASCA) and others v Secretary of State for Business, Innovation and Skills\
    \ Case’. (2015) no. II Diritto Mercato Tecnologia 1–16.\n+   \n+   8 Charlotte\
    \ Waelde, Abbe Brown, Smita Kheria, and Jane Cornwell, Contemporary Intellectual\
    \ Property (OUP 2016), 3.\n+   \n+   9 2017/2772(RSP), para 22.\n+   \n+   10\
    \ The blockchain can smoothen royalty distribution by decreasing the role of traditional\
    \ intermediaries, though one can doubt that the middleman will actually be eliminated.\
    \ There are a number of reasons that suggest that the blockchain will not get\
    \ rid of intermediaries. These include the fact that traditional intermediaries\
    \ are substantially investing in the blockchain and the fact that the enforcement\
    \ of copyright online tends to target the intermediaries rather than the end users;\
    \ therefore, lawmakers and courts have a strong interest in keeping the middlemen\
    \ in the loop.\n+   \n+   11 Copyright transactions can be secured thanks to blockchain-based\
    \ smart contracts. However, it can be argued that these self-executing protocols\
    \ are neither ‘smart’ nor ‘contracts’, and this has practical legal consequences.\
    \ The fact that contracting parties using smart contracts (and smart licenses)\
    \ do not have the flexibility to breach the contract risks limiting the practical\
    \ impact of this application to the blockchain to very simple and routine transactions.\
    \ The efficient breach doctrine is evidence that, in most jurisdictions, the legal\
    \ systems protect the fundamental right of contracting parties to change their\
    \ mind and reallocate the resources in a more efficient way by breaching the contract.\
    \ Society and law are built upon the assumption that individuals can change their\
    \ mind, and this does not seem to be reflected in the lack of flexibility of this\
    \ new technology."
