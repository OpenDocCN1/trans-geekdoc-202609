- pgno: 312
  md: '# 4 The structural model of the success factors for blockchain-based crowdfunding


    The structural model demonstrating the relationships among the success factors
    is created from the initial reachability matrix (Table 16.4) and the partitioned
    levels (Table 16.6). In the directed graph, the top-level factors (Level I as
    shown in the Iteration 1, Table 16.6) are placed at the top of the group, the
    second-level factors (Level II) below the top-level ones, and so on until the
    base-level enablers (Level V) are placed at the lowest location. If the relationship
    between factors i and j exists, a directed arrow pointing from the influencing
    factor to the influenced factor is drawn. If the influence is mutual, a bidirectional
    arrow is drawn. The solid arrow line is used to connect two factors at two different
    levels. The dotted arrow line is used to connect two factors within the same level.
    The resulting diagram is a directed graph, as shown in Figure 16.1 (with number)
    and Figure 16.2 (with name), which demonstrates the hierarchical relationships
    among the factors.


    ![](img/a0011e82f3a3a41227dc70cd0ddb893a_312_0.png)


    Figure 16.1 The directed graph of the factors'
