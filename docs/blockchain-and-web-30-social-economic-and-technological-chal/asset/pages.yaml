  img_proc: true
- pgno: 152
  md: "For Schumpeter, the idea of permanent threat and the displacement caused by\
    \ ‘the new commodity, the new technology, the new source of supply, the new type\
    \ of organisation’ (Schumpeter, 2010: 72) was intended to oust traditional notions\
    \ of competition. In this regard, it is also sobering to briefly reflect on Schumpeter’s\
    \ conviction that the pervasive nature of this type of competition which ‘disciplines\
    \ before it attacks’ (Schumpeter, 2010: 72) was not simply a mechanism wherein\
    \ one monopoly replaces another but in fact should be seen as the very foundations\
    \ of a market economy.\n\nIn the book Zero to One, Peter Thiel, like Bower and\
    \ Christensen, takes certain aspects of Schumpeter’s work in order to put forward\
    \ his own economic treatise for the present day. Thiel’s approach is not only\
    \ to provide a rationale as to why the monopoly model is better than perfect competition\
    \ but to provide concrete examples of technological disruption. Thiel’s basic\
    \ formulation is almost textbook Schumpeter:\n\n> In the real world outside economic\
    \ theory, every business is successful exactly to the extent that it does something\
    \ others cannot. Monopoly is therefore not a pathology or an exception. Monopoly\
    \ is the condition of every successful business; [all happy companies earn] a\
    \ monopoly by solving a unique problem. All failed companies are the same: they\
    \ failed to escape competition.\n> \n> (Thiel, 2014: 34)\n\nNot only does the\
    \ model fit, but his use of the word ‘pathology’ is strongly reminiscent of Schumpeter’s\
    \ awareness of the way that monopolies had been linked with ‘vice’. What is more,\
    \ Thiel’s suggestion that ‘the history of progress is a history of better monopoly\
    \ businesses replacing incumbents’ (Thiel, 2014: 32) is an almost exact description\
    \ of the way in which technologies such as Steemit and Creative Passport are designed\
    \ to disrupt their respective environments. As with Thiel’s description of Apple’s\
    \ iOS ousting Microsoft, the intention is not to make Steemit and Creative Passport\
    \ compete with existing models and business, and neither are they supposed to\
    \ do things in a more efficient or cheaper way. Instead, they are both designed\
    \ to completely transform their respective sectors, ushering in wholesale transformations\
    \ both in our understanding of the relationship between creating content and being\
    \ rewarded on social media platforms and in our expectations around direct and\
    \ indirect rewards for creating and contributing to commercial content. Schumpeter\
    \ again:\n\n> [Monopolies] not only arise in the process of creative destruction\
    \ and function in a way entirely different from the basic schema, but in many\
    \ cases of decisive importance they provide the necessary form for the achievement.\
    \ They largely create what they exploit.\n> \n> (Schumpeter, 2010: 87)"
