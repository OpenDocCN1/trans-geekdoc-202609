  md: 'achieve a consistent view of all balances between any two parties. Building
    consensus requires each participant to group transactions into so-called blocks.
    Blocks have predecessors and successors, and hence they form a chain. Creating
    a block requires investing computational effort to solve a cryptographic problem.
    The first participant who successfully creates a new block and links it into the
    blockchain is rewarded with a certain amount of currency (Bitcoin or Ether, respectively,
    for Bitcoin and Ethereum). This is generally called “mining”.


    The cryptographic problem is defined such that participants of equal computational
    power have an equal probability of creating a new block. This construction ensures
    that the probability of fraud becomes extremely small and negligible – attempts
    to interfere with the consensus require the fraudulent participant to have more
    computational resources than most other participants combined.12 As long as the
    part of the network that has a “computational majority” behaves faithfully to
    the protocol, the network will preserve a trustworthy record of all transactions
    ever made. The consensus protocol is implemented in software that every participant
    can run.13 In this chapter, we always use the term participant as an entity participating
    in the network and consensus protocol.


    # 3. Smart contracts: nature, execution, and distinctive features


    The notion of smart contracts is an addition to the blockchain paradigm. A smart
    contract is a computer program that is executed by participants in a blockchain.14
    This is the same principle that web services employ: one can send and receive
    data from a web service via an interface and use it for further processing and
    display. With smart contracts, the difference is that every participant can create
    a smart contract and define a set of invocable routines (called “methods”) for
    other participants to use and interact with the smart contract. A toy example
    would be a smart contract that implements and exposes the functionality of a calculator
    in its methods. Other participants in the network, and in principle also other
    smart contracts, can invoke these methods to obtain results; e.g., they might
    send numbers to a method called “sum” and receive the total sum as a result.


    A smart contract is stored inside a transaction sent to the blockchain; hence
    once the network has achieved consensus, the smart contract becomes an immutable
    entry in the blockchain. All participants are required to execute a smart contract
    that is “invoked”, i.e., interacted with. Interactions with a smart contract are
    again transactions.15 This means that any interaction with a smart contract is
    also stored in the blockchain and hence transparent to the entire network.16 This
    is a necessary prerequisite for participants to maintain a consistent view of
    the ledger. Smart contracts are identified by (cryptographic) addresses, in the
    same way that senders and receivers in the network are identified by such addresses
    (and in general not by their real-world identity). Just like users, smart contracts
    may even have control over digital assets.'
