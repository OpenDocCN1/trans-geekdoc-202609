- pgno: 158
  md: '# Blockchained to what (end)?

    A socio-material provocation

    to check distributed futures


    Luke Heemsbergen, Alexia Maddox,

    and Robbie Fordyce


    # Introduction


    This chapter braces against the ideological tide washing in on distributed ledgers
    materialised through brands, services, markets, and promises bubbling up through
    signifiers like Bitcoin, smart contracts, altcoins, ICOs, or phrasing up that
    adds ‘blockchain enabled’ to various forms of digital communication practice.
    We consider and deconstruct the ideology of these phenomena with a media studies
    lens that can chart what ‘Web 3.0’ is considered to be in relation to distributed
    ledgers. Our argument proposes to understand blockchain through a sudden political
    widening of blockchain ideal use(rs) followed by a collapse to centralisations
    of blockchain as practice. This double movement of expansion and contraction has
    a long history in media studies, mirrored in understandings of how media apparatus
    (Agamben 2009; Foucault 1980) function, yet also takes into account the creative
    potential of disruptive media practice (Heemsbergen 2018), including Bitcoin specifically
    (Maddox et al. 2016). We understand blockchain through media studies in order
    to position it not as a revolution of networked computation or politics but as
    a media practice that enables historical comparators. The comparative lens we
    draw on offers insight, making visible similar ideological promises of decentralised
    or distributed media-politics that came to be constricted by structural forces.
    We note that our argument is not meant to offer a complete totalisation of blockchain
    as an apparatus of capture in the style of Agamben vis-a-vis the cellular phone.
    Instead, we hope to provide a critical counterpoint to the unrelenting tide of
    emancipatory blockchain prognoses. We submit that after the current expansionary
    tide washes in, its recession will reveal an adulterated communication life floor
    that shows the lasting power and meaning of these technologies’ use.


    Specifically, we argue that radical ideologies have intertwined with ‘new media’
    and specifically networked media since the 1960s, bending away only to bend back
    to centralising structures of commerce. Two exemplars of this are community access
    television (CATV), allowed by the expansion of cable TV, and the Internet and
    World Wide Web (WWW). Both these disruptive systems of creation that ostensibly
    broke away from centralised control are now better understood through how they
    re-formed centralised and centralising modes of control.'
