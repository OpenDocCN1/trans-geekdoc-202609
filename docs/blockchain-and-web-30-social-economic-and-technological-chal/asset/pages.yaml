- pgno: 111
  md: '# Could blockchain save journalism? An explorative study of blockchain''s potential
    to make journalism a more sustainable business


    Walid Al-Saqqaf and Malin Picha Edwardsson


    # Introduction


    Dozens of initiatives have emerged in recent years to explore the use of distributed/decentralised
    ledger technologies (DLTs) in general and public blockchains in particular for
    various purposes and by different industries and governments (Hileman and Rauchs,
    2017). Use cases vary widely and go well beyond the traditional financial technology
    (fintech) sector (Underwood, 2016) and into health care (Mettler, 2016), insurance
    (Mainelli and von Gunten, 2014), education (Sharples and Domingue, 2016), identity
    verification (Shrrier, Wu and Pentland, 2016) and many other domains (Al-Saqqaf
    and Seidler, 2017; Tapscott and Tapscott, 2016).


    It is established that blockchain''s distributed ledger functionality can eliminate
    the need to trust an intermediary, making it attractive for solving some of the
    problems facing financial as well as non-financial industries where eliminating
    middlemen is desired (Crosby et al., 2016, p. 17). In journalism, intermediaries
    can be viewed as those who are positioned between journalists and readers in such
    a way that give those intermediaries direct or indirect influence on editorial
    decisions. Examples of such intermediaries include media owners, gatekeepers,
    politicians and businesses.


    However, a reality check at this stage is due, since blockchain technology is
    at an early development phase; much of the discussion is hypothetical and highlights
    the potential benefits while not sufficiently reflecting on the hindrances and
    challenges that would prevent mass adoption. This leads to a widening gap between
    expectations and results and subsequently feeds blockchain-sceptical narratives
    (Pisa, 2018).


    This is further complicated by the fact that most blockchain and cryptocurrency
    start-ups end up failing relatively quickly (Biggs, 2018; Froelings, 2017). Much
    of the hype around blockchain is often driven by a perceived gold rush to generate
    wealth, either through speculation in the volatile cryptocurrency market or investing
    in initial coin offerings (ICOs) with the expectation of yielding very high returns
    in a short period of time (Zetzsche et al., 2017).'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'However, the use of blockchain in the field of journalism is relatively new
    and lacks substantial research into how this technology can impact the news media
    industry, which is currently going through many challenges, such as low public
    trust and profitability (Newman et al., 2017, p. 9).


    Journalism''s role in society, among other things, is to inform the public by
    presenting the news. If the public does not perceive the news as credible, journalism
    fails in achieving its core objective. Such a scenario leads to a lack of the
    means to remain sustainable and relevant.


    Traditionally, credibility of news has been assessed based on the credibility
    of the following layers: (1) the medium (newspaper, website, TV channel, etc.),
    (2) the source (journalist, writer) and (3) the message itself (text, images,
    video, etc.) (Kiousis, 2001; Sundar, 1999).


    Research has found that lower news credibility leads to less trust in the media
    where the news is published. This in turn leads to media scepticism and lower
    media exposure (Tsfati and Cappella, 2003). It can therefore be concluded that
    stronger news credibility can enhance sustainability, since higher media exposure
    naturally translates to higher revenues from advertisements, subscription fees,
    sponsorships, etc.


    Building on the connection between news credibility and media exposure, the aim
    of this study is to explore blockchain''s potential to enhance news credibility
    and thereby make journalism a more sustainable business. It is important to note
    here that being a sustainable business is but one of the consequences of news
    credibility, which also contributes to enhancing the audience''s trust and loyalty
    and creating a more informed public.


    By reflecting on the *relative advantage* attribute of the diffusion of innovations
    theory by Rogers (2003), this study assesses whether a blockchain-based, decentralised
    newsroom model can compete against the traditional centralised model. We would
    like to emphasise, however, that this attribute alone is not necessarily sufficient
    to prove that the innovation will be diffused to the masses.


    As a case study, we explore Civil, a blockchain-based protocol that aims at using
    cryptoeconomics to incentivise the production of journalistic quality content
    (Civil White Paper, 2018).


    Our research question is: How can blockchain enhance sustainability of journalism
    as a business? We address this by looking into the potential of blockchain to
    enhance news credibility in each of the aforementioned layers: (1) the medium,
    (2) the source and (3) the message.


    To answer this question, we use several methods. We first highlight blockchain''s
    main operating principles that set it apart from traditional database systems,
    namely (1) *decentralisation*, (2) *transparency*, (3) *equality* and (4) *accountability*
    (Al-Saqqaf and Seidler, 2017). The greatest potential for using blockchains is
    mainly in areas that could benefit from one or more of these principles.


    *Decentralisation* eliminates the need for intermediaries or central points, as
    all operations are peer to peer. *Transparency* keeps all activities done on the
    block-chain timestamped and openly visible to all peers. *Equality* guarantees
    that all'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'peers on the network that are represented by corresponding wallet addresses
    are treated equally with the exact same rules. Accountability necessitates that
    data on the blockchain is secure and immutable, making it immune from being hacked
    or manipulated or changed. Absolute accountability is vital for smart contracts
    on the blockchain to operate as expected without possibility for manipulation
    or exceptions.


    Second, we draw connections between the aforementioned operating principles and
    how they affect each of the three layers influencing news credibility. Our method
    involves studying the Civil white paper and other texts available on the project’s
    official website (https://civil.co) and carrying out a test on the trial version
    of the Civil platform in order to experience how it functions in real time. To
    obtain information not available on the website, we conduct interviews by email
    with key members of the Civil Company leadership team, namely co-founder and CEO
    Matthew Iles, co-founder and head of marketing Matt Coolidge and co-founder and
    engineering lead Dan Kinsley. We also interview Maria Bustillos, who is the editor
    of Popula (https://popula. com), one of the newsrooms created on the Civil platform.


    Third, we analyse our results in view of the relative advantage attribute of the
    diffusion of innovations theory by Rogers (2003).


    # The diffusion of innovations theory


    In this study, we attempt to explore the potential use of blockchain in making
    journalism a more sustainable business. When doing so, we use the relative advantage
    attribute of the diffusion of innovations theory by Rogers (2003).


    Everett M. Rogers first presented his theory about diffusion of innovations in
    1962, and ever since then the theory has been widely applied by communications
    scholars. Rogers defines diffusion as “the process by which an innovation is communicated
    through certain channels over time among the members of a social system. Diffusion
    is a special type of communication concerned with the spread of messages that
    are perceived as new ideas” (Rogers, 2003, p. 35). Furthermore, he argues that
    “diffusion is a kind of social change, defined as the process by which alteration
    occurs in the structure and function of a social system” (ibid, p. 6).


    Rogers describes five innovation attributes – useful for understanding why some
    ideas diffuse more easily than others. These attributes are


    +   1 Relative advantage, which is “the degree to which an innovation is perceived
    as being better than the idea it supersedes” (ibid, p. 229).

    +   2 Compatibility, which is “the degree to which [the] innovation is perceived
    as consistent with the existing values, past experiences, and needs of potential
    adopter” (ibid, p. 240). Compatibility can help the individual give meaning to
    the new ideas so they are regarded as more familiar. “An innovation can be compatible
    or incompatible with 1) sociocultural values and beliefs, 2)'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'previously introduced ideas, and/or 3) client needs for the innovation” (ibid,
    p. 240).


    +   3 The complexity of an innovation is the degree to which an innovation is
    perceived as relatively difficult to understand and use. According to Rogers,
    the complexity “is negatively related to its rate of adoption” (ibid, p. 257).


    +   4 Triability is the degree to which an innovation may be experimented with
    on a limited basis. New ideas that can be tried easily are generally adopted more
    rapidly than others (ibid, p. 258).


    +   5 Observability is the degree to which the results of an innovation are visible
    to others. Some ideas are easily observed and communicated to other people, whereas
    other innovations are not (ibid, p. 258).


    It is still important to note, however, that several critics, including Rogers
    himself, indicate that diffusion of innovations theory is not without limitations.
    One such limitation is that the theory has a “pro-innovation bias”, implying that
    innovations are desirable and should be adopted quickly and without modification
    (Rogers, 2003; Ekdale et al., 2015).


    Due to time and space limitations, this paper will be confined to the theory’s
    first attribute of relative advantage by examining whether a blockchain-based
    journalism newsroom, with Civil as a case study, can be superior to a traditional
    newsroom in enhancing sustainability and news credibility. The aim is to take
    this as the first step that would then allow future research into this domain
    to cover the other attributes.


    # Use cases in journalism


    When mapping the field of blockchain and journalism, we briefly present six main
    areas that can either directly or indirectly utilise blockchain for journalism.


    +   1 Combating fake news and disinformation: Creating an ecosystem or mechanism
    that encourages the publishing of accurate information and preventing the spread
    of fake news and disinformation. This requires marking and rating news items based
    on whether they contain any inaccuracies and filtering them over time so that
    readers are exposed to factual stories and informed about any fake news that may
    have been produced earlier. Projects that aim at limiting the distribution of
    fake news by using the blockchain include Trive (https://trive.news), DNN (https://dnn.media),
    Snip (https://media.snip.today), Civil (https://civil.co), PressCoin (https://presscoin.com),
    Userfeeds (https://userfeeds.io), Bitpress (https://bitpress.network), Truepic
    (https://truepic.com/). For example, Truepic allows content creators of audiovisual
    content to embed geolocation, camera and software information and other metadata
    to the photo/video file and store a hashcode representation of the file on the
    Bitcoin blockchain (Berkhead, 2017). It has been argued that blockchain technology
    has the'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'potential in theory to facilitate the detection and tracking of fake news on
    social media content with blockchain (Jing and Murugesan, 2018).


    +   2 **Preserving intellectual property:** Blockchain''s ability to keep immutable
    records allows the creation of *proof of publication* of original media content
    to be one way through which intellectual property (IP) can be protected by providing
    means to authenticate and certify original content creation. As long as this original
    record is recognised by all beneficiaries, there will be consensus on who owns
    the intellectual property for any article or creative work that is timestamped
    and stored on the blockchain. While Civil and Reporter (http://reportercommunity.tech)
    offer a method to resolve IP disputes between authors, Snip detects the reuse
    of original content and informs the original writer automatically. The other two
    projects, Stock Block (https://stockblock.io) and Binded (https://binded.com),
    aim to provide this function only for visual content. Truepic, on the other hand,
    allows the verification and certification of photo and video authenticity by storing
    on the Bitcoin blockchain a hash of the content and metadata such as date, time
    and location of any image or videos captured. Blockchain and smart contract uses
    for protecting IP has also been argued to be useful in supporting online open
    innovation by allowing creators of original work to timestamp an IP disclosure
    or creation on the blockchain (de la Rosa et al., 2016).


    +   3 **Limiting bias and external influence:** One of the problems that several
    blockchain-driven journalism projects emphasise is the bias and lack of objectivity
    that mainstream media often suffer from. The main reason for this is often the
    reliance on advertising revenues from corporations and other powerful entities.
    To combat this, Civil, PressCoin, DNN and Publicism (https://publicism.nl) offer
    incentives in cryptocurrency payments to discourage bias and encourage objectivity
    and writing openly on subjects that may be sensitive, such as reporting cases
    of corruption or abuse of power. Since writers do not rely on advertising, they
    are compensated with cryptocurrency rewards – often in units called tokens – based
    on how factual and objective their reporting is. Civil in particular has highlighted
    this as a major aim behind the project (Iles, 2016).


    +   4 **Resisting censorship:** The high degree of decentralisation offered by
    open permissionless blockchains allows them to be inherently censorship resistant,
    since they necessitate storing transaction data on multiple devices. Civil, DNN,
    PressCoin, OngSocial (https://ongcoin.io), Steemit (https://steem.io), SocialX
    (https://socialx.network), Publicism, Bitpress and PUBLIQ (https://publiciq.network)
    are examples of blockchain-enabled projects that aim at using open and public
    blockchains to ensure that data is accessible to readers despite attempts by gatekeepers
    to prevent access through domain filtering and other technical censorship methods
    (Mattila, 2016, p. 9).


    +   5 **Protecting whistleblowers:** Allowing individuals to hide their identity
    when providing sensitive data is a domain that appears to be supported by'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'the pseudonymous nature of public blockchains such as Bitcoin and Ethereum.
    The two start-ups Truetheum (https://truetheum.com) and Publicism have explicitly
    mentioned protecting whistleblowers as one of their main objectives and do so
    by not requiring any personal information when connected with the source via cryptocurrency
    addresses. While Bitcoin and Ethereum can provide partial anonymity, other permissionless
    blockchains such as Zcash and Monero can be used to give a high degree of privacy
    and anonymity (Henry, Herzberg and Kate, 2018).


    +   6 Encouraging content creation by users: While some of the blockchain journalism
    projects, such as Civil, are meant to be used to create complete newsrooms, other
    projects such as DNN, PressCoin, OngSocial, Steemit and Hashtiv (https://hashtiv.io)
    aim at using the blockchain instead of centralised services to store user content.
    Unlike centralised services such as Facebook or Twitter, Steemit, for example,
    allows users to use different web applications to produce and view text content
    that is stored on the Steemit blockchain in a decentralised manner without relying
    on a central server. Using third-party applications such as d.tube, Steemit also
    allows users to store videos in a distributed manner using the InterPlanetary
    File System (IPFS) protocol (Chohan, 2018). This in turn encourages citizens to
    produce original content including journalistic articles without the fear of censorship
    or control. Blockchain-based social media projects can develop a reputation system
    that allows users to evaluate and rate published content in an incentive-driven
    manner (Kolonin et al., 2018).


    The six areas presented here are not mutually exclusive, which explains why we
    found several projects covering more than one. Furthermore, the list is not exhaustive
    and does not consider scalability or limitations. What is noticeable in most of
    the aforementioned projects is that they mostly focus on integrating the blockchain
    technology into the media content production process, and several focus exclusively
    on journalistic content. Yet since the technology is rather new and untested,
    there will certainly be challenges and, in some cases, hindrances that may prevent
    their realisation.


    Due to limitations on time and resources, we have only looked into Civil as a
    single-case study representing a start-up promising to make journalism more sustainable.
    Civil was the case study of choice due to its prominence in the media, high profile
    partners, comparatively advanced stage of development and increased willingness
    to share its information and platform details compared to similar projects. It
    also is the only platform of its kind that already has a functional backend where
    testing the various functions was possible.


    # Civil: betting on cryptoeconomics


    Established in 2016, the Civil Media Company created Civil as a decentralised
    communications protocol that aims at using blockchain-enabled cryptoeconomics'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'to facilitate the creation and governance of and financially sustain distributed,
    independent and decentralised newsrooms. The aim is to produce high-quality and
    local, international, investigative and policy journalism (Civil White Paper,
    2018).


    As the birthplace of blockchain and cryptoeconomics, Bitcoin has proven that it
    is possible to create a reward system by using incentives and cryptography (Stark,
    2017). Blockchain entrepreneur Josh Stark defines cryptoeconomics as “the practical
    science of using economic mechanisms to build distributed systems, where important
    properties of that system are guaranteed by financial incentives and where the
    economic mechanisms are guaranteed by cryptography” (ibid).


    With capital totalling $5 million, Civil launched 14 projects representing the
    first fleet of newsrooms doing local, policy, investigative and foreign reporting.
    Popula editor Maria Bustillos said her newsroom decided to be a subscription-based
    publication. Her first question to the Civil team upon joining the first newsroom
    fleet was about the platform’s capacity to keep a permanent archive on the blockchain.
    “Those archives are indelible and can be shut down only by shutting down the 17,000-plus
    computers worldwide that currently comprise the Ethereum network,” she said (Bustillos,
    2018). Apart from being used to creating newsrooms, an investment from ConsenSys
    was also used to create Civil Studios to fund and pilot some projects that use
    the Civil platform as well as media projects on the blockchain at large (Roberts,
    2018).


    The company''s co-Founder and CEO, Matthew Iles, states in a 2016 blog post on
    Medium that Civil’s goal is to use cryptoeconomics to save the journalism industry
    from an ongoing crisis caused by a broken revenue model, disinformation and unfair
    compensation to curators and content providers (Iles, 2016).


    To do this, the Civil team created a new Ethereum ERC20-based token named CVL
    instead of establishing an independent blockchain. The CVL token serves as a utility
    that is necessary for the functioning of the Civil protocol, which utilises Ethereum’s
    smart contract capabilities. The token is used to create newsrooms, reward writers
    and newsroom editors, and vote on various matters ranging from assessing challenges
    to newsrooms to dealing with potential complaints of violations of journalistic
    standards. Additionally, CVL holders can be sponsors by pooling tokens together
    to cover the deposit staked for somebody else’s newsroom. While this dependency
    on Ethereum takes advantage of its robust and massive network and resources and
    reduces the risk of 51% attacks, which have become a strategy to attack young
    blockchains in recent years (Hertig, 2018), it also exposes Civil to Ethereum’s
    vulnerabilities and risks, such as slow transaction speed, especially during peak
    periods. One example of this scalability problem happened when the whole Ethereum
    network came to a temporary grinding halt in 2017 due to the spike in use of the
    CryptoKitties’ decentralised application (Khalif, 2017). Furthermore, it was found
    that the ERC20 standard lacks an event-(transaction)-handling'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'mechanism and has other weaknesses, which led to the introduction of alternative
    standards (Mulders, 2018).


    On 18 September 2018, Civil kicked off its official ICO to sell up to 34 million
    CVL tokens out of a total of 100 million. Applicants wishing to buy CVL through
    the ICO had to meet stringent requirements, including taking a quiz that even
    some journalists failed (Wang, 2018). A month after its launch, however, the ICO
    did not achieve its intended initial $8 million soft target, as only $1.4 million
    of sales took place. About $1.1 million of the raised amount came from ConsenSys,
    which is the main initial backer of the project. Since the sale was unsuccessful,
    Civil refunded all investors and announced that it will launch a second ICO with
    less stringent requirements (De Silva, 2018).


    The scrutiny that buyers of CVL tokens had to go through was meant to prevent
    the amassing of tokens by possible malicious attackers or speculators (Wang, 2018).
    However, this very scrutiny may have been one of several contributing factors
    behind the failed ICO, which explains why Civil is pledging to make the second
    ICO simpler. Nonetheless, the scrutiny is meant to apply only to the ICO stage,
    after which Civil’s initial plan is to only make CVL available on AirSwap’s secondary
    market for at least a year, which would continue to require those interested in
    purchasing CVL to provide evidence that they have used CVL within the Civil platform
    before they can liquidate them (Coolidge, 2018c). If demand increases, it is likely
    that CVL would become publicly tradable via third-party exchanges. Using such
    external intermediaries involves the risk of losing deposits due to cyberattacks
    or mismanagement (Moore and Christin, 2013). The implications of relying on third-party
    exchanges for blockchain projects exposes them to higher risk of having their
    funds hacked, since millions of US dollars have been stolen from centralised exchanges
    in the past (Khatwani, 2018). Additionally, such exchanges defeat the main purpose
    of blockchain in enhancing decentralisation and can arguably be seen as a bottleneck
    for many who wish to purchase CIVIL. While there are several emerging decentralised
    exchanges, they remain far less popular, with fewer traders, and have fewer tradeable
    cryptocurrencies.


    Defined as the “the heart of Civil,” the Civil Constitution describes the mission,
    purpose and values that newsrooms need to abide by to remain part of the platform
    (Civil Constitution, 2018). The initial version of the constitution was drafted
    in consultation with journalists and cryptoeconomics and legal advisors. The constitution
    is similar to the traditional terms of service (ToS) but with a focus on a commitment
    to high standards of ethical journalism (Coolidge, 2018b). It is worth noting
    that the Civil team plans to make it possible in the future to have the constitution
    amended through a process, allowing any CVL token holder to propose an amendment,
    stake CVL tokens and go through a voting process. If a newsroom disagrees fundamentally
    with a new Constitution amendment, it has the right to withdraw its CVL application
    deposit stake and be removed from the registry.


    To create a newsroom on Civil, applicants need to deposit $1,000 worth of CVL
    tokens, which is then held by one of the protocol’s smart contracts as'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'insurance in case the owner or writers in the newsroom violate the constitution.
    Once accepted, the newsroom joins the token-curated registry (TCR) and has its
    entry added to the Ethereum blockchain.


    Since the CVL token had not yet been publicly tradable at the time this chapter
    was submitted for publication, the Civil team provided us with 3,000 units of
    free tokens (TESTCVL) on the Ethereum Rinkeby Test Network. These tokens were
    meant purely for testing purposes. We created a test newsroom after staking 100
    TESTCVL and had it approved after it went unchallenged. We also challenged another
    newsroom for demonstration purposes and won that challenge, earning our account
    100 TESTCVL as a reward (Etherscan.io, 2018). The process went rather smoothly
    and promptly. However, one would naturally expect a longer processing time when
    the service is officially launched on Ethereum''s Main Network, since it can only
    handle a maximum of 20 transactions per second, which is extremely slow compared
    to the 10,000 transactions per second average of Visa (Peck, 2017).


    The process of applying to create a newsroom and joining the Civil Registry is
    composed of several steps, as illustrated in Figure 7.1. The first requires writing
    the name of the newsroom and the wallet addresses of any additional members who
    are part of the newsroom (if any). Thereafter, required details on the mission
    and other information about the newsroom in addition to a charter


    ![](img/a0011e82f3a3a41227dc70cd0ddb893a_119_0.png)


    Figure 7.1 A flow chart illustrating the cryptoeconomics model of Civil'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'are supplied. The third step involves depositing an amount of CVL tokens equivalent
    to $1,000 to have the application officially filed.


    At this stage, the filed application remains pending for 14 days, during which
    any CVL token holder has the opportunity to review the application and challenge
    the newsroom by staking $1,000 worth of CVL tokens. Challenges should be derived
    from an interpretation that the newsroom’s mission or other attributes may be
    in violation of the constitution. Challenges to a newsroom can also take place
    after a newsroom is accepted into the registry, for example, when an article published
    by the newsroom is viewed as being in violation of the constitution. The only
    condition is that there can be only one challenge per newsroom at any given time.


    The process of voting for or against the challenge is allowed within ten days
    after the challenge. An additional seven days are reserved for vote commitment,
    i.e., making votes count. This system is meant to incentivise members to examine
    the challenge carefully and vote in a way that would increase their chances of
    voting with the majority. For a challenge against a newsroom to succeed, it has
    to garner at least 50 percent of the votes cast.


    This scenario would work in a situation where the majority behave in accordance
    with expected norms. However, there is still risk of malicious intent to take
    over the network by launching a 51% attack against any newsroom. Additionally,
    it is still theoretically possible to form alliances and win a majority vote needed
    to take down a newsroom.


    To minimise the risk of such attacks, the Civil protocol allows anyone to appeal
    up to three days after the votes are committed to the Civil Council, which is
    composed of a group of experts. This group will initially be composed of nine
    individuals appointed by the Civil Media Company to serve a one-year term. In
    the future, Civil plans to have council members nominated and elected by token
    holders to achieve community self-governance away from any influence by the Civil
    Media Company (Civil Constitution, 2018).


    If the appeal period ends without any appeal to the council, the newsroom is taken
    off the registry and the full amount staked by the newsroom is seized and divided
    so that 50 percent of the total sum is awarded to the challenger and the remaining
    50percent is divided equally among those who voted for the challenge.


    If the challenge fails to get 50 percent of the vote, the amount staked by the
    challenger is seized and divided so that 50 percent of the total goes to the newsroom
    and 50 percent is divided equally among those who voted against the challenger.
    Voters in either case do not need to stake any CVL, limiting any risk of losing
    CVL tokens and encouraging voters to participate.


    For an appeal to be filed, the equivalent in CVL tokens of $1,000 needs to be
    staked. Thereafter, the council deliberates for a maximum of two weeks and decides
    whether to grant the appeal and overturn the vote or reject the appeal. Council
    members vote independently, with a simple majority being necessary to make a decision.
    Council members who end up winning the vote need to'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'produce a public document to justify their decision based on the constitution.
    Unlike the voting process regarding challenges, votes of council members regarding
    appeals are neither on-chain nor transparent, as the final decision is delivered
    via a single Gnosis Multisig wallet representing a binary decision to either grant
    or reject the appeal. This prevents the community from knowing which of the council
    members voted for or against an appeal and which (if any) did not vote or abstained.
    Civil’s lead engineer, Dan Kinsley, acknowledges this issue and notes that the
    Civil team is looking into developing more sophisticated ways to automate the
    process and make it more transparent (Kinsley, 2018).


    It is to be noted that the council has the power to overturn the result of the
    vote if an appeal is granted and the council has strong reason to believe that
    the vote outcome violated the constitution. If the council grants the appeal,
    any token holder can stake $1,000 worth of CVL to call for challenging the council’s
    decision within seven days after the appeal was granted. For the veto to succeed,
    it needs at least a two-thirds supermajority. If the decision was not vetoed within
    seven days or the veto failed to secure a supermajority, the council’s granting
    of the appeal practically means that the vote results are overturned and flow
    of tokens is reversed.


    In the exceptional situation of a deliberate malicious attack that results in
    the control of more than two-thirds of the vote, for example, by owning most of
    the CVL tokens, the Civil platform would then be rendered hijacked, resulting
    in a possible fork of the whole network or even the close-down of the platform
    to prevent further damage.


    According to Coolidge, the aim of using cryptoeconomics and giving an intervention
    role to the council when needed is to help inform the voting process, and it reinforces
    the role of the constitution as the “primary document that should guide voter
    rationale” (Coolidge, 2018c).


    # Relative advantage of a civil-based newsroom


    Despite limitations such as the “pro-innovation bias” mentioned earlier (Ekdale
    et al., 2015), it is useful to reflect on Rogers’ theory of innovation in relation
    to a Civil-based newsroom. That being said, we also look into shortcomings and
    weaknesses that Civil may introduce and address them openly in this paper.


    Rogers describes five innovation attributes that are useful for understanding
    why some ideas diffuse more easily than others. One of these attributes is relative
    advantage, which is “the degree to which an innovation is perceived as being better
    than the idea it supersedes” (Rogers, 2003, p. 229).


    When reflecting on this attribute in relation to a Civil-based newsroom, we argue
    that the cryptoeconomic dynamics in Civil appear to partially take advantage of
    the four operational principles of blockchains (decentralisation, equality, transparency
    and accountability) in order to make newsrooms more sustainable by enabling them
    to produce news content that could be perceived as more credible.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'Decentralisation on Civil is partial and mainly introduced by giving a decentralised
    network of CVL holders the ability to create and challenge newsrooms instead of
    having that done by a specific centralised authority. Although the Civil protocol
    interface operates via a website hosted on a central server, forcing the Civil
    community to rely on it for voting and applications to join the registry, newsrooms
    remain autonomous and are able to generate revenues from other CVL token holders
    who could purchase licenses and stories, as well as from external sources.


    With more newsrooms joining, there will be more demand for CVL tokens, leading
    to higher profitably for token holders, since the total number of tokens is finite.
    As newsrooms receive and are rewarded CVL tokens through their services, they,
    too, would profit and be more sustainable. By being more sustainable, they are
    less prone to external pressure by business and politics, hence enhancing their
    news credibility as a medium of news content.


    However, to be fully decentralised, Civil newsrooms would need to be self-sustaining
    without relying on Civil’s website. This is necessary to avoid centralising control
    in the hands of Civil, which would defeat the main purpose of blockchain. Due
    to current reliance on Civil’s website and servers, all Civil newsrooms may suffer
    if the Civil server is exposed to an attack or malfunction. Once fully operational,
    the Civil ecosystem may also collapse if the company owning it runs out of business,
    which is a possibility given that most block-chain startups have failed (Biggs,
    2018). In order to avoid such a scenario, Civil would have to create and allow
    access to an open-source decentralised application (dApp) that would run on the
    devices of CVL holders and communicate directly with the blockchain without Civil’s
    server as an intermediary.


    Equality on Civil is also partial, even though all votes are counted equally with
    no preferential treatment. Those with more CVL are able to issue more challenges
    and create more newsrooms, which can theoretically lead to abuse. The possibility
    of abuse is reduced by the fact that challengers cannot win without the backing
    of the majority of voters.


    In a situation where the majority of participating nodes support the constitution,
    a clear positive influence can be expected by upholding journalistic values, which
    in turn enhances news credibility. In cases where the majority of voters seem
    to act against the constitution, equality may be perceived as a weakness, and
    the Civil Council can therefore overrule the majority if the decision is appealed.
    This clearly gives the Civil Council tremendous power and makes it vital to properly
    interpret the constitution if it is to take fair decisions. It also presents an
    apparent paradox where having a gatekeeper may be necessary in occasions where
    voters don’t act rationally, leading to asking if blockchain is perhaps not the
    right technology to use in this situation, since its main advantage is to eliminate
    the intermediary.


    Transparency within Civil’s ecosystem largely depends on the newsrooms, since
    they can decide whether to publish online content via a smart contract on the
    blockchain or bypass it and publish directly on the web. In the former'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'case, changes can be tracked, since articles would be timestamped and traceable
    to the individual author or group of authors, forming a permanent archive.


    Since one key factor to consider in news credibility is the source, using the
    blockchain as a means to publish content can lead to enhancing news credibility
    by revealing the ultimate source (author) and having that immutably recorded on
    the blockchain.


    On the other hand, the fact that Civil newsrooms maintain a high degree of autonomy
    in receiving external funding can potentially open the door to outside influence
    and lead to biased editorial decisions. To prevent this, Civil allows CVL holders
    to challenge newsrooms when any of their authors seem to violate the constitution.
    Therefore, we conclude that Civil allows transparency as long as the newsrooms
    opt to use the blockchain for publishing content and maintain a transparent record
    of their revenues.


    Accountability in the technical sense is ensured through smart contracts, because
    they insulate the voting process from manipulation. This creates a system of checks
    and balances, since smart contracts are immutable and their behaviour is predictable
    in advance of code execution, provided that the source code of smart contracts
    is properly audited, which is a major challenge in this space (Nikolic et al.,
    2018).


    Another serious concern that arises here is the inability to verify the identity
    of the wallet address holders, whether voters or challengers. By design, public
    permissionless blockchains such as Bitcoin and Ethereum do not care about identity
    of the node so long as it can verify the legitimacy of a transaction. Some situations
    require linking a node to the real identity of the person behind it; otherwise,
    voting may end up being abused with the same individuals possibly voting multiple
    times using different wallet addresses. Additionally, lax security on the device
    may lead to hackers infiltrating the wallet and taking over control from the real
    owner, effectively voting on his/ her behalf. This may open the door for vote
    fraud and buying. Furthermore, the vote is immutable, making it impossible to
    invalidate or make corrections after the fact. Hence, there has been some scepticism
    about whether blockchains are the right technology to use for real voting purposes
    (Juels, Eyal and Naor, 2018).


    For the voting process on Civil to be truly democratic, each vote would have to
    come from a unique individual. It is possible to imagine a scenario in which CVL
    tokens have changed hands several times and that a single individual or entity
    was able to vote multiple times using different wallet addresses. Such a scenario
    leads to weakening the democratic process by giving more voting power to a particular
    individual/entity and leads to a less accountable system. The ability of using
    blockchain to establish and verify digital identities is debated due to the dependency
    on external central authority (Olshansky and Wilson, 2018). This, again, presents
    the question of whether blockchain is suitable for a system that requires voting
    to be done in a one-person-per-vote fashion.'
