  md: 'exists throughout. Throughout networked media, or in Joselite’s action-oriented
    language, a ‘thoroughgoing’ that extends completely is the capacity for control.
    This control reflects structural and narrative constraints on networked communication
    practice.


    In sum, then, the point of both these historical comparators is to show that radical
    communication technologies and practices come to be integrated into structures
    of political economy over time. That economy may bend in response to these disruptions
    but rarely breaks. Even as new media technologies emerge surrounded by praise
    for perceived radical, liberatory, or hyper-disruptive aspects, these ideological
    promises seem to disappear when the ideological tide recedes. These same technologies
    are taken up by incumbent power structures with new groundings to reassert control
    in the market, politics, or elsewhere.


    Nevertheless, optimistic approaches to the future see a normalisation of cryptocurrency
    in everyday emancipatory life. The more pessimistic suggest antagonistic sociocultural
    critiques of Bitcoin’s user base (Golumbia 2016), criticism of the radicalness
    and the anonymity of ledger-based cryptocurrencies (de Jong et al. 2015), the
    problem of heat and energy (Brunton 2015), and the staggering inequalities in
    currency ownership (Kondor et al. 2014; Ermann et al. 2018). This is set against
    observations that there are real and substantial needs to diversify how transactions
    in value operate internationally (Sassen 2015), the capacity for managing provenance
    in property such as artworks (Davidson et al. 2018), identity management (Augot
    et al. 2017), and new possibilities in urban sensor systems (Potts et al. 2017).
    Cryptocurrencies of all sorts are caught in a tension between their actuality,
    their potentiality, and perception.


