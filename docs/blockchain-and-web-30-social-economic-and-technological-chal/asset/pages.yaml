    # ## 2 Development of the reachability matrix from the SSIM


    In this step, the SSIM is converted into a binary matrix, called a reachability
    matrix (RM), by substituting V, A, X and O by 1 and 0 following the rules specified
    here:


    ```

    **Rule I:** If the pair (i, j) is V, then replace it by 1 and make the (j, i)
    entry 0 in the initial RM;

    **Rule II:** If the pair (i, j) is A, then replace it by 0 and make the (j, i)
    entry 1 in the initial RM;

    **Rule III:** If the pair (i, j) is X, then replace it by 1 and make the (j, i)
    entry 1 in the initial RM;

    **Rule IV:** If the pair (i, j) is O, then replace it by 0 and make the (j, i)
    entry 0 in the initial RM;

    **Rule V:** If i = j, then make the (i, j) entry 1 in the initial RM.


    _Note: i stands for the row number; j stands for the column number_

    ```'
