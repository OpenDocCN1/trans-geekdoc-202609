- pgno: 44
  md: '# # Can permissionless blockchains be regulated and resolve some of the problems
    of copyright law?


    Guido Noto La Diega and James Stacey^1


    # ## Introduction


    In October 2018, the European Parliament passed a resolution (European Parliament
    resolution of 3 October 2018 on distributed ledger technologies and blockchains:
    building trust with disintermediation (2017/2772(RSP))) on distributed ledger
    technologies that recognised blockchains’ potential to disrupt copyright. The
    aim of this chapter is to examine blockchain technologies and provide an assessment
    of their disruptive potential upon the legal sphere of intellectual property,
    and in particular copyright in the music industry. In order to do so, this chapter
    will start off by clarifying that the blockchain does not exist, because there
    are several different types of blockchains and, accordingly, different legal and
    regulatory issues. After identifying the type of permissionless blockchain that
    is analysed in this chapter, we move on to identify the definitional and non-definitional
    features of blockchain technologies. For the blockchain to unleash its disruptive
    potential, it must be clarified whether it complies with existing laws and whether
    new regulations are needed. Should existing regulations be found insufficient,
    only then could a serious discussion around new regulations be started, and it
    should take into account the necessity not to stifle innovation, the level of
    development of the relevant technologies, the importance of involving all the
    stakeholders, and the placement of the discussion at a supranational level. The
    focus of the chapter is to critically assess whether public permissionless blockchains
    can be used to disrupt intellectual property law by resolving some of the problems
    in copyright law, with particular regard to the issues of copyright registration
    and infringement. It will be shown how blockchains can resolve the registration
    issues by allowing forms of tamper-resistant, censorship-resistant, user-friendly,
    and privacy-friendly copyright registration. As to infringement, blockchains can
    prevent it by making it easier for copyright owners to track the use of their
    works and for music consumers to identify the owners, seek a license, and pay
    the royalties. It is perhaps too soon to conclude that a 10-year-old technology
    will ultimately disrupt copyright, but there already seem to have emerged some
    indications that the blockchains’ features of being permissionless, distributed,
    transparent, without'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'a single point of failure, tamper resistant, and peer to peer will radically
    change copyright by fixing some of its more urgent problems.


    # Does the blockchain exist?


    Arguably, _the_ blockchain does not exist; there are several different types of
    blockchains, each with different legal issues.


    This said, a good starting point is the technological overview presented by the
    US National Institute of Standards and Technology (NIST) in October 2018 (Yaga
    et al., 2018). Blockchains are defined as ‘distributed digital ledgers of cryptographically
    signed transactions that are grouped into blocks’. After an agreement is reached
    on the validation of a new block, the latter is added to the chain and cryptographically
    linked to the previous one. The participants will notice if someone tries to tamper
    with a transaction inscribed in a block (tamper evidence), and the older a block
    is the more difficult it is to tamper with it (tamper resistance). The distributed
    character of the blockchains derives from the fact that every participant has
    a full copy of the chain, and ‘new blocks’ are replicated across copies of the
    ledger. However, not all blockchains are fully distributed. Indeed, a major distinction
    in this field is between permissionless blockchains and permissioned ones. The
    main example of the former is Bitcoin, where every user can view all the transactions,
    has a full copy of the chain, and in principle has the same power as the other
    participants (peer to peer). Permissioned blockchains, in turn, are not peer to
    peer, disintermediated, and fully transparent because there are administrators
    or consortia granting user permissions.


    This chapter focuses on a permissionless blockchain that is open, distributed,
    peer to peer, transparent, tamper resistant and censorship resistant. The resistance
    to censorship derives from the lack of a central point of failure: being distributed,
    it is virtually impossible to take down content, because even if a node goes down,
    the rest of the network still stands (Sermpinis, 2018). The blockchain whose legal
    issues we are exploring is not, however, a Bitcoin-type blockchain. Indeed, even
    though we are referring to a permissionless technology, since we want to apply
    it to be multipurpose, we have in mind an Ethereum-type blockchain (Popper, 2017).
    The latter is Turing complete and therefore more versatile than the Bitcoin, which
    can be used only for simple transactions and does not allow users to build smart
    contracts – protocols to automatically execute actual contracts (Mik, 2017) –
    on top of it (Brent, 2018).


    # Core and non-definitional components of blockchain technologies


    It is important to note that there are differing opinions as to which features
    of blockchain technology are strictly definitional and not subject to change (Fairfield,
    2015). However, this chapter is of the opinion that ‘blockchain technology’ is
    actually an umbrella term for three distinct technologies combined, not'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'all of which will remain apparent in every deployment of blockchain-based applications
    (Maas, 2018).


    The first of those three technologies is the blockchain itself, as a way to structure
    data. What makes a blockchain unique is its use of cryptography. By utilising
    certain cryptographic functions, a blockchain is able to create a persistent,
    tamper-evident record of any item of data and authenticate the identity of the
    parties involved in each transaction (UK Government Chief Scientific Adviser,
    2017). Unsurprisingly, a blockchain is a definitional feature of blockchain technology
    that will be apparent in each and every blockchain application (Maas, 2017).


    The second element is the network. Early applications of blockchain technology
    such as Bitcoin and Ethereum operate on a publicly visible, permissionless blockchain
    that is distributed across a peer-to-peer network (Bacon, 2018). In that, anything
    that happens on a blockchain is a function of the network as a whole. A network
    of computers known as ‘nodes’² manage the network jointly, meaning that there
    is no central authority (Rosic, 2018). In this type of blockchain, anyone can
    become a node, and the entire contents of the blockchain are publicly visible.
    However, this is not to say that every application of blockchain technology will
    be this way. Distributed peer-to-peer networks or those that are public or permissionless
    may not be necessary or even permissible in certain circumstances. Alternative
    applications include networks that are ‘private’ or ‘permissioned’, where participation
    is limited to a certain group of users and can only be viewed by specified parties.
    It is often predicated that the blockchain is a trusted system³ in that participants
    can transact without necessarily trusting each other and without intermediaries
    (e.g., banks). However, this can be said only with regards to permissionless blockchains.
    In permissioned blockchains, conversely, there is likely to be an aspect of trust
    among the users required as there will be some element of ‘centralisation’ (Bacon,
    2018). Venture capital-backed Ripple is one example of a blockchain application
    that has amended the underlying technology to operate in an environment where
    a degree of trust is required for transactions to be validated (UK Government
    Chief Scientific Adviser, 2017). Governments are also exploring the idea of blockchains
    using a centralised trusted third party. Estonia, for example, has utilised blockchain
    technology since 2012 to help maintain the integrity of data across health, judicial,
    and legislative areas (“E-Estonia, 2018). For these reasons, this chapter considers
    public, permissionless distributed peer-to-peer networks to be a fundamental characteristic
    of early blockchain-based applications rather than a definitional feature that
    is apparent in all versions of blockchain technology. Nonetheless, when we do
    not specify otherwise, a reference to the blockchain must be understood as a reference
    to a permissionless distributed peer-to-peer network, since these characteristics
    have the potential to disrupt, or at least profoundly affect, the law, and copyright
    in particular.


    The final component is the consensus mechanism, i.e., a ‘process to achieve agreement
    within a distributed system on the valid state (the main consensus'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'mechanisms are proof of work, round robin, and proof of stake”. The latter
    is used in Ethereum and can be either Byzantine fault-tolerant proof or chain-based).


    Consensus is what enables the nodes in a distributed peer-to-peer network to work
    together without having to know or trust each other. The consensus mechanism is
    a set of rules that are agreed upon by the network of nodes running the software
    in which the rules regulate the addition of new blocks (Maas, 2018). These rules
    ensure consistency across the network and that participant/system behaviour is
    valid and appropriate (Bacon, 2018). Given that consensus mechanisms solve problems
    of trust in distributed peer-to-peer networks,⁴ it follows that if the deployment
    of a blockchain application is anything other than distributed, such a consensus
    mechanism may not be required. Therefore, this chapter considers consensus mechanisms
    to be a fundamental characteristic of early applications that may change dependent
    on the purposes for which the technology is adopted, rather than a definitional
    feature apparent in all blockchain-based applications. Nonetheless, since the
    distributed character of the blockchain is likely to have a disruptive impact
    on the law and on copyright in particular, we will refer to blockchains using
    a consensus mechanism, unless stated otherwise.


    # To regulate or not to regulate: that is the question?


    For the blockchains to unleash their potential in the music industry and beyond,
    the regulatory conundrum must be untangled. Overly restrictive regulation may
    stifle innovation, but the lack of any regulation may lead to legal uncertainty,
    which in turn would slow down the adoption of the blockchains (Telpner, 2018).
    The regulatory treatment of blockchain or of some of its aspects and applications
    will be a major factor in determining the level of success the technology will
    have regarding all its use cases. Given the importance of blockchains’ regulation
    and music copyright being highly regulated, it is necessary to dig deeper and
    explore the regulatory treatment of blockchain in general.


    The more blockchain becomes widespread, the more lawmakers develop an interest
    in regulating it. Most existing regulations, policies, and case law take a top-down
    approach and focus on Bitcoin and, accordingly, on evidence and tax issues.


    For example, the EU Court of Justice exempted Bitcoin transactions from VAT because
    they regard only ‘currency, bank notes and coins used as legal tender’ (Skattereket
    v David Hedqvist Katteverket v David Hedqvist, Case C-264/14). For the focus on
    evidence, see Arizona Revised Statutes, 44-7061.


    The most common approach, however, is to assess whether and how existing laws
    apply to the blockchains⁵ and avoid the introduction of new regulations ‘given
    that the technology is still evolving and practical applications are limited both
    in number and scope’ (European Securities and Markets Authority, Report The Distributed
    Ledger Technology Applied to Securities Markets (ESMA, 2017) 4).'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'In the US, a similar ‘wait-and-see’ approach has been taken by the Federal
    Reserve Board, as well as the Federal Reserve Banks of New York and Chicago (see
    Mills, David, Kathy Wang, Brendan Malone, Anjana Ravi, Jeff Marquardt, Clinton
    Chen, Anton Badev, Timothy Brezinski, Linda Fahy, Kimberley Liao, Vanessa Kargenian,
    Max Ellithorpe, Wendy Ng, and Maria Baird (2016). ‘Distributed ledger technology
    in payments, clearing, and settlement,’ Finance and Economics Discussion Series
    2016–095. Washington: Board of Governors of the Federal Reserve System, https://doi.org/10.17016/FEDS.2016.095.
    Cf., similarly, Financial Industry Regulatory Authority, Distributed Ledger Technology:
    Implications of Blockchain for the Securities Industry (FINRA, 2017)). Contrary
    to popular belief, blockchains are not a lawless technology; recent research underlined
    that we should abandon the naivety whereby blockchain transactions would be ‘free
    from the travails of conventional law, thus offering the promise of grassroots
    democratic governance without the need for third-party intermediaries’ (Yeung,
    2019). Most of existing laws apply to the blockchains, but should new regulations
    be introduced, a participatory and holistic approach would be preferable. Indeed,
    it is important to involve all the stakeholders and keep in mind all the potential
    socio-legal issues if one wants to ensure that the blockchain unleashes its full
    potential and benefits all the players involved.


    Bitcoin, the first and most widely used blockchain, set out to remove state institutions’
    influence on currency. Permissioned blockchains inherited the features of being
    intrinsically transnational and (potentially) state free, which begs the fundamental
    questions on whether it is at all possible to regulate them and, if so, how. However,
    these problems, however, are not new, since the Internet is transnational and
    yet is highly regulated. Recent research has showed that most of the physical
    world rules can be applied in cyberspace, though there is a clear problem concerning
    which authority can legitimately regulate it (Chris Reed and Andrew Murray, Rethinking
    the Jurisprudence of Cyberspace (Elgar 2018)). Bitcoin and blockchain have moved
    on from the cypherpunk days (Lopp, 2016), where the community using Bitcoin and
    the like were mostly made up of individuals with libertarian and anti-establishment
    political stances (Stankovic, 2018). Nowadays, Bitcoin has entered the mainstream,
    even becoming a legal payment method in Japan (Garber, 2017). Blockchain, in turn,
    has stepped out of Bitcoin’s shadow and now offers a wide variety of potential
    use cases, some of which promise to be revolutionary (Swan, 2015). However, for
    blockchain to realise its full disruptive potential, it will need to appease the
    legal and regulatory environments in which it will operate (‘Blockchain – Key
    Legal and Regulatory Issues’ Lexis PSL TMT). Indeed, beyond cryptocurrency, blockchain
    has potential application across a many of heavily regulated industries, which
    have been designed without blockchain in mind. This may ultimately mean that the
    use of blockchain could be found to be incompatible with the current regulatory
    framework (Finck, 2017). If so, the uncertainty that this incompatibility inevitably
    creates will no doubt restrict innovation and ultimately prevent'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'large-scale adoption of blockchain into these areas. In order to successfully
    navigate these heavily regulated industries, it would seem necessary that regulation
    is seen as a tool to provide certainty for those involved in blockchain''s development
    and encourage innovation rather than one used by the regulators to stifle it (where
    not otherwise specified, the term ‘regulators’ is used generically to refer to
    any lawmakers and regulators across jurisdictions, whether they operate a transnational,
    supranational, national or subnational level; ‘Blockchain – Key Legal and Regulatory
    Issues’ (n 35)). The problem does not apply, however, only to regulated industries
    but to all sectors where personal data is processed. Indeed, the EU General Data
    Protection Regulation (GDPR), which came into force in May 2018, introduces principles,
    obligations, and rights whose implementation can be difficult if at all possible
    in a blockchain context (Berberich, 2016; Herian, 2018). For example, data subjects
    have the right to rectify their personal data, but once the data is in the blockchain,
    it is virtually impossible to change it (Ibáñez, 2018; CNIL, Blockchain, 2018).


    Part of the literature is of the opinion that regulation of blockchain is inevitable,
    and in the end the community of developers will in fact welcome such regulation.
    According to this view, regulators will win the developers around by accepting
    creative solutions to achieve the right balance between protecting the relevant
    public interest objectives and stimulating innovation (Kevin, 2017). The rationale
    behind said opinion is based on the fact that the same scenario happened twenty
    years ago at the early stages of the Internet. The more recent phenomenon of the
    platform economy (Kenney, 2017) has also reinforced how this scenario plays out
    (Noto La Diega, 2016). Uber, for example, who were once notoriously reluctant
    to cooperate with regulators (Arvelo, 2018), have now actively sought regulatory
    intervention regarding insurance legislation that applies unanimously across the
    United States (Uber, ‘Insurance Aligned’, 2018), and as of March 2018, they have
    instructed insurance companies in order to comply with those requirements (Uber,
    ‘An Update on Insurance’, 2018).


    If regulation is inevitable, the next question is how to regulate. Going forward,
    it would seem that successful regulation is dependent on a number of factors.
    First of all, the regulators need to learn from their past mistakes regarding
    other emerging technologies and be sure not to repeat them. Although blockchains
    remain an immature technology with evolving use cases, it is arguable that early
    regulatory acknowledgment and interest should be seen as positive, as it is important
    to be mindful of the negative impact that delayed interest in an emerging technology
    can have (as noted by Finck, (Finck, 2017), the early stages of the Internet’s
    development suffered the negative impact of a delayed interest).


    Second, successful regulation is not only dependent on the regulators themselves.
    Rather, the industry and those involved with the development of blockchain should
    also actively collaborate with each other and the regulators to tackle the complex
    challenges at hand (Finck, 2017). If those involved in the development of blockchain
    do decide to resist regulatory attempts, it is'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'suggested that ‘[i]f anything, the innovators stand to lose the most by delaying
    government involvement in adopting reasonable solutions’ (Werbach, 2017). The
    third factor concerns the level at which blockchain is regulated. Generally, regulators
    regulate the use of a technology as opposed to regulating the technology itself.
    However, blockchain’s ever-growing use cases mean that regulators are finding
    it difficult to regulate (‘Blockchain – Key Legal and Regulatory Issues’ (n 35)).
    Yet some scholars suggest that this remains the best approach and claim that a
    use-case-focused approach is supported by the experience with other emerging technologies
    such as the Internet (Maupin, 2017). If such an approach is to be successfully
    adopted, the aforementioned collaborative effort of all the parties involved in
    that specific use case will be key. Not only that, the unpredictability of blockchain
    will require a flexible, open approach to each use case that will allow the law
    to develop as and when the technology does (Finck, 2017).


    That being said, even if flexible, agile, use-specific regulation is developed,
    if that regulatory model is only applicable in one country, its positive impact
    may be limited. The distributed potential of blockchain, coupled with its intangibility,
    means that its application could operate simultaneously over multiple jurisdictions.
    This may mean that it is unclear who is performing the regulated activity. If
    this proves to be the case, regulators may struggle to determine whether or not
    a particular blockchain’s activities need to be regulated, and if so, under which
    jurisdiction. Further, if something goes wrong, it may prove difficult to determine
    the precise location and identity of the culprit who is responsible for said breach
    or failure (‘Blockchain – Key Legal and Regulatory Issues’ (n 35)). Therefore,
    successful regulation will also require regulators to engage in transnational
    conversation and cooperation in an attempt to formulate some sort of consistent
    collaborative governance.⁶ Although international conventions would appear the
    most suitable level of regulation, practically it is unlikely that an agreement
    will be reached and that, if reached, the rules will be fit for the blockchains
    or for the particular use that will be taken into consideration.⁷


    In conclusion, no regulation is better than bad regulation. More evidence is needed
    to clarify whether existing regulations suffice when it comes to the blockchains.
    Should existing regulations be found insufficient, only then could a serious discussion
    around new regulations be started, and it should take into account the necessity
    of not stifling innovation, the level of development of the relevant technologies,
    the importance of involving all the stakeholders, and of placing the discussion
    at a supranational level. Only in this way can legal certainty be achieved and
    the blockchains unleash their disruptive potential.


    # The disruptive potential of blockchain on copyright law


    Having defined blockchain technology and set out the technical and regulatory
    essentials, the rest of this chapter will concern the disruptive potential that'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'blockchain may have upon the legal sphere of intellectual property, using music
    copyright as a use case.


    This section is focused on intellectual property and, in particular, copyright,
    i.e., the body of law that protects aesthetic and artistic creations such as literary,
    musical, dramatic, and artistic works.8 Blockchain technologies can affect copyright
    in manifold ways, as recognised by the European Parliament''s resolution of 3
    October 2018 on distributed ledger technologies and blockchains: building trust
    with disintermediation. The EU resolution underscores that distributed ledger
    technologies can be used to track and manage intellectual property, thus facilitating
    copyright and patent protection.9 It further acknowledges the technology''s potential
    to develop artists'' ownership through an ''open public ledger that can also clearly
    identify ownership and copyright". It is then recognised that in collaborative
    and open innovation contexts (e.g., 3D printing), blockchain''s capability to
    link creators to their works is of the utmost importance. Finally, authors can
    benefit from transparency and traceability in the use of their works as well as
    the smoothening of royalty distribution and increase in revenues that can be expected
    by cutting down on intermediaries. On the last point, it is important to critically
    note that blockchain''s promise to eliminate traditional intermediaries is unlikely
    to be fulfilled (O''Dair, 2016). Evidence of the trend towards re-centralisation
    is the investment of traditional intermediaries in the blockchain (PRS for Music,
    2018) and the rise of permissioned blockchains, where the disintermediation is
    only partial (Bacon, 2018).


    Although it is still unclear whether blockchains will revolutionise copyright,
    it can be argued that they can resolve some of the issues that affect this body
    of law and the relevant industries, with particular regards to copyright registration,
    infringement, management,10 and transactions.11 For the sake of brevity, this
    section will focus on how, if at all, the type of blockchain described earlier
    can resolve some of the problems of copyright registration and infringement (popularly
    known as ''piracy'').


    # Blockchains for a privacy-friendly, agile, tamper- and censorship-resistant
    registration


    One of the main innovations brought by the Berne Convention12 has been that copyright
    arises with the creation of the work (e.g., once a book has been written) without
    the need for any formalities, i.e., systems of public registration (Berne Convention,
    art 5(2)). Such formalities enabled governments to control ex ante the contents
    of the books, thus enabling them to censor those works that went against the government''s
    policies or the dominant ethical values (Mann, 2016). The abolition of registration
    formalities is positive because it favours the authors by making copyright easily
    obtainable and by reducing the opportunities for governments to censor them. However,
    without registration there are evidentiary problems in copyright infringement
    proceedings because it is hard to prove who created what and in which moment in
    time.13 For example, if John shares without Jerry''s permission a picture the
    latter had'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'posted on Instagram, how does Jerry prove that he created said work (the picture),
    that he did it before John, and that he is the sole legitimate author and owner?
    To resolve these kinds of problems, some countries such as the US effectively
    sidestepped the Berne Convention and *de facto* reintroduced the copyright registration.
    Indeed, even if copyright arises with the creation of a work, in infringement
    proceedings, statutory damages and attorney’s fees will not be awarded in the
    absence of registration.¹⁴ In the UK, there is no such limitation, but without
    registration said evidentiary issues remain. Therefore, new registration mechanisms
    have been introduced to ensure evidence; however, they often are a burden for
    the author (e.g., they are expensive and not user friendly), and they can be forged;
    particularly with paper ledgers there is a ‘high level of forgery’ (UK Government
    Chief Scientific Adviser (n 11) 7). Alongside the problems of censorship, forgery,
    and lack of user friendliness, existing registration systems are open to criticism
    from a privacy perspective. This is the case in the US, where rules of procedure
    of the Copyright Office and attitudes of the US District Courts make it very hard
    for pseudonymous and anonymous authors to be successful in infringement lawsuits
    (Bell, 2016).


    All these problems can be resolved through a blockchain-enabled copyright registration.
    Indeed, a blockchain platform could issue a token, which would serve as proof
    of authenticity, in which a timestamped copyright registration is contained. Arguably,
    such a disruptive system would enable a cheaper, more transparent, and more user-friendly
    registration (Buntinx, 2018) – as noted by Savelyev (2018), ‘blockchain can introduce
    long-awaited transparency in matters of copyright ownership chain’. Thus, the
    problem of forgery would also be addressed, considering that the blockchain is
    tamper resistant.¹⁵ Moreover, one of the key features of permissionless blockchains
    is that they have no single point of failure. Therefore, if an author deposited
    a work to register it and a government wanted to take it down for censorship purposes,
    this would be practically impossible¹⁶ because ‘(e)ven if several nodes failed,
    the network would still continue to function’ (Bacon, 2018), and the work would
    still be available, since all data is maintained by all nodes.¹⁷ Finally, moving
    on to anonymous and pseudonymous authors’ privacy, a public, permissionless blockchain
    distributed across a peer-to-peer network may resolve their problems by providing
    robust digital pseudonyms, ‘a mask that, while hiding (the author’s) real identity,
    would nonetheless be unique to him or her’ (Bell, 2016).


    A blockchain registration would be optional, thus complying with the Berne Convention,
    and it would ensure the benefits of traditional registration in terms of evidence
    in infringement proceedings whilst preventing its drawbacks in terms of costs,
    forgery, censorship, and privacy.


    # Blockchains and copyright infringement: an ambiguous relationship


    Copyright infringement, popularly known as ‘piracy’, is a widespread issue, as
    exemplified by the fact that 53 percent of young users access music illegally¹⁸'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'and by the fact that new intermediaries such as Spotify often make available
    music without its owners’ consent, allegedly because they do not know who the
    owners are.¹⁹ Copyright infringement thrives for a number of reasons, two of which
    can be addressed by blockchain. The first one is that it is difficult for copyright
    owners to track the use of their works. Once a song is published, the owners currently
    have limited or no means to know who is accessing it and how. The problem is exacerbated
    by the sharing practices that are becoming commonplace in the time of social media.
    Indeed, it can be said that we live in the sharing society,²⁰ where sharing copyright
    material is easy, particularly on social networking sites, e.g., by retweeting
    someone’s tweet which, in turn, had retweeted someone else’s tweet.²¹ This means
    not only that many people infringe copyright, possibly without being aware of
    it, but also that after repeated sharing and linking it is difficult to track
    back who was the original owner. Ultimately, the difficulty for copyright owners
    to track the use of their contents decreases the incentives to access contents
    legally, since end users have the reasonable expectation that the owners cannot
    track the consumption of their content, and therefore, they cannot enforce their
    rights.


    The second reason why copyright infringement is so common, particularly in the
    music industry, is that it is often impossible to know who the author and owner
    is.²² This is because there is not a requirement to register copyright, and, more
    importantly, because of the lack of a single updated database of music metadata.
    Music metadata are data about who did what in music. Music metadata are fragmented
    in databases that do not sync and that are owned by corporations with conflicting
    views about what should be public and what should, in turn, be kept private (DA
    Wallach, 2014). Music ownership is extremely complex for legal and business reasons.
    On the one hand, under the Copyright, Designs and Patents Act 1988²³ – the main
    UK statute on copyright – a single song has at least three owners, i.e., the author
    of the lyrics, the author of the music, and the producer of the sound recording.
    From a business point of view, music is a collaborative enterprise; indeed, most
    ‘recorded music is a collaboration between songwriters, singers, musicians, producers,
    recording engineers, mastering specialists’ (DA Wallach, 2014). All these subjects
    and other new intermediaries such as Spotify and iTunes have a stake in the industry
    and some expectations in the distribution of music’s revenues. For these reasons,
    the artists receive only a limited share of the revenues and only after a long
    time (Heap, 2016). If artists are finally paid a slice of the ‘royalties cake’,
    this reaches them between six and eighteen months after the publication (Heap,
    2016). The problem of music’s attribution and royalty distribution are not new,
    but they are made worse by new technologies and new ways of consuming musing.
    While at the time of vinyl records and CDs it was easy to understand who contributed
    and how, iTunes, Spotify, etc., create a credits conundrum where the listener
    knows only who the singer is and nothing else. A final reason why identifying
    copyright owners (and rewarding them) is difficult is that even though there is
    a presumption the author (of the music, of the lyrics, etc.) is the owner of the
    relevant work,²⁴ this is often not'
