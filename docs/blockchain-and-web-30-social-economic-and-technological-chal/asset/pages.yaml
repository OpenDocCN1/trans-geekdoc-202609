- pgno: 62
  md: '# Meetups


    Making space for women on the blockchain


    Philippa R. Adams, Julie Frizzo-Barker,

    Betty B. Ackah, and Peter A. Chow-White


    # Introduction


    Blockchain has a gender problem. Gender disparity in the tech sector remains a
    persistent, well-documented challenge for women (Byrne, 2017). Blockchain represents
    an even worse case of this familiar trend, with only 5–7 percent female cryptocurrency
    investors (Tans, 2018). In its short history since the emergence of Bitcoin (Nakamoto,
    2009) blockchain has been a male-dominated space. It is rooted in the financial
    and technological industries it purports to disrupt and characterized by stereotypes
    such as the ‘Bitcoin Bros’ (Bowles, 2018). In an extreme example, at a recent
    North American Bitcoin Conference in Miami, 3 of the 88 speakers were women, and
    the event concluded with a party at a strip club (Primack, 2018). Yet women are
    increasingly influencing blockchain development and becoming more visible at the
    helm of some of its most successful start-up organizations (Bowles, 2018). More
    broadly, local meetups for women interested in blockchain present accessible opportunities
    for women at various levels of expertise to learn and network around blockchain
    (Griffith, 2018). As an emerging technology, the definition, development, and
    diffusion of blockchain is still solidifying. This offers scholars an opportunity
    to assess the early stages of the technology and potentially influence its development
    in order to benefit as many users as possible (Callon, Law, & Rip, 1986). It is
    therefore important to consider the technical, economic, and gendered aspects
    of blockchain when investigating this new techno-social assemblage (Kitchin, 2014).
    In doing so, we can identify relevant actors and social groups and explore the
    process of who has power to shape this emerging technology as it unfolds. We are
    interested in how blockchain can be a potentially “disruptive innovation” (Christensen,
    1997) as it diffuses unevenly across gendered divides.


    Blockchain will turn ten in 2019. It has undergone several developmental phases
    already. Blockchain 1.0 demonstrated the feasibility of a digital currency that
    could be created and managed by people instead of governments. Blockchain 2.0
    expanded the scope of the technology from currency to other applications. The
    smart contract enables developers to use blockchain for other applications and
    self-managed exchange proposals. The Ethereum community is the key example of
    blockchain expansion into other domains.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Blockchain 3.0 technologies move beyond cryptocurrency and smart contracts
    to revolutionize a broader range of social applications including government,
    health, arts, and culture (Swan, 2015). This represents promise for women in particular,
    with access to financial services for the 42 percent of global women who do not
    have bank accounts, secure identification records and land title registries on
    the blockchain for women in the developing world, and potential financial gain
    for those who invest in cryptocurrency (Allen, 2018; Thomason, 2017; Lielacher,
    2018). Improving gender inequality is not only a pressing moral and social issue
    but an economic one as well. A 2015 report found that $12 trillion USD could be
    added to global GDP by 2025 by advancing women’s equality in work and society
    (Woezel et. al.). Sandra Ro, chief executive of the Global Blockchain Business
    Council, commented, “(T)here is as much a human, culture shift element to what
    is going on as well as the technical evolution”, (Bond, 2018). While blockchain
    is a decade old, it is still in the very early stages of adoption and diffusion.
    Blockchain has a long way to go to scale up to mainstream use as a digital currency
    or decentralized web. However, developers and early adopters argue it has potential
    to reorganize and democratize the way value is distributed in order to bring about
    a fairer world. Of course, we have heard this type of promising discourse before
    with other 1.0s and 2.0s, such as the Internet and social media. The future of
    blockchain remains unclear. This space of uncertainty is a key moment to understand
    how people are negotiating their hopes and fears about its future.


    In this chapter, we investigate blockchain as a vital site to explore gendered
    instantiations of a new, emerging technology. We analyze women’s discourses and
    practices around blockchain meetups through a technofeminist lens. Technofeminism’s
    reflexive “social shaping of technology” perspective highlights how gender and
    technology coevolve in a seamless web of technical artifacts, social relations,
    and cultural meanings (Wajcman, 2004). This position challenges the prevailing
    notion of technology as neutral and value-free. Within this framework, both gender
    and blockchain are viewed as part of the texture that constitutes contemporary
    life rather than as separate from society. Our observations explore some of the
    socioeconomic aspects and consequences of decentralized technologies included
    in this volume.


    # Theoretical framework


    The social shaping of technology approach (Pinch & Bijker, 1987; Mackenzie & Wajcman,
    1999) highlights that human bias, whether intentional or unintentional, influences
    the design, trajectory, and social worth of an innovation. These scholars argue
    technologies are linked directly to culture, values, and socially accepted practices.
    Technology historian Ruth Schwartz Cowan (1976) painted a compelling picture of
    this, contrasting the extensive documentation of the steam engine with the comparably
    dismissed innovation of the baby bottle, both socially significant technologies.
    New technologies often help'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'certain social groups consolidate power while diminishing the power of others.
    For example, Winner’s (1980) study of suburban development in New Jersey revealed
    the geopolitical context of race relations in the US. Architects designed bridges
    that prevented buses from working class and predominantly black neighborhoods
    from accessing beaches located in predominantly white middle-class areas. Physicist
    Ursula Franklin conceptualized technology as a mindset and a practice, and therefore:
    “when certain technologies and tools are predominantly used by men, then maleness
    becomes part of the definition of those technologies” (1999, p. 8).


    In the 1990s, feminist scholars celebrated the emancipatory potential of the Internet
    to close the gap of gender inequalities (Haraway, 1991; Plant, 1997; Turkle, 1995).
    Cyberfeminism emphasized women’s agency and subjectivities. Technology itself
    was viewed as liberating for women. However, this techno-evangelist approach overemphasized
    the role of technologies. Enthusiasm over cyborgs, flexible identities, and social
    change often overlooked persistent gendered challenges. By the early 2000s, scholars
    began a fruitful exchange between gender theory and science and technology studies
    in order to study technologies as sociomaterial or sociotechnical practice. In
    particular, Judy Wajcman’s technofeminism blended insights from cyberfeminism
    and the social shaping theory of technology, conceptualizing “a mutually shaping
    relationship between gender and technology, in which technology is both a source
    and a consequence of gender relations” (2004, p. 7).


    Technofeminism strikes a balance between technophilia and technophobia, “to explore
    the complex ways in which women’s everyday lives and technological change interrelate
    in the age of digitization” (Wajcman, 2004, p. 6). Women’s use of technology often
    simultaneously enables and constrains their identities and experiences. For instance,
    social media has allowed for new forms of misogyny and harassment toward women
    while also facilitating women’s collective resistance against such mistreatment,
    as seen in the #metoo movement (Mendes, Ringrose, & Keller, 2018). Similarly,
    women in blockchain are enthusiastically networking for global movement toward
    economic empowerment despite its male-dominated culture (UN Women, 2018). Technofeminism
    offers a nuanced perspective from which to analyze the complexities and contradictions
    inherent in both gender and technology.


    A complementary theoretical lens we use to analyze how and why certain technologies
    are adopted in particular ways is Rogers’ (2003) diffusion of innovation. Diffusion
    refers to the process by which an innovation is communicated through various channels
    among members of a social system. It is a specific type of communication concerned
    with the spread of new ideas. At the present, blockchain is in the earliest stages
    of diffusion. The very definition of blockchain remains in flux, both literally
    and figuratively. On the semiotic level, we observe that many news stories, scholarly
    papers, and local meetups open with the question, “What is blockchain?” Once a
    technology has successfully diffused into everyday usage and public discourse,
    the definition solidifies,'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'and there is less of a need to define it. On the socioeconomic level, blockchain
    also remains in its earliest stages of diffusion. Which groups and causes will
    it best serve?


    STS research on infrastructure investigates how innovations diffuse, solidify,
    and fade into the background of everyday use. This process carries socioeconomic
    implications. Star (1999) characterizes infrastructures as embedded, transparent,
    learned as part of membership, linked to conventions of practice, and built on
    an installed base. In this case, blockchain is built on an installed base of existing
    structures from the male-dominated tech and finance industries. Viewed as an infrastructure,
    blockchain requires a type of sociotechnical expertise that has traditionally
    excluded women. As one technology historian put it, “a gendered history of top-down
    structural discrimination defines the shape of the modern computing industry in
    the Anglo-American world” (Hicks, 2017). This project seeks to disentangle the
    complex relationships between male-dominated spaces and cultural practices (Wajcman,
    2004; Gill, 2007; Gill, 2011; Byrne, 2017 cite; Neely, 2018). We explored how
    women create their own spaces and inroads into the male-dominated world by examining
    the role of meetups in blockchain. We focus our investigation by asking several
    research questions: How are local meetups shaping the definition, development,
    and diffusion of blockchain technologies? How are women shaping and being shaped
    by blockchain meetups? How do actors use discourses of gender in blockchain meetups?
    What is the role of gender in blockchain development?


    # Methodology


    In our fieldwork, we observed local meetups through a technofeminist lens to analyze
    how gender and blockchain influence one another. We conducted participant observation
    at various blockchain meetups in Vancouver, British Columbia, Canada, a technology
    industry hub known for vibrancy, diversity, and innovation (Simon Fraser University
    Ethics Approval #2018s0237). The city is home to a burgeoning blockchain community
    including companies like Etherparty, which specializes in smart contracts, Vanbex,
    a blockchain consulting firm, and Axion Zen, the studio that created the first
    blockchain-based game, Cryptokitties. Local interest in blockchain is also evident
    through the many blockchain-related events happening in the city and surrounding
    area on a weekly basis.


    Scholars have researched meetups as valuable sites to study social networking
    and information sharing in ways that differ from other spaces like workplaces
    or online communities (Sessions, 2010; Shen & Cage, 2015). A ‘meetup’ is a face-to-face
    gathering of people with similar interests. It can be a periodic, informal meeting
    in a local coffee shop or a short-term learning event in a formal setting. A semiprofessional
    peer group can emerge and meet periodically. Participants combine real-world meetings
    and digital platforms to support one another and transmit information, job opportunities,
    and practice-based social'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'relations (Benkler, 2006; Hindman, 2009). The events we attended ranged in
    size from 15–90 attendees (see the Appendix). The majority of the events took
    place on weekday evenings, while two were daylong events. We identified some as
    presentation focused and more corporate in tone, while others were discussion
    based and informal. The corporate-run events often involved a brief sales pitch
    for their service, product, or work space, related to blockchain. Some events
    were free, and others were $50 or $100 per ticket.


    We found meetups to be an ideal site of observation to analyze both the development
    and the gendering of blockchain. A simple web-based search for local blockchain
    meetups yields a list of gendered gatherings, including “Bit-coin Gentlemen’s
    Club” and “Crypto Witch Futurist Brunch.” We attended and analyzed various local
    blockchain meetups and events in order to gather detailed observations and rich
    insights from naturalistic settings (Babbie & Benaquisto, 2010). The meetups we
    met attended targeted a variety of audiences, including blockchain beginners,
    students, women in male-dominated industries, professionals, programmers, and
    potential cryptocurrency investors. These spaces where people commune around common
    interests and themes are local examples of a global trend (Griffith, 2018). Blockchain
    meetups attract people with different levels of technological experience, backgrounds,
    and motivations. Attendees gather together in a way that connects abstract technological
    tools and innovations into the embodied, social world. As attendees at these events
    we observed the form and content of the meetups, paying particular attention to
    the role of discourse and gender among participants. The open, enthusiastic nature
    of meetups and other blockchain events in Vancouver made them excellent sites
    to examine the ways participants shape the conversations and focus. We analyzed
    where, why, and how women interact with emerging technologies like blockchain,
    as their interactions shape the very definition and development of the technology
    itself.


    Since blockchain technology is in its early stages, entrepreneurs, technology
    workers, and curious citizens of the general public all play a role in determining
    its course. The social shaping of technology happens in part through conversation,
    debate, and discussion in the public sphere, as exemplified by meetups. We made
    observations about the framing and focus of the meetups, the attendees, and the
    questions raised. We attended a range of different meetups, some aimed at women
    or minority interest groups and others with no particular gender focus, in order
    to compare and contrast them, although we remained observant of the gendered dynamics
    at each meetup. Of the many events we identified online through social media,
    Meetup.com, and Eventbrite.com, our research team attended eight meetups in person
    over a period of five months, from March to June 2018.


    # Findings


    From the many observations we made over the course of the study, two major themes
    emerged. First, blockchain meetups reflect the opportunities and'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'challenges typically observed at the beginning of the adoption curve for a
    new technology. Second, women-focused blockchain meetups serve as both spaces
    of resistance and spaces of support.


    # Blockchain 101: from “What is blockchain?” to “Beyond Bitcoin”


    Each of the meetups we attended began with an introduction of blockchain, designed
    for a nontechnical, nonexpert audience. Most presenters opened with a slide outlining
    “What is blockchain?” The question is so persistent because of the newness of
    the technology, but also because it is a difficult question to answer for a broad
    audience. The apparent technical density of blockchain contributes to the perception
    that blockchain is more technologically complicated than it is. Presenters and
    meetup hosts dealt with this complexity with varying degrees of success. Some
    facilitators and panelists used metaphors, diagrams, or jokes to convey the technology
    as relatable and useful. At one event, after a lengthy discussion of how blockchain
    works, the presenter seemed to switch gears by suggesting, “You don’t really know
    how your computer or your car works, you just know how to use them and what they
    can do for you. It will be similar with blockchain.” However, to follow the car
    metaphor, blockchain is still in such early stages, most average users would not
    yet know how to turn the key and start it up. All these discussions point to the
    newness of the technology and curiosity about how it will unfold.


    Each meetup was unique in tone, spatial orientation, and motivation for both presenters
    and participants. For instance, some had a more corporate inclination in terms
    of jargon, seating arrangements, and networking. In contrast, there were more
    informal events, several of which were aimed at women and minority groups. The
    informal events tended to be more collegial and conversational, while others had
    a more corporate inclination in terms of jargon, seating arrangements, and networking.
    For example, one of the meetups for women played up the gendered focus by beginning
    with wine and appetizers in a lounge setting before attendees took their seats
    at tables with fresh cut flowers. The women in attendance ranged in age from younger
    to more seasoned professionals. All attendees introduced themselves and their
    motivation for attending to the entire group before the presentation began. Some
    had come to learn about blockchain for the first time, some were blockchain programmers,
    and some were successful cryptocurrency investors. This group-wide introduction
    style was a marked contrast to the more typical exercises we observed at other
    meetups, introducing yourself to the people sitting next to you as a brief, informal
    icebreaker.


    Overall, we found the informal meetups to be more productive in terms of allowing
    for participants to connect and for organizers to tailor the content to attendees’
    interests. In contrast, the more polished, corporate events positioned attendees
    more as audiences, with less agency in the course of the event, which set the
    tone for the conversational segments before and after the presentation as'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'well. One unifying factor we observed across the meetups was a sense of community
    and support. This tone was very different than the competitive and individualistic
    culture associated with tech companies. Using Franklin’s definition of technology
    as practice, we can view meetups as open access technologies in and of themselves.
    Even at the meetups sponsored by Microsoft or local tech companies, there was
    a sense of shared learning and collaboration about something new and exciting.
    Several meetups concluded with an invitation to join a social media group or a
    mailing list for follow-up conversation among participants.


    A majority of presentations focused on cryptocurrency as the best-known blockchain
    example, and indeed many attendees voiced interest in how to begin investing in
    this new market. One presenter spent over an hour of the presentation describing
    the details of a Bitcoin transaction, complete with a simulation exercise that
    involved the attendees signing and swapping pieces of paper. Even there was a
    conflation of the definitions of blockchain and Bitcoin, contrasted by a growing
    awareness of blockchain’s potential benefits across other areas of public life.
    For example, after lengthy cryptocurrency discussions at two events, audience
    members asked if the presenter could discuss blockchain applications beyond cryptocurrency.
    At another meetup, a physician asked about where she could find more information
    about health-focused blockchain applications. To contrast different types of expertise,
    the student-led event we attended comprised mainly computer science undergraduate
    students who had complex questions about how to mine various cryptocurrencies.
    Most of the presenters gave enthusiastic presentations about the potential benefits
    and opportunities of blockchain. In various cases, it was the skeptical or confused
    audience members who raised important discussion about blockchain’s potential
    risks or challenges. For instance, one attendee questioned the value of blockchain’s
    claims to food provenance. If it involves physically or digitally tagging products,
    couldn’t this information be compromised? This raised a useful discussion on the
    quality and verification processes of data entering the blockchain. Some meetups
    capitalized on attendees’ skepticism, such as one titled “To Blockchain or Not
    to Blockchain: Does your company need a blockchain solution?”


    The rapid proliferation of blockchain meetups and events in Vancouver are indicative
    of the current formative stage of the development of blockchain. Even a year ago,
    there were far fewer events or public discourse about blockchain. We noticed that
    some of the events were polished and professional in terms of logistics and presentation.
    Others seemed to be thrown together haphazardly or hastily. Early adopters, or
    those eager to position themselves as such, are clamoring to enter the blockchain
    arena. Two examples from our observations illustrate this. We attended one “Intro
    to Blockchain” event organized by a local “women in blockchain” group, as advertised
    on meetup.com. When we arrived, we realized that in fact various groups, all associated
    with the same start-up incubator organization, had advertised this same meetup.
    We were expecting to attend a meetup targeted at women, led by the woman'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'pictured on the event listing. Instead, she was unable to make it that day,
    and one of her male business partners, who advertised the same event through a
    different local blockchain group, gave the presentation, which was attended by
    a mixed group of men and women, with women slightly less represented and far less
    vocal in the discussion. We noticed a shift in tone when the host announced he
    would be the only presenter. A number of female participants expressed disappointment
    that the event was not what they were expecting. For the participants, the communicative
    context mattered. In another instance, when we arrived at a “Women in Blockchain”
    meetup as per the Eventbrite ticket listing, we realized it had been cancelled
    and rescheduled for a later date with no notice given, so we showed up to an empty
    room. There is a sense of urgency and immediacy associated with these types of
    meetups, which in these cases came along with disorganization. These observations
    support our assessment of blockchain’s current position at the earliest stage
    of the diffusion of innovation curve.


    # Gendered spaces of resistance and support


    Blockchain’s gender problem was apparent in all the meetups we attended. All of
    the women-focused meetup presenters and one of the male presenters at a start-up
    organization’s “Intro to Blockchain” meetup highlighted the gender discrepancy
    in the technology sector, adding that this disparity is even more stark within
    blockchain. The male presenter suggested that organizing meetups with the aim
    of introducing more people to blockchain was a way of balancing the gender scales.
    Gender was at work in the meetups aimed at general audiences as well as the meetups
    specifically aimed at women. The existence of meetups such as “Meet the Women
    in Vancouver’s Top Blockchain Start-ups” goes to show that there is a need to
    create a space for meetups hosted by women, primarily targeted to women. These
    meetups function both to resist the hyper-masculine blockchain space and to foster
    supportive connections for women in blockchain by highlighting their leadership
    in the space.


    At the start of one of the women’s meetup presentations, the host asked the audience,
    “Why do you feel there aren’t more women in blockchain?” After a pause, it was
    one of the few men in attendance who spoke up first, commenting that women have
    historically been left behind in technology and finance. This cultural in-group
    dynamic continues with blockchain. Weeks later, we spoke to a woman at a meetup
    for Women in Male Dominated Industries, who explained how she enjoyed women-focused
    events in the tech and video gaming sectors. But she noticed more men had been
    attending them, and those men tend to be more outspoken than the women in a way
    that intruded on one of the few arenas women in tech could lay claim to.


    We asked the organizer of the Women in Male Dominated Industries about her motivation
    for starting this monthly event held at a coffee shop downtown. Her response echoed
    several of the conversations we had with other attendees.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '“If there isn’t a space in the field for you, you need to make your own space
    to succeed and improve at what you do,” she said. She had worked in the mining
    industry and wanted to make connections with other women who were similarly minorities
    in their fields, for support, networking, and professional development. Organizing
    these meetups was therefore her way of highlighting women’s successes and struggles
    across various male-dominated industries. One attendee of the Women in Male Dominated
    Industries meetup spoke about how she attends all sorts of events but really enjoys
    the women-created events because the energy and conversation “is just different”
    at them. Women are more comfortable speaking up about their hopes and fears without
    being dismissed or harassed.


    We found that women-created and women-focused events were spaces of resistance
    to the male-dominated sectors of both technology and finance, as well as spaces
    of support for one another in a broader context of an inhospitable tech sector.
    In various conversations, women saw blockchain as a platform to make their presence
    known in the technology and finance worlds. Some women organizers spoke of the
    necessity of getting into the general blockchain space through the various educational
    and networking opportunities that the meetups afforded. One presenter opened her
    talk on blockchain with a rallying cry about how women are missing out on great
    opportunity if they don’t understand and participate in the blockchain space,
    recounting how men have disproportionately benefited from financial and technological
    innovations in the past. In one of her introductory slides, she used side-by-side
    screenshots of Reddit and Pinterest to highlight online communities dominated
    by men and women, respectively. This example illustrated the gendered, sociocultural
    aspects of these tech platforms.


    We noted that at the meetups designed by women for women, the organizers asserted
    their positions as leaders rather than followers or beginners in the blockchain
    field. In contrast, the majority of the general-audience events had predominantly
    male panelists and presenters. This highlights the bias toward men as the de facto
    experts in the field, especially where digital and financial technologies are
    concerned. At “The Future of Blockchain” summit, men constituted over 70 percent
    of the speakers. Male presenters covered such topics as the financial and technical
    aspects of blockchain. In contrast, female presenters focused on how blockchain
    may impact other fields, such as health care, art, and marketing. This illustrates
    the fact that, since women have achieved better gender parity in those industries
    in recent years, they were perceived as credible enough to speak to blockchain
    in relation to those areas to a wider audience. In contrast, the male presenters
    at the same event were more likely to focus on cryptocurrency or business-related
    aspects of blockchain, which seemed like a ‘natural fit’ based on men’s overrepresentation
    in those areas.


    Panels on cryptocurrencies like Bitcoin and Ethereum were popular attractions
    for attendees seeking new investment opportunities. Both cryptocurrencies had
    received extensive media attention following their skyrocketing value'
