- pgno: 39
  md: 'While commons-based applications of blockchain do not share the same concerns
    as Bitcoin, they likely share a preoccupation with the spectre of the state intervening
    to incentivize competition. This is because the state is more than just a state;
    as we have argued, it is a neoliberal capitalist state. And one of the primary
    functions of this state is to incentivize competition, privatization, and deregulation
    in place of a shared, commons-based mode of governance over collective resources.
    The neoliberal state can therefore always be relied upon to allocate shared resources
    to the private sector as the basis for stimulating competition. This pattern is
    deeply embedded within the logic of the state itself, as demonstrated by countless
    failed attempts by left governments to install a different economic order through
    state power. Thus, until the character of the state itself is fundamentally altered,
    there is little hope of instituting an alternative order through the deployment
    of statism. For some, blockchain is a bulwark against this problem and perhaps
    even a solution to the breakdown of social provisioning provided by the Keynesian
    state.


    A blockchain might therefore provide key advantages to commons-based projects,
    to build coherence and trust among a community of people with shared values, to
    build alternative sources of value, and to protect commons and allow sharing of
    resources among underserved communities. As such, blockchains have the potential
    to facilitate and amplify a growing desire for alternatives to a privatized commons,
    neoliberal governmentalty, austerity politics, and a global financial system dominated
    by state and corporate power.


    # Trust


    In a small organization in which everyone knows one another and relations are
    already structured, a blockchain is unnecessary. The blockchain only emerges as
    a useful tool for a defined community in which members share values but do not
    necessarily know one another, where no formal governance structures exist, and
    where state institutions and financial interests are dominant. Under these conditions,
    if a community seeks to pool or manage resources in a framework that emphasizes
    participation and shared governance, blockchains offer a potentially revolutionary
    technology for maintaining trust and managing a shared resource. By using a blockchain
    for transparently managing, distributing, and assuring the stability of the shared
    resource, trust can be fostered within a community even as, externally, market
    relations are foisted upon every facet and domain of social life and the politics
    of austerity force further cuts to the services provisioned by the state (Gammon
    2012). In this way, blockchains are seen by some as a way to evade this reduction
    of existence to a profit margin and the exhaustion of a Fordist model that, at
    the very least, linked profits and productivity growth to wages.


    But a key element here is that the design of the blockchain application would
    have to be limited in scope: instead of offering to disrupt the dominant economic
    and political system, such a blockchain would aim to evade it and'
  merge: -1
