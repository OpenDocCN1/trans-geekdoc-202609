- pgno: 76
  md: '# Drivers of digital trust in the crypto industry


    Scott Freeman, Ivana Beveridge, and Jannis Angelis


    # Introduction


    In this chapter we focus on the role of trust as a digital enabler, with a particular
    focus on blockchain technologies. A high degree of cooperation among the users
    is the core element of shared ledger technologies. This in part creates a stronger
    bond among them and also puts pressure on the users to act in an agreed-upon manner.
    Such coordination and agreement of permissible behavior plays center stage when
    it comes to successfully employing blockchain technology, which in practice highlights
    the importance of trust among the users. In covering the issue, we discuss the
    characteristics of trust in a digital and cryptocurrency context and consider
    concerns relating to technology design, conditions of decentralization and transparency,
    and ways in which trust can be managed in a crypto-environment.


    # Trust and cooperation as key human success factors


    There is much dispute over the key factors that helped humans to dominate the
    planet. Was it the invention of controlled fire? Or of tools such as spears and
    traps? Language, cooking, or agriculture? No doubt all of the above played an
    important role. Yet it can hardly be denied that at least one somewhat more abstract
    innovation must certainly have had a crucial impact: humans’ ability to cooperate
    together in order to achieve common goals and ultimately share in the fruits of
    those endeavors. To do this, humans evolved the ability to create comprehensive
    trust relationships with others. Such trust is central to the functioning of the
    modern society (Watson, 2009).


    Anthropologists Richerson and Boyd (1998) suggest that to override their more
    basic selfish instinct to maximize personal gain, humans have evolved a kind of
    tribal instinct. This permitted our ancestors to share both resources and rewards
    and was thus key to enabling humans to begin the process of creating increasingly
    complex social and economic structures. The ability to cooperate for mutual benefit
    seems to initially have been limited to – as the term implies – known persons,
    i.e., other members of one’s tribe. This seems to have remained the state of affairs
    until recently in evolutionary terms. Even a'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'mere 2,500 years ago in Europe, those not belonging to one’s own group were
    for the most part considered to be without rights, essentially nonpersons, or
    “barbarians,” as the Greeks termed them. The idea that humankind in general was
    worthy of cooperation was a new concept and a decisive step that led to the almost
    infinitely complex interlocking patterns of cooperation and exchange that characterize
    our modern world.


    Trust remains a fairly complex and a multidimensional concept to define, since
    it draws on both rational and idiosyncratic perceptions and even lacks a common
    definition (Möllering, 2001). Trust has been researched by many disciplines, and
    it is influenced by many tangible and intangible factors. Traditionally, economists
    viewed trust as calculative (e.g., Williamson, 1993) or institutional (North,
    1990) and psychologists assessed it in terms of attributes of trustees and trustees
    (Tyler, 1990), while sociologists interpret trust in terms of relationships between
    people or institutions (Granovetter, 1985). Rousseau, Sitkin, Burt, and Camerer
    (1998) suggested that these different interpretations of trust are also related
    to different usage of language in its denotative vs. connotative terms. Mayer,
    Davis, and Schoorman (1995, p. 712) proposed what became one of the most cited
    definitions of trust as a “willingness of a party to be vulnerable to the actions
    of another party” in a situation of risk. What unifies many definitions of trust
    is that rather than being defined as an individual mental predisposition, trust
    is mostly seen in relational terms (Castelfranchi & Falcone, 2001).


    Trust has evolved through history from being confined to immediate and restricted
    individual networks to being extended to third parties deemed to have the needed
    authority. Undoubtedly, trust could only be understood in context, as it is always
    constructed in unique contexts (Bohnet & Meier, 2005). In this respect, blockchain
    presents a unique, relatively new context that calls for revisiting of the aforementioned
    traditional notions of trust. In particular, decentralized models have the potential
    to reorganize all manner of human activity (Foroglou & Tsilidou, 2015), showing
    a new kind of creative potential and a capacity to deliver a new kind of trust
    (Walport, 2016).


    # # Complex cooperation models in the modern economy


    That humans have developed the tribal instinct or “ultra-sociality” (Richerson
    & Boyd, 1998) does not change the fact that they also retain an instinct to seek
    to maximize personal gain while at the same time minimizing the personal effort.
    This means that successful cooperation is dependent on a mechanism to limit the
    free rider problem by punishing cheaters and rewarding fair players in proportion
    to their contribution. If such a framework can be devised, trust relationships
    can be created and deepened between participants. In a business context, voluntarily
    organized joint-stock companies were a means to essentially pool resources together
    for specific and limited purposes without the need to change tribes or affiliations.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Using written rules enforced by contracts, both contributions and rewards were
    regulated, which in turn increased the level of trust between the participants.
    The existence of such a systematic and formalized approach to trust meant that
    humans could effectively participate in multiple tribes. Initially, people who
    knew each other personally came together, but stocks and bonds were increasingly
    abstracted from their founding companies and allowed people who had never met
    physically to combine resources. These increasingly complex models of cooperation
    were closely correlated with productivity gains. Trust plays a significant role
    in corporate collaborations because successful and sustainable business relationships
    typically require an established and mutual level of trust (Kwon & Suh, 2004).
    This is especially true for large networks where complex transactions and information
    sharing must be managed in a timely and reliable manner (Eurich, Oertel, & Bottelier,
    2010).


    In the twenty-first century, facilitated by an increase in the use of information
    technology to both enable and survey investments and trades, those initial joint-stock
    companies evolved into complex corporate structures mostly owned and controlled
    via financial markets. Those financial market and corporate structures became
    more complex and convoluted but also created new opportunities for added value
    for participants. Yet, at the same time, something in their basic nature changed.
    Governments and specialized lawyers increasingly took over the structuring of
    these relationships, to the extent that in most countries today, these relationships
    can hardly be said to be the result of voluntary cooperative agreement between
    the participants.


    These entities not only took over control but also demanded an increasingly large
    cut of the fruits of those cooperative structures. While governments typically
    claim that this is done for investor protection, ultimately these structures can
    be seen as classic protection rackets. As their voluntary nature ebbed, trust
    in the honesty of these structures understandably fell. Offering an alternative
    model to this traditional one, blockchain has challenged the assumption about
    traditional organizations being best suited to manage market transactions, disrupting
    the existing power structures and calling for the updates on the traditional notions
    of trust (Seidel, 2017; Yermack, 2017).


    Erosion of trust is not only apparent as it pertains to the traditional financial
    institutions, but it also extends to online centralized systems. For example,
    Facebook collected more personal customer’s data in the first ten years than the
    Library of Congress in 200 years (Zyskind, Nathan, & Pentland, 2015). Massive
    mining of user data, notably on Facebook, has significantly contributed to the
    erosion of the public trust in the centralized online entities (The Harvard Gazette,
    2018).


    Blockchain systems and digital currencies present a shift from the traditional
    financial and centralized infrastructures, allowing for more transparent, decentralized
    organization in contrast to the traditional centrally coordinated and less transparent
    monetary system structures. Considering that many online services in the future
    could run as decentralized applications on blockchain systems, it'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'will be important to understand the new notions of trust both in terms of social
    as well as technological components of these systems.


    # Trust and digital technology


    Although much of human cooperation has historically been achieved through violence
    and coercion, voluntary cooperation has proven to be more efficient, and it has
    grown steadily over time. Today, technology is intertwined with and changes how
    trust is manifested among people and in society at large. The development of the
    digital arena in general and the use of decentralized systems such as blockchain
    in particular have both a significant and substantial impact on how trust is manifested.
    We see the unique culmination of voluntary trust in the largely unregulated cryptocurrency
    industry. Thanks to the Internet – and more recently the distributed technology
    platforms such as blockchain – people all around the world can now choose from
    a vast number of technology platforms and even investment opportunities. The webs
    of trust that thereby are created reach connection numbers and speeds unprecedented
    in history.


    Despite the creation of an interconnected, worldwide web enabling instant communication
    and trading in ways unimaginable to investors living a mere half a century earlier,
    they would likely find the structures we observe today in traditional financial
    markets to be quite recognizable. This is because the regulatory bodies have essentially
    cemented those structures into place. Given the highly bureaucratic nature of
    financial markets in most countries, the decentralized and transparent nature
    of cryptocurrencies and their associated distributed ledgers offer a real alternative
    to existing financial structures. Exchanges, brokers, and derivative merchants
    can flog their services worldwide. Value propositions can be promoted and funds
    raised to support projects from investors in all corners of the world. A team
    with a promising project in Kazakhstan can get investment from an enthusiastic
    investor in Japan or Tanzania, and it is fairly difficult for governments and
    third parties to extract a share. A key underlying enabler to all this is digital
    trust. The unprecedented transparency of the feedback mechanism offered by the
    Internet and transparent distributed ledgers offer market participants new avenues
    to judge the reliability of potential contract partners.


    Research on trust and technology has mostly been conducted on the premise that
    a third party exists, and thus trust has been defined in relation to another party
    that is trusted (Bracamonte & Okada, 2017). Not having to rely on a trusted third
    party to validate transactions by users or to maintain the security of the system
    is considered as one of the most important characteristics of block-chain technologies
    (Nakamoto, 2008). This tendency toward decentralization resides in the essence
    of blockchain technology (Manski, 2017). Nonetheless, decentralized applications
    based on smart contracts rely on a combination of technical components to achieve
    a system where it is not necessary to trust an individual node (Bonneau et al.,
    2015). Furthermore, the system also relies'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'on traditional architecture, with websites acting as the user interface being
    susceptible to downtime. Thus, the concept of trust in blockchain should be measured
    as social as well as technology trust (Bracamonte & Okada, 2017).


    # Blockchain characteristics and trust


    The use of blockchain technology in the crypto industry – or the broader distributed
    ledger technologies it falls under – provides potentially four different but connected
    advantages: safety, efficiency, scalability, and improved access (Heires, 2016).
    But to be realized, the relationship between various parties must move from purely
    transactional to a more integrated relationship. For instance, the network-based
    consensus approach to decision making and information processing helps prevent
    fraudulent transactions, but it also places a significant degree of responsibility
    on all participants. In its core, this is an issue of trust in the network.


    Distributed ledger technologies have the ability to lower transaction costs and
    make intellectual property ownership and payments more transparent, seamless,
    and even automated. They give any authorized party access to the entirety of or
    parts of the ledger of recorded transactions by distributing digital copies of
    the ledger instantly and simultaneously, and with the transaction record indelibly
    recorded through advanced computational algorithms and various cryptographic locks.
    This has the potential to facilitate significant levels of trust among the participants,
    which in turn supports value creation and exchange. Blockchain technologies have
    even been named the Fourth Industrial Revolution (Schwab, 2016), categorized as
    a disruptive and transforming technology in a similar way that email removed the
    need for a trusted third party such as the post office (Lee, 2016; Insiti & Lakhani,
    2017). A growing interest in the industry has resulted in the high degree of venture
    capital investments in blockchain startups, estimated at around $1.3 billion in
    2018 and growing (The Crunch, 2018). In this light, it’s hard to deny that the
    blockchain industry has been disrupting the key traditional economic sectors,
    and it has attracted substantial attention from the financial, tech, and academic
    sectors.


    At the core of technological innovation behind it is the so-called “Nakamoto consensus”
    protocol for maintaining a decentralized ledger known as the blockchain. Under
    the pseudonym Satoshi Nakamoto, an individual or a group published in 2008 the
    paper “Bitcoin: A Peer-To-Peer Electronic Cash System”. It describes the ideal
    of direct peer-to-peer transactions without a third party or intermediary (Nakamoto,
    2008). Previously, if not held in its physical form, money was tracked on the
    ledger of a centralized intermediary. Blockchain is the first digital currency
    system that does not require such centralized intermediary. This allows users
    to conduct economic exchanges without an intermediary (Werbach, 2018). When the
    Bitcoin blockchain later emerged in 2009, it was little known outside of the crypto
    community and was for the most part considered obscure until more widely recognized
    around 2012.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'In blockchains, trust is built on the decentralized nature of the ledger and
    the immutability of the shared data. The former means that parties can interact
    with each other and have confidence that records of any interactions and transactions
    are permanently archived. The latter means that any changes to the shared information
    on such interactions cannot be altered or modified without all participants being
    aware of the changes. Both of these conditions foster an environment of increased
    trust among the blockchain participants, even in blockchains where participating
    parties are anonymous. Moreover, each transaction action in a shared (or public)
    ledger is verified by consensus of a majority of the participants in the system,
    allowing for traceability and, in turn, security without the need of a central
    authority. Since every block is connected to the previous one, as the number of
    participants and blocks grow, it is very difficult to modify information without
    having a network consensus (Corea, 2019; Crosby, Nachiappan, Pattanayak, Verma,
    & Kalyanaraman, 2015). Such a consensus-seeking system both requires and builds
    trust among its participants.


    # The nature of digital trust


    The concept of trust appears ambiguous in the blockchain space, and it is often
    referred to as “trustless trust” (Cohney et al., 2018). This is not to say that
    blockchains do not require trust or exist without trust; rather, trust is distributed
    among different actors (otherwise not knowing each other enough to trust one another)
    who place trust in the system, providing them with the economic incentives to
    cooperate. Decentralization in this case leads to more transparency due to near-real-time
    transactions monitored via the public peer-to-peer network, whereby each transaction
    is verified by consensus of a majority of participants, contrary to the traditional
    centralized financial mechanisms. Furthermore, each past and present transaction
    remains stored and can be verified at any point in the future. The extent to which
    trust is encompassing naturally leads to an embarkation between those trusted
    and those not trusted. In blockchains, this is the boundary between public and
    private chains. In the former, access to participate in the consensus process
    of operating the blockchain is not regulated. In contrast, in the latter, permissions
    are kept centralized. Read permission may be public or restricted to an arbitrary
    extent. Hybrid blockchain versions such as so-called consortia have the consensus
    process controlled by a preselected set of parties (or nodes).


    The decentralized nature of blockchain technology eliminates the need for a third
    party controlling the ledger. This is beneficial in terms of shared decision making
    and ensuring information is not forged or modified in secret, since copies remain
    synchronized with the other network participants. But the shared access or ownership
    to contracts, transactions, and records also places a substantial responsibility
    on these participants. They need to conform to agreed-upon rules and procedures
    so as not to cause problems for the network as whole. They also have to make decisions
    on such things as changes to'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'procedures and offered services that follow a shared vision. The participants
    are expected to make decisions that are beneficial to the network as a whole.
    Since the dynamic and often rapidly changing business environment may require
    fast decision making on unexpected issues, it is typically difficult to preplan
    for all eventualities.


    Network participants must be trusted to make the right decisions. For instance,
    the blockchain immutability of data, where the shared ledger means information
    cannot be modified without leaving a trace, does provide a notable degree of operational
    security. But the shared decision making means that participants in some circumstances
    can overrule others through “majority attacks”, where the common decision making
    is controlled through a majority (e.g., the “51% attack”). Retaining the shared
    benefits means that participants have to be trusted to refrain from such behavior,
    possibly through a hybrid permissioned-permissionless approach that limits the
    decision-making ability to those participants that share a common vision.


    What may be one of the main drivers behind the growing research interest in blockchain
    is in fact the ambiguity found in the fundamentals of blockchain, and in particular
    behind the notion of trust underpinning the industry. Bonneau et al. (2015) note
    two opposing research views on blockchain technologies, symbolized in attitudes
    to Bitcoin. Bitcoin is a decentralized digital currency in which encryption techniques
    are used to allow peer-to-peer transactions in a system that works without a central
    bank or single administrator. The first research view suggests that “Bitcoin works
    in practice but not in theory”, dismissing it due to its lack of a solid theoretical
    foundation. The second view is that its stability relies on an unknown combination
    of socioeconomic factors “hopelessly intractable to model with sufficient precision,
    failing to yield a convincing argument for the system’s soundness” (ibid, p. 104).


    Undoubtedly, the same factors serving as trust enablers in the crypto world present
    a challenge – conceptually at least – for traditional institutions and in particular
    for the institutional investors. One important reason for this is the ecosystem
    nature blockchain technologies typically operate within. An ecosystem refers to
    a network comprising a focal organization, its suppliers, and customers (Adner
    & Kapoor, 2010). As such, the ecosystem is the wider network of parties that influence
    how value is created and captured. Organizations operating within the ecosystem
    have to consider their function in the ecosystem and design and employ the blockchain
    accordingly. Without a doubt, the notion of digital trust in the blockchain industry
    has disrupted the traditional notions of organizing in the market economy as we
    know it.


    # ## Incorporating trust


    The complexity of the trust concept has increased in the digital space due to
    a combination of technological and sociological components. In the crypto space,
    the concept of trust can be largely explained with the way blockchain'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'is designed. Previous research analyzing the notion of trust in the blockchain
    systems has been limited, focusing on issues such as social components of Bitcoin
    use (Zarifis, Cheng, Efthymiou, & Dimitriou, 2014) or wallet providers (Eskandari,
    Clark, Barrera, & Stobert, 2015). In particular the notion of “technology trust”
    in blockchain systems remains under-researched. Bracamonte and Okada (2017) suggest
    that the focus of research on user behavior in blockchains should also be on the
    technology as a trustee. Because governance mechanisms rely on the architecture
    of the system and its developers (Kroll, Davey, & Felten, 2013), it is misleading
    to suggest that blockchains are characterized with “trustless trust”. Within the
    distributed ledger technologies (DLTs), code substitutes for trust, and this allows
    for a new type of market interactions (Kewell, Adams, & Parry, 2017). A shared
    consensual ledger replaces the traditional need for trusted third-party intermediaries
    with a consensus of rightness, whereby DLTs replace the old concept with “trust
    in the algorithm.”


    Iansiti and Karim (2017) suggest five basic principles behind blockchain technology:
    a distributed database: – each party on a blockchain has access to the entire
    database and its history, and no single party controls the data of information;
    peer-to-peer direct communication; transparency with pseudonymity – every transaction
    is visible while the users can choose to remain anonymous or provide proof of
    identity to others; irreversibility of records; and computational logic (users
    can set up algorithms).


    Bonneau et al. (2015) suggest that blockchain operates without any specific trusted
    third parties as well as without pre-assumed identities of the participants. One
    of the key drivers of trust is certainly the way that blockchain technologies
    are designed: rather than being centralized, the ledger is replicated and distributed
    across a wider network. This enables the anonymous parties to enforce complex
    agreements via cryptographic proof protecting each transaction through a digital
    signature, rather than trusting a third-party mechanism.


    Blockchain thus presents a self-regulating mechanism that incentivizes correct
    behavior, enticing “miners” to work on valid blocks (that is, those accepted by
    the majority) and reject invalid ones and remain motivated to solve a computational
    puzzle in order to gain financial incentives. This was originally described by
    “Nakamoto” as “incentive compatibility” – that there is an assumption that Bitcoin
    will remain stable as long as miners follow their economic incentives. Furthermore,
    the underlying blockchain technology eliminates the ability for any single entity
    to change the ledger without other parties (or nodes) being able to detect the
    changes made (Hackett, 2016).


    # ## Managing decentralization


    Blockchain technology enables the type of new structures reflecting the manner
    in which way we communicate and share information today – that is, the decentralized
    way we conduct communication and business exchanges. This trend for decentralization,
    fueled by distributed communication systems of the Internet'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'now culminating in the blockchain systems, is ultimately what underpins social
    media, crowdfunding, and what is commonly referred to as the “Internet of Things”
    (IoT). To a degree, this quest for decentralization has been accelerated with
    the erosion of trust in centralized systems and concerns over privacy.


    Decentralization is a key blockchain feature. Its decentralized approach addresses
    “the centuries-old problem of trust, a social resource that is all too often in
    short supply, especially amid the current era’s rampant concerns over the security
    of valuable data” (The World Bank, 2016). Blockchain relies on the group consensus
    mechanism regulating transactions in the competing environments without third
    authoritative parties (Tapscott & Tapscott, 2016). Transactions in the blockchain
    are validated through the process known as “mining” by the network members, whereby
    it is the network that performs the centralized function of the trusted third
    party. Network members validate transactions, and this is achieved by the consensus
    of majority (Welch, 2015). Because blockchain has the potential to create an infrastructure
    that no single person has the power to change, it might as well hold the potential
    to avoid the “tragedy of the commons” in the sense we know it.


    Traditionally, we place trust in the third parties perceived to have the authority,
    and they are the ones who verify identities of all parties involved in market
    transactions. Conversely, consensus on the blockchain is achieved through a decentralized,
    pseudonymous protocol, which as an innovation plays a central role in its success.
    Simply put, it takes financial intermediaries out of the equation, allowing parties
    without a preestablished trust to conduct transactions safely: the security mechanisms
    are provided by the peers rather than by the third authoritative party.


    Decentralization is a key disruptor of the existing structures. The need for a
    trusted third-party intermediary is replaced with a shared consensual ledger.
    This fundamentally challenges the traditional management thinking and organizational
    theory, where the starting assumption is that legitimate organizations or third
    parties are best suited to take up on the role of trust coordinators, assuming
    a source of power in their centralized positions (Seidel & Greve, 2017). Conversely,
    blockchain technologies enable trusted market transactions without a central authority,
    challenging the fundamental organizing principles of capital markets.


    # Managing transparency


    If a bank claims to have deposits of $1 billion, it is nearly impossible for anyone
    on the outside to assess if that is true or if the bank hasn’t already lost those
    $1 billion by handing out bad loans. For the average saver, the answer is that
    he or she basically cannot know. He can only hope that some regulating authority
    is watching over their shoulder.


    The situation in the crypto world is completely different. If an exchange X claims
    that it has 100,000 bitcoins, or $1 billion in USD tether deposits, this'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'is very swiftly verifiable on the associated blockchain. For example, if both
    Bitfinex and Binance have holdings of approximately 168,000 bitcoins in their
    principal Bitcoin wallet addresses, then this is visible on websites such as bit-coinforcharts.com
    that track such figures.


    What about smaller players, new entrants, or simply entities located in other
    countries? Investors looking to buy into a promising new project need to open
    an account at an exchange located in another country. How can they decide whether
    it is trustworthy? For starters, just as with a local bank, they can take a look
    at the building it occupies – in this case the digital building. Is it well built?
    Is it riddled with spelling mistakes? Do deposits and withdrawals in multiple
    currencies work smoothly? After sending a minor amount, does the deposit credit
    to the account quickly, and is withdrawal possible equally promptly? Is it listed
    on the major exchange listing sites? Does it offer responsive customer service?


    Building and promoting websites with all these functions is not cheap – it takes
    money, valuable time, and know-how. If everything more or less works – keeping
    in mind that the entire industry is in a constant state of flux – then it is a
    fair bet that the business is far more valuable as a running concern than as a
    one-time tool to rob depositors. Who would go to all that trouble just to steal
    a bit of money from depositors while at the same time risking arrest? Most users
    intuitively use this logic to assess potential service providers, and thus far
    losses from fraud have been minimal.


    The same difference in transparency holds true even if something goes wrong. In
    the traditional financial world, as soon as something goes wrong, typically, a
    government entity becomes involved. The processes may take years, and in the meanwhile,
    investors are largely out of luck. For instance, in the 2011 MF Global bankruptcy,
    it took five years to complete handling of all claims, and for several years it
    appeared probable that small investors would essentially end up penniless. This
    long and indeterminate delay was disastrous for many of those investors. By contrast,
    in the digital world, far more efficient options are available to resolve such
    dilemmas. For example, investors can be offered a tradable token in lieu of immediate
    repayment. This was precisely the approach taken by Bitfinex after its servers
    were hacked in August 2016, leading to the loss of 119,756 bitcoins.


    Although this hack left Bitfinex technically insolvent, they were back online
    within two weeks, issuing their users “BFX tokens” representing 36 percent of
    the total value of their previous holdings calculated in US dollars. This meant
    that not only were their users able to immediately regain access to 64 percent
    of their assets, they were also able to opt to trade away their BFX tokens at
    whatever price the market had on offer. Obviously, for most users this result
    was far more attractive than waiting five years for an uncertain payout. For those
    with confidence in Bitfinex, results were even better. They were able to pick
    up additional BFX tokens for as little as 15 percent of their par value of $1
    USD. BFX holders could optionally convert these into Bitfinex equity, or simply'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'wait for Bitfinex to pay them at par. Bitfinex redeemed all BFX tokens at par
    within 10 months of their issuance. Those who converted their BFX tokens into
    equity ended up with a return of over 1,000 percent on those investments.


    # Managing mistrust


    Digital trust in the crypto world is certainly a numbers game. To a degree, the
    platforms are trustworthy because thousands use them, and if they are abused,
    the consequences are potentially high for a large number of users. Moreover, deposit
    amounts held by many platforms are somewhat transparent and thus speak for themselves
    in terms of capital backing. Nonetheless, digital trust in the crypto world is
    enabled by a dynamic interaction between other complex factors. It also results
    from the fact that there is a healthy equilibrium between “honest” and “dishonest”
    players.


    The hacks particularly highlight the power of these newly created trust networks.
    Perhaps one of the most known breaches of security was the Mt. Gox hack revealed
    in 2014, whereby approximately 540,000 bitcoins were lost in total. This ultimately
    resulted in Mt. Gox declaring bankruptcy; as of November 2018, creditors are still
    waiting to be compensated. Mt. Gox was a Japan-based Bitcoin exchange, and at
    the time the largest in the world. High-value hack cases are, however, abundant,
    such as the DAO hack, which led to the controversial Ethereum transaction rollback,
    the Parity Wallet hack, and the Bitfinex hack mentioned earlier. And while security
    measures have clearly improved since Mt. Gox days, rapid expansion of the industry
    was probably been a major reason why major hacks continued to occur, at least
    until early 2018. One of the last publicized major cases was the January 2018
    XEM hack of the Japanese Coincheck cryptocurrency exchange, resulting in the loss
    of $534 million USD equivalent.


    Although these hacks do send ripples of fear across the trading community, at
    the same time, they have not managed to cripple the enthusiasm. Arguably, they
    lead to the overall increase of the industry standards, inspiring the evolutionary
    development through a “survival of the fittest”, making the cryptocurrency industry
    more secure long term (Zycrypto, 2018). A study by Suberg (2018) shows that blockchain-related
    majority attacks, so called 51% attacks where a group of miners control the network
    mining hash rate, are both a credible and significant threat and something that
    directly impacts partner trust.


    Another risk is that a user with a compromised private key cannot recover it,
    unlike in a centralized system, where reissue typically is possible. Personal
    identity preservation is nowhere near a guarantee and points to a need for a degree
    of trust among the participants for the blockchain to operate well. Christoffer
    De Geer, vice president of the first Swedish Bitcoin company, BTCX, stated to
    Crypto News (2018), hacks are “good for the industry as a whole. The more hacks
    we can have, while the industry is young, the better for the industry when it
    is established. If companies today learn how not to store digital value,'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'and customers learn how not to give over everything they own to centralized
    third parties, while we can still change, and while the hits are not too devastating,
    that’s all the better for the industry”.


    A short story from early 2018 entitled “How I ended up with $55,000 in Crypto
    for free because of a hack” illustrates this issue well. After originally appearing
    on Reddit (2018), the post went viral. The developers of the hacked blockchain
    decided to give people double what they had before the hack, but what the developers
    gained was increased value, making up for the loss after the company proved to
    be trustworthy following the hack. As suggested by the Redditor “Juicy Spark”,
    that decision “was intentional. It was a lot easier for them to give everyone
    double what they had . . . then to sit through all this mess. It wasn’t bad. We
    were only talking maybe a million extra coins in circulation compared to over
    a billion coins”.


    Millions of dollars in coins and tokens have repeatedly been stolen from cryptocurrency
    exchanges or wallets due to hacks. Consequently, the mainstream financial press
    has repeatedly labelled cryptocurrencies as a “moral hazard” with “too many hacks,
    too little security” (e.g. Bloomberg, 2018; CNN Money, 2018). Nonetheless, the
    interest in the industry continues to grow exponentially, and this is to a large
    degree related to the redefined notion of trust in this space.


    # A trust-mistrust equilibrium as a basis for investment


    There is a balance between trust and mistrust in all human endeavor, and the digital
    world is no exception. The investment proposition offered by BiblePay, a “charity-focused
    Christian cryptocurrency”, is a good example to illustrate this idea. This organization’s
    mission – or value proposition – is described as giving to charity in abundance,
    helping to find cures for diseases, sharing the Gospel of Jesus, and decentralizing
    money. Considering that they have managed to stay afloat in the industry for a
    while, their proposition apparently proved appealing to at least some clients
    or investors. They allegedly funnel funds to BiblePay researchers who use “distributed
    Computing to assist in fighting diseases like cancer and HIV/AIDS”, all while
    appealing to the environmentally conscious demographics.


    Rather than “wasting energy that essentially just generates heat”, they suggest
    that BiblePay takes a completely different approach: most of their computing resources
    “are used in research projects focused on finding cures for diseases”, thus pioneering
    the energy-efficient method that is also respectful to the environment and “helps
    provide hope to people all around the world: when you participate as a BiblePay
    researcher you get BiblePay coins (BBP: based on the amount of research you do.
    This BBP is created in a block, but instead of being in the standard 7-minute
    block it is included in a daily ‘super-block’ that is distributed to researchers”
    (BiblePay.org).


    For investors who view the BiblePay coin to be an investment worth considering,
    the question remains: do the gains from trust relationships offset the'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'losses from relationships with other, seemingly less trustworthy parties? If
    an investor invests one bitcoin in nine projects that collapse, plus one bitcoin
    in a project which succeeds, how successful must that project be for the overall
    investment to generate a positive return? The answer is that one successful project
    must have the quite substantial returns of 1,000 percent. In the blockchain industry,
    such returns have for some time been achieved.


    # Concluding thoughts


    The digital revolution is undoubtedly disrupting traditional structures. Early
    adopters have set about applying blockchains to everything from supply chain management
    to hospital records, the workings of government through transparent voting, and
    the digital signatures of e-ID (Roehrs, da Costa, & da Rosa Righi, 2017; Sullivan
    & Burger, 2017; Sun, Yan, & Zhang, 2016). Thus, the impact of blockchain use on
    society is significant, and the implications this may have on the creation of
    trust quite substantial. Similarly, cryptocurrencies are based on the fundamental
    idea of disintermediation, decentralization, and peer-to-peer networks enabling
    complete strangers to reach consensus without a third-party authority. This is
    in contrast to the centralized power model of the traditional financial sector.
    Such disruptions challenge how many people think of market transactions. However,
    they also provide opportunities to create new value propositions, allowing organizations
    to move beyond their traditional business models and to redefine their notions
    of trust in the contemporary organizing context.


    It is apparent in the crypto world that trust and distrust serve as enablers of
    digital trust: prioritizing one dimension over the other (i.e., seeing trust only
    as beneficial and distrust only as harmful) implies that the interrelationship
    between the two is not fully understood. Mistrust reinforces trust. The problem
    of focusing only on a seemingly positive pole implies that the interrelationship
    between the two is not fully understood, and this leads to a negative reinforcing
    cycle (Lewis, 2000). Trust alone can lead to poor results. Thus, rather than eliminating
    the inherent paradox embodied in the notion of trust, embracing it helps to “construct
    a more workable certainty” (Lüscher & Lewis, 2008, p. 234). The ability to endorse
    distrust as a crucial aspect of digital trust may be essential for the long-term
    success of the industry. Understanding the balance between trust and suspicion,
    which exist in each society, helps to understand how societies actually work.


    Whether blockchain is destined to replace traditional structures and usher in
    new business models and decentralized governance structures is yet to be seen,
    as well as how it will interact with traditional financial institutions. What
    is apparent, though, is that it is disrupting our thinking about the fundamental
    rules of a market economy and the traditional approach to organizations and interactions
    between them. Seidel (2017) suggests that we currently do not have adequate organizational
    theory to explain the phenomenon of distributed'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'trust in the crypto world; it fundamentally transforms boundaries of organizations,
    thus challenging traditional assumptions about organizations being an ideal entity
    to manage market transactions. It has fundamentally disrupted existing power structures,
    questioning their future role and reason for existence (Yermack, 2017). Consequently,
    traditional notions of trust may need to be updated (Seidel, 2017).


