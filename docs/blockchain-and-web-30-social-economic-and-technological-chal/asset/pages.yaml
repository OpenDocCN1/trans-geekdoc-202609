  md: 'mutualism as the ability to mutually build and support a collaborative platform
    upon which to transact free from the view and inference of corporate intermediaries
    (Swartz 2017). The prominence of this agenda within cryptocurrencies speaks back
    to their emergence during a proliferation of surveillant business models referred
    to earlier. Swartz (2017) also observes that infrastructural mutualism is tied
    to peer production, such as free software, peer-to-peer production, and commoning
    practices. As such, infrastructural mutualists orient towards the blockchain as
    a decentralised, autonomous infrastructure with shared utility produced and maintained
    by all participants; links here to Deleuzian readings of the relationship between
    labour, technology and production are ripe but outside the scope of this contribution.
    Perhaps these relations are why we see the continued longevity of the blockchain
    within contemporary discussions (cf. Allen et al. 2018; Zhao et al. 2016) beyond
    their applications as a transparent ledger for assigning and transferring ownership
    of cryptocurrencies.


    # Bitcoin constricts – a carceral aloofness


    Here we consider in more detail the polysemy within Bitcoin rhetoric and ideology
    as market forces impact familiar structures around the ‘structureless’ distribution
    of the blockchain. The community value that enabled and was exploited by Bitcoin
    proponents can be seen as competing narratives to the Bitcoin story. As Bitcoin
    became popular enough to make the evening broadcast news around December 2017,
    these narratives are sometimes paradoxically woven together in the same brea[d]th.
    ‘Establishing an extra stream of income will allow you to start investing earlier’.
    This advice from Erik Finman, a Bitcoin multi-millionaire turned financial advisor,
    spread on Twitter during early 2018, when Finman was aged 19. In an interview
    in Forbes published a few hours later, Finman referred to his association with
    his brother, suggesting that ‘we saw this as an incredible way to transcend the
    financial system including Wall Street. We discovered the incredible implications
    politically that this technology hasn’t even begun to crack . . . yet!’ (Munford
    2018). The ‘yet’ that Finman refers to is a point of significant political, financial,
    and technical speculation.


    Against speculation, however, is the evolving arc of Bitcoin practice, which shows
    a bend back to constraining forms of control. These seem to, for the majority
    of users, offer very different conceptions of the Bitcoin economy to Finman’s
    account. Economies are aggregate things, and while Finman’s suggestions or experiences
    are perfectly valid, they do not encompass the median or average Bitcoin experience
    of others. In aggregate, 2017 saw Bitcoin at the heady heights of trading, with
    prices reaching $19,694.68 USD per coin at 11 a.m. on the 17 of December. Since
    then, Bitcoin’s price has declined steadily, trading variously between $3,800
    USD and $8,000 USD in late 2018, which, considering history, means little. Yet
    these incredible swings of Bitcoin’s monetary value offer insight into the practices
    that are steering this distributed'
