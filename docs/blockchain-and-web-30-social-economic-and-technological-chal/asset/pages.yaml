  md: 'As we can see from Table 13.1, SmartInspect''s only characteristic flaw is
    related to instrumentation for remote debugging. However, this is a limitation
    imposed by the Ethereum blockchain technology rather than a design flaw in our
    approach.


    Remix [Eth18b] is a suite of tools designed by the Ethereum Foundation for Solidity
    developers. Remix IDE is probably the most used tool in its suite. In the Remix
    tool suite, there is a full transaction debugger with inspection capabilities.
    Remix inspector only falls short in extendibility and instrumentation. It was
    designed specifically for Solidity and Ethereum, and as such, it is not extensible
    to other platforms. As we previously explained, instrumentation is not possible
    due to the characteristics of the Ethereum platform.


    Etherscan is an analytics platform for Ethereum. It provides live information
    from Ethereum on blocks, transactions, contracts, etc. If a developer publishes
    his/her contract source code on Etherscan, then it will be possible to inspect
    the contract''s data. However, by doing so, the developer will expose his contract
    source code and internal data to anyone, in a very easy way to access it. That
    is the reason why Etherscan inspection lacks privacy (unlike SmartInspect and
    Remix, which can expose the data to the developer only). Etherscan provides an
    API to access its services, but it is not extensible. Just like SmartInspect and
    Remix, Etherscan''s inspector cannot support instrumentation.


    An ad-hoc decoder uses the Ethereum API on the memory slots to manually fetch
    the data. This is a complex task, since it demands a deep understanding of the
    memory layout of each contract a developer plans to inspect. It also requires
    a developer to know the type of each attribute and code the ad-hoc decoder accordingly.
    Its advantages are that it allows access to data without loss of privacy and without
    the need to redeploy the contract. In fact, SmartInspect uses this concept of
    decoding memory layouts as a part of its inspection process.


    Getter methods are a simple solution since they are cheap to implement and easy
    to test. The developer does not need to know the memory layout of a contract to
    create getter methods. However, if the developer forgets to make a getter for
    a given attribute, he/she will need to redeploy the contract and, most often,
    lose the data from the previous instance. Solidity does not support the return
    of many complex types (e.g., structs, mappings) on its functions. Therefore, a
    developer might need to adapt his/her data or function to provide access to a
    complex type. Moreover, the easy access to the data may cause a loss of privacy,
    since getter methods are a public part of the contract binary encoding.


