    # Chain navigation and query language


    Ethereum and other blockchains store a massive amount of heterogeneous data. In
    early 2017, Ethereum was estimated to have approximately 300GB of data [BLPB17].
    Retrieving information from this massive amount of data is not an easy task. Moreover,
    the Ethereum platform only allows direct access to its first-class data elements,
    which includes blocks, transactions, accounts, and contracts [Eth14]. Therefore,
    if we search for a particular piece of information inside a data element, we would
    need a unique identifier (i.e., either the number or its hash) to access the block
    containing such information. Another alternative would be to directly access one
    block and sequentially access its parents to search for a data. Moreover, the
    information returned by the Ethereum platform when we access its blocks is encoded
    into a JSON-like structure that we need to interpret to acquire a specific item.
    Therefore, the Ethereum platform does not provide a semantic way to search for
    information nor an easy form to present such information.'
