- pgno: 168
  md: 'communication medium away from radicality and towards the gravity of commercial
    interests.


    These commercial interests manifest in ways that seem antithetical to the selfless
    ideology that blockchain is supposed to represent. For instance, in 2018, Statisgroup,
    a consultancy, suggested that 81% of initial coin offerings were total scams,
    with only 1.9% having successfully deployed a distributed ledger with a road map
    for their product and having publicly shown the code of their ledger. Meanwhile,
    the justice department has reportedly opened a criminal probe to market manipulation
    for Bitcoin and other digital currencies (Robin-son and Schoenberg 2018); there
    is ample evidence to suggest that actors in a zero-regulation market behaved as
    a cynic (or regulator) might expect.


    Other specific structural problems of Bitcoin mining show that their practical
    implications have been fully co-opted by monopolistic market structures – quite
    an irony, considering the libertarian overcurrents of blockchain rhetoric. Mike
    Hearn, a well-known Bitcoin developer, suggested as far back as early 2016 that
    the Bitcoin experiment was over, and that the platform was not working anymore.
    Hearn (2018) offers evidence of mining being a monopolistic enterprise centred
    in China, where over half of the hash power resides. He suggests that this monopolistic
    trend creates perverse incentives to meddle in the popularity of Bitcoin as a
    way to ensure control of its means of (coin) production. Hearn goes on to detail
    the technical and ideological problems of various forks of Bitcoin, where the
    one indisputable distributed ledger is thrown into dispute. Challengers to hegemonic
    notions of Bitcoin are DDOSed (DDOS stands for ‘distributed denial of service’)
    into submission at what seems to be the will of personal politics, which then
    contribute to the consternation of the network.


    Recent scholarly work shows evidence of Bitcoin’s personal enterprise. According
    to Hileman and Rauchs’s (2017) work out of the Cambridge Centre for Alternative
    Finance, a majority of the Bitcoin hashing emanates from clustered processors
    occupying space together in mining facilities, while many of the firms involved
    are working through vertical and horizontal integration of Bitcoin practice to
    solidify their place in the market. These typical capitalist monopoly-seeking
    behaviours are prima facie unsurprising but also present an antithetical narrative
    to the Bitcoin ethos and cryptocurrencies’ libertarian ideals. Considered from
    a positivistic perspective, we can see the rush on Bitcoin is empirically unsustainable.
    The energy requirements taken by Bitcoin activities are growing at such a rate
    that they signal their own unsustainable bubble (de Vries 2018), where accelerating
    energy consumption needs are related to but distinct from Bitcoin’s price. Mining
    bitcoins is now an enterprise that requires megawatts. This megawatt mining bends
    Bitcoin’s arc back to a literal centralisation of literal power creation and distribution,
    with seemingly little irony to Winner’s (1980) differentiation between the politics
    of centralised nuclear power and distributed solar power capacities. The technologies
    enabling blockchain’s continuation require high degrees of hierarchical structure.'
