  md: 'that''s required to make it work. The central bank must be trusted not to debase
    the currency, but the history of fiat currencies is full of breaches of that trust”
    (Nakamoto 2008). Proponents of Bitcoin and other cryptocurrencies commonly aver
    that the modern monetary system is inherently prone to structural inflation and
    repeated crises due to its _centralization_. Bitcoin and its distributed blockchain
    ledger were therefore hailed by cyberlibertarians as a revolution in monetary
    decentralization – one that takes the supply, distribution, and exchange of money
    out of the hands of any single individual or institution. Cryptocurrencies like
    Bitcoin thus represent the culmination of _laissez-faire_ so feted by neoliberal
    ideologues and libertarians alike, but that was a practical impossibility until
    now.


    How is Bitcoin argued to accomplish this feat in monetary decentralization and
    _laissez-faire_ (anti-)governance? First, the supply of Bitcoin is permanently
    limited to 21 million tokens, which mimics a commodity money minted in non-renewable
    precious metals such as gold. Bitcoin thus embodies in its very architecture the
    idealization of the gold standard often found among far-right monetarists opposing
    fiat currency. This likeness to precious metal coinage is underscored by Bitcoin’s
    irreplaceability: if bitcoins are lost (for example, by forgetting one’s wallet
    password or destroying a hard-drive that contains only copy of a bitcoin wallet’s
    secret keys), they can never be retrieved.


    Second, Bitcoin’s proof-of-work algorithm – in which miners compete for new bitcoins
    by solving a cryptographic problem required to append the next block of transactions
    to the blockchain – adjusts itself according to the overall computing power or
    ‘hashrate’ of the Bitcoin network so that additional bitcoins are released at
    a steady and predictable rate. Bitcoin is a deflationary currency by design, and
    the rate of this deflation is intended to proceed in a stable manner over time.
    Insofar as Bitcoin’s supply schedule is indifferent to miners’ inherent incentives
    to compete for bitcoins by increasing their processing power, Bitcoin surpasses
    even the rarest of precious metals in its rigid deflationary tendencies. In short,
    the supply of Bitcoin can neither be accelerated nor debased.


    Third, since Bitcoin and most other cryptocurrencies are supplied and distributed
    by a decentralized network of users, no individual or organization can, in theory,
    monopolize the currency and take on the role that the state or central bank occupies
    under typical fiat currency regimes. For Bitcoin in particular, the highly competitive
    proof-of-work algorithm creates an incentive structure that ideally guards against
    the possibility of malicious forks in the blockchain, since an attacker would
    have to amass over 50 percent of the computing power of the entire Bitcoin network
    before they could alter the transaction blocks to their advantage. This is highly
    unlikely for any single Bitcoin miner to achieve, given the astronomical costs.


    However, have cyberlibertarian claims about Bitcoin’s revolution in monetary decentralization
    and _laissez-faire_ governance borne out over the past decade of its existence?
