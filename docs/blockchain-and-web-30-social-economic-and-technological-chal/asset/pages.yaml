  md: 'mixed results as to where our feet are placed in the sand of our communica­tion-life
    floor. The adoption of cryptocurrencies and associated technologies has been hampered
    reputationally by a history potholed with disputes, divergence, hacks, and scams
    within the community. Consequently, the emphasis within public discourse and within
    the community over the past five years has shifted from Bitcoin to blockchain.
    This shift in focus reflects the movement of efforts from a vision of social change
    and the rise of peer-to-peer payments to the possible applications of an ‘immutable’
    ledger based upon novel technologies accounting for trust (Nelms et al. 2018).
    Meanwhile, the rise of investment speculation into cryptocurrencies has shifted
    attention away from social adop­tion and the possibility of financial inclusion
    to value volatility, centralisation, and questions of legitimacy. Yet the signal
    continues. The last five years have also seen cryptocurrencies move to a wider
    range of applications. The technical wicked problems involved include scalability,
    speed of transactions, frictionless transfer across national borders, and the
    cap on the number of coins that can be generated as a way to create value through
    supply scarcity. These technologi­cal challenges drive innovators and a start-up
    ecosystem of fintech companies linked to crypto-cyberlibertarian ideals with high
    levels of variability.


    We have demonstrated that radical turns in technological innovation con­front
    sociotechnical practices of adoption and, as their ideological tide washes away,
    they turn back towards integrated structures of political economy over time. Perhaps
    one way of seeing beyond the arc of an established media frame of expansion and
    contraction is to view its aftermath. Within this chapter we have considered that
    the normative curve of social adoption of new media such as blockchain parallels
    the structural tensions towards expansion and con­traction. We have argued that
    in the aftermath of contraction, the culture of socio-technological appropriation
    transforms the latent potentials of existing technologies. We have also argued
    that the emergence of ‘human programming’ is an encoded vulnerability within Web
    3.0 media. Digital tokens don’t die, they just evolve to be increasingly transactionally
    irrelevant yet socially expository.


