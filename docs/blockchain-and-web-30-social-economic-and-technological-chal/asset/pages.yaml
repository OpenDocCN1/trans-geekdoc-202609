  img_proc: true
- pgno: 153
  md: "Before concluding, and to provide a further perspective on notions of disruption\
    \ and creative destruction, I shall briefly turn to the development in European\
    \ and American critical perspectives known as ‘accelerationism’. In what is now\
    \ often regarded is the ‘Urttext’ of accelerationist thought, the passage titled\
    \ ‘The Civilised Capitalist Machine’ in Anti-Oedipus, Deleuze and Guattari lay\
    \ out the fundamental axiom that has gone on to inform a set of accelerationist\
    \ trajectories that continue to be played out in both academic and online debate,\
    \ most notably found within the context of the differentiation of the left, right\
    \ and ‘unconditional’ strains of accelerationism.² Deleuze and Guattari’s aim\
    \ in Anti-Oedipus was to produce a new critique of capitalism, one that was outside\
    \ of traditional post-Marxist frameworks, and which began to formulate a way of\
    \ seeing beyond capitalism by establishing a connection with desire. In thinking\
    \ about what kind of ‘revolutionary path’ could lead out of the impasses they\
    \ saw in capitalism, Deleuze and Guattari suggested that we should not ‘withdraw\
    \ from the process [of capitalism] but to go further, to “accelerate the process”’\
    \ (Deleuze and Guattari, 1972: 162), which, in Schumpeterian terms, would suggest\
    \ that we should help capitalism to reach its self-driven collapse more rapidly\
    \ and thus find ourselves in a more acceptable socio-economic environment (which\
    \ for Schumpeter would be socialism).\n\nThe theorist Mark Fisher updated Deleuze\
    \ and Guattari’s ideas in the conference presentation Terminator vs Avatar, claiming\
    \ that ‘accelerationism can function as an anti-capitalist strategy’:\n\n> [Capitalism],\
    \ dominated by quasi-monopolies such as Microsoft and Walmart, is an anti-market.\
    \ Bill Gates promises business at the speed of thought, but what capitalism delivers\
    \ is thought at the speed of business. A simulation of innovation and newness\
    \ that cloaks inertia and stasis.\n> \n> (Fisher, 2012: 345)\n\nThere is a clear\
    \ tension between Fisher’s appraisal of advanced capitalism and Schumpeter’s –\
    \ and latterly Thiel’s – rationalisation for the way in which monopolies are not\
    \ only the most financially lucrative commercial model but are also the best of\
    \ sustaining innovation and development. Indeed, for Thiel, ‘to the economist,\
    \ every monopoly looks the same’, whereas in his view, a monopoly is ‘the kind\
    \ of company that’s so good at what it does that no other firm can offer a close\
    \ substitute’ (Thiel, 2014: 24–25). Whilst the likes of Thiel and the accelerationist\
    \ left clearly inhabit different ends of an economic and ideological spectrum,\
    \ to a degree, Steemit and Creative Passport capture aspects of both positions.\
    \ Each is an expression of the idea that systemic innovations are required in\
    \ order to make online music markets more equitable, and at the same time they\
    \ are both acknowledgments that non-market networks are now the history rather\
    \ than the future of the web."
