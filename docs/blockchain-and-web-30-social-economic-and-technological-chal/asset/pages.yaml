  md: '# Privacy with Ethereum smart contracts


    # Duarte Teles and Isabel Azevedo


    # Introduction


    Data privacy has been an important issue over the last few decades. Several big
    corporations have been known for mishandling and misusing data collected from
    individuals. User privacy must be ensured in software applications, which was
    reinforced by the approval of the European Union’s General Data Protection Regulation.
    Compliance with the GDPR is mandatory: penalties range from a minimum of 10 million
    Euros or 2 percent annual turnover (whichever is higher) to 20 million Euros or
    4 percent annual turnover (whichever is higher) (European Union, 2016).


    In 1996, computer scientist and cryptographer Nick Szabo first conceived the idea
    of smart contracts (Szabo, 1996). Generally, these are self-enforcing agreements
    (like real-world contracts), although expressed in computer code that, when executed,
    dictates the terms and conditions of the contract, without any of the parties
    involved trusting each other. Currently, they can be stored on a blockchain; thus,
    they inherit the characteristic properties of a blockchain: immutable, public
    and decentralized. Smart contracts, once created and deployed, cannot be further
    altered or tampered with. The overall process for creating them must involve careful
    design, testing and execution, or multiple unpatchable bugs and errors will potentially
    be explored by attackers at some point in the future. For example, the Decentralized
    Autonomous Organization (DAO) (Falkon, 2017) and Parity hacks (Parity Technologies,
    2017; Petrov, 2017) resulted in millions of US dollars in stolen funds.


    Two of the most well-known blockchains are Bitcoin (Bitcoin Project, 2018) and
    Ethereum (Ethereum Foundation, 2018). The former was created by an unknown person
    under the pseudonym of Satoshi Nakamoto, who pioneered the concept of digital
    currency enforced by cryptography with the aim of solving the double spending
    problem. The latter is currently the biggest blockchain to support smart contracts,
    which was specifically designed and created with an extended execution model for
    smart contracts (Ethereum Foundation, 2014). Ethereum also supports the development
    of decentralized applications (DApps), which embrace its smart contracts and properties.'
