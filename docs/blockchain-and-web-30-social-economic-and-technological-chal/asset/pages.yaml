    # GDPR compliance guideline for Ethereum DApps


    As already discussed, GDPR compliance poses a significant challenge for decentralized
    applications. The fines for noncompliance are astronomically high, which ensures
    organizations are committed to obeying it. In this section, the authors provide
    a simple guideline to comply, in the best manner possible, with this regulation,
    despite key issues regarding the design of blockchains (including Ethereum) such
    as immutability:


    +   1 Identify the lawful basis for processing personal data. Most of them give
    individuals the right to erasure, which by default is incompatible with the immutable
