  md: 'in late 2017 and early 2018. Many attendees viewed meetups as opportunities
    to gain relevant information and contacts towards making educated investment decisions.
    Other participants who have already invested in cryptocurrencies and other blockchain-based
    products attended meetups to acquire and share more advanced knowledge. For instance,
    during the introductions at a Blockchain from Women''s Perspectives meetup, one
    participant, who runs a successful online business, commented that she had encouraged
    her husband to invest in cryptocurrency one year prior. When he disagreed, they
    did not invest because he managed their investments. Bitcoin''s value increased
    dramatically since then. She did not want to miss out on future investment opportunities,
    so now she was being proactive and investigating how to invest on her own. Her
    participation at this event was therefore her way to educate herself and subsequently
    initiate investment proceedings.


    Women-focused events subvert the norm to showcase women''s diverse expertise.
    Meetups specifically for women allow women to have conversations that do not center
    around gender. To illustrate, the first “Women on the Block Diversity Blockchain
    Conference” took place in New York City, with over 50 female blockchain experts
    who spoke on raising capital, creating startups, and legal issues, with proceeds
    going toward a charitable fund to support women and girls in technology (Women
    on the Block, 2018). At a gathering like this, there was no need for a panel on
    ‘women in blockchain’. In our own observations, we noticed women at such meetups
    exchanging personal stories, business cards, and professional insights. Many of
    these events also allowed space for hearing about the attendees’ interests in
    terms of which topics should be covered, with presenters then tailoring the conversation
    towards those topics. The Women in Male Dominated Industries meetup was entirely
    participant-driven, in that the attendees determined the topics, parameters, and
    pace of the conversations. The facilitator''s only direction was to periodically
    remind participants to change seats regularly to interact with different people.
    The women-focused events were inherently agentic and encouraged women''s participation.


    # Conclusion


    Through our fieldwork, it is clear that women are cognizant of the gendered disparities
    in technology and finance. Both organizers and participants viewed blockchain
    meetups as sites for learning more about the technology and achieving personal
    and career goals. We found that women are indeed influencing blockchain development,
    just as blockchain is shaping women''s experiences of technology and finance despite
    lower representation. We also found that women have enthusiastically created many
    of these meetups in response to the need for accessible, supportive, educational
    social networks for women to participate in the blockchain milieu. Blockchain
    is at the very early stages of diffusion and innovation. Those involved in all
    the various techno-social practices surrounding blockchain at the present will
    shape where it goes, how'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'it develops, and how it is used. It is therefore vital to interrogate the role
    of women in this phase of blockchain development.


    Our research of local blockchain meetups has shown the importance of the role
    of discourse in the development of new technologies. Much of the existing research
    on women in technology focuses on workplaces or industries and the trends or specific
    policies that affect gender disparity. Blockchain is an emerging, decentralized
    technology that is diffusing in a decentralized, organic way. This technology
    poses new challenges for scholars but has great potential for future research,
    development, and innovation. Technofeminism highlights the fact that each of these
    social dynamics are both influencing and being modified by our relationship to
    technologies. Technologies enable or constrain individuals differently based on
    aspects of identity. These meetups show the social side of blockchain technologies
    and help illustrate some of the ways in which women are making their voices heard
    in a space that historically excludes them. Through our research on the local
    Vancouver blockchain community, it is clear to us that blockchain''s gender problem
    persists. However, it is also clear that women, whether from a technological or
    financial background or with no blockchain experience at all, are interested in
    gaining access to the potential benefits blockchain offers.


    Blockchain proponents claim a positive vision of decentralization and democratization,
    with the potential to improve the lives of women. In these early days it is hard
    to tell whether the technology will in fact evolve this way. The active players
    in the blockchain community now are those who ideas will shape blockchain as it
    develops. At several of the meetups we observed, attendees and presenters noted
    the gender discrepancy in blockchain, an element that detracts from proponents''
    claims of decentralization. Meetups reflect that blockchain holds great promise
    of opportunity, even amidst the challenges and volatility of an emerging technology.
    Through conversations at events like the ones we attended, women are actively
    shaping the blockchain space. Through meetups, these women are working to educate
    themselves and others about the technology and innovate solutions to myriad problems
    using the technology and their own social connections. What blockchain developers
    build on the platform is more important than the technology itself. Similarly,
    without a diversity of voices proactively shaping the technology, blockchain is
    in danger of re-inscribing the existing power structures it purports to dismantle.
    Meetups for women in blockchain are one example of how a small yet proliferating
    movement can shape the course of a new technology in the making.


