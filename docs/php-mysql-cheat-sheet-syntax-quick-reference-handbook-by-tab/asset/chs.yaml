  \ new MyClass();\necho $obj1->sum(10, ); // 调用 __call()\n$obj2 = new MyClass();\n\
  echo $obj2->sum(20,30); // 调用 __call()\n?>\n// 输出: 10 50\n```\n\n---\n\n### 覆盖 语法:\n\
  \n```php\nclass BaseClass{function myFun(){}}\nclass DerivedClass extends BaseClass{function\
  \ myFun(){}}\n```\n\n// 基类的方法和派生类的方法拥有相同的名称和参数，它们会被调用。\n// 覆盖意味着派生类的方法覆盖了基类的方法。\n\
  \n例如：\n\n```php\n<?php\nclass Class1{\npublic function show(){ // 基类的方法\nreturn\
  \ ' Class1 Information ';\n}\nclass Class2 extends Class1{\npublic function show(){\
