  \ 输出: `The key of the current position is: 0`\n\n### `krsort()` 语法\n```php\nkrsort($array)\n\
  ```\n// 按降序排序关联数组的键\n\ne.g.\n```php\n$score=array(\"Rosy\"=>\"90\",\"Andy\"=>\"\
