  \ |\n| `update TableName set field1 = value1, field2 = value2 where field = value;`\
  \ | 更新字段 |\n| `update TableName set FieldName = value;` | 更新字段中所有记录的数据 |\n| `update\
  \ TableName set FieldName = value; where condition;` | 更新字段中特定记录的数据 |\n\n---\n*由\
