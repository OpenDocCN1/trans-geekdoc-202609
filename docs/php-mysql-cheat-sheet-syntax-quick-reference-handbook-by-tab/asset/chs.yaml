  \n<!-- comment --> 语法：\n```html\n<!-- html comment -->\n```\n`<!--` 和 `-->` 用于 HTML\
  \ 注释。\n\n-------------------------------------------------------------------------------\n\
  \n`call()` 语法：\n```php\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n`call()`\
  \ 函数用于调用对象上的方法。\n\n-------------------------------------------------------------------------------\n\
  \n`call_static()` 语法：\n```php\nfunction call_static($arg) {}\n```\n`call_static()`\
  \ 函数用于静态上下文。\n\n-------------------------------------------------------------------------------\n\
  \n`__construct()` 语法：\n```php\nfunction __construct($arg) {}\n```\n`__construct()`\
  \ 方法用于初始化类变量。\n\n-------------------------------------------------------------------------------\n\
  \n`__destruct()` 语法：\n```php\nfunction __destruct() {}\n```\n`__destruct()` 方法释放资源。它在对象销毁或程序停止时被调用。\n\
  \n-------------------------------------------------------------------------------\n\
  \n`$_COOKIE` 语法：\n```php\nsetcookie(\"name\", \"value\");\n$mycolor = $_COOKIE[\"\
  name\"];\n```\n`setcookie()` 函数用于设置 Cookie 名称和值。\n`$_COOKIE` 用于通过 Cookie 名称获取值。\n\
  \n示例：\n```php\n<!-- aFile.php -->\n<?php\n// 在 aFile.php\nsetcookie(\"color\", \"\
  blue\"); // 设置 cookie\n// cookie 名称为 \"color\"，值为 \"blue\"\nheader(\"location: bFile.php\"\
  ); // 重定向到 bFile.php\n?>\n```\n将此文件保存为 \"aFile.php\" 并放在工作目录下。\n\n```php\n<!-- bFile.php\
  \ -->\n<?php\n// 在 bFile.php\n$mycolor = $_COOKIE[\"color\"]; // 从 aFile.php 获取\
  \ cookie\n// 获取名为 \"color\" 的 cookie\necho $mycolor; // 显示颜色的值\n?>\n```\n\n\n\n\n\
  \n```php\n<!-- 将文件保存为 \"bFile.php\" 并放在工作目录 -->\n<!-- 请运行 aFile.php -->\n// 输出:\
  \ blue\n```\n\n## $_ENV 语法\n\n```php\n$_ENV[\"VARIABLE\"]\n```\n// 包含环境变量的信息。\n\n\
  例如：\n```php\n$_ENV[\"USER\"] = \"Ray Yao\";\necho 'The username is: ' .$_ENV[\"\
  USER\"];\n// 输出:\n// The username: Ray Yao\n```\n\n---\n\n## $_FILES 语法\n\n```php\n\
  $_FILES['file']['name']  // 上传的文件名。\n$_FILES['file']['type']  // 文件的 MIME 类型。\n\
  $_FILES['file']['size']  // 上传文件的字节大小（byte）。\n$_FILES['file']['tmp_name']  // 服务器上的临时文件名。\n\
  $_FILES['file']['error']  // 上传文件的错误信息。\n```\n\n例如 // 假设我们上传了一个名为 \"myFile.txt\"\
  \ 的文件\n\n```html\n<form action=\"\" method=\"post\" enctype=\"multipart/form-data\"\
  >\n<input type=\"file\" name=\"file\">\n<input type =\"submit\" value=\"Submit\"\
  >\n</form>\n```\n\n```php\n<?php\necho \"File Name: \" . $_FILES['file']['name'].\"\
  <br>\";\necho \"File Type : \" . $_FILES['file']['type'].\"<br>\";\necho \"File\
  \ Size : \" . $_FILES['file']['size'].\"<br>\";\necho \"Temp Name: \" . $_FILES['file']['tmp_name'].\"\
  <br>\";\necho \"Error Info: \" . $_FILES['file']['error']. \"<br>\";\n?>\n```\n\
  // 输出：\n![](img/image_rsrc70N.jpg)\nFile Name: myFile.txt\nFile Type : text/plain\n\
  File Size : 279\nTemp Name: C:\\Windows\\Temp\\php5167.tmp\nError Info: 0\n\n---\n\
  \n## $_GET 语法\n\n```php\n$myData=$_GET[ data ];\n```\n// 从 HTML 表单获取数据并将其赋值给 `$myData`。\n\
  \n例如：\n```html\n<html>\n<form action=\" \" method=\"get\">\n<input type=\"text\"\
  \ name=\"data\">\n<!-- 输入的值将存储在 \"data\" 中 -->\n<!-- \"data\" 将传递到 PHP 文件进行处理。 -->\n\
  </form>\n```\n\n```php\n<?php // 假设我们在文本框中输入了 \"Hello, World!\"\n$myData = $_GET[\
  \ data ];\n// $_GET[ data ] 从 html 表单获取 \"data\" 的值\necho (\"You have inputted:\
  \ \".$myData);\n?>\n</html>\n```\n// 输出：\n| Hello, World! | --- | You have inputted:\
  \ Hello, World!\n\n---\n\n## $_POST 语法\n\n```php\n$myData=$_POST[ data ];\n```\n\
  // 从 HTML 表单提交数据并将其值赋值给 `$myData`。\n\n例如：\n```html\n<html>\n<form action=\" \" method=\"\
  post\">\n<input type=\"text\" name=\"data\">\n<!-- 输入的值将存储在 \"data\" 中 -->\n<!--\
  \ \"data\" 将传递到 PHP 文件进行处理。 -->\n</form>\n```\n\n```php\n<?php // 假设我们在文本框中输入了 \"\
  Hello, World!\"\n$myData = $_POST[ data ];\n// $_POST[ data ] 从 html 表单提交 \"data\"\
  \ 值\necho (\"You have inputted: \".$myData);\n?>\n</html>\n```\n// 输出：\n| Hello,\
  \ World! | --- | You have inputted: Hello, World!\n\n---\n\n## $_REQUEST 语法\n\n\
  ```php\n$myData=$_REQUEST[data];\n```\n// 从 HTML 表单获取数据并将其值赋值给 `$myData`。\n\n例如：\n\
  ```html\n<html>\n<form action=\" \" method=\"request\">\n<input type=\"text\" name=\"\
  data\">\n<!-- 输入的值将存储在 \"data\" 中 -->\n<!-- \"data\" 将传递到 PHP 文件进行处理。 -->\n</form>\n\
  ```\n\n```php\n<?php // 假设我们在文本框中输入了 \"Hello, World!\"\n$myData = $_REQUEST[data];\n\
  // $_REQUEST[data] 从 html 表单获取 \"data\" 值\necho (\"You have inputted: \".$myData);\n\
  ?>\n</html>\n```\n// 输出：\n| Hello, World! | --- | Hello, World!\n\n---\n\n## $_SERVER\
  \ 语法\n\n```php\n$_SERVER[\"HTTP_AGENT\"];\n```\n// 返回关于访问者的浏览器信息。\n\n例如：\n```php\n\
  $browser = $_SERVER[\"HTTP_AGENT\"];\necho \"$browser\";\n```\n// 输出：Mozilla/4.0\
  \ (compatible; MSIE 8.0)…\n\n---\n\n### $_SERVER[\"REQUEST_METHOD\"] 语法\n\n```php\n\
  $_SERVER[\"REQUEST_METHOD\"]\n```\n// 获取请求方法\n\n例如：\n```php\n<?php\n$name = \"\"\
  ;\nif ($_SERVER[\"REQUEST_METHOD\"]==\"POST\"){\n    // 检查表单是否提交\n    $name = $_SERVER[\"\
  REQUEST_METHOD\"];\n}\n?>\n<form method=\"post\" action=\"\">\nName: <input type=\"\
  text\" name=\"name\">\n</form>\n<?php echo $name; ?>\n```\n// 输出：POST\n\n---\n\n\
  ## $_SESSION 语法\n\n```php\n$_SESSION[\"name\"] = value; // 设置 name\n$_SESSION[\"\
  name\"]; // 获取 value\n```\n\n例如：\n1.\n```php\n<?php\nsession_start();\n$_SESSION[\"\
  color\"] = \"green\"; // 设置 color 为 green\nheader(\"location: bFile.php\");\n?>\n\
  ```\n// 保存此文件为 bFile.php\n\n2.\n```php\n<?php\nsession_start();\n$carColor = $_SESSION[\"\
  color\"]; // 获取 color 的值\necho $carColor;\n?>\n```\n// 保存此文件为 bFile.php\n// 输出：green\n\
  \n---\n\n### $_SERVER['PHP_SELF'] 语法\n\n```php\n$_SERVER['PHP_SELF']\n```\n// 将表单数据发送到当前页面。\n\
  \n例如：\n```html\n<html>\n<form action=\"<?php echo($_PHP_SELF);?>\" method=\"post\"\
  >\nName: <input type=\"text\" name=\"name\">\n<input type=\"submit\" value=\"Submit\"\
  >\n</form>\n<?php echo $_POST[\"name\"]; ?><br>\n</html>\n```\n// 输出：\n![](img/image_rsrc70R.jpg)\n\
  \n---\n\n### $GLOBALS 语法\n\n```php\n$GLOBALS['variable']\n```\n`GLOBALS` 是 PHP 超全局变量，在所有作用域内均可访问\n\
  \n例如：\n```php\n<?php\n$a = 100; $b = 200;\nfunction fun() {\n    $c = $GLOBALS['a']\
  \ + $GLOBALS['b'];\n}\nfun();\necho $c;\n?>\n```\n// 输出：300\n\n---\n\n### $PHP_SELF\
  \ 语法\n\n```php\naction echo($PHP_SELF)\n```\n// 将表单数据发送到当前页面而不是另一个页面。\n\n例如：\n```html\n\
  <html>\n<form action=\"<?php echo($PHP_SELF);?>\" method=\"post\">\nName: <input\
  \ type=\"text\" name=\"name\">\n<input type=\"submit\" value=\"Submit\">\n</form>\n\
  <?php echo $_POST[\"name\"]; ?><br>\n</html>\n```\n// 输出：\n![](img/image_rsrc70R.jpg)\n\
  \n---\n\n## $this 语法\n\n```php\n$this->property;\n```\n`$this->property;` 用于访问当前类中的属性。\n\
  `$this` 代表当前对象。\n注意：在 `$this->property` 中属性没有 `$` 符号\n\n例如：\n```php\n<?php\nclass\
  \ ThisDemo{\n    var $t = \"$this example\";\n    function myFun() {\n        echo\
  \ $this->t; // $this 代表 $obj\n    }\n}\n$obj= new ThisDemo(); // 创建一个对象\n$obj->myFun();\
  \ // $obj 引用 myFun()\n?>\n```\n// 输出：$this example\n\n---\n\n### => 语法\n\n```php\n\
  array( key1=>value1, key2=>value2, key3=>value3…);\n```\n`=>` 符号用于连接键和值。\n在数组中，键和索引的意思相同。\n\
  \n例如：\n```php\n<?php\n$book=array( \"A\"=>\"JSP\", \"B\"=>\"ASP\", \"C\"=>\"PHP\"\
  );\n// \"A, B, C\" 是键，\"JSP, ASP, PHP\" 是值。\necho $book[\"C\"]; // 显示键 \"C\" 中的元素值\n\
  ?>\n```\n// 输出：PHP\n\n---\n\n### == 语法\n\n```php\nvalue1 == value2\n```\n// 比较两个值，但不比较两个值的类型\n\
  \n例如：\n```php\nif(9 == \"9\"){ echo 'equal'; }\nelse{ echo 'not equal'; }\n```\n\
  // 输出：equal\n\n\n\n\n\n## `===` 语法\n\n```php\nvalue1 === value2\n```\n比较两个值，并比较两个值的类型。\n\
  \n例如：\n```php\nif(9 === \"9\"){echo 'equal';}\nelse{ echo 'not equal';}\n// 输出:\
  \ not equal\n```\n\n## `++$var` 和 `$var++` 语法\n\n```php\n++$var  // $var 加 1，并返回\
  \ $var\n$var++  // 返回 $var，然后 $var 再加 1\n```\n例如：\n```php\n$x=100; echo ++$x;  \
  \   // 输出: 101\n$y=100; echo $y++;     // 输出: 100\n```\n\n## `--$var` 和 `$var--`\
  \ 语法\n\n```php\n--$var  // $var 减 1，并返回 $var\n$var--  // 返回 $var，然后 $var 减 1\n```\n\
  例如：\n```php\n$x=100; echo --$x;     // 输出: 99\n$y=100; echo $y--;     // 输出: 100\n\
  ```\n\n## `? :` 运算符语法\n\n```php\n(test-expression) ? (if-true-do-this) : (if-false-do-this);\n\
  ```\n条件运算符检查 `test-expression` 是否为真或假，然后根据真假结果执行指定的代码块。\n\n例如：\n```php\n$a = 100;\
  \ $b = 200;\n$result = ($a<$b) ? \"apple \" : \"banana \";\n// (检查 $a<$b 是否为真) ?\
  \ (如果为真执行此操作) : (如果为假则执行此操作);\necho (\"$result<br>\");\n// 输出: apple\n```\n\n##\
  \ `<=>` 语法\n\n```php\n$c = $a <=> $b;\n```\n如果 `$a > $b`，则 `$c` 的值为 1。\n如果 `$a ==\
  \ $b`，则 `$c` 的值为 0。\n如果 `$a < $b`，则 `$c` 的值为 -1。\n\n例如：\n```php\necho 10 <=> 10;\
  \     // 0\necho 3.14 <=> 3.10;     // 1\necho \"ant\" <=> \"bee\";     // -1\n\
  ```\n\n## `__class__` 语法\n\n```php\n__class__\n```\n返回当前的类名。\n\n例如：\n```php\n<?php\n\
  class MyClass {\n    function myFun() {\n        echo 'The current class name is\
  \ ' . __class__ ;      \n    }\n}\n$obj = new MyClass();\n$obj->myFun();\n?>\n//\
  \ 输出: The current class name is MyClass\n```\n\n## `__dir__` 语法\n\n```php\n__dir__\n\
  ```\n返回当前文件的目录。\n\n例如：\n```php\necho 'The directory of current file is ' . __dir__\
  \ ;\n// 输出: The directory of current file is C:\\www\n```\n\n## `__file__` 语法\n\n\
  ```php\n__file__\n```\n返回当前文件的路径和名称。\n\n例如：\n```php\necho 'The file path and name\
  \ are ' . __file__ ;\n// 输出: The file path and name are C:\\www\\myFile.php\n```\n\
  \n## `__function__` 语法\n\n```php\n__function__\n```\n返回当前的函数名。\n\n例如：\n```php\n\
  <?php\nfunction myFun() {\n    echo 'The function name is ' . __function__ ;\n}\n\
  myFun();\n?>\n// 输出: The function name is myFun\n```\n\n## `__line__` 语法\n\n```php\n\
  __line__\n```\n返回文件中的当前行号。\n\n例如：\n```php\necho 'The line number is ' . __line__\
  \ ;\n// 输出: The line number is 2.\n```\n\n## `__method__` 语法\n\n```php\n__method__\n\
  ```\n返回类方法名。\n\n例如：\n```php\nfunction myFun() {\n    echo 'The function name is\
  \ ' . __method__ ;\n}\nmyFun();\n// 输出: The function name is myFun\n```\n\n## `__namespace__`\
  \ 语法\n\n```php\n__namespace__\n```\n返回命名空间的名称。\n\n例如：\n```php\nnamespace MyNamespace;\n\
  echo 'The namespace is ', __namespace__;\n// 输出: The namespace is MyNamespace.\n\
  ```\n\n## `__trait__` 语法\n\n```php\n__trait__\n```\n返回 trait 的名称。`trait` 用于定义可以在多个类中使用的方法。`trait`\
