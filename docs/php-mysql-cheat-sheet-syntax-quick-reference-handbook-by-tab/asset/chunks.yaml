    # Syntax Chart


    -------------------------------------------------------------------------------


    <!-- comment --> syntax:

    ```html

    <!-- html comment -->

    ```

    The `<!--` and `-->` are used for HTML comments.


    -------------------------------------------------------------------------------


    `call()` syntax:

    ```php

    if (condVar > someVal) {console.log("xxx")}

    ```

    The `call()` function is used to call methods on an object.


    -------------------------------------------------------------------------------


    `call_static()` syntax:

    ```php

    function call_static($arg) {}

    ```

    The `call_static()` function is used in a static context.


    -------------------------------------------------------------------------------


    `__construct()` syntax:

    ```php

    function __construct($arg) {}

    ```

    The `__construct()` method is used to initialize the class variables.


    -------------------------------------------------------------------------------


    `__destruct()` syntax:

    ```php

    function __destruct() {}

    ```

    The `__destruct()` method releases resources. It is called when the object is
    destroyed or the program is stopped.


    -------------------------------------------------------------------------------


    `$_COOKIE` syntax:

    ```php

    setcookie("name", "value");

    $mycolor = $_COOKIE["name"];

    ```

    The `setcookie()` function is used to set a cookie name and value.

    `$_COOKIE` is used to get the cookie value by cookie name.


    Example:

    ```php

    <!-- aFile.php -->

    <?php

    // in aFile.php

    setcookie("color", "blue"); // set a cookie

    // cookie name is "color", cookie value is "blue"

    header("location: bFile.php"); // redirect to bFile.php

    ?>

    ```

    Save this file with the name "aFile.php" in the working folder.


    ```php

    <!-- bFile.php -->

    <?php

    // in bFile.php

    $mycolor = $_COOKIE["color"]; // get the cookie from aFile.php

    // get the cookie whose name is "color"

    echo $mycolor; // show the color''s value

    ?>

    ```

