    );\n$diff=array_diff_assoc($array1,$array2);\nprint_r($diff);\n// 输出:   Array([3]\
    \ => d\n```\n\n# array_diff_key() 语法\n\n`array_diff_key($array1,$array2)`\n\n\
    // 比较两个数组的键，返回差异\n\ne.g.\n```php\n$arr1=array(\"0\"=>\"a\",\"1\"=>\"b\",\"2\"\
    =>\"c\",\"3\"=>\"d\");\n$arr2=array(\"0\"=>\"e\",\"1\"=>\"f\",\"2\"=>\"g\");\n\
    $diff=array_diff_key($arr1,$array2);\nprint_r($diff);\n// 输出:   Array([3] => d\n\
    ```\n\n# array_fill() 语法\n\n`array_fill(start, number, value)`\n\n// 用相同的值填充数组。\n\
    // \"start\": 起始索引，“number\": 元素数量\n\ne.g.\n```php\n$arr=array_fill(2,3,\"ok\"\
    );\nprint_r($arr);\n// 输出:   Array([2] => ok [3] => ok [4] => ok)\n```\n\n# array_fill_keys()\
    \ 语法\n\n`array_fill_keys($keys,\"values\")`\n\n// 用指定的键和相同的值填充数组。\n\ne.g.\n```php\n\
    $keys=array(\"1\",\"2\",\"3\");      设置键\n$arr=array_fill_keys($keys,\"ok\");\n\
    print_r($arr);\n// 输出:   Array([1] => ok [2] => ok [3] => ok)\n```\n\n# array_flip()\
    \ 语法\n\n`array_flip($array)`\n\n// 反转数组所有的键和对应的值\n\ne.g.\n```php\n$arr=array(\"\
    1\"=>\"a\",\"2\"=>\"b\",\"3\"=>\"c\");\n$result=array_flip($arr);\nprint_r($result);\n\
    // 输出:   Array([a] => 1 [b] => 2 [c] => 3)\n```\n\n# array_intersect() 语法\n\n\
    `array_intersect($array1,$array2)`\n\n// 比较两个数组的值，返回相同值的数组。\n\ne.g.\n```php\n\
    $arr1=array(\"0\"=>\"a\",\"1\"=>\"b\",\"2\"=>\"c\",\"3\"=>\"d\");\n$arr2=array(\"\
    4\"=>\"a\",\"5\"=>\"b\",\"6\"=>\"c\");\n$result=array_intersect($arr1,$array2);\n\
    print_r($result);\n// 输出:   Array([0] => a [1] => b [2] => c)\n```\n\n# array_intersect_assoc()\
    \ 语法\n\n`array_intersect_assoc($array1,$array2)`\n\n// 比较两个数组的所有键和值，返回相同键和值的数组。\n\
    \ne.g.\n```php\n$arr1=array(\"0\"=>\"a\",\"1\"=>\"b\",\"2\"=>\"c\",\"3\"=>\"d\"\
    );\n$arr2=array(\"0\"=>\"a\",\"1\"=>\"b\",\"2\"=>\"c\");\n$result=array_intersect_assoc($arr1,$array2);\n\
    print_r($result);\n// 输出:   Array([0] => a [1] => b [2] => c)\n```\n\n# array_intersect_key()\
    \ 语法\n\n`array_intersect_key($array1,$array2)`\n\n// 比较两个数组的键，返回相同键的数组。\n\ne.g.\n\
    ```php\n$arr1=array(\"0\"=>\"a\",\"1\"=>\"b\",\"2\"=>\"c\",\"3\"=>\"d\");\n$arr2=array(\"\
    0\"=>\"e\",\"1\"=>\"f\",\"2\"=>\"g\");\n$result=array_intersect_key($arr1,$array2);\n\
    print_r($result);\n// 输出:   Array([0] => a [1] => b [2] => c)\n```\n\n# array_keys()\
    \ 语法\n\n`array_keys($array)`\n\n// 返回数组所有的键。\n\ne.g.\n```php\n$arr=array(\"Alf\"\
    =>\"90\",\"Bob\"=>\"85\",\"Cin\"=>\"92\");\nprint_r(array_keys($arr));\n// 输出:\
    \   Array([0] => Alf [1] => Bob [2] => Cin)\n```\n\n# array_key_exists() 语法\n\n\
    `array_key_exists(\"key\", $array)`\n\n// 如果指定的键存在数组中，则返回 true\n\ne.g.\n```php\n\
    $arr=array(\"Alf\"=>\"90\",\"Bob\"=>\"85\",\"Cin\"=>\"92\");\nif (array_key_exists(\"\
    Bob\",$arr)){\necho \"Bob exists!\";\n}\n// 输出:   Bob exists!\n```\n\n# array_merge()\
    \ 语法\n\n`array_merge( array1, array2 )`\n\n// 合并 array1 和 array2，并创建一个数组。\n\n\
    e.g.\n```php\n$array1=array (\"A\", \"B\", \"C\");\n$array2=array (\"D\", \"E\"\
    , \"F\");\n$array=array_merge( $array1, $array2 );      合并数组\nforeach( $array\
    \ as $value) { echo(\"$value \" );}\n// 输出:   A B C D E F\n```\n\n"
