  trans: "\n\n```php\ndefault :  echo \"Running default code\";  break;  }\n// 输出:\
    \   Running case 20\n```\n\n## text 输入语法\n\n```html\n<input type=\"text\" name=\"\
    data\">\n```\n\n// `input type=\"text\"` 指定输入类型为 `\"text\"`，\n// `name=\"data\"\
    ` 指定了输入的 `\"data\"`，该数据将传递到 PHP 文件进行处理。\n\n例如：\n\n```html\n<html>\n<form action=\"\
    \ \" method=\"post\">\n  Name: <input type=\"text\" name=\"myName\">\n  <input\
    \ type=\"submit\" value=\"Submit\">\n</form>\n<?php echo $_POST[\"myName\"]; ?><br>\n\
    </html>\n```\n\n// 输出：\n![](img/image_rsrc70R.jpg)\n\nRay Yao\n\n## textarea 输入语法\n\
    \n```html\n<textarea name=\"xxx\" rows=\"num\" cols=\"num\">\n```\n\n// `\"textarea\"\
    ` 类型用于在文本区域中输入数据。\n// `\"rows\"` 指定行数。\n// `\"cols\"` 指定列数。\n\n例如：\n\n```html\n\
    <html>\n<form action=\"\" method=\"POST\">\n  <textarea name=\"book\" rows=\"\
    3\" cols=\"20\"></textarea>\n  <p><input type=\"submit\" value=\"Submit\"></p>\n\
    </form>\n</html>\n<?php\n$book = $_POST['book'];\necho \"$book\";\n?>\n```\n\n\
    // 输出：\n![](img/image_rsrc71G.jpg)\n\n8 小时学会 Scala\n\n## time() 语法\n\n```php\n\
    time()\n```\n\n// 返回自 Unix 纪元以来 Unix 时间戳（从 1970 年 1 月 1 日 00:00:00 GMT 到现在的秒数）\n\
    \n例如：\n\n```php\nvar_dump(time());\n```\n\n// 输出: `int(1669305569)`\n\n## trait\
    \ 语法\n\n```php\n<?php trait TraitName{…} ?> // 声明一个 trait\n<?php class MyClass{\
    \ use TraitName; } ?> // 使用该 trait\n```\n\n// `Trait` 用于定义可以在多个类中使用的方法。\n// `Trait`\
    \ 允许程序员在不同的类中复用方法。\n\n例如：\n\n```php\n<?php\ntrait myTrait { // 声明一个 trait\n  \
    \  public function myFun() {\n        echo \"This is a trait sample\";\n    }\n\
    }\n\nclass MyClass {\n    use myTrait; // 使用该 trait\n}\n$obj = new MyClass();\n\
    $obj->myFun();\n?>\n```\n\n// 输出: This is a trait sample\n\n## trigger_error()\
    \ 语法\n\n```php\ntrigger_error(\"message\")\n```\n\n// 触发错误并显示错误消息。\n\n例如：\n\n\
    ```php\n$var = -100;\nif($var<0){trigger_error(\"Variable value must > 0 \");}\n\
    ```\n\n// 输出: Notice: Variable value must > 0 在 `/script.php` 的第 3 行。\n\n## trim()\
    \ 语法\n\n```php\ntrim($str, \"characters\");\n```\n\n// 删除字符串两侧的字符\n`trim($str)`\
    \ // 删除两侧的空白字符\n\n例如：\n\n```php\n$str1 = \"ABC 123\"; \n$str2 = \" Hi, friends!\
    \ \";\necho trim($str1,\"A\"); // 删除 A 和 3\necho trim($str2); // 删除两侧的空格\n```\n\
    \n// 输出: `BC 12`, `Hi, friends!`\n\n## try / throw / catch() 语法\n\n```php\ntry{…}\
    \ // 包含可能引发异常的代码\nthrow new Exception(\"message\"); // 抛出异常\ncatch(Exception $e)\
    \ // 捕获并处理异常\n```\n\n例如：\n\n```php\n<?php\nfunction myFun($num){\n    if($num<0){\n\
    \        throw new Exception(\"The variable must be greater than 1\");\n    }\n\
    \    return true;\n}\ntry{\n    myFun(-100); // 调用函数\n} catch(Exception $e){\n\
    \    echo $e->getMessage(); // 显示异常消息\n}\n?>\n```\n\n// 输出: The variable must\
    \ be greater than 1\n\n## ucfirst 语法\n\n```php\nucfirst(\"string\")\n```\n\n//\
    \ 将字符串的首字母转换为大写。\n\n例如：\n\n```php\necho ucfirst(\"in hours\");\n```\n\n// 输出:\
    \ In hours\n\n## ucwords 语法\n\n```php\nucwords(\"string\")\n```\n\n// 将字符串中每个单词的首字母转换为大写。\n\
    \n例如：\n\n```php\necho ucwords(\"c sheet\");\n```\n\n// 输出: C Sheet\n\n## uniqid\
    \ 语法\n\n```php\nuniqid()\n```\n\n// 根据当前微秒返回唯一的 ID。\n\n例如：\n\n```php\necho uniqid();\n\
    ```\n\n// 输出: `637fc50391e3`\n\n## unlink 语法\n\n```php\nunlink(\"filename\")\n\
    ```\n\n// 删除文件。\n\n例如：\n\n```php\nunlink(\"myFile.txt\");\n```\n\n## unserialize\
    \ 语法\n\n```php\nunserialize($serialized_data)\n```\n\n// 将序列化数据还原为原始值。\n\n例如：\n\
    \n```php\n$var = serialize(array(\"ant\", \"bee\", \"cat\", \"dog\"));\necho $var;\n\
    $arr = unserialize($var);\nprint_r($arr);\n```\n\n// 输出: a:4:{i:0;s:\"ant\";i:1;s:\"\
    bee\";i:2;s:\"cat\";i:3;s:\"dog\";}Array ([0] => ant [1] => bee [2] => cat [3]\
    \ => dog)\n\n## unset 语法\n\n```php\nunset($variable)\n```\n\n// 删除 `$variable`\
    \ 的值。\n\n例如：\n\n```php\n$str = \"Hi, friend!\";\nunset($str);\necho \"After unset,\
    \ the 'str' value is: . $str;\n```\n\n// 输出: After unset, the 'str' value is:\n\
    \n## update table 语法\n\n```php\n$sql=\"update table-name set column-name=value\
    \ where id=int\";\n$query=mysqli_query( $con, $sql);\n```\n\n// `\"update table-name\
    \ set column-name=value where id=int\"` 可以更新表中指定列的值。\n// `$query=mysqli_query($con,\
    \ $sql)` 执行查询。\n// `$con` 是 MySQL 服务器的连接。（参考 `mysqli_connect()`）\n\n例如：\n\n```php\n\
    <?php\n$con= mysqli_connect( \"localhost\", \"root\", \"12345678\" );\nif( $con\
    \ ) { // 如果连接 MySQL 服务器成功\n    echo \" Connect! \";\n}\n$select=mysqli_select_db(\
    \ $con, \"myDB\" );\nif( $select ) { // 如果选择数据库 \"myDB\" 成功\n    echo \" Select\
    \ successfully!<br> \";\n}\n// 假设 myDB 有一个表 \"colortable\"\n$sql=\"update colortable\
    \ set color5='sky' where id =1 \";\n// 将 id 为 1 的 color5 列设置为 'sky'\n$query=mysqli_query(\
    \ $con, $sql); // 运行查询\nif( $query ) {\n    echo \" Update successfully \";\n\
    }\n?>\n```\n\n// 输出: Connect! Select successfully! Update successfully!\n\n##\
    \ update table（高级）\n\n```php\nupdate TableName set field1 = value1, field2 = value2\n\
    where field = value;\n```\n\n// 更新数据库表中字段的值。\n// `\"where field = value\"` 可以选择记录进行更新。\n\
    \n例如：\n\n```php\n// 1. 给定“books”表的当前状态：\nuse library;\nselect * from books;\n\n\
    // 2. 更新指定字段的值：\nupdate books set pages = 200, price = 13.99, publish = 2018\n\
    where title = \"Java\";\n\nupdate books set pages = 190, price = 12.88, publish\
    \ = 2019\nwhere title = \"Ajax\";\n\nselect * from books;\n\n```\n\n// `\"where\
    \ title = \"Java\";` 选择标题为 “Java”的记录来更新三个字段（pages, price, publish）。\n// `\"where\
    \ title = \"Ajax\";` 选择标题为 “Ajax”的记录来更新三个字段（pages, price, publish）。\n\n## urldecode\
    \ 语法\n\n```php\nurldecode(\"encoded_data\")\n```\n\n// 将编码的数据还原为原始数据。\n\n例如：\n\
    \n```php\n$encode_data = urlencode(\"https://www.amazon.com/\");\necho $encode_data.\"\
