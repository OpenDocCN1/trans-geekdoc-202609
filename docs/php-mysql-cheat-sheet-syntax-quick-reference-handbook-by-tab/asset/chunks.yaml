    \ {\n    static $var=10;\n    echo $var++;\n}\nmyFunc();\nmyFunc();\n// Output:\
    \ 1011\n?>\n```\n\n---\n\n## static member syntax\n\n```php\nstatic $variable\
    \ = value;\nstatic function funName()…}\n```\n\n`// The static member can be directly\
    \ called by a class, not by an object.`\n\ne.g.\n\n```php\n<?php\nclass MyClass\
    \ {\n    public static $staticVar = 'I am a static variable';\n    public static\
    \ function staticFun(){\n        echo \"I am a static function\";\n    }\n}\n\
    print MyClass::$staticVar;\nprint MyClass::staticFun();\n?>\n// Output:\n// I\
    \ am a static variable\n// I am a static function\n```\n\n---\n\n## string syntax\n\
    \n```php\n$str = \"characters\";\n$str = 'characters';\n```\n\n`// String consist\
    \ of a series of characters, which are enclosed by double quotes or single quotes.`\n\
    \ne.g.\n\n```php\n$x = \" Hello world! \";\necho $x;\n$y = ' Hi, my friend! ';\n\
    echo $y;\n// Output:  Hello world!  Hi, my friend!\n```\n\n---\n\n## string connecting\
    \ syntax\n\n```php\n$string1 . \" \" . $string2\n```\n\n`// Connect two strings`\n\
    \ne.g.\n\n```php\n$book1 = \"PowerShell\";\n$book2 = \"in 8 Hours\";\necho $book1\
    \ . \" \" . $book2;\n// Output: PowerShell in 8 Hours\n```\n\n---\n\n## stripos()\
    \ syntax\n\n```php\nstripos(string, substring)\n```\n\n`// Return the position\
    \ of the first occurrence of the substring in string.`\n`// stripos() is case\
    \ insensitive.`\n\ne.g.\n\n```php\necho stripos(\"Powershell & Shell Scripting\
    \ in 8 Hours\", \"Shell\");\n// Output: 5\n```\n\n---\n\n## stripslashes() syntax\n\
    \n```php\nstripslashes(\"backslashes\")\n```\n\n`// Remove backslashes \\\\ and\
    \ \\\\\\\\.`\n\ne.g.\n\n```php\necho stripslashes(\"I don\\\\'t know!\");\n//\
    \ Output: I don't know!\n```\n\n---\n\n## stristr() syntax\n\n```php\nstristr(\"\
    string\", \"substring\")\n```\n\n`// Search for the first occurrence of a substring\
    \ and return the rest part.`\n"
