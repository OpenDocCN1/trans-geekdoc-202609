    UTF-8\", \"ISO-8859-1//SLIT\", $str);\n// 输出:\nOriginal : EURO '€'\nTranslated\
    \ : EURO 'EUR'\n```\n\n## if 语句语法\n\n```php\nif ( test-expression ) { // 如果为真执行执行\
    \ }\n// \"if 语句\" 在指定条件为真时执行 { … } 内的代码；如果条件为假，则不执行 {…} 内的任何代码。\n```\n\ne.g.\n\
    \n```php\n$x = 200; $y = 100;\nif ( $x > $y ){ // 如果真，运行后续代码\n    echo \"x 大于\
