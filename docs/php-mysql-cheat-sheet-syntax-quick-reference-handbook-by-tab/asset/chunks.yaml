    # 语法表


    -------------------------------------------------------------------------------


    <!-- comment --> 语法：

    ```html

    <!-- html comment -->

    ```

    `<!--` 和 `-->` 用于 HTML 注释。


    -------------------------------------------------------------------------------


    `call()` 语法：

    ```php

    if (condVar > someVal) {console.log("xxx")}

    ```

    `call()` 函数用于调用对象上的方法。


    -------------------------------------------------------------------------------


    `call_static()` 语法：

    ```php

    function call_static($arg) {}

    ```

    `call_static()` 函数用于静态上下文。


    -------------------------------------------------------------------------------


    `__construct()` 语法：

    ```php

    function __construct($arg) {}

    ```

    `__construct()` 方法用于初始化类变量。


    -------------------------------------------------------------------------------


    `__destruct()` 语法：

    ```php

    function __destruct() {}

    ```

    `__destruct()` 方法释放资源。它在对象销毁或程序停止时被调用。


    -------------------------------------------------------------------------------


    `$_COOKIE` 语法：

    ```php

    setcookie("name", "value");

    $mycolor = $_COOKIE["name"];

    ```

    `setcookie()` 函数用于设置 Cookie 名称和值。

    `$_COOKIE` 用于通过 Cookie 名称获取值。


    示例：

    ```php

    <!-- aFile.php -->

    <?php

    // 在 aFile.php

    setcookie("color", "blue"); // 设置 cookie

    // cookie 名称为 "color"，值为 "blue"

    header("location: bFile.php"); // 重定向到 bFile.php

    ?>

    ```

    将此文件保存为 "aFile.php" 并放在工作目录下。


    ```php

    <!-- bFile.php -->

    <?php

    // 在 bFile.php

    $mycolor = $_COOKIE["color"]; // 从 aFile.php 获取 cookie

    // 获取名为 "color" 的 cookie

    echo $mycolor; // 显示颜色的值

    ?>

    ```


