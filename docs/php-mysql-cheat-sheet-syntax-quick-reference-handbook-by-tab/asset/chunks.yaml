  trans: "\n\n```php\n<!-- 将文件保存为 \"bFile.php\" 并放在工作目录 -->\n<!-- 请运行 aFile.php -->\n\
    // 输出: blue\n```\n\n### $_ENV 语法\n\n```php\n$_ENV[\"VARIABLE\"]\n```\n// 包含环境变量的信息。\n\
    \n例如：\n```php\n$_ENV[\"USER\"] = \"Ray Yao\";\necho 'The username is: ' .$_ENV[\"\
    USER\"];\n// 输出:\n// The username: Ray Yao\n```\n\n---\n\n### $_FILES 语法\n\n```php\n\
    $_FILES['file']['name']  // 上传的文件名。\n$_FILES['file']['type']  // 文件的 MIME 类型。\n\
    $_FILES['file']['size']  // 上传文件的字节大小（byte）。\n$_FILES['file']['tmp_name']  //\
    \ 服务器上的临时文件名。\n$_FILES['file']['error']  // 上传文件的错误信息。\n```\n\n例如 // 假设我们上传了一个名为\
    \ \"myFile.txt\" 的文件\n\n```html\n<form action=\"\" method=\"post\" enctype=\"\
    multipart/form-data\">\n<input type=\"file\" name=\"file\">\n<input type =\"submit\"\
    \ value=\"Submit\">\n</form>\n```\n\n```php\n<?php\necho \"File Name: \" . $_FILES['file']['name'].\"\
    <br>\";\necho \"File Type : \" . $_FILES['file']['type'].\"<br>\";\necho \"File\
    \ Size : \" . $_FILES['file']['size'].\"<br>\";\necho \"Temp Name: \" . $_FILES['file']['tmp_name'].\"\
    <br>\";\necho \"Error Info: \" . $_FILES['file']['error']. \"<br>\";\n?>\n```\n\
    // 输出：\n![](img/image_rsrc70N.jpg)\nFile Name: myFile.txt\nFile Type : text/plain\n\
    File Size : 279\nTemp Name: C:\\Windows\\Temp\\php5167.tmp\nError Info: 0\n\n\
    ---\n\n### $_GET 语法\n\n```php\n$myData=$_GET[ data ];\n```\n// 从 HTML 表单获取数据并将其赋值给\
    \ `$myData`。\n\n例如：\n```html\n<html>\n<form action=\" \" method=\"get\">\n<input\
    \ type=\"text\" name=\"data\">\n<!-- 输入的值将存储在 \"data\" 中 -->\n<!-- \"data\" 将传递到\
    \ PHP 文件进行处理。 -->\n</form>\n```\n\n```php\n<?php // 假设我们在文本框中输入了 \"Hello, World!\"\
    \n$myData = $_GET[ data ];\n// $_GET[ data ] 从 html 表单获取 \"data\" 的值\necho (\"\
    You have inputted: \".$myData);\n?>\n</html>\n```\n// 输出：\n| Hello, World! | ---\
    \ | You have inputted: Hello, World!\n\n---\n\n### $_POST 语法\n\n```php\n$myData=$_POST[\
    \ data ];\n```\n// 从 HTML 表单提交数据并将其值赋值给 `$myData`。\n\n例如：\n```html\n<html>\n<form\
    \ action=\" \" method=\"post\">\n<input type=\"text\" name=\"data\">\n<!-- 输入的值将存储在\
    \ \"data\" 中 -->\n<!-- \"data\" 将传递到 PHP 文件进行处理。 -->\n</form>\n```\n\n```php\n\
    <?php // 假设我们在文本框中输入了 \"Hello, World!\"\n$myData = $_POST[ data ];\n// $_POST[\
    \ data ] 从 html 表单提交 \"data\" 值\necho (\"You have inputted: \".$myData);\n?>\n\
    </html>\n```\n// 输出：\n| Hello, World! | --- | You have inputted: Hello, World!\n\
    \n---\n\n### $_REQUEST 语法\n\n```php\n$myData=$_REQUEST[data];\n```\n// 从 HTML\
    \ 表单获取数据并将其值赋值给 `$myData`。\n\n例如：\n```html\n<html>\n<form action=\" \" method=\"\
    request\">\n<input type=\"text\" name=\"data\">\n<!-- 输入的值将存储在 \"data\" 中 -->\n\
    <!-- \"data\" 将传递到 PHP 文件进行处理。 -->\n</form>\n```\n\n```php\n<?php // 假设我们在文本框中输入了\
    \ \"Hello, World!\"\n$myData = $_REQUEST[data];\n// $_REQUEST[data] 从 html 表单获取\
    \ \"data\" 值\necho (\"You have inputted: \".$myData);\n?>\n</html>\n```\n// 输出：\n\
    | Hello, World! | --- | Hello, World!\n\n---\n\n### $_SERVER 语法\n\n```php\n$_SERVER[\"\
    HTTP_AGENT\"];\n```\n// 返回关于访问者的浏览器信息。\n\n例如：\n```php\n$browser = $_SERVER[\"\
    HTTP_AGENT\"];\necho \"$browser\";\n```\n// 输出：Mozilla/4.0 (compatible; MSIE 8.0)…\n\
    \n---\n\n### $_SERVER[\"REQUEST_METHOD\"] 语法\n\n```php\n$_SERVER[\"REQUEST_METHOD\"\
    ]\n```\n// 获取请求方法\n\n例如：\n```php\n<?php\n$name = \"\";\nif ($_SERVER[\"REQUEST_METHOD\"\
    ]==\"POST\"){\n    // 检查表单是否提交\n    $name = $_SERVER[\"REQUEST_METHOD\"];\n}\n\
    ?>\n<form method=\"post\" action=\"\">\nName: <input type=\"text\" name=\"name\"\
    >\n</form>\n<?php echo $name; ?>\n```\n// 输出：POST\n\n---\n\n### $_SESSION 语法\n\
    \n```php\n$_SESSION[\"name\"] = value; // 设置 name\n$_SESSION[\"name\"]; // 获取\
    \ value\n```\n\n例如：\n1.\n```php\n<?php\nsession_start();\n$_SESSION[\"color\"\
    ] = \"green\"; // 设置 color 为 green\nheader(\"location: bFile.php\");\n?>\n```\n\
    // 保存此文件为 bFile.php\n\n2.\n```php\n<?php\nsession_start();\n$carColor = $_SESSION[\"\
    color\"]; // 获取 color 的值\necho $carColor;\n?>\n```\n// 保存此文件为 bFile.php\n// 输出：green\n\
    \n---\n\n### $_SERVER['PHP_SELF'] 语法\n\n```php\n$_SERVER['PHP_SELF']\n```\n//\
    \ 将表单数据发送到当前页面。\n\n例如：\n```html\n<html>\n<form action=\"<?php echo($_PHP_SELF);?>\"\
    \ method=\"post\">\nName: <input type=\"text\" name=\"name\">\n<input type=\"\
    submit\" value=\"Submit\">\n</form>\n<?php echo $_POST[\"name\"]; ?><br>\n</html>\n\
    ```\n// 输出：\n![](img/image_rsrc70R.jpg)\n\n---\n\n### $GLOBALS 语法\n\n```php\n\
    $GLOBALS['variable']\n```\n`GLOBALS` 是 PHP 超全局变量，在所有作用域内均可访问\n\n例如：\n```php\n\
    <?php\n$a = 100; $b = 200;\nfunction fun() {\n    $c = $GLOBALS['a'] + $GLOBALS['b'];\n\
    }\nfun();\necho $c;\n?>\n```\n// 输出：300\n\n---\n\n### $PHP_SELF 语法\n\n```php\n\
    action echo($PHP_SELF)\n```\n// 将表单数据发送到当前页面而不是另一个页面。\n\n例如：\n```html\n<html>\n\
    <form action=\"<?php echo($PHP_SELF);?>\" method=\"post\">\nName: <input type=\"\
    text\" name=\"name\">\n<input type=\"submit\" value=\"Submit\">\n</form>\n<?php\
    \ echo $_POST[\"name\"]; ?><br>\n</html>\n```\n// 输出：\n![](img/image_rsrc70R.jpg)\n\
    \n---\n\n### $this 语法\n\n```php\n$this->property;\n```\n`$this->property;` 用于访问当前类中的属性。\n\
    `$this` 代表当前对象。\n注意：在 `$this->property` 中属性没有 `$` 符号\n\n例如：\n```php\n<?php\nclass\
    \ ThisDemo{\n    var $t = \"$this example\";\n    function myFun() {\n       \
    \ echo $this->t; // $this 代表 $obj\n    }\n}\n$obj= new ThisDemo(); // 创建一个对象\n\
    $obj->myFun(); // $obj 引用 myFun()\n?>\n```\n// 输出：$this example\n\n---\n\n###\
    \ => 语法\n\n```php\narray( key1=>value1, key2=>value2, key3=>value3…);\n```\n`=>`\
    \ 符号用于连接键和值。\n在数组中，键和索引的意思相同。\n\n例如：\n```php\n<?php\n$book=array( \"A\"=>\"JSP\"\
    , \"B\"=>\"ASP\", \"C\"=>\"PHP\");\n// \"A, B, C\" 是键，\"JSP, ASP, PHP\" 是值。\n\
    echo $book[\"C\"]; // 显示键 \"C\" 中的元素值\n?>\n```\n// 输出：PHP\n\n---\n\n### == 语法\n\
    \n```php\nvalue1 == value2\n```\n// 比较两个值，但不比较两个值的类型\n\n例如：\n```php\nif(9 == \"\
    9\"){ echo 'equal'; }\nelse{ echo 'not equal'; }\n```\n// 输出：equal\n\n"
- fmt: "\n## `===` syntax\n\n```php\nvalue1 === value2\n```\nCompare two values, and\
    \ compare the type of two values.\n\ne.g.\n```php\nif(9 === \"9\"){echo 'equal';}\n\
    else{ echo 'not equal';}\n// Output: not equal\n```\n\n## `++$var` and `$var++`\
    \ syntax\n\n```php\n++$var  // $var plus 1, and return $var\n$var++  // returns\
    \ $var, and then $var plus 1\n```\ne.g.\n```php\n$x=100; echo ++$x;     // Output\
    \ 101\n$y=100; echo $y++;     // Output 100\n```\n\n## `--$var` and `$var--` syntax\n\
    \n```php\n--$var  // $var minus 1, and return $var\n$var--  // returns $var, and\
    \ then $var minus 1\n```\ne.g.\n```php\n$x=100; echo --$x;     // Output 99\n\
    $y=100; echo $y--;     // Output 100\n```\n\n## `? :` operator syntax\n\n```php\n\
    (test-expression) ? (if-true-do-this) : (if-false-do-this);\n```\nConditional\
    \ operator checks if the `test-expression` is true or false, then, according to\
    \ true or false to execute the specified block.\n\ne.g.\n```php\n$a = 100; $b\
    \ = 200;\n$result = ($a<$b) ? \"apple \" : \"banana \";\n// (check if $a<$b) ?\
    \ (if-true-do-this) : (if-false-do-this);\necho (\"$result<br>\");\n// Output:\
    \ apple\n```\n\n## `<=>` syntax\n\n```php\n$c = $a <=> $b;\n```\nIf `$a > $b`,\
    \ then the value of `$c` is 1.\nIf `$a == $b`, the value of `$c` is 0.\nIf `$a\
    \ < $b`, then the value of `$c` is -1.\n\ne.g.\n```php\necho 10 <=> 10;     //\
    \ 0\necho 3.14 <=> 3.10;     // 1\necho \"ant\" <=> \"bee\";     // -1\n```\n\n\
    ## `__class__` syntax\n\n```php\n__class__\n```\nReturn the current class name.\n\
    \ne.g.\n```php\n<?php\nclass MyClass {\n    function myFun() {\n        echo 'The\
    \ current class name is ' . __class__ ;      \n    }\n}\n$obj = new MyClass();\n\
    $obj->myFun();\n?>\n// Output: The current class name is MyClass\n```\n\n## `__dir__`\
    \ syntax\n\n```php\n__dir__\n```\nReturn the directory of the current file.\n\n\
    e.g.\n```php\necho 'The directory of current file is ' . __dir__ ;\n// Output:\
    \ The directory of current file is C:\\www\n```\n\n## `__file__` syntax\n\n```php\n\
    __file__\n```\nReturn the current file path and name.\n\ne.g.\n```php\necho 'The\
    \ file path and name are ' . __file__ ;\n// Output: The file path and name are\
    \ C:\\www\\myFile.php\n```\n\n## `__function__` syntax\n\n```php\n__function__\n\
    ```\nReturn the current function name.\n\ne.g.\n```php\n<?php\nfunction myFun()\
    \ {\n    echo 'The function name is ' . __function__ ;\n}\nmyFun();\n?>\n// Output:\
    \ The function name is myFun\n```\n\n## `__line__` syntax\n\n```php\n__line__\n\
    ```\nReturn the current line number in the file.\n\ne.g.\n```php\necho 'The line\
    \ number is ' . __line__ ;\n// Output: The line number is 2.\n```\n\n## `__method__`\
    \ syntax\n\n```php\n__method__\n```\nReturn the method name of a class.\n\ne.g.\n\
    ```php\nfunction myFun() {\n    echo 'The function name is ' . __method__ ;\n\
    }\nmyFun();\n// Output: The function name is myFun\n```\n\n## `__namespace__`\
    \ syntax\n\n```php\n__namespace__\n```\nReturn the name of the namespace.\n\n\
    e.g.\n```php\nnamespace MyNamespace;\necho 'The namespace is ', __namespace__;\n\
    // Output: The namespace is MyNamespace.\n```\n\n## `__trait__` syntax\n\n```php\n\
    __trait__\n```\nReturn the trait name. `trait` is used to define a method that\
    \ can be used in multiple classes. `trait` enables programmers to reuse a method\
    \ in different classes.\n\ne.g.\n```php\n<?php\ntrait myTrait{\n    function myFun(){\n\
    \        echo 'The trait name is ' . __trait__ ; // return the trait name\n  \
    \  }\n}\nclass MyClass{\n    use myTrait;\n}\n$obj = new MyClass;\n$obj->myFun();\n\
    ?>\n// Output: The trait name is myTrait\n```\n\n## `abs()` syntax\n\n```php\n\
    abs(number)\n```\nReturn the absolute value of numbers.\n\ne.g.\n```php\necho(abs(-12.345));\n\
    // Output: 12.345\n```\n\n## `abstract` syntax\n\n```php\nabstract BaseClass{abstract\
    \ method();}\nclass DerivedClass implements BaseClass{method(){}}\n```\nAbstract\
    \ classes and methods are defined by the `abstract` keyword. An abstract class\
    \ contains at least one abstract method. An abstract method has no body, but needs\
    \ its derived class to complete the task. The method of the derived class can\
    \ override the abstract method of the abstract base class.\n\ne.g.\n```php\n<?php\n\
    abstract class Base {  // define a abstract class\n    abstract function show();\
    \  // define a abstract method\n}\nclass Derived extends Base {\n    function\
    \ show() {\n        echo \"Implement the abstract function\";\n    }\n}\n$obj\
    \ = new Derived;\n$obj->show();\n?>\n// Output: Implement the abstract function\n\
    ```\n\n## `addslashes()` syntax\n\n```php\naddslashes(\" single quote or double\
    \ quote \")\n```\nAdd a backslash in front of each single quote or double quote.\n\
    \ne.g.\n```php\n$str = addslashes(\"This is a 'good' food!\");\necho($str);\n\
    // Output: This is a \\'good\\' food!\n```\n\n## `alter table` syntax\n\n```php\n\
    $sql=\"alter table tableName add columnName data type\";\n$query=mysqli_query($con,\
    \ $sql);\n```\n`$sql=\"alter table tableName add columnName data type\"` is used\
    \ to add a new column in the table. `$query=mysqli_query($con, $sql)` executes\
    \ the query. `$con` is the connection to the MySQL server (see `mysqli_connect()`).\n\
    \ne.g.\n```php\n<?php\n$con= mysqli_connect( \"localhost\", \"root\", \"12345678\"\
    \ );\nif( $con ) {  // connect MySQL server successfully\n    echo \" Connect\
    \ successfully! \";\n}\n$select=mysqli_select_db( $con, \"myDB\" );\nif( $select\
    \ ) {  // select database \"myDB\" successfully\n    echo \" Select myDB successfully!<br>\
    \ \";\n}  // assume that myDB has a table \"colortable\"\n$sql=\"alter table colortable\
    \ add column color5 varchar(20)\";\n// add a column \"color5\" into the table,\
    \ type is \"varchar(20)\"\n$query=mysqli_query( $con, $sql);  // execute query\n\
    if( $query ) {\n    echo \" Add a column successfully! \";\n}\n?>\n// Output:\n\
    // Connect successfully! Select myDB successfully! Add a column successfully!\n\
    ```\n\n## `alter table` detailed syntax\n\n```sql\nalter table TableName add FieldName\
    \ type modifier;   // add a field\nalter table TableName add primary key (FieldName);\
    \  // add a primary key\nalter table TableName add unique (FieldName);       //\
    \ add a unique property\nalter table TableName alter FieldName set/drop default;\
    \ // alter default value\nalter table TableName change FieldName1 FieldName2...;\
    \ // change fieldname\nalter table TableName drop FieldName;               //\
    \ remove a field\nalter table TableName drop primary key;             // remove\
    \ a primary key\nalter table TableName modify FieldName type modifier;  // modify\
    \ type/modifier\n```\ne.g.\n```sql\nuse library;\nalter table books\nadd pages\
    \ int not null,\nchange author writer char(20);\nexplain books;\n```\n"
