    print_r($arr);\n// 输出:   Array([0]=>Alf [1]=>Bob [2]=>Cin [3]=>Dan)\n```\n\n###\
    \ array_pad() 语法：\n`array_pad($arrary,size,value)`\n\n返回一个指定大小的数组，剩余的数组元素将用参数值填充。\n\
    \ne.g.\n```php\n$arr=array(\"a\",\"b\");\nprint_r(array_pad($arr,4,\"c\"));  //\
    \ 剩余元素将用 \"c\"填充\n// 输出:   Array([0] => a [1] => b [2] => c [3] => c)\n```\n\n\
    ### array_pop() 语法：\n`array_pop( array )`\n\n移除数组的最后一个元素。\n\ne.g.\n```php\n$arr=array(\"\
    A\",  \"B\", \"C\", \"END\");\narray_pop($arr);     // 移除最后一个元素\necho ( \"$arr[0],\
    \ $arr[1], $arr[2]\" );\n// 输出:   A, B, C\n```\n\n### array_product() 语法：\n`array_product($array)`\n\
    \n计算并返回数组中所有元素值的乘积。\n\ne.g.\n```php\n$arr=array(10,20);\necho(array_product($arr));\n\
    // 输出:   200\n```\n\n### array_push() 语法：\n`array_push( array, value1, value2…)`\n\
    \n`array_push( array, value1, value2)` 在数组末尾添加 `value1`、`value2`。\n\ne.g.\n```php\n\
    $arr=array(\"A\", \"B\", \"C\");\narray_push($arr, \"END\"); // 在数组末尾添加 \"END\"\
    \necho ( \"$arr[0], $arr[1], $arr[2], $arr[3]\" ); \n// 输出:   A, B, C, END\n```\n\
    \n### array_rand() 语法：\n`array_rand($array,size)`\n\n返回一个包含原始数组随机键的新数组。\n参数 `size`\
    \ 指定新数组的长度。\n\ne.g.\n```php\n$arr=array(\"a\"=>\"ant\",\"b\"=>\"bee\",\"c\"=>\"\
    cat\",\"d\"=>\"dog\");\nprint_r(array_rand($arr,2));\n// 输出:   Array( [0] => b\
