    # MySQL 参考指南


    | `mysqli_affected_row()` | 返回受查询影响的行数 |

    | :--- | ... |

    | `mysqli_close()` | 关闭与 MySQL 服务器的连接 |

    | `mysqli_connect()` | 创建与 MySQL 服务器的初始连接 |

    | `mysqli_create_db()` | 在 MySQL 服务器上创建一个数据库 |

    | `mysqli_data_seek()` | 将结果指针调整到结果中的随机某行 |

    | `mysqli_db_query()` | 此函数在 PHP 5.3.0 中已弃用 |

    | `mysqli_error()` | 返回包含错误描述的字符串 |

    | `mysqli_fetch_array()` | 返回一个包含表行的索引数组和关联数组 |

    | `mysqli_fetch_assoc()` | 返回一个包含表行的关联数组 |

    | `mysqli_fetch_row()` | 返回一个包含表行的索引数组 |

    | `mysqli_free_result()` | 清除与结果相关的系统内存 |

    | `mysqli_get_server_info()` | 返回包含 MySQL 服务器版本的字符串 |

    | `mysqli_num_rows()` | 返回结果集中的行数 |

    | `mysqli_query()` | 向服务器上的数据库提交查询 |

    | `mysqli_real_escape_string()` | 为 MySQL 转义字符串中的特殊字符 |

    | `mysqli_result()` | 返回 MySQL 结果集中一个单元格的字符串 |

    | `mysqli_select_db()` | 按数据库选择要使用的数据库 |


    ## MySQL 数据库命令

    | 命令 | 描述 |

    | :--- | :--- |

    | `CREATE DATABASE database-name` | 创建数据库 |

    | `USE database-name` | 使用数据库 |

    | `SHOW database-name` | 显示数据库 |

    | `DROP database-name` | 移除数据库 |


    ## MySQL 表命令

    | 命令 | 描述 |

    | :--- | :--- |

    | `CREATE TABLE table-name` | 创建表 |

    | `SHOW TABLE` | 显示所有表 |

    | `DESCRIBE` | 显示字段属性 |

    | `SHOW COLUMNS FROM table-name` | 显示字段属性 |

    | `SHOW INDEX FROM table-name` | 列出索引字段属性 |

    | `ALTER TABLE table-name` | 修改字段数据 |

    | `DROP TABLE table-name` | 移除表 |

    | `OPTIMIZE table-name` | 优化表 |


    ## MySQL 操作命令

    | 命令 | 描述 |

    | :--- | :--- |

    | `SELECT field FROM table WHERE condition` | 查询数据 |

    | `INSERT INTO table ( field ) VALUES (value)` | 插入数据 |

    | `DELETE FROM table WHERE condition` | 删除数据 |

    | `UPDATE table SET field = value WHERE condition` | 更新数据 |

    | `PEPLACE INTO table (field ) VALUES (value)` | 替换数据 |


    ## MySQL 数据类型

    | 类型 | 描述 |

    | :--- | :--- |

    | `int` | 从 -2147483648 到 2147483647 的整数 |

    | `decimal` | 从 -999.99 到 999.99 的浮点数 |

    | `double` | 双精度小数位数 |

    | `date` | 格式为 YYYY-MM-DD 的日期 |

    | `time` | 格式为 HH:MM:SS 的时间 |

    | `datetime` | 格式为 YYYY-MM-DD HH:MM:SS 的数字 |

    | `year` | 1901 到 2155 年间的 YYYY 格式年份 |

    | `timestamp` | 事件发生的自动日期时间戳 |

    | `char()` | 固定长度到 255 的带填充字符串 |

    | `varchar()` | 变变长度到 255 的字符串 |

    | `text` | 长度到 65535 字符的字符串 |

    | `blob` | 二进制类型 |

    | `enum` | 列表中的单个字符串值 |

    | `set` | 列表中的多个字符串值 |


    ## MySQL 字段修饰符

    | 修饰符 | 描述 |

    | :--- | :--- |

    | `AUTO_INCREMENT` | 自动生成序列号 |

    | `NUT` | |

    | `NULL` | 可以为空 |

    | `UNIQUE` | 不重复 |

    | `PRIMARY KEY` | 指定为主主键 |

    | `DEFAULT` | 指定字段的默认值 |

    | `INDEX` | 指定表的索引 |


    ## MySQL 系统函数

    | 函数 | 返回 |

    | :--- | :--- |

    | `cast(v as type)` | 返回转换后的类型 |

    | `connection_id()` | 服务器的连接 ID |

    | `database()` | 当前数据库的名称 |

    | `if(expr,m,n)` | 如果 expr 为真，返回 m；否则返回 n |

    | `ifnull(m,n)` | 如果 m 不空，返回 m；否则返回 n |

    | `nullif(m,n)` | 如果 m 等于 n，返回 null；否则返回 m |

    | `user()` | 返回当前用户 |

    | `version()` | 返回数据库版本 |

    | `show processlist` | 显示 id、用户、主机 |


    ## MySQL 数字函数

    | 函数 | 返回 |

    | :--- | :--- |

    | `abs(n)` | n 的绝对值 |

    | `avg(field)` | 字段的平均值 |

    | `ceiling(n)` | 大于 n 的最小整数 |

    | `cos(n)` | n 的余弦 |

    | `exp(n)` | n 的指数值 |

    | `floor(n)` | 小于 n 的最大整数 |

    | `max(field)` | 字段的最大值 |

    | `min(field)` | 字段的最小值 |

    | `mod(m, n)` | m 除以 n 的余数 |

    | `pi()` | 3.14159 |

    | `radians(n)` | 度转换为弧度 |

    | `rand(n)` | 0 到 1 之间的随机数 |

    | `round(n)` | 接近 n 的整数 |

    | `sin(n)` | n 的正弦 |

    | `sqrt(n)` | n 的平方根 |

    | `tan(n)` | n 的正切 |


    ## MySQL 日时间函数

    | 函数 | 返回 |

    | :--- | :--- |

    | `current_date()` | 当前日期 |

    | `current_time()` | 当前时间 |

    | `current_timestamp()` | 当前日期和时间 |

    | `date(date)` | 日期，例如 2020-01-18 |

    | `day(date)` | 日期的几，例如 18 |

    | `dayname(date)` | 日期的名称，例如星期六 |

    | `hour(date)` | 日期的小时 |

    | `minute(date)` | 日期的分钟 |

    | `month(date)` | 日期的月份 |

    | `monthname(date)` | 月份名称，例如一月 |

    | `now()` | 当前日期和时间 |

    | `second(date)` | 日期的秒 |

    | `year(date)` | 日期的年份 |


    ## MySQL 语句

    | 语句 | 描述 |

    | :--- | :--- |

    | `alter table TableName add FieldName type modifier` | 添加字段 |

    | `alter table TableName add primary key (FieldName)` | 添加主键 |

    | `alter table TableName add unique (FieldName)` | 为字段设置唯一属性 |

    | `alter table TableName alter FieldName set/drop default` | 为字段设置或移除默认值 |

    | `alter table TableName change FieldName1 FieldName2` | 修改字段名 |

    | `alter table TableName drop FieldName` | 移除字段 |

    | `alter table TableName drop primary key` | 移除主键 |

    | `alter table TableName modify FieldName type modifier` | 修改数据类型或修饰符 |

    | `begin()` | 开始事务 |

    | `call ProcedureName` | 调用存储过程 |

    | `commit()` | 执行事务 |

    | `count (distinct FieldName)` | 计算指定字段中唯一值的记录数 |

    | `count (FieldName)` | 计算字段中非空记录数 |

    | `count(*)` | 计算表中所有记录数 |

    | `create database DatabaseName` | 创建新数据库 |

    | `create database if not exists DatabaseName` | 创建数据库 |

    | `create table if not exists NewTable select * from OldTable` | 复制整张表 |

    | `create table if not exists TableName (col1 type1, col2 type2)` | 创建表 |

    | `create table TableName (col1 type1, col2 type2, col3 type3)` | 创建表 |

    | `create view ViewName (FieldNames) as select statements` | 创建视图 |

    | `create view ViewName (FieldNames) as select statements` | 修改视图 |

    | `delete from TableName where field = value` | 删除记录 |

    | `delete from TableName where id = int` | 移除记录 |

    | `delete from TableName` | 删除所有记录 |

    | `describe TableName` | 显示表结构 |

    | `drop database DatabaseName` | 移除数据库 |

    | `drop database if exists DatabaseName` | 移除数据库 |

    | `drop procedure if exists ProcedureName` | 移除存储过程 |

    | `drop table if exists TableName` | 删除表 |

    | `drop table TableName` | 移除表 |

    | `drop view if exists ViewName` | 移除视图 |

    | `engine=innodb` | 使用 innodb 数据库引擎 |

    | `explain TableName` | 了解表结构 |


