    e.g.\n```php\n$str = \"Good\";\necho md5($str);\n```\n// 输出: `0c6ad70beb3a7e76c3fc7adab74acc`\n\
    \n### md5_file() 语法\n```php\nmd5_file($file)\n```\n// 生成文件的 MD5 哈希。\n\ne.g.\n\
    ```php\n$f=\"myFile.txt\";\necho md5_file($f);\n```\n// 输出: `2aa71b9b39feee485ace2843c0d0bfbb`\n\
    \n### microtime() 语法\n```php\nmicrotime()\n```\n// 返回带微秒的当前 Unix 时间戳\n\ne.g.\n\
    ```php\necho(microtime());\n```\n// 输出: `0.51976200 1668780938`\n\n### mkdir()\
    \ 语法\n```php\nmkdir(\"path/directory/\", permission)\n```\n// 创建指定权限的目录，成功返回 1。\n\
    // 关于权限，请查看权限表。\n\ne.g.\n```php\nmkdir(\"/php/myFolder/\", 0770); // 如果失败则返回 0\n\
    ```\n// 给所有者和所有者用户组的权限\n// 输出: 1\n\n"
- fmt: "\n## `mktime()` syntax:\n\n`mktime($hour, $minute, $second, $month, $day,\
    \ $year)`\n\n// Return a Unix timestamp (seconds) from Unix Epoch (1-1-1970) to\
    \ the specified date and time. All parameters are optional.\n\ne.g.\n\n```php\n\
    <?php  // Return an Unix timestamp from Unix Epoch to current time\nprint(mktime());\
    \  \n?>\n// Output:   1668797908\n```\n\n## `move_uploaded_file()` syntax:\n\n\
    `bool move_uploaded_file($file_tmp_name, $destination )`\n\n// Move an uploaded\
    \ file with temporary name to new location.\n\ne.g.\n\n```php\nmove_uploaded_file($_FILES[\"\
    file\"][\"tmp_name\"], \"upload/$_FILES[\"file\"][\"name\"]);\n```\n// Move `$_FILES[\"\
    file\"][\"tmp_name\"]` to `\"upload\"` folder, the new file name becomes `$_FILES[\"\
    file\"][\"name\"]`.\n\n## `mt_rand()` syntax:\n\n`mt_rand(min, max)`\n\n// Generate\
    \ a random number from min to max. Arguments are optional.\n\ne.g.\n\n```php\n\
    echo(mt_rand().\"  \"); echo(mt_rand(100,1000));\n// Output:   2045534323    168\n\
    ```\n\n## `mysqli_affected_rows()` syntax:\n\n`mysqli_affected_rows()`\n\n// Return\
    \ the number of affected rows from the query.\n\ne.g.\n\n```php\n$con=new mysqli(\"\
    servername\",\"username\",\"password\",\"db\");\n$sql = \"DELETE FROM myTable\
    \ WHERE id < 6\";\nmysql_query($sql, $con);\n$rc = mysqli_affected_rows();\necho\
    \ \"Records deleted: \" . $rc;\nmysql_close($con);\n// Records deleted: 5\n```\n\
    \n## `mysqli_close()` syntax:\n\n`mysqli_close( );`\n\n// Close a previously opened\
    \ database connection\n\ne.g.\n\n```php\n$con= mysqli_connect( \"localhost\",\
    \ \"root\", \"12345678\" );\nmysqli_close($con);     // close the connection\n\
    echo \"The connection is closed successfully!\";\n// Output:\n// The connection\
    \ is closed successfully!\n```\n\n## `mysqli_connect()` syntax:\n\n`mysqli_connect(\
    \ \"host\", \"username\", \"password\" );`\n\n// `mysqli_connect( )` lets PHP\
    \ connect MySql server.\n// \"host\": specifies a host name or an IP address\n\
    // \"username\": specifies a MySql user name.\n// \"password\": specifies a MySql\
    \ password.\n\ne.g.\n\n```php\n$con = mysqli_connect( \"localhost\", \"root\"\
    , \"12345678\" );\nif( $con ) {     // if connect MySQL server successfully\n\
    echo  \" Connect successfully! \";\n}\n// Output:   Connect successfully!\n```\n\
    \n## `mysqli_connect_error()` syntax:\n\n`mysqli_connect_error()`\n\n// Return\
    \ the message of the connection error with MySQL\n\ne.g.\n\n```php\n$conn = mysqli_connect(\"\
    server\", \"user\", \"password\", \"db\");\nif (!$conn) {\n  die(\"Connection\
    \ failed: \" . mysqli_connect_error());\n}\n// Output:   Connection failed: php_network_getaddresses:\
    \ getaddrinfo failed: No such host is known.\n```\n\n## `mysqli_data_seek()` syntax:\n\
    \n`mysqli_data_seek($result, row);`\n\n// Move the pointer to an arbitrary row\
    \ in the result-set.\n// \"row\" parameter starts from row 0.\n\ne.g.\n\n```php\n\
    $con=new mysqli(\"servername\",\"username\",\"password\",\"db\");\n$sql=\"SELECT\
    \ \\* FROM myTable\";\nif ($result=mysqli_query($con, $sql)){\n  mysqli_data_seek($result,\
    \ 5);  // Seek to row 5\n}\n// Point to row 5 in the result set.\n```\n\n## `mysqli_error()`\
    \ syntax:\n\n`mysqli_error($con);`\n\n// Returns the description of the last error.\n\
    \ne.g.\n\n```php\n$con=new mysqli(\"servername\",\"username\",\"password\",\"\
    db\");\nmysqli_query($con, \"SELECT \\* FORM myTable\");\n$error = mysqli_error($con);\
    \   // Error\nprint(\"Error Found: \".$error);\n// Output:   Error Found: You\
    \ have an error in your SQL syntax; ……\n```\n\n## `mysqli_fetch_array()` syntax:\n\
    \n`$array=mysqli_fetch_array($query)`\n\n// `mysqli_fetch_array( )` returns an\
    \ indexed and associative array that contains rows of a table. The element keys\
    \ can be both number type and string type. For example: `[number]=>value    [string]=>value`.\n\
    \ne.g.\n\n```php\n<?php\n$con= mysqli_connect( \"localhost\", \"root\", \"12345678\"\
    \ );\nif( $con ) {     // if connect MySQL server successfully\necho  \" Connect\
    \ successfully! \";\n}\n$select=mysqli_select_db( $con, \"myDB\" );\nif( $select\
