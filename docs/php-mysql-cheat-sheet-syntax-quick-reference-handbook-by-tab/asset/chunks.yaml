    \ Sheet in 8 Hours' is a very good book.\";\necho wordwrap($str,18,\"\\n\"); \
    \   // at most 18 characters each line\n```\n// Output:\n'Google Sheet in 8\n\
    Hours' is a very\ngood book.\n\n# xml dom parser syntax\n\n```php\n$xmlObj = new\
