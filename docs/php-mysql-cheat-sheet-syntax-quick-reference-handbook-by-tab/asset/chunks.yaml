    \n```sql\nuse library;\nselect title, price from books;\n```\n\n![](image_rsrc71A.jpg)\n\
    \n`// select title, price from books;` only shows two fields `title`, `price`\
    \ in the table `books`.\n\n---\n\n## Show specified record syntax\n\n```sql\n\
    select * from TableName where field = value;\n```\n\n`// Show a specified record\
    \ in a table.`\n\ne.g.\n\n### 1. Given the current status of the table `books`\
    \ as follows:\n\n```sql\nuse library;\nselect * from books;\n```\n\n![](image_rsrc71B.jpg)\n\
    \n### 2. Add a record, and then show this record\n\n```sql\nuse library;\ninsert\
    \ into books (id, title, writer, pages, price, publish)\nvalues (7, \"Lamp\",\
    \ \"Jan Poe\",120, 11.67, 2015);\nselect * from books where writer = \"Jan Poe\"\
    ;\n```\n\n![](image_rsrc71C.jpg)\n\n`// select * from books where writer = \"\
    Jan Poe\";` only shows the record where `writer` is `Jan Poe`.\n\n---\n\n## Show\
    \ tables syntax\n\n```sql\nshow tables;\n```\n\n`// Show all existing tables in\
    \ the current database.`\n\ne.g.\n\n```mysqlmysql> use world;\nDatabase changed\n\
    mysql> show tables;\n```\n\n![](image_rsrc71D.jpg)\n\n`// use world;` specifies\
    \ to use a database `world`.\n`// show tables` displays all tables in the database\
    \ `world`.\n`// There are three tables totally in the database `world`.\n\n---\n\
    \n## shuffle() syntax\n\n```php\nshuffle($array)\n```\n\n`// Shuffle the order\
    \ of array elements at random.`\n\ne.g.\n\n```php\n$arr = array(\"a\", \"b\",\
