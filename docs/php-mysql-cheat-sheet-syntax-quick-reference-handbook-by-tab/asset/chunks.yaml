    \ 70 个字符 |\n| headers | 邮件头，如 Cc |\n| parameters | 邮件的额外参数\n\n## PHP 过滤器函数\n\n\
    | 函数 | 说明 |\n| --- | --- |\n| `filter_has_var()` | 检查指定变量是否存在 |\n| `filter_id()`\
    \ | 返回指定过滤器的 id |\n| `filter_input()` | 从表单输入获取值并可选过滤 |\n| `filter_input_array()`\
    \ | 从表单输入获取值并可选过滤 |\n| `filter_list()` | 返回所有过滤器的名称 |\n| `filter_var()` | 过滤变量\
    \ |\n| `filter_var_array()` | 过滤变量并它们 |\n\n## PHP 文件权限表\n\n| 数字 | 权限 |\n| ---\
    \ | --- |\n| 0 | 无法读、写或执行 |\n| 1 | 仅执行 |\n| 2 | 仅写 |\n| 3 | 可写和执行 |\n| 4 | 仅读\
    \ |\n| 5 | 可读和执行 |\n| 6 | 可读写 |\n| 7 | 可读写并执行\n\n## PHP 字符串格式表\n\n| 符号 | 表示 |\n\
    | --- | --- |\n| `%%` | 百分号 |\n| `%b` | 二进制数 |\n| `%c` | 根据 ascii 值的字符 |\n| `%d`\
    \ | 有符号整数（负、零或正数） |\n| `%e` | 小写科学计数法（例如 1.2e+2） |\n| `%E` | 大写科学计数法（例如 1.2e+2）\
