  trans: "\n\n# 使用数据库语法\n\n```php\nuse DatabaseName;\n```\n\n// 在 mysql 服务器中选择一个数据库。\n\
    \n例如：\n\n```bash\nmysql> use myDatabase;\nDatabase changed\n```\n\n// `use myDatabase;`\
    \ 指定使用名为 `myDatabase` 的数据库。\n// `Database changed` 是服务器返回的响应消息。\n\n# usleep()\
    \ 语法\n\n```php\nusleep(microseconds)\n```\n\n// 指定的微秒数延迟运行当前代码\n\n例如：\n\n```php\n\
    usleep(3000000);\n```\n\n// 在继续之前暂停 3000000 微秒。\n\n# 变量语法\n\n```php\n$variable\
    \ =  value;\n```\n\n// 变量名以 `$` 符号开头。\n\n例如：\n\n```php\n$var = 100;    // 定义一个变量\n\
    $abcde = \"Hello World\";     // 定义一个变量\n$my_variable = \"Number1\";   // 定义一个变量\n\
    echo ( \"$var  $abcde  $my_variable\");\n```\n// 输出：   100  Hello World  Number1\n\
    \n# var_dump() 语法\n\n```php\nvar_dump($var);\n```\n\n// 返回变量的类型和值\n\n例如：\n\n```php\n\
    $x = 100;   var_dump($x);\n$y = 3.14;     var_dump($y);\n```\n// 输出：     int(100)\
    \     float(3.14)\n\n# where 条件语法\n\n```sql\nSELECT columnName FROM tableName\
    \ WHERE columnName operator value \n```\n\n// 提取符合指定条件的记录\n\n例如：\n\n```php\n$sql\
    \ = \"SELECT id, firstname, lastname FROM myTable WHERE id='1001'\";\n```\n//\
    \ 返回 id 为 1001 的记录\n\n# while 循环语法\n\n```php\nwhile ( test-expression ) {  //\
    \ 此处包含一些 php 代码；  }\n```\n\n// 如果指定条件为真，则循环执行块。\n\n例如：\n\n```php\n$counter=0;\n\
    while ($counter < 8){  // 最多循环 8 次\necho \"&\";\n$counter++;     // 每次循环增加 1\n\
    }\n```\n// 输出：   &&&&&&&&\n\n# wordwrap() 语法\n\n```php\nwordwrap($string, length,\
    \ \"\\n\");\n```\n\n// 当字符串达到特定长度时将其换行。\n\n例如：\n\n```php\n$str = \"'Google Sheet\
    \ in 8 Hours' is a very good book.\";\necho wordwrap($str,18,\"\\n\");    // 每行最多\
    \ 18 个字符\n```\n// 输出：\n'Google Sheet in 8\nHours' is a very\ngood book.\n\n# xml\
    \ dom 解析器语法\n\n```php\n$xmlObj = new DOMDocument();     // 创建一个 dom 文对象  \n$xmlObj->load(\"\
    myFile.xml\");     // 加载 xml 文件\nprint $xmlObj->saveXML();        // 打印文件内容\n\
    ```\n\n// 从 xml 文件获取数据，并根据节点打印。\n\n例如：\n1. 假设 `myFile.xml` 的内容为：\n```xml\n<?xml\
    \ version='1.0' encoding='UTF-8'?>\n<note>\n<from>Ray Yao</from>\n<greeting>Hi,\
    \ My friend!</greeting>\n</note>\n```\n2.\n```php\n<?php\n$obj = new DOMDocument();\n\
    $obj->load(\"myFile.xml\");\nprint $obj->saveXML();\n?>\n```\n// 输出： Ray Yao Hi,\
    \ My friend!\n\n# 附录\n\n## PHP 保留字表\n\n| | |\n| --- | --- |\n| and | array |\n\
    | case | const |\n| default | do |\n| else | empty |\n| eval | exit |\n| extends\
    \ | for |\n| function | global |\n| if | include |\n| isset | include_once |\n\
    | list | list |\n| or | print |\n| require | return |\n| static | switch |\n|\
    \ unset | xor |\n\n## 转义字符表\n\n| | |\n| --- | --- |\n| `\\n` | 输出到下一行。 |\n| `\\\
    r` | 输出回车。 |\n| `\\t` | 输出制表符。 |\n| `\\'` | 输出单引号。 |\n| `\\\"` | 输出双引号。 |\n\n\
    ## PHP 预定义字符表\n\n| | |\n| --- | --- |\n| `&` | 且 |\n| `\"` | 双引号 |\n| `'` | 单引号\
    \ |\n| `<` | 小于 |\n| `>` | 大于 |\n\n## 文件打开模式表\n\n| 模式 | 操作 |\n| --- | --- |\n\
    | `r` | 仅读，从开头开始。 |\n| `r+` | 读写，从开头开始。 |\n| `w` | 仅写，清空原有内容。 |\n| `w+` | 读写，清空原有内容。\
