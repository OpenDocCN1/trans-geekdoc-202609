  trans: "\n\n```mysql\nmysql > show databases;\n```\n\n![](img/image_rsrc718.jpg)\n\
    \n## 显示指定字段语法\n\n```sql\nselect field1, field2, field3 from TableName;\n```\n\n\
    `// 显示表中的某些指定字段`\n\ne.g.\n\n### 1. 假设表 `books` 当前状态如下：\n\n```sql\nuse library;\n\
    select * from books;\n```\n\n![](img/image_rsrc719.jpg)\n\n### 2. 显示某些指定字段\n\n\
    ```sql\nuse library;\nselect title, price from books;\n```\n\n![](img/image_rsrc71A.jpg)\n\
    \n`// select title, price from books;` 仅显示 `books` 表中的两个字段 `title` 和 `price`。\n\
    \n---\n\n## 显示指定记录语法\n\n```sql\nselect * from TableName where field = value;\n\
    ```\n\n`// 显示表中的特定记录。`\n\ne.g.\n\n### 1. 假设表 `books` 当前状态如下：\n\n```sql\nuse library;\n\
    select * from books;\n```\n\n![](img/image_rsrc71B.jpg)\n\n### 2. 添加一条记录，然后显示这条记录\n\
    \n```sql\nuse library;\ninsert into books (id, title, writer, pages, price, publish)\n\
    values (7, \"Lamp\", \"Jan Poe\",120, 11.67, 2015);\nselect * from books where\
    \ writer = \"Jan Poe\";\n```\n\n![](img/image_rsrc71C.jpg)\n\n`// select * from\
    \ books where writer = \"Jan Poe\";` 仅显示 `writer` 为 `Jan Poe` 的记录。\n\n---\n\n\
    ## 显示表语法\n\n```sql\nshow tables;\n```\n\n`// 显示当前数据库中所有存在的表。`\n\ne.g.\n\n```mysqlmysql>\
    \ use world;\nDatabase changed\nmysql> show tables;\n```\n\n![](img/image_rsrc71D.jpg)\n\
    \n`// use world;` 指定使用 `world` 数据库。\n`// show tables` 显示 `world` 数据库中的所有表。\n`//\
    \ `world` 数据库中共有三张表。\n\n---\n\n## shuffle() 语法\n\n```php\nshuffle($array)\n```\n\
    \n`// 随机打乱数组元素的顺序。`\n\ne.g.\n\n```php\n$arr = array(\"a\", \"b\", \"c\", \"d\"\
    );\nshuffle($arr);\nprint_r($arr);\n// Output: Array([0] => c [1] => b [2] =>\
    \ d [3] => a)\n```\n\n---\n\n## simplexml_load_file() 语法\n\n```php\n$xml = simplexml_load_file(\"\
    myFile.xml\")\n$xml -> node\n```\n\n`// 从 xml 文件获取数据，并根据节点打印内容`\n\ne.g.\n\n1.\
    \ 假设 `myFile.xml` 的内容为：\n\n```xml\n<?xml version='1.0' encoding='UTF-8'?>\n<note>\n\
    <to>Tove</to>\n<from>Jani</from>\n<heading>Reminder</heading>\n<body>Don't forget\
    \ me this weekend!</body>\n</note>\n```\n\n2.\n\n```php\n<?php  \n$xml=simplexml_load_file(\"\
    myFile.xml\")\necho $xml->node;\n```\n\n实际上，此处原文逻辑应该是：\n\n```php\n<?php  \n$xml=simplexml_load_file(\"\
    myFile.xml\");\necho $xml->body;\n```\n（注：原文示例代码片段存在格式混乱，此处已按翻译逻辑尽可能还原）\n\n---\n\
    \n## simplexml_load_string() 语法\n\n```php\nsimplexml_load_string(xmlData)\n```\n\
    \n`// 获取字符串的 XML 数据并打印出来。`\n\ne.g.\n\n```php\n<?php\n$myXML=\"<?xml version='1.0'\
    \ encoding='UTF-8'?>\n<note>\n<to>Tove</to>\n<from>Jani</from>\n<heading>Reminder</heading>\n\
    <body>Don't forget me this weekend!</body>\n</note>\";\n$xml=simplexml_load_string($myXML);\n\
    print_r($xml);\n?>\n// Output: \nSimpleXMLElement Object\n(\n    [to] => Tove\n\
    \    [from] => Jani\n    [heading] => Reminder\n    [body] => Don't forget me\
    \ this weekend!\n)\n```\n\n---\n\n## sleep() 语法\n\n```php\nsleep(seconds)\n```\n\
    \n`// 使当前代码延迟指定的秒数`\n\ne.g.\n\n```php\nsleep(3);\n// 暂停 3 秒后继续。\n```\n\n---\n\n\
    ## sort() 语法\n\n```php\nsort($array)\n```\n\n`// 升序排序数组元素值`\n\ne.g.\n\n```php\n\
    $arr=array(\"30\",\"10\",\"20\");\nsort($arr); // sort values\n// Output: Array\
    \ ([0] => 10 [1] => 20 [2] => 30\n```\n\n---\n\n## 表排序语法\n\n```sql\norder by field\
    \ asc / desc;\n```\n\n`// 使用 \"asc\" 关键字升序排序数据。`\n`// 使用 \"desc\" 关键字降序排序数据。`\n\
    \ne.g.\n\n1. 假设 `books` 表当前状态如下：\n\n```sql\nuse library;\nselect * from books;\n\
    ```\n\n![](img/image_rsrc71E.jpg)\n\n2. 使用 `asc` 对表排序：\n\n```sql\nuse library;\n\
    select * from books order by price asc;\n```\n\n![](img/image_rsrc71F.jpg)\n\n\
    `// select * from books order by price asc;` 按 `price` 排序。\n\n---\n\n## sprintf()\
    \ 语法\n\n```php\nsprintf(format, $variable)\n```\n\n`// 将格式化字符串写入变量`\n\ne.g.\n\n\
    ```php\n$num = 8;\n$str = \"Hours\";\n$var = sprintf(\"%d %s\", $num, $str);\n\
    // Output: 8 Hours\n```\n\n---\n\n## sqrt() 语法\n\n```php\nsqrt(number)\n```\n\n\
    `// 返回数字的平方根`\n\ne.g.\n\n```php\necho sqrt(25);\n// Output: 5\n```\n\n---\n\n\
    ## sscanf() 语法\n\n```php\nsscanf(string, format)\n```\n\n`// 根据格式解析字符串。`\n\ne.g.\n\
    \n```php\n$str = \"Java in 8\";\n$format = sscanf($str,\"%s %d\");\nprint_r($format);\n\
    // Output: Array([0] => Java [1] => 8)\n```\n\n---\n\n## static 语法\n\n```php\n\
    static $variable = value;\n```\n\n`// 静态变量可以保留上一次函数调用时的值。`\n\ne.g.\n\n```php\n\
    <?php\nfunction myFunc() {\n    static $var=10;\n    echo $var++;\n}\nmyFunc();\n\
    myFunc();\n// Output: 1011\n?>\n```\n\n---\n\n## static 成员语法\n\n```php\nstatic\
    \ $variable = value;\nstatic function funName()\n```\n\n`// 静态成员可以直接通过类调用，而不是通过对象。`\n\
    \ne.g.\n\n```php\n<?php\nclass MyClass {\n    public static $staticVar = 'I am\
    \ a static variable';\n    public static function staticFun(){\n        echo \"\
    I am a static function\";\n    }\n}\nprint MyClass::$staticVar;\nprint MyClass::staticFun();\n\
    ?>\n// Output:\n// I am a static variable\n// I am a static function\n```\n\n\
    ---\n\n## string 语法\n\n```php\n$str = \"characters\";\n$str = 'characters';\n\
    ```\n\n`// 字符串由一系列字符组成，由双引号或单引号围围。`\n\ne.g.\n\n```php\n$x = \" Hello world! \"\
    ;\necho $x;\n$y = ' Hi, my friend! ';\necho $y;\n// Output:  Hello world!  Hi,\
    \ my friend!\n```\n\n---\n\n## 字符串连接语法\n\n```php\n$string1 . \" \" . $string2\n\
    ```\n\n`// 连接两个字符串`\n\ne.g.\n\n```php\n$book1 = \"PowerShell\";\n$book2 = \"in\
    \ 8 Hours\";\necho $book1 . \" \" . $book2;\n// Output: PowerShell in 8 Hours\n\
    ```\n\n---\n\n## stripos() 语法\n\n```php\nstripos(string, substring)\n```\n\n`//\
    \ 返回字符串在字符串中第一次出现的位置。`\n`// stripos() 不区分大小写。`\n\ne.g.\n\n```php\necho stripos(\"\
    Powershell & Shell Scripting in 8 Hours\", \"Shell\");\n// Output: 5\n```\n\n\
    ---\n\n## stripslashes() 语法\n\n```php\nstripslashes(\"backslashes\")\n```\n\n\
    `// 去反斜杠 \\\\ 和 \\\\\\\\。`\n\ne.g.\n\n```php\necho stripslashes(\"I don\\\\'t\
    \ know!\");\n// Output: I don't know!\n```\n\n---\n\n## stristr() 语法\n\n```php\n\
    stristr(\"string\", \"substring\")\n```\n\n`// 搜索子字符串第一次出现的位置并返回剩余部分。`\n\n"
- fmt: "\n```php\necho stristr(\"Hi, My friends!\", \"my\"); // `stristr()` is case\
    \ insensitive\n// Output: My Friends!\n```\n\n### strip_tags()\n`strip_tags()`\
    \ syntax:\n```php\nstrip_tags(\"string_with_html_tags\");\n```\n// Remove any\
    \ html tags from a string.\n\ne.g.\n```php\necho strip_tags(\"The book is <b><i>'R\
    \ in 8 Hours'</i></b>\");\n// Output: The book is 'R in 8 Hours'\n```\n\n### str_ireplace()\n\
    `str_ireplace()` syntax:\n```php\nstr_ireplace(old_str, \"new_str\", \"original_str\"\
    )\n```\n// In the original string, replace a old string with a new string.\n\n\
    e.g.\n```php\n// `str_ireplace()` is case insensitive\necho str_ireplace(\"JQuery\"\
    , \"MySQL\", \"jQuery in 8 Hours\");\n// Output: MySQL in 8 Hours\n```\n\n###\
    \ strlen()\n`strlen()` syntax:\n```php\nstrlen($string);\n```\n// Return a length\
    \ of a string and space\n\ne.g.\n```php\n$string=\" Hello World! \";\necho strlen($string);\
    \ // return string length\n// Output: 16\n```\n\n### str_pad()\n`str_pad()` syntax:\n\
    ```php\nstr_pad(string, length, pad)\n```\n// Pad a string to a specified length\n\
    \ne.g.\n```php\n$str = \"So Good\";\necho str_pad($str,10,\"$\"); // pad by `$`\
    \ to the length as 10\n// Output: So Good$$$\n```\n\n### strpbrk()\n`strpbrk()`\
    \ syntax:\n```php\nstrpbrk(\"string\", \"character\")\n```\n// Search a string\
    \ for the specified character that is the first occurrence and return the rest\
    \ substring.\n\ne.g.\n```php\necho strpbrk(\"NumPy in 8 Hours\", \"i\"); // `strpbrk()`\
    \ is case sensitive\n// Output: in 8 Hours\n```\n\n### strpos()\n`strpos()` syntax:\n\
    ```php\nstrpos(string, substring)\n```\n// Return the position of the first occurrence\
    \ of the substring in string.\n// `strpos()` is case sensitive.\n\ne.g.\n```php\n\
    echo strpos(\"Powershell & Shell Scripting in 8 Hours\", \"Shell\");\n// Output:\
    \ 13\n```\n\n### str_repeat()\n`str_repeat()` syntax:\n```php\nstr_repeat(string,\
    \ repeat_number)\n```\n// Repeat a string according to the specified number of\
    \ times\n\ne.g.\n```php\necho str_repeat(\"Good! \", 3); // repeat 3 times\n//\
    \ Output: Good! Good! Good!\n```\n\n### strrev()\n`strrev()` syntax:\n```php\n\
    strrev(\"string\")\n```\n// Reverse a string\n\ne.g.\n```php\necho strrev(\"abcde\"\
    );\n// Output: edcba\n```\n\n### strripos()\n`strripos()` syntax:\n```php\nstrripos(string,\
    \ substring)\n```\n// Return the position of the last occurrence of the substring\
    \ in string.\n// `strripos()` is case insensitive.\n\ne.g.\n```php\necho strripos(\"\
    Powershell & Shell Scripting in 8 Hours\", \"shell\");\n// Output: 13\n```\n\n\
    ### strrpos()\n`strrpos()` syntax:\n```php\nstrrpos(string, substring)\n```\n\
    // Return the position of the last occurrence of the substring in string.\n//\
    \ `strrpos()` is case sensitive.\n\ne.g.\n```php\necho strrpos(\"Powershell &\
    \ Shell Scripting in 8 Hours\", \"shell\");\n// Output: 5\n```\n\n### strstr()\n\
    `strstr()` syntax:\n```php\nstrstr(\"string\", \"substring\")\n```\n// Search\
    \ for the first occurrence of a substring and return the rest part.\n\ne.g.\n\
    ```php\necho strstr(\"Hi, My friends!\", \"My\"); // `strstr()` is case sensitive\n\
    // Output: My Friends!\n```\n\n### strtolower()\n`strtolower()` syntax:\n```php\n\
    strtolower($string);\n```\n// Return a lowercase string\n\ne.g.\n```php\n$string=\"\
    \ Hello World! \";\necho strtolower($string); // return lowercase\n// Output:\
    \ hello world!\n```\n\n### strtotime()\n`strtotime()` syntax:\n```php\nstrtotime()\n\
    ```\n// Return the number of seconds since January 1 1970 00:00:00 GMT\n\ne.g.\n\
    ```php\necho(strtotime(\"now\"). \");\necho(strtotime(\"next Friday\"). \");\n\
    echo(strtotime(\"last Monday\"). \");\n// Output: 1667875862 1668124800 1667779200\
    \ \n```\n\n### strtoupper()\n`strtoupper()` syntax:\n```php\nstrtoupper($string);\n\
    ```\n// Return a uppercase string\n\ne.g.\n```php\n$string=\" Hello World! \"\
    ;\necho strtoupper($string); // return uppercase\n// Output: HELLO WORLD!\n```\n\
    \n### str_replace()\n`str_replace()` syntax:\n```php\nstr_replace(old_str, \"\
    new_str\", \"original_str\")\n```\n// In the original string, replace a old string\
    \ with a new string.\n\ne.g.\n```php\n// `str_replace()` is case sensitive\necho\
    \ str_replace(\"JQuery\", \"MySQL\", \"jQuery in 8 Hours\");\n// Output: MySQL\
    \ in 8 Hours\n```\n\n### str_shuffle()\n`str_shuffle()` syntax:\n```php\nstr_shuffle(\"\
    string\")\n```\n// Shuffle characters of a string.\n\ne.g.\n```php\necho str_shuffle(\"\
    abcde\");\n// Output: dcba\n```\n\n### str_split()\n`str_split()` syntax:\n```php\n\
    str_split(\"string\")\n```\n// Split a string to an array\n\ne.g.\n```php\nprint_r(str_split(\"\
    html\"));\n// Output: Array ( [0] => h [1] => t [2] => m [3] => l )\n```\n\n###\
    \ str_word_count()\n`str_word_count()` syntax:\n```php\nstr_word_count(\"string\"\
    )\n```\n// Count words in a string.\n\ne.g.\n```php\necho str_word_count(\"Hi,\
    \ friends!\");\n// Output: 3\n```\n\n### strtr()\n`strtr()` syntax:\n```php\n\
    $array = array(key=>value);\nstrtr(\"string\", $array);\n```\n// Replace the string\
    \ with values\n\ne.g.\n```php\n$arr = array(\"Hi,\" => \"Hello,\", \"Friends\"\
    \ => \"World\");\necho strtr(\"Hi, Friends\", $arr);\n// Output: Hello, World\n\
    ```\n\n### submit form\n`submit` syntax:\n```html\n<input type=\"submit\" value=\"\
    xxx\">\n```\n// Submit all data in the form.\n// `value` attribute sets the characters\
    \ on the button.\n\ne.g.\n```html\n<form action=\"myfile.php\" method=\"post\"\
    >\n<input type=\"submit\" value=\"SUBMIT\">\n</form>\n```\n\n### substr()\n`substr()`\
    \ syntax:\n```php\nsubstr(string, start, length)\n```\n// Extract a substring\
    \ by the specified parameters\n// `start` specifies the index where to start\n\
    // `length` specified the length to extract\n\ne.g.\n```php\necho substr(\"JavaScript\
    \ in 8 Hours!\",4,6);\n// Output: Script\n```\n\n### substr_count()\n`substr_count()`\
    \ syntax:\n```php\nsubstr_count(\"string\", \"word\")\n```\n// Count how many\
    \ the word occurs in a string.\n\ne.g.\n```php\necho substr_count(\"OK! It is\
    \ OK!\", \"OK\");\n// Output: 2\n```\n\n### substr_replace()\n`substr_replace()`\
    \ syntax:\n```php\nsubstr_replace(string, new, start)\n```\n// Replace part of\
    \ string with new string from the specified position\n// `start` specified a position\
    \ where the replacement occurs.\n\ne.g.\n```php\necho substr_replace(\"12345678\"\
    , \"OK\", 3);\n// Output: 123OK\n```\n\n### switch\n`switch` syntax:\n```php\n\
    switch ( $variable ) {\ncase 1: // if equals this case, do this; break;\ncase\
    \ 2: // if equals this case, do this; break;\ncase 3: // if equals this case,\
    \ do this; break;\ndefault : // if not equals any case, run default code; break;\n\
    }\n```\n// `$variable` value will compare each case first, if it equals one of\
    \ the `case` value; it will run that `case` code. Otherwise, run default code.\n\
    \ne.g.\n```php\n$number=20;\nswitch ( $number ) {\ncase 10 : echo \"Running case\
    \ 10\"; break;\ncase 20 : echo \"Running case 20\"; break; // match\ncase 30 :\
    \ echo \"Running case 30\"; break;\n}\n```\n"
