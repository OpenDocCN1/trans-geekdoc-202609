    \      // sort element values\nprint_r($arr);\n// Output: Array ([0] => 10 [1]\
    \ => 20 [2] => 30 )\n```\n\n---\n\n## Sort table data syntax\n\n```sql\norder\
    \ by field asc / desc;\n```\n\n`// Sort data in ascending order by using \"asc\"\
