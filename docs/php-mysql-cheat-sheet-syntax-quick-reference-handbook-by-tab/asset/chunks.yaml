    \ |\n| `%c` | the character according to the ascii value |\n| `%d` | signed decimal\
    \ number (negative, zero or positive) |\n| `%e` | scientific notation using a\
    \ lowercase (e.g.1.2e+2) |\n| `%E` | scientific notation using a uppercase (e.g.1.2e+2)\
