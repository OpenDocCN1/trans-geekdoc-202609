    \ 语法\n\n```php\nhtmlspecialchars($predefined_characters)\n// 将预定义字符转换为 html\n\
    ```\n\ne.g.\n\n```php\n$str = '<a href=\"www.com\">';\necho htmlspecialchars($str);\n\
    // 输出: &lt;a href=&quot;www.com&gt;\n```\n\n## http_build_query() 语法\n\n```php\n\
