  trans: "\n\n## `eval()` 语法\n\n```php\neval($string)\n```\n\n将字符串作为 `PHP` 代码执行。该字符串必须是有效的\
    \ `PHP` 代码并以分号结尾。\n\ne.g.\n\n```php\n$str = '$num = 100; echo $num;';\neval($str);\
    \ // $str 是 php 代码\n// 输出: 100\n```\n\n## `exec()` 语法\n\n```php\nexec('external_program');\n\
    ```\n\n执行外部程序或外部命令。\n\ne.g.\n```php\necho exec('whoami');\n// 该函数将返回执行程序输出的最后一行。\n\
    ```\n\n## `extract()` 语法\n\n```php\nextract($array);\n```\n\n将数组键转换为变量名，将数组值转换为变量值。\n\
    \ne.g.\n```php\n$arr=array(\"a\"=>\"ant\", \"b\"=>\"bee\", \"c\"=>\"cat\", \"\
    d\"=>\"dog\");\nextract($arr);\necho \"\\\\$a=$a; \\\\$b=$b; \\\\$c=$c; \\\\$d=$d\"\
    ;\n// 输出: $a=ant; $b=bee; $c=cat; $d=dog\n```\n\n## `fclose()` 语法\n\n```php\n\
    fcolse($openedFile)\n```\n\n关闭打开的文件。\n释放内存资源和其他使用该文件的进程。\n\ne.g.\n```php\n$filename\
    \ = \"D:\\\\myfile.txt\"; // 设置路径 D:\\\\myfile.txt\n$openfile = fopen( $filename,\
    \ w ); // 以 w 模式打开文件\n$content = fwrite( $openfile, \"Hello!!\" ); // 写入\nfcolse($openfile);\
    \ // 关闭打开的文件\n// 写入 myfile.txt 后，我们可以使用 `fclose()` 关闭已打开的文件。\n```\n\n## `feof()`\
    \ 语法\n\n```php\nfeof($file)\n```\n\n如果读取到达文件末尾则返回 true，否则返回 false。\n\ne.g.\n```php\n\
    $f = fopen(\"myFile.txt\",\"r\");\nwhile( !feof($f) ){ // 如果没有读到文件末尾，继续运行\n$contents\
    \ = fgets($f); // fgets($f) 读取文件\necho $contents. \"<br>\";\n}\n// 输出: ( 以下是文件的内容\
    \ )\nHi, this is myfile.txt,这个文件有两行。\n这里是文件的末尾。\n```\n\n## `fgetc()` 语法\n\n```php\n\
    fgetc($file)\n```\n\n从指定的文件中读取一个字符。\n\ne.g.\n```php\n$f = fopen(\"myFile.txt\"\
    ,\"r\");\necho fgetc($f);\n// 输出: R\n```\n\n## `fgetcvs()` 语法\n\n```php\nfgetcvs($file)\n\
    ```\n\n从 csv 文件中读取一行。\n\ne.g.\n```php\n$f = fopen(\"myFile.cvs\",\"r\");\nprint_r(fgetcsv($f));\n\
    // 输出: Array([0]=>ant [1]=>bee [2]=>cat [3]=>dog)\n```\n\n## `fgets()` 语法\n\n\
    ```php\nfgets($file)\n```\n\n从指定的文件中读取一行。\n\ne.g.\n```php\n$f = fopen(\"myFile.txt\"\
    ,\"r\");\necho fgets($f);\n// 输出: This is one line text in myFile.txt\n```\n\n\
    ## `file()` 语法\n\n```php\nfile(\"filename.txt\")\n```\n\n将文件内容读取到数组。\n\ne.g.\n\
    ```php\nprint_r( file(\"myFile.txt\") );\n// 输出: Array ([0]=>Hi, this is myFile.txt.\
    \ [1]=>There are two lines in this file. [2]=>Here is the last line. )\n```\n\n\
    ## `fileatime()` 语法\n\n```php\nfileatime(\"file.txt\")\n```\n\n返回指定文件的最后访问时间。\n\
    \ne.g.\n```php\necho \"Last access: \".date(\"F d Y H:i:s.\", fileatime(\"myFile.txt\"\
    ));\n// 输出: Last access: May 17 2022 18:15:32.\n```\n\n## `filemtime()` 语法\n\n\
    ```php\nfilemtime(\"file.txt\")\n```\n\n返回指定文件的最后修改时间。\n\ne.g.\n```php\necho \"\
    Last modified: \".date(\"F d Y H:i:s.\", filemtime(\"d:\\\\myFile.txt\"));\n//\
    \ 输出: Last access: May 17 2022 18:15:32.\n```\n\n## 文件上传语法\n\n```html\n<input\
    \ type=\"file\" name=\"file\">\n```\n\n- `type=\"file\"` 指定用于上传文件的表单。\n- `name=\"\
    file\"` 指定被上传的 `\"file\"`，它将被传递给 PHP 文件处理。\n\ne.g. // 假设我们上传了一个名为 \"myFile.txt\"\
    \ 的文件\n```html\n<form action=\"\" enctype=\"form-data\">\n<input type=\"file\"\
    \ name=\"file\">\n<input type=\"submit\" value=\"Submit\">\n</form>\n```\n```php\n\
    <?php\necho \"Name: \" . $_FILES['name'];\necho \"Type: \" . $_FILES['type'];\n\
    echo \"Size: \" . $_FILES['size'];\necho \"Error: \" . $_FILES['error'];\n?>\n\
    ```\n\n## `file_exists()` 语法\n\n```php\nfile_exists(myFile)\n```\n\n如果文件存在则返回\
    \ true，否则返回 false。\n\ne.g.\n```php\nif (file_exists($f)) {\n    echo \"The file\
    \ exists\";\n} else {\n    echo \"The file does not exist\";\n}\n// 输出: The file\
    \ does not exist\n```\n\n## `filesize()` 语法\n\n```php\nfilesize(file)\n```\n\n\
