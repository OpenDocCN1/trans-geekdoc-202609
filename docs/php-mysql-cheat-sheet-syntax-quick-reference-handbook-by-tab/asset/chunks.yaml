  trans: "\n\n## `===` 语法\n\n```php\nvalue1 === value2\n```\n比较两个值，并比较两个值的类型。\n\n\
    例如：\n```php\nif(9 === \"9\"){echo 'equal';}\nelse{ echo 'not equal';}\n// 输出:\
    \ not equal\n```\n\n## `++$var` 和 `$var++` 语法\n\n```php\n++$var  // $var 加 1，并返回\
    \ $var\n$var++  // 返回 $var，然后 $var 再加 1\n```\n例如：\n```php\n$x=100; echo ++$x;\
    \     // 输出: 101\n$y=100; echo $y++;     // 输出: 100\n```\n\n## `--$var` 和 `$var--`\
    \ 语法\n\n```php\n--$var  // $var 减 1，并返回 $var\n$var--  // 返回 $var，然后 $var 减 1\n\
    ```\n例如：\n```php\n$x=100; echo --$x;     // 输出: 99\n$y=100; echo $y--;     //\
    \ 输出: 100\n```\n\n## `? :` 运算符语法\n\n```php\n(test-expression) ? (if-true-do-this)\
    \ : (if-false-do-this);\n```\n条件运算符检查 `test-expression` 是否为真或假，然后根据真假结果执行指定的代码块。\n\
    \n例如：\n```php\n$a = 100; $b = 200;\n$result = ($a<$b) ? \"apple \" : \"banana\
    \ \";\n// (检查 $a<$b 是否为真) ? (如果为真执行此操作) : (如果为假则执行此操作);\necho (\"$result<br>\"\
    );\n// 输出: apple\n```\n\n## `<=>` 语法\n\n```php\n$c = $a <=> $b;\n```\n如果 `$a >\
    \ $b`，则 `$c` 的值为 1。\n如果 `$a == $b`，则 `$c` 的值为 0。\n如果 `$a < $b`，则 `$c` 的值为 -1。\n\
    \n例如：\n```php\necho 10 <=> 10;     // 0\necho 3.14 <=> 3.10;     // 1\necho \"\
    ant\" <=> \"bee\";     // -1\n```\n\n## `__class__` 语法\n\n```php\n__class__\n\
    ```\n返回当前的类名。\n\n例如：\n```php\n<?php\nclass MyClass {\n    function myFun() {\n\
    \        echo 'The current class name is ' . __class__ ;      \n    }\n}\n$obj\
    \ = new MyClass();\n$obj->myFun();\n?>\n// 输出: The current class name is MyClass\n\
    ```\n\n## `__dir__` 语法\n\n```php\n__dir__\n```\n返回当前文件的目录。\n\n例如：\n```php\necho\
    \ 'The directory of current file is ' . __dir__ ;\n// 输出: The directory of current\
    \ file is C:\\www\n```\n\n## `__file__` 语法\n\n```php\n__file__\n```\n返回当前文件的路径和名称。\n\
    \n例如：\n```php\necho 'The file path and name are ' . __file__ ;\n// 输出: The file\
    \ path and name are C:\\www\\myFile.php\n```\n\n## `__function__` 语法\n\n```php\n\
    __function__\n```\n返回当前的函数名。\n\n例如：\n```php\n<?php\nfunction myFun() {\n    echo\
    \ 'The function name is ' . __function__ ;\n}\nmyFun();\n?>\n// 输出: The function\
    \ name is myFun\n```\n\n## `__line__` 语法\n\n```php\n__line__\n```\n返回文件中的当前行号。\n\
    \n例如：\n```php\necho 'The line number is ' . __line__ ;\n// 输出: The line number\
    \ is 2.\n```\n\n## `__method__` 语法\n\n```php\n__method__\n```\n返回类方法名。\n\n例如：\n\
    ```php\nfunction myFun() {\n    echo 'The function name is ' . __method__ ;\n\
    }\nmyFun();\n// 输出: The function name is myFun\n```\n\n## `__namespace__` 语法\n\
    \n```php\n__namespace__\n```\n返回命名空间的名称。\n\n例如：\n```php\nnamespace MyNamespace;\n\
    echo 'The namespace is ', __namespace__;\n// 输出: The namespace is MyNamespace.\n\
    ```\n\n## `__trait__` 语法\n\n```php\n__trait__\n```\n返回 trait 的名称。`trait` 用于定义可以在多个类中使用的方法。`trait`\
    \ 使程序员能够在不同的类中复用方法。\n\n例如：\n```php\n<?php\ntrait myTrait{\n    function myFun(){\n\
    \        echo 'The trait name is ' . __trait__ ; // 返回 trait 的名称\n    }\n}\nclass\
    \ MyClass{\n    use myTrait;\n}\n$obj = new MyClass;\n$obj->myFun();\n?>\n// 输出:\
    \ The trait name is myTrait\n```\n\n## `abs()` 语法\n\n```php\nabs(number)\n```\n\
    返回数字的绝对值。\n\n例如：\n```php\necho(abs(-12.345));\n// 输出: 12.345\n```\n\n## `abstract`\
    \ 语法\n\n```php\nabstract BaseClass{\n```\n`abstract BaseClass{}` \n`abstract`\
    \ 关键字用于定义抽象类。抽象类包含至少一个抽象方法。抽象类不能被实例化。\n\n例如：\n```php\n<?php\nabstract BaseClass\
    \ {\n    abstract function show();\n}\nclass Derived extends BaseClass {\n   \
    \ function show() {\n        echo \"Implement the abstract method\";\n    }\n\
    }\n```\n\n## `addslashes()` 语法\n\n```php\naddslashes(\" single quote or double\
    \ quote\n```\n在每个单引号或双引号前添加反斜杠。\n\n例如：\n```php\n$str = addslashes(\"This is 'good'!\"\
    );\necho($str);\n// 输出: This is \\'good\\'\n```\n\n## `alter table` 语法\n\n```php\n\
    $sql=\"alter table tableName add columnName type\";\n$query=mysqli_query($con,$sql);\n\
    ```\n`$sql=\"alter table tableName add columnName type\"` 用于在表中添加新列。`$query=mysqli_query($con,$sql)`\
    \ 执行查询。`$con` 是 MySQL 服务器的连接（参见 `mysqli_connect()`）。\n\n例如：\n```php\n<?php\n$con=\
    \ mysqli_connect( \"localhost\", \"root\", \"12345678\" );\nif( $con ) {  // 连接\
    \ MySQL 服务器成功\n    echo \" Connect successfully! \";\n}\n$select=mysqli_select_db(\
    \ $con, \"myDB\" );\nif( $select ) {  // 选择数据库 \"myDB\" 成功\n    echo \" Select\
    \ myDB successfully!<br> \";\n}  // 假设 myDB 有一个表 \"colortable\"\n$sql=\"alter\
    \ table colortable add column color5 varchar(20)\";\n// 在表中添加列 \"color5\"，类型为\
    \ \"varchar(20)\"\n$query=mysqli_query( $con,$sql);  // 执行查询\nif( $query ) {\n\
    \    echo \" Add a column successfully! \";\n}\n?>\n// 输出:\n// Connect successfully!\
    \ Select myDB successfully! Add a column successfully!\n```\n\n## `alter table`\
    \ 详细语法\n\n```sql\nalter table TableName add FieldName type modifier;   // 添加字段\n\
    alter table TableName add primary key (FieldName); // 添加主键\nalter table TableName\
    \ add unique (FieldName);       // 添加唯一约束\nalter table TableName alter FieldName\
    \ set/drop default; // 修改默认值\nalter table TableName change FieldName1 FieldName2...;\
    \ // 修改字段名\nalter table TableName drop FieldName;               // 删除字段\nalter\
    \ table TableName drop primary key;             // 删除主键\nalter table TableName\
    \ modify FieldName type modifier;  // 修改类型/修饰\n```\n例如：\n```sql\nuse library;\n\
    alter table books\nadd pages int not null,\nchange author writer char(20);\nexplain\
    \ books;\n```\n\n"
- fmt: "\n# Arithmetical Operator Syntax\n\n`$variable1` `operator` `$variable2`\n\
    \n// Assignment operators are `+`, `-`, `*`, `/`, `%`, `-`\n// `%` gets remainder,\
    \ `-` changes sign or subtracts a value \n\ne.g.\n```php\n$x=10;   $y=2;\necho\
    \ ($x + $y);     // output:  12\necho PHP_EOL;\necho ($x - $y);     // output:\
    \  8\necho PHP_EOL;\necho ($x * $y);     // output:  20\necho PHP_EOL;\necho ($x\
    \ / $y);     // output:  5\necho PHP_EOL;\necho ($x % $y);     // output:  0\n\
    echo PHP_EOL;  \necho -$x;           // output: -10\n```\n\n# array_change_key_case()\
    \ Syntax\n\n`array_change_key_case($array, CASE_UPPER / CASE_LOWER)`\n\n// Convert\
    \ all keys in an array to lowercase or uppercase\n\ne.g.\n```php\n$score=array(\"\
    Alf\"=>\"85\",\"Bob\"=>\"92\",\"Cin\"=>\"90\");\nprint_r(array_change_key_case($score,CASE_UPPER));\n\
    // Output:  Array([ALF] => 85 [BOB] => 92 [CIN] => 90)\n```\n\n# array_chunk()\
    \ Syntax\n\n`array_chunk($array, size)`\n\n// Split an array into multiple arrays\
    \ of a specific size\n\ne.g.\n```php\n$letter=array (\"A\", \"B\", \"C\", \"D\"\
    , \"E\", \"F\"); \nprint_r( array_chunk($letter,3) );  // each array with 3 elements\n\
    // Output:  \nArray(\n[0] => Array( [0] => A [1] => B [2] => C )\n[1] => Array(\
    \ [0] => D [1] => E [2] => F )\n)\n```\n\n# array_combine() Syntax\n\n`array_combine($arr1,$arr2)`\n\
    \n// Combine two arrays, arr1 becomes keys, arr2 becomes values\n\ne.g.\n```php\n\
    $arr1 = array(\"0\",\"1\",\"2\");\n$arr2 = array(\"a\",\"b\",\"c\");\n$cb = array_combine($arr1,$arr2);\n\
    print_r($cb);\n// Output:   Array ([0] => a [1] => b [2] => c )\n```\n\n# array_count_values()\
    \ Syntax\n\n`array_count_values($arr)`\n\n// Return an array using the values\
    \ as keys, the frequency as values.\n\ne.g.\n```php\n$arr=array(\"A\",\"B\",\"\
    C\",\"A\",\"C\",\"C\");     // 2A, 1B, 3C\nprint_r(array_count_values($arr));\n\
    // Output:  Array ([A] => 2 [B] => 1 [C] => 3 )\n```\n\n# Array Creating Syntax\
    \ (Basic)\n\n`$arrayName = array (\"value0\", \"value1\", \"value2\",…)`\n\n//\
    \ Create an array with multiple elements\n// The index of array starts with zero\n\
    \ne.g.\n```php\n$arr = array (\"A\", \"B\", \"C\");     // create an array $arr\n\
