    ```php\n$arr = array(\"ant\", \"bee\", \"cat\", \"dog\");\nif (in_array(\"cat\"\
    , $arr)){\n    echo \"The 'cat' is in the array\";\n}\n// 输出: The 'cat' is in\
    \ the array\n```\n\n# include() 语法\n\n```php\ninclude( \"anotherFile.php\" )\n\
