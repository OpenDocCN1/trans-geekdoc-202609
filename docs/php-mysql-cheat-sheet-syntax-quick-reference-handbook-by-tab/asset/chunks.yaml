    </note>\n```\n2.\n```php\n<?php\n$obj = new DOMDocument();\n$obj->load(\"myFile.xml\"\
    );\nprint $obj->saveXML();\n?>\n```\n// Output: Ray Yao Hi, My friend!\n\n# Appendix\n\
    \n## PHP Reserved Words Chart\n\n| | |\n| --- | --- |\n| and | array |\n| case\
