    \[0\] => Array( \[0\] => A    \[1\] => B    \[2\] => C )


    \[1\] => Array( \[0\] => D    \[1\] => E    \[2\] => F )


    )


    \-------------------------------------------------------------------------------


    array\_combine() syntax:


    array\_combine($arr1,$arr2);


    // Combine two arrays, arr1 becomes keys, arr2 becomes values


