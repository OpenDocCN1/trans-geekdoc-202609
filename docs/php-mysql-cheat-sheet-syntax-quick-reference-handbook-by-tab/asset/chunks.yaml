    \n```php\nheader(\"string_to_send\");\n// 在进行其他输出之前向客户端发送 HTTP 头部\n```\n\ne.g.\n\
    \n```php\nheader('Location: url');\n// 将当前网页页面重定向到另一个网页。\n\nheader(\"Cache-Control:\
