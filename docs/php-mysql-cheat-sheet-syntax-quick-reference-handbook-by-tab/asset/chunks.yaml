    \ 输出: `https%3A%2F%2Fwww.amazon.com%2F`\nhttps://www.amazon.com/\n\n## urlencode\
    \ 语法\n\n```php\nurlencode(\"data\")\n```\n\n// 对指定的数据编码。\n\n例如：\n\n```php\necho\
    \ urlencode(\"https://www.amazon.com/\");\n```\n\n// 输出: `https%3A%2F%2Fwww.amazon.com%2F`\n\
    \n"
- fmt: "\n# Use Database syntax\n\n```php\nuse DatabaseName;\n```\n\n// Select a database\
    \ in mysql server.\n\ne.g.\n\n```bash\nmysql> use myDatabase;\nDatabase changed\n\
    ```\n\n// `use myDatabase;` specifies to use a database named `myDatabase`.\n\
    // `Database changed` is responding message from the server.\n\n# usleep() syntax\n\
    \n```php\nusleep(microseconds)\n```\n\n// Delay running the current code for a\
    \ specified microseconds\n\ne.g.\n\n```php\nusleep(3000000);\n```\n\n// Pause\
    \ for 3000000 microsecond before continuing.\n\n# variable syntax\n\n```php\n\
    $variable =  value;\n```\n\n// variable name starts with `$` symbol.\n\ne.g.\n\
    \n```php\n$var = 100;    // define a variable\n$abcde = \"Hello World\";     //\
    \ define a variable\n$my_variable = \"Number1\";   // define a variable\necho\
    \ ( \"$var  $abcde  $my_variable\");\n```\n// Output:   100  Hello World  Number1\n\
    \n# var_dump() syntax\n\n```php\nvar_dump($var);\n```\n\n// Return the type and\
    \ value of a variable\n\ne.g.\n\n```php\n$x = 100;   var_dump($x);\n$y = 3.14;\
    \     var_dump($y);\n```\n// Output:     int(100)     float(3.14)\n\n# where condition\
    \ syntax\n\n```sql\nSELECT columnName FROM tableName WHERE columnName operator\
    \ value \n```\n\n// Extract only those records that meet with the specified condition\n\
    \ne.g.\n\n```php\n$sql = \"SELECT id, firstname, lastname FROM myTable WHERE id='1001'\"\
    ;\n```\n// Return the record where id is 1001\n\n# while Loop syntax\n\n```php\n\
    while ( test-expression ) {  // some php codes in here;  }\n```\n\n// Loop through\
    \ a block of code if the specified condition is true.\n\ne.g.\n\n```php\n$counter=0;\n\
    while ($counter < 8){  // loop at most 8 times\necho \"&\";\n$counter++;     //\
    \ increase 1 every loop\n}\n```\n// Output:   &&&&&&&&\n\n# wordwrap() syntax\n\
    \n```php\nwordwrap($string, length, \"\\n\");\n```\n\n// Wrap a string to a new\
