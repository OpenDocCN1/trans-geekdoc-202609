- fmt: "\n```php\n// Output:  Failed to connect to MySQL: No connection could be made\
    \ because the target machine actively refused it.\n```\n\n### const syntax\n\n\
    ```php\nconst CONSTANT = value;\n```\n// The value of `CONSTANT` is immutable\
    \ in runtime.\n\ne.g.\n```php\nconst NAME = \"Ray Yao\";     // define a constant\n\
    echo NAME;\n// Output:  Ray Yao\n```\n\n### constant() syntax\n\n```php\nconstant(\"\
    CONSTANT\");\n```\n// Return the value of the `CONSTANT`.\n\ne.g.\n```php\ndefine(\"\
    BOOK\", \"R in 8 Hours\", true);\necho constant(\"BOOK\");\n// Output:  R in 8\
    \ Hours\n```\n\n### constructor syntax\n\n```php\nfunction ClassName(){}\n```\n\
    // Constructor is used to initialize the class's variables\n// The constructor\
    \ name is always the same as the class name\n\ne.g.\n```php\n<?php\nclass Flower{\
    \     // define a class \"Flower\"\n    var $c;\n    function Flower( $arg ) {\
    \   // define a constructor\n    $this->c= $arg;   // initialize the variable\
    \ \"c\"\n    }\n}\n// $this represents the current object $obj\n$obj= new Flower(\
    \ 'beautiful' );     // create an object \"$obj\"\necho $obj->c;\n?>\n// Output:\
    \  beautiful\n```\n\n### continue statement syntax\n\n```php\nif ( // condition\
    \ ) continue;\n```\n// \"continue\" is used to stop the current loop according\
    \ to the condition, ignoring the subsequent code, and then continue the next loop.\n\
    \ne.g.\n```php\n<?php\n$num=0;\nwhile ($num<10){\n    $num++;\n    if ($num==5)\
    \ continue;   // go to the next loop if $num is 5\n    echo ( $num );    // skip\
    \ echo($num) if $num is 5\n}     // note:   the output has no the \"5\"\n?>\n\
    // output:  1234678910\n```\n\n### copy() syntax\n\n```php\necho copy(\"source_file\"\
    , \"target_file\");\n```\n// Copy the source file to the target file.\n\ne.g.\n\
    ```php\necho copy(\"file1.txt\",\"file2.txt\");\n// If the target file already\
    \ exists, it will be overwritten.\n```\n\n### count() syntax\n\n```php\ncount($array)\n\
    ```\n// Count the numbers of elements in an array\n\ne.g.\n```php\n$arr=array(\"\
    A\",\"B\",\"C\");\necho count($arr);\n// Output:  3\n```\n\n### count_chars()\
    \ syntax\n\n```php\ncount_chars(string, mode)\n```\n// Return information about\
    \ the string according to the following modes:\n// 0 - an array with ASCII value\
    \ as key, number of occurrences as value\n// 1 - an array with ASCII value as\
    \ key, number of occurrences as value (list number>0)\n// 2 - an array with ASCII\
    \ value as key, number of occurrences as value (list number=0)\n// 3 - a string\
    \ with used characters.\n// 4 - a string with unused characters.\n\ne.g.\n```php\n\
