  trans: "\n\n## 删除数据库语法：\n\n```sql\ndrop database if exists DatabaseName;\n```\n\
    // 在 `mysql` 服务器中删除数据库。\n\n例如：\n\n```sql\ndrop database if exists garage;\n```\n\
    // 如果数据库 `garage` 当前存在，则 `drop database if exists garage;` 会删除名为 `garage` 的数据库。\n\
    \n## 删除表语法：\n\n```sql\ndrop table if exists TableName;\n```\n// 在当前数据库中删除表。\n\n\
    例如：\n\n```sql\ndrop table if exists myTable;\n```\n// 如果表 `myTable` 当前存在，则 `drop\
    \ table if exists myTable;` 会删除名为 `myTable` 的表。\n\n## rename() 语法：\n\n```php\n\
    rename(oldfile, newfile);\n```\n// 将 `oldfile` 移动并重命名为 `newfile`。\n\n例如：\n\n```php\n\
    rename(\"/dir1/file1.txt\",\"/dir2/file2.txt\");\n```\n// 将 `/dir1/file1.txt`\
    \ 移动到 `/dir2/file2.txt`，并将 `file1.txt` 重命名为 `file2.txt`\n\n## require() 语法：\n\n\
    ```php\nrequire( \"anotherFile.php\" )\n```\n// 将 `another.php` 中的代码导入到当前文件。\n\
    // `require()` 通常位于文件顶部。如果程序出错，程序将停止运行。\n\n例如：\n\n1. `<!--file1.php-->`\n```php\n\
    <?php echo \" From file1.php \"; ?>\n```\n2. `<!--file2.php-->`\n```php\n<?php\
    \ \nrequire(\"file1.php\"); // 将 file1.php 导入此处\necho \" From file2.php \";\n\
    ?>\n```\n<!----run file2.php-->\n// 输出: From file1.php From file2.php\n\n## require_once()\
    \ 语法：\n\n```php\nrequire_once( \"anotherFile.php\" )\n```\n// 将 `another.php`\
    \ 中的代码导入到当前文件，仅导入一次。\n// `require_once()` 通常位于文件顶部。如果程序出错，程序将停止运行。\n\n例如：\n\n\
    1. `<!--file1.php-->`\n```php\n<?php echo \" From file1.php \"; ?>\n```\n2. `<!--file2.php-->`\n\
    ```php\n<?php \nrequire_once(\"file1.php\"); // 将 file1.php 导入此处一次\necho \" From\
    \ file2.php \";\n?>\n```\n// 输出: From file1.php From file2.php\n\n## 重置表单语法：\n\
    \n```html\n<input type=\"reset\" value=\"xxx\">\n```\n// 重置表单中的所有数据。\n// `value`\
    \ 属性设置按钮上的字符。\n\n例如：\n\n```html\n<form action=\"myfile.php\" method=\"post\">\n\
    <input type=\"reset\" value=\"RESET\">\n</form>\n```\n// 输出: | RESET |\n\n## reset()\
    \ 语法：\n\n```php\nreset($array)\n```\n// 返回数组的第一个元素。\n\n例如：\n```php\n$arr = array(\"\
    ant\", \"bee\", \"dog\");\necho reset($arr);\n```\n// 输出: ant\n\n## return 语法：\n\
    \n```php\nreturn value;\n```\n// `return value` 用于向函数调用者返回值。\n\n例如：\n```php\n\
    function multiply($x, $y){\n    return $x; // 向函数调用者返回值\n}\necho(multiply(10,20));\
    \ // 这是函数调用者\n```\n// 输出: 20\n\n## rmdir() 语法：\n\n```php\nrmdir($directory);\n\
    ```\n// 删除空目录。\n\n例如：\n```php\nrmdir('/temp/mydir'); // mydir 是一个空目录\n```\n\n\
    ## round() 语法：\n\n```php\nround($float, places)\n```\n// 根据指定的位数四舍五入 `$float`。\n\
    \n例如：\n```php\nvar_dump(round(3.1415926538, 3));\n```\n// 输出: 3.142\n\n## rsort()\
    \ 语法：\n\n```php\nrsort($array)\n```\n// 降序排序数组元素。\n\n例如：\n```php\n$arr=array(\"\
    30\",\"20\");\nrsort($arr);\nprint_r($arr);\n```\n// 输出: Array([0] => 30 [1] =>\
    \ 20)\n\n## rtrim() 语法：\n\n```php\nrtrim($string, substring)\n```\n// 从字符串右侧移除\
    \ `substring`。\n\n例如：\n```php\n$str = \"Hi, Friends\";\necho rtrim($str, \"Friends\"\
    ); // 移除\n```\n// 输出: Hi,\n\n## scandir() 语法：\n\n```php\nscandir(\"/directory\"\
    )\n```\n// 返回目录内所有的子目录和文件。\n\n例如：\n```php\n$array = scandir('/directory');\nprint_r($array);\n\
    ```\n// 输出: Array([0] => . [1] => .. [2] => subDir [3] => f1.php [4] => f2.txt)\n\
