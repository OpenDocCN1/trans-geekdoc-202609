  trans: "\n\n// `$pattern`: 表示要搜索内容的正则表达式。\n// `$string`: 执行搜索的字符串。\n\n例如：\n\n```php\n\
    $str = \"A cow plows field slowly in the downtown now\";\n$pattern = \"/ow/i\"\
    ;   // 查找字符串中所有 \"ow\" 的出现次数\n$match_num = preg_match_all($pattern, $str);\necho\
    \ \" The 'ow' occurrence number is $match_num\";\n// 输出:  The 'ow' occurrence\
    \ number is 6\n```\n\n## `preg_replace()` 语法\n\n`preg_replace(str1, str2, $string)`\n\
    \n// 使用正则表达式替换字符串中的 `str1` 为 `str2`。\n\n例如：\n```php\n$string = 'Scala in 8 Hours';\n\
    $pattern = '/scala/i';\necho preg_replace($pattern, 'Perl', $string);\n// 输出:\
    \  Perl in 8 Hours\n```\n\n## `preg_split()` 语法\n\n`preg_split($pattern, $string)`\n\
    \n// 使用模式作为分隔符将字符串拆为数组\n\n例如：\n```php\n$str = '10-12-2022';\n$patt = '/\\\\D/';\
    \    // 拆分任何非数字\n$array = preg_split($patt, $str);\nprint_r($array);\n// 输出: \
    \  Array([0] => 10     [1] => 12     [2] => 2022)\n```\n\n## `prepare()` 语法\n\n\
    `prepare(\"insert into tablename(var1,var2,var3)values(?,?,?)\")`\n`prepare(\"\
    select \\* from tablename where var1=? and var2=?\")`\n\n// 准备语句用于执行多个相同的 SQL\
    \ 语句。\n\n例如：\n```php\n<?php\n$con=new mysqli(\"servername\",\"username\",\"password\"\
    ,\"db\");  \n$stmt = $con->prepare(\"INSERT INTO myTable (firstname, lastname,\
    \ email) VALUES (?, ?, ?)\");  \n$stmt->bind_param(\"sss\", $firstname, $lastname,\
    \ $email); // 绑定\n// \"sss\" 表示 3 个字符串。如果是 \"ids\"，则表示 1 个整数、1 个双精度型、1 个字符串。\n\
    $firstname = \"Ray\";     $lastname = \"Yao\";  \n$email = \"xxx@yyy.com\";  \n\
    $stmt->execute();   // 执行  \necho \"Insert data successfully\";  \n?>\n// 输出:\
    \    Insert data successfully\n```\n\n## `prev()` 语法\n\n`prev($array)`\n\n// 返回数组中的上一个元素\n\
    \n例如：\n```php\n$a = array(\"A \", \"B \", \"C \");\necho current($a);  echo next($a);\
    \  echo prev($a);\n// 输出:   A  B  A\n```\n\n## `print` 语法\n\n`print \"content\"\
    ;`\n`print (\"content\");`\n\n// 输出字符串或变量的值。\n\n例如：\n```php\nprint \" Hello World!\"\
    ;\nprint (\" Hello World!\");\n// 输出:  Hello World!\n```\n\"echo\" 和 \"print\"\
    \ 的区别：\n// \"echo\" 可以输出一个或多个字符串，没有返回值。\n// \"print\" 仅输出一个字符串并可以返回值。\n\n## `printf()`\
    \ 语法\n\n`printf(\"%format\", $variable)`\n\n// 打印格式化字符串。\n// 用 `$variable` 的值替换\
    \ `%format`。\n// 关于 `%format`，请参见《字符串图表》。\n\n例如：\n```php\n$num = 8; $str = \"\
    Hours\";\nprintf(\"JAVA in %u %s.\", $num, $str);\n// $num 替换 %u, $str 替换 %s\n\
    // 输出:  JAVA in 8 Hours\n```\n\n## `print_r()` 语法\n\n`print_r($variable)`\n\n\
    // 打印显示存储在变量中的信息\n\n例如：\n```php\n$var = array(\"A\", \"B\", \"C\");\nprint_r($var);\n\
    // 输出:  Array ([0] => A [1] => B [2] => C)\n```\n\n## `private` 语法\n\n`private\
    \ $variable;`\n\n// 私有变量只能在类内部访问。\n\n例如：\n```php\n<?php\nclass MyClass {\n   \
    \ private $name = \"Ray\";\n    public function getName() {\n        return $this->name;\n\
    \    }\n}\n$obj = new MyClass();\n// echo $obj->name; // 错误：无法访问私有属性 name\necho\
    \ $obj->getName();\n// 输出: Ray\n```\n\n## `protected` 语法\n\n`protected $variable;`\n\
    \n// 受保护变量只能在类内部或其子类中访问。\n\n例如：\n```php\n<?php\nclass MyClass {\n    protected\
    \ $name = \"Yao\";\n    public function getName() {\n        return $this->name;\n\
    \    }\n}\nclass ChildClass extends MyClass {\n    public function getName() {\n\
    \        return $this->name;\n    }\n}\n$obj = new ChildClass();\necho $obj->getName();\n\
    // 输出: Yao\n```\n\n## `public` 语法\n\n`public $variable;`\n\n// 公有变量可以在类的任何地方访问。\n\
    \n例如：\n```php\n<?php\nclass MyClass {\n    public $name = \"John\";\n}\n$obj =\
    \ new MyClass();\necho $obj->name;\n// 输出: John\n```\n\n"
- fmt: "\n## remove database syntax:\n\n```sql\ndrop database if exists DatabaseName;\n\
    ```\n// Remove a database in `mysql` server.\n\ne.g.\n\n```sql\ndrop database\
    \ if exists garage;\n```\n// `drop database if exists garage;` removes a database\
    \ named `garage` if this database exists currently.\n\n## remove table syntax:\n\
    \n```sql\ndrop table if exists TableName;\n```\n// Remove a table in the current\
    \ database.\n\ne.g.\n\n```sql\ndrop table if exists myTable;\n```\n// `drop table\
    \ if exists myTable;` removes a table named `myTable` if this table exists currently.\n\
    \n## rename() syntax:\n\n```php\nrename(oldfile, newfile);\n```\n// Move and rename\
    \ `oldfile` to `newfile`.\n\ne.g.\n\n```php\nrename(\"/dir1/file1.txt\",\"/dir2/file2.txt\"\
    );\n```\n// Move `/dir1/file1.txt` to `/dir2/file2.txt`, and rename `file1.txt`\
    \ to `file2.txt`\n\n## require() syntax:\n\n```php\nrequire( \"anotherFile.php\"\
    \ )\n```\n// Import the code from `another.php` to the current file.\n// `require()`\
    \ is usually in the top of the file. If the program has an error, the program\
    \ will stop running.\n\ne.g.\n\n1. `<!--file1.php-->`\n```php\n<?php echo \" From\
    \ file1.php \"; ?>\n```\n2. `<!--file2.php-->`\n```php\n<?php \nrequire(\"file1.php\"\
    ); // import file1.php to here\necho \" From file2.php \";\n?>\n```\n<!----run\
    \ file2.php-->\n// Output: From file1.php From file2.php\n\n## require_once()\
    \ syntax:\n\n```php\nrequire_once( \"anotherFile.php\" )\n```\n// Import the code\
    \ from `another.php` to the current file for only once.\n// `require_once()` is\
    \ usually in the top of the file. If the program has an error, the program will\
    \ stop running.\n\ne.g.\n\n1. `<!--file1.php-->`\n```php\n<?php echo \" From file1.php\
    \ \"; ?>\n```\n2. `<!--file2.php-->`\n```php\n<?php \nrequire_once(\"file1.php\"\
    ); // import file1.php to here once\necho \" From file2.php \";\n?>\n```\n// Output:\
    \ From file1.php From file2.php\n\n## reset form syntax:\n\n```html\n<input type=\"\
    reset\" value=\"xxx\">\n```\n// Reset all data in the form.\n// `value` attribute\
    \ sets the characters on the button.\n\ne.g.\n\n```html\n<form action=\"myfile.php\"\
    \ method=\"post\">\n<input type=\"reset\" value=\"RESET\">\n</form>\n```\n// Output:\
    \ | RESET |\n\n## reset() syntax:\n\n```php\nreset($array)\n```\n// Return the\
    \ first element of array.\n\ne.g.\n```php\n$arr = array(\"ant\", \"bee\", \"dog\"\
    );\necho reset($arr);\n```\n// Output: ant\n\n## return syntax:\n\n```php\nreturn\
    \ value;\n```\n// `return value` is used to return a value to function caller.\n\
    \ne.g.\n```php\nfunction multiply($x, $y){\n    return $x; // return the value\
    \ to function caller\n}\necho(multiply(10,20)); // this is function caller\n```\n\
    // Output: 20\n\n## rmdir() syntax:\n\n```php\nrmdir($directory);\n```\n// Remove\
    \ the empty directory.\n\ne.g.\n```php\nrmdir('/temp/mydir'); // mydir is an empty\
    \ directory\n```\n\n## round() syntax:\n\n```php\nround($float, places)\n```\n\
    // Round up `$float` according to the number of decimal places.\n\ne.g.\n```php\n\
    var_dump(round(3.141592653598, 3));\n```\n// Output: 3.142\n\n## rsort() syntax:\n\
    \n```php\nrsort($array)\n```\n// Sort array element values in descending order.\n\
    \ne.g.\n```php\n$arr=array(\"30\",\"10\",\"20\");\nrsort($arr);\nprint_r($arr);\n\
    ```\n// Output: Array([0] => 30 [1] => 20 [2] => 10)\n\n## rtrim() syntax:\n\n\
    ```php\nrtrim($string, $substring)\n```\n// Remove `substring` from the right\
    \ side of a string.\n\ne.g.\n```php\n$str = \"Hi, Friends\";\necho rtrim($str,\
    \ \"Friends\"); // remove Friends\n```\n// Output: Hi,\n\n## scandir() syntax:\n\
    \n```php\nscandir(\"/directory\");\n```\n// Return all sub directories and files\
    \ inside the specified directory.\n\ne.g.\n```php\n$array = scandir('/directory');\n\
    print_r($array);\n```\n// Output: Array([0] => . [1] => .. [2] => subDir [3] =>\
    \ f1.php [4] => f2.txt)\n\n## select data syntax:\n\n```sql\nSELECT columnName\
    \ FROM tableName\nSELECT * FROM tableName\n```\n// Select data from one or more\
    \ tables. `*` means all columns.\n\ne.g.\n```php\n<?php \n$con=new mysqli(\"servername\"\
    ,\"username\",\"password\",\"db\"); \n$sql = \"SELECT id, lastname FROM myTable\"\
    ; \n$result = $con->query($sql); // execute the query \nif ($result->num_rows\
    \ > 0) { \n    while($row = $result->fetch_assoc()) { \n        echo \"ID: \"\
    .$row[\"id\"]. \" First Name: \".$row[\"firstname\"]. \"Last Name: \".$row[\"\
    lastname\"].PHP_EOL; // show data in each row \n    }\n} else { \n    echo \"\
    0 results\"; \n}\n?>\n```\n// `num_rows()` returns how many rows of the table.\n\
    // `fetch_assoc()` returns an assoc array that contains rows of a table. Its key\
    \ is always a string type. For example: `string => value`.\n\n## select data syntax:\n\
    \n```php\n$sql=\"select column from table-name\";\n$query=mysqli_query($con, $sql);\n\
    ```\n// `$sql=\"select column from table-name\"` is used to retrieve table data\
    \ by the column name from a table.\n// `$query=mysqli_query($con, $sql)` executes\
    \ the query.\n// `$con` is the connection to MySql server.\n\ne.g.\n```php\n<?php\n\
    $con= mysqli_connect( \"localhost\", \"root\", \"12345678\" );\nif( $con ) { //\
    \ if connect MySQL server successfully\n    echo \" Connect successfully! \";\n\
    }\n$select=mysqli_select_db( $con, \"myDB\" );\nif( $select ) { // if select database\
    \ \"myDB\" successfully\n    echo \" Select myDB successfully!<br> \";\n} // assume\
    \ that myDB has a table \"colortable\"\n$sql=\"select id, color1 from colortable\"\
    ;\n// select two columns \"id\" and \"color1\" in the table \"colortable\"\n$query=mysqli_query(\
    \ $con,$sql ); // run query\nif( $query ) {\n    echo \" Retrieve data successfully!\
    \ <br>\";\n}\nwhile($row = mysqli_fetch_array($query)){ // return array\n    echo(\"\
    <br> ID: \".$row[\"id\"]); // show $row[\"id\"] value\n    echo(\"<br> color1:\
    \ \".$row[\"color1\"]); // show $row[\"color1\"] value\n}\n?>\n```\n// Output:\
    \ Connect successfully! Select myDB successfully! Retrieve data successfully!\n\
    \n## select to show table syntax:\n\n```sql\nselect * from TableName;\n```\n//\
    \ Show and view all data in a table of a database.\n\ne.g.\n```sql\nuse library;\n\
    select * from books;\n```\n(image_rsrc716.jpg)\n// `select * from books;` shows\
    \ all data in the table `books`.\n// There are 3 records and 4 fields in the table\
    \ `books` of the \"library\".\n\n## select option syntax:\n\n```html\n<select\
    \ name=\"data\", id=\"xx\" multiple size = number>\n<option value=\"\">Please\
    \ select one item</option>\n<option value=\"value1\">text1</option>\n<option value=\"\
    value2\">text2</option>\n<option value=\"value3\">text3</option>\n</select>\n\
    ```\n// Get the value of the drop-down menu by the name property of the select.\
    \ If it is multiple selection, please use `multiple size='number'`.\n\ne.g.\n\
    ```php\n<?php\n$data = isset($_GET['data'])? htmlspecialchars($_GET['data']) :\
    \ \"\";\nif($data) { // get the data value from the form\n    if($data =='MATLAB')\
    \ { echo 'Matlab in 8 Hours'; }\n    else if($data=='KOTLIN') { echo 'Kotlin in\
    \ 8 Hours'; }\n    else if($data=='PANDAS') { echo 'Pandas in 8 Hours'; }\n} else\
    \ {\n?>\n<form action=\"\" method=\"get\">\n<select name=\"data\">\n<option value=\"\
    \">Please select one book</option>\n<option value=\"MATLAB\">Matlab</option>\n"
