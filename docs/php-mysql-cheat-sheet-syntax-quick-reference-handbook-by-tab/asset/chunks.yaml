    ### `ob_start()` 语法:


    ```php

    ob_start()

    ```


    // 启动输出缓冲区，存储要输出的内容。


    例如：


    ```php

    ob_start();  echo "This output can be seen";

    ob_end_flush();     // 关闭缓冲区

    // 输出: This output can be seen

    ```


    ---


    ### 对象 语法:


    ```php

    $object = new class-name;     // 创建一个对象

    $object->variable;     // 对象引用一个属性

    $object->functionName( );     // 对象引用一个方法

    ```


    // 对象是类的实例。


    例如：


    ```php

    <?php

    class MyClass{} // 定义一个类

    $p = "A class & object "; // 定义一个变量

    $obj= new MyClass(); // 创建一个对象 "obj"

    echo $obj-> p; // 对象引用一个变量

    ?>

    // 输出: A class & object

    ```


    ---


    ### 排序 语法:


    ```sql

    SELECT columnName FROM tableName ORDER columnName ASC|DESC

    ```


    // 按升序或降序排序记录


    例如：


    ```sql

    SELECT id, lastname FROM myTable ORDER firstName DESC

    // 按降序排序 firstName

    ```


    ---


    ### 方法重载 语法:


    ```php

    function __call($name, $arg){}

    ```


    // 不同对象调用同名但参数不同的方法，该方法会被调用。

    // `__call()` 可以实现方法重载

    // 当调用不存在的函数时会触发 `__call()`。

    // `$name` 是函数名，$arg` 是数组。


    例如：


    ```php

    <?php

    class MyClass {

    function __call($name, $arg){ // 重载

    return $arg[0] + $arg[1];

    }

    $obj1 = new MyClass();

    echo $obj1->sum(10, ); // 调用 __call()

    $obj2 = new MyClass();

    echo $obj2->sum(20,30); // 调用 __call()

    ?>

    // 输出: 10 50

    ```


    ---


    ### 覆盖 语法:


    ```php

    class BaseClass{function myFun(){}}

    class DerivedClass extends BaseClass{function myFun(){}}

    ```


    // 基类的方法和派生类的方法拥有相同的名称和参数，它们会被调用。

    // 覆盖意味着派生类的方法覆盖了基类的方法。


    例如：


    ```php

    <?php

    class Class1{

    public function show(){ // 基类的方法

    return '' Class1 Information '';

    }

    class Class2 extends Class1{

    public function show(){ // 基类的方法

    return '' Class2 Message '';

    }

    $obj1 = new Class1();

    echo $obj1->show();

    $obj2 = new Class2();

    echo $obj2->show();

    // 输出: Class1 Information Class2 Message

    ```


    ---


    ### `parent::__construct()` 语法:


    ```php

    parent::__construct();

    ```


    // 在派生类中，调用基类的构造函数。


