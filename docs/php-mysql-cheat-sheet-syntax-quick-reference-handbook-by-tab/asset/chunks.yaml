    ```php

    <?php

    class BaseClass {

    function __construct() {

    print "I am the constructor of base class" . PHP_EOL;

    }

    class DerivedClass extends BaseClass {

    function __construct() {

    parent::__construct(); // 调用基类构造函数

    }

    $obj = new DerivedClass();

    ?>

    // 输出: I am the constructor of base class

    ```


    ---


    ### `parse_str()` 语法:


    ```php

    parse_str(string, $array)

    ```


    // 将字符串解析为数组。


    例如：


    ```php

    $str = "a=b&c=d";

    parse_str($str, $output);

    print_r($output);

    // 输出: Array ( [a] => b [c] => d )

    ```


    ---


    ### `extract()` 语法:


    ```php

