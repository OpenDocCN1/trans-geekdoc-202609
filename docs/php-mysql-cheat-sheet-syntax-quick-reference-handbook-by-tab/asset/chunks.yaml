    ```php\nfputs($file, $string)\n```\n// fputs() 是 `fwrite` 的别名。\n\n#### 示例：\n```php\n\
    $file = fopen(\"test.txt\", \"w\");\nfputs($file, \"Hello World\");\nfclose($file);\n\
