  trans: "\n\n# SQL 基础操作指南\n\n| 语法表达式 | 功能描述 |\n| :--- | :--- |\n| `FieldName primary\
    \ key` | 将字段设置为主键 |\n| `group by FieldName` | 对字段中的数据进行分组 |\n| `having condition`\
    \ | 过滤分组 |\n| `insert into TableName (field1, field2, field3) values (value1,\
    \ value2, value3);` | 向表中插入数据 |\n| `order by field asc;` | 按升序排序数据 |\n| `order\
    \ by field desc;` | 按降序排序数据 |\n| `order by FieldName;` | 按字段对数据进行排序 |\n| `rename\
    \ table old_table_name to new_table_name;` | 重命名表（将旧表名更改为新表名） |\n| `rollback;`\
    \ | 回滚事务 |\n\n## 查询操作 (SELECT)\n\n| `select * from TableName;` | 显示表中的数据 |\n|\
    \ `select @variable_name;` | 显示变量值 |\n| `select * from FieldName as alias;` |\
    \ 设置字段别名 |\n| `select * from TableName where FieldName between... and...;` | 显示特定范围内的记录\
    \ |\n| `select * from TableName where FieldName != value;` | 显示不等于指定值的记录 |\n|\
    \ `select * from TableName where FieldName less/more than value;` | 显示小于或大于指定值的记录\
    \ |\n| `select * from TableName where expression1 and expression2;` | 显示满足两个条件的记录\
    \ |\n| `select * from TableName where expression1 or expression2;` | 显示满足一个条件的记录\
    \ |\n| `select * from TableName where FieldName in (value1, value2, value3);`\
    \ | 显示可用范围内的记录 |\n| `select * from TableName where FieldName like \"%value%\"\
    `` | 显示包含某些字符的相似值的记录 |\n| `select * from TableName where FieldName like \"_value_\"\
    `` | 显示包含单个字符的相似值的记录 |\n| `select * from TableName where FieldName regexp pattern;`\
    \ | 显示匹配指定模式的记录 |\n| `select * from TableName order by rand() limit n;` | 获取随机记录\
    \ |\n| `select * from TableName order by FieldName;` | 显示按字段排序的数据 |\n| `select\
    \ * from TableName where field = value;` | 显示特定的记录 |\n| `select * from TableName1\
    \ union all select * from TableName2 union all select * from TableName3;` | 在一个表中合并多个查询\
    \ |\n| `select @variable_name := value;` | 定义变量并显示其值 |\n| `select alias1.field1,\
    \ alias2.field2 from table1 as alias1 join table2 as alias2 on alias1.fieldname\
    \ = alias2.fieldname;` | 在一个表中显示两个连接表的数据 |\n| `select alias1.field1, alias2.field2\
    \ from table1 as alias1 left join table2 as alias2 on alias1.fieldname = alias2.fieldname;`\
    \ | 显示两个连接表的数据，包括完整的左表数据 |\n| `select alias1.field1, alias2.field2 from table1\
    \ as alias1 right join table2 as alias2 on alias1.fieldname = alias2.fieldname;`\
    \ | 显示两个连接表的数据，包括完整的右表数据 |\n| `select concat(field1, \"separator\", field2) from\
    \ TableName;` | 连接两个或多个字段 |\n| `select count(*) from TableName;` | 统计表中所有记录的数量\
    \ |\n| `select count(distinct FieldName) from TableName;` | 显示字段中唯一值的记录 |\n| `select\
    \ count(FieldName) from TableName;` | 统计字段中非空记录的数量 |\n| `select distinct FieldName\
    \ from TableName;` | 显示字段中唯一值的记录 |\n| `select Field, count(*) from Table group\
    \ by Field;` | 显示按字段分组的数据 |\n| `select Field1, Field2, Field3 from table1, table2,\
    \ table3;` | 在一个表中显示多个表 |\n| `select field1, field2, field3 from TableName;` |\
    \ 显示指定的字段 |\n| `select sum(FieldName) from TableName;` | 累加指定字段的值 |\n\n## 变量与系统设置\n\
    \n| `set @variable_name := value;` | 定义一个变量 |\n| `set autocommit=0;` | 禁用自动提交\
    \ |\n| `set autocommit=1;` | 开启自动提交 |\n| `show databases;` | 显示所有现有的数据库 |\n| `show\
    \ tables;` | 显示所有现有的表 |\n| `use DatabaseName;` | 选择一个数据库 |\n\n## 存储过程与更新\n\n```sql\n\
    stored procedure;\ndelimiter //create procedure ProcedureName()\nbegin\n    select\
    \ statement;\nend //delimiter;\n```\n\n| 语法表达式 | 功能描述 |\n| :--- | :--- |\n| `table1\
    \ join table2` | 连接 table1 和 table2 |\n| `table1 left join table2` | 连接两个表的数据，包括完整的左表数据\
    \ |\n| `table1 right join table2` | 连接两个表的数据，包括完整的右表数据 |\n| `update TableName\
    \ set field1 = value1, field2 = value2 where field = value;` | 更新字段 |\n| `update\
    \ TableName set FieldName = value;` | 更新字段中所有记录的数据 |\n| `update TableName set\
    \ FieldName = value; where condition;` | 更新字段中特定记录的数据 |\n\n---\n*由 Ray Yao 编写的速备指南*\n\
    \n"
