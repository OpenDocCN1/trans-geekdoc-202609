    \n```php\n$num = 8;\n$str = \"Hours\";\n$var = sprintf(\"%d %s\", $num, $str);\n\
    // Output: 8 Hours\n```\n\n---\n\n## sqrt() syntax\n\n```php\nsqrt(number)\n```\n\
    \n`// Return square root of a number`\n\ne.g.\n\n```php\necho sqrt(25);\n// Output:\
    \ 5\n```\n\n---\n\n## sscanf() syntax\n\n```php\nsscanf(string, format)\n```\n\
    \n`// Parse a string according to the specified format.`\n\ne.g.\n\n```php\n$str\
    \ = \"Java in 8\";\n$format = sscanf($str,\"%s %d\");\nprint_r($format);\n// Output:\
    \ Array([0] => Java [1] => 8)\n```\n\n---\n\n## static syntax\n\n```php\nstatic\
    \ $variable = value;\n```\n\n`// Static variable can retain the value from the\
