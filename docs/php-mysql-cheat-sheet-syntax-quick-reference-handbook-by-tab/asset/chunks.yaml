    ; // \"*\" represents all columns\n$query=mysqli_query( $con, $sql);\nwhile (\
    \ $array=mysqli_fetch_assoc($query) ){  // return an array\nprint_r($array); //\
    \ print_r( ) is used to print the array\necho \"<br>\";\n}\n?>\n// Output:\n//\
    \ Connect successfully!  Select myDB successfully!\n// Array (\n  [id] => 1\n\
    \  [color1] => red\n  [color2] => yellow\n  [color3] => green\n  [color4] => blue\n\
    \  [color5] => sky\n)\n// Array (\n  [id] => 2\n  [color1] => pink\n  [color2]\
    \ => navy\n  [color3] => purple\n  [color4] => orange\n  [color5] => olive\n)\n\
    ?>\n```\n\n## `mysqli_fetch_row()` syntax:\n\n`$array=mysqli_fetch_row($query)`\n\
    \n// `mysqli_fetch_row( )` returns an indexed array that contains rows of a table.\
    \ Its element key is always a number type. e.g. `[number]=>value`.\n\ne.g.\n\n\
    ```php\n<?php\n$con= mysqli_connect( \"localhost\", \"root\", \"12345678\" );\n\
    if( $con ) {     // if connect MySQL server successfully\necho  \" Connect successfully!\
    \ \";\n}\n$select=mysqli_select_db( $con, \"myDB\" );\nif( $select ) {  // select\
    \ database \"myDB\" successfully\necho  \" Select myDB successfully!<br> \";\n\
    }\n// assume that myDB has a table \"colortable\"\n$sql=\"select \\* from colortable\"\
    ; // \"*\" represents all columns\n$query=mysqli_query( $con, $sql);\nwhile (\
    \ $array=mysqli_fetch_row($query) ){  // return an array\nprint_r($array); //\
    \ print_r( ) is used to print the array\necho \"<br>\";\n}\n?>\n// Output:\n//\
    \ Connect successfully!  Select myDB successfully!\n// Array (\n  [0] => 1\n \
    \ [1] => red\n  [2] => yellow\n  [3] => green\n  [4] => blue\n  [5] => sky\n)\n\
    // Array (\n  [0] => 2\n  [1] => pink\n  [2] => navy\n  [3] => purple\n  [4] =>\
    \ orange\n  [5] => olive\n)\n?>\n```\n\n## `mysqli_free_result()` syntax:\n\n\
    `mysqli_free_result($result)`\n\n// Release the memory related to the result,\
    \ return true if succeed.\n\ne.g.\n\n```php\n$result = mysqli_query($con, \"SELECT\
    \ \\* FORM myTable\");\nvar_dump(mysqli_free_result($result));\n// Output:   bool(true)\n\
    ```\n"
