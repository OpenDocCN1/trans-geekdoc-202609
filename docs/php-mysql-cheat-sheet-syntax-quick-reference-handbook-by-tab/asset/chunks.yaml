    \ 小时学会 Kotlin. 8 小时学会 Pandas.\n\n---\n\n### chdir() 语法：\n\n```php\nchdir(\"directory\"\
    );\n```\n// 将工作目录更改到指定的目录\n\ne.g.\n\n```php\necho getcwd() . \"\\n\"; // 获取当前工作目录\n\
    chdir('myDirectory');  // 切换到 myDirectory\necho getcwd() . \"\\n\"; // 获取当前工作目录\n\
    ```\n// 输出:\n/home/study\n/home/study/myDirectory\n\n---\n\n### checkdate() 语法：\n\
    \n```php\ncheckdate(mm, dd, yyyy)\n```\n// 检查日期是否为有效的格里历日期。\n// 格里历是国际通用的民用历法。\n\
    \ne.g.\n\n```php\nvar_dump(checkdate(10, 30, 2022));\nvar_dump(checkdate(2, 30,\
    \ 2021));\n```\n// 输出: bool(true) bool(false)\n\n---\n\n### chmod() 语法：\n\n```php\n\
