    \   $y=2;\necho ($x + $y);     // 输出:  12\necho PHP_EOL;\necho ($x - $y);    \
    \ // 输出:  8\necho PHP_EOL;\necho ($x * $y);     // 输出:  20\necho PHP_EOL;\necho\
    \ ($x / $y);     // 输出:  5\necho PHP_EOL;\necho ($x % $y);     // 输出:  0\necho\
    \ PHP_EOL;  \necho -$x;           // 输出: -10\n```\n\n# array_change_key_case()\
    \ 语法\n\n`array_change_key_case($array, CASE_UPPER / CASE_LOWER)`\n\n// 将数组中的所有键转换为小写或大写\n\
    \ne.g.\n```php\n$score=array(\"Alf\"=>\"85\",\"Bob\"=>\"92\",\"Cin\"=>\"90\");\n\
    print_r(array_change_key_case($score,CASE_UPPER));\n// 输出:  Array([ALF] => 85\
    \ [BOB] => 92 [CIN] => 90)\n```\n\n# array_chunk() 语法\n\n`array_chunk($array,\
    \ size)`\n\n// 将数组分割多个指定大小的数组\n\ne.g.\n```php\n$letter=array (\"A\", \"B\", \"\
    C\", \"D\", \"E\", \"F\"); \nprint_r( array_chunk($letter,3) );  // 每个数组有 3 个元素\n\
    // 输出:  \nArray(\n[0] => Array( [0] => A [1] => B [2] => C )\n[1] => Array( [0]\
    \ => D [1] => E [2] => F )\n)\n```\n\n# array_combine() 语法\n\n`array_combine($arr1,$arr2)`\n\
    \n// 合并两个数组，arr1 变为键，arr2 变为值\n\ne.g.\n```php\n$arr1 = array(\"0\",\"1\",\"2\"\
    );\n$arr2 = array(\"a\",\"b\",\"c\");\n$cb = array_combine($arr1,$arr2);\nprint_r($cb);\n\
    // 输出:   Array ([0] => a [1] => b [2] => c )\n```\n\n# array_count_values() 语法\n\
    \n`array_count_values($arr)`\n\n// 返回一个以值作为键、频率为值的数组。\n\ne.g.\n```php\n$arr=array(\"\
    A\",\"B\",\"C\",\"A\",\"C\",\"C\");     // 2A, 1B, 3C\nprint_r(array_count_values($arr));\n\
    // 输出:  Array ([A] => 2 [B] => 1 [C] => 3 )\n```\n\n# 数组创建语法（基础）\n\n`$arrayName\
    \ = array (\"value0\", \"value1\", \"value2\",…)`\n\n// 创建一个包含多个元素的数组\n// 数组索引从零开始\n\
    \ne.g.\n```php\n$arr = array (\"A\", \"B\", \"C\");     // 创建一个数组 $arr\necho $arr[0];\
    \ echo $arr[1]; echo $arr[2];\n// 输出:   A B C\n```\n\n# 数组创建语法（手动）\n\n`$arrayName\
    \ = array ( )`\n`$arrayName[index0] = \"value0\";`\n`$arrayName[index1] = \"value1\"\
    ;`\n`$arrayName[index2] = \"value2\";`\n\n// 创建一个包含多个元素的数组\n// 数组索引从零开始\n\ne.g.\n\
    ```php\n$color = array(      // 创建一个数组 $color\n$color[0]='red'; $color[1]='yellow';\
    \ $color[2]='green';\necho $color[0]; echo $color[1]; echo $color[2];\n// 输出:\
    \   red yellow green\n```\n\n# array_diff() 语法\n\n`array_diff($array1,$array2)`\n\
    \n// 比较两个数组的值，返回差异\n\ne.g.\n```php\n$arr1=array(\"0\"=>\"a\",\"1\"=>\"b\",\"2\"\
    =>\"c\");\n$arr2=array(\"4\"=>\"a\",\"5\"=>\"b\",\"6\"=>\"c\");\n$diff=array_diff($arr1,$array2);\n\
    print_r($diff);\n// 输出:   Array([3] => a\n```\n\n# array_diff_assoc() 语法\n\n`array_diff_assoc($array1,$array2)`\n\
    \n// 比较两个数组的键和值，返回差异\n\ne.g.\n```php\n$arr1=array(\"0\"=>\"a\",\"1\"=>\"b\",\"\
