    ### `ob_get_length()`


    ```php

    ob_get_length()

    ```


    // 获取输出缓冲区内容的长度


    例如：


    ```php

    ob_start();

    echo "R in 8 Hours";     // 12 个字符

    $length = ob_get_length();

    echo "\n"."The length of the output buffer contents: $length ";

    // 输出: R in 8 Hours

    // The length of the output buffer content: 12

    ```


    ---


    ### `ob_get_level()` 语法:


    ```php

    ob_get_level()

    ```


    // 返回活动输出缓冲区的嵌套级别，如果没有活动则返回 0。


    例如：


    ```php

    ob_start();

