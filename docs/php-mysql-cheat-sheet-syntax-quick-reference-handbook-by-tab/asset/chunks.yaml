    \ for |\n| function | global |\n| if | include |\n| isset | include_once |\n|\
    \ list | list |\n| or | print |\n| require | return |\n| static | switch |\n|\
    \ unset | xor |\n\n## PHP Escaping Characters Chart\n\n| | |\n| --- | --- |\n\
    | `\\n` | outputs content to the next line. |\n| `\\r` | makes a return |\n| `\\\
    t` | makes a tab |\n| `\\'` | outputs a single quotation mark. |\n| `\\\"` | outputs\
