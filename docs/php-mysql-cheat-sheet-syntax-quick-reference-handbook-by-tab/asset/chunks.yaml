    ```php

    ob_start();

    echo "I will be stored in a variable. \n";

    $variable = ob_get_flush();   // 此时缓冲区已关闭

    echo "Variable value : $variable";

    // 输出: I will be stored in a variable.

    // Variable value : I will be stored in a variable.

    ```


