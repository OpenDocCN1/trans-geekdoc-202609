    \ // 如果为真执行此; }\nelse { // 如果为假执行此; }\n// \"if...else 语句\" 在测试返回真时运行部分代码，或者在测试返回假时运行另一部分代码。\n\
    ```\n\ne.g.\n\n```php\n<?php\n$x = 100; $y = 200;\nif ( $x > $y ){ // 如果真，运行此代码块\n\
    \    echo \"x 大于 y.\";\n}\nelse { // 如果假，运行此代码块\n    echo \"x 小于 y\";\n}\n?>\n\
    // 输出: x 小于 y\n```\n\n"
