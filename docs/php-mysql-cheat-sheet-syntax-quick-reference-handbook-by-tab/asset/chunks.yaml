    ![](img/image_rsrc70M.jpg)


    # PHP MySQL 速查手册

    (涵盖所有基础 PHP MySQL 语法，包含 300 多个示例)

    Ray Yao


    ## 关于本书

    本书涵盖了所有基础 PHP 语法，几乎每个语法条目都列出了程序示例和结果输出。我们可以快速参考最有帮助的编程语法，例如常用命令语法、字符串函数语法、集合函数语法、类与对象语法等等……这些语法对于编程都非常有用。


    我们可以将此书作为基础语法手册，因为它的条目按字母顺序排列，方便我们快速参考重要的语法。


    本书还包含了与 PHP 相关的基础 MySQL 语法。


    现在或将来，PHP 语法书籍都能为我们的学习和工作编码提供巨大的帮助。


    ## 免责声明

    本书仅作为基础语法手册；它无法包含该主题的所有条目。其目的是作为速查书籍的补充，而不是完整的 PHP 字典。


