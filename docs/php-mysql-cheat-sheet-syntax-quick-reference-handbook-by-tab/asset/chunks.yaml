    \ |\n| `%g` | `%e` 和 `%f` 中的较短者 |\n| `%G` | `%e` 和 `%f` 中的较短者 |\n| `%o` | 进制数\
    \ |\n| `%s` | 字符串 |\n| `%x` | 十进制数（小写字母） |\n| `%X` | 十进制数（大写字母） |\n\n## PHP 数据与时间格式表\n\
