    // foreach() 可以遍历数组的所有元素。\n\n#### 示例：\n```php\n$book=array( \"A\"=>\"JSP\", \"\
    B\"=>\"ASP\", \"C\"=>\"PHP\");\nforeach ( $book as $key => $value ){ // 迭代\n \
    \   echo \"The $key book is about $value. <br>\";\n} // $key 存储所有的键\n// 输出：\n\
    // The A book is about JSP.\n// The B book is about ASP.\n// The C book is about\
    \ PHP.\n```\n\n---\n\n### fprintf() 语法：\n\n```php\nfprintf($file, $format)\n```\n\
    // 向文件写入格式化字符串。\n\n#### 示例：\n```php\n$file = fopen(\"test.txt\", \"w\");\nfprintf($file,\
