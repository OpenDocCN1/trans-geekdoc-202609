    \ 8 Hours\n\n\\-------------------------------------------------------------------------------\n\
    \nsqrt() syntax:\n\nsqrt(number):\n\n// Return a square root of a number\n\ne.g.\n\
    \necho(sqrt(25).' ');  echo(sqrt(0.81).' ');\n\n// Output:       5       0.9\n\
    \n\\-------------------------------------------------------------------------------\n\
    \nsscanf() syntax:\n\nsscanf($string, \"%format\");\n\n// Parse a string according\
    \ to the specified format.\n\n// About %format, please see The String Format Chart.\n\
    \ne.g.\n\n$str = \"Java in 8 Hours\";\n\n$format = sscanf($str,\"%s %s %d %s\"\
    );\n\nprint\\_r($format);\n\n// Output:   Array(\\[0\\] => Java    \\[1\\] =>\
    \ in    \\[2\\] => 8    \\[3\\] => Hours)\n\n\\-------------------------------------------------------------------------------\n\
    \nstatic syntax:\n\nstatic $variable = value;\n\n// Static variable can retain\
    \ the value from the last time the function was called.\n\ne.g.\n\n<?php function\
    \ myFun() {\n\nstatic $var=10;   \n\necho $var++;    // $var value will keep to\
    \ next function call\n\necho \"  \";     \n\n}\n\nmyFun();  myFun();  myFun();\n\
    \n?>\n\n// Output:   10   11   12\n\n\\-------------------------------------------------------------------------------\n\
    \nstatic member syntax:\n\nstatic $variable = value;\n\nstatic function funName(){…}\n\
    \nClassName::$variable     // the class references the variable\n\nClassName::funName()     //\
    \ the class references the function\n\n// The static member can be directly called\
    \ by a class, not by an object.\n\ne.g.\n\n<?php\n\nclass MyClass {\n\npublic\
    \ static $staticVar = 'I am a static variable';\n\npublic static function staticFun(){\n\
    \necho \"I am a static function\";\n\n}}\n\nprint MyClass::$staticVar . PHP\\\
    _EOL;     // called by a class\n\nprint MyClass::staticFun() . PHP\\_EOL;    //\
    \ called by a class\n\n?>\n\n// Output:\n\nI am a static variable\n\nI am a static\
    \ function\n\n\\-------------------------------------------------------------------------------\n\
    \nstring syntax:\n\n$str = \"characters\";\n\n$str = 'characters';\n\n// String\
    \ consist of a sires of characters, which are enclosed by double quotes or single\
    \ quotes usually.\n\ne.g.\n\n$x = \" Hello world! \";\n\necho $x;\n\n$y = ' Hi,\
    \ my friend! ';\n\necho $y;\n\n// Output:   Hello world!  Hi, my friend!\n\n\\\
    -------------------------------------------------------------------------------\n\
    \nstring connecting syntax:\n\n$string1 . \" \" . $string2\n\n// Connect two strings\n\
    \ne.g.\n\n$book1 = \"PowerShell\";\n\n$book2 = \"in 8 Hours\";\n\necho $book1\
    \ . \" \" . $book2;\n\n// Output:   PowerShell in 8 Hours\n\n\\-------------------------------------------------------------------------------\n\
    \nstripos() syntax:\n\nstripos(string, substring)\n\n// Return the position of\
    \ the first occurrence of the substring in string.\n\n// stripos() is case insensitive.\n\
    \ne.g.\n\necho stripos(\"Powershell & Shell Scripting in 8 Hours\", \"Shell\"\
    );\n\n// Output:   5\n\n\\-------------------------------------------------------------------------------\n\
    \nstripslashes() syntax:\n\nstripslashes(\"backslashes\")\n\n// Remove backslashes\
    \ \\\\ and \\\\\\\\.\n\ne.g.\n\necho stripslashes(\"I don\\\\'t know!\");\n\n\
    // Output:   I don't know!\n\n\\-------------------------------------------------------------------------------\n\
    \nstristr() syntax:\n\nstristr(\"string\", \"substring\")\n\n// Search for the\
