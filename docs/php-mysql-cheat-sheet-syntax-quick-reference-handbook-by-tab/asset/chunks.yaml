    );\n// 在头部响应中设置 HTTP 状态。\n```\n\n```php\n<?php\nheader( \"Location:http://www.amazon.com\"\
    );  // 到亚马逊\n?>\n// 输出: (我们可以看到亚马逊的首页)\n```\n\n## heredoc 语法\n\n```php\n$var=\
    \ <<<EOF\ntexts\nEOF;\n// Heredoc 是在 PHP 代码中编写大量文本的方法，无需使用单引号或双引号分隔符。\n// Heredoc\
    \ 以 EOF 开始，以 EOF 结束。\n```\n\ne.g.\n\n```php\n$var=\"书是: \";\necho $var;\n// 输出:\
    \ 书是: \n```\n\n## htmlentities() 语法\n\n```php\nhtmlentities($characters)\n// 将字符转换为\
