    ?>\n```\n\n## `mysqli_fetch_assoc()` syntax:\n\n`$array=mysqli_fetch_assoc($query)`\n\
    \n// `mysqli_fetch_assoc( )` returns an assoc array that contains rows of a table.\
    \ Its element key is always a string type. e.g. `[string]=>value`.\n\ne.g.\n\n\
    ```php\n<?php\n$con= mysqli_connect( \"localhost\", \"root\", \"12345678\" );\n\
    if( $con ) {     // if connect MySQL server successfully\necho  \" Connect successfully!\
