- fmt: "\n## `eval()` syntax\n\n```php\neval($string)\n```\n\nEvaluate a string as\
    \ `PHP` code. The string must be valid `PHP` code and must end with semicolon.\n\
    \ne.g.\n\n```php\n$str = '$num = 100; echo $num;';\neval($str); // the $str is\
    \ php code\n// Output: 100\n```\n\n## `exec()` syntax\n\n```php\nexec('external_program');\n\
    ```\n\nExecute an external program or an external command.\n\ne.g.\n```php\necho\
    \ exec('whoami');\n// The function will return the last line of the executed program's\
    \ output.\n```\n\n## `extract()` syntax\n\n```php\nextract($array);\n```\n\nConvert\
    \ array keys into variable names and array values into variable value.\n\ne.g.\n\
    ```php\n$arr=array(\"a\"=>\"ant\", \"b\"=>\"bee\", \"c\"=>\"cat\", \"d\"=>\"dog\"\
    );\nextract($arr);\necho \"\\\\$a=$a; \\\\$b=$b; \\\\$c=$c; \\\\$d=$d\";\n// Output:\
    \ $a=ant; $b=bee; $c=cat; $d=dog\n```\n\n## `fclose()` syntax\n\n```php\nfcolse($openedFile)\n\
    ```\n\nClose the opened file.\nRelease memory resource, other processes using\
    \ the file.\n\ne.g.\n```php\n$filename = \"D:\\\\myfile.txt\"; // set the path\
    \ D:\\\\myfile.txt\n$openfile = fopen( $filename, w ); // open a file with w mode\n\
    $content = fwrite( $openfile, \"Hello!!\" ); // writing\nfcolse($openfile); //\
    \ close the opened file\n// After writing myfile.txt, we can use `fclose()` to\
    \ close the opened file.\n```\n\n## `feof()` syntax\n\n```php\nfeof($file)\n```\n\
    \nReturn true if reading reaches the end of file, return false if not.\n\ne.g.\n\
    ```php\n$f = fopen(\"myFile.txt\",\"r\");\nwhile( !feof($f) ){ // If don't read\
    \ to the end of the file, keep running\n$contents = fgets($f); // fgets($f) reads\
    \ the file\necho $contents. \"<br>\";\n}\n// Output: ( The following text is the\
    \ contents of the file )\nHi, this is myfile.txt, there are two lines in this\
    \ file.\nHere is the end of the file.\n```\n\n## `fgetc()` syntax\n\n```php\n\
    fgetc($file)\n```\n\nRead one character from the specified file.\n\ne.g.\n```php\n\
    $f = fopen(\"myFile.txt\",\"r\");\necho fgetc($f);\n// Output: R\n```\n\n## `fgetcvs()`\
    \ syntax\n\n```php\nfgetcvs($file)\n```\n\nRead one line from the cvs file.\n\n\
    e.g.\n```php\n$f = fopen(\"myFile.cvs\",\"r\");\nprint_r(fgetcsv($f));\n// Output:\
    \ Array([0]=>ant [1]=>bee [2]=>cat [3]=>dog)\n```\n\n## `fgets()` syntax\n\n```php\n\
    fgets($file)\n```\n\nRead one line from the specified file.\n\ne.g.\n```php\n\
    $f = fopen(\"myFile.txt\",\"r\");\necho fgets($f);\n// Output: This is one line\
    \ text in myFile.txt\n```\n\n## `file()` syntax\n\n```php\nfile(\"filename.txt\"\
    )\n```\n\nRead the contents of a file to an array.\n\ne.g.\n```php\nprint_r( file(\"\
    myFile.txt\") );\n// Output: Array ([0]=>Hi, this is myFile.txt. [1]=>There are\
    \ two lines in this file. [2]=>Here is the last line. )\n```\n\n## `fileatime()`\
    \ syntax\n\n```php\nfileatime(\"file.txt\")\n```\n\nReturn the last access time\
    \ of the specified file.\n\ne.g.\n```php\necho \"Last access: \".date(\"F d Y\
    \ H:i:s.\", fileatime(\"myFile.txt\"));\n// Output: Last access: May 17 2022 18:15:32.\n\
    ```\n\n## `filemtime()` syntax\n\n```php\nfilemtime(\"file.txt\")\n```\n\nReturn\
    \ the last modifying time of the specified file.\n\ne.g.\n```php\necho \"Last\
    \ modified: \".date(\"F d Y H:i:s.\", filemtime(\"d:\\\\myFile.txt\"));\n// Output:\
    \ Last access: May 17 2022 18:15:32.\n```\n\n## file uploading syntax\n\n```html\n\
    <input type=\"file\" name=\"file\">\n```\n\n- `type=\"file\"` specifies the form\
    \ that is used to upload file.\n- `name=\"file\"` specifies the uploaded `\"file\"\
    ` that will be passed to the PHP file for processing.\n\ne.g. // Assume that we\
    \ upload a file named \"myFile.txt\"\n```html\n<form action=\"\" enctype=\"form-data\"\
    >\n<input type=\"file\" name=\"file\">\n<input type=\"submit\" value=\"Submit\"\
    >\n</form>\n```\n```php\n<?php\necho \"Name: \" . $_FILES['name'];\necho \"Type:\
    \ \" . $_FILES['type'];\necho \"Size: \" . $_FILES['size'];\necho \"Error: \"\
    \ . $_FILES['error'];\n?>\n```\n\n## `file_exists()` syntax\n\n```php\nfile_exists(myFile)\n\
    ```\n\nReturn true if the file exists, return false if not.\n\ne.g.\n```php\n\
    if (file_exists($f)) {\n    echo \"The file exists\";\n} else {\n    echo \"The\
    \ file does not exist\";\n}\n// Output: The file does not exist\n```\n\n## `filesize()`\
    \ syntax\n\n```php\nfilesize(file)\n```\n\nReturn the size of the file in bytes.\n\
    \ne.g.\n```php\necho filesize(\"myFile\");\n// Output: 98\n```\n\n## `file_get_contents()`\
    \ syntax\n\n```php\nfile_get_contents(myFile)\n```\n\nRead the contents of the\
    \ file.\n\ne.g.\n```php\necho file_get_contents(\"myFile\");\n// Output: Hi, this\
    \ is myFile?\n```\n\n## `file_put_contents()` syntax\n\n```php\nfile_put_contents(myFile,\
    \ \"contents\")\n```\n\nWrite the contents to the file, and return length.\n\n\
    e.g.\n```php\necho file_put_contents(\"myFile\", \"Hi, this is myFile.\");\n//\
    \ Output: 23\n```\n\n## `filter_var()` syntax\n\n```php\nfilter_var(var, filter,\
    \ array(\"options\"=>function))\n```\n\nCall a user-defined function or built\
    \ function to filter the value.\n\ne.g.\n```php\n$str=\"jquery in hours\";\necho\
    \ filter_var($str, FILTER_CALLBACK, array(\"options\"=>\"strtoupper\"));\n// Output:\
    \ JQUERY IN HOURS\n```\n\n## `filter_has_var()` syntax\n\n```php\nfilter_has_var(type,\
    \ variable)\n```\n\nCheck if the form input has the specified value.\n\ne.g. //\
    \ assume that we didn't input url in the form\nif (!filter_has_var(INPUT_POST,\
    \ \"url\")){\n    echo(\"URL not found\");\n} else {\n    echo(\"URL found\");\n\
    }\n// Output: URL not found\n```\n\n## `filter_input()` syntax\n\n```php\nfilter_input(type,\
    \ variable, filter)\n```\n\nGet an external variable from the form input and filter\
    \ it.\n\n- type: `INPUT_GET`, `INPUT_POST`, `INPUT_COOKIE`, `INPUT_SERVER`, `INPUT_ENV`\n\
    - variable: an external variable from the form input\n- filter: various filters\
    \ (see Filter Chart)\n\ne.g.\n```php\nif(isset($_POST[\"email\"])){ // assume\
    \ that we input xxx@yyy.com\n    if(filter_input(INPUT_POST, \"email\", FILTER_VALIDATE_EMAIL)===false){\n\
    \        echo(\"Email format is not valid\");\n    } else {\n        echo(\"Email\
    \ format is valid\");\n    }\n}\n// Output: Email format is valid\n```\n\n## `filter_input_array()`\
    \ syntax\n\n```php\nfilter_input_array(type, array)\n```\n\nGet multiple external\
    \ variables from the form input and filter them.\n\n- type: `INPUT_GET`, `INPUT_POST`,\
    \ `INPUT_COOKIE`, `INPUT_SERVER`, `INPUT_ENV`\n- $array: multiple external variables\
    \ from the form input\n\ne.g.\n```php\n$arr = array ( // assume that we input\
    \ Ray Yao and 28 in the form\n```\n"
