- fmt: "\n\n# SQL 基础操作指南\n\n| 语法表达式 | 功能描述 |\n| :--- | :--- |\n| `FieldName primary\
    \ key` | set a field as a primary key |\n| `group by FieldName` | group data in\
    \ the field |\n| `having condition` | filter the groups |\n| `insert into TableName\
    \ (field1, field2, field3) values (value1, value2, value3);` | input data into\
    \ a table |\n| `order by field asc;` | sort the data in ascending order |\n| `order\
    \ by field desc;` | sort the data in descending order |\n| `order by FieldName;`\
    \ | sort the data in a field |\n| `rename table old_table_name to new_table_name;`\
    \ | rename a table (change an old table name to a new table name) |\n| `rollback;`\
    \ | cancel a transaction |\n\n## 查询操作 (SELECT)\n\n| `select * from TableName;`\
    \ | show table data |\n| `select @variable_name;` | show the variable value |\n\
    | `select * from FieldName as alias;` | set a field name |\n| `select * from TableName\
    \ where FieldName between... and...;` | show records in a certain range |\n| `select\
    \ * from TableName where FieldName != value;` | show records without a specified\
    \ value |\n| `select * from TableName where FieldName less/more than value;` |\
    \ show records less/more than a specified value |\n| `select * from TableName\
    \ where expression1 and expression2;` | show records that satisfy two conditions\
    \ |\n| `select * from TableName where expression1 or expression2;` | show records\
    \ that satisfy one of the conditions |\n| `select * from TableName where FieldName\
    \ in (value1, value2, value3);` | show records in an available range |\n| `select\
    \ * from TableName where FieldName like \"%value%\"`` | show records containing\
    \ a similar value with some characters |\n| `select * from TableName where FieldName\
    \ like \"_value_\"`` | show records containing a similar value with one character\
    \ |\n| `select * from TableName where FieldName regexp pattern;` | show records\
    \ whose value matches the specified pattern |\n| `select * from TableName order\
    \ by rand() limit n;` | get random records |\n| `select * from TableName order\
    \ by FieldName;` | show sorted data in a field |\n| `select * from TableName where\
    \ field = value;` | show a specified record |\n| `select * from TableName1 union\
    \ all select * from TableName2 union all select * from TableName3;` | combine\
    \ multiple select queries in one table |\n| `select @variable_name := value;`\
    \ | define a variable and show its value |\n| `select alias1.field1, alias2.field2\
    \ from table1 as alias1 join table2 as alias2 on alias1.fieldname = alias2.fieldname;`\
    \ | show two joined tables’ data in one table |\n| `select alias1.field1, alias2.field2\
    \ from table1 as alias1 left join table2 as alias2 on alias1.fieldname = alias2.fieldname;`\
    \ | show two joined tables’ data, including complete left-table data |\n| `select\
    \ alias1.field1, alias2.field2 from table1 as alias1 right join table2 as alias2\
    \ on alias1.fieldname = alias2.fieldname;` | show two joined tables’ data, including\
    \ complete right-table data |\n| `select concat(field1, \"separator\", field2)\
    \ from TableName;` | connect two or more fields together |\n| `select count(*)\
    \ from TableName;` | count all records in the table |\n| `select count(distinct\
    \ FieldName) from TableName;` | show the records with unique values in the specified\
    \ field |\n| `select count(FieldName) from TableName;` | count the non-empty records\
    \ in the field |\n| `select distinct FieldName from TableName;` | show the records\
    \ with unique values in the specified field |\n| `select Field, count(*) from\
    \ Table group by Field;` | show the data grouped by fields |\n| `select Field1,\
    \ Field2, Field3 from table1, table2, table3;` | show multiple tables in one table\
    \ |\n| `select field1, field2, field3 from TableName;` | show specified fields\
    \ |\n| `select sum(FieldName) from TableName;` | sum up the value of the specified\
    \ field |\n\n## 变量与系统设置\n\n| `set @variable_name := value;` | define a variable\
    \ |\n| `set autocommit=0;` | disable autocommit |\n| `set autocommit=1;` | enable\
    \ autocommit |\n| `show databases;` | show all existing databases |\n| `show tables;`\
    \ | show all the existing tables |\n| `use DatabaseName;` | select a database\
    \ |\n\n## 存储过程与更新\n\n```sql\nstored procedure;\ndelimiter //create procedure ProcedureName()\n\
    begin\n    select statement;\nend //delimiter;\n```\n\n| 语法表达式 | 功能描述 |\n| :---\
    \ | :--- |\n| `table1 join table2` | join table1 and table2 |\n| `table1 left\
    \ join table2` | join two table’s data, including complete left-table data |\n\
    | `table1 right join table2` | join two table’s data, including complete right-table\
    \ data |\n| `update TableName set field1 = value1, field2 = value2 where field\
    \ = value;` | update fields |\n| `update TableName set FieldName = value;` | update\
    \ the data for all records in a field |\n| `update TableName set FieldName = value;\
    \ where condition;` | update the data for a specified record in a field |\n\n\
    ---\n*Cheat Sheet by Ray Yao*\n"
