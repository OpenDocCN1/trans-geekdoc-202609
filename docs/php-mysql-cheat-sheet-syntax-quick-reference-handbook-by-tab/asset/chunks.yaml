    ob_start();

    $buf_level = ob_get_level();  echo " Buffer level: $buf_level ";

    ob_start();

    $buf_level = ob_get_level();  echo " Buffer level: $buf_level ";

    // 输出: Buffer level: 1      Buffer level: 2      Buffer level: 3

    ```


