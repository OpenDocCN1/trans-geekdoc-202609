    \ method. We will also create a class named child that inherits the “Parent” class.\
    \ \n\n#Create Class Parent\n\nclass Parent:\n\n    def methodA (self):\n\n       \
    \ print(\"Hello, I am a Parent class method\")\n\n#Create Class Child that inherits\
