    \ the “if” condition checks if num1 is greater than num2, which evaluates to false.\
    \ Hence, the “if” block is not executed. The control shifts to “else” statement\
    \ and the statement in the else block executes. The output of the script above\
    \ looks like this:\n\n![](Images/image00346.jpeg)\n\n### The “elif” statement\n\
    \nYou can evaluate multiple conditions using the “elif” statement. This is best\
