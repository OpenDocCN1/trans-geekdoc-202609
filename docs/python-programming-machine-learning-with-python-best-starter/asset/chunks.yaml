    \ following result:\n\n![](Images/image0354.jpeg)\n\nSimilarly, if you want to\
    \ access the last three elements of a list, execute the following script:\n\n\
    ```python\ncolors = ['Red', 'Green', 'Blue', 'Yellow', 'White']\nsublist = colors[-3:]\n\
    print(sublist)\n```\n\nThe result looks like this:\n\n![](Images/image0355.jpeg)\n\
    \nFinally, you can also access range of items from a list using slice operator.\n\
    \n```python\ncolors = ['Red', 'Green', 'Blue', 'Yellow', 'White']\nsublist = colors[2:4]\n\
    print(sublist)\n```\n\nThe above function returns range of elements from the 2nd\
    \ index up to one less than the 4th index i.e. elements at index 2 and 3. The\
    \ output looks like this:\n\n![](Images/image0356.jpeg)\n\n#### Appending elements\
    \ to a list\n\nThe `append` function can be used to append elements to a list.\
    \ The item to append is passed as parameter to the `append` function. Take a look\
    \ at the following example:\n\n```python\ncolors = ['Red', 'Green', 'Blue', 'Yellow',\
    \ 'White']\nprint(colors)\ncolors.append('Orange')\nprint(colors)\n```\n\nIn the\
    \ script above, we create a list, `colors` with five items. We print the list\
    \ on console. We then append an item to the list and again print the list on the\
    \ console. The output looks like this:\n\n![](Images/image0357.jpeg)\n"
  trans: "\n\n`range` 函数也可以用于创建一个特定范围内的整数序列。例如，如果你想创建一个从 `50` 到 `100` 的整数序列，可以按照如下方式操作：\n\
    \n```python\nfor i in range(50,101):\n    print(i)\n```\n\n请记住，`range` 函数返回的序列包含下界整数，但不包含上界。因此，上面的脚本将返回从\
    \ 50 到 100 的整数，但不包含 101。\n\n## 遍历字符串\n\n`for` 循环也可以用于遍历字符串。这是因为字符串实际上是字符的序列。请看下面的脚本：\n\
    \n```python\nfor c in 'Hello world':\n    print(c)\n```\n\n输出结果将如下：\n\n![](img/image00350.jpeg)\n\
    \n## “while”循环\n\n`for` 循环执行的次数等于循环所操作的序列中的项目数量。如果我们想要一个在满足特定条件时终止的循环呢？`while`\
    \ 循环就是答案；`while` 循环会执行，直到满足某个条件为止。`while` 循环的语法如下：\n\n```python\nwhile (expression\
    \ = true):\n    statement1 …\n    statement2 …\n```\n\n基本上，`while` 循环检查其后的表达式是否为真（true）。它会一直执行，直到表达式返回真。请看以下脚本来理解\
    \ `while` 循环：\n\n```python\ni = 1\nwhile i < 11:\n    print(i)\n    i = i+1\n\
    ```\n\n在上面的脚本中，我们初始化变量 `i` 为整数 `1`。然后我们创建了一个 `while` 循环，检查变量 `i` 的值是否小于 `11`。在每次迭代中，我们在\
    \ `while` 循环内部将 `i` 的值加 `1`。在循环执行 10 次后，`i` 的值变为 `11`。因此，条件 `i` 小于 `11` 返回为假（false），因此\
    \ `while` 循环终止。\n\n让我们尝试使用 `while` 循环打印 9 的九法表。请看下面的脚本：\n\n```python\ni = 1\n\
    while i < 11:\n    print('9 x '+ str(i) + ' = ' + str(i * 9))\n    i = i+1\n```\n\
    \n上面脚本的输出如下：\n\n![](img/image00351.jpeg)\n\n## Continue 语句\n\n`continue` 语句用于跳过循环中的剩余语句并将控制权移回循环的开头。`continue`\
    \ 语句可以用于 `for` 循环也可以用于 `while` 循环。请看下面的示例来查看 `continue` 语句的作用。\n\n```python\n\
    for i in range(1,11):\n    if(i%2) != 0:\n        continue\n    print(i)\n```\n\
    \n在上面的脚本中，我们使用 `for` 循环遍历从 1 到 10 的整数序列。在每次迭代中，我们检查该整数是否为偶数。为了做到，我们将整数除以 `2` 并检查结果是否为\
    \ `0`。如果整数是偶数，我们就在控制台上打印它；如果整数不是偶数，我们则使用 `continue` 语句回到 `for` 循环体的开头，跳过 `print`\
    \ 语句。脚本的输出包含 2 到 10 之间的偶数，如下所示：\n\n![](img/image0352.jpeg)\n\n## Break 语句\n\n\
    `break` 语句用于终止循环的执行。`break` 语句可以用于 `for` 循环也可以用于 `while` 循环。请看下面的语句来查看 `break`\
    \ 语句的作用。\n\n```python\nfor i in range(1,11):\n    if(i > 5):\n        break\n\
    \    print(i)\n```\n\n在上面的脚本中，当 `i` 的值大于 `5` 时，`for` 循环终止。\n\n## 接下来是什么？\n\n我们已经涵盖了大部分\
    \ Python 基本概念。从下一章开始，我们将注意力转向高级 Python 概念的深入分析。在下一章中，我们将详细学习序列。我们将对列表（lists）、元组（tuples）、字典（dictionaries）以及可以在这些执行的函数进行深入分析。\n\
    \n## 第 8 章 列表、元组和字典\n\n我们在第四章：变量与数据类型中简要回顾了列表、元组和字典。它们是 Python 中最重要的数据结构之一。在本章中，我们将详细查看列表、元组和字典及其工作原理。\n\
    \n### 列表 (Lists)\n\nPython 中的列表类似于其他编程语言中的数组。列表存储不同类型的集合，并且是可变的（mutable）。\n\n\
    #### 创建列表\n\n有多种方法可以创建列表。最简单的方法是将逗号分隔的项包含方括号内，并将其赋值给变量，如下所示：\n\n```python\ncolors\
    \ = ['Red', 'Green', 'Blue', 'Yellow', 'White']\n```\n\n上面的脚本创建了一个名为 `colors`\
    \ 的列表。创建列表的其他方法是使用构造函数 `[]` 和 `list()`。\n\n```python\ncolors2 = []\ncolors3 =\
    \ list()\n```\n\n上面的脚本创建两个空列表：`colors2` 和 `colors3`。要创建整数序列的列表，可以使用 `range` 函数并使用\
    \ `list` 函数转换为列表。`range` 函数返回一个从 0 到小于传递值的整数列表。如下所示：\n\n```python\nnums = list(range(10))\n\
    ```\n\n`range` 函数返回一个从 0 到小于传递值的整数列表。如果你想指定范围，可以向 `range` 传递两个值：\n\n```python\n\
    nums = list(range(50,101))\n```\n\n`range` 函数返回一个从 50 到 100 的整数列表（不包含 101）。\n\n\
    #### 访问元素\n\n列表是有索引的，这意味着你可以通过索引访问元素。第一个元素存储在索引 0 ：\n\n```python\ncolors = ['Red',\
    \ 'Green', 'Blue', 'Yellow', 'White']\nprint(colors[1])\n```\n\n上面的脚本在控制台上打印‘Green’。列表是可变的，这意味着你可以更改特定索引的值。让我们将第三索引的值从‘Blue’改为‘Black’：\n\
    \n```python\ncolors = ['Red', 'Green', 'Blue', 'Yellow', 'White']\nprint(colors)\n\
    colors[2] = 'Black'\nprint(colors)\n```\n\n在上面的脚本中，我们在设置第三索引的值之前之后打印了 `colors`\
    \ 列表。输出如下：\n\n![](img/image0353.jpeg)\n\n你可以使用切片操作（即 `:`）一次性访问多个列表元素。例如，如果你想访问列表的前三个元素，可以使用切片操作：\n\
    \n```python\ncolors = ['Red', 'Green', 'Blue', 'Yellow', 'White']\nsublist = colors[:3]\n\
    print(sublist)\n```\n\n上面的脚本返回如下：\n\n![](img/image0354.jpeg)\n\n同样，如果你想访问列表的最后三个元素，执行以下脚本：\n\
    \n```python\ncolors = ['Red', 'Green', 'Blue', 'Yellow', 'White']\nsublist = colors[-3:]\n\
    print(sublist)\n```\n\n结果如下：\n\n![](img/image0355.jpeg)\n\n最后，你也可以使用切片操作访问列表的范围内的项目。\n\
    \n```python\ncolors = ['Red', 'Green', 'Blue', 'Yellow', 'White']\nsublist = colors[2:4]\n\
    print(sublist)\n```\n\n上面的函数返回从索引 2 到小于索引 4 的元素范围（即索引为 2 和 3 的元素）。输出如下：\n\n![](img/image0356.jpeg)\n\
    \n#### 向列表添加元素\n\n`append` 函数可用于向列表添加元素。要添加的项目作为参数传递给 `append` 函数。请看下面的示例：\n\n\
    ```python\ncolors = ['Red', 'Green', 'Blue', 'Yellow', 'White']\nprint(colors)\n\
    colors.append('Orange')\nprint(colors)\n```\n\n在上面的脚本中，我们创建了一个包含五个项目的 `colors`\
    \ 列表。我们在控制台上打印该列表。然后向列表添加了一个项目，并再次打印列表。输出如下：\n\n![](img/image0357.jpeg)\n\n"
