    \ you just have to pass the parent class name inside the parenthesis that follow\
    \ the child class name. In the above script Parent class contains a method named\
    \ methodA, while the child class also contains a method named methodB. We then\
    \ create a child class object named “child”. From this “child” object we call\
    \ the methodA. You can see that though Child class doesn’t contain methodA, but\
    \ since it is inheriting Parent class which contains methodA, therefore the Child\
    \ class object can also access this method. Finally we call the Child class method\
    \ methodB. The output of the script above looks like this:\n\n![](Images/image00408.jpeg)\n\
    \nLike methods, the child class also inherits attributes from parent class. Take\
    \ a look at the following example:\n\n#Create Class Parent\n\nclass Parent:\n\n\
        name =\"\"\n\n    age = \"\"\n\n    def methodA (self):\n\n        print(\"\
    Hello, I am a Parent class method\")\n\n#Create Class Child that inherits Parent\n\
    \nclass Child(Parent):\n\n    def methodB (self):\n\n        print(\"Hello, I\
