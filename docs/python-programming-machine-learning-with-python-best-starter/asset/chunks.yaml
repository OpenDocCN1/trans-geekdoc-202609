    \ Python 中的实现。\n\n# 第 10 章\n\n## 用于分类的 K 邻算法\n\n在上一章中，我们学习了用于分类的朴叶贝斯算法。我们提到 NB\
    \ 算法假设特征独立性。此外，NB 算法的一个缺点是它假设分类特征值呈正态分布。然而在大多数情况下，现实世界的数据并不遵循任何趋势，例如均匀分布或线性可分性等。在这种情况下，非参数算法可以派上用场。K\
    \ 邻（KNN）算法就是这样一种非参数算法。\n\n### KNN 理论\n\n"
