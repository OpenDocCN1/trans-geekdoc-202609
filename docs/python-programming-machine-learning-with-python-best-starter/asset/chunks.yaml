- raw: "Unlike most of the other programming languages, Python code is not evaluated\
    \ at runtime since Python is a loosely typed language. The type of the variable\
    \ is evaluated at runtime. There are both pros and cons of this approach. The\
    \ major advantage of this approach is that a user doesn’t have to specify the\
    \ type of the variable while writing a code. A major drawback is that it can lead\
    \ to exceptions at runtime. We will see this with the help of en example in this\
    \ article, but first let’s see how a simple exception is handled in Python\n\n\
    ### Syntax for Exception Handing\n\nThe syntax for exception handling is as follows:\n\
    \nTry:\n\n#the code that can raise exception\n\nexcept ExceptionA\n\n#the code\
    \ to execute if ExceptionA occurs\n\nexcept ExceptionB\n\n#the code to execute\
    \ if ExceptionA occurs\n\nexcept ExceptionC\n\n#the code to execute if ExceptionA\
    \ occurs\n\nelse:\n\n#Code to execute if there is no exception\n\nThe code that\
    \ you think can raise an exception is surrounded by try block followed by one\
    \ or more except blocks depending upon the type of exceptions that you want to\
    \ handle. If none of the exceptions occur, the else block executes. \n\n### Handling\
    \ Single Exception\n\nExample 1\n\nTake a look at a very simple example of exception\
    \ handling. Let us first write a program without exception handling. Execute the\
    \ following script:\n\nnum1 = 10\n\nnum2 = 0\n\nresult = num1/num2\n\nprint(result)\n\
    \nIn the script above we have two variables num1 and num2. We try to divide num1\
    \ by num2 and print the result on the console. However, num2 contains 0. Therefore,\
    \ the division will not be successful since a number cannot be divided by zero.\
    \ An error will be thrown that looks like this:\n\n![](Images/image00380.jpeg)\n\
    \nThe name of the exception is “ZeroDivisionError” and it occurs when a number\
    \ is divided by zero. Let’s see how we can handle this exception.\n\nTake a look\
    \ at the following script:\n\ntry:\n\n   num1 = 10\n\n   num2 = 0\n\n   result\
    \ = num1/num2\n\n   print(result) \n\nexcept ZeroDivisionError:\n\n   print (\"\
    Sorry, division by zero not possible\")\n\nelse:\n\n    print(\"Program executed\
    \ without an exception\")\n\nIn the script above, the code that throws an exception\
    \ is enclosed in a try block. In the previous example, the code threw ZeroDivisionError.\
    \ Therefore, we handle this exception using except literal. Inside the ‘except’\
    \ block the reason for the exception is printed. Finally, we have an else block\
    \ that executes if the exception doesn’t occur. Since we are dividing num1 by\
    \ zero, the statement in the ‘except’ block will execute and the output will look\
    \ like this:\n\n![](Images/image00381.jpeg)\n\nNow, if you change the value of\
    \ num2 in code to 2. The exception will not occur and the output will display\
    \ the code in the else block that looks like this:\n\n![](Images/image00382.jpeg)\n\
    \nHence, handling an exception prevents a program from crashing.\n\nExample2\n\
    \nA program can throw multiple types of exceptions. Take a look at the following\
    \ example to understand this concept:\n\ntry:\n\n   result = a/b\n\n   print(result)\
    \ \n\nexcept ZeroDivisionError:\n\n   print (\"Sorry, division by zero not possible\"\
    )\n\nelse:\n\n    print(\"Program executed without an exception\")\n\nIn the script\
    \ above we try to divide ‘a’ by ‘b’. We have handled the ZeroDivisonError exception.\
    \ Therefore, if b contains 0, the exception will be handled. Else, if no exception\
    \ occurs the else block will execute.\n\nWhen you run the script above, you will\
    \ see following exception:\n\n![](Images/image00383.jpeg)\n\nFrom the output you\
    \ can see that the name of the exception is “NameError” and the exception says\
    \ that the name ‘a’ is not defined. This means that we are using a variable without\
    \ first defining it. \n\nTo handle this exception, execute the following code:\n\
    \ntry:\n\n   result = a/b\n\n   print(result) \n\nexcept NameError:\n\n   print\
    \ (\"Some variable/s are not defined\")\n\nelse:\n\n    print(\"Program executed\
    \ without an exception\")\n\nYou can see that different types of exceptions are\
    \ raised due to different reasons. In order to build a robust program, a user\
    \ should handle all the possible exceptions. A list of different types of Python\
    \ exceptions is available at the following link:\n\n[https://docs.python.org/3/library/exceptions.html](https://docs.python.org/3/library/exceptions.html)\n\
    \n### Handling Multiple Exceptions\n\nTo handle multiple exceptions, you just\
    \ have to stack one exception handling block over the other. Take a look at the\
    \ following exception:\n\ntry:\n\n   num1 = 10\n\n   num2 = 2\n\n   result = num1/num2\n\
    \n   print(result) \n\nexcept ZeroDivisionError:\n\n   print (\"Sorry, division\
    \ by zero not possible\")\n\nexcept NameError:\n\n   print (\"Some variable/s\
    \ are not defined\")\n\nelse:\n\n    print(\"Program executed without an exception\"\
    )\n\nIn the script above, both the “ZeroDivisionError” and “NameError” exceptions\
    \ are handled. Therefore, if you set the value of num2 to 0, the “ZeroDivisionError”\
    \ exception will occur. However if you try to divide the num1 by ‘b’, the “NameError”\
    \ exception will occur since the variable “b” is not defined. Finally if none\
    \ of the exception occurs, the statement in the else block will execute. \n\n\
    Another way to handle multiple exceptions is by using Exception object which is\
    \ base class for all the exceptions. The Exception object can be used to handle\
    \ all types of exceptions. Take a look at the following example.\n\ntry:\n\n  \
    \ num1 = 10\n\n   num2 = 0\n\n   result = num1/num2\n\n   print(result) \n\nexcept\
    \ Exception:\n\n   print (\"Sorry, program cannot continue\")\n\nelse:\n\n   \
    \ print(\"Program executed without an exception\")\n\nIn the script above, all\
    \ the different types of exceptions will be handled by code block for Exception\
    \ object. Therefore, a generic message will be printed to the user. In the script\
    \ above, the num2 contains zero. Therefore, the “ZeroDivisionError” exception\
    \ will occur. The result will look like this:\n\n![](Images/image00384.jpeg)\n\
    \nWhat’s next?\n\nIn this chapter we studies how we can handle exceptions in Python.\
    \ In the next chapter we will see how to perform file handling tasks with Python.\
    \ Happy Coding!!!\n\n#  \n\n# Chapter 10\n\n## Python File Handling\n\nFile handling\
    \ refers to performing variety of operations on different types of file. The most\
    \ common file handling operations are opening a file, reading file contents, creating\
    \ a file, writing data to a file, appending data to a file etc. Like every other\
    \ programming language, Python supports almost all the major file handling functions.\
    \ In this chapter, we will study how file handling can be achieved with Python.\n\
    \n### Opening a File\n\nBefore you perform any function on a file, you need to\
    \ open it. To open a file in python the open function is used. It takes 3 parameters:\
    \ The path to the file, the mode in which the file should be opened and the buffer\
    \ size in number of lines. The third parameter is optional. The open function\
    \ returns file object. The syntax of the open function is as follows:\n\nfile\\\
    _object = open(file\\_name, file\\_mode, buffer\\_size)\n\nTake a look at the\
    \ following table for different types of modes along with their description:\n\
    \n| Mode || Description |\n\n| --- | --- |\n\n| R || Opens file for read only\
    \ |\n\n| r+ || Opens file for reading and writing |\n\n| Rb || Only Read file\
    \ in binary |\n\n| rb+ || Opens file to read and write in binary |\n\n| W || Opens\
    \ file to write only. Overwrites existing files with same name |\n\n| Wb || Opens\
    \ file to write only in binary. Overwrites existing files with same name |\n\n\
    | w+ || Opens file for reading and writing |\n\n| Wb || Opens file to read and\
    \ write in binary. Overwrites existing files with same name |\n\n| A || Opens\
    \ a file for appending content at the end of the file |\n\n| a+  || Opens file\
    \ for appending as well as reading content |\n\n| Ab || Opens a file for appending\
    \ content in binary |\n\n| ab+ || Opens a file for reading and appending content\
    \ in binary |\n\nThe file object returned by the open method has three main attributes:\n\
    \n1-    name: returns the name of the file\n\n2-   mode: returns the mode with\
    \ which the file was opened\n\n3-    closed: is the file closed or not"
