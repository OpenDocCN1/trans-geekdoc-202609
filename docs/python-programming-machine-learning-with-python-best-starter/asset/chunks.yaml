    \ Negatives）是那些实际为正但被错误预测为负的值。\n\n混淆矩阵如下：\n\n| | 实际正性 | 实际负性 |\n| --- | --- |\
    \ --- |\n| 预测正性 | 真阳性 | 假阳性 |\n| 预测负性 | 假阴性 | 真阴性 |\n\n#### 准确率\n评估机器学习算法性能最简单的参数是准确率。准确率是指正确预测的实例数除以总实例数。数学上可以表示为：\n\
    `Accuracy = (TP + TN) / (TP + FP + FN)`\n\n#### 精确率\n精确率是指算法精确预测的能力。它可以通过真阳性除以预测正性（真阳性+假阳性）来计算。数学表示为：\n\
    `Precision = TP / (TP + FP)`\n\n#### 召回率\n召回率可以通过真阳性除以实际正性（真阳性+假阴性）来计算\n`Recall\
    \ = TP / (TP + FN)`\n\n#### F1 分数\nF1 分数是精确率和召回率的调和平均数\n\n与回归指标一样，我们不需要手动计算上述指标的值。Python\
