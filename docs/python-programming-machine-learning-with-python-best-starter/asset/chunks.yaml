    \ between global and local variable.\n\n```python\ntotal_students = 10 # global\
    \ variable\n\ndef passed_students(p_students):\n    #accessing global variable\
    \ total_students inside function\n    failed_students = total_students - p_students\n\
    \    #printing local variable failed_students\n    print(\"Failed Students: \"\
    \ + str(failed_students))\n\n# Accessing global variable outside function    \n\
    print(\"Total students\" + str(total_students)) \npassed_students(6)\n```\n\n\
    In the script above, we define a global variable `total_students`. We then define\
    \ a function `passed_students`. Inside the function we accessed global variable\
    \ `total_students`. The function also contains local variable `failed_students`.\n\
    \nOutside the function we access global variable `total_students` and call the\
    \ `passed_students` function. We will see that the global variable can be successfully\
    \ accessed within a function. The output looks like this:\n\n![](Images/image0039.jpeg)\n\
    \nNow if you try to access the local variable `failed_students` outside the `passed_students`\
    \ function as follows:\n\n```python\nprint(failed_students)\n```\n\nAn exception\
    \ will be thrown:\n\n![](Images/image0039.jpeg)\n\nThe error shows that `failed_students`\
    \ variable is not defined. In other words, it cannot be accessed outside the function\
    \ in it was declared.\n\nWhat’s Next?\n\nIn this chapter, we completed our discussion\
    \ about Python function. We saw different ways of creating functions with the\
    \ help of examples. In the next chapter, we will start our discussion about object\
    \ oriented programming. Happy Coding!!!\n\n# Chapter 12: Object Oriented Programming\
    \ in Python\n\nObject oriented programming (OOP) is a programming paradigm in\
    \ which the application is implemented in the form of objects that imitate real\
    \ world entities. Objects can have attributes, methods and properties. Anything\
    \ that contains some information and can perform a function is a candidate of\
    \ being implemented as an object in OOP. Consider a scenario where you have to\
    \ develop a first person shooter game using object oriented programming. You have\
    \ to think about the real world objects that have some information and can perform\
    \ some functionality in the first person shooter game. Shooter himself is an object\
    \ since shooter has a name, weight, nationality etc. and can perform functions\
    \ like run, sit, crawl etc. Similarly, gun is also an entity since gun can shoot,\
    \ load, reload etc. In this chapter, we will start our discussion about object\
    \ oriented programming in Python.\n\n### Classes\n\nA class is a basic building\
    \ block of object oriented programming. In simple words, a class serves as a print\
    \ for an object. Another analogy between classes and object is that of map and\
    \ house. You can tell by reading a map that how the house is structured, where\
    \ the dining room is, how many rooms are there in the house and so on. You can\
    \ use one map to build several similar houses. Similarly, one class can be used\
    \ to create several similar objects.\n\nTake a look at the following example to\
    \ see how we can create a class in Python. Let’s create a simple class person:\n\
    \n```python\n# Creates class Person\nclass Person:\n  #create class attributes\n\
    \  name = \"Jospeh\"\n  age = 28\n  gender = \"Male\"\n  role = \"Shooter\"\n\n\
    \  #create class methods\n  def stand(self):\n      print (\"Person standing\"\
    )\n\n  def sit(self):\n      print (\"Person is sitting\")\n```\n"
  trans: "\n正如你可以通过参数（参数）向函数传递信息一样，你也可以从函数返回返回值。要从函数返回返回值，需要使用 `return` 关键字。请看下面的示例。\n\
    \n```python\ndef add_number(num1, num2):\n    result = num1 + num2\n    return\
    \ result\n\nresult = add_number(10,20)\nprint(\"sum of 10 and 20 is :\" + str(result))\n\
    \nresult = add_number(5,15)\nprint(\"sum of 5 and 15 is :\" + str(result))\n```\n\
    \n在上面的脚本中，我们创建了一个名为 `add_number` 函数。该函数接受两个参数，将它们相加并返回结果和。\n\n然后我们调用了两次该函数，并传递了两个不同的数字。结果打印在控制台上。输出如下：\n\
    \n![](img/image0039.jpeg)\n\n### 默认参数\n\nPython 函数可以为参数设置默认值，称为默认参数。如果在调用函数时没有为该参数传递参数值，则使用默认值。请看以下脚本：\n\
    \n```python\ndef add_number(num1, num2 = 100):\n    result = num1 + num2\n   \
    \ return result\n\nresult = add_number(20)\nprint(\"sum of 100 and 20 is :\" +\
    \ str(result))\n\nresult = add_number(5,15)\nprint(\"sum of 5 and 15 is :\" +\
    \ str(result))\n```\n\n在上面的脚本中，我们创建了一个 `add_number` 函数。该函数的 `num2` 参数有一个默认参数值\
    \ `100`。\n\n`add_number` 函数被调用了两次。在第一次调用中，只传递了一个参数，即 `20`。该参数被传递给 `num1` 参数。`num2`\
    \ 参数没有传递任何参数。因此，将使用默认参数值 `100`，返回的结果将是 `120`（`100 + 20`）。\n\n在第二次调用 `add_number`\
    \ 函数时，为 `num1` 和 `num2` 参数都传递了参数。因此，将不会使用 `num2` 的默认参数（即 `100`）。上述脚本的结果如下：\n\n\
    ### 按值传递还是按引用传递？\n\n传递给 Python 函数的参数是按引用的。这意味着如果函数更新了参数的值，该值在函数外部也会被更新。通过下面的示例将变得更加清晰：\n\
    \n```python\ndef update_list(newlist):\n  newlist.append([20,25,30]);\n  return\n\
    \nnumlist = [5,10,15];\nprint (\"Values before function call\", numlist)\nupdate_list(\
    \ numlist );\nprint (\"Values after function call\", numlist)\n```\n\n在上面的脚本中，我们创建了一个名为\
    \ `update_list` 的函数。该函数接受列表作为参数，并将另一个列表作为元素添加到其中。\n\n我们创建了一个包含 3 个元素的名为 `numlist`\
    \ 的列表。然后我们在控制台上打印了这个列表。然后将该列表作为参数传递给 `update_list` 函数，该函数将另一个列表作为元素添加到其中。我们再次在控制台上打印\
    \ `numlist`。结果显示，尽管 `numlist` 列表是在 `update_list` 函数之外打印的，但 `numlist` 包含了由 `update_list`\
    \ 函数添加的列表。这是因为 `numlist` 的引用被传递给了 `update_list` 函数。函数内部的更新也导致了实际列表的更新。输出如下：\n\n\
    ![](img/image0039.jpeg)\n\n### 匿名函数\n\n你也可以在 Python 中使用单行语句创建无需 `def` 关键字的匿名函数。匿名函数是使用\
    \ `lambda` 创建的。\n\n```python\nsquare = lambda a: a * a\n# 使用 lambda 表达式\nprint(square(5))\
    \ #25\nprint(square(10)) #100\n\nadd = lambda x, y: x + y\n# 使用 lambda 表达式\nprint(add(2,\
    \ 3)) #5\nprint(add(10, 20)) #30\n\nmultiply = lambda x, y, z: x * y * z\n# 使用\
    \ lambda 表达式\nprint(multiply(1, 2, 3)) #6\nprint(multiply(5, 7, 2)) #70\n```\n"
