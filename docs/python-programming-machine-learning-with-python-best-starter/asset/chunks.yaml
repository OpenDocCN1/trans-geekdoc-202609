- raw: "Dendrograms are created following the steps we mentioned earlier. First the\
    \ two closest points are joined together. These points are depicted at the bottom\
    \ of the dendrogram hierarchy. For instance points 6 and 1, 5 and 3, 4 and 2,\
    \ 10 and 7, these points are closest to each other.  The vertical height of the\
    \ point corresponds to Euclidean distance between the points. Finally when the\
    \ closes points are joined to form clusters, the closest clusters are joined together,\
    \ for instance cluster of points 5, 3 and 3, 4 have been joined together. This\
    \ process continues until one big cluster is formed. \n\nOnce one large cluster\
    \ is formed, find longest vertical line with no horizontal line passing through\
    \ it. Draw a horizontal line through. The number of points at which the horizontal\
    \ line cross vertical lines, will be the number of clusters. \n\nFor instance\
    \ in the following figure, the dotted black line is the vertical line with longest\
    \ distance. We drew a red line through this vertical line. The red line cuts two\
    \ vertical lines resulting in two clusters as shown below:\n\n![](Images/image00499.jpeg)\n\
    \nIf you look at the points in two clusters, green cluster contains points 1 to\
    \ 6 while red cluster contains points 7 to 12 as expected. \n\n### Hierarchical\
    \ Clustering with Python Scikit Learn\n\nIn the last section we draw dendrograms\
    \ using Scipy library. However hierarchical clustering can also be implemented\
    \ using Python’s Scikit Learn Library. \n\nThe problem that we are going to solve\
    \ in this section is to cluster the customers into groups based on their spending\
    \ habits. The data has been downloaded and named as customer\\_records.csv. \n\
