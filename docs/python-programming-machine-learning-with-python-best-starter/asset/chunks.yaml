    \ in the sequence.\n\n```python\nfrom functools import reduce\nnums = [2,4,6,8,10]\n\
    result = reduce(lambda a,b: a*b, nums)\nprint(result)\n```\n\n### List Comprehensions\n\
    \nList comprehensions can be used to create lists using set notation. List comprehensions\
