    # 第 5 章


    ## 运算符


    编程中的运算符是用于对操作数执行特定逻辑、关系或数学运算的字面量。Python 运算符分为以下五类：


    *   算术运算符

    *   逻辑运算符

    *   比较运算符

    *   赋值运算符

    *   成员运算符


    在本章中，我们将通过示例讨论这些运算符。


    ### 算术运算符


    顾名，算术运算符用于对操作数进行算术运算。


    假设 `N1 = 10` 且 `N2 = 5`；请查看下表以理解算术运算符。


    | OperatorName | Symbol | Functionality | Example |

    | --- | --- | --- | --- |

    | 加法 | `+` | 将两边的操作数相 | `N1 + N2 = 15` |

    | 减法 | `-` | 减两边的操作数 | `N1 – N2 = 5` |

    | 乘法 | `*` | 乘两边的操作数 | `N1 * N2 = 50` |

    | 除法 | `/` | 将左的操作数除以右侧的操作数 | `N1 / N2 = 2` |

    | 取模 | `%` | 将左的操作数除以右侧的操作数并返回余数 | `N1 / N2 = 0` |

    | 幂 | `**` | 取左侧操作数的右侧幂 | `N1 ** N2 = 100000` |


    查看以下示例以了解算术运算符的用法：


    ```

    N1 = 10

    N2 = 5

    print(N1 + N2)

    print(N1 - N2)

    print(N1 * N2)

    print(N1 / N2)

    print(N1 ** N2)

    ```


    上述脚本的输出如下：


    ![](img/image00338.jpeg)


    ### 逻辑运算符


    逻辑运算符用于对操作数执行逻辑函数，如 AND（与）、和（（非。下表包含了 Python 逻辑运算符及其描述和功能。假设 `N1` 为 True，`N2`
    为 false。


    | Operator | Symbol | Functionality | Example |

    | --- | --- | --- | --- |

    | 逻辑与 | `and` | 如果两个操作数均为真，则条件为真。 | `(N1 and N2) = False` |

    | 逻辑或 | `or` | 如果两个操作数中任一为真，则条件为真。 | `(N1 or N2) = True` |

    | 逻辑非 | `not` | 用于反转操作数的逻辑状态。 | `not(N1 and N2) = True` |


    查看以下示例以了解逻辑运算符的用法：


    ```

    N1 = True

    N2 = False

    print(N1 and N2)

    print(N1 or N2)

    print(not(N1 and N2))

    ```


    上述脚本的输出如下：


    ![](img/image00339.jpeg)


    ### 比较运算符


    比较运算符用于比较操作数包含的值，并根据操作数之间的关系返回 true 或 false。比较运算符也称为关系运算符。假设 `N1` 等于 10 且 `N2`
    等于 5，请查看下表以理解比较运算符。


    | Operator | Symbol | Description | Example |

    | --- | --- | --- | --- |

    | 等于 | `==` | 如果两个操作数的值相等则返回 true | `(N1 == N2) = false` |

    | 不等于 | `!=` | 如果两个操作数的值不相等则返回 true | |

    | 大于 | `>` | | |

    | 小于 | `<` | | |

    | 大于或等于 | `>=` | | |

    | 小于等于 | `<=` | | |


    等等，让我根据提供的文本重新对齐表格：


    | Operator | Symbol | Description | Example |

    | --- | --- | --- | --- |

    | 等于 | `==` | 如果两个操作数的值相等则返回 true | `(N1 == N2) = false` |

    | 不等于 | `!=` | 如果两个操作数的值不相等则返回 true | |

    | 大于 | `>` | | |

    | 小于 | `<` | | |

    | 大于或等于 | `>=` | | |

    | 小于等于 | `<=` | | |


    *(自我纠正：源文本的表格格式不完整，我将重构所提供的核心逻辑)*


    查看以下示例以了解比较运算符的用法：


    ```

    N1 = 10

    N2 = 5

    # (文本中隐含的比较逻辑)

    ```


