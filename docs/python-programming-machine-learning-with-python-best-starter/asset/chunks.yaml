    ```python\nnum1 = 10\nnum2 = 20\nif num2 > num1:\n    print(\"num2 is greater\
    \ than num1\")\n```\n\n在上面的脚本中，我们创建了两个变量 `num1` 和 `num2`，其值分别为 10 和 20。接下来，我们写了一个\
    \ `if` 语句来判断 `num2` 是否大于 `num1`，结果为真。因此，打印“num1 is greater than num2”的语句被执行。输出如下：\n\
    \n![](img/image00343.jpeg)\n\n现在让我们来判断 `num2` 是否小于 `num1`。执行以下脚本：\n\n```python\n\
    num1 = 10\nnum2 = 20\nif num2 < num1:\n    print(\"num2 is smaller than num1\"\
    )\n```\n\n由于 `num2` 并不小于 `num1`，因此 `if` 块不会执行，你将在输出中什么也看不到。\n\n### 连接两个或多个条件\n\
    \n你还可以使用逻辑“OR”（或）和“AND”（与）运算符连接两个或两个以上的表达式。来看下面的脚本：\n\n```python\nnum1 = 10\n\
    num2 = 20\nnum3 = 30\nif num2 < num1 or num3 > num2 :\n    print(\"num2 is smaller\
    \ than num1 OR num3 is greater than num2\")\n```\n\n在上面的脚本中，两个条件通过逻辑 OR 运算符连接进行判断。第一个条件检查\
    \ `num2` 是否大于 `num1`，结果为假。第二个条件判断 `num3` 是否大于 `num2`，结果为真。由于条件是用 OR 运算符连接的，整体结果为真，因此\
    \ `if` 块中的语句将执行。上述脚本的输出如下：\n\n![](img/image00344.jpeg)\n\n### 嵌套“if”语句\n\n你可以将\
    \ `if` 语句嵌套在其他 `if` 语句内部。来看这个示例：\n\n```python\nnum1 = 10\nnum2 = 20\nnum3 = 30\n\
    if num2 > num1:\n    if num3 > num2:\n        print(\"num2 is greater than num1\
    \ and num3 is greater than num2\") \n```\n\n输出将如下：\n\n![](img/image00345.jpeg)\n\
    \n### “else”语句\n\n只有当随其后的条件返回真时，`if` 块才会执行。如果我们想在条件返回假时执行另一组语句呢？`else` 语句正是为此此任务的。来看下面的语句：\n\
    \n```python\nnum1 = 10\nnum2 = 20\nif num1 > num2:\n    print(\"num1 is greater\
    \ than num2\")\nelse:\n    print(\"num2 is greater than num1\")\n```\n\n在上面的脚本中，`if`\
    \ 条件检查 `num1` 是否大于 `num2`，结果为假。因此 `if` 块未执行。控制权转移到 `else` 语句，该语句执行。上述脚本的输出如下：\n\
    \n![](img/image00346.jpeg)\n\n### “elif”语句\n\n你可以使用 `elif` 语句评估多个条件。通过示例来解释这一点最为清楚：\n\
    \n```python\nnum1 = 10\nnum2 = 20\nnum3 = 30\nif num1 > num2:\n    print(\"num1\
    \ is greater than num2\")\nelif num2 > num3:\n    print(\"num2 is greater than\
    \ num3\")\nelif num3 > num2:\n    print(\"num3 is greater than num1\")\nelse:\n\
    \    print(\"None of the conditions are true\")\n```\n\n在上面的脚本中，`if` 语句检查 `num1`\
    \ 是否大于 `num2`，结果为假。因此控制权转移到第一个 `elif` 语句。第一个 `elif` 语句检查 `num2` 是否大于 `num3`，结果同样为假。因此控制权转移到下一个\
    \ `elif` 语句，由于 `num3` 实际上大于 `num2`，该语句结果为真。因此，第二个 `elif` 语句的代码块将被执行。上述脚本的输出如下：\n\
    \n![](img/image00347.jpeg)\n\n如果 `if` 和所有 `elif` 语句的条件均为假，则执行 `else` 之后的代码块。\n\
    \n### 嵌套“elif”语句\n\n与 `if` 语句一样，你也可以嵌套 `elif` 语句。来看这个示例：\n\n```python\nnum1 =\
    \ 10\nnum2 = 20\nnum3 = 30\nif num1 > num2:\n    print(\"num1 is greater than\
    \ num2\")\nelif num2 > num3:\n    print(\"num2 is greater than num3\")\nelif num3\
    \ > num2:\n    if num1 > num3:\n        print(\"num1 is greater than num3\")\n\
    \    elif num2 > num1:\n        print(\"num2 is greater than num1 but smaller\
    \ than num3\")\n    else:\n        print(\"None of the conditions are true\")\n\
    ```\n\n在上面的脚本中，从第一层开始，检查 `num3` 是否大于 `num2` 的第二个 `elif` 语句结果为真。然而，在这个 `elif` 语句内部还有进一步嵌套的\
    \ `if` 和 `elif` 语句。内部的 `if` 语句检查 `num1` 是否大于 `num3`，结果为假。控制权转移到内部的 `elif` 语句，检查\
    \ `num2` 是否大于 `num1`，结果为真。因此，内部 `elif` 块之后的语句执行。上述脚本的输出如下：\n\n![](img/image00348.jpeg)\n\
    \n### 接下来做什么？\n\n在本章中，我们学习了不同类型的条件语句以及如何使用它们来控制程序的流程。在下一章中，我们将开始讨论迭代语句。我们将看到不同类型的迭代语句及其用法。编码愉快！！！\n\
    \n# 第 7 章 迭代语句（循环）\n\n迭代语句用于针对特定次数重复执行一段代码，或者直到满足某个条件。想象你需要在屏幕上打印 100 次某个字符串，你得写\
    \ 100 行代码。或者使用复制粘贴。考虑需要重复执行一大段代码的情况，由于以下原因：首先它会显著增加代码量，其次维护非常困难。幸运的是，迭代语句在这种情况下救了我们。迭代语句通常被称为循环。\n\
    \nPython 中有两种迭代语句：\n\n- `for` 循环\n- `while` 循环\n\n### “for”循环\n\n`for` 循环用于遍历集合（例如列表、元组、字典等）。`for`\
    \ 循环的语法如下：\n\n```\nfor i in list:\n    statement 1\n    statement 2\n```\n\n这里\
    \ `i` 是任何可以被赋值的变量。`List` 是 `for` 循环遍历的列表。来看下面的示例以查看 `for` 循环的作用：\n\n```python\n\
    cars = ['Audi','BMW','Toyota','Honda','Ford']\nfor car in cars:\n    print(car)\n\
    ```\n\n在上面的脚本中，我们创建了一个汽车列表。然后我们使用 `for` 循环遍历这个列表。让我们理解 `for` 循环在后台是如何执行的。在第一次迭代中，`cars`\
    \ 列表的第一个项（索引为 0 的项）“Audi”被赋值给变量 `car`。`car` 变量的值打印在屏幕上。在第二次迭代中，列表第二个项存储在 `car`\
    \ 变量并打印在屏幕上，依此类推。上述脚本的输出如下：\n\n![](img/image00349.jpeg)\n\n### 使用 range 函数\n\n\
    如果我们想在没有列表的情况下执行特定的语句怎么办？我们可以使用 `range` 函数来实现。基本上，`range` 函数也返回一个可以供 `for` 循环遍历的迭代序列。例如，如果我们想让\
    \ `for` 循环执行 10 次，我们可以如下所示使用 `range` 函数：\n\n```python\nfor i in range(10):\n \
    \   print(i)\n```\n\n`range` 函数返回一个从 0 开始的具有指定数量整数的序列。上述脚本的输出将是 0 到 9 的整数。\n"
