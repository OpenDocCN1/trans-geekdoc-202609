  fmt: "\nPython is one of the easiest languages to learn owing to its super simple\
    \ syntax and loose typing. Unlike other languages, you don’t have to learn how\
    \ to use myriads of bracket types in order specify code blocks. You also don’t\
    \ get end of line semicolon errors. Finally, you also don’t have to specify the\
    \ type of variable while storing data in it. These points might sound trivial\
    \ to expert programmers, but for a person new to programming they are serious\
    \ turn-offs. \n\n## Open Source and Large Developer Community\nPython is an open\
    \ source language which means it can be used to develop, share and distribute\
    \ applications for commercial as well as non-commercial purposes without any copyright\
    \ infringements. Furthermore, Python’s large developer community makes it easier\
    \ to lookup for solutions to the problem.\n\n## Support for Web development\n\
    Python can be used for developing websites. In fact there are some very good Python\
    \ frameworks such as `Django` and `Flask` that make server side web development\
    \ much easier and robust.\n\n## Used for Data Science Machine Learning\nYou would\
    \ have heard the term “Data is the future.” If data is really the future, then\
    \ Python is surely the language to learn since most of the data science and machine\
    \ learning are currently being implemented via Python. There are several machine\
    \ learning and deep learning libraries such as `Sklearn`, `Tensorflow`, `Keras`\
    \ that made it simple to develop complex machine learning models.\n\n## Important\
    \ Features of Python\nFollowing are some of the most important features of Python:\n\
    \n### Source code to Byte code\nPython source code is compiled directly to byte\
    \ code without any intermediate steps. This makes Python script run on multiple\
    \ platforms without requiring any additional tool. \n\n### Object Oriented\nPython\
    \ is 100% object oriented language. Everything in Python is an object. Furthermore,\
    \ python provides an easy way to create new objects via classes.\n\n### Support\
    \ for C/C++ Extension\nPython code can be further extended in C and C++. Speed\
    \ of a Python program can be significantly increased this way.\n\n### Dynamic\
    \ Language\nPython is a dynamic language. Values, instead of variables are bound\
    \ to types. Furthermore, Method and function lookup is performed at runtime. \n\
    \n### Automatic Garbage Collection\nGarbage collection is performed automatically\
    \ in Python. However, `gc` module can be used to perform garbage collection at\
    \ any given time. \n\n### Highly Structured Language\nStatements, functions, classes,\
    \ modules and packages and most importantly Python’s indentation based syntax\
    \ allows developers to write highly structured and readable code.\n\n### Fast\
    \ and Maintainable Compared to Other Languages\nIn comparison with other compiled\
    \ languages, Python is faster, more structured and more maintainable. \n\n## About\
    \ the Book\nThis book is aimed towards providing in-depth yet simple insight into\
    \ Python programming language. The book is geared towards beginner as well as\
    \ advanced readers. The book helps beginners get their feet wet with practical\
    \ Python. On the other hand, it can be used by expert users as a reference to\
    \ different basic and advanced Python concepts. \n\nAll the important Python concepts\
    \ have been grouped into chapters. A chapter contains theoretical information\
    \ about particular Python concepts along with their implementation in the form\
    \ of Python script. To get the most of this book, readers are suggested to first\
    \ thoroughly understand the concept and then practice the code. \n\n### What’s\
    \ next?\nIn the next chapter we will set up the environment required to run python\
    \ script. We will install different software needed to run the scripts in this\
    \ book. Happy Coding!!!\n\n# Chapter 2\n\n## Environment Setup\nIn this chapter\
    \ we will install the software that required to run python script. We will install\
    \ different software needed to run the scripts in this book. \n\n### Downloading\
    \ and Installing Anaconda\nThe installation process remains almost same for Linux\
    \ and Mac.\n\n1. Go to your window search box and type `Anaconda Navigator` and\
    \ then select the `Anaconda Navigator` application.\n2. Go to the following URL:\
    \ `https://www.anaconda.com/download/`. Select the latest version. Click the `Download`\
    \ button.\n3. Once the executable file is downloaded, go to download folder and\
    \ run the executable.\n4. “License Agreement” dialogue box will appear. Read the\
    \ license agreement and Click `I Agree` button.\n5. From the “Select Installation\
    \ Type” dialogue box, check the `Just Me` radio button and click `Next` button.\n\
    6. Choose the installation directory (Default is preferred) from the “Choose Install\
    \ Location” dialogue box and click `Next` button.\n7. From the “Advanced Installation\
    \ Options” dialogue box, select the second checkbox `Register Anaconda as default\
    \ Python 3.6` and click the `Install` button.\n8. Once installation completes,\
    \ click the `Next` button.\n9. “Microsoft Studio Code Installation” window appear,\
    \ click `Skip` button.\n10. Congratulations, you have installed Anaconda. Uncheck\
    \ the both the checkboxes on the dialogue box and `Finish` button.\n\n### Running\
    \ your First Program\nWe have installed environment required to run Python scripts.\
    \ Now is the time to run our first program. With Anaconda, you have several ways\
    \ to do so. We will see two of those in this section.\n\n#### Running Scripts\
    \ via Jupyter Notebook\nJupyter notebook runs in your default browser. From the\
    \ navigator, launch `Jupyter Notebook` (Second option from the top).\n"
