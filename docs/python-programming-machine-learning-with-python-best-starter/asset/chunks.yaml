    \ the console. However, `num2` contains `0`. Therefore, the division will not\
    \ be successful since a number cannot be divided by zero. An error will be thrown\
    \ that looks like this:\n\n![](Images/image00380.jpeg)\n\nThe name of the exception\
    \ is `ZeroDivisionError` and it occurs when a number is divided by zero. Let’s\
    \ see how we can handle this exception. Take a look at the following script:\n\
    \n```python\ntry:\n    num1 = 10\n    num2 = 0\n    result = num1/num2\n    print(result)\
    \ \nexcept ZeroDivisionError:\n    print (\"Sorry, division by zero not possible\"\
    )\nelse:\n    print(\"Program executed without an exception\")\n```\n\nIn the\
    \ script above, the code that throws an exception is enclosed in a `try` block.\
    \ In the previous example, the code threw `ZeroDivisionError`. Therefore, we handle\
    \ this exception using `except` literal. Inside the `except` block the reason\
    \ for the exception is printed. Finally, we have an `else` block that executes\
    \ if the exception doesn’t occur. Since we are dividing `num1` by zero, the statement\
    \ in the `except` block will execute and the output will look like this:\n\n![](Images/image00381.jpeg)\n\
    \nNow, if you change the value of `num2` in code to `2`. The exception will not\
    \ occur and the output will display the code in the `else` block that looks like\
    \ this:\n\n![](Images/image00382.jpeg)\n\nHence, handling an exception prevents\
    \ a program from crashing.\n\n### Example 2\n\nA program can throw multiple types\
    \ of exceptions. Take a look at the following example to understand this concept:\n\
    \n```python\ntry:\n    result = a/b\n    print(result) \nexcept ZeroDivisionError:\n\
    \    print (\"Sorry, division by zero not possible\")\nelse:\n    print(\"Program\
    \ executed without an exception\")\n```\n\nIn the script above we try to divide\
    \ `a` by `b`. We have handled the `ZeroDivisonError` exception. Therefore, if\
    \ `b` contains `0`, the exception will be handled. Else, if no exception occurs\
    \ the `else` block will execute. When you run the script above, you will see following\
    \ exception:\n\n![](Images/image00383.jpeg)\n\nFrom the output you can see that\
    \ the name of the exception is `NameError` and the exception says that the name\
    \ `a` is not defined. This means that we are using a variable without first defining\
    \ it. To handle this exception, execute the following code:\n\n```python\ntry:\n\
    \    result = a/b\n    print(result) \nexcept NameError:\n    print (\"Some variable/s\
    \ are not defined\")\nelse:\n    print(\"Program executed without an exception\"\
    )\n```\n\nYou can see that different types of exceptions are raised due to different\
    \ reasons. In order to build a robust program, a user should handle all the possible\
    \ exceptions. A list of different types of Python exceptions is available at the\
    \ following link: [https://docs.python.org/3/library/exceptions.html](https://docs.python.org/3/library/exceptions.html)\n\
    \n## Handling Multiple Exceptions\n\nTo handle multiple exceptions, you just have\
    \ to stack one exception handling block over the other. Take a look at the following\
    \ exception:\n\n```python\ntry:\n    num1 = 10\n    num2 = 2\n    result = num1/num2\n\
    \    print(result) \nexcept ZeroDivisionError:\n    print (\"Sorry, division by\
    \ zero not possible\")\nexcept NameError:\n    print (\"Some variable/s are not\
    \ defined\")\nelse:\n    print(\"Program executed without an exception\")\n```\n\
    \nIn the script above, both the `ZeroDivisionError` and `NameError` exceptions\
    \ are handled. Therefore, if you set the value of `num2` to `0`, the `ZeroDivisionError`\
    \ exception will occur. However if you try to divide the `num1` by `b`, the `NameError`\
    \ will occur.\n\nAnother way to handle multiple exceptions is by using `Exception`.\
    \ Take a look at the following example:\n\n```python\ntry:\n    num1 = 10\n  \
    \  num2 = 0\n    result = num1/num2\n    print(result) \nexcept Exception:\n \
    \   print (\"Sorry, division by zero not possible\")\nelse:\n    print(\"Program\
    \ executed without an exception\")\n```\n\nIn the script above, all types of exceptions\
    \ will be handled. The result will look like this:\n\n![](Images/image00384.jpeg)\n\
    \n## What’s next?\n\nIn this chapter we studies how we can handle exceptions.\
    \ In the next chapter we will see how to perform file handling tasks. Happy Coding!!!\n\
    \n# Chapter 10: Python File Handling\n\nFile handling refers to performing variety\
    \ of operations on different types of file. The most common file handling operations\
    \ are opening a file, reading file contents, creating a file, writing data to\
    \ a file, appending data to a file etc. Like every other programming language,\
    \ Python supports all the major file handling functions. In this chapter, we will\
    \ study how file handling can be achieved with Python.\n\n### Opening a File\n\
    \nBefore you perform any function on a file, you need to open it. To open a file\
    \ in python the `open` function is used. It takes 3 parameters: The path to the\
    \ file, the mode in which the file should be opened and the buffer size in number\
    \ of lines. The third parameter is optional. The `open` function returns file\
    \ object. The syntax of the `open` function is as follows:\n\n```python\nfile_object\
    \ = open(file_name, file_mode, buffer_size)\n```\n\nTake a look at the following\
    \ table for different types of modes along with their description:\n\n| Mode |\
    \ Description |\n| --- | --- |\n| r | Opens file for read only |\n| r+ | Opens\
    \ file for reading and writing |\n| rb | Only Read file in binary |\n| rb+ | Opens\
    \ file to read and write in binary |\n| w | Opens file to write only. Overwrites\
    \ existing files with same name |\n| wb | Opens file to write only in binary.\
    \ Overwrites existing files with same name |\n| w+ | Opens file for reading and\
    \ writing |\n| wb+ | Opens file to read and write in binary. Overwrites existing\
    \ files with same name |\n| a | Opens a file for appending content at the end\
    \ of the file |\n| a+ | Opens file for appending as well as reading content |\n\
    | ab | Opens a file for appending content in binary |\n| ab+ | Opens a file for\
    \ reading and appending content in binary |\n\nThe file object returned by the\
    \ `open` method has three main attributes:\n\n1. `name`: returns the name of the\
    \ file\n2. `mode`: returns the mode with which the file was opened\n3. `closed`:\
    \ is the file closed or not\n"
  trans: "\n\n与大多数其他编程语言不同，Python 代码在运行时不会进行求值，因为 Python 是一种弱类型语言。变量的类型是在运行时求值的。这种方法既有优点也有缺点。这种方法的主要优点是用户在编写代码时不需要指定变量的类型。一个主要的缺点是可能会在运行时导致异常。我们将通过本文中的一个示例来看这一点，但首先让我们看看\
    \ Python 是如何处理简单异常的。\n\n## 异常处理语法\n\n异常处理的语法如下：\n\n```python\ntry:\n    # 可能抛出异常的代码\n\
    except ExceptionA:\n    # 如果发生 ExceptionA 则执行的代码\nexcept ExceptionB:\n    # 如果发生\
    \ ExceptionA 则执行的代码\nexcept ExceptionC:\n    # 如果发生 ExceptionA 则执行的代码\nelse:\n\
    \    # 如果没有异常则执行的代码\n```\n\n你认为可能会抛出异常的代码被包含在 `try` 块中，其后可以根据你想要处理的异常类型，跟着一个或多个\
    \ `except` 块。如果没有发生任何异常，则执行 `else` 块。\n\n## 处理单个异常\n\n### 示例 1\n\n来看一个非常简单的异常处理示例。让我们先写一个没有异常处理的程序。执行以下脚本：\n\
    \n```python\nnum1 = 10\nnum2 = 0\nresult = num1/num2\nprint(result)\n```\n\n在上面的脚本中我们有两个变量\
    \ `num1` 和 `num2`。我们尝试用 `num1` 除以 `num2` 并在控制台上打印结果。然而，`num2` 包含 `0`。因此，除法将无法成功，因为数字不能除以零。将抛出一个类似这样的错误：\n\
    \n![](img/image00380.jpeg)\n\n异常的名称是 `ZeroDivisionError`，它发生在数字除以零时。让我们看看我们如何处理这个异常。请看下面的脚本：\n\
    \n```python\ntry:\n    num1 = 10\n    num2 = 0\n    result = num1/num2\n    print(result)\
    \ \nexcept ZeroDivisionError:\n    print (\"Sorry, division by zero not possible\"\
    )\nelse:\n    print(\"Program executed without an exception\")\n```\n\n在上面的脚本中，抛出异常的代码封装在\
    \ `try` 块中。在上一个示例中，代码抛出了 `ZeroDivisionError`。因此，我们使用 `except` 字面量来处理这个异常。在 `except`\
    \ 块内部打印异常的原因。最后，我们有一个 `else` 块，它在异常未发生时执行。由于我们正在用 `num1` 除以 `0`，`except` 块中的语句将执行，输出将如下所示：\n\
    \n![](img/image00381.jpeg)\n\n现在，如果你将代码中 `num2` 的值改为 `2`。异常将不会发生，输出将显示 `else`\
    \ 块中的代码，结果如下所示：\n\n![](img/image00382.jpeg)\n\n因此，处理异常可以防止程序崩溃。\n\n### 示例 2\n\n\
    程序可以抛出多种类型的异常。请看下面的示例来理解这个概念：\n\n```python\ntry:\n    result = a/b\n    print(result)\
    \ \nexcept ZeroDivisionError:\n    print (\"Sorry, division by zero not possible\"\
    )\nelse:\n    print(\"Program executed without an exception\")\n```\n\n在上面的脚本中，我们尝试用\
    \ `a` 除以 `b`。我们处理了 `ZeroDivisonError` 异常。因此，如果 `b` 包含 `0`，则异常将被处理。否则，如果没有发生异常，则将执行\
    \ `else` 块。当你运行上面的脚本时，你将看到下面的异常：\n\n![](img/image00383.jpeg)\n\n从输出可以看出异常的名称是\
    \ `NameError`，异常信息显示名称 `a` 未定义。这意味着我们在没有先定义变量的情况下使用了变量。要处理此异常，请执行以下代码：\n\n```python\n\
    try:\n    result = a/b\n    print(result) \nexcept NameError:\n    print (\"Some\
    \ variable/s are not defined\")\nelse:\n    print(\"Program executed without an\
    \ exception\")\n```\n\n你可以看到由于不同的原因抛出了不同类型的异常。为了构建一个健壮的程序，用户应该处理所有可能的异常。不同类型的\
    \ Python 异常的列表可以在以下链接找到：[`docs.python.org/3/library/exceptions.html`](https://docs.python.org/3/library/exceptions.html)\n\
    \n## 处理多个异常\n\n要处理多个异常，你只需要将一个异常处理块堆叠在另一个上面。请看下面的异常：\n\n```python\ntry:\n    num1\
    \ = 10\n    num2 = 2\n    result = num1/num2\n    print(result) \nexcept ZeroDivisionError:\n\
    \    print (\"Sorry, division by zero not possible\")\nexcept NameError:\n   \
    \ print (\"Some variable/s are not defined\")\nelse:\n    print(\"Program executed\
    \ without an exception\")\n```\n\n在上面的脚本中，`ZeroDivisionError` 和 `NameError` 异常都被处理了。因此，如果你将\
    \ `num2` 的值设置为 `0`，就会发生 `ZeroDivisionError` 异常。但如果你尝试用 `num1` 除以 `b`，就会发生 `NameError`。\n\
    \n处理多个异常的另一种方法是使用 `Exception`。请看下面的示例：\n\n```python\ntry:\n    num1 = 10\n   \
    \ num2 = 0\n    result = num1/num2\n    print(result)\nexcept Exception:\n   \
    \ print (\"Sorry, division by zero not possible\")\nelse:\n    print(\"Program\
    \ executed without an exception\")\n```\n\n在上面的脚本中，所有类型的异常都将被处理。结果如下：\n\n![](img/image00384.jpeg)\n\
    \n## 接下来是什么\n\n在本章中我们学习如何处理异常。在下一章中我们将查看如何进行文件处理。编程愉快！！！\n\n# 第十章：Python 文件处理\n\
    \n文件处理是指对不同类型执行各种操作。常见的文件操作包括打开文件、读取内容、创建文件、写入数据、追加数据等。与其他编程语言一样，Python 支持主要的文件处理函数。在本章中，我们将学习如何实现文件处理。\n\
    \n### 打开文件\n\n在对文件执行任何函数之前，你需要打开它。在 Python 中使用 `open` 函数打开文件。它接受三个参数：文件路径、打开文件的模式以及按行计算的缓冲区。第三个参数是可选的。`open`\
    \ 函数返回文件对象。`open` 函数的语法如下：\n\n```python\nfile_object = open(file_name, file_mode,\
    \ buffer_size)\n```\n\n请看下表不同模式及其描述：\n\n| 模式 | 描述 |\n| --- | --- |\n| r | 只读打开文件\
    \ |\n| r+ | 读写打开文件 |\n| rb | 以二进制格式只读文件 |\n| rb+ | 以二进制格式读写打开文件 |\n| w | 只写打开文件。会覆盖同名文件\
    \ |\n| wb | 以二进制格式只写打开文件。会覆盖同名文件 |\n| w+ | 读写打开文件 |\n| wb+ | 以二进制格式读写打开文件。会覆盖同名文件\
    \ |\n| a | 在文件末尾追加内容打开文件 |\n| a+ | 用于追加和读取内容的文件 |\n| ab | 以二进制格式追加内容文件 |\n| ab+\
    \ | 以二进制格式读取和追加内容文件 |\n\n`open` 方法返回的文件对象有三个主要属性：\n\n1. `name`: 返回文件名\n2. `mode`:\
    \ 返回打开文件时的模式\n3. `closed`: 文件是否关闭\n\n"
