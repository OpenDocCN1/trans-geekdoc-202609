    \\banknote\\_data.csv')\n\nThe script above reads the dataset and stores it in\
    \ banknote\\_data dataframe.\n\n3-    Analyzing the Data \n\nThe following script\
    \ returns the data dimensions:\n\nbanknote\\_data.shape\n\nThe above script returns\
