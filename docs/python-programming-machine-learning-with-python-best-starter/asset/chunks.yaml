    \n### The “while” loop\n\nNumber of times a “for” loop executes is equal to the\
    \ number of items in the sequence that the loop operates upon. What if we want\
    \ a loop that terminates when certain condition is satisfied?  The “while” loop\
    \ is the answer; The “while” loop executes, until a certain condition is met.\
    \ Syntax of “while” loop is as follows:\n\nwhile (expression = true):\n\n    statement1\
    \ …\n\n    statement2 …\n\nBasically “while” loop checks whether the expression\
    \ that follows it, evaluates to true or not. It keeps executing until the expression\
    \ returns true. \n\nTake a look at the following script to understand “while”\
    \ loop\n\ni = 1\n\nwhile i < 11:\n\n    print(i)\n\n    i = i+1\n\nIn the script\
    \ above we initialize a variable “i” with integer 1. We then create a “while”\
