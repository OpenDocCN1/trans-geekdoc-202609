- raw: "You can see the newly appended item ‘Orange’ in the output.\n\nRemoving Element\
    \ from a List\n\nThe remove function is used to remove element from a list. The\
    \ element to remove is passed as parameter to the method. \n\ncolors = \\['Red',\
    \ 'Green', 'Blue', 'Yellow', 'White'\\]\n\nprint(colors)\n\ncolors.remove('Blue')\n\
    \nprint(colors)\n\nThe output of the script above looks like this:\n\n![](Images/image00358.jpeg)\n\
    \nYou can see that the item ‘Blue’ has been removed from the list. List elements\
    \ can also be deleted using index numbers. \n\ncolors = \\['Red', 'Green', 'Blue',\
    \ 'Yellow', 'White'\\]\n\nprint(colors)\n\ndel colors\\[2\\]\n\nprint(colors)\n\
    \nTo delete list element by index you have to use del function followed by the\
    \ name of the list and the index value passed inside square brackets. \n\nConcatenating\
    \ List\n\nYou can concatenate one list with the other using ‘+’ symbol as shown\
    \ below:\n\nnums1 = \\[2, 4, 6, 8, 10\\]\n\nnums2 = \\[1, 3, 5, 7, 9\\]\n\nresult\
    \ = nums1 + nums2 \n\nprint(result)\n\nThe output looks like this:\n\n![](Images/image00359.jpeg)\n\
    \nYou can see that the second list is concatenated at the end of the first list.\
    \ \n\nUsing in and not in Functions with Lists\n\nThe ‘in’ and ‘not in’ functions\
    \ can be used to check whether an element exists in a string or not. \n\ncolors\
    \ = \\['Red', 'Green', 'Blue', 'Yellow', 'White'\\]\n\nprint('Green' in colors)\n\
    \nprint('Orange' in colors)\n\nprint('Black' not in colors)\n\nprint('Blue' not\
    \ in colors)\n\nThe in function returns true for ‘Green in colors’ since the item\
    \ ‘Green’ actually exists within the color string. Similarly for ‘Blue’ not in\
    \ colors, false will be returned since ‘Blue’ exists in colors list. The output\
    \ for the script above looks like this:\n\n![](Images/image00360.jpeg)\n\nFinding\
    \ length of List\n\nThe len function can be used to find total number of elements\
    \ in a list. \n\ncolors = \\['Red', 'Green', 'Blue', 'Yellow', 'White'\\]\n\n\
    print(len(colors))\n\nThe script above returns 5, since there are five elements\
    \ in the colors list. \n\nSorting a List\n\nYou can sort and reverse elements\
    \ of a list. The elements are sorted alphabetically in case of strings and in\
    \ ascending order in case of numeric values. Take a look at the following example:\n\
    \ncolors = \\['Red', 'Green', 'Blue', 'Yellow', 'White'\\]\n\ncolors.sort()\n\n\
    print(colors)\n\nnums = \\[12, 4, 66, 35, 7\\]\n\nnums.sort()\n\nprint(nums)\n\
    \nTo sort the list, sort function is called on the list. Remember, sorting is\
    \ in-place which means that the existing list is changed rather than returning\
    \ a new list. The output of the script above looks like this:\n\n![](Images/image00361.jpeg)\n\
    \nList of Lists (Matrices)\n\n Lists can be nested inside another list, resulting\
    \ in a matrix. In the following example we nest three lists with four items inside\
    \ another list resulting in ‘3 x 4’ matrix.\n\ncolors = \\[\\[1,15,20,36\\],\n\
    \n          \\[41,20,54,47\\],\n\n          \\[74,45,69,47\\]\\]\n\nList of lists\
    \ or matrices also follow zero based index. To access first list, you need to\
    \ pass zero as index to the outer list. Take a look at the following example:\n\
    \ncolors = \\[\\[1,15,20,36\\],\n\n          \\[41,20,54,47\\],\n\n          \\\
    [74,45,69,47\\]\\]\n\nprint(colors\\[0\\])\n\nThe above script prints the first\
    \ list inside the parent list as shown below:\n\n![](Images/image00362.jpeg)\n\
    \nTo access a particular value in nested list, first you have to specify the index\
    \ for the nested list and then the index for the particular value inside that\
    \ list. For instance if you want to access the element at the third index belonging\
    \ to the list at first index i.e. 47, you can use the following syntax. \n\ncolors\
    \ = \\[\\[1,15,20,36\\],\n\n          \\[41,20,54,47\\],\n\n          \\[74,45,69,47\\\
    ]\\]\n\nprint(type(colors))\n\nnum = colors\\[1\\]\\[3\\]\n\nprint(num)\n\n###\
    \ Tuples\n\nLike lists, tuples are also used to store collection of different\
    \ types of objects. However, unlike lists, tuples are immutable which means that\
    \ once created, tuple elements cannot be changed. You cannot update a tuple, cannot\
    \ delete tuple element and cannot add new elements to a tuple.\n\nCreating a Tuple\
    \ \n\nTo create a tuple, assign a comma separated list of objects, enclosed within\
    \ a parenthesis to a variable. Take a look at the following script:\n\ncolors\
    \ = ('Red', 'Green', 'Blue', 'Yellow', 'White')\n\ntype(colors)\n\nIn the script\
    \ above we create a tuple named colors with five items. To confirm the type of\
    \ the colors variable we use type function which confirms that the type of the\
    \ variable colors is actually a tuple. \n\nAccessing Tuple Elements\n\nTuple elements\
    \ can be accessed just like lists using indexes. Take a look at the following\
    \ script:\n\ncolors = ('Red', 'Green', 'Blue', 'Yellow', 'White')\n\nprint(colors\\\
    [2\\])\n\nThe script above prints tuple element at second index which is ‘Blue’.\
    \ \n\nThe slice operator works for tuples too. Take a look at the following example:\n\
    \ncolors = ('Red', 'Green', 'Blue', 'Yellow', 'White')\n\nprint(colors\\[:3\\\
    ]) # Accessing first three elements\n\ncolors = ('Red', 'Green', 'Blue', 'Yellow',\
    \ 'White')\n\nprint(colors\\[-3:\\]) # Accessing last three elements\n\ncolors\
    \ = ('Red', 'Green', 'Blue', 'Yellow', 'White')\n\nprint(colors\\[1:3\\]) # Accessing\
    \ elements at index 1 and 2\n\nThe output of the script above looks like this:\n\
    \n![](Images/image00363.jpeg)\n\nUpdating a Tuple\n\nWe know that tuples are immutable.\
    \ The elements in a tuple cannot be updated, added or removed. Let’s try to modify\
    \ the tuple element and verify this fact.\n\ncolors = ('Red', 'Green', 'Blue',\
    \ 'Yellow', 'White')\n\ncolors\\[2\\] = 'Orange'\n\nIn the script above, we assign\
    \ a new value to the 2nd index of the colors tuple. Try to execute the script\
    \ above. The following error will occur:\n\n![](Images/image00364.jpeg)\n\nThe\
    \ error clearly says that the new elements cannot be assigned to a tuple. \n\n\
    Finding length of a Tuple\n\nTuple length can be found using len function. This\
    \ is similar to list. Take a look at the following script:\n\ncolors = ('Red',\
    \ 'Green', 'Blue', 'Yellow', 'White')\n\nprint(len(colors))\n\nThe script above\
    \ returns 5 i.e. total number of elements in the colors tuple.\n\nFinding an Element\
    \ in Tuple with ‘in’ and ‘not in’ Functions\n\nThe ‘in’ and ‘not in’ functions\
    \ can be used with tuples to find if an element exists within the tuple. Take\
    \ a look at the following script:\n\ncolors = ('Red', 'Green', 'Blue', 'Yellow',\
    \ 'White')\n\nprint('Green' in colors)\n\nprint('Orange' in colors)\n\nprint('Black'\
    \ not in colors)\n\nprint('Blue' not in colors)\n\nThe output of the script above\
    \ looks like this:\n\n![](Images/image00365.jpeg)\n\nTuple Concatenation\n\nLike\
    \ lists, the addition operator ‘+’ can be used to concatenate two tuples. In fact,\
    \ this is one of the ways to add an element to a tuple. \n\ncolors = ('Red', 'Green',\
    \ 'Blue', 'Yellow', 'White')\n\norange\\_color = ('Orange',)\n\nnewcolors = colors\
    \ + orange\\_color\n\nprint(newcolors)\n\nIn the script above, we create a tuple\
    \ colors with five elements. We then create another tuple namely orange\\_color\
    \ with one string element ‘Orange’. Both the tuples are concatenated which returns\
    \ a new tuple with 6 elements. The resultant tuple is then printed to the output\
    \ console. This is one of the ways to add a new element to an existing tuple. \
    \ The output of the script above looks like this:\n\n![](Images/image00366.jpeg)\n\
    \nFinding Maximum and Minimum Element within a Tuple\n\nThe max and min functions\
    \ are used to find the maximum and minimum values within a tuple. Take a look\
    \ at the following script:\n\nnums = (2, 4, 6, 8, 10)\n\nprint(min(nums)) # prints\
    \ maximum value in tuple\n\nprint(max(nums)) # prints minimum value in tuple\n\
    \nThe output of the script above looks like this:\n\n![](Images/image00367.jpeg)\n\
    \nThe min and max functions can also be used with a List.\n\nConverting List to\
    \ Tuples\n\nYou can convert a list into tuple by passing list to the constructor\
    \ of the tuple. Take a look at the following example:\n\ncolors = \\['Red', 'Green',\
    \ 'Blue', 'Yellow', 'White'\\]\n\nprint(type(colors))\n\ncolors\\_tuple = tuple(colors)\n\
    \nprint(colors\\_tuple)"
