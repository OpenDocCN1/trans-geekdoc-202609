  trans: "\n机器学习算法的工作是寻找能够产生最佳结果的最优参数或权重。这些参数是由算法找到的，并取决于数据集。我们无法控制这些参数。\n\n然而，还有另一组参数是在算法运行之前指定的。例如，`KNN`\
    \ 算法的 `K` 值、`SVM` 算法的 `kernel` 类型、`Random forest`（随机森林）算法的估计器数量、神经网络的节点数等。这些参数是可以被控制或指定的。\n\
    \n尽管如此，我们并不真正知道这些参数的最佳值是多少。在上一节中，我们为 `Random Forest` 算法的 `n_estimator` 设置为 500。但我们不知道这是否是理想的。如果算法在有\
    \ 200 或 700 个节点时表现更好呢？或者 `K` 的最佳值是多少？10 还是 20？我们并不知道这些问题的答案。\n\n网格搜索（Grid Search）算法可以帮助我们解决这个问题。基本上，网格搜索算法的作用是从一组参数中自动为特定算法寻找最佳参数。\n\
    \n## 使用 Sklearn 实现网格搜索\n\nPython 的 Scikit Learn 库带有一个用于实现网格搜索的包。为此，`sklearn.model_selection`\
    \ 类包含了 `GridSearchCV` 类，可以用于实现网格搜索。但在在此之前，需要进行一些预处理。\n\n### 创建参数字典\n\n网格搜索算法并不是随机运行并寻找算法的所有最佳参数，因为这可能花费数年时间。例如，如果网格搜索算法开始测试\
    \ `number of estimators` 参数从 1 到 1000 的每一个值，那么算法至少必须运行 1000 次，而这仅仅是为了其中一个参数。因此，会将你想要测试的每个参数的一组值传递给\
    \ `GridSearchCV` 类。这些组参数以字典的形式表示。\n\n假设我们想测试 `Random Forest` 算法的 `n_estimators`、`warm_start`\
    \ 和 `criterion` 参数的不同值，我们可以创建一个如下所示字典：\n\n```python\nparam = { \n    'n_estimators':\
    \ [100, 250, 500, 750, 1000],\n    'warm_start': ['True', 'False'], \n    'criterion':\
    \ ['entropy', 'gini'] \n}\n```\n\n在上面的脚本中，我们创建了一个名为 `param` 的字典，字典的键是参数名称，字典的值对应于参数的值。从这些值中，网格搜索算法将返回最佳组合。\n\
    \n例如，我们想测试 `n_estimators` 参数的最佳值，我们传递了 100, 250, 500, 750 和 1000。网格搜索将从这五个值中选择最佳值。这里需要说明的是，网格搜索算法取决于你想要测试的值以及交叉验证的折数（folds），可能会花费大量时间。\n\
    \n例如，在我们的案例中，`n_estimators` 参数有 5 个值，`warm_start` 有 2 个值，`criterion` 有 2 个值。在这种情况下，总可能的组合为\
    \ 5 x 2 x 2 = 20。将此值乘以折数数量（例如 5）。这将产生 100 次执行。这会让算法运行变慢一点。\n\n### 执行网格搜索\n\n要执行网格搜索，我们需要创建一个\
    \ `GridSearchCV` 类的对象，并向它传递分类器（我们将使用上一节创建的随机森林分类器）、我们刚刚创建的参数字典、性能评估指标（我们将使用准确率）、交叉验证折数和任务数（jobs）。当\
    \ `n_jobs = -1` 时，意味着所有的 CPU 都应该用于执行网格搜索。执行以下脚本创建 GridSearch 对象。\n\n```python\n\
    from sklearn.model_selection import GridSearchCV\n\ngrid_search = GridSearchCV(estimator=rf_clf,\
    \ \n                            param_grid=param,\n                          \
    \  scoring='accuracy',\n                            cv=5,\n                  \
    \          n_jobs=-1)\n```\n\n最后一步是在 `GridSearchCV` 对象上调用 `fit` 方法，并按所示传递训练集和测试集：\n\
    \n```python\ngrid_search.fit(train_features, train_labels)\n```\n\n执行这可能需要一些时间。\n\
    \n一旦上述脚本执行完毕，最后一步是查看网格搜索选择的参数。为了这样做，你可以使用 `GridSearchCV` 类的 `best_params_` 属性，如下所示：\n\
    \n```python\noptimal_parameters = grid_search.best_params_ \n\nprint(optimal_parameters)\n\
    ```\n\n输出如下：\n\n![](img/image00509.jpeg)\n\n通过上述参数值达到了最佳效果。最后，要查看使用最优参数所实现的准确率，执行以下脚本：\n\
    \n```python\noptimal_results = grid_search.best_score_ \n\nprint(optimal_results)\n\
    ```\n\n## 结论\n\n随着本章的结束，这本书也结束了。从现在开始我建议你自己学习机器学习。以下是一些非常好的资源：\n\n1. Python：https://www.python.org/\n\
    2. 机器学习：[`scikit-learn.org/stable/`](http://scikit-learn.org/stable/)\n3. 深度学习：[`keras.io/`](https://keras.io/)\n\
    4. 数据集：[`archive.ics.uci.edu/ml/index.php`](https://archive.ics.uci.edu/ml/index.php)\n\
