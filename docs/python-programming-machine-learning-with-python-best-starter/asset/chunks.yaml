- raw: "Job of a machine learning algorithm is to find best set of parameters or weights\
    \ that yield best results. These parameters are found by the algorithms and depend\
    \ upon the dataset. We cannot control these parameters.\n\n However there is another\
    \ set of parameters that is specified before the algorithm is run. For instance\
    \ value of K for the KNN algorithm, the type of kernel for the SVM algorithm,\
    \ the number of estimators for the Random forest algorithm, number of nodes for\
    \ the neural network and so on. These parameters can be controlled or specified.\
    \ \n\nHowever we do not really know the best value for these parameters. In the\
    \ last section we set the n\\_estimator for the Random Forest algorithm to 500.\
    \ However we do not know if this is the ideal. What if the algorithm performs\
    \ better with 200 or 700 nodes? OR what is the best value of K? 10 0r 20? We do\
    \ not know the answer to these questions. \n\nGrid Search algorithm helps us solve\
    \ this problem. Basically what Grid Search algorithm does is, it automatically\
    \ finds best parameters for a particular algorithm from a set of parameters. \n\
    \n### Implementing Grid Search with Sklearn \n\nThe Python’s Scikit Learn library\
    \ comes with a package to implement Grid Search. For this purpose the sklearn.model\\\
    _selection class contains GridSearchCV class that can be used to implement Grid\
    \ Search. However before that some preprocessing is required.\n\nCreating Parameter\
    \ Dictionary\n\nGrid search algorithm doesn’t just randomly run and finds all\
    \ the best parameters for an algorithm because it can take years. For instance\
    \ if grid search algorithm starts testing each value for the number of estimators\
    \ parameter from 1 to 1000, the algorithm has to run a minimum of 1000 times and\
    \ that’s just for 1 parameter. Therefore a set of values for each parameter that\
    \ you want to test, is passed to the GridSearchCV class. These set of parameters\
    \ and are expressed in the form of a dictionary.\n\nSuppose we want to test different\
    \ values for n\\_estimators, warm\\_start and criterion parameters of the Random\
    \ Forest algorithm, we can create a dictionary that looks like this:\n\nparam\
    \ = {  \n\n    'n\\_estimators': \\[100, 250, 500, 750, 1000\\],\n\n    'warm\\\
    _start': \\['True', 'False'\\],  \n\n    'criterion': \\['entropy', 'gini'\\]\
    \ \n\n}\n\nIn the script above we create a dictionary named, “param” the keys\
    \ for the dictionary are the names of the parameters and the values of the dictionary\
    \ corresponds to values of the parameter. From these set of values, the Grid Search\
    \ algorithm will return the best combination.\n\nFor instance we want to test\
    \ the best value for n\\_estimators parameter and we passed 100, 250, 500, 750\
    \ and 1000. Grid search will select best value from these five values. It is important\
    \ to mention here that grid search algorithm can take lot of time depending upon\
    \ the values that you want to test and the number of folds for the cross validation.\
    \ \n\nFor instance in our case we have 5 values for n\\_estimators parameter,\
    \ 2 values for warm\\_start and two values for criterion. Total possible combinations\
    \ in this case are 5 x 2 x 2 = 20. Multiply this value with number of folds e.g\
    \ 5. That makes it 100 executions. This can slow down the algorithm a bit. \n\n\
    Creating Parameter Dictionary\n\nTo execute the Grid Search, we need create object\
    \ of GridSearchCV class and pass it the classifier (we will use Random Forest\
    \ classifier created in the last section), the parameter dictionary that we just\
    \ created, the performance evaluation metrics (we will use accuracy), cross validation\
    \ folds and the number of jobs. When n\\_jobs = -1, it means that all the CPU’s\
    \ should be used for performing Grid Search. Execute the following script to create\
    \ GridSearch object.\n\nfrom sklearn.model\\_selection import GridSearchCV\n\n\
    grid\\_search = GridSearchCV(estimator=rf\\_clf,  \n\n                     param\\\
    _grid=param,\n\n                     scoring='accuracy',\n\n                    \
    \ cv=5,\n\n                     n\\_jobs=-1)\n\nThe final step is to call fit\
    \ method on the GridSearchCV object and pass it the training and test set as shown\
    \ below:\n\ngrid\\_search.fit(train\\_features, train\\_labels)   \n\nThis can\
    \ take a bit of time to execute. \n\nOnce the above script executes, the last\
    \ and final step is to see the parameters selected by grid search, to do so you\
    \ can use the best\\_params\\_ attribute of the GridSearchCV class as shown below:\n\
    \noptimal\\_parameters = grid\\_search.best\\_params\\_  \n\nprint(optimal\\_parameters) \
    \ \n\nThe output looks like this:\n\n![](Images/image00509.jpeg)\n\nBest achieved\
    \ with aforementioned parameters values. Finally to see the accuracy achieved\
    \ using most optimal parameters, execute the following script:\n\n optimal\\_results\
    \ = grid\\_search.best\\_score\\_  \n\nprint(optimal\\_results)  \n\nConclusion\n\
    \nWith this chapter, this book comes to its end. From here on I would suggest\
    \ you to study machine learning on your own. Following are some of the very good\
    \ resources:\n\n1.  For Python: https://www.python.org/\n\n2.  For Machine Learning:\
    \ [http://scikit-learn.org/stable/](http://scikit-learn.org/stable/)\n\n3.  For\
    \ Deep Learning: [https://keras.io/](https://keras.io/)\n\n4.  For datasets: [https://archive.ics.uci.edu/ml/index.php](https://archive.ics.uci.edu/ml/index.php)\n\
    \nYou Might Also Be Interested In…\n\n# [![](Images/image00510.jpeg)](https://amzn.to/2AiwYHf)\n\
    \n#  \n\n# Book Link: [https://amzn.to/2AiwYHf](https://amzn.to/2AiwYHf)\n\n![Cover\
    \ Data Analyitics](Images/image00418.jpeg)\n\n FREE E-BOOK DOWNLOAD :  \n\n[http://bit.ly/2yJsyq4](http://bit.ly/2yJsyq4)\n\
    \nor\n\n[http://pragmaticsolutionstech.com/](http://pragmaticsolutionstech.com/)\n\
    \nUse the link above  to get instant access to the bestselling E-Book Data Analytics'\
    \ Guide For Beginners"
