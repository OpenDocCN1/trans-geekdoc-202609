  trans: "\n聚类图（Dendrograms）是按照之前提到的步骤创建的。首先将两个最近的点连接在一起。这些点位于聚类图层次结构的底部。例如点 6 和 1、5\
    \ 和 3、4 和 2、10 和 7，这些点彼此距离最近。点的高度对应于点之间的欧几里得距离。最后，当最近的点连接形成类时，最近的类会被连接在一起，例如点\
    \ 5, 3 和点 3, 4 的类被连接在一起了。这个过程一直持续，直到形成一个大类。\n\n一旦形成了一个大类，找到没有水平线穿过的最长垂直线。在其上画一条水平线。水平线交叉垂直线的点数即为类的数量。\n\
    \n例如在下面的图中，黑色虚线是距离最长的垂直线。我们在这条垂直线上画了一条红线。红线切断了两条垂直线，如如下所示导致两个类：\n\n![](img/image00499.jpeg)\n\
    \n如果你观察这两个类中的点，如预期所示，绿色类包含点 1 到 6，而红色类包含点 7 到 12。\n\n### 使用 Python Scikit Learn\
    \ 进行层次聚类\n\n在上一节节中，我们使用 Scipy 库绘制了聚类图。然而，层次聚类也可以使用 Python 的 Scikit Learn 库来实现。\n\
    \n我们在这一节中要解决的问题是根据消费习惯将客户分组。数据已经下载并命名为 `customer_records.csv`。\n\n接下来，按照以下步骤使用\
    \ Python Scikit Learn 实现层次聚类：\n\n#### 导入库\n\n```python\nimport matplotlib.pyplot\
    \ as plt \n\nimport pandas as pd \n\nimport numpy as np\n\n%matplotlib inline\n\
    ```\n\n#### 导入数据集\n\n以下脚本导入数据集并将其存储在 `customer_record` 数据框中\n\n```python\ncustomer_record\
    \ = pd.read_csv('D:\\\\Datasets\\\\customer_records.csv')\n```\n\n要查看数据集，请执行以下脚本：\n\
    \n```python\ncustomer_record.head()\n```\n\n输出如下：\n\n![](img/image00500.jpeg)\n\
    \n该数据集有五个属性：客户 ID（CustomerID）、性别（Genre）、年龄（Age）、年收入（单位：千美元）和消费得分（Spending Score，1-100）。消费得分列对应用户的消费习惯。用户花费得越多，该消费得分列越高。为了简单起见，我们将只取两列，即年收入和消费得分，并尝试根据这两列对数据进行聚类。要选择这两列，执行以下脚本：\n\
    \n```python\ndataset = customer_record.iloc[:, 3:5].values \n```\n\n#### 聚类数据\n\
    \n要使用 Python 的 Scikit Learn 对数据进行聚类，我们可以使用 `scipy.cluster.hierarchy` 库。它有两个类：`linkage`\
    \ 和 `dendrogram`。首先，我们需要创建一个 `linkage` 类的对象，并将数据集和距离方法传递给 `linkage` 类。接下来，我们需要将\
    \ `linkage` 类的对象传递给 `dendrogram` 类，如下脚本所示。这里使用的距离方法是“ward”，它基本上是最小化了多个类之间的方差差。执行以下脚本：\n\
    \n```python\nimport scipy.cluster.hierarchy as hc\n\nplt.figure(figsize=(12, 8))\
    \ \n\nplt.title(\"Customer Clusters\") \n\nlink = hc.linkage(dataset, method='ward')\n\
    \ndendograms = hc.dendrogram(link) \n```\n\n上述脚本得出了下面的聚类图表：\n\n![](img/image00501.jpeg)\n\
    \n在上面的脚本中，让我们在垂直轴的 200 处画一条线。这将给我们五个类，如下图所示：\n\n![](img/image00502.jpeg)\n\n同样，如果你在\
    \ 300 处画一条水平线，得到的类数量将是 3。阈值越高，类的数量越少，反之亦然。\n\n### 结论\n\n在本章中，我们学习了层次聚类，这是一个非常重要的无监督学习技术。通过它，我们将结束无监督学习章节。在下一章中，我们将学习降维技术，即主成分分析（PCA）和线性判别分析（LDA）。编码愉快！！！\n\
    \n# 第 16 章\n\n## 使用 PCA 进行降维\n\n由于高性能硬件和存储空间的可用性，机器学习作为一学科在近年来取得了巨大的进展。20 年前需要运行几个月才能的算法，现在可以在几分钟内运行。尽管机器学习算法的执行速度显著提高，但仍然有少数减慢机器学习算法速度的瓶颈。\n\
    \n巨大的数据集和每个数据集大量的特征是导致算法执行缓慢的原因之一。不建议减少数据集中的记录数量，因为它们可能包含有用信息。然而，数据集中的特征数量是可以减少的。\n\
    \n减少数据集中特征有两种主要方法：\n\n1. 合并相关特征导致特征数量减少。\n2. 选择在数据集以及输出中引起最大方差的特征。\n\n通常更倾向于第二种方法，并为此开发了多种统计技术，例如因子分析、线性判别分析（LDA）和主成分分析（PCA）。在本章中，我们将学习\
    \ PCA，在下一章中我们将学习 LDA。\n\n### 主成分分析理论\n\n主成分分析是最广泛使用的降维技术之一。PCA 通过选择在输出中引起最大方差的特征来工作，留下对输出没有影响的特征。这种方法背后的直觉是，方差可以作为输出的衡量。\n\
    \n### 使用 Sklearn 实现 PCA\n\n在本节中，我们将看到如何使用 Python 的 Sc Learn 库来实现主成分分析。通过 PCA，我们将从银行验证数据中找到最重要的特征。我们的数据中有四个属性，即熵（entropy）、偏度（skewness）、方差（variance）和货币波波变换图像的峰度（curtosis）。\n\
    \n关于数据集的更多细节可以在此处找到：[https://archive.uci.edu/ml/datasets/banknote+authentication]。\n\
    \n数据集已随书提供，可以在 Datasets 文件夹中通过 `banknote_data.csv` 找到。遵循以下步骤\n\n#### 导入所需的库\n\n\
    ```python\nimport pandas as pd\n\nimport numpy as np\n\nimport matplotlib.pyplot\
    \ as plt\n\n%matplotlib inline\n```\n\n#### 导入数据集\n\n以下脚本导入数据集。\n\n```python\n\
    banknote_data = pd.read_csv(r'D:\\\\Datasets\\\\banknote_data.csv')\n```\n\n上面的脚本读取数据集并将其存储在\
    \ `banknote_data` 数据框中。\n\n#### 分析数据\n\n以下脚本返回数据维度：\n\n```python\nbanknote_data.shape\n\
    ```\n\n上述脚本返回 (1372, 5)，这意味着我们的数据集包含 1372 条记录五个属性。\n\n要查看数据外观，请执行以下脚本。它返回数据的前五行。\n\
    \n```python\nbanknote_data.head()\n```\n\n输出如下：\n\n![](img/image00482.gif)\n"
