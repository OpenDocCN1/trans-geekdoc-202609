    \ with five items. To confirm the type of the `colors` variable we use `type`\
    \ function which confirms that the type of the variable is actually a tuple.\n\
    \n### Accessing Tuple Elements\n\nTuple elements can be accessed just like lists\
    \ using indexes. Take a look at the following script:\n\n```python\ncolors = ('Red',\
    \ 'Green', 'Blue', 'Yellow', 'White')\nprint(colors[2])\n```\n\nThe script above\
    \ prints tuple element at second index which is ‘Blue’.\n\nThe slice operator\
    \ works for tuples too. Take a look at the following example:\n\n```python\ncolors\
    \ = ('Red', 'Green', 'Blue', 'Yellow', 'White')\nprint(colors[:3]) # Accessing\
    \ first three elements\ncolors = ('Red', 'Green', 'Blue', 'Yellow', 'White')\n\
    print(colors[-3:]) # Accessing last three elements\ncolors = ('Red', 'Green',\
    \ 'Blue', 'Yellow', 'White')\nprint(colors[1:3]) # Accessing elements at index\
    \ 1 and 2\n```\n\nThe output of the script above looks like this:\n\n![](Images/image0063.jpeg)\n\
    \n### Updating a Tuple\n\nWe know that tuples are immutable. The elements in a\
    \ tuple cannot be updated, added or removed. Let’s try to modify the tuple element\
    \ and verify this fact.\n\n```python\ncolors = ('Red', 'Green', 'Blue', 'Yellow',\
    \ 'White')\ncolors[2] = 'Orange'\n```\n\nIn the script above, we assign a new\
    \ value to the 2nd index of the `colors` tuple. Try to execute the script above.\
    \ The following error will occur:\n\n![](Images/image0064.jpeg)\n\nThe error clearly\
    \ says that the new elements cannot be assigned to a tuple.\n\n### Finding length\
    \ of a Tuple\n\nTuple length can be found using `len` function. This is similar\
    \ to list. Take a look at the following script:\n\n```python\ncolors = ('Red',\
    \ 'Green', 'Blue', 'Yellow', 'White')\nprint(len(colors))\n```\n\nThe script above\
    \ returns 5 i.e. total number of elements in the `colors` tuple.\n\n### Finding\
    \ an Element in Tuple with ‘in’ and ‘not in’ Functions\n\nThe `in` and `not in`\
    \ functions can be used with tuples to find if an element exists within the tuple.\
    \ Take a look at the following script:\n\n```python\ncolors = ('Red', 'Green',\
    \ 'Blue', 'Yellow', 'White')\nprint('Green' in colors)\nprint('Orange' in colors)\n\
    print('Black' not in colors)\nprint('Blue' not in colors)\n```\n\nThe output of\
    \ the script above looks like this:\n\n![](Images/image0065.jpeg)\n\n### Tuple\
    \ Concatenation\n\nLike lists, the addition operator `+` can be used to concatenate\
    \ two tuples. In fact, this is one of the ways to add an element to a tuple.\n\
    \n```python\ncolors = ('Red', 'Green', 'Blue', 'Yellow', 'White')\norange_color\
    \ = ('Orange',)\nnewcolors = colors + orange_color\nprint(newcolors)\n```\n\n\
    In the script above we create a tuple `colors` with five elements. We then create\
    \ another tuple named `orange_color` with one string element ‘Orange’. Both the\
    \ tuples are concatenated which returns a new tuple with 6 elements. The resultant\
    \ tuple is then printed to the output console. This is one of the ways to add\
    \ a new element to an existing tuple. The output of the script above looks like\
    \ this:\n\n![](Images/image0066.jpeg)\n\n### Finding Maximum and Minimum Element\
    \ within a Tuple\n\nThe `max` and `min` functions are used to find the maximum\
    \ and minimum values within a tuple. Take a look at the following script:\n\n\
    ```python\nnums = (2, 4, 6, 8, 10)\nprint(min(nums)) # prints maximum value in\
    \ tuple\nprint(max(nums)) # prints minimum value in tuple\n```\n\nThe output of\
    \ the script above looks like this:\n\n![](Images/image0067.jpeg)\n\nThe `min`\
    \ and `max` functions can also be used with a List.\n\n### Converting List to\
    \ Tuples\n\nYou can convert a list into tuple by passing list to the constructor\
    \ of the tuple. Take a look at the following example:\n\n```python\ncolors = ['Red',\
    \ 'Green', 'Blue', 'Yellow', 'White']\nprint(type(colors))\ncolors_tuple = tuple(colors)\n\
    print(colors_tuple)\n```\n"
  trans: "\n\n你可以在输出中看到新添加的项 ‘Orange’。\n\n## 从列表中删除元素\n\n`remove` 函数用于从列表中删除元素。要删除的元素将作为参数传递给该方法。\n\
    \n```python\ncolors = ['Red', 'Green', 'Blue', 'Yellow', 'White']\nprint(colors)\n\
    colors.remove('Blue')\nprint(colors)\n```\n\n上述脚本的输出如下：\n\n![](img/image00358.jpeg)\n\
    \n你可以看到项 ‘Blue’已经从列表中删除了。也可以使用索引号删除列表元素。\n\n```python\ncolors = ['Red', 'Green',\
    \ 'Blue', 'Yellow', 'White']\nprint(colors)\ndel colors[2]\nprint(colors)\n```\n\
    \n要按索引删除列表元素，必须使用 `del` 函数，后跟列表名和传递在方括号内的索引值。\n\n## 合并列表\n\n你可以使用 `+` 符号将一个列表与其他列表合并，如下所示：\n\
    \n```python\nnums1 = [2, 4, 6, 8, 10]\nnums2 = [1, 3, 5, 7, 9]\nresult = nums1\
    \ + nums2 \nprint(result)\n```\n\n输出如下：\n\n![](img/image00359.jpeg)\n\n你可以看到第二个列表被合并在第一个列表的末尾。\n\
    \n## 在列表中使用 in 和 not in 函数\n\n`in` 和 `not in` 函数可以用于检查元素是否存在于字符串中。\n\n```python\n\
    colors = ['Red', 'Green', 'Blue', 'Yellow', 'White']\nprint('Green' in colors)\n\
    print('Orange' in colors)\nprint('Black' not in colors)\nprint('Blue' not in colors)\n\
    ```\n\n对于 ‘Green in colors’，`in` 函数返回 true，因为项 `Green` 确实存在于颜色字符串中。同样，对于 ‘Blue\
    \ not in colors’，会返回 false，因为 `Blue` 存在 colors 列表中。上述脚本的输出如下：\n\n![](img/image00360.jpeg)\n\
    \n## 查找列表的长度\n\n`len` 函数可以找到列表中元素的总数。\n\n```python\ncolors = ['Red', 'Green',\
    \ 'Blue', 'Yellow', 'White']\nprint(len(colors))\n```\n\n上述脚本返回 5，因为 `colors`\
    \ 列表中有五个元素。\n\n## 排序列表\n\n你可以对列表元素进行排序和反转。对于字符串，元素按字母顺序排序；对于数值，按升序排序。看下面的示例：\n\
    \n```python\ncolors = ['Red', 'Green', 'Blue', 'Yellow', 'White']\ncolors.sort()\n\
    print(colors)\nnums = [12, 4, 66, 35, 7]\nnums.sort()\nprint(nums)\n```\n\n要对列表排序，会在列表上调用\
    \ `sort` 函数。记住，排序是原地操作（in-place），这意味着现有列表会被改变，而不是返回新列表。上述脚本的输出如下：\n\n![](img/image00361.jpeg)\n\
    \n## 列表列表（矩阵）\n\n列表可以嵌套在另一个列表中，形成矩阵。在接下来的示例中，我们将三个包含四个项的列表嵌套在另一个列表中，形成一个 ‘3 x\
    \ 4’矩阵。\n\n```python\ncolors = [[15, 20, 36, 41], [20, 54, 47, 74], [45, 69, 88]]\n\
    ```\n\n列表列表或矩阵也遵循从零开始的索引。访问第一个列表，需要向外部列表传递 0 作为索引。看下面的示例：\n\n```python\ncolors\
    \ = [[15, 20, 36, 41], [20, 54, 47, 74], [45, 69, 88]]\nprint(colors[0])\n```\n\
    \n上述脚本打印父列表中的第一个列表，如下：\n\n![](img/image0362)\n\n要访问嵌套列表中的特定值，首先必须指定嵌套列表的索引，然后是特定值的索引。例如，如果你想访问属于第一个列表索引为\
    \ 47 的元素，可以使用以下语法：\n\n```python\ncolors = [[15, 20, 36, 41], [20, 54, 47, 74],\
    \ [45, 69]]\nprint(type(colors))\nnum = colors[1][3]\nprint(num)\n```\n\n## 元组\
    \ (Tuples)\n\n与列表一样，元组也用于存储不同类型的集合。然而，与列表不同，元组是不可变的（immutable），这意味着一旦创建，元组元素就无法更改。你无法更新元组或删除或添加新元素。\n\
    \n### 创建元组\n\n要创建一个元组，将逗号分隔的对象赋值给变量。\n\n```python\ncolors = ('Red', 'Green', 'Blue',\
    \ 'Yellow', 'White')\ntype(colors)\n```\n\n在上述脚本中，我们创建了一个名为 `colors` 的包含五个元素的元组。使用\
    \ `type` 函数确认 `colors` 变量类型确实为元组。\n\n### 访问元组元素\n\n可以使用索引像访问列表一样访问元组元素。看下面的脚本：\n\
    \n```python\ncolors = ('Red', 'Green', 'Blue', 'Yellow', 'White')\nprint(colors[2])\n\
    ```\n\n上述脚本打印索引为 2 的元素 ‘Blue’。切片操作也适用于元组。看下面的示例：\n\n```python\ncolors = ('Red',\
    \ 'Green', 'Blue', 'Yellow', 'White')\nprint(colors[:3]) # 访问前三个元素\ncolors = ('Red',\
    \ 'Green', 'Blue', 'Yellow', 'White')\nprint(colors[-3:]) # 访问后三个元素\ncolors =\
    \ ('Red', 'Green', 'Blue', 'Yellow', 'White')\nprint(colors[1:3]) # 访问索引 1 和 2\
    \ 的元素\n```\n\n上述脚本的输出如下：\n\n![](img/image0063.jpeg)\n\n### 更新元组\n\n我们知道元组是不可变的。元组中的元素无法更新、添加或删除。尝试修改元组元素验证这一事实。\n\
    \n```python\ncolors = ('Red', 'Green', 'Blue', 'Yellow', 'White')\ncolors[2] =\
    \ 'Orange'\n```\n\n在上述脚本中，我们将新值赋值给 `colors` 元组的索引 2。尝试执行上述脚本会发生以下错误：\n\n![](img/image0064.jpeg)\n\
    \n错误清楚地表示新元素无法赋值给元组。\n\n### 查找元组的长度\n\n可以使用 `len` 函数查找元组长度。这与列表相似。看下面的脚本：\n\n\
    ```python\ncolors = ('Red', 'Green', 'Blue', 'Yellow', 'White')\nprint(len(colors))\n\
    ```\n\n上述脚本返回 5，即 `colors` 元组中的元素总数。\n\n### 使用 ‘in’ 和 ‘not in’ 函数查找元组中的元素\n\n\
    `in` 和 `not in` 函数可以用于元组查找元素是否存在于元组内。看下面的脚本：\n\n```python\ncolors = ('Red', 'Green',\
    \ 'Blue', 'Yellow', 'White')\nprint('Green' in colors)\nprint('Orange' in colors)\n\
    print('Black' not in colors)\nprint('Blue' not in colors)\n```\n\n上述脚本的输出如下：\n\
    \n![](img/image0065.jpeg)\n\n### 元组合并\n\n与列表一样，可以使用加法运算符合并两个元组。事实上，这是向元组添加元素的方法之一。\n\
    \n```python\ncolors = ('Red', 'Green', 'Blue', 'Yellow', 'White')\norange_color\
    \ = ('Orange',)\nnewcolors = colors + orange_color\nprint(newcolors)\n```\n\n\
    在上述脚本中，我们创建了一个包含五个元素的元组 `colors`。然后我们创建了另一个名为 `orange_color` 的包含一个字符串元素 ‘Orange’\
    \ 的元组。两个元组合并后返回一个包含 6 个元素的新元组。结果元组被打印到输出控制台。这是向现有元组添加新元素的方法之一。上述脚本的输出如下：\n\n![](img/image0066.jpeg)\n\
    \n### 查找元组中的最大最小元素\n\n`max` 和 `min` 函数用于查找元组中的最大值和最小值。看下面的脚本：\n\n```python\nnums\
    \ = (2, 4, 6, 8, 10)\nprint(min(nums)) # 打印元组中的最小值\nprint(max(nums)) # 打印元组中的最小值\n\
    ```\n\n上述脚本的输出如下：\n\n![](img/image0067.jpeg)\n\n`min` 和 `max` 函数也可以用于列表。\n\n###\
    \ 将列表转换为元组\n\n你可以通过将列表传递给元组的构造函数将列表转换为元组。看下面的示例：\n\n```python\ncolors = ['Red',\
    \ 'Green', 'Blue', 'Yellow', 'White']\nprint(type(colors))\ncolors_tuple = tuple(colors)\n\
    print(colors_tuple)\n```\n\n"
