- raw: "The intuition behind KNN algorithm is extremely simple. KNN algorithm simply\
    \ finds the distance between the new test data points from all the other data\
    \ points in the dataset. It then ranks all the other data points in ascending\
    \ order of their according to their distance with the test point. Finally it chooses\
    \ the top K nearest data points. It then assigns the new data point to the class\
    \ of the majority of K data points. Now you should know that why scale our data\
    \ down so that the distance between the different dimensions of the data points\
    \ remain distance. Distance can be Manhattan as well as Euclidean depending upon\
    \ the problem. \n\nLet’s visually see the working of a KNN algorithm.\n\nSuppose\
    \ we have some data points in two dimensional space, divided into two categories:\
    \ red and blue as shown in the following figure. \n\n![](Images/image00480.jpeg)\n\
    \nNow if we have to classify a new data point. We will calculate its distance\
    \ from all the red and blue data points. Then we will choose K nearest data points.\
    \ Suppose new data point is yellow circle and the value of K is three as shown\
    \ below:\n\n![](Images/image00481.jpeg)\n\nYou can see that out of the three nearest\
    \ neighbors of the yellow data point, two are blue and one is red. Therefore,\
    \ the yellow data point will be classified in the blue class. \n\nKNN algorithm\
    \ has no training phase; in fact it uses whole dataset for classifying a new data\
    \ point. It is for this purpose, it is known as lazy learning algorithm. \n\n\
    ### Advantages of KNN Algorithm\n\n1.  Unlike other algorithms, the list of parameters\
    \ required by KNN algorithm is not very exhaustive. You only need to specify the\
    \ number of nearest neighbor K and the type of distance function.\n\n2.  KNN algorithm\
    \ is extremely fast when compared to logistic regression, decision trees and other\
    \ classification algorithm since there is no training phase involved in KNN. New\
    \ data point can directly be classified without extensive training, simply by\
    \ finding its distance from the other data points. \n\n3.  KNN is very simple\
    \ and easy to implement. Furthermore, new data points can be added at any time\
    \ anytime since whenever a prediction has to be made, distance with all the data\
    \ points is recalculated. \n\n### Disadvantages of KNN Algorithm\n\n1.  KNN algorithm\
    \ work well with numerical features but in case of categorical features, its performance\
    \ decreases. This is because for categorical features, the distance between two\
    \ data points cannot be calculated precisely.\n\n2.  Prediction cost of KNN algorithm\
    \ increases with increase in the size of the data and dimensions because it is\
    \ time consuming to calculate distance between large number of data points with\
    \ high dimensions. \n\n### KNN Implementation with Scikit Learn\n\nIn this section\
