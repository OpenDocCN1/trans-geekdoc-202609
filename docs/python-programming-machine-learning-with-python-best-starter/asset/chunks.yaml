- raw: "Just as you can pass information to a function via arguments (parameters,\
    \ you can also return values from a function. To return value from a function\
    \ the return keyword is used. Take a look at the following example.\n\ndef add\\\
    _number(num1, num2):\n\n    result = num1 + num2\n\n    return result\n\nresult\
    \ = add\\_number(10,20)\n\nprint(\"sum of 10 and 20 is :\" + str(result))\n\n\
    result = add\\_number(5,15)\n\nprint(\"sum of 5 and 15 is :\" + str(result))\n\
    \nIn the above script, we create a function add\\_number. The function accepts\
    \ two arguments, adds them and returns the resultant sum. \n\nWe then call the\
    \ function twice and pass it two different numbers. The result is printed on the\
    \ console. The output looks like this:\n\n![](Images/image00393.jpeg)\n\n### Default\
    \ Arguments\n\nPython functions can have default values for the parameters, called\
    \ default arguments. If no argument value is passed for that parameter from the\
    \ function call, the default value is used. Take a look at the following script:\n\
    \ndef add\\_number(num1, num2 = 100):\n\n    result = num1 + num2\n\n    return\
    \ result\n\nresult = add\\_number(20)\n\nprint(\"sum of 100 and 20 is :\" + str(result))\n\
    \nresult = add\\_number(5,15)\n\nprint(\"sum of 5 and 15 is :\" + str(result))\n\
    \nIn the script above we create an add\\_number function. The num2 parameter of\
    \ the function has default argument value of 100. \n\nThe add\\_number function\
    \ is called twice. In the first call only one argument is passed i.e. 20. This\
    \ argument is passed for the num1 parameter. No argument is passed for the num2\
    \ parameter. Therefore the default argument value of 100 will be used and the\
    \ returned result will be 120 (100 + 20). \n\nIn the second call to the add\\\
    _number function, arguments for both num1 and num2 parameters have been passed.\
    \ Therefore the default argument for num2 i.e. 100 will not be used. The result\
    \ of the script above looks like this:\n\n### Passed by Value or By Reference?\n\
    \nArguments passed to Python functions are by reference. That means that if the\
    \ function updates the value of an argument, the value is also updated outside\
    \ the function. This will become clearer with the help of following example:\n\
    \ndef update\\_list(newlist):\n\n   newlist.append(\\[20,25,30\\]);\n\n   return\n\
    \nnumlist = \\[5,10,15\\];\n\nprint (\"Values before function call\", numlist)\n\
    \nupdate\\_list( numlist );\n\nprint (\"Values after function call\", numlist)\n\
    \nIn the script above, we create a function called update\\_list. The function\
    \ accepts a list as parameter and appends another list to it as an item. \n\n\
    We create a list named numlist with 3 items. We then print this list on the console.\
    \ The list is then passed as argument to the update\\_list function which appends\
    \ another list to it as an item. We then print the numlist on the console again.\
    \ The results show that though numlist list being printed outside the update\\\
    _list function, the numlist contains the list appended by update\\_list function.\
    \ This is because the reference of the numlist was passed to the update\\_list\
    \ function. And update inside the function also caused update to the actual list.\
    \ The output looks like this:\n\n![](Images/image00394.jpeg)\n\n### Anonymous\
    \ Functions\n\nYou can also create anonymous functions in Python using single\
    \ line statement without def keyword. The anonymous functions are created using\
    \ lambda expressions and cannot contain multiple expressions. \n\nTake a look\
    \ at the following example to see how anonymous functions work:\n\nresult = lambda\
    \ num1, num2, num3: num1 + num2 + num3;\n\nprint (\"Sum of three values : \",\
    \ result( 5, 15, 25 ))\n\nprint (\"Sum of three values : \", result( 2, 4, 6 ))\n\
    \nIn the script above we create an anonymous function that adds three numbers.\
    \ The function is stored in a variable named result. The function can then be\
    \ called using this variable. In the above script the function has been called\
    \ twice with three different parameter values for the function call. The output\
    \ of the script looks like this:\n\n![](Images/image00395.jpeg) \n\n### Local\
    \ vs. Global Variables\n\nDepending upon their scope, there are two types of variables\
    \ in Python: Local and Global. Scope of a variable refers to the part of code\
    \ where a variable can be assessed. \n\nA variable declared inside a function\
    \ is called a local variable. Local variables cannot be accessed outside the function.\
    \ On the other hand, a global variable is not declared inside the function and\
    \ can be accessed anywhere within a program. Take a look at the following example\
    \ to see difference between global and local variable.\n\ntotal\\_students = 10\
    \ # global variable\n\ndef passed\\_students(p\\_students):\n\n    #accessing\
    \ global variable total\\_students inside function\n\n    failed\\_students =\
    \ total\\_students - p\\_students\n\n    #printing local variable failed\\_students\n\
    \n    print(\"Failed Students: \" + str(failed\\_students))\n\n\\# Accessing global\
    \ variable outside function    \n\nprint(\"Total students\" + str(total\\_students))\
    \ \n\npassed\\_students(6)\n\nIn the script above, we define a global variable\
    \ total\\_students. We then define a function passed\\_students. Inside the function\
    \ we accessed global variable total\\_students. The function also contains local\
    \ variable failed\\_students. \n\nOutside the function we again access global\
    \ variable total\\_students and call the passed\\_students function. We will see\
    \ that the global variable can be successfully accessed within a function and\
    \ outside the function. The output looks like this:\n\n![](Images/image00396.jpeg)\n\
    \nNow if you try to access the local variable failed\\_students outside the passed\\\
    _students function as follows:\n\nprint(failed\\_students)\n\nAn exception will\
    \ be thrown:\n\n![](Images/image00397.jpeg)\n\nThe error shows that “failed\\\
    _students” variable is not defined. In other words, it cannot be accessed outside\
    \ the function in which it was declared.\n\nWhat’s Next?\n\nIn this chapter, we\
    \ completed our discussion about Python function. We saw different ways of creating\
    \ functions with the help of examples. In the next chapter, we will start our\
    \ discussion about object oriented programming in Python. Happy Coding!!!\n\n\
    #  \n\n#  \n\n#  \n\n#  \n\n#  \n\n# Chapter 12\n\n## Object Oriented Programming\
    \ in Python\n\nObject oriented programming (OOP) is a programming paradigm in\
    \ which the application is implemented in the form of objects that imitate real\
    \ world entities. Objects can have attributes, methods and properties. Anything\
    \ that contains some information and can perform a function is a candidate of\
    \ being implemented as an object in OOP. Consider a scenario where you have to\
    \ develop a first person shooter game using object oriented programming. You have\
    \ to think about the real world objects that have some information and can perform\
    \ some functionality in the first person shooter game. Shooter himself is an object\
    \ since shooter has a name, height, weight, nationality etc. and can perform functions\
    \ like run, sit, stand, crawl etc. Similarly, gun is also an entity since gun\
    \ can shoot, load, reload etc. In this chapter, we will start our discussion about\
    \ object oriented programming in Python.\n\n### Classes\n\nA class is a basic\
    \ building block of object oriented programming. In simple words, a class serves\
    \ as a blue print for an object. Another analogy between classes and object is\
    \ that of map and house. You can tell by reading a map that how the house is structured,\
    \ where the dining room is, how many rooms are there in the house and so on. You\
    \ can use one map to build several similar houses. Similarly, one class can be\
    \ used to create several similar objects.\n\n Take a look at the following example\
    \ to see how we can create a class in Python. Let’s create a simple class person:\n\
    \n\\# Creates class Person\n\nclass Person:\n\n   #create class attributes\n\n\
       name = \"Jospeh\"\n\n   age = 28\n\n   gender = \"Male\"\n\n   role = \"Shooter\"\
    \n\n   #create class methods\n\n   def stand(self):\n\n       print (\"Person\
    \ standing\")\n\n   def sit(self):\n\n       print (\"Person is sitting\")"
