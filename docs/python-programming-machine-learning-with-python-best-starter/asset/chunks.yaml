    \ the Dataset\n\nThough the dataset is available online, we have downloaded it\
    \ and added it in the dataset repository available with this book. The dataset\
    \ name is `player.csv`. Execute the following command to import the dataset.\n\
    \n```python\nplayer_data = pd.read_csv('D:\\\\Datasets\\\\player.csv')\n```\n\n\
    The script above reads the dataset and stores it in `player_data` dataframe.\n\
    \n### 3- Analyzing the Data \n\nExecute the following script to eyeball the data:\n\
    \n```python\nplayer_data.head()\n```\n\nThe output looks like this:\n\n![](Images/image00467.jpeg)\n\
    \n### 4- Data Preprocessing\n\nThe following script divides the data into feature\
    \ and label set.\n\n```python\nfeatures = player_data.iloc[:, 0:4].values \nlabels\
    \ = player_data.iloc[:, 4].values\n```\n\nFinally let’s divide the data into 80\
    \ % training and 20% test sets:\n\n```python\nfrom sklearn.model_selection import\
    \ train_test_split\ntrain_features, test_features, train_labels, test_labels =\
    \ train_test_split(features, labels, test_size = 0.2, random_state = 0)\n```\n\
    \n### 5- Scaling the Data\n\nIf you look at the dataset it is not scaled well,\
    \ for instance the `Field_Goals` and `Throws` column have values between 0 and\
    \ 1, while the rest of the columns have higher values. Therefore, before training\
    \ the algorithm, we will scale our data down. Remember we discussed scaling Chapter\
    \ 3. Here we will use the standard scalar class.\n\n```python\nfrom sklearn.preprocessing\
    \ import StandardScaler\nfeature_scaler = StandardScaler()\ntrain_features = feature_scaler.fit_transform(train_features)\n\
    test_features = feature_scaler.transform(test_features)\n```\n\n### 6- Training\
    \ the Algorithm and making Predictions\n\nTo implement Random Forest Algorithm\
    \ for regression tasks, the `RandomForestRegressor` class of the `sklearn.ensemble`\
    \ library is used. The number of trees is passed as argument to the `n_estimators`\
    \ parameter. In the following script the number of script is set to 200.\n\n```python\n\
    from sklearn.ensemble import RandomForestRegressor\nrf_reg = RandomForestRegressor(n_estimators=200,\
    \ random_state=0) \nrf_reg.fit(train_features, train_labels) \n```\n\nExecute\
    \ the following script to predict the label for the test features:\n\n```python\n\
    predictions = rf_reg.predict( test_features)\n```\n\nTo compare predictions with\
    \ real outputs, execute the following script: Let’s compare the predicted value\
    \ with the actual values. Execute the following script to do so:\n\n```python\n\
    comparison=pd.DataFrame({'Real':test_labels, 'Predictions':predictions})\nprint(comparison)\n\
    ```\n\nThe output looks like this:\n\n![](Images/image00468.gif)\n\n### 7- Evaluating\
    \ the Algorithm\n\nExecute the following script to find MAE, MSE and RMSE for\
    \ our linear regression model.\n\n```python\nfrom sklearn import metrics\nprint('MAE:',\
    \ metrics.mean_absolute_error(test_labels, predictions))\nprint('MSE:', metrics.mean_squared_error(test_labels,\
    \ predictions))\nprint('RMSE:', np.sqrt(metrics.mean_squared_error(test_labels,\
    \ predictions)))\n```\n\nThe output is always follows:\n\n![](Images/image00469.jpeg)\n\
    \nThe value of MAE is 5.00, which is greater than MAE value calculated for Linear\
    \ Regression algorithm in Chapter 4 i.e. 4.65. Similarly, the value of RMSE in\
    \ the case of Random Forest algorithm is 6.27, which is greater than 5.67, i.e.\
    \ the value obtained using Linear Regression algorithm in Chapter 4. Hence we\
    \ can say that for predicting point scored by a basketball player given the dataset\
    \ used in this chapter, Linear Regression algorithm outperforms the Random Forest\
    \ algorithm.\n\n# Chapter 8\n\n## Support Vector Regression\n\nSupport Vector\
    \ Regression (SVR) is a type of Support Vector Machines (SVM) Algorithm and can\
    \ be used for performing linear as well as non-linear regression. Introduced in\
