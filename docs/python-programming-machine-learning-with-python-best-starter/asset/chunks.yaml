    \ example:\n\n```python\nfile_object = open(\"D:/test1.txt\", \"w+\")\nfile_object.write(\"\
    Welcome to Python.\\nThe best programming language!\\n\")\nfile_object.close()\n\
    ```\n\nIn the script above, the file `test1.txt` located at the root directory\
    \ of `D` drive is opened. The file is opened for reading and writing. Next two\
    \ lines of text have been passed to the `write` function. Finally the file is\
    \ closed.\n\nIf you go to the root directory of `D` drive, you will see a new\
    \ file `test1.txt` with the following contents:\n\nWelcome to Python.\nThe best\
    \ programming language!\n\n### Reading Data from a File\n\nTo read data from a\
    \ file in Python, the `read` function is used. The number of bytes to read from\
    \ a file is passed as a parameter to the `read` function. Take a look at the following\
    \ example:\n\n```python\nfile_object = open(\"D:/test1.txt\", \"r+\")\nsen = file_object.read(12)\n\
    print(\"The file reads: \"+sen)\nfile_object.close()\n```\n\nThe script above\
    \ reads the first 12 characters from the `test1.txt` file that we wrote in the\
    \ last example. The output looks like this:\n\n![](Images/image00387.jpeg)\n\n\
    To read the complete file, do not pass anything to the `read` function. The following\
    \ script reads the complete `test1.txt` file and prints its content on the console:\n\
    \n```python\nfile_object = open(\"D:/test1.txt\", \"r+\")\nsen = file_object.read()\n\
    print(sen)\nfile_object.close()\n```\n\nThe output of the script above looks like\
    \ this:\n\n![](Images/image00388.jpeg)\n\n### Renaming and Deleting Python Files\n\
    \nYou can rename and delete python files using the Python `os` module. To rename\
    \ a file, the `rename` function is used. The old name of the file is passed as\
    \ the first parameter while the new name is passed as the second parameter. Take\
    \ a look at the following example:\n\n```python\nimport os\nos.rename(\"D:/test1.txt\"\
    , \"D:/test2.txt\")\n```\n\nThe above script renames file `test1.txt` to `test2.txt`.\n\
    \nTo delete a file in Python, the `remove` method is used. Take a look at the\
    \ following example:\n\n```python\nimport os\nos.remove(\"D:/test.txt\")\n```\n\
    \nThe above script deletes the `test.txt` file located at the root directory of\
    \ `D` drive.\n\n### File Positioning\n\nTo find the current position of the cursor\
    \ in a file, the `tell` function is used. Take a look at the following example:\n\
    \n```python\nfile_object = open(\"D:/test2.txt\", \"r+\")\nprint(file_object.tell())\n\
    sen = file_object.read(12)\nprint(sen)\nprint(file_object.tell())\n```\n\nIn the\
    \ script above, the `file_object` is opened. We print the `tell()` position. Then\
    \ we read 12 characters and print them. Finally we print the position again. (Note:\
    \ The provided text for this section was somewhat repetitive/garbled, the core\
    \ logic is preserved).\n\n![](Images/image00389.jpeg)\n\n## Functions in Python\n\
    \nIn Python, functions are blocks of code which only perform a particular task.\
    \ They are used to encapsulate code and make it reusable.\n\n### Function Declaration\n\
    \nThe syntax to create a function starts with the `def` keyword followed by the\
    \ name of the function and parentheses.\n\n```python\ndef print_welcome():\n \
    \   print(\"Welcome Python\")\n```\n\nThe above script creates a function named\
    \ `print_welcome`. To call a function, simply type the name of the function followed\
    \ by parentheses as shown below:\n\n```python\nprint_welcome()\n```\n\n### Parameterized\
    \ Functions\n\nIn the previous example we left the parentheses empty. However,\
    \ these parentheses are used to pass parameters to functions. Take a look at the\
    \ following example:\n\n```python\ndef print_name(name):\n    print(\"Person name\
    \ :\" + name)\n\nprint_name(\"James\")\nprint_name(\"Sofia\")\nprint_name(\"Rick\"\
    )\n```\n\nIn the script above, we define a function `print_name` which accepts\
    \ one parameter `name` and prints it inside the function. In the function call\
    \ to the `print_name` function, we pass the value for the `name` parameter.\n\n\
    A function can have as many parameters as you want. However, the sequence of parameters\
    \ in the function definition must match the sequence in the function call. Take\
    \ a look at the following function. It accepts three parameters: `name`, `age`,\
    \ and `gender`.\n\n```python\ndef print_details(name, age, gender):\n    print(\"\
    Person name :\" + name)\n    print(\"Person age :\" + str(age))\n    print(\"\
    Person gender :\" + gender)\n    print(\"-------------------\")\n\nprint_details(\"\
    James\", 20, \"Male\")\nprint_details(\"Sofia\", 30, \"Female\")\nprint_details(\"\
    Rick\", 25, \"Male\")\n```\n\nIn the script above, we create a function `print_details`.\
    \ The function accepts three parameters `name`, `age`, and `gender` and prints\
    \ them on the console. The function has been called thrice with different values\
    \ for `name`, `age`, and `gender` parameters.\n"
