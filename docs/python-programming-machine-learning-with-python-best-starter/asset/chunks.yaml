  trans: "\n\n# 引言\n\n1. 随机森林算法最大的缺点之一是它的复杂性。由于预测过程中涉及数百棵甚至数千棵树，因此很难理解最终预测是如何产生的。\n\
    \n2. 算法的复杂性是以时间为代价的。取决于森林中树的数量，随机森林算法的执行可能需要大量时间。\n\n## 使用 Scikit Learn 实现随机森林算法\n\
    \n在本节中，我们将使用随机森林算法，根据球员的身高、体重、所有尝试投篮的命中率以及所有尝试投罚的命中率，预测球员在篮球比赛中可以得多少。我们已经下载了数据集，并将其放在\
    \ `Datasets` 文件夹中。\n\n我们将遵循之前所有章节中一直采用的步骤。\n\n### 1- 导入所需的库\n\n以下代码导入了所需的库：\n\n\
    ```python\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as\
    \ plt\n%matplotlib inline\n```\n\n### 2- 导入数据集\n\n虽然可以在网上找到数据集，但我们已经将其下载并添加到随书提供的数据集仓库中。数据集名为\
    \ `player.csv`。执行以下命令导入数据集。\n\n```python\nplayer_data = pd.read_csv('D:\\\\Datasets\\\
    \\player.csv')\n```\n\n上面的脚本读取数据集并将其存储在 `player_data` DataFrame 中。\n\n### 3- 分析数据\
    \ \n\n执行以下脚本以直查看数据：\n\n```python\nplayer_data.head()\n```\n\n输出如下：\n\n![](img/image00467.jpeg)\n\
    \n### 4- 数据预处理\n\n以下脚本将数据分为特征集和标签集。\n\n```python\nfeatures = player_data.iloc[:,\
    \ 0:4].values \nlabels = player_data.iloc[:, 4].values\n```\n\n最后，我们将数据分为 80%\
    \ 的训练集和 20% 的测试集：\n\n```python\nfrom sklearn.model_selection import train_test_split\n\
    train_features, test_features, train_labels, test_labels = train_test_split(features,\
    \ labels, test_size = 0.2, random_state = 0)\n```\n\n### 5- 数据缩放\n\n观察数据集会发现它的缩放并不良好，例如\
    \ `Field_Goals` 和 `Throws` 列的值在 0 到 1 之间，而其他列的值较高。因此，在训练算法之前，我们将对数据进行缩放。记得我们在第\
    \ 3 章讨论过缩放。这里我们将使用 `StandardScaler` 类。\n\n```python\nfrom sklearn.preprocessing\
    \ import StandardScaler\nfeature_scaler = StandardScaler()\ntrain_features = feature_scaler.fit_transform(train_features)\n\
    test_features = feature_scaler.transform(test_features)\n```\n\n### 6- 训练算法并进行预测\n\
    \n为了实现回归任务的随机森林算法，使用了 `sklearn.ensemble` 库中的 `RandomForestRegressor` 类。树的数量作为参数\
    \ `n_estimators` 参数。在下面的脚本中，树的数量被设置为 200。\n\n```python\nfrom sklearn.ensemble\
    \ import RandomForestRegressor\nrf_reg = RandomForestRegressor(n_estimators=200,\
    \ random_state=0) \nrf_reg.fit(train_features, train_labels) \n```\n\n执行以下脚本预测测试特征的标签：\n\
    \n```python\npredictions = rf_reg.predict( test_features)\n```\n\n为了将预测结果与真实输出进行比较，执行以下脚本：让我们比较预测值与实际值。执行以下脚本来操作：\n\
    \n```python\ncomparison=pd.DataFrame({'Real':test_labels, 'Predictions':predictions})\n\
    print(comparison)\n```\n\n输出如下：\n\n![](img/image00468.gif)\n\n### 7- 评估算法\n\n\
    执行以下脚本为我们的线性回归模型寻找 MAE、MSE 和 RMSE。\n\n```python\nfrom sklearn import metrics\n\
    print('MAE:', metrics.mean_absolute_error(test_labels, predictions))\nprint('MSE:',\
    \ metrics.mean_squared_error(test_labels, predictions))\nprint('RMSE:', np.sqrt(metrics.mean_squared_error(test_labels,\
    \ predictions)))\n```\n\n输出始终如下：\n\n![](img/image00469.jpeg)\n\nMAE 的值为 5.00，大于第\
    \ 4 章中为线性回归算法计算的 MAE 值（即 4.65）。同样，随机森林算法的 RMSE 值为 6.27，大于 5.67（即第 4 章中使用线性回归算法得到的数值）。因此，我们可以，对于根据本章使用的数据集预测篮球球员的得分，线性回归算法的性能优于随机森林算法。\n\
    \n# 第 8 章\n\n## 支持向量回归\n\n支持向量回归（SVR）是支持向量机（SVM）算法的一种，可用于线性及非线性回归。SVM 于 20 世纪\
    \ 60 年代是最著名的监督机器学习算法之一。在神经网络变得常见之前，SVM 被认为是最准确的机器学习算法。\n\n在本章中，我们将简要回顾 SVM 算法背后的直觉以及它们如何工作。由于我们处于回归章节，我们将使用\
    \ Python 库实现 SVR 算法，根据年份预测汽车价格。但在之前，让我们学习 SVM 背后的理论。\n\n### SVM 理论\n\n对于二维特征空间中的典型线性回归，任务是找到一条能够平分数据点的直线。然而在现实世界中，如图\
    \ 1 所示，存在多个边界。\n\n![](img/image0470.jpeg)\n图 1：多个边界\n\n"
