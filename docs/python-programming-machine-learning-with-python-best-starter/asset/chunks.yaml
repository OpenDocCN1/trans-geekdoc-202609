  trans: "\n\nKNN 算法的直原理非常简单。KNN 算法简单地寻找新的测试数据点与数据集中所有其他数据点之间的距离。然后，根据它们与测试点的距离对所有其他数据点进行升序排序。最后，它选择最近的\
    \ K 个数据点。接着，它将新数据点分配给这 K 个数据点中多数所在的类别。现在你应该知道为什么我们要缩小数据规模，以便保持数据点不同维度之间的距离。根据问题的不同，距离可以是曼哈顿距离，也可以是欧几得距离。\n\
    \n让我们直观地观察 KNN 算法的工作原理。\n\n假设我们在二维空间中有一些数据点，它们分为两类：红色和蓝色，如图所示。\n\n![](img/image00480.jpeg)\n\
    \n现在，如果我们要对一个新的数据点进行分类。我们将计算它到所有红色和蓝色数据点的距离。然后我们将选择 `K` 个最近的数据点。假设新数据点是黄色圆圈，`K`\
    \ 的值为三，如下所示：\n\n![](img/image00481.jpeg)\n\n你可以看到，在黄色数据点的三个最近邻中，有两个蓝色的，一个是红色的。因此，黄色数据点将被归类为蓝色类。\n\
    \nKNN 算法没有训练阶段；实际上，它使用整个数据集来对新数据点进行分类。正因如此，它被称为懒惰学习算法。\n\n### KNN 算法的优点\n\n1.\
    \ 与其他算法不同，KNN 算法所需的参数列表并不详尽。你只需要指定最近邻数 `K` 和距离函数的类型。\n\n2. 与逻辑回归、决策树和其他分类算法相比，KNN\
    \ 算法速度极快，因为 KNN 不涉及训练阶段。新数据点可以通过简单的寻找它与其他数据点之间的距离直接进行分类，而无需广泛的训练。\n\n3. KNN 非常简单且易于实现。此外，可以随时随添加新的数据点，因为每当需要进行预测时，都会重新计算与所有数据点的距离。\n\
    \n### KNN 算法的缺点\n\n1. KNN 算法在数值特征上表现良好，但在处理类别特征时，其性能会下降。这是因为对于类别特征，两个数据点之间的距离无法精确计算。\n\
    \n2. 随着数据量和维度的增加，KNN 算法的预测成本也会增加，因为计算高维度大量数据点之间的距离是非常耗费时间的。\n\n### 使用 Scikit Learn\
    \ 实现 KNN\n\n在本节中，我们将使用 Python 的 Scikit Learn 库实现 KNN 算法。我们将用 KNN 算法解决的问题是预测银行钞票是否为真。数据集中有四个属性，即钞票小波变换图像的熵、偏度、方差和峰度。\n\
    \n关于该数据集的更多信息可以从此[链接](https://archive.ics.uci.edu/ml/datasets/banknote+authentication)\
    \ 找到。\n\n数据集已随书提供，可以在 Datasets 文件夹中通过 `banknote_data.csv` 找到。\n\n如既往，我们从导入库开始：\n\
    \n#### 13- 导入所需的库\n\n以下代码导入所需的库：\n\n```python\nimport pandas as pd\nimport numpy\
    \ as np\nimport matplotlib.pyplot as plt\n%matplotlib inline\n```\n\n#### 14-\
    \ 导入数据集\n\n执行以下命令导入数据集。\n\n```python\nbanknote_data = pd.read_csv(r'D:\\\\Datasets\\\
    \\banknote_data.csv')\n```\n\n上面的脚本读取数据集并将其存储在 `banknote_data` dataframe 中。\n\n\
    #### 15- 分析数据\n\n以下脚本返回数据维度：\n\n```python\nbanknote_data.shape\n```\n\n上面的脚本返回\
    \ `(1372, 5)`，这意味着我们的数据集包含 1372 条记录和 5 个属性。\n\n执行以下脚本直直观察数据：\n\n```python\nbanknote_data.head()\n\
    ```\n\n输出如下：\n\n![](img/image00482.gif)\n\n#### 16- 数据预处理\n\n以下脚本将数据分为特征集和标签集。\n\
    \n```python\nfeatures = banknote_data.iloc[:,0:4].values\nlabels = banknote_data.iloc[:,4].values\n\
    ```\n\n最后，我们将数据分为 80% 的训练集和 20% 的测试集：\n\n```python\nfrom sklearn.model_selection\
    \ import train_test_split\ntrain_features, test_features, train_labels, test_labels\
    \ = train_test_split(features, labels, test_size = 0.2, random_state = 0)\n```\n\
    \n#### 17- 数据缩放\n\n如果你使用 KNN 算法，对数据进行缩放始终是一个良好的习惯。记得我们在第三章中讨论过缩放。在这里我们将使用标准缩器类。\n\
    \n```python\nfrom sklearn.preprocessing import StandardScaler\nfeature_scaler\
    \ = StandardScaler()\ntrain_features = feature_scaler.fit_transform(train_features)\n\
    test_features = feature_scaler.transform(test_features)\n```\n\n#### 18- 训练算法并进行预测\n\
    \n要用 Scikit learn 实现 KNN 算法，我们需要使用 `sklearn.neighbors` 库中的 `KNeighborsClassifier`\
    \ 类。`K` 的值指定为参数 `n_neighbors` 的值，如下脚本所示。我们将 `K` 设置为 3。执行以下脚本在 `train_features`\
    \ 和 `train_labels` 上训练模型。\n\n```python\nfrom sklearn.neighbors import KNeighborsClassifier\
    \ \nknn_clf = KNeighborsClassifier(n_neighbors=3) \nknn_clf.fit(train_features,\
    \ train_labels)\n```\n\n执行以下脚本对测试特征进行预测：\n\n```python\npredictions = knn_clf.predict(test_features)\n\
    ```\n\n为了比较预测值与真实值，执行以下脚本：\n\n```python\ncomparison=pd.DataFrame({'Real':test_labels,\
    \ 'Predictions':predictions})\nprint(comparison)\n```\n\n输出结果如下（示例）：\n\n你可以看到大部分预测都是准确的。\n\
    \n#### 评估算法\n\n从上一章我们知道，为了评估分类算法的性能，可以使用混淆矩阵、准确率、召回率和 F1 指标。执行以下脚本获取这些指标的值：\n\n\
    ```python\nfrom sklearn.metrics import classification_report, confusion_matrix,\
    \ accuracy_score\nprint(confusion_matrix(test_labels, predictions)) \nprint(classification_report(test_labels,\
    \ predictions)) \nprint(accuracy_score(test_labels, predictions))\n```\n\n上述脚本的输出如下：\n\
    \n![](img/image00484.jpeg)\n\n从输出可以看出，我们的算法在预测钞票方面做得很好。我们得到了 100%的准确率。\n\n###\
    \ K 值对准确率的影响\n\n在上一节中，我们随机将`K`值设置为 3，偶然产生了 100%的准确率。然而，情况并非总是如此。我们从一开始并不知道最佳的`K`值。寻找最佳`K`值的方法是尝试不同的`K`并选择产生最高准确率的值。\n\
    \n下面的脚本将使用 1 到 50 之间的`k`值来预测钞票的认证。执行以下脚本：\n\n```python\nrate_of_error = []\nfor\
    \ i in range(1, 50): \n    knn = KNeighborsClassifier(n_neighbors=i)\n    knn.fit(train_features,\
    \ train_labels)\n    predictions = knn.predict(test_features)\n    rate_of_error.append(np.mean(predictions\
    \ != test_labels))\n```\n\n一旦计算了每个`K`值的错误率，就可以打印图表来显示随`K`值变化的错误率。执行以下脚本：\n\n```python\n\
    plt.figure(figsize=(10, 5)) \nplt.plot(range(1, 50), rate_of_error, color='green',\
    \ linestyle='solid', marker='o', \n         markerfacecolor='red', markersize=10)\n\
    plt.title('K value vs Error') \nplt.xlabel('K Value') \nplt.ylabel('Error Value')\n\
    ```\n\n输出结果如下：\n\n![](img/image00485.jpeg)\n\n"
