    # Chapter 6


    ## Conditional Statements


    Conditional statements in programming are used to control the flow of a program.
    Take example of the login page of a website. It asks user to enter username and
    password. If the username and password are valid, user is granted access to his
    personal account, otherwise a message is displayed informing the user that username
    or password is not correct. Here behind the scene conditional statements are being
    used to check if the password is correct and depending the validation of password,
    user is either granted access to his personal account or prompted to enter his
    username and password again. In short, conditional statements are controlling
    the flow of the application.'
