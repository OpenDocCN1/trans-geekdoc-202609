- raw: "Take a look at the following example:\n\nNote: Before you execute the script\
    \ above, create a file test.txt and place it in the root directory of the D drive.\
    \ \n\nfile\\_object = open(\"D:/test.txt\", \"r+\")\n\nprint(file\\_object.name)\n\
    \nprint(file\\_object.mode)\n\nprint(file\\_object.closed)\n\nIn the script above,\
    \ we open the test.txt file in the read and write mode. Next we print the name\
    \ and mode of the file on the screen. Finally we print whether the file is closed\
    \ or not. The output of the script above looks like this:\n\n![](Images/image00385.jpeg)\n\
    \nTo close an opened file, you can use close method. Take a look at the following\
    \ example:\n\nfile\\_object = open(\"D:/test.txt\", \"r+\")\n\nprint(file\\_object.name)\n\
    \nprint(file\\_object.closed)\n\nfile\\_object.close()\n\nprint(file\\_object.closed)\n\
    \nIn the script above, the test.txt file is opened in r+ mode. The name of the\
    \ file is printed. Next we check if the file is opened using closed attribute,\
    \ which returns false, since the file is open at the moment. We then close the\
    \ file using close method. We again check if the file is closed, which returns\
    \ true since we have closed the file. The output looks like this:\n\n![](Images/image00386.jpeg)\n\
    \n### Writing Data to a File\n\nTo write data to a file, the write function is\
    \ used. The content that is to be written to the file is passed as parameter to\
    \ the write function. Take a look at the following example:\n\nfile\\_object =\
    \ open(\"D:/test1.txt\", \"w+\")\n\nfile\\_object .write( \"Welcome to Python.\\\
    \\nThe best programming language!\\\\n\");\n\nfile\\_object .close()\n\nIn the\
    \ script above, the file test.txt located at the root directory of D drive is\
    \ opened. The file is opened for reading and writing. Next two lines of text have\
    \ been passed to the write function. Finally the file is closed.\n\nIf you go\
    \ to root directory of D drive, you will see a new file test1.txt with the following\
    \ contents:\n\nWelcome to Python.\n\nThe best programming language!\n\n### Reading\
    \ Data from a File\n\nTo read data from a file in Python, the read function is\
    \ used. The number of bytes to read from a file is passed as a parameter to the\
    \ read function. Take a look at the following example:\n\nfile\\_object = open(\"\
    D:/test1.txt\", \"r+\")\n\nsen = file\\_object.read(12)\n\nprint(\"The file reads:\
    \ \"+sen)\n\nfile\\_object .close()\n\nThe script above reads the first 12 characters\
    \ from the test1.txt file that we wrote in the last example. The output looks\
    \ like this:\n\n![](Images/image00387.jpeg)\n\nTo read the complete file, do not\
    \ pass anything to the read function. The following script reads the complete\
    \ test1.txt file and prints its content on the console:\n\nfile\\_object = open(\"\
    D:/test1.txt\", \"r+\")\n\nsen = file\\_object.read()\n\nprint(sen)\n\nfile\\\
    _object .close()\n\nThe output of the script above looks like this:\n\n![](Images/image00388.jpeg)\n\
    \n### Renaming and Deleting Python Files\n\nYou can rename and delete python files\
    \ using Python os module. To rename a file, the rename function is used. The old\
    \ name of the file is passed as first parameter while new name is passed as second\
    \ parameter. Take a look at the following example:\n\nimport os\n\nos.rename(\
    \ \"D:/test1.txt\", \"D:/test2.txt\" )\n\nThe above script renames file test1.txt\
    \ to test2.txt\n\nTo delete a file in Python, the remove method is used. Take\
    \ a look at the following example:\n\nimport os\n\nos.remove(\"D:/test.txt\")\n\
    \nThe above script deletes the test.txt file located at the root directory of\
    \ D drive. \n\n### File Positioning\n\nTo find the current position of the cursor\
    \ in file, the tell function is used. Take a look at the following example:\n\n\
    file\\_object = open(\"D:/test2.txt\", \"r+\")\n\nprint(file\\_object.tell())\n\
    \nsen = file\\_object.read(12)\n\nprint(sen)\n\nprint(file\\_object.tell())\n\n\
    file\\_object .close()\n\nIn the script above, file test2.txt is opened. We then\
    \ use to check the current position of the file, which returns 0. Next, the first\
    \ 12 characters of the file are read. Next, the tell function is again called\
    \ to find the current position of the file cursor. This time it will return 12,\
    \ since the 12 characters have been just read using the read function. The output\
    \ looks like this:\n\n![](Images/image00389.jpeg)\n\nWhat’s Next?\n\nIn this chapter\
    \ we studied how files are handled in Python. What the different file handling\
    \ functions are and how to implement them. In the next chapter we will start our\
    \ discussion about Functions in Python.\n\n#  \n\n# Chapter 11\n\n## Functions\
    \ in Python\n\nIf a program has a large piece of code that is required to be executed\
    \ repeatedly, it is better to implement that piece of code as a function and then\
    \ call it using a loop. Functions foster code reusability, modularity and integrity.\
    \ Consider a scenario where you have to add two numbers 100 times. Without function\
    \ you will have assign values to two variables 100 times, perform the addition\
    \ and print the result on console. If you are asked to perform subtraction, you\
    \ will again have to change the plus sign into minus 100 times. In such a scenario,\
    \ it is more convenient to write a function that accepts two numbers and performs\
    \ addition between them. The function can then be called inside a loop. Similarly,\
    \ if you to change addition to subtraction, you will have to do it at one place.\
    \ \n\nIn this article we will see how to declare Python functions, how to call\
    \ them, how to return values from them and some other operations.\n\n### Function\
    \ Declaration\n\nThe syntax to create a function is as follows:\n\ndef function\\\
    _name ():\n\n#code line 1\n\n#code line 2\n\n#code line 3\n\nThe function declaration\
    \ starts with def keyword followed by the name of the function and opening and\
    \ closing parenthesis. The parentheses are used for passing information to the\
    \ function. \n\nLet’s write a simple function that prints ‘Welcome to Python”\
    \ on screen.\n\ndef print\\_welcome():\n\n    print(\"Welcome to Python\")\n\n\
    The above script creates a function named print\\_welcome . Function declaration\
    \ completes successfully even if the function body contains errors. This is because\
    \ a function body is actually evaluated when the function is called. \n\nTo call\
    \ a function, simply type the name of the function followed by pair of parenthesis\
    \ as shown below:\n\n Print\\_welcome()\n\nWhen the above script executes, the\
    \ print\\_welcome function executes and prints “Welcome to Python” on the console.\
    \ The output looks like this:\n\n![](Images/image00390.jpeg)\n\n### Parameterized\
    \ Functions\n\nIn the previous example we left the parenthesis that follow the\
    \ function name, empty. However these opening and closing parenthesis are used\
    \ to pass parameters to function. Take a look at the following example:\n\ndef\
    \ print\\_name(name):\n\n    print(\"Person name :\" + name)\n\nprint\\_name(\"\
    James\")\n\nprint\\_name(\"Sofia\")\n\nprint\\_name(\"Rick\")\n\nIn the script\
    \ above, we define a function print\\_name which accepts one parameter name and\
    \ print it inside the function. \n\nIn the function call to the print\\_name function,\
    \ we pass the value for the name parameter. We call the print\\_name function\
    \ thrice with three different values for the parameter. In the output you will\
    \ see these values as follows:\n\n![](Images/image00391.jpeg)\n\nA function can\
    \ have as many parameters as you want. However the sequence of parameters in the\
    \ function definition must match the sequence in the function call. Take a look\
    \ at the following function. It accepts three parameters: name, age and gender.\n\
    \n def print\\_details(name, age, gender):\n\n    print(\"Person name :\" + name)\n\
    \n    print(\"Person age :\" + str(age))\n\n    print(\"Person gender :\" + gender)\n\
    \n    print(\"-------------------\")\n\nprint\\_name(\"James\", 20, \"Male\")\n\
    \nprint\\_name(\"Sofia\", 30, \"Female\")\n\nprint\\_name(\"Rick\", 25, \"Male\"\
    )\n\nIn the script above, we create a function print\\_details. The function accepts\
    \ three parameters name, age and gender and prints them on the console. The function\
    \ has been called thrice with different values for name, age and gender parameters.\
    \ The output of the above script looks like this:\n\n![](Images/image00392.jpeg)\n\
    \n### Returning Values from a Function"
