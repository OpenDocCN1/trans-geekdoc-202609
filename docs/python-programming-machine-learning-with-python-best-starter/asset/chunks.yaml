        \\[1993,3500\\],\n\n    \\[2001,5700\\],\n\n    \\[2004,6000\\],\n\n    \\\
    [2008,6500\\],\n\n    \\[2005,5800\\],\n\n    \\[2007,6200\\],\n\n    \\[2009,6700\\\
    ],\\])\n\nThe script above creates a two dimensional list of integers. Consider\
    \ them car models and corresponding price. \n\nLet’s plot these data points. Execute\
    \ the following script to do so:\n\nimport matplotlib.pyplot as plt\n\nannots\
    \ = range(1, 13)  \n\nplt.figure(figsize=(12, 8))  \n\nplt.subplots\\_adjust(bottom=0.1) \
    \ \n\nplt.scatter(data\\[:,0\\],data\\[:,1\\], label='True Position')\n\nfor label,\
    \ x, y in zip(annots, data\\[:, 0\\], data\\[:, 1\\]):  \n\n    plt.annotate(\n\
