    \ 1 …\n\n    statement 2 …\n\nHere ‘i’ is any variable to which a value can be\
    \ assigned. List is the list of the elements that the “for” loop iterates upon.\
    \ Take a look at the following example to see for loop in action:\n\ncars = \\\
    ['Audi','BMW','Toyota','Honda','Ford'\\]\n\nfor car in cars:\n\n    print(car)\n\
    \nIn the script above we create a list of car names. We then use “for” loop to\
    \ iterate over this list. Let’s understand how for loop actually executes behind\
    \ the scene. During the first iteration the first item of the cars list (the item\
    \ at index 0) which is “Audi” in this case, is assigned to the car variable. The\
    \ value of the car variable is printed on the screen. During the second iteration,\
    \ the second list items is stored in the car variable and printed on the screen\
    \ and so on. The output of the script above looks like this:\n\n![](Images/image00349.jpeg)\n\
    \nUsing Range Function\n\nWhat if we want to execute a particular statement without\
    \ having a list? We can use “range” function to do so. Basically range function\
    \ also returns an iterate-able sequence that the “for” loop can iterate on. For\
    \ instance if we want to execute a “for” loop 10 times, we can use range function\
    \ as follows.  Take a look at the following example:\n\n for i in range(10):\n\
    \n    print(i)\n\nThe range function returns a sequence with specified number\
    \ of integers, starting from 0. The output of the above script will be integers\
    \ from 0 to 9."
