    `N1 = 10`

    `N2 = 5`


    ### 赋值运算符


    赋值运算符用于给操作数赋值。下表包含了关于赋值运算符的信息。假设 `N1` 等于 10 且 `N2` 等于 5。


    | Operator | Symbol | Description | Example |

    | --- | --- | --- | --- |

    | 赋值 | `=` | 给操作数赋值。 | |

    | 加赋值 | `+=` | 将两边的操作数相加并赋值结果。 | |

    | 减赋值 | `-=` | 减去两边的操作数并赋值结果。 | |

    | 乘赋值 | `*=` | 将两边的操作数相乘并赋值结果。 | |

    | 除赋值 | `/=` | 将左的操作数除以右侧的操作数并赋值结果。 | |

    | 取模赋值 | `%=` | 将左的操作数除以右侧的操作数并返回余数。 | |

    | 幂赋值 | `**=` | 取左侧操作数的右侧幂并赋值。 | |


    查看以下示例以了解赋值运算符的用法：


    ```

    N1 = 10

    N2 = 5

    R = N1 + N2

    ```


    ### 成员运算符


    成员运算符用于检查操作数存储的值是否存在于特定序列。Python 中有两种成员运算符：`in` 和 `not in`。`in` 运算符在特定序列中找到值时返回
    true。`not in` 运算符在相反的情况下返回 true。查看以下示例以了解成员运算符的用法。


    ```python

    cars = [''Honda'', ''Toyota'', ''Audi'', ''Ford'', ''Camery'']

    print(''Honda'' in cars) # 返回 True

    print(''BMW'' in cars) # 返回 False

    print(''Honda'' not in cars) # 返回 False

    print(''BMW'' not in cars) # 返回 True

    ```


