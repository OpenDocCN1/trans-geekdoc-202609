- raw: "Technically, any number can be assigned to the month. However, logically there\
    \ are only 12 months in a year. So the number should be between 1 and 12. This\
    \ is where properties come handy. Using properties you can control the value assigned\
    \ and retrieved from the class members.\n\nTake a look at the following script\
    \ to see how properties can be created:\n\n\\# Creates class Medicine\n\nclass\
    \ Medicine:\n\n#Creates Medicine class constructor\n\n    def \\_\\_init\\_\\\
    _(self, name, expiry\\_year, expiry\\_month):\n\n        #initialize instance\
    \ variables\n\n        self.name = name\n\n        self.expiry\\_year = expiry\\\
    _year\n\n        self.expiry\\_month = expiry\\_month\n\n    #Creates expiry\\\
    _month property\n\n    @property\n\n    def expiry\\_month(self):\n\n        return\
    \ self.\\_\\_expiry\\_month\n\n    #Create property setter\n\n    @expiry\\_month.setter\n\
    \n    def expiry\\_month(self, expiry\\_month):\n\n        if expiry\\_month <\
    \ 1:\n\n            self.\\_\\_expiry\\_month = 1\n\n        elif expiry\\_month\
    \ > 12:\n\n            self.\\_\\_expiry\\_month = 12\n\n        else:\n\n           \
    \ self.\\_\\_expiry\\_month = expiry\\_month\n\n    def getExpiryDate(self):\n\
    \n        print ('The expiration date is : '+str(self.expiry\\_month)+'/'+str(self.expiry\\\
    _year))\n\nTo create a property for an attribute, you have to create method with\
    \ the same name as the name of the attribute. For instance in the above script\
    \ we wanted to create “expiry\\_month” property, therefore we created a method\
    \ “expiry\\_month” and inside the method we return the value for “expiry\\_month”\
    \ attribute using self and double underscore syntax. Remember that the property\
    \ method must be decorated with the @property literal as shown in the script above.\n\
    \nOnce the property is created, the next step is to set the rules on the property.\
    \ Property setter is used for this purpose. The following script sets the rule\
    \ on the “expiry\\_month” property.\n\n  #Create property setter\n\n    @expiry\\\
    _month.setter\n\n    def expiry\\_month(self, expiry\\_month):\n\n        if expiry\\\
    _month < 1:\n\n            self.\\_\\_expiry\\_month = 1\n\n        elif expiry\\\
    _month > 12:\n\n            self.\\_\\_expiry\\_month = 12\n\n        else:\n\n\
                self.\\_\\_expiry\\_month = expiry\\_month\n\nThe logic implemented\
    \ by the above script is simple. If the value assigned to the expiry\\_month is\
    \ less than 1, then assign 1 to the expiry\\_month attribute. Else if the value\
    \ assigned is greater than 12, assign 12 to the expiry\\_month variable. Finally,\
    \ if the value assigned is between 1 and 12, assign that value. \n\nExecute the\
    \ following script:\n\n medicine1 = Medicine(\"xyz\", 2020, 15)\n\nmedicine1.getExpiryDate()\n\
    \nIn the script above, we create medicine1 object of Medicine class. Using the\
    \ constructor, 15 is assigned as the value for expiry\\_month attribute. But since\
    \ we have an expiry\\_month property, 12 will be assigned to the expiry\\_month\
    \ attribute. If you call the getExpiryDate method, you will see 12 as expiry\\\
    _month as shown in the output below:\n\n![](Images/image00403.jpeg)\n\n### Static\
    \ Methods\n\nClass methods are similar to functions with two major differences.\
    \ Class methods are defined inside class body. Class methods take “self” as the\
    \ first parameter. In this chapter we have seen several examples of instance methods.\
    \ Instance methods are the methods that are called via class object. There is\
    \ another category of methods that can be called using class name. These methods\
    \ are called static methods. Take a look at the following example to see static\
    \ methods in action:\n\n#Creates Person Class\n\nclass Person:\n\n   @staticmethod\n\
    \n   def run():\n\n       print (\"Person is running\")\n\n   def stand(self):\n\
    \n       print (\"Person is standing\")\n\nIn the script above, we create a class\
    \ Person with one static method run and with one non static method stand. There\
    \ are two differences between a static and non-static method in Python. A static\
    \ method has to be decorated with @staticmethod decorator. On the other hand,\
    \ non-static method doesn’t require any decorator. Similarly, a static method\
    \ doesn’t need self as first parameter while the non-static method requires self\
    \ as first parameter.\n\nLet’s call the static method run via Person class.\n\n\
    Person.run()\n\nThe output of the script above looks like this:\n\n![](Images/image00404.jpeg)\n\
    \n### Special Methods\n\nSpecial methods or Magic methods are used to add special\
    \ functionality to a class. The name of a special method starts and ends with\
    \ double underscores. The constructor \\_\\_init\\_\\_ is also a type of special\
    \ methods. Other examples of special methods include str, del etc. \n\nPrimitive\
    \ objects also contain special methods. For instance, int object contains \\_\\\
    _add\\_\\_ method which adds two integers. Take a look at the following example:\n\
    \n#Adding two numbers\n\nint.\\_\\_add\\_\\_(15, 30)\n\nThe output of the above\
    \ script will be 45.\n\nThe \\_\\_add\\_\\_ method\n\nSpecial methods can be overridden.\
    \ For instance you can override \\_\\_add\\_\\_ special method to add two or more\
    \ custom classes. Take a look at the following example to see special Methods\
    \ in action.\n\n\\# Creates class Person\n\nclass Person:\n\n#Creates method with\
    \ instance attributes\n\n    def \\_\\_init\\_\\_(self, age):\n\n        #initialize\
    \ instance variables\n\n        self.age = age\n\n#Overriding \\_\\_add\\_\\_\
    \ special method\n\n    def \\_\\_add\\_\\_(self, other):\n\n        return self.age\
    \ + other.age\n\nIn the script above, we create a class named Person. The class\
    \ has one attribute age which is initialized via constructor. The \\_\\_add\\\
    _\\_ method is overridden inside the Person class to add the age attribute of\
    \ this class with the age attribute of the class object passed to the right side\
    \ of the “+” operator.\n\nNow when the two objects of the Person class are added\
    \ via the “+” operator, actually the values for the age attributes of the objects\
    \ will be added. Take a look at the following script:\n\nperson1 = Person(10)\n\
    \nperson2 = Person(20)\n\nsum\\_of\\_age = person1 + person2\n\nprint(sum\\_of\\\
    _age)\n\nIn the script, 30 will be printed on the screen since sum of the age\
    \ of person1 and person2 objects is 30. \n\nThe \\_\\_gt\\_\\_ method\n\nThe \\\
    _\\_gt\\_\\_ special method is used to compare two or more classes for comparison.\
    \ If the attribute of the class on the rleft hand side of the “>” is greater than\
    \ the attribute of the class on the right hand side, the \\_\\_gt\\_\\_ method\
    \ returns true, else it returns false. Let’s modify our Person class to override\
    \ the \\_\\_gt\\_\\_ method for the comparison of age attribute. Take a look at\
    \ the following script:\n\n\\# Creates class Person\n\nclass Person:\n\n#Creates\
    \ method with instance attributes\n\n    def \\_\\_init\\_\\_(self, age):\n\n\
            #initialize instance variables\n\n        self.age = age\n\n#Overriding\
    \ \\_\\_add\\_\\_ special method\n\n    def \\_\\_add\\_\\_(self, other):\n\n\
            return self.age + other.age\n\n#Overriding \\_\\_gt\\_\\_ special method\n\
    \n    def \\_\\_gt\\_\\_(self, other):\n\n        return self.age > other.age\n\
    \nNow, let’s create two objects of Person class again and compare their age using\
    \ “>” operator. Take a look at the following script:\n\nperson1 = Person(10)\n\
    \nperson2 = Person(20)\n\nperson1 > person2\n\nThe value for person1 age attribute\
    \ is 10 while the value for person2 age attribute is 20. Next, person1 object\
    \ is being compared to person2 object using “>” operator. But since person1 object’s\
    \ age attribute is less than person2’s age attribute, False will be returned.\n\
    \nThe \\_\\_str\\_\\_ method\n\nThe \\_\\_str\\_\\_ method is called when the\
    \ object is used as string. For instance when you pass the object to print method,\
    \ the \\_\\_str\\_\\_ method of the object executes. Like any other special methods,\
    \ the \\_\\_str\\_\\_ method can also be overridden. Take a look at the following\
    \ example to see how we can override \\_\\_str\\_\\_ method of the Person class\
    \ so that it prints the name of the Person. \n\n\\# Creates class Person\n\nclass\
    \ Person:\n\n#Creates method with instance attributes\n\n    def \\_\\_init\\\
    _\\_(self, name):\n\n        #initialize instance variables\n\n        self.name\
    \ = name\n\n    def \\_\\_str\\_\\_(self,):\n\n        return \"The person is\
    \ \" + self.name"
  fmt: "\nTechnically, any number can be assigned to the month. However, logically\
    \ there are only 12 months in a year. So the number should be between 1 and 12.\
    \ This is where properties come handy. Using properties you can control the value\
    \ assigned and retrieved from the class members.\n\nTake a look at the following\
    \ script to see how properties can be created:\n\n```python\n# Creates class Medicine\n\
    class Medicine:\n    #Creates Medicine class constructor\n    def __init__(self,\
    \ name, expiry_year, expiry_month):\n        #initialize instance variables\n\
    \        self.name = name\n        self.expiry_year = expiry_year\n        self.expiry_month\
    \ = expiry_month\n\n    #Creates expiry_month property\n    @property\n    def\
    \ expiry_month(self):\n        return self.__expiry_month\n\n    #Create property\
    \ setter\n    @expiry_month.setter\n    def expiry_month(self, expiry_month):\n\
    \        if expiry_month < 1:\n            self.__expiry_month = 1\n        elif\
    \ expiry_month > 12:\n            self.__expiry_month = 12\n        else:\n  \
    \          self.__expiry_month = expiry_month\n\n    def getExpiryDate(self):\n\
    \        print ('The expiration date is : '+str(self.expiry_month)+'/'+str(self.expiry_year))\n\
    ```\n\nTo create a property for an attribute, you have to create method with the\
    \ same name as the name of the attribute. For instance in the above script we\
    \ wanted to create `expiry_month` property, therefore we created a method `expiry_month`\
    \ and inside the method we return the value for `expiry_month` attribute using\
    \ `self` and double underscore syntax. Remember that the property method must\
    \ be decorated with the `@property` literal as shown in the script above.\n\n\
    Once the property is created, the next step is to set the rules on the property.\
    \ Property setter is used for this purpose. The following script sets the rule\
    \ on the `expiry_month` property.\n\n```python\n#Create property setter\n@expiry_month.setter\n\
    def expiry_month(self, expiry_month):\n    if expiry_month < 1:\n        self.__expiry_month\
    \ = 1\n    elif expiry_month > 12:\n        self.__expiry_month = 12\n    else:\n\
    \        self.__expiry_month = expiry_month\n```\n\nThe logic implemented by the\
    \ above script is simple. If the value assigned to `expiry_month` is less than\
    \ 1, then assign 1 to the `expiry_month` attribute. Else if the value assigned\
    \ is greater than 12, assign 12 to the `expiry_month` variable. Finally, if the\
    \ value assigned is between 1 and 12, assign that value.\n\nExecute the following\
    \ script:\n\n```python\nmedicine1 = Medicine(\"xyz\", 2020, 15)\nmedicine1.getExpiryDate()\n\
    ```\n\nIn the script above, we create `medicine1` object of `Medicine` class.\
    \ Using the constructor, 15 is assigned as the value for `expiry_month` attribute.\
    \ But since we have an `expiry_month` property, 12 will be assigned to the `expiry_month`\
    \ attribute. If you call the `getExpiryDate` method, you will see 12 as `expiry_month`\
    \ as shown in the output below:\n\n![](Images/image00403.jpeg)\n\n### Static Methods\n\
    \nClass methods are similar to functions with two major differences. Class methods\
    \ are defined inside class body. Class methods take `self` as the first parameter.\
    \ In this chapter we have seen several examples of instance methods. Instance\
    \ methods are the methods that are called via class object. There is another category\
    \ of methods that can be called using class name. These methods are called static\
    \ methods. Take a look at the following example to see static methods in action:\n\
    \n```python\n#Creates Person Class\nclass Person:\n    @staticmethod\n    def\
    \ run():\n        print (\"Person is running\")\n    def stand(self):\n      \
    \  print (\"Person is standing\")\n```\n\nIn the script above, we create a class\
    \ `Person` with one static method `run` and with one non-static method `stand`.\
    \ There are two differences between a static and non-static method in Python.\
    \ A static method has to be decorated with `@staticmethod` decorator. On the other\
    \ hand, non-static method doesn’t require any decorator. Similarly, a static method\
    \ doesn’t need `self` as first parameter while the non-static method requires\
    \ `self` as first parameter.\n\nLet’s call the static method `run` via `Person`\
    \ class.\n\n```python\nPerson.run()\n```\n\nThe output of the script above looks\
    \ like this:\n\n![](Images/image00404.jpeg)\n\n### Special Methods\n\nSpecial\
    \ methods or Magic methods are used to add special functionality to a class. The\
    \ name of a special method starts and ends with double underscores. The constructor\
    \ `__init__` is also a type of special methods. Other examples of special methods\
    \ include `str`, `del` etc. \n\nPrimitive objects also contain special methods.\
    \ For instance, `int` object contains `__add__` method which adds two integers.\
    \ Take a look at the following example:\n\n```python\n#Adding two numbers\nint.__add__(15,\
    \ 30)\n```\n\nThe output of the above script will be 45.\n\n### `__add__` method\n\
    \nSpecial methods can be overridden. For instance you can override `__add__` method\
    \ to add custom classes. Take a look at the following example to see methods in\
    \ action:\n\n```python\n# Creates Person\nclass Person:\n    #Creates method with\
    \ instance attributes\n    def __init__(self, age):\n        #initialize instance\
    \ variables\n        self.age = age\n\n    #Overriding __add__ special method\n\
    \    def __add__(self, other):\n        return self.age + other\n```\n\nIn the\
    \ script above, we create a class named `Person`. The class has one attribute\
    \ which is initialized via constructor. `__add__` method is overridden inside\
    \ the `Person` class to add the age of objects. Take a look at the following script:\n\
    \n```python\nperson1 = Person(10)\nperson2 = Person(20)\nsum_of_age = person1\
    \ + person2\nprint(sum_of_age)\n```\n\nIn the script, 30 will be printed since\
    \ sum of person1 and person2 added.\n\n### `__gt__` method\n\nThe `__gt__` special\
    \ method is used to compare two classes. If the attribute of the class on the\
    \ left side of `>` is greater than the attribute of the right side, the `__gt__`\
    \ method returns true, else it returns false. Let’s modify our `Person` class\
    \ to override `__gt__` method for comparison.\n\n```python\n# Creates Person\n\
    class Person:\n    #Creates method with instance attributes\n    def __init__(self,\
    \ age):\n        #initialize instance variables\n        self.age = age\n\n  \
    \  #Overriding __add__ special method\n    def __add__(self, other):\n       \
    \ return self.age + other\n\n    #Overriding __gt__ special method\n    def __gt__(self,\
    \ other):\n        return self.age > other.age\n```\n\nNow, let’s create two objects\
    \ of `Person` class again and compare their age using `>` operator.\n\n```python\n\
    person1 = Person(10)\nperson2 = Person(20)\nperson1 > person2\n```\n\nThe value\
    \ for person1 age attribute is 10 while the value for person2 age attribute is\
    \ 20. Next, person1 object is being compared to person2 object using `>` operator.\
    \ But since person1 object’s age attribute is less than person2’s age attribute,\
    \ False will be returned.\n\n### `__str__` method\n\nThe `__str__` method is called\
    \ when the object is used as string. For instance when you pass the object to\
    \ `print method, the `__str__` method of the object executes. Like any other special\
    \ methods, the `__str__` method can also be overridden. Take a look at the following\
    \ example to see how we can override `__str__` method of the `Person` class so\
    \ that it prints the name of the Person.\n\n```python\n# Creates Person\nclass\
    \ Person:\n    #Creates method with instance attributes\n    def __init__(self,\
    \ name):\n        #initialize instance variables\n        self.name = name\n\n\
    \    def __str__(self):\n        return \"The person is \" + self.name\n```\n"
  trans: "\n从技术上讲，月份可以赋予任何数字。但从逻辑上讲，一年只有 12 个月月份。因此，数字应该在 1 到 12 之间。这就是属性派上用场的地方。通过属性，你可以控制从类成员中赋值和检索的值。\n\
    \n查看以下脚本以了解如何创建属性：\n\n```python\n# 创建 Medicine 类\nclass Medicine:\n    # 创建 Medicine\
    \ 类构造函数\n    def __init__(self, name, expiry_year, expiry_month):\n        # 初始化实例变量\n\
    \        self.name = name\n        self.expiry_year = expiry_year\n        self.expiry_month\
    \ = expiry_month\n\n    # 创建 expiry_month 属性\n    @property\n    def expiry_month(self):\n\
    \        return self.__expiry_month\n\n    # 创建属性 setter\n    @expiry_month.setter\n\
    \    def expiry_month(self, expiry_month):\n        if expiry_month < 1:\n   \
    \         self.__expiry_month = 1\n        elif expiry_month > 12:\n         \
    \   self.__expiry_month = 12\n        else:\n            self.__expiry_month =\
    \ expiry_month\n\n    def getExpiryDate(self):\n        print ('过期日期为：'+str(self.expiry_month)+'/'+str(self.expiry_year))\n\
    ```\n\n要为属性创建一个属性，你必须创建一个与属性名称同名的方法。例如，在上面的脚本中，我们想要创建一个 `expiry_month` 属性，因此我们创建了一个名为\
    \ `expiry_month` 方法，并在方法内部使用 `self` 和双下划线语法返回 `expiry_month` 属性的值。请记住，属性方法必须像上面脚本所示用\
    \ `@property` 字面量进行装饰。\n\n一旦创建了属性，下一步是为该属性设置规则。属性 setter 就被用于此目的。以下脚本为 `expiry_month`\
    \ 属性设置了规则。\n\n```python\n# 创建属性 setter\n@expiry_month.setter\ndef expiry_month(self,\
    \ expiry_month):\n    if expiry_month < 1:\n        self.__expiry_month = 1\n\
    \    elif expiry_month > 12:\n        self.__expiry_month = 12\n    else:\n  \
    \      self.__expiry_month = expiry_month\n```\n\n上述脚本实现的逻辑非常简单。如果赋值给 `expiry_month`\
    \ 的值小于 1，则将 1 赋值给 `expiry_month` 属性。如果赋值的值大于 12，则将 12 赋值给 `expiry_month` 变量。最后，如果赋值在\
    \ 1 到 12 之间，则赋值该值。\n\n执行以下脚本：\n\n```python\nmedicine1 = Medicine(\"xyz\", 2020,\
    \ 15)\nmedicine1.getExpiryDate()\n```\n\n在上面的脚本中，我们创建了 `Medicine` 类的 `medicine1`\
    \ 对象。使用构造函数，15 被赋值为 `expiry_month` 属性的值。但由于我们有一个 `expiry_month` 属性，12 将被赋值给 `expiry_month`\
    \ 属性。如果你调用 `getExpiryDate` 方法，你将看到如下输出所示的 `expiry_month` 为 12：\n\n![](img/image00403.jpeg)\n\
    \n### 静态方法\n\n类方法与函数相似，但有两个主要区别。类方法定义在类体内部。类方法将 `self` 作为第一个参数。在本章中，我们看到了几个实例方法的示例。实例方法是通过类对象调用的方法。还有另一类方法可以使用类名进行调用，这些方法被称为静态方法。查看以下示例以了解静态方法：\n\
    \n```python\n# 创建 Person 类\nclass Person:\n    @staticmethod\n    def run():\n\
    \        print (\"Person 正在运行\")\n    def stand(self):\n        print (\"Person\
    \ 正在站立\")\n```\n\n在上面的脚本中，我们创建了一个 `Person` 类，其中有一个静态方法 `run` 和一个非静态方法 `stand`。Python\
    \ 中的的静态方法和非静态方法之间有两个区别。静态方法必须用 `@staticmethod` 装饰器进行装饰。另一方面，非静态方法不需要任何装饰器。同样，静态方法不需要\
    \ `self` 作为第一个参数，而非静态方法需要 `self` 作为第一个参数。\n\n让我们通过 `Person` 类调用静态方法 `run`。\n\n\
    ```python\nPerson.run()\n```\n\n上述脚本的输出如下：\n\n![](img/image00404.jpeg)\n\n###\
    \ 特殊方法\n\n特殊方法或称为魔术方法（Magic methods），用于为类添加特殊功能。特殊方法的名称以双下划线开头和结尾。构造函数 `__init__`\
    \ 也是一种特殊方法。其他特殊方法的示例包括 `str`、`del` 等。\n\n原始对象也包含特殊方法。例如，`int` 对象包含 `__add__` 方法，用于相加两个整数。查看以下示例：\n\
    \n```python\n# 数字相加\nint.__add__(15, 30)\n```\n\n上述脚本的输出将是 45。\n\n### `__add__`\
    \ 方法\n\n特殊方法可以被重写。例如，你可以重写 `__add__` 方法来添加自定义类。查看以下示例以了解方法的用法：\n\n```python\n\
    # 创建 Person\nclass Person:\n    # 创建带有实例属性的方法\n    def __init__(self, age):\n\
    \        # 初始化实例变量\n        self.age = age\n\n    # 重写 __add__ 特殊方法\n    def __add__(self,\
    \ other):\n        self.age\n```\n\n在上面的脚本中，我们创建了一个名为 `Person` 的类。该类通过构造函数初始化了一个属性。`__add__`\
    \ 方法在 `Person` 类内部被重写以加上对象的年龄。查看以下脚本：\n\n```python\nperson1 = Person(10)\nperson2\
    \ = Person(20)\nsum_of_age = person1 + person2\nprint(sum_of_age)\n```\n\n在脚本中，将打印出\
    \ person1 和 person2 相加的结果。\n\n### `__gt__` 方法\n\n`__gt__` 特殊方法用于比较两个类。如果 `>` 左侧类的属性大于右侧类的属性，则\
    \ `__gt__` 方法返回真，否则返回假。让我们修改我们的 `Person` 类以重写用于比较的 `__gt__` 方法。\n\n```python\n\
    # 创建 Person\nclass Person:\n    # 创建实例属性的方法\n    def __init__(self, age):\n  \
    \      # 初始化实例变量\n        self.age = age\n\n    # 重写 __add__ 特殊方法\n    def __add__(self,\
    \ other):\n        return self.age + other\n\n    # 重写 __gt__ 特殊方法\n    def __gt__(self,\
    \ other):\n        return self.age > other.age\n```\n\n现在，再次创建两个 `Person` 类对象并使用\
    \ `>` 运算符比较它们的年龄。\n\n```python\nperson1 = Person(10)\nperson2 = Person(20)\nperson1\
    \ > person2\n```\n\nperson1 的年龄属性值为 10，而 person2 的年龄属性值为 20。接下来，使用 `>` 运算符比较 person1\
    \ 对象和 person2 对象。但由于 person1 对象的年龄属性小于 person2 对象的年龄属性，将返回 False。\n\n### `__str__`\
    \ 方法\n\n`__str__` 方法在对象被用字符串时被调用。例如，当你将对象传递给 `print` 方法时，对象的 `__str__` 方法就会执行。和其他任何特殊方法一样，`__str__`\
    \ 方法也可以被重写。查看以下示例，了解如何重写 `Person` 类的 `__str__` 方法，以便打印人的名字。\n\n```python\n# 创建\
    \ Person\nclass Person:\n    # 创建实例属性的方法\n    def __init__(self, name):\n    \
    \    # 初始化实例变量\n        self.name = name\n\n    def __str__(self):\n        return\
    \ \"这个人是 \" + self.name\n```\n"
