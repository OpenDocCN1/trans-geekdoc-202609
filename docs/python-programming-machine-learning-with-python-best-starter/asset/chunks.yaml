    在上面的脚本中，第一行从 `sklearn.preprocessing` 库导入了 `Imputer` 类。接下来我们创建了 `Imputer` 类的对象。`Imputer`
    类的构造函数接受三个参数：`missing_value`、`strategy` 和 `axis`。`missing_value` 参数指定了需要替换的值。在我们的数据集中，缺失值被标记为“nan”，因此我们为
    `missing_value` 参数指定了“NaN”。`Strategy` 参数指定了我们想要使用的填充缺失值的策略类型，它可以取值为 `mean`（平均值）、`median`（中位数）和
    `most_frequent`（众数）。最后，`axis` 参数指定了我们想要进行插补的轴。`axis 0` 指定列轴，而 `axis 1` 指定行轴。


    接下来我们执行了 `Imputer` 类的 `fit` 方法。该方法接受我们想要处理缺失值的列作为输入。最后我们执行 `transform` 函数，它实际上通过列
    1 的平均值填充了列 1 中的缺失值。当你执行上面的脚本时，你会发现索引为 4 的记录之前列 1（即 BMI）有缺失值，现在它包含了 BMI 列中所有值的平均值。如下所示所示：


    ![](img/image00441.gif)


    ### 处理分类数据


    我们知道机器学习算法是基于数学概念的，而数学本质都是关于数字的。因此，将数据中的所有分类值转换为数值是非常方便的。如果我们查看 `patients.csv`，我们发现有两个带有分类值的列：`Gender`（性别）和
    `Diabetic`（糖尿病）。


    幸运的是，在 `sklearn.preprocessing` 库中我们有 `LabelEncoder` 类，它接受分类列作为输入并返回相应的数值输出。来看以下脚本：


    ```python

    from sklearn.preprocessing import LabelEncoder


    labelencoder_features = LabelEncoder()


    features[:,2]= labelencoder_features.fit_transform(features[:,2])

    ```


    与 `Imputer` 类一样，`LabelEncoder` 类也有 `fit_transform` 方法，它基本上是 `fit` 和 `transform`
    方法的组合。该类接受分类列作为输入并返回相应的数值。在上面的脚本中，我们将 `Gender` 列（即索引为 2 的列）传递给 `LabelEncoder`
    类。执行完上面的脚本后，如果你检查 `Gender` 列的值，你会发现 Male 和 Female 被替换成了数字 1 和 0，如下所示：


    ![](img/image00442.jpeg)


    同样，标签向量也可以转换为一组数值，如下：


    ```python

    labels = labelencoder_features.fit_transform(labels)

    ```


    ### 将数据划分为训练集和测试集


    在第一章中，我们讨论了机器学习模型是在数据集的一个子集上训练，并在数据集的另一个子集上进行测试的。训练集和测试集之间的划分是为了确保我们的机器学习算法不会过拟合。过拟合是指机器学习在训练数据上表现优异但在测试数据上结果很差的现象。一个良好的机器学习模型是在训练数据和测试数据上都能给出良好结果的模型。这样我们就可以说模型正确地从数据集中学习了底层的假设，并可以用于对任何新数据集做出正确的决策。


    `sklearn.model_selection` 库包含 `train_test_split` 类，可用于将数据划分为训练集和测试集。该类接受 `features`、`labels`
    和 `test_size` 作为参数。`test_size` 定义了测试集的大小。`test_size` 为 0.5 意味着将数据分为 50% 的测试大小和
    50% 的训练大小。下面的脚本将数据分为 75% 的训练大小和 25% 的测试大小。


    ```python

    from sklearn.model_selection import train_test_split


    train_features, test_features, train_labels, test_labels = train_test_split(features,
    labels, test_size=0.25, random_state=0)

    ```


    执行上述脚本后，你会发现 `train_features` 包含 75% 的特征，`test_features` 包含 25% 的特征，`train_labels`
    包含 75% 的标签，`test_labels` 包含 25% 的标签。

    '
