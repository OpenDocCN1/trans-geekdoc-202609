    \ points', ha='right', va='bottom')\n\nplt.show()\n\nThe data points look like\
    \ this:\n\n![](Images/image00497.jpeg)\n\nFrom the first look we can see that\
    \ point’s 1-6 form one cluster and points 7 to 12 form another cluster. \n\nNow\
    \ let’s see how dendrograms are used to form these clusters. Execute the following\
    \ script to create dendrograms for the above data points.\n\nfrom scipy.cluster.hierarchy\
    \ import dendrogram, linkage  \n\nfrom matplotlib import pyplot as plt\n\nannot\
    \ = linkage(data, 'single')\n\nmarks = range(1, 13)\n\nplt.figure(figsize=(12,\
    \ 8))  \n\ndendrogram(annot,  \n\n            orientation='top',\n\n           \
    \ labels=marks,\n\n            distance\\_sort='descending',\n\n            show\\\
    _leaf\\_counts=True)\n\nplt.show()\n\nTo create the dendrograms we can use the\
    \ dendrogram and linkage classes of the scipy.cluster.hierarchy library. \n\n\
    The dendrograms generated for the above data points looks like this:\n\n![](Images/image00498.jpeg)"
