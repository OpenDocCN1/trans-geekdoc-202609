  trans: '

    在将机器学习算法应用于数据之前，数据必须符合特定的格式。将数据转换为机器学习算法适的正确格式通常被称为**数据预处理**。根据数据集的不同，通常需要执行若干预处理步骤，以将数据转换为机器学习算法可使用的格式。以下是为机器学习算法进行数据预处理所涉及的步骤：


    1. 获取数据集

    2. 导入库

    3. 导入数据集

    4. 处理缺失值

    5. 处理分类数据

    6. 将数据划分为训练集和测试集

    7. 缩放数据


    在本章中，我们将详细学习其中的每一个步骤。


    ## 获取数据集


    我们在书中将用到的所有数据集都可以在此链接找到：


    [`drive.google.com/file/d/1TB0tMuLvuL0Ad1dzHRyxBX9cseOhUs_4/view?usp=sharing`](https://drive.google.com/file/d/1TB0tMuLvuL0Ad1dzHRyxBX9cseOhUs_4/view?usp=sharing)


    下载“rar”文件，并将“Datasets”文件夹复制到你的 D 盘。书中的所有算法都从 `D:/Datasets` 文件夹访问数据集。我们在第一章中用于预处理的数据集名为
    `patients.csv`。


    如果你进入 Datasets 文件夹并用 Microsoft Excel 打开 `patients.csv` 文件，它看起来如下：


    ![](img/image00437.gif)


    该数据集包含了 12 名患者的年龄（Age）、BMI（体重指数）和性别（Gender）。数据集还包含一列，显示患者是否患有糖尿病。Age 和 BMI 列是数值型的，因为它们包含数值；而
    Gender 和 Diabetic（糖尿病）列是分类的。


    在将你的数据集用于机器学习之前，你还需要需要区分的另一个重要区别是**自变量**和**因变量**。根据经验法则，要预测其值的变量是因变量，而用于进行预测的变量是自变量。例如，在
    `patients.csv` 数据集中，Age、BMI 和 Gender 变量是自变量，而第四列即 Diabetic 是因变量，因为它的值取决于前三列。


    ## 导入库


    Python 带有许多执行不同任务的预构建库。在书中，我们将使用 Python 的 Scikit Learn 库。但目前，我们只安装在几乎每个机器学习应用中需要的三个最基本的库。这些库是
    `numpy`、`matplotlib.pyplot` 和 `pandas`。


    ### numpy


    `numpy` 库用于执行各种高级数学函数。由于机器学习算法大量使用数学，因此强烈建议安装 `numpy` 库。


    ### matplotlib.pyplot


    该库用于绘制精美的图表。为了直观地了解我们的数据和结果，我们需要这个库。


    ### pandas


    最后，我们在本章中要安装的第三个库是 `pandas`。`pandas` 库用于方便地导入和查看数据集。


    导入这三个库，请在 Jupyter 中创建一个新的 Python notebook 或在 Spyder 中打开一个新文件（本章的代码在 Spyder 中执行），并执行以下代码行。


    ```python

    import numpy as np

    import matplotlib.pyplot as plt

    import pandas as pd

    ```


    在 Python 中使用关键字 `import` 导入库。在上面的脚本中，我们分别将 `numpy` 导入为 `np`，将 `matplotlib.pyplot`
    导入为 `plt`，将 `pandas` 导入为 `pd`。这里 `np`、`plt` 和 `pd` 是别名。我们将使用这些别名来调用这些库的不同函数。


    ## 导入数据集


    我们在上一节中已经下载了库。在本节中，我们将数据集导入到上一节创建的应用程序中。你也将了解为什么我们要导入 `pandas` 库。


    我们的数据集是 CSV（逗号分隔值）格式。`pandas` 库包含 `read_csv` 函数，它可以接受文件路径并加载数据为 DataFrame。


    ```python

    import pandas as pd

    patient_data = pd.read_csv("D:/Datasets/patients.csv")

    ```


    如果你进入 Datasets 文件夹并用 Microsoft Excel 打开 `patients.csv` 文件，它看起来如下：


    ![](img/image00437.gif)


    该数据集包含了 12 名患者的年龄、BMI（体重指数）和性别。数据集还包含一列，显示患者是否患有糖尿病。Age 和 BMI 列是数值型的，因为它们包含数值；而
    Gender 和 Diabetic（糖尿病）列是分类的。


    在将你的数据集用于机器学习之前，你还需要需要区分的另一个重要区别是自变量和因变量。根据经验法则，要预测其值的变量是因变量，而用于进行预测的变量是自变量。例如，在
    `patients.csv` 数据集中，Age、BMI 和 Gender 变量是自变量，而第四列即 Diabetic 是因变量，因为它的值取决于前三列。


    我们的数据集是 CSV（逗号分隔值）格式。`read_csv` 函数接受文件路径并加载数据为 DataFrame。


    如果你使用 Jupyter，只需执行以下脚本查看数据：


    ```python

    patient_data.head()

    ```


    如果你使用 Spyder，进入变量查看器并双击 `patient_data` 变量，如下：


    ![](img/image0038.jpeg)


    一旦你点击 `patient_data` 变量，你会看到详情：


    ![](img/image0039.jpeg)


    你可以看到 `patient_data` DataFrame 看起来是一个基于索引的矩阵。一旦我们加载了数据集，下一步是将其分为特征矩阵和标签向量。特征集包含所有自变量。


    ```python

    features = patient_data.iloc[:, 0:3].values

    labels = patient_data.iloc[:, 3].values

    ```


    在上面的脚本中，我们使用 DataFrame 的 `iloc` 函数选择所有行和前三列。`iloc` 接受两个参数：第一个是选择的行范围，第二个是选择的列范围。我们在第一个参数中指定了冒号，这意味着从数据集中选择所有行。在逗号后面的第二个参数指定了列范围，即
    0 到 3 列。这返回了 0、1、2 列。记住 `iloc` 返回的是上边界范围减一的值。0、1、2 列意味着年龄、BMI 和性别，因为 Python 遵循零索引。因此，年龄被视为第
    0 列。


    如果你现在在控制台中打印 `features`，你将看到如下结果：


    ![](img/image0440.jpeg)


    现在我们有了特征矩阵和标签向量。下一步是处理数据集中的缺失值（如果有的话）。


    ## 处理缺失值


    如果你查看 `patient_data` 对象，你会发现索引为 4 的记录 BMI 列有缺失值。处理缺失值最简单的方法是删除带有缺失值的记录。然而，有时记录包含了关键信息，不应因为某列有缺失值就删除它。


    处理缺失值的另一种方法是用某些值替换缺失值。缺失值可以用该列所有值的平均值或中位数替换。


    为了处理缺失值，我们将使用 `sklearn.preprocessing` 库中的 `Imputer` 类。看以下脚本。


    ```python

    from sklearn.preprocessing import Imputer

    imputer = Imputer(missing_values="NaN", strategy="mean", axis=0)

    imputer = imputer.fit(features[:,1:2])

    features[:,1:2] = imputer.transform(features[:,1:2])

    ```

    '
