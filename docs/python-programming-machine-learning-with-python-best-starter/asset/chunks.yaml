    # 第 1 章


    ## 引言


    Python 是一种弱类型的面向对象编程语言，用于执行各种编程任务，范围从 Web 开发、桌面应用开发到数据科学和机器学习等。得益于语法简单且易于学习，Python
    已成为世界上领先的编程语言之一。Python 由 Guido van Rossum 于 20 世纪 80 年代后期创建。本书为深入 Python 编程提供了门户。


    ### 为什么选择 Python?


