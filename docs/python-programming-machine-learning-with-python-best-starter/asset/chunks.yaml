    \ 'color':'Yellow', 'Air bags': True} \n\nfor item in cars.items():\n    print(item)\n\
    ```\n\nThe output of the script above looks like this:\n\n![](Images/image00371.jpeg)\n\
    \nSimilarly, keys and values can also be iterated using `for` loops as shown in\
    \ the following examples:\n\n```\ncars = {'name':'Honda', 'model':2013, 'color':'Yellow',\
    \ 'Air bags': True} \n\nfor key in cars.keys():\n    print(key)\n```\n\nOutput:\n\
    \n![](Images/image00372.jpeg)\n\nSimilarly for values:\n\n```\ncars = {'name':'Honda',\
    \ 'model':2013, 'color':'Yellow', 'Air bags': True} \n\nfor value in cars.values():\n\
    \    print(value)\n```\n\nOutput:\n\n![](Images/image00373.jpeg)\n\n### Adding\
    \ Item to a dictionary\n\nIt is very easy to add a new item to a dictionary. You\
    \ simply have to pass new key in index and assign it some value. Take a look at\
    \ the following example:\n\n```\ncars = {'name':'Honda', 'model':2013, 'color':'Yellow',\
    \ 'Air bags': True} \n\nprint(cars)\n\ncars['capacity'] = 500\n\nprint(cars)\n\
    ```\n\nIn the script above, we create dictionary `cars` with four items. The dictionary\
    \ is then printed on the console. Next, a new item is added to the dictionary.\
    \ The dictionary is then printed on the console again. You will see that the new\
    \ dictionary will contain five items. The output of the script above looks like\
    \ this:\n\n![](Images/image00374.jpeg)\n\n### Updating a Dictionary\n\nTo update\
    \ dictionary, pass the key for which you want to update the value as index and\
    \ assign it a new value. The following example makes it clearer:\n\n```\ncars\
    \ = {'name':'Honda', 'model':2013, 'color':'Yellow', 'Air bags': True} \n\nprint(cars)\n\
    \ncars['model'] = 2015\n\nprint(cars)\n```\n\nIn the script above the items in\
    \ the `cars` dictionary are printed before and after updating the value of the\
    \ item with key ‘model’. In the output you can see old and new value for ‘model’.\
    \ The output looks like this:\n\n![](Images/image00375.jpeg)\n\n### Deleting Dictionary\
    \ Items\n\nLike lists, the `del` function can be used to delete items from a list.\
    \ Have a look at the example below:\n\n```\ncars = {'name':'Honda', 'model':2013,\
    \ 'color':'Yellow', 'Air bags': True} \n\nprint(cars)\n\ndel cars['model']\n\n\
    print(cars)\n```\n\nTo delete an item you use `del` function followed by the name\
    \ of the dictionary. The key of the item that you want to delete is passed as\
    \ index to the dictionary name. The script above shows items in the `cards` dictionary,\
    \ before and after deleting the item with key ‘model’. The output looks like this:\n\
    \n![](Images/image00376.jpeg)\n\nYou can also delete all the items in a dictionary\
    \ using `clear` function. The following example shows that:\n\n```\ncars = {'name':'Honda',\
    \ 'model':2013, 'color':'Yellow', 'Air bags': True} \n\nprint(cars)\n\ncars.clear()\n\
    \nprint(cars)\n```\n\nThe output of the script above looks like this:\n\n![](Images/image00377.jpeg)\n\
    \n### Finding Dictionary Length\n\nLike tuples and lists, length of a dictionary\
    \ can be found using `len` function. Take a look at the following example:\n\n\
    ```\ncars = {'name':'Honda', 'model':2013, 'color':'Yellow', 'Air bags': True}\
    \ \n\nprint(len(cars))\n```\n\nThe script above returns 4 since there are 4 elements\
    \ in the `cars` dictionary.\n\n### Checking the existence of an Item in Dictionary\n\
    \nTo check if an item with certain key exists in a dictionary both in `in` and\
    \ `not in` methods can be used. Take a look at the following script:\n\n```\n\
    cars = {'name':'Honda', 'model':2013, 'color':'Yellow', 'Air bags': True} \n\n\
    print('color' in cars)\n\nprint('model' not in cars)\n```\n\nIn the script above,\
    \ the `in` operator will return true since the key `color` exists in the dictionary.\
    \ However the operator `not in` will return false since the key `model` also exist\
    \ in the dictionary. The output of the script above looks like this:\n\n![](Images/image00378.jpeg)\n\
    \n### Copying Dictionaries\n\nTo copy one dictionary to the other, you can use\
    \ `copy` function. Take a look at the following example:\n\n```\ncars = {'name':'Honda',\
    \ 'model':2013, 'color':'Yellow', 'Air bags': True} \n\ncars2 = cars.copy()\n\n\
    print(cars2)\n```\n\nIn the script above, we create dictionary `cars` with four\
    \ items. We then copy this dictionary to another dictionary `cars2`. The newly\
    \ created dictionary is then copied on the console. The output looks like this:\n\
    \n![](Images/image00379.jpeg)\n\n## What’s next?\n\nIn this article we studied\
    \ lists, tuples and dictionaries which are the most commonly used data structures\
    \ for storing collections in Python. We saw how these collections are created\
    \ and what are some of the most commonly used functions that can be applied to\
    \ these. In the next chapter we will see different types of exceptions (errors)\
    \ in python and how to handle these errors. Happy Coding!\n\n# Chapter 9\n\n##\
    \ Exception Handling in Python\n\nErrors and exceptions are part and parcel of\
    \ a computer program in the development phase. The importance of handling exceptions\
    \ is reflected by the fact that most of the software companies have a dedicated\
    \ Quality Assurance (QA) department, responsible for ensuring that the final product\
    \ is error free. In this chapter we will study what different types of python\
    \ exceptions are, and how to handle these exceptions.\n\n### What is an Exception?\n\
    \nException is an event that disrupts the program execution. In simple words,\
    \ when a Python scripts encounters a situation that it cannot deal with, it raises\
    \ an exception. In Python, exception is raised in the form of object. Whenever\
    \ an exception occurs, an object is initialized that contains information about\
    \ the exception. An exception has to be handled in Python, otherwise the program\
    \ quits executing.\n"
  trans: "\n在上面的脚本中，我们创建了一个包含 5 个元素的列表 `colors`。然后我们检查了 `colors` 变量的类型。接着我们创建了另一个变量\
