    \ 3 notebook that looks like this:\n\n![](Images/image00326.jpeg)\n\nJupyter notebook\
    \ consists of cells. Python script is written inside these cells. Let’s print\
    \ hello world using Jupyter notebook. In the first cell of the notebook enter\
    \ “print(‘hello world’) and press CTRL+ ENTER. The script in the first cell will\
    \ be executed as shown below:\n\n![](Images/image00327.jpeg)\n\nThe “print” function\
    \ prints the string passed to it as parameter, in the output. To create a new\
    \ cell, click the “+” button from the top left menu as shown below:\n\n![](Images/image00328.jpeg)\n\
    \nYou can write Python script in the new cell and press CTRL + ENTER to execute\
    \ it.\n\nRunning Scripts via Spyder\n\nWhile Jupyter notebook is a good place\
    \ to start writing Python programs, once you get comfortable with Python, you\
    \ should move to Spyder IDE. Spyder allows us to directly create Python files.\
    \ Spyder is similar to more conventional text editors with options to Run file,\
    \ Run piece of code, debug code etc.\n\nJust like Jupyter notebook, you can run\
    \ Spyder from Anaconda Navigator or directly from Start Menu. You will be presented\
    \ with the following interface once you run Spyder.\n\n![](Images/image00329.jpeg)\n\
    \nOn the left side of the Spyder interface, you can see text editor; this is where\
    \ you enter your script. On the bottom right you have console window. You can\
    \ directly execute scripts in the console window. Furthermore, the output of the\
    \ code written in the editor also appears in the console window. Let’s write hello\
    \ world program in Spyder.\n\n![](Images/image00330.jpeg)\n\nTo run script in\
    \ Python you have two options. You can either click the green triangle from the\
    \ top menu or you can select the piece of code you want to execute and press CTRL\
    \ + ENTER from the keyboard. You will see the output in the console window.\n\n\
    What’s next?\n\nIn this chapter we saw the process of setting up the environment\
    \ required to run python programs. We wrote our first python program in two different\
    \ editors. In the next chapter we will start our discussion about Python syntax.\
    \ Happy Coding!!!\n\n#  \n\n#  \n\n#  \n\n#  \n\n#  \n\n# Chapter 3\n\n## Python\
    \ Syntax \n\nTo write python code, you need to follow some rules. In programming\
    \ terms, these rules are collectively called syntax. Python’s unique syntax is\
    \ one of the reasons that novice programmers find it easy to learn and program.\
    \ In this chapter we shall study python syntax in detail.\n\n### Simple Statements\n\
    \nUnlike most of the other object oriented programming languages, Python doesn’t\
    \ require a semi colon at the end of the statement if there is only single statement\
    \ in the line. In case if you want to write multiple python statements on one\
    \ line (Which is highly not recommended), you have to separate them with semi-colon.\
    \ Take a look at the following example.\n\nHere we write two Python statements\
    \ on two separate lines. We don’t need semicolon.\n\nprint (\"Welcome to Python\"\
    )\n\nprint (\"It is fun learning Python\")\n\nWhen you execute the above statement,\
    \ you will see following output:\n\n![](Images/image00331.jpeg)\n\nNow let’s write\
    \ two statements on one line separated by semi colon:\n\nprint (\"Welcome to Python\"\
    ) ; print (\"It is fun learning Python\")\n\nThe output of the above script will\
    \ be same since they actually are two statements even if they are written on one\
    \ line.\n\nYou can also write a python statement that spans multiple lines. To\
    \ do so, you have to append backward slash at the end of the line. Backward slash\
    \ denotes that the statement continues to the next line. Take a look at the following\
    \ script:\n\nsum = 10 + 20 + \\\\\n\n      30 + 40 + \\\\\n\n      50\n\nprint(sum)\n\
    \n### Code Blocks and Indentation\n\nIndentation is one of the most striking features\
    \ of Python syntax. In almost all of the other programming languages, braces are\
    \ used to specify the scope of the code block. In Python, indentations specify\
    \ the scope of the code block. Look at the following code snippet.\n\nif 10 >\
    \ 3:\n\n    print(\"This is inside if block\")\n\n    print(\"This is also inside\
    \ if block\")\n\nprint(\"This is outside if block\")\n\nif 10 < 3:\n\n    print(\"\
    This is inside if block\")\n\n    print(\"This is also inside if block\")\n\n\
    In the script above, the ‘if’ block evaluates if 10 is greater than 3, and then\
    \ executes next two print statements that are indented 4 tabs to the right (which\
    \ is standard). The statements indented are part of the “if block”. After that,\
    \ statement outside the ‘if’ block executes. The second if block evaluates if\
    \ 10 is less than 3, which returns false. Therefore the statements that are part\
    \ of the second ‘if’ block, indented to the right, do not execute.  \n\nAnother\
    \ important point to note is that the ‘if’ condition is also not enclosed inside\
    \ braces like other programming languages. The ‘if’ block starts with a colon,\
    \ followed by statements indented to the right.\n\nIt is pertinent to mention\
    \ here that all the statements within a code block should have same indentation\
    \ or else Python will throw an error. Take a look at the following example.\n\n\
    if 10 > 3:\n\n    print(\"This is inside if block\")\n\n     print(\"This has\
    \ different indentation\")\n\nprint(\"This is outside if block\")\n\nIf you try\
    \ to run the above script, you will get an error that looks like this:\n\n![](Images/image00332.jpeg)\n\
    \nThere are several advantages of using indentation for code blocks rather than\
    \ braces. Indentation forces developers to write readable code with fewer inconsistencies.\
    \ \n\n### Python Identifiers\n\nAn Identifier in programming is a name assigned\
    \ to any variable, function, module or a class. A Python identifier can contains\
    \ letters from A-Z a-z, numbers from 0-9 and underscore. A python identifier name\
    \ must begin with a letter or an underscore. Python is a case sensitive language\
    \ which means “Customer” and “customer” are considered two different identifiers\
    \ in Python.\n\nNaming Conventions\n\nHere are some python naming conventions:\n\
    \n*   Package and module names are all lower case\n\n*   Classes are declared\
    \ in bumpy case with first letter of the individual words capitalized. For instance\
    \ “CustomerProductRecord” is a valid class name.\n\n*   For methods and functions\
    \ convention is to use lowercase letters with individual words separated by underscores.\
    \ For example person\\_name, get\\_age etc.\n\n*   Private variable names begin\
    \ with single underscore\n\n*   Strongly private variable names begin with double\
    \ underscore\n\n### Python Keywords\n\nKeywords are special words that are reserved\
    \ by python to perform special tasks. For example keyword class is used to define\
    \ a class. Similarly keyword “for” is used to define a loop. Keywords cannot be\
    \ used as identifier or constant names.  Python has following set of keywords.\n\
    \n| and || exec || not |\n\n| --- | --- | --- |\n\n| assert || finally || or |\n\
    \n| break || For || Pass |\n\n| class || From || Print |\n\n| continue || global\
    \ || Raise |\n\n| def || If || Return |\n\n| del || import || Try |\n\n| elif\
    \ || In || While |\n\n| else || Is || With |\n\n| except || lambda || Yield |\n\
    \n### Capturing User Input\n\nCapturing user input is one of the most fundamental\
    \ programming tasks. Python makes it simple. In Python 3, you can use the input()\
    \ function and pass it the string that you want to display to the user. Take a\
    \ look at the following screen shot:\n\n![](Images/image00333.jpeg)\n\nAnything\
    \ you enter in the textbox will be stored inside the text variable. \n\nWhat’s\
    \ next?"
