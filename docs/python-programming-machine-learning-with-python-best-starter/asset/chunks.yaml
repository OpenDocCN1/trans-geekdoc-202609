    \ some of the different types of functions associated with them. \n\n### Lists\n\
    \nA list in Python is similar to an array in other programming languages. A list\
    \ stores collection of objects of different types and is mutable. \n\nCreating\
    \ a List\n\nThere are different ways to create a list. The simplest way to create\
    \ a list is by enclosing comma separated list of items within square brackets\
    \ and assigning it to a variable as shown in the example below:\n\ncolors = \\\
    ['Red', 'Green', 'Blue', 'Yellow', 'White'\\]\n\nThe script above creates a list\
    \ named colors. Other ways to create a list are by using constructors \\[\\] and\
    \ list(). As shown below.\n\ncolors2 = \\[\\]\n\ncolors3 = list()\n\nThe above\
    \ script creates two empty lists: colors2 and colors3. \n\nTo create list of sequence\
    \ of integers you can use range function and convert into list using list function.\
    \ The range function returns a list of sequence of integers from 0 to 1 less than\
    \ the value passed to it as parameter as shown below:\n\nnums = list(range(10))\n\
    \nnums\n\nThe list nums contains integers from 0 to 9. To create a list of sequence\
    \ of integers between a specified range, you can pass two values to range function.\
    \ The first value specifies the lower bound (included in the resultant sequence)\
    \ and the second value specifies the upper bound (excluded in the resultant sequence).\
    \ The following range function returns list of integers from 50 to 100. \n\nnums\
    \ = list(range(50,101))\n\nnums\n\nAccessing List Elements\n\nLists are indexed\
    \ which means you can use indexes to access list elements. Lists follow zero based\
    \ indexes. The first element is stored at the 0th index while the last element\
    \ is stored at K-1 index, where K is the total number of elements in the list.\n\
    \nIn the following example we will access the 2nd element of the list colors:\n\
    \ncolors = \\['Red', 'Green', 'Blue', 'Yellow', 'White'\\]\n\nprint(colors\\[1\\\
    ])\n\nThe above script prints ‘Green’ to the output console. \n\nLists are mutable,\
    \ which means that you can change item value stored at a particular index. Let’s\
    \ change the value stored at third index from ‘Blue’ to ‘Black’.  \n\ncolors =\
    \ \\['Red', 'Green', 'Blue', 'Yellow', 'White'\\]\n\nprint(colors)\n\ncolors\\\
    [2\\] = 'Black'\n\nprint(colors)\n\nIn the script above we print the colors list\
    \ on the screen before and after setting the value of the item at third index\
    \ to ‘Black’. The output looks like this:\n\n![](Images/image00353.jpeg)\n\nYou\
    \ can also access multiple list elements at one time using slice operator i.e.\
    \ colon (:). For instance if you want to access the first three elements of a\
    \ list, you can use slice operator as follows:\n\ncolors = \\['Red', 'Green',\
    \ 'Blue', 'Yellow', 'White'\\]\n\nsublist = colors\\[:3\\]\n\nprint(sublist)\n\
    \nThe above script returns following result:\n\n![](Images/image00354.jpeg)\n\n\
    Similarly, if you want to access the last three elements of a list, execute the\
    \ following script:\n\ncolors = \\['Red', 'Green', 'Blue', 'Yellow', 'White'\\\
    ]\n\nsublist = colors\\[-3:\\]\n\nprint(sublist)\n\nThe result looks like this:\n\
    \n![](Images/image00355.jpeg)\n\nFinally, you can also access range of items from\
    \ a list using slice operator.\n\ncolors = \\['Red', 'Green', 'Blue', 'Yellow',\
    \ 'White'\\]\n\nsublist = colors\\[2:4\\]\n\nprint(sublist)\n\nThe above function\
    \ returns range of elements from the 2nd index up to one less than the 4th index\
    \ i.e. elements at index 2 and 3. The output looks like this:\n\n![](Images/image00356.jpeg)\n\
    \nAppending elements to a list\n\nThe append function can be used to append elements\
    \ to a list. The item to append is passed as parameter to the ‘append’ function.\
    \ Take a look at the following example:\n\ncolors = \\['Red', 'Green', 'Blue',\
    \ 'Yellow', 'White'\\]\n\nprint(colors)\n\ncolors.append('Orange')\n\nprint(colors)\n\
    \nIn the script above, we create a list, colors with five items. We print the\
    \ list on console. We then append an item to the list and again print the list\
    \ on the console. The output looks like this:\n\n![](Images/image00357.jpeg)"
