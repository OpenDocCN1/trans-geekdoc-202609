- raw: "In the script above, the first line imports the Imputer class from sklearn.preprocessing\
    \ library. Next we create object of the Imputer class. Imputer class constructor\
    \ takes three parameters: missing\\_value, strategy and axis. The missing\\_value\
    \ parameter specifies the value that is required to be replaced. In our dataset,\
    \ missing values have been denoted by “nan”, therefore we specified “NaN” for\
    \ missing\\_value parameter. Strategy parameter specifies the type of strategy\
    \ we want to use to fill missing value, it can have mean, median, and most\\_frequent\
    \ values. Finally, the axis parameter denotes the axis along which we want to\
    \ imputate. The axis 0 specifies the column axis whereas axis 1 specifies the\
    \ row axis.\n\nNext we execute fit method of the Imputer class. This method takes\
    \ the column that we want to handle missing values for, as input. Finally we execute\
    \ transform function which actually fills missing values in column 1 by the mean\
    \ of the column. When you execute the script above you will see that that the\
    \ record at index 4 that previously had missing value for column1 i.e. BMI, now\
    \ contains the mean of all the values in the BMI column. This is shown in the\
    \ following screenshot:\n\n![](Images/image00441.gif)\n\n### Handling Categorical\
    \ Data\n\nWe know machine learning algorithms are based on mathematical concepts\
    \ and mathematics is all about numbers. Therefore, it is convenient to convert\
    \ all the categorical values in our dataset to numeric values. If we look at the\
    \ patients.csv we have two columns with categorical values: Gender and Diabetic.\
    \ \n\nLuckily, in sklearn.preprocessing library we have LabelEncoder class which\
    \ takes categorical column as input and returns corresponding numerical output.\
    \ Take a look at the following script:\n\nfrom sklearn.preprocessing import LabelEncoder\n\
    \nlabelencoder\\_features = LabelEncoder()\n\nfeatures\\[:,2\\]= labelencoder\\\
    _features.fit\\_transform(features\\[:,2\\])\n\nLike Imputer class, LabelEncoder\
    \ class has fit\\_transform method, which is basically a combination of fit and\
    \ transform methods. The class takes categorical column as input and returns corresponding\
    \ numeric values. In the script above we pass it Gender column i.e. the column\
    \ at index 2 to the LabelEncoder class. After executing the script above if you\
    \ check the values of Gender column, you will see ones and zeros in place of Male\
    \ and Female as shown below:\n\n![](Images/image00442.jpeg)\n\nSimilarly, the\
    \ labels vector can also be converted into set of numeric values as follows:\n\
    \n labels = labelencoder\\_features.fit\\_transform(labels)\n\n###  \n\n### Dividing\
    \ data into training and tests sets\n\nIn the first chapter we discussed that\
    \ machine learning models are trained on subset of dataset and tested on another\
    \ subset of the dataset. This splitting between the training and test set is done\
    \ to ensure that our machine learning algorithm doesn’t overfit. Overfitting refers\
    \ to the phenomena where machine learning performs excellent results on training\
    \ data but poor results on test data. A good machine learning model is the one\
    \ that gives good result on both training and test data. That way we can say that\
    \ our model has correctly learned the underlying assumptions from the dataset\
    \ and can be used to correctly make decisions on any new dataset. \n\nThe sklearn.model\\\
    _selection library contains train\\_test\\_split class that can be used to divide\
    \ data into train and test sets. The class accepts features, labels and test\\\
    _size as parameters. The test\\_size defines the size of the test set. Test size\
    \ of 0.5 means split the data into 50% of test size and 50% of training size.\
    \ The following script divides the data into 75% train size and 25% test size.\
    \ \n\nfrom sklearn.model\\_selection import train\\_test\\_split\n\ntrain\\_features,\
    \ test\\_features, train\\_labels, test\\_labels = train\\_test\\_split(features,\
    \ labels, test\\_size = 0.25, random\\_state = 0)\n\nWhen you execute the above\
    \ script you will see that train\\_features variable will contain matrix of 9\
    \ features (75% of 12) while train\\_labels will contain corresponding 9 labels.\
    \ Similarly test\\_features will contain a matrix of 3 features (25% of 12) while\
    \ test\\_labels will contain corresponding 3 labels. \n\n### Scaling the Data\n\
    \nThe final preprocessing step before we can feed our data to machine learning\
    \ algorithm is that of feature scaling. We need to scale features because in some\
    \ datasets there is a huge difference between the values of different features.\
    \ For instance if we add number of red blood cells of patients out patients.csv\
    \ dataset, the column will have values in hundreds of thousands, on the other\
    \ hand the Age column can have very small values. Many of the machines learning\
    \ models use Euclidean distance to find distance between data points. If features\
    \ are not scaled, these algorithms can be biased towards features with large values.\n\
    \nThere are two ways to scale features:\n\nStandardization:![](Images/image00443.jpeg)\n\
    \nAnd\n\nNormalization: ![](Images/image00444.jpeg)\n\nThe sklearn.preprocessing\
    \ library contains StandardScaler class that can be used to implement standardization\
    \ of features. Like other preprocessing classes, it contains fit\\_transform method\
    \ that takes dataset as input and returns scaled dataset. The following script\
    \ scales both the train\\_features and test\\_features datasets. \n\nfrom sklearn.preprocessing\
    \ import StandardScaler\n\nfeature\\_scaler = StandardScaler()\n\ntrain\\_features\
    \ = feature\\_scaler.fit\\_transform(train\\_features)\n\ntest\\_features = feature\\\
    _scaler.transform(test\\_features)\n\nNow if you see train\\_features and test\\\
    _features, you can see scaled values as shown below:\n\n![](Images/image00445.gif)\n\
    \nThere is no need to scale labels for classification problems. For regression\
    \ problems we will see how to scale labels in regression section.\n\nConclusion\n\
    \nIn this chapter we saw how we can preprocess data before using it for actual\
    \ machine learning tasks. In the next chapter we will start new section i.e. Regression.\
    \ The first machine learning algorithm that we will study will be linear regression.\
    \ \n\n# Chapter 4\n\n## Linear Regression\n\nIn this chapter we will start our\
    \ discussion with the first supervised machine learning algorithm i.e. Linear\
    \ Regression which is a type of regression algorithm. In this chapter we will\
    \ study linear regression with one variable as well as linear regression with\
    \ multiple variables. Using linear regression with one variable, we will predict\
    \ price of a car based on the year of manufacture. We will then move to more complex\
    \ problem where we will predict the points that a basketball player can score\
    \ based on height, weight, field goals and throws. However, first let’s study\
    \ theoretical back ground of linear regression.\n\n### Theory of Linear Regression\n\
    \nIn simple words, linear regression is an approach that identifies relationship\
    \ between two or more than two variables. Mathematical, linear regression finds\
    \ a linear function that maps independent variables to dependent variables. If\
    \ this function is plotted on 2-D space, it results in a straight line. \n\nConsider\
    \ a scenario where we want to find relationship between the price of cars and\
    \ the year of manufacture. If we plot the year on x-axis and price on y-axis,\
    \ linear regression algorithm will find a straight line that best fits the data\
    \ points. This is shown in the figure below:\n\n![](Images/image00446.jpeg)\n\n\
    We know that straight line can be represented as:\n\nb= ax1 + c\n\nHere b is the\
    \ dependent variable, a is the slope of the line, x is the independent variable\
    \ and c is the y intercept.\n\nIf we look at the equation we can see that b and\
    \ x remain constant since they are the data variables. Therefore, linear regression\
    \ algorithm gives us the slope and the intercept that best result in line which\
    \ best fits the dataset. \n\nThis concept can be extended to more than one independent\
    \ variable. The equation for linear regression function will then be represented\
    \ as:\n\nb = a1x1 + a2x2 + a3x3 + …….. anxn + c"
