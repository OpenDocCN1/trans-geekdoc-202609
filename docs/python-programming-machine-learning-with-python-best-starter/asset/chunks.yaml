    \ inside the “while” loop we increment the value of “i” by 1. After the loop has\
    \ executed 10 times, the value of “i” becomes 11. Therefore, the condition “i”\
    \ is less than 11 returns false, hence “while” loop terminates. \n\nLet’s try\
