    Here is `n` is the total number of independent variables. This equation basically
    represents a hyper plane with `n`-dimension. It is important to mention that in
    two-dimensions linear regression model can be represented as a straight line.
    In three dimensions, it is represented in the form of plane and in more than three
    dimensions; it is represented as hyper plane.


    Enough of the theory, let’s implement linear regression with the help of Python’s
    Scikit learn library.


    ## Linear Regression with One Variable


    For the sake of simplicity, we will first implement linear regression with one
    variable. It is also known as Univariate Linear Regression. In this case, there
    is only one independent and one dependent variable.


    In this section we will use the `car_price.csv` to predict the price of car (dependent
    variable) based on the year of manufacture (independent variable). You can find
    the dataset in the supplementary “Datasets” folder.


    To predict the price, we will use linear regression algorithm implemented via
    Python Scikit Learn Library. So, let the fun begin:


    ### 1- Importing Required Libraries


    As discussed in the previous chapter, the first step in implementing any machine
    learning algorithm is to import required libraries into your program. The following
    code imports required libraries:


    ```python

    import pandas as pd

    import numpy as np

    import matplotlib.pyplot as plt

    %matplotlib inline

    ```


    This script is implemented using Jupyter notebook. Therefore, to draw graphs within
    the notebook, we have used the command `%matplotlib inline`. If you are using
    Spyder, you can remove the last line.


    ### 2- Importing the Dataset


    Once you imported the libraries, the next step is to import the dataset that you
    are going to use for training the algorithm. We will be using `car_price.csv`
    dataset. Execute the following script to import the dataset:


    ```python

    car_data = pd.read_csv(''D:\\Datasets\\car_price.csv'')

    ```


    The script above reads the dataset and stores it in `car_data` dataframe.


    ### 3- Analyzing the Data


    Before using the data for training, it is always a good practice to analyze your
    data for any missing values or scaling.


    Let’s first take a general look of our data. The `head()` function returns the
    first 5 rows of the dataset. Execute the following script:


    ```python

    car_data.head()

    ```


    ![](Images/image00447.gif)


    Similarly, the `describe()` function returns all the statistical details of the
    dataset.


    ```python

    car_data.describe()

    ```


    ![](Images/image00448.gif)


    Finally let us see if linear regression algorithm is actually suitable for this
    task. Let’s plot our data points on the graph and see if we can see some sort
    of linear relation between price and year. Execute the following script:


    ```python

    plt.scatter(car_data[''Year''], car_data[''Price''])

    plt.title("Year vs Price")

    plt.xlabel("Year")

    plt.ylabel("Price")

    plt.show()

    ```


    The output of the script above looks like this:


    ![](Images/image00449.jpeg)


    In the script above, we use the scatter plot from the `matplotlib` library to
    plot year on x and price on y axis. From the output figure we can clearly see
    that with the increase in year number the price of car increase. There is a linear
    relationship between the year and price. Therefore, we can use linear regression
    algorithm to solve this problem.


    ### 4- Data Preprocessing


    In the last chapter, we studied that before we feed the data to learning algorithms,
    we first have to divide the data into feature and label set and then test and
    training set. In this step we will perform these two tasks.


    To divide the data into features and labels, execute the following script:


    ```python

    features = car_data.iloc[:,0:1].values

    labels = car_data.iloc[:,1:2].values

    ```


    Since we have only two columns, the 0th column contains the feature set while
    the 1st column contains the labels.


    Finally let’s divide the data into 80 % training and 20% test sets:


    ```python

    from sklearn.model_selection import train_test_split

    train_features, test_features, train_labels, test_labels = train_test_split(features,
    labels, test_size=0.2, random_state=0)

    ```


    If we look at the dataset we can see that there is not a very huge difference
    between values of years and prices. Both of them have in thousands. Therefore,
    there is no need to scale the data and we can use this data as it is for training
    the algorithm.


    ### 5- Training the Algorithm and making Predictions


    The `LinearRegression` class of `sklearn.linear_model` is used to implement linear
    regression in Python. The `LinearRegression` class has `fit` method that takes
    training features and labels as input and train the model as shown below:


    ```python

    from sklearn.linear_model import LinearRegression

    lin_reg = LinearRegression()

    lin_reg.fit(train_features, train_labels)

    ```


    Let’s see what the coefficient is found by our model for the only independent
    variable. Execute the following script:


    ```python

    print(lin_reg.coef_)

    ```


    The result will be: 204.815


    This shows that for a unit change in year, the value of Car price increases by
    204.815


    Once the model is trained the final step is to predict the out of the new instance.
    The `predict` method of the `LinearRegression` class can be used for this purpose.
    The method takes test features as input and predicts the corresponding labels
    as output.


    Execute the following script to predict the label for the test features:


    ```python

    predictions = lin_reg.predict(test_features)

    ```


    All the predictions are stored in `predictions` variable.


    Let’s compare the predicted value with the actual values. Execute the following
    script to do so:


    ```python

    comparison=pd.DataFrame({''Real'':test_labels, ''Predictions'':predictions})

    print(comparison)

    ```


    The output looks like this:


    ![](Images/image00450.jpeg)


    We can see that there are four values in the test set which is 20% of the whole
    dataset as specified in `train_test_split`.


    To evaluate performance of machine learning model, three metrics are commonly
    used: [Mean Absolute Error](https://en.wikipedia.org/wiki/Mean_absolute_error)
    (MAE), [Mean Squared Error](https://en.wikipedia.org/wiki/Mean_squared_error)
    (MSE) and [Root Mean Squared Error](https://en.wikipedia.org/wiki/Root-mean-square_deviation)
    (RMSE). Luckily we don’t have to code the complex mathematics behind these metrics.
    The metrics class of sklearn contains functions that can be used to find values
    for these metrics. Execute the following script to find MAE, MSE and RMSE for
    our linear regression model.


    ```python

    from sklearn import metrics

    print(''MAE:'', metrics.mean_absolute_error(test_labels, predictions))

    print(''MSE:'', metrics.mean_squared_error(test_labels, predictions))

    print(''RMSE:'', np.sqrt(metrics.mean_squared_error(test_labels, predictions)))

    ```


    The output always follows:


    ![](Images/image00451.jpeg)


    Normally if the value of MAE and RMSE is less than 10% of the mean value for the
    predicted column, the algorithm performance is considered a good. However lesser
    the values of MAE and RMSE, higher will be the performance of the algorithm. In
    our case the values of MAE and RMSE are 377.36 and 397.85 which is lesser than
    10% of the mean value of Price which is 430.2. Hence we can say that our algorithm
    performance is good.


    ## Linear Regression with Multiple Variables


    Linear regression with multiple variable or multivariate linear regression involves
    more than one independent variables. In this section we will use Python’s Scikit
    Learn library to implement Multivariate linear regression.


    We will predict how much points can a player score in a basketball match based
    on his height, weight, percentage of successful field goals out of all attempts,
    percentage of successful throws out of all attempts. We have downloaded the dataset
    and it is available in the Datasets folder.

