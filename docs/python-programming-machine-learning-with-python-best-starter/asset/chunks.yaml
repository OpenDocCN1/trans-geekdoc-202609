    \ Since hundreds or sometimes thousands of trees are involved in prediction, it\
    \ is not easy to understand how the final prediction was made. \n\n2.  The complexity\
    \ of an algorithm comes with the cost of time. Random forest algorithm can take\
    \ a lot of time to execute depending upon the number of trees in the forest.\n\
    \n### Implementing Random Forest Algorithm using Scikit Learn\n\nIn this section,\
    \ we will use random forest algorithm to predict how much points can a player\
    \ score in a basketball match based on his height, weight, percentage of successful\
    \ field goals out of all attempts, percentage of successful throws out of all\
    \ attempts. We have downloaded the dataset and it is available in the Datasets\
    \ folder.  \n\nWe will follow the same steps that we have been following in all\
    \ the last chapters. \n\n1-    Importing Required Libraries\n\nThe following code\
    \ imports required libraries:\n\nimport pandas as pd\n\nimport numpy as np\n\n\
    import matplotlib.pyplot as plt\n\n%matplotlib inline\n\n2-   Importing the Dataset\n\
    \nThough the dataset is available online, we have downloaded it and added it in\
    \ the dataset repository available with this book. The dataset name is “player.csv’. \
    \ Execute the following command to import the dataset.\n\nplayer\\_data = pd.read\\\
    _csv('D:\\\\Datasets\\\\player.csv')\n\nThe script above reads the dataset and\
    \ stores it in player\\_data dataframe.\n\n3-    Analyzing the Data \n\nExecute\
    \ the following script to eyeball the data:\n\nplayer\\_data.head()\n\nThe output\
    \ looks like this:\n\n![](Images/image00467.jpeg)\n\n4-   Data Preprocessing\n\
    \nTo following script divides the data into feature and label set.\n\nfeatures\
    \ = player\\_data.iloc\\[:, 0:4\\].values  \n\nlabels = player\\_data.iloc\\[:,\
    \ 4\\].values\n\nFinally let’s divide the data into 80 % training and 20% test\
    \ sets:\n\nfrom sklearn.model\\_selection import train\\_test\\_split\n\ntrain\\\
    _features, test\\_features, train\\_labels, test\\_labels = train\\_test\\_split(features,\
    \ labels, test\\_size = 0.2, random\\_state = 0)\n\n5-   Scaling the Data\n\n\
    If you look at the dataset it is not scaled well, for instance the Field\\_Goals\
    \ and Throws column have values between 0 and  1, while the rest of the columns\
    \ have higher values. Therefore, before training the algorithm, we will scale\
    \ our data down. Remember we discussed scaling Chapter 3. Here we will use the\
    \ standard scalar class.\n\nfrom sklearn.preprocessing import StandardScaler\n\
    \nfeature\\_scaler = StandardScaler()\n\ntrain\\_features = feature\\_scaler.fit\\\
    _transform(train\\_features)\n\ntest\\_features = feature\\_scaler.transform(test\\\
    _features)\n\n6-   Training the Algorithm and making Predictions\n\nTo implement\
    \ Random Forest Algorithm for regression tasks, the RandomForestRegressor class\
    \ is of the sklear.ensemble library is used. The number of trees is passed as\
    \ argument to the n\\_estimator parameter. In the following script the number\
    \ of script is set to 200.\n\nfrom sklearn.ensemble import RandomForestRegressor\n\
    \nrf\\_reg = RandomForestRegressor(n\\_estimators=200, random\\_state=0)  \n\n\
    rf\\_reg.fit(train\\_features, train\\_labels)  \n\nExecute the following script\
    \ to predict the label for the test features:\n\npredictions = rf\\_reg.predict(\
    \ test\\_features)\n\nTo compare predictions with real outputs, execute the following\
    \ script:\n\nLet’s compare the predicted value with the actual values. Execute\
    \ the following script to do so:\n\ncomparison=pd.DataFrame({'Real':test\\_labels,\
    \ 'Predictions':predictions})\n\nprint(comparison)\n\nThe output looks like this:\n\
    \n![](Images/image00468.gif)\n\n7-    Evaluating the Algorithm\n\nExecute the\
    \ following script to find MAE, MSE and RMSE for our linear regression model.\n\
    \nfrom sklearn import metrics\n\nprint('MAE:', metrics.mean\\_absolute\\_error(test\\\
    _labels, predictions))\n\nprint('MSE:', metrics.mean\\_squared\\_error(test\\\
    _labels, predictions))\n\nprint('RMSE:', np.sqrt(metrics.mean\\_squared\\_error(test\\\
    _labels, predictions)))\n\nThe output is always follows:\n\n![](Images/image00469.jpeg)\n\
    \nThe value of MAE is 5.00, which is greater than MAE value calculated for Linear\
    \ Regression algorithm in Chapter 4 i.e. 4.65. Similarly, the value of RMSE in\
    \ the case of Random Forest algorithm is 6.27, which is greater than 5.67, i.e.\
    \ the value obtained using Linear Regression algorithm in Chapter 4. Hence we\
    \ can say that for predicting point scored by a basketball player given the dataset\
    \ used in this chapter, Linear Regression algorithm outperforms the Random Forest\
    \ algorithm.\n\n#  \n\n#  \n\n#  \n\n# Chapter 8\n\n## Support Vector Regression\n\
    \nSupport Vector Regression (SVR) is a type of Support Vector Machines (SVM) Algorithm\
    \ and can be used for performing linear as well as non-linear regression. Introduced\
    \ in 1960’s SVM is one of the most famous supervised machine learning algorithms.\
    \ Before neural networks became common, SVM was said to be the most accurate machine\
    \ learning algorithm. \n\nIn this chapter we will briefly review the intuition\
    \ behind SVM algorithm and how they actually work. Since we are in regression\
    \ section, we will implement SVR algorithm using Python library to predict the\
    \ price of a car based on the year.  But first let’s study the theory behind SVM.\n\
    \n### SVM Theory\n\nFor typical linear regression in two dimensional feature space,\
    \ the task is to find a straight line that successfully bisects the data points.\
    \ However in real world, there can be multiple decision boundaries that can successfully\
    \ classify the data points as shown in Fig1. \n\n![](Images/image00470.jpeg)\n\
    \nFig1: Multiple boundaries\n\nHowever whether a new data point will be successfully\
    \ classified or not depends upon the decision boundary chosen for classification.\
    \ \n\nFor instance take a look at Fig2. Suppose we have to classify new data point\
    \ i.e. the Red Circle. If we have the decision boundary as in Fig2, the new data\
    \ point will be classified as blue.\n\n![](Images/image00471.jpeg)\n\nFig2: New\
    \ data point classified as blue\n\nOn the other hand if we have the decision boundary\
    \ as in Fig3, the new data point will be classified as yellow as shown below:\n\
    \n![](Images/image00472.jpeg)\n\nFig3: New data point classified as yellow\n\n\
    From Fig2 and Fig3, it can be clearly seen that there can be multiple decision\
    \ boundaries that successfully classify a dataset. However, not all of them are\
    \ optimal. Given a new data point, different decision boundaries may classify\
    \ data differently.\n\nThe job of SVM algorithm is to find the decision boundary\
    \ that classifies data in such a way that the chances of misclassification can\
    \ be minimized. SVM algorithm does so by maximizing the distance between the closest\
    \ data points from all the classes in the dataset. \n\nThe SVM algorithm finds\
    \ such a boundary with the help of support vectors, hence the name Support Vector\
    \ Machines. Support vectors are the vectors that pass through the closest data\
    \ points of the two classes to classify. The job is to maximize the distance between\
    \ these two vectors. A line parallel to both these support vectors is drawn in\
    \ the middle of these support vectors. This decision boundary is considered the\
    \ most optimal decision boundary. The decision boundary found by Support Vector\
    \ along with support vector machines looks like the one in Fig4.\n\n![](Images/image00473.jpeg)\n\
    \nFig4: Decision boundary with Support Vectors\n\nEnough of the theory, now let’s\
    \ see how we can use Support Vector regression which is a type of SVM to predict\
    \ price of a car based on year it was manufactured. We will use Python’s Scikit\
    \ Learn Library for that.\n\nImplementing SVR with Python Scikit Learn\n\nIn this\
    \ section we will use the “car\\_price.csv” dataset to predict the price of car\
    \ (dependent variable) based on the year of manufacture (independent variable).\
    \ You can find the dataset in the supplementary “Datasets” folder. \n\n1-    Importing\
    \ Required Libraries\n\nThe following code imports required libraries:\n\nimport\
    \ pandas as pd\n\nimport numpy as np\n\nimport matplotlib.pyplot as plt\n\n%matplotlib\
    \ inline"
