- raw: "Machine learning is one of the hottest buzz words around. With the advancement\
    \ in high computing hardware and availability of thousands of terra bytes of data,\
    \ more and more companies and research organizations are using machine learning\
    \ to build intelligent machines that can perform variety of tasks and can help\
    \ humans make better decisions.\n\nThis book contains detailed overview of all\
    \ the latest concepts in machine learning. Each chapter in this book is dedicated\
    \ to one machine learning algorithm. Each chapter begins with the brief theory\
    \ of the algorithm followed by implementation of the algorithm in Python’s Scikit\
    \ learn library. \n\nThe book is aimed towards novice as well as expert users.\
    \ On hand it can be used as handbook of machine learning for the beginners, while\
    \ on the other hand it can also be used by expert users as reference for different\
    \ machine learning algorithms. To get out of this book, you are requested to not\
    \ mere read the book but to actually hand code all the examples provided in this\
    \ book. \n\nIn the end, I wish you best in your machine learning endeavors. I\
    \ hope once you read this book, you have all the basic tools in your machine learning\
    \ arsenal to solve any type of machine learning problem.\n\n#  \n\n#  \n\n#  \n\
    \n# Chapter 1\n\n# Introduction to machine Learning\n\nMachine learning is a branch\
    \ of Artificial Intelligence that deals with learning implicitly from data using\
    \ various statistical techniques. Unlike traditional computer programs where all\
    \ the application logic is explicitly programed, machine learning applications\
    \ learn implicitly from the data without being explicitly programmed. The idea\
    \ behind machine learning is that instead of hard coded logic, large amount of\
    \ data is fed into the application. It is then the responsibility of the application\
    \ to learn from that data and make decisions.\n\n### Definition\n\nThe first definition\
    \ of machine learning was coined by [Arthur Samuel](https://en.wikipedia.org/wiki/Arthur_Samuel)\
    \ back in 1959. He defined machine learning as:\n\n“Field of study that enables\
    \ computers to learn without being explicitly programmed.”\n\n[Tom Mitchel](http://www.cs.cmu.edu/~tom/)\
    \ from Carnegie Mellon University defined machine learning in mathematically understandable\
    \ terms as in 1997. He said:\n\n“A computer program is said to learn from experience\
    \ E with respect to some task T and some performance measure P, if its performance\
    \ on T, as measured by P, improves with experience E.” \n\nThe definition provided\
    \ by Tom Mitchel is widely regarded as the most precise yet clear definition of\
    \ machine learning. Now we know what machine learning is, but a question still\
    \ remains that how machines learning and what is their inner working. The next\
    \ section will answer this question:\n\n### How Machines Learn? \n\nBefore dwelling\
    \ into the details of machine learning, let us first recapitulate that how humans\
    \ learn. For instance, how we humans know that we should not touch a heating plates\
    \ when they are on with bare hands. How we know that they can cause burns? Well\
    \ there can be two possibilities: Either we have been burned in the past by heating\
    \ stove or we have been taught by elders not to touch the heating plates. In both\
    \ the cases we have had some experience in the past that stops us from touching\
    \ heating plates when they are on. In other words, we had some past information,\
    \ on the basis of which we make future decisions. \n\nMachine learns in a similar\
    \ way. In the beginning they have no knowledge. They are just like a newborn child\
    \ with zero knowledge. To make machines learn, information is passed to these\
    \ machines. From this information, machines identify patterns using various statistical\
    \ techniques. Once machines learn to identify patterns from the data for making\
    \ decisions, they can be used to make decisions on unseen data.\n\nWorkflow of\
    \ a typical learning process of a machine learning model is shown in the following\
    \ figure:\n\n![](Images/image00419.gif)\n\nTraining data is fed into machine learning\
    \ algorithms that are nothing but complex mathematical algorithms. The algorithms\
    \ results in machine learning models. Machine learning models are capable of making\
    \ predictions on new unseen data which is also known as test data. \n\n### Importance\
    \ of Machine Learning\n\nThe ultimate goal of AI is to make machines as intelligent\
    \ as humans. However initial work in AI showed that we cannot hardcode machines\
    \ that are as intelligent as humans. Humans learn from the environment which is\
    \ consistently evolving. Therefore, the best way to make intelligent machines\
    \ is to make them learn themselves. Therefore, machine learning was recognized\
    \ as a discipline of science that teaches machines how to automatically learn\
    \ from the data. \n\nThe idea behind machine learning is that instead of hardcoding\
    \ the logic, data is fed into the machines and make machines themselves learn\
    \ from the data by identifying patterns from the data. Interestingly machines\
    \ learning techniques are quicker than humans in identifying patterns. \n\nMachine\
    \ learning techniques have been around for quite a while. However owing to the\
    \ lack of high performance hardware, these techniques were not implemented before\
    \ to solve real world problems. Now, with the availability of complex hardware\
    \ and huge amount of data, machine learning techniques have resurfaced and have\
    \ been successful in developing intelligent machines. \n\n### Types of Machine\
    \ Learning\n\nMachine learning techniques have been broadly categorized into two\
    \ types:\n\n1-    Supervised Learning\n\n2-   Unsupervised Learning\n\n1.  Supervised\
    \ Learning\n\nIn supervised learning, both the input data and the corresponding\
    \ category that the input data belongs to is provided to the learning algorithm.\
    \ The learning algorithm learns the relationship between the input and the output\
    \ and then predicts the output of the unseen input data samples. \n\nFor instance,\
    \ supervised machine learning algorithm is fed with images of apples labeled as\
    \ fruit and potatoes labeled as vegetable. After training on this data, the supervised\
    \ machine learning algorithm should be able to classify new unlabeled images of\
    \ apples as fruit and unlabeled potatoes as vegetable. \n\nFollowing are the steps\
    \ involved in supervised machine learning algorithm:\n\n1-    Feed the algorithm\
    \ with input records X, and output labels y.\n\n2-   For each input record the\
    \ algorithm predicts an output y’. \n\n3-    Error in prediction is calculated\
    \ by subtracting y from y’.\n\n4-   The algorithm corrects itself by removing\
    \ the error.\n\n5-   Steps 1 to 4 continue for multiple iterations until error\
    \ is minimized. \n\nIn mathematical terms, you have input variable X and output\
    \ variable y, and you have to find a function that captures relationship between\
    \ the two i.e. \n\ny= f(X)\n\nSupervised Learning is used to solve two different\
    \ types of problems: classification and regression.\n\nClassification: Classification\
    \ refers to process of predicting discrete output values for an input. For instance,\
    \ given an input predicting whether a mail is spam or ham, a tumor is benign or\
    \ malignant or whether a student will pass or fail the exam. \n\nRegression: In\
    \ regression problems the task of machine learning model is to predict a continuous\
    \ value. For instance for given input, predict the price of the house or predict\
    \ the marks obtained by a student on an exam e.tc.\n\n2.  Unsupervised Learning\n\
    \nIn supervised learning, the algorithms are fed with the input data with no labels.\
    \ It is the responsibility of the algorithm to identify patterns in the data and\
    \ cluster records with similar characteristics. Normally, most of the real world\
    \ data is unlabeled; therefore unsupervised learning can be used as a precursor\
    \ to supervised learning."
