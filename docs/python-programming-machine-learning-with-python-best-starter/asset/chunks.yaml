- raw: "4-   Data Preprocessing\n\nTo following script divides the data into feature\
    \ and label set.\n\nfeatures= banknote\\_data.iloc\\[:,0:4\\].values\n\nlabels=\
    \ banknote\\_data.iloc\\[:,4\\].values\n\nFinally let’s divide the data into 80\
    \ % training and 20% test sets:\n\nfrom sklearn.model\\_selection import train\\\
    _test\\_split\n\ntrain\\_features, test\\_features, train\\_labels, test\\_labels\
    \ = train\\_test\\_split(features, labels, test\\_size = 0.2, random\\_state =\
    \ 0)\n\n5-   Scaling the Data\n\nFor Random Forest algorithm, it is not necessary\
    \ to scale the data, however just for the sake of practice, let’s scale the data\
    \ using standard scalar. Remember we discussed scaling in the 3rd chapter. \n\n\
    from sklearn.preprocessing import StandardScaler\n\nfeature\\_scaler = StandardScaler()\n\
    \ntrain\\_features = feature\\_scaler.fit\\_transform(train\\_features)\n\ntest\\\
    _features = feature\\_scaler.transform(test\\_features)\n\n6-   Applying PCA\n\
    \nIt is very easy to implement PCA via sklearn library, we need to use PCA class\
    \ of the sklearn.decomposition library. The number of principal components to\
    \ select can be passed as parameter to the PCA class. If no number of components\
    \ is passed, all the features are selected as principal component. Next, we need\
    \ to call the fit and transform methods and pass them the training and test features.\
    \ We do not need to pass the output since PCA is an unsupervised learning technique\
    \ and calculates variance from the feature set alone. Execute the following script\
    \ to get all the four principal components for the banknote\\_data.csv dataset.\
    \ \n\nfrom sklearn.decomposition import PCA\n\npca = PCA()  \n\ntrain\\_features\
    \ = pca.fit\\_transform(train\\_features)  \n\ntest\\_features = pca.transform(test\\\
    _features)  \n\nNow, to see the variance retrieved by each component sorted by\
    \ descending order, print the explained\\_variance\\_ratio\\_ attribute on the\
    \ screen as shown below:\n\nexp\\_var = pca.explained\\_variance\\_ratio\\_ \n\
    \nprint(exp\\_var)\n\n The output looks like this:\n\n![](Images/image00503.jpeg)\n\
    \nFrom the output, it can be seen that the first principal component is responsible\
    \ for 54.15 % variance in the dataset, similarly the second principal component\
    \ causes 32.60 percent variance in the dataset.\n\nPerformance Evaluation with\
