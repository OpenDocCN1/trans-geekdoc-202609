    \ argument replacing the name variable. Let’s create an object of `Employee` class\
    \ and call the `printname` method with and without any argument.\n\n```python\n\
    emp = Employee()\nemp.printname()\nemp.printname(\"Joseph\")\n```\n"
  trans: "\n\n```python\nchild2 = Child2()\n```\n\n# 访问父类方法\n\n```python\nchild2.methodA()\n\
    ```\n\n# 访问 Child1 类方法\n\n```python\nchild2.methodC()\n```\n\n在上面的脚本中，有两个子类 `Child1`\
    \ 和 `Child2`，它们都继承了名为 `Parent` 的父类。现在，这两个子类都拥有访问 `Parent` 类方法（即 `methodA`），上述脚本的输出如下：\n\
    \n![](img/image0040.jpeg)\n\n### 从子类调用父类构造函数\n\n我们知道类可以继承父类及其属性。但这里出现了一个问题：我们如何使用子类构造函数来初始化父类的属性？例如，如果父类中有两个属性，子类有一个属性。我们如何使用子类构造函数初始化这三个属性呢？\n\
    \nPython 为这个问题提供了一个简单的解决方案。父类和子类构造函数的参数会被传递给子类。在子类的构造函数内部，会调用父类的构造函数并将父类构造函数的参数传递给它。剩余的参数则用于初始化子类的属性。看以下示例：\n\
    \n# 创建 Vehicle 类\n\n```python\nclass Vehicle:\n    # 父类的构造函数\n    def __init__(self,\
    \ name, color):\n        self.name = name\n        self.color = color\n```\n\n\
    # 创建继承 Vehicle 类的 Bike 类\n\n```python\nclass Bike(Vehicle):\n    # 子类的构造函数\n \
    \   def __init__(self, name, color, price):\n        # 从 Bike 类调用 Vehicle 类构造函数\n\
    \        Vehicle.__init__(self, name, color)\n        self.price = price\n```\n\
    \n# 创建 Vehicle 类对象\n\n```python\nbike = Bike(\"Honda\",\"Black\",25000)\n\n# 访问父类属性\n\
    print(bike.name)\nprint(bike.color)\n\n# 访问子类属性\nprint(bike.price)\n```\n\n在上面的脚本中，我们创建了一个具有两个属性\
    \ `name` 和 `color` 的父类 `Vehicle`。父类的构造函数初始化了这两个属性。然后，我们定义了一个继承自 `Vehicle` 类的子类\
    \ `Bike`。该子类有一个属性即 `price`，它通过子类 `Bike` 构造函数进行初始化。然而，`Bike` 类的构造函数接受三个参数 `name`、`color`\
    \ 和 `price`。在 `Bike` 类构造函数内部，调用了 `Vehicle` 类构造函数并将 `name` 和 `color` 属性传递给 `Vehicle`\
    \ 类构造函数。而 `price` 参数则用于初始化子类属性 `price`。\n\n我们创建了 `Bike` 类的对象，并为 `name`、`color`\
    \ 和 `price` 属性传递了值。然后我们在控制台上打印了这些值。上述脚本的输出如下：\n\n![](img/image00410.jpeg)\n\n\
    ### 多继承\n\n我们知道一个父类可以被多个子类继承。这是 `Java` 和 `C#` 等编程语言支持的继承类型。然而在 Python 中，一个子类也可以继承多个父类。这被称为多继承。\n\
    \n下面的示例将进一步说明多继承的概念。\n\n```python\nclass Vehicle:\n    def showVehicleDetails(self):\n\
    \        print(\"I am vehicle class\")\n\nclass Sedan:\n    def showSedanDetails(self):\n\
    \        print(\"I am sedan class\")\n\n# 创建继承 Vehicle 和 Sedan 的 Car 类\nclass\
    \ Car(Vehicle,Sedan):\n    def showCarDetails(self):\n        print(\"I am car\
    \ class\")\n\n# 创建 Car 类的对象\ncar = Car()\n\n# 访问 Vehicle 类方法\ncar.showVehicleDetails()\n\
    \n# 访问 Sedan 类方法\ncar.showSedanDetails()\n\n# 访问子类方法\ncar.showCarDetails()\n```\n\
    \n在上面的脚本中，我们有三个类 `Vehicle`、`Sedan` 和 `Car`。`Car` 类继承了 `Vehicle` 和 `Sedan` 类。然后我们创建了\
    \ `Car` 类的对象，并通过 `car` 类对象访问 `Vehicle` 和 `Sedan` 类的方法。示例显示，继承多个父类的子类可以访问所有父类的属性和方法。上述示例的输出如下：\n\
    \n![](img/image00411.jpeg)\n\n### 方法重写\n\n除了访问父类方法外，子类还可以通过为相同的方法名提供自己的定义来重写父类方法。看以下示例来理解这一概念：\n\
    \n# 创建 Person 类\n\n```python\nclass Employee:\n    def printdetails(self):\n \
    \       print(\"I am an employee of this company\")\n\n# 创建继承 Employee 的 Manager\
    \ 类\nclass Manager(Employee):\n    def printdetails(self):\n        print(\"I\
    \ am a Manager of this company\")\n\nmanager = Manager()\nmanager.printdetails()\n\
    ```\n\n在上面的脚本中，我们了两个类：`Employee` 和 `Manager`。`Employee` 类包含一个方法 `printdetails`。`Manager`\
    \ 类继承了 `Employee` 类，这意味着 `Manager` 类拥有访问 `Employee` 类 `printdetails` 方法的。然而 `Manager`\
    \ 包含了对 `printdetails` 方法的自己的定义。现在你创建 `Manager` 对象并调用该方法，将调用子类方法，如下输出所示：\n\n![](img/image00412.jpeg)\n\
    \n### 多态\n\n多态（Polymorphism）字面意思是“采用多种形状的能力”。在编程中，多态指的是方法根据场景（如数量和类型）表现不同行为的能力。多态的一个简单例子是加法运算符。当你使用加法运算符相加数字时，加法运算符像数学加法一样工作并返回和。然而，如果使用同一个加法运算符加字符串，结果就是拼接后的字符串。看这个简单的示例：\n\
    \n```python\n# 使用加法运算符求和\nx = 10\ny = 20\nresult = x + y\nprint(result)\n\n# 使用加法运算符处理字符串\n\
    x = \"Welcome\"\ny = \"to Python\"\nresult = x + y\nprint(result)\n```\n\n在上面的脚本中，我们给变量\
    \ `x` 和 `y` 赋值数值。然后我们使用加法运算符这些这些值并将和存储在 `result` 变量中。然后我们在屏幕上打印 `result` 变量。这表明加法运算符用于的是数值操作数。接下来，我们给\
    \ `x` 和 `y` 赋值字符串类型的值并再次使用加法运算符。这次加法运算符拼接了两个字符串。示例显示了加法运算符如何根据操作数遵循多态。\n\n在自定义类中，多态通过方法重载（method\
    \ overloading）和方法重写（method overriding）实现。我们在上一节中学习了方法重写，这里我们将学习方法重载。\n\n方法重载指的是方法根据传递给它的参数执行不同功能的能力。看这个方法重载的简单示例：\n\
    \n```python\n# 创建 Employee\nclass Employee:\n    def printname(self, name=None):\n\
    \        if name == None:\n            print(\"Hello, I am an employee\")\n  \
    \      else:\n            print(\"Hello, I am an employee. My name is \",name)\n\
    ```\n\n在上面的脚本中，我们创建了一个包含一个方法 `printname` 的 `Employee` 类。`printname` 方法有一个可选参数\
    \ `name`。`printname` 方法可以带一个字符串类型的参数调用，也可以不带任何参数调用。如果不带任何参数调用方法，将在控制台打印“Hello,\
    \ I am an employee”。如果带字符串类型参数调用 `printname` 方法，则将在屏幕上打印“Hello, I am an employee.\
    \ My name is ,name”，其中参数将替换 name 变量。让我们创建一个 `Employee` 类的对象并分别带参数和不带参数调用 `printname`\
    \ 方法。\n\n```python\nemp = Employee()\nemp.printname()\nemp.printname(\"Joseph\"\
    )\n```\n\n"
