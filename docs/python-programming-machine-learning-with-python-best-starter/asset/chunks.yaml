    1. Decision trees work equally well for regression as well as classification tasks
    which means that you can predict continuous as well as discrete values.

    2. Decision trees can be used to classify linear as well as non-linear data.

    3. In comparison to most of the other machine learning algorithms, they are relatively
    faster to train.


    ## Using Python Scikit Learn Library to Implement Decision Trees


    As always, we will use Python’s Scikit Learn Library to see decision trees in
    action. In this section we will again predict the consumption of petrol ( in millions)
    in the 48 states of US based on features such as paved highways (miles), petrol
    tax (cents), per capita income, and ratio of individuals with driving license.


    For further details of the dataset, visit this [link](http://people.sc.fsu.edu/~jburkardt/datasets/regression/x16.txt).
    The data can be downloaded from the link as well; however the data is not in CSV
    format at the download link. For the ease of the readers, the data has been downloaded,
    converted to CSV and saved in the `Datasets` folder with name `petrol_data.csv`
    you can found it there.


    Now you should be familiar with the machine learning process. The first step to
    solve every machine learning problem with Python is to import the required libraries.
    The following script does that:


    ### 1. Importing Necessary Libraries


    ```

    import pandas as pd

    import numpy as np

    import matplotlib.pyplot as plt

    %matplotlib inline

    ```


    This script is implemented using Jupyter notebook. Therefore, to draw graphs within
    the notebook, we have used the command `%matplotlib inline`. If you are using
    Spyder, you can remove the last line.


    ### 2. Importing Dataset


    Execute the following command to import the dataset.


    ```python

    petrol_data = pd.read_csv(''D:\\Datasets\\petrol_data.csv'')

    ```


    The script above reads the dataset and stores it in `player_data` dataframe.


    ### 3. Data Analysis


    Execute the following script to eyeball the data:


    ```python

    petrol_data.head()

    ```


    The result looks like this:


    ![](Images/image00460.gif)


    ### 4. Data Preprocessing


    To following script divides the data into feature and label set.


    ```python

    features= petrol_data.iloc[:,:,0:4].values

    labels= petrol_data.iloc[:,:,4].values

    ```


    Finally let’s divide the data into 80 % training and 20% test sets:


    ```python

    from sklearn.model_selection import train_test_split

    train_features, test_features, train_labels, test_labels = train_test_split(features,
    labels, test_size = 0.2, random_state = 0)

    ```


    ### 5. Data Scaling


    If you look at the dataset, you can see that our data is not very well scaled.
    For instance, the feature `Population_Driver_License` has values between 0 and
    1 while `Average_Income` and `Paved_Highways` has values in thousand. Therefore,
    before feeding our data to the algorithm, we need to scale our features. Execute
    the following script to do so:


    ```python

    from sklearn.preprocessing import StandardScaler

    feature_scaler = StandardScaler()

    train_features_poly = feature_scaler.fit_transform(train_features)

    test_features_poly = feature_scaler.transform(test_features)

    ```


    ### 6. Training the Algorithm


    We have scaled our features down. Now is the time to train our algorithm. To implement
    decision tree for classification, we use the `DecisionTreeClassifier` class of
    the `sklearn.tree` library. The `fit` method of the class is used to train the
    algorithm. The training features and labels are passed to this `fit` as shown
    in the following script:


    ```python

    from sklearn.tree import DecisionTreeClassifier

    dt_reg = DecisionTreeClassifier()

    dt_reg.fit(train_features, train_labels)

    ```


    ### 7. Make Predictions


    Finally to make predictions we will use the `predict` method of the `DecisionTreeClassifier`
    class object `dt_reg` that we created in the last section. Test features will
    be passed to it as a parameter.


    ```python

    predictions = dt_reg.predict(test_features)

    ```


    Let’s compare the predicted values with the actual values, execute the following
    script:


    ```python

    comparison=pd.DataFrame({''Real'':test_labels, ''Predictions'':predictions})

    print(comparison)

    ```


    The output of the script above looks like this:


    ![](Images/image00465.jpeg)


    ### 8. Evaluating the Algorithm


    The following script finds these values of mean absolute error, mean squared error
    and root mean squared error:


    ```python

    from sklearn import metrics

    print(''MAE:'', metrics.mean_absolute_error(test_labels, predictions))

    print(''MSE:'', metrics.mean_squared_error(test_labels, predictions))

    print(''RMSE:'', np.sqrt(metrics.mean_squared_error(test_labels, predictions)))

    ```


    The output values are as follows:


    ![](Images/image00466.jpeg)


    The value of `MAE` is 79, which is greater than MAE value calculated for Polynomial
    Regression algorithm in the last chapter. Similarly, the value of `RMSE` in the
    case of decision tree is 118 which is far greater than the value obtained using
    polynomial regression algorithm in the last chapter. Hence we can say that for
    predicting petrol prices given the dataset used in this chapter, Polynomial regression
    algorithm outperforms the Decision tree algorithm.


    ## Conclusion


    In this chapter we studied what decision tree algorithm is and how it can be used
    for regression. In the next chapter we will study Random Forest algorithm which
    is basically based on decision tree algorithm.


    # Chapter 7


    ## Random Forest for Regression


    In the last chapter we studied decision trees. A single decision tree can be biased
    depending upon the data. A better approach could be to use multiple decision trees
    that make their own prediction and then final prediction can be calculating by
    finding average of all trees. This approach is known as ensemble learning. In
    ensemble learning multiple algorithms of same or different types are joined together
    to create a power machine learning model. Random forest is a type of ensemble
    learning models and can be used for supervised machine learning. Random forest
    algorithm unites multiple decision tree algorithms, creating a forest. Therefore
    the algorithm is called `Random Forest` algorithm. Like decision tree algorithm,
    random forest algorithm can be used to predict continuous values (regression)
    as well as discrete values (classification). In this article we will implement
    random forest algorithm with the help of Scikit learn library for regression purpose.
    We will see how we can use random forest algorithm for Classification in the Classification
    section of the book.


    ### Working of Random Forest Algorithm


    Random forest algorithm performs following steps:


    1. Choose `K` random data points from the dataset.

    2. Create a decision tree regression or classification algorithm based on the
    `K` data points.

    3. Select the number of trees for random forest algorithm and perform steps 1
    and 2 on each tree.

    4. If the problem is regression, each tree predicts a continuous value; the final
    output can be calculated by taking mean of the values predicted by all the trees.
    If the problem at hand is classification problem, each tree predicts a discrete
    value. Final category can be selected by majority voting.


    ### Pros of Random Forest Algorithm


    There are several advantages of random forest algorithm, some of which have been
    enlisted below:


    1. A random forest algorithm is one of the most stable algorithm and scales very
    well. Since there are multiple trees in the forest, introduction or removal of
    data from the dataset can impact a small portion of trees but not all trees. The
    overall stability of the algorithm is not affected.

    2. Random forest algorithm performs equally well in case of numerical as as categorical
    features.

    3. You don’t need to perform feature scaling in case of random forest algorithm
    since it doesn’t rely on the distance between the data points in the feature space.


    ### Cons of Random Forest Algorithm

