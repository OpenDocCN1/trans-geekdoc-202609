- raw: "This chapter presented brief overview of Python syntax. The rest of the book\
    \ follows the conventions and syntax described in this chapter. In the next chapter,\
    \ we will study basic Python data types. We shall see what different types of\
    \ data python can hold and how to declare variables to store the data. Happy Coding!!!\n\
    \n#  \n\n#  \n\n# Chapter 4\n\n## Variables and Data Types\n\nA software application\
    \ consists of two fundamental parts: Logic and Data. Logic consists of the functionalities\
    \ that are applied on data to accomplish a particular task. Application data can\
    \ be stored in memory or hard disk. Files and databases are used to store data\
    \ on hard disk. In memory, data is stored in the form of variables. \n\n### Definition\
    \ of Variable\n\nVariable in programming is a memory location used to store some\
    \ value. Whenever you store a value in a variable, that value is actually being\
    \ stored at physical location in memory. Variables can be thought of as reference\
    \ to physical memory location. The size of the memory reserved for a variable\
    \ depends upon the type of value stored in the variable. \n\n### Creating a Variable\n\
    \nIt is very easy to create a variable in Python. The assignment operator “=”\
    \ is used for this purpose. The value to the left of the assignment operator is\
    \ the variable identifier or name of the variable. The value to the right of the\
    \ operator is the value assigned to the variable. Take a look at the following\
    \ code snippet.\n\nName  = ‘Mike’        # A string variable\n\nAge   = 15         \
    \ # An integer variable\n\nScore = 102.5      # A floating type variable\n\nPass \
    \ = True        # A boolean Variable\n\nIn the script above we created four different\
    \ types of variables. You can see that we did not specify the type of variable\
    \ with the variable name. For instance we did not write “string Name” or “int\
    \ Age”. We only wrote the variable name. This is because Python is a loosely typed\
    \ language. Depending upon the value being stored in a variable, Python assigns\
    \ type to the variable at runtime. For instance when Python interpreter interprets\
    \ the line “Age = 15”, it checks the type of the value which is integer in this\
    \ case. Hence, Python understands that Age is an integer type variable. \n\nTo\
    \ check type of a variable, pass the variable name to “type” function as shown\
    \ below:\n\n type(Age)\n\nYou will see that the above script, when run, prints\
    \ “int” in the output which is basically the type of Age variable.\n\nPython allows\
    \ multiple assignment which means that you can assign one value to multiple variables\
    \ at the same time. Take a look at the following script:\n\nAge = Number = Point\
    \ = 20 #Multiple Assignment\n\nprint (Age)\n\nprint (Number)\n\nprint (Point)\n\
    \nIn the script above, integer 20 is assigned to three variables: Age, Number\
    \ and Point. If you print the value of these three variables, you will see 20\
    \ thrice in the output. \n\n### Python Data Types\n\nA programming application\
    \ needs to store variety of data. Consider scenario of a banking application that\
    \ needs to store customer information. For instance, a person’s name and mobile\
    \ number; whether he is a defaulter or not; collection of items that he/she has\
    \ loaned and so on. To store such variety of information, different data types\
    \ are required. While you can create custom data types in the form of classes,\
    \ Python provides six standard data types out of the box. They are:\n\n*   Strings\n\
    \n*   Numbers\n\n*   Booleans \n\n*   Lists\n\n*   Tuples\n\n*   Dictionaries\n\
    \nStrings\n\nPython treats string as sequence of characters. To create strings\
    \ in Python, you can use single as well as double quotes. Take a look at the following\
    \ script:\n\nfirst\\_name = 'mike' # String with single quotation\n\nlast\\_name\
    \ = \" johns\" # String with double quotation\n\nfull\\_name = first\\_name +\
    \ last\\_name # string concatenation using +\n\nprint(full\\_name)\n\nIn the above\
    \ script we created three string variables: first\\_name, last\\_name and full\\\
    _name. String with single quotes is used to initialize the variable “first\\_name”\
    \ while string with double quotes initializes the variable “last\\_name”. The\
    \ variable full\\_name contains the concatenation of the first\\_name and last\\\
    _name variables. Running the above script returns following output:\n\nmike johns\n\
    \nNumbers\n\nThere are four types of numeric data in python:\n\n*   int (Stores\
    \ integer e.g 10)\n\n*   float (Stores floating point numbers e.g 2.5)\n\n*  \
    \ long (Stores long integer such as 48646684333)\n\n*   complex (Complex number\
    \ such as 7j+4847k)\n\nTo create a numeric Python variable, simply assign a number\
    \ to variable. In the following script we create four different types of numeric\
    \ objects and print them on the console. \n\nint\\_num = 10       # integer \n\
    \nfloat\\_num = 156.2  #float\n\nlong\\_num = -0.5977485613454646  #long\n\ncomplex\\\
    _num = -.785+7J #Complex\n\nprint(int\\_num)\n\nprint(float\\_num)\n\nprint(long\\\
    _num)\n\nprint(complex\\_num)\n\nThe output of the above script will be as follows:\n\
    \n![](Images/image00334.jpeg)\n\nBoolean \n\nBoolean variables are used to store\
    \ Boolean values. True and False are the two Boolean values in Python. Take a\
    \ look at the following example:\n\ndefaulter = True\n\nhas\\_car = False\n\n\
    print(defaulter and has\\_car)\n\nIn the script above we created two Boolean variables\
    \ “defaulter” and “has\\_car” with values True and False respectively. We then\
    \ print the result of the AND operation on both of these variables. Since the\
    \ AND operation between True and False returns false, you will see false in the\
    \ output. We will study more about the logical operators in the next chapter.\
    \ \n\nLists\n\nIn Python, List data type is used to store collection of values.\
    \ Lists are similar to arrays in any other programming language. However Python\
    \ lists can store values of different types. To create a list opening and closing\
    \ square brackets are used. Each item in the list is separated from the other\
    \ with a comma. Take a look at the following example.\n\ncars = \\['Honda', 'Toyota',\
    \ 'Audi', 'Ford', 'Suzuki', 'Mercedez'\\]\n\nprint(len(cars))   #finds total items\
    \ in string\n\nprint(cars)\n\nIn the script above we created a list named cars.\
    \ The list contains six string values i.e. car names. Next we printed the size\
    \ of the list using len function. Finally we print the list on console. \n\nThe\
    \ output looks like this:\n\n![](Images/image00335.jpeg)\n\nTuples\n\nTuples are\
    \ similar to lists with two major differences. Firstly, opening and closing braces\
    \ are used to create tuples instead of lists that use square brackets. Secondly,\
    \ tuple once created is immutable which means that you cannot change tuple values\
    \ once it is created. The following example clarifies this concept.\n\ncars =\
    \ \\['Honda', 'Toyota', 'Audi', 'Ford', 'Suzuki', 'Mercedez'\\]\n\ncars2 =  ('Honda',\
    \ 'Toyota', 'Audi', 'Ford', 'Suzuki', 'Mercedez')\n\ncars \\[3\\] = 'WV'\n\ncars2\
    \ \\[3\\] = 'WV'\n\nIn the above script we created a list named cars and a tuple\
    \ named cars2. Both the list and tuple contains list of car names. We then try\
    \ to update the third index of the list as well as tuple with a new value. The\
    \ list will be updated but an error will be thrown while trying to update the\
    \ tuple’s third index. This is due to the fact that tuple, once created cannot\
    \ be modified with new values.  The error looks like this:\n\n![](Images/image00336.jpeg)\n\
    \nDictionaries \n\nDictionaries store collection of data in the form of key-value\
    \ pairs. Each key-value pair is separated from the other via comma. Keys and values\
    \ are separated from each other via colon. Dictionary items can be accessed via\
    \ index as well as keys. To create dictionaries you need to add key-value pairs\
    \ inside opening and closing parenthesis. Take a look at the following example.\n\
    \ncars = {'Name':'Audi', 'Model': 2008, 'Color':'Black'}\n\nprint(cars\\['Color'\\\
    ])\n\nprint(cars.keys())\n\nprint(cars.values())"
