    # Chapter 5


    ## Operators


    Operators in programming are literals used to perform specific logical, relational
    or mathematical operations on the operands. Python operators can be divided into
    following five categories:


    *   Arithmetic


    *   Logical


    *   Comparison


    *   Assignment


    *   Membership operators


    In this chapter we will discuss these operators with the help of examples.


    ### Arithmetic Operators


    Arithmetic operators, as the name suggests, are used to perform arithmetic operations
    on the operands.


    Suppose N1 = 10 and N2 = 5; take a look at the following table to understand arithmetic
    operators.


    | OperatorName || Symbol || Functionality || Example |


    | --- | --- | --- | --- |


    | Addition  || + || Adds the operands on either side || N1 + N2 = 15 |


    | Subtraction  || \- || Subtracts the operands on either side || N1 – N2 = 5 |


    | Multiplication  || \* || Multiplies the operands on either side || N1 \* N2
    = 50 |


    | Division  || / || Divides the operand on left by the one on right || N1 / N2
    = 2 |


    | Modulus || % || Divides the operand on left by the one on right and returns
    remainder || N1 / N2 = 0 |


    | Exponent || \*\* || Takes exponent of the operand on the left to the power of
    right || N1 \*\* N2 = 100000 |


    Take a look at the following example to see arithmetic operators in action:


    N1 = 10


    N2 = 5


    print(N1 + N2)


    print(N1 - N2)


    print(N1 \* N2)


    print(N1 / N2)


    print(N1 \*\* N2)


    The output of the script above looks like this:


    ![](Images/image00338.jpeg)


    ### Logical Operators


    Logical operators are used to perform logical functions such as AND, OR and NOT
    on the operands. The following table contains Python logical operators along with
    their description and functionality. Suppose N1 is True and N2 is false.


    | Operator || Symbol || Functionality || Example |


    | --- | --- | --- | --- |


    | Logical AND || and || If both the operands are true then condition becomes true.
    || (N1 and N2) = False |


    | Logical OR || or || If any of the two operands are true then condition becomes
    true. || (N1 or N2) = True |


    | Logical NOT || not || Used to reverse the logical state of its operand. || not(N1
    and N2) =True |


    Take a look at the following example to see logical operators in action:


    N1 = True


    N2 = False


    print(N1 and N2)


    print(N1 or N2)


    print(not(N1 and N2))


    The output of the above script looks like this:


    ![](Images/image00339.jpeg)


    ### Comparison Operators


    Comparison operators are used to compare the values contained by the operands
    and returns true or false depending upon the relationship between the operands.
    Comparison operators are also commonly known as relational operators. Suppose
    N1 is equal to 10 and N2 is equal to 5, take a look a look at the following table
    to understand comparison operators.


    | Operator || Symbol || Description || Example |


    | --- | --- | --- | --- |


    | Equality || \== || Returns true if values of both the operands are equal ||
    (N1 == N2) = false |


    | Inequality || != || Returns true if values of both the operands are not equal
    || (N1 != N2) = true |


    | Greater than || \> || Returns true if value of the left operand is greater than
    the right one || (N1 >  N2) = true |


    | Smaller than || < || Returns true if value of the left operand is smaller than
    the right one || (N1 <  N2) = false |


    | Greater than or equal to || \>= || Returns true if value of the left operand
    is greater than or equal to the right one || (N1 > =N2) = true |


    | Smaller than or equal to || <= || Returns true if value of the left operand
    is smaller than or equal to the right one || (N1 <= N2) = false |


    Take a look at the following example to see comparison operators in action:


    N1 = 10


    N2 = 5


    print(N1 == N2)


    print(N1 != N2)


    print(N1 > N2)


    print(N1 < N2)


    print(N1 >= N2)


    print(N1 <= N2)


    The output of the script above looks like this:


    ![](Images/image00340.jpeg)


    ### Assignment Operators


    Assignment operators are used to assign values to the operand. The table below
    contains information about Python assignment operators. Suppose N1 is equal to
    10 and N2 is equal to 5.


    | Operator || Symbol || Description || Example |


    | --- | --- | --- | --- |


    | Assignment || \= || Used to assign value of the right operand to the right.
    || R = N1 + N2  assigns 15 to R |


    | Add and assign || += || Adds the operands on either side and assigns the result
    to the left operand || N1 += N2 assigns 15 to N1 |


    | Subtract and assign || \-= || Subtracts the operands on either side and assigns
    the result to the left operand || N1 -= N2 assigns 5 to N1 |


    | Multiply and Assign || \*= || Multiplies the operands on either side and assigns
    the result to the left operand || N1 \*= N2 assigns 50 to N1 |


    | Divide and Assign || /= || Divides the operands on the left by the right and
    assigns the result to the left operand || N1 \*= N2 assigns 2 to N1 |


    | Take modulus and assign || %= || Divides the operands on the left by the right
    and assigns the remainder to the left operand || N1 %= N2 assigns 0 to N1 |


    | Take exponent and assign || \*\*= || Takes exponent of the operand on the left
    to the power of right and assign the remainder to the left operand || N1 \*\*=
    N2 assigns 100000 to N1 |


    Take a look at the following example to see assignment operators in action:


    N1 = 10; N2 = 5


    R = N1 + N2


    print(R)


    N1 = 10; N2 = 5


    N1 += N2


    print(N1)


    N1 = 10; N2 = 5


    N1 -= N2


    print(N1)


    N1 = 10; N2 = 5


    N1 \*= N2


    print(N1)


    N1 = 10; N2 = 5


    N1 /= N2


    print(N1)


    N1 = 10; N2 = 5


    N1 %= N2


    print(N1)


    N1 = 10; N2 = 5


    N1 \*\*= N2


    print(N1)


    The output of the script above looks like this:


    ![](Images/image00341.jpeg)


    ### Membership Operators


    Membership operators are used to check whether the value stored in the operand
    exists in a particular sequence or not. There are two types of membership operators
    in Python: ‘in’ and ‘not in’. The in operator returns true if a value is found
    in a particular sequence. The “not in” operator returns true in the reverse case.
    Take a look at the following example to see membership operators in action.


    cars = \[''Honda'', ''Toyota'', ''Audi'', ''Ford'', ''Camery''\]


    print(''Honda'' in cars)  # Returns True


    print(''BMW'' in cars) # Returns False


    print(''Honda'' not in cars) # Returns False


    print(''BMW'' not in cars) # Returns True


    The script above returns following output:


    ![](Images/image00342.jpeg)


