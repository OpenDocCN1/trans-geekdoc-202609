- raw: "In the script above we create a class Person with four attributes and three\
    \ methods. The attributes are name, age, gender and role while the methods are\
    \ stand and sit. The class methods are basically functions but they are defined\
    \ inside the class body. It is important to mention that class methods take self\
    \ as first parameter by default. The literal self refers to the class that contains\
    \ the method.\n\nAs discussed earlier, classes are merely blue prints, they are\
    \ animated via objects. One class can have multiple objects.\n\n### Objects\n\n\
    In Python, everything is treated as an object. Python objects can be broadly divided\
    \ into two categories:\n\n1-    Built in Objects\n\n2-   Custom Objects\n\nBuilt\
    \ in Objects\n\nBuilt in objects are the objects belonging to primitive data types.\
    \ For instance, when you assign an integer to a variable, basically an integer\
    \ object is stored in that variable. Take a look at the following script:\n\n\
    #creates an integer type object age\n\nage = 28\n\ntype(age)\n\nIn the script\
    \ above we create an integer object and assign it to age variable. We then check\
    \ the type of age variable which returns int.\n\nCustom Objects\n\nCustom objects\
    \ are the objects that implement custom classes. In the previous section we created\
    \ a class Person. Let’s create object of the Person class. Take a look at the\
    \ following script:\n\nperson1 = Person()\n\nTo create custom object, you simply\
    \ have to write the name of the class followed by a pair of parenthesis and assign\
    \ it to a named entity (variable) which is person1 in the above example. Now the\
    \ object person1 can be used to access the Person class attributes and methods.\n\
    \nTo access class attributes or methods, you can use the object name followed\
    \ by the dot operator and the name of the attribute or the method. Take a look\
    \ at the following example:\n\n#accessing attributes\n\nf\\_name = person1.name\n\
    \nprint(f\\_name)\n\n#assessing methods\n\nperson1.stand()\n\nIn the script above,\
    \ the name attribute of the Person class is accessed via person1 object and the\
    \ assigned to the f\\_name variable. The f\\_name variable is then printed on\
    \ the screen. \n\nSimilarly, the stand function is accessed which prints the statement\
    \ “Person standing” on the console. The output of the script above looks like\
    \ this:\n\n![](Images/image00398.jpeg)\n\n### Constructor\n\n“Constructor” is\
    \ a method that executes when a class is instantiated. The processes of creating\
    \ object of a class is also known as instantiation. To create a constructor in\
    \ Python, the \\_\\_init\\_\\_ method is used. Take a look at the following example\
    \ to see constructor in action.\n\n\\# Creates class Person\n\nclass Person:\n\
    \n   #create constructor\n\n   def \\_\\_init\\_\\_(self):\n\n        print(\"\
    Class object created\")\n\n   #create class methods\n\n   def stand(self):\n\n\
           print (\"Person standing\")\n\nIn the script above, we again create class\
    \ Person. But this time the class has a constructor which simply prints some text\
    \ on the screen. The class also contains stand method. \n\nNow, when you create\
    \ the object of the Person class, the constructor will execute and you will see\
    \ “Class object created” on the console screen. Execute the following script:\n\
    \nperson1 = Person()\n\nThe output will be:\n\n![](Images/image00399.jpeg)\n\n\
    ### Attributes\n\nWe know that a value assigned to named entity in Python is actually\
    \ an object. By the same analogy, the attributes declared inside a class are also\
    \ objects. This means that objects can contain nested objects. Let’s create a\
    \ primitive string type object and check what attributes the object contains.\
    \ Take a look at the following script:\n\n#Creates a string object message\n\n\
    message = \"I love Python\"\n\n#find all attributes of message object\n\nprint(dir(message))\
    \ \n\nIn the script above we create a string object named “message”. To find all\
    \ the attributes of an object the dir method is used. The output of the above\
    \ script looks like this:\n\n![](Images/image00400.gif)\n\nClass Attributes vs.\
    \ Instance Attributes\n\nPython classes have two types of attributes: Class attributes\
    \ and Instance attributes. The instance attributes are specific to the individual\
    \ objects of a class and are not shared between the objects. On the other hand,\
    \ class attributes are shared among all the instances (objects) of a class. \n\
    \nThe instance attributes are defined inside a method while the class attributes\
    \ are defined outside the method. Take a look at the following example to see\
    \ difference between class and instance attributes. \n\n\\# Creates class Person\n\
    \nclass Person:\n\n#Creates class attribute\n\n    person\\_count = 0\n\n#Creates\
    \ method with instance attributes\n\n    def set\\_details(self, name, age, gender):\n\
    \n        #initialize instance variables\n\n        self.name = name\n\n       \
    \ self.age = name\n\n        self.gender = name\n\n        #increment class variables\n\
    \n        Person.person\\_count += 1\n\n        print(\"Details for person \"\
    \ +self.name + \" have been stored\")\n\nIn the script above, as usual we create\
    \ Person class. The class contains one class attribute person\\_count and a method\
    \ set\\_details. Inside the set\\_details method, three instance attributes are\
    \ initialized with the values passed as arguments to the set\\_details method.\
    \ Inside the method, the person\\_count attribute is incremented by one. Another\
    \ difference you can see here is that inside a class, the class attribute is accessed\
    \ via class name whereas the instance attributes are accessed via keyword self.\n\
    \nLet’s create an object of Person class and call the set\\_details method on\
    \ the object.\n\nperson1 = Person()\n\nperson1.set\\_details(\"John\", 24, \"\
    Male\")\n\nprint(\"Person count \" + str(person1.person\\_count))\n\nIn the script\
    \ above, we create person1 object of Person class. We then call the set\\_details\
    \ method using the object and pass some arguments to the method. The method prints\
    \ the name of the person on console. We then print the class attribute person\\\
    _count on the screen which will display 1. The output of the script above looks\
    \ like this:\n\n![](Images/image00401.jpeg)\n\nNow, let’s create another Person\
    \ class object.\n\nPerson2 = Person()\n\nPerson2.set\\_details(\"Suzi\", 31, \"\
    Female\")\n\nprint(\"Person count \" + str(person2.person\\_count))\n\nIn the\
    \ script above, we create person2 object of the Person class. This time, the shared\
    \ attribute person\\_count will be incremented to 2 since it previously was 1.\
    \ \n\nThe output of the script above looks like this:\n\n![](Images/image00402.jpeg)\n\
    \nFrom the output you can see class attribute person\\_count is being shared between\
    \ the two instances person1 and person2 while the instance attribute “name” is\
    \ not being shared. \n\n### Properties\n\nEncapsulation is one of the major building\
    \ blocks of OOP. Encapsulation refers to providing controlled access to internal\
    \ class data. The access is controlled via special methods. The special methods\
    \ are bundled with the class attributes via properties and descriptors.\n\nWhy\
    \ we need Properties?\n\n In this section we will study properties. But first,\
    \ let’s see why we need properties. \n\nLet’s create a class named Medicine with\
    \ three attributes: name, expiration\\_year and expiration\\_month. Execute the\
    \ following script: \n\n\\# Creates class Medicine\n\nclass Medicine:\n\n#Creates\
    \ Medicine class constructor\n\n    def \\_\\_init\\_\\_(self, name, expiry\\\
    _year, expiry\\_month):\n\n        #initialize instance variables\n\n        self.name\
    \ = name\n\n        self.expiry\\_year = expiry\\_year\n\n        self.expiry\\\
    _month = expiry\\_month\n\n    def getExpiryDate(self):\n\n        print ('The\
    \ expiration date is : '+str(self.expiry\\_month)+'/'+str(self.expiry\\_year))\n\
    \nNow let’s create an object of the Medicine class. \n\nmedicine1 = Medicine(\"\
    xyz\", 2020, 15)\n\nIn the script above, the constructor of the Medicine class\
    \ assigns 15 as the month number to the expiry\\_month. To see the expiry date,\
    \ call the getExpiryDate method using the medicine1 object as shown below:\n\n\
    medicine1.getExpiryDate()"
