- raw: "child2 = Child2()\n\n#Access Parent class method\n\nchild2.methodA()\n\n#Access\
    \ Child1 class method\n\nchild2.methodC()\n\nIn the script above, we have two\
    \ child classes Child1 and Child2 that inherit the parent class named Parent.\
    \ Both the child classes have now access to the Parent class method i.e. methodA,\
    \ the output of the script above looks like this:\n\n![](Images/image00409.jpeg)\n\
    \n### Calling Parent Class Constructor from Child Class\n\nWe know that a class\
    \ inherits parent class and its attributes. But a question arises here that how\
    \ can we initialize the attributes of the parent class using child class constructors.\
    \ For instance, if there are two attributes in the parent class and 1 attribute\
    \ in the child class. How do we initialize these three attributes using child\
    \ class constructor?\n\nPython provides simple solution to this problem. The arguments\
    \ for the parent and child class constructors are passed to the child class. Inside\
    \ the child class constructor, the parent class constructor is called and arguments\
    \ for the parent class constructor are passed to it. The remaining arguments are\
    \ used to initialize the child class attributes. Take a look at the following\
    \ example:\n\n#Create Vehicle Class \n\nclass Vehicle:\n\n    #Constructor for\
    \ the Parent class\n\n    def \\_\\_init\\_\\_ (self, name, color):\n\n       \
    \ self.name = name\n\n        self.color = color\n\n#Create Bike Class that inherits\
    \ Vehicle Class \n\nclass Bike(Vehicle):\n\n    #Constructor for the child class\n\
    \n    def \\_\\_init\\_\\_ (self, name, color, price):\n\n        #Call to Vehicle\
    \ class Constructor from Bike class\n\n        Vehicle.\\_\\_init\\_\\_ (self,\
    \ name, color)\n\n        self.price = price\n\n#Create Vehicle Class Object\n\
    \nbike = Bike(\"Honda\",\"Black\",25000)\n\n#Access parent class attributes\n\n\
    print(bike.name)\n\nprint(bike.color)\n\n#Access child class attribute\n\nprint(bike.price)\n\
    \nIn the script above we create Parent class “Vehicle” with two attributes: name\
    \ and color. The parent class constructor initializes these two attributes. We\
    \ then defined a child class “Bike” that inherits class Vehicle. Child class has\
    \ one attribute i.e. price which is initialized via child Bike class constructor.\
    \ However the Bike class constructor takes three parameters name, color and age.\
    \ Inside the Bike class constructor, the Vehicle class constructor is called and\
    \ the name and color attributes are passed to Vehicle class constructor. While\
    \ the price argument is used to initialize the child class attribute price. \n\
    \nWe create object of the Bike class and pass it values for name, color and price\
    \ attributes. We then print these values on the console. The output of the above\
    \ script looks like this:\n\n![](Images/image00410.jpeg)\n\n### Multiple Inheritance\n\
    \nWe know that a parent class can be inherited by multiple child classes. This\
    \ is the type of inheritance supported by programming languages like Java and\
    \ C#. However, in Python, one child class can also inherit multiple parent classes.\
    \ This is called multiple inheritance. \n\nThe following example will further\
    \ clear the concept of multiple inheritance.\n\nclass Vehicle:\n\n    def showVehicleDetails\
    \ (self):\n\n        print(\"I am vehicle class\")\n\nclass Sedan:\n\n    def\
    \ showSedanDetails (self):\n\n        print(\"I am sedan class\")\n\n#Create Class\
    \ Car that inherits Vehicle and Sedan\n\nclass Car(Vehicle,Sedan):\n\n    def\
    \ showCarDetails (self):\n\n        print(\"I am car class\")\n\n#Create object\
    \ of car Class \n\ncar = Car()\n\n#Access Vehicle class method\n\ncar.showVehicleDetails()\n\
    \n#Access Sedan class method\n\ncar.showSedanDetails()\n\n#Access child class\
    \ method\n\ncar.showCarDetails()\n\nIn the script above we have three classes\
    \ Vehicle, Sedan and Car. The Car class inherits both Vehicle and Sedan class.\
    \ We then create the object of the Car class and access the Vehicle and Sedan\
    \ class methods from the car class object. The example shows that a child class\
    \ that inherits multiple parents has access to all the attributes and methods\
    \ of all the parent classes. The output of the above example looks like this:\n\
    \n![](Images/image00411.jpeg)\n\n### Method Overriding \n\nIn addition to having\
    \ access to parent class methods, a child class can also override parent class\
    \ method by providing its own definition for the same method name. Take a look\
    \ at the following example to understand this concept:\n\n#Create Person Class\n\
    \nclass Employee:\n\n    def printdetails (self):\n\n        print(\"I am an employee\
    \ of this company\")\n\n#Create Class Manager that inherits Employee\n\nclass\
    \ Manager(Employee):\n\n    def printdetails (self):\n\n        print(\"I am a\
    \ Manager of this company\")\n\nmanager = Manager()\n\nmanager.printdetails()\n\
    \nIn the script above, we created two classes: Employee and Manager. The Employee\
    \ class contains a method printdetails. The Manager class inherits the Employee\
    \ class which means that the Manager class has access to the printdetails method\
    \ of the Employee class. However in the Manager contains its own definition of\
    \ the printdetails method. Now when you create the object of the Manager class\
    \ and call the printdetails method, the method that is overridden in the child\
    \ class will be called instead of the parent class method as shown in the following\
    \ output:\n\n![](Images/image00412.jpeg)\n\n### Polymorphism\n\nThe world polymorphism\
    \ literally refers to “ability to adopt multiple shapes”. In programming, polymorphism\
    \ refers to the capability of a method to behave differently depending upon different\
    \ scenarios such as number and type  of parameters of a method and the type of\
    \ object that calls the method(whether it is child or parent class object)\n\n\
    A simple example of polymorphism is the addition operator. When you use addition\
    \ operator to add two numbers, the addition operator works like mathematical addition\
    \ operator and returns the sum of the operands. However, if the same addition\
    \ operator is used to add two string, the resultant value is a concatenated string.\
    \ Take a look at a simple example:\n\n#Using addition operator for sum\n\nx =\
    \ 10\n\ny = 20\n\nresult = x + y\n\nprint(result)\n\n#using addition operator\
    \ for string concatenation\n\nx = \"Welcome\"\n\ny = \"to Python\"\n\nresult =\
    \ x + y\n\nprint(result)\n\nIn the script above we assign two numeric values to\
    \ variables x and y. We then use addition operator to add these values and store\
    \ the sum in the result variable. We then print the result variable on screen\
    \ which is a numeric variable. This shows that addition operator adds two numeric\
    \ operands. Next, we assign two string type values to x and y variables and again\
    \ use addition operator. This time the addition operator concatenates two strings.\
    \ The example shows how addition operator follows polymorphism depending upon\
    \ the operands. \n\nIn custom classes, polymorphism is implemented via method\
    \ overloading and method overriding. We studied method overriding in the previous\
    \ section, here we shall see method overloading.\n\nMethod overloading refers\
    \ to the ability of a method to perform different function based on the arguments\
    \ passed to it. Take a look at a simple example of method overloading:\n\n#Create\
    \ Employee\n\nclass Employee:\n\n    def printname (self, name = None):\n\n       \
    \ if name == None:\n\n            print(\"Hello, I am an employee\")\n\n       \
    \ else:\n\n            print(\"Hello, I am an employee. My name is \",name)\n\n\
    In the script above we create a class Employee with one method printname. The\
    \ printname method has one optional parameter i.e. name. The printname method\
    \ can be called with one string type argument or without any argument. If the\
    \ method is called with no argument, the statement “Hello, I am an employee” will\
    \ be printed on the console. If the printname method is called with a string type\
    \ argument, the statement “Hello, I am an employee. My name is \",name” will be\
    \ printed on the screen with the argument replacing the name variable. Let’s create\
    \ an object of Employee class and call the printname method with and without any\
    \ argument. \n\nemp = Employee()\n\nemp.printname()\n\nemp.printname(\"Joseph\"\
    )\n\nThe output of the above script looks like this:"
