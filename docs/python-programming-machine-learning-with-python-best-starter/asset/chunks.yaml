    \n## 全局变量与局部变量\n\n与实例属性和类属性一样，Python 中的变量也分为两种：全局变量和局部变量。任何在函数体外部定义的变量被称为全局变量，而在函数体内部定义的变量被称为局部变量。请看下面的示例来了解局部和全局变量的作用：\n\
    \n```python\n#声明全局变量\ncount = 1;\n\ndef print_count():\n    # 访问全局变量\n    print(\"\
    Accessing global variable inside function :\" + str(count))\n    num = 2;\n\n\
    print(count)\nprint_count()\nprint(num)\n```\n\n在上述脚本中，我们首先声明了一个全局变量 `count`。随后在\
    \ `print_count` 函数内部访问了这个全局变量。在函数内部还声明了一个局部变量 `num`。\n\n最后，在函数外部访问了全局变量 `count`\
    \ 和局部变量 `num`。你会发现上面的代码会返回错误，因为 `num` 是一个局部变量，无法在 `print_count` 函数外部访问。上述脚本的输出如下：\n\
    \n![](img/image00406.jpeg)\n\n你可以看到，由于我们尝试在函数外部访问局部变量 `num`，系统抛出了 `num` 未定义的错误。\n\
    \n## 修饰符\n\nPython 中的修饰符用于指定变量的作用范围。与大多数其他编程语言一样，Python 有三种访问修饰符：公共（Public）、私有（Private）和保护（Protected）。具有公共访问修饰符的变量可以在程序的任何地方访问。公共变量的名称开头没有下划线。相反，具有私有修饰符的变量只能在类内部访问。私有变量名以双下划线开头。最后，保护变量可以在类内部以及子类中访问（我们将在下一章介绍父子类）。\n\
    \n请看下面的示例来了解修饰符的作用：\n\n```python\n#创建 Person 类\nclass Person:\n    def __init__(self,\
    \ name, age, gender):\n        # 私有变量\n        self.__age = age\n        # 公共变量\n\
    \        self.name = name\n        # 保护变量\n        self._gender = gender\n```\n\
    \n在上述脚本中，我们有一个包含三个实例变量 `name`、`age` 和 `gender` 的 `Person` 类。`name` 变量是公有的；`age`\
    \ 变量是私有的，而 `gender` 变量是保护的。\n\n让我们创建一个 `Person` 类对象并尝试在类外部访问变量。请看下面的脚本：\n\n```python\n\
    person1 = Person(\"John\", 20, \"Male\")\n# 访问公共变量\nprint(person1.name)\n# 访问私有变量\n\
    print(person1.age)\n```\n\n在上述脚本中，我们首先通过 `Person` 类对象 `person1` 访问公共变量 `name`。然后访问\
    \ `Person` 类的私有变量 `age`。在输出中你会发现我们可以访问 `name` 变量因为它是公共的，但当我们尝试在 `Person` 类外部访问私有变量\
    \ `age` 时，会报错。脚本的输出如下：\n\n![](img/image00407.jpeg)\n\n错误信息显示 `Person` 对象没有属性 `age`。这是因为\
    \ `age` 是私有的，无法在 `Person` 类外部访问。\n\n## 总结与后续\n\n在本章中，我们开始了关于 Python 面向对象编程（OOP）的讨论。我们看到了不同的\
    \ OOP 概念，包括类、对象、属性、方法、修饰符等。在下一章中，我们将学习什么是继承以及如何在 Python 中实现继承。编码愉快！！！\n\n# 第 13\
    \ 章\n\n## 继承与多态\n\n在上一章中，我们开始了关于对象编程（OOP）的讨论并涵盖了大部分基础 OOP 概念。OOP 有三大支柱：数据封装、继承和多态。在上一章中，我们学习了如何使用访问修饰符和属性在\
    \ Python 中实现数据封装。在本章中，我们将学习继承和多态。\n\n### 继承基础\n\n编程中的继承指的是一个类继承其他类的方法和属性的能力。这类似于现实世界中的继承。子类继承其父母的一些特征，同时也拥有自己独特的特征。继承另一个类的类被称为子类或派生类，而被另一个类继承的类被称为父类或基类。\n\
    \n子类和父类之间存在“IS-A”（是一个……）的关系。例如，一个子类 `car` 是一种车辆（其父类类）。同样，`employee` 是一个人。根据经验，如果多个类具有某些共同的方法和属性，应该定义一个包含这些方法和属性的父类。然后这个父类就可以被多个子类继承。通过示例可以更清楚这一点。\n\
    \n让我们创建一个名为 `Parent` 的简单类，包含一个方法。我们还会创建一个名为 `Child` 的类继承 `Parent` 类。\n\n```python\n\
    #创建 Parent 类\nclass Parent:\n    def methodA (self):\n        print(\"Hello, I\
    \ am a Parent method\")\n\n# 创建继承 Parent 的 Child\nclass Child(Parent):\n    def\
    \ methodB (self):\n        print(\"Hello, I am a Child method\")\n\n# 创建 Child\
    \ 对象\nchild = Child()\n# 访问 Parent 方法\nchild.methodA()\n# 访问 Child 方法\nchild.methodB()\n\
    ```\n\n在上述脚本中，我们创建了一个 `Parent` 类和一个 `Child` 类。`Child` 类继承了 `Parent` 类。要继承一个类，只需在括号内传递父类的名称即可。在上面的脚本中，`Parent`\
    \ 类包含一个名为 `methodA` 方法，而 `Child` 类包含一个名为 `methodB` 方法。然后我们创建了一个名为 `child` 的子对象。从这个\
    \ `child` 对象我们调用了 `methodA`。你可以看到 `Child` 类并不包含 `methodA`，但因为它继承了 `Parent` 类，所以\
    \ `Child` 对象也可以访问该方法。最后我们调用了子类方法 `methodB`。上述脚本的输出如下：\n\n![](img/image00408.jpeg)\n\
    \n像方法一样，子类也从父类继承属性。请看下面的示例：\n\n```python\n#创建 Parent 类\nclass Parent:\n    name=\"\
    \"\n    age = \"\"\n    def methodA (self):\n        print(\"Hello, I am a Parent\
    \ method\")\n\n# 创建继承 Parent 的 Child\nclass Child(Parent):\n    def methodB (self):\n\
    \        print(\"Hello, I am a Child method\")\n\n# 创建 Child 对象\nchild = Child()\n\
    # 访问 Parent 方法\nchild.methodA()\n# 访问 Child 方法\nchild.methodB()\n# 访问父类属性\nchild.name\
    \ = \"Jacob\"\nchild.age = 10\nprint(child.name + \" \" + str(child.age))\n```\n\
    \n在上述脚本中，我们有一个包含两个属性 `name` 和 `age` 以及一个方法 `methodA` 的父类，在子类中我们访问了方法和属性并在控制台上显示了它们。\n\
    \n### 多子类\n\n多个子类可以继承同一个父类。请看下面的脚本：\n\n```python\n#创建 Parent 类\nclass Parent:\n\
    \    def methodA (self):\n        print(\"Hello, I am a Parent method\")\n\n#\
    \ 创建继承 Parent 的 Child1\nclass Child1(Parent):\n    def methodB (self):\n     \
    \   print(\"Hello, I am a Child1 method\")\n\n# 创建继承 Parent 的 Child2\nclass Child2(Parent):\n\
    \    def methodC (self):\n        print(\"Hello, I am a Child2 method\")\n\n#\
    \ 创建 Child1 对象\nchild1 = Child1()\n# 访问 Parent 方法\nchild1.methodA()\n# 访问 Child1\
    \ 方法\nchild1.methodB()\n\n# 创建 Child2 对象\n```\n\n"
