  trans: "\n\n一如既往，第一步是导入所需的库：\n\n```python\nimport pandas as pd\nimport numpy as\
    \ np\nimport matplotlib.pyplot as plt\n%matplotlib inline\n```\n\n## 2. 导入数据\n\
    \n以下脚本用于导入数据：\n\n```python\ncar_data = pd.read_csv('D:\\\\Datasets\\\\car_price.csv')\n\
    ```\n\n## 3. 数据分析\n\n执行以下脚本查看数据集的内容：\n\n```python\ncar_data.head()\n```\n\n输出如下：\n\
    \n![](img/image00491.gif)\n\n最后，让我们绘制数据并看看是否能在数据集中找到任何聚类。执行以下脚本：\n\n```python\n\
    plt.scatter(car_data['Year'], car_data['Price'])\nplt.title(\"Year vs Price\"\
    )\nplt.xlabel(\"Year\")\nplt.ylabel(\"Price\")\nplt.show()\n```\n\n上述脚本的输出如下：\n\
    \n![](img/image00492.jpeg)\n\n如果我们观察上面的图表，并没有发现任何明显的聚类。然而，如果我们的任务是将上述数据点分为三个类，我们可能会形成一个低价格且非常老旧车型的汽车类（左下角的点）、一个中等价格和旧车型的汽车类（图表中间的点）以及一个相对较新且价格较高的汽车类（右上角的点）。让我们尝试使用\
    \ Python 的 Sklearn 库将上述数据点分为三类。\n\n## 4. 数据聚类\n\n要使用 sklearn 实现 K-Means 聚类，可以使用\
    \ `sklearn.cluster` 库中的 `KMeans` 类。聚类的数量可以通过 `KMeans` 类的 `n_cluster` 参数定义。在下面的脚本中，我们创建了三个类。然后调用\
    \ `fit` 方法对数据进行聚类，如下所示所示：\n\n```python\nfrom sklearn.cluster import KMeans\nkm_clus\
    \ = KMeans(n_clusters=3)\nkm_clus.fit(car_data)\n```\n\n现在要找到聚类算法找到质心，可以使用 `KMeans`\
    \ 对象的 `cluster_centers_` 属性，如下所示：\n\n```python\nprint(km_clus.cluster_centers_)\n\
    ```\n\n输出如下：\n\n![](img/image00493.jpeg)\n\n这些是 KMeans 聚类算法针对 `car_price` 数据形成的三个类的质心坐标。\n\
    \n要找到不同数据点的标签，使用 `labels_` 属性，如下所示：\n\n```python\nprint(km_clus.labels_)\n```\n\
    \n输出如下：\n\n![](img/image00494.jpeg)\n\n算法形成的三个类被命名为 0, 1 和 2。需要提到的是，这些聚类名称没有数学意义，它们只是为了给聚类命名。如果还有另一个聚类，它将会被标记为\
    \ 4。\n\n## 5. 绘制聚类图\n\n标签没有提供关于聚类的任何视觉化信息。因此，让我们绘制聚类图。执行以下脚本：\n\n```python\nplt.scatter(car_data['Year'],\
    \ car_data['Price'], c = km_clus.labels_, cmap='rainbow')\n```\n\n输出如下：\n\n![](img/image00495.jpeg)\n\
    \n从输出中我们可以看到，形成的聚类符合我们的预期。低价格且制造年份非常老的汽车被聚类在一起（绿色数据点），年龄中等且价格中等的汽车聚类在一起（蓝色数据点），而新款且高价格的汽车被聚类在一起（红色数据点）。\n\
    \n最后，让我们查看质心以及聚类情况，执行以下脚本：\n\n```python\nplt.scatter(car_data['Year'], car_data['Price'],\
    \ c = km_clus.labels_, cmap='rainbow')\nplt.scatter(km_clus.cluster_centers_[:,0],km_clus.cluster_centers_[:,1],\
    \ color='yellow')\n```\n\n输出如下：\n\n![](img/image00496.jpeg)\n\n每个类的质心已用黄色显示出来。\n\
    \n## 结论\n\n在本章中，我们学习了一种非常有趣的聚类技术，即 K-Means 聚类。在下一章中，我们将学习另一种极其有用的聚类技术，即层次聚类！\n\
    \n# 第 15 章\n\n## 层次聚类\n\n在上一章中，我们学习了 K-Means 聚类，这是一种无监督学习类型。在本章中，我们将学习另一种聚类技术，即层次聚类。层次聚类形成的聚类有时与\
    \ K-Means 聚类相似；然而，层次聚类的过程非常不同。层次聚类分为两种：分裂式（Divisive）和凝聚式（Agglomerative）。在分裂式聚类中，数据点最初被视为一个大类，并采用自上而下的方法将这个大类划分为若干小类。相反，凝聚式聚类涉及自下而上的方法。在本章中，我们将涵盖凝聚聚类，因为它是最常用的聚类类型。\n\
    \n### 层次聚类理论\n\n层次聚类涉及以下步骤：\n\n1. 在开始，每个数据点被视为一个类。因此，如果有 N 个数据点，开始时的聚类总数就是 N。\n\
    2. 合并两个最近的点，产生 N-1 个类。\n3. 再次合并两个最近的类，以形成 N-2 个类。\n4. 重复步骤 3 直到形成一个巨大的类。\n5. 使用树状图（dendrograms）将一个大类分为所需的数量的类。\n\
    \n#### 计算距离\n\n需要提到这里有多种方法可以找到类之间的距离，并且可以用于：\n\n1. 最近点之间的距离。\n2. 最远点之间的距离。\n3.\
    \ 质心的距离。\n4. 所有组合的距离。\n\n#### 使用树状图进行聚类\n\n我们之前提到树状图用于将一个大类分为所需的数量的类。在本节中，我们将通过一个示例观察树状图是如何工作的。执行以下脚本：\n\
    \n```python\nimport numpy as np\ndata = np.array([\n    [1992, 3000],\n    [1995,\
    \ 4000],\n    [1998, 4500],\n    [1996, 4200],\n    [1999, 4700],\n    [1993,\
    \ 3500],\n    [2001, 5700],\n    [2004, 6000],\n    [2008, 6500],\n    [2005,\
    \ 5800],\n    [2007, 6200],\n    [2009, 6700]\n])\n```\n\n上述脚本创建了一个二维整数列表。将它们视为汽车模型和对应的价格。让我们绘制这些数据点。执行以下脚本进行：\n\
    \n```python\nimport matplotlib.pyplot as plt\nannots = range(1, 13)\nplt.figure(figsize=(12,\
    \ 8)) \nplt.subplots_adjust(bottom=0.1) \nplt.scatter(data[:,0],data[:,1], label='True\
    \ Position')\nfor label, x, y in zip(annots, data[:,0], data[:,1]): \n    plt.annotate(\n\
    \        label,\n        xy=(x, y), xytext=(-2, 2),\n        textcoords='offset\
    \ points', ha='right', va='bottom')\nplt.show()\n```\n\n数据点如下：\n\n![](img/image00497.jpeg)\n\
    \n从一眼看出，点 1-6 形成一个类，点 7 到 12 另一个类。\n\n现在让我们看看如何使用树状图形成这些类。执行以下脚本为上述数据点创建树状图：\n\
    \n```python\nfrom scipy.cluster.hierarchy import dendrogram, linkage \nfrom matplotlib\
    \ import pyplot as plt\n\nannot = linkage(data, 'single')\nmarks = range(1, 13)\n\
    plt.figure(figsize=(12, 8)) \ndendrogram(annot, \n    orientation='top',\n   \
    \ labels=marks,\n    distance_sort='descending',\n    show_leaf_counts=True)\n\
    plt.show()\n```\n"
