    \ technique i.e. Hierarchical Clustering!\n\n# Chapter 15\n\n## Hierarchical Clustering\n\
    \nIn the last chapter we studied K-Mean clustering which is a type of unsupervised\
    \ learning. In this chapter we are going to study another clustering technique\
    \ i.e. Hierarchical Clustering. Clustered formed by hierarchical clustering, can\
    \ be sometimes similar to the K-Means clustering; however the process of Hierarchical\
    \ Clustering is quite different. Hierarchical Clustering has two types: Divisive\
    \ and Agglomerative. In divisive clustering, the data points are initially treated\
    \ as one big cluster and a top-down approach is followed to divide this one big\
    \ cluster into several small clusters. On the other hand in Agglomerative clustering\
    \ involves bottom-up approach. In this chapter, we will cover Agglomerative clustering\
    \ since it is the most commonly used clustering type.\n\n### Hierarchical Clustering\
    \ Theory\n\nHierarchical clustering involves following steps:\n\n1.  In the beginning\
    \ every data point is treated as one cluster. Therefore, if there are N data points\
    \ the total number of clusters at the beginning are N.\n\n2.  Join the two closest\
