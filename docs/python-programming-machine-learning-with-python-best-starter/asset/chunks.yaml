    \ can be calculated.\n\n2.  Distance between two farthest points of the cluster\
    \ can be calculated.\n\n3.  Distance between the centroids of two clusters can\
    \ be calculated.\n\n4.  Mean of the distance between all possible combinations\
    \ of points can be calculated.\n\nUsing Dendrograms for Clustering\n\nWe said\
    \ earlier that dendrograms are used to divide one huge cluster into required number\
    \ of clusters. In this section we will see with the help of an example as to how\
    \ dendrograms actually work.\n\nExecute the following script:\n\nimport numpy\
    \ as np\n\ndata = np.array(\\[\n\n    \\[1992,3000\\],  \n\n    \\[1995,4000\\\
