    \ also inside block\")\nprint(\"This is outside block\")\n```\n\n```python\nif\
    \ 10 < 3:\n    print(\"This is inside block\")\nprint(\"This is outside block\"\
    )\n```\n\nThere are several advantages of using indentation for code blocks rather\
    \ than braces.\n\n### Python Identifiers\n\nAn Identifier in programming is a\
    \ name assigned to any variable, function, module or a class. A Python identifier\
    \ can contains letters from A-Z a-z, numbers from 0-9 and underscore. A python\
    \ identifier name must begin with a letter or an underscore. Python is a case\
    \ sensitive language which means `Customer` and `customer` are considered different\
    \ identifiers.\n\n#### Naming Conventions\n\n*   Package and module names are\
    \ all lower case\n*   Classes are declared in bumpy case with first letter of\
    \ the individual words capitalized. For instance `CustomerProductRecord`.\n* \
    \  For methods and functions convention is to use lowercase letters with individual\
    \ words separated by underscores. For example `person_name`, `get_age` etc.\n\
    *   Private variable names begin with single underscore\n*   Strongly private\
    \ variable names begin with double underscore\n\n### Python Keywords\n\nKeywords\
    \ are special words that are reserved by python to perform special tasks. For\
    \ example keyword `class` is used to define a class. Similarly keyword `for` is\
    \ used to define a loop. Keywords cannot be used as identifier or constant names.\
    \ Python has following set of keywords.\n\n| and | exec | not |\n| --- | --- |\
    \ --- |\n| assert | finally | or |\n| break | for | pass |\n| class | from | print\
    \ |\n| continue | global | raise |\n| def | if | return |\n| del | import | try\
    \ |\n| elif | in | while |\n| else | is | with |\n| except | lambda | yield |\n\
    \n## [Capturing User Input]\n\n### Capturing User Input\n\nCapturing user input\
    \ is one of the most fundamental programming tasks. Python makes it simple. In\
    \ Python 3, you can use the `input()` function and pass it the string that you\
    \ want to display to the user. Take a look at the following screen shot:\n\n![](Images/image0033.jpeg)\n\
    \nAnything you enter in the textbox will be stored inside the `text` variable.\n"
  trans: "\n\n启动 Jupyter 的另一种方法是在搜索框中输入“Jupyter Notebook”，并从开始菜单选择“Jupyter Notebook”应用程序，如下所示：\n\
    \n![](img/image00324.gif)\n\nJupyter notebook 将会在默认浏览器的新标签页中启动。\n\n要创建一个新笔记本，点击\
    \ Jupyter notebook 仪表板右上角的“new”按钮。从下拉菜单中选择“Python 3”。\n\n![](img/image00325.jpeg)\n\
    \n你将看到一个如下所示的新 Python 3 笔记本：\n\n![](img/image00326.jpeg)\n\nJupyter notebook 由单元格组成。Python\
    \ 代码写在这些单元格内。让我们使用 Jupyter notebook 打印 hello world。在笔记本的第一个单元格中输入 `print('hello\
    \ world')` 并按 `CTRL+ ENTER`。第一个单元格中的脚本将执行如下所示：\n\n![](img/image00327.jpeg)\n\n\
    `print` 函数将传递给它的参数字符串打印到输出中。要创建一个新单元格，点击左上菜单中的 `+` 按钮，如下所示：\n\n![](img/image00328.jpeg)\n\
    \n你可以在新单元格中编写 Python 脚本并按 `CTRL + ENTER` 执行它。\n\n## 通过 Spyder 运行脚本\n\n虽然 Jupyter\
    \ notebook 是开始编写 Python 程序的好地方，但一旦你熟悉了 Python，就应该转向 Spyder IDE。Spyder 允许我们直接创建\
    \ Python 文件。Spyder 类似于更传统的文本编辑器，具有运行文件、运行代码段、调试代码等选项。\n\n就像 Jupyter notebook 一样，你可以从\
    \ Anaconda Navigator 或直接从开始菜单运行 Spyder。运行 Spyder 后你将看到以下界面。\n\n![](img/image00329.jpeg)\n\
    \n在 Spyder 界面的左侧，你可以看到文本编辑器；这是你输入脚本的地方。右下方是控制台窗口。你可以直接在控制台窗口中执行脚本。此外，编辑器中编写的代码输出也会出现在控制台窗口。让我们在\
    \ Spyder 中写 hello world 程序。\n\n![](img/image00330.jpeg)\n\n在 Python 中运行脚本有两种选择。你可以点击顶部菜单中的绿色三角形，或者选择你想执行的代码段并按键盘上的\
    \ `CTRL + ENTER`。你将在控制台窗口中看到输出。\n\n## 接下来做什么？\n\n在本章中，我们看到了运行 Python 程序所需环境配置的过程。我们在两个不同的编辑器中写了我们的第一个\
    \ Python 程序。在下一章中，我们将开始讨论 Python 语法。祝编程愉快！！！\n\n# 第 3 章\n\n## Python 语法\n\n要编写\
    \ Python 代码，你需要遵循一些规则。在编程术语中，这些规则统称为语法。Python 独特的语法是初学者认为它易于学习和编程的原因之一。在本章中，我们将详细学习\
    \ Python 语法。\n\n### 简单语句\n\n与大多数其他面向对象的编程语言不同，如果某一行中只有一条语句，Python 不需要在语句末尾加分号。如果你想在一行中写多个\
    \ Python 语句（这非常不建议），你必须用分号将它们隔开。看下面的示例。\n\n在这里我们在两个不同的行上写了两个 Python 语句。我们不需要分号。\n\
    \n```python\nprint (\"Welcome to Python\")\nprint (\"It is fun learning Python\"\
    )\n```\n\n当你执行上述语句时，你将看到以下输出：\n\n![](img/image00331.jpeg)\n\n现在让我们用分号隔开在一行内写两个语句：\n\
    \n```python\nprint (\"Welcome to Python\") ; print (\"It is fun learning Python\"\
    )\n```\n\n上述脚本的输出将相同，因为即使它们被写在同一行，它们实际上也是两个语句。\n\n你还可以编写跨越多行的 Python 语句。要做到这一点，你必须在行末尾添加反斜杠。反斜杠表示语句继续到下一行。看下面的脚本：\n\
    \n```python\nsum = 10 + 20 + \\\n      30 + 40 + \\\n      50\nprint(sum)\n```\n\
    \n### 代码块与缩进\n\n缩进是 Python 语法中最显著的特征之一。缩进强制开发者编写具有一致性的可读性代码。\n\n```python\nif\
    \ 10 > 3:\n    print(\"This is inside block\")\nprint(\"This is also inside block\"\
    )\nprint(\"This is outside block\")\n```\n\n```python\nif 10 < 3:\n    print(\"\
    This is inside block\")\nprint(\"This is also inside block\")\nprint(\"This is\
    \ outside block\")\n```\n\n```python\nif 10 < 3:\n    print(\"This is inside block\"\
    )\nprint(\"This is outside block\")\n```\n\n使用缩进而不是大括号作为代码块有许多优点。\n\n### Python\
    \ 标识符\n\n编程中的标识符是分配给任何变量、函数、模块或类的名称。Python 标识符可以包含 A-Z a-z、0-9 和下划线。Python 标识符名称必须以字母或下划线开头。Python\
    \ 是一种大小敏感的语言，这意味着 `Customer` 和 `customer` 被视为不同的标识符。\n\n#### 命名规范\n\n*   包和模块名全小写\n\
    *   类使用驼峰法，每个单词的首字母大写。例如 `CustomerProductRecord`\n*   方法和函数的约定是使用小字母并用下划线分隔。例如\
    \ `person_name`, `get_age` 等\n*   私有变量以单下划线开头\n*   强私有变量以双下划线开头\n\n### Python\
    \ 关键字\n\n关键字是 Python 保留用于执行特殊任务的特殊单词。例如关键字 `class` 用于定义类。同样，关键字 `for` 用于循环。关键字不能作为标识符或常量名。Python\
    \ 拥有以下关键字。\n\n| and | exec | not |\n| --- | --- | --- |\n| assert | finally |\
    \ or |\n| break | for | pass |\n| class | from | print |\n| continue | global\
    \ | raise |\n| def | if | return |\n| del | import | try |\n| elif | in | while\
    \ |\n| else | is | with |\n| except | lambda | yield |\n\n## [获取用户输入]\n\n### 获取用户输入\n\
    \n获取用户输入是最基础的编程任务之一。Python 让它变得非常简单。在 Python 3 中，你可以使用 `input()` 函数并向其传递你想显示给用户的字符串。看下面的截图：\n\
    \n![](img/image0033.jpeg)\n\n你在文本框中输入的任何内容将存储在 `text` 变量中。\n\n"
