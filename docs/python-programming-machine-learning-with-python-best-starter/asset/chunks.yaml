    # Chapter 9


    ## Naïve Bayes Algorithm for Classification


    In the previous chapters, we covered some of the most commonly used algorithms
    for regression e.g. Linear Regression, Support Vector Regression, Polynomial Regression,
    Decision Trees and Random Forest algorithms. Some of these algorithms have variants
    that can be used for classification as well which we will see in the upcoming
    chapters. In this chapter we will start our discussion about classification algorithms
    i.e. Algorithms used to predict discrete value, or a class label for input data.
    The first classification algorithm that we are going to cover in this section
    is the Naïve Bayes Algorithm.


    ### Theory of Naïve Bayes (NB) Algorithm


    Naïve Bayes algorithm is a supervised machine learning algorithm based on Bayes’s
    Theorm. NB algorithm is based on principle of feature independence which states
    that features within a dataset have no relation to each other. For instance a
    fruit may be considered as banana if it is 5 or more inches long, yellow in color
    and 1 cm in diameter. Naïve Bayes have no concern if these features depend on
    each other. The fruit is declared as a banana via independent contribution of
    these features. Due to this independence assumption, NB algorithm is called Naïve.


    Naïve Bayes algorithm is the simplest of all the machine learning algorithms and
    yet very powerful.


    Mathematically Bayes theorem can be represented as:


    ![](Images/image00476.jpeg)


    The aforementioned terms are explained as follows:


    1. `P(A|B)` is the probability that event A will occur given attribute set B

    2. `P(A)` is the prior probability of the occurrence of event A

    3. `P(B|A)` is the prior probability of the occurrence of event A

    4. `P(B)` is the prior probability of the event A


    Let’s understand this concept with the help of an example. Suppose a fruit may
    be considered as banana if it is 5 or more inches long, yellow in color and 1
    cm in diameter. Naïve Bayes have no concern if these features depend on each other.
    The fruit is declared as a banana via independent contribution of these features.
    Due to this independence assumption, NB algorithm is called Naïve.


    There are three steps involved in manually implementing NB:


    1. Create a frequency table as shown below:


    | | Yes | No |

    |---|---|---|

    | Overweight | 3 | 1 |

    | Normal | 1 | 3 |

    | Underweight | 0 | 4 |

    | **Total** | **4** | **8** |


    2. Calculate the Class/Event Prior Probability:

    `P(A)` when Diabetic (Yes) = 4/12 = 0.33

    `P(A)` when Diabetic (No) = 8/12 = 0.67


    Finally let’s find the prior probability of the features:

    `P(B)` when Overweight = 4/12 = 0.33

    `P(B)` when Normal = 4/12 = 0.33

    `P(B)` when Underweight = 4/12 = 0.33


    3. Now if a patient comes, we have to find whether he is diabetic depending upon
    his weight. There can be two outcomes: diabetic or not. We will find probabilities
    for both. The class that results in higher probability will be assigned to the
    patient.


    Suppose an overweight patient arrives to the clinic and we have to test him for
    diabetes. We need to solve two equations:


    a) `P(Yes|Overweight) = P(Overweight|Yes) * P(Yes) / P(Overweight)`

    = (0.75 * 0.33) / 0.33 = 0.75


    b) `P(No|Overweight) = P(Overweight|No) * P(No) / P(Overweight)`

    = (0.125 * 0.67) / 0.33 = 0.25


    You can see that probability of being diabetic when overweight is 0.75 which is
    greater than probability of not being diabetic which is 0.25, therefore NB algorithm
    will classify this patient as diabetic.


    In the above case there was only one attribute, in case of multiple attributes,
    the probability can be calculated as:


    `P(A|B) = P(B1|A) * P(B2|A) * P(B3|A) …….. P(BN|A) * P (A)`


    ### Advantages of Naïve Bayes Algorithm


    1. NB algorithm is very simple and fast to train since no complex mathematics
    and error correction or back propagation is involved.

    2. NB algorithms outperform most of the other algorithms in case of categorical
    data. For numeric features, NB algorithm assumes normal distribution.


    ### Disadvantages of Naïve Bayes Algorithm


    1. In real world data, features are mostly dependent on other features. The independence
    assumption of NB algorithm makes it a bad predictor for datasets with interdependent
    features.

