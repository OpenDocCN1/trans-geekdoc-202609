    \n### 创建字典\n\n```\ncars = {'name':'Honda', 'model':2013, 'color':'Yellow', 'Air\
    \ bags': True}\n\ntype(cars)\n```\n\n在上面的脚本中，我们创建了一个包含 4 个元素的字典 `cars`。然后我们使用\
    \ `type` 函数来确认 `cars` 变量的类型，返回‘dict’。\n\n### 访问字典项\n\n可以通过将键作为索引来访问字典中的项。请看下面的示例。\n\
    \n```\ncars = {'name':'Honda', 'model':2013, 'color':'Yellow', 'Air bags': True}\n\
    \nmodel = cars['model'] \n\nprint(model)\n```\n\n在上面的脚本中，通过将键作为索引值，访问了键为‘model’的项的值。你将在输出中看到\
    \ 2013。\n\n你也可以像下面所示，使用 `keys` 和 `values` 函数来访问字典中的所有的键和值：\n\n```\ncars = {'name':'Honda',\
    \ 'model':2013, 'color':'Yellow', 'Air bags': True} \n\nprint(cars.keys()) # 访问字典的键\n\
    \nprint(cars.values()) # 访问字典的值\n```\n\n上述脚本的输出如下：\n\n![](img/image00369.jpeg)\n\
    \n你还可以使用 `items` 函数以键值对的形式从字典中获取项。请看下面的示例：\n\n```\ncars = {'name':'Honda', 'model':2013,\
    \ 'color':'Yellow', 'Air bags': True} \n\nprint(cars.items()) # 访问字典的项\n```\n\n\
    上述脚本的输出如下：\n\n![](img/image00370.jpeg)\n\n### 遍历字典项、键和值\n\n`items`、`keys` 和 `values`\
    \ 函数返回可以使用 `for` 循环迭代的序列。请看下面的示例：\n\n```\ncars = {'name':'Honda', 'model':2013,\
    \ 'color':'Yellow', 'Air bags': True} \n\nfor item in cars.items():\n    print(item)\n\
    ```\n\n上述脚本的输出如下：\n\n![](img/image00371.jpeg)\n\n同样，也可以像下面的示例所示，使用 `for` 循环遍历键和值：\n\
    \n```\ncars = {'name':'Honda', 'model':2013, 'color':'Yellow', 'Air bags': True}\
    \ \n\nfor key in cars.keys():\n    print(key)\n```\n\n输出：\n\n![](img/image00372.jpeg)\n\
    \n值也是如此：\n\n```\ncars = {'name':'Honda', 'model':2013, 'color':'Yellow', 'Air\
    \ bags': True} \n\nfor value in cars.values():\n    print(value)\n```\n\n输出：\n\
    \n![](img/image00373.jpeg)\n\n### 向字典添加项\n\n向字典中添加新项非常简单。你只需要传递一个新的键即可。请看下面的示例：\n\
    \n```\ncars = {'name':'Honda', 'model':2013, 'color':'Yellow', 'Air bags': True}\n\
    \ncars['capacity'] = 500\n\nprint(cars)\n```\n\n在上面的脚本中，我们创建了一个包含 4 个元素的字典 `cars`。然后打印了该字典。接着向字典中添加了新项。你会看到字典包含了\
    \ 5 个元素。\n\n/image00374.jpeg\n\n### 更新字典\n\n要更新字典，将要更新的键作为索引并赋予新值。下面的示例显示：\n\n\
    ```\ncars = {'name':'Honda', 'model':2013, 'color':'Yellow', 'Air bags': True}\n\
    \ncars['model'] = 2015\n\nprint(cars)\n```\n\n在上面的脚本中，我们在更新键为‘model’的项之前之后打印了字典。\n\
    \n/image00375.jpeg)\n\n### 删除字典项\n\n和列表一样，可以使用 `del` 函数从字典中删除项。请看下面的示例：\n\n```\n\
    cars = {'name':'Honda', 'model':2013, 'color':'Yellow', 'Air bags': True}\n\n\
    del cars['model']\n\nprint(cars)\n```\n\n在上面的脚本中，我们删除了键为‘model’的项，并打印了字典。你也可以使用\
    \ `clear` 函数删除字典中的所有项。下面的示例显示了：\n\n```\ncars = {'name':'Honda', 'model':2013,\
    \ 'color':'Yellow', 'Air bags': True}\n\ncars.clear()\n\nprint(cars)\n```\n\n\
    输出如下：\n\n/image00376.jpeg)\n\n### 查找字典长度\n\n和元组和列表一样，可以使用 `len` 函数找到字典的长度。请看下面的示例：\n\
    \n```\ncars = {'name':'Honda', 'model':2013, 'color':'Yellow', 'Air bags': True}\n\
    \nprint(len(cars))\n```\n\n上述脚本返回 4，因为 `cars` 字典中有 4 个元素。\n\n### 检查字典中的项\n\n要检查字典中是否存在某个键，可以使用\
    \ `in` 和 `not in` 方法。请看下面的脚本：\n\n```\ncars = {'name':'Honda', 'model':2013, 'color':'Yellow',\
    \ 'Air bags': True}\n\nprint('color' in cars)\n\nprint('model' not in cars)\n\
    ```\n\n在上面的脚本中，由于 `color` 存在于字典中，`in` 运算符返回 true。然而由于 `model` 也存在于字典中，`not in`\
    \ 运算符返回 false。输出如下：\n\n/image00377.jpeg)\n\n### 复制字典\n\n要将一个字典复制到另一个字典，可以使用 `copy`\
    \ 函数。请看下面的示例：\n\n```\ncars = {'name':'Honda', 'model':2013, 'color':'Yellow',\
    \ 'Air bags': True}\n\ncars2 = cars.copy()\n\nprint(cars2)\n```\n\n在上面的脚本中，我们创建了一个包含\
    \ 4 个元素的字典 `cars`。然后将此字典复制到另一个字典 `cars2` 中。新创建的字典随后打印到控制台上。输出如下：\n\n/image00378.jpeg\n\
    \n## 接下来是什么？\n\n在本文中我们学习了列表、元组和字典，这些是 Python 中存储集合常用的数据结构。我们看到了这些集合是如何创建的，以及可以应用于它们的某些常用函数。在下一章中，我们将看到\
    \ Python 中不同类型的异常（错误）以及如何处理这些错误。编码愉快！\n\n# 第 9 章\n\n## Python 中的异常处理\n\n错误和异常是计算机程序开发过程中不可或缺的一部分。处理异常的重要性体现在这一事实：大多数软件公司都有专门的质量保证（QA）部门，负责确保最终产品没有错误。在本章中，我们将学习\
    \ Python 异常的不同类型，以及如何处理这些异常。\n\n### 什么是异常？\n\n异常是中断程序执行的事件。简单来说，当 Python 脚本遇到无法处理的情况时，它就会抛出异常。在\
    \ Python 中，异常是以对象的形式提出的。每当发生异常时，就会初始化一个包含异常信息的对象。异常在 Python 中必须被处理，否则程序将停止执行。\n\
    \n"
