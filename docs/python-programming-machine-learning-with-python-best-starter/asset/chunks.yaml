  trans: "\n在上面的脚本中，我们创建了一个包含四个属性和三个方法的 `Person` 类。这些属性为 `name`、`age`、`gender` 和 `role`，而方法为\
    \ `stand` 和 `sit`。类方法基本上是函数，但它们被定义在类体内部。需要注意的是，类方法默认将 `self` 作为第一个参数。字面量 `self`\
    \ 指向包含该方法的类。\n\n正如之前讨论的，类仅仅仅仅是蓝图，它们通过对象被具体化。一个类可以有多个对象。\n\n## 对象\n\n在 Python 中，一切都被视为对象。Python\
    \ 对象可以粗略分为两类：\n\n1- 内置对象\n2- 自定义对象\n\n### 内置对象\n\n内置对象是属于原始数据类型的对象。例如，当你将一个整数赋值给变量时，实质上在该变量中存储了一个整数对象。请看以下脚本：\n\
    \n```python\n#创建一个整数类型的对象 age\nage = 28\ntype(age)\n```\n\n在上面的脚本中，我们创建了一个整数对象并将其赋值给变量\
    \ `age`。然后我们检查 `age` 变量的类型，它返回 `int`。\n\n### 自定义对象\n\n自定义对象是实现自定义类的对象。在上一节中，我们创建了一个\
    \ `Person` 类。让我们创建一个 `Person` 类的对象。请看以下脚本：\n\n```python\nperson1 = Person()\n\
    ```\n\n要创建自定义对象，你只需要编写类名后跟一对括号，并将其赋值给一个命名实体（变量），在上面的示例中该变量为 `person1`。现在，对象 `person1`\
    \ 可以用来访问 `Person` 类的属性和方法。\n\n要访问类属性或方法，可以使用对象名后跟点运算符，以及属性或方法的名称。请看以下示例：\n\n```python\n\
    #访问属性\nf_name = person1.name\nprint(f_name)\n\n#调用方法\nperson1.stand()\n```\n\n\
    在上面的脚本中，`Person` 类的 `name` 属性通过 `person1` 对象被访问，并赋值给变量 `f_name`。随后在屏幕上打印 `f_name`\
    \ 变量。同样地，访问了 `stand` 函数，它在控制台上打印出语句“Person standing”。上面脚本的输出结果如下：\n\n![](img/image00398.jpeg)\n\
    \n### 构造函数\n\n“构造函数”是在类被实例化时执行的方法。创建类对象的过程也被称为实例化。在 Python 中，使用 `__init__` 方法来创建构造函数。请看以下示例以查看构造函数的用法。\n\
    \n```python\n#创建类 Person\nclass Person:\n  #创建构造函数\n  def __init__(self):\n  \
    \    print(\"Class object created\")\n  #创建类方法\n  def stand(self):\n      print\
    \ (\"Person standing\")\n```\n\n在上面的脚本中，我们再次创建了类 `Person`。但这次类有一个构造函数，它只是在屏幕上打印一些文本。该类还包含\
    \ `stand` 方法。\n\n现在，当你创建 `Person` 类的对象时，构造函数将执行，你会在控制屏幕看到“Class object created”。执行以下脚本：\n\
    \n```python\nperson1 = Person()\n```\n\n输出将是：\n\n![](img/image00399.jpeg)\n\n\
    ### 属性\n\n我们知道 Python 中赋值给命名实体的值实际上是一个对象。通过同样的类比，在类内部声明的属性也是对象。这意味着对象可以包含嵌套对象。让我们创建一个原始字符串类型对象并检查该对象包含哪些属性。请看以下脚本：\n\
    \n```python\n#创建一个字符串对象 message\nmessage = \"I love Python\"\n#查找 message 对象的所有属性\n\
    print(dir(message))\n```\n\n在上面的脚本中，我们创建了一个名为 `message` 的字符串对象。要找到对象的所有属性，使用了\
    \ `dir` 方法。上面脚本的输出结果如下：\n\n![](img/image00400.gif)\n\n#### 类属性 vs 实例属性\n\nPython\
    \ 类具有两种类型的属性：类属性和实例属性。实例属性特定于类的每个个体对象，并且在对象之间不共享。另一方面，类属性在类的所有实例（对象）之间共享的。\n\n\
    实例属性定义在方法内部，而类属性则定义在方法外部。请看以下示例以查看类属性和实例属性之间的区别。\n\n```python\n#创建类 Person\nclass\
    \ Person:\n  #创建类属性\n    person_count = 0\n#创建带有实例属性的方法\n  def set_details(self,\
    \ name, age, gender):\n      #初始化实例变量\n      self.name = name\n      self.age\
    \ = name\n      self.gender = name\n      #增加类变量\n      Person.person_count +=\
    \ 1\n      print(\"Details for person \" + self.name + \" have been stored\")\n\
    ```\n\n在上面的脚本中，我们像往一样创建了 `Person` 类。该类包含一个类属性 `person_count` 和一个方法 `set_details`。在\
    \ `set_details` 方法内部，三个实例属性通过作为传递给 `set_details` 方法的参数进行初始化。在方法内部，`person_count`\
    \ 属性加了 1。你在这里看到的另一个区别是，在方法内部，类属性通过类名访问，而实例属性则是通过对象访问的。\n\n```python\nperson1 =\
    \ Person()\nperson1.set_details(\"John\", 24, \"Male\")\nprint(\"Person count\
    \ \" + str(person1.person_count))\n```\n\n上面脚本的输出如下：\n\n![](img/image0401.jpeg)\n\
    \n```python\nPerson2 = Person()\nPerson2.set_details(\"Suzi\", 31, \"Female\"\
    )\nprint(\"Person count \" + str(person2.person_count))\n```\n\n上面脚本的输出如下：\n\n\
    ![](img/image0402.jpeg)\n\n从输出中可以看出，类属性 `person_count` 在实例 `person1` 和 `person2`\
    \ 之间共享，而实例属性“name”并不共享。\n\n### 属性\n\n封装是 OOP 主要构建块之一。封装指的是对类内部数据的受控访问。这种访问通过特殊方法控制。这些特殊方法通过属性与类属性绑定。\n\
    \n#### 为什么我们需要属性？\n\n在这一节中我们将学习属性。但在之前，让我们看看为什么我们需要属性。让我们创建一个名为 `Medicine` 的类，包含三个属性：`name`、`expiration_year`\
    \ 和 `expiration_month`。执行以下脚本：\n\n```python\n# 创建 类\nclass Medicine:\n  #创建 Medicine\
    \ 类构造函数\n  def __init__(self, name, expiry_year, expiry_month):\n      #初始化实例变量\n\
    \      self.name = name\n      self.expiry_year = expiry_year\n      self.expiry_month\
    \ = expiry_month\n  def getExpiryDate(self):\n      print ('The expiration date\
    \ is : '+str(self.expiry_month)+'/'+str(self.expiry_year))\n```\n\n现在让我们创建 `Medicine`\
    \ 类的一个对象。\n\n```python\nmedicine1 = Medicine(\"xyz\", 2020, 15)\n```\n\n在上面的脚本中，`Medicine`\
    \ 类的构造函数将 15 作为月份数字分配给 `expiry_month`。要查看过期日期，如下所示使用 `medicine1` 对象调用 `getExpiryDate`\
    \ 方法：\n\n```python\nmedicine1.getExpiryDate()\n```\n"
