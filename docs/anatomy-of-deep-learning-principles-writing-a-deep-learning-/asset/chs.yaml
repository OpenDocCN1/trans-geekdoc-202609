  \n上述多层 LSTM 循环神经网络的每个隐藏层的隐藏状态大小相同。为了使该多层神经网络适应不同输出值的问题，可以在多层 LSTM 循环神经单元的基础上再添加一个全连接输出层，以针对不同输出向量大小输出特定问题。以下\
  \ `LSTM_RNN` 即为这种多层循环神经网络，其中 `input_size`、`hidden_size` 和 `output_size` 分别为输入数据大小、隐藏状态大小和输出值大小，`num_layers`\
  \ 为循环神经网络的层数。\n\n```python\nfrom Layers import *\n\nclass LSTM_RNN(object):\n  \
  \  def __init__(self, input_size, hidden_size, output_size, num_layers):\n     \
  \   super(LSTM_RNN, self).__init__()\n        self.input_size = input_size\n   \
  \     self.hidden_size = hidden_size       \n        self.num_layers = num_layers\n\
  \        # 定义 LSTM 层\n        self.lstm = LSTM(input_size, hidden_size, num_layers)\n\
  \        # 定义输出层\n        self.linear = Dense(hidden_size, output_size)\n      \
  \  self.layers = [self.lstm, self.linear]\n        self._params = None\n\n    def\
  \ init_hidden(self, batch_size):\n        # 这是我们将要初始化隐藏状态的方式\n        self.h_0 =\
  \ (np.zeros((self.num_layers, batch_size, self.hidden_size)),\n                \
  \    np.zeros((self.num_layers, batch_size, self.hidden_size)))\n\n    def forward(self,\
  \ input):\n        # input: (seq_len, batch, input_size)\n        # hs_out 的形状:\
  \ [input_size, batch_size, hidden_dim]\n        # self.h_0 的形状: (a, b), 其中 a 和 b\
  \ 的形状均为\n        # (num_layers, batch_size, hidden_dim)。\n        hs_out, self.h_0\
  \ = self.lstm(input, self.h_0)\n        batch_size = input.shape[1]\n        y_pred\
  \ = self.linear(hs_out[-1].reshape(batch_size, -1))\n        return y_pred  # .reshape(batch_size,\
  \ -1)#.flatten() # view(-1)\n\n    def __call__(self, input):\n        return self.forward(input)\n\
  \n    def backward(self, dZs, input):\n        dhs = self.linear.backward(dZs)\n\
  \        dinput = self.lstm.backward(dhs, input)          \n\n    def parameters(self):\n\
  \        if self._params is None:\n            self._params = []\n            for\
  \ layer in self.layers:\n                for i, _ in enumerate(layer.params):  \n\
  \                    self._params.append([layer.params[i], layer.grads[i]])  \n\
  \        return self._params\n```\n\n下面的代码利用上述多层循环神经网络对自回归数据进行建模，其中 `ARData` 类源自\
  \ [`github.com/jessicayung/blog-code-snippets/blob/master/lstm-pytorch/generate_data.py`](https://github.com/jessicayung/blog-code-snippets/blob/master/lstm-pytorch/generate_data.py)，用于生成自回归训练数据。\n\
