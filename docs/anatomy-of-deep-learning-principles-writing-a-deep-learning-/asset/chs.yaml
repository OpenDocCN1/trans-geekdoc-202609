  \ `train()` 方法进行模型训练：\n\n```python\nnn = TwoLayerNN(2, 100, 3)\nW1, b1, W2, b2 =\
  \ nn.train(X, y)\n```\n\n```\niteration 0: loss 1.098627\n    iteration 1000: loss\
