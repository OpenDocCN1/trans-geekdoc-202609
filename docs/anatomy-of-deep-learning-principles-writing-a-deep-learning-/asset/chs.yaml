  \ valid_set, test_set = pickle.load(f, encoding='latin1')\n    return train_set,\
  \ valid_set, test_set\n\ndef draw_mnists(plt, X, indices):\n    for i, index in\
  \ enumerate(indices):\n        plt.subplot(1, 10, i+1)\n        plt.imshow(X[index].reshape(28,28),\
  \ cmap='Greys')\n        plt.axis('off')\n\ntrain_set, valid_set, test_set = read_mnist()\n\
  \ntrain_X, train_y = train_set\nvalid_X, valid_y = valid_set\ntest_X, test_y = valid_set\
  \  # 注意：原文此处赋值为 valid_set\n\nprint(train_X.dtype)\nprint(train_X.shape)\nprint(valid_X.shape)\n\
  print(np.mean(train_X[0]))\n\ndraw_mnists(plt, train_X, range(10))\nplt.show()\n\
  ```\n\n```\nfloat32\n(50000, 784)\n(10000, 784)\n0.13714226\n```\n\n![](img/file181.png)\n\
