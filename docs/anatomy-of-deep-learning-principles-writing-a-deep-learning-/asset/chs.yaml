  \n### 4.1.8 深度学习\n\n自神经网络发明以来，神经网络经历了一个辉煌、沉默、复兴的曲折发展过程……\n\n直到 2012 年，加拿大大学的团队在\
  \ ImageNet 比赛中获胜，神经网络模型再次大放异彩，使用了 6 层卷积神经网络。现代神经网络的成功主要归功于高性能并行计算硬件和大规模数据。\n\n特别是高性能\
  \ GPU，尤其是 Nvidia 的 CUDA GPU，可以执行数据密集型大规模并行计算。\n\n## 4.2 反向推导\n\n神经网络模型的训练需要损失函数关于模型参数的梯度（偏导数）。数值求导法得到的梯度（导数）只是解析梯度（导数）的近似，精度不够。更重要的问题是数值求导需要对每个模型参数施加微小扰动，然后计算整个神经网络的损失。当神经网络规模较大（层数或每层神经元数较多）时，这种前向计算损失函数的开销也相对较大。例如，使用两层神经网络识别手写数字，一个样本是\
  \ 28 × 28 = 784 个特征，使用批量梯度下降法，每个批次的样本数为 500，如果神经网络中间层有 100 个神经元，输出层有 10 个神经元。神经网络的模型参数数量为\
  \ 784 × 100 + 100 + 100 × 10 + 10 = 79510，每次参数更新需要 2 次前向计算，总共 2 × 79510 次前向计算，每次计算都需要执行矩阵乘法和加法运算，例如第一层神经元的计算\
  \ `X * W^((1))` 是 500 × 784 矩阵与 784 × 100 矩阵的乘法运算。因此，计算量与样本数、每个样本的特征数和神经网络中的神经元数成正比。为每个模型参数计算数值偏导数的过程相互独立，必须独立执行两次前向计算（包括损失函数值的计算）。因此，数值求导的代价非常大，对于深度和大规模神经网络不可行。事实上，在深度学习中，使用\
  \ GPU 等并行计算硬件来加速神经网络的前向计算和梯度计算速度。\n\n\n\n因此，实际神经网络的训练是通过链式求导法则，计算损失函数关于模型参数的解析梯度（导数）。模型的损失可以沿正向计算，然后从损失关于最终输出值的梯度开始，沿正向计算的反方向，计算每一层模型参数的梯度。\n\
  \n### 4.2.1 正向计算与反向求导\n\n神经网络是由函数运算和复合形成的复杂复合函数。每一层都可以看作是一个多输入多输出的多元向量值函数。上一层的输出作为下一层的输入；也就是说，神经网络可以看作是逐层函数的复合。\n\
  \n函数求导的链式法则告诉我们，导数的计算过程与函数值的计算过程完全相反。例如，变量 `x` 通过函数 `g` 得到函数值 `g(x)`，然后该值进入函数 `h`\
  \ 得到值 `h(g(x))`。该值持续输入函数 `k`，最终得到输出 `f(x) = k(h(g(x)))`。计算过程如下：\n\n`x → g(x) → h(g(x))\
  \ → k(h(g(x))) = f(x)`\n\n`f(x) = k(h(g(x)))` 是通过一系列函数 `g(x)`、`h(g)`、`k(h)` 的函数复合得到的。输入自变量\
  \ `x`；计算 `f(x)` 的过程是按照这个复合过程逐步进行，直到得到最终的 `f(x)`。这种“从内到外”依次通过最内层自变量，从一系列中间值得到最终函数值的过程称为**正向计算**。如果将\
  \ `g`、`h`、`k` 视为神经网络每一层的函数，这个计算过程就是神经网络从输入层沿着上一层到下一层逐层传播计算的过程。因此，正向计算在神经网络中称为**正向传播**。\n\
  \n根据链式求导法则，计算 `f` 关于 `x` 的最终导数，可以按如下方式计算：\n\n`f'(x) = k'(h) * h'(g) * g'(x)`\n\n\
  即 `f'(x)` 的计算过程被分解为一系列计算：先计算 `f` 关于 `h` 的导数，即 `f'(h) = k'(h)`，再计算 `h` 关于 `g` 的导数，即\
  \ `h'(g)`，最后计算 `g` 关于 `x` 的导数 `g'(x)`。如下所示，导数 `f'(x)` 的计算过程与函数值 `f(x)` 的计算过程方向相反，沿函数复合过程的反方向“从外到内”计算；即沿正向方向反向计算步骤：\n\
  \n`f'(h) = k'(h) → f'(g) = k'(h) * h'(g) → f'(x) = k'(h) * h'(g) * g'(x)`\n\n这种反向计算复合函数导数的过程称为**反向求导**。导数\
  \ `f'(h)=k'(h)`、`h'(g)`、`g'(x)` 的计算并非相互独立。如果先得到 `f'(h)`，在计算 `f'(g) = f'(h) * h'(g)`\
  \ 时，就无需重复计算 `f'(h)`。也就是说，如果沿着反向求导的方向，保存了 `f` 关于中间变量（如 `h`）的导数 `f'(h)`，则可以直接乘以 `h'(g)`\
  \ 得到 `f'(g)`。这避免了在计算 `f'(g)` 时重新计算 `f'(h)`。\n\n如果将 `x` 视为神经网络的输入，`g`、`h` 视为隐藏层和输出层的输出，`f(h)\
  \ = k(h)` 视为损失函数，则 `f'(h) = k'(h)` 表示损失函数关于神经网络输出 `h` 的梯度（导数）。在 `f'(h)` 的基础上，沿神经网络从输出层到隐藏层的反方向，可以依次计算损失函数关于隐藏层\
  \ `g`、输入 `x` 的梯度（导数）。\n\n如果知道损失函数关于每一层输出的梯度，如 `f'(h)`，就可以得到该层模型参数的梯度。例如，假设神经网络某一层的输入为\
  \ `x`，其输出 `a = σ(x*w + b) = σ(z)`。如果已知损失函数 `L` 关于 `a` 的导数为 `L'(a)`，则该层模型参数 `w` 的梯度为：\n\
  \n`L'(w) = L'(a) * a'(z) * z'(w) = L'(a) * σ'(z) * x`\n\n对于神经网络模型，损失函数关于每一层输出、中间变量和输入的梯度计算过程，与正向传播的计算过程恰好相反。它是先计算损失函数关于输出层输出的梯度，然后逐层向前，计算损失函数关于每一层中间变量、模型参数和该层输入的梯度。这个计算过程称为**反向传播**。\n\
  \n从简单函数构建复合函数，不仅是函数复合运算，还包括普通的加减乘除运算。无论用什么运算构建复合函数，从自变量计算函数输出的正向计算，以及函数关于中间变量和自变量的导数（梯度）的反向求导过程是相似的。我们通过一个简单的例子进一步加深对正向计算和反向求导过程的理解。\n\
  \n对于两个自变量 `x`、`y`，函数 `f(x, y) = (2*x + 3*y)² + (x - 4*y)²` 可以看作：`f(x, y) = s + t`；`s`、`t`\
  \ 可以看作：`s = u²`，`t = v²`；而 `u`、`v` 可以看作：`u = 2*x + 3*y`，`v = x - 4*y`。该函数的复合过程如图所示。\n\
  \n**图 4-24** 函数 `f(x, y) = (2*x + 3*y)² + (x - 4*y)²` 的复合过程\n\n函数 `f(x, y)` 的正向计算过程如下：\n\
  \n`x, y → u = 2*x + 3*y, v = x - 4*y → s = u², t = v² → f = s + t`\n\n函数 `f(x, y)`\
  \ 关于 `x` 的偏导数反向求导过程如下：\n\n`f'(s) = 1, f'(t) = 1 → f'(u) = f'(s)*s'(u) + f'(t)*t'(u),\
  \ f'(v) = f'(s)*s'(v) + f'(t)*t'(v) → f'(x) = f'(u)*u'(x) + f'(v)*v'(x) = (f'(s)*s'(u)\
  \ + f'(t)*t'(u))*u'(x) + (f'(s)*s'(v) + f'(t)*t'(v))*v'(x)`\n\n### 4.2.2 计算图\n\n\
  函数正向计算函数值和反向计算导数的过程可以用图形表示。对于函数 `f(x, y) = (2*x + 3*y)² + (x - 4*y)²`，其正向计算函数值按照函数匹配过程如图\
  \ 4-24 所示进行。反向求导过程恰好相反，如图 4-25 所示：\n\n**图 4-25** 函数 `f(x, y) = (2*x + 3*y)² + (x\
  \ - 4*y)²` 的反向求导计算图\n\n\n\n\n#### 反向传播计算过程分析\n\n从这个反向计算图可以看出，*f*^′^(*x*) 来自两条路径的偏导数累积：一条是从\
  \ *u* 的反向推导，另一条是从 *v* 的反向推导，即 *f*^′^(*x*) = *f*^′^(*u*)*u*^′^(*x*) + *f*^′^(*v*)*v*^′^(*x*)\
  \ = *f*^′^(*u*)，而 *f*^′^(*u*) 仅来自 *s* 的反向导数，即 *f*^′^(*u*) = *f*^′^(*s*)*s*^′^(*u*)，同理\
  \ *f*^′^(*v*) = *f*^′^(*t*)*t*^′^(*v*)。因此有：\n\n*f*^′^(*x*) = *f*^′^(*s*)*s*^′^(*u*)*u*^′^(*x*)\
  \ + *f*^′^(*t*)*t*^′^(*v*)*v*^′^(*x*)\n\n也就是说，先求 *f*^′^(*s*)，再求 *s*^′^(*u*)，再求 *u*^′^(*x*)，就可以求出\
  \ *f*^′^(*s*)*s*^′^(*u*)*u*^′^(*x*)，即沿着正向计算的反方向计算导数，*f*^′^(*t*)*t*^′^(*v*)*v*^′^(*x*)\
  \ 也是同样的反向推导过程。\n\n已知 *f*^′^(*s*) = 1，*f*^′^(*t*) = 1，*s*^′^(*u*) = 2*u*，*t*^′^(*v*)\
  \ = 2*v*，*u*^′^(*x*) = 2，*v*^′^(*x*) = 1，所以最终 *f*^′^(*x*) 为：\n\n*f*^′^(*x*) = 1\
  \ × 2*u* × 2 + 1 × 2*v* × 1\n\n#### 前馈神经网络的前向计算\n\n前馈神经网络由多层神经元组成，每层神经元接收上一层的输入\
  \ *a*^\\[*l*−1\\]，并利用神经元自身的模型参数 *w*^\\[*l*\\]、*b*^\\[*l*\\] 计算加权和 *z*^\\[*l*\\]\
  \ = *a*^\\[*l*−1\\]*w*^\\[*l*\\] + *b*^\\[*l*\\]。然后通过激活函数 *g*^\\[*l*−1\\] 生成自身的输出\
  \ *a*^\\[*l*\\]，该输出作为下一层神经元的输入，使计算结果层层传递至输出层。输出层的输出与目标值计算某种损失 ℒ(*a*^\\[*L*\\]*,\
  \ y*)。\n\n对于上述 2 层神经网络，各层神经元的加权和 *z*^\\[1\\]、*z*^\\[2\\] 和输出值 *a*^\\[1\\]、*a*^\\\
  [2\\] 可按以下顺序计算，最后计算损失函数值 ℒ(*a*^\\[2\\]*, y*)：\n\n*z*^\\[1\\] = *W*^((1))*x* + *b*^\\\
  [1\\] → *a*^\\[1\\] = *σ*(*z*^\\[1\\]) → *z*^\\[2\\] = *W*^\\[2\\]*a*^\\[1\\] +\
  \ *b*^\\[2\\] → *a*^\\[2\\] = *σ*(*z*^\\[2\\]) → ℒ(*a*^\\[2\\]*, y*)\n\n该计算过程可用图\
  \ 4-26 表示：\n\n**图 4-26 两层神经网络的前向计算过程**\n\n神经网络函数可视为其模型参数和中间变量的函数。计算损失函数对这些参数和变量的梯度（导数）过程，与计算任意复杂函数反向导数的过程相同。从最外层的损失函数开始，“由外向内”沿着神经网络函数值正向计算的反方向，依次计算这些中间变量和参数的梯度。\n\
  \n过程为：先求损失函数对输出层输出的梯度；若已得到损失函数对某层 *l* 输出的梯度，即 $\\frac{\\partial\\mathcal{L}}{\\\
  partial a^{[l]}}$，根据该层各神经元的激活函数，可得该层神经元加权和 *z*^\\[*l*\\] 的梯度 $\\frac{\\partial\\\
  mathcal{L}}{\\partial z^{[l]}}$（假设该层神经元激活函数为 *g*，即 $\\frac{\\partial\\mathcal{L}}{\\\
  partial z^{[l]}} = g'(\\frac{\\partial\\mathcal{L}}{\\partial a^{[l]}})$）；根据公式 ()，在已知\
  \ $\\frac{\\partial\\mathcal{L}}{\\partial z^{[l]}}$ 的情况下，可求出损失函数对该层模型参数 *W*^\\\
  [*l*\\] 和输入 *a*^\\[*l*−1\\] 的梯度 $\\frac{\\partial\\mathcal{L}}{\\partial W^{[l]}}$\
  \ 和 $\\frac{\\partial\\mathcal{L}}{\\partial a^{[l-1]}}$。\n\n对于上述 2 层神经网络，反向推导过程如下：\n\
  \n$$\n\\frac{\\partial\\mathcal{L}}{\\partial a^{[2]}} \\rightarrow \\frac{\\partial\\\
  mathcal{L}}{\\partial z^{[2]}} \\rightarrow \\left(\\frac{\\partial\\mathcal{L}}{\\\
  partial W^{[2]}}, \\frac{\\partial\\mathcal{L}}{\\partial b^{[2]}}, \\frac{\\partial\\\
  mathcal{L}}{\\partial a^{[1]}}\\right) \\rightarrow \\frac{\\partial\\mathcal{L}}{\\\
  partial z^{[1]}} \\rightarrow \\left(\\frac{\\partial\\mathcal{L}}{\\partial W^{[1]}},\
  \ \\frac{\\partial\\mathcal{L}}{\\partial b^{[1]}}\\right)\n$$\n\n模型各层中间变量和参数的损失函数梯度依赖于正向计算过程中的结果（如\
  \ *a*^\\[*l*\\]）。为避免重复计算这些值，可在正向计算过程中将这些结果存储在神经网络对应层中，反向推导时直接使用这些存储结果，从而避免连续重复计算，提高效率。从计算图角度看，这些中间结果可保存在计算图对应节点上。当前深度学习平台通过计算图表达神经网络的前向传播和反向推导过程，并在计算图对应节点上保存相关中间计算结果。\n\
  \n因此，计算图不仅能保证前向和反向计算的正确计算顺序，还能保存中间结果以提高计算效率。\n\n### 4.2.3 损失函数对输出的梯度\n\n反向推导首先计算损失函数对最终输出层输出的梯度，然后从输出层沿着前向传播的反方向，依次计算损失函数对各层中间变量和参数的梯度，直到输入层。\n\
  \n不同问题（回归、分类）的损失函数定义不同。下面讨论几种常见损失函数对输出层梯度的计算方法。\n\n#### 1. 二元交叉熵损失函数对输出的梯度\n\n针对二分类问题，输出层为一个逻辑回归神经元，*z*\
  \ 表示该神经元输入的加权和。该加权和通过 Sigmoid 函数产生 (0, 1) 之间的输出值 *a* = *σ*(*z*)，表示样本属于两类中某一类的概率（属于另一类的概率为\
  \ 1 − *a*）。对于输出层，本书习惯用 *f* = *a* 表示输出值，即 *f* = *σ*(*z*)，用 *y* 表示取值为 1 或 0 的目标值。\n\
  \n根据 3.5 节，二分类的交叉熵损失 *L*(*f*, *y*) = −(*y* log(*f*) + (1 − *y*) log(1 − *f*)) 对\
  \ *f* 的导数为：\n\n$$\n\\frac{\\partial L}{\\partial f} = - \\left(\\frac{y}{f} - \\\
  frac{1 - y}{1 - f}\\right) = \\frac{f - y}{f(1 - f)}\n$$\n\n而 *f* = *σ*(*z*) 对 *z*\
  \ 的导数为：\n\n$$\n\\frac{\\partial f}{\\partial z} = \\sigma(z)(1 - \\sigma(z)) = f(1\
  \ - f)\n$$\n\n因此，*L*(*f*, *y*) 对 *z* 的导数为：*f* − *y*。\n\n对于二分类问题，多个样本的交叉熵为单个样本交叉熵的均值：\n\
  \n$$\nL(F, Y) = \\frac{1}{m}\\sum_{i=1}^{m} L_i(y^{(i)}, f^{(i)}) = - \\frac{1}{m}\\\
  sum_{i=1}^{m} \\left[ y^{(i)}\\log(f^{(i)}) + (1 - y^{(i)})\\log(1 - f^{(i)}) \\\
  right]\n$$\n\n\n\n\n因此，交叉熵损失 *L*(*FF*, *YY*) 关于 *zz* 的梯度为：\n\n$$\n\\frac{\\partial\
  \ L}{\\partial FF} = \\frac{1}{m}\\frac{FF - YY}{FF(1 - FF)}\n$$\n\n$$\n\\frac{\\\
  partial FF}{\\partial ZZ} = \\sigma(ZZ)(1 - \\sigma(ZZ)) = FF(1 - FF)\n$$\n\n$$\n\
  \\frac{\\partial \\mathcal{L}}{\\partial ZZ} = \\frac{\\partial L}{\\partial ff}\\\
  frac{\\partial \\pmbf}{\\partial zz} = \\frac{1}{m}(FF - YY)\n$$\n\n目前：\n\n$$\n\\\
  begin{matrix}\nFF = \\begin{bmatrix} f^{(1)} \\\\ \\vdots \\\\ f^{(i)} \\\\ \\vdots\
  \ \\\\ f^{(m)} \\end{bmatrix} \\quad\\quad\nYY = \\begin{bmatrix} y^{(1)} \\\\ \\\
  vdots \\\\ y^{(i)} \\\\ \\vdots \\\\ y^{(m)} \\end{bmatrix} \\quad\\quad\n\\frac{\\\
  partial \\mathcal{L}}{\\partial ZZ} = \\frac{1}{m}\\begin{bmatrix} f^{(1)} - y^{(1)}\
  \ \\\\ \\vdots \\\\ f^{(i)} - y^{(i)} \\\\ \\vdots \\\\ f^{(m)} - y^{(m)} \\end{bmatrix}\n\
  \\end{matrix}\n$$\n\n需要注意的是：因为每个样本对应不同的 *z*^((*i*))，交叉熵损失 *L* 应分别对每个 *z*^((*i*))\
  \ 求导，而不是将这些导数相加。此外，上述公式中的向量乘法和除法均为逐元素操作。\n\n根据神经网络的输出 out 是加权求和表示的分数，还是 *σ* 函数的输出概率，可以写出以下计算来计算两类交叉熵损失的加权求和或输出概率的梯度。\n\
  \n```python\ndef sigmoid(x):\n    return 1 / (1 + np.exp(-x))\n\ndef binary_cross_entropy(f,\
  \ y, epsilon=1e-8):\n    # np.sum(y*np.log(f+epsilon)+ (1-y)*np.log(1-f+epsilon),\
  \ axis=1)\n    m = len(y)\n    return - (1./m)*np.sum(np.multiply(y, np.log(f+epsilon))\
  \ \\\n                           + np.multiply((1 - y), np.log(1 - f+epsilon)))\n\
  \ndef binary_cross_entropy_grad(out, y, sigmoid_out=True, epsilon=1e-8):\n    if\
  \ sigmoid_out:\n        f = out\n        grad = ((f-y)/(f*(1-f)+epsilon)) / (len(y))\n\
  \    else:\n        f = sigmoid(out)  # out is z\n        grad = (f-y)/(len(y))\n\
  \ndef binary_cross_entropy_loss_grad(out, y, sigmoid_out=True, epsilon=1e-8):\n\
  \    if sigmoid_out:\n        f = out\n        grad = ((f-y)/(f*(1-f)+epsilon))\
  \ / (len(y))\n    else:\n        f = sigmoid(out)  # out is z\n        grad = (f-y)/(len(y))\n\
  \    loss = binary_cross_entropy(f, y, epsilon)\n    return loss, grad\n```\n\n\
  ```python\nz = np.array([-4, 5, 2])   # 三个样本对应的分类分数\nf = sigmoid(z)            \
  \ # 三个样本对应的分类 1 的概率\ny = np.array([0, 1, 0])    # 3 个样本对应的分类\n\nloss, grad = binary_cross_entropy_loss_grad(z,\
  \ y, False)\nprint(loss, grad)\nloss, grad = binary_cross_entropy_loss_grad(f, y)\n\
  print(loss, grad)\n```\n\n```\n0.7172643944362687 [0.0059954 -0.00223095 0.29359903]\n\
  0.7172643944362687 [0.33943835 -0.33557881 2.79635177]\n```\n\n#### 2. 均方误差损失函数在输出端的梯度\n\
  \n对于回归问题，输出层为一个或多个线性回归神经元，即每个神经元直接输出其输入的加权和 *z*[*i*]，输出层中多个神经元输出的这些值组成一个输出向量 *zz*\
  \ = (*z*[1], *z*[2], ..., *z*[*K*]) 作为整个输出层的输出 *ff* = *zz*。当 K>1 时，目标值为同等大小的向量 *yy*\
  \ = (*y*[1], *y*[2], ..., *y*[*K*])。\n\n对于一个样本，可用输出向量 *zz* 与目标值向量 *yy* 之间欧氏距离的平方作为误差\
  \ ‖(*ff*^((*i*)) − *yy*^((*i*)))‖₂²。为了使导数（梯度）形式更简洁，通常乘以一个常数，即用 $\\frac{1}{2}{\\\
  parallel (ff^{(i)} - yy^{(i)}) \\parallel_2}^{2}$ 作为误差。该误差关于 *ff*^((*i*)) 的梯度为 *ff*^((*i*))\
  \ − *yy*^((*i*))。\n\n若输出值维度为 K，则：\n\n$$\n\\frac{1}{2}{\\parallel (ff^{(i)} - yy^{(i)})\
  \ \\parallel_2}^{2} = \\frac{1}{2}\\sum_{k=1}^{K}{(f_k^{(i)} - y_k^{(i)})}^{2}\n\
  $$\n\n误差关于 *f*^((*i*)) 的梯度为 (*f*[1]^((*i*)) − *y*[1]^((*i*)), *f*[1]^((*i*)) − *y*[2]^((*i*)),\
  \ ⋯, *f*[*K*]^((*i*)) − *y*[*K*]^((*i*))) = *f*^((*i*)) − *y*^((*i*))。\n\n对于由多个样本组成的矩阵\
  \ *FF*, *YY*，均方误差 $L(FF, YY) = \\frac{1}{2m}\\sum_{i=1}^{m}{\\parallel (ff^{(i)}\
  \ - yy^{(i)}) \\parallel_2}^{2}$。*FF* 的梯度为 $\\frac{1}{m}(FF - YY)$。因为 *FF* = *ZZ*，即：\n\
  \n$$\n\\frac{\\partial \\mathcal{L}}{\\partial ZZ} = \\frac{\\partial \\mathcal{L}}{\\\
  partial FF} = \\frac{1}{m}(FF - YY)\n$$\n\n```python\ndef mse_loss_grad(f, y):\n\
  \    m = len(f)\n    loss = (1./m)*np.sum((f-y)**2)  # np.square(f-y))\n    grad\
  \ = (2./m)*(f-y)\n    return loss, grad\n```\n\n#### 3. 多分类交叉熵损失函数在输出端的梯度\n\n对于多分类问题，神经网络通过最后的\
  \ softmax 函数将上一层的输出转化为具有直观含义的概率，表示样本属于各个类别的概率。由于 softmax 神经元不包含任何模型参数，有时 softmax\
  \ 不作为神经网络的最后一层，而是将上一层作为神经网络的最后输出层。无论采用哪种方案，通常都在最后计算 softmax 回归中的多分类交叉熵损失。通常采用后一种方案，即假设输出层输出分数而非概率。该输出层的神经元为线性回归神经元，直接输出其输入的加权和作为激活值，即\
  \ *f*[*i*] = *a*[*i*]^((*L*)) = *z*[*i*]^((*L*))（假设这是一个 L 层神经网络，该输出层的序号为 L）。\n\n\
  设输出层的输出 *zz* 经 softmax 函数产生输出 *ff*，再与目标值 *yy* 计算交叉熵损失 *L*(*ff*, *yy*)。\n\n对于多个样本，输出层的输出可写为矩阵\
  \ *ZZ* = (*zz*[1], ⋯, *zz*[*i*], ⋯, *zz*[*m*])^(*T*)，经 softmax 函数产生的输出也为表示概率的矩阵\
  \ *FF* = (*ff*, ⋯, *ff*[*i*], ⋯, *ff*[*m*])^(*T*)。根据第 3.6 节)，若每个目标值 *yy*[*i*] 使用独热向量表示，则\
  \ *YY* 也是一个矩阵。此时，多分类交叉熵损失 *L*(*F*, *Y*) 关于 *ZZ* 的梯度为：$\\frac{1}{m}(FF - YY)$。\n\n\
  若每个目标值 *yy*[*i*] 为整数，表示样本所属类别的下标，则多分类交叉熵损失 *L*(*F*, *Y*) 关于 *ZZ* 的梯度为：$\\frac{1}{m}(FF\
  \ - I_i I_i)$。其中 *I*[*i*]*I*[*i*] 的每一行为独热向量，即将样本对应的整数转换为独热向量，因此 *I*[*i*]*I*[*i*]\
  \ 由 *I*[*i*]*I*[*i*] 组成，与上述独热向量 $\\pmb{Y}$ 相同。\n\n以下 Python 代码将整数值的目标向量转换为独热向量矩阵：\n\
  \n```python\nI_i = np.zeros_like(Z)\nI_i[np.arange(len(Z)), Y] = 1\n```\n\n可以看出，回归的欧氏损失、二分类的交叉熵损失函数、多分类的交叉熵损失，关于输出层\
  \ *ZZ* 的梯度惊人地一致。均为 $\\frac{1}{m}(FF - YY)$。\n\n给定多样本输出层加权和 Z 和目标值 Y，以下代码计算多分类交叉熵关于\
  \ Z 的梯度（见第 3.6 节）：\n\n\n\n\n```python\ndef softmax(x):   \n    a = np.max(x, axis=-1,\
  \ keepdims=True)  \n    e_x = np.exp(x - a)\n    return e_x / np.sum(e_x, axis=-1,\
  \ keepdims=True)\n\ndef cross_entropy_grad(Z, Y, onehot=False, softmax_out=False):\
  \  \n    if softmax_out:\n        F = Z\n    else:\n        F = softmax(Z)\n   \
  \ if onehot:\n        dZ = (F - Y) / len(Z)\n    else:\n        m = len(Y)\n   \
  \     dZ = F.copy()\n        dZ[np.arange(m), Y] -= 1\n        dZ /= m\n       \
  \ # I_i = np.zeros_like(Z)\n        # I_i[np.arange(len(Z)), Y] = 1    \n      \
  \  # return (F - I_i) / len(Z)  # Z.shape[0]\n    return dZ\n```\n\n### 4.2.4 两层神经网络反向传播的推导\n\
  \n#### 1. 单样本的逆向推导\n\n反向传播推导算法根据神经网络前向传播的逆向计算，计算损失函数关于每一层相关变量的梯度。输出层加权和关于损失函数的梯度\
  \ $\\frac{\\partial\\mathcal{L}}{\\partial z^{[L]} z^{[L]}}$ 之前已经得到，现在讨论如何根据层加权和\
  \ $z^{[l]}z^{[l]}$ 的梯度，求出损失在该层变量 $W^{[l]}W^{[l]}$、$b^{[l]}b^{[l]}$、$a^{[l-1]}a^{[l-1]}$\
  \ 上的梯度 $\\frac{\\partial\\mathcal{L}}{\\partial z^{[l]} z^{[l]}}$。\n\n对于两层神经网络，如何求得\
  \ $\\frac{\\partial\\mathcal{L}}{\\partial W^{[2]} W^{[2]}},\\frac{\\partial\\mathcal{L}}{\\\
  partial b^{[2]} b^{[2]}},\\frac{\\partial\\mathcal{L}}{\\partial a^{[1]} a^{[1]}}$？\n\
  \n$\\mathcal{L}$ 是 $z^{[2]}z^{[2]}$ = ($z_1^{[2]}$, $z_2^{[2]}$, $z_3^{[2]}$) 的函数，且\
  \ $z^{[2]}z^{[2]}$ = $a^{[1]}a^{[1]}$$W^{[2]}$$W^{[2]}$ + $b$$b^{[2]}$，即 $z^{[2]}z^{[2]}$\
  \ 是 $a^{[1]}a^{[1]}$、$W^{[2]}$$W^{[2]}$、$b^{[2]}$ 的函数。\n\n$$\n\\begin{matrix} \n\
  z^{[2]} & {= (z_1^{[2]},z_2^{[2]},z_3^{[2]}) = (a_1^{[1]},a_2^{[1]},a_3^{[1]},a_4^{[1]})\\\
  begin{bmatrix} W_{11}^{(2)} & W_{12}^{(2)} & W_{13}^{(2)} \\\\ W_{21}^{(2)} & W_{22}^{(2)}\
  \ & W_{23}^{(2)} \\\\ W_{31}^{(2)} & W_{32}^{(2)} & W_{34}^{(2)} \\\\ W_{41}^{(2)}\
  \ & W_{42}^{(2)} & W_{44}^{(2)} \\\\ \\end{bmatrix} + (b_1^{[2]},b_2^{[2]},b_3^{[2]})}\
  \ \\\\ \n& {= (a_1^{[1]}W_{11}^{(2)} + a_2^{[1]}W_{21}^{(2)} + a_3^{[1]}W_{31}^{(2)}\
  \ + a_4^{[1]}W_{41}^{(2)} + b_1^{[2]},} \\\\ \n& {\\quad a_1^{[1]}W_{12}^{(2)} +\
  \ a_2^{[1]}W_{22}^{(2)} + a_3^{[1]}W_{32}^{(2)} + a_4^{[1]}W_{42}^{(2)} + b_1^{[2]}}\
  \ \\\\ \n& {\\quad a_1^{[1]}W_{13}^{(2)} + a_2^{[1]}W_{23}^{(2)} + a_3^{[1]}W_{33}^{(2)}\
  \ + a_4^{[1]}W_{43}^{(2)} + b_1^{[2]})} \\\\ \n\\end{matrix}\n$$\n\n根据链式求导法则，有：\n\
  \n$$\n\\frac{\\partial\\mathcal{L}}{\\partial a_1^{[1]}} = \\frac{\\partial\\mathcal{L}}{\\\
  partial z_1^{[2]}}\\frac{\\partial z_1^{[2]}}{\\partial a_1^{[1]}} + \\frac{\\partial\\\
  mathcal{L}}{\\partial z_2^{[2]}}\\frac{\\partial z_2^{[2]}}{\\partial a_1^{[1]}}\
  \ + \\frac{\\partial\\mathcal{L}}{\\partial z_3^{[2]}}\\frac{\\partial z_3^{[2]}}{\\\
  partial a_1^{[1]}} = \\frac{\\partial\\mathcal{L}}{\\partial z_1^{[2]}}W_{11}^{[2]}\
  \ + \\frac{\\partial\\mathcal{L}}{\\partial z_2^{[2]}}W_{12}^{[2]} + \\frac{\\partial\\\
  mathcal{L}}{\\partial z_2^{[2]}}W_{13}^{[2]}\n$$\n\n$$\n\\frac{\\partial\\mathcal{L}}{\\\
  partial a_2^{[1]}} = \\frac{\\partial\\mathcal{L}}{\\partial z_1^{[2]}}\\frac{\\\
  partial z_1^{[2]}}{\\partial a_2^{[1]}} + \\frac{\\partial\\mathcal{L}}{\\partial\
  \ z_2^{[2]}}\\frac{\\partial z_2^{[2]}}{\\partial a_2^{[1]}} + \\frac{\\partial\\\
  mathcal{L}}{\\partial z_3^{[2]}}\\frac{\\partial z_3^{[2]}}{\\partial a_2^{[1]}}\
  \ = \\frac{\\partial\\mathcal{L}}{\\partial z_1^{[2]}}W_{21}^{[2]} + \\frac{\\partial\\\
  mathcal{L}}{\\partial z_2^{[2]}}W_{22}^{[2]} + \\frac{\\partial\\mathcal{L}}{\\\
  partial z_2^{[2]}}W_{23}^{[2]}\n$$\n\n$$\n\\frac{\\partial\\mathcal{L}}{\\partial\
  \ a_3^{[1]}} = \\frac{\\partial\\mathcal{L}}{\\partial z_1^{[2]}}\\frac{\\partial\
  \ z_1^{[2]}}{\\partial a_3^{[1]}} + \\frac{\\partial\\mathcal{L}}{\\partial z_2^{[2]}}\\\
  frac{\\partial z_2^{[2]}}{\\partial a_3^{[1]}} + \\frac{\\partial\\mathcal{L}}{\\\
  partial z_3^{[2]}}\\frac{\\partial z_3^{[2]}}{\\partial a_3^{[1]}} = \\frac{\\partial\\\
  mathcal{L}}{\\partial z_1^{[2]}}W_{31}^{[2]} + \\frac{\\partial\\mathcal{L}}{\\\
  partial z_2^{[2]}}W_{32}^{[2]} + \\frac{\\partial\\mathcal{L}}{\\partial z_2^{[2]}}W_{33}^{[2]}\n\
  $$\n\n$$\n\\frac{\\partial\\mathcal{L}}{\\partial a_4^{[1]}} = \\frac{\\partial\\\
  mathcal{L}}{\\partial z_1^{[2]}}\\frac{\\partial z_1^{[2]}}{\\partial a_4^{[1]}}\
  \ + \\frac{\\partial\\mathcal{L}}{\\partial z_2^{[2]}}\\frac{\\partial z_2^{[2]}}{\\\
  partial a_4^{[1]}} + \\frac{\\partial\\mathcal{L}}{\\partial z_3^{[2]}}\\frac{\\\
  partial z_3^{[2]}}{\\partial a_4^{[1]}} = \\frac{\\partial\\mathcal{L}}{\\partial\
  \ z_1^{[2]}}W_{41}^{[2]} + \\frac{\\partial\\mathcal{L}}{\\partial z_2^{[2]}}W_{42}^{[2]}\
  \ + \\frac{\\partial\\mathcal{L}}{\\partial z_2^{[2]}}W_{43}^{[2]}\n$$\n\n因此：\n\n\
  $$\n\\begin{matrix} \n{\\frac{\\partial\\mathcal{L}}{\\partial a^{[1]}} = (\\frac{\\\
  partial\\mathcal{L}}{\\partial a_1^{[1]}},\\frac{\\partial\\mathcal{L}}{\\partial\
  \ a_2^{[1]}},\\frac{\\partial\\mathcal{L}}{\\partial a_3^{[1]}},\\frac{\\partial\\\
  mathcal{L}}{\\partial a_3^{[1]}}) = (\\frac{\\partial\\mathcal{L}}{\\partial z_1^{[2]}},\\\
  frac{\\partial\\mathcal{L}}{\\partial z_2^{[2]}},\\frac{\\partial\\mathcal{L}}{\\\
  partial z_3^{[2]}})\\begin{bmatrix} W_{11}^{(2)} & W_{21}^{(2)} & W_{31}^{(2)} &\
  \ W_{41}^{(2)} \\\\ W_{12}^{(2)} & W_{22}^{(2)} & W_{32}^{(2)} & W_{42}^{(2)} \\\
  \\ W_{13}^{(2)} & W_{23}^{(2)} & W_{33}^{(2)} & W_{43}^{(2)} \\\\ \\end{bmatrix}\
  \ = \\frac{\\partial\\mathcal{L}}{\\partial z^{[2]}}W^{[2]^T}} \\\\ \n\\end{matrix}\n\
  $$\n\n同理：\n\n\n\n\n\n##### 反向传播梯度推导\n\n###### 输出层（第 2 层）权重梯度\n\n$$\n\\frac{\\partial\\\
  mathcal{L}}{\\partial W_{11}^{[2]}} = \\frac{\\partial\\mathcal{L}}{\\partial z_{1}^{[2]}}\\\
  frac{\\partial z_{1}^{[2]}}{\\partial W_{11}^{[2]}} + \\frac{\\partial\\mathcal{L}}{\\\
  partial z_{2}^{[2]}}\\frac{\\partial z_{2}^{[2]}}{\\partial W_{11}^{[2]}} + \\frac{\\\
  partial\\mathcal{L}}{\\partial z_{3}^{[2]}}\\frac{\\partial z_{3}^{[2]}}{\\partial\
  \ W_{11}^{[2]}} = \\frac{\\partial\\mathcal{L}}{\\partial z_{1}^{[2]}}\\frac{\\\
  partial z_{1}^{[2]}}{\\partial W_{11}^{[2]}} + 0 + 0 = \\frac{\\partial\\mathcal{L}}{\\\
  partial z_{1}^{[2]}}\\frac{\\partial z_{1}^{[2]}}{\\partial W_{11}^{[2]}} = \\frac{\\\
  partial\\mathcal{L}}{\\partial z_{1}^{[2]}}a_{1}^{[1]}\n$$\n\n这是因为 `W[11]^[2]` 仅与\
  \ `z[1]^[2]` 相关，`z[2]^[2]` 和 `z[3]^[2]` 不依赖于 `W[11]^[2]`，所以后两个偏导数均为 0。因为 `W^[2]`\
  \ 的第 i 列仅贡献给 `z[i]^[2]`（即只有 `z[i]^[2]` 依赖于 `W^[2]` 的第 i 列），所以：\n\n$$\n\\frac{\\\
  partial\\mathcal{L}}{\\partial W_{i1}^{[2]}} = \\frac{\\partial\\mathcal{L}}{\\\
  partial z_{1}^{[2]}}a_{i}^{[1]}\n$$\n\n$$\n\\frac{\\partial\\mathcal{L}}{\\partial\
  \ W_{i2}^{[2]}} = \\frac{\\partial\\mathcal{L}}{\\partial z_{2}^{[2]}}a_{i}^{[1]}\n\
  $$\n\n$$\n\\frac{\\partial\\mathcal{L}}{\\partial W_{i3}^{[2]}} = \\frac{\\partial\\\
  mathcal{L}}{\\partial z_{3}^{[2]}}a_{i}^{[1]}\n$$\n\n###### 矩阵形式\n\n$$\n\\frac{\\\
  partial\\mathcal{L}}{\\partial W^{[2]}} =\n\\begin{bmatrix}\n\\frac{\\partial\\\
  mathcal{L}}{\\partial W_{11}^{[2]}} & \\frac{\\partial\\mathcal{L}}{\\partial W_{12}^{[2]}}\
  \ & \\frac{\\partial\\mathcal{L}}{\\partial W_{13}^{[2]}} \\\\\n\\frac{\\partial\\\
  mathcal{L}}{\\partial W_{21}^{[2]}} & \\frac{\\partial\\mathcal{L}}{\\partial W_{22}^{[2]}}\
  \ & \\frac{\\partial\\mathcal{L}}{\\partial W_{23}^{[2]}} \\\\\n\\frac{\\partial\\\
  mathcal{L}}{\\partial W_{31}^{[2]}} & \\frac{\\partial\\mathcal{L}}{\\partial W_{32}^{[2]}}\
  \ & \\frac{\\partial\\mathcal{L}}{\\partial W_{33}^{[2]}} \\\\\n\\frac{\\partial\\\
  mathcal{L}}{\\partial W_{41}^{[2]}} & \\frac{\\partial\\mathcal{L}}{\\partial W_{42}^{[2]}}\
  \ & \\frac{\\partial\\mathcal{L}}{\\partial W_{43}^{[2]}}\n\\end{bmatrix}\n=\n\\\
  begin{bmatrix}\n\\frac{\\partial\\mathcal{L}}{\\partial z_{1}^{[2]}}a_{1}^{[1]}\
  \ & \\frac{\\partial\\mathcal{L}}{\\partial z_{2}^{[2]}}a_{1}^{[1]} & \\frac{\\\
  partial\\mathcal{L}}{\\partial z_{3}^{[2]}}a_{1}^{[1]} \\\\\n\\frac{\\partial\\\
  mathcal{L}}{\\partial z_{1}^{[2]}}a_{2}^{[1]} & \\frac{\\partial\\mathcal{L}}{\\\
  partial z_{2}^{[2]}}a_{2}^{[1]} & \\frac{\\partial\\mathcal{L}}{\\partial z_{3}^{[2]}}a_{2}^{[1]}\
  \ \\\\\n\\frac{\\partial\\mathcal{L}}{\\partial z_{1}^{[2]}}a_{3}^{[1]} & \\frac{\\\
  partial\\mathcal{L}}{\\partial z_{2}^{[2]}}a_{3}^{[1]} & \\frac{\\partial\\mathcal{L}}{\\\
  partial z_{3}^{[2]}}a_{3}^{[1]} \\\\\n\\frac{\\partial\\mathcal{L}}{\\partial z_{1}^{[2]}}a_{4}^{[1]}\
  \ & \\frac{\\partial\\mathcal{L}}{\\partial z_{2}^{[2]}}a_{4}^{[1]} & \\frac{\\\
  partial\\mathcal{L}}{\\partial z_{3}^{[2]}}a_{4}^{[1]}\n\\end{bmatrix}\n=\n\\begin{bmatrix}\n\
  a_{1}^{[1]} \\\\\na_{2}^{[1]} \\\\\na_{3}^{[1]} \\\\\na_{4}^{[1]}\n\\end{bmatrix}\n\
  \\begin{bmatrix}\n\\frac{\\partial\\mathcal{L}}{\\partial z_{1}^{[2]}} & \\frac{\\\
  partial\\mathcal{L}}{\\partial z_{2}^{[2]}} & \\frac{\\partial\\mathcal{L}}{\\partial\
  \ z_{3}^{[2]}}\n\\end{bmatrix}\n= {a^{[1]}}^T \\frac{\\partial\\mathcal{L}}{\\partial\
  \ z^{[2]}}\n$$\n\n###### 输出层偏置梯度\n\n显然：\n\n$$\n\\frac{\\partial\\mathcal{L}}{\\\
  partial b^{[2]}} = \\left(\\frac{\\partial\\mathcal{L}}{\\partial b_{1}^{[2]}},\\\
  frac{\\partial\\mathcal{L}}{\\partial b_{2}^{[2]}},\\frac{\\partial\\mathcal{L}}{\\\
  partial b_{3}^{[2]}}\\right) = \\left(\\frac{\\partial\\mathcal{L}}{\\partial z_{1}^{[2]}},\\\
  frac{\\partial\\mathcal{L}}{\\partial z_{2}^{[2]}},\\frac{\\partial\\mathcal{L}}{\\\
  partial z_{3}^{[2]}}\\right) = \\frac{\\partial\\mathcal{L}}{\\partial z^{[2]}}\n\
  $$\n\n至此，已获得第 l=2 层所有变量 `W^[2]`、`b^[2]`、`a^[1]` 的损失函数梯度。\n\n###### 隐藏层（第 1 层）梯度推导\n\
  \n因为 `a^[1] = g(z^[1])`，即\n\n$$\na^{[1]} = (a_{1}^{[1]}, a_{2}^{[1]}, a_{3}^{[1]},\
  \ a_{4}^{[1]}) = (g(z_{1}^{[1]}), g(z_{2}^{[1]}), g(z_{3}^{[1]}), g(z_{4}^{[1]}))\
  \ = g(z^{[1]})\n$$\n\n所以：\n\n$$\n\\frac{\\partial\\mathcal{L}}{\\partial z^{[1]}}\
  \ = \\left(\\frac{\\partial\\mathcal{L}}{\\partial a_{1}^{[1]}}g'(z_{1}^{[1]}),\
  \ \\frac{\\partial\\mathcal{L}}{\\partial a_{2}^{[1]}}g'(z_{2}^{[1]}), \\frac{\\\
  partial\\mathcal{L}}{\\partial a_{3}^{[1]}}g'(z_{3}^{[1]}), \\frac{\\partial\\mathcal{L}}{\\\
  partial a_{4}^{[1]}}g'(z_{4}^{[1]})\\right) = \\frac{\\partial\\mathcal{L}}{\\partial\
  \ a^{[1]}} \\odot g'(z^{[1]})\n$$\n\n根据上述相同的推导过程，可以得到：\n\n$$\n\\frac{\\partial\\\
  mathcal{L}}{\\partial W^{[1]}} = {a^{[0]}}^T \\frac{\\partial\\mathcal{L}}{\\partial\
  \ z^{[1]}}\n$$\n\n$$\n\\frac{\\partial\\mathcal{L}}{\\partial b^{[1]}} = \\frac{\\\
  partial\\mathcal{L}}{\\partial z^{[1]}}\n$$\n\n借助损失函数关于 `z^[2]`、`z^[1]` 的梯度，求得损失函数关于模型参数\
  \ `W^[2]`、`b^[2]`、`W^[1]`、`b^[1]` 的梯度。\n\n因此，从损失函数关于输出层加权和的梯度 $\\frac{\\partial\\\
  mathcal{L}}{\\partial z^{[2]}}$ 出发，根据反向推导过程，获得损失函数关于各层相关变量的梯度。\n\n\n\n\n\n#######\
  \ 多样本向量化表示的反向推导\n\n正如通用机器学习一样，训练神经网络时，通常通过最小化多个样本的预测值与真实值之间的误差（损失）来求解模型参数。损失是模型参数以及中间变量（如\
  \ `a^[l]`、`z^[l]`）的函数。\n\n对于每层的非模型参数（如中间变量 `a^[l]`、`z^[l]`），不同样本具有不同的值，它们均属于不同的变量。例如\
  \ `a^l` 和 `a^l` 是第 `l` 层两个不同样本产生的不同变量。假设这些变量均以行向量形式书写，则所有样本的这些变量值可按行堆叠形成矩阵，矩阵每行对应一个样本。可用符号\
  \ `A^[l]`、`Z^[l]` 表示这些中间变量对应所有样本的矩阵，即：\n\n$$\n\\begin{matrix} \n{A^{[l]} = \\begin{bmatrix}\
  \ a^{l} \\\\ a^{l} \\\\ \\vdots \\\\ a^{l} \\end{bmatrix}\n\\quad \nZ^{[l]} = \\\
  begin{bmatrix} z^{l} \\\\ z^{l} \\\\ \\vdots \\\\ z^{l} \\end{bmatrix}} \n\\end{matrix}\n\
  $$\n\n其中 `A^[0]` 是由所有样本输入特征组成的矩阵 `X^[0]`，即：\n\n$$\n\\begin{matrix} \n{A^{[0]} =\
  \ X^{[0]} = \\begin{bmatrix} x^{(1)} \\\\ x^{(2)} \\\\ \\vdots \\\\ x^{(m)} \\end{bmatrix}}\
  \ \n\\end{matrix}\n$$\n\n即：前向传播中不同样本计算产生的各层中间变量各不相同，但共用同一组模型参数 `W^[l]`、`b^[l]`。由于多样本损失为所有样本损失的均值，多样本损失对模型参数的梯度即为所有样本对模型参数梯度的均值。例如对权重参数\
  \ `W`，若有 `m` 个样本，则：\n\n$$\n\\frac{\\partial\\mathcal{L}}{\\partial W} = \\frac{1}{m}\\\
  sum_{i = 1}^{m}\\frac{\\partial\\mathcal{L}}{\\partial W}^{(i)}\n$$\n\n通常计算损失函数对输出层\
  \ `z^[L]` 的梯度 $\\frac{\\partial\\mathcal{L}}{\\partial z^{[L]}}$ 时，已乘以均值因子 $\\frac{1}{m}$，因此模型参数梯度可直接累加：\n\
  \n$$\n\\frac{\\partial\\mathcal{L}}{\\partial W} = \\sum_{i = 1}^{m}\\frac{\\partial\\\
  mathcal{L}}{\\partial W}^{(i)}\n$$\n\n故有：\n\n$$\n\\begin{matrix} \n\\frac{\\partial\\\
  mathcal{L}}{\\partial W^{[2]}} \n{= \\sum_{i = 1}^{m}{a^{1}}^{T}\\frac{\\partial\\\
  mathcal{L}}{\\partial z^{2}} \n= \\sum_{i = 1}^{m}{a^{1}}^{T}\\frac{\\partial\\\
  mathcal{L}}{\\partial z^{2}}} \\\\ \n{= {a^{1}}^{T}\\frac{\\partial\\mathcal{L}}{\\\
  partial z^{2}} + {a^{1}}^{T}\\frac{\\partial\\mathcal{L}}{\\partial z^{2}} + \\\
  cdots + {a^{1}}^{T}\\frac{\\partial\\mathcal{L}}{\\partial z^{2}}} \\\\ \n{= \\\
  begin{bmatrix} {a^{1}}^{T} & {a^{1}}^{T} & {\\cdots{a^{1}}^{T}} \\end{bmatrix}\n\
  \\begin{bmatrix} \\frac{\\partial\\mathcal{L}}{\\partial z^{2}} \\\\ {\\frac{\\\
  partial\\mathcal{L}}{\\partial z^{2}} \\vdots} \\\\ \\frac{\\partial\\mathcal{L}}{\\\
  partial z^{2}} \\end{bmatrix}} \\\\ \n{= {A^{[1]}}^{T}\\frac{\\partial\\mathcal{L}}{\\\
  partial Z^{[2]}}} \n\\end{matrix}\n$$\n\n同理，对偏置项，将所有单样本偏导数 $\\frac{\\partial\\mathcal{L}}{\\\
  partial b^{[l]}} = \\frac{\\partial\\mathcal{L}}{\\partial z^{[l]}}$ 累加可得：\n\n$$\n\
  \\frac{\\partial\\mathcal{L}}{\\partial b^{[2]}} = \\sum_{i = 1}^{m}\\frac{\\partial\\\
  mathcal{L}}{\\partial z^{2}} = \\text{np.sum}\\left(\\frac{\\partial\\mathcal{L}}{\\\
  partial Z^{[2]}}, \\text{axis}=0, \\text{keepdims}=\\text{True}\\right)\n$$\n\n\
  即对矩阵 $\\frac{\\partial\\mathcal{L}}{\\partial Z^{[2]}}$ 所有行求和，参数 `keepdims=True`\
  \ 表示累加结果保持为二维矩阵，便于 NumPy 数组运算。\n\n与模型参数不同，不同样本的中间变量各异（不共享）。因此损失函数对中间变量的梯度相互独立。若每个样本中间变量梯度为行向量形式，则所有中间变量梯度堆叠成矩阵，矩阵每行代表一个样本的梯度。故将单样本公式\
  \ $\\frac{\\partial\\mathcal{L}}{\\partial a^{[1]}} = \\frac{\\partial\\mathcal{L}}{\\\
  partial z^{[2]}}{W^{[2]}}^{T}$ 转为向量（矩阵）形式：\n\n$$\n\\begin{matrix} \n{\\frac{\\partial\\\
  mathcal{L}}{\\partial A^{[1]}} = \\begin{bmatrix} \\frac{\\partial\\mathcal{L}}{\\\
  partial a^{1}} \\\\ {\\frac{\\partial\\mathcal{L}}{\\partial a^{1}} \\vdots} \\\\\
  \ \\frac{\\partial\\mathcal{L}}{\\partial a^{1}} \\end{bmatrix} = \\begin{bmatrix}\
  \ {\\frac{\\partial\\mathcal{L}}{\\partial z^{2}}{W^{[2]}}^{T}} \\\\ {\\frac{\\\
  partial\\mathcal{L}}{\\partial z^{2}}{W^{[2]}}^{T}} \\\\ \\vdots \\\\ {\\frac{\\\
  partial\\mathcal{L}}{\\partial z^{2}}{W^{[m]}}^{T}} \\end{bmatrix} = \\frac{\\partial\\\
  mathcal{L}}{\\partial Z^{[2]}}{W^{[2]}}^{T}} \n\\end{matrix}\n$$\n\n$$\n\\frac{\\\
  partial\\mathcal{L}}{\\partial Z^{[1]}} = \\frac{\\partial\\mathcal{L}}{\\partial\
  \ A^{[1]}} \\odot g^{[1]}(Z^{[1]})\n$$\n\n因此多样本梯度公式与单样本梯度公式形式一致：\n\n$$\n\\frac{\\\
  partial\\mathcal{L}}{\\partial W^{[2]}} = {A^{[1]}}^{T}\\frac{\\partial\\mathcal{L}}{\\\
  partial Z^{[2]}}\n$$\n\n$$\n\\frac{\\partial\\mathcal{L}}{\\partial b^{[2]}} = \\\
  text{np.sum}\\left(\\frac{\\partial\\mathcal{L}}{\\partial Z^{[2]}}, \\text{axis}=0,\
  \ \\text{keepdims}=\\text{True}\\right)\n$$\n\n\n\n\n\n####### 3. 列向量形式下的梯度计算公式\n\
  \n如果样本、中间变量及其梯度均为列向量形式，例如 `x`、`a`^(\\[1\\])、`z`^(\\[1\\])、`b`^(\\[1\\])、`a`^(\\\
  [2\\])、`z`^(\\[2\\])、`b`^(\\[2\\]) 均为列向量，且 `W`^(\\[1\\])、`W`^(\\[2\\]) 的一行对应一个神经元的权重，即：\n\
  \n`z`^(\\[1\\]) = `W`^(\\[1\\])`x` + `b`^(\\[1\\]) = `W`^(\\[1\\])`a`^(\\[0\\])\
  \ + `b`^(\\[1\\])  \n`z`^(\\[2\\]) = `W`^(\\[2\\])`a`^(\\[1\\]) + `b`^(\\[2\\])\n\
  \n则可类似推导出对应公式：\n\n**单样本形式：**\n\n$$\n\\frac{\\partial\\mathcal{L}}{\\partial W^{\\\
  lbrack 2\\rbrack}} = \\frac{\\partial\\mathcal{L}}{\\partial z^{\\lbrack 2\\rbrack}}{z^{\\\
  lbrack 1\\rbrack}}^{T} \\quad\\quad \\frac{\\partial\\mathcal{L}}{\\partial b^{\\\
  lbrack 2\\rbrack}} = \\frac{\\partial\\mathcal{L}}{\\partial z^{\\lbrack 2\\rbrack}}\
  \ \\quad\\quad \\frac{\\partial\\mathcal{L}}{\\partial a^{\\lbrack 1\\rbrack}} =\
  \ {W^{\\lbrack 2\\rbrack}}^{T}\\frac{\\partial\\mathcal{L}}{\\partial z^{\\lbrack\
  \ 2\\rbrack}}\n$$\n\n$$\n\\frac{\\partial\\mathcal{L}}{\\partial z^{\\lbrack 1\\\
  rbrack}} = \\frac{\\partial L}{\\partial z^{\\lbrack 1\\rbrack}} \\odot g^{\\prime}(z^{\\\
  lbrack 1\\rbrack}) \\quad\\quad \\frac{\\partial\\mathcal{L}}{\\partial W^{\\lbrack\
  \ 1\\rbrack}} = \\frac{\\partial\\mathcal{L}}{\\partial z^{\\lbrack 1\\rbrack}}{z^{\\\
  lbrack 0\\rbrack}}^{T} \\quad\\quad \\frac{\\partial\\mathcal{L}}{\\partial b^{\\\
  lbrack 1\\rbrack}} = \\frac{\\partial\\mathcal{L}}{\\partial z^{\\lbrack 1\\rbrack}}\n\
  $$\n\n**多样本形式：**\n\n$$\n\\frac{\\partial\\mathcal{L}}{\\partial W^{\\lbrack 2\\\
  rbrack}} = \\frac{\\partial\\mathcal{L}}{\\partial Z^{\\lbrack 2\\rbrack}}{A^{\\\
  lbrack 1\\rbrack}}^{T} \\quad\\quad \\frac{\\partial\\mathcal{L}}{\\partial b^{\\\
  lbrack 2\\rbrack}} = np.sum(\\frac{\\partial\\mathcal{L}}{\\partial Z^{\\lbrack\
  \ 2\\rbrack}}, axis = 1, keepdims = True) \\quad\\quad \\frac{\\partial\\mathcal{L}}{\\\
  partial A^{\\lbrack 1\\rbrack}} = {W^{\\lbrack 2\\rbrack}}^{T}\\frac{\\partial\\\
  mathcal{L}}{\\partial Z^{\\lbrack 2\\rbrack}}\n$$\n\n$$\n\\frac{\\partial\\mathcal{L}}{\\\
  partial Z^{\\lbrack 1\\rbrack}} = \\frac{\\partial L}{\\partial A^{\\lbrack 1\\\
  rbrack}} \\odot g^{\\prime}(Z^{\\lbrack 1\\rbrack}) \\quad\\quad \\frac{\\partial\\\
  mathcal{L}}{\\partial W^{\\lbrack 1\\rbrack}} = \\frac{\\partial\\mathcal{L}}{\\\
  partial Z^{\\lbrack 1\\rbrack}}{A^{\\lbrack 0\\rbrack}}^{T} \\quad\\quad \\frac{\\\
  partial\\mathcal{L}}{\\partial b^{\\lbrack 1\\rbrack}} = np.sum(\\frac{\\partial\\\
  mathcal{L}}{\\partial Z^{\\lbrack 1\\rbrack}}, axis = 1, keepdims = True)\n$$\n\n\
  对于包含正则项的损失函数，在计算梯度时，也会计算正则项对各模型参数的偏导数。若正则项为 $\\lambda \\parallel W W^{2} \\parallel\
  \ = \\lambda\\sum\\limits_{l}\\sum\\limits_{ij}{W W_{ij}^{\\lbrack l\\rbrack}}^{2}$，则\
  \ `W``W`[`i``j`]^(\\[`l`\\]) 的偏导数为 2`λ``W``W`[`i``j`]^(\\[`l`\\])，写成向量形式即为 2`λ``W``W`。\n\
  \n对于上述 2 层神经网络，在前向计算的基础上（即前向计算中的 `A0` 和 `A1` 已知），以下代码给出了反向推导过程（若第一层的激活函数为 Relu）：\n\
  \n```python\ndef dRelu(x):\n    return 1. * (x > 0)\n\ndZ2 = grad_softmax_crossentropy(Z2,\
  \ y)       # 计算损失函数关于输出层加权和的梯度\ndW2 = np.dot(A1.T, dZ2) + lambda * W2\ndb2 = np.sum(dZ2,\
  \ axis=0, keepdims=True)\ndA1 = np.dot(dZ2, W2.T)\n\n# dZ1 = A1 * dRelu(A1)\ndA1[A1\
  \ <= 0] = 0\ndZ1 = dA1\n\ndW1 = np.dot(X.T, dZ1) + lambda * W1\ndb1 = np.sum(dZ1,\
  \ axis=0, keepdims=True)\n```\n\n### 4.2.5 两层神经网络的 Python 实现\n\n两层神经网络包含一个输入层、一个隐藏层和一个输出层。下面的\
  \ `TwoLayerNN` 类即表示这样一个两层神经网络模型。\n\n```python\nfrom util import *\n\ndef dRelu(x):\n\
  \    return 1 * (x > 0)\n\ndef max_abs(s):\n    max_value = 0\n    for x in s:\n\
  \        max_value_ = np.max(np.abs(x))\n        if max_value_ > max_value:\n  \
  \          max_value = max_value_\n    return max_value\n\nclass TwoLayerNN:\n \
  \   def __init__(self, input_units, hidden_units, output_units):\n        # 随机初始化参数\n\
  \        n = input_units\n        h = hidden_units\n        K = output_units\n \
  \     \n        self.W1 = 0.01 * np.random.randn(n, h)\n        self.b1 = np.zeros((1,\
  \ h))\n        self.W2 = 0.01 * np.random.randn(h, K)\n        self.b2 = np.zeros((1,\
  \ K))        \n        \n    def train(self, X, y, reg=0, iterations=10000, learning_rate=1e-0,\
  \ epsilon=1e-8):\n        m = X.shape[0]\n        W1 = self.W1\n        b1 = self.b1\n\
  \        W2 = self.W2\n        b2 = self.b2        \n        \n        for i in\
  \ range(iterations):\n            # 前向计算类别得分，[N x K]\n            Z1 = np.dot(X,\
  \ W1) + b1\n            A1 = np.maximum(0, Z1)  # ReLU 激活\n            Z2 = np.dot(A1,\
  \ W2) + b2\n            \n            data_loss = softmax_cross_entropy(Z2, y)\n\
  \            reg_loss = reg * np.sum(W1 * W1) + reg * np.sum(W2 * W2)\n        \
  \    loss = data_loss + reg_loss\n            \n            if i % 1000 == 0:\n\
  \                print(\"iteration %d: loss %f\" % (i, loss))\n    \n          \
  \  # 反向传播\n            dZ2 = cross_entropy_grad(Z2, y)\n            dW2 = np.dot(A1.T,\
  \ dZ2) + 2 * reg * W2\n            db2 = np.sum(dZ2, axis=0, keepdims=True)\n  \
  \          dA1 = np.dot(dZ2, W2.T)\n            \n            dA1[A1 <= 0] = 0\n\
  \            dZ1 = dA1\n            # dZ1 = dA1 * dReLU(A1)   \n            # dZ1\
  \ = np.multiply(dA1, dRelu(A1))           \n            dW1 = np.dot(X.T, dZ1) +\
  \ 2 * reg * W1\n            db1 = np.sum(dZ1, axis=0, keepdims=True)      \n   \
  \         \n            if max_abs([dW2, db2, dW1, db1]) < epsilon:\n          \
  \      print(\"gradient is small enough at iter : \", i)\n                break\n\
  \          \n            # 执行参数更新\n            W1 += -learning_rate * dW1\n    \
  \        b1 += -learning_rate * db1\n            W2 += -learning_rate * dW2\n  \
  \          b2 += -learning_rate * db2\n            \n        return W1, b1, W2,\
  \ b2  \n    \n    def predict(self, X):\n        Z1 = np.dot(X, W1) + b1\n     \
  \   A1 = np.maximum(0, Z1)  # ReLU 激活\n        Z2 = np.dot(A1, W2) + b2\n      \
  \  return Z2\n```\n\n\n\n\n`TwoLayerNN` 的构造函数 `__init__()` 接受输入层、隐藏层和输出层的神经元数量作为参数，并初始化\
  \ 2 层神经网络的模型参数。`train()` 用于训练神经网络模型，即根据训练样本，使用梯度下降算法计算最佳模型参数，使这些训练样本的交叉熵损失最小。`train()`\
  \ 的参数包括一组训练样本 (`X`, `y`)、正则化参数 `reg` 以及梯度下降法的相关超参数（如 `iterations`、学习率 `learning_rate`\
  \ 和收敛误差）。在梯度下降法的每一步迭代中，`train()` 函数首先前向计算样本的输出值及其中间变量 (`Z1`, `A1`, `Z2`)，使用 softmax\
  \ 将得分转换为概率值并计算多分类交叉熵损失 (`data_loss`)，然后计算交叉熵损失 (`data_loss`) 关于输出层输出的梯度 `dZ2`，并反向传播以求得关于中间变量和模型参数的梯度（模型参数的梯度包含正则项关于模型参数的梯度\
  \ `2 * reg * W2`、`2 * reg * W1`）。\n\n模型的预测函数 `predict()` 根据训练好的神经网络模型预测输入数据 `X`\
  \ 的目标值，这是一个前向传播计算过程。\n\n第 2.7 节中螺旋数据集的数据特征和目标值可以用上述 2 层神经网络建模。首先生成数据集：\n\n```python\n\
