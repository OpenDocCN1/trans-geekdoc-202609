  \n## 7.11 序列到序列（seq2seq）模型\n\n序列到序列（seq2seq）模型是 Google 提出的一种用于机器翻译的深度学习模型。该模型采用编码器-解码器结构，如图\
  \ 7-50 所示。输入序列通过编码器循环神经网络生成一个上下文向量。该上下文可被视为输入序列的信息压缩或特征。此上下文向量被用作解码器初始时刻的隐藏状态输入。解码器初始时刻的输入通常是一个表示序列开始的常量。解码器基于每一时刻的状态和数据生成当前时刻的预测值和状态向量，该预测值被用作下一时刻的输入数据。解码器持续产生预测，直到遇到表示结束的预测或超过一定的时间步数。\n\
  \n图 7-50 序列到序列（seq2seq）模型的结构。输入（词）序列通过编码器循环神经网络生成 S 上下文向量，作为解码器的隐藏状态输入。解码器从初始输入（如特殊的起始词\
  \ SOS）开始，可产生一系列输出（词），直到结束词 EOS。\n\n编码器和解码器均使用循环神经网络（RNN）来处理长度可变的序列输入和输出。输入序列被输入编码器以生成一个状态变量，也称为**上下文变量（内容向量）**。解码器将此上下文变量作为其初始时刻的输入状态变量，并可生成输出序列。例如，在机器翻译中，编码器接收一种语言的输入句子（词序列），解码器输出另一种语言的句子（词序列）。seq2seq\
  \ 模型迅速扩展到了其他类似机器翻译的问题，如对话、图像描述、文本摘要、对联生成等。\n\n### 机器翻译\n\n机器翻译是将一种语言的句子（词序列）转换（翻译）为另一种语言的句子（词序列）。这种序列到序列的转换问题可以用由编码器和解码器组成的\
  \ Seq2Seq 模型来建模，如图 7-50 所示。编码器接受某一语言的句子（即词序列），该词序列长度可以任意。编码器 RNN 依次处理输入词序列的每个词，直到遇到结束词。编码器输出一个对输入句子进行编码的上下文向量。该上下文向量可以是最后一时刻的输出（如隐藏状态），也可以是每一时刻的输出（如隐藏状态）。\n\
  \n解码器接收此编码后的上下文和一个特殊的起始词，依次生成一系列词，直到遇到一个特殊的结束词。解码器的起始词和结束词是人为设定的词，例如分别使用 3 个英文字母\
  \ \"SOS\" 和 \"EOS\" 作为起始词和结束词。在机器翻译中，这种特殊的起始词和结束词通常在输入句子和翻译句子之后人为添加。\n\n在训练阶段，编码器和解码器基于预测词序列与目标词序列的误差损失进行训练。在推理阶段，解码器每次从当前词预测并采样下一个词，直到输出最终的词序列。\n\
  \n### 7.11.1 Seq2Seq 模型的实现\n\nSeq2Seq 模型由编码器和解码器两个循环神经网络组成。编码器除循环神经单元本身的隐藏状态外不输出任何信息，因此编码器主要就是循环神经网络单元本身。\n\
  \n最简单的编码器是一个输入数据序列（如词序列）并计算表示序列内容的上下文信息的循环神经网络。对于最简单的编码器，此上下文信息即为最后一时刻的隐藏状态。在每一时刻，它接受输入数据和上一时刻的隐藏状态，并计算当前时刻的隐藏状态作为当前时刻的输出。计算过程如图\
  \ 7-51 左子图所示：\n\n图 7-51 编码器接受当前时刻输入词的独热向量和上一时刻的隐藏状态，计算当前时刻的隐藏状态作为当前时刻的输出；解码器接受当前时刻输入词的独热向量和上一时刻的隐藏状态，计算当前时刻的隐藏状态，该隐藏状态通过一个线性层输出一个向量，表示词表中每个词作为下一个词的得分。\n\
  \n以下编码器 `EncoderRNN` 是一个 GRU 神经网络。它与之前的 GRU 类唯一的区别在于增加了一个辅助函数 `word2vec()`，用于将词索引序列\
  \ `word_indices_input` 转换为独热向量。`EncoderRNN` 是一个 GRU，因此其构造函数参数与 GRU 的参数相同。`input_size`\
  \ 和 `hidden_size` 分别代表输入数据的长度和隐藏状态向量的长度。\n\n```\nfrom rnn import *\n\ndef one_hot(size,\
  \ indices, expend=False):\n    x = np.eye(size)[indices.reshape(-1)]\n    if expend:\n\
  \        x = np.expand_dims(x, axis=1)\n    return x\n\nclass EncoderRNN(object):\n\
  \    def __init__(self, input_size, hidden_size, num_layers=1):\n        super(EncoderRNN,\
  \ self).__init__()\n        self.input_size, self.hidden_size = input_size, hidden_size\n\
  \        self.num_layers = num_layers\n        self.gru = GRU(input_size, hidden_size,\
  \ num_layers)\n\n    def word2vec(self, word_indices_input):\n        return one_hot(self.input_size,\
  \ word_indices_input, True)\n\n    def forward(self, word_indices_input, hidden):\n\
  \        # self.encode_input = one_hot(self.input_size, word_indices_input, True)\n\
  \        self.encode_input = self.word2vec(word_indices_input)\n        output,\
  \ hidden = self.gru(self.encode_input, hidden)\n        return output, hidden\n\n\
  \    def __call__(self, word_indices_input, hidden):\n        return self.forward(word_indices_input,\
  \ hidden)\n\n    def initHidden(self, batch_size=1):\n        return np.zeros((self.num_layers,\
  \ batch_size, self.hidden_size))\n\n    def parameters(self):\n        return self.gru.parameters()\n\
  \n    def backward(self, dhs):\n        dinput, dhidden = self.gru.backward(dhs,\
  \ self.encode_input)\n```\n\n最简单的解码器是一个循环神经网络加一个输出层。解码器接受当前时刻输入词的独热向量和上一时刻的隐藏状态，计算当前时刻的隐藏状态。该隐藏状态通过一个线性层输出一个向量，表示词表中每个词作为下一个词的得分。计算过程如图\
  \ 7-51 右子图所示。\n\n解码器 `DecoderRNN` 类的代码如下：\n\n```\nclass DecoderRNN(object):\n  \
  \  def __init__(self, input_size, hidden_size, output_size, num_layers=1, teacher_forcing_ratio=0.5):\n\
  \        # super(DecoderRNN, self).__init__()\n        super().__init__()\n    \
  \    self.input_size = input_size\n        self.hidden_size = hidden_size\n    \
  \    self.num_layers = num_layers\n        self.teacher_forcing_ratio = teacher_forcing_ratio\n\
  \        self.gru = GRU(input_size, hidden_size, num_layers)\n        self.out =\
  \ Dense(hidden_size, output_size)\n        self.layers = [self.gru, self.out]\n\
  \        self._params = None\n\n    def initHidden(self, batch_size=1):\n      \
  \  self.h_0 = np.zeros((self.num_layers, batch_size, self.hidden_size))\n\n    def\
  \ word2vec(self, input_t):\n```\n\n\n\n\n```python\nreturn one_hot(self.input_size,\
  \ input_t, True)\n\ndef forward_step(self, input_t, hidden):\n    gru_input = self.word2vec(input_t)\n\
  \    self.input.append(gru_input)\n    output_hs, hidden = self.gru(gru_input, hidden)\n\
  \    output = self.out(output_hs[0])\n    return output, hidden, output_hs[0]\n\n\
  def forward(self, input_tensor, hidden):\n    teacher_forcing_ratio = self.teacher_forcing_ratio\n\
  \    use_teacher_forcing = True if random.random() < teacher_forcing_ratio else\
  \ False\n    # use_teacher_forcing = True\n    self.input = []\n    output_hs =\
  \ []\n    output = []\n    hidden_t = hidden\n    h_0 = hidden.copy()\n    input_t\
  \ = np.array([SOS_token])\n    # input_seq = []\n    hs = []\n    zs = []\n    target_length\
  \ = input_tensor.shape[0]\n    for t in range(target_length):\n        output_t,\
  \ hidden_t, output_hs_t = self.forward_step(\n            input_t, hidden_t)\n \
  \       # 保存每个时刻的计算结果\n        hs.append(self.gru.hs)  # 隐藏状态\n        zs.append(self.gru.zs)\
  \  # 中间变量\n        output_hs.append(output_hs_t)\n        output.append(output_t)\n\
  \        if use_teacher_forcing:\n            input_t = input_tensor[t]  # 教师强制\n\
  \        else:\n            input_t = np.argmax(output_t)  # 最大概率\n            if\
  \ input_t == EOS_token:\n                break\n            input_t = np.array([input_t])\n\
  \    output = np.array(output)\n    self.output_hs = np.array(output_hs)\n    self.h_0\
  \ = h_0\n    self.hs = np.concatenate(hs, axis=1)\n    self.zs = np.concatenate(zs,\
  \ axis=1)\n    # self.input_seq = input_seq\n    # return output, input_seq\n  \
  \  return output\n\ndef __call__(self, input, hidden):\n    return self.forward(input,\
  \ hidden)\n\ndef evaluate(self, hidden, max_length):\n    # input: (1, batch_size=1,\
  \ input_size)\n    input = np.array([SOS_token])\n    decoded_word_indices = []\n\
  \    for t in range(max_length):\n        output, hidden, _ = self.forward_step(input,\
  \ hidden)\n        output = np.argmax(output)\n        if output == EOS_token:\n\
  \            break\n        else:\n            decoded_word_indices.append(output)\n\
  \            input = np.array([output])\n    return decoded_word_indices\n    #\
  \ return indexToSentence(output_lang, decoded_words)\n    # return indexToSentence(output_verb,\
  \ decoded_words)\n\ndef backward(self, dZs):\n    dhs = []\n    output_hs = self.output_hs\n\
  \    input = np.concatenate(self.input, axis=0)\n    for i in range(len(input)):\n\
  \        self.out.x = output_hs[i]\n        dh = self.out.backward(dZs[i])\n   \
  \     dhs.append(dh)\n    dhs = np.array(dhs)\n    self.gru.hs = self.hs\n    self.gru.zs\
  \ = self.zs\n    self.gru.h = self.h_0\n    dinput, dhidden = self.gru.backward(dhs,\
  \ input)\n    return dinput, dhidden\n\n# def backward_dh(self, dZ):\n#     dh =\
  \ self.out.backward(dZ)\n#     return dh\n\ndef parameters(self):\n    if self._params\
  \ is None:\n        self._params = []\n        for layer in self.layers:\n     \
  \       for i, _ in enumerate(layer.params):\n                self._params.append([layer.params[i],\
  \ layer.grads[i]])\n    return self._params\n```\n\n\n\n\n\n#### DecoderRNN 结构\n\
  \n`DecoderRNN` 包含一个 GRU 循环神经网络 `self.gru`。`self.gru` 的输出通过输出层 `self.out` 的线性加权求和，输出词表中每个词作为下一个词的得分值。\n\
  \n由于某一时刻的词通过独热向量化输入到循环神经网络 `self.gru`，且 `self.out` 的输出也是一个与词表长度相同的向量来表示每个词的得分，因此\
  \ `self.gru` 的输入向量长度和输出向量长度均为词表长度。\n\n#### 核心方法\n\n##### `forward_step()`\n\n`forward_step()`\
  \ 是某一时刻的处理过程。它接受该时刻输入词的词表索引 `input_t` 和上一时刻的隐藏状态 `hidden`，首先通过 `word2vec()` 将其转换为独热向量\
  \ `gru_input`，然后输入 GRU，生成的隐藏状态 `output_hs[0]` 通过输出层 `out` 生成最终输出 `output`。\n\n因为反向传播求导需要每一时刻的这些中间变量（如\
  \ `gru_input`、`output_hs[0]` 等）参与计算，所以在 `forward()` 中保存了这些中间向量（如 `gru_input` 保存到\
  \ `self.input`，`output_hs[0]` 保存到 `self.output_hs`）。\n\n##### `forward()`\n\n`forward()`\
  \ 方法接受输入词序列 `input_tensor`，从特殊开始词索引 `SOS_token` 开始，依次处理每个输入词 `input_t`，并保存 GRU 计算的中间状态（如\
  \ `self.gru.hs`、`self.gru.zs`），因为每一时刻的反向求导需要依赖该时刻的这些中间变量。\n\n每一时刻输入词 `input_t`，输出一个预测向量\
  \ `output_t`。下一时刻的 `input_t` 可以是 `output_t` 对应得分最高的词，也可以是训练样本输出句子对应的词。如果标志 `use_teacher_forcing`\
  \ 为 `True`，`input_t` 使用训练样本输出句子对应的词，否则使用预测得分最大的词。使用训练样本输出句子中的词作为下一个词称为 **Teacher\
  \ Forcing**（教师强制）。\n\n**示例**：解码器的目标序列为 `'hello'`，初始时刻输入为特殊字符 `'SOS'`，其目标输出应为字符 `'h'`，但初始时刻输出向量中字符\
  \ `'h'` 的概率可能不是最大的。若 `'o'` 是预测概率最高的字符，若不采用 Teacher Forcing，则 `'o'` 将作为下一时刻的输入；若采用\
  \ Teacher Forcing，则不使用预测概率最高的 `'o'`，而是使用实际目标输出 `'h'` 作为下一时刻的输入。\n\n使用 Teacher Forcing\
  \ 会导致收敛更快，但训练网络可能过度学习训练样本中的信息，导致泛化能力差，即实际预测效果不稳定。因此，可以随机启用 Teacher Forcing 训练，例如以\
  \ 50% 的概率使用。\n\n##### `evaluate()`\n\n`evaluate()` 使用训练好的解码器进行预测，接受编码器输出的上下文向量 `hidden`\
  \ 和最大输出词数 `max_length`。其过程类似 `forward()` 函数，但因为是预测，只在初始时刻输入 `'SOS'`，所以采用非 Teacher\
  \ Forcing 方式，即每次始终使用预测得分最大的词（若想生成多样性，也可根据得分对应的概率采样词）作为下一时刻的输入词。\n\n从初始编码器输出的上下文向量和初始时刻的开始词\
  \ `'SOS'` 出发，不断根据预测得分采样词作为下一时刻的输入词，直到遇到结束字符 `'EOS'` 或词（字符）数达到最大数 `max_length`。最终输出由词表索引构成的所有词的向量。\n\
  \n##### `backward()`\n\n`backward()` 方法接受损失函数对输出层输出的梯度 `dZs`，首先计算每一时刻输出层关于该时刻隐藏状态的梯度，然后利用所有隐藏状态梯度\
  \ `dhs` 和 GRU 的输入 `input` 对 GRU 循环神经网络进行反向求导。\n\n##### `parameters()`\n\n编码器和解码器的\
  \ `parameters()` 函数用于返回其所有模型参数，以构建优化器对象。\n\n#### 训练流程\n\n##### `train_step()`\n\n\
  函数 `train_step()` 接受一对输入输出序列 `input_tensor` 和 `target_tensor`，以及编码器、解码器及其优化器 `encoder`、`decoder`、`encoder_optimizer`、`decoder_optimizer`，还有计算模型损失的函数\
  \ `loss_fn` 和正则化系数 `reg`。\n\n`train_step()` 对模型参数进行一次训练更新：\n1. 根据 `input_tensor`\
  \ 计算编码器的输出 `encoder_output` 和 `encoder_hidden`。\n2. 根据 `last_hidden` 标志，使用最后一时刻的隐藏状态\
  \ `encoder_hidden` 或 `encoder_output` 作为解码器的输入，配合 `target_tensor` 计算解码器的最终预测输出。\n\
  3. 根据预测输出 `output` 和目标 `target` 计算交叉熵损失及损失对 `output` 的梯度 `grad`。\n4. 使用 `decoder.backward(grad)`\
  \ 反向求导解码器，输出为编码器输出 `encoder_hidden` 的梯度 `dhidden`，据此继续反向求导编码器。\n5. 更新模型参数。更新前可使用\
  \ `clip_grad_norm_nn` 裁剪梯度以防止梯度爆炸。\n\n```python\ndef train_step(input_tensor, target_tensor,\
  \ encoder, decoder, encoder_optimizer, decoder_optimizer, \\\n                loss_fn,\
  \ reg, last_hidden=True, max_length=0):\n\n    clip = 5.\n\n    encoder_optimizer.zero_grad()\n\
  \    decoder_optimizer.zero_grad()\n\n    input_length = input_tensor.shape[0] \
  \ # input_tensor.size(0)\n\n    loss = 0\n\n    encode_input = input_tensor    \n\
  \n    encoder_output, encoder_hidden = encoder(encode_input, None)  \n\n    if last_hidden:\n\
  \        output = decoder(target_tensor, encoder_hidden)   \n    else:\n       \
  \ output = decoder(target_tensor, encoder_output)\n\n    target = target_tensor.reshape(-1,\
  \ 1)\n\n    if output.shape[0] != target.shape[0]:       \n        target = target[:output.shape[0],\
  \ :]      \n\n    loss, grad = loss_fn(output, target)    \n\n    loss /= (output.shape[0])\n\
  \n    if last_hidden:\n        dinput, dhidden = decoder.backward(grad)\n      \
  \  encoder.backward(dhidden[0])  # , encode_input)        \n    else:\n        dinput,\
  \ d_encoder_outputs = decoder.backward(grad)        \n        encoder.backward(d_encoder_outputs)\n\
  \n    if reg is not None:\n        loss += encoder_optimizer.regularization(reg)\n\
  \        loss += decoder_optimizer.regularization(reg)\n\n    util.clip_grad_norm_nn(encoder_optimizer.parameters(),\
  \ clip, None)\n    util.clip_grad_norm_nn(decoder_optimizer.parameters(), clip,\
  \ None)\n\n    encoder_optimizer.step()\n    decoder_optimizer.step()\n\n    return\
  \ loss   \n\n    # return loss.item() / target_length\n```\n\n##### `trainIters()`\n\
  \n函数 `trainIters()` 迭代调用 `train_step()` 函数以更新模型参数。在迭代过程中，可输出一些中间训练结果模型，如输出训练误差和验证误差。\n\
  \n##### 辅助函数\n\n```python\nimport numpy as np\nimport time\nimport math\nimport\
  \ matplotlib.pyplot as plt\n%matplotlib inline\n\ndef timeSince(start):\n    now\
  \ = time.time()\n    s = now - start  \n    m = math.floor(s / 60)\n    s -= m *\
  \ 60\n    return '%dm %ds' % (m, s)\n```\n\n\n\n\n\n#### 函数 `trainIters_`\n\n```python\n\
  def trainIters_(encoder, decoder, encoder_optimizer, decoder_optimizer, train_pairs,\
  \ valid_pairs, encoder_output_all=False, print_every=1000, plot_every=100, reg=None):\n\
  \    start = time.time()\n    valid_losses = []\n    plot_losses = []\n    print_loss_total\
  \ = 0  # Reset every print_every\n    plot_loss_total = 0  # Reset every plot_every\n\
  \    training_pairs = train_pairs\n    loss_fn = util.rnn_loss_grad\n\n    for iter\
  \ in range(1, n_iters + 1):\n        pair = training_pairs[iter - 1]\n        input_tensor,\
  \ target_tensor = pair[0], pair[1]\n        loss = train_step_(input_tensor, target_tensor,\
  \ encoder, decoder, encoder_optimizer, decoder_optimizer, loss_fn, reg, encoder_output_all)\n\
  \        if loss is None:\n            continue\n        print_loss_total += loss\n\
  \        plot_loss_total += loss\n\n        if iter % print_every == 0:\n      \
  \      print_loss_avg = print_loss_total / print_every\n            print_loss_total\
  \ = 0\n            print('%s (%d %d%%) %.4f' % (timeSince(start), iter, iter / n_iters\
  \ * 100, print_loss_avg))\n\n        if iter % plot_every == 0:\n            plot_loss_avg\
  \ = plot_loss_total / plot_every\n            plot_losses.append(plot_loss_avg)\n\
  \            plot_loss_total = 0\n            plt.plot(plot_losses)\n          \
  \  valid_losses.append(validation_loss(encoder, decoder, valid_pairs, encoder_output_all,\
  \ 20, reg))\n            plt.plot(valid_losses)\n            plt.legend([\"train_losses\"\
  , \"valid_losses\"])\n            plt.show()\n```\n\n#### 函数 `validation_loss`\n\
  \n```python\ndef validation_loss(encoder, decoder, valid_pairs, last_hidden=True,\
  \ validation_size=None, reg=None):\n    if validation_size is not None:\n      \
  \  valid_pairs = [random.choice(valid_pairs) for i in range(validation_size)]\n\
  \    total_loss = 0\n    loss_fn = util.rnn_loss_grad\n    teacher_forcing_ratio\
  \ = decoder.teacher_forcing_ratio\n    decoder.teacher_forcing_ratio = 1.1\n\n \
  \   for pair in valid_pairs:\n        encode_input = pair[0]\n        target_tensor\
  \ = pair[1]\n        encoder_output, encoder_hidden = encoder(encode_input, None)\n\
  \        if last_hidden:\n            output = decoder(target_tensor, encoder_hidden)\n\
  \        else:\n            output = decoder(target_tensor, encoder_output)\n  \
  \      target = target_tensor.reshape(-1, 1)\n        if output.shape[0] != target.shape[0]:\n\
  \            target = target[:output.shape[0], :]\n        loss, grad = loss_fn(output,\
  \ target)\n        loss /= (output.shape[0])\n        if reg is not None:\n    \
  \        params = encoder.parameters() + decoder.parameters()\n            reg_loss\
  \ = 0\n            for p, grad in params:\n                reg_loss += np.sum(p**2)\n\
  \            loss += reg * reg_loss\n        total_loss += loss\n\n    decoder.teacher_forcing_ratio\
  \ = teacher_forcing_ratio\n    return total_loss / len(valid_pairs)\n```\n\n其中，`validation_loss()`\
  \ 使用训练好的模型计算验证误差。它从验证样本集中随机抽取少量样本，通过编码器和解码器生成输出，然后计算解码器的预测输出，并以与训练过程相同的方式计算损失。\n\
  \n### 7.11.2 字符级 Seq2Seq 机器翻译\n\n机器翻译首先需要语料库来训练 Seq2Seq 模型。以下网站提供各种语言之间的训练语料库，每个语料库都是一个文本文件。例如，`fra.txt`\
  \ 是法语和英语的训练样本，每行包含两种不同语言的语句。\n\n[`www.manythings.org/anki/`](https://www.manythings.org/anki/)\n\
  \n与之前 RNN 生成的文本类似，机器翻译的输入和输出句子可以被视为单词序列或字符序列。只要为一种语言中的所有字符建立字符表，句子中的每个字符就可以转换为独热向量。图\
  \ 7-52 展示了一个将句子视为字符序列的 Seq2Seq 模型。\n\n**图 7-52** 机器翻译的字符级 Seq2Seq 模型，每个时刻的输入是一个字符。\n\
  \n为此，需要为每种语言创建一个字符词汇表。\n\n#### 1. 字符词表\n\n类 `ChVerb` 用于表示一种语言的字符词汇表，即记录有哪些字符，以及每个字符与其在字符词汇表中索引的对应关系。其中，`\\\
  t` 和 `\\n` 分别代表特殊的开始字符和结束字符，它们对应的词表索引分别为 0 和 1。\n\n```python\nSOS_token = 0\nEOS_token\
  \ = 1\n\nclass ChVerb:\n    def __init__(self, name):\n        self.name = name\n\
  \        self.char2index = {'\\t': 0, '\\n': 1}\n        self.index2char = {0: '\\\
  t', 1: '\\n'}\n        self.n_chars = 2  # Count SOS and EOS\n\n    def addChars(self,\
  \ chars):\n        for char in chars:\n            self.addChar(char)\n\n    def\
  \ addChar(self, char):\n        if char not in self.char2index:\n            self.char2index[char]\
  \ = self.n_chars\n            self.index2char[self.n_chars] = char\n           \
  \ self.n_chars += 1\n```\n\n#### 2. 读取训练样本并构建字符词汇表\n\n首先读取语料库中对应的翻译句子：\n\n```python\n\
  import numpy as np\nimport random\nimport re\nimport unicodedata\n\nrandom.seed(1)\n\
  \ndef unicodeToAscii(sentence):\n    return ''.join(\n        c for c in unicodedata.normalize('NFD',\
  \ sentence)\n        if unicodedata.category(c) != 'Mn'\n    )\n\ndef normalize_sentence(sentence):\n\
  \    sentence = unicodeToAscii(sentence.lower().strip())\n    sentence = re.sub(r\"\
  ([.!?])\", r\" \\1\", sentence)\n    sentence = re.sub(r\"[^a-zA-Z.!?]+\", r\" \"\
  , sentence)\n    return sentence\n\ndef readLangs(lang2lang_file, reverse=False):\n\
  \    print(\"Reading lines...\")\n    lines = open(lang2lang_file, encoding='utf-8').read().strip().split('\\\
  n')\n    # Split every line into pairs and normalize\n    pairs = [[normalize_sentence(s)\
  \ for s in l.split('\\t')][:2] for l in lines]\n    if reverse:  # Reverse pairs\n\
  \        pairs = [list(reversed(p)) for p in pairs]\n    return pairs\n```\n\n`normalize_sentence()`\
  \ 对句子中的字符进行预处理，例如将 Unicode 码转换为 ASCII 码，将大写字符转换为小写字符，并删除非字母字符。\n\n过滤读取的句子对，例如限制句子的长度：\n\
  \n```python\nMAX_LENGTH = 20\n\ndef filterPair(p):\n    return len(p[0]) < MAX_LENGTH\
  \ and len(p[1]) < MAX_LENGTH\n\ndef filterPairs(pairs):\n    return [pair for pair\
  \ in pairs if filterPair(pair)]\n```\n\n使用读取并过滤后的句子对作为训练样本，首先构建两种语言的字符词表。\n\n```python\n\
  def prepareCharPairs(lang2lang_file, reverse=False):\n    pairs = readLangs(lang2lang_file,\
  \ reverse)\n    print(\"Read %s sentence pairs\" % len(pairs))\n    pairs = filterPairs(pairs)\n\
  \    print(\"Trimmed to %s sentence pairs\" % len(pairs))\n    for pair in pairs:\n\
  \        in_verb.addChars(pair[0])\n        out_verb.addChars(pair[1])\n    return\
  \ in_verb, out_verb, pairs\n\nlang2lang_file = './data/eng-fra.txt'\nin_verb = ChVerb(\"\
  fra\")\nout_verb = ChVerb(\"eng\")\nin_verb, out_verb, pairs = prepareCharPairs(lang2lang_file,\
  \ True)\nprint(\"Read %s sentence pairs\" % len(pairs))\nprint(\"Counted chars:\"\
  )\nprint(in_verb.name, in_verb.n_chars)\nprint(out_verb.name, out_verb.n_chars)\n\
  for i in range(5):\n    print(random.choice(pairs))\nprint(pairs[3])\n```\n\n输出示例：\n\
  \n```\nReading lines...\nRead 170651 sentence pairs\nTrimmed to 9194 sentence pairs\n\
  Read 9194 sentence pairs\nCounted chars:\nfra 32\neng 32\n['tom a dit bonjour .',\
  \ 'tom said hi .']\n['je suis creve .', 'i am tired .']\n['prends une douche !',\
  \ 'take a shower .']\n['je suis detendu .', 'i m relaxed .']\n```\n\n\n\n\n\n####\
  \ 3. 训练字符级 Seq2Seq 模型\n\n根据数据处理后获得的训练样本集对以及前面的 Seq2Seq 模型训练代码，可以训练字符级机器翻译的 Seq2Seq\
  \ 模型。以下代码定义了编码器和解码器对象 `encoder`、`decoder`，以及相应的优化器 `encoder_optimizer`、`decoder_optimizer`。并将样本集\
  \ `pairs` 划分为两个集合 `train_pairs` 和 `valid_pairs` 用于训练和验证，然后调用 Seq2Seq 模型的训练函数 `trainIters()`\
  \ 来训练模型：\n\n```\nfrom train import *\nfrom Layers import *\nfrom rnn import *\n\
  import util\n\nhidden_size = 50 #256 \nnum_layers = 1\nclip = 5.#50.\nlearning_rate\
  \ = 0.1\ndecoder_learning_ratio = 1.0 \nteacher_forcing_ratio =0.5\n\nencoder =\
  \ EncoderRNN(in_verb.n_chars, hidden_size)\ndecoder = DecoderRNN(out_verb.n_chars,hidden_size,out_verb.n_chars,num_layers,teacher_forcing_ratio)\n\
  \nmomentum = 0.5\ndecay_every  =1000\n\nencoder_optimizer = SGD(encoder.parameters(),\
  \ learning_rate, momentum,decay_every)\ndecoder_optimizer = SGD(decoder.parameters(),\
  \ learning_rate*decoder_learning_ratio, momentum,decay_every)\n\nreg= None#1e-2\n\
  \nif True:\n    pairs = pairs[:80000]\n\nnp.random.shuffle(pairs)\n\ntrain_n = (int)(len(pairs)*0.98)\n\
  train_pairs = pairs[:train_n]\nvalid_pairs = pairs[train_n:]\n\nn_iters = 50000\n\
  print_every, plot_every = 100,100  #10,10\n\nidx_train_pairs = [tensorsFromPair(random.choice(train_pairs))\
  \      for i in range(n_iters)]\nidx_valid_pairs  =  [tensorsFromPair(pair)  for\
  \ pair in valid_pairs]\n\ntrainIters(encoder, decoder,encoder_optimizer,decoder_optimizer,idx_train_pairs,idx_valid_pairs,True,print_every,\
  \ plot_every,reg)\n```\n\n![图 8-54 字符序列 Seq2Seq 模型的损失曲线](img/file168.png)\n\n从训练损失曲线和验证损失曲线的分离情况可以看出，训练是不稳定的，损失曲线在\
  \ 40,000 次后趋于平坦并略微上升。\n\n训练好的模型可用于语言翻译。将待翻译语言的词序列（句子）输入 `encoder` 以生成输出上下文信息，该信息再输入\
  \ `decoder`。生成翻译后的词序列（句子）。\n\n```\ndef evaluate(encoder,decoder,in_vocab,out_vocab,sentence,\\\
  \n             max_length=MAX_LENGTH,last_Hidden = True): \n    encode_input = tensorFromSentence(in_vocab,sentence)\n\
  \    encoder_output, encoder_hidden = encoder(encode_input, None)   \n    if last_Hidden:\n\
  \        output_sentence =  decoder.evaluate(encoder_hidden,max_length) \n    else:\n\
  \        output_sentence =  decoder.evaluate(encoder_output,max_length) \n    output_sentence\
  \ = indexToSentence(out_vocab,output_sentence)\n    return output_sentence\n```\n\
  \n其中，`last_Hidden` 表示 `decoder` 的输入是 `encoder` 最后一时刻的输出（隐藏向量）还是所有步的输出。\n\n随机选择几个输入句子并使用\
  \ `evaluate` 预测翻译句子：\n\n```\nindices = np.random.randint(len(pairs), size=3)\nfor\
  \ i in indices:\n    pair = pairs[i]\n    print(pair)\n    sentence = pair[0]  \
  \ \n    sentence = evaluate(encoder, decoder,in_verb,out_verb, sentence,MAX_LENGTH)\n\
  \    print(sentence)\n```\n\n```\n['es tu jalouse ?', 'are you jealous ?']\nare\
  \ you a see  ??\n\n['continue a courir .', 'keep running .']\ncome a         .\n\
  \n['lis ton livre !', 'read your book .']\nbe care it .\n```\n\n\n\n\n从结果来看，预测效果并不理想。编码器最后一时刻的输出被用作上下文向量（`context\
  \ vector`）在编码器和解码器之间传递信息，这样单个向量就承担了编码整个句子的重任，可能无法包含完整信息。如果使用所有输出时刻的输出作为上下文变量，信息相对完整，但无法直接将所有输出时刻的变长编码器输出信息作为解码器每一时刻的输入。\n\
  \n后来引入的**注意力机制**使解码器网络能够在解码器自身输出的每一步“关注”编码器输出的不同部分，这可以解决这种变长解码器输出问题，并避免解码器隐藏状态向量的增加。\n\
  \n### 7.11.3 基于 Word2Vec 的 Seq2Seq 机器翻译\n\n一个句子可以被视为字符序列，也可以被视为单词序列。作为字符序列时，句子的长度是作为单词序列时的数倍。序列越长，循环神经网络的梯度传递越困难，梯度爆炸和消失也越容易发生，因此在机器翻译中，句子被视为单词序列。然而，一种语言的单词数量通常非常庞大。如果使用独热编码量化每个词，其独热向量将非常巨大。当然，中文的字符是汉字，汉字数量也很大，独热向量同样会很大。因此，直接用独热向量量化单词存在两个明显问题：\n\
  \n*   浪费空间，表示一个单词的向量非常大，只有一个值为 1，其余均为 0\n*   无法表达单词间的内在联系，如同义词、相关性等，语言的单词并非相互独立，它们之间往往存在一定的关联\n\
  \n在自然语言处理中，使用比独热编码更好的词向量化方法。这些方法统称为 **Word2Vec**（词量化/词向量化）。词量化可以看作是将单词从其词表所在的空间（独热向量空间）转换到低维空间，这类似于自编码器将高维向量映射到低维向量。词量化也是一种量化模型，它利用语料库（如一段文本）通过有监督机器学习方法训练单词，但因为它不需要对单词做任何标注，而是自行采样有监督训练样本，所以也有人称之为无监督学习。\n\
  \n#### 1. 词向量化 Word2Vec 的 skip-gram 方法\n\n词量化（Word2vec）主要有两种方法：连续词袋模型（CBOW）和 skip-gram（跳字模型）。\n\
  \n这两种方法都通过一个类似自编码器的两层神经网络来学习单词的词向量，即将高维独热向量映射到低维隐向量。如图 8-55 所示，词表长度为 V，即有 V 个不同的单词，一个单词的独热向量\
  \ `x` 是长度为 `V` 的向量，经过权重矩阵 `W[V × N]` 后，因为 N 通常是远小于 V 的整数，所以用 `W[V × N]` 对 `x` 进行加权求和产生低维隐向量\
  \ `h[N] = x W[V × N]`，这个隐向量 `h[N]` 就是索引为 k 的单词的向量化表示。\n\n图 8-55 CBOW 和 Skip-gram\
  \ 词量化均使用两层加权神经网络来学习单词的量化表示\n\n因为 `x` 是一个只有第 k 个分量为 1、其余为 0 的行向量，`x W[V × N]` 的结果就是矩阵的第\
  \ `k` 行，所以实际上不需要进行乘法运算，只需取出矩阵的第 k 行即可。Python 代码如下：\n\n```\nh = self.W[k,:]\n```\n\
  \n\n\n##### Word2Vec 模型训练\n\n为了获得合适的词潜在向量表示以反映词之间的相关性（如同义词），需要使用自编码器训练该权重矩阵。与自编码器类似，隐藏向量通过\
  \ `W[W[N×V]]` 转换为与词表长度相同的输出向量。该输出向量的每个分量 `p[i]` 代表第 `i` 个词的得分，可通过 softmax 函数转换为概率。为了训练该神经网络模型，CBOW\
  \ 和 Skip-gram 使用不同方法从由大量句子组成的语料库中生成训练样本。\n\n编码器和解码器均为无偏置、无激活函数的全连接层，即仅有一个权重矩阵。因此，该\
  \ 2 层神经网络包含 2 个权重矩阵，可用简化的图 8-56 表示：\n\n**图 8-56 简化的词量化神经网络，编码器和解码器仅为一个权重矩阵**\n\n\
  其工作过程类似于自编码器。第一个全连接线性层是一个无偏置的权重矩阵 `W[1]`，将输入词的独热向量 `x` 转换为低维嵌入表示 `h = xW[1]`，该 `h`\
  \ 即为词 `x` 的量化表示。为训练权重矩阵 `W[1]`，将 `h` 通过另一个无偏置、无激活函数的全连接线性层（即权重矩阵 `W[2]`），输出所有词得分的向量\
  \ `f = hW[2]`。训练过程中，将该 `f` 与目标词比较得到损失误差，并通过这些损失误差的反向传播更新模型参数。\n\n如图 8-57 所示，对于句子中的一个词，若记为\
  \ `w[t]`（即中心词或目标词），CBOW 使用其上下文或周围词作为输入。例如，若上下文窗口 `C` 设为 `C = 5`，输入将为位置 `w[t-2]`、`w[t-1]`、`w[t+1]`\
  \ 和 `w[t+2]` 处的词，即中心词 `w[t]` 前后各两个词。将某中心词 `w[t]` 的上下文词（`w[t-2]`、`w[t-1]`、`w[t+1]`、`w[t+2]`）输入网络，CBOW\
  \ 期望输出的预测词 `w[p]` 为目标词 `w[t]`。通过计算预测词 `w[p]` 与目标词 `w[t]` 的交叉熵损失来训练网络。\n\n**图 8-57\
  \ CBOW 以词的上下文（周围词）作为编码器输入，解码器输出词表词的得分，得分最高的目标词应为中心词**\n\n与 CBOW 利用句子中词的上下文预测该词相反，Skip-gram\
  \ 利用词 `w[t]` 预测其上下文词 `w[t-2]`、`w[t-1]`、`w[t+1]`、`w[t+2]`，如图 8-58 所示。即输入词 `w[t]`\
  \ 的独热向量，通过编码器得到隐藏向量 `h[N]`，再通过解码器输出与词表等长的向量，表示词表中每个词的得分。得分可通过 softmax 函数转为概率，以上下文词为目标词计算交叉熵损失，从而训练编码器和解码器。\n\
  \n**图 8-58 Skip-gram 以词作为编码器输入，解码器输出词表词的得分，得分最高的应为该词的上下文词，即上下文词为目标词**\n\nCBOW 和\
  \ Skip-gram 均利用语料库中的句子生成训练样本。对于 Skip-gram 方法，句子中的每个词作为中心词，每个上下文词作为目标词形成一个训练样本。\n\
  \n例如，对于句子 \"Seq2Seq is a general purpose encoder decoder framework\"，第一个词 \"Seq2Seq\"\
  \ 的上下文词为 \"is\" 和 \"a\"，则得到 2 个训练样本 (Seq2Seq, is) 和 (Seq2Seq, a)，如图 8-59 所示。同理，第二个词\
  \ \"is\" 的上下文词为 \"seq2seq\"、\"a\"、\"general\"，得到三个样本 (is, Seq2Seq)、(is, a)、(is,\
  \ general)。以此类推，最后一个词 \"framework\" 可得到样本 (framework, encoder) 和 (framework, decoder)。\n\
  \n**图 8-59 Skip-gram 针对句子 \"Seq2Seq is a general purpose encoder decoder framework\"\
  \ 生成的训练样本**\n\nCBOW 和 Skip-gram 各有优劣。CBOW 适用于词汇量较小的语言模型，能较好表示稀有词；Skip-gram 适用于词汇量大的语言模型，能更好表示高频词。\n\
  \n以下代码以 skip-gram 为例说明如何实现该模型的训练过程。对于 skip-gram，输入为当前中心词，目标为上下文词，但因存在多个上下文词（即多个目标），每个目标词需与\
  \ `f = hW[2]` 计算一个交叉熵损失。\n\n类似地，定义 `wordlist` 表示语言中的所有词，可从语料库句子构建：\n\n```python\n\
  class Vocab:\n\n    def __init__(self, corpus):\n\n        wordset = set()\n\n \
  \       for sentence in corpus:\n\n            if isinstance(sentence, str):\n\n\
  \                for word in sentence.split(' '):\n\n                    wordset.add(word)\n\
  \n            else:\n\n                for word in sentence:\n\n               \
  \     wordset.add(word)\n\n        wordlist = list(wordset)\n\n        self.word2index\
  \ = dict([(word, i) for i, word in enumerate(wordset)])\n\n        self.index2word\
  \ = dict([(i, word) for i, word in enumerate(wordset)])\n\n        self.n_words\
  \ = len(wordset)\n\n    def index2onehot(self, idx):\n\n        x = np.zeros((1,\
  \ self.n_words))\n\n        x[0, idx] = 1\n\n        return x\n\ncorpus = [\"i am\
  \ from china\",]\n\nvocab = Vocab(corpus)\n\nprint(vocab.word2index)\n\nprint(vocab.word2index[\"\
  am\"])\n\nprint(vocab.index2word)\n\nprint(vocab.index2word[3])\n```\n\n```\n{'china':\
  \ 0, 'am': 1, 'i': 2, 'from': 3}\n1\n{0: 'china', 1: 'am', 2: 'i', 3: 'from'}\n\
  from\n```\n\n可读取语料库文件中的所有句子构建词表，并基于词表和语料库中的句子生成训练 Word2Vec 模型的训练样本。函数 `generate_training_data()`\
  \ 根据由词表 `vocab` 和句子组成的语料库 `corpus` 以及采样窗口大小 `window`，采样用于训练 Word2Vec 模型的样本：\n\n\
  ```python\ndef generate_training_data(vocab, corpus, window=2):\n\n    training_data\
  \ = []\n\n    for sentence in corpus:  # for each sentence\n\n        sent_len =\
  \ len(sentence)\n\n        for i, word in enumerate(sentence):  # for each word\
  \ in the sentence\n\n            w_target = vocab.word2index[sentence[i]]\n\n  \
  \          w_context = []\n\n            for j in range(i - window, i + window +\
  \ 1):\n\n                if j != i and j <= sent_len - 1 and j >= 0:\n\n       \
  \             w_context.append(vocab.word2index[sentence[j]])\n\n            training_data.append([w_target,\
  \ w_context])\n\n    return np.array(training_data)\n\ncorpus = [[\"i\", \"am\"\
  , \"from\", \"china\"]]\n\ngenerate_training_data(vocab, corpus)\n```\n\n```\narray([[2,\
  \ list([1, 3])],\n       [1, list([2, 3, 0])],\n       [3, list([2, 1, 0])],\n \
  \      [0, list([1, 3])]], dtype=object)\n```\n\n可在词表和语料库基础上训练 Word2Vec 模型，以下类 `Word2Vec`\
  \ 为其代码实现：\n\n```python\nclass Word2Vec():\n\n    def __init__(self, corpus, hidden_n,\
  \ window, learning_rate=0.01, epochs=5000):\n\n        self.hidden_n = hidden_n\n\
  \n        self.window = window\n\n        self.lr = learning_rate\n\n        self.epochs\
  \ = epochs\n\n        self.vocab = Vocab(corpus)\n\n        print(\"Training a Word2Vec\
  \ model....\")\n```\n\n\n\n\n###### Word2Vec 模型训练与应用\n\n####### 核心训练代码\n\n```python\n\
  train_data = generate_training_data(self.vocab, corpus, self.window)\n\nself.train(train_data,\
  \ self.vocab.n_words, self.hidden_n)\n\nself.epsilon = 1e-8\n\nprint(\"Complete\
  \ the training of the Word2Vec model!\")\n```\n\n```python\ndef train(self, train_data,\
  \ word_count, hidden_n):\n    bound = 0.01\n\n    self.w1 = np.random.uniform(-bound,\
  \ bound, (word_count, hidden_n))\n    self.w2 = np.random.uniform(-bound, bound,\
  \ (hidden_n, word_count))\n\n    for i in range(0, self.epochs):\n        loss =\
  \ 0\n        for w_t, w_c in train_data:\n            f, h, z = self.forward_pass(w_t)\n\
  \            w_y = [self.vocab.index2onehot(c) for c in w_c]\n            dz = np.sum([np.subtract(f,\
  \ y) for y in w_y], axis=0)\n            self.backprop(dz, h)  # , w_t)\n      \
  \      loss += np.sum([-np.sum(y * np.log(f)) for y in w_y])\n        print('epoch:',\
  \ i, 'loss:', loss)\n```\n\n```python\ndef forward_pass(self, idx):\n    self.x\
  \ = self.vocab.index2onehot(idx)\n    # h = np.dot(self.x, self.w1)\n    h = self.w1[idx,\
  \ :]\n    z = np.dot(h, self.w2)\n    f = self.softmax(z)\n    return f, h, z\n\
  ```\n\n```python\ndef backprop(self, dz, h):\n    x = self.x\n    dw2 = np.outer(h.T,\
  \ dz)\n    dh = np.dot(dz, self.w2.T)\n    dw1 = np.outer(np.array(x).T, dh)\n \
  \   self.w1 = self.w1 - (self.lr * dw1)\n    self.w2 = self.w2 - (self.lr * dw2)\n\
  ```\n\n```python\ndef softmax(self, x):\n    e_x = np.exp(x - np.max(x))\n    return\
  \ e_x / e_x.sum(axis=0)\n```\n\n```python\ndef word_vec(self, word):\n    w_index\
  \ = self.vocab.word2index[word]\n    embeded_w = self.w1[w_index]\n    return embeded_w\n\
  ```\n\n```python\ndef __call__(self, word):\n    return self.word_vec(word)\n```\n\
