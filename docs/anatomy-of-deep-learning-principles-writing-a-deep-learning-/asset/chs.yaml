  ![](img/file56.png)\n\n**图 3-19** 随着训练样本增加的 9 次多项式函数拟合情况\n\n**图 3-20** 左、中、右分别为欠拟合、最优拟合和过拟合\n\
  \n如**图 3-20**所示，平面上有一组二维坐标点。使用线性函数（直线）、二次函数（抛物线）和高次多项式作为线性回归的模型函数，可以清晰地看到左、中、右分别为欠拟合、最优拟合和过拟合。如果模型过于简单，会出现欠拟合；如果过于复杂，会出现过拟合；只有复杂度适中时，才能产生优化的拟合效果。\n\
  \n根据对欠拟合和过拟合成因的分析，可以通过以下方法缓解欠拟合问题：\n\n*   **增加样本特征。** 例如，从样本特征 `x` 中增加 `x**2` 和\
  \ `x**3` 等更多样本特征，实际上增加了数据的复杂度，从而缓解欠拟合问题。\n*   **增加模型复杂度：** 如选择表达能力更强的假设函数（模型）或降低正则化程度。\n\
  \n过拟合问题可以通过以下方法解决：\n\n*   **增加训练样本** 以扩大训练数据量。\n*   **降低模型复杂度：** 使用低复杂度的假设函数（模型）或通过正则化来限制假设函数（模型）的复杂度。\n\
  \n### 3.2.2 验证集、测试集\n\n通过可视化展示训练模型函数和真实样本数据，可以观察模型函数是欠拟合还是过拟合，从而直接直观地判断模型函数拟合得好不好。然而，这种方法仅适用于可以用曲线和曲面表示的非常简单的假设函数。许多实际问题具有复杂的假设函数和大量的数据特征。例如，一张图像可能拥有数百万个特征。深度学习中的神经网络函数拥有数千个参数。此类数据样本和假设函数无法可视化。\n\
  \n从前面的示例可以看出，对于此类问题，往往不可能仅根据下降的损失函数曲线来判断最终模型函数是否拟合数据。即使某个函数对训练样本的损失很小，它对不在训练集中的其他样本也可能产生较大误差；即会出现过拟合问题。换句话说，模型函数的“泛化能力”不足，无法更好地表达实际样本数据特征与目标值之间的关系。“过拟合”发生的原因是训练模型过分关注如何更好地拟合训练集，因此训练出的模型对不同于训练集的数据会产生更大的误差。当然，仅根据损失函数的值也难以判断模型函数是过拟合还是欠拟合。在某些情况下，即使损失函数的值很小，也可能是欠拟合。\n\
  \n训练模型的目的是利用模型预测新数据。即使模型能很好地拟合训练数据，如果对新数据的预测效果差，也是无用的。正如运动员训练是为了在队内名列前茅，但无法保证在面对其他对手时也能表现同样出色。\n\
  \n为了帮助判断模型函数是过拟合还是欠拟合，除了损失函数曲线外，通常借助与训练集不同的样本集来评估模型函数的质量。\n\n因此，在机器学习中，除了用于训练模型的训练集外，通常还会使用单独的测试集来评估训练好的模型。对于模型函数，可以计算测试集中样本的预测误差（即预测值与目标值之间的误差）。如果测试集样本的误差与训练集样本的误差相似，则可以初步判断该模型函数具有较好的泛化能力。测试集应尽可能涵盖各种不同的数据，以评估训练好的模型是否具有良好的泛化能力。\n\
  \n除了训练集和训练模型的算法外，不同假设函数模型的性能也不同。例如，在前面的二维数据点多项式拟合问题中，不同次数的多项式函数得到的训练模型函数性能不同；有的欠拟合，有的过拟合。此外，训练算法中的超参数（如学习率、批量大小、迭代次数等）也对训练结果有很大影响。例如，在其他条件不变的情况下，迭代次数直接影响训练误差；迭代次数过少可能导致欠拟合，过多可能导致过拟合。\n\
  \n通过验证集评估不同模型的预测误差，有助于选择合适的假设函数和训练超参数，从而获得泛化能力更强的训练模型。\n\n例如，在训练模型时，可以同时计算训练集和验证集的损失（误差）。当训练迭代开始时，验证误差和训练误差都会从高到低持续下降。随着迭代次数增加，验证集误差反而变大，表明泛化能力变差。此时应尽早停止迭代。这种方法称为**早停法**。即验证集可用于防止训练过程中迭代次数过多。再如，对于前面的多项式拟合，若无可视化辅助，可以利用不同次数多项式模型函数在训练集和验证集上的训练误差和验证误差，帮助选择合适次数的多项式函数。\n\
  \n因此，训练集用于训练模型，验证集用于评估和选择模型，有时还会使用单独的测试集来测试最终模型。有时测试集和验证集不加区分。\n\n针对前面正弦采样点的拟合问题，以下代码总共采样了三个样本集：训练集、验证集和测试集。\n\
  \n\n\n\n\n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\n%matplotlib\
  \ inline\n\nn_pts = 10\nx_train, y_train = sample(n_pts)\nx_valid, y_valid = sample(n_pts)\n\
  x_test, y_test = sample(n_pts)\n```\n\n如果你想选择不同次数的假设函数，例如 `K=0, 1, 2, 3, ... 9`，可以使用这些不同次数的假设函数进行训练，并计算训练误差和验证误差。\n\
  \n```python\ndef rmse(a, b):\n    return np.sqrt(np.mean(np.square(a - b)))\n\n\
  M = 10\nerrors_train = []\nerrors_valid = []\nfor K in range(M):\n    X = np.array([np.power(x_train,\
  \ k) for k in range(K + 1)])\n    X = X.transpose()\n\n    # w, history = gradient_descent_vec(X,\
  \ y, lr, iterations)\n    XT = X.transpose()\n    XTy = XT @ y_train\n    w = np.linalg.inv(XT\
  \ @ X) @ XTy\n    # w = np.linalg.pinv(X) @ y\n    # print(\"w=:\", w)\n\n    predict_train\
  \ = X @ w\n    error_train = rmse(y_train, predict_train)\n\n    X_valid = np.array([np.power(x_valid,\
  \ k) for k in range(K + 1)])\n    X_valid = X_valid.transpose()\n    predict_valid\
  \ = X_valid @ w\n    error_valid = rmse(y_valid, predict_valid)\n\n    errors_train.append(error_train)\n\
  \    errors_valid.append(error_valid)\n\nplt.plot(errors_train, 'o-', mfc=\"none\"\
  , mec=\"b\", ms=10, c=\"b\", label=\"Training\")\nplt.plot(errors_valid, 'o-', mfc=\"\
  none\", mec=\"r\", ms=10, c=\"r\", label=\"Valid\")\nplt.legend()\nplt.xlabel(\"\
  degree\")\nplt.ylabel(\"RMSE\")\nplt.ylim(0, 1.5)\nplt.show()\n```\n\n![](img/file57.png)\n\
  \n**图 3-21 训练和测试损失曲线**\n\n可以看出，当多项式次数低于 2 时，训练误差和验证误差都相对较大，说明在训练集和验证集上的拟合效果都不好，即模型处于欠拟合状态。当多项式次数在\
  \ 3 到 4 左右时，训练误差和验证误差都相对较小。当多项式次数开始大于 5 时，训练误差持续下降，但验证误差反而增加，说明模型的泛化能力开始变差。因此，3\
  \ 次或 4 次多项式函数是一个较好的假设函数。\n\n训练集、验证集和测试集的适当大小（样本数量）应该是多少？这取决于实际问题。对于某些问题，获取样本的成本较低，样本模型可达数十万甚至数百万。例如，购物网站很容易收集大量用户购物行为数据，训练集样本数据占所有样本数据的比例可以高达\
  \ 90% 以上，而验证集和测试集占所有样本数据的比例可以低至 5% 左右，因为总样本数非常大，5% 的样本数量已经很大了。对于某些问题，获取样本的成本昂贵，总样本数量相对较少。例如，在医学影像领域，验证集和测试集占总样本数的比例会相对较高，例如高达\
  \ 20%，自然训练集的比例就会降低。对于一般规模的样本，通常可以将训练集、验证集和测试集的样本数量占所有样本数量的比例设置为 60%、20%、20%。这种比例划分不是绝对的，应根据实际问题确定。\n\
  \n### 3.2.3 学习曲线\n\n狭义上，学习曲线通常指不同数量训练样本的训练误差和验证误差（或得分）。即计算不同数量训练样本的训练误差（或得分）以及验证样本的训练误差（或得分），然后绘制训练误差（或得分）曲线和验证误差（或得分）曲线。通过对比训练曲线和验证曲线，有助于观察训练的过拟合和欠拟合情况。\n\
  \n广义上，任何有助于判断训练情况的曲线都可以称为学习曲线，例如训练损失曲线和准确率曲线。仅训练样本的曲线可用于观察训练是否收敛，但无法判断是欠拟合还是过拟合。只有验证样本的曲线才有助于判断是否过拟合或欠拟合。通常所说的学习曲线是指一条训练曲线和一条验证曲线。\n\
  \n针对前面的问题，可以为特定的假设函数（例如 9 次多项式函数）绘制训练损失曲线和验证损失曲线，观察训练集和验证集的损失（误差）如何随迭代次数变化。\n\n\
  下面的 `loss()` 函数计算模型参数对应的假设函数在样本集（`X`、`y`）上的损失，`learning_curves_trainSize()` 计算不同大小（`trainSize`）训练集的训练损失和验证损失，并绘制训练损失曲线和验证损失曲线。\n\
  \n```python\ndef loss(w, X, y):\n    X = np.hstack((np.ones((X.shape[0], 1), dtype=X.dtype),\
  \ X))  # 添加一列特征 1\n    predictions = X @ w\n    errors = predictions - y\n    return\
  \ (errors ** 2).mean() / 2\n\ndef learning_curves_trainSize(X_train, y_train, X_val,\
  \ y_val, alpha=0.3, iterations=1000):\n    train_err = np.zeros(len(y_train))\n\
  \    valid_err = np.zeros(len(y_train))\n    for i in range(len(y_train)):\n   \
  \     w_history = gradient_descent_vec(X_train[0:i + 1, :], y_train[0:i + 1], alpha,\
  \ iterations)\n        w = w_history[-1]\n        train_err[i] = loss(w, X_train[0:i\
  \ + 1, :], y_train[0:i + 1])\n        valid_err[i] = loss(w, X_val, y_val)\n\n \
  \   plt.plot(range(1, len(y_train) + 1), train_err, c=\"r\", linewidth=2)\n    plt.plot(range(1,\
  \ len(y_train) + 1), valid_err, c=\"b\", linewidth=2)\n    plt.xlabel(\"number of\
  \ training examples\", fontsize=14)\n    plt.ylabel(\"error\", fontsize=14)\n  \
  \  plt.legend([\"training\", \"validation\"], loc=\"best\")\n\n    max_err = np.max(np.array([np.max(train_err),\
  \ np.max(valid_err)]))\n    min_err = np.min(np.array([np.min(train_err), np.min(valid_err)]))\n\
  \    offset = (max_err - min_err) / 10\n    plt.axis([1, len(y_train) + 1, min_err\
  \ - offset, max_err + offset])\n    # plt.axis([1, len(y_train) + 1, 0, 100])\n\
  \    plt.grid()\n```\n\n循环中的 `i` 表示每次训练模型的训练集大小，使用 (`X_train`、`y_train`) 的 1、2、...\
  \ 直到用完所有样本训练模型，计算出的模型参数的训练损失在验证集 (`X_val`、`y_val`) 上求和为验证损失。为正弦波采样一组训练集和验证集，并测试此\
  \ `learning_curves_batchSize()`：\n\n```python\nnp.random.seed(89)\nn_pts = 100\n\
  x_train, y_train = sample(n_pts)\nx_valid, y_valid = sample(n_pts)\n\n# K = 4\n\
  K = 2\nX_train = np.array([np.power(x_train, k + 1) for k in range(K)]).transpose()\n\
  X_valid = np.array([np.power(x_valid, k + 1) for k in range(K)]).transpose()\n\n\
  plt.title(\"BatchSize Learning Curves for Linear Regression\", fontsize=16)\n\n\
  alpha = 0.3\niterations = 50000\nlearning_curves_trainSize(X_train, y_train, X_valid,\
  \ y_valid, alpha, iterations)\n\nplt.ylim(-0.5, 20)\nplt.show()\n```\n\n```\ngradient\
  \ is small enough!\niterated num is : 117\n...\n```\n\n![](img/file58.png \"fig:\"\
  )\n\n**图 3-22 不同大小训练集的训练损失**\n\n可以看出，训练集大小超过 40 后，训练损失和验证误差比较接近。因此，对于 2 次多项式假设函数，训练集的样本数量应大于\
  \ 40。\n\n对于某个特定的假设函数，也可以通过迭代学习曲线观察多少次迭代是合适的。\n\n\n\n\n\n#### 学习曲线与大坝水流量预测\n\n#####\
  \ 学习曲线迭代函数\n\n```python\ndef learning_curves_iterations(X_train, y_train, X_valid,\
  \ y_valid, alpha=0.3, iterations=10000):    \n    w_history = gradient_descent_vec(X_train,\
  \ y_train, alpha, iterations)\n    train_err = compute_loss_history(X_train, y_train,\
  \ w_history)\n    valid_err = compute_loss_history(X_valid, y_valid, w_history)\
  \ \n        \n    plt.plot(range(1, len(train_err) + 1), train_err, c=\"r\", linewidth=2)\n\
  \    plt.plot(range(1, len(train_err) + 1), valid_err, c=\"b\", linewidth=2)\n \
  \   plt.xlabel(\"iterations\", fontsize=14)\n    plt.ylabel(\"error\", fontsize=14)\n\
  \    plt.legend([\"training\", \"validation\"], loc=\"best\")\n    max_err = np.max(np.array([np.max(train_err),\
  \ np.max(valid_err)]))\n    min_err = np.min(np.array([np.min(train_err), np.min(valid_err)]))\n\
  \    offset = (max_err - min_err) / 10\n    plt.axis([1, len(train_err) + 1, min_err\
  \ - offset, max_err + offset])\n    plt.grid()\n```\n\n对于二次多项式假设函数，以下代码绘制了训练损失和验证损失随迭代次数变化的学习曲线：\n\
  \n```python\nnp.random.seed(89)\nn_pts = 100\nx_train, y_train = sample(n_pts)\n\
  x_valid, y_valid = sample(n_pts)\n\nK = 2\nX_train = np.array([np.power(x_train,\
  \ k+1) for k in range(K)]).transpose()\nX_valid = np.array([np.power(x_valid, k+1)\
  \ for k in range(K)]).transpose()\n\nplt.title(\"Iteration Learning Curves for Linear\
  \ Regression\", fontsize=16)\n\nlearning_curves_iterations(X_train, y_train, X_valid,\
  \ y_valid, 0.001, 2000)\nplt.show()\n```\n\n![Figure 3-23 二次多项式假设函数的训练损失和验证损失曲线](img/file59.png)\n\
