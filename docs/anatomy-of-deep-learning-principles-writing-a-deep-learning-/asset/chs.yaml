  \n## 3.5 逻辑回归\n\n在线性回归问题中，目标值（如餐车的利润和房价）是连续值。而某些问题（如分类问题）的目标值是离散值，即判断一个数据在几个类别中属于哪一类。例如识别一张图片是猫还是狗，从医学图像或其他测量数据判断一个人是否患癌，这些问题都是二分类问题，即需要判断一个数据属于两个类别中的哪一个。**逻辑回归**\
  \ 是线性回归的延伸，专门用于解决二分类问题。\n\n### 3.5.1 逻辑回归\n\n线性回归能解决二分类问题吗？答案是肯定的，只要设定一个阈值（如 0），线性回归输出值大于阈值\
  \ 0 的属于一类，小于阈值 0 的属于另一类。线性回归模型函数的输出值范围是 $(-\\infty, \\infty)$，而逻辑回归进一步利用 sigmoid\
  \ 函数 $\\sigma(x)$（见第 1.3 节）将输出值映射到 $(0, 1)$ 区间。这样，输出值就可以解释为输入变量属于某一类的概率。\n\n使用 sigmoid\
  \ 函数 $\\sigma(x)$ 变换线性回归的预测值，构成了逻辑回归的假设函数：\n\n$$f_{w}(x) = \\frac{1}{1 + e^{-x w}}\
  \ = \\sigma(x w) \\tag{3-30}$$\n\n利用该假设函数对样本特征及其目标值的关系进行建模，即所谓的**逻辑回归**。逻辑回归的假设函数\
  \ $f_{w}(x)$ 取值在 0 和 1 之间，可用来表示 $x$ 属于某一类的概率。如果 $x$ 是医学图像中的肿瘤大小，$f_{w}(x)$ 就可以表示\
  \ $x$ 对应的肿瘤是否为恶性的概率。\n\n若分别用 0 和 1 表示两个类别，且用 $f_{w}(x)$ 表示 $x$ 属于类别 1 的概率，则 $x$\
  \ 属于类别 0 的概率为 $1 - f_{w}(x)$。\n\n目前：\n\n$$P(y = 1|x) = f_{w}(x) = \\frac{1}{1 +\
  \ e^{-x w}} = \\sigma(x w)$$\n\n$$P(y = 0|x) = 1 - f_{w}(x) = 1 - \\frac{1}{1 +\
  \ e^{-x w}} = 1 - \\sigma(x w)$$\n\n对于一个样本 $(x, y)$，若 $y=1$，其出现的概率为 $P(y=1|x)$；若\
  \ $y=0$，其出现的概率为 $P(y=0|x)$。无论 $y$ 是 1 还是 0，$(x, y)$ 的概率都可以统一表示为 $P(y=1|x)^{y} P(y=0|x)^{1-y}$，即\
  \ $f_{w}(x)^{y} (1 - f_{w}(x))^{1-y}$。那么 $m$ 个样本同时出现的概率为：\n\n$$\\prod_{i=1}^{m}\
  \ (f_{w}(x^{i})^{y^{i}} (1 - f_{w}(x^{i}))^{1 - y^{i}})$$\n\n使该概率值最大的 $w$，能使这 $m$\
  \ 个样本以最大概率出现。因此，逻辑回归需要使该概率最大化的 $w$。因为乘法会使数值急剧变为无穷大或接近 0，为了使求解算法在数值上稳定且便于求导，通常取该概率值的负对数平均值作为代价函数，即：\n\
  \n$$\\mathcal{L}(w) = - \\frac{1}{m} \\sum_{i=1}^{m} (y^{i} \\log(f_{w}(x^{i}))\
  \ + (1 - y^{i}) \\log(1 - f_{w}(x^{i})))$$\n\n$-(y^{i} \\log(f_{w}(x^{i})) + (1\
  \ - y^{i}) \\log(1 - f_{w}(x^{i})))$ 称为样本的**交叉熵损失**。可用 $\\mathcal{L}^{(i)}$ 表示，则所有样本的交叉熵损失可表示为：\n\
  \n$$\\mathcal{L}(w) = \\frac{1}{m} \\sum_{i=1}^{m} \\mathcal{L}^{(i)}$$\n\n对于样本\
  \ $(x^{i}, y^{i})$，若其真实目标值 $y^{i}$ 为 1，且逻辑回归的预测值 $f_{w}(x^{i})$ 也为 1，则 $\\mathcal{L}^{(i)}\
  \ = -(1 \\cdot 0 + 0 \\cdot \\log 0) = 0$；若真实目标值 $y^{i}$ 为 0，且预测值 $f_{w}(x^{i})$\
  \ 也为 0，则 $\\mathcal{L}^{(i)} = -(0 \\cdot \\log 0 + 1 \\cdot \\log 1) = 0$。即当预测值与目标值一致时，该值为\
  \ 0。若不一致，因为 $y^{i}, 1-y^{i}, f_{w}(x^{i}), 1-f_{w}(x^{i})$ 均为 `(0,1)` 区间内的实数，所以\
  \ $\\mathcal{L}^{(i)}$ 是大于 0 的正数。因此，只有当预测值与目标值完全一致时，$\\mathcal{L}^{(i)}$ 才能达到最小值\
  \ 0。\n\n逻辑回归的目标是求使该损失（亦称代价）$\\mathcal{L}(w)$ 最小的 $w$。其求解算法仍为梯度下降法。为此，需计算 $\\mathcal{L}(w)$\
  \ 关于 $w$ 的梯度，即对每个 $w[j]$ 的偏导数：\n\n为了更好地求 $L(w)$ 关于 $w = (w[0], w[1], \\dots, w[K])^T$\
  \ 的偏导数，引入一些辅助符号 $z^{(i)}, f^{(i)}$：\n\n\n\n\n\n#### 逻辑回归梯度推导\n\n##### 数学公式推导\n\n\
  ##### 前向传播\n\n$$z^{(i)} = w^T x^{(i)} = w_1 x_1^{(i)} + w_2 x_2^{(i)} + \\dots +\
  \ w_K x_K^{(i)} + w_0 x_0^{(i)}$$\n\n$$f^{(i)} = \\sigma(z^{(i)})$$\n\n###### 损失函数\n\
  \n$$\\mathcal{L}^{(i)} = -\\left(y^{(i)}\\log(f^{(i)}) + (1 - y^{(i)})\\log(1 -\
  \ f^{(i)})\\right)$$\n\n$$\\mathcal{L}(w) = \\frac{1}{m}\\sum_{i=1}^{m}\\mathcal{L}^{(i)}$$\n\
  \n###### 链式法则求导\n\n$\\mathcal{L}(w)$ 可视为 $m$ 个 $\\mathcal{L}^{(i)}$ 之和，$\\mathcal{L}^{(i)}$\
  \ 是 $f^{(i)}$ 的函数，$f^{(i)}$ 是 $z^{(i)}$ 的函数，$z^{(i)}$ 是 $w = (w_1, w_2, \\dots,\
  \ w_k)^T$ 的函数。根据求导四则运算和复合函数链式法则：\n\n$$\\frac{\\partial \\mathcal{L}(w)}{\\partial\
  \ \\mathcal{L}^{(i)}} = \\frac{1}{m}$$\n\n$$\\frac{\\partial \\mathcal{L}^{(i)}}{\\\
  partial f^{(i)}} = -\\left(\\frac{y^{i}}{f^{(i)}} - \\frac{1 - y^{i}}{1 - f^{(i)}}\\\
  right) = \\frac{f^{(i)} - y^{i}}{f^{(i)}(1 - f^{(i)})}$$\n\n$$\\frac{\\partial f^{(i)}}{\\\
  partial z^{(i)}} = \\sigma(z^{(i)})(1 - \\sigma(z^{(i)})) = f^{(i)}(1 - f^{(i)})$$\n\
  \n$$\\frac{\\partial z^{(i)}}{\\partial w_j} = x_j^{(i)}$$\n\n###### 梯度公式推导\n\n\
  $$\n\\begin{aligned}\n\\frac{\\partial L(w)}{\\partial w_j} &= \\sum_{i=1}^{m} \\\
  frac{\\partial L(w)}{\\partial \\mathcal{L}^{(i)}} \\times \\frac{\\partial \\mathcal{L}^{(i)}}{\\\
  partial f^{(i)}} \\times \\frac{\\partial f^{(i)}}{\\partial z^{(i)}} \\times \\\
  frac{\\partial z^{(i)}}{\\partial w_j} \\\\\n&= \\frac{1}{m}\\sum_{i=1}^{m} \\frac{f^{(i)}\
  \ - y^{i}}{f^{(i)}(1 - f^{(i)})} \\times f^{(i)}(1 - f^{(i)}) \\times x_j^{(i)}\
  \ \\\\\n&= \\frac{1}{m}\\sum_{i=1}^{m} (f^{(i)} - y^{(i)})x_j^{(i)} \\\\\n&= \\\
  frac{1}{m}\\sum_{i=1}^{m} (f_w(x^{(i)}) - y^{(i)})x_j^{(i)} \\\\\n&= \\frac{1}{m}\\\
  sum_{i=1}^{m} x_j^{(i)}(f_w(x^{(i)}) - y^{(i)})\n\\end{aligned}\n$$\n\n因为 $f_w(x^{(i)})\
  \ - y^{(i)}$ 是一个标量，可以与向量乘法交换位置，即 $(f_w(x^{(i)}) - y^{(i)})x_j^{(i)} = x_j^{(i)}(f_w(x^{(i)})\
  \ - y^{(i)})$。\n\n可以观察到，对于一个样本 $(x, y)$，损失 $L(w)$ 对累积和 $z = x^T w$ 的梯度 $\\frac{\\\
  partial \\mathcal{L}}{\\partial z}$ 为：$f - y$。这与线性回归中方差 $\\frac{1}{2}(f - y)²$ 对\
  \ $f$ 的梯度形式相同。逻辑回归和线性回归的梯度计算公式形式一致。\n\n##### 矩阵形式表示（行向量样本）\n\n若将 $x^{(i)}$ 写为行向量，所有\
  \ $x^{(i)}$ 按行组成矩阵 $X$，目标值和预测值 $y^{(i)}, f^{(i)}$ 写为列向量：\n\n$$\nX = \\begin{bmatrix}\n\
  x^{1} \\\\\nx^{2} \\\\\n\\vdots \\\\\nx^{i} \\\\\n\\vdots \\\\\nx^{m}\n\\end{bmatrix},\\\
  quad\ny = \\begin{bmatrix}\ny^{1} \\\\\ny^{2} \\\\\n\\vdots \\\\\ny^{i} \\\\\n\\\
  vdots \\\\\ny^{m}\n\\end{bmatrix},\\quad\nf = \\begin{bmatrix}\nf_w(x^{1}) \\\\\n\
  f_w(x^{2}) \\\\\n\\vdots \\\\\nf_w(x^{i}) \\\\\n\\vdots \\\\\nf_w(x^{m})\n\\end{bmatrix}\
  \ = \\begin{bmatrix}\n\\sigma(x^{1}w) \\\\\n\\sigma(x^{2}w) \\\\\n\\vdots \\\\\n\
  \\sigma(x^{i}w) \\\\\n\\vdots \\\\\n\\sigma(x^{m}w)\n\\end{bmatrix} = \\sigma(Xw)\n\
  $$\n\n将所有偏导数 $\\frac{\\partial L(w)}{\\partial w_j} = \\frac{1}{m}\\sum_{i=1}^{m}x_j^{i}(f_w(x^{i})\
  \ - y^{i})$ 写为行向量：\n\n$$\n\\begin{aligned}\n\\nabla_w L(w) &= \\begin{bmatrix}\n\
  \\frac{\\partial L(w)}{\\partial w_0} & \\frac{\\partial L(w)}{\\partial w_1} &\
  \ \\dots & \\frac{\\partial L(w)}{\\partial w_n}\n\\end{bmatrix} \\\\\n&= \\begin{bmatrix}\n\
  \\frac{1}{m}\\sum_{i=1}^{m}x_0^{(i)}(f_w(x^{(i)}) - y^{(i)}) & \\frac{1}{m}\\sum_{i=1}^{m}x_1^{(i)}(f_w(x^{(i)})\
  \ - y^{(i)}) & \\dots & \\frac{1}{m}\\sum_{i=1}^{m}x_n^{(i)}(f_w(x^{(i)}) - y^{(i)})\n\
  \\end{bmatrix} \\\\\n&= \\frac{1}{m}\\sum_{i=1}^{m} \\begin{bmatrix}\nx_0^{(i)}(f_w(x^{(i)})\
  \ - y^{(i)}) & x_1^{(i)}(f_w(x^{(i)}) - y^{(i)}) & \\dots & x_n^{(i)}(f_w(x^{(i)})\
  \ - y^{(i)})\n\\end{bmatrix} \\\\\n&= \\frac{1}{m}\\sum_{i=1}^{m} \\begin{bmatrix}\n\
  x_0^{(i)} & x_1^{(i)} & \\dots & x_n^{(i)}\n\\end{bmatrix}(f_w(x^{(i)}) - y^{(i)})\
  \ \\\\\n&= \\frac{1}{m}\\sum_{i=1}^{m} x^{i}(f_w(x^{i}) - y^{i}) = \\frac{1}{m}\\\
  sum_{i=1}^{m} (f_w(x^{i}) - y^{i})x^{i} \\\\\n&= \\frac{1}{m}(f_w(x^{1}) - y^{1},\
  \ f_w(x^{2}) - y^{2}, \\dots, f_w(x^{m}) - y^{m}) \\begin{bmatrix}\nx^{1} \\\\\n\
  x^{2} \\\\\n\\vdots \\\\\nx^{m}\n\\end{bmatrix} \\\\\n&= \\frac{1}{m}(f - y)^T X\n\
  \\end{aligned}\n$$\n\n即梯度 $\\nabla_w L(w)$ 可表示为：\n\n$$\\nabla_w L(w) = \\frac{1}{m}(f\
  \ - y)^T X = \\frac{1}{m}(\\sigma(Xw) - y)^T X$$\n\n假设样本特征数为 $n$，可验证上述矩阵运算维度一致：\n\
  \n$$1 \\times n = 1 \\times m \\quad m \\times n$$\n\n因此，一旦得到逻辑回归的输出 $f$，即可用以下 Python\
  \ 代码计算交叉熵损失 $\\mathcal{L}$ 对模型参数 $w$ 的梯度：\n\n```python\nf = sigmoid(X @ w)     \
  \      # 计算假设函数的预测值 f(x)\nerrors = f - y              # 预测值与真实值的误差\ngradient = errors.transpose()\
  \ @ X / len(y)       # 计算梯度\n```\n\n##### 矩阵形式表示（列向量样本）\n\n若将 $x^{(i)}$ 写为列向量，所有\
  \ $x^{(i)}$ 按列组成矩阵 $X$，所有样本的目标值和预测值 $y^{(i)}, f^{(i)}$ 写为行向量：\n\n$$X = \\begin{bmatrix}\n\
  x^{1} & x^{2} & \\dots & x^{i} & \\dots & x^{m}\n\\end{bmatrix}$$\n\n$$y = \\begin{bmatrix}\n\
  y^{1} & y^{2} & \\dots & y^{i} & \\dots & y^{m}\n\\end{bmatrix}$$\n\n$$f = \\begin{bmatrix}\n\
  f_w(x^{1}) & f_w(x^{2}) & \\dots & f_w(x^{i}) & \\dots & f_w(x^{m})\n\\end{bmatrix}\
  \ = \\begin{bmatrix}\n\\sigma(x^{1}w) & \\sigma(x^{2}w) & \\dots & \\sigma(x^{i}w)\
  \ & \\dots & \\sigma(x^{m}w)\n\\end{bmatrix}$$\n\n将所有偏导数 $\\frac{\\partial L(w)}{\\\
  partial w_j} = \\frac{1}{m}\\sum_{i=1}^{m}x_j^{i}(f_w(x^{i}) - y^{i})$ 写为列向量，且 $x^{(i)}$\
  \ 也以列向量形式表示。\n\n\n\n\n\n###### 数学推导\n\n$$\n\\begin{matrix} \n{\\nabla_{w w}{L(w\
  \ w)}} & {= \\begin{bmatrix} \\frac{\\partial L(w w)}{\\partial w_{0}} \\\\ \\frac{\\\
  partial L(w w)}{\\partial w_{1}} \\\\ \\frac{\\partial L(w w)}{\\partial w_{2}}\
  \ \\\\ {...} \\\\ \\frac{\\partial L(w w)}{\\partial w_{K}} \\\\ \\end{bmatrix}\
  \ = \\begin{bmatrix} {\\frac{1}{m}\\sum\\limits_{1 = 1}^{m}x_{0}^{(i)}(f_{w w}(x\
  \ x^{(i)}) - y^{(i)})} \\\\ {\\frac{1}{m}\\sum\\limits_{1 = 1}^{m}x_{1}^{(i)}(f_{w\
  \ w}(x x^{(i)}) - y^{(i)})} \\\\ {\\frac{1}{m}\\sum\\limits_{1 = 1}^{m}x_{2}^{(i)}(f_{w\
  \ w}(x x^{(i)}) - y^{(i)})} \\\\ {...} \\\\ {\\frac{1}{m}\\sum\\limits_{1 = 1}^{m}x_{K}^{(i)}(f_{w\
  \ w}(x x^{(i)}) - y^{(i)})} \\\\ \\end{bmatrix}} \\\\ \n& {= \\frac{1}{m}\\sum\\\
  limits_{1 = 1}^{m}\\begin{bmatrix} {x_{0}^{(i)}(f_{w w}(x x^{(i)}) - y^{(i)})} \\\
  \\ {x_{1}^{(i)}(f_{w w}(x x^{(i)}) - y^{(i)})} \\\\ {x_{2}^{(i)}(f_{w w}(x x^{(i)})\
  \ - y^{(i)})} \\\\ {...} \\\\ {x_{K}^{(i)}(f_{w w}(x x^{(i)}) - y^{(i)})} \\\\ \\\
  end{bmatrix} = \\frac{1}{m}\\sum\\limits_{1 = 1}^{m}\\begin{bmatrix} x_{0}^{(i)}\
  \ \\\\ x_{1}^{(i)} \\\\ x_{2}^{(i)} \\\\ {...} \\\\ x_{K}^{(i)} \\\\ \\end{bmatrix}(f_{w\
  \ w}(x x^{(i)}) - y^{(i)})} \\\\ \n& {= \\frac{1}{m}\\sum\\limits_{i = 1}^{m}{x\
  \ x}^{i}(f_{w w}({x x}^{i}) - y^{i}) = \\frac{1}{m}\\sum\\limits_{i = 1}^{m}(f_{w\
  \ w}({x x}^{i}) - y^{i}){x x}^{i}} \\\\ \n& {= \\frac{1}{m}{X X(f f_{w w}({x x})\
  \ - y y)}^{T} = \\frac{1}{m}X X{(f f - y y)}^{T}} \\\\ \n\\end{matrix}\n$$\n\n如果按照惯例将梯度写成行向量的形式，则：\n\
  \n$$\n\\begin{matrix} \n{\\nabla_{w w}{L(w w)}} & {= \\begin{bmatrix} \\frac{\\\
  partial L(w w)}{\\partial w_{0}} & \\frac{\\partial L(w w)}{\\partial w_{1}} & \\\
  frac{\\partial L(w w)}{\\partial w_{2}} & \\cdots & \\frac{\\partial L(w w)}{\\\
  partial w_{K}} & \\\\ \\end{bmatrix} = \\frac{1}{m}{(f f - y y)}{X X}^{T}} \\\\\
  \ \n\\end{matrix}\n$$\n\n类似地，正则化项也可以添加到逻辑回归的损失函数中，即 `L(ww)` 为：\n\n$$L(w w) = - \\\
  frac{1}{m}\\sum\\limits_{i = 1}^{m}(y^{i}\\log(f_{w w}({x x}^{i})) + (1 - y^{i})\\\
  log(1 - f_{w w}({x x}^{i}))) + \\lambda \\parallel {w w} \\parallel^{2}$$\n\n相应地，`L(ww)`\
  \ 关于 `ww` 的梯度为：\n\n$$\\nabla_{w w}{L(w w)} = \\frac{1}{m}\\sum\\limits_{i = 1}^{m}(f_{w\
  \ w}({x x}^{i}) - y^{i}){x x}^{i} + 2\\lambda w w$$\n\n如果每个样本 `xx` 为行向量形式，多个样本的\
  \ `ff`、`yy` 和模型参数 `ww` 为列向量形式，则可以写成如下向量形式：\n\n$$\\nabla_{w w}{L(w w)} = \\frac{1}{m}{(f\
  \ f - y y)}^{T}X + 2\\lambda w w = \\frac{1}{m}{(\\sigma(X X w w) - y y)}^{T}X +\
  \ 2\\lambda w w$$\n\n## 3.5.2 逻辑回归的 numpy 实现\n\n#### 1. 生成数据\n\n以下代码使用 `np.random.normal()`\
  \ 生成两组服从不同正态分布的二维坐标点数据集 `Xa` 和 `Xb`，每个样本代表二维平面上的一个坐标点。`Xa` 中的样本是以中心点 (10,12) 为中心的正态分布采样点，`Xb`\
  \ 中的样本是以中心点 (5,6) 为中心的正态分布采样点。代码对这些样本进行着色，以区分它们属于哪个类别。\n\n```python\nimport numpy\
  \ as np\nimport matplotlib.pyplot as plt\n%matplotlib inline\n\n# 持久化随机数据\nnp.random.seed(0)\n\
  \nn_pts = 100\nD = 2\n\n#x0 = np.ones(n_pts)\nXa = np.array([#x0,\n            \
  \   np.random.normal(10, 2, n_pts),\n               np.random.normal(12, 2, n_pts)])\n\
  Xb = np.array([#x0,\n               np.random.normal(5, 2, n_pts),\n           \
  \    np.random.normal(6, 2, n_pts)])\n\n\nX = np.append(Xa, Xb, axis=1).T\n#y =\
  \ np.matrix(np.append(np.zeros(n_pts), np.ones(n_pts))).T\ny = (np.append(np.zeros(n_pts),\
  \ np.ones(n_pts))).T\nprint(X[::50])\nprint(y[::50])\n```\n\n```\n[[13.52810469\
  \ 15.76630139]\n     [8.20906688 11.86351679]\n     [ 4.26163632 3.3869463 ]\n \
  \    [6.04212975 4.47171215]]\n    [0. 0. 1. 1.]\n```\n\n```python\nfig, ax = plt.subplots(figsize=(4,4))\n\
  ax.scatter(X[:n_pts,0], X[:n_pts,1], color='lightcoral',\n          label='$Y =\
  \ 0$')\nax.scatter(X[n_pts:,0], X[n_pts:,1], color='blue',\n          label='$Y\
  \ = 1$')\nax.set_title('样本数据集')\nax.set_xlabel('$x_1$')\nax.set_ylabel('$x_2$')\n\
  ax.legend(loc=4);\n```\n\n![](img/file71.png \"fig:\")  \n\n图 3-35 二分类的平面点集\n\n\
  #### 2. 梯度下降法的代码实现\n\n针对这个具体问题，`x` 和 `w` 都是长度为 3 的向量，类似于线性回归，可以编写基于梯度下降法的以下求解算法：\n\
  \n```python\ndef sigmoid(z):\n    \"\"\"对输入数组 z 的每个元素应用 sigmoid 函数。\"\"\"\n    return\
  \ 1 / (1 + np.exp(-z))\n\ndef gradient_descent_logistic_reg(X, y, lambda_, alpha,\
  \ num_iters, gamma = 0.8, epsilon=1e-8):  \n    w_history = []     # 记录迭代过程中的参数\n\
  \    X = np.hstack((np.ones((X.shape[0], 1), dtype=X.dtype),X)) # 添加一列特征 1\n   \
  \ num_features = X.shape[1]\n    v = np.zeros_like(num_features)\n    w = np.zeros(num_features)\n\
  \    for n in range(num_iters):\n        predictions = sigmoid(X @ w)     # 求假设函数的预测值，即\
  \ f(x)\n        errors = predictions - y         # 预测值与真实值的误差\n        #gradient\
  \ = X.transpose() @ errors /len(y)    # 计算梯度\n        gradient = errors.transpose()\
  \ @ X /len(y)     # 计算梯度\n        loss_grad = errors /len(y)\n       \n       \n\
  \        gradient += 2*lambda_*w\n        if np.max(np.abs(gradient))<epsilon:\n\
  \            print(\"梯度足够小！\")\n            print(\"迭代次数为 :\",n)\n            break\n\
  \        #w -= alpha * gradient # 更新模型参数\n        v = gamma*v+alpha* gradient\n\
  \        w= w-v             \n        \n        #cost = - np.mean((np.log(predictions).T\
  \ * y+np.log(1-predictions).T *(1-y) ))\n        #cost_history.append(cost) \n \
  \       w_history.append(w)     \n            \n    return w_history           \
  \       # 返回优化后的参数和代价历史\n```\n\n#### 3. 计算损失函数值\n\n对于一个 `w` 和一组样本 (`X`, `y`)，可以使用以下函数计算损失函数值：\n\
  \n```python\ndef loss_logistic(w,X,y,reg=0.):   \n    f = sigmoid(X @ w[1:]+w[0])\n\
  \    loss = -np.mean((np.log(f).T * y+np.log(1-f).T *(1-y) ))\n    loss += reg*(\
  \ np.sum(np.square(w)))\n    return loss\n\ndef loss_history_logistic(w_history,X,y,reg=0.):\n\
  \    #X = np.hstack((np.ones((X.shape[0], 1), dtype=X.dtype),X)) \n    loss_history\
  \ = []\n    for w in w_history:\n        loss_history.append(loss_logistic(w,X,y,reg))\n\
  \    return loss_history\n```\n\n```python\nreg = 0.0\nalpha=0.01\niterations=10000\n\
  w_history = gradient_descent_logistic_reg(X,y,reg,alpha,iterations)\nw = w_history[-1]\n\
  print(\"w:\",w)\n\nloss_history = loss_history_logistic(w_history,X,y,reg)\nprint(loss_history[:-1:len(loss_history)//10])\n\
  ```\n\n```\n[11.3920102 -0.55377808 -0.83931251]\n    [0.6577262444936193, 0.22674637036423945,\
  \ 0.15646446608041156, 0.12698570286225014, 0.11034864425987873, 0.099493559603644\
  \ 8, 0.09177469381378582, 0.08596435646154407, 0.08141010065377204, 0.07773089221384288]\n\
  ```\n\n#### 4. 决策曲线\n\n用概率值 `fww` = 0.5 区分 2 个类别，因为 `fww` = `σ(xxww)`，所以对于一个样本 `xx`，`fww`\
  \ = 0.5 等价于 `xxww` = 0，即 `ww` 和 `pmbx` 的点积为 0，也就是 `w[0]` + `w[1]` * `x[1]` + `w[2]`\
  \ * `x[2]` = 0。\n\n\n\n\n以下代码根据 `w` 计算一组 `x[1]` 对应的 `x[2] = -w[0]/w[2] - w[1] *\
  \ x[1]/w[2]`，然后在 (`x[1]`, `x[2]`) 坐标平面上绘制这些点对应的决策线，可以看出学习到的模型能够很好地区分这两类样本。绘制的代价曲线也反映了算法的逐渐收敛。\n\
  \n```\nfig, ax = plt.subplots(nrows=1, ncols=2, figsize=(8,4))\n\nx1 = np.array([X[:,0].min()-1,\
  \ X[:,0].max()+1])\nx2 = - w.item(0) / w.item(2) + x1 * (- w.item(1) / w.item(2))\n\
  \n# Plot decision boundary???\nax[0].plot(x1, x2, color='k', ls='--', lw=2)\n\n\
  ax[0].scatter(X[:int(n_pts),0], X[:int(n_pts),1], color='lightcoral', label='$y\
  \ = 0$')\nax[0].scatter(X[int(n_pts):,0], X[int(n_pts):,1], color='blue', label='$y\
  \ = 1$')\nax[0].set_title('$x_1$ vs. $x_2$')\nax[0].set_xlabel('$x_1$')\nax[0].set_ylabel('$x_2$')\n\
  ax[0].legend(loc=4)\n\nax[1].plot(loss_history, color='r')\nax[1].set_ylim(0,ax[1].get_ylim()[1])\n\
  ax[1].set_title(r'$J(w)$ vs. Iteration')\nax[1].set_xlabel('Iteration')\nax[1].set_ylabel(r'$J(w)$')\n\
  \nfig.tight_layout()\n```\n\n![](img/file72.png)\n\n图 3-36 二分类平面点集的分类与损失曲线\n\n####\
  \ 5. 预测准确率\n\n```\n# Print accuracy\nX_1 = np.hstack((np.ones((X.shape[0], 1), dtype=X.dtype),X))\
  \   # Add a column of features 1\ny_predictions = sigmoid(X_1 @ w)>=0.5\n\nprint\
  \ ('The accuracy of the prediction is: %d ' % float((np.dot(y, y_predictions)\n\
  \                               + np.dot(1 - y,1 - y_predictions)) / float(y.size)\
  \ * 100) +'%')\n```\n\n```\nThe accuracy of the prediction is: 98 %\n```\n\n####\
  \ 6. 使用 Scikit-Learn 库进行逻辑回归\n\nScikit-Learn 包的 `linear_model` 模块提供了逻辑回归函数 `LogisticRegression()`，可用于求解上述逻辑回归问题，并能获得相同的结果。\n\
  \n```\nimport sklearn\nfrom sklearn.linear_model import LogisticRegression\nfrom\
