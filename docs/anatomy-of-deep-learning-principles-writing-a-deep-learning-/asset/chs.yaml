  \n### 3.2.5 偏差与方差\n\n\n\n\n\n#### 偏差-方差权衡\n\n如果对于某个问题，自变量（特征）$x$ 和因变量（目标值）$y$ 之间存在函数关系\
  \ $f(x)$，但该函数未知，仅有一组实际数据样本 $\\{x_i, y_i\\}$。由于采样过程中的噪声，每个实际样本的 $x, y$ 并不严格满足该函数关系\
  \ $f(x)$，即实际目标值 $y$ 与 $f(x)$ 之间存在随机误差 $\\epsilon$。通常认为该随机误差 $\\epsilon$ 服从高斯分布 $\\\
  mathcal{N}(\\mu, \\sigma²)$，即 $\\epsilon = y - f(x) \\sim \\mathcal{N}(0, \\sigma²)$。因此，$y$\
  \ 与 $f(x)$ 的关系可表示为：\n\n$$y = f(x) + \\epsilon$$\n\n即采样目标值 $y$ 与真实目标值 $f(x)$ 之间存在误差\
  \ $\\epsilon$。\n\n机器学习希望利用假设函数（如 $\\hat{f}(x)$）来逼近真实的 $f(x)$。该假设通常通过最小化实际目标值 $y_i$\
  \ 与假设函数 $\\hat{f}(x)$ 的预测目标值 $\\hat{f}(x_i)$ 之间的误差 $(y_i - \\hat{f}(x_i))²$ 来求解。\n\
  \n对于假设函数模型 $\\hat{f}(x_i)$，不同训练集和不同机器学习算法得到的具体函数 $\\hat{f}(x_i)$ 皆不相同。\n\n对于某一确定的\
  \ $x$，不同 $\\hat{f}(x_i)$ 产生的误差 $(y_i - \\hat{f}(x_i))²$ 也不同。所有可能的 $\\hat{f}(x_i)$\
  \ 该误差的平均值（期望）称为**期望误差**或**误差期望**，即 $E[(y - \\hat{f}(x))²]$。该期望误差可分解为以下三项：\n\n$$E[(y\
  \ - \\hat{f}(x))²] = (\\text{Bias}[\\hat{f}(x)])² + \\text{Var}[\\hat{f}(x)] + \\\
  sigma²$$\n\n其中：\n*   $\\text{Bias}[\\hat{f}(x)] = E[\\hat{f}(x)] - E[f(x)]$ 称为**偏差**，表示假设函数模型\
  \ $\\hat{f}(x)$ 的预测值期望与真实值之间的偏离程度。\n*   $\\text{Var}[\\hat{f}(x)] = E[\\hat{f}(x)²]\
  \ - E[\\hat{f}(x)]² = E(\\hat{f}(x) - E[\\hat{f}(x)])²$ 称为**方差**，表示假设函数模型 $\\hat{f}(x)$\
  \ 得到的不同预测值与其期望预测值的均方误差。\n\n公式推导请参考 Wikipedia：\n<https://en.wikipedia.org/wiki/Bias%E2%80%93variance_tradeoff>\n\
  \n##### 示例：常数模型与线性模型的对比\n\n假设待学习函数为 $f(x) = x + 2 \\times \\text{np.sin}(1.5 \\\
  times x)$，以下代码绘制函数曲线及从该函数采样的一组 $\\{x_i, y_i\\}$：\n\n```python\nimport numpy as np\n\
  import math\nimport matplotlib.pyplot as plt\n%matplotlib inline\n\nnp.random.seed(0)\n\
  \nf = lambda x: x + 2 * np.sin(1.5 * x)\n\ndef plot_f(pts=50):\n    x = np.linspace(0,\
  \ 10, pts)\n    f_ = f(x)\n    plt.plot(x, f_)\n\ndef sample_f(pts=8):\n    x =\
  \ np.random.uniform(0, 10, pts)\n    f_val = x + 2 * np.sin(1.5 * x)\n    y = f_val\
  \ + np.random.normal(0, 0.5, pts)  # random noise\n    return x, y\n\nplot_f()\n\
  x, y = sample_f()\nplt.scatter(x, y, s=30)  # , facecolors='none', edgecolors='r')\n\
  ```\n\n![](img/file66.png)\n\n**图 3-30** 函数 $f(x) = x + 2 \\times \\text{np.sin}(1.5\
  \ \\times x)$ 及其上的随机噪声采样坐标点\n\n### 常数假设函数 $\\hat{f}(x) = b$\n\n若使用常数函数 $\\hat{f}(x)\
  \ = b$ 作为假设函数模型逼近 $f(x)$，对训练集中每个 $\\{x_i, y_i\\}, i=1,2,\\dots,m$，$\\hat{f}(x)=b$\
  \ 的预测值均为 $b$。最小化 $\\sum_{i=1}^{m}{(b - y_i)}²$，可得：\n\n$$b = \\frac{\\sum_{i=1}^{m}y_i}{m}\
  \ = \\text{np.mean}(y_i)$$\n\n不同训练集的样本不同，因此利用不同训练集得到的 $b$（即假设函数 $\\hat{f}(x)=b$）也不同。所有不同训练集在某一点\
  \ $x$ 处得到的假设函数预测期望值与真实值之差为偏差，所有不同假设函数在该点预测值与预测期望值的均方误差为方差。\n\n以下代码使用 50 个训练集训练得到\
  \ 50 个假设函数，并计算这些假设函数在 $x=5$ 处的预测偏差与预测方差（注：代码中 `x = 18` 似为笔误，文中所述为 $x=5$，但输出结果对应\
  \ $x=18$ 处的计算）：\n\n```python\ntrain_set_num = 100\n\ndef plot_b(b):\n    x = np.linspace(0,\
  \ 10, pts)\n    hat_f = [b for i in range(pts)]\n    plt.plot(x, hat_f)\n\nbs =\
  \ []\nfor i in range(train_set_num):\n    x, y = sample_f(20)\n    plt.scatter(x,\
  \ y)\n    b = np.mean(y)\n    bs.append(b)\n    plot_b(b)\n\nplot_f()\nplt.show()\n\
  \nx = 18\nf_true = f(x)\nf_predict_mean = np.mean(bs)\nprint(\"real function value:\"\
  , f_true)\nprint(\"Predicted expected value:\", f_predict_mean)\nprint(\"Predicted\
  \ deviation:\", f_predict_mean - f_true)\nprint(\"Predicted variance:\", np.std(bs))\n\
