  plt.plot(losses)\n```\n\n\n\n\n\n## 6.5 典型卷积神经网络结构\n\n1989 年，卷积神经网络结构（CNN）的发明者 Yann\
  \ LeCun 利用反向传播（BP）算法训练多层神经网络以识别手写邮政编码。所用的神经网络于 1994 年被称为 LeNet。虽然该论文并未提及卷积或卷积神经网络，仅指出使用\
  \ 5×5 的相邻区域作为感受野。1998 年，LeCun 提出了著名的 LeNet-5 神经网络，标志着卷积神经网络的真正诞生。由于当时硬件条件的限制，卷积神经网络的训练极其消耗机器资源和时间。因此，CNN\
  \ 网络模型并未普及。\n\n直到 2012 年，Alex Krizhevsky 利用 GPU 实现了一个名为 AlexNet 的深度卷积神经网络，并赢得了 ImageNet\
  \ 图像识别竞赛的冠军，以深度卷积神经网络为代表的深度学习才开始迅速发展。随后，提出了各种神经网络结构，如 VGG、GoogLeNet、ResNet、Inception\
  \ 等。\n\n### 6.5.1 LeNet-5\n\n图 6-55 展示了 LeNet-5 的网络结构。一张 32×32×1 的图像经过六个步长为 1、填充为\
  \ 0 的 5×5 卷积核，生成 6 个尺寸为 28×28 的输出特征图；随后通过跨度为 2、大小为 2 的平均池化操作，生成六个 14×14 的特征图，即图像的长宽减半。接着通过\
  \ 16 个步长为 1、填充为 0 的 5×5 卷积核，生成 16 个尺寸为 10×10 的输出特征图。再通过跨度为 2、大小为 2 的平均池化操作，生成 16\
  \ 个 5×5 的特征图。\n\n![](img/file138.png \"fig:\")  \n图 6-55 LeNet 网络结构\n\n随后是全连接层，拥有\
  \ 120 个神经元，每个神经元接收来自上一层 16 个 5×5 特征图（图像）共 400 个特征值，每个神经元产生一个输出值，120 个神经元生成一个由 120\
  \ 个输出组成的一维向量，输出给下一个拥有 84 个神经元的全连接层。拥有 84 个神经元的全连接层将其 84 个输出送入最终的输出层，若进行 10 分类，输出层将包含\
  \ 10 个神经元，每个神经元输出样本属于对应类别的得分。这 10 个分类可通过 softmax 函数计算多类交叉熵损失并结合真实目标值来训练神经网络模型。\n\
  \nLeNet-5 是卷积神经网络的经典结构。它采用“先卷积后池化”的模式，从多通道输入生成多通道输出并减小图像尺寸。如上例所示，单通道 32×32×1 经过一系列“卷积-池化”变换，最终生成\
  \ 16 个 5×5 的特征图，最后再经过若干全连接层产生最终输出。\n\n### 6.5.2 AlexNet\n\nAlexNet 是 Alex Krizhevsky\
  \ 等人提出的一种 CNN 网络结构。它在 2012 年 ImageNet 图像分类竞赛中获得第一名，瞬间将 top-5 错误率降低了 10 个百分点以上。作者利用\
  \ CUDA GPU 实现了并行神经网络训练算法，使得在合理时间内训练深度神经网络成为可能。其网络结构如图 6-56 所示。\n\n![](img/file139.png\
  \ \"fig:\")  \n图 6-56 AlexNet 网络结构\n\n若输入为 3 通道彩色图像 227×227×3，经过步长为 4 的 96 个 11×11\
  \ 卷积核，生成 96 个 55×55 的特征图（55×55×96），因步长为 4，图像缩小了 4 倍。随后经过跨度为 2 的 3×3 最大池化层，输出 96\
  \ 个 27×27 的特征图（27×27×96），再执行步长为 1、填充为 2 的 256 个 5×5 卷积核进行“同卷积”，生成 256 个 27×27 的特征图（27×27×256），再经过跨度为\
  \ 2 的 3×3 最大池化层，输出 256 个 13×13 的特征图（13×13×256），接着用步长为 1、填充为 1 的 384 个 3×3 卷积核执行“同卷积”，生成\
  \ 384 个 13×13 的特征图（13×13×384），再进行一次相同的卷积操作。然后，用步长为 1、填充为 1 的 256 个 3×3 卷积核执行“同卷积”，生成\
  \ 256 个 13×13 的特征图（13×13×256）。再进行一次跨度为 2 的 3×3 最大池化，得到 256 个 6×6 的特征图（6×6×256）。将\
  \ 6×6×256 展平为 9216 维向量，然后输出给 4096 个神经元的全连接层，随后是另一个 4096 个神经元的全连接层，最后是 1000 个神经元的全连接层，并经\
  \ softmax 函数输出样本属于 1000 个不同类别的概率。\n\nAlexNet 与 LeNet 非常相似，但其深度和规模远大于 LeNet。LeNet\
  \ 约有 60,000 个参数，而 AlexNet 约有 6000 万个参数。AlexNet 相较于 LeNet 网络最重要的改进是使用了 Relu 激活函数，避免了深度神经网络的“梯度消失”问题。另一个提升性能的改进是\
  \ Dropout 技术，即在某一隐藏层以一定概率让部分神经元的输出为 0，不参与网络传播。每次迭代相当于定义一个不同的函数。这种正则化技术实际上利用更简单的网络函数组合来表示训练好的模型函数。此外，还提出了“局部响应归一化”，即对某一层特征图中某一位置所有通道的值进行归一化。但后来发现\
  \ LRN 作用不大。\n\nAlexNet 网络的成功使计算机视觉和人工智能界重新关注沉寂多年的神经网络，尤其是 CNN 深度卷积网络。深度可以变得更深，原理简单的深度神经网络能超越数学上复杂的人工智能技术。深度学习开始成为机器学习最重要的分支。现代人工智能主要指深度学习。\n\
  \n### 6.5.3 VGG\n\nVGG-16 网络是牛津大学视觉几何组（简称 VGG）提出的一种简化卷积网络结构。其主要贡献在于证明了增加网络深度能在一定程度上提升网络的最终性能。一般卷积网络不同卷积层的卷积核大小不一，而\
  \ VGG 网络中所有卷积核大小相同，例如使用步长为 1 的 3×3 卷积核，池化层同理，使用步长为 2 的 2×2 最大池化核。因此，它简化了卷积神经网络的结构。只要\
  \ VGG-16 网络深度足够深，就能达到与复杂神经网络结构相当甚至更好的性能。VGG-16 中的 16 表示神经网络中卷积层和全连接层共有 16 层。图 6-57\
  \ 展示了 VGG-16 的卷积网络结构。\n\n![](img/file140.png \"fig:\")  \n图 6-57 VGG 网络结构\n\n卷积核均为步长\
  \ 1 的 3×3，池化核均为步长 2 的 2×2。但初始卷积层的输出通道数为 64，后续卷积层的输出通道数按 128、256、512 的顺序翻倍。达到 512\
  \ 后，后续卷积层的输出通道数不再增加，因为 512 个通道被认为已足够大。VGG 网络结构非常规则，但所需数据量较大。后来提出了 VGG-19，但 VGG-19\
  \ 与 VGG-16 在性能上无差异。\n\n### 6.5.4 深度神经网络的梯度爆炸与消失问题\n\n极深的神经网络因梯度爆炸与消失问题而难以训练，因为梯度只能从后向前逐层传递，若一个数持续乘以绝对值小于\
  \ 1 的数，该数将越来越接近 0。设一数为`y`，连续乘以`c[i]`，最终变为`c[i] * ... * c[L] * y`，该值将趋近于 0。同理，当一个数持续乘以绝对值大于\
  \ 1 的数时，该数将越来越接近无穷大∞。\n\n考虑一个简化的神经网络，其中神经元为`z = x * w`，若有 L 层，前向计算为：\n\n```\nx →\
  \ z[1] = x * w[1] → z[2] = z[1] * w[2] = x * w[1] * w[2] → ⋯ → z[L] = z[L−1] * w[L]\
  \ = x * w[1] * w[2] ⋯ * w[L]\n```\n\n若已知损失函数关于最后一层`z[L]`的梯度为`dz[L]`，则损失函数关于`z[L−1]`的梯度`dz[L−1]\
  \ = w[L] * dz[L]`，关于`z[i]`的梯度`dz[i] = w[i+1] ⋯ w[L] * dz[L]`，损失函数关于`w[i]`的梯度`dw[i]\
  \ = dz[i] * z[i−1] = w[i+1] ⋯ w[L] * dz[L] * z[i−1]`。\n\n若`‖w[i]‖ < ρ < 1`，则随着`L−i`增大，`dz[i]`呈指数级衰减，`L−i`越大衰减越快，导致`dw[i]`的值可能变得极小，梯度过小使参数`w[i]`的更新近乎停滞，收敛变得极慢。同理，若`‖w[i]‖\
  \ > ρ > 1`，则随着`L−i`增大，`dz[i]`呈指数级增长，从而变得极大，导致参数更新剧烈震荡，无法收敛。\n\n随着神经网络深度加深，梯度爆炸与衰减不可避免，使得深度神经网络训练极其困难。为防止梯度爆炸，可使用梯度裁剪技术\
  \ L，即将梯度的绝对值限制在预定范围内。设`g`为梯度，`θ`为裁剪阈值，按以下公式裁剪梯度：\n\n`min(θ / ‖g‖, 1) * g`\n\n即将梯度值限制在`[-θ,\
  \ θ]`范围内。\n\n若`grads`包含多个权重参数的梯度，以下代码可将其梯度限制在`[-c, c]`：\n\n```\n```\n\n\n\n\n\n\
  ```python\nimport math\n\ndef grad_clipping(grads, c):\n    norm = math.sqrt(sum((grad\
  \ ** 2).sum() for grad in grads))\n    if norm > c:\n        ratio = c / norm\n\
  \        for i in range(len(grads)):\n            grads[i] *= ratio\n```\n\n\n\n\
  \n梯度裁剪在一定程度上可以解决梯度爆炸问题，但无法解决梯度消失问题。\n\n### 6.5.5 残差网络\n\n梯度爆炸和消失是由网络层始终串联连接引起的。残差网络通过“跳跃”技术打破了这种逐层的网络结构。其思想是在原本相距较远的两个网络层之间建立短路连接。就像药品，如果经过多个管理部门和经销商层层加价后才到达患者手中，患者购买的最终价格可能非常昂贵。如果厂家直销，厂家直接将药品卖给患者，成本就是出厂价。\n\
  \n图 6-58 是常见的神经网络结构：\n\n*x* = *a*^[0] → *a*^[1] → *a*^[2] ⋯ → *a*^[*i*−1] → *a*^[*i*]\
  \ → *a*^[*i*+1] ⋯ → *a*^[*L*]\n\n通常残差网络的跳跃连接非常规则，如图 6-58 所示为残差网络结构示意图：\n\n图 6-58\
  \ 残差网络结构示意图，上图为残差网络，下图为一般神经网络\n\n由于存在短路连接，反向推导的梯度可以通过这个跳跃连接直接从弧尾层反馈到弧头层，使得梯度不会因为经过多个中间层而衰减或爆炸。残差网络由中国学者何恺明等人发明。作者发现只要在不同层之间建立这些跳跃连接，就可以训练更深的神经网络。借助残差网络结构，人们甚至可以轻松训练\
  \ 1000 多层的神经网络。\n\n这种残差网络具有周期性规律，可以看作由相同结构的**残差块**组成，如图 6-60 所示为一个残差块的结构：\n\n图 6-60\
  \ 残差块是残差网络的结构单元\n\n该残差块由 2 个卷积块组成。每个卷积块先进行加权计算，再计算激活函数输出。在计算第二个卷积块的激活函数之前，该残差块将第一个卷积块的输入和第二个卷积块的加权和输出进行累加，然后通过激活函数输出。第一个卷积块的输入\
  \ *x* 经过该卷积块的加权和激活函数后输入到第二个卷积块，第二个卷积块的加权和 *F*(*x*) 与第一个卷积块的输入相加得到 *F*(*x*) + *x*，再输入到第二个卷积块的激活函数。该残差块所表示的函数\
  \ *x* → *F*(*x*) + *x* 是在原函数关系 *x* → *F*(*x*) 基础上加上了恒等函数 *x* → *x*。这将迫使 *x* → *F*(*x*)\
  \ 尽可能接近 0，即将函数 *x* → *F*(*x*) 限制在一个较小的函数子空间内，这类似于正则化对权重函数范围的限制。此外，反向推导时，第二个卷积块输出的梯度通过这个恒等函数直接传递到第一个卷积块的输入，从而避免了梯度消失问题。因此，残差网络既具有防止梯度消失的功能，又具有防止函数过于复杂的正则化功能。\n\
  \n从结构上看，如果将残差块视为像卷积块一样的整体模块，残差神经网络与普通神经网络结构相同，即残差网络是由残差块首尾相连串联而成的结构。即残差网络可表示为：\n\
  \n*F*1 + *x* = `ResBlock`[1] → *F*2 + *x* = `ResBlock`[2] → ⋯ → *F**n* + *x* = `ResBlock`[*n*]\n\
  \n其中 `ResBlock`[*i*] 表示一个残差块，普通神经网络可表示为：\n\n*F*1 = `convBlock`[1] → *F*2 = `convBlock`[2]\
  \ → ⋯ → *F**n* = `convBlock`[*n*]\n\n当然，一个残差块可能由多个卷积块组成，每个卷积块可能包含批归一化层、池化层、Dropout\
  \ 层等，即可能包含几个甚至十几个各种网络层。\n\n### 6.5.6 Google Inception 网络\n\n由于特征图中特征位置的巨大差异和变化，为卷积操作选择正确的卷积核尺寸变得非常困难。对于不同问题，网络层卷积核的尺寸是\
  \ 3×3 还是 5×5？较大的卷积核利于捕获更全局分布的信息，而较小的卷积核适合捕获更局部分布的信息。同样，对于池化层，选择池化窗口大小也是类似的问题。\n\n\
  Google Inception 网络的思想是让网络自动选择合适的卷积核尺寸或池化窗口尺寸。为实现这一目标，Inception 网络用 Inception 模块替换普通卷积层。将多个不同尺寸的卷积核（包括池化窗口）组合形成一个\
  \ Inception 模块。如图 6-61 所示：\n\n图 6-61 Inception 网络结构\n\nInception 模块的每个卷积核接受相同的输入，并使用\
  \ \"same\" 卷积方式生成不同输出通道数的特征图。这些特征图拼接成最终的特征图。如果 1×1、3×3、5×5、7×7 输出的通道数分别为 96、16、32、64，则这些特征图合成为\
  \ 96+16+32+64 通道的特征图作为输出。如图 6-62 所示：\n\n图 6-62 Inception 模块\n\n当然，Inception 模块也可以包含池化层。池化层会减小特征图尺寸。为生成与原特征图尺寸相同的池化输出特征图，采用带填充的\
  \ \"same\" 池化操作。\n\n用 Inception 模块替换普通卷积层和池化层，可以通过训练自动学习合适的模型参数，从而自动选择合适的卷积核（池化窗口）尺寸。\n\
  \n上述 Inception 模块会导致模型参数量巨大。例如，输入为 28×28×192 的张量，32 个 5×5×192 卷积核的输出张量为 28×28×32，输出张量的每个元素由\
  \ 5×5×192 的加权和计算得出，因此总共有 5×5×192×28×28×32 次乘法运算，共 120422400 次计算。\n\n为减少计算量，可以在尺寸大于\
  \ 1 的 3×3、5×5、7×7 这些卷积核之前插入一个输出通道数相对较少的 1×1 卷积核，如图 6-63 所示：\n\n图 6-63 降维简化的 Inception\
  \ 网络\n\n如果 1×1 卷积核的输出通道数为 16，即 1×1×16，虽然中间插入了额外一层，但计算量可大幅减少。例如，在上述 5×5×32 中插入 1×1×16\
  \ 后的计算量为：1×1×192×28×28×16 + 5×5×16×28×28×32 = 12443648。计算量减少了 10 倍。因为池化层总是产生与原输入相同通道数，为使池化层输出更少通道，对池化层则在其后添加这个\
  \ 1×1 卷积核。\n\n由这些 Inception 模块替换普通卷积和池化层组成的神经网络称为 **Inception 网络**。图 6-64 是著名的 googleNet，即\
  \ Inception v1 网络。基于 Inception v1，人们提出了一些改进的网络结构版本，如 Inception V2、V3 和 V4。甚至与残差网络结合。\n\
  \n图 6-64 googleNet 网络结构\n\n### 6.5.7 Network in Network (NiN)\n\n普通卷积层是输入的线性卷积操作，即对输入进行线性加权后通过非线性激活函数输出。其结构如图\
  \ a) 所示。Network in Network (NiN) “网络中的网络”用一个小网络替换这个单层线性卷积层，如图 6-65 b) 所示。\n\n图 6-65\
  \ Network in Network (NiN) “网络中的网络”用小网络替换线性卷积层\n\n除卷积层外，作者在这个小网络中增加了 2 层全连接层。作者认为可以增加网络卷积层的非线性能力。论文还使用**全局平均池化**替代传统全连接层，对每个特征图进行全局平均池化，使每个特征图只产生一个输出值。这能极大减少传统全连接层展平特征图导致的参数过多问题，并可避免模型过拟合。由于每个特征图值产生一个输出值，全局池化层的输入特征图数量必须与类别数一致。对于\
  \ 10 个类别，特征图数量必须为 10。\n\n图 6-66 Network in Network (NiN) 网络结构\n\n在之前的神经网络中，假设样本之间相互独立，不同数据的输入输出相互独立。对于样本\
  \ (*x*^(*i*), *y*^(*i*))，*y*^(*i*) 的值仅取决于其输入 *x*^(*i*)，与其他样本如 (*x*^(*j*), *y*^(*j*)),\
  \ *j* ≠ *i* 的输入输出无关。这种神经网络可称为“一对一”神经网络。\n\n但也存在一些问题，数据之间存在序列关系。例如，视频由按时间顺序生成的图像组成，文本或句子是单词序列，音乐由一系列音符组成，蛋白质序列是氨基酸序列，股票曲线包含每个时刻的价格。孤立地判断或预测序列中的单个数据是不可靠的，例如孤立理解文章中的一个词或一段话毫无意义，从视频的某张图像孤立判断视频中物体的运动情况如“某图像中的汽车是静止、前进还是后退”都是不可行的。在机器翻译中，将句子中每个词单独处理，如\
  \ \"how do you do?\" 逐字翻译成 \"how do you do it?\" 显然行不通！\n\n正如卷积神经网络能捕获数据样本特征间的空间相关性，**循环神经网络**\
  \ (**Recurrent Neural Network**, **RNN**) 是针对序列（时序）关系的、用于**序列数据**的神经网络结构。循环神经网络是一种具有状态记忆的网络，能在时间维度上记忆历史信息，具体表现为：对于某一时刻\
  \ *t*，除了当前时刻的输入数据（元素）*x*[*t*] 外，还有时刻 *t* 之前的历史信息记忆隐藏状态 *h*[*t*−1]。因此，时刻 *t* 的输入包括当前数据输入\
  \ *x*[*t*] 和历史记忆状态 *h*[*t*−1]，时刻 *t* 的输出包括预测 *y*[*t*] 和新的历史记忆状态 *h*[*t*]。隐藏状态 *h*[*t*]\
  \ 沿序列传播，理论上可包含之前所有时刻的历史信息。循环神经网络通过这种内部隐藏状态对前序历史信息的记忆来预测当前序列元素，从而对当前时刻做出更好的预测。\n\n\
  循环神经网络可用于数据间存在序列依赖的问题，如自然语言处理（机器翻译、文本生成、词性标注、文本情感分析）、语音处理（识别、合成）、音乐生成、蛋白质序列分析、视频理解分析、股票预测等。\n\
  \n## 7.1 序列问题与模型\n\n数据间存在序列关系的预测问题是基于当前时刻之前的所有序列数据来预测当前时刻的目标值。例如，基于一只股票的所有历史信息预测当前时刻的股价。若用\
  \ *x*[*t*] 表示时刻 *t* 的数据特征，*y*[*t*] 表示想要预测的时刻 *t* 的目标值。像任何监督机器学习一样，序列数据的预测是学习一个映射或函数\
  \ *f* : (*x*[1], *x*[2], ⋯, *x*[*t*]) → *y*[*t*]，即根据 *t* 时刻之前所有时刻的数据特征 (*x*[1],\
  \ *x*[2], ⋯, *x*[*t*]) 来预测 *t* 时刻的目标值 *y*[*t*]。\n\n若 *x*[*t*] 和 *y*[*t*] 是同类数据，如\
  \ *x*[*t*] 是时刻 *t* 的股价，*y*[*t*] 是时刻 *t* 预测的目标价格，即 *t*+1 时刻的价格 *y*[*t*] = *x*[*t*+1]，则此类序列数据预测问题称为**自回归**问题。\n\
  \n### 7.1.1 股票价格预测问题\n\n基于股票历史信息数据预测股价是典型的序列数据预测问题。以下代码使用 pandas 包读取 csv 格式文件 'sp500.csv'\
  \ 的股票数据：\n\n```\n```\n\n\n\n\n# 7.1.1 股票价格数据与序列预测\n\n```python\nimport pandas as\
  \ pd\n\ndata = pd.read_csv('sp500.csv')\n\ndata.head()\n```\n\n**输出：**\n\n```\n\
  Date Open High Low Close Volume\n0 03-01-00 1469.250000 1478.000000 1438.359985\
