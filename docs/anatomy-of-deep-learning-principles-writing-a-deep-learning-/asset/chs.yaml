  ```\n\n```\n(-1.9124776305480737, 1.9275223694519297)\n```\n\n![](img/file96.png)\n\
  \n图 4-27 螺旋数据点集的分类决策区域\n\n### 4.2.6 任意层神经网络反向传播的推导\n\n上述 2 层神经网络的反向传播推导过程可以扩展到任意深度（层数）神经网络的反向传播推导。即对于任意层\
  \ `l`，其加权和 $z^{[l]} = a^{[l-1]}W^{[l]} + b^{[l]}$ 通过激活函数 $g$ 产生输出 $a^{[l]} = g(z^{[l]})$。如果已知损失函数关于\
  \ $\\frac{\\partial\\mathcal{L}}{\\partial a^{[l]}}$ 的梯度，可求得 $\\frac{\\partial\\\
  mathcal{L}}{\\partial z^{[l]}} = \\frac{\\partial\\mathcal{L}}{\\partial a^{[l]}}g'(z^{[l]})$。通过\
  \ $\\frac{\\partial\\mathcal{L}}{\\partial z^{[l]}}$，可获得该层损失函数关于参数 $W^{[l]}$、$b^{[l]}$\
  \ 和 $a^{[l-1]}$ 的梯度：\n\n$$\\frac{\\partial\\mathcal{L}}{\\partial W^{[l]}} = {a^{[l\
  \ - 1]}}^{T}\\frac{\\partial\\mathcal{L}}{\\partial z^{[l]}}\\quad\\quad\\frac{\\\
  partial\\mathcal{L}}{\\partial b^{[l]}} = np.sum(\\frac{\\partial\\mathcal{L}}{\\\
  partial z^{[l]}}, axis = 0, keepdims = True)\\quad\\quad\\frac{\\partial\\mathcal{L}}{\\\
  partial a^{[l - 1]}} = \\frac{\\partial\\mathcal{L}}{\\partial z^{[l]}}{W^{[l]}}^{T}$$\n\
  \n对于多样本的向量形式，公式如下：\n\n$$\\frac{\\partial\\mathcal{L}}{\\partial Z^{[l]}} = \\frac{\\\
  partial\\mathcal{L}}{\\partial A^{[l]}}g'(Z^{[l]})$$\n\n$$\\frac{\\partial\\mathcal{L}}{\\\
  partial W^{[l]}} = {A^{[l - 1]}}^{T}\\frac{\\partial\\mathcal{L}}{\\partial Z^{[l]}}$$\n\
  \n$$\\frac{\\partial\\mathcal{L}}{\\partial b^{[l]}} = np.sum(\\frac{\\partial\\\
  mathcal{L}}{\\partial Z^{[l]}}, axis = 0, keepdims = True)$$\n\n$$\\frac{\\partial\\\
  mathcal{L}}{\\partial A^{[l - 1]}} = \\frac{\\partial\\mathcal{L}}{\\partial Z^{[l]}}{W^{[l]}}^{T}$$\n\
  \n上述公式假设输入 $x = a^{[0]}$ 和中间变量 $z^{[l-1]}$、$a^{[l-1]}$ 均采取行向量形式。\n\n下面将以列向量形式推导损失函数关于中间变量和模型参数的梯度，即假设输入数据\
  \ $x = a^{[0]}$、中间变量 $z^{[l-1]}$、$a^{[l-1]}$ 及其梯度均用列向量表示。采用列向量表示时，第 `l` 层的加权和 $z^{[l]}$\
  \ 表示为：\n\n$z^{[l]} = W^{[l]}a^{[l-1]} + b^{[l]}$\n\n此时，权重矩阵的每一行（而非每一列）代表一个神经元的权重参数。当然，加权和\
  \ $z^{[l]}$ 通过激活函数 $g$ 后也是列向量 $a^{[l]} = g(z^{[l]})$。\n\n如果该层有 `m` 个神经元，输入 $a^{[l-1]}$\
  \ 有 `n` 个值，展开加权和的向量形式：\n\n$$\n\\begin{matrix}\n{z^{[l]} = \\begin{bmatrix} z_{1}^{[l]}\
  \ \\\\ z_{2}^{[l]} \\\\ \\vdots \\\\ z_{m}^{[l]} \\\\ \\end{bmatrix} = \\begin{bmatrix}\
  \ {\\sum\\limits_{k = 1}^{n}W_{1k}^{[l]}a_{k}^{[l - 1]} + b_{1}^{[l]}} \\\\ {\\\
  sum\\limits_{k = 1}^{n}W_{2k}^{[l]}a_{k}^{[l - 1]} + b_{2}^{[l]}} \\\\ \\vdots \\\
  \\ {\\sum\\limits_{k = 1}^{n}W_{mk}^{[l]}a_{k}^{[l - 1]} + b_{m}^{[l]}} \\\\ \\\
  end{bmatrix}} \\\\\n\\end{matrix}\n$$\n\n\n\n\n#### 简单推导的符号表示\n\n对于简单推导，使用符号 `δ[j]^[l]`\
  \ 来表示损失函数关于 `z[j]^[l]` 的偏导数，即：\n\n$$\n\\delta_{j}^{(l)} = \\frac{\\partial \\mathcal{L}}{\\\
  partial z_{j}^{(l)}}\n$$\n\n第 `l` 层的第 `j` 个神经元输出一个加权和 `z[j]^[l]`，这仅与该神经元相关，与该层的其他神经元无关。因此，该神经元的权重参数\
  \ `W[jk]^[l]` 仅对 `z[j]^[l]` 有贡献，或者说依赖于 `W^[l]` 的只有第 `j` 行的 `z[j]^[l]`。因此：\n\n$$\n\
  \\frac{\\partial \\mathcal{L}}{\\partial W_{jk}^{[l]}} = \\frac{\\partial \\mathcal{L}}{\\\
  partial z_{j}^{[l]}} \\frac{\\partial z_{j}^{[l]}}{\\partial W_{jk}^{[l]}} = \\\
  delta_{j}^{(l)} \\frac{\\partial}{\\partial W_{jk}^{(l)}} \\left( \\sum_{i} W_{ji}^{[l]}\
  \ a_{i}^{(l-1)} \\right) = \\delta_{j}^{[l]} a_{k}^{[l-1]}\n$$\n\n关于 `W^[l]` 的权重值\
  \ `W[jk]^[l]` 的偏导数可以放置在一个与 `W^[l]` 形状相同的数组中。如果第 `l` 层有 `m` 个神经元，且输入 `a^[l-1]` 有\
  \ `n` 个值，则有：\n\n$$\n\\begin{matrix}\n\\frac{\\partial \\mathcal{L}}{\\partial W^{[l]}}\
  \ = \n\\begin{bmatrix}\n\\frac{\\partial \\mathcal{L}}{\\partial W_{11}^{[l]}} &\
  \ \\frac{\\partial \\mathcal{L}}{\\partial W_{12}^{[l]}} & \\cdots & \\frac{\\partial\
  \ \\mathcal{L}}{\\partial W_{1n}^{[l]}} \\\\\n\\vdots & \\vdots & \\cdots & \\vdots\
  \ \\\\\n\\frac{\\partial \\mathcal{L}}{\\partial W_{j1}^{[l]}} & \\frac{\\partial\
  \ \\mathcal{L}}{\\partial W_{j2}^{[l]}} & \\cdots & \\frac{\\partial \\mathcal{L}}{\\\
  partial W_{jn}^{[l]}} \\\\\n\\vdots & \\vdots & \\cdots & \\vdots \\\\\n\\frac{\\\
  partial \\mathcal{L}}{\\partial W_{m1}^{[l]}} & \\frac{\\partial \\mathcal{L}}{\\\
  partial W_{m2}^{[l]}} & \\cdots & \\frac{\\partial \\mathcal{L}}{\\partial W_{mn}^{[l]}}\n\
  \\end{bmatrix}\n=\n\\begin{bmatrix}\n\\delta_{1}^{[l]} a_{1}^{[l-1]} & \\delta_{1}^{[l]}\
  \ a_{2}^{[l-1]} & \\cdots & \\delta_{1}^{[l]} a_{n}^{[l-1]} \\\\\n\\vdots & \\vdots\
  \ & \\cdots & \\vdots \\\\\n\\delta_{2}^{[l]} a_{1}^{[l-1]} & \\delta_{2}^{[l]}\
  \ a_{2}^{[l-1]} & \\cdots & \\delta_{2}^{[l]} a_{n}^{[l-1]} \\\\\n\\vdots & \\vdots\
  \ & \\cdots & \\vdots \\\\\n\\delta_{m}^{[l]} a_{1}^{[l-1]} & \\delta_{m}^{[l]}\
  \ a_{2}^{[l-1]} & \\cdots & \\delta_{m}^{[l]} a_{n}^{[l-1]}\n\\end{bmatrix} \\\\\
  \n= \n\\begin{bmatrix}\n\\delta_{1}^{[l]} \\\\\n\\delta_{2}^{[l]} \\\\\n\\vdots\
  \ \\\\\n\\delta_{m}^{[l]}\n\\end{bmatrix}\n\\begin{bmatrix}\na_{1}^{[l-1]} & a_{2}^{[l-1]}\
  \ & \\cdots & a_{n}^{[l-1]}\n\\end{bmatrix}\n= \\delta^{[l]} {a^{[l-1]}}^{T}\n\\\
  end{matrix}\n$$\n\n同理：\n\n$$\n\\frac{\\partial \\mathcal{L}}{\\partial b_{j}^{[l]}}\
  \ = \\frac{\\partial L}{\\partial z_{j}^{[l]}} \\frac{\\partial z_{j}^{[l]}}{\\\
  partial b_{j}^{[l]}} = \\frac{\\partial L}{\\partial z_{j}^{[l]}} = \\delta_{j}^{[l]}\n\
  $$\n\n因此：\n\n$$\n\\frac{\\partial \\mathcal{L}}{\\partial b^{[l]}} = \\delta^{[l]}\n\
  $$\n\n#### 关于输入梯度的推导\n\n不同于 `W[jk]^[l]` 和 `b[j]^[l]`，从公式可以看出，第 `l-1` 层的输出，即第 `l`\
  \ 层输入 `a^[l-1]` 的所有分量 `a[i]^[l-1]` 都对第 `l` 层的每个神经元 `z[j]^[l]` 有贡献，如图所示。\n\n**图 4-28**\
  \ 第 `l-1` 层每个神经元的每个输出值都成为第 `l` 层每个神经元的输入\n\n因此，在计算损失函数关于 `a[k]^[l-1]` 的偏导数时，需要累加所有\
  \ `z[j]^[l]` 对它的偏导数，即：\n\n$$\n\\frac{\\partial \\mathcal{L}}{\\partial a_{k}^{[l-1]}}\
  \ = \\sum_{j=1}^{m} \\frac{\\partial \\mathcal{L}}{\\partial z_{j}^{[l]}} \\frac{\\\
  partial z_{j}^{[l]}}{\\partial a_{k}^{[l-1]}} = \\sum_{j=1}^{m} \\left( \\delta_{j}^{[l]}\
  \ \\frac{\\partial}{\\partial a_{k}^{[l-1]}} \\left( \\sum_{i} W_{jk}^{[l]} a_{k}^{[l-1]}\
  \ \\right) \\right) = \\sum_{j=1}^{m} \\left( \\delta_{j}^{[l]} W_{jk}^{[l]} \\\
  right)\n$$\n\n即 `δ^[l]` 的第 `k` 列与 `W^[l]` 的点积。如果 `W[,k]^[l]` 表示第 `k` 列，则上述公式可写成矩阵乘积形式：\n\
  \n$$\n\\frac{\\partial \\mathcal{L}}{\\partial a_{k}^{[l-1]}} = {W_{,k}^{[l]}}^{T}\
  \ \\delta^{[l]}\n$$\n\n将 `L` 关于 `a^[l-1]` 的所有梯度写成列向量形式：\n\n$$\n\\begin{matrix}\n\
  \\frac{\\partial \\mathcal{L}}{\\partial a^{[l-1]}} = \n\\begin{bmatrix}\n\\frac{\\\
  partial \\mathcal{L}}{\\partial a_{1}^{[l-1]}} \\\\\n\\frac{\\partial \\mathcal{L}}{\\\
  partial a_{2}^{[l-1]}} \\\\\n\\vdots \\\\\n\\frac{\\partial \\mathcal{L}}{\\partial\
  \ a_{n}^{[l-1]}}\n\\end{bmatrix}\n=\n\\begin{bmatrix}\n{W_{,1}^{[l]}}^{T} \\delta^{[l]}\
  \ \\\\\n{W_{,2}^{[l]}}^{T} \\delta^{[l]} \\\\\n\\vdots \\\\\n{W_{,n}^{[l]}}^{T}\
  \ \\delta^{[l]}\n\\end{bmatrix}\n= {W^{[l]}}^{T} \\delta^{[l]}\n\\end{matrix}\n\
  $$\n\n#### 核心问题：如何求解 δ\n\n问题的关键在于如何求得 $\\delta_{j}^{(l)} = \\frac{\\partial \\mathcal{L}}{\\\
  partial z_{j}^{(l)}}$？\n\n对于输出层 `L`，如“损失函数的梯度”一节所述，可以直接利用损失函数求得输出层的梯度。对于其他层（如 `l\
  \ < L` 层），已获得 $\\frac{\\partial \\mathcal{L}}{\\partial a^{[l]}}$ 及该层神经元激活函数的导数。不失一般性，假设该层神经元的激活函数均为\
  \ `g`，即 `a[i]^[l] = g(z[i]^[l])`。根据求导链式法则：\n\n$$\n\\delta_{i}^{[l-1]} = \\frac{\\\
  partial L}{\\partial z_{i}^{[l-1]}} = \\frac{\\partial L}{\\partial a_{i}^{[l-1]}}\
  \ g'(z_{i}^{[l-1]})\n$$\n\n符号 `g'(.)` 可见具有广播功能，即可作用于数组，等价于对数组每个元素分别使用，即：\n\n$$\n\
  g'(z^{[l]}) = \n\\begin{bmatrix}\ng'(z_{1}^{[l]}) \\\\\ng'(z_{2}^{[l]}) \\\\\n\\\
  vdots \\\\\ng'(z_{n}^{[l]})\n\\end{bmatrix}\n$$\n\n$$\n\\delta^{[l-1]} = \\frac{\\\
  partial L}{\\partial z^{[l-1]}} = \\frac{\\partial L}{\\partial a^{[l-1]}} \\odot\
  \ g'(z^{[l-1]})\n$$\n\n将 $\\frac{\\partial \\mathcal{L}}{\\partial a^{[l-1]}} =\
  \ {W^{[l]}}^{T} \\delta^{[l]}$ 代入上式，得到：\n\n$$\n\\delta^{[l-1]} = ({W^{[l]}}^{T}\
  \ \\delta^{[l]}) \\odot g'(z^{[l-1]})\n$$\n\n\n\n\n在反向推导过程中，不需要计算中间层关于 `a[l]` 的梯度，只需计算损失函数关于\
  \ `z[l]` 的梯度 `δ[l]`。\n\n最后需要注意的是，如果输出层不直接输出加权和 `z[L]`，而是经过激活函数 `a[L] = f(z[L])`\
  \ 输出，对于方差损失 $\\frac{1}{2} \\parallel a[L] - y \\parallel^{2}$，损失函数关于 `a[L]` 的梯度\
  \ $\\frac{\\partial\\mathcal{L}}{\\partial a[L]} = a[L] - y$，然后根据 $\\frac{\\partial\\\
  mathcal{L}}{\\partial z[L]} = \\frac{\\partial\\mathcal{L}}{\\partial a[L]}f'(z[L])$\
  \ 计算梯度 $\\frac{\\partial\\mathcal{L}}{\\partial z[L]}$。\n\n$$\n\\delta^{(L)} = \\\
  frac{\\partial L}{\\partial z[L]} = \\frac{\\partial\\mathcal{L}}{\\partial a[L]}f'(z[L])\n\
  $$\n\n对于二分类问题，激活函数 `f` 是 `σ` 函数，多分类问题则是 softmax 函数。交叉熵损失中 `a[L]` 和目标值 `y` 关于加权和\
  \ `z[L]` 的梯度 $\\frac{\\partial\\mathcal{L}}{\\partial z[L]} = a[L] - y$（多分类时 `y`\
  \ 为 one-hot 向量形式）。多样本情况下，梯度为 $\\frac{\\partial\\mathcal{L}}{\\partial Z[L]} = \\\
  frac{1}{m}(A[L] - Y)$。\n\n如果输出层直接输出加权和 `z[L]` 而不经过激活函数，则：\n\n$$\n\\delta^{(L)} =\
  \ \\frac{\\partial\\mathcal{L}}{\\partial z[L]} = f(z[L]) - y\n$$\n\n其中，回归问题 `f`\
  \ 为恒等函数（假设方差损失 $\\frac{1}{2} \\parallel z[L] - y \\parallel^{2}$），二分类或多分类 `f` 为\
  \ sigmoid 函数 `σ` 或 softmax 函数。多样本情况下，梯度为 $\\frac{\\partial\\mathcal{L}}{\\partial\
  \ Z[L]} = \\frac{1}{m}(f(Z[L]) - Y)$。\n\n输出层损失函数的梯度公式，连同以下三个公式，称为反向推导的四大公式：\n\n\
  $$\n\\begin{matrix}\n\\frac{\\partial\\mathcal{L}}{\\partial\\mathbf{W}^{(l)}} =\
  \ \\mathbf{\\delta}^{(l)}(\\mathbf{a}^{(l - 1)})^{\\text{T}} = \\begin{bmatrix}\n\
  \\delta_{1}^{(l)}a_{1}^{(l - 1)} & \\delta_{1}^{(l)}a_{2}^{(l - 1)} & \\cdots &\
  \ \\delta_{1}^{(l)}a_{k}^{(l - 1)} \\\\\n\\delta_{2}^{(l)}a_{1}^{(l - 1)} & \\delta_{2}^{(l)}a_{2}^{(l\
  \ - 1)} & \\cdots & \\delta_{2}^{(l)}a_{k}^{(l - 1)} \\\\\n\\vdots & \\vdots & \\\
  ddots & \\\\\n\\delta_{j}^{(l)}a_{1}^{(l - 1)} & \\delta_{j}^{(l)}a_{2}^{(l - 1)}\
  \ & \\cdots & \\delta_{j}^{(l)}a_{k}^{(l - 1)} \\\\\n\\end{bmatrix} \\\\\n\\frac{\\\
  partial\\mathcal{L}}{\\partial\\mathbf{b}^{(l)}} = \\mathbf{\\delta}^{(l)} \\\\\n\
  \\delta^{[l - 1]} = ({W^{[l]}}^{T}\\delta^{[l]}) \\odot g'(z^{[l - 1]})\n\\end{matrix}\n\
  $$\n\n其向量形式：\n\n$$\n\\begin{matrix}\n\\frac{\\partial\\mathcal{L}}{\\partial\\mathbf{W}^{(l)}}\
  \ = \\mathbf{\\delta}^{(l)}(\\mathbf{a}^{(l - 1)})^{\\text{T}} = \\frac{\\partial\\\
  mathcal{L}}{\\partial z[l]}(\\mathbf{a}^{(l - 1)})^{\\text{T}} \\\\\n\\frac{\\partial\\\
  mathcal{L}}{\\partial\\mathbf{b}^{(l)}} = \\mathbf{\\delta}^{(l)} = \\frac{\\partial\\\
  mathcal{L}}{\\partial z[l]} \\\\\n\\delta^{[l - 1]} = ({W^{[l]}}^{T}\\delta^{[l]})\
  \ \\odot g'(z[l - 1]) = ({W^{[l]}}^{T}\\frac{\\partial\\mathcal{L}}{\\partial z[l]})\
  \ \\odot g'(z[l - 1])\n\\end{matrix}\n$$\n\n多样本的向量形式：\n\n$$\n\\begin{matrix}\n\\\
  frac{\\partial\\mathcal{L}}{\\partial\\mathbf{W}^{(l)}} = \\frac{\\partial\\mathcal{L}}{\\\
  partial Z[l]}(\\mathbf{A}^{(l - 1)})^{\\text{T}} \\\\\n\\frac{\\partial\\mathcal{L}}{\\\
  partial\\mathbf{b}^{(l)}} = np.sum(\\frac{\\partial\\mathcal{L}}{\\partial Z[l]},\
  \ axis=1, keepdims=True) \\\\\n\\frac{\\partial\\mathcal{L}}{\\partial Z[l - 1]}\
  \ = ({W^{[l]}}^{T}\\frac{\\partial\\mathcal{L}}{\\partial Z[l]}) \\odot g'(Z[l -\
  \ 1])\n\\end{matrix}\n$$\n\n## 4.3 实现简单的深度学习框架\n\n### 4.3.1 神经网络的训练过程\n\n与其他机器学习算法一样，神经网络的训练过程包括：\n\
  \n*   **准备数据**：准备用于训练模型的样本数据集，除训练集外可能包含验证集和测试集；\n*   **确定神经网络结构**：针对具体问题设计合适的神经网络模型。模型规模过大，训练时间长且难以训练；模型规模过小，表达能力可能不足。需根据实际问题选择合适的网络结构。网络结构还包括选择何种激活函数、定义何种误差（损失）评价方法即何种损失函数；\n\
  *   **训练模型**：包括模型参数的随机初始化，以及使用梯度下降法寻找最优解。可能需要验证集协助选择合适的模型和超参数，以避免过拟合和欠拟合。\n\n与回归模型类似，神经网络也使用梯度下降算法训练模型以找到最合适的模型参数。梯度下降算法可分为三步：\n\
  \n1.  **前向传播计算模型输出和损失函数值**：\n    *   1.1 从第一层开始，依次计算各后续层的中间变量和激活输出值，直到输出层。\n   \
  \     $$Z[l] = X W[l] + b[l] = A[l-1] W[l] + b[l]$$\n        $$A[l] = gl$$\n   \
  \ *   1.2 根据不同的损失评价标准计算损失函数值\n        $$\\mathcal{L} = \\mathcal{L}(A[L], y)$$\n\
  \n2.  **反向推导**：\n    *   计算损失函数关于输出层输出的梯度，即 $\\delta^{[L]} = \\frac{\\partial\\\
  mathcal{L}}{\\partial Z^{[L]}}$\n    *   从输出层 L 一直到第 1 层，计算损失函数关于 W、b、x 的梯度 $\\\
  frac{\\partial\\mathcal{L}}{\\partial W^{[l]}}, \\frac{\\partial\\mathcal{L}}{\\\
  partial b^{[l]}}, \\frac{\\partial\\mathcal{L}}{\\partial A^{[l-1]}}, \\frac{\\\
  partial\\mathcal{L}}{\\partial Z^{[l-1]}}$。\n\n    $$\n    \\frac{\\partial\\mathcal{L}}{\\\
  partial W^{[l]}} = {A^{[l-1]}}^{T}\\frac{\\partial\\mathcal{L}}{\\partial Z^{[l]}}\n\
  \    $$\n    $$\n    \\frac{\\partial\\mathcal{L}}{\\partial b^{[1]}} = np.sum(\\\
  frac{\\partial\\mathcal{L}}{\\partial Z^{[1]}}, axis=0, keepdims=True)\n    $$\n\
  \    $$\n    \\frac{\\partial\\mathcal{L}}{\\partial A^{[l-1]}} = \\frac{\\partial\\\
  mathcal{L}}{\\partial Z^{[l]}}{W^{[l]}}^{T}\n    $$\n    $$\n    \\frac{\\partial\\\
  mathcal{L}}{\\partial Z^{[l]}} = \\frac{\\partial\\mathcal{L}}{\\partial A^{[l]}}\
  \ \\cdot g'(Z^{[l]})\n    $$\n\n3.  **更新模型参数**\n\n\n\n$$\n\\begin{matrix} \nW^{(l)}\
  \ & = W^{(l)} - \\alpha\\frac{\\partial\\mathcal{L}}{\\partial W^{(l)}} \\\\ \n\
  b^{(l)} & = b^{(l)} - \\alpha\\frac{\\partial \\mathcal{L}}{\\partial b^{(l)}} \n\
  \\end{matrix}\n$$\n\n### 4.3.2 网络层的代码实现\n\n神经网络的前向计算和反向推导是逐层进行的。为了实现通用的神经网络框架，每个神经网络层可以用一个\
  \ `Layer` 类来表示。`Layer` 类代表一个抽象的神经网络层。除了初始化构造函数 `__init__()` 外，它主要包含 2 个方法：前向计算 `forward(self,\
  \ x)` 接受输入 `x` 生成输出；反向推导 `backward(self, grad)` 接受反向传递的梯度 `grad`，`grad` 是损失函数关于其输出的梯度，来自下一层（对于最后一层，`grad`\
  \ 是损失函数关于输出层输出的梯度）。`backward()` 计算该层相关参数的梯度（如累积和 `Z` 和权重参数 `W`）。\n\n```python\n\
  class Layer:\n    def __init__(self):\n        pass\n    def forward(self, x): \
  \       \n        raise NotImplementedError\n        \n    def backward(self, grad):\
  \      \n        raise NotImplementedError\n```\n\n在 `Layer` 类的基础上，可以定义派生类 `Dense`\
  \ 来表示全连接层。所谓全连接层是指该层每个神经元都接受上一层所有的输入。`Dense` 类构造函数 `__init__()` 的参数 `input_units`、`output_units`\
  \ 和 `activation` 分别代表输入大小、输出大小和激活函数。\n\n**前向计算** `forward()` 函数根据输入 `x`、权重 `W` 和偏置\
  \ `b` 计算累积值 `Z`，然后输入激活函数 `g` 计算输出值 `A`。即：\n\n$$Z^{[l]} = X W^{[l]} + b^{[l]} = A^{[l-1]}\
  \ W^{[l]} + b^{[l]}$$\n\n$$A^{[l]} = g^{[l]}(Z^{[l]})$$\n\n**反向计算（反向推导）** 接受损失函数关于输出值\
  \ `A` 的梯度 $\\frac{\\partial L}{\\partial A^{[l]}}$，计算损失函数关于 `W`、`b`、`x` 的梯度 $\\\
  frac{\\partial L}{\\partial Z^{[l]}}$、$\\frac{\\partial L}{\\partial W^{[l]}}$、$\\\
  frac{\\partial L}{\\partial A^{[l-1]}}$。\n\n因为代码中无法输入偏导数或梯度符号，用 `dA^{[l]}`、`dZ^{[l]}`、`dW^{[l]}`、`db^{[l]}`\
  \ 分别表示 $\\frac{\\partial L}{\\partial A^{[l]}}$、$\\frac{\\partial L}{\\partial Z^{[l]}}$、$\\\
  frac{\\partial L}{\\partial W^{[l]}}$、$\\frac{\\partial L}{\\partial b^{[l]}}$。\n\
  \n这些梯度的公式表达为：\n\n$$dZ^{[l]} = dA^{[l]} \\cdot g'(Z^{[l]})$$\n\n$$dW^{[l]} = (A^{[l-1]})^T\
  \ dZ^{[l]}$$\n\n$$db^{[l]} = \\texttt{np.sum}(dZ^{[l]}, \\texttt{axis}=0, \\texttt{keepdims}=\\\
  texttt{True})$$\n\n$$dA^{[l-1]} = dZ^{[l]} (W^{[l]})^T$$\n\n以下是网络层代码的实现：\n\n```python\n\
  class Layer:\n    def __init__(self):\n        pass\n    def forward(self, x): \
  \       \n        raise NotImplementedError\n        \n    def backward(self, grad):\
  \      \n        raise NotImplementedError\n\nclass Dense(Layer):\n    def __init__(self,\
  \ input_dim, out_dim, activation=None): \n        super().__init__()\n        self.W\
  \ = np.random.randn(input_dim, out_dim) * 0.01  # 0.01 * np.random.randn\n     \
  \   self.b = np.zeros((1, out_dim))  # np.zeros(out_dim)     \n      \n        self.activation\
  \ = activation\n        self.A = None\n        \n    def forward(self, x):\n   \
  \     # f(x) = xw+b\n        self.x = x\n        Z = np.matmul(x, self.W) + self.b\n\
  \        self.A = self.g(Z)       \n        return self.A\n    \n    def backward(self,\
  \ dA_out):\n        # backpropagation    \n        A_in = self.x       \n      \
  \  dZ = self.dZ_(dA_out)\n        \n        self.dW = np.dot(A_in.T, dZ)\n     \
  \   self.db = np.sum(dZ, axis=0, keepdims=True)          \n        dA_in = np.dot(dZ,\
  \ np.transpose(self.W))    \n        return dA_in\n    \n    def g(self, z):\n \
  \       if self.activation == 'relu':\n            return np.maximum(0, z)  \n \
  \       elif self.activation == 'sigmoid':\n            return 1 / (1 + np.exp(-z))\
  \ \n        else:\n            return z\n        \n    def dZ_(self, dA_out):\n\
  \        if self.activation == 'relu':\n            grad_g_z = 1. * (self.A > 0)\
  \     # should actually be 1. * (self.Z > 0), but both are equivalent\n        \
  \    return np.multiply(dA_out, grad_g_z)\n        elif self.activation == 'sigmoid':\n\
  \            grad_g_z = self.A * (1 - self.A) \n            return np.multiply(dA_out,\
  \ grad_g_z)\n        else:\n            return dA_out\n```\n\n可以测试该神经网络层 `Dense`\
  \ 的 `forward()` 函数：\n\n```python\nimport numpy as np\nnp.random.seed(1)\nx = np.random.randn(3,\
  \ 48)      # 3 samples, 3 channels, each channel is a 4x4 image\ndense = Dense(48,\
  \ 10, 'none')\no = dense.forward(x)\nprint(o.shape)\nprint(o)\n```\n\n```\n(3, 10)\n\
  [[-0.03953509 -0.00214997  0.00743433 -0.16926214 -0.05162853  0.06734225\n  -0.00221485\
  \ -0.11710758 -0.07046456  0.02609659]\n [ 0.00848392  0.08259757 -0.09858177  0.0374092\
  \  -0.08303008  0.04151241\n  -0.01407859 -0.02415486  0.04236149  0.0648261 ]\n\
  \ [-0.13877363 -0.04122276 -0.00984716 -0.03461381  0.11513754  0.1043094\n   0.00170353\
  \ -0.00449278 -0.0057236  -0.01403174]]\n```\n\n### 4.3.3 网络层的梯度测试\n\n只有确保神经网络的前向和反向推导正确，神经网络模型才能进一步训练。通过比较，如果两者误差很小，说明解析梯度的计算基本正确，可以放心进行下一步。\n\
  \n以下代码假设 `f` 是多元参数 `p` 的函数，即给定 `p` 可以计算函数值 `f(p)`。如果已知损失函数 $\\mathcal{L}$ 关于 `f`\
  \ 的梯度 $\\frac{\\partial \\mathcal{L}}{\\partial f}$，则可以在此基础上计算损失函数 $\\mathcal{L}$\
  \ 关于 `p` 的梯度。即：\n\n$$\\frac{\\partial \\mathcal{L}}{\\partial p} = \\frac{\\partial\
  \ \\mathcal{L}}{\\partial f} \\frac{\\partial f}{\\partial p}$$\n\n用 `grad` 和 `df`\
  \ 分别表示 $\\frac{\\partial \\mathcal{L}}{\\partial p}$、$\\frac{\\partial \\mathcal{L}}{\\\
  partial f}$，即：\n\n$$\\texttt{grad} = \\texttt{df} \\frac{\\partial f}{\\partial\
  \ p}$$\n\n如果 `f` 包含多个输出值，即 $f(p) = (f_1(p), f_2(p), \\dots, f_n(p))^T$ 是多元参数 `p`\
  \ 的向量值函数，如果已知损失函数 $\\mathcal{L}$ 关于 `f` 的梯度，也可以根据链式求导法则计算 $\\mathcal{L}$ 关于 `p`\
  \ 的梯度，即关于每个参数 $p_j$ 的偏导数：\n\n$$\\frac{\\partial \\mathcal{L}}{\\partial p_j} = \\\
  sum_i \\frac{\\partial \\mathcal{L}}{\\partial f_i} \\frac{\\partial f_i}{\\partial\
  \ p} = \\sum_i \\texttt{df}_i \\frac{\\partial f_i}{\\partial p_j}$$\n\n在已知 $\\\
  frac{\\partial \\mathcal{L}}{\\partial f_i}$ 的情况下，可以根据上式用数值求导求出 $\\frac{\\partial\
  \ \\mathcal{L}}{\\partial p_j}$，即对 $\\frac{\\partial f_i}{\\partial p_j}$ 进行数值求导：\n\
  \n$$\\frac{\\partial f_i}{\\partial p_j} \\simeq \\frac{f_i(p_j + \\epsilon) - f_i(p_j\
  \ - \\epsilon)}{2\\epsilon}$$\n\n即：\n\n\n\n\n#### 数值梯度验证\n\n$$\n\\frac{\\partial\\\
  mathcal{L}}{\\partial p_{j}} = \\sum\\limits_{i}\\frac{\\partial\\mathcal{L}}{\\\
  partial f_{i}}\\frac{f_{i}(p + \\epsilon) - f_{i}(p - \\epsilon)}{2\\epsilon} =\
  \ \\frac{\\partial\\mathcal{L}}{\\partial f} \\cdot \\frac{f(p_{j} + \\epsilon)\
  \ - f(p_{j} - \\epsilon)}{2\\epsilon} = df \\cdot \\frac{f(p_{j} + \\epsilon) -\
  \ f(p_{j} - \\epsilon)}{2\\epsilon}\n$$\n\n其中，`f` 是网络层 `dense` 的 `forward()` 输出。如果使用\
  \ `f = dense.forward(x)` 来表示该函数的计算，该函数的计算依赖于某个参数 `p`，则损失函数对参数 `p` 的导数可以通过以下函数实现：\n\
  \n```\ndef numerical_gradient_from_df(f, p, df, h=1e-5):\n  grad = np.zeros_like(p)\n\
  \  it = np.nditer(p, flags=['multi_index'], op_flags=['readwrite'])\n  while not\
  \ it.finished:\n    idx = it.multi_index\n    \n    oldval = p[idx]\n    p[idx]\
  \ = oldval + h\n    pos = f()    # Recall f() to calculate its output after a dependent\
  \ parameter p[idx] of f changes\n    p[idx] = oldval - h\n    neg = f()    # Recall\
  \ f() to calculate its output after a dependent parameter p[idx] of f changes\n\
  \    p[idx] = oldval\n       \n    grad[idx] = np.sum((pos - neg) * df) / (2 * h)\n\
  \    # grad[idx] = np.dot((pos - neg), df) / (2 * h)\n    it.iternext()\n  return\
  \ grad\n```\n\n以下代码首先模拟 `dense` 输出的损失函数梯度 `df`，然后调用 `dense.backward(df)` 反向传播 `dense`\
  \ 模型参数的梯度。输出 `dx` 是 `dense` 输入 `x` 的梯度 `dx`，然后使用上述数值梯度函数 `numerical_gradient_from_df`\
  \ 计算关于 `x` 的数值梯度 `dx_num`，最后比较 `dx` 和 `dx_num` 的误差：\n\n```\ndf = np.random.randn(3,\
  \ 10)\ndx = dense.backward(df)\ndx_num = numerical_gradient_from_df(lambda: dense.forward(x),\
  \ x, df)\n\ndiff_error = lambda x, y: np.max(np.abs(x - y)) \nprint(diff_error(dx,\
  \ dx_num))\n```\n\n```\n2.1851062625977136e-12\n```\n\n数值梯度与解析梯度之间的误差非常小，表明 `backward()`\
  \ 计算的解析梯度和数值梯度几乎相同。我们也可以比较 `dense` 模型参数的梯度是否一致。以下代码检查 `dense` 模型参数 `W` 的梯度是否一致：\n\
  \n```\ndW_num = numerical_gradient_from_df(lambda: dense.forward(x), dense.W, df)\n\
  print(diff_error(dense.dW, dW_num))\n```\n\n```\n2.2715163083830703e-12\n```\n\n\
  说明模型参数的数值梯度和解析梯度也非常接近。因此，可以判断解析梯度的代码基本正确。\n\n### 4.3.4 神经网络类\n\n在层的基础上，可以定义一个表示整个神经网络的\
  \ `NeuralNetwork` 类：\n\n```\nclass NeuralNetwork:   \n    def __init__(self):\n\
  \        self._layers = []\n \n    def add_layer(self, layer):       \n        self._layers.append(layer)\n\
  \    \n    def forward(self, X):    \n        self.X = X\n        for layer in self._layers:\
  \           \n            X = layer.forward(X)      \n        return X     \n  \
  \  \n    def predict(self, X):        \n        p = self.forward(X)\n     \n   \
  \     if p.ndim == 1:     # single sample\n            return np.argmax(p)\n   \
  \     \n        # multiple samples\n        return np.argmax(p, axis=1)\n  \n\n\
  \    def backward(self, loss_grad, reg=0.):\n        for i in reversed(range(len(self._layers))):\n\
  \            layer = self._layers[i] \n            loss_grad = layer.backward(loss_grad)\n\
  \            \n        for i in range(len(self._layers)):\n            self._layers[i].dW\
  \ += 2 * reg * self._layers[i].W\n    \n    def reg_loss(self, reg):\n        loss\
  \ = 0\n        for i in range(len(self._layers)):\n            loss += reg * np.sum(self._layers[i].W\
  \ * self._layers[i].W)\n        return loss\n    \n    def update_parameters(self,\
  \ learning_rate):\n        for i in range(len(self._layers)):  \n            self._layers[i].W\
  \ += -learning_rate * self._layers[i].dW\n            self._layers[i].b += -learning_rate\
  \ * self._layers[i].db \n            \n    def parameters(self):\n        params\
  \ = []\n        for i in range(len(self._layers)):\n            params.append(self._layers[i].W)\n\
  \            params.append(self._layers[i].b)\n        return params\n    \n   \
  \ def grads(self):\n        grads = []\n        for i in range(len(self._layers)):\n\
  \            grads.append(self._layers[i].dW)\n            grads.append(self._layers[i].db)\n\
  \        return grads\n```\n\n有了网络层 `Layer` 和神经网络类 `NeuralNetwork`，就可以为实际问题（如二维平面点集分类问题）定义一个两层神经网络模型：\n\
  \n```\nnn = NeuralNetwork()\nnn.add_layer(Dense(2, 100, 'relu'))\nnn.add_layer(Dense(100,\
  \ 3, 'softmax'))\n```\n\n对于多分类问题，可以使用之前的 `softmax_cross_entropy()` 和 `cross_entropy_grad`\
  \ 来计算多分类交叉熵损失的梯度和加权和：\n\n```\nX_temp = np.random.randn(2, 2)\ny_temp = np.random.randint(3,\
  \ size=2)\nF = nn.forward(X_temp)\nloss = softmax_cross_entropy(F, y_temp)\nloss_grad\
  \ = cross_entropy_grad(F, y_temp)\nprint(loss, np.mean(loss_grad))\n```\n\n```\n\
  1.098695480580774 -9.25185853854297e-18\n```\n\n### 4.3.5 神经网络梯度测试\n\n为确保神经网络的前向计算、损失函数计算和反向导数计算正确，可以将数值梯度与解析梯度进行比较。\n\
  \n```\nimport util\n\n# 根据损失函数在输出上的梯度 loss_grad 计算模型参数的梯度\nnn.backward(loss_grad)\n\
  grads = nn.grads()\n\ndef loss_fun():\n    F = nn.forward(X_temp)\n    return softmax_cross_entropy(F,\
  \ y_temp)\n\nparams = nn.parameters()\nnumerical_grads = util.numerical_gradient(loss_fun,\
  \ params, 1e-6)\n\nfor i in range(len(params)):\n    print(numerical_grads[i].shape,\
  \ grads[i].shape)\n  \n\ndef diff_error(x, y):\n  return np.max(np.abs(x - y)) \n\
  \ndef diff_errors(xs, ys):\n    errors = []\n    for i in range(len(xs)):\n    \
  \    errors.append(diff_error(xs[i], ys[i]))\n    return np.max(errors)\n\ndiff_errors(numerical_grads,\
  \ grads)\n```\n\n```\n(2, 100) (2, 100)\n(1, 100) (1, 100)\n(100, 3) (100, 3)\n\
  (1, 3) (1, 3)\n2.3017241064515748e-10\n```\n\n数值梯度与解析梯度之间的误差非常小，表明解析梯度基本正确。以下是梯度下降算法的代码：\n\
  \n```\ndef cross_entropy_grad_loss(F, y, softmax_out=False, onehot=False):\n   \
  \ if softmax_out:\n        loss = cross_entropy_loss(F, y, onehot)\n    else:  \
  \  \n        loss = softmax_cross_entropy(F, y, onehot)\n    loss_grad = cross_entropy_grad(F,\
  \ y, onehot, softmax_out)\n    return loss, loss_grad\n    \ndef train(nn, X, y,\
  \ loss_function, epochs=10000, learning_rate=1e-0, reg=1e-3, print_n=10):\n    for\
  \ epoch in range(epochs):\n        f = nn.forward(X)        \n        loss, loss_grad\
  \ = loss_function(f, y)        \n        loss += nn.reg_loss(reg)\n        \n  \
  \      nn.backward(loss_grad, reg)\n      \n        nn.update_parameters(learning_rate);\
  \        \n       \n        if epoch % print_n == 0:\n            print(\"iteration\
  \ %d: loss %f\" % (epoch, loss)) \n```\n\n对于训练样本 `(X, y)`，梯度下降法的每次迭代首先计算前向输出 `f\
  \ = nn.forward(X)`，然后计算损失函数关于输出的梯度 `loss, loss_grad = loss_function(f, y)`，接着基于该梯度通过反向传播计算模型参数的梯度\
  \ `nn.backward(loss_grad, reg)`，最后更新模型参数 `nn.update_parameters(learning_rate)`。\n\
  \n使用上述数据训练集训练模型并输出模型预测的准确率：\n\n\n\n\n\n## 代码示例：螺旋数据集训练\n\n```python\nimport data_set\
  \ as ds\n\nnp.random.seed(89)\nX, y = ds.gen_spiral_dataset()\n\nepochs = 10000\n\
  learning_rate = 1e-0\nreg = 1e-4\nprint_n = epochs // 10\ntrain(nn, X, y, loss_gradient_softmax_crossentropy,\
  \ epochs, learning_rate, reg, print_n)\nprint(np.mean(nn.predict(X) == y))\n```\n\
  \n```\niteration 0: loss 1.098749\niteration 1000: loss 0.199245\niteration 2000:\
  \ loss 0.129508\niteration 3000: loss 0.116411\niteration 4000: loss 0.110031\n\
  iteration 5000: loss 0.105776\niteration 6000: loss 0.103647\niteration 7000: loss\
  \ 0.102508\niteration 8000: loss 0.101521\niteration 9000: loss 0.100991\n0.9933333333333333\n\
  ```\n\n上述 `train()` 函数使用训练集中的所有样本一起训练。通常使用批量梯度下降算法 `train_batch()`，即每次从训练集中取一部分样本进行训练。第\
  \ 2.6 节定义的迭代器函数 `data_iter` 可用于此目的（代码在 Python 文件 `data_set.py` 中）。使用 `train_batch()`\
  \ 重新训练：\n\n```python\ndef data_iter(X, y, batch_size, shuffle=False):\n    m = len(X)\n\
  \    indices = list(range(m))\n    if shuffle:  # shuffle 为 True 时打乱顺序\n       \
  \ np.random.shuffle(indices)\n    for i in range(0, m - batch_size + 1, batch_size):\n\
  \        batch_indices = np.array(indices[i: min(i + batch_size, m)])\n        yield\
  \ X.take(batch_indices, axis=0), y.take(batch_indices, axis=0)\n\n\ndef train_batch(nn,\
  \ XX, YY, loss_function, epochs=10000, batch_size=50, learning_rate=1e-0, reg=1e-3,\
  \ print_n=10):\n    iter = 0\n    for epoch in range(epochs):\n        for X, y\
  \ in data_iter(XX, YY, batch_size, True):\n            f = nn.forward(X)\n     \
  \       loss, loss_grad = loss_function(f, y)\n            loss += nn.reg_loss(reg)\n\
  \n            nn.backward(loss_grad, reg)\n\n            nn.update_parameters(learning_rate)\n\
  \n            if iter % print_n == 0:\n                print(\"iteration %d: loss\
  \ %f\" % (iter, loss))\n            iter += 1\n```\n\n### 使用批量梯度下降训练 2 层神经网络\n\n\
  ```python\nnn = NeuralNetwork()\nnn.add_layer(Dense(2, 100, 'relu'))\nnn.add_layer(Dense(100,\
