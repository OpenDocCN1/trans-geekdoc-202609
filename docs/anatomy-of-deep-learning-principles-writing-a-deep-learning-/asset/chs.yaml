  \n```python\nX_temp = np.c_[Xrot_reduced, np.zeros(pts) ]\nreProjX = np.dot(X_temp,\
  \ U.transpose())  \nplt.plot(reProjX[:,0],reProjX[:,1],'o')\nplt.axis('equal')\n\
  plt.show()\n```\n\n![](img/file118.png \"fig:\")  \n\n图 5-18 投影并降维后的数据反投影到原始数据的主轴上，保留了原始数据的主要特征\n\
  \n可以看出，降维后的数据仍保留了原始数据的主要信息。\n\n##### 2 白化\n\n数据样本可能有多个特征，这些特征的方差可能差异很大，即不同特征的发散程度不同，导致不同特征对机器学习算法的影响不同。特征之间往往存在相关性，具有相关性的不同特征会对机器学习产生相互制约的影响。这就像一个人被拉向不同方向而不知所措。\n\
  \n白化操作是指降低样本特征的相关性，并使这些特征具有相同的方差。将特征除以其标准差可以达到使特征具有相同方差的目的，而 PCA 投影可以消除特征间的相关性。因此，白化通常是这两种技术的结合，即先进行\
  \ PCA 特征投影以消除特征相关性，再将每个特征除以其特征方差。结合 PCA 的白化操作称为 PCA 白化。\n\n\n\n\n与归一化类似，白化可以提高机器学习算法的性能。前面的代码已对原始数据\
  \ `X` 进行投影以获得投影后的 `Xrot`；即 `Xrot` 的特征相互独立，然后执行除以标准差的操作以完成白化操作。由于原始数据仅为 2 维，为了观察白化操作的效果，未对数据进行降维。\n\
  \n```\nXwhite = Xrot / np.sqrt(S + 1e-5)    # 白化操作：将数据特征除以\n                   \
  \                  # 标准差，使所有特征具有相似的方差\nplt.plot(Xwhite[:,0],Xwhite[:,1],'o')\nplt.axis('equal')\n\
  plt.show()\n```\n\n![](img/file119.png \"fig:\")  \n\n**图 5-19** 白化操作的结果\n\n白化操作后，两个主轴分量具有相同的方差。您可以添加数据点以进一步观察白化操作的效果，如下面的代码所示：\n\
  \n```\npts = 1000\nx = np.random.randn(pts,1)                 # 随机采样一些 x 坐标\ny =\
  \ x+2+ np.random.randn(pts,1)*0.2\nX = np.stack((x.flatten(), y.flatten()), axis=-1)\n\
  \nfig = plt.gcf()\nfig.set_size_inches(12, 4, forward=True)\nplt.subplot(1,2,1)\n\
  plt.plot(X[:,0],X[:,1],'o')\nplt.axis('equal')\nX -= np.mean(X, axis = 0)\ncov =\
  \ np.dot(X.T, X) / X.shape[0]\nU,S,V = np.linalg.svd(cov)\nXrot = np.dot(X, U) \n\
  Xwhite = Xrot / np.sqrt(S + 1e-5)\nreProjX = np.dot(Xwhite, U.transpose())  \nplt.subplot(1,2,2)\n\
  plt.plot(reProjX[:,0],reProjX[:,1],'o')\nplt.axis('equal')\nplt.show()\n```\n\n\
  ![](img/file120.png \"fig:\")  \n\n**图 5-20** 具有更多数据点的白化操作结果\n\n白化使样本的所有特征具有相同的方差，这样机器学习就不会因方差差异而偏向某个特征，从而可以提高机器学习算法的性能。\n\
  \n## 5.2 参数调试\n\n### 5.2.1 权重初始化\n\n对于回归问题，模型的权重通常初始化为 0。对于神经网络，如果权重参数初始化为 0，一层中的所有神经元将学习到相同的参数；即一层中的所有神经元是同一个函数。神经网络退化为每层仅有一个神经元的线性序列（如图\
  \ 5-21 所示）。\n\n**图 5-21** 神经网络退化为每层仅有一个神经元的线性序列\n\n**图 5-22** 2 层神经网络\n\n以图 5-22\
  \ 所示的 2 层神经网络为例。由于初始权重值为 0，隐藏层和输出层中所有神经元的输入权重值均为 0。假设同一层神经元的激活函数相同：\n\n`a^[2] =\
  \ g(a^[1]W^[2] + b^[2])`\n\n反向推导时，可得：\n\n`∂L/∂a^[1] = ∂L/∂z^[2] (W^[2])^T = ∂L/∂a^[2]\
  \ g'(z^[2]) (W^[2])^T`\n\n`∂L/∂W^[2] = (A^[1])^T ∂L/∂z^[2] = (A^[1])^T ∂L/∂a^[2]\
  \ g'(z^[2])`\n\n因此，隐藏层中每个神经元的 `∂L/∂a_i^[1]` 都相同。同理，`∂L/∂W_i^[w]` 也相同。以此类推，每一层都相同。\n\
  \n因为同一层中每个神经元的模型参数梯度 `dW` 将相同。当使用 `W = W - lr * dW` 更新模型参数时，每个参数 `W` 也将完全相同。再次迭代时，同一层中每个神经元的输出又相同，因此反向推导时梯度\
  \ `dW` 仍相同。无论迭代多少次，同一层中所有神经元都具有相同的权重参数；即它们表示同一个函数；即它们都是对称的。\n\n显然，这种神经网络的表达能力非常有限，每层中的多个神经元毫无意义。神经网络应打破这种对称性，使每个神经元从输入中提取不同的特征。解决方法是给这些权重赋予随机初始化值。从上述反向推导公式可知，偏置参数\
  \ `b` 对模型参数和输入的梯度计算没有影响。因此，通常只需随机初始化权重参数，并将偏置参数设为 0 即可。上述简单神经网络可按如下方式初始化其模型参数：\n\
  \n```\nW1 = np.random.randn(2,2)*0.01 \nb1 = np.zeros((1,2))\nW2 = np.random.randn(2,1)*0.01\
  \ \nb2 = np.zeros((1,1))\n```\n\n将权重参数乘以一个较小的数，类似于数据归一化预处理，使神经元的加权求和输出不会过大，因为对于较大的值\
  \ `x`，激活函数 `sigmoid(x)` 或 `tanh(x)` 处于饱和状态；即该点的导数（梯度）接近 0，激活函数梯度过小会导致反向推导过程中模型参数的梯度变得越来越小，导致模型参数更新缓慢，这就是**梯度消失**问题。根据反向推导，过大的值也会使梯度变得非常大；即**梯度爆炸**。\n\
  \n权重初始化值是否越小越好？因为神经元输入的梯度（如 `∂L/∂a^[1]`）与权重（`W^[2]`）成正比，过小的权重参数也会使关于输入的梯度过小，这在反向推导过程中也会导致“梯度消失”。如果权重参数的初始值过小，例如接近\
  \ 0，也会在一定程度上导致上述神经元的对称性问题。因此，通常权重参数用均值为 0、标准差为 0.01 的高斯分布进行初始化。\n\n上述初始化权重的神经元输出方差将随输入值的数量而变化。神经元输出的方差不应取决于输入值数量的常数值。否则，随着层数增加，方差会越来越大。为此，可将权重参数除以输入数量的平方根，使神经元输出的方差归一化为\
  \ 1；即代码 `w = np.random.randn(n)/sqrt(n)` 初始化权重参数，其中 `n` 是该神经元的输入值数量。\n\n如果 `x =\
  \ (x[1], ..., x[i], ..., x[n])` 是一个输入样本，`n` 是其特征值的数量，`z` 是神经元的输出值，则 `z` 的方差与 `x`\
  \ 的方差关系如下：\n\n```\nVar(z) = Var(∑ᵢⁿ wᵢ xᵢ)\n       = ∑ᵢⁿ Var(wᵢ xᵢ)\n       = ∑ᵢⁿ\
  \ [E(wᵢ)]² Var(xᵢ) + E[xᵢ]² Var(wᵢ) + Var(xᵢ) Var(wᵢ)\n```\n\n最后一个等式应用了方差的性质：如果两个随机变量\
  \ `X`、`Y` 独立，则：\n\n`Var(XY) = [E(X)]² Var(Y) + [E(Y)]² Var(X) + Var(X) Var(Y)`\n\
  \n\n\n假设输入和权重的均值为 0，即 `E[x[i]] = E[w[i]] = 0`，则：\n\n$$\n\\begin{matrix} \nVar(z)\
  \ & = \\sum\\limits_{i}^{n} Var(x_{i}) Var(w_{i}) \\\\ \n& = (n Var(w)) Var(x) \\\
  \\ \n\\end{matrix}\n$$\n\n输出值的方差 `Var(z)` 不仅与输入值的方差 `Var(x)` 和权重的方差 `Var(w)` 成正比，还与输入值\
  \ `x[i]` 的数量 `n` 成正比。\n\n当输出方差等于输入方差时，即 `Var(z) = Var(x)`，也就是说输入数据 `x` 通过神经元后，输出方差不会变大或变小，从而使神经元的输入和输出保持稳定。\n\
  \n为了使 `Var(z) = Var(x)`，`Var(w)` 应为 $\\frac{1}{n}$。根据 `Var(aX) = a² Var(X)`，如果 `w`\
  \ 从标准正态分布采样，则 `Var(w) = 1`，将 `w` 乘以常数 $a = \\frac{1}{\\sqrt{n}}$，则 `Var(aw) = a²\
  \ Var(w) = 1`。因此，权重可以用以下代码初始化：\n\n```\nw = np.random.randn(n) * sqrt(1.0/n) \n```\n\
  \n根据类似的分析，一些论文提出了其他不同的参数方法，例如 Glorot 将标准正态分布的权重参数 `w` 乘以 $\\sqrt{2/(n_{in} + n_{out})}$，使得\
  \ `Var(w) = 2/(n[in] + n[out])`，其中 `n[in]`、`n[out]` 分别是网络层的输入和输出向量。其目的是使梯度在反向传播过程中方差不变。当然，这两项的结合会相互影响，导致正向和反向推导的方差实际上都会发生变化。\n\
  \n权重也可以服从均匀分布：$w \\sim U\\lbrack - \\frac{\\sqrt{6}}{\\sqrt{n_{in} + n_{out}}},\
  \ \\frac{\\sqrt{6}}{\\sqrt{n_{in} + n_{out}}}\\rbrack$，et al. 提出的这种权重初始化方法称为 **Xavier\
  \ 初始化**，其代码实现如下：\n\n```\nimport numpy as np\nimport math\n\ndef calculate_fan_in_and_fan_out(tensor):\n\
  \    if len(tensor.shape) < 2:\n        raise ValueError(\"tensor with fewer than\
  \ 2 dimensions\")\n    if len(tensor.shape) == 2:\n        fan_in, fan_out = tensor.shape\n\
  \    else:  # F, C, kH, kW\n        num_input_fmaps = tensor.shape[1]   # size(1)\
  \  F, C, H, W\n        num_output_fmaps = tensor.shape[0]  # size(0)\n        receptive_field_size\
  \ = tensor[0][0].size\n        fan_in = num_input_fmaps * receptive_field_size\n\
  \        fan_out = num_output_fmaps * receptive_field_size   \n    return fan_in,\
  \ fan_out\n\ndef xavier_uniform(tensor, gain=1.):    \n    fan_in, fan_out = calculate_fan_in_and_fan_out(tensor)\n\
  \    std = gain * math.sqrt(2.0 / float(fan_in + fan_out))\n    bound = math.sqrt(3.0)\
  \ * std  \n    tensor[:] = np.random.uniform(-bound, bound, tensor.shape)\n\ndef\
  \ xavier_normal(tensor, gain=1.):\n    fan_in, fan_out = calculate_fan_in_and_fan_out(tensor)\n\
  \    std = gain * math.sqrt(2.0 / float(fan_in + fan_out))\n    tensor[:] = np.random.normal(0,\
  \ std, tensor.shape)\n```\n\n其中，函数 `calculate_fan_in_and_fan_out()` 用于计算网络层（神经元）的输入特征数和输出特征数，`gain`\
  \ 是权重的可选缩放因子，默认为 1。\n\n对于使用 ReLU 作为激活函数的神经元，目前更常用 Kaiming He 的权重初始化方法，即将标准正态分布采样的权重乘以\
  \ $\\sqrt{2/n}$，代码如下：\n\n```\nw = np.random.randn(n) * sqrt(2.0/n) \n```\n\n对于使用\
  \ ReLU 激活函数的网络层，其偏置参数 `b` 建议设置为非零常数（如 0.01），这可以使该激活函数在训练开始时影响梯度，但将偏置设置为非零值是否真的能提高算法性能尚无定论。\n\
  \n以下是 Kaiming 方法的实现代码：\n\n```\ndef calculate_gain(nonlinearity, param=None):   \n\
  \    linear_fns = ['linear', 'conv1d', 'conv2d', 'conv3d', 'conv_transpose1d', 'conv_transpose2d',\
  \ 'conv_transpose3d']\n    if nonlinearity in linear_fns or nonlinearity == 'sigmoid':\n\
  \        return 1\n    elif nonlinearity == 'tanh':\n        return 5.0 / 3\n  \
  \  elif nonlinearity == 'relu':\n        return math.sqrt(2.0)\n    elif nonlinearity\
  \ == 'leaky_relu':\n        if param is None:\n            negative_slope = 0.01\n\
  \        elif not isinstance(param, bool) and (isinstance(param, int) or isinstance(param,\
  \ float)):           \n            negative_slope = param\n        else:\n     \
  \       raise ValueError(\"negative_slope {} not a valid number\".format(param))\n\
  \        return math.sqrt(2.0 / (1 + negative_slope ** 2))\n    else:\n        raise\
  \ ValueError(\"Unsupported nonlinearity {}\".format(nonlinearity))\n        \ndef\
  \ kaiming_uniform(tensor, a=0, mode='fan_in', nonlinearity='leaky_relu'):\n    fan_in,\
  \ fan_out = calculate_fan_in_and_fan_out(tensor)\n    if mode == 'fan_in':     \
  \  \n        fan = fan_in\n    else: \n        fan = fan_out\n        \n    gain\
  \ = calculate_gain(nonlinearity, a)\n    std = gain / math.sqrt(fan)\n    bound\
  \ = math.sqrt(3.0) * std  \n    tensor[:] = np.random.uniform(-bound, bound, tensor.shape)\n\
  \ndef kaiming_normal(tensor, a=0, mode='fan_in', nonlinearity='leaky_relu'):\n \
  \   fan_in, fan_out = calculate_fan_in_and_fan_out(tensor)\n    if mode == 'fan_in':\
  \     \n        fan = fan_in\n    else: \n        fan = fan_out\n    \n    gain\
  \ = calculate_gain(nonlinearity, a)\n    std = gain / math.sqrt(fan)\n    bound\
  \ = math.sqrt(3.0) * std  # Calculate uniform bounds from standard deviation   \
  \ \n    tensor[:] = np.random.normal(0, std, tensor.shape)\n```\n\n`calculate_gain()`\
  \ 用于 Kaiming He 方法（也称 Kaiming 方法或 He 方法）中的某个系数。例如，ReLU 的值为 $\\sqrt{2}$，tanh 的值为\
  \ 5.0/3。`kaiming_uniform()` 和 `kaiming_normal()` 分别使用均匀分布和高斯分布随机值的 Kaiming 方法。\n\
  \n以下函数 `kaiming()` 根据参数选择 `kaiming_uniform()` 或 `kaiming_normal()` 方法：\n\n```\n\
  def kaiming(tensor, method_params=None):\n    method_type, a, mode, nonlinearity\
  \ = 'uniform', 0, 'fan_in', 'leaky_relu'\n    if method_params:\n        method_type\
  \ = method_params.get('type', \"uniform\")\n        a = method_params.get('a', 0)\n\
  \        mode = method_params.get('mode', 'fan_in')\n        nonlinearity = method_params.get('nonlinearity',\
  \ 'leaky_relu')\n    if method_type == \"uniform\":\n        kaiming_uniform(tensor,\
  \ a, mode, nonlinearity)\n    else:\n        kaiming_normal(tensor, a, mode, nonlinearity)\
  \   \n```\n\n以下代码测试上述参数初始化方法：\n\n```\nw = np.empty((2, 3))\nprint(w)\n\nxavier_uniform(w)\n\
  print(\"xavier_uniform:\", w)\nxavier_normal(w)\nprint(\"xavier_normal:\", w)\n\n\
  kaiming_uniform(w)\nprint(\"kaiming_uniform:\", w)\nkaiming_normal(w)\nprint(\"\
  kaiming_normal:\", w)\n```\n\n输出：\n\n```\n[[17.2 17.2 17.2]\n [17.2 17.2 24.2]]\n\
  xavier_uniform: [[ 0.026289 -1.09114298 -0.48792212]\n [-0.3313437 -0.47333989 -0.90713322]]\n\
  xavier_normal: [[ 0.93298795 0.07044394 -0.00270454]\n [ 0.44167298 -1.01942638\
  \ 0.45699115]]\nkaiming_uniform: [[-1.21534711 -1.27523387 0.80492134]\n [0.81222595\
  \ -1.11076413 -0.29943563]]\nkaiming_normal: [[-0.98492851 0.24745387 0.53676485]\n\
  \ [ 1.27654978 1.52143405 0.87124828]]\n```\n\n此外，还可以向 `NeuralNetwork` 类添加辅助函数 `apply(self,\
  \ init_params_fn)` 以初始化其所有层参数，这可以方便地对神经网络的多层进行初始化，例如使用 `kaiming_normal()` 方法初始化所有层的参数。\n\
  \n```\ndef apply(self, init_params_fn):\n    for layer in self._layers:        \
  \    \n        init_params_fn(layer)\n```\n\n### 5.2.2 优化参数\n\n\n\n\n#### Key Parameters\
  \ and Optimization Strategies for Gradient Descent\n\nThe most important parameter\
  \ in gradient descent is the **learning rate** (usually denoted by `α` or `η`).\
  \ For a specific neural network architecture, an excessively large or small learning\
  \ rate is the most critical factor affecting whether the algorithm can converge.\
  \ One can try parameters of different orders of magnitude (e.g., `0.1`, `0.01`,\
  \ `0.0001`, etc.) and select a suitable learning rate in conjunction with visualizing\
  \ the loss curve or learning curve.\n\nBesides the learning rate, one should also\
  \ try different parameter optimization strategies, such as famous parameter optimization\
  \ methods like **Momentum**, **RMSprop**, **Adam**, etc. These optimization methods\
  \ may also have hyperparameters similar to the learning rate; similar methods can\
  \ be used to try and select appropriate hyperparameters.\n\nFor **Batch Gradient\
  \ Descent** (often referred to as Mini-batch Gradient Descent in this context),\
  \ one can consider different batch sizes and select a batch size that balances time\
  \ efficiency and model quality for model training.\n\nAdditionally, some special\
  \ techniques (such as the **Dropout** technique mentioned later) may also have hyperparameters\
  \ that need tuning. Parameter tuning (including network architecture parameters)\
  \ is a task that requires long-term practice and experience accumulation. One also\
  \ needs to learn from others' neural network parameter tuning experiences and tips\
  \ online to avoid blind exploration.\n\n## 5.3 Batch Normalization\n\nData standardization\
  \ preprocessing normalizes different features of the data into a standard distribution\
  \ with a mean of 0 and equal variance, avoiding data overflow caused by large values\
  \ and \"feature bias\" caused by features of different scales, allowing the learning\
  \ algorithm to converge faster with a higher learning rate. Despite this, as data\
  \ undergoes transformations through neural network layers, especially as the number\
  \ of layers deepens, its distribution deviates further and further from the standard\
  \ normal distribution. Since the backpropagation calculation of gradients is a process\
  \ of continuous multiplication of gradients across different layers, if the values\
  \ are too large or too small, it easily leads to **gradient explosion** or **vanishing\
  \ gradients**, making training increasingly difficult.\n\n### 5.3.1 What is Batch\
  \ Normalization?\n\nTo solve this problem, **Batch Normalization** (abbreviated\
  \ as **BN**) was proposed to normalize the intermediate outputs of network layers.\
  \ The BN operation of a certain network layer usually normalizes the weighted sum\
  \ and then generates the activation value through the activation function `ϕ`; that\
  \ is, it is an operation inserted between the weighted operation and the activation\
  \ function. If the weighted sum operation of a certain network layer is `z = xW\
  \ + b`, then after the BN operation, the activation function is executed to output\
  \ the activation value:\n\n`ϕ(BN(z)) = ϕ(BN(xW + b))`\n\nAs mentioned before, the\
  \ weighted sum is regarded as a separate layer (i.e., a Fully Connected layer),\
  \ and the activation function is regarded as a separate activation layer. The BN\
  \ operation can be viewed as a separate Batch Normalization layer (BN layer) inserted\
  \ between them.\n\nSimply normalizing `z` to a standard normal distribution `\U0001D4A9\
  (0, 1)` would limit the model's expressive power, because no matter how the previous\
  \ layers transform, the output of this layer would always follow a standard normal\
  \ distribution. The BN operation introduces learnable parameters `β` and `γ` representing\
  \ the mean and mean squared error (variance), transforming the features normalized\
  \ to the standard normal distribution `\U0001D4A9(0, 1)` into a normal distribution\
  \ `\U0001D4A9(β, γ)`. Since both `β` and `γ` are learnable parameters, the problem\
  \ of reducing the model's expressive power is avoided.\n\nThe BN layer takes the\
  \ weighted sum `z` output by the fully connected layer as input, calculates the\
  \ mean and variance of each feature of these `z`s, normalizes each feature of `z`\
  \ to the standard normal distribution `\U0001D4A9(0, 1)` based on the mean and variance,\
  \ and then uses the learnable parameters `β` and `γ` to transform it into a normal\
  \ distribution `\U0001D4A9(β, γ)`.\n\nWhen there is no ambiguity, the letter `x`\
  \ is used to refer to the `z` that needs BN normalization. For a batch of samples\
  \ `ℬ = x[1], x[2], ⋯, x[m]`, BN normalization first calculates the mean `μ[ℬ]` and\
  \ variance `σ[ℬ]` of this batch of samples, and then scales and shifts them using\
  \ the learnable parameters `γ` and `β`:\n\n$$\n\\begin{matrix}\n\\mu_{B} & {= \\\
  frac{1}{m}\\sum\\limits_{i = 1}^{m}x_{i}} \\\\\n\\sigma_{B}^{2} & {= \\frac{1}{m}\\\
  sum\\limits_{i = 1}^{m}(x_{i} - \\mu_{B})^{2}} \\\\\n\\hat{x_{i}} & {= \\frac{x_{i}\
  \ - \\mu_{B}}{\\sqrt{\\sigma_{B}^{2} + \\epsilon}}} \\\\\ny_{i} & {= \\gamma \\\
  odot x_{i} + \\beta} \\\\\n\\end{matrix}\n$$\n\nIf each row of matrix `X` represents\
  \ a data point, the following code can be used to calculate the mean `mean` and\
  \ variance `var` of each feature of the data:\n\n```python\nmean = X.mean(axis=0)\n\
  var = ((X - mean) ** 2).mean(axis=0)\n```\n\nThat is, calculating the mean and variance\
  \ along the row direction. Of course, numpy's `var()` function can also be used\
  \ to calculate the variance:\n\n```python\nvar = np.var(X, axis=0)\n```\n\nIt is\
  \ assumed here that each data point `x[i]` is a vector or a 1D array, i.e., `X`\
  \ is a 2D array or matrix. Later we will see that data may be multi-dimensional\
  \ arrays (e.g., multi-channel images). Whether `x[i]` is a 1D or multi-dimensional\
  \ array, each of its elements is treated as a feature. For multi-dimensional `x[i]`,\
  \ numpy's `reshape()` function can be used to flatten it into a 1D array (vector),\
  \ so that `X` remains a 2D array (matrix). The following code ensures `x[i]` is\
  \ flattened into a 1D vector:\n\n```python\nn_X = X.shape[0]\nX_flat = X.ravel().reshape(n_X,\
  \ -1)  # X_flat = X.reshape(n_X, -1)\n```\n\nThe following is the forward computation\
  \ code for batch normalization:\n\n```python\nn_X = X.shape[0]\nX_flat = X.ravel().reshape(n_X,\
  \ -1)\nmu = np.mean(X_flat, axis=0)\nvar = np.var(X_flat, axis=0)\nX_norm = (X_flat\
  \ - mu) / np.sqrt(var + 1e-8)\nout = gamma * X_norm + beta\nreturn out.reshape(self.X_shape)\n\
  ```\n\nSince neural network training usually adopts **Mini-batch Gradient Descent**\
  \ (often referred to as Batch Gradient Descent in context), each gradient descent\
  \ step uses a small batch of samples to update model parameters. Therefore, batch\
  \ normalization does not calculate the mean and mean squared error of the entire\
  \ training set samples, but calculates the mean and mean squared error using a small\
  \ batch of samples during the training process, hence the name **Batch Normalization**.\n\
  \nDuring prediction, the forward computation of data also needs to be processed\
  \ by the BN layer, but it does not need and should not perform the BN operation\
  \ again. This requires using the determined BN layer mean, variance, and parameters\
  \ (such as `β`, `γ`) from the training process for transformation. However, the\
  \ mean and mean squared error calculated at each iteration step during the iteration\
  \ process are different; the mean and variance used for prediction should not rely\
  \ solely on the result of a certain iteration step. For this, one can average the\
  \ means and mean squared errors of all iteration steps, usually using the **Moving\
  \ Average** method to calculate the moving mean and variance.\n\nIf `running_mu`\
  \ and `running_var` represent the moving averages of the mean and variance during\
  \ the training process, the calculation code is as follows:\n\n```python\nrunning_mu\
  \ = momentum * running_mu + (1 - momentum) * mu\nrunning_var = momentum * running_var\
  \ + (1 - momentum) * var\n```\n\n\n\n\n即对当前均值和方差的移动平均与当前样本的均值和方差进行简单的加权平均。动量参数 `momentum`\
  \ 表示移动平均的比例。\n\n预测时的前向计算可以通过移动平均和公式进行变换：\n\n```\nX_flat = X.ravel().reshape(X.shape[0],-1)\n\
  #### normalization\nX_hat = (X_flat - running_mean) / np.sqrt(running_var + eps)\n\
  #### translate and pan\nout = self.gamma * X_hat + self.beta    \n```\n\n### 5.3.2\
  \ 批归一化的反向推导\n\n如果已知外部函数 `f` 对 BN 层输出 `z` 的梯度，则可以根据链式求导法则计算损失函数 `f` 对 `x`、`β` 和 `γ`\
  \ 的梯度。\n\n由 $z = \\gamma \\odot \\hat{\\mathbf{x}} + \\beta$，可得：\n\n$\\frac{\\partial\
  \ f}{\\partial\\beta} = \\sum\\limits_{i = 1}^{m}\\frac{\\partial f}{\\partial z_{i}}\\\
  frac{\\partial z_{i}}{\\partial \\beta} = \\sum\\limits_{i = 1}^{m}\\frac{\\partial\
  \ f}{\\partial z_{i}}$\n\n$\\frac{\\partial f}{\\partial\\gamma} = \\sum\\limits_{i\
  \ = 1}^{m}\\frac{\\partial f}{\\partial z_{i}}\\frac{\\partial z_{i}}{\\partial\
  \ \\gamma} = \\sum\\limits_{i = 1}^{m}\\frac{\\partial f}{\\partial z_{i}} \\cdot\
  \ {\\hat{x}}_{i}$\n\n$\\frac{\\partial f}{\\partial{\\hat{x}}_{i}} = \\frac{\\partial\
  \ f}{\\partial z_{i}} \\cdot \\frac{\\partial z_{i}}{\\partial{\\hat{x}}_{i}} =\
  \ \\frac{\\partial f}{\\partial z_{i}} \\cdot \\gamma$\n\n如何根据已知的 $\\frac{\\partial\
  \ f}{\\partial{\\hat{x}}_{i}}$ 求 $\\frac{\\partial f}{\\partial x_{i}}$？\n\n因为 ${\\\
  hat{x}}_{i} = \\frac{(x_{i} - \\mu)}{\\sqrt{\\sigma^{2} + \\epsilon}}$，其中 $\\mu$、$\\\
  sigma^{2}$ 也是 $x$ 的函数，所以：\n\n$\\frac{\\partial f}{\\partial x_{i}} = \\frac{\\partial\
  \ f}{\\partial{\\hat{x}}_{i}} \\cdot \\frac{\\partial{\\hat{x}}_{i}}{\\partial x_{i}}\
  \ + \\frac{\\partial f}{\\partial\\mu} \\cdot \\frac{\\partial\\mu}{\\partial x_{i}}\
  \ + \\frac{\\partial f}{\\partial\\sigma^{2}} \\cdot \\frac{\\partial\\sigma^{2}}{\\\
  partial x_{i}}$\n\n由以下公式：\n\n${\\hat{x}}_{i} = \\frac{(x_{i} - \\mu)}{\\sqrt{\\\
  sigma^{2} + \\epsilon}}$\n\n$\\sigma^{2} = \\frac{1}{m}\\sum\\limits_{i = 1}^{m}(x_{i}\
  \ - \\mu)^{2}$\n\n$\\mu = \\frac{1}{m}\\sum\\limits_{i = 1}^{m}x_{i}$\n\n可得：\n\n\
  $\\frac{\\partial{\\hat{x}}_{i}}{\\partial x_{i}} = \\frac{1}{\\sqrt{\\sigma^{2}\
  \ + \\epsilon}}$\n\n$\\frac{\\partial\\mu}{\\partial x_{i}} = \\frac{1}{m}$\n\n\
  $\\frac{\\partial\\sigma^{2}}{\\partial x_{i}} = \\frac{2(x_{i} - \\mu)}{m}$\n\n\
  因此有：\n\n$\\frac{\\partial f}{\\partial x_{i}} = (\\frac{\\partial f}{\\partial{\\\
  hat{x}}_{i}}\\frac{1}{\\sqrt{\\sigma^{2} + \\epsilon}}) + (\\frac{\\partial f}{\\\
  partial\\mu}\\frac{1}{m}) + (\\frac{\\partial f}{\\partial\\sigma^{2}}\\frac{2(x_{i}\
  \ - \\mu)}{m})$\n\n其中之一：\n\n$\\frac{\\partial f}{\\partial\\sigma^{2}} = \\frac{\\\
  partial f}{\\partial\\hat{x}} \\cdot \\frac{\\partial\\hat{x}}{\\partial\\sigma^{2}}\
  \ = \\frac{\\partial f}{\\partial\\hat{x}} \\cdot ( - 0.5(x - \\mu) \\cdot (\\sigma^{2}\
  \ + \\epsilon)^{- 1.5}) = - (0.5\\sum\\limits_{j = 1}^{m}\\frac{\\partial f}{\\\
  partial{\\hat{x}}_{j}}(x_{j} - \\mu)(\\sigma^{2} + \\epsilon)^{- 1.5})$\n\n$\\frac{\\\
  partial f}{\\partial\\mu} = (\\sum\\limits_{i = 1}^{m}\\frac{\\partial f}{\\partial{\\\
  hat{x}}_{i}} \\cdot \\frac{- 1}{\\sqrt{\\sigma^{2} + \\epsilon}}) + (\\frac{\\partial\
  \ f}{\\partial\\sigma^{2}} \\cdot \\frac{1}{m}\\sum\\limits_{i = 1}^{m} - 2(x_{i}\
  \ - \\mu))$\n\n### 5.3.3 批归一化的代码实现\n\n以下代码用一个类封装了 BN 层的前向计算和反向推导：\n\n```\nfrom NeuralNetwork\
  \ import *\n\nclass BatchNorm_1d(Layer):\n    def __init__(self,num_features,gamma_beta_method\
  \ = None,eps = 1e-8,momentum = 0.9):\n       # self.d_X, self.h_X, self.w_X = X_dim\n\
  \       # self.gamma = np.ones((1, int(np.prod(X_dim)) ))\n       # self.beta =\
  \ np.zeros((1, int(np.prod(X_dim))))\n       # self.params = [self.gamma,self.beta]\n\
  \        super().__init__()\n        self.eps= eps\n        self.momentum = momentum\n\
  \        if not gamma_beta_method:\n            self.gamma = np.ones((1, num_features\
  \ ))\n            self.beta = np.zeros((1, num_features ))             \n      \
  \  else:\n            self.gamma = np.random.randn(1, num_features)\n          \
  \  self.beta =  np.random.randn(1, num_features)  #np.zeros((1, num_features ))\
  \ \n         \n        self.running_mu = np.zeros((1, num_features ))  \n      \
  \  self.running_var = np.zeros((1, num_features )) \n        \n        self.params\
  \ = [self.gamma,self.beta]\n        self.grads = [np.zeros_like(self.gamma),np.zeros_like(self.beta)]\n\
  \n   def forward(self,X,training = True):\n        if training:\n            self.n_X\
  \ = X.shape[0]\n            self.X_shape = X.shape\n\n            self.X_flat =\
  \ X.ravel().reshape(self.n_X,-1)\n            self.mu = np.mean(self.X_flat,axis=0)\n\
  \            self.var = np.var(self.X_flat, axis=0)   # var = 1 / float(N) * np.sum((x\
  \ - mu) ** 2, axis=0)\n            self.X_hat = (self.X_flat - self.mu)/np.sqrt(self.var\
  \ +self.eps)\n            out = self.gamma * self.X_hat + self.beta\n\n        \
  \    # Compute the moving average of means and variances\n            running_mu,\
  \ running_var, momentum = self.running_mu, self.running_var, self.momentum\n   \
  \         running_mu = momentum * running_mu + (1 - momentum) * self.mu\n      \
  \      running_var = momentum * running_var + (1 - momentum) * self.var\n      \
  \  else:\n            X_flat = X.ravel().reshape(X.shape[0],-1)\n            # Normalization\n\
  \            X_hat = (X_flat - running_mean) / np.sqrt(running_var + eps)\n    \
  \        # zoom and pan\n            out = self.gamma * X_hat + self.beta\n    \
  \    return out.reshape(self.X_shape)\n\n    \n    def __call__(self,X):\n     \
  \   return self.forward(X)\n\n    def backward(self,dout):\n        eps = self.eps\n\
  \        dout = dout.ravel().reshape(dout.shape[0],-1)\n        X_mu = self.X_flat\
  \ - self.mu\n        var_inv = 1./np.sqrt(self.var + eps)\n        \n        dbeta\
  \ = np.sum(dout,axis=0)\n        dgamma = np.sum(dout * self.X_hat, axis=0) #dout\
  \ * self.X_hat\n\n        dX_hat = dout * self.gamma\n        dvar = np.sum(dX_hat\
  \ * X_mu,axis=0) * -0.5 * (self.var + eps)**(-3/2)           \n        dmu = np.sum(dX_hat\
  \ * (-var_inv) ,axis=0) + dvar * 1/self.n_X * np.sum(-2.* X_mu, axis=0)\n      \
  \  dX = (dX_hat * var_inv) + (dmu / self.n_X) + (dvar * 2/self.n_X * X_mu)     \
  \   \n        dX = dX.reshape(self.X_shape)\n        \n        self.grads[0] +=\
  \ dgamma\n        self.grads[1] += dbeta\n        return dX#, dgamma, dbeta\n  \
  \   \n```\n\n对于这个 `BatchNorm` 类，以下代码使用数值梯度检查解析梯度是否正确：\n\n```\n# diff_error = lambda\
  \ x, y: np.max(np.abs(x - y)) \nfrom util import *\nimport numpy as np \n\ndiff_error\
  \ = lambda x, y: np.max(np.abs(x - y)) \n\nnp.random.seed(231)\nN, D = 100, 5\n\
  x = 3 * np.random.randn(N, D) + 5\n\nbn = BatchNorm_1d(D,\"no\")\nx_norm = bn(x)\n\
  \ndo = np.random.randn(N, D)+0.5\ndx = bn.backward(do)\n\ndx_num = numerical_gradient_from_df(lambda\
  \ :bn.forward(x),x,do)\nprint(diff_error(dx,dx_num))\n\nif False:\n    dx_gamma\
  \ = numerical_gradient_from_df(lambda :bn.forward(x),bn.gamma,do)\n    print(diff_error(dgamma,dx_gamma))\n\
  \n    dx_beta = numerical_gradient_from_df(lambda :bn.forward(x),bn.beta,do)\n \
  \   print(diff_error(dbeta,dx_beta))\n```\n\n```\n7.684454184087031e-10\n```\n\n\
  在下面的卷积神经网络中，输入样本（如彩色图像）通常是一个三维张量 $C \\times H \\times W$，其中 $C$、$H$ 和 $W$ 分别是通道数（彩色图像的）、高度、宽度；一批样本是一个四维张量\
  \ $N \\times C \\times H \\times W$，其中 $N$ 是样本数量。上述代码可以重写以处理这种 4D 张量输入，以下代码是针对每个通道进行批归一化，而不是针对每个（像素）特征：\n\
  \n\n\n\n#### 批量归一化实现\n\n```python\nclass BatchNorm(Layer):\n    def __init__(self,\
  \ num_features, gamma_beta_method=None, eps=1e-5, momentum=0.9, std=0.02):\n   \
  \     super().__init__()\n        self.eps = eps\n        self.momentum = momentum\n\
  \        if not gamma_beta_method:\n            self.gamma = np.ones((1, num_features))\n\
  \            self.beta = np.zeros((1, num_features))\n        else:\n          \
  \  self.gamma = np.random.normal(1, std, (1, num_features))\n            self.beta\
  \ = np.zeros((1, num_features))\n        # self.gamma *= random_value\n        self.params\
  \ = [self.gamma, self.beta]\n        self.grads = [np.zeros_like(self.gamma), np.zeros_like(self.beta)]\n\
  \n        self.running_mu = np.zeros((1, num_features))\n        self.running_var\
  \ = np.zeros((1, num_features))\n\n    def forward(self, X, training=True):\n  \
  \      # N, C, H, W = X.shape\n        self.X_shape = X.shape\n        if len(self.X_shape)\
  \ > 2:\n            N, C, H, W = self.X_shape\n\n        if training:\n        \
  \    # X = np.swapaxes(X, 0, 1)  # C to fitst axis\n            if len(self.X_shape)\
  \ > 2:\n                X = np.moveaxis(X, 1, 3)   # move C to last axis: N,H,W,C\n\
  \                X_flat = X.reshape(-1, X.shape[3])\n            else:\n       \
  \         X_flat = X\n\n            NHW = X_flat.shape[0]\n            self.n_X\
  \ = NHW\n            mu = np.mean(X_flat, axis=0)\n            var = 1 / float(NHW)\
  \ * np.sum((X_flat - mu) ** 2, axis=0)  # self.var = np.var(self.X_flat, axis=0)\
  \ #\n            X_hat = (X_flat - mu) / np.sqrt(var + self.eps)\n            out\
  \ = self.gamma * X_hat + self.beta\n\n            if len(self.X_shape) > 2:\n  \
  \              out = out.reshape(N, H, W, C)\n                out = np.moveaxis(out,\
  \ 3, 1)\n\n            self.mu, self.var, self.X_flat, self.X_hat = mu, var, X_flat,\
  \ X_hat\n\n            # Compute the moving average of means and variances\n   \
  \         running_mu, running_var, momentum = self.running_mu, self.running_var,\
  \ self.momentum\n            running_mu = momentum * running_mu + (1 - momentum)\
  \ * self.mu\n            running_var = momentum * running_var + (1 - momentum) *\
  \ self.var\n        else:\n            if len(self.X_shape) > 2:\n             \
  \   X = np.moveaxis(X, 1, 3)\n                self.X_flat = X.reshape(-1, X.shape[3])\n\
  \            else:\n                self.X_flat = X\n\n            # Normalization\n\
  \            X_hat = (self.X_flat - self.running_mu) / np.sqrt(self.running_var\
  \ + eps)\n            # translate and pan\n            out = self.gamma * X_hat\
  \ + self.beta\n            if len(self.X_shape) > 2:\n                out = out.reshape(N,\
  \ H, W, C)\n                out = np.moveaxis(out, 3, 1)\n        return out\n\n\
  \    def __call__(self, X):\n        return self.forward(X)\n\n    def backward(self,\
  \ dout):\n        if len(dout.shape) > 2:    # len(self.X_shape) > 2 and\n     \
  \       dout = np.moveaxis(dout, 1, 3)\n            dout = dout.reshape(-1, dout.shape[3])\n\
  \n        eps = self.eps\n\n        X_mu = self.X_flat - self.mu\n        var_inv\
  \ = 1. / np.sqrt(self.var + eps)\n\n        dbeta = np.sum(dout, axis=0)\n     \
  \   dgamma = np.sum(dout * self.X_hat, axis=0)  # dout * self.X_hat\n\n        dX_hat\
  \ = dout * self.gamma\n        dvar = np.sum(dX_hat * X_mu, axis=0) * -0.5 * (self.var\
  \ + eps) ** (-3/2)\n        dmu = np.sum(dX_hat * (-var_inv), axis=0) + dvar * 1\
  \ / self.n_X * np.sum(-2. * X_mu, axis=0)\n        dX = (dX_hat * var_inv) + (dmu\
  \ / self.n_X) + (dvar * 2 / self.n_X * X_mu)\n\n        if len(self.X_shape) > 2:\n\
  \            N, C, H, W = self.X_shape\n            dX = dX.reshape(N, H, W, C)\n\
  \            dX = np.moveaxis(dX, 3, 1)\n            # dX = dX.reshape(self.X_shape)\n\
  \n        self.grads[0] += dgamma\n        self.grads[1] += dbeta\n        return\
  \ dX  # , dgamma, dbeta\n```\n\n#### BN 对网络性能的影响\n\n为了观察 BN 对网络性能的影响，在 4.3.9 节基于\
  \ Fashion Mnist 数据集训练的网络模型中，在前两个网络层的加权和与激活函数之间添加了一个批量归一化（BN）层，因为 BN 可以避免模型权重参数变得非常复杂；也就是说，BN\
  \ 也是一种正则化技术，可以在代码中移除权重衰减的正则化（`reg=0`）：\n\n```python\nimport numpy as np\nimport\
  \ util\nfrom NeuralNetwork import *\nfrom train import *\nimport mnist_reader\n\
  import matplotlib.pyplot as plt\n%matplotlib inline\nnp.random.seed(1)\n\nX_train,\
  \ y_train = mnist_reader.load_mnist('data/fashion', kind='train')\nX_test, y_test\
  \ = mnist_reader.load_mnist('data/fashion', kind='t10k')\ntrainX = X_train.reshape(-1,\
  \ 28, 28)\ntrain_X = trainX.astype('float32') / 255.0\n\nnn = NeuralNetwork()\n\n\
  nn.add_layer(Dense(784, 500))\nnn.add_layer(Relu())\n\nnn.add_layer(Dense(500, 200))\n\
  nn.add_layer(BatchNorm_1d(200))\nnn.add_layer(Relu())\n\nnn.add_layer(Dense(200,\
  \ 100))\nnn.add_layer(BatchNorm_1d(100))\nnn.add_layer(Relu())\n\nnn.add_layer(Dense(100,\
  \ 10))\n\nlearning_rate = 0.01\nmomentum = 0.9\noptimizer = SGD(nn.parameters(),\
  \ learning_rate, momentum)\n\nepochs = 8\nbatch_size = 64\nreg = 0  # 1e-3\nprint_n\
  \ = 1000\n\nlosses = train_nn(nn, train_X, y_train, optimizer, cross_entropy_grad_loss,\
  \ epochs, batch_size, reg, print_n)\n\nplt.plot(losses)\n```\n\n训练损失输出：\n\n```\n\
  [ 1, 1] loss: 2.291\n[ 1001, 2] loss: 0.416\n[ 2001, 3] loss: 0.261\n[ 3001, 4]\
  \ loss: 0.342\n[ 4001, 5] loss: 0.222\n[ 5001, 6] loss: 0.196\n[ 6001, 7] loss:\
  \ 0.157\n[ 7001, 8] loss: 0.295\n```\n\n![训练损失曲线](img/file121.png)\n\n最终模型预测准确率：\n\
