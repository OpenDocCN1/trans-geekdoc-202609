  \ 'virginica']\n```\n\n![](img/file74.png \"fig:\")  \n\n图 3-38 鸢尾花数据集不同特征的直方图\n\
  \n```\nX = iris[['sepal_length', 'sepal_width', 'petal_length', 'petal_width']].values\n\
  # Set Iris-versicolor class label to 1 and Iris-virginica to 0\ny = (iris.species\
