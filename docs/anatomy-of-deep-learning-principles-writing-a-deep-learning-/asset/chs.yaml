  \ GAN 训练技巧\n\nGAN 模型的训练非常困难。基于实践经验，人们总结了一些 GAN 训练的注意事项和技巧。\n\n1.  归一化输入数据。如果图像数据的值被归一化到\
  \ -1 和 1 之间，生成器的最终输出激活函数使用 `tanh` 激活函数。\n2.  修改损失函数，例如原始 GAN 论文中训练生成器使用的最小损失 `1-D(G(z))`，即\
  \ `min log(1-D(G(z)))`，建议将其改为最大化损失 `log(D(G(z)))`，即 `max log(D(G(z)))`。\n3.  生成器的输入噪声从高斯分布采样，而不是均匀分布。\n\
  4.  对真实数据和生成的数据分别使用批量归一化（`BatchNorm`），不能对混合了真实和生成数据的数据进行批量归一化。\n5.  避免稀疏梯度，例如避免产生稀疏梯度的激活函数或网络层，如\
  \ `relu` 和 `maxpool`。但建议使用 `Leakrelu`。\n6.  使用软标签或噪声。训练判别器时，真实数据标签可以使用 0.7 到 1.2\
  \ 之间的随机数代替 1，生成数据标签可以使用 0.0 到 0.3 之间的随机数代替 0，并偶尔翻转生成数据的标签，例如从 0 变为 1。\n7.  使用 `Adam`\
  \ 优化器，建议判别器使用 `SGD` 优化器，生成器使用 `Adam` 优化器。\n8.  当 `D` 的损失趋向于 0 时，意味着 `D` 太强，且 `D`\
  \ 的损失方差相对较大，这意味着无法收敛。当 `G` 的损失持续下降时，意味着 `G` 太强且容易崩溃噪声。在训练过程中，可以检查模型参数的梯度。如果绝对值超过\
  \ 100，则意味着无法收敛。\n\n更多技巧，请参阅以下 github URL：\n\n<https://github.com/soumith/ganhacks>\n\
  \n## 8.6 GAN 损失函数及其概率解释\n\nGAN 对抗神经网络的本质是通过对抗学习，使生成数据的分布和真实数据的分布尽可能一致，使两个分布之间的距离尽可能小。GAN\
  \ 的损失函数本质上是两个分布相似度的度量：Kullback-Leibler 散度（KL 散度）和 Jensen-Shannon 散度（JS 散度）。\n\n\
  ### 8.6.1 GAN 损失函数的全局最优解\n\nGAN 的损失函数可以写成以下积分形式：\n\n$$L(G, D) = \\int_x [p_r(x)\\\
  log(D(x)) + p_g(x)\\log(1 - D(x))]dx$$\n\n其中，`p_r(x)` 和 `p_g(x)` 分别是真实数据和生成数据的分布，引入以下符号：\n\
  \n$$\\tilde{x} = D(x), A = p_r(x), B = p_g(x)$$\n\n将 `L(G, D)` 视为 $\\tilde{x}$ 的函数，根据函数极值点的必要条件，其对\
  \ $\\tilde{x}$ 的导数为 0。根据微积分，被积函数的导数几乎处处为 0，即 $\\frac{\\partial(p_r(x)\\log(D(x))\
  \ + p_g(x)\\log(1 - D(x)))}{\\partial\\tilde{x}} = 0$。令：\n\n$$(p_r(x)\\log(D(x))\
  \ + p_g(x)\\log(1 - D(x))) = f(\\tilde{x}) = A\\log\\tilde{x} + B\\log(1 - \\tilde{x})$$\n\
  \n则有：\n\n$$\\frac{df(\\tilde{x})}{d\\tilde{x}} = A\\frac{1}{\\tilde{x}} - B\\frac{1}{1\
  \ - \\tilde{x}} = \\frac{A}{\\tilde{x}} - \\frac{B}{1 - \\tilde{x}} = \\frac{A -\
  \ (A + B)\\tilde{x}}{\\tilde{x}(1 - \\tilde{x})}$$\n\n令 $\\frac{df(\\tilde{x})}{d\\\
  tilde{x}} = 0$，可得判别器损失函数 `L(G, D)` 的极值点为 $f(\\tilde{x}^*)$，\n\n$$D^*(x) = \\tilde{x}^*\
  \ = \\frac{A}{A + B} = \\frac{p_r(x)}{p_r(x) + p_g(x)} \\in [0,1]$$\n\n当生成器达到最优时，即生成数据的分布与真实数据的分布完全相同，即\
  \ `p_g = p_r`，此时判别器损失函数的极值点为 1/2。此时判别器损失函数 `L(G, D)` 的最优值为：\n\n$$L(G, D^*) = \\\
  int_x (p_r(x)\\log(D^*(x)) + p_g(x)\\log(1 - D^*(x)))dx = \\log\\frac{1}{2}\\int_x\
  \ p_r(x)dx + \\log\\frac{1}{2}\\int_x p_g(x)dx = -2\\log 2$$\n\n根据概率性质，其中 $\\int_x\
  \ p_r(x)dx$ 和 $\\int_x p_g(x)dx$ 均为 1。\n\n### 8.6.2 Kullback-Leibler 散度和 Jensen-Shannon\
  \ 散度\n\n通常有两种方法来度量两个分布是否相似：Kullback-Leibler 散度（简称 KL 散度）和 Jensen-Shannon 散度（简称 JS\
  \ 散度）。\n\n对于两个概率分布 `p`、`q`，它们的 Kullback-Leibler 散度为：\n\n$$D_{KL}(p \\parallel q)\
  \ = \\int_x p(x)\\log\\frac{p(x)}{q(x)}dx$$\n\nKL 散度描述了概率分布 `p` 偏离 `q` 的程度。对于某个\
  \ `x`，如果 `p(x) = q(x)`，则 $\\log\\frac{p(x)}{q(x)} = \\log 1 = 0$；如果 `p(x) \\neq\
  \ q(x)`，则 $\\log\\frac{p(x)}{q(x)} \\neq 0$。当 `p` 和 `q` 处处相等时，`D_KL(p \\parallel\
  \ q) = 0`，否则可以证明 `D_KL(p \\parallel q) > 0`。因此，当两个分布完全相同或几乎相同（几乎处处满足 `p(x) = q(x)`）时，KL\
  \ 散度取得最小值 0。\n\n例如，对于图 8-28 所示的 2 个离散概率分布：\n\n![](img/file196.png \"fig:\")\n图 8-28\
  \ 左右两图的离散概率分布分别为 (0.36, 0.48, 0.16) 和 (0.333, 0.333, 0.333)。\n\n即 `p` 和 `q` 的概率分布分别为：(0.36,\
  \ 0.48, 0.16) 和 (0.333, 0.333, 0.333)。它们的 KL 散度为：\n\n$$D_{KL}(p \\parallel q) =\
  \ \\sum_{x \\in \\mathcal{X}} p(x)\\log(\\frac{p(x)}{q(x)}) = 0.36\\log\\frac{0.36}{0.333}\
  \ + 0.48\\log\\frac{0.48}{0.333} + 0.16\\log\\frac{0.16}{0.333} = 0.0863$$\n\n$$D_{KL}(q\
  \ \\parallel p) = \\sum_{x \\in \\mathcal{X}} q(x)\\log(\\frac{q(x)}{p(x)}) = 0.333\\\
  log\\frac{0.333}{0.36} + 0.333\\log\\frac{0.333}{0.48} + 0.333\\log\\frac{0.333}{0.16}\
  \ = 0.096358$$\n\nKL 散度是不对称的，在度量两个同等重要分布的相似性时可能导致错误结果。\n\n再如，对于 `p(x) = N(0, 2)`、`q(x)\
  \ = N(2, 2)` 两个高斯分布，其 `D_KL(p \\parallel q)` 散度为图 8-29 右侧子图。KL 散度为被积函数阴影部分正负面积之和：\n\
  \n![](img/file197.png \"fig:\")\n图 8-29 `D_KL(p \\parallel q)` 散度为被积函数阴影部分正负面积之和。\n\
  \n对于 2 个高斯分布的概率分布，它们的 KL 散度为：\n\n$$KL(p,q) = - \\int p(x)\\log q(x)dx + \\int p(x)\\\
  log p(x)dx = \\frac{1}{2}\\log(2\\pi\\sigma_2²) + \\frac{\\sigma_1² + (\\mu_1 -\
  \ \\mu_2)²}{2\\sigma_2²} - \\frac{1}{2}(1 + \\log 2\\pi\\sigma_1²) = \\log\\frac{\\\
  sigma_2}{\\sigma_1} + \\frac{\\sigma_1² + (\\mu_1 - \\mu_2)²}{2\\sigma_2²} - \\\
  frac{1}{2}$$\n\n如果固定一个概率分布，如固定 `q(x) = (0, 2)`，令 `p(x) = (\\mu, 2)` 随 `\\mu` 的值自由变化，可以使用以下代码绘制不同\
  \ `\\mu` 值对应的 KL 散度值曲线：\n\n```\n```\n\n\n\n\n```python\nimport math\nimport matplotlib.pyplot\
  \ as plt\nimport numpy as np\n\n# if using a jupyter notebook\n%matplotlib inline\n\
  \ndef KL(mu1, sigma1, mu2, sigma2):\n    return math.log(sigma2 / sigma1) + (sigma1**2\
  \ + (mu1 - mu2)**2) / (2 * sigma2**2) - 1 / 2\n\nmus = np.arange(-12, 12, 0.1)\n\
  kl_values = [KL(mu, 2, 0, 2) for mu in mus]\n\nplt.plot(mus, kl_values)\nplt.xlabel('$\\\
  mu$')\nplt.ylabel('KL')\nplt.legend(['KL Value'], loc='upper center')\nplt.show()\n\
  ```\n\n\n\n\n结果如图 8-30 所示：\n\n![](img/file198.png)\n\n图 8-30 固定 `q(x) = (0, 2)`，`p(x)\
  \ = (μ, 2)` 随 `μ` 自由变化所得的 KL 值曲线\n\n可以看出，当 `μ = 0` 时，即 `p(x)`、`q(x)` 为同一分布时，KL 散度达到最小值。\n\
  \nJS 散度也是衡量两个分布相似度的一种度量：\n\n$$D_{JS}(p \\parallel q) = \\frac{1}{2}D_{KL}(p \\parallel\
  \ \\frac{p + q}{2}) + \\frac{1}{2}D_{KL}(q \\parallel \\frac{p + q}{2})$$\n\n与 KL\
  \ 散度不同，JS 散度关于 `p` 和 `q` 是对称的，即 `p` 和 `q` 同等重要，并且比 KL 散度更平滑。\n\n图 8-31 `p`、`q` 分别为高斯分布\
  \ `N(0, 1)`、`N(1, 1)`，两个分布的平均 `m = (p + q)/2`。KL 散度 `D[KL]` 是非对称的，但 JS 散度 `D[JS]`\
  \ 是对称的。左上角是两个概率分布 `p(x)`、`q(x)`，右上角分别是 `KL(p ∥ q)`、`KL(q ∥ p)` 的积分函数，左下角是 `KL(p\
  \ ∥ m)`、`KL(q ∥ m)` 的积分函数，右下角是 `JS(p ∥ q)` 的积分函数。\n\n对 JS 散度进行如下变换：\n\n$$\n\\begin{matrix}\n\
  D_{JS}(p_{r} \\parallel p_{g}) = & \\frac{1}{2}D_{KL}(p_{r}||\\frac{p_{r} + p_{g}}{2})\
  \ + \\frac{1}{2}D_{KL}(p_{g}||\\frac{p_{r} + p_{g}}{2}) \\\\\n= & \\frac{1}{2}(\\\
  log 2 + \\int_{x}p_{r}(x)\\log\\frac{p_{r}(x)}{p_{r}(x) + p_{g}(x)}dx) + \\\\\n\
  & \\frac{1}{2}(\\log 2 + \\int_{x}p_{g}(x)\\log\\frac{p_{g}(x)}{p_{r}(x) + p_{g}(x)}dx)\
  \ \\\\\n= & \\frac{1}{2}(\\log 4 + L(G,D^{\\ast})) \\\\\n\\end{matrix}\n$$\n\n可以看出，当判别器最优时，JS\
  \ 散度 `DJS` 与 `L(G, D^(*))` 仅相差一个常数 `\\frac{1}{2}\\log 4`。因此，GAN 的损失函数通过 JS 散度量化了生成数据分布\
  \ `p[g]` 与真实样本分布 `p[r]` 之间的相似性，\n\n`L(G, D^(*)) = 2DJS − 2log 2`\n\n当生成器最优时，即生成数据分布与真实数据分布完全一致时，第一项为\
  \ 0，此时生成器和判别器均最优时的损失函数值：\n\n`L(G^(*)) = 0 − 2log 2 = −2log 2`\n\n### 8.6.3 GAN 的最大似然解释\n\
  \n上述真实数据分布与生成数据分布应尽可能一致，解释了 GAN 损失函数与 JS 散度的关系，而 JS 散度是两个 KL 散度之和。从最大似然估计的角度也可以发现\
  \ GAN 损失函数与 KL 散度的关系。\n\n对于一组真实数据 `x[1], x[2], ⋯, x[n]`，其服从的分布为 `p[r]`，生成器 `G(θ)`\
  \ 生成这些真实数据的概率为 `pθ, pθ, ⋯, pθ`。若 `G(θ)` 达到最优，则生成器 `G(θ)` 应以最大概率（可能性）生成这些真实数据，即生成器生成这些真实数据的概率应最大化，即寻找满足以下最大值的生成器参数\
  \ `θ`：\n\n$$\\arg\\max_{\\theta}p(\\theta;x_{1},\\ldots,x_{n}) = \\arg\\max_{\\\
  theta}\\prod_{i = 1}^{n}p_{\\theta}(x_{i})$$\n\n同理，为提高计算稳定性，可用上述概率乘积的对数代替乘积，函数的极值点不会改变。因此问题归结为寻找：\n\
  \n$$\\arg\\max_{\\theta}\\log p(\\theta;x_{1},\\ldots,x_{n}) = \\arg\\max_{\\theta}\\\
  log\\prod_{i = 1}^{n}p_{\\theta}(x_{i}) = \\arg\\max_{\\theta}\\sum_{i = 1}^{n}\\\
  log p_{\\theta}(x_{i})$$\n\n因为这些 `x[i]` 是真实数据，它们服从真实数据的分布 `p[r]`。假设 `n` 趋于无穷大，则上式最右项的累加和可表示为积分形式：\n\
  \n$$\\arg\\max_{\\theta}\\sum_{i = 1}^{n}\\log p_{\\theta}(x_{i}) = \\arg\\max_{\\\
  theta}\\int_{x}p_{r}(x)\\log p_{\\theta}(x)dx$$\n\n在右边的积分中加入一个常数值 `−∫[x]prlog prdx`\
  \ 不会改变其极值点。因此有：\n\n$$\n\\begin{matrix}\n\\arg\\max_{\\theta}\\int_{x}p_{r}(x)\\\
  log p_{\\theta}(x)dx & = \\arg\\max_{\\theta}( - \\int_{x}p_{r}(x)\\log p_{r}(x)dx\
  \ + \\int_{x}pr\\log p_{\\theta}(x)dx) \\\\\n& = \\arg\\min_{\\theta}(\\int_{x}p_{r}(x)\\\
  log p_{r}(x)dx - \\int_{x}p_{r}(x)\\log p_{\\theta}(x)dx) \\\\\n& = \\arg\\min_{\\\
  theta}(\\int_{x}p_{r}(x)\\log\\frac{p_{r}(x)}{p_{\\theta}(x)}dx) \\\\\n& = \\arg\\\
  min_{\\theta}KL(p_{r} \\parallel p_{\\theta}) \\\\\n\\end{matrix}\n$$\n\n因此，令生成器\
  \ `G(θ)` 最大化真实数据的似然概率，等价于最小化上述真实数据分布 `p[r]` 与生成数据分布 `p[θ]` 的 KL 散度。\n\n## 8.7 改进的损失函数：Wasserstein\
  \ GAN (WGAN)\n\nGAN 模型的训练非常不稳定。解决该问题主要有两条途径：一是寻找稳定的学习架构，二是修改损失函数，即用新的损失函数替换原始损失函数。Wasserstein\
  \ GAN（简称 WGAN）属于后者。\n\n### 8.7.1 Wasserstein GAN 的原理\n\nWGAN 利用两个分布之间的 Wasserstein\
  \ 距离定义新的损失函数，以替换原始论文 GAN 中的 JS 散度。\n\nWGAN 从数学理论上分析了 GAN 训练不稳定的原因，认为 GAN 的本质是优化真实数据分布与生成数据分布的\
  \ JS 散度。KL 和 JS 都是通过测量两个分布对应随机变量概率密度的差异作为两个分布的相似度度量。对于两个不重叠的分布，JS 散度始终为 2。如果有两个不同的生成数据分布，且它们都不与真实分布重叠，则无法从\
  \ JS 散度反映哪个分布更接近真实分布，从而使生成数据分布无法逐渐逼近真实数据分布。\n\nGAN 生成的分布与真实数据分布不重叠是大概率事件。这是原始 GAN\
  \ 难以训练的原因之一。作者提出用**瓦瑟斯坦距离**替换原始 GAN 的 JS 散度。作为表征两个分布距离的度量，Wasserstein Distance 也称为**推土机距离**（**Earth\
  \ Mover's distance**，**EM**）。EM 距离不直接测量两个分布对应随机变量概率密度的差异，而是测量将一个分布转变为另一个分布所消耗的能量。如果一个分布\
  \ `p[1]` 比另一个分布 `p[2]` 以更小的能量转变为目标分布 `q`，则 `p[1]` 与 `q` 的 EM 距离小于 `p[2]` 与 `q` 的\
  \ EM 距离。\n\n将分布 `p(x)`、`q(y)` 视为两堆土，推土机距离衡量如何通过某种移动方案将形状为 `p(x)` 的一堆土转变为 `q(y)`\
  \ 形状的那堆土。\n\n如图 8-32 a) 所示，上图中彩色随机变量在 `x=1` 和 `8` 处的概率分别为 `3/4` 和 `1/4`。该概率可视为在\
  \ `x=1` 和 `3` 处的一堆土或砖块。白色随机变量在 `x=1` 和 `8` 处的概率分别为 `2/4` 和 `2/4`。该概率可视为在 `y=5, 6`\
  \ 处的一堆土或砖块。图 8-32 a) 下表所示为 `x`、`y` 组合对应的移动距离 `∥x − y∥`。\n\n![](img/file199.png \"\
  fig:\")\na) b) c)\n\n图 8-32 a) 上图中彩色随机变量在 `x=1` 和 `8` 处的概率分别为 `3/4` 和 `1/4`，白色随机变量在\
  \ `x=5` 和 `6` 处的概率分别为 `2/4` 和 `2/4`。下图为从 `x` 移动到 `y` 的距离 `∥x − y∥`。b) 移动方案 `γ1`\
  \ c) 移动方案 `γ1`\n\n要将 `p(x)` 转变为 `q(y)`，需要移动这堆土或砖块。例如，可按图 8-32 b) 的移动方案移动 `p(x)`\
  \ 的土或砖块，将其转变为目标 `q(y)`，此时的移动代价为：\n`2/4 * (5 − 1) + 1/4 * (6 − 1) + 1/4 * (8 − 6)\
  \ = (8 + 5 + 2)/4 = 15/4`\n\n也可按图 8-32 c) 的移动方案将 `p(x)` 的土或砖块转变为目标 `q(y)`，此时的移动代价为：\n\
  `2/4 * (6 − 1) + 1/4 * (5 − 1) + 1/4 * (8 − 5) = (10 + 4 + 3)/4 = 17/4`\n\n可见不同的移动方案移动代价不同。用\
  \ `γ` 表示一种移动方案，`γ(x, y)` 表示从 `x` 运往 `y` 的土量，`∥x − y∥` 为移动距离，`γ(x, y) ⋅ ∥x − y∥`\
  \ 为从 `x` 运往 `y` 的 `γ(x, y)` 的代价。该移动方案的代价为所有这些 `γ(x, y) ⋅ ∥x − y∥` 之和：\n\n`∑γ(x,\
  \ y) ∥x − y∥`\n\n此 `γ(x, y)` 可表示为运输土量占总量的百分比，该百分比等价于一种概率，因为所有可能的 `γ(x, y)` 不仅大于或等于\
  \ 0，而且 `γ(x, y)` 的和 `∑γ(x, y)` 为 1，满足概率条件。即 `γ(x, y)` 是随机变量 `(x, y)` 的联合概率分布，运输距离\
  \ `∥x − y∥` 是随机变量 `(x, y)` 的函数，则对于一种移动方案 `γ`，其移动代价是随机变量 `∥x − y∥` 在该概率 `γ(x, y)`\
  \ 上的数学期望：\n\n`∑γ(x, y) ∥x − y∥ = \U0001D53C[(x, y) ∼ γ][∥x − y∥]`\n\n将 `p(x)` 转变为\
  \ `q(y)` 的推土机距离定义为所有可能移动方案的移动代价的最小值。更准确的数学术语是所有可能移动方案移动代价的*下确界*，其数学符号为 `inf`。因此推土机距离定义为：\n\
  \n$$W(p,q) = \\inf_{\\gamma \\sim \\Pi(p,q)}\\mathbb{E}_{(x,y) \\sim \\gamma}[\\\
  parallel x - y \\parallel]$$\n\n`Π(p, q)` 为所有可能的移动方案，`γ ∈ Π(p, q)` 表示一种将 `p(x)`\
  \ 移动为 `q(y)` 的方案。\n\n设 `p[r]`、`p[g]` 分别为真实数据与生成数据的概率密度，`γ` 表示将概率分布 `p[r]` 转变为 `p[g]`\
  \ 的一种移动方案，则这两个分布的推土机距离为：\n\n$$W(p_{r},p_{g}) = \\inf_{\\gamma \\sim \\Pi(p_{r},p_{g})}\\\
  mathbb{E}_{(x,y) \\sim \\gamma}[\\parallel x - y \\parallel]$$\n\n表示将分布 `p[r]` 转变为分布\
  \ `p[g]` 所需的最小代价。推土机距离是对称的，因此也表示将分布 `p[g]` 转变为分布 `p[r]` 所需的最小代价。\n\n计算该距离不可行，因为无法枚举无限多个这些移动方案\
  \ `γ`。通过一种称为 Kantorovich-Rubenstein 对偶性的复杂数学推导，这转化为以下距离计算：\n\n$$W(P_{r},P_{\\theta})\
  \ = \\sup_{\\parallel f\\parallel_{L} \\leq 1}\\mathbb{E}_{x_{\\sim P_{r}}}f(x)\
  \ - \\mathbb{E}_{x_{\\sim P_{\\theta}}}f(x)$$\n\n其中，`sup` 是**上确界**，指大于所有值的最小值，`f`\
  \ 为 `1-Lipschitz` 函数，即满足以下条件的函数：\n\n`|f(x[1]) − f(x[2])| ≤ |x[1] − x[2]|`\n\n对于这样的函数\
  \ `f`，`\U0001D53C[x ∼ P[r]]f(x)` 是服从真实数据分布 `p[r]` 的 `x`，即真实数据的函数值 `f(x)` 的期望（均值），`\U0001D53C\
  [x ∼ P[θ]]f(x)` 是服从生成数据分布 `p[g]` 的 `x`，即生成数据的函数值 `f(x)` 的期望（均值）。因此，只需用一些真实数据 `x`\
  \ 的 `f(x)` 平均值即可估计 `\U0001D53C[x ∼ P[r]]f(x)`，也可用一些生成数据 `x` 的 `f(x)` 平均值估计 `\U0001D53C\
  [x ∼ P[θ]]f(x)`。如：\n\n$$\n\\begin{matrix}\n\\mathbb{E}_{x_{\\sim P_{r}}}f(x) = \\\
  sum_{1}^{m}f(real\\_x_{i}) \\\\\n\\mathbb{E}_{x_{\\sim P_{\\theta}}}f(x) = \\sum_{1}^{n}f(fake\\\
  _x_{i}) \\\\\n\\end{matrix}\n$$\n\n其中 `real_x[i]`、`fake_x[i]` 分别为一些真实数据和生成数据。因此，推土机距离的估计变得非常简单。\n\
  \n在 GAN 训练中，`f(x)` 是判别器的神经网络函数，但必须保证其满足上述 `1-Lipschitz` 函数的条件。在 WGAN 原始论文中，这是通过**权重裁剪**这一实用技巧限制权重参数大小来保证的，即将权重参数限制在某个范围\
  \ `[−c, c]` 内，通常 `c=0.01`。也可设为 `c=0.1` 或 `c=0.001`，即 `c` 也是一个需要调试的参数。\n\n对于判别器，要使公式\
  \ (8-29) 取上确界，即使 `\U0001D53C[x ∼ P[r]]f(x) − \U0001D53C[x ∼ P[θ]]f(x)` 取最大值。可用梯度上升法更新其参数（如\
  \ `w`），甚至使 Wasserstein 距离尽可能大，以提高区分真实数据与生成数据的能力。生成器希望最小化 Wasserstein 距离，因此其参数（如\
  \ `θ`）用梯度下降法更新。对生成器而言，公式 (8-29) 的第一项与其无关，即只需使 `−\U0001D53C[x ∼ P[θ]]f(x)` 最小化。\n\
  \nWGAN 的损失函数是 `f(x)` 或 `−f(x)` 的和，损失函数关于 `f(x)` 的梯度为 `1`（或 `-1`）。因此，WGAN 的损失函数及其梯度计算更简单。只需在\
  \ GAN 代码中稍微修改计算损失函数和计算损失函数关于 `f(x)` 的梯度的代码即可。下面是 WGAN 算法的伪代码，如图 8-33 所示：\n\n图 8-33\
  \ WGAN 算法伪代码。\n\n后来又提出了一些改进的 WGAN，如 Improved WGAN (WGAN-GP)，它在损失函数中增加了梯度惩罚项，代替裁剪权重参数。\n\
  \n$$L(p_{r},p_{g}) = \\mathbb{E}_{\\overset{\\sim}{x} \\sim p_{g}}[f(\\overset{\\\
  sim}{x})] - \\mathbb{E}_{x \\sim p_{r}}[f(x))] + \\mathbb{E}_{\\hat{x} \\sim p_{\\\
  hat{x}}}[{(| \\parallel \\nabla f(\\hat{x}) \\parallel_{2} - 1)}^{2}]$$\n\n其中，`\U0001D53C\
  [x̃ ∼ p[g]][f(x̃)] − \U0001D53C[x ∼ p[r]][f(x)]` 为负 Wasserstein 距离 `−W(p[g], p[r])`，`\U0001D53C\
  [x̂ ∼ p[x̂]][(|∥∇f(x̂)∥[2] − 1)²]` 为梯度惩罚项，它尽可能将梯度的绝对值限制为单位长度，从而防止梯度爆炸和消失。\n\n权重参数裁剪主要是防止权重参数过大，以保证神经网络函数仍为\
  \ `1-Lipschitz` 函数。梯度惩罚项类似于前面模型参数的正则项，也是防止梯度更新过程中梯度爆炸导致参数变大，将梯度限制在一定范围内也保证了模型参数限制在一定范围内。\n\
  \n近期实践表明，WGAN 和 WGAN GP 实际上并不优于 GAN，因此在实践中，人们仍习惯使用最原始的 GAN。\n\n### 8.7.2 WGAN 代码实现\n\
  \n根据 WGAN 的损失函数，对之前的 `D_train()` 和 `G_train()` 函数稍作修改，即可得到使用 WGAN 损失的判别器和生成器训练函数\
  \ `WGAN_D_train()` 和 `WGAN_G_train()`：\n\n```\n```\n\n\n\n\n#### WGAN 训练代码实现\n\n\
  ##### 判别器单轮训练\n\n```python\ndef WGAN_D_train(D, D_optimizer, x_real, x_fake, clip_value=0.01,\
  \ reg=1e-3):\n    assert x_real.shape[0] == x_fake.shape[0]\n\n    # 1. 梯度清零\n \
  \   D_optimizer.zero_grad()\n\n    # 2. 计算损失和梯度\n    f_real = D(x_real)\n    m =\
  \ f_real.size\n    real_loss = np.mean(f_real)\n    real_grad = (1 / m) * np.ones(f_real.shape)\n\
  \    D.backward(-real_grad, reg)\n\n    f_fake = D(x_fake)\n    assert f_fake.size\
  \ == f_real.size\n    fake_loss = np.mean(f_fake)\n    fake_grad = (1 / m) * np.ones(f_fake.shape)\n\
  \    D.backward(fake_grad, reg)\n\n    loss = real_loss - fake_loss\n    # loss\
  \ += D.reg_loss(reg)\n\n    # 3. 更新梯度\n    D_optimizer.step()\n\n    # 4. 权重裁剪\n\
  \    for i, _ in enumerate(D_optimizer.params):\n        D_optimizer.params[i][0][:]\
  \ = np.clip(D_optimizer.params[i][0], -clip_value, clip_value)\n\n    return loss\n\
  ```\n\n##### 生成器单轮训练\n\n```python\ndef WGAN_G_train(D, G, G_optimizer, z, clip_value=0.01,\
  \ reg=1e-3):\n    # 1. 梯度清零\n    G_optimizer.zero_grad()\n\n    # 2. 计算损失和梯度\n \
  \   x_fake = G(z)\n    f_fake = D(x_fake)\n\n    loss = -np.mean(f_fake)\n    m\
  \ = f_fake.size\n    grad = -(1 / m) * np.ones(f_fake.shape)\n\n    grad = D.backward(grad)\n\
  \    G.backward(grad, reg)\n\n    # loss += G.reg_loss(reg)\n\n    # 3. 更新梯度\n \
  \   G_optimizer.step()\n\n    return loss\n```\n\n##### WGAN 完整训练流程\n\n```python\n\
  def WGAN_train(D, G, D_optimizer, G_optimizer, real_dataset, noise_z, iterations=10000,\
  \ reg=1e-3,\n               clip_value=0.01, n_critic=4, show_result=None, print_n=20):\n\
  \    iter = 0\n    D_losses = []\n    G_losses = []\n\n    while iter < iterations:\n\
  \        # 训练判别器\n        x_real = next(real_dataset)\n        x_fake = G(next(noise_z))\n\
  \        D_loss = WGAN_D_train(D, D_optimizer, x_real, x_fake, clip_value, reg)\n\
  \n        # 训练生成器\n        if iter % n_critic == 0:\n            G_loss = WGAN_G_train(D,\
  \ G, G_optimizer, next(noise_z), clip_value, reg)\n\n        if iter % print_n ==\
  \ 0:\n            print(iter, \"iter:\", \"D_loss\", D_loss, \"G_loss\", G_loss)\n\
  \            D_losses.append(D_loss)\n            G_losses.append(G_loss)\n\n  \
  \          if show_result:\n                show_result(D, G, D_losses, G_losses)\n\
  \n        iter += 1\n\n    return D_losses, G_losses\n```\n\n#### 第 8.5.1 节实数集合\
  \ GAN 模型的 WGAN 训练示例\n\n对于第 8.5.1 节中包含一组实数的 GAN 模型，可以使用上述 WGAN 损失函数进行训练，代码如下：\n\n\
  ```python\nfrom NeuralNetwork import *\n# from util import *\n\nnp.random.seed(0)\n\
  \nhidden = 4\n\nD = NeuralNetwork()\nD.add_layer(Dense(1, hidden))\nD.add_layer(Leaky_relu(0.2))\
  \  # Relu()\nD.add_layer(Dense(hidden, 1))\n# D.add_layer(Sigmoid())\n\nG = NeuralNetwork()\n\
  z_dim = 1  # 隐变量维度\nG.add_layer(Dense(z_dim, hidden))\nG.add_layer(Leaky_relu(0.2))\
  \  # Relu()\nG.add_layer(Dense(hidden, 1))\n\n# 定义 G 和 D 的优化器对象\nD_lr = 0.0003 \
  \ # 1e-4\nG_lr = 0.0001  # 1e-4\nbeta_1, beta_2 = 0.9, 0.999\n\nD_optimizer = Adam(D.parameters(),\
  \ D_lr, beta_1, beta_2)\nG_optimizer = Adam(G.parameters(), G_lr, beta_1, beta_2)\n\
  \nfrom util import *\n\nclip_value = 0.01\nreg = 0  # 1e-5\niterations = 200000\
  \  # 100000\nn_critic = 1  # 5\nprint_n = 500\n\nD_losses, G_losses = WGAN_train(D,\
  \ G, D_optimizer, G_optimizer, data_it, noise_it, iterations, reg,\n           \
  \                     clip_value, n_critic, show_result, print_n)\n```\n\n#### 最终训练结果\n\
  \n```\n...\n500 iter: D_loss 0.0011615003991261863 G_loss -0.01023799847202126\n\
  27000 iter: D_loss -8.578426744787482e-07 G_loss -0.009488053321470099\n...\n90000\
  \ iter: D_loss 1.3109091936969186e-11 G_loss -0.009999930339860416\n...\n199500\
