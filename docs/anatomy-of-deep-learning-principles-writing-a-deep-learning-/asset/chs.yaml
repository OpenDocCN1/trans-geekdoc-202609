  #### 总结\n\n线性回归、逻辑回归和 Softmax 回归本质上都是线性分类器。线性回归是输入的线性加权，其回归函数是线性函数（直线）。逻辑回归本质上与线性回归相同，只是将这种线性加权求和的值从区间\
  \ (−∞, ∞) 压缩到了区间 (0, 1)，使得输出值具有概率意义，其针对二分类问题的决策曲线仍然是一条直线。Softmax 回归仅将多个线性加权求和视为各类别的得分，然后将它们的值转换为样本属于多个类别的概率值。当它用于多分类问题时，其决策曲线无非就是多条直线罢了。\n\
  \n![](img/file233.png)![](img/file234.png)![](img/file235.png)![](img/file236.png)\n\
  \n![](img/file237.png)\n\n## 4.1 神经网络\n\n前面学习的线性回归使用数据特征的线性函数来表示特征与目标值之间的函数关系。线性函数过于简单，对于许多机器学习问题，特征与目标值之间的函数关系往往是非线性的。逻辑回归在线性函数的基础上进一步使用非线性函数\
  \ sigmoid 函数 `σ(z)` 将线性函数的结果转换为 [0, 1] 之间的概率值，从而使特征与目标值之间存在非线性关系，但仅将线性加权求和转换为概率，也难以表示复杂函数。\n\
  \n如何表示复杂函数？\n\n复杂函数通常可以分解为简单函数，或通过简单的四则运算或函数组合由简单函数构成。例如，逻辑回归的假设函数 `σ(xw + b)` 就是由函数\
  \ `z = xw + b` 和 `σ(z)` 组合而成，而函数 `xw + b` 则是由 `x`、`w`、`b` 通过乘法和加法组成的。\n\n非常复杂的函数可以通过简单运算和函数组合来表示。**神经网络**\
  \ 就是以这种方式将许多简单的 **神经元** 函数组合成一个复杂函数。神经元就是一个逻辑回归函数，即神经元函数对输入进行线性加权，然后使用非线性函数对加权求和进行非线性变换。当然，神经元函数中对加权求和执行非线性变换的函数也可能是其他类似于\
  \ sigmoid 函数的简单函数。神经网络由多个神经元（函数）组成，一个神经元的输出作为另一个神经元的输入，一个神经元接受其他神经元的输入，并将简单的加权求和和简单的（非线性）函数变换输出传递给其他神经元。神经元通过相互的输入输出连接形成网络，因此这个复杂函数被称为神经网络。\n\
  \n### 4.1.1 感知机与神经元\n\n#### 1. 感知机\n\n**感知机** 是一个具有二分类功能的简单函数。逻辑回归函数使用 sigmoid 函数将输入的线性加权求和转换为概率\
  \ `σ(xxww)`，而感知机则使用阈值函数将输入的线性加权求和转换为 0 和 1：`signb`。其中 `signb` 是一个阶跃函数，根据 z 值是否大于阈值\
  \ `b` 输出 1 和 0：\n\n$$\n\\begin{matrix} \n{sign\\_b(z) = \\left\\{ \\begin{matrix}\
  \ \n1 & {\\text{if } z >= b} \\\\ \n0 & \\text{else} \\\\ \n\\end{matrix} \\right.}\
  \ \n\\end{matrix}\n$$\n\n感知机通过权重向量 `ww` 计算输入 `xx` 的加权求和 `xxww`，然后根据加权求和是否超过某个阈值\
  \ `b` 输出 1 或 0 的值。例如，一个具有 3 个输入值的感知机计算如下：\n\n$$f\\_{ww,b}(xx) = sign\\_b(\\sum\\\
  limits\\_{j = 1}^{3} w\\_j x\\_j)$$\n\n感知机可以用一个简单的圆圈来可视化。图 4-1 中的感知机接受 3 个输入值并产生一个输出值\
  \ `f`：\n\n图 4-1 感知机接受 3 个输入值并产生输出值 `f`\n\n感知机也被称为 \"**人工神经元**\", 简称 \"**神经元**\"\
  。它试图模拟人脑中的神经元。神经科学揭示，人脑由许多简单的神经元组成，如图 3-2 所示。\n\n图 4-2 大脑神经元的结构\n\n一个神经元通常有多个树突，主要用于接收传入的信息，而只有一个轴突，轴突末端有许多轴突末梢，可将信息传递给其他神经元，轴突末梢与其他神经元的树突建立连接以传递信号，该连接位置在生物学中称为“突触”。\n\
  \n每个神经元接受多个输入信号，每个输入信号对神经元的权重也不同。如果所有输入信号的加权求和超过神经元内部的“阈值”，则会产生一个输出信号。\n\n用 `fww`\
  \ 表示感知机函数，即 `fww = signb`，其中 `xx` 是输入，`ww` 是权重向量，即：\n\n$$\n\\begin{matrix} \n{f\\\
  _{ww}(xx) = \\left\\{ \\begin{matrix} \n1 & {\\text{if } \\sum\\limits\\_{j} w\\\
  _j x\\_j >= b} \\\\ \n0 & {else} \\\\ \n\\end{matrix} \\right.} \n\\end{matrix}\n\
  $$\n\n上述公式可以转换为：\n\n$$\n\\begin{matrix} \n{f\\_{ww}(xx) = \\left\\{ \\begin{matrix}\
  \ \n1 & {\\text{if } \\sum\\limits\\_{j} w\\_j x\\_j - b >= 0} \\\\ \n0 & {otherwise}\
  \ \\\\ \n\\end{matrix} \\right.} \n\\end{matrix}\n$$\n\n`b` 可以是正数或负数，用 `b` 表示 −`b`，上述公式可以写为：\n\
  \n$$\n\\begin{matrix} \n{f\\_{ww}(xx) = \\left\\{ \\begin{matrix} \n1 & {\\text{if\
  \ } \\sum\\limits\\_{j} w\\_j x\\_j + b >= 0} \\\\ \n0 & {else} \\\\ \n\\end{matrix}\
  \ \\right.} \n\\end{matrix}\n$$\n\n\n\n因此，感知机函数通常可以写为 `fw*w = sign(x*x*w*w + b)`。\n\
  \n感知机可以直接表达最基本的逻辑计算函数：“与”、“或”、“与非”。图 4-3 展示了逻辑电路中“与门”、“与非门”、“或门”和“异或门”的功能。\n\n```\n\
  a) 与 b) 与非 c) 或 d) 异或\n```\n\n图 4-3 是逻辑电路中“与门”、“与非门”、“或门”和“异或门”的功能图。\n\n能够生成“与门”功能的感知机参数（`w[1]`、`w[2]`、`b`）可以有很多组，例如：(0.5,\
  \ 0.5, −0.6)、(0.5, 0.5, −0.9)、(1, 1, −1)、(1, 1, −1.5) 等。例如，由参数 (0.5, 0.5, −0.6)\
  \ 表示的感知机函数如下：\n\n`sign(x[1]*w[1] + x[2]*w[2] + b) = sign(0.5*x[1] + 0.5*x[2] − 0.6)`\n\
  \n将 `x[1] = 0`、`x[2] = 0` 或 `x[1] = 1`、`x[2] = 0` 或 `x[1] = 0`、`x[2] = 1` 代入感知机函数，输出值为\
  \ 0；将 `x[1] = 1`、`x[2] = 1` 代入感知机函数，输出值为 1。即该感知机实现了逻辑电路的“与门”功能。\n\n能够生成“与非门”功能的感知机参数（`w[1]`、`w[2]`、`b`）也有很多组，例如：(−0.5,\
  \ −0.5, 0.6)、(−0.5, −0.5, 0.9)、(−1, −1, 1)、(−1, −1, 1.5) 等。\n\n能够生成“或”功能的感知机参数（`w[1]`、`w[2]`、`b`）也有很多组，例如：(1,\
  \ 1, 0)、(1, 1, −0.5)、(0.5, 0.5, −0.3)。\n\n对于感知机，可以使用不同的权重 `w[j]` 和偏置 `b` 来生成不同的具体功能（如“与”、“或”、“与非”等逻辑计算功能）。与逻辑回归函数一样，单个感知机本质上仍然表示一个线性可分函数。例如，由参数\
  \ (1, 1, −0.5) 表示的感知机是由直线 −0.5 + `x[1]` + `x[2]` = 0 分隔的 2 个半空间，位于一个半空间中的 (`x[1]`,\
  \ `x[2]`) 的感知机输出值为 1，另一个半空间的输出值为 0。如图 4-4 所示：\n\n图 4-4 感知机函数 `sign(−0.5 + x[1] +\
  \ x[2])` 实现了或门的逻辑：−0.5 + `x[1]` + `x[2]` = 0 一个半空间的输出值为 1，另一个半空间的输出值为 0\n\n因此，虽然单个感知机函数是非线性函数，但它不能表示非线性可分函数。如果无法表达“异或门”逻辑运算功能：\n\
  \n只能由如下图所示的非线性曲线产生这种非线性曲线分割。\n\n图 4-5 只有非线性曲线分割才能表示与或门功能\n\n要生成这个“异或”门功能，可以使用多个感知机通过函数的复合来生成更复杂的函数。如果用以下符号分别表示“与”、“或”、“与非”功能的感知机：\n\
  \n图 4-6 “与”、“或”、“与非”功能感知机的符号表示\n\n可以通过简单的“与”、“或”、“与非”感知机组合出更复杂的功能，如图 4-7 所示，异或门可以表示如下：\n\
  \n图 4-7 “异或”功能可以由三个“与”、“或”、“与非”功能感知机函数的组合来表示\n\n运算过程如图 4-8 所示：\n\n图 4-8 “异或”功能的计算过程\n\
  \n输入 `x[1]`、`x[2]`，输出 `y` 实现异或门的功能。\n\n#### 2. 神经元\n\n神经元是对多个输入值的线性加权和执行线性或非线性变换以产生一个或多个输出值的函数或向量值函数。神经元接受多个输入值，对它们执行加权求和，然后通过线性或非线性函数产生一个输出或多个输出值。在神经元中将加权和进行线性或非线性变换的函数称为激活函数。\n\
  \n神经元函数表示如下：\n\n$a = g(\\sum\\limits_{j}W_{j}x_{j})$\n\n其中 `x[j]` 是输入值，`w[j]` 是对应输入的权重，它们的加权和\
  \ $\\sum\\limits_{j}W_{j}x_{j}$ 通过激活函数 `g` 产生输出值 `a`。神经元通常用圆圈表示，如下图 4-9 所示。\n\n\
  图 4-9 对输入加权并通过激活函数产生输出的人工神经元\n\n有时也会表达神经元的偏置，即神经元函数写为：\n\n$a = g(\\sum\\limits_{j}W_{j}x_{j}\
  \ + b)$\n\n相应地，可以将其可视化为如下图 4-10 所示的带偏置的神经元：\n\n图 4-10 对输入加权加偏置后通过激活函数产生输出的人工神经元\n\
  \n神经元也常用下图 4-11 所示的更简化的圆圈表示：\n\n图 4-11 接受多个输入值并产生单个输出值的人工神经元的符号表示\n\n表示该神经元接受 3\
  \ 个输入 `x[1]`、`x[2]`、`x[3]`（以及一个对应偏置的固定输入特征值 1），并产生一个输出值 $f_{w,b}(x) = g(\\sum\\\
  limits_{j = 1}^{3}W_{j}x_{j} + b)$\n\n如果用 `W[0]` 表示 `b`，用 `x[0]` 表示 1，则可表示为 $f_{w}(x)\
  \ = g(\\sum\\limits_{j = 0}^{3}W_{j}x_{j})$\n\n不同的激活函数决定了神经元的不同功能。线性回归、逻辑回归和感知机都使用具有不同激活函数的神经元。线性回归的激活函数是恒等函数\
  \ `g(z) = z`，直接输出加权和；而逻辑回归使用非线性激活函数（sigmoid 函数 `σ(z)`）对加权和进行变换。感知机使用阶跃函数 `sign(z)`\
  \ 对加权和进行变换。因此，神经元是线性回归、逻辑回归和感知机的泛化。Softmax 回归可视为输出多个值的神经元，即其激活函数是 `softmax()` 函数。神经元的激活函数也可以是其他各种非线性函数，如\
  \ tanh、ReLu 函数等。\n\n### 4.1.2 激活函数\n\n神经元中的激活函数通常是一些简单的非线性函数。常用的激活函数有：tanh、sigmoid、修正线性单元（简称\
  \ ReLu）。sigmoid 函数前面已介绍过。\n\n#### 1. 阶跃函数 sign(x)\n\n阶跃函数 `sign(x)` 及其导数的 Python\
  \ 实现代码：\n\n```\ndef sign(x):\n    return np.array(x > 0, dtype=np.int)\n\ndef grad_sign(x):\n\
  \    return np.zeros_like(x)\n```\n\n可以用以下代码绘制阶跃函数 `sign(x)` 的图像：\n\n```\nimport\
  \ numpy as np\nimport matplotlib.pylab as plt\n%matplotlib inline\n\nx = np.arange(-5.0,5.0,\
  \ 0.1)\nplt.ylim(-0.1, 1.1)           # 指定 y 轴的范围\nplt.plot(x, sign(x),label=\"\
  sigmoid\")\nplt.plot(x, grad_sign(x),label=\"derivative\")\nplt.legend(loc=\"upper\
  \ right\", frameon=False)\nplt.show()\n```\n\n![](img/file87.png \"fig:\")  \n\n\
  图 4-12 阶跃函数 `sign(x)` 的图像\n\n#### 2. Tanh 函数\n\ntanh 函数：\n\n`tanh(x) = (e^(x) −\
  \ e^(−x))/(e^(x) + e^(−x))`\n\n其导函数为：\n\n$\\begin{matrix} {tanh^{\\prime}(x)} &\
  \ {= \\lbrack(e^{x} + e^{- x})(e^{x} + e^{- x}) - (e^{x} - e^{- x})(e^{x} - e^{-\
  \ x})\\rbrack/(e^{x} + e^{- x})^{2}} \\\\ & {= 1 - ((e^{x} - e^{- x})^{2})/(e^{x}\
  \ + e^{- x})^{2} = 1 - tanh^{2}(x)} \\\\ \\end{matrix}$\n\nNumpy 提供了用于计算 tanh 的计算函数\
  \ `tanh()`。以下代码计算 `tanh'(x)` 并绘制 `tanh(x)` 和 `tanh'(x)` 的函数曲线：\n\n\n\n\n### 4.1.2\
  \ 激活函数\n\n##### tanh 函数\n\n```python\ndef grad_tanh(x):\n    a = np.tanh(x)\n  \
  \  return 1 - a**2\n```\n\n```python\nx = np.arange(-5.0, 5.0, 0.1)\nplt.plot(x,\
  \ np.tanh(x), label=\"tanh\")\nplt.plot(x, grad_tanh(x), label=\"derivative\")\n\
  plt.legend(loc=\"upper right\", frameon=False)\nplt.show()\n```\n\n![](img/file88.png)\n\
  \n**图 4-13** `tanh(x)` 函数及其导函数 `tanh'(x)` 的图像\n\n##### ReLU 函数\n\n当 `x` 大于 0 时，ReLU\
  \ 函数 `f(x)` 直接输出 `x`，否则输出 0：\n\n$$\nRelu(x) = \\begin{cases} x & (x > 0) \\\\ 0\
  \ & (x \\leq 0) \\end{cases}\n$$\n\n其导数：\n\n$$\nRelu'(x) = \\begin{cases} 1 & (x\
  \ > 0) \\\\ 0 & (x \\leq 0) \\end{cases}\n$$\n\n以下代码计算 `Relu(x)`、`Relu'(x)`，并绘制\
  \ `Relu(x)`、`Relu'(x)` 的函数曲线：\n\n```python\ndef relu(x):\n    return np.maximum(0,\
  \ x)\n\ndef grad_relu(x):\n    return 1. * (x > 0)\n\nx = np.arange(-5.0, 5.0, 0.1)\n\
  plt.plot(x, relu(x), label=\"relu\")\nplt.plot(x, grad_relu(x), label=\"derivative\"\
  )\nplt.legend(loc=\"upper right\", frameon=False)\nplt.show()\n```\n\n![](img/file89.png)\n\
  \n**图 4-14** `relu(x)` 函数及其导函数 `relu'(x)` 的图像\n\nReLU 函数还有一些变体，例如 LeakyReLU 函数：\n\
  \n$$\nLeakRelu(x) = \\begin{cases} x & (x > 0) \\\\ kx & (x \\leq 0) \\end{cases}\n\
  $$\n\n其导数：\n\n$$\nLeakRelu'(x) = \\begin{cases} 1 & (x > 0) \\\\ k & (x \\leq 0)\
  \ \\end{cases}\n$$\n\n以下代码计算 `LeakRelu(x)`、`LeakRelu'(x)`，并绘制 `LeakRelu(x)`、`LeakRelu'(x)`\
  \ 的函数曲线：\n\n```python\nimport numpy as np\n\ndef leakRelu(x, k=0.2):\n    y = np.copy(x)\n\
  \    y[y < 0] *= k\n    return y\n\ndef grad_leakRelu(x, k=0.2):\n    return np.clip(x\
  \ > 0, k, 1.0)\n    grad = np.ones_like(x)\n    grad[x < 0] = alpha\n    return\
  \ grad\n\nx = np.arange(-5.0, 5.0, 0.1)\nplt.plot(x, leakRelu(x), label=\"leakrelu\"\
  )\nplt.plot(x, grad_leakRelu(x), label=\"derivative\")\nplt.legend(loc=\"upper right\"\
  , frameon=False)\nplt.show()\n```\n\n![](img/file90.png)\n\n**图 4-15** `leakrelu(x)`\
  \ 函数及其导函数 `leakrelu'(x)` 的图像\n\n### 4.1.3 神经网络与深度学习\n\n1943 年，心理学家 McCulloch 和数学家\
  \ Pitts 参考生物神经元的结构，发表了抽象神经元模型 MP。1949 年，心理学家 Hebb 提出了 Hebb 学习率，认为人脑神经细胞的突触（即连接）强度是可以改变的。1957\
  \ 年，计算科学家 Frank Rosenblatt 将人工神经元称为“感知机”，并提出了由两层感知机组成的多层感知机（MLP, Multilayer Perceptron）。在现代机器学习中，感知机更常被称为**神经元**，多层感知机也称为人工神经网络（ANN,\
  \ Artificial Neural Network），简称**神经网络**。\n\n神经网络由许多简单的“神经元”组成，用于表示一个复杂函数。Softmax\
  \ 函数是一个多元向量值函数，它接受多个输入值并输出多个输出值，或者说该函数的输入和输出都是一个向量。例如，输入向量 $\\mathbf{z} = (z_1,\
  \ z_2, z_3)$ 和输出向量 $\\mathbf{f} = \\text{softmax}(\\mathbf{z})$ 有 3 个输入值和 3 个输出值\
  \ $= (f_1, f_2, f_3)$，该函数可以看作由 3 个神经元组成（如图 4-16 所示）。\n\n**图 4-16** Softmax 函数可以看作由\
  \ 3 个特殊神经元组成的神经网络（图中右侧列的 3 个圆圈）\n\n这 3 个神经元都接受输入向量 $\\mathbf{z} = (z_1, z_2, z_3)$\
  \ 并分别生成一个输出 $f_1, f_2, f_3$，即：\n\n$$\nf_1 = \\frac{e^{z_1}}{e^{z_1} + e^{z_2} +\
  \ e^{z_3}}\n$$\n\n$$\nf_2 = \\frac{e^{z_2}}{e^{z_1} + e^{z_2} + e^{z_3}}\n$$\n\n\
  $$\nf_3 = \\frac{e^{z_3}}{e^{z_1} + e^{z_2} + e^{z_3}}\n$$\n\n这 3 个神经元不同于一般神经元；它们不对输入向量\
  \ $\\mathbf{z} = (z_1, z_2, z_3)$ 进行加权求和，而是根据上述公式直接输出一个结果值 $f_i$。\n\n对于第 2.6 节螺旋数据集（图\
  \ 2-6）的二维数据点，进行 3 类别的 softmax 回归，首先用 3 个神经元计算输入向量 $\\mathbf{x} = (x_1, x_2)$ 的加权和\
  \ $\\mathbf{z} = (z_1, z_2, z_3)$，然后将这些神经元输出的加权和 $\\mathbf{z} = (z_1, z_2, z_3)$\
  \ 输入到 softmax 函数的 3 个神经元中，得到最终输出 $\\mathbf{f} = (f_1, f_2, f_3)$。该 softmax 回归的假设函数可以看作由以下神经元组成。\n\
  \n**图 4-17** Softmax 回归的假设函数可以看作中间列的三个加权求和神经元，再结合 softmax 函数的三个神经元\n\n在上述神经网络中，最左列的圆圈代表输入的多个特征。对于二维平面坐标点，一个样本只有\
  \ 2 个特征，即其横纵坐标值 $\\mathbf{x} = (x_1, x_2)$。中间列的神经元是输入数据多个特征的加权和 $z_i$，这些加权和 $\\\
  mathbf{z} = (z_1, z_2, z_3)$ 直接输出到最右列，即 softmax 函数的 3 个神经元，每个神经元产生一个输出值 $f_i$，构成了\
  \ softmax 回归的最终输出 $\\mathbf{f} = (f_1, f_2, f_3)$。可以看出，数据从左侧输入，从右侧输出。左列神经元的输出是右侧神经元的输入。同一列神经元之间没有连接，右侧神经元也不会向左侧神经元输出。也就是说，这是一个数据沿“从左到右”方向推进而不回头的计算过程。这样的神经网络称为**前馈神经网络**（Feedforward\
  \ Neural Network）。\n\n前馈神经网络中每一列的所有神经元称为神经网络的一层，输入数据的特征通常称为**输入层**，产生最终输出的最后一列神经元称为**输出层**，中间每一列神经元称为**隐藏层**。在前馈神经网络中，数据从输入层开始，依次经过每个隐藏层，最后通过输出层输出神经网络函数的最终输出值。在某些书籍中，包含输入层在内的层数称为神经网络的层数。例如，上述神经网络称为\
  \ 3 层神经网络；而在某些书籍中，上述神经网络称为 2 层神经网络，即不包含输入层。\n\n如图 4-18 所示，softmax 函数可以看作一个产生多个输出的神经元，而不是看作多个神经元。\n\
  \n**图 4-18** 将 softmax 函数视为一个产生多个输出的单个神经元\n\n\n\n\n#### 神经网络结构与前向传播\n\n上述神经网络的神经元有些特殊。其中，softmax\
  \ 输出层的神经元不计算上一层输入的加权和，隐藏层直接输出加权和，而不经过非线性激活函数的变换，即隐含的 A 层神经元是一个线性回归函数。\n\n一般神经网络隐藏层的神经元类似于逻辑回归神经元，即先计算加权和，再经过非线性激活函数变换后输出。输出层神经元可以是\
  \ softmax 神经元、线性回归神经元和逻辑回归神经元。因为 softmax 层的神经元没有权重等参数，而是一个确定的 `softmax()` 函数，所以在为多分类问题设计神经网络时，`softmax()`\
  \ 函数不能作为单独的一层，而是直接将 softmax 层的上一层作为输出层。也就是说，softmax 回归可以用下面的神经网络表示（如图 4-19 所示）：\n\
  \n**图 4-19** Softmax 回归可能不包含 softmax，可视为仅由 3 个加权求和神经元组成的神经网络\n\n即只有输入层和输出层，没有隐藏层。输出层的输出值代表输入数据属于各个类别的得分。这个得分再经过\
  \ `softmax()` 就可以输出数据属于各个类别的概率。也就是说，计算分类概率的 softmax 函数可以在图中省略。\n\n实际的神经网络至少包含一个隐藏层，通常包含很多隐藏层。随着以\
  \ GPU 为代表的硬件算力的发展和大规模数据的可用，现代神经网络通常包含很多隐藏层。神经网络包含的层数称为神经网络的深度，即现代神经网络的深度可以很大，甚至包含数百个隐藏层。更深的神经网络称为**深度神经网络**，基于深度神经网络的机器学习称为**深度学习**。\n\
  \n无论是深度神经网络还是浅层神经网络，其工作原理都是一样的。只是深度神经网络的深度更深而已。为简单起见，下面用一个浅层神经网络为例，说明如何用神经网络进行学习。\n\
  \n为了对上述二维坐标点进行分类，如图 4-20 所示，可以使用一个简单的 2 层神经网络作为假设函数进行模型训练。\n\n**图 4-20** 2 层神经网络，最左列是数据，中间列神经元构成隐藏层，最右列神经元构成输出层\n\
  \n隐藏层和输出层都是类似于逻辑回归函数的神经元，即每个神经元用自己的权重向量计算一个加权和 `z`，然后通过自己的激活函数产生一个输出值 `a`。\n\n这个只有一个隐藏层的\
  \ 2 层神经网络定义了一个函数 `f : R^D → R^K`。其中 `D` 是输入向量 `x` 的大小，`K` 是输出向量 `f(x)` 的大小。分别用 `l\
  \ = 0,1,2` 表示每一层，对一个神经元，用 `z` 表示输入值的加权和，用 `z[i]^[l]` 表示第 `l` 层第 `i` 个神经元的加权和，`a`\
  \ 表示输出值，`a[i]^[l]` 表示第 `l` 层第 `i` 个神经元的激活值。当 `l=0` 时，`a[i]^((0))` 是第 `i` 个输入特征。\n\
  \n假设第 1 层所有神经元的激活函数是同一个函数 `g^[1]`，每个神经元接受一个输入 `x = (x[1], x[2])` 并产生一个输出值，这些输出值（激活值）也构成一个向量\
  \ `a^[1] = (a[1]^[1], a[2]^[1], a[3]^[1], a[4]^[1])`：\n\n```\na[1]^[1] = g^1\na[2]^[1]\
  \ = g^1\na[3]^[1] = g^1\na[4]^[1] = g^1\n```\n\n用矩阵 `W^[1]`、`b^[1]` 表示这些权重和偏置向量：\n\
  \n```\nW^[1] = [[W_11^[1], W_12^[1], W_13^[1], W_14^[1]],\n         [W_21^[1], W_22^[1],\
  \ W_23^[1], W_24^[1]]]\n\nb^[1] = (b_1^[1], b_2^[1], b_3^[1], b_4^[1])\n```\n\n\
  即每一列代表一个神经元的权重或偏置，第 1 层神经元的计算过程可以表示为：\n\n```\na^[1] = g^1\n      1×4   1×2   2×4\
  \   1×4\n```\n\n假设第 2 层（输出层）所有神经元的激活函数也是同一个 `g^[2]`，它们接受来自隐藏层的这些输出值 `a^[1] = (a[1]^[1],\
  \ a[2]^[1], a[3]^[1], a[4]^[1])`，最终的输出值是向量 `a^[2] = (a[1]^[2], a[2]^[2], a[3]^[2])`：\n\
  \n```\na_1^[2] = g^2\na_2^[2] = g^2\na_3^[2] = g^2\n```\n\n用矩阵 `W^[2]`、`b^[2]` 表示这些权重和偏置向量：\n\
  \n```\nW^[2] = [[W_11^[2], W_12^[2], W_13^[2]],\n         [W_21^[2], W_22^[2], W_23^[2]],\n\
  \         [W_31^[2], W_32^[2], W_33^[2]],\n         [W_41^[2], W_42^[2], W_43^[2]]]\n\
  \nb^[2] = (b_1^[2], b_2^[2], b_3^[2])\n```\n\n第 2 层神经元的计算过程可以表示为：\n\n```\na^[2]\
  \ = g^2\n      1×3   1×4   4×3   1×3\n```\n\n整个神经网络函数 `f(x)` 用向量形式写出：\n\n```\nf(x)\
  \ = g^2) * W^[2] + b^[2])\n```\n\n用 `a^((0))` 表示输入数据 `x`，即：\n\n```\na^((0)) = (a_1^((0)),\
  \ a_2^((0))) = x = (x_1, x_2)\n```\n\n然后输入一个 `x` 即 `a^((0))`，该神经网络的计算过程如下：\n\n\n\
  \n$\\\\begin{matrix} {z z^{\\\\lbrack 1\\\\rbrack}} & {= a a^{(0)}W W^{\\\\lbrack\
  \ 1\\\\rbrack} + b b^{\\\\lbrack 1\\\\rbrack}} \\\\\\\\ {a a^{\\\\lbrack 1\\\\rbrack}}\
  \ & {= g^{\\\\lbrack 1\\\\rbrack}(z z^{\\\\lbrack 1\\\\rbrack})} \\\\\\\\ {z z^{\\\
  \\lbrack 2\\\\rbrack}} & {= a a^{\\\\lbrack 1\\\\rbrack}W W^{\\\\lbrack 2\\\\rbrack}\
  \ + b b^{\\\\lbrack 2\\\\rbrack}} \\\\\\\\ {f f(x x)} & {= a a^{\\\\lbrack 2\\\\\
  rbrack} = g^{\\\\lbrack 2\\\\rbrack}(z z^{\\\\lbrack 2\\\\rbrack})} \\\\\\\\ \\\\\
  end{matrix}$\n\n根据 `x x` → `z z`^(\\[1\\]) → `a a`^(\\[1\\]) → `z z`^(\\[2\\]) →\
  \ `a a`^(\\[2\\])，计算神经网络最终输出的过程称为**前向传播** (forward propagation) 或**前向计算**。\n\n可以看出，第一层和第二层的加权和与激活值的计算过程完全相似。对于一般的神经网络，第一层的加权和与激活值的计算公式如下：\n\
  \n$\\\\begin{matrix} & {z z^{\\\\lbrack l\\\\rbrack} = a a^{\\\\lbrack l - 1\\\\\
  rbrack}W W^{\\\\lbrack l\\\\rbrack} + b b^{\\\\lbrack l\\\\rbrack}} \\\\\\\\ & {a\
  \ a^{\\\\lbrack l\\\\rbrack} = g^{\\\\lbrack l\\\\rbrack}(z z^{\\\\lbrack l\\\\\
  rbrack})} \\\\\\\\ \\\\end{matrix}$\n\n第 `l` 层接收来自第 `l-1` 层的输入 `a a`^(\\[*l* − 1\\\
  ])，并计算加权和 `z z`^(\\[*l*\\]) = `a a`^(\\[*l* − 1\\])\\*`W W`^(\\[*l*\\]) + `b b`^(\\\
  [*l*\\])，通过激活函数 `g`^(\\[*l*\\])，输出 `a a`^(\\[*l*\\]) = `g`^(\\[*l*\\])(`z z`^(\\\
  [*l*\\])) 。\n\n上述神经网络的前向计算（前向传播）可以用以下 Python 代码实现（不失一般性，假设所有神经元的激活函数均为 sigmoid 函数）。\n\
  \n```\nimport numpy as np\n\ndef sigmoid(x):\n    return 1 / (1 + np.exp(-x))\n\n\
  g1 = sigmoid\ng2 = sigmoid\n\n# x and W1,b1\nx = np.array([1.0, 0.5])          \
  \   # input x: 1x2 row vector\nW1 = np.array([[0.1, 0.3, 0.5, 0.2],\n          \
  \     [0.4, 0.6, 0.7, 0.1]])   # W1 : 2x4 matrix\nb1 = np.array([0.1, 0.2, 0.3,\
  \ 0.4])   # bias b1: 1x4 row vector\nprint(\"x.shape\", x.shape)               \
  \         # (2,)\nprint(\"W1.shape\", W1.shape)                       # (2, 4)\n\
  print(\"b1.shape\", b1.shape)                       # (4,)\n\n# Calculate the value\
  \ of z1 and a1 from the input x and W1,b1\nz1 = np.dot(x, W1) + b1             \
  \   # (1,4)\na1 = g1(z1)                      # (1,4)\nprint(\"z1\", z1)       \
  \                      # (4,)\nprint(\"a1\", a1)\n\n# a1、W2,b2\nW2 = np.array([[0.1,\
  \ 1.4, 0.2], [2.5, 0.6, 0.3], [1.1, 0.7, 0.8], [0.3, 1.5, 2.1]])\nb2 = np.array([0.1,\
  \ 2, 0.3])\nprint(\"a2.shape\", a1.shape) # (4,)\nprint(\"W2.shape\", W2.shape)\
  \ # (2, 4)\nprint(\"b2.shape\", b2.shape) # (2,)\n\n# Calculate the value of z2\
  \ and a2 from a1, W2, b2\nz2 = np.dot(a1, W2) + b2\na2 = g2(z2)\nprint(\"z2\", z2)\n\
  print(\"a2\", a2)\n```\n\n```\nx.shape (2,)\nW1.shape (2, 4)\nb1.shape (4,)\nz1\
  \ [0.4 0.8 1.15 0.65]\na1 [0.59868766 0.68997448 0.75951092 0.65701046]\na2.shape\
  \ (4,)\nW2.shape (4, 3)\nb2.shape (3,)\nz2 [2.91737012 4.76932075 2.61406058]\n\
  a2 [0.94869845 0.99158527 0.93176103]\n```\n\n### 4.1.4 多样本的前向计算\n\n多个样本的数据特征，如\
  \ `m` 个样本 `x x`^((*i*)) 可以组成一个矩阵 `X X`：\n\n$\\\\begin{matrix} {X X = \\\\begin{bmatrix}\
  \ {x x^{(1)}} \\\\\\\\ {x x^{(2)}} \\\\\\\\ \\\\vdots \\\\\\\\ {x x^{(m)}} \\\\\\\
  \\ \\\\end{bmatrix}} \\\\\\\\ \\\\end{matrix}$\n\n每个样本对应的各层输出向量 `z z`^(\\[*l*\\\
  ]), `a a`^(\\[*l*\\]) 为 `Z Z`^(\\[*l*\\]), `A A`^(\\[*l*\\])：\n\n$\\\\begin{matrix}\
  \ {Z Z^{\\\\lbrack l\\\\rbrack} = \\\\begin{bmatrix} {z z^{\\\\lbrack 1\\\\rbrack(l)}}\
  \ \\\\\\\\ {z z^{\\\\lbrack 2\\\\rbrack(l)}} \\\\\\\\ \\\\vdots \\\\\\\\ {\\\\ pmbz^{\\\
  \\lbrack m\\\\rbrack(l)}} \\\\\\\\ \\\\end{bmatrix}\\\\quad A A^{\\\\lbrack l\\\\\
  rbrack} = \\\\begin{bmatrix} {a a^{\\\\lbrack 1\\\\rbrack(l)}} \\\\\\\\ {a a^{\\\
  \\lbrack 2\\\\rbrack(l)}} \\\\\\\\ \\\\vdots \\\\\\\\ {a a^{\\\\lbrack m\\\\rbrack(l)}}\
  \ \\\\\\\\ \\\\end{bmatrix}} \\\\\\\\ \\\\end{matrix}$\n\n其中 `z`^(\\1\\), `a`^(\\\
  2\\) 分别是第 `i` 个样本第 `l` 层的加权和与激活值，它们作为矩阵 `Z Z`^(*T**h**e**i* − *t**h**l**i**n**e**o**f*\\\
  [*l*\\]), `A A`^(\\[*l*\\]).\n\n多样本的前向计算可以写成向量（矩阵）形式如下：\n\n$\\\\begin{matrix} {Z\
  \ Z^{\\\\lbrack l\\\\rbrack} = \\\\begin{bmatrix} {z z^{\\\\lbrack 1\\\\rbrack(l)}}\
  \ \\\\\\\\ {z z^{\\\\lbrack 2\\\\rbrack(l)}} \\\\\\\\ \\\\vdots \\\\\\\\ {\\\\ pmbz^{\\\
  \\lbrack m\\\\rbrack(l)}} \\\\\\\\ \\\\end{bmatrix} = \\\\begin{bmatrix} {a a^{\\\
  \\lbrack 1\\\\rbrack(l - 1)}W W^{\\\\lbrack l\\\\rbrack} + b b^{\\\\lbrack l\\\\\
  rbrack}} \\\\\\\\ {a a^{\\\\lbrack 2\\\\rbrack(l - 1)}W W^{\\\\lbrack l\\\\rbrack}\
  \ + b b^{\\\\lbrack l\\\\rbrack}} \\\\\\\\ \\\\vdots \\\\\\\\ {a a^{\\\\lbrack m\\\
  \\rbrack(l - 1)}W W^{\\\\lbrack l\\\\rbrack} + b b^{\\\\lbrack l\\\\rbrack}} \\\\\
  \\\\ \\\\end{bmatrix}} \\\\\\\\ \\\\end{matrix}$\n\n由于 numpy 数组具有广播功能，上述公式可简化为：\n\
  \n`Z`^(\\[*l*\\]) = `A`^(\\[*l* − 1\\])\\*`W`^(\\[*l*\\]) + `b`^(\\[*l*\\])\n\n\
  同理，`A`^(\\[*l*\\]) 是 `Z`^(\\[*l*\\]) 的激活值：\n\n$\\\\begin{matrix} {A^{\\\\lbrack\
  \ l\\\\rbrack} = \\\\begin{bmatrix} {a a^{\\\\lbrack 1\\\\rbrack(l)}} \\\\\\\\ {a\
  \ a^{\\\\lbrack 2\\\\rbrack(l)}} \\\\\\\\ \\\\vdots \\\\\\\\ {a a^{\\\\lbrack m\\\
  \\rbrack(l)}} \\\\\\\\ \\\\end{bmatrix} = \\\\begin{bmatrix} {g^{\\\\lbrack l\\\\\
  rbrack}(z z^{\\\\lbrack 1\\\\rbrack(l)})} \\\\\\\\ {g^{\\\\lbrack l\\\\rbrack}(z\
  \ z^{\\\\lbrack 2\\\\rbrack(l)})} \\\\\\\\ \\\\vdots \\\\\\\\ {g^{\\\\lbrack l\\\
  \\rbrack}(z z^{\\\\lbrack m\\\\rbrack(l)})} \\\\\\\\ \\\\end{bmatrix}} \\\\\\\\\
  \ \\\\end{matrix}$\n\n由于 numpy 数组具有广播功能，上述公式可简化为：\n\n`A A`^(\\[*l*\\]) = `g`^(\\\
  [*l*\\])(`Z Z`^(\\[*l*\\])) \n\n因此，对于一般的第 `l` 层，前向计算的向量化公式如下：\n\n`Z Z`^(\\[*l*\\\
  ]) = `A`^(\\[*l* − 1\\])\\*`W W`^(\\[*l*\\]) + `b b`^(\\[*l*\\])\n\n`A A`^(\\[*l*\\\
  ]) = `g`^(\\[*l*\\])(`Z Z`^(\\[*l*\\])) \n\n同理，可以写出多样本前向计算的向量（矩阵）形式 Python 代码：\n\
  \n```\nX = np.array([[1.0, 2.], [3.0, 4.0]])\nW1 = np.array([[0.1, 0.3, 0.5, 0.2],\n\
  \               [0.4, 0.6, 0.7, 0.1]]) # W1 : 2x4 matrix\nb1 = np.array([0.1, 0.2,\
  \ 0.3, 0.4]) # bias b1: 1x4 row vector\n\nprint(\"X.shape\", X.shape) # (2,)\nprint(\"\
  W1.shape\", W1.shape) # (4, 2)\nprint(\"b1.shape\", b1.shape) # (4,)\n\n# Calculate\
  \ Z1, A1 of the first layer\nZ1 = np.dot(X, W1) + b1\nA1 = sigmoid(Z1)\nprint(\"\
  Z1:\", Z1)\nprint(\"A1:\", A1)\n\nW2 = np.array([[0.1, 1.4, 0.2], [2.5, 0.6, 0.3],\
  \ [1.1, 0.7, 0.8], [0.3, 1.5, 2.1]])\nb2 = np.array([0.1, 2, 0.3])\nprint(\"A1.shape\"\
  , A1.shape) # (2,)\nprint(\"W2.shape\", W2.shape) # (4, 2)\nprint(\"b2.shape\",\
  \ b2.shape) # (4,)\n\n# Calculate the Z2, A2 of the first layer\nZ2 = np.dot(A1,\
  \ W2) + b2\nA2 = sigmoid(Z2)\nprint(\"Z2:\", Z2)\nprint(\"A2:\", A2)\n```\n\n```\n\
  X.shape (2, 2)\nW1.shape (2, 4)\nb1.shape (4,)\nZ1: [[1. 1.7 2.2 0.8]\n     [2.\
  \ 3.5 4.6 1.4]]\nA1: [[0.73105858 0.84553473 0.90024951 0.68997448]\n     [0.88079708\
  \ 0.97068777 0.9900482 0.80218389]]\nA1.shape (2, 4)\nW2.shape (4, 3)\nb2.shape\
  \ (3,)\nZ2: [[3.4842095 5.19593923 2.86901816]\n     [3.94450732 5.71183814 3.24399047]]\n\
  A2: [[0.97023513 0.9944915 0.94629347]\n     [0.98100697 0.99670431 0.96245657]]\n\
  ```\n\n在某些书籍中，`x x`^((*i*)), `z z`^(\\[*l*\\]), `a a`^(\\[*l*\\]), `b b`^(\\[*l*\\\
  ]), 等以列向量形式书写，则\n\n`z z`^(\\[*l*\\]) = `W W`^(\\[*l*\\])\\*`a a`^(\\[*l* − 1\\])\
  \ + `b b`^(\\[*l*\\])\n\n\n\n\n$$\n\\begin{matrix} \n{zz^{[1]} = \\begin{bmatrix}\
  \ z_{1}^{[1]} \\\\ z_{2}^{[1]} \\\\ z_{3}^{[1]} \\\\ z_{4}^{[1]} \\\\ \\end{bmatrix}\
  \ = \\begin{bmatrix} W_{11}^{[1]} & W_{12}^{[1]} \\\\ W_{21}^{[1]} & W_{22}^{[1]}\
  \ \\\\ W_{31}^{[1]} & W_{32}^{[1]} \\\\ W_{41}^{[1]} & W_{42}^{[1]} \\\\ \\end{bmatrix}\\\
  begin{bmatrix} x_{1} \\\\ x_{2} \\\\ \\end{bmatrix} + \\begin{bmatrix} b_{1}^{[1]}\
  \ \\\\ b_{2}^{[1]} \\\\ b_{3}^{[1]} \\\\ b_{4}^{[1]} \\\\ \\end{bmatrix}} \\\\ \n\
  \\end{matrix}\n$$\n\n因为 `x^{(i)}` 是列向量，m 个样本 `x^{(i)}` 构成一个矩阵 `X`：\n\n$$\n\\pmb\
  \ X = \\begin {bmatrix}\\pmb x^{(1)}&x^{(2)}& \\cdots& x^{(m)} \\end {bmatrix}\\\
  tag{4-24}\n$$\n\n即将每个样本的数据特征 `x^{(i)}` 作为矩阵 `X` 的一列，因此加权和 `Z^{[1]}` 的计算公式为：\n\n\
  `Z^{[1]} = W^{[1]}X + b^{[1]}`\n\n一般情况下，有：\n\n$$\n\\pmb Z^{[l]} = \\pmb W^{[l]}\
  \ \\pmb A^{[l-1]} + \\pmb b^{[l]}\\tag{4-25}\n$$\n\n`A^{[l]} = g^{[l]}(Z^{[l]})`\n\
  \n### 4.1.5 输出\n\n当神经网络用于解决回归问题时，类似于线性回归，输出是实数轴上的任意实数，输出可以是一个实数，也可以是多个实数。例如，在目标定位问题中，需要输出目标的位置，如样本图像中目标的横纵坐标；对于人脸关键点检测，如图\
  \ 4-21 所示，需要输出人脸图像坐标中人脸的特征点数量。对于这些问题，输出值可以是任意实数。\n\n![](img/file91.jpg \"fig:\"\
  )\n\n图 4-21 人脸关键点\n\n解决二分类问题时，类似于逻辑回归，输出是样本属于某一类别的概率。该概率通过使用 `σ` 函数将属于实数区间的实数压缩到\
  \ `[0,1]` 区间来表示概率。解决多分类问题时，输出是样本属于各个类别的概率，这些概率通过 softmax 函数将同样数量的实数（在实数轴上）压缩到 `[0,1]`\
  \ 区间来表示概率。\n\n对于分类问题，即使不将实数轴上的实数压缩到表示概率的 `[0,1]` 区间，也可以根据实数值的大小来判断样本类别。例如，对于一个 3\
  \ 分类问题，如果输出是 3 个实数：219、18、564，那么可以知道该样本属于最大实数对应的第 3 类，而不是第 1 类或第 2 类。将任意实数转换为表示概率的实数，是为了从概率意义上定义二分类或多分类的交叉熵损失。\n\
  \n因此，对于分类问题，神经网络的输出可以是属于实数轴的实数，表示样本属于哪一类或多个不同类别的 `score`（得分）。也可以是通过 `σ` 和 softmax\
  \ 函数将得分转换为的概率。\n\n在设计神经网络结构时，如果将包含 `σ` 函数或 softmax 函数的神经元作为最后的输出层，输出的概率可以直接与目标值计算交叉熵损失。如果将输出得分的网络层作为输出层，无论是分类还是回归问题，输出都是实数轴上的任意实数，但对于分类问题，这种得分输出也会通过\
  \ `σ` 函数或 softmax 函数变换，以概率形式计算目标值的交叉熵损失。\n\n无论是使用 `σ` 函数还是 softmax 函数作为输出层，神经网络其他层中的神经元都是类似于逻辑回归函数的神经元，即每个神经元接收上一层的输入\
  \ `a^{[l−1]}`，利用该神经元的权重向量计算这些输入的加权和 `z^{[l]} = a^{[l−1]}W^{[l]}`，然后通过激活函数 `g^{[l]}`\
  \ 生成输出 `a^{[l]} = g^{[l]}(z^{[l]})`。如果输出得分作为输出层，该层的激活函数 `g^{[L]}` 通常是恒等函数，否则输出层是\
  \ `σ` 函数或 softmax 函数等特殊神经元。为了避免区分这种特殊神经元和一般的逻辑回归神经元，本书采用输出得分的网络层作为输出层。\n\n### 4.1.6\
  \ 损失函数\n\n无论是训练神经网络还是使用训练好的神经网络进行预测，都需要对样本神经网络的输出值（预测值）与真实值进行**误差评估**。这种误差也称为**损失**或**代价**。\n\
  \n如果某样本的预测值和真实值分别为 `f^{(i)}`、`y^{(i)}`，则该样本的误差为 `L(f^{(i)}, y^{(i)})`。训练神经网络或验证神经网络模型时，通常计算一组样本的总体平均误差。m\
  \ 个样本的误差可以取其误差的平均值，即：\n\n$L(f,y) = \\frac{1}{m}\\sum\\limits_{i = 1}^{m}L(f^{(i)},y^{(i)})$\n\
  \n对于某个样本，其误差（损失）`L(f^{(i)}, y^{(i)})` 随模型参数而不同，因为模型参数不同，预测值 `f^{(i)}` 也不同，多个样本的平均误差\
  \ `L(f, y)` 也是如此，即误差可视为预测值 `f^{(i)}` 和模型参数的函数，称为**损失函数**。通过最小化训练损失，可以获得损失函数取最小值时对应的模型参数。\n\
  \n神经网络中常用的损失函数是第 3 章中的三种：均方误差损失、二元交叉熵损失和多类交叉熵损失。\n\n#### 1. 均方误差损失\n\n**均方误差**是以所有样本预测值与真实值之间欧氏距离的平方的平均值作为误差。\n\
  \n对于多个样本，设 `F = (f^{(1)}, f^{(2)}, ⋯, f^{(m)})^T`，`Y = (y^{(1)}, y^{(2)}, ⋯, y^{(m)})^T`，则\
  \ `F` 和 `Y` 之间的均方误差损失 `ℒ(F, Y)` 为：\n\n$\\mathcal{L}(F,Y) = \\frac{1}{m}{\\parallel\
  \ (f^{(i)} - y^{(i)} \\parallel_2}^{2} = \\frac{1}{m}\\sum\\limits_{i = 1}^{m}{\\\
  parallel (f^{(i)} - y^{(i)} \\parallel_2}^{2}$\n\n乘以一个常数不会改变该损失函数的极值点。有时为了使求导后的梯度形式更美观，均方误差损失会除以\
  \ 2，即：\n\n$\\mathcal{L}(F,Y) = \\frac{1}{2m}{\\parallel (f^{(i)} - y^{(i)} \\parallel_2}^{2}\
  \ = \\frac{1}{2m}\\sum\\limits_{i = 1}^{2}{\\parallel (f^{(i)} - y^{(i)} \\parallel_2}^{2}$\n\
  \n对于样本 `(f^{(i)}, y^{(i)})`，`\\frac{1}{2}{\\parallel (f^{(i)} - y^{(i)} \\parallel_2}^{2}`\
  \ 的计算代码如下：\n\n```\nimport numpy as np\nf = np.array([0.1, 0.2,0.5])\ny = np.array([0.3,\
  \ 0.4,0.2])\nloss =  np.sum((f - y) ** 2)/2 \nprint(loss)\n```\n\n```\n0.084999999999999999\n\
  ```\n\n\n\n\n对于多个样本，$\\mathcal{L}(F, Y) = \\frac{1}{2m}{\\parallel (f^{(i)} - y^{(i)})\
  \ \\parallel_2}^{2}$ 可以通过以下代码计算：\n\n```\nF = np.array([[0.1, 0.2, 0.5], [0.1, 0.2,\
  \ 0.5]])\nY = np.array([[0.3, 0.4, 0.2], [0.3, 0.4, 0.2]])\n\nm = len(F)\nloss =\
  \ np.sum((F - Y) ** 2) / (2 * m)\n# loss = (np.square(H-Y)).mean() \nprint(loss)\n\
  ```\n\n```\n0.08499999999999999\n```\n\n均方误差可以写成一个函数：\n\n```\ndef mse_loss(F, Y,\
  \ divid_2=False):\n    m = F.shape[0]\n    loss = np.sum((F - Y) ** 2) / m\n   \
  \ if divid_2:\n        loss /= 2\n    return loss\n\nmse_loss(F, Y, True)\n```\n\
  \n```\n0.08499999999999999\n```\n\n均方误差用于回归问题，对于分类问题，通常使用交叉熵损失。\n\n#### 2. 二分类交叉熵损失\n\
  \n对于二分类问题，输出层只有一个逻辑回归神经元，输出样本属于某一类别（如类别 1）的概率，所有样本的概率输出形成向量 `f`，训练样本的目标值用 1 或 0\
  \ 表示样本属于哪一类。所有样本目标值组成的向量用 `y` 表示。则交叉熵损失为：\n\n$$\n\\begin{matrix} \nL(f, y) = \\\
  frac{1}{m}\\sum\\limits_{i = 1}^{m}L_{i}(y^{(i)}, f^{(i)}) = - \\frac{1}{m}\\sum\\\
  limits_{i = 1}^{m}\\left\\lbrack y^{(i)}\\log(f^{(i)}) + (1 - y^{(i)})\\log(1 -\
  \ f^{(i)}) \\right\\rbrack \\\\ \n= - \\frac{1}{m}\\text{np.sum}(y \\log f + (1\
  \ - y)\\log(1 - f)) \n\\end{matrix}\n$$\n\n其中 $y^{(i)}$ 取值为 1 或 0，表示样本所属类别，$f^{(i)}$\
  \ 表示样本属于取值为 1 的类别的概率。\n\n二分类交叉熵损失可以通过以下代码计算：\n\n```\n- (1./m) * np.sum(np.multiply(y,\
  \ np.log(f)) + np.multiply((1 - y), np.log(1 - f)))\n```\n\n例如：\n\n```\n# https://towardsdatascience.com/neural-net-from-scratch-using-numpy-71a31f6e3675\n\
  f = np.array([0.1, 0.2, 0.5])  # 三个样本对应类别 1 的概率\ny = np.array([0, 1, 0])       \
  \ # 对应 3 个样本的分类\nm = y.shape[0]\n\nloss = - (1./m) * np.sum(np.multiply(y, np.log(f))\
  \ + np.multiply((1 - y), np.log(1 - f)))\nprint(loss)                          \
  \                       \n```\n\n```\n0.8026485362172906\n```\n\n为了防止 `f` 或 `1-f`\
  \ 取值为 0 导致 `log()` 函数异常，可以在对数计算中加入一个极小量 $\\epsilon$，因此可以写出如下的二分类交叉熵损失函数：\n\n```\n\
  def binary_crossentropy(f, y, epsilon=1e-8):\n    # np.sum(y*np.log(f+epsilon)+\
  \ (1-y)*np.log(1-f+epsilon), axis=1)   \n    m = len(y)\n    return - (1./m) * np.sum(np.multiply(y,\
  \ np.log(f + epsilon)) + np.multiply((1 - y), np.log(1 - f + epsilon)))    \n\n\
  binary_crossentropy(f, y)\n```\n\n```\n0.8026485091802541\n```\n\n#### 3. 多分类交叉熵损失\n\
  \n上述是二分类问题的交叉熵损失，可以推广到 2 类以上的多分类问题。$f_c^{(i)}$ 表示第 $i$ 个样本属于第 $c$ 个类别的概率，$y_c^{(i)}$\
  \ 用 1 或 0 判断第 $i$ 个样本是否属于类别 $c$，即独热向量 $y^{(i)}$ 表示样本目标值。根据第 3 章的 Softmax 回归可知，多个样本的交叉熵损失如下：\n\
  \n$$L(f, y) = \\frac{1}{m}\\sum\\limits_{i = 1}^{m}L_{i}(\\mathbf{y}^{(i)}, \\mathbf{f}^{(i)})\
  \ = - \\frac{1}{m}\\sum\\limits_{i = 1}^{m}\\sum\\limits_{c = 1}^{C}y_{c}^{(i)}\
  \ \\cdot \\log(f_{c}^{(i)}) = - \\frac{1}{m}\\sum\\limits_{i = 1}^{m}y^{(i)} \\\
  cdot \\log(f^{(i)})$$\n\n例如，若为 3 分类问题（$C=3$），某样本的 $f^{(i)}$ 和 $y^{(i)}$ 值为：\n\n\
  $$\n\\begin{matrix} \nf^{(i)} = \\begin{bmatrix} f_{1}^{(i)} & f_{2}^{(i)} & f_{3}^{(i)}\
  \ \\end{bmatrix} = \\begin{bmatrix} 0.3 & 0.5 & 0.2 \\end{bmatrix} \\\\ \ny^{(i)}\
  \ = \\begin{bmatrix} y_{1}^{(i)} & y_{2}^{(i)} & y_{3}^{(i)} \\end{bmatrix} = \\\
  begin{bmatrix} 0 & 0 & 1 \\end{bmatrix} \n\\end{matrix}\n$$\n\n该样本的真实类别为第 3 类，预测值表示样本属于三个类别的概率。对该样本，其交叉熵损失为：\n\
  \n$$- (0 \\times \\log(0.3) + 0 \\times \\log(0.5) + 1 \\times \\log(0.2)) = -\\\
  log(0.2)$$\n\n交叉熵损失仅取决于对应真实类别的项。\n\n因此，若所有样本的目标值均为独热向量，对 $m$ 个样本，$\\mathcal{L}(f,\
  \ y)$ 可写为向量化的哈达玛积形式：\n\n$$\\mathcal{L}(f, y) = - \\frac{1}{m}\\text{sum}(\\mathbf{y}\
  \ \\odot \\log(\\mathbf{f}))$$\n\n在 NumPy 代码中可写为：\n\n```\n-(1./m) * np.sum(np.multiply(y,\
  \ np.log(f)))\n```\n\n例如，对于 $m=2$ 个样本，Softmax 输出 $F$ 与样本目标值（独热向量）矩阵 $Y$ 如下：\n\n\
  $$\n\\begin{matrix} \nF = \\begin{bmatrix} 0.2 & 0.5 & 0.3 \\\\ 0.4 & 0.3 & 0.3\
  \ \\end{bmatrix} \\quad \nY = \\begin{bmatrix} 0 & 0 & 1 \\\\ 1 & 0 & 0 \\end{bmatrix}\
  \ \n\\end{matrix}\n$$\n\n以下代码计算这 2 个样本的交叉熵损失：\n\n```\ndef cross_entropy_loss_onehot(F,\
  \ Y):\n    m = len(F)  # F.shape[0]\n    return -(1./m) * np.sum(np.multiply(Y,\
  \ np.log(F)))\n\nF = np.array([[0.2, 0.5, 0.3], [0.4, 0.3, 0.3]])\nY = np.array([[0,\
  \ 0, 1], [1, 0, 0]])\ncross_entropy_loss_onehot(F, Y)\n```\n\n```\n1.0601317681000455\n\
  ```\n\n如果每个样本的目标值不使用独热向量表示，而是用整数表示样本属于哪一类。对于 $C$ 分类问题，这些整数值为 $0, 1, 2, \\dots, C-1$，如用整数\
  \ 2 表示样本属于第 3 类。此时样本的交叉熵损失为 $f^{(i)}$ 中对应分量的负对数值（即下标为 2 的类别 $f_2^{(i)}$），即 $-\\\
  log f_2^{(i)}$。\n\n对于用整数表示样本目标类别的情况，多分类交叉熵损失为：\n\n$$\\mathcal{L}(f, y) = \\frac{1}{m}\\\
  sum\\limits_{i = 1}^{m}L_{i}(y^{(i)}, f^{(i)}) = - \\frac{1}{m}\\sum\\limits_{i\
  \ = 1}^{m}\\log(f_{y^{(i)}}^{(i)})$$\n\n其中 $y^{(i)}$ 表示第 $i$ 个样本所属类别对应的整数值（下标）。\n\
  \n因此，可以定义如下的多分类交叉熵计算函数：\n\n```\ndef cross_entropy_loss(F, Y, onehot=False):\n  \
  \  m = len(F)              # F.shape[0] 样本数量\n    if onehot:\n        return -(1./m)\
  \ * np.sum(np.multiply(Y, np.log(F)))\n    else: \n        return - (1./m) * np.sum(np.log(F[range(m),\
  \ Y]))  # F[i] 中对应 Y[i] 类别的对数值\n```\n\n在以下代码中，`F` 是 2 个样本的输出，每个样本的输出向量有 3 个分量，表示样本属于\
  \ 3 个类别的概率，目标 `Y` 的第 $i$ 个分量表示第 $i$ 个样本对应的类别下标值（如 0, 1, 2）。\n\n```\nF = np.array([[0.2,\
  \ 0.5, 0.3], [0.4, 0.3, 0.3]])  # 每行对应一个样本\nY = np.array([2, 0])               \
  \                # 第 1 个样本属于第 2 类，第 2 个样本属于第 0 类\n\ncross_entropy_loss(F, Y)\n```\n\
  \n```\n1.0601317681000455\n```\n\n以下代码将整数下标数组转换为独热数组。\n\n```\n# numpy.eye(number\
  \ of classes)[vector containing the labels]\nn_C = np.max(Y) + 1        # 类别数量\n\
  one_hot_y = np.eye(n_C)[Y]\nprint(one_hot_y)\n```\n\n\n\n\n```\n[[0. 0. 1.]\n  \
  \   [1. 0. 0.]]\n```\n\n```\ncross_entropy_loss_onehot(F,one_hot_y)\n```\n\n```\n\
  1.0601317681000455\n```\n\n当然，为了防止过拟合，可以在上述损失的基础上添加正则化项，对绝对值较大的模型参数施加更大的惩罚，以防止模型参数的绝对值过大。\n\
  \n$$ \\mathcal{L}(f f,y y) = \\frac{1}{m}\\sum\\limits_{i = 1}^{m}L_{i}(y y^{(i)},f\
  \ f^{(i)}) + \\lambda\\sum\\limits_{l = 1}^{L} \\parallel W W^{\\lbrack l\\rbrack}\
  \ \\parallel_{2}^{2} $$\n\n### 4.1.7 基于数值梯度的神经网络训练\n\n与回归问题一样，具有特定结构的神经网络函数完全由神经元的参数（权重参数和偏置参数）决定，不同的参数代表不同的具体神经网络函数。\n\
  \n对于一组样本，我们希望找到能最好地拟合这些样本的神经网络参数，即确定一个能最好地响应样本特征与目标值之间关系的神经网络函数。寻找最佳神经网络参数的过程与任何机器学习模型训练过程相同，都是寻找使某个损失最小化的模型参数。具体来说，就是通过求解损失函数的最小化问题来确定神经网络的模型参数。这个过程称为**神经网络训练**。\n\
  \n神经网络的训练与回归模型的训练相同，都使用梯度下降法迭代更新模型参数，直到算法收敛到足够程度或达到最大迭代次数。梯度下降法需要计算损失函数关于模型参数的偏导数。神经网络通常包含许多层，每层有许多神经元，每个神经元包含许多模型参数。计算偏导数比回归问题更复杂。\n\
  \n上文讨论了神经网络的前向计算和损失函数的计算，在梯度下降算法中可以使用数值梯度来近似解析梯度。接下来，为之前的 2 层神经网络实现一个完整的神经网络训练和预测算法。\n\
  \n<https://www.bogotobogo.com/python/scikit-learn/Artificial-Neural-Network-ANN-5-Checking-Gradient.php>\n\
  \n在线性回归中，模型参数通常初始化为 0，但如果神经网络模型中的权重参数初始化为 0，神经网络的神经元最终会收敛，即所有神经元的模型参数将相同，而每层有多个神经元。一个神经元等同于一个神经元，这极大地降低了神经网络的表达能力，使得难以获得令人满意的神经网络。因此，权重通常随机初始化，研究人员提供了多种不同的神经网络权重初始化方法。\n\
  \n通常，神经网络的偏置初始化为 0，权重参数从高斯分布等分布中随机采样。如果某层神经元的数量为 $n^{(l)}$，上一层的输出值数量为 $n^{(l-1)}$，则该层的神经元权重矩阵\
  \ $W^{(l)}$ 是一个 $n^{(l-1)} \\times n^{(l)}$ 矩阵，可以用以下 Python 代码初始化：\n\n```python\n\
  Wl = np.random.randn(n_l_1,n_l)* 0.01\n```\n\n即将标准正态分布的所有随机值乘以 0.01。\n\n假设上述双层神经网络的输入特征数量为\
  \ `n_x`，中间层和输出层的神经元数量分别为 `n_h` 和 `n_o`，函数 `initialize_parameters()` 完成所有模型参数的初始化并返回一个字典对象。\n\
  \n```python\nimport numpy as np\n\ndef initialize_parameters(n_x, n_h, n_o):\n \
  \   np.random.seed(2)            # 固定种子，使得每次运行此代码时\n                           \
  \      # 随机数的值始终相同\n  \n    W1 = np.random.randn(n_x,n_h)* 0.01\n    b1 = np.zeros((1,n_h))\n\
  \    W2 = np.random.randn(n_h,n_o) * 0.01\n    b2 = np.zeros((1,n_o))\n    \n  \
  \  assert (W1.shape == (n_x, n_h))\n    assert (b1.shape == (1, n_h))\n    assert\
  \ (W2.shape == (n_h, n_o))\n    assert (b2.shape == (1, n_o))\n    \n    parameters\
  \ = [W1,b1,W2,b2]\n    return parameters\n```\n\n测试此函数：\n\n```python\nn_x, n_h,\
  \ n_o = 2,4,3\n\nparameters = initialize_parameters(n_x, n_h, n_o)\n\nprint(\"W1\
  \ = \" + str(parameters[0]))\n\nprint(\"b1 = \" + str(parameters[1]))\n\nprint(\"\
  W2 = \" + str(parameters[2]))\n\nprint(\"b2 = \" + str(parameters[3]))\n```\n\n\
  ```\nW1 = [[-0.00416758 -0.00056267 -0.02136196 0.01640271]\n     [-0.01793436 -0.00841747\
  \ 0.00502881 -0.01245288]]\n    b1 = [[0.0.0.0.]]\n    W2 = [[-1.05795222e-02 -9.09007615e-03\
  \ 5.51454045e-03]\n     [ 2.29220801e-02 4.15393930e-04 -1.11792545e-02]\n     [5.39058321e-03-5.96159700e-03-1.91304965e-04]\n\
  \     [ 1.17500122e-02 -7.47870949e-03 9.02525097e-05]]\n    b2 = [[0.0.0.]]\n```\n\
  \n编写前向计算函数 `forward_propagation(X, parameters)`：\n\n```python\ndef sigmoid(x):\n\
  \    return 1 / (1 + np.exp(-x))\n\ndef forward_propagation(X, parameters):    \
  \ \n    W1,b1,W2,b2 = parameters       \n   \n    Z1 = np.dot(X,W1) + b1    # Z1\
  \ shape： (3,2)(2,4)+(1,4)=>(3,4)  \n    A1 = np.tanh(Z1)\n    Z2 = np.dot(A1,W2)\
  \ + b2   # Z2 shape： (3,4)(4,3)+(1,3)=>(3,3) \n    #A2 = sigmoid(Z2)  \n   \n  \
  \  assert(Z2.shape == (X.shape[0],3))\n    return Z2\n```\n\n可以测试此函数：\n\n```python\n\
  X = np.array([[1.,2.],[3.,4.],[5.,6.]])  # 每行对应一个样本\n\nZ2 = forward_propagation(X,\
  \ parameters)\nprint(Z2)\n```\n\n```\n[[-1.36253581e-04 4.87491807e-04 -2.47960226e-05]\n\
  \     [-1.64985210e-04 1.01574088e-03 -5.99877659e-05]\n     [-1.96135525e-04 1.54048069e-03\
  \ -9.36558871e-05]]\n```\n\n前向计算函数输出属于每个类别的得分 `Z`，得分可以通过 `softmax()` 函数转换为属于每个类别的概率，然后结合真实目标值计算多分类交叉熵损失。函数\
  \ `softmax_cross_entropy()` 和函数 `softmax_cross_entropy_reg()` 根据输出得分值 `Z` 和真实值 `y`\
  \ 计算交叉熵损失，其中包含正则项损失（`reg` 为正则项系数）。\n\n```python\ndef softmax(Z):\n    exp_Z = np.exp(Z-np.max(Z,axis=1,keepdims=True))\n\
  \    return exp_Z/np.sum(exp_Z,axis=1,keepdims=True)\n\ndef softmax_cross_entropy(Z,\
  \ y, onehot=False):\n    m = len(Z)\n    F = softmax(Z)\n    if onehot:\n      \
  \  loss = -np.sum(y*np.log(F))/m\n    else:\n        y.flatten()\n        log_Fy\
  \ = -np.log(F[range(m),y])        \n        loss = np.sum(log_Fy) / m\n    return\
  \ loss\n\ndef softmax_cross_entropy_reg(Z, Y, parameters,onehot=False,reg=1e-3):\n\
  \    W1 = parameters[0]  \n    W2 = parameters[2]\n    L  = softmax_cross_entropy(Z,y,onehot)+\
  \ reg*(np.sum(W1**2)+np.sum(W2**2))    \n    assert(isinstance(L, float))    \n\
  \    return L\n```\n\n```python\ny = np.array([2,0,1])             # 每行对应一个样本\n\
  softmax_crossentropy_loss(Z2,y,parameters)\n```\n\n```\n1.098427770814438\n```\n\
  \n通常希望神经网络能通过输入一组数据 `X` 和对应的目标值 `y` 来计算损失函数值。因此，将前向计算和单独的交叉熵损失计算函数结合起来：\n\n```python\n\
