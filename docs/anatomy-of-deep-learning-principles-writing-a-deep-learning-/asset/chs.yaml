  ---\n\n##### 特殊字符扩展与辅助函数\n\n由于上述训练的 Word2Vec 模型不包含特殊字符 `SOS`、`EOS` 和 `UNK`，这三个特殊词也可以添加到词表中以获得扩展词表（词表长度变为\
  \ `hidden_n + 3`）。对于这 3 个特殊词，其量化表示可直接用随机向量表示：\n\n```python\nimport numpy as np\n\
  \nSEU_count = 3\nin_SEU = np.random.rand(3, hidden_n + SEU_count)\nout_SEU = np.random.rand(3,\
  \ hidden_n + SEU_count)\n```\n\n以下代码定义了一些辅助函数，用于从字面句子获取索引句子和词量化表示。\n\n`indexesFromSentence()`\
  \ 将句子的单词转换为词表索引。因为 `gensim` 的模型词表不包含 3 个特殊字符，所以普通单词 `word` 在 `gensim` 词模型中的索引是 `vocab.wv.vocab[word].index`，需要加上偏移量\
  \ `SEU_count=3` 才能得到其在扩展词表中的索引。\n\n`vocab_word2vec` 根据 `gensim` 的 Word2Vec 模型的词表索引（包含特殊字符的词表索引）序列，为每个词索引\
  \ `idx` 获取其量化表示。对于普通词，索引也应偏移到 `gensim` 词表的索引 `vocab.wv.index2word[idx - SEU_count]`。对于特殊字符，直接使用\
  \ `SEU[idx]` 获取其量化表示。\n\n```python\ndef indexesFromSentence(vocab, sentence):\n\
  \    return [vocab.wv.vocab[word].index + SEU_count for word in sentence.split('\
  \ ')]\n\ndef vocab_word2vec(vocab, word_indices_input, SEU, expend=False):\n   \
  \ x = []\n    SEU_vec = np.zeros(SEU_count)\n```\n\n\n\n\nword_indices_input = word_indices_input.reshape(-1)\n\
  \nfor idx in word_indices_input:\n    if idx <= 2:\n        x.append(SEU[idx])\n\
  \    else:\n        word = vocab.wv.index2word[idx - SEU_count]\n        vec = vocab.wv[word]\n\
  \        vec = np.append(vec, SEU_vec)\n        x.append(vec)\n\nx = np.array(x)\n\
  \nif expend:\n    x = np.expand_dims(x, axis=1)\n\nreturn x\n\nSOS_token = 0\nEOS_token\
  \ = 1\nUNK_token = 2\n\ndef tensorFromSentence(vocab, sentence):\n    indexes =\
  \ indexesFromSentence(vocab, sentence)\n    indexes.append(EOS_token)\n    return\
  \ np.array(indexes).reshape(-1, 1)\n\ndef tensorsFromPair(pair):\n    input_tensor\
  \ = tensorFromSentence(in_vocab, pair[0])\n    target_tensor = tensorFromSentence(out_vocab,\
  \ pair[1])\n    return (input_tensor, target_tensor)\n\ndef indexToSentence(vocab,\
  \ indexes):\n    sentense = [vocab.wv.index2word[idx - SEU_count] for idx in indexes]\n\
  \    return ' '.join(sentense)\n\n```\ntensorFromSentence() and tensorsFromPair\
  \ respectively convert a sentence or a pair of sentences from a string to an index\
  \ sequence. As before, tensorsFromPair() adds an end character after each sentence.\
  \ indexToSentence() converts a sentence from a sequence of word indices to a sequence\
  \ of strings.\n```\n\n为了用 Word2Vec 替换独热向量，需要修改编码器和解码器的代码，可以定义一个派生类：\n\n```\nclass\
  \ EncoderRNN_w2v(EncoderRNN):\n    def __init__(self, input_size, hidden_size, vocab,\
  \ num_layers=1):\n        super(EncoderRNN_w2v, self).__init__(input_size, hidden_size,\
  \ num_layers)\n        self.vocab = vocab\n\n    def word2vec(self, word_indices_input):\n\
  \        return vocab_word2vec(self.vocab, word_indices_input, in_SEU, True)\n\n\
  class DecoderRNN_w2v(DecoderRNN):\n    def __init__(self, input_size, hidden_size,\
  \ output_size, vocab, num_layers=1, teacher_forcing_ratio=0.5):\n        super().__init__(input_size,\
  \ hidden_size, output_size, num_layers, teacher_forcing_ratio)\n        self.vocab\
  \ = vocab\n\n    def word2vec(self, word_indices_input):\n        return vocab_word2vec(self.vocab,\
  \ word_indices_input, out_SEU, True)\n```\n\n以下代码开始训练：\n\n```\nfrom train import\
  \ *\nfrom Layers import *\nfrom rnn import *\nimport util\n\nhidden_size = 256\n\
  num_layers = 1\nclip = 5.  # 50.\nlearning_rate = 0.1\ndecoder_learning_ratio =\
  \ 1.0\nteacher_forcing_ratio = 0.5\nn_iters = 70000\nprint_every, plot_every = 100,\
  \ 100  # 10,10\ninput_size = hidden_n + SEU_count  # 一个 Vec 的长度\noutput_size = len(out_vocab.wv.vocab)\
  \ + SEU_count  # 单词数量\n\nencoder = EncoderRNN_w2v(input_size, hidden_size, in_vocab)\n\
  decoder = DecoderRNN_w2v(input_size, hidden_size, output_size, out_vocab, num_layers,\
  \ teacher_forcing_ratio)\n\nmomentum = 0.3\ndecay_every = 1000\n\nencoder_optimizer\
  \ = SGD(encoder.parameters(), learning_rate, momentum, decay_every)\ndecoder_optimizer\
  \ = SGD(decoder.parameters(), learning_rate * decoder_learning_ratio, momentum,\
  \ decay_every)\n\nreg = None  # 1e-2\n\nnp.random.shuffle(pairs)\ntrain_n = int(len(pairs)\
  \ * 0.98)\ntrain_pairs = pairs[:train_n]\nvalid_pairs = pairs[train_n:]\n\nprint_every,\
  \ plot_every = 100, 100  # 10,10\nn_iters = 40000\n\nidx_train_pairs = [tensorsFromPair(random.choice(train_pairs))\
  \ for i in range(n_iters)]\nidx_valid_pairs = [tensorsFromPair(pair) for pair in\
  \ valid_pairs]\n\ntrainIters(encoder, decoder, encoder_optimizer, decoder_optimizer,\
  \ idx_train_pairs, idx_valid_pairs, True, print_every, plot_every, reg)\n```\n\n\
  output:\n\n![](img/file169.png \"fig:\")\n\n使用训练好的模型进行翻译预测：\n\n```\nindices = np.random.randint(len(pairs),\
