  \n数据是机器学习和现代人工智能的基础。数据越多，机器学习算法的性能越好。正是因为海量数据的存在，大公司才能开发出搜索引擎、推荐系统、智能游戏等高性能人工智能产品。常言道：“谁拥有数据，谁就拥有未来。”大数据也是神经网络重现辉煌和深度学习发展的关键因素之一。\n\
  \n对于许多问题，人工获取数据（如医学影像数据）通常非常困难且昂贵。例如，要提升人脸识别等人脸相关算法的性能，需要大量人脸图像数据，而这些人脸图像的采集不仅需要用户授权，还需要支付一定代价。如果能自动生成难以与真实人脸区分的人脸图像，就能节省成本和费用，推动人脸相关研究与应用。另一个例子是，视频游戏影视作品中包含大量二维和三维场景。设计制作这些场景需要投入大量人力、物力和财力，导致拍摄电影和制作游戏的成本极高。如果能自动生成这些影视作品中的高质量场景，就能节省大量财力和人力，使产品开发者能更专注于创意工作。\n\
  \n机器学习中的**生成模型**专门研究如何利用计算机自动生成与真实数据相似的数据，即生成模型能自动生成难以与真实数据区分的假数据。第 7 章自然语言理解中的语言模型就是一种生成模型。优秀的语言模型能为机器翻译、聊天对话、文章生成等应用生成流畅的句子。通常，一旦训练完成，循环神经网络就可用于源源不断地生成序列数据。\n\
  \n因此，自动生成的数据可以解决许多研究问题的数据匮乏问题，不仅能提升相关问题上机器学习算法的性能，还能促进各类应用产品的发展。例如，自动人脸生成技术用于视频换脸（如\
  \ DeepFake）等各类人脸应用问题；自动图像生成可生成各种风格的图像；自动语音合成技术可自动合成各种类似真人的声音；以及自动作曲等。\n\n本章主要讨论基于深度神经网络（深度学习）的两种最流行的生成模型技术：**变分自编码器**（Variational\
  \ Auto-Encoders，**VAE**）、**生成对抗网络**（Generative Adversarial Network，**GAN**）。\n\n\
  ## 8.1 生成模型\n\n以生成人脸图像为例，如何自动生成与真实人脸相同的人脸？如果对图像的不同像素进行涂鸦式的任意着色，显然不可能生成看起来像真实图像的图像，更别提人脸了。\n\
  \n世界上每张人脸图像都不同，但无论差异多大，人们一眼就能分辨出一张图像是人脸，而不是猫、狗或植物。如果用形状相同的张量（如三维张量）表示所有人脸图像，即红、绿、蓝三色图像表示，例如用一个`3\
  \ × 1024 × 768`的张量表示一张人脸图像，包含`1024 × 768`个像素，每个像素由红、绿、蓝三色值表示，则一张人脸图像包含`3 × 1024\
  \ × 768`个变量值。设`x`代表该张量，则`x`是`3 × 1024 × 768`维线性空间中的数据点，或每张人脸图像对应的`x`对应该线性空间中的一个坐标点。该空间中所有真实人脸图像对应的`x`数据点并非随机分布，通常位于该空间的一个小子空间内，就像二维平面上直线上的点分布在该直线上一样。`x`是一个变化的随机变量。该大线性空间中所有真实人脸图像对应的`x`坐标点分布有其特定的概率分布规律或概率分布密度，但这种概率分布无法用解析数学表达式表示。\n\
  \n如果某个模型能自动生成难以与真实人脸图像区分的人脸图像，那么这些自动生成的图像必然服从真实人脸图像的底层概率分布。\n\n因此，生成建模的核心在于生成与真实数据具有相同（或尽可能相似）概率分布的人工数据。例如，真实数据是平面上圆上的所有数据点，如果生成的数据点也位于这个圆上，则称生成的数据点满足圆的分布。如果真实数据是数轴上满足某种概率分布的实数，例如在区间`[0,1]`上均匀分布的实数，如果生成模型生成的实数也在`[0,1]`区间上均匀分布，即生成的实数与真实的实数具有相同的概率分布，则这两组实数难以区分。但通常我们只知道这些实数，而不知道这些实数背后的概率分布。如何生成与这些真实实数具有相同概率分布的实数？这就是生成模型要解决的问题。\n\
  \n生成模型通常是参数化模型，如参数化的神经网络函数。为了获得能生成服从真实数据分布的假数据的生成模型，需要基于真实数据学习参数化生成模型的参数。这与用真实数据学习回归模型参数是一样的。只要确定了参数化生成模型的参数，就能根据确定的生成模型自动生成服从真实数据分布的假数据，意味着这些假数据与真实数据难以区分。\n\
  \n当然，生成模型生成的数据分布不可能与真实数据分布完全相同。两个分布越接近，生成的数据就越难与真实数据区分。\n\n如果有一组实数，即真实数据是实数，这些实数位于实数轴上，但它们在实数轴上的分布未知，如何生成难以与这些真实实数区分、或者说伪造数据服从这些真实实数分布的假实数？例如，这些实数是海南省人们的身高。如果生成的身高数据不服从这些身高数据的分布，就很容易被识别出来。\n\
  \n对于一组实数等低维数据，可以通过简单的统计计算用频率近似数据的概率分布。例如，下面是来自文件`real_values.npy`的一组实数，该集合`{x^(i)}`构成真实数据。\n\
  \n```\n```\n\n\n\n\n### 实数分布分析\n\n#### 数据加载与初步查看\n\n```python\nimport numpy as np\n\
  \nx = np.load('real_values.npy')\n\nprint(x.shape)\nprint(x[:5])\n```\n\n输出结果：\n\
  \n```\n(10000,)\n[4.88202617 4.2000786  4.48936899 5.1204466  4.933779  ]\n```\n\
  \n#### 分布分析方法\n\n如何理解这组实数在实数空间 `R` 中的分布？或者说它们服从什么样的概率分布？可以将实数轴划分为许多小区间，统计落在每个小区间内的实数频数。只要数据量足够大，这个频数就能足够接近概率，从而了解这组实数在实数空间\
  \ `R` 中的概率分布。\n\n下面的代码以直方图和曲线的形式展示了这组数据的近似概率频数分布：\n\n```python\nimport numpy as\
  \ np\nfrom matplotlib import pyplot as plt\n\n%matplotlib inline\n\ndef draw_hist(plt,\
  \ x, bin_num=10):\n    xmin, xmax = np.min(x), np.max(x)\n    bins = np.linspace(xmin,\
  \ xmax, bin_num)\n    plt.hist(x, bins=bins, density=True, alpha=0.7)\n    x2 =\
  \ np.sort(x)  # 对实数进行排序\n    p, _ = np.histogram(x2, bins, density=True)  # 计算 bins\
  \ 中每个区间的频数 p\n    p_x = np.linspace(xmin, xmax, len(p))\n    plt.plot(p_x, p, 'b-',\
  \ linewidth=2, label='real data')\n\ndraw_hist(plt, x, 26)\nplt.show()\n```\n\n\
  ![Figure 8-1 Statistical histogram of a set of real numbers](img/file176.png \"\
  fig:\")\n**Figure 8-1** 一组实数的统计直方图\n\n通过直方图可以观察到，这组实数的分布接近高斯分布，高斯分布的中心点（均值）约为 `4.0`。也很容易计算出这组实数的标准差约为\
  \ `0.5`。\n\n#### 使用 Seaborn 绘制概率密度\n\n对于这组实数，也可以使用 `seaborn` 库的 `kdeplot()` 函数绘制概率密度，方法更简单：\n\
  \n```python\nimport seaborn as sns\n\nsns.set(color_codes=True)\nsns.kdeplot(x.flatten(),\
  \ shade=True, label='Probability Density')\n```\n\n结果的概率分布图如下：\n\n![Figure 8-2 Probability\
  \ density plot for a set of real numbers](img/file177.png \"fig:\")\n**Figure 8-2**\
  \ 一组实数的概率密度图\n\n#### 数据生成验证\n\n实际上，这些实数确实是从均值为 `4`、方差为 `0.5` 的正态分布中采样得到的，生成代码如下：\n\
  \n```python\nimport numpy as np\n\nnp.random.seed(0)\nmu = 4\nsigma = 0.5\nM = 10000\n\
  x = np.random.normal(mu, sigma, M)\nprint(x[:5])\nnp.save('real_values.npy', x)\n\
  ```\n\n输出结果：\n\n```\n[4.88202617 4.2000786  4.48936899 5.1204466  4.933779  ]\n\
  ```\n\n即这组实数 `{x^(i)}` 服从均值为 `4`、标准差为 `0.5` 的高斯分布。如 Figure 8-3 所示：\n\n```python\n\
  def gaussian(x, mu, sig):\n    return np.exp(-np.power(x - mu, 2.) / (2 * np.power(sig,\
  \ 2.)))\n\nxmin, xmax = np.min(x), np.max(x)\nx_values = np.linspace(xmin, xmax,\
  \ 100)\nplt.plot(x_values, gaussian(x_values, mu, sigma))\ny = [0] * len(x)\n# plt.scatter(x,\
  \ y, c='b', s=3)\nplt.show()\n```\n\n\n\n\n\n![](img/file178.png \"fig:\")\n图 8-3\
  \ 均值为 4、标准差为 0.5 的高斯分布（正态分布）$\\mathcal{N}(4, 0.5)$\n\n可以看出，靠近均值 4 的实数被采样的概率较高，离\
  \ 4 较远的实数被采样的概率较低。因此，这一组实数是一维实数空间 $\\mathbb{R}$ 中的数据，它们服从均值为 4、标准差为 0.5 的高斯分布。如果找到了分布规律，就可以直接利用这个概率分布规律来生成符合该分布规律的实数。\n\
  \n对于高维数据，使用上述计算频率的方法来寻找高维数据空间中真实数据的分布，不仅计算量大，而且不切实际。例如，真实人脸数据集是一些人脸图像的集合。如果每张人脸图像包含\
  \ 256x256 个像素，每个像素用 3 种颜色（红、绿、蓝）表示，那么每张图像就有 256x256x3=196608 个值，即图像的维度是 196608，所有这些人脸图像都位于一个\
  \ 196608 维的空间中。每张人脸图像都是这个高维空间中的一个数据点。这些人脸图像在这个高维空间中是如何分布的？直接估计 196608 个随机变量 $(x_1,\
  \ x_2, \\dots, x_{196608})$ 的概率（密度）分布 $p(x_1, x_2, \\dots, x_{196608})$ 是一项不可能完成的任务。人脸图像数量不够，且计算量极大。\n\
  \n对于高维数据，有必要基于真实数据学习一个参数化的生成模型，以便基于该生成模型生成与真实数据相似的生成数据。有些生成模型直接表示概率分布或允许直接计算概率分布，而有些生成模型本身不表示概率分布，但按照该模型生成的数据分布非常接近真实数据的分布，即直接使用该生成模型来生成数据，而不是计算真实数据的概率分布。下面讨论直接生成数据的生成模型（VAE\
  \ 和 GAN）。\n\n从数学角度来看，生成模型基于一组真实数据（如一组实数或一组人脸）学习一个参数化的生成模型函数 $G(z|\\theta)$。一旦参数\
  \ $\\theta$ 确定，该函数也就确定了。该函数将隐变量 $z$ 映射为真实数据，隐变量 $z$ 所在的空间通常是一个低维线性空间，其维度远低于真实数据。例如，$z$\
  \ 是一个长度较小的向量，而真实数据是一个多百万像素的图像。不同的 $z$ 产生不同的 $G(z)$。如果 $G(z)$ 所满足的概率分布 $p_{\\text{fake}}$\
  \ 接近真实数据的分布 $p_{\\text{real}}$，则可以使用这种生成模型函数来生成假数据。\n\n因此，生成模型就是要找到一个生成模型函数 $G(z)$，使得可以从随机变量（向量）$z$\
  \ 生成与真实数据相似的数据 $G(z)$。不同的随机变量 $z$ 产生不同的生成数据 $G(z)$，这些 $G(z)$ 的分布规律应非常接近真实数据 $x$\
  \ 的分布规律。\n\n如图 8-4 所示，可以利用许多真实人脸图像来学习一个人脸图像的生成模型函数。使用该函数在潜在空间（如向量）中采样，可以生成一张假人脸图像。\n\
  \n图 8-4 通过大量真实人脸图像数据学习一个将隐向量映射为真实人脸图像的生成模型函数，在潜在空间中采样一个隐向量并将其输入该生成模型函数，从而得到一张真实人脸图像\n\
  \n使用神经网络（深度学习）作为生成模型函数的生成模型主要有三类：生成对抗网络（`GAN`）、变分自编码器（`VAEs`）、自回归模型，如 `PixelRNN`。\n\
  \n例如，下面是由 `GAN` 生成的人脸图像（ThisPersonDoesNotExist.com），可以看出生成的人脸图像难以与真实人脸图像区分。\n\n\
  ![](img/file179.png \"fig:\")\n图 8-5 生成网络 `GAN` 生成的伪造人脸图像\n\n## 8.2 自编码器\n\n在介绍变分自编码器之前，先介绍与之相关的自编码器。理解自编码器有助于理解变分自编码器。\n\
  \n### 8.2.1 自编码器\n\n用于分类和回归问题的神经网络可以将输入 $x$ 映射为输出 $y$，即神经网络是从 $x$ 到 $y$ 的映射：$y=f(x)$。$x$\
  \ 是数据特征，$y$ 与 $x$ 不同（即目标）。如果 $y$ 和 $x$ 相同，即这是一个恒等映射 $x=f(x)$，会产生什么结果？如果每层的神经元数量与\
  \ $x$ 的特征数量相同，那么每个神经元都可以通过恒等映射输出其中一个特征分量，如图 8-6 所示。\n\n图 8-6 由双层神经网络表示的恒等映射，隐藏层神经元数量与输入输出相同，直接输出输入特征分量之一\n\
  \n如果中间隐藏层的神经元数量与特征数量不同，如果数量少于特征数量，如图 8-7 所示，多个输入特征需要通过这个“**瓶颈**”层后再输出。如果该神经网络能够重构原始输入（即网络输出与输入相同），说明瓶颈层的激活输出向量包含了输入的所有信息，即瓶颈层的激活输出实际上是输入数据的压缩表示，就像压缩文件几乎包含了原始文件的所有信息一样。也就是说，瓶颈层的表示捕捉到了输入数据特征之间的内在关系（内在结构）。这也说明原始数据的特征不是独立的，而是相关的。例如，图像的相邻像素具有相似的颜色，即这些相邻像素是相关的。正是因为图像中的像素相关，图像压缩算法才能将图像压缩为更小的数据，并通过解压恢复原始图像。\n\
  \n图 8-7 对于输出能重构输入的双层神经网络，神经元数量少于输入特征数量的隐藏层的输出包含输入的所有信息以使输出重构输入，即隐藏层的激活输出向量实际上是输入数据的压缩表示\n\
  \n如果数据的特征相互独立，这些特征就无法被瓶颈层的压缩表示完全表达，必然会丢失许多输入特征，从而无法重构输入。\n\n神经网络的隐藏层是对数据特征的变换。神经元数量少于原始数据特征数量的隐藏层的输出是原始数据的压缩表示。神经网络可以自动学习数据的内在特征，因此也称为**特征学习**。\n\
  \n图像等数据通常是高维数据，而其本质特征一般是低维的。用低维数据特征表示原始数据可以提高机器学习算法的效率和性能，例如减少内存消耗和计算量，加快算法收敛。例如，一张人脸图像可能包含数百万像素，但在机器学习中，通常用人脸的低维特征来表示人脸，如使用\
  \ `PCA` 降维技术将人脸表示为几十个值的向量。\n\n数据可以用不同的特征来表示。例如，圆可以用圆上的许多像素（点）来表示。这种用像素图表示圆的方式称为位图。也可以用许多逼近圆的直线段来表示。这两种表示方式都需要许多值来表示高质量的圆。圆也可以用三个值来表示：圆的半径和圆心坐标。圆的坐标和半径是圆的内在特征。这三种表示圆的方式从不同角度表示了圆的特征。同样，对于任何其他类型的数据，也可以有多种表示方法来表示数据，数据的不同表示从不同角度代表了数据的不同特征。\n\
  \n选择合适的数据特征表示是决定机器学习成败的关键。过去几十年机器学习工作的主要目标之一，就是如何从数据原始形式的高维特征表示中找到低维且更本质的特征表示。从高维数据中寻找其低维特征表示称为**特征工程**。设计各种人工特征一直是过去几十年人工智能领域研究人员的主要研究目标。针对不同问题的数据，人们提出了各种特征降维技术，设计了各种人工特征。随着深度学习的兴起，利用神经网络自动学习特征，使研究人员从耗时费力的人工特征工程中解脱出来，从而可以专注于更具创新性的工作。\n\
  \n**自编码器**（`autoencoder`, `AE`）是一种利用带有瓶颈层的神经网络自动学习数据特征的技术。训练神经网络时，神经网络样本的目标就是数据本身。当神经网络的输出能够重构输入时，神经网络的瓶颈层就是数据的低维特征或低维表示。如图\
  \ 8-8 所示，该神经网络函数可视为两个函数，从数据输入层到瓶颈层的部分视为一个函数，称为**编码器**，即编码器接收输入数据，产生一个比输入数据维度更低的向量，称为**隐向量**。从瓶颈层到重构输出层的部分视为另一个函数，称为**解码器**，即解码器接收隐向量输入，输出与输入数据形状相同的输出值。该输出值应尽可能重构输入数据。解码器输出值与编码器输入数据的误差构成了自编码器的损失，称为**重构损失**。通过最小化该损失，可以使解码器的输出与编码器的输入数据尽可能相等，即解码器的输出可以重构输入。对于一个输入数据，编码器输出的隐向量是该数据的低维压缩表示，代表了数据本身的一些固有本质特征。\n\
  \n图 8-8 自动编码器的结构：数字图像输入编码器，编码器输出的隐向量作为解码器的输入，解码器输出的数字图像重构编码器的输入\n\n因此，编码器可以将高维数据\
  \ $x$ 编码为低维向量 $z$，解码器可以将该低维向量 $z$ 映射回原始数据空间，得到一个非常接近 $x$ 的数据 $x'$。输入 $x$ 经过编码器输出的\
  \ $z$ 称为**隐向量**，所有可能的隐向量构成的线性空间称为**隐空间**（或**潜在空间**）。\n\n设编码器函数为 $z = q_\\theta(x)$，它将输入\
  \ $x$ 映射为隐向量 $z$，解码器函数为 $x' = p_\\alpha(z)$，它将隐向量 $z$ 映射为与编码器输入 $x$ 形状相同的数据 $x'$。$x'$\
  \ 应尽可能等于 $x$；当然 $x$ 和 $x'$ 不能完全相同，会有一些误差。$\\theta, \\alpha$ 分别是编码器和解码器的模型参数；一旦 $\\\
  theta, \\alpha$ 确定，编码器和解码器函数也就确定了。\n\n对于训练好的自编码器，其解码器是一个生成器函数，可以从隐向量生成（产生）一个与真实数据相似的生成数据。\n\
  \n例如，如图 8-8 所示，可以训练一个用于 Mnist 手写数字图像的自动编码器。形状为 $28 \\times 28$ 的手写数字图像直接输入编码器，或转换为大小为\
  \ 784 的输入向量输入编码器。编码器输出一定长度（例如 10）的隐向量 $z$，将其输入解码器，输出长度为 784 的向量或大小为 28x28 的图像。\n\
  \n自编码器的主要功能是压缩数据。隐向量是一个维度低于输入数据的向量。数据样本通过编码函数映射到隐向量，再通过解码函数映射回自身以进行**重构**。自编码器的编码和解码过程类似于数据压缩。压缩软件将文件（文件夹）压缩为更小的文件，然后通过解压恢复原始文件（文件夹）。解压后的文件与原始文件的差异即为压缩误差。如果压缩解压后的文件与原始文件完全相同，则为无损压缩，否则为有损压缩。\n\
  \n自编码器的编码和解码属于一种有损压缩，即将 $x$ 编码为隐向量 $z$，从隐向量 $z$ 解码出的 $x'$ 与 $x$ 不完全相同，但非常接近。\n\n\
  为了学习编解码函数的参数 $\\theta, \\alpha$，使用所有真实数据 $x$ 构成监督学习训练样本 $(x, x)$（即样本的目标值为输入数据）来训练编解码器模型。自编码器的损失函数为：\n\
  \n$\\mathcal{L}(x, \\hat{x}) + \\mathcal{L}_{\\text{regularizer}}$\n\n即包含重构误差并防止过拟合的正则项\
  \ $\\mathcal{L}_{\\text{regularizer}}$。\n\n自编码器可用于数据去噪，只需在训练自编码器时，将数据的带噪版本和去噪版本分别作为训练样本的数据特征和目标值，即样本\
  \ $(x_{\\text{noise}}, x_{\\text{denoise}})$。$x_{\\text{noise}}, x_{\\text{denoise}}$\
  \ 分别为带噪和无噪数据。如图 8-9 所示\n\n![](img/file180.png \"fig:\")\n图 8-9 去噪自编码器，输入为带噪图像，解码器的输出目标为去噪图像\n\
  \n用于去除噪声的自编码器称为**去噪自编码器**。\n\n### 8.2.2 稀疏编码器\n\n为了获得低维特征表示，隐藏层的神经元数量通常远少于数据特征，但隐藏层的神经元数量该设为多少？这很难确定。过小的隐向量长度可能缺乏足够特征，导致解码器难以重构数据。有时，自编码器的隐藏层数量宁可设大一些，甚至与数据特征数量相当，通过“稀疏约束”正则项，使隐向量的非零值个数很少。虽然隐向量元素个数多，但由于非零值很少，也达到了数据低维压缩的目的。即定义如下损失函数：\n\
  \n$\\mathcal{L}(x, \\hat{x}) + \\lambda \\sum_i |a_i^{(h)}|$\n\n其中 $a_i^{(h)}$ 是隐藏层的激活输出。该惩罚项迫使这些值尽可能接近\
  \ 0，即起到“使非零值尽可能小”（稀疏性）的作用。稀疏约束起到类似瓶颈层的作用。采用稀疏约束的自编码器称为**稀疏编码器**（或**稀疏自编码器**）。\n\n\
  另一种常用的稀疏约束是 KL 散度约束。如果 $\\hat{\\rho}_j = \\frac{1}{m} \\sum_i [a_i^{(h)}(x)]$ 表示隐藏层的平均激活值，可将其视为伯努利随机变量，从而用\
  \ KL 散度表示理想分布与观测分布的差异。\n\n$\\mathcal{L}(x, \\hat{x}) + \\sum_j KL(\\rho || \\hat{\\\
  rho}_j)$\n\n两个分布的 KL 散度为：\n\n$\\sum_{j=1}^{l^{(h)}} \\rho \\log \\frac{\\rho}{\\\
  hat{\\rho}_j} + (1 - \\rho) \\log \\frac{1 - \\rho}{1 - \\hat{\\rho}_j}$\n\n###\
  \ 8.2.3 自编码器的实现\n\n以下使用 Mnist 数据集来说明如何实现自编码器。首先，读取 Mnist 数据集：\n\n```\n```\n\n\n\n\
  \n\n# 读取数据\n\n```python\nimport matplotlib.pyplot as plt\n%matplotlib inline\nimport\
