  [4] 4\n```\n\n### 4.3.7 改进的通用神经网络框架：分离加权求和与激活函数\n\n上述神经网络框架的 `Dense` 层包含加权求和和激活函数，`Dense`\
  \ 类包含加权求和和激活函数的前向和反向计算。为增加灵活性，可将加权求和和激活函数分解为 2 个类分别表示，分别进行计算，以便将来添加新的激活函数。\n\n`Layer`\
  \ 类增加了成员变量 `params` 以保存模型参数，并增加了方法 `reg_loss_grad` 以将损失函数中正则项的梯度加到模型参数的梯度中。\n\n\
  `Dense` 类仅执行加权求和计算，其构造函数接受一个参数，根据不同的随机初始化方法随机初始化权重参数。`Dense` 类接受的单个数据特征不仅是向量，还可以是多通道二维图像。例如，彩色图像包含红、绿、蓝三个颜色通道，每个通道是一个二维数组，因此\
  \ `forward()` 和 `backward()` 方法均使用以下代码首先将多通道输入数据展平为一维向量。\n\n```python\nx1 = x.reshape(x.shape[0],\
  \ np.prod(x.shape[1:]))  # Flatten multi-channel x\n```\n\n\n\n\n\n#### 稠密层实现\n\n\
  ##### 基础层类\n\n```python\nclass Layer:\n\n    def __init__(self):\n        self.params\
  \ = None\n        pass\n\n    def forward(self, x):       \n        raise NotImplementedError\n\
  \n    def backward(self, x, grad):        \n        raise NotImplementedError\n\n\
  \    def reg_grad(self, reg):\n        pass\n\n    def reg_loss(self, reg):\n  \
  \      return 0.  \n```\n\n##### 稠密层\n\n```python\nclass Dense(Layer): \n    # Z\
  \ = XW+b\n\n    def __init__(self, input_dim, out_dim, init_method=('random', 0.01)):\
  \  \n        super().__init__()\n\n        random_method_name, random_value = init_method\
  \      \n\n        if random_method_name == \"random\":\n            self.W = np.random.randn(input_dim,\
  \ out_dim) * random_value\n            self.b = np.random.randn(1, out_dim) * random_value\
  \  \n        elif random_method_name == \"he\":\n            self.W = np.random.randn(input_dim,\
  \ out_dim) * np.sqrt(2 / input_dim)\n            self.b = np.zeros((1, out_dim))\n\
  \        elif random_method_name == \"xavier\":\n            self.W = np.random.randn(input_dim,\
  \ out_dim) * np.sqrt(1 / input_dim)\n            self.b = np.random.randn(1, out_dim)\
  \ * random_value  \n        elif random_method_name == \"zeros\":\n            self.W\
  \ = np.zeros((input_dim, out_dim))\n            self.b = np.zeros((1, out_dim))\
  \   \n        else:            \n            self.W = np.random.randn(input_dim,\
  \ out_dim) * random_value\n            self.b = np.zeros((1, out_dim))  \n\n   \
  \     self.params = [self.W, self.b]\n        self.grads = [np.zeros_like(self.W),\
  \ np.zeros_like(self.b)]\n\n    def forward(self, x): \n        self.x = x     \
  \   \n        x1 = x.reshape(x.shape[0], np.prod(x.shape[1:]))  # 展平多通道 x      \n\
  \        Z = np.matmul(x1, self.W) + self.b        \n        return Z\n\n    def\
  \ backward(self, dZ):\n        # 反向传播 \n        x = self.x\n        x1 = x.reshape(x.shape[0],\
  \ np.prod(x.shape[1:]))  # 展平多通道 x\n        dW = np.dot(x1.T, dZ)\n        db =\
  \ np.sum(dZ, axis=0, keepdims=True)          \n        dx = np.dot(dZ, np.transpose(self.W))\
  \ \n        dx = dx.reshape(x.shape)   # 还原 x 的形状以适应多通道 \n\n        self.grads[0]\
  \ += dW\n        self.grads[1] += db\n        return dx\n\n    # -------- 添加正则项的梯度\
  \ -----\n    def reg_grad(self, reg):\n        self.grads[0] += 2 * reg * self.W\n\
  \        \n    def reg_loss(self, reg):\n        return reg * np.sum(self.W**2)\n\
  \    \n    def reg_loss_grad(self, reg):\n        self.grads[0] += 2 * reg * self.W\n\
  \        return reg * np.sum(self.W**2)\n```\n\n##### 前向计算示例\n\n如果 `x` 是 6 个样本，每个样本有\
  \ 3 个通道，每个通道是一个 `4*4` 的图像，以下代码是这 3 个样本作为输入的前向计算：\n\n```python\nimport numpy as np\n\
  np.random.seed(1)\nx = np.random.randn(3, 3, 4, 4)  # 3 个样本，3 个通道，每个通道是一个 4x4 图像\n\
  dense = Dense(3*4*4, 10, ('no', 0.01))\no = dense.forward(x)\nprint(o.shape)\nprint(o)\n\
  ```\n\n**输出：**\n```\n(3, 10)\n[[-0.03953509 -0.00214997  0.00743433 -0.16926214\
  \ -0.05162853  0.06734225\n  -0.00221485 -0.11710758 -0.07046456  0.02609659]\n\
  \ [ 0.00848392  0.08259757 -0.09858177  0.0374092  -0.08303008  0.04151241\n  -0.01407859\
  \ -0.02415486  0.04236149  0.0648261 ]\n [-0.13877363 -0.04122276 -0.00984716 -0.03461381\
  \  0.11513754  0.1043094\n   0.00170353 -0.00449278 -0.0057236  -0.01403174]]\n\
  ```\n\n##### 梯度验证\n\n和之前一样，为了验证稠密层反向推导是否正确，可以模拟一个关于稠密层输出向量梯度 `do` 的损失函数，然后使用 `dense.backward()`\
  \ 进行反向推导计算，并用数值梯度函数 `numerical_gradient_from_df` 计算数值进行误差比较。因为稠密层输出向量的大小是 10，下面的代码模拟\
  \ 3 个样本的输入 `x` 通过该稠密层生成 `3*10` 的输出 `o`。因此，模拟生成的梯度 `do` 也是相同形状的多维数组。\n\n如果已知损失函数关于输出向量的梯度，就可以从该梯度反向计算出模型参数和中间变量（如\
  \ `x`）的梯度。`backward()` 返回稠密层输入 `x` 的梯度 `dx`，然后将解析梯度与数值梯度 `dx_num` 进行误差比较。同样，对于模型的权重参数\
  \ `dense.params[0]`，也将解析梯度 `dense.grads[0]` 与数值梯度 `dW_num` 进行误差比较：\n\n```python\n\
  do = np.random.randn(3, 10)\ndx = dense.backward(do)\ndx_num = numerical_gradient_from_df(lambda:\
  \ dense.forward(x), x, do)\n\ndiff_error = lambda x, y: np.max(np.abs(x - y) / (np.maximum(1e-8,\
  \ np.abs(x) + np.abs(y))))\nprint(diff_error(dx, dx_num))\n\ndW_num = numerical_gradient_from_df(lambda:\
  \ dense.forward(x), dense.params[0], do)\nprint(diff_error(dense.grads[0], dW_num))\n\
  print(dense.grads[0][:3])\nprint(dW_num[:3])\n```\n\n**输出：**\n```\n3.638244314951079e-09\n\
