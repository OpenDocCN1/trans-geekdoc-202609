  \n#### 神经网络类定义\n\n基于全连接层和各激活层，可以定义一个表示神经网络的 `NeuralNetwork` 类：\n\n```python\nclass\
  \ NeuralNetwork:  \n    def __init__(self):\n        self._layers = []\n       \
  \ self._params = []\n \n    def add_layer(self, layer):      \n        self._layers.append(layer)\n\
  \        if layer.params: \n           # for  i in range(len(layer.params)): \n\
  \            for  i, _ in enumerate(layer.params):                         \n  \
  \              self._params.append([layer.params[i],layer.grads[i]])           \
  \ \n    \n    def forward(self, X): \n        for layer in self._layers:\n     \
  \       X = layer.forward(X) \n        return X   \n\n    def __call__(self, X):\n\
  \        return self.forward(X)\n    \n    def predict(self, X):\n        p = self.forward(X)\n\
  \        # One row\n        if p.ndim == 1:    \n            return np.argmax(ff)\
  \       \n        \n        return np.argmax(p, axis=1) \n  \n   \n    def backward(self,loss_grad,reg\
  \ = 0.):\n        for i in reversed(range(len(self._layers))):\n            layer\
  \ = self._layers[i] \n            loss_grad = layer.backward(loss_grad)\n      \
  \      layer.reg_grad(reg) \n        return loss_grad    \n    \n    def backpropagation(self,\
  \ X, y,loss_function,reg=0):        \n        f = self.forward(X)          \n  \
  \      #The gradient of the loss function about the output f\n        loss,loss_grad\
  \ = loss_function(f,y)\n      \n        #Reverse derivation from loss_grad\n   \
  \     self.zero_grad()\n        self.backward(loss_grad)  \n        reg_loss = self.reg_loss_grad(reg)\
  \       \n        return loss+reg_loss\n        #return np.mean(loss)\n    \n  \
  \  def reg_loss(self,reg):\n        reg_loss = 0\n        for i in range(len(self._layers)):\n\
  \            reg_loss+=self._layers[i].reg_loss(reg)\n        return reg_loss\n\
  \    \n    def parameters(self): \n        return self._params\n    \n    def zero_grad(self):\n\
  \        for i,_ in enumerate(self._params):           \n            #self.params[i][1].fill(0.)\
  \ \n            self._params[i][1][:] = 0  #[w,dw]\n            \n    def get_parameters(self):\n\
  \        return self._params \n```\n\n此类中 `add_layer()` 用于向神经网络添加各种层，`forward()`\
  \ 接受输入数据并生成相应输出，`__call__()` 是函数调用方法，对于 `NeuralNetwork` 对象 `nn` 和输入 `X`，`nn(X)`\
  \ 等价于 `nn.forward(X)`，`backward()` 接受损失函数关于网络输出的梯度，并执行反向推导以求得损失函数关于模型参数和中间变量的梯度。\n\
  \n为了确保 `forward()` 和 `backward()` 方法的正确性，可以通过数值梯度法检查其正确性。以下代码定义了一个简单的神经网络，并使用一组随机生成的样本\
  \ `(x, y)` 来计算和比较由 `backward()` 计算的解析梯度和使用第 1.4 节通用数值梯度函数获得的数值梯度，查看计算结果是否一致。\n\n\
  ```python\nimport util\n\nnp.random.seed(1)\nnn = NeuralNetwork()\nnn.add_layer(Dense(2,\
