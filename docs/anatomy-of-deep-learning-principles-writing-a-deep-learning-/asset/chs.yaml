  ## 5.4 正则化\n\n当模型更复杂时（例如模型参数更多），正则化是防止模型过拟合的基本技术。除了回归中直接对权重进行正则化外，深度学习还经常使用一种称为\
  \ `Dropout` 的正则化来防止过拟合。\n\n### 5.4.1 权重正则化\n\n这是回归中已经熟悉的正则化，通过在损失函数中为权重参数添加惩罚项，防止权重参数的绝对值变得过大。总损失函数包括数据本身预测的损失\
  \ `L_data` 和正则项 `R_W`：\n\n`L_data + R_W`\n\n对于权重 `w`，其 `L2` 正则项为 `R_W = λw²`，其中\
  \ `λ` 控制正则项相对于数据损失的比例。值越大，正则化项的作用越大，越能防止过拟合。值越小，正则化项的作用越小，防止过拟合的效果越小。`L2` 正则项使参数趋于变小并接近\
  \ 0。\n\n`L1` 正则项为 `R_W = λ|w|`，其功能与 `L2` 正则项相似，但略有不同。`L2` 正则项会使所有值一致地减小，而 `L1` 正则项会使权重变得稀疏，即许多权重变得接近\
  \ 0，只有少数非零值，也就是说，非零值非常稀疏。`L1` 使机器学习倾向于选择少数好的特征，而不是使用所有特征，即有助于选择好的特征。稀疏性是机器学习中的一个重要课程，由于篇幅限制，本书不作讨论。\n\
  \n也可以将 `L1` 正则化项和 `L2` 正则化项结合起来，形成所谓的弹性网络正则化：`R_W = λ₁|w| + λ₂w²`。其范围介于 `L1` 和 `L2`\
  \ 之间，或者说是 `L1` 和 `L2` 弹性组合的作用。\n\n\n\n\n\n# 图 5-23：常见权重正则化函数\n\n图 5-23 是这三种常见权重正则化函数的示意图：\n\
  \n**图 5-23 不同的正则化函数**\n\n#### 最大范数约束\n\n在梯度下降法中，特别是在深度学习中，随着层数的增加，由于反向推导是计算梯度的乘积，会导致梯度消失和梯度爆炸。最大范数约束可以防止梯度爆炸。即将即将更新的权重限制在一定范围内，也就是说，通过裁剪权重向量，使得某个范数（如\
  \ `L2` 范数）不超过某个值：`||w||2 < c`。`c` 的典型值为 3 或 4，一些研究报告称，这种对权重的最大范数约束可以提高算法的收敛性能。特别是在后面要学习的循环神经网络中，通常使用这种**最大范数约束**来防止梯度爆炸。\n\
  \n```python\nimport numpy as np\n\ndef max_norm_constraints(w, c, epsilon=1e-8):\n\
  \    norms = np.sqrt(np.sum(np.square(w), keepdims=True))\n    desired = np.clip(norms,\
  \ 0, c)\n    w *= (desired / (epsilon + norms))\n    return w\n\nw = np.random.randn(2,\
  \ 5) * 10\nprint(w)\nw = max_norm_constraints(w, 2)\nprint(w)\n```\n\n```\n[[  3.42847604\
  \ -19.64442234  -4.80546287   5.65698305  -8.97334854]\n [ -0.95122877  -0.04471285\
  \ -14.33147196  -0.63593975   9.30212848]]\n[[ 0.23851103 -1.36661635 -0.33430477\
  \  0.39354303 -0.6242548 ]\n [-0.06617475 -0.00311057 -0.99700686 -0.04424084  0.64712724]]\n\
  ```\n\n如果 `grads` 包含多个权重参数的梯度，以下代码可以将它们的梯度限制在 `[-c, c]` 范围内：\n\n```python\nimport\
  \ math\n\ndef grad_clipping(grads, c):\n    norm = math.sqrt(sum((grad ** 2).sum()\
  \ for grad in grads))\n    if norm > c:\n        ratio = c / norm\n        for i\
  \ in range(len(grads)):\n            grads[i] *= ratio\n```\n\n### 5.4.2 Dropout\n\
  \n- [`deepnotes.io/dropout`](https://deepnotes.io/dropout)\n- [`stanford.edu/~shervine/teaching/cs-230/cheatsheet-deep-learning-tips-and-tricks`](https://stanford.edu/~shervine/teaching/cs-230/cheatsheet-deep-learning-tips-and-tricks)\n\
  \n**Dropout**（英文意为“丢失”、“脱落”）是由 Srivastava 等人提出的一种正则化技术。在训练过程中，以一定的概率激活某些神经元（即输出激活值），而其他神经元处于非激活状态（即不输出激活值）。对于某一层神经元，Dropout\
  \ 使用 0 到 1 之间的概率 `drop_p` 使某个神经元失活，即不产生输出，反之，该神经元以 `1 - drop_p` 的概率处于激活状态。如果该层有\
  \ 100 个神经元，`drop_p = 0.2`，则从概率上讲，`100 * 0.2` 个将处于非激活状态，`100 * 0.8` 个将处于激活状态。`drop_p`\
  \ 称为**丢弃率**，表示有多大概率神经元处于非激活状态。反之，`(1 - drop_p)` 称为**存活率**或**保留率**，表示有多大概率神经元处于激活状态。\n\
  \n**图 5-24 Dropout：每次前向和反向过程中随机使部分神经元失活**\n\n如图 5-24 所示，左侧神经网络的所有神经元均被激活，右侧神经元使用\
  \ Dropout 进行激活。Dropout 通过使某些神经元失活来定义不同的神经网络函数。因为梯度下降训练过程的每次迭代都会随机使部分神经元失活，所以不同的迭代针对的是不同的函数。因此，神经网络不会过度依赖少数几个神经元，这相当于群体的决策不依赖少数人，而是每个人都有机会参与，从而防止因过度依赖少数人而产生的偏见。Dropout\
  \ 类似于数据归一化的思想。如果数据未归一化，数值较大的某些特征将对学习算法产生过大影响，而其他特征影响甚微。Dropout 也类似于权重正则化的思想。权重正则化通过惩罚项使所有权重变小，防止少数权重过大。\n\
  \n以一定概率使某网络层 Dropout 会导致该网络层总输出期望变小。例如，该网络层原本的总输出期望为 `e`，Dropout 丢弃概率为 `drop_p`，则期望值将变为\
  \ `e * (1 - drop_p)`。为了避免影响后续层，使用 Dropout 的输出层中每个神经元的输出通常除以 `(1 - drop_p)`。即如果某神经元的激活函数输出值为\
  \ `a`，则修改为输出 `a / (1 - drop_p)`。\n\n因为训练的每次迭代中，Dropout 随机丢弃不同的神经元，即每次迭代的神经网络函数不同。因此损失函数的含义不是很明确，不同迭代的损失是不同函数的损失，而不是同一函数的损失。最终训练得到的函数可以看作是这些不同迭代产生的不同函数的平均。通过多个不同函数模型的平均可以获得更好的模型，正如通过多数人的投票而不是少数人的投票可以获得更好的结果一样。这再次体现了基于统计学习的机器学习的基本思想。Dropout\
  \ 通过多个函数的平均可以有效避免过拟合。\n\n此外，Dropout 仅用于训练模型，训练后的模型函数应当是明确的。因此，最终训练得到的神经网络函数应当是由所有处于激活状态的神经元组成的函数。因此，在验证和测试模型时，不应再使用\
  \ Dropout。\n\nDropout 可以作用于任意隐藏网络层的输出。如果该网络层的输出为 `x`，Dropout 操作可表示为：\n\n`x = D ⊙\
  \ x`\n\n其中，`D` 是与 `x` 形状相同的数组，`D` 中每个元素的值为 1 或 0，表示对应神经元是否被激活。数组 `D` 是基于 Dropout\
  \ 丢弃率或存活率计算的掩码数组。可使用以下代码执行 Dropout 操作：\n\n```python\nretain_p = 1 - drop_p\nmask\
  \ = (np.random.rand(*x.shape) < retain_p) / retain_p\nx *= mask\n```\n\n其中，`drop_p`、`retain_p\
  \ = 1 - drop_p` 分别为丢弃率和保留率，`mask` 为保持激活状态的掩码数组。\n\n反向推导时，只需将损失函数关于 Dropout 输出的梯度\
  \ `dx_output` 乘以该掩码 `mask` 即可。\n\n```python\ndx = dx_output * self._mask\n```\n\n\
  其中 `dx_output` 是反向传播进来的关于 `x` 的损失函数梯度。\n\nDropout 操作可以实现为一个独立的 Dropout 层，代码如下：\n\
  \n```python\nfrom Layers import *\n\nclass Dropout(Layer):\n    def __init__(self,\
  \ drop_p):\n        super().__init__()\n        self.retain_p = 1 - drop_p\n\n \
  \   def forward(self, x, training=True):\n        retain_p = self.retain_p\n   \
  \     if training:\n            self._mask = (np.random.rand(*x.shape) < retain_p)\
  \ / retain_p\n            out = x * self._mask\n        else:\n            out =\
  \ x\n        return out\n\n    def backward(self, dx_output, training=True):\n \
  \       dx = None\n        if training:\n            dx = dx_output * self._mask\n\
  \        else:\n            dx = dx_output\n        return dx\n```\n\n其中 `x` 是 Dropout\
  \ 层上一层的输出。对于输入 `X`，以下代码使用 `dropout.forward(X)` 计算 Dropout 的输入，反向推导时，使用 `dropout.backward(dx_output)`\
  \ 从关于 `X` 的反向输入梯度获取 Dropout 后的反向梯度。\n\n\n\n\n\n#### Dropout 示例与原理\n\n```python\n\
  np.random.seed(1)\ndropout = Dropout(0.5)\nX = np.random.rand(2, 4)\nprint(X)\n\
  print(dropout.forward(X))\ndx_output = np.random.rand(2, 4)\nprint(dx_output)\n\
  print(dropout.backward(dx_output))\n```\n\n```\n[[4.17022005e-01 7.20324493e-01\
  \ 1.14374817e-04 3.02332573e-01]\n [1.46755891e-01 9.23385948e-02 1.86260211e-01\
  \ 3.45560727e-01]]\n\n[[8.34044009e-01 0.00000000e+00 2.28749635e-04 0.00000000e+00]\n\
  \ [2.93511782e-01 0.00000000e+00 3.72520423e-01 0.00000000e+00]]\n\n[[0.4173048\
  \ 0.55868983 0.14038694 0.19810149]\n [0.80074457 0.96826158 0.31342418 0.69232262]]\n\
  \n[[0.8346096 0. 0.28077388 0. ]\n [1.60148914 0. 0.62684836 0. ]]\n```\n\n#####\
  \ Dropout 原理与应用\n\n`Dropout` 是一种降低函数复杂度的技术。模型参数越多，模型越复杂。同理，神经网络不同网络层的参数不同，复杂度也不同。`Dropout`\
  \ 可添加到任意隐藏层，参数较多的隐藏层丢弃率可设高，反之设低。对于模型参数较少的网络层，可不添加 `Dropout` 层。\n\n`Dropout` 用于防止过拟合，但因其导致每次迭代使用不同函数，损失函数失去意义，无法用调试工具调试训练参数。常规做法是先关闭\
  \ `Dropout`（但可添加正则项防止过拟合），调优参数后再开启 `Dropout` 进一步提升模型质量。\n\n`Dropout` 属于正则化技术。当网络规模相对数据集较小时，通常不需正则化，因为模型复杂度已较低。强行添加会降低模型表达能力，损害学习性能。此外，`Dropout`\
  \ 显然不能置于输出层前后，因为网络在接近分类前无法“纠正”丢失带来的误差。实践中，`Batch Normalization` 已广泛取代 `Dropout`。\n\
  \n##### Fashion MNIST 数据集实验\n\n以 4.3.9 节在 Fashion MNIST 数据集上训练的网络模型为例，在第一个网络层后添加\
  \ `Dropout` 后，可移除权重衰减正则化（`reg=0`）：\n\n```python\nimport numpy as np\nimport util\n\
  from NeuralNetwork import *\nfrom train import *\nimport mnist_reader\nimport matplotlib.pyplot\
