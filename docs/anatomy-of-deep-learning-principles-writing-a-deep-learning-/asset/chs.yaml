  \ 训练损失曲线**\n\n### 3.7.3 批量梯度下降法及其实现\n\n如果训练集很大，使用整个训练集进行训练时，计算量会变得非常大。实际上，只要使用少量甚至一个样本，就可以计算损失函数的梯度并更新模型参数。因此，在实际问题中，通常从训练集中随机选取少量样本，利用这批样本对模型参数进行梯度更新。每次梯度更新可以使用不同的一批样本。这种梯度下降方法称为**批量梯度下降**（**mini\
  \ batch gradient descent**）。为了保证训练集中的所有样本都能用于训练。\n\n批量梯度下降法的一般做法是：\n\n\n\n\n\n####\
  \ 随机梯度下降算法流程\n\n1.  重新排列原始训练集中样本的顺序，即打乱原始训练集中样本的顺序。\n2.  对于重新排列后的训练集，从头开始，依次取一小批样本，用这批样本计算模型函数损失的梯度，并更新模型参数。\n\
  3.  重复步骤 1) 和 2) 多次。\n\n上述 1) 和 2) 完成了对训练集中几乎所有样本的一次遍历，并在此遍历中用不同的小批量样本更新模型参数。因此，1)、2)\
  \ 的过程称为一个 **epoch**（轮次）。3) 表示执行多个 epoch。\n\n#### 使用 `numpy.random.shuffle()` 打乱列表顺序\n\
  \n例如：\n\n```python\nm = 5\nindices = list(range(m))\nprint(indices)\nnp.random.shuffle(indices)\n\
  print(indices)\n```\n\n输出：\n\n```\n[0, 1, 2, 3, 4]\n[2, 1, 4, 3, 0]\n```\n\n####\
  \ 数据集迭代器 `data_iter()`\n\n针对数据集 `(X, y)`，可定义迭代器函数 `data_iter()` 来打乱原始数据集顺序，并每次从数据集中返回\
  \ `batch_size` 大小的一个小批量训练样本：\n\n```python\ndef data_iter(X, y, batch_size, shuffle=False):\n\
  \    m = len(X)\n    indices = list(range(m))\n    if shuffle:                 \
  \       # shuffle 为 True 时打乱顺序\n        np.random.shuffle(indices)\n    for i in\
  \ range(0, m - batch_size + 1, batch_size):\n        batch_indices = np.array(indices[i:\
  \ min(i + batch_size, m)])\n        yield X.take(batch_indices, axis=0), y.take(batch_indices,\
  \ axis=0)\n```\n\n#### 批量梯度下降法代码实现\n\n```python\ndef batch_gradient_descent_softmax(w,\
  \ X, y, epochs, batchsize=50, shuffle=False,\n                                 \
  \  reg=0., alpha=0.01, gamma=0.8, epsilon=1e-8):\n    w_history = []\n    X = np.hstack((np.ones((X.shape[0],\
  \ 1), dtype=X.dtype), X))\n    for epoch in range(epochs):\n        for X_batch,\
  \ y_batch in data_iter(X, y, batchsize, shuffle):\n            gradient = gradient_softmax(w,\
  \ X_batch, y_batch, reg)\n            if np.max(np.abs(gradient)) < epsilon:\n \
  \               print(\"gradient is small enough!\")\n                print(\"iterated\
  \ num is :\", i)\n                break\n            w = w - (alpha * gradient)\n\
