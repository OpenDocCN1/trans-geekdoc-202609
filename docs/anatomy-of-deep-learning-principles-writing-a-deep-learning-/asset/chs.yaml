  \n### 7.7.4 LSTM 的变体\n\n以上是最经典的 LSTM，实际使用的 LSTM 模型往往略有不同。Gers & Schmidhuber (2000)\
  \ 引入了“peephole connection”（窥孔连接），如图 7-42 所示，使得各个门可以观察细胞的状态。\n\n![](img/file161.png\
  \ \"fig:\")\n图 7-42 引入“peephole connection”的 LSTM\n\n在该图中，所有门都添加了“peepholes”（窥孔），即\
  \ `f[t]`、`i[t]`、`o[t]` 可以看到相应的细胞状态 `C[t-1]`、`C[t]`。不过，也有一些论文只添加一部分。\n\n考虑到 LSTM\
  \ 细胞过于复杂，2014 年 Kyunghyun Cho 等人提出了一种更多样化的 LSTM 变体——**门控循环单元**（**Gated Recurrent\
  \ Unit, GRU**）。GRU 将遗忘门和输入门合并为单个“更新门”，将细胞状态和隐藏状态合并，并引入了一些其他变化。该模型比标准 LSTM 模型更简化，效果却优于经典\
  \ LSTM，因此现在越来越流行。\n\n还有一些其他模型，例如 Yao 等人 (2015) 提出的 Depth Gated RNNs。同时，也有许多完全不同的方法来解决长期依赖问题，例如\
  \ Koutnik 等人 (2014) 提出的 Clockwork RNNs。\n\n不同模型哪个最好？差异真的重要吗？Greff 等人 (2015) 对流行变体进行了比较，发现它们基本相同。Jozefowicz\
  \ 等人 (2015) 测试了超过 10,000 种 RNN 结构，发现其中一些在特定任务上的表现优于 LSTM。\n\n## 7.8 门控循环单元 (GRU)\n\
  \n### 7.8.1 GRU 的工作原理\n\n与 LSTM 使用 `C[t]` 和 `H[t]` 分别表示总历史信息和参与下一时刻计算的历史信息不同，GRU\
  \ 像简单的 RNN 一样，仅使用一个隐藏状态 `H[t]` 来表示所有历史信息。与 LSTM 一样，GRU 也有遗忘门，也称为重置门，用于表示记忆信息对当前时刻计算的影响，以及用于当前激活值\
  \ `H_tilde_t` 和历史信息 `H[t-1]` 更新当前时刻历史信息 `H[t]` 的更新门。如图 7-43 所示，GRU 单元中有两个门：重置门 R\
  \ 和更新门 U。\n\n![](img/file162.png \"fig:\")\n图 7-43 GRU 的重置门和更新门\n\n与 LSTM 的门一样，这两个门输出\
  \ `[0,1]` 之间的值，计算公式如下：\n\n**R[t]** = `σ(X[t]W[xr] + H[t-1]W[hr] + W[hr] + mathbfb[r])`\n\
  **U[t]** = `σ(X[t]W[xu] + H[t-1]W[hu] + W[hu] + mathbfb[u])`\n\n普通 RNN 神经元使用历史信息\
  \ `H[t-1]` 和当前输入数据 `X[t]` 计算当前时刻的信息，即隐藏状态 `H[t]`。\n\n**H[t]** = `tanh(X[t]W[xh]\
  \ + H[t-1]W[hh] + W[hh] + mathbfb[h])`\n\n重置门表示本次计算遗忘了多少历史记忆，或者说保留了多少历史记忆参与本次计算，即重置门的输出值\
  \ `R[t]` 乘以历史记忆 `H[t-1]` 参与当前信息的计算。\n\n`H_tilde_t = tanh(X_t W_xh + (R_t ⊙ H_{t-1})\
  \ W_hh + b_h)`\n\n这个 `H_tilde_t` 表示当前时刻的激活值，也称为**当前候选记忆**。如图 7-44 所示：\n\n![](img/file163.png\
  \ \"fig:\")\n图 7-44 GRU 当前工作单元输出当前时刻的激活值\n\n通过更新门对当前候选记忆 `H_tilde_t` 和历史记忆 `H[t-1]`\
  \ 进行加权平均，作为当前时刻的隐藏状态：\n\n`H_t = U_t ⊙ H_{t-1} + (1 - U_t) ⊙ H_tilde_t`\n\n如图 7-45\
  \ 所示，更新门的输出值 **U[t]** 用于对历史记忆和当前候选记忆进行加权平均，\n\n![](img/file164.png \"fig:\")\n图\
  \ 7-45 GRU 神经网络单元的完整结构，更新门输出当前隐藏状态 `H[t]`\n\nGRU 的反向推导与 LSTM 类似。在已知损失函数对 GRU 输出的梯度\
  \ dZ 后，反向推导计算损失函数对模型参数和中间变换的梯度。读者可以模仿 LSTM 的反向推导来推导 GRU 的反向推导公式。\n\n与 LSTM 一样，GRU\
  \ 可以维持长期记忆并防止梯度爆炸和消失。其性能也与 LSTM 相当，甚至在某些问题上优于 LSTM。其实现比 LSTM 更简单，计算效率更高。因此，在实际使用中，通常用\
  \ GRU 代替传统的 LSTM。\n\n### 7.8.2 GRU 代码实现\n\nGRU 的代码实现与 LSTM 类似。以下是实现代码：\n\n```python\n\
  import numpy as np\n\ndef sigmoid(x):\n    return 1 / (1 + np.exp(-x))\n\ndef gru_init_params(input_dim,\
  \ hidden_dim, output_dim, scale=0.01):\n    normal = lambda m, n: np.random.randn(m,\
  \ n) * scale\n    three = lambda: (normal(input_dim, hidden_dim), normal(hidden_dim,\
  \ hidden_dim), np.zeros((1, hidden_dim)))\n\n    Wxu, Whu, bu = three()  # 更新门参数\n\
  \    Wxr, Whr, br = three()  # 重置门参数\n    Wxh, Whh, bh = three()  # 候选隐藏状态参数\n\n\
  \    Wy = normal(hidden_dim, output_dim)\n    by = np.zeros((1, output_dim))\n\n\
  \    params = [Wxu, Whu, bu, Wxr, Whr, br, Wxh, Whh, bh, Wy, by]\n    return params\n\
  \ndef gru_state_init(batch_size, hidden_size):\n    return np.zeros((batch_size,\
  \ hidden_size))\n\ndef gru_forward(params, Xs, H_0):\n    Wxu, Whu, bu, Wxr, Whr,\
  \ br, Wxh, Whh, bh, Wy, by = params\n\n    H = H_0\n    Hs = {}\n    Ys = []\n \
  \   Hs[-1] = np.copy(H)\n    Rs = []\n    Us = []\n    H_tildas = []\n\n    for\
  \ t in range(len(Xs)):\n        X = Xs[t]\n\n        U = sigmoid(np.dot(X, Wxu)\
  \ + np.dot(H, Whu) + bu)\n        R = sigmoid(np.dot(X, Wxr) + np.dot(H, Whr) +\
  \ br)\n        H_tilda = np.tanh(np.dot(X, Wxh) + np.dot(R * H, Whh) + bh)\n\n \
  \       H = U * H + (1 - U) * H_tilda\n\n        Y = np.dot(H, Wy) + by\n\n    \
  \    Hs[t] = H\n        Ys.append(Y)\n        Rs.append(R)\n        Us.append(U)\n\
  \        H_tildas.append(H_tilda)\n\n    return Ys, Hs, (Rs, Us, H_tildas)\n\ndef\
  \ gru_backward(params, Xs, Hs, dZs, cache):  # Ys, loss_function):\n    Wxu, Whu,\
  \ bu, Wxr, Whr, br, Wxh, Whh, bh, Wy, by = params\n\n    Rs, Us, H_tildas = cache\n\
  \n    dWxu, dWhu, dWxr, dWhr, dWxh, dWhh, dWy = np.zeros_like(Wxu), np.zeros_like(Whu),\
  \ np.zeros_like(Wxr), np.zeros_like(Whr), np.zeros_like(Wxh), np.zeros_like(Whh),\
  \ np.zeros_like(Wy)\n    dbu, dbr, dbh, dby = np.zeros_like(bu), np.zeros_like(br),\
  \ np.zeros_like(bh), np.zeros_like(by)\n\n    dH_next = np.zeros_like(Hs[0])\n\n\
  \    input_dim = Xs[0].shape[1]\n    T = len(Xs)\n\n    for t in reversed(range(T)):\n\
  \        R = Rs[t]\n        U = Us[t]\n        H = Hs[t]\n        X = Xs[t]\n  \
  \      H_tilda = H_tildas[t]\n        H_pre = Hs[t-1]\n        dZ = dZs[t]\n\n \
  \       # 输出层模型参数的梯度\n        dWy += np.dot(H.T, dZ)\n        dby += np.sum(dZ,\
  \ axis=0, keepdims=True)\n\n        # 隐藏状态 h 的梯度\n        dH = np.dot(dZ, Wy.T)\
  \ + dH_next\n\n        # H = U H_pre + (1-U) H_tildas\n        dH_tilda = dH * (1\
  \ - U)\n        dH_pre = dH * U\n        dU = H_pre * dH - H_tilda * dH\n```\n\n\
  \n\n\n# H_tilda = tanh(X Wxh+(R*H_)Whh+bh)\n\n```\ndH_tildaZ = (1-np.square(H_tilda))*dH_tilda\n\
  \ndWxh+= np.dot(X.T,dH_tildaZ)\n\ndWhh+= np.dot((R*H_pre).T,dH_tildaZ)\n\ndbh +=\
  \ np.sum(dH_tildaZ, axis=0, keepdims=True)\n\ndR = np.dot(dH_tildaZ, Whh.T)*H_pre\n\
  \ndH_pre += np.dot(dH_tildaZ, Whh.T)*R\n\n# U = \\sigma(UZ)   R = \\sigma(RZ)  \
  \              \n\ndUZ = U*(1-U)*dU\n\ndRZ = R*(1-R)*dR       \n\ndH_pre += np.dot(dUZ,\
  \ Whu.T)\n\ndH_pre += np.dot(dRZ, Whr.T)\n\n# R = \\sigma(X Wxr+H_ Whr + br)   \
  \     \n\ndWxr+= np.dot(X.T,dRZ)\n\ndWhr+= np.dot(H_pre.T,dRZ)\n\ndbr += np.sum(dRZ,\
  \ axis=0, keepdims=True)\n\ndWxu+= np.dot(X.T,dUZ)\n\ndWhu+= np.dot(H_pre.T,dUZ)\n\
  \ndbu += np.sum(dUZ, axis=0, keepdims=True)\n\nif True:\n\n    dX_RZ = np.dot(dRZ,Wxr.T)\n\
  \n    dX_UZ = np.dot(dUZ,Wxu.T)\n\n    dX_H_tildaZ = np.dot(dH_tildaZ,Wxh.T)\n\n\
  \    dX = dX_RZ+dX_UZ+dX_H_tildaZ\n\ndH_next = dH_pre\n\nreturn [dWxu, dWhu, dbu,\
  \ dWxr, dWhr, dbr, dWxh, dWhh, dbh, dWy,dby]\n```\n\n使用以下代码检查解析梯度和数值梯度是否一致：\n\n\
  ```\nT  = 3\n\ninput_dim, hidden_dim,output_dim = 4,3,4\n\nbatch_size = 1      \
  \  \n\nXs = np.random.randn(T,batch_size,input_dim)\n\nYs = np.random.randint(output_dim,\
  \ size=(T,batch_size))\n\nprint(\"Xs\",Xs)\n\nprint(\"Ys\",Ys)        \n\n# cheack\
  \ gradient  \n\nparams = gru_init_params(input_dim, hidden_dim,output_dim)\n\nHC\
  \ = gru_state_init(batch_size,hidden_dim)\n\nZs,Hs,cache = gru_forward(params,Xs,HC)\
  \ \n\nloss_function = rnn_loss_grad\n\nloss,dZs = loss_function(Zs,Ys)  \n\ngrads\
  \ = gru_backward(params,Xs,Hs,dZs,cache)\n\ndef rnn_loss():\n\n    HC = gru_state_init(batch_size,hidden_dim)\
  \    \n\n    Zs,Hs,cache= gru_forward(params,Xs,HC) \n\n    loss_function = rnn_loss_grad\n\
  \n    loss,dZs = loss_function(Zs,Ys)     \n\n    return loss\n\nnumerical_grads\
  \ = util.numerical_gradient(rnn_loss,params,1e-6) #rnn_numerical_gradient(rnn_loss,params,1e-10)\n\
  \n#diff_error = lambda x, y: np.max( np.abs(x - y)/(np.maximum(1e-8, np.abs(x) +\
  \ np.abs(y))))\n\ndiff_error = lambda x, y: np.max( np.abs(x - y))\n\ndef rel_error(x,\
  \ y):\n\n  \"\"\" 返回相对误差 \"\"\"\n\n  return np.max(np.abs(x - y) / (np.maximum(1e-8,\
  \ np.abs(x) + np.abs(y))))\n\nprint(\"loss\",loss)\n\nprint(\"[Wi, bi,Wf, bf, Wo,bo,Wc,\
  \ bc,Wy,by] \")\n\nfor i in range(len(grads)):\n\n    print(diff_error(grads[i],numerical_grads[i]))\n\
  \nprint(\"grads\",grads[0])\n\nprint(\"numerical_grads\",numerical_grads[0])\n```\n\
  \n测试结果略有差异。\n\n## 7.9 循环神经网络的类表示与实现\n\n### 7.9.1 使用类实现循环神经网络\n\n三种典型的循环神经网络——简单\
  \ RNN、LSTM 和 GRU——已使用函数实现。也可以使用类来实现这些不同类型的循环神经网络。\n\n类 `LSTM` 可用于表示前面的 LSTM 相关函数：\n\
  \n```\nimport numpy as np\n\ndef grad_clipping(grads,alpha):\n\n    norm = math.sqrt(sum((grad\
  \ ** 2).sum() for grad in grads))\n\n    if norm > alpha:\n\n        ratio = alpha\
  \ / norm\n\n        for i in range(len(grads)):\n\n            grads[i]*=ratio \n\
  \nclass LSTM(object):\n\n    def __init__(self,input_dim,hidden_dim,output_dim,scale=0.01):\n\
  \n        #super(LSTM_cell, self).__init__()\n\n        self.input_dim,self.hidden_dim,self.output_dim\
  \ = input_dim,hidden_dim,output_dim\n\n        normal = lambda m,n : np.random.randn(m,\
  \ n)*scale\n\n        two = lambda : (normal(input_dim+hidden_dim, hidden_dim),np.zeros((1,hidden_dim)))\n\
  \n        Wi, bi = two()  # 输入门参数\n\n        Wf, bf = two()  # 遗忘门参数\n\n       \
  \ Wo, bo = two()  # 输出门参数\n\n        Wc, bc = two()  # 候选细胞状态参数\n\n        Wy =\
  \ normal(hidden_dim, output_dim)\n\n        by = np.zeros((1,output_dim))  \n\n\
  \        self.params = [Wi, bi,Wf, bf, Wo,bo, Wc,bc,Wy,by]\n\n        self.grads\
  \ = [np.zeros_like(param) for param in self.params]\n\n        self.H,self.C = None,None\n\
  \n    def reset_state(self,batch_size):\n\n        self.H,self.C = (np.zeros((batch_size,\
  \ self.hidden_dim)),\n\n            np.zeros((batch_size, self.hidden_dim)))\n\n\
  \    def forward(self,Xs):\n\n        [Wi, bi,Wf, bf, Wo,bo,Wc,bc,Wy,by] = self.params\
  \ \n\n        if self.H is None or self.C is None:\n\n            self.reset_state(Xs[0].shape[0])\
  \  \n\n        H, C =  self.H,self.C\n\n        Hs = {}\n\n        Cs = {}\n\n \
  \       Zs = []\n\n        Hs[-1] = np.copy(H)\n\n        Cs[-1] = np.copy(C)\n\n\
  \        Is = []\n\n        Fs = []\n\n        Os = []\n\n        C_tildas = []\n\
  \n        for t in range(len(Xs)): \n\n            X = Xs[t]\n\n            XH =\
  \ np.column_stack((X, H))\n\n            I = sigmoid(np.dot(XH, Wi)+bi)\n\n    \
  \        F = sigmoid(np.dot(XH, Wf)+bf)\n\n            O = sigmoid(np.dot(XH, Wo)+bo)\n\
  \n            C_tilda = np.tanh(np.dot(XH, Wc)+bc)\n\n            C = F * C + I\
  \ * C_tilda\n\n            H = O*np.tanh(C) #O * C.tanh() #输出状态\n\n            Y\
  \ = np.dot(H, Wy) + by # 输出\n\n            Zs.append(Y)\n\n            Hs[t] = H\n\
  \n            Cs[t] = C\n\n            Is.append(I)\n\n            Fs.append(F)\n\
  \n            Os.append(O)\n\n            C_tildas.append(C_tilda)\n\n        self.Zs,self.Hs,self.Cs,self.Is,self.Fs,self.Os,self.C_tildas\
  \ =  Zs,Hs,Cs,Is,Fs,Os,C_tildas\n\n        self.Xs  =Xs\n\n        return Zs,Hs\n\
  \n    def backward(self,dZs): # Ys,loss_function):\n\n        [Wi, bi,Wf, bf, Wo,bo,Wc,\
  \ bc,Wy,by] = self.params\n\n        Hs,Cs,Is,Fs,Os,C_tildas = self.Hs,self.Cs,self.Is,self.Fs,self.Os,self.C_tildas\n\
  \n        Xs = self.Xs\n\n        dWi,dWf,dWo,dWc,dWy  = np.zeros_like(Wi), np.zeros_like(Wf),\
  \ np.zeros_like(Wo), np.zeros_like(Wc), np.zeros_like(Wy)\n\n        dbi,dbf,dbo,dbc,dby\
  \ = np.zeros_like(bi), np.zeros_like(bf),  np.zeros_like(bo), np.zeros_like(bc),\
  \ np.zeros_like(by)\n\n        dH_next = np.zeros_like(Hs[0])\n\n        dC_next\
  \ = np.zeros_like(Cs[0])\n\n        input_dim = Xs[0].shape[1]\n\n        h = Hs\n\
  \n        x = Xs\n\n        T = len(Xs)  \n\n        for t in reversed(range(T)):\
  \     \n\n            I = Is[t]\n\n            F = Fs[t]\n\n            O = Os[t]\n\
  \n            C_tilda = C_tildas[t]\n\n            H = Hs[t]\n\n            X =\
  \ Xs[t]\n\n            C = Cs[t]\n\n            H_pre =  Hs[t-1]\n\n           \
  \ C_prev = Cs[t-1]\n\n            XH_pre = np.column_stack((X, H_pre))\n\n     \
  \       XH_ = XH_pre\n\n            dZ = dZs[t]  \n\n            # 输出模型参数 f 的 idu\n\
  \n            dWy += np.dot(H.T,dZ)\n\n            dby += np.sum(dZ, axis=0, keepdims=True)\n\
  \n            # 隐藏状态 h 的梯度\n\n            dH = np.dot(dZ, Wy.T) + dH_next      \
  \ \n\n          #  dC = dH_next*O*dtanh(C) +dC_next    #* H = O*np.tanh(C) \n\n\
  \          #  dC = dH_next*O*(1-np.square(np.tanh(C))) +dC_next\n\n            dC\
  \ = dH*O*dtanh(C) +dC_next \n\n            dO = np.tanh(C) *dH \n\n            dOZ\
  \ = O * (1-O)*dO                      \n\n            dWo += np.dot(XH_.T,dOZ)\n\
  \n            dbo += np.sum(dOZ, axis=0, keepdims=True)              \n\n      \
  \       #di                         \n\n            di =  C_tilda*dC\n\n       \
  \     diZ = I*(1-I) * di\n\n            dWi += np.dot(XH_.T,diZ)\n\n           \
  \ dbi += np.sum(diZ, axis=0, keepdims=True)  \n\n            #df\n\n           \
  \ df = C_prev*dC\n\n            dfZ = F*(1-F) * df\n\n            dWf += np.dot(XH_.T,dfZ)\n\
  \n            dbf += np.sum(dfZ, axis=0, keepdims=True)          \n\n          \
  \  # dC_bar       \n\n            dC_tilda = I*dC                         #C = F\
  \ * C + I * C_tilda        \n\n            dC_tilda_Z =(1-np.square(C_tilda))*dC_tilda\
  \  # C_tilda = sigmoid(np.dot(XH, Wc)+bc)         \n\n            dWc += np.dot(XH_.T,dC_tilda_Z)\
  \       \n\n            dbc += np.sum(dC_tilda_Z, axis=0, keepdims=True)\n\n   \
  \         dXH_ = (np.dot(dfZ, Wf.T)\n\n                 + np.dot(diZ, Wi.T)\n\n\
  \                 + np.dot(dC_tilda_Z, Wc.T)\n\n                 + np.dot(dOZ, Wo.T))\n\
  \n            dX_prev = dXH_[:, :input_dim]\n\n            dH_prev = dXH_[:, input_dim:]\n\
  \n            dC_prev = F * dC\n\n            dC_next = dC_prev\n```\n\n\n\n\n####\
