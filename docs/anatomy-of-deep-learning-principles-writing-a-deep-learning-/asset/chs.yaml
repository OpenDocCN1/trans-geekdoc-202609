  ```\n\n## GRU 类实现\n\n以下 `GRU` 实现了一个具有 GRU 结构的循环神经网络：\n\n```python\nclass GRU(object):\n\
  \    def __init__(self, input_dim, hidden_dim, output_dim, scale=0.01):\n      \
  \  super(GRU, self).__init__()\n        self.input_dim, self.hidden_dim, self.output_dim,\
  \ self.scale = input_dim, hidden_dim, output_dim, scale\n\n        normal = lambda\
  \ m, n: np.random.randn(m, n) * scale\n        three = lambda: (normal(input_dim,\
  \ hidden_dim), normal(hidden_dim, hidden_dim), np.zeros((1, hidden_dim)))\n\n  \
  \      Wxu, Whu, bu = three()  # 更新门参数\n        Wxr, Whr, br = three()  # 重置门参数\n\
  \        Wxh, Whh, bh = three()  # 候选隐藏状态参数\n        Wy = normal(hidden_dim, output_dim)\n\
  \        by = np.zeros((1, output_dim))\n\n        self.Wxu, self.Whu, self.bu,\
  \ self.Wxr, self.Whr, self.br, self.Wxh, self.Whh, self.bh, self.Wy, self.by = Wxu,\
  \ Whu, bu, Wxr, Whr, br, Wxh, Whh, bh, Wy, by\n        self.params = [Wxu, Whu,\
  \ bu, Wxr, Whr, br, Wxh, Whh, bh, Wy, by]\n        self.grads = [np.zeros_like(param)\
  \ for param in self.params]\n        self.H = None\n\n    def reset_state(self,\
  \ batch_size):\n        self.H = np.zeros((batch_size, self.hidden_dim))\n\n   \
  \ def forward_step(self, X):\n        Wxu, Whu, bu, Wxr, Whr, br, Wxh, Whh, bh,\
  \ Wy, by = self.params\n        H = self.H  # previous state\n        X = Xs[t]\
  \  # 注意：此处引用了外部变量 t 和 Xs，可能为代码片段遗留问题\n\n        U = sigmoid(np.dot(X, Wxu) + np.dot(H,\
  \ Whu) + bu)\n        R = sigmoid(np.dot(X, Wxr) + np.dot(H, Whr) + br)\n      \
  \  H_tilda = np.tanh(np.dot(X, Wxh) + np.dot(R * H, Whh) + bh)\n        H = U *\
  \ H + (1 - U) * H_tilda\n        Y = np.dot(H, Wy) + by\n\n        Hs[t] = H\n \
  \       Ys.append(Y)\n        Rs.append(R)\n        Us.append(U)\n        H_tildas.append(H_tilda)\n\
  \n    def forward(self, Xs):\n        Wxu, Whu, bu, Wxr, Whr, br, Wxh, Whh, bh,\
  \ Wy, by = self.params\n\n        if self.H is None:\n            self.reset_state(Xs[0].shape[0])\n\
  \n        H = self.H\n        Hs = {}\n        Ys = []\n        Hs[-1] = np.copy(H)\n\
  \        Rs = []\n        Us = []\n        H_tildas = []\n\n        for t in range(len(Xs)):\n\
  \            X = Xs[t]\n            U = sigmoid(np.dot(X, Wxu) + np.dot(H, Whu)\
  \ + bu)\n            R = sigmoid(np.dot(X, Wxr) + np.dot(H, Whr) + br)\n       \
  \     H_tilda = np.tanh(np.dot(X, Wxh) + np.dot(R * H, Whh) + bh)\n            H\
  \ = U * H + (1 - U) * H_tilda\n            Y = np.dot(H, Wy) + by\n            Hs[t]\
  \ = H\n            Ys.append(Y)\n            Rs.append(R)\n            Us.append(U)\n\
  \            H_tildas.append(H_tilda)\n\n        self.Ys, self.Hs, self.Rs, self.Us,\
  \ self.H_tildas = Ys, Hs, Rs, Us, H_tildas\n        return Ys, Hs  # return Ys,Hs,(Rs,Us,H_tildas)\n\
  \n    def backward(self, dZs):  # Ys,loss_function):\n        Wxu, Whu, bu, Wxr,\
  \ Whr, br, Wxh, Whh, bh, Wy, by = self.params\n        Ys, Hs, Rs, Us, H_tildas\
  \ = self.Ys, self.Hs, self.Rs, self.Us, self.H_tildas\n\n        dWxu, dWhu, dWxr,\
  \ dWhr, dWxh, dWhh, dWy = np.zeros_like(Wxu), np.zeros_like(Whu), np.zeros_like(Wxr),\
  \ np.zeros_like(Whr), np.zeros_like(Wxh), np.zeros_like(Whh), np.zeros_like(Wy)\n\
  \        dbu, dbr, dbh, dby = np.zeros_like(bu), np.zeros_like(br), np.zeros_like(bh),\
  \ np.zeros_like(by)\n        dH_next = np.zeros_like(Hs[0])\n        input_dim =\
  \ Xs[0].shape[1]\n        T = len(Xs)\n\n        for t in reversed(range(T)):\n\
  \            R = Rs[t]\n            U = Us[t]\n            H = Hs[t]\n         \
  \   X = Xs[t]\n            H_tilda = H_tildas[t]\n            H_pre = Hs[t - 1]\n\
  \            dZ = dZs[t]\n\n            # output the idu of the model parameters\
  \ of f\n            dWy += np.dot(H.T, dZ)\n            dby += np.sum(dZ, axis=0,\
  \ keepdims=True)\n\n            # The gradient of the hidden state h\n         \
  \   dH = np.dot(dZ, Wy.T) + dH_next\n\n            # H = U * H_pre + (1 - U) * H_tildas\n\
  \            dH_tilda = dH * (1 - U)\n            dH_pre = dH * U\n            dU\
  \ = H_pre * dH - H_tilda * dH\n\n            # H_tilda = tanh(X * Wxh + (R * H_)\
  \ * Whh + bh)\n            dH_tildaZ = (1 - np.square(H_tilda)) * dH_tilda\n   \
  \         dWxh += np.dot(X.T, dH_tildaZ)\n            dWhh += np.dot((R * H_pre).T,\
  \ dH_tildaZ)\n            dbh += np.sum(dH_tildaZ, axis=0, keepdims=True)\n\n  \
  \          dR = np.dot(dH_tildaZ, Whh.T) * H_pre\n            dH_pre += np.dot(dH_tildaZ,\
  \ Whh.T) * R\n\n            # U = σ(UZ)   R = σ(RZ)\n            dUZ = U * (1 -\
  \ U) * dU\n            dRZ = R * (1 - R) * dR\n\n            dH_pre += np.dot(dUZ,\
  \ Whu.T)\n            dH_pre += np.dot(dRZ, Whr.T)\n\n            # R = σ(X * Wxr\
  \ + H_ * Whr + br)\n            dWxr += np.dot(X.T, dRZ)\n            dWhr += np.dot(H_pre.T,\
  \ dRZ)\n            dbr += np.sum(dRZ, axis=0, keepdims=True)\n\n            dWxu\
  \ += np.dot(X.T, dUZ)\n            dWhu += np.dot(H_pre.T, dUZ)\n            dbu\
  \ += np.sum(dUZ, axis=0, keepdims=True)\n\n            if True:\n              \
  \  dX_RZ = np.dot(dRZ, Wxr.T)\n                dX_UZ = np.dot(dUZ, Wxu.T)\n    \
  \            dX_H_tildaZ = np.dot(dH_tildaZ, Wxh.T)\n                dX = dX_RZ\
  \ + dX_UZ + dX_H_tildaZ\n\n            dH_next = dH_pre\n\n        grads = [dWxu,\
  \ dWhu, dbu, dWxr, dWhr, dbr, dWxh, dWhh, dbh, dWy, dby]\n        for i, _ in enumerate(self.grads):\n\
  \            self.grads[i] += grads[i]\n\n        return self.grads\n\n    def get_states(self):\n\
  \        return self.Hs\n\n    def get_outputs(self):\n        return self.Ys\n\n\
  \    def parameters(self):\n        return self.params\n```\n\n\n\n\n\n### 7.9.2\
  \ 循环神经网络单元的类实现\n\n循环神经网络最基本的计算是神经网络单元在某一时刻的前向和反向计算。在某一时刻，神经网络单元接收数据输入 `x` 和上一时间步的状态输入\
  \ `h`。对于简单的 RNN 和 GRU，输出是当前时间步的状态 `h'`，而 LSTM 输出当前的记忆存储 `c'` 和传递给下一时间步的 `h'`。例如，对于简单的\
  \ RNN，其前向计算公式为：\n\n`h' = tanh(W[ih]x + b[ih] + W[hh]h + b[hh])`\n\n此处，原始偏置 `b[h]`\
  \ 被拆分为 2 项：`b[ih]`、`b[hh]`。分别表示数据输入加权和的偏置和隐藏状态加权和的偏置。同理，对于 LSTM，每个原始加权和的一个偏置也可以拆分为两个偏置，即\
  \ LSTM 的计算公式：\n\n$$\n\\begin{matrix}\ni = \\sigma(W_{ii}x + b_{ii} + W_{hi}h + b_{hi})\
  \ \\\\\nf = \\sigma(W_{if}x + b_{if} + W_{hf}h + b_{hf}) \\\\\ng = \\tanh(W_{ig}x\
  \ + b_{ig} + W_{hg}h + b_{hg}) \\\\\no = \\sigma(W_{io}x + b_{io} + W_{ho}h + b_{ho})\
  \ \\\\\nc' = f * c + i * g \\\\\nh' = o * \\tanh(c')\n\\end{matrix}\n$$\n\n同理，GRU\
  \ 神经网络单元的计算公式为：\n\n$$\n\\begin{matrix}\nr = \\sigma(W_{ir}x + b_{ir} + W_{hr}h +\
  \ b_{hr}) \\\\\nz = \\sigma(W_{iz}x + b_{iz} + W_{hz}h + b_{hz}) \\\\\nn = \\tanh(W_{in}x\
  \ + b_{in} + r * (W_{hn}h + b_{hn})) \\\\\nh' = (1 - z) * n + z * h\n\\end{matrix}\n\
  $$\n\n可以使用一个通用的基类来表示这 3 种不同神经网络单元的共同属性：\n\n```python\nimport numpy as np\nimport\
  \ math\n\nclass RNNCellBase(object):\n    __constants__ = ['input_size', 'hidden_size']\n\
  \n    def __init__(self, input_size, hidden_size, bias, num_chunks):\n        super(RNNCellBase,\
  \ self).__init__()\n\n        self.input_size, self.hidden_size = input_size, hidden_size\n\
  \        self.bias = bias\n\n        self.W_ih = np.empty((input_size, num_chunks\
  \ * hidden_size))   # input to hidden\n        self.W_hh = np.empty((hidden_size,\
  \ num_chunks * hidden_size))  # hidden to hidden\n\n        if bias:\n         \
  \   self.b_ih = np.zeros((1, num_chunks * hidden_size))\n            self.b_hh =\
  \ np.zeros((1, num_chunks * hidden_size))\n            self.params = [self.W_ih,\
  \ self.W_hh, self.b_ih, self.b_hh]\n        else:\n            self.b_ih = None\n\
  \            self.b_hh = None\n            self.params = [self.W_ih, self.W_hh]\n\
  \n        self.grads = [np.zeros_like(param) for param in self.params]\n       \
  \ self.param_grads = self.params.copy()\n        self.param_grads.extend(self.grads)\n\
  \n        self.reset_parameters()\n\n    def parameters(self, no_grad=True):\n \
  \       if no_grad:\n            return self.params\n        return self.param_grads\n\
  \n    def reset_parameters(self):\n        stdv = 1.0 / math.sqrt(self.hidden_size)\n\
  \        for param in self.params:\n            w = param\n            w[:] = np.random.uniform(-stdv,\
  \ stdv, (w.shape))\n\n    def check_forward_input(self, input):\n        if input.shape[1]\
  \ != self.input_size:\n            raise RuntimeError(\n                \"input\
  \ has inconsistent input_size: got {}, expected {}\".format(\n                 \
  \   input.shape[1], self.input_size))\n\n    def check_forward_hidden(self, input,\
  \ h, hidden_label=''):\n        if input.shape[0] != h.shape[0]:\n            raise\
  \ RuntimeError(\n                \"Input batch size {} doesn't match hidden{} batch\
  \ size {}\".format(\n                    input.shape[0], hidden_label, h.shape[0]))\n\
  \        if h.shape[1] != self.hidden_size:\n            raise RuntimeError(\n \
  \               \"hidden{} has inconsistent hidden_size: got {}, expected {}\".format(\n\
  \                    hidden_label, h.shape[1], self.hidden_size))\n```\n\n构造函数的参数\
  \ `input_size` 和 `hidden_size` 分别代表输入数据和状态的大小，`num_chunks` 代表每个神经网络单元的计算门数量。`check_forward_input`\
  \ 和 `check_forward_hidden` 是检查输入数据和隐藏状态大小是否与神经网络单元的模型参数匹配的辅助方法。`num_chunks` 代表循环神经网络中的计算单元数量。对于基本\
  \ RNN，其值为 1，而对于 LSTM 和 GRU，其值分别为 4 和 3。\n\n可以在神经网络单元的基类 `RNNCellBase` 基础上定义具体类型的神经网络单元。以下代码定义了表示简单\
  \ RNN 单元的类 `RNNCell`：\n\n```python\ndef relu(x):\n    return x * (x > 0)\n\ndef\
  \ rnn_tanh_cell(x, h, W_ih, W_hh, b_ih, b_hh):\n    # h' = \\tanh(W_{ih} x + b_{ih}\
  \  +  W_{hh} h + b_{hh})\n    if b_ih is None:\n        return np.tanh(np.dot(x,\
  \ W_ih) + np.dot(h, W_hh))\n    else:\n        return np.tanh(np.dot(x, W_ih) +\
  \ b_ih + np.dot(h, W_hh) + b_hh)\n\ndef rnn_relu_cell(x, h, W_ih, W_hh, b_ih, b_hh):\n\
  \    # h' = \\relu(W_{ih} x + b_{ih}  +  W_{hh} h + b_{hh})\n    if b_ih is None:\n\
  \        return relu(np.dot(x, W_ih) + np.dot(h, W_hh))\n    else:\n        return\
  \ relu(np.dot(x, W_ih) + b_ih + np.dot(h, W_hh) + b_hh)\n\nclass RNNCell(RNNCellBase):\n\
  \    \"\"\"        h' = \\tanh(W_{ih} x + b_{ih}  +  W_{hh} h + b_{hh})\"\"\"\n\n\
  \    __constants__ = ['input_size', 'hidden_size', 'nonlinearity']\n\n    def __init__(self,\
  \ input_size, hidden_size, bias=True, nonlinearity=\"tanh\"):\n        super(RNNCell,\
  \ self).__init__(input_size, hidden_size, bias, num_chunks=1)\n        self.nonlinearity\
  \ = nonlinearity\n\n    def forward(self, input, h=None):\n        self.check_forward_input(input)\n\
  \n        if h is None:\n            h = np.zeros(input.shape[0], self.hidden_size,\
  \ dtype=input.dtype)\n\n        self.check_forward_hidden(input, h, '')\n\n    \
  \    if self.nonlinearity == \"tanh\":\n            ret = rnn_tanh_cell(input, h,\n\
  \                                self.W_ih, self.W_hh,\n                       \
  \         self.b_ih, self.b_hh)\n        elif self.nonlinearity == \"relu\":\n \
  \           ret = rnn_relu_cell(input, h,\n                                self.W_ih,\
  \ self.W_hh,\n                                self.b_ih, self.b_hh)\n        else:\n\
  \            ret = input\n            raise RuntimeError(\n                \"Unknown\
  \ nonlinearity: {}\".format(self.nonlinearity))\n\n        return ret\n\n    def\
  \ __call__(self, input, h=None):\n        return self.forward(input, h)\n\n    def\
  \ backward(self, dh, H, X, H_pre):\n        if self.nonlinearity == \"tanh\":\n\
  \            dZh = (1 - H * H) * dh  # backprop through tanh nonlinearity\n    \
  \    else:\n            dZh = H * (1 - H) * dh\n\n        db_hh = np.sum(dZh, axis=0,\
  \ keepdims=True)\n        db_ih = np.sum(dZh, axis=0, keepdims=True)\n        dW_ih\
  \ = np.dot(X.T, dZh)\n        dW_hh = np.dot(H_pre.T, dZh)\n        dh_pre = np.dot(dZh,\
  \ self.W_hh.T)\n        dx = np.dot(dZh, self.W_ih.T)\n\n        grads = (dW_ih,\
  \ dW_hh, db_ih, db_hh)\n        for a, b in zip(self.grads, grads):\n          \
  \  a += b\n\n        return dx, dh_pre, grads\n```\n\n以下代码演示了 `RNNCell` 单个时间步的前向和反向计算，其中\
  \ `x` 是批量大小为 3 的输入数据，`h` 是对应批量大小为 3 的状态：\n\n```python\nimport numpy as np\n\nnp.random.seed(1)\n\
  \nx = np.random.randn(3, 10)  # (batch_size, input_dim)\nh = np.random.randn(3,\
  \ 20)  # (batch_size, hidden_dim)\n\nrnn = RNNCell(10, 20)       # (input_dim, hidden_dim)\n\
  \nh_ = rnn(x, h)\n\nprint(\"h_:\", h_)\n\ndh_ = np.random.randn(*h.shape)\n\ndx,\
  \ dh, _ = rnn.backward(dh_, h_, x, h)\n\nprint(\"dh:\", dh)\n```\n\n测试结果略。\n\n以下代码使用序列数据\
  \ `x` 演示了步长为 6 的 `RNNCell` 计算过程：\n\n```python\nimport numpy as np\n\nx = np.random.randn(6,\
  \ 3, 10)\nh = np.random.randn(3, 20)\n\nrnn = RNNCell(10, 20)\n\nh_0 = h.copy()\n\
  hs = []\n\nfor i in range(6):\n    h = rnn(x[i], h)\n    hs.append(h)\n```\n\n\n\
  \n\n\nprint(\"h:\", `hs[0]`)\n\n`dh = np.random.randn(*h.shape)`\n\n```\nfor i in\
  \ reversed(range(6)):\n    if i == 0:\n        dx, dh, _ = rnn.backward(dh, hs[i],\
  \ x[i], h_0)\n    else:\n        dx, dh, _ = rnn.backward(dh, hs[i], x[i], hs[i-1])\n\
  ```\n\nprint(\"dh:\", `dh`)\n\n测试结果省略。\n\n同样地，LSTM 和 GRU 类型的 `LSTMCell` 和 `GRUCell`\
  \ 也可以定义。`LSTMCell` 的代码如下：\n\n```\ndef sigmoid(x):\n    return (1 / (1 + np.exp(-x)))\n\
  \ndef lstm_cell(x, hc, w_ih, w_hh, b_ih, b_hh): \n    h, c = hc[0], hc[1]\n    hidden_size\
  \ = w_ih.shape[1] // 4\n    ifgo_Z = np.dot(x, w_ih) + b_ih + np.dot(h, w_hh) +\
  \ b_hh\n    i = sigmoid(ifgo_Z[:, :hidden_size])\n    f = sigmoid(ifgo_Z[:, hidden_size:2*hidden_size])\n\
  \    g = np.tanh(ifgo_Z[:, 2*hidden_size:3*hidden_size])\n    o = sigmoid(ifgo_Z[:,\
  \ 3*hidden_size:])   \n    c_ = f * c + i * g\n    h_ = o * np.tanh(c_)\n    return\
  \ (h_, c_), np.column_stack((i, f, g, o))\n\ndef lstm_cell_back(dhc, ifgo, x, hc_pre,\
  \ w_ih, w_hh, b_ih, b_hh):\n    hidden_size = w_ih.shape[1] // 4\n    if isinstance(dhc,\
  \ tuple):\n        dh_, dc_next = dhc\n    else:\n        dh_ = dhc\n        dc_next\
  \ = np.zeros_like(dh_)\n    h_pre, c = hc_pre\n    i, f, g, o = ifgo[:, :hidden_size],\
  \ ifgo[:, hidden_size:2*hidden_size], \\\n                 ifgo[:, 2*hidden_size:3*hidden_size],\
  \ ifgo[:, 3*hidden_size:]\n    c_ = f * c + i * g\n    dc_ = dc_next + dh_ * o *\
  \ (1 - np.square(np.tanh(c_)))\n    do = dh_ * np.tanh(c_)\n    di = dc_ * g\n \
  \   dg = dc_ * i\n    df = dc_ * c\n    diz = i * (1 - i) * di\n    dfz = f * (1\
  \ - f) * df\n    dgz = (1 - np.square(g)) * dg\n    doz = o * (1 - o) * do\n   \
  \ dZ = np.column_stack((diz, dfz, dgz, doz))\n    dW_ih = np.dot(x.T, dZ)\n    dW_hh\
  \ = np.dot(h_pre.T, dZ)\n    db_hh = np.sum(dZ, axis=0, keepdims=True) \n    db_ih\
  \ = np.sum(dZ, axis=0, keepdims=True) \n    dx = np.dot(dZ, w_ih.T)\n    dh_pre\
  \ = np.dot(dZ, w_hh.T)\n    # return dx, dh_pre, (dW_ih, dW_hh, db_ih, db_hh)\n\
  \    dc = dc_ * f\n    return dx, (dh_pre, dc), (dW_ih, dW_hh, db_ih, db_hh)\n\n\
  class LSTMCell(RNNCellBase):\n    \"\"\"   \\begin{array}{ll}\n        i = \\sigma(W_{ii}\
  \ x + b_{ii} + W_{hi} h + b_{hi}) \\\\\n        f = \\sigma(W_{if} x + b_{if} +\
  \ W_{hf} h + b_{hf}) \\\\\n        g = \\tanh(W_{ig} x + b_{ig} + W_{hg} h + b_{hg})\
  \ \\\\\n        o = \\sigma(W_{io} x + b_{io} + W_{ho} h + b_{ho}) \\\\\n      \
  \  c' = f * c + i * g \\\\\n        h' = o * \\tanh(c') \\\\\n        \\end{array}\
  \      \n        \"\"\"\n    def __init__(self, input_size, hidden_size, bias=True):\n\
  \        super(LSTMCell, self).__init__(input_size, hidden_size, bias, num_chunks=4)\n\
  \n    def init_hidden(batch_size):\n        zeros = np.zeros(input.shape[0], self.hidden_size,\
  \ dtype=input.dtype)  \n        return (zeros, zeros) # np.array([zeros, zeros])\n\
  \n    def forward(self, input, h=None): \n        self.check_forward_input(input)\n\
  \        if h is None:\n            h = init_hidden(input.shape[0])            \n\
  \        self.check_forward_hidden(input, h[0], '[0]')\n        self.check_forward_hidden(input,\
  \ h[1], '[1]')\n        return lstm_cell(\n                input, h,\n         \
  \       self.W_ih, self.W_hh,\n                self.b_ih, self.b_hh,\n         \
  \   )\n\n    def __call__(self, input, h=None): \n        return self.forward(input,\
  \ h)\n\n    def backward(self, dhc, ifgo, input, hc_pre):\n        if hc_pre is\
  \ None:\n            hc_pre = init_hidden(input.shape[0])\n        dx, dh_pre, grads\
  \ = lstm_cell_back(\n                            dhc, ifgo,\n                  \
  \          input, hc_pre,\n                            self.W_ih, self.W_hh,\n \
  \                           self.b_ih, self.b_hh)\n        # grads = (dW_ih, dW_hh,\
  \ db_ih, db_hh)\n        for a, b in zip(self.grads, grads):\n            a += b\
  \ \n        return dx, dh_pre, grads           \n```\n\n`GRUCell` 的代码如下：\n\n```\n\
  def gru_cell(x, h, w_ih, w_hh, b_ih, b_hh):\n    Z_ih, Z_hh = np.dot(x, w_ih) +\
  \ b_ih, np.dot(h, w_hh) + b_hh\n    hidden_size = w_ih.shape[1] // 3\n    r = sigmoid(Z_ih[:,\
  \ :hidden_size] + Z_hh[:, :hidden_size])\n    u = sigmoid(Z_ih[:, hidden_size:2*hidden_size]\
  \ + Z_hh[:, hidden_size:2*hidden_size]) \n    n = np.tanh(Z_ih[:, 2*hidden_size:]\
  \ + r * Z_hh[:, 2*hidden_size:]) \n    h_next = u * h + (1 - u) * n \n    run =\
  \ np.column_stack((r, u, n))\n    # return h_next, (r, u, n)  \n    return h_next,\
  \ run \n\ndef gru_cell_back(dh, run, x, h_pre, w_ih, w_hh, b_ih, b_hh):\n    hidden_size\
  \ = w_ih.shape[1] // 3\n    # r, u, n = run\n    r, u, n = run[:, :hidden_size],\
  \ run[:, hidden_size:2*hidden_size], \\\n              run[:, 2*hidden_size:]\n\
  \    # H = U H_pre + (1-U) H_tildas\n    dn = dh * (1 - u)\n    dh_pre = dh * u\n\
  \    du = h_pre * dh - n * dh   \n    # n = \\tanh(W_{in} x + b_{in} + r * (W_{hn}\
  \ h + b_{hn})) \n    dnz = (1 - np.square(n)) * dn \n    Z_hn = np.dot(h_pre, w_hh[:,\
  \ 2*hidden_size:]) + b_hh[:, 2*hidden_size:]\n    dr = dnz * Z_hn\n    dZ_ih_n =\
  \ dnz\n    dZ_hh_n = dnz * r\n    duz = u * (1 - u) * du\n    dZ_ih_u = duz\n  \
  \  dZ_hh_u = duz\n    drz = r * (1 - r) * dr\n    dZ_ih_r = drz\n    dZ_hh_r = drz\
  \    \n    dZ_ih = np.column_stack((dZ_ih_r, dZ_ih_u, dZ_ih_n))\n    dZ_hh = np.column_stack((dZ_hh_r,\
  \ dZ_hh_u, dZ_hh_n))            \n    dW_ih = np.dot(x.T, dZ_ih)\n    dW_hh = np.dot(h_pre.T,\
  \ dZ_hh)\n    db_ih = np.sum(dZ_ih, axis=0, keepdims=True) \n    db_hh = np.sum(dZ_hh,\
  \ axis=0, keepdims=True)             \n    dh_pre += np.dot(dZ_hh, w_hh.T)\n   \
  \ dx = np.dot(dZ_ih, w_ih.T)\n    return dx, dh_pre, (dW_ih, dW_hh, db_ih, db_hh)\n\
  \nclass GRUCell(RNNCellBase):\n    \"\"\"  \\begin{array}{ll}\n        r = \\sigma(W_{ir}\
  \ x + b_{ir} + W_{hr} h + b_{hr}) \\\\\n        z = \\sigma(W_{iz} x + b_{iz} +\
  \ W_{hz} h + b_{hz}) \\\\\n        n = \\tanh(W_{in} x + b_{in} + r * (W_{hn} h\
  \ + b_{hn})) \\\\\n        h' = (1 - z) * n + z * h\n        \\end{array}\n    \
  \    \"\"\"\n    def __init__(self, input_size, hidden_size, bias=True):\n     \
  \   super(GRUCell, self).__init__(input_size, hidden_size, bias, num_chunks=3)\n\
  \n    def forward(self, input, h=None): \n        self.check_forward_input(input)\n\
  \        if h is None:\n            h = np.zeros(input.shape[0], self.hidden_size,\
  \ dtype=input.dtype) \n        self.check_forward_hidden(input, h, '')\n       \
  \ return gru_cell(\n                input, h,\n                self.W_ih, self.W_hh,\n\
  \                self.b_ih, self.b_hh,\n            )  \n\n    def __call__(self,\
  \ input, h=None): \n        return self.forward(input, h)\n\n    def backward(self,\
  \ dh, run, input, h_pre):       \n        if h_pre is None:\n            h_pre =\
  \ np.zeros(input.shape[0], self.hidden_size, dtype=input.dtype)      \n        dx,\
  \ dh_pre, grads = gru_cell_back(\n                            dh, run,\n       \
  \                     input, h_pre,\n                            self.W_ih, self.W_hh,\n\
  \                            self.b_ih, self.b_hh)\n        # grads = (dW_ih, dW_hh,\
  \ db_ih, db_hh)\n        for a, b in zip(self.grads, grads):\n            a += b\
  \ \n        return dx, dh_pre, grads\n```\n\n\n\n\n\n#### 不同的循环神经网络模型\n\n不同的循环神经网络模型可以通过神经网络单元来实现。\n\
  \n## 7.10 多层、双向循环神经网络\n\n### 7.10.1 多层循环神经网络\n\n前面的讨论是关于单层循环神经网络，即只有一个 RNN 网络层。与全连接神经网络或卷积神经网络类似，可以定义多层循环神经网络，如图\
  \ 7-46 所示。一个隐藏层接受数据输入并生成隐藏状态 `H^((1))`，该隐藏状态被用作第二个隐藏层的输入，……，最后一个循环神经网络层可以用作整个网络的输出层，也可以后接一个或多个非循环神经网络层。\n\
  \n**图 7-46** 多层循环神经网络，第一个隐藏层接受数据输入并生成隐藏状态 `H^((1))`，该隐藏状态被用作第二个隐藏层的输入，最后一个循环神经网络层可以用作整个网络的输出层，也可以后接一个或多个非循环神经网络层。\n\
  \n在时刻 `t`，第 1 层神经元的输入包括数据输入 `X[t]` 和状态输入 `H[t-1]^((1))`，计算第一层的隐藏状态 `H[t]^((1))`：\n\
  \n`H[t]^((1)) = f1))`\n\n第一层中 RNN 单元（神经元）的状态 `H[t]^((1))` 被用作第二层 RNN 单元（神经元）的数据输入，并结合第二层神经元在上一时刻自身的状态\
  \ `H[t-1]^((2))` 共同计算该神经元的状态 `H[t]^((2))`。该状态被用作第三层 RNN 单元（神经元）的数据输入，以计算第三层的隐藏状态\
  \ `H[t]^((3))`。一般来说，第 `l` 个隐藏层在时刻 `t` 接受隐藏状态 `H[t-1]^((l))` 及其前一层（即第 `l-1` 个隐藏层，通常为隐藏状态\
  \ `H[t]^((l-1))`）的输入，输出隐藏状态 `H[t]^((l))`，其计算过程可用以下公式表示：\n\n`H[t]^((l)) = fl), H[t-1]^((l)))`\n\
  \n除了第一层的数据输入是初始数据输入 `X[t]` 之外，其他循环网络层的数据输入均为前一循环网络层的隐藏状态输出 `H[t]^((l-1))`。\n\n多层循环网络最后一层的状态变量可以直接作为模型的输出\
  \ `F[t] = H[t]^((L))`，也可以通过激活函数输出。\n\n`F[t] = g(H[t]^((L)))`\n\n如果最后一个循环神经网络层是整个网络的输出层，则该\
  \ `F[t]` 即为整个网络的输出。如果该循环神经网络层后面还有非循环网络层，则该 `F[t]` 将继续作为后续网络层的输入。\n\n与多层全连接或卷积神经网络类似，多层\
  \ RNN 可以捕获从低到高的分层特征。\n\n在多层循环神经网络中，初始输入数据 `X` 的大小与隐藏状态 `H` 的大小通常不相等，且每个循环网络层中 `H`\
  \ 的大小相同，因此第一层的数据输入与其他循环网络层的数据输入通常不同，所以除第一层外，循环网络层的权重参数形状相同。当然，也可以让不同的循环网络层具有不同大小的隐藏状态，但在实践中通常不这样做。\n\
  \n前面的循环神经网络单元可用于构建多层循环神经网络。以下代码基于神经网络单元构建了一个表示多层循环神经网络的基类 `RNNBase`：\n\n```python\n\
  from Layers import * \n\nclass RNNBase(Layer):\n\n    def __init__(self, mode, input_size,\
  \ hidden_size, n_layers, bias=True):\n\n        super(RNNBase, self).__init__()\
  \        \n\n        self.mode = mode\n\n        if mode == 'RNN_TANH':\n      \
  \      self.cells = [RNNCell(input_size, hidden_size, bias, nonlinearity=\"tanh\"\
  )]\n            self.cells += [RNNCell(hidden_size, hidden_size, bias, nonlinearity=\"\
  tanh\") for i in range(n_layers-1)]\n        elif mode == 'RNN_RELU':\n        \
  \    self.cells = [RNNCell(input_size, hidden_size, bias, nonlinearity=\"relu\"\
  )]\n            self.cells += [RNNCell(hidden_size, hidden_size, bias, nonlinearity=\"\
  relu\") for i in range(n_layers-1)]\n        elif mode == 'LSTM':\n            self.cells\
  \ = [LSTMCell(input_size, hidden_size, bias)]\n            self.cells += [LSTMCell(hidden_size,\
  \ hidden_size, bias) for i in range(n_layers-1)]\n        elif mode == 'GRU':\n\
  \            self.cells = [GRUCell(input_size, hidden_size, bias)]\n           \
  \ self.cells += [GRUCell(hidden_size, hidden_size, bias) for i in range(n_layers-1)]\n\
  \n        self.input_size, self.hidden_size = input_size, hidden_size\n        self.n_layers\
  \ = n_layers\n        self.flatten_parameters()\n        self._params = None\n\n\
  \    def flatten_parameters(self):\n        self.params = []\n        self.grads\
  \ = []\n        for i in range(self.n_layers):\n            rnn = self.cells[i]\n\
  \            for j, p in enumerate(rnn.params):\n                self.params.append(p)\n\
  \                self.grads.append(rnn.grads[j])\n\n    def forward(self, x, h=None):\n\
  \        seq_len, batch_size = x.shape[0], x.shape[1]\n        n_layers = self.n_layers\n\
  \        mode = self.mode\n        hs = [[] for i in range(n_layers)]\n        zs\
  \ = [[] for i in range(n_layers)]        \n\n        if h is None:\n           \
  \ h = self.init_hidden(batch_size)\n\n        if False:\n            if mode ==\
  \ 'LSTM':  # isinstance(h, tuple):\n                self.h = (h[0].copy(), h[1].copy())\
  \       \n            else:\n                self.h = h.copy()     \n        else:\n\
  \            self.h = h\n\n        for i in range(n_layers):\n            cell =\
  \ self.cells[i]\n            if i != 0:\n                x = hs[i-1]  # out h of\
  \ pre layer\n                if mode == 'LSTM':\n                    x = np.array([h\
  \ for h, c in x])\n\n            hi = h[i]\n            if mode == 'LSTM':\n   \
  \             hi = (h[0][i], h[1][i])\n\n            for t in range(seq_len):\n\
  \                hi = cell(x[t], hi) \n                if isinstance(hi, tuple):\n\
  \                    hi, z = hi[0], hi[1]\n                    zs[i].append(z) \n\
  \                hs[i].append(hi)                \n                # if mode ==\
  \ 'LSTM' or mode == 'GRU':\n                #     zs[i].append(z)              \
  \   \n\n        self.hs = np.array(hs)  # (layer_size, seq_size, batch_size, hidden_size)\n\
  \        if len(zs[0]) > 0:\n            self.zs = np.array(zs)\n        else:\n\
  \            self.zs = None\n\n        output = hs[-1]  # containing the output\
  \ features (`h_t`) \n                         # from the last layer of the RNN,\n\
  \        if mode == 'LSTM':\n            output = [h for h, c in output]\n     \
  \   hn = self.hs[:, -1, :, :]  # containing the hidden state for `t = seq_len`\n\
  \        return np.array(output), hn\n\n    def __call__(self, x, h=None):\n   \
  \     return self.forward(x, h)\n\n    def init_hidden(self, batch_size):\n    \
  \    zeros = np.zeros((self.n_layers, batch_size, self.hidden_size))\n        if\
  \ self.mode == 'LSTM':\n            self.h = (zeros, zeros)\n        else:\n   \
  \         self.h = zeros\n        return self.h\n\n    def backward(self, dhs, input):\
  \  # ,hs):      \n        if self.hs is None:\n            self.hs, _ = self.forward(input)\n\
  \        hs = self.hs\n        zs = self.zs if self.zs is not None else hs     \
  \   \n        seq_len, batch_size = input.shape[0], input.shape[1]       \n    \
  \    dinput = [None for t in range(seq_len)]\n        if len(dhs.shape) == 2:  #\
  \ dh at last time (batch, hidden)\n            dhs_ = [np.zeros_like(dhs) for i\
  \ in range(seq_len)]\n            dhs_[-1] = dhs\n            dhs = np.array(dhs_)\n\
  ```\n\n\n\n\n\n#### 多层循环神经网络的实现与测试\n\n##### 代码实现\n\n```python\n        elif dhs.shape[0]\
  \ != seq_len:            \n            raise RuntimeError(\n                \"dhs\
  \ has inconsistent seq_len: got {}, expected {}\".format(\n                    dhs.shape[0],\
  \ seq_len))\n        else:           \n            pass     \n        \n       \
  \ #----dhidden--------    \n        dhidden = [None for i in range(self.n_layers)]\
  \        \n        for layer in reversed(range(self.n_layers)):\n            layer_hs\
  \ = hs[layer]\n            layer_zs = zs[layer]\n            cell = self.cells[layer]\n\
  \            if layer == 0:\n                layer_input = input\n            else:\n\
  \                if self.mode == 'LSTM':\n                    layer_input = self.hs[layer-1]\n\
  \                    layer_input = [h for h, c in layer_input]\n               \
  \ else:\n                    layer_input = self.hs[layer-1]\n            h_0 = self.h[layer]\
  \                 \n            dh = np.zeros_like(dhs[0]) # 来自下一时刻的梯度\n       \
  \     if self.mode == 'LSTM':\n                h_0 = (self.h[0][layer], self.h[1][layer])\n\
  \                dc = np.zeros_like(dhs[0])\n            for t in reversed(range(seq_len)):\n\
  \                dh += dhs[t] # 下一时刻的梯度 + 当前时刻的梯度\n                h_pre = h_0 if\
  \ t == 0 else layer_hs[t-1]\n                if self.mode == 'LSTM':\n         \
  \           dhc = (dh, dc)\n                    dx, dhc, _ = cell.backward(dhc,\
  \ layer_zs[t], layer_input[t], h_pre)  \n                    dh, dc = dhc\n    \
  \            else:\n                    dx, dh, _ = cell.backward(dh, layer_zs[t],\
  \ layer_input[t], h_pre)  \n                if layer > 0:\n                    dhs[t]\
  \ = dx\n                else:\n                    dinput[t] = dx\n            \
  \    #----dhidden--------    \n                if t == 0:\n                    if\
  \ self.mode == 'LSTM':\n                        dhidden[layer] = dhc\n         \
  \           else:\n                        dhidden[layer] = dh                 \
  \   \n        return np.array(dinput), np.array(dhidden)\n\n    def parameters(self):\n\
  \        if self._params is None:\n            self._params = []           \n  \
  \          for i, _ in enumerate(self.params):  \n                self._params.append([self.params[i],\
  \ self.grads[i]])  \n        return self._params\n```\n\n基于此基类，可以实现多层循环神经网络。例如，以下代码分别表示\
  \ `RNN`、`LSTM` 和 `GRU` 实现了多层简单循环网络、LSTM 和 GRU 循环神经网络：\n\n```python\nclass RNN(RNNBase):\n\
  \    def __init__(self, *args, **kwargs):\n        if 'nonlinearity' in kwargs:\n\
  \            if kwargs['nonlinearity'] == 'tanh':\n                mode = 'RNN_TANH'\n\
  \            elif kwargs['nonlinearity'] == 'relu':\n                mode = 'RNN_RELU'\n\
