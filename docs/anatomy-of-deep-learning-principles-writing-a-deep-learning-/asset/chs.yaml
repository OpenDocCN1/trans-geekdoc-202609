  \n### 3.1.7 梯度验证\n\n如前所述，在实际实现梯度下降法之前，应进行梯度验证，以确保梯度和函数值的计算是正确的。对于线性回归问题，需要使用以下数值梯度来检查解析梯度计算是否正确。\n\
  \n$\\\\frac{\\\\partial{L(w,b)}}{\\\\partial w} = \\\\lim_{\\\\epsilon \\\\to 0}\\\
  \\frac{L(w + \\\\epsilon,b) - L(w - \\\\epsilon,b)}{2\\\\epsilon}$  \n\n$\\\\frac{\\\
  \\partial{L(w,b)}}{\\\\partial b} = \\\\lim_{\\\\epsilon \\\\to 0}\\\\frac{L(w,b\
  \ + \\\\epsilon) - L(w,b - \\\\epsilon)}{2\\\\epsilon}$\n\n对于前面的梯度下降法，可以使用以下代码验证解析梯度和数值梯度是否一致。使用前面的\
  \ `loss()` 函数计算函数值 $L(w,b)$，以下 2 行代码用于计算解析梯度。\n\n```\ndw = np.mean((w*x+b-y)*x)\n\
  db = np.mean((w*x+b-y))  \n```\n\n可以定义一个函数来计算数值梯度：\n\n```\ndf_approx = lambda x,y,w,b,eps:\
  \ ( (loss(x,y,w+eps,b)-loss(x,y,w-eps,b) )/(2*eps),  (loss(x,y,w,b+eps)-loss(x,y,w,b-eps)\
  \ )/(2*eps) )\n```\n\n然后在任意点（如 $(w,b) = (1.0, -2.0)$）比较解析梯度和数值梯度。\n\n```\nw =1.0\n\
  b = -2.\neps = 1e-8\ndw = np.mean((w*X+b-y)*X)\ndb = np.mean((w*X+b-y))        \
  \                           \ngrad = np.array([dw,db])\ngrad_approx = df_approx(X,y,w,b,eps)\n\
  print(grad)\nprint(grad_approx)\nprint(abs(grad-grad_approx))\n```\n\n```\n    [-0.24450692\
  \ 0.32066495]\n    (-0.24450690361277339, 0.3206649612508272)\n    [1.98820717e-08\
  \ 1.27972190e-08]\n```\n\n可以看到两种计算结果一致。这使得我们可以放心地在梯度下降法中使用解析梯度。  \n\n\n\n\n当然，损失函数的数值梯度也可以使用第\
  \ 2.4 节中的通用数值梯度函数来计算。\n\n### 3.1.8 预测\n\n一旦特定假设函数 `f(x; w, b) = x*w + b` 的参数 `w`、`b`\
  \ 确定，就可以将新数据（如城市人口）代入假设函数以获得预测值（如餐车利润）。\n\n例如，训练集 `X` 中的所有 `X[i]` 都可以代入此假设函数以获得预测值\
  \ `f(X[i]; w, b) = X[i]*w + b`。以下代码计算 `x` 中所有样本的预测值，并使用这些预测值绘制对应预测值的数据点（图 3-10）。\n\
  \n```python\n# Use the obtained w to calculate the predicted value of the sample\
  \ in X\nm = len(X)\npredictions = [0] * m\nfor i in range(m):\n    predictions[i]\
  \ = X[i] * w + b\n\nplt.scatter(X, y, marker=\"x\", c=\"red\")\nplt.scatter(X, predictions,\
  \ marker=\"o\", c=\"blue\")\n# plt.plot(X, predictions, linewidth=2)  # plot the\
  \ hypothesis on top of the training data\n```\n\n![](img/file45.png)\n\n图 3-10 模型预测\n\
  \n### 3.1.9 多特征线性回归\n\n#### 1. 多特征线性回归\n\n餐车利润问题的样本只有一个数据特征。在许多实际问题中，样本具有多个数据特征。例如，在房价预测问题中，房屋特征可能包括房屋面积\
  \ `x[1]`、房间数量 `x[2]` 等多个特征。房屋特征 `xx = (x[1], x[2])` 与房价 `y` 之间的关系可以表示为：\n\n`y =\
  \ f(xx) = w[1] * x[1] + w[2] * x[2] + b`\n\n有时，为了更好地描述 `xx` 和 `y` 之间的关系，可以在原始特征的基础上构造一些高阶特征，如\
  \ `x[1]²`、`x[2]²` 等，将原始特征和高阶特征作为新特征，然后用以下函数表示新特征与真实值之间的关系：\n\n`y = f(xx) = w[1]\
  \ * x[1] + w[2] * x[2] + w[3] * x[1]² + w[4] * x[2]² + b`\n\n函数 `f(xx)` 是特征 `x[1]`、`x[2]`\
  \ 的非线性函数，但它仍然是未知参数 `w[1]`、`w[2]`、`w[3]`、`w[4]`、`b` 的线性函数，所以它仍然是线性回归。将 `x[1]²` 和\
  \ `x[2]²` 视为两个新特征 `x[3]` 和 `x[4]`，该函数也是 `x[1]`、`x[2]`、`x[3]` 和 `x[4]` 的线性函数。\n\n\
  一般来说，如果一个样本包含 K 个特征，线性回归的假设函数为：\n\n$$f(xx) = w_{1} * x_{1} + w_{2} * x_{2} + ...\
  \ + w_{K} * x_{K} + b = \\sum\\limits_{i = 1}^{K}{w_{i}x_{i}} + b$$\n\n可以用行向量表示一个样本的所有特征，即\
  \ `xx = (x[1], x[2], ..., x[K])`，用列向量表示假设函数中这些特征前的系数，即 `ww = (w[1], w[2], ..., w[K])^T`，假设函数可以用更简单的向量形式表示：\n\
  \n$$\nf(xx) = (x_{1},x_{2},\\cdots,x_{K})\n\\begin{bmatrix}\nw_{1} \\\\\nw_{2} \\\
  \\\n\\vdots \\\\\nw_{K} \\\\\n\\end{bmatrix}\n+ b = xxww + b \\tag{3-13}\n$$\n\n\
  对应系数 `w[i]` 的值越大，`x[i]` 对 `f(xx)` 输出值的影响越大。因此，`w[i]` 通常称为**权重**，它与 `x[i]` 无关，`b`\
  \ 也作为一个整体影响输出值，称为**偏置**。\n\n有时 `b` 写作 `w[0]`，所有未知参数表示为 `ww = (w[0], w[1], w[2],\
  \ ..., w[K])^T`，`xx` 表示为 `xx = (x[0]=1, x[1], x[2], ..., x[K])`。假设函数表示为：\n\n$$\n\
  f_{ww}(xx) = w_{1} * x_{1} + w_{2} * x_{2} + ... + w_{K} * x_{K} + w_{0} = (x_{0},x_{1},x_{2},\\\
  cdots,x_{K})\n\\begin{bmatrix}\nw_{0} \\\\\nw_{1} \\\\\nw_{2} \\\\\n\\vdots \\\\\
  \nw_{K} \\\\\n\\end{bmatrix}\n= xxww\n$$\n\n如果有 m 个样本 `xx^{(i)}`，将这些样本按行放入二维矩阵中：\n\
  \n$$\nXX =\n\\begin{bmatrix}\nxx^{(1)} \\\\\nxx^{(2)} \\\\\n\\vdots \\\\\nxx^{(m)}\
  \ \\\\\n\\end{bmatrix}\n=\n\\begin{bmatrix}\nxx_{0}^{(1)} & xx_{1}^{(1)} & \\cdots\
  \ & xx_{K}^{(1)} \\\\\nxx_{0}^{(2)} & xx_{1}^{(2)} & \\cdots & xx_{K}^{(2)} \\\\\
  \n\\vdots & & & \\\\\nxx_{0}^{(m)} & xx_{1}^{(m)} & \\cdots & xx_{K}^{(m)} \\\\\n\
  \\end{bmatrix}\n$$\n\n因为每个样本都会产生一个输出，所以函数对所有样本的输出可以用向量（矩阵）形式写成：\n\n$$\nf_{ww}(XX)\
  \ =\n\\begin{bmatrix}\nxx^{(1)} \\\\\nxx^{(2)} \\\\\n\\vdots \\\\\nxx^{(m)} \\\\\
  \n\\end{bmatrix}\nww =\n\\begin{bmatrix}\nxx_{0}^{(1)} & xx_{1}^{(1)} & \\cdots\
  \ & xx_{K}^{(1)} \\\\\nxx_{0}^{(2)} & xx_{1}^{(2)} & \\cdots & xx_{K}^{(2)} \\\\\
  \n\\vdots & & & \\\\\nxx_{0}^{(m)} & xx_{1}^{(m)} & \\cdots & xx_{K}^{(m)} \\\\\n\
  \\end{bmatrix}\nww = XXww \\tag{3-14}\n$$\n\n这个矩阵乘积可以用 numpy 轻松计算，即使用 `np.dot(X,\
  \ W)` 或 `X.dot(W)` 或 `X @ W`。例如，下面的 `XX` 是 2 个样本，每个样本有 3 个特征，`ww` 是对应 3 个特征的权重，然后可以直接计算\
  \ `fww = XXww`。\n\n```python\nimport numpy as np\nX = np.array([[1, 8, 3], [1, 7,\
  \ 5]])  # 2 samples, 3 features per sample\nw = np.array([1.3, 2.4, 0.5])      \
  \   # weights\nX @ w\n```\n\n```\narray([22. , 20.6])\n```\n\n用向量（矩阵）表示运算时，一定要注意各维度的边界是否一致。对于上面的\
  \ `xxww`：\n\n`XX` (2×3) × `ww` (3×1) = `ff` (2×1)\n\n**模型训练**是使用一组具有已知目标值的样本 `{xx^{(i)},\
  \ y^{(i)}}` 来找到最佳假设函数 `fww`，即确定假设函数的未知参数 `ww`。\n\n与单变量假设函数一样，对于多变量假设函数，也可以使用基于均方误差的损失函数来衡量模型预测值与真实值之间的误差：\n\
  \n$$L(ww) = \\frac{1}{2m}\\sum\\limits_{i = 1}^{m}(f_{ww}(xx^{(i)}) - y^{(i)})^{2}$$\n\
  \n`L(ww)` 是未知参数 `ww` 的函数，`ww` 包含多个变量，所以这是 `ww` 的多元函数。线性回归的模型训练是找到使损失函数值最小化的参数 `ww\
  \ = (w[0], w[1], ...)`：\n\narg min `[w[0], w[1], ...] L(w[0], w[1], ...)`\n\n如果\
  \ `L(ww)` 在 `ww^*` 处取得最小值，则该点的梯度（偏导数）应为 0：\n\n$$\\frac{\\partial L(w_{0},w_{1},...)}{\\\
  partial w_{j}}|_{ww^{*}} = 0$$\n\n为了更好地看清等式左边偏导数的推导过程，引入一些辅助符号：\n\n`f^{(i)} = fww})\
  \ = xx^{(i)}ww = w[1] * x[1]^{(i)} + w[2] * x[2]^{(i)} + ... + w[K] * x[K]^{(i)}\
  \ + w[0] * 1`\n\n`δ^{(i)} = f^{(i)} - y^{(i)}`\n\n$$L(ww) = \\frac{1}{2m}\\sum\\\
  limits_{i = 1}^{m}{\\delta^{(i)}}^{2}$$\n\n`L(ww)` 可以看作是 m 个 `δ^{(i)}²` 的平均值再除以\
  \ 2，`δ^{(i)}` 是 `f` 的函数，`f^{(i)}` 是 `ww = (w[1], w[2], ..., w[k])^T` 的函数，根据求导四则规则（如和函数的导数是各函数导数之和）和复合函数的链式法则：\n\
  \n$$\\frac{\\partial{L(ww)}}{\\partial\\delta^{(i)}} = \\frac{1}{2m}{2\\delta^{(i)}}\
  \ = \\frac{\\delta^{(i)}}{m}$$\n\n\n\n\n##### 线性回归的梯度推导与法方程求解\n\n###### 梯度推导\n\n\
  $$\n\\frac{\\partial\\delta^{(i)}}{\\partial f^{(i)}} = 1\n$$\n\n$$\n\\frac{\\partial\
  \ f^{(i)}}{\\partial w_{j}} = x_{j}^{(i)}\n$$\n\n$$\n\\begin{matrix}\n\\frac{\\\
  partial{LL(\\pmb{w})}}{\\partial w_{j}} & {= \\sum\\limits_{i = 1}^{m}{\\frac{\\\
  partial{LL(\\pmb{w})}}{\\partial\\delta^{(i)}} \\times \\frac{\\partial\\delta^{(i)}}{\\\
  partial f^{(i)}} \\times \\frac{\\partial f^{(i)}}{\\partial w_{j}}} = \\frac{1}{m}\\\
  sum\\limits_{i = 1}^{m}\\delta^{(i)} \\times 1 \\times x_{j}^{(i)}} \\\\\n& {= \\\
  frac{1}{m}\\sum\\limits_{i = 1}^{m}{(f^{(i)} - y^{(i)})x_{j}^{(i)}} = \\frac{1}{m}\\\
  sum\\limits_{i = 1}^{m}(f_{\\pmb{w}}(x^{(i)}) - y^{(i)})x_{j}^{(i)}}\n\\end{matrix}\n\
  $$\n\n右侧公式中除系数外的值可视为两个向量的点积：\n\n$$\n\\begin{matrix}\n{\\sum\\limits_{i = 1}^{m}(f_{\\\
  pmb{w}}(x^{(i)}) - y^{(i)})x_{j}^{(i)}} & {= \\begin{pmatrix} {f_{\\pmb{w}}(x^{(1)})\
  \ - y^{(1)}} & {f_{\\pmb{w}}(x^{(2)}) - y^{(2)}} & \\cdots & {f_{\\pmb{w}}(x^{(m)})\
  \ - y^{(m)}} \\end{pmatrix}\\begin{pmatrix} x_{j}^{(1)} \\\\ x_{j}^{(2)} \\\\ \\\
  vdots \\\\ x_{j}^{(m)} \\end{pmatrix}} \\\\\n& {= \\begin{pmatrix} x_{j}^{(1)} &\
  \ x_{j}^{(2)} & \\cdots & x_{j}^{(m)} \\end{pmatrix}\\begin{pmatrix} {f_{\\pmb{w}}(x^{(1)})\
  \ - y^{(1)}} \\\\ {f_{\\pmb{w}}(x^{(2)}) - y^{(2)}} \\\\ \\vdots \\\\ {f_{\\pmb{w}}(x^{(m)})\
  \ - y^{(m)}} \\end{pmatrix}} \\\\\n& {= \\begin{pmatrix} x_{j}^{(1)} & x_{j}^{(2)}\
  \ & \\cdots & x_{j}^{(m)} \\end{pmatrix}\\begin{pmatrix} {x^{(1)}\\pmb{w} - y^{(1)}}\
  \ \\\\ {x^{(2)}\\pmb{w} - y^{(2)}} \\\\ \\vdots \\\\ {x^{(m)}\\pmb{w} - y^{(m)}}\
  \ \\end{pmatrix}} \\\\\n& {= X_{:,j}^{T}(X\\pmb{w} - y)}\n\\end{matrix}\n$$\n\n\
  其中，`X_{:,j}^T` 是 `X` 矩阵第 `j` 列的转置（即所有样本的第 `j` 个特征）。因此，偏导数 $\\frac{\\partial{LL(\\\
  pmb{w})}}{\\partial w_{j}}$ 可写成向量形式：\n\n$$\n\\frac{\\partial{L(\\pmb{w})}}{\\partial\
  \ w_{j}} = \\frac{1}{m}X_{:,j}^{T}(X\\pmb{w} - y)\n$$\n\n因为关于 `w` 的梯度 `L(w)` 的列向量形式为：\n\
  \n$$\n\\nabla L(\\pmb{w}) = (\\frac{\\partial{L(\\pmb{w})}}{\\partial w_{1}},\\\
  cdots,\\frac{\\partial{L(\\pmb{w})}}{\\partial w_{j}},\\cdots)^{T} = \\frac{1}{m}X^{T}(X\\\
  pmb{w} - y)\n$$\n\n可以检验矩阵乘法各维度边界是否一致：\n\n∇`L(w)` = `X^T` (`X` `w` − `y`)\n\n`n`\
  \ × 1   `n` × `m`  (`m` × `n`  `n` × 1  `m` × 1)\n\n对于上述示例，可直接使用此公式计算损失函数关于 `w`\
  \ 的梯度：\n\n```python\ny = np.array([2.3, 1.7])\n(1/len(y))*X.transpose() @ (X@w-y)\
  \  # or: (1/m)*X.T @ (X@W-y)\n```\n\n```\narray([ 19.3 , 144.95, 76.8 ])\n```\n\n\
  令梯度 ∇`L(w)` = 0，得到法方程：\n\n`X^T`(`X``w` − `y`) = 0\n\n根据法方程，可得 `w`：\n\n`w` = (`X^T``X`)^(-1)`X^T``y`\n\
  \n###### 2. 拟合平面\n\n以下代码生成一组从平面 `z` = 2`x` + 3`y` + `c` 采样的数据点样本，每个数据样本由 (`x`, `y`)\
  \ 表征，其目标值是该点在平面上对应的 `z` 值加上噪声：\n\n```python\nimport matplotlib.pyplot as plt\nfrom\
  \ mpl_toolkits.mplot3d import Axes3D\nimport numpy as np\n\nn_points = 20\n\na =\
  \ 3\nb = 2\nc  = 5\nx_range = 5\ny_range = 5\nnoise = 3\n\nxs = np.random.uniform(-x_range,\
  \ x_range, n_points)\nys = np.random.uniform(-y_range, y_range, n_points)\nzs =\
  \ xs*a + ys*b + c + np.random.normal(scale=noise)\n\n#-----Draw the plane-------------\n\
  # Create grid points xx,yy\nxx, yy = np.meshgrid([x for x in range(-x_range, x_range+1)],\
  \ [y for y in range(-y_range, y_range+1)])\n# Calculate the z value zz corresponding\
  \ to the grid point (xx, yy)\nzz = a * xx + b * yy + c\n# draw the surface\nplt3d\
  \ = plt.figure().gca(projection='3d')\nplt3d.plot_surface(xx, yy, zz, alpha=0.2)\n\
  \n#-----Plot data points-------------\nax = plt.gca()\n\nax.scatter(xs, ys, zs,\
  \ color='b')\nax.set_xlabel('x')\nax.set_ylabel('y')\nax.set_zlabel('z')\n\nplt.show()\n\
  ```\n\n![](img/file46.png)\n\n**Figure 3-11** 三维空间采样的二维平面数据集\n\n使用上述样本点求解法方程拟合一个平面，并用拟合函数计算原始数据点\
  \ (`xs`, `ys`) 的预测值 `zs2`，然后显示原始数据点和拟合数据点，以及原始平面和拟合平面，可以看到拟合效果很好。\n\n```python\n\
  # fit a plane\nX = np.hstack((xs[:, None], ys[:, None]))\nX = np.hstack((np.ones((len(xs),\
  \ 1), dtype=xs.dtype), xs[:, None], ys[:, None]))\ny = zs\n\n# Compute the normal\
  \ equation\nXT = X.transpose()\nXTy = XT @ y\nw = np.linalg.inv(XT@X) @ XTy\n\n\
  # Calculate the fitting error\nerrors = y - X@w\nresidual = np.linalg.norm(errors)\n\
  \nprint(\"Fitted plane equation:\")\nprint(\"z = %f x + %f y + %f\" % (w[1], w[2],\
  \ w[0]))\nprint(\"residual:\", residual)\n\n# draw the fitted plane\nxlim = ax.get_xlim()\n\
  ylim = ax.get_ylim()\nxx2, yy2 = np.meshgrid(np.arange(xlim[0], xlim[1]),\n    \
  \              np.arange(ylim[0], ylim[1]))\nzz2 = w[1] * xx2 + w[2] * yy2 + w[0]\n\
  \nzs2 = w[1] * xs + w[2] * ys + w[0]\n#ax.plot_wireframe(xx,yy,zz, color='k')\n\
  plt3d = plt.figure().gca(projection='3d')\nplt3d.plot_surface(xx, yy, zz, alpha=0.5)\n\
  plt3d.plot_wireframe(xx2, yy2, zz2, color='k', alpha=0.2)\n\nax = plt.gca()\nax.scatter(xs,\
  \ ys, zs, color='b')\nax.scatter(xs, ys, zs2, color='r')\nax.set_xlabel('x')\nax.set_ylabel('y')\n\
  ax.set_zlabel('z')\nplt.show()\n```\n\n```\n    Fitted plane equation:\n    z =\
  \ 3.000000 x + 2.000000 y + 5.257362\n    residual: 1.5379794977104662e-14\n```\n\
  \n![](img/file47.png)\n\n**Figure 3-12** 拟合平面\n\n当样本数量大或样本特征多时，法方程需要求逆矩阵，耗时较长。因此一般采用迭代法求解方程组，最典型的迭代法是**梯度下降法**。\n\
  \n以下是用 NumPy 向量运算实现的梯度下降算法：\n\n```python\nlearning_rate = 0.02\nnum_iters = 100\n\
  X = np.hstack((xs[:, None], ys[:, None]))\nw, cost_history = gradient_descent_vec(X,\
  \ y, learning_rate, num_iters)\nprint(\"w:\", w)\nprint(cost_history[:5])\n\nplt.plot(cost_history,\
  \ linewidth=2)\nplt.title(\"Gradient descent with learning rate = \" + str(learning_rate),\
  \ fontsize=16)\nplt.xlabel(\"number of iterations\", fontsize=14)\nplt.ylabel(\"\
  cost\", fontsize=14)\nplt.grid()\nplt.show()\n```\n\n```\n    w: [5.2574307 3.00002524\
  \ 1.99999406]\n    [67.35604162168268, 50.488263686179806, 29.597233252531048, 15.413911756207108,\
  \ 10.830666806860211]\n```\n\n![](img/file48.png)\n\n```python\ndef gradient_descent_vec(X,\
  \ y, alpha, num_iters, gamma=0.8, epsilon=1e-8):\n    history = []             \
  \  # Record the parameters in the iteration process\n    X = np.hstack((np.ones((X.shape[0],\
  \ 1), dtype=X.dtype), X))  # Add a column of features 1\n    num_features = X.shape[1]\n\
  \    v = np.zeros(num_features)\n    w = np.zeros(num_features)\n    for n in range(num_iters):\n\
  \        predictions = X @ w       # Find the predicted value of the hypothesis\
  \ function, i.e. f(x)\n        errors = predictions - y         # The error between\
  \ the predicted value and the real value\n        gradient = X.transpose() @ errors\
  \ / len(y)         # calculate the gradient\n        if np.max(np.abs(gradient))\
  \ < epsilon:\n            print(\"gradient is small enough!\")\n            print(\"\
  iterated num is :\", n)\n            break\n        # w -= alpha * gradient # Update\
  \ the parameters of the model\n        v = gamma * v + alpha * gradient\n      \
  \  w = w - v\n        history.append(w)\n    return history                  # return\
  \ the history of optimized parameters\n```\n\n\n\n\n在上述代码中，特征 1 被添加到输入数据 `X` 的每个数据特征\
  \ `X[i]` 中。因此，调用此函数时，只需传递输入数据本身的特征即可。以下代码测试梯度下降法的向量版本，以拟合上述平面数据：\n\n```\nlearning_rate\
  \ = 0.02\nnum_iters = 100\nX = np.hstack((xs[:, None], ys[:, None]))\nhistory =\
  \ gradient_descent_vec(X, y, learning_rate, num_iters)\nprint(\"w:\", history[-1])\n\
  ```\n\n```\nw: [5.2574307 3.00002524 1.99999406]\n```\n\n根据 `history` 中记录的迭代过程中的模型参数，计算每次迭代过程中模型参数对应的假设函数在训练数据集上的平均损失：\n\
  \n```\ndef compute_loss_history(X, y, w_history):\n    loss_history = []\n    for\
  \ w in w_history:\n        errors = X @ w[1:] + w[0] - y\n        loss_history.append((errors\
  \ ** 2).mean() / 2)\n    return loss_history\n```\n\n```\nloss_history = compute_loss_history(X,\
  \ y, history)\nprint(loss_history[:-1:10])\nplt.plot(loss_history, linewidth=2)\n\
  plt.title(\"Gradient descent with learning rate = \" + str(learning_rate), fontsize=16)\n\
  plt.xlabel(\"number of iterations\", fontsize=14)\nplt.ylabel(\"cost\", fontsize=14)\n\
  plt.grid()\nplt.show()\n```\n\n```\n[50.488263686179806, 4.228316318122407, 0.25447029668776583,\
  \ 0.013353012122347907, 0.005607394691562173, 0.0004965791382370437, 5.787738027991273e-05,\
  \ 7.432016613222019e-06, 6.995869865807676e-07, 1.9291969094070538e-08]\n```\n\n\
  ![](img/file49.png)\n\n**图 3-13 损失曲线**\n\n可以看到，获得了相同的良好拟合结果。\n\n#### 3. 温度与压力问题\n\
  \n让我们看一个简单的温度与压力问题。大气中的压力和温度（在气体中）是相关的。如果给定一组（温度、压力）数据，能否用模型从温度预测压力（反之亦然）？\n\n如果温度和压力数据放在\
  \ CSV 格式文件 `data.csv` 中，可以使用 pandas 包的 `read_csv()` 从文件读取数据：\n\n```\nimport numpy\
  \ as np\nimport matplotlib.pyplot as plt\nimport pandas as pd\n\ndata = pd.read_csv('data.csv',\
  \ delimiter=',')  # delimiter 表示分隔符是什么\ndata\n```\n\n![](img/file50.png)\n\n```\n\
  X = data.values[:, 1:2]\ny = data.values[:, 2]\nprint(X)\nprint(y)\n```\n\n```\n\
  [[ 0.]\n [20.]\n [ 40.]\n [60.]\n [ 80.]\n [100.]]\n[2.0e-04 1.2e-03 6.0e-03 3.0e-02\
  \ 9.0e-02 2.7e-01]\n```\n\n调用 `gradient_descent_vec()` 进行线性回归：\n\n```\nhistory =\
  \ gradient_descent_vec(X, y, 0.00005, 50)\nw = history[-1]\nprint(\"w:\", w)\n```\n\
  \n```\nw: [-0.00016333 0.00165672]\n```\n\n绘制代价曲线和测试的预测值：\n\n```\ndef plot_history_predict(X,\
  \ y, w, loss_history, fig_size=(12, 4)):\n    fig = plt.gcf()\n    fig.set_size_inches(fig_size[0],\
  \ fig_size[1], forward=True)\n\n    plt.subplot(1, 2, 1)\n    plt.plot(loss_history)\n\
  \n    X = np.hstack((np.ones((X.shape[0], 1), dtype=X.dtype), X))  # 添加一列特征 1\n\
  \    x = X[:, 1]\n\n    predicts = X @ w\n    plt.subplot(1, 2, 2)\n    plt.scatter(x,\
  \ predicts)  # , marker=\"x\", c=\"red\"\n\n    indices = x.argsort()\n    sorted_x\
  \ = x[indices[::-1]]\n    sorted_predicts = predicts[indices[::-1]]\n\n    plt.plot(sorted_x,\
  \ sorted_predicts, color='red')\n    # plt.plot(x, predicts, color='red')\n\n  \
  \  plt.scatter(x, y)  # , marker=\"x\", c=\"red\"\n    plt.show()\n```\n\n绘制损失函数曲线和训练样本的预测值：\n\
  \n```\nloss_history = compute_loss_history(X, y, history)\nplot_history_predict(X,\
  \ y, w, loss_history)\n```\n\n![](img/file51.png)\n\n**图 3-14 损失曲线和拟合直线**\n\n虽然获得了拟合温度与压力关系的最佳线性模型，但从图中可以看出，压力和温度并非线性关系，线性假设函数不是最佳选择。它们之间应存在非线性关系。很自然地，会想到使用多项式函数（如\
  \ 3 次多项式）来表示压力 `y` 与温度 `x` 之间的这种非线性关系。\n\n$$f(x) = w[3]x³ + w[2]x² + w[1]x + w[0]\
  \ = (1, x, x², x³)(w[0], w[1], w[2], w[3])^T$$\n\n从原始特征 `x` 出发，人为构造新特征 `x²`、`x³`，并将\
  \ 1 也作为一个特征，因此 `x` 可视为由 4 个特征组成的数据特征向量 `x = (1, x, x², x³)`。\n\n$$f(x; w) = (1,\
  \ x, x², x³)(w[0], w[1], w[2], w[3])^T = x w$$\n\n其中，`w` 是模型参数。\n\n首先生成包含 4 个特征（包括\
  \ 1）的数据：\n\n```\nX2 = np.hstack((X, X**2, X**3))\nprint(X2)\n```\n\n```\n[[0.00e+00\
  \ 0.00e+00 0.00e+00]\n [2.00e+01 4.00e+02 8.00e+03]\n [4.00e+01 1.60e+03 6.40e+04]\n\
  \ [6.00e+01 3.60e+03 2.16e+05]\n [8.00e+01 6.40e+03 5.12e+05]\n [1.00e+02 1.00e+04\
  \ 1.00e+06]]\n```\n\n随后实施梯度下降法，但发现损失函数持续快速增加直至无穷大，并未收敛。\n\n```\nhistory = gradient_descent_vec(X2,\
  \ y, 0.00005, 50)\nprint(\"w:\", history[-1])\n```\n\n```\nw: [nan nan nan nan]\n\
  \nD:\\Programs\\Anaconda3\\lib\\site-packages\\ipykernel_launcher.py:8: RuntimeWarning:\
  \ overflow encountered in matmul\nD:\\Programs\\Anaconda3\\lib\\site-packages\\\
  ipykernel_launcher.py:10: RuntimeWarning: overflow encountered in matmul\nD:\\Programs\\\
  Anaconda3\\lib\\site-packages\\ipykernel_launcher.py:8: RuntimeWarning: invalid\
  \ value encountered in matmul\n```\n\n这是因为数据的特征值均为较大数值，导致梯度过大，必须使用极小学习率，但过小的学习率会使算法收敛极其缓慢。解决此问题的方法是对数据特征进行归一化，使数据特征值落入较小的取值范围（如\
  \ `[0,1]` 或 `[-1,1]`）。\n\n### 3.1.10 数据归一化\n\n特征的归一化过程非常简单：首先计算所有样本关于该特征的平均值，然后计算所有样本该特征围绕平均值的离散程度（即标准差），最后将所有样本的该特征减去其均值并除以标准差。\n\
  \n$$x \\leftarrow \\frac{x - \\text{mean}(x)}{\\text{stddev}(x)}$$\n\n其中 `x` 是一组数字，`mean(x)`\
  \ 是 `x` 中数字的平均值，`stddev(x)` 是 `x` 中数字的标准差（均方差）。例如，有一组特征值：{-5, 6, 9, 2, 4}，其平均值为：\n\
  \n```\nmean = (-5 + 6 + 9 + 2 + 4) / 5 = 3.2\n```\n\n从所有特征值中减去该平均值得到偏差，并计算这些偏差的平方：\n\
  \n$$\n\\begin{matrix}\n(-5 - 3.2)² = 67.24 \\\\\n(6 - 3.2)² = 7.84 \\\\\n(9 - 3.2)²\
  \ = 33.64 \\\\\n(2 - 3.2)² = 1.44 \\\\\n(4 - 3.2)² = 0.64\n\\end{matrix}\n$$\n\n\
  然后，计算标准差 `stddev`：\n\n$$\\text{stddev} = \\sqrt{(67.24 + 7.84 + 33.64 + 1.44 + 0.64)/5}\
  \ = 4.71$$\n\n对于之前的 `X2`，可以使用以下代码计算每个特征的均值（`mean`）和均方差（`stddev`）：\n\n```\nmean =\
  \ np.mean(X2, axis=0)\nstddev = np.std(X2, axis=0)\nprint(mean)\nprint(stddev)\n\
  X2 = (X2 - mean) / stddev\nprint(X2)\n```\n\n```\n[5.00000000e+01 3.66666667e+03\
  \ 3.00000000e+05]\n[3.41565026e+01 3.55840164e+03 3.58924319e+05]\n[[-1.46385011\
  \ -1.03042518 -0.8358308 ]\n [-0.87831007 -0.91801516 -0.81354198]\n [-0.29277002\
  \ -0.5807851  -0.65752023]\n [ 0.29277002 -0.018735   -0.23403262]\n [ 0.87831007\
  \  0.76813514  0.59065376]\n [ 1.46385011  1.77982532  1.95027186]]\n```\n\n\n\n\
  当然，上述用于归一化数据的代码可以简化为一行代码：\n\n```\nX = nd.array((X - X.mean(axis=0)) / X.std(axis=0))\n\
  ```\n\n对于归一化后的数据，可以使用相对较大的学习率：\n\n```\nalpha = 0.5\niterations = 50\nhistory = gradient_descent_vec(X2,y,alpha,iterations)\n\
  print(\"w:\",history[-1])\nloss_history = compute_loss_history(X2,y,history)\nprint(loss_history[:-1:len(loss_history)//10])\n\
  print(loss_history[0],loss_history[-1])\n```\n\n```\n    w: [ 0.06599642 -0.03288084\
  \ 0.0025919 0.12124727]\n    [0.0019130770858765333, 0.0013145145645564675, 0.0007023606943790882,\
  \ 0.00027800040087589485, 0.00011132563333752004, 8.37 1800511119992e-05, 8.245141141123992e-05,\
  \ 7.874110806074924e-05, 7.480832887073949e-05, 7.196043525563033e-05]\n    0.0019130770858765333\
  \ 7.023862601858041e-05\n```\n\n可以看出，损失函数的损失从 0.0019130770858765333 降到了 7.023862601858041e-05，并绘制了损失函数曲线和拟合多项式曲线。当然，读者可以调整学习率和迭代次数以进一步减小损失误差。\n\
  \n```\nplot_history_predict(X2,y,history[-1],loss_history)\n```\n\n![](img/file52.png\
  \ \"fig:\")  \n\n图 3-15 损失曲线和拟合多项式曲线\n\n从训练样本的最终预测结果可以看出，模型函数能更好地拟合训练数据。\n\n关于温度和压力问题的解释：应根据问题数据的特点选择合适的假设函数。如果假设函数不能很好地拟合数据，可以考虑在现有特征的基础上构造人工特征。此外，数据的特征值应处于相对较小的归一化范围内，例如将数据的特征归一化到均值为\
  \ 0、方差为 1 的范围。\n\n## 3.2 模型的评估\n\n### 3.2.1 欠拟合与过拟合\n\n当机器学习的假设函数（统计模型）过于简单，无法充分表达样本数据特征与目标值之间的关系时，无论怎么训练，得到的模型函数都无法很好地预测，即输入数据特征得到的预测值与实际值之间的误差会很大。模型函数不能很好地拟合训练数据，这称为**欠拟合**（Underfitting）。例如，对于上述温度和压力问题，如果用线性函数表示温度与压力的关系，最后得到的线性函数拟合误差会非常大。当人工添加特征并用\
  \ 3 次多项式表示温度与压力的关系时，可以更好地拟合训练数据，损失函数的误差值从 0.06623333 降低到 5.489e-5，因为 3 次多项式比 1 次线性多项式具有更强的表达能力。\n\
  \n那么，用更复杂的函数来表示数据特征与目标值之间的关系是否更好呢？\n\n以下代码在正弦曲线周围随机采样一些坐标点 (x,y)：\n\n```\n#https://github.com/ctgk/PRML/blob/master/notebooks/ch01_Introduction.ipynb\n\
  import numpy as np\nimport matplotlib.pyplot as plt\n%matplotlib inline\n\nnp.random.seed(896)\n\
  \ndef sample(n_samples,std = 0.25):\n    x = np.sort(np.random.uniform(0,1,n_samples))\n\
  \    y = np.sin(2*np.pi*x) + np.random.normal(scale = std, size=x.shape)\n    return\
  \ x,y\n    \nn_samples = 10\nx,y = sample(n_samples)\n#x = np.sort(np.random.uniform(0,1,n_samples))\n\
  #y = np.sin(2*np.pi*x) + np.random.normal(scale = 0.25, size=x.shape)\n\nx_test\
  \ =  np.linspace(0, 1, 100)\nxx = x_test\ny_test = np.sin(2*np.pi*x_test)\nplt.plot(x_test,\
  \ y_test, c=\"g\", label=\"$\\sin(2\\pi x)$\")\nplt.scatter(x, y,facecolor=\"none\"\
  , edgecolor=\"b\", s=50, label=\"training data\")\nplt.show()\n```\n\n![](img/file53.png\
  \ \"fig:\")  \n\n图 3-16 采样正弦曲线\n\n用不同次数 K 的多项式拟合这些样本点 (x,y)，并用正规方程法求解模型函数：\n\n```\n\
  for i, K in enumerate([0, 1, 3, 9]):\n    plt.subplot(2, 2, i + 1)\n    X = np.array([np.power(x,k)\
