  \nx = np.random.randn(5,2)\ny = np.random.randint(3, size=5)\n\nf = nn.forward(x)\n\
  dZ = cross_entropy_grad(f,y)  #util.grad_softmax_cross_entropy(f,y) #\nnn.zero_grad()\
  \                            # Gradient reset to zero\nreg = 0.1\ndx =  nn.backward(dZ,reg)\n\
  \n#-----Calculate the numerical gradient-----------\nparams = nn.parameters()\n\
  nn_params=[]\nfor i in range(len(params) ):    \n    nn_params.append(params[i][0])\n\
  \    \ndef loss_fn():\n    f = nn.forward(x)\n    loss =  softmax_cross_entropy(f,y)\
  \ #util.softmax_cross_entropy(f,y) # \n    return loss+nn.reg_loss(reg)\n\nnumerical_grads\
  \ = util.numerical_gradient(loss_fn,nn_params,1e-6)\nfor i in range(len(numerical_grads)):\n\
  \    print(diff_error(params[i][1],numerical_grads[i]))\n```\n\n```\n1.892395698905401e-06\n\
  1.7651393552515298e-06\n2.306498772862026e-06\n2.3545204992835373e-10\n```\n\n可以看出数值梯度和解析梯度非常接近，初步判定模型的\
  \ `forward()` 和 `backward()` 没有问题。\n\n### 4.3.8 独立参数优化器\n\n为了便于使用不同的梯度下降优化策略更新模型参数，可以将它们编写为单独的类，例如：\n\
  \n\n\n\n\n#### SGD 优化器实现\n\n```python\nclass SGD():\n    def __init__(self, model_params,\
  \ learning_rate=0.01, momentum=0.9):\n        self.params, self.lr, self.momentum\
  \ = model_params, learning_rate, momentum\n        self.vs = []\n        for p,\
  \ grad in self.params:\n            v = np.zeros_like(p)\n            self.vs.append(v)\n\
  \        \n    def zero_grad(self):        \n        for i, _ in enumerate(self.params):\
  \           \n            self.params[i][1].fill(0) \n                \n    def\
  \ step(self):   \n        for i, _ in enumerate(self.params):     \n           \
  \ p, grad = self.params[i]           \n            self.vs[i] = self.momentum *\
  \ self.vs[i] + self.lr * grad             \n            self.params[i][0] -= self.vs[i]\
  \ \n      \n    def scale_learning_rate(self, scale):\n        self.lr *= scale\n\
  ```\n\n优化器类 `SGD` 的构造函数参数 `model_params` 是一个 Python 列表对象，每个元素都是模型参数及其梯度的列表对象。如果模型有\
  \ 2 个参数 `W`、`b`，其对应的梯度参数分别为 `dW`、`db`，则 `model_params` 参数形式如下：\n\n```\n[[W, dW],\
  \ [b, db]]\n```\n\n构造函数的另外两个参数分别是梯度下降算法的学习率 `learning_rate` 和动量优化策略的参数 `momentum`。若将\
  \ `momentum` 设为 0，则等价于不带动量的最基本梯度更新策略。\n\n`SGD` 的 `zero_grad()` 方法用于将所有参数对应的梯度重置为\
  \ 0，`step()` 方法用于根据梯度和优化策略更新模型参数。梯度下降法在迭代过程中有时需要调整学习率，`scale_learning_rate()` 即为调整学习率的方法。\n\
  \n通过定义 `SGD` 类的优化器对象 `optimizer` 即可使用梯度下降法更新模型参数：\n\n```python\nlearning_rate =\
  \ 1e-1\nmomentum = 0.9\noptimizer = SGD(nn.parameters(), learning_rate, momentum)\n\
  ```\n\n同理，也可定义其他优化器类，例如以下 `Adam` 优化器：\n\n```python\nclass Adam():\n    def __init__(self,\
  \ model_params, learning_rate=0.01, beta_1=0.9, beta_2=0.999, epsilon=1e-8):\n \
  \       self.params, self.lr = model_params, learning_rate\n        self.beta_1,\
  \ self.beta_2, self.epsilon = beta_1, beta_2, epsilon\n        self.ms = []\n  \
  \      self.vs = []\n        self.t = 0\n        for p, grad in self.params:\n \
  \           m = np.zeros_like(p)\n            v = np.zeros_like(p)\n           \
  \ self.ms.append(m)\n            self.vs.append(v)\n        \n    def zero_grad(self):\
  \        \n        for i, _ in enumerate(self.params):\n            self.params[i][1].fill(0)\
  \ \n                \n    def step(self):   \n        beta_1, beta_2, lr = self.beta_1,\
  \ self.beta_2, self.lr\n        self.t += 1\n        t = self.t\n        for i,\
  \ _ in enumerate(self.params):     \n            p, grad = self.params[i]      \
  \ \n            \n            self.ms[i] = beta_1 * self.ms[i] + (1 - beta_1) *\
  \ grad\n            self.vs[i] = beta_2 * self.vs[i] + (1 - beta_2) * grad**2 \n\
  \            \n            m_1 = self.ms[i] / (1 - np.power(beta_1, t))\n      \
  \      v_1 = self.vs[i] / (1 - np.power(beta_2, t))  \n            self.params[i][0]\
  \ -= lr * m_1 / (np.sqrt(v_1) + self.epsilon)\n      \n    def scale_learning_rate(self,\
  \ scale):\n        self.lr *= scale\n```\n\n更多优化器及以下训练函数 `train_nn` 均包含在 `train.py`\
  \ 中。\n\n#### 训练函数 `train_nn`\n\n训练函数 `train_nn()` 接受一个数据迭代器，每次从中取出一批训练样本（输入 `input`、目标\
  \ `target`）。对每批样本，先执行 `forward()` 计算输出，再用损失函数计算其损失及关于输出 `output` 的梯度 `loss_grad`，再通过\
  \ `backward()` 函数将梯度 `loss_grad` 反向传播，得到模型参数和中间变量的梯度。最后使用优化器的 `step()` 函数更新模型参数。\n\
  \n```python\ndef train_nn(nn, X, y, optimizer, loss_fn, epochs=100, batch_size=50,\
  \ reg=1e-3, print_n=10):\n    iter = 0\n    losses = [] \n    for epoch in range(epochs):\n\
  \        for X_batch, y_batch in data_iter(X, y, batch_size):     \n           \
  \ optimizer.zero_grad()      \n            \n            f = nn(X_batch)  # nn.forward(X_batch)\
  \      \n            loss, loss_grad = loss_fn(f, y_batch)       \n            nn.backward(loss_grad,\
  \ reg)               \n            loss += nn.reg_loss(reg)\n          \n      \
  \      optimizer.step()\n            \n            losses.append(loss)         \
  \   \n            if iter % print_n == 0:\n                print(iter, \"iter:\"\
  , loss)\n            iter += 1          \n\n    return losses\n```\n\n现在可以用该神经网络训练前面的\
  \ 3 个分类问题：\n\n```python\nimport data_set as ds\nimport util\n\nnp.random.seed(1)\n\
  nn = NeuralNetwork()\nnn.add_layer(Dense(2, 100, ('no', 0.01)))\nnn.add_layer(Relu())\n\
  nn.add_layer(Dense(100, 3, ('no', 0.01)))\n\nX, y = ds.gen_spiral_dataset()\nepochs\
  \ = 5000\nbatch_size = len(X)\nreg = 0.5e-3\nprint_n = 480\n\nlearning_rate = 1e-1\n\
  momentum = 0.5\noptimizer = SGD(nn.parameters(), learning_rate, momentum)\n\nlosses\
  \ = train_nn(nn, X, y, optimizer, cross_entropy_grad_loss, epochs, batch_size, reg,\
  \ print_n)\n\nimport matplotlib.pylab as plt\n%matplotlib inline\nplt.plot(losses)\n\
  plt.show()\n```\n\n```\n0 iter: 1.0985916677722303\n480 iter: 0.7056240023920841\n\
  960 iter: 0.6422407772314334\n1440 iter: 0.5246104670488081\n1920 iter: 0.4186441561530432\n\
