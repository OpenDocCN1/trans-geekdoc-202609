  \ = e^x` 定义的一些坐标点\n\n线性函数 `y = 2x` 和指数函数 `e^x` 的函数值（因变量）都随着 `x` 的增加而增加，但指数函数增长非常快。人们常说某量呈指数级增长，意指该量增长极快。\n\
  \n#### 1.3.2 四则运算与复合运算\n\n复杂函数可以通过简单函数的四则运算和复合运算来构建。\n\n##### 四则运算\n\n四则运算是指对两个函数进行加、减、乘、除运算以构建新函数的过程。如果有两个函数\
  \ `f(x)`、`g(x)`，这两个函数分别将 `x` 变换为 `f(x)`、`g(x)`：\n\n`f : x → f(x)`  \n\n`g : x →\
  \ g(x)`\n\n如果定义一个新的变换关系，将每个 `x` 变换为 `f(x) + g(x)`，那么这就是一个新的函数关系：\n\n`x → f(x) +\
  \ g(x)`\n\n这个新函数：`x → f(x) + g(x)` 称为原两个函数的**和函数**。\n\n例如：`y = x²` 和 `y = e^x` 可以通过加法生成新函数\
  \ `y = x² + e^x`。对于 `x = 2`，该新函数的函数值为 `y = 2² + e² = 4 + e²`。\n\n以下代码绘制这 3 个函数的曲线：\n\
  \n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\n%matplotlib inline\
  \ \n\nx = np.arange(-2, 2, 0.1) #\ny = x**2 \ny2 = np.exp(x) \ny3 = x**2 + np.exp(x)\
  \ \n\nplt.plot(x, y)\nplt.plot(x, y2) \nplt.plot(x, y3) \nplt.legend(['$x²$','$e^x$','$x²+e^x$'])\n\
  \nfig = plt.gcf()\nfig.set_size_inches(4, 4, forward=True)\n#plt.axis('equal')\n\
  plt.xlim([-3,3])\nplt.show() \n```\n\n![](img/file15.png \"fig:\")  \n\n**图 1-22**\
  \ 函数 `x²` 和 `e^x` 及其和函数 `x² + e^x` 的曲线\n\n同样，可以通过 `-`、`*`、`/` 构造差函数 `f(x) - g(x)`、积函数\
  \ `f(x) * g(x)` 和两个函数的商函数 `f(x)/g(x)`。\n\n##### 复合运算\n\n由于函数是一种变换或输入输出装置，将一个量 `x`\
  \ 输入函数 `g` 会产生输出 `g(x)`，再将这个 `g(x)` 作为另一个函数 `f` 的输入，产生 `f(g(x))`。\n\n`x → g → g(x)\
  \ → f → f(g(x))`\n\n将一个函数的输出作为另一个函数的输入，构成了一个新的变换或新函数。这个新函数是由原始的两个函数 `g` 和 `f` 通过变换串联形成的复合函数，可记为\
  \ `f ∘ g : x → f(g(x))`，即 `f ∘ g(x) = f(g(x))`。\n\n\n\n\n\n例如，`g(x) = -x`，`f(x)\
  \ = e^x`，则 `f ∘ g(x) = f(g(x)) = e^(-x)`。另一个例子是 `g(x) = e^x`，`f(x) = x²`，则 `f ∘\
  \ g(x) = f(g(x)) = (e^x)²`。复合函数的计算代码如下：\n\n```\ny = np.exp(x)**2\n```\n\n函数 `e^(-x)`、`e^(x²)`\
  \ 的曲线如图所示：\n\n![](img/file223.png)\n\n图 1-23 函数 `e^(-x)` 和 `e^(x²)` 的曲线\n\nSigmoid\
  \ 函数 $\\sigma(x) = \\frac{1}{1 + e^{-x}}$ 是机器学习（深度学习）中常用的函数之一。它可以看作是两个常数函数 1 和函数\
  \ `1 + e^(-x)` 的商。函数 `1 + e^(-x)` 可以看作是常数函数 1 和函数 `e^(-x)` 的和。函数 `e^(-x)` 可以看作是函数\
  \ `e^z` 和 `z = -x` 的复合函数。`-x` 可以看作是常数函数 -1 和 x 的积。通过四则运算和复合运算，从简单的初等函数构建这个复杂函数的过程如图\
  \ 1-24 所示：\n\n![](img/file224.png)\n\n图 1-24 Sigmoid 函数 $\\sigma(x) = \\frac{1}{1\
  \ + e^{-x}}$ 的复合过程\n\n以下代码绘制 `σ(x)` 函数曲线：\n\n```\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\n%matplotlib inline\n\nx = np.arange(-7, 7, 0.1)\ny = 1 / (1 + np.exp(-x))\n\
  plt.plot(x, y)\n\nplt.legend(['\\frac{1}{1+e^{-x}}'])\nplt.xlabel('x')\nplt.ylabel('y')\n\
  plt.show()\n```\n\n![](img/file16.png \"fig:\")\n\n图 1-25 函数 `σ(x)` 的曲线\n\n可以看出，函数值在\
  \ `[0,1]` 区间内，且函数值 `f(x)` 随 `x` 的增加而增加，即该函数**单调递增**。如果在自变量的某个区间 I 内，任意两个数 `x[1]\
  \ < x[2]` 必有 `f(x[1]) < f(x[2])`，则称该函数为严格单调递增。同理，函数单调递减也可以类似定义。\n\n`σ(x)` 函数在 `x\
  \ = 0` 处的值为 $\\frac{1}{1 + e^{-x}} = 1/2 = 0.5$。当 `x` 趋向于正无穷，即 `x → ∞` 时，`e^(-x)`\
  \ 接近 0，即 `e^(-x) → 0`，因此 $\\frac{1}{1 + e^{-x}}$ 接近 `1/(1 + 0) = 1`。反之，当 `x → -∞`\
  \ 时，`e^(-x) → ∞`，因此 $\\frac{1}{1 + e^{-x}}$ 接近 `1/(1 + ∞) = 0`。为了描述变量趋向某个量（如 `x`\
  \ 趋向 0 或无穷）的行为，人们提出了极限的概念。\n\n#### 1.3.3 极限、导数\n\n##### 1. 数列的极限\n\n数列是一列有序的数，例如\
  \ `(1, 2, 3, 4)`，`(1, 1/2, 1/3, ⋯, 1/n, ⋯)`。数列中的元素形式称为**项数**。项数有限称为有限数列，项数无限称为无限数列。数列也是一个函数，它是从自然数的一个子集到值集合的映射，即其自变量是自然数，因变量是值。通常数列指无限数列，可以写作：\n\
  \n`a[1], a[2], a[3], ⋯, a[n], ⋯`\n\n极限描述的是一种无限逼近，例如无限数列 `{1, 1/2, 1/3, ⋯, 1/n, ⋯}`。当\
  \ `n` 不断增大时，数列对应的数如 `1/n` 会越来越小，越来越接近值 0，即无限逼近 0，或者说随着 `n` 无限增大，该数列逐渐收敛于 0。这个 0\
  \ 称为该数列的**极限**。所谓无限逼近，是指只要 `n` 足够大，`1/n` 与其极限值 0 的距离就足够小。换句话说，对于任意小的数如 `ϵ = 0.001`，总能找到一个\
  \ `n`，使得第 `n` 项之后数列中所有数与极限的距离都小于这个 `ϵ`。例如，`n=1000` 项之后，`|1/n - 0| < ϵ`。\n\n再如，可以证明数列\
  \ `{3 - 1, 3 - 1/2, 3 - 1/3, ⋯, 3 - 1/n, ⋯}` 的极限是 3。\n\n通常用符号 `lim` 表示极限：\n\n$\\\
  lim\\limits_{n \\rightarrow \\infty}{1/n} = 0$\n\n该公式表示左边的数列，当 `n` 趋向于无穷大（`n → ∞`）时，其极限值为\
  \ 0。\n\n数列可能没有极限；如果有极限，则极限必定是唯一的。\n\n##### 2. 函数的极限与连续性\n\n同样，可以定义函数 `f(x)` 在某点\
  \ `x[0]` 处的极限 $\\lim\\limits_{x \\rightarrow x_{0}}f(x)$，意指当 `x` 足够接近 `x[0]` 时，`f(x)`\
  \ 将足够接近这个极限。例如：\n\n$\\lim\\limits_{x \\rightarrow 3}x^{2} = 9$\n\n这意味着当自变量 `x` 足够接近\
  \ 3 时，因变量 `f(x)` 的值将足够接近 9，即 `f(x)` 的极限为 9。例如，存在一组接近 3 的自变量数列 `{3 - 1, 3 - 1/2,\
  \ 3 - 1/3, ⋯}`，对应的 `f(x)` 值数列 `{(3 - 1)², (3 - 1/2)², (3 - 1/3)², ⋯}` 趋近于 9。\n\n\
  如果函数在 `x[0]` 处的极限值存在，且等于函数在 `x[0]` 处的函数值，即 $\\lim\\limits_{x \\rightarrow x_{0}}f(x)\
  \ = f(x_{0})$，则称该函数在该点 `x[0]` 处**连续**。直观地说，`f(x)` 对应的曲线在 `x[0]` 处没有断开。\n\n如图 1-26\
  \ 所示，`f(x) = x²` 在任意自变量 `x` 处都是连续的，即函数曲线连续无断点，因此整个函数**连续**。函数 `f(x) = |x|` 也处处连续。而下面定义的\
  \ `f(x) = sign(x)` 在 `x = 0` 处不连续。\n\n$f(x) = \\text{sign}(x) = \\left\\{ \\begin{matrix}\
  \ {1,} & {x > 0} \\\\ {0,} & {x==0} \\\\ {-1,} & {x < 0} \\\\ \\end{matrix} \\right.$\n\
  \n![](img/file225.png)\n\n图 1-26 函数 `x²`、`|x|`、`sign(x)` 的曲线\n\n令 `Δx[0] = x - x[0]`，`Δf(x[0])\
  \ = f(x) - f(x[0])`，则 $\\lim\\limits_{x \\rightarrow x_{0}}f(x) = f(x_{0})$ 可表示为：$\\\
  lim\\limits_{\\Delta x_{0} \\rightarrow 0}\\Delta f(x_{0}) = 0$。函数在自变量 `x[0]` 处连续的含义是：当\
  \ `Δx[0]` 趋向于 0 时，`Δf(x[0])` 也趋向于 0。即 `Δf(x[0])` 随 `Δx[0]` 趋向于 0 而趋向于 0。\n\n#####\
  \ 3. 函数的导数\n\n函数 `y = f(x)` 在某点 `x` 处的连续性，是指因变量 `y = f(x)` 是否随自变量在该点附近的连续变化而连续变化。有时还需要进一步考察因变量随自变量变化的快慢。例如，用\
  \ `t` 表示时间，用 `s` 表示运动物体经过的路程。显然，`s` 随 `t` 连续变化，不会在某个时刻突然从一点跳跃到另一点。对于运动物体，有时我们更关心物体运动的快慢，即运动的速度。这段时间的平均运动速度可以用同一时间点内经过的路程来表示，例如从时刻\
  \ `t[0]` 到时刻 `t[0] + Δt`，这段时间 `t[0] + Δt - t[0]` 内经过的路程是 `s(t[0] + Δt) - s(t[0])`，它们的比值表示这段时间的平均运动速度：\n\
  \n$\\frac{s(t_{0} + \\Delta t) - s(t_{0})}{t_{0} + \\Delta t - t_{0}} = \\frac{s(t_{0}\
  \ + \\Delta t) - s(t_{0})}{\\Delta t}$\n\n\n\n\n\n###### 理解导数：从平均速度到瞬时变化率\n\n要理解某一时刻\
  \ $t_0$ 的精确速度，而非一段时间内的平均速度，可以计算当 $\\Delta x$ 趋近于 0 时的上述平均速度，即 $\\Delta x \\to 0$\
  \ 的极限值，将此极限值作为时间 $t_0$ 处的精确速度。\n\n$$\n\\lim_{\\Delta t \\to 0} \\frac{s(t_0 + \\\
  Delta t) - s(t_0)}{\\Delta t}\n$$\n\n在微积分中，上述极限值称为函数 $s(t)$ 在 $t_0$ 处的**导数**，记作\
  \ $s'(t_0)$ 或 $\\frac{ds}{dt}\\big|_{t_0}$，即：\n\n$$\ns'(t_0) = \\frac{ds}{dt}\\\
  bigg|_{t_0} = \\lim_{\\Delta t \\to 0} \\frac{s(t_0 + \\Delta t) - s(t_0)}{\\Delta\
  \ t}\n$$\n\n一般地，函数 $f(x)$ 在点 $x_0$ 处的导数 $f'(x_0)$ 定义为：\n\n$$\nf'(x_0) = \\lim_{\\\
  Delta x \\to 0} \\frac{\\Delta y}{\\Delta x} = \\lim_{\\Delta x \\to 0} \\frac{f(x_0\
  \ + \\Delta x) - f(x_0)}{\\Delta x}\n$$\n\n其中 $\\Delta x$ 是趋向于 0 的微小增量。$\\Delta\
  \ y = f(x_0 + \\Delta x) - f(x_0)$ 是因变量对应的增量。该导数表征了因变量 $y$ 相对于自变量 $x$ 在点 $x_0$ 处的变化快慢。$|f'(x_0)|$\
  \ 的绝对值越大，表示 $y$ 的变化越快。\n\n####### 导数计算示例\n\n以 $f(x) = x²$ 为例：\n\n**在 $x = 3$ 处的导数：**\n\
  \n$$\n\\begin{aligned}\nf'(3) &= \\lim_{\\Delta x \\to 0} \\frac{f(3 + \\Delta x)\
  \ - f(3)}{\\Delta x} = \\lim_{\\Delta x \\to 0} \\frac{(3 + \\Delta x)² - 3²}{\\\
  Delta x} \\\\\n&= \\lim_{\\Delta x \\to 0} (6 + \\Delta x) = 6\n\\end{aligned}\n\
  $$\n\n**在 $x = 1$ 处的导数：**\n\n$$\n\\begin{aligned}\nf'(1) &= \\lim_{\\Delta x \\\
  to 0} \\frac{f(1 + \\Delta x) - f(1)}{\\Delta x} = \\lim_{\\Delta x \\to 0} \\frac{(1\
  \ + \\Delta x)² - 1²}{\\Delta x} \\\\\n&= \\lim_{\\Delta x \\to 0} (2 + \\Delta\
  \ x) = 2\n\\end{aligned}\n$$\n\n**在 $x = 0$ 处的导数：**\n\n$$\n\\begin{aligned}\nf'(0)\
  \ &= \\lim_{\\Delta x \\to 0} \\frac{f(0 + \\Delta x) - f(0)}{\\Delta x} = \\lim_{\\\
  Delta x \\to 0} \\frac{(0 + \\Delta x)² - 0²}{\\Delta x} \\\\\n&= \\lim_{\\Delta\
  \ x \\to 0} \\Delta x = 0\n\\end{aligned}\n$$\n\n这表明：\n- 在 $x=0$ 时，$x$ 有微小增量 $\\\
  Delta x$，$y$ 的增量约为 0 倍，即 $y$ 几乎不变。\n- 在 $x=1$ 时，$x$ 增加微小增量 $\\Delta x$，$y$ 的增量约为其\
  \ 2 倍，即 $2\\Delta x$。\n- 在 $x=3$ 时，$x$ 有微小增量 $\\Delta x$，$y$ 的增量约为其 6 倍，即 $6\\Delta\
  \ x$。\n\n因此，导数表征了因变量 $y$ 相对于自变量 $x$ 变化的快慢。导数绝对值越大，意味着微小的 $x$ 增量能引起 $y$ 的剧烈变化；绝对值越小（接近\
  \ 0），意味着微小的 $x$ 增量引起的 $y$ 变化越小，即 $y$ 相对于 $x$ 变化缓慢，就像运动物体在时间变化时几乎静止一样。\n\n#######\
  \ 几何意义：割线斜率到切线斜率\n\n如图 1-27 所示：\n- a) 是函数 $y = x³$ 在 $x=1$ 处 $\\Delta x = 0.8$ 时的\
  \ $\\frac{\\Delta y}{\\Delta x}$，即两点 $(1, 1³)$ 和 $(1.8, 1.8³)$ 连线的斜率（割线斜率），代表该区间内因变量变化对自变量变化的平均速率。\n\
  - b) 给出了 $x=1$ 处 $\\Delta x = 0.8, 0.6, 0.4$ 时的 $\\frac{\\Delta y}{\\Delta x}$。\n\
  - c) 当 $\\Delta x \\to 0$ 时，该比值（斜率）收敛于曲线在 $x=1$ 处切线的斜率。\n\n![](img/file226.png)\n\
  \n**图 1-27** a) $x=1$ 处 $\\Delta x=0.8$ 的 $\\frac{\\Delta y}{\\Delta x}$；b) $x=1$\
  \ 处 $\\Delta x=0.8, 0.6, 0.4$ 的 $\\frac{\\Delta y}{\\Delta x}$；c) 当 $\\Delta x \\\
  to 0$ 时，该比值（斜率）收敛于曲线在 $x=1$ 处切线的斜率。\n\n####### 导函数\n\n若函数 $f(x)$ 在每一点 $x$ 处均存在导数\
  \ $f'(x)$，即每个 $x$ 对应一个导数值 $f'(x)$，则这种映射关系 $x \\to f'(x)$ 也是一种函数关系，称为原函数的**导函数**，记作\
  \ $f'(x)$。\n\n对上述 $f(x) = x²$，根据极限公式可得各点导数值：\n\n$$\n\\begin{aligned}\nf'(x) &= \\\
  lim_{\\Delta x \\to 0} \\frac{f(x + \\Delta x) - f(x)}{\\Delta x} = \\lim_{\\Delta\
  \ x \\to 0} \\frac{(x + \\Delta x)² - x²}{\\Delta x} \\\\\n&= \\lim_{\\Delta x \\\
  to 0} (2x + \\Delta x) = 2x\n\\end{aligned}\n$$\n\n即 $f(x) = x²$ 的导函数为 $f'(x) =\
  \ 2x$。\n\n根据定义，易求得以下基本初等函数的导函数：\n\n$$\n\\begin{aligned}\n&\\text{(1)}\\quad C' =\
  \ 0; \\qquad \\text{(2)}\\quad (x^n)' = n x^{n-1} \\quad (n \\in \\mathbb{Q}) \\\
  \\\n&\\text{(3)}\\quad (\\sin x)' = \\cos x; \\qquad \\text{(4)}\\quad (\\cos x)'\
  \ = -\\sin x \\\\\n&\\text{(5)}\\quad (a^x)' = a^x \\ln a; \\qquad \\text{(6)}\\\
  quad (e^x)' = e^x \\\\\n&\\text{(7)}\\quad (\\log_a x)' = \\frac{1}{x} \\log_a e;\
  \ \\qquad \\text{(8)}\\quad (\\ln x)' = \\frac{1}{x}\n\\end{aligned}\n$$\n\n####\
  \ 1.3.4 导数的四则运算与链式法则\n\n对每个可能遇到的函数都根据导数定义用极限计算导函数是不现实的。因为各种函数可以通过四则运算或函数复合构造而成。幸运的是，很容易证明由四则运算或函数复合构造的函数的导数，可以由构造它们的函数的导数来计算。\n\
  \n例如 $(f(x) + g(x))' = f'(x) + g'(x)$，即和函数的导数等于原两函数导数之和。根据导数的极限定义，易证由四则运算构造的函数的导数有如下计算公式：\n\
  \n**四则运算法则：**\n\n$$\n\\begin{aligned}\n(f(x) + g(x))' &= f'(x) + g'(x) \\\\\n(f(x)\
  \ - g(x))' &= f'(x) - g'(x) \\\\\n(f(x)g(x))' &= f'(x)g(x) + f(x)g'(x) \\\\\n\\\
  left(\\frac{f(x)}{g(x)}\\right)' &= \\frac{f'(x)g(x) - f(x)g'(x)}{g(x)²}\n\\end{aligned}\n\
  $$\n\n因为常数函数 $(f(x) = C)$ 的导数为 0，所以常数 $C$ 与函数 $f(x)$ 的乘积 $C f(x)$ 的导数为：\n\n$$\n\
  (C f(x))' = C' f(x) + C f'(x) = C f'(x)\n$$\n\n同理 $\\left(\\frac{f(x)}{C}\\right)'\
  \ = \\left(\\frac{1}{C}f(x)\\right)' = \\frac{1}{C}f'(x)$。常数 $C$ 与函数 $f(x)$ 的和 $(C\
  \ + f(x))' = C' + f'(x) = f'(x)$。\n\n**示例：** $(x² + \\sin x)' = (x²)' + (\\sin x)'\
  \ = 2x + \\cos x$。\n\n**链式法则：**\n\n由两个函数 $f(x)$ 和 $g(x)$ 复合而成的复合函数 $f(g(x))$，其导数与原函数导数有如下关系：\n\
  \n$$\n(f(g(x)))' = f'(g(x)) \\cdot g'(x)\n$$\n\n此复合函数的求导公式称为**链式法则**。求 $f(g(x))$\
  \ 的导数，是先求 $f$ 对 $g$ 的导数 $f'(g)$，再求 $g$ 对 $x$ 的导数 $g'(x)$，然后将两者相乘 $f'(g) \\cdot g'(x)$。如图\
  \ 1-28 所示。\n\n\n\n\n\n![](img/file227.png)\n\n**图 1-28** 复合函数链式求导法则示意图\n\n对于复合函数，输入一个变量\
  \ `x`，总是沿着函数的复合过程“从内到外”计算其函数值，即先计算 `g(x)`，再计算 `f(g(x))`，而计算最终函数值 `f(g(x))` 对输入 `x`\
  \ 的导数的过程则是相反的，先计算 `f'(g)`，再计算 `g'(x)`，然后将两者相乘。也就是说，求导过程是依次求出各个函数的导数“从外到内”。\n\n例如，`sin(x²)`\
  \ 是由函数 `f = sin(g)` 和 `g = x²` 复合而成的函数，因此，它的导数：\n\n`sin(x²)' = sin'(g) * g'(x) =\
  \ sin'(g) * (x²)' = cos(g) * (2x) = 2x * cos(x²)`\n\n同理，可以得到 `σ(x)` 函数的导数：\n\n$$\n\
  \\begin{matrix}\n\\sigma'(x) & = (\\frac{1}{1 + e^{-x}})' = \\frac{1' * (1 + e^{-x})\
  \ - 1 * (1 + e^{-x})'}{(1 + e^{-x})²} \\\\\n& = \\frac{- (1 + e^{-x})'}{(1 + e^{-x})²}\
  \ = \\frac{- 0 - (e^{-x})'}{(1 + e^{-x})²} = \\frac{- (e^{-x})(-x)'}{(1 + e^{-x})²}\
  \ \\\\\n& = \\frac{e^{-x}}{(1 + e^{-x})²} = \\frac{1 + e^{-x} - 1}{(1 + e^{-x})²}\
  \ = \\frac{1}{1 + e^{-x}} - \\frac{1}{(1 + e^{-x})²} \\\\\n& = \\frac{1}{1 + e^{-x}}(1\
  \ - \\frac{1}{1 + e^{-x}}) = \\sigma(x)(1 - \\sigma(x))\n\\end{matrix}\n$$\n\n下面的代码绘制\
  \ `σ'(x)` 的函数曲线：\n\n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\n\
  %matplotlib inline\n\ndef sigmoid(x):\n    return 1/(1+np.exp(-x))\n\nx = np.arange(-7,\
  \ 7, 0.1)\ny = sigmoid(x)\ndy = sigmoid(x)*(1-sigmoid(x))\n\nplt.plot(x, y)\nplt.plot(x,\
  \ dy)\n\nplt.legend(['$\\sigma(x)$','$\\sigma\\'(x)$'])\nplt.xlabel('x')\nplt.ylabel('y')\n\
  plt.show()\n```\n\n![](img/file17.png \"fig:\")\n\n**图 1-29** `σ(x)`、`σ'(x)` 的函数曲线\n\
  \n可以看出，`σ'(x)` 的函数曲线是一个钟形曲线，对所有 `x`，`σ'(x) > 0`，且在 `x=0` 处导数值最大。因为 `σ(0)(1 - σ(0))\
  \ = 0.5 * 0.5 = 0.25`，当 `x` 趋向无穷大时，导数值趋向于 0。导数值的大小表明函数值随自变量变化的快慢。因此，`σ(x)` 在 `x\
  \ = 0` 处变化最快，当趋向无穷大时，函数值的变化越来越慢。\n\n根据导数的定义，上述四则运算法则和复合函数链式求导法则很容易证明。感兴趣的读者可以自行证明或参考微积分教材。\n\
  \n#### 1.3.5 计算图、前向计算、反向传播求导\n\n通过四则运算和复合运算从简单函数构造出一个函数的过程，可以用上述图 1-29 表示，图中的节点表示四则运算或复合运算。该图也展示了输入自变量\
  \ `x` 给该函数计算函数值（函数输出）的过程。这个图称为**计算图**，根据形成该图的过程计算输入变量的输出函数值的过程称为**前向计算**。从图中可以看出，求导过程正好是前向计算过程的逆过程，因此称为**后向计算**或**反向传播计算**。\n\
  \n![](img/file228.png)\n\n**图 1-30** 前向计算（实线）与反向求导计算（虚线）示意图\n\n如图 1-30 所示，前向计算过程是从\
  \ `x` 经过函数 `g` 得到 `g(x) = x²`，再经过函数 `f` 得到 `f(g) = sin(g) = sin(x²)`。\n\n`x → g\
  \ → g(x) = x² → f → f(g) = sin(g) = sin(x²)`\n\n反向传播求导过程为：\n\n`f → f'(g) → f'(g)\
  \ = sin'(g) = cos(g)`\n\n`g → g'(x) → g'(x) = (x²)' = 2x`\n\n`f'(x) = f'(g) * g'(x)\
  \ = cos(g) * (x²)' = cos(g) * 2x = cos(x²) * 2x`\n\n反向传播求导是神经网络（深度学习）的核心且最关键的基础。如果理解了反向求导，就能轻松理解深度学习的算法原理。\n\
  \n#### 1.3.6 多元函数的偏导数与梯度\n\n有时自变量 `x` 是由多个分量组成的向量，而不是单个值，即 `x = (x[1], x[2], ...,\
  \ x[n])` 包含多个分量 `x[j]`。将这种自变量 `x` 映射为单个数值因变量的函数 `f(x)` 称为**多元函数**，可表示为 `f : ℝⁿ →\
  \ ℝ`。\n\n`f(x)` 对 `x` 的每个分量 `x[j]` 的导数称为偏导数，记作 `∂f/∂xⱼ`，它反映了 `f(x)` 关于该分量 `x[j]`\
  \ 的变化率。\n\n`∂f/∂xⱼ = lim(Δxⱼ→0) [f(x₁,...,xⱼ + Δxⱼ,...,xₙ) - f(x₁,...,xⱼ,...,xₙ)]\
  \ / Δxⱼ`\n\n也就是说，偏导数是将其他变量视为常数，将 `x[j]` 视为变量，这样该函数就是一元函数，它对 `x[j]` 的导数称为原函数对 `x[j]`\
  \ 的偏导数。\n\n例如，若 `f(x, y) = 2x + y²`，其自变量包含 2 个分量 `x` 和 `y`，该函数为多元函数，自变量 `(x, y)`\
  \ 映射为函数值 `f(x, y)`，即 `f : (x, y) → (2x + y²)`。该函数对 `x`、`y` 的偏导数为：\n\n`∂f/∂x = ∂(2x\
  \ + y²)/∂x = d(2x)/dx = 2`\n\n`∂f/∂y = ∂(2x + y²)/∂y = d(y²)/dy = 2y`\n\n`f(x)`\
  \ 对 `x` 的梯度 `∇ₓf(x)` 是 `f(x)` 对 `x` 的每个分量 `x[j]` 的偏导数组成的向量：\n\n`∇ₓf(x) = df/dx =\
  \ (∂f/∂x₁, ..., ∂f/∂xⱼ, ..., ∂f/∂xₙ) ∈ ℝⁿ`\n\n在上例中，`f(x, y) = 2x + y²` 关于 `(x, y)`\
  \ 的梯度 `∇₍ₓ,ᵧ₎f(x, y) = (2, 2y)`。在特定点 `(2,3)` 处的梯度为 `(2, 6)`。\n\n在不引起混淆的情况下，`f(x)`\
  \ 对 `x` 的梯度 `∇ₓf(x)` 常简写为 `∇f(x)`。\n\n对于 `x` 的一个微小增量 `Δx = (Δx[1], Δx[2], ..., Δx[n])`，`f(x)`\
  \ 的增量 `f(x + Δ) - f(x)` 可近似为梯度 `∇f(x)` 与 `x` 的增量 `Δx` 的点积。\n\n`f(x + Δ) - f(x) ≃\
  \ ∇f(x) ⋅ Δx`\n\n通常，梯度写成行向量的形式：\n\n`∇ₓf(x) = (∂f/∂x₁, ..., ∂f/∂xⱼ, ..., ∂f/∂xₙ)\
  \ ∈ ℝⁿ`\n\n而 `f(x)`、`x` 写成列向量的形式：\n\n$$\n\\begin{matrix}\nx = \\begin{bmatrix} x_1\
  \ \\\\ x_2 \\\\ \\vdots \\\\ x_n \\end{bmatrix}\n\\quad\n\\Delta x = \\begin{bmatrix}\
  \ \\Delta x_1 \\\\ \\Delta x_2 \\\\ \\vdots \\\\ \\Delta x_n \\end{bmatrix}\n\\\
  end{matrix}\n$$\n\n\n\n\n然后梯度向量与增量向量的点积可以写成矩阵乘积的形式：\n\n`f(xx + Δ) − f(xx) ≃ ∇f(xx)Δx\
  \ = Δxx^(T)∇ff(xx)^(T)`\n\n如果梯度也写成列向量，梯度向量与增量向量的点积可以写成矩阵乘积：\n\n`f(xx + Δ) − f(xx)\
  \ ≃ ∇f(xx)^(T)Δx = Δxx^(T)∇ff(xx)`\n\n如果自变量写成行向量形式，梯度写成列向量形式，即：\n\n`xx = (x[1],\
  \ x[2], ⋯, x[n])`\n\n`Δxx = (Δx[1], Δx[2], ⋯, Δx[n])`\n\n```\n∇f f(x x) = (∂f/∂x_1,\
  \ ∂f/∂x_2, ⋯, ∂f/∂x_n)^T\n```\n\n但：\n\n`f(xx + Δ) − f(xx) ≃ Δxx∇f(xx)`\n\n如果梯度 `∇[x]ff(xx)`、`f(xx)`、`xx`\
  \ 都写成行向量形式，则：\n\n`f(xx + Δ) − f(xx) ≃ ∇f(xx)Δx^(T) = Δxx∇ff(xx)^(T)`\n\n对于多元函数 `f(xx)`，如果自变量\
  \ `xx` 写成矩阵形式，则 `f(xx)` 关于 `xx` 的梯度，虽然是一个向量，但有时写成与 `xx` 形状相同的矩阵形式，这样容易知道哪个偏导数对应哪个变量，即：\n\
  \n```\nf'(x x) = dy/dx x = [ ∂y/∂x_11  ∂y/∂x_21  ⋯  ∂y/∂x_n1\n                 \
  \     ∂y/∂x_12  ∂y/∂x_22  ⋯  ∂y/∂x_n2\n                      ⋮          ⋮      \
  \    ⋱  ⋮\n                      ∂y/∂x_1n  ∂y/∂x_2n  ⋯  ∂y/∂x_nn ]\n```\n\n将梯度、自变量、因变量写成行向量、列向量还是矩阵，完全取决于哪种形式更有利于你推导相关公式。如果\
  \ `xx` 写成矩阵形式且梯度写成矩阵形式，看起来会更一致。\n\n##### 示例 1\n\n对于多元函数 `F(x, y, z) = x + 2y² +\
  \ 3z³`，有：\n\n`∇F(x, y, z) = (1, 4y, 9z²)`\n\n在特定点 (2,3,4) 处的梯度为 `(1, 4 * 3, 9 *\
  \ 4²) = (1, 12, 144)`。在此点附近，如果自变量有一个微小增量 `(Δx, Δy, Δz)`，则：\n\n`F(2 + Δx, 3 + Δy,\
  \ 4 + Δz) − F(2, 3, 4) ≃ 1 * Δx + 12 * Δy + 144 * Δz`\n\n##### 示例 2\n\n假设 `y = w[1]\
  \ * x[1] + w[2] * x[2] + ⋯ + w[n] * x[n] + b`，若 `y` 视为 `w = (w[1], w[2], …, w[n])`\
  \ 的函数，则 `dy/dw = (x_1, x_2, ..., x_n)`；若 `y` 视为 `x = (x[1], x[2], …, x[n])` 的函数，则\
  \ `dy/dx = (w[1], w[2], …, w[n])`；若 `y` 视为 `b` 的函数，则 `dy/db = 1`。\n\n如果 `ww` 写成列向量而\
  \ `xx` 写成行向量，则 `y = xxww`，若梯度写成行向量，则 `∂y/∂xx = ww^T`，`∂y/∂ww = xx`。\n\n如果 `ww` 和\
  \ `xx` 都写成列向量形式，且梯度写成行向量形式，则 `y = ww^(T)xx = xx^(T)ww`，此时 `∂y/∂xx = ww^T`，`∂y/∂ww\
  \ = xx^T`。\n\n可以证明，导数的四则运算和链式法则对梯度也成立。设 f, g 为两个从 ℝ^(n) 到 ℝ 的实值函数，则：\n\n###### 线性法则\n\
  \n`(αf + βg)'(x) = ∇(αf + βg)(x) = αf'(x) + βg'(x) = α∇f + β∇g(x)`\n\n###### 乘积法则\n\
  \n`(fg)'(x) = ∇(fg)(x) = f'(x)g(x) + f(x)g'(x) = g(x)∇f(x) + f∇g(x)`\n\n###### 链式法则\n\
  \n设 g 为从 ℝ^(n) 到 ℝ 的实值函数，f 为从 ℝ 到 ℝ 的实值函数，对某 `xx ∈ ℝ^(n)`，`g(xx)` 的值为 `z`，若 `xx`\
  \ 为列向量且梯度为行向量形式，则有：\n\n`(f ∘ g)'(xx) = ∇(f ∘ g)(xx) = f'(z)g'(xx) = f'(z)∇g(xx)`\n\
  \n若 `xx` 为行向量且梯度为列向量形式，则：\n\n`(f ∘ g)'(xx) = ∇(f ∘ g)(xx) = g'(xx)f'(z) = ∇g(xx)f'(z)`\n\
  \n即两种不同形式的链式法则顺序恰好相反。\n\n##### 示例 3\n\n若 `g((x_1, x_2)^T) = 3x_1 + 2x_2³`，`f(z)\
  \ = z²`，则 `(f ∘ g)((x_1, x_2)^T) = (3x_1 + 2x_2³)²`。所以：\n\n`(f ∘ g)'(xx) = f'(z)∇g(x)\
  \ = 2z * (3, 6x[2]²) = 2 * (3x[1] + 2x[2]³) * (3, 6x[2]²) = (18x[1] + 12x[2]³, 36x[1]x[2]²\
  \ + 24x[2]⁵)`\n\n若变量为行向量且梯度为列向量，`g(x[1], x[2]) = 3x[1] + 2x[2]³`，`f(z) = z²`，则 `(f\
  \ ∘ g)(x[1], x[2]) = (3x[1] + 2x[2]³)²`。所以：\n\n```\n(f ∘ g)'(x x) = ∇g(x)f'(z) =\
  \ [ 3\n                                 6x_2² ] 2z = [ 3\n                     \
  \                             6x_2² ] 2 * (3x_1 + 2x_2³) = [ 18x_1 + 12x_2³\n  \
  \                                                                              \
  \     36x_1x_2² + 24x_2⁵ ]\n```\n\n##### 示例 4\n\n假设 `y`、`ŷ` 是 ℝ^(n) 中的两个向量，可以用它们欧氏距离的平方来定义这两个向量之间的误差（距离），例如用以下公式表示两个向量之间的误差\
  \ `E(y, ŷ)`：\n\n```\nE(y y, ŷ ŷ) = 1/2 ||y y - ŷ ŷ||_2² = 1/2((y_1 - ŷ_1)² + (y_2\
  \ - ŷ_2)² + ⋯ + (y_n - ŷ_n)²)\n```\n\n`E(y y, ŷ ŷ)` 关于 `yy` 的梯度为 `(y y - ŷ ŷ)^T`。\n\
  \n#### 1.3.7 向量值函数的导数与雅可比矩阵\n\n如果有多个函数：\n\n```\nf_1: x → f_1(x)\nf_2: x → f_2(x)\n\
  ⋮\nf_m: x → f_m(x)\n```\n\n它们可以写在一个列向量中：\n\n```\nf f(x) = [ f_1(x)\n           f_2(x)\n\
  \           ⋮\n           f_m(x) ]\n```\n\n这些组合在一起的函数称为**向量值函数**。输入一个 `x`，每个函数产生一个函数值\
  \ `fi`，这些函数值构成上述右侧的向量。\n\n例如，有 3 个函数：`f1 = x²`，`f2 = e^x`，`f3 = ax`，它们构成一个向量值函数：\n\
  \n```\nf f(x) = [ f_1(x)\n           f_2(x)\n           f_3(x) ] = [ x²\n      \
  \                  e^x\n                        ax ]\n```\n\n输入一个 `x` 值，如 3，产生 3\
  \ 个值：`[ 9, e³, 3a ]^T`\n\n由 m 个一元函数组成的向量值函数是实数集 ℝ 到 ℝ^(m) 的映射（变换）`ff(x) : ℝ → ℝ^(m)`。如果在某点\
  \ `x`，每个函数 `fi` 关于 `x` 的导数存在，将这些导数汇集成一个向量，称为向量值函数关于自变量 `x` 的导数，可写作 `Dff(x)`：\n\n\
  \n\n##### 向量值函数的导数\n\n$$\n\\begin{matrix} \nDf f(x) = f f^{\\prime}(x) = \\frac{df\
  \ f}{dx} = \\begin{bmatrix} \\frac{df_{1}}{dx} \\\\ \\frac{df_{2}}{dx} \\\\ \\vdots\
  \ \\\\ \\frac{df_{m}}{dx} \\\\ \\end{bmatrix} \\in \\mathbb{R}^{m \\times 1} \n\\\
  end{matrix}\n$$\n\n向量值函数的导数是一个包含 m 个元素的向量。\n\n如果向量值函数的自变量 *x* 是一个包含多个变量的向量，这样的向量值函数称为多元向量值函数。设自变量个数为\
  \ n，函数个数为 m。这是一个从 $\\mathbb{R}^{(n)}$ 到 $\\mathbb{R}^{(m)}$ 的映射（变换） **f** : $\\\
  mathbb{R}^{(n)} \\to \\mathbb{R}^{(m)}$。输入 n 个自变量的值，输出 m 个实数。\n\n多元向量值函数的每个函数 $f_i(x)$\
  \ 都是一个多元函数。在某点 *x* 处，如果每个函数 $f_i(x)$ 都有关于 *x* 的梯度，将这些梯度向量堆叠在一起得到一个矩阵，称为雅可比矩阵：\n\n\
  $$\n\\begin{matrix} \nDf f(x) = f f^{\\prime}(x) = \\frac{df f}{dx} = \\begin{bmatrix}\
  \ \n\\frac{\\partial f_{1}}{\\partial x_{1}} & \\frac{\\partial f_{1}}{\\partial\
  \ x_{2}} & \\cdots & \\frac{\\partial f_{1}}{\\partial x_{n}} \\\\\n\\frac{\\partial\
  \ f_{2}}{\\partial x_{1}} & \\frac{\\partial f_{2}}{\\partial x_{2}} & \\cdots &\
  \ \\frac{\\partial f_{2}}{\\partial x_{n}} \\\\\n\\vdots & \\vdots & \\ddots & \\\
  \\\n\\frac{\\partial f_{m}}{\\partial x_{1}} & \\frac{\\partial f_{m}}{\\partial\
  \ x_{2}} & \\cdots & \\frac{\\partial f_{m}}{\\partial x_{n}} \\\\\n\\end{bmatrix}\
  \ \\in \\mathbb{R}^{m \\times n}\n\\end{matrix}\n$$\n\n这是一个 $m \\times n$ 矩阵，其中每一行是一个函数的梯度。\n\
  \n通常，自变量和向量值函数写作列向量，每个函数的梯度写作行向量。但本书将自变量和向量值函数都写成行向量的形式，即：\n\n$f(x) = (f_1(x), f_2(x),\
  \ \\cdots, f_m(x))$\n\n$x = (x_1, x_2, \\cdots, x_n)$\n\n但此时雅可比矩阵为：\n\n$$\n\\begin{matrix}\
  \ \nDf f(x) = f f^{\\prime}(x) = \\frac{df f}{dx} = \\begin{bmatrix} \n\\frac{\\\
  partial f_{1}}{\\partial x_{1}} & \\frac{\\partial f_{2}}{\\partial x_{1}} & \\\
  cdots & \\frac{\\partial f_{m}}{\\partial x_{1}} \\\\\n\\frac{\\partial f_{1}}{\\\
  partial x_{2}} & \\frac{\\partial f_{2}}{\\partial x_{2}} & \\cdots & \\frac{\\\
  partial f_{m}}{\\partial x_{2}} \\\\\n\\vdots & \\vdots & \\ddots & \\\\\n\\frac{\\\
  partial f_{1}}{\\partial x_{n}} & \\frac{\\partial f_{2}}{\\partial x_{n}} & \\\
  cdots & \\frac{\\partial f_{m}}{\\partial x_{n}} \\\\\n\\end{bmatrix} \\in \\mathbb{R}^{n\
  \ \\times m}\n\\end{matrix}\n$$\n\n雅可比矩阵由不同多元实值函数的梯度向量累积而成，因此梯度的四则运算和链式法则也适用。\n\n\
  设 f, g 为从 $\\mathbb{R}^{(n)}$ 到 $\\mathbb{R}^{(m)}$ 的两个向量值函数，则：\n\n$D(\\alpha f\
  \ + \\beta g)(x) = \\alpha Df(x) + \\beta Dg(x)$\n\n设 g 为从 $\\mathbb{R}^{(m)}$ 到\
  \ $\\mathbb{R}^{(k)}$ 的向量值函数，f 为从 $\\mathbb{R}^{(k)}$ 到 $\\mathbb{R}^{(n)}$ 的向量值函数。对于\
  \ $\\mathbb{R}^{(m)}$ 中的点 *x*，设 $g(x)$ 的值为 *z*。如果向量值函数和自变量等均为列向量形式，则：\n\n$(f \\\
  circ g)'(x) = D(f \\circ g)(x) = f'(z)g'(x) = Df(z)Dg(x)$\n\n如果向量值函数和自变量等均为行向量形式，则：\n\
  \n$(f \\circ g)'(x) = D(f \\circ g)(x) = g'(x)f'(z) = Dg(x)Df(z)$\n\n向量 $x = (x_1,\
  \ x_2, \\cdots, x_n)$ 可以看作其自身的多元向量值函数，其导数为单位矩阵 $I$：\n\n$$\n\\begin{matrix} \n\\\
  frac{dx}{dx} = \\begin{bmatrix} \n1 & 0 & \\cdots & 0 \\\\\n0 & 1 & \\cdots & 0\
  \ \\\\\n\\vdots & \\vdots & \\ddots & \\\\\n0 & 0 & \\cdots & 1 \\\\\n\\end{bmatrix}\
  \ = I\n\\end{matrix}\n$$\n\n根据导数的四则运算规则，对于向量 *x* 和 *b*，$\\nabla_x(\\alpha x + \\\
  beta b) = \\alpha I$。\n\n在上述示例 4 中，如果将 $E(y, \\hat{y})$ 视为 y 的函数，该函数可视为两个函数 $z =\
  \ y - \\hat{y}$ 和 $E(z) = \\frac{1}{2}z²$ 的复合函数。$E(y, \\hat{y})$ 关于 y 的梯度为：\n\n\
  $E'(z) = z^T$\n\n$z'(y) = (y - \\hat{y})' = I$\n\n$\\nabla_y E(y, \\hat{y}) = E'(z)z'(y)\
  \ = z^T z'(y) = z^T I = z^T = (y - \\hat{y})^T$\n\n###### 示例 5\n\n设\n\n$$\n\\begin{matrix}\
  \ \nz(x) = \\begin{bmatrix} z_1(x) \\\\ z_2(x) \\\\ \\end{bmatrix} = \\begin{bmatrix}\
  \ 2x_1 + 4x_2 + 7x_3 \\\\ 3x_1 + 5x_2 + 4x_3 \\\\ \\end{bmatrix}\n\\end{matrix}\n\
  $$\n\n是 *x* 的函数，且\n\n$y = \\begin{bmatrix} 4z_1 + 3z_2 \\\\ \\end{bmatrix}$\n\n\
  是 *z* 的函数，则 $f(x) = y(z(x))$ 是 $y(z)$ 和 $z(x)$ 的复合函数，根据复合函数求导规则，有：\n\n$$\n\\begin{matrix}\
  \ \nf'(x) = y'(z)z'(x) = (4,3)\\begin{bmatrix} 2 & 4 & 7 \\\\ 3 & 5 & 4 \\\\ \\\
  end{bmatrix} = (17,31,40)\n\\end{matrix}\n$$\n\n展开 $f(x)$ 的完整表达式：\n\n$f(x) = 4(2x_1\
  \ + 4x_2 + 7x_3) + 3(3x_1 + 5x_2 + 4x_3) = 17x_1 + 31x_2 + 40x_3$\n\n可以验证上述结果是正确的。\n\
  \n如果约定梯度写成列向量形式，链式法则将按相反顺序书写：\n\n$$\n\\begin{matrix} \ny'(z) = \\begin{bmatrix}\
  \ 4 \\\\ 3 \\\\ \\end{bmatrix} \\quad \nz'(x) = \\begin{bmatrix} 2 & 3 \\\\ 4 &\
  \ 5 \\\\ 7 & 4 \\\\ \\end{bmatrix} \\quad \nf'(x) = z'(x)y'(z) = \\begin{bmatrix}\
  \ 2 & 3 \\\\ 4 & 5 \\\\ 7 & 4 \\\\ \\end{bmatrix}\\begin{bmatrix} 4 \\\\ 3 \\\\\
  \ \\end{bmatrix} = \\begin{bmatrix} 17 \\\\ 31 \\\\ 40 \\\\ \\end{bmatrix}\n\\end{matrix}\n\
  $$\n\n在今后推导这些公式时，必须注意梯度等向量是列向量还是行向量。\n\n###### 示例 6\n\n$$\n\\begin{matrix} \nz =\
  \ \\begin{bmatrix} z_1 & z_2 & \\cdots & z_n \\\\ \\end{bmatrix} = \\begin{bmatrix}\
  \ x_1 & x_2 & \\cdots & x_m \\\\ \\end{bmatrix} \\cdot \\begin{bmatrix} \nw_{11}\
  \ & w_{12} & \\ldots & w_{1n} \\\\\nw_{21} & w_{22} & \\ldots & w_{2n} \\\\\n\\\
  vdots & \\vdots & \\ddots & \\vdots \\\\\nw_{m1} & w_{m2} & \\ddots & w_{mn} \\\\\
  \n\\end{bmatrix} \\\\\n= \\begin{bmatrix} \nw_{11} * x_1 + w_{21} * x_2 + \\cdots\
  \ + w_{m1} * x_m, &\nw_{12} * x_1 + w_{22} * x_2 + \\cdots + w_{m2} * x_m, &\n\\\
  cdots, &\nw_{1n} * x_1 + w_{2n} * x_2 + \\cdots + w_{mn} * x_m\n\\end{bmatrix}\n\
  \\end{matrix}\n$$\n\n因为 $\\frac{\\partial z_i}{\\partial x_j} = w_{ji}$，所以 $\\frac{\\\
  partial z_i}{\\partial x} = w_{.i}$ 是矩阵 $W$ 的第 i 列，故 $\\frac{\\partial z}{\\partial\
  \ x} = W$。\n\n如果还有另一个变量 *y*，*z* 关于 *y* 的梯度为 $\\frac{dy}{dz} = (\\frac{\\partial\
  \ y}{\\partial z_1}, \\frac{\\partial y}{\\partial z_2}, \\cdots, \\frac{\\partial\
  \ y}{\\partial z_n})^T$，则\n\n\n\n\n##### 数学推导与矩阵微积分\n\n###### 链式法则与偏导数\n\n$$\n\\\
  frac{dy}{dx} = \\frac{\\partial y}{\\partial z_{1}} \\ast \\frac{\\partial z_{1}}{\\\
  partial x} + \\frac{\\partial y}{\\partial z_{2}} \\ast \\frac{\\partial z_{2}}{\\\
  partial x} + \\cdots + \\frac{\\partial z_{1}}{\\partial z_{n}} \\ast \\frac{\\\
  partial z_{n}}{\\partial x} = \\frac{dz z}{dx}\\frac{dy}{dz z} = \\left(\\frac{\\\
  partial z_{1}}{\\partial x},\\frac{\\partial z_{2}}{\\partial x},\\cdots,\\frac{\\\
  partial z_{n}}{\\partial x}\\right)\\left(\\frac{\\partial z_{1}}{\\partial z_{1}},\\\
  frac{\\partial z_{1}}{\\partial z_{2}},\\cdots,\\frac{\\partial z_{1}}{\\partial\
  \ z_{n}}\\right)^{T} = W W\\frac{dy}{dz z}\n$$\n\n因为 $\\frac{\\partial z_{j}}{\\\
  partial w_{ij}} = x_{i}$，$\\frac{\\partial z_{k}}{\\partial w_{ij}} = 0, k \\neq\
  \ j$，\n\n示例：\n\n$$\n\\begin{matrix} \n\\frac{dz_{1}}{dW} = \\begin{bmatrix} \nx_{1}\
  \ & 0 & \\ldots & 0 \\\\ \nx_{2} & 0 & \\ldots & 0 \\\\ \n\\vdots & \\vdots & \\\
  ddots & \\vdots \\\\ \nx_{n} & 0 & \\ldots & 0 \\\\ \n\\end{bmatrix} \n\\end{matrix}\n\
  $$\n\n如果存在另一个变量 `y`，`z z` 的梯度为 $\\frac{dy}{dz z} = \\left(\\frac{\\partial y}{\\\
  partial z_{1}},\\frac{\\partial y}{\\partial z_{2}},\\cdots,\\frac{\\partial y}{\\\
  partial z_{n}}\\right)^{T}$，则\n\n$$\n\\frac{dy}{dw_{ij}} = \\frac{\\partial y}{\\\
  partial z_{1}} \\ast \\frac{\\partial z_{1}}{\\partial w_{ij}} + \\frac{\\partial\
  \ y}{\\partial z_{2}} \\ast \\frac{\\partial z_{2}}{\\partial w_{ij}} + \\cdots\
  \ + \\frac{\\partial y}{\\partial z_{n}} \\ast \\frac{\\partial z_{n}}{\\partial\
  \ w_{ij}} = \\frac{\\partial y}{\\partial z_{j}}{\\partial w_{ij}} = \\frac{\\partial\
  \ y}{\\partial z_{j}}x_{i} = x_{i}\\frac{\\partial y}{\\partial z_{j}}\n$$\n\n因此：\n\
  \n$$\n\\begin{matrix} \n\\frac{dy}{dW W} = \\begin{bmatrix} \nx_{1}\\frac{\\partial\
  \ y}{\\partial z_{1}} & x_{1}\\frac{\\partial y}{\\partial z_{2}} & \\ldots & x_{1}\\\
  frac{\\partial y}{\\partial z_{n}} \\\\ \nx_{2}\\frac{\\partial y}{\\partial z_{1}}\
  \ & x_{2}\\frac{\\partial y}{\\partial z_{2}} & \\ldots & x_{2}\\frac{\\partial\
  \ y}{\\partial z_{n}} \\\\ \n\\vdots & \\vdots & \\ddots & \\vdots \\\\ \nx_{m}\\\
  frac{\\partial y}{\\partial z_{1}} & x_{m}\\frac{\\partial y}{\\partial z_{2}} &\
  \ \\ldots & x_{m}\\frac{\\partial y}{\\partial z_{n}} \\\\ \n\\end{bmatrix} = x\
  \ x^{T}\\frac{dy}{dz z}^{T} \n\\end{matrix}\n$$\n\n###### 变量定义\n\n设定\n\n$$\n\\begin{matrix}\
  \ \nW W = \\begin{bmatrix} \nw_{11} & w_{12} & \\ldots & w_{1n} \\\\ \nw_{21} &\
  \ w_{22} & \\ldots & w_{2n} \\\\ \n\\vdots & \\vdots & \\ddots & \\vdots \\\\ \n\
  w_{m1} & w_{m2} & \\ldots & w_{mn} \\\\ \n\\end{bmatrix}\n\\quad \nx x = \\begin{bmatrix}\
  \ \nx_{1} \\\\ \nx_{2} \\\\ \n\\vdots \\\\ \nx_{n} \\\\ \n\\end{bmatrix}\n\\quad\
  \ \nb b = \\begin{bmatrix} \nb_{1} \\\\ \nb_{2} \\\\ \n\\vdots \\\\ \nb_{m} \\\\\
  \ \n\\end{bmatrix}\n\\quad \n\\hat{z}\\hat{z} = \\begin{bmatrix} \n\\hat{z}_{1}\
  \ \\\\ \n\\hat{z}_{2} \\\\ \n\\vdots \\\\ \n\\hat{z}_{m} \\\\ \n\\end{bmatrix}\n\
  \\end{matrix}\n$$\n\n`z z = W W x x + b b`，即：\n\n$$\n\\begin{matrix} \nz z = \\\
  begin{bmatrix} \nz_{1} \\\\ \nz_{2} \\\\ \n\\vdots \\\\ \nz_{m} \\\\ \n\\end{bmatrix}\
  \ = \\begin{bmatrix} \nw_{11} & w_{12} & \\ldots & w_{1n} \\\\ \nw_{21} & w_{22}\
  \ & \\ldots & w_{2n} \\\\ \n\\vdots & \\vdots & \\ddots & \\vdots \\\\ \nw_{m1}\
  \ & w_{m2} & \\ldots & w_{mn} \\\\ \n\\end{bmatrix} \\cdot \\begin{bmatrix} \nx_{1}\
  \ \\\\ \nx_{2} \\\\ \n\\vdots \\\\ \nx_{n} \\\\ \n\\end{bmatrix} + \\begin{bmatrix}\
  \ \nb_{1} \\\\ \nb_{2} \\\\ \n\\vdots \\\\ \nb_{m} \\\\ \n\\end{bmatrix} = \\begin{bmatrix}\
  \ \nw_{11} \\ast x_{1} + w_{12} \\ast x_{2} \\ast + \\cdots + w_{1n} \\ast x_{n}\
  \ + b_{1} \\\\ \nw_{21} \\ast x_{1} + w_{22} \\ast x_{2} \\ast + \\cdots + w_{2n}\
  \ \\ast x_{n} + b_{2} \\\\ \n\\vdots \\\\ \nw_{m1} \\ast x_{1} + w_{m2} \\ast x_{2}\
  \ \\ast + \\cdots + w_{mn} \\ast x_{n} + b_{m} \\\\ \n\\end{bmatrix} \n\\end{matrix}\n\
  $$\n\n###### 雅可比矩阵\n\n若 `z` 视为 `x x = (x[1], x[2], \\cdots, x[n])` 的多元向量值函数，则 $\\\
  frac{dz z}{dx x}$ 的雅可比矩阵为：\n\n$$\n\\begin{matrix} \nf^{\\prime}(x x) = \\frac{dz\
  \ z}{dx x} = \\begin{bmatrix} \nw_{11} & w_{11} & \\cdots & w_{1n} \\\\ \nw_{21}\
  \ & w_{21} & \\cdots & w_{2n} \\\\ \n& & & \\\\ \n\\vdots & \\vdots & \\ddots &\
  \ \\\\ \nw_{m1} & w_{m1} & \\cdots & w_{mn} \\\\ \n\\end{bmatrix} \\in \\mathbb{R}^{m\
  \ \\times n} \n\\end{matrix}\n$$\n\n若 `z` 视为 `b b = (b[1], b[2], \\cdots, b[m])`\
  \ 的多元向量值函数，则 $\\frac{dz}{db}$ 的雅可比矩阵为：\n\n$$\n\\begin{matrix} \nf^{\\prime}(b) =\
  \ \\frac{d\\mathbf{z}}{db b} = \\begin{bmatrix} \n1 & 0 & \\cdots & 0 \\\\ \n0 &\
  \ 1 & \\cdots & 0 \\\\ \n& & & \\\\ \n\\vdots & \\vdots & \\ddots & \\\\ \n0 & 0\
  \ & \\cdots & 1 \\\\ \n\\end{bmatrix} \\in \\mathbb{R}^{m \\times m} \n\\end{matrix}\n\
  $$\n\n若 `z` 视为 `W W = (w[11], w[12], \\cdots, w[1n], \\cdots, w[m1], w[m2], \\cdots,\
  \ w[m*n])` 的多元向量值函数，则 $\\frac{dz z}{dW W}$ 的雅可比矩阵为：\n\n$$\n\\begin{matrix} \nf^{\\\
  prime}(w w) = \\frac{dz z}{dW W} = \\begin{bmatrix} \nx_{1} & \\cdots & x_{n} &\
  \ 0 & \\cdots & 0 & {\\cdots\\cdots} & 0 & \\cdots & 0 \\\\ \n0 & \\cdots & 0 &\
  \ x_{1} & \\cdots & x_{n} & {\\cdots\\cdots} & 0 & \\cdots & 0 \\\\ \n\\vdots &\
  \ \\vdots & \\ddots & \\vdots & \\vdots & \\ddots & \\vdots & \\vdots & \\ddots\
  \ & \\\\ \n0 & \\cdots & 0 & 0 & \\cdots & 0 & {\\cdots\\cdots} & x_{1} & \\cdots\
  \ & x_{n} \\\\ \n\\end{bmatrix} \\in \\mathbb{R}^{m \\times (m \\times n)} \n\\\
  end{matrix}\n$$\n\n为便于识别，`z` 对 `W W` 的导数或雅可比矩阵也可写成与 `W W` 同形的形式：\n\n$$\n\\begin{matrix}\
  \ \nf^{\\prime}(W W) = \\frac{d\\mathbf{z}}{dW W} = \\begin{bmatrix} \nx_{1} & x_{2}\
  \ & \\cdots & x_{n} \\\\ \nx_{1} & x_{2} & \\cdots & x_{n} \\\\ \n\\vdots & \\vdots\
  \ & \\ddots & \\\\ \nx_{1} & x_{2} & \\cdots & x_{n} \\\\ \n\\end{bmatrix} \\in\
  \ \\mathbb{R}^{m \\times n} \n\\end{matrix}\n$$\n\n###### 示例 7\n\n设 `W W`、`x x`、`b\
  \ b` 与上同，$L L = \\frac{1}{2}{\\parallel W Wx x - b b \\parallel}^{2}$。\n\n#######\
  \ 情况一：`L L` 视为 `x x` 的函数\n\n可视为 $f(z z) = \\frac{1}{2}{\\parallel z z \\parallel}^{2}$\
  \ 与复合函数 $z z(x) = W W x x - b b$ 的复合。\n\n`L L` 关于 `x x` 的梯度为：\n\n$$\n\\nabla[x x]\
  \ L L = f^{\\prime}(z z) \\ast z z^{\\prime}(x x) = z z^{(T)} W W = (W W x x - b\
  \ b)^{(T)} W W\n$$\n\n这是梯度的行向量形式，其列向量形式为：\n\n$$\n((W W x x - b b)^{(T)} W W)^{(T)}\
  \ = W W^{(T)} (W W x x - b b) = W W^{(T)} W W x x - W W^{(T)} b b\n$$\n\n#######\
  \ 情况二：`L L` 视为 `W W` 的函数\n\n也可视为 $f(z z) = \\frac{1}{2}{\\parallel z z \\parallel}^{2}$\
  \ 与复合函数 $z z(W W) = W W x x - b b$ 的复合。\n\n`L L` 对 `W W` 的梯度为：\n\n$$\n\\begin{matrix}\
  \ \n\\nabla_{W W} L L = f^{\\prime}(z) \\ast z^{\\prime}(W) = z^{T} z^{\\prime}(W)\
  \ \\\\\n= (W_{1} W_{1} x x - b_{1}, W_{2} W_{2} x x - b_{2}, \\cdots, W_{m} W_{m}\
  \ x x - b_{m}) \\begin{bmatrix} \nx_{1} & \\cdots & x_{n} & 0 & \\cdots & 0 & {\\\
  cdots\\cdots} & 0 & \\cdots & 0 \\\\ \n0 & \\cdots & 0 & x_{1} & \\cdots & x_{n}\
  \ & {\\cdots\\cdots} & 0 & \\cdots & 0 \\\\ \n\\vdots & \\vdots & \\ddots & \\vdots\
  \ & \\vdots & \\ddots & \\vdots & \\vdots & \\ddots & \\\\ \n0 & \\cdots & 0 & 0\
  \ & \\cdots & 0 & {\\cdots\\cdots} & x_{1} & \\cdots & x_{n} \\\\ \n\\end{bmatrix}\
  \ \\\\\n= ((W_{1} W_{1} x - b_{1}) x_{1}, (W_{1} W_{1} x - b_{1}) x_{2}, \\cdots,\
  \ (W_{1} W_{1} x - b_{1}) x_{n}, \\cdots, (W_{2} W_{2} x - b_{2}) x_{1}, (W_{2}\
  \ W_{2} x - b_{2}) x_{2}, \\cdots, (W_{2} W_{2} x - b_{2}) x_{n}, \\cdots) \n\\\
  end{matrix}\n$$\n\n将 $\\nabla[W W] L L$ 写成与 `W W` 同形的矩阵形式：\n\n\n\n\n$$\n\\begin{matrix}\n\
  \\begin{bmatrix}\n(W W_{1}x x - b_{1})x_{1} & (W W_{1}x x - b_{1})x_{2} & \\cdots\
  \ & (W W_{1}x x - b_{1})x_{n} \\\\\n(W W_{2}x x - b_{2})x_{1} & (W W_{2}x x - b_{2})x_{2}\
  \ & \\cdots & (W W_{2}x x - b_{2})x_{n} \\\\\n\\vdots & \\vdots & \\ddots & \\vdots\
  \ \\\\\n(W W_{m}x x - b_{m})x_{1} & (W W_{m}x x - b_{m})x_{2} & \\cdots & (W W_{m}x\
  \ x - b_{m})x_{n} \\\\\n\\end{bmatrix}\n&\n= \\begin{bmatrix}\nW W_{1}x x - b_{1}\
  \ \\\\\nW W_{2}x x - b_{2} \\\\\n\\vdots \\\\\nW W_{m}x x - b_{m} \\\\\n\\end{bmatrix}\n\
  \\times\n\\begin{bmatrix}\nx_{1} & x_{2} & \\cdots & x_{n} \\\\\n\\end{bmatrix}\
  \ \\\\\n&\n= (Wx x - b){x x}^{T} = z zx x^{T} = f^{\\prime}(z z)^{T}{x x}^{T}\n\\\
  end{matrix}\n$$\n\n一般来说，如果 `f`^′(`z``z`) 是 `f`(`z``z`) 关于 z 的梯度，且 `z``z` = `W``W``x``x`\
  \ + `b``b`，那么 `f`(`W``W``x``x` + `b``b`) 关于 `x``x` 的梯度是 `f`^′(`z``z`)`z``z`^′(`x``x`)\
  \ = `f`^′(`z``z`)`W``W`，`W``W` 的梯度可以写成与 `W``W` 相同的矩阵形式 `f`^′(`z``z`)^(`T`)`x``x`^(`T`)。这个规则在未来的神经网络梯度计算中将很有用。\n\
  \n#### 1.3.8 积分\n\n对于图 1-31 中的函数 `f(x)`，如何求其下方阴影部分的面积？\n\n![](img/file229.png)\n\
  \n图 1-31 计算阴影面积\n\n曲线的面积可以通过累加区间上均匀分布的点 `x[i]` 处的小矩形面积来近似，即 $\\sum\\limits_{i}{f(x_{i})\
  \ \\ast \\Delta x}$，其中 `Δ``x` 是 `x` 所在区间均匀划分后的小区间长度。\n\n根据极限思想，只要 `Δ``x` 足够小，上述累加和与真实面积之间的误差就会越来越小，即真实面积\
  \ S 是以下极限值：\n\n$S = \\lim\\limits_{\\Delta x \\rightarrow 0}\\sum\\limits_{i}{f(x_{i})\
  \ \\ast \\Delta x}$\n\n这个极限值称为函数 `f(x)` 在该区间上的**定积分**（integral）。在微积分中，使用特殊符号 ∫[a]^(b)`f(x)``d``x`\
  \ 来表示这个极限值，其中 `d``x` 的含义是自变量的微分，可以看作是无穷小的 `Δ``x`。∫[a]^(b) 表示在区间 `[a,b]` 上累加乘积 `f(x)``d``x`。\n\
  \n同样，可以用 ∫[a]^(x)`f(x)``d``x` 表示区间 `[a,x]` 上的面积。当 x 的值不断变化时，这个值也在不断变化，从而形成一个函数 `F`\
  \ : `x` → ∫[a]^(x)`f(x)``d``x`。此时：\n\n`F(x)` = ∫[a]^(x)`f(x)``d``x`\n\n它也是一个随着 `x`\
  \ 变化而变化的函数。\n\n那么 F(x) 的导数是什么？根据导数的定义，有：\n\n$F^{\\prime}(x) = \\lim\\limits_{\\\
  Delta x \\rightarrow 0}\\frac{(F(x + \\Delta) - F(x))}{\\Delta x} = \\lim\\limits_{\\\
  Delta x \\rightarrow 0}\\frac{(f(x) \\ast \\Delta x)}{\\Delta x} = f(x)$\n\n当然，第二个等式的证明略显不严谨。感兴趣的读者可以查阅微积分教材。\n\
  \n### 1.4 概率基础\n\n本节介绍概率、随机变量、期望、方差等概率论基础知识。\n\n#### 1.4.1 概率\n\n概率是指事件**发生**的可能性（likelihood）。概率是\
  \ 0 到 1 之间的实数。如果一个事件的概率为 0，意味着该事件不可能发生，例如“太阳从西边升起”、“人可以永生”。如果一个事件的概率为 1，意味着这是一个必然事件，例如“人终有一死”。因此，概率为\
  \ 1 和 0 的事件是确定性事件，即必然发生或必然不发生。\n\n然而，许多事件是否发生以及发生的可能性大小往往是不确定的，即随机事件。例如，“买彩票中大奖”这个事件可能发生，也可能不发生。随机抛一枚硬币，可能是“正面”也可能是“反面”。掷一个骰子，出现的数字可能是\
  \ 1、2、3、4、5、6 中的任意一个。“买彩票中大奖”是小概率事件，即其概率应该是一个接近 0 的较小实数。\n\n如果硬币是均匀的，那么抛硬币时，正面和反面的机会（或概率）是相同的。一个随机实验（如“抛硬币”）可能有许多不同的结果（随机事件），所有这些结果可能具有不同的概率，但所有这些结果中必有一个会发生，即所有结果的概率之和等于\
  \ 1。因此，假设“抛硬币”时“正面”和“正面”的概率是 p，则 2p = 1，即 p=1/2=0.5。同理，如果有 6 个面的骰子完好且密度均匀，那么“掷骰子”时每个数字出现的概率是\
  \ 1/6。\n\n通常用大写字母 P 表示概率，那么抛硬币可能发生的 2 个事件的概率是：`P`(`h``e``a``d``s`) = 1/2，`P`(`t``a``i``l``s`)\
  \ = 1/2。而掷骰子出现数字 i 的概率是：`P`(`t``h``e` `n``u``m``b``e``r` `i` `a``p``p``e``a``r``s`)\
  \ = 1/6，`i` ∈ 1, 2, 3, 4, 5, 6。\n\n将“随机抛一枚硬币”称为**随机实验**。随机实验可能出现的结果（事件）称为**样本点**，随机实验所有可能的结果，即所有样本点的集合称为**样本空间**。随机实验通常用大写字母\
  \ E 表示，而样本空间通常用大写字母 `S`、`Ω` 或 `U` 表示。\n\n对于抛硬币实验，其样本空间 = `{\"comes heads\", \"comes\
  \ tails\"}`。对于掷骰子，其样本空间 = `{\"Number 1 appears\", \"Number 2 appears\", \"Number\
  \ 3 appears\", \"Number 4 appears\", \"Number 5 appears\", \"Number 6 appears\"\
  }`。\n\n如果随机实验是“随机掷骰子 2 次”，其样本空间 = {\"number 1 appears for the first time, number\
  \ 1 appears for the 2nd time\", \"number 1 appears for the first time, number 2\
  \ appears for the 2nd time\", \\cdots,\"The number 6 appears for the first time,\
  \ the number 6 appears for the second time\"}。即总共有 36 种可能的结果。假设每次掷骰子每个数字出现的概率相同，则每种结果的概率相等，均为\
  \ 1/36。\n\n设随机实验 E 为“从 52 张扑克牌中随机抽取一张，观察牌上的数字/字母”，则其样本空间为：{A,2,3,...,J,Q,K}，共有 13\
  \ 个样本点。如果随机实验 E 为“从 52 张扑克牌中随机抽取一张，它的花色是什么”，则其样本空间为：{spades, hearts, clubs, diamonds}，共有\
  \ 4 个样本点。如果随机实验 E 为“从 52 张扑克牌中随机抽取一张，这张牌是什么”，此时随机实验的结果必须同时考察数字/字母和花色，其样本空间将是上述两个样本空间的**笛卡尔积**：{\
  \ (A, spades), (A, hearts), (A, clubs), (A, diamonds), (B, spades), (B, hearts),\
  \ (B, clubs), (B, diamonds),...(K, spades), (K, hearts), (K, clubs), (K, diamonds)}，共有\
  \ 13×4 = 52 个样本点。\n\n样本空间的样本点称为**基本事件**。多个样本点的集合也是一个事件。例如，在随机实验“掷骰子”中，有 6 个基本事件，这些基本事件可以组合成其他事件，例如“出现的数字不超过\
  \ 3”这个事件 = { \"number 1 appears\", \"number 2 appears\", \"number 3 appears\" }，它是\
  \ 3 个基本事件的并集。\n\n在所有随机事件中，有 2 个特殊事件，即对应空集的事件，标记为 ⌀；对应全集（包含所有样本点）的事件，仍用符号 `Ω` 表示。\n\
  \n\n\n\n随机事件 A 的可能性用 0 到 1 之间的一个实数来表示，通常用符号 `P(A)` 表示，即 `0 <= P(A) <= 1`。显然 `P(∅)\
  \ = 0`，`P(Ω) = 1`，概率为 0 和 1 的事件分别称为**不可能事件**和**必然事件**，所以 `∅` 和 `Ω` 分别是不可能事件和必然事件。\n\
  \n对于任意事件 A，显然：`∅ ⊆ A ⊆ Ω`。\n\n**互斥事件**（也称**不相容事件**）：A 和 B 不能同时发生，即 A 和 B 没有公共样本点。即\
  \ `A ∩ B = ∅`。\n\n**对立事件**：互斥事件的一种特殊情况，A 和 B 不能同时发生，但 A 和 B 必有一个发生。用集合语言表示：`A ∩\
  \ B = ∅`。且 `A ∪ B = Ω`。\n\n**古典概型**（**古典概率**）：样本空间有限，且每个样本出现的概率相同。古典概率的事件概率 = 事件所包含的样本数\
  \ / 样本空间的样本总数。\n\n例如，对于“投掷一个骰子”，样本空间的总数为 6，“出现的点数小于 3”只有 2 个样本点（点数 1 和点数 2）。因此，该事件（“出现的点数小于\
  \ 3”）的概率 P = 2/6。\n\n当然，对于一般的随机实验，每个样本点（基本事件）出现的概率通常不相等。如何知道一个事件发生的概率？通常采用统计方法来确定事件的概率，即重复多次随机实验，例如\
  \ n 次。在这些实验中，如果事件 A 发生了 k 次，则称事件 A 的频率为 k/n。不断进行这种重复随机实验，当 n 很大时，根据概率论中的大数定律，这个频率将趋近于真实的概率。即：\n\
  \n$$P(A) = \\lim_{n \\rightarrow \\infty}\\frac{k}{n}$$\n\n例如，下面的代码用函数 `one_coin_test(n)`\
  \ 模拟一次试验（n 次抛硬币）并返回其中正面朝上的频率。可以看出，随着 n 的增加，频率趋近于概率 0.5。\n\n```\nfrom random import\
  \ randint\ndef one_coin_test(n):\n    head_tails=[]\n    for i in range(n):\n  \
  \      head_tails.append(randint(0,1))\n    heads = head_tails.count(1)\n    return\
  \ heads/n\n\nfor n in range(10,50000,2000):\n    print(one_coin_test(n),end=', ')\n\
  ```\n\n```\n0.7, 0.47562189054726367, 0.4845386533665835, 0.4945091514143095, 0.5013732833957553,\
  \ 0.5031968031968032, 0.4946711074104 9125, 0.5007137758743755, 0.5033104309806371,\
  \ 0.4999444752915047, 0.49485257371314345, 0.5070422535211268, 0.50016659725114\
  \ 53, 0.5036908881199539, 0.5008568368439843, 0.5007664111962679, 0.5004998437988128,\
  \ 0.4972655101440753, 0.4980560955290197, 0.5011312812417785, 0.5004498875281179,\
  \ 0.4991906688883599, 0.5021586003181095, 0.49734840252119106, 0.49989585503020206,\n\
  ```\n\n一个随机实验有许多可能的事件，每个事件都有一个概率。在数学上，这些事件的概率被定义为从事件到概率的一个映射。\n\n假设样本空间 Ω 中所有可测事件的全体是\
  \ F，概率 P 是从 F 到实数区间 `[0,1]` 的一个映射，即 `P: F → [0, 1]`。该映射必须满足：\n\n1.  **非负性**：`0 <=\
  \ P(A) <= 1`\n2.  **规范性**：`P(Ω) = 1`\n3.  **可列可加性**：设 `A[1], A[2], ⋯` 为两两不相容事件，即对\
  \ `i ≠ j`，有 `A[i] ∩ A[j] = ∅`，`(i, j = 1, 2, ⋯)`，则 `P(A[1] ∪ A[2] ∪ ⋯) = P(A[1])\
  \ + P(A[2]) + ⋯`\n\n#### 1.4.2 条件概率、联合概率、全概率公式、贝叶斯公式\n\n对于一个事件 A，`P(A)` 表示 A 发生的概率，称为**先验概率**。有时也要考虑条件概率，即在已知一个事件已经发生的条件下，另一个事件发生的概率。用\
  \ `P(B|A)` 表示在 A 已经发生的条件下 B 发生的概率。\n\n举一个医学例子，用 A 表示“患有乙肝”，用 B 表示“表面抗体阳性”。即 `P(A)`\
  \ 表示随机抽取一个人，“患乙肝”的概率是多少。`P(B)` 表示随机抽取一个人进行检查，他的表面抗体呈阳性的概率。\n\n那么 `P(B|A)` 表示“在患有乙肝的情况下，表面抗体呈阳性的概率”。显然，先验概率\
  \ `P(B)` 和条件概率 `P(B|A)` 不相等，因为“任意一个人的表面抗原呈阳性”显然不同于“患有乙肝的人表现出抗原阳性”。后者的可能性应该更大。\n\n\
  联合概率 `P(A, B)` ：表示 (A, B) 同时发生的联合概率。也就是说，随机抽取一个人，同时出现“患乙肝，表面抗体阳性”的概率是多少。\n\n联合概率\
  \ `P(A, B)` 有时也写作 `P(A ∩ B)`，表示 A 和 B 同时发生或其交集发生的概率。\n\n条件概率可以用先验概率和联合概率来计算：\n\n\
  $$P(B|A) = \\frac{P(A,B)}{P(A)}$$\n\n$$P(A|B) = \\frac{P(A,B)}{P(B)}$$\n\n可以用“投掷骰子”来帮助理解这个公式。设\
  \ A 表示“点数大于 3”，B 表示“点数为偶数”，则 `(A, B)` 表示“点数大于 3 且为偶数”，`(B|A)` 表示“在点数大于 3 的条件下，点数为偶数”。\n\
  \n“点数大于 3 且为偶数”在样本点空间 {1, 2, 3, 4, 5, 6} 中只有 2 个样本点 {4,6}，所以：`P(A, B) = 2/6`\n\n\
  同理，“点数大于 3”的概率 `P(A) = 3/6`\n\n“点数大于 3 时”的样本点空间集合为 {4, 5, 6}，即有 3 个样本点，其中偶数有 2 个\
  \ {4, 6}，因此，`P(B|A) = 2/3`\n\n可以验证：\n\n$$\\frac{P(A,B)}{P(A)} = \\frac{2/6}{3/6}\
  \ = 2/3 = P(B|A)$$\n\n联合概率也可以写成下面的形式（条件概率与先验概率的乘积）：\n\n`P(A, B) = P(A)P(B|A) = P(B)P(A|B)`\n\
  \n这个公式可以推广到 n 个事件：\n\n`P(A[1], A[2], ⋯, A[n]) = P(A[1])P(A[2]|A[1])P(A[3]|A[1],\
  \ A[2])⋯P(A[n]|A[1], A[2], ⋯, A[n−1])`\n\n当且仅当 `P(A, B) = P(A)P(B)` 时，两个事件是**独立**的。\n\
  \n等价于：`P(B|A) = P(B)` 或 `P(A|B) = P(A)`。\n\n两个事件**互斥**，意味着这两个事件不能同时发生，例如抛硬币时“正面”和“反面”这两个事件就是互斥的。对于互斥事件\
  \ A 和 B，显然 A 和 B 同时发生的概率为 0，即 `P(A, B) = 0`。\n\n对于集合 A、B，它们的交集和并集有关系 `A ∪ B = A\
  \ + B − (A ∩ B)`，因此，如果两个事件 A、B 不互斥，`P(A ∪ B) = P(A) + P(B) − P(A, B)`，如图 1-32 所示。如果\
  \ A 和 B 互斥，`P(A ∪ B) = P(A) + P(B) − P(A, B) = P(A) + P(B)`。\n\n![](img/file230.png)\n\
  \n图 1-32 集合的并运算\n\n如果 n 个事件 `A[1], A[2], ⋯, A[n]` 两两互斥，且它们的并集是整个样本空间，即 `A[1] ∪ A[2]\
  \ ∪ ⋯ ∪ A[n] = Ω`，则有：\n\n`P(A[1] ∪ A[2] ∪ ⋯ ∪ A[n]) = P(A[1]) + P(A[2]) + ⋯ + P(A[n])\
  \ = 1`\n\n对于集合 B，`B = B ∩ Ω = B ∩ (A[1] ∪ A[2] ∪ ⋯ ∪ A[n]) = ((B ∩ A[1]) ∪ (B ∩\
  \ A[2]) ∪ ⋯ ∪ (B ∩ A[n]))`\n\n于是对于任意事件 B，下式成立：\n\n\n\n\n$P(B) = P(B \\cap A_{1})\
  \ + P(B \\cap A_{2}) + \\cdots = \\sum\\limits_{i = 1}^{n}P(B|A_{i})P(A_{i})$\n\n\
  称为**全概率公式**。\n\n根据全概率公式，条件概率 $P(A|B)$ 可以按如下方式计算：\n\n$P(A_{i}|B) = \\frac{P(A_{i},B)}{P(B)}\
  \ = \\frac{P(B|A_{i})P(A_{i})}{\\sum\\limits_{i = 1}^{n}P(B|A_{i})P(A_{i})}$\n\n\
  例如，用 $P(A) = 0.001$ 表示普通人患乙肝的先验概率，用 $P(A^{(c)}) = 0.999$ 表示普通人不患乙肝的先验概率，用 $P(B|A)\
  \ = 0.99$ 表示“乙肝检测后表面抗体呈阳性”的概率，用 $P(B|A^{(c)}) = 0.01$ 表示“无乙肝但表面抗体检测呈阳性”的概率。现在如果某人做了表面抗体检测且结果为阳性（B），那么他患乙肝的概率（可能性）是多少？\n\
  \n这可以直接使用贝叶斯公式求解：\n\n$P(A|B) = \\frac{P(B|A)P(A)}{P(B|A)P(A) + P(B|A^{C})P(A^{C})}\
  \ = \\frac{0.99 \\times 0.001}{0.99 \\times 0.001 + 0.01 \\times 0.999} \\approx\
  \ 0.09$\n\n#### 1.4.3 随机变量\n\n如果随机事件总是以“出现正面”这样的文字形式书写，则将相应的概率写为 $P(\\text{\"出现正面\"\
  })$ 很不方便，特别是当随机事件数量很大时，为了用数学方法更好地研究概率，可以将样本空间中的样本点（基本事件）映射为一个实数值，这种映射关系称为**随机变量**。\n\
  \n简单来说，它是从样本空间 $\\Omega$ 到实数集 $R$ 的一种映射，即对每一个样本点（基本事件），都有一个实数与之对应。如下图所示：\n\n![](img/file231.png)\n\
  \n图 1-33 随机变量是从样本空间到实数集的映射\n\n例如，随机实验“投掷一枚硬币并观察其正反面”的样本空间只有 2 个样本：正面和反面。随机变量 $X(\\\
  omega)$ 可以定义如下：\n\n$X(\\text{正面}) = 3,\\quad X(\\text{反面}) = 4$\n\n即随机变量将基本事件“正面”和“反面”分别映射为两个值\
  \ 3 和 4。也可以写成：\n\n$X((\\omega = \\text{正面}) = 3,\\quad X((\\omega = \\text{反面})\
  \ = 4$\n\n或写成分段函数形式：\n\n$X(\\omega) = \\left\\{ \\begin{matrix} {3,} & {\\omega\
  \ = \\text{正面}} \\\\ {4,} & {\\omega = \\text{反面}} \\\\ \\end{matrix} \\right.$\n\
  \n假设这 2 个样本点（基本事件）的概率为：\n\n$P(\\text{正面}) = 0.3,\\quad P(\\text{反面}) = 0.7$\n\n\
  则可表示为随机变量 X 的概率：\n\n$P(X(\\omega) = 3) = 0.3,\\quad P(X(\\omega) = 4) = 0.7$\n\n\
  即 $X(\\omega)$ 取值 3 和 4 的概率分别为 0.3 和 0.7。\n\n对于一个实验，可以定义不同的随机变量。例如，随机投掷两个骰子，整个事件空间可由\
  \ 36 个元素组成：\n\n$\\omega = \\{(i, j)|i = 1, \\dots, 6,; j = 1, \\dots, 6\\}$\n\n\
  可以定义随机变量（映射）随机变量 $X$（获得的两个骰子点数之和），随机变量 $X$ 可取 11 个整数值：\n\n$X(\\omega) = X(i, j)\
  \ := i + j,\\quad x = 2, 3, \\dots, 12$\n\n也可以定义随机变量（映射）随机变量 $Y$（获得的两个骰子点数之差），随机变量\
  \ $X$ 可取 6 个整数值\n\n$Y(\\omega) = Y(i, j) := |i - j|,\\quad y = 0, 1, 2, 3, 4, 5$\n\
  \n再如，某人在等公交车，公交车每 5 分钟一班。如果该人到站事件是随机的，那么他等车的时间可以用随机变量 $X(\\omega)$ 表示。若样本空间 $S=\
  \ \\{\\text{等待时间}\\}$，样本点本身就是实数，则随机变量 $X(\\omega)$ 为：\n\n$X(\\omega) = \\omega,\\\
  quad \\omega \\in \\Omega$\n\n实际上是一个恒等函数。\n\n如果随机变量 $X(\\omega)$ 的取值范围是可数的，则称 $X(\\\
  omega)$ 为**离散随机变量**，否则称为**非离散随机变量**。在非离散随机变量中，如果取值范围由某些区间组成，则称为**连续随机变量**。随机变量 $X(\\\
  omega)$ 常简写为 $X$，即省略样本点 $\\omega$。\n\n#### 1.4.4 离散随机变量的概率分布列\n\n**定义**：设 X 为离散随机变量，即它只有有限个可能的取值：$x[1],\
  \ x[2], \\cdots, x[n]$。若 X 的每个取值都有一个概率 $P(X[i])$，则这些概率的排列：\n\n$P(x[1]), P(x[2]),\
  \ \\cdots, P(x[n])$ 称为随机变量的**概率分布列**。随机变量 X 从其可能取值 $x[i]$ 到对应概率 $P(x[i])$ 的函数关系即函数\
  \ $P(X): x[i] \\to P(x[i])$ 称为**概率质量函数**。\n\n例如，某商家的评价有优、良、中、差，可用随机变量 X 将这组样本点映射为\
  \ 0、1、2、3。若已知从大量既往评价中得出该商家优、良、中、差的概率分别为 0.5、0.3、0.1、0.1。则随机变量 X 的概率分布律为：\n\n$P(X\
  \ = 0) = 0.5,\\quad P(X = 1) = 0.3,\\quad P(X = 2) = 0.1,\\quad P(X = 3) = 0.1$\n\
  \n以下代码绘制了 X 取值 0、1、2、3 的概率分布。可以看出，除上述 4 个整数外，X 取其他值的概率均为 0。\n\n```\nimport matplotlib.pyplot\
  \ as plt\n%matplotlib inline \n\nx = [0,1,2,3]\np = [0.5,0.3,0.1,0.1]\nplt.vlines(0,\
  \ 0, 0.5,color=\"red\")\nplt.vlines(1, 0, 0.3,color=\"red\")\nplt.vlines(2, 0, 0.1,color=\"\
  red\")\nplt.vlines(3, 0, 0.1,color=\"red\")\nplt.scatter(x,p)\nplt.show()\n```\n\
  \n![](img/file18.png \"fig:\")  \n\n图 1-34 X 取值 0、1、2、3 的概率分布\n\n**两点分布**\n\n如果离散随机变量只取\
  \ 0 和 1 两个值，这种二元随机变量的分布也称为**两点分布**（又称**0-1 分布**、**伯努利分布**）。下式是二元随机变量 X 取值 1 和 0\
  \ 的概率值：\n\n$P(X = 1) = \\phi,\\quad P(X = 0) = 1 - \\phi$\n\n它描述了随机实验只涉及 2 种不同基本事物的概率情况。例如“抛硬币出现正面或反面”的问题。在机器学习的二分类问题中，这种两点分布被用来表示物体属于两类的概率。\n\
  \n**二项分布**\n\n如果问一个问题：“随机抛掷一枚硬币 n 次，出现 k 次正面的概率是多少？”这可以用二项分布来描述。实验“随机抛掷硬币 n 次”中的每一次抛掷都是上述的“两点分布”，且任意两次抛掷相互独立。用\
  \ A 表示事件“前 k 次出现正面，其后全为反面”，这是 n 个独立事件的联合事件，即“第 1 次出现正面”（用 $A[1]$ 表示）、“第 2 次出现正面”、$\\\
  cdots$、“第 k 次出现正面”、“第 k+1 次出现反面”（用 $B[k+1]$ 表示）、$\\cdots$、“第 n 次出现反面”的联合事件。因此：\n\
  \n$A = (A[1], A[2], \\cdots, A[k], B[k+1], \\cdots, B[n])$\n\n若抛硬币出现正面的概率为 $p$，则：\n\
  \n$P(A) = P(A[1])P(A[2])\\cdots P(A[k])P(B[k+1])\\cdots P(B[n]) = p^{(k)}(1 - p)^{(n\
  \ - 1)}$\n\n\n\n根据组合原理，在“n 次抛硬币，正面出现 k 次”这一事件中，这 k 次正面出现的总次数为 $C\\_{n}^{k} = \\\
  frac{n!}{k!(n - k)!}$。因此，根据概率的可加性，“n 次抛硬币且 k 次正面”这一事件的概率为 $C\\_{n}^{k}p^{k}(1-p)^{n-1}$。\n\
  \n$P(k; n, p) = C\\_{n}^{k}p^{k}(1-p)^{n-1}$\n\n如果用随机变量 X 将“n 次抛硬币，k 次正面”映射为整数 k，则该离散随机变量\
  \ X 的概率分布称为**二项分布**。此时\n\n$P(X = k) = C\\_{n}^{k}p^{k}(1-p)^{n-1}$\n\n描述了给定 n 和\
  \ p 时离散随机变量 X = k 的概率。\n\n#### 1.4.5 连续随机变量的概率密度\n\n离散随机变量可以直接列举随机变量取每个离散值的概率。而有些随机变量，如人的身高，其可能的取值是不可数的（不可数），例如取值在实数区间上的随机变量、取值在二维平面区域（如圆）内的坐标点。水位、温度、股价等。这些随机变量的可能取值在实数轴上是连续的，称为**连续随机变量**。\n\
  \n对于连续随机变量，无法列举随机变量每个可能取值的概率，这样做也没有意义。就像对于一个物体，测量其内部某一点的质量（重量）是不可行且无意义的。又如对于实数区间上的每一点，无法说出这一点的长度是多少。\n\
  \n既然定义连续随机变量取单个值的概率没有意义，那么如何度量随机变量取不同值的概率呢？正如用密度来度量物体各点的质量，用密度来度量物质内部某一点附近的质量一样。同样地，对于随机变量，可以用**概率密度**来度量随机变量取某个值附近的可能性。\n\
  \n正如物质的密度是其质量与体积之比的极限值，即对于物体内部一点 p，其密度定义为：\n\n$\\rho(p) = \\lim\\limits_{\\Delta\
  \ p \\rightarrow 0}\\frac{\\Delta m}{\\Delta p}$\n\n$\\Delta p$、$\\Delta m$ 代表包含\
  \ p 的微小区域的体积和质量。它们的比值反映了该微小区域的质量。当该微小区域趋于 0 时该比值的极限值精确地刻画了这一点 p 处的质量（严格说是质量密度）。\n\
  \n类似地，连续随机变量在某一点 x 处的概率（严格说是概率密度）也可以类似地表示为：\n\n$p(x) = \\lim\\limits_{\\Delta x\
  \ \\rightarrow 0}\\frac{\\Delta P}{\\Delta x} = \\lim\\limits_{\\Delta x \\rightarrow\
  \ 0}\\frac{P(x + \\Delta) - P(x)}{\\Delta x}$\n\n$\\Delta x$ 是包含 x 的微小区间，$\\Delta\
  \ P$ 是随机变量落在该微小区间内的概率，它们的比值代表随机变量落在该微小区间内的平均概率。当 $\\Delta x$ 趋于 0 时该比值的极限精确地描述了随机变量取这一点\
  \ x 处值的概率（似然性）。因此，对于某个 x，随机变量 X 在 `[x-dx, x+dx]` 上取值的概率 $P([x-dx, x+dx])$ 可以用 `2dx*p(x)`\
  \ 来近似。\n\n示例：假设随机变量 X 在区间 `[a,b]` 上均匀取值，则 `P[a,b]=1`，其在每一点 x 处的概率密度为 $p(x) = \\\
  frac{1}{b - a}$，即每一点的概率密度都是同一个值，即随机变量在取值 `[a,b]` 上每一点的概率相同。即随机变量在区间 `[a,b]` 上服从均匀分布。\n\
  \n**高斯分布**\n\n如果随机变量的概率密度函数是如下的高斯函数\n\n$p(x) = N N(\\mu,\\sigma^{2}) = \\frac{1}{\\\
  sigma\\sqrt{2\\pi}}e^{{- {(x - \\mu)}^{2}}/{2\\sigma^{2}}}$\n\n则称该随机变量服从高斯分布（Gaussian\
  \ distribution）（也称为正态分布）。该随机变量的取值范围是整个实数轴。\n\n下面的代码绘制了不同 $\\mu$、$\\sigma$ 值下的高斯概率密度：\n\
  \n```\nimport numpy as np\nimport matplotlib.pyplot as plt\n%matplotlib inline\n\
  \ndef gaussian(x, mu, sigma):\n    return 1/(sigma*np.sqrt(2*np.pi))*np.exp(-np.power(x\
  \ - mu, 2) / (2 * np.power(sigma, 2.)))\n\nx = np.linspace(-5, 5, 100)\nplt.plot(x,\
  \ gaussian(x,0,0.5))\nplt.plot(x, gaussian(x,-2,0.7))\nplt.plot(x, gaussian(x,0,1))\n\
  plt.plot(x, gaussian(x,1,2.3))\nplt.legend(['$\\mu=0,\\sigma=0.5$','$\\mu=-2,\\\
  sigma=0.7$','$\\mu=0,\\sigma=1$','$\\mu=1,\\sigma=2.3$'])\n#plt.axis('equal')\n\
  plt.xlabel('x')\nplt.ylabel('p(x)')\nplt.show()\n```\n\n![](img/file19.png \"fig:\"\
  )  \n\n图 1-35 不同均值和均方差的高斯曲线\n\n这是一条倒置的“钟形曲线”。可以看出，在 $\\mu$ 处概率密度最大，离 $\\mu$ 越远，概率密度越小。即随机变量取\
  \ $\\mu$ 附近值的概率最大，偏离它的值被取到的可能性越小。$\\sigma$ 越小，曲线越窄，说明随机变量的值越集中在 $\\mu$ 附近。$\\mu=0,\
  \ \\sigma=1$ 的高斯分布称为**标准正态分布**。\n\n#### 1.4.6 随机变量的分布函数\n\n**定义**：函数 $F(x) = P(X\
  \ \\le x) = P(\\omega|X(\\omega) \\le x), -\\infty \\le x \\le \\infty$，称为随机变量 X\
  \ 的分布函数。\n\n分布函数描述了随机变量落在区间 $(-\\infty, x)$ 上的概率。\n\n例如，上述抛硬币随机变量 X 对应的分布函数可计算为阶跃函数\
  \ $F(x)$：\n\n$F(x) = \\left\\{ \\begin{matrix} {0,} & {x < 3} \\\\ {0.3,} & {3 \\\
  le x < 4} \\\\ {1,} & {x \\ge 4} \\\\ \\end{matrix} \\right.$\n\n因为随机变量只有 3 和 4\
  \ 两个可能取值，概率分别为 0.3 和 0.7，所以随机变量不可能小于 3，即落在区间 $(-\\infty, x), x < 3$ 内的概率为 0，而落在\
  \ $(-\\infty, x), x < 4$ 内的概率是取值为 3 的概率 0.3，因为随机变量的值 3 和 4 总会落在 $(-\\infty, x),\
  \ x \\ge 4$ 内，所以 F(x) 在 $(-\\infty, x), x \\ge 4$ 上的概率为 1。\n\n```\nimport numpy\
  \ as np\nimport matplotlib.pyplot as plt\n%matplotlib inline\nlines = [(-2, 3),\
  \ (0, 0),'r',(3, 4), (0.3, 0.3),'g',(4, 10), (1, 1),'b']\nplt.plot(*lines)\nplt.scatter(3,0,\
  \ s=50, facecolors='none', edgecolors='r')\nplt.scatter(4,0.3, s=50, facecolors='none',\
  \ edgecolors='g')\n```\n\n![](img/file20.png \"fig:\")  \n\n图 1-36 抛硬币随机变量 X 对应的分布函数是阶跃函数\n\
  \n对于连续随机变量，若其概率密度为 $p(x)$，则分布函数是概率密度函数 $p(x)$ 在区间 $(-\\infty, x)$ 上的定积分。\n\n$F(x)\
  \ = \\int_{-\\infty}^{x} p(x) dx$\n\n反过来，概率密度是分布函数的导数，即 $p(x) = F'(x)$。\n\n下面的代码绘制了上图高斯概率密度对应的分布函数：\n\
  \n\n\n\n```python\nfrom scipy.integrate import quad\nimport numpy as np\nimport\
  \ matplotlib.pyplot as plt\n%matplotlib inline\n\ndef gaussian(x, mu, sigma):\n\
  \    return 1/(sigma*np.sqrt(2*np.pi))*np.exp(-np.power(x - mu, 2) / (2 * np.power(sigma,\
  \ 2.)))\n\ndef gaussion_dist(x, mu, sigma):\n    return quad(gaussian, np.inf, x,\
  \ args=(mu, sigma))\n\nvec_gaussion_dist = np.vectorize(gaussion_dist)\n\nx = np.linspace(-5,\
  \ 5, 100)\nplt.plot(x, vec_gaussion_dist(x, 0, 0.5)[0])\nplt.plot(x, vec_gaussion_dist(x,\
  \ -2, 0.7)[0])\nplt.plot(x, vec_gaussion_dist(x, 0, 1)[0])\nplt.plot(x, vec_gaussion_dist(x,\
  \ 1, 2.3)[0])\nplt.legend(['$\\mu=0,\\sigma=0.5$', '$\\mu=-2,\\sigma=0.7$', '$\\\
  mu=0,\\sigma=1$', '$\\mu=1,\\sigma=2.3$'])\n\nplt.xlabel('x')\nplt.ylabel('p(x)')\n\
  plt.show()\n```\n\n![](img/file21.png \"fig:\")\n\n图 1-37 不同均值和均方差的高斯概率密度函数\n\n\
  #### 1.4.7 期望、方差、协方差、协方差矩阵\n\n##### 1. 均值与期望\n\n假设有一些学生，他们的年龄分别是：18、19、20、21、22、19。那么他们的平均年龄是：\n\
  \n```\n(18+19+20+21+22+19)/6\n```\n\n即均值为：\n\n```\n19.833333333333332\n```\n\n这个平均年龄就是他们年龄的**均值**。因此，均值就是一组数的平均数。如果这组数是\
  \ ($x_1, x_2, \\cdots, x_n$)，那么这组数的均值是：\n\n$$\\frac{x_{1} + x_{2} + \\cdots + x_{n}}{n}\
  \ = \\frac{1}{n}\\sum\\limits_{i = 1}^{n}x_{i}$$\n\n如果 ($x_1, x_2, \\cdots, x_n$)\
  \ 是随机变量 $X$ 的所有可能取值，假设随机变量取这些值的概率相同，即为 $\\frac{1}{n}$。这个均值可以写成：\n\n$$\\frac{1}{n}{(x_{1}\
  \ + x_{2} + \\cdots + x_{n})} = \\frac{1}{n}x_{1} + \\frac{1}{n}x_{2} + \\cdots\
  \ + \\frac{1}{n}x_{n}$$\n\n即均值是随机变量每个取值的概率与该取值乘积之和。这个均值称为该随机变量的**数学期望**，简称**期望**。也就是说，从平均的角度来看，该随机变量的期望值。\n\
  \n如果随机变量取各个值的概率不相等，例如取 $x_i$ 的概率是 $p_i$，则随机变量的期望（均值）为：\n\n$p_1 x_1 + p_2 x_2 + \\\
  cdots + p_n x_n$\n\n通常用字母 `E` 表示随机变量的期望，即随机变量 $X$ 的期望可标记为 `E[X]`。此时：\n\n$$E\\lbrack\
  \ X\\rbrack = p_{1}x_{1} + p_{2}x_{2} + \\cdots + p_{n}x_{n} = \\sum\\limits_{i\
  \ = 1}^{n}p_{i}x_{i}$$\n\n假设大一新生年龄只有 18、19、20、21 岁，可以用一个可能取值为 0、1、2、3 的随机变量 $X$\
  \ 来表示。随机变量的概率 $p_i = P(x = i), i = 0, 1, 2, 3$ 表示随机变量的取值概率或学生属于不同年龄的概率（概率/百分比）。该随机变量\
  \ $X$ 的期望为：\n\n`E[X]` = $p_0 \\times 0 + p_1 \\times 1 + p_2 \\times 2 + p_3 \\\
  times 3$\n\n如果 $p_0, p_1, p_2, p_3$ 分别为 0.2, 0.4, 0.3, 0.1，则 `E(x)` = 0.2 $\\times$\
  \ 0 + 0.4 $\\times$ 1 + 0.3 $\\times$ 2 + 0.1 $\\times$ 3 = 1.03。\n\n如果函数 `f(X)`\
  \ 将表示学生年龄的随机变量 $X$ 映射为学生的实际年龄，即 $x = 0, 1, 2, 3$ 映射为年龄 18, 19, 20, 21，因为随机变量 $X$\
  \ 取值 0, 1, 2, 3 的概率分别为 $p_0, p_1, p_2, p_3$，因此，随变量 `f(X)` 取值 `f(0)`, `f(1)`, `f(2)`,\
  \ `f(3)` 的概率也分别是 $p_0, p_1, p_2, p_3$，于是可以计算随机变量 `f(X)` 的期望 `E[f(X)]`：\n\n`E[f(X)]`\
  \ = $p_0 \\times f(0) + p_1 \\times f(1) + p_2 \\times f(2) + p_3 \\times f(3)$\
  \ = 0.2 $\\times$ 18 + 0.4 $\\times$ 19 + 0.3 $\\times$ 20 + 0.1 $\\times$ 21 =\
  \ 19.3\n\n因此，如果随机变量 $X$ 所有取值的概率分别为 $p_1, \\cdots, p_i, \\cdots, p_n$，随机变量 $X$ 的函数值\
  \ `f(X)` 也是一个随机变量，随机变量 `f(X)` 的期望为：\n\n$$E\\lbrack f(X)\\rbrack = p_{1}f(x_{1})\
  \ + p_{2}f(x_{2}) + \\cdots + p_{n}f(x_{n}) = \\sum\\limits_{i = 1}^{n}p_{i}f(x_{i})$$\n\
  \n如果 $X$ 是连续随机变量，随机变量 $X$ 取值 $x$ 的概率为 $p(x)$，`f(X)` 是依赖于 $X$ 的随机变量，则随机变量 `Theexpectationof`\
  \ 和 `f(X)` 可通过积分计算：\n\n`E[X ~ p][X]` = $\\int p(x) x \\, dx$\n\n`E[X ~ p][f(X)]`\
  \ = $\\int p(x) f(x) \\, dx$\n\n令 `f(X)` = $X$ 为恒等映射，则上式可由下式导出。因此，上式可视为下式的一个特例。\n\
  \n期望具有线性性，即：\n\n`E[X]`[$\\alpha f(X) + \\beta g(X)$] = $\\alpha E[X][f(X)] + \\\
  beta E[X][g(X)]$\n\n##### 2. 方差、标准差\n\n期望表示随机变量的期望均值。例如 18, 19, 20, 21, 22 的均值是\
  \ 20，而 1, 6, 18, 10, 65 的均值也是 20。前一组数值非常接近，但后一组数值之间的偏差相对较大或较分散。如何表达随机变量取值的聚合程度或发散程度？\n\
  \n可以用随机变量距离其期望的平均误差来描述随机变量取值的聚合或发散程度。具体方法是将每个随机变量与期望值之间误差的平方相加，然后取平均。例如：\n\n$$\\\
  frac{(18 - 20)^{2} + (19 - 20)^{2} + (20 - 20)^{2} + (21 - 20)^{2} + (22 - 20)^{2}}{5}\
  \ = \\frac{4 + 1 + 0 + 1 + 4}{5} = 2$$\n\n$$\\frac{(1 - 20)^{2} + (6 - 20)^{2} +\
  \ (18 - 20)^{2} + (10 - 20)^{2} + (65 - 20)^{2}}{5} = \\frac{361 + 196 + 4 + 100\
  \ + 2025}{5} = 537.2$$\n\n这个误差平方的平均值称为**均方误差**，简称**方差**。它描述了随机变量偏离其期望值的程度。方差越大，越发散；方差越小，越集中。即方差越小，随机变量取值越集中在期望值附近。\n\
  \n对于等概率的随机变量 $x$，其取值为 ($x_1, x_2, \\cdots, x_n$)，若其期望（均值）记为 $\\mu = E(X)$，则方差 `Var(X)`\
  \ 为：\n\n$$Var(X) = \\frac{1}{n}({(x_{1} - \\mu)}^{2} + {(x_{2} - \\mu)}^{2} + \\\
  cdots + {(x_{n} - \\mu)}^{2}) = \\frac{{(x_{1} - \\mu)}^{2} + {(x_{2} - \\mu)}^{2}\
  \ + \\cdots + {(x_{n} - \\mu)}^{2})}{n} = \\frac{\\sum\\limits_{i = 1}^{n}{(x_{i}\
  \ - \\mu)}^{2}}{n}$$\n\n如果随机变量 $X$ 的概率分别为 $p_1, \\cdots, p_i, \\cdots, p_n$，则方差为：\n\
  \n`Var(X)` = ($p_1(x_1 - \\mu)² + p_2(x_2 - \\mu)² + \\cdots + p_n(x_n - \\mu)²$)\n\
  \n如果 $X$ 是连续随机变量，随机变量 $X$ 取值 $x$ 的概率为 $p(x)$，则 $X$ 的方差 `Var(X)` 为：\n\n`Var(X)` =\
  \ `E[X ~ p]`[$X - E(X)$]² = $\\int p(x) (X - E[x])² \\, dx$\n\n因此，方差也是期望，即随机变量 $(X\
  \ - E(X))²$ 的期望。或者说是平方误差的期望（均值）。根据期望的线性法则，可以推导出：\n\n`Var(X)` = `E[X ~ p]`[$X - E(X)$]²\
  \ = `E[X²]` − `E[X]`²\n\n方差是误差的平方，方差的平方根称为**标准差**，可用 `std(X)` 表示。即：$std(X) = \\\
  sqrt{Var(X)}$\n\n\n\n\n人们通常使用符号 `μ`、`σ` 来表示期望和标准差，而方差则用符号 `σ²` 表示。\n\n> **注意：**\
  \ 方差有时被定义为样本方差：\n>\n> $$Var(X) = \\frac{1}{n - 1}\\left({(x_{1} - \\mu)}^{2} + {(x_{2}\
  \ - \\mu)}^{2} + \\cdots + {(x_{n} - \\mu)}^{2}\\right) = \\frac{{(x_{1} - \\mu)}^{2}\
  \ + {(x_{2} - \\mu)}^{2} + \\cdots + {(x_{n} - \\mu)}^{2}}{n - 1}$$\n\n##### 3.\
  \ 协方差、协方差矩阵\n\n对于二维平面上的两个向量 `a = (x[a], y[a])`、`b = (x[b], y[b])`，它们的点积 `a ⋅ b =\
  \ x[a]x[b] + y[a]y[b]` 刻画了它们的相关性。例如，`a = (1, 1)`，`b = (−1, 1)`，它们的点积 `a ⋅ b = 1\
  \ * 1 + (−1) * 1 = 0` 表明它们相互垂直，即不相关。再如，`a = (1, 1)`，`b = (1, 1)`，它们的点积 `a ⋅ b =\
  \ 1 * 1 + 1 * 1 = 2`；这两个向量是重合的同一个向量，它们是相关的。再如，`a = (1, 1)`，`b = (1, 0)`，它们的点积 `a\
  \ ⋅ b = 1 * 1 + 1 * 0 = 1`；这两个向量的夹角为 45 度，它们的相关程度介于刚才那两种相关程度之间。\n\n一般地，有 2 个向量 `x\
  \ = (x[1], x[2], ⋯, x[n])`、`y = (y[1], y[2], ⋯, y[n])`；可以用它们的点积 `x ⋅ y = x[1]y[1]\
  \ + x[2]y[2] + ⋯ + x[n]y[n]` 来刻画它们的相关性。\n\n协方差是衡量两个随机变量之间相关性的指标。如果两个随机变量 `X`、`Y`\
  \ 取值为 `(x[1], x[2], ⋯, x[n])`、`y = (y[1], y[2], ⋯, y[n])`，它们之间的协方差 `Cov(X,Y)` 定义为：\n\
  \n$$Cov(X,Y) = \\frac{(x_{1} - \\mu_{X})(y_{1} - \\mu_{Y}) + (x_{2} - \\mu_{X})(y_{2}\
  \ - \\mu_{Y}) + \\cdots + (x_{n} - \\mu_{X})(y_{n} - \\mu_{Y})}{n}$$\n\n也就是说，对减去期望后的值进行点积运算，然后取平均。这种形式与单个随机变量的方差非常相似：\n\
  \n$$Var(X) = \\frac{(x_{1} - \\mu_{X})(x_{1} - \\mu_{X}) + (x_{2} - \\mu_{X})(x_{2}\
  \ - \\mu_{X}) + \\cdots + (x_{n} - \\mu_{X})(x_{n} - \\mu_{X})}{n}$$\n\n但两者的含义不同。`Var(X)`\
  \ 描述随机变量偏离期望值的程度，而 `Cov(X, Y)` 描述两个随机变量之间的相关性。\n\n$$\n\\begin{matrix}\n{\\text{Cov}(X,Y)}\
  \ & {= E[(X - E[X])(Y - E[Y])]} \\\\\n\\end{matrix}\n$$\n\n根据期望的线性法则，可以进行如下推导：\n\
  \n$$\n\\begin{matrix}\n{{Cov}(X,Y)} & {= E[(X - \\mu_{X})(Y - \\mu_{Y})]} \\\\\n\
  & {= E[XY - \\mu_{X}Y - \\mu_{Y}X + \\mu_{x}\\mu_{Y}]} \\\\\n& {= E[XY] - \\mu_{X}E[Y]\
  \ - \\mu_{Y}E[X] + \\mu_{x}\\mu_{Y}} \\\\\n& {= E[XY] - \\mu_{x}\\mu_{Y} - \\mu_{x}\\\
  mu_{Y} + \\mu_{x}\\mu_{Y}} \\\\\n& {= E[XY] - \\mu_{x}\\mu_{Y}} \\\\\n& {= E[XY]\
  \ - E[X] E[Y]} \\\\\n\\end{matrix}\n$$\n\n在机器学习中，一个样本可能包含多个特征。例如，一栋房子可能包含面积、房间数量、位置、楼层数等特征。每个特征都可以看作一个随机变量，某些特征之间可能存在关联。特征对机器学习算法的影响会相互制约，消除特征间的相关性或选择低相关性的特征将有助于提高机器学习算法的性能。可以对这些特征进行相关性分析，以帮助选择好的特征或转换原始数据以消除特征间的相关性。\n\
  \n如果一个样本有 3 个特征，它们对应的随机变量分别用 `X1`、`X2` 和 `X3` 表示，可以通过计算它们两两之间的协方差来分析它们之间的相关性。它们之间的协方差值可以用矩阵的形式表示，称为**协方差矩阵**，通常用符号\
  \ `∑` 表示。\n\n$$\n\\begin{matrix}\n{\\sum = \\begin{pmatrix}\n{Cov(X_{1},X_{1})}\
  \ & {Cov(X_{1},X_{2})} & {Cov(X_{1},X_{3})} \\\\\n{Cov(X_{2},X_{1})} & {Cov(X_{2},X_{2})}\
  \ & {Cov(X_{2},X_{3})} \\\\\n{Cov(X_{3},X_{1})} & {Cov(X_{3},X_{2})} & {Cov(X_{3},X_{3})}\
  \ \\\\\n\\end{pmatrix}} \\\\\n\\end{matrix}\n$$\n\n这是一个对称矩阵。如果将每个随机变量的所有可能取值排列起来，所有随机变量的这些可能取值可以表示为一个矩阵：\n\
  \n`X = (X[1], X[2], X[3])`\n\n如果 `X[i]` 是等概率的随机变量，协方差矩阵可以按如下方式计算：\n\n`X = X − E[X]`\n\
  \n`∑ = X^(T)X`\n\n可以用以下 Python 代码进行计算：\n\n```python\nX = X - np.mean(X, axis=0)\n\
  np.dot(X.transpose(), X)\n```\n\n深度学习的核心任务是通过样本数据训练一个函数模型，或者找到一个最优函数来表示或描述这些样本数据。求解最优函数模型归结为一个数学优化问题，更准确地说，是求某个损失函数的最值（极值）问题。在深度学习中，使用**梯度下降法**来求解这个最值问题或求解模型参数。\n\
  \n## 2.1 函数极值的必要条件\n\n函数 `y = f(x)` 在某点 `x[0]` 处取得**最小值**：意味着存在某个正数 `ϵ`，使得对于区间 `(x[0]\
  \ − ϵ, x[0] + ϵ)` 内的每个 x 都满足 `f(x[0]) ≤ f(x)`。`x[0]` 称为函数的**最小值点**，`f(x[0])` 称为函数的**最小值**。\n\
  \n函数 `y = f(x)` 在某点 `x[0]` 处取得**最大值**：意味着存在某个正数 `ϵ`，使得对于区间 `(x[0] − ϵ, x[0] + ϵ)`\
  \ 内的每个 x 都满足 `f(x) ≤ f(x[0])`。`x[0]` 称为函数的**最大值点**，`f(x[0])` 称为函数的**最大值**。\n\n最小值和最大值统称为**极值**，最小值点和最大值点统称为**极值点**。\n\
  \n如果函数 `f(x)` 定义域内的所有 x 都满足 `f(x[0]) ≤ f(x)`，则 `x[0]` 称为函数的**全局最小值点**，`f(x[0])`\
  \ 称为函数的**全局最小值**。\n\n如果函数 `f(x)` 定义域内的所有 x 都满足 `f(x) ≤ f(x[0])`，则 `x[0]` 称为函数的**全局最大值点**，`f(x[0])`\
  \ 称为函数的**全局最大值**。\n\n也就是说，全局最小值是全局范围内的一个最小值，全局最大值是全局范围内的一个最大值。全局最小值和最大值统称为**全局最优**，全局最小值点和最大值点统称为**全局最优点**。\n\
  \n**函数极值的必要条件**：如果 `x[0]` 是函数 `f(x)` 的极值点，且函数在 `x[0]` 处可导，则 `f'(x[0]) = 0` 必须成立。极值点处的导数值必须为\
  \ 0。\n\n例如，前面的函数 `f(x) = x²` 在 `x = 0` 处取得最小值（当然也是全局最小值）且可导，所以在 `x = 0` 处其导数值 `f'(0)\
  \ = 2 × 0 = 0` 必须为 0。\n\n\n\n\n这个命题很容易证明。如果 `x[0]` 是函数 `f(x)` 的极值点，则存在一个区间 `(x[0]\
  \ - ϵ, x[0] + ϵ)` 满足 `f(x[0]) ≤ f(x)`，所以 `f(x) - f(x[0]) ≥ 0`，而：\n\n```\nf'(x_0)\
  \ = lim_{Δx → 0} Δy/Δx = lim_{Δx → 0} (f(x_0 + Δx) - f(x_0))/Δx = lim_{Δx → x_0}\
  \ (f(x) - f(x_0))/(x - x_0)\n```\n\n当 x 从左、右两侧趋向于 `x[0]` 时，`Δx` 分别是负数和正数，而分子始终为正。从右侧\
  \ x 趋向于 `x[0]`，其极限值应 `≥ 0`。从左侧 x 趋向于 `x[0]`，其极限值应 `≤ 0`，且该极限存在，所以其值只能是 0。\n\n根据极限公式，也可以找到一条规律。如果\
  \ `x[0]` 处的导数是正数，说明函数 `f(x)` 在该点附近单调递增，即如果 `x[1] < x[2]`，则 `f(x[1]) < f(x[2])`，即\
  \ `f(x)` 随 x 的增大而增大。或者如果 `Δx` 是正数，则 `Δy` 也是正数。例如，`y = f(x) = x²` 的导数是 `f'(x) = 2x`。当\
  \ x 大于 0 时，导数为正。因此，函数曲线单调递增；当 x 小于 0 时，导数均为负数，因此，函数曲线单调递减，即如果 `x[1] < x[2]`，反而 `f(x[1])\
  \ > f(x[2])`。\n\n例如，函数 `f(x) = x³ - 3x² - 9x + 2`，令其导数 `f'(x) = 0`：\n\n```\nf'(x)\
  \ = 0  ⇒  (x³ - 3x² - 9x + 2)' = 0  ⇒  3x² - 6x - 9 = 0  ⇒  x² - 2x - 3 = 0  ⇒ \
  \ x[1] = -1, x[2] = 3\n```\n\n可以得到两个导数为 0 的点 `x[1] = -1`，`x[2] = 3`。该函数及其导函数 `f'(x)`\
  \ 的单调变化如图 2-1 所示：\n\n**图 2-1** `f'(x) > 0`，函数单调递增，`f'(x) < 0`，函数单调递减\n\n在区间 `(-∞,\
  \ -1]` 中，`f'(x)` 为正数，所以函数 `f(x)` 单调递增；在区间 `(-1, 3)` 中，`f'(x)` 为负数，所以函数 `f(x)` 单调递减；在区间\
  \ `[3, ∞)` 中，`f'(x)` 为正数，所以函数 `f(x)` 单调递增。\n\n下面的代码绘制了该函数及其导函数的曲线，可以更直观地看到单调变化和极值点情况。\n\
  \n```\nimport numpy as np\nimport matplotlib.pyplot as plt\n%matplotlib inline\n\
  \nx = np.arange(-3, 4, 0.01)\nf_x = np.power(x,3) - 3*x**2 - 9*x + 2\ndf_x = 3*x**2\
  \ - 6*x - 9\n\nplt.plot(x, f_x)\nplt.plot(x, df_x)\nplt.xlabel('x axis label')\n\
  plt.ylabel('y axis label')\nplt.legend(['f(x)', \"df(x)\"])\nplt.axvline(x=0, color='k')\n\
  plt.axhline(y=0, color='k')\nplt.show()\n```\n\n![](img/file22.png)\n\n**图 2-2**\
  \ `f(x) = x³ - 3x² - 9x + 2` 及其导函数 `f'(x)` 的函数曲线\n\n注意，上述命题只说明了函数极值点的必要条件，而非充分条件，也就是说，函数\
  \ `x[0]` 处的导数 `f'(x[0]) = 0` 并不意味着 `x[0]` 一定是极值点。例如，`f(x) = x³` 在 `x = 0` 处的导数 `f'(0)`\
  \ 也是 0，但这一点不是函数的极值点。实际上，这是一条单调递增的曲线，如图 2-3 所示。\n\n```\nx = np.arange(-3, 3, 0.01)\n\
  f_x = np.power(x,3)\n\nplt.plot(x, f_x)\nplt.xlabel('x axis label')\nplt.ylabel('y\
  \ axis label')\nplt.axvline(x=0, color='k')\nplt.axhline(y=0, color='k')\nplt.show()\n\
  ```\n\n![](img/file23.png)\n\n**图 2-3** `f(x) = x³` 的函数曲线\n\n显然，函数极值的必要条件可以推广到多元函数，即对于多元函数\
  \ `f(x[1], x[2], ⋯, x[n])`，如果函数在某点 `x* = (x[1]*, x[2]*, ⋯, x[n]*)` 取得极值，且该点梯度存在（即所有偏导数存在），则该点的梯度必为\
  \ 0（即各偏导数值均为 0）。即：\n\n```\n∂f(x_1, x_2, ⋯, x_n)/∂x_i |_{x*} = 0,  i = 1, 2, ⋯, n\n\
  ```\n\n## 2.2 梯度下降法\n\n对于一元函数 `f(x)`，如果在某点 `x` 附近有一个微小变化 `Δx`，则 `f(x)` 的变化 `f(x\
  \ + Δx) - f(x)` 可以用微分形式表示为：\n\n`f(x + Δx) - f(x) ≃ f'(x)Δx`\n\n即在 `x` 附近，如果 `Δx`\
  \ 和 `f'(x)` 同号，则 `f'(x)Δx` 即 `f(x + Δx) - f(x)` 为正数。如果 `Δx` 和 `f'(x)` 异号，则 `f'(x)Δx`\
  \ 即 `f(x + Δx) - f(x)` 为负数。如果 `Δx = -αf'(x)`（其中 `α` 为一个较小的正数），则 `f(x + Δx) - f(x)\
  \ = -αf'(x)²` 为负数，即 `f(x + Δx)` 的值会比 `f(x)` 小。换句话说，`x` 沿着 `f'(x)` 的反方向 `-f'(x)`\
  \ 移动 `Δx`，其函数值 `f(x + Δx)` 比原来的 `f(x)` 小。\n\n如图 2.4 所示，函数 `f(x) = x² + 0.2` 在 `x\
  \ = 1.5` 处的函数值 `f(x)` 为 2.45，导数值 `f'(x)` 为 3.0，为正数，指向 `f(x)` 定义域上 `x` 轴的正方向，即 x\
  \ 轴，如图中长箭头所示。\n\n![](img/file24.png \"fig:\")\n\n**图 2-4** `f'(1.5) = 3.0 > 0`，`Δx`\
  \ 与 `f'(x)` 同号移动，函数值增大，反之函数值减小\n\n令 `α = 0.15`，`Δx = -αf'(x) = -0.45`，沿着这个 `Δx`\
  \ 移动 `x`（图中蓝色箭头方向）到 `x_new = x + Δx = 1.05`，得到新 `x = 1.05` 处的 `f(1.05)` 函数值为 1.3025，即图中曲线上蓝色点的\
  \ y 坐标值。因为 `Δx` 与 `f'(x)` 方向相反（一正一负），所以这个 `f(1.05)` 必定比原来的 `f(1.5)` 小。\n\n就这样不断重复这个过程，即\
  \ `x` 沿着其导数 `f'(x)` 的反方向（`-f'(x)`）移动微小增量 `-αf'(x)`，就能到达新的 `x_new = x - αf'(x)`，这个新\
  \ `x_new` 的函数值 `f(x_new)` 必定比之前的函数值 `f(x)` 小。随着 `x` 接近最小值点的 `x` 值，导数 `f'(x)` 也接近\
  \ 0（因为函数极值点 `x*` 的导数 `f(x*) = 0`），`x` 移动的增量 `Δx` 也越来越接近 0。\n\n这就是**梯度下降法**的思想，即从一个初始\
  \ `x` 开始，用下面的公式不断更新 `x` 的值：\n\n`x = x - αf'(x)`\n\n对于当前的 `x`，沿着其负导数（梯度）方向（即 `-f'(x)`）移动\
  \ `x`，可以使 `f(x)` 不断变小。理想情况下，到达使 `f(x)` 最小的 `x`，此时 `f'(x) = 0`。再迭代更新 `x`，`x` 的值也不再变化。如图\
  \ 2-5 所示，`x` 不断迭代更新，使其不断逼近极值点。\n\n![](img/file25.png \"fig:\")\n\n**图 2-5** `x`\
  \ 沿 `-f'(x)` 移动，函数值不断减小\n\n\n\n\n\n当然，这种移动的步长（即 `-αf'(x)`）不能太大，因为根据导数的定义，上述近似公式仅适用于\
  \ `x` 附近。如果移动步长太大，可能会跳过 `x` 的最优值，导致 `x` 的值不断来回震荡。如图 2-6 所示。\n\n![](img/file26.png\
  \ \"fig:\")\n\n图 2-6 `x` 的变化量 `-αf'(x)` 过大，函数值将会震荡\n\n梯度下降法是寻找近似最优解。为了避免无限迭代，可以使用以下方法来检查是否足够接近最优解：\n\
  \n*   导数（梯度）`f'(x)` 的绝对值足够小。\n*   迭代次数已达到预设的最大迭代次数。\n\n以下是梯度下降法的代码，其中参数 `df` 用于计算函数\
  \ `f(x)` 的导数 `f'(x)`，`x` 是变量的初始值，`alpha` 是学习率，`iterations` 表示迭代次数，`epsilon` 用于检查\
  \ `df=f'(x)` 的值是否接近 0。\n\n```\ndef gradient_descent(df, x, alpha=0.01, iterations=100,\
  \ epsilon=1e-8):\n    history = [x]\n    for i in range(iterations):\n        if\
  \ abs(df(x)) < epsilon:\n            print(\"The gradient is small enough!\")\n\
  \            break\n        x = x - alpha * df(x)\n        history.append(x)\n \
  \   return history\n```\n\n该梯度下降函数将迭代过程中所有更新的 `x` 保存在 Python 列表对象 `history` 中并返回该对象。\n\
  \n对于上述函数 `f(x) = x³ – 3x² – 9x + 2`，其导数 `f'(x) = 3x² – 6x – 9`。如果想求 `x = 1` 附近函数\
  \ `f(x)` 的最小值，可以调用此函数 `gradient_descent()`：\n\n```\ndf = lambda x: 3*x**2 - 6*x\
  \ - 9\npath = gradient_descent(df, 1., 0.01, 200)\nprint(path[-1])\n```\n\n```\n\
  The gradient is small enough!\n2.999999999256501\n```\n\n得到 `f(x)` 的极值点 `x = 2.999999999256501`。可以绘制迭代过程中\
  \ `x` 对应的曲线上的点：\n\n```\nf = lambda x: np.power(x, 3) - 3*x**2 - 9*x + 2\nx = np.arange(-3,\
  \ 4, 0.01)\ny = f(x)\nplt.plot(x, y)\n\npath_x = np.asarray(path) # .reshape(-1,\
  \ 1)\npath_y = f(path_x)\nplt.quiver(path_x[:-1], path_y[:-1], path_x[1:] - path_x[:-1],\
  \ path_y[1:] - path_y[:-1], scale_units='xy', angles='xy', scale=1, color='k')\n\
  plt.scatter(path[-1], f(path[-1]))\nplt.show()\n```\n\n![](img/file27.png)\n\n图\
  \ 2-7 `x` 逐渐收敛到最小值点\n\n其中，matplotlib 的 `quiver` 函数可以用箭头绘制速度向量，其函数格式为：\n\n```\nquiver([X,\
  \ Y], U, V, [C], **kw)\n```\n\n其中 `X`、`Y` 为 1D 或 2D 数组，表示箭头的位置，`U`、`V` 为相同的 1D 或\
  \ 2D 数组，表示箭头的速度（向量）。其他参数请参考官方文档。\n\n对于多元函数，梯度下降法的原理相同，只是用梯度代替导数。\n\n`f(x + Δx) −\
  \ f(x) ≃ ∇f(x)Δx`\n\n以下是来自维基百科的 Beale 函数。\n\n`f(x, y) = (1.5 − x + xy)² + (2.25\
  \ − x + xy²)² + (2.625 − x + xy³)²`\n\n该函数的全局最小值为 `(3, 0.5)`。可以使用以下 Python 代码计算函数值：\n\
  \n```\nf = lambda x, y: (1.5 - x + x*y)**2 + (2.25 - x + x*y**2)**2 + (2.625 - x\
  \ + x*y**3)**2\n```\n\n要绘制该曲面，首先在 `x` 和 `y` 轴上取一些均匀分布的坐标值：\n\n```\nxmin, xmax, xstep\
  \ = -4.5, 4.5, .2\nymin, ymax, ystep = -4.5, 4.5, .2\nx_list = np.arange(xmin, xmax\
  \ + xstep, xstep)\ny_list = np.arange(ymin, ymax + ystep, ystep)\n```\n\n然后根据上述\
  \ `x_list` 和 `y_list` 使用 `np.meshgrid()` 函数获取其交点处的网格点 `(x, y)`，并计算这些网格坐标点对应的函数值：\n\
  \n```\nx, y = np.meshgrid(x_list, y_list)\nz = f(x, y)\n```\n\n最后，可以调用 `plot_surface()`\
  \ 函数绘制该曲面：\n\n```\nax.plot_surface(x, y, z, norm=LogNorm(), rstride=1, cstride=1,\n\
  \                edgecolor='none', alpha=.8, cmap=plt.cm.jet)\n```\n\n完整代码如下：\n\n\
  ```\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom mpl_toolkits.mplot3d\
  \ import Axes3D\nfrom matplotlib.colors import LogNorm\nimport random\n\n%matplotlib\
  \ inline\n\nf = lambda x, y: (1.5 - x + x*y)**2 + (2.25 - x + x*y**2)**2 + (2.625\
  \ - x + x*y**3)**2\n\nminima = np.array([3., .5])\nminima_ = minima.reshape(-1,\
