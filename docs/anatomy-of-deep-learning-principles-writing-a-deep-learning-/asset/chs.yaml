  [dWx, dWh, dbh, dWf, dbf]\")\nfor i in range(len(grads)):\n    print(diff_error(grads[i],\
  \ numerical_grads[i]))\n\nprint(\"grads\", grads[1][:2])\nprint(\"numerical_grads\"\
  , numerical_grads[1][:2])\n```\n\n```\nloss 6.931604253116049\n[dWx, dWh, dbh, dWf,\
