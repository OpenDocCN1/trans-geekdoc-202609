  \n![](img/file200.png \"fig:\")\n图 8-33 针对一组实数问题的 WGAN 训练结果\n\n`D_loss` 是生成数据分布与真实数据分布之间的\
  \ Wasserstein 距离，它随着迭代收敛到 0，表明逐渐收敛。\n\n## 8.8 深度卷积对抗网络 DCGAN\n\n最基本的 GAN 是使用全连接神经网络来表示判别器和生成器函数。对于图像等具有空间结构的数据，GAN\
  \ 的训练不稳定，难以生成高质量的生成数据。Radford 等人提出的深度卷积生成对抗网络是基本 GAN 的扩展，适用于具有空间结构的数据。\n\n判别器是一个二分类函数，可以用卷积神经网络表示。该判别器可以通过卷积（包括池化）操作将图像分辨率从高到低不断降低，直到最后的全连接层转换为代表二分类的分数。生成器如何将低维一维隐向量转换为高维多通道图像（特征图）？\n\
  \n普通卷积操作是一种**下采样**，可以将高分辨率特征图转换为低分辨率特征图，但无法将低维隐向量转换为高维图像，而普通卷积操作恰恰相反。**转置卷积**操作属于**上采样**操作，可以将低分辨率特征图转换为高分辨率特征图。转置卷积也称为**分步长卷积**，部分文献也称为**反卷积**（但反卷积与通常数学意义上的反卷积并非同一概念），因此一般使用前两个术语。如图\
  \ 8-35 所示，使用四个转置卷积层将长度为 100 的向量转换为 3 × 64 × 64 的彩色图像。\n\n图 8-35. 四个转置卷积层将长度为 100\
  \ 的向量转换为 3 × 64 × 64 的彩色图像。\n\n为了使训练更稳定，DCGAN 论文还做了若干改进：判别器网络移除了全连接层，用步长卷积替代池化操作，生成器和判别器网络均使用批量归一化，生成器除输出层使用\
  \ tanh 激活函数外，其余层均使用 ReLU 激活函数，判别器所有层均使用 LeakyReLU 激活函数。\n\n为了实现 DCGAN，必须先实现转置卷积。下面讨论转置卷积的原理和实现。\n\
  \n### 8.8.1 一维向量的转置卷积\n\n对于长度为 5 的输入向量 `x` = (`x`[0], `x`[1], `x`[2], `x`[3], `x`[4])，进行卷积核宽度为\
  \ 3、步长和填充分别为 1 和 0 的一维卷积，过程如图 8-36 所示：\n\n图 8-36 对长度为 5 的输入向量 `x` = (`x`[0], `x`[1],\
  \ `x`[2], `x`[3], `x`[4]) 进行卷积核宽度为 3、步长和填充分别为 1 和 0 的一维卷积过程\n\n如果输入向量长度为 `n`，卷积核宽度为\
  \ `k`，步长为 `s`、左右填充为 `p` 的卷积操作生成的结果张量长度为 $o = \\frac{n - k + 2 * p}{s} + 1$，对上述示例，结果张量长度为\
  \ $o = \\frac{5 - 3 + 0}{1} + 1 = 3$。即若不填充，卷积结果向量的长度往往小于输入向量的长度。\n\n卷积通过卷积核计算并累加一个与卷积核形状大小相同的数据块以获得一个输出值，即一个数据块与卷积核运算产生一个输出值。卷积核按步长沿数据滑动，遇到的每个对应数据块产生一个输出值。\n\
  \n转置卷积与卷积恰好相反。对于输入张量的每个元素，该元素与卷积核的每个元素相乘，产生一个与卷积核形状相同的输出，即输入张量的每个元素将产生与卷积核元素数量相同的元素，如图\
  \ 8-37 所示：\n\n图 8-37 转置卷积：对于输入张量的每个元素，将该元素与卷积核的每个元素相乘，产生与卷积核形状相同的输出\n\n宽度为 3 的卷积核与输入\
  \ `x` = (`x`[0], `x`[1], `x`[2]) 的第一个元素 `x`[0] 对齐，将此 `x`[0] 与卷积核的每个元素相乘得到输出值，卷积核宽度为\
  \ 3，因此产生 3 个输出值。若进行步长为 1 的转置卷积，卷积核滑动到 `x`[1] 产生 3 个输出值，直到输入的最后一个元素，如图 8-38 所示：\n\
  \n图 8-38 宽度为 3 的卷积核作用于长度为 3 的输入一维张量生成由 5 个元素组成的一维张量\n\n图 8-39 是一个具体示例，\n\n图 8-39\
  \ 卷积核 (1,2,-1) 与输入一维张量 (5,15,12) 的转置卷积过程\n\n如图 8-40 所示，在转置卷积操作中，每个元素与卷积核逐元素相乘输出的三个值累加到输出向量对应位置的元素上。\n\
  \n图 8-40 每个元素与卷积核逐元素相乘输出的三个值累加到输出张量对应位置的元素上\n\n如果将图 8-36 中卷积操作的 `z` 作为转置卷积的输入，将\
  \ `x` 作为转置卷积的输出，转置计算过程如图 8-41 所示：\n\n图 8-41 转置卷积是卷积的逆过程。将图 8-36 中卷积的输出 `z` 作为转置卷积的输入，转置卷积产生与卷积输入形状相同的输出\n\
  \n可以看出，转置卷积的计算过程是卷积过程的逆过程，正如卷积的逆向推导是卷积的逆过程。因此，转置卷积的计算过程与卷积的逆向推导过程完全相似，通过卷积核将一个输入值分配并累加到输出向量中。\n\
  \n根据卷积输出与输入向量、步长、填充的关系，可以得到转置卷积输出与输入向量、步长、填充的关系。输入张量长度为 o，步长为 s，左右填充为 p 的转置卷积操作生成的结果张量长度为\
  \ `n` = (`o` − 1) * `s` + `k` − 2 * `p`。对上述示例中的转置卷积操作，结果张量长度为 (3 − 1) * 1 + 3 −\
  \ 0 = 5\n\n卷积可以使用矩阵乘法实现其前向计算和逆向推导。因此，转置卷积也可以使用矩阵乘法实现其前向计算和逆向推导。转置卷积的前向计算完全类似于卷积的逆向推导，转置卷积的逆向推导类似于卷积的前向计算。\n\
  \n回顾第 6.3.3 节一维卷积的逆向推导过程，计算公式为：\n\n`dx`[`row`] = `dz`[`row`] * `K`[`col`]^(`T`)\n\
  \n将 `dz`[`row`] 视为转置卷积的输入，`dx`[`row`] 视为转置卷积的输出，可得到转置卷积前向计算的矩阵乘法公式：\n\n`zz`[`row`]\
  \ = `xx`[`row`] * `K`[`col`]^(`T`)\n\n其中 `xx`[`row`] 为转置卷积的输入，`zz`[`row`] 为转置卷积的输出，`KK`[`col`]\
  \ 为卷积核的列向量表示。对上述具体示例，计算过程为：\n\n$$\n\\begin{matrix} {z_{row} = x_{row}k_{col} = \\\
  begin{bmatrix} x_{0} \\\\ x_{1} \\\\ x_{2} \\\\ \\end{bmatrix}\\begin{bmatrix} k_{0}\
  \ & k_{1} & k_{2} \\\\ \\end{bmatrix} = \\begin{bmatrix} 5 \\\\ 15 \\\\ 12 \\\\\
  \ \\end{bmatrix}\\begin{bmatrix} 1 & 2 & {- 1} \\\\ \\end{bmatrix} = \\begin{bmatrix}\
  \ 5 & 15 & 12 \\\\ 15 & 30 & {- 15} \\\\ 12 & 24 & {- 12} \\\\ \\end{bmatrix}} \\\
  \\ \\end{matrix}\n$$\n\n类似于卷积的逆向推导，该扁平化 `zz`[`row`] 的每一行代表一次分配计算，每一行都需要累加到最终输出 `zz`\
  \ 的对应位置（如图 8-40 所示）。\n\n将 `zz`[`row`] 转换为 `zz` 的过程可使用卷积逆向推导将 `ddx`[`row`] 转换为 `dxx`\
  \ 的函数 `row2im()` 完成。\n\n因此，转置卷积的前向计算一般按卷积的逆向推导过程进行。同理，转置卷积的逆向导数可按卷积的前向计算过程进行。作为练习，读者可尝试编写一维转置卷积前向计算和逆向推导的代码。\n\
  \n再看几个不同步长和填充的转置卷积过程。图 8-42 是输入长度为 3、卷积核长度为 3、步长为 2、填充为 0 的转置卷积：\n\n图 8-42 输入长度为\
  \ 3、卷积核长度为 3、步长为 2、填充为 0 的转置卷积\n\n图 8-43 是输入长度为 3、卷积核长度为 3、步长为 2、左右填充长度为 1 的转置卷积：\n\
  \n图 8-43 输入长度为 3、卷积核长度为 3、步长为 2、左右填充长度为 1 的转置卷积\n\n可以看出，填充长度为 1 时输出最左侧和最右侧的元素不计入输出张量。只要将转置卷积比作卷积的逆过程，就能理解包含步长和填充的转置卷积计算过程。\n\
  \n### 8.8.2 二维转置卷积\n\n正如一维转置卷积是一维卷积的逆过程，二维转置卷积是二维卷积的逆过程。如图 8-44 所示，对于卷积操作，将下方视为输入、上方视为输出，意味着\
  \ 4 × 4 的输入经过 3 × 3 卷积核、步长为 1、填充为 0 的卷积得到形状为 2 × 2 的输出。同一张图也可视为上方为输入、下方为输出，意味着 2\
  \ × 2 的输入使用 3 × 3 卷积核进行步长为 1、填充为 0 的转置卷积得到形状为 4 × 4 的输出。\n\n图 8-44 二维转置卷积是二维卷积的逆过程。输入为上方\
  \ 2 × 2 矩阵，经过 3 × 3 卷积核输出下方 4 × 4 矩阵\n\n二维转置卷积的矩阵乘法实现与一维转置卷积的矩阵乘法实现过程相同，即分别利用对应二维卷积的逆向推导和前向计算过程来实现二维转置卷积的前向计算和逆向推导过程。\n\
  \n因此，只需修改之前已实现的卷积操作的 `Conv_fast` 类，将 `Conv_fast` 类的 `backward()` 和 `forward()` 方法转换为转置卷积实现类\
  \ `Conv_transpose` 的 `forward()` 和 `backward()` 方法。例如，对于输入 `x`，可将其视为损失函数关于卷积输出的梯度，首先将其展平为矩阵，即形状类似于\
  \ (`N` * `oH` * `oW`, `F`) 的矩阵，第二轴代表输出通道数，第一轴代表每个元素，从而转换为 `x`[`row`] 的矩阵形式，代码为：\n\
  \n```\n```\n\n\n\n\n`X_row = X.transpose(0,2,3,1).reshape(-1,F)`\n\n然后根据反向推导公式，可以计算出该转置卷积输出的扁平化矩阵\
  \ `Z_row`，即：\n\n```\nZ_row = np.dot(X_row,K_col.T)\n```\n\n最后，根据卷积的反向推导过程，必须将该 `Z_row`\
  \ 每一行的分布累加到最终输出 `Z` 中。此过程可直接使用 `row2im()` 函数或 `row2im_indices()` 函数完成：\n\n```\n\
  Z = row2im_indices(Z_row,Z_shape,self.kH,self.kW,S =self.S,P = self.P)\n```\n\n\
  同理，转置卷积的反向推导类似于卷积的正向计算过程。首先，必须将损失函数关于 `Z` 的梯度 `dz` 通过 `im2row()` 或 `im2row_indices()`\
  \ 函数展平为矩阵 `dZ_row`，其每一行代表一个数据块，然后计算转置卷积输入 `X` 的梯度：\n\n```\ndX_row = dZ_row @ K_col\n\
  ```\n\n可得到关于 `X` 的梯度的扁平化矩阵 `dX_row`，最后将该扁平化矩阵重塑为与 `X` 形状相同的四维张量，即：\n\n```\ndX =\
  \ dX_row.reshape(N,self.H,self.W,self.C)\ndX = dX.transpose(0,3,1,2)\n```\n\n同理，模型\
  \ `K` 的梯度 `dK_col` 的计算过程也类似，将扁平化矩阵 `dK_col` 的形状重塑为与 `K` 相同的形状更为直接：\n\n```\ndK_col\
  \ = self.X_row.T@dZ_row\ndK = dK_col.reshape(self.K.shape)\n```\n\n根据上述分析，可编写如下转置卷积类\
  \ `Conv_transpose`：\n\n```\nclass Conv_transpose():\n    def __init__(self, in_channels,\
  \ out_channels, kernel_size, stride=1,padding=0):\n        super().__init__()\n\
  \        self.C = in_channels\n        self.F = out_channels\n        self.kH =\
  \ kernel_size\n        self.kW = kernel_size\n        self.S = stride\n        self.P\
  \ = padding\n        # filters is a 3d array with dimensions (num_filters, self.K,\
  \ self.K)\n        # you can also use Xavier Initialization.\n        #self.K =\
  \ np.random.randn(self.F, self.C, self.kH, self.kW) #/(self.K*self.K)\n        #\
  \ self.K = np.random.randn(self.C, self.F, self.kH, self.kW) #/(self.K*self.K)\n\
  \        self.K = np.random.normal(0,1,(self.C, self.F, self.kH, self.kW))\n   \
  \     self.b = np.zeros((1,self.F)) #,1))\n        self.params = [self.K,self.b]\n\
  \        self.grads = [np.zeros_like(self.K),np.zeros_like(self.b)]\n        self.X\
  \ = None\n        self.reset_parameters()\n\n    def reset_parameters(self):\n \
  \       kaiming_uniform(self.K, a=math.sqrt(5))\n        if self.b is not None:\n\
  \            fan_in, _ = calculate_fan_in_and_fan_out(self.K)\n            #fan_in\
  \ = self.F\n            bound = 1 / math.sqrt(fan_in)\n            self.b[:] = np.random.uniform(-bound,bound,(self.b.shape))\n\
  \n    def forward(self,X):\n        '''\n        X:       (N,C,H,W)\n        K:\
  \       (F,C,kH,kW)\n        Z:       (N,F,oH,oW)\n        X_row:   (N*oH*oW, C*kH*kW)\n\
  \        K_col:    (C*kH*kW, F)\n        Z_row = X_row*K_col:  (N*oH*oW, C*kH*kW)*(C*kH*kW,\
  \ F) =  (N*oH*oW, F)\n        dK_col = X_row.T @dZ_row: (C*kH*kW,N*oH*oW)*(N*oH*oW,\
  \ F) = (C*kH*kW,F)\n        dX_row = dZ_row@K_col.T = (N*oH*oW, F) * (F, C*kH*kW)\
  \ = (N*oH*oW, C*kH*kW)\n        '''\n        #convert to multi-channel\n       \
  \ self.X = X\n        if len(X.shape)==1:\n            X = X.reshape(X.shape[0],1,1,1)\n\
  \        elif len(X.shape)==2:\n            X = X.reshape(X.shape[0],X.shape[1],1,1)\n\
  \        self.N,self.H,self.W = X.shape[0], X.shape[2], X.shape[3]\n        S,P,kH,kW\
  \ = self.S, self.P,self.kH,self.kW\n        self.oH =self.S*(self.H-1)+kH-2*P\n\
  \        self.oW = self.S*(self.W - 1)+kW - 2*P\n        K = self.K\n        # Convert\
  \ (N,F,oH,oW) to (N,oH,oW,F) and flatten to (-1,F)\n        F = X.shape[1]\n   \
  \     #assert(F==self.F)\n        X_row = X.transpose(0,2,3,1).reshape(-1,F)   #(N*oH*oW,F)\n\
  \        K_col = K.reshape(K.shape[0],-1).transpose()  #Flattening\n        Z_row\
  \ = np.dot(X_row,K_col.T)\n        Z_shape = (self.N,self.F,self.oH,self.oW)\n \
  \       Z = row2im_indices(Z_row,Z_shape,self.kH,self.kW,S =self.S,P = self.P)\n\
  \        self.b = self.b.reshape(1,self.F,1,1)\n        Z+= self.b\n        self.X_row\
  \ = X_row\n        return Z\n\n    def __call__(self,X):\n        return self.forward(X)\n\
  \n    def backward(self,dZ):\n        N,F,oH,oW = dZ.shape[0], dZ.shape[1],dZ.shape[2],\
  \ dZ.shape[3]\n        S,P,kH,kW = self.S, self.P,self.kH,self.kW\n        dZ_row\
  \ = im2row_indices(dZ,self.kH,self.kW,S=self.S,P=self.P)\n        K_col = self.K.reshape(self.K.shape[0],-1).transpose()\
  \  #Flattening\n        dX_row = dZ_row @ K_col    # (o,f) = (9,18)(18,1) = (9,1)\n\
  \        dK_col = self.X_row.T@dZ_row  #(1,9)(9,18)     #Z_row = X_row @ K_col\n\
  \        dK = dK_col.reshape(self.K.shape)\n        db = np.sum(dZ,axis=(0,2,3))\n\
  \        db = db.reshape(-1,F)\n        # (N*H*W, C)\n        dX = dX_row.reshape(N,self.H,self.W,self.C)\n\
  \        dX = dX.transpose(0,3,1,2)\n        self.grads[0] += dK\n        self.grads[1]\
  \ += db\n        return dX\n\n    #-------- add the gradient of the regular term\
  \ ---\n    def reg_grad(self,reg):\n        self.grads[0]+= 2*reg * self.K\n\n \
  \   def reg_loss(self,reg):\n        return  reg*np.sum(self.K**2)\n\n    def reg_loss_grad(self,reg):\n\
  \        self.grads[0]+= 2*reg * self.K\n        return  reg*np.sum(self.K**2)\n\
  ```\n\n**注意**：有时人们会使用卷积操作来模拟转置卷积的计算过程，但这种模拟过程不仅复杂，而且计算量大，因此没有实际意义。感兴趣的读者可参考以下网址：\n\
  \n[`deeplearning.net/software/theano/tutorial/conv_arithmetic.html`](http://deeplearning.net/software/theano/tutorial/conv_arithmetic.html)\n\
  \n### 8.8.3 卷积生成对抗网络 DCGAN 的实现\n\n借助转置卷积，可将低维隐向量转换为高分辨率图像。因此，卷积对抗网络的生成器可用带有转置卷积层的神经网络表示，而判别器可用普通卷积神经网络表示。这种对抗生成网络即为卷积生成对抗网络（DCGAN）。接下来，使用该\
  \ DCGAN 网络训练 Mnist 手写数字集，使生成器能从隐向量输出类似于训练集中手写数字图像的图像。\n\n首先，仍将 Mnist 手写数字集读取为训练样本：\n\
  \n```\nimport data_set as ds\nimport matplotlib.pyplot as plt\n%matplotlib inline\n\
  train_set, valid_set, test_set = ds.read_mnist()\ntrain_X, train_y = train_set\n\
  valid_X, valid_y = valid_set\ntest_X, test_y = valid_set\nprint(train_X.dtype)\n\
  print(train_X.shape)\nprint(train_y.dtype)\nprint(train_y.shape)\nds.draw_mnists(plt,train_X,range(10))\n\
  plt.show()\ntrain_X = train_X.reshape(train_X.shape[0],1,28,28)\nprint(train_X.shape)\n\
  ```\n\n```\nfloat32\n(50000, 784)\nint64\n(50000,)\n```\n\n![](img/file201.png \"\
  fig:\")\n(50000, 1, 28, 28)\n\n然后使用转置卷积类、卷积类及其他网络层类，分别定义代表生成器和判别器的神经网络 `G` 和 `D`：\n\
  \n```\nfrom util import *\nfrom NeuralNetwork import *\nfrom GAN import *\nnp.random.seed(100)\n\
  random_name = 'no'\nrandom_value =  0.01\nG = NeuralNetwork()\nz_dim = 100\nngf=28\n\
  ndf=28\nnc=1\nG.add_layer(Conv_transpose(z_dim, ngf*4,4,1,0))   # ->(ngf*4) x 4\
  \ x 4\nG.add_layer(BatchNorm(ngf*4))\nG.add_layer(Relu()) #Leaky_relu(0.2))\n```\n\
  \n\n\n\n#### 生成器网络构建\n\n```python\nG.add_layer(Conv_transpose(ngf*4, ngf*2, 3, 2,\
  \ 1))   # 2(4-1)+3-2 -> (ngf*2) x 7 x 7\nG.add_layer(BatchNorm(ngf*2))\nG.add_layer(Relu())\
  \ # Leaky_relu(0.2)\nG.add_layer(Conv_transpose(ngf*2, ngf, 4, 2, 1))     # 2(7-1)+4-2\
  \ -> (ngf) x 14 x 14\nG.add_layer(BatchNorm(ngf))\nG.add_layer(Relu()) # Leaky_relu(0.2)\n\
  G.add_layer(Conv_transpose(ngf, nc, 4, 2, 1))       # 2(14-1)+4-2 -> (nc) x 28 x\
  \ 28\nG.add_layer(Tanh())\n```\n\n#### 判别器网络构建\n\n```python\n# self.oH = (self.H\
  \ - kH + 2*P) // S + 1\n\nD = NeuralNetwork()\n\nD.add_layer(Conv_fast(nc, ndf,\
  \ 4, 2, 1))   # (28-4+2)//2+1=14 -> ndf x 14 x 14\nD.add_layer(BatchNorm(ndf))\n\
  D.add_layer(Leaky_relu(0.2))\nD.add_layer(Conv_fast(ndf, 2*ndf, 4, 2, 1))   # (14-4+2)//2+1=7\
  \ -> (2*ndf) x 7 x 7\nD.add_layer(BatchNorm(2*ndf))\nD.add_layer(Leaky_relu(0.2))\n\
  D.add_layer(Conv_fast(2*ndf, 4*ndf, 3, 2, 1))   # (7-3+2)//2+1=4 -> (4*ndf) x 4\
  \ x 4\nD.add_layer(BatchNorm(4*ndf))\nD.add_layer(Leaky_relu(0.2))\nD.add_layer(Conv_fast(4*ndf,\
  \ 1, 4, 1, 0))   # (4-4+0)//1+1=1 -> 1 x 1 x 1\n# D.add_layer(Sigmoid())\n```\n\n\
  #### 权重初始化\n\n```python\ndef weights_init(layer):\n    classname = layer.__class__.__name__\n\
  \    if classname.find('Conv') != -1:\n        W = layer.params[0]\n        W[:]\
  \ = np.random.normal(0.0, 0.02, (W.shape))\n    elif classname.find('BatchNorm')\
  \ != -1:\n        W = layer.params[0]\n        W[:] = np.random.normal(1.0, 0.02,\
  \ (W.shape))\n        b = layer.params[1]\n        b[:] = 0\n\nG.apply(weights_init)\n\
  ```\n\n#### 优化器配置\n\n```python\n# 定义用于训练 G 和 D 的优化器算法对象\nreg = None # 1e-5\nD_lr\
  \ = 0.0002\nG_lr = 0.0002\nbeta_1, beta_2 = 0.5, 0.999\n\nD_optimizer = Adam(D.parameters(),\
  \ D_lr, beta_1, beta_2)\nG_optimizer = Adam(G.parameters(), G_lr, beta_1, beta_2)\n\
  ```\n\n#### 结果展示函数\n\n```python\ndef show_result_mnist(D_losses=None, G_losses=None,\
  \ m=10):\n    # fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(10, 4))\n    # ax1.clear()\n\
  \    if D_losses and G_losses:\n        i = np.arange(len(D_losses))\n        plt.plot(i,\
  \ D_losses, '-')\n        plt.plot(i, G_losses, '-')\n        plt.legend(['D_losses)',\
  \ 'G_losses'])\n        plt.show()\n    ## ax2.clear()\n    z = np.random.randn(m,\
  \ z_dim)\n    x_fake = G(z)\n    ds.draw_mnists(plt, x_fake, range(m))\n    plt.show()\n\
  ```\n\n#### 训练过程\n\n```python\n# ----------- 开始训练 -------------\nimport time\n\n\
  batch_size = 64 # len(X)\ndata_it = data_iterator_X(train_X, batch_size, shuffle=True,\
  \ repeat=False)\n# noise_it = iter(Noise_z(batch_size, z_dim))\nnoise_it = noise_z_iterator(batch_size,\
  \ z_dim)\niterations = 1500\n\n# losses = GAN_train(D, G, D_optimizer, G_optimizer,\
  \ data_it, noise_it, BCE_loss_grad, iterations, reg, 3, 1, show_result_2)\n# losses\
  \ = GAN_train(D, G, D_optimizer, G_optimizer, data_it, noise_it, BCE_loss_grad,\
  \ iterations, reg, show_result_mnist, 10, 10)\n\nstart = time.time()\nloss_fn =\
  \ BCE_loss_grad\nn_epoch = 20 # 200\nprint_n = 20\n\nfor epoch in range(1, n_epoch\
  \ + 1):\n    D_losses, G_losses = [], []\n    data_it = data_iterator_X(train_X,\
  \ batch_size, shuffle=True, repeat=False)\n    for batch_idx, x_real in enumerate(data_it):\n\
  \        x_fake = G(next(noise_it))\n        D_loss = D_train(D, D_optimizer, x_real,\
  \ x_fake, loss_fn, reg)\n        G_loss = G_train(D, G, G_optimizer, next(noise_it),\
  \ loss_fn, reg)\n        D_losses.append(D_loss)\n        G_losses.append(G_loss)\n\
  \        # print(D_loss, G_loss)\n        # if batch_idx > 10: break\n        if\
  \ batch_idx % print_n == 0:\n            print('[%d:/%d]: loss_d: %.3f, loss_g:\
  \ %.3f' % (\n                (batch_idx), epoch, np.mean(np.array(D_losses)), np.mean(np.array(G_losses))))\n\
  \            show_result_mnist(D_losses, G_losses)\n\n    D.save_parameters('MNIST_DCGAN_D_params.npy')\n\
  \    G.save_parameters('MNIST_DCGAN_G_params.npy')\n    print('[%d/%d]: loss_d:\
  \ %.3f, loss_g: %.3f' % (\n            (epoch), n_epoch, np.mean(np.array(D_losses)),\
  \ np.mean(np.array(G_losses))))\n    # break\n\ndone = time.time()\nelapsed = done\
  \ - start\nprint(\"训练时间: %d 秒\" % (elapsed))\n```\n\n\n\n\n请从作者的博客下载完整代码（`https://hwdong-net.github.io`）。\n\
