  \        for t in range(target_length):\n```\n\n\n\n\n\n```python\noutput_t, hidden_t,\
  \ output_hs_t = self.forward_step(input_t, hidden_t, encoder_outputs)\n\noutput_hs.append(output_hs_t)\n\
