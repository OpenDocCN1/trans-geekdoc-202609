- "# 深度学习原理解析：从零编写深度学习库\n\n\n\n## 简介\n\n本书以通俗易懂的方式介绍了深度学习的基本原理和实现过程，并使用 Python 的 `numpy`\
  \ 库从零开始构建自己的深度学习库，而非使用现有的深度学习库。在介绍 Python 编程、微积分和概率统计的基础知识基础上，按照深度学习的发展脉络，依次介绍了回归模型、神经网络、卷积神经网络、循环神经网络、生成网络等深度学习的核心基础知识。在通俗分析原理的同时，提供了详细的代码实现过程。这就像不是教你如何使用武器和手机，而是教你如何自己制造武器和手机。本书不是现有深度学习库的使用教程，而是从\
  \ 0 开发深度学习库的解析。这种将原理与代码实现从 0 结合的方法，能让读者更好地理解深度学习的基本原理和流行深度学习库的设计思路。\n\n## 前言\n\n\
  自计算机发明以来，让机器拥有人类般的智能一直是计算机科学家的目标。自 1956 年“人工智能”概念提出以来，人工智能研究经历了多次从高峰到低谷、从低谷到高峰的起伏。在\
  \ AI 的发展过程中，从基于数理逻辑的基于规则的推理到状态空间搜索推理，从专家系统到统计学习，从群体智能算法到机器学习，从神经网络到支持向量机，不同的人工智能技术曾轮流领跑。\n\
  \n在过去 6 年里，使用深度神经网络的深度学习大放异彩，突飞猛进。AlphaGo 击败人类围棋冠军、自动驾驶、机器翻译、语音识别、深度换脸等深度学习的成功应用持续吸引着人们的目光。作为机器学习的一个分支，深度学习让传统神经网络技术重获新生，并在所有人工智能技术中确立了现代人工智能霸主的地位。\n\
  \n深度学习没有复杂晦涩的理论。从原理上讲，它仍然是传统的神经网络，即将一些简单的神经元函数组合成一个复杂函数，并使用简单的梯度下降法，基于实际样本数据学习神经网络中的模型参数。其成功主要归功于计算机硬件，尤其是并行计算性能日益强大的图形处理器\
  \ GPU 以及日益增多的大数据。\n\n未来社会将是人工智能社会。人工智能将无处不在。许多工作将被人工智能取代。\n\n借助 `tensorflow`、`pytorch`、`caffe`\
  \ 等一些深度学习平台，小学生都能轻松使用深度学习库进行人脸识别、语音识别等各种应用。他们所做的就是直接调用这些平台的 API 来定义深度神经网络的模型结构并调整训练参数。这些平台让深度学习变得非常简单，让深度学习走进寻常百姓家，人工智能不再神秘。从高校到企业，各行各业的人都在利用深度学习进行各种研究和应用。\n\
  \n像任何技术一样，只有透彻理解技术背后的原理，才能更好地应用该技术。网上有大量零散的文章讲解深度学习原理，也有一些深度学习课程和教程。书籍仍然是系统学习的重要途径。现有的深度学习书籍主要分为几类：一类是面向专家或专业研究人员、侧重数学理论的书籍。这些书籍如同学术论文，难以让读者理解。这些书籍缺乏对原理和代码实现的深入分析，读者即使费力理解了原理，可能仍不知如何实现。另一类是工具书，主要介绍如何使用各种深度学习平台，极少讲解原理，使读者无法理解代码背后的原理，只能照葫芦画瓢。还有一些只是科普书，各种技术都尝个鲜，原理和代码往往蜻蜓点水。也有极少数书籍既讲原理又有代码实现，并尽量避免数学公式推导。\n\
  \n作者认为平台教程类书籍有时效性，书籍出版周期通常长达一年，平台接口可能已经发生了一些变化甚至重大变化。对于变化的平台，此类书籍几乎毫无价值。原理类书籍应通俗易懂，尽量避免复杂晦涩的数学，但完全抛弃数学家发展了数千年的经典高等数学，用小学数学描述函数进行推导，也不适合具备高等数学知识的读者，并非最优选择。然而，市面上特别缺乏通俗易懂、介绍原理及如何从底层实现深度学习而非使用深度学习库的书籍。\n\
  \n为了照顾数学基础薄弱的读者，本书第一章不仅介绍 Python 编程的必要知识，还尽可能通俗地介绍了一些微积分和概率的必要知识。在此基础上，本书由浅入深，从最简单的回归模型过渡到神经网络模型，采用从问题到概念的方法通俗易懂地解释基本概念和原理。避免长篇大论，避免“字斟句酌”，用简单的例子和简练通俗的语言剖析模型和算法的核心原理。在理解原理的基础上，进一步使用\
  \ Python 的 `numpy` 库从底层实现代码，使读者在原理和实现上豁然开朗。通过阅读本书，读者可以在没有任何深度学习平台的情况下，循序渐进地从 0 构建一个深度学习库。最后，作为对比，介绍了深度学习平台\
  \ `Pytorch` 的使用，使读者能轻松学会使用该深度学习平台，有助于读者更深入地理解这些平台的设计思路，从而更好地掌握和使用这些深度学习平台。\n\n本书不仅适合没有任何深度学习知识的初学者，也适合有使用深度学习库经验、想了解其底层实现原理的从业者。本书特别适合作为高校的深度学习教材。\n\
  \n本书相关资源（包括算法代码）可在作者网站 [`hwdong-net.github.io`](https://hwdong-net.github.io) 找到。\n\
  \n本书英文版是在中文版基础上使用谷歌翻译翻译的。我们将持续改进翻译质量，希望读者能帮助我纠正错误。\n\n\n\n\n\n# 我的邮箱\nhwdong.cn@gmail.com\n\
  \n# 电子书链接（英文版）\n[`leanpub.com/dle/`](https://leanpub.com/dle/)\n\n# 电子书链接（中文版）\n\
  [`leanpub.com/dl_0`](https://leanpub.com/dl_0)\n\n### 1.1 Python 快速入门\n\nPython\
  \ 是一门易学的解释型脚本语言，最初设计用于编写自动化脚本，后来用于 Web 开发和科学计算。近年来，随着数据科学和人工智能的发展，Python 已成为增长最快、最流行的编程语言，确立了其在以数据处理和机器学习为代表的人工智能领域的统治地位。\n\
  \n#### 1.1.1 Python 安装\n\n作为一种解释型语言，Python 程序的每条语句都由 `python` 解释器解释并执行；即 Python\
  \ 解释器逐句解释并执行 Python 程序的语句。\n\n##### Python 解释器安装\n\n在 Ubuntu 系统上，可以在终端窗口中输入以下命令：\n\
  \n```\nsudo apt-get update   \nsudo apt-get install python3.8\n```\n\n在 Mac 系统上，可以通过包管理工具\
  \ Homebrew 安装 Python：\n\n```\nbrew install python3\n```\n\nWindows 平台可以从官方网站 [`https://www.python.org/downloads`](https://www.python.org/downloads)\
  \ 下载并运行 Python3 安装程序。安装过程中勾选 \"Add Python3.8 to Path\"，安装程序会自动将 Python 解释器的路径添加到系统路径中。\n\
  \n在终端窗口中输入 Python 解释器命令 `python` 以打开 Python 解释器，将显示 Python 版本信息。如果显示以下信息，则表示安装成功。\n\
  \n```\nC:\\Users\\hwdon>python\nPython 3.8.2 (tags/v3.8.2:7b3ab59, Feb 25 2020,\
  \ 23:03:10) [MSC v.1916 64 bit (AMD64)] on win32\nType \"help\", \"copyright\",\
  \ \"credits\" or \"license\" for more information.\n>>>\n```\n\nPython 之所以流行，原因在于大量的程序库（包），例如\
  \ `numpy` 是多维数组（张量）库，`matplotlib` 是绘图库，这些包可以通过 `pip` 安装命令进行安装。例如：\n\n```\npython\
  \ -m pip install -U pip\npip install numpy\npython -m pip install -U matplotlib\n\
  ```\n\n##### jupyter notebook 编程环境\n\n现在许多人使用 `jupyter notebook` Python 开发环境。`jupyter\
  \ notebook` 可以使用浏览器作为 Python 程序的编程环境。一个 `jupyter notebook` 文档由一些单元格（单元）组成，它们有不同的类型，主要是代码单元格和\
  \ Markdown 单元格。前者用于编写 Python 代码，后者用于编写 Markdown 格式（类似 Word）的文档，其中可以编写文本、公式等。`Jupyter\
  \ Notebook` 将代码和笔记有机地结合在一个文档中。它已成为 Python 程序员编写代码和记录想法的最常用工具。\n\n可以输入以下命令来安装 `jupyter`\
  \ 环境：\n\n```\npip install --upgrade pip\npip install jupyter\n```\n\n然后在命令行输入 `jupyter\
  \ notebook` 打开一个用于 Python 编程的浏览器窗口。\n\n##### Anaconda 安装工具\n\n像 `Anaconda` 这样的集成安装工具可以自动安装\
  \ `python` 解释器和常用开发包，如 `numpy`、`matplotlib` 和 `jupyter notebook`。在官方网站 [`https://www.anaconda.com`](https://www.anaconda.com)\
  \ 下载并安装 `Anaconda`。\n\n> **注意**：如果您使用 `Anaconda` 安装 Python 及其包，则无需单独安装 Python 解释器。\n\
  \n`Anaconda` 安装程序还附带 `spyder`，一个具有图形用户界面的 Python 集成开发环境。当然，读者也可以使用其他 Python 开发环境，如\
  \ `Pycharm` 等。\n\n#### 1.1.2 对象、`print()` 函数、类型转换、注释、变量、`input()` 函数\n\n##### 1.\
  \ 对象\n\nPython 中的所有值（如整数 `2`）都以对象的形式存在，一个对象包含值（即对象的内容）、数据类型和 `id`（相当于地址）等信息。Python\
  \ 是一种动态类型的高级语言。所谓“动态类型”是指 Python 可以根据对象的值自动推断其类型。值的类型可以用 Python 内置函数 `type()` 查询。例如：\n\
  \n```\ntype(\"http://hwdong-net.github.io\")\n```\n\n```\nstr\n```\n\n```\ntype(2)\n\
  ```\n\n```\nint\n```\n\n```\ntype(3.14)\n```\n\n```\nfloat\n```\n\n```\ntype(False)\n\
  ```\n\n```\nbool\n```\n\n```\nid(3)\n```\n\n```\n140705546753760\n```\n\n```\nid(3.14)\n\
  ```\n\n```\n1857260776048\n```\n\n> **注意**：布尔类型 `bool` 只有 2 个值 `True` 和 `False`，用于表示逻辑命题的真假。\n\
  \n##### 2. 打印函数 `print()`\n\n您可以输出一系列用逗号 `,` 分隔的对象，例如：\n\n```\nprint(2, 3.14)\n\
  print(\"youtube channel：hwdong\", True)\n```\n\n```\n2 3.14\nyoutube channel: hwdong\
  \ True\n```\n\n`print()` 函数有一个关键字参数 `end`，表示输出信息后的默认结束字符。其默认值为 `\\n`，即输出后换行。以下代码将空格字符串\
  \ `\" \"` 传递给 `end` 参数；然后打印输出后将输出空格而不是换行。例如：\n\n```\nprint(1, 2, 3, end=\" \") \
  \ # 输出 3 个对象后，输出一个空格而不是换行\nprint(4, 5, 6)\n```\n\n```\n1 2 3 4 5 6\n```\n\n#####\
  \ 3. 类型转换\n\n对于基本类型，可以使用类型名称将另一种类型的对象转换为该类型的对象。例如：\n\n```\nprint(int(3.14))    \
  \             # 将 3.14 从浮点类型转换为整数类型\nprint(type(int(3.14)))           # 输出 int(3.14)\
  \ 的类型\nprint(type(\"3.14\"))\nprint(float(\"3.14\"))\nprint(type(float(\"3.14\"\
  )))       # 将 \"3.14\" 从字符串类型转换为浮点类型\n```\n\n```\n3\n<class 'int'>\n<class 'str'>\n\
  3.14\n<class 'float'>\n```\n\n##### 4. 注释\n\n以 `#` 开头的文本行称为**注释**，注释不是程序语句，而是对程序代码的说明。\n\
  \n##### 5. 变量\n\n您可以使用运算符 `=` 给对象一个名称，这称为对象的**变量名**。或者说变量引用了一个对象。\n\n```\npi = 3.14\n\
  print(pi)\nprint(2 * pi)\n```\n\n\n\n\n变量名可以随时引用其他对象。变量名不是“一刀切”的，这与 C 等其他语言不同。\n\
  \n```\na = 3.14                        # a 是对象 3.14 的引用\nb = a                 \
  \          # b 和 a 引用同一个对象 3.14\na = \"hwdong-net.github.io\"      # a 引用新的字符串对象\
  \ \"hwdong-net.github.io\"\nprint(a)\nprint(b)\n```\n\n```\nhwdong-net.github.io\n\
  \    3.14\n```\n\n在这段代码中，变量名 `a` 首先引用对象 `3.14`，然后引用字符串 `\"hwdong-net.github.io\"\
  `。如图 1-1 所示。\n\n![](img/file0.png \"fig:\")  \n\n图 1-1 左图是执行 `b=a` 后的结果，右图是执行 `a=\
  \ \"hwdong-net.github.io\"` 后的结果\n\n###### 6. `input()` 函数\n\n用于接受键盘输入，输入为字符串。`input()`\
  \ 可以接受一个“提示字符串”。例如：\n\n```\nname = input()\nprint(\"name: \",name)\nscore = input(\"\
  Please enter your score:\")\nprint(\"Name: \",name,\"Score: \",score)\ntype(score)\n\
  ```\n\n```\nWang An\n    name: Wang An\n    Please enter your score: 56.8\n    Name:\
  \ Wang An Score: 56.8\n\n    str\n```\n\n`input()` 始终输入 `str` 类型对象，但可以使用类型转换将输入字符串转换为其他基本类型。\n\
  \n```\nscore = input(\"Please enter your score:\")\nprint(type(score))\nscore =\
  \ float(input(\"Please enter your score:\"))\ntype(score)\n```\n\n```\nPlease enter\
  \ your score: 70.5\n    <class 'str'>\n    Please enter your score: 80.5\n\n   \
  \ float\n```\n\n\n运算符可用于直接操作（对象）值。不同类型的值支持不同的操作。例如，算术运算 `+`、`-`、`*`、`/`、`%`、`//`、`**`\
  \ 可用于数值类型（`int`、`float`）。其中，`%`、`//`、`**` 分别代表取余、整除和幂运算。例如：\n\n```\nx = 15\ny =\
  \ 2\nprint('x+y=',x+y)\nprint('x - y =', x - y)\nprint('x * y =', x*y)\nprint('x/y=',x/y)\n\
  print('x % y =',x%y)              # 求余数\nprint('x // y =',x//y)            # 整除\n\
  print('x ** y =',x**y)            # 幂运算\n```\n\n```\nx + y = 17\n    x - y = 13\n\
  \    x * y = 30\n    x/y = 7.5\n    x % y = 1\n    x // y = 7\n    x ** y = 225\n\
  ```\n\n比较运算符 `==`、`!=`、`>`、`<`、`>=`、`<=` 用于比较两个值，分别代表等于、不等于、大于、小于、大于等于、小于等于，比较运算的结果是\
  \ `bool` 类型值（`True` 或 `False`）。例如：\n\n```\nx = 15\ny = 2\nprint('x > y is',x>y)\n\
  print('x < y is',x<y)\nprint('x == y is',x==y)\nprint('x != y is',x!=y)\nprint('x\
  \ >= y is',x>=y)\nprint('x <= y is',x<=y)\n```\n\n```\nx > y is True\n    x < y\
  \ is False\n    x == y is False\n    x != y is True\n    x >= y is True\n    x <=\
  \ y is False\n```\n\n逻辑运算符 `and`、`or` 和 `not` 分别代表**逻辑与**、**逻辑或**和**逻辑非**。在逻辑运算中，`True`\
  \ 或非零或非空对象为真（`True`），而 `False` 或 `0` 或空对象为假（`False`）。运算符的运算规则如下：\n\n*   对于对象 `x`，当\
  \ `x` 为真（`True` 或非零或非空）时，`not x` 为 `False`；当 `x` 为假（`False` 或 `0` 或空）时，`not x` 为\
  \ `True`（真）。\n\n```\nprint(not 0,end = ' ')               # print() 默认输出后换行，\n \
  \                                      # 向 end 参数传递空格 ' '，\n                   \
  \                    # 使其仅输出空格而不换行\nprint(not \"\",end = ' ')       \nprint(not\
  \ False,end = ' ')\nprint(not 2,end = ' ')\nprint(not \"hwdong\")   \n```\n\n```\n\
  True True True False False\n```\n\n*   对于 2 个对象 `x`、`y`，当 `x` 为真时，`x or y` 的结果为\
  \ `x`；当 `x` 为假时，`x or y` 的结果为 `y`。\n\n```\nprint(3 or 2,end = ' ')            #\
  \ 因为 3 为真，3 or 2 的结果为 3\nprint(0 or 2,end = ' ')            # 因为 0 为假，0 or 2 的结果为\
  \ 2\nprint(False or True, end = ' ')\nprint(\"\" or 2)                     # 因为空字符串\
  \ \"\" 为假，\"\" or 2 的结果为 2\n```\n\n```\n3 2 True 2\n```\n\n*   对于 2 个对象 `x`、`y`，当\
  \ `x` 为真时，`x and y` 的结果为 `y`；当 `x` 为假时，`x and y` 的结果为 `x`。\n\n```\nprint(3 and 2,\
  \ end = ' ')       # 因为 3 为真，3 and 2 的结果为 2\nprint(0 and 2, end = ' ')       # 因为\
  \ 0 为假，0 and 2 的结果为 0\nprint(\"\" and 2, end = ' ')      # 因为空字符串 \"\" 为假，\n   \
  \                             #   \"\" and 2 的结果为 \"\"，所以无输出\nprint(False and True)\n\
  ```\n\n```\n2 0 False\n```\n\nPython 还有移位运算符（如按位与 `&`、按位或 `|`、异或 `^`、取反 `~`、左移 `<<`、右移\
  \ `>>`）和其他运算符。感兴趣的读者可自行查阅相关资料。\n\n运算符 `=` 也可以与其他算术运算符和位运算符结合使用。例如：\n\n`+=` `-=`\
  \ `*=` `/=` `%=` `**=` `&=` `|=` `^=` `~=` `<<=` `>>=`\n\n```\nx = 3\nprint(id(x))\n\
  x+=2 # x = x+2\nprint(id(x))\n```\n\n`x+=2` 等价于 `x = x+2`，意味着将原 `x` 对象加上 `2` 得到一个对象，然后变量名\
  \ `x` 引用该加法运算的结果对象。因此，前后的变量名 `x` 代表 2 个不同的对象。\n\n运算符 `in` 和 `not in` 用于判断一个值（对象）是否在容器对象中。例如：\n\
  \n```\nprint(\"h\"in\"hwdong\")\nprint(\"h\"not in\"hwdong\")\n```\n\n```\nTrue\n\
  \    False\n```\n\n###### 下标运算符 `[]`\n\n可以通过给**下标运算符 `[]`** 传递下标来访问容器对象的元素，例如：\n\
  \n```\ns = \"hwdong\"\nprint(s[0], s[1], s[2], s[3], s[4], s[5])\nprint(s[-6],s[-5],s[-4],s[-3],s[-2],s[-1])\n\
  ```\n\n下标从 0 开始，字符串对象 `s` 由一系列字符组成，第一个字符的下标为 0，第二个字符的下标为 1，……，长度为 `n` 的字符串下标为 `0,\
  \ 1, 2, ..., n-1`。\n\n下标也可以是负整数，其中 `-1` 指最后一个字符，`-n` 指第一个字符。\n\n###### 字符串格式化\n\n\
  使用格式字符 `%` 将某些数据格式化为字符串，创建新字符串。例如：\n\n```\ns2 = '%s %s %f' % (\"The score\", \"\
  of LiPing is: \", 78.5)\nprint(s2)\n```\n\n格式字符串 `'%s %s %f'` 中的 `%s` 和 `%f` 分别表示后面三个输出项（`\"\
  The score\"`、`\"of LiPing is: \"`、`78.5`）前两个为字符串，最后一个为实数。\n\n使用字符串 `str` 的 `format()`\
  \ 方法格式化字符串，即依次用 `format()` 方法中的数据替换字符串中的占位符 `{}`。例如：\n\n```\nprint (\"{} {} {}\"\
  .format(\"The score\", \"of LiPing is: \", 78.5)) \n```\n\n### 1.1.4 控制语句\n\n程序通常“自上而下”顺序执行每条语句。有时需要根据某个条件是否满足，决定是否执行某些语句，或重复执行某些语句。Python\
  \ 的条件语句和循环语句是根据条件决定如何执行某些语句的控制语句。\n\n##### 1. `if` 语句\n\n```\nif expression:\n \
  \     program block\n```\n\n表示如果 `if` 关键字后表达式的结果为 `True` 或非零，则执行其中的程序块，例如：\n\n```\n\
  score = float(input())\nif score>=60:\n   print(\"Congratulations!\")\n   print(\"\
  Passed the exam.\")\n```\n\n```\n60.5\n    congratulations!\n    passed the exam.\n\
  ```\n\n**注意**：\n\n*   `if` 表达式后必须跟冒号：\n*   在 Python 中，**对齐方式** 表示一组语句属于同一个程序块，例如\
  \ `if` 程序块中的 2 条语句\n\nPython 中属于同一程序块的代码必须正确缩进，否则 Python 解释器会报错。例如：\n\n```\nscore\
  \ = float(input())\nif score>=60:\n   print(\"Congratulations!\")\n print(\"Passed\
  \ the exam.\")\n```\n\nFile \"\", line 4  \n\nprint(\"Passed the exam.\")  \n\n\
  ^\n\n\n\n\n# Python 控制流与容器类型\n\n##### IndentationError\n\n`IndentationError: unindent\
  \ does not match any outer indentation level`\n\n##### if 语句\n\n###### if-else 结构\n\
  \n`if` 和 `else` 可以组合使用，表示“如果……否则……”。即当 `if` 中的条件表达式为 `True` 时，执行 `if` 子句中的程序块，否则执行\
  \ `else` 子句中的程序块。`else` 后面没有条件表达式。格式如下：\n\n```\nif expression:\n  code block 1\n\
  else:\n  code block 2\n```\n\n示例：\n\n```\nscore = float(input(\"Please enter the\
  \ score:\"))\nif score >= 60:                          # If score>=60, execute the\
  \ program block in if\n    print(\"Congratulations!\")\n    print(\"Passed the exam.\"\
  )\nelse:                                  # Otherwise, execute the else block\n\
  \    print(\"You failed the test.\")\n    print(\"Keep working hard, come on!\"\
  )\n```\n\n```\nPlease enter grade: 67.5\n\ncongratulations!\n\npassed the exam.\n\
  ```\n\n###### if-elif-else 结构\n\n对于多重条件，可以使用 `if` 的另一种形式 `if...elif...else`，表示“如果……否则如果……否则”。\n\
  \n```\nif expression 1:\n   code block 1\nelif expression 2:\n   code block 2\n\
  elif expression 3:\n   code block 3\nelse:\n   code block\n```\n\n含义：如果 `expression\
  \ 1` 的结果为 `True`，则执行 `expression 1` 中的“程序块 1”，不再执行其他程序块；否则如果 `expression 2` 的结果为\
  \ `True`，则执行 `expression 2` 中的“程序块 2”；否则如果 `expression 3` 的结果为 `True`，则执行 `expression\
  \ 3` 中的“程序块 3”；如果前面的表达式全为 `False`，则执行 `else` 子句中的程序块。\n\n示例：\n\n```\nscore = float(input(\"\
  Please enter the student's score: \"))\nif score < 60:                   # If score<60,\
  \ execute this if block\n    print(\"Failure\")\nelif score < 70:              \
  \   # Otherwise, if score<70, execute this elif block\n    print(\"Pass\")\nelif\
  \ score < 80:                 # Otherwise, if score<80, execute this elif block\n\
  \    print(\"Medium\")\nelif score < 90:                 # Otherwise, if score<90,\
  \ execute this elif block\n    print(\"Good\")\nelse:                          #\
  \ Otherwise (other cases), execute this else block\n    print(\"excellent\")\n```\n\
  \n```\nPlease enter student grade: 90.5\n\nexcellent\n```\n\n##### 2. while 语句\n\
  \n`while` 语句的格式如下：\n\n```\nwhile expression:\n      code block\n```\n\n即当关键字 `while`\
  \ 中的 `expression` 为 `True` 时，重复执行其中的程序块。\n\n示例 1：\n\n```\ni = 1\ns = 0\nwhile i\
  \ <= 100:\n   s = s + i     # equivalent to s += i            \n   i += 1\nprint(s)\n\
  ```\n\n```\n5050\n```\n\n示例 2：统计键盘输入的一组学生成绩的平均分：\n\n```\ntotal_score = 0\ni = 0\n\
  score = float(input(\"Please enter the student's score:\"))\nwhile True:\n    total_score\
  \ += score\n    i += 1\n    score = float(input(\"Please enter the student's score:\"\
  ))\n    if score < 0:\n        break                       # keyword break is used\
  \ to break out of the loop\n    \nprint('The average score is:', total_score / i)\n\
  ```\n\n```\nPlease enter student grade: 45.6\nPlease enter student grade: 56.7\n\
  Please enter student grade: 89.7\nPlease enter student grade: 78.6\nPlease enter\
  \ student grade: -2\nAverage grade: 67.65\n```\n\n在循环的程序块中嵌套了一个 `if` 条件语句，如果条件语句表达式\
  \ `score < 0` 为 `True`，则执行其中的 `break` 语句。`break` 是 Python 的关键字，用于跳出循环语句，即不再执行循环语句。\n\
  \n##### 3. for 语句\n\n`for` 关键字也表示循环语句，意为迭代访问容器对象或可迭代对象中的每个元素。格式为：\n\n```\nfor e\
  \ in container:\n   code block\n```\n\n表示迭代遍历容器对象 `container` 中的每个元素 `e`，并执行其中的程序块语句。\n\
  \n示例：\n\n```\nfor ch in \"hwdong\":\n    print(ch, end=\",\")\n```\n\n```\nh,w,d,o,n,g,\n\
  ```\n\n依次迭代访问字符串中的每个元素，即每个字符，然后用 `print()` 函数输出字符 `ch`。\n\n#### 1.1.5 Python 常用容器类型\n\
  \n正如字符串是一些字符的容器一样，Python 提供了列表、元组、集合、字典等容器类型。\n\n##### 1. list (列表)\n\n列表 `list`\
  \ 是一组数据元素（对象）的有序序列。定义列表对象用一对左右方括号 `[ ]` 括起来，数据元素之间用逗号分隔。\n\n示例：\n\n```\na = [2,\
  \ 5, 8]\nprint(a)\ntype(a)\n```\n\n```\n[2, 5, 8]\n\nlist\n```\n\n列表中的数据元素可以是不同类型，甚至可以包含其他对象的列表对象：\n\
  \n```\nmy_list = [2, 3.14, True, [3, 6, 9], 'python']\nprint(my_list)\nprint(type(my_list))\
  \       # Print the type of my_list, that is, the list type\n```\n\n```\n[2, 3.14,\
  \ True, [3, 6, 9], 'python']\n\n<class 'list'>\n```\n\n另一个示例：\n\n```\na = [[1, 2,\
  \ 3], [4, 5, 6]]\nprint(a)\n```\n\n```\n[[1, 2, 3], [4, 5, 6]]\n```\n\n###### 索引\n\
  \n与字符串一样，可以通过下标访问元素：\n\n```\nprint(\"my_list[0]:\", my_list[0])\nprint(\"my_list[3]:\"\
  , my_list[3])\nprint(\"my_list[-2]:\", my_list[-1])\n```\n\n```\nmy_list[0]: 2\n\
  my_list[3]: [3, 6, 9]\nmy_list[-2]: python\n```\n\n列表对象的元素可以通过下标修改：\n\n```\nprint(my_list)\n\
  my_list[-2] = [8, 9]\nprint(my_list)\n```\n\n```\n[2, 3.14, True, [3, 6, 9], 'python']\n\
  [2, 3.14, True, [8, 9], 'python']\n```\n\n即下标 `-2` 的元素值指向新对象 `[8, 9]`，如图 1-2 所示：\n\
  \n![](img/file204.png)\n\n图 1-2 给列表元素赋值不同对象使列表元素指向不同对象\n\n###### 切片\n\n可以使用 `[start:end:step]`\
  \ 来访问列表对象按起始下标、结束下标、步长筛选出的子列表。这种访问列表对象的方式称为**切片**。\n\n```\nprint(my_list)\nprint(my_list[2:4])\n\
  print(my_list[0:4:2])\n```\n\n```\n[2, 3.14, True, [8, 9], 'python']\n[True, [8,\
  \ 9]]\n[2, True]\n```\n\n`step` 的默认值为 1。如果不指定起始下标 `start`，默认为 0；如果不指定结束下标 `end`，默认为最后一个元素之后的位置。例如：\n\
  \n```\nlist_2 = my_list[:]  # all elements\nprint(list_2)\n```\n\n```\n[2, 3.14,\
  \ True, [8, 9], 'python']\n```\n\n返回所有元素的列表。**注意**：切片操作会创建新的列表对象。因此以下代码会输出不同的 `id`\
  \ 值：\n\n```\nprint(id(my_list))\nprint(id(list_2))\n```\n\n```\n1535447525504\n\
  1535447326144\n```\n\n如果切片操作放在赋值语句的左边，表示修改切片对应的子列表内容：\n\n```\nprint(my_list)\nmy_list[2:4]\
  \ = [13, 9]\nprint(my_list)\n```\n\n```\n[2, 3.14, True, [8, 9], 'python']\n[2,\
  \ 3.14, 13, 9, 'python']\n```\n\n修改后的列表如图 1-3 所示：\n\n![](img/file205.png)\n\n图 1-3\
  \ 通过切片替换列表的部分内容\n\n###### for 遍历所有元素\n\n与字符串一样，当然可以用 `for` 循环等访问列表对象中的元素。\n\n```\n\
  for e in my_list:\n    print(e, end=\" \")\n```\n\n```\n2 3.14 True [8, 9] python\n\
  ```\n\n甚至可以用 `for` 循环迭代遍历一个容器或可迭代对象来创建新的列表对象。\n\n```\nalist = [e**2 for e in [0,\
  \ 1, 2, 3, 4, 5]]\nprint(alist)\n```\n\n```\n[0, 1, 4, 9, 16, 25]\n```\n\n表示对 `[0,\
  \ 1, 2, 3, 4, 5]` 的每个元素 `e` 计算 `e**2`，并用这些值创建一个列表对象。这种在 `[]` 中通过迭代计算值来创建新列表对象的公式称为**列表推导式**。也可以包含更复杂的计算公式，如包含条件语句：\n\
  \n```\nalist = [0, 1, 2, 3, 4, 5]\nalist = [x ** 2 for x in alist if x % 2 == 0]\n\
  print(alist)\n```\n\n```\n[0, 4, 16]\n```\n\n\n\n\n# Python 内置数据结构与函数\n\n##### 内置函数\
  \ `range(n)`\n\nPython 的内置函数 `range(n)` 是一个**迭代器对象**，它生成 0 到 n 之间的整数（不包括 n）。迭代器对象不是容器，但你也可以使用\
  \ `for` 来遍历该对象的元素。\n\n```python\nfor e in range(6):  \n    print(e, end=' ')\nprint()\n\
  ```\n\n```\n0 1 2 3 4 5\n```\n\n可以通过遍历迭代器对象来创建列表对象：\n\n```python\nalist = [e**2\
  \ for e in range(6)]\nprint(alist)\n```\n\n```\n[0, 1, 4, 9, 16, 25]\n```\n\n#####\
  \ 2. tuple (元组)\n\n与列表类似，元组也是一组数据元素（对象）的有序序列，即每个元素也有唯一的下标。使用圆括号而非方括号来定义元组。例如：\n\n\
  ```python\nt = ('python', [2, 5], 37, 3.14, \"https://hwdong.net\")\nprint(type(t))\n\
  print(t[1:4])\nprint(t[-1:-4:-1])\n```\n\n```\n<class 'tuple'>\n([2, 5], 37, 3.14)\n\
  ('https://hwdong.net', 3.14, 37)\n```\n\n列表中的元素可以被修改。\n\n```python\nprint(alist)\n\
  alist[1] = 22\nprint(alist)\n```\n\n```\n[0, 1, 4, 9, 16, 25]\n[0, 22, 4, 9, 16,\
  \ 25]\n```\n\n元组中的元素不能被修改，就像字符串中的元素不能被修改一样。\n\n```python\nt[1] = 22\n```\n\n```\n\
  TypeError: 'tuple' object does not support item assignment\n```\n\n**注意：** 与列表不同，使用\
  \ `()` 创建的是可迭代对象（生成器表达式）而不是元组对象，例如：\n\n```python\nnums = (x**2 for x in range(6))\n\
  print(nums) \nfor e in nums:\n    print(e, end=\" \")\n```\n\n```\n<generator object\
  \ <genexpr> at 0x...>\n0 1 4 9 16 25\n```\n\n这是因为元组对象不可修改，不可能通过每次生成一个值就逐渐添加到元组中来创建元组对象。\n\
  \n##### 3. set (集合)\n\n集合是一个无序且不包含重复元素的集合。集合是由一对花括号 `{}` 包围的、逗号分隔的元素组成。元素的类型可以不同。例如：\n\
  \n```python\ns = {5, 5, 3.14, 2, 'python', 8}\nprint(type(s))\nprint(s)\n```\n\n\
  ```\n<class 'set'>\n{2, 3.14, 5, 8, 'python'}\n```\n\n可以使用 `add()` 和 `remove()`\
  \ 函数向集合添加和删除一个元素。列表对象可以使用 `append()` 或 `insert()` 函数添加或插入元素；`pop()` 用于删除最后一个元素，`remove()`\
  \ 用于删除第一个指定值的元素。\n\n```python\ns.add(\"hwdong\")\nprint(s)\ns.remove(\"hwdong\"\
  )\nprint(s)\nalist.append(\"hwdong\")\nprint(alist)\nalist.insert(2, \"net\")\n\
  print(alist)\nalist.pop()\nprint(alist)\nalist.remove(\"net\")\nprint(alist)\n```\n\
  \n```\n{2, 3.14, 5, 8, 'hwdong', 'python'}\n{2, 3.14, 5, 8, 'python'}\n[0, 22, 4,\
  \ 9, 16, 25, 'hwdong']\n[0, 22, 'net', 4, 9, 16, 25, 'hwdong']\n[0, 22, 'net', 4,\
  \ 9, 16, 25]\n[0, 22, 4, 9, 16, 25]\n```\n\n但像元组这样的不可变对象没有用于添加元素的 `append()` 或 `insert()`\
  \ 等函数。以下代码是错误的：\n\n```python\nt.append(\"hwdong\")\n```\n\n```\nAttributeError:\
  \ 'tuple' object has no attribute 'append'\n```\n\n可以使用 `{}` 推导式创建集合对象，例如：\n\n```python\n\
  nums = {x**2 for x in range(6)}\nprint(nums) \n```\n\n```\n{0, 1, 4, 9, 16, 25}\n\
  ```\n\n##### 4. dict (字典)\n\n字典是“键值对”键值对的无序集合。每个元素以“键: 值”的形式存储。例如：\n\n```python\n\
  d = {1: 'value', 'key': 2, 'hello': [4, 7]}\nprint(type(d))\nprint(d)\n```\n\n```\n\
  <class 'dict'>\n{1: 'value', 'key': 2, 'hello': [4, 7]}\n```\n\n需要传递键（key，也称为关键字）来访问字典中对应键的元素值。例如：\n\
  \n```python\nd['hello']\n```\n\n```\n[4, 7]\n```\n\n如果某个键对应的元素不存在，则通过该键访问元素是非法的，例如：\n\
  \n```python\nd[3]\n```\n\n```\nKeyError: 3\n```\n\n但你可以给一个不存在的键赋值，这样一个“键值对”元素就会被添加到集合中。例如：\n\
  \n```python\nd[3] = \"python\"\nprint(d)\nprint(d[3])\n```\n\n```\n{1: 'value',\
  \ 'key': 2, 'hello': [4, 7], 3: 'python'}\npython\n```\n\n你可以定义一个表示学生信息并以姓名为键的字典对象：\n\
  \n```python\nstudents = {\n    \"LiPing\": [21, \"Compu01\", 15370203152],\n   \
  \ \"ZhangWei\": [20, \"Compu02\", 17331203312],\n    \"ZhaoSi\": [22, \"mecha03\"\
  , 16908092516]\n}\nprint(students)\nprint(students[\"ZhangWei\"])\n```\n\n```\n\
  {'LiPing': [21, 'Jike 01', 15370203152], 'ZhangWei': [20, 'Jike 02', 17331203312],\
  \ 'ZhaoSi': [22, 'Mechanical 03', 16908092516]}\n[20, 'Jike 02', 17331203312]\n\
  ```\n\n可以通过 `for...in` 循环语句访问字典中的元素，例如：\n\n```python\nfor name in students:\n  \
  \  info = students[name]\n    print('{}\\'s info: {} '.format(name, info))   \n\
  ```\n\n```\nLiPing's info: [21, 'Jike 01', 15370203152]\nZhangWei's info: [20, 'Jike\
  \ 02', 17331203312]\nZhaoSi's info: [22, 'Mechanical 03', 16908092516]\n```\n\n\
  当然，也可以使用 `{}` 推导式创建字典对象，例如：\n\n```python\npoints = {x: x**2 for x in range(6)}\n\
  print(points) \n```\n\n```\n{0: 0, 1: 1, 2: 4, 3: 9, 4: 16, 5: 25}\n```\n\n####\
  \ 1.1.6 函数\n\nPython 通过关键字 `def` 定义函数，给一段程序块起一个名字，然后可以通过函数名调用并执行该函数块中的代码。例如：\n\n\
  ```python\ndef hwdong():\n    print(\"My youtube channel is: \", \"hwdong\")   \
  \          # 调用内置函数 print()\n    print(\"My station B number is: hw-dong\")\n  \
  \  print(\"My blog is: https://hwdong-net.github.io\")\n```\n\n调用该函数 `hwdong()`：\n\
  \n```python\nhwdong()\nprint()            # 调用内置函数 print()\nhwdong()\nprint()  \
  \          # 调用内置函数 print()\nhwdong()\n```\n\n```\nMy youtube channel is: hwdong\n\
  My B station number is: hw-dong\nMy blog is: https://hwdong-net.github.io\n\nMy\
  \ youtube channel is: hwdong\nMy B station number is: hw-dong\nMy blog is: https://hwdong-net.github.io\n\
  \    \nMy youtube channel is: hwdong\nMy B station number is: hw-dong\nMy blog is:\
  \ https://hwdong-net.github.io\n```\n\n函数可以有参数，这样在调用函数时，可以将相应的参数传递给该函数，例如下面的计算 `x**n`\
  \ 的函数：\n\n```python\ndef pow(x, n):    \n    ret = 1\n    for i in range(n): # 0,\
  \ 1, 2, ..., n-1\n        ret *= x # ret = ret * x\n    return ret             \
  \        # \"return ret\" 返回函数的值\n```\n\n由关键字 `return` 表示的语句称为返回语句，函数执行到 `return`\
  \ 时返回（结束函数执行），并可以返回一个值。\n\n调用该函数可以将两个实参传递给函数的形参 `x` 和 `n`。例如：\n\n```python\nprint(pow(3,\
  \ 2))    # 3 传给 x，2 传给 n\nprint(pow(2, 4))\n```\n\n```\n9\n16\n```\n\n函数 `pow()`\
  \ 调用的返回值被传递给函数 `print()` 以打印出返回值。\n\n函数的参数可以有默认值。如果调用函数时未提供对应的参数，该参数将使用其默认值。\n\n\
  ```python\ndef pow(x, n=2):   \n    ret = 1\n    for i in range(n):\n        ret\
  \ *= x\n    return ret\n```\n\n该函数参数 `n` 的默认值为 2，即计算 `x**2`。调用该函数时，可以向形参 `n` 传递实参，也可以不传递。\n\
  \n```python\nprint(pow(3.5))     # 3.5 传给 x，n 的默认值为 2\nprint(pow(3.5, 3))\n```\n\
  \n\n\n\n\n##### 函数内部的语句与递归\n\n函数内部可以包含调用其他函数的语句。函数也可以在内部调用自身，这种函数称为**递归函数**。下面是一个计算正整数\
  \ `n` 阶乘的函数：当 `n=1` 时直接返回 1，否则将 `n!` 转换为 `n*(n-1)!`。\n\n```python\ndef fact(n):\n\
  \    if n == 1:                 # 如果 n 等于 1，直接返回值 1\n        return 1\n    return\
  \ n * fact(n - 1)     # 如果 n 大于 1，返回 n 与 fact(n-1) 的乘积\n\nfact(4)              \
  \          # 输出: 24\n```\n\n```\n24\n```\n\n当然，也可以使用循环来计算 `n! = 1 * 2 * 3 * ...\
  \ * n`。\n\n```python\ndef fact(n):\n    ret = 1\n    i = 1\n    while i <= n:\n\
  \        ret *= i\n        i += 1\n    return ret\n\nfact(4)                   \
  \     # 输出: 24\n```\n\n```\n24\n```\n\n##### math 包\n\n许多数学函数库定义在 `math` 包中。要使用该包的函数，需要先导入它（`import`）。\n\
  \n```python\nimport math\nprint(math.sqrt(2))\n```\n\n```\n1.4142135623730951\n\
  ```\n\n`import... as` 可以为导入的包指定别名，例如：\n\n```python\nimport math as mt\nprint(mt.sqrt(2))\n\
  print(mt.pow(3.5, 2))\n```\n\n```\n1.4142135623730951\n12.25\n```\n\n再看一个例子：\n\n\
  ```python\nimport math             \n\ndef circle(r):\n    area = math.pi * r **\
  \ 2\n    perimeter = 2 * math.pi * r\n    return area, perimeter    \n\narea, p\
  \ = circle(2.5)   \nprint(\"The area and circumference of a circle with a radius\
  \ of 2.5 are: %5.2f,%5.2f\" % (area, p))\narea, p = circle(3.5)\nprint(\"The area\
  \ and circumference of a circle with a radius of 3.5 are: %5.2f,%5.2f\" % (area,\
  \ p))\n```\n\n```\nThe area and circumference of a circle with a radius of 2.5 are:\
  \ 19.63,15.71\nThe area and circumference of a circle with a radius of 3.5 are:\
  \ 38.48,21.99\n```\n\n函数可以返回多个值，实际上是作为元组对象返回的。\n\n```python\nret = circle(2.5) \
  \ # (area, perimeter) \nprint(type(ret))\narea, p = ret               \nprint(area,\
  \ p)\n```\n\n```\n<class 'tuple'>\n19.634954084936208 15.707963267948966\n```\n\n\
  ##### 全局变量与局部变量\n\n定义在函数外部的变量称为**全局变量**，定义在函数内部的变量称为**局部变量**。全局变量属于全局命名空间，函数的局部变量属于函数的局部命名空间。不同命名空间中可以存在同名变量而互不冲突。函数不能直接访问外部全局变量，例如：\n\
  \n```python\nglobal_x = 6\n\ndef f():\n    x = 3\n    global_x = 5\n    print(x,\
  \ global_x)\n\nf()    \nprint(global_x)\n```\n\n```\n3 5\n6\n```\n\n函数内部的语句 `global_x\
  \ = 5` 并未修改外部全局变量 `global_x`，而是定义了一个指向对象 5 的局部变量 `global_x`，这对外部全局变量 `global_x`\
  \ 没有影响。因此，函数 `f()` 执行结束后，内部局部变量被销毁，全局变量 `global_x` 仍为 6。\n\n如果想在函数内部访问并修改全局变量，需要使用关键字\
  \ `global` 在函数内部声明该变量为全局变量，例如：\n\n```python\nglobal_x = 6\n\ndef f():\n    global\
  \ global_x\n    x = 3\n    global_x = 5\n    print(x, global_x)\n\nf()    \nprint(global_x)\n\
  ```\n\n```\n3 5\n5\n```\n\n函数内部的 `global_x` 被声明为外部全局变量 `global_x`。修改它即修改外部全局变量 `global_x`。因此，函数\
  \ `f()` 执行后的输出语句打印的是 5 而不是 6。\n\n修改全局变量的另一种方式是将全局变量作为参数传递给函数，但该全局变量必须是非基本类型的对象。因为当基本类型对象作为参数传递时，函数形式参数引用的是实际参数引用对象的副本，而非同一对象。例如：\n\
  \n```python\nglobal_x = 6\na = [1, 2, 3]\n\ndef f(y, z):    \n    x = 3\n    y =\
  \ 5\n    z[0] = 10\n    print(y)\n    print(z)\n    \nf(global_x, a)    \nprint(global_x)\n\
  print(a)\n```\n\n```\n5\n[10, 2, 3]\n6\n[10, 2, 3]\n```\n\n如图 1-4 所示，当 `global_x`\
  \ 传递给 `y` 时，`y` 引用的是 `global_x` 指向对象的副本，而非同一对象；当 `a` 传递给 `z` 时，`z` 与 `a` 引用的是同一对象。\n\
  \n![](img/file206.png)\n\n**图 1-4** 函数参数传递时，基本类型参数传递副本对象而非引用\n\n##### 匿名函数 / Lambda\
  \ 函数\n\n对于简短的函数，可以使用关键字 `lambda` 定义一个无函数名的函数，例如：\n\n```python\nlambda arguments:\
  \ expression\n```\n\n该函数没有函数名，但有参数 `arguments`。\n\n```python\nlambda x: x ** 2\n\
  ```\n\n通常使用 `=` 运算符给这个 lambda 函数起一个名字，例如：\n\n```python\ndouble = lambda x: x **\
  \ 2\n```\n\n通过 `double` 引用调用匿名函数：\n\n```python\ndouble(3.5)\n```\n\n```\n12.25\n\
  ```\n\n##### 嵌套函数与闭包\n\n定义在另一个函数内部的函数称为**嵌套函数**。\n\n```python\ndef print_msg(msg):\
  \      # 外部函数\n    def printer():       # 嵌套函数\n        print(msg)\n    return printer\
  \       # 返回嵌套函数\n\nanother = print_msg(\"Hello\")\nanother()\n```\n\n```\nhello\n\
  ```\n\n嵌套函数可以访问外层作用域的变量，例如 `printer()` 函数可以访问 `print_msg()` 函数的局部变量（包括参数 `msg`）。\n\
  \n```python\ndef make_pow(n):\n    def pow(x):\n        return x ** n  # pow() 可以访问\
  \ make_pow() 的变量（即 n）\n    return pow\n```\n\n`make_pow()` 返回的函数对象 `pow()` 可以访问\
  \ `make_pow()` 的变量（即 `n`）。\n\n```python\npow3 = make_pow(3)    # 给返回的嵌套函数 pow()\
  \ 起名 pow3\n                    \npow5 = make_pow(5)    # 给返回的嵌套函数 pow() 起名 pow5\n\
  \nprint(pow3(9))\nprint(pow5(3))\nprint(pow5(pow3(2)))\n```\n\n```\n729\n243\n32768\n\
  ```\n\n##### yield 与生成器\n\n可以通过关键字 `yield` 定义生成器函数，生成器是一个返回迭代器（对象）的函数。\n\n```python\n\
  def infinite_sequence():\n    num = 0\n    while True:\n        yield num\n    \
  \    num += 1\n```\n\n生成器函数 `infinite_sequence()` 通过 `yield` 返回一个可迭代对象：\n\n```python\n\
  iterator = infinite_sequence()\nprint(next(iterator))\nprint(next(iterator))\n```\n\
  \n```\n0\n1\n```\n\n使用变量名 `iterator` 引用生成器返回的可迭代对象，可以使用 `next` 函数获取迭代对象的一个值。也可以使用\
  \ `for` 遍历该可迭代对象：\n\n```python\nfor i in infinite_sequence():\n    print(i, end=\"\
  \ \")\n    if i > 5:\n        break\n```\n\n```\n0 1 2 3 4 5 6\n```\n\n#### 1.1.7\
  \ 类与对象\n\n**类**（class）是对抽象概念的描述，它描述了属于同一概念的所有对象的共同属性，这些属性包括：数据属性和方法属性。数据属性描述这类对象的状态，方法属性描述这类对象具有什么功能。类是一种数据类型，它刻画了该类型所有可能值的共同特性，例如\
  \ `int` 类型刻画了所有整数的特征。\n\n前面提到的 `str`、`list` 等都是类。通常可以通过类名创建类对象，类对象是一个具体的对象。例如：\n\
  \n\n\n\n\n```\ns = str(\"http://hwdong.net\")\nprint(type(s)) # str\nlocation =\
  \ s.find(\"hwdong\")       # 通过 str 的 find() 方法查询是否有子串，\n                      \
  \              # 并返回子串的位置\nprint(location)\nalist = list(range(6))            #\
  \ [0,1,2,3,4,5] 列表\nblist = alist.copy()              # 通过 list 的 copy() 方法创建 alist\
  \ 的副本列表\nblist[2] = 20\nprint(alist)\nprint(blist)\n```\n\n```\n<class 'str'>\n\
  7\n[0, 1, 2, 3, 4, 5]\n[0, 1, 20, 3, 4, 5]\n```\n\n正如你所见，可以使用**成员访问运算符 (`.`)** 通过类对象访问**类方法**，以便在此对象上执行某些操作（访问某些信息、修改对象或创建新对象）。例如，`s.find()`\
  \ 查询 `s` 中是否存在等于字符串 \"hwdong\" 的子串，并返回子串的位置。而 `alist.copy()` 创建一个内容与 `alist` 相同的列表对象，并使\
  \ `blist` 指向新创建的列表对象。\n\n类的方法是属于该类的函数，即类的内部函数，而不是之前的普通外部函数。\n\n在 Python 中使用关键字 `class`\
  \ 定义类。为了描述所有学生的共同属性，可以定义一个 `Student` 类。\n\n```\nclass Student:\n    def __init__(self,\
  \ name, score):\n        self.name = name\n        self.score = score\n        \n\
  \    def print(self):\n        print(self.name, \",\", self.score)\n```\n\n类中的函数称为**方法**。通过类对象调用类的方法，可以在类对象上执行方法中的语句。因为一个类可以有很多对象，所以类的方法必须知道在哪个对象上执行方法的代码。因此，类的方法的第一个参数是\
  \ `self`，表示调用该类方法的对象。\n\n以下代码定义了 `Student` 类的两个对象 `s1` 和 `s2`：并通过它们调用 `Student`\
  \ 类的 `print()` 方法。`Student` 的 `print()` 方法调用内置函数 `print()` 输出 `self` 指向的对象的姓名和分数。\n\
  \n```\ns1 = Student(\"LiPing\", 67)\ns2 = Student(\"WangQiang\", 83)\ns1.print()\n\
  s2.print()\n```\n\n```\nLiPing, 67\nWang Qiang , 83\n```\n\n类中的 `__init__()` 方法是一个称为**构造函数**的特殊方法。定义类对象时，会自动调用此构造函数来初始化\
  \ `self` 指向的类对象。\n\n上述 `Student` 类的构造函数使用参数 `name` 和 `score` 来初始化 `self` 指向的对象的两个属性\
  \ `self.name` 和 `self.score` 的过程。例如，执行语句 `Student(\"LiPing\", 67)` 时，会自动调用此构造函数，并将\
  \ \"LiPing\" 和 67 作为参数 `name` 和 `score` 传递给构造函数以创建一个 `Student` 对象。\n\n每个对象都有自己独立的实例属性，更改一个对象的实例属性不会影响其他对象的实例属性。除了实例属性外，还可以为类定义类属性，这是该类所有对象共享的属性。类属性是在类的方法外部定义的属性。\n\
  \n例如，修改后的 `Student` 类添加了一个类属性 `count`，表示从此类创建了多少个具体的类对象。其初始值为 0。每当创建一个类对象，其计数就会增加。\n\
  \n```\nclass Student:\n    count = 0\n    def __init__(self, name, score):\n   \
  \     self.name = name\n        self.score = score\n        Student.count += 1\n\
  \        \n    def print(self):\n        print(self.name, \",\", self.score)\n```\n\
  \n通常，通过“类名.类属性”来查询或修改类属性，例如 `Student.count`，实例属性也可以通过“实例名.类属性”（包括 `self.类属性`）来查询。如下面的\
  \ `s1.count`。\n\n```\nprint(Student.count)\ns1 = Student(\"LiPing\", 67)\nprint(s1.count)\n\
  s2 = Student(\"WangQiang\", 83)\nprint(Student.count)\n```\n\n```\n0\n1\n2\n```\n\
  \n#### 1.1.8 Matplotlib 入门\n\nMatplotlib 是一个用于 2D 绘图的 Python 包，可用于绘制图形或显示图像。`matplotlib.pyplot`\
  \ 为 matplotlib 面向对象的绘图库提供了一个方便的类 Matlab 接口函数。可以使用以下代码导入 `matplotlib.pyplot` 模块并将其命名为\
  \ `plt`，这样可以避免在代码中编写冗长的 `matplotlib.pyplot`。\n\n```\nimport matplotlib.pyplot as\
  \ plt\n%matplotlib inline        \n```\n\n`%matplotlib inline` 使图形出现在 Jupyter Notebook\
  \ 中。\n\n`pyplot` 模块的 `plot()` 函数可以直接绘制 2D 数据，例如：\n\n```\ny = [i*0.5 for i in range(10)]\n\
  print(y)\nplt.plot(y)            # 将 y 作为由纵轴坐标点组成的图形绘制\nplt.show()             #\
  \ 调用 plt.show() 显示图形\n```\n\n```\n[0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0,\
  \ 4.5]\n```\n\n![](img/file1.png)\n\n虽然只给出了纵轴坐标数组 `y`，但 `plot()` 函数会默认自动生成从 0 开始的横轴坐标。当然，也可以传入\
  \ 2 个数组来分别表示 x 和 y 坐标，例如：\n\n```\nx = [i*0.1 for i in range(10)]\ny = [xi**2 for\
  \ xi in x]\nprint([\"{0:0.2f}\".format(i) for i in x])\nprint([\"{0:0.2f}\".format(i)\
  \ for i in y])\nplt.plot(x, y)                # 绘制由 (x, y) 坐标点组成的图形\nplt.show()\
  \                    # 调用 plt.show() 显示图形\n```\n\n```\n['0.00', '0.10', '0.20',\
  \ '0.30', '0.40', '0.50', '0.60', '0.70', '0.80', '0.90']\n['0.00', '0.01', '0.04',\
  \ '0.09', '0.16', '0.25', '0.36', '0.49', '0.64', '0.81']\n```\n\n![](img/file2.png)\n\
  \n可以同时绘制多条曲线。\n\n```\nx = [i*0.2 for i in range(10)]\ny = [xi**2 for xi in x]\n\
  y2 = [3*xi-1 for xi in x]\n\nplt.plot(x, y)                         # 绘制由 (x, y)\
  \ 坐标点组成的图形\nplt.plot(x, y2)\nplt.ylim(0, 5)\nplt.xlabel('x axis label')\nplt.ylabel('y\
  \ axis label')\nplt.title('y=x² and y=3x-1')\nplt.legend(['y=x²', 'y=3x-1'])   \
  \     # 指定图例标签的标签\nplt.show()                             # 调用 plt.show() 显示图形\n\
  ```\n\n![](img/file3.png \"fig:\")  \n\n`pyplot` 模块的 `title()` 函数用于给图形添加标题，而 `legend()`\
  \ 为每条绘制的曲线命名，`xlim()` 和 `ylim()` 用于限制 x 和 y 坐标的范围，`xlabel()` 和 `ylabel()` 用于给 x\
  \ 轴和 y 轴添加标签。可以看到不同的图形会自动以不同颜色显示。\n\n`plot()` 函数还可以接受一些参数来自定义绘制图形的样式，例如：\n\n```\n\
  import math\nx = [i*0.2 for i in range(50)]\ny = [math.sin(xi) for xi in x]\ny2\
  \ = [math.cos(xi) for xi in x]\ny3 = [0.2*xi for xi in x]\nplt.plot(x, y, 'r-')\
  \        \nplt.plot(x, y2, 'bo')  \nplt.plot(x, y3, 'g:')  \nplt.legend(['sin(x)',\
  \ 'cos(x)', '0.2x'])\nplt.show()    \n```\n\n![](img/file4.png)\n\n其中，`'r-'` 中的\
  \ `r` 表示红色，`-` 表示短线，`'bo'` 中的 `b` 表示蓝色，`o` 表示点，`'g:'` 中的 `g` 表示绿色，`:` 表示虚线。\n\n\
  除了可以在 `pyplot` 模块中绘图的 `plot()` 函数外，还有用于绘制其他类型图形的函数，例如用于绘制散点图的 `scatter()`。例如：\n\n\
  ```\nimport math\nx = [i*0.2 for i in range(50)]\ny = [math.sin(xi) for xi in x]\n\
  y2 = [math.cos(xi) for xi in x]\ny3 = [0.2*xi for xi in x]\nplt.scatter(x, y, c='r',\
  \ s=6, alpha=0.2)        \nplt.scatter(x, y2, c='g', s=18, alpha=0.9)  \nplt.scatter(x,\
  \ y3, c='b', s=3, alpha=0.4)  \nplt.legend(['sin(x)', 'cos(x)', '0.2x'])\nplt.show()\
  \ \n```\n\n![](img/file5.png)\n\n\n\n\n参数 `c` 表示颜色，其值 `'r'`、`'g'` 和 `'b'` 分别代表红、绿、蓝；参数\
  \ `s` 表示点的大小，`alpha` 表示图形的透明度。\n\n##### subplot()\n\n除了显示多个图形外，用于显示图形的窗口的 figure\
  \ 对象还可以使用多个子区域来显示不同的图形。可以使用 `subplot()` 函数指定在哪个子图窗口中绘制子图。\n\n```\nsubplot(numRows,\
  \ numCols, plotNum)\n```\n\n其参数 `numRows`、`numCols` 和 `plotNum` 分别指定行数、列数和子图编号。在子图中绘制图形之前，调用\
  \ `subplot()` 以指定该位置的子图进行绘图，并可使用 `title()` 函数设置子图的标题。例如：\n\n```\nimport math\nx\
  \ = [i*0.2 for i in range(50)]\ny = [math.sin(xi) for xi in x]\ny2 = [math.cos(xi)\
  \ for xi in x]\ny3 = [0.2*xi for xi in x]\n\nfig = plt.gcf()\nfig.set_size_inches(12,\
  \ 4, forward=True)\n\nplt.subplot(1, 2, 1)\nplt.plot(x, y,'r-') \nplt.plot(x, y2,'bo')\
  \  \nplt.title('sin(x) and cos(x)')\nplt.legend(['sin(x)', 'cos(x)'])\n\nplt.subplot(1,\
  \ 2, 2)\nplt.plot(x, y3,'g:')  \nplt.title('0.2x') \n\nplt.show()    \n```\n\n![](img/file6.png)\n\
  \n上述代码首先通过 `fig = plt.gcf()` 获取当前绘图窗口的 figure 对象并将其赋值给变量 `fig`，然后通过调用 figure 的 `set_size_inches()`\
  \ 函数修改 figure 对象的默认宽度和高度，`forward=True` 表示立即更新当前窗口的 figure 对象大小。\n\n##### Axes 对象\n\
  \n`subplot()` 函数返回一个 axes 对象。我们可以利用它来指定任意时刻哪个子图处于激活状态：\n\n```\n# http://www.math.buffalo.edu/~badzioch/MTH337/PT/PT-matplotlib_subplots/PT-matplotlib_subplots.html\n\
  from math import pi\nplt.figure(figsize=(8,4))\n\nx = [i*0.03 for i in range(300)]\n\
  y = [math.sin(2*xi) for xi in x]\ny2 = [math.sin(10*xi) for xi in x]\ny3 =[math.cos(2*xi)\
  \ for xi in x]\n\nplt.subplots_adjust(hspace=0.4)\n\nax1 = plt.subplot(2,1,1) #\
  \ subplot(2,1,1) 处于激活状态，绘图将在此进行\nplt.xlim(0, 9)\nplt.plot(x, y)\nplt.title('subplot(2,1,1)')\n\
  \nax2 = plt.subplot(2,1,2) # subplot(2,1,2) 现在处于激活状态\nplt.xlim(0, 9)\nplt.plot(x,\
  \ y2)\nplt.title('subplot(2,1,2)')\n\nplt.axes(ax1)            # 激活 subplot(2,1,1)\
  \ 以便在此子图上进行更多绘图\nplt.plot(x, y3, 'r--')\n\nplt.show()\n```\n\n![](img/file7.png)\n\
  \n##### mplot3d\n\n与其他 axes（坐标轴）一样，使用 `projection='3d'` 关键字来创建 `Axes3D` 对象。创建一个\
