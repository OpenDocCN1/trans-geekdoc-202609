  \ 生成对抗网络\n\n**生成对抗网络**（Generative Adversarial Net，**GAN**）是 Ian Goodfellow 于 2014\
  \ 年提出的一种生成模型，包含两个称为**判别器**和**生成器**的神经网络函数。判别器用于识别数据是真实数据还是伪造数据，生成器用于生成伪造数据。利用极大极小对抗博弈的方法，判别器和生成器通过持续对抗的过程提升各自的性能，就像博弈双方的相互对抗过程，一方总希望获得最大得分，而另一方总希望将对手的得分最小化。GAN\
  \ 是深度学习兴起以来最令人兴奋、最具创造性的技术。深度学习三巨头之一、图灵奖得主 Yann LeCun 对 GAN 给予了高度评价：\n\n> “生成对抗网络是过去十年机器学习领域最有趣的想法。”\n\
  > \"Generative Adversarial Networks are the most interesting idea in machine learning\
  \ of the past decade\"\n\n作为一种数据生成技术，GAN 可以生成伪造的图像、文本、语音等数据。如图 8-15 所示，两张人脸图像（来自网站\
  \ [`www.whichfaceisreal.com/`](http://www.whichfaceisreal.com/)），一张是真实人脸图像，另一张是由\
  \ GAN 生成的图像。难以分辨吗？\n\n**图 8-15** GAN 生成的人脸（左）与真实人脸（右）\n\n生成图像是 GAN 早期的主要目标。图 8-16\
  \ 是使用 BigGAN 可以生成的图像。\n\n![](img/file185.png \"fig:\")\n**图 8-16** 使用 BigGAN 生成的图像，源自论文《Large\
  \ Scale GAN Training for High Fidelity Natural Image Synthesis》\n\nGAN 不仅可用于生成图像，还可用于图像增强、图像超分辨率、图像修复、图像转换、风格迁移等应用。如图\
  \ 8-17 所示，基于 GAN 的图像修补技术（[Image Inpainting for Irregular Holes Using Partial Convolutions](https://eccv2018.org/openaccess/content_ECCV_2018/papers/Guilin_Liu_Image_Inpainting_for_ECCV_2018_paper.pdf)）可以从受损或打码的图像中恢复原始图像内容。\n\
  \n**图 8-17** 基于 GAN 图像修补技术的图像修复：遮罩图像及对应的修复结果，源自《Image Inpainting for Irregular Holes\
  \ Using Partial Convolutions》\n\n如图 8-18 所示，风格迁移（[Image-to-Image Translation with\
  \ Conditional Adversarial Nets](https://arxiv.org/abs/1611.07004)）可以将一张图像的风格迁移到另一张图像上。\n\
  \n**图 8-18** 风格迁移，源自论文《Image-to-Image Translation with Conditional Adversarial Nets》\n\
  \n除了合成图像，GAN 还可用于合成音乐（如 [GANSynth](https://magenta.tensorflow.org/gansynth)）、语音和文本。图\
  \ 8-19 是由不同 GAN 技术生成的文本。\n\n![](img/file186.png \"fig:\")\n**图 8-19** IWGAN 和 TextKD-GAN\
  \ 生成的英文文本，源自论文《TextKD-GAN: Text Generation using Knowledge Distillation and Generative\
  \ Adversarial Networks》\n\n基于 GAN 的数据合成与重构技术衍生出各种创新应用，例如著名的基于 GAN 的换脸应用 DeepFake，可以将视频中的人脸替换为另一张人脸（如图\
  \ 8-20 所示）。\n\n**图 8-20** 视频人脸替换\n\n虚拟试穿可以为人物更换衣物。如图 8-21 所示，给定一张人物照片，可以更换不同的衣服，姿势也可以改变（源自论文：Down\
  \ to the Last Detail: Virtual Try-on with Detail Carving）。\n\n![](img/file187.png\
  \ \"fig:\")\n**图 8-21** 虚拟换装：给定一张人物照片，可以更换不同的衣服，姿势也可以改变\n\n更多 GAN 技术和应用，可在 Google\
  \ 搜索。例如，GAN zoo 收集了许多 GAN 技术论文。\n\n### 8.4.1 GAN 的原理\n\n“生成对抗网络”字面上包含了 GAN 的三个方面：“生成”意味着它用于生成（制造）数据。例如，输入一个由一个或多个实数组成的向量，GAN\
  \ 可以生成一张图像，如动漫头像、人脸图像或风景图像。它也可以生成一段乐谱、一段语音或一段文本。“对抗”意味着它通过对抗的方式提升生成数据的能力。对抗是一种熟悉的通过学习提升某种能力的手段。例如，运动员可以通过比赛或训练中的相互对抗不断提升能力。对抗通常是一个迭代过程。通过与对手反复对抗，我们不断改进和调整自己，希望最终战胜对手。“网络”指\
  \ GAN 的生成器函数用于生成数据，判别器函数用于识别数据的真伪，两者都使用神经网络函数。\n\nGAN 的工作原理类似于造假过程：造假者希望制造（生成）赝品（钞票、书画、古董），而作为对手的鉴定者试图鉴别赝品的真伪（如银行职员或验钞机识别假钞、文物专家鉴别文物真伪）。造假者制造的赝品容易被鉴定者识破。随着造假者技术的不断提高，制造的赝品越来越难以识别。双方持续对抗。最终，当造假者制造的赝品无法被鉴定者识别时，双方的对抗达到平衡，造假者制造的赝品可以欺骗鉴定者。\n\
  \n造假者与鉴定者之间的这一对抗过程被称为“**极大极小博弈**”。鉴定者希望最大化辨别真伪的能力，而造假者希望最小化鉴定者辨别真伪的能力。当博弈达到均衡状态时，称为“**纳什均衡**”。\n\
  \n#### 1. 判别器与生成器\n\nGAN 通过真实数据训练生成模型。GAN 包含 2 个函数（或神经网络）：\n\n*   一个**生成器**函数（网络），从随机噪声（称为潜在变量）输入生成（制造）合成数据。\n\
  *   一个**判别器**函数（网络），它是一个二分类函数，用于识别数据是否为真实数据。\n\n如图 8-22 所示，这是一个生成人脸图像的 GAN，其中生成器（`Generator`）和判别器（`Discriminator`）是由深度神经网络表示的两个函数。`Generator`\
  \ 可以从带有噪声的随机向量生成一张人脸图像，`Discriminator` 是一个简单的二分类神经网络，输入一张人脸图像，输出该图像为真实人脸的概率。判别器同时接收真实人脸图像和生成器生成的假人脸图像，以训练其判别能力。\n\
  \n**图 8-22** 生成人脸的 GAN 模型，其中由神经网络表示的生成器从带有噪声的随机向量生成人脸图像，判别器 `Discriminator` 是一个简单的二分类神经网络，输入人脸图像，输出该图像为真实人脸的概率。\n\
  \n在 GAN 中，判别器和生成器都是由神经网络表示的函数，分别可用符号 `D(x|θ[D])` 和 `G(z|θ[G])` 表示，其中 `θ[D]`、`θ[G]`\
  \ 分别是两个神经网络的模型参数。生成器 `G(z|θ[G])` 函数将噪声潜在变量 `z` 映射为数据 `G(z|θ[G])`，“判别器” `D(x|θ[D])`\
  \ 用于判断 `x` 为真实数据的概率。\n\nGAN 需要训练判别器和生成器两个神经网络函数，使判别器 `D` 尽可能正确识别真假数据，即真实数据的概率 `D(x)`\
  \ 尽可能大，使生成数据被判断为真实数据的概率 `D(G(z))` 尽可能小。另一方面，也需要训练生成器 `G`，使生成器生成的数据尽可能欺骗判别器，甚至使判别器\
  \ `D` 以尽可能大的概率 `D(G(z))` 判断生成器生成的数据为真实。在 GAN 训练过程中，生成器和判别器通过这种相互对抗提升各自的功能，使最终判别器无法区分真实数据和生成器生成的假数据。\n\
  \n最初，生成器 `G` 生成的数据 `G(z|θ[G])` 的分布将与真实数据的潜在分布不一致，判别器 `D(x|θ[D])` 也未学到足够的识别真假数据的能力。GAN\
  \ 使用对抗过程训练它们，交替训练判别器和生成器，即反复执行以下对抗训练：\n\n*   **判别器训练**：判别器 `D` 接收一组真实数据 `x_real`\
  \ 和来自生成器的假数据 `x_fake = G(z)` 作为样本。判别器函数应使真实数据的输出值 `D(x_real|θ[D])` 尽可能大（概率尽可能接近\
  \ 1），使假数据的输出值 `D(x_fake|θ[D]) = D(G(z)|θ[D])` 尽可能小（概率接近 0）。因此，真实数据和假数据的样本标签分别为 1\
  \ 和 0。训练过程与普通神经网络训练过程完全相同。\n*   **生成器训练**：生成器 `G` 接收一组随机噪声 `z`，将其生成的数据即输出值 `G(z)`\
  \ 输入判别器 `D`，希望尽可能欺骗判别器。即判别器的输出值 `D(G(z))` 尽可能大（概率接近 1）。\n\n上述过程重复进行，直到判别器无法区分真实数据和假数据。用数学术语表述，即生成器生成的数据分布非常接近真实数据的分布。\n\
  \n如果真实数据是一些实数，这些实数服从某种分布，如正态分布。如图 8-23 所示，黑点代表这些实数对应的概率密度（分布）。假设只知道这些实数，而不知道其他真实分布，生成器可以通过将噪声潜在变量\
  \ `z` 映射到实数空间中的实数来生成一些实数 `x`。绿色实线表示这些生成实数的分布。生成实数的分布最初与真实实数的分布不一致。随着训练过程的不断迭代，生成数据\
  \ `G(z)` 的分布逐渐接近真实数据 `x` 的分布，判别器识别生成数据为真实数据的概率不断增加。最终，生成数据的分布与真实数据的分布几乎相同。此时，判别器无法再区分真实数据和生成数据，即无论真实还是生成数据，被判断为真实数据的概率都接近\
  \ 0.5。\n\n![](img/file188.jpg \"fig:\")\n**(a) (b) (c) (d)**\n\n**图 8-23** 在图 8-23\
  \ 中，黑点代表真实数据（实数）对应的概率密度（分布），绿点代表生成实数所服从的分布。最初，两个分布不相似。随着对抗过程的进行，两者越来越接近。\n\n####\
  \ 2. 损失函数\n\n判别器和生成器的目标不同。对于判别器，希望 `D(x)` 尽可能大，`D(G(z))` 尽可能小。对于生成器，希望 `D(G(z))`\
  \ 尽可能大。类似于逻辑回归和多分类问题，为了提高计算的稳定性，通常用 `log(D(z))` 和 `log(D(G(z)))` 代替 `D(z)` 和 `D(G(z))`，并使用一批（多个）样本的平均损失（期望损失）来计算损失函数值。\n\
  \n若用 `p_z`、`p_r` 和 `p_g` 分别表示隐变量 `z`、真实数据 `x` 和生成数据 `G(z)` 的分布，判别器 `D` 期望真实数据 `x`\
  \ 的 `log D(x)` 的期望（平均值）`\U0001D53C[x∼p_r(x)][log D(x)]` 尽可能大，而从随机噪声变量 `z` 生成数据 `G(z)`\
  \ 的 `log D(G(z))` 的期望（平均值）`\U0001D53C[z∼p_z(z)][log D(G(z))]` 尽可能小，或 `\U0001D53C\
  [z∼p_z(z)][log(1 − D(G(z)))]` 尽可能大。因此，判别器期望 `\U0001D53C[x∼p_r(x)][log D(x)] + \U0001D53C\
  [z∼p_z(z)][log(1 − D(G(z)))]` 尽可能大：\n\n```\nmax_D L_D(D,G) = \U0001D53C[x∼p_r(x)][log\
  \ D(x)] + \U0001D53C[z∼p_z(z)][log(1 - D(G(z)))]\n               = \U0001D53C[x∼p_r(x)][log\
  \ D(x)] + \U0001D53C[x∼p_g(x)][log(1 - D(x))]\n```\n\n生成器 `G` 希望欺骗判别器 `D`，即希望 `\U0001D53C\
  [z∼p_z(z)][log(D(G(z)))]` 尽可能大，或 `\U0001D53C[z∼p_z(z)][log(1 − D(G(z)))]` 尽可能小：\n\
  \n```\nmin_G L_G(D,G) = \U0001D53C[z∼p_z(z)][log(1 - D(G(z)))]\n               =\
  \ \U0001D53C[x∼p_g(x)][log(1 - D(x))]\n```\n\n生成器的最小化与真实数据的 `\U0001D53C[x∼p_r(x)][log\
  \ D(x)]` 无关，因此即使加上这一项也不影响该最小化：\n\n```\nmin_G L_G(D,G) = \U0001D53C[x∼p_r(x)][log\
  \ D(x)] + \U0001D53C[x∼p_g(x)][log(1 - D(x))]\n```\n\n因此，这两个损失函数可表示为统一的损失函数：\n\n\
  ```\nmin_G max_D L(D,G) = \U0001D53C[x∼p_r(x)][log D(x)] + \U0001D53C[z∼p_z(z)][log(1\
  \ - D(G(z)))]\n                   = \U0001D53C[x∼p_r(x)][log D(x)] + \U0001D53C\
  [x∼p_g(x)][log(1 - D(x))]\n```\n\n即判别器 `D` 想要最大化该损失，而生成器 `G` 想要最小化该损失（对 `G` 而言，该损失函数的第一项与\
  \ `G` 无关）。即生成器和判别器都在玩一个“极大极小”对抗博弈。虽然写出了这个统一公式，但实际编程仍是优化 `max_D \U0001D53C[x∼p_r(x)][log\
  \ D(x)] + \U0001D53C[z∼p_z(z)][log(1 - D(G(z)))]` 和 `min_G \U0001D53C[z∼p_z(z)][log(1\
  \ - D(G(z)))]`。根据实践经验，通常将 `min log(1 − D(G(z)))` 转换为 `max log(D(G(z)))`，或将 `max\
  \ log(1 − D(G(z)))` 转换为 `min log(D(G(z)))`，更有利于训练的稳定性。\n\n#### 3. 训练过程\n\nGAN 的训练无非是\
  \ 2 个普通神经网络的训练。GAN 交替训练判别器和生成器，即先训练判别器，再训练生成器，再训练判别器，再训练生成器，…… 其训练过程可用以下伪代码描述：\n\
  \n```\nfor Each iteration:\n    Perform k iterative updates of the discriminator:\n\
  \        Sample m real data samples x^(i) and generated data G(z^(i)) corresponding\
  \ to m random noise z^(i), and mark their labels as 1 and 0 respectively\n     \
  \   Compute the gradient of the following loss function with respect to the model\
  \ parameters;\n        Update the model parameters of the discriminator using the\
  \ gradient ascent method;\n\n    Perform l iterative updates of the generator:\n\
  \        Sample generated data G(z^(i)) corresponding to m random noise z^(i), and\
  \ mark their labels as 1;\n        Compute the gradient of the following loss function\
  \ with respect to the model parameters;\n        Update the model parameters of\
  \ the generator using the gradient descent method;\n```\n\n在作者的原始论文中，每次对抗迭代中生成器的梯度更新次数仅执行一次，即\
  \ `l = 1`，判别器的迭代更新次数 `k` 作为可调超参数。通过调整 `k` 或 `l`，可以平衡判别器和生成器的训练程度，防止一方过度训练导致另一方变弱。像学习率、网络结构及其参数一样，它们是一些需要根据经验调整的超参数。这些参数的调整直接影响算法性能，而对抗性的\
  \ GAN 训练更加困难。\n\n判别器和生成器需要对抗，但如果一方过强，另一方就会变弱。如何平衡两者的训练（即调整这些超参数）是 GAN 训练的难点。\n\n\
  ### 8.4.2 GAN 训练过程的代码实现\n\nGAN 的生成器和判别器是两个普通的神经网络函数。但其训练过程是一个对抗过程。在代码实现中，为了增加代码的可读性，上一节的\
  \ GAN 训练过程可以分解为 3 个独立的函数：\n\n*   `D_train()` 函数负责判别器训练的每一次梯度更新。\n*   `G_train()`\
  \ 函数负责生成器训练的每一次梯度更新。\n*   `GAN_train()` 函数代表整个 GAN 训练过程。\n\n判别器是一个二分类神经网络函数，由真实数据和生成器生成的假数据进行训练。在判别器的训练中，真实数据的标签值为\
  \ 1，假数据的标签值为 0。`D_train()` 函数基于这些真实数据和假数据样本计算二元交叉熵损失，并通过反向推导计算梯度，然后更新模型参数：\n\n```\n\
  ```\n\n\n\n\n\nfrom util import *\n\n# 判别器的一个训练过程\n\n```python\ndef D_train(D, D_optimizer,\
  \ x_real, x_fake, loss_fn=BCE_loss_grad, reg=1e-3):\n    # 1. 梯度重置为 0\n    D_optimizer.zero_grad()\n\
  \n    # 2. 使用真实数据训练\n    m_real = x_real.shape[0]\n    y_real = np.ones((m_real,\
  \ 1))\n    f_real = D(x_real)\n    real_loss, real_loss_grad = loss_fn(f_real, y_real)\n\
  \    D.backward(real_loss_grad, reg)\n    loss = real_loss + D.reg_loss(reg)\n\n\
  \    # 3. 使用生成数据训练\n    m_fake = x_fake.shape[0]\n    y_fake = np.zeros((m_fake,\
  \ 1))\n    f_fake = D(x_fake)\n    fake_loss, fake_loss_grad = loss_fn(f_fake, y_fake)\n\
  \    D.backward(fake_loss_grad, reg)\n    loss += (fake_loss + D.reg_loss(reg))\n\
  \n    # 4. 更新梯度\n    D_optimizer.step()\n\n    return loss\n```\n\n其中，`D`、`D_optimizer`\
  \ 分别是判别器神经网络和优化器，`x_real` 和 `x_fake` 分别是真实数据和生成数据。`loss_fn` 是二元交叉熵函数。\n\n`G_train()`\
  \ 是生成器每次传递的梯度更新函数。它接受一组随机噪声向量 `z`，并通过生成器输出 `x_fake`。为了欺骗判别器，`x_fake` 的数据标签被设置为 1。这些生成器数据样本作为真实数据样本输入判别器，然后根据判别器二分类损失函数的反向推导更新生成器的模型参数。\n\
  \n# 生成器的一个训练过程\n\n```python\ndef G_train(D, G, G_optimizer, z, loss_fn, reg=1e-3,\
  \ hack=False):\n    # 1. 梯度重置为 0\n    G_optimizer.zero_grad()\n\n    # 2. 基于采样噪声生成数据\n\
  \    x_fake = G(z)\n\n    # 3. 计算判别器误差\n    f_fake = D(x_fake)\n    batch_size =\
  \ z.shape[0]\n    y = np.ones((batch_size, 1))\n    loss, loss_grad = loss_fn(f_fake,\
  \ y)\n\n    # 反向推导，但仅更新 G 的参数\n    loss_grad = D.backward(loss_grad)\n    G.backward(loss_grad,\
  \ reg)\n    loss += G.reg_loss(reg)\n\n    G_optimizer.step()\n\n    return loss\n\
  ```\n\n其中，`D`、`G` 和 `G_optimizer` 分别是判别器神经网络函数、生成器神经网络函数及其优化器。`z` 是随机采样的噪声。训练生成器时，判别器的模型参数固定，因此只训练更新后的生成器的模型参数，即仅执行\
  \ `G_optimizer.step()`。\n\n作为 GAN 训练的整体流程，`GAN_train()` 函数在每次迭代中首先执行 `D_train()`\
  \ 来训练和更新判别器，然后执行 `G_train()` 来训练和更新生成器。`d_steps` 和 `g_steps` 分别表示在 `GAN_train()`\
  \ 的每次迭代中执行 `D_train()` 和 `G_train()` 的次数，因为有时可能需要多次梯度更新才能学习到更好的模型参数。它们以及各自优化器中的学习率等参数用于平衡两者的学习强度，防止判别器过强或生成器过强。\n\
  \n```python\ndef GAN_train(D, G, D_optimizer, G_optimizer, real_dataset, noise_z,\
  \ loss_fn, iterations=10000, reg=1e-3,\n              show_result=None, d_steps=1,\
  \ g_steps=1, print_n=20):\n    iter = 0\n    D_losses = []\n    G_losses = []\n\
  \    G_loss = 0.\n    D_loss = 0.\n\n    while iter < iterations:\n        # 训练判别器\n\
  \        for d_index in range(d_steps):\n            x_real = next(real_dataset)\n\
  \            # batch_size,dim = x_real.shape[0],x_real.shape[1]\n            # 生成假数据\n\
  \            x_fake = G(next(noise_z))\n            D_loss = D_train(D, D_optimizer,\
  \ x_real, x_fake, loss_fn, reg)\n\n        # 训练生成器\n        for g_index in range(g_steps):\n\
  \            G_loss = G_train(D, G, G_optimizer, next(noise_z), loss_fn, reg)\n\n\
  \        if iter % print_n == 0:\n            print(iter, \"iter:\", \"D_loss\"\
  , D_loss, \"G_loss\", G_loss)\n            D_losses.append(D_loss)\n           \
  \ G_losses.append(G_loss)\n            if show_result:\n                show_result(D_losses,\
  \ G_losses)\n\n        iter += 1\n\n    return D_losses, G_losses\n```\n\n## 8.5\
  \ GAN 建模示例\n\n### 8.5.1 一组实数的 GAN 建模\n\n#### 1. 真实数据：一组实数\n\n如果有一组满足特定分布（如高斯分布）的实数，例如，可以使用以下代码生成一批满足高斯分布的实数：\n\
  \n```python\nM = 10000\nmu = 4\nsigma = 0.5\nx = np.random.normal(mu, sigma, M)\n\
  print(x[:20])\nx = x.reshape(-1, 1)\n```\n\n```\n[4.04491498 4.16228945 4.57294517\
  \ 4.36487946 3.80316745 3.70081992\n 5.1913777 3.91089626 3.7194276 3.47951151 4.23955145\
  \ 3.97878447\n 4.42033902 2.84864752 4.71202734 4.34330571 4.29610917 3.81866978\n\
  \ 5.22367772 4.56030347]\n```\n\n这些实数被用作真实数据，假设其分布未知，如何生成符合这些实数概率分布的实数？这个问题可以用 GAN\
  \ 解决，即 GAN 可以使用这些实数作为真实数据来训练其判别器和生成器函数，训练好的生成器函数可以产生与这些真实实数具有相同分布的实数（即生成数据）。\n\n\
  #### 2. 定义判别器和生成器函数\n\n为了训练这个生成实数的 GAN，首先为该问题定义生成器 `G` 和判别器 `D`：\n\n```python\n\
  from NeuralNetwork import *\n# from util import *\nfrom train import *\n\nnp.random.seed(0)\n\
  hidden = 4\n\nD = NeuralNetwork()\nD.add_layer(Dense(1, hidden))\nD.add_layer(Leaky_relu(0.2))\
  \  # Relu()) #\nD.add_layer(Dense(hidden, 1))\n# D.add_layer(Sigmoid())\n\nG = NeuralNetwork()\n\
  z_dim = 1  # 隐变量维度\nG.add_layer(Dense(z_dim, hidden))\nG.add_layer(Leaky_relu(0.2))\n\
  G.add_layer(Dense(hidden, 1))\n\n# 定义用于训练 G 和 D 的优化器算法对象\nmomentum = 0.9\nD_lr =\
  \ 1e-4  # 1e-4\nG_lr = 1e-4  # 1e-4\nbeta_1, beta_2 = 0.9, 0.999\nD_optimizer =\
  \ Adam(D.parameters(), D_lr, beta_1, beta_2)\n# D_optimizer = SGD(D.parameters(),\
  \ D_lr, momentum)\nG_optimizer = Adam(G.parameters(), G_lr, beta_1, beta_2)\n```\n\
  \n#### 3. 真实数据迭代器，噪声数据迭代器\n\n为了训练 `G` 和 `D`，需要为它们提供训练样本。以下代码定义了一个从真实数据中选择一批样本的迭代器：\n\
  \n```python\nbatch_size = 64\n\ndef data_iterator_X(X, batch_size, shuffle=True):\n\
  \    m = len(X)\n    # print(m)\n    indices = list(range(m))\n    while True:\n\
  \        if shuffle:\n            np.random.shuffle(indices)\n        for i in range(0,\
  \ m, batch_size):\n            if i + batch_size > m:\n                break\n \
  \           j = np.array(indices[i: i + batch_size])\n            yield X.take(j,\
  \ axis=0)\n\ndata_it = data_iterator_X(x, batch_size)\nx0 = next(data_it)\nprint(x0.shape)\n\
  print(x0[:10].transpose())\n```\n\n```\n10000\n(64, 1)\n[[4.39069056 4.20482386\
  \ 4.14997364 4.65636703 4.36363908 3.75927793\n  3.34646553 4.64355828 4.45063574\
  \ 3.49191287]]\n```\n\n生成器函数的输入是随机噪声。以下代码是一个函数迭代器对象，用于生成一批（`m` 个）随机噪声（每个噪声是长度为 `z_dim`\
  \ 的向量）：\n\n```python\ndef sample_z(m, z_dim=1):\n    return np.random.randn(m, z_dim)\n\
  \ndef noise_z_iterator(m, z_dim):\n    while True:\n        yield sample_z(m, z_dim)\n\
  \nnoise_it = noise_z_iterator(batch_size, z_dim)\nz = next(noise_it)\nprint(z.shape)\n\
  print(z[:10].transpose())\n```\n\n```\n(64, 1)\n[[ 0.72956978 0.14262128 -0.29800486\
  \ 1.78637966 0.27740342 -0.61411045\n  -0.68236473 1.61341108 0.41862218 -0.89009973]]\n\
  ```\n\n\n\n\n\n#### 4. 中间结果绘制函数\n\n此外，为了在训练期间观察生成器的效果，你可以编写一个辅助函数，从生成器生成一批数据，然后绘制其直方图：\n\
  \n```python\nimport seaborn as sns\n\ndef gaussian(x, mu, sig):\n    return np.exp(-np.power(x\
  \ - mu, 2.) / (2 * np.power(sig, 2.)))\n\ndef draw_loss(ax, D_losses=None, G_losses=None):\n\
  \    ax.clear()\n    if D_losses:\n        i = np.arange(len(D_losses))\n      \
  \  ax.plot(i, D_losses, '-')\n    if G_losses:\n        ax.plot(i, G_losses, '-')\n\
  \    ax.legend(['D_losses', 'G_losses'])\n\ndef show_result_gauss(D_losses=None,\
  \ G_losses=None, m=600):\n    fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(10,\
  \ 4))\n    draw_loss(ax1, D_losses, G_losses)\n    ax2.clear()\n    xmin, xmax =\
  \ np.min(x), np.max(x)\n    x_values = np.linspace(xmin, xmax, 100)\n    ax2.plot(x_values,\
  \ gaussian(x_values, mu, sigma), label='real data')\n    noise_it = noise_z_iterator(m,\
  \ z_dim)\n    z = next(noise_it)\n    y = G(z)\n    sns.kdeplot(y.flatten(), ax=ax2,\
  \ shade=True, label='fake data')\n    xs = np.linspace(*ax2.get_xlim(), m)[:, np.newaxis]\n\
  \    discrim = sigmoid(D(xs))\n    ax2.plot(xs, discrim, label='discrim probilities\
  \ (normalized)')\n    plt.show()\n```\n\n`show_result()` 函数的左图绘制 D 和 G 的损失曲线，右图绘制真实数据的分布（蓝色曲线）和生成数据的分布（绿色阴影曲线）以及决策曲线（即模型预测区间上的实数为真实数据的概率）。执行该函数：\n\
  \n```python\nshow_result_gauss()\n```\n\n输出以下图形：\n\n![](img/file189.png \"fig:\"\
  )\n图 8-24 蓝色曲线是真实数据的真实分布，阴影区域中的绿线是生成器生成的数据分布，中间的线是决策曲线\n\n因为没有训练，左图是空白的。从右图可以看出，生成器函数生成的实数分布与真实数据的分布差别很大。\n\
  \n#### 5. 训练 GAN\n\n调用 GAN 的训练函数 `GAN_train()`，传入判别器和生成器的参数（`D`、`G`、`D_optimizer`、`G_optimizer`）、数据迭代器\
  \ `data_it`、噪声迭代器 `noise_it`、二元交叉熵函数 `BCE_loss_grad` 以及训练超参数（`iterations`、`reg`），开始训练\
  \ D 和 G：\n\n```python\nfrom util import *\n\nreg = 0.001 #1e-5\niterations = 100000\n\
  d_steps, g_steps = 5, 1 #12,1\nprint_n = 500\n\nD_losses, G_losses = GAN_train(D,\
  \ G, D_optimizer, G_optimizer, data_it, noise_it, BCE_loss_grad, iterations,\n \
  \                              reg, show_result_gauss, d_steps, g_steps, print_n)\n\
