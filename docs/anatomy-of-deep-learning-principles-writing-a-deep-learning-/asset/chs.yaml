  \ -3.06523600e+06\n      1.16099600e+07 -2.72868240e+07 4.03530320e+07 -3.65586800e+07\n\
  \      1.85418720e+07 -4.03263600e+06]\n```\n\n![](img/file54.png \"fig:\")  \n\n\
  图 3-17 以 0 次、1 次、3 次和 9 次多项式函数作为假设函数时正规方程法的拟合情况\n\n以下代码使用梯度下降法求解上述假设函数：\n\n```\n\
  lr = 0.4\niterations = 10000000\nfor i, K in enumerate([0, 1, 3, 9]):\n    plt.subplot(2,\
