  \ -0.184230\n2 -0.037292 -0.035058 -0.042867 -0.036047 -0.177338\n```\n\n股票价格预测是指根据每天的历史股票数据（如开盘价、最高价、最低价、收盘价和交易量）来预测第二天的股票价格（如收盘价）。对于这种序列数据预测问题，每个时刻的数据\
  \ `x[t]` 包含开盘价、最高价、最低价、收盘价、交易量等数据特征。待预测的目标值 `y[t]` 是第二天股票的收盘价。\n\n如果每个时刻的数据 `x[t]`\
  \ 仅包含收盘价特征，且待预测的 `y[t]` 也是收盘价，即它们是同类数据，那么这种股票价格预测问题就是一个自回归问题。以下代码绘制收盘价曲线：\n\n```python\n\
  import numpy as np\nimport matplotlib.pyplot as plt\n\n%matplotlib inline\n\nx =\
  \ np.array(data.iloc[:,-2])\nprint(x.shape)\nplt.plot(x)\n```\n\n**输出：**\n\n```\n\
  (4697,)\n```\n\n![](img/file141.png)\n\n**图 7-1 股票收盘价走势图**\n\n### 7.1.2 概率序列模型、语言模型\n\
  \n#### 1. 概率序列模型\n\n序列数据的预测问题有时不需要直接对序列数据与其目标值之间的函数关系进行建模，而是根据序列数据预测目标值的概率，即确定以下条件概率：\n\
  \n`y[t] ~ p(y[t] | x[1], … x[t])`\n\n即根据时刻 `t` 之前的所有序列数据 `(x[1], x[2], ⋯, x[t])`，预测目标值\
  \ `y[t]` 的取值概率。通常目标值有很多个甚至无限个。预测问题就是确定可能的 `y[t]` 值作为目标值的各个概率。这种根据序列数据预测目标值概率的模型称为**概率序列模型**。对于自回归问题，该概率序列模型表示为：\n\
  \n`x[t] ~ p(x[t] | x[1], … x[t−1])`\n\n#### 2. 语言模型\n\n自然语言处理的基础是建立语言模型。所谓语言模型，就是对句子出现的概率进行建模，即确定一个句子出现的概率。例如，“我是中国人”的概率显然大于“我是中国人”。句子是一系列单词，是单词的有序序列，例如“我是中国人”是由“我”、“是”、“中”、“国”、“人”五个词组成的有序序列（注：原文示例为四词，此处按中文分词逻辑调整为五词，保留原意）。假设句子\
  \ `S` 由单词 `w[1], w[2], w[3], ⋯, w[n]` 组成，句子 `S` 的概率用 `P(w[1], w[2], w[3], ⋯, w[n])`\
  \ 表示。根据概率论，该概率可以表示为：\n\n`P(w[1], w[2], w[3], ⋯, w[n]) = P(w[1]) * P(w[2]|w[1]) *\
  \ P(w[3]|w[1], w[2]) * ⋯ * P(w[n]|w[1], w[2], ⋯, w[n−1])`\n\n它是一系列单词出现的条件概率的乘积。`w[1]`\
  \ 首先出现的概率是 `P(w[1])`，`w[1]` 出现时 `w[2]` 出现的概率是 `P(w[2]|w[1])`。在 `w[1], w[2]` 的情况下\
  \ `w[3]` 的概率是 `P(w[3]|w[1], w[2])`，在 `⋯, w[1], w[2], ⋯, w[n−1]` 的情况下 `w[n]` 的概率是\
  \ `P(w[n]|w[1], w[2], ⋯, w[n−1])`。\n\n根据该公式 (7-3)，如果能知道这些条件概率，即在已知单词 `w[1], w[2],\
  \ ⋯, w[i−1]` 的情况下，下一个单词 `w[i]` 出现的概率 `P(w[i]|w[1], w[2], ⋯, w[i−1])`，就可以知道由一系列单词组成的句子的概率。因此，语言模型就是根据现有的单词序列，预测下一个单词或词表中每个单词的概率。\n\
  \n### 7.1.3 自回归模型\n\n对于当前时刻的预测目标是下一时刻数据的自回归问题，建立的预测模型称为**自回归模型**（**Auto regressive\
  \ model**，简称 **AR** 模型）。该模型可以是概率序列模型，也可以是函数模型。如果 `x[t]` 依赖于 `x[1], ⋯, x[t−1]`，则自回归模型可以是函数模型\
  \ `f : (x[1], ⋯, x[t−1]) → y[t]` 或概率序列模型 `P(x[t] | x[1], ⋯, x[t−1])`。\n\n如果真实数据\
  \ `x[t]` 仅依赖于前固定长度 `τ` 时刻的数据 `(x[t−τ], ⋯, x[t−1])`，则称该序列数据满足**马尔可夫**性质。这种自回归模型也称为**马尔可夫模型**。\n\
  \n最简单的自回归模型假设 `x[t−τ], … x[t−1]` 和 `x[t]` 满足线性关系：\n\n`x[t] = a[0] + a[1]x[t−1] +\
  \ ⋯ + a[τ]x[t−τ] + ϵ`\n\n其中 `ϵ` 是采样的随机噪声（也称为白噪声）。\n\n### 7.1.4 生成自回归数据\n\n在研究序列模型时，我们可以使用股票价格、自然语言文本等实际序列数据，也可以通过模拟手段生成一些模拟序列数据用于序列模型研究。例如，以下代码通过结合正弦函数和余弦函数形成一个函数，然后对该函数曲线的\
  \ y 坐标值进行采样，形成序列数据：\n\n```python\nimport numpy as np\nimport matplotlib.pyplot as\
  \ plt\n\n%matplotlib inline\n\ndef gen_seq_data_from_function(f, ts):\n    return\
  \ f(ts)\n\nT = 5000\nx = gen_seq_data_from_function(lambda ts: np.sin(ts*0.1) +\
  \ np.cos(ts*0.2), np.arange(0, T))\n\nplt.plot(x[:500])\nplt.show()\n```\n\n\n\n\
  \n\n![](img/file142.png)\n\n图 7-2 由函数值生成的自回归数据\n\n但这类数据具有明显的周期性，而真实的序列数据（如股价数据）并不具备这种周期性。公式\
  \ (7-4) 的自回归模型可用于从某些初始数据生成非周期性序列数据。步骤如下：\n\n1.  选择合适的系数 `a[0]`、`a[1]`、⋯、`a[τ]`\n\
  2.  生成前 `τ` 个随机数据\n3.  根据公式 (7-4) 连续生成后续数据\n\n对自回归模型的研究表明，只有当系数构成的方程 `x^(τ) − a[0]x^(τ−1)\
  \ − a[1]x^(τ−2) − ⋯ − a[τ]` 的根的绝对值不超过 1 时，自回归模型才是稳定的，否则生成的数据是不稳定的。\n\n以下函数 `init_coefficients()`\
  \ 生成稳定自回归模型的系数：\n\n```\nnp.random.seed(5)\n\ndef init_coefficients(n):\n\n    while\
  \ True:\n\n        a = np.random.random(n) - 0.5\n\n        coefficients = np.append(1,\
  \ -a)       \n\n        if np.max(np.abs(np.roots(coefficients))) < 1:\n\n     \
  \       return a\n\ninit_coefficients(3)\n```\n\n```\narray([-0.27800683,  0.37073231,\
  \ -0.29328084])\n```\n\n以下函数 `generate_data()` 根据上述 3 个步骤生成自回归数据，因为最初生成的数据分布差异很大，也会影响后续数据。经过一段时间后，数据才会真正开始稳定，因此，有必要丢弃一些最初生成的数据，例如初始的\
  \ 3n 个数据。\n\n```\ndef generate_data(n,data_n,noise_value = 1,k=3):   \n\n    a =\
  \ init_coefficients(n+1)   \n\n    x = np.zeros(data_n + n*(k+1))\n\n    x_noise\
  \ = np.zeros(data_n + n*(k+1))\n\n    x_noise[:n]= np.random.randn(n)   \n\n   \
  \ n_all = data_n + n*k\n\n    for i in range(n_all):        \n\n        x[n+i] =\
  \ np.dot(x_noise[i:n+i][::-1], a[1:]) +a[0] \n\n        x_noise[n+i] = x[n+i] +\
  \ noise_value * np.random.randn() \n\n    x_noise = x_noise[k*n:]  # 丢弃前 k*n 个实数\n\
  \n    x = x[k*n:]\n\n    return x_noise,x\n\nx,_ = generate_data(5,100)\n\nplt.plot(x[:80])\n\
  \nplt.show()\n```\n\n![](img/file143.png)\n\n图 7-3 由自回归模型生成的自回归数据\n\n### 7.1.5 时间窗口法\n\
  \n“一对一”神经网络中的每个样本长度必须相同，即每个样本的特征数量相同。这样的网络能处理序列数据吗？实际上也是可以的。总可以从序列数据中截取等长的子序列作为一个整体，构成一个样本的数据特征。对于序列数据\
  \ `x^((i))`，如果总是使用 `x^((i))` 之前的 T 个（包含 `x^((i))`）序列元素，即 `(x^((i−T+1))`, ⋯, `x^((i−1))`,\
  \ `x^((i)))` 作为一个样本的数据特征来预测某个 `y^((i))`。这在一定程度上考虑了 `x^((i))` 之间的序列相关性。\n\n例如，在乒乓球比赛中，无法仅凭某一时刻球的位置判断球的运动，即无法根据某一时刻球的位置\
  \ `x^((t))` 预测其运动速度 `v^((t))`。  \n但如果将当前时刻与其之前几个时刻的位置结合起来，例如将之前两个时刻的位置组合成一个输入数据特征\
  \ `x̂^((t)) = (x^((t−2))`, `x^((t−1))`, `x^((t)))`，然后基于该数据特征 `x̂^((t))` 预测球的速度 `v^((t))`。\n\
  \n这种以当前位置为中心、固定长度的子序列作为当前位置样本数据特征的方法，称为**时间窗口**法。时间窗口法允许用“一对一”神经网络直接处理序列数据。时间窗口是处理时间序列的传统方法，例如在股价预测问题中，根据某一天之前连续\
  \ 60 天的股票信息预测当天的股价，在语言模型中根据已知的 k 个单词预测下一个单词的概率。\n\n时间窗口法将序列模型的预测问题转化为非序列数据的监督学习问题，从而使序列数据的预测问题能够用现有的非序列数据监督学习方法建模。下面以自回归序列数据的预测问题为例，说明时间窗口法的应用。\n\
  \n### 7.1.6 时间窗口采样\n\n对于自回归序列数据 `{x[t]}`，可以使用固定长度 T 的时间窗口数据 `x[t−T+1]`、⋯`x[t]` 来预测下一个数据\
  \ `x[t+1]`。将固定长度的序列 `(x[t−T+1]`、⋯`x[t])` 作为一个整体作为监督学习的输入数据，将 `x[t+1]` 作为其目标值，从而转化为非序列数据的监督学习问题，该问题可用之前的监督机器学习方法（如前馈神经网络）进行建模和训练。为此，需要准备用于训练模型的训练数据。\n\
  \n对于一段序列数据，可以从任意位置 i 截取长度为 T+1 的序列 `x[i: i + T+1]` 构成一个监督学习样本，其中 `x[i: i + T]` 的数据构成样本的数据特征\
  \ `x` `x[i]`，而 `x[T+1]` 是目标值 `y[i]`。对于长度为 n 的序列数据，i 的取值范围为 `[0,n-(T+1)-1]`。\n\n\
  由这些样本组成的集合 `data_set` 可按一定比例划分为训练集 `(x_train, y_train)` 和测试集 `(x_test, y_test)`。以下代码根据时间窗口宽度\
  \ T 从序列数据中采样训练样本：\n\n```\ndef gen_data_set(x,T,percentage = 0.9):\n\n    L = T +\
  \ 1\n\n    data_set = []\n\n    for i in range(len(x) - (T+1)):\n\n        data_set.append(x[i:\
  \ i + T+1])\n\n    data_set = np.array(data_set)\n\n    row = round(percentage *\
  \ data_set.shape[0])\n\n    train = data_set[:int(row), :]\n\n    np.random.shuffle(train)\n\
  \n    x_train = train[:, :-1]\n\n    y_train = train[:, -1]\n\n    x_test = data_set[int(row):,\
  \ :-1]\n\n    y_test = data_set[int(row):, -1]\n\n    return [x_train, y_train,\
  \ x_test, y_test]\n\nx = gen_seq_data_from_function(lambda ts:np.sin(ts*0.1)+np.cos(ts*0.2),\\\
  \n                               np.arange(0, 5000))\n\nx_train, y_train, x_test,\
  \ y_test = gen_data_set(x, 50)\n\ny_train = y_train.reshape(-1,1)\n\nprint(x_train.shape,y_train.shape)\n\
  ```\n\n```\n    (4454, 50) (4454, 1)\n```\n\n### 7.1.7 时间窗口法建模与训练\n\n通过按固定时间窗口对自回归序列数据进行采样获得训练样本后，即可用监督学习模型进行建模和训练。以下代码使用一个\
  \ 2 层全连接神经网络，对上述从函数值采样得到的自回归数据进行建模和训练：\n\n```\nfrom NeuralNetwork import *\n\nimport\
  \ util\n\nhidden_dim = 50\n\nn = x_train.shape[1]\n\nprint(\"n\",n)\n\nnn = NeuralNetwork()\n\
  \nnn.add_layer(Dense(n, hidden_dim)) #('xavier',0.01)))\n\nnn.add_layer(Relu())\n\
  \nnn.add_layer(Dense(hidden_dim, 1)) #('xavier',0.01)))\n\nlearning_rate = 1e-2\n\
  \nmomentum = 0.8 #0.9\n\noptimizer = SGD(nn.parameters(),learning_rate,momentum)\n\
  \nepochs=20\n\nbatch_size = 200 # len(train_x) #200   \n\nreg = 1e-1\n\nprint_n=100\n\
  \nlosses = train_nn(nn,x_train,y_train,optimizer,\n                  util.mse_loss_grad,epochs,batch_size,reg,print_n)\n\
  \n#print(losses[::len(losses)//50])\n\nplt.plot(losses)\n```\n\n```\n    n 50\n\n\
  \    0 iter: 3.144681992803935\n\n    100 iter: 0.3332809082102651\n\n    200 iter:\
  \ 0.13722749233747686\n\n    300 iter: 0.10941419118718776\n\n    400 iter: 0.10108511745662195\n\
  ```\n\n\n\n\n\n![](img/file144.png)\n\n图 7-5 两层全连接神经网络的训练损失曲线\n\n### 7.1.8 长期预测与短期预测\n\
  \n对于自回归序列数据，可以从由初始真实数据序列 `x[0]`、`x[1]`、⋯、`x[T−1]` 组成的样本特征中预测下一时刻 T 的输出 `x[T]`，然后从\
  \ `x[1]`、`x[2]`、⋯、`x[T]` 预测 `x[T+1]`，从 `x[2]`、`x[3]`、⋯、`x[T+1]` 预测 `x[T+2]`，以此类推持续预测。也就是说，初始序列\
  \ `x[0]`、`x[1]`、⋯、`x[T−1]` 可用于预测后续的多个时刻。这种预测类型称为**长期预测**（或**长期预测**）。由于预测不一定准确，将预测值作为真实值来预测下一个值会更加不准确，即随着时间的推移，预测值与真实值之间的误差会越来越大。另一种是**短期预测**，极端情况是每个时刻都始终使用该时刻对应时间窗口的真实数据（如当前时刻及前\
  \ T-1 个时刻）来预测下一时刻的数据。短期预测之所以效果好，是因为输入数据样本全为真实数据，且仅预测下一时刻的数据，但其要求每个预测时刻使用的数据必须是真实数据，而非上一时刻的预测数据。\n\
  \n以下代码采用长期预测的方法，从初始时刻的真实数据样本出发预测后续一系列时刻的数据。并将这些预测值与测试集对应的目标值进行可视化对比，以观察该模型的预测性能。\n\
  \n```\nx = x_test[0].copy()\nx = x.reshape(1,-1)\nys =[]\nfor i in range(400):\n\
  \    y = nn.forward(x)   \n    ys.append(y[0][0])\n    x = np.delete(x,0,1)\n  \
  \  x = np.append(x, y.reshape(1,-1), axis=1)    \nys  = ys[:]\nplt.plot(ys[:400])\n\
  plt.plot(y_test[:400])\nplt.xlabel(\"time\")\nplt.ylabel(\"value\")\nplt.legend(['y','y_real'])\n\
  ```\n\n![](img/file145.png \"fig:\")  \n图 7-6 使用时间窗口长度 T=50 的训练模型进行长期预测\n\n可以看出，预测结果非常接近真实目标值，因为这是一条周期性曲线，而\
  \ T=50 基本接近该曲线的周期（`50*0.1 = 5` 接近 `2*π`∼6.28）。如果时间窗口较短，例如 T=10 时的预测结果如图 7-7 所示，预测效果会很差。\n\
  \n同时可以发现，预测的未来越远，准确率越低，因为预测值被用作真实数据值来预测后续时刻的值，由于误差的持续累积，误差会越来越大。\n\n![](img/file146.png)\n\
  \n图 7-7 使用时间窗口长度 T=10 的训练模型进行长期预测\n\n以下代码是使用训练好的神经网络进行短期预测，即每次都使用真实数据来预测下一时刻的数据值：\n\
  \n```\nys =[]\nfor i in range(400):\n    x = x_test[i].copy()\n    x = x.reshape(1,-1)\n\
  \    y = nn.forward(x)   \n    ys.append(y[0][0])   \nys  = ys[:]\nplt.plot(ys[:400])\n\
  plt.plot(y_test[:400])\nplt.xlabel(\"time\")\nplt.ylabel(\"value\")\nplt.legend(['y','y_real'])\n\
  ```\n\n![](img/file147.png)\n\n图 7-8 使用时间窗口长度 T=50 的训练模型进行短期预测\n\n显然，短期预测更准确。\n\n\
