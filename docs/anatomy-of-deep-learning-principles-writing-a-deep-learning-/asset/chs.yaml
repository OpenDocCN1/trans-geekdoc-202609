  str = predict_rnn(params, \"he\", 200)\nprint(str)\n```\n\n\n\n\n她的生物，我喜欢脊柱弯曲着离去，你的恐惧他洞穴。\n\
  \n不，啊不，也没有停留太久，\n\n来吧，我的智慧祭坛在由我的野兽朋友，和我们在内；光束\n\n你的工作淡去了忠诚，\n\n在洞里我\n\n\n\n可以看出输出文本已经类似于正常文本。字符语言模型不仅可以用于生成文本，还可以用于其他问题，例如生成乐谱。\n\
  \n## 7.6 RNN 网络的梯度爆炸与梯度消失\n\nRNN 网络理论上可以捕获长期序列信息，但它在时间维度上展开进行前向计算和反向推导。这一过程类似于深度神经网络从输入层到输出层的前向计算和逐层计算。在反向推导过程中，容易出现梯度爆炸和梯度消失问题，这将导致训练无法收敛。\n\
  \n为了说明这一点，考虑以下简化的 RNN 模型：\n\n$$h[t] = \\sigma(w h[t-1])$$\n\n忽略偏置和输入，仅考虑隐藏状态向量 $h[t]$，即时刻\
  \ $t$ 的隐藏状态 $h[t]$ 与时刻 $t-1$ 的隐藏状态 $h[t-1]$ 具有上述关系。\n\n根据链式求导法则，有：\n\n$$\\frac{\\\
  partial h_t}{\\partial h_{t-1}} = w \\sigma'(w h_{t-1})$$\n\n同理：\n\n$$\\frac{\\\
  partial h_{t-1}}{\\partial h_{t-2}} = w \\sigma'(w h_{t-2}) \\tag{7-21}$$\n\n如果从\
  \ $t$ 到 $t'$ 经过一系列时刻 $t+1, t+2, \\dots, t'$，在反向推导中，时刻 $t'$ 的 $h[t']$ 对时刻 $t$ 的 $h_t$\
  \ 的偏导数为：\n\n$$\n\\begin{matrix}\n\\frac{\\partial h_{t'}}{\\partial h_t} &= \\frac{\\\
  partial h_{t'}}{\\partial h_{t'-1}} \\frac{\\partial h_{t'-1}}{\\partial h_{t'-2}}\
  \ \\cdots \\frac{\\partial h_{t+1}}{\\partial h_t} \\\\\n&= (w \\sigma'(w h_{t'-1}))\
  \ (w \\sigma'(w h_{t'-2})) \\cdots (w \\sigma'(w h_t)) \\\\\n&= \\prod_{k=1}^{t'-t}\
  \ w \\sigma'(w h_{t'-k}) \\\\\n&= \\underbrace{w^{t'-t}}_{\\text{!!!}} \\prod_{k=1}^{t'-t}\
  \ \\sigma'(w h_{t'-k})\n\\end{matrix}\n$$\n\n如果权重 $w$ 不等于 0，当 $0 < |w| < 1$ 时，上述公式以\
  \ $t'-t$ 的速度指数衰减到 0；当 $|w| > 1$ 时指数增长到无穷大。即梯度 $\\frac{\\partial h_{t'}}{\\partial\
  \ h_t}$ 衰减到 0 或爆炸到无穷大。参数更新公式为：\n\n$$w = w - \\alpha \\frac{\\partial \\mathcal{L}}{\\\
  partial w}$$\n\n根据公式 (7-17)，$\\frac{\\partial \\mathcal{L}}{\\partial w} = \\sum_{t=1}^{n}\
  \ \\frac{\\partial \\mathcal{L}}{\\partial h_{t^T}} \\frac{\\partial h_{t^T}}{\\\
  partial h_t} h_t$，因此 $\\frac{\\partial \\mathcal{L}}{\\partial w}$ 随着 $\\frac{\\\
  partial h_{t'}}{\\partial h_t}$ 衰减到 0 或爆炸到无穷大，这导致模型参数 $w$ 在训练过程中来回震荡或几乎不动，即训练无法收敛。样本序列越长，越容易衰减或爆炸。\n\
  \n梯度裁剪可以处理梯度爆炸，但无法处理梯度消失。\n\n## 7.7 长短期记忆网络 (LSTM)\n\n由于梯度爆炸和消失问题，之前的 RNN 模型无法在时间维度上展开过长，短时间序列意味着当前时刻的预测仅依赖于过去短时间内的信息，就像时间窗口一样，没有长期记忆功能。因此，在实际使用\
  \ RNN 时难以捕获时间步距离较大的依赖关系。为了解决这个梯度衰减和爆炸问题，并使 RNN 具有长期记忆功能，Sepp Hochreiter 和 Jürgen\
  \ Schmidhuber 于 1997 年提出了一种名为“长短期记忆”的改进 RNN 模型。\n\nLSTM 引入了一个不同于隐藏状态 $h[t]$ 的细胞状态\
  \ $C[t]$。前后时刻的细胞状态 $C[t-1]$ 和 $C[t]$ 是加法关系而非乘法关系。\n\n$$C_t = i \\odot \\tilde{C}_t\
  \ + f \\odot C_{t-1}$$\n\n梯度 $\\frac{\\partial L}{\\partial C_t}$ 因此也是加法关系：\n\n\
  $$\\frac{\\partial L}{\\partial C_{t-1}} = \\dots + f \\odot \\frac{\\partial L}{\\\
  partial C_t}$$\n\n且 $f$ 是一个接近 1 的值，因此 $\\frac{\\partial L}{\\partial C_t}$ 可以保证稳定，使得梯度不会消失，梯度爆炸也得到缓解（但仍会产生梯度爆炸）。\n\
  \n### 7.7.1 LSTM 神经元：Cell\n\nLSTM 的神经元称为 **Cell**（细胞），Cell 在原始传统 RNN 的隐藏状态 $h[t]$\
  \ 基础上，增加了一个细胞状态 $C[t]$，专门用于记忆历史信息。Cell $C[t]$ 是所有历史信息的累积记忆，可以从一个 Cell 流向下一个 Cell，如图\
  \ 7-35 所示：\n\n> **图 7-35** 细胞状态 $C[t]$ 记录所有历史累积信息\n\n原始隐藏状态 $h[t]$ 用于决定 $C[t]$ 信息用于下一时刻细胞信息更新计算的程度。可以将\
  \ $C[t]$ 想象为一条波澜壮阔的历史长河，$h[t]$ 是这条历史长河中影响当代社会活动的那部分历史信息，例如儒家思想在某个时代可能影响较大，而道家在另一个时代的影响相对较大。\n\
  \nCell 中有一个 **当前记忆单元**（也称为 **候选记忆单元**），用于计算当前输入对总历史信息 $C[t]$ 的贡献值 $\\tilde{C}_t$，也称为\
  \ **激活值**。激活值就像当代社会活动对历史的贡献。如图 7-36 所示，当前记忆单元根据数据输入 $x[t]$ 和隐藏状态输入 $h[t-1]$ 计算当前时刻的激活值\
  \ $\\tilde{C}_t$。\n\n$$\\tilde{C}_t = \\tanh(x_t \\mathbf{W}_{xc} + h_{t-1} \\mathbf{W}_{hc}\
  \ + \\mathbf{b}_c)$$\n\n其中 $\\mathbf{W}_{xc} \\in \\mathbb{R}^{d \\times h}$、$\\\
  mathbf{W}_{hc} \\in \\mathbb{R}^{h \\times h}$ 是权重参数，$\\mathbf{b}_c \\in \\mathbb{R}^{1\
  \ \\times h}$ 是偏置参数。$h$ 代表元组状态 $h[t]$ 和隐藏状态 $C[t]$ 的向量长度，$d$ 代表输入样本的特征数。当前时刻的激活值\
  \ $\\tilde{C}_t$ 不仅取决于当前时刻的输入，还取决于从上一时刻传来的隐藏状态 $h[t-1]$。\n\n对于一批样本，则有：\n\n$$\\tilde{\\\
  mathbf{C}}_t = \\tanh(\\mathbf{X}_t \\mathbf{W}_{xc} + \\mathbf{H}_{t-1} \\mathbf{W}_{hc}\
  \ + \\mathbf{b}_c)$$\n\n$\\mathbf{X}_t \\in \\mathbb{R}^{n \\times d}$ 是当前时刻的输入，$\\\
  mathbf{H}_{t-1} \\in \\mathbb{R}^{n \\times h}$ 是上一时刻的隐藏状态，$n$ 是样本数量。\n\n> **图 7-36**\
  \ 当前记忆单元接受上一时刻的隐藏状态 $h[t-1]$ 和当前时刻的输入 $x[t]$，输出当前时刻的激活值 $\\tilde{C}_t$\n\n除了当前记忆单元，Cell\
  \ 还包含三个门：输入门、输出门和遗忘门。门是决定信息能否流通及流通程度的机制，它将 Sigmoid 函数 $\\sigma$ 的输出与输入逐元素相乘，决定有多少输入可以输出（通过该门），如图\
  \ 7-37 所示。Sigmoid 函数 $\\sigma$ 的输出 $f$ 与输入 $in$ 逐元素相乘，决定 $in$ 通过该门的输出 $out = f \\\
  times in$。\n\n> **图 7-37** 门通过 Sigmoid 函数 $\\sigma$ 的输出 $f$ 与输入 $in$ 逐元素相乘，决定 $in$\
  \ 有多少输出，即 $out = f \\times in$\n\n设 Sigmoid 函数 $\\sigma$ 的输入为 $x$，其值 $\\sigma(x)$\
  \ 在 0 和 1 之间。如果 $\\sigma(x) = 0$，乘以某个输入 $c$，意味着该输入 $c$ 不会产生任何输出；如果 $\\sigma(x) =\
  \ 1$，乘以某个输入 $c$，意味着该输入 $c$ 完全输出。\n\n如图 7-38 所示，遗忘门用于控制上一时刻的总信息 $C[t-1]$ 有多少被遗忘（反过来说有多少被记忆），它接受输入数据\
  \ $x[t]$ 和上一时刻的状态 $h[t-1]$，通过 $\\sigma$ 函数输出一个 0 到 1 之间的值 $f[t]$，与上一时刻的细胞状态 $C[t-1]$\
  \ 逐元素相乘 $f[t] C[t-1]$，表示 $C[t-1]$ 的各元素保留了多少。其数学计算公式为：\n\n$$\\mathbf{F}_t = \\sigma(\\\
  mathbf{X}_t \\mathbf{W}_{xf} + \\mathbf{H}_{t-1} \\mathbf{W}_{hf} + \\mathbf{b}_f)$$\n\
  \n> **图 7-38** 遗忘门的输出 $\\mathbf{F}_t$ 与上一时刻的历史信息 $C[t-1]$ 逐元素相乘 $\\mathbf{F}_t C[t-1]$，决定保留多少\
  \ $C[t-1]$（反过来说遗忘多少）\n\n如图 7-39 所示，输入门接受输入数据 $x[t]$ 和上一时刻的状态 $h[t-1]$，通过 $\\sigma$\
  \ 函数输出一个 0 到 1 之间的值 $i[t]$，$i[t]$ 与 $\\tilde{C}_t$ 逐元素相乘 $i_t \\tilde{C}_t$，决定 $\\\
  tilde{C}_t$ 有多少参与输出计算。其计算公式为：\n\n$$\\mathbf{I}_t = \\sigma(\\mathbf{X}_t \\mathbf{W}_{xi}\
  \ + \\mathbf{H}_{t-1} \\mathbf{W}_{hi} + \\mathbf{b}_i)$$\n\n> **图 7-39** 输入门的输出\
  \ $\\mathbf{I}_t$ 与当前激活值 $\\tilde{C}_t$ 逐元素相乘 $I_t \\tilde{C}_t$，决定激活值 $\\tilde{C}_t$\
  \ 有多少进入历史累积信息\n\n如图 7-40 所示，将经过遗忘门的上一时刻历史信息 $f_t C_{t-1}$ 与经过输入门的当前时刻激活信息 $i_t \\\
  tilde{C}_t$ 相加，得到当前状态的新历史信息 $C_t$。其计算公式如下：\n\n$$C_t = f_t C_{t-1} + i_t \\tilde{C}_t$$\n\
  \n> **图 7-40** 遗忘门保留的历史信息 $f_t C_{t-1}$ 与输入门通过的当前激活值信息 $i_t \\tilde{C}_t$ 累加，得到新的历史信息\
  \ $C_t = f_t C_{t-1} + i_t \\tilde{C}_t$\n\n如图 7-41 所示，输出门决定当前时刻的新历史信息 $C_t$ 有多少将参与下一时刻的细胞计算，即决定输出给下一时刻的状态\
  \ $h[t]$。它接受输入数据 $x[t]$ 和上一时刻的状态 $h[t-1]$，通过 $\\sigma$ 函数输出 0 到 1 之间的值 $o[t]$：\n\
  \n$$\\mathbf{O}_t = \\sigma(\\mathbf{X}_t \\mathbf{W}_{xo} + \\mathbf{H}_{t-1} \\\
  mathbf{W}_{ho} + \\mathbf{b}_o)$$\n\n> **图 7-41** 输出门的输出 $\\mathbf{O}_t$ 将决定当前时刻细胞状态有多少输出，并作为隐向量参与下一时刻的计算\n\
  \n如图 7-42 所示，输出门的输出值 $\\mathbf{O}_t$ 与当前状态的信息 $C_t$ 逐元素相乘得到的 $\\mathbf{O}_t C_t$\
  \ 再经过 $\\tanh$ 激活，即为细胞的输出值 $h[t]$，也就是下一时刻输入的隐藏状态 $\\mathbf{H}_t$：\n\n$$\\mathbf{H}_t\
  \ = \\mathbf{O}_t \\odot \\tanh(C_t)$$\n\n> **图 7-42** 输出门决定当前时刻的新历史信息 $C_t$ 有多少（$\\\
  mathbf{H}_t = \\mathbf{O}_t \\odot \\tanh(C_t)$）参与下一时刻的细胞计算\n\n如图 7-43 所示，Cell 由当前记忆单元、遗忘门、输入门和输出门组成。当前计算单元计算当前时刻的激活值\
  \ $\\tilde{C}_t$，该值由输入数据和上一时刻的隐藏状态决定。遗忘门决定保留多少 $C[t]$，输入门决定当前激活值 $\\tilde{C}_t$\
  \ 有多少记录在总历史信息 $C[t]$ 中，输出门决定当前时刻的历史记忆 $C[t]$ 有多少参与下一时刻的计算。\n\n> **图 7-43** Cell\
  \ 由当前记忆单元、遗忘门、输入门和输出门组成\n\n最后，Cell 还从 $\\mathbf{H}_t$ 计算当前的输出值 $\\mathbf{Z}_t$。\n\
  \n$$\\mathbf{Z}_t = \\mathbf{H}_t \\mathbf{W}_y + \\mathbf{b}_y$$\n\n公式 (7-24) 至\
  \ (7-30) 构成了 LSTM Cell 的计算过程。\n\n### 7.7.2 LSTM 的反向推导\n\n根据 4.2 节的反向推导公式，如果已知当前时刻损失函数\
  \ $\\mathcal{L}_t$ 对 $Z_t$ 的梯度 $dZ = \\frac{\\partial \\mathcal{L}_t}{\\partial\
  \ Z_t}$，则可得到损失函数对 $\\mathbf{H}_t$、$\\mathbf{W}_y$、$\\mathbf{b}_y$ 的梯度：\n\n$$\\frac{\\\
  partial \\mathcal{L}_t}{\\partial \\mathbf{W}_y} = \\mathbf{H}_t^T \\frac{\\partial\
  \ \\mathcal{L}_t}{\\partial Z_t} \\quad \\quad \\frac{\\partial \\mathcal{L}_t}{\\\
  partial \\mathbf{b}_y} = \\text{np.sum}\\left(\\frac{\\partial \\mathcal{L}_t}{\\\
  partial Z_t}, \\text{axis}=0, \\text{keepdims}=\\text{True}\\right) \\quad \\quad\
  \ \\frac{\\partial \\mathcal{L}_t}{\\partial \\mathbf{H}_t} = \\frac{\\partial \\\
  mathcal{L}_t}{\\partial Z_t} \\mathbf{W}_y^T$$\n\n损失函数关于 $\\mathbf{H}_t$ 的梯度还包括来自后续时刻的梯度，所以：\n\
  \n$$\\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{H}_t} = \\frac{\\partial \\\
  mathcal{L}_t}{\\partial Z_t} \\mathbf{W}_y^T + \\frac{\\partial \\mathcal{L}^{t-}}{\\\
  partial \\mathbf{H}_t}$$\n\n同理，损失函数关于 $C_t$ 的梯度也分两部分，一部分来自公式 (7-29) 即输出 $\\mathbf{H}_t$，另一部分是\
  \ $C_t$ 本身输出到下一时刻的梯度：\n\n$$\\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{C}_t}\
  \ = \\mathbf{O}_t \\odot \\tanh'(C_t) \\frac{\\partial \\mathcal{L}_t}{\\partial\
  \ \\mathbf{H}_t} + \\frac{\\partial \\mathcal{L}^{t-}}{\\partial \\mathbf{C}_t}$$\n\
  \n由 $\\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{H}_t}$ 和公式 (7-29)，可得损失函数关于\
  \ $\\mathbf{O}_t$ 的梯度：\n\n$$\\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{O}_t}\
  \ = \\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{H}_t} \\odot \\tanh(C_t)$$\n\
  \n由 $\\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{C}_t}$ 和公式 (7-27)，可得损失函数关于\
  \ $i_t, f_t, C_{t-1}, \\tilde{C}_t$ 的梯度：\n\n$$\\frac{\\partial \\mathcal{L}}{\\\
  partial \\mathbf{I}_t} = \\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{C}_t}\
  \ \\odot \\tilde{C}_t$$\n\n$$\\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{F}_t}\
  \ = \\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{C}_t} \\odot C_{t-1}$$\n\n\
  $$\\frac{\\partial \\mathcal{L}}{\\partial \\tilde{C}_t} = \\frac{\\partial \\mathcal{L}}{\\\
  partial \\mathbf{C}_t} \\odot \\mathbf{I}_t$$\n\n$$\\frac{\\partial \\mathcal{L}}{\\\
  partial C_{t-1}} = \\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{C}_t} \\odot\
  \ \\mathbf{F}_t$$\n\n令 $ZI_t = (\\mathbf{X}_t, \\mathbf{H}_{t-1})\\mathbf{W}_i +\
  \ \\mathbf{b}_i$，$ZF_t = (\\mathbf{X}_t, \\mathbf{H}_{t-1})\\mathbf{W}_f + \\mathbf{b}_f$，$ZO_t\
  \ = (\\mathbf{X}_t, \\mathbf{H}_{t-1})\\mathbf{W}_o + \\mathbf{b}_o$，则可得：\n\n$$\\\
  frac{\\partial \\mathcal{L}}{\\partial \\mathbf{ZI}_t} = \\sigma'(ZI_t) \\frac{\\\
  partial \\mathcal{L}}{\\partial \\mathbf{I}_t} = \\mathbf{I}_t(1 - \\mathbf{I}_t)\
  \ \\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{I}_t}$$\n\n$$\\frac{\\partial\
  \ \\mathcal{L}}{\\partial \\mathbf{ZF}_t} = \\sigma'(ZF_t) \\frac{\\partial \\mathcal{L}}{\\\
  partial \\mathbf{F}_t} = \\mathbf{F}_t(1 - \\mathbf{F}_t) \\frac{\\partial \\mathcal{L}}{\\\
  partial \\mathbf{F}_t}$$\n\n$$\\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{ZO}_t}\
  \ = \\sigma'(ZO_t) \\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{O}_t} = \\\
  mathbf{O}_t(1 - \\mathbf{O}_t) \\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{O}_t}$$\n\
  \n得到 $\\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{ZI}_t}, \\frac{\\partial\
  \ \\mathcal{L}}{\\partial \\mathbf{ZF}_t}, \\frac{\\partial \\mathcal{L}}{\\partial\
  \ \\mathbf{ZO}_t}$ 后，可同样求得损失函数关于 $\\mathbf{W}_i, \\mathbf{W}_f, \\mathbf{W}_o, \\\
  mathbf{X}_t, \\mathbf{H}_{t-1}$ 的梯度。请参考 4.2 节。\n\n### 7.7.3 LSTM 代码实现\n\nLSTM Cell\
  \ 共有 4 个单元，每个单元类似于非循环神经网络中的神经元，即先计算加权和，再通过激活函数产生非线性输出。最后更新总历史信息 $C_t$ 和状态 $\\mathbf{H}_t$。最后，Cell\
  \ 从 $\\mathbf{H}_t$ 计算当前输出值 $y_t$。模型参数包括 4 个单元中需要学习的模型参数，即 $(\\mathbf{W}_i, \\mathbf{b}_i)$、$(\\\
  mathbf{W}_f, \\mathbf{b}_f)$、$(\\mathbf{W}_o, \\mathbf{b}_o)$、$(\\mathbf{W}_c, \\\
  mathbf{b}_c)$ 以及计算最终输出 $y_t$ 的模型参数 $(\\mathbf{W}_y, \\mathbf{b}_y)$。\n\n以下函数初始化这些模型参数：\n\
  \n```\n```\n\n\n\n#### NumPy 实现 LSTM\n\n##### 参数初始化\n\n```python\nimport numpy as\
  \ np\n\ndef lstm_params_init(input_dim, hidden_dim, output_dim, scale=0.01):\n \
  \   normal = lambda m, n: np.random.randn(m, n) * scale\n    two = lambda: (normal(input_dim\
  \ + hidden_dim, hidden_dim), np.zeros((1, hidden_dim)))\n\n    Wi, bi = two()  #\
  \ 输入门参数\n    Wf, bf = two()  # 遗忘门参数\n    Wo, bo = two()  # 输出门参数\n    Wc, bc =\
  \ two()  # 候选细胞状态参数\n\n    Wy = normal(hidden_dim, output_dim)\n    by = np.zeros((1,\
  \ output_dim))\n\n    params = [Wi, bi, Wf, bf, Wo, bo, Wc, bc, Wy, by]\n    return\
  \ params\n```\n\n##### 状态初始化\n\n初始化细胞状态 `C[t]` 和隐藏状态 `h[t]`：\n\n```python\ndef lstm_state_init(batch_size,\
  \ hidden_size):\n    return (np.zeros((batch_size, hidden_size)),\n            np.zeros((batch_size,\
  \ hidden_size)))\n```\n\n##### 前向传播\n\n```python\ndef sigmoid(x):\n    return 1\
  \ / (1 + np.exp(-x))\n\ndef lstm_forward(params, Xs, state):\n    [Wi, bi, Wf, bf,\
  \ Wo, bo, Wc, bc, Wy, by] = params\n\n    (H, C) = state         # 初始状态\n    Hs\
  \ = {}\n    Cs = {}\n    Zs = []\n    Hs[-1] = np.copy(H)\n    Cs[-1] = np.copy(C)\n\
  \    Is = []\n    Fs = []\n    Os = []\n    C_tildas = []\n\n    for t in range(len(Xs)):\n\
  \        X = Xs[t]\n        XH = np.column_stack((X, H))\n\n        if False:\n\
  \            print(\"XH.shape\", XH.shape)\n            print(\"Wi.shape\", Wi.shape)\n\
  \            break\n\n        I = sigmoid(np.dot(XH, Wi) + bi)\n        F = sigmoid(np.dot(XH,\
  \ Wf) + bf)\n        O = sigmoid(np.dot(XH, Wo) + bo)\n        C_tilda = np.tanh(np.dot(XH,\
  \ Wc) + bc)\n\n        C = F * C + I * C_tilda\n        H = O * np.tanh(C)  # O\
  \ * C.tanh() # 输出状态\n        Y = np.dot(H, Wy) + by  # 输出\n\n        Zs.append(Y)\n\
  \        Hs[t] = H\n        Cs[t] = C\n        Is.append(I)\n        Fs.append(F)\n\
  \        Os.append(O)\n        C_tildas.append(C_tilda)\n\n    return Zs, Hs, Cs,\
  \ (Is, Fs, Os, C_tildas)\n```\n\n同样，某一时刻的前向计算也可以作为一个单独的函数使用：\n\n```python\ndef lstm_forward_step(params,\
  \ X, H, C):\n    [Wi, bi, Wf, bf, Wo, bo, Wc, bc, Wy, by] = params\n    XH = np.column_stack((X,\
  \ H))\n\n    I = sigmoid(np.dot(XH, Wi) + bi)\n    F = sigmoid(np.dot(XH, Wf) +\
  \ bf)\n    O = sigmoid(np.dot(XH, Wo) + bo)\n    C_tilda = np.tanh(np.dot(XH, Wc)\
  \ + bc)\n\n    C = F * C + I * C_tilda\n    H = O * np.tanh(C)  # O * tanh(C) #\
  \ 输出状态\n    Y = np.dot(H, Wy) + by  # 输出\n\n    return Y, H, C, (I, F, O, C_tilda)\n\
  ```\n\n##### 反向传播\n\n```python\nimport math\n\ndef dsigmoid(x):\n    return sigmoid(x)\
  \ * (1 - sigmoid(x))\n\ndef dtanh(x):\n    return 1 - np.tanh(x) * np.tanh(x)\n\n\
  def grad_clipping(grads, alpha):\n    norm = math.sqrt(sum((grad ** 2).sum() for\
  \ grad in grads))\n    if norm > alpha:\n        ratio = alpha / norm\n        for\
  \ i in range(len(grads)):\n            grads[i] *= ratio\n\ndef lstm_backward(params,\
  \ Xs, Hs, Cs, dZs, cache, clip_value=5.):\n    [Wi, bi, Wf, bf, Wo, bo, Wc, bc,\
  \ Wy, by] = params\n    Is, Fs, Os, C_tildas = cache\n\n    dWi, dWf, dWo, dWc,\
  \ dWy = np.zeros_like(Wi), np.zeros_like(Wf), np.zeros_like(Wo), np.zeros_like(Wc),\
  \ np.zeros_like(Wy)\n    dbi, dbf, dbo, dbc, dby = np.zeros_like(bi), np.zeros_like(bf),\
  \ np.zeros_like(bo), np.zeros_like(bc), np.zeros_like(by)\n\n    dH_next = np.zeros_like(Hs[0])\n\
  \    dC_next = np.zeros_like(Cs[0])\n\n    input_dim = Xs[0].shape[1]\n    h = Hs\n\
  \    x = Xs\n    T = len(Xs)\n\n    for t in reversed(range(T)):\n        I = Is[t]\n\
  \        F = Fs[t]\n        O = Os[t]\n        C_tilda = C_tildas[t]\n        H\
  \ = Hs[t]\n        X = Xs[t]\n        C = Cs[t]\n        H_pre = Hs[t-1]\n     \
  \   C_prev = Cs[t-1]\n\n        XH_pre = np.column_stack((X, H_pre))\n        XH_\
  \ = XH_pre\n\n        dZ = dZs[t]\n\n        # 输出模型参数 f 的 idu（注：原文 \"idu\" 可能为笔误，此处保留原意）\n\
  \        dWy += np.dot(H.T, dZ)\n        dby += np.sum(dZ, axis=0, keepdims=True)\n\
  \n        # 隐藏状态 h 的梯度\n        dH = np.dot(dZ, Wy.T) + dH_next\n        dC = dH\
  \ * O * dtanh(C) + dC_next  # H_t = O_t * tanh(C_t)\n\n        dO = np.tanh(C) *\
  \ dH\n        dOZ = O * (1 - O) * dO          # O = sigma(Z_o)\n        dWo += np.dot(XH_.T,\
  \ dOZ)       # Z_o = (X, H_) W_o + b_o\n        dbo += np.sum(dOZ, axis=0, keepdims=True)\n\
  \n        # di\n        di = C_tilda * dC\n        diZ = I * (1 - I) * di\n    \
  \    dWi += np.dot(XH_.T, diZ)\n        dbi += np.sum(diZ, axis=0, keepdims=True)\n\
  \n        # df\n        df = C_prev * dC\n        dfZ = F * (1 - F) * df\n     \
  \   dWf += np.dot(XH_.T, dfZ)\n        dbf += np.sum(dfZ, axis=0, keepdims=True)\n\
  \n        # dC_bar\n        dC_tilda = I * dC                         # C = F *\
  \ C + I * C_tilda\n        dC_tilda_Z = (1 - np.square(C_tilda)) * dC_tilda  # C_tilda\
  \ = tanh(C_tilda_Z)\n        dWc += np.dot(XH_.T, dC_tilda_Z)     # C_tilda_Z =\
  \ (X, H_) W_c + b_c\n        dbc += np.sum(dC_tilda_Z, axis=0, keepdims=True)\n\n\
  \        dXH_ = (np.dot(dfZ, Wf.T)\n             + np.dot(diZ, Wi.T)\n         \
  \    + np.dot(dC_tilda_Z, Wc.T)\n             + np.dot(dOZ, Wo.T))\n\n        dX_prev\
  \ = dXH_[:, :input_dim]\n        dH_prev = dXH_[:, input_dim:]\n        dC_prev\
  \ = F * dC\n\n        dC_next = dC_prev\n        dH_next = dH_prev\n\n    grads\
  \ = [dWi, dbi, dWf, dbf, dWo, dbo, dWc, dbc, dWy, dby]\n    grad_clipping(grads,\
  \ clip_value)\n\n    # for dparam in [dWi, dbi, dWf, dbf, dWo, dbo, dWc, dbc, dWy,\
  \ dby]:\n    #     np.clip(dparam, -5, 5, out=dparam) # 裁剪以缓解梯度爆炸\n\n    return\
  \ grads\n```\n\n##### 梯度测试\n\n```python\nT = 3\ninput_dim, hidden_dim, output_dim\
  \ = 4, 3, 4\nbatch_size = 2\n\nXs = np.random.randn(T, batch_size, input_dim)\n\
  Ys = np.random.randint(output_dim, size=(T, batch_size))\n\nprint(\"Xs\", Xs)\n\
  print(\"Ys\", Ys)\n\n# 检查梯度\nparams = lstm_params_init(input_dim, hidden_dim, output_dim)\n\
  HC = lstm_state_init(batch_size, hidden_dim)\nZs, Hs, Cs, cache = lstm_forward(params,\
  \ Xs, HC)\n\nloss_function = rnn_loss_grad\nloss, dZs = loss_function(Zs, Ys)\n\n\
  grads = lstm_backward(params, Xs, Hs, Cs, dZs, cache)\n\ndef rnn_loss():\n    HC\
  \ = lstm_state_init(batch_size, hidden_dim)\n    Zs, Hs, Cs, cache = lstm_forward(params,\
  \ Xs, HC)\n    loss_function = rnn_loss_grad\n    loss, dZs = loss_function(Zs,\
  \ Ys)\n    return loss\n\nnumerical_grads = util.numerical_gradient(rnn_loss, params,\
  \ 1e-6)  # rnn_numerical_gradient(rnn_loss, params, 1e-10)\n\n# diff_error = lambda\
  \ x, y: np.max( np.abs(x - y)/(np.maximum(1e-8, np.abs(x) + np.abs(y))))\ndiff_error\
  \ = lambda x, y: np.max(np.abs(x - y))\n\ndef rel_error(x, y):\n    \"\"\" 返回相对误差\
  \ \"\"\"\n    return np.max(np.abs(x - y) / (np.maximum(1e-8, np.abs(x) + np.abs(y))))\n\
  \nprint(\"loss\", loss)\nprint(\"[Wi, bi, Wf, bf, Wo, bo, Wc, bc, Wy, by]\")\n\n\
  for i in range(len(grads)):\n    print(diff_error(grads[i], numerical_grads[i]))\n\
  \nprint(\"grads\", grads[0])\nprint(\"numerical_grads\", numerical_grads[0])\n```\n\
