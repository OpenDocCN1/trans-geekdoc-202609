  \ 0 0]\n```\n\n```\nreg = 0.0\nalpha=0.0001\niterations=10000\nw_history = gradient_descent_logistic_reg(X,y,reg,alpha,iterations)\n\
  w = w_history[-1]\nprint(\"w:\",w)\n\nloss_history = loss_history_logistic(w_history,X,y,reg)\n\
  print(loss_history[:-1:len(loss_history)//10])\n```\n\n```\nw: [-0.10784884 -0.59039117\
  \ -0.33446609 -0.31856867 -0.09292942]\n    [0.691647452939996, 0.04139644267230338,\
  \ 0.021270173400400796, 0.014388875912695448, 0.010902234144325786, 0.0087906172126\
  \ 22023, 0.007372547259035234, 0.006353506410124969, 0.005585274554324254, 0.004985062855525219]\n\
  ```\n\n```\n# Print accuracy\nX_1 = np.hstack((np.ones((X.shape[0], 1), dtype=X.dtype),X))\
  \ #Add a column of features 1\ny_predictions = sigmoid(X_1 @ w)>=0.5\n\nprint ('The\
  \ accuracy of the prediction is: %d ' % float((np.dot(y, y_predictions)\n      \
  \                         + np.dot(1 - y,1 - y_predictions)) / float(y.size) * 100)\
  \ +'%')\nplt.plot(history, color='r')\n```\n\n```\nThe accuracy of the prediction\
  \ is: 100 %\n```\n\n![](img/file75.png)\n\n图 3-39 鸢尾花数据集的训练损失曲线\n\n当然，这里没有使用验证集和测试集来评估训练好的模型。读者可以尝试将原始数据集划分为训练集、验证集和测试集，然后计算验证集和测试集的误差并绘制相应的学习曲线。观察训练模型的拟合效果。\n\
  \n## 3.6 Softmax 回归\n\n逻辑回归可以解决二分类问题，但许多分类问题是包含 2 个以上类别的多分类问题。例如，在手写数字识别中，需要从图中所示的手写数字图像中识别出图像中的数字是\
  \ 0 到 9 中的哪一个，即目标值是 10 个类别中的某一个类别。\n\n![](img/file76.png \"fig:\")  \n\n图 3-40 手写数字图像\n\
  \n这类多分类问题当然可以转化为二分类问题来求解。例如，首先将问题视为识别 0 和非 0 数字的二分类问题。如果是非 0 数字，则将问题视为识别 1 和非 1\
  \ 数字的二分类问题，以此类推。每个数字训练一个逻辑回归二分类模型，10 个数字就需要训练 10 个逻辑回归模型。\n\n与逻辑回归的假设函数仅输出一个值来表示数据属于两个分类中的某一个不同，Softmax\
  \ 回归是逻辑回归的推广。其假设函数可以输出与多分类类别数量相同的值，表示数据属于每个分类的概率。\n\n### 3.6.1 螺旋数据集\n\n以下代码在二维平面上生成一个\
  \ 3 类别的数据集：\n\n\n\n\n```python\nimport numpy as np\nimport matplotlib.pyplot as\
  \ plt\n%matplotlib inline\n\nnp.random.seed(100)\n\ndef gen_spiral_dataset(N=100,\
  \ D=2, K=3):\n    N = 100  # 每个类别的点数\n    D = 2  # 维度\n    K = 3  # 类别数\n    X =\
  \ np.zeros((N*K, D))  # 数据矩阵（每行 = 单个样本）\n    y = np.zeros(N*K, dtype='uint8')  #\
  \ 类别标签\n    for j in range(K):\n        ix = range(N*j, N*(j+1))\n        r = np.linspace(0.0,\
  \ 1, N)  # 半径\n        t = np.linspace(j*4, (j+1)*4, N) + np.random.randn(N)*0.2\
  \  # 角度\n        X[ix] = np.c_[r*np.sin(t), r*np.cos(t)]\n        y[ix] = j\n  \
  \  return X, y\n\nN = 100  # 每个类别的点数\nD = 2  # 维度\nK = 3  # 类别数\n\nX_spiral, y_spiral\
  \ = gen_spiral_dataset()\n# 让我们可视化一下数据：\nplt.scatter(X_spiral[:, 0], X_spiral[:,\
  \ 1], c=y_spiral, s=20, cmap=plt.cm.spring)  # s=40, cmap=plt.cm.Spectral)\nplt.show()\n\
  ```\n\n![](img/file77.png)\n\n图 3-41 二维平面上的三类数据集\n\n### 3.6.2 softmax 函数\n\n`softmax`\
  \ 函数是一个多元向量值函数，它接受多个（例如 3 个）输入值并产生相同数量（例如 3 个）的输出值。对于 3 个自变量（`z[1]`、`z[2]`、`z[3]`）的\
  \ `softmax(z[1], z[2], z[3])`，函数值是一个具有相同数量自变量的向量：\n\n$$\n\\begin{matrix} \n{softmax(z_{1},z_{2},z_{3})}\
  \ & {= (\\frac{e^{z_{1}}}{(e^{z_{1}} + e^{z_{2}} + e^{z_{3}})}, \\frac{e^{z_{2}}}{(e^{z_{1}}\
  \ + e^{z_{2}} + e^{z_{3}})}, \\frac{e^{z_{3}}}{(e^{z_{1}} + e^{z_{2}} + e^{z_{3}})})}\
  \ \\\\ \n& {= (\\frac{e^{z_{1}}}{\\sum\\limits_{1}^{3}e^{z_{i}}}, \\frac{e^{z_{2}}}{\\\
  sum\\limits_{1}^{3}e^{z_{i}}}, \\frac{e^{z_{3}}}{\\sum\\limits_{1}^{3}e^{z_{i}}})}\
  \ \n\\end{matrix}\n$$\n\n显然，`softmax()` 函数输出向量的每个分量值都位于 `[0, 1]` 区间内，且所有分量值之和为 1，因此每个分量都可以被视为一个概率值。\n\
  \n下面的 `softmax()` 函数是计算 softmax 函数的代码：\n\n```python\nimport numpy as np\n\ndef softmax(x):\n\
  \    e_x = np.exp(x)\n    return e_x / e_x.sum()\n```\n\n输入一个 3 维向量 `z`，`softmax`\
  \ 函数输出一个 3 维向量，其每个分量代表一个概率，即这些分量的值在 `[0, 1]` 之间，且它们的和等于 1。\n\n```python\nz = [3.0,\
  \ 1.0, 0.2]\nsoftmax(z)\n```\n\n```\narray([0.8360188, 0.11314284, 0.05083836])\n\
  ```\n\n注意：`softmax()` 作用于 `z = [3.0, 1.0, 0.2]`，得到的值 $softmax(z) = [\\frac{e^{3.0}}{e^{3.0}\
  \ + e^{1.0} + e^{0.2}}, \\frac{e^{1.0}}{e^{3.0} + e^{1.0} + e^{0.2}}, \\frac{e^{0.2}}{e^{3.0}\
  \ + e^{1.0} + e^{0.2}}]$ 与 `z` 的值不是线性关系。\n\n对于较大值的 `x`，`e^x` 将超出计算机可表示的数值范围，导致 `softmax()`\
  \ 的值溢出，例如：\n\n```python\nz = [100, 1000]\nsoftmax(z)\n```\n\n```\n<ipython-input-1-e3aa77d695fd>:4:\
  \ RuntimeWarning: overflow encountered in exp\n  e_x = np.exp(x)\n<ipython-input-1-e3aa77d695fd>:5:\
  \ RuntimeWarning: invalid value encountered in true_divide\n  return e_x / e_x.sum()\n\
  \narray([0., nan])\n```\n\n由于分数的分子分母同时除以一个数，分数值保持不变，即：\n\n$$\n\\frac{e^{z_{j}}}{\\\
  sum\\limits_{i}e^{z_{i}}} = \\frac{e^{z_{j}}/e^{a}}{\\sum\\limits_{i}{e^{z_{i}}/e^{a}}}\
  \ = \\frac{e^{z_{j} - a}}{\\sum\\limits_{i}e^{z_{i} - a}}\n$$\n\n因此，可以先找出所有 `z[i]`\
  \ 的最大值 `a`，然后用 `z[i] - a` 来计算 `softmax()` 函数的值。\n\n```python\ndef softmax(x):  \
  \ \n    e_x = np.exp(x - np.max(x))\n    return e_x / e_x.sum()\n\nprint(softmax(z))\n\
  z = [500, 1000]\nsoftmax(z)\n```\n\n```\n[0.1.]\n\narray([7.12457641e-218, 1.00000000e+000])\n\
  ```\n\n上述代码适用于输入向量，如 `z = (z[1], z[2], z[3])`，它能用于由许多输入向量组成的矩阵（二维数组）吗？比如：\n\n```python\n\
  z = np.array([[1, 2, 3], [6, 2, 4]])\nsoftmax(z)\n```\n\n```\narray([[0.00548473,\
  \ 0.01490905, 0.04052699],\n       [0.8140064 , 0.01490905, 0.11016379]])\n```\n\
  \n对于输入向量 `[1, 2, 3]`，输出向量值为 `[0.00548473, 0.01490905, 0.04052699]`，这不满足概率的归一化条件，即\
  \ `0.00548473 + 0.01490905 + 0.04052699 != 1`。这是因为上述 `softmax()` 函数中的 `e_x.sum()`\
  \ 对数组的所有元素求和。正确的做法是分别为每个样本计算其属于各个类别的概率，即为每个样本计算其 softmax 输出，求和应针对该样本的各个分量进行。此外，`max()`\
  \ 函数只需计算该样本所有分量的最大值，而不需要整个数组的最大值（虽然也没有问题）。\n\n为了同时为多个样本计算各自的 `softmax()` 函数值，应分别为每个样本计算\
  \ softmax 值向量。为此，将上述代码重写为：\n\n```python\ndef softmax(x):   \n    a = np.max(x, axis=-1,\
  \ keepdims=True)  \n    e_x = np.exp(x - a)\n    return e_x / np.sum(e_x, axis=-1,\
  \ keepdims=True)\n\nsoftmax(z)\n```\n\n```\narray([[0.09003057, 0.24472847, 0.66524096],\n\
  \       [0.86681333, 0.01587624, 0.11731043]])\n```\n\n上述 numpy 函数 `np.max()` 和\
  \ `np.sum()` 的参数 `axis=1` 表示沿轴（列）执行相应的最大值（`max`）和求和（`sum`）操作。`keepdims=True` 表示不改变结果数组的维度，即结果数组与原数组具有相同的维度。\n\
  \n上述代码首先找出每个行向量的最大值，从每个行向量中减去其最大值并计算其指数值，最后按行计算 softmax 函数的值，每一行输入产生一个对应的输出向量来表示概率。上述代码可以进一步简化：\n\
  \n```python\ndef softmax(x):\n    e_x = np.exp(x - np.max(x, axis=-1, keepdims=True))\n\
  \    return e_x / np.sum(e_x, axis=-1, keepdims=True)\n\nsoftmax(z)\n```\n\n```\n\
  array([[0.09003057, 0.24472847, 0.66524096],\n       [0.86681333, 0.01587624, 0.11731043]])\n\
  ```\n\n一般来说，假设 `z = (z[1], z[2], ..., z[k], ..., z[C])`，用 `f(z)` 表示 `softmax(z)`\
  \ 函数，则：\n\n$$f_{i} = \\frac{e^{z_{i}}}{\\sum\\limits_{k = 1}^{C}e^{z_{k}}}$$\n\n\
  其中，$\\sum\\limits_{i = 1}^{C}f_{i} = 1$。\n\n为了防止计算溢出，可以让每个分量减去它们的最大值，即：\n\n$$f_i\
  \ = \\frac{e^{z_i - max(z)}}{\\sum_{k=1}^C e^{z_k - max(z)}}$$\n\n为了求 `f(z) = softmax(z)`\
  \ 关于 `z` 的梯度，引入中间变量 `a[i] = e^(z[i])`，$b = \\sum\\limits_{k = 1}^{C}e^{z_{k}}$，则：\n\
  \n$$f_{i} = \\frac{a_{i}}{b}$$\n\n将 `a[i]` 视为 `z[k]` 的函数，则有：\n\n$$\\frac{\\partial\
  \ a_{i}}{\\partial z_{i}} = \\frac{\\partial e^{z_{i}}}{\\partial z_{i}} = e^{z_{i}}$$\
  \  \n\n$$\\frac{\\partial a_{i}}{\\partial z_{j}} = \\frac{\\partial e^{z_{i}}}{\\\
  partial z_{j}} = 0$$\n\n`b` 也是 `z[k]` 的函数。同样地，有：\n\n$$\\frac{\\partial b}{\\partial\
  \ z_{i}} = \\frac{\\partial(\\sum\\limits_{k = 1}^{C}e^{z_{k}})}{\\partial z_{i}}\
  \ = e^{z_{i}}$$\n\n根据除法求导法则，有：\n\n$$\\frac{\\partial f_{i}}{\\partial z_{i}} = \\\
  frac{\\frac{\\partial a_{i}}{\\partial z_{i}} \\cdot b - a_{i}\\frac{\\partial b}{\\\
  partial z_{i}}}{b^{2}} = \\frac{a_{i}b - a_{i}a_{i}}{b^{2}} = \\frac{a_{i}}{b}(1\
  \ - \\frac{a_{i}}{b}) = f_{i}(1 - f_{i}) = f_{i} - f_{i}f_{i}$$\n\n\n\n\n\n####\
  \ Softmax 回归与梯度计算\n\n##### Softmax 函数梯度推导\n\n$$\n\\frac{\\partial f_{i}}{\\partial\
  \ z_{j}} = \\frac{\\frac{\\partial a_{i}}{\\partial z_{j}} \\cdot b - a_{i}\\frac{\\\
  partial b}{\\partial z_{j}}}{b^{2}} = \\frac{0 - a_{i}a_{j}}{b^{2}} = - f_{i}f_{j}\n\
  $$\n\n$$\n\\frac{\\partial \\mathbf{f}\\mathbf{f}}{\\partial \\mathbf{z}\\mathbf{z}}\
  \ = \n\\begin{bmatrix} \nf_{1}(1 - f_{1}) & - f_{1}f_{2} & \\cdots & - f_{1}f_{C}\
  \ \\\\\n- f_{2}f_{1} & f_{2}(1 - f_{2}) & \\cdots & - f_{2}f_{C} \\\\\n\\vdots &\
  \ \\vdots & \\cdots & \\vdots \\\\\n- f_{C}f_{1} & - f_{C}f_{2} & \\cdots & f_{C}(1\
  \ - f_{C}) \n\\end{bmatrix}\n$$\n\n向量 $\\mathbf{f}\\mathbf{f} = (f[1], f[2], \\\
  cdots, f[k], \\cdots, f[C])$ 的外积 `np.outer(ff, ff)` 可用于计算由 $f_i f_j$ 组成的矩阵：\n\n\
  $$\n\\begin{bmatrix} \nf_{1}f_{1} & f_{1}f_{2} & \\cdots & f_{1}f_{C} \\\\\nf_{2}f_{1}\
  \ & f_{2}f_{2} & \\cdots & f_{2}f_{C} \\\\\n\\vdots & \\vdots & \\cdots & \\vdots\
  \ \\\\\nf_{C}f_{1} & f_{C}f_{2} & \\cdots & f_{C}f_{C} \n\\end{bmatrix}\n$$\n\n\
  因此，$\\mathbf{f}\\mathbf{f}$ 关于 $\\mathbf{z}\\mathbf{z}$ 的梯度可按如下方式计算：\n\n```python\n\
  def softmax_gradient(z, isF=False):   \n    if isF:\n        f = z\n    else:\n\
  \        f = softmax(z)\n    grad = -np.outer(f, f) + np.diag(f.flatten())\n   \
  \ return grad\n```\n\n若已知另一变量（如损失函数 $L$）关于 $\\mathbf{f}\\mathbf{f}$ 的梯度 $\\nabla_{\\\
  mathbf{f}\\mathbf{f}}L = \\frac{\\partial L}{\\partial \\mathbf{f}\\mathbf{f}} =\
  \ (\\frac{\\partial L}{\\partial f_{1}},\\frac{\\partial L}{\\partial f_{2}},\\\
  cdots,\\frac{\\partial L}{\\partial f_{C}})$，则：\n\n$$\n\\nabla_{\\mathbf{z}\\mathbf{z}}L\
  \ = \\frac{\\partial L}{\\partial \\mathbf{z}\\mathbf{z}} = \\frac{\\partial L}{\\\
  partial \\mathbf{f}\\mathbf{f}}\\frac{\\partial \\mathbf{f}\\mathbf{f}}{\\partial\
  \ \\mathbf{z}\\mathbf{z}}\n$$\n\n用 `df` 表示某变量 $L$ 关于 $\\mathbf{f}$ 的梯度，则 $L$ 关于\
  \ $\\mathbf{z}$ 的梯度 Python 计算代码如下：\n\n```python\ndef softmax_backward(z, df, isF=False):\
  \     \n    grad = softmax_gradient(z, isF)    \n    return df @ grad\n```\n\n测试代码：\n\
  \n```python\nx = np.array([[1, 2]])\nprint(softmax_gradient(x))\ndf = np.array([1,\
  \ 3])\nprint(softmax_backward(x, df))\n```\n\n输出：\n\n```\n[[ 0.19661193 -0.19661193]\n\
  \ [-0.19661193  0.19661193]]\n[-0.39322387  0.39322387]\n```\n\n##### 多样本梯度计算\n\n\
  针对多样本，可使用以下代码计算 softmax 梯度：\n\n```python\ndef softmax_gradient(z, isF=False): \n\
  \    if isF:\n        f = z\n    else:\n        f = softmax(z)\n    \n    if len(f)\
  \ == 1:  # 修正原文中未定义的 df 变量\n        return -np.outer(f, f) + np.diag(f.flatten())\n\
  \    else:  \n        grads = []\n        for i in range(len(f)):\n            fi\
  \ = f[i]\n            grad = -np.outer(fi, fi) + np.diag(fi.flatten())  \n     \
  \       grads.append(grad)\n        return np.array(grads)\n\nx = np.array([[1,\
  \ 2], [2, 5]])\nprint(softmax_gradient(x))\n```\n\n输出：\n\n```\n[[ 0.19661193 -0.19661193]\n\
  \ [-0.19661193  0.19661193]]\n[[-0.39322387  0.39322387]\n [-0.09035332  0.09035332]]\
  \  # 修正原文输出与代码逻辑一致\n```\n\n利用 `np.einsum()` 实现多样本外积的向量化运算：\n\n```python\ndef softmax_gradient(Z,\
  \ isF=False):  \n    if isF:\n        F = Z\n    else:\n        F = softmax(Z) \
  \  \n    D = []\n    for i in range(F.shape[0]):\n        f = F[i]\n        D.append(np.diag(f.flatten()))\n\
  \    grads = np.array(D) - np.einsum('ij,ik->ijk', F, F)\n    return grads\n\nprint(softmax_gradient(x))\n\
  ```\n\n输出：\n\n```\n[[[ 0.19661193 -0.19661193]\n  [-0.19661193  0.19661193]]\n\n\
  \ [[ 0.04517666 -0.04517666]\n  [-0.04517666  0.04517666]]]\n```\n\n##### 反向传播梯度计算\n\
  \n若已知函数（如损失函数）关于 softmax 输出值 $\\mathbf{F}$ 的梯度 `dF`，可用以下函数求函数关于 softmax 输入 $\\mathbf{Z}$\
  \ 的梯度：\n\n```python\ndef softmax_backward(Z, dF, isF=True):     \n    grads = softmax_gradient(Z,\
  \ isF)    \n    grad = np.einsum(\"bj, bjk -> bk\", dF, grads)  # [B,D]*[B,D,D]\
  \ -> [B,D]\n    return grad\n\ndf = np.array([[1, 3], [2, 4]])\nprint(softmax_backward(x,\
  \ df))     \n```\n\n输出：\n\n```\n[[-0.39322387  0.39322387]\n [-0.09035332  0.09035332]]\n\
  ```\n\n---\n\n## 3.6.3 Softmax 回归\n\nSoftmax 回归的模型函数将多元线性回归函数的输出值作为 softmax 函数的输入，从而输出同等数量的概率值。即\
  \ Softmax 回归模型函数是由多个线性回归与一个 softmax 函数复合而成。\n\n如图所示，针对 3 分类问题，可使用 3 个线性回归函数生成 3\
  \ 个输出，经 softmax 函数得到 3 个值 $f_i\\ (i=1,2,3)$，分别表示样本属于 3 个类别的概率，满足 $\\sum_{1}^{3}f_i\
  \ = 1$。\n\n**图 3-42** Softmax 回归的假设函数由 3 个加权求和与一个 softmax 函数组成\n\n该 Softmax 回归函数的计算公式为：\n\
  \n$$\n\\begin{aligned}\n\\mathbf{f}(\\mathbf{x}\\mathbf{x}) &= (f_1, f_2, f_3) \\\
  \\\n&= \\text{softmax}(x_1W_{11} + x_2W_{21} + x_3W_{31} + b_1,\\\\\n&\\quad\\quad\
  \ x_1W_{12} + x_2W_{22} + x_3W_{32} + b_2,\\\\\n&\\quad\\quad x_1W_{13} + x_2W_{23}\
  \ + x_3W_{33} + b_3)\n\\end{aligned}\n$$\n\n对于手写数字识别的 10 分类问题，可用 10 个线性回归函数 $\\\
  mathbf{x}\\mathbf{x}\\mathbf{W}[:, i]$ 从输入特征 $\\mathbf{x}\\mathbf{x}$ 生成 10 个输出值\
  \ $z_i$，再经 softmax 函数转为 10 个概率值 $f_i$，即 $\\sum_{1}^{10}f_i = 1 \\land f_i \\in [0,1]$。\n\
  \n同线性回归，偏置 $b_i$ 视为 $w_{0i}$，即 $\\mathbf{W}[:, i] = (w_{0i}, w_{1i}, w_{2i}, w_{3i})$；输入\
  \ $\\mathbf{x}\\mathbf{x}$ 增广为 $(1, x_1, x_2, x_3)$。上式可简写为：\n\n$$\n\\mathbf{f}(\\\
  mathbf{x}\\mathbf{x}) = \\text{softmax}(\\mathbf{x}\\mathbf{x}\\mathbf{W}[:, 1],\
  \ \\mathbf{x}\\mathbf{x}\\mathbf{W}[:, 2], \\mathbf{x}\\mathbf{x}\\mathbf{W}[:,\
  \ 3]) = \\text{softmax}(\\mathbf{x}\\mathbf{x}\\mathbf{W}\\mathbf{W})\n$$\n\n其中\
  \ $\\mathbf{W}[:, i]$ 为 $\\mathbf{W}$ 第 $i$ 列，$\\mathbf{x}\\mathbf{x}\\mathbf{W}[:,\
  \ i]$ 视为中间变量 $z_i$，则 $\\text{softmax}(\\mathbf{x}\\mathbf{x}\\mathbf{W}\\mathbf{W})$\
  \ 可表达为：\n\n$$\n\\text{softmax}(z_1,z_2,z_3) = \n\\left(\n\\frac{e^{z_1}}{e^{z_1}+e^{z_2}+e^{z_3}},\n\
  \\frac{e^{z_2}}{e^{z_1}+e^{z_2}+e^{z_3}},\n\\frac{e^{z_2}}{e^{z_1}+e^{z_2}+e^{z_3}}\n\
  \\right)\n=\n\\left(\n\\frac{e^{z_1}}{\\sum_{1}^{3}e^{z_i}},\n\\frac{e^{z_2}}{\\\
  sum_{1}^{3}e^{z_i}},\n\\frac{e^{z_2}}{\\sum_{1}^{3}e^{z_i}}\n\\right)\n$$\n\n对样本\
  \ $\\mathbf{x}\\mathbf{x}$，$\\mathbf{f}(\\mathbf{x}\\mathbf{x}) = \\text{softmax}(\\\
  mathbf{x}\\mathbf{x}\\mathbf{W}\\mathbf{W})$ 为向量，每分量代表 $\\mathbf{x}\\mathbf{x}$\
  \ 属对应类别的概率。例如 $f_j$ 代表 $\\mathbf{x}\\mathbf{x}$ 属第 $j$ 类的概率。若样本 $(\\mathbf{x}\\\
  mathbf{x}^{(i)}, y^{(i)})$ 真实标签 $y^{(i)}=2$，则该样本属第 2 类的概率为 $f_2$，即 $f_{y^{(i)}}$。\n\
  \n#### 多样本形式\n\n$m$ 个样本的特征加权和 $\\mathbf{X}\\mathbf{X}\\mathbf{W}\\mathbf{W}$ 为二维矩阵，每行对应一个样本的加权和，记为\
  \ $\\mathbf{Z}\\mathbf{Z}$：\n\n$$\n\\mathbf{Z}\\mathbf{Z} = \n\\begin{bmatrix} \n\
  \\mathbf{z}^{(1)} \\\\\n\\mathbf{z}^{(2)} \\\\\n\\vdots \\\\\n\\mathbf{z}^{(m)}\
  \ \n\\end{bmatrix}\n=\n\\begin{bmatrix} \n\\mathbf{x}\\mathbf{x}^{(1)}\\mathbf{W}\\\
  mathbf{W} \\\\\n\\mathbf{x}\\mathbf{x}^{(2)}\\mathbf{W}\\mathbf{W} \\\\\n\\vdots\
  \ \\\\\n\\mathbf{x}\\mathbf{x}^{(m)}\\mathbf{W}\\mathbf{W} \n\\end{bmatrix}\n$$\n\
  \n每个样本 $\\mathbf{x}\\mathbf{x}^{(i)}$ 对应的加权和 $\\mathbf{z}\\mathbf{z}^{(i)}$ 本身是向量，softmax\
  \ 函数作用于该向量生成向量 $\\text{softmax}(\\mathbf{z}\\mathbf{z}^{(i)})$，表示该样本属各类别的概率。用 $\\\
  mathbf{f}\\mathbf{f}^{(i)}$ 表示 $\\text{softmax}(\\mathbf{z}\\mathbf{z}^{(i)})$，所有\
  \ $\\mathbf{f}\\mathbf{f}^{(i)}$ 可表示为列向量 $\\mathbf{F}\\mathbf{F}$ 形式：\n\n\n\n\n\n\
  #### 多类别 Softmax 回归的数学表示\n\n$$\n\\begin{matrix} \nF = \\begin{bmatrix} \nf^{(1)}\
  \ \\\\ \nf^{(2)} \\\\ \n\\vdots \\\\ \nf^{(m)} \\\\ \n\\end{bmatrix} = \\begin{bmatrix}\
  \ \n\\frac{e^{z_{1}^{(1)}}}{\\sum\\limits_{1}^{C}e^{z_{i}^{(1)}}} & \\frac{e^{z_{2}^{(1)}}}{\\\
  sum\\limits_{1}^{C}e^{z_{i}^{(1)}}} & \\cdots & \\frac{e^{z_{C}^{(1)}}}{\\sum\\\
  limits_{1}^{C}e^{z_{i}^{(1)}}} \\\\ \n\\frac{e^{z_{1}^{(2)}}}{\\sum\\limits_{1}^{C}e^{z_{i}^{(2)}}}\
  \ & \\frac{e^{z_{2}^{(2)}}}{\\sum\\limits_{1}^{C}e^{z_{i}^{(2)}}} & \\cdots & \\\
  frac{e^{z_{C}^{(2)}}}{\\sum\\limits_{1}^{C}e^{z_{i}^{(2)}}} \\\\ \n\\vdots & & &\
  \ \\\\ \n\\frac{e^{z_{1}^{(m)}}}{\\sum\\limits_{1}^{C}e^{z_{i}^{(m)}}} & \\frac{e^{z_{2}^{(m)}}}{\\\
  sum\\limits_{1}^{C}e^{z_{i}^{(m)}}} & \\cdots & \\frac{e^{z_{C}^{(m)}}}{\\sum\\\
  limits_{1}^{C}e^{z_{i}^{(m)}}} \\\\ \n\\end{bmatrix}\n\\end{matrix}\n$$\n\n样本的目标值（标签）可以用一维向量\
  \ `y` 表示，其中每个元素代表样本对应的真实目标类别的整数。目前：\n\n$$\n\\begin{matrix} \ny = \\begin{bmatrix}\
  \ \ny^{(1)} \\\\ \ny^{(2)} \\\\ \n\\vdots \\\\ \ny^{(m)} \\\\ \n\\end{bmatrix}\n\
  \\end{matrix}\n$$\n\n用向量 `F_y` 表示所有样本 $i$ 对应的真实类别 $y^{(i)}$ 的概率，这些概率也构成一个向量：\n\n\
  $$\n\\begin{matrix} \nF_y = \\begin{bmatrix} \nf_{y^{(1)}}^{(1)} \\\\ \nf_{y^{(2)}}^{(2)}\
  \ \\\\ \n\\vdots \\\\ \nf_{y^{(m)}}^{(m)} \\\\ \n\\end{bmatrix} = \\begin{bmatrix}\
  \ \n\\frac{e^{z_{y_{(1)}}^{(1)}}}{\\sum\\limits_{1}^{C}e^{z_{i}^{(1)}}} \\\\ \n\\\
  frac{e^{z_{y_{(2)}}^{(2)}}}{\\sum\\limits_{1}^{C}e^{z_{i}^{(2)}}} \\\\ \n\\vdots\
  \ \\\\ \n\\frac{e^{z_{y_{(m)}}^{(m)}}}{\\sum\\limits_{1}^{C}e^{z_{i}^{(m)}}} \\\\\
  \ \n\\end{bmatrix}\n\\end{matrix}\n$$\n\n### 3.6.4 多分类交叉熵损失\n\n对于样本 $(x^{(i)}, y^{(i)})$，其数据特征\
  \ $x^{(i)}$ 经 Softmax 回归模型输出为该样本属于每一类的概率：\n\n$f_1^{(i)}, f_2^{(i)}, \\cdots, f_C^{(i)}$\n\
  \n而该样本属于目标类别 $y^{(i)}$ 的概率为 $f_{y^{(i)}}^{(i)}$，该概率 $f_{y^{(i)}}^{(i)}$ 表示该样本出现在目标类别中的概率。同理，$m$\
  \ 个样本 $(x^{(i)}, y^{(i)})$ 同时与其对应的目标类别一起出现的概率为：\n\n$$\n\\prod\\limits_{i = 1}^{m}\
  \ f_{y^{(i)}}^{(i)}\n$$\n\n使该概率值最大的 `W` 可以使这 $m$ 个样本以最大概率出现。因此，Softmax 回归要求使该概率最大化的回归模型参数\
  \ `W`。因为乘法会使值急剧变为无穷大或接近 0，为了使求解算法在数值上稳定，通常用该概率值的负对数平均值作为代价函数，即：\n\n$$\nL(W) = -\
  \ \\frac{1}{m} \\sum\\limits_{i = 1}^{m} \\log(f_{y^{(i)}}^{(i)})\n$$\n\n其中 $-\\\
  log(f_{y^{(i)}}^{(i)})$ 称为样本 $i$ 的交叉熵损失。最大化 $\\prod\\limits_{i = 1}^{m} f_{y^{(i)}}^{(i)}$\
  \ 的问题就转化为最小化该交叉熵损失的问题。\n\n对于 3 分类问题，$y^{(i)}$ 的值用 0、1、2 表示样本属于 3 个不同类别的概率。如果某样本的真实类别为第\
  \ 3 类，即 $y^{(i)} = 2$，该样本的预测值 $f^{(i)}$ 为一个向量，表示该样本属于各类别的概率。若向量值为：\n\n$$\n\\begin{matrix}\
  \ \nf^{(i)} = \\begin{bmatrix} \nf_{0}^{(i)} \\\\ \nf_{1}^{(i)} \\\\ \nf_{2}^{(i)}\
  \ \\\\ \n\\end{bmatrix} = \\begin{bmatrix} \n0.3 \\\\ \n0.5 \\\\ \n0.2 \\\\ \n\\\
  end{bmatrix}\n\\end{matrix}\n$$\n\n则该样本的交叉熵损失为 $-\\log(f_2^{(i)}) = -\\log(0.2)$。\n\
  \n对于多个样本，若有 2 个样本 ($m=2$)，对应的概率矩阵 `F` 和目标值向量 `y` 如下：\n\n$$\n\\begin{matrix} \nF\
  \ = \\begin{bmatrix} \n0.2 & 0.5 & 0.3 \\\\ \n0.2 & 0.6 & 0.2 \\\\ \n\\end{bmatrix}\n\
  \\end{matrix}\n$$\n\n$$\n\\begin{matrix} \ny = \\begin{bmatrix} \n2 \\\\ \n1 \\\\\
  \ \n\\end{bmatrix}\n\\end{matrix}\n$$\n\n则 `F_y` 为：\n\n$$\n\\begin{matrix} \nF_y\
  \ = \\begin{bmatrix} \n0.3 \\\\ \n0.6 \\\\ \n\\end{bmatrix}\n\\end{matrix}\n$$\n\
  \n表示每个样本属于其对应目标类别的概率。所有样本的交叉熵损失可向量化表示为：\n\n$$\nL(W) = - \\frac{1}{m} \\sum\\limits_{i\
  \ = 1}^{m} \\log(f_{y^{(i)}}^{(i)}) = - \\frac{1}{m} \\sum(\\log F_y)\n$$\n\n对于上述\
  \ 2 样本示例，该平均交叉熵损失为：\n\n$$\nL(W) = - \\frac{1}{2} (\\log(0.3) + \\log(0.6))\n$$\n\
  \n计算交叉熵的 Python 代码如下：\n\n```python\ndef cross_entropy(F, y):\n    m = len(F)  #\
  \ y.shape[0]\n    log_Fy = -np.log(F[range(m), y])    \n    return np.sum(log_Fy)\
  \ / m  \n```\n\n使用该函数计算示例中的交叉熵：\n\n```python\nF = np.array([[0.2, 0.5, 0.3], [0.2,\
  \ 0.6, 0.2]])  # 每行对应一个样本\nY = np.array([2, 1])\n\nprint(-1/2 * (np.log(0.3) + np.log(0.6)))\n\
  print(cross_entropy(F, Y))\n```\n\n```\n0.8573992140459634\n0.8573992140459634\n\
  ```\n\n有时不使用整数值表示某样本的类别，而是使用所谓的独热向量 $y^{(i)} = (y_1^{(i)}, y_2^{(i)}, \\dots, y_C^{(i)})$\
  \ 表示样本所属类别，其中 $C$ 表示类别总数。该向量仅有一个分量值为 1，其余分量值均为 0。\n\n例如，对于 3 分类问题，若某样本类别为 3，其独热向量为\
  \ (0, 0, 1)，即第 3 个分量值为 1，其余分量值均为 0。\n\n对于某样本，若对应的 $y^{(i)}$ 第 $j$ 个分量 $y_j^{(i)}\
  \ = 1$，即该样本属于第 $j$ 类，则该样本的交叉熵损失可写为：\n\n$$\n- \\log(f_j^{(i)}) = - y_j^{(i)} \\log(f_j^{(i)})\
  \ = - \\sum\\limits_{j = 1}^{C} y_j^{(i)} \\log(f_j^{(i)}) = - y^{(i)} \\cdot \\\
  log(f^{(i)})\n$$\n\n即该样本对应的交叉熵损失为向量 $y^{(i)}$ 与 $\\log(f^{(i)})$ 点积的相反数。\n\n因此，对于独热形式表示的目标值，所有样本的交叉熵损失可写为：\n\
  \n$$\n\\begin{matrix} \nL(W) = - \\frac{1}{m} \\sum\\limits_{i = 1}^{m} y^{(i)}\
  \ \\cdot \\log(f^{(i)}) = - \\frac{1}{m} \\text{np.sum}(Y \\odot \\log(F))\n\\end{matrix}\n\
  $$\n\n对于上述 `f` 和独热化向量 `y`：\n\n$$\n\\begin{matrix} \nf = \\begin{bmatrix} \n0.2 &\
  \ 0.5 & 0.3 \\\\ \n0.2 & 0.6 & 0.2 \\\\ \n\\end{bmatrix}\n\\end{matrix}\n$$\n\n\
  $$\n\\begin{matrix} \ny = \\begin{bmatrix} \n0 & 0 & 1 \\\\ \n0 & 1 & 0 \\\\ \n\\\
  end{bmatrix}\n\\end{matrix}\n$$\n\n$$\n\\begin{matrix} \nL(W) = - \\frac{1}{2} (\\\
  text{np.sum}(y \\cdot \\log(f))) \\\\\n= - \\frac{1}{2} \\times \\text{np.sum} \\\
  begin{bmatrix} \n0 \\times \\log(0.2) + 0 \\times \\log(0.5) + 1 \\times \\log(0.3)\
  \ \\\\ \n0 \\times \\log(0.2) + 1 \\times \\log(0.6) + 0 \\times \\log(0.2) \n\\\
  end{bmatrix} = - \\frac{1}{2} (\\log(0.3) + \\log(0.6))\n\\end{matrix}\n$$\n\n也可以使用\
  \ Hadamard 积（即逐元素乘积）将这两个同形状矩阵相乘，得到：\n\n$$\n\\begin{matrix} \nY \\odot \\log(F) =\
  \ \\begin{bmatrix} \n0 \\times \\log(0.2) & 0 \\times \\log(0.5) & 1 \\times \\\
  log(0.3) \\\\ \n0 \\times \\log(0.2) & 1 \\times \\log(0.6) & 0 \\times \\log(0.2)\
  \ \n\\end{bmatrix}\n\\end{matrix}\n$$\n\n然后将结果矩阵所有元素相加并除以样本数，得到总交叉熵：\n\n$$\n\\frac{1}{2}\
  \ (\\log(0.3) + \\log(0.6))\n$$\n\n对应的 Python 计算代码如下：\n\n\n\n\n\n### 3.6.5 通过加权求和计算交叉熵损失\n\
  \n样本的加权求和与 `z` 的 softmax 函数输出即为概率 `f`。已知加权求和 `z` 即可计算 `f`，进而计算交叉熵损失。以下代码计算多个样本的加权求和\
  \ `Z` 及其目标类别标签 `y` 的交叉熵损失：\n\n```python\n#https://deepnotes.io/softmax-crossentropy\n\
  def softmax(Z):\n    A = np.exp(Z-np.max(Z,axis=1,keepdims=True))\n    return A/np.sum(A,axis=1,keepdims=True)\n\
  \ndef softmax_cross_entropy(Z,y):\n    m = len(Z)\n    F = softmax(Z)\n    log_Fy\
  \ = -np.log(F[range(m),y])\n    return  np.sum(log_Fy) / m\n```\n\n使用一组 `Z` 测试该函数：\n\
  \n```python\nZ = np.array([[2,25,13],[54,3,11]])  #每行对应一个样本\ny = np.array([2,1])\n\
  softmax_cross_entropy(Z,y)\n```\n\n输出：\n\n```\n31.500003072148047\n```\n\n如果目标标签采用\
  \ one-hot 向量形式，以下代码从加权求和计算交叉熵损失：\n\n```python\ndef softmax_cross_entropy_one_hot(Z,\
  \ y):    \n    F = softmax(Z)\n    loss =  -np.sum(y*np.log(F),axis=1)\n    return\
  \ np.mean(loss)  \n```\n\n```python\nZ = np.array([[2,25,13],[54,3,11]])  #每行对应一个样本\n\
  y = np.array([[0, 0, 1],[0, 1, 0]])\nsoftmax_cross_entropy_one_hot(Z,y)\n```\n\n\
  ```\n31.500003072148047\n```\n\n### 3.6.6 Softmax 回归的梯度计算\n\nSoftmax 回归的目标是找到使交叉熵损失\
  \ ℒ(`W`) 最小化的 `W`，求解算法仍为梯度下降法。为此，需要计算 ℒ(`W`) 对 `W` 的梯度，即对每个 `W[jk]` 的偏导数。\n\n####\
  \ 1. 交叉熵损失对加权求和的梯度\n\n设一个样本为 (`x`, `y`)，`f`(`x`) = `softmax`(`x``W`) 可视为 `z` = (`z`[1],\
  \ `z`[2], `z`[3]) = (`x``W`[, 1], `x``W`[, 2], `x``W`[, 3]) 和 `f`(`z`) = `softmax`(`z`)\
  \ = `softmax`(`z`[1], `z`[2], `z`[3]) 的复合函数。\n\n引入辅助中间变量 `a` = (`a`[1], `a`[2],\
  \ `a`[3]) = (`e`^(`z`[1]), `e`^(`z`[2]), `e`^(`z`[3]))。但\n\n$f(z) = f(a) = \\begin{pmatrix}\
  \ f_{1}, & f_{2}, & f_{3} \\end{pmatrix} = \\begin{pmatrix} \\frac{a_{1}}{a_{1}\
  \ + a_{2} + a_{3}}, & \\frac{a_{2}}{a_{1} + a_{2} + a_{3}}, & \\frac{a_{3}}{a_{1}\
  \ + a_{2} + a_{3}} \\end{pmatrix}$\n\n令 ℒ = −`log`(`f`[`y`]) = −(`log`(`a`[`y`])\
  \ − `log`(`a`[1] + `a`[2] + `a`[3]))\n\n$$\n\\begin{matrix}\n\\frac{\\partial\\\
  mathcal{L}}{\\partial z_{i}} = - \\frac{1}{a_{y}}\\frac{\\partial a_{y}}{\\partial\
  \ z_{i}} - \\frac{1}{a_{1} + a_{2} + a_{3}}(\\frac{\\partial a_{1}}{\\partial z_{i}}\
  \ + \\frac{\\partial a_{2}}{\\partial z_{i}} + \\frac{\\partial a_{3}}{\\partial\
  \ z_{i}}) \\\\\n= - \\frac{1}{a_{y}}\\frac{\\partial a_{y}}{\\partial z_{i}} - \\\
  frac{1}{a_{1} + a_{2} + a_{3}}e^{z_{i}} \\\\\n= - \\frac{1}{a_{y}}1{(y==i)}e^{z_{y}}\
  \ - \\frac{1}{a_{1} + a_{2} + a_{3}}e^{z_{i}} \\\\\n= - 1{(y==i)} + \\frac{e^{z_{i}}}{\\\
  sum\\limits_{1}^{3}e^{z_{i}}} = f_{i} - 1{(y==i)}\n\\end{matrix}\n$$\n\n其中，符号 `1`(`y`\
  \ == `i`) 表示当 (`y` == `i`) 成立时值为 1，否则值为 0。\n\n因此，ℒ 对 `z` = (`z`[1], `z`[2], `z`[3])\
  \ 的梯度为：\n\n$\\nabla_{z}\\mathcal{L} = (\\frac{\\partial\\mathcal{L}}{\\partial z_{1}},\\\
  frac{\\partial\\mathcal{L}}{\\partial z_{2}},\\frac{\\partial\\mathcal{L}}{\\partial\
  \ z_{3}}) = (f_{1} - 1{(y==1)},f_{2} - 1{(y==2)},f_{3} - 1{(y==3)})$\n\n若 `y`=1，则：\n\
  \n∇[`z`]ℒ = (`f`[1] − 1, `f`[2], `f`[3])\n\n也就是说，对于任意 C 分类问题，若某 `y` 的分类为 i，则：\n\n\
  ∇[`z`]ℒ = (`f`[1], `f`[2], ⋯, `f`[`i`] − 1, ⋯, `f`[`C`]) = `f` − `I`[`i`]\n\n符号\
  \ `I`[`i`] 表示一个 one-hot 向量，其第 i 个分量为 1，其余分量为 0。若样本的目标值 `y` 用该 one-hot 向量表示，即 `y`\
  \ = `I`[`i`]，则：\n\n∇[`z`]ℒ = `f` − `y`\n\n这与线性回归损失 $\\frac{1}{2} \\parallel f -\
  \ y \\parallel^{2}$ 对 `f` 的梯度、逻辑回归交叉熵损失 −(`y``log`(`f`) + (1 − `y`)`log`(1 − `f`))\
  \ 对加权求和 `z` 的梯度惊人地一致。但仍有区别。线性回归是损失函数值关于 `f` 的梯度，而逻辑回归和 softmax 回归是关于加权求和 `z` 而非\
  \ `f` 的梯度。梯度均为 `f` − `y`，但逻辑回归的概率由 `f` = `σ`(`z`) 计算，softmax 回归的概率由 `f` = `softmax`(`z`)\
  \ 计算。\n\n因此，对于由多个样本特征构成的向量 `Z`，用 ℒ 表示所有样本的总损失，则 ℒ 对加权求和 `Z` 的梯度为：\n\n∇[`Z`]ℒ = `F`\
  \ − `I`[`i`]\n\n或\n\n∇[`Z`]ℒ = `F` − `Y`\n\n该形式与逻辑回归损失函数对加权求和的梯度相同，也与线性回归损失函数 $\\\
  frac{1}{2} \\parallel F - Y \\parallel^{2}$ 关于输出 `F` 的梯度一致。\n\n根据公式 (12)，计算交叉熵对\
  \ `Z` 的梯度的代码如下：\n\n```python\ndef grad_softmax_crossentropy(Z,y):\n    F = softmax(Z)\n\
  \    I_i = np.zeros_like(Z)\n    I_i[np.arange(len(Z)),y] = 1   \n    return (F\
  \ - I_i) / Z.shape[0]\n```\n\n```python\ndef grad_softmax_cross_entropy(Z,y):\n\
  \    m = len(Z)\n    F = softmax(Z) \n    F[range(m),y] -= 1\n    return F/m  \n\
  ```\n\n使用 2 个样本的 `Z` 及其目标值 `y` 测试该函数：\n\n```python\nZ = np.array([[2,25,13],[54,3,11]])\
  \  #每行对应一个样本\ny = np.array([2,1])\ngrad_softmax_cross_entropy(Z,y)\n#grad_softmax_crossentropy(Z,y)\n\
  ```\n\n为确保解析梯度计算无误，可使用第 1.4 节的通用数值梯度函数计算交叉熵对 `Z` 的数值梯度，并与上述解析梯度比较：\n\n```python\n\
  def loss_f():\n    return softmax_cross_entropy(Z,y)\n\nimport util\nZ = Z.astype(float)\
  \        #注意：整数数组必须转换为浮点类型\nprint(\"num_grad\",util.numerical_gradient(loss_f,[Z]))\n\
  ```\n\n```\nnum_grad[array([[ 0. , 0.49999693, -0.49999693],\n           [ 0.5 ,\
  \ -0.5 , 0. ]])]\n```\n\n若样本目标用 one-hot 向量表示，计算交叉熵对 `Z` 的梯度的代码如下：\n\n```python\n\
  def grad_softmax_crossentropy_one_hot(Z, y):   #y 由 one-hot 向量表示\n    F = softmax(Z)\
  \ \n    return (F - y)/Z.shape[0]\n\nZ = np.array([[2,25,13],[54,3,11]])   #每行对应一个样本\n\
  y = np.array([[0, 0, 1],[0, 1, 0]])\ngrad_softmax_crossentropy_one_hot(Z,y)\n```\n\
  \n```\narray([[ 5.13090829e-11, 4.99996928e-01, -4.99996928e-01],\n       [ 5.00000000e-01,\
  \ -5.00000000e-01, 1.05756552e-19]])\n```\n\n#### 2. 交叉熵损失对权重参数的梯度\n\n已得到损失函数对加权求和\
  \ `z` 的梯度，进而可得损失函数对模型参数 `W` 的梯度。因为 `z`[`i`] = `x``W`[, `i`] 对 `W`[, `i`] 的梯度为 `x`，而对其他\
  \ `W`[, `j`] 其梯度为 0，故：\n\n$\\frac{\\partial z_{i}}{\\partial W_{,j}} = 1(i==j)x$\n\
  \n\n\n\n因此，有：\n\n$$\n\\begin{matrix} \n\\frac{\\partial\\mathcal{L}}{\\partial{W\
  \ W_{,j}}} & {= \\sum\\limits_{i = 1}^{3}\\frac{\\partial\\mathcal{L}}{\\partial\
  \ z_{i}}\\frac{\\partial z_{i}}{\\partial{W W_{,j}}} = \\frac{\\partial\\mathcal{L}}{\\\
  partial z_{j}}\\frac{\\partial z_{j}}{\\partial{W W_{,j}}}} & {= (f_{j} - 1{(y==j)})x\
  \ x} \\\\ \n\\end{matrix}\n$$\n\n也就是说，对于每个 `j` = 1, 2, 3，有：\n\n$$\n\\frac{\\partial\\\
  mathcal{L}}{\\partial{W W_{,1}}} = (f_{1} - 1{(y==1)})x x\n$$\n\n$$\n\\frac{\\partial\\\
  mathcal{L}}{\\partial{W W_{,2}}} = (f_{2} - 1{(y==2)})x x\n$$\n\n$$\n\\frac{\\partial\\\
  mathcal{L}}{\\partial{W W_{,3}}} = (f_{3} - 1{(y==3)})x x\n$$\n\n注意：因为 `W W_{,1}`\
  \ 是列向量，如果 `x x` 是行向量，则上述 $\\frac{\\partial\\mathcal{L}}{\\partial{W W_{,j}}}$ 也是行向量。如果想将\
  \ $\\frac{\\partial\\mathcal{L}}{\\partial{W W}}$ 写成与 `W W` 形状相同的矩阵形式，则：\n\n$$\n\
  \\begin{matrix} \n\\frac{\\partial\\mathcal{L}}{\\partial{W W}} & {= (\\frac{\\\
  partial\\mathcal{L}}{\\partial{W W_{,1}}}^{T},\\frac{\\partial\\mathcal{L}}{\\partial{W\
  \ W_{,j}}}^{T},\\cdots,\\frac{\\partial\\mathcal{L}}{\\partial{W W_{,C}}}^{T})}\
  \ \\\\ \n& {= {x x}^{T}(f_{1} - 1{(y==1)},f_{2} - 1{(y==2)},\\cdots,f_{C} - 1{(y==C)})}\
  \ \\\\ \n\\end{matrix}\n$$\n\n如果使用独热向量来表示目标值（标签）`y y`，可以写成更简洁的公式：\n\n$$\n\\frac{\\\
  partial\\mathcal{L}}{\\partial{W W}} = {x x}^{T}{(f f - y y)}\n$$\n\n其中，假设 `x x`、`f\
  \ f`、`y y` 均为行向量形式。这是一个与 `W W` 形状相同的矩阵。如果 C 是类别数，n 是数据特征数，则 `x x` 是 1 × n 向量，`x\
  \ x`^(`T`) 是 n × 1 向量，`W W` 是 n × C 矩阵，因为 `z z` = `x x``W W`、`f f` = `softmax`(`z\
  \ z`)，所以 `f f`、`y y` 是 1 × C 向量。因此，`x x`^(`T`)(`f f` − `y y`) 是 n × C 的矩阵。\n\n对于矩阵\n\
  \n$$\n\\begin{matrix} \n{X = \\begin{bmatrix} \n{x x^{(1)}} \\\\ \n{x x^{(2)}} \\\
  \\ \n\\vdots \\\\ \n{x x^{(i)}} \\\\ \n\\vdots \\\\ \n{x x^{(m)}} \\\\ \n\\end{bmatrix}}\
  \ \n\\end{matrix}\n$$\n\n`F F`、`Y Y` 是对应这些样本的预测值矩阵和目标值矩阵：\n\n$$\n\\begin{matrix}\
  \ \n{F = \\begin{bmatrix} \n{f f^{(1)}} \\\\ \n{f f^{(2)}} \\\\ \n\\vdots \\\\ \n\
  {f f^{(i)}} \\\\ \n\\vdots \\\\ \n{\\mathbf{f}^{(m)}} \\\\ \n\\end{bmatrix}} \n\\\
  end{matrix}\n$$，\n$$\n\\begin{matrix} \n{Y = \\begin{bmatrix} \n{y y^{(1)}} \\\\\
  \ \n{y y^{(2)}} \\\\ \n\\vdots \\\\ \n{\\mathbf{y}^{(i)}} \\\\ \n\\vdots \\\\ \n\
  {y y^{(m)}} \\\\ \n\\end{bmatrix}} \n\\end{matrix}\n$$。\n\n则损失函数关于权重 `W W` 的梯度向量形式为：\n\
  \n$$\n\\frac{\\partial\\mathcal{L}}{\\partial{W W}} = {X X}^{T}{(F F - Y Y)}\n$$\n\
  \n类似地，可以在 Softmax 回归的交叉熵损失中加入正则项。如果目标值用整数表示，损失函数变为：\n\n$$\nL(W W) = - \\frac{1}{m}\\\
  sum\\limits_{i = 1}^{m}\\log(f_{y^{(i)}}^{(i)}) + \\lambda \\parallel W W \\parallel^{2}\n\
  $$\n\n如果目标值用独热向量表示，则损失函数变为：\n\n$$\nL(W W) = - \\frac{1}{m}\\sum\\limits_{i = 1}^{m}y^{(i)}\\\
  cdot\\log(f^{(i)}) + \\lambda \\parallel W \\parallel^{2}\n$$\n\n则损失函数关于权重 `W W`\
  \ 的梯度为：\n\n$$\n\\frac{\\partial\\mathcal{L}}{\\partial{W W}} = {X X}^{T}{(F F -\
  \ Y Y)} + 2\\lambda W W\n$$\n\n根据梯度计算公式，很容易编写损失函数关于 `W W` 的梯度计算代码。在下面的代码中，假设 `X`\
  \ 代表多样本的数据特征矩阵，`y` 代表目标值向量，`reg` 是正则化参数 `λ`，`loss_softmax()` 和 `gradient_softmax()`\
  \ 分别计算损失函数的损失和关于 `W W` 的梯度：\n\n```python\n# def loss_gradient(W,X,y,lambda_):\n\
  def gradient_softmax(W,X,y,reg):\n    m = len(X)\n    Z = np.dot(X,W)\n    \n  \
  \  I_i = np.zeros_like(Z)\n    I_i[np.arange(len(Z)),y] = 1\n    F = softmax(Z)\n\
  \    # F = np.exp(Z) / np.exp(Z).sum(axis=-1,keepdims=True)\n    grad = (1 / m)\
  \ * np.dot(X.T, F - I_i)      # Z.shape[0]\n    grad = grad + 2*reg*W\n    return\
  \ grad\n\ndef loss_softmax(W,X,y,reg):\n    m = len(X)\n    Z = np.dot(X,W) \n \
  \   Z_i_y_i = Z[np.arange(len(Z)),y]\n    negtive_log_prob = - Z_i_y_i + np.log(np.sum(np.exp(Z),axis=-1))\n\
  \    loss = np.mean(negtive_log_prob) + reg*np.sum(W*W)\n    return loss  \n```\n\
  \n使用以下数据测试函数：\n\n```python\nX = np.array([[2,3],[4,5]])        # 每行对应一个样本，每个样本 2\
  \ 个特征\ny = np.array([2,1])                # 类别数为 3\nW = np.array([[0.1,0.2,0.3],[0.4,0.2,0.8]])\
  \    # 2x3 矩阵\n\nreg = 0.2\n\nprint(gradient_softmax(W,X,y,reg))\nprint(loss_softmax(W,X,y,reg))\n\
  ```\n\n```\n[[ 0.30213245 -1.75779321  1.69566076]\n [ 0.5254108  -2.19194012  2.22652932]]\n\
  2.086304963628266\n```\n\n如果每个样本的目标值用独热向量表示，且 `y` 代表由多样本目标值组成的矩阵，则下面的 `loss_softmax_onehot()`\
  \ 和 `gradient_softmax_onehot()` 计算损失函数的损失和关于 `W W` 的梯度：\n\n```python\ndef gradient_softmax_onehot(W,X,y,reg):\n\
  \    m = len(X)               # 样本数\n    nC = W.shape[1]          # 类别数\n    # y_one_hot\
  \ = np.eye(nC)[y[:,0]]\n    y_one_hot = y\n    \n    # y_mat = oneHotIt(y)     \
  \ # 接下来将整数类别编码转换为独热表示\n    Z = np.dot(X,W)           # Z 是加权和\n    F = softmax(Z)\
  \            # F 是概率矩阵\n    grad = (1 / m) * np.dot(X.T, (F - y_one_hot)) + 2*reg*W\
  \  # 计算该损失的梯度\n    return grad  # 原文为 grade，推测为笔误已修正\n\ndef loss_softmax_onehot(W,X,y,reg):\n\
  \    m = len(X) # 首先获取训练样本数\n    nC = W.shape[1]\n    # y_one_hot = np.eye(nC)[y[:,0]]\n\
  \    y_one_hot = y\n    \n    # y_mat = oneHotIt(y)          # 将整数类别编码转换为独热向量形式\n\
  \    Z = np.dot(X,W)               # Z 是加权和\n    F = softmax(Z)                #\
  \ F 是概率矩阵\n    loss = (-1 / m) * np.sum(y_one_hot * np.log(F)) + (reg)*np.sum(W*W)\n\
  \    return loss\n```\n\n```python\nX = np.array([[2,3],[4,5]])          # 每行对应一个样本，每个样本\
  \ 2 个特征\ny = np.array([[0,0,1],[0,1,0]])      # 类别数为 3\nW = np.array([[0.1,0.2,0.3],[0.4,0.2,0.8]])\
  \  # 2x3 矩阵\n\nreg = 0.2\nprint(gradient_softmax_onehot(W,X,y,reg))\nprint(loss_softmax_onehot(W,X,y,reg))\n\
  ```\n\n```\n[[ 0.30213245 -1.75779321  1.69566076]\n [ 0.5254108  -2.19194012  2.22652932]]\n\
  2.0863049636282662\n```\n\n### 3.6.7 Softmax 回归的梯度下降法实现\n\n基于此的梯度下降算法代码如下：\n\n```python\n\
  def gradient_descent_softmax(w,X, y, reg=0., alpha=0.01, iterations=100, gamma=0.8,\
  \ epsilon=1e-8):\n    X = np.hstack((np.ones((X.shape[0], 1), dtype=X.dtype), X))\
  \  # 增加一列特征 1 \n    v = np.zeros_like(w)\n    # losses = []\n    w_history = []\
  \ \n    for i in range(0, iterations):\n        gradient = gradient_softmax(w, X,\
  \ y, reg)\n        if np.max(np.abs(gradient)) < epsilon:\n            print(\"\
  gradient is small enough!\")\n            print(\"iterated num is :\", i)\n    \
  \        break            \n        \n        w = w - (alpha * gradient)\n     \
  \   # v = gamma*v + alpha* gradient\n        # w = w - v\n        # losses.append(loss)\n\
  \        w_history.append(w)\n    return w_history\n```\n\n对于一组样本 (`X`,`y`)，以下辅助函数计算历史纪录\
