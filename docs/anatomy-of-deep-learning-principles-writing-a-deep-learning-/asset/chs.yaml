  .format(\n                    kwargs['nonlinearity']))\n            del kwargs['nonlinearity']\n\
  \        else:\n            mode = 'RNN_TANH'\n        super(RNN, self).__init__(mode,\
  \ *args, **kwargs)\n\nclass LSTM(RNNBase):\n    def __init__(self, *args, **kwargs):\
  \        \n        super(LSTM, self).__init__('LSTM', *args, **kwargs)\n\nclass\
  \ GRU(RNNBase):\n    def __init__(self, *args, **kwargs):        \n        super(GRU,\
  \ self).__init__('GRU', *args, **kwargs)\n```\n\n这些多层循环神经网络可以通过以下代码进行测试：\n\n```python\n\
