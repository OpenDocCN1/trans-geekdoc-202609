  \ Seq2Seq 模型预测效果更好。读者可以增加训练次数并调整参数，以获得更满意的结果。\n\n### 7.11.4 基于词嵌入层的 Seq2Seq 模型\n\
  \n#### 1. 词嵌入层\n\nWord2Vec 词向量化通过一个单独的训练过程，学习将词表中的一个词索引映射为比词表长度更低维的向量。也就是说，根据 Word2Vec\
  \ 学习到的权重矩阵，利用词索引获取该矩阵对应的行。\n\n词嵌入是指将词向量化结合到具体问题的模型中，即在具体问题的网络模型前面加一个嵌入层。该嵌入层的参数是词向量化的矩阵，用于将词索引映射为词向量，但该矩阵的参数最初是随机的，需要在模型训练过程中学习。也就是说，词向量化和具体问题的模型结合在一起进行训练。\n\
  \n该嵌入层是一个没有激活函数和偏置的全连接线性层。它是一个简化的线性层。代码如下：\n\n```\ndef one_hot(size, indices, expend=False):\n\
  \    x = np.eye(size)[indices.reshape(-1)]\n    if expend:\n        x = np.expand_dims(x,\
  \ axis=1)\n    return x\n\nclass Embedding():\n    def __init__(self, num_embeddings,\
  \ embedding_dim, _weight=None):\n        super().__init__()\n        if _weight\
  \ is None:\n            self.W = np.empty((num_embeddings, embedding_dim))\n   \
  \         self.reset_parameters()\n            self.preTrained = False\n       \
  \ else:\n            self.W = _weight\n            self.preTrained = True\n    \
  \    self.params = [self.W]\n        self.grads = [np.zeros_like(self.W)]\n\n  \
  \  def reset_parameters(self):\n        self.W[:] = np.random.randn(*self.W.shape)\n\
  \n    def forward(self, indices):\n        num_embeddings = self.W.shape[0]\n  \
  \      x = one_hot(num_embeddings, indices).astype(float)\n        self.x = x\n\
  \        # Z = np.matmul(x, self.W)\n        Z = self.W[indices, :]\n        return\
  \ Z\n\n    def __call__(self, indices):\n        return self.forward(indices)\n\n\
  \    def backward(self, dZ):\n        x = self.x\n        dW = np.dot(x.T, dZ)\n\
  \        dx = np.dot(dZ, np.transpose(self.W))\n        self.grads[0] += dW\n  \
  \      return dx\n```\n\n#### 2. 使用词嵌入层的 Seq2Seq 模型\n\n编码器和解码器使用词嵌入层将单词转换为向量。编码器的计算过程如图\
  \ 7-53 所示：\n\n**图 7-53** 输入单词（对应索引的独热向量）通过嵌入层 embedding 转换为低维数值向量 embedded，然后与隐藏状态一起作为循环神经网络单元的输入，计算输出和隐藏向量。\n\
  \n输入单词（对应索引的独热向量）通过嵌入层 embedding 转换为低维数值向量 embedded，然后与隐藏状态一起作为循环神经网络单元的输入，计算输出和隐藏向量。对于简单的编码器，输出\
  \ output 和隐藏状态 hidden 可以是同一个向量。\n\n```\nfrom rnn import *\nfrom Layers import *\n\
  from train import *\n\nclass EncoderRNN_Embed(object):\n    def __init__(self, input_size,\
  \ hidden_size):\n        super().__init__()\n        self.input_size, self.hidden_size\
  \ = input_size, hidden_size\n        self.embedding = Embedding(input_size, hidden_size)\n\
  \        self.gru = GRU(hidden_size, hidden_size, 1)\n\n    def forward(self, input,\
  \ hidden):\n        self.embedded_x = []\n        self.embedded_out = []\n```\n\n\
  \n\n\n##### 代码实现\n\n###### EncoderRNN_Embed 类\n\n```python\nembed_out = []\n\nfor\
  \ x in input:              \n    embedded = self.embedding(x).reshape(1,1,-1)\n\
  \    self.embedded_x.append(self.embedding.x)\n    self.embedded_out.append(embedded)\n\
  \nself.embedded_out = np.concatenate(self.embedded_out, axis=0) \noutput, hidden\
  \ = self.gru(self.embedded_out, hidden)\nreturn output, hidden\n\ndef __call__(self,\
  \ input, hidden):\n    return self.forward(input, hidden)\n\ndef initHidden(self):\n\
  \    return np.zeros((1, 1, self.hidden_size))\n\ndef parameters(self):\n    return\
  \ self.gru.parameters()\n\ndef backward(self, dhs): \n    dinput, dhidden = self.gru.backward(dhs,\
  \ self.embedded_out)\n    T = dinput.shape[0]\n    for t in range(T):\n        dinput_t\
  \ = dinput[t]\n        self.embedding.x = self.embedded_x[t]  # recover the original\
  \ x \n        self.embedding.backward(dinput_t)\n```\n\n因为 `Embedding` 层的权重参数也是需要学习的模型参数，所以在反向推导时，也需要计算损失函数关于\
  \ `Embedding` 层权重参数的梯度，即 `self.embedding.backward(dinput_t)`。反向推导归结为每个时刻 `t` 的求导。需要知道此时刻\
  \ `t` 的输入 `self.embedding.x`。因此，在正向计算过程中，有必要保存每个时刻 `Embedding` 层的输出 `self.embedded_x.append(self.embedding.x)`。\n\
  \n如图 7-54 所示，解码器也使用词嵌入层的输出向量作为 RNN 单元的输入：\n\n**图 7-54** 输入词（对应索引的独热向量）通过嵌入层 `embedding`\
  \ 转换为低维数值向量，然后将 `relu` 激活函数的输出和隐藏状态一起作为循环神经网络单元的输入。计算输出和潜在向量。\n\n同样需要对嵌入层进行正向计算和反向推导，代码如下：\n\
  \n###### DecoderRNN_Embed 类\n\n```python\nclass DecoderRNN_Embed(object):\n    def\
  \ __init__(self, hidden_size, output_size, num_layers=1, teacher_forcing_ratio=0.5):\n\
  \        super().__init__()       \n        self.hidden_size = hidden_size     \
  \  \n        self.num_layers = 1\n        self.teacher_forcing_ratio = teacher_forcing_ratio\n\
  \        self.embedding = Embedding(output_size, hidden_size)\n        self.relu\
  \ = Relu()\n        self.gru = GRU(hidden_size, hidden_size, 1)\n        self.linear\
  \ = Dense(hidden_size, output_size)\n        self.layers = [self.embedding, self.gru,\
  \ self.linear]\n        self._params = None\n\n    def initHidden(self, batch_size):\
  \        \n        self.h_0 = np.zeros((self.num_layers, batch_size, self.hidden_size))\
  \    \n\n    def forward_step(self, input_t, hidden, train=True): \n        embedded\
  \ = self.embedding(input_t)  # .reshape(1,1,-1)\n        self.embedded_x.append(self.embedding.x)\
  \        \n        output = self.relu(embedded)   \n        self.relu_x = self.relu.x\n\
  \        relu_output = output.reshape(1, output.shape[0], -1)\n        self.input.append(relu_output)\
  \  # output)  # input of gru         \n        output_hs, hidden = self.gru(relu_output,\
  \ hidden)  \n        output = self.linear(output_hs[0])  # seq_len = 1 \n      \
  \  return output, hidden, output_hs[0]\n\n    def forward(self, input_tensor, hidden):\
  \ \n        self.input = []\n        target_length = input_tensor.shape[0]  # input_tensor.size(0)\
  \  \n        teacher_forcing_ratio = self.teacher_forcing_ratio\n        use_teacher_forcing\
  \ = True if random.random() < teacher_forcing_ratio else False\n        output_hs\
  \ = []\n        output = []\n        hidden_t = hidden\n        h_0 = hidden.copy()\n\
  \        input_t = np.array([SOS_token])\n        hs = []\n        zs = []\n   \
  \     self.embedded_x = []\n        self.relu_x = []\n        for t in range(target_length):\n\
  \            output_t, hidden_t, output_hs_t = self.forward_step(\n            \
  \    input_t, hidden_t)\n            hs.append(self.gru.hs)  # Keep the hidden state\
  \ of the middle layer\n            zs.append(self.gru.zs)  # Keep the calculation\
  \ result of the middle layer           \n            output_hs.append(output_hs_t)\n\
  \            output.append(output_t)\n            if use_teacher_forcing:\n    \
  \            input_t = input_tensor[t]  # Teacher forcing               \n     \
  \       else:             \n                input_t = np.argmax(output_t)  # maximum\
  \ probability\n                if input_t == EOS_token:\n                    break\
  \  \n                input_t = np.array([input_t])\n        output = np.array(output)\n\
  \        self.output_hs = np.array(output_hs)\n        self.h_0 = h_0         \n\
  \        self.hs = np.concatenate(hs, axis=1)\n        self.zs = np.concatenate(zs,\
  \ axis=1)\n        # self.gru.hs = self.hs\n        # self.gru.zs = self.zs \n \
  \       return output\n\n    def __call__(self, input, hidden):\n        return\
  \ self.forward(input, hidden)\n\n    def evaluate(self, hidden, max_length):\n \
  \       # input: (1, batch_size=1, input_size)  \n        input = np.array([SOS_token])\n\
  \        decoded_words = []\n        for t in range(max_length):\n            output,\
  \ hidden, _ = self.forward_step(input, hidden, False)\n            output = np.argmax(output)\
  \         \n            if output == EOS_token:\n                break\n       \
  \     else:           \n                decoded_words.append(output)           \
  \    \n                input = np.array([output])\n        return decoded_words\
  \    \n\n    def backward(self, dZs):\n        dhs = []\n        output_hs = self.output_hs\n\
  \        input = np.concatenate(self.input, axis=0)\n        for i in range(len(input)):\n\
  \            self.linear.x = output_hs[i]\n            dh = self.linear.backward(dZs[i])\n\
  \            dhs.append(dh)\n        dhs = np.array(dhs)\n        self.gru.hs =\
  \ self.hs\n        self.gru.zs = self.zs\n        self.gru.h = self.h_0\n      \
  \  dinput, dhidden = self.gru.backward(dhs, input)  \n        for i in range(len(input)):\n\
  \            dinput_t = dinput[i]\n            d_embeded = self.relu.backward(dinput_t)\
  \            \n            self.embedding.x = self.embedded_x[i]  # recover the\
  \ original x\n            self.embedding.backward(d_embeded)\n        return dinput,\
  \ dhidden \n\n    def backward_dh(self, dZ):\n        dh = self.linear.backward(dZ)\n\
  \        return dh    \n\n    def parameters(self):\n        if self._params is\
  \ None:\n            self._params = []\n            for layer in self.layers:\n\
  \                for i, _ in enumerate(layer.params):  \n                    self._params.append([layer.params[i],\
  \ layer.grads[i]])  \n        return self._params    \n```\n\n###### Vocab 类\n\n\
