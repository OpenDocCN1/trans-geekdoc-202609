  ```\n\n\n\n\n\n![](img/file159.png \"fig:\")\n图 7-32 股票数据训练模型的短期预测效果\n\n## 7.5 RNN\
  \ 语言模型与文本生成\n\n在 k-gram 语言模型中，每个词仅依赖于前面的 k-1 个词。由于无法利用更多的上下文信息，这限制了模型的准确性。RNN 模型可以接受任意长度的输入序列。使用\
  \ RNN 表示语言模型，可以从任意长度的输入词序列中预测词表中每个词作为下一个词的概率。即在时刻 `t=i`，基于时刻 `t` 之前的所有词，预测时刻 `t=i+1`\
  \ 出现该词的概率：`P(w[i+1] | w[1], w[2], ..., w[i])`。\n\n根据该概率，采样一个词作为下一个词，并不断重复此过程。即可从初始词连续生成新词，也就是生成一系列词或文本。这种基于某种语言模型，从初始的一个或少量词自动生成大段文本的过程称为**文本生成**。\n\
  \n文本生成依赖于训练好的语言模型。要训练语言模型，需要从现有的文本（如一部或多部小说、散文）中以词为单位采样序列数据。这些用于采样词序列样本的原始文本称为**语料库**。这些语料通常首先按词为单位划分为词序列，然后利用前面的序列数据采样方法采样出用于训练\
  \ RNN 模型的序列样本。\n\n对于英文文章，原文可以用空格和标点符号划分为词序列；而对于中文字符文本，则需要使用一些特殊的分词技术从文本中分割提取词语。无论何种语言，词的数量都非常大。为简化起见，可以将每个字符视为一个词。这样的语言模型称为**字符语言模型**。字符语言模型无需专门提取文本中的词，且语言中的字符数量通常远小于词的数量。例如，英语只有\
  \ 26 个字母和少量标点符号，而英语单词的数量却非常庞大。\n\n无论是字符语言模型还是普通的词语言模型，其原理都是相同的。例如，在使用 RNN 训练语言模型之前，需要量化语言模型的基本单位——词或字符，即将词或字符转换为值向量。为了量化词（字符），第一步是建立词表（字符表）。\n\
  \n### 7.5.1 字符表\n\n构建词表或字符表的过程是扫描语料库中的所有文本，找出所有的词或字符，并将它们放入一个线性表中，使每个词（字符）在表中都有一个确定的位置（下标）。对于字符语言模型，只需扫描语料库文本中的所有字符并将其放入字符表即可。\n\
  \n如果语料库仅包含一个文本文件 `input.txt`（莎士比亚的剧本），以下代码将文本内容读入 `data`，并使用 `set(data)` 构建所有不同字符的集合。然后将这些不同字符放入列表对象\
  \ `chars` 中（`chars = list(set(data))`），该列表对象即为所有字符的字符表。\n\n```\nfilename = 'input.txt'\n\
  \ndata = open(filename, 'r').read()\n\nchars = list(set(data))\n```\n\n输出文本中所有字符的数量、字符列表的长度、字符列表的前\
  \ 10 个字符以及文本的前 148 个字符：\n\n```\ndata_size, vocab_size = len(data), len(chars)\n\n\
  print ('Total number of characters %d, length of character table %d unique.' % (data_size,\
  \ vocab_size))\n\nprint('First 10 characters of the character table: \\n', chars[:10])\n\
  \nprint('First 148 characters: \\n', data[:148])\n```\n\n```\n    字符总数为 1115394，字符列表长度为\
  \ 65 个唯一字符。\n\n    字符表的前 10 个字符：\n\n     ['t', 'z', 'A', 'Y', 'm', ' ', 'B', 'g',\
  \ 'r', '.']\n\n    前 148 个字符：\n\n     First Citizen:\n\n    Before we proceed any\
  \ further, hear me speak.\n\n    All:\n\n    Speak, speak.\n\n    First Citizen:\n\
  \n    You are all resolved rather to die than to famish?\n```\n\n字符表中的每个字符对应一个下标，可以使用两个字典来表示字符到下标和下标到字符的映射关系：\n\
  \n```\nchar_to_idx = { ch:i for i,ch in enumerate(chars) }\n\nidx_to_char = { i:ch\
  \ for i,ch in enumerate(chars) }\n```\n\n有了字符表，就可以量化每个字符。最简单的方法是根据字符在字符表中的下标，用独热向量来表示字符。独热向量的长度等于字符表的长度。除该字符对应下标的值为\
  \ 1 外，该向量其余位置均为 0。如果字符表只有四个字符，如图 7-33 所示：\n\n图 7-33 字符表中只有 4 个字符：'h','e','l','o'\n\
  \n字符 'e' 的下标为 1，因此其独热向量为 (0,1,0,0)。\n\n函数 `one_hot_idx` 根据字符（词）表大小 `vocab_size`\
  \ 和字符在字符（词）表中的下标 `idx`，将字符转换为独热向量：\n\n```\ndef one_hot_idx(idx, vocab_size):  \n\
  \    x = np.zeros((1, vocab_size)) \n    x[0, idx] = 1  \n    return x\n```\n\n\
  ### 7.5.2 字符序列样本的采样\n\n为了训练字符语言模型，需要一些训练样本。与前面的序列数据采样过程类似，可以从原始文本中采样字符序列样本。以下代码以顺序采样的方式采样字符序列样本：\n\
  \n```\nimport numpy as np\n\ndef character_seq_data_iter_consecutive(data, batch_size,\
  \ seq_len, start_range=10):\n    # 每次在 data[offset:] 中采样，使每个 epoch 的训练样本不同\n   \
  \ start = np.random.randint(0, start_range)\n    block_len = (len(data) - start\
  \ - 1) // batch_size\n    num_batches = block_len // seq_len  # 每个块中可连续采样的最大批次数\n\
  \    bs = np.array(range(0, block_len * batch_size, block_len))  # 每个块的起始位置\n  \
  \  i_end = num_batches * seq_len\n    for i in range(0, i_end, seq_len):  # 一个块的序列起始位置\n\
  \        s = start + i  # 块中的位置\n        X = np.empty((seq_len, batch_size), dtype=object)\
  \  # ,dtype=np.int32)\n        Y = np.empty((seq_len, batch_size), dtype=object)\
  \  # ,dtype=np.int32)\n        for b in range(batch_size):  # b 表示一个批次样本的样本数\n \
  \           s_b = s + bs[b]\n            for t in range(seq_len):\n            \
  \    X[t, b] = data[s_b]\n                Y[t, b] = data[s_b + 1]\n            \
  \    s_b += 1\n        if i == 0:\n            yield X, Y, True\n        else:\n\
  \            yield X, Y, False\n```\n\n测试该函数：\n\n```\nx = 'Li,where are you from'\n\
  batch_size = 2\nseq_length  = 3\ndata_it = character_seq_data_iter_consecutive(x,\
  \ batch_size, seq_length, 1)\ni = 0 \nfor x, y, _ in data_it:\n    print(\"x:\"\
  , x)\n    print(\"y\", y)\n    i += 1\n    if i == 2: break\n```\n\n```\n    x:\
  \ [['L' 'r']\n     ['i' 'e']\n     [',' ' ']]\n    y [['i' 'e']\n     [',' ' ']\n\
  \     ['w' 'y']]\n    x: [['w' 'y']\n     ['h' 'o']\n     ['e' 'u']]\n    y [['h'\
  \ 'o']\n     ['e' 'u']\n     ['r' ' ']]\n```\n\n函数返回的字符还需要进一步向量化，例如将每个字符转换为独热向量形式。为此，修改上述函数：\n\
  \n\n\n\n\n### 7.5.3 RNN 模型训练与预测\n\n如果字符表的长度为 `vocab_size`，则每个字符的独热向量长度为 `vocab_size`，即每一时刻输入数据的长度\
  \ `input_dim` 为 `vocab_size`，而每一时刻的预测是所有词作为下一个词的概率，因此输出向量的大小 `output_dim` 也是 `vocab_size`。加上\
  \ RNN 隐藏状态向量的长度 `hidden_size` 和每个训练样本的大小 `batch_size`，即可初始化一个 RNN 模型：\n\n```\nbatch_size\
  \ = 1\ninput_dim = vocab_size\noutput_dim = vocab_size\nhidden_size = 100\nparams\
  \ = rnn_params_init(input_dim, hidden_size, output_dim)\nH = rnn_hidden_state_init(batch_size,\
  \ hidden_size)\n```\n\n#### predict\n\n对于上述字符语言 RNN 模型，只需输入一个初始字符（或字符序列），即可利用 RNN\
  \ 模型连续预测下一个字符，从而生成由许多字符组成的文本。\n下面的函数 `predict_rnn()` 接受 RNN 模型的模型参数 `params` 和一个初始字符串\
  \ `prefix`（该初始字符串可能只有一个字符），然后在前缀后生成一系列字符。该函数首先依次将 `prefix` 的每个字符作为每一时刻的输入，并生成一个输出\
  \ `z`。如果 `prefix` 结束，则根据上一时刻的输出 `z` 计算每个字符的概率 `p`，并根据概率 `p` 采样一个作为下一时刻的输入。辅助函数 `one_hot_idx`\
  \ 根据字符下标获取字符的独热向量。每一时刻的期望目标字符记录在输出列表中，开头部分是 `prefix` 中的字符，随后是根据预测概率采样的字符。\n\n```\n\
  def predict_rnn(params, prefix, n):\n    Wx, Wh, bh, Wf, bf = params\n    # Wxh,\
  \ Whh, Why, bh, by = params[\"Wxh\"], params[\"Whh\"], params[\"Why\"], params[\"\
  bh\"], params[\"by\"]\n    vocab_size, hidden_size = Wx.shape[0], Wh.shape[1]\n\
  \    h = rnn_hidden_state_init(1, hidden_size)\n    output = [char_to_idx[prefix[0]]]\n\
  \    for t in range(len(prefix) + n - 1):\n        # Use the output of the previous\
  \ time step as the input of the current time step.\n        x = one_hot_idx(output[-1],\
  \ vocab_size)\n        z, h = rnn_forward_step(params, x, h)\n        if t < len(prefix)\
  \ - 1:\n            output.append(char_to_idx[prefix[t + 1]])\n        else:\n \
  \           p = np.exp(z) / np.sum(np.exp(z))\n            # idx = int(p.argmax(axis=1))\n\
  \            idx = np.random.choice(range(vocab_size), p=p.ravel())\n          \
  \  output.append(idx)\n    return ''.join([idx_to_char[i] for i in output])\n```\n\
  \n测试预测函数：\n\n```\nstr = predict_rnn(params, \"he\", 200)\nprint(str)\n```\n\n```\n\
