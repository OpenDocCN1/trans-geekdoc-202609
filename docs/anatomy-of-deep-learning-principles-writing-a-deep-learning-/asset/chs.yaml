  \  -2.52527076e-04 7.67751376e-05 8.81253550e-05 2.07270381e-04\n  -6.92579913e-05\
  \ 5.33532921e-05]\n [-1.59775181e-04 8.33693576e-05 7.68434971e-05 4.16925859e-05\n\
