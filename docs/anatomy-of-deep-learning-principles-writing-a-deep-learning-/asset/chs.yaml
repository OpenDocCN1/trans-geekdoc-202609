  from scipy import ndimage\nimg = ndimage.uniform_filter(image, size=(11, 11, 1))\n\
  plt.imshow(img)\nplt.show()\n```\n\n![](img/file112.png \"fig:\")  \n\n**图 5-12\
  \ 模糊图像**\n\n与图像数据一样，可以对文本、语音等其他数据进行各种数据增强，并可以使用各种公共数据处理包来提高数据处理的效率。\n\n通过数据增强，数据总量可以增加数倍，这有助于减少过拟合。虽然增强后的数据与原始数据相关，但它避免了获取全新数据的成本。\n\
  \n### 5.1.2 归一化\n\n与简单回归一样，绝对值过大的数据会导致神经网络的数值计算溢出，梯度下降算法会变得非常缓慢，并且不同尺度的特征对算法有不同的影响，这会导致“特征偏差”，从而使训练算法难以约束。因此，在训练神经网络之前，应对未归一化的数据进行归一化。通常对每个特征单独归一化，即对于每个特征\
  \ `x[i]`，计算该特征在训练集中的均值 `x[i]_mean` 和标准差 `x[i]_std`，然后使用均值和标准差将所有样本的该特征归一化到接近 0 的较小范围内，例如\
  \ `[0, 1]` 或 `[-0.5, 0.5]` 或 `[-1, 1]`，通常使用以下公式进行归一化：\n\n$$\\frac{x_{i} - x_{i\\\
  _mean}}{x_{i\\_std}}$$\n\n此规范化过程可以通过以下 Python 代码实现：\n\n```python\nX -= np.mean(X,\
  \ axis=0) \nX /= np.std(X, axis=0)\n```\n\n如果所有特征的值大致在同一范围内，也可以对所有特征进行统一标准化，即使用训练集中所有数据的所有特征计算一个统一的均值\
  \ `x_mean` 和标准差 `x_std`，然后用这个相同的均值和标准差对所有数据特征进行归一化。例如，对于使用单字节正整数表示图像像素颜色值的图像，因为这些值都在\
  \ `[0, 255]` 范围内变化，因此可以直接将图像除以 255，将这些图像像素值转换为 `[0, 1]`，而无需专门为每个特征计算均值和方差。\n\n需要注意的是，验证集和测试集中的样本不能单独归一化，否则这些集合中的样本与训练集中的样本不使用相同的归一化标准，因此用训练好的模型预测它们就没有意义。也就是说，在对验证集或测试集中的样本进行预测时，使用与训练集相同的归一化参数（均值和标准差）对验证或测试样本进行归一化。\n\
  \n### 5.1.3 特征工程\n\n对于原始数据样本，某些特征可能与机器学习无关，且特征通常不是独立的，而是相关的。这些相互关联的原始数据特征在机器学习过程中会相互制约，使得学习算法难以收敛。\n\
  \n特征工程是从原始数据中发现和提取有助于机器学习的良好特征。特征工程是传统机器学习中最基础的关键问题之一。不同领域通常会使用一些特定于该领域的人工特征方法。特征工程通常包括许多具体技术，如数据预处理（如数据归一化）、数据降维、特征选择、人工特征设计和特征学习。\n\
  \n#### 1. 数据降维与主成分分析\n\n数据降维是将高维数据转换为低维表示。一个样本可能有大量原始特征。如果用较少的特征来表示样本，可以提高机器学习算法的效率。就像数据压缩一样，压缩后的数据保留了原始数据的固有信息，但对压缩数据的处理（如数据传输）比对原始数据的处理更高效。\n\
  \n主成分分析（PCA）是机器学习中一种经典的数据降维技术。它将数据表示为主轴的线性组合，可以消除数据特征的相关性，然后用少量的主轴来表示原始数据，从而降低数据的维度，即特征的数量。例如，一个\
  \ `256*256` 像素的彩色人脸图像需要 `256*256*3 = 196608` 个数值表示，即其维度为 196608，而一个人脸图像可以用 23 个主轴的线性组合来表示，可保留原始图像\
  \ 97% 的信息，因此一个人脸只需要 23 个数值。\n\n对于以下二维平面的数据点，每个数据点由 2 个坐标表示：\n\n\n\n\n\n##### PCA\
  \ 与白化\n\n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\n%matplotlib\
  \ inline\n# Generate random sample points near the line y=2x+1\nnp.random.seed(1)\n\
  \npts = 25\nx = np.random.randn(pts,1)          # Randomly sample some x coordinates\n\
  y = x+2\ny = y+ np.random.randn(pts,1)*0.2   # Give Y random noise\n\nplt.plot(x,y,'o')\n\
  plt.xlabel('x')\nplt.ylabel('y')\nplt.axis('equal')\nplt.show()\n```\n\n![](img/file113.png\
  \ \"fig:\")  \n\n图 5-13 在直线 y=2x+1 附近随机采样的二维平面数据点\n\n将每个点的坐标视为一个矩阵，所有点坐标可以放入矩阵 `X`\
  \ 中并显示前 3 个坐标点：\n\n```python\nX = np.stack((x.flatten(), y.flatten()), axis=-1)\n\
  print(X.shape)\nprint(X[:3])\n```\n\n(25, 2)  \n\n[[ 1.62434536 3.48759979]  \n\
  \ [-0.61175641 1.36366554]  \n [-0.52817175 1.28467436]]\n\nPCA 可用于降维，使每个点仅有一个数值，而不是用\
  \ 2 个数值表示。PCA 方法的第一步是将每个维度（轴）的分量中心化，即每个维度的分量减去该维度所有分量的均值：\n\n```python\nX -= np.mean(X,\
  \ axis = 0) \nprint(X[:3])\nplt.plot(X[:,0],X[:,1],'o')\nplt.axis('equal')\nplt.show()\n\
  ```\n\n[[ 1.63707525 1.50798964]  \n [-0.59902653 -0.61594461]  \n [-0.51544186\
  \ -0.69493579]]\n\n![](img/file114.png \"fig:\")  \n\n图 5-14 数据中心化，即数据每个维度（特征）的分量减去该维度所有分量的均值，使每个特征以\
  \ 0 为中心点\n\n如果有一个由一组三维坐标点组成的矩阵 `A`，每一行代表一个坐标点的三个坐标：\n\n$$\nA = \\begin{pmatrix}\
  \ 1 & 3 & 2 \\\\ -4 & 2 & 6 \\\\ 2 & 6 & 4 \\\\ -3 & 0 & 1 \\end{pmatrix}\n$$\n\n\
  即 `A` 有 4 个样本，每个样本有 3 个特征（x, y, z 坐标）。这些样本的特征之间是否相关？`A` 的相关矩阵（协方差矩阵），`A^T A`，表示数据集不同特征之间的相关程度。\n\
  \n$$\nA^T A = \\begin{pmatrix} 1 & -4 & 2 & -3 \\\\ 3 & 2 & 6 & 0 \\\\ 2 & 6 & 4\
  \ & 1 \\end{pmatrix} \\begin{pmatrix} 1 & 3 & 2 \\\\ -4 & 2 & 6 \\\\ 2 & 6 & 4 \\\
  \\ -3 & 0 & 1 \\end{pmatrix} = \\begin{pmatrix} 30 & 7 & -17 \\\\ 7 & 49 & 42 \\\
  \\ -17 & 42 & 57 \\end{pmatrix}\n$$\n\n计算代码如下：\n\n```python\nA = np.array([[1,3,2],[-4,2,6],[2,6,4],[-3,0,1]])\n\
  print(A)\nprint(\"A^TA:\\n\",np.dot(A.transpose(),A))\n```\n\n[[ 1 3 2]  \n [-4\
  \ 2 6]  \n [ 2 6 4 ]  \n [-3 0 1]]  \n\nA^TA:  \n\n[[ 30 7 -17]  \n [ 7 49 42] \
  \ \n [-17 42 57]]\n\n从协方差矩阵的元素值可以看出，x 和 y 之间的相关值为 7，y 和 z 之间的相关值为 42，表明 y 和 z 之间的相关性较大，而\
  \ x 和 y 之间的相关性较小。通常，协方差矩阵可以除以样本数量，以减少样本数量对矩阵值的影响。对于上述样本矩阵 `X`，其协方差矩阵计算如下：\n\n```python\n\
  cov = np.dot(X.T, X) / X.shape[0] # covariance matrix\n```\n\n对协方差矩阵进行 SVD 分解可获得主成分（特征向量）`U`、奇异值（方差，特征值的平方）`S`，奇异值等价于方差，表示发散程度：\n\
  \n```python\nU,S,V = np.linalg.svd(cov)\nprint(U)\nprint(S)\nprint(S[0]/(S[0]+S[1]))\n\
  ```\n\n[[-0.68302064 -0.73039907]  \n [-0.73039907 0.68302064]]  \n\n[2.46815362\
  \ 0.01168714]  \n\n0.995287139793862\n\n`U` 的每一列代表一个主轴，主轴代表数据变化的主要方向（主轴方向），如图 5-15\
  \ 所示：\n\n```python\nplt.plot(X[:,0],X[:,1],'o')\nplt.plot([0,U[0,0]], [0,U[1,0]])\n\
  plt.plot([0,U[0,1]], [0,U[1,1]])\nplt.axis('equal')\nplt.show()\n```\n\n![](img/file115.png\
  \ \"fig:\")  \n\n图 5.15 协方差矩阵的 SVD 分解，可获得主成分（特征值）和主成分方向（特征向量）\n\n`S[0]` 和 `S[1]`\
  \ 表示数据在主轴方向上的占比，可以看出数据在第一主轴方向上的变化占比较大。通过将数据投影到由主轴 `U` 定义的轴上，数据可以表示为主轴的分量。\n\n```python\n\
  Xrot = np.dot(X, U)\nprint(Xrot[:5])\n```\n\n[[-2.21959042 -0.16573019]  \n [ 0.85903285\
  \ 0.01682553]  \n [0.85963789 -0.09817723]  \n [ 1.53210054 0.01886974]  \n [-1.32424593\
  \ 0.03607588]]\n\n显示这些主轴分量在主轴上形成的坐标点：\n\n```python\nplt.plot(Xrot[:,0],Xrot[:,1],'o')\n\
  plt.axis('equal')\nplt.show()\n```\n\n![](img/file116.png)\n\n图 5.16 旋转数据使主轴与坐标轴对齐\n\
  \n将数据转换为主成分的分量表示可以消除新特征之间的相关性，从其协方差矩阵可以看出，代表不同特征的非对角线值变为 0。\n\n```python\nprint(np.dot(Xrot.transpose(),Xrot))\n\
  ```\n\n[[6.17038405e+01 9.38138456e-15]  \n [9.38138456e-15 2.92178571e-01]]\n\n\
  用第一主轴的坐标来表示这些样本，数据损失近乎 `(1-0.995287139793862)*100% = 0.472%`，几乎可以忽略不计。这种将数据样本表示为少数主轴的线性组合的方式称为**数据降维**。对于本例，样本数据的维度可以从特征数\
  \ 2 降低到特征数 1，达到减少样本特征数量的目的。\n\n```python\nXrot_reduced = np.dot(X, U[:,:1]) # Xrot_reduced\
  \ become a [N x 1] array\nprint(Xrot_reduced[:3])\nplt.plot(Xrot_reduced[:],[0]*pts,'o')\n\
  plt.axis('equal')\nplt.show()\n```\n\n[[-2.21959042]  \n [ 0.85903285]  \n [0.85963789]]\n\
