  \ hidden)\n\ndef evaluate(self, encoder_outputs, max_length):\n    hidden = encoder_outputs[-1]\n\
  \    hidden = hidden.reshape(1, hidden.shape[0], hidden.shape[1])\n    input_T =\
  \ self.encoder_outputs.shape[0]\n    # encoder_outputs = np.pad(self.encoder_outputs,\
