  \ / train_stdevs\n\nplt.title(\"Learning Curves for Linear Regression\", fontsize=16)\n\
  print(x_train_n.shape)\nprint(w.shape)\nprint(x_val_n.shape)\nreg = 0.2\nlearning_curves(x_train_n,\
  \ y_train, x_val_n, y_val, reg, alpha, iterations)\n```\n\n```text\n(12, 8)\n  \
