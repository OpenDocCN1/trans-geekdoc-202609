  \ 的数值梯度与解析梯度可以一致。\n\n#### 池化层的反向推导\n\n池化层没有模型参数，只是对输入数据 `x` 进行最大化或平均操作，输出每个池化窗口的最大值或平均值。常用的最大池化，如果\
  \ `x` 通过最大池化输出 `z`，则：\n\n$$z[i, j] = \\max(x[i:i+K_h, j:j+K_w])$$\n\n如图 6-40 所示，$z[0,0]\
  \ = \\max(x[0:2, 0:2])$，如果 $z[0,0] = x[1,1]$，则损失 $L$ 通过 $z[0,0]$ 传回 $x$ 的偏导数只有 $\\\
  frac{\\partial L}{\\partial x_{11}} = \\frac{\\partial L}{\\partial z_{00}}\\frac{\\\
  partial z_{00}}{\\partial x_{11}} = \\frac{\\partial L}{\\partial z_{00}}$ 不为 0，其他的\
  \ $\\frac{\\partial L}{\\partial x_{ij}} = 0,\\quad ij \\neq 11$。\n\n**图 6-40**\
  \ 池化操作产生的阴影数据窗口的结果 $z_{00}$ 等于 $x_{11}$，所以只有 $\\frac{\\partial L}{\\partial x_{11}}\
  \ \\neq 0$。\n\n因此，最大池化层的梯度计算很简单。对于 $z[i, j] = \\max(x[i:i+K_h, j:j+K_w])$，`x[i+u,\
  \ j+v]` 是数据窗口 `x[i:i+K_h, j:j+K_w]` 中等于 `z[i, j]` 的数据值。只需将每个 $\\frac{\\partial L}{\\\
  partial z_{ij}}$ 加到与该 `x[i+u, j+v]` 对应的、与 `z[i, j]` 对应的偏导数 $\\frac{\\partial L}{\\\
  partial x_{i+u, j+v}}$ 上。\n\n池化层的代码实现：\n\n```python\nclass Pool(Layer):\n    def\
  \ __init__(self, pool_param=(2, 2, 2)):\n        super().__init__()\n        self.pool_h,\
  \ self.pool_w, self.stride = pool_param\n\n    def forward(self, x):\n```\n\n\n\n\
  \n\n```python\n        self.x = x\n\n        N, C, H, W = x.shape\n\n        pool_h,\
  \ pool_w, stride = self.pool_h, self.pool_w, self.stride\n\n        h_out = 1 +\
  \ (H - pool_h) // stride\n\n        w_out = 1 + (W - pool_w) // stride\n\n     \
  \   out = np.zeros((N, C, h_out, w_out))\n\n        for n in range(N):\n       \
  \     for c in range(C):\n                for i in range(h_out):\n             \
  \       si = stride * i\n                    for j in range(w_out):\n          \
  \              sj = stride * j\n                        x_win = x[n, c, si:si+pool_h,\
  \ sj:sj+pool_w]\n                        out[n, c, i, j] = np.max(x_win)\n\n   \
  \     return out\n\n    def backward(self, dout):\n        out = None\n        x\
  \ = self.x\n        N, C, H, W = x.shape\n        kH, kW, stride = self.pool_h,\
  \ self.pool_w, self.stride\n        oH = 1 + (H - kH) // stride\n        oW = 1\
  \ + (W - kW) // stride\n        dx = np.zeros_like(x)\n\n        for k in range(N):\n\
  \            for l in range(C):\n                for i in range(oH):\n         \
  \           si = stride * i\n                    for j in range(oW):\n         \
  \               sj = stride * j\n                        slice = x[k, l, si:si+kH,\
  \ sj:sj+kW]\n                        slice_max = np.max(slice)\n               \
  \         dx[k, l, si:si+kH, sj:sj+kW] += (slice_max == slice) * dout[k, l, i, j]\n\
  \n        return dx\n```\n\n同样，可以使用数值梯度来验证池化类解析梯度的正确性：\n\n```python\nx = np.random.randn(3,\
  \ 2, 8, 8)\ndf = np.random.randn(3, 2, 4, 4)\npool = Pool((2, 2, 2))\nf = pool.forward(x)\n\
  dx = pool.backward(df)\ndx_num = util.numerical_gradient_from_df(lambda: pool.forward(x),\
  \ x, df)\nprint(diff_error(dx, dx_num))\n```\n\n```\n1.680655614677562e-11\n```\n\
  \n上述实现的卷积层神经元省略了激活函数，激活函数可以像全连接神经元一样添加到卷积层的实现类 `conv` 中，或者（如第 4 章所述）卷积层和全连接层中加权求和\
  \ `z` 经过激活函数输出激活值 `a`，由单独的类定义。\n\n`a = g(z)`\n\n`∂L/∂z = ∂L/∂a * g'(z)`\n\n### 6.2.4\
  \ 卷积神经网络的实现\n\n基于已实现的卷积层、池化层和全连接层，可以实现一个表示一类卷积神经网络的 `ConvNetwork`。\n\n```python\n\
