  \ 4200: loss 0.095018\niteration 4800: loss 0.084522\niteration 5400: loss 0.095629\n\
  0.9866666666666667\n```\n\n### 4.3.6 基于深度学习框架的 MNIST 手写数字识别\n\n接下来测试 MNIST 数据集。首先下载\
