  \ `NeuralNetwork` 中添加读取（`save_parameters()`）和写入（`load_parameters()`）模型参数的功能：\n\n\
  ```\nclass NeuralNetwork:  \n    def __init__(self):\n        self._layers = []\n\
  \        self._params = []\n \n    def add_layer(self, layer):      \n        self._layers.append(layer)\n\
  \        if layer.params: \n           # for  i in range(len(layer.params)): \n\
  \            for  i, _ in enumerate(layer.params):                         \n  \
  \              self._params.append([layer.params[i],layer.grads[i]])           \
  \ \n    \n    def forward(self, X): \n        for layer in self._layers:\n     \
  \       X = layer.forward(X) \n        return X   \n\n    def __call__(self, X):\n\
  \        return self.forward(X)\n    \n    def predict(self, X):\n        p = self.forward(X)\
  \       \n        if p.ndim == 1:     #single sample\n            return np.argmax(ff)\
  \  \n        return np.argmax(p, axis=1)   # multiple samples  \n   \n    def backward(self,loss_grad,reg\
  \ = 0.):\n        for i in reversed(range(len(self._layers))):\n            layer\
  \ = self._layers[i] \n            loss_grad = layer.backward(loss_grad)\n      \
  \      layer.reg_grad(reg) \n        return loss_grad\n    \n    def reg_loss(self,reg):\n\
  \        reg_loss = 0\n        for i in range(len(self._layers)):\n            reg_loss+=self._layers[i].reg_loss(reg)\n\
  \        return reg_loss\n    \n    def parameters(self): \n        return self._params\n\
  \    \n    def zero_grad(self):\n        for i,_ in enumerate(self._params):   \
  \        \n            #self.params[i][1].fill(0.) \n            self.params[i][1][:]\
  \ = 0 \n            \n    def get_parameters(self):\n        return self._params\
  \   \n    \n    def save_parameters(self,filename):\n        params = {}\n     \
  \   for i in range(len(self._layers)):\n            if self._layers[i].params:\n\
  \                params[i] = self._layers[i].params\n        np.save(filename, params)\
  \               \n        \n    def load_parameters(self,filename):\n        params\
  \ = np.load(filename,allow_pickle = True)\n        count = 0\n        for i in range(len(self._layers)):\n\
  \            if self._layers[i].params:\n                layer_params = params.item().get(i)\n\
  \                self._layers[i].params = layer_params                \n       \
  \         for j in range(len(layer_params)):                   \n              \
  \      self._params[count][0] = layer_params[j]\n                    count+=1  \
  \ \n```\n\n使用以下代码测试上述模型的读写功能。\n\n```\nfrom NeuralNetwork import *\nnn = NeuralNetwork()\n\
  nn.add_layer(Dense(3, 2,('xavier',0.01)))\nnn.add_layer(Relu())\nnn.add_layer(Dense(2,\
