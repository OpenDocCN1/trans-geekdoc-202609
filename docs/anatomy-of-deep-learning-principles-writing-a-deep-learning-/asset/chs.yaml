  \ 使用时间窗口长度 T=600 的训练模型进行短期预测\n\n### 7.1.10 k-gram 语言模型\n\n语言模型是计算当 $w_1, w_2, \\\
  cdots, w_{n-1}$ 出现时，$w_n$ 的概率 $P(w_n|w_1, w_2, \\cdots, w_{n-1})$。根据公式 $P(A|B) =\
  \ \\frac{P(A \\cap B)}{P(B)}$，条件概率 $P(w_i|w_1, w_2, \\cdots, w_{i-1})$ 可以表示为：\n\n\
  $P(w_i|w_1,w_2,\\cdots,w_{i-1}) = \\frac{P(w_1,w_2,w_3,\\cdots,w_{i-1},w_i)}{\\\
  sum\\limits_w P(w_1,w_2,w_3,\\cdots,w_{i-1},w)} = \\frac{P(w_1,w_2,w_3,\\cdots,w_{i-1},w_i)}{P(w_1,w_2,w_3,\\\
  cdots,w_{i-1})}$\n\n即 $w_1, w_2, w_3, \\cdots, w_{i-1}, w_i$ 同时出现的联合概率 $P(w_1, w_2,\
  \ w_3, \\cdots, w_{i-1}, w_i)$ 除以边缘概率 $\\sum\\limits_w P(w_1,w_2,w_3,\\cdots,w_{i-1},w)$，后者即\
  \ $P(w_1, w_2, w_3, \\cdots, w_{i-1})$。后者也可以看作仅包含随机变量 $w_1, w_2, w_3, \\cdots, w_{i-1}$\
  \ 的联合概率。\n\n要计算条件概率，需要求出联合概率 $P(w_1, w_2, w_3, \\cdots, w_{i-1})$ 和 $P(w_1, w_2,\
  \ w_3, \\cdots, w_{i-1}, w_i)$。这些概率可以通过统计方法用频率近似计算。例如，要统计两个词 $w_1 = \\text{\"中国\"\
  }$ 和 $w_2 = \\text{\"人\"}$ 同时出现的联合概率 $P(\\text{\"中国\"}, \\text{\"人\"})$，可以在语料库（如大量文本）中统计“中国人”出现的次数为\
  \ n，所有 $w_1$ 和 $w_2$ 的组合（如“你好”、“打球”、“中国梦”）出现的次数为 m。用该频率 n/m 来近似概率 $P(\\text{\"中国\"\
  }, \\text{\"人\"})$。\n\n但如果 $i$ 较大，这种计算显然不现实，主要存在两个问题：\n\n*   由于 $w_j$ 很多，$w_1, w_2,\
  \ w_3, \\cdots, w_{i-1}, w_i$ 的组合数量会呈指数级增长，统计计算 $P(w_1, w_2, w_3, \\cdots, w_{i-1},\
  \ w_i)$ 非常困难。\n*   序列 $w_1, w_2, w_3, \\cdots, w_{i-1}, w_i$ 很有可能在语料库中根本不出现，导致概率\
  \ $P(w_1, w_2, w_3, \\cdots, w_{i-1}, w_i)$ 为 0。\n\n为了解决上述计算条件概率依赖参数过多的问题，通常引入**马尔可夫假设**，即假设一个词的概率仅与它前面出现的有限个词有关。在极端情况下，假设一个词的出现与其周围的词相互独立，即其出现概率不依赖于其他词。这种语言模型称为**一元语言模型**。此时，句子\
  \ $S = w_1, w_2, w_3, \\cdots, w_n$ 的概率计算变得非常简单：\n\n$P(w_1, w_2, w_3, \\cdots, w_n)\
  \ = P(w_1) \\times P(w_2) \\times P(w_3) \\times \\cdots P(w_n)$\n\n但这种语言模型显然是不合理的，因为文本中词的出现并非相互独立，而是存在依赖关系。如果语言模型假设一个词出现的概率仅依赖于它前面出现的一个词，这种语言模型称为**二元语言模型**（bigram）。\n\
  \n$P(w_1, w_2, w_3, \\cdots, w_n) = P(w_1) \\times P(w_2|w_1) \\times P(w_3|w_2)\
  \ \\times \\cdots P(w_n|w_{n-1})$\n\n以此类推，如果语言模型假设一个词的概率仅依赖于它前面的 $k-1$ 个词，这种语言模型称为**k-gram\
  \ 语言模型**（**k-gram**）。k-gram 语言模型是时间窗口方法在语言模型上的具体应用，即利用前 $k-1$ 个词来预测下一个词的概率。\n\n\
  显然，$k$ 越大，预测准确率越高。例如，对于二元语言模型，如果当前词是“中国”，下一个词可能有很多，难以预测具体是哪一个；但如果是四元模型，依次出现的词是“我”、“是”、“中国”，那么下一个词是“人”的概率（可能性）就会非常高。但\
  \ $k$ 越大，上述两个问题就越严重。为了规避上述两个困难，传统语言模型一般采用三元或四元语言模型（3-gram 或 4-gram）。\n\n如果构建了这样一个\
  \ k-gram 语言模型，就可以根据前面出现的 $k-1$ 个词，预测词表中每个词作为下一个词出现的概率，从而预测整个句子出现的概率。\n\n语言模型是各种自然语言处理问题的基础。例如，可以利用语言模型从开头的词进行长期预测，即根据语言模型的概率对下一个词进行采样，并不断重复这一过程生成一系列后续词，从而自动生成文章、小说、诗歌、散文、评论等文本。\n\
  \nk-gram 语言模型在用固定长度“时间窗口”数据进行预测时存在一些明显的局限性。主要有两个问题：\n\n*   时间窗口长度难以确定。如果时间窗口太短，会导致目光短浅。例如，在机器翻译中，往往需要根据长上下文准确理解当前词的含义；在文本生成中，根据前面的长文本才能正确预测下一个词，如“上学路上，张某儿子看见一位摔倒的老太太。这段话最后一个词用“他”还是“她”，需要根据前面的“儿子”来确定。算法的计算量与样本数据长度成正比。如果时间窗口太长，会耗费更多时间。对语言模型而言，时间窗口过长会使概率估计变得非常困难。此外，对于短序列样本（如短句），需要填充许多空白元素，造成空间浪费。对于许多序列数据问题，不同时刻依赖的数据序列长度往往不同且变化，难以确定一个合适的时间窗口长度。\n\
  *   使用普通神经网络对序列数据预测问题建模，随着时间窗口变大，模型参数规模会变大。与单独处理每个原始数据样本相比，如果使用长度为 3 的时间窗口，输入数据样本的长度会增加\
  \ 3 倍。为了更好地捕捉数据特征，每层神经元数量会相应增加，导致模型参数量呈指数级增长，这不仅消耗更多计算资源，还增加了模型函数的复杂度，容易导致训练过拟合。\n\
  \n时间窗口只是一种短期记忆行为，人在理解事物时，不仅会用到短期记忆，还会用到所有的过往记忆。为了处理这种变长序列数据，研究者模拟人类的长期记忆行为，发明了**循环神经网络**（**Recurrent\
  \ Neural Networks**，**RNN**）。RNN 在传统神经网络的神经元中增加了**存储/记忆单元**，使得历史计算信息得以保存。换句话说，神经元具有了记忆功能，每一当前时刻的计算不仅依赖于当前的输入，还依赖于存储的历史信息，从而使数据和计算结果能在时间维度上传递，使得循环神经网络理论上可以记忆任意长度的序列信息。正如卷积神经网络能提取空间维度的特征，循环神经网络能在时间维度上传递信息，它是非循环神经网络在时间维度上的延伸。\n\
  \n## 7.2 循环神经网络\n\n### 7.2.1 不具备记忆功能的非循环神经网络\n\n上文学习的神经网络都是不具备记忆功能的神经网络，它们表示一个不具备记忆功能的函数，不同样本之间的输入输出相互独立，没有任何关联。假设该神经网络记为\
  \ $y = f(x)$，对于两个不同的输入 $x_i, x_j$，它们的输出 $f(x_i), f(x_j)$ 互不相关。\n\n非循环神经网络表示的函数类似于编程语言中不具备记忆功能的函数，例如\
  \ C 语言中没有静态变量的函数和 Python 语言中的函数。如：\n\n```\n```\n\n\n\n\n```python\ndef f(x):\n \
  \   y = 0\n    y += x*x\n    return y\n\nprint(f(2), '\\t', f(3))\nprint(f(3), '\\\
  t', f(2))\n```\n\n```\n4 9\n9 4\n```\n\n无论是先计算 `f(2)` 再计算 `f(3)`，还是先计算 `f(3)` 再计算\
  \ `f(2)`，`f(2)` 和 `f(3)` 的结果仅取决于各自的输入 2 和 3，`f(2)` 和 `f(3)` 的执行顺序无关紧要。\n\n如果使用无环神经网络根据当前词预测下一个词的概率，这种预测也独立于词的处理顺序。如图\
  \ 7-12 所示，假设语言中只有 \"good\"、\"drink\" 和 \"wine\" 三个词，对于输入词序列 \"good drink\" 中的每个词，神经网络都输出每个词作为下一个词的概率。\n\
  \n图 7-12 非循环神经网络从词 \"good\" 预测 \"good\"、\"drink\" 和 \"wine\" 作为下一个词的概率，以及从词 \"drink\"\
  \ 预测 \"good\"、\"drink\" 和 \"wine\" 作为下一个词的概率，二者相互独立。无论输入序列是 \"good to drink\"、\"\
  wine is good to drink\" 还是 \"drink good wine\"，从词 \"good\" 预测 \"good\"、\"drink\"\
  \ 和 \"wine\" 作为下一个词的概率都是相同的。\n\n无论这三个词在句子中以何种顺序出现，例如 \"wine is good\" 和 \"drinking\
  \ good wine\"，对于每个词，神经网络根据该词预测每个词作为其下一个词的概率，结果都是一样的。用这种神经网络来表示语言模型，每个词的输出值仅取决于它自己，与其他词无关。这显然是不合理的。\n\
  \n不失一般性，如果神经网络只有一层或一层神经元，即：\n\n`y = f(x) = g(xW + b)`\n\n并假设非线性激活函数为 sigmoid 函数，该神经网络可用\
  \ Python 代码表示为：\n\n```python\nclass FNN(x):\n    # ...\n    def forward(self, x):\n\
  \        y = sigmoid(np.dot(x, self.W) + self.b)\n        return y\n```\n\n对于一组数据\
  \ `x^((1))`、`x^((3))`、`x^((3))`，FNN 计算这些数据的输出过程如下：\n\n```python\nnn = FNN()\ny1\
  \ = nn.forward(x1)\ny2 = nn.forward(x2)\ny3 = nn.forward(x3)\n```\n\n这三条预测语句的顺序对预测结果\
  \ `y1`、`y2`、`y3` 没有影响。\n\n如图 7-12 所示，为了将一个词作为样本输入神经网络，需要对每个词进行量化，即转换为固定长度的向量，因为语言模型只有\
  \ 3 个词，可以使用长度为 3 的 one-hot 向量来区分这 3 个词，即每个词对应一个不同的 one-hot 向量，例如：good (1,0,0)，drink\
  \ (0,1,0)，wine (0,0,1)。\n\n### 7.2.2 具有记忆功能的循环神经网络\n\n与无环神经网络不同，循环神经网络是一种具有记忆功能的神经网络，可表示为\
  \ `y = f(x, h)`，即除了输入 `x` 外，还有一个隐藏状态变量 `h` 用于记录计算过程的历史。循环神经网络函数类似于编程语言中具有记忆功能的函数或类，例如\
  \ C 语言中包含静态局部变量的函数，以及 C++、Java、Python 等语言中的类对象。例如，下面的类 `rf` 使用数据属性 `h` 来记录计算的中间结果（状态）：\n\
  \n```python\nclass rf():\n    def __init__(self):\n        self.h = 0\n    def forward(self,\
  \ x):\n        self.h += 2*x\n        return self.h + x*x\n    def __call__(self,\
  \ x):\n        return self.forward(x)\n\nf = rf()\nprint(f(2), '\\t', f(3))\nprint(f(3),\
  \ '\\t', f(2))\n```\n\n```\n8 19\n25 24\n```\n\n\n\n\n# 循环神经网络的状态与计算过程\n\n#### 状态变量的概念\n\
  \n对于输入值 `x`，`rf` 类的 `forward()` 方法在计算输出时，不仅依赖于 `x`，还依赖于上一次计算过程中保存的信息 `h`。因此，`f(2)`\
  \ 和 `f(3)` 的输出及其执行顺序是相关的。`rf` 类中记录计算前中间结果的变量 `h` 称为**状态**。\n\n与上述类类似，循环神经网络也有一个记录/记忆计算过程信息的变量\
  \ `h`。在循环神经网络中，该变量称为**隐藏状态（变量）**。在任意时刻 `t`，循环神经网络基于当前输入数据 `x^(⟨t⟩)` 和状态变量 `h^(⟨t−1⟩)`，计算当前时刻的输出\
  \ `f^(⟨t⟩)` 和状态 `h^(⟨t⟩)`。即循环神经网络表示的函数是一个 2 个输入、2 个输出的函数：`y, h = f(x, h)` 或 `y^(⟨t⟩),\
  \ h^(⟨t⟩) = f(x^(⟨t⟩), h^(⟨t−1⟩))`。\n\n时刻 `t` 的状态 `h^(⟨t⟩)` 将作为 `t+1` 时刻的输入参与 `t+1`\
  \ 时刻的计算：`y^(⟨t+1⟩), h^(⟨t+1⟩) = f(x^(⟨t+1⟩), h^(⟨t⟩))`。\n\n随时间变化的状态变量 `h^(⟨t⟩)`\
  \ 存储/记忆了历史信息。基于该状态变量表示的历史信息和当前时刻的数据，可以做出更好的预测。\n\n#### 循环神经网络的结构表示\n\n循环神经网络通常用图\
  \ 7-13 a) 所示的图表示。它与普通神经网络的区别在于：当前时刻计算出的隐藏状态将作为下一时刻的输入，因此画成一指向自身的弧。隐藏状态变量既作为当前时刻计算的输出，又作为下一时刻计算的输入。图\
  \ 7-13 b) 是图 7-13 a) 在时间维度上计算过程的展开表示。可以看到，上一时刻的状态变量作为当前时刻的输入，计算当前时刻的输出和状态变量，该状态变量又作为下一时刻计算的输入。\n\
  \n> **图 7-13** a) 循环神经网络的表示，其中存在一个隐藏状态变量，它既是计算的输出，又是下一次计算的输入。b) 图 a) 在时间维度上计算过程的展开表示。上一时刻的状态变量作为当前时刻的输入，计算当前时刻的输出和状态变量，当前时刻的状态变量作为下一时刻计算的输入。\n\
  \n#### 初始时刻与时间步计算示例\n\n在初始时刻 `t=0`，状态变量 `h^(⟨−1⟩)` 是一个初始值为 0 的向量。对于上述 3 词语言模型，输入数据是单词\
  \ \"good\" 对应的特征向量 `x^(⟨0⟩) = (1,0,0)`，神经网络将计算当前输出 `y^(⟨0⟩)` 和状态变量 `h^(⟨0⟩)`：\n\n\
  `y^(⟨0⟩), h^(⟨0⟩) = f(x^(⟨0⟩), h^(⟨−1⟩))`\n\n在时刻 `t=1`，输入数据为 `x^(⟨1⟩) = (0,1,0)`\
  \ 以及前一状态 `h^(⟨0⟩)`，神经网络计算新的输出 `y^(⟨1⟩)` 和状态 `h^(⟨1⟩)`：\n\n`y^(⟨1⟩), h^(⟨1⟩) = f(x^(⟨1⟩),\
  \ h^(⟨0⟩))`\n\n在时刻 `t=2`，输入数据为 `x^(⟨2⟩) = (0,0,1)` 以及前一状态 `h^(⟨1⟩)`，神经网络计算新的输出 `y^(⟨2⟩)`\
  \ 和状态 `h^(⟨2⟩)`：\n\n`y^(⟨2⟩), h^(⟨2⟩) = f(x^(⟨2⟩), h^(⟨1⟩))`\n\n#### 简单循环神经网络的数学公式\n\
  \n考虑最简单的只有一个神经元或一层神经元的循环神经网络，用 `x^(⟨t⟩), h^(⟨t⟩), f^(⟨t⟩)` 分别表示输入数据、状态变量和输出，循环神经网络的计算过程与只有一个神经元或一层神经元的普通神经网络几乎相同。\n\
  \n$$\n\\begin{matrix}\nh^{\\langle t \\rangle} = g_{h}(h^{\\langle t - 1 \\rangle}W_{h}\
  \ + x^{\\langle t \\rangle}W_{x} + b_{h}) \\\\\nf^{\\langle t \\rangle} = g_{f}(h^{\\\
  langle t \\rangle}W_{f} + b_{y})\n\\end{matrix}\n$$\n\n其中，`g_h`、`g_f` 分别是计算当前状态和输出的激活函数。\n\
  \n如果 `g_h` 是 tanh 函数，`g_y` 是 sigmoid 函数，计算过程可以用 Python 代码表示如下：\n\n```python\nclass\
  \ RNN:\n    # ...\n\n    def step(self, x):\n        # update hidden state\n   \
  \     self.h = np.tanh(np.dot(self.h, self.W_hh) + np.dot(x, self.W_hx)) + self.b\n\
  \        # Compute the output vector\n        y = sigmoid(np.dot(self.h, self.W_hy)\
  \ + self.b2)\n        return y\n```\n\n#### 时间序列数据的 RNN 计算过程\n\n对于时间序列数据 `x^(⟨1⟩),\
  \ x^(⟨2⟩), x^(⟨3⟩)`，RNN 计算这些数据的输出过程如下：\n\n```python\nrnn = RNN()\ny1 = rnn.step(x1)\
  \ # calculated the implicit h1 at the same time\ny2 = rnn.step(x2) # Calculate the\
  \ implicit h2 at the same time\ny3 = rnn.step(x3) # calculated the implicit h3 at\
  \ the same time\n```\n\n\n\n\n可以看出，循环神经网络的结构仍然类似于普通神经网络的结构，唯一的区别是计算过程会使用保存的隐藏状态来计算当前时刻的隐藏状态和输出。将图\
  \ 7-13 a) 在时间维度上展开为图 7-13 b) 的结构，有助于理解其在时间维度上的迭代循环计算过程。但它并不是在时间维度上复制多个神经网络，而是在神经网络（神经元）中增加了一个状态变量\
  \ `h^(⟨t⟩)` 来保存上一时刻的计算结果。因此，循环神经网络的模型参数不会随着时间的展开而增加，可以通过不断调用 `rnn.step()` 在时间维度上任意展开长序列。时间窗口方法的神经网络只能处理固定长度的序列，且模型参数会随着时间窗口长度的增加而增加。循环神经网络完美地解决了时间窗口方法中的这两个问题。\n\
  \nRNN 可以通过状态变量 `h^(⟨t⟩)` 存储历史信息，从而使 RNN 具有记忆功能，就像玩一个带有录制功能的游戏，每一次都是基于上一局的游戏分数和能力继续玩下去。如果玩一个没有录制功能的游戏，每一次游戏都是新的开始，与上一局游戏无关。\n\
  \n与一对一神经网络一样，可以引入两个辅助变量 `z[h]^(⟨t⟩)`、`z[f]^(⟨t⟩)` 来表示公式 (1) 中的加权求和，(2) 中的加权求和，则上述循环神经网络的计算过程可以表示为以下\
  \ 4 个计算公式：\n\n```\nz[h]^(⟨t⟩) = x^(⟨t⟩) * W[x] + h^(⟨t-1⟩) * W[h] + b^(⟨t⟩)\nh^(⟨t⟩)\
  \ = gh)\nz[f]^(⟨t⟩) = h^(⟨t⟩) * W[f] + b[f]^(⟨t⟩)\nf^(⟨t⟩) = go)\n```\n\n仅有一个神经元或单层网络的\
  \ RNN 前向计算过程如图 7-14 所示：\n\n**图 7-14** 引入加权和中间变量 `z[h]^(⟨t⟩)`、`z[f]^(⟨t⟩)` 的循环神经网络前向计算过程，首先根据输入和上一时刻的隐藏状态计算\
  \ `z[h]^(⟨t⟩)`，然后根据激活函数计算 `h^(⟨t⟩)`，接着计算 `z[f]^(⟨t⟩)` 和 `f^(⟨t⟩)`。\n\n与普通的一对一神经网络一样，循环神经网络也可以有多层，上一层的输出作为下一层的输入。同时，每一层的神经元都有自己的状态变量。图\
  \ 7-15 是一个三层循环神经网络：\n\n**图 7-15** 三层循环神经网络\n\n上述神经网络是同步多对多 RNN，即每个时刻的输入对应一个输出，也有异步多对多\
  \ RNN，例如机器翻译，只有整个句子的所有单词都完成后，才能给出最终翻译的句子。如图 7-16 所示：\n\n**图 7-16** 具有 Seq2Seq 结构的循环神经网络\n\
  \n这种在生成输出序列之前先处理输入序列的循环神经网络结构称为 **Sequence-to-Sequence (Seq2seq)** 结构。\n\n当然，也有多对一\
  \ RNN，例如对一个单词序列的文本进行分类（如对文本进行情感分析，从商品评论中分析评价质量），如图 7-17 所示。\n\n**图 7-17** 具有多对一结构的循环神经网络\n\
  \n还有一种一对多结构的神经网络，如图 7-18 所示，给定一个输入产生一个输出序列。例如，给定一个单词，自动生成一系列由单词组成的文本，从一个音符自动生成乐谱的所有音符。\n\
  \n**图 7-18** 具有 一对多 结构的循环神经网络\n\n## 7.3 通过时间的反向传播\n\n与非循环神经网络一样，循环神经网络的损失函数关于模型参数、隐藏状态、输入和输出变量的梯度，可以通过基于链式求导法则的反向传播算法获得。因为\
  \ RNN 根据时间计算每个时刻的隐藏状态和输出，每个时刻的隐藏状态和输出不仅依赖于当前时刻的输入数据，还依赖于上一时刻的隐藏状态，而上一时刻的隐藏状态又依赖于上一时刻的输入数据和隐藏状态。因此，RNN\
  \ 网络的损失函数依赖于每个时刻的隐藏状态和输出。前向计算按时间展开进行，反向传播的梯度按时间逆序计算，以求解损失函数关于各时刻变量（隐藏状态、模型参数等）的梯度。\n\
  \n以同步多对多 RNN 神经网络为例，假设 RNN 只有一层神经元（多层神经网络同理），每个时刻都有一个预测值 `f^(⟨t⟩)` 和目标值 `y^(⟨t⟩)`，每个时刻都有一个损失\
  \ `ℒ^((t))`，如图 7-19 所示：\n\n**图 7-19** 对于同步多对多 RNN 网络，每个时刻都有一个预测值 `f^(⟨t⟩)` 和目标值\
  \ `y^(⟨t⟩)`，每个时刻都有一个损失 `ℒ^((t))`\n\n总损失是所有时刻预测值与目标值之损失的和。即：\n\n$\\\\mathcal{L} =\
  \ \\\\sum\\\\limits\\_{t = 1}^{T}\\\\mathcal{L}^{(t)}$\n\n如果这是一个单向 RNN，即每个时刻的预测只依赖于上一时刻的状态，图中的实线表示按时间展开的前向计算过程，而虚线表示按逆向时间过程进行的反向推导。每个时刻的损失函数是上一时刻变量（隐藏状态、输入）和模型参数的函数。在反向推导中，需要求出损失函数关于上一时刻变量和模型参数的梯度。\n\
  \n对任意时刻 t，其前向和反向计算过程如图 7-20 所示：\n\n**图 7-20** 任意时刻 t 循环神经网络的前向和反向计算过程，反向推导过程中模型参数的梯度包含当前损失和后续损失关于模型参数的梯度。\n\
  \n在任意时刻，需要计算当前时刻损失关于模型参数的梯度，还要计算下一时刻隐藏状态梯度贡献给当前时刻模型参数的梯度。即当前时刻模型参数的梯度包含当前时刻损失和后续时刻损失关于模型参数的梯度。\n\
  \n引入 `z[f]^(⟨t⟩)`、`z[h]^(⟨t⟩)` 等中间变量可以简化模型参数梯度的计算过程。图 7-21 展示了包含中间变量的前向计算和反向推导过程。\n\
  \n**图 7-21** 包含中间变量的前向计算和反向推导过程\n\n根据求导链式法则，假设已知当前时刻损失函数关于 `f^(⟨t⟩)` 的梯度 `$\\\\\
  frac{\\\\partial\\\\mathcal{L}}{\\\\partial f^{\\\\langle t\\\\rangle}}$` 和后续时刻损失函数关于\
  \ `h^(⟨t⟩)` 的梯度 `$\\\\frac{\\\\partial\\\\mathcal{L}}{\\\\partial h^{\\\\langle\
  \ t\\\\rangle}}$`。在此基础上，可以求出时刻 t 的损失函数关于模型参数 `W[f]`、`W[h]`、`W[x]` 以及上一时刻隐含变量 `h^(⟨t-1⟩)`\
  \ 的梯度。计算过程如图 7-21 所示。\n\n因为时刻 t 的输出 `f^(⟨t⟩)` 只对时刻 t 的损失 `ℒ^(⟨t⟩)` 有贡献，即只有 `ℒ^(⟨t⟩)`\
  \ 依赖于它。因此，总损失函数 `ℒ` 关于 `f^(⟨t⟩)` 的梯度 `$\\\\frac{\\\\partial\\\\mathcal{L}}{\\\\\
  partial f^{\\\\langle t\\\\rangle}}$` 就是 `$\\\\frac{\\\\partial\\\\mathcal{L}^{\\\
  \\langle t\\\\rangle}}{\\\\partial f^{\\\\langle t\\\\rangle}}$`。该梯度可以根据具体的损失函数类型，通过时刻\
  \ t 的输出 `f^(⟨t⟩)` 和目标值 `y^(⟨t⟩)` 得到。\n\n注意模型参数 `W[f]`、`W[h]`、`W[x]` 在所有时刻是共享的，例如对于模型参数\
  \ `W[f]`，总损失函数关于它的梯度是所有时刻损失函数关于它的梯度之和，即：\n\n$\\\\frac{\\\\partial\\\\mathcal{L}}{\\\
  \\partial W\\_{f}} = \\\\sum\\\\limits\\_{t = 1}^{n}\\\\frac{\\\\partial\\\\mathcal{L}^{\\\
  \\langle t\\\\rangle}}{\\\\partial W\\_{f}}$\n\n`ℒ^(⟨t⟩)` 是预测值 `f^(⟨t⟩)` 和真实值 `y^(⟨t⟩)`\
  \ 此时的误差，即 `ℒ^(⟨t⟩)` 依赖于 `f^(⟨t⟩)`，`f^(⟨t⟩)` 依赖于 `z[f]^(⟨t⟩)`，`z[f]^(⟨t⟩)` 依赖于 `W[f]`，于是时刻\
  \ t 的损失 `ℒ^(⟨t⟩)` 关于模型参数 `W[f]` 的梯度是：\n\n$\\\\frac{\\\\partial\\\\mathcal{L}^{\\\
  \\langle t\\\\rangle}}{\\\\partial W\\_{f}} = \\\\frac{\\\\partial\\\\mathcal{L}^{\\\
  \\langle t\\\\rangle}}{\\\\partial z\\_{f}^{\\\\langle t\\\\rangle}} \\\\cdot \\\
  \\frac{\\\\partial z\\_{f}^{\\\\langle t\\\\rangle}}{\\\\partial W\\_{f}} = {h^{\\\
  \\langle t\\\\rangle}}^{T}\\\\frac{\\\\partial\\\\mathcal{L}^{\\\\langle t\\\\rangle}}{\\\
  \\partial z\\_{f}^{\\\\langle t\\\\rangle}} = {h^{\\\\langle t\\\\rangle}}^{T}\\\
  \\frac{\\\\partial\\\\mathcal{L}^{\\\\langle t\\\\rangle}}{\\\\partial f^{\\\\langle\
  \ t\\\\rangle}}g\\_{o}^{\\\\prime}(z\\_{f}^{\\\\langle t\\\\rangle})$\n\n通过累加所有时刻损失函数关于模型参数\
  \ `W[f]` 的梯度，得到总损失函数关于 `W[f]` 的梯度：\n\n$\\\\frac{\\\\partial\\\\mathcal{L}}{\\\\\
  partial W\\_{f}} = \\\\sum\\\\limits\\_{t = 1}^{n}\\\\frac{\\\\partial\\\\mathcal{L}^{\\\
  \\langle t\\\\rangle}}{\\\\partial z\\_{f}^{\\\\langle t\\\\rangle}} \\\\cdot \\\
  \\frac{\\\\partial z\\_{f}^{\\\\langle t\\\\rangle}}{\\\\partial W\\_{f}} = \\\\\
  sum\\\\limits\\_{t = 1}^{n}{h^{\\\\langle t\\\\rangle}}^{T}\\\\frac{\\\\partial\\\
  \\mathcal{L}^{\\\\langle t\\\\rangle}}{\\\\partial f^{\\\\langle t\\\\rangle}}g\\\
  _{o}^{\\\\prime}(z\\_{f}^{\\\\langle t\\\\rangle})$\n\n如何求 `$\\\\frac{\\\\partial\\\
  \\mathcal{L}}{\\\\partial h^{\\\\langle t\\\\rangle}}$`？\n\n时刻 t 输出的隐藏状态 `h^(⟨t⟩)`\
  \ 一方面输出给 `f^(⟨t⟩)`，另一方面作为输入，即不仅通过 `f^(⟨t⟩)` 影响当前时刻 t 的损失 `ℒ^(⟨t⟩)`，还作为下一时刻的隐藏状态输入影响所有后续时刻的损失\
  \ `ℒ^((t'))`、`t' > t`。因此，损失函数关于 `h^(⟨t⟩)` 的梯度可以分两部分求取：\n\n$\\\\frac{\\\\partial\\\
  \\mathcal{L}}{\\\\partial h^{\\\\langle t\\\\rangle}} = \\\\frac{\\\\partial\\\\\
  mathcal{L}^{\\\\langle t - \\\\rangle}}{\\\\partial h^{\\\\langle t\\\\rangle}}\
  \ = \\\\frac{\\\\partial\\\\mathcal{L}^{\\\\langle t\\\\rangle}}{\\\\partial h^{\\\
  \\langle t\\\\rangle}} + \\\\frac{\\\\partial\\\\mathcal{L}^{\\\\langle t + 1 -\
  \ \\\\rangle}}{\\\\partial h^{\\\\langle t\\\\rangle}} = \\\\frac{\\\\partial\\\\\
  mathcal{L}^{\\\\langle t\\\\rangle}}{\\\\partial z^{\\\\langle t\\\\rangle}} \\\\\
  cdot \\\\frac{\\\\partial z^{\\\\langle t\\\\rangle}}{\\\\partial h^{\\\\langle\
  \ t\\\\rangle}} + \\\\frac{\\\\partial\\\\mathcal{L}^{\\\\langle t + 1 - \\\\rangle}}{\\\
  \\partial h^{\\\\langle t\\\\rangle}} = \\\\frac{\\\\partial\\\\mathcal{L}^{\\\\\
  langle t\\\\rangle}}{\\\\partial z^{\\\\langle t\\\\rangle}} \\\\cdot W\\_{f}^{T}\
  \ + \\\\frac{\\\\partial\\\\mathcal{L}^{\\\\langle t + 1 - \\\\rangle}}{\\\\partial\
  \ h^{\\\\langle t\\\\rangle}}$\n\n其中 `ℒ^(⟨t - ⟩)` 表示 t 及其后所有时刻损失之和，即 `$\\\\mathcal{L}^{\\\
  \\langle t - \\\\rangle} = \\\\sum\\\\limits\\_{t^{\\\\prime} = t}^{n}L^{\\\\langle\
  \ t\\\\rangle}$`。`ℒ^(⟨t + 1 - ⟩)` 表示 t 之后所有后续时刻损失之和，即 `$\\\\mathcal{L}^{\\\\langle\
  \ t + 1 - \\\\rangle} = \\\\sum\\\\limits\\_{t^{\\\\prime} = t + 1}^{n}L^{\\\\langle\
  \ t\\\\rangle}$`。因为 `h^(⟨t⟩)` 对时刻 t 之前的损失没有影响，所以 `$\\\\frac{\\\\partial\\\\mathcal{L}}{\\\
  \\partial h^{\\\\langle t\\\\rangle}} = \\\\frac{\\\\partial\\\\mathcal{L}^{\\\\\
  langle t - \\\\rangle}}{\\\\partial h^{\\\\langle t\\\\rangle}}$`，而 `$\\\\frac{\\\
  \\partial\\\\mathcal{L}^{\\\\langle t + 1 - \\\\rangle}}{\\\\partial h^{\\\\langle\
  \ t\\\\rangle}}$` 是 t+1 时刻之后的损失关于时刻 t 输出的隐藏状态 `h^(⟨t⟩)` 的梯度，它在反向推导过程中来自时刻 t+1。\n\
  \n当然，`$\\\\frac{\\\\partial\\\\mathcal{L}^{\\\\langle T - \\\\rangle}}{\\\\partial\
  \ h^{\\\\langle T\\\\rangle}} = \\\\frac{\\\\partial\\\\mathcal{L}^{\\\\langle T\\\
  \\rangle}}{\\\\partial h^{\\\\langle T\\\\rangle}}$`，即最后一时刻的损失关于此时刻隐藏状态 `h^(⟨T⟩)`\
  \ 的梯度。此时：\n\n$\\\\frac{\\\\partial\\\\mathcal{L}^{\\\\langle T\\\\rangle}}{\\\\\
  partial h^{\\\\langle T\\\\rangle}} = \\\\frac{\\\\partial\\\\mathcal{L}^{\\\\langle\
  \ T\\\\rangle}}{\\\\partial z\\_{f}^{\\\\langle T\\\\rangle}} \\\\cdot W\\_{f}^{T}$\n\
  \n因为 `h^(⟨t⟩) = gh)`，已知 `$\\\\frac{\\\\partial\\\\mathcal{L}}{\\\\partial h^{\\\\\
  langle t\\\\rangle}}$`，可以得到损失函数关于 `z[h]^(⟨t⟩)` 的梯度：\n\n$\\\\frac{\\\\partial\\\\\
  mathcal{L}^{\\\\langle t - \\\\rangle}}{\\\\partial z\\_{h}^{\\\\langle t\\\\rangle}}\
  \ = \\\\frac{\\\\partial\\\\mathcal{L}}{\\\\partial z\\_{h}^{\\\\langle t\\\\rangle}}\
  \ = \\\\frac{\\\\partial\\\\mathcal{L}}{\\\\partial h^{\\\\langle t\\\\rangle}}\
  \ \\\\cdot g\\_{h}^{\\\\prime}(z\\_{h}^{\\\\langle t\\\\rangle})$\n\n进而可以得到损失函数关于模型参数\
  \ `W[h]`、`W[x]` 以及上一时刻输出的隐藏状态 `h^(⟨t-1⟩)` 的梯度。\n\n$\\\\frac{\\\\partial\\\\mathcal{L}^{\\\
  \\langle t - \\\\rangle}}{\\\\partial h^{\\\\langle t - 1\\\\rangle}} = \\\\frac{\\\
  \\partial\\\\mathcal{L}}{\\\\partial z\\_{h}^{\\\\langle t\\\\rangle}} \\\\cdot\
  \ \\\\frac{\\\\partial z\\_{h}^{\\\\langle t\\\\rangle}}{\\\\partial h^{\\\\langle\
  \ t - 1\\\\rangle}} = \\\\frac{\\\\partial\\\\mathcal{L}^{\\\\langle t\\\\rangle}}{\\\
  \\partial z\\_{h}^{\\\\langle t\\\\rangle}} \\\\cdot W\\_{h}^{T}$\n\n$\\\\frac{\\\
  \\partial\\\\mathcal{L}}{\\\\partial W\\_{h}} = \\\\sum\\\\limits\\_{t = 1}^{n}\\\
  \\frac{\\\\partial\\\\mathcal{L}^{\\\\langle t - \\\\rangle}}{\\\\partial z\\_{h}^{\\\
  \\langle t\\\\rangle}} \\\\cdot \\\\frac{\\\\partial z\\_{h}^{\\\\langle t\\\\rangle}}{\\\
  \\partial W\\_{h}} = \\\\sum\\\\limits\\_{t = 1}^{n}{h^{\\\\langle t - 1\\\\rangle}}^{T}\\\
  \\frac{\\\\partial\\\\mathcal{L}^{\\\\langle t - \\\\rangle}}{\\\\partial z\\_{h}^{\\\
  \\langle t\\\\rangle}}$\n\n$\\\\frac{\\\\partial\\\\mathcal{L}}{\\\\partial W\\\
  _{x}} = \\\\sum\\\\limits\\_{t = 1}^{n}\\\\frac{\\\\partial\\\\mathcal{L}^{\\\\\
  langle t - \\\\rangle}}{\\\\partial z\\_{h}^{\\\\langle t\\\\rangle}} \\\\cdot \\\
  \\frac{\\\\partial z\\_{h}^{\\\\langle t\\\\rangle}}{\\\\partial W\\_{x}} = \\\\\
  sum\\\\limits\\_{t = 1}^{n}{x^{\\\\langle t\\\\rangle}}^{T}\\\\frac{\\\\partial\\\
  \\mathcal{L}^{\\\\langle t - \\\\rangle}}{\\\\partial z\\_{h}^{\\\\langle t\\\\\
  rangle}}$\n\n假设 RNN 只有一个隐藏层，`f^(⟨t⟩)` 是时刻 t 的输出，`y^(⟨t⟩)` 是时刻 t 的真实值。对于多分类问题，`y^(⟨t⟩)`\
  \ 可以是真实分类对应的类别整数，则时刻 t 的多分类交叉熵损失 `L^(⟨t⟩)` 关于其输出值 `z^(⟨t⟩)` 的梯度 dz 为：\n\n\n\n\n\
  ## 7.4 单层循环神经网络的实现\n\n### 7.4.1 初始化模型参数\n\n循环神经网络沿时间维度计算序列数据。如果在任意时刻 `t`，输入 `x^(⟨t⟩)`\
  \ 是一个长度为 `input_dim` 的向量，单层神经网络的神经元数量为 `hidden_dim`，输出 `f^(⟨t⟩)` 是一个长度为 `output_dim`\
  \ 的向量，则可以使用以下函数 `rnn_params_init()` 来初始化网络的模型参数。\n\n```python\nimport numpy as np\n\
  \nnp.random.seed(1)\n\ndef rnn_params_init(input_dim, hidden_dim, output_dim, scale=0.01):\n\
  \    Wx = np.random.randn(input_dim, hidden_dim) * scale  # 输入到隐藏层\n    Wh = np.random.randn(hidden_dim,\
  \ hidden_dim) * scale  # 隐藏层到隐藏层\n    bh = np.zeros((1, hidden_dim))  # 隐藏层偏置\n\
  \    Wf = np.random.randn(hidden_dim, output_dim) * scale  # 隐藏层到输出\n    bf = np.zeros((1,\
  \ output_dim))  # 输出偏置\n    return [Wx, Wh, bh, Wf, bf]\n```\n\n除了模型参数外，还需要初始化 RNN\
  \ 网络的隐藏状态向量 `h`。一个输入样本 `x` 对应一个隐藏状态向量 `h`。训练模型时，如果输入一批样本 `X = (x¹, x², ..., x^(m))^T`，它将对应一批隐藏状态向量\
  \ `H = (h¹, h², ..., h^(m))^T`。以下函数用于初始化一批样本的隐藏状态向量 `H`：\n\n```python\ndef rnn_hidden_state_init(batch_dim,\
  \ hidden_dim):\n    return np.zeros((batch_dim, hidden_dim))\n```\n\n### 7.4.2 前向计算\n\
  \n循环神经网络是一个在时间维度上顺序处理序列数据的过程。训练循环神经网络时，通常使用一序列数据进行训练。如果使用批量梯度下降法，训练模型的序列数据长度为 `T`，则在\
  \ `t = 0, 1, ..., T-1` 每个时刻都会有一批样本。如果用 `Xs` 表示序列数据，每个时刻 `t` 的数据用 `Xs[t]` 表示，则以下函数从时刻\
  \ `t=0` 顺序计算到最后一个时刻 `t = len(Xs)-1` 每个时刻的隐藏状态 `Hs[t]` 和输出值 `Fs[t]`。\n\n```python\n\
  def rnn_forward(params, Xs, H_):\n    Wx, Wh, bh, Wf, bf = params\n    H = H_  #\
  \ np.copy(H_)\n    Fs = []\n    Hs = {}\n    Hs[-1] = np.copy(H)\n    for t in range(len(Xs)):\n\
  \        X = Xs[t]\n        H = np.tanh(np.dot(X, Wx) + np.dot(H, Wh) + bh)\n  \
  \      F = np.dot(H, Wf) + bf\n        Fs.append(F)\n        Hs[t] = H\n    return\
  \ Fs, Hs\n```\n\n其中 `params` 是模型参数，`H_` 是 `t=0` 时的隐藏状态输入（通常初始值为 0）。\n\n假设每个序列元素是一个一维向量，则\
  \ `Xs` 是一个三维张量，即有 3 个轴分别代表序列长度、批量大小和输入数据长度。如图 7-22 所示，\n\n**图 7-22** `Xs` 是一个三维张量，其三个轴分别代表序列长度\
  \ `T`、批量大小 `batch_dim` 和输入数据长度 `input_dim`。\n\n`Hs` 用字典表示。`Hs[-1]` 代表 `t=0` 时的输入状态，`Hs[t]`\
  \ 代表时刻 `t` 的输出状态。因为此时 `len(Hs) = len(Xs) + 1`，所以 `Hs[len(Hs)-2]` 是最后一个时刻 `len(Xs)-1`\
  \ 的状态。每个 `Hs[t]` 是一个二维张量，第一个轴代表批量大小，第二个轴代表状态向量长度，即 `hidden_dim`。同理，`Fs` 代表所有时刻的输出值，可以表示为三维张量或列表。每个时刻的\
  \ `Fs[t]` 是一个二维张量，第一个轴代表批量大小，第二个轴代表输出向量的大小，即 `output_dim`。\n\n每个时刻的前向计算过程可以写成一个单独的函数\
  \ `rnn_forward_step()`：\n\n```python\ndef rnn_forward_step(params, X, preH):\n \
  \   Wx, Wh, bh, Wf, bf = params\n    H = np.tanh(np.dot(X, Wx) + np.dot(preH, Wh)\
  \ + bh)\n    F = np.dot(H, Wf) + bf\n    return F, H\n```\n\n其中，`X` 是某一时刻的输入，`preH`\
  \ 是上一时刻的隐藏状态，它们都是二维张量。所有时刻的前向计算过程可以写成函数 `rnn_forward_()`：\n\n```python\ndef rnn_forward_(params,\
  \ Xs, H_):\n    Wx, Wh, bh, Wf, bf = params\n    H = H_\n    Fs = []\n    Hs = {}\n\
  \    Hs[-1] = np.copy(H)\n    for t in range(len(Xs)):\n        X = Xs[t]\n    \
  \    F, H = rnn_forward_step(params, X, H)\n        Fs.append(F)\n        Hs[t]\
  \ = H\n    return Fs, Hs\n```\n\n### 7.4.3 损失函数\n\n根据输出值 `Fs` 和目标值 `Ys`，可以计算模型的损失。如果这是一个同步多对多循环神经网络，则需要计算每个时刻\
  \ `t` 的损失 `L[t]`，所有时刻的累积损失即为总损失 $\\mathcal{L} = \\sum_{t=1}^{T} \\mathcal{L}_t$。\n\
  \n根据问题不同，损失 `L[t]` 可以是回归问题的均方误差损失，也可以是分类问题的交叉熵损失。以下函数 `rnn_loss_grad()` 使用传入的函数对象参数\
  \ `loss_fn()` 来计算每个时刻的损失 `loss_t` 以及损失相对于输出 `Fs[i]` 的梯度 `dF_t`。并将所有时刻的梯度放在字典变量 `dFs`\
  \ 中。\n\n```python\nimport util\n\ndef rnn_loss_grad(Fs, Ys, loss_fn=util.loss_gradient_softmax_crossentropy,\
  \ flatten=True):\n    loss = 0\n    dFs = {}\n    for t in range(len(Fs)):\n   \
  \     F = Fs[t]\n        Y = Ys[t]\n        if flatten and Y.ndim >= 2:\n      \
  \      Y = Y.flatten()\n        loss_t, dF_t = loss_fn(F, Y)\n        loss += loss_t\n\
  \        dFs[t] = dF_t\n    return loss, dFs\n```\n\n\n\n\n默认的 `loss_fn` 是一个多分类交叉熵函数。在多分类问题中，`Y`\
  \ 通常是一个由整数表示的分类。如果 `Y` 是二维张量，则需要将其展平为一维张量，以正确计算交叉熵损失。参数 `flatten` 默认为 `True`，表示将\
  \ `Y` 展平为一维张量。\n\n### 7.4.4 反向推导\n\n利用每一时刻损失函数关于该时刻输出 `Z` 的梯度 `dZ`，通过反向推导过程，可以得到该时刻损失函数关于隐藏状态\
  \ `H[t]` 和模型参数的梯度。下面的 `backward()` 函数用于计算这些梯度，它接受模型参数 `params`、输入数据序列 `Xs`、隐藏状态\
  \ `Hs` 以及损失函数关于输出的梯度 `dZs`。\n\n```python\nimport math\n\ndef grad_clipping(grads,\
  \ alpha):\n    norm = math.sqrt(sum((grad ** 2).sum() for grad in grads))\n    if\
  \ norm > alpha:\n        ratio = alpha / norm\n        for i in range(len(grads)):\n\
  \            grads[i] *= ratio\n\ndef rnn_backward(params, Xs, Hs, dZs, clip_value=5.):\
  \  # Ys, loss_function):\n    Wx, Wh, bh, Wf, bf = params\n    dWx, dWh, dWf = np.zeros_like(Wx),\
  \ np.zeros_like(Wh), np.zeros_like(Wf)\n    dbh, dbf = np.zeros_like(bh), np.zeros_like(bf)\n\
  \    dh_next = np.zeros_like(Hs[0])\n    h = Hs\n    x = Xs\n    T = len(Xs)  #\
  \ 序列长度（时间长度）\n    for t in reversed(range(T)):\n        dZ = dZs[t]\n        dWf\
  \ += np.dot(h[t].T, dZ)\n        dbf += np.sum(dZ, axis=0, keepdims=True)\n    \
  \    dh = np.dot(dZ, Wf.T) + dh_next\n        dZh = (1 - h[t] * h[t]) * dh\n   \
  \     dbh += np.sum(dZh, axis=0, keepdims=True)\n        dWx += np.dot(x[t].T, dZh)\n\
  \        dWh += np.dot(h[t-1].T, dZh)\n        dh_next = np.dot(dZh, Wh.T)\n   \
  \ grads = [dWx, dWh, dbh, dWf, dbf]\n    if clip_value is not None:\n        grad_clipping(grads,\
  \ clip_value)\n    return grads\n```\n\n由于循环网络随时间展开，类似于深度神经网络，会出现梯度爆炸和梯度消失问题。为了解决梯度爆炸问题，可以使用梯度裁剪方法防止梯度爆炸。如上述代码\
  \ `backward()` 函数所示，在最后对梯度进行裁剪 `grad_clipping(grads, 5.)`。\n\n同样，每一时刻的反向推导可以写成单独的函数\
  \ `rnn_backward_step()`：\n\n```python\ndef rnn_backward_step(params, dZ, X, H, H_,\
  \ dh_next):\n    Wx, Wh, bh, Wf, bf = params\n    dWf = np.dot(H.T, dZ)\n    dbf\
  \ = np.sum(dZ, axis=0, keepdims=True)\n    dh = np.dot(dZ, Wf.T) + dh_next\n   \
  \ dZh = (1 - H * H) * dh\n    dbh = np.sum(dZh, axis=0, keepdims=True)\n    dWx\
  \ = np.dot(X.T, dZh)\n    dWh = np.dot(H_.T, dZh)\n    dh_next = np.dot(dZh, Wh.T)\n\
  \    return dWx, dWh, dbh, dWf, dbf, dh_next\n```\n\n对序列数据进行反向微分的函数可以调用这个单时刻反向微分函数：\n\
  \n```python\ndef rnn_backward_(params, Xs, Hs, dZs, clip_value=5.):\n    Wx, Wh,\
  \ bh, Wf, bf = params\n    dWx, dWh, dWf = np.zeros_like(Wx), np.zeros_like(Wh),\
  \ np.zeros_like(Wf)\n    dbh, dbf = np.zeros_like(bh), np.zeros_like(bf)\n    dh_next\
  \ = np.zeros_like(Hs[0])\n    T = len(Xs)  # 序列长度（时间长度）\n    for t in reversed(range(T)):\n\
  \        dZ = dZs[t]\n        H = Hs[t]\n        H_ = Hs[t-1]\n        X = Xs[t]\n\
  \        dWx_, dWh_, dbh_, dWf_, dbf_, dh_next = rnn_backward_step(params, dZ, X,\
  \ H, H_, dh_next)\n        for grad, grad_t in zip([dWx, dWh, dbh, dWf, dbf], [dWx_,\
  \ dWh_, dbh_, dWf_, dbf_]):\n            grad += grad_t\n    grads = [dWx, dWh,\
  \ dbh, dWf, dbf]\n    if clip_value is not None:\n        grad_clipping(grads, clip_value)\n\
  \    return grads\n```\n\n### 7.4.5 梯度验证\n\n为了验证反向推导是否正确，可以定义一个简单的 RNN 模型，并使用一组测试样本比较解析梯度和数值梯度。以下代码针对输入层、隐藏层和输出层大小分别为\
