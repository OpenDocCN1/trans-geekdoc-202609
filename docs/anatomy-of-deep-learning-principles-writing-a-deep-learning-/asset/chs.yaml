  \n在迭代过程中，梯度值越来越小，相同的学习率导致 `x` 的更新非常缓慢。即使经过 100,000 次迭代，仍无法逼近最优解。一种自然的方法是使用自适应学习率，即当梯度变小时增大学习率。作为练习，读者可以尝试修改梯度下降算法，以更好、更快地到达最优解。\n\
  \n## 2.3 梯度下降法的参数优化策略\n\n基础梯度下降算法中的学习率是一个固定值，而在迭代过程中梯度大小不断变化。如果学习率过大，待求变量会来回震荡；如果学习率过小，收敛会非常缓慢甚至停滞。初始学习率适中，但随着收敛逼近最优解，其梯度也接近\
  \ 0，这也会导致停滞。因此，学习率应在迭代逐渐收敛的过程中进行调整，即使用变化的学习率在迭代过程中更新待求变量 `x`。\n\n为了能更好、更快地逼近最优解，针对梯度下降法提出了许多改进。这些改进采用变化的学习率或策略来更新解变量（也称为参数）。变量（参数）的更新策略或方法包括：Momentum（动量法）、Nesterov\
  \ 加速梯度、Adagrad、Adadelta、RMSprop、Adam、AdaMax、Nadam、AMSGrad 等。\n\n需要注意的是，函数可能是多元函数；因此，其变量\
  \ `x` 可以是由多个值组成的向量 `xx`。下面仅介绍一些常用的优化策略。\n\n### 2.3.1 Momentum 动量法\n\n梯度下降法使用学习率\
  \ `α` 和梯度的负方向，即 `−α∇f(x)` 来每次更新 `x`。更新向量 `−α∇f(x)ofx` 完全取决于当前计算出的梯度。Momentum 动量法更新\
  \ `x` 的向量不仅考虑当前梯度，还考虑上一次的更新向量；即认为更新向量具有惯性。假设 `v[t−1]` 是上一次用于更新的向量，则当前更新向量为：\n\n\
  `v[t] = γv[t−1] + α∇f(x)`\n\n用此 `v` 更新 `x`：\n\n`x = x − v[t]`\n\n这个用于更新 `x` 的向量称为**动量**。动量法将更新向量视为运动物体的速度，速度具有惯性。由于结合了之前的更新向量和当前梯度，它缓解了不同时间梯度的剧烈变化，使更新向量更平滑；即保持之前运动的惯性，使得在梯度较小的地方仍有较大的运动量。速度不会因梯度的突然增大而超调。这种方法就像一个有重量的球滚下山坡，在寻找最陡峭下降路径的同时保持一定的惯性。普通梯度下降仅根据陡峭程度决定移动速度，就像在陡峭处冲得快、在平坦处几乎不动。\n\
  \n`vv` 的初始值为 0，用 Python 代码表示为：\n\n```python\nv = np.zeros_like(x)\n```\n\n即 `vv`\
  \ 是一个与 `xx` 形状相同、初始值为 0 的张量。在迭代过程中，先更新 `vv`，再更新函数的参数 `xx`：\n\n```python\nv = gamma\
  \ * v + alpha * df(x)\nx = x - v\n```\n\n以下是基于动量法的梯度下降法：\n\n```python\ndef gradient_descent_momentum(df,\
  \ x, alpha=0.01, gamma=0.8, iterations=100, epsilon=1e-6):\n    history = [x]\n\
  \    v = np.zeros_like(x)            # momentum\n    for i in range(iterations):\n\
  \        if np.max(np.abs(df(x))) < epsilon:\n            print(\"The gradient is\
  \ small enough!\")\n            break\n        v = gamma * v + alpha * df(x)   \
  \        # update momentum\n        x = x - v                    # Update variables\
  \ (parameters)\n        \n        history.append(x)\n    return history\n```\n\n\
  使用这种动量法的梯度下降法求解上述问题：\n\n```python\npath = gradient_descent_momentum(df, x0, 0.000005,\
  \ 0.8, 300000)\nprint(path[-1])\npath = np.asarray(path)\n```\n\n`[2.96324633 0.49067782]`\n\
  \n可以看出，动量法的解非常接近最优解，如图所示。\n\n```python\nplot_path(path, x, y, z, minima_, xmin,\
  \ xmax, ymin, ymax)\n```\n\n![](img/file31.png \"fig:\")\n\n图 2-11 动量法快速收敛到近似最优解\n\
  \n### 2.3.2 Adagrad 方法\n\n根据梯度下降法的变量更新公式 `xx = xx − α∇f(xx)`，影响变量更新的是学习率与梯度的乘积 `α∇f(xx)`。梯度过大或过小、学习率过大或过小都会影响算法的收敛。\n\
  \n对于多元函数，每个变量的偏导数大小可能差异很大。例如，两个变量函数 `f(x[1], x[2])` 在某点 `(x[1], x[2])` 处的偏导数 $\\\
  frac{\\partial f}{\\partial x_{1}},\\frac{\\partial f}{\\partial x_{2}}$ 绝对值可能相差很大。对它们使用相同的学习率是不合适的。对某个分量合适的学习率，对另一个分量可能过大或过小，导致震荡和停滞。即直接用以下公式更新是不合适的：\n\
  \n$x_{1} = x_{1} - \\alpha\\frac{\\partial f}{\\partial x_{1}}$\n\n$x_{2} = x_{2}\
  \ - \\alpha\\frac{\\partial f}{\\partial x_{2}}$\n\nAdagrad 方法从名词可译为“自适应梯度”，它将每个梯度分量除以该梯度分量的历史累积值，从而消除不同分量梯度大小不平衡的问题。对于\
  \ 2 个分量 `(x[1], x[2])`，若分别计算各自分量的历史累积值 `(G[1], G[2])`，则 2 个分量的更新公式为：\n\n$x_{1} =\
  \ x_{1} - \\alpha\\frac{1}{G_{1}}\\frac{\\partial f}{\\partial x_{1}}$\n\n\n\n\n\
  $x\\_{2} = x\\_{2} - \\\\alpha\\\\frac{1}{G\\_{2}}\\\\frac{\\\\partial f}{\\\\partial\
  \ x\\_{2}}$\n\n使用符号 *g*[*t*, *i*] = ∇[*θ*]*f*(*x*[*t*, *i*]) 来表示第 *t* 次迭代中分量 *x*[*i*]\
  \ 的偏导数 $\\\\frac{\\\\partial f}{\\\\partial x\\_{i}}$，从 `t'=1` 到 `t'=t` 所有轮次的分量梯度可以按如下方式计算：\n\
  \n$G\\_{t,i} = \\\\sqrt{\\\\sum\\\\limits\\_{t^{\\\\prime} = 1}^{t}g\\_{t^{\\\\\
  prime},i}^{2}}$\n\n将 *g*[*t*, *i*] 除以 *G*[*t*, *i*] 以更新分量：\n\n$x\\_{t + 1,i} = x\\\
  _{t,i} - \\\\alpha\\\\frac{1}{\\\\sqrt{\\\\sum\\\\limits\\_{t^{\\\\prime} = 1}^{t}g\\\
  _{t^{\\\\prime},i}^{2}}}g\\_{t,i}$\n\n为了防止除数为 0，可以在该分母中加入一个很小的正数 *ϵ*，从而得到 AdaGrad\
  \ 的参数更新公式：\n\n$x\\_{t + 1,i} = x\\_{t,i} - \\\\alpha\\\\frac{1}{\\\\sqrt{\\\\sum\\\
  \\limits\\_{t^{\\\\prime} = 1}^{t}g\\_{t^{\\\\prime},i}^{2}} + \\\\epsilon}g\\_{t,i}$\n\
  \n对比基本参数更新公式：\n\n*x*[*t* + 1, *i*] = *x*[*t*, *i*] − *α**g*[*t*, *i*]\n\n可以看出，AdaGrad\
  \ 方法消除了分量梯度大小不平衡的问题。AdaGrad 的参数更新公式可以写成向量形式：\n\n$x x\\_{t + 1} = x x\\_{t} - \\\\\
  alpha\\\\frac{1}{\\\\sqrt{\\\\sum\\\\limits\\_{t^{\\\\prime} = 1}^{t}{g g\\_{t^{\\\
  \\prime}}^{2}}} + \\\\epsilon} \\\\odot g g\\_{t}$\n\n累积的 *G*[*t*]² 可以用初始值为 0 的变量\
  \ `gl` 来记录。在每一轮迭代中，AdaGrad 参数更新的 Python 代码如下：\n\n```\ngl += df(x)**2\nx = x-alpha*\
  \ df(x)/(sqrt(gl)+epsilon)\n```\n\nAdaGrad 方法的主要优点是消除了不同梯度值的影响，使得学习率可以设置为固定值，而无需在迭代过程中不断调整学习率。一般学习率设置为\
  \ 0.01。AdaGrad 方法的主要缺点是随着迭代过程的进行，累积和 $\\\\sum\\\\limits\\_{t^{\\\\prime} = 1}^{t}{g\
  \ g\\_{t^{\\\\prime}}^{2}}$ 会变得越来越大，因为它们每一个都是正数。这可能导致学习变慢，甚至停滞。此外，让每个分量梯度都保持一致的步伐可能不切实际，并会使前进方向偏离最优解的方向。\n\
  \n基于 Adagrad 参数更新方法的梯度下降法代码如下：\n\n```\ndef gradient_descent_Adagrad(df,x,alpha=0.01,iterations\
  \ = 100,epsilon = 1e-8):\n    history=[x]\n    #v= np.zeros_like(x) \n    gl = np.ones_like(x)\n\
  \    for i in range(iterations):\n        if np.max(np.abs(df(x)))<epsilon:\n  \
  \          print(\"The gradient is small enough!\")\n            break\n       \
  \ grad = df(x)\n        gl += grad**2\n        x = x-alpha* grad/(np.sqrt(gl)+epsilon)\
  \      \n        history.append(x)\n    return history\n```\n\n对上述问题执行梯度下降算法：\n\n\
  ```\npath = gradient_descent_Adagrad(df,x0,0.1,300000,1e-8)\nprint(path[-1])\npath\
  \ = np.asarray(path) \n```\n\n\\[-0.69240717 1.76233766\\]\n\n可以看出，由于分量梯度的均衡化，变量更新的前进方向偏离了最优解方向，并收敛到了另一个局部最优解。\n\
  \n```\nplot_path(path,x,y,z,minima_,xmin, xmax,ymin, ymax)\n```\n\n![](img/file32.png\
  \ \"fig:\")  \n\n图 2-12 Adagrad 方法收敛到另一个局部最小值\n\n### 2.3.3 Adadelta 方法\n\n回顾基本参数更新方法，用\
  \ *Δ**x**x*[*t*] 表示参数的更新向量：\n\n$\\\\begin{matrix} \\\\begin{matrix} {\\\\Delta x\
  \ x\\_{t}} & {= - \\\\eta \\\\cdot g g\\_{t}} \\\\\\\\ {x x\\_{t + 1}} & {= x x\\\
  _{t} + \\\\Delta x x\\_{t}} \\\\\\\\ \\\\end{matrix} \\\\\\\\ \\\\end{matrix}$\n\
  \nAdaGrad 方法的更新向量为：\n\n$\\\\Delta x x\\_{t} = - \\\\frac{\\\\eta}{\\\\sqrt{G\\_{t}\
  \ + \\\\epsilon}} \\\\odot g g\\_{t}$\n\n此处 *G*[*t*] = ∑*g**g*[*t*]² 是 *g*[*t*]\
  \ 历史上平方和。随着迭代过程的进行，该值 *G*[*t*] 越来越大，导致 *Δ**x**x*[*t*] 越来越小，从而收敛越来越慢。解决方法是用均方和 $E\\\
  \\lbrack g^{2}\\\\rbrack\\_{t} = \\\\frac{G\\_{t}}{t}$ 代替平方和 *G*[*t*]。这个 *E*\\[*g*²\\\
  ][*t*] 可以用移动平均法来计算，即对上一次的平均值和当前值取平均：\n\n*E*\\[*g*²\\][*t*] = *γ**E*\\[*g*²\\][*t* − 1] + (1 − *γ*)*g*[*t*]²\n\
  \nAdadelta 方法更进一步，对更新向量也使用这种移动平均法，使更新向量的变化更加平滑。\n\n*E*\\[*Δ**x**x*²\\][*t*] = *γ**E*\\\
  [*Δ**x**x*²\\][*t* − 1] + (1 − *γ*)*Δ**x**x*[*t*]²\n\n最终的更新向量为：\n\n$\\\\Delta x\
  \ x\\_{t} = - \\\\sqrt{\\\\frac{E\\\\lbrack\\\\Delta x x^{2}\\\\rbrack\\_{t - 1}\
  \ + \\\\epsilon}{E\\\\lbrack g^{2}\\\\rbrack\\_{t} + \\\\epsilon}}g\\_{t}$\n\n用\
  \ *R**M**S*\\[*Δ**x**x*\\][*t* − 1], *R**M**S*\\[*g*\\][*t*] 分别表示 *E*\\[*Δ**x**x*²\\\
  ][*t* − 1] + *ϵ* 和 *E*\\[*g*²\\][*t*] + *ϵ*，更新向量可以表示为：\n\n$\\\\Delta x x\\_{t} =\
  \ - \\\\sqrt{\\\\frac{RMS\\\\lbrack\\\\Delta x x\\\\rbrack\\_{t - 1}}{RMS\\\\lbrack\
  \ g\\\\rbrack\\_{t}}}g\\_{t}$\n\n因此参数更新公式为：\n\n*x**x*[*t* + 1] = *x**x*[*t*] + *α**Δ**x**x*[*t*]\n\
  \nAdadelta 方法的 Python 代码如下：\n\n```\nEg = rho*Eg+(1-rho)*(grad**2)              \
  \  # 更新梯度平方的累积和\ndelta = np.sqrt((Edelta+epsilon)/(Eg+epsilon))*grad  # 计算更新向量\n\
  x = x - alpha* delta\nEdelta = rho*Edelta+(1-rho)*(delta**2)       # 更新向量的累积更新\n\
  ```\n\nAdadelta 方法的衰减率参数 *ρ* 通常设置为 0.9，*Δ**x**x*[*t*], *E*\\[*Δ**x**x*²\\][*t*], *E*\\\
  [*g*²\\][*t*] 的初始值也为 0。基于 Adadelta 参数更新方法的梯度下降法代码如下：\n\n```\ndef gradient_descent_Adadelta(df,x,alpha\
  \ = 0.1,rho=0.9,iterations = 100,epsilon = 1e-8):\n    history=[x]    \n    Eg =\
  \ np.ones_like(x)\n    Edelta = np.ones_like(x)   \n    for i in range(iterations):\n\
  \        if np.max(np.abs(df(x)))<epsilon:\n            print(\"The gradient is\
  \ small enough!\")\n            break\n        grad = df(x)\n        Eg = rho*Eg+(1-rho)*(grad**2)\
  \        \n        delta = np.sqrt((Edelta+epsilon)/(Eg+epsilon))*grad\n       \
  \ x = x- alpha*delta\n        Edelta = rho*Edelta+(1-rho)*(delta**2)     \n    \
  \    history.append(x)\n    return history\n```\n\n```\npath = gradient_descent_Adadelta(df,x0,1.0,0.9,300000,1e-8)\n\
  print(path[-1])\npath = np.asarray(path) \n```\n\n```\n[2.9386002 0.45044889]\n\
  ```\n\n可以看出，Adadelta 方法也能收敛到接近最优解的位置。\n\n```\nplot_path(path,x,y,z,minima_,xmin,\
  \ xmax,ymin, ymax)\n```\n\n![](img/file33.png \"fig:\")  \n\n图 2-13 Adadelta 方法也能收敛到接近最优解的位置\n\
  \n### 2.3.4 RMSprop 方法\n\n与动量法类似，RMSprop 使用以下公式更新动量和参数：\n\n*v*[*t*] = *β**v*[*t* − 1] + (1 − *β*)∇*f*(*x*)²\
  \  \n\n$x = x - \\\\alpha\\\\frac{1}{\\\\sqrt{v\\_{t}} + \\\\epsilon}\\\\nabla f(x)$\n\
  \n其思路是将梯度的每个值除以其长度（即值的绝对值），也就是将其转换为单位长度，从而使参数 *x* 始终以固定步长 *α* 进行更新。为了计算梯度每个分量的长度，RMSprop\
  \ 类似于动量法，计算梯度值的移动平均长度的平方值，即 *f*(*x*)²。\n\n使用 RMSprop 方法更新模型参数的 Python 代码如下：\n\n\
  ```\nv= np.ones_like(x)\n#...\ngrad = df(x)\nv = beta*v+(1-beta)* grad**2\nx = x-alpha*(1/(np.sqrt(v)+epsilon))*grad\n\
  ```\n\n基于 RMSprop 参数更新方法的梯度下降法代码如下：\n\n\n\n\n#### RMSprop 方法示例\n\n```python\ndef\
  \ gradient_descent_RMSprop(df, x, alpha=0.01, beta=0.9, iterations=100, epsilon=1e-8):\n\
  \    history = [x]\n    v = np.ones_like(x)\n    for i in range(iterations):\n \
  \       if np.max(np.abs(df(x))) < epsilon:\n            print(\"The gradient is\
  \ small enough!\")\n            break\n        grad = df(x)\n        v = beta *\
  \ v + (1 - beta) * grad**2\n        x = x - alpha * grad / (np.sqrt(v) + epsilon)\n\
  \        history.append(x)\n    return history\n```\n\n针对上述问题，执行梯度下降算法：\n\n```python\n\
  path = gradient_descent_RMSprop(df, x0, 0.000005, 0.99999999999, 300000, 1e-8)\n\
  print(path[-1])\npath = np.asarray(path)\n```\n\n```\n[2.70162562 0.41500366]\n\
  ```\n\n模型参数的结果不够好，可以增加迭代次数：\n\n```python\npath = gradient_descent_RMSprop(df, x0,\
  \ 0.000005, 0.99999999999, 900000, 1e-8)\nprint(path[-1])\npath = np.asarray(path)\n\
  ```\n\n```\n[2.9082809 0.47616156]\n```\n\n可以看出基本收敛接近最优解，如图 2-14 所示：\n\n```python\n\
  plot_path(path, x, y, z, minima_, xmin, xmax, ymin, ymax)\n```\n\n![](img/file34.png)\n\
  \n**图 2-14 RMSprop 方法也能基本收敛**\n\n### 2.3.5 Adam 方法\n\n除了像 RMSprop 方法那样存储过去梯度平方的指数衰减累积均值外，它还像动量法那样存储梯度的累积均值。动量法可以看作是一个球沿着斜坡滚下，但\
  \ Adam 方法表现得像一个带有摩擦力的球，因此更适合平坦的极小值。使用 `m[t]`、`v[t]` 表示过去梯度和梯度平方的移动平均：\n\n$$\n\\\
  begin{matrix} \nm_{t} & {= \\beta_{1}m_{t - 1} + (1 - \\beta_{1})g_{t}} \\\\ \n\
  v_{t} & {= \\beta_{2}v_{t - 1} + (1 - \\beta_{2})g_{t}^{2}} \\\\ \n\\end{matrix}\n\
  $$\n\n它们相当于梯度的一阶和二阶动量，因为它们的初始值为 0，Adam 的作者观察到：当衰减率较小时，例如 `β[1]`、`β[2]` 接近 1 时，它们偏向于零，尤其是在迭代的早期阶段。为了修正这个问题，作者使用了以下修正公式：\n\
  \n$$\n\\begin{matrix} \n{\\hat{m}}_{t} & {= \\frac{m_{t}}{1 - \\beta_{1}^{t}}} \\\
  \\ \n{\\hat{v}}_{t} & {= \\frac{v_{t}}{1 - \\beta_{2}^{t}}} \\\\ \n\\end{matrix}\n\
  $$\n\n基于此更新 `x`：\n\n$$\n\\theta_{t + 1} = \\theta_{t} - \\frac{\\eta}{\\sqrt{{\\\
  hat{v}}_{t}} + \\epsilon}{\\hat{m}}_{t}\n$$\n\n```python\n# https://towardsdatascience.com/adam-latest-trends-in-deep-learning-optimization-6be9a291375c\n\
  def gradient_descent_Adam(df, x, alpha=0.01, beta_1=0.9, beta_2=0.999, iterations=100,\
  \ epsilon=1e-8):\n    history = [x]\n    m = np.zeros_like(x)\n    v = np.zeros_like(x)\n\
  \    for t in range(iterations):\n        if np.max(np.abs(df(x))) < epsilon:\n\
  \            print(\"The gradient is small enough!\")\n            break\n     \
  \   grad = df(x)\n        m = beta_1 * m + (1 - beta_1) * grad\n        v = beta_2\
  \ * v + (1 - beta_2) * grad**2\n        \n        # m_1 = m/(1-beta_1)\n       \
  \ # v_1 = v/(1-beta_2) \n        t = t + 1\n        if True:\n            m_1 =\
  \ m / (1 - np.power(beta_1, t + 1))\n            v_1 = v / (1 - np.power(beta_2,\
  \ t + 1))\n        else:\n            m_1 = m / (1 - np.power(beta_1, t)) + (1 -\
  \ beta_1) * grad / (1 - np.power(beta_1, t))\n            v_1 = v / (1 - np.power(beta_2,\
  \ t))\n    \n        x = x - alpha * m_1 / (np.sqrt(v_1) + epsilon)\n        # print(x)\n\
  \        history.append(x)\n    return history\n```\n\n针对上述问题，执行梯度下降算法 `gradient_descent_Adam`：\n\
  \n```python\npath = gradient_descent_Adam(df, x0, 0.001, 0.9, 0.8, 100000, 1e-8)\n\
  # path = gradient_descent_Adam(df, x0, 0.000005, 0.9, 0.9999, 300000, 1e-8)\nprint(path[-1])\n\
  path = np.asarray(path)\n# plt.plot(path)\n```\n\n```\n[2.99999653 0.50000329]\n\
  ```\n\n```python\nplot_path(path, x, y, z, minima_, xmin, xmax, ymin, ymax)\n```\n\
  \n![](img/file35.png)\n\n**图 2-15 Adam 方法也能收敛到近似最优解**\n\n## 2.4 梯度验证\n\n### 2.4.1\
  \ 比较数值梯度与解析梯度\n\n编写梯度下降算法代码时，最容易出错的是梯度计算不正确，导致算法无法收敛。因此，除了调整学习率外，还应检查梯度计算是否正确。为此，根据导数的定义，即导数是函数的变化率，可以用以下公式估计函数在点\
  \ `x` 处的导数（梯度）：\n\n$$\n\\frac{\\partial{f(x)}}{\\partial x} = \\lim_{\\epsilon \\\
  to 0}\\frac{f(x + \\epsilon) - f(x - \\epsilon)}{2\\epsilon}\n$$\n\n即用公式右边的除法来近似\
  \ `f(x)` 在 `x` 处的导数（梯度）。如果 `ϵ` 足够小，该值的导数（梯度）应与左边的解析导数（梯度）足够接近。\n\n因此，在使用梯度下降法训练模型之前，可以比较数值计算的梯度和解析梯度，以验证解析梯度计算是否正确。\n\
  \n例如，对于前面的二元函数 $f(x,y) = \\frac{1}{16}x^{2} + 9y^{2}$，在梯度下降法中，通过以下代码计算函数在点 `x =\
  \ (x[0], x[1])` 处的函数值和解析梯度。\n\n```python\nf = lambda x: (1/16)*x[0]**2 + 9*x[1]**2\n\
  df = lambda x: np.array(((1/8)*x[0], 18*x[1]))\n```\n\n点 `x = (x[0], x[1])` 处的数值梯度可按如下方式计算：\n\
  \n```python\ndf_approx = lambda x, eps: ((f([x[0]+eps, x[1]]) - f([x[0]-eps, x[1]]))\
  \ / (2*eps), \n                            (f([x[0], x[1]+eps]) - f([x[0], x[1]-eps]))\
  \ / (2*eps))\n```\n\n以下代码片段比较点 `x = [2., 3.]` 处解析梯度和数值梯度的误差：\n\n```python\nx = [2.,\
  \ 3.]\neps = 1e-8\ngrad = df(x)\ngrad_approx = df_approx(x, eps)\nprint(grad)\n\
  print(grad_approx)\nprint(abs(grad - grad_approx))\n```\n\n```\n[ 0.25 54. ]\n \
  \   (0.2500001983207767, 54.00000020472362)\n    [1.98320777e-07 2.04723619e-07]\n\
  ```\n\n可以看出，只要计算数值梯度的微小增量 `eps` 足够小，该数值梯度就足够接近解析梯度，这正是导数的定义：数值梯度可以无限接近解析梯度。如果发现两者误差较大，则意味着解析梯度或函数值或数值梯度的计算可能有问题。大多数错误是解析梯度或函数值的计算问题。\n\
  \n在使用梯度下降法求最优解之前，应使用梯度验证方法，确保解析梯度和函数值的计算正确。在此基础上，调整梯度下降法的超参数，如学习率或动量参数。\n\n### 2.4.2\
  \ 通用数值梯度\n\n机器学习包含深度学习中的假设函数，含有大量参数，可以编写一个通用的数值梯度计算函数：\n\n\n\n\n\n```python\ndef\
  \ numerical_gradient(f, params, eps=1e-6):\n    numerical_grads = []\n    for x\
  \ in params:\n        # x may be a multidimensional array,\n        # for each element,\
  \ calculate its numerical partial derivative\n        grad = np.zeros(x.shape)\n\
  \        it = np.nditer(x, flags=['multi_index'], op_flags=['readwrite'])\n    \
  \    while not it.finished:\n            idx = it.multi_index\n            old_value\
  \ = x[idx]\n            x[idx] = old_value + eps    # x[idx]+eps\n            fx\
  \ = f()\n            x[idx] = old_value - eps    # x[idx] - eps\n            fx_\
  \ = f()\n            grad[idx] = (fx - fx_) / (2*eps)\n            x[idx] = old_value\
  \    # Note: Be sure to restore the weight parameter to its original value.\n  \
  \          it.iternext()         # Loop through the next element of x\n\n      \
  \  numerical_grads.append(grad)\n    return numerical_grads\n```\n\n该函数接受的参数 `f`\
  \ 表示要求梯度的函数，`params` 表示该函数的参数。因为 `f` 可能有多个参数，所以 `params` 表示这一组多个参数（如 Python 的 `list`、`tuple`\
  \ 等对象）。为了更通用，假设 `params` 的每个元素 `x` 是一个包含多个元素的多维数组。\n\n在内层循环中，对 `x` 的每个下标 `idx` 所指向的元素\
  \ `x[idx]`，分别加上微小增量 `x[idx] + eps` 和 `x[idx] - eps` 并计算对应的函数值 `f()`，然后利用导数的微分近似公式计算出该\
  \ `x[idx]` 对应的偏导数并赋值给 `grad[idx]`。注意：每次修改 `x[idx]` 后，必须将其还原为原值，否则会影响其他偏导数的计算，并影响退出该函数后\
  \ `params` 的值。\n\n你可以使用这个通用的数值梯度计算函数来计算前面函数的数值梯度：\n\n```python\nx = np.array([2.,\
  \ 3.])\nparam = np.array(x)        # numerical_gradient 的参数 param 必须是 numpy 数组\n\
  numerical_grads = numerical_gradient(lambda: f(param), [param], 1e-6)\nprint(numerical_grads[0])\n\
  ```\n\n```\n[ 0.25 54.00000001]\n```\n\n注意 `numerical_gradient` 的第一个参数 `f` 必须指向一个函数对象，而不是函数调用的结果。上面将\
  \ `lambda: f(param)` 写成 `f(param)` 是错误的。\n\n对于包含诸如 `param` 等参数的函数 `f`，通常可以使用上述 lambda\
  \ 表达式或下面的包装函数 `fun` 来返回一个对参数 `param` 进行计算的函数对象。\n\n```python\ndef fun():\n    return\
  \ f(param)\n\nnumerical_grads = numerical_gradient(fun, [param], 1e-6)\nprint(numerical_grads[0])\n\
  ```\n\n```\n[ 0.25 54.00000001]\n```\n\n在后续章节中，将使用这个通用的数值梯度计算函数 `numerical_gradient()`\
  \ 来计算模型函数的数值梯度。该函数及其他函数包含在本书的源代码文件 `util.py` 中。\n\n## 2.5 分离梯度下降算法与参数优化策略\n\n###\
  \ 2.5.1 参数优化器\n\n变量（参数）的优化策略在梯度下降算法中是硬编码的。不同优化策略的梯度下降法除参数更新外，具有相同的框架。为了提高代码的复用性和灵活性，可以将参数优化策略从梯度下降算法中分离出来。\n\
  \n可以定义一个表示参数优化策略的类：\n\n```python\nclass Optimizator:\n    def __init__(self, params):\n\
  \        self.params = params\n\n    def step(self, grads):\n        pass\n\n  \
  \  def parameters(self):\n        return self.params\n```\n\n`params` 是变量（参数）的列表，`step()`\
  \ 用于根据梯度 `grads` 更新这些参数 `params`。例如，在该类的基础上可以派生出定义了使用基本梯度下降法的参数优化策略的参数优化器类 `SGD`：\n\
  \n```python\nclass SGD(Optimizator):\n    def __init__(self, params, learning_rate):\n\
  \        super().__init__(params)\n        self.lr = learning_rate\n\n    def step(self,\
  \ grads):\n        for i in range(len(self.params)):\n            self.params[i]\
  \ -= self.lr * grads[i]\n        return self.params\n```\n\n类似地，可以定义其他参数优化器，如动量法的\
  \ `SGD_Momentum`：\n\n```python\nclass SGD_Momentum(Optimizator):\n    def __init__(self,\
  \ params, learning_rate, gamma):\n        super().__init__(params)\n        self.lr\
  \ = learning_rate\n        self.gamma = gamma\n        self.v = []\n        for\
  \ param in params:\n            self.v.append(np.zeros_like(param))\n\n    def step(self,\
  \ grads):\n        for i in range(len(self.params)):\n            self.v[i] = self.gamma\
  \ * self.v[i] + self.lr * grads[i]\n            self.params[i] -= self.v[i]\n  \
  \      return self.params\n```\n\n### 2.5.2 接受参数优化器的梯度下降法\n\n只要梯度下降算法接受更新参数的参数优化器，就可以根据优化器的优化策略更新参数：\n\
  \n```python\ndef gradient_descent_(df, optimizator, iterations, epsilon=1e-8):\n\
  \    x, = optimizator.parameters()\n    x = x.copy()\n    history = [x]\n    for\
  \ i in range(iterations):\n        if np.max(np.abs(df(x))) < epsilon:\n       \
  \     print(\"The gradient is small enough!\")\n            break\n        grad\
  \ = df(x)\n        x, = optimizator.step([grad])\n        x = x.copy()\n       \
  \ history.append(x)\n    return history\n```\n\n观察一个简单的凸函数曲面，\n\n$$f(x,y) = \\frac{1}{16}x^{2}\
  \ + 9y^{2}$$\n\n这是一个碗状曲面，如图 2-16 所示。其最小值位于碗底，即 `(0,0)` 是整个函数的最小值点，最小值为 0。\n\n![](img/file36.png\
  \ \"fig:\")\n\n图 2-16 函数 $f(x,y) = \\frac{1}{16}x^{2} + 9y^{2}$ 曲面\n\n对该函数应用上述 `SGD`\
  \ 参数优化器：\n\n```python\ndf = lambda x: np.array(((1/8)*x[0], 18*x[1]))\nx0 = np.array([-2.4,\
  \ 0.2])\n\noptimizator = SGD([x0], 0.1)\npath = gradient_descent_(df, optimizator,\
  \ 100)\nprint(path[-1])\npath = np.asarray(path)\npath = path.transpose()\n```\n\
  \n```\n[-8.26638332e-06 2.46046384e-98]\n```\n\n逼近最优解，切换为 `SGD_Momentum` 优化器：\n\n\
  ```python\nx0 = np.array([-2.4, 0.2])\noptimizator = SGD_Momentum([x0], 0.1, 0.8)\n\
  path = gradient_descent_(df, optimizator, 1000)\nprint(path[-1])\npath = np.asarray(path)\n\
  path = path.transpose()\n```\n\n它也能更好地逼近最优解。\n\n```\nThe gradient is small enough!\n\
  [-1.49829905e-08 -4.74284398e-10]\n```\n\n![](img/file232.png)\n\n本章介绍三种典型的机器学习技术：线性回归、逻辑回归和\
  \ Softmax 回归。它们是基于神经网络的深度学习的基础，其中的数据归一化、模型评估、正则化等概念、技术和方法也常用于深度学习。\n\n## 3.1 线性回归\n\
  \n### 3.1.1 餐车利润问题\n\nAndrew Ng 的深度学习课程中有一个“餐车利润问题”，提供了以下数据集：\n\n```\n6.1101,17.592\n\
  5.5277,9.1302\n8.5186,13.662\n7.0032,11.854\n5.8598,6.8233\n...\n```\n\n数据集的第一列是各城市的人口，第二列是该城市餐车的利润，数量单位为万。以下\
  \ Python 代码从文本文件读取数据集并输出前 5 行：\n\n```python\nx, y = [], []\nwith open('food_truck_data.txt')\
  \ as A:\n    for eachline in A:\n        s = eachline.split(',')\n        x.append(float(s[0]))\n\
  \        y.append(float(s[1]))\nfor i in range(5):\n    print(x[i], y[i])\n```\n\
  \n\n\n\n### 3.1.2 机器学习与人工智能\n\n#### 1. 机器学习\n\n“餐车利润问题”是一个经典的机器学习问题。**机器学习**是基于经验数据，发现这些数据中包含的某些统计规律，并利用学到的规律对未来的新数据进行判断或预测。\n\
  \n机器学习可以从这些（城市人口、对应餐车利润）数据中，获得一个反映两者关系或从城市人口到餐车利润的函数关系的数据模型。如果用 `x` 表示城市人口，`y` 表示餐车利润，机器学习就是寻找一个函数\
  \ `f(x)`，使得 `y` 满足 `y = f(x)`。求解这种函数关系或模型的过程称为**机器学习**或**模型训练**。有了这个数学（模型）函数 `f(x)`，就可以将新的城市人口\
  \ `x` 代入该函数 `f(x)` 中，以预测该城市的餐车利润。\n\n在机器学习中，用于训练模型的数据称为**样本数据**、**样本集**或**训练集**。样本集包含多个样本，每个样本由**样本特征**（如城市人口）和**样本标签**（如餐车利润）组成，它们分别对应学习函数\
  \ `y = f(x)` 的自变量 `x` 和因变量 `y`。样本标签通常也被称为“**真实值**”或“**目标值**”。学习模型的最终目标是根据该模型，从样本特征预测其目标值或标签。\n\
  \n通常，模型的预测值 `f(x)` 不可能完全等于真实值，模型训练通常是寻找某种最优意义（如预测值 `f(x)` 与真实值 `y` 某种误差最小化）的数学函数。\n\
  \n#### 2. 机器学习与人工智能的关系\n\n机器学习是人工智能领域的一个研究方向。人工智能不同于普通计算机程序。普通计算机程序基于已知的数学模型进行计算，每个计算步骤都按照确定的计算公式执行。例如，根据圆面积\
  \ A 与半径 r 之间众所周知的公式 $A = \\frac{1}{2}\\pi r^{2}$ 计算某个半径圆的面积。\n\n但对于许多实际问题，无法找到确定的数学模型来表示数据之间的关系或规律。例如，“房价预测问题”希望根据房屋的特征信息（如房屋面积等）预测房价，但没有现成的数学模型告诉我们如何从房屋的特征信息计算房价。\n\
  \n类似的问题还有很多，例如：“预测股票价格”、“识别人脸照片中是谁”、“确定一段语音对应的文本”、“判断邮件是否为垃圾邮件”、“下棋时在棋盘状态下如何走子”、“电商网站的推荐系统如何推荐用户可能感兴趣的商品”、“自动驾驶汽车”等。\n\
  \n这些问题要求计算机具备与人类相同的智能。人类之所以能轻松识别图像中是否包含猫或狗，是因为他们以前见过许多此类图像，并在大脑中形成了某种模型，从而能轻松完成这一识别任务；但对于计算机来说，所有图像都是数字矩阵（数组），没有明确的公式来表达图像与其类别之间的关系。\n\
  \n如何让计算机拥有人类智能？这是计算机科学研究领域人工智能的目标。人工智能并不神秘。例如，20 世纪 80 年代出现的专家系统将特定领域专家的经验转化为一些规则，然后基于逻辑推理和规则匹配等方法解决特定问题。例如，如果一个人发烧，意味着此人可能生病了；如果红细胞很少，意味着可能患有某种缺血或失血性疾病。然而，专家系统存在耗时、费力、昂贵等问题，且针对某一问题的专家规则无法用于其他问题。此外，图像和语音识别等一些问题难以定义规则。\n\
  \n与基于逻辑推理的传统人工智能不同，作为现代人工智能的机器学习不需要专家的领域知识。它只需要大量数据，并可以使用统计方法对数据进行建模和统计学习。\n\n例如，购物网站的推荐系统可以根据用户的购物和网站浏览记录预测用户的爱好，从而向他们发送相应的推荐商品。同样，如果有大量房屋特征及其价格的数据，机器学习可以找到一个反映两者关系的合理数学模型，并基于该数学模型从房屋的特征信息预测价格。\n\
  \n#### 3. 机器学习的分类\n\n机器学习主要分为三类：监督学习、无监督学习和强化学习。\n\n所谓**监督学习**，是指用于学习的数据不仅知道其数据特征，还知道其目标值，例如餐车的利润。对于一个样本，不仅知道城市人口，还知道该城市餐车的利润。如果假设样本特征\
  \ x 和目标值 y 之间满足函数关系 `y = f(x)`，则可以从多个已知数据特征 `x` 和目标值 `y` 的数据样本 `(x^(i), y^(i))`\
  \ 中找出这个假设函数，使它们尽可能满足 `y^(i) = f(x^(i))`。这种基于多个已知数据特征 `x` 和目标值 `y` 的数据样本 `(x^(i),\
  \ y^(i))` 求解最佳假设函数的机器学习称为**监督学习**。这也是目前应用最广泛的机器学习方法。\n\n因此，监督学习是基于许多已知自变量（也称为特征）及其对应的因变量（也称为标签或目标）的样本，学习自变量（特征）与因变量（目标）之间的函数关系。一旦知道了这个函数，就可以为新的样本特征预测其目标值。\n\
  \n\n\n\n\n### 3.1.3 什么是线性回归？\n\n如图 3-2 所示，可以训练（学习）一个用于手写数字识别的函数模型 `f`。该函数接受一个输入数字图像，并输出\
  \ 0 到 9 中的某个数字。也可以训练语音识别模型，从语音输入生成相应的文本。或者训练一个围棋人工智能程序，根据输入的棋局输出落子位置。\n\n**图 3-2**\
  \ 监督学习是学习一个将输入（数据特征）转换为输出（目标值）的函数。\n\n自变量和因变量之间存在无穷多种各式各样的函数关系，例如线性函数、二次函数、三角函数等。监督学习应根据具体问题和数据集的特点，选择一个合适的函数来表示数据特征\
  \ `x` 和目标值 `y`。例如，针对餐车利润问题，根据对数据的观察，可以认为城市人口与利润之间似乎存在线性关系，那么可以使用 `f(x) = wx + b`\
  \ 这样的线性函数作为 `x` 和 `y` 之间的函数模型。函数 `f(x) = wx + b` 称为**假设函数**。当然，不同的参数 `w`、`b` 代表不同的线性关系。模型训练是基于真实值\
  \ `y^(i)` 和假设函数的预测值 `f(x^(i)) = wx^(i) + b` 的某种误差，求解出一组最优参数 `w`、`b`。一旦 `w`、`b` 确定为模型函数\
  \ `f`，对于新的输入 `x[*]`, 只需代入该函数 `f` 即可得到预测值 `f(x^(*)) = wx^(*) + b`。\n\n监督学习目前是人工智能中应用最广泛、最成功的机器学习方法。例如，图像分类识别利用大量已知图像类别的图像来识别新图像属于哪个类别。信件邮政编码识别系统可以自动识别手写邮政编码。还有击败人类围棋冠军的\
  \ AlphaGo，以及击败所有人类专家、根据基因序列成功预测蛋白质 3D 结构的 AlphaFold 等。\n\n监督学习主要包括以下步骤（任务）：\n\n\
  1.  需要一组训练样本；\n2.  设计一个能很好描述样本特征与目标值关系的假设函数；\n3.  选择一个合理的损失函数来描述预测值与真实值之间的误差；\n\
  4.  训练模型；\n5.  使用模型进行预测。\n\n根据目标值是否为连续实数，监督学习分为**回归**和**分类**。例如，房价是连续实数，因此房价预测问题是回归问题。在图像分类问题中，需要识别图像属于哪个类别（如猫、狗、飞机等），图像的类别是离散值，因此图像分类问题是分类问题。\n\
  \n分类问题通常也是通过学习一个连续的目标值（即物体属于每个类别的概率）来进行分类的。本章将介绍三种经典回归：线性回归、逻辑回归和 Softmax 回归。因为这三种机器学习技术的假设函数预测值都是连续值，所以它们被称为回归，但后两者用于解决二分类和多分类问题。\n\
  \n监督学习依赖于具有已知目标值的训练数据，但在许多情况下，人工标注以指定每个数据样本的目标值既耗时又费力。例如，对于人脸检测问题，每张人脸需要标注 68 个关键点的位置，如果城市中有数百万张人脸需要标记，这是多大的工程？同样，给数百万张图像标注类别也是一项繁重的劳动。\n\
  \n在不知道样本真实值的情况下，能否学习这些数据之间的某些规律？**无监督学习**是在不知道真实值的情况下进行的机器学习方法。例如，聚类算法可以分析数据样本以确定它们属于哪个聚类中心。主成分分析（PCA）可以确定数据的主成分，进而用于降低数据维度，即将高维数据表示为低维形式。自编码器将数据本身作为目标值，即使用\
  \ `(x^(i), x^(i))` 作为样本进行监督学习，并可通过编码和解码过程的自监督学习过程，获得数据的内在特征。\n\n缺乏真实值监督使得无监督学习非常困难。虽然无监督学习看似无目的，且难以学习到高质量的规律或数学模型，但它可以克服获取监督数据的困难，常被用作监督学习的一种辅助技术。\n\
  \n一种折中的学习方法是**半监督学习**，它为一小部分数据提供真实值，而大部分数据没有真实值。它避免了监督学习获取样本的高昂成本，并能以监督的方式引导学习过程。因此，它是一种非常有前景的机器学习方法。\n\
  \n此外，还有一种**强化学习**方法，它通过与环境交互获得的经验来学习环境的模型和决策，并用于指导行为决策。\n\n### 3.1.3 什么是线性回归？\n\n\
  针对这个餐车利润问题，用什么样的数学函数 `f(x)` 来表示样本特征（城市人口）`x` 和样本标签（餐车利润）`y` 之间的映射关系？通过观察图 2-1，可以认为由\
  \ `x` 和 `y` 形成的坐标点几乎在一条直线上（共线），或者说 `x` 和 `y` 几乎满足线性关系。因此，在无数种数学函数中，可以用线性函数来表示 `x`\
  \ 和 `y` 之间的这种线性关系：\n\n```\ny = f(x) = wx + b\n```\n\n该函数称为**假设函数**，或**函数模型**，或**模型**。\n\
  \n该线性函数由参数 `w` 和 `b` 决定，不同的参数 `w` 和 `b` 代表不同的线性函数。如果有多个数据样本 `(x^(i), y^(i))`，可以通过最小化样本特征\
  \ `x` 的预测值 `f(x)` 和真实值 `y` 的某种误差度量，来获得参数值 `(w, b)`，这些获得的参数值所表示的线性函数能很好地描述 `x` 和\
  \ `y` 之间的关系。求解参数 `(w, b)` 的过程称为**模型训练**或**训练模型**。\n\n**线性回归**是利用**线性函数**表示自变量（特征）和因变量（真实值）之间的关系，并基于一组样本数据求解一个最优线性函数的过程。\n\
  \n那么什么是“最优”？\n\n\n\n\n对于每个样本 `x^((i))`, `y^((i))`，使用符号 `f^((i))` 来表示预测值 `f(x^((i)))`。对于餐车利润问题，方差\
  \ `(f^((i)) - y^((i)))²` 可用于表示单个样本的预测误差，以下均方误差可用于表示所有样本的预测误差：\n\n```\nL = \\frac{1}{m}\\\
  sum\\limits_{i = 1}^{m}(f^{(i)} - y^{(i)})^{2} = \\frac{1}{m}\\sum_{i = 1}^{m}(wx^{(i)}\
  \ + b - y_{i})^{2}\n```\n\n`L` 可视为未知参数 `w` 和 `b` 的函数 `L(w, b)`，用于描述模型在样本数据上的预测误差。`L(w,\
  \ b)` 称为**损失函数**（也称为**误差函数**）。模型训练即求使损失函数 `L(w, b)` 取最小值的参数 `w` 和 `b`。\n\n当然，函数乘以常数不影响其最小值参数。有时为使求导更简单，将右侧公式除以\
  \ 2 作为损失函数：\n\n```\nL(w,b) = \\frac{1}{2m}\\sum\\limits_{i = 1}^{m}(f^{(i)} - y^{(i)})^{2}\
  \ = \\frac{1}{2m}\\sum\\limits_{i = 1}^{m}(wx^{(i)} + b - y^{(i)})^{2}\n```\n\n\
  线性回归即求使损失函数取最小值的参数 `w`, `b`。解决此最小值问题有两种方法：正规方程法和梯度下降法。\n\n### 3.1.4 正规方程求解线性回归问题\n\
  \n损失函数 `L(w, b)` 是 `w`, `b` 的多元函数，`L(w, b)` 对 `w`, `b` 的偏导数为：\n\n```\n\\frac{\\\
  partial L}{\\partial w} = \\frac{1}{2m}\\frac{\\partial{(\\sum(wx^{(i)} + b - y^{(i)})^{2})}}{\\\
  partial w} = \\frac{1}{m}\\sum(wx^{(i)} + b - y^{(i)})x^{(i)}\n```\n\n```\n\\frac{\\\
  partial L}{\\partial b} = \\frac{1}{2m}\\frac{\\partial{(\\sum(wx^{(i)} + b - y^{(i)})^{2})}}{\\\
  partial b} = \\frac{1}{m}\\sum(wx^{(i)} + b - y^{(i)})\n```\n\n函数 `L(w, b)` 取最小值的必要条件是其对自变量\
  \ `w`, `b` 的梯度或偏导数等于 0，即：\n\n```\n\\frac{\\partial L}{\\partial w} = \\frac{1}{m}\\\
  sum(wx^{(i)} + b - y^{(i)})x^{(i)} = 0\n```\n\n```\n\\frac{\\partial L}{\\partial\
  \ b} = \\frac{1}{m}\\sum(wx^{(i)} + b - y^{(i)}) = 0\n```\n\n令\n\n```\nX = \\begin{pmatrix}\
  \ 1 & x^{(1)} \\\\ 1 & x^{(2)} \\\\ 1 & \\vdots \\\\ 1 & x^{(m)} \\end{pmatrix}\\\
  quad W = \\begin{pmatrix} b \\\\ w \\end{pmatrix}\\quad y = \\begin{pmatrix} y^{(1)}\
  \ \\\\ y^{(2)} \\\\ \\vdots \\\\ y^{(m)} \\end{pmatrix}\n```\n\n去掉方程系数 `\\frac{1}{m}`，上述方程可写成矩阵/向量形式：\n\
  \n`XW - y = 0`\n\n移项并两边同乘 `X^T`：\n\n`X^T X W = X^T y`\n\n两边同乘 `X^T X` 的逆矩阵 `(X^T\
  \ X)^{-1}`：\n\n`W = (X^T X)^{-1} X^T y`\n\n由此得到 `W = (b, w)`。公式 (6) 即为求解 `W` 的**正规方程**。\n\
  \n使用正规方程法求解上述“餐车利润问题”的代码如下：\n\n```python\nimport numpy as np\n\ndata = np.loadtxt('food_truck_data.txt',\
  \ delimiter=\",\") # data 是 m*2 矩阵，每行代表一个样本\ntrain_x = data[:, 0]    # 城市人口，m*1\
  \ 矩阵\ntrain_y = data[:, 1]    # 餐车利润，m*1 矩阵\n\nX = np.ones(shape=(len(train_x),\
  \ 2))\nX[:, 1] = train_x \ny = train_y\n\nXT = X.transpose()\nXTy = XT @ y\nw =\
  \ np.linalg.inv(XT@X) @ XTy\nprint(w)\n```\n\n```\n[-3.89578088 1.19303364]\n```\n\
  \n模型函数 `f(x) = wx + b` 已得到，代入城市人口值 `x` 即可预测餐车利润，例如预测人口为 46,000 的城市的餐车利润：\n\n```python\n\
  4.6*w[1]+w[0]\n```\n\n```\n1.5921738849602525\n```\n\n### 3.1.5 梯度下降法求解线性回归问题\n\n\
  正规方程法需计算矩阵乘积和逆矩阵。若数据特征数或样本数较大，耗时较长。因此，通常使用梯度下降法求解上述优化问题。\n\n为求解 `L(w, b)` 的未知模型参数\
  \ `w`, `b`，梯度下降法从 `w[0]`, `b[0]` 的初始值出发，通过以下公式迭代更新 `w`, `b`：\n\n```\nw := w - \\\
  alpha\\frac{\\partial L}{\\partial w}\n```\n\n```\nb := b - \\alpha\\frac{\\partial\
  \ L}{\\partial b}\n```\n\n令\n\n```\nx = \\begin{pmatrix} x^{(1)} \\\\ x^{(2)} \\\
  \\ \\vdots \\\\ x^{(m)} \\end{pmatrix}\\quad y = \\begin{pmatrix} y^{(1)} \\\\ y^{(2)}\
  \ \\\\ \\vdots \\\\ y^{(m)} \\end{pmatrix}\\quad b = \\begin{pmatrix} b \\\\ b \\\
  \\ \\vdots \\\\ b \\end{pmatrix}\n```\n\n偏导数可用向量形式表示：\n\n```\n\\frac{\\partial L}{\\\
  partial w} = np.mean((wx + b - y) \\odot x)\n```\n\n```\n\\frac{\\partial L}{\\\
  partial b} = np.mean((wx + b - y))\n```\n\n系数 `1/m` 可并入学习率，利用 numpy 向量化运算易于编写计算梯度的代码：\n\
  \n```python\nX = train_x\nw,b = 0.,0.\ndw = np.mean((w*X+b-y)*X)\ndb = np.mean((w*X+b-y))\n\
  print(dw)\nprint(db)\n```\n\n```\n-65.32884974555671\n-5.839135051546393\n```\n\n\
  因此，求解线性回归的梯度下降算法代码可写为：\n\n```python\ndef gradient_descent(x,y,w,b,alpha=0.01, iterations\
  \ = 100,epsilon = 1e-9):    \n    history=[]\n    for i in range(iterations):\n\
  \        dw = np.mean((w*x+b-y)*x)\n        db = np.mean((w*x+b-y))       \n   \
  \     if abs(dw) < epsilon and abs(db) < epsilon:\n           break\n     \n   \
  \     # Update w: w = w - alpha * gradient\n        w -= alpha*dw \n        b -=\
  \ alpha*db \n        history.append([w,b])  \n       \n    return history\n```\n\
  \n调用上述梯度下降法，设学习率 `alpha = 0.02` 和迭代次数，可求得假设函数参数：\n\n```python\nalpha = 0.02\niterations=1000\n\
  history = gradient_descent(X,y,w,b,alpha,iterations)\nprint(len(history))\nprint(history[-1])\n\
  ```\n\n```\n1000\n[1.1822480052540145, -3.7884192615511796]\n```\n\n`history` 记录迭代过程中每一步的模型参数，最后一个参数为最优参数。\n\
  \n如何判断梯度下降法是否收敛到最优解？\n\n对于输入输出变量均为单值的假设直线函数 `f(x)`，可通过在样本点二维平面上绘制该假设直线函数，直观观察是否收敛。为此，编写函数根据模型参数\
  \ `(w, b)` 绘制假设函数对应的直线：\n\n```python\ndef draw_line(plt,w,b,x,linewidth =2):\n \
  \   m=len(x)\n    f = [0]*m\n    for i in range(m): \n       f[i] = b+w*x[i]\n \
  \   plt.plot(x, f, linewidth)  \n```\n\n以下代码绘制所得模型参数 `(w, b)` 对应的假设函数曲线（图 2-3）：\n\
  \n```python\nimport matplotlib.pyplot as plt\n%matplotlib inline\n\n#fig, ax = plt.subplots()\
  \   \nplt.scatter(X, y, marker=\"x\", c=\"red\")\nplt.title(\"Food Truck Dataset\"\
  , fontsize=16)\nplt.xlabel(\"City Population in 10,000s\", fontsize=14)\nplt.ylabel(\"\
  Food Truck Profit in 10,000s\", fontsize=14)\nplt.axis([4, 25, -5, 25])\nw,b = history[-1]\n\
  draw_line(plt,w,b,X,6)\nplt.show()\n```\n\n![](img/file38.png)\n\n图 3-3 假设函数曲线\n\
  \n\n\n为了观察迭代的收敛情况，对于具有 2 个以上数据特征（自变量）的线性回归问题，通用的做法是绘制**损失曲线**（**代价曲线**），即迭代过程中损失（代价）的变化。为此，可以使用以下损失函数来计算参数\
  \ `w`、`b` 对应的损失。\n\n```\ndef loss(x,y,w,b):\n    m = len(y)\n    return np.mean((x*w+b-y)**2)/2\n\
  \    cost = 0   \n    for i in range(m):  \n        f =  x[i]*w+b\n        cost\
  \ += (f-y[i])**2\n    cost /=(2*m)\n    return cost\n\nprint(loss(X,y,1,-3))\n```\n\
  \n```\n4.983860697569072\n```\n\n使用 `loss()` 函数计算迭代过程中所有参数 `w` 对应的损失，并绘制该损失曲线（图\
  \ 2-4）：\n\n```\ncosts = [loss(X,y,w,b) for w,b in history]\nplt.axis([0, len(costs),\
  \ 4, 6])\nplt.plot(costs)\n```\n\n![](img/file39.png)\n\n图 3-4 损失曲线\n\n可以看到损失在逐渐减小，即迭代在逐渐收敛。如果损失曲线不下降，说明算法程序可能有问题，或者学习率参数不合适。\n\
