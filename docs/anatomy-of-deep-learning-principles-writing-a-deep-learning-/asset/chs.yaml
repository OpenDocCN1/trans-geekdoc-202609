  \n**图 7-48** 用于自回归数据的双层 LSTM 网络训练模型的训练损失曲线\n\n### 7.10.3 双向循环神经网络\n\n之前的循环神经网络都是单向的，即时间\
  \ `t` 的预测仅依赖于它之前 `0, 1, 2, ..., t-1` 序列的数据。然而，在自然语言理解等某些问题中，对文本中一个词的理解将依赖于其前后的上下文信息。也就是说，时间\
  \ `t` 的预测不仅依赖于之前的序列数据，还依赖于之后的数据。针对这类问题，可以使用双向循环神经网络进行建模，即神经网络的神经元具有记录前后上下文信息的状态变量。图\
  \ 7-49 是单层双向神经网络结构的示意图。\n\n![](img/file167.png)\n\n**图 7-49** 双向循环神经网络的结构\n\n其计算过程可以表示为：\n\
  \n$$\n\\begin{matrix}\n\\overrightarrow{\\mathbf{H}}_{t} = \\phi(\\mathbf{X}_{t}\\\
  mathbf{W}_{xh}^{(f)} + \\overrightarrow{\\mathbf{H}}_{t-1}\\mathbf{W}_{hh}^{(f)}\
  \ + \\mathbf{b}_{h}^{(f)}), \\\\\n\\overleftarrow{\\mathbf{H}}_{t} = \\phi(\\mathbf{X}_{t}\\\
  mathbf{W}_{xh}^{(b)} + \\overleftarrow{\\mathbf{H}}_{t+1}\\mathbf{W}_{hh}^{(b)}\
  \ + \\mathbf{b}_{h}^{(b)})\n\\end{matrix}\n$$\n\n其中，$\\overrightarrow{\\mathbf{H}}_{t},\
  \ \\overleftarrow{\\mathbf{H}}_{t}$ 分别表示前向和后向状态变量。`\\mathbf{W}_{xh}^{(f)} \\in \\\
  mathbb{R}^{d \\times h}`、`\\mathbf{W}_{hh}^{(f)} \\in \\mathbb{R}^{h \\times h}`、`\\\
  mathbf{W}_{xh}^{(b)} \\in \\mathbb{R}^{d \\times h}`、`\\mathbf{W}_{hh}^{(b)} \\\
  in \\mathbb{R}^{h \\times h}` 是模型的权重参数。`\\mathbf{b}_{h}^{(f)} \\in \\mathbb{R}^{1\
  \ \\times h}`、`\\mathbf{b}_{h}^{(b)} \\in \\mathbb{R}^{1 \\times h}` 是偏置参数。`(f)`、`(b)`\
  \ 用于标记模型参数是前向还是后向。多层双向循环网络最后一层的状态变量可以直接作为模型的输出 `\\mathbf{F}_{t} = \\mathbf{H}_{t}^{(L)}`，也可以通过激活函数或连接其他一些非循环网络层后输出。\n\
  \n$$\n\\mathbf{F}_{t} = \\mathbf{H}_{t}^{(L)}\\mathbf{W}_{hf} + \\mathbf{b}_{f}\n\
  $$\n\n其中 `\\mathbf{H}_{t}^{(L)}` 是由 `\\overrightarrow{\\mathbf{H}}_{t}^{(L)}`, `\\\
  overleftarrow{\\mathbf{H}}_{t}^{(L)}` 拼接形成的向量。\n\n你可以像上一节那样直接使用神经网络单元构建双向循环神经网络，也可以用一个类单独封装双向循环网络层，然后利用这些单层双向循环网络层来构建（多层）双向循环神经网络。\n\
  \n下面的 `RNNLayer` 代表一个双向循环神经网络层。其构造函数的参数 `mode` 表示不同类型的循环神经网络单元，参数 `reverse` 表示该神经网络层是前向还是反向。\n\
  \n```python\nfrom Layers import *\n\n# from rnn import *\n\nclass RNNLayer(Layer):\n\
  \n    def __init__(self, mode, input_size, hidden_size, bias=True, batch_first=False,\
  \ reverse=False):\n        super(RNNLayer, self).__init__()\n        self.mode =\
  \ mode\n        if mode == 'RNN_TANH':\n            self.cell = RNNCell(input_size,\
  \ hidden_size, bias, nonlinearity=\"tanh\")\n        elif mode == 'RNN_RELU':\n\
  \            self.cell = RNNCell(input_size, hidden_size, bias, nonlinearity=\"\
  relu\")\n        elif mode == 'LSTM':\n            self.cell = LSTMCell(input_size,\
  \ hidden_size, bias)\n        elif mode == 'GRU':\n            self.cell = GRUCell(input_size,\
  \ hidden_size, bias)\n        self.reverse = reverse\n        self.batch_first =\
  \ batch_first\n        self.zs = None\n\n    def init_hidden(self, batch_size):\n\
  \        # self.h = np.random.zeros(batch_size, self.hidden_dim)\n        self.h\
  \ = self.cell.init_hidden(batch_size)\n        return self.h\n\n    def forward(self,\
  \ input, h=None, batch_sizes=None):\n        mode = self.mode\n        if self.batch_first\
  \ and batch_sizes is None:\n            input = input.transpose(0, 1)\n        seq_len,\
  \ batch_size = input.shape[0], input.shape[1]\n        if h is None:\n         \
  \   h = self.init_hidden(batch_size)\n        self.h = h  # h.copy()\n        output\
  \ = []\n        zs = []\n        hs = []\n        steps = range(seq_len - 1, -1,\
  \ -1) if self.reverse else range(seq_len)\n        for t in steps:\n           \
  \ h = self.cell(input[t], h)\n            # h, z = self.cell(input[t], h)\n    \
  \        # output.append(h)\n            if isinstance(h, tuple):\n            \
  \    h, z = h[0], h[1]\n                if mode == 'LSTM' or mode == 'GRU':\n  \
  \                  zs.append(z)\n            hs.append(h)\n        self.hs = np.array(hs)\n\
  \        output = [h[0] if isinstance(h, tuple) else h for h in self.hs]\n     \
  \   if mode == 'LSTM' or mode == 'GRU':\n            self.zs = np.array(zs)\n  \
  \      return np.array(output), h\n\n    def __call__(self, input, h=None, batch_sizes=None):\n\
  \        return self.forward(input, h, batch_sizes)\n\n    def backward(self, dhs,\
  \ input):  # , hs):\n        if False:\n            if hs is None:\n           \
  \     hs, _ = self.forward(input)\n        else:\n            if self.hs is None:\n\
  \                self.hs, _ = self.forward(input)\n            hs = self.hs\n  \
  \      if False:\n            if self.zs is None:\n                zs = hs\n   \
  \         else:\n                zs = self.zs\n        zs = self.zs if self.zs is\
  \ not None else hs\n        seq_len, batch_size = input.shape[0], input.shape[1]\n\
  \        cell = self.cell\n        if len(dhs) == len(hs):  # .shape==hs.shape:\
  \ # (seq, batch, hidden)\n            dinput = [None for i in range(seq_len)]\n\
  \            steps = range(seq_len) if self.reverse else range(seq_len - 1, -1,\
  \ -1)\n            t0 = seq_len - 1 if self.reverse else 0\n            dh = np.zeros_like(dhs[0])\
  \  # Gradient from the next moment\n            for t in steps:\n              \
  \  dh += dhs[t]  # The gradient of the next moment + the gradient of the current\
  \ moment\n                h_pre = self.h if t == t0 else hs[t - 1]\n```\n\n\n\n\n\
  \n#### RNNLayer 类测试\n\n```python\ndx, dh, _ = cell.backward(dh, zs[t], input[t],\
  \ h_pre)\ndinput[t] = dx\nreturn dinput\n```\n\n```python\n# test_LSTM=\"LSTM\"\n\
  test_LSTM = \"GRU\"\nreverse = True\nnp.random.seed(1)\nseq_len, batch_size, input_size,\
  \ hidden_size = 5, 3, 4, 6\n\nif test_LSTM == \"RNN_TANH\":\n    rnn_ = RNNLayer(\"\
  RNN_TANH\", input_size, hidden_size, reverse=reverse)\nelif test_LSTM == \"GRU\"\
  :\n    rnn_ = RNNLayer('GRU', input_size, hidden_size, reverse=reverse)\nelse:\n\
  \    rnn_ = RNNLayer('LSTM', input_size, hidden_size, reverse=reverse)\n\ninput\
  \ = np.random.randn(seq_len, batch_size, input_size)\n\nif reverse:\n    input =\
  \ input[::-1]\n\nh0 = np.random.randn(batch_size, hidden_size)\nc0 = np.random.randn(batch_size,\
  \ hidden_size)\n\nif test_LSTM == \"LSTM\":\n    output, hn = rnn_(input, (h0, c0))\n\
  else:\n    output, hn = rnn_(input, h0)\n\nprint(\"output\", output)\nprint(\"hn\"\
  , hn)\n\n# ------ test backward ---\ndo = np.random.randn(*output.shape)\ndinput\
  \ = rnn_.backward(do, input)  # , rnn_.hs) # output)\nprint(\"dinput:\", dinput)\n\
  ```\n\n测试结果略有不同。\n\n#### RNNBase_ 类实现\n\n在上述循环神经网络层的基础上，可以轻松实现多层双向循环神经网络。`RNNBase_`\
  \ 实现了一个双向多层循环神经网络：\n\n```python\nfrom Layers import *\n\nclass RNNBase_(Layer):\n\
  \    __constants__ = ['mode', 'input_size', 'hidden_size', 'num_layers', 'bias',\n\
  \                     'batch_first', 'dropout', 'bidirectional']\n\n    def __init__(self,\
  \ mode, input_size, hidden_size,\n                 num_layers=1, bias=True, batch_first=False,\n\
  \                 dropout=0., bidirectional=False):\n        super(RNNBase_, self).__init__()\n\
  \        self.mode = mode\n        self.input_size = input_size\n        self.hidden_size\
  \ = hidden_size\n        self.num_layers = num_layers\n        self.bias = bias\n\
  \        self.batch_first = batch_first\n        self.dropout = float(dropout)\n\
  \        self.bidirectional = bidirectional\n        num_directions = 2 if bidirectional\
  \ else 1\n        self.num_directions = num_directions\n\n        if not isinstance(dropout,\
  \ float) or not 0 <= dropout <= 1 or \\\n                isinstance(dropout, bool):\n\
  \            raise ValueError(\"dropout should be a number in range [0, 1] \"\n\
