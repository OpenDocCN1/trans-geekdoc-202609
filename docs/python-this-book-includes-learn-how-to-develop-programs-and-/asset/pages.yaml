    # Django Database


    This section will look into how to connect databases with Django project. Anytime
    you''re building a web project or any type of project, you will need some form
    of input by the end-users or consumers. Now, all data entered by the consumers
    take care of databases. In the modern era, it''s impossible to develop a website
    without building a database. Even if it''s a blog site, you will still need a
    database.


    To accomplish this you will require to have software. The function of this software
    is to store that data efficiently and also middleware that can allow you to communicate
    with the database.


    # Connecting Your Database with Django Project


    By default, when you created the first app and started the server, you probably
    saw a new file in your project directory. This file is called ‘db.sqlite3’. The
    file is a database file where all the data that you will generate will be kept.'
