    # Exploring the Titanic


    To conduct the data analysis, you''ll use the Titanic dataset from Kaggle.

    This is easy to understand the dataset and doesn''t need any domain understanding
    to extract insights.

    This dataset holds the details of every passenger on the Titanic and whether they
    survive or not.


    Here are the field descriptions:


    | Field | Descriptions |

    |---|---|

    | survival | Survival(0= No, 1= Yes) |

    | pclass | Passenger class(1=1st, 2=2nd, 3=3rd) |

    | name | Name of the passenger |

    | sex | Gender of the passenger |

    | age | Age of the passenger |

    | sibsp | Number of siblings/spouses aboard |

    | parch | Number of parents/children aboard |

    | ticket | Ticket number |

    | fare | Passenger fare |

    | cabin | Cabin |

    | embarked | (C = Cherbourg, Q = Southampton) |


    Because the data is simple to understand, you''ll maintain the survival analysis
    as the major theme that can be used for data analysis. You''ll place questions
    near the themes:

    Here are some of the questions that you will respond:


    +   - Which class of passengers has the highest number of survivors?


    +   - What is the distribution of the nonsvivors among classes that have relative
    on the ship?'
