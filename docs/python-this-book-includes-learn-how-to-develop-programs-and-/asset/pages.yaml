  md: '# Reinforcement Learning


    When it comes to reinforcement learning, the data to be inputted is provided as
    a stimulus to the model from the environment to which the machine learning model
    must react. Feedback is generated not like a teaching process like the case of
    supervised learning, but like punishments and rewards in the environment.


    ![](img/43582740ac1227a817786ef73e0f3772_249_0.png)


    The steps taken by the agent results in learning. Rather than being explicitly
    taught, and the action it chooses is based on its past experience and also by
    the fresh choices designed by it, which basically implies it learns from trial
    and error. The agent acquires the reinforcement signal in terms of numerical reward
    that encodes the success, and the agent tries to teach itself to take actions
    that will boost the accumulated reward over time.


    Reinforcement learning is heavily applied in robotics and not much in data science.
    Below are the algorithms that belong to reinforcement learning:


    +   1. Q learning

    2. Temporal difference learning


    Decision Trees

    A simple predictive model maps the results of an item to the input data. It is
    a popular predictive modeling technique, which is commonly applied in the industry.

    Decision tree models are of two types:


    +   1. Classification trees: These point to dependent variables that accept a
    finite value. In these tree structures, branches represent the rules of the features
    that result in class labels, and leave the class labels of the results.

    2. Regression trees: When dependent variables accept continuous values, then they’re
    referred to as regression trees.'
