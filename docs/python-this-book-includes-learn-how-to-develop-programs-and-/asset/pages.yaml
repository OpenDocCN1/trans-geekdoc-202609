- pgno: 211
  md: '# Type 1 and Type 2 Errors


    The type 1 error refers to the error that happens when there is a rejection of
    the null hypothesis when it''s definitely true. This type of error is known as
    an error of the first kind and is equivalent to false positives.


    Let''s demonstrate this concept by applying an example. Say for, example, a new
    drug is being created, and it requires to be tested on whether it''s effective
    in fighting diseases. The null hypothesis is that it''s not effective in fighting
    diseases.


    The significance level is retained at 5% so that the null hypothesis can be confidently
    accepted 95% of the time. But, 5% of the time, you''ll accept the rejection of
    the hypothesis even if it had to be accepted. In other words, even if the drug
    is ineffective, it''s assumed to be effective.


    The Type 1 error is regulated by controlling the relevance level, which is alpha.
    Alpha is the highest chance to have a Type 1 error. The lower the alpha, the lower
    will be the Type 1 error.


    The Type 2 error is the type of error that happens when you don''t reject a null
    hypothesis that is false.


    This type of error happens in a drug scenario when the drug is said to be ineffective
    but in a real sense, is effective.


    This kind of error can be regulated one at a time. In case one of the errors is
    minimized, then the other increases. It depends on the application and the problem
    statement that the analysis tries to focus on, and based on it, the right error
    should reduce. In the case of this drug scenario, a Type 1 error should be reduced
    because it is better to ship a drug that is confidently effective.


    # A Confidence Interval


    The confident interval in statistics refers to the population factor. The confidence
    interval helps to determine the level for computing the population mean can be
    described.


    Assume there are 50 men and their height in centimeters:'
  merge: -1
  img_proc: true
