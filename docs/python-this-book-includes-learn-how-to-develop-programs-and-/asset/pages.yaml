    # Bias and Variance


    In the context of machine learning, bias is defined as "the simplified assumptions
    made by a model to further simplify the learning of the target task". Parametric
    models are designed with an inherent strong bias, which makes learning much faster
    and simpler but significantly reduces the overall flexibility of the model for
    a wider variety of applications. "Decision trees", "k-nearest neighbors", and
    "support vector machines" are categorized as low-bias algorithms for machine learning
    models. The "high-bias" ML algorithms are "linear regression", "linear discriminant
    analysis", and "logistic regression".


    In the context of machine learning, a variance can be defined "as the amount by
    which the estimation of the target function will be altered with the use of a
    different training data set". Non-parametric models with high flexibility tend
    to have a high variance score. "Linear regression", "linear discriminant analysis",
    and "logistic regression" are low-variance ML algorithms. "Decision Trees", "k-Nearest
    neighbors", and "Support Vector Machines" are high variance ML algorithms.


