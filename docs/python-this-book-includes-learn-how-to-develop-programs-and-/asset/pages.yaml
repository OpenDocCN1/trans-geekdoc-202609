    # The Naïve Bayes Classifier


    The naïve Bayes classifier is a simple probabilistic classifier, which is dependent
    on the Bayes theorem. The assumption here is that there is strong interdependence
    between the features; as as a result, it is called naïve. Below is the Bayes theorem:


    ```

    $P(A|B)=\frac{P(B|A)P(A)}{P(B)}$

    ```


    In the previous formula, A and B are events, p(A), and p(B) denote the probabilities
    of A and B. Additionally, these are interdependent of each other. P(A|B) refers
    to the probability of A, provided that B is True, which is a conditional probability.
    P (B|A) is the probability of B, provided that A is True. The naïve Bayes formula
    is as follows:


    ```

    $P(A|B)=P(A_1\cap B)+P(A_2\cap B)+...+P(A_n\cap B)$

    ```


    Let''s try to find the solution to the above naïve Bayes formula using the following
    example:

    Ann is going for an engagement tomorrow in Austin at an outdoor event. In the
    last few years, Austin has only experienced six rainy days in a year. Unfortunately,
    there has been a rain forecast for tomorrow by the weatherm. 80% of the time,
    the weatherm accurately predicted the rain. But he incorrectly forecasts the weather
    20% of the time when it doesn''t rain. Find the likelihood that it will rain on
    the day of Ann''s engagement. Below are some of the scenarios based on which the
    probability can be computed:


    +   * A1. This event states that it rains on Ann''s engagement.

    * A2. This event states that it doesn''t rain on Ann''s engagement.

    * B. This event states that weatherm forecasts rain


    Here are the probabilities based on the previous events


    +   * P(AI) = 6/365. In other words, it rains six days out of the year.

    * P(AII)=359/365. In other words, it doesn''t rain 359 days out of the year.'
  merge: -1
  img_proc: true
