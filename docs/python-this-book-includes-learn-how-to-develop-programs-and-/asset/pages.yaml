  md: '# Correlation


    When it comes to statistics, correlation refers to the similarity between random
    variables. The most commonly applied correlation is Person correlation and is
    defined using the following formula:


    ```

    $$\rho_{X,Y} = \frac{E[(X-\mu_x)(Y-\mu_y)]}{\sigma_x\sigma_y}$

    ```


    ```

    >>> mpg = [21.0, 21.0, 22.8, 21.4, 18.7, 18.1, 14.3, 24.4, 22.8,

    19.2, 17.8, 16.4, 17.3, 15.2, 10.4, 10.4, 14.7, 32.4, 30.4,

