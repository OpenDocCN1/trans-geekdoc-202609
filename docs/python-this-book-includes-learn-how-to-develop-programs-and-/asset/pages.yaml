  md: 'Django Github projects to study?

    You can still download the project and improve it. And to accomplish this,

    y need to read, read, read, and master the code.


    # Surround Yourself with People Learning


    When you surround yourself with people who are learning the same language

    as you, it provides you with a sense of camaraderie. In other words, you''re all

    moving towards the same goal, and each one can depend on each other.

    Could be that your problem was solved a few days ago by one of your friends.

    Why not find out from him how he arrived at the answer.


    # Surround Yourself with Experts


    You need your peers and experts to become the best. Your friends,

    workmates, and mentors who have been using Django or Python can solve

    complex problems that beginner developers can''t.

    A professional can solve your problems and provide you with a bigger

    picture.

    A beginner may describe you how to do something, but only an expert can

    tell if your current solution is optimal or not.


    # Read Lots of Django Books


    Sometimes it can be hard to surround yourself with experts, or you may not

    find time to interact with them because of the nature of jobs they handle.

    Thankfully, that is not the end. There are lots of books written by them

    professionals.

    What is interesting about books is that you can learn something in hours,

    sothing that took many years for professionals to learn.

    While these books may not turn you into a Django pro, it will set you a great

    path to becoming a good developer.


    # Write Code Every Day


    You should code daily. How much, that depends on yourself.

    Single mothers may have a harder time setting aside time compared to

    teenagers. People who spend most of the day outside working have little time

    to code. While working as programmers also need to time outside the job

    code.

    Whatever time you can create, code every day even if it''s only for 20'
  merge: -1
  img_proc: true
- pgno: 407
  md: 'minutes.

    Creating a routine of coding every day will help you become a better programmer.


    # Take Some Breaks


    After a long period of studying, you need to take breaks.

    Taking breaks allows your brain, not only to rest but to organize what you’ve
    learned.

    It’s easy to lose your focus of the bigger picture, and lock yourself into a piece
    of code. It’s easy to get disappointed because a certain concept isn’t sinking
    into your brain when you''ve been studying for 2 hours non-stop. So, you should
    take a break, come with your mind clear, and well-rested.


    # Ask Other People


    When you’re learning, you’ll not know a lot of things. Or maybe you don’t see
    how they work. You will have a lot of questions related to coding. The best way
    to solve something is to ask.

    There’s a lot to learn from just asking people. Go to coding forums and post your
    question. Ask your workmates. And don’t be afraid to ask. Remember, it’s better
    to ask a dumb question than don’t ask and put yourself in risk.

    Ask, and you’ll learn.


    # Teach Your Friends


    Teaching is an excellent way to master something.

    When you learn something, you understand how to use it. However, when you’re teaching
    others, you need to know how to use it, and how it works operates internally.
    What it does in the backend, what happens if you do this, what happens if you
    skip this, why the developers made it work this way, and no other way.

    There is so much to explore and going deep into the subject when you teach other
    people.

    These are the tips you need to follow to become a good programmer in Python. Now
    it is up to you to follow them.'
