  md: '# Evaluation


    Essentially the process of judging multiple hypotheses or models to choose one
    model over another is referred to as an evaluation. To be able to differentiate
    between useful classifiers from the vague ones an "evaluation function" is required.
    The evaluation function is also called as "objective", "utility" or "scoring"
    function. The machine learning algorithm has its own internal evaluation function
    which tends to be different from the external evaluation function used by the
    researchers to optimize the classifier. Usually, the evaluation function is defined
    prior to the selection of the data representation tool, as the first step of the
    project. For example, the machine learning model for the self-driving car has
    the feature for identification of pedestrians in its vicinity at near-zero false
    negatives and a low false-positive as an evaluation function and the pre-existing
    condition that needs to be "represented" using applicable data features.


    # Optimization


    The process of searching the space of presented models to achieve better evaluations
    or the highest scoring classifier is called as "optimization". For algorithms
    with more than one optimum classifier, the selection of optimization techniques
    is very critical in the determination of the classifier produced and to achieve
    a more efficient learning model. A variety of offthe-shelf optimizers are available
    in the market to kick start new machine learning models before eventually replacing
    them with custom-designed optimizers.'
