- pgno: 9
  md: '# Chapter 1: Introduction to Artificial Intelligence


    Humans or Homo Sapiens often claim to be the most superior species to have ever
    inhabited the planet Earth, mainly attributing to their "intelligence." Even the
    most complicated animal behavior is regarded as smart, but intelligence is attributed
    to the simplest of human behavior. For example, when a female digger wasp returns
    with food to burrow, she deposits the food on the threshold and checks for intruders
    prior to carrying her food inside. So wasps are quite smart, right? However, an
    experiment performed on these wasps, where the scientist moved the food a few
    inches away from the burrow''s entrance while the wasp was inside the burrow,
    reported that the wasps continued to repeat the entire ordeal as the food was
    moved. This experiment revealed that the wasps failed to adapt to evolving conditions
    and therefore, "intelligence" in the wasps is noticeably absent. Then how do we
    define "human intelligence?" Psychologists characterize human intelligence as
    a composite of a variety of skills such as learning from experiences and adapting
    consequently, understanding abstract ideas, reasoning, problem-solving, linguistic
    use, and perception.


    Artificial Intelligence (AI) can be defined as the science of developing human-controlled
    and operated machines, which are capable of imitating human intelligence, adapting
    to new inputs, and performing human-like activities. Thanks to Pop culture, upon
    hearing the words Artificial Intelligence, most people tend to think of robots
    coming to life to wreak on human beings. But that is from reality. The core principle
    of Artificial Intelligence is the capacity of Artificial Intelligence powered
    machines to rationalize (think like humans) and take action (mimic human actions)
    to achieve the targeted objective. To put simply, Artificial Intelligence is designing
    a machine that will think and behave like human beings. Artificial Intelligence
    has three primary objectives, which are learning, reasoning, and perception.


    Although the term Artificial Intelligence was coined in 1956, the British pioneer
    of Computer Sciences, Alan Mathison Turing, carried out extensive'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'work in the field of Artificial Intelligence, in the mid-20th century. Turing
    created an abstract computing machine in the form of symbols, in 1935, with a
    scanner and unlimited memory. The scanner was able to move back and forth through
    the memory, read the available symbols and write additional memory symbols. A
    programming instruction dictated the activities of the scanner and was stored
    in the memory as well. Thus, Turing created a machine with implicit learning capabilities
    that could alter its programming and enhance itself. This principle is commonly
    regarded as the universal "Turing Machine" and serves as a basis for all advanced
    computers. Turing asserted that computers are able to learn from their own experience
    and resolve problems using a guiding principle called "heuristic problem.\"


    The early Artificial Intelligence studies were concentrated on problem-solving
    and symbolic techniques, in the 1950s. By the 1960s, the AI research had a major
    leap of interest from the US Department of Defense, what working towards training
    computers to mimic human reasoning. In the 1970s, the Defense Advanced Research
    Projects Agency (DARPA) has successfully performed its street mapping projects.
    It may come to you as a surprise that in 2003, long before the existence of the
    renowned Siri and Alexa, DARPA had effectively manufactured intelligent personal
    assistant machines. Long story short, this groundbreaking achievement in the field
    of Artificial Intelligence has set the stage for automation and reasoning observed
    in modern-day computers.


    Here are the primary human characteristics that we strive to imitate in the machines:


    +   1. **Knowledge** – Machines need an abundance of data and information related
    to the world around us, in order to be able to behave and respond like humans.
    In order to implement knowledge engineering, Artificial Intelligence powered machines
    are required to have undeter access to data objects, data categories, and data
    properties as well as the relationship between them that can be managed and stored
    in the data storage.


    +   2. **Learning** – Of all the various forms of learning that apply to AI, the
    "trial and error" technique is considered the easiest. For example, a'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'computer chess learning program will try all possible moves until the mate-in-one
    move is found to win the game. The program encounters a similar winning move to
    be used the next time it encounters a similar scenario. This fairly easy to implement
    learning element is called "rote learning", which includes memorization of individual
    objects and processes in a straightforward way. The most difficult part of learning
    is called "generalization", which implies the application of prior experiences
    to the newly encountered situations.


    +   3. **Problem Solving** – The systematic process of achieving a predefined
    objective or solution by looking through a range of viable actions can be characterized
    as a problem solving the methods for problem-solving can be adjusted for a specific
    issue or for a broad range of problems. A general-purpose problem-solving technique
    frequently used in AI is "means-end analysis," which includes an incremental decrease
    in the difference between the initial and final state of the goal. Think of some
    of the core functions of a robot, back and forth motion, or picking up factors
    that contribute to an objective being fulfilled.


    +   4. **Reasoning** – The act of reasoning can be defined as the capacity to
    draw inferences suitable to the scenario in question. The two types of reasoning
    are called "deductive reasoning" and "inductive reasoning". In deductive reasoning,
    if the premise is true then the conclusion is presumed to be true. On the other
    hand, the conclusion may or not be true in inductive reasoning, even if the premise
    is true. While significant success in programming computers to execute deductive
    reasoning has been attained, the application of "true reasoning" stays out of
    reach and one of the greatest challenges facing Artificial Intelligence.


    +   5. **Perception** – The process of producing a multidimensional view of an
    object by means of multiple sensory organs can be defined as perception. A number
    of variables, such as the viewing angle, the direction, and intensity of the light,
    and the extent of contrast generated by the object with the surrounding area,
    can complicate this development of awareness of the environment. With the introduction
    of self-driving cars and robots that can collect empty soda cans moving through
    the facilities, breakthrough developments have been rendered in the field of artificial
    perception and can be readily observed in our daily lives.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# The Fourth Industrial Revolution


    From the First Industrial Revolution of the 18th century that marked a transition
    of the world economy from an agriculture base to the one dominated by industries
    and machine manufacturing, today we find ourselves at the cusp of the Fourth Industrial
    Revolution. Remember the Second Industrial Revolution applied science to mass
    production and manufacturing, while the Third Industrial Revolution or Digital
    Revolution brought us digital technologies. The Fourth Industrial Revolution announces
    a series of social and economic upheavals, unfolding over the 21st century with
    technologies like Artificial Intelligence, 3-D printing, Augmented Reality and
    Genome Editing.


    The Fourth Industrial Revolution will rapidly alter the way we produce, exchange,
    and distribute value. CRISPR technology has revolutionized the gene-editing space
    by providing a low-cost gene sequencing and targeting mechanism. Automation continues
    to disrupt the transportation and manufacturing paradigms while blockchain technology
    is increasingly erasing the boundary between the physical and digital world. And
    of course, the applications of Artificial Intelligence in every industry imaginable
    can be deemed limitless. In line with the previous revolutions, the Fourth Industrial
    Revolution will profoundly transform our world for the next 50-100 years. The
    way we think about this revolution today and invest in it will eventually guide
    the near future transformation of the human race.


    ![](img/43582740ac1227a817786ef73e0f3772_12_0.png)


    The global social transformation of the Fourth Industrial Revolution can be led
    by affecting the incentives, rules, and norms of the economy which in'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'turn transforms how we communicate, learn, and entertain ourselves. Our understanding
    of human species and how we relate to one another is up for renewal with the adoption
    of cyber-physical systems as the Internet of Things (IoT) and the Internet of
    Systems (iOS). The new technologies are being developed and implemented at lightning
    speed and poised to impact human identities, communities as well as the political
    structures. Therefore, our engagement with these revolutionizing technologies
    is intricately tied to our opportunities for self-realization and our ability
    to leave a lasting positive impact on the world. Some of the prominent technologies
    other than Artificial Intelligence, that is driving the Fourth Industrial Revolution
    include:


    +   - Blockchain – The advent of digital currency like “Bitcoin”, is attributed
    to the blockchain technology, which allows for secure and transparent recording
    and sharing of data using a decentralized server, instead of a third-party intermediary.
    The blockchain technology can also be used to make supply chains traceable, sensitive
    medical data and even to combat voter fraud.

    - Smart computing – Modern day computers are capable of processing a vast amount
    of data in minutes. The advent of “cloud” technology is allowing businesses to
    securely store and access information seamlessly from anywhere in the world with
    Internet access. Future computers are slated to become even more powerful with
    the use of Quantum computing technologies. These million times more powerful computers
    will potentially be capable of supercharging AI, create complex data models within
    seconds and gear up the discovery of new materials.

    - Augmented and Virtual Reality – The augmented reality as the name suggests will
    redefine and expand our realities by merging the physical and digital world into
    one. For example, the makeup application launched by L’Oréal which allows the
    users to digitally experiment with their products, without physically being in
    the store. On the other hand, virtual reality simulates the real world to create
    an immersive digital experience. For example, the virtual reality or VR headsets
    you can buy at any electronics store to enhance your online gaming experience.

    - Biotechnology – The vicious cycle of new diseases demanding new'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'treatments will continue to haunt us for the foreseeable future. But the advances
    in biotechnology are propelling our usage of cellular and bio-molecular techniques
    to develop new pharmaceuticals and biomaterials. Our paramount need for clean
    and efficient energy sources, such as biofuels, to replace the depleting non-renewable
    fossil fuel sources is dependent on and driven by technology. For example, some
    scientists are working to develop the strongest biomaterial ever produced.


    +   - Robotics – The science of developing and using robots for personal as well
    as commercial use is called Robotics. Several headlines have been made by the
    Japanese robotics engineers working to develop increasingly sophisticated, “human-like”
    robots that can be used as human assistants in hotels or hospitals to revolutionize
    the field of industrial manufacturing.


    +   - 3D Printing – The new hot gadget of today’s modern technology is the 3D
    printer. We can print customized three-dimensional objects at a low cost and from
    the comforts of our home. Businesses now have the ability to print their own parts
    without needing significant tooling, at a much higher speed and low cost than
    the traditional process.


    +   - Internet of Things (IoT) – If you think the idea of your car being able
    to track what''s in your refrigerator is science fiction? Think again! The IoT
    technology constitutes the connection of our everyday items with the Internet
    allowing for their identification by all the other devices on the network. This
    technology is revolutionizing the marketing industry by collecting data from all
    of the connected devices of a customer and marketing their products to better
    meet the customer''s needs. IoT sensors are also used in the field of agriculture,
    by allowing farmers to better monitor soil attributes and make informed decisions
    like the need for fertilization and irrigation of their farms.


    Some economists like Erik Bryolfsson and Andrew McAfee, argue that the Fourth
    Revolution could contribute to greater economic inequality, specifically in its
    potential to disrupt the labor markets around the world. With the increasing propensity
    of automation across the economy, the net displacement of labor by machines is
    likely to exacerbate the disparity between the returns to labor and return to
    capital. However, the other side of the coin signals the possibility that the
    displacement of workers by will'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'result in a net gain of rewarding and less risky jobs. Not unlike the prior
    industrial revolutions that have resulted in positive as well as negative impacts
    on our world. Although nations across the globe have become wealthier, pulling
    entire societies from the dearth of poverty, the universal disparity of economic
    distribution is getting increasing wider every day. To ensure that we as a humanity
    are foremost in receiving the benefits of technological progress. We must recognize
    the risk of technological advancements, such as cybersecurity threats, use of
    digital media in distribution of misleading or wrong information at a lightning
    speed on a massive scale as well as potential unemployment through automation,
    and take measures to mitigate these risks.


    > "The changes are so profound that, from the perspective of human history, there
    has never been a time of greater promise or potential peril. My concern, however,
    is that decision-makers are too often caught in traditional, linear (and non-disruptive)
    thinking or too absorbed by immediate concerns to think strategically about the
    forces of disruption and innovation shaping our future.\"'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Professor Klaus Schwab


    #  Industrial Applications of Artificial Intelligence


    Artificial Intelligence technology is leading the Fourth Industrial Revolution
    with its growing influence on everyday consumer products. AI has revamped the
    manufacturing, retail and finance industries with new products, processes, and
    capabilities. Some of the most significant breakthroughs in physics and healthcare
    are also credited to AI. In this era of technological advancements as we move
    towards a future depicted in science fiction, AI has become an essential part
    of our world. Artificial Intelligence has exploded in recent years, thanks to
    the massive amount of online data we generate every day and the never seen before
    powerful computers. innovators are chasing the promise of AI to gain a competitive
    advantage while saving up on costs and time. From optimizing the delivery route
    to management of a global supply chain, AI is helping companies of all sizes across
    the industries to improve their bottom line with enhanced productivity. Companies
    are able to design, produce and deliver superior products and services while cutting
    back on their expenses. Isn''t that every entrepreneur''s dream come true?! In
    this chapter, we will explore the application of Artificial Intelligence in all
    the major industries and how the business processes are changing to adopt AI.


    Here are some of the most significant applications of Artificial Intelligence
    in various industrial domains:


    # Finance or Banking Industry


    Even though the technical advancements of the financial institutions have been
    overshadowed by the "Silicon Valley", some of the Applications of artificial intelligence
    based tools and technologies in this domain our groundbreaking. Considering the
    fact that the finance industry has a profound effect not only on the everyday
    consumer but also on other businesses across the industrial spectrum. Some of
    the traditional banking Industry problems such as fraud detection and prevention,
    catering to millions of customers across the globe, Data privacy and security
    concerns as well as flagging of false-positive transactions, others are being
    addressed with the use of Machine learning algorithms and big data analytics.
    Some of the most'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'popular Data science-driven trends in the finance industry:


    +   * Automation and personalization of customer service with the use of virtual
    personal assistance Chatbots.

    * Real-time detection and prevention of fraudulent transactions by analyzing large
    volumes of customer transaction data and identifying patterns that can be easily
    missed by a human observer.

    * Analyzing available customer transaction data, current market trends and remarks
    from other financial institutions that the prospective borrower might have approached,
    to assess potential risks in approving loans as well as to determine the eligibility
    of a potential credit card customer.

    * Hedge funds are increasingly looking to utilize artificial intelligence based
    tools and technologies in their trading to gather inside from a mound of stock-related
    data in a fraction of time.


    > "We want to be there for customers in the moments that matter most. Incorporating
    artificial intelligence into our mobile banking offering will help customers manage
    their simple banking needs more efficiently and consistently, which allows our
    specialists in our financial centers to spend more time with customers to understand
    their more complex needs and help them improve their financial lives."

    - Tong Nguyen, Bank of America


    # Virtual Assistance Across Industrial Domains


    From the healthcare industry to the finance industry, virtual assistance has become
    the new industry-standard for enhanced customer service. The leading online travel
    booking company, "Expedia" has launched the "Expedia Skill" application to provide
    customers information on their upcoming trips and flight details and even able
    to book a rental car with a simple voice command. They have recently partnered
    with "Amazon" to allow their customers to check their upcoming travel plans and
    flight details with live updates using "Amazon Alexa" devices. Another travel
    company, "ATPI", deployed its artificial intelligence based tool called "Zeno
    by ATPI", which stores frequent traveler information such as seat preferences,
    preferred departure airport, preferred car rental service and favorite hotel to
    offer a personalized experience to every customer. The tool also supports "Zeno"'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Chatbot" to resolve basic customer issues and route them to a customer service
    representative for more complex queries.


    Virtual assistant in the hospitality industry such as "Hijiffy", which operates
    as an integration with the hotel''s Facebook messenger application is revolutionizing
    the rigid monotonous Hotel booking websites. With the "Hijiffy" application prospective
    customers can get Hotel services information, resolve customer issues, receive
    tips on destination cities, get access to real-time hotel rates and even make
    air Hotel room booking right from their Facebook messenger application.


    Another groundbreaking virtual assistance platform in the hospitality industry
    called "Watson assist for hospitality" was developed by IBM. This platform can
    store Hotel guest data and is highly customizable, allowing individual hotels
    to develop their own Hotel specific and uniquely named Chatbot. This powerful
    technology is designed to anticipate guess needs and generate product service
    recommendations based on their prior stay at the same hotel and other pertinent
    information. IBM Watson is also capable of arranging transportation for guest
    prior to scheduled meetings as reflected in the guest''s calendar and set up an
    alarm to remind them of Hotels breakfast start time.


    # Journalism Industry


    The advancements in data science are resulting and the development of machines
    that could potentially process is highly subjective and emotionally driven content.
    Recently about one-third of the articles published by the "Bloomberg News" were
    generated by their artificial intelligence based system called "Cyborg". This
    system was designed to assist reporters and writing of News articles concerning
    the company''s quarterly earnings reports. The moment applicable financial data
    is available in the system the underlying machine learning algorithms can dissect
    the report and create news articles containing the most relevant facts and figures.


    "The Associated Press" also used robots to produce news articles on minor league
    baseball, "The Washington Post" used robots to produce news articles on high school
    football and "The Los Angeles" use robots to generate news articles on earthquakes.
    "The Guardians, Australia" successfully'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'published robot-assisted news articles detailing annual contributions and donations
    made to the Australian political parties. Even "Forbes" is incorporating robots
    into their journalism and recently launched testing on a robot called "Bertie"
    that is designed to draft story templates and assist reporters. "Bloomberg", "The
    Associated Press" and "The Post" have designed their systems to receive an internal
    alert in case of date abnormalities beyond a threshold that requires human intervention
    and decision-making to make the final call on whether a bigger story on that topic
    is warranted or not. "The Post" put this alert system to test in the "2016 Summer
    Olympics", by triggering alerts to their reporters every time one was 10% above
    or below an existing "Olympic World Record", via company’s business messaging
    system "Slack".


    "The work of journalism is creative, it’s about curiosity, it’s about storytelling,
    it’s about digging and holding governments accountable, it’s critical thinking,
    it’s judgment — and where we want our journalists spending their energy," — Lisa
    Gibbs, The Associated Press


    "The Dow Jones" and "The Wall Street Journal" have also made their entrance in
    the realm of data science by experimenting with artificial intelligence technology
    on routine tasks like identification of fabricated images or "deep fakes" and
    the generation of interview transcripts. "The New York Times" is utilizing big
    data analytics and machine learning algorithms in digitizing its library archives
    as well as for personalization of newsletters.


    # Travel Industry


    In a revolutionary effort to coordinate airline bookings made by travel agents
    across the country, the travel industry adopted large-scale industrial computing
    and pioneered the computer-based airline booking systems in the 1960s. Travel
    companies are gathering customer data that can be analyzed by big data analytics
    and machine learning algorithms to provide customers relevant future travel programs
    based on their travel history and recent flight searches. One of the major applications
    of machine learning technology in the travel industry is Smart pricing tools that
    are capable of autonomously adjusting flight prices on the basis of market demand
    and the weather conditions to optimize the airline business.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'All major airline companies are collecting Data on prospective travelers that
    have you browsed, shopped, booked, taken a flight or even changed their travel
    plans dad can be analyzed using artificial intelligence powered solutions degenerate
    actionable insights and provide personalized services to meet the customer needs
    and demands. The savvy traveler has access to a variety of tools and sites to
    browse and compare slides, hotels, buses, rental cars, and trains to get the most
    out of their money by striking the best deal.


    The fiercely competitive travel industry is adopting data science based technology
    to revolutionize the travel experience with highly customized and personalized
