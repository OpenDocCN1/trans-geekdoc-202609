  md: '# Chapter 7: Explore Machine Learning


    Machine Learning is a way of teaching programs that utilize data to generate algorithms
    rather than explicitly program an algorithm from scratch. This is a field of computer
    science that starts from the research into artificial intelligence. It''s closely
    related to statistics and mathematical optimization, which provide methods, application
    domains, and theories to the field. Machine learning is applied in different computing
    tasks where programming is infeasible. Examples of applications consist of e-mail
    spam filters, language translation, search engines, and computer versions. Sometimes
    machine learning can be confused with data mining, although it concentrates mainly
    on exploratory data analysis.


    Below are terms that will be applied in the following chapter:


    +   - Features: This describes specific traits that will help define the result.

    - Sample: A sample is an item to process. It can be a document, audio, image,
    or a CSV file.

    - Feature Vector: This refers to a numerical feature, like an n-dimensional vector,
    that represents some object.

    - Feature extraction: This describes the processing of a feature vector where
    data is converted from a high-dimensional space to a lower-dimensional space.

    - Training set: This describes a set of data that discovers highly predictive
    relationships.

    - Testing set: This describes a set of data that determines predictions.


    # Various Types of Machine Learning


    Machine learning is divided into three types depending on the nature of the learning
    target or the feedback present to the learning system:


    +   - Supervised Learning: The computer is assigned a set of inputs and their
    respective outputs. The goal of the program is to learn from the'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'inputs to reproduce the outputs.


    +   2. Unsupervised learning. There is no target variable in the case of unsupervised
    learning. The computer is left on its own to discover patterns inside the data.


    +   3. Reinforcement learning. A program has to interact with its environment
    in a dynamic style, such as driving a car.


    # Supervised Learning


    As said before, a supervised learning algorithm masters the training data and
    generates a function, which can be applied in predicting new instances.


    ![](img/43582740ac1227a817786ef73e0f3772_247_0.png)


    As you can see from the previous diagram, there is training data, which the machine
    learning model will learn from.


    Let''s say that the training data contains a set of text that represents different
    news articles. These news articles can be associated with sports, national, international,
    and different news categories. These news categories will act as labels. From
    the training data, you''ll extract feature vectors where each word can be a vector
    or could be extracted from the text. For example, the number of times of the phrase
    “Football” can be a vector, or the number of instances of the word “Prime Minister”
    can be a vector too.


    These feature vectors and labels are directed to the machine learning algorithm,
    which learns from the data. Once the model has been trained, it is later applied
    to the new data where the features are again extracted and inputted to the model,
    which generates the target data.


    Below are some examples of supervised machine learning algorithms, which'
