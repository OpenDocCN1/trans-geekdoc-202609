    # The K-means Clustering


    The k-means clustering is a technique of unsupervised learning that is important
    in segregating data of n observations into k buckets of the same observations.


    ![](img/43582740ac1227a817786ef73e0f3772_254_0.png)


    This clustering algorithm called so because it operates by computing the mean
    of the feature, which represents the dependent variables you cluster things like
    customer classification on an average transaction amount and the average number
    of products purchased in a quarter of a year. The average'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'value becomes the center of a cluster.


    The number of k points to the number of clusters. In other words, the technique
    involves calculating a k number of means, resulting in the clustering of the data
    around these k-means.


    How do We Select this K?


    If you''ve got some idea of what you are searching for or how many clusters you
    expect, or won''t, then you set K to be this number before you start the engines
    and allow the algorithm to compute along.


    If you don''t know the number, then your exploration will take a bit longer and
    involve some trial and error. For example, try k=3, 4, and 5 until you notice
    that the clusters make sense to the domain.


    ```

    $J(v) = \sum_{i=1}^{n} \min_{j=1}^{k} |x_i - v_j|^2$

    ```


    |x1-v1| describes the Euclidean distance between xi and vj, c1 within the ith
    cluster, the number of data points, c represents the number of clusters.


    The K-means clustering is usually applied in computer visions, geostatistics,
    and agriculture.


    The k-means clustering will be discussed later using real-life examples.


    # Hierarchical clustering


    Hierarchical clustering refers to an unsupervised learning approach where a hierarchy
    of clusters is derived out of observations.


    This clustering collects data at different levels of a cluster tree. It is not
    a single set of clusters, but a hierarchy of multiple levels where clusters at
    the specific level are connected as clusters on the next level. This enables you
    to choose the level of clustering that is most relevant.


    The hierarchical clustering consists of two types:


    +   Agglomerative hierarchical clustering. This is a bottom-up method where every
    observation begins in its own cluster and two other clusters as they move up a
    hierarchy.


    +   Divisive hierarchical clustering. This is a top-down approach where observations
    begin in a single cluster, and then they are split into two as they move down
    a hierarchy.


    The screenshot below describes Agglomerative and Divisive hierarchical clustering:'
