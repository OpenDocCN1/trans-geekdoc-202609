  md: '# Chapter 8: Dictionaries


    In this chapter, you will be learning about a new data structure—the languages.
    The dictionary (also known as a hashtable or hashmap in other languages) is one
    of the most powerful data structures Python has available to use. Luckily, since
    it''s built in to the Python language, you don''t have to implement it yourself.
    You will also be learning about tuples. What you will learn:


    +   * How to use a Dictionary Data Structure

    * How to use Tuples


    Mastering the Python dictionary will help you to model different real-world objects
    more accurately. You will create a dictionary representing a person and store
    unlimited information as you would like about the individual. You can store their
    location, name details, profession, and other features you can describe. You''ll
    be able to store two kinds of information that can be compared, a list of words,
    and their meaning.


    A dictionary in Python has key-value pairs. Each key is related to a value, and
    you can use a key to access the value linked to that key. The value of a key can
    be a string, number, or even a different dictionary. In fact, you can include
    any object that you can build in Python as a value in a dictionary. Python dictionaries
    are surrounded using braces, plus a series of key-value pairs within the braces.


    A key-value pair is a collection of values bounded to each other. You will present
    a key, Python will return the value linked with that key. The simplest dictionary
