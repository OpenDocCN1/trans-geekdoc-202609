- pgno: 204
  md: 'particular interval is provided by this formula:


    $$f(k;\lambda) = Pr(X=k) = \frac{\lambda^k e^{-\lambda}}{k!$


    In the following formula, e denotes Euler''s number, k is the total occurrences
    for which the probability is going to be determined, and lambda refers to the
    mean number of occurrences.


    Let''s explain this with an example. If the number of cars that travel through
    a bridge within an hour is 20. What is the likelihood of 23 cars traveling through
    the bridge in this hour? For this example, we shall apply the Poisson function
    from SciPy:


    ```

    from scipy.stats import poisson

    >>> rv = poisson(20)

    >>> rv.pmf(23)

    ```


    With the Poisson function, you define the mean value, which is 20 cars. The rv.pmf
    function reveals the probability, which is about 6%.


    # The Bernoulli distribution


    You can conduct an experiment based on two possible outcomes: success or failure.
    The probability of success is denoted by p, and the likelihood of failure is 1-p.
    Bernoulli distribution is defined as a random variable that takes the value of
    1 if there is success and 0 if there is a failure. The probability distribution
    formula for this is:


    $$P(n) = p^*(1-p)^{*$


    Also written as:


    $$P(n) = \begin{cases} 1-p & \text{for} 0 \ p & \text{for} 1 \end{cases$'
