  md: 'Accuracy is defined as the ratio of a correct prediction to the total number
    of predictions. From the confusion matrix, you know that the sum of TP and TN
    totals the number of correct predictions.


    Accuracy from the training set is normally very optimistic. It is important for
    someone to consider the test set''s accuracy value to define the true performance
    of the model.


    With the above knowledge, the first classification problem that you will consider
    is the k-nearest neighbor, shortened as KNN. Before jumping to details of KNN,
    let''s consider a simple classification algorithm known as the rote classifier
    memorizes the whole training data; it loads all the data within the memory. You
    need to conduct classification on an unseen new training instance. You will try
    to match the new training instance using any of the training instances within
    the memory. It will match each attribute within the training instance. In case
    it discovers a match, it predicts the class label of the test insurance as the
    class label of the matched training instance.


    So far, you need to know that this classifier will fail in the test instance isn''t
    similar to any of the training instances loaded into the memory.


    KNN resembles the rote classifier, except that instead of searching for an exact
    match, it applies a similarity measure. Resembling the rote classifier, KNN loads
    all the training sets into the memory. When it requires to classify a test instance,
    it determines the distance between the test instance and all the training instances.
    Using the above distance, it selects K''s closest instances within the training
    set. Next, the prediction for the test set is defined based on the number of classes
    of the K nearest neighbors.


    For example, if you have a two-class classification problem and select the K value
    as three, and if the test record''s three nearest neighbors have classes, 1, 1,
    and 0, it will categorize the test instance as 1, which the popular. KNN is part
    of the family algorithms known as instance-based learning. Besides, the decision
    to categorize a test instance is considered last; it is also known as the lazy
    learner.


