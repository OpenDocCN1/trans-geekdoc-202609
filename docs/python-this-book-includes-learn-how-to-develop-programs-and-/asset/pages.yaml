  md: '# Chapter 1: History of Artificial Intelligence


    We start by exploring early efforts to define artificial intelligence.

    The history of artificial intelligence may sound like a deep and impenetrable
    subject for individuals who are not well-acquainted with computer science and
    its related fields.


    Regardless of how mysterious and untouchable artificial intelligence may look,
    when it''s broken down, it becomes easy to understand that you might imagine.


    So, what is artificial intelligence, otherwise referred to as “AI”?

    AI is a branch of computer science that concentrates on non-human intelligence
    or machine-driven intelligence.


    AI relies on the concept that human thought functionality can be replicated.

    Early thinkers pushed the concept of artificial intelligence throughout the 1700s
    and beyond. During this period, it became more tangible. Philosophers imagined
    how the idea of human thinking could be artificially computerized and transformed
    by intelligent machines.


    The human thinking that generated interest in AI eventually resulted in the invention
    of the programmable digital computer in the 1940s. This particular discovery finally
    pushed scientists to proceed with the concept of building an “electronic brain,”
    or an artificially intelligent being.


    Besides, mathematician Alan Turing, had developed a test that ascertained the
    potential of a machine to emulate human actions to the degree that was indifferent
    from human actions.


    From the 1950s, many theorists, logicians, programmers broadened the modern mastery
    of artificial intelligence as a whole.

    During this period, intelligence was viewed as a product of “logical” and “symbolic”
    reasoning. The reasoning was executed by computers using search algorithms. The
    focus during this time was to replicate human intelligence by solving simple games
    and proving theorems. Soon, it became obvious that these algorithms could not
    be used to find solutions to problems such as the movement of a robot in an unknown
    room. Extensive knowledge of the real world would have been required to avoid
    a “combinatorial” explosion of the problem to solve.


    Come in the 80s; it was pragmatically accepted to restrict the AI scope to specific
    tasks like the replication of intelligent decision making for the'
