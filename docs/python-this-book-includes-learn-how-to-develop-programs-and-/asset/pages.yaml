    # Identifying the Nearest Neighbors


    Before we dive in, let''s take time to understand how to verify whether the classification
    model is working to our satisfaction. At one point in the chapter, we discussed
    the confusion matrix.

    A confusion matrix refers to the arrangement of the actual versus the predicted
    class tables. Say, for example, that you have a two-class problem, that is, your
    y can take value, T, or F. Assume you have trained a classifier to predict your
    y. You have predicted the value of y from your model. Then you can complete your
    confusion matric using like this:


    | | Predicted | |

    |---|---||

    | **Actual** | T | F |

    | TP | FN |

    | FP | TN |


    In the above table, is important to list the results from the test set. Keep in
    mind that you know the class labels in the test set; thus, you can compare the
    classification model output with the actual class label.


    +   - Below TP, which stands for True Positive, it has a count of all those records
    within the test set whose labels feature T, and where the model is predicted T.


    +   - Below the FN, which stands for False Negative, you have a count of all the
    records whose actual label is T, but the algorithm is predicted as N.


    +   - FP stands for False Positive, where the actual label is F, but the algorithm
    is predicted as T.


    +   - TN stands for True Negative, where the algorithm predicted both the label
    and the original class label as F.


    With the above knowledge about the confusion matrix, you can extract performance
    metrics using the measure of the quality of our classification model.'
