    \ values. Scaling refers to dividing every value by the variable's standard deviation,\
    \ and lastly, standardization is centering, followed by scaling. Using variables\
    \ _mean and _std function, the scale can be used to conduct all three normalization\
    \ techniques.\n\n# How it Operates\n\nThe Iris dataset contains four columns.\
    \ While there are many columns, it will still meet its purpose. The intention\
    \ is to reduce the dimensionality of the Iris dataset to two from four and still\
    \ store all the details about the data.\nYou will load the Iris data to the x\
    \ and y variables using the handy load_iris function from scikit-learn. The x\
    \ variables represent a data matrix, and you can review its shape as follows:\n\
    \n```\n>>>shape\n(150, 4)\n```\n\nYou scale the matrix to have zero mean and unit\
    \ standard deviation. The rule of thumb is that if all your columns are measured\
    \ with the same scale in your data and the feature the same unit of measurement,\
    \ you don't need to scale the data. This will enable PCA to capture these basic\
    \ units using the highest variation.\nYou can move on to create a correlation\
    \ matrix of our input data.\nThe correlation matrix containing n random variables\
    \ X1... Xn is then x n matrix whose, jentry is corr(Xi, Xj).\nNext, you will apply\
    \ the SciPy library to compute the Eigenvalues and Eigenvectors of the matrix.\
    \ Let's consider our Eigenvalues and Eigenvectors.\n\n```\nprint Eigen values\
    \ \\n%%(eig_val)\nprint \\n Eigen vectors \\n%%(r_eig_vec)\n```\n\nThe output\
