- pgno: 219
  md: '# Chapter 5: Python Libraries-Pygal


    # Why Should You Use Pygal?


    In Python development, there are a lot of libraries for charts (Matplotlib and
    plotly are just a few examples), and different resources have been created for
    many of them. Because this is an introduction to data charting, you need a simple
    to use the library where new developers to Python charting can be able to follow
    the code provided.


    Pygal is a Python-based SVG Charts creator developed by Kozea. This is a community
    committed to building quality open source libraries, mainly Python-based.


    The Pygal library comes with multiple charting options beyond what is defined
    as standard charts: line charts, pie graphs, and bar charts. It contains a world
    map, radar charts, box plots, and funnel charts. It also comes with prebuilt themes
    and styles, which you don''t need to customize if you are not forced to do so.
    Additionally, because the chart library''s output is SVG, this makes it a flexible
    output for HTML5 or even print media. One problem with chart libraries in Python
    language is that the output defaults to the PNG format with a particular image
    size. Because SVG is a vector graphic, it is possible to be scaled and resized
    for any need without damage to quality.


    You can navigate to the http://pygal.org/: website.


    The Pygal website is made up of a beautiful and easy to read the documentation.
    One thing that is obvious with third-party Python libraries is that the documentation
    can comprise of a well-documented, online-searchable wiki to some readme.txt file
    that only reveals how to install the library. Additionally, the Pygal library
    doesn''t need a lot of dependencies, which is important for an introductory book.


    A lot of Python frameworks pick picky dependencies that you may require for your
    project, but they may or not work with your system.


    The lxml library is the only library required for pygal, but it has several issues
    depending on the kind of operating system you are executing your Python code.
    It is important that you take the time to reread the notes on lxml before you
    can head straight to pygal installation.'
  merge: -1
  img_proc: true
