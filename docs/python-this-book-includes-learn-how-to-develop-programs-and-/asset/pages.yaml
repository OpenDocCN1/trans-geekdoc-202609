    \ 0.02060771+0.j] |\n| Eigen vectors |\n| [[ 0.52237162 -0.37231836 -0.72101681\
    \ 0.26199559]\n [-0.26335492 -0.9555646 0.24203288 -0.12413481]\n [ 0.58125401\
    \ -0.02109478 0.14009226 -0.00115427]\n [0.56561105 -0.06541577 0.6338814 0.52354627]]\
