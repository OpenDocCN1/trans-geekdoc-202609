    180, 180, 205, 215, 230, 66, 52, 65, 97, 150, 245,

    175, 66, 91, 113, 264, 175, 335, 109]

    >>> stats.pearson(mpg,hp)

    (-0.7761837182658638, 1.7878352541210661e-07)

    ```


    The first value of the output assigns the correlation between the horsepower and
    the mileage, while the second value provides the p-value.

    Therefore, the first value indicates that it is highly negatively associated,
    and the p-value shows that there is a huge correlation between them.

