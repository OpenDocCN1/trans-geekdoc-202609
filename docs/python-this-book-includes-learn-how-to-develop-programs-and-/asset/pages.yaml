  md: 'most prominent question is the number of components that we need to select.

    In the next section, you will learn different ways of determining the number of
    components.

    You will see that you select only the first two columns of the right-hand side
    Eigenvectors. The discrimination potential of the retained components on the Y
    variable is a great test of how variation is retained in the data.

    Lastly, you will plot the components in the x and y axes and color them using
    the target variable.


    ![](img/43582740ac1227a817786ef73e0f3772_294_0.png)


    Notice that the components 1 and 2 can discriminate the three classes of the iris
    flowers. Hence, you''ll effectively use PCA in limiting the dimension to two from
    four and still discriminate the instances belonging to different classes of the
    iris flower.

    Here are additional ways to help you determine the number of components you need
    to include. Here is a list of methods to choose the components empirically.


    +   1. The Eigenvalue criterion.


