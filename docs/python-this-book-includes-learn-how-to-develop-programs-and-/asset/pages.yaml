  md: 'I know it''s going to take your time, you will need to spend a lot of time
    Googling, but that''s how the best developers start.


    # Start with a Flask


    If you have never learned any programming language or web development, and you
    want to learn Django, a great idea is to begin with a flask. Flask is great option
    for Django. It''s more straightforward and easier to understand.


    Flask is good for the introduction, as it has more functionalities, but they need
    to be implemented by you. With flask, what you see is what you get. Nothing else.
    And it''s pretty damn easy.


    # Dive into Web Development with Django


    Once you master the basics of Python language, and you completed your first small
    programs. Now, you''re ready to learn Django.


    # Master New Django Concepts


    You have learned how to create a project in Django. You understand how the Model
    View Template works. Well, but there is a lot more to learn. So much more.


    The secret is to learn new concepts such as Signals, Logging, Testing, and so
    on.


    Remember, this is not a race. Spend time to read the documentation. Try it. Don''t
    ever attempt to memorize. But learn how it works. What elements are moving, why
    should you apply that concept, and when should you use it. And next....


    # Start Applying Those New Concepts


    Immediately you learn something new, use it. There is no perfect way to internalize
    something than applying it right away. Develop a small project where you can use
    it, or better, add it to the current one.


    # Read Code from Experts


    If you want to become an expert Django developer, then you need to read code from
    professionals. The internet is an excellent resource for information. Why don''t
    you get'
