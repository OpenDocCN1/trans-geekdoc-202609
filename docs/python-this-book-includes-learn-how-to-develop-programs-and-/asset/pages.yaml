    # Zip and Argument Unpacking


    Typically, you will want to zip two or more lists together. Zip changes multiple
    lists into a single list of tuples of corresponding elements. In case the lists
    are are of different lengths, zip stops immediately at the first list ends.

    Still, you can “unzip” a list using a unique trick:


    ```

    pairs = [[''a'', 1), (''b'', 2), (''c'', 3)]

    letters, numbers = zip(*pairs)

    ```


    The asterisk computes argument unpacking, which relies on the elements of pairs
    as individual arguments to zip. It finishes as if you''d called.


    ```

    zip((''a'', 1), (''b'', 2), (''c'', 3))

    ```


    Argument unpacking can be applied with any function:


    ```

    def add(a, b): return a + b

    add(1, 2) # returns 3

    add([1, 2]) # TypeError!

    add(*[1, 2]) # returns 3

    ```


    It is rare that you''ll find this handy, but once you do, it''s a powerful trick.'
