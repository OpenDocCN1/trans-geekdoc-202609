    \ initialized with side3 and side4 set to none. Opposite sides are equal by the\
    \ constructor of the rectangle class. Remember that it has automatically inherited\
    \ the perimeter() method. Hence there is no need to redefine it.\n\nExample: Inheritance\n\
    class rectangle(quadrilateral):\n    def __init__(self, a, b):\n        super().__init__(a,\
    \ b, a, b)"
