  md: '# K-nearest Neighbors Classifier


    The “k-nearest neighbors (k-NN)” algorithm is referred to as “a non-parametric
    method used for classification and regression in pattern recognition.” In cases
    of classification and regression, “the input consists of nearest k closest training
    examples in the feature space.” K-NN is a form of “instance-based learning,” or
    “lazy learning,” in which the function is only locally estimated, and all calculations
    are delayed until classification. The output is driven by the fact, whether the
    classification or regression method is used for “k-NN”


    +   - “k-nearest neighbors classification” - The “output” is a member of the class.
    “object” is classified by its neighbors’ plurality vote, assigning the object
    to the most prevalent class among its nearest “k-neighbors,” where “k” denotes
    a small positive integer. If k=1, the “object” is simply allocated to the closest
    neighbor’s class.

    - “k-nearest neighbors regression” - The output is the object’s property value,
    which is computed as an average of the k-nearest neighbors’ values.


    A helpful method for both classification and regression can be assigning weights
    to the neighbors’ contributions to allow closer neighbors to make more contributions
    in the average compared to the neighbors far apart. For instance, a known “weighting
    scheme” is to assign each neighbor a weight of “1/d,” where “d” denotes the distance
    from the neighbor. The neighbors are selected from a set of objects for which
    the “class” (for “k-NN classification”) or the feature value of the “object” (for
    “k-NN regression”) is known.


    Here are the steps and code for this algorithm to build our new ML model:


    Step 1 – To import required modules, use the command “from sklearn.neighbors import
    KNNClassifier” and “from sklearn.metrics import accuracy_score”.


    Step 2 – In creating the object of the classifier, use command “neigh = KNeighborsClassifier(n_neighbors=3)”.


    Step 3 – In training the algorithm, use command “neigh.fit(data_train, target_train).”'
