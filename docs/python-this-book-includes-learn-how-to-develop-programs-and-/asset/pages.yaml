  md: 'Things begin to get messy once you curry arguments in the middle of the function,
    so you''ll try to avoid doing that.

    Typically, you will apply map, reduce, and filter, which present functional alternatives
    to list comprehensions:


    ```

    def double(x):

    return 2 * x

    xs = [1, 2, 3, 4]

    twice_xs = [double(x) for x in xs] # [2, 4, 6, 8]

    twice_xs = map(double, xs) # the same as above

    list_doubler = partial(map, double) # *function* that doubles a list

    twice_xs = list_doubler(xs) # again [2, 4, 6, 8]

    ```


    You can apply a map with multiple-argument functions if you create multiple lists.

    Likewise, if the filter performs the task of list-comprehension if:


    ```

    def is_even(x):

    ""True if x is even, False if x is odd""

    return x % 2 == 0

    x_evens = [x for x in xs if is_even(x)] # [2, 4]

    x_evens = filter(is_even, xs) # the same as above

    list_evener = partial(filter, is_even) # *function* that filters a list

    x_evens = list_evener(xs) # again [2, 4]

    ```


    And reduce will combine the first two elements of a list, then that output with
    the third, with the fourth, and so on, generating a single result.


