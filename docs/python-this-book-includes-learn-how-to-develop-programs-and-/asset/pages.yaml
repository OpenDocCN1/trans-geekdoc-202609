    A machine learning decision tree can be defined as "a tree-like graphical representation
    of the decision-making process, by taking into consideration all the conditions
    or factors that can influence the decision and the consequences of those decisions".
    Decision trees are considered one of the simplest "supervised machine learning
    algorithms", with three main elements: "branch nodes" representing conditions
    of the data set, "edges" representing the ongoing decision process and "leaf nodes"
    representing the end of the decision.


    The types of decision trees are: "Classification tree" that is used to classify
    data based on the current data available in the system; "Regression tree" which
    is used to make a forecast for predictions for future events based on the current
    data in the system. Both of these trees are heavily used in machine learning algorithms.
    A widely used terminology for decision trees is "Classification and Regression
    trees" or "CART".


    Let''s look at how you can build a simple decision tree based on a real-life example.


    Step 1: Identify what decision needs to be made, which will serve as a "root node"
    for the decision tree. For this example, a decision needs to be made on "What
    would you like to do over the weekend?\ Unlike real trees, the decision tree has
    its roots on top instead of the bottom.


    Step 2: Identify conditions or influencing factors for your decision which will
    serve as "branch nodes" for the decision tree. For this example, conditions could
    include "would you like to spend the weekend alone or with your friends?" and
    "how is the weather going to be".


    Step 3: As you answer the conditional questions, you may run into additional conditions
    that you might have ignored. You will now continue to your final decision by processing
    all the conditional questions individually, bifurcations will serve as "edges"
    of your decision tree.'
