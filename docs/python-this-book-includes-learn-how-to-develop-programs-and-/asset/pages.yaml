- pgno: 271
  md: 'Let’s take time to explore the following feature test condition. In general,
    every instance attribute can be either understood.


    **Binary attribute:** This is where a property can accept two possible values,
    for example, true or false. The property test condition should display two values
    in the following case.


    **Nominal attribute:** This is the case where a property can accept more than
    two values, for example, n values. The property test condition should display
    either output n or group them into binary splits.


    **Ordinal attribute:** This is where an implicit order in their values exists.
    For instance, let’s consider an imaginary feature called size, which can accept
    the values small, medium, or large. There are three values that the property can
    take, and there is an order for: small, medium, large. They are taken care of
    by the property test condition that is similar to the nominal attribute.


    **Continuous attributes:** These are properties that can accept continuous values.
    They are categorized into ordinal attributes and then handled.

    A property test condition is a means to split the input records into subsets depending
    on criteria or metric known as impurity. This impurity is computed with reference
    to the class label for every attribute in the instance.

    The property contributing to the highest impurity is selected as the data splitting
    attribute, or in other words, the node for selected particular level in the tree.


    Let’s look at an example to describe it. You will employ a measure known as entropy.

    The entropy is defined as follows:


    ```

    E(X)=-\sum_{i=1}P(x_i)\log_2(P(x_i))

    ```


    Consider the following example:

