    For a two-tailed test, when a given percentage of 5% is used, then it''s distributed
    equally on both sides. In this case, it is 2.5% on one side, and 2.5% on the opposite
    side.

    Here''s an example to illustrate this. The average score of mathematics exam at
    a national level is 60 marks, and the standard deviation is 3 marks. The average
    marks of the class is 53. The null hypothesis refers to the mean marks of the
    class, similar to the national average. First, let''s test the following hypothesis
    by first finding the z-score 60.


    ```

    >>> zscore = ( 53 - 60 ) / 3.0

    >>> zscore

