  md: '# Lists


    Perhaps the most important data structure in Python language is the list. A list
    can be defined as an ordered collection. Lists in python share a lot of features
    with lists in other languages.

    To check for list membership in Python, you use the in operator as shown below:


    ```

    1 in [1, 2, 3] # True

    0 in [1, 2, 3] # False

    ```


    It’s a straightforward process to concatenate lists:


    ```

    x = [1, 2, 3]

    x.extend([4, 5, 6]) # x is now [1,2,3,4,5,6]

    ```


    Still, you have the option to use x,

    If you don''t want to alter x, you can use list addition.


    ```

    x = [1, 2, 3]

    y = x + [4, 5, 6] # y is unchanged

    ```


    Most of the time, you’ll append lists to a single item at a time.

    It is effective to unpack lists if you already understand the total number of
    elements they can store. However, if the number of elements on both sides isn’t
    the same, you will see a value.

    It’s common to write the underscore for a value you want to throw away:


    ```

    _, y = [1, 2] # now y == 2, didn''t care about the first element

    ```


    # Dictionaries


    The dictionary, also referred to as a hashtable, is one of the most robust data
    structures Python has available to apply. Fortunately, because it’s built into
    the Python language, you don’t need to run it yourself.

    The dictionary is a useful data structure that features a ‘key’ and a ‘value.’'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'Every key is special within the dictionary and has a connected value.

    However, the connected value doesn''t need to be special.

    Some of the practical examples of the dictionary include:


    +   - Your Subway Loyalty Card

    - A student identification number at the university

    - A phone book

    - A physical dictionary


    The key within the dictionary can be a number or a string. In fact, it can be
    any data type. The main point is that the key should be unique!

    On learning programming, a dictionary is one of the many data structures present
    that is built into the Python language. In fact, there are many other data structures
    and algorithms available that we have always at our disposal. It might even get
    intimidating.


    To create a dictionary to model a phone book, you will need to choose your key
    will contain a value or a name. In the previous example, you can use a phone number.
    Phone numbers are unique, and hence they''re the best candidate for a key. Still,
    you can use a name as a key, because it is easier to recall a person''s number.


    ```

    phoneBook = (''Mike'': 5555555) # ''Mike'' is the key

    ```


    In this example, you can only have a friend named Mike. If you need more Mike''s,
    you will need to store them as Mike01, Mike03, etc.

    But you can print a specific entry from the phonebook using the example below:


    Print phonebook {''Mike''}


    If you want to display the whole details of the phonebook, you can apply the print
    command.


    With time, you''ll want to expand and change the dictionary, so that you can add
    more entries.'
