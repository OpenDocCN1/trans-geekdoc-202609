- pgno: 56
  md: '# 1. Problem Definition


    In this stage, the business problem that needs to be resolved using a machine
    learning model will be identified and documented with all pertinent details.


    # 2. Data Ingestion


    The first stage of any machine learning workflow is to channel input data into
    a database server. The most important thing to remember is that the data is ingested
    raw and with no modification to enable us to have an invariable record of the
    original dataset. Data may be supplied from a variety of sources that can be acquired
    through request or transmitted from other systems.


    "SQL databases are best suited to store huge amount of defined and labeled as
    well as unorganized raw data, that is quickly evolving as they do not need to
    adhere to a predefined scheme. It provides a "distributed, scalable and replicated
    data storage".


    # “Offline”


    Data will flow in the "offline" layer to the raw data storage through an "Ingestion
    Service", which is a "composite orchestration service that is capable of encapsulating
    the data sourcing and persistence". A repository model is used internally to communicate
    with a data service that will interact with the data storage in exchange. When
    you save the data in the database, a unique batch Id will be given to the dataset,
    which allows for an effective query of the data as well as end-to-end tracking
    and monitoring of the data.


    To be computationally efficient, the ingestion of data is distributed between
    two folds.


    +   - The first one is a specific pipeline for every dataset so that of the datasets
    can be processed individually and simultaneously.

    - The second aspect is that within each pipeline line can be divided to make the
    best of a variety of server cores, processors and perhaps even the entire server.


    Distributing the prepping of data across several vertical and horizontal pipelines
    will reduce the total time required to perform the tasks.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'The "ingestion service" would run at regular intervals on the basis of a predefined
    schedule (one or more times a day) or upon encountering a trigger. A subject will
    decouple producers (data source) from processors, which would be the data pipeline
    for this example, so when the source data is collected, the "producer system"
    will send a notification to the "broker" and subsequently the "embedded notification
    service" will respond by inducing ingestion of the data. The "notification service"
    would also inform the "broker" that the processing of the original dataset was
    completed with success and now the dataset is being stored in the database.


    # **Online**


    The "Online Ingestion Service" makes up the entrance to the "streaming architecture"
    of the online layer, as it would decouple and manage the data flow from the source
    to the processing and storage components by offering consistent, high performance,
    low latency functionalities. It also works as an enterprise-level "Data Bus".
    Data would be stored on a long-term "Raw Data Storage", which also serves as a
    mediating layer to the subsequent online streaming service for further processing
    in real-time. For instance, such techniques are utilized in this case may be "Apache
    Kafka (pub/sub messaging system)" and "Apache Flume (data collection to the long-term
    database)". A variety of other techniques are available and can be selectively
    applied based on the technology stack of the business.


    # **3. Data Preparation**


    After the information has been ingested, a centralized pipeline would be produced
    that can evaluate the condition of the data, meaning it would search for format
    variations, outliers, patterns, inaccurate, incomplete, or distorted information
    and correct any abnormalities through the process. The "feature engineering process"
    is also included in this stage. The 3 primary characters of a feature pipeline
    as depicted in the picture below are: "extraction, transformation, and selection".'
  merge: -1
  img_proc: true
- pgno: 58
  md: '| Phase | Input | Output |

    |---|---|--|

    | Extract | Raw data | Feature |

    | Transform | Feature | Feature |

    | Select | List<Feature> | List<Feature> |


    Since this tends to be the most complicated component of any machine learning
    project, it is essential to introduce appropriate design patterns. In the context
    of coding, it implies the use of a factory technique to produce features on the
    basis of certain shared abstract function behavior and a strategy pattern for
    selecting the correct features at the time of execution can be considered a logical
    approach. It is important to take into consideration the composition and re-usability
    of the pipeline while structuring the "feature extractors" and the "transformers".


    The selection of functionalities could be attributed to the caller or could be
    automated. For instance, a "chi-square statistical test" can be applied to classify
    the impact of each functionality on the concept label, while discarding the low
    impact features before starting to the model. To accomplish this, a number of
    "selector APIs" can be identified. In any case, a unique ID must be allocated
    to each feature set so to make sure that the features used as model inputs and
    for impact scoring are consistent. Overall, it is necessary to assemble a data
    preparation pipeline into a set of unalterable transformations, which could be
    readily combined. Now the importance of "testing and high code coverage" will
    become a critical factor in the success of the model.


    # ### 4. Data Segregation


    The primary goal of the machine learning model is the development of a high accuracy
    model on the basis of the quality of its forecasts and predictions derived from
    the new input data, which was not part of the training dataset. Therefore, the
    available labeled dataset will be utilized as a "proxy" for future unknown input
    data by dividing the data into training and testing datasets. Many approaches
    are available to split the dataset and some of the most widely used techniques
    are:


    +   - Using either the default or customized ratio to sequentially divide the
    dataset into two subsets in order to ensure that there is no overlap in'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'the sequence in which the data appears from the source. For example, you could
    select the first 75% of data to train the model and the consequent 25% of data
    to test the accuracy of the model.


    +   Splitting the dataset into training and testing subset using a default or
    custom ratio with a random seed. For example, you could choose a random 75% of
    the dataset to train the model and the remaining 25% of the random dataset to
    test the model.


    +   Using either of these techniques ("sequential vs. random") and then also mixing
    the data within each data subset.


    +   Using a customized approach for splitting the data with extensive control
    over the segregation of the data is required.


    Technically the data segregation stage is not considered as an independent machine
    learning pipeline, however, an "API" or tool has to be provided to support this.
    In order to return the required datasets, the next 2 stages ("model training"
    and "model assessment") must be able to call this "API". As far as the organization
    of the code is concerned, a "strategy pattern" is required that the "caller service"
    can select the appropriate algorithm during execution and the capability to inject
    the percentage or random seed is obviously required. The "API" must also be prepared
    to return the information with or without labels, to train and test the model
    respectively. A warning can be created and passed along with the dataset to secure
    the "caller service" from defining parameters that could trigger the uneven distribution
    of the data.


    # 5. Model Training


    The model pipelines are always "offline", and its schedule will vary a matter
    of few hours to just one run per day, based entirely on the complexity of the
    application. The training can also be initiated by time and event, and not just
    by the system schedulers.


    It includes a number of libraries of machine learning algorithms such as "linear
    regression, ARIMA, k-means, decision trees" and many more, which are designed
    to make provisions for the rapid production of new model types as well as making
    the models interchangeable. Containment is also important for the integration
    of "third-Party APIs" using the "facade pattern" (at this stage the "Python Jupyter
    notebook" can also be called).'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'You have several choices for "parallelization":


    +   - A specialized pipeline for individual models method, which means all the
    models can be operated at the same time.

    - Another approach would be to duplicate the training dataset, i.e. the dataset
    can be divided and each data set will contain a replica of the model. This approach
    is favored for the models that require all fields of an instance for performing
    the computations, for example, ''LDA'', ''MF''.

    - Another approach can be to parallelize the entire model, meaning the model can
    be separated and every partition be responsible for the maintenance of a fraction
    of the variables. This approach is best suited for linear machine learning models
    like ''Linear Regression'', ''Support Vector Machine''.

    - Lastly, a hybrid strategy could also be utilized by leveraging a combination
    of one or more of the approaches mentioned above.


    It is important to implement train the model while taking error tolerance into
    consideration. The data checkpoints and failures on training partitions must also
    be taken into account, for example, if every partition fails due to some transient
    problem like timeout, then every partition could be trained again.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 6. Candidate Model Evaluation


    The model evaluation stage is also always "offline". By drawing a comparison of
    the predictions generated with the testing dataset with the actual data values
    using several key performance indicators and metrics, the "predictive performance"
    of a model can be measured. To generate a prediction on future input data, the
    "best" model from the testing subset will be preferred. An evaluator library consisting
    of a number of evaluators can be designed to generate accuracy metrics such as
    "ROC curve" or "PR curve", which can also be stored in data storage against the
    model. Once, the same techniques are applied to make it possible to flexibly combine
    and switch between evaluators.


    The "Model Evaluation Service" will request the testing dataset from the "Data
    Segregation API" to orchestrate the training and testing of the model. Moreover,
    the corresponding evaluators will be applied for the model originating from the
    "Model Candidate repository". The findings of the test will be returned and saved
    in the repository. In order to develop the final machine learning model, an incremental
    procedure, hyper-parameter optimization, as well as regularization methods, would
    be used. The best model would be deemed deployable to the production environment
    and eventually released in the market. The deployment information will be published
    by the "notification service".


    # 7. Model Deployment


    The machine learning model with the highest performance will be marked for deployment
    for "offline (asynchronous)" and "online (synchronous)" prediction generation.
    It is recommended to deploy multiple models at the same time to ensure the transfer
    from obsolete to the current model is made smoothly, this implies that the services
    must continue to respond to forecast requirements without any lapse, while the
    new model is being deployed.


    Historically, the biggest issue concerning deployment has been pertaining to the
    coding language required to operate the models that have not been the same as
    the coding language used to build them. It is difficult to operationalize a "Python
    or R" based model in production using languages such as "C++, C # Java". This
    also leads to a major reduction in the performance in terms of speed and accuracy,
    of the model being deployed.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'This problem can be dealt with in a few respects as listed below:


    +   - Implementing new language for rewriting the code, for example, "Python to
    C# translate".

    - Creating customized "DSL (Domain Specific Language)" to define the model.

    - Creating a "micro-service" that is accessible through "RESTfulful APIs".

    - Implementing an "API first" approach through the course of the deployment.

    - Creating containers to store the code independently.

    - Adding serial numbers to the model and loading them to "in-memory key-value
    storage".


    In practice, the deployment activities are automated through the use of "continuous
    delivery implementation", which ensures the packaging of the files, validation
    of the model via a robust test suite as well the final deployment into a running
    container. An automated building pipeline can be used to execute the tests, which
    make sure that the short, self-containing and stateless unit tests are conducted
    first. When the model has passed these tests, its quality will be evaluated in
    larger integrations and by executing regression tests. If both the test phases
    have been cleared, the model is deemed ready for deployment in the production
    environment.


    # 8. Model Scoring


    The terms "Model Scoring" and "Model Serving" are being used synonymously throughout
    the industry. Model Scoring can be defined as "the process of generating new values
    with a given model and new input data. Instead of the term "prediction", a generic
    term "score" is being used to account for the distinct values it may lead to,
    as listed below:


    +   - List of product recommendations.

    - Numerical values, for the "time series models" as well as "regression models".

    - A "probability value" indicates the probability that a new input can be added
    to a category that already exists in the model.

    - An alphabetical value indicating the name of a category that most resembles
    the new input data.'
  merge: -1
  img_proc: true
