    # XY Charts


    The XY charts are popular in scientific data to represent numerous values at different
    periods. They can display negative values too. These charts can output various
    sets to increase readability. Now create a simple xy chart with two points by
    using the code presented below.


    ```

    # -*- coding: utf-8 -*

    import pygal

    xy_chart = pygal.XY()

    xy_chart.add(''Value 1'', [-50, -30), (100, 45)])

    xy_chart.render_to_file("xy_chart.svg")

    ```'
  merge: -1
  img_proc: true
