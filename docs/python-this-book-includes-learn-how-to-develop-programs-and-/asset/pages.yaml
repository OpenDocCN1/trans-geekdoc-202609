  md: 'in learning data relationships and structure. One way of understanding statistical
    learning is to identify the connection between the “predictor” (autonomous variables,
    attributes) and the “response” (autonomous variable), in order to produce a specific
    model which is capable of predicting the “response variable (Y)” on the basis
    of “predictor factors (X)”.


    $X = f(X) + \epsilon$ where $X = (X1, X2, . . , Xp)$, where “f” is an “unknown
    function” & $\epsilon$ is “random error (reducible or irreducible)”.


    Here are some fundamental concepts of Statistical Learning:


    # Prediction and Inference


    If there are a number of inputs “X” easily accessible, but the “B” production
    is unknown, “f” is often treated as a black box, provided that it generates accurate
    predictions for “Y”. This is called “prediction”. There are circumstances in which
    we need to understand how “Y” is influenced as “X” changes. We want to estimate
    “f” in this scenario, but our objective is not simply to generate predictions
    for “Y”. In this situation, we want to establish and better understand the connection
    between “Y” and “X”. Now “f” is not regarded as a black box since we need to understand
    the underlying process of the system. This is called “inference”. In everyday
    life, various issues can be categorized into the setting of “predictions”, the
    setting of “inferences”, or a “hybrid” of the two.


    # Parametric and Non-Parametric Techniques


    The “parametric technique” can be defined as an evaluation of “f” by calculating
    the set parameters (finite summary of the data) while establishing an assumption
    about the functional form of “f”. The mathematical equation of this technique
    is “$f(X) = \beta0 + \beta1X1 + \beta2X2 + . . + \betaXp$”. The “parametric models”
    tend to have a finite number of parameters which is independent of the size of
    the data set. This is also known as “model-based learning”. For example, “k-Gaussian
    models” are driven by parametric techniques.


    On the other hand, the “non-parametric technique” generates an estimation of “f”
    on the basis of its closeness to the data points, without making any'
