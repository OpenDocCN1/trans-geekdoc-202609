    ```


    The p-value would be:


    ```

    >>> prob = stats.norm.cdf(zscore)

    >>> prob

    0.009815328628645336

    ```


    In this case, the p-value is 0.98%. The null hypothesis is to be rejected, and
    the p-value should be lower than 2.5% in either direction of the bell curve. Because
