    # Cleansing of Data


    Data, while in row form, deserves some cleaning before it can be analyzed or a
    dashboard builds on it. There are many factors that may make data to have problems.
    For example, the Point of Sale system at a retail shop may have malfunctioned
    and entered some data with missing values. This section will teach you how to
    handle such data.


    # Search for Missing Data


    In general, most data will feature missing values. There could be different reasons
    for this: the source which gathers the data might not have collected the values,
    or the values may never have existed. Once you have data loaded, it is important
    to search for the missing features in the data. Based on the requirements, the
    missing data has to be handled. It can be taken care of by eliminating a row or
    replacing a missing value with an alternative value.


    In the case of the Student Weight data, to verify whether the location column
    has missing value, you can use the command below:


    ```

    >>> d[''Location 1''].isnull()

    ```'
