- pgno: 237
  md: '# Chapter 6: Data Analysis


    Analyzing a dataset to identify patterns is an art. There can be different metrics
    related to a dataset, and you would like to identify the needle in the following
    haystack. For your case, the needle is the insight you are searching for in the
    data that you aren''t aware of. In this case, insight may refer to relevant information
    about people who purchase milk of a certain brand and also purchase cereals of
    another company. The retail store can arrange the products close to each other.

    Whenever you choose to analyze a dataset, you need to have a deep knowledge of
    it and also of the domain that is related with. If it''s a simple dataset that
    can be understood easily, then the analysis should be done directly, but if the
    dataset has some similarities to the sensor data of a turbine, then the field
    of knowledge of how turbines operate and what is important to their operation
    will increase richness to your analysis.

    The mastery of a domain allows you to navigate your analysis.


    # What is Data Mining?


    Data mining refers to the process of exploring data and discovering patterns in
    the application of machine learning, database systems, and statistics. The end
    result of data mining is to extract important information from data, which can
    be optimized to boost revenue, limit costs, or even save lives through some of
    its applications.


    When you have a dataset that you need to mine, it''s not feasible to apply all
    the data-mining techniques that are available on each column field of the data
    to extract insights. This will be a difficult task, and it will take a long time
    to extract any important insights.


    To increase the process of data mining, understanding of domains is critical.
    With the following knowledge, one can understand what the data represents and
    how to analyze it for gain insights.


    The perfect way to begin data mining is to extract themes on which the data requires
    to be mined. If you have sales data of a Fast Moving Consumer Goods company, then
    the themes could be as follows:


    +   - Brand behavior'
  merge: -1
  img_proc: true
- pgno: 238
  md: '+   - Outlet behavior

    - Growth of products

    - Seasonal effect on products


    The themes are useful in giving direction to explore data and discover patterns
    in it.

    Once you have the themes, you need to set questions for each to polish the analysis.

    For example:


    +   - Brand behavior: Here are questions used to enhance the analysis:


    -Which are the best brands?

    -Which brands have the largest coverage?

    -Which companies are cannibalizing the sales of other brands?


    +   - Outlet behavior: The following are questions that polish the analysis.


    -What is the percentage of outlets that consume 80% of revenue?

    -What type of outlets has the highest number of sales?

    -What type of outlets sells major premium products?


    +   - Growth of products: Here are the questions used to streamline the following
    theme.


    -How many brands are seasonal?

    - What is the difference based on sales during seasonal and no seasonal times?

    -Which holiday generates the highest amount of sales for a specific brand?


    The previous questions below these themes offer pinpointed directions to identify
    patterns and conduct analysis that generates quality results.'
  merge: -1
  img_proc: true
