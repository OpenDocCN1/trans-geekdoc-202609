  md: '# Chapter 4: Inferential Statistics


    Before you understand the inferential statistics, first, let''s explore what descriptive
    statistics is about.


    Descriptive statistics is a term assigned to data analysis that summarizes the
    data in a meaningful style such that patterns are extracted from it. It''s a simple
    way to describe data, but it doesn''t help us come up with a conclusion on the
    hypothesis made. Say, for instance, you have the height of 1,000 people living
    in Hong Kong. The average of their height would be descriptive statistics, but
    their average height does not reveal it''s the mean height of entire Hong Kong.
    In this case, inferential statistics will allow you to define what the average
    height of the entire Hong Kong would be; this is explained further in the following
    chapter.


    In other words, inferential statistics involves an explanation of the bigger picture
    of the analysis using a limited amount of data and mining conclusions from it.


    # Different Types of Distribution


    There are different types of probability distributions, and every distribution
    reveals the probability of different results for a random experiment. This section
    will deal with different probability distributions.


    # The Normal Distribution


    This is the most common type of distribution and widely used form of distribution
    in statistics. Also known as a “bell curve” and “Gaussian curve” named after the
    mathematician Karl Friedrich Gauss. A normal distribution happens commonly in
    nature. Let''s consider the example of height we have height data for all individuals
    of a given gender in the city of Hong Kong, and you plot a bar chart where every
    bar represents the number of people at this specific height, then the curve that
    is extracted will resemble the following graph. The numbers in the plot represent
    the standard deviation numbers from the mean. In the following case, it''s zero.
    This concept will become clear as we tackle other chapters.'
