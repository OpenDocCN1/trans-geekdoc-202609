    Now you can compute the entropy for the following settings using the above formula.

    The entropy result for this particular formula is 0. An entropy of 0 represents
    homogeneity. It is easy to program entropy in Python.


    For the sake of achieving the best splitting variable, you will leverage the entropy.
    First, you will compute the entropy depending on the class labels'
