  md: '# Chapter 13: MVC Pattern


    The previous section dealt with the installation of everything you need. Hopeful,
    you''re all set up with Python and Django. We already created the project you''re
    going to use.


    # The MVC Pattern


    This section will review the MVC pattern. You will understand more about the MVC
    pattern. Django MVC architecture solves many problems that were available in the
    traditional approach for web development. For every website on the internet, it
    has three main components: Input Logic, UI logic, and Business Logic.


    These sections of code perform different roles, the input logic within the dataset,
    and how the data organizes in the database.


    It merely accepts inputs and directs it to the database in the right format. Business
    logic is the primary controller that takes care of the output from the server
    within the HTML. The UI logic as the names, refers to the HTML, CSS, and JavaScript
    pages.


    When the traditional technique was used for running all this code was implemented
    in a single file. This was not a huge problem back in the time, the web pages
    were highly static, and websites didn''t feature multimedia and extensive coding.
    Additionally, this architecture presents challenges for developers during testing
    and project maintenance.


    Now, the times are different, and the websites are getting larger and larger every
    day while supporting applications as online artificial intelligence, cloud computing,
    and online development environment, these projects are all built within the MVC
    architecture.


    Well, what is MVC? This is a short for Model View Controller. Don''t be scared,
    and you''ll learn every feature of the MVC pattern and associate it to Django.


    The MVC pattern is one of the Product Development Architecture. It computes the
    traditional approach'' challenges of code in a single file. There are three major
    parts of the MVC. That includes the Model, View, and Controller.


    The difference between these parts allows the developer to concentrate on one
    major feature of the web-app and thus, robust code for one function'
  merge: -1
  img_proc: true
