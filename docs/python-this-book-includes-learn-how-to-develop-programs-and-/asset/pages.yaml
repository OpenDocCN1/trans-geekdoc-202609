    # The Zen of Python


    These refer to guidelines designed by Tim Peters. The Zen of Python contains 20
    guidelines that direct the design of Python language. It''s not necessary for
    your Python code to follow these guidelines, but they''re important to remember.
    The Zen of Python is a hidden joke that appears if you execute import this;

    Don''t forget that these guidelines are just opinions that can be argued for or
