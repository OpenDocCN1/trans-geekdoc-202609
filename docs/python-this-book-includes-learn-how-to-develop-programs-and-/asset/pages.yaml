    The origin of large volumes of data can be traced back to the 1960s and 1970s
    when the Third Industrial Revolution had just started to kick in, and the development
    of relational databases had begun along with the construction of data centers.
    The concept of big data has recently taken center stage primarily since the availability
    of free search engines like Google and Yahoo, free online entertainment services
    like YouTube, and social media platforms like Facebook. In 2005, businesses started
    to recognize the incredible amount of user data generated through these platforms
    and services, and in the same year, an open-source framework called "Hadoop" was
    developed to gather and analyze these large dumps available to the companies.
    During the same period, a non-relational or distributed database "NoSQL" started
    to gain popularity due to its ability to store and extract unstructured data.
    "Hadoop" made it possible for the companies to work with big data with high ease
    and at a relatively low cost.


    Today, with the rise of cutting edge technology, not only humans but machines
    also generate data. The smart device technologies like "Internet of things" (IoT)
    and "Internet of systems" (iOS) have skyrocketed the value of big data. Our everyday
    household objects and smart devices are connected to the Internet and able to
