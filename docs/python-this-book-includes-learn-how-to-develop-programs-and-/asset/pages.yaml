    # The Poisson Distribution


    This refers to the probability distribution of self-determining interval occurrences
    in an interval. The binomial distribution is used to measure the probability of
    binary occurrences, whereas a Poisson distribution is important for count-based
    distributions. Suppose lambda is the average occurrence of the events per interval,
    then the probability of getting a k occurrence within a'
  merge: -1
