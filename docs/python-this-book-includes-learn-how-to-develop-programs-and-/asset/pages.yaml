- pgno: 289
  md: '# Chapter 10: Data Analysis-Deep dive


    This Chapter will focus on dimensionality reduction. In the modern era, high-dimensional
    data is everywhere. Consider developing a product recommendation engine for a
    moderately-sized e-commerce website. Even with different products, the number
    of elements to consider are very high. Bioinformatics is another field that has
    high-dimensional data. The gene expression comprises of microarray datasets that
    feature thousands of dimensions.


    If your role is either explore the data or prepare the data to be used by an algorithm,
    the high dimensionality, popularly known as the curse of dimensionality, is a
    huge obstacle. You need effective methods to deal with this. Also, the complexity
    of current data mining algorithms increases exponentially with the rise in the
    number of dimensions. With the rise in dimensions, the algorithms become computationally
    infeasible and hence, inapplicable in most applications.


    Dimensionality reduction approaches preserve the structure of the data as much
    as possible while limiting the number of dimensions. Therefore, in the restricted
    feature space, the implementation time of the algorithms is limited because we
    have a lower dimension. As the structure of the data is preserved, the results
    acquired can be the best approximation of the initial data space. By maintaining
    the structure, it means two things; first is not affecting the variations in the
    original dataset, and the second is preserving the distance between the data and
    vectors found in the new projected space.


    # Decomposition of a Matrix


    Matrix decomposition generates different techniques for dimensionality reduction.
    The data is generally a matrix with the instances in rows and features organized
    in columns. Matrix decomposition is a technique of expressing a matrix. Say that
    A describes a product of two other matrices, B and C. The matrix B is supposed
    to feature vectors that can describe the change in the data. The matrix C is supposed
    to hold the magnitude of the variation. Therefore, the original matrix A is now
    displayed as a linear combination of B and C.


    The methods that you will see in the next sections deal with matric decomposition
    to handle the dimensionality reduction. There are methods'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'that emphasize that the basic vectors must be orthogonal to each other, such
    as the principal component analysis, and there are some that don’t stress this
    requirement, such as dictionary learning.

    Let’s see some of these techniques in operation in the following chapter:


    # Mining the Principal Components


    The first method that you will consider is the Principal Component Analysis (PCA).
    PCA belongs to the unsupervised method. When it comes to multivariate problems,
    PCA is used to decrease the dimension of the data with the minimum information
    loss. In other words, maintaining the maximum variation in the data. By variation,
    it implies the direction in which the data is dispersed to the maximum. Let’s
    consider the following plot:


    ![](img/43582740ac1227a817786ef73e0f3772_290_0.png)


    You have a scatter plot featuring two variables, x1 and x2. The diagonal line
    displays the maximum variation. By applying PCA, the focus is to retain this direction
    of the variation. Therefore, instead of applying the direction of two variables,
    x1 and x2, to represent this data, the aim is to look for a vector represented
    by the blue line and denote the data using only this vector. In general, you want
    to limit the dimension of the data from two to one.

    You will make use of the mathematical tools Eigenvalues and Eigenvectors to determine
    this blue line vector. Remember, variance measures the level of'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'dispersion in the data. However, in the case of a single dimension, it is easy
    to display a correlation among the variables as a matrix. When the values of the
    covariance matrix are normalized using the standard deviation, you receive a correlation
    matrix. In the following case, the covariance matrix denotes a 2 x 2 matrix of
    two variables, x1 and x2, and it determines how these two variables move in the
    same direction.


    When you conduct an Eigenvalue decomposition, in other words, get the Eigenvectors
    and Eigenvalues of the covariance matrix, the main Eigenvector, which is the largest
    Eigenvalue, is in the direction with the highest variance in the previous data.


    In our case, this should be the vector that is denoted by the blue line in the
    graph. You will then shift to project the input data inside this blue line vector
    to acquire the reduced dimension.


    PCA can be done on both covariance and correlation matrix. Don''t forget that
    when a dataset with unevenly scaled datasets is applied in the PCA, the outcome
    may not be useful.


    Next, you''re going to use the Iris dataset to learn how to apply PCA efficiently
    in shaping the dimension of the dataset. The Iris dataset features measurements
    for 150 iris flowers from three different species.


    The three classes within the Iris dataset include:


    +   * Iris Setosa

    * Iris Versicolor

    * Iris Virginica


    Here are four properties within the Iris dataset:


    +   * The sepal length in cm

    * The petal width in cm

    * The petal length in cm

    * The sepal width in cm


    Our objective is to reduce the dimension of the data. In the following example,
    our instances comprise of four columns. Say that you''re creating a classifier
    to forecast the type of flower using a new instance. Can you complete this task
    using instances in the reduced dimension space? Is it possible to reduce the number
    of columns from four to two and still fulfill a nice accuracy for our classifier?'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'PCA is completed by following these steps:

    1. Standardize the dataset to feature a zero mean value.

    2. Identify the correlation matrix for the dataset and unit standard deviation
    value.

    3. Divide the correlation matrix into its Eigenvectors and values.

    4. Choose the best eigenvectors depending on the Eigenvalues descending order.

    5. Translate the input Eigenvectors matrix into the new subspace.


    Now, you will proceed to standardize this data, using a zero mean and standard
    deviation of one, you will leverage the numpyscorr_coef function to identify the
    correlation matrix:


    ```

    x_s = =

    scale(x,with_mean=True,with_std=True,axis=0)

    x_c = np.corrcoef(x_s.T)

    ```


    Next, you should perform the Eigenvalue decomposition and project the Iris data
    on the first principal Eigenvectors. Lastly, you will plot the dataset in the
    reduced space. Below is the code to use:


    ```

    eig_val,r_eig_vec = scipy.linalg.eig(x_c)

    print("Eigenvalue values %n%%f\n" % (eig_val))

    print("Eigen vectors %n%%f\n" % (r_eig_vec))

    # Select the first two eigen vectors.

    w = r_eig_vec[:,:2]

    # Project the dataset in the

    dimention

    # from 4 dimension to 2 using the right

    eigen vector

    x_rd = x_s.dot(w)

    # Scatter plot the new two dimensions

    plt.figure()

    plt.scatter(x_rd[:,0],x_rd[:,1],c=y)

    plt.xlabel("Component 1")

    plt.ylabel("Component 2")

    ```'
  merge: -1
  img_proc: true
