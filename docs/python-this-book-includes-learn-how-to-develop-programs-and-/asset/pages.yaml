    Django uses the “Batteries included” principle and has about everything that developers
    want to do. Since everything you require is part of the onestop-shop, it works
    seamlessly together, follows a regular design principle, and has up-to-date documentation.


    +   - Scalable


    Django features a component-based “shared-nothing” format and can thus be substituted
    or changed when necessary. Having a clear distinction between the different parts
    implies that it can scale for increased traffic by including hardware at any level.
    Some of the busiest websites have successfully scaled Django to achieve their
    demands.


    +   - Versatile


    You can use Django to create any website that you want-right from content management
    systems to social networks and news sites. This framework can work with any client-side
    framework and can support content in any format.


    +   - Easy to maintain


    The Django framework is built according to the principles of design that support
    code reusability. It also allows the grouping of similar functions into reusable
    “applications”.'
