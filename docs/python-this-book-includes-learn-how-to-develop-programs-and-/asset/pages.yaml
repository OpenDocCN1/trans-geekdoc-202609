    to deliver the highest flexibility.


    # Whitespace Formatting


    Most programming languages rely on curly braces to separate blocks of code. However,
    the Python language uses indentation. As a result, it''s easy to read Python.
    However, you must be careful with your formatting. Whitespace is not considered
    inside parentheses and brackets, which can be useful for longwinded calculations.

    Still, you use a backslash to show that a given statement continues onto the next
    line, even if you''ll rarely do this.

    One effect of whitespace formatting is that it can be difficult to copy and paste
    code into the Python shell. For example, if you attempt to paste the following
    code inside the Python shell:'
