    instance, when it comes to the retail industry, there are different factors that
    affect the sale of a product. Some of these factors could be promotions, price,
    or seasonal factors. A linear regression model allows one to understand the influence
    of each of these factors on the sales of a product as well as compute the baseline
    sales, which represents the number of sales of this product in case there were
    no external factors, and so on.


    # Simple Linear Regression


    A simple linear regression contains a single variable, and it can be described
    using the following format:

