    # Z-test vs T-test


    You''ve already conducted several Z-tests before you validated your null hypothesis.


    ![](img/43582740ac1227a817786ef73e0f3772_216_0.png)


    A T-distribution resembles a Z-distribution. The T-distributions'' standard deviation
    is always proportionally larger than the Z.

    The t distribution is normally used to analyze the population when the sample
    is small.


    The Z-test is used to make a comparison of the population mean against a sample
    than the two distributions using a sample size greater than 30. For example, Z-test
    would be comparing the heights of men from various ethnicity groups.


    The T-test is used to compare the population average against a sample, or compare
    the population mean of two distributions using sample size less than 30, and when
    you don''t know the population''s standard deviation.


    # The F Distribution


    This distribution is also referred to as the Snedecor’s F distribution. An F'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'static is provided by the following formula.

    $f = [s_1^2/\sigma_1^2]/[s_2^2/\sigma_2^2]$


    In the following case, s1 refers to the standard deviation of sample 1 with n1,
    size, s2, and the standard deviation of sample 2. The distribution of all the
    possible values of f statistics is referred to as F distribution. The d1 and d2
    represent the degrees of freedom in this chart:


    ![](img/43582740ac1227a817786ef73e0f3772_217_0.png)


    The Chi-Square Distribution

    This type of distribution is defined using the following formula:


    $\chi^2=[(n-1)*s^2]/\sigma^2$


    In the following case, n refers to the size of the sample, s represents the standard
    deviation of the sample, and $\sigma$ is the standard deviation of the population.

    If you repeatedly pick samples and define the chi-square statistics, then you
    can create a chi-square distribution, which is described by the following probability
    function:


    $Y=Y_0*(X^{(v/2-1)})*e^{-X/2}$


    # Chi-Square for the Goodness of Fit


    The Chi-square test can be applied to test whether the observed data differs significantly
    from the desired data. For example, the dice is rolled 36 times,'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'and the likelihood that each face should turn upwards is 1/6. Therefore, the
    expected distribution is as follows:


    | Expected Frequency | Outcome |

    | 6 | 1 |

    | 6 | 2 |

    | 6 | 3 |

    | 6 | 4 |

    | 6 | 5 |

    | 6 | 6 |


    The observed distribution consists of the following:


    | Observed Frequency | Outcome |

    | 7 | 1 |

    | 5 | 2 |

    | 3 | 3 |

    | 9 | 4 |

    | 6 | 5 |

    | 6 | 6 |


    The null hypothesis within the chi-square test is that the observed value resembles
    the expected value.

    The chi-square can be conducted using the chisquare function within the SciPy
    package:


    ```

    >>> stats.chisquare(observed,expected)

    (3.3333333333333335, 0.64874235866759344)

    ```


    The first value is the chi-square value, and the second value is the p-value,
    which is very high. In other words, the null hypothesis is valid, and the observed
