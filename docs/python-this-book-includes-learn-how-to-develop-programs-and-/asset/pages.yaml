    Creating a Line Chart

    In general, line charts represent how a given data changes at different time intervals.
    When it comes to charting, this is the simplest chart that you create. It is made
    up of the x and y axes, and each axis on the chart denotes time, value, or a different
    parameter.

    Let''s create a simple chart on the number of hits a website has received in the
    past two years. Take a look at the first line of this code. That is a declarative
    line by the Python interpreter to describe the string encoding to the file. Additionally,
    you''ll realize online.x_labels that you apply an inline function known as range
    (). This allows you to build an array of numbers, beginning from the lowest numbers
    to the highest number. In this case, 2012 and 2014 would output as 2012, 2013,
    2014, in an array. Now, copy this code into your'
  merge: -1
  img_proc: true
