    # Pruning


    The inherent purpose of decision trees is to support training and self-learning
    of the system, which often requires overloading of all possible conditions and
    influencing factors that may affect the final result. To overcome the challenge
    of setting the correct output for the least number of instances per node, developers
    make a "safe bet" by settling for that "least number" as rather small. This results
    in a high number of bifurcations on necessary, making for a very complex and large
    decision tree. This is where "tree pruning" comes into the picture. The verb "prune"
    literally means "to reduce especially by eliminating superfluous matter". This
    is the same kind of concept taken from real-life tree pruning and applied to the
    machine learning decision pruning process.


    The process of pruning effectively reduces the overall complexity of the decision
    tree by "transforming and compressing strict and rigid decision boundaries into
    generalized and smooth boundaries". The number of bifurcations in the decision
    trees determines the overall complexity of the tree. The easiest and widely used
    pruning method is reviewing individual branch nodes and evaluating the effect
    of its removal on the cost function of the decision tree. If the cost function
    has little to no effect of the removal, then the branch node under review can
    be easily removed or "pruned".


