  md: '# Pygal Installation Using Pip


    First, if you''re yet to install lxml, and you are working on Windows, you''ll
    want to install the lxml installer. Otherwise, these commands should help you
    install lxml. Next, you will need to apply pip and install pygal using the following
    commands for Mac and Windows systems.


    If you are using a windows laptop, enter the following commands:


    Pip install pygal


    If you are working on Ubuntu, enter the following command:


    Sudo pip install pygal


    Next, open Eclipse with PyDev and start a new Python project. Once you create
    the project, create a new file, name it importtest.py, and enter the following
    command:


    Import pygal


    Once complete, you should press CTRL + Space and see PyDev''s code. This screenshot
    illustrates pygal being rearranged in the system:


    ![](img/43582740ac1227a817786ef73e0f3772_220_0.png)


