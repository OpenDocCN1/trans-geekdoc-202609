  md: '# Chapter 10: Inheritance


    We often come across different products that have a basic model and an advanced
    model with added features over and above the basic. A software modeling approach
    of OOP enables extending the capability of an existing class to build a new class,
    instead of building from scratch. In OOP terminology, this characteristic is called
    inheritance, the presence of the class is known as the parent or base class, while
    the new class is referred as the child or subclass.


    Inheritance comes into the picture when a new class possesses the ''IS A'' relationship
    with an existing class.


    Dog IS an animal. Cat also IS an animal. Hence, an animal is the base class, while
    dog and cat are inherited classes.


    A quadrilateral has four sides. A rectangle is a quadrilateral, and so IS square.
    A quadrilateral is a base class (also called parent class), while rectangle and
    square are the inherited classes - also child classes. The child class inherits
    data definitions and methods from the parent class. This facilitates the reuse
    of features already available. The child class can add a few more definitions
    or redefine a base class method.


    This feature is extremely useful in building a hierarchy of classes for objects
    in a system. It is also possible to design a new-class upon more than one existing
    classes. This feature is called multiple inheritances.


    The general mechanism of establishing inheritance is illustrated below:


    Syntax:


    ```

    class parent:

    statements

    ```


    ```

    class child(parent):

    statements

    ```


    While defining the child’s class, the name of the parent class is put in the parentheses
    in front of it, indicating the relation between the two. Instance attributes and
    methods defined in the parent class will be inherited by the object of the child
    class.


    To demonstrate a more meaningful example, a quadrilateral class is first defined,
    and it is used as a base class for the rectangle class.'
  merge: -1
  img_proc: true
