    The condition normally has arithmetic and comparison expressions. The expressions
    are computed to the Boolean Values False or True. The statements responsible for
    decision are referred to as conditional statements, alternatively they are also
    known as conditional constructs.

    The if-then syntax is sometimes referred to as the if-then-else. This is common
    in most programming languages, but the syntax differs from language.

    Conditional statements are found in every programming language. Conditional statements
    allow you to have a code that may run and other times not run, depending on the
    input of the program. Once you fully run each statement of a program, moving from
    top to bottom with every line executed, you aren''t asking the program to execute
    certain conditions. By applying conditional statements, programs can tell whether
    a given condition is met and then be informed what to do next.

    Here are some examples where conditional statements are important:


    +   - If a student attends 65% on his test, print that her grade passes, not,
