  md: '```

    >>> height_data = np.array([ 186.0, 180.0, 195.0, 189.0, 191.0,

    177.0, 161.0, 177.0, 192.0, 182.0, 185.0, 192.0,

    173.0, 172.0, 191.0, 184.0, 193.0, 182.0, 190.0, 185.0, 181.0,

    188.0, 179.0, 188.0,

