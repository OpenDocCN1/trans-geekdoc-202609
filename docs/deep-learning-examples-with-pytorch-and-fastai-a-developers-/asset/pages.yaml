  md: 'But how can we do the same transferring of weights if we do not have such a
    fancy library but only the pkl files?


    For e.g. you want to do transfer-learning twice. You have trained a model that
    can recognize different dog breeds. Based on this model you would like to create
    a model that can do a binary classification and decide if the image of a dog shows
    a Pitbull or not.


    We want to use the weights from the dog-breed classifier because it will also
    do better with binary classification.


    Now we start with our pretrained model and try to run the ImageWoof dataset on
    it.


    Let’s start by getting the ImageWoof data:


    ```

    path = untar_data(URLs.IMAGEWOOF)

    tfms = [[PILImage.create],

    [parent_label, Categorize()]]

    item_tfms = [ToTensor(), Resize(128)]

    batch_tfms = [FlipItem(),

    RandomResizedCrop(128, min_scale=0.35), IntToFloatTensor(),

    Normalize.from_stats(*imagenet_stats)]


    items = get_image_files(path)

    split_idx = GrandparentSplitter(valid_name=''val'')(items) datasets =

    Datasets(items, tfms, splits=split_idx)

    dls = datasets.dataloaders(after_item=item_tfms,

    after_batch=batch_tfms,

    bs=64)

    dls.show_batch()

