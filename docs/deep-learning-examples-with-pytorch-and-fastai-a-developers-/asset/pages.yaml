  md: 'Now we can build our model. We want to use a custom model and a head for regression.


    If we know about our outputs and inputs we can make use of the functions create_body
    and create_head. The create_body function chops off the top layer of the pre-trained
    model. The create_head function creates a custom fastai head-layer.


    +   Which input/output layers do we need for our model:

    +   * output-layer: 18 (as stated before, 9 tuples of coordinates)

    +   * input-layer: 1024 filter (2-times of the last layer’s dimension of the ResNet18
    model because our custom fastai head layer contains two parallel layers.


    ```

    body = create_body(resnet18, pretrained=True)

    head = create_head(nf=1024, n_out=18)

