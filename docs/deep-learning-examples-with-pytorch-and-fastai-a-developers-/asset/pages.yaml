    To create our datasource and our dataloaders we have to create a filesplitter
    function.

    We use the FileSplitter function that checks for all the image files in our path.

    If the filename is contained in the validation file and the file is a valid image
    file, it puts the file into training or validation source.


    ```

    def FileSplitter(fname):

    "Split `items` depending on the value of `mask`." valid =

    Path(fname).read().split(''\n'')

    def _func(x): return x.name in valid

    def _inner(o, **kwargs): return FuncSplitter(_func)(o) return _inner

    ```


    # 8.2 Training


    Now that we have our dataset prepared, we can start training. We want to improve
    our training process by transferring the model between datasets of different size.


    This means we start training with small images and then retrain with bigger and
    bigger images while transferring the pretrained weights of the model.

    Doing training this way we get higher accuracy way quicker than if we start training
    with full resolution images for a bigger number of epochs.


    We start with images half the size of the original images.

    size = mask.shape; size

    (720, 960)

    half_size = tuple(int(x/2) for x in size); half_size (360, 480)


    Next we create our DataBlock that consists of an ImageBlock and a MaskBlock. All
    the other steps are the same like before with DataBlock:


    +   - get the images with get_image_file

    +   - split with FileSplitter according to the valid.txt file.

    +   - get the y-values (means get the mask of the training image) with get_mask-function

    +   - do the batch-transforms: reduce image size to half of the original resolution
    and normalize according to the imagenet stats.


    ```

