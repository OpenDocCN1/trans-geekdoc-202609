    If we want to work with Bayesian Optimization, we have to implement a fit_with-function
    that accepts the tunes parameter values and does whatever we require of it.


    ```

    ```python

    def fit_with(lr:float, wd:float, dp:float):

    # create a Learner

    learn = tabular_learner(data,


    layers =[200,100], metrics=accuracy, emb_drop=dp,

    wd=wd)


    # Train for x epochs with learn.no_bar(): learn.fit_one_cycle(3, lr)


    # Save, print, and return the overall accuracy

    acc = float(learn.validate()[1])

    return acc

    ```

    ```


    Inside this function we can try optimize whatever we want. At the end, the function
    needs to know how to grade the modifications:


    `acc = float(learn.validate()[1])`


    And that’s what the function should return. The concept is similar to importance
    permutation but in a more structured way.

    Let’s adjust this further to show how we would go about adjusting the learning
    rate, embedded weight decay, drop out and layer size:


    ```

    ```python

    def fit_with(lr:float, wd:float, dp:float, n_layers:float, layer_1:float,

    layer_2:float, layer_3:float): print(lr, wd, dp)

    if int(n_layers) == 2:


    layers = [int(layer_1), int(layer_2)]

    ```

