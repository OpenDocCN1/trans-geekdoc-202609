    # 9.3 One_Cycle_Fit vs. Fit_Flat_Cosine


    Do you remember one big problem of neural nets: *gradients can blow up or vanish*.

    With Ranger optimization and training with fit_one_cycle you can notice that gradients
    will blow up and your model won’t learn.

    But how can we test different methods of training?


    With fastai you get an instrument called synth_learner. This is a *ready-togo-learner*.
    You do not pass any data or parameters to it. You can just make a real learner
    and experiment with it.


    We can train this learner, like any other learner, by calling a fit-function.


    ```

    from fastai.test_utils import synth_learner

    synth = synth_learner()

    synth.fit_one_cycle(1)

    synth.recorder.plot_sched()

    ```


    epoch train_loss valid_loss time

    0 20.115931 21.590172 00:00


    When we plot the learning-rate scheduler, we get two plots. One for the learning-rate
    and one for the momentum.'
