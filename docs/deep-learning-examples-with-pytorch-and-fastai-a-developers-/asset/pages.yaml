    # What is this thing called Tokenization?


    Well, even for text we have to break down everything to numbers to work with neural
    nets. Tokenizing helps us with this task.


    Tokenizing takes all of our text and splits the sentences into these tokens. A
    token can be a word, a group of words, etc. that has some kind of meaning to us.
    Tokenization usually takes care of punctuation, contradiction, HTML tags, etc.
    The default tokenizer with fastai is spacy but you can also use the sentence piece
    tokenizer.


    Here are some examples of what spacy did while tokenizing:


    +   - ‘s’ are grouped together

    +   - contractions are separated like so “did”, “n’t”

    +   - Any HTML symbol has been cleaned

    +   - Everything is converted to lower-case

    +   - there are several special tokens (all those that begin by xx), to replace
    unknown tokens (see below) or to introduce different text fields


    The next step is to convert everything into numbers. This process is called **numericalization**.
    This means that we create a dictionary with a numerical value for each of our
    tokens.


    If we want to use another tokenizer we have to create the dataloaders with the
    datablock api.


    First we install sentencepiece and load the tokenizer.


    ```

    !pip install sentencepiece q

