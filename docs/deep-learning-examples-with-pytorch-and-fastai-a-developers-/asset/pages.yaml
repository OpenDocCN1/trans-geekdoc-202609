    \ This just does some reflection padding on the input and then calls Conv2d to\
    \ create a 2d-convolution.\n\n```\n#export\nclass ReflectionLayer(Module):\n \
    \   \"\"\"A series of Reflection Padding followed by a ConvLayer\"\"\"\n    def\
    \ __init__(self, in_channels, out_channels, ks=3, stride=2):\n        reflection_padding\
    \ = ks // 2\n        self.reflection_pad = nn.ReflectionPad2d(reflection_padding)\n\
    \        self.conv2d = nn.Conv2d(in_channels, out_channels, ks, stride)\n    def\
    \ forward(self, x):\n        out = self.reflection_pad(x)\n        out = self.conv2d(out)\n\
    \        return out\n```\n\nWe create a ReflectionLayer-object to check the containing\
    \ layers:\n\n```\nReflectionLayer(3, 3)\n```\n\nReflectionLayer( (reflection_pad):\
    \ ReflectionPad2d((1, 1, 1, 1)) (conv2d): Conv2d(3, 3, kernel_size=(3, 3), stride=(2,\
    \ 2)) )\n\nNext we need a ResidualBlock. A residual block contains two ReflectionLayers.\
    \ Like any other residual block it creates a result by doing a forward pass through\
    \ the layers and then adds it to the input itself.\n\n```\n#export\nclass ResidualBlock(Module):\n\
    \n\"\"\"Two reflection layers and an added activation function_ with residual\"\
