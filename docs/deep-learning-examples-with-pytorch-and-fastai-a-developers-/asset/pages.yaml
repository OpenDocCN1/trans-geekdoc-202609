  md: "+   - Right Ear-1\n+   - Right Ear-2\n+   - Right Ear-3\n\nThis is why the\
    \ first number is 9 – indicating that there are 9 key points for the image.\n\n\
    The next step is to create pairs of points from these lists. We implement a function\
    \ called seperate_points for this purpose.\n\n```\ndef seperate_points(coords:\
    \ array) -> Tensor:\n    \"\"\"Seperate a set of points to groups\"\"\"\n    key_pts\
    \ = []\n    for i in range(1, int(coords[0]*2), 2):\n        key_pts.append([coords[i],\
    \ coords[i+1]])\n    return tensor(key_pts)\npoint_pairs = seperate_points(keypoints)\n\
    point_pairs\ntensor([[240., 169.], [305., 138.], [293., 212.], [173., 154.], [134.,\
    \ 93.], [202., 97.], [272., 66.], [309., 10.], [338., 80.]])\n```\n\nTo use these\
    \ keypoints with fastai we have to load them into TensorPoints.\n\nWe can orchestrate\
    \ all the steps we have done so far.\n\nTo get the groundtruth keypoints, we create\
    \ a get_y function for our dataset.\n\n```\ndef get_y(f: Path):\n    \"\"\"Get\
    \ keypoints for image with path `f`\"\"\"\n    keypoints = np.genfromtxt(image_to_keypoint(f))\n\
    \    return seperate_points(keypoints)\n```\n\nSo by now we can be sure that all\
    \ of our images can be associated with the correct pairs of keypoints.\nIs there\
    \ anything else we have to check for?\n\nWell, there could be keypoints of images\
    \ that are out of the region of the image. What does this mean? Some images could\
    \ be annotated with keypointcoordinates outside the bounds of the image. But how\
    \ can we check this?"
