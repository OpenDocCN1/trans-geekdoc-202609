    We use the parallel-function from the fastai package to increase speed on crapifying.
    If we run ??parallel we see that this is a function defined in the file torch_core.py.
    The document says this function Applies func in parallel to items, using n_workers.


    And indeed, if we look at the source code, we see that it starts a ProcessPoolExecutor
    with a given number of workers (8 by default) and returns a list with progress
    bars indicating the status of each started worker.


    ```

    def parallel(f, items, *args, n_workers=defaults.cpus, _, total=None,

    progress=True, **kwargs):

    "Applies `func` in parallel to `items`, using `n_workers`" with

    ProcessPoolExecutor(n_workers) as ex:


    r = ex.map(f,items, *args, **kwargs)

    if progress:

    if total is None: total = len(items)

    r = progress_bar(r, total=total, leave=False) return L(r)

    ```


