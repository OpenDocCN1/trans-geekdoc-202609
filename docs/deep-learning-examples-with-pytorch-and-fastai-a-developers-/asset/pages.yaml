    if i % 10 == 0: print("training losss: "+str(loss)) loss.backward()

    with torch.no_grad():


    a.sub_(lr * a.grad)

    a.grad.zero_()

    ```


    All functions in pytorch with a _ within the function name are manipulating the
    values on the calling objects directly.


    torch.no_grad() switches our gradients into evaluation mode. No calculation is
    done. a.sub_ subtracts the gradient * learning_rate from our parameter, while
    the method a.grad.zer_() zeros out our gradients


    Now we will run our update function for 100 epochs (remember we print the loss
    every 10 iterations):


