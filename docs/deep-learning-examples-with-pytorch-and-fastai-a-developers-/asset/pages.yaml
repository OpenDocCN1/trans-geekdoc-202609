- pgno: 12
  md: 'This is enough to use the mnist data set with our models. We can have a look
    at our data by using the show_batch method.

    Of course the data block api works for all applications of deep learning like
    image segmentation, object detection, keypoint analysis, text, etc.


    According to the foundation level of fastai, a new object type was added: Object
    oriented tensors. With oo tensors you can call methods directly on your tensor
    objects. E.g. if you have a tensor object containing an image, you can now just
    call tensor.flip_lr to flip the image or .show to display the image. Now any transform
    can be defined for different types of tensor objects.


    To pre-process data, you can use the transforms pipeline to easily create a data
    transform pipeline.


    ![](img/d5454da46c702784893ef8b0b539e5b9_12_0.png)


    The lowest level is a Callable Transform. The pipeline does function composition
    over transforms. It knows how to set up transforms in the pipeline. This can be
    a bit tricky because you have to make sure that all the previous steps have been
    applied to the pipeline before setting up the next step.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Next you can put these into an easily indexed collection called transformed
    list and apply your transforms in parallel. Finally you use a data loader that
    applies these transforms in parallel.


    Generally speaking, all the development of the fast.ai library was done by highly
    leveraging parallel computing on the GPU. E.g. most of the computer vision pipeline
    that is included with fastai is done in parallel on the GPU, minimizing computing
    time.


    If you are interested in the facts behind architecture design decisions in fast.ai,
    you should watch this video of Jeremy Howard on Youtube:

    https://youtu.be/bHVqO5YyNbU


    # 1.4 Using Google’s Colab-Tool


    If you want to run the examples in this book and you don’t have a GPU on your
    own, you have a few options.


    You can start an EC2 instance on Amazon AWS (or any other computing platform).
    This will bill you for the time while running the instance. Make sure you have
    selected an instance level with a GPU. There are a few pros and cons though. If
    you are working on production level projects, you should consider a secure and
    reliable infrastructure stack. Then running a GPU server on a cloud platform will
    be a good solution.


    For learning or working on examples/prototypes, etc. there is another handy option.


    Google provides a tool called Colab that is (kind of) a hosted Jupyter Notebook
    instance which is completely free of charge, but of course with some caveats:


    +   - Google does not reassure access to a GPU but there are hardly times without
    GPU access.

    +   - Most of the time your session is paired to old, and rather slow, Tesla K80
    GPUs.

    +   - Your session is reset after a maximum runtime of 12 hours. This means all
    your data will be lost after 12 hours if you do not upload it to another storage'
  merge: -1
