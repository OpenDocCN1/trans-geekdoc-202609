- pgno: 24
  md: 'pet/images/Siamese_175.jpg'']


    If we have a look at the filenames, we see that the name contains the label that
    we want to predict later. E.g. /home/bmayr/.fastai/data/oxford-iiit-pet/images/Birman_105.jpg
    - this is the image of a Birman cat.


    With fastai we have different options on how to get the labels for our training
    data. We can either extract the label from a parent folder path, from a csv-file
    or data frame or we use a regular expression to extract the label from the path.


    So let’s grab all characters after the last / to the _: ''(.*)_\d+.jpg$''


    If you are not familiar with regular expressions – don’t be afraid, you are not
    alone. There are plenty of good tutorials on the web and you will find examples
    for nearly all possible applications on stack overflow. To test your regEx you
    can use one of the many online-editors that show which portion of a string matches
    your regular expression. E.g. regex101.com: (https://regex101.com/)


    ```

    pat = r''(.*)_\d+.jpg$''

    ```


    Next we want to add some basic transforms. Batch-transforms are applied to each
    batch on your training data whereas item_transforms will be applied to any of
    your items before adding them to different batches.


    Transforms are an excellent way of augmenting your training data. E.g. you can
    zoom in or out a bit, flip your images, warp, etc. to generate even more training
    examples. Fastai implements data augmentation in a very fast way by doing image
    data augmentation in parallel on your GPU.


    In this example we want to resize our images to 224x224 pixels and normalize on
    the imagenet_stats because we will use ResNet34 as a base model for transfer learning.


    Each image will be randomly cropped before being added to a batch.


    The batch size will be 64 – you can adjust the value according to your'
  merge: -1
  img_proc: true
- pgno: 25
  md: "GPUmemory. The higher the batch size, the more memory will be used on\nyour\
    \ GPU.\n\n```\nbatch_tfms = [*aug_transforms(size=224, max_warp=0),\nNormalize.from_stats(*imagenet_stats)]\
    \ item_tfms =\nRandomResizedCrop(460, min_scale=0.75,\n    → ratio=(1,1))\nbs=64\n\
    ```\n\nAn ImageDataLoader is the highest possible API to use with fastai. We can\n\
    directly use the method from_name_re that allows us to generate data-labels\n\
    from the path-name by using our regular expression. We use the regEx\npattern\
    \ we had defined above.\n\n```\ndata = ImageDataLoaders.from_name_re(path,\nfile_names,\n\
    pat,\nbatch_tfms=batch_tfms, item_tfms=item_tfms, bs=bs)\n```\n\nNow we rebuild\
    \ this DataLoader with the Data-Block-API. The Data Block\nAPI always requires\
    \ the same steps: 1. define data blocks 1. get the data\nitems 1. define a splitter\
    \ to split into training and validation set 1. get the\nlabels 1. set item transforms\
    \ 1. set batch transforms\n\nWe set the datablock to ImageBlock because we have\
    \ a vision task and\nCategory Block because we want to predict exactly *one* category.\
    \ Later we\ndevelop an example on how to predict multi-class labels.\n\n# *Why\
    \ do we want to split our data into training and validation data?*\n\nWe train\
    \ our model on the training dataset. Yet if we use all the available data\nfor\
    \ training, the model could easily overfit, meaning that it just memorizes\nthe\
    \ images. E.g. it learns that the third image is a cat, but it doesn’t learn what\n\
    exactly specifies a cat. Therefore we recheck after each training epoch on a\n\
    dataset what the model has not seen during training. This dataset is called the\n\
    validation dataset.\n\n```\npets = DataBlock(blocks=(ImageBlock, CategoryBlock),\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 26
  md: '```

    get_items=get_image_files,

    splitter=RandomSplitter(),

    get_y=RegexLabeller(pat = r''/([^/]+)_\d+.*'', item_tfms=item_tfms,

    batch_tfms=batch_tfms)

    ```


    Now with the DataBlock-object in hand, we can create our dataloaders from the
    image filenames. Set the path_img to the images folder and create the dataloaders.


    ```

    path_img = path/''images/''

    dls = pets.dataloaders(path_img, bs=bs)

    ```


    By now we have followed all the necessary steps for defining our training and
