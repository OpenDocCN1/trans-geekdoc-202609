  md: "We can tune many hyper-parameters with this model.\nAnd now we can make use\
    \ of our model! There are many different values we can pass in, here is a brief\
    \ summary:\n\n+   - n_d: Dimensions of the prediction layer (usually between 4\
    \ to 64).\n+   - n_a: Dimensions of the attention layer (similar to n_d).\n+ \
    \  - n_steps: Number of successive steps in our network (usually 3 to 10).\n+\
    \   - gamma: A scaling factor for updating attention (usually between 1.0 to 2.0).\n\
    +   - momentum: Momentum in all batch normalization layers.\n+   - n_independent:\
    \ Number of independent GLU layers in each block (default is 2).\n+   - n_shared:\
    \ Number of shared GLU layers in each block (default is 2).\n+   - epsilon: Should\
    \ be kept very low (avoid log(0)).\n\nFirst we decide on the embedding sizes:\n\
    emb_szs = get_emb_sz(to); emb_szs\n[(10, 6), (17, 8), (8, 5), (16, 8), (7, 5),\
    \ (6, 4), (3, 3)]\n\nLet’s build one similar to the model we showed in the above\
    \ illustration. To do so we’ll set the dimensions of the prediction layer to 8,\
    \ the number of attention layer dimensions to 32 and our steps to 4:\n\n```\n\
    class TabNetModel(Module):\n\"Attention model for tabular data.\"\ndef __init__(self,\
    \ emb_szs, n_cont, out_sz, embed_p=0.,\n    y_range=None,\nn_d=8, n_a=8,\nn_steps=3,\
    \ gamma=1.3,\nn_independent=2, n_shared=2, epsilon=1e-15, virtual_batch_size=128,\n\
    momentum=0.02):\n\nself.embeds = nn.ModuleList([Embedding(ni, nf) for ni,nf in\
    \ emb_szs])\nself.emb_drop = nn.Dropout(embed_p)\nself.bn_cont = nn.BatchNorm1d(n_cont)\n\
    n_emb = sum(e.embedding_dim for e in self.embeds)\nself.n_emb,self.n_cont,self.y_range\
    \ =\n```"
