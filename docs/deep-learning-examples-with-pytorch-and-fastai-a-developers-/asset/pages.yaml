- pgno: 113
  md: 'image-source: [http://deeplearning.net/tutorial/_images/unet.jpg](http://deeplearning.net/tutorial/_images/unet.jpg)


    The term UNET is derived from the U-Form of the model. The model first sizes down
    an image, allowing one to look at a pixel-wise representation of the image and
    afterwards, sizes the image up again into a high-resolution image. The first part
    of the model (the *downsizing*) is called the encoder and the second part (the
    *upsizing*) is called decoder.


    A unet_learner comes with the fastai library and accepts a configuration (unet_config)
    that can modify the behaviour of the learner.

    We can customize:


    +   - Blur/blur final: avoid checkerboard artifacts

    +   - Self attention: A self-attention layer

    +   - y_range: Last activations go through a sigmoid for rescaling

    +   - Last cross – Cross-connection with the direct model input

    +   - Bottle – Bottleneck or not on that cross

    +   - Activation function

    +   - Norm type


    Now create the learner. We will use self_attention and Mish for activation function.
    We want to use Ranger as an optimizer function. We set our accuracy_camvid as
    the loss function to our learner.


    ```

    config = unet_config(self_attention=True, act_cls=Mish) optimizer = ranger


    learner = unet_learner(dataloaders,

    resnet34,

    metrics=accuracy_camvid,

    config=config,

    opt_func=optimizer)

    ```


    After creating our learner we can have a look at the model-architecture with


    ```

    learner.summary()

    learner.summary()

    epoch train_loss valid_loss accuracy_camvid time 0 None None 00:00


    DynamicUnet (Input shape: [''2 x 3 x 360 x 480''])

    =================================================================

    ```'
