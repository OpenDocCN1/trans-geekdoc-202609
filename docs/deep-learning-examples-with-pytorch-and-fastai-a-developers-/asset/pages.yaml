    We can now start to train our learner! What is exactly passing into the architecture
    of our learner?


    +   • We are passing in two fully connected layers with 1000 and 500 neurons.

    +   • The ps means “*dropout*”. We are passing in two parameters – (notice, we
    have to pass in one value per layer!)

    +   • The embed_p parameter we are passing in, handles dropout with the embedding
    layers

    +   • y_range is the interval of our target predictions

    +   • We are using expo_rmspe for the metric and

    +   • MSELossFlat as a loss-function because we are doing regression


    If we omit the loss-function, the tabular-learner tries to figure out what is
    happening and chooses a loss-function on its own. Yet with regression we have
    to declare the loss-function, otherwise we get an error.


    ```

    learn = tabular_learner(dls, layers=[1000,500], ps=[0.001,

    → 0.01],

    embed_p=0.04, y_range=y_range,

    → metrics=exp_rmspe,

    loss_func=MSELossFlat())

    ```


