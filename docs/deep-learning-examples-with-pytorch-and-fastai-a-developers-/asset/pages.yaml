    # 28.1.1 Data Pipeline


    Well before models like BERT came into play, fastai had already implemented transfer
    learning with NLU. The main idea of transfer learning with text is to first train
    a language-model for the given language that more or less understands the language.
    You could use this language model to predict the next word of a given couple of
    words. But we are using this model as a kind of encoder for our classification
    model. This concept is called ULM-FiT.


    So the first thing we want to build is this language model. Our training data
    contains the text and the label (positive/negative). But for creating the'
