    We see that our input is first pre-processed and then passed to an Embedding Matrix
    (for categorical data) or to a BatchNorm layer for continuous data. Afterwards
    it goes through the 3 fully connected linear layers.


    This is what the fastai tabular model basically looks like. It is a very lean
    model (compared to the fast_tab model). Let’s analyze and compare the TabNet Model!


    ![](img/d5454da46c702784893ef8b0b539e5b9_375_0.png)


    The head of the model is the same as with the fastai model. We start by pre-processing
    and passing the data either to the categorical embeddings or the batch normalization.
    Afterwards the outputs are concatenated and fed into TabNet. The TabNet model
    consists of an Attention Transformer, a Feature Transformer and a Mapping (Linear)Layer.
    We get 4 outputs: Output, Mask_Loss, Mask_Explain and Masks. TabNet operates by
    putting a mask onto the values. This allows the model to inspect which values
    affected the output.


    Let’s first look at the Feature Transformer:'
