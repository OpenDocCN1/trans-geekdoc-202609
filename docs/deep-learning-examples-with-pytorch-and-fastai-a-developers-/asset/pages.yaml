    # **Second attempt: Create two dataloaders for training and validation:** We can
    also create two DataLoaders (one for training and one for validation).


    One great reason why we prefer this way of implementation is **we can pass in
    different batch sizes into each TabDataLoader**, along with changing options like
    shuffle and drop_last (at the bottom I’ll show why that’s super cool).


    So how do we use it?


    Our training and validation data live in to.train and to.valid right now. So we
    specify that along with our options. When you make a training DataLoader, you
    want shuffle to be True and drop_last to be True. This way the last incomplete
    batch will be dropped.


    For the validation-dataloader, we use all the data from to.valid and a higher
    batch-size of 128 (because we have less data and can go through faster). We do
    not shuffle the data and keep the last smaller batch.


    Then we just call DataLoaders and pass in our two dataloaders.


    ```

    trn_dl = TabDataLoader(to.train, bs=64,

    shuffle=True, drop_last=True)

    val_dl = TabDataLoader(to.valid, bs=128)

    ```


    ```

    dls = DataLoaders(trn_dl, val_dl)

    dls.show_batch()

    ```


