    # Chapter 6


    # Cross-Fold-Validation


    Cross Fold Validation is a technique to split your data into n-parts for each
    training. During each round you just use n-1 parts for training and one part for
    validation. This asserts that you never use the same data for training and validation
    and you can use all of your training data for training because you do not have
    to do a permanent split into training and validation data.


    This means that the same examples can be in the training-set in one epoch and
    the validation-set in another.

    To show this we will use the Imagewoof training data. We will have a deeper look
    into imagewoof when we build our own model architectures


    ```

    from fastai.basics import *

    from fastai.vision.all import *

    from fastai.callback.all import *

    ```'
