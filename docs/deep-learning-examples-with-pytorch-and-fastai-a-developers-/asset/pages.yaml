- pgno: 21
  md: "There are a bunch of datasets which you can download very easily with the fastai\
    \ library. One of them contains images of different dog and cat breeds (12 species\
    \ of cats and 25 species of dogs). To show the massive improvements in deep learning,\
    \ think of a state-of-the-art accuracy of about 59% in the year 2015. We will\
    \ try to beat this of course.\n\nIf you want to get a deeper insight on the implementation\
    \ of different functions you can just type help(untar_data). This shows you the\
    \ help text of any python function.\n\nOr type ??untar_data to directly show the\
    \ source code of the function help(untar_data)\nHelp on function untar_data in\
    \ module fastai.data.external:\n\n```\nuntar_data(url, fname=None, dest=None,\
    \ c_key='data',\n    force_download=False, extract_func=<function file_extract\
    \ at 0x7f1baf730560>)\n```\n\nDownload `url` to `fname` if `dest` doesn't exist,\
    \ and un-tgz or unzip to folder `dest`.\n??untar_data\n\n# 1.6.1 Getting the Data\n\
    \nLet’s download the data set and have a look at some of the images. We will directly\
    \ use the Path library to set a reference to our data-folder. The URLs class contains\
    \ constant values for all the different data sets that ship with the fastai library.\n\
    \nThe data set we will use is called Oxford-IIIT Pet Dataset. You can have a look\
    \ at the homepage to get a better understanding of the data: (https://www.robots.ox.ac.uk/~vgg/data/pets/)\n\
    \nThere are special images for the heads because back in 2015 the best model for\
    \ distinguishing the breeds was a combined model with different layers trained\
    \ on the whole image and on recognizing just parts of the image like the head,\
    \ etc."
  merge: -1
  img_proc: true
