  md: "# 18.1 Let’s build the crappified Data\n\nOur crapifier will take two parameters:\n\
    \n+   - a path for the low resolution and\n+   - a path for the high resolution\
    \ images.\n\nThe crapifier will draw a random number onto the image and store\
    \ it. from PIL import ImageDraw, ImageFont\n\n```\ndef resize_img_to(img, target_size,\
    \ use_min=False): width, height = img.size\nmin_size = (min if use_min else max)(width,\
    \ height) ratio = target_size / min_size\nreturn int(width*ratio), int(height*ratio)\n\
    ```\n\n```\nclass Crappifier():\n    \"\"\"Quickly draw texts and numbers on an\
    \ image\"\"\"\n    def __init__(self, path_lr, path_hr):\n        self.path_lr\
    \ = path_lr\n        self.path_hr = path_hr\n```\n\n```\ndef __call__(self, fn):\n\
    \    dest = self.path_lr / fn.relative_to(self.path_hr)\n    dest.parent.mkdir(parents=True,\
    \ exist_ok=True)\n    img = Image.open(fn)\n    targ_sz = resize_img_to(img, 96,\
    \ use_min=True)\n    img = img.resize(targ_sz, resample=Image.BILINEAR).convert('RGB')\n\
    \    width, height = img.size\n    q = random.randint(10,70)\n    ImageDraw.Draw(img).text((random.randint(0,width//2),\
    \ random.randint(0,height//2)), str(q), fill=(255,255,255))\n    img.save(dest,\
    \ quality=q)\n```\n\nNow we can apply this crappifier to our PETS dataset. We\
    \ use two folders for the original high-resolution images and the crappified images."
