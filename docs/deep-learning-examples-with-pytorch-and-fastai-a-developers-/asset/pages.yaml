- pgno: 23
  md: 'This layer allows the building of state-of-the-art models with a few lines
    of codes.


    ![](img/d5454da46c702784893ef8b0b539e5b9_23_0.png)


    Below these layers, there is a kind of “ mid-level-layer ” that allows for more
    control on building models, especially on handling your data and data-processing.
    The mid-layer contains the Data Block API, Learner and Callbacks and Generic Optimizers.
    We will use this layer in later examples.


    Below the mid-layer there is the foundation API. This allows for total control
    on models and data flow.


    Let’s get back to our starter model. First of all we need to grab all the filenames
    from the images to build our DataLoaders. We use a helper function get_image_files()
    from fastai that returns a list of all filenames in a given directory.


    ```

    file_names = get_image_files(path/''images/'')

    file_names[:2]

    ```


    (#2) [Path(''/home/bmayr/.fastai/data/oxford-iiit-pet/

    → images/Birman_105.jpg''),Path(''/home/bmayr/.fastai/data/ → oxford-iiit-'
