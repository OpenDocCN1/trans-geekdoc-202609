- pgno: 376
  md: '![](img/d5454da46c702784893ef8b0b539e5b9_376_0.png)


    The Feature Transformer contains 2 linear layers followed by a GLU Block. This
    GLU Blocks allows us to take the attention feedback and feed it into our last
    linear layer to generate the outputs.


    Now we can check the Attention Transformer:


    ![](img/d5454da46c702784893ef8b0b539e5b9_376_1.png)


    Here we start with a linear layer and go into what is called GhostBatchNorm *(covered
    in a completely different paper)*. When we send everything to the model, we keep
    the previous input. This is where attention comes into play. We do a multiplication
    of our input x with the previous inputs. Then we use a Sparsemax activation function.


    Now we can make our model.


