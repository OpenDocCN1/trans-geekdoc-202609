    # ## 2.2 Create the Model


    A (deep) learning model consists of different layers. Each layer is simply a matrix
    multiplication. After several layers we should end up with our given y labels.
    For the MNIST image-data we will create a model that resembles the cnn_learner-object
    we had used in the introduction chapter.


    Now we will use these types of layers:


    +   - convolution layers,

    +   - batch normalization layers,

    +   - activation functions (ReLu) and

    +   - a flatten layer as a top layer


    # ### 2.2.1 Convolutional Layer


    Convolutional layers have shown good results when working with images. You can
    even transform different data into images and work with conv-layers. E.g. you
    create spectograms of your music files and use these spectograms like images.


    What happens inside convolutional layers is well documented by *Adit Deshpande*
    (see: [https://adeshpande3.github.io/A-Beginner%27s-Guide-ToUnderstanding-Convolutional-Neural-Networks/](https://adeshpande3.github.io/A-Beginner%27s-Guide-ToUnderstanding-Convolutional-Neural-Networks/)).


    The analogy to a convolutional layer is a flashlight that highlights only one
    spot inside a dark room. The flashlight moves from left to right and top to bottom
    and scans the whole room. However, you only see one spot at a time.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'In terms of convolutional layers we call this flashlight a **filter** or **kernel**.
    The highlighted spot we see is called a **receptive field**.


    The filter itself consists of an array of floats – called **weights** (or sometimes
    parameters).


    Keep in mind that the depth of the filter has to be of the same size as the depth
    of the input. In our example we use one color channel – so we use a depth of 1.


    Next step is to start moving the filter around on our pixel array of the image.
    We define this moving as **convolving** around the image.


    While convolving, the filter multiplies the values inside the filter with the
    original values inside the highlighted receptive field. During the process the
    filter does an element-wise multiplication.


    All the results of these multiplications are then summed up. The filter keeps
    repeating for all the pixels in the image resulting in an **activation** or **feature
    map**.


    In our case (24x24 pixels images) this feature map will have 784 different locations,
    that turns into a 28x28 array of pixels.


    ```

    def conv(number_input: int, number_filter: int) -> nn.Conv3d: return

    nn.Conv2d(number_input,

    number_filter,

    kernel_size=3,

    stride=2,

    padding=1)

    ```


    # 2.2.2 Batch Normalization Layer


    While our tensors are being passed through the model we want them to be normalized.
    This will improve training speed and will allow each layer to learn independently
    because each layer is re-normalized according to its outputs.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '```

    def batch_norm(number_filters: int) -> nn.BatchNorm2d: return

    nn.BatchNorm2d(number_filters)

    ```


    # 2.2.3 Activation Function


    An activation function is used to provide non-linearity to our models. The activation
    function works with the *weights* and a *bias* during a step called **backpropagation**
    (which we will look at in a later chapter).


    These functions take care of the learning capability of our model. The activation
    function can activate (*return a positive value*) or deactivate (*return a value
    less than zero*) nodes within our layers.


    The ReLu (or rectified linear unit) simply returns the input value if the value
    is greater than zero or it returns zero for all input values equal or less than
    zero: https://github.com/Kulbear/deep-learning-nano-foundation/wiki/Re LU-and-Softmax-Activation-Functions#rectified-linear-units


    ```

    def relu() -> nn.ReLU: return nn.ReLU(inplace=False)

    ```


    # 2.2.4 Flattening Layer


    The last layer will be flattened layer. We will simply use Flatten for this purpose.
    Remember we can just use double question marks to show the source code of any
    function: ??Flatten.


    ??Flatten


