    Now let’s move over to the topic of **style transfer**.


    For style transfer we make use of a concept called *feature loss* or sometimes
    called *perception loss*. The central idea of this concept is to take care of
    the model’s input and output features and compare which ones are the same and
    which ones are different. To get the style of one image transferred to another,
    you simply adjust the different input-/output features.'
