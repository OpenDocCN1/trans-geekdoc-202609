- pgno: 6
  md: 'All chapters of this book are designed with a *work book style* in focus. You
    should get the code with a few lines of prosa text describing each variable of
    the examples. The book will not describe the theory on the algorithms that were
    implemented but just give you as much code as possible. You should try to replicate
    the examples and adapt them to suite your needs. You will get references to papers
    or tutorials for further reading if you are more interested in some background
    knowledge.


    The aim of developing this book was to give you an idea on how you can adapt those
    examples to fit your personal needs!


    # 1.1 Prerequisites


    This book is a collection of working examples on applying deep learning to real
    world problems. Therefore you should have some experience in Python programming
    and you should be familiar with basic concepts on deep learning with pytorch.


    All the code examples have been developed with Jupyter notebooks. If you are not
    familiar with Jupyter, just have a look at the documentation: https://jupyter.org/.


    If you want to run the code examples on your local machine, be sure to have a
    Nvidia GPU with at least 8 GB RAM installed. Also make sure you have installed
    jupyter server to run jupyter notebooks.


    You can also use google colab and run the examples online, totally free of charge.
    (Yes of course google will track all your activities... but who cares? Well at
    least not while studying.) Nevertheless, you should always consider data privacy
    with real world production projects.


    # 1.2 Resources


    While working with fastai, I have always received good advice by using the official
    forum: forums.fast.ai as well as the official documentation: docs.fast.ai.


    There is also a discord server on which you can attend live coding sessions'
  merge: -1
  img_proc: true
- pgno: 7
  md: "with Jeremy Howard (founder of fastai). Just use this link to get started:\
    \  \nhttps://discord.com/invite/xnpeRdgV.\n\n# 1.3 Introduction to fastai\n\n\
    Fastai is a library for easy development of deep neural nets that helps you make\
    \ state-of-the-art model architectures more easily accessible. You can dive deep\
    \ into the basics and adapt elements from the framework to suite your needs. The\
    \ framework is open-source and available via github.\n\nThere are four main types\
    \ of models directly supported by fastai:\n\n+   - Computer Vision (fastai2.vision)\n\
    +   - Tabular Data (fastai2.tabular)\n+   - Text (fastai2.text)\n+   - Collaborative\
    \ Filtering (fastai2.collab)\n\nThis means you can get going quickly with default\
    \ models on these classes. These are called applications in the fastai architecture\
    \ model. You can, however, dig deeper if you need more fine grained modifications.\n\
    \n**Fastai’s architecture consists of three layers:**\n\n+   - **High Level Applications:**\
    \ With the high level applications you can build state-of-the-art deep learning\
    \ models with less than ten lines of codes. Most beginners will start here.\n\
    +   - **Mid Layer API:** Provides more flexibility on designing your deep learning\
    \ applications. This level is especially useful if you need modifications on your\
    \ data pre-processing and data loaders or if you plan to use your own learners\
    \ and model architectures. With the mid layer api you can also monitor your training\
    \ progress with TensorBoard. You can schedule different values of hyper-parameters\
    \ for training or try different variants of regularization.\n+   - **Foundations:**\
    \ This level provides all the basic stuff if you need to work with tensors or\
    \ you want to manage operations directly on your GPU."
  merge: -1
  img_proc: true
- pgno: 8
  md: '![](img/d5454da46c702784893ef8b0b539e5b9_8_0.png)


    Fastai also integrates the concept of Callbacks. This helps you to use the same
    training loop for very different deep learning applications. You can customize
    your training loop to build GAN networks for example. Callbacks in fastai are
    two-way callbacks. They can read anything like data, parameters, etc. as well
    as write them. This means you can even do the training of a GAN with the same
    training loop.


    Some examples on how to use Callbacks are: * Learning Rate Schedulers * Implement
    early stopping * Do parallel training * Gradient Clipping


    Another concept that shows the great flexibility of fastai is that of a generic
    optimizer. You can create your own optimizer by just plugging in statistics, steppers
    and optimizers.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '![](img/d5454da46c702784893ef8b0b539e5b9_9_0.png)


    These architectures allow you to easily implement any new state-of-the-art optimizer
    on your own. The statistics module contains any data that you want to measure
    while doing the training. The stepper uses these stats to change the weights of
    the net. If you now combine these two modules (stats and steppers) you are able
    to implement any of the optimizers.


    With the data block api, you are able to get your data into any model. For using
    the data block api you need to know the following:


    +   - what type of data you have?

    +   - how do you get your data?

    +   - how do you split the data into training and validation sets?

    +   - how do you put your data into a data bunch?'
  merge: -1
  img_proc: true
