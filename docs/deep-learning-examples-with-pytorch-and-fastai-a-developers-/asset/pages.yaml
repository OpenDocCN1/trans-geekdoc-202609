    When detecting multiple labels, our model won’t use softmax to determine the label
    with the highest probability but needs a threshold value to return any label with
    a higher probability than the threshold.


    We also improve our loss-function and use BCEWithLogitsLossflat(). This is like
    CrossEntropyLoss but flattens input and targets. BCEWithLogitsLoss is built upon
    Sigmoid which is numerically unstable. Therefore we need to add similar loss modules
    to address this numerical instability issue.


    See: https://dev.fast.ai/layers.html#BCEWithLogitsLossFlat class

    BCEWithLogitsLossFlat(BaseLoss):

    "Same as `nn.CrossEntropyLoss`, but flattens input and

    → target."

