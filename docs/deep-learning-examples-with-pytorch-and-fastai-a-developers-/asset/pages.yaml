- pgno: 243
  md: '```

    class RetinaNet(nn.Module):

    """"Implements RetinaNet from

    → https://arxiv.org/abs/1708.02002""""

    def __init__(self, encoder:nn.Module, n_classes,

    → final_bias=0.,

    chs=256, n_anchors=9, flatten=True): super().__init__()

    self.n_classes,self.flatten = n_classes,flatten imsize = (256,256)

    sfs_szs = model_sizes(encoder, size=imsize) sfs_idxs =

    list(reversed(_get_sz_change_idxs(sfs_szs))) self.sfs =

    hook_outputs([encoder[i] for i in sfs_idxs]) self.encoder = encoder

    self.c5top5 = conv2d(sfs_szs[-1][1],

    chs,

    ks=1,

    bias=True)

    self.c5top6 = conv2d(sfs_szs[-1][1],

    chs,

    stride=2,

    bias=True)

    self.p6top7 = nn.Sequential(nn.ReLU(), conv2d(chs, chs, stride=2,

    → bias=True)) self.merges = nn.ModuleList([LateralUpsampleMerge(chs,

    sfs_szs[idx][1],

    hook)

    for idx,hook in zip(sfs_idxs[-2:-4:-1],

    self.sfs[-2:-4:-1]))

    self.smoothers = nn.ModuleList([conv2d(chs,

    chs,

    3,

    bias=True) for _

    → in range(3)])

    self.classifier = self._head_subnet(n_classes, n_anchors, final_bias, chs=chs)

    self.box_regressor = self._head_subnet(4, n_anchors, 0., → chs=chs)

    ```'
