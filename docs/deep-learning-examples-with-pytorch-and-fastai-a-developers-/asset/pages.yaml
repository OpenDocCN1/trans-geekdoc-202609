- pgno: 208
  md: "```\n```python\n(8): Linear(in_features=512, out_features=18, bias=False)\n\
    ```\n```\n\nHere we see the first layer of the fastai header that contains two\
    \ parallel pooling layers. This means that the output of the model goes to both\
    \ of them at once. If we look at the last Linear-layer we can see that this has\
    \ 512 inputs. Therefore we have to double them and we need a head with 1024 input\
    \ nodes.\n\nNow we concatenate the body and the head.\n\n```\n```python\nmodel_arch\
    \ = nn.Sequential(body, head)\n```\n```\n\nTo split this model we use the default\
    \ split-method from pytorch this time. We have to make sure that we really can\
    \ split the model, so we have to index into it. Because we had wrapped the whole\
    \ model into a Sequential model we have two indices. The first index takes 0 or\
    \ 1 for body or head and second index is used to address a specific layer within\
    \ that part of the whole model.\n\n```\n```python\ndef _resnet_split(m):\n   \
    \ return L(m[0][:6], m[0][6:], m[1:]).map(params)\nmodel_arch[1:]\n\nSequential\
    \ (1): Sequential (0): AdaptiveConcatPool2d( (ap):\nAdaptiveAvgPool2d(output_size=1)\
    \ (mp):\nAdaptiveMaxPool2d(output_size=1) ) (1): Flatten(full=False) (2):\nBatchNorm1d(1024,\
    \ eps=1e-05, momentum=0.1, affine=True,\ntrack_running_stats=True) (3): Dropout(p=0.25,\
    \ inplace=False) (4):\nLinear(in_features=1024, out_features=512, bias=False)\
    \ (5):\nReLU(inplace=True) (6): BatchNorm1d(512, eps=1e-05, momentum=0.1,\naffine=True,\
    \ track_running_stats=True) (7): Dropout(p=0.5, inplace=False)\n(8): Linear(in_features=512,\
    \ out_features=18, bias=False) ) )\n```\n```\n\nThe slicing-index [1:] grabs the\
    \ head of the model. Now we can freeze the body for training. We want to initialize\
    \ our model with kaiming_normal (https://pytorch.org/docs/stable/nn.init.html).\n\
    \nWe will use MSELossFlat as our loss-function, ranger and optimizer and start\
    \ training.\n\n```\n```python\ndataloaders.train.dataset[:10]\n```\n```"
