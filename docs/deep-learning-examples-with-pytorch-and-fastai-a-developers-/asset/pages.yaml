    ([[155, 96, 351, 270]], [''car'']))


    So for each image we get a list that contains a sublist with coordinates for each
    bounding box and a list of labels. We get 4 values for two coordinates (bottom-left
    and top-right).


    Next we want to build a image_to_bbox dictionary with all the images as'
