    # 23.4 Permutation Importance


    The main goal of this technique is to get an insight into which columns are more
    or less important for the accuracy of your model. We can do this by shuffling
    each column in the dataframe and analyzing how changing a particular column affects
    the y-values. If we do this shuffling, we are losing all the relations this column
    had with the model and we get an idea on how this variable affected the outcome
    of the model.


    We can do these permutation tests on the training data or on the testdata.

    These two give us different answers.

    The one on the validation set tells you:


    > “While the model was training, what was it looking at?”


    Whereas, the one on the training data tells you:'
