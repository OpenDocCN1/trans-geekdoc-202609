    The fastai library is not just an add on on top of pytorch. Fastai comes with
    many more features and implements state-of-the-art techniques from deep learning
    science with the goal to provide a very smart abstraction layer for building rich,
    performance models with four to five lines of codes.


    But you are also able to dig deep into the basics and use fastai for building
    your own, more sophisticated models. For this reason, fastai comes with a three
    tier architecture that we have already discussed above.


    Just a quick reminder:

    On top there are the four different applications (Vision, Text, Tabular, Colab).'
