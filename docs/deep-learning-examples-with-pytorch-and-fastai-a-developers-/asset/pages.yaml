    ```


    By now we can summarize why we did all these steps. We are on our way to implementing
    the loss-function. Our loss function will take three different items into consideration:


    +   - the extracted features from the encoder,

    +   - the style loss, and

    +   - the activation loss.


    For the **style loss** we have the input and output values and calculate *mean
    squared error* for all of them. You could say we compare how the generated outputs
    look in comparison to the original style-image.


    ```

    ```python

    #export

    def style_loss(inp:Tensor, out_feat:Tensor):

    """Calculate style loss, assumes we have `im_grams`"""

    # Get batch size

    bs = inp[0].shape[0]

    loss = []

    # For every item in our inputs

    for y, f in zip(*map(get_styles_features, [img_grams, → inp])):

    # Calculate MSE

    loss.append(F.mse_loss(y.repeat(bs, 1, 1), gram(f)))

    # Multiply their sum by 30000

    return 3e5 * sum(loss)

    ```

    ```


    Now we have to implement our individual loss-function in a way the fastai library
    accepts it.


    ```

    ```python

    #export

    class FeatureLoss(Module):


    """Combines two losses and features into a useable loss → function"""

    def __init__(self, feats, style_loss, act_loss): store_attr(self, ''feats, style_loss,
    act_loss'') self.reset_metrics()

    ```

