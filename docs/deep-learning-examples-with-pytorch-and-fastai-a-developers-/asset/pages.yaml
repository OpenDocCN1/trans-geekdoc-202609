    # MODEL ARCHITECTURE


    All the weights of the model are stored in the state_dict of the model. We use
    a function transfer_learn, pass in the learner, the name of the pretrained model’s
    weights and which device we want to use.


    With fastai models we normally also store the optimizers. Therefore we might have
    to index into model:


    ```

    new_state_dict = torch.load(model_path,

    → map_location=device)[''model'']

    ```


    Next we will check all layers if the layers match. If so, we copy all of the weights
    in the current state-dictionary into the new model’s state-dictionary.


    Last thing to do is to load the transferred state dictionary into our new model:
    learn.model.load_state_dict(learn_state_dict)


    ```

    def transfer_learn(learn:Learner, name:Path,

    → device:torch.device=None):

    "Load model `name` from `self.model_dir` using `device`, \ defaulting to `self.dls.device`."

    if device is None: device = learn.dls.device

    learn.model_dir = Path(learn.model_dir)

    if (learn.model_dir/name).with_suffix(''.pth'').exists():


    model_path = (learn.model_dir/name).with_suffix(''.pth'') else:

    model_path = name

    new_state_dict = torch.load(model_path,

    → map_location=device)[''model'']

    learn_state_dict = learn.model.state_dict()

    for name, param in learn_state_dict.items():

    ```'
