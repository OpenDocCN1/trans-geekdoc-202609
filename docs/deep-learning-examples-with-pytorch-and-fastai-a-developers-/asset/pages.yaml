    \ n_conv=4,\nchs=256):\n    \"Helper function to create one of the subnet for\
    \ regression/classification.\"\n    layers = [ConvLayer(chs,\n    chs,\n    bias=True,\n\
    \    norm_type=None) for _ in range(n_conv)]\n    layers += [conv2d(chs, n_classes\
    \ * n_anchors, bias=True)]\n    layers[-1].bias.data.zero_().add_(final_bias)\n\
