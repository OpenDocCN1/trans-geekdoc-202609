  md: '# Chapter 21


    # Introduction to Tabular Data – How to use Pandas DataFrame


    Before starting with tabular data, we have to go deeper into how tabular data
    is represented. The basic representation for tabular data in python is with the
    help of the Pandas-Library.


    Pandas is a library that makes working with tabular data really easy.

    Therefore we will now have a quick look at the pandas library - especially the
    pandas DataFrame class.


    We can create pandas DataFrame from different sources of data. These are some
    of them:


    +   - **read_csv**

    +   - **read_excel**

    +   - **read_feather**

    +   - **read_html**

    +   - **read_json**

    +   - **read_pickle**

    +   - **read_sql**

    +   - **read_table**


    We will focus on the read_csv-function to create a DataFrame. Generally you can
    read data from anything that can store data in a kind of table structure.

    For this intro we will use the *Titanic* dataset from kaggle.


    The *Titanic* dataset contains information on the passengers of the Titanic and
    if they have survived or not. For this introduction to pandas we will only use
    a minimum of the fastai library.


    ```

