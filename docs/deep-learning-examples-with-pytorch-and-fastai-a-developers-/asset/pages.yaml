    \   return [func(p).permute(0,2,3,1)\n        .view(*sz,-1,n_classes) for p,sz\
    \ in zip(p_states,sizes)]\n    else:\n        return torch.cat([func(p)\n    \
    \    .permute(0,2,3,1)\n        .contiguous()\n        .view(p.size(0),-1,n_classes)\
