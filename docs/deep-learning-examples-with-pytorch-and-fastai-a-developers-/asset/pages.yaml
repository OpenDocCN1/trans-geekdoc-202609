    \ the image outside of the image’s bounds, we remove the image from the dataset\n\
    +   - if there is any point with negative values, we also remove the image from\
    \ the dataset\n\n```\n```python\nbad_images = []\nfor img in images:\n    image\
    \ = PILImage.create(img)\n    y = get_y(img)\n    for coord_pair in y:\n     \
    \   # coordinate width in range 0 < x < image.width # coordinate height in\n \
    \       range 0 < x < image.height if coord_pair[0] > image.size[0] or coord_pair[0]\n\
    \        < 0 → or \\\n        coord_pair[1] > image.size[1] or coord_pair[1] <\
    \ 0: bad_images.append(img)\n```\n```\n\nNow let’s check how many bad image coordinates\
    \ we have found.\n\n```\n```python\nlen(bad_images)\n```\n```\n\nBut are these\
    \ filenames distinct names? Let’s create a distinct list by converting the list\
    \ into a set.\n\n```\n```python\nbad_images = set(bad_images)\nlen(bad_images)\n\
    ```\n```\n\nSo when we first run this script we will get about 350 duplicate names\
