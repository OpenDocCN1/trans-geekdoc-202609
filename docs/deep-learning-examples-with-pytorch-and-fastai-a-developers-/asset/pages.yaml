    # 3.1 Model Optimizer


    During optimization, our goal is to minimize the error (calculated by the loss
    function mse). Our optimizer starts with some random parameters, calculates the
    gradient and makes some adjustment to the parameters. Next, we repeat this step
    until our error is smaller than a value epsilon or until a fixed amount of epochs.
    (https://en.wikipedia.org/wiki/Stochastic_gradient_descent)


    First lets make this parameter:

    a = nn.Parameter(a); a

    Parameter containing: tensor([0.5000, 0.7500], requires_grad=True)


    Now we have to implement our update function which checks if the current value
    of our parameter a improves the training results. If so, move in this direction.


    ```

    def update():

    y_hat = x@a

    loss = mse(y, y_hat)

    ```'
