  md: '```

    def forward(self, pred, targ):

    # First get the features of our prediction and target pred_feat, targ_feat = self.feats(pred),

    → self.feats(targ)

    # Calculate style and activation loss

    style_loss = self.style_loss(pred_feat, targ_feat) act_loss = self.act_loss(pred_feat,
    targ_feat) # Store the loss

    self._add_loss(style_loss, act_loss)

    # Return the sum

    return style_loss + act_loss

    def reset_metrics(self):


    # Generates a blank metric

    self.metrics = dict(style = [], content = [])


    def _add_loss(self, style_loss, act_loss):

    # Add to our metrics

    self.metrics[''style''].append(style_loss)

    self.metrics[''content''].append(act_loss)

    ```


    With every new image getting into our model, we do NOT want to update the weights
    of the encoder because we do not want to train the model for the loss-function
    but the model for doing the style transfer.


    The forward-function does exactly the same as the forward-function in our model:
    it goes through the model, every time we call it. We get the predictions from
    the feature extractor. Then we calculate the loss and store it away.


    The reset_metrics just resets the values for the style and content losses.


    ```

    #export

    def act_loss(inp:Tensor, targ:Tensor):

    """"Calculate the MSE loss of the activation layers""""

    return F.mse_loss(inp[-1], targ[-1])

    ```


    Our activation loss just returns a mean-squared-error-loss on itself. Now we'
