    the data is not secure enough. Indeed, the systems usually use a personal identification
    number (PIN) to authenticate the user at the application level [18], but as in
    the previous case, the cryptographic procedures are flawed.


    # 4.2.3 Bluetooth Low Energy (BLE) or Bluetooth Smart


    Bluetooth Low Energy (BLE) or Bluetooth Smart uses wireless transmission. Because
    of its low-energy requirements, it has a wide application in the proximity payment
    sector, hence has its limitations as well. It has the advantage of securing exchanges
    by respecting the recommendations of the National Institute Standard and Technology
    (NIST). This organization has described two modes and security levels for a service
    between two devices connected via BLE [21, 22]:


    +   * For model 1, level 1 does not initiate encryption or authentication, level
    2 is only about encryption but not authentication, Level 3 requires authentication
    and encryption, and level 4 requires use of AES-CMAC elliptic curves of 250 bits
    in length.

    * For model 2, data signing is considered at two levels depending on whether authentication
    is required at level 1 or level 2 at the beginning of the connection.


    For a service such as mobile payment, where security is required, NIST recommends
    level 1 and level 4 where both devices authenticate and the exchanges encrypted
    using AES-CMAC with p-256 ECC.


    Moreover, BLE is compatible with most smartphones. This is an advantage since
    a mobile payment system with BLE has high availability.


    # 4.2.4 Wireless Application Protocol (WAP)


    The Wireless Application Protocol (WAP) allows a mobile device to access the Internet.
    Thanks to the integration of the Wireless Transport Layer Security (WTLS), which
    encrypts the exchanges, the security of the user’s data and authentication of
