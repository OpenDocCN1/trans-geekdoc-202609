    # 3.5.1.4 Fog Computing


    Fog is another layer of a distributed network environment closely associated with
    cloud computing. It stands for decentralized computing infrastructure that is
    located between the cloud and the data source, Figure 3.7 represents the IoT fog
    computing architecture, which is composed of three layers starting with the edge
    layer that is directly connected to the sensors, the fog layer, and finally the
    cloud layer. It compiles low-latency network connections between devices and endpoints.
    Fog nodes play a significant role by mitigating the impact of low latency and
    many IoT devices'' locations. Due to the relative distance to the data source,
    storing sensitive data becomes more accessible, reducing the impact of privacy
    issues. Data dissemination is a more critical privacy feature since the data cannot
    be transferred to the fog node without encryption. Once it is encrypted, searching,
    or retrieving the cipher text is very difficult. Moreover, it performs data aggregation
    to prevent and reduce data leakage and communications [30].


