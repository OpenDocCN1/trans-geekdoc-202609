    \n# 4.1 INTRODUCTION\n\nCOVID-19 and the multiple variants associated with it\
    \ have contributed to an accelera-\nt digital transformation. One of the most\
    \ viable areas of this\nmobile payments, which are related to financial technologies\
    \ or fintech. As of Amit Samsukha [1], in 2020, mobile payments have accounted\
    \ for 44.5% of all e-commerce transactions, double the amount of debit card payments\
    \ and triple the amount of credit cards. For 3.5 trillion dollars (USD), in 2018,\
    \ with its\ndevelopment, should reach, according to Fortune Business Insights\
    \ [2], 19.9 billion\ndollars in 2026. In Quebec, the use of in-store mobile payments\
    \ by adults\njumped by 8 percentage points [3], from 17% in 2019, to reach 25%,\
    \ in 2021.\n\nDuring the pandemic, contactless digital payments [4], such as cards\
    \ or e-wallets,\nwere recommended. The need for remote payments is driving the\
    \ creation of either\nservices for some companies or new players in the financial\
    \ technology sector.\nThis requires choice of secure infrastructures to collect,\
    \ store, and use data.\nIndeed data collection represents a significant risk to\
    \ privacy, especially when\nit is used to profile citizens. As shown by the European\
    \ Data Protection Supervisor\n(EDPS), it can increase the risk of cyber-attacks\
    \ [5]. During this pandemic\ncontext, the cybersecurity market, including online\
    \ crime, threats, and the fear\nbreaches, to exploit the vulnerability of individuals\
    \ and the fear that\nhold takes in cities [6]. Unprecedented strategies have been\
    \ used to steal funds and\ncollect data [7]. In the United States, between February\
    \ and April 2020,\ncyber-attacking the financial sector increased by 238% [6].\
    \ In the face of this,\nglobal spending on cybersecurity will need to increase\
    \ from $173 billion in 2020 to\n$270 billion in 2026, according to Forbes [8].\
    \ This chapter focuses on the problem ofnt security of personal data generated\
    \ in digital environments, highlighting the eth-\n issues related to technologies\
    \ used in fintech including mobile payment systems.\nEthics aims at protecting\
    \ people. It anticipates privacy issues to better\nent them. In the field of mobile\
    \ payments, it considers technologies and legal"
