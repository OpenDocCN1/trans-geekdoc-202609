    the data available on the marketplace, the data provider ''publishes'' the data
    using the Ocean NFT Factory, which creates a new NFT. In an earlier version, only
    ERC20 tokens were used. However, since datasets are typically shared more than
    once among many people, OP now makes a kinda NFT to define the ownership rights,
    with each NFT having one or more data tokens to separately define and access rights.


    The Keeper node is used for running keeper contracts (a set of smart contracts)
