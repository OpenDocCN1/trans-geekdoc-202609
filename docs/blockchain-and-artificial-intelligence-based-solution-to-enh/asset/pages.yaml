- pgno: 169
  md: '# Cyber Influence Stakes


    platforms are conduits of the information disorder. Misinformation is generally
    used to refer to misleading information created or disseminated without manipulative
    or malicious intent (Berge, 2018). Propaganda is the promotion of ideas.


    Cyber influence is to obtain an advantage over adversary via Internet (Grimes,
    1978). We will see further that it could be a political, economic, or ideological
    advantage. So cyber influence is generally part of a whole strategy but, to avoid
    a military response, the cyber threat actors adapt their digital techniques to
    stay anonymous and just below the threshold of war (Hhenschke et al., 2020).


    In general, fake news, propaganda, and disinformation are all synonyms. Cyber
    influence is spreading fake news or disinformation on social media to promote
    a point of view or political cause and to have a huge influence without spending
    a lot of money. It''s worth it.


    It''s important to distinguish the word “influence” and “interference.” Interference
    is activities that violate the law (Government of Canada, 2021). But the line
    between legal and illegal is sometimes fuzzy.


    # 7.2.2 TYPES OF INFLUENCERS


    The Communications Security Establishment of Canada has identified cyber threat
    actors’ profiles. Those who can influence the democratic process are mainly those:
    nation-states, hacktivists, and political actors (Government of Canada, 2018).
    We will detail each of these.


    # 7.2.2.1 Nation-states


    Influenced countries, such as the US, China, and Russia, have the most sophisticated
    means and use cyber influence for economic, ideological, and political purposes.
    As we have during the 2016 US presidential election, threat actors have tried
    to amplify social disputes, like Black Lives Matter. As noted in The Canadian
    cyber threat assessment, “they try to emphasize friction in democratic societies
    around political, economic issues, and other values such as human and liberty.
    They adapt their dialogues to the new context, and change their strategies” (Government
    of Canada, 2020). They even pay journalists to write biased articles to give more
    credibility to the messages; we have seen that in the past.


    According to this (Martin & Shapiro, 2019), Russia has been the leading country
    to use cyber influence strategies around the world since 2017. Indeed, the Russian
    army, the Kremlin, largely finances these activities. Their goal is to erode the
    liberal model, by exploiting the internal division within liberal parties in Europe
    and US and amplifying social division.


    Even the US is the most targeted country with 38% of cyber influence cases since
    2013 (Martin & Shapiro, 2019), this state used well cyber influence to gain economic
    and ideological purposes. For examples noted in De Rocheonde and Tenenbaum (2021),
    cyber influence can be used to ban extremist ideologies as Islamist organizations.
    It could also be used to disrupt an adversary’s activities as was the case, in
    2016, when the US wanted to confuse and influence the perceptions of Islamic State
    of Iraq fighters.'
