  md: '# # About the Authors


    **Fehmi Jaafar** is currently an associate professor at Québec University at Chicoutimi
    and an affiliate professor at Laval University and Concordia University.


    Previously, he was a researcher at the Computer Research Institute of Montréal,
    an adjunct professor at Concordia University of Edmonton, and a postdoctoral fellow
    at Queen''s University and Polytechnique Montréal.


    Dr. Fehmi Jaafar received his PhD from the Department of Computer Science at Montréal
    University, Canada. He is interested in cybersecurity in the Internet of Things,
    and improvement of the security and quality of software systems, and in the application
    of machine learning techniques in cybersecurity.


    His research has been published in top venues including the *Journal of Empirical
    Software Engineering (EMSE)* and the *Journal of Software: Evolution and Process
    (JSEP)*. He established externally funded research programs in collaboration with
    Defence Canada, Safety Canada, Natural Sciences and Engineering Research Council
    of Canada (NSERC), Mathematics of Information Technology and Complex Systems (MITACS),
    industrial partners, and foreign organizations.


    ![](img/22da15453f020b9665d0b01ac32670f9_7_0.png)


    **Dr. Schallum Pierre** is an EDI, Ethics and Innovation advisor at Institute
    of Intelligence and Data (IID) at Université Laval and a part-time professor in
    social communications at Saint Paul University. He contributes to the implementation
    of ethics by design in research projects and in data validation at IID. As an
    innovation advisor, he accompanies public and private organizations in R&D Industrial
    Research Assistance Program by the National Research Council of Canada (NRC-IRAP)
    at Université Laval.


    His rich and varied experience in responsible-entrepreneurship is put to use in
    collaborations with the socio-economic milieu of the greater Québec City area
    in knowledge and technology transfer related to AI and data validation.


    As a researcher, Schallum is interested in ethical issues related to AI and Blockchain.
    His research interests include the issue of protecting sensitive data in the healthcare,
    social media, and mobile payment sectors. He holds a PhD in philosophy from Université
    Laval, and completed a postdoctoral fellowship at Polytechnique Montréal.


    He is a member of the International Association of Privacy Professionals, the
    Ethics Committee of the CHU de Québec – Université Laval, the Open Government
    Committee of Québec, and the editorial board of the journal *Technologie et innovation*.'
