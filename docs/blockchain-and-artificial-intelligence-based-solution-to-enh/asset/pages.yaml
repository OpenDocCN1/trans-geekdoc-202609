    whose security is based on the Transport Layer Security (TLS) protocol which allows
    strong authentication and runs in the SIM module. Transactions are completed in
    under a second. However, MobiSIM faces relay attacks. In addition to this relay
    attack, the problem of limiting the use of contactless bank cards by the network
    must be solved. Indeed, these peripheral cards can only perform a limited number
    of contactless transactions. They require the entry of a PIN after a few dozen
    payments [40]. As the phone is now a tool through which users store several cases
