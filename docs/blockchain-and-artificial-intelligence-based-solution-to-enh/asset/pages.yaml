    Blockchain provides security and privacy in that it provides a way of digital
    identity that consumers feel more comfortable in sharing their data. This self-sovereign
    identity is based on two principles i.e., consent and control. Consent is the
    permission among individuals and organizations defining which information could
    be used by, while the control feature ensures the complete ownership of personal
    data to their owners. This self-sovereign identity model gives privacy control
    to the consumer as it reduces the probability of identity breaches and fraudulent
    activities in businesses [19].


    Having said the world is digitally connected today and every transaction of data
    can be perceived within seconds across the globe, however, there still exists
    the question of security of data and transactions. Blockchain technology for managing
    identity enables citizens to build a more connected society with a secure identity.
    Another major advantage of blockchain is that the public ledger cannot be modified
    or altered after the data has been approved by nodes. Due to many features of
    security, data integrity, and anonymity without the need for a thirdparty/organization,
    blockchain has its significance in digital identity [20]. The blockchain works
    assuming that honest and reliable nodes control the whole network if the attacker
    gets more computational power than the hottest nodes, then the network could become
    vulnerable to attacks [17, 20].


    Since, blockchain technology does not depend on decentralized control authority,
    it can efficiently manage both consent and control of personal information. It
    contains smart contracts and assured rules for securing the personal information
    of consumers. They define who can collect identity-related data, who has access
    to it, and to what level access is granted [19]. For example, blockchain can verify
    identity without revealing details behind identity. In other words, required data
    can be widely shared in a transparent manner and protected at the same time.


