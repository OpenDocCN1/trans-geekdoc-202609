    DID document, the secure communication via DIDComm, and verifiable credentials
    (VCs), both organizations have developed standards that will have a lasting impact
    on the SSI ecosystem. The following is an introduction to those topics to help
    you understand them better.


    # 2.4.1 DECENTRALIZED IDENTIFIER (DID)


    Decentralized identifiers are a standard proposed by the W3C Credentials Community
    Group (Sprony et al., 2021). DIDs provide a way for individuals and companies,
    as well as devices, to create a permanent, globally unique, and cryptographically
    verifiable digital identity that is completely under the control of the owner
    of that identity. In this context, DIDs represent a kind of digital identities,
    such as the URI (Uniform Resource Identifier) for websites. Unlike URIs, however,
    they must meet some additional criteria to be consistent with the SSI concept:


    +   - No involvement of a central authority, either in registering, assigning,
    deactivating, or updating the associated data. Most of today''s URIs are based
    on DNS names or IP addresses, which are managed by a central authority.

    - Control over the DID and associated metadata including their public key can
    be cryptographically verified. Authentication via a DID uses the same public/private
    key encryption scheme as blockchain technology.


    The independence of the DID is intended to ensure that no central authority or
    company can revoke access to one''s identity. Today, this is not the case, and
    digital identities as e-mail addresses and social media profiles are handled by
    the service provider. Since DID meet the same cryptographic criteria as blockchain
    technology, they also have the same characteristics in security against malicious
    interference or tampering. The owner of the identity basically exercises control
    over the DID by possessing the private key associated with it.

    A DID basically consists of three parts:


    +   - the URL scheme identifier, which indicates that the object is a DID,

    - the identifier of which DID method is used, and

    - an address defined according to the DID method, which points to the DID document.


    The individual parts are separated by a colon and a simple example of the DID
    looks like:


    ```

    did:example:123456789abcdefghi

    ```


    # 2.4.2 DID DOCUMENT


    As mentioned before, the DID points to a DID document that can be stored on a
    blockchain or another registry. The DID document contains the public key for the
    DID including information about the encryption algorithm used, other public'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Blockchain for Digital Identity


    credentials (e.g., additional public keys) that the identity holder wishes to
    disclose, and the corresponding network addresses. It is essential that the DID
    document contains no information about the owner or other person identifying information.


    A DID document is typically composed of the following properties (Sporny et al.,
    2021):


    +   - **Context**: Identifier for the standards used in the document.

    - **DID subject**: Identifier or information about the DID that is described by
    the DID document.

    - **Public keys**: Are required for digital signatures as well as encryption and
    decryption, which in turn serve as the basis for processes for authentication
    or the establishment of secure connections with service endpoints. If a DID document
    does not contain a public key, it can be assumed that the public key has been
    revoked or is invalid. Each public key must have an id and type property, where
    the id only be used once within the DID document.

    - **Authentication**: How a DID subject can cryptographically prove its identity.

    - **Authorization and delegation**: Defines how processes can be executed on behalf
    of the DID subject. Delegation describes what a DID subject can use to authorize
    others to act on its behalf.

    - **Service endpoints**: Can represent any type of service, such as identity management
    services, authentication/authorization services, social networks, data, storage,
    etc.


    # 2.4.3 DIDComm


    Secure communication on the Internet is key. Most protocols “rely on keys, identity
    providers, certificate authorities, browser or app vendors, or similarly decentralized
    assumption” (Curren et al., 2021).


    DIDComm defines a secure and private communication method that is built on decentralized
    identifiers. It is an agent-based approach where an agent is intended to be the
    user''s wallet. The endpoints and public keys of the involved parties in the communication
    are obtained from the DIDs and DID documents. From a technology perspective, the
    DIDComm signed message is a JWT (JSON Web Messages) envelope.


    # 2.4.4 Verifiable Credentials (VCs)


    Credentials are an essential part of each identity system. VCs are digital credentials
    that are cryptographically secure, privacy respecting, and machine-verifiable
    (Sporny, Longley & Chadwick, 2021). Owners or holders of VCs can create verifiable
    presentations from them and present them to verifiers. VCs are signed by the issuer
    of the credential. It can be seen as a proof backed by evidence today statement
    of the claim. In order to verify the legitimacy of a VC, the verifier has access
    to a verifiable data registry, e.g., a blockchain storing the DIDs and DID documents
    of the issuer.


    Various technology implementations for VCs exist today, but none has succeeded.
    Some of the buzzwords are JSON-JWT, JSON-LD, ZKP-CL, and JSON-LD ZKP'
