    # 3.2.1 HISTORY


    The term IoT was first documented by Kevin Ashton in MIT Auto-ID center in 1999
    [7]. It was first designated to describe systems that could connect and communicate
    with the Internet via a universal network of sensors. This description has changed
    over time beyond the original intention. But it is essential to study the root
    of it all to understand its full content. From the birth of the Internet in 1989,
    the idea of connecting things on the Internet has grown tremendously, leading
    to the creation of a massive field of research. One of the first creations in
    this field was a coffee toaster created by John Romkey in 1990 [57], it was able
    to be turned on/off using the Internet. 1994 saw the birth of the first internet
    wear created by Steve Steann, with almost real-time performance. By 1997, sensors
    started to get global attention about their importance in the future and to achieve
    automation tasks, and this was explained by Paul Saffo in sensors of sensors and
    further course [59]. All of this led the way for Kevin Ashton to create the IoT
    during a presentation for Procter Gamble, who described IoT as a technology that
    connected several devices with the help of radio frequency identification (RFID)
    tags for supply chain management. In early 2000, the Internet was thriving, and
    everyone wanted to continue; it LG presenting the first-ever smart refrigerator
    that would automatically determine whether or not food items were replenished.
    By time, it was clear that most industries were training to adapt to this new
    technology. RFID started to be deployed at an enormous rate. In 2003 retail giant
    Walmart deployed RFID in all its shops globally, and many companies followed that.
    In 2008, a group of companies launched the IPO Alliance to promote Internet Protocol
    (IP) use in networks of “smart objects” and enable the IoT. And by the end of
    2011, IPv6 was introduced, leading to a massive interest in this field, and IoT
    was adopted by major communication companies such as IBM, Cisco, and Google. Figure
    3.2 presents a full schema of the evolution of IoT from 1990 to 2016. Three major
    technologies responsible for the breakthrough of IoT are discussed below, and
    Table 3.1 summarizes the main differences between them.


