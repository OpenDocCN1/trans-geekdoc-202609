- pgno: 154
  md: '# 142 Blockchain and Artificial Intelligence-Based Solution


    overreaching when they have been provided with consent for data sharing and use,
    limiting the data and purposes for which they can use the data to those consented
    by the individual data provider and preventing the consumer from unilaterally,
    and without the consent of the data provider, sharing the data with another party
    for another purpose. As previously mentioned, in both solutions, controls to prevent
    this unauthorized secondary data use are still quite niche.


    # 6.3.4 PRINCIPLE 4: THE INDIVIDUAL HAS BEEN APPROPRIATELY COMPENSATED FOR THE
    SHARING OF THEIR DATA


    Both solutions support the operation of a data marketplace that provides a means
    by which individual data providers might be compensated for the sharing of their
    data. In the case of the SSI solution, it is the data provider sets the price
    at which the data will be licensed for use. While this places a good amount of
    control in the hands of the individual data provider, it leaves them with the
    task of determining a fair market price, which given information asymmetries,
    might be difficult to do. In this regard, the OP solution offers better mechanisms
    for determining fair market price, such as its automatic pricing (AMM) service.
    Neither solution grapples with the larger questions around the ethics of monetizing
    health data and the potential for societal harmful outcomes that monetization
    might engender given unregulated pricing policies. For example, high prices for
    data could encourage to sell access to their data even when such access might
    lead to reidentification and privacy breaches or when the trustworthiness of the
    consumer cannot be guaranteed. It is matter that deserves the attention of, for
    example, bioethicists and health economists to ensure ethical operational of both
    solutions.


    In each solution, a token is used as compensation for data sharing and use. OP
    use tokens in return for exchange of data tokens as well as maintaining the OP
    marketplace. Hyperledger Indy/has a TRC20 exchange token; however, the SSI solution
    uses the Tether USD stable coin, embedding a payment transaction hash as a variable
    in the license credential, which is subsequently presented to the individual data
    provider as a verifiable proof of payment before access is given.


    # 6.4 DISCUSSION AND CONCLUSION


    In this chapter, we have contributed to a definition and research on fair data
    processing through analysis of two solutions designed for individuals to share
    their health data for purposes of AI-driven health research – one that uses the
    Hyperledger Aries protocol, the ‘Self-Sovereign’ (SSI) data marketplace, and the
    other an Ethereum-based solution, called OP data marketplace. Based on an implementation
    of data marketplaces using both protocols, we evaluated the strengths and weaknesses
    of each solution vis-a-vis principles of fair data processing in relation to data
    sharing and protecting individuals from data double spending. We found that both
    solutions are still quite limited in the protection they provide against unauthorized
    secondary use of data by a third party, even though they align reasonably well
    with the main principles of fair data processing.'
