    with BBS+. Without convergence, there will be no functional connectedness across
    the ecosystems (Young, 2021).


    # 2.4.5 WALLET


    As described, the whole concept behind SSI is based on cryptographical keys and
    proofs. For usability reasons, the private keys, which proof the ownership and
    the identity of a person or object, are stored in wallets. Those wallets can be
    seen as a physical wallet storing the secret information for the holder. In addition,
    software wallets perform the signing process, the setup of a secure communication
    (DIDComm), as well as the lookup of DID and DID documents.


    From the standpoint of the user, the wallet is most used in the identity ecosystem.
    Therefore, “usability is one of the most important aspects and crucial for acceptance
    and adoption” (Digital Switzerland, 2022). It should be noted that today''s wallet
    solutions fall short of the requisite agility, and many of the standards outlined
    in Digital Switzerland (2022) have yet to be met.


    # 2.4.6 ZERO-KNOWLEDGE PROOF


    One big advantage of SSI is the ability to present only selected information to
    the verifier. This reduces the amount of data shared and enhances data privacy.
    With the possibility of creating zero-knowledge proofs, this data privacy can
    be enhanced by one step further. A zero-knowledge proof (ZKP) is a method by which
    one party (prover) can prove to another (verifier) that it knows information without
    having to transmit it. Apart from the information that prover knows x, the verifier
    learns nothing. Especially for privacy-sensitive data like person-describing data,
    ZKPs are ideal way of minimizing the data footage.


    In the following, a example is given to clarify and describe the above concepts.
    Let''s assume Alice has turned 18 and is allowed to visit the local casino. She
    (holder) holds VCs about her identity name, birthday, residence, and body size,
    issued by the government (issuer). Those VCs are stored in software wallet on
    her mobile phone. At the entrance to the casino, Bob wants to check Alice''s age.
    Instead of showing her identity card with all personal information on it, she
    decides to use SSI. By sharing a QR code, her wallet establishes a secure communication
    to Bob''s wallet. Bob works like Alice''s wallet creates a ZKP and its wallet
    verifies the ZKP and the issuers'' identity and legitimacy interacting with a
    node of the identity registry blockchain. Bob only gets to know Alice is older
    than 18 and that this was proved by the government. With this information, nothing
    stands in the way of a pleasant evening and Alice is allowed to enter the casino.


    # 2.5 GOVERNANCE


    Even though SSI is based on a large technological foundation, it should not be
    seen as a technology-driven concept. Without a sophisticated governance framework,
    technology stands alone and trust in the system cannot be created.'
