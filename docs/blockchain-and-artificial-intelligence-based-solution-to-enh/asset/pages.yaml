  md: 'Blockchain, AI, and Data Protection 127


    # 6.1.1 BLOCKCHAIN, AI, AND DATA PROTECTION


    Blockchains have the potential to address data protection concerns in several
    ways: Data stored in a blockchains cannot be changed or deleted without detection
    (i.e., data are said to be ‘immutable’) [11]; blockchains'' decentralized architecture
    ensures that no central authority controls data access and storage [12]; and blockchains
    can enable individuals to retain possession of the private keys that control access
    to and use of their personal data (sometimes referred to as ‘Self-Sovereign’ identity,
    or SSI, and often associated with the management of identity data, from which
    the moniker ‘Self-Sovereign Identity,’ is derived) [13].


    Recent projects focus on the application of blockchain in healthcare seek to leverage
    these capabilities to address data protection challenges associated with use of
    real-world healthcare data. For example, Carlini et al. [14] present the ‘Genesis’
    platform to make available the users of genomic services connecting their data
    to research centers, pharmaceutical companies, hospitals, and genetics. The capabilities
    of blockchain technology are used to notarize data and make them available for
    legitimate actors safeguarding data from unauthorized use to promote an ecosystem,
    and a fair marketplace, for all types of biomedical data. In a similar fashion,
    the *PharmaLedger* project [15], which proposes a consortium of pharmaceutical
    and technology experts, patients, and hospitals to deliver an open service, blockchain-based
    platform to build an ecosystem that promotes trust, transparency, and immutability
    and ensures privacy by means of decentralized and individual control. In another
    example, Lenieux et al. [16] developed an SSI blockchain solution for secure and
    privacy-preserving health data to explore how users would respond to navigating
    the complexity of blockchain technology for consenting to the sharing of their
    health data.


    # 6.1.2 The Data Double-Spending Problem


    While the literature on blockchain''s application in healthcare recognizes data
    protection as a key constraint and design consideration, and projects like those
    cited above are rising to the challenge of designing with the protection of users''
    data in mind, solutions do not often consider the issue of unauthorized use of
    data. When secondary use of data is not consented to by individual data subjects,
    we refer to this as ‘data double spending’ [17, 18]. Data double spending contravenes
    one of the principles of fairness in the processing of personally identifiable
    data, that is individuals should consent to the sharing of and specific use of
    their data. Other principles include that the individual should control and custody
    over their own data, be able to withdraw consent for the use of their data and
    be appropriately compensated for the sharing of their data [19].


    Data double spending has become quite common in data-driven business models, including
    those in the healthcare sector. It occurs when individuals give consent to access
    and use of their data for a specific primary purpose, such as to receive a genetic
