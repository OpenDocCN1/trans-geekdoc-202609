    Data is today in the category of the technological transformation of our societies.
    As an intangible asset, it differs from other goods as oil with which it is often
    compared. Indeed, data does not dry up when we use it. Data''s ability to be reused
    – its secondary use – ad infinitum puts it in the category of a "nonrival" asset.
    These characteristics are essential to develop emerging technologies such as AI
    and blockchain as create value in societies. The gross domestic product (GDP)
    is the total monetary or market value of all the finished goods and services produced
    in a specific year. According to PwC, by 2030, a 14% growth in global GDP is expected
    from AI, or $15.7 trillion. Depending on their degree of preparation and involvement,
    some countries with low GDP today could benefit and experience significant advances.
    If AI could be an advantage for today''s societies, the privacy issues related
    to its management must be raised in order to design eco-responsible innovations
    that are reflective of the human being and of the environment.


    In the different chapters of this book, we explored the main domains that remain
    considerable risks for the respect of privacy, such as education, health, finance,
    or social media.


    Through their please participate in the massive data production industry, the
    Internet of Things (IoTs) participates in the development of AI and is increasingly
    attracting the attention of web giants, governments and all types of hackers.
    Hackers to this book, private and public organizations will have at their disposal
    a tool that highlights on one hand, the major challenges raised by privacy in
    the context of the Internet of Things and on the other hand recommendations for
    improving good practices.


    Digital identity is presented as a benchmark for the protection of privacy. It
    opens up new avenues for improving digital trust. Concretely, there are a set
    of challenges


