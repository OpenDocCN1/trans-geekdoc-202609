- pgno: 170
  md: '# 7.2.2.2 Hacktists


    Hacktists are hackers'' activists with a political or ideological goal. For example,
    a well-known group is Anonymous. They are known for their various cyberattacks
    against several governments around the world.


    When the war started in Ukraine in 2022, several other groups (e.g., Squad 33)
    joined Anonymous to declare war on Russia. A multitude of cyberattacks, such as
    denial of service (DDoS), made servers unreachable; Kremlin website and television
    RT website; malware wiper, which have stolen information from the servers of Roskomnadzor,
    the Russian media policemen. Those malware took control of Russian news channels,
    to show images of Russian attacks (Maria, 2022).


    Russia has its own cyberattack called IRA, the Internet Research Agency. Since
    2014, several cyberattacks have occurred in Ukraine, such as electoral interference
    to government and public services (e.g., gas, healthcare, etc.) which were caused
    by destructive malware, KillDisc, and Industroyer, and each of them has caused
    an electricity blackout (out Dechehende & Tenenbaum, 2021).


    # 7.2.2.3 Political Actors


    Political actors are motivated by their elections. They can be well funded by
    rich people who have their interests and have power to manipulate the election.
    This is the case of the Cambridge Analytica and Aggregate IQ scan. At the time,
    these companies were owned by the billionaire Robert Mercer and headed by Donald
    Trump''s key advisor, Steve Bannon. In 2014, Facebook accounts were sold to those
    companies. In 2016, for Trump''s US election purpose, those companies created
    profiles of 230 million Americans and targeted them with political advertisements,
    reported by Derosa (2018).


    Furthermore, those companies provided services to British political organizations,
    which were involved in the Leave the European Union campaign during the 2016 Brexit
    referendum (Cadwalder, 2018).


    Robert Mercer has political interests. He has invested millions of dollars to
    manipulate elections such as Trump''s presidential election in 2016, and to influence
    groups who are against climate change (Delevinge, 2014). We think that influencers
    or megadonons are not followed enough for their underground activities on social
    media. They are not labeled because big influencers are usually unknown.


    Other influencers have been used during the 2016 presidential election, such as
    the QAnon movement, who have sent threatening messages to voters (Laviola, 2018).


    Finally, Donald Trump is a political actor who retains great influence. Even though
    he is no longer the president of the US, he continues to influence his supporters.
    Banned from social networks as Twitter, he decided to launch his social network.
    According to Lachappelle (2022), Truth Social will be launched and expected to
    have no less than 75 million users worldwide, while Facebook''s users in its first
    year were one million. It could be a way to manipulate information to influence
    these undecided voters for the next election. In May 2022, it was the most downloaded
    platform on Apple Store.


    In sum, political actors and those who financed them could be those who influence
    the most. We do not know them exactly and what influenced groups they are'
