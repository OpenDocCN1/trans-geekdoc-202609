    of services to current terminals, which Samuel Pierre foreseen long ago [23].


    # 4.2.5 Quick Response Code (QRC)


    The “Quick Response Code” (QRC) or “black and white matrix codes” or “Data Matrix
    code” is a two-dimensional barcode, also known as a 2D code or matrix code. It
    makes it possible to read numeric, alphanumeric, or binary data with a smartphone
    equipped with a camera. The Secure QRC (SQRC) has been added to the set-in order
    to strengthen the encryption measures because it has serious problems, in particular,
    the redirection of the user to a malicious site, which is a fake site capable
    of stealing financial data [24]. It is comparable to BLE in terms of accessibility,
    as it is available on mid-range phones.'
