  md: 'All the above apply with variations to IoT devices as well. As described in
    Weingaartner and Camenzind (2021), the concepts of SSI can be applied to IoT devices,
    which allows the traceability of the origin of these devices.


    # 2.3 USE CASES


    Following this overview, the following examples demonstrate the necessity of identification
    in a variety of digital scenarios. They demonstrate a wide range of potential
    applications for blockchain and SSI. Many of these instances are on the cusp of
    becoming viable options. On the other hand, they are still in beta form and are
    closely linked to research.


    # 2.3.1 CARDOSSIER – LIVE CYCLE OF AN AUTOMILE


    In 2017, the research project Cardossier² started in Switzerland. The aim of this
    project was to manage the life cycle of cars on a blockchain infrastructure. In
    2019, the project members founded an association to continue the work of the initial
    research project. With the commissioning of the first 11 records in 2020, a further
    important milestone was reached. Cardossier builds an infrastructure that allows
    all participants in the automotive ecosystem Switzerland to implement their individual
    use cases and business cases on top. Examples are the car import process, car
    registration, used car dealership, or service documentation.


    Identities of both the participants and the cars – a major aspect of the whole
    ecosystem. Due to the lack of an official electronic device, Cardossier association
    implemented SSI solution¹. This first pilot shows the potential of the combination
    of existing government services like certification of residence and new, innovative
    solutions. It also shows some of the limitations SSI facing today. First and foremost,
    the user experience and usability. Many wallets (see below) are still in a rudimentary
    stage and designed for savvy users.


    # 2.3.2 IDENTITY OF THINGS


    Due to rapid growth and high numbers of similar devices, reliable identification
    of IoT devices is issue. The origin and history of an IoT device is especially
    important in security-relevant environments. In Weingaartner and Camenzind (2021),
    the blockchain and SSI-based system is presented that allows the manufacturer
    to register their devices in a nonproprietary ecosystem. During the bootstrapping
    process in a client environment, the device is identified by a registrar service
    and a connection between device and registrar is established. This connection
    can be documented using verifiable credentials.


    This demonstrates how, in the future, the identities of things will be as significant
    as the identities of people. In a world where objects operate on behalf of humans
    and it becomes increasingly whether a real person or a thing is acting on their
    behalf, the identities of such things become increasingly crucial. The security
    of such devices, as well as their identity if they have one, is a major problem
    and today''s research.'
