    # 3.1.1 PRIVACY ISSUES REVISITED


    As the Internet is taking over our daily lives, most of the world’s data, such
    as videos, social information, and many more, is constantly published and shared
    over the global network; privacy is becoming a major target and a right that keeps
    fading over time raises prime concerns [12]. Moreover, the rise of IoT devices
    connected to the Internet and collecting extensive data carries a comprehensive
    risk to users’ privacy. An entity has the right to determine the amount of data
    it is willing to provide with a system or others. Still, despite this, many labeled
    data of a person can be collected without the person consent using IoT devices.
    Having control of personal data can be becoming difficult, if not impossible,
    especially when, in multiple cases, that is necessary for the device’ proper function.
    Especially the identification of an individual and their behavioral patterns is
    a growing concern. As IoT devices are increasingly used in all fields of daily
    life, such as the healthcare sector [40], a great amount of considered private
    information is collected by sensors and for analysis study reasons, all potentially
    without adequate accountability, transparency, security, or meaningful consent.
    It is quite to say that consumers are infringing their privacy without noticing.
    As a wearable, smart applications, and Wi-Fi increase demand and replace “old”
    devices. Consumers are not capable of purchasing devices that won’t collect their
    data and track them. So, it becomes necessary to discuss the implications of the
    IoT and the need to integrate privacy and safeguards into creating and implementing
    smart environment components.


