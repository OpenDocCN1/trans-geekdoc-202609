    written to the ledger be detectable, a consensus mechanism must be implemented.
    The Bitcoin protocol achieves transaction blocks using proof-of-work, which must
    be proportional to the network''s total computing power, to ensure a smooth and
    competitive operation. However, for such a large network to synchronize, the maximum
    throughput is restricted to a few transactions per second. Correspondingly, the
    Byzantine Fault Tolerance (BFT) consensus in permitted blockchains arose from
    the need to protect distributed systems from the threat of ‘Byzantine failure’,
    where individual nodes in the network may be delayed in receiving new information
    from other nodes or may be sent-constructed information from malicious nodes.
    Existing BFT protocols demonstrate thousands of transactions per second with dozens
    of nodes. The Redundant Byzantine Fault Tolerance project was used as the consensus
    mechanism in the Hyperledger Indy blockchain project, which operates as a decentralized
    public key registry in the SSI stack, because of its resilience and fast recovery
    properties.


    SSI credential-based solutions have privacy guarantees that other recording methods.
    SSI systems tackle with recordkeeping that affects other types of dributed ledgers
    (i.e., personal information leakage from recording transactions on ledger). When
    clinical trial transactions are maintained on a blockchain, records frequently
    contain personally information or metadata that could lead to reidentification
    of an individual, putting compliance with privacy and data protection at risk.
    SSI systems that do not record transactions on a ledger are designed to be highly
    privacy-preserving and comply with data protection legislation (e.g., the EU’s
    General Data Protection Regulation) since they do raise the prospect of having
    delete identifiable data from a ledger.


    On the other hand, how to consume data while being able to protect data privacy
    and security prevent leakage of sensitive information is a major challenge in
    data science today. Confidential computing was born to solve this problem [23].
    Privacy-enhancing cryptography-based technology in the field of confidential computing,
    known as Fully Homomorphic Encryption (FHE) [24], was introduced in 2009. FHE
    allows computations on encrypted data while preserving the features and the format
    of the plain text. Thus, sensitive data, such as genetic and health data, can
    be stored in an encrypted form without losing the utility of the data.


    This case studies a new design and implementation of a decentralized and privacy-preserving
    usage control infrastructure aimed at overcoming the limitations of centralized
    data usage wherein (I) formulation of the data usage policies (i.e., licensing)
    and subsequent data usage is under the control of the individual data subject,
    (2) the data subject receives compensation for the use of their data, and (3)
    secondary use of the data that has not authorized by the data subject is prevented.
    The solution was first presented in Kang and Lemieux [18]. It integrates a new
    individual-centered digital management model with the use of decentralized distributed
    identifiers (DIDs) and verifiable credentials (VCs) to establish a self-sovereign-oriented
    distributed trust architecture. FHE capabilities achieve additional privacy and
    data usage control. The solution design allows for data holders (who we envision
    also to be the data subjects) to configure a license for their data, integrates
    a payment system, uses VCs to provide data to consumers with data, and uses FHE
    to protect the privacy of data and prevent unauthorized secondary use, aimed at
    achieving a balance between value acquisition and the process of data sharing.'
