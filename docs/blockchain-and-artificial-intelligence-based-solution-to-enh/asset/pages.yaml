- pgno: 1
  md: '# Blockchain and Artificial Intelligence-Based Solution to Enhance the Privacy
    in Digital Identity and IoT


    The chapters of this book explore the main domains that represent considerable
    risks for the respect of privacy, such as education, health, finance, or social
    media.


    Through its place in the massive data production industry, the Internet of Things
    participates in the development of artificial intelligence and is increasingly
    attracting the attention of web giants, governments, and especially all types
    of hackers. Thanks to this book, private and public organizations will have at
    their disposal a tool that highlights, on the one hand, the major challenges raised
    by privacy in the context of the Internet of Things and, on the other hand, recommendations
    for improving good practices.


    Digital identity is presented as a bulwark for the protection of privacy. It opens
    up new avenues for improving digital trust. Concretely, there are a set of challenges
    that are associated with the management of digital identity, mainly in relation
    to the compliance and governance of personnel data in order to eliminate privacy
    and security risks.'
