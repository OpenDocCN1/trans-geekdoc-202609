  md: 'When it comes to identification, it is vital to remember that it is not simply
    about the information on a card; each individual has a variety of identities.
    This might be a university degree, a medical record, or membership in a club.
    Users'' statements about their identities are almost impossible to prove on the
    web. Without reliable proof, it is difficult to treat statements about a user''s
    identity.


    In the physical world, this is simply solved by reaching into one''s wallet and
    showing an official document – for a government authority, such as a passport,
    driver''s license, or identity card. When boarding an airplane, renting a car,
    or borrowing a book from a library, identity is proven by a verification document
    issued by the representing authority. A corresponding digital identity hardly
    hardly exists. Our daily life gets tied to apps, services, and devices. The COVID
    pandemic in particular has significantly accelerated this digital transformation
    process. While such a transformation makes it possible to communicate with companies
    and other users to an extent that was previously unimaginable, it also makes it
    possible to communicate with other users on a more personal level. Centralized
    solutions from identity providers expose users to the risk that their data will
    not be carefully held by operators and could fall into the wrong hands in the
    event of data leaks.


    Not only individuals need a growing number of devices (Internet of Things (IoT))
    also require identification work and identity. The security-critical areas are
    affected, the more important verifiable ownership, authorizations, and location
    of such devices become.


    Self-sovereign identity (SSI) is the concept of self-managing one''s own identity
    characteristics. It not only involves names, address, date of birth, or nationality
    but also includes information about education, interests, families, sports activities,
    or club memberships. Much of this information is not verified by the state. For
    example, the university certificate is confirmed by the issuing university. With
    SSI, each person is in possession of their data. Confidence in this accuracy of
    the data is established through proofs provided by the respective issuers of data.
    For example, the university is the issuer of the certificate and the academic
    title associated with it. These proofs are also called credentials. When the data
    is presented, the verifying body, entitled verifier, can ensure the authenticity
    of the data via verifiable credentials. The trust triangle is established between
    issuer, holder, and verifier.


    This chapter discusses SSI and its connection to blockchain technology. Following
    a review of identity fundamentals, many cases explain how SSI may be applied.
    The technological foundations and standards are then examined in further depth.
    Furthermore, an important aspect, the governance, is highlighted. Finally, critical
    matters are addressed.


    # 2.2 IDENTITY FUNDAMENTALS


    Webster defines identity as “the distinguishing character or personality of an
    individual.” It comprises the totality of peculiarities that characterize an entity,
    object, or thing. This makes it distinguishable from others as an individual or
    unique instance. Identity attributes might be fingerprints,, iris structure, voice,
    DNA, smell,'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Blockchain for Digital Identity


    speech, location as well as possession of physical objects like identity card,
    mobile device, notes, etc. Nonphysical attributes which define our identity mainly
    depend on our brain like knowledge, abilities, memories, experiences, relationships,
    feelings, wishes, behavior, or secrets. For an identity check, we compare these
    attributes with previously stored data.


    Not only SSI place the user at the center of the identification process also requires
    that the user be in control of their own identity, including its data and how
    it is used. Based on these insights, Christopher Allen defines SSI in his article
    as follows:


    > Sovereign identity is the next step user-centric, and means it starts at the
    same place: the user be at the center of identity management. This requires not
    interoperability of a user''s identity across multiple sites, but also true control
    over digital identity, creating user autonomy. To achieve this, a self-sovereign
    identity must be transportable; it cannot be tied to one location or territory.


    Allen (2016)


    Allen presents the ten principles of SSI (Allen, 2016):


    +   (1) Existence. Users must have an independent existence.

    (2) Control. Users must control their identities.

    (3) Users must have access to their own data.

    (4) Transparency. Systems and algorithms must be transparent.

    (5) Persistence. Identities must be long-lived.

    (6) Portability. Information and services about identity must be transportable.

    (7) Interoperability. Identities should be as widely usable as possible.

    (8) Consent. Users must agree to the use of their identity.

    (9) Minimization. Disclosure of claims must be minimized.

    (10) Protection. The rights of users must be protected.


    SSI of people also in combination with blockchain technology is discussed in research
    papers in Mühle et al. (2018), van Bokkem et al. (2019), Stokkink and Powelse
    (2018), or Liu et al. (2017). In addition, IT enterprises step toward this direction
    like Microsoft Corporation (2018). In essence, SSI is about giving every user
    the power of decision and decision-making over their own digital identity and
    with this data is shared — other words, every person is their own sovereign over
    their digital identity. To enable this self-governance, it is necessary for the
    digital identity to be portable and decentralized and not dependent on any institution
    other than the user or owner of it. At the same time, it must be ensured that
    the person behind the digital identity is really the one they claim to be. The
    question of trust in such a claim is the central point which functioning digital
    identity and the underlying system must fulfill.


    This is where blockchain technology comes in. It plays a central role in the implementation
    of SSI. Blockchain acts as a trust anchor, that is, an immutable, verifiable register
    where issuers'' identity can be verified. It must be noted that SSI does not require
    a blockchain as trust anchor or with a traditional registry. Nevertheless, a blockchain
    is the ideal complement since its immutable and decentralized character support
    supports the philosophy behind SSI.'
