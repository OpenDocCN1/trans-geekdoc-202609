  md: 'Security, Privacy, and Blockchain in Financial Technology


    # 4.5.5 CONTACTLESS PAYMENT AND PRIVACY


    The paper “Privacy-Preserving Offline Mobile Payment Protocol based on NFC” [70]
    considers a new offline mobile payment protocol based on NFC technology. In the
    system, a group signature is used to ensure the noncapability of transactions.
    Since there is less computation at the payment phase, the efficiency of the group
    signature is improved. The system is appropriately designed to meet all security
    and privacy requirements, including anonymity, non-mobility, randomness, and prevention
    of repeated attacks. It focuses on protecting the ID of customers for mobile payment.
    First, the customer requests an anonymous ID from his or her bank. Then, the customer
    uses this ID to register with the Trusted Service Manager (TSM). The TSM only
    knows the customer is authorized by the bank, but does not know the customer’s
    real identity. When the customer generates a group signature for the transaction
    message, only the TSM knows the customer’s anonymous identity. Therefore, the
    system protects the customer’s privacy. The offline mobile payment protocol based
    on NFC by San and Sathitwiyawong [70] can be implemented where the digital divide
    still exists.


    The different cases that have been presented clearly demonstrate that security
    remains a major issue in mobile payment. When the vulnerability of an already
    implemented system is known, the reputation of the company using the technology
    suffers. Security is an essential element in building digital trust. It can be
    enhanced by both of asymmetric encryption, with an Internet connection, and by
    contactless payment, in the case of offline mobile payment. Table 4.3 shows various
    proposals for solving problems.


    # TABLE 4.3


    # Security Mechanisms in Mobile Payment


    | System Types and References | Mechanisms and Models for Protecting Privacy and
    Enhancing Digital Trust |

    | Secure mobile payment with third-party platforms [57]. | A so-calibrated digital
    trust environment (TrustZone) is dedicated to the system to be secured, separating
    it from the external environment where all the applications are present. |

    | Transit payment system with privacy protection [59]. | The identity of the client
    is kept by the system. However, a participant (financial institution or transport
    company) only has access to the information he or she provided. To achieve this,
    traceable and anonymous signatures are used. |

    | Payment system using QR with exchange encryption [60]. | The system proposed
    in the reference uses QR for communication between the seller’s and buyer’s systems.
    It is based on public key cryptography with mutual authentication of the interlocutors.
    |

    | Blockchain and privacy. | A review of the literature on EOS and non-EOS blockchains
    that focus on privacy solutions. |

    | Contactless payment with privacy protection [70]. | The system uses group signature:
    the authorization for a client comes from his or her identity and is transmitted
    to a digital trust service manager.'
