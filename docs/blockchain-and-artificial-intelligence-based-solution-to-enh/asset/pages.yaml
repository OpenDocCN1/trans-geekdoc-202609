    # 3.5.1.2 Interplanetary File System


    Interplanetary File System (IPFS) is its peer-to-peer (p2p) file-sharing system
    that aims to change how information is distributed globally. Content is opened
    through doors, anywhere on the planet that may transfer data, store it, or do
    it. IPFS realizes how to discover what you request through its substance address
    instead of area IPFS [34]. Specifically, IPFS gives a high throughput content
    that tends to impede the capacity model, with content managed by hyperlinks [53].
    Instead of referring to objects (articles, videos, pictures) by the browser with
    IPFS and wanting to access the server where they are stored, IPFS refers to the
    hash of the file. By surfing the browser with IPFS and wanting to access a page,
    IPFS checks all the network nodes even if one of them contains the hash. If a
    node returns, we get access to the page. Compared to HTTP, where the identifier
    is the location, finding the server containing the file and retrieving it is easy.
    In IPFS, we identify the file with content address and the network where the hash
    of the file is contained to get. This is valuable in disconnected cases or situations
    where we need to load across the organization, giving it an edge over HTTP. Figure
    3.6 provides more details explanations the workflow of IPFS.


    All the features provide to more secure usage of IoT devices, the IPFS helps store
    IoT data in an encrypted manner and enable large data storage into small-sized
    files, where only an authorized person possesses the encryption key can access
    the data. Plus, it is decentralized, hence creating P2P verification without third-party
    interference. Combined with blockchain, they create a decentralized ecosystem
    for securing data as mentioned by Ali et al. [4].


