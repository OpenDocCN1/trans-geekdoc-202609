    # 4.4.2 PRIVACY WITH BIOMETRIC AUTHENTICATION


    Biometric authentication is basically the measurement and comparison of intrinsic
    biometric characteristics (fingerprint, face, iris, etc.) to a person or a stored
    copy of these characteristics to establish the match [49]. Often, biometric characteristics,
    extracted from the user''s raw biological data, are stored with other personal
    information to constitute his or her identifier. Thus, he or she can use his her
    biometric characteristics to authenticate himself or herself when accessing a
    payment service, for example.


    The conventional operation of a biometric authentication system in mobile payment
    system shows two main steps:


    +   First, the user enrolls in the system by providing the requested biometric
    characteristics. These are usually stored on the payment processing server. However,
    some architectures (like Apple Pay) store these characteristics on the mobile
    client''s equipment.


    +   Upon authentication, the customer captures the biometric data with their mobile
    device and sends it to the server processing the mobile payment. The latter will
    apply algorithms to verify the match between the newly acquired biometric data
    and the stored one. This task is performed on the customer''s mobile device if
    the biometric features are on the customer''s side.


