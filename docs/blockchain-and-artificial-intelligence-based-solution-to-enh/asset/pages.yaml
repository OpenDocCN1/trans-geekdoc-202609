    # 5.1.6 ECONOMIC VALUE OF THE EDUCATION TECHNOLOGY MARKET


    Historically, online proctoring software isn''t a novelty. In Canada, this type
    of software has been used in the educational field for over 20 years. For example,
    Queens University has been using this software for many years. Before the COVID-19
    pandemic, Ed-Tech was a booming sector, and by the end of 2019, the market was
    valued at estimated 19 billion USD. By 2020, the larger market size of the online
    learning software was valued at estimated 100 billion USD. Furthermore, it is
    projected from 2020 to 2027, the market size pertaining solely to online proctoring
    software will grow 16.4% annually and in 2027 it should represent an estimated
    value of 10 billion USD. Certain authors have noted a 720% growth in the usage
    of online proctoring software since the beginning of the 2020 pandemic. It is
    clear that online proctoring solutions are developing into a profitable market
    and some authors argue that the uptake in the implementation of these solutions
    could potentially be used as a proof of concept to justify the deployment of online
    proctoring software.


    # 5.1.7 AI AND PRIVACY


