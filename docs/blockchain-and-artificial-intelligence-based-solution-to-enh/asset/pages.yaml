    # 6.1.3 CHAPTER OUTLINE AND CONTRIBUTIONS


    This chapter seeks to contribute to research on the issue of data double spending.
    The chapter first describes two marketplaces designed and implemented for individuals
    to share their data for purposes of AI-driven health research. Case study describes
    a solution design and implementation that uses the Hyperledger Aries Protocol,
    the ‘Self-Sovereign’ data marketplace. The chapter then presents a second case
    study, which is an Ethereum-based solution ‘Ocean Protocol’ data marketplace.
    Based on a comparison of implementations of both marketplaces, this chapter evaluates
    the strengths and weaknesses of each solution vis-a-vis the principles of fairness
    in the processing of personally data. The chapter concludes with a consideration
    of the extent to which each case operates to achieve fair data processing and
    protect individuals from data double spending, with the aim of contributing to
    a clearer articulation of the issue of data double spending, an assessment of
    how well each solution addresses the issue, and possible directions for future
    research aimed at countering data double spending.


