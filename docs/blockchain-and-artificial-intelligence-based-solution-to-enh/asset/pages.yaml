    # 3.5.1 TECHNOLOGIES TO ENHANCE SECURITY ISSUES


    Security should be the number concern of IoT. Many experts are working on creating
    a balance between performance and security by using new technologies. We will
    discuss how other technologies could enhance the security of IoT and preserve
    our privacy.


    # 3.5.1 Blockchain


    Blockchain is a “peer-to-peer” decentralized ledger technology. It provides a
    method to publish and distribute information about transactions on a peer-to-peer
    system of computers through the crypto protocol. The database is scattered on
    the rule that each duplicate of new information is not just away on a solitary
    server but shipped off to all clients in the chain or framework. To change any
    bit of the data, programmers need to change 51% of the duplicates of the passage
    on the framework, and every one of these duplicates need to contain the entire
    past exchanges of this information. This convention has effectively wiped-out
    outsiders while guaranteeing security and adaptability with high intuitiveness
    [51].


    Mainly it exists two types of blockchain, public and private. However, there are
    other variations, too; they consist of consortium and hybrid blockchain. All consist
    of nodes functioning on a peer-to-peer (P2P) network system. Where'
