- pgno: 153
  md: '# Blockchain, AI, and Data Protection in Healthcare


    Data tokens also involve the use of Ethereum public addresses, through which it
    could be possible to link to a natural or legal identity. The OP marketplace can
    also request the data provider to provide more information about their identity
    through, for example, tools 3box, which would allow for identification of a data
    provider. In addition, since the data to be shared or accessed are not encrypted,
    but analyzed in raw form, it is possible that aggregation of data could lead to
    a reidentification through statistical correlation.


    In the SSI solution, the possibility of identity correlation is restricted by
    the use of dynamic decentralized identifiers that are not persistent, and thus
    difficult to correlate with a natural or legal identity. Furthermore, data elements
    in the dataset to be shared that identifying (e.g., genomic data) are homomorphically
    encrypted and thus not provided in raw form. This also makes it difficult to aggregate
    data in ways that could lead to a further identification of the data provider.


    # 6.3.2 PRINCIPLE 2: THE INDIVIDUAL CONSENTS TO THE SHARING AND SPECIFIC USE OF
    THEIR DATA


    In each of our study solutions, individuals consent to the sharing of their data
    by making it possible to access consumers via the data marketplace. The SSI solution,
    uses the distributor app to define the specific terms (e.g., types of organizations,
    uses, and duration for which they are willing to make their data available for
    use). The distributor app manages these data usage changes by requesting proofs
    from consumers based on VCs; for example, it might request a proof that the consumer
    is a hospital if the individual data provider has specified a desire only to share
    their data with this type of institution. In the OP solution, individual data
    providers can only specify service access variants, such as the duration of access,
    e.g. short, medium, or indefinite, which are embedded into the data token as metadata.
    There is no manual license configuration option in OP at the present time. Access
    to the data provides an automatic license. The Brizo (Provider) subsequently enforces
    time-limited services in providing access to the data. Neither consent allows
    individual data providers to specify that the data cannot be used for any subsequent
    undefined secondary purposes, nor these solutions provide technical means to prevent
    unauthorized secondary usage, by means of the mechanisms already identified above.


    # 6.3.3 PRINCIPLE 3: THE INDIVIDUAL IS ABLE TO WITHDRAW THEIR CONSENT TO ACCESS
    AND USE OF THEIR DATA


    Neither solution empowers an individual data provider to withdraw their consent
    to access and use of their data once a consumer has purchased a license to it.
    Moreover, once the consumer performs a computation using the data, such as training
    an algorithm or running an AI-based analysis process, it is impossible to remove
    the data from the ''knowledge'' of the AI algorithm. However, at any time up to
    the point of providing the consumer with data access after purchase of, the individual
    data provider may choose to withdraw their data from the marketplace. Further,
    the whole point of preventing a data double spend is to prevent consumers of data'
