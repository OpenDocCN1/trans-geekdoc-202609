  md: '# Postface


    # 177


    was acquired for USD 69,346,250 at Christie''s. The media coverage of this exceptional
    sale, and in the wake of it, the first Tweet by Jack Dorsey, the ex-chairman of
    Twitter, has aroused the interest of many artists over the world, considering
    their vulnerable context during the COVID-19 pandemic.


    Several pricey risks are associated with the use of NFT such as:


    +   - Anonymous social media harms while recovering online identifiers and avatars.

    - The conformity of Blockchain with privacy laws.

    - The management of location data.


    These risks directly conflict with the spirit of many national and regional laws,
    by inference, as the General Data Protection Regulation (GDPR) in Europe, the
    California Consumer Protection Act (CCPA) in California and Bill 25 in Quebec.
    NFTs could face significant penalties if they are found to be noncompliant. Significant
    technical, legal, and ethical challenges must be addressed before continuing to
    deploy these technologies through, for example, the meta-verse.


    # 3. INDUSTRY 4.0/5.0 AND RISK TO SENSITIVE DATA


    The value of data is crucial for the manufacturing industry, which must collect,
    store and process it. Sensors and IoTs facilitate the collection of massive data
    that allows the creation of predictive models and the operationalization of automation.
    Data-backed manufacturing in Industry 4.0 and 5.0 can improve all or part of its
    supply chain and bottom line. The need to collect more and more data increases
    the risk of cyberattacks. Several governments and hacker groups are working to
    gain access to the strategic data of large companies, universities, and governments
    working in areas such as biotechnology, aeronautics, university research. Work
    is to be considered from the point of view of cyberattacks to IoT, issues related
    to the presence of sensors in public places and consent.


    Other fields that use massive data deserve the attention of researchers from the
    point of view of privacy, as autonomous cars or electric cars. Similarly, open
    databases that may be available to industry and research will need to be audited
    to avoid potential misuse through re-identification. Finally, further research
    on DNA data storage could be of benefit to the environment.


