    the implementation of laws in student and test companies’ relationships. First,
    the terms and conditions or the privacy policies state that personal information
    can be used for machine learning activities to improve the performance of their
    systems. Such a finally surpasses what is foreseen by universities when considering
    online exam proctoring activities. Elsewhere, the collect of personal'
