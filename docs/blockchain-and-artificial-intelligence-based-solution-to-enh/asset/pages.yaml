- pgno: 45
  md: '# Blockchain for Digital Identity Foundation


    Therefore, the Trust over IP Foundation created a four-layer model with pillars:
    technology and governance. The governance pillar is formed by participants of
    the trust ecosystem, multiple governance authorities. “A governance authority
    can represent any set of issuers who want to standardize the business, legal,
    and technical policies for issuing, holding, and verifying a set of credentials”
    (TrustIP, 2020).


    Governance can be supported by technology, but nevertheless it is grounded on
    agreements, policies, rules, and trustworthy participants. Governance on the first
    layer – the utility frameworks – is ensured by node operators or stewards maintaining
    a blockchain or DLT infrastructure to allow credential issuers to store proofs
    on this infrastructure. On layer 2 – the assets frameworks – the role of governance
    authorities is to verify and certify software, hardware, and cloud providers.
    While wallets have a key role to play, their integrity and conformity, security,
    and data protection standards are crucial. Layer 3 – the credential frameworks
    – ensures that trusted authorities their influence behind credentials and issuers
    meet the standards and to protect the holders. During this quality assurance process,
    sanctions may also be necessary. Finally, on the top layer (4) – the ecosystem
    frameworks – one governance authority can oversee the whole ecosystem to ensure
    interoperability and audit compliance. Each ecosystem stands for a set of identities
    and certificates. Examples for such ecosystems are universities with their certificates
    for degrees, governments with various certificates over citizens’ identities,
    or road traffic authorities with certificates for driver licenses.


    Trust is the foundation of the entire ecosystem. On the other side, there is technological
    trust, in which one trusts the cryptographic procedures utilized. On the other
    hand, it is human trust in organizations and the governing process as a whole.
    This is an important component of the trust ecosystem. One must believe that credential
    issuers are who they say they are, and that the system will remain stable and
    resilient no matter what happens. Through decentralization, blockchain may play
    a key role in this ecosystem by ensuring immutability and stability.


    # 2.6 CRITICAL ASPECTS OF SELF-SOVEREIGN IDENTITY


    SSI is a relatively new concept. This is the most serious critique. Many experts
    remain skeptical since there is no long-term experience of working systems built
    with this technology. Another important point that is frequently cited and is
    true that we have control over her or his data. On the other hand, this is one
    of the most significant benefits, as it leads to censorship-free usage. However,
    this is a significant duty, and many people question that the majority of users
    are capable. It is essential that deputy regulations and emergency remedies be
    implemented, but they can also be utilized for paternalism. One thing is certain:
    we will not know until we implement the technology in a real-world use case at
    a wider scale. As a result, many experts support the deployment of real use cases
    as well as further research. Furthermore, governance, inclusivity, and even ethical
    issues can only be investigated as part of a larger ecosystem.'
