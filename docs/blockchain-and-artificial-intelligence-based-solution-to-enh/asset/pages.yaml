    request a credit card, etc. It is considered as an interactive layer with the
    citizen it is the closest step to the citizen, that is, the user can easily manipulate
    his request via the web.


    Thus, the application layer specifies the communications protocols and interface
    methods used in digital services and ensures a stable communication across the
    architecture.


    Concretely, the application layer handles the functions:


    +   * It ensures that the device used by a citizen to receive digital services
    are identified and ready to start the authentication process.

    * It enables authentication between the device and the service provider.

    * It establishes rules and practices in case connectivity problems such as error
    recovery procedures, data integrity verification, etc.


    # 1.6.1.2 Blockchain Layer


    The blockchain layer is the module responsible for the citizen''s information
    security and for the verification of his identity, that is, the user who interacted
    with the application layer to request public services. This layer is the second
    module in our architecture placed behind the application layer which is hidden
    from the citizen. Once citizen interacts with the application layer to ask for
    a service, his request will be converted into a block that will be incarnated
    in the blockchain module and then shared between all nodes. This ensures the verification
    and then the validation of the citizen''s digital identity once it is authenticated
    to public government service.


    Several researchers have proposed approaches that blockchain technology to address
    security and privacy issues in digital identities. In fact, blockchain is an immutable
    ledger, to record transactions that are occurring within a network. All participants
    maintain a copy of the ledger and reach a consensus on the states of transactions
    submitted to the blockchain network [39]. The benefits of blockchain-based techniques
    in digital identities management systems are various, and we can cite the benefit
    of removing the single point of failures and preventing the third parties from
    controlling data. Thus, participants can verify the data integrity and identity
    sender.


    We propose to use public blockchain as one of the characteristics of a public
    blockchain being an open-access platform [40]. In other words, anyone can read
    and record transactions. Such aspects prevent blockchain from being hacked because
    expensive to add a new block and tamper the blockchain content [41].


    # 1.6.1.3 Database Layer


    The database layer is the third module in our proposed architecture. It is the
    layer responsible for storing citizens'' personal data to ensure its privacy.
    It contains different databases to provide various digital services i.e., financial
    database, health database, etc. Each one contains specific information related
    to the'
