    sources that provide the servers.


    Although bitcoin offers a solution for transparency without violating the security
    of user-generated data [65], questions of privacy remain for sensitive data like
    financial data.


    # 4.5.4 Blockchain and Privacy


    The question of privacy has been raised in the context of the deployment of public
    blockchains such as bitcoin. Indeed, bitcoin offers a very large accessibility
    to the history of peer-to-peer transactions. Access to history is also meant to
    be the proof of transparent governance that information systems so badly needed.
    However, this transparency could also prove problematic for the preservation of
    privacy. Especially since privacy is a requirement of some national laws or sections.
    Section 103 of Quebec''s Law 25 is a good example of this privacy requirement.
    This is the problem of this. The case of which "provides anonymous connections
    that are strongly resistant to eavesdropping and traffic analysis" [66]. Private
    blockchains also offer privacy protection. This is why the EOSIOS proposals seems
    to us be of great relevance. In May 2021, with the aim of addressing a need for
    privacy in the blockchain ecosystem was created “EOSIO privacy working group”
    [67]. Contributors include Blockstalk, Block.one, dfuse, EOS Rica, Garcia Currency,
    EOS Amsterdam, Rewired.One, and Gimly. By the different deployments, five main
    themes [67] are identified:


    +   - Use of cryptography is prevalent among blockchain deployments

    - On-chain contracts facilitate coordination

    - There is a wide range of code-sharing practices for transactions

    - Innovations around data privacy would help accelerate data migration

    - Shared ledgers update multiple blockchain-based approaches.


    It is important to specify that another interest of a private blockchain is the
    ability to access inaccessible, according to Thibaut Labbé, to obtain a “result
    similar to a deletion” [68]. Furthermore, it would be wise to consider the option
    of Sovereign Identity [69], which gives the citizen the right to share or not
    share her data. In other words, a user expert or wise person can choose to limit
    access to his or her data to permanently terminate access to his or data. The
    definitive extent to one’s data can be considered as a form of destruction of
    one’s data.


    If the use of blockchain requires, most of the time, an Internet connection, the
    "contactless payment" (NFC) can be made off, while being secured. This is what
    the fourth prototype developed by A. M. San and C. Sathitiriyawong [70].'
