    # 1.2.6 LACK OF REUSABILITY OF DIGITAL IDENTITIES


    Reuse of digital identities has great potential to reduce the data replication
    and environmental footprint of the data. However, the digital identities are specified
    and used rarely consider their reuse in various applications and information systems.
    This fact will create costs for organizations, lack of interoperability, and usability
    challenges for users. Thus, it is necessary to identify challenges and success
    factors for reuse of digital identities in pilot projects, to identify the technical
    and regulation challenges to optimize the reusability of digital identities, and
    to select the best practices that foster the reuse of digital identities.


    Given the challenges and risks in the digital identity systems, several researches
    proposed the use of blockchain technology as their solution in different capacities.
    Since blockchain is a decentralized system, it does not need a third-party trusted
    authority. Rather, it adopts the decentralized consensus mechanism in order to
    guarantee the reliability and consistency of data and transactions.


    # 1.3 BACKGROUND


    Blockchain is a digital ledger of economic transactions continually updated by
    several users with a focus on maintaining the integrity of transaction data. It
    is a chain of continuous records in blocks and it originated with the introduction
    of the bitcoin cryptocurrency [15]. Blockchain has has transformed technology
    and the way of doing business transactions with security and integrity. Business
    organizations have been gaining a competitive advantage over their competitors
    by leveraging this technology. A typical blockchain database consists of two types
    of records, that is, transactions and blocks where blocks are responsible for
    holding batches of transactions. The blockchain has four elements that are replicated:
    the ledger, cryptography, consensus, and business logic [16].


    Blockchain was initially introduced with the emergence of cryptocurrency for providing
    a secure and reliable source of digital transactions. In bitcoin, blockchain provides
    a decentralized technique for transferring money to the users. It provides an
    environment for digital contracts and peer-to-peer data sharing in a cloud service
    [17]. However, bitcoin cryptocurrency is not the only technology that has using
    blockchain, it has now widely used in various domains such as finance, business,
    health, smart cities, and maintaining digital identity in government organizations
    [18, 19].


    Blockchain is a decentralized system, and it does not need a third-party trusted
    authority. Rather, it adopts the decentralized consensus mechanism in order to
    guarantee the reliability and consistency of data and transactions, the current
    blockchain mechanism has four major components: Pow (proof of work), Pos (proof
    of stake), PBFT (practical byzantine fault tolerance), and Dpos (delegated proof
    of stake). For'
