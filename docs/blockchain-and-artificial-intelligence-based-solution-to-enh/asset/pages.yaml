    # 1.6 PROPOSED SOLUTION


    # 1.6.1 ARCHITECTURE OF THE PROPOSED SOLUTION


    We propose in Figure 1.1 the architecture of a secure digital identity application.
    We define three main necessary layers. Our goal is (1) to ensure citizen data
    privacy and get it protected with a secure blockchain network, (2) to give to
    the citizen control of his identity and data, and (3) to allow a quick recovery
    of his identity.


    As concrete example, we present in Figure 1.2 a use case of the renewal of the
    health card 2.


    Figure 1.2 shows three actors, who is the citizen, the trusted authorities, and
    two main government services, that are, Health insurance service and financial
    service. The financial service is used by the blockchain module to verify and
    validate the digital identity of the citizen who requests the renewal of his health
    card without accessing to his personal financial information. This verification
    requests the appropriation of the citizen himself who has to authorize the verification
    of his identity through another service.


    # 1.6.1 Application Layer


    The application layer is the first module in this architecture, it contains the
    different API of the government public services where any citizen could access
    online and request specific services i.e., renewal of health card, renewal of
    passport,


    | Application Layer | Blockchain Layer | Database Layer |

    |---|---|---||

    | Trusted authority | -Peer to peer Ethereum | Citizen personal data | Financial
    data |

    | Web API | Verification | | |

    | Bank API | Transaction converted in a box in blockchain module | Block 1 | Encrypt
    | |

    | Health API | | Block 2 | Decrypt | Health data |

    | Tax API | | Block n | | |


