- pgno: 13
  md: '# Introduction


    Schallum Pierre

    Institut intelligence et données (IID),

    Université Laval, Québec, Canada


    Fehmi Jaafar

    Department of Mathematics and Computer Science,

    Québec University at Chicoutimi, Québec, Canada


    # CONTENTS


    +   Our Sensitive Data ... 2

    Our Private Life.... 3

    Sensitive Data Raises Privacy Issues ... 4


    Our contemporary societies are producing more and more of data. Between January
    1, 2022, and August 20, 2022 alone, 580,294,915,326 Gigabytes (GB) of data were
    published, according today to Planetoscope.¹1 As reported by the source, we produce,
    around the world, an average of 29,000 (GB) of data, every day. That''s 2.5 exabytes
    per day or 912.5 exabytes per year. Among these data, the number of IoT devices
    is estimated to be over 13.1 billion.² By 2030, this figure will rise to 29.4
    billion. Exploiting the data generated in the context of sensors, IoT and industrial
    environments remains a great challenge. It is estimated that only 20% of data
    has already been used.³ This amount of data needs to be valorized at the service
    of research, citizens, and the advancement of understanding of climate issues.
    This is why data plays a key role in digital transformation. It must be collected,
    stored, and processed. Because of their ability to deal with tasked and personized
    information, IoT has become very present in our environment. In our daily lives
    this explains scope: the moment we wake up until late at night. For example, during
    the pandemic, different segments of the world''s population, especially the elderly,
    were confronted with sleep problems. Faced with this need, IoT technologies are
    used in monitoring the quality of sleep,⁴ without the need for a person to go
    to the hospital to expose himself risks of contagion. Various categories of personnel
    data are generated by IoT: health data, geolocation data, financial data, sociodemographic
    data, biometric data, etc. Several standards govern IoT that are the source of
    unstructured data such as movement, gesture recognition, and biometric measurement,
    proximity; infrared luminosity; sound; and smell. These standards include IEEE
    802.11.⁵ Two technologies are helping to leverage this data and accelerate digital
    transformation: artificial intelligence (AI) and blockchain.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Blockchain and Artificial Intelligence-Based Solution


    In AI, particularly supervised learning, historical data obtained from IoT can
    be used to train models that will use to automate tasks in a human environment.
    A house with video-based fire detection systems will be mapped. All the data generated
    will allow the AI to act like humans in that space. The people living there will
    be able to be warned of heat, smoke, and fire hazards. There are several security
    risks that make IoT vulnerable. Attacks can exploit known vulnerabilities and
    backdoors in IoT devices. Backdoors like a pacemaker can put a patient''s life
    at risk. Confidentiality, integrity, and authentication. As an example, the collection
    of cardiac event data, by AI, can help the patient make better decisions, but
    if that data as well as access to the device falls into malicious hands, it can
    cause irreparable harm.


    The collection of data, which is essential for AI, can be both useful and dangerous.
    The problem in Afghanistan with the Taliban''s takeover of biometric databases
    is worth of our consideration. Biometric information of thousands of Afghans collected
    by the US military was abandoned. Intercept recalls, this database includes data
    such as iris scans and fingerprints. Since this data is not protected, it is used
    against opponents of the regime.


    Should we risk the risk of giving a centralizing organization such as a private
    company or a government control over our personal data? What are the issues related
    to the collection, storage, and use of personal data? What role can blockchain
    play in a governance that focuses on privacy protection? First, why should we
    pay so much attention to the governance of the data we produce?


    # OUR SENSITIVE DATA


    According to the General Data Protection Regulation (GDPR), when the processing
    of a personal data can represent a significant risk to fundamental rights and
    freedoms, it is sensitive data. Consequently, all security measures must be considered.
    Without limitation, the sensitive nature may concern data related to:


    +   * ethnicity

    * fingerprints

    * biometrics

    * financial

    * education

    * sexual preference

    * social media

    * expression of opinion (political, religious, and union)

    * vulnerable persons

    * minors


    The collection of data by IoT can concern not only sensitive personal data but
    another category of sensitive data which are industrial data or business data.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Introduction


    These categories of data (such as industrial data and sensitive personal data)
    must be protected, at the risk of revealing confidential information about an
    organization or a person. In the case of an organization, it is the sharing of
    strategic data. In 2021, Canada took steps to protect the research14 from possible
    threats or espionage. In the case of an individual, it is the sharing of privacy.


    # OUR PRIVATE LIFE


    As Philippe Aries and Georges Duby have shown in Histoire de la vie privée: l''Empire
    roi15 privacy is a concept as old as the world and manifests itself in different
    forms in different cultures. However, the meaning we refer to originates from
    an article that was published in 1890 by Samuel Warren and Louis Brandeis in the
    Harvard Law Review. It "the right to be alone."16 In other words, the right not
    to be disturbed by another, without permission. It is also the right to be able
    to exercise control over the use, and even storage of the data one produces. The
    web giants have wanted to fight this right to privacy. Eric Schmidt, CEO-of Google,
    said this: "If you have something that you don''t want anyone to know, maybe you
    shouldn''t be it in the first place."17 According to Schmidt, you have nothing
    to hide. No interest in having right to privacy. You can share, even health information.
    Social media has picked up on this motto. Citizens and especially Politicians
    who share Eric Schmidt''s vision are now publishing a lot of information about
    themselves. There is nothing to hide.


    Many experts contradict the view of the former Google CEO. For example, 45 minutes
    after posting a photo of his plane ticket on Instagram, the passport, and phone
    number of Tony Abbott, former prime minister of Australia, was found by a hacker.18
    The information we share online is valuable. It can generate knowledge about us
    that can help companies offer personalized recommendations. A copy of your data
    (that you have nothing to hide) on Facebook contains 48 categories of information
    we share: posts, polls, events, payments, comments and reactions, stories, reels,
    groups, etc.


    The company that holds this about us holds power over Carissa Félix for taking
    back control of our data because, according to her, we are a source of power.19
    But how can we exercise this control over our?


    There are several ways! When we share or no data online. This goal is rather difficult
    to achieve collect the basic of the services we use every day requiring the sharing
    of personal data.


    Second, it is desirable to collect, store, and exploit the data we produce in
    a secure way. Moreover, any access to the data collected and stored must go through
    the person who produces it himself. Digital identity allows one to better operationalize
    the intent we need to control of one''s data.


    Third, when organizations collect, store or use the data we generate inform us
    or ask for our consent to use our data. When it comes to consent, it can be revocable
    at any time and easily. Blockchain technology makes this revocation30 and the
    traceability management of consent possible.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Blockchain and Artificial Intelligence-Based Solution


    Fourth, it is to limit the share of our data to a trusted third party that can
    manage the rights to manage our data for our benefit. Public organizations, associations,
    or legal vehicles as trusts may fit this scenario.


    # SENSITIVE DATA RAISES PRIVACY ISSUES


    Sensitive personal data that is generated directly by individuals in areas, such
    as health, finance, and social media, must be preserved. It may share information
    that an individual may not want to know about him or her such as health information,
    financial profile, political ideology, etc. Similarly, the presence of IoT in
    our daily lives and their impact on health, finance and critical infrastructure
    requires the preservation of our. The use of data generated by individuals and
    the IoT raises many issues from a privacy perspective. It is these issues we want
    to raise by publishing this book which is divided into three sections.


    The first section will address digital identity as a technological and legal vehicle
    for data protection. In the chapter “Blockchain for Digital Identity,” the author
    proposes an overview of self-sovereign identity. He demonstrates its relevance
    to the transfer of ownership to the user as well as use cases.


    The second section considers privacy issues in the context of IoT and mobile payment
    systems. The chapter “Security and Corporate Violation to Privacy in The Internet
    Of Things Age” focuses on the threats coming from one, and on the other, the online
    networks provided by these sensors and, on the other hand, the tracking and profiling
    risks of the mobile computing environment. It analyzes the impact of IoT on individuals
    and existing data privacy regulations.


    The authors of the chapter “Security, Privacy and Blockchain in Financial Technology
    present the main existing implementations and solutions of mobile payment systems.
    They describe the ethical issues of personal data security and the role of blockchain
    in protecting privacy.


    Finally, the last section discusses the challenges of dealing with sensitive data.
    The chapter “Where does the novel legal framework for AI in Canada stand against
    the emerging trend of online testing?” focuses on the legal issues of socioeconomic
    discrimination and privacy of AI in education. The authors assess the risks generated
    by AI tools for exam monitoring and the Canadian legal framework for data protection
    legislation (Bill C-27) in comparison with the European Commission’s proposed
    AI act.


    The next chapter focuses on double spending, or the unauthorized use of individuals’,
    “Blockchain, AI and Data Protection in Healthcare: A Comparative Analysis of Two
    Blockchain Data Marketplaces in relation to Fair Data Processing and the ‘Double
    Spending Problem.” The authors propose an articulation of fair data processing
    based on the Hyperledger Indy/Aries protocol and Ethereum.


    The last chapter “Cyber influence stakes” focuses on the main techniques used
    by social media to influence the population. The summarizes studies related to
    the detection of trolls, bots and deepfakes to eradicate misinformation.'
  merge: -1
