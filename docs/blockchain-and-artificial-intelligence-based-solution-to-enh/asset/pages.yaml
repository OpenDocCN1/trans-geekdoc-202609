- pgno: 155
  md: '# Blockchain, AI, and Data Protection in Healthcare


    Neither solution really guarantees protection against the unauthorized secondary
    use. This suggests that much more work could be done to extend the mechanisms
    to prevent data double spending – whether algorithmic or afforded by human governance
    – in each solution. For example, one novel research direction could be to explore
    ''tokenomics,'' or cryptocurrency-based incentive mechanisms, could be used in
    both solutions toincentivize data double spending by sharing data rewards (or
    rewarding consumers who use data appropriately).


    Overall, we found that the SSI solution provided slightly greater protection against
    data double spending in that it does not use a persistent identifier for data
    providers, nor require them to provide identifying information or allow for data
    access rights (i.e., the access tokens) to be passed to a third party by the consumer,
    as in the case of the OP. The SSI solution also had an advantage in a license
    agreement, which as that the consumer can be of a certain type (e.g., for-profit
    or not-for-profit organization, from a certain jurisdiction, having a certain
    type of certification, etc.). And above this, the SSI solution also requires that
    computations compute-to FHE data, while the OP solution allows computation over
    raw data. The requirement to compute over FHE data incentivizes the copying and
    retention of data for unspecified future use. Using homomorphic encryption to
    safeguard data privacy, however requires a significant amount of computational
    resources and is less efficient when compared to computation on unencrypted data.
    That is, in a commercial scenario, consumers may be forced to pay high computational
    resources in exchange for more stringent data protection. Thus, future research
    could be done to widen the scope of computations that can be performed over fully
    homomorphically encrypted data and increase the efficiency of processing in order
    to make the provision of FHE data more useful. Although processing of FHE data
    is costly at present, the SSI solution does not rely on smart contracts, which
    also require the use of gas to operate. In our view, would likely make the SSI
    solution less expensive to operate generally. Nevertheless, the OP solution offered
    merchants for price discovery in its marketplace.


    We also found that both solutions still rely upon centralized trusts, working
    toward a greater level of decentralization of the architectures and trust models
    for each solution would be beneficial to guard against both single points of failure
    and malicious manipulation that could lead to data double spending.


    Each solution has its strengths and weaknesses in relation to the principles of
    fairness in data processing, specifically with respecting to preventing unauthorized
    secondary use, or data double spending, the focus of our research. We acknowledge
    that the principles we explored did not address issues of data privacy and security,
    nor do they offer an exhaustive set of design principles for fair data processing
    (indeed, [17] points to how complex is the issue of interpreting what fairness
    means in the context of data protection legislation); nevertheless, our research
    helps refine understanding of the issue of data double spending and its relationship
    to the basics of fairness in data processing, which is an issue that has become
    of increasing concern to consumers and data protections alike. Further, this chapter
    provides a comparative analysis of the capabilities of two very different based
    marketplaces in relation to the principles of fairness and prevention of'
