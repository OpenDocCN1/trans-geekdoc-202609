    # 5.1.5 EXAM SURVEILLANCE TOOLS AND PANDEMIC


    Among the many technological usages in the educational field, our focus will solely
    pertain to online proctoring software used by Canadian universities. The COVID-19
    pandemic forced many to adapt, such as working remotely, and the academic world
    was not spared. Canadian universities had to pivot quickly and offer remote learning,
    which took the shape of online classes and exams, especially during the strict
    containment periods.15 According to certain studies, students are more tempted
    to cheat during online exam than to an in-person environment;16 Granted, occurrences
    of cheating are not easier or more tempting than before, all the students are
    dealing with a heightened level of stress.17 Therefore, it is said cheating occurrences
    become more widespread during online exams when comparing them to their in-person
    counterparts.18 Furthermore, this is not surprising that universities began to
    adapt online proctoring software, following claims that the use of this software
    could attenuate instances during online exams.20 However, student bodies from
    all over expressed their worries regarding this type of surveillance, for instance
    in Australia,21 in the United States,22 and in Canada, as seen at the University
    of Ottawa.23 and the University of Manitoba,24 Further proof of this is in the
    United States a website has been created to track which American universities
    are using online proctoring software.25'
