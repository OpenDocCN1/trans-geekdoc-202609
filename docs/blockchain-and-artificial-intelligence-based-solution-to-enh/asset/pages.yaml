  md: '# Blockchain and Artificial Intelligence-Based Solution


    # E) Data Sharing and Storage Algorithm


    # Algorithm 1: Data Sharing and Storage


    +   1. Individual agent exchanges DIDs with the Data Issuer agent to establish
    a DIDComm connection channel.


    +   2. Data Issuer uses the public key of the CKKS scheme ($pk_{fe}$) to perform
    fully homomorphic encryption on the data of the individual. Then, Data Issuer
    uses the public key of the AES encryption scheme ($pk_{aes}$) to encrypt the data.


    +   3. Data Issuer issues the data credential ($cred_{data}$) to the Individual
    agent, with the ($pk_{aes}$) as an attribute of the credential.


    +   4. Individual agent accepts and stores the health credential in his/her mobile
    wallet.


    +   5. Individual agent exchanges DIDs with the Data Manager agent to establish
    a DIDComm connection channel through the generated invitation QR code on the Data
    Manager app.


    +   6. Individual agent sends the schema for proof request to Data Manager agent
    through a message.


    +   7. Data Manager agent generates proof request ($req_{data}$) according to
    the schema sent by the Individual agent, and sends $req_{data}$.


    +   8. Individual agent presents the health data proof $proof_{data}$ based on
    $cred_{data}$.


    +   9. Data Manager agent verifies the $proof_{data}$ by checking the signature
    and DID of the Data Issuer.


    > 10 if $proof_{data}$ has been verified


    +   11. Data Manager agent issues the initial storage credential ($cred_{storage}$)
    to the Client agent, with pre-signed URL and $pk_{aes}$ as attributes of $cred_{storage}$.


    +   12 end'
