  md: '# 5.3.2 PROVINCIAL LAWS REGARDING PERSONAL INFORMATION IN THE PUBLIC SECTOR


    The use of proctoring software implies that some personal information is being
    collected in an academic setting. Those data are collected and used by academic
    institutions the collection is justified by their provincial educational mission,
    and they are located in different provinces; therefore, provincial laws are applicable.
    Academic institutions are public entities and the provincial legal framework pertaining
    to personal information is applicable. The control factor of the Privacy Act²²⁵
    clarifies this view of jurisdiction and the consequence of the provincial framework.
    It applies to personal information and documents collected by public institutions
    such as universities. Therefore, the provincial public sector framework applies
    to student and university relationships.


    However, when speaking of the control factor, control does not need to be absolute,
    direct, or permanent. In this regard, in Canada Post Corp. v. Canada (Minister
    of Public Works),²⁵ the federal control of appeal deemed that the term “control”
    must be broad and literal interpretation. For instance, if personal information
    is held by a representative or a service provider of a public institution, then
    the legal framework regarding the public sector would apply. Given that universities
    often rely on third party service providers, this precision is paramount when
    considering the use of online proctoring software. However, the above-mentioned
    case is not applicable per se. Universities are not only deferring the collection
    and management of personal information to third parties, but they also put students
    and third party companies in close operation. Furthermore, third parties are also
    engaged in data collection practices pertaining to personal data that the universities
    do not have access to and cannot control. Granted, in this particular situation,
    on one hand the third party parties are acting for public institutions, but on
    the other hand, they are seeking to collect students’ personal information for
    means that they are entirely commercial, often using technological tools and,
    thus, the universities cannot prevent them from doing so. If universities wish
    to impose terms pertaining to the protection of personal information inspired
    by the provincial sector framework and their privacy policies, they are then confronted
    with the reality of technological tools that they do not fully understand master.
    Not is only this observation pertinent to the collection of data, but it is also
    pertinent when using the storing of students’ personal information.


