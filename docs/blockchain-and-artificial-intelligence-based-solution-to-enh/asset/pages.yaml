    advances. For example, on a global scale, the Payment Card Industry (PCI) Standards
    Council sets rules for the protection of account data [9]. Countries such as Canada
    have regulations to protect personal data including financial: The Personal Information
    Protection and Electronic Documents Act (PIPEDA) [10] and the Canadian Payments
    Act (R.S.C. (1985), c. C-21) [11]. Recently, Québec adopted Bill 64 (current law
    25) to protect personal information [12] and Bill 6, which created the new Ministry
    of Cybersecurity and Digital Affairs [13]. In the European context, since 2018,
    the European Union must comply with the General Data Protection Regulation (GDPR)
    [14]. In the specific context of France, it is framed by the French National Agency
    for the Security of Information Systems (In French: Agence nationale de la sécurité
    des systèmes d''information ( ANSSI) [15] and the National Commission on Informatics
    and Liberties or CNIL (In French: Commission Nationale de l''Informatique et des
    Libertés) [16]. This chapter provides a summary of what is known about the technologies
    used in mobile payment systems. The prominent role that personal data plays in
    mobile payments, on what basis should a technological choice be? How can digital
    trust be improved using the technologies used in mobile payment systems?

    This chapter covers issues of mobile payment in its various forms It is divided
    into five sections that list the different approaches to mobile payment deployment
    and their impact on data security. In the first section, six mobile payment issues
    are considered from the perspective of cyber-attacks. In the second section, security
    issues are described. In the third, privacy issues are described. In the fourth,
    blockchain is examined with respect to privacy. Finally, in the fifth section,
    recommendations are made for protecting the personal payment data cycle.


    # 4.2 SIX TECHNOLOGIES FOR MOBILE PAYMENT SYSTEMS


    In his Mobile Payment, Thomas Lerner [18] describes the main technologies used
    in mobile payment systems, which refers to transactions via a mobile device [19].
    Each of the technologies discussed has advantages and disadvantages [20].


    # 4.2.1 SHORT MESSAGE SERVICE (SMS)


    The “Short Message Service” (SMS) is a messaging service allowing users to use
    up to 160 characters. It was developed for in the Global System for Mobile Communications
    (GSM) network. Very simple to use and know throughout the world, it is however
    expensive and can easily become the target of cyber-attacks because of faulty
    cryptography techniques.


    # 4.2.2 UNSTRUCTURED SUPPLEMENTARY SERVICE DATA (USSD)


    Unstructured Supplementary Service Data (USSD) generally uses the Global System
    for Mobile Communication/Short Message Service (GSM/SMS) and serves as an interface
    for the customers themselves and between them the banks. Its advantage is that
    it is easy to use and compatible with all mobiles. The disadvantage is that'
