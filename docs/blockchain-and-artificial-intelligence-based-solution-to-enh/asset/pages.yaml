    # 2.7 CONCLUSION


    Digital identity is one of the major infrastructure services needed for the digital
    world. Many use cases rely on a trustworthy, reliable, and available digital identity.
    One important aspect of such a digital identity is the independence from single
    organizations or authority bodies. SSI offers framework of technology components
    and governance guidelines to build such a transparent, independent, privacy protecting,
    and interoperable identity infrastructure where the user is in control of their
    data. Blockchain is intended to play the role of a trust anchor in this infrastructure.
    Its immutable and distributed character ideally supports the concepts of SSI.


    Today, we see a large rise in the number of local and country initiatives driving
    SSI in their ecosystems. A crucial aspect for the flourishing and durability of
    those initiatives and solutions will be their interoperability. The digital world
    will not end at a country border or a business process. The World Web is a world-spanning
    infrastructure supporting all kinds of cases and allowing unrestricted access
    for everybody. With the growing number of IoT devices, this event experiences.


