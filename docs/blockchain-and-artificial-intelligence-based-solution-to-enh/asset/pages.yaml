    # 5.3.4 LIABILITY IN THE PUBLIC–PRIVATE PARTNERSHIPS


    To understand the better uses of personal information and data controllers, we
    must specify which role the universities and the tech companies play. For instance,
    ProctorU’s policy states that “Ilt join most processing contexts, Measures acts
    as a processor or service provider for a controller educational institution or
    certifying entity. In those situations, we process personal data only on documented
    legally-compliant instructions from the controller.”⁷⁰ However, that is not the
    case when you consider the tech companies using personal information to improve
    their systems or better control of how students’ personal information is used
    and, furthermore, they cannot be held liable. In theory, tech companies should
    be held liable by PIPEDA, the federal legal framework pertaining to the private
    sector, except for applicable to the private sector. For instance, ProctorExam
    in Quebec, Alberta, and British Columbia who have their own legal framework applicable
    to the private sector. However, certain companies claim to respect the applicable
    application. For instance, ProctorExam is a Dutch company subject to the GDPR’s
    regulation. Polytechnique Montréal and ProctorExam reached an agreement pertaining
    to the respect of the GDPR’s regulation and Quebec’s respecting access to documents
    held by public bodies and the protection of personal information.”⁷¹ In the case
    of the University of Toronto, an agreement was made with Edith to claim the protection
    of records and other personal information.


    One thing for sure, most software is offered by private actors, who are outside
    of the public education mission of universities. Consequently, the distinction
    between private sector and public sector activities is lost and represents a profound
    limit considering that the current Canadian legal framework, provincial and federal,
    relies on this distinction. Due to the numerous private-public partnerships, who
    are all often misunderstood by the legislators, the protection of personal information
    weakens.'
