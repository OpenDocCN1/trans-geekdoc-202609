  md: '# Blockchain and Artificial Intelligence-Based Solution


    Fairness and transparency go hand in hand with lawfulness, meaning organizations
    shouldn''t withhold information about why or what they are collecting data. And
    they should be clear to the data subjects about their identity and how they are
    processing their data.


    +   * Purpose limitation: It means that data should be collected only for a specific
    reason. The purpose of processing the data needs to be well-defined to the data
    subjects.

    * Data minimization: Users should only collect the smallest amount of needed data
    to complete the processing. There should be a reason to ask specific data. For
    example, there is no need to ask for a phone number or address if it''s not related
    to data processing.

    * Accuracy: It''s up to the organization to deal with data accuracy. Any incorrect
    or incomplete data stored should be corrected, updated, or erased.

    * Storage limitation: There is a need to justify the data being stored. Data retention
    shouldn''t occur if there is no longer needed for the data.

    * Integrity and confidentiality: Like the CIA triad, the GDPR requires all users
    to maintain the integrity and confidentiality of the collected data. And to ensure
    its security against unauthorized access.

    * Accountability: It''s the last principle, which means the GDPR requires a level
    of accountability for all organizations, it signifies that documentation and proofs
    should be associated with the data processing principles. At any time, Supervisory
    authorities can ask for those documents.


    # 3.4.4.2 2020: The California Consumer Privacy Act (CCPA)


    The California Consumer Privacy Act (CCPA) [16] is a statute intended to regulate
    how businesses handle the personal information of residents of the state of California.
    The CCPA was signed into law in 2018 and went into effect on January 1, 2020.
    As for the CCPA principle, they are as follows:


    +   * Consumers have the right to access all the data organization collects about
    them.

    * Consumers choose not to have their information sold to third parties.

    * Consumers can demand that organizations delete their personal data.

    * Consumers have the right to know whom their data has been sold to.

    * Consumers have the right to know the reason for the data collection.


