    # 6.3.1 PRINCIPLE 1: THE INDIVIDUAL CONTROLS AND HAS CUSTODY OF THEIR OWN DATA


    In each of our two case studies, the provider of the data, who may be an individual,
    is recognized as the controller of their own data, or ''owns''. Moreover, both
    the solutions make use of DID and DDO. In the case of OP, IDs are assigned as
    identifiers for datasets, whereas in the SSI solution, DIDs are used for actors,
    such as data providers, interacting in the marketplace. The use of dynamic DIDs
    in the case of the SSI helps ensure that the data be traced back to a natural
    or legally identifiable person once shared. In this way, data consumers cannot
    discover the identity of individual data providers and the source of the data
    remains pseudonymous.


    In the SSI solution, individual data providers are ''issued'' data by issuers
    from whom the data originate; for example, health data biomarkers might be generated
    in a lab from processing blood samples and subsequently issued to the individual
    in the form of VCs. This model then makes it possible to verify the authenticity
    of the data (i.e., its origin and its integrity), a capability that is facilitated
    by using Hyperledger Aries/Indy as a decentralized public key infrastructure;
    however, it does introduce reliance upon the data issuer depend upon the data
    issuer''s public key and data issuers may be able to revoke or render invalid
    VCs that they have issued. In the OP solution, on the other hand, unlike the SSI
    solution which relies upon VCs to transmit and share health data, OP is an Ethereum-based
    solution that uses smart contracts and tokens for provisioning access to or performing
    computation on the data. Smart contracts and the ability to tokenize data are
    not provided for the Hyperledger Aries/Indy stack. OP operates as a permissionless
    ecosystem as not but can be configured to a permissioned ecosystem as well; whereas
    the SSI solution, it relies on Hyperledger Indy, only operates as a permitted
    ecosystem. In the OP solution, the ''keeper'' maintains a registry of data ownership
    (synonymous with the data provider), but there is no mechanism by which the original
    source of the data, if other than the data provider, or its integrity can be cryptographically
    verified, unlike in the SSI solution, which supports such verification. This leaves
    the OP solution vulnerable to a problem commonly found in platforms offering artworks
    as nonfungible tokens (NFTs), being that it is not possible to ascertain whether
    the NFT represents ownership of an original or is merely a copied image of an
    original work.'
