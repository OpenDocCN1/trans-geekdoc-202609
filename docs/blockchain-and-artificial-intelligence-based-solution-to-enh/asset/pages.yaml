    # 3.1 INTRODUCTION


    One of the objectives of smart spaces and systems is improving society and human
    life quality, in terms of comfort, efficiency, or productivity. The Internet of
    Things (IoT) has developed into a backbone innovation for smart environments providing
    the mentioned features. In a market research, the evaluation that IoT systems
    could reach a potential economic impact of $11 trillion by the year 2025 compared
    to the actual $4 trillion, which represents approximately 11% of the world economy
    Institute [33]. IoT systems are becoming one of the most developed fields in computer
    science [74], and it''s a significant contributor to the economy. Real-time data
    processing and analysis greatly benefit multiple fields and infrastructures, especially
    for healthcare systems, antivirus and autonomous vehicle technology, smart cities,
    etc. Privacy and security are critical elements in any real-world environment
    established by an IoT system. All of these made a target of cyberattacks due to
    their security leak compared conventional computing. The report has shown an increase
    in attacks targeting IoT devices by 600% in the year 2017 Semantic [65]. IoT devices,
    despite their importance, major security updates, have insecure features, and
    insufficient data protection. For example, the Mirai Botnet, first introduced
    in 2016, was able to reach almost 400,000 devices simultaneously, leading to a
    total of $100 million in damage and shutting down significant platforms such as
    Netflix, GitHub, and Reddit for multiple months [48]. IoT devices don''t have
    the enough computational or hardware resources to use complex security features
    such as computers or smartphones [2]. Those systems can use a security layer in
    their implementation that provide the required security against cyberattacks,
    such as firewalls, antivirus software, etc. Hence, it is crucial to focus on securing
    these systems. They are becoming increasingly'
