    # 2.3.3 FINDY


    Findy, a Finnish public-private organization, develops a general-purpose, shared,
    and secure verifiable data network. The SSI-based approach is addressing individuals
    well as organizations. It is aiming to ensure the authenticity of the information
    required for e-services.


    In 2021, the European Commission proposed a framework for a European Digital Identity.
    The commission recommended that all EU member states work toward the implementation
    of the European Digital Identity framework. The solution must follow the eIDAS
    regulation. The proposal outlines several key principles, like self-sovereign
    data, transparency, and interoperability. Findy is aligned with these principles
    and is intending to work closely with the European authorities.


    # 2.3.4 BRITISH COLUMBIA – DIGITAL GOVERNMENT


    The government of British Columbia Canada is very active in creating digital services
    for its citizens. Under the title “Digital Government”, it presents its strategy
    and framework toward a digital society. With OrgBook BC, it started the access
    to verified information about registered BC organizations in 2019. With BC Services
    Cards and BcID, this path was followed followed. digital government platform shows
    how public services can enable its citizens to step into the digital world. This
    is done by explaining the advantages and risks as well as offering educational
    material.


    A heated debate rages over whether digital identity promotes inclusiveness or,
    on the contrary, promotes exclusion. The disadvantage of technically inept people,
    who are most elderly or uneducated, is a legitimate point.


    # 2.4 IDENTITY TECHNOLOGY


    Globally recognized standards must be created before a working system or identity
    layer for the World Wide Web can be built. Without these standards, only isolated
    solutions would develop, potentially fragmenting the identity layer and the SSI
    concept itself. Some technological obstacles and needs must be met in order to
    develop such identity layer or ecosystem, as described in Decentralized Identity
    Foundation (2017):


    +   - Independent ability to register SSI without control or ownership by a provider.

    - Being able to look up and discover identity and data across decentralized systems
    and cross-platform.

    - Tools for users to securely store sensitive data and share it in a controlled
    manner.


    Today, the standards to be defined for building these components are primarily
    driven by the Decentralized Identity Foundation and World Wide Web Consortium
    (W3C) community groups. With the definitions of Decentralized Identifiers (DID),'
