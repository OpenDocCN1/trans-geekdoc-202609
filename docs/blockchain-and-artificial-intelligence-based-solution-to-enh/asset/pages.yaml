    related to fake news, such as Liding and DreamTeam.


    # 7.8 CONCLUSIONS AND FUTURE WORK


    In this work, we have seen that cyber influence is defined as disinformation or
    fake news spreading on social media platforms. Threat actors, major countries,
    use influence to accomplish their strategic goals: economic, political, or ideological.


    Techniques used by threat actors are concentrated on using robots, and some demonstrated
    that bots spread more and faster fake news than humans do. Gartner predicts that
    “most individuals in developed economies will consume more than true information
    by 2022” (Gartner, 2019). Facebook and Twitter are the two most used platforms
    to do so but some others like TikTok expands substantially, where it give place
    to fake news. Out of the election period, fake news is still happen. Their algorithms,
    based on users'' engagement (likes, retweets, etc.), make that happen. Fake news
    is spread by influencers who are known to be big influencer players. That will
    give the chance to expend bad news.


    We can conclude that disinformation erodes trust in information: people are not
    able to differentiate true stories from false ones. Social media have been proven
    as effective tools to influence individuals'' opinions and behaviors. Impacts
    are huge: from harm to people''s health to violence, from economic instability
    to increase social problems.


    In the future, possible improvement would be government regulation to compel algorithm
    transparency. The algorithm is a black box, we don''t know how it works, and why
    it comes with this result. There is no explanation. In that way, users will be
    more aware of their choices, and make clearer and more rational decisions.


    The second way of improvement would be tracking who are the influencers and those
    who are acting undercover like Meganors. The bad influencers can like, comment,
    and then spread fake news all over social media. It would be interesting to analyze
    which social media platform is more willing to spread fake news as well.'
