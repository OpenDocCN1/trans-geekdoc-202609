    widespread use of identity management, phishing attacks based on getting identity
    providers'' login credentials most likely increase as well. Phishing attacks are
    much easier to occur when HTTP redirects are used [10]. It is as simple as creating
    an illegitimate website that redirects to a fake copy of the identity provider
    to capture the user''s credentials. A common example of phishing attacks using
    fake identity provider websites is Yahoo! seal''. The presence of the seal enables
    the user to distinguish the real Yahoo! sign-in page from a fake one. However,
    this only works if the user logs in the same computer as the seal was created,
    or by storing tags in multiple places on the computer. To prevent phishing attacks,
    it is very important that users can authenticate the relying party and the identity
    provider. Mutual authentication needs to be included in identity management systems
    in such a way that the user is not required to install special software or to
    use the same computer as all. Concrete, the use of digital certificates can solve
    this problem as trusted certificates and enforce https protocol to mitigate these
    kinds of attacks. Moreover, the authentication of the identity provider and relying
    party by the user should be more user-friendly than checking their SSL certificate
    manually (SSL is a Secure Sockets Layer Protocol for establishing secure links
    between networked computers) [10].


    # 1.2.4 Privacy Issues and Data Breaches


    Sharing personally identifiable information is a great concern in managing privacy,
    protecting data, and complying with regulations. Identity management systems,
    sharing such information is often a key goal, which raises interesting privacy
    issues. It is possible, for example, for a service provider site to provide a
    user''s uniquely digital identifier for the process, even if it''s not necessary
    to know who the user is. "Pseudonyms" have been proposed for preserving privacy,
    especially when multiple web services cooperate to provide a combined service
    that necessitates user-attribute sharing [11]. Dunphy et al. [12] also reported
    that, the largest data breach of the 21st century occurred at Equifax with 143
    million compromised identity data records. Recent studies show that (1) nearly
    more than 10 billion records have been breached since 2013, (3) over 6,500 incidents
    resulted in compromised data records were publicly disclosed in 2018, (4) the
    average cost of identity fraud is $263 per person, (5) The yearly cost of identity
    theft was estimated in 2016 to $16billion, (6) the average cost for each stolen
    or record containing sensitive and confidential data is estimated to $148. All
    these factors require novel identity solutions solutions that strive toward a
    return to a satisfactory level of privacy [13].


    # 1.2.5 Identity Fraud


    Financial identity fraud is the most common type of identity fraud². However,
    Identity fraud can happen in many forms such as medical identity or the creation
    of a new digital identity. The goal of identity fraud is to create fraudulent
    identities using'
