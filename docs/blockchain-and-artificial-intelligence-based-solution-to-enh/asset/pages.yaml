    # 3.2.1.1 Radiofrequency Identification


    By connecting smart devices, the world has become more accessible. Smart devices
    are being used everywhere, making IoT popular with businesses and services across
    all industries. One of those technologies is RFID. As mentioned before, the term
    “Internet of Things” was introduced during a presentation about RFID. RFID is
    a technology that uses radiofrequencies to transmit data [39]. It automatically
    identifies an object and captures its data stored in a small microchip tag. This
    process is performed using RFID tags, they come in many different shapes, sizes,
    and capabilities. These are of two kinds.


    +   - Active tags: contain internal power sources as battery power. They can exchange
    communication with other tags and could automatically communicate with the RFID
    reader.

    - Passive tags: They are powered by the tag reader. Hence, they don''t require
    any internal power.'
