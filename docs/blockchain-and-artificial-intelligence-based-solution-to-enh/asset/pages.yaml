    # 5.2.4 RISKS OF ERRORS AND DISCRINATION


    Proctorio states that their algorithmic techniques are superior and more effective
    than human proctoring and could fail in the gaps for human error, resulting in
    better results than human proctoring for detecting cheating incidents.⁶⁴ many
    times, Proctorio has been accused of utilizing algorithms that are discriminatory
    towards visible minorities.⁶⁵ Based on findings, it has been reported that 57%
    of authentication attempts by student with darker skin tones were unsuccessful.⁶⁶
    Furthermore, it''s also been said that the best authentication rate for all ethnicity
    groups is inferior to 75%, which highlights that the error rate is quite significant.⁶⁷


    # 5.2.5 HYBRID SYSTEMS AND HUMAN CONTROL


    It seems like universities are growing suspicious regarding fully automated systems
    and are therefore prioritizing hybrid systems. Hybrid systems are ones that combine
    human proctoring and automated proctoring which integrates artificial intelligence.⁶⁸
    The University of British Columbia (UBC) has communicated that it will prohibit
    the use of automated online proctoring software as Proctorio, in all of their
    programs with the exception of accredited programmes which require such.⁶⁹ In
    regard to Proctorio, the software has been used to a Privacy Impact Assessment
    by UBC and the unsatisfactory results alone could justify abandoning the incident.⁷⁰
    In the case of ProctorU, it offers many hybrid solutions as Review+, which utilizes
    human humans for the authentication and the post-verification of online exams,
    but the surveillance of exam is automated.⁷¹ ProctorU''s Record+ utilizes an automated
    system for the authentication of students and the surveillance of the exam, and
    results are then certified by a human proctor prior to emitting an incident report.⁷²


    # 5.3 RISKS GENERATED BY AI TOOLS FOR EXAM MONITORING


    # 5.3.1 MAIN LEGAL ISSUES


    Online proctoring solutions have raised ethical and legal issues. Some of these
    issues are regarding privacy violations, while others are pertaining to the protection
    of personal information.⁷³ and there are also concerns in regard to fundamental
    rights (equality and non-discrimination) in the implementation of AI solutions.'
