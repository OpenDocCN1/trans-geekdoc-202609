  md: '# Blockchain, AI, and Data Protection in Healthcare


    # 6.2.2.4 Computational Processing of Data


    The FHE adopted in this solution is a kind of cryptography scheme which allows
    operations on encrypted data without decryption. Currently, the Xeon-Kim-Song
    (CKKS) FHE scheme [28] is the most effective method of performing approximate
    homomorphic computations over real and complex numbers. By going exact computations,
    the CKKS scheme achieves significant improvements in the ciphertext/plaintext
    ratio and algorithm speed. Therefore, this scheme is adopted in our solution as
    an encryption method for preserving the privacy of personal data. To prevent consumers
    from sharing homomorphically encrypted data, the design suggests that some level
    of protection and monitoring by the data manager as a service provider is required.
    These architectural enhancements require further research and involve the concept
    of a ‘secure enclave’. Due to the effort and complexity of developing such an
    environment, this feature remains future work for this solution.


    Snippets of code and screen shots from an implementation of the SSI data marketplace
    can be found in the Appendix.


    # 6.2.3 Case Study: Ocean Protocol Data Marketplace


    # 6.2.3.1 Introduction


    Ocean Protocol (OP) is an Ethereum-based decentralized protocol which follows
    a systematic approach for unlocking data for AI analysis with the verification
    of eligibility, proofs of payments, and acceptance of terms and service level
    agreements [29, 30]. The overall goal of OP is to allow data providers to monetize
    their data in a privacy-preserving manner and consumers to obtain value from accessing
    and processing the data.


    The data within OP marketplace cannot be accessed directly if the compute-to-data
    approach is used. Data tokens that use the Ethereum ERC20 token standard are utilized
    to provide access to the data [30]. The data stays on individual data providers’
    primitives and consumers can only perform computations on the data after accessing
    the data using a data token [30]. The OP decentralized database maintains record
    of every transaction.


    The data can be transferred to a third party in exchange for the OP tokens [29,
    30]. Any organization with access to a data token has compute access to the data.
    In other words, each data token provides a license to access the data [29, 30].


    # 6.2.3.2 Preliminaries


    As a foundation to understanding the solution design, we present some preliminary
    concepts and technical primitives based on V2.0-3.0 of OP as follows:


    +   - Data NFT, a nonfungible ERC721 token representing copyright of a data service.


    +   - Data Token, in the context of OP, an ERC20 token for gaining compute access
    to the data.


    +   - Ocean Token, the token-based currency used in the OP marketplace.'
