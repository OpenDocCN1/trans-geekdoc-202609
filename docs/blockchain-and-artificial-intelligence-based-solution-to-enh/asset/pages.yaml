  md: '# 7.1 INTRODUCTION


    Cyber influence is fake propaganda on social media. Threat actors are doing this
    for a specific reason, which can be political, economic, or military purposes.
    Does anyone have read fake news or watched fake videos and photos about Russo-Ukrainian?
    Yes. The cyber threat actors want to gain the public hearts; they send news to
    anyone, mainly on social media. That’s the new part and the black of social media.


    Social media plays a big part in spreading fake news because it provides practical
    ways that make disinformation easy to do, fast, and cheap. Instead of humans,
    robots, called bots, send automated messages to thousands of users. Indeed, threat
    actors use different techniques to make fake news viral. Those well-known platforms,
    such as Facebook and Twitter, are the most used to communicate to now. Studies
    have been realized on to understand influence competence. But others like YouTube
    and TikTok are social media that no studies have been realized as of today. There
    are real blocks


    Countermeasures can be applied by users and by social media themselves. In this
    chapter, we will show that it is impossible to eradicate fake news because measures
    are not enough automated and are not proactive or, in other words, The consequences
    are that cyber influence has negative impacts on society, from anti-vac conspiracy
    which has altered world unity to political influence. General Paul Nakasone, director
    of the United States National Security Agency and declared that “foreign influence
    operations would be the next disruptor” (de Rochechede & Tenenbaum, 2021).


    Who influencers? We do not know exactly who they are. Social media platforms don’t
    have the responsibility to track them. Indeed, this is one of the most fundamental
    problems with social media. Some influencers are megadonons, who have the power,
    in other worlds, who have the control; as example: the Mercer family, who had
    played a big role in the 2020 US presidential election and financed last year
    over $20 million in secret contributions. As another example, we can cite Steve
    Bannon, who was Trump’s advisor, and at the same time, was sitting on the board
    of Cambridge Analytica. In addition, those companies have created social profiles
    to influence American voters to vote for Trump.


    # 7.2 BACKGROUND


    # 7.2.1 CONTEXT


    In this section, we will define what is cyber influence and then we will portray
    the type of influencers.


    We notice an absence of standardized definitions of cyber influence. Here are
    the frequency terms to describe cyber influence, by order of importance: fake
    news, misinformation, propaganda, disinformation, influence campaigns/operations/war
    (Smith & Thompson, 2020).


    Those words are all FALSE. Information can be intentional (disinformation) or
    not (misinformation). Disinformation is “information that is false and deliberately
    created to harm a person, social group, organization or country social'
