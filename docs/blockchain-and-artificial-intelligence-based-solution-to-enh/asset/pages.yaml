  md: '# ETHICAL RECOMMENDATIONS FOR PROTECTING THE LIFE CYCLE OF PERSONAL DATA


    We have looked at several technologies that condition payment transactions. With
    each use of these technologies by an individual, multiple categories of data are
    generated as shown in section 2. This personal data has a lifecycle that evolves
    in four stages: the moment of collection, the moment of storage, the moment of
    exploitation, and the moment of destruction or anonymization (see Figure 4.2).


    # COLLECTION


    Collection can be manual or automatic. Personal payment data collection requires
    consent. In Europe, the contract is one of the legal bases under the GDPR [71].
    In other words, where the collection is objectively necessary for the performance
    of the contract, consent is not required. However, secondary use of the payment
    data requires an explicit collection of consent [72].


    # STORAGE


    Storage is the process of recording and preserving data using a server or cloud
    services. Given the value of payment data, it becomes relevant to know where the
    payment data of a country’s citizens is stored. Even though in the case of a payment
    data in Canada, where applicable, we know that the data related to purchase is
    communicated to the “financial institutions and payment processing companies”
    [73], it remains unclear


    ![](img/22da15453f020b9665d0b01ac32670f9_100_0.png)


    FIGURE 4.2 Data life cycle management.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Security, Privacy, and Blockchain in Financial Technology 89


    where the collected information is stored. From a privacy perspective, it would
    be appropriate for countries to require storage in national servers and sovereign
    clouds. In the presence of biometric data, the CNIL secures local storage in order
    to give full control to the individual [74]. It is tempting to use the services
    of American companies that have democratized cloud services. One should not forget
    that the Clarifying Lawful Overseas Use of Data (CLOUD) Act [75] could be an invasion
    of the privacy of data of citizens of any country. A U.S.-based global provider
    must facilitate access to the data it stores if the U.S. deems it necessary.


    # 4.6.3 EXPLOITATION


    The use of data can take many forms: use for the customer who must pay, for the
    merchant who sells a service or product, secondary use of the data, sharing of
    the data, transfer to another country, etc.


    # 4.6.4 DESTRUCTION OR ANONYMIZATION


    When the purpose for which the data was collected or used is achieved, it is important
    that the data be destroyed. A retention period must be considered in order to
    ensure audits (taking into account the requirements of professional bodies) or
    the guarantee of a product or service. According to Law 25, personal data can
    be anonymized, if there is a serious and legitimate reason (119). The anonymization
    of payment data could benefit the open data sector. Municipalities, cities, and
    can put anonymized citizen data to work for citizens. It is not right that payment
    data benefit, in large part or only, financial institutions.


    Mobile payments raise other ethical issues that have not been considered in this
    chapter: the risks of bias associated with parameter choices for establishing
    credit ratings or profiles; the new privacy issues arising from open banking;
    authentication and accountability related to the environment of connected objects
    with or without human intervention; privacy in light of the legalization of bit-coin;
    the new risks associated with peer-to-peer payment applications; and the eco-responsibility
    dimension.


    # 4.7 CONCLUSION


    This literature presents some characteristics of mobile payment technologies and
    systems. USSD, BLE, SMS, WAP, QRC, NFC/RFID are the models described in the article.
    Most mobile payment systems implemented around the world use one or more of these
    technologies. Many of them raise ethical issues that concern respect for personal
    data. Ethics concern all mobile payment stakeholders: users, researchers, entrepreneurs,
    the public sector, privacy associations, nonprofit organizations, and many others.
    So mobile payment is not just for entrepreneurs or the private sector. It is important
    that all stakeholders in the ecosystem participate in public consultations and
    the implementation of privacy policies for the benefit of mobile payment users.
    As mobile has established itself as an accessible tool, it is becoming easier
    to access private data and track the online activity'
