    # 1.5 CURRENT EXPERIENCES THROUGH THE WORLD


    Digital identity gives the identity to citizens so that they can get their daily
    tasks done with more ease, security, and effectiveness from anywhere. These tasks
    could be buying a bus pass, checking the status of a building under construction,
    receiving funds, and getting registered to any consumer service, getting a passport
    or a driving license. All these activities could be performed from one place or
    using a single identity which we call the digital identity. According to report
    by Lynch [33], more than one billion people in developing countries around the
    world have no proof of their identity. This unique citizen identity would bring
    interesting changes in every process of daily life and provides identity [34].
    A major example is the Estonian advanced model of digital identity that enables
    government sector to identify its citizens with their unique digital identity
    to facilitate with them basic needs. They have the facility of online voting,
    access to their healthcare records online, and can access all the government processes
    online like marriage, divorce, real-estate, and any registration or record checking.
    Other than the developed countries such as Canada, the United States, the United
    Kingdom, and other European countries, a number of developing countries including
    Peru, Chile, Pakistan, India, Thailand, Indonesia, and the Philippines, have also
    been trying to take the leverage of digital citizen identity [34]. Bitnation a
    governance platform based on blockchain technology, tries to establish the concept-citizenship
    digital identity registration on blockchain [35]. Any individual in the world
    can become the citizen of Bitnation by agreeing to the constitution. The Bitnation
    Refugee Emergency Response (BRER) program provides an identity system called Blockchain
    Emergency ID (BE-ID). There are a number of programs, organizations, and software
    that provide the facility of having a digital identity including ConsSys, ID2020,
    Hyperledger, Australia Post Office, PIMN (Platform Identity Management Netherlands),
    the US Homeland Security, ShoCard, and Uport [36].


    Other than these applications of digital identity, Canada has emerged as a country
