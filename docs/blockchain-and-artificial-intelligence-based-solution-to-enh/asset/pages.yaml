- pgno: 33
  md: '# Demystifying Digital Identity Challenges and the Blockchain Role 21


    service itself. These different databases could communicate together or share
    citizen personal information with the approbation and authorization of the citizen.
    The management of the database layer includes the use of a set of security services
    dedicated to preventing data breaches as data breach prevention or data loss prevention
    (DLP). Such focus on the integrity and nonpropriability of these databases themselves.
    Concretely, in this layer, the focus must be on securing the digital identity
    using the zero trust principle. This principle implies the application of a set
    of security rules in accordance with policy and permissions. As an example of
    rules applied in the base layer digital identity management systems, we can enumerate
    the following points:


    +   - Who has access to what data related to digital identities?

    - Which application is accessing digital identity data?

    - When are digital identities accessed?

    - How are digital identities moving to service providers?

    - Why is this user accessing a digital identity data?


    The goal behind the application of these rules in digital identity management
    system is to protect access to personal data and ensure that only authorized entities
    have a view of such data.


    # 1.7 CONCLUSION


    The main concern of the government is to provide a secure software system to its
    citizens in order to ensure their personal information is private and avoid the
    risk of identity theft when they access the public government services online.
    In this paper, we highlighted the digital citizen identity concept that ensures
    to provide daily services accessible with much more security, and effectiveness
    from anywhere. The goal is to provide a state of the art of the benefits, challenges,
    and the available solutions of this concept. Therefore, we performed a literature
    study where we studied the literature, and then we highlighted the experience
    of using the digital identity in different countries throughout the world. Based
    on that, we proposed an architecture of a solution that will help to overcome
    the challenges identified in our literature study. This architecture contains
    three layers i.e., applications to give the citizen control of his identity and
    data, blockchain to ensure citizen data privacy and get protected, and database
    to enable the secure access to the citizens'' data with more ease and to allow
    an identity quick recovery.


