    concept involved. These keys are used not only to encrypt data but also to verify
    the identity of the communicating entities. The most distinguishing characteristic
    of public key infrastructure is that it attains the inherent security provision
    using public key, which is disseminated to the public and a private key known
    only to the user. Areliable infrastructure is needed for secure key exchange management
    and maintenance. For public key cryptography, there are two key management criteria.'
