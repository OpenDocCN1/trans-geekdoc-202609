- pgno: 170
  md: '# 7.5.1.1 Symbolic Matching/Structured Prediction Methods


    The symbolic method involves the use of symbols and knowledge in the domain of
    legal AI. The explainability property can be achieved through symbolic legal knowledge
    using the events and relationships. Deep learning techniques based on symbolic
    methods can be used to improve performance.


    +   • Extracting Information:


    Extracting Information (IE) has been extensively researched in NLP. IE underlines
    the extraction of valuable information from text. Here, two examples are given
    for using extracted characters to achieve legal AI interpretability:


    +   i. Extracting relationship and inheritance litigation:


    Inheritance disagreement is a kind of civil law case, which mainly concentrates
    on the distribution of the rights of inheritance. Hence, it is important to define
    the relationship between the parties, because the person closest to the deceased
    can gain more wealth. In order to achieve this goal, extracting relationships
    from legacy disputes can justify the outcome of the litigation and improve performance.


    +   ii. Extracting timeline and sentence prediction in criminal cases:


    Many parties to collective crimes often participate in group criminal cases. To
    determine who is predominantly accountable for the offense, it is necessary to
    identify the actions of everyone during the situation, and the order of events
    as they have occurred is also important. For example, in a crowd fight dispute,
    the person who initiates the fighting must take main responsibility. Therefore,
    the prediction of criminal proceedings judgment requires a qualified extraction
    model for the timeline of events.


    +   • Extracting legal elements:


    In addition to the regular symbols in regular NLP, legal AI also has its unique
    symbols, called legal elements/components. Legal item retrieval concentrates on
    retrieving important items, such as when someone is attacked or something is stolen.
    Offenders can be brought to justice based on these elements. The usage of these
    components can'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'not only bring temporary monitoring evidence into the evaluation and prediction
    problem but also make the system more interpretable.


    # 7.5.1.2 Methods Based on Embedding Process


    The embedded method emphasizes the presentation of facts and legal knowledge in
    the embedded latent space, and deep learning techniques can be used for associated
    tasks.


    +   Words and Concepts Embeddings:


    Embedding symbols and words play an important NLP role because they can implant
    distinct text in a continuous vector space. In legal AI, embedding technologies
    are also important because they can give more relations to texts and vectors.
    Also, it is impossible to understand the actual significance of conventional legal
    descriptions. The difficulty in learning the executive vocabulary characterization
    can be overcome by trying to grasp literature details and legal facts by embedding
    words for related tasks. Knowledge modeling is essential to legal AI because many
    results must be determined based on laws, regulations, and knowledge. The two
    main challenges of knowledge graphs in the legal domain are:


    +   i. Knowledge graph are important in legal AI. Mostly, the developers have
    to create graphs from scratch. In addition, dissimilar legal notions have diverse
    expressions and significances in the legal structures of various countries, which
    also makes it difficult for people to develop a general legal knowledge graph.


    +   ii. The form of the generalized table of legal knowledge is different from
    the commonly used form in NLP. Legal AI mainly concentrates on legal concepts
    explainability.


    These two major challenges of knowledge modeling through embedding with legal
    AI are not easy to solve, and many researchers may seek ways to overcome these
    problems in the future.


    # 7.5.2 Legal AI Applications


    Legal AI has several typical uses, including predicting court judgments, mapping
    similar cases, and legal question answering. The vital functions of the civil
    law/common law system are predicting court judgments and'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'mapping similar cases. Answering legal questions is the work of consultancy
    services for the people unacquainted with the legal domain.


    +   • Predicting Court Decisions


    Legal judgment prediction (LJP) is one of legal AI''s important tasks, especially
    in the civil law structure. The judgment is given based on the facts/constitutional
    articles in the civil law system. Legal sanctions are imposed only in the case
    of violations of prohibited acts as per the law. The main task of LJP is to predict
    the outcome of the court proceedings based on the actual explanation of the case
    and the content of the legal provisions in the civil justice system. Legal systems
    in countries such as France, Germany, Japan, and China use LJP. In addition, LJP
    has attracted widespread attention from AI researchers and lawyers.


    +   • Similar Case Matching


    In the United States, Canada, India, and other common law system countries, current
    verdicts are based on representative cases that have been tried in the past. Therefore,
    identifying the most similar cases is the main challenge in the common law system.
    Similar case matching (SCM) has become an important topic of legal AI in predicting
    the outcome of common law legal disagreements. SCM concentrates on identifiying
    sets of analogous cases, and the description of similarities may be varied. SCM
    requires modeling the association between interpretations based on information
    of diverse granularities, such as fact level, event level, and element level.
    This modeling can help find the legal information easier.


    +   • Legal Question Answering


    One of the most important parts of a lawyer''s work is to deliver high-quality
    and reliable legal consulting services to laypersons. However, due to the inadequate
    number of professional lawyers, it is usually difficult to guarantee that laypersons
    receive sufficient-quality consulting services, and legal question answering (LQA)
    may solve this problem. Some questions will relate to the interpretation of certain
    legal concepts, while other questions may be related to the analysis of specific
    cases. In addition, the wording of the question can differ between professionals
    and non-professionals, especially when describing terms related to a particular
    subject area. This is one of the major challenges for LQA.'
