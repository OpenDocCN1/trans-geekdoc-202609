    # 2.4.4 Challenges for a Blockchain-Based IoT Solution


    Until now, the market for a Blockchain-based IoT has demonstrated the demand and
    its potential for being a breakthrough solution in many industries and domains
    of the economy. Many proof-of-concept or pilot runs have been in practice since
    2017. Everledger, an application specific for diamond tracking and Filament for
    IoTs, has emerged, but if we look at real-world, end-to-end integration of Blockchain
    technology, the result is mostly ambitious or restricted and not concrete or fully
    exploited. It becomes quite challenging to draw the line between Blockchain and
    IoT’s potential and their limitations. This is due to the high uncertainty in
    its deliverance and performance.


    The logical challenges of a Blockchain-based IoT described in [27] are:


    +   1. Limited resources for IoT devices such as sensors and other nodes. Blockchain
    is not at all free from cyberattacks like selfish mining, DDoS, forking attacks,
    etc.


    +   2. The transaction process is slow in comparison to the demand speed.'
