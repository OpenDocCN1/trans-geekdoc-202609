    # 7.1 INTRODUCTION


    Blockchain can be simply described as a decentralized method by which any type
    of data (including but not limited to financial transactions, securities, and
    asset orders) can be permanently recorded in an encrypted and irreversible ledger
    [1]. The first major use of blockchain technology came from the development of
    Bitcoin. This is a digital encrypted currency, launched in 2009 [2]. Various other
    digital and virtual cryptocurrencies were successively created using similar technologies.
    After people have widely understood that Bitcoin is based on immutable and secure
    technology, the use of Blockchain technology in areas other than digital payments
    was discussed for the first time in 2012, indicating the subsequent emergence
    of projects such as Ethereum [3]. Based on these discussions, potential stakeholders
    have begun to imagine, consider, and develop potential applications of Blockchain
    technology in areas other than cryptocurrencies (such as health care, transportation,
    intellectual property, and legal industry). As mentioned earlier, the main discussions
    surrounding Blockchain today are focused on how to use the technology for other
    potential applications (i.e., beyond digital currency) from a business and technical
    perspectives. One of the possible application is in the legal profession. From
    initial intellectual property protection to registration, licensing and enforcement,
    litigation, chain of custody, and settlements, Blockchain technology can be used
    to achieve a variety of valuable purposes. The challenge faced by this new technology,
    namely the commitment to the automation, reliability, efficiency, and effective
    protection and management system of intellectual property rights, provides an
    important impetus for meeting these challenges and implementing the integration
    of Blockchain technology in these areas.'
  merge: -1
  img_proc: true
