    # 6.2 FUNDAMENTALS OF BLOCKCHAIN TECHNOLOGY


    For every technological system there is one web server with a database for scaling
    up the data or expanding the operation. A data system is usually limited in its
    storage and upgrade by the size (capacity) of the server it utilizes. In instances
    of sudden surges in data usage, it is often quite difficult to achieve a server
    upgrade in a timely manner. To solve this problem, an organization can rent extra
    server space without obtaining the actual physical server, like the one provided
    by Amazon Web Servers. All the data are stored in these rental servers. Decentralization
    of data and decentralized apps (D Apps) are the common practices in a Blockchain
    framework. Building a generic framework of a Blockchain architecture is key, and
    a fundamental issue with Ethereum and hyper ledger includes the important financial
    transactions for Blockchain. Amazon, for example, with its billions of users,
    is a centralized network utilizing a system called grid computing. Figure 6.1
    shows Amazon-based centralized system with users and different functionalities
    such as customer, types of customer requirement, different types of product information,
    data related to images and videos, and digital marketing. It is a centralized
    system with a generic processing unit for fast communication and infrastructure
    facilities.


    Within a Blockchain architecture, the information is not owned by a single entity
    but rather by multiple individual users. In a centralized data transactions system
    there is a high chance of manipulation of data. In a decentralized financial transactions
    system, such chances are significantly reduced because there is no single identity
    controlling the transactions


    ![](img/73e16681f7c79384b117f947ee8dd11a_131_0.png)


    FIGURE 6.1 Centralized Amazon system with specific data features.'
