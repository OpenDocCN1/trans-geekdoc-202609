    # 9.10 RECOMMENDATIONS


    With the multitude of schemes and incentives offered by national and state governments
    to promote rooftop solar, the number of prosumers and solar generation capacity
    are going to increase in near future in Uttar Pradesh. Enabling P2P energy trading
    would provide a platform for both prosumers and consumers to buy and sell green
    energy under the rules and regulations that may be defined by the Honorable UPERC,
    enabling them to better recover their costs and increase green energy in the state.
    It would further help in achieving Sustainable Development Goals 7 (“Ensure access
    to affordable, reliable, sustainable and modern energy for all”) that India is
    committed to [6].


    In view of this, ISGF, in consultation with Power Ledger and the Project Advisory
    Committee, proposes the following path forward:


    +   i. P2P Trading Price: During our interactions with the project participants,
    the majority of prosumers/consumers said they do not wish to bid/trade daily.
    Rather, they would opt for a fixed price for sale and purchase of RTPV energy,
    which would give them better clarity on how much higher price they can sell (for
    a prosumer) and save (for a consumer), if they engage in P2P trading. In view
    of the project experience, we recommend keeping P2P sale price of RTPV energy
    at mid-point between the highest commercial tariff and the net-metering feed-in-tariff.
    These prices may be kept the same for a financial year. When tariff regulations
    are issued, the P2P trading price can also be issued by UPERC.'
