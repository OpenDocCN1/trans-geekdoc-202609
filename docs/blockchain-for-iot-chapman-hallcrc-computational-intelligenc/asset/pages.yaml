  md: '# 6.9 CONCLUSION


    Smart contracts with Blockchain technology certify the chain of securities custody
    and provide ease of service for payment of dividends, stock splits, and reduced
    operational risk. It helps in clearing and settlement of securities. There is
    a concept of a three-day settlement cycle in the United States, Canada, and Japan,
    which involves securities depositories and management agencies. Blockchain provides
    mutual peer-to-peer execution and implementation of business logic using smart
    contracts. The insurance industry spends millions of dollars on claim processing.
    Smart contracts can be implemented to automate and streamline claim processing.
    Smart contracts can also be used in digital rights management. Blockchain technology
    can be used to build distributed energy system for the decentralized energy trading
    markets and improving energy utilization and reducing grid operating costs. Blockchain
    technology with smart contract can be applied in health care, production markets,
    and intelligent transportation systems. Smart contract is known as a research
    topic in industries and academia. Smart contract will change traditional financial
    management system by the application of IoT and artificial intelligence.


