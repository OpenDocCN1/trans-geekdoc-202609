    # 10.3.4 Storing Methodology


    After applying an AI algorithm for forecasting food- and crops-related data, the
    information is saved in the Ethereum file system as a shared storage policy with
    hashing address on the blockchain network storage. To make the system more cost
    efficient, other Blockchain file system also can be used if and as required.'
