    to their clients, especially about tax law.


    # 7.2.7 Litigation and Settlements


    Litigation is used to describe a legal action brought by the parties to defend
    or enforce the legal right. It is determined by an agreement between the parties,
    but sometimes by a judge or jury of the court. The litigation can range from banking
    to fraud, contract issues, regulatory mechanisms, and mergers and acquisitions.
    Litigation involves various actions that must be taken before, during, and after
    legal proceedings to ensure the protection of legitimate rights and interests.
    This can include preliminary negotiations, arbitration, legal relief, and assistance.
    Like other legal procedures, litigation is very time consuming and involves a
    lot of paperwork. Moving litigation to the Blockchain can help reduce time and
    increase transparency to the system. Lawyers can register themselves on the Blockchain
    platform by providing their details such as license number, experience, and contact
    information. The plaintiff can also register and hire a lawyer to provide legal
    aid for the dispute. After filing a claim, the defendant will receive a notice
    asking them to respond to the allegations. Also, the response can be sent on the
    Blockchain, ensuring that all information is decentralized and immutable. This
    makes it easier for the judiciary/jury to make a decision based on the information
    contained in the Blockchain. This simplifies the entire process and significantly
    reduces the time required to make a judgment, thereby quickly solving the case.
    If at any time the old case is on re-trial by a new judge, the information stored
    in the Blockchain can be accessed to collect all necessary documents and information
    again. In addition, there is no need to keep long paper records for a long time.


