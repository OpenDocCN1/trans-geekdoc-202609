    # 5.3.3 System Design


    The system design for the IoT-based smart home automation system is presented
    in Figure 5.1, where ESP-01 module is connected to the relay unit via Arduino
    Uno R3 microcontroller. The output of the relay unit is connected to the electrical
    appliances. For making the connection between the multiple components of the system,
    jumper wires and breadboard were used. The ESP-01 and the relay unit require female
    jumper wires whereas the Arduino Uno R3 requires male jumper wires. Overall, a
    combination of jumper wires and breadboard are used for setting up the smart home
    automation system. The system needs a power source, which can be provided using
    a normal power bank. Once the system is turned on, it will look for a nearby access
    point and get connected using SSID and password. Once the device is connected,
