  md: '# 7.1.1 Future Challenges and Hurdles


    Blockchain technology has been around for less than a decade, and it is still
    in its infancy. However, Blockchain technology faces several challenges in four
    distinct fields: technology, business, education, and legal and regulatory services.
    In this chapter we mainly focus on potential legal/regulatory issues related to
    this new technology. The vital use of Blockchain as a trading platform should
    arouse great interest for any lawyer. This is because the Blockchain networks
    can verify various value transactions related to digital currency or digitized
    assets. In addition to digital transactions, the transactions connected to the
    land, debt, or intellectual property rights can also be efficiently handled by
    Blockchain. The current main problem is the speed at which these transactions
    can be processed using Blockchain technology. Compared to traditional transaction
    platforms (like PayPal/VISA), Blockchain is now much slower. For example, Bitcoin
    (the most widely used Blockchain) can process only two to five transactions per
    second (TPS), and Ethereum can perform at 10 TPS. Alternatively, it should be
    noted that many other alternatives have been introduced to solve this problem
    via second-layer technology [4]. They are developed over the basic level blockchains
    (such as Bitcoin or Ethereum blockchains).


    Regarding the future legal challenges, the main obstacle that should be discussed
    is undoubtedly the lack of proper supervision and legal framework for Blockchain.
    In the past few years, the development of Blockchain technology has been much
    faster than expected, and a large number of applications of this technology are
    created in the new grey areas of prevailing/inadequate regulatory laws. Similarly,
    the use of various cryptocurrencies to conduct illegal transactions on the Darknet
    market is the first/major regulatory issue. This illegal behavior forced the regulator
    to quickly formulate certain rules in this area to combat money-laundering activities
    [5]. In addition, the second wave of regulatory uncertainty occurred during the
    initial coin offering (ICO), which was introduced using cryptocurrency as a method
    of crowdfunding. Unfortunately, despite countless ICO scams in recent years, the
    statements of regulators (such as the US Securities and Exchange Commission) was
    a vital player in the stock markets. The participation of regulators (especially
    securities consultants) aims to clarify the situation of ICOs and protect investors
    from fraud, but because the underlying technology is still in the budding stage
    and is developing rapidly (and not yet widely known by the regulators), it is'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'difficult and risky to enforce regulations without fully understanding the
    meaning of them. Not surprisingly, the lack of comprehensive regulations has brought
    uncertainty to the future of Blockchain technology, and the rate at which this
    promising technology has been adopted by multinational companies in their daily
    operations has slowly declined.


    Another important legal issue is the lack of planning regarding the legal requirements
    of early Blockchain platforms. Most of these platforms focus on trading rather
    than their reporting requirements. Lack of foresight forces these platforms to
    do value transfers to come up with new solutions for reporting problems. Although
    the lack of a smooth and efficient reporting process may cause severe taxation
    problems, it should be noted that Blockchain technology has broad prospects in
    alleviating the current reporting problems and significantly enhancing the reporting
    practices. The ongoing reporting process (such as transactions) can become trackable
    and irreversible by employing Blockchain technology.


