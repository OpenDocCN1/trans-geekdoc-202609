    # 5.3 PROPOSED SYSTEM


    This section presents the design and fabrication of the proposed IoT-based smart
    home automation system using a wireless fidelity shield. In addition, various
    hardware and software components required for building the system are presented.


    # 5.3.1 Hardware Requirements


    The hardware components required for the proposed systems are Arduino Uno R3 (microcontroller)
    and REES52 Optocoupler (relay module). The system also requires ESP-01 8266 (Wireless
    Fidelity shield) for establishing communication with an Android smartphone. The
    following contains the details of the various hardware components required for
    building the smart home automation system.


    **Arduino Uno R3**: The Arduino Uno R3 is a microcontroller designed by Arduino.
    It is an open-source microcontroller board and is the most-recommended board for
    getting started with this type of a smart home system. Even though Arduino is
    the official maker of the'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'board, other manufacturers also build this board and sell it at a lower price
    than the original maker. The Uno board comes with a USB port, which is used for
    connecting with a computer and for uploading cod-ing (sketches) from the Arduino
    IDE. In the hardware part of the proposed system, Arduino plays a crucial role,
    as it is responsible for powering up not only the ESP-01 8266 Wi-Fi module but
    also the relay module. Moreover, the ESP-01 8266 lacks a direct communica-tion
    port with a computer, hence a connection must be made via the Arduino UNO R3 for
    uploading the program in the ESP-01 8266.


    # **ESP-01:**


    The ESP-01 8266 Wi-Fi module is a low-cost microchip having full TCP/IP stack
    support and has the capability of a microcontroller. Generally used for connecting
    microcontrollers to the internet, this Wi-Fi module can be programmed to connect
    to a Wi-Fi access point or even to act like one. In this particular system, the
    ESP-01 8266 is programmed to connect with the available internet access point
    (router, smartphone), and once connected with an access point. One can control
    the appliances connected to the system in their homes. The ESP-01 requires 3.3
    V to run, which is supplied to it from the Arduino Uno R3 board. As shown in Figure
    5.1, the ESP-01''s TX and RX pins are connected to Arduino''s TX and RX for communicating
    with the computer. The general-purpose input output (GPIO) pins are connected
    to the input pins of the relay module.


    # **REES52 Optocoupler:**


    The last component needed is the REES52 Optocoupler relay unit module, which can
    be considered an on/off switch for various appliances, providing input usually
    by a micro-controller. Depending on the requirement, it is available with a two-,
    four-, or even eight-way relay unit. Similar to the ESP-01 8266, the


