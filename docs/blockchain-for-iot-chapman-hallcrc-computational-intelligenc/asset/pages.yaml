  md: 'the temperature and display it in an analog or digital signal. There are different
    types of sensors such as the ones for humidity, pressure, proximity, level, accelerometers,
    gyroscopes, and gas sensors. In agriculture, temperature sensors can monitor soil
    temperature, which is essential for effective crop growing.


    +   • Water Quality Sensors: Water sensors are used to recognize water quality
    and monitor ion content in water circulation. Water sensors include chlorine residual
    sensor, total organic carbon sensor, turbidity sensor, conductivity sensor, pH
    sensor, and oxygen-reduction potential sensor.


    +   • Other sensors used crops production include humidity sensors, motion detection
    sensors (to prevent theft), image sensors to compare the same crops at different
    time periods to detect disease, and smoke detectors to prevent fires.


    +   • ZigBee: Zigbee is a wireless sensor network that has low energy, low data
    rate, low expense, and short-term suspension features. It is easy to deploy and
    extend. It provides strong protection and long-term data authenticity. Zigbee
    has mesh network nodes that use the transportation assistance of IEEE 802.15.4.
    Zigbee has logical device types such as coordinators, routers, end devices, and
    access nodes.


    +   • LoRaWAN: This is a low-power wide area network that works on a low data
    rate. Variations of this technology include several standard networks such as
    LoRaWAN, SigFox, NB-IoT, and Weightless. It allows monitoring of facilities such
    as a warehouse in real time. It has a strong security mechanism from the device
    to the applications. LoRaWAN uses a star topology network standard, which as open-access
    protocol that works on top of a LoRa physical layer. Figure 10.2 shows the mesh
    topology architecture of LoRaWANused to broadcast data.


    Figure 10.2 shows that LoRaWAN can be used on multiple platforms such as indoors
    for warehousing and retail monitoring and outdoors in the farming fields for crops
    production monitoring. These platforms are interconnected with each other via
    the LoRaWAN gateway and transmit all data to a central gateway, which is an IP-based
    network. From this gateway, users access all event information through a LoRaWAN
    application.'
