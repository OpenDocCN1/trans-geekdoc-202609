  md: 'As the IoT devices are connected over the internet, they are accessible from
    anywhere in the world. This gives rise to the issue of authenticity and integrity
    of the data being transmitted by the connected IoT devices. Because of the resource-constrained
    nature of the IoT devices, traditional security mechanisms are not suitable, as
    they require more resources [5]. Moreover, due to the prominent challenges of
    IoT networks such as reliability, availability, scalability, and interoperability,
    it becomes a challenging task to provide a global optimal solution for the security
    of the data.


    # 8.1.1 Motivation


    The transmission of data from the IoT gateway node to the cloud infrastructure
    can be vulnerable to intruders. As discussed earlier, due to the resource-constrained
    nature of IoT devices, it is not feasible to host security applications directly
    with the IoT devices [6]. The SDN controller is powerful and has the capability
    to host the necessary security mechanism. The SDN controller and the IoT gateway
    device [7] can be configured to limit the unauthorized third party’s access to
    data.


    Blockchain was introduced as a scalable security solution for the IoT network.
    Blockchain is a distributed ledger technology (DLT) that enables distributed computing
    facilities with storage, authenticity, and integrity of different transactions
    made in the network [8]. Furthermore, incorporating Blockchain with distributed
    SDN controllers can significantly increase the security of IoT networks [9].


    Machine learning algorithms have proved to be an adequate measure that can enhance
    the security level of IoT data through proper validation of data using variously
    supervised and unsupervised learning approaches [10]. Based on the type of attacks,
    counterdefense policies can be designed for the IoT system, and the intruder can
    be detected at the early stage [11]. Reinforcement learning in IoT [12] is one
    such approach that monitors the environment continuously and generates feedback.
    Based on the feedback, it can make decisions of how to deal with the associated
    challenge.


    The volume of data generated by IoT systems is inherently high, and maintenance
    of this volume becomes a challenging task [13]. To overcome this issue, deep learning
    has shown promising results, which ensures proper validation of data by incorporating
    testing and training models [14]. The deep learning application can be hosted
    at the cloud layer where the required amount of resources can be provided for
    further processing.'
