    # (v) System for Managing Certificates (CMS)


    Certificates are released, renewed, suspended permanently/temporarily, or withdrawn
    using the CMS. CMS often does not revoke certificates, as they might be required
    to prove its eminence at some place in the future (e.g., legal issues). To be
    able to monitor their responsibilities, a CA and its related RA run certificate
    management systems.


    With large networks and global communications criteria, having a single trustworthy
    CA in which each requesting user receives a certificate is practically impossible.
    Moreover, if only one CA is accessible, it can cause problems if that CA is compromised.
    The method of guaranteeing the certificate chain is legitimate, appropriately
    signed, and reliable is known as certificate chain verification. The protocol
    that follows verifies the certificate chain, starting with a certificate that
    is provided for authentication. Clients’ certificate is supplied to the chain
    of certificates as when the clients are validated and is forwarded to the root
    of the authority. The provider public key, which can be found in its certificate,
    is used by the verifier to verify the certificate. It is found next to the client’s
    certificate in the certificate chain. If the verifier trusts that the providers’
    certificate is signed by an appropriate authority, verification is complete and
    the process ends here. Alternatively, the providers’ certificate is validated
    in the same way as the client’s certificate was verified in the preceding measures.
    This procedure is further continued until finding a trustworthy CA in the middle,
    or until root CA is found.


