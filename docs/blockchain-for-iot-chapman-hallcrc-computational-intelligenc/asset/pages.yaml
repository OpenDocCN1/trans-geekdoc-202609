    # 2.2 OVERVIEW OF BLOCKCHAIN TECHNOLOGY


    Blockchain technology (BCT) saw potential disruptions to the existing system as
    the applications and transactions, which required trusted third parties or a centralized
    system, could now operate securely in a distributed decentralized peer-to-peer
    (P2P) network. The fundamental basis for Blockchain architecture offers key features
    such as traceability, transparency, security, integrity, and trust in the system.
    BCT paved a new path and standard for other technologies to compete against and
    meet those requirements to satisfy their stakeholders. It works as a P2P-enabled
    network to communicate using cryptographic algorithms. With no centralized node,
    Blockchain technology enables users to store data in a decentralized system using
    distributed ledgers. Bitcoin, Ethereum, Stellar, Hyperledger, etc. are some of
    the popular Blockchain implementations that provide an insight to the potential
    of its disruptive technology.


    # 2.2.1 Architecture


    Current popular databases are based on a client/server architecture, a centralized
    access control system. The client plays the role of receiving nodes, and the server
    maintains the central authority in a distributed system. This was shaped to meet
    the traditional human–machine interaction.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Meanwhile, Blockchain is founded on a decentralized system, where each node
    in the network communicates on a P2P protocol. Blockchain technology, as the name
    suggests, is a sequence-chain of blocks that store transaction records, digitally
    and tamper-proof. This is achieved via the concept of a Merkle Tree or Hash Tree;
    it is a tree-based data structure that maintains data integrity and synchronization
    for a distributed network by exploiting the hash functions. A cryptography hash
    (digest) acts as a digital signature due to its uniqueness in terms of text or
    data. A hash function is a method that ensures the immutability of data as it
    maps a unique output for a specific input; the input cannot be derived from its
    output. This is further enhanced by using hexadecimal for maturing the SHA-256
    bit (Secured Hash Algorithm) cryptography function. It produces a unique signature
    and plays a key role in the data integrity for BCT.


    A typical Blockchain structure is illustrated in Figure 2.1. The initial block
    is referred to as the Genesis block. Each block comprises two parts: a block header
    and a block body. The block header will store information about the block; it
    stores the block version, the root hash, a time stamp, n-Bits, hash of the previous
    block, and Nonce value that is added or encrypted with the hash value to add another
    layer of security. The block body stores information about the transactions. A
    transaction in Blockchain refers to an event triggered by the participant. The
    transaction data stores the root hash of the Merkle Tree. Each transaction is
    denoted as Tx as illustrated in [13]. When a new transaction is appended to the
    existing chain, validation of the transaction is first computed and competed among
    the participants (miners) by following an accepted


    ![](img/73e16681f7c79384b117f947ee8dd11a_45_0.png)


    # FIGURE 2.1 Architecture of a Blockchain model.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'consensus algorithm to maintain the integrity of the chain. Forks are multiple
    chains created at close moments; this is resolved by selecting the latest block
    for the longest valid chain. The blocks in the shorter chains are referred to
    as orphan blocks.


    # 2.2.2 Consensus Algorithm


    The consensus algorithm is inspired by the Byzantine General Problem (specifically
    for Bitcoin) [13], which considered an army commander preparing to launch an attack
    on a large enemy base. As the area to be covered was very large, the general was
    faced with a dilemma of informing the entirety of his army about the plan to attack
    without compromising the secrecy of the order. The reason for his hesitancy was
    the fact that the message could be intercepted by his enemy or one of his own
    soldiers could betray him by leaking the message. A consensus for his action had
    to be achieved. In such a distributed environment, it raised many challenges that
    could similarly be mapped with the Blockchain distributed network.


    The following are the most commonly adopted solutions mentioned in [14]:


    PoW (Proof of Work): As described in detail in [15], a PoW is achieved by solving
    a puzzle and calculating its value. All the participant nodes compete to calculate
    this unique hash value within a time period. The nonce located at the block header
    of the latest block is frequently changed so when a node computes the desired
    value and claims first, it is validated by all the other participants. Once verified,
    a new block is coined to be ‘mined’ and added to the chain.


    PoS(Proof of Stake): From [14], this is another approach to PoW. PoS was introduced
    to further the cause of consensus as a more reliable approach. In the case of
    PoS, the participant nodes must prove the ownership of their stake (proportion
    of currency in use). A node is randomly selected as a validator in terms of its
    stake. The most important feature of PoS is that it consumes less energy compared
    to PoW. This is further explained in [14] to overcome its fairness.


    PBFT (Practical Byzantine Fault Tolerance): Introduced to tolerate Byzantine faults.
    It can only handle one-third of the replicas. It mandates the publicity of all
    the participant nodes in the system. Hyperledger Fabric takes advantage of this
    algorithm. It requires validation from at least two-thirds of all the nodes to
    enter a new phase (Three phases: pre-prepared, prepared, and commit).'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'DPoS (Delegated Proof of Stake): Mentioned in [14], and as the name suggests,
    DPoS is a result of a democratic policy where stakeholders in the network nominate
    their delegates to act as validators and miners. This significantly reduces the
    number of participants and provides a contingency plan for any selfish approaches,
    as the delegates can be removed at any time.


    Ripple: A recent development [14], it shifts to a subsystem of trusted nodes from
    a general network. Nodes that are involved in the consensus process are termed
    servers, and the clients are the nodes involved in transacting funds. The servers
    maintain their own unique node list (UNL) to keep a check by mandating at least
    80% approval from the UNL.


    # 2.2.3 Digital Signature


    A digital signature is like a unique fingerprint that is used to identify the
    credentials of a user. This is achieved by cryptography functions. The most commonly
    used algorithm in the Blockchain is the elliptic curve digital signature algorithm
    (ECDSA) mentioned in [16]. ECDSA creates key pairs for the signing and verification
    phase of a digitally signed transaction.


    # 2.2.4 Mining


    Miners is the term used for participants in the network that compete to calculate
    the hash values in Blockchain, and the process is called mining. Analysis of mining
    plays a key role in incentivizing the dynamic of a Blockchain model. Various research
    is conducted in game theory-based solutions to better analyze and predict mining
    behaviors and provide optimal reaction strategies. As per definition, game theory
    is a study of mathematical models of strategic interaction between rational decision-makers.
    It is used to analyze the various games strategies of the consensus nodes and
    their interactions to optimize the mining (Nash’s Equilibrium, etc.). It can also
    be utilized to develop incentive mechanisms that discourage the nodes from executing
    misbehavior or launching attacks.


    # 2.2.5 Smart Contracts


    Introduced by Szabo [17], a smart contract is a digital contract that gets bound
    within a system. They are automatically executed when the conditions are met,
    reducing time and the need for a mediator. Hence, smart contracts play a big role
    in verifying and enforcing conditions in a Blockchain as required. Proposals and
    various other approaches have been identified in [18] (Figure 2.2).'
