    developed in this way so that monitoring can be in real time on the farming field,
    at the warehouse, and at the retail store. Sensors used include temperature (infrared
    thermometer’s sensors), soil (volumetric sensors, tensiometers), humidity (capacitive,
    resistive), light (phototransistor), fire alarm, etc. The IoT network for wireless
    information transmission is IEEE 802.15.4 (Zigbee) long-range wireless area network
    (LoRaWAN) [38]. By using these IoT devices all data are received and organized
    before it is saved and stored.


    +   • Temperature Sensors: Temperature sensors are used to estimate the volume
    of heat pressure and coldness produced by any object or operation. It can sense
