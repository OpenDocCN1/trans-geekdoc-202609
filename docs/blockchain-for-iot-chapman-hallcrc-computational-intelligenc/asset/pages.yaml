- pgno: 165
  md: '# 7.4 APPLICATION OF ARTIFICIAL INTELLIGENCE IN LAW


    Lawyers are already using artificial intelligence (AI) [7], such as reviewing
    legal documents during litigation and due diligence, reviewing contracts that
    meet specified standards, conducting legal research, and predicting the outcome
    of cases.


    # 7.4.1 Review of Documents


    Reviewing the files to be litigated involves the task of finding related files,
    for example, documents with certain keywords or e-mails on a specific subject.
    The performance of a legal document analysis is greatly improved by AI. For example,
    if a lawyer who uses software with AI technology to review documents marks certain
    documents as relevant, AI will know which documents are relevant and will be trained
    accordingly. This allows AI to more accurately identify other related documents.
    This technique is referred to as predictive coding. Predictive coding has many
    advantages over traditional document analysis. They are:


    +   • Reduce the number of irrelevant documents that lawyers must review.


    +   • Produce statistically verifiable results that are at least more accurate
    than manual verification.


    +   • Much faster than manual verification.


    # 7.4.2 Contract Analysis


    Customers need to analyze contracts in batches and individually. For instance,
    analyzing all the contracts that the corporation has hired can reveal risks, irregularities,
    future fiscal responsibilities, renewal and expiration dates, etc. This can be
    a slow, costly, time-consuming, and error-prone process (considering that contracts
    are not signed in a robust contract management system). The lawyer checks the
    contract every day, makes comments and revisions, and advises the client to sign
    the contract as it is or try to negotiate better terms. These contracts can be
    simple (such as NDA) or complicated. The number of contracts to study may create
    a bottleneck and delay transactions (and related revenue). Inexperienced legal
    professionals may miss some key matters, which may trouble their clients again
    in the future. Artificial intelligence can help review contracts, regardless of
    extent and complexity.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'Since June 2017, JPMorgan Chase [8] has been using the AI-driven COIN process
    to interpret commercial credit agreements. This work when done manually took 360,000
    hours; using AI it can be accomplished in few seconds. The bank also plans to
    use the technology for other types of legal documents. AI platforms such as Kira
    Systems [9] enable legal professionals to recognize, excerpt, and scrutinize commercial
    facts found in huge volumes of contract data. Contract summary sheets are created
    from those business facts to proceed with mergers and acquisitions. LawGeex [10]
    uses AI to analyze contracts one by one in the daily workflow of lawyers. For
    example, a provision in California law may be acceptable but the one in Genoa
    law may not. Then, when someone uploads the contract, AI will scan and determine
    the existing and nonexistent items. The corresponding language is highlighted
    according to the preset customer standards and marked with a green thumb up or
    a red thumb down. Company’s lawyers use LawGeex to classify the standard agreements,
    such as a non-disclosure agreement. Contracts that meet the specified conditions
    can be preapproved and signed. Documents that do not meet those conditions are
    sent to the legal department for further review.


    # 7.5 LEGALTECH – NATURAL LANGUAGE PROCESSING FOR LEGAL TEXT ANALYTICS


    The legal linguistic should be understood from the broadest perspective: written
    and spoken language, legal texts, and regulatory texts such as decrees and regulations.
    Since linguistic and law are inextricably linked, novel natural language processing
    (NLP) legal methods are required to understand linguistic and legal dissertation,
    to develop tools that can use legal resources for legal applications and transparency
    via the internet to support interoperable legal systems. LegalTech [11–13] generally
    refers to computer technology used in various fields of legal practice and resources.
    An extensive range of applications exist to assist law companies and organizations
    in carrying out daily activities related to document support, and all procedures
    (legal research and document automation/compilation) and, in general, all operational
    aspects are associated with the dematerialization of text-based legal services
    to digital forms. Some of these areas are texts/documents, linguistic oriented,
    and directly related to legal NLP.


    Therefore, language processing is essential for solving the problems and achieving
    goals in LegalTech. Since these tasks and goals have been solved and commercialization
    has been achieved, it can be said that the application of existing technologies
    is within reach (clearly defined text problem).'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'There are excellent legal information service providers, such as Thomson Reuters/Oracle,
    law organisations (such as Pinset Masons/Riverview Law), and many start-ups covering
    a wide range of topics. However, the goal of the NLP research community is to
    use this ability to recognize and solve complex text problems. Some of them are
    listed below.


    NLP technology was first used to assist in the creation of legal documents. In
    the decision tree modeling, the document template (contract) is automatically
    improved and generated based on the author''s local decision. This method uses
    fairly simple NLP technology to deliver the contract. NLP is used in large-scale
    legal document analysis, for example, the identification of contractual relationships
    that can be accessed through a collection of documents, such as global oil and
    gas concessions. Conventionally, law colleges, law firms, and lawmaking committees
    have formulated strategies that describe the interior structure and components
    of legal documents and how precise legal terms should be used to clarify rules
    and formulate decisions. In this case, NLP assists writing by governing the construction
    of the document, the extent of the sentence, and the usage of suggested terms.
    A more complex issue involves the regulation of legality/validity and uniformity
    of legal resources. Legal documents can be very long, are regularly updated, and
    are part of a huge legal system that needs to be explained and further developed
    based on various social and political factors. Legal entities must ensure reliability
    and use of latest terminology, monitor the compatibility and consistent development
    of norms from different jurisdictions, and verify the legitimacy of information
    sources and decisions/judgments related to genuine norms. In addition to a rough
    analysis, these comments also include a profound understanding of legal texts
    and reasoning. LegalDocML and LegalRuleML are one of the standards for the structure/semantic
    rules of legal documents.


    Given the many laws and decisions passed by modern societies over the years, including
    economic, social, and political issues at the local and global levels, obtaining
    information is also a major challenge. To rebuild a house, it is good to have
    knowledge about the regulations in the respective area (employers should understand
    appropriate labor laws and the trade that is administered by global treaties/agreements).
    It should be possible to extract relevant texts and laws and regulations for specific
    cases. Most countries/regions have official websites dealing with information
    on laws and regulations. However, advanced search and semantic technologies are
    required to ensure the release, interoperability, and accessibility of these resources.
    There is also a need for more detailed metadata (electronic date,'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'jurisdiction, legal issues, keywords, etc.) and detailed search/navigation
    software.


    Retrieving and linking information is used to aid decision-making, logical reasoning,
    and compliance. According to laws and regulations, lawyers should be able to determine
    whether a particular act is legal or safe, what is the legal definition derived
    from the information provided, or what their responsibilities are. For example,
    multimedia cannot be handled/used without acquiring the various permissions attached
    to the project, and these permissions are usually encoded in different contracts.
    To ensure legal certainty, it is necessary to use tools to analyze legal documents,
    extract and formalize rules related to each content type, prove the rationality
    of the rules applicable to specific business processes, and confirm that the operation
    meets legal requirements and security protocols.


    In addition to arguing about a specific set of legal documents, the interpretation
    or application of the law may also cause controversy. Arguments are usually based
    on legal considerations and judgments: someone wants to verify the arguments and
    propositions presented, and propose new arguments for and against to support reasoning.
    NLP technology needs to extract, collect, and link arguments from legitimate sources.
    The ultimate goal is to help lawyers develop, understand, and control arguments
    and support legal thinking.


    Tools are also needed to provision related law, which is essential for cooperating
    with the law on a global scale. Here, it is important to fully understand the
    text, excerpt/cut and model the rules, and then consider these rules to check
    their consistency and identify errors. In addition, these transactions must be
    widely applicable to different legal systems, and their terms and concepts should
    be interrelated or consistent in all jurisdictions. Formal sources available to
    legal professionals and citizens and governments pose a huge challenge to NLP
    in terms of document development, information retrieval, knowledge representation
    and verification, and overall decision support.


    # 7.5.1 Areas of Challenges for NLP


    NLP itself is a developed field of artificial intelligence. It has many well-known
    rules-based or machine learning methods, as well as methods for separating sentences,
    symbolizing text, basic words, specifying words using part of the language, analyzing
    sentences, and enriching content. However, the content applicable to news or narrative
    texts does not apply to the corpus of legal language. Most legal resources are
    in text form:'
