    +   - The tremendous distribution makes information extraordinarily secure, dependable
    and reliable.

    +   - Validated information is almost indisputable.


    # 7.2.1 Smart Contracts


    The Blockchain impact of the legal industry is seen in various ways, from resolving
    Blockchain issues for clients to changing the distribution of legal services.
    Smart contracts (also called self-executing contracts) convert contracts into
    code that is saved, copied, and regulated by a Blockchain network. Traditionally,
    contract drafting requires clients to visit a law firm to discuss, negotiate,
    and execute agreements between respective lawyers, but smart contracts are considered
    to be a more time-saving and easier option. Using smart contracts, when a bitcoin
    is appended to the ledger, all the other required information is automatically
    added by the ledger. It not only defines the terms and results of the contract
    but also automatically executes the contract. In addition, Blockchain is a software
    technology that automates certain processes. This is where the popular smart contracts
    come into play. Smart contracts are software that resides on and cooperates with
    the Blockchain. The basic concept is that when a piece of particular input information
    fulfills the predefined conditions, certain consequences will be triggered based
    on algorithms (results), and these “if-then” relationships are smart contracts.
    Some people believe that this is non–legally binding because the parties in the
    contract agree that when one party performs a certain activity, the other party
    has to do other things. This analogy is doubtful because contracts are much more
    complicated. Both parties agree that they are not necessarily incomplete, and
    implicit exclusions can be applied in good faith. However, no matter how detailed
    the contract is, due diligence is not a concept that computers can use. Computer
    scientist Alan Turing said that computer programming languages can simulate or
    calculate any content word scenario that is limited only by available computing
    power.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# 7.2.2 Legal Registries


    Usually the main thing that comes to mind when considering registries are those
    that store status, identity, or rights of someone or a legal entity, particularly
    industrial registers, land registers, civil registers, inheritance registers,
    and patent or trademark registers. Second, if blockchains are stable/secure and
    permit the registration of information, they may be used for securing proof that
    may be offered in courtroom docket proceedings. Examples are the screenshots of
    websites, digitized content, and course contracts. It must be noted that usually,
    the document itself is no longer saved at the Blockchain, but only a cryptographic
    hash value is stored. The capability to replicate the same hash as the one saved
    at the Blockchain proves that the original document has not been modified and
    thus is authentic.


    # 7.2.3 Chain of Custody


    The high reliability of Blockchain makes it extremely useful for building the
    chain of custody. With the help of Blockchain, lawyers can track the digital movement
    of permanently kept documents without worrying about their being altered or deleted.
    It can also be used to digitally tag physical objects. GPS tracking used to record
    every step will create irrefutable evidence for the legal cases. Blockchain affects
    various industries that require frequent consultation and reputation from a law
    firm. These innovations provide progressive law firms with new prospects to provide
    needed help in new areas of law. Using this, a legal professional can create a
    successful career on their own. According to law firms, maintaining the evidence
    retention chain is very difficult, but handling evidence is even more difficult.
    The virtual registry can be used not only to track the storage of documents but
    also to save documents in a very stable/safe location. Everything is documented
    in sequential order with a time stamp. This means that no records can be changed
    or deleted. No data will be lost and no testimony is required to ensure the safety
    of the chain.


    # 7.2.4 Property Rights


    The establishment of property rights can be very difficult, and disputes are quite
    common. Most records are kept in printed copies along with streams of books, journals,
    and similar documents, usually dating back decades. The scanned originals are
    archived in a database that the organization believes best suits its needs. It
    will take a lot of time to search in documents that are poorly archived, or records
    that conflict with each other.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Blockchain provides a secure, chronological, and unchanging way to store this
    data. This greatly simplifies the process of determining property history. All
    interested parties can also use the same information, thereby reducing confusion
    and making dispute resolution easier.


    # 7.2.5 Intellectual Property


    The digital age has brought huge intellectual property (IP) challenges, especially
    in terms of protecting the rights of affected people. All internet users believe
    that everything related to their interests should be provided for free, and the
    law has no solution for this issue. Illegal transfer or other use of images, audio
    and video files, icons, and other copyrighted materials available on the internet
    without permission or from compensation to their creators is rampant. Blockchain
    offers a way out of this conundrum by providing a publicly viewable copyright
    record. Anyone can track who viewed or downloaded related content. Artists can
    have better control over who is viewing or using their IP. Smart contracts also
    provide a seamless and instant system to pay for the use of materials so that
    creators can better protect their rights. For example, nonpayment can automatically
    trigger a necessary legal suit/action. The use of Blockchain can also eliminate
    the confusion about who owns the digital asset, making it difficult to be hacked,
    which also means that lawyers can quickly verify proof of ownership.


    # 7.2.6 Financial Transactions


    The unstoppable growth of cryptocurrency and online commerce supported by Blockchain
    technology will increasingly affect the legal profession. As more people use crypto-assets
    for financial transactions, they become more and more popular, and many lawyers
    find that they have to deal with them in day-to-day transactions. Banks, though
    not universally accepting or dealing with cryptocurrencies, have become more crypto-friendly
    and steadily enable transactions. As consumer demand increases, banks will try
    to adapt to crypto-assets further. Given the current dirth of regulations and
    legislation on the subject of crypto transactions, any lawyer has a lot of work
    to do to guide a bank in this rapidly changing environment. Many other novel legal
    services are associated with crypto-currencies. For example, at the time of death,
    for fair distribution, lawyers must use crypto-assets that are stored in the Blockchain.
    Divorce lawyers need to find hidden assets through the system to ensure that their
    clients get what they are legally entitled to. Governments around the globe are
    looking for different ways to better integrate/regulate cryptocurrencies.'
