    # 2.1 INTRODUCTION


    As of 2021, the world required innovative solutions to tackle the fast-growing
    economy and its insatiable demand for technology that will satisfy the society’s
    needs in terms of security, privacy, speed, functionalities, data management,
    and much more. This was evident during the COVID-19 pandemic that continues to
    drive the economy and its people to perform and deliver better to fight against
    time and money. From the front-line industries such as the healthcare and supply
    chain, at times struggling to deliver the most needed resources like oxygen and
    life-saving medicines across states and countries, the need for more innovative
    solutions could not be underappreciated. With the growing need for better understanding
    and study of the systems that could help catapult the existing systems to exponentially
    increase its performance, Blockchain technology (BCT) for the Internet of Things
    (IoT) represents an innovative solution that has proven to play a revolutionary
    role in evolving the existing system in various sectors (healthcare [1], supply
    chain [2], smart cities and homes [3, 4]). With data playing the role of a shadow
    currency for the current economy, BCT cannot be overemphasized in its key role
    as a game changer.


    BCT has captivated the world ever since its first introduction by Satoshi Nakamoto
    in 2008, mainly due to its immutable distributed digital ledger, for a decentralized
    trust that provided the world a moment of escape for the economy to be run without
    the interference of any central authority, government, or requirement for any
    Trusted Third Parties (TTP). Although BCT has its fair share of the spotlight
    in the market, there are many other problems yet to be discussed: the cumbersome
    load of large transactions,'
  merge: -1
