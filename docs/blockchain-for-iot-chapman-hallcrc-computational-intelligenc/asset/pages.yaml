    # 3.1.2 Device Identity Management


    Device identity management seeks to increase and retain confidence in a device’s
    identity as it communicates with other computers, apps, clouds, and access points.
    Industrial control systems [3], connected consumer healthcare, automotive ECUs
    (Engine Control Units), surveillance cameras, home security systems, smart phones,
    and smart appliances are examples of IoT devices that may require authentication
    and authorization. While linking to a server, each IoT device requires a unique
    identifier to prohibit fraudsters from acquiring access to the device. This is
    done by associating an identity with a secret key generation algorithm that is
    unique to each IoT unit. The device chooses the secret key at random using elliptic
    curve cryptography (ECC) [4] so as to provide high-level security, and the corresponding
    device uses the generator G point of elliptic curve, which is repeated a number
    of times, thus generating a distinct public key. Provided just a public key, finding
    the hidden key pair within polynomial time is nearly impossible, as it is based
    on the elliptic-curve discrete logarithm (ECDLP) [5] computation, which is non-polynomial.
    As the hash functions are irreversible, they can be used to generate address,
    and so it is impossible to get the public key based on the address. The registration
    ID is generated by the trusted platform module (TPM) for TPM-based implementations.
    An internationally trusted Certificate Authority (CA)produces the registration
    ID for X.509 certificates. Device identity management strategies are in charge
    of identifying and managing the privileges or credentials used by devices during
    their entire lifespan.


    The X.509 protocol is focused on the certificate chain of trust model and provides
    the most reliable digital identity authentication method. Using X.509 certificates
    as an authentication mechanism is a great way to increase efficiency and make
    equipment distribution easier. Moreover, due to the technical challenges involved,
    X.509 certificate lifecycle management can be difficult and costly, contributing
    to the total solution expense.'
