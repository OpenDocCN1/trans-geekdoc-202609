    # 9.4 SOLUTIONS FOR P2P TRADING


    The DISCOM (or a service provider) can promote local generation of solar energy
    by lending money to customers to create RTPV infrastructure under the operational
    expenditure (OPEX) or capital expenditure (CAPEX) model and creating an end-to-end,
    tamper-proof centralized P2P trading and settlement system for commercial settlement
    of locally generated energy. IoT-enabled devices such as smart meters are an imperative
    in enabling a seamless functioning of P2P transactions and integration with existing
    utility systems. In order to roll out such a system, the following things are
    necessary:


    +   a) Software platform for commercial settlement – metering, billing, collection
    (MBC)


    +   b) Established value chain for solar installations


    +   c) Digitalization: along with the physical layer of P2P electricity trading
    (e.g., minigrids, microgrids, distribution networks, etc.), a virtual or digital
    layer is required for this business model. An aspect of it is an energy management
    system (EMS) on the platforms that enable many peers to connect and facilitate
    P2P trading. To ensure the power system''s efficiency, data from both producers
