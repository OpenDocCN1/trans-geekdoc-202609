    # 5.1 INTRODUCTION


    Technology is responsible for making our lives better and easier, and it keeps
    changing as our needs change. One of the prominent examples of technology is a
    smartphone, which has become a practically inseparable component of our daily
    life [1]. Embedded systems have also gained immense popularity and have been used
    as key components behind the evolution of smart appliances. IoT is a gift when
    every device in our home and/or workplace is connected to the internet, making
    our daily activities easier to perform than ever before. At present, smart automated
    appliances and systems are making their presence felt in the technological market.
    Also, people are recently investing more to build smart homes and offices [2].


    In addition to managing these systems, some companies are also trying to focus
    on Artificial Intelligent (AI)-controlled smart home automation systems, thereby
    releasing humans from direct interaction with their appliance es. However, the
    AI deployed in such systems at present is not able to do all the activities, and
    the cost of such a system is still very high [3]. Interacting with an existing
    smart home interface requires considerable technical know-how, however, which
    is clearly a significant obstacle for a person who does not possess such knowledge—which
    includes the majority of older persons, who have no “inherent” familiarity with
    modern electronics that the younger generations possess [4]. Therefore, the proposed
    system focuses not only on providing a low-cost smart home automation system but
    also on making it easy to use via an Android-based application.


    This chapter proposes an IoT-based smart home automation system using a wireless
    fidelity (Wi-Fi) shield and an Arduino microcontroller. The aim of the proposed
    system is to provide users with an interface that allows controlling all the household
    electrical appliances (lights, fans, faucets, air conditioning) installed in homes
    with a relative ease of use and cost efficiently. To build the system requires
    an Android smartphone, a microcontroller (Arduino Uno R3), a Wi-Fi module (ESP-01
    8266), a relay module, and a power supply responsible for powering the devices.
    The system is intended to be easily used by persons with only basic familiarity
    with modern electronic devices, of which older people represent the majority.


    The chapter is organized as follows. Section 5.2 reviews the existing literature
    on the subject. Section 5.3 presents the proposed system with'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'hardware and software requirements. Section 5.4 presents results and discussions.
    Finally, the chapter concludes with future research directions in Section 5.5.


