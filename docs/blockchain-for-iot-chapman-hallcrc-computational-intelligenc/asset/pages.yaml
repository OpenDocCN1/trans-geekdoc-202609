    # 3.1.4 Need for Device Authentication


    A perfect robust device authentication is necessary to guarantee that all devices
    connected to a distributed IoT network are trustworthy. As a result, every device
    in the network has its distinct identity, which is verified when those devices
    are connected to the central server or access point of the distributed systems.
    A network administrator can monitor each computer with its unique identity during
    its development process, interact safely, and avoid performing harmful processes.
    Network admins can simply terminate a device''s permissions if it demonstrates
    unusual conduct. A powerful authentication is required to safeguard devices and
    sensors associated with the IoT network being accessed by users who are not authorized
    to do so. IoT devices rely heavily on Blockchain technology [9] for management,
    control, and, most importantly, security. Blockchain has the potential to be a
    key enabler in delivering viable security solutions to increasingly complex IoT
    security issues.


