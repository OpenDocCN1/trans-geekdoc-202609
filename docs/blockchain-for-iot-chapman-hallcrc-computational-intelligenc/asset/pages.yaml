    # 5.5 CONCLUSION AND FUTURE DIRECTION


    The chapter proposed an IoT-based smart home automation system using

    a wireless fidelity shield and an Arduino microcontroller that can con-

    vert an ordinary home into a smart home. The system is customizable

    and thus can be extended by adding sensors, a monitor screen, and other

    related devices. The aim of the chapter is to show how to build a low-cost

    smart home automation system. The system demonstrated how IoT-based

    smart home automation can improve the standard of living. The proposed

    system can save energy and helps older and disabled people control their

    household appliances without physical movement using a simple, user-

    friendly interface on their smartphone. Moreover, the system installation

    process is a one-time process that does not require any modification. The

    only thing required is to set up the connection of the appliances.


    The future work includes replacement of the existing ESP-01 and

    Arduino Uno R3 with ESP NodeMCU microcontroller and integrating

    sensors with the existing devices. The future work also includes adding

    security features with alert capabilities with the systems.


