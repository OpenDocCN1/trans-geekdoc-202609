- pgno: 9
  md: '# Preface


    In today''s world, Internet of Things (IoT) industries from various geographical
    positions communicate via several organizational contracts. This is nothing but
    a formal agreement depending on mutual trust between participating industries.
    The Blockchain platform establishes this trust with the help of technology. Thus
    there is a fundamental difference between existing communication and communication
    through Blockchain technology. One of the key goals of this work is to showcase
    Blockchain as a platform for transparent and real-time information interchange
    between the participants. Moreover, computational intelligence-enabled features
    are incorporated with the existing properties of Blockchain and IoT systems for
    better utilization of the platform.


    This volume aims to introduce the basic concepts of Blockchain technology and
    its applications to varied domains to the intended readers. The book also intends
    to introduce intelligent Blockchain platforms by way of infusing elements of computational
    intelligence. Insights into real-life IoT applications would help the readers
    assimilate the concepts with ease. The volume comprises nine contributory chapters
    in addition to the introductory chapter to report the latest developments in this
    field.


    Blockchain is a decentralized or distributed platform for sharing information
    and computational capabilities. Records of transactions are duplicated among the
    participating workstations in the network, which coordinate and collaborate with
    each other. As such, any attempt to change the stored data requires access to
    all the workstations in the network, thereby ensuring higher secrecy and security
    of the underlying data. IoT refers to the connectivity of numerous physical objects
    or devices (either sensors or actuators) over the Internet to ascertain a densely
    connected network infrastructure capable of making decisions on its own. Thus,
    a huge amount of sensitive data needs to be processed and stored for further use
    in an IoT network. Given its robust security, Blockchain finds'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'widespread applications in several fields of applications ranging from science
    and engineering to medical and business applications, and the IoT is no exception
    in this regard. Chapter 1 introduces the fundamentals of Blockchain and the IoT
    with special reference to the synergy between the two in yielding a robust and
    secure distributed data-processing environment.


    Blockchain is one of the latest and rising technologies of the decade. When bitcoin
    and the idea of cryptocurrency were first introduced to the market in 2008, some
    saw the revolutionizing potential of Blockchain technology, the platform behind
    cryptocurrency. Blockchain technology helps businesses provide security to data
    and information, reduces costs by eliminating unnecessary middlemen, and delivers
    transparency and traceability. This ensures end-to-end synchronization, i.e.,
    having a perspective from the customer’s end. Blockchain is a public ledger that
    maintains records of all the transactions held on a Blockchain network while working
    in a distributed manner. It is a peer-to-peer (P2P) network that does not require
    any central authority. The global market for Blockchain technology is projected
    to reach US$30.7 billion by 2027, trailing a post-COVID-19 compound annual growth
    rate (CAGR) of 43% over the analysis period 2020 through 2027. IoT is another
    rapidly growing technology that has captured the attention of many enterprises
    by its ability to deliver a smart network of connected devices that can enhance
    the user’s experiences in interacting with a device. IoT is a growing industry
    and has been paving the way for the Industry 4.0 revolution. The limitations demonstrated
    by IoT in the real world have not deterred researchers and enterprises from finding
    solutions. One of the most anticipated upcoming solutions is the integration of
    Blockchain with IoT. Chapter 2 identifies various applications of IoT on the Blockchain
    platform and the associated challenges/benefits compared to the traditional system.
    The study aims to determine the challenges faced by the Blockchain technology
    with IoT as a technology and its possible solutions.


    At present, extensive implementation of IoT technologies is resulting in smarter
    devices with the rapid growth and widespread application. On the other hand, it
    has encountered some serious security concerns. Device and message validation
    in addition to verification using an authentic mechanism is crucial among the
    distributed nodes in the network to prevent access by unauthorized devices, among
    other security issues such as data privacy, attack resistance, and so on. Many
    IoT settings, on the other hand, are vulnerable to a node or device failure. To
    prevent single data'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'node failure and data tampering, Blockchain technology could be used to archive
    the distribution of attributes. A generalized Blockchain-based scheme has been
    explored in Chapter 3 that focuses on authentication and key management mechanisms
    using public-key cryptographic algorithms. An exhaustive analysis of integrating
    Blockchain with IoT authentication is reviewed to improve Blockchain-based IoT
    applications, highlighting its effects in a conventional distributed cloud.


    The IoT and Blockchain knowledge benefits the implementing organizations to enhance
    and optimize their optimization. These days, the IoT has drawn immense interest
    from scholars, scientists, and businesspeople because of its ability to offer
    inventive administrations across different applications. IoT flawlessly interconnects
    heterogeneous gadgets and objects to make an actual organization in which detecting,
    handling, and correspondence procedures are naturally organized and overseen without
    human intervention. Distinctive organization advances include cyber-physical systems
    (CPS), machine-to-machine (M2M), and wireless sensor networks (WSNs). As present-day
    technologies upscale, there is a need for us to push the legacy systems toward
    the convergence of IoT and Blockchain (IoTBC). Chapter 4 discusses some of the
    smart frameworks that have resulted from such convergence. The world today has
    completely accustomed itself to the existing legacy systems, making them difficult
    to replace. Thus, security concerns identifying with CPS, M2M, and WSN emerge
    in related fields, which require ensuring the safety of organization systems as
    a whole against assaults. The security part of the system could be easily handled
    with respect to the Blockchain technology. The IoTBC merger brings numerous benefits,
    and it is explained in reference to the simple voice calling system. Future systems
    such as smart healthcare, governance, and infrastructure also are discussed in
    detail. iGovernance is tied in with utilizing innovation to work with and support
    better preparation and navigation. It is tied in with working on just cycles and
    changing the manner in which public administration efforts are conveyed. The significant
    parts of medical services frameworks are distinguishing proof, area, detecting,
    and network. iHealthcare is carried out through a wide scope of frameworks: crisis
    administrations, brilliant processing, sensors, lab on chips, remote checking,
    wearable gadgets, availability gadgets, and large information. The IoT-based frameworks
    are furnished with body sensor networks inside telemedicine frameworks.


    In recent times, the smart home automation system is one of the fastest emerging
    IoT technologies because of the availability of remote access'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'facilities by using which one can control devices and improve the standard

    of living. In Chapter 5, an IoT-based smart home automation system using

    a wireless fidelity shield and Arduino microcontroller to control house-

    hold electrical appliances remotely is proposed. This system can help old-

    age and physically challenged people operate the conventional electrical

    switches fixed somewhere in the house. Moreover, the system can provide

    a comfortable and independent lifestyle with minimum cost.


    In previous studies on bitcoin, it is noted as a vision of a new decentral-

    ized economic system. Financial institutions are not included in solely

    peer-to-peer electronic cash transactions, with online payments sent

    directly from one individual to another. The practical applicability of this

    concept is discussed in Chapter 6, which presents a practical real-time

    study of a decentralized autonomous organization (DAO) automatically

    driven with full-proof transparency, integrity, and decentralization.

    Decentralization means that it is executed in the peer-to-peer format

    including nodes in the network for users, and it is fully transparent because

    the network is open in the public domain. All these characteristics are

    taken together in this chapter to form the milestones of trust-free transac-

    tions systems.


    The Blockchain has already modernized how digital assets are shared

    among users by providing an immutable trace of their transactions. The

    power of artificial intelligence (AI) and the Blockchain can help in reform-

    ing legal systems by ensuring reliable execution of legitimate contracts,

    reducing costs, and speeding up judicial conclusions. For example, a legal

    career involves the reading of several thousand legal texts that are important
    in deciding

    the outcome of a trial. Today, many automatic chatbots

    are designed with advanced natural language processing algorithms that

    can read these texts in minutes. Automation of guaranteed compliance of

    legal contracts is one of the vital tasks in the legal industry, which can be

    reliably implemented using smart contracts. Blockchain and AI can be

    effectively utilized in several areas to support the varying nature of legal

    work to facilitate novel business areas with multiple service offerings.

    Chapter 7 discusses the impact of Blockchain in various legal industry

    tasks such as intellectual property rights, chain of custody, individual

    property rights, and notary public verification. It also presents a practical

    scenario of judgment execution on Blockchain and explains various natural

    language processing techniques and their challenges in legal text

    analytics.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'An IoT network uses a limited number of resource-constrained devices for its
    application, which is not compatible with performing satisfactorily in the presence
    of dynamic changes in the network behavior. Due to the resource-constrained nature
    of IoT networks, the support for powerful high-end infrastructure is not feasible.
    Providing adequate security with limited resources becomes a challenging task
    for maintaining the authenticity and integrity of the data. To overcome the issue
    of data authenticity and integrity in IoT networks, the authors propose a software-defined
    network (SDN)-based agent for Blockchain-based IoT networks in Chapter 8. The
    proposed solution is an SDN-based IoT architecture that uses an agent powered
    by machine learning to sustain the rapid change and erroneous behavior of the
    IoT network. Compared to the current state-of-the-art approach, the proposed system
    will provide enhanced performance due to its agent-based adaptability feature
    that can work well with the dynamic changing behavior of the IoT network.


    Distributed generation, energy storage, and other IoT devices (such as smart meters)
    are working together to generate new opportunities for centralized control operations
    and energy markets. Blockchain provides businesses and IoT devices with a potential
    route to better navigate these changes by optimizing the use of ever-increasing
    volumes of energy data and providing organizations and individuals with new ways
    of transacting and building a trustworthy energy transaction management network
    without the need for a central authority. Chapter 9 provides a detailed illustration
    of the state-of-the-art IoT-enabled peer-to-peer (P2P) trading of rooftop solar
    (RTPV) power on a Blockchain platform in India. Using IoT-enabled smart meters,
    P2P trading systems provide a virtual platform where prosumers and consumers may
    trade electricity at a mutually agreed-upon price without the need for an intermediary.
    India Smart Grid Forum (ISGF), in collaboration with Power Ledger, has demonstrated
    two successful first-of-their-kind pilots in Southeast Asia in India. The first
    pilot project in Lucknow, Uttar Pradesh, went live in December 2020 with 12 participants,
    and Tata Power Delhi Distribution Ltd. (TPDDL) went live in January 2021 with
    over 65 prosumers and 75 consumers. Based on the various trading rules that have
    been used since the pilots started, it has been demonstrated that a network access
    charge for the DISCOM may be included in this type of trading scenario, incentivizing
    the DISCOM to allow P2P energy trading among their customers while also promoting
    widespread adoption of smart meters across the country.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Agriculture is fundamental for the survival of humankind. To cater to the current
    needs and decrease food wastage, smart agriculture using innovative technologies
    like the IoT, AI, and Big Data is the current trend. Blockchain technology is
    recently being used to solve the challenges of transparency, neutrality, security,
    and reliability in agriculture. In Chapter 10, the authors present a clear picture
    of smart agriculture using Blockchain, IoT, and AI together. A framework for smart
    agriculture is proposed wherein IoT devices will collect data related to agricultural
    production, transport, and storage. AI is used to gather specific knowledge from
    collected data and for future prediction. Blockchain is used at every step of
    storage of data after sensing or transaction, and all the authorized parties can
    verify data from the Blockchain. In comparison with existing methods, the proposed
    framework is found to exhibit more features in many parameters.


    This book covers a strong foundation of Blockchain as a platform together with
    the application of AI for the IoT industry incorporating real-life case studies.
    It covers various topics such as basic to most advanced Blockchain platforms,
    implementations of sophisticated artificial intelligence concepts, etc. This book
    provides a balanced approach between theoretical understanding and practical applications.
    The primary audience of this book includes the research students of computer science
    and information technology, as well as software professionals who can use the
    much-needed developmental ideas to boost up their computing knowledge on distributed
    platforms.


    Debarka Mukhopadhyay

    Siddhartha Bhattacharyya

    Balachandran Krishnan

    Sudipta Roy'
  merge: -1
  img_proc: true
