    # 10.1 INTRODUCTION


    In recent years the agricultural sector is increasingly utilizing the services

    of technologies such as Internet of Things (IoT), robotics, machine learn-

    ing (ML), Big Data (BD), etc. to optimize the entire value chain starting

    from input suppliers and up to end consumers [1, 2]. All these technologies

    are making the agricultural sector smarter and more efficient. Smart agri-

    culture refers to the use of technologies like the Internet of Things (IoT),

    artificial intelligence (AI), robotics, and many others to improve both pre-

    and post-harvesting experiences. The ultimate goal is to boost the quality

    and quantity of crops and deliver best-quality and safe foods to the end-

    consumers utilizing the optimal human labor in the process. It is expected

    that the global smart agriculture market will reach $15.3 billion by the end

    of 2025 [3]. Today, all the pre- and post-harvesting activities in agriculture'
