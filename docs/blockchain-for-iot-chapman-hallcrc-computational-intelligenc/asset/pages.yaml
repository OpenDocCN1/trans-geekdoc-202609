    # 5.3.2 Software Requirements


    The software components required for the proposed systems are Arduino IDE and
    Android Studio that play the pivotal role in making the program and the Android
    app.


    **Arduino IDE:** It is free open-source IDE used for making and uploading programs
    (sketches) to Arduino, ESP, and other microcontroller boards. Once it has completed
    writing the program, it is possible to verify it for checking errors and then
    upload it to the microcontroller board. Arduino IDE programming language is based
    on C++ programming language, so those familiar with C++ will be able to catch
    up with the Arduino IDE much faster.


    In this project, Arduino IDE is required for uploading the code (sketch) to the
    ESP-01 8266 module. As a result, the ESP-01 8266 not only connects to the internet
    but also can receive input via its general-purpose input output (GPIO) pins. The
    proposed system features an Android app, which interacts with the ESP-01 8266
    module for controlling the appliances.


    **Android Studio:** Like Arduino IDE, Android Studio is also available for free
    through Google. The IDE is used for building professional Android applications.
    Android Studio comes with Android Emulator support, which lets the programmer
    run and deploy the app to find bugs and test the built application. By deploying
    an app in the emulator, the programmer can check whether the app is running or
    crashing while being used. Android Studio is used for building, testing, debugging,
    and deploying the app. Most importantly, the built app is fully customizable;
    therefore, it can be extended for controlling other kind of devices and showing
    real-time information to the users.


    The core concept of the system relies on wireless communication, which allows
    a user to interact and control the home appliances remotely from any place they
    want. To fulfill the need, wireless technology (Wi-Fi) is used for enabling the
    microcontroller controlling the system to get connected to'
