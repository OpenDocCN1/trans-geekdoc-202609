    # 1.12.1 Blockchain in Supply Chain Management


    Supply chain management is the combination of upstream and downstream processes.
    The upstream supply chain process may include procurement of raw materials, management
    of logistics, and manufacturing of goods. The downstream supply chain process
    may incorporate finishing of the manufactured products and distributing them to
    the end customers [33]. Presently supply chain faces some challenges such as lack
    of transparency on product information, raw materials, origin of product, etc.
    It may also face problems with operating with an established database like ERP
    [34]. The third key issue with Blockchain in supply chain is legal. The users
    in Blockchain are located in different geographical areas. Each country has its
    own law, and there is no common law for Blockchain for its execution. Blockchain
    in supply chain brings back trust between untrusted participants. It also brings
    back transparency by enabling better visibility about product information, product
    origin, raw materials, logistics, etc. Any stakeholder can be a part of Blockchain
    network. Hence a common immutable information may be sent and recorded in real
