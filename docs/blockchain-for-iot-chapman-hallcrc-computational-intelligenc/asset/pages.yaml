    # 9.1 INTRODUCTION


    Blockchain is a modern groundbreaking technology built on a digitally distributed
    ledger for keeping permanent and tamper-proof (immutable) records of transactional
    data that has piqued the attention of energy companies, national governments,
    and academic institutions. When integrated with smart contracts, Blockchain offers
    clear, encrypt, and secure services that can allow new business solutions [1].


    # Why Is the Blockchain Platform Used for Peer-to-Peer (P2P) Trading?


    Blockchain technology is an ideal P2P trading marketplace because it brings transparency
    and keeps a record of all transactions taking place on the network. All information
    transferred via Blockchain is encrypted, and any manipulation of the data is immediately
    detectable by all other parties. As transactions are recorded at every step, Blockchain
    ensures security, transparency, and reliability of the data.


    In P2P trading, individuals generate energy from rooftop solar (RTPV) and trade
    the excess energy (after personal consumption) with other consumers, at a price
    agreed between prosumer and consumer. This tamper-proof data, which does not originate
    from DISCOM, is a critical market enabler.


    # 9.2 CONTEXT


    By 2022, the Ministry of New and Renewable Energy (MNRE) planned to install 40
    GW of solar rooftop (RTPV) power. [2]. As of March 2021, India had about ~4.5
    GW of RTPV installed capacity [3], and it is anticipated that the government will
    continue to promote solar rooftop program. Solar generation is expected to scale
    up faster due to the following factors:


    +   a) Cost reduction trajectory of solar PV modules witnessed in the recent past
    is expected to continue in the coming years while cell efficiency is expected
    to increase.

    +   b) Rooftop PV is financially beneficial to most categories of consumers.

    +   c) Inclination of consumers toward green energy as awareness is increasing.'
