    # 10.3.2 Purification and Normalization of the Acquired Information


    The sensors generate the information continuously, and as a result, some of the
    data may be repeated or irrelevant. To structure the data in a way that will be
    useful, it needs to be clean and in a correct format so that it easy to understand.


    Once the cleaning operation is completed, all the relevant information is distributed
    at the information warehouse stage. Data should be constructed and well organized,
    and for this, some information should be included, namely a time stamp, demography,
    and which kind of data it is (string, number, float, etc.) while performing this
    operation. Storing data on the Blockchain network makes them more incorruptible
    and ensures that individually visible data connected with the data obtained from
    IoT tools are fully preserved and support the protection rules. Figure 10.3 presents
    the process of cleaning the data. First all sensor data from different stages
    are imported, and anything duplicated or irrelevant removed. Data are ready and
    reconditioned to get normalized. After the data are normalized, the testing is
    started to export the data for use. When the collected information is improved,
    it is put into ML models for training and testing.


