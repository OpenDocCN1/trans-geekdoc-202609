    # 8.1 INTRODUCTION


    In recent years, the Internet of Things (IoT)network has gained much attention
    in terms of its usability and durability. The IoT network has changed the working
    procedure of various day-to-day applications in today’s world [1]. Being a part
    of a wireless sensor network (WSN), the easy installation,'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'openness, and low-cost sensor nodes have changed the perception of using WSN.
    The IoT network uses resource-constraint sensor devices to collect the data and
    transmit them to the centralized cloud server for further analysis. Though an
    IoT network can be implemented with limited resources, it still faces some prominent
    challenges such as reliability, availability, scalability, interoperability, security,
    and privacy [2].


    To further strengthen the working of IoT networks, there has been an effort made
    to use the advantage of software-defined network (SDN) with IoT networks. SDN
    can help monitor the network with limited intervention. SDN separates the data
    plane and the control plane of any network entity. The controller is kept at the
    control layer responsible for network maneuvering, whereas the data plane has
    the functionality to transmit data according to the rules provided by the controller
    [3]. As shown in Figure 8.1, the recent development in the SDN is multiple controllers
    in the control plane. The data plane of the SDN network consists of OpenFlow switches
    that are programmable and store the flow rules. The flow rules are installed on
    the OpenFlow switch by the controller through the southbound interface (SBI).
    In case any alternation is required, a user can access the network using the northbound
    interface (NBI) and perform the necessary actions.


    ![](img/73e16681f7c79384b117f947ee8dd11a_176_0.png)


    FIGURE 8.1 A typical SDN-based IoT network architecture [4].'
