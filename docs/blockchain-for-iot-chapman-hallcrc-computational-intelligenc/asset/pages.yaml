    # 9.3 OPPORTUNITIES FOR TRADING


    The P2P trading model provides an online platform where power is traded between
    prosumers and consumers at a mutually specified price without the need for an
    intermediary using IoT-enabled smart meters. Further, P2P trading has the potential
    to provide following benefits for a DISCOM:


    +   a) The empowerment of consumers and prosumers is promoting renewable energy
    and flexibility: P2P trading platforms can provide a marketplace for prosumers
    to exchange renewable energy produced at a lower cost, facilitating distributed
    generation deployment. Similarly, P2P trading gives customers more leverage over
    their energy use and price, increasing system flexibility. If storage facilities
    are implemented, participants in P2P trading can boost their local communities
    by allowing them to absorb renewable energy and gain more from their distributed
    generation. Customers without renewable generation facilities will profit directly
    from local renewable generation through P2P trading.


    +   b) Balancing and congestion management on the distribution grid through better
    operation of distributed energy resources: P2P trading systems increase management
    of decentralized generators by matching local power demand and supply. P2P trading
    will considerably reduce the amount of money spent on generating capacity'
