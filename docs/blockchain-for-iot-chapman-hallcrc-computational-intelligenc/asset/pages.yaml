    | Trust | Does not require a trusted party | Require a central trusted party |

    | Confidentiality | All nodes have visibility of data | Access restriction |

    | Fault Tolerance | Data is shared among the nodes | Data is stored in a central
    storage |

    | Performance | Time lag in achieving consensus | Immediate execution |

    | Redundancy | Each party has the latest copy | Copy is stored only at the central
    database |

    | Security | Implements cryptography measures (Hash) | Implements traditional
    access control |


