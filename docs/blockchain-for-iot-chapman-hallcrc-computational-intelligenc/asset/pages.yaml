    # 2.3 OVERVIEW OF IOT TECHNOLOGY


    Internet of Things (IoT) has been growing at an incredible rate in terms of its
    achievements and global acceptance because of low-power lossy networks (LLNs).
    It is a distributed network of things (devices, sensors, etc.) within a public/private
    network. The interconnectivity of devices as sensors and actuators bridged the
    gap of sharing information, and communication between the devices provided new
    and exciting opportunities for enterprises and the world to reap its benefits.
    IoT is the new Internet for embedded devices. Its application varies from homes,
    cities, farming/agriculture, energy systems, health and fitness monitoring to
    smart payments, smart grids to weather monitoring to IoT-based supply chain solutions
    for most of the industries, improving the efficiency and performance from current
    systems (which rely heavily on manual settings and configuration of devices involved).
    Machine-to-machine and machine-to-human interactions formed the backbone of the
    motivation behind IoT. The scope of IoT is not limited to just the connectivity
    of things; it can communicate and exchange data while implementing value-added
    application-based services. Applications on IoT networks extract and create information
    from lower data by performing certain processes like filtering, categorizing,'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'condensing, and contextualizing the data. This information is structured to
    interpret the knowledge toward its intended objectives, allowing for a smarter
    performance.


    The 2015 paper by In Lee et al. [19] described the five popular technologies—
    RFID, WSN, Cloud, middleware, and the application software—required for deployment
    of IoT-based products and services. These IoT technologies were examined to determine
    the approaches that can be justified for IoT investments. Extensive research is
    being conducted to identify the various challenges for its deployment in a real-world
    application. Many enterprises, from IBM and Coca-Cola to Rio Operations Center
    (to name a few), have already invested and are successfully deploying IoT-based
    solutions.


    # 2.3.1 IoT Architecture


    An IoT device consists of several interfaces for connections (wired and wireless)
    such as Input and Output interfaces for sensors (UART, SPI, I2C, CAN), memory
    and backup interfaces (NAND/NOR, SD, MMC, etc.), interfaces for internet connectivity
    (USB Host, Ethernet, and multimedia interfaces (HDMI, RCA video, 3. 5mm audio,
    GPU). It can collect a wide range of data types over different systems, communicating
    over each other or cloud-based storage. IoT protocols mentioned in [20] illustrates
    the four layers as:


    +   1. Link Layer: Some relevant protocols for the layer are the 802.3 (Ethernet),
    802.11 (Wifi), 802.16 (WiMax), 802.15.4 (Low-rate wireless personal area network
    (LR-WPAN)), and 2G/3G/4G/5G mobile communication.


    +   2. Network/Internet Layer: The network handles host addressing and packet
    routing. It sends IP data grams (contains the source and destination addresses)
    from the source network to the destination network across multiple networks. Hosts
    are identified using IP addressing schemes ofIPV4/IPV6/6LoWPAN.


    +   3. Transport Layer: The transport layer enables end-to-end messaging transfer
    independent of the underlying network. This is achieved by either using handshakes
    (TCP connection-oriented) or acknowledgments (UDP, a connection-less protocol).
    It is responsible for error, flow, and congestion control.


    +   4. Application Layer: This layer defines how the application interface communicates
    with the lower-level protocols. Port numbers'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'are referenced for application addressing like port 80 for HTTP, port 22 for
    SSH, etc. HTTP (Hypertext Transfer Protocol), CoAP (Constrained Application Protocol),
    Web Socket, MQTT (Message Queue Telemetry Transport), XMPP (Extensible Messaging
    and Presence Protocol), DDS (Data Distribution Service), and AMQP (Advanced Message
    Queuing Protocol) are some of the widely used protocols in the application layer.


    # 2.3.2 Logical Design of IoT


    This section refers to the abstract representation of the devices and processes
    without detailed low-level specifications. The commonly used IoT functional blocks
    provide the system the ability to identify, sense, actuate, communicate, apply,
    secure, and manage concerning its environment and implementation as described
    in [20]. Some of the fundamental communication models that drive the IoT model
    are:


    +   • Request-Response: Here the client sends requests to the server and the server
    determines the request and responds accordingly.


    +   • Publish-Subscribe: It involves publishers, consumers, and a mediator known
    as a broker. Consumers subscribe to the topics managed by the brokers who in turn
    forward it to a publisher.


    +   • Push-Pull: In this model, the data is pushed to queues and the consumers
    pull the data on a LIFO (Last in First Out) basis. Producers are unaware of the
    consumers, and the queues act as a buffer between the push and pull rates.


    +   • Exclusive Pair: It is a bidirectional, fully duplex communication model
    between the client and the server. It is a form of an open connection.


    # 2.3.3 IoT-Enabling Technologies


    As mentioned previously, IoT is enabled by several core technologies, such as
    wireless sensor network (WSN), which is a collection of distributed devices with
    sensors that can monitor environmental conditions. It contains several end-nodes,
    a router, and a coordinator. The coordinator collects the data from all the nodes,
    behaving as a gateway that connects WSN to the Internet. WSN works with IEEE 802.15.4
    (Zig-Bee), one of the most popular wireless technology. It operates at 2.4-GHz
    frequency and ranges from 10 to 100 meters. Several cloud computing technologies
    are'
