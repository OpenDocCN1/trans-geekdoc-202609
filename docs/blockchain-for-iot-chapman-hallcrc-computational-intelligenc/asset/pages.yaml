  md: '# # Editors


    ![](img/73e16681f7c79384b117f947ee8dd11a_15_0.png)


    Dr. Debarka Mukhopadhyay has more than 17 years of research and teaching experience
    and is currently Associate Professor in the Department of Computer Science and
    Engineering at Christ University, Bangalore. He is an enthusiastic and result-oriented
    individual with a Ph.D. in Computer Science & Engineering from Maulana Abul Kalam
    Azad University of Technology, West Bengal, and M. Tech in Computer Science and
    Engineering from Kalyani Govt Engineering College under the West Bengal University
    of Technology. Dr. Mukhopadhyay holds 20 patents including 6 international and
    14 national (Indian), and published 14 articles in international journals, 22
    in conference proceedings, as well as 8 book chapters. His current research interests
    include Blockchain technology, IoT, AI, and nano computing, among others. He is
    a member of the Institute of Electrical and Electronics Engineers (IEEE), the
    Indian Society for Technical Education (ISTE), and the Institution of Electronics
    and Telecommunication Engineers (IETE).


    ![](img/73e16681f7c79384b117f947ee8dd11a_15_1.png)


