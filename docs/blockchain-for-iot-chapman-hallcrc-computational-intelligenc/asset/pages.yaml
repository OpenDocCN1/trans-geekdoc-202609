    # 3.3.2 Zero-Knowledge Proof


    One of the most interesting concepts in applied cryptography currently is the
    zero-knowledge proof. A zero-knowledge proof is a powerful example of cryptographic
    creativity, with applications ranging from unilateral proliferation to providing
    anonymous and stable transactions for public Blockchain networks. Although Blockchain
    is a reliable option for reaching the required privacy and protection in exchanging
    information, it has one drawback: transparency. As a result, zero-knowledge proof
    (ZKP) has become one of the most common methods for meeting transaction confidentiality
    requirements. ZKP is a procedure whereby the prover (P) will send a proof to the
    verifier (V) stating that he is aware of secret value without revealing other
    details. ZKF is modest in demonstrating declaring someone knows something by merely
    disclosing it. The task is to defend such ownership without disclosing information
    or any other details.'
