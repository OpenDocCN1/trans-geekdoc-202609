- pgno: 1
  md: '# Blockchain for IoT


    **Blockchain for IoT** provides the basic concepts of Blockchain technology and
    its applications to varied domains catering to socio-technical fields. It also
    introduces intelligent Blockchain platforms by way of infusing elements of computational
    intelligence into Blockchain technology. With the help of an interdisciplinary
    approach, it includes insights into real-life IoT applications to enable the readers
    to assimilate the concepts with ease. This book provides a balanced approach between
    theoretical understanding and practical applications.


    Features:


    +   • A self-contained approach to integrating the principles of Blockchain with
    elements of computational intelligence.

    +   • A rich and novel foundation of Blockchain technology with reference to the
    internet of things conjoined with the tenets of artificial intelligence in yielding
    intelligent Blockchain platforms.

    +   • Elucidates essential background, concepts, definitions, and theories thereby
    putting forward a complete treatment on the subject.

    +   • Information presented in an accessible way for research students of computer
    science and information technology, as well as software professionals who can
    inherit the much-needed developmental ideas to boost up their computing knowledge
    on distributed platforms.


    This book is aimed primarily at undergraduates, postgraduates, and researchers
    studying Blockchain.'
  merge: -1
  img_proc: true
