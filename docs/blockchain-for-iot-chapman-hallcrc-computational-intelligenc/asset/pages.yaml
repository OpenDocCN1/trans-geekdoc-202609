    # 1.8 DIFFERENT TYPES OF BLOCKCHAIN FRAMEWORK


    A Blockchain network is categorized into public, private, and permissioned. Public
    Blockchain is open to all. It means anybody without revealing identity can participate
    in network. Public Blockchain works with incentive scheme, and on successful mining,
    a miner gets an incentive. The participants have to follow some consensus algorithms
    as discussed in the previous subsections. Public Blockchain consumes huge amounts
    of electrical energy and requires a huge amount of computational power. Private
    Blockchain allows only selected participants through some authentication and verification
    mechanisms. This type has an owner and it will select participants and miner.
    The owner here can edit, alter, delete any entry inside a block as required. The
    third type is permissioned Blockchain that borrows properties both from public
    and private types [22, 23]. It can allow anyone to join but must go through identification
    and verification procedures. The participants are allowed to perform some specific
    functions only.


    # 1.9 BASIC ARCHITECTURE OF IOT


    Basic or modern IoT architectures must have at least four different layers, namely
    the sensing layer, network layer, data-processing layer, and application layer.
    The sensing layer contains sensors and actuators within or outside physical objects.
    Sensors mainly collect data from environment and give them to actuators. Actuators
    conduct remedial actions in real time [24] (Figure 1.11). The second layer is
    the network layer. It is mainly responsible for data transmission. This unit has
    a data acquisition system (DAS) and is directly connected to sensors. It collects
    raw analog data and converts them into digital form and the digital data into
    transmissible format. Finally, the data are transmitted through internet gateways
    for the next level of processing. In some cases the amount of data is huge. In
    those cases, data are filtered and compressed before transmission. The third layer
    performs data processing. This unit performs data analysis and data preprocessing
    before sending them to a cloud. This is the last layer in the four-layer structure.
    In this layer cloud or data center further performs in-depth analysis, management,
    security,'
