    # 1.1 INTRODUCTION


    Since about the 20th century, information—or data—is treated as one of the most
    valuable parts of any organization. Data can be very important, and keeping secure
    access to data is essential. Hence a requirement for a highlysecured architecture
    platform for data storage [1]. A centralized system is not ideal because it represents
    a single point of failure. If we turn to a decentralized system, in case of any
    failure of a node, a lot of time may be required to reconstruct the communication
    [2]. By comparison, Blockchain as a distributed framework guarantees fidelity,
    privacy, and security for data and moreover creates trust without involvement
    of any trusted third party. The distributed database is shared among all the participants
    in the network. Blockchain is best known as a platform for cryptocurrencies like
    Bitcoin, Ether, etc. A conventional database differs from a Blockchain database
    [3]. In Blockchain, data are stored in containers known asa block. Blocks have
    varied capacity, and when each one is filled, it is closed and then linked with
    a previous block, thus creating a chain. Once a new block is created and added
    to the existing chain, it becomes immutable and data within it cannot be altered.
    Hence no new data can be incorporated inside the existing blocks in the chain,
    but can be a part of the next block. New blocks can be added to an existing chain
    as long as more data storage is required [4].


    So Blockchain allows data to be distributed but not edited. Hence, any transactions
    that are recorded cannot be altered, modified, or destroyed. Now, let us assume
    that a hacker wants to hack information from the chain. If successful, they own
    a node in the chain [5]. If they want to modify their own copy, they won’t be
    in alignment with other nodes, as the changes will be reflected everywhere and
    every participant can identify the single modified copy; the hacked node is thus
    deemed illegitimate and'
  merge: -1
  img_proc: true
