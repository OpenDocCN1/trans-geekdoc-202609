    # 3.1.1 Authentication


    When data moves through an unsecured variety of social media platforms, IoT authentication
    is indeed a paradigm for establishing trust in the identification of IoT computing
    devices in order to maintain security and manage access. IoT systems have limited
    resources and are unable to secure or protect themselves, making them rather easily
    compromised. As a result, adequate authentication and authorization schemes must
    be implemented to ensure optimal security of IoT devices, communications, and
    information. The authentication mechanism must be trustworthy [1], flexible, and
    resistant to proven cyberthreats [2]. Unauthorized third parties try to access
    the stored information such as confidential data, media files, and interactions
    available on the server. Authentication approach detects such entities and denies
    them access. Figure 3.1 illustrates the different types of authentication.


    There are primarily three types of user authentication approaches: (1) knowledge-centered
    authentication describes what the client knows and wants (examples: password,
    security questions, OTP); (2) possession-based authentication specifies what the
    client possesses or holds (examples: One time pad through mail or text, software
    tokens, access certificates); and (3) inherence- or biometric-based authentication
    defines who the user is (examples: fingerprints, iris or retinal images, biometric,
    facial, voice recognitions). Other factors include time factor authentication
    (attempted login, permitted and rejected access), location factor authentication
    (which identifies the accessing device using a global positioning system [GPS]
    to confirm identity), and artifacts-based authentication (which involves smart
    cards, digital signatures, and certificates).


    To secure communications between IoT devices, a range of methodologies can be
    used to establish strong authentication, such as:'
