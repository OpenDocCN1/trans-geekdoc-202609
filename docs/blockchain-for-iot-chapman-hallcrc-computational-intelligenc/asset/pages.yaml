    # 1.5 BITCOIN AND BLOCKCHAIN


    Many people erroneously assume that Blockchain and Bitcoin are similar. In reality,
    they are not similar, but they are functionally related. Put simply, Blockchain
    is a distributed database, which means data are duplicated among different nodes
    at different geographical locations. This approach of duplication leads to decentralization
    of data. Decentralization results in an enhanced level of security, as no central
    data repository is available to attack [15] (Figure 1.3).


    Bitcoin is the first digital decentralized cryptocurrency that uses Blockchain
    network exclusively for its transactions. The users in this network transfer bitcoin
    and trade without any third-party intermediary. Currently there are many cryptocurrencies
    available in the global market, but Blockchain is the common platform for their
    execution.


