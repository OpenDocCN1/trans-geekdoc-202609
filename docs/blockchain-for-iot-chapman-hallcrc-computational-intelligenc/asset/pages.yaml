    # 6.8 SMART CONTRACT AND FINANCE


    Smart contract increases the visibility and trust across the users, which results
    in considerable savings in infrastructures, transactions, and administrative cost.
    Different applications of smart contract in finance are:


    1. **Securities:** By application of smart contract there is automatic payment
    of dividends and stock and liability management while reducing operation risks.
    By applying smart contract we can ease the clearing and settlement of securities.
    Blockchain encapsulates by means of smart contract and its application in business
    logic and its bilateral peer-to-peer application.


    2. **Insurances:** Smart contract includes automatic claim settlement and processing
    verification and payment to increase speed of the claim processing and to eliminate
    fraudulent claims.


    3. **Trade Finance:** At present, trade finance is highly inefficient and the
    industry is vulnerable to fraud. Smart contract allows businesses to automatically
    trigger business actions based on predefined procedures and standards that will
    increase efficiency by streamlining the processes and compliance and reducing
    fraud.'
