    pathway of financial system that will be fully transparent and holistically adapted
    for societal growth and sustainability. Blockchains used to strengthen cryptocurrencies
    is one of a wide variety of applications that are used extensively in Blockchain
    architecture, and simultaneously an Ethereum foundation has started a new paradigm
    by implementation of generic programmable Blockchain that is globally adopted
    and implemented. The resulting outcomes establish the pathway of high-end features
    such as 100% transparent, trust-free, reliable, and highly secure nature for different
    emerging areas other than the financial systems. The goal of this chapter is to
    investigate and compare the focal points of currently trust and fully transparent
    centralized systems in the financial sector and how global society will benefit
    by adopting fully trust-free and transparent system.


