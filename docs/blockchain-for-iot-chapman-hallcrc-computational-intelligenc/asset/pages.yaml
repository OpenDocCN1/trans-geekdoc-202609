- pgno: 90
  md: 'The three primary requirements must be met by a ZKF:


    +   1. Completeness: If the statement is valid, an honest prover will persuade
    the honest verifier—the one who is following the protocol correctly—of this reality.


    +   2. Reliability: Except for a slight chance, no cheating prover can persuade
    the honest verifier that the assertion is true if it is not so.


    +   3. Zero knowledge: If the statement is valid, the only thing the verifier
    knows is that the statement is true. To put it another way, understanding the
    declaration (but not the secret) is enough to conjure up a scenario demonstrating
    that the prover is aware of the secret. This is accomplished by providing a simulation
    to each verifier, which can generate a statement that appears similarly truthful
    to both P and V. The simulation model should be able to generate the transcript,
    although only having access to the prover''s argument.


    A ZKP has a general structure that comprises three sequential acts among participants
    A (prover) and B (verifier). A witness, a challenge, and a response are the terms
    used to describe these acts. Figure 3.6 represents the general structure of noninteractive
    ZKP and interactive ZKP.


    Witness: The fact that A knows the secret specifies a set of questions that A
    can always accurately answer. A begins by picking a question from the set at random
    and calculating a proof. The proof is then sent to B by A.


    Challenge: B then selects a question from the collection and asks A to respond.


    Response: A figures out the answer and returns it to B.


    Unlike a standard zero-knowledge proof, a noninteractive ZKP''s general structure
    consists of only one action between participants P and V, which is a witness.
    P transfers the hidden knowledge to a special function that creates a proof as
    a statement. The result is indeed a proof value of some kind. Following that,
    P transfers proof to V.


    On a Blockchain, it is often important to have some anonymity—making transactions
    without revealing the client''s identity or transactions that are not connected.
    It ought to be feasible for a client to conduct various transactions while maintaining
    anonymity. A ZKP is a strong cryptographic tool, and its application in Blockchain
    appears encouraging in cases where current Blockchain technologies will adapt
    a ZKP to meet unique business requirements centered on data privacy. Although
    Blockchain is a reliable'
