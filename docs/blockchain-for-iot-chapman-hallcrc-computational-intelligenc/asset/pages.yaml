    improve network performance. Moreover, to make the network self-sustainable and
    intelligent, a machine learning (ML) approach has been introduced. The ML-Agent
    will run along with the SDN controllers that will be responsible for authentication
    of the data. The proper validation of the data will be carried out by the Blockchain
    network.


    The rest of the chapter is organized as follows. Section 8.2 reviews the related
    work in this domain. The proposed architecture with an ML-driven SDN agent is
    presented in Section 8.3. Potential research scope is presented in Section 8.4.
    Section 8.5 offers a conclusion.


    # 8.2 RELATED WORK


    There have been efforts made by various researchers and practitioners to provide
    efficient security measures for an IoT network.


    BlockSecIoTNet [15] is an IoT architecture that provides security measures for
    IoT networks using Blockchain. It monitors for anomalous traffic flows by using
    SDN controllers that are placed in the distributed Fog network. The cloud layer
    is responsible for further data processing, which is transmitted to the SDN controller
    to take necessary actions. The architecture provides security features in the
    Fog layer by using a Blockchain module that instructs the SDN switches to detect
    specious flows in the network.


    The authors of [16] offer a provision of data traffic classification in SDN networks
    using ML. It classifies and provides the accuracy of prediction for the flows
    using support vector machine (SVM), Naive Bayes, and nearest centroid approaches.
    The study also focuses on incorporating reinforcement learning in the SDN network
    where the controller acts as an agent that learns the behavior of the network
    from the collected flows. The proposed model uses the collected data from the
    various applications and performs offline classification.


    BFF-IDS [17] was proposed for intrusion detection in SDN-enabled vehicular networks.
    Blockchain in BFF-IDS is used for storing the locations and hash values of the
    vehicles. The control layer consists of Blockchain miner nodes that create blocks,
    and verification is processed via proof-of-authority. The architecture intends
    to provide security using'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'federated learning that creates a trained model for accessing the vendor specification
    confidentially.


    BMC-SDN [18] is a multiple SDN controller network architecture based on Blockchain.
    The architecture ensures security measures in the control layer by creating multiple
    domains of the SDN network. The control layer is an interconnection of multiple
    SDN controllers that are hosted as a part of the Blockchain network. Each network
    consists of a master controller responsible for the creation of blocks, while
    the remaining controllers validate the respective blocks. The block validation
    is performed by using a threshold value by the consensus protocol.


    DRQN-NAF [19] is based on a reinforcement learning mechanism that provides a distributed
    implementation of Software-Defined Industrial Internet of Things (SDIIoT). The
    Blockchain is implemented based on the Markov decision process. It uses Blockchain
    to enable synchronization between multiple controllers to achieve a common global
    view of the network and provides features for cryptographic operations. Deep reinforcement
    learning is used to set up the model for the Markov decision process that optimizes
    the Blockchain-based SDIIoT.


    The authors in [20] present a distributed secure architecture SDN-based IoT for
    smart cities. It uses Blockchain for providing security against cyberattack. The
    Blockchain hosts the blocks that are connected to the single SDN controller. The
    network layer is formed by using gateways and SDN-enabled switches. The security
    mechanism is implemented for data that are forwarded from the gateway to the cloud.
    Moreover, to reduce energy consumption, it utilizes a cluster head selection approach.
    Multiple cluster heads are selected within the network domain that transfers the
    data to the gateway device.


    It is evident from the literature that using advanced technologies such as SDN,
    Blockchain, and ML has enhanced the security features of existing IoT networks.
    In the proposed SDN-based IoT architecture, the incorporation of an ML agent in
    the SDN controller layer will create the ability to detect any malicious flows
    in the network. The Blockchain in the application layer can provide data integrity
    and authenticity by using the smart contract that will be responsible for traffic
    analysis and classification.


