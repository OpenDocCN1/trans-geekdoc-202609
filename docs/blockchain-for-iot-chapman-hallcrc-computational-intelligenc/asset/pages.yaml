    # 1.11 DISADVANTAGES OF IoT ARCHITECTURES


    We have seen a lot of advantages of implementing IoT in different real-life situations.
    Now we will talk about disadvantages of IoT. The main disadvantage is with security
    and privacy. We connect a lot of devices to the internet that may contain sensitive
    information. Hence there is always a chance of it being stolen or misused, as
    the network is a single point of failure [31].


    # 1.12 IoT APPLICATIONS IN BLOCKCHAIN FRAMEWORK


    In the present context, IoT solutions are based on centralized server communicating
    via internet. This huge architecture of IoT applications has to deal with a single
    point of failure. Hence an appropriate replacement is imperative, which may also
    provide enhanced security and transparency. Considering most of the demerits of
    a centralized system, here we are incorporating Blockchain as platform in different
    IoT applications. This proposal enhances security, stops any third-party interventions,
    and increases transparency.


    Systems using IoT architectures face some security problems during data transmission.
    IoT architecture in a Blockchain framework can provide the required security and
    privacy to data. Integrating IoT applications in a Blockchain platform ensures
    data integrity, recording of immutable data, monitoring of real-time transactions,
    etc. Now let us talk about some basics of IoT and its architectures.


    Internet of Things refers to physical objects communicating with each other through
    internet. There are a few fundamental characteristics like interconnectivity,
    heterogeneity, and dynamic changes that any IoT infra-structure possesses. With
    the property of interconnectivity, devices with different infrastructures can
    communicate. With the second property, communications are established even within
    different hardware, software, and network platforms. The third property means
    that the interconnected devices can dynamically switch their states, locations,
    speed etc.


    Internet of Things (IoT) extends to industrial sectors as well, referred to as
    Industrial Internet of Things (IIoT). Here it encompasses communications between
    machines, unit devices, big data, machine learning, and other industrial applications.'
