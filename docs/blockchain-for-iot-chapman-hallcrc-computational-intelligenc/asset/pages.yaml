    SMIETI, SMAAI A, LMCSI, LMISTE] earned a Bachelor''s degree in Physics in 1995,
    a Bachelor''s degree in Optics and Optoelectronics in 1998, and a Master''s degree
    in Optics and Optoelectronics in 2000, all from the University of Calcutta, India.
    He completed a'
