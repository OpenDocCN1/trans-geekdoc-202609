    # 3.1 INTRODUCTION


    A vast network that consists of interconnected devices like smart phones, computers,
    sensors, and actuators is known as the Internet of things (IoT), which has evolved
    exponentially in recent years. It has the potential to allow modern devices to
    determine themselves and communicate with one another. These smart devices would
    be able to collect, evaluate, and even make decisions without the need for human
    interaction or social contact. Despite the abundance of IoT devices and their
    deployment in sensitive applications, IoT-related security risks have become much
    more concerning. There are many security terminologies and definitions that are
    widely utilized, including different security aspects:


    +   - Message: A set of bytes exchanged between two parties.

    +   - A shared secret is often a value that is shared by two entities. The code
    may be as easy as a password or an encryption key that all parties are aware of.

    +   - Confidentiality or secrecy: A method of prohibiting an unauthorized investigator
    from assessing the contents of the message.

    +   - Integrity: A criterion for determining whether or not a message has been
    tampered during the transmission and storage.

    +   - Authentication: A method of implying that a message can be traced back to
    the sender, allowing the receiver to check that the message was sent only by the
    sender.

    +   - Authorization: Evidence that the consumer is authorized to perform a task.

    +   - Nonrepudiation: A method of preventing a message’s owner from arguing that
    the message was not sent.'
