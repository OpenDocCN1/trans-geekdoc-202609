- pgno: 169
  md: '![](img/73e16681f7c79384b117f947ee8dd11a_169_0.png)


    # FIGURE 7.2 Overview of legal AI.


    court documents, contracts, and legal opinions. Hence, most of legal AI''s tasks
    are based on NLP technology. Many tasks in the legal field require the experience
    of a lawyer and a deep insight of several legal documents. Figure 7.2 illustrates
    the summary of legal AI. The symbolic method tends to focus on the use of legal
    knowledge of interpretation to distinguish symbols in legal documents, relationships,
    and events. At the same time, embedding-based methods try to check hidden predictive
    features in a large volume of data.


    The dissimilarities of the two techniques indicate the drawbacks in the current
    process of legal AI. The explained symbolic model is not efficient, and usually
    the most effective embedding methods are not explainable, which may lead to moral
    problems in the legal system. Therefore, there is some difficulty in applying
    the present methods to actual legal systems due to the aforementioned drawbacks.


    The three main challenges of symbol-based and embedding-based methods are:


    +   1. Modeling Knowledge Features: The legal text has been formalized, covering
    many domain facts and legal AI concepts. The way of the usage of this legal knowledge
    is very important.


    +   2. Legal Basis: In NLP, various procedures require proof, but the goals of
    legal AI are slightly dissimilar because legal proof should comply with well-defined
    legal rules. Therefore, the combination of predefined rules and AI technology
    is essential for legal defense. Complex laws and case scenarios may require more
    complex arguments for analysis.


    +   3. Interpretability: Decisions prepared by legal AI must be interpretable
    before they are used on an actual legal system. Otherwise, justice may be compromised.
    This is the most important property.'
