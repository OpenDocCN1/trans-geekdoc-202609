  md: '# ## 1.2 HISTORY


    The concept of Bitcoin came into existence in 2008 and was originally proposed
    by a person—or possibly a group of people—known as Satoshi Nakamoto. But even
    before Nakamoto published the while paper on Bitcoin, the concept of blockchain
    technology has already appeared in earlier research. The preliminary concept came
    into existence with Stuart Haber and W. Scott Stornetta in 1991. The work proposed
    a cryptographically secured chain with time-stamped documents [11]. They proposed
    ways to determine hash values of documents and saving them with a time stamp.
    Nick Szabo, a computer scientist, legal scholar, and cryptographer, conceptualized
    digital currency in 1998, then known as Bit Gold. This proposal incorporated solving
    cryptography puzzles, Byzantine fault-tolerant registry, and validating and time-stamping
    a newly “mined” coin. He also tried to solve the problem of double spending. Bit
    Gold was never implemented, but the concept was utilized in Bitcoin architecture.
    In 2000, Stefan Konst introduced a theory of connecting blocks in a chain. He
    implemented this theory with graphs where nodes are linked using a cryptography
    method. Nakamoto eventually compiled past theories and in 2009 implemented Bitcoin,
    “A peer to peer version of electronic cash” [11].


    # ## 1.3 WHAT IS A BLOCKCHAIN?


    Blockchain is a decentralized or distributed platform for information sharing
    and computation. Records of transactions are duplicated among the participating
    workstations in the network that do not trust each other but coordinate and collaborate.
    Unlike centralized system, here possible attackers need to access all the workstations
    in the network to change similar data. This action of attackers is reported immediately
    among the participants within the network due to inherent characteristics of Blockchain
    technology [12]. Figure 1.1 identifies various characteristics of Blockchain as
    a platform. It offers open participation of a workstation without revealing its
    identity. Like any other distributed or decentralized network, this platform also
    exhibits no centralized control over the transactions. Whenever a transaction
    is initiated between any two workstations, the other workstations do not remain
    idle but try to explore the validity of the transaction initiated by the workstations.
    Thus, the remaining workstations perform as validators for the'
