  \n23.3 寻找一些助推应用的案例。\n\n## 24 假新闻\n\n### 24.1 假新闻历史\n\n首先应该认识到，假新闻确实有悠久的历史，正如我们在之前的关于密码学历史章节中提到的，朱利斯·凯撒参与了早期的加密方法。在在历史上，与凯撒皇帝相关的人物中，至少间接参与了其暗杀的人：马克·安东尼。安东尼本人成为了假新闻的受害者，这导致他最终自杀。\n\
  \n跨越几个世纪，直到美国革命时期，本杰明·富兰林发表了关于美国原住民与乔治三世结盟的假新闻，内容涉及“剥人皮”，以为即将到来的革命争取支持。\n\n在美国奴隶时期，其支持者编写了许多关于非裔美国人的假新闻，既有关于所谓的奴隶起义的故事，也有关于非裔美国人自发变白的故事，这一切都给许多白人带来了恐惧，尤其是在南方。\n\
  \n\n\n\n1938 年，由奥森·威尔斯导演的名为“水星剧院广播节目”的广播剧节目播出了一集名为《世界大战》的剧集，模拟了外星人入侵新泽西州的新闻报道。在节目开始之前，听众被告知这只是一场戏剧表演。然而，大多数听众错过了那部分内容，因此相信入侵是真实的。一个具体的结果是，这场据称发生在新泽西州格罗弗米尔的袭击导致居民袭击了一座水塔，因为广播者错误地将其识别为外星人（Chilton,\
  \ 2016）。\n\n在较早之前的关于隐写学的章节中提到了另一个完全可以认为是虚假新闻的例子。1947 年，FBI 局长埃德加·J·胡佛在《读者文摘》的一篇文章中将微点技术描述为“敌人的间谍活动杰作”（Hoover,\
  \ 1946）。然而，正如后来对胡佛的文章的一的评论中所指出的，他将微点的发明归功于“德累斯顿工业大学著名的扎普教授”。但是，该大学从未有过一位扎普教授，微点历史学家威廉·怀特（1992）谴责胡佛的文章是“半真半假的信息和公然虚假信息的混合物”。\n\
  \n当然，上述所有引用的例子都发生在网络技术出现之前。互联网对虚假新闻传播的影响是，以至于此类信息的实施和传播可以瞬间完成，并影响数百万互联网用户。\n\n##\
  \ 24.2 虚假新闻的复兴、加速与选举\n\n在过去的十年里，虚假新闻的使用已应用于许多领域：为了财务利益、政治目的、娱乐，以及许多其他原因。\n\n现在关于利用此类虚假新闻来不仅影响\
  \ 2016 年美国总统竞选，还影响全球其他许多国家的选举已有大量报道。一个特别为恶劣的例子是通常被称为“比萨门门”（Pizzagate）阴谋论的新闻报道，该理论指控华盛顿特区的某披萨店是由民主党运营的恋童集团。2016\
  \ 年 12 月，一名来自北卡罗来纳州的武装男子埃德加·韦尔奇前往华盛顿特区，对“比萨门门”虚假新闻中确认的彗星蹦球披萨店开了火。韦尔奇对非法跨州运输枪支和使用致命武器袭击罪的指控认罪，并被处\
  \ 4 年监禁（Kang, 2016）。\n\n在 2016 年美国选举期间，人们发现许多传播的虚假新闻故事均源于单一城市——马其顿的韦莱斯（Veles），那里许多虚假新闻组织雇佣了数百名青少年，为不同的美国公司和政党制作并分发煽性的虚假新闻故事（Kirby,\
  \ 2016）。\n\n## 24.3 什么是虚假新闻？\n\n正如我们所看到的，虚假新闻并不新鲜。我们大多数人第一次遇到这种现象是在我们第一次发现一个谎言的时候。然而，可以很有理地认为，作为技术一部分呈现出来的谎言由于其精细的包装，可能看起来是令人印象深刻，以至于使我们相信信息的真实性。\n\
  \n真正只有在互联网时代，工具 set 才变得随手可得，能够创建一个（看似）非常真实信息，从而欺骗许多读者。\n\n过去几年虚假新闻网站的极速扩张可以归因于许多因素。显然，使用复杂的制图软件制作具有非常复杂外观的网站，为创建此类虚假新闻网站提供了机会。\n\
  \n然而，创建此类网站的动机无疑是快速扩张的原因。许多此类网站都有财务激励，要么是因为它们的创建者为了报酬而制作它们（请注意上面引用的马其顿韦莱斯的例子），要么是因为网站本身可能为读者提供了一种购买机制——无论是合法产品还是诈骗物品。\n\
  \n似乎更多网站更核心的目的是主张某种政治观点，这些观点可能会提出完全虚假的信息或带有误导的信息。\n\n## 24.4 是讽刺还是虚假新闻？\n\n对于信息消费者来说，一个巨大的挑战在于，可能被认为是虚假新闻的内容与那些旨在讽刺的内容之间存在着相似性。确实，讽刺是一种重要的叙事形式。\n\
  \n众所周知，我们从小熟悉的许多童谣实际上是由于规避报复而伪装的讽刺，针对权主。考虑以下例子（Fallon, 2014）：\n\n《黑羊》\n\n```\n黑羊，黑羊，你有羊毛吗？\n\
  有的，是的，是的，三大包！\n给主人一份，\n给太太一份，\n留给住在巷尾的小男孩。\n```\n\n《小杰克·霍内》\n\n```\n小杰克·霍内\n坐在角落里，\n\
  吃着派；\n他伸进拇指，\n掏出一颗梅子，\n说：“我是个乖的孩子！”\n```\n\n一种解释认为小杰克·霍内指的是托马斯·霍内。霍内是一个管家，被授权将一个大派交给亨利八世，其中包含了为了让修道院免受国王的反基督教运动而提供的贿赂。\n\
  \n《扬基杜德》\n\n```\n扬基杜德进城，\n骑着小马；\n在帽子上插了一根羽毛，\n称其为意大利面！\n```\n\n显然，扬基杜德是这首歌中一个愚蠢的人物，可以追溯到革命时期。然而在当时，意大利面是伦敦花花的最爱食物，这个词已成为时尚的代名词。最初唱这首歌的英国士兵是在侮辱美国殖民者，暗示他们是傻瓜，认为在帽子上插羽毛就能像伦敦社交人士一样时髦。\n\
  \n\n\n\n\n# DailyBuzzLive\n\nDailyBuzzLive 是一家专注于煽动性文章的在线杂志或电子杂志。其风格可以通过首页菜单选择中显示的某些栏目来推断，例如：“争议性”、“病毒式视频”、“奇闻”、“犯罪”、“劣质品种种”。\n\
  \n判断其真实性的一个直接线索是，目前没有明显的方法可以确定出版者。其主题涵盖范围广泛，但一些示例标题包括：\n\n*   美国农业部（USDA）允许来自中国的污染鸡肉充斥美国本土\n\
  *   在麦当劳肉类工厂发现人肉\n*   人们呼吁将圣诞老人更名为“圣诞人”\n\n关于圣诞节的最后那篇文章，文章中没有注明作者，也没有任何日期。摘自文章：\n\
  \n> 对于许多人来说，脑海中浮出的第一个问题是：我们真的生活在一个这样的世界里吗？在这里我们将一个圣徒（更重要的是一个深受喜爱的传统节日人物）称为男性，会担心冒犯社会的某个群体？\n\
  > 事实证明，有些人人认为这是一个好主意，毕竟今年像 John Lewis 这样的公司已经取消童装中的男孩和女孩标签。\n\n这篇名为“人们呼吁将圣诞老人更名为‘圣诞人’”的文章可能被某些人仅仅视为讽刺。然而，其语调具有高度的政治性，是对\
  \ LGBT 群体的抨击。尽管文中确实有一些追溯到公元 3 的合法引用，但有许多迹表明这属于虚假新闻。首先，尽管这是一篇很长的文章，但文章任何地方都没有引用作者。此外，以“人们呼吁……”开头的标题从未提及过究竟是谁发出的这种“呼吁”。\n\
  \n## 24.5.2 ABCnews.com.co\n\n这个网站 `ABCnews.com.co` 已经不存在了。如果你输入该 `URL`，你会发现一个不存在的网站常见的声明，其开头为“相关链接”。该网站显然曾归已故的\
  \ Paul Horner 所有。\n\n这个很容易识别。事实上，原始网站已经下线了。线索是，该 `URL` 虽然看起来是 ABC 新闻的网站（`ABCnews.com`），但实际上是以南美洲哥伦比亚的国家代码\
  \ `.co` 结尾的。这种技巧已被许多其他虚假新闻网站使用。\n\n## 24.5.3 The Onion.com\n\n一眼看去，人们可能会认为《洋葱》（The\
  \ Onion）是虚假新闻。然而，尽管没有在网站顶部的页眉注明，但《洋葱》自标识为讽刺作品，并遵循了该领域的悠久传统，就像上面具有政治影响的鹅妈妈童歌一样。《洋葱》与上述的\
  \ DailyBuzz 例子不同，后者没有将自己标识为讽刺。\n\n《洋葱》的几篇显然具有讽刺性质的文章包括：\n\n*   国家不确定还能安全地吸收多少个前特朗普员工\n\
  *   新的泰德·克鲁兹攻击广告宣布贝托·奥尔尼克对德克萨斯州来说太优秀了\n*   伊丽莎白·沃伦在 DNA 测试显示没有总统总统基因迹象后感到失望\n\n\
  《洋葱》在其网站上有一个板块（`https://www.theonion.com/about`），以一种相当明显的讽刺方式指出，《洋葱》自标识为讽刺作品。\n\n\
  ## 24.5.4 Infowars.com\n\n该网站与 Alex Jones 密切相关，Alex Jones 长期以来被认认为是一个阴谋论者。在一个令人震惊的报道中，标题中提到的\
  \ Jerry Richards 被指控在佛罗里达州那波尔杀害了 700 多人。在这种情况下，由于据称杀手已被被捕，应该会有有关此事件的法庭记录和其他新闻报道。但并没有。\n\
  \n## 24.5.5 New Yorker\n\nAndy Borowitz 多年来一直在为《纽约人》（New Yorker）撰写系列讽刺文章。他在他文章的标题中非常清楚地指出这些文章是“来自博罗维茨报告的讽刺”；此外，在他的文章上方还有一行字指出它们是“非新闻”。\n\
  \n## 24.5.6 Empirenews.net\n\n至少在“关于我们”部分，《帝国新闻》（Empire News）指出：帝国新闻仅供娱乐之用。我们的网站和社交媒体内容仅使用虚构名称，除非是对公众人物和名人进行恶搞或讽刺的情况。任何其他对真实姓名的使用均为偶然和巧合。\n\
  \n\n\n\n\n2018 年 11 月 12 日的文章火炬行动加利福尼亚) 关于加利福尼亚州南北发生的毁灭性森林火灾引发了许多问题。第一个警告信号出现在开头的引用中：“火炬行动加利福尼亚是一项由美国情报部门正在进行的非常真实的秘密行动……这些假旗恐怖攻击首先是一场高度复杂的心理战。”该引用被归于一位未具名的“情报分析师兼前美国军官”。其次，文中提到了缩写\
  \ `DEWs`，但从未对其进行过定义。（这可能意味着数字电子战争系统、干旱早期预警系统或其他什么？）\n\n从那起起，文章在各种荒谬的言论之间来回跳，将这个故事与佛罗里达州的的迈克尔飓风、伊斯兰国（ISIS）和基地组织，以及煤飞灰中的氧化铝联系在一起。在许多其他荒谬的言论中，声称“要命名加利福尼亚历史上最具破坏性的火灾，营火火代表了与这场精心策划的火灾心理战相关的深层愤世嫉俗。现在将那场地球工程引发的山火归咎于简单的‘营火火’是多么容易。”其他地方曾报道称，加利福尼亚历史上死亡人数最多、破坏性最大的山火之所以被称为营火火，是因为它起源于坎普溪路。\n\
  \n## 24.5.8 疾病控制中心\n\n这可能是所有例子中最令人困惑的一个，因为它出现在一个美国政府机构的网站上——位于亚特兰大的美国疾病控制中心（[图 24.1]）。`CDC`\
  \ 的职责是对抗传染病，当发生寨卡病毒或埃博拉病毒爆发时，它通常处于一线。然而，建议人们如何应对“僵尸末日”似乎至少是不寻常的。读者真的会相信有必要准备此类事件吗？还是所有人都会意识到这仅仅是旨在提高人们对传染病传播的普遍关注的讽刺？遗憾的是，出于某种原因，`CDC`\
  \ 没有选择将该网站标识为讽刺，因此这似乎只能被归类为假新闻。\n\n![](img/024x001_fmt.jpeg)\n\n## 24.6 评估假新闻（或非假新闻）\n\
  \n从人类干预中可以学习到什么可能是很有启发性的。我们将查看许多此类网站，看看可以使用哪些“破绽”或技术来识别它们是否为假新闻。\n\n| 假新闻检测技术 |\
  \ 解释 |\n| :--- | :--- |\n| 作者背景 | 查看你可以查到关于任何指定作者的什么信息。那个人是否存在？如果是，他或她的资历或参考文献是什么？\
  \ |\n| 无作者 | 如果一篇文章出现且没有注明作者，请保持怀疑。 |\n| 评论区 | 如果网站有评论区，看看你否判断评论者的信誉和评论的性质。 |\n\
  | 情绪反应 | 你对这个故事感觉如何？或者说，“它通过‘嗅觉测试’了吗？”当然，你的反应可能取决于内容。 |\n| 专家证言 | 如果引用了任何专家，搜索他们是否真的存在；或者如果存在，他们的资质是什么。\
