  \ and Society, 1, 125–151.\n\n## 练习\n\n这些问题旨在引导你思考本章讨论的核心行为科学概念。这些问题可以用多种方式使用，包括个人思考练习、小组讨论问题，以及模拟对性别心理学和行为网络安全的兴趣。\n\
  \n15.1 不同的常见性别概念化以及与之对应的性别心理学理解方法，如何解释国务部长希拉里·克林顿的行为？是什么导致她使用私人电子邮件服务器的？\n\n15.2\
  \ 如何利用行为科学中的性别心理学方法来促进对女性参与计算机科学及其他计算领域的理解？\n\n\n\n\n\n# 15.3 如何从不同角度思考本章所描述的性别心理学方法如何应用于分析\
  \ Eliza 程序对话，以及第 16 章中描述的目的（图 16.1）中的“图灵测试”（Turing Tests）？\n\n一个我们在书中不断提到的主题涉及网络攻击防御者为了击败相关攻击而可能使用的潜在工具。\n\
  \n一个一个领域是判断怀疑的网络攻击是来自人类还是机器。事实上，这个问题从计算机科学诞生起就一直处于前沿，而且未来其重要性可能会增加。\n\n艾兰·图灵（Alan\
  \ Turing）首次提出了一个测试，如果能够回答，就可以区分对话中的第三方是人还是机器。这并非处于攻击领域，而是人与机器之间的随机对话。图灵提出了一个实验，让两个参与者位于不同的房间，没有任何视觉接触。一个房间是提问者，可以向另一个房间的实体提出任何问题。如果提问者在尽可能多地提问后无法确定另一个房间的实体是人还是机器，那么可以说该机器拥有人类智能。图灵于\
  \ 1950 年在《心灵》（Mind）杂志上发表了这篇文章（图 16.1）。\n\n![](img/016x001_fmt.jpeg)\n\n测试图灵挑战的早期计划之一是由约夫·魏泽鲍姆（Joseph\
  \ Weizenbaum）于 196 年在麻省理工学院（MIT）开发的名为 `Eliza` 的程序。在 `Eliza` 程序中，提问者可以根据意愿向 `Eliza`\
  \ 提出陈述或提问。以下是 `Eliza` 程序的一段短对话：\n\n```\nELIZA: 有什么困扰你吗？\nYOU: 我今天感觉不好。\nELIZA: 你知道还有其他人今天感觉不好吗？\n\
  YOU: 没有，只有我。\nELIZA: 为什么呢？\nYOU: 我头疼。\nELIZA: 你说你头疼？\nYOU: 是。\nELIZA: 我理解。\nYOU:\
  \ 我可以做什么来消除头疼。\nELIZA: 头疼对你重要吗？\nYOU: 是的，我需要结束这种头疼。\nELIZA: 你看起来很确定。\nYOU: 绝对是。\n\
  ELIZA: 那和你头疼的事实有什么关系吗？\n```\n\n`Eliza` 测试的通常结果是用户对 `Eliza` 重复的回答感到沮丧。没有人会得出 `Eliza`\
  \ 实际上是人的结论。\n\n有趣的是，在图灵测试的原始表述中，图灵描述了上述提问者的过程，但相邻房间的受访者男性还是女性。无疑，图灵在 1950 年描述这一挑战时意识到，想象另一个房间有一个计算机（或电子机器）会让读者感到困惑，因为当时世界上只有寥少数计算机，很少有人理解问题的背景。\n\
  \n## 16.1 引言\n\n在行为网络安全这一领域，我们研究了检测计算环境中的作者（如黑客）性别的可能性。\n\n目前的研究指出，在性别判定的背景下提出图灵测试，实际上是图灵本人向可能对机器可以与人类对话这一想法感到挑战的观众解释测试的方法。\n\
  \n## 16.2 图灵测试在行为网络安全中的作用\n\n鉴于外部事件的汇流、互联网的力量、9/11 后对“网络恐怖主义”日益增长的恐惧、对安全需求的深入理解以及网络安全巨大的就业需求的预测，许多大学在该领域开发了更丰富的课程，美国国家安全局也建立了确定该领域卓越中心的流程（NCAIAE，2018）。\n\
  \n在 1980 年美国数学会在密歇根州安市夏季会议上，特邀演讲嘉宾是已故数学家彼特·J·希尔顿（Peter J. Hilton）（Pedersen，2011）。希尔顿博士因其代数拓扑的研究而闻名，但在那个场合，他首次公开谈论二战期间在布莱切利公园（Bletchley\
  \ Park）8 号室的密码分析工作。\n\n作者参加了那场会议，并经常引用希尔顿教授对激发他对现在所说的网络安全兴趣的影响。希尔顿当时揭示了布莱切利公园破解恩尼玛（Enigma）密码时使用的许多技术。然而，最具启发性的是英国团队的一个发现：与协议相反，德国密码操作员会在加密会开始时两次发送相同的信息，类似于“今天天气怎么样？”（这一发现在近期获得奥斯卡提名的电影《模仿游戏》中[Sony,\
  \ 2011]）。彼特·希尔顿在《模仿游戏》中对话中仅被称为“彼特”，但在演员职员表中列出由演员马修·比德（Matthew Beard）饰演的“彼特·希尔顿”。无疑，密码分析领域众周知，使用不同的密钥对同一信息进行两种加密是破解密码的巨大线索。因此，得出行为缺陷产生了巨大的实际后果并非夸张，因为布莱切利公园团队被认为拯救了数百万生命并帮助结束了战争。\n\
  \n## 16.3 期末考试题\n\n在 2016 年春季学霍盛特大学的行为网络安全本科课程中，关于识别潜在黑客或其他计算机用户的性别引起了大量的讨论。这导致了期末考试中的一道题，要求学生回答以下问题：\n\
  \n> 我们知道，通常在美国以及霍盛特大学（当时作者所在的大学），计算机科学专业中女性仅占约 20%。此外，在选择专注于网络安全方向的计算机学生中，女性比例低于\
  \ 10%。你能提出任何原因来解释为什么有这么多计算机科学家选择网络安全吗？\n\n## 16.4 阅卷时\n\n在批改此考试的过程中，第一作者在阅读每个答案时，都会自问能否根据语气、用词选择、某些关键词的使用以及对作者观点的预期感知，判断答案作者是他的男学生还是女学生。\n\
  \n\n\n\n\n具体问题列在章节末尾。\n\n### 16.5 图灵的论文\n\n人们注意到，这项测试的管理与图灵最初提出的经典的图灵测试具有某种相似性，图灵此此是为了回应“机器（计算机）可能拥有智能”这一命题。\n\
  \n`Turing test` 假设提问者通过电子方式与另一个地点的实体连接，且唯一的连接是电子连接。换句话说，提问者不知道自己是在与人类还是计算机通信。该测试以以下方式进行：提问者可以随所意提任意数量的问题，如果在会话结束时，提问者能够绝对确定那个不可见的实体是人类而实际上是计算机，那么另一个实体就可以被合理地认为拥有智能。\n\
  \n自从图灵在 1950 年左右提出这一问题以来，关于这一主题已经有了大量研究，从 Weizenbaum (1966) 最初开发的名为 `Eliza` 的人工“心理学家”开始，一直一直发展到\
  \ IBM 超级计算机 `Watson`，`Watson` 曾在 2010 年的电视节目《Jeopardy!` 中击败了两名人类专家（Baker, 2012）。关于\
  \ `Jeopardy` 实验，`Watson` 是总冠军，但在某些可能存在语义解释的问题上，`Watson` 简单失败了，而在许多其他问题上，`Watson`\
  \ 的速度使其能够击败人类参赛者。然而，在更广泛的范围内，人们普遍认为，无论计算机多强大，都没有通过过 `Turing test`。\n\n在计算机科学史上，人们一直在讨论这项测试是否被满足，或者它是否可能被满足。\n\
  \n## 16.6 模仿游戏\n\n在我们课程描述的性别测试背景下，这似乎非常有趣，因为它在许多方面从历史上都汲取了图灵的……[此处缺失]。得分通过两种方式计算。首先，识别学生作者的正确答案数量除以测试中的总问题数（24\
  \ 个）。或者，得分由尝试次数决定。由于在 19 次实例中只有 2 次两者之间的差异超过了 2%，因此决定使用第二组响应评分，这些评分列在 表 16.2 中。\n\
  \n| 表 16.2 性别图灵测试的响应 |\n| --- |\n| 按性别划分受访者 | 女性 | 男性 |\n| 响应正确百分比 | 56.89% | 51.02%\
  \ |\n| 按年龄划分受访者 | 年年长 | 年轻 |\n| 响应正确百分比 | 57.60% | 51.77% |\n| 按国家划分受访者 | 喀麦隆 |\
  \ 加勒比 | 加拿大 | 墨西哥 |\n| 正确百分比 | 49.17% | 56.67% | 45.83% | 54.35% |\n| | 波多黎哥 | 东欧\
  \ |  沙特阿拉伯 | 美国 |\n| 正确百分比 | 50.00% | 66.67% | 33.33% | 54.79% |\n| 按职业划分受访者 | 人类学\
  \ | 计算机科学 | 工程师 |\n| 正确百分比 | 64.71% | 52.91% | 58.33% |\n| | 语言学家 | 心理学家 | 学生 |\n\
  | 正确百分比 | 66.67% | 54.17% | 50.03% |\n\n对这项研究中 55 名参与者的这些响应结果的观察，以及他们为这项测试响应所带来的非常丰富的经验，产生了一些非常值得思考的问题。\n\
  \n首先，女性受访者在识别学生性别方面更为准确，比例为 56.89% 对 51.02%。\n\n\n\n\n接下来，年长受访者的识别准确率比年轻受访者高，差距相似，分别为\
  \ 57.6% 和 51.77%。这可能是一个更令人惊讶的结果，因为大多数情况下，年长受访者在计算机科学或网络安全方面的技术经验不如年轻受访者，而后者大部分本身就是学生。\n\
  \n一个非常明显的区别是，东欧受访者在识别学生性别方面的得分高得多，平均达到 66.67%，而其他其他地区的响应低了整整 10%。来自东欧的受访者人数非常少，因此在这方面进行概括可能存在风险。然而，这些东欧人（来自罗马尼亚和俄罗斯）并不是英语母语者，尽管他们的英语也相当流利。他们每个人的正确答案百分比在所有\
  \ 55 名受访者中并列最高。\n\n西班牙语受访者人数较多，其中一些人的英语并不流利。尽管如此，西班牙语受访者的总分高于所有来自英语国家受访者的平均水平——包括喀麦隆、加勒比、加拿大和美国。喀麦隆和加拿大都是法语和英语双语国家，但在本案例中，所有受访者都来自这两个国家的英语地区。此外，加勒比受访者也来自英语加勒比。\n\
  \n以阿拉伯语为母语的沙特受访者在识别正确性别时面临更大的困难。这些差异可能是由于这些受访者的英语流利程度不足导致的。\n\n在不同学科的受访者中，语言学家、人类学家、工程师和心理学家的都比计算机科学家好——而表现最低的是参加测试的学生（与撰写原始答案的学生相比）。\n\
  \n当然，可以将此项测试的所有回答数据集视为一个 24 × 55 维的矩阵，其中编写原始考试目的的学生（即实际上创建了 `GTT` 的人）代表矩阵的行，而 55\
  \ 名受访者的性别分类则代表列。如果我们以行扫描的方式检查该矩阵，就能了解到原始测试受试者的写作风格以及他们的能力（尽管这种能力是无意的，因为除了原作者外，没有人计划将这些文字用于识别写作者的性别）。\n\
  \n因此，与其评估受访者确定测试参与者性别的能力，或许指出以下一点更有参考价值：几个原始测试受试者能够在无意识中欺骗超过三分之二的受访者。整四分之一（24 人中的\
  \ 6 人）的学生达到了超过三分之二的欺骗水平。在这六名“高欺骗者”中，有三个女性学生和三个男性学生。\n\n在光谱的另一端，三分之一的学生欺骗能力不强——欺骗了少于三分之一的受访者。在这八个学生中，六个是男性，只有两个是女性。总体而言，平均男女学生的欺骗水平，女性学生平均能够欺骗\
  \ 52.5% 的受访者，而男性学生只能欺骗 42.2% 的受访者。下表显示了测试受试者欺骗受访者能力的散点图（图 16.2 到 16.4）。\n\n![](img/93468.jpg)![](img/93503.jpg)![](img/93537.jpg)\n\
  \n## 16.9 “辅导”受访者\n\n上述所有受访者只是被给了一个只有附件中所述简单说明的测试，受访者对于识别写作者或作者性别的可能技术没有任何先前的准备或理解。\n\
  \n因此，我们确定，如果给这些人提供一些培训以尝试提高他们在 `GTT` 上的结果，将是有用的。我们尝试识别一些可以帮助读者尝试提高 `GTT` 或相关测试得分的关键点（Patterson\
  \ et al., 2017）。\n\n我们的下一个目标是看看在通过寻找可以描述的某些线索来区分作者性别的情况下，受试者是否可以在此类文本分析方面提高。我们描述了若干识别作者性别的技术，以对原始\
  \ `GTT` 中的问题进行分析：\n\n1. 检查使用了多少代词。女性写作者倾向于使用更多代词（I, you, she, their, myself）。\n\
  2. 作者使用了哪些类型的名词修饰词？名词修饰词的类型：名词可以通过紧跟在随其后的的名词之前来修饰另一个名词。男性倾向于使用识别或确定名词的词（a, the,\
  \ that）以及量化名词的词（one, two, more）。\n3. 主题/风格：辩论、阐述或艺术作品中处理的话题或代表的主题。芝加哥伊利诺州理工大学计算机科学家\
  \ Shlomo Argamon 说，“女性具有更具互动性的风格。”\n4. 注意词汇的使用以及它如何揭示性别。一些可能的女性化关键词包括：with, if,\
  \ not, where, be, should。其他一些男性化关键词包括：around, what, are, as, it, said。这表明语言倾向以非常微妙的方式编码性别。\n\
  5. “女性倾向于具有更互动性的风格，”芝加哥伊利诺州理工大学计算机科学家 Shlomo Argamon 说（Argamon et al., 2003）。他们希望在作者和读者之间建立一种关系。”\n\
  6. 另一方面，男性使用更多的数字、形容词和限定词——如“the”、“this”和“that”之类的词——因为他们显然比女性更关注传达特定的信息。\n7. 注意他们提及他们所论论性别的方式。例如，女性可能会通过说“woman”而不是“girl”来指代自己的性别。\n\
  8. 观察他们提供的例子。你会看到男性还是女性说这个短语吗？\n9. 男性更有可能使用一个描述男性感受的例子。\n10. 女性倾向于比男性使用更好的语法和更好的句式结构。\n\
  11. 当一个性别的人在描述另一种性别的感受/想法时，他们倾向于得出对他们来说合理的结论，但不会提供实际数据。\n\n应当注意的是，一些之前的工作包括开发了一个可以在互联网上获取的应用程序（`Gender\
  \ Guesser`），该程序由 Neil Krawetz 基于 Krawetz (2018) 开发，位于 `http://hackerfactor.com/GenderGuesser.php`。\n\
  \n该似乎取决于所分析文本的长度，与我们人类受访者的回答相比，它的表现并不好，因为通常应用程序指示文本太短，无法给出成功的性别判断。\n\n然而，由于这项研究的总体目标是确定\
  \ `GTT` 是否可以在网络安全背景下使用，攻击者或黑客可能只提供非常短的消息——例如，互联网上的喷子试图掩盖自己的身份，以便与（比如）未成年潜在受害者建立关系。\n\
  \n## 16.10 未来研究\n\n\n\n\n\n这项研究提出的问题也为设计其他此类测试提供了可能，以确定作者的其他特征，例如年龄、职业、地理来源或母语。此外，鉴于上述描述的测试初始受访者本身来自不同的专业领域、国籍和母语，许多之前的参与者已表示对参与未来在上述任何一个领域的研究感兴趣。\n\
