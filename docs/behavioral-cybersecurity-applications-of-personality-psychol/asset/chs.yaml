  \ 8.6](#16_Chapter_08.xhtml#Anchor-12）中的 Hi 值计算统计量 `S`。\n\n\n\n\n\n## 8.10\n假设我们有一个入侵检测系统（IDS），它监控用户的四种活动，并将其标记为\
  \ `H0`、`H1`、……`H3`。同样假设如果从平方差计算出的统计量 `S` 超过 `0.2`，IDS 系统就会将其识别为异常。根据下方存储的 `H` 值表和当前的\
