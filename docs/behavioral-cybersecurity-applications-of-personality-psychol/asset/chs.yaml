  \ C. E. 2018. 在核心内容本科心理学课程中教学和学习定性探究的模型：人格心理学作为一种自然机会。《定性心理学》，5(2), 243–262。\n\n\
  Winter, D. 1992. 重新审权力动机。收录 C. Smith (编），《动机与人格：主题分析手册》（第 301–310 页）。剑桥：剑桥大学出版社。\n\
  \nWinter, D. G. 和 Barenbaum, N. B. 1985. 男女中的责任感与权力动机。《人格杂志》，53, 335–355。\n\n# 问题\n\
  \n这些问题旨在让你思考本章中讨论的基本行为科学概念。这些问题可以以多种方式使用，包括个人思考练习、小组讨论问题，和/或激发对人类人格和行为网络安全新思维方式的兴趣。\n\
  \n2.1 是否可能在人格特征、动机、目标和叙事身份的概念框架内理解整体个人？我们为什么应该渴望理解个人来概念化并解决网络安全问题？\n\n2.2 识别一个近期人类黑客案例，该案例有多个来源提供的关于该人的信息（例如新闻报道、案例研究等），或者从\
  \ 4 章“近期事件”中选择一个案例，并以案例描述作为来源。利用本章描述的人类人格维度，尝试利用各种来源的线索或 4 章中关于该人的近期事件描述，来描述其的人格特征、动机和叙事身份。\n\
  \n\n\n\n\n## 2.3 人格心理学家将“理解整体”作为该领域任务的模型中缺失了什么？换句话说，除了人格特质、人格特征适应以及嵌入文化和社会背景的叙事身份之外，还有什么其他特征定义了一个人的性格？\n\
  \n### 心理学与网络安全\n\n在如今，拿起报纸阅读新闻时，很难在某处不遇到关于网络攻击的描述，无论是入侵计算机账户、从大型数据库中下载个人和隐私信息，还是通过索要赎金来劫持用户，以便其恢复系统。\n\
  \n网络安全领域已经有了巨大的发展，甚至可以追溯到近一个世纪，但攻击者的成功案例仍在扩大和增长。\n\n今天，从防御角度出发的网络安全专家主要由计算机科学、数学和工程背景的人组成。我们这些在该领域进行研究的人对许多协议的复杂性感到由自豪，这些协议通常需要非常先进的数学技术来实现，并且在实施得当的情况下，能提供非常强大的防御手段。在许多方面，本书的诞生是网络安全专家长期以来的一系列讨论，他们一方面反思开发这些强大安全协议的技术成就，但另一方面也意识到，由于用户可能会使用宠物的名字作为密码，其强度往往会被用户完全抵消，从而为攻击者提供了一条否定强大安全协议的简单路径。\n\
  \n人们可能会认为，人类退出循环的时刻终将到来。换句话说，目前在网络攻击的场景的某些时刻，我们可能需要人类的输入，例如输入密码。在那个时刻，复杂协议的价值远不如理解人类（防御者）在提供（例如）强密码时是如何失败的；或者另一个人类（攻击者）如何变得足够聪明或有足够的动机去发现防御者的密码机制。\n\
  \n这一论点继续假设，如果人类被移除——换句话说，无论用作密码（或身份验证方法）的内容是由计算机本身或某种自动化机制生成的，而且破解它的方法也是由计算机生成的，那么人类行为和行为科学的影响可能就会从方程式中消除。\n\
  \n网络安全世界可能会演变成那一步。然而，很难想象，考虑到现在参与全球计算机环境的人数多达数十，所有用户如何可能在一个所有的识别或验证模式都仅处于计算机间领域的环境中生活。\n\
  \n但让我们更进一步：即使在上述假设下，我们也可以设想这样一个未来，即参与此类描述的对话以建立通信，从而在两个自动化系统之间诱导信息意义所需的计算机软件或机器人也可能开始发展行为特征。今天有大量研究正在探讨如何通过软件设计赋予机器人或程序（换言之为\
  \ bots）行为倾向。因此，也许在未来，我们可以看到行为科学家也可能需要考虑机器人的行为科学。\n\n事实上，通常被认为是计算机科学之父的艾伦·图灵（Alan\
  \ Turing）在 20 世纪 40 年代就提出了这个问题——我们通常称之为“图灵测试”，他在 1950 年的《心灵》（Mind）杂志上的一篇学术论文中对其进行了描述。许多人在\
  \ 2015 年获得奥斯卡奖电影提名的电影《模仿游戏》中看到了这种讨论的形式。\n\n尽管目前全球范围内网络攻击的兴趣日益增加且速度加快，但对我们来说，已经变得极其清楚，为了最好理解网络攻击/网络防御的整体空间，仅对我们这一代网络安全专家现有的数学和工程相关方法进行训练是远远不够的；我们还需要具备各种行为科学知识的人士的专业知识：心理学、行为科学、神经科学等。因此，本书的目标是开发一套既适用于具有数学/计算机科学/工程背景的人，也适用于各种行为科学专家的课程，以获得对每种科学方法的理解，并培养出一批精通这两个截然不同领域并具备分析网络安全问题能力的人才。\n\
  \n## 3.1 谁应该读这本书？\n\n我们的目标是让这本书服务于多个受众。我们希望通过为接受过数学和工程相关训练的人士提供一条路径，让他们也能理解一些行为科学原理，从而能够将这两个研究领域结合。。。此外，从另一个角度来看，我们希望这本书也能吸引行为科学家——心理学家、神经科学家等——他们也有兴趣学习一些来自数学和工程相关领域的方法，以同样成为网络安全专家，并采用类似的双重方法。\n\
  \n从作为教材使用的角度来看，它已在课程开发和之前的教学中，作为本科高年级和硕士级别的课程使用，学生是在数学和工程或行为科学背景方面有先备准备。\n\n这种针对跨学科受众的目标在教学角度上带来了一些挑战。我们发现，当强调主动学生学习环境时，学生的参与度最深：即许多人所说的某种“翻转课堂”。\n\
  \n我们认为，通过在材料中选择几种不同的路径（如前言所述），这本书可以服务于不同的受众：学生群体（a）是计算机科学/工程学生与行为科学学生的混合，（b）主要是计算机科学/工程学生，以及（c）主要是行为科学班。\n\
  \n\n\n\n\n网络安全研究的历史可以追溯到 20 世纪 70 年代甚至更早，但对于大多数人来说，当时人们所知的信息仅影响了计算机世界中极少数的人。正如上文所述，人们对外部攻击的首次广泛关注直到\
  \ 20 世纪 80 年代才出现，例如 1988 年的`Morris Internet worm`蠕虫。\n\n## 4.1 莫里斯蠕虫\n\n那年的 11 月\
  \ 2 日，当时康奈尔大学计算机科学专业的学生罗伯特·莫里斯（Robert Morris）了了蠕虫并将其发布到互联网上。在当时的`UNIX`系统系统中，`sendmail`和`finger`应用程序存在漏洞，允许蠕虫进入并生成自身的副本。这导致了由此造成的巨大损害，因为它会不断复制自己直到内存耗尽，导致系统崩溃。此外，利用`UNIX`的漏洞，蠕虫可以从一台机器移动到另一台机器，估计它最终在\
  \ 15 小时内感染了约 2000 台计算机。每台机器的修复方法仅限于删除大量的病毒副本；没有修改或删除任何数据。修复时间从几小时到几天不等。美国政府问责办公室估计损失范围在\
  \ 10 万至 1000 万美元之间——显然这不是一个非常准确的评估（Stoll, 1989）。\n\n罗伯特·莫里斯根据《计算机欺诈和滥用法》接受了审判并定罪，被处\
  \ 3 年缓刑和 400 小时社区服务，并罚款 10,050 美元。随后，他被聘为马萨诸塞理工学院的计算机科学教授，至今仍在那里教学和研究。\n\n无论是在北美还是全球，大众接触计算机的普及直到\
  \ 20 世纪 90 年代才开始。因此，对于我们大多数人来说，直到那个时期才开始听说网络攻击。\n\n但现在，在 21 世纪，全球范围内访问互联网的人口比例呈指数级增长，因此网络攻击者的目标数量以及无疑，攻击者的数量也随之增加。\n\
  \n不仅如此，对许多不同类型进行利用的潜力也增加了。因此，我们现在有了许多利用案例，导致关键用户信息被大量盗取，例如社会安全号码、地址、电话号码甚至信用卡信息，比如下面的“OPM\
  \ 黑客事件”。\n\n## 4.2 人事管理局黑客事件\n\n人事管理局（`OPM`）是美国政府一个鲜为人知但重要的组成部分。它负责“招募、留任意奖励世界级人才为美国人民服务”。换句话说，`OPM`处理大量美国政府员工的档案记录工作；特别是，它还管理许多联邦政府员工的安全审查。\n\
  \n2014 年和 2015 年发生了两次重大数据泄露，获取了约 400 万名美国政府员工的记录，估计被盗记录数量约为 2150 万条。获取的信息包括社会安全号码、姓名、出生日期和地点以及地址。在此攻击中被盗取的还有`OPM`。\n\
  \n## 4.3 维基\n\n无论是在北美还是全球，大众接触计算机的普及直到 20 世纪 90 年代才开始。因此，对于我们大多数人来说，直到那个时期才开始听说网络攻击。\n\
  \n但现在，在 21 世纪，全球范围内访问互联网的人口比例呈指数级增长，因此网络攻击者的目标数量以及无疑，攻击者的数量也随之增加。\n\n不仅如此，对许多不同类型进行利用的潜力也增加了。因此，我们现在有了许多利用案例，导致关键用户信息被大量盗取，例如社会安全号码、地址、电话号码甚至信用卡信息，比如下面的“OPM\
  \ 黑客事件”。\n\n### 4.3.1 什么是 WikiLeaks？\n\n2007 年，`WikiLeaks`作为一个组织和网站成立，其使命是：\n\n\
  * 向新闻记者提供重要新闻和信息\n* 为消息源提供一种创新、安全且匿名的信息泄露方式\n* 在新闻报道的同时发布原始材料，以便读者和历史学家能够看到真相\n\n\
  “我们工作依据的广泛原则是捍卫言论自由、完善我们的共同历史以及支持所有人的权利。我们从《世界人权宣言》中获得这些原则。”\n\n### 4.3.2 高尚的目标\n\
  \n这些目标是值得赞点的，如果我们只谈论：\n\n* 丹尼尔·莫伊（Daniel Moi）总统时期对肯尼亚的掠夺——30 亿美元的总统腐败\n* `Stasi`（塔西，即前东德秘密警察）档案文件被泄露\n\
  * 特尔克斯和凯科斯岛媒体禁言令的曝光\n\n### 4.3.3 叛国！！！\n\n众议院国土安全委员会共和党首席成员彼得·金（Peter King）代表和评论员比尔·奥莱利（Bill\
  \ O’Reilly）都要求按叛国罪起诉 Assange。这里只有一个小问题：根据法律，美国的叛国罪只能由美国公民实施——而 Assange 是澳大利亚人。\n\
  \n\n\n\n随后，支持 WikiLeaks（维基解）目标的组织（特别是名为 `Anonymous` 的在线小组）决定对 `MasterCard` 和 `PayPal`\
  \ 发起 DDoS 攻击，并成功导致它们宕机了几天，这无疑给这两个机构造成了巨大的收入损失。作为报复，这实际上可能是网络战争的首个例子，其他对 `MasterCard`\
  \ 和 `PayPal` 赞同并反对 WikiLeaks 发布机密文件的团体也曾一度尝试关闭 WikiLeaks 网站，但 WikiLeaks 预料到了这种行动，加强了针对此类攻击的防御，因此这些攻击从未成功关掉\
  \ WikiLeaks 站站点。\n\n当时，在线流量监控公司 `Alexa` (2018) 公布了全球许多网站的流量数据，以下 `Alexa` 数据图表显示了对\
  \ WikiLeaks 攻击的强度，尽管它并未成功导致 WikiLeaks 关闭（图 4.1）。\n\n![](img/93380.jpg)\n\n一种新型攻击——勒索软件在\
  \ 1989 年首次为人知。这类攻击旨在禁用个人的计算机和信息，直到向犯罪者支付一笔钱。\n\n## 4.4 早期勒索软件](#06_Contents.xhtml#r_idParaDest-55)\n\
  \n勒索软件的首个已知案例是整个网络安全史上最离奇的故事之一。它可以追溯到 1989 年（Web 前），由进化生物学家、哈佛博士 `Joseph Popp` 通过软盘发布。`Popp`\
  \ 是一位 `AIDS`（艾滋病）研究人员，也是肯尼亚世界卫生组织的兼职顾问。他的勒索软件涉及复制一种名为 `AIDS Trojan` 的病毒，该病毒在受害者系统重启一定次数后会加密受害者的文件（Simone,\
  \ 2015）。他通过软盘将这种病毒发送给了大约 20,000 名接收者。为了满足赎金要求，需要向巴拿马的一个邮信箱支付 `$189`；然后受害者将收到解密软件。这次攻击在很大程度上失败了，因为在分析代码后，解密工具被免费公开。`Popp`\
  \ 随后在英国被捕，但随后被判定为精神无能无法受判。后来他回到美国，并在纽约奥尼农塔创建了 `Joseph L. Popp, Jr., Butterfly Conservatory`（蝴蝶植物馆），这是该市的一处现有景点，距离可能更著名的机构“纽约州库珀斯斯顿棒球名人堂”只有几英里。他与女儿一起建造了这座植物馆，但他在\
  \ 2006 年植物落成不久前去世了。\n\n勒索软件在 2013 年随着 `CryptoLocker` 重新出现，它使用 `Bitcoin` 来收集赎金。当年\
  \ 12 月，`ZDNet` 根据 `Bitcoin` 交易信息估计，`CryptoLocker` 的操作者声称从受感染的用户那里获取了约 `$2700 万`。\n\
  \n在非加密型勒索软件变体中，2010 年的 `WinLock` 通过显示色情图像限制对系统的访问，并要求用户发送 `$10` 以获取解锁机器的代码。据报道，该方案收集了\
  \ `$1600 万`，尽管具有一定知识的用户可以轻易地击败该方案。\n\n另一种类型的恶意软件“网络钓鱼”试图欺骗用户交出敏感信息，最常见的方法仅仅是打开一封“钓鱼”邮件，甚至通过回复此类邮件来返回敏感信息。\n\
  \n## 4.5 网络钓鱼](#06_Contents.xhtml#r_idParaDest-56)\n\n网络钓鱼攻击是一种非法软件，主要旨在从毫无防备的人或账户中获取信息，以使“钓鱼者”受益。\n\
  \n这些攻击可能来自用户为了获取信息而联系的任何来源，许多可能发生于打开一封伪装来自某个可信源的邮件。\n\n攻击的目的可能是诱导用户打开附件（网络钓鱼）。另一种网络钓鱼方法可能是让接收者打开\
  \ `Word`、`Excel` 或 `PowerPoint` 文档，其中可能包含会感染系统的代码（称为 `宏`）。\n\n来自 2016 年的一个涉及伪装来自\
  \ `PayPal Corporation` 的例子，图 4.2 显示了攻击情况。\n\n![](img/93380.jpg)\n\n`paypal@outlook.com`\n\
  \n`paypal@outlook.com`\n\n## 4.6 Stuxnet](#06_Contents.xhtml#r_idParaDest-57)\n\n\
  2010 年产生了一个“游戏规则改变者”。这是第一次，一种名为 Stuxnet 的恶意硬件软件攻击感染了核设施。这里的关键区别在于，之前的恶意软件总是由个人或小组产生，针对随机目标，被发现后很容易禁用，且造成的破坏相对较小。\n\
  \nStuxnet 被安全人员发现。它被确定是一种通过 `Windows` 传播并针对工业系统的复杂病毒。\n\n### 4.6.1 Stuxnet 是做什么的？](#06_Contents.xhtml#r_idParaDest-58)\n\
  \n最初，它尝试访问所有计算机（就像之前的病毒一样）。但如果攻击的计算机不是 `SCADA` 系统，则没有危害。如果是 `SCADA` 系统，它会通过损坏 `Step-7`\
  \ 应用程序来感染 `PLC`。\n\n### 4.6.2 结果如何](#06_Contents.xhtml#r_idParaDest-59)\n\nStuxnet\
  \ 感染了五个伊朗机构，推测与铀富集基础设施有关。`Symantec Corporation` 在 2010 年 8 月报告说，全球受 Stuxnet 感染的计算机中\
  \ 60% 位于伊朗。\n\n### 4.6.3 结果](#06_Contents.xhtml#r_idParaDest-60)\n\n伊朗核计划遭到了 Stuxnet\
  \ 的损害，因为感染的控制系统导致核心温度变化，从而破坏了设备。`Kaspersky Labs` 得出的结论是攻击“只有国家支持才能实施”。\n\nStuxnet\
  \ 对不符合特定配置要求的计算机和网络危害很小；“攻击者非常小心地确保只命中他们的预定目标……这是一项狙击手的工作。”（Sanger, 2012）。如果未找到\
  \ `Siemens` 软件，该病毒就会失效。\n\n### 4.6.4 是谁干的？](#06_Contents.xhtml#r_idParaDest_61)\n\
  \n`Symantec` 估计开发小组有 5 到 30 个人，该病毒准备花费了 6 个月。\n\n`Bruce Schneier` 当时表示：“我们现在可以确定\
  \ Stuxnet 与伊朗纳坦兹核富集实验室的离心机有关”（Schneier, 2012）。\n\n\n\n\n\n拉尔夫·兰纳（Ralph Langner）首次识别了\
  \ Stuxnet 的行为：“我的观点是[以色列]参与了，但主导力量并非以色列……那是网络超级大国——只有一个，那就是美国。” (Broad et al., 2011;\
  \ Langner, 2011)。\n\n伊朗政府于 2010 年 11 月承认，一种病毒导致纳坦兹（Natanz）处理离心机的控制器出现问题。\n\n###\
  \ 4.6.5 最初没有任何个人或国家承认对 Stuxnet 拥有所有权\n\n随后，在 2013 年，美国将军詹姆斯·卡特莱特（James Cartwright）透露了关于\
  \ Stuxnet 的细节。参见：[`thecable.foreignpolicy.com/posts/2013/09/24/obamas_favorite_general_stripped_of_his_security_clearance`](http://thecable.foreignpolicy.com/posts/2013/09/24/obamas_favorite_general_stripped_of_his_security_clearance)\
  \ (Lubold, 2013)。\n\n另请参阅（Sanger, 2012）：[`www.nytimes.com/2012/06/01/world/middleeast/obama-ordered-wave-of-cyberattacks-against-iran.html?pagewanted=all`](http://www.nytimes.com/2012/06/01/world/middleeast/obama-ordered-wave-of-cyberattacks-against-iran.html?pagewanted=all)。\n\
  \n随后的报告显示，Stuxnet 是美国国家安全局（NSA）与类似的以色列机构摩萨德（Mossad）共同努力的成果。\n\nStuxnet 的“成功”催生了几个变体。\n\
  \n### 4.6.6 Duqu\n\n2011 年 9 月 1 日，发现了一种新的蠕虫，被认为与 Stuxnet 有关。布达佩斯科技经济大学密码学与系统安全实验室（CrySyS）分析了该恶意软件，并将威胁命名为\
  \ Duqu。赛门铁（Symantec）根据该报告继续对该威胁进行分析，称其“与 Stuxnet 几乎相同，但目的完全不同”，并发表了一篇详细的技术论文。Duqu\
  \ 中使用的主要组件旨在捕获击键记录和系统信息等数据。外泄的数据可能被用于未来类似于 Stuxnet 的攻击。\n\n### 4.6.7 Flame\n\n2012\
  \ 年 5 月，发现了名为“Flame”的新恶意软件，被认为与 Stuxnet 有关。研究人员根据其一个模块的名称将该程序命名为 Flame。卡巴斯基（Kaspersky）在分析\
  \ Flame 代码后表示，Flame 与 Stuxnet 之间存在着密切的关系。Stuxnet 的早期版本包含了通过通用串行总线（USB）驱动器传播感染的代码，这与利用相同零日漏洞的\
  \ Flame 模块几乎完全相同。\n\n### 4.6.8 Gauss\n\n2012 年 8 月，古丁（Goodin）报告道，“与 Stuxnet 有关的国家赞助恶意软件具有神秘弹头。”更增悬疑色彩的是，Gauss\
  \ 特木马也针对了中东的银行和 PayPal（Goodin, 2012）。卡巴斯基实验室的研究人员将该恶意软件命名为 Gauss，它是由同一个“工厂”或多个“工厂”设计的，这些工厂还负责了用于破坏伊朗核计划的\
  \ Stuxnet 蠕虫，以及 Flame 和 Duqu 特木马。\n\n除了上述简单提到的示例外，所有这些级别的攻击都在增加。尽管网络安全社区尽了最大努力，但最难控制的因素不是我们提供防御的软件和硬件，而是用户的人性弱点。\n\
  \n仅以 2017 和 2018 年为例，我们就有以下情况。\n\n### 4.7 总统选举\n\n攻击成功地从美国民主党及其总统候选人希拉里·克林顿（Hillary\
  \ Clinton）的内部通信中获取了大量邮件流量，这极可能影响了选举结果。\n\n### 4.8.1 案例研究：WannaCry 攻击 (5/13) 过程\n\
  \n首先，是导致现状的事件顺序说明：\n\n1. Windows 在历史范围内，最初由用户手动安装更新（安全或其他更新）。\n2. 在 Windows 演变过程中（如\
  \ Windows7 和 XP），更新可以自动安装，但用户必须开启该功能。\n3. 对于目前的 Windows10，更新每次关闭电脑时会自动安装。\n4. 一些时候，国家国家局开发了广泛的软件，通过服务器总线的漏洞入侵\
  \ Windows 系统。这被称为`EternalBlue`。\n5. 也许早在 2014 年，某人或几个人获取了`EternalBlue`包。\n6. 通过某种机制，一个自称“影子经纪人”（Shadow\
  \ Brokers）的黑客组织开始在地下出售`EternalBlue`包。\n7. 他们宣传这种产品时使用的语言至少是不可理常的。\n8. 2017 年 3 月，微软意识到服务器总线存在漏洞，并发布了防御利用该漏洞的攻击的方法。\n\
  9. 而这正是`EternalBlue`所利用的漏洞。\n10. 微软不仅自动为 Windows10 提供了这种修复，还为早期版本提供了修复但由于微软不再支持\
  \ Windows7 或 XP 等系统，更新不会自动安装。\n11. 任何获取该包的个人或团体都解决了启动勒索软件的一半问题。\n12. 最后一步是黑客团体创建一个勒索软件，利用其`EternalBlue`机制进入系统，然后启动\
  \ WannaCry 软件冻结用户屏幕，加密部分或全部文件，并索索金。\n13. 这种攻击于 2017 年 5 月 13 日星期五发起，有迹象表明 WannaCry\
  \ 已感染了 30 万台系统。\n\n\n\n\n\n14. 安装了 2 个月前微软补丁的 Windows 系统（无论是像 Windows 10 系统那样自动更新，还是按照微软说明手动更新）都可以防御\
  \ `EternalBlue`/`WannaCry` 入侵。\n\n15. 最初索取的赎金为 300 美元，使用 `Bitcoin`。\n\n16. 攻击发生几天后，追踪显示，在周末之前受感染的\
  \ 100,000 个系统中，只有约 900 个支付了这 300 美元。\n\n17. 随后迹象表明，该黑客团体是一个名为 `Lazarus` 的相当著名的团体。\n\
  \n18. 一些作者认为，`Lazarus` 是朝鲜政府，或者是受朝鲜政府雇佣的组织。\n\n19. `Lazarus` 在 3 年前的所谓索尼图片黑客事件中也被提到。\n\
  \n20. 在 `WannaCry` 攻击高峰，苏格兰的一位研究人员发现，作为攻击的一部分，`WannaCry` 软件会检查名为 `iuqerfsodp9ifjaposdfjhgosurijfaewrwergwe.com`\
  \ 的虚假网站是否存在。如果没有该网站，`WannaCry` 将继续其勒索要求；否则，它将关闭。于是，这位极具进取的苏格兰人以约 10 美元购买了该名称网站，随后由于发现了该网站的存在，`WannaCry`\
  \ 的感染停止了。\n\n21. 许多研究人员试图追踪勒索要求的实际影响。目前尚不清楚支付了 `Bitcoin` 的人 (a) 款项是否到达了预期目的地，以及\
  \ (b) 他们的任何文件是否得到了恢复。\n\n22. 关于从国家安全局（NSA）的 `EternalBlue` 窃取案，有两名 NSA 员工被指控。`Nghia\
  \ Pho` 因故意留存机密信息被判处在联邦监狱服刑 5½。`Harold T. Martin III`（他也是马里兰大学巴尔的摩县校的计算机科学研究生）对一项项故意留存国家国防信息的指控认有罪。\n\
  \n### 4.8.3 理解 Petya 攻击 (17/6/27) 过程回顾\n\n首先，是对导致当前攻击发生并使其成为可能的事件的时间顺序描述：\n\n1.\
  \ 2017 年 6 月 27 日，始于乌克兰（`WannaCry` 发生 1 个月后），多家银行、能源公司和公用事业的多台电脑遭到攻击并被冻结索索金。\n\n\
  2. 丹麦航运公司 `Maersk` 也发生了类似的结果。\n\n3. 其他公司作为预防性措施关闭了其系统。\n\n4. 受攻击的系统会显示一条带有特定电子邮件地址的消息，用于支付赎金，金额为\
