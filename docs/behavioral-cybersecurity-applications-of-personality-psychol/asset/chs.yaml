  \ 27.9 假新闻\n\n## 27.10 密码计\n\n## 27.11 下一步工作\n\n## 索引\n\n# 前言\n\n自从互联网引入并普及以来，维护网络安全所涉及的问题呈指数级增长，并演变成了许多形式的利用。\n\
  \n然而，对网络安全的研究和探讨远远不足。多年来，网络安全领域进行的所有研究都是由具有计算机科学、电气工程和数学背景的人完成的。\n\n然而，许多网络安全研究人员意识到，要全面理解如何保护网络环境，不仅需要它们在计算机科学、工程和数学方面的知识，还需要对人类行为有更深理解的人：即在行为科学各个分支（如心理学、行为经济学和其他脑科学领域）具有专家知识的研究人员。\n\
  \n作者一位计算机科学家一位心理学家，在过去的几年里，他们试图理解在解决网络安全问题时，每种方法可以提供的贡献，这种整合方法我们倾向于称之为“行为网络安全”。\n\
  \n作者认为，基于这种整合方法开发的研发和课程方案，提供了第一本采用该方法研究网络安全的书籍。本书结合了传统的网络安全技术计算和分析方法，同时也包含了心理学和人类因素方法。\n\
  \n书中涉及的主题包括：\n\n* 网络安全与行为科学导论\n* 像分析方法与风险管理\n* 大型网络安全事件和“假新闻”的案例研究\n* 密码攻击与防御的分析\n\
  * 博弈论与行为经济学介绍，及其在网络安全中的应用\n* 攻击者/防御者人格和动机特征的研究\n* 使用加密和隐写术测量网络攻击/防御的技术\n* 伦理黑客\n\
  * 图灵测试：经典、性别、年龄\n* 实验室作业：社会工程学、明文密码、隐私研究、密码计\n\n科学的历史似乎向两个方向之一演进。有时，对某一研究领域的兴趣会增长到足以演变成一个独立学科的程度。物理学和化学可以这样描述，从“自然科学”中演变而来。然而，在其他情况下，一个学科的基础方法会被另一个完全不同学科的另一种传统所补充。计算机科学的研究可以很好地描述为这种方法的例子。当第一作者在\
  \ 20 世纪 70 年代在密歇根大学读博士时，还没有计算机科学系。紧随这一发展之后是网络计算的扩张，最初通过国防部支持的 DARPAnet，然后演变为开放获取的互联网。现在，随着浏览器等工具的发展，使得互联网对世界社区变得更有用，这种环境为网络攻击在数量和种类上的快速扩张铺了道路，因此网络安全研究人员在极短时间内面临的挑战变成了计算行业的一个大关注点。正如任何解决问题的新方法一样，当它们需要不同领域的知识和实践时，了解任一领域的人很少，因此它需要这种桥梁。我们试图在书中提供这样一种桥梁，因此我们将书命名为《行为网络安全》。\n\
  \n我们希望这本书的出版能为这一不断发展的网络安全领域的课程提供素材。我们认为，此类课程可以在计算机科学课程中、心理学课程中开设，或者作为跨学科课程开设。“引言”部分为以下课程提供了路线图：(a)\
  \ 计算机科学和心理学的行为网络安全，(b) 为具有某些行为科学背景的计算机提供的行为网络安全，或 (c) 为具有某些计算背景的行为科学家提供的行为网络安全。\n\
  \n# 引言\n\n我们大约在 75 年前进入了计算机时代。在近三分之二的时间里，我们很大程度上可以忽略我们现在所指的网络攻击威胁。这有许多原因。追溯到 20\
  \ 世纪 70 年代，关于渗透计算机环境的方法有了大量的研究，但还有其他因素阻止了网络攻击的广泛发展。因此，对计算环境的防御（和攻击）的研究仍然是少数研究人员感兴趣的话。\n\
  \n\n\n因此，计算机科学领域面临着必须在极短时间内适应不断变化的专业水平的困境。本书的第一位作者于 1980 年开始了自己的研究，当时我们现在所说的网络安全还处于婴儿阶段，甚至早于个人电脑和互联网的广泛发展。\n\
  \n在尝试解决加紧培养能够应对网络攻击问题的研究人员的需求时，我们的两位作者意识到，除了研究此类问题所需的传统专业知识（即计算机科学、数学和工程学方面的专业知识）外，我们迫切需要关注人类行为——首先是参与各种形式网络攻击或网络犯罪的人员的行为，其次也包括所有计算机用户的行为方面，例如，那些在生活中从不避开预防措施（如锁好门），但在计算机账户上却使用配偶、兄弟姐妹或胞或宠物的名字作为密码的人。\n\
  \n因此，我们启动了这个项目，旨在为该领域引入一种网络安全方法，这种方法不仅依赖于数学、计算和工程方法，还取决于对人类行为更深入的理解。我们将这一学科命名为“行为网络安全”，并在过去的几年中开发并提供了一门课程，该课程现已演变为本教科书。我们希望它能为希望在该领域开展学术研究的大学、政府、行业其他机构提供指南。\n\
  \n本书的提目的是：(1) 用于开发网络安全课程；(2) 支持行为科学和网络安全的进一步研究；以及(3) 支持网络安全领域的从业人员。\n\n《行为网络安全》为理解我们最重要的研究领域之一的问题提供了新方法的基础——这种方法得到了大多数网络安全专家的认同，即不仅结合传统的网络安全技术计算和分析方法，还针对这些问题开发心理学和人类因素的方法。\n\
  \n外部事件的汇聚——互联网的力量、自 9/11 以来对“网络恐怖主义”日益增长的地缘政治恐惧、对安全需求和行业更深入的理解，以及对网络安全领域巨大就业需求的经济预测——促使许多大学在该领域开发了更丰富的课程，且美国国家安全局（NSA）也建立了一套确定该领域卓越中心的流程。\n\
  \n本科生的入学人数已增加到满额。然而，我们认为网络安全课程中仍然存在我们决定要解决的缺口。\n\n## 背景\n\n在 1980 年于密歇根州安诺伯堡举行的美国数学学会夏季会议上，一位特邀演讲者是著名的数学家、已故的彼特·J·希尔顿（Peter\
  \ J. Hilton）。希尔顿博士因代代拓扑学的研究而闻名，但在那时，他首次公开谈论自己在二战期间在布莱切利公园（Bletchley Park）8 号小屋从事密码分析的工作，那里是后来著名的破解德国恩尼格玛（Enigma）等加密方法的阵地。\n\
  \n本书的第一位作者参加了那场会议，并经常引用希尔顿教授在激发对我们现在所说的网络安全兴趣方面的影响。希尔顿当时揭示了布莱切利公园在破译恩尼格玛时使用的许多技术。然而，最具启发性的一点是英国团队的发现：与协议相反，德国密码操作员会发送两次相同的信息，在加密会话开始时发送类似于“今天天气怎么样？”的内容。（这一发现曾在近期获得奥斯卡提名的电影《模仿编码游戏》中有所体现。）\n\
  \n## 网络安全中的当代行为问题\n\n人们认为，为了应对黑客聪明但恶毒的行为以及诚实用户的粗心行为，网络安全专业人士（及学生）必须对动机、行为以及其他主要在心理学中研究的理论有一定的了解。\n\
  \n因此，通过在网络安全课程中建立行为组件，认为可以解决这一课程需求。此外，考虑到计算机科学专业中只有 20% 是女性，而约 80% 的心理学专业学生是女性。希望这门新课程能吸引更多女性学生。\n\
  \n## 课程结构\n\n在网络安全就业需求方面，估计显示“美国有超过 209,000 个网络安全职位尚未填补，招聘人数在过去五年中增长了 74%”。\n\n\
  人们认为，行为网络安全的关注也将吸引更多女性学生，因为国家统计数据显示，在计算机科学领域，女性少于男性约 4 比 1，而在心理学领域情况几乎完全相反。\n\n\
  我们这本教科书的目标是通过这种行为网络安全方法，为更多的人提供学习和研究网络安全领域的机会。通过对网络安全就业所需技能组合的新方法，希望扩大后的学生群体能够寻求这条道路。\n\
  \n\n\n\n我们认为本教材适用于三类课程：第一类是预期或要求学生在计算机科学和行为科学方面至少具有某些背景的课程；第二条路径适用于主要具有计算背景，但对行为科学知识或专业知识较少的学生；第三条路径适用于那些背景主要为行为科学、而计算机学科背景极少的学生。下文描述了使用本教材的三种不同方法，我们将其命名为：\n\
  \n*   面向计算机科学与心理学的行为网络安全\n*   面向具有行为科学背景的计算机科学行为网络安全\n*   面向具有计算背景的行为科学家的行为网络安全\n\
  \n在接下来的页面中，你将看到最适合上述背景学生的三个章节选择方案。总体章节如下：\n\n| 序号 | 章节 |\n| --- | --- |\n| 0 | 序言\
