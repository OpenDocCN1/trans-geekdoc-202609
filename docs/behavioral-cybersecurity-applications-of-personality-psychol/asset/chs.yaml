  ,\\\\\\,\\, 0.7} \\\\ {\\\\,\\\\\\,\\, 2.6} & {\\\\,\\\\\\,\\, 5.9} & {- 3.7} \\\
  \\ {- 1.4} & {\\\\,\\\\\\,\\, 2.4} & {\\\\,\\\\\\,\\, 9.3} \\\\ \\\\end{array} \\\
  \\right\\\\rbrack$$\n\n`A` 的常用紧凑表示法是 `[aij]`，其中 `i` 和 `j` 分别枚举行和列中的元素。\n\n在某些条件下，矩阵元素系统的操作可以扩展为对矩阵本身的操作。首先，关于加法，两个矩阵只有在具有相同维度\
  \ `m × n` 的情况下才能相加。在这种情况下：\n\n示例：\n\n$$\\\\text{A} = \\\\left\\\\lbrack \\\\begin{array}{lll}\
  \ 6 & {\\\\,\\\\\\,\\, 1} & 7 \\\\ 2 & {- 4} & 2 \\\\ \\\\end{array} \\\\right\\\
