  \ Champaign-Urbana, IL, 2014.\n\n### 问题\n\n22.1 针对上述描述的 20 字母加密方法建议一种攻击方法，使其优于尝试所有\
  \ `20!` 密钥。\n\n22.2 在第 5 章中，我们引入了分类黑客的 ABCD 方法。假设你知道必须防御的是哪种类型的黑客。使用上述术语，如果你面对 A、B、C\
  \ 或 D 类的攻击者，你会选择多大规模的质数积 (`n`)？\n\n22.3 对上述描述的五种场景进行评论。\n\n### 23\n\n### 行为经济学\n\
  \n行为经济学是研究心理、认知、情感、文化和社会因素如何影响个人和机构的经济决策，以及这些因素如何影响市场价格、收益和资源分配。它还研究在不同实验值环境中不同行为的影响。可以在维基百科（2018）上找到该主题的概述。\n\
  \n主要关注经济主体的理性行为以及这种行为的边界。在我们案例中，我们对攻击攻击者防御者的理性行为感兴趣。行为模型通常整合了心理学、神经科学和微观经济理论的见解，在我们的案例中还有网络安全理论。行为经济学的研究包括财务决策是如何形成的。\n\
  \n最近的一项研究显示，过去几年学术论文中使用“行为经济学”一词显著增加。我们将考虑行为经济学的三个流行主题：\n\n-   **启发式（Heuristics）**：人类\
  \ 95% 的决策是通过经验法则或心理捷径做出的。\n-   **框架效应（Framing）**：轶事和刻板印象的集合，这些构成了个人理解和应对事件时依赖的心理情感过滤器。\n\
  -   **市场失灵（Market inefficiencies）**：这包括定价错误和非理性决策。\n\n我们选择在对网络安全行为方面的研究中引入这个主题，因为正如我们在前面的章节中所看到的，我们经常可以使用经济模型来描述网络安全场景。这门经济学新分支的领先学者包括莫里斯·阿莱斯（Maurice\
  \ Allais）、丹尼尔·卡尼曼（Daniel Kahneman）、阿莫斯·特沃斯基（Amos Tversky）、罗伯特·席勒（Robert Schiller）、理查德·赛勒（Richard\
  \ Thaler）和卡斯·萨斯坦（Cass Sunstein）。\n\n2002 年，心理学家卡尼曼获得诺贝尔经济学奖，表彰他“将心理学研究的见解整合到经济科学中，特别是关于不确定性的人类判断和决策”（Nobel,\
  \ 2002）。2012 年，经济学家席勒获得了同样的诺贝尔经济学奖，“因于他对资产价格的实证分析”（Nobel, 2013）。2017 年，经济学家赛勒也因此获得诺贝尔经济学奖，“由于他对行为经济学的贡献以及在建立人类具有预测性的非理性方面的开拓性工作”（Appelbaum,\
  \ 2017）。\n\n## 23.1 行为经济学的起源\n\n在经济学正式研究早期（18 世纪），微观经济学与心理学密切相关。微观经济学相对于宏观经济学处理个人或小群体层面的决策和行为。宏观经济学处理大型组织或政府规模的理论和研究。亚当·斯密（Adam\
  \ Smith，1759）写了《道德情感论》，对个人行为提出了心理学解释以及对公平正义的关注。杰米·边沁（Jeremy Bentham）对效用的心理基础进行了大量写作（Bowring,\
  \ 1962）。\n\n经济心理学出现在 20 世纪。期望效用和折扣效用模型开始被接受，分别对不确定性决策和跨期消费产生了可测试的假设。例如，莫里斯·阿莱斯采取了进一步步骤，提出了阿莱斯悖论，这是他在\
  \ 1953 年首次提出的决策问题，与了效用假设相矛盾。我们将在下面看到阿莱斯的一些例子（Allais, 1953）。\n\n20 世纪 60 年代，认知心理学开始进一步阐明大脑作为信息处理设备（对比行为模型）。阿莫斯·特沃斯基和丹尼尔·卡尼曼等学者开始将他们在风险和不确定性下的决策认知模型与理性行为经济模型进行比较。\n\
  \n有限理性是一种观点，个人在做决策时，其理性受到决策问题可处理性、认知限制以及可用时间的限制。\n\n这表明人类会采取捷径，可能导致非最优决策。对这一想法的一种处理来自理查德·赛勒和卡斯·萨斯坦的《助推》（Nudge，2008）。\n\
  \n\n\n\n该领域的里程碑式词汇出现于 1979 年，当时 Kahneman 和 Tversky 发表了《前景理论：风险下的决策分析》（Prospect Theory:\
  \ An Analysis of Decision under Risk），利用认知心理学解释了经济决策与新古典理论之间的各种分歧。前景理论有两个阶段：编辑阶段和评估阶段（对\
  \ Kahneman 和 Tversky 工作的优秀描述出现在 Michael Lewis 的著作《反转项目》（The Undoing Project，2016）。\n\
  \n在编辑阶段，风险状况通过各种启发式方法被简化。在评估阶段，风险选项使用多种心理原则进行评估：\n\n*   **参考依赖**：在评估结果时，决策者会考虑一个“参考点”。将结果与参考点进行比较，高于则分类为“收益”，低于则为“损失”。从攻击或防御的角度来看，参考点被估算为成本。\n\
  *   **损失厌恶**：对损失的规避大于收益。在 1992 年的论文中，Kahneman 和 Tversky 发现损失厌恶系数约为 2.25；这意味着损失带来的痛苦是同等收益的\
  \ 2.25 倍。\n*   **非线性概率加权**：决策者会高估小概率而低估大概率——这产生了倒 S 型“概率加权函数”。\n*   **收益和损失的敏感性递减**：相对于参考点的收益和损失规模增加时，其边际影响会下降。\n\
  \n23.2 效用\n\n效用（Utility）是英语中最有趣的词之一，具有许多内涵。在我们的情况下，它不是指棒球后卫，也不是指社区服务的分配。\n\n在广义经济学特别是行为经济学中，效用概念用于表示价值或意义。该词最初由\
  \ 19 世纪中叶的两位经济学创始人杰米·边沁（Jeremy Bentham）和约翰·斯图特·米尔（John Stuart Mill，1863）引入，在他们的背景下，效用主义描述了对价值的衡量。在现代经济理论中，效用已演变为代表消费者对一组经济选择的偏好的函数。\n\
  \n如果你有一组潜在的经济选项，并且对这些偏好有一种排序方法，效用函数就可以为每个选项分配一个数值；那么，当且仅当你偏好选项 `a` 而于选项 `b` 时，你可以说\
  \ `a` 被分配的数值大于 `b`。\n\n当你面临这种有限数量的选择时，选择最偏好选项的个体必然选择了使相关效用函数最大化的选项。\n\n考虑一个例子来说明在效用理论建立之前关于效用最大化的思考。这个例子有望引导我们理解这种理解经济选择的方法中产生的矛盾。\n\
  \n假设我们对不同水平的商品进行估值。为了说明这个例子，让我们选择几双鞋，并假设它们的价值如下（图 23.1）：\n\n| 人字拖 | $10 |\n| ---\
  \ | --- |\n| 凉鞋 | $20 |\n| 高跟鞋 | $30 |\n| 正皮鞋 | $40 |\n\n经典效用理论认为，如果你有一系列选择，且每个选择的增加量都相同，你仍然会选择同一种产品。因此在这个例子中，我们定义\
  \ `u(Flip-flops)` = $10，`u(Sandals)` = $20。\n\n23.3 Allais 对效用的挑战\n\n然而，法国研究者莫里斯·阿莱斯（Maurice\
  \ Allais，1953）进行了多项实验，基本上推翻了经典理论。此外，阿莱斯的研究得到了许多学者的支持和证实，最著名的以色列科学家丹尼·卡尼曼（Daniel\
  \ Kahneman）和阿莫·特沃斯基（Amos Tversky）。我们首先证明人们给予确定结果比比仅仅可能的结果更大的权重（确定性效应）。以下是模仿阿莱斯设置的问题：\n\
  \n问题 23.1：在 A 和 B 之间选择，你会获得报酬。\n\n| 选择 A | 概率 | 选择 B | 概率 |\n| --- | --- | --- |\
  \ --- |\n| $2500 | 0.33 | $2400 | 0.66 |\n| $0 | 0.66 | $0 | 0.01 |\n\nN = 72 名受者的测试结果：18%\
  \ 对 72%\n\n问题 23.2：在 C 和 D 之间选择。\n\n| 选择 C | 概率 | 选择 D | 概率 |\n| --- | --- | ---\
  \ | --- |\n| $2500 | 0.33 | $2400 | 0.34 |\n| $0 | 0.67 | $0 | 0.66 |\n\nN = 72\
  \ 名受者的测试结果：83% 对 17%\n\n我们将展示这些结果所体现的悖论。我们假设更经常被选中的特定选择是由 N 名受者的多数结果指示的。在问题 23.1\
  \ 中，18% 的受者选择了 A，82% 的选择了 B。对于同样的受者，在面对问题 23.2 时，83% 的受者选择了 C，17% 的选择了 D。\n\n显然，受者在问题\
  \ 23.1 中以绝多数选择了 B。而这批相同的受者在面对问题 23.2 时，更加果断地选择了 C 而非 D。这种偏好模式违反了期望效用理论。\n\n根据该理论，在\
  \ `u(0)` = 0 的情况下，问题 23.1 既然受者偏好 B 而非 A，意味着：\n\n`0.33u(2500) + 0.66u(2400) < u(2400)`\n\
  \n而问题 23.2 中的偏好则意味着反的不不等式：\n\n`0.33u(2500) > 0.34u(2400)`\n\n\n\n\n请注意，问题 23.2 是通过消除问题\
  \ 23.1 中所考虑的两种前景中赢得 $2400 的 0.66 概率而得出的。换句话说，从 `A` 和 `B` 到 `C` 和 `D` 的选择表示是一个常数。古典效用理论会认为，由于选择之间的关系没有改变，对结果的偏好也不会改变。但当这种变化将前景的性质从确定收益变为概率性收益时，其产生的期望性下降比原始前景和减少后的前景均为不确定时更大。下面提供了一个仅涉及两个结果赌博的相同现象的简单演示。该示例也基于阿莱斯（Allais）。\n\
  \n### 问题 23.3 在以下之间选择：\n\n| 选项 A | 选项 B |\n| --- | --- |\n| 收益 | 概率 | 收益 | 概率 |\n\
  | $4000 | 0.80 | $3000 | 1.00 |\n| $0 | 0.20 | | |\n| 使用 `N = 95` 名受试者进行实验的结果： |\
  \ | |\n| 20% | 80% | |\n\n### 问题 23.4 在以下之间选择：\n\n| 选项 A | 选项 B |\n| --- | --- |\n\
  | 收益 | 概率 | 收益 | 概率 |\n| $4000 | 0.20 | $3000 | 0.25 |\n| $0 | 0.80 | $0 | 0.75\
  \ |\n| 使用 `N = 95` 名受试者进行实验的结果： | | |\n| 65% | 35% | |\n\n同样，根据经典效用理论，在 `u(0) =\
  \ 0` 的情况下，问题 23.3 意味着受试者偏好选项 `B` 而非选项 `A`：\n\n`0.80u(4000) < u(3000)`\n\n而问题 23.4\
  \ 中的偏好意味着反向不等式：\n\n$$\n\\begin{matrix} \\left. {}{}0.\\text{2}0\\text{u(4}000\\\
  text{)}\\\\, > \\\\, 0.\\text{25u(3}000\\\\text{)}\\\\,\\\\Rightarrow\\\\, 0.\\\
  text{8}0\\text{u(4}000\\\\text{)}\\\\, > \\\\\\,\\text{u(3}000\\\\text{)} \\right.\
  \ \\\\ {\\\\quad(\\text{multiply}\\\\,\\\\text{each}\\\\,\\\\text{side}\\\\,\\\\\
  text{by })} \\\\ \\\\ \\end{matrix}\n$$\n\n在这对问题以及本节的所有其他问题对中，几乎有一半的受访者（45%）通过从一方切换到另一方违反了期望效用理论。为了证明问题\
  \ 23.3 和 23.4 中的偏好主模式与该理论不兼容，设定 `u(0) = 0`，并回选择 `B` 意味着 `u(3000)/u(4000) > 4/5`，而选择\
  \ `C` 则意味着反向不等式。\n\n问题 23.5 和 23.6 的示例表明，即使结果是非货币的，也存在相同的效应，即确定性效应。\n\n### 问题 23.5\
  \ 在以下之间选择，你将获得给定金额的非货币收益（尽管受试者可以将其转换为货币价值），取决于相应的概率。\n\n| 选项 A | 选项 B |\n| --- |\
  \ --- |\n| 收益 | 概率 | 收益 | 概率 |\n| 意大利三周游 | 0.50 | 英国一周游 | 1.00 |\n| 不旅行 | 0.50 |\
  \ 不旅行 | 0.00 |\n| 使用 `N=72` 名受试者进行实验的结果： | | |\n| 22% | 78% | |\n\n### 问题 23.6 在以下之间选择，你将获得给定金额的非货币收益，取决于相应的概率。\n\
  \n| 选项 A | 选项 B |\n| --- | --- |\n| 收益 | 概率 | 收益 | 概率 |\n| 意大利三周游 | 0.05 | 英国一周游\
  \ | 0.10 |\n| 不旅行 | 0.95 | 不旅行 | 0.90 |\n| 使用 `N=72` 名受试者进行实验的结果： | | |\n| 67% |\
  \ 33% | |\n\n当存在显著概率的结果，相对于存在极微概率的可能时，也证明了相同的效应。当结果可能但并非必然时，大多数人选择收益更高的前景。\n\n###\
  \ 问题 23.7 在以下之间选择，你将获得给定金额的收益，取决于相应的概率。\n\n| 选项 A | 选项 B |\n| --- | --- |\n| 收益\
  \ | 概率 | 收益 | 概率 |\n| $6000 | 0.45 | $3000 | 0.90 |\n| $0 | 0.55 | $0 | 0.10 |\n\
  | $0 | 0.01 | | |\n| 使用 `N=66` 名受试者进行实验的结果： | | |\n| 14% | 86% | |\n\n### 问题 23.8\
  \ 在以下之间选择，你将获得给定金额的收益，取决于相应的概率。\n\n| 选项 A | 选项 B |\n| --- | --- |\n| 收益 | 概率 | 收益\
  \ | 概率 |\n| $6000 | 0.001 | $3000 | 0.002 |\n| $0 | 0.999 | $0 | 0.998 |\n| 使用 `N\
  \ = 66` 名受试者进行实验的结果： | | |\n| 73% | 27% | |\n\n注意，在问题 23.7 中，获奖概率是巨大的（0.90 和 0.45），大多数人选择了概率更大的前景。在问题\
  \ 23.8 中，存在获奖可能，尽管两个前景的获奖概率都微乎其微（0.002 和 0.001）。在这种可能但并非必然的情况下，大多数人选择了收益更高的前景。\n\
  \n## 阿莱斯-卡尼曼-沃斯基方法在网络安全的应用\n\n现在考虑网络安全环境中开发类似的选择问题。假设我们有一个攻击者，确定了一个潜在受害者作为勒索软件攻击的目标，黑客可以为索金分配货币价值。\n\
  \n攻击者可以发起勒索软件攻击，他或她可以估计获得索金的概率。他或她可以配置攻击索要 $2400 或 $2500 的索金，并估计较低水平的索金一方面（选项 `A`）获得\
  \ $2400 的概率为 66%，但获得较高索金的概率仅为 33%，完全失败的概率为 1%。或者攻击者的第二个选择是采用 $2400 的索金请求，据认为该请求成功的概率为\
  \ 100%。\n\n### 问题 23.9 在以下之间选择，你将获得给定金额的收益，取决于相应的概率。\n\n| 选项 A | 选项 B |\n| --- |\
  \ --- |\n| 收益 | 概率 | 收益 | 概率 |\n| $2500 | 0.33 | $2400 | 1.00 |\n| $2400 | 0.66\
  \ | | |\n| $0 | 0.01 | | |\n\n另一方面，攻击者可以做出以下选择：\n\n### 问题 23.10 在以下之间选择：\n\n| 选项\
  \ C | 选项 D |\n| --- | --- |\n| 收益 | 概率 | 收益 | 概率 |\n| $2500 | 0.33 | $2400 | 0.34\
  \ |\n| $0 | 0.67 | $0 | 0.66 |\n\n这些数字在第 23.3 节的示例中看起来很熟悉，这当然不是偶然。尽管这项实验尚未进行（据我们所知），但如果结果与阿莱斯-卡尼曼-沃斯基的数据相似，那么在结合行为经济学背景下比较网络安全经济行为时将非常有用。\n\
  \n## 助推（Nudge）\n\n助推是一种微妙的（或可能是隐性的）影响行为的机制，而不是通过教育或立法。助推是行为科学、政治理论和经济学中的一个概念，通过正强化和间接建议来影响群体或个人的行为和决策。助推与其他实现合规的方式形成对比。这一概念影响了英国和美国的政治家。范围内国家层面（英国、德国、日本等）以及国际层面（经合组织、世界银行、联合国）都存在多个助推部门。\n\
  \n该术语最初的形式和相关原则是由詹姆斯·威尔克（James Wilk）在 1995 年以前在控制论中开发的，被布鲁内大学教授 D. J. 斯图特（D. J.\
  \ Stewart）描述为“助推的艺术”，有时被称为微助推（Potter, 2018）。它还借鉴了追溯到格雷戈里·贝叶森（Gregory Bateson）的临床心理治疗方法论影响。助推被认为针对特定人群的“微目标设计”。\n\
  \n\n\n助推理论或许随着理查德·赛勒（Richard Thaler）和卡斯·桑斯坦（Cass Sunstein）的著作*助推：改善健康、财富和幸福决策》（2008\
  \ 年）首次广为人知的。它在美私营部门和公共卫生领域的政治家中也获得了关注。作者将在不强制的情况下影响行为称为`自由意志的家长主义`，并将影响者称为`选择架构师`。赛勒和桑斯坦对他们的概念定义为：\n\
  \n助推，正如我们使用的这个术语，是指选择架构的任何方面，它以可预测的方式改变人的行为，而不禁止任何选项或显著改变他们的经济激励。要被视为仅仅是助推，这种干预必须是易于且廉价避免的。助推不是指令。将水果放在视线齐的高度被视为助推，而禁止垃圾食品则不是。\n\
  \n基于行为经济学，助推更广泛地应用于影响行为。以下是“助推理论”应用结果的几个例子：\n\n*   最经常被引用的助推例子是在`阿姆斯特丹史基霍尔机场`的`男厕所小便池`中刻上苍蝇的图像，其目的是“提高准度”。男士现在有了可以准的目标——即使在潜意识中——溅出的比例减少了\
  \ 80%。\n*   桑斯坦和赛勒敦促将更健康的食物放置在视线水平，以增加个人选择该选项而非不健康选项的概率。\n*   同样，另一个影响积极结果的助推例子是改变商店内垃圾食品的位置，让水果和其他健康选项位于`收银台`旁，而将垃圾食品移到商店的另一个部分。\n\
  *   在人们必须主动`加入`（opt in）”器官捐献的国家，通常登记捐献的人口最多占 30%。在人们被自动纳入器官捐献计划并必须实际`退出`（opt out）”的国家，只有约\
  \ 10%到 15%的人会选择退出，这提供了大得多的器官捐献者库。\n*   美国杂货店`Pay & Save`在地面上放置了指向水果蔬菜区的绿色箭头。他们发现购物者每\
  \ 10 次就有 9 次顺着箭头走——他们的新鲜农产品销售额飙升。\n*   在一些学校，食堂的队列线经过精心设计，向学生展示更健康的食物。一项旨在确定其效果的实验显示，在健康队列的学生做出了更好的食物选择，健康食物的销售额增加了\
  \ 18%。\n*   在英国，欠税的人收到了提醒，这些提醒的措辞使用了社会规范信息。诸如“您所在地区每 10 个人就有 9 个人按时缴税”之类的短语。通过让他们看起来像异类，收到这些信的人的缴税率比常水平高了\
  \ 15%。\n\n2008 年，美国任命了协助该理论开发的桑斯坦担任信息和监管事务办公室的主管。助推理论的显著应用包括 2010 年在`英国内阁办公室`成立的`英国行为洞察小组”（通常被称为“助推小组”），由大卫·哈尔珀恩（David\
  \ Halpern）领导。首相大卫·卡梅隆和总统巴拉克·奥巴马在任期内都寻求利用助推理论来推进国内政策目标。在澳大利亚，新南威尔士州政府建立了一个`行为洞察`实践社区。现在已有超过\
  \ 80 个国家使用了行为洞察。\n\n## 23.6 助推的一种应用\n\n假设`var1 = var2 + var3`。在表达式`var1 = var2 +\
  \ var3`中，加法运算符`+`将`var2`和`var3`相加，产生和`var1`。\n\n在`List.of(arg0, arg1, arg2)`中，`List`接口工厂方法`of()`接受一系列元素，返回一个包含这些元素的只读列表。\n\
  \n然后我们调用`cmd`命令：`cmd arg0 arg1 arg2`。\n\n```\nif (condVar > someVal) {console.log(\"\
  xxx\")}\n```\n\n## 23.7 最大化者还是满足者？\n\n心理学家告诉我们，决策方法倾向于分为两类：你要么是最大化者，或是满足者。最大化者是追求最大利益的人。满足者是标准适中的人。\n\
  \n### 23.7.1 满足者\n\n“满足”（satisficing）概念最早由诺贝尔经济奖得主赫伯特·A·西蒙（Herbert A. Simon）提出，他通过结合“satisfying”（满意）和“sufficing”（足够）创造了这个词。他提出这一观点是为了解释一种特定的形式（Simon,\
  \ 1958）。他认为当满足者面临决策时，他们会考虑想要获得或保留什么，然后评估选项以找到符合要求的解决方案。\n\n例如，在选择购买汽车时，满足者玛丽会考虑车辆的使用（长途通勤），并决定希望这辆新车要省油。她可能还决定座椅要有加热功能，然后她看了三辆待售的车：\n\
  \n*   1 号车：带有加热座椅但并不省油的新车。\n*   2 号车：省油且带有加热座椅的旧车。\n*   3 号车：省油且拥有加热座椅和宽敞内饰，仅比 2\
  \ 号车贵一点。\n\n玛丽会排除 1 号车，因为对于长途通勤来说油耗太高。在 2 号车和 3 号车之间，她可能会认为第三车的额外空间是不必要的且奢侈的额外支出，从而选择购买\
  \ 2 号车，因为它符合她的初始决策标准。\n\n### 23.7.2 最大化者\n\n与满足者一样，最大化者在决策时会将选项缩小到满足他们核心需求的范围。但随后他们会追求能够提供最大利益或最高效用的选项。如果我们上一个例子中的玛丽是一个最大化者，她可能会想要多花一点钱买\
  \ 3 号车以获得额外的空间，无论她通勤时是否真的需要那些额外的空间。\n\n最大化者在决策时会给自己设定高标准并努力实现它们，但在未能实现时往往会感到失望，纠结于错过了什么，而不是拥有了什么。相比之下，满足者会对所选选项感到满意，即使它不是他们理想的完美选项。\n\
  \n\n\n\n作为对我们之前关于性别章节的补充，有研究表明，“满意满足（satisficing）的概念……比选择理论或约束理论更能观察女性工作生活的合适方式”\
  \ (Corby and Stanworth, 2009)。\n\n## 23.8 有限理性\n\n有限理性是一种观点，认为个人在做出决策时，其理性受到决策问题的困难程度、大脑的认知局限性以及做出决策可用时间的限制。在这种观点下，决策者充当了上文定义的“满意者”（satisficers），寻求的是满意的解决方案而非最优解决方案。西蒙（Simon）提出有限理性作为决策数学建模的替代基础，这种建模被应用于经济学、政治学及相关学科。它补充了“作为优化的理性”，后者将决策视为一个根据给定可用信息寻找最优选择的完全理性过程。西蒙使用了一把剪刀的类比，其中一片刀片代表人类人类的“认知局限性”，另一片代表“环境结构”，说明了人类如何通过利用环境中已知的结构规律来弥补资源的限制。\n\
  \n这意味着人类会采取推理捷径，这可能导致次优的决策。行为经济学家致力于绘制代理人所使用的决策捷径图，以提高人类决策的有效性。这一理念的一种处理来自上述讨论的助推理论（nudge\
  \ theory）。孙斯坦（Sunstein）和塞勒（Thaler）建议根据人类代理人的有限理性来修改选择架构。\n\n行为经济学的应用包括用于人工智能和机器学习的消费者决策过程建模。\n\
