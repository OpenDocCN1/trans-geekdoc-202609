  \ | | |\n\n## 7.6\n在电影《战争游戏》中，有一个场景显示了一台巨大的计算机 WOR，它通过数字所示的数字转盘以高速旋转来破解密码，计算机锁定在第一个字符，然后是第二个字符，以此此类推。讨论这种破解密码的方法。\n\
  \n## 7.7\n考虑 `RSA` 令牌。具有六位数显示屏，每分钟更改一次，需要多久显示屏才会重复？\n\n## 7.8\n描述一种“三因子身份验证”模型。\n\
  \n## 7.9\n假设你是一个商人，决定使用生物识别设备来验证在你的商店进行信用卡购买的人。你可以选择两个不同的系统：系统 A 的欺诈率（接受错误的 ID 视为正确的）为\
  \ 1%，侮辱率（接受虚假的 ID 视为真实的）为 5%，而系统 B 的欺诈率为 5%，侮辱率为 1%。你会选择哪个系统？为什么？\n\n## 7.10\n我们有一个生物识别注册系统，注册了四个主体：Alice、Bob、Caroline\
  \ 和 Dan。数据库读取如下：\n\n| | | | |\n| --- | --- | --- | --- |\n| Alice | 1000 | 1110\
  \ | 1010 |\n| Bob | 0111 | 0100 | 1001 |\n| Caroline | 0101 | 0101 | 1001 |\n| Dan\
  \ | 1110 | 0010 | 0110 |\n| x | 0101 | 0101 | 1101 |\n\n如果我们知道这是一个合法的主体，它是谁？为什么？\n\
  \n现在假设一个外部用户已满足身份验证要求并进入系统。尽管对于我们许多人来说，我们可能拥有一台供一人访问的个人计算机，但在网络环境中，常态是同一个环境中存在多个主体，拥有不同的资源集（如文件或运行各种类型软件的权限）。此外，有许多主体同时参与的环境可能是单台多用户计算机（主机），或者可能是一个网络化环境。\n\
  \n一种至少描述了该问题的早期方法是称为 Lampson 访问控制矩阵的方法（Lampson, 1971）。在这样的系统中，多用户环境中的实体被称为 `subjects`（主体）和\
  \ `objects`（对象）。`subjects` 是将请求特定资源的实体，而 `objects` 是被请求的资源。`subjects` 的示例是用户、需要数据的可执行程序或其他种的进程。`objects`\
  \ 的示例是文件、磁盘驱动器、要运行的可执行程序或打印机。在复杂的系统中，存在成千上万个主体或对象并不罕见。在 Lampson 模型中，维护一个矩阵，每个主体在矩阵中占一行，每个对象占一列。当系统中发生操作时，可能会有某个主体对构成某个对象的资源提出请求。管理系统或操作系统必须确定此请求是否合法。系统通过检查矩阵中与该主体和对应对象对应的元素来确定，该矩阵元素的内容将决定是否接受或拒绝请求。在这种背景下，必须解决授权问题。假设用户请求访问特定文件。通过什么机制可以确保特定用户具有读取、写入或删除该文件的权限，无论该文件位于环境中的何处？长期以来，解决这个问题有很多方法。两种标准方法被称为维护访问列表（access\
  \ lists）或能力列表（capabilities）。\n\n### 表 8.1 Lampson 矩阵\n\n| | 对象（资源） | 列索引 | |\n|\
  \ --- | --- | --- | --- | --- |\n| | 操作系统 | 库存程序 | 设备数据 | 薪资数据 |\n| 主体（用户） | Mary\
  \ | rx | rx | r | --- | --- |\n| 行索引 | George | rx | rx | r | rw | rw |\n| | Susan\
  \ | rwx | rwx | r | rw | rw |\n| | 库存程序 | rx | rx | rw | rw | rw |\n\n\n\n\n如上所述，Lampson\
  \ 模型在这些时期往往非常难以管理，因为即使只有 1000 个主体和 1000 个对象，矩阵也将有一百万个条目需要搜索，以确定任何事务的合法性。\n\n## 8.2\
  \ 安全级别\n\n复杂的现代环境倾向于有多种表示访问级别的方法，超出了上述的 `UNIX` 模型的范围。我们中的许多人会熟悉政府或军事系统中特定的访问级别。在最简单的形式中，这些级别可以描述为：绝密（Top\
  \ Secret）、秘密（Secret）、机密（Confidential）和非密（Unclassified）。\n\n在这样的系统中，这些级别应用于每个主体和对象。然后接受或拒绝特定请求的方式将遵循此层次结构：\n\
  \n绝密 > 秘密 > 机密 > 普通\n\n实现此类层次结构的系统通常被称为多级安全模型（MLS）。实现此类模型的早期方法是所谓的贝尔-拉帕杜拉模型（Bell-LaPadula\
  \ model），它初看起来是矛盾的，但实际上它一直是许多现代计算环境的基础（Bell and LaPadula, 1973）。Bell-LaPadula 模型最简单的形式遵循以下规则：\n\
  \n- 分类适用于对象\n- 许可适用于主体\n- 美国国防部使用四个级别的分类/许可级别：\n    - 绝密（Top secret）\n    - 秘密（Secret）\n\
  \    - 机密（Confidential）\n    - 非密（Unclassified）\n\nBell-LaPadula (BLP) 安全模型旨在表达\
  \ MLS 的核心需求。BLP 的主要关注点是机密性，以防止未经授权的读取。记住 `O` 是对象，而 `S` 是主体。\n\n对象 `O` 具有分类，而主体 `S`\
  \ 具有许可。对象的安全级别用 `L(O)` 表示，主体用 `L(S)` 表示。\n\nBLP 规则包括\n- 简单安全条件：当且仅当 `L(O) ≤ L(S)`\
  \ 时，`S` 可以读取 `O`\n- *-Property（星型属性）：当且仅当 `L(S) ≤ L(O)` 时，`S` 可以写入 `O`\n\n作为一种缩写术语，这通常被称为“不准向上读，不向下写”。\n\
  \n## 8.3 部分序与全序\n\n在许多授权系统中，用户不仅具有如上所述的安全级别，还具有涉及给定安全级别下用户子集的次要授权级别，这是很正常的。例如，一些具有“秘密”许可的用户可能被分配在一起工作同一个项目，但所有其他未参与该项目的具有“秘密”许可的用户不需要该项目开发过程中所包含的信息。这就是所谓的“知情原则”（need-to-know\
  \ principle）。因此，在这种情况下，在该项目工作的用户必然具有“秘密”许可，但还需要是分配给特定项目组的成员。因此，该环境中任何人的完整安全状态将同时需要许可级别以及该用户所属的组的列表。\n\
  \n因此，当主体提出访问给定对象的请求时，系统必须检查各自的安全级别。总的安全级别被描述为“全序”（total order）。换句话说，始终可以确定访问：机密用户永远无法读取秘密对象；绝密主体可以读取非密文件；秘密用户可以写入绝密对象。\n\
  \n然而，涉及组结构的权限构成了所谓的“部分序”（partial order）。考虑部分序最简单的方法是使用韦恩图。假设我们在韦恩图中拥有如[图 8.1] 所示的集合。如果图中的一个集合完全被另一个包围，则它包含另一个；换句话说，一个集合是另一个的子集。我们通常使用符号\
  \ `⊆` 表示这种集合包含关系（Wolfram, 2018）。\n\n![](img/93644.jpg)\n\n然而，如果两个子集重叠但一个不完全包含另一个，则不存在包含关系。出于这个原因，我们将这种排序描述为部分序。\n\
  \n考虑这样一个例子：团队被分为{红、绿、黄}组， `A` 属于{红、绿}组，而对象 `B` 属于{蓝、绿}组。由于两个子集重叠但一个不完全包含在另一个内，那么\
  \ `A` 读取 `B` 的请求或 `A` 写入 `B` 的请求都不会被允许。\n\n## 8.4 隐蔽道\n\n尽管访问系统中涉及了保护措施，总是存在可以绕过这些保护的机制。这些通常被称为“隐蔽道”（covert\
  \ channels）。隐蔽道通常定义为系统设计者无预期的通信路径（Techopedia, 2018）。\n\n在多级安全系统中可能存在这样一个例子。假设用户\
  \ George 具有绝密许可，而另一个用户 Phyllis 具有机密许可。此外，假设文件空间是共享的。在这种情况下，George 创建了一个名为 `ABC.txt`\
  \ 的文件，由于是其创建的，将被分配绝密级别。当然，只有机密许可的 Phyllis 无法读取该文件。然而，为了让 George 逐位向 Phyllis 通信，Phyllis\
  \ 每分钟检查一次目录。如果第一分钟 看到文件存在，她记录“1”。如果一分钟后 George 删除了文件而 Phyllis 再次检查——没有看到文件——她将记录“0”。然后，George\
  \ 可能再次创建文件，这样下一分钟 Phyllis 将看到文件存在并记录“1”。因此，在例如 60 分钟内，George 实际上可以泄露 60 位比特的消息。\n\
  \n以类似的方式，打印队列、`ACK` 位、Ping 或 `TCP` 网络包中的空闲位置也可以用于类似的隐蔽信息（见图 8.2）。\n\n![](img/008x002_fmt.jpeg)\n\
  \n有人向我们描述了南非罗本岛监狱的真实案例，曼德拉在那里作为政治犯人被关押了 20 多年。囚犯被分成若干小组，但为了娱乐，他们被允许用旧的网球打网球。监狱守卫认为囚犯球技很烂，因为他们总是把球击到隔壁单元区域。但他们将信息隐藏在旧网球中，实际上充当了嵌入网球信息的隐蔽道。\n\
  \n再考虑一个隐蔽道的例子。假设我们有一个 100MB 的绝密文件，在绝密级别上以未加密的形式存储。然而，加密版本可能存储在非密级别，以便从一个系统传输到另一个系统。这不会产生安全风险，因为我们假设没有密钥的人发现这个加密版本是毫无用的。然而，密钥（当然存储在绝密级别）可能只占用几百个比特。因此，通过如上所述的方法，从绝密级别逐位泄露到非密级别，可以在几分钟内让非密级别获得完整的密钥，并获得解密\
  \ 100MB 文件的能力。\n\n## 8.5 推论控制\n\n\n\n\n对于许多人来说，一个主要应用是在大型数据库中使用和访问它，例如企业数据库或大学数据库。数据库的目的是允许多个用户根据上述描述的访问规则，从数据库中读取或修改信息。然而，对数据库的访问并不是固定在某一时刻的。任何具有提交数据库查询能力的用户都可能在无意中（或可能是有意地）获得该用户可能被禁止直接访问的信息。考虑以下这个来自大学数据库的示例：\n\
  \n问题：XYZ 大学女性心理学教授的平均薪水是多少？\n\n答案：$95,000\n\n问题：XYZ 大学有多少位女性心理学教授？\n\n答案：1\n\n由于这两个查询的结果，特定的信息已经从对一般性问题的回答中泄露了！\n\
  \n## 8.5.1 推断控制与研究\n\n医疗记录极具隐私性，但对于流行病学研究具有至关重要的价值。问题在于：我们如何让这些医疗信息的聚合数据供流行病学研究使用，同时保护个人的隐私？或者，等效地说，我们如何在不泄露特定信息的情况下允许对此类数据的访问？\n\
  \n## 8.6 推断控制的简单答案\n\n我们可以从医疗记录中删除姓名。不幸的是，仍然可能很容易从这些“匿名”数据中获取特定信息，LaTanya Sweeney\
  \ (2000) 对此进行了详尽的记录，她证明了美国约 87% 的人口仅通过三项广泛可用的数据`{ 性别、出生日期（包括年份）和居住地的五位邮政编码 }` 就可以被识别。\n\
  \n因此，删除姓名是不够的。\n\n## 8.7 稍不那么幼稚的推断控制：查询集大小控制\n\n在这种响应查询的方法中，如果响应集的大小太小，则不返回答案。\n\
  \n一个成熟的原则是 `N-k% 优势规则`。换句话说，如果 `k%` 或更多的响应由 `N` 或更少的记录贡献，则不发布该统计数据。这在某些情况下会失效，例如：比尔·盖斯社区的平均薪水。然而，这一过程可能会被两个协作提交旨在绕过此规则的查询所破解。\n\
  \n### 8.7.1 随机化\n\n你可以向数据中添加少量的随机噪声。然而，这适用于 `weight`（体重）、`age`（年龄，如 `45.2 years`）或\
  \ `height`（身高）等字段，但不能用于 `ZIP code`（邮编）、`gender`（由 `0` 或 `1` 表示）或 `ethnicity`（种族）——也就是说，整数值而非实数。\n\
  \n## 8.8 防火墙\n\n防火墙必须决定什么进入内部网络，允许什么出去。换句话说，防火墙旨在为网络提供访问控制（Cisco, 2018）。你可以将防火墙想象成门卫。要与执行官会面，首先联系门卫。门卫决定会议是否合理；此外，门卫还会过滤掉许多请求。假设你想见心理学系主任。门卫进行了一些过滤。防火墙有几类：\n\
  \n* 数据包过滤器\n* 状态检测数据包过滤器\n* 应用代理\n* 个人防火墙——用于单用户、家庭网络等。\n\n### 8.8.1 数据包过滤器\n\n\
  这种防火墙工作在网络层，它可以根据以下几项进行过滤：\n\n* 源 IP 地址\n* 目的 IP 地址\n* 源端口\n* 目的端口\n* 标志位位（`SYN`、`ACK`\
  \ 等）\n* 出站或入站\n\n## 8.9 入侵检测\n\n尽管有防火墙或其他入侵预防方法，坏人往往会进入系统。因此，如果我们假设系统会被攻破，我们应该寻找能够判断是否发生了此类渗透的系统。此类系统通常被称为入侵检测系统（`IDS`）（Cyberpedia,\
  \ 2018）。\n\n`IDS` 设计用于通过寻找“异常活动”来检测攻击。IDS 目前是一个非常热门的话题。IDS 设计用于通过寻找“异常活动”来检测攻击。IDS\
  \ 目前是一个非常热门的话题。入侵者是谁？可能是外部人员。入侵者会做什么？他们可能会执行已知的攻击。有两种主要的入侵检测方法：基于签名的 `IDS` 和基于异常的\
  \ `IDS`。\n\n## 8.10 签名检测系统\n\n这里是签名检测的一种示例：密码破解攻击可能正在进行。签名 `IDS` 使用 `M seconds`\
  \ 内的登录尝试` 作为签名。如果 `N` 或更多登录尝试发生在 `M seconds` 内，签名 `IDS` 会发出警告。注意，这种警告是特定的。假设攻击者知道签名，他们可以在\
  \ `M seconds` 内尝试 `N - 1` 次登录！在这种情况下，签名检测会减慢攻击者，但可能无法阻止他们。签名检测的缺点包括：\n\n* 签名文件必须保持更新\n\
  * 签名数量可能很大\n* 只能检测已知攻击\n* 已知攻击的变体可能无法检测\n\n## 8.11 异常检测系统\n\n异常检测系统寻找异常或异常的行为。在尝试开发此类系统时，面临着至少两个挑战：首先，对于该系统来说什么是“正常”？然后，异常距离正常有多远？这种方法意味着我们必须使用某些统计测量，例如标准差和方差。通常，平均值定义了正常，标准差或方差指示异常离正常有多远。\n\
  \n问题变成了：我们如何衡量“正常”？我们需要在“代表性”行为期间分析系统，而不是在攻击期间，否则攻击看起来是正常的。我们如何衡量“异常”？当然，异常是相对于某些“正常”，异常指示可能的攻击。\n\
  \n假设我们监控三个命令：`open`、`read`、`close`。在正常使用下，我们观察到 Ellen 经常执行以下序列：\n`open, read, close,\
  \ open, open, read, close, ...`\n\n在六种可能的排序对中，有四对对 Ellen 来说是“正常”的：\n`(open,read)`,\
  \ `(read,close)`, `(close,open)`, `(open,open)`。\n\n我们可以使用这些序列识别异常活动吗？我们监控三个命令：`open`、`read`、`close`。如果异常对与正常的比例“过高”，我们就对可能的攻击发出警告。\n\
  \n\n\n最近，Ellen 以速率 `An` 访问了文件 `Fn`（见表 8.3）。\n\n| 表 8.3 时间 $t2$ 时四种用例的异常检测 |\n| ---\
  \ |\n| A0 || A1 || A2 || A3 |\n| 0.10 || 0.40 || 0.30 || 0.20 |\n\n这是“正常”用用法吗？为了估计这一点，我们计算其与平均值的距离：\n\
  \n`S = (H[0] − A[0])² + (H[1] − A[1])² +��⋯+ (H[3] − A[3])² = 0.02`\n\n我们做出判断：如果\
  \ `S < 0.1`，则该行为是正常的。在这种情况下，`S \\= 0.02 < 0.1`，因此这是正常的。\n\n### 问题：我们如何处理随时间变化的用例？\n\
  \n为了让“正常”适应新的用例，我们按如下更新长期平均值：\n\n`H[n] = 0.2A[n] + 0.8H[n]`\n\n此时，`H0` 和 `H1` 保持不变，`H2\
  \ \\= 0.2 × 0.3 + 0.8 × 0.4 \\= 0.38`，且 `H3 \\= 0.2 × 0.2 + 0.8 × 0.1 \\= 0.12`\n\
  \n长期平均值的更新结果见表 8.4。\n\n| 表 8.4 异常检测中的平均值更新 |\n| --- |\n| H0 || H1 || H2 || H3 |\n\
  | 0.10 || 0.40 || 0.38 || 0.12 |\n\n更新后的长期平均值见表 8.5。\n\n| 表 8.5 异常检测的长期平均值 |\n|\
  \ --- |\n| H0 || H1 || H2 || H3 |\n| 0.10 || 0.40 || 0.38 || 0.12 |\n\n新的观测速率见表\
  \ 8.6。\n\n| 表 8.6 异常检测中的新观测速率 |\n| --- |\n| A0 || A1 || A2 || A3 |\n| 0.10 || 0.30\
  \ || 0.30 || 0.30 |\n\n这是正常用例吗？\n\n计算 `S \\= (H0 − A0)2+ ⋯ + (H3 − A3)2 \\= 0.0488`\n\
  \n由于 `S \\= 0.0488 < 0.1`，我们认为这是正常的。\n\n我们再次通过 `Hn \\= 0.2An + 0.8Hn` 更新长期平均值。\n\
