  \n## 问题\n\n16.1 阅读《Mind》杂志上图灵的文章。读者在 (a) 1950 年和 (b) 今天会如何回应？\n\n16.2 尝试 Eliza。在\
  \ Eliza 重复之前，你问了多少问题？\n\n16.3 为《危险边缘!》设计三个问题，让人类参赛者的回答可能比 Watson 更快或更准确。\n\n16.4\
  \ 给两个使用不同密钥加密同一消息的示例。使用你喜欢的加密方法。\n\n16.5 考虑开发你自己的性别图灵测试。列出五个可能区分女性或男性受访者的样本问题。\n\
  \n16.6 考虑开发一个年龄图灵测试。列出五个可能区分年轻或年老受访者的样本问题。\n\n16.7 进行“谁回答了这些问题”性别图灵测试。要得分，请将你的回复邮至\
  \ `waynep97@gmail.com`。发送一封两行的邮件。第一行名为 `F: x1, 2, x3, …`，第二行名为 `M: y1, y, y3, ….`。你将收到回复邮件。\n\
  \n16.8 结合 2019 年的背景，针对《Mind》杂志上图灵的文章，对提问者 C 为了确定隐藏主体而提出的问题进行评论。\n\n16.9 在 (A) 你自己的文章和\
