  \n\n\n直到最近，新奥尔斯市相邻最大的司法管辖区的警长一直公开表态，在他管辖区内白人为主的社区里，他的警察会例性地拦截由非洲裔美国人驾驶的车辆。\n\n因此在网络安全领域，有一点非常重要：开发画像分析方法（profiling\
  \ approaches）的标准需要对基于种族、族裔或其他个人可识别特征来归类某些类型的行为保持敏感，而不是基于行为而非个人特征来归类行为类型。\n\n为了说明，让我们采用图灵测试模型并将其应用到以下场景。\n\
  \n在第一种设定中，我们拥有一个环境：“分析者”坐在电脑前，而在房间的另一部分，“受试者”（分析者可见）也坐在另一台电脑前，双方进入对话，分析者试图确定受试者的某种行为模式。在这次对话中，分析者随着时间的推移注意到，每当受试者输入第三人称代词时，受试者都会输入“she”。分析者望向房间，感知到受试者是女性，并推导出受试者使用“she”而不是“he”的原因是受试者确实是女性。\n\
  \n作为同一实验的第二种设定，在这种情况下，与图灵模型一样，受试者位于分析者看不见的另一个房间内（Turing, 1950）。同样在对话中，分析者可能会感知到，第三人称代词始终使用“she”会得出受试者确实是女性的结论。\n\
  \n当然，情况可能是这样也可能不是，因为在第二种情况下，受试者可能做出了意识的决定——也许是为了欺骗分析者——始终使用“she”而不是“he”。无论如何，第一种设定中的分析者可能仅仅通过视觉外表就决定了受试者的性别，而不是通过对输入的消息进行分析。对于任何从实验第二种设定中得出的结论，都不可能出现这种情况。\n\
  \n## 5.1 网络安全背景下的画像\n\n网络攻击案例日益增多，迫切需要试图隔离出攻击的一的一个或多个潜在的实施者。\n\n在本书中，你将看到许多关于真实和虚构网络攻击的案例研究，这里描述的画像技术可能适用于确定潜在嫌疑人。然而，为了介绍这一主题，我们将使用一组著名的事件，可以将其描述为“索尼影业黑客事件”。\n\
  \n## 5.2 索尼影业黑客事件\n\n2015 年 10 月，消息传出，索尼正在开发一部名为《记者》（*The Interview*）的电影（Sony, 2018）。已知信息是这部电影的剧情是美国政府想雇用记者前往朝鲜采访该国总统——并以采访为掩护刺杀总统。\n\
  \n随着这一情节的泄露，朝鲜人——理所当然地愤怒——威胁说如果这部电影上映，将对索尼和美国进行报复。\n\n2014 年 11 月 24 日，一个自称为`Guardians\
  \ of Peace (GOP)`（和平守护者）的黑客组织泄露了索尼影业制片公司的机密数据。数据包括索尼影业员工及其家人的个人信息、员工之间的电子邮件、公司高管薪资信息、当时尚未发布的索尼电影拷贝以及其他信息。实施者随后使用了变种\
  \ `Shamoon wiper malware` 恶意软件删除了索尼的计算机基础设施（Alvarez, 2014）。\n\n同样在 2014 年 11 月，`GOP`组织要求索尼撤下《记者》，这是一部关于刺杀朝鲜领导人金正恩的喜剧片，并威胁要在放映该电影的电影院进行恐怖袭击。在主要的美国电影院链应对这些威胁选择不放映该电影后，索尼选择取消电影的正式首映和主流发行，转而直接进行数字发行，并在第二天进行有限院线放。\n\
  \n美国情报官员在评估了黑客攻击中使用的软件、技术和网络来源后，指控该攻击是由朝鲜赞助的。朝鲜否认了所有责任。\n\n### 5.2.1 攻击与实施者\n\n\
  黑客攻击的确切持续尚未知。一位自称执行了该攻击的`Guardians of Peace` 成员表示，在 2014 年 11 月被发现之前，他们已经拥有了一年的访问权限。该攻击是使用恶意软件进行的。\n\
  \n索尼在 2014 年 11 月 24 日（周一）获悉了这次攻击，因为此前安装的恶意软件导致许多索尼员工的电脑无法运行，并伴有`GOP`的警告以及黑客攻击期间获取的部分机密数据。几个与索尼相关的\
  \ Twitter 账号也被接管。在此之前，几位索尼影业高管在上周五（11 月 21 日）通过电子邮件收到了一封信息；这封信息来自一个名为“God’sApstls”（原文）的团体，要求“金钱补偿”。在攻击发生后的几天里，`GOP`开始泄露尚未发布的电影，并开始发布部分机密数据以吸引社交媒体网站的关注，尽管他们没有说明想要什么作为回报。\n\
  \n攻击泄露的其他邮件显示，电影和戏剧制作人斯科特·鲁丁（Scott Rudin）讨论了演员安吉莉娜·朱莉（Angelina Jolie）。在邮件中，鲁丁对朱莉的评价非常负面，因为朱莉希望大卫·芬奇（David\
  \ Fincher）执导她的电影《克利奥帕拉》。\n\n### 5.2.2 围绕《记者》的威胁\n\n12 月 16 日，黑客事件后`GOP`首次首次提到了即将上映的电影《记者》，并威胁要对该电影于\
  \ 12 月 18 日的纽约首映以及原定于 25 日的全美范围上映采取恐怖行动。索尼在第二天取消了院线放映。\n\n我们将在《记者》上映的时刻和地点向你们清晰展示，那些在恐怖中寻求乐趣的人将面临怎样的惨惨命运。很快，全世界都将看到索尼影业娱乐制作的一部多么糟糕的电影。世界将充满恐惧。记住\
  \ 2001 年 9 月 11 日。我们建议你远离那个时间的地点。（如果你的房子附近，你最好离开。）\n\n《记者》的影星塞斯·罗根（Seth Rogen）和詹姆斯·弗兰科（James\
  \ Franco）回应说，他们不知道这是否绝对由电影引起，但随后取消了除 2014 年 12 月 16 日计划中的纽约首映之外的所有与电影相关的媒体活动。\n\n\
  无疑，涉及朝鲜和其他威胁的所有宣传，以及索尼黑客事件带来的尴尬披露，引起了公众对该电影及其引发争议的高度关注。结果，许多原本愿意冒险去电影院看这部电影的人选择在安全的家里通过流媒体观看。\n\
  \n## 5.3 画像矩阵\n\n\n\n\n根据关于索尼黑客事件提供的信息，我们可以利用这一系列事件的信息来开发一个模型，尝试缩小此次黑客攻击潜在嫌疑人的范围，以及他们实施此攻击的动机。\n\
  \n画像分析矩阵法（profiling matrix approach）并不是一种能够得出确定性答案的方法，而是为研究人员提供了一种手段，将潜在嫌疑人及其相应的动机缩小到一个范围，从而有效地消除许多嫌疑。\n\
  \n### 构建嫌疑人列表\n\n首先，我们将建立一个潜在嫌疑人列表。这里的起步是尽可能收集有关被纳入或排除在嫌疑人之外候选人的信息。从上述案例来看，大多数人会会将朝鲜政府视为嫌疑人。然而，这里考虑的可能不是朝鲜政府本身（其可能具备也可能不具备所需的技术能力），而是代表其的成员。正如我们所说的，一个自称为`和平守护者`（Guardians\
  \ of Peace）的疑似黑客组织声称他们执行了索尼黑客攻击。然而，`和平守护者`此前并未被识别出来，因此它可能只是其他黑客组织的假名。`匿名`（Anonymous）组织也可能是嫌疑对象，因为它曾以某种理由声称过去在过去实施了许多其他黑客攻击。\n\
  \n通过对世界政治的任何分析可知，中国是与朝鲜关系最紧密的国家，而且已知拥有非常强大的技术能力。因此，认为也许是中国应其盟友朝鲜政府的要求而实施了攻击，并不合理。\n\
  \n但也有人对一名技术熟练的索尼员工产生过怀疑，她在许多文章中被称为`Lisa`。`Lisa`在涉案黑客攻击发生前不久被索尼解雇，众所周知她有执行黑客攻击的能力，并且可能对索尼有各种报复动机。\n\
  \n在任何竞争环境中，考虑这种可能性也是合理的，即索尼的竞争对手也可能具有损害索尼声誉的动机。因此，人们可以在嫌疑人列表中添加电影行业中与索尼竞争的其他其他公司。\n\
  \n在关于电影《记者》（*The Interview*）可能被撤映，或以可能损害其盈利能力的方式上映引发大量讨论时，那些可能从电影成功中获益的人——例如制片人和导演或主演演员——在减少或增加电影价值方面可能都有动机。这反过来可能会导致与电影直接相关的人获得更多或更少的利润。\n\
  \n最后的考虑可能是，索尼影视公司本身可能意识到，围绕电影上映制造巨大的争议（而这原本可能大部分不会引起注意），可能会为索尼带来更大的利润。\n\n因此，这项分析可能会得出如下的嫌疑人列表：\n\
  \n| 朝鲜 |\n| --- |\n| 和平守护者 |\n| 匿名 |\n| 中国 |\n| Lisa |\n| 制片、导演、演员 |\n| 索尼影视 |\n\
  \n下一步是开发一个矩阵，其中行和列将分别标记。首先，用上述描述的每一组嫌疑人填充矩阵的每一行。\n\n### 识别动机\n\n我们现在有了一份潜在的嫌疑人列表；我们的下一个任务是尝试识别这一系列事件动机的原因。可以想象，人们可能会识别出新的动机，而之前的嫌疑人（通过角色识别）可能无法对应这种动机。尽管如此，在许多情况下，通常可以将金钱作为一种潜在动机。在这种情况下，考虑到美国、朝鲜和中国的地位，政治也进入了其中。\n\
  \n当我们识别出将黑客攻击作为主要活动的群体时，我们应该考虑执行攻击是否是为了展示技术熟练程度——甚至是为了为未来的业务“广告”。报复通常是另一个动机，考虑到此案例中存在不满的前员工，这一点无疑是肯定的。工业竞争力通常是另一个潜在动机。\n\
  \n也许应该向列表中再添加一个候选人：考虑到索尼在经历了这一切争议后，这部电影的利润高得多，可以认为制造争议可能被视为一种让这一系列事件对索尼自身有利的潜在方式。\n\
  \n### 开发画像矩阵\n\n我们的下一步是创建画像矩阵的列。因此，我们列出已识别出的所有潜在动机，现在我们可以创建一个矩阵，其行由嫌疑人标记，列由潜在动机标记。所得画像矩阵如图\
  \ 5.1 所示。\n\n![](img/93105.jpg)\n\n因此，一旦我们确定了攻击的所有潜在动机，我们就定义了画像矩阵的列：\n\n分析的下一步是检查这个新形成的矩阵中的每个单元格，然后根据本案现有的所有文献证据，估计这个由对\
  \ `(犯罪者, 动机)` 定义的特定单元格成为最可能的有罪方及其理论依据的概率。\n\n例如，如果我们考虑`(朝鲜, 工业竞争)`这一对组合，我们可能会分配一个接近零的概率。同样地，`(Lisa,\
  \ 政治)`这一对的概率也会非常低。这种分析应该对矩阵中的所有单元格组合进行。在之前使用这种画像分析矩阵技术提供的课程中，学生被要求估计矩阵中每个单元格最可能的概率，然后获得集体判断；对每个学生定义的矩阵取平均值，以给出班级的回答。\n\
  \n后续是我们一个班级在更广泛的 11 × 13 或 143 单元格矩阵中开发的示例（图 5.2）。\n\n![](img/93143.jpg)\n\n在后面的章节中，建立画像矩阵的方法将扩展为双人零和游戏博弈论模型，以便从画像数据开发出解决方案。\n\
  \n### 5.4 — ABCD 分析\n\n分析安全环境中威胁水平的另一种方法是所谓的“ABCD”方法。这种方法源于刑事司法理论，试图根据复杂程度来定义攻击。作为一种简化，潜在的网络攻击或开发和利用这些攻击的黑客分为四类，其中最简单的攻击被归为“D\
  \ 级”，一直到由属于“A 级”攻击者实施的最复杂的攻击（表 5.1）。\n\n| 表 5.1 恶意软件分类：针对坏人的“ABCD”模型 |\n| --- |\n\
  | 犯罪等级 || 描述 || 示例 |\n| D || 闯入式抢夺：没有技能、知识、资源；看到机会就立即行动 | 脚本小子 |\n| C | 拥有一些有限的技能和资源，但在执行方面缺乏计划\
  \ | 低轨道离子炮 |\n| B | 非常有知识，拥有某些资源，具备计划能力 | 网络蠕虫 |\n| A | 组织良好的团队，非常精深的知识，大量的资源，仅对大型目标感兴趣，可以详尽计划\
  \ | 震链 |\n\n我们将在 25 章中更详细地讨论这种分类方案。\n\n参考文献\n\n\n\n\nAlvarez, E. 2014. 索尼影业黑客攻击：全程。Engadget,\
