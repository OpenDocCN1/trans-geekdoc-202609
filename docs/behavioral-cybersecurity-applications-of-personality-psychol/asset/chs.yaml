  \ `Word` 中并在那里运行拼写检查可能有帮助。 |\n| 包含的广告 | 检查怀疑网站可能显示的广告性质。如果广告显示你可以在线购买某些东西，它可能是一个骗局。\
  \ |\n| 新闻媒体 | 如果指明了新闻媒体，如果你没听过它，请在线搜索更多信息。 |\n| 其他文章 | 查看是否有关于同一主题的其他文章。如果你找不到任何文章，那么这个故事很可能是假的。\
  \ |\n| 其他来源 | 进行搜索以查看该故事是否也被其他媒体报道。如果它没有在信誉良好的媒体中出现在同一时间段，那么它很可能是伪造的。 |\n| 出版者“关于我们”\
  \ | 在网站的“关于我们”部分，查看你可以确定关于赞助该网站的组织的什么信息。 |\n| 故事目的 | 尝试确定故事的目的是。有没有可能为了满足出版者的议程，可能是出于政治或财务原因？\
