  \ (此处 4.8.3 理解 Petya 攻击 (17/6/27) 过程回顾之后的内容已翻译) ...\n\n### 4.8.4 WannaCry 和 Petya：相同还是异同？\n\
  \n表面上有许多理由认为 `WannaCry` 和 `Petya` 源自同一个来源，这可能导致对攻击者或攻击者动机的判断。进一步分析可能建议使用分析方法。然而，差异开始出现。一个主要结论是\
  \ `Petya` 仅仅是伪装成勒索软件。毕竟，它似乎只吸引了 9 次支付日。Cyphort 的威胁运营高级总监 Nick Bilogskiy 发布了一份关于\
  \ `Petya` 如何运行以及它与 `WannaCry` 区别的早期拆解。“这就是 `Petya`，一个通过嵌入使用 SMB 使用 `EternalBlue`\
  \ 漏洞自我复制的方式而获得新生命的旧勒索软件家族，”他补充说，到目前为止有 9 人支付了 300 美元的赎金。Cyphort 发现与 `WannaCry` 有几点不同，如下：\n\
  \n* `Petya` 的初始分发方法是通过邮件，在来自未知地址的恶意链接中。\n* 执行后，`Petya` 并不尝试加密单个文件，而是加密主文件表（MFT）。\n\
  * 它附加了一个伪造的微软数字签名，复制自 `Sysinternals`。\n* 看起来这个新版本可能还可以通过 Windows 管理接口 (`WMI`) 进行横向移动。\n\
  * 某些有效负载包含一个 `Loki Bot` 变体，这是一种从受感染的计算机中提取用户名和密码的银行木马，除了勒索软件之外。\n\n### 4.9 Yu Pingan\n\
  \n某些恶意攻击有很长的寿命。上述对 OPM 的攻击直到 2017 年 8 月才揭开，当时加州南部方法院对一名中国籍人士 `Yu Pingan`（也称为 `Gold\
  \ Sign`）提交了一份关于合谋计算机黑客罪的密封起诉书。\n\n\n\n指控声称，平安先生向四家公司提供了恶意软件，特别是一种名为“Sakula”的软件工具，其中两家位于加利福尼亚州，一家位于马萨诸塞州，一家位于亚利桑那州。该软件能够在未经授权的情况下下载到受者的计算机。据指控，`Sakula`\
  \ 是大规模入侵的必要，包括针对 `OPM` 以及医疗保险公司 `Anthem` 的攻击。\n\n当时平安先生是居住在中国上海的 36 岁居民。诉状被提交后，他随后被捕，因为他飞往美国参加会议，因此在美国领土被捕。\n\
  \n引述诉状的话：“2012 年 9 月，恶意文件被安装在公司的 Web 服务器上，作为水坑攻击攻击的一部分，该攻击在 2012 年 9 月 18 日至 2012\
  \ 年 9 月 19 日之间向 147 个位于美国的唯一 IP 地址分发了恶意代码，利用了现为人知的 CEU-2012-4969 的零日漏洞。在 2012 年\
  \ 5 月到 2013 年 1 月期间，公司 Web 服务器托管了不少于五种 Internet Explorer 零日漏洞变体”（`US v. Pingan Yu`,\
  \ 2018）。\n\n# 4.10 Elena Alekseevna Khusyaynova\n\n作为国家指示的针对美国选举系统的攻击持续于上述关于 2016\
  \ 年美国总统竞选报道之外的证明，2018 年 9 月 28 日，弗吉尼亚州东区法院提交了一份针对 Elena Alekseevna Khusyaynova 的欺诈美国罪刑事诉状（`DoJ`,\
  \ 2018）。她是俄罗斯圣彼得得堡的居民，曾是 `Lakhta` 项目的首席会计，该项目得到了 `Yevgeniy Nick Tarter Mitch Prigozhin`\
  \ 的支持，他与总统弗拉米尔·普京关系密切，通常被称为“普京的厨师”。她已搬到华盛顿特区，并被乔治·华盛顿大学的研究项目录取。\n\n作为她在 `Lakhta`\
  \ 项目中努力的一部分，据指控她“通过社交媒体平台和其他互联网媒体上的虚假美国人，对美坚坚进行了信息战争”。这一阴谋发起了许多虚假活动，旨在在美国不同政治倾向的人之间散播不和，并加剧目前存在的政治分裂。几个归于此努力的\
