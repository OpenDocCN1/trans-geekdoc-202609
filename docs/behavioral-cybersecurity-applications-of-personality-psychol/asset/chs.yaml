  _websites`](https://en.wikipedia.org/wiki/List_of_fake_news_websites)\n\n## 24\n\
  \n24.1 寻找一位（必须是 80 岁以上）对 1938 年《世界大战》广播节目有个人回忆的人士。总结他们的回忆。\n\n24.2 寻找任何近期（2016 年以后）关于“披萨门门事件”（Pizzagate）的引用。\n\
  \n24.3 提供关于来自马其顿维莱斯（Veles）的假新闻的更新信息。你能找到关于该城市的其他有趣新闻吗？\n\n24.4 我们在上面提供了八个假新闻（或非假新闻）的示例。将每个示例提交到“假新闻检测技术”中指定的\
  \ 20 项测试中。你会使用什么指标来对假新闻与非假新闻做出最终判定？例如，你可能会说如果它满足了 20 项测试中的`>n`项，那么它就是假新闻。\n\n##\
  \ 25\n\n### 杂锦\n\n人们可能会纳奇，为什么一本关于行为网络安全的书中会有一章名为“杂锦”（Potpourri）。\n\n“potpourri”一词在韦尔-韦布斯特词典（Merriam-Webster）和法语标准词典拉罗塞（Larousse）中都有许多有趣的定义，因为它源自法语并被引入英语。\n\
  \n韦尔-韦布斯特词典的定义如下：\n\n**potpourri**\n\n名词\n\npot·pour·ri | \\ ˌpō\\-pu˙-ˈrē \\\n\n\
  potpourri 定义\n\n1. 一种通常保存的花卉、草药和香料的混合物。\n\n2. 各种物的混合物。\n\n相反，`potpourri` 的法语定义是：\n\
  \n- 各种物的混合物；\n- 各种物的集合；\n- 各种物的杂烩；\n- 各种物的多样性。\n\n本章中 `potpourri` 的目的是描述在行为网络安全中可能遇到的不同类型的威胁。我们将使用这些威胁来说明可用于检测它们的各种方法。\n\
  \n\n\n\n\n将这些汽车示例转化到网络安全背景下，我们可能会将 D 级网络犯罪分子认为是被指向某个网站的人，该网站可能包含可以被下载并运行的嵌入软件，以创建某种形式的攻击。在这种情况下，这种行为不需要任何技能或知识，只需在发现并复制恶意软件后采取行动即可。有时，此类行为的实施者被称为“脚本小子（script\
  \ kiddies）”。\n\nC 级网络犯罪分子可能是能够发动某种 DDoS 攻击的人。例如，通过下载“Low Orbit Ion Cannon”（低轨道离子炮）程序，只需输入\
  \ URL 即可启动各种类型的 DDoS 攻击。\n\nB 级网络犯罪分子可能是具有高水平编程技能的人，足以创建蠕虫、病毒或勒索软件，并将其发布以攻击某些经过精心挑选的目标站点。\n\
  \n最后，A 级网络犯罪分子实际上可能是一个政府或由一个或多个政府资助的大型组织。无疑，A 级攻击的例子可能是 `Stuxnet` 及其多个变体。`Stuxnet`\
  \ 已被可靠地认为是美国和以色列政府的合作项目。\n\n## 25.2 美国司法部起诉网络犯罪分子的成功：谁在赢？\n\n为了了解网络犯罪分子与执法部门相比的相对成功率以及执法部门威慑网络犯罪分子的能力，多年来关于网络攻击的数据非常不透明。在某些方面，情况依然如此，但现在有了稍微清晰的图景，这无疑是因为在某种程度上，对于被认为是计算机犯罪的起诉报告有了更具协调性的努力。\n\
  \n其一个主要原因是，自从计算机时代开始以及随着病毒、蠕虫、拒绝服务和勒索软件出现而相应的安全担忧以来，法律的发展根本没有跟上技术的发展速度。例如，考虑以下情况：我可能有一个非常重要的文件或一组文件，从现实角度评估具有重大的货币价值。为了讨论起见，让我们假设这些信息价值\
  \ 100 万美元。现在，一个网络犯罪分子通过某种方式成功复制了所有这些信息。是否发生了盗窃？\n\n当然，我们的直觉会说是。但如果你查看任何关于盗窃的法律定义，这种行为都无法被描述为盗窃。\n\
  \n\n\n\n\n网络安全社区更加关注那些需要至少具备编程技能才能创建和分发的恶意软件类型：病毒、蠕虫、特洛马、机器人等。但现在已有充分记录表明，DDoS 攻击的数量和强度呈指数级增长，这已成为系统管理员及其组织关注的重点。\n\
  \n在 2011 年发布的《世界基础设施安全报告》（`WISC`, 2011）中指出，报告中记录的 DDoS 攻击数量，自 2004 年研究的第一年以来已增长了\
  \ 10 倍，且受意识形态驱动的“黑客主义”和破坏行为已成为最易于识别的 DDoS 攻击动机。在同一份报告的 2012 年版本中（`WISC`, 2012），这种向政治动机驱动的趋势被量化如下：“35%[连接互联网的组织]报告了政治或意识形态攻击动机……31%报告称将虚无主义或破坏行为作为攻击动机。”在过去的\
  \ 7 年里，DDoS 攻击的数量和强度正以指数级速度增长。正如`WISC` (2011) 所报告的那样，2011 年，10-Gbps（吉比特每秒）范围内的泛洪攻击显著增加。\n\
  \nDDoS 攻击已经进入主流，并被描述为“新常态”。在最形式的形式，DDoS 攻击是一组协调一致的服务请求，例如访问 Web 页面。这些请求可能来自互联网上的许多节点，通过人类操作或电子动作产生，且这些请求需要被攻击网站的资源支持。此外，现在通过某些类型的攻击，人们只需输入\
  \ URL 并点击即可参与其中，从而使能够参与 DDoS 攻击的用户数量增加到几乎每一个能够访问互联网的人。例如，低轨道离子炮（`LOIC`）在互联网上可以易于获取，使用该软件启动或参与\
  \ DDoS 攻击只需输入网站名称。通常，DDoS 攻击的目标仅仅是让网站产生如此巨大的流量，以至于主系统的带宽容量被过载并导致崩溃。网站崩溃的组织，其恢复时间可能从几小时到几天不等（图\
  \ 25.1）。\n\n![](img/025x001_fmt.jpeg)\n\n尽管过去十年对 DDoS 攻击进行了大量的研究，但关于特定攻击的协调信息寥寥无几。这是可以理解的，因为被攻击的网站可能不想公开此类攻击发生过。然而，攻击小组越来越多地公开其击垮了一个网站（Dominguez,\
  \ 2011; Mutton, 2011; Poulson, 2010; Singel, 2011）。不过，由于特定事件的影响，DDoS 攻击可能与突然涌入的请求无法区分。例如，当发生重大事件时——例如某位名人去世——新闻网站的合法请求可能会异常增加；或者当热门门票开始发售时，票务代理服务可能会被淹没。我们使用“异常事件”一词来描述\
  \ Web 服务需求快速增加的情况，这可能发生在 DDoS 攻击下，也可能发生在合法的高流量下。因此，更精确地监控此类异常事件的能力，可能是开发更好的防御或检测机制的有用工具。\n\
  \n这项研究基于尝试通过互联网流量公司[`alexa.com`](http://alexa.com）以及其他来源提供的互联网数据（Alexa, 2019）来对\
  \ DDoS 攻击进行特征描述。由于该服务提供了大量数据，我们尝试建立一个数据库，不仅提供有关 DDoS 攻击行为的信息，还提供有关网站流量其他异常行为的信息。图\
  \ 25.2 显示了[`alexa.com`](http://alexa.com）报告中“访问量”的结果，即全球互联网用户的估计百分比。流量报告中的参数是横轴上的时间（`t`），以天为单位，以及访问量（`r`），根据[`Alexa.com`](http://Alexa.com），代表访问[`doj.gov`](http://doj.gov）（即美国司法部网站）的用户比例。\n\
  \n![](img/93419.jpg)\n\n特别是图 25.2 显示了 2011 年六个月内司法部网站的流量水平。\n\n很容易看到 2012 年下半部分的流量中存在明显的异常。我们在书前面的章节（第\
  \ 1 章）描述过，在维基发布了来自美国陆军士兵切尔西·曼宁的大量文件后，由于攻击者试图通过 DDoS 攻击击垮维基，引发了一场“网络战争”。在失败后，维基的支持者为了报复发动了\
  \ DDoS 攻击并击垮了司法部网站，如图 25.2](#33_Chapter_25.xhtml#Anchor-6)所示。\n\n该 DDoS 攻击在同一时期也针对\
  \ FBI 网站被复制，如图 25.3](#33_Chapter_25.xhtml#Anchor-7)所示。\n\n![](img/93454.jpg)\n\n\
  ## 25.4 魔幻数字七 (#06_Contents.xhtml#r_idParaDest-332)\n\n在计算机普及很久很久，哈佛大学心理学家乔治·米勒（George\
  \ Miller）写的一篇论文就证明了一些原则，这些原则在多年后对网络安全产生了巨大的影响。\n\n\n\n\n这篇名为《神奇数字七，加减二》（Miller,\
  \ 1956）的论文最初对电话系统的号码分配设计产生了影响，随后又影响了计算机密码制定规则的设计。\n\n米勒证明了，普通人类记忆随机信息片段或“块”（chunks）的能力集中在七个不同的信息单元上。\n\
  \n追溯到 20 世纪 40 年代，大多数电话系统的号码由四位数组成，然后是五位数，再接着加上一个指示电话所在地所在区域的两个字母代码。\n\n在旧的电影、电视和音乐中，仍留有该系统分配的电话号码残迹。经常重播的电视喜剧《我爱露西》（I\
  \ Love Lucy）中里卡多住所使用了一个虚构的电话号码 `MU 5-9975`（`MU` 代表 Murray Hill，是曼哈顿一个真实的电话交换区）；20\
  \ 世纪 40 年代的一首流行歌曲是《`PE 6-5000`》（读作 `PEnnsylvania 6-5000` 或“宾夕法尼亚-六-五-零-零”）；以及 20\
  \ 世纪 50 年代由伊丽莎白·泰勒主演的热门电影《巴特菲尔德》（Butterfield 8）使用的是虚构电话交换机 `BU 8-xxxx`。\n\n该系统的优势在于，用户基本上只需要记住六个信息“块”：交换区名称以及后续五个数字。\n\
  \n到了 20 世纪 50 年代，开头的两个字母代码被两个数字取代（通常是与字母代码对应的电话拨号数字——因此 Murray Hill 的 `MU` 变为了“68”，使得里卡多住所的\
  \ `MU 5-9975` 变为了 `685-9975`）。但对于新用户来说，这意味着要记住七个信息块，而不是旧系统中的六个。根据米勒的研究，这仍然意味着记忆电话号码七个独立信息单元的能力在正常记忆范围内。20\
  \ 世纪 60 年代又引发了更复杂的情况，当时长途直拨变得可能，电话号码现在变成了 10 位 de- 位数字。根据米勒的研究，这会造成困难，除非拨打同一区号的用户不需要为他们经常拨打的区域学习新的三位代码。\n\
  \n米勒的研究及后续观察的本质是一系列先前的实验，要求受试者在对象数量逐渐增加的情况下区分或识别不同的对象。在他所报告的几乎所有研究中，当呈现的对象数量接近七时，受试者识别所观察到的对象精确数量的能力往往会迅速下降。他研究中的几个例子包括：\n\
  \n1. `Pollack (1953)` 要求听者通过为音调分配数字来识别听觉音。当每个音调播放时，听者用数字做出反应。当实验仅包含 `2` 到 `4` 个不同音调时，很少出现识别错误。随着音调数量增加到\
  \ `5` 到 `14` 之间，听者犯了许多错误。正确识别的数量达到大约六的水平；作者将此称为受试者音高判断判断通道容量。\n\n2. `Garner (1953)`：在这个例子中，测试针对的是声音的响度。他在\
  \ `15` 到 `110 dB`（分贝）之间设置了若干强度不同的音调，并使用了 `4` 到 `20` 种不同的强度。\n\n3. `Beebe, et al.\
  \ (1955)`：在这种情况下，测试针对的是味觉。\n\n4. `Hake and Garner (1951)`：在这个例子中，测试针对的是位置。\n\n总而言，在网络安全背景下，密码的性至关重要。\n\
  \n\n\n\n-   **密码句（Passphrases）**：与其使用上述长字符串，不如创建一个短表达式，例如使用短语中每个单词的首字母。因此，Abe 的长密码将变成\
  \ `fsasyaof`（或者，另一种变体为 `fsa7yaof`）。现在这个密码足够短，可以记住看起来像随机字符串的内容，但用户在人类记忆中拥有了那个更著名的长表达式，并记得只取短语中每个单词的首字母的规则。如果用户选择的短语很容易根据对该用户的了解而推断出来，这里就会出现缺陷。\n\
  \n也可以成为一名“电影评测员”，学习关于密码正确构建的其他观点。例如，在 YouTube 上可以找到几个视频。\n\n### 身份盗窃宣言：\n[`www.youtube.com/watch?v=LOJnBI1HDn4`](https://www.youtube.com/watch?v=LOJnBI1HDn4)\n\
  \n### Kelsey Dobish 和 Trey Shafto：\n[`www.youtube.com/watch?v=jWablPsy6ng`](https://www.youtube.com/watch?v=jWablPsy6ng)\n\
  \n### Endsight Corporation：\n[`www.youtube.com/watch?v=UnmdxReVoNc`](https://www.youtube.com/watch?v=UnmdxReVoNc)\n\
  \n### Sophos Corporation 的 Graham Cluley：\n[`www.youtube.com/watch?v=VYzguTdOmmU`](https://www.youtube.com/watch?v=VYzguTdOmmU)\n\
  \n我们的学生对其中许多网站进行了“评测”，正如我们将在下一节中描述。\n\n我们倾向于使用的建议是选择一个相对短但容易记忆的事件，这样它就会被深深地烙印在我们的意识中，但对于那些想要研究我们历史的人来说，它并不广为人知。假设多年前，我与某人、某地或某物有过一次难忘的相遇——假设是“Penobscot”，这实际上是缅因州的一条河。\n\
  \n此外，在这种情况下，我没有告诉任何人我在那条特定的河流度过一些时间——所以任何认识我的人都不会产生这样的联系。所以现在这是一个我不可能忘记的密码——但遗憾的是，有针对河流名的字典可以用于随机攻击以获取我的密码。为了仍然使用“Penobscot”但将其从此类攻击隔离开来，我可以在密码中插入其他字符，这样只需通过河流名称字典测试密码，我们可能就可以使用例如\
  \ `penob7scot` 作为密码来偏转这种攻击。\n\n除了这个例子之外，任何用户开发一个此类易记忆的单词列表都是明智的，而且当以上述方式对其进行修改时，它们将击败任何基于某些常用字典词汇的攻击。\n\
  \n## 25.6 密码创建视频：电影评测\n\n很清楚，使用密码进行身份验证的主要问题与人类记忆面临的挑战有关，即如何深层嵌入密码的选择，或者在某个特定用户所需的多个密码中进行选择的挑战。我们在上面已经介绍了一些选择良好密码的原则。\n\
  \n此外，通过无处不在的 YouTube，许多个人和组织拍摄并发布了他们关于如何创建良好密码的自己的处方。最后统计，可以找到至少 14 个独立的 YouTube\
  \ 视频，解释了选择良好密码的方法。\n\n我们将问题抛给我们的学生，以评估 YouTube 网站上易于获取的信息质量和视频质量。\n\n我们提供了学生对其中许多视频的批评总结（参见图\
