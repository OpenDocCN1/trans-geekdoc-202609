  \ 类型的形成。《心理类型杂志》，52, 18–31. (注：此处原文逻辑重复)\n\n## 模运算与其它方法\n\n任何加密方法都必须确保当我们执行加密时，能够回到原始消息。作为直接结果，这意味着解密可能是未定的。\n\
  \n作为结果，几乎所有的加密系统都使用自然数或整数作为计算基础。事实上，由于整数的范围是无限的，相反我们总是使用较小的、可枚举的整数，我们通常称为模运算。\n\n\
  ### Zn 或模 n\n\n整数的标准定义可以写为 `Z = {-∞, …,2, -1, 0, 1, 2, …, ∞}`，带有运算 `+`, `×`。当然，这个集合\
  \ `Z` 是无限的，我们推导出一个被称为“模 n 整数”的变体，写为：\n\n`Z[n] = {0, 1, 2, ..., n-1}`\n\n如果 `a` 和\
  \ `b` ∈ `Zn`，则 `a + b` 定义为 `a + b` 除以 `n` 的余数，`a × b` 定义为 `a × b` 除以 `n` 的余数。\n\n\
  具有二元运算（如 Zn 中的 `+`）的元素集合形成 `G = {a, b, ...}` 需要满足条件：\n\n1. **封闭性**：如果 `a`, `b` ∈\
  \ `G`，则 `a + b` ∈ `G`。\n2. **单位元**：存在一个特殊的元素 `i`，使得对于 `G` 中的所有 `a`，`a + i = i +\
  \ a = a`。\n3. **结合律**：对于所有的 `a`, `b`, `c` ∈ `G`，`a + (b + c) = (a + b) + c`。\n4.\
  \ **逆元**：对于所有的 `a`，存在某个 `b`（我们写做 `b = -a`），使得 `a + b = a + (-a) = i`。\n\n### 群属性与网络安全\n\
