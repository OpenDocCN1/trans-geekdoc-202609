  \ | --- |\n| 0.37 | 0.38 | 0.13 | 0.12 |\n\n| A0 | A1 | A2 | A3 |\n| --- | --- |\
  \ --- | --- |\n| 0.45 | 0.33 | 0.19 | 0.03 |\n\n## 黑客实验室 2：明文传输的分配密码\n\n在本书中，你将发现许多我们称为\
  \ `Hack Labs`（黑客实验室）的内容，特别是四个。这些实验室旨在让学生在处理许多网络安全问题方面获得实践经验，这些问题对于保护计算环境至关重要。\n\n\
  这些实验室的另一个目的是，不需要但可以有一个支持性的物理计算机实验室来执行这些项目。它们也可以在学生的自己的设备上完成，且不需要在固定的实验室期间内完成。\n\n\
  当作者提供这些实验时，他们通常会给学生一周的时间来进行研究并提交结果。\n\n### 9.1 黑客实验室 2：明文传输的分配密码\n\n这个 `Hack Lab`\
  \ 处理的是如何阻碍在线公司要求用户创建密码以使用其服务的方法。我们大多数频繁使用在线服务的人发现，他们可能需要管理许多此类密码。然而，许多公司（可能由于对安全性并不关心）习惯于要求用户通过注册获取密码，然后将其通过电子邮件发送到用户的账户，并显示主机创建的“明文密码”。\n\
  \n指令：\n\na. 找到一个（或多个）你必须创建密码的网站，然后该密码将以明文形式通过电子邮件发送给你！\n\nb. 不接受在 `plaintextoffenders.com`\
  \ 中分类的响应。截止日期：实验室公布后 1 周，但这个网站可以给你提供一些灵感。\n\n#### 参考\n\nPlaintext Offenders. 2018.\
  \ [`http://plaintextoffenders.com/`](http://plaintextoffenders.com/) 明文密码 [`offenders.com`](http://offenders.com)\n\
  \n#### 问题\n\n9.1 如果你的密码以明文形式从网站传送，你将如何防止密码泄露？\n\n## 10 密码学的起源\n\n之前所有的章节都引导我们进入了创建安全环境最重要的部分之一。这是研究和应用通过秘密函数转换信息的方法，以便攻击者极难解释所涉及的消息。\n\
  \n这种方法是本课程及任何网络安全课程的核心，被称为 `cryptology`（密码学），它实际上是一个源自 `cryptography`（密码学，源自希腊语\
  \ κρυπτο [krypto 或“隐藏”] 和 γραφια [grafia 或“写作”]）研究的组合术语。`cryptology` 的第二个部分是 `cryptanalysis`（密码分析）领域，即研究破解加密方法的方法。这两个领域都有非常悠久的历史，远早于计算机时代。事实上，最早的加密方法之一据是由尤利斯·凯撒在\
  \ 2000 多年前发明的。所谓的“凯撒位移”在现代并不是一种实用的加密方法，但它很有描述价值，主要是为了加密系统设定参考范围（Patterson, 1987）。\n\
  \n## 10.1 凯撒位移\n\n在凯撒位移中，以及任何加密方法或算法中，我们都有需要隐藏的文本，称为 `plaintext`（明文）。我们还有许多种转换该文本的方法，每种方法都取决于我们称为\
  \ `key`（密钥）的变换选择。一旦由 `key` 决定的变换应用于 `plaintext`，结果被称为 `encrypted text`（密文）或 `ciphertext`（密文）。\n\
  \n在凯撒位移的示例中，假设我们想要传输消息：“ROME WAS NOT BUILT IN A DAY”（罗马不是一日之建的）。对于今天的传输，我们选择数字 `5`\
  \ 作为 `key`，这意味着消息中的每个字母在字母表中向后移动五个位置——对于字母表末尾的字母，如果移动超过了字母 `Z`，则回到开头 `A`。因此，我们的\
  \ `plaintext` 消息变成了：\n\n```\nROME WAS NOT BUILT IN A DAY\nSPNF XBT OPU CVJMU JO\
  \ B EBZ\nTQOG YCU PQV DWKNV KP C FCA\nURPH ZDV QRW EXLOW LQ D GDB\nVSQI AEW RSX\
  \ FYMPX MR E HEC\nWTRJ BFX STY GZNQY NS F IFD\n```\n\n所以，要发送给接收者的 `ciphertext` 是“WTRJ\
  \ BFX STY GZNQY NS F IFD”。\n\n为了使任何加密方法有用，必须有 `key` 的逆元，以便接收者应用该逆元 `key` 从而检索原始消息。在凯撒位移的情况下，逆密钥是\
  \ `key` 值在模 26 算术中的逆值——换句话说，加上该数字后等于 26 的数字。\n\n因此，解密的方法是使用相同的过程，在本例中是向前移动 21 次。再次，`5\
  \ + 21 ≡ 0 (mod 26)`。\n\n为了使用这种或或其他加密方法，我们需要一个形成 `plaintext` 的方法；若干由 `key` 决定的变换；以及一个\
  \ `ciphertext` 的系统或字母表。最后，我们要求 `key` 的选择保密，但它必须在发送者和接收者之间共享。\n\n在凯撒位移的情况下，一个弱点是最多只有\
  \ 26 个密钥，对应字母表的每个字母，因此对于尝试破解凯撒位移的攻击者来说，只需要尝试 26 个密钥，其中一个就会产生结果。\n\n我们将描述一些其他在纸笔时代使用的历史方法，仅为了说明这些方法是如何随几个世纪演变的。\n\
  \n## 10.2 替换与置换\n\n大多数加密方法随着时间的推移依赖于两种哲学上不同的转换方法。它们被称为 `substitution`（替换）和 `transposition`（置换）。上述凯撒示例使用了\
  \ `substitution` 原理；换句话说，`plaintext` 中的每个字符都根据字符符号本身进行转换。在我们上述密钥为 `5` 的示例中，字母表的\
  \ 26 个字母转换如下：A → F，B → G，C → H，……Z → E。\n\n另一种方法 `transposition`（我们稍会看到）会对 `plaintext`\
  \ 列表中符号的位置进行变换。一个非常简单的例子可以描述为 `(1 2 3 4) → (3 4 2 1)`，这意味着四字母组中的第一个字母移动到第三个位置，第二个移动到第四个位置，以此此类推。因此，在这种情况下，消息“EACH\
  \ GOOD DEED PAYS”变成了“HCEA DOGO DEDE SYPA”。因此逆密钥是 `(1 2 3 4) → (4 3 1 2)`。\n\n###\
  \ 10.3 密钥混合字母表加密系统\n\n\n\n\n\n关键字 `mixed alphabet` 使用英语语言中所有单词的集合（去重字母）作为其键。事实上，要求单词必须是英语单词（除了排外主义之外）之所以有这一规定，是因为如果密钥是一个单词而不是任意字符字符串，那么密钥的分布将要简单得多。\n\
  \n信使从 `Lexington` 骑到 `Valley Forge` 只用了半天时间，他精疲力竭、气喘吁吁，在接近 `华盛顿将军` 时几乎已经死亡，以此告知密码系统的秘密密钥：“XRUTGDKWQFP”，他喘着气说完，随后断气。`华盛顿将军`很困惑：他说的是“XRUTGDKWQFP”还是“XRUTGDKWQFT”？\n\
  \n该方法本身使用密钥来定义消息空间字母表的映射或排列（`Σ`，即英语字母表的符号——包括大小大小写字母在内的 52 个字符）。为了定义密钥，按正常顺序写字母表，并在其下方写出排列后的字母表，首先是密钥的字母，然后是字母表的其余字母。目前，我们仅考虑使用\
  \ 26 个大写字母。\n\n假设密钥为：`FACETIOUSLY`\n\n那么普通字母表为（为了易读性插入了空格）：\n\n`ABCDE FGHIJ KLMNO\
  \ PQRST UVWXY Z`\n\n排列后的字母表为：\n\n`FACET IOUSL YBDGH JKMNP QRVWX Z`\n\n为了方便阅读，我们写如下：\n\
  \n`ABCDE FGHIJ KLMNO PQRST UVWXY Z`\n`FACET IOUSL YBDGH JKMNP QRVWX Z`\n\n加密根据上述定义的排列将消息文本的每个字母映射到密文的字母。因此，“MAY\
  \ THE FORCE BE WITH YOU”变成了“DFX PUT IHMCT AT VSPU XHQ”，或者更有可能是“DFXPU TIHMC TATVS\
  \ PUXHQ”。在旧的加密系统中，将文本分成等大小的块是常见做法。一方面，空格允许人类更容易阅读；但重要的是，空白或空格的正常位置告诉我们单词的长度。\n\n\
  ## 10.4 维吉尼亚密码系统\n\n`维吉尼亚密码` 是一种追溯到 16 世纪的广泛使用的加密系统，它使用密钥结合凯撒位移。如果密钥是“FACETIOUSLY”，一个\
  \ 11 个字母的单词；与之前一样，加密将周期地使用 11 种不同的凯撒位移。（每个字母决定一个凯撒位移，或模加）。假设按照常， `0` ↔ `A`，`1` ↔\
  \ `B`，`…` `25` ↔ `Z`。那么，第一个要编码的字母使用对应 `F` 的位移，第二个对应 `A`，第三个对应 `C`，以此此类推直到循环重复：\n\
  \n选择一个密钥，例如：\n\n明文：\n`IT’S A LONG WAY TO TIPPERARY …`\n\n密钥：\n`FA C E TIOU SLY FA\
  \ CETIOUSLY`\n\n密文：\n`OUV F FXCB PMX ZP WNIYTMTDX`\n\n## 10.5 一次性便笺加密\n\n“一次性便笺”在加密史上扮演着重要角色。它最早由\
  \ `Frank Miller` 在 1882 年描述，美国第 1,310,719 号专利授予了 `Gilbert Vernam` 一种基于这种加密方法的物理设备（Patterson,\
  \ 1987）。\n\n一次性便笺的原理是对上述`维吉尼亚密码系统`的详述。在`维吉尼亚系统`中，选择一个密钥（我们的示例是 `FACETIOUSLY`），然后加密根据便笺中与明文字母相同位置的对应元素进行不同的凯撒位移。然而，对`维吉尼亚方法`的破解或密码分析是基于这样一个事实：在加密了一定数量的明文后，周期可以确定。在\
  \ `FACETIOUSLY` 密钥的案例中，位置 `1`、`12`、`23`、`34` 等将相同的凯撒位移。\n\n一次性便笺的概念是密钥的长度可以扩展到极大。事实上，对于真正的一次性便笺，密钥应该是无限长的。然而，创建一个不重复的无限长度字符串在实践上是不可能的。但可以使用随机化技术生成在数千或数百万项后才可能重复的字母序列。\n\
  \n因此，可以创建一个“垫”，即极长的密钥，只要传输的明文字符数小于密钥长度，就不会出现重复模式。\n\n\n\n\n使用对应 `A ↔ 1`、`B ↔ 2`、`C\
  \ ↔ 3`……、`Z ↔ 26`，将每个明文字符的值加到填充字表中对应元素的值上（对 26 取模，如果总和 `>26` 则减去 26）。这些字符的加密结果为对应和的字符。\n\
  \n`T → 20`，`S → 19`；`20 + 19 = 39`；模 26 余数为 13，`13 → M`\n\n`H → 8`，`I → 9`；`8 +\
  \ 9 = 17`；模 26 余数为 17，`17 → Q`\n\n`E → 5`，`S → 19`；`5 + 19 = 24`；模 26 余数为 24，`24\
  \ → X`\n\n以此此类推。\n\n# 10.6 Playfair Square (Playfair Square)\n\n这是一种源自 19 世纪的更复杂的方法，被称为\
  \ Playfair Square（归功于英国科学家查尔斯·惠特斯顿于 1854 年发明，但为了营销目的使用了 Playfair 爵士的名字）。为了创建一个 Playfair\
  \ Square，我们将使用标准英语字母表构建一个 5 × 5 的正方形（Patterson, 1987）。\n\n哎呀！字母表有 26 个字母，而 5 × 5\
  \ = 25。\n\n我们的任务是将字母表减少到 25 个字母，我们通过合并两个字母 `I` 和 `J` 来实现。因此，在算法中，明文中的每个 `J` 都会变为\
  \ `I`。\n\n现在选择一个单词形成密钥。如果密钥有重复字母，例如假设密钥是 `CONSPIRATORIALLY`，那么通过删除，我们将使用 `CONSPIRATLY`\
  \ 作为密钥。\n\n现在通过将密钥字母按行顺序写入 5 × 5 的正方形中来创建 Playfair Square。然后同样按行顺序填充剩余的（25 个）字母表。Playfair\
  \ Square 的加密方法不是基于单个字母的替换（因此有 26 种不同的替换），而是基于成对字母（双字母字）的。共有 `26 × 25 = 650` 个双字母字；因此，这\
  \ 650 个符号的所有可能排列总数约为 `8.1 × 10¹⁵⁴⁷`，即 1 后面跟着 1547 个 0。在这种情况下，Playfair Square 为：\n\
  \n```\nC O N S P\nI R A T L\nY B D E F\nG H K M Q\nU V W X Z\n```\n\n这个 5 × 5 正方形本质上就是密钥，尽管与接收者共享只需要密钥，在本例下是\
  \ `CONSPIRATORIALLY`（见图 10.1）。\n\n![](img/93104.jpg)\n\n现在来加密消息。该正方形基于符号不是字母，而是字母对。我们首先将明文消息分成双字母字。例如，明文消息\
  \ `COMMITTEE` 变成：\n\n`CO MM IT TE EZ`（如果明文字母数是奇数，在末尾附加任意字母）。\n\n加密规则 1：如果双字母字在同一行或同一列，将每个字符向右移动（行）或向下移动（列），因此：`CO\
  \ → ON`，`IT → RL`\n\n加密规则 2：如果双字母字定义了一个矩形，则取矩形的其他顶点，顺序按照第一个消息字符所在的行。例如，`EZ → FX`\n\
  \n但是，对于我们的密钥 `CO MM IT TE EZ`，我们该如何处理 `MM` 呢？答案是，我们不处理。我们通过在每对之间插入一个字母（`Q` 最好）来预处理消息。因此\
  \ `COMMITTEE` 实际上变成了 `COMQMITQTEQE` 或 `CO MQ MI TQ TE QE`。因此，我们确保了在待加密文本中不会出现双字母，从而将适用规则\
  \ 1 或规则 2 之一。新明文的加密变为：\n\n□ CO → ON\n□ MQ → QG\n□ MI → GT\n□ TQ → LM\n□ TE → EM\n\
  □ QE → MF\n\n现在你可以发送消息了。接收者拥有相同的正方形并有两个解密规则：规则 1 在字母对处于同一行时向左移动，在处于同一列时向上移动，而矩形规则\
  \ 2 与加密规则相同。\n\n最后，由于接收者拥有解密但略有变化的消息，接收者提取出对内部所有的 `Q`，并在必要时将“I”解释为“J”。\n\n当我们把所有的\
  \ `Js` 更改为 `Is` 时，这几乎不会在解密过程中引起混淆。至于在双字母对之间插入的 `Q`，这可能变成问题吗？由于英语中 `Q` 几乎总是跟在 `U`\
  \ 后面，这不会。\n\n10.7 转子机 (Rotor Machines)\n\n在 20 世纪初，由于转子的发明，机械化密码变得可能。转子机具有字母盘和一系列转子，根据转子的位置决定位移。转子机基于字母盘的旋转，这是一种更复杂的机械装置。转子机通过字母盘的旋转来位移，根据其位置决定位移。\n\
  \n10.8 恩尼玛机 (Enigma Machine)\n\n转子机的专利在 1923 年授予德国。二战期间，破解 `Enigma` 机器的工作。被许多人认为是计算机科学之父的艾兰·图灵在\
  \ 1954 年去世，[ 10.2 ]。\n\n## 参考文献\n\n- IT History. 2018. Arthur Scherbius.\n- Patterson,\
  \ W. 1987. 数学密码。\n- Shannon, C. 1949. 通信理论. Bell System Technical Journal, 28(4),\
  \ 656–715.\n- Sony Pictures Releasing. 2014. 《模仿游戏》（电影）。\n\n## 练习\n\n10.1 找到在英语中有意义且通过凯撒位移相关的最长字符串。例如：`t4(CAP)\
  \ = GET`。因此 `t1(BZO) = CAP` 和 `t5(BZO) = GET`。如果“CAP/GET”例的长度为 3，我们的例子长度为 7。\n\n\
