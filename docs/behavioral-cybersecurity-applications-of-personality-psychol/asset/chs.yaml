  \n理解人类行为对于网络安全研究至关重要。如果没有人类参与者，网络安全问题将几乎是不存在的。在计算机科学中，因素心理学是最常见的子领域。因素心理学是一门研究人如何与机器交互的科学学科。有时因素心理学被称为人体工程学或人类工程。我们将这种对人类因素的关注扩展到广义的行为科学和更具体的人格心理学，以制定理论公式。人格心理学是因素心理学不可或缺的元素。本章的目的是描述人格的维度，以支持这一观点：人格分析方法可以为防御提供参考。人格心理学为描述个体差异提供了稳健的理论框架，同时也为整个人提供了一个综合概念框架。\n\
  \n### 2.1 什么是行为科学？\n\n在心理学历史背景下，行为科学是一种描述该领域的新兴方法，它是对人类和动物行为的组织化研究。美国心理学会（APA）将心理学领域描述为“多元化的学科”，但在日常生活中有几乎无限的应用。部分由于该领域的多样性是因为它包含了几个子学科（例如发展心理学、社会心理学、组织心理学、人格心理学、教育心理学、临床心理学），并且随着时间的推移，它还自己位于自然科学和社会科学。该领域在自然科学和社会科学交汇处的定位部分源于该领域的历史。\n\
  \n心理学领域的历史讲述了一个在形成早期跨越了多个学科的故事。在 19 世纪 70 年代以前，心理学是哲学领域的一个分支。1872 年在美国，William James\
  \ 被任命为哈佛学院的生理学教师，随后在 1875 年教授了美国第一门心理学课程。1879 年在德国，心理学通过 Wilhelm Wundt 的实验工作发展成为门独立的科学学科。作为门自然科学，心理学追求的问题倾向于通过可观察的物理行为来理解物理世界。作为门社会科学，心理学演变为显式地纳入了人类行为产生于人类社会背景的观点。\n\
  \n\n\n\n\n在本章中，我们描述了人类人格的维度，以推进这一论点：一种以理解攻击者人格为中心的行为网络安全人格分析方法，可以指导防御者在制定防御策略时的决策。人格心理学为描述个体行为差异提供了一个宝贵的框架，同时也为理解完整的人格提供了一个概念框架。人类人格的三个维度（即人格特质、人格特征性适应和叙事认同）与文化的联系程度各不相同。\n\
  \n## 2.2 为什么要用人格心理学？\n\n## 2.2.1 理论取向：当我们了解一个人时，我们了解了什么？\n\n在一篇具有高度影响的文章中，Carlson\
  \ (1971) 提出了一个问题：“人格研究中的‘人’何在？”通过这一点，他批评了该领域似乎背离了其领域创立者（Allport, 1937; Murray, 1938）最初设定的使命，即为理解完整的人格提供一个整合框架。Carlson\
  \ 认为这是一个大问题，因为与心理学的其他子领域相比，该领域在关注人类个越性方面具有独特地位。这与发展心理学形成对比——后者的目标是理解发展的阶段和里程碑；社会心理学——其目标是理解社会互动、动态和认知（态度）；以及临床心理学——其目标是理解人们在日常生活中经历的心理障碍。人格心理学关注完整的人格的使命与后来被称为“人格学（personology）”的理论是一致的。Henry\
  \ Murray (1938) 将跨社会科学的人格学研究定性为关注个体生活和完整人格研究的理论与研究。\n\n几十年后，McAdams (1995) 提出了一个类似的问题，但其对于自\
  \ Carlson (1971) 文章以来发展起来的理论实证知识体系具有更直接的意义。McAdams (1995) 文章的标题为“当我们了解一个人时，我们了解了什么？”。随着时间的推移，从这个最初的问题出发，McAdams\
  \ 及其同事开发了一系列学术文章和书籍，这些著作对人格心理学家理论化、研究和应用人格心理学的方式产生了深远影响。\n\n在他的《人格发展的艺术与科学》（*The\
  \ Art and Science of Personality Development*）一书中，人格心理学概念发展领域的领先学者 Dan McAdams (2015)\
  \ 将人格心理学的理论和研究体系转化，以回答人格心理学的核心问题（即：当我们了解一个人时，我们了解了什么？）。他断言，在发展时间中，我们了解的是一个：首先具有一种表现风格（气质），这种风格逐渐变为人格的基本倾向特质的**表演者（actor）**；一个拥有演化的动机、目标、价值观和项目的动态安排的**代理人（agent）**；一个试图弄清楚自己是谁以及如何在其所处的社会背景和文化中的成年人社会中生活、爱和工作的**作者（author）**。在此之前，在于《美国心理学家》（*American\
  \ Psychologist*）上发表的一篇题为“新大五：人格整合科学的基本原则”（A New Big Five: Fundamental Principles\
  \ for an Integrative Science of Personality）的开创性文章中，McAdams 和 Pals (2006) 开发了一个人格整合框架，他们将人格构想为：“(a)个体对人类本性通用演化设计的独特变异，表现为\
  \ (b) 倾向特质的发展模式、(c) 特征性适应（例如动机、目标、社会智能）以及 (d) 自定义的生命叙事，这些元素复杂且差异化地处于 (e) 文化和社交背景之中”（第\
  \ 204 页）。\n\n## 2.2.2 人格特质与“社会表演者”：人格的拥有侧面\n\n人格特质是一个人广泛的、去语境化的且相对持久的基本行为倾向或处置。一些人格学者将人格特质描述为人格的一个元素，如果一个人并不非常熟悉某人，他就可以解释这一元素。在同样的思路下，McAdams\
  \ (1995) 将人格特质描述为为某人勾勒轮廓。\n\n为了详细阐述人格特质的概念化，强调每个描述词的意义是非常重要的。就人格特质的广泛性和去语境化而言，人格心理学家指的是特质倾向于在大多数情况下表现。在领域的几十年里，Mischel\
  \ (1968, 1973) 引发了后来被称为人格与情境之争的讨论。这场争论随时间侵弱了人格特质作为人类行为重要描述者的地位。本质上，心理学家争论的是人类行为是更多取决于情境还是更具有特质。这场争论引发了关于人格特质的大量科学研究，包括人格特质预测结果（例如\
  \ Barrick and Mount, 1991; Diener et al., 1992）、人格特质的稳定性和遗传性（例如 Bouchard et al.,\
  \ 1990），以及人格特质与大脑功能之间的关联（例如 LeDoux, 1996）。由于这些大量的研究，人格特质从此主导了心理学领域的人格研究。\n\n将人格特质描述为相对持久，意味着这些特质具有人格心理学家称为纵向一致性（Mcrae\
  \ and Costa，1999）。换句话说，一个人的人格特质在整个生命周期内是稳定且不变的（Conley, 1985; McCrae and Costa, 1997,\
  \ 1999; Roberts and DelVecchio, 2000）。此外，科学家发现人格维度中约 50% 归于遗传（Bouchard et al., 1990）。\n\
  \n大五人格特质理论（Mcrae and Costa, 1997, 1999; Goldberg, 1993; John and Srivastava, 1999）通常被心理学家认为是五类人格特质中最具科学有效且稳健的模型。这些人格特质分别是外向、神经质、开放性、尽责性和宜人性。每个人格特质都包含可区分的部分，人格心理学家将其作为特质形容词，并在人格特质研究中通常称为五类人格特质的侧面。\n\
  \n人格心理学家以以下方式描述这五大主要特质（John and Srivastava, 1999; McCrae and John, 1992）：\n\n外向：人格特质包括以下特征：(1)\
  \ 活动水平（例如精力充沛）、(2) 支配性、(3) 社交性、(4) 表现力（例如爱表现）以及 (5) 正情绪（活泼）。外向特质得分高的人被描述为活跃、果断、善交、爱冒险且充满热情的人。外向得分低的人被描述为更内向、保守且顺从权威。\n\
  \n\n\n\n\n# 神经质（Neuroticism）\n神经质这一人格质包括以下特征：(1) 焦虑，(2) 自怜，(3) 敌对。神经质得分高的人被描述为具有一种行为倾向：即经历强烈的情绪状态，如悲伤、忧虑、焦虑和恐惧，并且对挫折反应过度，且表现出过度易怒、自卑、脆弱和冲动。神经质得分低的人被描述为冷静、自信、知且放松。\n\
  \n# 尽责性（Conscientiousness）\n尽责性这一人格质包括以下特征：(1) 胜任（例如高效），(2) 有条理，(3) 尽职，(4) 自律以及(5)\
  \ 审慎。尽责性高的人被描述为可靠、有组织性、有计划、负责任且严谨的人。尽责性低的人被描述为不负责任且容易分心。\n\n# 宜人性（Agreeableness）\n\
  宜人性这一人格质包括以下特征：(1) 温暖，(2) 柔和（例如仁慈），(3) 利他主义（例如慷慨），(4) 谦虚以及(5) 信任。宜人性高的人被描述为懂得感激、宽容、善良且同情的人。宜人性低的人被描述为害羞、多疑且自我为中心。\n\
  \n# 开放性（Openness）\n开放性这一人格质包括以下特征：(1) 审美敏感，(2) 内省，(3) 重视智力事务。开放性高的人被描述为具有艺术天分、好奇心、想象力、洞察力且具有原创性，并兴趣广泛的人。开放性低的人被描述为具有显著是非是非感的人。\n\
  \n## 人格特质的研究\n人格特质的研究发现了它们与许多心理过程和结果相关。对每个特质的研究程度差异很大，其中外向性受关注最多，而开放性受关注最少。外向性与日常更多的社交互动有关（Srivastava\
  \ et al., 2008），为他人创造了积极的社会环境（Eaton and Funder, 2003）；较高水平的社交能力（Argyle and Lu, 1990）；更多的社交目标（King,\
  \ 1995）；对亲密关系的更大追求（Roberts and Robins, 2004）；对商业赚钱的浓厚兴趣（Roberts and Robins, 2000）；对销售、营销和以人为本的职业的兴趣（Diener\
  \ et al., 1992a）；对奖励和激励更强的条件反射（Matthews and Gilliland, 1999）；在限时任务中表现更好，但准确性较差（Wilt\
  \ and Revelle, 2009）；以及在分散注意力任务和多任务处理中表现优异（Lieberman and Rosenthal, 2001）。开放性与寻求新颖多样的体验有关（McCrae\
  \ and Costa, 1997）。神经质人格特质被发现与个体感知到社会环境中的威胁、糟糕的人际经历以及生活中的负面结果有关，包括更高的离婚率、较差的健康以及心脏病和其他危及疾病的风险增加（Ozer\
  \ and Benet-Martínez, 2006; Smith, 2006）。尽责性和宜人性特质都与安全依恋关系有关（Noftle and Shaver,\
  \ 2006）；对家庭角色的投入（Lodi-Smith and Roberts, 2007, 2012）；个人和家庭关系中低水平冲突（Asendorpf and\
  \ Wilpers, 1998）；对工作角色的投入（Lodi-Smith and Roberts, 2007, 2012）；大学学业成就（Corker et al.,\
  \ 2012）；职业稳定性（Laursen et al., 2002）；应对失业的困难（Boyce et al., 2010）；收入较低（尤其是男性）（Judge\
  \ et al., 2012）；以及长寿（Friedman, 2000, 2008）。\n\n## 人格特质适应与动机性主体：人格“执行侧”的心理学\n适应性功能是人类能力的关键特征。它在人类人格的第二个维度——特质适应的运作方式中也至关重要。McCrae\
  \ 和 Costa (1997) 是首位创造“特质适应”术语的理论学家，指的是一系列高度情境化的人格过程。McAdams and Pals (2006) 通过指明人格特质适应是心理个性的情境化方面，这些方面反映了人格中对动机、认知和发展的关注，并能够适应社会角色、情境和发展阶段（例如儿童期、青少年期、成年期）。心理学家投入了巨大的精力试图从人类动机和目标的形式来理解人格特质适应。\n\
  \n### 人类动机与目标：需求与追求\n长期以来，引导动机和目标理论及研究的关键问题一直是“是什么激发能量并引导了人类行为？”心理学家在 100 多年里通过发展各种方式的理论回答了这个问题，包括以下最常见的答案：行为是由塑造动物行为的驱动力提供能量并引导的；无意识的驱动和需求（Freud,\
  \ 1961）；追求快乐和逃避痛苦（Freud, 1961）；一个从生理需求开始到自我实现的的需求层次结构（Maslow, 1968）；人类演化旨在解决的问题，如寻找食物、寻找避难所、吸引和选择配偶、繁衍等（Buss,\
  \ 1995）；自我决定（Deci and Ryan, 1985, 1991），其源于社会环境提供的自主性、胜任感联系感的需求；以及多样化的需求，包括成就、亲密和权力（McClelland,\
  \ 1961, 1985）。\n\n作为人类人格的适应性特征，理论上一个人在生活的几十年中会表现出一致的动机趋势，同时在不同的社会角色和情境中表现出发展性的变化。在人类动机和目标中，研究最丰富的方面包括权力动机、成就动机、社交动机和个性化目标。\n\
  \n### 权力动机：对权力的追求\n权力动机是对他人产生影响的，影响他们的行为或情感，并包含了重叠的概念，如影响、启发、抚养、权威、领导力、控制、支配、胁迫和攻击（Winter,\
  \ 1992）。Winter (1992) 认为，“尽管这些概念在合法性、道德以及对他预期反应（权力的‘目标’）方面的内涵各异，但它们共享一个核心含义，即一个人影响他人行为或情感的能力。人类具有权力驱动力或‘权力意志’的想法在许多文化和知识传统中都非常显著”（p.\
  \ 302）。\n\n### 社交动机：对归属的追求\n社交动机是与他人互动并获得归属感或联系的欲望。心理学家已经对社交动机的各种形式进行了理论化，包括归属感、亲密动机和内隐理论。\n\
  \n\n\n\n\nBaumeister 和 Leary (1995) 将**归属感**概念化为形成和维持强大、稳定的人际关系的需求。归属感通过自我的增强（及保护）、信任、理解和控制等心理机制得以促进（Fiske,\
  \ 2010）。这些心理机制使一个人能够在社会群体中有效地发挥作用。归属感的核心元素之一是亲和需求。Heckhausen (1991) 从各种形式的社会亲结描述了这些社会纽带的方面，其中包括对家庭的爱（例如孩子、配偶、父母）和友谊，以及与同性别、年龄相近的陌生人寻求并维持强有力的的关系。亲密动机侧重于与建立一对一关系的人追求温暖、亲近且良好的互动的动机（McAdams,\
  \ 1985）。另一种社会动机的形式是内隐性理论，它引导人们转向特定的驱动力（Dweck and Leggett, 1988）。\n\n### 成就动机：对成就的追求\n\
  \n成就动机是表现良好并追求成功的反复愿望（McClelland et al., 1953）。成就动机的方面包括重叠的概念，如自我效能感、能力自我概念、成就价值、自我决定、内在动机和外在动机（见\
  \ Mayer et al., 2007）。\n\n### 个性化目标\n\n个性化目标是心理学家所说的人类动机个性化的一种形式。个性化目标包含两个维度：个人奋斗和个人项目。个人奋斗是个体试图通过其日常行为实现的具有特定类型的目标（Emmons,\
  \ 1986; Little, 1999）。个人项目的范围很大，从“一次性”的追求、惯常行为或个人奋斗（例如锻炼），到跨越一生的终极承诺（例如解决世界饥饿问题）（Little,\
  \ 1983）。\n\n对人类动机和目标的研究已经发现，它们与许多心理过程和结果相关。在责任心较高的女性和男性中，Winter 和 Barenbaum (1985)\
  \ 发现权力动机可以预测负责任的社会权力行为；但在责任心较低的群体中，权力动机则会预测各种挥霍、冲动的行为（例如攻击性、饮酒）。成就动机被发现与表现、记忆、学习和感知有关。心理学家已经揭示社会动机与积极的心理调节和福祉有关（Baumeister\
  \ and Leary, 1995）。个性化目标有助于人的心理健康。具体来说，人们在追求个人目标并取得进展时往往是最快乐的，特别是当这些目标与他们人格中更一般的动机趋势（即成就、权力和社会动机）一致时。\n\
  \n### 叙事身份与“自传体作者”：创造生活赖的叙事\n\n人们在脑海中创造出一个个人生活故事。人格心理学家将其称为个人的叙事身份，或者一个内化的、不断演变的自我叙事（Winston,\
  \ 2011）。个人参与以培养叙事身份的自传叙述心理过程很大程度上是无意识且具有选择性的。通过这种方式，人格心理学家解释说个人会对过去、感知当下和预期的未来进行重新解释（McAdams,\
  \ 2001; Singer, 2004, 2005）。\n\n叙事身份和生命故事构建的心理功能是为个人提供目标感、自我连贯性和跨时间的认同连续性。心理学家识别出人们追求的紧迫认同问题是：“我是谁？”（Erikson,\
  \ 1968）以及“我如何在生活中找到统一和意义？”（McAdams, 2001）。这些是人格心理学家追求的关于叙事身份的关键问题。在此，他们关注理论和研究，以描述、解释并揭示个人内化的、不断演变的自我叙事。在他开性的身份地位理论中，Erikson\
  \ (1963) 解释说年轻人通过通过一系列关注爱、工作和承诺的社会心理身份阶段来发展认同，其中最后一个阶段最为完善。McAdams (1985) 通过引入生命故事理论详细阐述了\
  \ Erikson 的认同理论，将这段旅程重新概念化为关于自己的故事（Hammack, 2008; McAdams and Manczak, 2011; McAdams,\
  \ 2001; McLean et al., 2007; Winston-Proctor, 2018）。\n\n根据叙事身份研究在理论和方法论上的进展，心理学家已经确定了涉及个人内化和不断演变的自我叙事的几个认知过程。这些过程中最重要的是叙事处理和自传式推理。叙事处理主要关于自传记忆的叙事结构，而自传式推理则是意义构建的叙事操作（Singer\
  \ and Bluck, 2001）。\n\n在对人格心理学以及发展心理学和其他领域叙事身份发现的分析中，McAdams 和 McLean (2013)确定了以下叙事身份主题：代理性、共融、救赎、污染、探索性叙事处理和连贯解决。\n\
  \n人格心理学家将自传记忆概念化为叙事身份的基石（Singer et al., 2013）。自传记忆是一个更大的自我记忆系统的一部分。这个更大自我记忆系统的一个显著模型是\
  \ Conway 和 Pleydell-Pearce (2000) 的自我记忆系统模型。该模型描述了这个记忆系统如何包含一个自传知识库和工作自我的当前目标。工作自我的目标结构对于自传记忆的编码和检索都至关重要。一些学者认为，自传记忆主要是目标达成中失败和成功的记录（例如，\
  \ Conway, 1992）。在这个自我记忆系统中，自传记忆包含不同特异程度的知识：生活时期、特定事件、一般事件（Conway and Pleydell-Pearce,\
  \ 2000）。\n\n总之，为了描述个体行为差异和理解整体，理解人格中叙事身份维度的关键概念如下：\n\n-   **叙事身份**：一种内化的、不断演变的自我叙事，是人类人格的发展层级（McAdams\
  \ and Pals, 2006; McLean, 2008; Singer, 2004）。\n-   **叙事处理**：对生活经历进行故事化描述的构建，这依赖于生动的图像、熟悉的故事情节，以及生活在主流文化主题或冲突背景下的原型人物（Singer\
  \ and Bluck, 2001）。\n-   **自我记忆系统**：一个自传记忆系统，包含一个自传知识库，该库对工作自我的情感和目标产生的线索及激活模式十分敏感（Conway\
  \ and Pleydell-Pearce, 2000）。\n\n\n\n\n\n**自我定义记忆**：一种生动的、情感强烈的、且经过反复演练的自传记忆。它们与个人其他具有相同主题和叙事序列的其他重要记忆相连。Singer\
  \ 等人（2013）解释说，自传记忆还反映了个人最持久的关注点（例如成就、亲密关系、精神性）和/或未解决的冲突（例如兄弟竞争、对父母形象的矛盾纠结、成瘾倾向）。\n\
  \n关于叙事身份的研究已经发现它与许多心理过程和结果相关联。在对近期叙事身份研究的综述中，McAdams 和 McLean（2013）发现，研究人员主要关注叙事身份与心理调控及发展之间的关系。从这些研究中，他们得出结论：“叙事身份能够在苦难和逆境中发现救赎意义，并构建出以个人能动性和探索为主题的人生故事的个体，往往能够拥有更高水平的心理健康、幸福感和成熟度”（McAdams\
  \ and McLean, 2013; p. 233）。与之相关，Singer 等人（2013）阐述了健康叙事身份如何将叙事的特殊性与适应性的意义构建相结合，以实现洞察力和幸福。\n\
  \n## 2.3 结论\n\n网络攻击的防御者可以受益于了解理论概念化，行为科学家利用这些概念作为确定个人人格特质、人格特征适应（例如动机、目标）以及叙事身份的工具，用以击败相关攻击。了解人格心理学家所使用的人格理论概念化，使对行为网络安全感兴趣的人能够根据持续的科学研究，自主探索人格的发展趋势。此外，通过这些知识，行为网络安全学者和从业人员可以探索如何从源于特定网络安全案例和场景的观察线索中，揭示这些人格维度。\n\
