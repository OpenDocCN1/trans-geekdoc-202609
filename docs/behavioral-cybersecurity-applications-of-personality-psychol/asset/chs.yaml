  \n- 一个元素（在任何乘法表中）具有乘法逆元 $\\Leftrightarrow$ 如果该元素对应的行中有一个 `1`。\n- `Z6` 中哪些元素有逆元？\n\
  - `Z7` 中哪些元素有逆元？\n- 6 和 7 之间的本质区别是什么？\n- 一个是质数（所有非零元素都有逆元）。\n- 另一个是合数（某些非零元素没有逆元）。\n\
  - 事实上，没有逆元的元素恰恰是与该合数有公数的元素。\n\n通常情况下，在基于数字 `n` 的模运算体系中，如果 `n` 是一个合数，那么总存在一对小于 `n`\
  \ 的数字 `a` 和 `b`，它们的乘积在乘法表中为 `0`，在这种情况下，`a` 和 `b` 在 `Zn` 的乘法运算中均没有逆元；然而，如果模系统是基于质数——我们称之为\
  \ `p`——那么 `Zp` 中的每个非零元素都将具有乘法逆元。\n\n当然，原因在于，当 `n` 是合数时，如果你取两个大于 `1` 的因子 `a` 和 `b`，那么\
  \ `a * b ≡ 0 (mod n)`；而观察结果显示，在质数 `p` 的情况下，`Zp` 中的每个非零元素都有乘法逆元。因此，我们可以得出，当 `p` 是质数时，模系统\
  \ `Zp` 是一个域，而 `n` 是合数时则不是。\n\n对于不熟悉模运算的人来说，不要掉进这个陷阱：在模系统 `Zn` 中，当 `n` 是质数时，`Zp`\
  \ 包含了两种结构（加法和乘法），并且满足分配律 `a * (b + c) = a * b + a * c`（对于所有 `a`, `b`, `c`）。\n\n\
  欧拉函数 `φ(n)` 统计的是 `1` 和 `n` 之间有多少个与 `n` 互质数。显然，如果 `n` 是质数，`φ(p) = p - 1`。通常情况下，对于大数字\
  \ `n`，`φ(n)` 是不可行的。我们知道，如果 `n` 是质数 `p`，`φ(p) = p - 1`。如果 `n` 是两个质数 `p` 和 `q` 的乘积\
  \ (`n = pq`)，那么 `φ(n) = (p - 1) * (q - 1)`。\n\n关于欧拉函数有一个在加密中经常出现的极其重要的结果。我们不证明，但在任何代数书中都能找到：对于任何数字\
  \ `n`，对于任何与 `n` 互质的 `a < n`，模 `n` 方可以得到 `a^φ(n) ≡ 1`。这有时被称为“费马小定理”。\n\n### 有限域\n\
  该系统也可以被视为整数 `Z/(p)`，这意味着在这个新系统中合并了所有相同余数 `p` 的值。我们看到如果 `p` 是质数，系统 `Zp` 具有所有非零元素都有乘法逆元的特殊属性；即对于任何\
  \ `a ≠ 0`，存在某个 `b` 使得 `a * b ≡ 1 (mod p)`。这种带有加法和乘法的 `mod p` 代数系统被称为域。事实上，对于所有质数\
  \ `p` 都可以定义这样的（有限）域。\n\n我们可以进一步研究有限域。我们可以定义单变量多项式系统 `Zp[x]`，然后 `Zp[x]/(q(x))`，其中\
  \ `q(x)` 是一个次数为 `n` 的不可约多项式。多项式的加法和乘法与通常相同，系统中的系数始终模 `p`。\n\n例如，在模 13 多项式系统 `Z13[x]`\
  \ 中，如果我们有 `p1 = (3x² + 4x + 2)` 和 `p2 = (x³ + 5x² + 10x + 5)`，那么：\n\n```\n\\begin{matrix}\
  \ p1 + p2 = (3x² + 4x + 2) + (x³ + 5x² + 10x + 5) = (x³ + 8x² + 14x + 7) \\\\ =\
  \ (x³ + 8x² + x + 7) (mod 13) \\end{matrix}\n```\n\n```\n\\begin{matrix} p1 * p2\
  \ = (3x² + 4x + 2) * (x³ + 5x² + 10x + 5) \\\\ = 3x⁵ + (15 + 4)x⁴ + (1 + 20 + 30)x³\
  \ + (15 + 40 + 10)x² + (20 + 20)x + 10 \\\\ = 3x⁵ + 6x⁴ + 12x³ + 0x² + x + 10 (mod\
  \ 13) \\end{matrix}\n```\n\n不可约多项式 `q(x)` 就像质数一样——它们不能被分解（系数分解除外）。以此类比，合并相同余数 `mod\
  \ q(x)` 的项式系统也变成了一个域，我们称之为 GF(p,n)，即伽罗瓦域。再次，`p` 是系数的模系统，而 `n` 表示多项式的次数——一旦我们除以 `q(x)`，就不会有任何项的指数高于\
  \ `(n − 1)`。\n\n\n\n\n# 18.4 关于伽罗斯域的主要结论\n\n这些系统的理论是埃瓦里斯特·伽罗瓦（Evariste Galois）在\
  \ 19 世纪初开发的成果，它指出所有具有有限数量元素的代数域都可以描述为 `GF(p,n)`（包括域 `Zp`，因为它们可以被认为是 `GF(p,1)`，即除以次数为\
  \ 1 的不可约多项式[如 `ax + b`]）（图 18.1）。\n\n![](img/018x001_fmt.jpeg)\n\n此外，`GF(p,n)`类型伽罗斯域的所有可能选择都是等价的，它们的元素个数为\
  \ `pn`。\n\n关于伽罗瓦本人：他 119 世纪初生活在巴黎（Bell 1937）。他在青少年时期就开发了这些非常重要的代数结果。他还是一个政治激进分子，进过监狱。释放后，他对一个年轻女性的兴趣导致了一场决斗，他在\
  \ 21 岁时遇害。这真的是一个陷阱，因为那个心仪对象的男友实际上是一个卧底，法国军队中最好的射击手之一。\n\n他并没有给伽罗斯域命名；它们是以他的名字命名的。\n\
  \n## 18.5 矩阵代数或线性代数\n\n矩阵或数组是某种类型数字（例如整数、有理或实数）的集合，被视为具有特定行或列数的矩形集合。如果一个矩阵有 `m`\
  \ 行 `n` 列，因此总共有 `m × n` 个元素，我们称该矩阵的阶数为 `m × n`。\n\n这是一个具有实数数值的 `4 × 3` 矩阵 `A` 的示例。我们通常用方括号将矩阵的值括起来。\n\
