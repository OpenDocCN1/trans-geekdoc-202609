  \n## 27.1 像分析 (Profiling)\n\n我们提供了一些画像分析技术的示例，但读者可以找到许多其他关于近年来发生的其他攻击案例的描述。我们使用的索尼影视（Sony\
  \ Pictures）案例非常有趣，因为它触及了多种主题和动机。但读者可能会发现分析 `WannaCry`、`Petya`、`假新闻事件`以及许多其他案例也同样感兴趣。\n\
  \n## 27.2 社会工程学 (Social Engineering)\n\n社会工程学为非法入侵黑客方法的发展提供了一个持续且重要的途径。研究社会工程方法成功之学生可以从两个角度切入：首先，理解粗心的用户在尝试猜测特定密码时向黑客或“翻垃圾桶者”提供的泄露；另一方面，人们也可以意识到在非常仔细地开发密码方法时所提供的安全性。本书还介绍了我们现在称为“密码强度计”（password\
  \ meters）的效用或徒劳性，该领域对于可能以更严谨的方式为此类计设计标准的人来说是开放的。\n\n对这一领域感兴趣的人还应该考虑从我们所说的“单因素认证”（如密码或生物识别）转向“多因素认证”的挑战，这既从提供的安全性角度考虑，也从将全球密码系统用户世界迁移到多因素环境的难度考虑。\n\
  \n## 27.3 Sweeney 隐私 (Sweeney Privacy)\n\nSweeney 研究结果（第 6 章）显示，美国几乎 90% 的用户可以通过三条通常可以获得的信息被唯一确定，这让许多人感到震惊。该领域的进一步研究可以考虑其他形式识别所提供的安全水平。本书作者的未来研究将证明，Sweeney\
  \ 研究中描述的数据使得许多国家的隐私问题更加不安全，而类似的数据在某些其他国家并没有那么大的威胁。\n\n## 27.4 理解黑客 (Understanding\
  \ Hackers)\n\n我们试图提供了一些某些愿意在文献中描述自己的黑客心理学示例。但这是一个非常开放待进一步研究的领域。关于对更多已识别黑客动机进行分析的文献并不多，对黑客组织行为倾向的理解更少。\n\
  \n## 27.5 博弈论在画像分析中的应用 (Game Theory Application to Profiling)\n\n博弈论通通常有大量的学术成果，但在网络安全领域的应用非常少。我们认为，这很可能是因为网络安全问题的研究人员往往倾向于采用定量方法进行研究。\n\
  \n## 27.6 图灵测试 (Turing Tests)\n\n图灵测试仍然是一个迷人的例子（正如我们所称），不仅存在人类（或机器）之间，而且正如我们所预测的，存在不同群体之间。它是阿兰·图灵留给我们的。\n\
  \n## 27.7 加密与隐写 (Crypto and Stego)\n\n一个可以具有重大研究价值的领域是开发同时使用密码学和隐写技术的措施。隐写的重要性似乎是密码学的补充。\n\
  \n## 27.8 行为经济学 (Behavioral Economics)\n\n该领域已成为一个主要研究领域，尽管许多人也会认为它作为一个子学科具有同样重要的意义。在我们的案例中，关于如何将其应用于网络安全问题的研究还非常少。\n\
  \n## 27.9 假新闻 (Fake News)\n\n这在许多方面是出现的一个新领域。尽管正如我们在第 23 章中描述的，我们几乎可以将假新闻追溯到人类历史的黎明，但此类新闻的传播得到了当前技术领域（特别是互联网的使用）的赋能。我们建议进一步研究的问题是开发人类开发或人工智能技术来检测我们所谓的“假新闻”，这不仅是一个完全开放的领域，而且对计算机行业的主要机构也具有实质兴趣。\n\
  \n## 27.10 密码强度计 (Password Meters)\n\n我们提到过通常来说，在开发衡量密码强度的计方面并不成功。问题在于该领域是否可以改进，或者是否存在适用于所有情况的标准衡量方法来确定密码的强弱。\n\
  \n## 27.11 下一步工作 (Next Steps)\n\n作者非常希望鼓励行为网络安全这一新兴领域的课程开发和研究工作。因此，如果我们能听到许多参与这一新且充满前景领域的课程或研究的学生和教授的消息，我们将感到非常高兴。\n\
