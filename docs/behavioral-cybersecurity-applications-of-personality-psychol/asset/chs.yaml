  \ 的解密结果。\n\n\n\n\n在本书中，你将发现许多——特别是四个——我们所说的 `Hack Labs`（黑客实验室）。这些实验室旨在为学生提供实践经验，让他们处理许多对保护计算环境至关重要的网络安全问题。\n\
  \n这些实验室的另一个目的是，并非必须，但可以有一个支持性的物理计算机实验室来执行这些项目。这些项目也可以在学生自己的计算设备上完成，且不需要在固定的实验室期间内完成。\n\
  \n当作者提供这些实验时，他们通常会给学生一周的时间来进行研究并提交结果。\n\n## 11.1 黑客实验室 3：斯威尼隐私研究\n\n拉塔尼娅·斯威尼（LaTanya\
  \ Sweeney）博士是现任哈佛大学政府与技术教授，她在她在麻省理工学院（MIT）的计算机科学博士论文中发表，仅凭三个易于获取的信息就可以唯一识别出超过 85%\
  \ 的美国人口：性别、个人的准确出生日期（包括年份）以及地址的邮政编码（Sweeney 2000）（图 11.1）。\n\n![](img/011x001_fmt.jpeg)\n\
  \n这次黑客实验的目的是确认斯威尼博士关于隐私的研究。她的研究明确表明，87% 的美国人口可以通过三个常用的可用数据点进行唯一识别：`{ 包含年份的个人出生日期、性别，以及居住地的美国邮政编码（5\
  \ 位版本） }`。\n\n实验提供了一个包含 20 个数据集的测试平台作为执行此实验室的样本。学生的目标是尝试识别出这些个人，在大多数情况下，这些个人提供了足够的信息以确定一个符合给定出生日期和居住邮政编码数据的美国个人。\n\
  \n当我们的学生在华德大学（Howard University）在不同场合进行这项实验时，通常会有大约一半班的学生在 24 小时内根据其个人数据识别出 10 个人。\n\
  \n给学生的唯一额外建议是，要寻找的对象具有某种程度的知名度。\n\n利用这些信息，并广泛访问健康数据库中未受保护或加密名称的健康记录，健康研究人员可以构建一个合法的查询，结果只返回一条记录，从而通过独立发现上述信息（准确出生日期和邮政编码），在不黑客或非法访问的情况下发现个人的健康记录。这说明了维护安全数据库方面存在的问题。\n\
