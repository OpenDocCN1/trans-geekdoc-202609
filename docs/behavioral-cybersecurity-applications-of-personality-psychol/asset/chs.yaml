  在密钥调度中，我们使用上一个密钥，将其与上一个密钥的其他部分进行异或运算，通过 S 盒并加上计数器。这次，我将只计算密钥的字（即 4 个字节）。\n\n取上一个密钥的前\
  \ 4 个字节：`2b 7e 15 16`。将最后 4 个字节左移一次：`09 cf 4f 3c → cf 4f 3c 09`。将这最后部分通过 S 盒：`SubByte(cf\
  \ 4f 3c 09) = 8a 84 eb`。这就是新密钥的前 4 个字节：`2b 7e 15 16 ⊕ 8a 84 eb ⊕ a0 fe 17 = c9 9a\
  \ f9`。\n\n## 19.3 密钥管理问题\n\n尽管 AES 或几乎所有加密方法都有其优缺点，但它们共同的一个问题是密钥管理。这种问题在于密钥必须被发送方和接收方共享，这以导致了\
  \ AES 或几乎所有的加密方法被统称为“对称加密”。\n\n## 19.4 对称加密或公钥加密\n\n无论 AES 的优缺点如何，它无法解决的问题就是密钥管理问题。假设我们有一个六个用户的网络，每个用户都需要与其他五个用户通信一个独立的密钥。因此，对于六个用户，我们需要（如图所示）：\n\
  \n```\n\\frac{6 \\times 5}{2} = 15\\text{ 个密钥}\n```\n\n通常情况下，会有 1000 个用户的网络，因此我们需要\n\
  \n```\n\\frac{1000 \\times 999}{2} = 499500\\text{ 个密钥。\n```\n\n遗憾的是，我们无法使用这个网络来分发密钥，因为在分发密钥之前网络是不安全的。\n\
  \n## 19.5 用于密钥管理的公钥密码学模型\n\n现在考虑以下方法。对于 1000 个用户中的每一个，选择一个密钥 `ki = (kpi, ksi)`，`i\
  \ = 1, …, 1000`。在全局公共目录中列出所有的“公”密钥 `kpi`，`i = 1, …, 1000`。然后，向用户 `j` 发送消息，选择公钥 `kpi`\
  \ 并应用加密变换 `c = T(kpi, m)`。\n\n发送密文 `c`。\n\n只有用户 `j` 拥有解密所需的剩余密钥：\n\n```\nT((kp[i],\
  \ ks[i]), c) = m\n```\n\n因此，与其在 n 个用户的网络中管理 O(n2) 个密钥的秘密分发，只需要 n 个密钥，而且它们不需要秘密分发。\n\
  \n## 19.6 身份验证\n\n此外，公钥概念还可以用于消息的身份验证，这是密钥系统无法解决的问题。\n\n\n\n\n考虑一个基于传统对称密钥加密系统。同样考虑它被用于银行网络中的资金转账。某天，系统管理员收到一封来自\
  \ X 的消息。管理员使用 X 与自己之间约定的密钥对消息进行解密。消息内容是：“从我的账户转账 1,000,000 美元到系统管理员的账户。”经理尽职执行了操作。\n\
  \nX 向当局投诉，称该消息是伪造的，是由经理本人（她）发送的。当从塔希提通过长途电话联系管理员评论时，他表示该消息是真实的，且 X 已经撤回了转账意愿。\n\n\
  由于 X 和经理都必须知道该密钥，使用该加密系统没有办法解决这一纠纷。\n\n然而，公钥加密系统可以解决这个问题。假设除了消息外，网络中的每次传输都要求进行“签名”，即包含一个使用\
  \ X 的公钥加密的尾部。那么，这一要求就具备了验证 X 消息真实性的能力，因为只有知道密钥其余部分的 X 能够解密尾部。\n\n## 19.7 我们能设计出公钥加密系统吗？\n\
  \n因此，如果我们能设计出公钥加密算法（PKC），它无疑具有最理想的特征。但仍有许多问题待解答。首先，我们能设计出 PKC 吗？我们需要寻找什么？其次，如果我们能找到，它会安全吗？它会高效吗？\n\
  \n目前，我们只考虑寻找 PKC 的通用参数。\n\n上述描述这种方法意味着加密信息的发送者和接收者拥有密钥的两个不同部分。由于密钥 `k` 被分为所谓的公钥（`kp`）和私钥（`ks`），且公钥部分公开公开以供任何人向密钥创建者发送消息，而私钥永远不会离开创建者，因此创建者和宇宙中的其他人拥有关于密钥的不同信息集，因此，这种方法被称为“非对称加密”。\n\
  \n这样定义问题无疑将解决密钥管理问题；因为每个人密钥的公钥部分只需要并且可以放在公开目录中，而私钥部分永远不需要离开创建者。但这仅仅是一个模型，并没有描述如何有效地实施这种非对称方法。这个问题由三位密码学家解决：罗恩·里维斯特（Ron\
  \ Rivest）、阿迪·沙米尔（Adi Shamir，来自麻理工学院）以及来自南加州大学的伦·阿德曼（Len Adelman），并被称为 RSA 公钥加密系统（Rivest\
  \ et al., 1978）。\n\n## 19.8 RSA 公钥加密系统\n\n### 19.8.1 质因分解\n\n从前面的描述中，我们需要找到“单向”函数，即这些函数能够实现足够加密的高效计算，但其逆函数在密码分析学上极难找到。\n\
  \n我们将研究的示例涉及数字相乘的易用性，以及给定积后寻找原始因子的困难性。\n\n### 19.8.2 皮埃尔·德·费马是谁？\n\n他是 17 世纪的一位法国数学家（1601–1665）。他购买了图卢斯议会的议员职位。这使他将名字从“Pierre\
  \ Fermat”改为“Pierre de Fermat”（!）。\n\n他是几何学和数论的先驱（Mahoney, 1994）（[图 19.2]）。\n\n![](img/019x002_fmt.jpeg)\n\
  \n## 19.9 费马大定理\n\n考虑\n\n$3² + 4² = 5²$，$(9 + 16 = 25)$\n\n$5² + 12² = 13²$，$(25\
  \ + 144 = 169)$\n\n$7² + 24² + 25²$，$(49 + 576 = 625)$\n\n是否存在 $n > 2$ 且 $x^n +\
  \ y^n = z^n$ 的例子???\n\n### 19.9.1 323 年的边注\n\n费马在晚年发表了一本关于几何的论文，在结论之前，他在边缘处写道：“我发现了一个非常奇特的证明，这个边缘太小了写不下。”费马的边注导致了许多许多解决他“最后定理”的徒劳努力。它最终在\
  \ 1993 年被安德鲁·怀尔（Andrew Wiles）解决。（答案是，对于 $n > 2$，不存在任何满足该方程的值。）\n\n## 19.10 小费马定理\n\
  \n正如我们在同余术章节看到的，小费马定理说，如果我取任何一个数，对其进行 $\\phi(n)$ 次幂，并将结果除以 $n$……我将得到余数 1。用数学符号表示：\n\
  \n$a^{\\phi(n)} \\pmod n) = 1$\n\n这是开发加密系统的基础。\n\n## 19.11 RSA 加密系统\n\n大约 30 年前，三位计算机科学家罗恩·里维斯特（Ron\
  \ Rivest）、阿迪·沙米尔（Adi Shamir）和伦·阿德曼（Len Adleman）开发了一种加密系统，他们称为 RSA 加密系统。它完全基于费马定理。\n\
  \n### 19.11.1 什么是 RSA 加密系统？\n\n它简单到 RSA 公司把它印在了 T 恤上（[图 19.3]）。\n\n![](img/019x003.jpeg)\n\
  \n* 取两个质数 `p` 和 `q`（200 位），并计算 `n = pq`\n* 找到 `e` 和 `d` 使得它们乘对于 $(p-1)(q-1)$。\n\
  * 加密时，取 `m` 的 `e` 次幂。\n* 解密时，取 `c` 的 `d` 次幂。\n\n### 19.11.2 为什么你应该怀疑\n\n1. 我们能找到质数\
  \ `p`, `q`（200 位）吗？嗯，并不真的。但我们可以使用一种算法，无论是索洛维-斯特拉斯还是莱曼，这会在 2100 次中出现一次。\n2. 我们能把它们相乘吗？如果你愿意花整个下午的时间，可以手工完成。计算机只需一秒。\n\
  3. 我们能找到一个 `e` 使得 `GCD(e, ϕ(n)) = 1` 吗？在实践中，随机选择 `e` 在少量范围内可行。\n4. 如果我们找到了这样的 `e`，能找到\
  \ `d` 使得 `e × d ≡ 1 (mod ϕ(n))` 吗？通常尝试几次即可。\n5. 我们能现实地计算 `me (mod n)` 或 `cd (mod\
  \ n)` 吗？参见幂算法。\n\n## 19.12 质性检验\n\n### 19.12.1 如果我们无法分解大数\n\n我们如何判断它们是质数？\n\n答案是，我们不能。但我们可以选择一个数字\
  \ `p`，如果它通过了一组被称为“质性检验”的测试，我们愿意接受它是质数，错误的概率为 1/2100。\n\n索洛维-斯特拉斯（Solovay and Strassen,\
  \ 1977）或莱曼-佩拉尔特质性检验可以被使用。\n\n为了测试 `p` 的质性，首先随机选择 100 个数 `<p, e1, ... , e100>`。\n\
  \n对于 `i = 1, ... , 100` 计算 `GCD[ei, p]`。\n\n如果任何 `GCD` >1，丢弃 `p` 并重新开始！\n\n对于每个\
  \ `ei` 和 `p`，计算一个称为雅可比符号的数。它要么是 1 要不是 -1。如果雅可比符号为 1，那么 `p` 不是质数的概率只有 50% 且符号为 1。\n\
  \n因此，如果所有 100 个雅可比符号均为 1，那么 `p` 不是质数的概率只有 1/2100。\n\n## 19.13 快速幂算法\n\n### 19.13.1\
