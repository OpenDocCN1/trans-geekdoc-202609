  \ security`。我不认为女性的情况是这样，大多数女性才开始接触 STEM 专业的和计算机科学。\n\n\n\n\n\n## 女性与计算机科学及网络安全\n\
  \n**21** 历史上，女性并不被鼓励追求 STEM 相关的领域，如工程和计算机科学。通常，她们被引导进入教育行业或技术倾向不那么强的职业。此外，存在一种刻板印象，认为所有的计算机科学家和工程师都是男性。因此，这导致更少的女性会去考虑计算机科学或网络安全。此外，在网络安全方面，大多数女性甚至不知道它究竟是什么！对一个主题一无所知是不追求它的绝佳借口。在未来，学校和媒体应该努力增加女性对网络安全的接触面，而不是排斥女性并告诉她们这太难了。\n\
  \n**22** 我认为计算机科学领域竞争非常激烈，而且它并没有被真正作为一个针对女性的领域进行广泛宣传。当人们听到“工程”时，很少有人会想到女性是工程师，因此这让想要进入这一职业领域的女性感到有些灰心。此外，当在建立简历时，许多人会寻找像黑客松（hackathons）之类的活动积累经验。在我个人看来，黑客松很有趣，但我并不想反复参加。熬夜超过\
  \ 24 小时、坐在电脑前的桌子旁、不洗澡；这绝不是一个吸引女性的环境。\n\n**23** 如果你查看专门从事网络安全的计算机科学家统计数据，这个数字也很低。网络安全不是一个华丽的领域。网络安全不受欢迎的原因之一是因为很难。另一个原因是网络安全没有得到像应用开发那关注。这些原因解释了为什么计算机科学在女性中并不流行。\n\
  \n**24** 我确实相信大多数人对网络安全并不了解。即使是计算机科学领域的人，其知识也局限于那些涉足计算机科学某一领域的人。因此，了解计算机科学的女性数量有限，而了解网络安全的女性更是寥少。对于他们不知道的内容，他们甚至机会产生兴趣，这解释了对网络安全感兴趣的女性比例较低的原因。通常，我认为那些了解一点网络安全的女性可能会发现那一点点知识很无聊。\n\
  \n## 人格测试、方法与评估\n\n约 8700 万名 Facebook 用户的个人数据是通过 270,000 名使用名为“这是你的数字生活”（This Is\
  \ Your Digital Life）Facebook 应用的用户获取的。由于用户允许该第三方应用收集其数据，他们也赋予了该应用访问其朋友数据的权限。这项测试的基础是对常见的“大五”人格特征的人格评估。这个案例揭示了关于人格测试、方法和评估的多个层面的有趣问题。例如，如何通过社交媒体应用程序衡量个人的人格特征，以产生有效且可靠的人格数据，并将这些数据应用于影响广告策略和政治？在一个假设的世界中，如何使用人格测试、方法和评估来评估研究人员、商界人士和社交媒体公司可能的动力机制？\n\
  \n在行为科学领域，研究人员在设计研究以理解人类行为时，会追求并考虑一系列研究问题。行为科学中存在一种研究过程，它涉及到对知识本质（认识论）、执行研究的通用方法（方法论）以及收集和分析数据的程序（方法）的多种类型的考量。在前几章节中讨论的人类人格概念化中的理论多样性，与研究人格时所使用的方法论变异性相匹配。\n\
  \n### 17.1 人格心理学中使用的研究设计\n\n在行为科学中，研究设计是对现象查询的通用方法。Crotty (1998) 在其著作《社会研究的基础：研究过程中的意义与观点》（*The\
  \ Foundations of Social Research: Meaning and Perspective in the Research Process*）中，根据与设计相关的四个关键问题描述了研究设计的的基本方法：(1)\
  \ 我们提出了哪些方法？(2) 什么方法论指导我们对方法的选择和使用？(3) 所述方法论背后有什么理论视角？(4) 什么认识论告知了这一理论视角？Crotty\
  \ (1998) 对这些问题中的核心概念定义如下。\n\n#### 17.1.1 研究过程\n\n- **方法论** (p. 7): 查询的设计策略（一种塑造我们对特定方法的选择和使用，并将其与预期结果联系起来的行动计划）\n\
  - **方法** (p. 6): 收集和分析数据的程序和技术（执行我们研究活动/设计/行动计划的具体规定和细节）\n- **理论视角** (p. 7): 对看待世界和理解世界方式的哲学立场（支撑我们对方法论的选择，为过程提供背景并使其逻辑化，使我们带入方法论的假设显性化：我们如何知道我们所知的？）\n\
  - **认识论** (p. 8): 关于“认知”本质的理论（知识的本质是什么？——例如，它是被发现的还是被构建的？）\n\n#### 17.1.2 研究设计\n\
  \n在接下来的描述中，重点介绍了最常用设计之间的关键区别特征，以及行为科学中用于理解人格的特殊交叉设计。\n\n##### 17.1.2.1 实验设计\n\n\
  - 重点关注中心趋势（对比变异）。\n- 查询的目的是评估一个或多个实验操纵对因变量的因果影响，并对变量之间的因果关系得出结论。\n- 本质上，在实验设计中，“实验条件差异导致的均值差异被认为反映了自变量对因变量的直接因效应”（Revelle,\
  \ 2007, p. 38）。\n- 使用实验设计的人格研究示例是 Revelle 等人 (1980) 的实验研究，该研究探索了以下问题：人格和时间对咖啡因是否存在交互作用？\n\
  \n##### 17.1.2.2 相关设计\n\n- 这些设计中的重点是变异性、关系和个体差异。\n- 人格研究中最常用的方法（Robins et al., 2007）。\n\
  - 查询的目的是评估两个或多个变量之间的关系并进行预测。然而，无法确定因果关系。\n\n\n\n\n\n# 人格设计\n\n一个使用相关设计的人格研究示例是 Lester\
  \ 等人 (2006) 的研究，该研究采用相关设计来探索以下研究问题：人格的不同维度与 eBay 的使用之间是否存在某种关系？\n\n## 叙事设计\n\n-\
  \ 强调经验的叙事性质（Winston, 2011; Winston-Proctor, 2018）。\n- 调查的目的是从叙事结构、内容和表现方面推进对经验本质的理解（例如，个体试图通过其话语做什么）。\n\
  - 人格研究的叙事方法在心理学早期就已出现，但在 2000 年代变得日益流行（特别是在研究生中）（Singer, 2004）。\n- 叙事设计可以被视为一种具有许多变体的混合设计，包括心理传记、集体比较、案例研究、纵向设计（例如，研究叙事认同的连续性）。\n\
  - 一个使用叙事设计的人格研究示例是 McAdams 等人 (2006)，旨在回答以下研究问题：大学生在叙事认同的叙事复杂性以及代理与成长的主题上，是否表现出从大一到大四的连续性？\n\
  \n## 人格心理学中使用的特殊交叉设计\n\n### 案例研究设计\n\n- 强调单个案例或一组案例。\n- 案例是一个边界系统；在人格心理学中，个体或生命是最典型的边界系统。\n\
  - 调查的目的从理论测试到理论开发不等，可以包括个案（idiographic）或统论（nomothetic）重点。McAdams (2006) 以以下方式描述了这两种方法之间的区别：人格心理学家开发并验证衡量个体差异的方法，这需要对大量个体样本中人类变异的单一维度进行定量且聚焦的调查——这就是戈登·阿尔波特称为的人格研究统论方法。同时，人格心理学家旨在将关于人类变异许多不同维度的各种概念化和发现整合在一起，形成个体案例的明晰人格肖像——这就是阿尔波特所说的个案方法。如何协调一方面分析性的、定量的统论研究与另一方面综合性的、定性的、个案调查之间的不同需求，自“人格心理学诞生之初”以来一直是一个核心困难题（第\
  \ 13 页）。\n- 通常使用多个数据源（例如：原始文献、访谈、观察、问卷等）。\n- 可以是定量的、定性的或混合方法设计（例如，McAdams and West,\
  \ 1997）。\n\n### 经验采样法\n\n- 强调衡量参与者在日常生活中，在特定情境下瞬间的感受、思想、行为和/或活动（Larson and Csikszentmihalyi,\
  \ 1983）。\n- 调查的通常是为了实现以下目标之一：考察时间和行为分布、情境与行为、偶然性、日常过程以及日常经验结构方面的个体差异（Conner et al.,\
  \ 2009）。\n- 识别特定个体内部的行为模式，而不是像其他标准统论方法那样严格地识别跨个体的行为模式。\n- 本质上，“通过在瞬间通过重复测量捕捉经验、情感和行动，经验采样法\
  \ [ESM] 允许研究人员扩展他们可以调查和描述的参与者经验领域和方面，并更好地理解人类和背景如何塑造这些经验”Zirkel 等人 (2015)。\n\n##\
  \ 人格测试、方法与评估\n\n### 人格特质评估\n\n#### NEO PI-R\n\nNEO PI-R 是一种用于评估人格特质五因素模型 (FFM) 的标准化问卷（即人格特质的大五人格模型）（McCrae\
  \ and Costa, 1997, 1999; McCrae, 1992）。该测量工具包含了人格特质的五因素模型 (FFM)。\n\n\n\n\n主题统测验（Atkinson,\
  \ 1958; McAdams, 1984; Morgan and Murray, 1935; Murray, 1938; Winter, 1973; Woike\
  \ et al., 1999）。该测试包含一些提示，个体通过对提示做出反应来讲述关于图片的故事。然后研究人员解释这些故事，通常使用心理学家开发的、在各项研究中具有有效性和可靠性的编码系统。这些编码系统的示例发表于\
  \ Smith (1992)，如下：亲密性动机评分系统（McAdams, 1980, 1992）、归属动机评分手册、归属信任-不信任评分系统（McKay, 1992）、成就动机评分手册（McClelland.,\
  \ 1958）、回避成功动机评分手册（Horner and Fleming, 1977）以及权力动机评分系统（Winter, 1992）。\n\n成就动机问卷和量表被用于衡量个体的动机。除了人格研究表（Jackson\
  \ et al., 1996）外，几乎所有这些量表都是为了衡量处于不同发展阶段的学生（即儿童、青少年和成年人）的成就动机设计的。\n\n### 17.2.2.1\
  \ 人格研究表\n\n该测试衡量成就动机以及其他 21 种动机。\n\n正如 Mayer 等人 (2007) 指出的，人格研究表（Jackson et al.,\
  \ 1996）是第二常见的通用动机测试，而主题统测验（TAT）是最常见的。\n\n#### 学业动机量表 (AMS) (Vallerand et al., 1992)\n\
  \n该量表评估了个体的成就动机点归因，以及衡量内在和外在动机的其他子表。\n\n#### 学习动机策略问卷 (MSLQ) (Pintrich et al., 1993)\n\
  \n该问卷包含 15 个针对大学生的策略量表，用于衡量学习和资源管理的认知和动机组成部分。\n\n#### 个性化目标\n\n人格心理学家认为，个性化目标的衡量是对目标的直接或显性性测量。\n\
  \n#### 17.2.2.2 个人项目评估\n\n个人项目分析（Little, 1983）评估了人们在一生中所关注的活动和关注点。个体在任何时间都可能拥有若干他们正在思考、计划、执行并有时（尽管并非总是）完成的个人项目。使用这种评估方法，个体首先被要求执行以下操作：写下尽可能他/她目前正在参与或考虑的个人项目和活动。随后，要求个体选择\
  \ 10 个对其感受重要的项目，并要求其根据以下维度对每个项目进行评分：重要性、难度、可见性、控制力、责任、时间充足性、成功的可能性、自我认同、他人对重要性的看法、价值观一致性、进展、挑战、投入度、支持、能力、自主性、阶段和感受。带有这些组件的。\n\
  \n### 17.2.2.3 个人针刺评估\n\n个人项目分析（Little, 1983）评估了人们在一生中所关注的活动和关注点。个体在任何时间都可能拥有若干他们正在思考、计划、执行并有时（尽管并非总是）完成的个人项目。使用这种评估方法，个体首先被要求执行以下操作：写下尽可能他/她目前正在参与或考虑的个人项目和活动。随后，要求个体选择\
  \ 10 个对其感受重要的项目，并要求其根据以下维度对每个项目进行评分：重要性、难度、可见性、控制力、责任、时间充足性、成功的可能性、自我认同、他人对重要性的看法、价值观一致性、进展、挑战、投入度、支持、能力、自主性、阶段和感受。\n\
  \n### 17.2.2.3 叙事评估\n\n#### 17.2.2.3.1 心理传记\n\n正如 Mayer 等人 (2007) 指出的，人格研究表（Jackson\
  \ et al., 1996）是第二常见的通用动机测试，而主题统测验（TAT）是最常见的。\n\n#### 17.2.2.3.2 生命故事访谈\n\n生命故事访谈（McAdams,\
  \ 1985）是一种半结构化的口头访谈，捕捉一个人的人生故事。通过这种人格工具，通过访谈探询评估叙事身份建构，让受访者有机会描述其故事中的关键场景、人物和情节。具体来说，McAdams\
  \ (2007) 将生命故事访谈描述为一个期 2 小时的程序，个体通过回答一系列开放式问题，对其生活——过去、现在和想象的未来——提供叙述性说明。该程序首先要求受访者将其的人生分为若干章节，并提供每个章节的简要情节大纲。接下来，访谈要求对故事中的八个场景进行详细描述，包括高点、低点和转折点。访谈方案还包括想象的未来章节以及故事情节发展的价值观和信念。\n\
  \n#### 17.2.2.3.3 引导工具\n\n自传（McAdams, 1997）是一种围绕关键生命事件或片段组织的结构化书工具。McAdams (1997)\
  \ 将片段描述为发生在特定时间和地点并由于某种原因而脱颖出的特定事件。该工具的程序核心是让参与者对以下每个关键生命事件或片段写至少一两段描述：顶点（高点）、最低点（低点）、转折点、连续性、童年、青少年期、道德、目标。\n\
  \n\n\n\n自我定义记忆任务（Singer and Blagov, 2004）是一种用于捕捉自我定义记忆的工具。自我定义记忆是一种包含非常特定属性的个人记忆。自我定义记忆任务要求受访者回忆一段包含以下属性的个人记忆：(1)\
  \ 至少是 1 年以前的；(2) 是他们生活中一段他们记得非常清晰的记忆，而且即使在想起它时仍然觉得非常重要；(3) 是关于他们生活中某个重要且持久的主题、问题或冲突的记忆；(4)是一段有助于解释他们作为个体的身份的记忆，并且如果他们想让某人深刻地理解自己，他们可能会向别人讲述这段记忆；(5)\
  \ 是与具有相同主题或关注点的其他相似记忆相关的记忆；(6) 该记忆在情感感受上可能是正面的、负面的，或者两者兼有。唯一重要的方面是它能引起强烈的情感；(7)\
  \ 是他们思考过很多次的记忆。它应该对他们来说很熟悉，就像你研究过的画或你背诵过的歌（快乐或悲伤的）一样。\n\n程序首先要求受访者回忆并构建 10 个自我定义记忆。接下来，要求受访者回忆其第一个自我定义记忆，并使用从\
  \ 0（完全不）到 6（非常）的评分量表来表示他们在回忆和思考这段记忆时的感受。该量表包括对以下情绪的评分：快乐、悲伤、愤怒、恐惧、惊讶、羞愧、厌恶、内疚、好奇、尴尬、轻蔑和自豪。它还要求受访者指示记忆的生动性和重要性，以及记忆发生至今的大约年份。\n\
  \n## 17.3 结论\n\n人格研究调查方法和用于评估人格的人格测试可以通过应用和产生人格方法，以更好地理解、保护和防御网络安全情况下的信息和系统，从而推动网络安全科学。这种行为网络安全研究的副产品不仅可以推进行为网络安全新兴领域的知识库，还能推进人格心理学领域。此外，通过对这些人格研究方法的了解，网络安全学者和执从业者可以探索如何应用这些方法设计未来的研究，其研究结果可以用于更好地描述、解释和预测网络安全案例和场景中攻击者和防御者的行为。\n\
