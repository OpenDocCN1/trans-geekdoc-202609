  \ 描述。\n\n## 黑客实验室 1：社会工程实践\n\n### 社会工程实践：我是谁？\n\n在本书中，你将发现许多——特别是四个——我们所谓的“黑客实验室”。这些实验室旨在为学生提供处理多种网络安全问题的实践经验，这些问题在保护计算环境方面至关重要。\n\
  \n这些实验室的另一个目的是，并非必须的，但可以有一个支持性的物理计算机实验室来执行这些项目。它们也可以在学生自己的计算设备上完成，而不需要在固定的实验室时间段进行。\n\
  \n当作者提供这些实验时，通常会给学生一周的时间来进行研究并提交结果。\n\n## 6.1 黑客实验室 1：社会工程：寻找 Cookie 的密码\n\n这些实验室第一个涉及到许多黑客使用的方法，这种方法有时被称为社会工程学或翻垃圾搜寻（dumpster\
  \ diving）。大多数天真甚至不那么天真的计算机用户并没有意识到攻击者可能如何尝试收集关于目标的足够信息，以便对目标的密码做出明智推测。\n\n那些负责维护多用户系统（如大学主网络）安全的人员也应该记住，攻击者不需要在这样的系统中捕获成千上万个密码：只需要一个可能就能满足黑客的需求。\n\
  \n本实验室将要求学生尝试确定 `Cookie Lavagetto` 的密码。已知 `Cookie` 作为一个有点粗心的用户，其密码是由关于 `Cookie`\
  \ 及其家人的两个独立信息片段构建而成的。在随后的数据表表中，请注意关于 `Cookie` 及其家人有 21 个不同的数据点：姓氏、地址、孩子、他们的年龄和生日、他们的宠物以及宠物名称。这是大多数翻垃圾搜寻者应该能够收集到的信息。\n\
  \n顺便提一下，这个例子的灵感源自部关于计算机黑客的最好的电影——1984 年的惊悚片《战争游戏》（War Games），片中的主角是一个试图寻找密码以进入游戏计算机的青少年。根据剧情，那实际上是一个由名为\
  \ `Falken` 的计算机科学家发明的国防部计算机，可能会引发第三世界大战。青少年如何发现 `Falken` 的秘密密码不仅是电影中迷人的部分，也是寻找密码技巧或翻垃圾搜寻技术的一堂绝佳课程。\n\
  \n与其对本实验室进行计时，不如限制每个学生寻找密码的尝试次数被证明更具指导意义。执行此操作的细节可以是以下之一：\n\n1. 教师创建一个由两个数据点组合的密码，有\
  \ $(21 \\times 20)/2=210$ 种可能性。你可以将实验室限制在例如 30 次。\n2. 教师创建一个区分大小写的密码。有了 21 个数据点，且确立的规则规定密码可以超过两个数据点，则有\
  \ $21^{30}$ 种组合。\n\n## 6.2 Cookie 的数据集：给学生的说明\n\n`Cookie Lavagetto`\n\n配偶：`Cookette\
  \ Lavagetto`\n\n居住地：`200 Ebbets Road, Brooklyn, NY 10093`\n\n孩子：`Oreo Lavagetto`14\
  \ 岁；`Gingnap Lavagetto`12 岁；`Tollhouse Lavagetto`7 岁\n\n宠物：`Spot`、`Woofie`、`George`\n\
  \n生日：`Cookie1/23`、`Cookette8/17`、`Oreo3/9`、`Gingnap11/28`、`Tollhouse4/3`\n\nCookie\
  \ 的邮箱：教师创建。\n\n玩法：登录指定的账户。\n\n尝试猜测密码。建议：在电子输入之前，构建并写下 10 次猜测。然后看是否猜中了。\n\n正确密码是上述数据的某种组合。它将不超过\
  \ 14 个字符。\n\n如果你成功猜中了密码，你就黑入了 Cookie 的账户。提交作业（通过电子邮件）你猜中的正确密码。像任何优秀的黑客一样，保守好你成功的密码。\n\
  \n### 问题\n\n6.1 Cookie 有 21 个数据点。如果密码是由两个数据点的组合而成的，猜中需要多少次？\n\n6.2 构建一个独立的示例。允许同学尝试\
  \ 5 次。你的同学中有多少人能猜中？\n\n6.3 你能找到翻垃圾搜寻的现实案例吗？\n\n6.4 《战争游戏》电影中的青少年是如何发现 `Falken` 密码的？这个密码是什么，为什么\
  \ `Falken` 会选择它？\n\n## 7 访问控制\n\n## 7.1 访问控制\n\n我们保护计算环境或网络环境的第一步是确定如何获取我们环境的方法论。我们通常将这一关注分为两个部分，我们称为身份验证（authentication）和授权（authorization）。\n\
  \n\n\n\n\n我们提供身份验证的关注基本上是为了回答“你是谁？”这个问题。换句话之，这意味着建立一种机制，来确定想要访问系统的实体是否被允许进入该系统。在这种情况下，涉及的实体可能是人类，也可能是机器。身份验证过程由该外部实体发起，我们的系统必须做出相应的响应。\n\
  \n访问控制的第二个方面被称为授权。换句话之，一旦外部实体通过了身份验证，可能会出现一个问题，即该实体是否有权在这一新环境中执行某些任务。换句话之，授权问题可能是“你被允许做那件事吗？”因此，我们的系统必须有一套对操作实施限制的方法。\n\
  \n## 7.2 身份验证\n\n身份验证过程始于外部实体的请求，随后是我们系统的挑战，这通常可以分为以下三种方法之一：挑战可以基于我们通常描述的：\n\n-\
  \ 你所知道的\n- 你所拥有的\n- 你所特征的\n\n## 7.3 你所知道的：密码\n\n“你所知道的”通常被认为是密码。“你所拥有的”可能是某些物理设备，如钥匙、智能卡或其他令牌。而“你所特征的”通常被描述为生物识别，换句话之，你的指纹、面部图像、视网膜扫描、你的行走方式或步态，或者\
  \ DNA 等。\n\n首先考虑 `UNIX` 或 `LINUX` 系统的例子（Kernighan, 1984）。系统可能会显示：\n\n```\nLogin:\n\
  ```\n\n尽管这看起来很简单，但密码的选择是提供良好网络安全保障的最大风险之一。\n\n因此，用户创建好密码或坏密码有着悠久的历史，这一直是全球网络安全领域最大的问题之一。其概念是让用户选择一个好的密码——换句话之，一个外部人员难以猜到的密码——这可以阻止外部人员进行成功的猜解。\n\
  \n创建（或分析）密码系统的第一步是了解允许密码的规则。每个密码系统都有允许允许的符号或字符类型。例如，数字 `{ 0, 1, 2, …, 9 }`、字母表中的字母（小写）`{\
  \ a, b, c, …, z }`、特殊（可输入的）符号 `{ #, $, %, ^, &, ?, ! }` 或这些符号的组合。我们将使用的这些集合标记为 `c`，代表字符集。\n\
  \n第二部分是合法密码中可以或必须输入多少此类符号。目前，考虑这必须是一个固定数字 `n`。\n\n因此，知道可能有多少种密码是非常重要的。由于每个条目有 `c`\
  \ 种选择，且必须有 `n` 个，因此潜在密码的总数是 `cn`。\n\n**示例**：对于许多 ATM PIN 码，需要四位数字，有 10 种潜在数字。所以，`c\
  \ = 10`，`n = 4`，可能的 PIN 总数为 `cn = 10⁴ = 10,000`。\n\n**示例**：在许多旧的密码系统中，需要输入七个字符，每个都是小写字母。因此，`cn\
  \ = 26⁷ = 8,031,810,176` 或 `8.03 × 10⁹`，略多 80 亿个可能的密码。我们将此值称为“密码集”，`p = cn`。\n\n\
  由于系统本身通常会指示潜在用户密码，试图确定用户密码的黑客将知道 `c` 和 `n`，从而可以计算出 `p`。所以，黑客最而易见的方法通常被称为“暴力破解”或“穷举搜索”——尝试所有密码。想象所有的潜在密码一个接一个列出，黑客第一次尝试就命中的概率与最后一次尝试的概率相等。因此，根据简单的概率论证，平均需要查到列表的一半才能命中。因此，黑客所需的工作量为\
  \ `t = p/2`。在我们上面的第一个示例中，这意味着 `t = 10,000/2 = 5,000`；在第二种情况下，`t = 8,031,810,176/2\
  \ = 4,015,905,088`。当然，黑客并不限于暴力破解策略。我们稍后会回到这一分析。\n\n## 7.4 令牌：你所拥有的\n\n你物理上拥有的设备在现代计算环境中正变得越来越常见。原因简单来说，如果你拥有某种形式的\
  \ `key`、`token`或其他物理设备，如果它仅仅是丢失或被盗，且进入某些环境只需要该物理设备，那么本质上门就处于敞开状态。\n\n因此，物理设备越来越多被用于所谓的“双因子认证”。换句话之，你拥有的物理设备不足以进入特定环境。通常，物理设备会与第二个因子（通常是密码）结合。一个非常广泛的例子是\
  \ ATM 卡，卡片本身是一个物理设备，但在 ATM 上使用它，你需要密码，我们通常称之为 `PIN`——通常是四位数字。\n\n一种更聪明的设备是所谓的 `RSAID`\
  \ (CDW, 2018)，它在多用户系统中与令牌激活的时间同步。该设备有一个六位数的显示器，每 60 秒变化一次。持有令牌的用户必须输入密码的同时输入显示的六位数字。中央系统使用算法，可以精确到分钟确定令牌的六位读数应该显示什么，用户输入的六位数字必须与系统计算的结果匹配（图\
  \ 7.1）。\n\n![](img/007x001_jpeg)\n\n## 7.5 生物识别：你所特征的\n\n生物识别领域存在比计算机时代久得多。也许常见的生物识别措施之一——你所特征的——指纹（NIJ,\
  \ 2018）。通过指纹对人类进行分类的研究追溯到 19 世纪。其他的现代生物识别包括面部识别、手部识别、视网膜模式和 DNA。\n\n尽管许多生物识别措施足以唯一确定全球任何个人，但生物识别存在许多问题。例如，密码可以由用户结合系统管理轻松更改。而大多数生物识别措施并非如此。此外，一些潜在用户可能会认为提供生物识别是侵犯隐私。例如，检测虹膜或视网膜模式涉及向眼睛射射激光，许多人认为这不仅侵犯隐私，而且对身体有害（其实并不会！）。\n\
  \n## References\n\n- CDW Inc. 2018. RSA SecureID. [`www.cdw.com/content/dam/CDW/brands/rsa/securid-access-guide.pdf?cm_ven=acquirgy&cm_cat=bing&cm_pla=S3+RSA&cm_ite=RSA+SecurID+E&s_kwcid=AL!4223!10!73873530364386!73873502272841&ef_id=VqMBwgAABUYPytc:20181106160059:s`](https://www.cdw.com/content/dam/CDW/brands/rsa/securid-access-guide.pdf?cm_ven=acquirgy&cm_cat=bing&cm_pla=S3+RSA&cm_ite=RSA+SecurID+E&s_kwcid=AL!4223!10!73873530364386!73873502272841&ef_id=VqMBwgAABUYPytc:20181106160059:s)\n\
