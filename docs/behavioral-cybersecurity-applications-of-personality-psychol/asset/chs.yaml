  \ × (n-1)` 矩阵，其行列式称为 `Mi,j`。\n\n（抱歉，由于原文文本本身存在严重的逻辑重复，上述翻译也出现了重复错误。以下是为您整理的、干净的最终版本）：\n\
  \n[content]\n# 18.4 关于伽罗斯域的主要结论\n\n这些系统的理论是埃瓦里斯特·伽罗瓦（Evariste Galois）在 19 世纪初开发的成果，它指出所有具有有限数量元素的代数域都可以描述为\
  \ `GF(p,n)`（包括域 `Zp`，因为它们可以被认为是 `GF(p,1)`，即除以次数为 1 的不可约多项式[如 `ax + b`]）（见图 18.1）。\n\
  \n![](img/018x001_fmt.jpeg)\n\n此外，`GF(p,n)`类型伽罗斯域的所有可能选择都是等价的，它们的元素个数为 `pn`。\n\n\
  关于伽罗瓦本人：他 19 世纪初生活在巴黎（Bell 1937）。他在青少年时期就开发了这些非常重要的代数结果。他还是一个政治激进分子，进过监狱。释放后，他对一个年轻女性的兴趣导致了一场决斗，他在\
  \ 21 岁时因此遇害。这真的是一个陷阱，因为那个心仪对象的男友实际上是一个卧底，法国军队中最好的射击手之一。\n\n他并没有给伽罗斯域命名；它们是以他的名字命名的。\n\
  \n## 18.5 矩阵代数或线性代数\n\n矩阵或数组是某种类型数字（例如整数、有理或实数）的集合，被视为具有特定行或列数的矩形集合。如果一个矩阵有 `m`\
  \ 行 `n` 列，因此总共有 `m × n` 个元素，我们称该矩阵的阶数为 `m × n`。\n\n这是一个具有实数数值的 `4 × 3` 矩阵 `A` 的示例。我们通常用方括号将矩阵的值括起来。\n\
  \n$$\\\\text{A} = \\\\left\\\\lbrack \\\\begin{array}{lll} {\\\\\\,\\\\,\\, 3.7}\
  \ & {\\\\\\,\\\\,\\, 1.6} & {- 2.9} \\\\ {\\\\\\,\\\\,\\, 6.8} & {- 4.3} & {\\\\\
  \\,\\\\,\\, 0.7} \\\\ {\\\\\\,\\\\,\\, 2.6} & {\\\\\\,\\\\,\\, 5.9} & {- 3.7} \\\
  \\ {- 1.4} & {\\\\\\,\\\\,\\, 2.4} & {\\\\\\,\\\\,\\, 9.3} \\\\ \\\\end{array} \\\
  \\right\\\\rbrack$$\n\n`A` 的常用紧凑表示法是 `[aij]`，其中 `i` 和 `j` 分别枚举行和列中的元素。\n\n在某些条件下，矩阵元素系统的操作可以扩展为对矩阵本身的操作。首先，关于加法，两个矩阵只有在具有相同维度\
  \ `m × n` 的情况下才能相加。在这种情况下：\n\n示例：\n\n$$\\\\text{A} = \\\\left\\\\lbrack \\\\begin{array}{lll}\
  \ 6 & {\\\\\\,\\\\,\\, 1} & 7 \\\\ 2 & {- 4} & 2 \\\\ \\\\end{array} \\\\right\\\
  \\rbrack\\\\quad\\\\text{B} = \\\\left\\\\lbrack \\\\begin{array}{lll} 5 & {- 3}\
