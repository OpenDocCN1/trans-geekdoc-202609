  - Raymond, E. S. 2015. Catb.org, `http://www.catb.org/jargon/html/appendixb.html`\n\
  \n### 问题\n\n12.1 阅读《The Art of Intrusion》（入侵艺术）。识别书中描绘的女性角色，或任何描述为（或你估计）年龄超过 50\
  \ 岁的角色。\n\n12.2 为什么《The Art of Intrusion》的合著者 Mitnick 进了监狱？\n\n12.3 《The Art of\
  \ Intrusion》中的案例是否有任何可以被描述为社会工程案例？\n\n12.4 对 Lee Munson 在本章中对黑客人格特质的描述进行批判性评价。\n\
  \n12.5 研究迈尔斯-布里格斯人格类型指示系统（参见人格测试的章节，另见 `https://upload.wikimedia.org/wikipedia/commons/1/1f/MyersBriggsTypes.png`）。识别不太可能归属于黑客的类别。\n\
  \n12.6 发现是否存在某些职业似乎拥有过多的阿斯伯格综合症的人士。\n\n### 博弈论\n\n网络安全领域的一项重要技术可以是应用我们所知的博弈论（Morris,\
  \ 1994; Von Neumann and Morgenstern, 1944）。\n\n出于本课程的目的，我们将仅对博弈论进行介绍性说明，特别是现在所谓的“双人零和游戏”。`zero-sum`（零和）一词是指一种限制，即在这样的游戏中一方获得的任何收益，其对手都会失去。也许这种双人零和游戏最简单的例子涉及抛硬币。硬币的两面标记为\
  \ `heads`（正面）或 `tails`（反面），一名玩家抛掷，另一名玩家猜测结果。让我们把这两个玩家称为 `Mary` 和 `Norman`。\n\n###\
  \ 收益\n\n按照惯例，我们总是将行玩家的正收益结果标记为正数；列玩家将该值视为损失。\n\n```\n| 表 13.1 正面或反面 |\n| --- |\n\
  | | Norman (列玩家) |\n| 选择 | H | T |\n| Mary (行玩家) | +1 | -1 |\n| | -1 | +1 |\n```\n\
  \n更广泛地说，在这样的游戏中，每个玩家都预先知道这个收益矩阵，但博弈论提供了分析方法，使每个玩家能够确定自己的最佳策略。\n\n在这个例子中，抛币者没有策略，但我们可以稍微修改游戏：说不是进行抛掷，而是由\
  \ `Mary` 简单选择她的结果之一（`H` 或 `T`），`Norman` 猜测结果，然后他们比较自己的选择。\n\n在这个模型中，每个人都会开发一种策略来确定自己的选择，但快速分析将显示没有获胜策略，因为每个玩家都有\
  \ 50–50% 的获胜机会。\n\n然而，假设我们创建一个游戏，每个玩家的获胜策略可能不同。例如，有两个玩家，每个人都会喊数字一或二。其中一个玩家被指定为“奇数”——假设是\
  \ `Oliver`——另一名玩家是“偶数”，她被称为 `Evelyn`。如果每个玩家所喊数字的和是奇数，`Oliver` 赢得该金额；如果和是偶数，`Evelyn`\
  \ 赢得该金额。使用上述游戏矩阵模型，我们得到：\n\n```| 表 13.2 喊出“一”或“二” |\n| --- |\n| | Evelyn (偶数) |\n\
  | 选择 | One | Two |\n| Oliver (奇数) | -2 | 3 |\n| | 3 | -4 |\n```\n\n\n\n\n不要将此游戏或我们的任何一个游戏视为一次性事件，而要考虑如果游戏可以重复，玩家会怎么做。每个人都试图制定一种策略，以增加自己的胜率。其中一种“策略”可能仅仅是对玩法进行随机选择，在这种情况下，在上面的例子中，奥利弗（Oliver）会有\
  \ 50%的时间选择“一”，在另外 50%的时间内选择“二”。伊芙琳（Evelyn）也会进行类似的推理。\n\n在这种情况下，如果奥利弗选择“一”，他有一半时间会输两美元，另一半时间赢三美元；换句话说，`0.5(−2)\
  \ + 0.5(3) = +0.5`。\n\n另一方面，如果奥利弗有一半时间选择“二”，他的结果将是 `0.5(3) + 0.5(−4) = −0.5`。因此，从奥利弗的角度来看，他应该一直选择“一”。但伊芙琳并非傻瓜，她会察觉到这一策略，一直选择“二”，从而在每次游戏中赢得三美元。因此，为了让这样的游戏具有竞争性，每位玩家必须确定一种策略，或者说每个潜在选择的概率。\n\
  \n假设奥利弗有 60%（3/5）的时间选择“一”，40%（2/5）的时间选择“二”；那么这种策略（假设伊芙琳随机玩）在他叫“一”时将为他带来净收益 `-2(3/5)\
  \ + 3(2/5) = 0`，当他叫“二”时，他赢得 `3(3/5) − 4(2/5) = 1/5`。所以，当他叫“一”时随时间持平，而叫“二”时赢得 0.5。\n\
  \n假设我们用 `p` 代表奥利弗叫“一”的百分比。我们希望选择 `p`，使得无论伊芙琳叫什么，奥利弗赢得都是相同的。现在，当伊芙琳叫“一”时，奥利弗的收益为\
  \ `-2p + 3(1 − p)`，当伊芙琳叫“二”时，收益为 `3p − 4(1 − p)`。当他的策略相等时：\n\n`-2p + 3(1–p) = 3p–4(1–p)`\n\
  \n解得 `p` 等于 7/12，因此奥利弗应该有`7/12 = 58.3%`的时间叫“一”，`5/12 = 41.7%`的时间叫“二”。这样，平均而言，无论伊芙琳如何做，奥利弗每次都会赢得\
  \ `-2(7/12) + 3(5/12) = 1/12`，即 8.3 美分。这被称为均衡策略。\n\n然而，只有在伊芙琳不正确策略的情况下，奥利弗才能获得这种收益。如果伊芙琳使用相同的程序，她可以保证自己的平均损失为\
  \ `3(7/12) − 4(5/12) = 1/12`。由于每个人都在使用自己的最佳策略，数值 `1/12` 被称为游戏值（通常表示为 `V`），每位玩家用来获得这一收益的程序被称为最优策略或“极大极化策略”。\n\
  \n我们刚刚描述的是一种混合策略。在我们刚刚描述的游戏中，“一”和“二”之间的策略是随机做出的。为了让这样的游戏具有竞争性，每位玩家必须确定一种策略，或者说每个潜在选择的概率。\n\
  \n如果伊芙琳使用相同的程序，她可以保证自己的平均损失为 `3(7/12) − 4(5/12) = 1/12`。由于每个人都在使用自己的最佳策略，数值 `1/12`\
  \ 被称为游戏值（通常表示为 `V`），每位玩家用来获得这一收益的程序被称为最优策略或“极大极化策略。”\n\n\n\n如果一个游戏矩阵具有以下属性：(1) `aij`\
  \ 是第 `ith` 行的最小值，且(2) `aij` 是第 `jth` 列的最大值，那么我们称 `aij` 为鞍点。通过检查上面的 `A`，可以注意到 `a32\
  \ = 5` 是第三行的最小值，同时也是第二列的最大值。在上述情况下，行玩家可以采取第三种策略并至少赢得 $5$；列玩家如果选择第二种策略，可以将自己的损失减少到同样的\
  \ $5$。因此，在存在鞍点的情况下，博弈的值 `V` 就是鞍点的值。\n\n因此，行玩家的策略向量为 `p = [0 0 1 0]`，列玩家的策略向量为 `q\
  \ = [0 1 0 0]`。\n\n对于上述的简单游戏，我们可以通过检查矩阵的每个元素来确定是否存在鞍点。然而，即使在两人零和博弈中，这可能变得非常复杂。考虑通常被称为“直排扑克”的例子，两个玩家从发牌员处获得五张牌，然后根据他们最好的牌进行下注。这种游戏的行数和列数是\
  \ 311,875,200。\n\n### 13.5 所有 2 × 2 游戏的求解](#06_Contents.xhtml#r_idParaDest-161)\n\
  \n此类游戏的通用解可以通过以下两步策略找到：(1) 测试是否存在鞍点；(2) 如果存在鞍点，它就成了解。如果没有鞍点，则通过寻找均衡策略来求解。\n\n将通用的\
  \ 2 × 2 游戏描述为 $\\text{A} = \\begin{bmatrix} a & b \\\\ d & c \\end{bmatrix}$。\n\n\
  我们假设行玩家以概率 `p` 在两个选择中进行选择；换句话说，为 `[p 1-p]`。然后像之前一样，找到列玩家使用第 1 列或第 2 列时行玩家的平均收益。如果列玩家以概率\
  \ `q` 选择第一列，当行玩家使用第 1 行和第 2 行时的平均损失为，即 `[q 1-q]`。\n\n在没有鞍点的情况下，`(a - b)` 和 `(c -\
  \ d)` 均为正或均为负，因此 `p` 严格介于 0 和 1 之间。如果 `a ≥ b`，则 `b < c`；否则，`b` 是鞍点。由于 `b < c`，我们必须有\
  \ `c > d`，否则 `c` 是鞍点。同样，我们可以看到 `d < a` 且 `a > b`。这得出：如果 `a ≥ b`，则 `a > b < c > d\
  \ < a`。利用对称性论证，如果 `a <= b`，则 `a < b > c < d > a`。因此：\n\n如果没有鞍点，那么 `a > b, b < c,\
  \ c > d and d < a`，或者 `a < b, b < c, c < d and d > a`。\n\n如果行玩家以概率 `p` 选择第一行，当列玩家使用第\
  \ 1 列和第 2 列时的平均收益为：`ap + d(1 - p) = bp + c(1 - p)`。现在解该方程得 `p`：\n\n$$\\text{p} =\
  \ \\frac{c - d}{(a - b) + (c - d)}$$\n\n由于没有鞍点，`(a - b)` 和 `(c - d)` 均为正或均为负，因此\
  \ `0 < p < 1`。行玩家使用该策略的平均收益为\n\n$$\\text{v} = ap + d(1 - p) = \\frac{ac - bd}{a\
  \ - b + c - d}.$$\n\n如果列玩家使用 `[q 1-q]`，他们的平均损失为 `aq + b(1 - q) = dq + c(1 - q)`。因此\n\
  \n$$\\text{q} = \\frac{c - b}{a - b + c - d}}.$$\n\n由于没有鞍点，`0 < q < 1`，所以列玩家的平均损失为\n\
  \n$$\\text{aq + b(1 - q)} = \\frac{ac - bd}{a - b + c - d} = v.$$\n\n由于两个玩家拥有相同的最优策略，该博弈有解，即上述的解。\n\
  \n#### 示例 1\n\n$$\\text{A} = \\begin{bmatrix} -4 & 6 \\\\ 6 & -8 \\end{bmatrix}$$\n\
  \n$$\\begin{matrix} p = (-8 - 6) / (-4 - 6 - 8 - 6) = (-14) / (-24) \\\\ = 7/12.\
  \ \\end{matrix}$$\n\n#### 示例 2\n\n$$\\text{A} = \\begin{bmatrix} 7 & 1 \\\\ 3 &\
  \ 4 \\end{bmatrix}$$\n\n我们观察到 `A` 的第二列被第三列严格支配，因此我们可以有效地从博弈中移除第三列，导致\n\n$$\\text{A}'\
  \ = \\left[\\begin{array} 7 \\\\ 3 \\end{array}\\right].$$\n\n根据类似的原理，第一行被第三行严格支配，因此可以消除第一行。因此，我们简化为\
  \ $\\text{A}'' = \\begin{bmatrix} 3 & 4 \\end{bmatrix}$，得到的 2 × 2 矩阵可以使用上一节的方法求解。因此，`p`、`q`\
  \ 和 `v` 将为：\n\n$$\\begin{matrix} p = (2 - 9) / ((3 - 4) + (2 - 9)) = (-7) / (-8)\
  \ = 7/8 = 0.875; \\\\ q = (2 - 4) / ((3 - 4) + (2 - 9)) = (-2) / (-8) = 1/4 = 0.25;\
  \ \\\\ v = (6 - 36) / (3 - 4 + 2 - 9) = -30 / -8 = 3.75. \\end{matrix}$$\n\n####\
  \ 支配策略\n\n博弈论中示例的来源之一源于军事策略。一种经典的军事策略游戏被称为布洛托上校游戏（Colonel Blotto）。\n\n\n\n布洛托上校（Colonel\
  \ Blotto）必须守卫两个山关，为此，她有三个师。如果她的某一个师能够对抗实力相等或更小的敌方部队，她就能成功守住其中一个山关。然而，敌人只有两个师。如果任何一个山关被攻破，布洛托就会输掉战斗。双方都没有关于对手师如何分配的先验信息。因此，这个游戏由布洛托的师和对手的不同可能对齐方式来描述。\n\
  \n我们可以将布洛托的策略描述为四种可能性，分别为 `(3,0)`、`(2,1)`、`(1,2)` 和 `(0,3)`。第一个坐标描述布洛托分配给第一个山关的师的数量，第二个坐标描述分配给第二个山关的师的数量。显然，布洛托留出任何一个师都是没有意义的，因此在每种情况下布洛托都分配了全部三个师。如上所述，对手只有两个师，因此只有三个潜在策略：`(2,0)`、`(1,1)`\
  \ 和 `(0,2)`。\n\n根据这些信息，我们可以制定出博弈矩阵。我们还假设博弈的收益为一个单位，取决于谁赢了战斗。例如，如果布洛托将所有师都分配给第一个山关，即\
  \ `(3,0)`；而对手将一个师分配到每个山关，即 `(1,1)`，则上校输掉了战斗，对手获胜；因此，矩阵值为 `-1`。\n\n如果任何一个山关被攻破，战斗就会失败。因此，收益矩阵如\
  \ 表 13.3 所示。\n\n| 表 13.3 布洛托上校 |\n| --- |\n|  ||  || 敌人 |\n|  ||  || (2,0) || (1,1)\
  \ || (0,2) |\n| 布洛托 || (3,0) || 1 || −1 || −1 |\n| (2,1) || 1 || 1 || −1 |\n| (1,2)\
  \ || −1 || 1 || 1 |\n| (0,3) || −1 || −1 || 1 |\n\n如果某行或某列被其他行或列的概率组合所支配，也可以将其移除。\n\
  \n仅通过对布洛托上校游戏的初步观察就可以发现她的 `(3,0)` 和 `(0,3)` 策略永远是不需要的，因为敌人只有两个师，而布洛托用两个师就能成功守住任何山关。但我们可以通过检查收益矩阵得出相同的结论。由于\
  \ `(3,0)` 行的收益都小于或等于同列中的数字，`(0,3)` 行也是如此，根据支配性原理，我们可以将博弈简化为 表 13.4。\n\n| 表 13.4\
  \ “简化”后的布洛托上校博弈 |\n| --- |\n|  ||  || 敌人 |\n|  ||  || (2,0) || (1,1) || (0,2) |\n\
  | 布洛托 || (2,1) || 1 || 1 || −1 |\n| (1,2) || −1 || 1 || 1 |\n\n现在，从列的角度（即对手的角度）观察博弈，策略\
  \ `(1,1)` 也被支配了。因此，我们也可以从博弈中移除该列（表 13.5）。\n\n| 表 13.5 第二次简化的布洛托上校博弈 |\n| --- |\n\
  |  ||  || 敌人 |\n|  ||  || (2,0) || (0,2) |\n| 布洛托 || (2,1) || 1 || −1 |\n| (1,2)\
  \ || −1 || 1 |\n\n考虑到剩余的 `2 × 2` 矩阵，我们看到本质上已经将布洛托上校游戏简化为了硬币游戏，根据我们之前的分析，我们意识到玩家应该随机化他们的选择，导致\
  \ 50–50 的结论。\n\n### 13.7 图形解法：2 × n 和 m × 2 博弈](#06_Contents.xhtml#r_idParaDest-16)\n\
  \n在行玩家只有两种策略（称为 `2 × n` 博弈）或列玩家只有两种策略（称为 `m × 2` 博弈）的特殊情况下，有一种方法可以使用图形表示来解决博弈。通过下面的\
  \ `2 × n` 博弈，我们可以按照步骤进行。显然，行玩家以概率 `p` 选择第一行；那么该玩家对第二行的策略必须是 `1 - p`。对于上面的示例，我们可以计算列玩家对其可用的\
  \ `n` 种策略中每种策略的平均收益。这些收益描述如下：我们可以通过绘制 `p` 在 0 到 1 之间取值的线段，为博弈结果的潜在值绘制图表。（熟悉线性规划主题的学生将识别出该解法类似于单纯形法。）考虑以下这个两行四列博弈（换句话说，一个\
  \ `2 × n` 博弈）：\n\n```\n\\begin{array}{lllll}\np & 6 & 8 & 2 & 9 \\\\\n1-p & 8 &\
  \ 4 & 10 & 2 \\\\\n\\end{array}\n```\n\n如果列玩家选择第一列，行玩家的平均收益为 `6p + 8(1 - p)`。同样，选择第二、第三和第四列将导致平均收益为：（第\
  \ 2 列）`8p + 4(1 - p)`；（第 3 列）`2p + 10(1 - p)`；（第 4 列）`9p + 2(1 - p)`。接下来，绘制所有 `p`\
  \ 从 0 到 1 的这四个线性函数的图（图 13.1）。\n\nimages/93712.jpg\n\n对于任何固定的 `p` 值，行玩家可以确定其平均收益至少是这四个函数在所选\
  \ `p` 值处评估结果的最小值。因此，在 `p` 的这个范围内，我们想要找到使这个“下包络”达到最大值的 `p`。在几何或线性规划中，下包络也被称为凸包。在这个例子中，我们可以看到下包络的最大值出现在\
  \ `p = 8/15` 时。因为在交点处的最大列是第 3 列和第 4 列，我们可以得出结论，可以将博弈简化为这两列，从而我们已经有了其解法的 `2 × 2`\
  \ 博弈。\n\n我们可以通过代数法来验证 `m × 2` 博弈的图形解。假设这次博弈是：\n\n```\n\\begin{array}{ll}\nq & 1-q\
  \ \\\\\n7 & 2 \\\\\n3 & 6 \\\\\n5 & 5 \\\\\n\\end{array}\n```\n\n再次绘制 0 到 1 之间的三条线段，这次取“上包络”并确定\
  \ `q` 的值（图 13.2）。\n\nimages/93748.jpg\n\n在这种情况下，我们将两种策略，分别是 `q = 1/3` 和 `q = 3/5`，每种情况的收益均为\
  \ 5。\n\n因此，这种方法可以解决任何 `2 × n` 或 `m × 2` 博弈。理论上，我们可以将图形方法扩展到 `3 × n` 或 `m × 3` 博弈。然而，对于具有三行而非两行的示例，概率的选择将产生独立变量，例如\
  \ `p1` 和 `p2`，那么行的概率将写为 `p1`、`p2` 和 `1 - (p1 + p2)`。因此，为了模拟博弈，我们需要一个三维图，其中每个变量的可能性定义了三维区域内的一个平面。\n\
  \n### 13.8 使用博弈论在索尼/韩国案例中选择策略](#06_Contents.xhtml#r_idParaDest-164)\n\n回顾第 1 章中的索尼黑客事件（2018\
  \ 年）。我们考虑讨论的所有潜在攻击者都是由某个犯罪主脑策划的，将其缩写为 `CM`。`CM` 通过选择我们考虑的真实攻击者来玩这个游戏。`CM` 如何做出选择将是他的策略。`CM`\
  \ 是行玩家。\n\n安全专家（你）将缩写为 `CE`，并试图确定攻击的动机。`CE` 将列在列中（表 13.6）。\n\n| 表 13.6 作为博弈的索尼案例\
  \ |\n| --- |\n|  || CE |\n| CM || 政治 || 战争 || 声誉 || 金钱 |\n| 韩国 ||  ||  ||  ||  \
  \ |\n| 和平守护者 ||  ||  ||  ||   |\n| WikiLeaks ||  ||  ||  ||   |\n| 工业竞争对手 ||  ||\
  \  ||  ||   |\n\n\n\n\n\n我们假设已经知道了每种可能情况的收益，如下矩阵所示。该游戏的目标是寻找最优策略（最佳概率）。\n\n我将 `CM`\
  \ 视为行玩家，将 `CE` 视为列玩家。收益矩阵如表 13.7 所示。\n\n| 表 13.7 作为求解博弈的索尼影业案例 |\n| --- |\n| CM\
  \ || CE |\n| 政治 || 战争 || 声誉 || 金钱 |\n| 北朝鲜 || 1 || −1 || −1 || −1 |\n| 和平守护者 ||\
  \ −1 || −1 || 1 || −1 |\n| 维基解 || −1 || 1 || −1 || −1 |\n| 工业竞争对手 || −1 || −1 ||\
  \ −1 || 1 |\n\n游戏规则是：如果 `CM` 和 `CE` 都选择 `(攻击者, 动机) = (北朝鲜, 政治)`，则 `CM` 获胜（获得一个单位的东西）。\n\
  \n如果双方都没有选择 `(北朝鲜, 政治)` 且 `CE` 的猜测与 `CM` 不同，则 `CM` 也获胜。否则，`CE` 获胜。\n\n使用纯策略，任何玩家都无法保证获胜。因此，每个玩家的纯策略安全水平为\
  \ −1。对于一个每个玩家都有四种策略的游戏，“手动”计算混合安全策略水平是非常燥且困难的。在这个例子中，有三个策略是对称的。这暗示可以简化。\n\n假设 `CM`\
  \ 总是以相同的概率执行`和平守护者`、`维基解` 和 `工业竞争对手`。（该概率可以是 0 到 1/3 之间的任何数字；如果概率为零，则 `CM` 总是执行`北朝鲜`；如果概率为\
  \ 1/3，则 `CM` 永远不执行`北朝鲜`，而是以相同的概率执行剩余三个攻击者中的每一个。你可以将游戏视为 `CM` 走向纯策略（他要么选索尼，要么不选）。收益矩阵变为：\n\
  \n| || 政治 || 战争 || 声誉 || 金钱 |\n| --- | --- | --- | --- | --- |\n| 北朝鲜 || 1 || −1\
  \ || −1 || −1 |\n| 非北朝鲜 || −1 || 1/3 || 1/3 || 1/3 |\n\n如果你对 `CE` 施加相同的对称条件，游戏将简化为表\
  \ 13.8。\n\n| 表 13.8 索尼影业博弈求解 |\n| --- |\n| || 政治 || 非政治 |\n| 北朝鲜 || 1 || −1 |\n\
  | 非北朝鲜 || −1 || 1/3 |\n\n现在可以为这个 2 × 2（即每个玩家有两个策略）的游戏找到混合策略均衡。`CM` 的策略将使她从 `CE`\
  \ 的任一策略选择中收益相等。也就是说，`(北朝鲜, 政治)` 的概率（记为 `a`）将满足：\n\n`a + (1 - a)(-1) = a(-1) + (1\
  \ - a)(1/3)`\n\n该方程的解为 `a = 2/5`。当 `CM` 以 `2/5` 和 `3/5` 的概率混合执行`北朝鲜`和`非北朝鲜`时，无论\
  \ `CE` 做什么，他获得的收益都是 –1/5。同样，你可以通过使 `CM` 的收益相等来求解 `CE` 的策略。如果 `b` 是 `CE` 执行`(北朝鲜,\
  \ 政治)` 的概率，那么 `b` 应该满足：\n\n`b + (1 - b)(-1) = b(-1) + (1 - b)(1/3)`\n\n或\n\n`b =\
  \ 2/5`。\n\n现在你可以回过检查我施加的对称假设是否真的合适。两个玩家都以 `2/5` 的概率执行`(北朝鲜, 政治)`，并以总概率 `3/5` 执行其他策略。这意味着他们以\
  \ `1/3` 的概率执行每种 `(非北朝鲜, 政治)` 策略。在这种情况下，`CM` 期望从他的每个原始纯策略中获得 –1/5，而 `CE` 可以通过以 `2/5`\
  \ 的概率执行 `(北朝鲜, 政治)` 以及以每个 1/5 的概率执行其他三种策略，将 `CM` 限制在该金额上。\n\n13.9 将画像分析矩阵转换为博弈论问题\n\
