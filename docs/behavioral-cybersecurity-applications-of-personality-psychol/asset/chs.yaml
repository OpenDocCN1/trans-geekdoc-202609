  \n### 问题\n- 14.1 寻找 `CEH` 要求。\n- 14.2 寻找 `CEH`。\n- 14.3 观看 `YouTube` 关于他的发现，哪哪部分带来了他的快乐？\n\
  - 14.4 寻找“白帽”和“黑帽”的起源。\n- 14.5 寻找《计算机欺诈和滥用法》下的定罪人数。\n- 14.6 对 Roose 的《纽约时报》文章评论：“如果我们面临的问题不是黑客太多，而是好人太少？”\n\
  - 14.7 更新来自安娜·维纳关于数据泄露的信息。\n\n### 15 性别心理学\n希拉里·罗德克林顿（Hillary Rodham Clinton）在巴拉克·奥巴马政府期间担任国务卿期间使用私人邮件服务器，引发了关于美国官员使用私人服务器的反复讨论。2016\
  \ 年，希拉里·罗德克林顿成为第一位获得民主党总统提名的女性。正如许多政治形势一样，问题的某些角度可以更充分地探索以理解其本质。一个探索性别心理学格局的有趣问题是：不同的常见性别概念化以及相应的性别理解方法如何解释克林林卿使用私人服务器的行为？本章的目的是描述性别理论概念化，以论证这些概念化可以更好地理解和防御网络安全情况的信息和系统。这些概念化也有助于理解计算机科学和其他领域的女性。本章的结构如下：简要概述性别方法的背景和历史背景，随后对这些主要的性别心理学方法进行详细描述，最后用性与养性的框架来理解这些方法。\n\
  \n#### 15.1 背景与历史背景：性别与心理\n自从心理学创立以来，人们对女性和男性的行为一直感兴趣。许多历史和当代心理学理论描述、解释并预测了性别化的起源或模式。这些理论从\
  \ 20 世纪初流行的弗洛伊德潜意识驱动和人格结构理论，到 20 世纪 90 年代兴起的巴斯（Buss, 1995）关注配偶选择的人类进化理论。\n\n于 20\
  \ 世纪 60 年代的女性主义心理学家在挑战此前流行的女性本质学术和临床公式方面产生了重大影响。因此，他们开始转变理解性别心理的方法，从以心理过程和结果性别差异为中心的问题和理论框架，转向更具社会背景的性别观点（例如\
  \ `Deaux and Major, 1987`; `Fine and Gordon, 1991`; `Spence and Helmreich, 1981`;\
  \ `Marecek, 2001`; `Spence et al., 1975`）。\n\n\n\n\nShields and Dicicco (2011) 描述了女性主义心理学家和其他研究人员在\
  \ 20 世纪 70 年代对性别社会背景角的扩展。他们引入了一个观点，认为需要明确区分“基于解剖和生理学分类的性别（sex），与附着在性别及性别差异之上的文化定义的意义集合的性别（gender）”（第\
  \ 493 页）。关于产前和产后性别发育的理论和研究对这种性别与性别心理概念化区分的转变产生了深远影响（Money and Erhardt, 1972; Spence\
  \ and Helmreich, 1978; Unger, 1979）。随着心理学中这些理论和实证发展，出现了一股关于性别心理学社会背景的开创性学术浪潮（Deaux\
  \ and Major, 1987; Eagly, 1987, 1994; Eagly and Wood, 1999; Eccles, 1987; West and\
  \ Zimmerman, 1987），这些观点一直持续至今。此外，更现代关于性别的心理研究仍在争论，更复杂的相似性或差异表述是否在推进性别心理学理解方面在理论和实践上更为稳健（Fine\
  \ and Gordon, 1991; Shields and Bhatia, 2009）。\n\n## 15.2 性别的概念化与分析\n\n在行为科学内部，关于性别概念化和研究的方法存在理论和方法论上的差异。然而，心理学家在各种理论和实证综述文章中识别出了一些主导模式。例如，Stewart\
  \ 和 McDermott (2004) 通过识别以下理论取向总结了性别心理学的学术体系：(1) 性别作为结果上的性别差异；(2) 性别作为一种角色和性别化的社会化；(3)\
  \ 具有性别化的权力关系；以及 (4) 性别认同与其他社会及社会结构身份的交叉（例如，种族、族裔、性取向）。\n\n### 15.2.1 性别作为特质：性别差异法\n\
  \n在这一性别心理学方法中，心理学家追求的核心问题是：态度、能力、人格特质和其他行为倾向的平均差异是如何以及为何出现的？这种方法假设差异源于男女之间预先存在的“本质”差异。Shields\
  \ 和 Dicicco (2011) 描述道，该方法的核心思想是男女之间的差异是“自然的、根深蒂固的，并具有深远的个人和社会影响。这种建议很容易建立在英美对‘自然’性别差异的之上，即将‘高级’种族与更原始的种族区分开来”（第\
  \ 491 页）。本质上，这种方法认为男女之间的差异源于基因和激素（Kitzinger, 1994）。\n\n### 15.2.2 社会背景中的性别：性别内变异法\n\
  \n在这一性别心理学方法中，心理学家追求的核心问题是：在高度性别化的心理现象中，性别内部变异的来源是什么？高度性别化的心理现象指的是那些由研究人员发现的、女性之间的平均差异所定义的现象（即：态度、能力、动机、人格特质）。Eccles\
  \ (1983, 2007, 2009, 2011) 在期望价值理论方面的研究展示了社会环境如何塑造个体对任务重要性的预期，以及学术和职业选择。\n\n###\
  \ 15.2.3 关联权力关系的性别\n\n在这一性别心理学方法中，心理学家追求的核心问题是：性别如何构建女性运作的社会制度、规范和政策？在这种方法中，承认性别信念和行为是嵌入在社会系统中的意识形态（Shields\
  \ and Dicicco, 2011）。Stewart 和 McDermott (2004) 描述了这种方法，解释“性别”不仅运作于性别差异层面，还作为社会相互作用的结果，并存在于证实这些性别信念的行为和社会结构中（第\
  \ 521 页，此类学术的示例包括 Fiske and Stevens, 1993; Goodwin, 2001）。心理学家在该方法中探索的主题包括领导力、婚姻关系、决策和冲突以及任务表现。这些行为发生的各种社会关系配置包括二元组、组织层级和更广泛的文化结构（Deaux\
  \ and Major, 1987）。\n\n### 15.2.4 交叉性别：身份、认同和社会结构法\n\n在这一性别心理学方法中，心理学家追求的核心问题是：性别角色、社会认同和社会结构动态如何通过个体和交互作用来塑造男女的心理过程和结果？正如\
  \ Stewart 和 McDermott (2004) 在性别心理学的开创性综述所示，这种方法可以采用独特的理论取向：主要根于人格心理学的个体认同理论；很大程度上植根于社会认同的社会认同理论；跨人格、社会和社会心理学的种族认同理论；以及涵盖心理学无边界领域的交叉性理论。心理学家在该方法中探索的主题包括自我发展、性别角色认同（Eccles,\
  \ 2007）、社会认同（Gurin, 1985; Gurin and Markus, 1989）、种族和民族认同（例如，Sellers et al., 1998）以及交叉性（例如，Cole,\
  \ 2009; Crenshaw, 1994; Hurtado and Sinha, 2008; Ireland, Freeman, Winston-Proctor,\
  \ DeLaine, Lowe, and Woodson, 2018; Mack, Rankins and Winston, 2011; Shields, 2008）。\n\
  \n\n\n\n对这些性别心理学的主流方法进行分类的一种常见方法将其分为天性、教养或两者的结合。这种分类代表了心理学领域历史上的一场经典辩论。支持这一辩论并由此影响性别心理学各种方法的根本性问题是：男性和女性在信念、态度、能力、动机、性格特征和其他行为倾向上的差异和相似性，是由天性还是教养决定的？与教养相关的关键构念是那些植根于社会文化影响的构念，而植根于天性的构念则是生物学结构过程。`Eagly`\
  \ 和 `Wood` (2013) 指出，研究人员往往只关注其中一种原因而忽视另一种，或者将它们视为相互竞争的解释性观点。\n\n## 15.4 结论\n\n\
  性别一直具有多样化的意义，但“天性对阵教养”的辩论仍然存在，尽管许多研究性别心理学的心理学家和其他研究人员正提倡一种更具整合性的方法。神经心理学的新领域特别具有前景，它们为行为科学领域的性别研究开辟了新的理论和方向。\n\
