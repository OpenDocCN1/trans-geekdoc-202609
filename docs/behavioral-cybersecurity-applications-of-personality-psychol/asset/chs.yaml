  \ `P`、`W`、`C`、`F`、`V` 和 `I`。\n\n（注：原文此处列出了 P, W, C, F, V, I，但描述说是七种，此处按原文翻译）\n\n\
  使用第 5 章中的特定数据，我们现在有了以下 2 × 7 游戏：\n\n（注：原文此处未提供完整表格数据）\n\n一旦构建了图表，我们可以观察到下凸包基本上由\
  \ `W` 和 `V` 定义。下凸包的顶点出现在 `W` 和 `V` 的交点处，大约有 `0.78` 的概率是 `W`。\n\n参考文献\n\nMorris,\
  \ P. 1994. Introduction to Game Theory. New York: Springer.\n\n索尼数字制作. 2018. [`www.sonypictures.com/`](http://www.sonypictures.com/)\n\
  \n练习题\n\n13.1 两个玩家掷骰子。点数大者获胜，收益为点数差。将其视为双人零和游戏并构造收益矩阵。\n\n13.2 与 Evelyn 重玩游戏，Oliver\
  \ 以 70% 的概率选择“一个”，30% 的概率选择“二”。Evelyn 随机选择。Oliver 的平均收益是多少？\n\n13.3 构造一个具有鞍点的 4\
  \ × 4 策略游戏。\n\n13.4 求解以下 m × 2 游戏：\n| 3 | 6 |\n| --- | --- |\n| 1 | 4 |\n| 7 | 2\
  \ |\n| 3 | 9 |\n| 4 | 7 |\n\n13.5 求解以下 2 × n 游戏：\n| 4 | 8 | 3 | 1 | 6 | 8 |\n| ---\
  \ | --- | --- | --- | --- | --- |\n| 6 | 2 | 7 | 8 | 2 | 7 |\n\n13.6 重玩上校布托博弈（Colonel\
  \ Blotto），防御一个有三个山口的村庄，布托有四个师，对手有三个师。\n\n13.7 为石头布剪刀游戏构造收益矩阵（每局获胜者得 1 分）。\n| | 石头\
  \ | 布布 | 剪刀 |\n| --- | --- | --- | --- |\n| 石头 | | | |\n| 布布 | | | |\n| 剪刀 | | |\
  \ |\n\n13.8 求解矩阵为 $\\begin{bmatrix} {-1} & {-3} \\\\ {-2} & 2 \\\\ \\end{bmatrix}$\
  \ 的游戏；即找到双方的值和混合策略。\n\n13.9 通过支配原理简化为 3 × 2 矩阵游戏并求解：$\\begin{bmatrix} 0 & 8 & 5\
  \ \\\\ 8 & 4 & 6 \\\\ 12 & {-4} & 3 \\\\ \\end{bmatrix}.$\n\n黑客是指拥有技术技能和知识以入侵计算机系统、访问文件和其他信息、修改计算机系统中可能的信息、利用涉及网络的技术从一个系统移动到另一个系统，并植入对主机系统产生不利影响的软件的人。\n\
  \n\n\n\n\n道德黑客是指拥有技术技能和知识，能够侵入计算机系统、访问文件和其他信息、修改计算机系统中可能存在的信息、利用网络技术从一个系统移动到另一个系统，并植入可能对宿主系统产生有害影响软件的人员。\n\
  \n黑客与道德黑客在能力上有何区别？嗯，正如你很容易观察到的，两者在本质上没有区别。\n\n电子电子商务顾问委员会（`EC-Council`）是一个专业认证机构，维护着“认证道德黑客”（`CEH`，2018\
  \ 年）的认证流程。获得此认证的人有权使用这一术语来介绍自己；然而，许多从事网络环境保护的人士在没有这一官方称号的情况下也在工作。\n\n鉴于黑客或道德黑客在技术技能方面本质上没有区别这一事实，人们可能会好奇，事实上到底会有什么区别。此外，其他术语也变得流行：黑客通常被称为“黑帽”，而道德黑客被称为“白帽”。然而，为了让问题变得更加复杂，在一些比赛中，参赛者被分配到白帽团队或黑帽团队，但在比赛中途他们可能会更换帽子和角色。\n\
  \n这种术语有些不寻。在人类活动的其他领域，当我们认为行为是合法或非法、道德或不道德时，考虑以下情况需要想象力，例如：抢劫银行或道德抢匪、谋杀犯或道德谋杀犯。如果罗宾汉德确实是一个真实的人，他可能希望被认为是一个道德小偷。\n\
  \n在网络安全领域，我们似乎已经进化到了这样程度：黑客与道德黑客之间的主要区别与技能或能力完全无关，而是取决于落入某一类别的个人价值观。\n\n一位名叫 `Ymir\
  \ Vigfusson` 的卓越计算机科学家来自冰岛，最近担任亚特兰大市埃埃莫里大学的教授，他提供道德黑客的课程，并在最近的一次 Ted 演讲中很好地描述了他的哲学，题目为“为什么我教人们如何黑客”（[`youtu.be/KwJyKmCbOws`](https://youtu.be/KwJyKmCbOws)）（Vigfusson,\
  \ 2015）。\n\n`Vigfusson` 教授使用“道德指南针”一词来描述他作为教授在教学生道德黑客时的引导，以及他在自己实践中的操作方式。\n\n因此，网络安全行业面临的挑战似乎是找到一种方法，识别能够开发所需技术技能的个人如何依靠他们自己的道德指南针。\n\
  \n关于这一点，一个可能有用的类比源于第一作者多年的经验。多年来，美国国际开发署（USAID）有一项非常重要的国际发展计划，最初命名为 `AFGRAD`，后来改为\
  \ `ATLAS`。该计划的目的是为撒哈拉以南非洲的学生提供硕士和博士学金，让他们来到美国大学攻读高级学位。由研究生院长组成的委员会负责评估并提议在各个非洲国家选择候选人。第一作者在该委员会担任了约\
  \ 10 年。\n\n该计划的选拔标准首先是候选人必须能够在合适的美国大学成功完成学位。\n\n但随着计划的发展，在我们判断中具有同等重要性的是（因为这是一个国际发展计划），我们试图根据我们对他们获得学位后返回本国承诺的认知来评估候选人，而不是让他们利用进入美国的机会来给他们提供一个可能更富裕的环境。我们如此认真对待这一标准，从最终结果可以显而易见：在获得这些学金的近\
  \ 4000 名学生中，超过 90% 的人在美国完成了研究生学位，并回到撒哈拉以南非洲的母国为其最终的发展做出贡献（`USAID`, 1995），我们可以将其描述为对他们道德指南针的评估。\n\
  \n这似乎是一个用于评估开发网络安全技能候选人的模式。我们如何如何判断他们的“道德指南针”，以预测他们是否会在防御性角色中使用网络安全技能（换句话说，威慑网络攻击），或者他们是否会被获得个人财富、成功、声誉或其他属性诱成为进攻攻击者，这些属性可能像\
  \ `ATLAS` 学生对生活在经济更富裕社会的诱惑一样诱人。\n\n开发试图预测这些行为的措施，对于那些不仅通晓网络安全而且通心理学和行为科学的人来说，是一个明确的挑战。\n\
  \n## 14.1 鼓励培养道德黑客的计划\n\n最近，人们对试图鼓励培养道德黑客的计划了关注。\n\n例如，2015 年 12 月 8 日，`Donna Lu`\
  \ 在《大西洋月》写道：\n\n网络安全专家 `Chris Rock`（不是那个《周六夜秀》的喜剧演员）是一位澳大利亚信息安全研究人员，他展示了如何操纵在线死亡证明系统以让一个活人在法律上宣告死亡。\n\
  \n`Brock` 从去年开始研究这些黑客行为，此前墨尔本的一家医院误发了 200 份死亡证明而不是对生病患者的出院通知。他还在在线出生注册系统中发现了类似的漏洞。`Rock`\
  \ 在 `DEF CON` 的满场会议上告诉，创建出生和死亡证明的能力意味着黑客可以伪造新的法律身份，反过来产生新型的洗钱和保险欺诈方案。\n\n在黑客世界，`Rock`\
  \ 是“白帽”：一种道德黑客，通过暴露计算机系统的漏洞来提高网络安全，而不是破坏它。近年来，白帽黑客变得越来越有利，因为公司已转向像 `Rock` 这样的专业人士保护他们免受日益增长的网络犯罪威胁。但要对抗更具恶意的黑客，道德黑客行业还有很长的路要走。\n\
  \n随后，2017 年 8 月 2 日，`Kevin Roose` 在《纽约时报》写道：\n\n如果美国人从过去一年的事件中学了一个教训，那就是：黑客是危险的人。他们干预我们的选举，让大型企业陷入瘫痪，成批地盗取密码和信用卡号。他们无视边界。他们乐于制造混乱。\n\
  \n但如果这种叙事是错误的呢？如果我们忽略了另一群黑客，他们不是无法法的叛徒，而是爱国的、具有公共精神的美国人，他们利用自己的技术技能保护我们的国家免受网络攻击，但被过时的规则和过度保护的机构所阻碍？\n\
  \n换句话说：我们面临的问题不是坏黑客太多，而是好黑客太少吗？\n\n\n\n\n\n他们告诉我，问题在于政府并没有让那些善意的黑客容易地参与防御工作。诸如《计算机欺诈和滥用法》之类的法律使得对许多政府系统内部的窥探——即使是出于无辜的研究目的——也属于刑事犯罪。根据\
  \ Peninsula Press 对 2015 年劳动力数据的分析，美国目前有超过 209,000 个网络安全职位处于空缺状态；国家安全局前任负责人去年表示，该机构的网络安全专家“正在大量流向”私营部门。\n\
  \n最近，在 2017 年 11 月 24 日，安娜·维纳（Anna Wiener）在《纽约客人》（New Yorker）中写道：\n\n“每当我教安全课程时，新闻循环中总会发生一些与之相关的事件，”加州大学伯克利分校计算机科学教授道格·泰加（Doug\
  \ Tygar）最近告诉我。从教学角度来说，这一年是特别有成效的一年。到 2017 年为止，美国非营利组织身份盗窃资源中心（Identity Theft Resource\
  \ Center）已统计了超过 1100 起数据泄露，是自 2005 年来的最高数字。该组织的受害者名单包括医疗保健提供者、快餐连锁店、跨国银行、公立高中和私立学院、一家家族经营巧克力店、电子烟分销商以及美国空军。总而言，至少有\
  \ 1.7 亿条记录遭到破坏。其中近 85% 的可以追溯到信用报告机构 Equ 安信（Equifax）的一次灾难性泄露。那次黑客攻击在 9 月初被报道——当时泰加和他的学生正准备开始一门名为“网络战争”的新课程的第三周。\n\
  \n根据泰加教职员工网页显示，该课程的目的是教伯克利分校初露的计算机科学家“通过法医手段检查真实的网络战争攻击”，旨在预防此类攻击。有时，这可能意味着他们自己要发动攻击。美国各地的刑法典在涉及网络犯罪方面并不宽容；在某些州，某些计算机犯罪被视为\
  \ `C 类重罪`，与纵火和绑架具有同等性。因此，在学习的实践部分，泰加的学生们依赖于 `HackerOne`，这是一个致力于“伦理黑客”的类市场兼社交网络。公司、组织和政府机构使用该网站寻求帮助，以识别其产品中的漏洞——或者正如泰加所说，“让自己遭受被本科生尝试黑入的耻辱”。为了换取关于他们所做错之处的信息，许多此类客户提供了金钱奖励，即漏洞赏金（bug\
  \ bounties）。自 2012 年 `HackerOne` 启动以来，其十万名测试人员总共赚了 2200 万美元，该平台的荷兰创始人乔伯特·阿伯马（Jobert\
  \ Abma）和米歇尔·普林斯（Michiel Prins）希望到 2020 年将其增加五倍。对于泰加的学生来说，还有一个额外的激励：他们通过 `HackerOne`\
  \ 发现的每一个漏洞都能为最终成绩加分。\n\n## 参考文献\n- 认证伦理黑客 (CEH). 2018. 国际电子商务顾问理事会。\n- Lu, D. 2015.\
