  \ |\n\n在下图中，用虚线标记的章节可以根据相关特定群体进行省略。\n\n\n作者\n\n### Wayne Patterson 博士\nWayne Patterson\
  \ 博士是霍华德大学（Howard University）退休计算机科学教授。他目前还是霍华德大学国家科学基金会资助的 GEAR UP 项目的主 Investigator，该项目已支持近\
  \ 300 名 STEM 本科生在 15 个发展中国家进行暑期研究。\n\n他拥有多伦多大学（数学学士和硕士）、布鲁内斯克大学（计算机科学硕士）以及密歇根大学（数学学博士）的学位。他曾任普林斯顿大学和加州大学伯克利分校的博士后研究员。\n\
  \n他目前还是霍华德大学国家科学基金会资助的 GEAR UP 项目的主 Investigator，该项目已支持近 300 名 STEM 本科生在 15 个发展中国家进行暑期研究。他发表了\
  \ 50 多篇与网络安全相关的文章、一本网络安全教材和其他书籍。他主持过 35 项价值超过 6,000,000 美元的外部经费。2006 年，受霍华德大学派往美国国家科学基金会，担任该基金发展中国家国际科学与工程项目经理；2017\
  \ 年担任 Google 的访问学者。\n\n### Cynthia E. Winston-Proctor 博士\nCynthia E. Winston-Proctor\
  \ 博士是一位广受尊敬且成就卓著的叙事心理学家和学者。她是霍华德大学心理学教授以及身份与成功实验室（Identity and Success Laboratory）的主\
  \ Investigator。她还是心理学与教育咨询公司 Winston Synergy LLC 的创始人。\n\n她在霍华德大学获得心理学学士学位，在密歇根大学获得心理学与教育学博士学位。作为一名优秀的心理学家、研究科学家和教师，Winston-Proctor\
  \ 荣获国家科学基金会科学家早期职业奖、霍华德大学年度教学大纲奖、霍华德大学新兴学者奖以及布朗大学霍华德医学研究所教授职位。此外，她还被选为人格学会（Society\
  \ of Personology）成员，这是最古老、最著名的致力于开发、保护和促进关注个人生活和整体人的理论与研究的学会。\n\n作为一名学者，她领导了多个领域的课程开发，包括心理学本科教育、行为网络安全、心理学质性研究、女性健康生活、文化响应性计算思维以及非洲祖源教育。她侧于理论和方法开发的研究和教育成果已发表在众多期刊和编书中，包括《文化与心理学》、《质性心理学》、《青少年研究杂志》、《心理批判（Psych\
  \ Critiques）》、《儿童与发展新方向》、《文化心理学牛津手手册》以及《文化、学习与技术：研究与实践》。\n\nWinston-Proctor 的专业服务包括担任美国心理学会《质性心理学杂志》编辑委员会成员、STEM\
  \ 有色女性协会（Society of STEM Women of Color）主席、阿尔弗雷德·哈肯特基金会（Alfred Harcourt Foundation）董事会成员以及霍华德大学数学科学中学董事会顾问。\n\
  \n\n\n\n在计算机时代的前 40 多年里，安全问题一方面被广泛忽视，另一方面又相对容易解决。原因当然是，当时接触计算机的人要少得多，而且计算机用户的使用环境本质上是企业或大学的主机计算机，这些计算机与该企业环境之外的其他机器没有连接。\n\
  \n到 20 世纪 80 年代中期，出现了一系列发展，将一个相对简单的问题变成了规模巨大的问题。按顺序，从根本上改变安全问题性质的事件包括：\n\n1. 20\
  \ 世纪 80 年初个人电脑的发明和普及，将计算能力带给了个人用户。\n2. 弗雷德·科恩（Fred Cohen，1987 年）卓越的博士论文，他定义了“计算机病毒”这一术语，并证明了此类软件如何在几小时内完全获得对最安全的主机环境的控制。\n\
  3. 1984 年，主要的计算机学会——美国计算机协会（ACM）向 `UNIX` 操作系统的两位开发者之一肯·汤普（Ken Thompson）和丹尼斯·里奇（Dennis\
  \ Ritchie）颁发了图灵奖。汤普在 1984 年的获奖辞中，为程序员提出了一个极具挑战性的问题：编写一个输出为程序自身代码程序。其他人开始意识到，这种代码可以用来创建所谓的“计算机蠕虫”。\n\
  4. 直到 20 世纪 80 年代后期，由美国国防高级研究计划署（`DARPA`）早期开发的网络 `ARPAnet` 开始飞速扩张，并随着浏览器等用户友好软件的发展，吸引了更多的人开始使用由\
  \ `ARPAnet` 演变而来的互联网。\n5. 1987 年，第一次针对多台计算机的大范围攻击（被称为互联网蠕虫）爆发，它导致数千台计算机瘫，大多位于大学校园内。康奈尔大学计算机科学研究生罗伯特·莫里斯（Robert\
  \ Morris）被指控并被定下此罪——他后来成为了 `MIT` 的计算机科学教授（Stoll, 1989）。\n6. 2001 年 9 月 11 日，奥萨马·本·拉丁登策划针对世界贸易中心双子楼、五角大厦以及第四架在匹兹堡附近坠毁的飞机的飞机袭击，将美国及全球范围的安全关注提高到了新的水平，并预示了网络安全问题。\n\
  \n从那时起，无数其他攻击导致网络安全故事几乎每天出现在头条新闻中。朱利·阿桑（Julian Assange）的组织 `WikiLeaks` 最初因揭露机构和政府的腐败获得了国际奖项。美国陆军士兵布拉德利·曼宁（Bradley\
  \ Manning，她后来作为跨性别女性更名为切尔西·曼宁）能够通过 `WikiLeaks` 提取了许多美国政府机密文件并将其公开。爱德华·斯诺登（Edward\
  \ Snowden）作为国家安全局的承包商，也获取了机密文件并逃往俄罗斯，他目前一直在那里生活。\n\n除了这些个人或小组织的行为外，2010 年初，一种名为\
  \ `Stuxnet` 的极其复杂的蠕虫被发布（Nakashima and Warrick, 2012）。该蠕虫通过 `Windows` 传播，目标是西子（`Siemens`）软件和设备。它只攻击西子的监控控制与数据采集系统（`SCADA`）计算机。它成功感染了五个与伊朗政府铀浓缩加工厂相关的机构（取决于你的政治观点，是用于核能还是核武器）。结果是，伊朗政府表示，浓缩基础设施的损失相当于\
  \ 1000 万美元，并使伊朗核计划推后了约 2 年。`Stuxnet` 病毒极其复杂，大多数对该病毒的研究得出结论，只有政府级别的组织和投资才能制造。后来发现，`Stuxnet`\
  \ 实际上是美国国家安全局和以色列摩萨德（Mossad）的联合行动。\n\n越来越多的攻击被发现，其范围从微不足道的（通常由所谓的“间谍小鬼”发起）到分布式拒绝服务（`DDoS`）攻击不等，后者旨在让网站宕痪一天左右——例如\
  \ `MasterCard`、`美国银行`、美国司法部以及许多其他机构经历过的情况。在近期，开发出了被称为勒索软件的攻击类型，个人计算机可能会被外部攻击锁定，直到支付费用以释放被攻击的计算机。我们稍后将讨论最近名为\
  \ `WannaCry` 和 `Petya` 的勒索软件攻击案例。\n\n随着近年来网络攻击的爆炸，该主题的重要性几乎无限制地增长。为了理解如何对抗这些威胁，有必要从几个参考点对该主题进行研究。首先，绝对必须理解设计健康防御策略可用方法。然而，应该注意到，理解防御作用的一个必要组成部分也是理解可能的攻击策略。第三，在该领域的研究中经常忽略的一点是，这里描述的技术方法可能会被人类行为所破坏，这就是为什么本书试图理解对网络安全研究至关重要的技术和人类行为问题。\n\
  \n关于理解人类行为最重要的历史例子之一，是破解了被认为不可破解的代码——二世界大战期间德国军队的 `Enigma` 代码。虽然这个例子本质上早于数字计算机的发明，但其重要足以重申。艾兰·图灵（Alan\
  \ Turing），这位才华横溢的英国数学家，许多人计算机科学的创始人，领导了破解德国 `Enigma` 代码的小组。英国人会获取每日加密信息，但很快发现加密密钥每天午夜更改一次。由于可能的密钥通常有数千万个（而且在计算机时代之前他们的分析是手工的），图灵团队曾束无策，直到发现某些德国密码操作员会在每天的传输中使用相同的开头，类似于“今天天气怎么样？”（Sony,\
  \ 2014）。事实证明，如果密码分析人员感觉到同一条信息以不同的方式加密了两次，这就是破解整个信息的一大步。一旦这一点被意识到，英国团队就能够定期破解 `Enigma`\
  \ 信息，并在二战的最后四年中一直这样做，且没有被德国人发现。一些历史学家得出结论，破解 `Enigma` 代码缩短了约 2 年的战争，拯救了数百万生命。从本质上说，`Enigma`\
  \ 强大的加密算法被违反协议的简单人为错误所击败。\n\n## 1.2 什么是网络安全？\n\n\n\n\n网络安全是一门旨在保护你的计算机以及与之相关的一切内容的科学——包括物理环境、工作站和打印机、线缆、磁盘、优存器和其他存储介质。但最重要的是，网络安全旨在保护所有形式的记忆，即存储在你的系统中的信息。网络安全的设计不仅是为了防御外部入侵者，还为了防御来自恶意和良意的内部人员。当然，恶意内部人员往往带来最大的危险，但我们也面临着来自良意内部人员的危险：例如与朋友共享密码、未能备份文件、在键盘上洒了饮料或食物，或者自然灾害——例如突然断电，以及许多其他可能性。\n\
  \n曾几何时，我们可以专注于对单台计算机的保护。现在，我们必须考虑与我们的机器连接的由数亿台计算机组成的整个宇宙。\n\n使用“网络安全”（cybersecurity）这一术语的原因是，曾经我们关注的是单台计算机，因此如果你回顾\
  \ 20 世纪 90 年或更早的著作（Patterson, 1987），你会发现我们在这里讨论的话题往往被通称为“计算机安全”（computer security）。但这种术语显然已经过时了，因为整个计算环境仅由一台机器组成的用户数量正在迅速减少到零。\n\
  \n安全有三个不同的方面：机密性（secrecy）、准确性（accuracy）和可用性（availability）。让我们按这个顺序考虑这些因素。\n\n##\
  \ 1.2 机密性\n\n安全的计算机系统不会向任何未经授权访问的人披露信息。在政府的高安全性系统中，机密性确保用户只能访问他们被允许访问的信息。这一原则在工业界或学术界同样适用，因为社会的大多数组织都需要某种程度的机密性或保密才能有效运行。\n\
  \n一个主要的区别是，在政府系统（包括军事系统）中，关于机密的规则可能还有法律保护。\n\n## 1.3 准确性：完整性与真实性\n\n安全的计算机系统必须维护存储其中的信息的持续完整性。准确性或完整性意味着系统不能损坏信息，也不允许对其进行任何未经授权的恶意或意外更改。当然，恶意更改可能受到外部源的影响，例如黑客；然而，信息也可能被不小心的用户无意中改变，或者由物理事件（如电信号波动）改变。\n\
  \n在网络通信中，准确性的一个相关变体——真实性（authenticity）提供了一种验证数据来源的方法，通过确定谁输入或发送了数据，并记录其发送和接收的时间。\n\
  \n## 1.4 可用性\n\n计算机系统安全要求的一部分是可用性。换句话说，其信息必须对用户可用。\n\n这意味着计算机系统的硬件和软件保持高效运行，并且在发生灾难时系统能够快速且完全地恢复。\n\
  \n可用性的对面是拒绝服务（denial of service）。拒绝服务的破坏性不实际的信息盗窃，拒绝服务已成为计算环境高效运行的主要威胁之一。\n\n##\
  \ 1.5 网络安全威胁\n\n在描述可能受到威胁的计算环境场景时，我们定义了三个术：\n\n- 漏洞（Vulnerabilities）\n- 威胁（Threats）\n\
  - 应对措施（Countermeasures）\n\n漏洞是系统容易受到攻击点。如果你在描述自己家里的一个漏洞，它可能是一个未锁的后门。\n\n威胁是对系统可能的危险；例如，威胁可能是一个人、一个物体（故障设备）或一个事件（火灾或洪水）。在上例中，威胁是一个利用你后门未锁这一事实进入内部的人。\n\
  \n保护你系统的技术被称为应对措施。继续这个类比，应对措施将由锁上后门组成。\n\n## 1.6 漏洞\n\n在网络安全世界，有许多漏洞，例如：\n\n- 物理漏洞\n\
  - 自然漏洞\n- 硬件和软件漏洞\n- 介质漏洞\n- 泄露漏洞\n- 通信漏洞\n- 人为漏洞\n\n不同类型漏洞的利用难易程度存在很大。例如，窃听无线电话或手机只需要一个可能花费几百美元的扫描仪。\n\
  \n## 1.7 威胁\n\n威胁分为三大类：\n\n- 自然威胁\n- 意外威胁\n- 故意威胁\n\n故意威胁可能来自内部人员或外部人员。外部人员可以包括：\n\
  \n- 外国情报特工\n- 恐怖分子\n- 罪犯\n- 企业掠夺者\n- 黑客\n\n## 1.8 内部还是外部？\n\n尽管大多数安全机制对外部入侵者的防御最好，但许多调查表明，大多数攻击来自内部人员。据估计，多达\
  \ 80% 的系统渗透是由完全授权的用户完成的。\n\n## 1.9 内部人员\n\n有许多不同类型的内部人员：不满的员工、受胁迫的员工、粗心的员工和贪婪的员工。最危险的内部人员类型可能仅仅是懒惰或缺乏培训。他或她懒于更改密码，不学习如何加密文件，没时间擦除旧磁盘，没有注意到插入电脑背面的优存器，并将敏感的打印件堆在地板上。\n\
  \n## 1.10 应对措施\n\n有许多不同类型的应对措施或保护信息的方法。早时候，我们的工作环境可能由单台计算机组成——一个几乎已不再存在的环境——这就是我们弃用“计算机安全”这一术语并用“网络安全”取代而之的原因，现在网络安全至少包含以下应对措施需求。让我们调查这些方法：\n\
  \n- 计算机安全\n- 通信安全\n- 物理安全\n\n## 1.11 计算机安全：过去与现在\n\n在计算的早期，计算机系统庞大、稀有且昂贵。那些幸运拥有计算机的组织尽力保护它。计算机安全只是普通工厂安全的一个方面。安全关注点是物理破入；计算机设备的盗窃；以及磁盘包、磁带和其他介质的盗窃或破坏。内部人员也被挡在外面。很少有人会如何使用计算机；因此，用户可以经过仔细筛选。后来，在\
  \ 20 世纪 70 年，技术发生了变革，随之改变的是用户与计算机及数据的关系。多程序设计、分时和网络化改变了规则。\n\n电信——从远程访问计算机的能力——根本上改变了计算机的使用。企业开始在线存储信息。网络将微型计算机连接在一起并与包含大型在线数据库的主机连接。银行和资产转移变成了一项电子业务。\n\
  \n## 1.12 新的滥用\n\n\n\n在线系统和信息的普及导致了滥用现象的出现。组织不再仅仅担心外部人员对计算机设施和设备的入侵，现在还必须担心容易通过电话线遭受秘密攻击的计算机，以及可能被不留痕迹的入侵者所窃取或更改的信息。个人和政府机构对共享在线数据库中个人财务、法律和医疗记录可用性带来的隐私侵犯表示担忧。\n\
  \n## 1.13 个人计算机世界\n\n20 世纪 80 年代迎来了计算领域的新黎明。随着个人电脑（PC）的引入，各年龄和职业的个人都成为了计算机用户。这项技术引入了新的风险。贵且不可替代的企业数据现在存储在磁盘上，而这些磁盘可能会丢失或被盗。\n\
  \n随着个人电脑的普及，PC 网络、电子邮件、聊天室和公告板也随之增加，极大地提高了安全风险。20 世纪 80 年代也出现了系统遭受攻击的情况。\n\n## 1.14\
  \ 未来\n\n下一个十年的挑战将整合我们所学的知识——将计算机安全构建到我们的产品和日常生活中，在不必要地阻碍我们访问数据的情况下保护数据，并确保产品和标准不断增长，以应对日益增长的技术挑战。\n\
