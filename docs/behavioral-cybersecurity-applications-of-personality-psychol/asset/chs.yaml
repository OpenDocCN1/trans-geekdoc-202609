  \n### 问题](#06_Contents.xhtml#r_idParaDest-119)\n\n#### 8.1 一个系统包含以下内容：\n\n主体（带有分类和安全区域）：\n\
  \n| 主体 | 分类 | 安全区域 |\n| --- | --- | --- |\n| John | 绝密 | { Accounting, Operations\
  \ } |\n| Mary | 机密 | { Operations, Development } |\n| David | 公密 | { Accounting,\
  \ Development } |\n| Ann | 公开 | { Accounting, Operations } |\n\n对象（带有安全级）：\n\n|\
  \ 对象 | 安全级 | 安全区域 |\n| --- | --- | --- |\n| Payroll | 绝密 | { Accounting, Operations\
  \ } |\n| Inventory | 机密 | { Operations, Development } |\n| Shipping | 公密 | { Accounting,\
  \ Development } |\n| Media | 公开 | { Accounting, Operations } |\n\n根据强制访问控制，指示以下请求是否被接受或拒绝：\n\
  \n| 主体 | 对象 | 接受或拒绝 |\n| --- | --- | --- |\n| John | Inventory | |\n| Ann | Payroll\
  \ | |\n| Mary | Media | |\n| Ann | Shipping | |\n| David | Shipping | |\n| Mary\
  \ | Inventory | |\n\n#### 8.2 一个具有以下安全级分级的系统：绝密、机密、公密、公开。该系统拥有以下安全区域：会计、运营、开发、市场。\n\
  \na. 这种级和安全区域的分配有多少种可能？\n\nb. 如果实施了 Bell-LaPadula 策略，以下访问的结果如何：\n\n具有机密级且具有运营、开发安全区域的主体访问具有绝密级且具有会计安全区域的对象。\n\
  \n具有公开级且具有市场安全区域的主体访问具有机密级且具有运营系统安全区域的对象。\n\n#### 8.3 上述系统的安全区域只有会计、运营、开发、市场。有多少种安全区域的分配可能？\n\
  \n#### 8.4 使用相同的系统。假设某个具有三项安全区域列表的主体访问具有不同三项区域列表的对象。这会被接受还是拒绝？\n\n#### 8.5 我们有一个由字母组成的宇宙\
  \ U，`U = { a, b, c, …, z }`。在这个宇宙中，我们拥有对象（单词），由元素组成。例如，单词 elephant 的子集是 `e, l, n,\
  \ p, t`（忽略大小写和重复）。绘制韦恩图显示 Onomatopoeia、Penicillin、Comatose、Lugubrious 和 Syzygy。\n\
  \n#### 8.6 美国国防由于信道无法消除，因此制定了信道容量不超过 1 bit 的准则。假设恶意攻击者 Trudy 遵循了这些准则。Trudy 泄露 10Kb\
  \ 文件所需的最短是多少？\n\n#### 8.7 推理控制：你可以在此处找到大量的美国人口数据：[`factfinder.census.gov/faces/tableservices/pages/productview.html?src=bkmk`](https://factfinder.census.gov/faces/tableservices/pages/productview.html?src=bkmk)。编写一个查询，获取在上次人口普查中小于\
  \ 100,000 但现在大于 100,000 的城市。\n\n#### 8.8 a. 假设在章节和表 8.1 之后的时间间隔内，Ellen 的用例统计为 `A0\
  \ = 0.21, A1 = 0.15, A2 = 0.28, A3 = 0.36`。这对 Ellen 是正常的吗？给出 H0 到 H3 的更新值。\n\nb.\
  \ 如果 Alice 的用例统计为 `A0 = 0.14, A1 = 0.32, A2 = 0.26, A3 = 0.28` 呢？\n\n#### 8.9 在教科书和表\
