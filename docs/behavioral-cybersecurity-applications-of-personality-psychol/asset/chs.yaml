  \ Often Identify People Uniquely. Pittsburgh: Carnegie Mellon University, Data Privacy\
  \ Working Paper 3.\n- Techopedia. 2018. [`www.techopedia.com/definition/10255/covert-channel`](https://www.techopedia.com/definition/10255/covert-channel)\n\
