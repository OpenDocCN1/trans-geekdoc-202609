  text{i} = \\\\text{11}:\\\\,{} \\end{matrix}$$\n\n\n\n\n\n隐形术在近期更为常见，它通过使用隐形墨水来实现。这种墨水在直到第二次世界大战期间一直应用非常成功。隐形墨水的常见来源有牛奶、醋、果汁和尿液，它们在加热时都会变暗。这些液体中都含有碳化合物。当加热时，这些化合物会分解并释放出碳，导致碳与氧气之间发生化学反应，即氧化。`oxidation`的结果是变色，使得隐形墨水变得可见。\n\
  \n零字密码（未加密的消息）也被用于此。真实信息被“伪装”在一条听起来无害的消息中。由于许多明码消息的“听感”怪异，这些可疑的通信被邮件过滤器检测到。然而，“无害”的消息被允许通过。一个包含此类零字密码的示例消息是：\n\
  \n`Fishing freshwater bends and saltwater coasts rewards anyone feeling stressed.\
  \ Resourceful anglers usually find masterful leapers fun and admit swordfish rank\
  \ overwhelming anyday.`\n\n通过取引用中每个单词的第三个字母，可以发现隐藏信息 `SEND LAWYERS GUNS AND MONEY`。\n\
  \n假设在《奥克兰论坛人报》（加利福尼亚州）体育版面的第 27 页出现了一个晦涩的故事：\n\n`However the baseball Athletics\
  \ play ball, relievers cannot meet enviable needs for passing Houston’s formidable\
  \ array when winning under needy circumstances.`\n\n敏锐的读者可能会发现这段传达**温斯顿·丘奇尔**著名格言的隐写信息：\n\
  \n`HoWever thE baSeballAtletics plAy ball, reLievers caNnot meEt enViable neEds\
  \ foR paSsing HoUston’s foRmidable arRay whEn wiNning unDer neEdy ciRumstances.`\n\
  \n也就是说，通过取每个单词的第三个字母：\n\n我们绝永不投降！\n\n以下消息实际上是二世大战期间一名德国间谍从纽约发出的信息：\n\n`Apparently\
  \ neutral’s protest is thoroughly discounted and ignored. Isman hard hit. Blockade\
  \ issue affects pretext for embargo on byproducts, ejecting suets and vegetable\
  \ oils.`\n\n取每个单词的第二个字母，出现了以下消息：\n\n`APparently nEutral’s pRotest iS tHoroughly\
  \ dIscounted aNd iGnored. ISman hArd hIt. BLockade iSsue aFfects pRetext fOr eMbargo\
  \ oN bproducts, eJecting sUets aNd vEgetable oils.`\n\n或者，\n\n珀兴于 6 月 1 日从纽约出发。\n\
  \n德国人开发了微缩技术，FBI 局长 `J. Edgar Hoover` 将其称为“敌人间谍术的杰作”（`Hoover`, 1946）。\n\n即使是文档的布局也能提供关于该文档的信息。`Brassil\
  \ et al.` 通过调整行和单词的位置，发表了数篇关于文档识别和标记的文章（1995 年）。类似的技术也可以用于提供一些其他“隐蔽”信息，就像 `0` 和\
  \ `1` 是计算机上的位，可以在 `string` 中拼接一样。单词移位可帮助识别原始文档。虽然没有像 `Brassil et al.` 在系列中所讨论的那样应用，但类似的方法可以用于显示完全不同的消息。\n\
  \n取以下句子（S0）：\n\n`We explore new steganographic and cryptographic algorithms and\
  \ techniques throughout the world to produce wide variety and security in the electronic\
  \ web called the Internet.`\n\n并应用某些单词移位算法（这是句子 S1）。\n\n`We explore new steganographic\
  \ and cryptographic algorithms and techniques throughout the world to produce wide\
  \ variety and security in the electronic web called the Internet.`\n\n通过叠加 `S0`\
  \ 和 `S1`，结果是以下句子：\n\n`We explore new steganographic and cryptographic algorithms\
  \ and techniques throughout the world to produce wide variety and security in the\
  \ electronic web called the Internet.`\n\n这是通过在句子 `S1` 中将 `explore`、`the`、`wide`\
  \ 和 `web` 之前的空间扩大一个点，并压缩 `explore`、`world`、`wide` 和 `web` 之后的空间一个点来实现。独立来看，包含移位单词的句子看起来无害，但与原始句子结合产生了一个不同的消息：`explore\
  \ the world wide web`。\n\n需要注意的是，在上面的示例中，我们使用了 `Courier` 字体，该字体的特性是所有字符宽度相同。这使我们能够更容易看到某些单词前面的额外空白。这在许多字体中通常是不可见的，例如本文使用的\
  \ `Nemilov` 字体。\n\n## 20.2 传输问题\n\n尽管这些隐藏信息的方法有着悠久而有趣的历史，但在实践中它们的重要性正在下降。\n\n一个原因（尽管可能不是主要原因）是使用物理材料传输信息的后果。例如，使用\
  \ `invisible ink` 假设我们有某种介质来沉积这种墨水。传统上，这可能是一封写在纸上的带有无害信息的信，上面涂有隐形墨水。然后信必须到达目标，可能通过邮政服务或快递。但在电子传输几乎是瞬时且能够处理庞大得的消息或带宽的今天，谁会在纸质上传输此类信息呢？\n\
  \n事实上，在假设电子手段随处可用的情况下，仅仅通过邮件信递进行传输这一事实就可能引起怀疑。例子可能包括几年前寄往华盛顿特区地址（包括 `U.S.` 参议员）的信中的炭疽菌威胁，以及最近通过邮件寄给前总统\
  \ `Obama` 和 `Clinton` 的炸弹案例。\n\n然而，减少使用纸张等物理媒介进行隐写术的第二个、且可能更重要的原因是，在文本中嵌入消息面临挑战，例如上述几个例子——编码非常困难！\n\
  \n“fishing freshwater”示例是 23 个字母的隐写；approximately neutral’s protest”隐藏了 24 个字母。尝试在文本中构建一个例如\
  \ 100 个字母的详细消息而不让容器完全毫无意义，从而引起怀疑。\n\n## 20.3 图像隐写\n\n因此，随着当前的电子时代，隐写术已转向将秘密消息转换为\
  \ `bitstring`，然后将 `bitstring` 逐位注入不是文本，而是其他文件格式，例如图像（`JPEG`、`TIFF`、`BMP` 或 `GIF`）或音频或电影文件（`MPEG`、`WAV`\
  \ 或 `AVI`）。\n\n在图像中嵌入数据时通常有两种类型的文件。持有信息的无害图像是“容器”。“消息”是要隐藏的信息。消息可以是明文、密文、其他图像或可以嵌入图像最低有效位（`LSBs`）的任何内容。\n\
  \n\n\n\n\n当数字图像文件格式开发出来时，一个主要关注的问题是代表图像的文件大小。因此，开发了两种缩小文件大小的策略。这些策略分别被称为“无损压缩”和“有损压缩”（Kurak\
  \ and McHugh, 1992）。这两种方法都能节省存储空间，但在信息解压时可能会产生不同的结果。\n\n这两种方法的设计目的都是通过减小图像文件的大小来节省存储空间。无损压缩技术的特性是可以在减小原始图像尺寸的同时，重建出完整的原始图像。有损压缩技术通常能提供更小的文件大小；然而，在压缩之后，无法逐像素地还原精确的图像。因此，如果随后对隐写文件的大小进行压缩，需要小心，因为有损压缩方法可能会导致隐藏信息的破坏。\n\
  \n### 20.5 图像文件格式\n\n图像文件的大小与图像中的像素数量和色深（`每像素比特数`）正相关。然而，图像可以通过多种方式进行压缩。如上所述，压缩算法以较少的字节数存储原始图像的精确表示或近似表示，这些字节可以通过相应的解压缩算法扩展回其未压缩的形式。具有相同像素数量和色深的图像可能具有非常不同的压缩文件大小。\n\
  \n例如，一个 24 位色彩的 640x480 像素图像将占用近一兆的空间：\n\n```\n640 × 480 × 24 = 7,372,800 bits =\
  \ 921,600 bytes = 900 kB\n```\n\n最常见的图像文件格式如下。\n\n#### JPEG（联合图像专家小组）\n\n`JPEG (Joint\
  \ Photographic Experts Group)`\n`JPEG`（联合图像专家小组）是一种有损压缩方法。几乎每台数字相机都能以 `JPEG` 格式保存图像，该格式支持\
  \ 8 位灰度图像和 24 位 RGB 彩彩图像（红、绿、蓝各 8 位）。`JPEG` 有损压缩可以显著缩小文件大小。当压缩程度不是太大时，压缩不会明显影响或损害图像质量，但\
  \ `JPEG` 文件在反复编辑和保存时会遭受代际衰减。\n\n#### TIFF（标记图像文件格式）\n\n`TIFF (tagged image file\
  \ format)`\n`TIFF`（标记图像文件格式）格式是一种灵活的格式，通常为每个 RGB 颜色保存 8 或 16 位，分别对应 24 位和 48 位，通常使用\
  \ `TIFF` 或 `TIF` 文件扩展名。`TIFF` 可以是有损的也可以是无损的，取决于用于存储像素数据选择的技术。某些格式对双级（黑白）图像提供较好的无损压缩。一些数字相机可以以\
  \ `TIFF` 格式保存图像。`TIFF` 图像格式并未被 Web 浏览器广泛支持。\n\n#### BMP（Windows 位图）\n\n`BMP (Windows\
  \ bitmap)`\n`BMP` 文件格式（Windows 位图）用于处理 Microsoft Windows 操作系统中的图形文件。通常，`BMP` 文件是未压缩的，因此体积大且是无损的；它们的优势是结构简单且在\
  \ Windows 程序中被广泛。\n\n#### GIF（图形交换格式）\n\n`GIF (graphics interchange format)`\n`GIF`（图形交换格式）的正常使用限于\
  \ 8 位调色板，即 256 色颜色（尽管技术上可以实现 24 位色深）。`GIF` 最适合存储为图表，因为。\n\n\n\n\n\nI 是加密的：在我们开始传输之前，可以对基础图像或容器进行加密并发送，这样发送方和接收方都拥有明文图像进行对比，从而能够检测出隐写术中的信息。这种方法的缺点可能是所需的图像文件很大，因此图像文件的加密解密时间可能非常长。当然，如果发送方和接收方认为只需要在较长一段时间内执行一次，那么这可能不是问题。\n\
  \nI 是无害的：如上所述，如果发送方和接收方交换图像文件的情况很少见，那么传输图像这件事本身就可能向潜在攻击者发出信号，暗示某些异常。然而，如果发送方和接收方之间的消息传输环境经常包含某些图像，那么图像本身的存在可能足够无害，能够通过检查并被潜在对手忽略。\n\
  \n安格斯（Angus）和芭芭（Barbara）对于如何建立密码学中所谓的“密钥分配”，决策可能基于对攻击者预期行为的假设。显然，加密 `I` 是最安全的方法，但可能是成本最高的。无害方法可以作为一种替代方案，特别是当我们感觉到攻击者可能不那么勤奋时。\n\
  \n## 20.7 示例\n\n示例：我们将使用易于获得的软件工具 `HxD` (Hörz, 2018)。\n\n我们可以使用两个 `user` 可以下载的工具展示一个示例。其中一个是\
  \ `HxD`。本示例的另一个是 `QuickStego`，我们用它来创建一个 `steganogram`（隐写信息）。\n\n### 20.8 注释\n\n\
  通常情况下，`byte` 中使用 `256` 灰色的 `grayscale`。\n\n`Steganography` 并不是为了取代密码学，而是补充它。正如我们所看到的，密码学方法和隐写术方法在两种不同且矛盾的方法运行。密码学非常开放，甚至告诉对手正在使用的技术或算法。事实上，在\
  \ `RSA` 公钥密码学方法中，由于公钥涉及部分信息，任何攻击者都可以轻松判断出破解代码的难度。另一方面，隐写术方法试图看起来完全正常，希望让攻击者认为不涉及任何秘密，从而决定不采用方法尝试确定是否有要揭露的秘密。\n\
  \n`Steganography` 在 `digital` 通信中有一席之地。它经常用于在 `image` 中 `insert` 消息。例如，如果你 `develop`\
  \ 一个系统，以便保留 `steganogram` 中的所有位置。\n\n![images/020x003_fmt.jpeg](img/020x003_fmt.jpeg)\n\
  \n## 参考文献\n\n`cryptography` 的一个领域是“水印”，它为 `file` 提供 `security`。\n\n事实上，在 `RSA` 公钥密码学方法中，由于公钥涉及部分信息，任何攻击者都可以轻松判断出破解代码的难度。另一方面，隐写术方法试图看起来完全正常，希望让攻击者认为不涉及任何秘密，从而决定不采用方法尝试确定是否有要揭露的秘密。\n\
  \n## 21. 协同或顺序使用密码学和隐写术\n\n尽管这两种方法似乎意味着用户必须二选一，但现在正出现一种理论，认为 `crypto` 和 `stego`\
  \ 两种方法可以以各种方式结合使用。\n\n这是一个非常简单的示例。假设有人想警告盟友即将到来的攻击。这个人创建了一张清晰写有“黎明攻击”消息的图像。然后此人将此发送给盟友。然而，任何拦截消息的人都能清楚地看到消息将警告他们这种即将到来的攻击。但是，发送方实际操作（例如使用\
  \ `QuickStego` 软件）是嵌入了“午夜攻击”的消息。\n\n该示例在 `Figures 21.1` 和 `21.2` 中描述。\n\n![images/021x001_fmt.jpeg](img/021x001_fmt.jpeg)![images/021x002_fmt.jpeg](img/021x002_fmt.jpeg)\n\
  \n\n\n\n另一个更广泛的例子出现在最近的一篇硕士论文（Kittab, 2016）中，作者将他的方法称为“俄罗斯套娃式隐形术”（Matryoshka Steganography，matryoshka\
  \ 是一种著名的俄罗斯嵌套木偶），他使用了五层嵌入，其希望拦截消息的人员不会深挖五层，以找到真实信息。引引 Kittab 的话：\n\n“我们利用隐形术来隐藏消息的重要性，并增加在包含不同类型消息（如文本、图像、音频和视频）的不同媒体文件中寻找该消息的复杂概率。这是一种更安全的通信方式，因为我们使用了未加密的消息容器，这永远不会让编码在不可疑消息载体中的信息重要性引起警觉。”\n\
  \n这是一个相对新的研究领域，并指出了人类行为因素如何影响网络安全各个领域的一个重要方面。\n\n在使用密码学时涉及的人为因素源于防御者在告诉攻击者除密钥以外的所有信息时，取决于攻击者的心态：由于我们假设攻击者对密码学的了解与防御者一样深入，攻击者可以对发起攻击的成本做出非常坚定的计算——即尝试破解加密，或者认为投入资源尝试破解的成本不值从而放弃。\n\
  \n另一方面，嵌入式隐形信息的成功标准是对攻击者行为的判断。如果我们假设每位攻击者在确保消息安全方面的决心都是万无一失的，那么我们无疑会走向密码学方法。然而，在任何环境中，我们面对的都是人类，他们根据某种或某些行为模型运行。如果我们能更多地了解谁可能是潜在的攻击者——例如，我们可能有某些已知的敌人——那么我们就可以根据可能导致攻击的人类优劣来制定一种安全策略。\n\
  \n那么，结合基于计算风险的因素，安全机制的选择可以在加密策略、隐形术策略或两者的结合之间平衡。\n\n如所示，这是一个相对新的研究领域，但显而易见，对任何此类混合方法的有效性分析不仅仅是加密或隐形术算法强度的计算，还包括对所有潜在攻击者人类行为的评估。\n\
  \n## 参考文献\n\nKittab, W. M. 2016. Matryoshka Steganography. M.Sc. thesis, Howard\
  \ University.\n\n### 问题\n\n**21.1** 使用 `QuickStego` 创建你自己的 `ATTACK AT DAWN`、`ATTACK\
  \ AT MIDNIGHT` 示例。使用 `HxD` 等十六进制编辑器找到所有的字节差异。\n\n**21.2** 手动在 JPEG 中嵌入一个 30 字节的消息。\n\
  \n**21.3** 使用 `HxD` 从第 2 题示例的第一个差异位置开始，找到所有的字节差异。\n\n### 22\n\n#### 评估网络攻击的指标\n\n\
  随着近期网络攻击数量急剧增加，尤其是具有极高关注度的事件，例如围绕 2016 年总统选举的事件；`Sony`、`Equifax` 和`美国政府人员办公室`等大型公司数据集的泄露；以及近期的勒索软件攻击，许多人现在对于可以或应该采取哪些措施来保护自己的信息感到困惑。\n\
  \n各种商业解决方案对普通计算机用户往往没有帮助。例如，一些公司宣称保护针对“所有病毒”，这一主张在 Cohen（1987）的研究中被证明在理论上是不可能的。\n\
  \n大多数保护计算环境的尝试中一个特点是，在确定它们可能提供的保护水平时，往往是定性的而非定量的。这无疑是因为确定攻击者渗透一种防御形式相对于另一种防御形式所需的精力极其难以计算，因此没有现有的模型可以量化这种必要的精力。\n\
  \n对于普通用户来说，如果有此类模型，并建议某个特定的网络安全包只有在攻击者愿意花费 1000 万美元来拦截攻击时才能被击败，大多数用户将认为没有必要拥有那种级别的防御。普通用户可能会满足于一种网络防御模型，该模型可以阻止任何可能导致攻击者花费至少\
  \ 100 万美元的攻击。\n\n本章并未尝试解决能够提供此类指标的整体网络防御策略问题，但我们可以提供一个模型——在非常有限的情况下——可以非常精确地确定该水平的保护。\n\
  \n需要注意的是，本章开发的研究得到了非洲领先的网络安全研究人员之一，喀麦隆布亚大学 Michael Ekonde Sone 教授的宝贵帮助（Sone and\
  \ Patterson, 2017）。\n\n#### 22.1 定义网络安全指标\n\n在尝试开发一种考虑到人类决策的网络安全场景的确定性指标时，主要问题之一是难以衡量攻击者或防御者对网络安全事件采取特定方法所需的成本。\n\
  \n然而，我们可以描述一种情况，在这种情况下，可以非常精确地描述参与网络安全攻击或防御的成本。需要注意的是，我们所使用的这个示例在我们可以分配的精确性方面是相当独特的，因此在对双方成本和收益进行评估的确定性方面也是如此。\n\
  \n具体的案例将是所谓的公钥加密体系，也称为 `RSA`。`RSA` 已经广泛使用了 40 多年，我们将仅对这种公钥加密体系提供简要介绍。然而，为了描述该指标，我们需要开发一些非常适用于该环境的数论。\n\
  \n#### 22.2 攻击者/防御者场景\n\n从问题的整体来看，有必要定义一个对网络攻击环境中双方都有用的指标，我们称他们为攻击者和防御者。当然，攻击者的一个更常见的术语是“黑客”，但我们将使用另一个术语。攻击者可以是一个个人、一个自动“机器人”，或一个入侵团队。\n\
  \n我们将研究的经典挑战将表述为：攻击者能够拦截防御者向其他方的方的各种通信，但拦截的消息几乎无用，因为它们已经通过加密方法进行了某种转换。\n\n对于任何此类加密通信（我们也称为\
  \ `密文`），我们可以从许多形式定义攻击成本（对攻击者而言）。假设攻击在电子环境中进行，那么解密通信的成本将涉及所需的解密 `CPU` 时间、内存存储量或攻击者执行攻击的人类时间。计算机科学领域周知，这些成本中的每种本质上都可以相互转换，仅差一个常数因子。防御者也是如此。\n\
  \n为了方便起见，假设我们将通过执行攻击所需的计算机时间来标准化攻击或防御的成本。\n\n\n\n\n例如，让我们考虑一种基于字母表随机排列的简单加密方法 `P`。在这种情况下，仅仅为了降低计算的数量级，我们将通过消除字母表子集\
  \ `{J, K, Q, V, X, Z}`，将字母表缩小为出现频率最高的 20 个符号。假设消息是英文，那么特定的加密选择可以是修改后的 20 罗马字母表的任何可能排列方式之一，例如：\n\
  \n$$\\begin{matrix} \\left\\{ {\\,\\text{A}\\\\,\\text{B}\\\\,\\text{C}\\\\,\\text{D}\\\
  \\,\\text{E}\\\\,\\text{F}\\\\,\\text{G}\\\\,\\text{H}\\\\,\\text{I}\\\\,\\text{L}\\\
  \\,\\text{M}\\\\,\\text{N}\\\\,\\text{O}\\\\,\\text{P}\\\\,\\text{R}\\\\,\\text{S}\\\
  \\,\\text{T}\\\\,\\text{U}\\\\,\\text{W}\\\\,\\text{Y}\\\\,} \\right\\} \\\\ \\\\\
  \ \\downarrow \\\\ \\left\\{ {\\,\\text{T}\\\\,\\text{W}\\\\,\\text{F}\\\\,\\text{O}\\\
  \\,\\text{I}\\\\,\\text{M}\\\\,\\text{A}\\\\,\\text{R}\\\\,\\text{S}\\\\,\\text{B}\\\
  \\,\\text{U}\\\\,\\text{L}\\\\,\\text{H}\\\\,\\text{C}\\\\,\\text{Y}\\\\,\\text{D}\\\
  \\,\\text{P}\\\\,\\text{G}\\\\,\\text{E}\\\\,\\text{N}\\,,} \\right\\} \\\\ \\end{matrix}$$\n\
  \n换句话说，明文中的任何 `A` 都替换为 `T`，`B` 替换为 `W`，以此此类推。另一种说法是，特定加密变换的选择（称为 `key`）也描述了 20 个对象集合的排列。\n\
  \n因此，由于 `P` 的基数为 `|P|= 20!`，密钥有 `20!` 种可能的选择。`Attacker` 会如何尝试截获这样的加密消息？让我们进一步进行简化，即\
  \ `Attacker` 正确地假设 `Defender` 选择了加密方法 `P`。\n\n因此，最简单的方法让 `Attacker` 测试所有可能的密钥选择，直到找到正确的密钥。这通常被称为“穷举搜索”或“暴力破解”。根据简单的概率论证，`Attacker`\
  \ 在找到正确密钥之前，预计只需要尝试 `(20!)/2` 个密钥。\n\n因此，如果我们的 `Attacker` 能够将测试一个密钥所需的时间确定为例如一个微秒，那么穷举搜索攻击要成功就需要：\n\
  \n$$\\begin{matrix} {\\left( {\\text{2}0!} \\right)/\\text{2} = \\text{1},\\text{216},\\\
  text{451},00\\text{4},0\\text{88},\\text{32}0,000} \\\\ {= \\text{1}.\\text{216}\
  \ \\times \\text{1}0^{\\text{18}}\\,\\mu\\text{s} = \\text{1}.\\{~216} \\times \\\
  text{1}0^{\\text{12}}\\,\\text{s}.} \\\\ \\end{matrix}$$\n\n用更有意义单位比较，这将代表 38573.4\
  \ 年。如果 `Attacker` 能够估计其计算机时间、内存或人力成本为每测试一个密钥 `$.10`，那么他就可以估计破解加密的成本为 `$1.22 × 1017`。一个理性的攻击者会得出结论：如果要解密的消息价值小于\
  \ `$1017`（这几乎是肯定的），那么攻击就是不值得的。\n\n这可以作为我们衡量此类加密通信安全性的第一个近似指标。显然，`Attacker` 和 `Defender`\
  \ 都可以进行这项计算，如果 `Attacker` 觉得攻击成功不值得投入的时间或金钱，他将不会尝试攻击。\n\n遗憾的是，这仅仅是第一个近似值，并且包含一个错误的假设。在特定情况下，`Attacker`\
  \ 手头还有其他工具可以破解消息，这些工具并不依赖于穷举搜索攻击的高昂成本。\n\n例如，通过这种简单的加密方法，`Attacker` 可能会逻辑上推断出原始（明文）消息是英文，因此进行所谓的频率分析。由于我们假设消息中字母表的每个字母都被另一个字母替换，因此频率攻击只需统计加密消息中每个字母使用的次数。在任何足够大的英文文本样本中，在几乎所有情况下，字母“E”的出现频率比字母表中的任何任何字母都要出近\
  \ 50%。因此，一旦攻击者完成了加密消息中所有字母的计数（即使对于非常大的文本也只需要几秒钟），他就会发现字母 `E` 的加密字母。此外，在大多数情况下，出现频率第二的字母将是“T”，因此\
  \ `Attacker` 也可以进行相应的替换。\n\n许多报纸（至少在北美）每天都会刊登“字谜游戏”，它使用了这种特定的加密方法，许多人被挑战仅用纸笔来解决它。当然，尝试解决这种方法的优秀\
  \ `Attackers` 仅仅用纸笔就能解决。\n\n\n\n\n一旦公钥值对公开，任何想要向 Alice 发送消息 `M` 的人都可以查询她的公钥 `e`\
  \ 和 `n`，选择消息 `M` 中适当的位数 `m`，将其解释为小于 `n` 的整数，然后通过计算密文 `c` 来加密：`c ≡ me (mod n)`。加密过程通过取位位串\
  \ `M` 的后续等长度片段并执行相同的操作完成。一旦完成，所有密文片段被连接在一起（称为 `C`）并发送给 Alice。由于只有 Alice 知道整个密钥的秘密部分，特别是\
  \ `d`，她选择密文 `c` 的每个部分并计算 `m′ ≡ cd (mod n)`。当然，为了能够通过这种解密找到原始消息，我们需要证明这个简单的代数步骤，该步骤仅取决于所谓的费马小小定理，即在\
  \ `a mod n` 系统中，当 `a ≠ 0` 时，`aφ(n) ≡ 1 (mod n)`。\n\n![93359.jpg](img/93359.jpg)\n\
  \n在 RSA 的密钥生成和操作中，有许多问题需要解决，但至少这表明了加密后的解密会返回原始值。\n\n其他问题涉及寻找足够大的质数 `p` 和 `q` 的困难，尽管即使质数有几百甚至几千位，这也不是一个重大的挑战。此外，寻找逆元\
  \ `e` 和 `d (mod φ(n))` 以及将一个几百位数的数字提升到同样几百位数的指数幂的结果，都需要证明它们在合理时间内是可行且可计算的。证明这一点是完全可能的，在许多参考文献中都可以找到（Patterson,\
  \ 2016）。\n\n此外，幸运于本文讨论的是，RSA 加密系统具有高度的可扩展性，因为它可以从任意位数的质数 `p` 和 `q` 选择中开始（尽管建议 `p`\
  \ 和 `q` 的大小大致相同）。因此，加密防御的设计者可以选择这些参数，并根据 `p` 和 `q` 的位数对潜在攻击者的成本进行参数化。此外，由于 `n =\
  \ pq` 是算法中为人知的，攻击者也可以根据分解数字 `n` 来确定发起攻击的成本。\n\n幸运的是，关于分解此类数字的成本有大量的文献（Pomerance,\
  \ 1996）。到目前，已知的最佳分解算法为：\n\n| `O(e^((((64/9)*b*)^((1/3))(log b)^((2/3)))))` | `(22.1)`\
  \ |\n|---|---|\n\n其中 `b` 是以二进制表示的 `n` 的位数。\n\n让我们考虑可以在攻击/防御场景中有效使用的公钥 `n` 的值范围。首先，由于\
  \ `p` 和 `q` 是 `n` 的唯一质因子，且大小大致相同（例如 `M` 位十进制），那么 `log10 n ≈ 2M` 十进制位。所以本质上，我们可以选择\
  \ `n` 使得 `log10 n` 可以是任何偶整数。\n\n此外，在已知最佳分解方法——一般数域筛法 (`GNFS`) 的复杂度中，如果分解攻击的运行时间如上述\
  \ (1) 所示，那么实际时间将是常数乘以 `e^((((64/9)b)^(1/3)(log b)^(2/3)))`，其中 `b` 是以二进制表示的 `n` 的位数。\n\
  \n该常数由分解尝试特有的外部因素决定，例如多线程计算、处理器速度、内存可用性、`GNFS` 的特定实现等。尽管如此，从相对而言，分解尝试的总体成本与第 22.2\
  \ 节提到的对称加密方法相比不会变化很大。\n\n举一个具体的例子，`n` 已经在 40 到 74 位十进制数的范围内（`p` 和 `q` 范围为 20 到 37\
  \ 位）使用 Wolfram 的 Mathematica 分解算法进行了分解（在 Mathematica 文档中被描述为“在试除法、Pollard p − 1、Pollard\
  \ rho、椭圆曲线和二次筛算法之间切换”）（Wolfram, 2014）。分解时间显示在图 22.1。只要像 RSA 算法规定那样 `log10 p ≈ log10\
  \ q`，随机选择 `p` 和 `q` 是合理的。为了证明这一原理，选取了 10 组不同的 30 位质数 `p` 和 `q`，计算了它们的积 `n`，并对每个\
  \ `n` 进行了分解。Mathematica 的运行时间与平均值的偏差超过 40%，其他 9 个样本中没有一个的偏差达到 30%。\n\n如果我们在大范围内计算预测运行时间，使用所有\
  \ `70 < n < 350` 的 `n` 值，我们可以在常数范围内预测范围内任何 `n` 值的攻击成本。然而，通过对 `70 < n < 74` 使用最佳拟合算法，我们可以近似该常数。因此，我们使用该值来预测更大范围内的攻击成本。对于较大的\
  \ `log10 n` 值，使用对数图表能更好地描述攻击者的成本，如图 22.2 所示。\n\n为了进行强防御，`n` 的大小显然需要大于 70。然而，函数 `O(e^((((64/9)b)^(1/3)(log b)^(2/3)))`\
  \ 的增长速度比多项式时间快。因此，分解 `n` 的运行时间将由表 22.1 中给出的 `n` 值给出，22.2。\n\n### 表 22.1 使用 Mathematica\
  \ 分解\n| n 的位数 | 运行时间（秒） | 预测时间（数量级） |\n|---|---|---|\n| 70 | 3130.66 | 7.91E+15\
  \ |\n| 72 | 5679.34 | 2.020E+16 |\n\n### 表 22.2 使用 GNFS 分解\n| log(10) n | 分钟 | 天\
  \ | 年 |\n|---|---|---|---|\n| 70 | 15.9 | 3.37E+03 | 5.622E+01 |\n| 80 | 16.89 |\
  \ 2.662E+04 | 3.697E+02 |\n| 90 | 17.82 | 2.172E+05 | 3.194E+03 |\n| 100 | 18.68\
  \ | 1.582E+06 | 2.696E+04 |\n| 110 | 19.49 | 1.029E+07 | 1.715E+05 |\n| 120 | 20.26\
  \ | 6.064E+07 | 1.011E+06 |\n| 130 | 21 | 3.278E+08 | 5.464E+06 |\n| 140 | 21.7\
  \ | 1.643E+09 | 2.738E+07 |\n| 150 | 22.37 | 7.697E+09 | 1.283E+08 |\n| 160 | 23.01\
  \ | 3.394E+10 | 5.657E+08 |\n| 170 | 23.63 | 1.417E+11 | 2.362E+09 |\n| 180 | 24.23\
  \ | 5.631E+11 | 9.386E+09 |\n| 190 | 24.81 | 2.139E+12 | 3.565E+10 |\n| 200 | 25.37\
  \ | 7.793E+12 | 1.299E+11 |\n\n这得出了最佳拟合线性函数：`y \\= (3.01720 × 1012)x − 2.26540 ×\
  \ 1015`，其正相关系数为 0.95。因此，这种线性拟合将为足够范围内的任何 `n` 的分解时间提供一个良好的（足够的）初步近似，如表 22.1 所示。\n\
  \n\n\n遗憾的是，到目前为止，这个示例在尝试为网络安全环境建立基于潜在攻击或防御的可靠指标方面几乎是一一无二的。原因在于，对于许多其他安全措施，对于可能尝试的特定攻击类型，并没有相同的可靠性，因此这些措施无法被可靠地确定。这在一个名为\
  \ `P` 的简单加密示例中得到了证明，在该示例中，某类型的攻击肯定会失败，而选择不同的攻击则几乎总能成功。\n\nRSA 加密的简单性使得由于多项特性，它适用于上述分析类型以及可以分配给它的指标类型。首先，`RSA`\
  \ 几乎是可扩展的，因此防御者只要操作得当，就可以选择几乎任何大小的整数 `n` 作为公共信息的基。其次，`n` 的选择可以根据尝试分解该数字的计算成本，这种成本是广为人知的且相当稳定的。接下来，尽管在寻找破解\
  \ `RSA` 其他方法方面付出了大约 40 年的努力，但数论界普遍认为，除非能够构建并运行量子计算机，否则不会有改进——许多专家估计这将在几十年后。`Shor\
  \ (1997)` 已经展示了在这种环境下如何破解 `RSA`。让我们考虑几个示例：\n\n### 第一种场景\n`Defender` 的意图仅仅是震慑 `Attacker`\
  \ 不要尝试使用分解算法，因为计算成本将非常高，以至于没有理性的攻击者会去尝试攻击，因为他们知道成本将超过任何被盗取资源的潜在价值。因此，`Defender`\
  \ 将评估其信息的价值并为 `n` 选择适当的值，例如 `n(D)`。接下来，`D` 将估计 `A` 的攻击能力，然后将其转换为 `n(A)`，并为实际的 `n`\
  \ 选择一个使得 `n > max(n(A), n(D))` 的值。对于这种场景，防御者将选择范围在 `160 <= n <= 200` 之间的 `n` 值。涉及的成本即使攻击者使用带有\
  \ `k` 个处理器的多用途攻击手段，也会震慑住他。\n\n示例：名为 billgates 的 `Defender` 意识到他的总资产为 150 亿美元。由于他是一个审慎的投资者，他的持仓分布广泛，以至于密钥多到无法记忆，因此他将信息存储在受\
  \ `RSA` 保护的区域中，其中 `log2 n = 180`。由于任何潜在攻击者都会知道攻击将花费超过 17,000 年的努力（无论时间、金钱还是周期），他或她将寻求寻找另一个受害者。\n\
  \n### 第二种场景\n`Defender` 将攻击成本选得非常低，使得任何和每一个潜在攻击者都会认为成本是可以接受的，从而着手解决分解问题。这对于 `Defender`\
  \ 似乎不是最佳策略；然而，可能是 `Defender` 故意决定允许 `Attacker` 进入，因为在获取解密后的信息后，`Attacker` 可能会掉入陷阱。这在网络安全技术中通常被称为“蜜罐渗透”（honeypot）。在这种情况下，无论\
  \ `D` 的信息的价值如何，`D` 将将 `A` 的攻击能力估计为 `n(D)`，然后故意选择 `n < n(D)`。\n\n### 第三种场景\n`Defender`\
  \ 为 `RSA` 选择一个难度等级，导致潜在攻击者做出判断：即攻击的预期成本是否低于成功攻击后获得信息的预期价值。通过这种方式，`Defender` 和 `Attacker`\
  \ 本质上建立了一个博弈论问题，其中 `Attacker` 和 `Defender` 都需要建立受保护保护的成本和收益。\n\n### 第四种场景\n`A` 和\
  \ `B` 使用网络进行敏感通信，并且他们持续怀疑试图获取敏感信息的攻击者。`A` 和 `B` 有能力定期更改密钥。为了检测攻击者，他们会将安全性降低到某个阈值水平，并传输可能被攻击者利用的信息。\n\
  \n### 第五种场景：反向钓鱼（Reverse Trolling）\n钓鱼通常被认为是进攻策略的一部分。在这个示例中，`Defender` `D` 将通过“钓鱼”来识别或分类对手。与第二种场景一样，`D`\
  \ 试图将 `A` 引导到陷阱区域。然而，在这种情况下，`D` 会定期改变 `n(D)` 的大小以诱捕潜在攻击者，并以此确定不同 `n(D)` 值下的不同类型攻击。像之前一样，`A`\
  \ 和 `B` 使用使用网络，他们可以定期更改 `RSA` 密钥，特别是降低安全性来诱惑第三方。然后他们可能会交换虚假信息以检测一个或多个 `Attackers`。\n\
  \n## 22.6 结论\n因此，本章描述的示例希望为基于本章设计的指标来建立成功的防御策略提供一种方法。希望在这方面的进一步研究能发现这种量化估计网络安全环境中攻击和防御成本的其他用途。\n\
  \n本质上，在 `Defender` 控制下使用 `RSA` 可以精确确定 `Attacker` 破解加密的成本。当然，如果 `Defender` 能够估计 `Attacker`\
  \ 拥有进行带有 `k` 个处理器的多处理器攻击的资源，那么上述的分解时间就可以除以 `k`。\n\n\n\nRSA 加密的简单性使其适用于上述描述的分析类型以及可以分配它的指标类型，这归功于\
  \ RSA 的若干特性。首先，`RSA` 几乎是完全扩展的，因此建立 `RSA` 系统的防御者只要操作得当，就可以选择几乎任何大小的整数 `n` 作为公共信息的基础。其次，`n`\
  \ 的选择基于尝试分解该数字 `n` 的计算成本，这一成本在分解法研究方面是广为人知且相当稳定的。接下来，尽管在寻找破解 `RSA` 的其他方法上付出了大约 40\
  \ 年的努力，但分解数字 `n` 仍然是破解该加密系统的唯一已知方法。最后，数论界普遍认为，除非且当构建并运行稳健的量子计算机变得可行，否则分解法研究极不可能取得任何重大突破——许多量子专家估计这将在几十年后的未来。\n\
  \n因此，本章描述的示例希望为提供一种方法，根据本章设计的指标的精确性，为建立成功的防御策略制定方案。希望对此方面的进一步调查将发现这种使用可量化方法来估计网络安全环境中攻击和防御成本的其他用途。\n\
