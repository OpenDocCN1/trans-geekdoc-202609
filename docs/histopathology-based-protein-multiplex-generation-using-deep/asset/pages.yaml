    with the minimal or absent expression in the immune-low case, where immune labels
    are based on bulk RNA sequencing data36. To explore the clinical utility of the
    generated IMC images, we assessed their value in augmenting outcome prediction
    tasks using the MelanA, CD3 and CD20 expression profiles, which are known to have
    prognostic relevance37,38. We extracted features from both the H&E and generated
    IMC WSIs using pretrained encoders and input them to an attention-based multiple
    instance learning (MIL) predictor39. We trained the MIL predictor under two settings:
    (1) the unimodal setting, where only H&E features were input to the predictor
    and (2) the multimodal setting, where features extracted from the corresponding
    H&E and predicted IMC patches were first aggregated via a co-attention layer40,
    and the bag-level representations of H&E and predicted IMC WSIs after the MIL
    pooling layer were concatenated before being fed into the classification head
    (Fig. 6). We benchmark the model on two clinically relevant tasks: immune subtype
    classification and survival prediction. For the survival task, we use disease-specific
    survival from patient metadata, which offers


    a more accurate representation of the patient’s disease status41. For immune subtyping,
    we classify patients into low, intermediate and high immune categories based on
    bulk RNA sequencing–derived labels36. Overall, the multimodal setting consistently
    outperforms the unimodal configuration for both tasks. For survival prediction,
    incorporating features from generated IMC images yields a 3.18% improvement in
    average time-dependent C-index42 across 5-fold cross-validation. Kaplan–Meier
    curves generated from the multimodal model show clear stratification of patients
    into low- and high-risk groups based on predicted risk scores (definition provided
    in the section ‘MIL-based clinical outcome prediction’), with statistical significance
    confirmed by a log-rank test (P = 5.05 × 10–7). For immune subtype classification,
    combining features from H&E and generated IMC boosted the average weighted F1-score
    by 17.02% over 5-fold cross-validation. In summary, these findings highlight both
    the generalizability of HistoPlexer to external cohorts and the clinical utility
    of the generated protein expression maps in supporting downstream predictive modelling
    and decision support.'
