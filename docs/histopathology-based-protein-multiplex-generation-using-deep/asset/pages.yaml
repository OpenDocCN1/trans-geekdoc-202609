  md: 'To assess the broader applicability of HistoPlexer across different cancer
    types, we benchmarked it on the DeepLIIF datasets^14,20, which provide pixel-aligned
    H&E and multiplexed images for lung and head and neck cancers. In both settings,
    HistoPlexer consistently outperformed baseline methods, indicating robustness
    across diverse tissue types and imaging conditions (Extended Data Tables 3 and
    4).


    We further explored integrating features from the UNI computational pathology
    foundation model^43 to enhance the performance of HistoPlexer, marking one of
    the first attempts to apply pathology foundation models to generative tasks. Surprisingly,
    end-to-end training of HistoPlexer without UNI-derived features resulted in lower
    MSE and better preserved biological relationships (Supplementary Information and
    Extended Data Table 1). This alignment with recent findings^44, highlighting the
    importance of task-specific training for complex biological tasks. Foundation
    models, typically designed as encoder-only architectures, excel in discriminative
    tasks like classification and regression by focusing on global high-level features.
    However, they are less suited for generative tasks that require detailed spatial
    relationships and fine-grained image details essential for accurate image generation.


    We demonstrated clinical utility through two applications. First, HistoPlexer
    enabled immune phenotyping at the WSI level by quantifying CD8+ T cell infiltration
    patterns (iCD8, sCD8) in tumour centres. These patterns aligned with a state-of-the-art
    approach^5 and effectively stratified patients into immune-hot and -cold subtypes,
    relevant for immunotherapy decisions. Second, we showed generalizability to an
    independent cohort (TCGA-SKCM) where HistoPlexer-generated features, when used
    alongside H&E features, improved predictive performance in survival analysis (3.18%
    increase in time-dependent C-index) and immune subtype classification (17.02%
    improvement in weighted F1-score). These results highlight the potential of HistoPlexer
    to augment clinical decision-making.


    Our study has some limitations. First, in some cases, the model confused CD3/CD8A
    T cell and CD20 B cell markers, which share morphological similarities. Although
    this did not substantially impact downstream tasks, it is a priority for future
    work to refine the model’s ability to accurately distinguish between finer cell
    types. Second, our focus was on major immune and tumour cell types, such as CD8+
    T cells, CD4+ T cells, B cells and tumour cells. This set could be further extended
    to include more sparse cell types, such as endothelial cells, by obtaining a larger
    training cohort. Third, for the multimodal learning experiments on TCGA-SKCM,
    we limited marker selection to MelanA, CD3 and CD20 based on clinical relevance.
    Extending the marker panel could further improve downstream applications. Finally,
    due to inherent slice-to-slice variations in the data, we prioritized downstream
    task performance over strict pixel-level accuracy.


    Our work opens several promising research directions. First, expanding HistoPlexer
    to additional protein markers and cancer types presents an opportunity to uncover
    deeper insights into disease mechanisms without requiring additional tissue or
    increasing the cost. Achieving broader generalization, including the development
    of a universal model across cancer types, remains a key challenge that will require
    access to larger, more diverse and harmonized datasets. Our current results serve
    as a proof of concept and provide a foundation for such future efforts. Second,
    by releasing the UltiVue InSituPlex dataset generated in this study, we encourage
    researchers to explore new diffusion models for multiplexed protein marker generation,
    particularly those that account for slice-to-slice variations. Finally, integrating
    predicted protein expression maps with other modalities could deepen our understanding
    of tumour biology and improve patient stratification.


    In summary, HistoPlexer advances computational pathology by enabling efficient
    and cost-effective generation of multiplexed protein profiles from standard histology
    slides. Our findings demonstrate its potential for clinical integration and its
    utility in enhancing cancer diagnostics and personalized treatment strategies.


    # Methods


    # Datasets and preprocessing


    Tumour Profiler dataset. We built our HistoPlexer framework using a subset of
    highly multimodal metastatic melanoma dataset generated by TuPro^18. Each patient
    was characterized using multiple technologies, including Digital Pathology and
    IMC. A total of six ROIs of 1 mm^2 were selected on each H&E WSI, three within
    the tumour centre and three at the tumour front (intersection of tumour and TME).
    IMC data were generated for those six ROIs on a consecutive section of the same
    tumour block. The IMC data were generated at a resolution of 1 µm per pixel, and
    H&E images were scanned at a resolution of 0.25 µm per pixel. Therefore, ROIs
    of 1 mm^2 were represented by 1,000 pixels for IMC data and 4,000 pixels for H&E
    images. Because the paired data were generated by visually choosing ROIs, in many
    cases a considerable positional shift and rotation between the specified H&E regions
    and the resulting IMC regions can be observed. This was overcome by using template
    matching^45. Specifically, for the IMC modality, we utilized the tumour channel
    marker SOX10, which provided valuable structural information of the tissue. For
    the H&E modality, we focused on the H channel, which captures the haematoxylin
    staining essential for visualizing cellular structures. Given that H&E and IMC
    represent different modalities, we employed mutual information as a metric for
    template matching. This approach allowed us to quantify the alignment between
    the two datasets, ensuring a robust pairing process. This resulted in a paired
    dataset of 336 H&E and IMC ROIs from 78 patients for training and testing model
    performance.


    IMC profiling was performed using a panel of 40 antibodies, of which 11 were selected
    for this study based on the biological function of the corresponding proteins
    as well as high SNR. The proteins targeted by the 11 antibodies include cell-type
    markers, such as tumour markers (MelanA, gp100, S100, SOX10), lymphocyte markers
    (CD20, CD16, CD3, CD8a) and an endothelial marker (CD31). Moreover, two functional
    markers corresponding to proteins involved in antigen presentation (HLA-ABC, HLA-DR)
    were included in the protein set.


    The raw IMC images were processed with CellProfiler software for cell segmentation^46.
    The protein counts extracted from the images were first clipped to 99.9th per
    protein to exclude outliers and then transformed using the arcsinh function with
    cofactor one^47. To exclude background noise, we applied Otsu thresholding^48
    with kernel size three and sigma three and the threshold, separating signal from
    background, determined per sample using all available ROIs. The resulting data
    per protein was first centred and standardized and then subjected to min-max transformation,
    all using data statistics based on the train set only.


    The data were split at the patient level into train and test sets, stratified
    by immune phenotype (inflamed, immune excluded and immune desert). The stratification
    ensured the representation of both tumour and immune cells in each set. The patient-level
    splitting guaranteed that all ROIs from a given patient belonged to only one set,
    preventing undesired information flow. The resulting train and test sets consisted
    of 231 and 105 ROIs, respectively. During model training, ROIs were chosen at
    random, and a tile of size 1,024 x 1,024 from the H&E image and a corresponding
    IMC region of 256 x 256 was extracted.


    For WSI inference, we developed a modular spatially pipeline that processes WSIs
    in a tile-based approach to create spatially resolved protein multiplexes. The
    process begins with tissue segmentation, which identifies stained tissue areas
    and removes the background using Otsu thresholding^48. Each segmented tissue region
    is then divided into 1,024 x 1,024 pixel tiles. To optimize performance, we employ
    a dataloader that batches and parallelizes the processing of these tiles instead
    of processing them sequentially. We also utilize the Shapes library^49 for geometric
    operations, such as creating polygons for tissue masks, scaling them to match
    the WSI resolution and efficiently determining overlaps between tiles and tissue
    regions. This approach reduces computational load by concentrating only on relevant
    areas of'
