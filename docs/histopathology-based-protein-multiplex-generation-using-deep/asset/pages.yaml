  md: '# Histopathology-based protein multiplex generation using deep learning


    Received: 6 December 2024

    Accepted: 10 June 2025

    Published online: 4 August 2025


    A list of authors and their affiliations appears at the end of the paper


    Multiplexed protein imaging offers valuable insights into interactions between
    tumours and their surrounding tumour microenvironment, but its widespread use
    is limited by cost, time and tissue availability. Here we present HistoPlexer,
    a deep learning framework that generates spatially resolved protein multiplexes
    directly from standard haematoxylin and eosin (H&E) histopathology images. HistoPlexer
    jointly predicts multiple tumour and immune markers using a conditional generative
    adversarial architecture with custom loss functions designed to ensure pixel-
    and embedding-level similarity while mitigating slice-to-slice variations. A comprehensive
    evaluation of metastatic melanoma samples demonstrates that HistoPlexer-generated
    protein maps closely resemble real maps, as validated by expert assessment. They
    preserve crucial biological relationships by capturing spatial co-localization
    patterns among proteins. The spatial distribution of immune infiltration from
    HistoPlexer-generated protein multiplex enables stratification of tumours into
    immune subtypes. In an independent cohort, integration of HistoPlexer-derived
    features into predictive models enhances performance in survival prediction and
    immune subtype classification compared to models using H&E features alone. To
    assess broader applicability, we benchmarked HistoPlexer on publicly available
    pixel-aligned datasets from different cancer types. In all settings, HistoPlexer
    consistently outperformed baseline methods, demonstrating robustness across diverse
    tissue types and imaging conditions. By enabling whole-slide protein multiplex
    generation from routine H&E images, HistoPlexer offers a cost- and time-efficient
    approach to tumour microenvironment characterization with strong potential to
    advance precision oncology.


    Tumours are complex systems that acquire hallmark traits by establishing a supportive
    tumour microenvironment (TME) that facilitates tumorigenesis and metastasis1,2.
    Understanding cancer cell interactions with surrounding tissue provides critical
    insights into disease progression and therapeutic response3–5. Multiplexed immunohistochemistry
    and immunofluorescence (mIHC/IF) technologies, such as imaging mass cytometry
    (IMC), enable spatially resolved quantification of up to 40 protein markers, offering
    comprehensive visualization


    of tumour–TME interactions4,6,7. These technologies facilitate analysis of spatial
    cell distribution, phenotype co-localization and cellular interactions, which
    are valuable for clinical decision-making4,5,8,9. However, IMC is limited by low
    throughput, high cost and coverage restricted to small regions of interest (ROIs),
    hindering its broader clinical adoption. In contrast, haematoxylin and eosin (H&E)
    staining remains the gold standard for cancer diagnosis in clinical practice due
    to its low'
