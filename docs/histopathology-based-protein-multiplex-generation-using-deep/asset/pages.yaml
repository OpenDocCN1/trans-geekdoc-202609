    # Discussion


    In this study, we introduced HistoPlexer, a generative model for predicting high-order
    (11-channel) multiplexed protein expression profiles, including both tumour and
    immune markers, directly from H&E images. By simultaneously predicting markers,
    HistoPlexer effectively captured sparse markers and preserved biologically meaningful


    relationships, as validated through spatial correlation analysis of protein co-localization
    patterns. Our comprehensive evaluation showed consistent outperformance of the
    MP approach over SP alternatives, with higher MS-SSIM and PSNR and lower RMSE-SW
    and MSE values. Domain experts found the generated IMC images realistic, with
    HYPE error rates of 61.6% and 72.8% for lymphocyte and tumour markers.'
