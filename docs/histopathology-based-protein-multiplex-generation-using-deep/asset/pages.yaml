    # Implementation and training details.


    The model was trained for 100 epochs using the ADAM optimizer<sup>58</sup> with
    the momentum parameters $\beta 1 = 0.5$ and $\beta 2 = 0.999$ with learning rates
    0.004 and 0.0008 for translator and discriminator networks, respectively. The
    weights were initialized using Xavier initialization. The batch size was set to
    16 and the patch size to 256 for IMC and 1,024 for H&E images, to accommodate
    for the higher resolution of the latter. We increased the generalization capabilities
    of the model by adopting data augmentation, including colour augmentation, random
    flipping, small translations and rotations. We employed the least-squares GAN
    objective. The weights for loss terms were as follows: $\lambda_{gp} = 5.0$, $\lambda_{\text{contrast}}
    = 1.0$ and $\lambda_{R_1} = 1.0$. For model inference and evaluation, we used
    the latest checkpoint at the end of model training.


    # Evaluation metrics


    To evaluate the quality of generated images, we used three widely adopted metrics:
    PSNR, MS-SSIM and RMSE-SW.


    PSNR was used to measure the reconstruction quality by quantifying the ratio between
    the maximum possible signal power and the power of corrupting noise. It is expressed
    in decibels, with higher values indicating better image quality. The PSNR is calculated
    as


    $\text{PSNR} = 10 \log_{10} \left( \frac{L^2}{\text{MSE}} \right)$


    where _L_ is the dynamic range of the pixel values (for example, 255 for 8-bit
    images) and MSE represents the MSE between the original image _I_ and the generated
    image $I''$


    $\text{MSE} = \frac{1}{N} \sum_{i=1}^N (l(i) - l''(i))^2$


    MS-SSIM extends the traditional SSIM metric by incorporating multiple scales to
    capture structural similarity at various resolutions. The SSIM between two images
    _I_ and $I''$ is defined as


    $\text{SSIM}(I, I'') = \frac{(2\mu_I \mu_{I''} + C_1)(2\sigma_{II''} + C_2)}{(\mu_I^2
    + \mu_{I''}^2 + C_1)(\sigma_I^2 + \sigma_{I''}^2 + C_2)}$


    where $\mu_I$ and $\mu_{I''}$ are the means, $\sigma_I^2$ and $\sigma_{I''}^2$
    are the variances, and $\sigma_{II''}$ is the covariance between the two images.
    _C_<sub>1</sub> and _C_<sub>2</sub> are small constants to stabilize the division.
    In MS-SSIM, structural similarity is computed at multiple scales, and the final
    score is a weighted product of SSIM values across these scales:


    $\text{MS-SSIM}(I, I'') = \prod_{j=1}^M \left(\text{SSIM}_j(I, I'')\right)^{\alpha_j}$


    where _M_ is the number of scales and $\alpha_j$ is weighting factor at scale
    _j_. Higher MS-SSIM values indicate better perceptual similarity.


    RMSE-SW is an image quality metric used to assess the similarity between the original
    image _I_ and a generated image $I''$. Unlike traditional RMSE, which computes
    the error over the entire image globally, RMSE-SW calculates the error within
    localized regions by moving a fixed-size window across the image. The RMSE-SW
    between two images _I_ and $I''$ is defined as


    $\text{RMSE-SW} = \sqrt{\frac{1}{N} \sum_{k=1}^N \frac{1}{w \times h} \sum_{i=0}^{w-1}
    \sum_{j=0}^{h-1} (l(x_k + i, y_k + j) - l''(x_k + i, y_k + j))^2}$


    where $w \times h$ represents the size of the moving window across the image with
    a defined stride, resulting in _N_ windows. For each window, we computed the MSE
    between the corresponding pixel values of _I_ and $I''$.


    These metrics provide a comprehensive assessment of both pixel-level accuracy
    and perceptual similarity of the generated images. Frechet inception distance
    and kernel inception distance are widely used metrics for evaluating the quality
    of generated images; however, they are less effective on small datasets as they
    rely on the mean and covariance of a cohort. Hence they were not used when evaluating
    HistoPlexer.


    To quantify the evaluation by domain experts, we used HYPE score, which measures
    the error rate at which humans mistake generated images for real ones or vice
    versa. It is defined as


    $\text{HYPE} = \left( \frac{\text{TP} + \text{FN}}{\text{TP} + \text{TN} + \text{FP}
    + \text{FN}} \right) \times 100 \quad \text{HYPE}_{\text{fake}} = \left( \frac{\text{FP}}{\text{TN}
    + \text{FP}} \right) \times 100 \quad \text{HYPE}_{\text{real}} = \left( \frac{\text{FN}}{\text{TP}
    + \text{FN}} \right) \times 100$


    where TP is the number of true positives, TN is the number of true negatives,
    FP is the number of false positives, and FN is the number of'
