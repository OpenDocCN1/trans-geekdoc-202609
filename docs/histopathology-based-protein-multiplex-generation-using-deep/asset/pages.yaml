    # **HistoPlexer preserves spatial co-localization patterns**


    Given the importance of spatial patterns, as highlighted by refs. 31,32, we assess
    spatial co-localization by quantifying the correlations between protein markers
    that are simultaneously expressed within a given region. For each protein pair,
    we compute the Spearman’s correlation coefficient (SCC) between the two proteins
    and average it across ROIs, considering only those pairs with strong positive
    (>0.15) or strong negative (<–0.15) correlation in GT IMC images. We then compare
    the SCC between GT and generated IMC multiplexes.


    The MP model''s predictions match GT SCC better than the SP model, especially
    for sparse CD-based immune marker pairs like


    CD16:HLA-DR, CD3:HLA-ABC and CD16:CD8a, which are underrepresented in the training
    data (Fig. 3b (i)). We hypothesize that sparse markers lack sufficient tissue
    context for the SP model to generate accurate predictions. In contrast, the MP
    model benefits from learning intermarker correlations by predicting all markers
    simultaneously and leveraging auxiliary morphological information from abundant
    markers. However, for some protein pairs (for example, CD3:CD8a and CD20:CD3),
    the SCC in MP exceeds that of the GT. This likely stems from similar morphologies
    of CD8+ T cells, CD3 T cells and B cells (CD20) in H&E images28, potentially leading
    to overprediction of these sparse markers and overestimated co-localization patterns.
    Additionally, we compute the mean square error (MSE) between SCC values of GT
    and generated IMC across test ROIs (Fig. 3b (ii)). The MP model achieves an MSE
    approximately an order of magnitude lower than that of the SP model, supporting
    our hypothesis. Comparisons with Pix2Pix23 and PyramidP2P12 are in Extended Data
    Fig. 3a. See Supplementary Information for biological implications of observed
    patterns.'
