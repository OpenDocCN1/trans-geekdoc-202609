    we kept a total of 257 cases where immune subtype labels were available. For each
    task, we randomly split the cases stratified by age, gender and sample type to
    create 5-fold cross-validation with a 4:1 ratio of training-validation sets.


    # # HistoPlexer architecture


    The HistoPlexer is based on cGAN, which takes an H&E image as input condition
    and generates multiplexed IMC images where each corresponds to a spatially resolved
    protein expression profile. The translator of the HistoPlexer is a fully convolutional
    U-Net^32 consisting of an encoder and a decoder. The encoder comprises six downsampling
    blocks, each with a convolution layer of stride 2 and kernel size 3. The decoder
    comprises five upsampling blocks, each with nearest-neighbour interpolation, followed
    by a convolution layer of stride 1 and kernel size 3. Each layer is followed by
    a batch-normal layer and ReLU activation. The discriminator consists of six blocks,
    each with a convolution layer followed by a spectral normalization layer and ReLU
    activation. We used patches extracted from template-matched pairs of H&E and IMC
    ROIs to train the HistoPlexer and optimize the


    model with three objectives: an adversarial loss to enforce image-level consistency,
    a Gaussian pyramid loss to enforce pixel-level consistency and a patch-wise contrastive
    loss to enforce patch-level consistency.


    **Adversarial loss.** We used the least-squares loss proposed in LSGAN^33 as our
    adversarial loss and the binary coding scheme, where 0 and 1 are as the labels
    for generated (that is, fake) and real IMC images, respectively. We also adopt
    the multiscale gradient approach^54, which allows simultaneous gradient propagation
    at multiple scales (that is, resolutions). Considering a set of scales {s ∈ S},
    the multiscale adversarial losses for the translator G and discriminator D are
    formulated as


    $$L_G^{adv} = \frac{1}{|S|} \mathbb{E}_{x_p \sim X_p} \left[ (D(G^{(s)}(x_p)|x_p)
    - 1)^2 \right],$$


    $$L_D^{adv} = \frac{1}{|S|} \sum_{s \in S} \left[ \mathbb{E}_{x_p \sim X_p} \left[
    (D(y_p|x_p) - 1)^2 \right] + \mathbb{E}_{x_p \sim X_p} \left[ (D(G^{(s)}(x_p)|x_p))^2
    \right] \right],$$


    $$y_p \sim Y_p$$


    (1)


    where X_p = {x_p ∈ X_ROI} and Y_p = {y_p ∈ Y_ROI} denote paired training patches
    sampled from template-matched H&E and IMC ROIs, respectively; G^(s)(·) and D(·)
    denote the mapping functions parameterized by the translator (at the output scale
    s) and discriminator, respectively; and |·| denotes the cardinality of a set.


    **Gaussian pyramid loss.** We also implement a pixel-level L1 loss as in ref.
    23. Because our H&E and GT IMC images were not pixel-aligned, we relaxed the constraint
    on pixel-to-pixel correspondence by calculating the L1 loss at multiresolution
    representations of the generated and GT IMC images^12, termed Gaussian pyramid
    loss^12. More specifically, a Gaussian pyramid was constructed through iterative
    Gaussian smoothing and downsampling. Each level of resolution, termed an octave,
    comprised a series of images with increasing degrees of smoothness. Transition
    between resolutions was achieved by downsampling the image at the highest smoothness
    level of the current octave to initiate the next:


    $$y_{p,1}^{s+1} = \text{Downsample} \left( y_{p,\#gs}^s \right)$$


    where #gs denotes the number of Gaussian smoothings at one resolution. Note that
    for the generated IMC images, we only computed the Gaussian pyramid on the final
    output scale. Considering a set of resolutions {r ∈ R}, the Gaussian pyramid loss
    is a weighted sum of L1 loss computed on the primary layer of each octave, formulated
    as


    $$L^{gp} = \sum_{r \in R} w_r \mathbb{E}_{x_p \sim X_p} \left\| y_{p,1}^r - y_{p,1}^{r\prime}
    \right\|_1.$$


    $$y_p \sim Y_p$$


    (2)


    where y_p denotes the generated IMC image patches, w_l denotes the resolution
    level and w_l is the weight of the L1 loss at that level.


    **Patch-wise contrastive loss.** We further incorporated a patch-wise contrastive
    loss, inspired by ref. 21. More specifically, we first extracted multilayer features
    using a pretrained feature encoder and applied a transformation via a small projection
    head (for example, a multilayer perceptron) on the extracted features to enrich
    their expressiveness^35. Then, we randomly selected a set of pixel locations for
    each feature layer. By aggregating selected patch features from each layer, we
    could obtain two feature sets for the generated and GT IMC images, respectively.


    Let z''_i denote the anchor feature of the ith patch of the generated IMC image,
    extracted from the lth layer of the feature encoder; z''_i^+ and z''_i^- denote
    the positive and negative features of the corresponding'
