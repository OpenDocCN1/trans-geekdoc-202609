    a Gaussian pyramid loss to enforce pixel-level consistency and a patch-wise contrastive
    loss to enforce patch-level consistency.


    **Adversarial loss.** We used the least-squares loss proposed in LSGAN^33 as our
    adversarial loss and the binary coding scheme, where 0 and 1 are as the labels
