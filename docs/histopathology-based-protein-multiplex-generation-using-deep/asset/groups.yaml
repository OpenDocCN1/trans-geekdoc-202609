    ## HistoPlexer 用于细胞水平分析


    **伪细胞。** 由于 IMC 数据的空间分析通常依赖于细胞水平读数，我们通过提取输入 H&E 和 GT IMC 图像中核坐标周围直径为 10 $\mu$m
    的圆形区域来创建伪单细胞数据。针对个别标记物，伪细胞内的蛋白质表达量在像素间取平均值。H&E 图像的核坐标使用 HoVer-Net 模型$^{28}$获取，GT
    IMC 多重染色的核坐标和细胞类型标签使用 Ilastik$^{59}$ 和 CellProfiler$^{46}$ 获得，如参考文献 8 所述。为简化起见，以下文中将伪细胞称为“细胞”。


    **细胞分型。** 我们采用随机森林分类器$^{30}$，基于 HistoPlexer 的 11 个标记物平均表达量对细胞进行分类。该分类器区分了肿瘤细胞、B
    细胞、CD8$^+$ T 细胞、CD4$^+$ T 细胞和其他细胞。训练使用 scikit-learn 库$^{60}$ 进行，超参数（100 个基估计器，最大树深度
    30）根据最低袋外误差选定。该模型在内部测试集上实现了 0.81 的宏观平均 F1 分数。随后，我们将训练好的 RF 分类器应用于 GT 和生成的蛋白质表达数据，以生成测试集中细胞的细胞类型图谱。


    **细胞水平标记物表达的 t-SNE 分析。** 为了探索成对蛋白相互作用之外的空间模式，我们对细胞水平标记物表达进行了低维嵌入分析。遵循通常用于质量细胞术数据的方法$^{61}$，我们从
    GT 和生成的 IMC 中每个 ROI 抽取 1,000 个细胞，每个 ROI 总计 2,000 个细胞。然后应用联合 t-SNE 降维（两维，困惑度 50，1,000
    次迭代）。为了可视化，蛋白质丰度进行了缩放并在 99 百分位处截断，t-SNE 图按照缩放后的蛋白质表达进行着色$^{61}$。


    ## 免疫表型分析的注释


    为了根据 CD8$^+$ T 细胞的空间分布将样本分层为免疫亚型，我们使用了参考文献 5 确立的注释区域。我们的数据集包括 TuPro 队列中的 109 个转移性黑色素瘤
    H&E 整片切片，转移部位包括淋巴结、软组织、脑及其他远处部位。用于免疫亚型分析的主要区域（称为“肿瘤中心”）完全由肿瘤组织组成，手动定义为排除肿瘤-非肿瘤边界
    500 $\mu$m 边缘的连续肿瘤团块。该“肿瘤中心”进一步分为两个区域：“肿瘤内肿瘤”区域，由无间质存在的致密恶性黑色素细胞簇组成；“肿瘤内间质”区域，包括交织在肿瘤细胞团块中的细胞外基质（通常为瘢痕样间质增生）但无恶性黑色素细胞。这些区域使用在
    HALO$^{AI}$ 平台上实现的深度学习模型自动分类，该模型使用选定的 H&E 整片切片区域进行训练。组织分类在 0.30–$\mu$m/像素的分辨率下进行，最小对象大小阈值为
    50 $\mu$m$^2$。排除的区域——如已有淋巴组织、大片脂肪和肌肉区域、伪迹、坏死、出血和背景——未纳入分析。最终，我们分析了 HALO$^{AI}$
    模型预测中组织分类质量最高的 34 个样本。扩展数据图 4 显示了带有区域注释和分类的示例 H&E 整片切片。


    ## 基于 MIL 的临床结局预测


    **用于生存和免疫亚型预测的基于注意力的 MIL。** MIL 是一种用于基于集合的数据结构的弱监督学习方法。在 MIL 中，输入 $X$ 是一个实例的包（即排列不变集合）$X
    = \{x_1, ..., x_N\}$，其中 $N$ 表示包中实例的数量。给定一个具有 $K$ 个类别的分类任务，目标是从 $M$ 个训练对 $\{(x^{(m)},
    y^{(m)})\}_{m=1}^M$ 中学习一个函数 $\mathcal{F}$，将 $X$ 映射到包级别标签 $y \in K$，而无需知道包中每个实例的标签
    $y_i \in K$。在我们的场景中，输入是一张 WSI，实例表示提取的补片。更具体地说，我们遵循基于嵌入的 MIL 方法$^{39}$，从每个补片中提取特征向量
    $\mathbf{h}_i = h(x_i) \in \mathbb{R}^d$。然后，注意力池化算子将补片特征 $\mathbf{h}_{1:N}$ 聚合为单个
    WSI 级别表示$^{39}$


    $\mathbf{g} = g(\mathbf{h}_i) = \sum_{i=1}^N a_i \mathbf{h}_i,$


    其中


    $a_i = \frac{\exp\{\mathbf{w}^\intercal(\tanh(\mathbf{V}\mathbf{h}_i) \odot \eta(\mathbf{U}\mathbf{h}_i))\}}{\sum_{j=1}^N
    \exp\{\mathbf{w}^\intercal(\tanh(\mathbf{V}\mathbf{h}_j) \odot \eta(\mathbf{U}\mathbf{h}_j))\}}$


    是门控注意力$^{39}$。这里，$\mathbf{w} \in \mathbb{R}^L, V \in \mathbb{R}^{L \times D},
    U \in \mathbb{R}^{L \times D}$ 是带有隐藏维度 $L$ 的可学习参数。$\odot$ 表示逐元素乘法，$\eta(\cdot)$
    表示 Sigmoid 函数。最后，分类器 $f(\cdot)$ 将 WSI 级别表示映射到 WSI 级别标签 $\hat{y} \in K$。


    端到端预测采用以下一般形式：


    $\hat{y} = \mathcal{F}(X) = f(g(\{h(x_i) : x_i \in X\})). \quad (11)$


    对于生存预测，我们将事件时间分布建模为带有右删失数据的序回归任务（即，患者死亡在最后已知随访前未被观察到）。遵循参考文献 40，我们定义了离散时间间隔，并使用输出层中的独立神经元对每个间隔进行建模。更具体地说，我们根据生存时间值的四分位数将连续时间轴划分为非重叠的时间间隔
    $[t_{j-1}, t_j)$，$j \in [1, ..., J]$，记为 $y_j$。然后将每个患者的连续事件时间 $t^{(m)}$ 替换为离散时间标签
    $y_j^{(m)}$，其中


    $y_j^{(m)} = y_j \quad \text{if } \tau^{(m)} \in [t_{j-1}, t_j) \text{ for } j
    \in \{0, ... J\}.$


    问题随后简化为分类任务，每个患者由一个三元组 $(\mathbf{g}^{(m)}, y^{(m)}, c^{(m)})$ 定义。其中，$\mathbf{g}$
    是平均包特征；$c$ 是删失状态，若患者死亡被观察到则 $c=0$，否则 $c=1$；$y$ 是离散时间真实标签。我们采用负对数似然生存损失$^{42}$进行模型优化，表述为


    $L_{surv} = \sum_{m=1}^M (-c^{(m)} \log (f_{surv}(y_j^{(m)} | \mathbf{g}^{(m)}))
    + (1-c^{(m)}) \log (f_{surv}(y_j^{(m)} - 1 | \mathbf{g}^{(m)})) + (1-c^{(m)})
    \log (f_{hazard}(y_j^{(m)} | \mathbf{g}^{(m)}))), \quad (12)$


    其中，$f_{hazard}(y|\mathbf{g}) = \text{Sigmoid}(\hat{y}_j)$ 是离散风险函数，$f_{surv}(y|\mathbf{g})
    = \Pi_{k=1}^j (1 - f_{hazard}(y_k|\mathbf{g}))$ 是离散生存函数。


    最后，患者级别风险定义为所有 logits 的负和$^{41}$，这使得可以识别不同的风险组并对患者进行分层。


    对于免疫亚型预测，我们采用了定义的交叉熵损失：


    $L_{ce} = - \sum_{m=1}^M \sum_{k=1}^K y_k^{(m)} \log (\hat{y}_k^{(m)}). \quad
    (13)$


    基于协同注意力机制的多模态融合。为了融合不同模态的补片特征，我们采用了参考文献 40 提出的协同注意力机制。更具体地说，给定 H&E 特征包 \( H \in
    \mathbb{R}^{N \times d} \) 和 IMC 特征包 \( P \in \mathbb{R}^{N \times d} \)，我们通过计算交叉注意力来使用
    \( P \) 引导 \( H \) 的特征聚集


    其中 \( W_q, W_k, W_v \in \mathbb{R}^{d \times d} \) 是可学习权重，\( A_{p \to h} \in \mathbb{R}^{N
    \times N} \) 是协同注意力矩阵。直观地说，协同注意力衡量 H&E 实例 \( h \) 对 IMC 实例 \( p \) 的成对注意相似度，适用于
    \( i \in N \)。同样，我们可以通过 \( A_{h \to p} \) 使用 \( H \) 引导 \( P \) 的特征聚集。每个协同注意力引导的特征包被输入到基于注意力的
    MIL 模块中，该模块输出聚合的 WSI 级别表示。我们将多个模态的 WSI 级别表示进行拼接，并通过线性层将其投影回原始特征维度 \( d \)，得到多模态
    WSI 级别表示。然后，分类器 \( f(\cdot) \) 使用此表示预测输出标签 \(\hat{y}\)。


    ## 实现和训练细节。


    我们采用了 GitHub 上基于注意力的 MIL 原始实现 https://github.com/AMLab-Amsterdam/AttentionDeepMIL。我们基于
    MCAT 的原始实现（https://github.com/mahmoodlab/MCAT）实现了协同注意力机制。每张 WSI 在 ×20 倍放大下被裁剪为
    256 × 256 个非重叠补片以创建包，其中非组织面积超过 10% 的补片被丢弃。我们使用在病理特定数据集上通过自监督学习预训练的 ResNet18（参考文献
    63）从 H&E 补片中提取特征，并使用在 ImageNet 上预训练的 ResNet50 从 IMC 补片中提取特征。因为 ResNet18 需要三通道输入，我们沿通道维度拼接了三种不同蛋白质标记物的
    IMC 图像：一个肿瘤标记物（MelanA）和两个免疫标记物（CD8 和 CD20）。提取特征的维度对 H&E 和 IMC 补片均为 512。我们对生存和免疫亚型预测进行了
    5 折交叉验证。模型超参数设置如下：初始学习率为 1e-4（生存）和 5e-5（免疫亚型）的 Adam 优化器，基于验证损失的 ReduceLROnPlateau
    调度方案以及小批量大小为 1。模型训练了 100 个时代，基于验证损失（生存）和加权 F1 分数（免疫亚型）进行早停。数据处理和模型训练在 NVIDIA A100
    40GB GPU 上进行。深度学习模型使用 PyTorch（v.1.13.1）进行训练，流水线使用 Python（v.3.8.12）实现。


