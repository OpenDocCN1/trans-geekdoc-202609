    comprises five upsampling blocks, each with nearest-neighbour interpolation, followed
    by a convolution layer of stride 1 and kernel size 3. Each layer is followed by
    a batch-normal layer and ReLU activation. The discriminator consists of six blocks,
    each with a convolution layer followed by a spectral normalization layer and ReLU
    activation. We used patches extracted from template-matched pairs of H&E and IMC
    ROIs to train the HistoPlexer and optimize the


