    IMC。在每张 H&E WSI 上，共选取了六个面积为 1 mm² 的 ROI，其中三个位于肿瘤中心，三个位于肿瘤前沿（肿瘤与 TME 的交界处）。IMC
    数据在同一肿瘤区块的连续切片上针对这六个 ROI 生成。IMC 数据的分辨率为 1 µm/像素，H&E 图像的扫描分辨率为 0.25 µm/像素。因此，面积为
    1 mm² 的 ROI 在 IMC 数据中由 1,000 个像素表示，在 H&E 图像中由 4,000 个像素表示。由于配对数据是通过视觉选择 ROI 生成的，在许多情况下，指定的
    H&E 区域与生成的 IMC 区域之间可以观察到相当大的位置偏移和旋转。这通过模板匹配45 得以克服。具体来说，对于 IMC 模态，我们利用了肿瘤通道标志物
    SOX10，它提供了组织的宝贵结构信息。对于 H&E 模态，我们关注 H 通道，它捕获对可视化细胞结构至关重要的苏木精染色。鉴于 H&E 和 IMC 代表不同的模态，我们采用互信息作为模板匹配的度量。这种方法使我们能够量化两个数据集之间的对齐情况，确保配对过程的鲁棒性。这产生了来自
    78 名患者的 336 对 H&E 和 IMC ROI 的配对数据集，用于训练和测试模型性能。


    使用 40 种抗体的面板进行了 IMC 表型分析，其中根据相应蛋白质的生物学功能和高 SNR 选择了 11 种用于本研究。11 种抗体靶向的蛋白质包括细胞类型标志物，如肿瘤标志物（MelanA、gp100、S100、SOX10）、淋巴细胞标志物（CD20、CD16、CD3、CD8a）和内皮标志物（CD31）。此外，两种与抗原呈递相关的功能标志物（HLA-ABC、HLA-DR）也被纳入蛋白质集。


    使用 CellProfiler 软件对原始 IMC 图像进行细胞分割46。从图像中提取的蛋白质计数首先按每个蛋白质剪切至第 99.9 百分位以排除异常值，然后使用共因子为一的反双曲正弦函数进行转换47。为排除背景噪声，我们应用了核大小为
    3、sigma 为 3 的 Otsu 阈值法48，并使用所有可用 ROI 对每个样本分别确定将信号与背景分开的阈值。得到的每种蛋白质数据首先进行中心化和标准化，然后基于仅使用训练集数据统计量进行最小-最大变换。


    数据在患者层面按免疫表型（发炎型、免疫排斥型和免疫荒漠型）分层分为训练集和测试集。这种分层确保了每个集合中都包含肿瘤细胞和免疫细胞的代表性。患者层面的分割保证了给定患者的所有
    ROI 仅属于一个集合，防止不希望的信息流动。得到的训练集和测试集分别包含 231 个和 105 个 ROI。在模型训练期间，随机选择 ROI，并从 H&E
