    ## 讨论


    本研究中，我们引入了 HistoPlexer，这是一种生成模型，可直接从 H&E 图像预测高阶（11 通道）多重蛋白质表达谱，包括肿瘤标志物和免疫标志物。通过同时预测标志物，HistoPlexer
    有效捕获了稀疏标志物，并保留了具有生物学意义的关系，这一点通过蛋白质共定位模式的空间相关性分析得到了验证。我们的全面评估表明，MP 方法始终优于 SP 替代方案，具有更高的
    MS-SSIM 和 PSNR 以及更低的 RMSE-SW 和 MSE 值。域专家认为生成的 IMC 图像逼真，淋巴细胞和肿瘤标志物的 HYPE 错误率分别为
    61.6% 和 72.8%。


    为评估 HistoPlexer 在不同癌症类型中的更广泛适用性，我们在 DeepLIIF 数据集14,20 上对其进行了基准测试，该数据集提供肺癌和头颈癌的像素对齐
    H&E 和多重图像。在两种设置中，HistoPlexer 始终优于基线方法，表明其在不同组织类型和成像条件下具有鲁棒性（扩展数据表 3 和 4）。


    我们进一步探索了集成来自 UNI 病理计算基础模型43 的特征以增强 HistoPlexer 的性能，标志着首次尝试将病理基础模型应用于生成任务。令人惊讶的是，不使用
    UNI 派生特征对 HistoPlexer 进行端到端训练会导致更低的 MSE 并更好地保留生物学关系（补充信息和扩展数据表 1）。这与最近的研究结果44
    一致，强调了针对复杂生物学任务进行特定任务训练的重要性。基础模型通常设计为仅编码器架构，通过关注全局高级特征，在分类和回归等判别任务中表现出色。然而，它们不太适合需要详细空间关系和精细图像细节（对准确图像生成至关重要）的生成任务。


    我们通过两种应用展示了临床实用性。首先，HistoPlexer 通过量化肿瘤中心区域的 CD8+ T 细胞浸润模式（iCD8、sCD8），实现了 WSI 层面的免疫表型分析。这些模式与最先进的方法5一致，并有效地将患者分层为免疫热型和冷型亚型，这对免疫治疗决策具有重要意义。其次，我们展示了其对独立队列（TCGA-SKCM）的推广性，其中
    HistoPlexer 生成的特征与 H&E 特征共同使用时，提高了生存分析（时间相关 C-index 提高 3.18%）和免疫亚型分类（加权 F1 分数提高
    17.02%）的预测性能。这些结果凸显了 HistoPlexer 增强临床决策的潜力。


    本研究存在一些局限性。首先，在某些情况下，模型会混淆 CD3/CD8A T 细胞和 CD20 B 细胞标志物，因为它们具有形态学相似性。尽管这并未显著影响下游任务，但改进模型准确区分更细致细胞类型的能力是未来工作的优先事项。其次，我们的研究重点是主要的免疫和肿瘤细胞类型，如
    CD8+ T 细胞、CD4+ T 细胞、B 细胞和肿瘤细胞。通过获取更大的训练队列，这一集合可进一步扩展以包含更多稀疏细胞类型，如内皮细胞。第三，对于 TCGA-SKCM
    上的多模态学习实验，我们基于临床相关性将标志物选择限制为 MelanA、CD3 和 CD20。扩展标志物面板可进一步改善下游应用。最后，由于数据中固有的切片间差异，我们优先考虑下游任务性能而非严格的像素级准确性。


    我们的工作开辟了几条有希望的研究方向。首先，将 HistoPlexer 扩展到更多蛋白质标志物和癌症类型，为揭示疾病机制的更深层次见解提供了机会，且无需额外组织或增加成本。实现更广泛的推广，包括跨癌症类型的通用模型开发，仍然是关键挑战，需要获取更大、更多样化且协调一致的数据集。我们目前的结果充当了概念验证，并为未来此类工作奠定了基础。其次，通过发布本研究生成的
    UltiVue InSituPlex 数据集，我们鼓励研究人员探索用于多重蛋白质标志物生成的新型扩散模型，特别是那些考虑切片间差异的模型。最后，将预测的蛋白质表达图谱与其他模态相结合，可以加深我们对肿瘤生物学的理解并改善患者分层。


    总之，HistoPlexer 通过能够从标准病理学切片高效且经济地生成多重蛋白质图谱，推动了病理计算学的发展。我们的研究结果证明了其在临床集成方面的潜力及其在增强癌症诊断和个性化治疗策略方面的实用性。


