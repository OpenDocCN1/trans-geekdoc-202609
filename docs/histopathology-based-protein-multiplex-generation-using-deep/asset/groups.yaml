    Multimodal fusion via co-attention mechanism. To fuse the patch features from
    different modalities, we adopted the co-attention mechanism proposed in ref. 40.
    More specifically, given the H&E feature bag \( H \in \mathbb{R}^{N \times d}
    \) and IMC feature bag \( P \in \mathbb{R}^{N \times d} \), we guided the feature
    aggregation of \( H \) using \( P \) by calculating the cross-attention


    where \( W_q, W_k, W_v \in \mathbb{R}^{d \times d} \) are learnable weights and
    \( A_{p \to h} \in \mathbb{R}^{N \times N} \) is the co-attention matrix. Intuitively,
    the co-attention measures the pairwise similarity for how much an H&E instance
    \( h \) attends to the IMC instance \( p \), for \( i \in N \). Similarly, we
    can guide the feature aggregation of \( P \) using \( H \) via \( A_{h \to p}
    \). Each co-attention guided feature bag was input to an attention-based MIL module,
    which outputted an aggregated WSI-level representation. We concatenated the WSI-level
    representations from multiple modalities and projected them back to the original
    feature dimension \( d \) via a linear layer, resulting in a multimodal WSI-level
    representation. Then, a classifier \( f(\cdot) \) used this representation to
    predict the output label \( \hat{y} \).


    # Implementation and training details.


    We adopted the original implementation of attention-based MIL on GitHub at https://github.com/AMLab-Amsterdam/AttentionDeepMIL.
    We implemented the co-attention mechanism based on the original implementation
    of MCAT (https://github.com/mahmoodlab/MCAT). Each WSI was cropped to 256 × 256
    non-overlapping patches at ×20 magnification to create bags, where patches with
    more than 10% non-tissue area were discarded. We used ResNet18 (ref. 63) pretrained
    on pathology-specific datasets using self-supervised learning to extract features
    from H&E patches and ResNet50 pretrained on ImageNet to extract features from
    IMC patches. Because ResNet18 requires three-channel input, we concatenated IMC
    images of three different protein markers along the channel dimension: one tumour
    marker (MelanA) and two immune markers (CD8 and CD20). The dimension of extracted
    features was 512 for both H&E and IMC patches. We ran the survival and immune
    subtype prediction for 5-fold cross-validation. The model hyperparameters were
    set as follows: Adam optimizer with initial learning rate of 1e-4 (survival) and
    5e-5 (immune subtype), a ReduceLROnPlateau scheme based on validation loss for
    scheduling and a mini-batch size of 1. The model was trained for 100 epochs with
    early stopping based on validation loss (survival) and weighted F1-score (immune
    subtype). The data processing and model training were done on an NVIDIA A100 40GB
    GPU. The deep learning models were trained using PyTorch (v.1.13.1), and the pipeline
    was implemented in Python (v.3.8.12).


    # Reporting summary


    Further information on research design is available in the Nature Portfolio Reporting
    Summary linked to this article.


    # Data availability


    The multiplexed WSI images for the Immuno8 and MDSC FixVue panels, generated using
    Ultivue InSituPlex technology, along with paired H&E images, are publicly available
    on Hugging Face at https://huggingface.co/datasets/CTPLab-DBE-UniBas/HistoPlexer-Ultivue.
    The H&E WSIs for TCGA-SKCM were obtained from the GDC Data Portal: https://portal.gdc.cancer.gov.
    The Tumor Profiler Study data used for model training contain sensitive clinical
    information and are subject to ethical and privacy restrictions, preventing unrestricted
    public release. The data are accessible upon request through the Tumor Profiler
    Consortium’s portal at https://tumorprofilercenter.ch/contacts. Requests must
    include a brief scientific proposal outlining the intended use. The Consortium
    reviews requests typically within four to six weeks and determines the scope,
    duration and conditions of data access.


    Approved users are required to comply with data use agreements that restrict data
    use to specified research purposes and prohibit further sharing without authorization.
    Source data are provided with this paper.


    # Code availability


    The source code and trained model weights for HistoPlexer are available at https://github.com/ratschlab/HistoPlexer
    and on Zenodo at https://doi.org/10.5281/zenodo.15110117 (ref. 66).


