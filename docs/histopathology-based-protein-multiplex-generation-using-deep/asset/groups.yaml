    The Immuno8 panel focuses on immune landscape characterization with markers such
    as CD3, CD4, CD8, CD68, PD-1, PD-L1, FoxP3 and PanCK/SOX10. The MDSC panel identifies
    myeloid-derived suppressor cells using markers CD11b, CD14, CD15 and HLA-DR. Ulivue
    images were acquired at a resolution of 0.325 µm per pixel. For evaluation, we
    used CD3, SOX10, CD8a and HLA-DR markers to assess visual similarity between the
    generated protein multiplex and Ulivue images.


    Paired H&E and Ulivue WSIs were generated by first staining H&E on one tissue
    section, followed by acquiring Immuno8 and MDSC data on consecutive sections for
    ten samples. A tonsil tissue was included with each sample as a positive control.
    Image registration between H&E and Ulivue WSIs was performed using an unsupervised
    multimodal method^51, leveraging the DAPI nuclear stain in Ulivue for alignment
    with H&E images. Both Ulivue and generated IMC images underwent min–max normalization
    and histogram equalization. Additionally, adaptive thresholding was applied to
    Ulivue images to reduce noise and extract true signals. Regions with false signals,
    particularly those corresponding to haemorrhage, bleeding or erythrocytes in H&E,
    were manually annotated and excluded from the analysis. The dataset, including
    H&E and Ulivue images, alignment matrices, and annotated excluded regions, is
    publicly available and can be accessed on Hugging Face (https://huggingface.co/datasets/CTPLab-DBE-UniBas/HistoPlexer-Ulivue).
    The dataset could serve as a valuable baseline for the field.


    ### TCGA-SKCM


    Diagnostic WSIs of SKCM were downloaded from the TCGA database (https://portal.gdc.cancer.gov/)
    for a total of 472 cases. Clinical data of SKCM samples including age, gender,
    sample type (primary tumour/metastatic) and disease-specific survival were also
    downloaded. For the survival prediction, we discarded cases where the diagnostic
    WSIs were of low resolution or the disease-specific survival data were missing,
    leaving 360 cases in total. For the immune subtype prediction, we kept a total
    of 257 cases where immune subtype labels were available. For each task, we randomly
    split the cases stratified by age, gender and sample type to create 5-fold cross-validation
    with a 4:1 ratio of training-validation sets.


    ## HistoPlexer architecture


    The HistoPlexer is based on cGAN, which takes an H&E image as input condition
    and generates multiplexed IMC images where each corresponds to a spatially resolved
    protein expression profile. The translator of the HistoPlexer is a fully convolutional
    U-Net^32 consisting of an encoder and a decoder. The encoder comprises six downsampling
    blocks, each with a convolution layer of stride 2 and kernel size 3. The decoder
    comprises five upsampling blocks, each with nearest-neighbour interpolation, followed
    by a convolution layer of stride 1 and kernel size 3. Each layer is followed by
    a batch-normal layer and ReLU activation. The discriminator consists of six blocks,
    each with a convolution layer followed by a spectral normalization layer and ReLU
    activation. We used patches extracted from template-matched pairs of H&E and IMC
    ROIs to train the HistoPlexer and optimize the model with three objectives: an
    adversarial loss to enforce image-level consistency, a Gaussian pyramid loss to
    enforce pixel-level consistency and a patch-wise contrastive loss to enforce patch-level
    consistency.


    ### Adversarial loss


    We used the least-squares loss proposed in LSGAN^33 as our adversarial loss and
    the binary coding scheme, where 0 and 1 are as the labels for generated (that
    is, fake) and real IMC images, respectively. We also adopt the multiscale gradient
    approach^54, which allows simultaneous gradient propagation at multiple scales
    (that is, resolutions). Considering a set of scales {s ∈ S}, the multiscale adversarial
    losses for the translator G and discriminator D are formulated as


    $$L_G^{adv} = \frac{1}{|S|} \mathbb{E}_{x_p \sim X_p} \left[ (D(G^{(s)}(x_p)|x_p)
    - 1)^2 \right],$$


    $$L_D^{adv} = \frac{1}{|S|} \sum_{s \in S} \left[ \mathbb{E}_{x_p \sim X_p} \left[
    (D(y_p|x_p) - 1)^2 \right] + \mathbb{E}_{x_p \sim X_p} \left[ (D(G^{(s)}(x_p)|x_p))^2
    \right] \right],$$


    $$y_p \sim Y_p$$


    (1)


    where X_p = {x_p ∈ X_ROI} and Y_p = {y_p ∈ Y_ROI} denote paired training patches
    sampled from template-matched H&E and IMC ROIs, respectively; G^(s)(·) and D(·)
    denote the mapping functions parameterized by the translator (at the output scale
    s) and discriminator, respectively; and |·| denotes the cardinality of a set.


    ### Gaussian pyramid loss


    We also implement a pixel-level L1 loss as in ref. 23. Because our H&E and GT
    IMC images were not pixel-aligned, we relaxed the constraint on pixel-to-pixel
    correspondence by calculating the L1 loss at multiresolution representations of
    the generated and GT IMC images^12, termed Gaussian pyramid loss^12. More specifically,
    a Gaussian pyramid was constructed through iterative Gaussian smoothing and downsampling.
    Each level of resolution, termed an octave, comprised a series of images with
    increasing degrees of smoothness. Transition between resolutions was achieved
    by downsampling the image at the highest smoothness level of the current octave
    to initiate the next:


    $$y_{p,1}^{s+1} = \text{Downsample} \left( y_{p,\#gs}^s \right)$$


    where #gs denotes the number of Gaussian smoothings at one resolution. Note that
    for the generated IMC images, we only computed the Gaussian pyramid on the final
    output scale. Considering a set of resolutions {r ∈ R}, the Gaussian pyramid loss
    is a weighted sum of L1 loss computed on the primary layer of each octave, formulated
    as


    $$L^{gp} = \sum_{r \in R} w_r \mathbb{E}_{x_p \sim X_p} \left\| y_{p,1}^r - y_{p,1}^{r\prime}
    \right\|_1.$$


    $$y_p \sim Y_p$$


    (2)


    where y_p denotes the generated IMC image patches, w_l denotes the resolution
    level and w_l is the weight of the L1 loss at that level.


    ### Patch-wise contrastive loss


    We further incorporated a patch-wise contrastive loss, inspired by ref. 21. More
    specifically, we first extracted multilayer features using a pretrained feature
    encoder and applied a transformation via a small projection head (for example,
    a multilayer perceptron) on the extracted features to enrich their expressiveness^35.
    Then, we randomly selected a set of pixel locations for each feature layer. By
    aggregating selected patch features from each layer, we could obtain two feature
    sets for the generated and GT IMC images, respectively.


    Let z''_i denote the anchor feature of the ith patch of the generated IMC image,
    extracted from the lth layer of the feature encoder; z''_i^+ and z''_i^- denote
    the positive and negative features of the corresponding patch (that is, at the
    same pixel location) and the collection of non-corresponding patches (that is,
    at different pixel locations), extracted from the same layer, respectively. Our
    patch-wise contrastive loss is defined as


    $L_{\text{contrast}} = \mathbb{E}_{x_p \sim X_p} \frac{1}{\#\text{layer}} \frac{1}{\#\text{patch}}
    \sum_{i=1}^{\#\text{layer}} \sum_{i=1}^{\#\text{patch}} w_i(z_t^i, z_t^j) \ell_{\text{InfoNCE}}(z_t^i,
    z_t^j, z_t^j), \quad y_p \sim Y_p$


    where


    $\ell_{\text{InfoNCE}}(\mathbf{z}, \mathbf{z}^+, \mathbf{z}^-) = - \log \frac{\exp(\mathbf{z}
    \cdot \mathbf{z}^+ / \tau)}{\exp(\mathbf{z} \cdot \mathbf{z}^+ / \tau) + \sum_{n=1}^N
    \exp(\mathbf{z} \cdot \mathbf{z}_n^- / \tau)}$


    is the InfoNCE objective^56 and


    $w_t(z_t^i, z_t^j) = \left(1 - g\left(\frac{t}{T}\right)\right) \times 1.0 + g\left(\frac{t}{T}\right)
    \times h\left(\text{sim}(z_t^i, z_t^j)\right)$


    is the adaptive patch weight^21. Here, #layer and #patch denote the number of
    layers and patches from which we extract features, _t_ and _T_ denote the current
    and total training steps, $h(\cdot)$ denotes some weighting function and sim($\cdot$,
    $\cdot$) is some similarity measurement.


    Although the HistoPlexer translator outputs the prediction of all selected IMC
    markers, we encountered a practical limitation when employing a pretrained feature
    encoder, which often requires an RGB image as input. To circumvent this, we first
    extracted each channel (that is, marker) of the output IMC image and replicated
    it along the channel dimension to create a pseudo-RGB image. We then passed each
    of them to the feature encoder. The final patch-wise contrastive loss is the sum
    of that of each channel.


    The total losses for G and D are formulated as


    $L_G = L_G^{\text{adv}} + \lambda_{gp} L^{gp} + \lambda_{\text{contrast}} L_{\text{contrast}}
    \quad L_D = L_D^{\text{adv}} + \lambda_{R_1} R_1$


    where


    $R_1 = \mathbb{E}_{x_p \sim X_p} \left\| \nabla_y D(y_p | x_p) \right\|_2^2 \quad
    y_p \sim Y_p$


    is the gradient penalty^57 and $\lambda_{gp}$, $\lambda_{\text{contrast}}$ and
    $\lambda_{R_1}$ are the weights for the Gaussian pyramid loss, patch-wise contrastive
    loss and gradient penalty, respectively.


    ## Implementation and training details


    The model was trained for 100 epochs using the ADAM optimizer^58 with the momentum
    parameters $\beta_1 = 0.5$ and $\beta_2 = 0.999$ with learning rates 0.004 and
    0.0008 for translator and discriminator networks, respectively. The weights were
    initialized using Xavier initialization. The batch size was set to 16 and the
    patch size to 256 for IMC and 1,024 for H&E images, to accommodate for the higher
    resolution of the latter. We increased the generalization capabilities of the
    model by adopting data augmentation, including colour augmentation, random flipping,
    small translations and rotations. We employed the least-squares GAN objective.
    The weights for loss terms were as follows: $\lambda_{gp} = 5.0$, $\lambda_{\text{contrast}}
    = 1.0$ and $\lambda_{R_1} = 1.0$. For model inference and evaluation, we used
    the latest checkpoint at the end of model training.


    ## Evaluation metrics


    To evaluate the quality of generated images, we used three widely adopted metrics:
    PSNR, MS-SSIM and RMSE-SW.


    ### PSNR


    PSNR was used to measure the reconstruction quality by quantifying the ratio between
    the maximum possible signal power and the power of corrupting noise. It is expressed
    in decibels, with higher values indicating better image quality. The PSNR is calculated
    as


    $\text{PSNR} = 10 \log_{10} \left( \frac{L^2}{\text{MSE}} \right)$


    where $L$ is the dynamic range of the pixel values (for example, 255 for 8-bit
    images) and MSE represents the MSE between the original image $I$ and the generated
    image $I''$


    $\text{MSE} = \frac{1}{N} \sum_{i=1}^N (I(i) - I''(i))^2$


    ### MS-SSIM


    MS-SSIM extends the traditional SSIM metric by incorporating multiple scales to
    capture structural similarity at various resolutions. The SSIM between two images
    $I$ and $I''$ is defined as


    $\text{SSIM}(I, I'') = \frac{(2\mu_I \mu_{I''} + C_1)(2\sigma_{II''} + C_2)}{(\mu_I^2
    + \mu_{I''}^2 + C_1)(\sigma_I^2 + \sigma_{I''}^2 + C_2)}$


    where $\mu_I$ and $\mu_{I''}$ are the means, $\sigma_I^2$ and $\sigma_{I''}^2$
    are the variances, and $\sigma_{II''}$ is the covariance between the two images.
    $C_1$ and $C_2$ are small constants to stabilize the division. In MS-SSIM, structural
    similarity is computed at multiple scales, and the final score is a weighted product
    of SSIM values across these scales:


    $\text{MS-SSIM}(I, I'') = \prod_{j=1}^M \left(\text{SSIM}_j(I, I'')\right)^{\alpha_j}$


    where $M$ is the number of scales and $\alpha_j$ is weighting factor at scale
    $j$. Higher MS-SSIM values indicate better perceptual similarity.


    ### RMSE-SW


    RMSE-SW is an image quality metric used to assess the similarity between the original
    image $I$ and a generated image $I''$. Unlike traditional RMSE, which computes
    the error over the entire image globally, RMSE-SW calculates the error within
    localized regions by moving a fixed-size window across the image. The RMSE-SW
    between two images $I$ and $I''$ is defined as


    $\text{RMSE-SW} = \sqrt{\frac{1}{N} \sum_{k=1}^N \frac{1}{w \times h} \sum_{i=0}^{w-1}
    \sum_{j=0}^{h-1} (I(x_k + i, y_k + j) - I''(x_k + i, y_k + j))^2}$


    where $w \times h$ represents the size of the moving window across the image with
    a defined stride, resulting in $N$ windows. For each window, we computed the MSE
    between the corresponding pixel values of $I$ and $I''$.


    These metrics provide a comprehensive assessment of both pixel-level accuracy
    and perceptual similarity of the generated images. Frechet inception distance
    and kernel inception distance are widely used metrics for evaluating the quality
    of generated images; however, they are less effective on small datasets as they
    rely on the mean and covariance of a cohort. Hence they were not used when evaluating
    HistoPlexer.


    To quantify the evaluation by domain experts, we used HYPE score, which measures
    the error rate at which humans mistake generated images for real ones or vice
    versa. It is defined as


    $\text{HYPE} = \left( \frac{\text{TP} + \text{FN}}{\text{TP} + \text{TN} + \text{FP}
    + \text{FN}} \right) \times 100 \quad \text{HYPE}_{\text{fake}} = \left( \frac{\text{FP}}{\text{TN}
    + \text{FP}} \right) \times 100 \quad \text{HYPE}_{\text{real}} = \left( \frac{\text{FN}}{\text{TP}
    + \text{FN}} \right) \times 100$


    where TP is the number of true positives, TN is the number of true negatives,
    FP is the number of false positives, and FN is the number of


    '
