    cost, high throughput and entire tissue section coverage. H&E images reveal morphological
    features crucial for cancer grading, proliferation assessment and staging10. Recent
    deep learning advances have enabled the prediction of protein markers from H&E
    images, such as pan-cytokeratin for pancreatic cancer11, HER2 for breast cancer12
    and Ki-67 for neuroendocrine and breast cancers13. One study predicted two markers,
    specifically one tumour and one immune marker14. Only a few studies have attempted
    to predict a set of protein markers, with a focus solely on either tumour15,16
    or immune markers17, limiting their utility for investigation of tumour–TME interactions.
    These studies either use separate models per marker15,17 or lack quantitative
    validation of the advantages of multiplexed prediction with a single model14,16,17.


    To address these limitations, we introduce HistoPlexer, a deep learning model
    that generates comprehensive protein multiplexes from H&E images. HistoPlexer
    simultaneously predicts 11 markers consisting of both tumour and immune markers,
    enabling an integrative visualization of tumour–host interactions. We train HistoPlexer
    on metastatic samples from the Tumor Profiler Study (TuPro)18 using paired H&E
    and IMC images from serial sections. Through rigorous quantitative evaluation,
    we demonstrate the importance of simultaneous marker prediction through improved
    model performance and enhanced spatial co-localization of markers. We validate
    the biological relevance of generated IMC images through cell typing and immune
    phenotyping, particularly in characterizing immune-hot (inflamed) and immune-cold
    (excluded/desert) tumours based on CD8+ T cell distributions. We demonstrate the
    generalizability of the trained HistoPlexer model on an independent patient cohort
    from the human skin cutaneous melanoma (SKCM) study of The Cancer Genome Atlas
    (TCGA) project19. Experiments on two public multiplexed datasets14,20 further
    validate its adaptability across various cancer types.


    Our results demonstrate that HistoPlexer generates high-quality IMC images that
    closely align with real data distributions. These multiplexes enable precise immune
    phenotyping through spatial analysis of tumour–immune cell interactions, particularly
    in distinguishing immune-hot and -cold subtypes. Simultaneous marker prediction
    preserves biologically meaningful relationships. Furthermore, by augmenting H&E
    whole-slide images (WSIs) with generated IMC multiplex, HistoPlexer improves both
    survival and immune subtype prediction on the TCGA–SKCM dataset, indicating its
    potential for enhancing clinical decision-making.


    # Results


    # Histopathology-based protein multiplex generation with HistoPlexer


    HistoPlexer is a generative model based on a conditional generative adversarial
    network (cGAN) that predicts spatially resolved profiles of multiple proteins
    from input H&E images. The model is trained on paired H&E and multiplexed IMC
    images (Fig. 1a) extracted from aligned H&E and IMC ROIs. During training, the
    H&E images are input to the translator G, which learns to generate protein multiplexes
    (that is, IMC images) based on the tissue morphology from high-resolution H&E
    images. The discriminator D receives the generated IMC and input H&E images and
    scores their similarity to ground-truth (GT) IMC images (Fig. 1b (i)). The translator
    and discriminator are trained adversarially using a least-squares GAN loss, such
    that the generated IMC images can deceive the discriminator into classifying them
    as real. We incorporate two additional losses to ensure both pixel-level and patch-level
    consistency between the generated and GT IMC images. The pixel-level consistency
    loss calculates the L1 distance between the generated and GT IMC images. However,
    because the H&E and GT IMC images are obtained from serial sections of the tissue
    block, a degree of spatial displacement in tissue organization exists between
    consecutive slices (termed slice-to-slice variation). Although aligned at the
    structural level via template matching, consecutive slides from real-world diagnostic


    material are not pixel-level aligned. To account for these differences, we adopt
    the Gaussian pyramid loss12, which relaxes the alignment constraint by evaluating
    the similarity between the generated and GT IMC images at multiple scales (Fig.
    1b (ii)). For patch-level consistency, we utilize a patch-wise contrastive loss
    to ensure that corresponding patches in the generated and GT IMC images are closer
    in the embedded space than distant ones (Fig. 1b (iii)). We also incorporate adaptive
    weights for different patches based on their proximity to GT, as described in
    ref. 21.


    We built the HistoPlexer framework using a multimodal metastatic melanoma dataset
    generated by TuPro18. Each patient was characterized by multiple modalities, including
    H&E and IMC images. ROIs of 1 mm2 were selected on each H&E WSI based on visual
    inspection by a pathology expert, and IMC data were generated for those ROIs on
    a consecutive section of the same tumour block. Using template matching22, we
    created a paired dataset of 336 H&E and IMC ROIs from 78 patients. We focused
    on predicting 11 protein markers that are essential for characterizing the tumour
    and its surrounding TME. These included tumour markers (MelanA, S100, gp100, SOX10),
    immune markers (CD3, CD8a, CD20, CD16, CD31) and antigen-presentation markers
    (HLA-ABC, HLA-DR).


    # HistoPlexer generates accurate and realistic protein multiplexes


    We compared HistoPlexer with Pix2pix23 and PyramidP2P12 in two settings: multiplex
    (MP), where a single model predicts all markers simultaneously, and singleplex
    (SP), where separate models predict each marker individually, with predictions
    stacked to form a pseudomultiplexed output. All models were trained on 231 ROIs
    and tested on 105 ROIs.


    We assessed generated IMC image quality using the multiscale structural similarity
    index (MS-SSIM)24 for perceptual similarity across multiple scales, root mean
    squared error using sliding window (RMSE-SW)25 for pixel-level differences and
    peak signal-to-noise ratio (PSNR)26 for signal fidelity. HistoPlexer in the MP
    setting achieves the highest MS-SSIM and PSNR and lowest RMSE-SW (Fig. 2a), indicating
    greater similarity to GT IMC images generated from consecutive tissue sections.
    The MP setting consistently outperforms SP across all methods, suggesting simultaneous
    marker prediction captures intermarker correlations. For completeness, we included
    a comparison with CycleGAN27 (Extended Data Table 1; statistical test results
    shown in Extended Data Fig. 1) and reported the performance of individual markers
    for the HistoPlexer-MP model (Extended Data Table 2). Moreover, HistoPlexer surpasses
    baseline methods on pixel-aligned DeepLIIF datasets14,20, as shown in Extended
    Data Tables 3 and 4, with details in Supplementary Information.


    We qualitatively evaluated the generated IMC images by comparing them with the
    GT (Fig. 2b and Extended Data Fig. 2) and observed strong alignment in global
    patterns. However, pixel-level correspondence was not expected due to the inherent
    slice-to-slice variations. In some instances, we observed confusion between CD20
    and the CD3/CD8a markers. For instance, in Fig. 2b (ii), CD20 is overexpressed,
    whereas CD3 and CD8a are underexpressed. This may result from the visually similar
    morphology of B and T cells in H&E images, leading to confusion between their
    markers (CD20 for B cells and CD3/CD8a for T cells)28.


    To evaluate the perceived realism of generated IMC images, we used the Human Eye
    Perceptual Evaluation (HYPE) framework29, in which experts assess real versus
    generated IMC images for specific markers shown alongside corresponding H&E images.
    We construct two evaluation sets: tumour-associated markers (MelanA, S100, gp100,
    SOX10) and lymphocyte markers (CD20, CD3, CD8a). For each set, two experts independently
    reviewed 250 image pairs, evenly split between real and generated, sampled from
    test ROIs and augmented through small translations and rotations. The evaluation
