    The model was trained for 100 epochs using the ADAM optimizer<sup>58</sup> with
    the momentum parameters $\beta 1 = 0.5$ and $\beta 2 = 0.999$ with learning rates
    0.004 and 0.0008 for translator and discriminator networks, respectively. The
