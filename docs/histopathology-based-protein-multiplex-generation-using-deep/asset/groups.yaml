    - CD16

    - CD31

    - HLA-ABC

    - HLA-DR


    **Validation**


    All antibodies were validated by immunofluorescence imaging prior to isotope-polymer
    conjugation. Antibodies were tested for cell type and inter cell location specificity
    within positive control tissues.


    ### Plants


