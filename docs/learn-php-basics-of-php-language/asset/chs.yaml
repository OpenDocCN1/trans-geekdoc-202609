  \n# 7 代码片段\n## 7.1 Regex\nRegex 的用法\n正则表达式是非常强大的搜索模式，用于在文本字符串中搜索匹配。要开始使用正则表达式，我们需要获取斜杠之间的数据，然后对数据使用\
  \ `preg_match()` 进行搜索。你创建一个模式，然后使用 `preg_match()` 方法匹配数据。`preg_match()` 方法将返回真或假。\n\
  \n**语法：**\n````preg_match($pattern, $data)`\n```\n```php\n$pattern = '/WP/';\n$sitename\
  \ = \"WP Freelancer\";\n$found = preg_match($pattern, $sitename);\n```\n\n**常用模式：**\n\
  - `.` – 任意字符\n- `\\w` – 任意字母、数字或下划线\n- `\\W` – 任意非字母数字下划线字符\n- `\\d` – 任意数字\n- `\\\
  s` – 空白字符\n- `\\S` – 任意非空白字符\n\n### 示例 [下载示例](https://phpbootcampdemo.com/php/snippets-php/regex/downloads/php-snippets-php-regex-em1.zip)\n\
  ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta\
  \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta\
  \ name=\"description\" content=\"Page Description\">\n    <title>Regular Expressions</title>\n\
  </head>\n<body>\n    <h1>Regular Expressions</h1>\n    <?php\n    $pattern = '/WP/';\n\
  \    $sitename = \"WP Freelancer\";\n    $found = preg_match($pattern, $sitename);\n\
