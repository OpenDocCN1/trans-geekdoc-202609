  \n## 6.3 Cookies\nCookies 的用法\nCookies 是你可以存储在客户端浏览器中的信息。Cookies 以 `name=value`\
  \ 对的格式存储在客户端系统的文件中。Cookies 有助于跟踪用户在网页上的操作，并将这些信息发送到服务器，以便服务器知道客户端在网页上做了什么。对于每个请求，浏览器都会将\
  \ cookies 发送到服务器，如果 cookies 有任何更改，该信息也会发送到服务器。Cookies 帮助存储并捕捉网页上的用户操作。这些信息会被发送到服务器。Cookies\
  \ 会持续到浏览器关闭。我们也可以手动为任何 cookie 设置过期时间。在某些情况下，浏览器禁用了 cookies，导致其无法工作，用户也可以更改浏览器设置不存储\
  \ cookies。Cookies 可以帮助根据用户的操作更改页面视图。\n\n### 如何设置 Cookie\n```php\n$name = ‘WPFreelancer.com’;\n\
  $value = 20;\n$expire = strtotime(‘+1 year’);\n$path = ‘/’;\n// 这是一个 name=value\
  \ 对。\nsetcookie($name, $value, $expire, $path);\n```\n\n### 如何获取 Cookie\n`$_COOKIE[$cookie_name]`\n\
  \n### 如何删除 Cookie\n通过将时间设置为去年前，所有同名的 cookie 都会被删除。\n```php\n$expire = strtotime(‘-1\
  \ year’);\nsetcookie(‘WPFreelancer.com’, ”, $expire, ‘/’);\n```\n\n### 示例 [下载示例](https://phpbootcampdemo.com/php/forms-php/cookies/downloads/php-forms-php-cookies-em1.zip)\n\
