  \n## 2.4 数组\n### 数组的用法\n数组是一种存储一个或多个项目（称为元素 elements）的数据类型。每个元素可以是多种数据类型的组合。`length`\
  \ 用于指示数组中元素的数量。数组的每个元素都可以通过索引数字访问。数组的第一个元素从索引 `0` 开始。\n\n定义数组：\n`$arrayName = array($value1,\
  \ $value2);`\n\n示例：\n`$colorName = array('red', 'white', 'yellow');`\n`$newColors\
  \ = array();`\n`$newColors[0] = $colorName[0];`\n`$newColors[1] = $colorName[1];`\n\
  `$age = array(10, 40, 34);`\n`$studentage[0] = $age[0];`\n`$studentage[1] = 50;`\n\
  \n### 打印数组\n`print_r($arrayName);`\n\n### 示例\n[下载示例](https://phpbootcampdemo.com/php/data-php/arrays/downloads/php-data-php-arrays-em1.zip)\n\
  ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta\
  \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta\
  \ name=\"description\" content=\"Page Description\">\n    <title>Arrays</title>\n\
  </head>\n<body>\n    <h1>Arrays</h1>\n    <?php\n    //定义一个数组\n    $colorNames =\
  \ array('red', 'green', 'white');\n    // 打印一个数组\n    print_r($colorNames);\n  \
  \  echo \"<br>\";\n    // 遍历数组\n    foreach ($colorNames as &$value) {\n       \
  \ echo $value . \"<br>\";\n    }\n    //定义一个空数组\n    $age = array();\n    $age[0]\
  \ = 10;\n    $age[1] = 20;\n    $age[3] = 30;\n    // 打印数组\n    print_r($age);\n\
  \    ?>\n</body>\n</html>\n```\n\n* * *\n![](img/rsrc30P.jpg)[实时预览](https://phpbootcampdemo.com/php/data-php/arrays/em1/after)\n\
