  \n## 1.2 输出第一个 PHP 程序\n`php` 文件名应以 `.php` 扩展名结尾。你应该在起始和结束符号之间编写 `php` 代码：\n```php\n\
  <?php\n//PHP 代码\n?>\n```\n- `<?php` – 告诉服务器从这里开始解释代码。\n- `?>` – 服务器停止解释代码。\n\n**语法：**\n\
  ```html\n<body>\n    <?php ?>\n</body>\n```\n你在 `php` 块之间编写的所有语句都应以分号 `;` 结尾。在行尾添加分号\
  \ `;`。\n\n**步骤：**\n1. 转到：`C:\\wamp64\\www`\n2. 创建文件夹：`\\php\\basics\\echo\\ex1`\n\
