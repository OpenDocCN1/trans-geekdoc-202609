  \n## 2.7 布尔\n\n### 布尔值的用法\n布尔变量有助于根据表达式做出决策或存储基于表达式的决策。布尔值可以是 `true`（真）或 `false`（假）。你可以使用布尔变量作为条件来检查值是真是假。\n\
  \n```php\n$result = 2 > 1;\n$message = ($result) ? \"CORRECT\": \"WRONG\";\n```\n\
  \n#### 示例代码\n[下载示例](https://phpbootcampdemo.com/php/data-php/boolean/downloads/php-data-php-boolean-em1.zip)\n\
  ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta\
  \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta\
  \ name=\"description\" content=\"页面描述\">\n    <title>常量</title>\n</head>\n<body>\n\
  \    <h1>常量</h1>\n    <?php\n        $result = 2 > 1;\n        $message = ($result)\
  \ ? \"CORRECT\" : \"INCORRECT\";\n        echo \"Is 2 > 1? $message\";\n    ?>\n\
  </body>\n</html>\n```\n\n* * *\n\n![](img/rsrc310.jpg)[实时预览](https://phpbootcampdemo.com/php/data-php/boolean/em1/after)\
