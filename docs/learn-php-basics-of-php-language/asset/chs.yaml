  \ `echo` 是哪一个。\n\n## 5.3 文件\n\n用法\n你可以使用 PHP 库读取服务器上的文件。打开文件时使用的模式：\n- `rb` – 以读模式打开文件。\n\
  - `wb` – 创建新文件，如果文件已存在则覆盖它。\n- `ab` – 创建文件，如果文件已存在则追加数据。\n- `xb` – 创建一个新文件，如果文件已存在则不创建。\n\
  \n以下是打开和关闭文件的方法：\n- `fopen($path, $mode)`\n- `fclose($file)`\n- `feof($file)` –\
  \ 用于检查是否已到达文件末尾。\n\n向文件中读取和写入的方法：\n- `fread($file, $length)` – length 用于指定要读取的字节数。\n\
  - `fgets($file)` – 读取一行。\n- `fwrite($file, $data)` – 将 `$data` 值写入文件。\n\n### 示例\n\
