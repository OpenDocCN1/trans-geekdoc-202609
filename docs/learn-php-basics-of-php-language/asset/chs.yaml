- "# Learn PHP：PHP 语言基础\n\n\n\n![](img/rsrc2YG.jpg)\n![](img/rsrc2YG.jpg)\n![](img/rsrc2YH.jpg)\n\
  \n# 关于本书\nPHP 超文本预处理器（`PHP`）是一种编程语言，允许 Web 开发人员创建可以与数据库交互的动态内容。`PHP` 主要用于开发基于 Web\
  \ 的软件应用程序。本教程将帮助你理解 `PHP` 的基础知识以及如何将其诸实践。\n\n## 读者群体\n本教程旨在满足所有渴望学习 `PHP` 基础读者的需求。\n\
  \n## 前提条件\n本书假设你没有任何编程方面的知识，并且处于初级水平。\n\n## 如何使用本书\n本书包含了 `PHP` 语言基础、练习和示例，这些都是\
  \ `PHP` 训练营计划的一部分。该训练营已帮助许多学生在短短 30 天内成为 `PHP` 全栈 Web 开发人员。[在此查看更多关于该计划的信息。](https://srini.link/phpbootcamp)\n\
