    1.4      Comments Usage of Comments You can use the special notation to comment
    the code inside the php. Comments helps to document about the code with a single
    or multiple line. Comments are ignored by the Web Server and it is not displayed
    and not sent to the browser. You will not see php comments in the final HTML output.
    There are two types of Comments in PHP: Single Line Comments Multi Line Comments
    // –   This is Single Line Comments. Use to comment one line. \# –   This is Single
    Line Comments. Use to comment one line. /\* –   is used to indicate the comments
    are starting. \* /  – is used to indicate the comments are ended. Anything between
    / \* and \* / will not be executed by the server. Browser will never see php comments
    because it is ignored by the server. SYNTAX:   <body> <?php // This is a Single
    Line Comments \# This is also a Single Line Comments /\* This is a multi line
    comments which you cannot see on the browser \*/ ?> </body> Sample Example [Download
    the Example](https://phpbootcampdemo.com/php/basics-php/comments/downloads/php-comments-em1.zip)
