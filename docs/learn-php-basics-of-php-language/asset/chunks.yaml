    \n## 7 Snippets\n### 7.1 Regex\nUsage of Regex\nRegular Expression are special\
    \ searching pattern that is very powerful to search for matching pattern in text\
    \ strings. To start using the Regular expression we need to get the data between\
    \ forward slash and then use the method `preg_match()` on the data and this pattern\
    \ to search. You create a pattern and then use method `preg_match()` to match\
    \ on the data. `preg_match()` method will return true or false.\n\n**Syntax:**\n\
    ````preg_match($pattern, $data)`\n```\n```php\n$pattern = '/WP/';\n$sitename =\
    \ \"WP Freelancer\";\n$found = preg_match($pattern, $sitename);\n```\n\n**Some\
    \ patterns:**\n- `.` – Any Single Character\n- `\\w` – Any Letter, number or underscore\n\
    - `\\W` – Any character\n- `\\d` – Any Digit\n- `\\s` – White Space Character\n\
