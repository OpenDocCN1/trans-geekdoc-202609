    **练习 2**: 尝试更改常量的值并观察错误。\n\n## 2.8 日期和时间\n\n### 日期和时间的用法\n`date()` 用于格式化日期。`time()`\
    \ 返回时间戳。\n\n```php\n$today = time();\n```\n\n#### 示例代码\n[下载示例](https://phpbootcampdemo.com/php/data-php/datetime/downloads/php-data-php-datetime-em1.zip)\n\
