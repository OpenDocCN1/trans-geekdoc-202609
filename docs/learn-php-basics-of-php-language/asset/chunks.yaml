    \ name=\"description\" content=\"Page Description\">\n    <title>Numbers</title>\n\
    </head>\n<body>\n    <h1>Numbers</h1>\n    <?php\n    $length = 10;\n    $breath\
    \ = 10;\n    $area = $length * $breath;\n    echo \"Area: $length x $breath =\
    \ $area\";\n    ?>\n</body>\n</html>\n```\n![](rsrc30K.jpg)[Live Preview](https://phpbootcampdemo.com/php/data-php/numbers/em1/after)\n\
    \n### Exercise 1\nWrite a function to round a given decimal number and display\
    \ the output.\nTips: Use `round(value)`\n![](rsrc30M.jpg)[Live Preview](https://phpbootcampdemo.com/php/data-php/numbers/ex1/after)\n\
    \n### Exercise 2\n[Download the Exercise 2](https://phpbootcampdemo.com/php/data-php/numbers/downloads/php-data-php-numbers-ex2.zip)\n\
    Convert `String` to `Integer` and add two string numbers and add two integers\
    \ numbers.\n![](src30N.jpg)[Live Preview](https://phpbootcampdemo.com/php/data-php/numbers/ex2/after)\n\
    \n## 2.4 Arrays\n### Usage of Arrays\nArrays is a data type that holds one or\
    \ more items called as elements. Each element could be combination of data types.\
    \ `length` is used to indicate the number of elements in the array. Every element\
    \ of the array can be accessed with an index number. First element of Array starts\
    \ with `0` index.\n\nDefine an Array:\n`$arrayName = array($value1, $value2);`\n\
    \nExamples:\n`$colorName = array('red', 'white', 'yellow');`\n`$newColors = array();`\n\
    `$newColors[0] = $colorName[0];`\n`$newColors[1] = $colorName[1];`\n`$age = array(10,\
    \ 40, 34);`\n`$studentage[0] = $age[0];`\n`$studentage[1] = 50;`\n\n### Print\
    \ Arrays\n`print_r($arrayName);`\n\n### Sample Example\n[Download the Example](https://phpbootcampdemo.com/php/data-php/arrays/downloads/php-data-php-arrays-em1.zip)\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta\
    \ name=\"description\" content=\"Page Description\">\n    <title>Arrays</title>\n\
    </head>\n<body>\n    <h1>Arrays</h1>\n    <?php\n    //Define an Array\n    $colorNames\
    \ = array('red', 'green', 'white');\n    // Print an Array\n    print_r($colorNames);\n\
    \    echo \"<br>\";\n    //Loop thru the arrays\n    foreach ($colorNames as &$value)\
    \ {\n        echo $value . \"<br>\";\n    }\n    //Define an Empty Array\n   \
    \ $age = array();\n    $age[0] = 10;\n    $age[1] = 20;\n    $age[3] = 30;\n \
    \   // Print Array\n    print_r($age);\n    ?>\n</body>\n</html>\n```\n\n* * *\n\
