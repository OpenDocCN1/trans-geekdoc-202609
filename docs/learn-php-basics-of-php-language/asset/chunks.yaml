    \n## 3.2 Arithmetic Usage of Arithmetic Expressions\n\nExpressions are evaluated\
    \ into a result value or final value or single value. There are a couple of Expressions:\n\
    - Assignment Expressions\n- Arithmetic Expressions\n- Comparison Expressions\n\
    - Logical Expressions\n\nWe will look at Assignment Expressions in this topic.\
    \ Expressions use Operators to perform the activity.\n\n![](rsrc31E.jpg) `+` is\
    \ the arithmetic operator which is used to perform mathematics calculations. Arithmetic\
    \ Operators are: `+`, `–`, `*`, `/`, `%`, `++`, `–`.\n\n### Increment by 1\n```php\n\
    counter++;\ncounter = counter + 1;\n```\n\n### Decrement by 1\n```php\ncounter--;\n\
    counter = counter – 1;\n```\n\n**Order of Precedence:**\n`++` — `*`, `/`, `%`\
    \ — `+`, `–`. Anything mentioned in `()` will get higher precedence over anything.\n\
    ```php\n(5 + 2) * 2; //Result – 14\n```\n\n#### Sample Example\n[Download the\
    \ Example](https://phpbootcampdemo.com/php/expressions-php/arithmetic/downloads/php-expressions-php-arithmetic-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n   \
    \ <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
    \    <meta name=\"description\" content=\"Page Description\">\n    <title>Arithmetic\
    \ Expressions</title>\n</head>\n<body>\n    <h1>Arithmetic Expressions</h1>\n\
    \    <?php\n    $counter = 10;\n    echo \"Counter: $counter <br>\";\n    $counter++;\n\
    \    echo \"Counter++: $counter <br>\";\n    $counter = 10;\n    echo \"Counter:\
    \ $counter <br>\";\n    $counter--;\n    echo \"Counter--: $counter <br>\";\n\
    \    $counter = (10 - 5) * 2;\n    echo \"Result: $counter\";\n    ?>\n</body>\n\
    </html>\n```\n\n* *\n\n![](rsrc31F.jpg)[Live Preview](https://phpbootcampdemo.com/php/expressions-php/arithmetic/em1/after)\n\
    [Download the Exercise 1](https://phpbootcampdemo.com/php/expressions-php/arithmetic/downloads/php-expressions-php-arithmetic-ex1.zip)\n\
    \nExercise 1: Find if 15 is even or odd using Modulus (`%`) symbol.\n```php\n\
    $counter = 15 % 2;\n```\n\n![](rsrc31G.jpg)[Live Preview](https://phpbootcampdemo.com/php/expressions-php/arithmetic/ex2/after)\n\
    [Download the Exercise 2](https://phpbootcampdemo.com/php/expressions-php/arithmetic/downloads/php-expressions-php-arithmetic-ex2.zip)\n\
    \nExercise 2: Try to apply `++` to the following:\n```php\n$message = \"Hello\"\
    ;\n$message++; // This won't work\n```\n\n* *\n\n![](rsrc31H.jpg)[Live Preview](https://phpbootcampdemo.com/php/expressions-php/arithmetic/ex2/after)\n\
    \n## 3.3 Comparison Usage of Comparison Expressions\n\nExpressions are evaluated\
    \ into a result value or final value or single value. There are a couple of:\n\
    - Assignment Expressions\n- Arithmetic Expressions\n- Logical Expressions\n\n\
    We will look at Comparison Expressions in this topic. Expressions use Operators\
    \ to perform the activity.\n\n![](rsrc31J.jpg) `>` compares two values and returns\
    \ true or false. Comparison Operators are:\n`<` – Less than\n`>` – Greater than\n\
    `==` – Equal to\n`===` – Ident equal\n`!=` – Not equal\n`>=` – Greater or equal\n\
    `<=` – Less or equal\n\n### Ternary Operator\nPHP has a ternary operator that\
    \ assigns a value based on a condition.\n```php\n$result = ($condition <= 10)\
    \ ? \"YES\" : \"NO\";\n```\n\n#### Sample Example\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1.0\">\n    <meta name=\"description\" content=\"\
    Page Description\">\n    <title>Comparison Expressions</title>\n</head>\n<body>\n\
    \    <h1>Comparison Expressions</h1>\n    <?php\n    $counter = 10;\n    echo\
    \ \"Counter: $counter <br>\";\n    $result = ($counter == 10) ? \"YES\" : \"NO\"\
    ;\n    echo $result;\n    ?>\n</body>\n</html>\n```\n\n* *\n\n![](rsrc31K.jpg)[Live\
    \ Preview](https://phpbootcampdemo.com/php/expressions-php/comparison/em1/after)\n\
    [Download the Exercise 1](https://phpbootcampdemo.com/php/expressions-php/comparison/downloads/php-expressions-php-comparison-ex1.zip)\n\
    \nExercise 1: Learn how to compare `NULL` with `===` operator.\n```php\n$var ===\
    \ null;\n```\n\n![](rsrc31M.jpg)[Live Preview](https://phpbootcampdemo.com/php/expressions-php/comparison/ex2/after)\n\
    [Download the Exercise 2](https://phpbootcampdemo.com/php/expressions-php/comparison/downloads/php-expressions-php-comparison-ex2.zip)\n\
    \nExercise 2: Find empty string from strings.\n\n![](rsrc31N.jpg)![][](rsrc31P.jpg)[Live\
    \ Preview](https://phpbootcampdemo.com/php/expressions-php/comparison/ex2/after)\n\
    \n## 3.4 Logical Usage of Logical Expressions\n\nExpressions are evaluated into\
    \ a result value or final value or single value. There are a couple of:\n- Assignment\
    \ Expressions\n- Arithmetic Expressions\n- Comparison Expressions\n\nWe will look\
    \ at Logical Expressions in this topic. Expressions use Operators to check if\
    \ the condition is true or false based on many conditions.\n\n![](rsrc31R.jpg)\
    \ `&&` checks left side and right side and decides if the condition is true or\
    \ false. Logical Operators are:\n`&&` – AND\n`||` – OR\n`!` – NOT\n\n```php\n\
    (5 > 3) // true\n(8 < 5) // false\ntrue && false // false\n```\n\n**Order of Precedence:**\n\
    Order of precedence decides which operates first. `NOT` then `AND` then `OR`.\n\
    \n#### Sample Example\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"\
    utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <meta name=\"description\" content=\"Page Description\">\n    <title>Logical\
    \ Expressions</title>\n</head>\n<body>\n    <h1>Logical Expressions</h1>\n   \
    \ <?php\n    $input1 = 10;\n    $input2 = 20;\n    $result = ($input1 < $input2)\
    \ || ($input1 == $input2);\n    echo $input1 . \" <= \" . $input2 . \" is \" .\
    \ $result;\n    ?>\n</body>\n</html>\n```\n"
