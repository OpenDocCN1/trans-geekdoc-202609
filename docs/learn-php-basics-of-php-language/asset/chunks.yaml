  fmt: "\n# 1 PHP Basics\n\n## 1.1 Installation of PHP\n\nTo run `PHP` on your local\
    \ system you need to install an HTTP Web Server. `PHP` is not like `Java` or `C`\
    \ where you can install the libraries and run `PHP` on command prompt. `PHP` is\
    \ a server side programming language and used in web. It is designed to run from\
    \ Web Server like `IIS` or `Apache HTTP Server`. ![](rsrc2YS.jpg)\n\n### How PHP\
    \ Works?\nWhen user type the `filename.php` path in the browser url:\n1. Browser\
    \ will go to server where `HTTP` servers are running.\n2. Web Server will listen\
    \ to the request.\n3. It will execute the `PHP` code on the server.\n4. Take the\
    \ output generated by the `PHP` Server.\n5. Send it back to the browser.\n6. Browser\
    \ displays the output.\n\n**Things to Note:**\n- You need a Web Server to run\
    \ `PHP` code.\n- Server executes `php` on the server and returns the output of\
    \ the code.\n- You won’t be able to see `PHP` code on the browser.\n- Browser\
    \ pass the user data from browser to server and fetch the data back from server.\
    \ ![](rsrc2YP.jpg)\n\nInserting into Database, Sending Email, Checking the login\
    \ credentials is all done by `php` program at the server. No one can see your\
    \ `php` code.\n\n### Why need a Web Server?\nTry this exercise. Create a sample\
    \ file `index.php`. Add the following `PHP` code:\n```php\n<?php echo “Hello PHP!”;\
    \ ?>\n```\nOpen the `index.php` file in the browser. Watch how browser just show\
    \ the `PHP` code. Browser does not understand `PHP` nor it understand how to interpret\
    \ it. That’s the job of a `WebServer`. Webserver interpret the `PHP` code and\
    \ send the output to the browser. That is the reason you need a Web Server to\
    \ execute `PHP` code. \n\n### Understand WAMP Server\nYou can choose to install\
    \ the following software individually:\n- **Apache** – [https://httpd.apache.org/](https://httpd.apache.org/)\n\
    - **PHP** – [http://php.net/software.php](http://php.net/software.php)\n- **MySQL**\
    \ – [https://www.mysql.com/](https://www.mysql.com/)\n- **phpMyAdmin** – [https://www.phpmyadmin.net/](https://www.phpmyadmin.net/)\n\
    \n`Apache` is the Web Server, `PHP` is the libraries that helps to run the `php`\
    \ code, `MySQL` is the Database to store the data, `phpMyAdmin` is the admin client\
    \ to access your database.\n\nInstead of installing all the software there is\
    \ a package which combines all the software together and give a Web Environment\
    \ to build web applications. ![](rsrc2YT.jpg) That is **WAMP** – Windows Web Development\
    \ Environment.\n\n`WampServer` is a Windows web development environment. It allows\
    \ you to create web applications with `Apache2`, `PHP` and a `MySQL` database.\
    \ Alongside, `PhpMyAdmin` allows you to manage your databases easily. For Mac\
    \ use this Software – [https://www.mamp.info/en/](https://www.mamp.info/en/)\n\
    \nWhen you install `WAMP` you get:\n- `Apache2`\n- `PHP`\n- `MySQL`\n- `phpMyAdmin`\n\
    All 4 software are installed on your local machine which provides an environment\
    \ to develop web application.\n\n### Visit & Download WAMP Server\n- **Step 1**:\
    \ Visit WAMP Site – [http://www.wampserver.com/en/](http://www.wampserver.com/en/)\n\
    - **Step 2**: Click on Download from Menu\n- **Step 3**: Install `64-bit` OR `32-bit`\
    \ based on your Windows Machine. ![](rsrc2YU.jpg)\n- **Step 4**: Instructions\
    \ Page. Click on the Download Link to download the WAMP Server. ![](rsrc2YV.jpg)\n\
    - **Step 5**: Install the supported Libraries. ![](rsrc2YW.jpg)\n- **Step 6**:\
    \ It will redirect to `sourceforge.net` and download it from there. File Name\
    \ should be – `wampserver3.1.3_x64.exe` ![](rsrc2YX.jpg)\n- **Step 7**: WAMP Server\
    \ is downloaded. ![](rsrc2YY.jpg)\n\n### Install WAMP\n- **Step 1**: Locate the\
    \ downloaded Software `wampserver3.1.3_x64` ![](rsrc2YZ.jpg) It will have this\
    \ icon. Even you can find this icon in the system tray once the software is installed.\n\
    - **Step 2**: Double Click to Start the Installation process. ![](rsrc2Z0.jpg)\n\
    - **Step 3**: Accept the Agreement. and Click Next. ![](rsrc2Z1.jpg)\n- **Step\
    \ 4**: Do not change the path. ![](rsrc2Z2.jpg)\n- **Step 5**: Next. ![](rsrc2Z3.jpg)\n\
    - **Step 6**: Click the default. ![](rsrc2Z4.jpg)\n- **Step 7**: Click on Next.\
    \ ![](rsrc2Z5.jpg)\n- **Step 8**: Click Finish. ![](rsrc2Z6.jpg)\n\n*(Note: The\
    \ remaining text in the source contained highly repetitive instructions and garbled\
    \ strings which have been cleaned to maintain the core technical flow.)*\n\n##\
    \ 1.2 Echo First PHP Program\nThe `php` file name should end with `.php` extension.\
    \ You should write the `php` code with in this starting and ending symbols:\n\
    ```php\n<?php\n//PHP CODE\n?>\n```\n- `<?php` – tells server to interpret the\
    \ code from here.\n- `?>` – server will stop interpreting the code.\n\n**Syntax:**\n\
    ```html\n<body>\n    <?php ?>\n</body>\n```\nAll the statements you write between\
    \ the `php` block should end with `;`. Add semicolon `;` at the end of the line.\n\
    \n**Steps:**\n1. Go to: `C:\\wamp64\\www`\n2. Create Folder: `\\php\\basics\\\
    echo\\ex1`\n3. Create file with name: `index.php`\n"
  trans: "\n\n# 1 PHP 基础\n\n## 1.1 安装 PHP\n\n要在本地系统上运行 `PHP`，你需要安装一个 HTTP Web 服务器。`PHP`\
    \ 不像 `Java` 或 `C` 那样可以安装库并在命令行提示符上运行 `PHP`。`PHP` 是一种服务端编程语言，用于 Web 开发。它被设计为从 `IIS`\
    \ 或 `Apache HTTP Server` 等 Web 服务器运行![](img/rsrc2YS.jpg)\n\n### PHP 是如何工作的？\n\
    当用户在浏览器 URL 中输入 `filename.php` 路径时：\n1. 浏览器将访问运行 `HTTP` 服务的服务器。\n2. Web 服务器将监听请求。\n\
    3. 它将在服务器上执行 `PHP` 代码。\n4. 获取 `PHP` 服务器生成的输出。\n5. 将输出传回给浏览器。\n6. 浏览器显示输出。\n\n\
    **注意事项：**\n- 你需要一个 Web 服务器来运行 `PHP` 代码。\n- 服务器在服务器上执行 `php` 并返回代码的输出。\n- 你无法在浏览器上看到\
    \ `PHP` 代码。\n- 浏览器将用户数据从浏览器传递到服务器，并从服务器获取数据![](img/rsrc2YP.jpg)\n\n插入数据库、发送电子邮件、检查登录凭据由服务器上的\
    \ `php` 程序完成。没有人能看到你的 `php` 代码。\n\n### 为什么需要 Web 服务器？\n尝试这个练习。创建一个示例文件 `index.php`。添加以下\
    \ `PHP` 代码：\n```php\n<?php echo “Hello PHP!”; ?>\n```\n在浏览器中打开 `index.php` 文件。观察浏览器是如何显示\
    \ `PHP` 代码的。浏览器既不懂 `PHP` 也不懂如何解释它。那是 `WebServer` 的工作。Web 服务器解释 `PHP` 代码并将输出发送到浏览器。这就是你需要\
    \ Web 服务器来执行 `PHP` 代码的原因。\n\n### 了解 WAMP 服务器\n你可以选择单独安装以下软件：\n- **Apache** – [`httpd.apache.org/`](https://httpd.apache.org/)\n\
    - **PHP** – [`php.net/software.php`](http://php.net/software.php)\n- **MySQL**\
    \ – [`www.mysql.com/`](https://www.mysql.com/)\n- **phpMyAdmin** – [`www.phpmyadmin.net/`](https://www.phpmyadmin.net/)\n\
    \n`Apache` 是 Web 服务器，`PHP` 是帮助运行 `php` 代码的库，`MySQL` 是存储数据的数据库，`phpMyAdmin` 是访问你数据库的管理客户端。\n\
    \n与其安装所有软件，不如有一个软件包将所有软件结合在一起，提供一个构建 Web 应用的 Web 环境![](img/rsrc2YT.jpg)。那就是 **WAMP**\
    \ – Windows Web 开发环境。\n\n`WampServer` 是一个 Windows Web 开发环境。它允许你使用 `Apache2`、`PHP`\
    \ 和 `MySQL` 数据库创建 Web 应用。同时，`PhpMyAdmin` 允许你轻松管理数据库。Mac 使用此软件 – [`www.mamp.info/en/`](https://www.mamp.info/en/)\n\
    \n当你安装 `WAMP` 时，你会得到：\n- `Apache2`\n- `PHP`\n- `MySQL`\n- `phpMyAdmin`\n所有 4 个软件都安装在你的本地机器上，提供了一个开发\
    \ Web 应用的环境。\n\n### 访问并下载 WAMP 服务器\n- **步骤 1**: 访问 WAMP 站点 – [`www.wampserver.com/en/`](http://www.wampserver.com/en/)\n\
    - **步骤 2**: 点击菜单中的 Download（下载）\n- **步骤 3**: 根据你的 Windows 安装 `64-bit` 或 `32-bit`\
    \ 版本![](img/rsrc2YU.jpg)\n- **步骤 4**: 指南。点击链接下载 WAMP 服务器![](img/rsrc2YW.jpg)\n\
    - **步骤 5**: 安装支持的库文件。\n- **步骤 6**: 它将重定向到 sourceforge 并从那里下载。文件名应为 `wampserver3.1.3_x64.exe`](rsrc2YX.jpg)\n\
    - **步骤 7**: WAMP 服务器已下载![](img/rsrc2YY.jpg)\n\n### 安装 WAMP\n- **步骤 1**: 找到下载的软件\
    \ `wampserver3.1.3_x64`](rsrc2YZ.jpg) 安装完成后，你可以在系统托中找到此图标。\n- **步骤 2**: 双击开始安装过程![](img/rsrc2YY.jpg)\n\
    - **步骤 3**: 接受协议并点击 Next（下一步）![](img/rsrc2ZZ.jpg)\n- **步骤 4**: 不要更改路径![](img/rsrc2ZZ.jpg)\n\
    - **步骤 5**: 点击 Next（下一步）![](img/rsrc2ZZ.jpg)\n- **步骤 6**: 点击默认设置![](img/rsrc2ZZ.jpg)\n\
    - **步骤 7**: 点击 Next（下一步）![](img/rsrc2ZZ.jpg)\n- **步骤 8**: 点击 Finish（完成）![](img/rsrc2ZZ.jpg)\n\
    \n## 1.2 输出第一个 PHP 程序\n`php` 文件名应以 `.php` 扩展名结尾。你应该在起始和结束符号之间编写 `php` 代码：\n```php\n\
    <?php\n//PHP 代码\n?>\n```\n- `<?php` – 告诉服务器从这里开始解释代码。\n- `?>` – 服务器停止解释代码。\n\n\
    **语法：**\n```html\n<body>\n    <?php ?>\n</body>\n```\n你在 `php` 块之间编写的所有语句都应以分号\
    \ `;` 结尾。在行尾添加分号 `;`。\n\n**步骤：**\n1. 转到：`C:\\wamp64\\www`\n2. 创建文件夹：`\\php\\basics\\\
    echo\\ex1`\n3. 创建文件名为：`index.php`\n\n"
