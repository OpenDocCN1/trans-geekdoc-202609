- raw: "1 PHP Basics 1.1      Installation of PHP Installation of PHP To run PHP on\
    \ your local system you need to install HTTP Web Server. PHP is not like Java\
    \ or C where you can install the libraries and run PHP on command prompt. PHP\
    \ is a server side programming and used in web. It is designed to run from Web\
    \ Server like IIS or Apache HTTP Server. ![](rsrc2YS.jpg)How PHP Works? When user\
    \ type the filename.php path in the browser url: Browser will go to server where\
    \ HTTP servers are running. Web Server will listen to the request. It will execute\
    \ the PHP code on the server. Take the output generated by the PHP Server. Send\
    \ it back to the browser. Browser displays the output. Things to Note: You need\
    \ a Web Server to run PHP code. Server executes php on the server and returns\
    \ the output of the code. You won’t be able to see PHP code on the browser. Browser\
    \ pass the user data from browser to server and fetch the data back from server.\
    \ ![](rsrc2YP.jpg)Inserting into Database, Sending Email, Checking the login credentials\
    \ is all done by php program at the server. No one can see your php code. Why\
    \ need a Web Server? Try this exercise. Create a sample file name index.php Add\
    \ the following PHP code. <?php echo “Hello PHP!”; ?> Open the index.php file\
    \ in the browser. Watch how browser just show the PHP code. Browser does not understand\
    \ PHP nor it understand how to interpret it. That’s the job of a WebServer. Webserver\
    \ interpret the PHP code and send the output to the browser. That is the reason\
    \ you need a Web Server to execute PHP code. Understand WAMP Server You can choose\
    \ install the following software individually: Apache – [https://httpd.apache.org/](https://httpd.apache.org/)\
    \ PHP – [http://php.net/software.php](http://php.net/software.php) MySQL – [https://www.mysql.com/](https://www.mysql.com/)\
    \ phpMyAdmin – [https://www.phpmyadmin.net/](https://www.phpmyadmin.net/) Apach\
    \ e  is the Web Server PH P  is the libraries that helps to run the php code MySQ\
    \ L  is the Database to store the data. phpMyAdmi n  is the admin client to access\
    \ your database. Instead of installing all the software there is a package which\
    \ combines all the software together and give a Web Environment to build web applications.\
    \ ![](rsrc2YT.jpg)That is WAMP. – Windows Web Development Environment WampServer\
    \ is a Windows web development environment. It allows you to create web applications\
    \ with Apache2, PHP and a MySQL database. Alongside, PhpMyAdmin allows you to\
    \ manage easily your databases. For Mac use this Software – [https://www.mamp.info/en/](https://www.mamp.info/en/)\
    \ When you install WAMP you get: Apache2 PHP MySQL phpMyAdmin All 4 software are\
    \ installed on your local machine which provides an environment to develop web\
    \ application. Visit & Download WAMP Server Step 1 : Visit WAMP Site – [http://www.wampserver.com/en/](http://www.wampserver.com/en/)\
    \ Step 2 :  Click on Download from Menu Step 3 : Install 64-bi t OR 32- bi t based\
    \ on your Windows Machine. ![](rsrc2YU.jpg)Step 4:   Instructions Page. Click\
    \ on the Download Link to download the WAMP Server. ![](rsrc2YV.jpg)Step 5:  \
    \ Install the supported Libraries. ![](rsrc2YW.jpg)Step 6 :  It will redirect\
    \ to sourceforge.net and download it from there. File Name should be –  wampserver3.1.3\\\
    _x64.exe ![](rsrc2YX.jpg)Step 7 :  WAMP Server is downloaded. ![](rsrc2YY.jpg)Install\
    \ WAMP Step 1 :  Locate the downloaded Software “wampserver3.1.3\\_x64” ![](rsrc2YZ.jpg)It\
    \ will have this icon. Even you can find this icon in the       system tray once\
    \ the software is installed. Step 2 :  Double Click to Start the Installation\
    \ process. ![](rsrc2Z0.jpg)Step 3 :  Accept the Agreement. and Click Next. ![](rsrc2Z1.jpg)Step\
    \ 4 :  Do not change the default path. It will be installed in C:\\\\WAMP64 ![](rsrc2Z2.jpg)Step\
    \ 5 : Click Next ![](rsrc2Z3.jpg)Step 6:   Verify the path where the software\
    \ is installed and click on Install. ![](rsrc2Z4.jpg)Step 7:   Close all the Browsers\
    \ and Select the Default Browser. ![](rsrc2Z5.jpg)Step 7:   Select the Notepad\
    \ ![](rsrc2Z6.jpg)![](rsrc2Z7.jpg)Step 8:    Click Finish and Note the Software\
    \ Versions. ![](rsrc2Z8.jpg)Install Microsoft VC Checker Next Step is to check\
    \ if the Microsoft VC++ Package is missing from windows system. Step 1 :  Download\
    \ the VC Checker Software. [http://wampserver.aviatechno.net/files/tools/check\\\
    _vcredist.exe](http://wampserver.aviatechno.net/files/tools/check_vcredist.exe)\
    \ Step 2: It will download the check\\_vcredist.ex e software Step 3: Install\
    \ check\\_vcredist.ex e software. ![](rsrc2Z9.jpg)Step 4:   Click on Check ![](rsrc2ZA.jpg)Step\
    \ 5:   Install the VC and then Run Again to make sure you all the supported Libraries.\
    \ ![](rsrc2ZB.jpg)Download from here: [https://support.microsoft.com/en-us/help/2977003/the-latest-supported-visual-c-downloads](https://support.microsoft.com/en-us/help/2977003/the-latest-supported-visual-c-downloads)\
    \ Verify WAMP WAMP Server is installed in “C:\\\\wamp64” folder. Step 1 :  Run\
    \ the WAMP Server Run the file: C:\\\\wamp64\\\\wampmanager.exe Goto C:\\\\wamp64\
    \ folder and run the  \n\nWAMP Server – wampmanager.exe See the Server running\
    \ with GREEN color icon in the system tray. ![](rsrc2ZC.jpg)Click on the ICON\
    \ and you should see this menu. ![](rsrc2ZD.jpg)Step 2 :  Click on Localhost on\
    \ the Menu Browser will open the URL – localhost You should see this page. ![](rsrc2ZE.jpg)This\
    \ confirms that WAMP server is installed properly. Step 3 :  Recheck if you have\
    \ the following things working: WAMP Icon in Green color in system tray Click\
    \ on Localhost in the WAMP menu WAMP displays the localhost page correctly. Stop\
    \ WAMP Step 1 :  Click on the System Tray WAMP Icon and Select Stop Services.\
    \ ![](rsrc2ZF.jpg)Step 2 :  WAMP Icon Turns to RED. ![](rsrc2ZG.jpg)Step 3 :  Type\
    \ “localhost” in the Browser URL This should show error page in chrome. ![](rsrc2ZH.jpg)This\
    \ confirms that WAMP Server is Stopped. Start WAMP Step 1 : Click on the System\
    \ Tray WAMP Icon and Select Star Services. ![](rsrc2ZJ.jpg)Step 2 : WAMP Icon\
    \ Turns to GREEN ![](rsrc2ZK.jpg)Step 3: Type “localhost” in the Browser URL This\
    \ should show the home page for localhost ![](rsrc2ZM.jpg)Check WAMP Version Open\
    \ the WAMP Menu from System Tray and you can find the WAMP Version. ![](rsrc2ZN.jpg)Verify\
    \ the WAMP Folder You should have this two folders in C:\\\\ C:\\\\wamp64 C:\\\
