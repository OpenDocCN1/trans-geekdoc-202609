    \ <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
    \    <meta name=\"description\" content=\"Page Description\">\n    <title>For\
    \ Statements</title>\n</head>\n<body>\n    <h1>For Statements</h1>\n    <?php\n\
    \        for($counter=0; $counter<=10; $counter++){\n            echo \"For Counter:\
    \ \" . $counter . \"<br>\" ;\n        }\n    ?>\n</body>\n</html>\n```\n\n---\n\
    \n## Exercise 1\n![](rsrc325.jpg)[Live Preview](https://phpbootcampdemo.com/php/statements-php/for/em1/after)\
    \ Exercise 1 [Download the Exercise 1](https://phpbootcampdemo.com/php/statements-php/for/downloads/php-statements-php-for-ex1.zip)\n\
    \nExercise 1: Define two constant number with default value and print all the\
    \ numbers between them. Print only maximum of 10 numbers. `break;` – is a keyword\
    \ that can be used in the loop to break from the loop. `continue;` – is a keyword\
    \ that can be used in the loop to continue the loop by skipping the below statements.\n\
    \n## Exercise 2\n![](rsrc326.jpg)[Live Preview](https://phpbootcampdemo.com/php/statements-php/for/ex1/after)\
    \ Exercise 2 [Download the Exercise 2](https://phpbootcampdemo.com/php/statements-php/for/downloads/php-statements-php-for-ex2.zip)\n\
    \nExercise 2: Define two constant with default value and print EVEN numbers only\
    \ between them. Print only maximum of 10 numbers. Use the Loop like this:\n![](rsrc327.jpg)![](rsrc328.jpg)[Live\
    \ Preview](https://phpbootcampdemo.com/php/statements-php/for/ex2/after)rsrc32YP.jpg)![](rsrc329.jpg)\n\
    \n## General\n### 5.1 Exceptions\n### Usage of Try Catch Blocks\nThere are 3 types\
    \ of error you can find in PHP:\n1. **Syntax Errors**: is where you forgot to\
    \ follow the rules of PHP. It will cause error when you execute the program.\n\
    2. **Runtime Errors**: could be when it is running the program the PHP interpreter\
    \ could not understand how to proceed and throws and error.\n3. **Logic Errors**:\
    \ are logically error that are cause because the program instructions are not\
    \ logically correct.\n\nExceptions in programming are referred as Runtime Errors.\
    \ When Runtime Errors happens there is a way to catch those errors and pass it\
    \ to the application and make a clean exit from the program. This is called as\
    \ Exception Handling. The process of making sure the code will not break and if\
    \ it does it know the reason for it and make a clean exit.\n\nTo handle Runtime\
    \ errors in the PHP we have `try-catch` blocks. Using this we can catch the errors\
    \ and decide what to do next.\n\nSYNTAX:\n```php\ntry{ //Statements }\ncatch(Exception\
    \ $exceptionObj) { //Statments }\n```\n\nExample:\n```php\ntry {\n    $firstName\
    \ = \"\";\n    if( $firstName == \"\") throw new Exception(\"Name is empty\");\n\
    } catch (Exception $e){\n    echo \"Message: \" . $e->getMessage();\n} finally\
    \ {\n    echo \"This is from the Finally Block\";\n}\n```\n\n- `try {}` block:\
    \ will have all the statements through.\n- `throw`: is a keyword to throw an error\
    \ from the program. Once the program throw an error it will stop processing the\
    \ next steps. It will jump to `catch {}` block.\n- `catch {}` block: will be executed\
    \ once the `throw` is called. The program will execute out from the catch block\
    \ safely.\n- `finally{}` block: will execute every time irrespective of error\
    \ or not. It is good place to close all open connections. Handle clean exit.\n\
    \n![](rsrc32A.jpg)[Download the Example](https://phpbootcampdemo.com/php/general-php/exceptions/downloads/php-general-php-exceptions-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n   \
    \ <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
    \    <meta name=\"description\" content=\"Page Description\">\n    <title>Exceptions</title>\n\
    </head>\n<body>\n    <h1>Exceptions</h1>\n    <?php\n        try{\n          \
    \  throw new Exception(\"Error in the try block!\");\n        } catch(Exception\
    \ $e){\n            echo \"Exception: \". $e ->getMessage();\n        } finally{\n\
    \            echo \"<br> This is from the Finally Block!\";\n        }\n    ?>\n\
    </body>\n</html>\n```\n---\n"
  trans: "\n## 练习 1\n![](img/rsrc322.jpg)[实时预览](https://phpbootcampdemo.com/php/statements-php/while/em1/after)\
    \ 练习 1 [下载练习 1](https://phpbootcampdemo.com/php/statements-php/while-ex1.zip)\n\
    \n练习 1：定义常量 `INPUT1` 和 `INPUT2` 并打印它们之间的所有数字。最多打印 10 个数字。`break;` 是一个可以在循环中使用跳出循环的关键字。`continue;`\
    \ 是一个可以在循环中使用跳过以下语句并继续循环的关键字。\n\n提示：\n```php\nif(counter >= 10){\n    break;\n\
    }\n```\n\n## 练习 2\n![](img/rsrc323.jpg)[实时预览](https://phpbootcampdemo.com/php/statements-php/while/ex1/after)\
    \ 练习 2 [下载练习 2](https://phpbootcampdemo.com/php/statements-php/while-ex2.zip)\n\
    \n练习 2：定义两个带有默认值的常 ANT，并仅打印它们之间的偶数。最多打印 10 个数字。\n\n## 4.4 For 语句\n### For 循环的使用\n\
    `For Loop` 用于循环一段代码，直到满足条件。在条件满足前运行相同的代码块。\n\n语法：`for( 初始化; 条件; 增量 ) { //语句 }`\n\
    \n示例 1：\n```php\nfor($counter = 0; $counter <= 10; $counter++){ \n    echo $counter;\
    \ \n}\n```\n示例 2：\n```php\nfor($counter = 0, $input1 = 10; $counter <= 10; $counter++,\
    \ $input1++){ \n    echo $input1; \n}\n```\n[下载示例](https://phpbootcampdemo.com/php/statements-php/for/downloads/php-statements-php-for-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n   \
    \ <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
    \    <meta name=\"description\" content=\"页面描述\">\n    <title>For 语句</title>\n\
    </head>\n<body>\n    <h1>For 语句</h1>\n    <?php\n        for($counter=0; $counter<=10;\
    \ $counter++){\n            echo \"计数: \" . $counter . \"<br>\" ;\n        }\n\
    \    ?>\n</body>\n</html>\n```\n\n---\n\n## 练习 1\n![](img/rsrc325.jpg)[实时预览](https://phpbootcampdemo.com/php/statements-php/for/em1/after)\
    \ 练习 1 [下载练习 1](https://phpbootcampdemo.com/php/statements-php/for/downloads/php-statements-php-for-ex1.zip)\n\
    \n练习 1：定义两个带有默认值的常量，并打印它们之间的所有数字。最多打印 10 个数字。`break;` 是一个可以在循环中使用跳出循环的关键字。`continue;`\
    \ 是一个可以在循环中使用跳过以下语句并继续循环的关键字。\n\n## 练习 2\n![](img/rsrc326.jpg)[实时预览](https://phpbootcampdemo.com/php/statements-php/for/ex1/after)\
    \ 练习 2 [下载练习 2](https://phpbootcampdemo.com/php/statements-php/for/downloads/php-statements-php-for-ex2.zip)\n\
    \n练习 2：定义两个带有默认值的常量，并仅打印它们之间的偶数。最多打印 10 个数字。像所示使用循环：\n![](img/rsrc327.jpg)[](rsrc328.jpg)[实时预览](https://phpbootcampdemo.com/php/statements-php/for/ex2/after)rsrc32YP.jpg)[](rsrc329.jpg)\n\
    \n## 通用\n### 5.1 异常\n### Try Catch 块的使用\n在 PHP 中你可以找到 3 种错误：\n1. **语法错误**：是你忘记了遵循\
    \ PHP 的规则。在执行程序时会导致错误。\n2. **运行时错误**：可能是当程序在运行时，PHP 解释器无法理解如何继续并抛出错误。\n3. **逻辑错误**：由于程序指令在逻辑上不正确而导致的逻辑错误。\n\
    \n编程中的异常被称为运行时错误。当发生运行时错误时，有一种方法可以捕获这些错误并将其传递给应用程序，让程序干净退出。这被称为异常处理。\n\n为了处理 PHP\
    \ 中的运行时错误，我们有 `try-catch` 块。使用这些我们可以捕获错误并决定下一步做什么。\n\n语法：\n```php\ntry{ //语句 }\n\
    catch(Exception $exceptionObj) { //语句 }\n```\n\n示例：\n```php\ntry {\n    $firstName\
    \ = \"\";\n    if($firstName == \"\") throw new Exception(\"名字为空\");\n} catch\
    \ (Exception $e){\n    echo \"消息: \" . $e->getMessage();\n} finally {\n    echo\
    \ \"来自 Finally Block\";\n}\n```\n\n- `try {}` 块：包含所有语句。\n- `throw`：是一个从程序抛出错误的关键字。一旦程序抛出错误，它将停止处理后续步骤。它将跳转到\
    \ `catch {}` 块。\n- `catch {}` 块一旦调用 `throw` 就会执行。程序安全地从 catch 块执行。\n- `finally{}`\
    \ 块：无论是否出错都会执行。它是关闭所有连接的好地方。处理干净退出。\n\n![](img/rsrc32A.jpg)[下载示例](https://phpbootcampdemo.com/php/general-php/exceptions/downloads/php-general-php-exceptions-em1.zip)\n"
