    # 2 Data\n## 2.1 Variables\n## Usage of Variables\nVariables are used to store\
    \ information which are used inside the program. Variables in php are defined\
    \ with `$` sign in front of it. Here are the rules for defining Variables:\n-\
    \ Variable should start with `$` sign.\n- Letters, numbers and underscore is allowed\
    \ in the variable name.\n- After `$` it should not be a number. Example: `$123name`\
    \ is wrong.\n- Variables are case sensitive. `$message` and `$Message` are not.\n\
    - `$` is used to indicate it is a variable.\n- `=` is the assignment operator\
    \ used to assign the value to the variable.\n- `;` is used to end the assignment\
    \ statement.\n\nExamples of Variables:\n`$index = 0;`\n`$firstName = 'Freelancer';`\n\
    `$firstName = \"Freelancer\";`\n`$price = 10;`\n`$price = 10.50;`\n`$result =\
    \ true;`\n`$fullName = $firstName;`\n`$siteName = \"Freelancer\";`\n`echo \"This\
    \ is the $siteName for WordPress\";`\n`echo \"This is the site name\" . $siteName;`\n\
    \nYou can add the variables inside double quotes with the variable names. `.`\
    \ symbol can be used to add the variable to the strings.\n\n### Sample Example\
    \ [Download the Example](https://phpbootcampdemo.com/php/basics-php/variables/downloads/php-data-variables-em1.zip)\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta\
    \ name=\"description\" content=\"Page Description\">\n    <title>Variables</title>\n\
    \    <?php\n        //Declaring & Initalizing a Variable\n        $message = \"\
    \";\n        //Assigning value to the Variables\n        $message = \"Say Hello\
    \ to Variables!\";\n        //Displaying the Variables via the Javascript\n  \
    \      echo \"<script>console.log('\" . $message . \"');</script>\";\n    ?>\n\
    </head>\n<body>\n    <h1>Variables</h1>\n    <?php\n        $counter = 100;\n\
    \        echo \"This is counter: $counter <br>\";\n        echo \"counter: \"\
    . $counter . \"<br>\";\n        echo 'This is the message - $message <br>';\n\
    \        echo \"This is the message - $message <br>\";\n    ?>\n</body>\n</html>\n\
    ```\n![](rsrc30D.jpg)[Live Preview](https://phpbootcampdemo.com/php/data-php/variables/em1/after)\n\
    \n## Exercise 1 [Download the Exercise 1](https://phpbootcampdemo.com/php/basics-php/variables/downloads/php-data-variables-ex1.zip)\n\
    **Exercise 1:** Define all the Variables and Initialize them in the head section\
