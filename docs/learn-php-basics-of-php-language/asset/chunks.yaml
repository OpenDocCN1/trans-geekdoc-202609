    \ the output on the browser.\n\n![](rsrc32H.jpg)[Live Preview](https://phpbootcampdemo.com/php/general-php/files/ex1/after)\n\
    \n### Exercise 2\n[Download the Exercise 2](https://phpbootcampdemo.com/php/general-php/files/downloads/php-general-php-files-ex2.zip)\n\
    Append some text to an existing file with `ab` mode. ![](rsrc32J.jpg)[Live Preview](https://phpbootcampdemo.com/php/general-php/files/ex2/after)\n\
    \n## 5.4 Includes & Requires\n\nUsage of Includes and Requires\nPHP allows to\
    \ break the code into small pieces of file and then include in the main page.\
    \ These are statements that can be used:\n- `include`\n- `include_once`\n- `require`\n\
    - `require_once`\n\n`include` and `require` both help to include the file into\
    \ another file. If the included file is not available then `include` statement\
    \ will ignore and continue to execute the other part of the code. if the included\
    \ file is not available then `require` statement will stop the execution of the\
    \ program. `require_once` or `include_once` will not import if the file is already\
    \ included.\n\n### Sample Example\n[Download the Example](https://phpbootcampdemo.com/php/general-php/includes/downloads/php-general-php-includes-em1.zip)\n\
    \nFile: index.php\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"\
    utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <meta name=\"description\" content=\"Page Description\">\n    <title>Includes</title>\n\
    </head>\n<body>\n    <h1>Includes</h1>\n    <?php\n        include 'functions.php';\n\
    \        echo add(1, 2);\n        require 'display.php';\n    ?>\n</body>\n</html>\n\
    ```\n\nFile: functions.php\n```php\n<?php\nfunction add($a, $b){\n    return $a\
    \ + $b;\n}\n?>\n```\n\nFile: display.php\n```php\n<?php\necho '<br><h1>This is\
    \ displayed from display.php</h1>';\n?>\n```\n* * *\n\n![](rsrc32K.jpg)[Live Preview](https://phpbootcampdemo.com/php/general-php/includes/em1/after)\n\
    \n### Exercise 1\n[Download the Exercise 1](https://phpbootcampdemo.com/php/general-php/includes/downloads/php-general-php-includes-ex1.zip)\n\
    Use the same code from above and delete the `display.php` and `functions.php`\
    \ in this exercise and see the error. Observe the Warning and Fatal Error. Warning\
    \ is coming from `include` and Fatal Error from `require`.![](rsrc32M.jpg)[Live\
    \ Preview](https://phpbootcampdemo.com/php/general-php/includes/ex1/after)\n\n\
    ### Exercise 2\n[Download the Exercise 2](https://phpbootcampdemo.com/php/general-php/includes/downloads/php-general-php-includes-ex2.zip)\n\
    Put all the HTML code in `index.html` and include that file in `index.php`.![](rsrc32N.jpg)[Live\
    \ Preview](https://phpbootcampdemo.com/php/general-php/includes/ex2/after)\n\n\
    ## 5.5 Libraries\n\nUsage of Libraries\nYou can create a library file and put\
    \ all the functions you commonly use in this library file. This is the common\
    \ practice for any web development where you break the main program into smaller\
    \ chunks of code and then include them in the main program. You can use `include`\
    \ statement to import this functions file in your page so that you can access\
    \ those functions.\n\n### Sample Example\n[Download the Example](https://phpbootcampdemo.com/php/general-php/libraries/downloads/php-general-php-libraries-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n   \
    \ <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
    \    <meta name=\"description\" content=\"Page Description\">\n    <title>Libraries</title>\n\
    </head>\n<body>\n    <h1>Libraries</h1>\n    <?php\n        include 'calculator.php';\n\
    \        define('INPUTVALUE1', 50);\n        define('INPUTVALUE2', 23);\n    \
    \    echo 'Calculator : '. INPUTVALUE1 . ' AND ' . INPUTVALUE2 . '<br>';\n   \
    \     echo 'Addition: '. add(INPUTVALUE1, INPUTVALUE2) . '<br>';\n        echo\
    \ 'Minus: '. minus(INPUTVALUE1, INPUTVALUE2) . '<br>';\n        echo 'Multiply:\
    \ '. multiply(INPUTVALUE1, INPUTVALUE2) . '<br>';\n    ?>\n</body>\n</html>\n\
    ```\n"
  trans: "\n\n![](img/rsrc32B.jpg)[实时预览](https://phpbootcampdemo.com/php/general-php/exceptions/em1/after)\
    \ 练习 1 [下载练习 1](https://phpbootcampdemo.com/php/general-php/exceptions/downloads/php-general-php-exceptions-ex1.zip)\n\
    \n### 练习 1\n定义一个常量数字，如果该数字不是整数则报错。提示：`if( !is_numeric(INPUTVALUE ) )` ![](img/rsrc32C.jpg)[实时预览](https://phpbootcampdemo.com/php/general-php/exceptions/ex1/after)\
    \ 练习 2 [下载练习 2](https://phpbootcampdemo.com/php/general-php/exceptions/downloads/php-general-php-exceptions-ex2.zip)\n\
    \n### 练习 2\n定义一个 1 到 100 之间的数字。在页面上显示以下消息：如果输入在 1 到 100 之间 —— 小于 100。如果输入大于 100\
    \ —— 大于 100。如果输入不是数字 —— 出错误 ![](img/rsrc32D.jpg)[实时预览](https://phpbootcampdemo.com/php/general-php/exceptions/ex2/after)\n\
    \n## 5.2 调试\n\n### 步骤 1：编写带有错误的 PHP 代码\n尝试以下错误：\n```php\n$inputValue = 10;\necho\
    \ inputValue;\necho \"This is a String\" + \"another String\";\n```\n[下载练习 1](https://phpbootcampdemo.com/php/general-php/debug/downloads/php-general-php-debug-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n   \
    \ <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
    \    <meta name=\"description\" content=\"Page Description\">\n    <title>Debugging</title>\n\
    </head>\n<body>\n    <h1>Debugging</h1>\n    <?php\n        $inputValue = 10;\n\
    \        echo inputValue;\n    ?>\n</body>\n</html>\n```\n![](img/rsrc32E.jpg)[实时预览\
    \ 1](https://phpbootcampdemo.com/php/general-php/debug/em1/after)\n\n### 练习 1\n\
    在 php 文件中添加 `Sum()` 方法但不创建该函数。这将导致程序失败。\n\n### 练习 2\n在 `sum()` 方法之前编写 `echo` 语句，并在\
    \ `sum()` 方法之后编写 `echo`。通过查看 `echo` 消息找到错误。\n\n### 步骤 2：使用 echo 进行调试\n你需要编写追踪日志。查看最后执行的\
    \ `echo` 是哪一个。\n\n## 5.3 文件\n\n用法\n你可以使用 PHP 库读取服务器上的文件。打开文件时使用的模式：\n- `rb` –\
    \ 以读模式打开文件。\n- `wb` – 创建新文件，如果文件已存在则覆盖它。\n- `ab` – 创建文件，如果文件已存在则追加数据。\n- `xb`\
    \ – 创建一个新文件，如果文件已存在则不创建。\n\n以下是打开和关闭文件的方法：\n- `fopen($path, $mode)`\n- `fclose($file)`\n\
    - `feof($file)` – 用于检查是否已到达文件末尾。\n\n向文件中读取和写入的方法：\n- `fread($file, $length)` –\
    \ length 用于指定要读取的字节数。\n- `fgets($file)` – 读取一行。\n- `fwrite($file, $data)` – 将\
    \ `$data` 值写入文件。\n\n### 示例\n[下载示例](https://phpbootcampdemo.com/php/general-php/files/downloads/php-general-php-files-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n   \
    \ <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
    \    <meta name=\"description\" content=\"Page Description\">\n    <title>Files</title>\n\
    </head>\n<body>\n    <h1>Files</h1>\n    <?php\n        // 创建一个本地文件并命名为 \"readme.txt\"\
    \n        /*\n        * 读取文件 - rb 模式\n        */\n        $file = fopen('readme.txt',\
    \ 'rb');\n        $line = \"\";\n        while(!feof($file) ){\n            $line\
    \ = fgets($file);\n            echo $line;\n        }\n        fclose($file);\n\
    \n        /*\n        * 写入文件 - wb 模式\n        */\n        $file = fopen(\"newfile.txt\"\
    , \"wb\");\n        fwrite($file, \"<br><h1>It is a long established fact that\
    \ readers will be distracted by the readable content of a page when looking at\
    \ its layout.</h1>\");\n        fclose($file);\n    ?>\n</body>\n</html>\n```\n\
    * * *\n\n![](img/rsrc32F.jpg)(rsrc32G.jpg)[实时预览](https://phpbootcampdemo.com/php/general-php/files/em1/after)\n\
    \n### 练习 1\n[下载练习 1](https://phpbootcampdemo.com/php/general-php/files/downloads/php-general-php-files-ex1.zip)\n\
    编写一个带有内容的 `newfile.txt` 文件并在浏览器中显示该文件![](img/rsrc32H.jpg)[实时预览](https://phpbootcampdemo.com/php/general-php/files/ex1/after)\n\
    \n### 练习 2\n[下载练习 2](https://bootbootcampdemo.com/php/general-php/files/downloads/php-general-php-files-ex2.zip)\n\
    使用 `ab` 模式向现有文件追加文本![](img/rsrc32J.jpg)[实时预览](https://phpbootcampdemo.com/php/general-php/files/ex2/after)\n\
    \n## 5.4 包含 (Includes)\n\n包含与要求的用法\nPHP 允许将代码拆分成部分。这些语句有：\n- `include`\n- `include_once`\n\
    - `require`\n- `require_once`\n\n`include` 和 `require` 帮助将代码拆分为文件。如果包含的文件不存在，`include`\
    \ 会忽略它而 `require` 会停止执行。\n\n### 示例\nindex.php\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n    <meta name=\"description\" content=\"Page Description\"\
    >\n    <title>Includes</title>\n</head>\n<body>\n    <h1>Includes</h1>\n    <?php\n\
    \        include 'functions.php';\n        echo add(1, 2);\n    ?>\n</body>\n\
    </html>\n```\n\nfunctions.php\n```php\n<?php\nfunction add($a, $b){\n    return\
    \ $a + $b;\n}\n?>\n```\n\ndisplay.php\n```php\n<?php\necho '<br><h1>This is included</h1>';\n\
    ?>\n```\n* * *\n\n### 练习 1\n[下载练习 1](https://phpbootcampdemo.com/php/general-php/includes/downloads/php-general-php-includes-em1.zip)\n\
    使用上面的代码并删除 `display.php` 和 `functions.php`。观察错误。警告来自 `include`，致命错误来自 `require`![](img/rsrc32K.jpg)[实时预览](https://phpbootcampdemo.com/php/general-php/includes/em1/after)\n\
    \n### 练习 2\n[下载练习 2](https://phpbootcampdemo.com/php/general-php/includes/downloads/php-general-php-includes-ex2.zip)\n\
    在 `index.html` 中放入 HTML 代码并在 `index.php` 中包含该文件![](img/rsrc32L.jpg)[实时预览](https://phpbootcampdemo.com/php/general-php/includes/ex2/after)\n\
    \n"
