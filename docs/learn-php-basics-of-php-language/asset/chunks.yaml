    \n# 1.4 Comments\n## Usage of Comments\nYou can use the special notation to comment\
    \ the code inside the php. Comments helps to document the code with a single or\
    \ multiple line. Comments are ignored by the Web Server and is not displayed and\
    \ not sent to the browser. You will not see comments in the final HTML output.\n\
    \nThere are two types of Comments in PHP:\n- **Single Line Comments**: `//` is\
    \ Single Line Comments. Use to comment one line. `#` is Single Line Comments.\
    \ Use to comment one line.\n- **Multi Line Comments**: `/*` is used to indicate\
    \ the comments are starting. `*/` is used to indicate the comments are ended.\
    \ Anything between `/*` and `*/` will not be executed by the server. Browser will\
    \ never see comments because it is ignored by the server.\n\nSYN:\n```php\n<body>\n\
    <?php \n// This is a Single Line Comments\n# This is also a Single Line Comments\n\
    /*\nThis is a multi line comments which cannot see on the browser\ncan go many\
    \ lines.\n*/\n?>\n</body>\n```\n### Sample Example [Download the Example](https://phpbootcampdemo.com/php/basics-php/comments/downloads/php-comments-em1.zip)\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta\
    \ name=\"description\" content=\"Learning PHP\">\n    <title>Comments PHP</title>\n\
    </head>\n<body>\n    <?php\n        //This is Single Line Comments\n        #\
    \ This is also a Single Line Comments\n        /*\n        This is a multi line\
    \ comments\n        can go many lines.\n        */\n    ?>\n</body>\n</html>\n\
    ```\n![](rsrc305.jpg)[Live Preview](https://phpbootcampdemo.com/php/basics-php/comments/em1/after)\n\
