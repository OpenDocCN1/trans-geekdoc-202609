    \n## 2.3 Numbers\n### Usage of Numbers\nNumbers can also be called as `Integers`.\
    \ Integers are positive or negative numbers. Floating number is represented with\
    \ number separated with “.” as decimals. So, there are two types of numbers in\
    \ PHP:\n1. `Integers`: 100, -200\n2. `Floating Point`: 10.34\n\nNumbers are not\
    \ wrapped with quotes or they do not include “,”. You can append the – (minus)\
    \ symbol in front of the number to indicate it is negative number. Most common\
    \ methods used with `Integer`:\n- `round()` – This will round the decimals.\n\
    - `intval()` – This will convert string integer to integer.\n\nExamples:\n`$price\
    \ = 10;`\n`$total = 10.20;`\n\n### Sample Example\n[Download the Example](https://phpbootcampdemo.com/php/data-php/numbers/downloads/php-data-php-numbers-em1.zip)\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta\
