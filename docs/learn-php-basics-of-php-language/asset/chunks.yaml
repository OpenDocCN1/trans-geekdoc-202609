    ![](rsrc30B.jpg)2             Data Basics 2.1      Variables Usage of Variables
    Variables are used to store information which are used inside the program. Variables
    in php are defined with dollar ($) sign in front of it. ![](rsrc30C.jpg)Here are
    the rules for defining the Variables: Variable should start with dollar($) sign.
    Example : $message. Letters, numbers and underscore is allowed inthe variable
    name. After $ it should not be a number. Example: $123name is wrong. Variables
    are case sensitive. $message and $Message are not same. Examples of Variables:
    $index = 0; $firstName = ‘WPFreelancer’; $firstName = “WPFreelancer”; $price =
    10; $price = 10.50; $result = true; $fullName = $firstName; $   is used to indicate
    it is a variable. \=   is the assignment operator used to assign the value to
    the variable. ; semicolo r  is used to end the assignment statement. Showing variable
    with echo $siteName = “WPFreelancer”; echo “This is the $siteName for WordPress”;
    echo “This is the site name” . $siteName; You can add the variables inside the
      double quotes onl y  with the variable names. “.” DOT symbol can be used to
    add the variable to the strings. Sample Example [Download the Example](https://phpbootcampdemo.com/php/data-php/variables/downloads/php-data-php-variables-em1.zip)
