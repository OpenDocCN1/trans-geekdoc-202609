    \n## 6.4 Session\nSessions 的用法\nSessions 是存储在服务器端的一个数组。Sessions id 在用户首次访问网站时生成。Sessions\
    \ 存储在浏览器中。默认情况下，PHP 使用 cookie 来维护活动会。每当用户发送请求时，浏览器都会将 cookie 传递给服务器。\n\n```php\n\
    session_start();\n$_SESSION[\"firstname\"] = \"WPFreelancer\";\nif(isset($_SESSION[\"\
