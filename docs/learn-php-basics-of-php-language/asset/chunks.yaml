    <body>\n    <h1>赋值表达式</h1>\n    <?php\n        $firstName = \"WP\";\n        $lastName\
    \ = \"Freelancer\";\n        $fullName = $firstName . \", \" . $lastName;\n  \
    \      echo \"Name $fullName <br>\";\n        $counter = 10;\n        echo \"\
    Counter: $counter <br>\";\n        $counter += $counter;\n        echo \"Counter+=:\
    \ $counter <br>\";\n        $counter -= 10;\n        echo \"Counter-=: $counter\
    \ <br>\";\n    ?>\n</body>\n</html>\n```\n\n"
