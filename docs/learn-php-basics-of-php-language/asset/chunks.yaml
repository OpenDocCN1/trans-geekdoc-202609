    \n## 2.3 数字\n### 数字的用法\n数字也可以称为 `Integers`（整数）。整数是正数或负数。浮点数用用“.”分隔的小数来表示。因此，PHP\
    \ 中有两种类型的数字：\n1. `Integers`（整数）：100, -200\n2. `Floating Point`（浮点数）：10.34\n\n\
    数字不带引号包裹，也不包含“，”。你可以在数字前加上 –（负号）符号表示它是负数。用于 `Integer` 的常用方法有：\n- `round()` – 这将小数四舍五入。\n\
    - `intval()` – 这会将字符串整数转换为整数。\n\n示例：\n`$price = 10;`\n`$total = 10.20;`\n\n###\
    \ 示例\n[下载示例](https://phpbootcampdemo.com/php/data-php/numbers/downloads/php-data-php-numbers-em1.zip)\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta\
    \ name=\"description\" content=\"Page Description\">\n    <title>Numbers</title>\n\
    </head>\n<body>\n    <h1>Numbers</h1>\n    <?php\n    $length = 10;\n    $breath\
    \ = 10;\n    $area = $length * $breath;\n    echo \"Area: $length x $breath =\
    \ $area\";\n    ?>\n</body>\n</html>\n```\n![](img/rsrc30K.jpg)[实时预览](https://phpbootcampdemo.com/php/data-php/numbers/em1/after)\n\
    \n### 练习 1\n编写一个函数对给定的小数进行四舍五入并显示输出。\n提示：使用 `round(value)`\n![](img/rsrc30M.jpg)[实时预览](https://phpbootcampdemo.com/php/data-php/numbers/ex1/after)\n\
    \n### 练习 2\n[下载练习 2](https://phpbootcampdemo.com/php/data-php/numbers/downloads/php-data-php-numbers-ex2.zip)\n\
    将 `String` 转换为 `Integer` 并两个字符串数字以及两个整数。\n![](img/src30N.jpg)[实时预览](https://phpbootcampdemo.com/php/data-php/numbers/ex2/after)\n\
    \n## 2.4 数组\n### 数组的用法\n数组是一种存储一个或多个项目（称为元素 elements）的数据类型。每个元素可以是多种数据类型的组合。`length`\
    \ 用于指示数组中元素的数量。数组的每个元素都可以通过索引数字访问。数组的第一个元素从索引 `0` 开始。\n\n定义数组：\n`$arrayName =\
    \ array($value1, $value2);`\n\n示例：\n`$colorName = array('red', 'white', 'yellow');`\n\
    `$newColors = array();`\n`$newColors[0] = $colorName[0];`\n`$newColors[1] = $colorName[1];`\n\
    `$age = array(10, 40, 34);`\n`$studentage[0] = $age[0];`\n`$studentage[1] = 50;`\n\
    \n### 打印数组\n`print_r($arrayName);`\n\n### 示例\n[下载示例](https://phpbootcampdemo.com/php/data-php/arrays/downloads/php-data-php-arrays-em1.zip)\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta\
    \ name=\"description\" content=\"Page Description\">\n    <title>Arrays</title>\n\
    </head>\n<body>\n    <h1>Arrays</h1>\n    <?php\n    //定义一个数组\n    $colorNames\
    \ = array('red', 'green', 'white');\n    // 打印一个数组\n    print_r($colorNames);\n\
    \    echo \"<br>\";\n    // 遍历数组\n    foreach ($colorNames as &$value) {\n   \
    \     echo $value . \"<br>\";\n    }\n    //定义一个空数组\n    $age = array();\n   \
    \ $age[0] = 10;\n    $age[1] = 20;\n    $age[3] = 30;\n    // 打印数组\n    print_r($age);\n\
    \    ?>\n</body>\n</html>\n```\n\n* * *\n![](img/rsrc30P.jpg)[实时预览](https://phpbootcampdemo.com/php/data-php/arrays/em1/after)\n\
    \n### 练习 1\n[下载练习 1](https://phpbootcampdemo.com/php/data-php/arrays/downloads/php-data-php-arrays-ex1.zip)\n\
    创建一个包含 `String`、`Number` 和 `Boolean` 的数组并显示它们。\n![](img/rsrc30.jpg)[实时预览](https://phpbootcampdemo.com/php/data-php/numbers/ex1/after)\n\
