    \n# 2.2 Strings\n## Usage of String\nStrings in PHP can be enclosed with Single\
    \ Quote or Double Quotes. You can use Single quotes inside the double quotes and\
    \ vice-versa.\n\n- `.` – DOT Symbol is used to concatenate two strings together.\n\
    - Variable when used inside the Double Quote then it will resolve into the variable\
    \ value. This is called as Interpolation.\n- Interpolation of Variables only happens\
    \ with Double Quotes and does not work with Single Quotes. That’s why you must\
    \ always use Single Quotes and only use Double quotes when you need interpolation\
    \ feature.\n\nString Examples:\n`$firstName = 'Freelancer';`\n`$firstName = \"\
    Freelancer\";`\n`$fullName = $first . \" – \" . $last;`\n`$fullName = \"$first\
    \ – $last\";`\n`$places = \"\"; //Empty String\n`$numPrice = 10.20;`\n`$SubTotal\
    \ = \"Price: \" . $numPrice;`\n\n### Sample Example [Download the Example](https://phpbootcampdemo.com/php/basics-php/strings/downloads/php-data-variables-em1.zip)\n\
