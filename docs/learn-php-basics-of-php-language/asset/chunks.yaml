  fmt: "\n# Exercise 1\nCreate your own Library and use it. Continue using it for\
    \ other projects as well. Follow this practice to split the project into small\
    \ files and include them.\n\n# Forms\n\n## 6.1 GET Method\n\n### Usage of Form\
    \ GET Method\n`GET` is a type of method used by the form to pass the form data\
    \ to the page that is mentioned in the `action` of the form. The `GET` method\
    \ will send the data in the `url`.\n\nWhen you define a form here are the important\
    \ things:\n- `action` attribute – This define to which file this form data has\
    \ to be sent to.\n- `method` attribute - are of two types – `GET` and `POST`.\
    \ `GET` means data is visible in the URL bar. `POST` means data is hidden. Using\
    \ `GET` we can send limited data and using `POST` we can send huge data.\n- `<input>`\
    \ type has a `name` attribute which helps to define the name of the element. This\
    \ `name` is like a variable that holds the data what user enters. `name` attribute\
    \ for form element is posted to the next page.\n- `<input type=\"submit\">` will\
    \ show a submit button when clicked the form will submit the data to the file.\
    \ This action is taken care by the browser.\n\n### How to Read the GET Variables\
    \ from the URL\nIf the URL is something like: `http://site.com/display.php?input_text=hello&input_email=test@test.com`\n\
    \n```php\n$text = $_GET['input_text'];\n$emailid = $_GET['input_email'];\n```\n\
    \nURL will have `name=value` pairs separated with `&`. `$_GET` is an array that\
    \ gets created automatically with the `GET` parameters which you can access it\
    \ and check if any value is there or not. `$_GET` is a super global variable which\
    \ is always available even it is empty it is available. \n\nWhen you click the\
    \ submit button the form data is passed to `display.php` which read the parameters\
    \ and display the output. Browser will also go from `index.php` page to `display.php`\
    \ page.\n\n### Sample Example\n[Download the Example](https://phpbootcampdemo.com/php/forms-php/get/downloads/php-forms-php-get-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html\n<head>\n    <meta charset=\"utf-8\">\n    <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta\
    \ name=\"description\" content=\"Page Description\">\n    <title>Forms - GET</title>\n\
    </head>\n<body>\n    <h1>Form - GET</h1>\n    <form action=\"display.php\" method=\"\
    get\">\n        <fieldset>\n            <legend>Student Enquiry Form</legend>\n\
    \            <p>\n                <label for=\"input_text\">Text:</label>\n  \
    \              <input name=\"input_text\" type=\"text\" placeholder=\"Text\">\n\
    \            </p>\n            <p>\n                <label for=\"input_email\"\
    >Email:</label>\n                <input name=\"input_email\" type=\"email\" placeholder=\"\
    test@domain.com\">\n            </p>\n        </fieldset>\n        <p>\n     \
    \       <input type=\"submit\">\n            <input type=\"reset\">\n        </p>\n\
    \    </form>\n</body>\n</html>\n```\n\n**FileName: display.php**\n```html\n<!DOCTYPE\
    \ html>\n<html\n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n    <meta name=\"description\"\
    \ content=\"Page Description\">\n    <title>Forms - GET</title>\n</head>\n<body>\n\
    \    <h1>Form - GET</h1>\n    <a href=\"index.php\">Back to Home Page</a><br>\n\
    \    <?php\n    $name = $_GET['input_text'];\n    $email = $_GET['input_email'];\n\
    \    echo \"Name: $name and Email: $email\";\n    ?>\n</body>\n</html>\n```\n\n\
    * * *\n\n## Exercise 1\n[Download the Exercise 1](https://phpbootcampdemo.com/php/forms-php/get/downloads/php-forms-php-get-ex1.zip)\n\
    Exercise 1: Create a Form that accepts two numbers and show the calculation of\
    \ those two numbers on another page.\n\n## Exercise 2\n[Download the Exercise\
    \ 2](https://phpbootcampdemo.com/php/forms-php/get/downloads/php-forms-php-get-ex2.zip)\n\
    Exercise 2: Show the result on the same page and redirect to same page.\nTips:\
    \ Check if the values are not empty\n```php\nif (!empty($_GET['input_text1'])\
    \ && !empty($_GET['input_text2'])) { }\n```\n\n## 6.2 POST Method\n\n### Usage\
    \ of Form POST Method\n`POST` is a type of method used by the form to pass the\
    \ form data to the page that is mentioned in the `action` of the form. The `POST`\
    \ method will send the data as an attachment. It is not visible in the `URL`.\n\
    \nWhen you define a form here are the important things:\n- `action` attribute\
    \ – This define to which file this form data has to be sent to.\n- `method` attribute\
    \ are of two types – `GET` and `POST`. `GET` means data is visible in the URL\
    \ bar. `POST` means data is hidden. Using `GET` we can send limited data and using\
    \ `POST` we can send huge data.\n- `<input>` type has a `name` attribute which\
    \ helps to define the name of the element. This `name` is like a variable that\
    \ holds the data what user enters. `name` attribute for form element is posted\
    \ to the next page.\n- `<input type=\"submit\">` will show a submit button when\
    \ clicked the form will submit the data to the file. This action is taken care\
    \ by the browser.\n\n### How to Read the POST Variables\n`POST` variables are\
    \ not visible in the `URL`.\n```php\n$text = $_POST['input_text'];\n$emailid =\
    \ $_POST['input_email'];\n```\n\n`$_POST` is an array that gets created automatically\
    \ with the `POST` parameters which you can access it and check if any value is\
    \ there or not. `$_POST` is a super global variable which is always available\
    \ even it is empty it is available.\n\nWhen you click the submit button the form\
    \ data is passed to `display.php` which read the parameters and display the output.\
    \ Browser will also go from `index.php` page to `display.php` page.\n\n### Sample\
    \ Example\n[Download the Example](https://phpbootcampdemo.com/php/forms-php/post/downloads/php-forms-php-post-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html\n<head>\n    <meta charset=\"utf-8\">\n    <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta\
    \ name=\"description\" content=\"Page Description\">\n    <title>Forms - POST</title>\n\
    </head>\n<body>\n    <h1>Form - POST</h1>\n    <form action=\"display.php\" method=\"\
    post\">\n        <fieldset>\n            <legend>Student Enquiry Form</legend>\n\
    \            <p>\n                <label for=\"input_text\">Text:</label>\n  \
    \              <input name=\"input_text\" type=\"text\" placeholder=\"Text\">\n\
    \            </p>\n            <p>\n                <label for=\"input_email\"\
    >Email:</label>\n                <input name=\"input_email\" type=\"email\" placeholder=\"\
    test@domain.com\">\n            </p>\n        </fieldset>\n        <p>\n     \
    \       <input type=\"submit\">\n            <input type=\"reset\">\n        </p>\n\
    \    </form>\n</body>\n</html>\n```\n\n**FileName: display.php**\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n    <meta name=\"description\"\
    \ content=\"Page Description\">\n    <title>Forms - POST</title>\n</head>\n<body>\n\
    \    <h1>Form - POST</h1>\n    <a href=\"index.php\">Back to Home Page</a><br>\n\
    \    <?php\n    $name = $_POST['input_text'];\n    $email = $_POST['input_email'];\n\
    \    echo \"Name: $name and Email: $email\";\n    ?>\n</body>\n</html>\n```\n"
  trans: "\n\n# 练习 1\n创建你自己的库并使用它。继续在其他项目中使用它。遵循此练习将项目拆分为小文件并包含它们。\n\n# 表单\n\n## 6.1\
    \ GET 方法\n\n### 表单 GET 方法用法\n`GET` 是表单用于将表单数据传递到表单 `action` 属性中指定的页面的方法类型。`GET`\
    \ 方法将数据发送在 `url` 中。\n\n当你定义表单时，这里有一些重要的点：\n- `action` 属性 – 定义表单数据需要发送到哪个文件。\n\
    - `method` 属性有两种类型 – `GET` 和 `POST`。`GET` 意味着数据在 URL 栏中可见。`POST` 意味着数据是隐藏的。使用\
    \ `GET` 我们可以发送有限的数据，使用 `POST` 我们可以发送大量数据。\n- `<input>` 类型有一个 `name` 属性，有助于定义元素的名称。这个\
    \ `name` 就像一个存储用户输入数据的的。表单元素的 `name` 属性会被提交到下一个页面。\n- `<input type=\"submit\"\
    >` 会显示提交按钮，点击时表单会将数据提交到文件。此操作由浏览器处理。\n\n### 如何从 URL 读取 GET 变量\n如果 URL 类似于如下：`http://site.com/display.php?input_text=hello&input_email=test@test.com`\n\
    \n```php\n$text = $_GET['input_text'];\n$emailid = $_GET['input_email'];\n```\n\
    \nURL 将具有由 `&` 分隔的 `name=value` 对。`$_GET` 是根据 `GET` 参数自动创建的数组，你可以访问它并检查是否存在任何值。`$_GET`\
    \ 是超全局变量，即使它是空的也是始终可用的。\n\n当你点击提交按钮时，表单数据被传递到 `display.php`，该页面读取参数并显示输出。浏览器也会从\
    \ `index.php` 页面跳转到 `display.php` 页面。\n\n### 示例\n[下载示例](https://phpbootcampdemo.com/php/forms-php/get/downloads/php-forms-php-get-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html\n<head>\n    <meta charset=\"utf-8\">\n    <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta\
    \ name=\"description\" content=\"Page Description\">\n    <title>Forms - GET</title>\n\
    </head>\n<body>\n    <h1>Form - GET</h1>\n    <form action=\"display.php\" method=\"\
    get\">\n        <fieldset>\n            <legend>Student Enquiry Form</legend>\n\
    \            <p>\n                <label for=\"input_text\">Text:</label>\n  \
    \              <input name=\"input_text\" type=\"text\" placeholder=\"Text\">\n\
    \            </p>\n            <p>\n                <label for=\"input_email\"\
    >Email:</label>\n                <input name=\"input_email\" type=\"email\" placeholder=\"\
    test@domain.com\">\n            </p>\n        </fieldset>\n        <p>\n     \
    \       <input type=\"submit\">\n            <input type=\"reset\">\n        </p>\n\
    \    </form>\n</body>\n</html>\n```\n\n**FileName: display.php**\n```html\n<!DOCTYPE\
    \ html>\n<html\n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n    <meta name=\"description\"\
    \ content=\"Page Description\">\n    <title>Forms - GET</title>\n</head>\n<body>\n\
    \    <h1>Form - GET</h1>\n    <a href=\"index.php\">Back to Home Page</a><br>\n\
    \    <?php\n    $name = $_GET['input_text'];\n    $email = $_GET['input_email'];\n\
    \    echo \"Name: $name and Email: $email\";\n    ?>\n</body>\n</html>\n```\n\n\
    * * *\n\n## 练习 1\n[下载练习 1](https://phpbootcampdemo.com/php/forms-php/get/downloads/php-forms-php-get-ex1.zip)\n\
    练习 1：创建一个接受两个数字的表单，并在另一个页面上显示这两个数字的计算结果。\n\n## 练习 2\n[下载练习 2](https://phpbootcampdemo.com/php/forms-php/get/downloads/php-forms-php-get-ex2.zip)\n\
    练习 2：在同一页面显示结果并重定向到同一页面。\n提示：检查值是否为空\n```php\nif (!empty($_GET['input_text1'])\
    \ && !empty($_GET['input_text2'])) { }\n```\n\n## 6.2 POST 方法\n\n### 表单 POST 方法用法\n\
    `POST` 是表单用于将表单数据传递到表单 `action` 属性中指定的页面的方法类型。`POST` 方法将数据作为附件发送。它在 `URL` 中可见。\n\
    \n当你定义表单时，这里有一些重要的点：\n- `action` 属性 – 定义表单数据需要发送到哪个文件。\n- `method` 属性有两种类型 – `GET`\
    \ 和 `POST`。`GET` 意味着数据在 URL 栏中可见。`POST` 意味着数据是隐藏的。使用 `GET` 我们可以发送有限的数据，使用 `POST`\
    \ 我们可以发送大量数据。\n- `<input>` 类型有一个 `name` 属性，有助于定义元素的名称。这个 `name` 就像一个存储用户输入数据的的。表单元素的\
    \ `name` 属性会被提交到下一个页面。\n- `<input type=\"submit\">` 会显示提交按钮，点击时表单会将数据提交到文件。此操作由浏览器处理。\n\
    \n### 如何从 URL 读取 POST 变量\n`POST` 方法不是在 `URL` 中可见。\n\n```php\n$text = $_POST['input_text'];\n\
    $emailid = $_POST['input_email'];\n```\n\n`$_POST` 是根据 `POST` 参数自动创建的数组，你可以访问它并检查是否存在任何值。`$_POST`\
    \ 是超全局变量，即使它是空的也是始终可用的。\n\n当你点击提交按钮时，表单数据被传递到 `display.php`，该页面读取参数并显示输出。浏览器也会从\
    \ `index.php` 页面跳转到 `display.php` 页面。\n\n### 示例\n[下载示例](https://phpbootcampdemo.com/php/forms-php/post/downloads/php-forms-php-post-em1.zip)\n\
    \n```html\n<!DOCTYPE html>\n<html\n<head>\n    <meta charset=\"utf-8\">\n    <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta\
    \ name=\"description\" content=\"Page Description\">\n    <title>Forms - POST</title>\n\
    </head>\n<body>\n    <h1>Form - POST</h1>\n    <form action=\"display.php\" method=\"\
    post\">\n        <fieldset>\n            <legend>Student Enquiry Form</legend>\n\
    \            <p>\n                <label for=\"input_text\">Text:</label>\n  \
    \              <input name=\"input_text\" type=\"text\" placeholder=\"Text\">\n\
    \            </p>\n            <p>\n                <label for=\"input_email\"\
    >Email:</label>\n                <input name=\"input_email\" type=\"email\" placeholder=\"\
    test@domain.com\">\n            </p>\n        </fieldset>\n        <p>\n     \
    \       <input type=\"submit\">\n            <input type=\"reset\">\n        </p>\n\
    \    </form>\n</body>\n</html>\n```\n\n**FileName: display.php**\n```html\n<!DOCTYPE\
    \ html>\n<html\n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n    <meta name=\"description\"\
    \ content=\"Page Description\">\n    <title>Forms - POST</title>\n</head>\n<body>\n\
    \    <h1>Form - POST</h1>\n    <a href=\"index.php\">Back to Home Page</a><br>\n\
    \    <?php\n    $name = $_POST['input_text'];\n    $email = $_POST['input_email'];\n\
    \    echo \"Name: $name and Email: $email\";\n    ?>\n</body>\n</html>\n```\n\n"
