  \ 4.1 Hadoop 内部\n### 4.2 Hadoop 架构\n#### 4.2.1 Hadoop 的组件\n### 4.3 Hadoop 分布式文件系统\n\
  ### 4.4 数据分析工具\n#### 4.4.1 Hive\n#### 4.4.2 HBase\n#### 4.4.3 Pig\n#### 4.4.4 Scoop\n\
