  \nShweta Shankhwar, Dhirendra Pandey 和 Raees Ahmad Khan\n\n巴巴萨希布·比姆拉奥·阿姆别贝德大学（中央大学）\n\
  \n### 目录\n\n### 8.1 网络钓鱼\n\n#### 8.1.1 为什么网络钓鱼行有效\n\n#### 8.1.2 企业中的网络钓鱼\n\n###\
  \ 8.2 网络钓鱼防护指南\n\n#### 8.2.1 网络意识与卫生习惯\n\n#### 8.2.2 基层层面的网络钓鱼防护\n\n#### 8.2.3 企业环境下的钓鱼预防措施\n\
  \n#### 8.2.4 建议进行稳健且细致的网络开发\n\n#### 8.2.5 针对网络犯罪的建议措施\n\n### 8.3 网络钓鱼防护的实施\n\n###\
  \ 8.4 网络钓鱼指南的验证\n\n### 8.5 总结\n\n### 参考文献\n\n### 8.1 网络钓鱼\n\n在过去的十年里，网络钓鱼增长非常迅速。网络钓鱼是诱导人们访问网站以获取个人信息的过程。这并非由任何随机诈骗者发起，而可能是由熟人策划的。\n\
  \n#### 8.1.1 为什么网络钓鱼行有效\n\n自从网络威胁出现以来，许多攻击相继而生。钓鱼者利用的主要漏洞是人性。他们通常通过社会工程学诱导用户落入陷阱。\n\
  \n#### 8.1.2 企业中的网络钓鱼\n\n电子邮件钓鱼等潜在的在线威胁已被证明对用户的信心、信任、声誉和财务方面造成了巨大打击。为了应对这些形而上学的挑战，预防措施必须隐含在用户的行为之中。\n\
  \n钓鱼者利用的主要漏洞是人性。他们通常通过社会工程学诱导用户落入陷阱。\n\n\n\n\n\n远离网络钓鱼的陷阱被定义为传播意识并教育人们此类攻击的恶性后果，同时向人们提供有关网络钓鱼及相关活动的通用信息。教育公众和提高意识是非常重要的，因为未来的日子将充斥着电子通信和电子商务。提高意识将包括向大量群众展示关于网络钓鱼相关困扰的论文并进行讲座，并定期向客户和潜在客户提醒他们所聘用服务的细节。\n\
  \n### 8.2.2 基础层面的网络钓鱼预防\n\n基础层面的网络钓鱼预防定义了基础但相关的指南，这些指南将指导新手用户安全地使用互联网，如下：\n\n1.\
  \ 始终对可能发生网络钓鱼的最新技术保持警惕，关注最新技术，目标是关闭网络钓鱼网站，并持续监控人们使用的领先网站及其运行方式。始终确保家庭计算机的安全，在进行交易的个人系统上建立严密的安全安排，此外，保持操作系统更新到最新并安装防病毒软件以保持健康状态，而不是成为网络钓鱼的受害者。\n\
  \n2. 如果在使用互联网时出现弹出消息，切不要点击弹出框上的任何按钮（即使是关闭按钮），因为它们可能包含恶意软件。\n\n3. 永远不要点击可疑链接或附件；也就是说，永远不要点击从未知来源通过电子邮件、短信或社交媒体收到的链接或文件，因为这可能是试图用恶意软件感染计算机系统的尝试。\n\
  \n4. 应用安全的浏览器设置；即始终选择更新版本的浏览器，并安装安全浏览工具以防范网络钓鱼攻击者、黑客和恶意软件的侵害。\n\n5. 如果遭遇网络跟踪，立即终止与跟踪者的通信；采取“举报并屏蔽”跟踪者的措施是预防措施，以防止自己免受欺凌或骚扰。\n\
  \n6. 限制/禁止在社交媒体网站、婚恋网站、电子钱包等处分享潜在身份信息或任何家庭细节，例如姓名、出生日期、手机号码（在银行注册）、结婚日期、PAN 码、护照号码和\
  \ Aadhaar 卡详情。\n\n7. 对软件进行严格的更新，永远不要从未知来源安装软件、游戏、音乐和应用程序，因为钓鱼攻击者通常针对软件漏洞并获取用户的私有信息使其处于风险之中，因此，使用最新、最先进的安全措施更新所有相关软件是强制性的。\n\
  \n### 8.2.3 企业环境下的网络钓鱼预防措施\n\n就企业环境而言，大多数网络钓鱼攻击在相关领域盛行；预防措施与防御线可能在于识别真实账户和冒充账户。大多数网络钓鱼攻击者使用各种花招，例如冒充账户、伪造电子邮件、使用虚假\
  \ URL/链接并用说服技术诱导点击等。企业环境中网络钓鱼攻击的一个引人注目且值得注意的点是，通常情况下，钓鱼攻击者利用潜在漏洞攻击受害者。基本上，员工忽略了漏洞，他们的疏忽和行为反应使他们落入网络钓鱼攻击的陷阱。\n\
  \n根据研究和开发反网络钓鱼 模型所获得的要点，内部威胁以及来自熟悉来源、共同熟人和活动的网络钓鱼攻击是企业中发起网络钓鱼攻击的主要原因。因此，为了自主预防这种企业员工因模仿典型钓鱼攻击者行为而遭受的痛苦性损害，电子邮件通常旨在通过感性因素和熟悉线索等方式对员工进行诱导和操纵，从而引发他们点击模糊链接。每封网络钓鱼邮件都包含一些关键线索，根据下文指导帮助员工或用户识别并消除障碍：\n\
  \n1. 检查电子邮件的 `From` 字段中是否存在姓名和地址不匹配的情况。\n\n2. 检查是否存在拼写错误、语法错误和间距异常等错误。\n\n3. 具有说服力和鼓励立即采取行动的需求、紧迫感、同情心等特征。\n\
  \n4. 检查鼠标悬停在链接上时，链接文本与链接地址之间是否存在差异。\n\n5. 再次，这封邮件看起来合理，但缺乏特定细节——未提及客户姓名或账号。最后，邮件虽然有签名，但名称无法识别，因此无法验证。\n\
  \n6. 最后是警觉和直觉，即整体感觉不对（例如，用户并未预料到）。\n\n### 8.2.4 建议稳固且细致的网络开发\n\n始终在设计时，网站开发人员应记住钓鱼攻击者何时以及如何采取行动。为了尽可能停止网络钓鱼，他们应该使用尽可能最新的技术设计网站。他们应该能够评估网站在哪些情况下可能被钓鱼攻击者攻击，敏锐观察网站，如果问题持续存在，让\
  \ `IP address` 失效并进行必要的更改以维护网站的信誉。他们应该遵循创建和运行网站的所有程序和政策，并努力使网站尽可能安全。所有软件安全属性（如`机密性、完整性和可用性`）都应包含在软件需求阶段以及软件开发周期的每个阶段。\n\
  \n### 8.2.5 针对其他网络犯罪的建议措施\n\nATM（自动取款机）电子交易发挥着非常持久且普遍的作用。身份验证和授权是基于借记卡详情和安全码（个人识别码）的传统方法，这些方法不可靠，因为读卡器、键盘覆盖、窥视和隐藏摄像头被用于实施欺诈。针对此类高级持续威胁的安全措施是不够的。因此，开发了一种安全的身份验证层，即用于防止高级持续威胁的一次性密码（OTP）方法。需要引入\
  \ OTP 来减少欺诈及其影响。这是关于 ATM 安全性的独特思考，并建立了了用户对替代交付银行渠道的信任和信心。对于对电子交易 ATM 的脆弱信任和信心，还建议使用\
  \ ATM/EDC 数字交换键盘和 ATM/EDC 遮光键盘罩 [14]。\n\n\n\n\n\n如今，互联网匿名性是一个严重的问题。因此，开发了主动网络匿名性最小化模型（PCAMM）[15]，该模型将为网络犯罪调查人员提供包容性的指导和协助。这种开发的方法是基于通过\
  \ IP 地址进行地理位置验证。该方法通过准确的地理位置跟踪安全地访问互联网服务，增强了安全性。网络犯罪分子将变得警惕并害怕破坏其匿名性，由于他们的原始地理位置可能会通过这一理念被泄露，被捕获的概率也会增加。所提议的模型作为一种威慑性和增强安全性的网络调查过程，可以大幅降低网络犯罪率。这是一个省时、准确且投入较少的过程；它将有助于监控用户行为，并在更大规模上避免网络欺骗。\n\
  \n### 8.3 钓鱼预防指南的实施\n\n所建议的钓鱼预防指南在钓鱼攻击的真实场景中实施。为了实施和验证所建议的指南，根据它们的影响对每项指南假设了相应的权重。通过这些指南，在不同场景下为预防钓鱼攻击分配权重。每项指南的权重见表\
  \ 8.1。预防钓鱼攻击基于以下范围：最差 = 0–0.5，中等 = 0.6–1.4，优秀 = 1.4 以上。\n\n#### 表 8.1 钓鱼预防指南权重\n\
  \n| 序号. | 钓鱼预防指南 | 权重 |\n| --- | --- | --- |\n| 1 | 网络意识与卫生 | 0.4 |\n| --- | ---\
  \ | --- |\n| 2 | 基层防钓鱼工作 | 0.6 |\n| 3 | 企业环境下的钓鱼预防措施 | 0.8 |\n| 4 | 稳固且细致的网络 | 0.2\
  \ |\n\n因此，为了实施和验证，详细讨论了四个案例研究，如下：\n\n*   **案例研究 1：** 注册了一个企业合法域名的冒充者；在此处，该企业的员工是目标。钓鱼者通过虚假域名使用企业名称向员工发送伪造邮件。这里的关键点是，所有邮件都是以企业\
  \ CEO 的名义给员工的。邮件包含了目标工作环境人员的名字。这使得钓鱼者已经充分做好了功课，即对该企业及其员工进行了社交工程研究。通过引发紧迫感，员工的回复或返回最终将导致员工失去其专业和个人信息。一些高风险目标，例如财务团队的精英成员或有访问机密权限的人员，通常是企业环境中钓鱼者的攻击目标。\n\
  \n*   **案例研究 2：** Malhotra 先生——起初是一名创业者，后成为一名成功的商人——并不总是能证明自己在财务上具有敏锐度。不幸的是，他没有意识到/免于成为钓鱼诈骗的受害者，这带给他带来巨大的压力，并可能导致他彻底破产。当\
  \ Malhotra 先生收到一封带有 URL/链接的邮件时，情况就是这样。那是他开户的银行询问或告知他的银行账户中观察到了熟悉的活动，是你本人吗？邮件还要求\
  \ Malhotra 先生不要确认详细信息，他的卡可能很快会被挂。\n\n    这封邮件看起来非常真实，因为有银行标志和详细信息。他经常使用借记卡，所以对他来说，银行出于安全原因跟进听起来是真实的。Malhotra\
  \ 先生无法区分合法邮件和钓鱼邮件。当邮件要求他输入个人凭据时，Malhotra 先生在某一点对邮件产生了怀疑，因为他曾收到过银行的一封邮件，上面说“没有任何合法的银行”会要求输入个人详情。但在那个时刻，Malhotra\
  \ 先生急于处理好自己的账户，他并没有仔细考虑就继续操作了。这种紧迫感促使他倾向于失去自己的专业和个人信息。由于这种紧迫感，他点击了链接，重定向到一个看似合法的网站。Malhotra\
  \ 先生以为这是问题的结束，但事实只是苦难的开始。几天后，当 Malhotra 先生检查银行账单时，震惊地发现被取走了 1000 元。他通知了银行，随后发现掉入了钓鱼邮件的陷阱。\n\
  \n*   **案例研究 3：** 我们的一个熟人通过虚假的客户满意度调查成为钓鱼攻击的目标。目标人员被奖品或奖励金额诱惑，尽管他们并没有获得分钱，但最终提供了信用卡信息以填写调查表。很快，他们发现卡片信息被盗，钓鱼者利用这些信息发起了钓鱼攻击。\n\
  \n*   **案例研究 4：** 钓鱼者通过伪造网站或伪造组织网站发起的一种时尚攻击。2014 年，一位女士助理收到了朋友发送的邮件。她阅读了邮件并发现其与她的工作有关。邮件指向即将举行的会议，她发现该会议与她的领域相关。为了获取更多知识，她点击了邮件中的链接，重定向到会议网站。她浏览了会议规范、注册以及征稿和出版详情。她立即决定以作者身份参加会议，这是一个非常好的机会。她通过网站提交了研究论文并缴纳了\
  \ 2 万 万的注册费。随后，在成功提交论文并完成注册流程后，她等待了几个周的消息。当她没有收到任何回复邮件时，情况变得紧张。她提交和注册的那个网站没有任何痕迹。她失去了冷静，立即就此提交了投诉，不仅损失了巨额资金，还有关重要的论文。后来，发现这是一个邮件钓鱼案例\
  \ [15]。\n\n\n\n\n\n| 案例研究的所有可能场景 | 网络意识与卫生 | 基层防钓鱼 | 企业环境下的防钓鱼预防措施 | 健壮且细致的 Web\
  \ 开发 | 防止钓鱼攻击 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 场景 1 | 0 | 0 | 0\
