- "# 数字取证调查中的大数据分析与计算\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 前言\n\n\
  数字取证及其调查已经考虑了其范式的转变，即从传统的机房访问转变为在整个数字舞台防御和信息安全中，对预设和非结构化信息进行整合、广播和审查。如今，由于数据输入量巨大、犯罪调查手段不足以及数字调查的数据和存储容量不断增加，计算机欺诈和网络犯罪已成为一项挑战性性任务。计算机欺诈和网络犯罪的指数级强化逐渐延长了数字取证领域的研究工作。取证一直关注刑事案件、民事诉讼和组织发起的内部调查。然而，计算机欺诈和网络犯罪的数字取证调查与普通犯罪调查不同，其中\
  \ `0` 和 `1` 形式的数据变成了数字证据。\n\n在 `0` 和 `1` 组成的虚拟世界中，数字证据在本质上具有证明性。虚拟世界中数字证据的脆弱景观展示了其在数字调查中的价值和审查意义，从而导致发现犯罪源头成为数字取证领域一个深思熟虑的话题。由于存储数据以驱动组织战略，大数据系统的指数级增长反复识别了销售、医疗保健、学术领域和许多不同的电子通信模式。由于数字调查在揭露过程中需要处理大量不确定信息以减少其疑虑，预测者必须评估从不同来源和统一数据库汇总的大量数据。对此类统计数据的取证评估是显而易见的；如果记录对一个组织有价值，那么这些信息对于该组织的调查就是宝贵的。\n\
  \n数字取证及其调查涉及海量异构数据的收集、审查及其精细调整、过滤和广播，这些可以补充现有的取证知识库和取证调查工具。\n\n## 谢谢\n\n编辑想祝贺并感谢所有作者贡献他们的章节：M.S.\
