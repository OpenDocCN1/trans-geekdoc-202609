  \n随着社交媒体、连接、无处计算、物联网、环境智能以及数字经济的发展，大数据领域已成为许多机构面临的挑战与机遇。大数据包含了大量的商业机会，但如何让它为组织产生价值是非常挑战性的。在这种背景下，拥抱数据科学对组织来说变得更加重要。随着大数据的出现，数据科学重要性和普及正在加速。\n\
  \n本章对数据科学和大数据分析进行了综合介绍。它详细阐述了数据分析生命周期，并探讨了数据科学中使用的方法和技术。它还介绍了相关的相关的处理模型。\n\n###\
  \ 6.2 引言\n\n互联网和万维网在过去的十几年里异常流行。互联网和万维网已成为各年龄、各行各业的人获取通用信息的巨大来源。两个惊创新——移动手机和社交网络改变了人们连接的方式。全球范围内智能手机和移动应用程序正呈指数级增长。\n\
  \n#### 6.2.1 什么是大数据？\n\n大数据无处不在，几乎渗透到每一个行业和组织 [3,4]。它源于组织内部和外部各种来源。它可以是移动设备和传感器网络捕捉到的交互和交易。要理解大数据，需要识别其多样化的特征\
  \ [5]。大数据的特征是使用“V”特征，根据其关联性和重要性，可以分为主要和次要维度（图 6.1）[1,2]。主要的 V 是数量、多样性和速度，而次要的 V\
  \ 是真实性、价值、可变性、波动性和可视化，进一步解释如下：\n\n![图 6.1 大数据的特征。](img/fig06_01.jpg)\n\n图 6.1 大数据的特征。\n\
  \n*   **数量 (Volume)**：大数据最重要的特征是数量。它指的是数据生成的规模。生成的数据量如此巨大，以至于传统方法存储和处理这些数据变得低效 [7]。\n\
  *   **多样性 (Variety)**：除了传统的数据格式外，大数据还以图像、视频音频流、卫星信号、GPS 数据、自然语言文本等形式出现。因此，大数据包含不同类型的数据，如结构化、半结构化和非结构化数据\
  \ [9]。\n*   **速度 (Velocity)**：指的是数据生成和/或处理的速度。例如，Twitter 上平均每分钟发送超过 36 万条推文。互联网用户每天产生约\
  \ 2.6 艾字节的数据。平均而言，Google 每秒处理超过 4 万次搜索。大数据的生成和处理速度令人叹为观止。\n\n\n\n\n*   **真实性 (Veracity)：**\
  \ 指数据的可靠性、来源的可信度以及生成的可信赖。它影响大数据的质量 [10]。例如，卫星信号在遇到障碍时会受到影响。同样，当涉及到不同购物中心客户购买习惯的数据时，人们可能会收集数据所采用的方法产生疑问。\n\
  *   **价值 (Value):** 这是大数据的另一个重要特征 [12]，决定了数据的实用性。如果无法从数据中得出额外的业务价值，那么开展这项工作就没有意义。\n\
  *   **波动性 (Volatility):** 指数据的时效性。由于速度和规模的影响，数据的实时性非常重要。如果数据很快变旧且其相关性随时间推移而降低，那么保持数据的实时可能并不合适，这会在处理系统中带来成本和性能问题。\n\
  *   **变异性 (Variability):** 大数据的变异性是指从多个不同的源捕获数据时产生的不一致性。它可以以数据中异常或离群值的形式存在。数据的变异性需要细致的预处理。\n\
  *   **可视化 (Visualization):** 数据可视化是数据分析的一个重要方面。考虑到数据量、多样性和速度，使用现有的可视化工具和技术对数据进行可视化可能是困难的。\n\
  \n#### 6.2.2 什么是数据科学？\n\n数据科学是一个跨学科领域，通过系统的方法处理结构化和非结构化的海量数据。主要目标是分析数据以发现隐藏的模式，并从中提取可操作的见解，以便组织做出更好的管理决策。数据科学已应用于多个领域，如商业与金融、营销、风险管理、运营与规划、疾病诊断与医疗、农业、欺诈检测、犯罪调查、图像和语音识别、游戏、虚拟现实、天气与环境研究、太空与国防应用等。\n\
  \n数据科学并非全新的学科；它是多个现有学科的融合，例如数据挖掘与知识发现、商业智能、数据分析、人工智能（AI）和机器学习、自然语言处理和信息检索、数据库技术、软件工程、数学和统计学等（见图\
  \ 6.2）。它是许多此类学科的术语，使得数据处理比以前任何时候都更加系统。随着大数据的增长以及机器学习和可扩展计算基础设施领域的重大发展，数据科学的普及程度提高。数据科学凭借其系统的数据分析方法对组织决策非常有帮助。它在有效解决复杂的组织问题方面具有巨大的潜力。\n\
  \n![图 6.2 贡献于数据科学的主要学科。](img/fig06_02.jpg)\n\n图 6.2 贡献于数据科学的主要学科。\n\n#### 6.2.3\
  \ 什么是数据分析？\n\n数据分析是一个广术，涵盖了使用大量的数学和统计方法、技术和工具对各种类型的数据进行分析，以揭示数据中隐藏的知识，帮助组织做出更好的决策。它可以是定性数据分析或定量数据分析。数据分析支持广泛的组织用例\
  \ [19]。例如，电子商务公司可以分析访问者的浏览习惯。同样，制造公司可以分析需求并优化生产。因此，数据分析可以分为四类（见图 6.3）。\n\n![图 6.3\
  \ Gartner 上升模型。（来源：Gartner, 2012。）](img/fig06_03.jpg)\n\n图 6.3 Gartner 上升模型。（来源：Gartner,\
  \ 2012。）\n\n##### 6.2.3.1 描述性分析\n\n描述性分析是各组织使用的最简单、最常见的分析形式。它总结数据并产生发生了什么的结果。然而，它无法解释为什么会发生，例如物品的每日销售情况。\n\
  \n##### 6.2.3.2 诊断性分析\n\n诊断性分析在出现正面或负面问题时，会深入挖掘指标和衡量标准。它提供了见解并回答“为什么会发生？”。例如，如果某个期间的销售量增加或减少，它可能解释了因果关系。\n\
  \n##### 6.2.3.3 预测性分析\n\n描述性分析和诊断性分析解释过去，而预测性分析根据历史数据估计未来事件。它提供了业务的前瞻性并回答“未来将发生什么？”的问题。预测的准确性取决于过去数据的数据的类型。例如，根据历史数据，零售店可以预测需求并管理库存水平，以避免缺货情况。\n\
  \n##### 6.2.3.4 规范性分析\n\n阶梯的最后一种是规范性分析，它比其他分析类型为组织提供更多价值。它是需要复杂技术的先进分析形式。它不仅预测未来可能发生的事件概率，还建议采取什么行动以在事件有利时使其发生，或在不利时防止其发生。例如，出租车司机在考虑了路线距离、出租车行驶速度以及当时交通状况等因素后，从起点到终点的可用路线中获得最佳路线。规范性分析利用前三种分析的回顾、洞察和远见，为这种情况的发生推荐最佳行动方案。\n\
  \n#### 6.2.4 数据分析流程\n\n数据分析流程包含执行数据分析项目的若干活动。虽然没有行业标准的流程模型，但这里介绍了分析项目的主要阶段（见图 6.4）。\n\
  \n![图 6.4 数据分析流程。](img/fig06_04.jpg)\n\n图 6.4 数据分析流程。\n\n##### 6.2.4.1 业务理解\n\n\
  每个数据分析项目都从项目概述、关键目标和结果开始。数据科学家需要识别并理解业务问题，并决定采用什么种分析方法来解决问题。\n\n##### 6.2.4.2 数据探索\n\
  \n\n\n\n\n接下来，项目团队根据所选的分析方法确定数据需求。数据从内部和外部源收集。在考虑到将执行的分析特性的前提下，对数据的充分性和质量进行理解。通过对数据进行描述性统计和可视化来获取对数据的理解。\n\
  \n### 6.2.4.3 预处理\n预处理阶段涵盖所有使数据适用于建模的活动。从多个源收集的数据需要进行整合。有时需要通过归一化和聚合将数据值从一种形式转换为另一种形式。需要对数据进行清洗以填充缺失值并删除重复实例。可能会进行特征选择以处理维数灾难。数据准备是分析过程中最耗时的一步，它可能与其前后的阶段存在迭代关系。\n\
  \n### 6.2.4.4 建模\n一旦数据准备就并使其适用，就会开始模型构建活动。目前有多种建模算法可用。根据分析的类型和数据的性质，可能会使用一个或多个算法。数据可以被随机分为训练数据集和测试数据集。使用训练集训练模型，并使用测试集进行测试。考虑若干个描述统计显著性的评估指标来评估模型性能。可能会对模型参数进行调优，以产生所需的结果并解决业务问题。因此，模型构建和评估活动可能会迭代进行。\n\
  \n### 6.2.4.5 数据可视化\n一旦模型经过调优并实现了预期结果，就会进行数据可视化以展示分析过程的结果。它使决策者能够轻松理解分析结果。通过交互式可视化，决策者可以深入到数据的更深层次，以获得业务的洞察。\n\
  \n### 6.3 数据分析技术\n对于数据分析过程的不同阶段存在许多技术。这里介绍了在预处理和建模阶段使用的某些选定技术。\n\n#### 6.3.1 预处理阶段的技术\n\
  大多数情况下，收集到的原始数据以其原始形式并不适用于分析。数据质量对于数据分析至关重要。数据质量差会降低数据分析的质量。因此，使用了多种预处理技术来提高数据质量。\n\
  \n#### 6.3.1.1 数据清洗\n数据清洗处理包含缺失值或属性的不完整数据、可能由于错误和离群值引起的噪声数据，以及由于相同数据形式不同引起的不一致数据。在构建任何模型之前必须对数据进行清洗。通过经过适当清洗数据集，学习算法可以从数据中提供令人印象深刻的见解。\n\
  \n**处理缺失值：** 数据中的缺失值不能简单地忽略，因为某些学习算法对它们非常敏感。处理缺失值有两种大方法：删除和填充。在删除中，包含缺失属性值的数据实例被从数据集中移除。然而，删除并不是最优的，因为这些实例从其他属性的角度来看可能具有信息量，且删除实例会导致信息丢失。在填充中，缺失值从其他实例进行填充。例如，缺失值可以用属性的平均值或使用学习算法的预测值来填充。在\
  \ `WEKA` 机器学习工具中，有几种过滤器可用于此种目的。\n\n**离群值检测：** 离群值是属性的一个极端值，偏离了数据集中相同属性的整体数据模式。由于离群值会导致许多算法产生学习问题，必须移除它们，从而有助于提高模型性能。然而，必须有正当理由移除离群值。因为离群值可能是由于数据采集导致的数据错误，它也可能是显示数据变性的真实值，指示着新颖性。存在诸如\
  \ `Z-score`、`interquartile range`、`DBSCAN`（基于密度的噪声空间聚类）和 `Isolation Forests`（孤立森林）等技术来处理离群值。\n\
  \n#### 6.3.1.2 数据转换\n原始数据必须转换为适当的格式，以便机器学习算法能够有效地应用于分析建模。数据转换处理归一化、聚合、属性构建和离散化。\n\
  \n**归一化：** 数据归一化是指将属性的数据值转换为特定的比例。`min-max`、`Z-score` 和 `decimal scaling` 等技术用于归一化。在\
  \ `min-max` 归一化中，使用以下公式将原始值转换为新值：\n\n```\nv' = (v - min(A)) / (max(A) - min(A))\
  \ + min(A)\n```\n其中 `v` 是原始值，`min(A)` 和 `max(A)` 是属性 `A` 的最小值和最大值；`v'` 是新值。\n\n\
  在 `Z-score` 中，属性的数据值被转换为均值为 0、标准差为 1 的比例。以下公式用于此目的：\n\n```\nv' = (v - μ) / σ\n```\n\
  其中 `v` 是原始值，`v'` 是新值，`μ` 和 `σ` 分别是均值和标准差值。\n\n同样，在 `decimal scaling` 中，通过使用以下公式移动小数点将属性的数据值转换为新值，使得新值始终小于\
  \ 1：\n\n```\nv' = v / 10^n\n```\n其中 `v` 是原始值，`v'` 是新值，`n` 是原始值的位数。\n\n**聚合：** 在数据聚合中，需要进行汇总以提供数据的高层视图。例如，每天收集的数据可以聚合为周、月、年；同样，城市级的数据可以聚合为区域、州国家。\n\
  \n**属性构建：** 有时会将两个或多个属性合并为一个属性。由此创建的新属性可以比原始属性更有效地捕捉数据集中的重要信息。例如，包含城市、面积和人口属性的人口数据可以转换为城市和密度（即面积和人口结合）。\n\
  \n**离散化：** 它用于将连续属性转换为离散属性。连续属性的范围被划分为多个区间（箱），并使用区间标签替换实际数据值。当属性值数量较小时，许多学习算法的表现更好。\n\
  \n#### 6.3.1.3 降维\n\n\n\n\n\n数据集中的属性数量和实例数量共同构成数据的维度。高维数据集有时会成为数据分析的“诅咒”。高维空间复杂，难以识别模式。机器学习算法通常需要大量的时间和内存来处理数据。为了有效应用敏感型算法，应对对高维数据进行降维。\n\
  \n**特征子集选择：** 数据集通常包含多个属性，这些属性有时提供冗余信息，或者从分析的角度来看并不重要。在数据预处理阶段，必须移除这些不相关的属性。有不同的算法可以根据属性相对于目标类别的价值对数据集中的属性进行评估，并产生最优属性子集。例如，在\
  \ `WEKA` 机器学习工具中，可以使用 `CfsSubsetEval`、`CorrelationAttributeEval` 和 `InfoGainAttributeEval`\
  \ 等算法来达到此目的。\n\n**主成分分析 (PCA)：** 这是最流行的降维技术之一。`PCA` 通过搜索一个能够最好表示数据集的低维空间来减少属性数量。降维通过选择足够的特征向量来解释原始数据中高比例（通常为\
  \ 96% 或更高）的方差来完成。\n\n**采样：** 采样用于从数据集中选择具有代表性的实例子集进行分析，该子集大致具有原始数据集相同的属性。它减少了数据规模并使算法学习更快。有不同类型的采样，如简单随机采样、分层采样和渐进采样。\n\
  \n### 6.3.2 建模阶段的技术\n\n在建模阶段，会使用一种或多种技术从数据集中学习并找到适合它的模型。这些学习技术广泛分为监督学习和无监督学习。在监督技术中，算法从一组称为训练数据的示例中学习。训练数据集中的每个实例都包含一个给定输入对应的输出。一旦学习了数据模型，它就会用于预测一组新输入的输出。另一方面，无监督学习算法从从数据集中学习，数据集中的实例不包含一组输入的输出。学习算法利用其特征将数据组成若干组。数据组中的所有实例彼此相互相似。\n\
  \n### 6.3.2.1 回归\n\n回归是数据分析建模中一种重要的监督学习技术。简单回归显示了两个变量之间的因果关系：一个被指定为自变量，另一个是因变量。与显示两个未指定变量之间关系程度的相关性不同，回归显示了因变量和自变量之间的因果关系。此外，回归超越了相关性，并在已知自变量时预测因变量。有几种类型的回归技术，它们在因变量类型、自变量数量和回归线形状上有所不同。这里概述了一些常见的回归技术。\n\
  \n**线性回归：** 这是最简单且应用广泛的预测建模技术。模型中使用的变量假设是完全线性的。因变量是连续的，而自变量可以是连续的也可以是离散的。当仅有一个自变量和一个因变量组成回归模型时，它被称为单变量线性回归模型。然而，回归模型的更通用的形式是多元（或多）线性回归，其中多个自变量（称为特征）构成回归。\n\
  \n```\nY = a + b1*X1 + b2*X2 + ... + bn*Xn\n```\n\n**逻辑回归：** 它用于预测因变量，该变量在本质上是二元的（例如\
  \ 0/1，真/假）。自变量可以是连续的或二元的。逻辑回归在因变量和自变量之间可以是线性或非线性关系。它需要大型训练数据集来构建模型，并假设存在多共线性。所有自变量都应该是显著的，以避免过拟合问题。逻辑回归广泛用于分类问题。当因变量是多类（即超过两个值）时，逻辑回归被称为多项逻辑回归。\n\
  \n**多项式回归：** 在多项式回归中，回归方程使用自变量的多项式表示。因变量与自变量之间的关系是非线性的。因此，使用一个自变量的 k 次幂的多项式回归可以写为：\n\
  \n```\nY = a + b1*X + b2*X² + b3*X³ + ... + bk*X^k\n```\n\n在考虑多项式回归时，可以向方程添加多个自变量。然而，需要注意的是，大量的特征或高阶多项式可能会导致过拟合。\n\
  \n### 6.3.2.2 分类\n\n数据分类通常定义为通过相关类别组织数据的过程，以便更高效地使用和限制。在基础层，分类方法使得数据更容易定位和恢复。当数据分类描述风险管理和数据安全时具有显著的合性。数据分类包括对数据进行标记，使其易于搜索和跟踪。它还消除了若干重复数据，这可以减少存储和备份成本，同时加快搜索过程。\n\
  \n### 6.3.2.3 聚类\n\n聚类是属于相同类的相似对象的集合。或者，将相似对象收集在一个聚类中，将不相关的对象收集在一个新的聚类中 [13]。聚类可以源于最显著无监督学习问题；因此，对于此类问题的每一个额外问题，它负责在分组数据中寻找结构。\n\
  \n\n\n\n聚类是指一组内部相似且与其他生成的聚类不同的对象集合 [16]。聚类的目标是解决未识别数据集中的内在分组问题 [17]。但它决定了什么构成了高质量的聚类。可以发现，并不存在一个独立于聚类最终目的的至高“最佳”标准。因此，这一标准应该由用户来给出。例如，它可能被用于获取相同组的代表性数据（数据降维）、发现自然聚类、通过提取本质且适宜的分组来解释其未识别的属性，或者用于发现异常数据对象。\n\
  \n### 6.3.2.4 关联规则\n\n关联规则挖掘是一个旨在从来自不同类型数据库（如事务数据库、关系型数据库和其他形式的数据存储库）的数据集中发现频繁模式、相关性、关联或因果结构的过程。给定一组事务，关联规则挖掘旨在获取规则，这些规则允许我们根据事务中其他项目的出现情况来预测特定项目的发生。关联规则挖掘是一种寻找管理项目组之间可能存在的关联和底层对象的规则的数据挖掘技术。因此，在包含多个项目的特定事务中，它尝试获取管理这些项目如何或为何经常被一起在一起的规则。\n\
  \n例如，花生黄油和果酱经常被一起购买。关联规则通常需要同时满足用户指定的最小支持度和用户指定的最小置信度。\n\n### 6.3.2.5 集成学习\n\n集成学习是一种重要的机器学习标准，通过训练许多学习器来解决同一个问题。与尝试从训练数据中研究一种假设的普通机器学习技术相反，集成技术试图构建一组假设并将其合并使用。集成包含许多学习器，这些学习器通常被称为基学习器。集集的泛化能力通常比基学习器准确得多。事实上，集成学习具有吸引力，是因为它可以将弱学习器（即比随机猜测好一点的的器）提升为强学习器（可以构建极其精确预测的的器）。因此，“基学习器”也被称为“弱学习器”。值得注意的是，尽管大多数理论分析是针对弱学习器进行的，但在实践中应用的基学习器本质上并不是弱的，因为使用并不不那么弱的基学习器通常会提高性能。基学习器通常通过基学习技术从训练数据产生，该技术可以是决策树、神经网络或其他类型的机器学习技术。大多数集成技术应用单一的基学习技术来生成统一的基学习器，但也有一些算法使用许多学习技术来生成异构学习器。在后续案例中，没有单一的基学习方法，因此一些人选择将这些学习器称为个体学习器或组件学习器而非基学习器，而“个体学习器”和“组件学习器”名称也可以适用于统一的基学习器。很难概述集成方法说明的起点，因为排列许多模型的根本思想已经使用了很久，但显而易见，20\
  \ 世纪 90 年代以来集成学习的研究热潮很大程度上归于两项著作。\n\n### 6.3.2.6 深度学习\n\n深度学习基于人工智能，模仿人类大脑在处理数据和生成模式方面的机制，以便做出轻松且准确的决策。深度学习是机器学习的一部分，具有从未标记数据进行无监督学习的能力。或者，也被认为是深度神经网络或深度神经。深度学习与现代数字时代并肩发展，这个时代带来了来自世界各地、所有类型的数据爆发。这些海量数据也被称为大数据，它们从互联网、社交媒体、搜索引擎、电子商务领域和在线影院等来源获取。这些数据是可以自愿访问的，可以通过云计算等不同的应用程序进行使用。另一方面，数据通常是非结构化的，其规模如此巨大，以至于人类可能需要几十年才能理解它们并提取相关信息。\n\
  \n### 6.3.2.7 强化学习\n\n强化学习是机器学习的一种类型。它是关于在特定情况下采取适当行动以使回报最大化。它通过不同的软件和机器实现，以发现自己在特定情况下应该获得的最可能行为或路径。强化学习与监督学习的区别在于，在监督学习中，训练数据带有答案密钥，因此模型使用正确答案本身进行训练；而在强化学习中，没有答案，而是强化智能体选择做什么来执行指定任务。由于缺乏训练数据集，从经验中学习是有效的。\n\
  \n### 6.3.2.8 文本分析\n\n文本分析是解析文本以便从中提取机器读信息的过程。文本分析的目标是从自由获取的文本内容形成结构化数据。该过程包括将大量的非结构化、异构源文档切片成简单的形式，以便管理和构建数据单元。文本分析与文本挖掘、文本分析和信息提取等术语非常接近。文本分析和文本挖掘相似并作为同义词使用。信息提取是文本挖掘后的技术学科名称。所有词汇和术语都是部分自然语言处理（NLP），其终极目标不是完全理解文本，而是通过最实用的方法从中检索精确信息。这意味着要在构建和维护分析流水线所需的努力、其计算代价和性能及其准确性之间建立良好的平衡。最终结果通过召回率（提取完整性）、精确率（提取信息的质量）以及联合指标（如\
  \ F 分数）计算。\n\n### 6.3.2.9 交叉验证\n\n\n\n\n\n交叉验证（Cross-validation），有时称为旋转估计或样本外测试，是各种不同的相似模型验证方法，用于评估统计分析结果将如何泛化到独立数据集上。它通常用于目标是预测的场景，此时需要计算预测模型在实践中执行的准确性。在预测和预报问题中，通常会给模型一个包含已知数据的数据集进行训练（`training\
  \ dataset`），以及一个未知数据（或首次见到的数据）的数据集对模型进行测试（`testing dataset` 或验证集）。交叉验证的目标是测试模型预测未参与计算的新数据的能力，以标记诸如过拟合或选择偏误等问题，并对模型如何泛化到独立数据集（例如，来自某个有效问题的未识别数据集）提供洞察。单轮交叉验证涉及将数据样本划分为若干匹配的子集，在其中一个子集上执行分析（称为训练集），并在另一个子集上（称为验证集或测试集）验证研究结果。为了减少变异性，许多方法会使用不同的划分执行多轮交叉验证，并在这些轮次合并（例如取平均值）验证结果，以提供模型预测性能的近似计算值。因此，交叉验证合并（平均）了预报中的拟合度量，以推导出更完美的模型预测性能估计。\n\
  \n## 6.4 大数据处理模型与框架\n\n### 6.4.1 Map Reduce\n\nMap Reduce 数据处理表示模型由 Google 和 Yahoo\
  \ 开发供内部使用。该数据模型是一种检索模型，而非查询模型。互联网（或者如果你更喜欢称之为 Web 2.0）实际上是基于 `LAMP` 开源软件栈进展的，任何人都可以应用该栈来建立网站：`Linux`（操作系统）、`Apache`（HTTP\
  \ 服务器）、`MySQL`（数据库，但由于它被 Oracle 收购，人们正在转向开源版本 `MariaDB`）以及用于应用程序语言的 `PHP`、`Perl`\
  \ 或 `Python`。`Apache` 和 `MySQL` 现在由 Oracle 公司管理，开源社会对此存在疑虑。在大数据存储领域也存在一个类似的栈，被称为\
  \ `SMAQ` 栈，分别用于存储、Map Reduce 和查询，而不是特定的产品本身。与 `LAMP` 栈一样，执行 `SMAQ` 各层的工具通常是开源的，并运行在硬件产品上。这里的关键词是“大宗商品”（commodity），以便更多的商店能够进入大数据模型。\n\
  \n这引出了关于什么是大数据的明确问题。我发现最好的答案是：当由于某种原因，项目涉及的数据维度是一个主要的焦虑点时。项目似乎是由数据驱动的，而不是由对数据的计算或分析驱动。第一个遇到问题的\
  \ Web 应用程序是搜索引擎。这很合理；它们试图随着网页的增长进行操作，而不丢失或遗漏任何内容。今天，网络上还有其他面临规模问题的执行者。明确的社交网络、多人游戏和模拟，以及大型零售商和拍卖网站。但在网络之外，手机、传感器和其他持续的数据流可以形成数字节的数据。Google\
  \ 发现了基础的 `Map Reduce` 技术，但 Yahoo 真正将其变成了 `Hadoop`。\n\n`Map Reduce` 部分是该模型的关键。想象一个使用\
  \ `commodity` 硬件的模型。`Hadoop` 用 `Java` 编写，但也有其他编程语言。\n\n### 6.4.2 Apache 框架\n\nApache\
  \ `Hadoop` 框架是一种绝对提供批处理的处理模型。`Hadoop` 是第一个在开源社区中获得显著关注的大数据框架。根据 Google 关于他们当时如何管理海量数据的一些论文和演讲，`Hadoop`\
  \ 重新应用了这些技术和组件栈，使得大规模批处理变得更加可行。\n\n现代版本的 `Hadoop` 是许多组件或层的集合，它们共同工作以处理批数据：\n\n*\
  \   `HDFS`：`HDFS` 是分布式文件系统层，在集群节点之间同步存储和复制。`HDFS` 确保数据在发生可预测的主机故障时仍然可用。它在数据源实现，以保留中间处理结果并持久化最终的计算结果。\n\
  *   `YARN`：`YARN` 是“Yet another Resource Negotiator”（另一个资源协调器），用于协调 `Hadoop` 栈的集群组件。它负责协调底层资源并调度要运行的任务。`YARN`\
  \ 作为集群资源的媒介，使得在 `Hadoop` 集群上运行比早期迭代更多样化的工作负载成为可能。\n\n\n\n\n在线环境下的大数据分析具有挑战性，这是因为它具有\
  \ 4V 特性：量（volume）、速度（velocity）、多样性（variety）和真实性（veracity）。目前有许多领域可以优化并提升大数据分析的速度和可扩展性。过去，结合高性能计算系统、机器学习和其他策略的大数据预测性分析已经发展，并在未来的计算应用中将继续被广泛使用。通过应用这些与大数据相关的系统，工程师和科学家能够开发出吸引人的汽车、飞机和其他车辆。他们能够更准确地预测每日天气以及自然灾害。然而，数据科学是数学和统计学的结合，通过将各种统计工具和模型结合机器或计算机算法，对数据集进行清洗、分析并从中发现潜在的模式。它有助于解决问题；但是，特定的算法需要配合模型输入计算机，以开发数据并将其转化为预测结果。在大数据和数据科学的任何时期，有一个共同点就是数据。因此，这些不同领域的研究人员都致力于数据挖掘、预处理和数据分析，以提供有关消费者行为、态度和感知的信息，帮助企业更高效、更有效地运行。虽然大数据与海量数据相关，但数据分析则是应用于处理数据，以便借助数据科学这一工具检索信息和有价值的知识。\n\
