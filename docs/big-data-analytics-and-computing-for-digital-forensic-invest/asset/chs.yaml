  \ [1–3]。对这些数字数据的取证检查必须经过识别、获取、保护、检查和展示等多个步骤，以便将包含潜在证据的记录报告在法庭上进行陈述，以惩罚网络犯罪分子并保护数据。诸如\
  \ `Forensic Tool Kit` (`FTK`) [4] 和 `ENCASE` [5] 等取证工具是按照经过充分认可的数字调查模型中的各个步骤来执行这一过程的\
  \ [6,7]。由于所呈现数据的维度、复杂性和数量，数字取证调查工具提供的数据在惯性上往往是不准确的 [2,6,8]。此外，调查范围和证据检查范围仅限于取证员和调查人员。因此，大数据的异构传播的产生特性可能会带来带来挑战\
  \ [9,10]。\n\n对各种数字犯罪的调查和检查要求使用已批准的数字取证模型和工具进行分析，以实现更好的数据管理、数据验证、数据可视化和数据传播，同时考虑到原始证据及已证明的数字媒体源的内在真实价值\
  \ [11,12]。企业、公共管理、众多工业和非营利部门以及科学研究、社交媒体网站、传感器网络、网络物理系统和物联网等部门产生的数据每天呈指数级增长 [9,13]。从不同地方随时涌入的文本数据到多媒体数据等各种数据（通常称为大数据）已成为一种新兴的定性信息挖掘科学范式，导致科学发现、数据分析以及其数字犯罪检查和调查\
  \ [13]。目前数字数字取证调查模型和工具被称为传统工具，它们依赖于通常用于数据清洗和数据分离的基于特征的分析 [8,14]。但计算机欺诈和网络犯罪的趋势要求利用可能的融合、挖掘、统计和机器学习技术，从来自异构和自主源收集的快速增长、海量、多样化且频繁变化的数据集中，组织并提取出感兴趣的潜在信息\
  \ [3,7,15–17]。\n\n大数据的剧性指数级增长以及相应的计算机欺诈和网络犯罪逐渐延长了数字取证领域的研究工作 [10]。`0s` 和 `1s` 世界中的数字证据具有证明价值，需要将其价值作为数字取证社区的话语领域描述出来。目前正在开发许多数字调查模型和方法来捕获数字证据，但其及时准确的恢复、检测、聚合、关联和展示仍然是一个遥远的梦想。尽管在数字调查模型和数字证据方面已经做了很多工作，但对大数据方法产生的来自不同异构源的数据进行全面的关联和聚合合并，并进行及时准确的检测和分析，是当务之急的需求\
  \ [18]。\n\n因此，随着所有领域大数据的指数级增长，本章旨在评估数据融合技术，意在将其应用于网络安全管理的数字取证调查中。然而，对当代大数据的现状及其在数字取证方面的突出挑战进行了研究，并通过对从研究各个阶段收集的信息进行快速观察，然后进行分析，从而为开展有效的数字调查建立进一步的方向性模型\
  \ [11,17]。开发了一种由联合主管长实验室 (`JDL`) 提出的数据融合模型驱动 [7,15,19] 的基于融合的数字调查工具并对其进行了评估 [20–22]\
  \ 并在各种数字犯罪调查中进行了实验。此外，本章试图探索扩展现有数字调查模型的可能性，以处理网络安全识别、发现和审查中的海量数据。对现有架构的修订将查找表纳入了其中。\n\
  \n## 7.2 大数据\n\n大数据 [9] 被描述为源自社交媒体、医疗保健、交通、电子商务、手机、卫星通信、GPS、手机设备共享等不同媒介的海量数据。大数据也通过五个\
  \ V 来描述：多样性、速度、数量、真实性和价值 [9]。\n\n### 7.2.1 多样性\n\n大数据可以来自各种来源，如网页、网络过程日志、社交媒体帖子、电子邮件、文档和来自传感器的数据\
  \ [23]。大数据以三种形式存在，即结构化、半结构化和非结构化。此类数据的数字调查是复杂且难以实现的 [9]。\n\n### 7.2.2 容量\n\n数字时代处理的是\
  \ TB 和 PB 级的数据；例如，沃尔玛和谷歌每天处理数百万数据，最终每天达到 PB 级 [1]。\n\n### 7.2.3 速度\n\n数据速度每天都在大量增长，因为根据国际数据公司的统计，到\
  \ 2020 年，业务交易类型每天将达到 4500 亿 [1,9]。\n\n### 7.2.4 真实性\n\n数据的真实性和准确维度由大数据的第四个 V 来衡量。根据大数据，卓越性、优势、元数据管理以及隐私和许可问题也由真实性衡量\
  \ [1,23]。\n\n### 7.2.5 价值\n\n价值是指将数据转化为价值的能力。数据的可用性可以从数据中发现以前未知的见解，这种理解导致了价值的产生\
  \ [11,15]。\n\n\n\n索引结构可以使大型且复杂的数据变得简单。但当涉及到大数据时，与其他数据集相比，它变成了一项巨大的挑战，需要进行更快的索引以满足客户设定的时间范围\
  \ [9]。\n\n## 3. 法庭中大数据的取证方法/可视化方法\n\n由于大数据存在于几乎所有应用领域，在法庭上通常需要呈现大量的数据。海量数据总是让数字调查人员面临一项艰巨的任务，即他们需要通过提取关键信息并缩小规模来叙述，并在充分理由的情况下在法庭上进行证明。因此，必须研究如何对这些海量异构数据进行适当的展示，同时保持技术知识的完整性和数字调查的利益\
  \ [10,18,24]。\n\n### 7.4 数字取证调查及其相关问题陈述\n\n“数字取证检查与调查是一项利用科学技术检查数字证据的进展，它开发并测试可以进入法庭的理论，以回答关于发生事件的问题”\
  \ [2,6,25]。数字调查面临着若干问题，具体如下 [26]：\n\n*   随着需要调查的海量数据维度不断增加，数字调查花费的时间越来越多，变得越来越复杂。\n\
  *   数字取证人员在使用现有的取证工具在海量数据中追踪关键证据时面临着更大的困难。\n*   日志文件通常很大且是多维的，这使得数字调查和对支持证据的搜索更加复杂。\n\
  *   数字证据 [2,6,25] 解释为以数字形式存储或传输的具有证明价值的信息。它在本质上是脆弱的，容易被更改或破坏。与其他形式的文献证据相比，它是独有的。\n\
  *   现有的数字取证调查工具无法分析计算机系统中发现的所有数据以揭示数据集的整体模式，这可以帮助数字调查人员决定搜索中下一步采取哪些步骤。\n\n### 7.5\
  \ 数据融合应用在大数据数字取证及其调查中的相关性\n\n任何数字取证调查的主要目的是收集并证明足够的有价值数字证据，以便犯罪分子能够被成功起诉。网络威胁的检测和分析是一项耗时的活动，因为从异构源产生了大量数据，需要对其进行整合和同，以生成关于底层现象的一致且准确的图像。数字犯罪案件调查的重点在于选择正确的模式、属性和特征，然后对它们进行排序，从而提高调查的准确性，并增加识别、检测和分析过程的效率。\n\
  \n数字取证调查过程的主要挑战如下 [2,8,11,27]：\n\n*   发现、诊断和分离大量数据；\n*   保护受发现保护的数据；\n*   重新获取嵌入文件；\n\
  *   进行现场检查；\n*   专家协助的。\n\n为了应对这些挑战，传统的数字取证模型和工具必须配备各种应用技术，以察觉并防御数字犯罪。数据融合、决策挖掘以及可视化技术和机器学习技术\
  \ [16,19] 可以减少存在于数据的复杂性。\n\n开发一个处理大数据的数字取证调查模型需要合适的架构选择方法，并采用替代技术来实现成本的需求 [18]。涉及大数据的数字取证及其调查的要求和指南应倡导一种原型，其中蓝图和增长流程从整体调查需求和约束，到一个涉及数据融合、决策挖掘和机器学习技术应用的规范，以应对大数据及其调查的挑战。构建涉及大数据的数字调查模型时，应该考虑各种因素\
  \ [9,18]，具体如下：\n\n*   涉及大数据的数字取证调查模型应遵循数字调查的步骤以及数字取证的指南。\n*   计算科学技术能够检查并优化各种计算机欺诈和网络犯罪案件的调查过程。\n\
  *   取证调查人员应该尽可能提取数字证据信息，同时考虑到检查将包括大数据的 5V。\n*   应该通过遵守数据收集过程对数据分析过程进行优化。\n*   无论分析的数据是什么，都应在数字调查过程中实现优化和准确性。\n\
  \n### 7.6 数据融合\n\n数据融合涉及来自多个传感器的感知信息的应用，以便从环境中收集大量信息 [7,15]。数据融合也是发生在每个人类和动物身上的一种自然过程。人类有五种感官，利用它们收集有关特定情况的信息，并最终得出结论。由\
  \ [15,19] 描述的数据融合理论是一种仪式性结构，其中源自不同源的数据被对齐并构建成通用格式。数据融合的主要目的是获取更高质量的信息。信息的准确质量取决于所的应用或要解决的案例。数据融合系统的开发是为了得出定性信息而非结论性决策。决策过程可以通过此类系统得到增强。数据融合系统的自动化首先从\
  \ 20 世纪 70 年代后期通过军事系统实现功能。整个 80 年代对数据融合进行了大量的研究。美国国防部（DoD）在 1986 年建立了数据融合小组，它也是\
  \ JDL 的子小组，通常被称为 C3 技术小组。\n\n军事领域的数据融合系统在 20 世纪 80 年代后期投入运行，并从那时起快速发展。它们首先应用于军事领域，但后来融合理论也被应用于民用领域。融合理论在海洋监测、空对空、防空、战场情报、侦察和目标获取以及战略预警和防御方面非常著名。在所有这些应用领域，主要重点是实体的定位、分类和识别。住宅应用包括机器人技术、工业制造系统的自动化控制、智能建筑的发展以及医疗保健应用\
  \ [19]。数据融合理论现在也扩展到了数据、信息和网络安全领域。\n\n#### 7.6.1 JDL 实用数据融合过程模型\n\n通过努力，开发了 JDL/DFS\
  \ 数据融合过程模型，它解释了数据融合理论及其层次的高级实用视角，以及每个层级的功能。JDL 功能性数据融合过程模型（图 7.1）具有以下八个组成部分 [7,15,19]：\n\
  \n\n\n\n\n![图 7.1 JDL 功能数据融合过程模型 [7,15].](images/fig07_01.jpg)\n\n图 7.1 JDL 功能数据融合过程模型\
  \ [7,15]。\n\n*   **源（Sources）：** 用户输入通过源收集并馈送至数据融合系统。最可能的源是本地传感器、分布式传感器、人工输入以及来自数据库的先验信息。\n\
  *   **预处理（Preprocessing）：** 该组件也称为“0 级处理”或“过程精炼”。数据融合系统的预处理步骤涉及初始处理，将数据分配到下一个处理级。数据融合系统的这一步骤专注于与当前状况适当的数据，从而减少融合系统的负担。\n\
  *   **低级融合或 1 级处理（Low-level fusion or level 1 processing）：** 这一融合步骤也称为对象增强。该步骤的主要重点是融合传感器信息以获得单个实体的提取表示。此步骤负责实现以下四个功能：\n\
  \    *   **数据的联盟与对齐（Coalition and alignment of data）：** 涉及将从各种传感器收集的数据定位到通用的方向格式。\n\
  \    *   **数据的联合（Alliance of data）：** 涉及对从多个传感器观察到的事件进行组合、排序或关联，以便它们最终形成一个单一实体。\n\
  \    *   **数据的追踪与跟踪（Trailing and tracking of data）：** 涉及对被检查数据进行多次监控的合并，以估算实体的地点、位置和速度。\n\
  \    *   **数据的识别（Recognition of data）：** 合并与独特性相关的数据，以过滤对对象唯一性或分类的推断。\n    1 级低级融合受益于多样化传感器的使用、空间分散传感器的服务，以及非传感器提供信息的提交。\n\
  *   **2 级处理（Level 2 processing）：** 这一步骤也称为态势精炼。它扩展了实体之间关系的背景解释。它专注于关系信息，以叙述一组实体的含义。它聚焦于聚合实体和事件，解释事件活动，最后解释上下文。作为这一步骤的结果，指示了对抗性的行为和模式。它成功地扩大并提高了由对象变化塑造的当前态势描述的绝对性、稳定性和抽象水平。\n\
  *   **3 级处理（Level 3 processing）：** 这一步骤也称为威胁和危险精炼。它探索当前态势并将其预测到未来，以得出关于前景结果的假设。它识别即将出现的对手的意图、杀伤力和各自的脆弱性。\n\
  *   **4 级处理（Level 4 processing）：** 这一级融合程序也称为过程精炼。它还被视为一种元过程，目标是优化融合过程系统的整体呈现。它再次涉及四个子功能：\n\
  \    *   呈现评估（Presentation valuation）处理基于现场和实时的呈现以及长期呈现评估。\n    *   方法控制功能（Method\
  \ control functionality）处理多级融合及其信息检索的改进。\n    *   基础源检索和需求发现（Foundational origin\
  \ retrieval and requirements finding）识别收集有效且相关信息的特定基础需求。\n    *   任务管理（Mission management）负责对基础源进行管理，以获得任务目标和目的。任务管理可能不涉及特定数据融合功能领域的主要任务。这种子功能通常保留在图\
  \ 7.1 所示的数据融合过程之外。\n*   **数据库管理系统（The database management system）：** 负责从多个基于数据融合的数据库中存储和检索。其主要功能可能包括数据所有权、存储空间确定、归档、完整性、关于关系型数据库的查询以及数据保护和安全。\n\
  *   **人机界面数据融合系统（The human–computer interface data fusion system）：** 它允许用户向融合级提供输入以进一步处理。数据融合过程的输出也通过允许人工输入数据融合过程来传回给用户。\n\
  \n### 7.7 用于数字取证和网络威胁管理的修订的基于数据融合的数字调查模型\n\n已有许多数字取证探索模型和实践，目前被用于解决计算机欺诈和网络犯罪案件，以检索潜在的法律数字证据。但随着数字技术的指数级加剧，计算机欺诈和网络犯罪也在日益演进。因此，这增加了对数字取证领域及其调查研究工作的需求。因此，对来自多种异构源的信息和事实进行综合、关联且全面的整合，并进行明智且精确的发现和检查，是当务之急。因此，本章通过改进以往的工作，强调对来自多样化源的潜在价值数字证据进行形式化、快速且一致的检测以及适当且精确的分析。\n\
  \n已经一种基于 JDL [7,15,19] 开发的基于融合的数字探索模型 [20–22,28]，并在解决计算机欺诈和网络犯罪案件中进行了实验。在本章中，通过研究扩展这种基于融合的数字探索模型，以处理海量数据（如大数据），用于网络威胁识别、检测和检查，以获得更好的及时准确的结果。对现有基于融合的数字调查模型的改进，允许将查找表纳入已开发的网络安全管理和威胁分析结构设计中。\n\
  \n本章通过重组和重新合并数字调查活动步骤并增加查找表，改进了现有基于融合的调查工具（图 7.2），查找表可以作为关联记忆，并可以与数字取证检查和案件检查的步骤保持一一对应。修订后的基于融合的数字调查模型中的重组和重新合并将保持数据融合步骤及其输出与调查步骤之间的平衡，并能为进一步检索数字证据提供更高质量的数据。该模型还通过保留必要的潜在法律数字证据支持事后取证分析。随着大数据无处不在，数据融合理论可以通过缩短用于取证的海量、海量、异构源之间关联的时间来提供安全情报\
  \ [18,23,27]。\n\n![图 7.2 基于融合的数字调查模型（改编自 Satpathy 等 \\[20,21]）。](images/fig07_02.jpg)\n\
  \n\n\n\n\n修订后的基于融合的数字调查模型用于处理被称为大数据的总量，以便对犯罪现场进行及时、准确的检查和检测，该模型如图图 7.3\n\n图 7.3\
  \ 修订后的基于融合的取证调查模型。\n\n*   预处理，\n*   不同融合水平下的犯罪活动处置，\n*   对数字犯罪活动进行定性并追溯其源头，\n* \
  \  数字证据积累，\n*   通过将原始事实和数据转换为有意义的数字证据信息进行数据更新，\n*   数据缩减（将大数据集缩小到较小的尺寸，使数字检查更加合理、科学）。\n\
  \n修订后的基于融合的数字调查模型的各阶段描述如下。\n\n**来源：** 任何计算机欺诈和网络犯罪数字取证调查的来源，都是在数字犯罪被报告并移交给取证调查机构后，为了寻找根本原因以及实施网络犯罪者而确认的所有可能的异构多样化来源。\n\
  \n### 7.7.1 数据收集与预处理](#C13_chapter7.xhtml#rsec7_7_1)\n\n基于融合的调查模型中检查和检测的主要步骤是收集并整合数据并对其进行处理，使得收集的数据能够成为实体的语义理解属性\
  \ [20,22]。收集的关于事件的信息和事实可以在时间、空间或维度单位上对齐。检索到的输出信息需要保存到知识数据库中。\n\n### 7.7.2 查表法](#C13_chapter7.xhtml#rsec7_7_2)\n\
  \n它充当与数字犯罪案件相关的近期访问的有用感兴趣模式的存储容器。这种存储有助于对简化的犯罪事件进行及时的检测和分析，这些事件通常不需要复杂的调查步骤或程序。通过查表法的帮助，人员可以跳过其他高层级的融合处理，直接访问取证日志进行记录。\n\
  \n### 7.7.3 低层融合](#C13_chapter7.xhtml#rsec7_7_3)\n\n这种层级的融合活动主要关注数据清理、数据更改和数据缩减\
  \ [20]。数字调查模型中的这一层融合通过同时保留有意义的信息，降低了大数据的体积和多样性带来的负载，从而提升其重要性，同时将细节损失降至最低。\n\n它主要涉及数据数据，如下\
  \ [15,19]：\n\n*   数据清理（消除无意义信息），\n*   数据更改（将未处理的数据转换为预设信息），\n*   数据缩减（将庞大的数据集剪减为较小体积，以使检查更具实用性和可行性）。\n\
  \n因此，上述点有助于融合活动，根据正在检查的特定数字犯罪案件，从海量大数据中剔除不重要的数据。这种层级的处理将有助于将搜索空间缩小到特定案件，从而更容易管理，并最终在数字取证检查和检测中节省宝贵的时间。\n\
  \n### 7.7.4 数据估计阶段](#C13_chapter7.xhtml#rsec7_7_4)\n\n此阶段考虑了系统的行为模型，该模型是从存储在特征数据库中的数据以及通过知识库获得的知识中研究的。基于对行为模型的估计，对当前事件数据进行估计。来自有序数据集和基于融合的调查系统的关键属性被保存到信息产品数据库中，供未来检查和分析。\n\
  \n### 7.7.5 高层融合](#C13_chapter7.xhtml#rsec7_7_5)\n\n在数字调查模型的这一步骤中，实体或事件通过其环境刻画的研究建立起关系。这种关系的建立包括对犯罪活动以及犯罪事件进行分析和解释，并以相关的阐明结束。高层融合处理可能包括在聚类、分类、关联和挖掘的帮助下进行模式识别、检测和分析\
  \ [16,19]。此类此类结果的结论性意见将指示性能蓝图。这些特征形成一个融合的特征空间，以便进行识别和分类，用于攻击检测和识别。它有效地扩展并增强了状况描述的完整性、一致性和抽象层次。\n\
  \n### 7.7.6 决策级融合](#C13_chapter7.xhtml#rsec7_7_6)\n\n从这种层级的融合处理中获得的有用蓝图需要进一步的检查，以推导出所识别模式的合理性和相关性。此外，为了进一步总结重要模式，它探索了现状、环境和未来的计划，以描绘关于可能结果的推论。这种层级的融合处理关注于发现意图、致命力和前景\
  \ [17,30,31]。经过检查并证明的能够追踪计算机欺诈和网络犯罪源头的感兴趣模式被记录在取证日志中。该日志作为数字取证调查人员的证据支持，他们可以将其作为证据生成的存储库用于法庭证人\
  \ [8,12]。\n\n### 7.7.7 取证日志](#C13_chapter7.xhtml#rsec7_7_7)\n\n取证日志是一个证据记录系统。“取证”一词指的是对虚拟数字证据的事后检查\
  \ [6,8,12]。虚拟世界中的数字信息以预设格式锁定并存储在取证日志中，跟踪事件发生的日期和时间、入侵者的 IP 地址和目标事件 IP 地址、用户、犯罪类型以及犯罪活动的成功或失败、识别/确认请求源、实体信息、简要介绍，如果已被删除则记录删除时间等。犯罪活动也记录了时间标记。文档报告是一个从数据收集和预处理到决策级融合处理的持续过程。它可以作为法庭专家证词的数字证据支持。\n\
  \n### 7.7.8 用户界面](#C13_chapter7.xhtml#rsec7_7_8)\n\n用户界面是数字取证调查人员与取证日志之间通信的媒介。主管和数字取证专家可以通过它与取证日志进行通信。通过外部知识源作为补充信息可以增强调查的准确性，因此可以保存到知识库中，使融合处理更加动态。\n\
  \n此外，融合模型的输出被分组并整合，以建立数字调查阶段与数据融合理论领域之间的映射（表 7.1）。活动的分组保持了数字调查过程步骤与数据融合领域之间的平衡，以处理被称为大数据的海量数据，为最终决策分析产生更高质量的数据。\n\
  \n\n\n\n\n# 表 7.1 数字取证模型阶段到基于融合的调查工具的映射\n\n| 数据融合层次 | 数字取证阶段 | 基于融合的数字取证模型输出的映射活动\
  \ |\n| --- | --- | --- |\n| 源 | 团队的培训与准备 | 意识、共识、草图、公告、证实 |\n| 数据收集与预处理 | 收集与保护\
  \ | 数字媒体、设备、指令性事件、非指令性事件、废除程序 |\n| 查阅表 | 及时/准确的检测 | 快速访问与参考 |\n| 低级融合 | 调查/检查/分析\
  \ | 犯罪分类、对齐格式、对齐规则 |\n| 数据估计 | | 系统模型 |\n| 高级融合 | 调查/检查/分析 | 建立犯罪事件之间的关系、重构事件场景、事件解释、适当阐明指示、对有趣模式贬低方式的说明。情况的全面性、统一性、通用性及其微调\
  \ |\n| 决策层融合 | 调查/检查/分析 | 日志文件、文件、事件日志、数据、信息证据、证据报告 |\n| 用户界面与取证日志本 | 庭审陈述 | 证据澄清、证据预处理、新颖政策、调查中最新的程序和步骤\
  \ |\n| 数据库 | 未来参考历史 | 数字犯罪分类学、网络犯罪分子特征、其主观意图、杀伤力 |\n\n## 7.8 数字取证模型的实用性与可能性\n\n\
  修订后的基于融合的数字取证模型可以作为数字取证调查机构检索离线可接受法律数字证据的获取媒介，包括证据的保护性与永久性，以及数字取证方法的可理解性。由于数字证据的许可适用性中“接受度”和“分量”是两个必要属性\
  \ [1,11]，法院必须处理与叙述科学证据与法律证据之间差异相关的问题。\n\n基于融合的数字取证模型的主要目标是收集证据信息和数据，以便向公众证明即使在犯罪发生后也能证明数字犯罪已实施。此外，及时识别和检测犯罪活动，以及调查结果的准确性，是顺应执法机构需求并保护数字入侵证据链的重要考虑因素。\n\
  \n## 7.9 结论与未来工作\n\n在数字取证检查和对各类计算机欺诈及网络犯罪的调查中，大数据的存在使得调查过程变得至关重要，因为待调查数据之间存在维度、多样化和多方面相互依赖等各种因素的关联。传统的数字取证调查方法采用一或多种现有的取证工具来检查每个数据资源。但当一个数字犯罪事件涉及大量的、异构的数据时，很难将事件聚合并关联到一个共同的引用格式，从而导致调查结果不准确以及调查过程的效率低下。本章为包含各种大数据的数字取证调查修订了一种新型基于融合的数字取证框架。该框架包含了多种大数据。修订后的数字取证模型主要关注数据量、多样性以及数据的及时性、一致性和准确性。我们研究未来的工作依赖于检测算法和机器学习技术的设计，以应对涉及大数据的各种网络威胁，且数字技术平台对于福祉保持有用。\n\
