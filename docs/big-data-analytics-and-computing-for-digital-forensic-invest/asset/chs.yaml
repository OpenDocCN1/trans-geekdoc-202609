  \ 数据收集类型\n### 4.6 证据链记录\n### 4.7 结论\n\n### 4.1 Hadoop 内部\nHadoop 目前是最广泛接受的大数据平台，具有不同的取证应用场景和数据热点。作为\
  \ Apache 基金会解决方案，Hadoop 已经在企业框架中过开发和测试。Hadoop 在本质上等同于大数据，并已成为真正的标准。\n\n\n\n\n\n\
  作为一种全新的大数据解决方案，`Hadoop` 已被各类机构和客户广泛采用。`Hadoop` 由 `Yahoo!` 在 21 世纪 20 年代中期创建，作为最重要的开源大数据结构之一提交给了\
  \ `Apache Foundation`。`Hadoop` 旨在通过集群计算机对海量、复杂的信息索引进行高效处理。`Hadoop` 的分层设计和开源编程包环境使其具有极佳的速度和适应性。大规模创新机构对\
  \ `Hadoop` 的选择非常广泛，许多机构和客户也开始接受 `Hadoop`。`Hadoop` 涵盖逻辑分析师、医疗机构和数据驱动型广告公司。了解 `Hadoop`\
  \ 的运行机制以及如何在 `Hadoop` 上进行取证分析，使代理能够将这种理解应用于其他大数据方案，例如 `PyTables`。\n\n执行大数据取证分析需要学习\
  \ `Hadoop` 的内部机制及其工程结构。同样，了解 `NTFS` 文件系统的工作原理对于在 `Windows` 中进行法医学调查很重要，了解 `Hadoop`\
  \ 架构内部的层次对于正确地在 `Hadoop` 中进行识别、收集和分析证据是必不可少的。此外，`Hadoop` 正在快速更新并包含新的编程包。`Hadoop`\
  \ 一直在不断连接。由于 `Hadoop` 在不断扩展和发展，对其工程结构进行基础学习以及其功能如何赋能分析员在 `Hadoop` 上执行取证分析至关重要。\n\
  \n凭借其自身的文件系统、数据库和应用层，`Hadoop` 可以以不同的结构在不同的区域存储信息（即证据）。`Hadoop` 的多层架构运行在操作系统之上，这意味着证据可能需要从操作系统或\
  \ `Hadoop` 环境内部进行收集。证据可能存在于每一个层中。这可能需要针对每一层以特定的方式进行科学收集和调查。\n\n本节探讨了 `Hadoop` 的运行机制。后续要点包含详细信息：`Hadoop`\
  \ 的设计、记录和数据输入/输出 (`I/O`)。本节提供了对 `Hadoop` 专业底层基础的理解。概述了 `Hadoop` 可测量取证生态系统的关键部分，并确保了在\
  \ `Hadoop` 架构中查找证据的方法。最后，关于设置和运行 `LightHadoop` 和 `Amazon Web Services` 的最佳实践指南，这些是书中模型所使用的\
  \ `Hadoop` 实例。如果你对执行取证分析感兴趣，你应该遵循本节末尾关于引入 `LightHadoop` 和设置 `Amazon Web Administration`\
  \ 示例的最佳实践指南。这些框架对于书中介绍的所有模型至关重要。\n\n## 4.2 HADOOP 架构\n\n`Hadoop` 是一个稳健的框架，适用于大数据分层架构和设备丰富的环境中进行存储和分析（`[图\
  \ 4.1]`）。`Hadoop` 基于容量扩展和注册的理念。它是一个跨平台的、基于 `Java` 的架构。`Hadoop` 可以运行在各种不同的操作系统上，例如\
  \ `Linux` 和 `Windows`，因为它它是使用 `Java` 开发的，这是一种平台无关的语言。`Hadoop` 本身是一个位于操作系统之上的层。`Hadoop`\
  \ 的核心功能同样是 `Java` 实现，并可以作为独立进程运行。凭借其自身的文件系统和核心功能集，`Hadoop` 运行在操作系统之上，`Hadoop` 是一个位于操作系统之上的层。\n\
  \n#### 4.2.1 Hadoop 的组件\n\n`Hadoop` 是一个稳健的框架，适用于大数据分层架构和设备丰富的环境中进行存储和分析（`[图 4.1]`）。`Hadoop`\
  \ 基于容量扩展和注册的理念。Hadoop 层次。以下是 Hadoop 的层次：\n\n*   **操作系统层：** `Hadoop` 基于容量扩展和注册的理念。它是一个跨平台的、基于\
  \ `Java` 的架构。`Hadoop` 可以运行在各种不同的操作系统上，例如 `Linux` 和 `Windows`，因为它它是使用 `Java` 开发的，这是一种平台无关的语言。`Hadoop`\
  \ 本身是一个位于操作系统之上的层。`Hadoop` 的核心功能同样是 `Java` 实现，并可以作为独立进程运行。\n*   **DBMS 层：** `Hadoop`\
  \ 是一个稳健的框架，适用于大数据分层架构和设备丰富的环境中进行存储和分析（`[图 4.1]`）。\n*   **应用层：** `Hadoop` 是一个稳健的框架，适用于大数据分层架构和设备丰富的环境中进行存储和分析（`[图\
  \ 4.1]`）。\n\n`Hadoop` 使用 HDFS 为其应用逻辑地存储数据。`NameNode` 目录管理跨每个 `DataNode` 的数据存储和管理活动。当数据存储在\
  \ `Hadoop` 中，`NameNode` 文件将数据在特定的 `DataNode` 上的多个块（默认为 `64` 或 `128` MB）中动态存储并复制。这样做是为了确保高可用性和容错能力。\n\
  \n\n\n\n\nMapReduce 的第一步是使用 `Map` 运行初始输入数据。它生成信息子集，并将其分布式存储在一个或多个节点上。在这个示例中，输入数据由信息组成，每个节点接收关于一个小部件的信息。每个接收记录的节点执行记录操作。节点将计算总信息。最后，对所有小部件进行洗牌（shuffle），然后还原（reduce）信息以输出。\n\
  \n我们可以通过多种不同的方式编写和执行 MapReduce 程序。接下来，可以使用 `org.apache.hadoop` 用 Java 原生编写程序。`mapred`\
  \ 库使用 Java 编译器；MapReduce 程序被编译后，使用 Hadoop 中的 Java 运行时进行运行。额外的 Hadoop 软件包提供了 MapReduce\
  \ 抽象，使其可以在不使用 Java 的情况下实现 `Map` 和 `Reduce`（例如 `Pig`）。Hadoop 层之上的层是系统和资源管理附加功能。这些层负责存储、提取、转换和分析数据。在这些层中使用的资源示例见表\
  \ 4.1。\n\n#### 表 4.1 MapReduce 数据格式\n\n| 工具 | 描述 |\n| --- | --- |\n| `Hive` | 这是一个数据仓库，提供\
  \ `HDFS` 中的数据并支持类 SQL 访问方式 |\n| `HBase` | 这是一个列式数据仓库，用于在大数据集上高速执行操作 |\n| `Pig` |\
  \ 这是一个框架，使用其自己的脚本语言在 `HDFS` 文件上执行 MapReduce |\n| `Scoop` | 这是一种在关系型数据库系统之间传输数据的方法\
  \ |\n| `Flume` | 它负责收集、聚合和传输进出 Hadoop 的大量日志数据 |\n\n### 4.3 HADOOP 分布式文件系统](#C10_chapter4.xhtml#rsec4_3)\n\
  \nHDFS 是 Hadoop 主要使用的文件系统。它是一个抽象的文件系统层，以自己的格式存储数据，以实现跨平台功能。真实的数据空间位于主机操作系统的文件系统中。然而，在\
  \ Hadoop 块中，存储的是逻辑文件；它们并不一定能像存储在主机操作系统中的文件那样被直接从主机操作系统访问。HDFS 的目标是：\n\n* 维护集群上的数据存储，\n\
  *   通过 `NameNode` 和 `DataNode` 维护存储交付，\n*   将文件分割为 `DataNode` 块，\n* 提供对信息块内容的访问。\n\
  \nHDFS 只是 Hadoop 可以实现的十多个文件系统中的一个。尽管 HDFS 是 Hadoop 中常用的文件系统，也是本书讨论的系统，但研究人员应该意识到\
  \ Hadoop 集群可能使用不同的文件系统。`Kosmos`、`Amazon S3` 和本地文件系统都是其他 Hadoop 文件系统的示例。数据将被导入 `HDFS`\
  \ 并以块的形式进行分布式存储。可以通过多种方式将文件和数据导入 `HDFS`，但所有存储在 `HDFS` 中的数据都被分为一组帧。块之间仅按卷分隔。文件包含记录信息，如果该记录跨越块大小边界，则分割可能会发生在单个文档内部。根据定义，块的大小为\
  \ 64 或 128 MB，但系统管理员可以将其调整为不同的数字。Hadoop 旨在处理 TB 级和 PB 级的数据。每个文件的元数据集中存储在数据库中，因此\
  \ Hadoop 无法将元数据存储在 4 KB 的数据帧中。因此，Hadoop 的\n\n数据在被拆分后存储在多个 `DataNode` 文件中。默认情况下，复制级别设置为每个块三个\
  \ `DataNode` 文件，但系统管理员也可以调整该设置。映射信息显示了位于主节点 `NameNode` 中的数据块位置和其他元数据。图 4.4 阐释了这一过程。\n\
  \n![图 4.4 HDFS 数据块分布。(https://factspan.com/cms/wp-content/uploads/2019/08/HDFS-working.jpg.)](img/fig04_04.jpg)\n\
  \n图 4.4 HDFS 数据块分布。([`factspan.com/cms/wp-content/uploads/2019/08/HDFS-working.jpg`](https://factspan.com).)\n\
  \n`NameNode` 是单点故障。虽然 `DataNode` 的信息存储在多个位置，但除非设置备用 `NameNode` 进行冗余，否则 `NameNode`\
  \ 的信息仅存在一台机器上。数据逻辑上存储在 `HDFS` 中，并可以通过 `HDFS` 像文件一样在任何其他文件系统中访问。多个 `DataNode` 文件可以存储在数据块中，但文件仍然保留其文件名，并可以通过多种方式访问。`NameNode`\
  \ 存储查找文件名所需的信息，该文件名定义了组成文件的各个块所在地，并提供文件级安全保护。当 `HDFS` 中发出文件请求时，Hadoop 会检索数据块并以文件的形式提供访问。\n\
  \n### 4.4 数据分析工具](#C10_chapter4.xhtml#rsec4_4)\n\nHadoop 设计用于处理和分析海量数据。Hadoop 软件软件生态系统庞大且复杂。根据分析的类型，可以使用许多不同的方法。Apache\
  \ 基金会的工具集有许多标准选择，如 `Hive`、`HBase` 和 `Pig`，但其他开源和商业实现也利用 Hadoop 的 `HDFS` 和 `MapReduce`\
  \ 功能开发，以满足不同的分析需求。例如，Cloudera 的 `Impala` 数据库运行在 Hadoop 上，但它不是 Apache 基金会应用程序套的一部分。\n\
  \n为了定义并正确收集数据，了解 Hadoop 集群中使用的数据分析工具非常重要。许多数据分析工具提供了简单的数据收集方法。本节探讨了最常用的三种数据分析工具，即\
  \ Hadoop `Hive`、`HBase` 和 `Pig`。\n\n#### 4.4.1 Hive](#C10_chapter4.xhtml#rsec4_4_1)\n\
  \n这是一个提供 `HDFS` 中的数据并支持类 SQL 访问方式的数据仓库。Hive 运行在 Hadoop 之上，使得查询和分析变得简单。这是一个关于使用 HDFS\
  \ Apache Hive 的简短教程。本教程将是你成为优秀的基于 Hive Hadoop 开发者的第一步。\n\nHive 不是\n\n* 一个关系型数据库，\n\
  * 联机事务处理（OLTP）的设计，\n* 一种实时查询和行级更新的语言。\n\nHive 的特性\n\n* 它将模式存储在数据库中，并将处理后的数据存储在 `HDFS`；\n\
  * 它是为 OLAP（在线分析处理）设计的；\n* 它提供了名为 HiveQL 或 HQL 的 SQL 类型查询语言；\n* 它是熟悉的、快速、可扩展且灵活的。\n\
  \n图 4.5 展示了 Hive 架构。\n\n![图 4.5 Hive 架构。(https://static.javatpoint.com/hadooppages/images/hive-architecture.jpg.)](img/fig04_05.jpg)\n\
  \n图 4.5 Hive 架构。([`static.javatpoint.com/hadooppages/images/hive-architecture.jpg`](https://static.javatpoint.com).)\n\
  \n#### 4.4.2 HBase](#C10_chapter4.xhtml#rsec4_4_2)\n\n这是一个专注于列、用于在数据集执行高速操作的数据仓库。HBase\
  \ 是一个构建在 Hadoop 文件系统之上的列式分布式数据库。它是一个可以水平扩展的开源项目。HBase 是 Google 类大表的软件模型，旨在为海量结构化数据提供简单的随机访问。它利用了\
  \ Hadoop 文件系统的容错性。它是 Hadoop 生态系统的一部分，提供了对 Hadoop 文件系统中数据进行实时读写随机访问的能力。\n\n\n\n\n\
  \n数据可以直接存储，也可以通过 `HDFS` 中的 `HBase` 进行存储（见图 4.6）。数据用户随机读取/访问数据时使用了 `HDFS` 中的 `HBase`。`HBase`\
  \ 位于 Hadoop 文件系统的顶层，实现了读和写访问。\n\n![图 4.6 HBase 架构。（http://a4academics.com/images/hadoop/HBase-Architecture.jpg.）](img/fig04_06.jpg)\n\
  \n图 4.6 HBase 架构。（[`a4academics.com/images/hadoop/HBase-Architecture.jpg`](http://a4academics.com)。）\n\
  \n`HBase` 是一个基于 Apache 软件基金的开源非关系、列式分布式数据库，构建在 `HDFS` 之上，旨在对大型数据集进行更快的读写操作。由于支持索引和事务，它为任何搜索查询提供了更快的数据恢复。它还提供了可配置的表分片、线性/模块的可扩展性，以及针对语言和实时查询的自然搜索。\n\
  \n### 4.4.3 Pig](#C10_chapter4.xhtml#rsec4_4_3)\n\n这是一个使用其自带脚本语言在 `HDFS` 文件上执行 `MapReduce`\
  \ 的框架。`Apache Pig` 通常运行在 Hadoop 之上。它是一种分析海量 Hadoop 文件系统数据集的工具。我们必须首先将数据加载到 `Apache\
  \ Pig` 中，以便使用 `Apache Pig` 进行数据分析。本章介绍了如何将数据从 `HDFS` 加载到 `Apache Pig`。\n\n`Pig Latin`\
  \ 是在 Hadoop 中使用 `Pig` 分析数据的语言。它是一种高级数据处理语言，提供了丰富的数据类型和操作符，以执行不同的数据处理操作。程序员需要使用 `Pig\
  \ Latin` 语言编写 `Pig` 脚本，并使用任何执行机制（`Grunt Shell`、`UDFs`、`Embedded`）执行它，以便使用 `Pig`\
  \ 执行特定的任务程序。执行后，为了产生所需的输出，这些脚本将通过 `Pig Framework` 实现的一系列转换。\n\n在内部，`Apache Pig`\
  \ 将这些脚本转换为一系列 `MapReduce` 作业，使程序员的工作变得简单。`Apache Pig` 的架构如图图 4.7 所示。\n\n![图 4.7\
  \ Pig 架构。（https://www.tutorialspoint.com/apache\\_pig/images/apache\\_pig_architecture.jpg.）](img/fig04_07.jpg)\n\
  \n图 4.7 Pig 架构。（[`www.tutorialspoint.com/apache\\_pig/images/apache\\_pig_architecture.jpg`](https://www.tutorialspoint.com)。）\n\
  \n### 4.4.4 Scoop](#C10_chapter4.xhtml#rsec4_4_4)\n\n大数据是标准的软件管理系统，即使用 `RDBMS` 将应用程序与关系型数据库集成。这种由\
  \ `RDBMS` 生成的大数据存储在关系型数据库服务器的关系型数据库环境中。当 Hadoop 生态系统中的存储和分析器（如 `MapReduce`、`Hive`、`HBase`、`Cassandra`\
  \ 和 `Pig`）出现时，它们需要一种媒介与关系型数据库服务器连接，以导入和导出存储其中的大数据。\n\n在 Hadoop 生态系统中，`Sqoop` 占据着重要位置，为关系型数据库服务器和\
  \ Hadoop 的 `HDFS` 之间提供了可行的通信。这是在关系型数据库系统之间传输数据的方法。`Sqoop` 是 Hadoop 和关系型数据库服务器之间的数据传输工具。它用于从\
  \ `MySQL` 和 `Oracle` 等关系型数据库导入数据到 Hadoop `HDFS`，并从 Hadoop 文件系统导出到关系型数据库（见图 4.8）。这是一个解释如何在\
  \ Hadoop 生态中使用 `Sqoop` 的简要教程。`Sqoop` 是 Hadoop 和关系型数据库之间的数据传输方法。Apache 软件基金支持它。\n\
  \n![图 4.8 Scoop 架构。（https://www.hdfstutorial.com/wp-content/uploads/2016/07/Sqoop-architecture.png.）](img/fig04_08.jpg)\n\
  \n图 4.8 Scoop 架构。（[`www.hdfstutorial.com/wp-content/uploads/2016/07/Sqoop-architecture.png`](https://www.hdfstutorial.com)。）\n\
  \n### 4.4.5 Flume](#C10_chapter4.xhtml#rsec4_4_5)\n\n`Flume` 是一个标准的、快速的、可扩展的 Hadoop\
  \ 数据采集平台。它主要设计用于从各种源拷贝流数据到 `HDFS`。它是一种聚合日志文件的通用服务。`Flume` 是一种处理来自 Web 服务器大量数据的工具。图\
  \ 4.9 展示了现实中 `flume` 的结构。\n\n![图 4.9 Flume 架构。（https://media.geeksforgeeks.org/wp/uploads/Hadoop-Flume-Architecture.png.11/Hadoop-Flume-Architecture.png.）](img/fig04_09.jpg)\n\
  \n图 4.9 Flume 架构。（`media.geeksforgeeks.org/wp/uploads/Hadoop-Flume-Architecture.png`。）\n\
  \n\n\n\n\n从外部观察一个组织的数据需求，可能会认为定义信息就像告诉许多个人数据存储在何处一样简单。实际上，由于多种可能的原因，这个过程要复杂得多，原因如下：\n\
  \n*   公司规模巨大，没有人知道所有数据存储在何处，以及信息的价值是什么。\n*   公司可能是一个不利方，在提供可靠的数据信息方面不可信赖。\n*   公司被划分为不同的业务部门，且两个业务部门之间并不认可对方存储的数据。\n\
  \n该方法随后直接统一知识，并产生极具说服力的销售驱动型分析。事实上，研究人员可能会发现，大数据营销系统实际上由来自公司内外的更广泛的数据集组成。销售人员的台电脑或笔记本电脑可能有一系列平板电脑，以及一些旧版本的备份磁带或文件服务器上的共享文件夹。一个全新的\
  \ 2 年的 `Salesforce` 数据库可能已经过时，它仅仅是替换了之前员工自行开发并使用的数据库。运行 `HBase` 进行分析的 `Hadoop` 实例从社交媒体、`Salesforce`\
  \ 服务器和销售报告中接收过滤后的馈流数据。不同的团队必须管理所有这些数据源，在确定如何获取这些信息时，涉及到许多孤立相关信息的步骤。\n\n对于大型甚至中型企业来说，这种困境比医药销售案例要复杂得多。与关键业务所有者员工进行深度访谈可能需要几周时间，才能快速创建每个数据源以及这些系统内容的地图。某些组织可能有自己的数据库或大数据系统，这些系统可能也可能托管在集中存储库中。对于这些系统，备份可以在任何地方找到。知识保留政策会因部门而异，而且很可能因技术而异。数据仓库和其他聚合数据可能包含常规员工访谈无法透露的重要信息。\n\
  \n大数据证据可能与非大数据证据混合。在进行调查时，电子邮件、纸质文件和其他信息可能极具价值。识别大数据的过程与识别其他证据的过程非常相似，因此与其他证据结合，就可以执行此书中概述的识别过程。调查人员需要记住的一个重要因素是，是否应该从其他非大数据系统获取大数据，这样做是否合适，或者是否可以更容易地收集相同的信息。\n\
  \n#### 4.5.1 数据收集\n\n寻找需要收集的数据源是一个迭代过程。该过程包括收集数据需求、识别哪些系统可用、确定哪些系统包含符合需求的数据，以及评估在相关系统中收集数据的可行性。`Figure\
  \ 4.10` 详细展示了自顶向下的方法。\n\n![FIGURE 4.10 Top-down method.](img/fig04_10.jpg)\n\nFIGURE\
  \ 4.10 自顶向下的方法。\n\n详细数据收集过程涉及整合来自客户访谈的所有信息并收集文档，以形成详细的计划和数据收集标准。规范应使用任何人都能理解的清晰直接的语言。使用高度技术或法律语言的复杂规范可能会导致研究人员与数据收集人员之间产生误解。确保说明需要获取的数据类型的相关事实，并明确提到支持文档的所有要求和标准。\n\
  \n如果系统包含半用数据，则有必要回答以下几个问题：\n\n*   该半用数据源是所需数据源之间的桥梁，还是用于填补空白或修复所需数据中的缺陷？\n*   所需的数据源是否包含可以解决所有事实的信息？如果没有，剩余的事实是否有任何被半用数据源涵盖？\n\
  *   收集半用数据所需的精力较小，信息量是否可控？\n\n如果这些任何一个问题的答案为“是”，调查人员必须考虑将半用数据纳入数据收集中。解释如下：\n\n*\
  \   半用数据在允许使用必要数据进行研究方面起次要作用；\n*   半用数据实际上是必要的；\n*   数据收集的影响很小，包含这些数据并无害。\n\n在数据收集过程中发现的任何无关信息，调查人员都应仔细考虑。在初始阶段，不收集数据的危险是由于没有机会；在后期阶段，数据可能会成为障碍。\n\
  \n在确定以下内容时，考虑源是否为冗余：\n\n*   该信息对于另一个源来说是冗余的吗？\n*   数据中包含了哪些信息？\n*   数据在以后还会存在吗？\n\
  \n即使数据源是冗余，调查人员也将报告这些问题的答案。如果在后期阶段提出了任何问题，记录原因将提供清晰的答案。\n\n#### 4.5.2 结构化与非结构化数据\n\
  \n大数据包含了结构化和非结构化数据的原理。然而，在收集大数据时，两者之间的界限可能会变得极其模糊。大数据系统中可能存储结构化和非结构化数据。调查人员必须理解这些形式之间的区别，以及是否有必要以结构化或非结构化的格式收集数据。结构化数据具有更简单分析的优点，但它的速度可能较慢，并且为捕捉原始形式的非结构化数据提供了更多材料。\n\
  \n大数据系统可以包含多种形式的数据。可以在 `Hadoop` 中导入、存储和查询非结构化文本文件。这些非结构化数据可以转换为结构化形式与其他数据源结合。调查人员应该意识到要识别和收集的不同数据结构。\n\
  \n在后期结构化数据分析的框架下，有几种非结构化或半结构化数据。例如，出于会计目的，企业的用户必须维护一组受限或标记的文件。虽然这些文件在技术上被认为是非结构化的，但它们包含了结构化数据。仅仅因为它们存储在非结构化的文件格式中就忽略这些文件是不明智的。或者，汇总表格将其转换为标准格式进行审查是重要的。`Table\
  \ 4.2` 显示了分隔文件中的格式。\n\nTABLE 4.2 数据格式\n\n| **CustNum** | **Name** | **Address 1**\
  \ | **City** | **State** | **Zip** | **Notes** |\n| --- | --- | --- | --- | ---\
  \ | --- | --- |\n| 1000011 | John Doe | 123 Mani Street | Centreville | VA | 55555\
  \ | Paid on time |\n| 1000012 | Jane Doe | 123 Mani Street | Centreville | VA |\
  \ 55555 | Delinquent follow-up required |\n| 1000013 | Joe Doe | 456 Center Road\
  \ | Anytown | GA | 55554 | N/A |\n\n\n\n\n\n| 1000014 || Jill Doe || 456 Center\
  \ Road || Anytown || GA || 55554 || Call 5551230002 |\n\n非结构化数据不具备结构化数据具有的相同规则和组成限制。这种刚性和结构的缺失使得数据能够以多样化的方式进行存储和呈现。最常见的非结构化数据形式包括：\n\
  \n- 电子邮件，\n- 演示文稿，\n- 视频和音频文件，\n- 文本文档（例如 MS Word 文档和 PDF 文件），\n- 图形文件，\n- 可执行二进制文件（例如\
  \ `Windows.EXE` 文件）。\n\n这些文件中的许多类型（包括非结构化或半结构化数据）可能包含结构化信息。客户访谈将允许调查人员决定是否应该收集这些文件，以及是否存在结构化或非结构化的数据收集方法。例如，非结构化文本文件可以存储在\
  \ `HDFS` 中，但这些信息可以通过 `Hive` 或 `Sqoop` 以结构化的形式进行收集。调查人员还必须决定如何检查收集的数据，在收集整个非结构化归档时，这样做更为简单。\n\
  \n#### 4.5.3 数据收集类型\n\n可以将数据收集分为两个主要大类。接下来，调查人员必须进行数据收集。在这种情况下，通过访问源系统，调查人员进行取证编译并收集数据用于离线分析。相反，在某些情况下（如民事诉讼），检察官可以要求设备所有或第三方收集数据。在这些情况下，在收集过程中，调查人员可以监督、建议或仅作为被动参与者。\n\
  \n调查标准决定了选择何种替代方案。由调查人员进行的收集具有执行准确且可验证的优点。调查人员知道需要收集哪些数据，并使用最佳实践来执行收集。由于调查人员是中立的，这套方案不太可能受到质疑。由公司或第三方主导的选择具有可能成本更低且对组织危害较小的优点。缺点是收集可能执行得不正确，数据可能被无意或刻意篡改，且收集可能无法以最快速度完成。决定由谁执行收集的最终裁决者是个人调查标准，例如调查问题、时间限制和成本因素。\n\
  \n### 4.6 证据监管链文档记录\n\n在收集证据后，必须建立监管链文档记录。如果收集是由内部人员或第三方执行的，执行收集的人以及任何获取证据的人都必须填写监管链表。监管链文档记录是按时间顺序排列的历史，显示了谁拥有证据。在刑事案件和民事案件中，这对于确定谁接触过证据以及谁可能操纵过证据都是必要的。每当双方之间共享信息时，转换发生的时间以及参与者；监管数据链都应更新并记录。[图\
  \ 4.11] 显示了监管记录审查链。\n\n![图 4.11 监管链表。 (https://www.wada-ama.org/sites/default/files/styles/resource_thumbnail_small/public/pdfpreview/038a227e1ef789b61142328c7d051.jpg?itok=l3dFA4WK.)](img/fig04_11.jpg)\n\
  \n图 4.11 监管链表。（https://www.wada-ama.org/sites/default/files/styles/resource_thumbnail_small/public/pdfpreview/038a227e1ef789b61142328c7d051.jpg?itok=l3dFA4WK。）\n\
  \n### 4.7 结论\n\n数据识别步骤是一个识别有关潜在相关数据信息的迭代过程。数据识别包括使用可访问源、部分和部分。接下来，信息分类包括可访问源。大数据系统是海量的，收集\
  \ PB 级的数据很少，因此在决定哪些数据时需要谨慎，这种数据在过程完成后可能可用。\n\n\n\n\n\n### 5.4.3.1 物理完整性\n### 5.4.3.2\
