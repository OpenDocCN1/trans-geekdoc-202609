  #### 3.11.3 神经网络\n\n### 3.12 结论\n\n### 参考文献\n#### 3.1 引言\n大数据是一个用于描述结构化和非结构化数据的海量增长和可用性的流行术语（Sas\
  \ 2000），其大规模数据使用作为服务和制造业领域战略制定者、决策者和专家辅助。这个讽刺性的术语无疑是一个礼物，因为它具有基于技术的特征以及用于数据收集和实时数据使用的海量存储容量，通过清晰的愿景在医疗保健领域创造了其重要性。医疗保健中的大数据应用有助于开发各种变量；在紧急情况下有效包含的解决困境问题的许多替代方案和答案被称为催化剂。由于医疗保健领域的增长，医疗保健部门对大数据也有需求。\n\
  \n\n\n\n分析师必须从可用源收集各种量的数据，以做出有节奏且有效的决策。这还包括其他各种事件，如数据加载、数据集成、检查、查询、对收集到的数据进行报告和可视化，在经过适当验证后，需要从中收集有效数据并将其分组为数据集。\n\
  \n### 第 3 步 数据清洗与预处理\n这一步涉及选择、清洗、构建和格式化数据等各种事件，以将数据集转换为适当格式。在大数据分析的所有步骤中，这一步耗费的时间最长。\n\
  \n### 第 4 步 数据剔除与投影\n这一步是应用复杂的智能方法从数据中提取模式，例如关联、分类、预测、聚类和时间序列分析等任务。\n\n### 第 5 步\
  \ 目标与数据挖掘方法的匹配\n在这里，分析师必须将业务需求与数据集中实际情况进行匹配，从而对业务需求流程及其要求有清晰的理解。在明确理解后，业务专家可以对进一步的操作做出继续或不继续的决策。\n\
  \n### 第 6 步 算法和数据模式的选择\n大数据以不同的格式存在，为了创建一个独特且易于机器的格式，用户必须在挖掘过程中对数据进行转换，该过程分为两个步骤：\n\
  \n#### 数据映射\n这是将数据元素从源数据库分配到目的地的步骤，以捕获转换。\n\n#### 代码生成\n实际转换程序的创建被称为代码生成。\n\n###\
  \ 3.3.1 模式开发\n在这里，分析师必须采用各种技术来提取各种模式，并发现它们在近期或未来的潜在用途。这些技术通常在以下领域有应用：\n\n*   将与任务相关的数据转换为模式，\n\
  *   使用分类/表征来决定模型的目的。\n\n### 3.3.2 评估与解释\n分析师在这里必须识别并选择基于知识且能够衡量兴趣程度的最佳模式。如果一个模式具有潜在用处、普通人易于理解，并为假设提供有效性以及对新数据提供确认，则该模式可以被认为是有趣的。\n\
  \n### 3.3.3 结果与应用\n整个过程的最终结果是从数据挖掘中获得的信息并呈现给用户。用户必须使用不同的知识表示和可视化技术向用户提供输出。\n\n大数据领域中数据分析和数据挖掘的最终结果有时会成为朋友，有时又会通过在其应用领域创造各种挑战而变成敌人。\n\
  \n### 3.4 机会产生与医疗保健领域的数据\n由于云端和其他设备中可用大数据信息的访问性和使用性，大数据已成为医疗保健领域的一个好朋友。大数据在医疗保健管理中的应用描述了关于患者医疗记录的可用信息；当前的健康状况（用于计划和修复目标患者参与健康管理）；顺畅的疾病识别以及处方管理计划。医学专家和医生需要这个工具来更好地管理和理解患者。该工具在医疗保健领域有许多积极的需求和应用，如下所示：\n\
  \n#### 3.4.1 价值创造\n由于具有许多特征，大数据是医疗保健领域的一个增值工具，例如：\n\n1. **透明度**\n   医疗保健数据的开放可用用于医疗保健策略的启动、开发、关闭和重新开启以及医疗保健系统的形成，这是大数据的一个非常好的特征，被称为透明度。这一特征有助于分析各种功能，并保持医疗保健市场的质量、低成本和更短的时间消耗。\n\
  \n2. **支持工具**\n   该工具支持医疗保健促进者在每个地点进行解读和分析，并就特殊事件做出最终决策以实现他们的目标。\n\n3. **医疗保健系统分段**\n\
  \   业务规划者在开发新产品时，需要医疗保健系统的划分/分段，因此在大数据的支持下对微观和宏观层面的患者信息进行收集并进行分段。\n\n4. **嵌入式传感器**\n\
  \   医疗保健分析师/医生需要实时信息来制定策略，通过分析分析数据集和嵌入式传感器收集客户反馈。\n\n5. **降低成本**\n   大数据通过存储大量数据、识别适当流程以及医疗保健需求，为医疗保健和酒店业带来了成本降低和开支减少。\n\
  \n6. **更快速、更好的决策**\n   新数据源分析有助于立即分析信息并明智地做出决策，这些决策基于他们的学习。\n\n7. **新产品与服务**\n \
  \  新产品开发需要关于客户需求及其用性的信息，以及产品的各种特征以及如何可能增加价值。客户环境分析的需求可以通过大数据的帮助轻松完成。\n\n8. **改进定价**\n\
  \   大数据有助于利用医疗保健智能工具，并根据其可用性提供一个酒店业变得更加复杂的清晰图景。\n\n9. **关注本地偏好**\n   中小型企业必须关注本地环境以提供其餐饮服务以及其可用和潜在产品。大数据有助于进一步提供本地客户的喜好和偏好。当业务了解客户的偏好并结合个性化触达时，将获得竞争优势。\n\
  \n10. **增加销售和忠诚度**\n    大数据分析是通过数字足迹（如在线浏览和社交渠道发布）针对精确患者用性的提供。\n\n11. **招聘和培养医生和其他促进者**\n\
  \    关于医疗保健部门提供的各种服务的可用数据以及其优劣，将用于未来医生和其他促进者的招聘和选择，这将为患者创造一个友好的环境，让高效且卓越的医生治疗患者，使其从疾病中轻松释放，并实现资金增值，为特定医院创造品牌价值。\n\
  \n### 3.5 大数据与医疗保健领域面临着诸多挑战\n\n\n\n\n根据 NewVantage Partners 的《2017 年大数据高管调查》，只有\
  \ 48.4% 的大数据承接项目实现了其目标，这显示了大数据领域面临的挑战/问题。这种辅助工具在数据的采集、处理、存储、分析和可视化方面存在着许多问题。有时，大数据在数据分析领域也存在问题，由于市场和技术变化快速，且缺乏标准的统计和软件，导致为问题开发模型解决方案/结果变得非常困难。医疗保健领域的大数据正面临许多问题和挑战，这些问题可以通过数据挖掘的帮助来检索。挑战和问题如下。\n\
  \n### 3.5.1 规模（Volume）\n\n“大数据”这个名称本身就说明了海量信息，其规模超过了典型数据库软件工具采集、存储、管理和分析海量数据的能力，这增加了分析和解释的风险和难度，从而难以制定成功的医疗保健策略。因此，大数据分析领域的专家专家（Ketchersid\
  \ 2013）正确地指出：“大数据是必要的但不是充分的；如果数据不能以一种产生未来洞察的方式进行分析，那么简单地堆积大量数据集是没有价值的”，因为它们无法进一步投入使用。\n\
  \n### 3.5.2 多样性（Variety）\n\n业务环境分析需要各种类型的数据。在大数据中，大量的数据源，但并非所有来源都是有效且可靠的。有时不必要的数据会浪费时间和金钱，并导致决策中产生管理偏误的挑战。\n\
  \n### 3.5.3 速度与多样性（Velocity and Variety）\n\n不同维度的信息和大数据流并非处于固定位置；也就是说，它们是变化的，这为业务分析师的解释和分析带来了挑战。在进行任何数据解释之前，需要检查数据质量和可用性。病态且令人恐惧的数据会导致软弱的决策。\n\
  \n### 3.5.4 数据发现（Data Findings）\n\n从海量的网络采集中获取高质量数据是困难的。数据分析师必须注意在采样时确保涵盖了相关领域，并且无法避免数据完备性的挑战。有时，数据分析师从不完整的数据中收集样本，可能无法做出恰当决策。\n\
  \n### 3.5.5 隐私（Privacy）\n\n有时对个人生活的调查会为收集真实可靠的数据制造障碍，而大数据的使用可以帮助从各种数据集和网站获取数据，用于解释和制定策略，而无需干预人们的隐私。\n\
  \n### 3.6 数字化大数据与医疗保健问题\n\n数据处理是收集结构化数据以供进一步分析的过程，即在电子表格或静态软件中的可用数据。数据集开发导致了数据的分析和解释，这应该由该领域的专家进行测试；随后，它还面临处理过程中的问题，如下：\n\
  \n1. 大数据分析实际效益的可用性\n   根据 Joshi 和 Yesha (2012) 的观点，“大数据包含结构化数据和非结构化数据，其中包含医疗保健实际效益主题的非结构化数据是自然语言和手写数据，这在某种程度上增加了集成、分析和存储的困难”。\n\
  \n2. 方法论问题，如数据质量、数据一致性、不稳定性和各种限制，是分析观测的有效性以及法律问题。\n\n3. 缺乏数据库升级以及技术和计算机素养。\n\n大数据及其局限性不容忽视。通过识别这些局限性，Wong\
  \ 等人（2011）通过研究认为，完整的案例分析会消耗时间，并减少了用于有效利用的数据点，从而针对所出现的问题获得有效的解决方案。高维数据集（也被称为维度灾难）在大数据的应用中产生了问题。在这些想法的支持下，理查德·贝尔曼（Richard\
  \ Bell Man）曾正确地给出：“优化数据集存在困难”。Alyass 等人（2015）在研究后对数据分析领域大数据的使用留下了良好印象，因为由于数据集的不同维度，它可以为问题提供逻辑上的解释和发现。\n\
  \n酒店管理中的大数据正受到决策偏误问题的困，这很难控制。在这里，Slobogean 等人（2015）强调了大数据问题，在他们看来，“临床研究（无论是观察性的还是干预性的）往往缺乏为其研究问题提供可靠答案的能力，因为样本量不足，效能不足的研究受到多种偏误来源的影响，可能代表更大的群体，并且在通常无法检测到治疗组之间的差异，最重要的是，效能不足的研究会导致错误的结论”。\n\
  \n#### 3.6.1 有效通信与安全数据存储\n\n许多患者不想分享他们的个人数据，以避免干扰个人生活、影响预约和获取保险。所有关于个人数据保护权利都应有相应的法律规定。\n\
  \n#### 3.6.2 普通民众数据的可用性\n\n所有存储的数据/基于网站的数据/云端的数据可能无法在网站上供所有人使用，由于内部调查和知识产权的原因，这给普通民众获取信息带来了挑战。\n\
  \n#### 3.6.3 逻辑数据\n\n有效且合理的数据应该放在数据中心。为医疗保健部门收集的手工数据可能存在错误和人为偏误。对于人类医疗中心的有效/科学数据，应该有特定的指令和指南，并由监管机构来控制数据。\n\
  \n#### 3.6.4 医疗保健数据的有效通信\n\n数据存储与数据用户之间的数据通信应通过开发带有数据集和质量标准的共享平台有效进行。\n\n#### 3.6.5\
  \ 数据采集\n\n数据有其分析的需求，它是根据满足分析师目标的要求而收集的。收集的数据可能是类别的/数值的。已经采取了多种来源来收集数据，例如环境中的技术人员传感器、交通摄像头、卫星和录制设备。也可以通过面谈、阅读文档和下载在线资源来进行。这一阶段包含了混淆的事实和观点，这在数据分析步骤中产生大问题，因为有效分析需要相关事实来回答问题和测试假设，但来自不同观点的事实可能具有不同的结构或特征。\n\
  \n##### 3.6.5.1 数据源对齐\n\n\n\n\n捕获和收集的数据必须以组织的方式进行分配，因为收集的数据可能是不完整的、包含重复或包含错误。为了避免这些错误，需要进行数据清洗，这是一项防止错误、匹配记录和识别不准确数据的过程。在数据清洗之后，必须通过各种技术进行分析，但低效的清洗会导致数据对齐错误，从而产生错误的结果。这种数据源对齐受到认知偏误的影响，这些偏误会对分析产生不利影响。个人可能会不信任不支持其观点的信息。\n\
  \n### 3.6.5.2 适用于合适分析的数据算法\n\n各种数学公式被应用于数据中，以识别变量之间的关系，例如`correlation` 和`regression`，但用户在应用任何算法之前，应该清楚特定公式及其应用场景，以避免负面结果并为近的未来采取预防措施。\n\
  \n### 3.6.6 理解输出以及面向终端用户的可访问性\n\n数据分析通过多种数值技术进行，其结果以数值格式呈现；然而，受众可能并不具备此类数字素养。\n\n\
  任何使用大数据的组织管理都面临着安全和隐私、治理和伦理标准以及适当审计等挑战。\n\n##### 3.6.6.1 隐私与秘密\n\n组织必须保持其与其他业务部门竞争竞争优势的某些机密性。当为了战略制定进行数据挖掘时，云计算与大数据形象之间形成了一种联盟，这产生了诸如数据泄露、完整性、可用性和备份等问题。\n\
  \n##### 3.6.6.2 治理与伦理标准\n\n组织的良好治理需要云计算，而大数据分析旨在在需要时提供数据，但由于资源不足，缺乏其动态特征。与生产算法和当前算法相关的大数据在云端不可用，这为管理人员的有效治理带来了挑战。用于良好治理的算法也因人而异，并随其最终结果的可靠性而变化。\n\
  \n### 3.6.6.3 适当的审计\n\n管理层应该进行适当的审计，以测试大数据领域所用数据的可靠性和相关性。但有时，基于网络的数据黑客及其滥用可能会增加不合规个人的权力，并由于普通人的遭受而损害整个业务环境。\n\
  \n### 3.7 针对未来大数据医疗的预防尝试\n\n大数据的各种优势和支持使其发展成为一种辅助工具并强调了其重要性。大数据的重要性和用途迫使各种组织和政府采取预防尝试，例如针对遗传和慢性疾病的数据存储、保密以及基于网络的医疗保健。现在，由于海量的数据存储和相关信息，人们可以发现数据存储建设和启动的热潮，以便在公共健康观察、医药管理和开发领域提供更好的款待和服务。\n\
  \n#### 3.7.1 数据保密\n\n数据存储和启动是一项非常困难的任务。它需要巨大的存储空间来维护机密性和对个人数据的保护。\n\n#### 3.7.2\
  \ 基于网络的医疗保健\n\n大数据帮助管理、处方和药物领域的医生。\n\n#### 3.7.3 遗传性与慢性疾病\n\n大数据存储了关于遗传演变疾病和各种慢性疾病的海量信息，以及它们的症状、预防措施和处方。\n\
  \n### 3.8 法医学与大数据\n\n法医学是一项控制非法、违法和非真实事件的逐步行动。当大数据面临伦理和信息秘密的严峻挑战时，这些法医工具可以在受限时间内控制大数据，从而作为解决大数据挑战的良好助手。\n\
  \n数字取证是一种工具，它通过根据有效数字证据的存在来真实地确定事件发生的状态提供证明。\n\n### 3.9 数字取证的类型\n\n数字取证分为数字图像取证、移动设备取证、易失取证、内存取证、网络取证、反取证、应用取证、文件系统取证、取证框架和大数据取证。\n\
  \n#### 3.9.1 数字图像取证\n\n数字图像取证是一种通过识别其历史来提供图像有效性和真实性的工具。该工具验证了两个问题：\n\n*   确定创建图像的成像设备，\n\
  *   定义伪造的痕迹。\n\n\n\n该工具通过基因组分析、预测、欺诈分析、预定义的远程监控以及患者分析提供帮助（Sinha, Hrispcsak & Makatou\
  \ 2009）。\n\nPatil 和 Seshadri (2014) 讨论了大数据如何用于医疗保健领域以降低成本，同时改进护理流程和交付管理。为了消除医疗保健中的大数据挑战，可以使用`big\
  \ data forensics`（大数据取证），这是一种可以帮助识别、定义、收集和存储以数字形式存在的犯罪证据的工具，并采取相应的预防和治疗措施。数字取证工具通过其多个步骤执行其功能（Slobogean\
  \ et al. 2015）。数字取证过程中涉及的步骤包括提取数据及其定义和分析，具体如下。\n\n### 3.9.2 流程启动的提取数据\n\n专家/检验员必须在海量数据可用的情况下启动流程，并在数据被复制进行测试后对系统数据进行复制。在这种情况下，他们所搜索的数据被称为提取数据（drawn\
  \ data）。\n\n#### 3.9.3 大数据分析\n\n##### 3.9.3.1 定义\n\n检验员必须对数据进行测试并发现相关性；然后检验员将其归入不同的文档测试中；如果在范围内，则继续工作；否则则停止。\n\
  \n##### 3.9.3.2 解释\n\n在这里，检验员必须对所有数据发现结果给出详细描述。该分析将包含个人的参与情况、个人所处的地点、花费的总时间，以及被修改/删除和访问/复制的具体时间数据。有必要在编写所有报告时考虑到普通人易于理解的因素。\n\
  \n##### 3.9.3.3 大数据框架\n\n专家/分析师正在研究以寻找一种合适的框架，以便这两个领域能够轻松地执行其功能，并为大数据用户带来便利。但目前为止，他们尚未成功。\n\
  \nTahi 和 Iqbal (2015) 使用不同的技术对来自大数据的司法数据进行分析，例如`MapReduce`、发育树和盲源分离（Zaward & Hasn\
  \ 2013），但根据其结果，他们得出法医学科学和大数据在医疗保健领域面临挑战。\n\n#### 3.9.3.4 医疗保健海量数据的取证工具需求\n\n有效管理的积极结果表明，在大数据存储及其有效应用方面，需要数字取证科学。市场上使用了某些取证科学工具来有效处理大数据安全。\n\
  \n### 3.10 数字取证分析工具\n\n数字取证分析工具有助于解释、收集数据，以保护证据免受调查影响并进行存储以备后续行动。工具如下。\n\n#### 3.10.1\
  \ AIR（自动化镜像与恢复）\n\n这是一种用于开发取证镜像的开源实现。它的特点是用户友好且能减少“误操作”带来的风险。\n\n#### 3.10.2 Autopsy\n\
  \n这是一种用于图形处理的数字取证工具，可以从设备中恢复丢失的照片和视频。它有助于企业、执法部门、军事代理和公司。由于具有以下特点，该工具非常易使用：\n\n\
  * 功能多样的操作\n* 快速完成尸检分析\n* 成本效益高/节省时间\n\n#### 3.10.3 Windows 取证工具\n\n该表用于 Windows\
  \ 的注册及其评估。它通过过滤器和时间戳工作。\n\n#### 3.10.4 数字证据与取证工具包\n\n该工具采取治疗措施来防止欺诈和犯罪。在这里，目标是保护硬盘和\
  \ U 盘等不安全的设备保护系统。该工具不仅用于医疗保健领域，对于检测人类普通生活中的欺诈也具有更重要的用途。\n\n#### 3.10.5 EnCase\n\n\
  这种取证工具通过其各种概念在时间和生命页面方面具有多种用途。\n\n#### 3.10.6 Mail Examiner\n\n该工具用于解释各种电子邮件。在这里，范围从个人邮件等网站进行了扩展。\n\
  \n#### 3.10.7 FTK\n\n该工具用于通过取证工具的帮助解释各种硬盘中可用的各种数据来发现犯罪。\n\n#### 3.10.8 Bulk Extractors\n\
  \n该工具从输出目录收集信息，该目录以硬盘格式存在，并提供有关信用卡、电子邮件邮件、图像和电话号码的信息。\n\n#### 3.10.9 Pre-Discover\
  \ 取证\n\n这是一种强大的工具，帮助专业人士在真实性和安全性的下找到磁盘中的隐藏数据。它具有利用自身技术恢复删除文件的能力。\n\n#### 3.10.10\
  \ CAINE\n\n该工具是由`Linux` 开发的软件，有助于为安全数据的提供提供取证科学技术标准。它是一种用于移动网络和数据恢复的用户友好型取证工具。\n\
  \n#### 3.10.11 Xplico\n\n这是一种用于网页、图像和 Cookie 软件重建的取证工具。\n\n#### 3.10.12 X-Ways Forensic\n\
  \n该工具开发了一个先进环境，用于收集海量数据资源，并通过极快的访问速度对删除的文件进行恢复。\n\n#### 3.10.13 Bulk Extractor\n\
  \n这是从文件和硬盘提取信息的有用元素，因此，它是一种可以忽略文件层次即可执行扫描的工具。\n\n#### 3.10.14 数字取证框架\n\n这是一种基于编程构建的开源计算机取证平台，具有易于使用和自动化的特点。对于专家和普通人用户来说，它都是访问数据安全和发现数据盗窃犯罪活动的重要工具。\n\
  \n#### 3.10.15 Oxygen Forensics\n\n该工具有助于从云服务和移动设备中提取数字证据，并通过访问这些设备收集犯罪活动、数据盗取和欺诈。\n\
  \n#### 3.10.16 Internet Evidence Finder\n\n该工具专为司法实验室的司法检验员设计，能够访问 2000 多种互联网伪证，并从社交网络网站、云端、网络邮箱和备份中恢复更多数据。它工作非常快，可以实现快速搜索。\n\
  \n### 3.11 应对大数据挑战的其他工具\n\n技术在法医学和大数据方面的应用为大数据挑战提供了许多解决方案，而且，技术的快速发展可能会改变未来的各种技术和方法，这些方法在今天具有其可用性和重要性。最常用的技术如下：\n\
  \n\n\n\n\n1. MapReduce 技术\n2. 决策树\n3. 神经网络\n\n### 3.11.1 MapReduce 技术\nMapReduce\
  \ 技术应用于数据以并行格式流动的场景，此时可用数据集之间之间建立建立的关联，用以发现关于伪造和非法物品的证据。所分析的数据必须通过逻辑关系来缩减大数据的映射视界。通过缩小映射（map）可以创建已建立的关联并作为辅助工具。在这里，分析的数据必须通过算法的内涵，在不丢失其原始性的情况下最小化巨大的数据集。\n\
  \n#### 3.11.2 决策树\n决策树是一种通过开发欺诈检测软件来寻找大型统计数据集的技术/方法。在该领域，在有海量数据集可用的情况下，很难怀疑或识别出具有伪造或犯罪活动的文件。尽管如此为止，该决策树领域尚未开发出任何自动化系统。\n\
  \n#### 3.11.3 神经网络\n神经网络适用于识别网络取证中困难的模式。在这里，网络系统必须从文件快照中获取训练，以进行进一步的分析。这是数据集流量控制的一种非常好的仪器或工具。\n\
  \n### 3.12 结论\n大数据是最好的策略制定工具，它为策略制定提供辅助支持，并为制造业和服务业部门提供服务，特别是医疗保健部门，该部门利用其使用和实施来实现增长、发展和可持续性。商业世界所有部门的业务分析师和战略开发人员应该寻求大数据数据集的帮助，以便其在市场中易于增长和保持可持续，但同时他们应该实施取证科学工具并升级技术以采取预防措施，以克服大数据的挑战。真的，在这里可以得出，大数据是一个非常好的朋友，为一般服务部门尤其是医疗保健部门提供了增值服务和最大的消费者满意度，但其挑战可以通过利用更新的技术和基于科学的取证数据工具来克服。\n\
