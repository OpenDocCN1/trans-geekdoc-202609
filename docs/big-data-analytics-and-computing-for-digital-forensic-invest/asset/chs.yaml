  #### 5.7.2 代码揭秘\n#### 5.7.3 评估\n## 5.8 大数据安全：未来方向\n## 5.9 最终建议\n## [参考文献]\n\n###\
  \ 5.1 引言\n\n#### 5.1.1 大数据真的大吗？\n\n大数据是一个应用于许多不同数据集的新领域，其规模无法通过通用的软件工具来及时管理、捕获和分析海量数据。\n\
  \n近期的行业趋势显示，数据增长率每 2 年翻一倍，在明年来的 2020 年将达到 40,000 艾字节（IDC 2012）。大数据并不是一种技术，而是来自各种来源的异构形式数据的集合，例如业务交易日志、系统日志、传感器、视频和图像、社交媒体和医疗交易，以及几乎所有数字形式的数据。随着物联网（IoT）的出现，大数据产生了巨大影响并引起了更多关注，各种类型的设备连接到互联网并产生巨大的数据池，这些数据需要转换为意义信息。此外，公共云服务通过按需提供软硬件让人们更加方便，并产生了密集的并行数据处理和高计算能力。因此，支持大数据相关应用的各种类型和大量数据（2Vs：数量和多样性）使得安全和隐私问题日益突出。\n\
  \n随着大数据在公共云帮助下扩展，为私有计算基础设施定制的传统安全解决方案（受限于定义的安全边界，如防火墙和非军事化区 DMZ）已不再有效。在使用大数据时，安全功能需要跨越多种硬件、操作系统和网络域的异构组成工作。在这种高级计算环境中，软件定义网络（SDN）的重要特征使得大数据服务能够在异构基础设施之上运行。SDN\
  \ 的抽象形式将受控制和监督的基础设施与高层控制平面分离。与分离路由器和交换机等网络物理组件并通过设备低级配置（通过设备制造）进行功能编码的传统网络不同，网络管理员编写高级控制程序。\n\
  \n使用 SDN，可以在逻辑中央控制器中实现安全功能的智能管理，从而简化以下方面：安全规则的实施、系统（重）配置和系统演进。\n\n通过分级控制器或使用冗余控制器，可以减轻中心化\
  \ SDN 解决方案的缺点。\n\n为了实现更安全的通信和计算，美国国家标准与技术研究院（NIST）针对不同组织发布了一系列法规和指南。这是通过对系统基础设施在风险评估、响应能力、攻击恢复和威胁防护方面进行系统性验证来实现的。遵循最后的验证原则，国防高级研究计划局（DARPA）正在创建一个名为“挖掘与理解软件飞地”（MUSE）的计划，以增强美国军用软件的质量。该计划旨在产生更健壮的软件，能够处理大数据集，而不会在海量信息下导致错误或崩溃（DARPA\
  \ 2014）。此外，安全和隐私正成为需要解决的大数据紧迫方面（Agrawal, Das, & El Abbadi 2011）。为了说明这一点，社交网络让人们能够以简单的方式分享和分发受版权保护的数字内容。因此，版权侵权行为，如非法复制、恶意分发、未经授权的访问和使用以及版权内容的免费共享将变得更加普遍（Marques\
  \ & Serrão 2013）。此外，用户通过移动设备和计算机向社交服务分享更多个人数据和用户生成内容（UGC），失去了对数据的控制。最后，一种可能很有前景的方法是在所谓的移动目标（MT）中通过动态更改系统属性来为攻击者增加额外的不确定性（Okhravi,\
  \ Hobson, Bigelow & Streilein 2014）。他们总结了几种 MT 技术，考虑了每种技术的优缺点，并对该领域的未来研究提出了建议。\n\
  \n### 5.2 大数据对信息安全和隐私的挑战\n\n随着各种网络中设备以及设备之间连接数量的增加，收集、存储和处理的数据量每天都给信息安全带来新挑战。目前的安全机制（如防火墙和\
  \ DMZ）不足以应对大数据环境，并扩展到当前组织网络之外，以满足数据移动性和诸如自自带设备（BYOD）等政策。因此，考虑到这些情景，相关的问题是：“针对大数据，有哪些合适的新策略和技术可以处理隐私和安全需求？”（云安全联盟\
  \ 2013）。整个内容可以分为四类大数据：基础设施安全、数据管理、数据隐私和响应性安全（例如，监控攻击和异常）。\n\n在大数据中，需要解决一系列风险领域，例如信息生命周期（数据分类、所有权和出源）、采集过程、数据创建以及安全程序的匮乏。大数据的安全目标与其他类型并无区别，即保护其可用性、完整性和机密性。\n\
  \n由于大数据如今是一个复杂且重要的话题，影响信息安全的数据 6V 特自然会产生安全和隐私挑战（Michael & Miller 2013, Tankard 2012）：多样性（variety）、数量（volume）、速度（velocity）、价值（value）、可变性（variability）和真实性（veracity）（图\
  \ 5.1）。这些因素直接影响了处理所有特征所需的设计、实施和安全解决方案（Demchenko, Ngo, Laat, Membrey & Gordijenko\
  \ 2014），但遗憾的是，目前还没有这样的现箱解决方案。\n\n![图 5.1 大数据的六个 V。（改编自“IBM 大数据平台 – 将大数据引入企业” 2014）](img/fig05_01.jpg)\n\
  \n\n\n\n\n# 图 5.1 大数据的六个 V。（改编自“IBM 大数据平台——为企业带来大数据”，2014 年。）\n\n云安全联盟（Cloud Security\
  \ Alliance, CSA）是一个非营利组织，它在云计算环境中创建了一个大数据工作小组，旨在为解决实施大数据服务时面临的主要挑战提供高标准的安全保障（云安全联盟，2013\
  \ 年）。CSA 将安全和隐私挑战分为了大数据生态系统的四个不同方面：基础设施安全、数据隐私、数据完整性与管理，以及响应式安全。根据 CSA 的说法，这些方面面临着以下挑战：\n\
  \n*   **基础设施安全**\n    1. 确保数据分布式处理的安全，\n    2. 非关系数据库的最佳安全实践措施。\n*   **数据隐私**\n\
  \    1. 包含使用保护数据隐私的数据挖掘进行数据分析，\n    2. 使用加密的数据安全解决方案，\n    3. 细粒度访问控制。\n*   **数据完整性与管理**\n\
  \    1. 存储和事务日志安全，\n    2. 细粒度审计，\n    3. 数据溯源。\n*   **响应式安全**\n    1. 端到端过滤与验证，\n\
  \    2. 实时安全级监控。\n\n这些关于大数据生命周期的安全和隐私挑战涵盖了整个范围。图 5.2 显示了生产中的数据（物联网设备）、数据本身、数据处理、数据存储、数据传输以及不同设备上的数据使用。\n\
  \n![图 5.2 大数据生态系统中的安全与隐私挑战。（改编自云安全联盟 2013 年。）](img/fig05_02.jpg)\n\n图 5.2 大数据生态系统中的安全与隐私挑战。（改编自云安全联盟\
  \ 2013 年。）\n\n大数据安全隐私的一个特殊方面与物联网（IoT）的兴起有关。牛将物联网定义为“互联网的一项建议发展，其中日常物品具有网络连接，允许它们发送和接收数据”，这已经成为现实——Gartner\
  \ 估计到 2020 年将安装 260 亿物联网设备，产生 300 亿美元的增量收入（Rivera & van der Meulen 2014）。连接设备（汽车、照明系统、冰箱、电话、眼镜、交通控制系统、健康监测设备、数据采集和数据采集\
  \ (SCADA) 系统、电视、家庭安全系统、家庭自动化系统等）数量的巨大增长，促使制造商在短时间内向市场投放了大量设备、云系统和移动应用程序，以利用这一机会。虽然这为终端用户带来了巨大的收益和机会，但也引发了安全挑战。\n\
  \nHP 最近对市面上可物联网解决方案产品进行的一项研究显示，70% 的产品包含安全问题。这些问题是由于授权不足、隐私问题、不安全的 Web 接口、缺乏传输加密和软件保护导致的（HP\
  \ 2014）。考虑到上述发现，HP 启动了一个名为 `OWASP`（开放 Web 应用安全项目）的项目，名为 `OWASP 物联网十大风险`（OWASP 2014）。该项目的主要目标是帮助物联网供应商识别十大物联网安全设备问题以及如何消除这些问题。`OWASP`\
  \ 项目识别出以下安全关注点：\n\n*   **不安全的 Web 接口：** 它允许攻击者利用管理 Web 接口（通过跨站脚本、跨站请求伪造和 SQL 注入）获取未经授权的访问以控制物联网设备。\n\
  *   **身份验证/授权不足：** 它允许攻击者利用糟糕的密码策略、破解弱密码并对物联网设备特权模式的访问。\n*   **不安全的网络服务：** 它可能导致攻击者利用设备上运行的非必要或薄弱的服务，或将这些服务作为跳板攻击物联网网络上的其他设备。\n\
  *   **缺乏传输加密：** 它允许攻击者窃听物联网设备与支持系统之间传输的数据。\n*   **隐私关注：** 这些关注点源于这样一个事实：大多数物联网设备和支持系统从用户处收集个人数据，且未能保护这些数据。\n\
  *   **不安全的云接口：** 在没有适当的安全控制的情况下，攻击者可以使用多种攻击向量（授权不足、缺乏传输加密、账户枚举）通过云网站访问数据或获取控制权。\n\
  *   **不安全的移动接口：** 在没有适当的安全控制的情况下，攻击者可以使用多种攻击向量（授权不足、缺乏传输加密、账户枚举）通过移动接口访问数据或获取控制权。\n\
  *   **安全配置性不足：** 由于缺乏或配置机制不佳，攻击者可以访问设备上的数据或控制控制。\n*   **不安全的软件/固件：** 攻击者可以利用未加密和未经身份验证的连接劫持物联网设备的更新，并执行恶意更新，从而损害设备、设备网络及其持有的数据。\n\
  *   **物理安全性较差：** 如果物联网设备在物理上可触及，那么攻击者可以使用 USB 端口、SD 卡或其他存储手段访问设备操作系统以及可能存储在设备上的任何数据。\n\
  \n显而易见，大数据为用户和企业提供了有趣的机会；然而，这些机会面临着隐私和安全方面的巨大挑战（云安全联盟 2013 年）。传统的安全机制不足以对这些挑战提供有效的回答。在下一节中，将介绍部分解决方案/建议。\n\
  \n## 5.3 应对大数据安全与隐私挑战：一项建议\n\n目前没有单一的魔法方案来解决识别出的大数据安全和隐私挑战，传统的安全解决方案主要用于保护少量的静态数据，无法满足大数据服务提出的新要求（云安全联盟\
  \ 2013 年）。由于需要理解如何保护大量复杂的结构化和非结构化数据的收集。未经授权访问这些数据以创建新的关系、合并不同的数据源并使其供恶意用户使用，是大数据面临的严重风险。基础且更常见的解决方案包括对一切进行加密，以确保无论数据存储在何处（数据中心、计算机、移动设备或其他任何）都是安全的。随着大数据的增长及其处理速度加快，加密、脱敏和令牌化是保护敏感数据的关键要素。\n\
  \n由于其特性，大数据项目需要对安全采取整体愿光（Tankard 2012）。大数据项目需要考虑不同数据源的识别、数据的来源和创建者，以及谁被允许访问数据。也有必要进行正确的分类以识别关键数据，并在执行访问控制和数据处理策略方面与组织的信息安全策略保持一致。作为建议，不同的安全机制应该更接近数据源和数据本身，以便在数据源头提供安全，并且归档、数据泄露防护和访问控制的控制与预防机制应协同工作（Kindervag,\
  \ Balaouras, Hill, & Mak 2012）。\n\n\n\n\n新的大数据安全解决方案应当将安全边界从企业扩展到公共云（Juels & Oprea\
  \ 2013）。通过这种方式，还应该建立起一种跨领域的可信数据溯源机制。此外，可以使用类似于 Luo、Lin、Zhang 和 Zukerman (2013) 中使用的机制，来缓解针对大数据基础设施的分布式拒绝服务（`DDoS`）攻击。同时，大数据的安全性和隐私对于确保整个数据生命周期内（从数据收集到使用）的数据可信度至关重要。\n\
  \nHasan、Habegger、Brunie、Bennani 和 Damiani (2013) 讨论了某些大数据服务的个性化特征及其对用户隐私的影响，他们在\
  \ `EEXCESS` 项目的背景下讨论了这些问题，该项目是一个旨在提供高层推荐并尊重用户隐私的具体项目。最近的一项工作描述了提议的 `UML` 隐私扩展，以帮助软件工程师快速可视化隐私需求，并将其设计到大数据应用中（Jutla,\
  \ Bodorik, & Ali 2013）。\n\n在尝试充分利用大数据优势的同时，从安全和隐私角度来看，必须满足处理数据的法律要求的机制。必须采用安全的加密技术来保护所有机密数据（个人身份信息\
  \ `PII`、受保护的健康信息 `PHI` 和知识产权 `IP`），并需要实施严谨的加密材料（`keys`）访问管理策略，以确保数据的正确锁定和解锁——这对于存储的数据尤为重要。为了取得成功，这些机制对终端用户应该是透明的，并且对数据的性能和可扩展性影响很小（应考虑基于软件和硬件的加密机制）（Advantech\
  \ 2013）。\n\n如前所述，传统的数据加密和匿名化处理不足以解决大数据问题。它们对于保护静态信息是充分的，但在涉及数据计算时是不够的（MIT 2014）。因此，需要使用其他技术在保持数据秘密性的同时进行特定且有针对的数据计算。安全函数求值（`SFE`）（Lindell\
  \ & Pinkas 2002）、全同态加密（`FHE`）（Gentry 2009）、功能加密（`FE`）（Goldwasser et al. 2014）以及在不通信的数据中心上的数据划分，可以帮助解决传统安全技术的局限性。\n\
  \n同态加密是一种加密形式，允许在密文上执行特定类型的计算（例如 `RSA` 公钥加密算法）并生成加密结果，该结果在解密后与在明文上执行的操作结果相匹配（Gentry\
  \ 2010）。全同态加密有许多应用，如 Van Dijk, Gentry, Halevi 和 Vaikuntanathan (2010) 所述。这允许对数据库进行加密查询，从而保护数据通常存储位置的隐私用户信息（存储在云端某处——上上用户可以将数据存储在任何不可的服务器上，但采用加密形式，无需担心数据的机密性）（Ra\
  \ Popa & Redfield 2011）。它还实现了对搜索引擎的私有查询——用户提交一个加密查询，搜索引擎计算出一个简洁的加密答案，而从不查看明文查询（查询中可能包含隐私用户信息，如国家医疗服务号码）。同态加密还允许对加密数据进行搜索——用户在远程文件服务器上存储加密文件，随后可以让服务器仅检索（解密后）满足某些布尔约束的文件，即使服务器本身无法解密这些文件。更广泛地说，全同态加密提高了安全多方计算的效率。\n\
  \n大数据面临的一个重要安全和隐私挑战与加密数据的存储和处理有关。在加密数据库上运行查询是安全大数据的基本要求；然而，这是一个挑战性。这引发了以下问题：(i)\
  \ 数据库是用单个密钥还是多个密钥加密的？(ii) 在运行查询之前是否需要解密数据库？(iii) 查询是否也需要加密？(iv) 谁有权限解密数据库？以及更多问题。最近，MIT\
  \ 开发的一个系统为其中一些问题提供了答案。`CryptDB` 允许研究人员在加密数据上运行数据库查询（Popa & Redfield 2011）。旨在查询加密数据的可靠应用程序会将这些查询传递给\
  \ `CryptDB` 代理（位于应用程序和数据库之间），该代理以特定方式重写这些查询，以便其可以在加密数据库上运行。数据库将加密结果返回给代理，代理持有主密钥并解密结果，将最终答案返回应用程序。`CryptDB`\
  \ 支持多种形式的加密方案，允许对数据进行不同类型的操作（Popa & Redfield 2012）。\n\n除了更具体的安全建议外，考虑 IT 基础设施本身的安全也很重要。常见的安全实践之一是在网络边缘放置安全控制；然而，如果攻击者违反了这一安全边界，他们将访问其内部的所有数据。因此，需要一种新方法将这些安全控制移动到数据附近（或增加额外的）。对数据使用和访问进行监控、分析和学习也是持续改进数据持有基础设施安全性并利用现有安全解决方案的重要方面（Kindervag,\
  \ Wang, Balaouras & Coit 2011, Kindervag et al. 2012）。\n\n## 5.4 数据完整性不是数据安全！\n\n\
  ### 5.4.1 VS 与为什么？\n\n考虑一个制药公司的例子：期望一种新药上市，但一个具有高级生产权限的团队检查发现，控制数据的某些质量方面仍然缺失。这种实时受损的数据完整性在很多情况下都很常见。\n\
  \n在存储和处理海量数据的大数据时代，维护数据完整性极其重要且是首要考虑。为了确保数据安全，必须提前了解数据完整性的基础及其工作原理。\n\n数据完整性意味着数据在较长时间运行期间的完整性、准确性和一致性，或者在生命周期中两次频繁更新之间没有发生变动。因此，受损的数据在商业企业中几乎没有用，因为存在敏感数据丢失的风险。这迫使许多企业安全解决方案创建一个数据完整性的核心。这是通过设计阶段的规则、标准以及流程的集合来实现的。\n\
  \n\n\n\n*   硬件故障，如设备或硬盘崩溃。\n*   自然灾害，包括火灾和洪水。\n\n上述某些妥协可以通过数据安全来防止，但数据备份和复制成为确保数据完整性的关键问题。数据完整性的其他最佳实践还包括：用于检查无效输入的输入验证；检查数据传输错误的错误检测；以及如访问控制、数据加密和数据泄露防护等安全措施。\n\
  \n## 5.4.2 数据完整性：过程与 状态\n\n将数据完整性视为一种状态或一个过程会让许多人感到困惑。状态定义数据集既有效又准确，而过程则描述了对数据库中数据集或数据的准确性和有效性的衡量措施。错误检查和验证方法可能是完整性过程的一部分。\n\
  \n## 5.4.3 完整性类型\n\n对于层次结构数据库和关系型数据库，存在两种类型的数据完整性：物理完整性和逻辑完整性（包括实体、域、引用和用户定义实体），它们是用于在这类数据库中强制数据完整性的过程和方法集合。\n\
  \n### 5.4.3.1 物理完整性\n\n物理完整性涉及在存储和提取过程中对数据完整性和准确性的保护。当发生黑客破坏数据库功能或停电等灾难时，这种完整性就会受到。存储侵蚀、人为错误和其他问题也会导致应用程序程序员、经理、系统程序员和内部审计师无法找到准确的数据。\n\
  \n### 5.4.3.2 逻辑完整性\n\n这种完整性关注数据的合理性或正确性，并在关系型数据库中使用数据时保持不变。它保护数据免受入侵者黑客的侵害，但方式与物理完整性不同。确保逻辑完整性的方法有外键约束、`checksum`、运行时检查和程序断言。逻辑完整性分为四种类型，如下：\n\
  \n### 5.4.3.3 实体完整性\n\n这种完整性确保数据库中的列具有唯一且非空的值。`Primary key`（主键）确保了关系型数据库的完整性。例如，员工编号（employee\
  \ number）可以被员工数据库的主键，它不应包含空值，并可以以其他方式进行链接和使用。\n\n### 5.4.3.4 引用完整性\n\n引用完整性（`RI`）是一种属性，表示被引用的数据在关系表中是有效的。`Foreign\
  \ keys`（外键）是第二个表，可以在第一个表中被引为 `primary key`（通常是主表或父表）。它衡量关系之间数据的一致性和准确性。\n\n### 5.4.3.5\
  \ 域完整性\n\n这种完整性确保输入到数据库列中的某条数据的准确性。它由各种数据类型定义，如 `integer`、`character` 或 `decimal`。通常，其思想是列中的每个值都有有限的可能值：定义为\
  \ `INT NOT NULL` 的列只能包含有效的 32 位整数，而定义为 `CHAR (1) NULL` 的列可以是 `NULL` 或任何有效的单字符。它还指的是输入和读取数据的常用方法：如果数据库使用事务值来包含美元和分，则将不允许三位小数。\n\
  \n### 5.4.3.6 用户定义完整性\n\n有时 `RI` 和域完整性不足以保护数据。用户定义或业务完整性确保数据库包含业务规则、政策、规法规和各种程序。业务完整性通过\
  \ `triggers`（触发器）和 `stored procedures`（存储过程）强制执行。这种完整性是由用户创建的，以满足他们的特殊需求。\n\n##\
  \ 5.5 渗透活动：基于预测分析的欺诈检测\n\n大数据的增长率也影响了恶意软件分析。今天，大数据处理系统不断增加的计算能力和存储容量能够处理日益增长的采集数据量，并执行开发的恶意软件分析和可视化新方法。\n\
  \n## 5.6 案例研究 I：在一个安全的社交应用中\n\n每天都有数百万人连接到社交网络。因此，社交网络是与他人通信的最快方式，在当今变得越来越具有吸引力，并能够暴露自己的的人脉，建立了用户与内容之间的桥梁（McKenzie\
  \ et al. 2012）。利用这种功能，人们与他人分享各种数字内容，这些内容可能是他们的直接或间接联系人（即他人的关系）。这种共享媒介对于下一级别的社交互动非常强大。但另一方面，它引发了对隐私和安全的担忧，因为共享控制权不在终端用户手中。对于普通来说，很难控制网络中发布内容的特定属性，因为这些内容在几秒钟内就会分享给更广泛的观众。这对隐私构成了严重威胁。\n\
  \nWeb2.0 的出现将用户从简单的信息消费者转变为重要的内容生成者。这种用户生成内容（`UGC`）由任何个人或联盟自愿开发并在在线平台上共享。这种用户生成的大量数据通过多个平台可用，并规模不断增长（Kim,\
  \ Jin, & Shin 2012）。\n\n目前，社交网络呈现了与隐私和安全相关的预定义内容（Chen & Shi 2009）。主流社交网站允许用户根据特定的隐私规则共享内容，这些规则是由社交平台定义的，而不是由终端用户。这些规则随平台而异，且非常宽松。有时，内容以不受保护的方式被共享，导致他人未经授权的使用和传播。\n\
  \n\n\n\n\n连接设备（主要是智能手机、平板电脑和物联网）的持续增长，这些设备具备生成音频、视频、文本或图片等多媒体相关内容的能力，并处于每个用户的手中；随地随地访问它们也对他们的隐私和安全构成了严重威胁（De\
  \ Cristofaro, Soriente, Tsudik, & Williams 2012）。此外，这些内容还创造了文化、象征和情感收益，包括个人满意感、公民参与或社区建设以及设备功能的改进。换句话之，这检查了用户内容是否创造了价值和经济发展。\n\
  \n考虑到所有这些因素，显而易见，社交网络平台提供者、功能与其所持内容之间必须存在分离。需要建立一种透明机制，将部分安全和隐私内容传输给终端用户。在此领域，提出了从当前社交网络安全和隐私场景向另一种范式的转变，即赋予社交网络用户对其隐私的控制和保护能力，通过适当的权利管理系统将用户生成的控制权交给终端用户（Marques\
  \ & Serrão 2013b）。此外，存储和保护实体独立于所使用的社交网络平台。这种方法将创建一种机制，保护社交网络平台上的共享 UGC，并为终端用户提供访问控制。\n\
  \n### 5.6.1 总体系统架构\n\n如前节所述，所采用的方法是基于开放安全数字权利管理（`SDRM`）解决方案的开放权利管理系统（Serrão 2008,\
  \ Serrão, Neves, Barker, & Balestri 2003）。开放 SDRM 是一种开放且分布式权利管理架构，允许其他业务模式的实现。它的创建考虑了互操作性方面（Serrão,\
  \ Rodriguez, & Delgado 2011），这允许其他模块被重新整合和解耦，从而通过开放且定义良好的应用程序接口（`API`）与其他非开放 SDRM\
  \ 系统进行互操作（见图 5.3](#)）。此外，平台上的每个服务可能存在多个实例，允许所有可能的配置选项进行扩展和增长（Serrão, Dias, & Delgado\
  \ 2005）。\n\n![图 5.3 与权利管理系统集成的架构概述。](img/fig05_03.jpg)\n\n图 5.3 与权利管理系统集成的架构概述。\n\
  \n对于所提系统，权利管理系统可以与社交网络平台集成。就像 UNIX 一样，如果社交网络将其作为 `API` 的开源开发，就可以实现更紧密的场景。否则，在平台上使用其他公共可用的机制将导致集成程度较低的场景，并违反隐私和安全考量。在平台上使用机制是最常见的情况，该方法将在此体现。\n\
  \n该架构的某些元素协同工作，为终端用户和社交平台网络提供功能，以便对终端用户生成的内容实施必要的安全和隐私机制。\n\n开放 SDRM 由不同的服务组成，如图\
  \ 5.4 所示。整个服务以服务器和终端用户模型运行。某些服务部署在服务器端，而其他服务实现在用户端，其中授权服务处理在用户设备上渲染某些类型内容的请求，处理请求并与现有的凭据、权限和许可进行匹配以提供内容。终端用户侧的服务负责验证渲染内容的必要要求，并有效地为终端用户提供内容。\n\
  \n![图 5.4 与权利管理系统集成的具有不同服务的架构概述。](img/fig05_04.jpg)\n\n图 5.4 与权利管理系统集成的具有不同服务的架构概述。\n\
  \n服务器端处理权利管理系统的大部分。一组具有定义良好的 `API` 的组件允许集成以实现特定的业务模型。以下是各项服务：\n\n*   **内容存储与分发服务：**\
  \ 该服务主要用于保护用户内容的存储和分发。\n*   **内容保护服务 (CPS)：** 该服务主要用于内容的保护。内容通过特定的保护工具和机制受到保护，这些工具可能会根据要实现的业务模型而变化。\n\
  *   **内容注册服务 (CRGS)：** 该服务主要负责在平台上注册内容，将用于识别系统内容。此唯一标识符用于整个生命周期以识别 UGC。\n*   **支付服务：**\
  \ 如果业务模型包含内容交易并实现了处理支付的必要机制，则该服务负责与支付网关通信。\n*   **保护工具服务 (PTS):** 该服务负责在实施内容保护方案时注册系统中可用的内容保护工具。\n\
  *   **身份验证服务 (AS)：** 该服务处理用户在系统上的注册以及代表其他服务对用户的身份验证请求。\n*   **许可服务 (LS)：** 这是权利管理框架最重要的服务之一，主要用于创建许可模板、产生新的内容许可并根据请求向特定用户提供许可。\n\
  \n本文的此部分将提供关于“普通用户如何利用此平台在社交网络上共享 UGC，以及用户如何访问其他用户共享的内容”的描述。\n\n### 5.6.2 平台上的注册\n\
  \n该平台已假设所有系统服务最初已从服务器端或客户端在平台上注册。此注册过程为所使用的每个服务分配唯一的凭据，用于未来所有的交互，并确保它们被唯一注册并与其他服务区分开来（见图\
  \ 5.5）。该注册过程是核心机制，由 `AS` 执行并向所有其他服务颁发凭据。此外，服务之间通过安全且经过验证的通道进行通信，使用安全套字层/传输层安全（`SSL/TLS`），确保部署服务的服务器的身份和安全性并建立安全的通信通道（Thomas\
  \ 2000）。\n\n![图 5.5 在平台上处理新服务的注册。](img/fig05_05.jpg)\n\n图 5.5 在平台上处理新服务的注册。\n\n\
  1.  `AS` 包含加密材料（`KpubAS`、`KprivAS`）以及如 `CASAS` 之类的凭据，这些凭据是自发的或由另一个实体（`CCAAS`）颁发的。\n\
  2.  需要注册的服务生成密钥对（`KpubS`、`KprivS`），并向 `AS` 发送注册请求，附带 `Sinfo` 和服务的公钥（`KpubS`）：`Sinfo\
  \ + KpubS`。\n3.  `AS` 验证信息后，创建一个唯一的服务标识符（`SUUID`）和一个能够在全球范围内唯一在平台上识别该服务的凭据：`CASS\
  \ [UUID\\] = KprivAS {SUUID, KpubS \\[UUID\\], CASAS}`。`AS` 对凭据进行签名后，将其返回给请求的服务。\n\
  \n\n\n\n\n**4. 请求服务存储了包含 AS 的公钥（`KpubAS`）的凭据。它用于证明其他实体的凭据，这些实体同样依赖同一个 AS，信任 AS 的服务，信任\
  \ AS 发布的凭据，并由其他服务呈现。**\n\n此注册过程根据社交平台内可用的服务重复多次。这在平台上建立了一个受信的服务生态系统。注册过程中的另一个重要要点是在权利管理系统中注册用户，该系统可能依赖于或独立于社交网络平台（图\
  \ 5.6）。该过程如下：\n\n![FIGURE 5.6 用户注册流程概述。](img/fig05_06.jpg)\n\n图 5.6 用户注册流程概述。\n\n\
  1. 假设用户在社交网络平台上没有账户，且用户在社交网络上开始注册过程。为此，用户需要提供其电子邮件（作为用户名）和密码。\n2. 向终端用户发送确认消息，告知注册过程已完成。\n\
  3. 接下来，用户使用客户端权利管理授权服务（`AUTS`）通过向终端用户提供若干选项（与社交网络平台或其他模式集成）在权利管理平台中初始化注册过程。为此，用户将根据集成认证的模式使用不同的注册选项。\n\
  4. 在 `AUTS` 上，用户引入社交账户凭据（电子邮件、密码）并启动身份验证过程。注册成功后，社交网络返回一个访问令牌，该令牌具有特定的有效期一组权限规则，用于针对终端用户在社交网络上执行不同的操作。\n\
  \n1. 通过使用用户凭据（电子邮件、密码），`AUTS` 创建一个密钥，并用于初始化授权服务上的安全存储：`S^(SStorage) = SHA1[email\
  \ + password]`。\n2. `AUTS` 安全地存储用户信息，社交网络返回一个访问令牌。此外，`AUTS` 为 `(K[pub]^U, K[priv]^U)`\
  \ 创建了一个密钥对。\n3. `AUTS` 联系 `AS` 在平台上注册该用户。这是通过包含 `K[pub]^(AS)` 的 `CASS[AUTS]` 完成的。`CASS[AUTS]`\
  \ 也会被发送以确保 `AUTS` 之前已注册：`K[pub]^(AS) (email, K[pub,CASS[AUTS]]^U)`。\n4. `AUTS` 接收所有这些信息。在解密并验证\
  \ `AUTS` 凭据后，它注册用户信息，为用户生成唯一标识符并为用户创建凭据：`C[UUID]^(AS) = K[priv]^(AS) {UUID, K[pub]^U}`。\n\
  5. 凭据返回给 `AUTS` 并被安全存储：`S[k]^(SStorage)(C[UUID]^(AS))`。用户会被注册操作的结果。这是权利管理平台上服务和用户注册的最后步骤。用户现在已准备好同时使用权利管理服务和社交网络平台。\n\
  \n**5.6.3 在平台上上共享内容](#C11_chapter5.xhtml#rsec5_6_3)**\n\n社交网络上的另一个重要功能是共享 UGC（用户生成内容），该机制通过使用权利管理平台和安全存储在配置位置的内容（无论是在社交平台上、特定的存储位置或权利管理平台上）来实现。当用户上传\
  \ UGC 时，内容将受到保护，并且用户可以定义关于内容的权利、权限和限制。\n\n认为两个用户（生成内容且愿意访问内容的用户）都在社交网络和权利管理平台上经过了适当的注册和认证（图\
  \ 5.7）。因此，简之，UGC 被上传到权利管理平台，访问权和权限由用户定义，内容受到保护，并返回一个 `URI` 用于社交网络平台上共享。\n\n![FIGURE\
  \ 5.7 社交网络平台上的 UGC 安全共享概述。](img/fig05_07.jpg)\n\n图 5.7 社交网络平台上的 UGC 安全共享概述。\n\n\
  现在，上述共享过程的机制定义如下：\n\n1. 用户将要在社交网络上共享的 UGC 发送到内容渲染服务（`CRS`）上传。如果尚未通过身份验证，则该服务需要用户凭据（电子邮件、密码）。这些登录凭据用于访问安全存储：`SkSStorage\
  \ = SHA1[email + password]`。\n2. `AUTS` 在 `CRS` 的帮助下从安全存储中读取用户权利管理系统凭据：`CASUUID`。\n\
  3. 此 `CRS` 上传到 `CPS`；UGC 发送上一步收到的用户凭据：`UGCUUID, CASUUID`。\n4. `CPS` 接收到关于 UGC 的元数据（如类型、格式和编码等）后，`PTS`\
  \ 提供适用于保护 UGC 的可用保护工具列表。`PTS` 发送其凭据和一些内容信息：`CASCPS, UGC_info`。\n5. `PTS` 返回一个与 `CPS`\
  \ 请求匹配的保护工具列表，并由 `PTS` 签名：`KprivPTS{protection_tools_list}`。\n6. `CPS` 将保护工具列表返回给\
  \ `CRS` 并展示给用户。用户随后选择一个工具来调整 UGC 的参数并提交保护请求。\n7. `CPS` 请求 `PTS` 执行选定的保护。\n8. `CPS`\
  \ 请求 `CRGS` 注册 UGC，为此 `CPS` 发送其凭据以及内容哈希。\n9. `CRGS` 存储信息并生成一个唯一标识符，返回给 `CPS`：。\n\
  10. `CPS` 生成一个或多个内容加密密钥（`CEK[1], CEK[2] … CEK[n]`），并将其应用于 UGC，以确保适当的内容保护。\n11. 遵循此保护过程，在\
  \ `LS` 处，`CPS` 发送加密密钥进行注册。每个加密密钥用用户密钥保护，整个消息由 `CPS` 密钥保护：`CASCPS, KpubU (CEK[1],\
  \ CEK[2] … CEK[n]), UGCUUID)`。\n12. 验证后，`LS` 接收信息并向 `CPS` 返回模板列表。`CPS` 将模板列表返回给\
  \ `CRS`，用户选择最合适的模板并进行创建、修改或采用。\n13. `CPS` 接收许可（`LIC[TPL]`）并将其发送给 `LS`，后者与 UGC 关联。最后，`LS`\
  \ 返回许可标识符（`LIC[TPL] [UUID]`）。\n14. 在下一阶段，`CPS` 将保护后的 UGC 发送到内容存储发服务，后者存储加密内容：`CASCPS,\
  \ KprivCPS{CEKn, UGCUUID}`。\n15. 对于存储的加密 UGC 的位置，内容存储发服务返回 `URI`，在下一步，它将在社交网络平台上共享。\n\
  \n\n\n\n\n1. 为了为之前创建的 UGC 获取适当许可证模板，CPS 会联系 `LS: LIC[TPL] [UUID]`。该许可证模板是一个 XML\
  \ 格式文档，与参数化字段关联，这些字段可以根据特定的权利情况进行调整。\n\n2. UGC 许可证模板由以下部分组成：\n    - 用户唯一标识符（`UUID`）、多个用户（`UUID1`,\
  \ `UUID2`… `UUIDn`）或组标识符（`GUUID`）。\n    - 内容的唯一标识符 `UGCUUID`。\n    - 权限列表（`Permission1…Permissionn`）。\n\
  \    - 限制列表（`Restriction1…Restrictionn`）。\n    - 有效期（`validity`）。\n    - 内容的不同密钥（`CEK[1]`,\
  \ `CEK[2]` … `CEK[n]`），并使用用户公钥保护：`KpubU` (`CEK[1]`, `CEK[2]` … `CEK[n]`）。\n    -\
  \ 许可证签名，其许可证内容由 `LS` 签名：\n      `License = KprivLIS {UUID[1] … UUID[n], GUUID[1],\
  \ GUUID[n], UGCUUID,Permission[1]…(Permission)[n,] Restriction[1]…(Restriction)[n],\
  \ Validity, KpubU (CEK[1]… CEK[n].}`。\n\n3. 许可证存储在 `LS` 上，合法用户可以对其访问。\n\n## 5.6.4\
  \ 访问平台上的内容\n\n案例研究中的最后一个过程是用户如何访问在社交网络平台上共享的他 UGC。为了实现这一点，用户需要在社交网络平台和权利管理系统中注册。在浏览社交网络平台的时间线时，社交网络平台上共享的\
  \ UGC 以 `URI` 的形式呈现，当点击时，它将由权利管理平台进行解释并启动访问过程。\n\n## 5.7 案例研究 II\n\n### 5.7.1 软件定义网络上的智能入侵检测/防御系统\n\
  \n考虑一个软件定义网络中的智能入侵检测/防御系统（IDS/IPS）案例研究，该 IDS/IPS 行为由 `Kinetic` 模块控制（Feamster 2014）。`Kinetic`\
  \ 语言（Monsanto, Reich, Foster, Rexford, & Walker 2013）是一种 SDN 控制框架，操作人员可以在其中将网络策略定义为有限状态机（FSM）。网络中不同\
  \ FSM 之间触发不同类型的动态事件（例如：入侵检测、主机状态）。根据不同的网络事件，操作人员使用 FSM 模型执行不同的策略。Python 语言用于实现 `Kinetic`\
  \ —— 即一个 `Pyretic` 控制模块。\n\n“一个 `Kinetic` 控制允许程序员定义的事件动态地改变一组流的转发行为。此类事件的范围从拓扑变化（由\
  \ `Pyretic` 运行时生成）到安全事件（由入侵检测系统生成）。程序员指定了 FSM 状态的一组描述，其中每个映射到某些网络行为的状态都使用 `Pyretic`\
  \ 的策略语言编码；以及这些状态之间的一系列转换，每个转换都由操作人员定义的事件触发”（Feamster 2014）。\n\n该案例研究实现了一个 IDS/IPS\
  \ 安全模块，包括以下内容：\n- 如果主机被感染且没有特权，则必须将其丢弃。\n 但 如果主机由于某种原因被感染且具有特权，则主机必须自动重定向到“围墙主机”（garden\
  \ wall host），在该受感染主机上执行纠正的安全操作（例如清理并安装安全补丁以恢复它）。\n- 如果主机未被感染，则从主机的流量将转发到其目标。\n\n\
  ### 5.7.2 代码揭示\n\n在 [表 5.1] 中，使用 Python 编写的 Kinetic 控制程序的部分视图用于评估智能 IDS/IPS。为了更加清晰，接下来的段落中解释了此代码的功能。\n\
  \n每当新数据包到达系统时；IDS/IPS 初始处理该数据包并定义应用于该数据包的策略（即 `drop|redirect|forward`）。然后，该策略被传递到第二个模块，该模块实现进一步的\
  \ MAC 功能，即 MAC 地址的学习算法以增强 L2 数据包转发。该模块是有效转发或重定向数据包的模块（否则如果数据包要被丢弃，第二个模块将完全接收不到任何数据包，因为它被第一个\
  \ IDS/IPS 模块拒绝了）。\n\n[表 5.1] 所示的代码对应于 IDS/IPS 模块，其代码封装在一个指定为 `gardenwall` 的类中，该类是从名为\
  \ `DynamicPolicy` 的类实例化的（负责处理 JSON 事件）。`lpec` 函数类似于数据包输入过滤器，因为它只选择源 IP 地址由变量 `srcip`\
  \ 指定的数据包。该函数旨在以与该流后续所有数据包完全相同的方式处理流的首个数据包。在本示例中，使用了一个转换函数，它编码的逻辑显示了在响应到达控制器的事件时状态变量应该取的新值。同样，受感染的转换函数编码了单一情况：当\
  \ `infected` 事件发生时，取值为 `infected` 的状态变量为该事件的值（即 FALSE 或 TRUE）。这是一个外生转换的示例（即状态变量\
  \ `infected` 由外部事件更改）；此场景下的另一个外生转换是与状态变量 `exempt` 关联的。相反，状态变量 `policy` 的转换是内生的，因为它的状态由当前\
  \ FSM 的两个内部变量触发：`infected` 和 `exempt`。\n\n表 5.1 IDS/IPS 模块代码快\n\n```python\nclass\
  \ gardenwall(DynamicPolicy):\n    def __init__(self):\n        # Garden Wall\n \
  \       def redirectToWall():\n            client_ips = [IP('0.0.0.1'), IP('0.0.0.2')]\n\
  \            rewrite_policy = rewriteDstIP(client_ips, '10.0.0.3')\n           \
  \ return rewrite_policy\n        # DEFINE THE SPEC FUNCTION\n        def lpec(f):\n\
  \            return match(srcip=f['srcip'])\n        # SET UP TRANSITIONS\n    \
  \    @transition\n        def exempt(self):\n            self.case(occur.event,\
  \ self.event)\n        @transition\n        def infected(self):\n            self.case(occur.event,\
  \ self.event)\n        @transition\n        def policy(self):\n            # If\
  \ exempt, redirect pkt to gardenwall;rewrite dstip to 10.0.0.3\n            self.case(test_and_true(V('exempt')),\
  \ V('infected')), redirectToWall())\n            # If infected, drop pkt\n     \
  \       self.case(is_true(V('infected')), C(drop))\n            # Else, identity\
  \ -> forward pkt\n            self.default(C(identity))\n        # SET UP THE FSM\
  \ DESCRIPTION\n        self.fsm_def = FSMDef(\n            infected=FSMVar(type=BoolType(),\
  \ init=False, trans=infected),\n            exempt=FSMVar(type=BoolType(), init=False,\
  \ trans=exempt),\n            policy=FSMVar(type=Type(Policy, {drop, identity, redirectToWall()}),\
  \ init=identity, trans=policy)\n        )\n        # SET UP POLICY AND EVENT STREAMS\n\
  \        fsm_pol = FSMPolicy(lpec, self.fsm_def)\n        json_event = JSONEvent()\n\
  \        json_event.register_callback(fsm_pol.event_handler)\n        super(gardenwall,\
  \ self).__init__(fsm_pol)\n```\n\n\n\n\n\n当前情况下使用的 FSM（见图 5.8）将之前定义的转换函数与适当的状态变量关联起来。FSM\
  \ 包含一组状态变量定义，每个变量定义都指定了变量的类型（允许值的集合）、初始值以及相应的转换函数。`infected` 是一个布尔变量，其初始值为 `FALSE`（假设主机未被感染），其转换基于之前定义的\
  \ `infected` 函数。同样，`drop` 或 `identity` 由策略变量采用，初始处于 `identity` 状态，且转换基于之前定义的策略函数。Kinetic\
  \ 提供的 FSM 策略会自动将每个入的外部事件重定向到适当的 `lpec` FSM，在其中，它将由 FSM 描述中指定的异源转换函数进行处理（即函数 `self.fsm_def`）。这是确保\
  \ FSM 按照预期工作的方法。\n\n![FIGURE 5.8 有限状态机 (FSM) (Feamster 2014).](img/fig05_08.jpg)\n\
  \n图 5.8 有限状态机 (FSM) (Feamster 2014)。\n\n#### 5.7.3 评估\n\n当前评估使用的通过网络模拟器制作的网络拓扑如图\
  \ 5.9 所示，所有的评估都在单台 Ubuntu Linux 虚拟机中完成。\n\n![FIGURE 5.9 网络拓扑测试 (Feamster 2014).](img/fig05_09.jpg)\n\
  \n图 5.9 网络拓扑测试 (Feamster 2014)。\n\n我们现在启动评估，打开 Linux 终端并使用以下命令运行我们的 Kinetic 控制器应用程序：\n\
  \n```bash\n$ cd ~/pyretic\n$ pyretic.py pyretic.kinetic.examples.gardenwall\n```\n\
  \n如图 5.10 所示，Kinetic 控制器在利用 NuSMV 符号模型检查器（NuSMV 2014）验证网络策略后会打印结果。Kinetic 会根据程序员或操作员编写的程序自动生成\
  \ NuSMV 输入，并验证用 CTL（计算树逻辑）编写的逻辑语句（CTL 2014）。\n\n![FIGURE 5.10 Kinetic 控制器终端.](img/fig05_10.jpg)\n\
  \n图 5.10 Kinetic 控制器终端。\n\n在第二个终端中，我们启动网络模拟器“mininet”，执行以下命令：\n\n```bash\n$ sudo\
  \ mn --controller=remote --topo=single,3--mac --arp\n```\n\n可视化的输出结果如图 5.11 所示。此外，图\
  \ 5.12 的底端显示模拟的交换机被 Kinetic 控制器发现。\n\n![FIGURE 5.11 Mininet 终端.](img/fig05_11.jpg)\n\
  \n图 5.11 Mininet 终端。\n\n![FIGURE 5.12 交换机连接控制器.](img/fig05_12.jpg)\n\n图 5.12 交换机连接控制器。\n\
  \n现在设想一种情况：主机“h1”被攻破（感染）。这种情况源于发送一个事件来更改 FSM 状态，使得任何源自该主机的流量应在交换机中被丢弃。在这种网络状态下，主机“h1”和“h2”之间的\
  \ ICMP 流量被阻塞。我们在第三个终端执行以下命令，向控制器发送“infected”事件传输：\n\n```bash\n$ python json_sender.py\
  \ -n infected -l True --flow=\"{srcip=10.0.0.1}\" -a 127.0.0.1-p 50001\n```\n\n\
  “infected”事件已发送到控制器，如图 5.13 中所示。\n\n![FIGURE 5.13 传输的 JSON 事件.](img/fig05_13.jpg)\n\
  \n图 5.13 传输的 JSON 事件。\n\n执行几毫秒后，Kinetic 控制器收到了通知主机 `h1` 已感染的事件（见图 5.14\n\n图 5.14\
  \ 控制器更改策略以丢弃数据包。\n\n之后，我们尝试从主机“h1”向主机“h2”发送两个 ping 消息，如图 5.15 所示，但均未成功。这是因为 IDS/IPS\
  \ 安装在“h1”和“h2”之间的交换机上，并使用策略丢弃源自主机“h1”的数据包。\n\n![FIGURE 5.15 ICMP 流量被丢弃.](img/fig05_15.jpg)\n\
  \n图 5.15 ICMP 流量被丢弃。\n\n假设主机“h1”被分类为特权（豁免），控制器将通过以下方式收到通知：\n\n```bash\n$ python\
  \ json_sender.py -n infected -l True --flow=\"{srcip=10.0.0.1}\" -a 127.0.0.1-p\
  \ 50001\n```\n\n紧接着，Kinetic 控制器收到了通知主机 `h1` 已感染的事件（见图 5.16）。结果是控制器更改了策略以丢弃源自主机“h1”的数据包。该策略安装在交换机上。\n\
  \n![FIGURE 5.16 控制器更改策略以丢弃数据包.](img/fig05_16.jpg)\n\n图 5.16 控制器更改策略以丢弃数据包。\n\n之后，我们再次尝试\
  \ ping 命令，来自主机“h1”的流量发生了重定向，如图 5.17 所示。人们注意到，响应 ping 的主机是“h3”而不是“h2”。正如前文所述，“h3”负责恢复由于某些原因被攻破的主机。\n\
  \n![FIGURE 5.17 ICMP 流量被重定向.](img/fig05_17.jpg)\n\n图 5.17 ICMP 流量被重定向。\n\n在主机“h1”执行了一些纠正措施后，可以假设主机\
  \ `h1` 已经恢复。此时，向控制器发送了一个新事件，通知主机 `h1` 变为“未感染”，如下：\n\n```bash\n$ python json_sender.py\
  \ -n infected -l False --flow=\"{srcip=10.0.0.1}\" -a 127.0.0.1-p 50001\n```\n\n\
  图 5.18 展示了控制器的输出，告知已收到事件，且转发策略已更改为指向主机“h2”（身份策略）。\n\n![FIGURE 5.18 通过身份策略转发流量.](img/fig05_18.jpg)\n\
  \n图 5.18 通过身份策略转发流量。\n\n从图 5.19 可以得出结论，主机 `h1` 现在正在接收来自主机“h2”自身的响应。\n\n![FIGURE\
  \ 5.19 ICMP 流量再次到达 h2.](img/fig05_19.jpg)\n\n图 5.19 ICMP 流量再次到达 h2。\n\n最后，我们完成了对智能\
  \ IDS/IPS 系统的当前评估。这被认为是大数据场景中某项重要功能，因为它有助于识别和解决分布式大数据架构（在数据生命周期的不同阶段——从数据采集到数据处理）可能遭受的一些攻击。\n\
  \n### 大数据安全：未来方向\n\n本章强调了影响大数据工作环境的安全性和隐私挑战的一些重要方面。尽管已经存在确保大数据生态系统安全和隐私的信息安全实践、方法和工具，但如果不以整合的方式使用，它们将是的。本章展示了大数据环境中面临的挑战的一些解决方案，但并未为这些问题提供有限或准确的答案。它旨在为解决最相关且最具挑战性的大数据安全和隐私问题提供了一些方向和技术参考。\n\
  \n\n\n\n接下来，展示了两个不同的用例。这两个用例都为解决大型大数据安全和隐私难题的部分问题提供了一些方向。在第一个用例中，介绍了一种尝试解决社交网络中用户生成内容（UGC）安全和隐私问题的方法。在这种方法中，提出了一种开放且互操作的权利管理系统，作为提高在社交网络上共享内容的用户隐私的一种手段。描述的过程展示了权利管理系统如何让终端用户控制他们自己的\
  \ UGC，以及他们如何防止来自其他用户或社交网络平台本身的滥用行为。\n\n第二个用例展示了软件定义网络（SDN）在增加从网络收集统计数据的能力，以及允许控制器应用程序对设备进行编程和转发的能力，这些都是强大且智能的安全执行技术，例如主动安全（Hand,\
  \ Ton, & Keller 2013）。这种新颖的安全方法提出了一种新的反馈循环，用以改进对网络化基础设施防御机制的控制，并围绕五个核心能力展开：保护、感知、调整、收集和反击（Kreutz\
  \ et al. 2014）。在这种下，主动安全提供了一个集中的编程接口，通过以下方式简化检测攻击机制的集成：(i) 从多种来源收集数据（以更具确定性的识别攻击），(ii)\
  \ 为安全设备收敛到一致的策略配置，以及 (iii) 执行反措施以阻止或最大限度地减少此类攻击的影响。之前的方面在我们的 IDS/IPS 案例研究中已部分涵盖，但显然需要进一步开发，并且是对大数据生态系统安全和隐私的一项重要贡献。\n\
  \n整个章节都清楚地看到，为了解决大数据安全和隐私问题，已经考虑了一些重要的步骤，但仍有很长的路要走。在本章的结论中，我们提到了一些感兴趣的话题，研究社区可以活跃投入开发新的大数据安全和隐私解决方案。\n\
  \n该大数据生态系统的研究挑战涵盖了从数据创建（以及大数据源——设备）到数据存储和传输、数据转换和处理，最后到数据使用。为了支持这一生命周期，需要一种高容量、高度分布的架构，该架构将暴露在受到各种攻击的敌对环境中。本章提出的\
  \ SDN 方法是应对这些威胁的一种可能解决方案；然而，还需要进行进一步的研究，例如关于交换自动适应和基于行为的安全策略的关注（Chen, Jorgen, &\
  \ Yuan 2011, Dohi & Uemura 2012）。\n\n在维护端到端数据安全和隐私方面存在研究挑战，以确保它们在大数据生命周期的任何一点都不会明文泄露给未经授权的方。从数据转向程序的过程中，有多种在浏览、搜索和社交交互方法中保护隐私的技巧。在计算机程序和基于\
  \ Web 的系统的环境下，针对加密数据的处理和隐私保护需要更多的研究。\n\n大数据领域的更多研究挑战包括开发在具有多个密钥、来自多个源和多个用户的加密数据上进行透明计算的技术。在研究方面，研究和开发在加密数据上委托有限功能的方法（以便第三方对其进行分析）将是具有挑战性的。所有与密钥管理、授权委托和权利管理相关的方面都是该领域需要进一步研究的主题。在考虑安全和隐私感知系统时，信任就是一切。特别是在大数据情况下，应该为大多数场景（医疗保健、辅助生活、SCADA\
  \ 系统等许多）建立一个可信的环境。实现这种环境是一个具有挑战性的术语研究方向。信任能够查询和处理大数据并从中提取知识的应用程序，以及信任从多个源收集所有数据的设备，构成了基础安全需求。在未来几年，在终端用户、设备（IoT）和应用程序之间生成并建立信任是一个热门研究课题。\n\
  \n关于大数据，这些研究挑战仅代表了冰山一角，涵盖了在开发安全和隐私感知的大数据生态系统方面仍需研究和解决的问题。\n\n### 5.9 最终建议\n\n以下是帮助减少大数据生态系统所识别的安全风险和威胁影响的一些关键建议。\n\
  \n1. 选择具有证明经验且有相似规模部署的产品和供应商。\n   要求提供大规模部署（规模与贵组织相似）的供应商参考，这些部署运行所考虑的安全控制措施已持续至少\
  \ 1 年。\n\n2. **主要支柱：** 问责制、以网络为平衡、以访问为中心的控制和以数据中心的安全是至关重要的。\n\n3. 优先考虑以数据中心的安全，例如标签安全或单元格级安全。\n\
  \n4. 在接入时使用数据削减、数据掩码或令牌化，或使用具有粒度的数据服务。\n\n5. 使用如 OSS Falcon、Cloudera Navigator 或\
  \ Zettaset Orchestrator 等数据管理工具来利用日志和审计。这有助于长期实现数据溯源。\n\n### REFERENCES 参考文献\n\n\
