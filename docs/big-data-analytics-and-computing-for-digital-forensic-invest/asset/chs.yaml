  \    * 9.7.3 大数据分析：一种现代方法\n\n### 9.1 引言\n\n自动化和电信在人类活动各个领域的普及，以及 IT 用户数量的不断增加，针对信息系统（目标）的攻击（网络攻击）频率通过黑客攻击、钓鱼、中间人攻击等方式日益增加，在财产、声誉、人类生命乃至整个国家造成了巨大的损害和损失。\n\
  \n\n\n\n\n信息战的一个子集，即广为人知的网络战，以多种形式存在，处理具有政治动机的攻击，利用先进技术破坏政治共同体（如国家和民族）的基本利益。为了应对具有政治动机的攻击，数字取证调查采用了精确的分析和统计技术，并结合各种调查模型以实施有效的安全措施。\n\
  \n网络防御系统的开发旨在通过对攻击做出及时响应来保护、防止和防御网络攻击，从而维护资产。随着网络攻击数量和复杂性的不断增加，识别新威胁和预测概率未知威胁性质的能力成为自卫的至关手段。取证分析师检查并分析与计算机安全相关的数字证据，并得出有用信息以减轻系统或网络漏洞。\n\
  \n巨大的异构数据集（大数据）在大数据分析工具的帮助下在解决问题的时间内进行处理，这些工具特别在网络安全领域实施，用于发现相关信息（如隐藏模式、未知关联），以识别目标系统的任何易感性，为取证调查部门提取核心证据以供进一步分析和检查提供了帮助\
  \ [3]。\n\n大数据分析为网络安全专业人员提供了现代化的统计工具和技术，用于从多个源提取数据，为了调查目的对数据进行可视化和关联，并得出结论以进一步分析。因此，它增加了分析过程的效率，有助于检测网络攻击的早期可能性，以便执行明确行动来避免并消除对手行动的影响。\n\
  \n然而在现实中，技术的复杂性和网络空间的全球性使得网络犯罪的检测变得困难。为了及时响应网络犯罪，需要精通收集证据片段，并通过适当的程序进行检查、分析和证明犯罪，随后将其报告给法庭以惩处网络犯罪分子。\n\
  \n本章重点关注以下主要主题：\n\n*   计算机欺诈与网络犯罪，\n*   分类，\n*   信息战，\n*   网络战，\n*   网络防御系统，\n*\
  \   网络安全的大数据分析。\n\n## 9.2 计算机欺诈与网络犯罪\n\n随着 IT 技术的发展和数字化的增长，所有活动领域都发生了革命性的变化，同时扩大了网络空间中网络犯罪和欺诈的范围。\n\
  \n计算机欺诈被定义为基于网络的冲突，涉及非法行为和做法，目的是为了获取对受保护计算机的控制权，通过欺骗手段为个人利益获取有价值的输出。\n\n计算机欺诈与通过聊天室、电子邮件等不同方案下的各种类型欺诈有关。它还包括不同用户（包括金融机构）通过网站进行的欺诈性交易。\n\
  \n网络犯罪是在大多数系统全球连接的网络空间中实施的具有意图动机的犯罪。因此，网络犯罪主要针对计算机、基于网络的设备和弱渗透点，执行恶意活动，以获取金钱利益或剥夺他人的声誉和名声\
  \ [4]。\n\n以下是影响互联网上犯罪分子增长和网络犯罪率的因素：\n\n*   由于网络空间中普遍的数字化增长，网络攻击的复杂性和风险呈指数级增长，构成了严重威胁。\n\
  *   互联网设施为所有领域提供了广泛的服务。同时，它提供了许多免费工具，以及那些被犯罪分子误用的工具。\n*   技术驱动的世界使得无需物理在场的网络犯罪成为可能。\n\
  *   掩饰工具的可用已成为网络犯罪分子隐藏身份的助力。\n*   许多电子设备（ECD）用户容易受到威胁影响。\n*   社交媒体是影响在无意识中发生网络犯罪的关键因素。\n\
  \n刑法的基本原则是，犯罪包含心理因素（`mens rea`）和身体因素（`actus reus`）。对于网络犯罪，法律试图防止的网络空间中的人类行为（动态且多变）是\
  \ `actus reus`。而 `mens rea` 指“犯罪的心理要素”，它构成了犯罪的重要要素。\n\n图 9.1 显示了。\n\n### 9.2.1 网络犯罪中使用的工具\n\
  \n网络犯罪分子使用各种复杂的工具和技术，通过多种方式利用技术优势来实施犯罪。以下是用于计算机欺诈和网络犯罪的常用工具：\n\n*   `代理服务器和匿名器 (Proxy\
  \ servers and anonymizer)`：匿名器是一种使互联网活动不可追踪的代理服务器。它作为客户端和服务器之间的中间节点，具有绕过防火墙并代表实际用户访问受限服务器信息的能力。\n\
  *   `密码破解 (Password cracking)`：一种恶意软件活动，试图通过破坏安全功能并采用各种破解工具和技术，获取对受保护设备的非法访问控制。\n\
  *   `间谍软件 (Spywares)`：这是一种秘密注入到目标设备（受害者）中的渗透软件，旨在监控毫无防备的用户及其在线活动。它旨在收集目标受害者的个人和敏感信息，并倾向在受害者不知的情况下将此类敏感数据暴露给未经授权的人。\n\
  *   `隐写术 (Steganography)`：一种加密技术，将秘密数据隐藏，使得除了发送者和预期接收者外，无人能感知加密数据的存在。\n*   `木马 (Trojan\
  \ horse)`：一种误导用户其真实内容的恶意程序。它被设计用来当受害者的间谍，获取系统的非法访问权限以提取敏感数据。\n*   `流氓安全软件 (Rogue\
  \ security software)`：一种恶意软件程序配置，伪装成反病毒软件。\n*   `SQL 注入 (SQL injection)`：一种代码注入技术，在应用程序数据库层的疑似漏洞中注入恶意代码。\n\
  \n\n\n\n\n*   **钓鱼攻击：** 网络犯罪分子通过创建虚假网站和使用伪造邮件来欺骗人们，使其认为那是原始网站。最后，在点击这些虚假链接后，攻击者可以轻松提取受害者的敏感信息和个人信息。\n\
  *   **DoS 攻击：** 如其名，它旨在通过故意阻塞信号来拒绝服务流，从而导致合法用户无法使用所需服务或服务可用性降低。\n*   **社会工程学：**\
  \ 这是对人们在泄露机密信息敏感性的一种心理操纵。\n*   **中间人攻击：** 入侵者通过获取私人访问权限，秘密地在两个终端服务之间注入或更改通信内容，同时向双方制造幻象，认为他们正在直接通信，而没有任何第三方拦截。\n\
  \n#### 9.2.2 2018–2019 年网络犯罪统计\n\n有关近年来网络攻击的统计信息获取自真实报告（图 9.2），并重点强调如下：\n\n*   从\
  \ 2017 年起，物理盗窃已被信息盗窃所超越。在当前情况下，信息盗窃已成为对组织的一种暴力威胁。（ENISA 威胁格局报告 2018）\n*   2018 年发生了数百万次恶意软件攻击，此类攻击中占比最大的是杂类攻击，它们不断改变其识别特征以规避检测，这使得基于特征的防病毒软件难以识别，导致了频繁的迭代。从今年到\
  \ 2019 年 4 月，目前已追踪出 2455 万次威胁。（2019 Web root 威胁报告）\n*   在英国发生的犯罪中，超过 50% 是网络犯罪。（国家犯罪调查局）\n\
  *   每隔 39 秒，计算机和互联网就会受到恶意黑客的攻击。（马里兰大学）\n*   2018 年对不同组织进行了一项调查，报告预测 78% 的组织受过网络攻击的影响。（2019\
  \ 网络威胁防御报告）（图 9.3）\n\n![FIGURE 9.2 按年份划分的攻击频率。](img/fig09_02.jpg)\n\nFIGURE 9.2\
  \ 按年份划分的攻击频率。\n\n![FIGURE 9.3 过去 12 个月内遭受至少一次成功攻击的百分比。（来源：Imperva 2019 网络威胁防御报告。）](img/fig09_03.jpg)\n\
  \nFIGURE 9.3 过去 12 个月内遭受至少一次成功攻击的百分比。（来源：Imperva 2019 网络威胁防御报告。）\n\n### 9.3 分类法\n\
  \n网络犯罪分类法简化了与相似犯罪模式相关的各种术语的复杂性，并根据其相似性进行组织 [5,6]，如图 9.4 所示。\n\n![FIGURE 9.4 网络犯罪分类法。](img/fig09_04.jpg)\n\
  \n FIGURE 9.4 网络犯罪分类法。\n\n各种网络犯罪类型如下：\n\n1.  **网络暴力：** 针对 `Internet` 的恶意活动。所有连接设备都极易遭受暴力；其中包括：\n\
  \    *   **网络战争：** 如其名，旨在通过使用 `Internet` 来削弱国家。\n    *   **网络恐怖主义：** 一种为了获得未经授权的访问而蓄意计划威胁生命财产攻击。\n\
  \    *   **网络跟踪：** 一种严重的犯罪，攻击者利用电子设备骚扰受害者。\n    *   **网络报复：** 这种类型的攻击关注 `Internet`，旨在损害目标域名的地位。\n\
  \n2.  **网络贩卖：** 旨在窃取机密和敏感信息的犯罪行为。分为两类：\n    *   **网络诈骗：** 一种严重依赖通信技术欺骗目标受害者的犯罪。\n\
  \    *   **网络活动主义：** 在此类犯罪中，滥用 `Twitter`、`Facebook`、`YouTube`、`LinkedIn`、`WhatsApp`\
  \ 和 `Gmail` 等互联网工具传播谣言并损害声誉。\n\n3.  **网络入侵：** 非法访问侵犯道德准的计算机系统。类型如下：\n    *   **网络盗窃：**\
  \ 旨在掠夺有价值的机密记录。分为两类：\n        *   **网络空间盗窃：** 网络空间是最关键的领域之一，攻击者旨在导致拥堵并中断网络服务。\n\
  \        *   **数据/信息盗窃：** 一种日益增长的现象，涉及盗取机密记录和敏感数据。\n    *   **网络渗透：** 通过跟踪个人、公司和组织的活动非法获取机密记录。\n\
  \    *   **网络色情：** 一种利用网络空间向目标受害者暴露内容的非道德行为。\n\n4.  **网络圈位：** 非法注册与原始域名有相似之处的商标域名。其主要目标是从商标信誉中获得经济利益。\n\
  \    *   **经典网络圈位：** 网络圈位者的目标是从目标受害者索要赎金以释放非法注册的域名。\n    *   **破坏性网络圈位：** 网络圈位者意图通过上传色图像、仇恨言论和违规内容来损害目标域名的地位。\n\
  \n\n\n\n\n* `拼写域名抢注`：域名抢注者通过对与其相似的商标进行轻微处理，故意注册预先存在的域名以获取暴利。\n\n## 9.4 信息战\n\n信息战与掠食者采取的冲突性活动有关，这些活动的目的是在受害者不知情的情况下操纵信息，掠食者通过控制受害者来获得不公平的优势。此类阴谋的预测和识别无法进行实时评估，导致大规模的利用。\n\
  \n实施者通过各种恶意技术策略性地对信息进行操纵、降级和拒绝，以获得相对于受害者的不优势。实施者在利用对手信息和信息系统的同时，保护自身系统的完整性免受利用。\n\
  \n信息战活动包括以下：\n\n* 收集战略事实和数据，\n* 检查收集数据的正确性，\n* 传播虚假和夸大的信息及思想，以打击和削弱对手的力量和行动，\n*\
  \ 贬低受害者信息的重要性和严重，\n* 限制敌人访问相关数据。\n\n### 9.4.1 信息战中的基本策略\n\n信息战可用于防御和进攻目的。进攻性信息战寻求利用无数工具对对手的信息、计算机信息系统和控制系统占据主导地位。防御性信息战旨在维护国家保护其信息基础设施的能力，这取决于检测、纠正和从攻击中恢复的能力。\n\
  \n信息战的基本策略包括：\n\n1. **信息拒绝**：主要目标是限制对手从通道中获取有用信息，可以通过使用各种先进技术（如干扰和过载）在通信通道中引入噪声，或者通过操纵和扭曲与信息背景噪音相似的原始信息来实现。\n\
  2. **欺骗与模仿**：首要目标是有意地向对手提供宣传和虚假信息，带有欺骗对方的动机。该手段试图模仿受害者熟悉的信号，给对手产生错误的信念，使受害者做出不利自身利益的决策，而这种决策间接有利于攻击者。\n\
  3. **中断与破坏**：意在中断对手的信息接收设备，以防止其接收任何信息。中断行为旨在临时中断信息接收服务，而破坏行为则试图永久性地利用其服务。\n4. **颠覆**：这是信息战中最复杂的策略，涉及向对手系统插入恶意代码，创建一个触发自毁过程的后门，例如逻辑炸弹、倾向于损坏并禁用系统功能的病毒。\n\
  \n### 9.4.2 信息战的各种形式\n\n信息战有七种不同的形式，如下：\n\n1. **指挥与控制**：这是信息行动的应用，特别是在防御部队中。指挥与控制战通过在链路之间设置屏障，中断其所属部门之间命令（指挥结构）的互联流。\n\
  2. **基于情报的战争**：基于情报的战争系统内置了光电电池（传感器），具有收集和分析数据的能力。同时，它保护自己的系统。\n3. **电子战**：这是一种配备无线频率的战争，通过激光光制造混乱来禁用敌人的电子设备。它还能感知和检测攻击。\n\
  4. **心理战**：一种旨在通过影响害者的情感和行为来降低对手士气的战争；从而保护自己的 set。\n5. **黑客战争**：黑客战争使用不同的技巧和策略对计算机系统进行的攻击。方法取决于黑客实现目标时的认知和心态。\n\
  6. **经济信息战**：通过这种战争的帮助，可以使用经济手段对国家产生潜在威胁，旨在削弱目标国家的实力和财务背景。\n7. **网络战**：技术驱动的世界已使整个国家变得脆弱，为通过侵略性使用先进技术破坏通信系统而引发战争提供了新机会，导致受害者遭受巨大损失。\n\
  \n## 9.5 网络战\n\n网络战旨在带有不良政治动机地攻击竞争国家的计算机和信息系统。这是一种通过暴力使用现代化工具和方法来蓄意构建的攻击目标国家的战争，特别是为了战略或军事目的\
  \ [7–9]。因此，它对一个国家的安全和利益构成了非常真实且巨大的威胁。\n\n政治共同体的基本利益如下：\n\n* 建立和平、宁和安全；\n* 获取必要的资产；\n\
  * 保持独立；\n* 引入并加强定性经济改革。\n\n### 9.5.1 网络战的形式\n\n网络战能够提供关于实施后后果严重程度的洞察知识，可以采取以下三种形式之一：\n\
  \n1. 间谍活动（利用互联网获取有关其他国家秘密信息的行为），\n2. 虚假信息的传播（为了欺骗他人而故意传播虚假信息），\n3. 破坏（破坏负责满足国家基本利益的目标设备）。\n\
  \n随着网络攻击的激增以及攻击者所采用的方法复杂性不断增加，网络防御对于保护信息和其他资产免受不必要的泄露是不可避免的。以获取特定领域的知识为目标，网络防御在分析中发挥着重要作用，减轻对给定环境可能发生的未来攻击或威胁，从而构建了反击网络攻击的必要策略。\n\
  \n## 9.6 网络防御系统\n\n\n\n\n\n“网络防御”（cyber defense）一词源于“cyber”（网络）和“defense”（防御）这两个词，它们是组成元素。`cyber`\
  \ 是网络空间的缩写，通过计算机、接入网络的设备以及其他基于网络设施与信息资产之间的链接连接形成了一个虚拟世界。防御是一种主动行为，通过刻意实践来对抗和克服计算机犯罪问题，以保护国家资产免受攻击。\n\
  \n网络防御是一种增强有效利用安全策略和资源能力的机制。它确保操作在没有威胁引起中断的情况下无缝运行。在现代方法中，网络防御系统随着“主动网络防御”的新概念出现，通过发现威胁、研究其能力并分析缓解措施来减少网络威胁和漏洞\
  \ [7]。\n\n网络防御已完成以下系统性和逻辑性的分析，以确定未来攻击的可能性和目标点，以便执行早期防御机制来防止网络攻击。\n\n1. **网络传感器与利用：**\
  \ 这是一项用于评估和确定攻击者所制定行动计划，以及他们在涉及关键功能的活动过程中的利用能力的技术。\n2. **网络态势感知：** 网络领域的态势感知通过预测任务结果，提供对威胁和易感性的广泛且明确的视角。\n\
  3. **网络防御机制：** 它配备了各种带有隐藏代码的扫描器和软件，用于应对与秘密信息、病毒和未经授权访问相关的威胁。\n4. **网络命令与控制：** 这是一种技术驱动的机制，系统地计划和协调来自态势感知元素的信息，以建立防御实践。该机制分析状况、探索可能的选项并立即评估所需的决策。同时，它通信并实施计划的行动。\n\
  5. **网络策略与战术：** 这是一个重要的知识引导工具，根据特定的攻击状况决定所采取的主动决策的准确性，并在此基础上以系统且顺序约定的方式设计行动计划。它还作为根据需要对决策进行必要变化的引导工具。\n\
  6. **网络科学与工程：** 这是基石，有助于深入了解关于框架、解剖、构建和维护强力战斗系统的知识。\n\n为了实现可行的网络防御能力，在科学技术领域需要上述的进展，以便在网络防御机制中有效实施。\n\
  \n### 9.7 网络安全的大数据分析\n\n传统的安全分析（第一代安全信息和事件管理，`SIEM`）是一种被动安全方法，即在威胁迹象可视化后采取行动。网络安全的传统的分析方法仅限于推导出网络层应用中数据之间的关系。这些由安全专家手动定义规则的保守方法在理解人类活动方面是无力且无效的，因此无法适应其动态行为变化。\n\
  \n因此，传统的基于规则的系统无法处理高级攻击的复杂性和用户行为的动态性。因此，负责维护和管理的安全专家会像黑客一样思考，并预测黑客的所有主计划。他们采取反措施来保护他们的重要资产和信息。然而，如果犯罪者实施损害的时间复杂度超过防御系统采取防御措施的时间复杂度，被动安全将是有效的。由于攻击者使用自动化和针对性的方法，被动安全方法不再有效。\n\
  \n大数据分析（第二代 `SIEM`）是一种主动安全方法，旨在处理大数据，根据来自日志和其他来源的组合数据在近实时关联事件，检测可疑活动的指标。它使用先进的数据分析技术和预测模型来收集、分类和分析从多个网络设备收集的信息和数据，以实时检测高级威胁。大数据分析工具是复杂的，专门为取证调查而实施，提供有关攻击起源、发生方式和损害程度的信息\
  \ [10]。与传统安全工具不同，它有助于识别可疑活动、检测内部威胁并实时监控用户行为。\n\n大数据工具广泛应用于各种组织、企业等，以识别和探索新的可能性和机会，从而导致战略决策。因此，它为安全——情报领域带来了重大的演变变化，减少了整合和调查与网络犯罪相关的各种相关证据的时间，并为取证目的绘制了历史记录的模式。\n\
  \n网络安全中的大数据分析具有收集海量数字数据的专业知识，以便统计技术、预测模型和人工智能（`AI`）得出准确的洞察，提高初始阶段预测网络威胁的有效性。\n\n\
  换句话说，在先进分析和统计技术的帮助下，大数据分析是一种检查不同数据源，通过异构数据提取深度知识，并通过未知的关联和数据源实时提供见性信息，有助于数字取证调查人员进行更快的数据分析和明智决策\
  \ [11,12]。\n\n大数据分析技术的快速演进提供了一个新标准，并通过复杂的工具和技术解决了大数据存储、处理和分析问题。\n\n#### 9.7.1 大数据分析的现代技术\n\
  \n**数据融合与数据集成：** 这是一种整合来自不同源的重要数据的方法，其目标是从历史记录、数据源等得出洞察，以识别可疑行为模式，检测网络空间中的异常。\n\n\
  **机器学习：** `AI` 的子集包括统计技术。它可以用于处理计算机算法的数据分析过程，在网络安全和取证调查领域产生假设。它基于这些假设提供预测，而这对人类分析师是不可能实现的。\n\
  \n**数据挖掘：** 这是一个交叉学科（包括统计学和许多其他科学领域），其目标是从多样化的数据发现相关且有意义的模式，以产生新的令人兴奋的知识和信息。它在从历史记录和原始数据源提取有关网络威胁的隐藏模式、相关信息方面着关键作用，从而提供洞察以检测和防止网络攻击\
  \ [11]。\n\n#### 9.7.2 大数据分析中使用的工具\n\n\n\n\n分析师借助许多先进工具来生成复杂的查询，并在 `Hadoop` 之上应用机器学习算法，这实现了对海量数据（大数据）的并行分布式处理。其他大数据工具还包括\
  \ `Pig`（一种专门用于解决复杂查询的脚本语言）、`Hive`、`Mahout` 和 `RHadoop`。\n\n分析可以指导网络控制器和监管机构，特别是在实时网络流的监督和谨慎模式的检测方面，这为欺诈检测机制提供了风险和安全管理智能。\n\
  \n大数据分析的应用帮助数据科学家、预测模型师、统计学家和其他潜在分析师检查结构化数据（姓名、年龄、性别、日期等）、半结构化数据（`.csv` 文件、`html\
  \ code`）以及非结构化数据（音频、视频文件、电子邮件等）的产量，这有助于实时做出有效且适当的决策，而这在以前使用传统的分析方法是一项艰巨、持久且准确性最低的任务。\n\
  \n## 9.7.3 大数据分析：现代方法\n\n大数据存储、处理和分析技术的进步使得传统分析与大数据分析之间产生了巨大差异，如下：\n\n1. 传统数据仓库倾向于长期存储数据，而大数据应用程序能够无限期保留数据以分析历史相关性并检测网络威胁。\n\
  2. 大数据工具（如 `Hadoop ecosystem` 和 `NoSQL` 数据库）处理大数据并提高了解决复杂查询和分析的效率。这些工具增强了专用数据中心的适应性和成本效益。\n\
  3. 技术进步（特别是大数据的存储和处理）由于 `Hadoop` 而成为可能，它通过并行计算实现了巨大的存储。传统仓库中使用 `ETL`（提取、转换和加载）过程的数据转换是僵性的，用户需要定义模式；因此，整合新模式非常困难。\n\
  \n大数据分析采用的先进技术通过以下方式改变了安全分析的性能：\n\n1. 从各种来源收集大量的异构数据；\n2. 对数据进行系统性的深度分析以预测疑活动；\n\
  3. 基于安全分析和检查提供信息的视觉化表示；\n4. 实现数据的实时分析，使用户能够有意识地得出结论，并促进更快的决策过程。\n\n**第三代 SIEM**\
  \ 由 Gartner 在 2017 年提出，结合了传统的 SIEM 功能以及两项新技术，提供了以下大数据分析的升级功能。\n\n* 用户和实体行为分析 (UEBA)\
  \ 是一种利用机器学习技术记录用户工作流的机制，并检测偏离正常模式的任何异常。现代 `SIEMs` 利用机器学习和 AI 方法识别和探索典型及非典型人类行为，超越了简单的关联分析。这种洞察可以帮助组织发现恶意活动、内部威胁和欺诈。\n\
  * 安全自动化、编排和响应 (SOAR) 是整合异构技术并连接安全工具的行为，使其能够协同工作，这有助于安全分析师立即调查事件并自动对事件做出响应。下一代 `SIEMs`\
  \ 现在包含了自动事件响应系统。例如，`SIEM` 可以识别并警报勒索软件，并在黑客加密数据之前，通过自动在受影响系统上实施封措施进行响应。\n\n### 参考文献\n\
