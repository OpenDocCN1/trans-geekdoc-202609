  \n# 第一章\n\n## 数字取证导论\n\nPrasanta Kumar Parichha\n\n奥里萨邦警察\n\n\n- 1.5 结论\n- 参考文献\n\
  \n### 1.1 数字取证概述\n\n犯罪与人类历史一样悠久。大多数犯罪都会留下证据痕迹。尽管互联网以惊人的速度促进了商业机会并改变了数字技术，但不安全因素也暴露了严的威胁和漏洞。随着互联网的演变，用户数字生活的范围不断扩大，涵盖了从支付到社交网络，从电子商务到约会。我们可以说，现在我们所有的数据都处于网络空间中，且最容易成为黑客的目标。随着计算机系统的发展，世界也见证了网络犯罪的出现。\n\
  \n数字取证是一个用于应对在非法期间分析和处理大数据的挑战的过程，并保持取证原则以便在法庭上作为数字证据呈示。\n\n数字取证是一门涉及调查和分析技术的学科，用于收集和保存从特定电子设备或存储在计算机中的证据，并在法庭上呈交。网络取证的目标是在维护证据完整性和记录链的情况下进行调查。因此，它在网络犯罪调查中起着至关重要的作用。保护信息和资产的信息安全领域与应对高科技犯罪的计算机取证领域开始交织。获取磁盘镜像是为事后检查和分析准备数字司法证据的第一步。大多数刑事调查跨越边界，涉及多个司法管辖区。\n\
  \n#### 1.1.1 数字取证的定义\n\n在《法医杂志》中，Ken Zatyko 将数字取证定义为“为了法律目的对计算机科学和调查程序的应用，涉及经过适当搜查授权、证据链、数学验证、经过验证的工具、重复性、报告以及可能的专家证词”。\n\
  \n#### 1.1.2 数字取证方法论的 3A 准则\n\n数字取证方法论的 3A 准则如下：(i) 在不修改或损坏的情况下获取证据；ii) 验证恢复的证据与原始扣留的数据一致；iii)\
  \ 在不进行任何更改的情况下分析数据。数字取证包括对图像、视频和音频（包括模拟和数字格式）的分析。这类分析的重点通常是真实性、对比增强。\n\n#### 1.1.3\
  \ 数字取证的历史\n\n与其他学科相比，数字取证的历史非常短。\n\n- 1980 年代家用电脑的增长和拨号公告板系统（BBS）触发了执法部门内部计算机取证的发展。联邦调查局（FBI）于\
  \ 1984 年开发了一项开创计划来分析计算机证据的类型。\n- 1987 年开发了`AccessData`。滥用和基于互联网的攻击增加导致了计算机应急响应小组（CERT）的形成。\n\
  - 1993 年，FBI 在昆蒂科举办了首届计算机证据国际会议（IOCE），来自 26 个国家的代表参加了会议。\n- 1998 年，IOCE 受 G8 委托，建立数字证据的国际指南、协议和程序。\n\
  - 2002 年，数字证据科学工作组（SWGDE）出版了他们的著作《计算机取证最佳实践》。\n- 在《布达佩斯网络犯罪公约》期间，讨论了版权侵权、儿童色情和欺诈等相关话题。\n\
  \n\n\n\n\n*   ISO 在 2005 年发布了 `ISO 17025` 检验和校准实验室能力指南。\n*   逐渐，网络取证工具开始大放异彩：Guidance\
  \ Software 开发的 `EnCase` 和 Access Data 开发的 `Forensic Toolkit (FTK)`。随后，一些开源情报工具也进入视野，例如用于\
  \ Linux 的 `Sleuth Kit` 和 `Autopsy`。这不仅是因为网络犯罪（从网络钓鱼到黑客攻击和个人信息窃取）的不断上升，而且在全球范围内，公共和私有组织对取证专家的需求日益增加。我们都会同意这样一个事实：我们对信息通信技术（ICT）工具和互联网的依赖日益增加，今天我们在线使用聊天应用程序与朋友联系，在办公室里，我们在线使用\
  \ Facebook 等社交平台与朋友联系，在线购物、在线教学、在线学习以及在线提交账单。我们对计算机和互联网的依赖已经到了这种程度，因此，需要指南来保护信息不被滥用。然而，如果计算机的安全性受到破坏，计算机取证在事后调查中将非常有用。\n\
  \n### 1.1 数字取证的目标\n\n数字取证的目标是为以下工作提供指南：\n\n*   在事件发生后遵循第一响应程序访问受害计算机。\n*   在涉疑犯罪现场设计完整的程序以确保数字证据的真实性。\n\
  *   执行数据获取和复制。\n*   从数字介质中恢复已删除的文件和分区提取证据。\n*   分析数字介质以保存证据，分析日志并得出结论，调查网络流量和日志以关联事件，调查无线攻击和电子邮件犯罪。\n\
  *   制作提供完整调查过程的计算机取证报告。\n*   保存证据并维护证据链。\n*   采用必要的正确程序在法庭上出庭。\n*   作为专家证人在法庭上提交意见。\n\
  \n### 1.2 数字证据\n\n数字证据被定义为存储在电子设备上、接收或传输的具有价值的信息和数据。数字证据从本质上是脆弱的，可能会由于不当的处理或检查而遭到更改或破坏。取证检查最好在证据的副本上进行。原始证据应以保护其完整性的方式获取\
  \ [1,4]。Casey (2004) 将“数字证据”解释为：“数字证据或电子证据是指以数字形式存储或传输的任何具有证明力的信息，法庭案件可能使用”。然而，在接受证据之前，法庭可能会核实这些是相关证据、真实证据还是传闻证据。因此，数字证据可能也包括电子记录。\n\
  \n2000 年信息技术法（2008 年修订）对“电子记录”解释如下：电子记录意味着以电子形式记录或生成的、存储、接收或发送的数据、图像或声音，或微胶片或计算机生成的微型数据。《证据法》第\
  \ 3 条解释了所有文件（包括电子记录）作为证据的定义。《信息技术法》第 4 条规定：“如果任何法律规定信息或任何事项应以书面形式、打字或打印形式存在，那么只要此类信息或事项\
  \ (a) 以电子形式呈现且 (b) 可供后续参考，应被视为满足了要求”。\n\n数字设备通常存储大量数据（见图 1.1）。其中一些是活跃的，另一些可能是残留或备份数据。数字证据分为两类：(i)\
  \ `易失性证据` 包括内存、网络、运行进程和打开的文件；(ii) `非易失性证据` 包括硬盘驱动器、CD/DVD 和 USB。\n\n![图 1.1 数字证据的来源](img/fig01_01.jpg)\n\
  \n图 1.1 数字证据的来源\n\n#### 1.2.1 活跃数据\n\n*   活跃数据包含计算机当前的文件，即仍在目录中且所有应用程序可以使用的文件。\n\
  *   活跃数据由用户创建的数据组成，如客户信息、库存数据、文字处理文档或表格、程序和操作系统文件，包括临时文件、回收桶文件、互联网历史目录、“Cookie Store”和系统注册表文件。\n\
  *   活跃数据类似于在调查人员到达时采访犯罪现场的所有证人。\n*   活跃数据可能受密码保护或加密，需要进一步的取证分析。\n*   在犯罪现场，取证专家可以找到肉目易见且易于检索的线索。\n\
  \n#### 1.2.2 存档数据\n\n*   这是已传输或备份到外部介质的数据，如磁带、CD、ZIP 磁盘、软盘、网络服务或互联网。\n*   在犯罪现场场景下，存档数据将是犯罪发生期间安装并拍摄的监控摄像头中移除的监控视频。\n\
  *   侦探需要检查现场现有的活跃和潜伏数据，以确定哪些存档数据离开了现场。\n*   在计算机取证中，我们可以通过检查目标硬盘来识别从硬盘拷贝的文件（存档数据）。\n\
  \n#### 1.2.3 潜伏数据\n\n*   潜伏数据也称为环境数据，由删除的文件和其他数据组成，包括“留在数字缝隙中”的内存“转储”，但仍然可以检索。潜伏数据还包括以下内容：\n\
  \    *   `交换文件`：硬盘上的文件，用于为从处理器内存传输的程序提供空间。\n    *   `临时文件`：在创建新文件时用于包含临时信息的文件。\n\
  \    *   `打印机缓存文件`：每次打印文档时创建的图像文件。\n    *   `元数据`：提供关于文件创建、修改或删除的人、事、地点、时间和方式的信息。\n\
  *   如果没有现场技术人员，在犯罪现场是不可能发现潜伏数据的。同样，计算机取证专家使用软件工具从嫌疑人的硬盘中获取信息。\n\n#### 1.2.4 遗留数据\n\
  \n遗留数据是指计算机系统中活跃的数据。它包括介质空闲空间和文件簇中的数据，以及在不使用删除或特殊数据恢复技术的情况下，使用创建文件的应用程序不可见的文件内部的数据。\n\
  \n\n\n\n\n大多数用户认为从计算机中删除文件实际上会删除所有文件，但实际上，计算机的 `OS` 维护着一个每个文件名称和位置的目录。当用户删除文件时，`OS`\
  \ 并不会移除文件数据，而是仅指示该空间为可用。被删除文件的内容保留在原地，直到被专用程序覆盖。如果一个人知道如何访问这些已释放但未删除的区域并拥有适当工具，就可以恢复其内容。残留数据还包括分布在驱动器表面或嵌入其他文件中的文件部分。这些文件通常被称为文件碎片或未分配数据。\n\
  \n## 1.3 数字取证的分支\n\n数字取证有几个与调查各种类型网络犯罪相关的分支，如图 1.2 所示。这些分支包括以下[1,2,6]:\n\n![FIGURE\
  \ 1.2 Digital forensic branches.](img/fig01_02.jpg)\n\n图 1.2 数字取证分支。\n\n### 1.3.1\
  \ 计算机取证\n\n计算机取证是指使用取证技术从计算机中检索证据。计算机取证的目标是解释数字人工制品（如计算机系统、存储媒体或电子文档）的当前状态。\n\n\
  根据 Juniper Research 的数据，企业面临的网络犯罪损失将超过 2 万亿美元。随着全球范围内每天发生数据泄露，对数字取证专家的需求日益增加。\n\n\
  “取证”（forensics）一词字面意思是使用某种既定的科学过程对收集到的证据进行收集、分析和展示。然而，所有形式的证据都是重要的，特别是发生网络攻击时。因此，计算机取证的正式定义可以表述为\n\
  \n“这是一门结合法律和计算机科学元素的学科，通过对计算机系统、网络、无线通信和存储设备的数据进行收集和分析，使其能够在法庭上作为证据使用”。计算机取证对企业或公司来说至关重要。\n\
  \n### 1.3.2 网络取证\n\n网络取证是数字取证的一个分支，围绕检查网络相关的数字证据展开。它涉及为了信息收集、证据采集或入侵检测而对网络流量进行监控、记录、分析和解释。网络取证的主要部分包括包捕获与分析、网络设备获取和事件响应。由于企业非常关注数据免受网络攻击的，网络取证已成为\
  \ IT 行业的一个关键组成部分 [6]。\n\n网络取证产物提供了网络通信的证据或洞察。它们可以从 `DHCP` 服务器、`DNS` 服务器、`Web Proxy`\
  \ 服务器、`IDS`、`IPS` 和防火墙中生成。它还包括来自基于软件的防火墙以及邮件客户端（如 `MS Outlook`、`Outlook Express`\
  \ 和 `Eudora`）的证据。除了商业工具，还有丰富的开源工具如 `Wireshark`、`Xplico` 和 `Network Miner`。\n\n###\
  \ 1.3.3 软件取证\n\n软件取证旨在对计算机源代码进行身份分析。它涉及作者识别、鉴别和特征描述领域。这些残留物可能多种形式存在，包括编程语言源文件、Shell\
  \ 脚本、可执行代码、对象文件、对现有程序的修改，甚至是黑客起草的文本文件。\n\n### 1.3.4 移动取证\n\n根据研究，大多数网络犯罪是通过移动设备实施的。移动取证是从移动设备中恢复数字证据。它可以与任何具有内部内存和通信能力的数字设备有关，包括个人数字助理、`GPS`\
  \ 和平板电脑。通过移动设备，我们可以访问各种个人信息，如联系人、照片、日历和笔记、`SMS` 和 `MMS` 信息。智能手机还包含视频、电子邮件、浏览信息、位置信息以及社交网络聊天消息和联系人\
  \ [4,5,7]。\n\n由于几个原因，对移动取证的需求日益增长，主要原因如下：\n\n*   使用手机存储和传输个人及公司信息。\n*   在线交易中使用手机。\n\
  *   执法部门、犯罪分子与手机设备。\n\n移动设备上发现的证据类型不仅限于内存、`SIM` 或 `SD 卡`，还包括从智能手机收集的信息，如云存储、浏览器历史和地理位置。这存在证据和技术上的挑战。移动设备证据详细列表将包括：\n\
  \n*   订阅者和设备标识符。\n*   日期/时间、语言和其他设置。\n*   电话簿/联系人信息。\n*   日历信息。\n*   短信。\n*   拨出、接入和未接来电日志。\n\
  *   电子邮件。\n*   照片。\n*   音频视频录录。\n*   多媒体消息。\n*   即时消息。\n*   网页浏览活动。\n*   电子文档。\n\
  *   社交媒体相关数据。\n*   应用程序相关数据。\n*   位置信息。\n*   地理位置数据。\n\n### 1.3.5 内存取证\n\n内存取证是为了识别目标计算机或服务器上未经授权和异常的可疑活动。这通常通过运行特殊软件并将系统内存的当前状态捕获为快照文件，称为内存转储（memory\
  \ dump）。该文件可以带离现场并由取证专家搜索。最好的内存取证工具是 `Belkasoft RAM Capture`、`Process Hacker`、`Volatility\
  \ Suite`、`Rekall` 和 `Helix ISO`。\n\n内存获取类型包括：\n\n*   `Pagefile`：这是一个存储与系统 `RAM`\
  \ 中存储类似信息的文件。\n*   `VMware snapshot`：这是虚拟机的快照，保存了其在授予快照的瞬间的状态。\n*   `RAW format`：从实时网络环境中提取的。\n\
  *   `Crash dump`：由系统中运行的操作系统收集的信息。\n*   `Hibernation file`：保存的快照，操作系统可以在休眠后返回该状态。\n\
  \n### 1.3.6 恶意软件取证\n\n有不同类型的恶意软件（恶意程序）感染用户并窃取其个人信息，如姓名、地址、位置、电子邮箱、电话号码以及社交媒体登录密码等特殊身份。黑客注入恶意软件，如\
  \ `adware`、`spyware`、`virus`、`worm`、`Trojan`、`rootkit`、`backdoor`、`key logger`、`browser\
  \ hijacker` 和 `ransomware` 以获取详细凭据。\n\n恶意软件分析分为两种：\n\n*   `Static malware analysis`：涉及在不通过实际指令的情况下调查执行文件。\n\
  *   `Dynamic malware analysis`：执行恶意软件以观察其活动，理解其功能并识别可用于揭示特征的特征指标。\n\n### 1.3.7 数据库取证\n\
  \n\n\n\n\n数据库取证涉及对数据集内部元数据和页信息进行重建。在与数据库交互时，通常使用只读方法或数据的相同取证副本，以确保数据不受破坏。`Oracle`、`MySQL`、`Microsoft\
  \ SQL server`、`PostgresSQL` 和 `MongoDB`是一些常用的数据库。数据库服务器存储敏感信息，如 `schema`、`database\
  \ log`、`file system (metadata)`、`trigger`、`storage engine` 和 `data structure`（图\
  \ 1.3）。\n\n![图 1.3 数据库服务器。](img/fig01_03.jpg)\n\n图 1.3 数据库服务器。\n\n### 1.3.8 社交网络取证\n\
  \n大多数犯罪与社交媒体有关。社交网络取证是虚拟调查和分析技术的应用。Facebook 和 Twitter 等在线社交媒体监控并存储信息，分析和保护数字证据的类型。\n\
  \n### 1.3.9 反取证\n\n反取证试图操纵和删除数据。因此，对于取证专家来说，检查调查产生的延迟是一项艰巨的任务。反取证技术包括使用隐写术对数据进行加密、修改元数据、操纵时间戳、隧道、`Tor`\
  \ 浏览、擦除驱动器等。\n\n### 1.3.10 云取证\n\n云计算包括通过网络进行交互的服务。私有云、公有云、社区云、混合云和分布式云是云计算的部署模型。`Ias`（基础设施即服务）、`PaaS`（平台即服务）和\
  \ `SaaS`（软件即服务）是云计算的三种服务模型。\n\n### 1.3.11 比特币取证\n\n比特币是一种货币，用于方便的匿名交易。它基于去中心化的区块链。暗网网站包括\
  \ `Dream`、`Outlaw`、`Silk Road`、`Real Deal`、`Black Market Reloaded`、`Black Bank`、`Pandora`、`Sheep`、`Tor\
  \ Bazaar` 和 `Pirate Market`。可以使用区块链浏览器跟踪区块链和其他替代币。比特币取证是一项挑战性工作。\n\n### 1.3.12 大数据取证\n\
  \n大数据是组织用于持续发现和分析的潜在知识池。大数据包含的信息以不同形式存在：非结构化数据和多结构化数据 [3,10]。\n\n数据通过三个主要来源产生：\n\
  \n* 支付、发票、存储记录和交付通知产生的 `Transactional` 信息。\n* 通过设备本身收集的 `Machine data`，如 `web logs`\
  \ 或智能手机传感器。\n* 在社交媒体活动中发现的 `Social data`，例如推文或 Facebook 点赞。\n\n### 1.4 取证调查过程的阶段\n\
  \n以下五个主题描述了进行数字取证检查必要的 Basic 阶段（图 1.4），并建议了它们应该执行的顺序 [7,8]。尽管文档展示被列为最后一步，但经过培训的检查员理解，文档记录在整个检查过程中是持续的。\n\
  \n![图 1.4 数字取证检查阶段。](img/fig01_04.jpg)\n\n图 1.4 数字取证检查阶段。\n\n### 1.4.1 就绪性\n\n以下十步描述了实施取证就绪计划的关键活动。\n\
  \n1. 定义需要数字证据的犯罪场景。\n2. 识别可用来源和不同类型的潜在证据。\n3. 确定证据收集需求。\n4. 建立安全收集法律认可证据的能力以满足需求。\n\
  5. 建立潜在证据的安全存储和处理策略。\n6. 确保监控具有针对性，以检测和威慑重大事件。\n7. 规定在何情况下应启动完整的正式调查（可能使用数字证据）升级。\n\
  8. 对员工进行事件意识培训，使所有相关人员都理解自己的角色。\n9. 记录事件及其影响。\n10. 确保法律审查以采取行动。\n\nA. Pooe 教授和 L.\
  \ Labusch 开发了数字取证的概念模型（图 1.5）。\n\n![图 1.5 数字就绪性概念模型。](img/fig01_05.jpg)\n\n图 1.5\
  \ 数字就绪性概念模型。\n\n1. `People`：人员类别下有很多子活动，如聘用经验事件响应团队、职责分离、安全培训和意识活动。其目标是面向犯罪预防和检测的人资源管理。\n\
  2. `Process`：流程类别关注确保证据完整性的活动。这包括事件响应计划和方法论等操作性文档。\n3. `Policy`：促进数字取证的类别包括保留信息、规划响应和培训。\n\
  4. `Technology`：组织需要确保使用适当的技术不仅用于业务运营，还用于防止和检测事件。\n\n### 1.4.2 识别\n\n*洛卡德交换原理假设，当两个物体接触时，它们会在对方身上留下痕迹。*\
  \ 在数字犯罪现场，当两个系统接触时，我们经常会有痕迹证据 [1,7,8]。例如，如果个人浏览网站，Web 服务器或 Web 应用程序防火墙可能会在收集日志中记录该个人的\
  \ IP 地址。网站还可能在笔记本电脑上放置一个 `cookie`。就像在物理世界中，通过这种方式交换的证据可能是暂时的，我们观察它的能力可能限于我们目前拥有的工具和知识。\n\
  \n识别是取证检查过程中的关键步骤。它直接影响制定行动计划的努力，并最终影响调查的成功。在开始任何取证检查之前，必须识别行动范围，包括主要嫌疑人、最佳证据来源和所需的成本。需要注意的是，攻击者非常容易操纵数字证据，因此，在没有其他佐证的情况下，仅依赖单件数字证据应始终保持谨慎态度，并在信任之前对其进行验证。\n\
  \n### 1.4.3 收集\n\n数字证据其本质是脆弱的，可能会由于不当的处理或检查而被改变、损坏或破坏。由于这些原因，应该采取特别措施来保护这类证据。未这样做可能会导致证据失效或得出错误的结论。收集环节是数字取证人员开始获取数字证据的阶段\
  \ [1,2,10,11]。*互联网工程任务组* (`IETF`) 编写了一份名为《收集与存档指南》（`RFC 3227`的文件，解决了数字证据的易失性顺序：\n\
  \n* 寄存器、缓存。\n* 路由表、ARP 缓存、进程表、内核统计和内存 (RAM)。\n* 临时文件系统。\n* 磁盘。\n* 远程日志和监控数据。\n*\
  \ 物理配置、网络拓扑。\n\n\n\n\n\n* 归档媒体。\n\n数字取证调查员在开始证据收集过程时，必须考虑这种数据的易失性。应采用相关方法收集易失性证据，并将其移动到非易失性介质上（如外部硬盘）。\n\
  \n应避免在获取和保存阶段对数据进行意图或意外的修改；如果发生这种情况，请记录对系统中所做的更改。对存储设备进行写保护，以防意外覆盖数据。在将数字媒体带到取证实验室后，应维护适当的监管链（chain\
  \ of custody），并将此类证据存储在具有访问控制设施的物理安全区域。此外，还应制作足够的介质副本以进行调查。\n\n### 1.4.4 分析\n\n\
  提取（Extraction）是指从媒体中恢复数据。分析（Analysis）是指对恢复的数据进行解释，并将其转换为逻辑且实用的格式。收集过程结束后，证据将由取证调查员进行取证分析，以寻找能够支持或反对调查事项的发现。在分析过程中，取证调查员应维护数字证据的完整性。\n\
  \n### 1.4.5 汇报\n\n数字取证调查员需要准备一份详细的书面报告，该报告应涵盖每一个操作并记录所需的关键数据。此报告应该是详尽、准确且不带观点或偏见的。该报告将成为大型事件调查的一部分，有助于确定犯罪的根源\
  \ [3]。\n\n汇报的另一个方面是取证调查员在刑事或民事诉讼中可能扮演的角色。如果正在调查的事件产生了嫌疑人或其他责任方，则可能需要出庭作证。在这些法庭证词中，取证调查员被要求以与报告类似的客观方式陈述取证分析的事实。调查员被要求无偏见地呈现事实和结论，且其作证的意见可能会受到限制。某些人可能仅限于呈现调查的事实。在其他情况下，随着调查员技能的提高并被视为专家证人，他们可能能够提供意见。\n\
  \n所有这些文件都可以在法庭上提交审判。\n\n* 与案件调查员和/或检察官咨询时记录笔记。\n* 在案件笔记中保留搜查授权书的副本。\n* 在案卷中保留最初的协助请求。\n\
  * 保留监管链文档的副本。\n* 详细记录所有笔记。\n* 记录日期、时间戳和完整描述，包括所采取行动的报告。\n* 记录调查期间发现的异常情况。\n* 记录网络拓扑、所有用户登录\
  \ ID 和密码。\n* 记录网络修改情况。\n* 记录操作系统、运行的应用程序等。\n* 关于存储、远程登录和备份的犯罪现场记录。\n\n#### 1.4.5.1\
  \ 监管链\n\n监管链（Chain of Custody）是指取证链路以及对电子证据进行恰当的逐位记录，以便在法庭上真实地产生它。示例格式如图 1.6 所示。\n\
  \n![FIGURE 1.6 监管链。](img/fig01_06.jpg)\n\n维护监管链的一些程序包括以下：\n* 保存原始材料。\n* 对物理证据拍照。\n\
  * 对数字证据进行截屏。\n* 记录接收的日期、时间和和其他信息。\n\n### 1.5 结论\n\n大数据分析的大规模实施尚未到来。我们的生活已经交织在网络空间创建的大数据矩阵中。由于数字文档的存在，对数字取证的需求已达到更大程度。调查人员必须通过练习来最大限度地减少检查原始证据的可能性。他们必须充分意识到调查过程中的所有步骤。\n\
  \n### 参考文献\n\n1. NIJ 特别报告 (2004), 数字证据取证检查：执法部门指南。\n2. J. Sammons (2012), 数字取证基础,\
  \ ISBN-978-1-59749-661。\n3. P. Thenmozhi, N. Maraai (2016), 大数据与网络犯罪：预防与风险。\n4.\
  \ 访问自 `www.coursehero.com`。\n5. 访问自 `Ipubuzz.files.wordpress.com`。\n6. N. Reddy\
  \ (2019), 实用网络取证, Springer Science and Business Media, Germany。\n7. R. Rowlings\
  \ (2004), 取证就绪的十步法。《国际数字证据杂志, 12–18。\n8. A. Pooe, L. Labusch (2012), 数字取证的概念模型。`www.researchgate.net/publication/26126548`。\n\
  9. 访问自 `resources.infosecinstitute.com`。\n10. P. K. Parichha (2019), 网络犯罪：印度执法部门面临的巨大挑战。Digital\
  \ 4n Journal, 6, 19。\n11. ePGPathala 门户, MHRD, 印度政府。(2017), 网络犯罪学与网络取证模块。\n\n# 第\
  \ 2 章\n\n## 数字取证与数字调查：形成由执法部门、检察机关以及计算机欺诈和网络犯罪检查构成的悬浮侧翼\n\nM.S. Rao\nGujarat 取证科学大学\n\
  Sarat Chandra Satpathy\nOdisha 邦取证实验室\n\n\n\n\n\n\n\n### 2.8.1 数字调查工具的功能可以归类为\n\n\
  ## 2.8.1.1 硬盘镜像\n#### 2.8.1.2 调查分析\n## 2.8.1.3 结果展示\n#### 2.8.1.4 文档报告\n\n# 2.9\
  \ 数字刑案调查工具的边界与表彰\n\n### 2.10 结论\n\n### 参考文献\n\n### 2.1 法医学与数字取证\n\n法医学是一门利用技术手段对相关事实进行调查的科学分支，以证明相应的犯罪并惩罚犯罪分子。法医学通过应用科学方法，在保持法律规则完整的前提下，对隐藏证据进行检查和发现\
  \ [1–3]。它可以更准确地描述为“科学在法庭上的应用”，主要基于洛卡德原则，该原则指出“每当你做某件事时，你都会在犯罪现场留下一些东西（证据），并带走一些东西（证据）”\
  \ [1,2,4]。\n\n### 2.2 数字取证\n\n数字取证是数字欺诈调查过程中隐晦的部分 [4]。数字取证遵循传统法医学学科的哲学来建立和恢复佐证数字证据。数字取证是指利用计算机科学方法、工具和技术，从数字电子媒体设备包含的数据中提取潜在数字证据，以便在法庭上精确地获取、审查和持久呈现数据。数字取证分为不同的领域，如计算机取证、网络取证和软件取证。数字取证学科可以进一步细分为多种学科，如视频、音频、图像取、、取证和内存取证\
  \ [2,3,5]。计算机取证是在在使用独立计算机实施计算机欺诈和网络犯罪的地方寻找数字证据 [5]，而网络取证则处理识别和防止网络互联系统中的威胁，并在数字威胁发生后审查潜在的法律数字证据\
  \ [1]。软件取证使我们能够识别恶意代码的发起者。\n\n#### 2.2.1 数字证据\n\n在数字技术时代，更多的数字威胁证据固有的存在于数字设备中，尽管此类佐证的大部分仍用于传统犯罪的提交。数字证据以\
  \ 0 和 1 的形式存在，与纸质证据相比具有脆弱性和独特性 [6,7]。数字证据可能存在于用户隐藏、未知、异常和不熟悉的位置。数字证据的这种属性使其容易被污染或清除，并且是可以复制的\
  \ [7]。\n\n因此，数字取证调查的输出是脆弱的数字证据，需要妥善保存；另一方面，分析数字媒体需要创建碳拷贝，以保证其在法庭上的真实性和可接受性。随着数字时代的指数级发展并逐渐整合到日常生活中，新的审讯和挑衅不断涌现\
  \ [1,6,7]。数字取证调查的输出必须满足以下属性，才能在法庭上被允许。\n\n- **可接受性 (Acceptable)**：数字证据必须遵循某些法律规则才能在法庭上提交。\n\
  - **真实性 (Bona fide)**：它应该通过建立关联性，具有将数字证据数据到数字犯罪对峙的潜力。\n- **绝对性 (Absolute)**：它应该从两个角度追溯数字犯罪故事——证明网络犯罪分子的行为，并证明其无罪。\n\
  - **一致性 (Consistent)**：数字证据不应带有任何混淆或怀疑，以证明其合法性和诚意。\n- **合理且可解释 (Plausible and explicable)**：潜在的法律数字证据应当是自发可信且易于法庭理解的。\n\
  \n数字证据可以以活动证据和残留证据的形式存在，如图 2.1 所示。\n\n![图 2.1 数字证据的类型。](img/fig02_01.jpg)\n\n图 2.1\
  \ 数字证据的类型。\n\n活动数字证据对于操作系统及其用户是可以直接看到的。活动证据示例可能包括计算机用户创建的所有类型文件，如文档和电子表格。它可以从查获的硬盘中直接访问。然而，残留数字证据是间接存在于存储媒体中的数字数据，因为它已被网络犯罪分子删除或隐藏。可以通过调查工具进行恢复，因为用户并不知道系统删除的是指向相应文件的指针，而不是整个文件内容。文件的碎片可以从存储媒体的空隙空间（slack\
  \ space）或交换空间（swap space）中获取。\n\n### 2.3 数字取证的划分\n\n数字取证科学不同于传统的法医学学科 [2,8]；它要求在限制环境中进行检查；结果是获得可能证明网络犯罪分子恐惧或确定性的信息。\n\
  \n数字取证调查可以分为四个阶段：准备、收集、评估和后期评估 [1–3,7,8]。\n\n#### 2.3.1 准备\n\n这一阶段更多是为了传播发生数字犯罪时该做什么的意识。\n\
  \n##### 2.3.1.1 调查计划\n\n数字取证人员必须为调查证词编写策略计划。该证词概述了资源的识别和评估、调查程序的制定、角色和职责的分配，以及用于现场调查的风险评估策略和设备。\n\
  \n##### 2.3.1.2 培训与测试\n\n数字取证人员接受有关电子证据识别、搜索、收集、处理和运输过程的培训。数字取证的重要属性是具有调查价值的数字证据，使用音频、视频、手机和数字传真机等电子设备进行传输。由于数字证据本质上是脆弱的，数字取证人员必须经过良好培训来处理它。\n\
  \n##### 2.3.1.3 设备\n\n数字取证人员必须精通视频摄像头、数字相机、软件工具箱等检查设备，以便调查步骤顺利进行。\n\n### 2.4 收集\n\
  \n当通过入侵行为识别、审计追踪跟踪、投诉、画像检测、异常行为检测、日志活动监控任何其他手段检测到数字犯罪事件时，收集阶段就会发挥作用。\n\n#### 2.4.1\
  \ 证据搜索与收集\n\n\n\n\n\n数字取证数据保管需要对受调查的系统磁盘驱动创建精确副本，并对内存、寄存器以及网络行为状态中的所有活动数据和残留数据进行检查。需要对寄存器、缓存内存、内存和临时文件、运行进程和动态网络表进行调查，以收集证据数据。\n\
  \n#### 2.4.2 数据恢复\n\n数据恢复在数字取证调查中起着重要作用。通过第一步创建数字介质驱动器的精确副本，可以从系统的所有硬件软件组件中恢复数据。数字介质的复制涉及对保管的数字介质构建位级拷贝（bit-for-bit\
  \ copy），提供一个不可消除的真实副本，可以在其上进行各种分析实验，而不接触原始数字介质驱动。\n\n#### 2.4.3 评估\n\n数据评估是数字取证调查中的第三个关键环节，因为在这个阶段，数字取证检查员要确定所有的\
  \ WH 问题，例如数字犯罪行为是否发生、何时以及如何发生，以及对执行者的后果。这一阶段通过分析原始数据的每个微观层面，寻找通往真实真相的路径以及潜在的法律数字证据。使用融合、关联、绘图、映射或时间线等技术对疑似数据进行检查和分析，以建立并发现数据内部的关联形成探索性假设。\n\
  \n#### 2.4.4 评估后\n\n潜在数字证据的收集（涉及提取、解释和确认，随后的提交）将移交给法院采取进一步行动，并将扣收的数据归还给所有者。法院要求数字证据具有正直性、真实性和可复制性，并具备非干扰性和最小化属性。\n\
  \n### 2.5 数字取证调查模型的阶梯模型\n\n数字调查利用科学技术对过去事件进行检查，其目的是寻找潜在的数字证据，将数字犯罪追溯到其源头或起点，讲述事件发生的整个过程以及是谁所为。数字检查背后的原理是挖掘与受调查的事件相关的数字数据，并将其呈现给事实判定者。调查以数字调查模型的形式遵循一种定义的方法。许多模型是根据\
  \ Kruse 和 Heiser [9] 所提到的犯罪调查的三个组成部分开发的。调查建模的基本组件可以总结为：在保持完整性的情况下获取证据、证实证据提取的合法性以及在保持完整性的情况下探索数据以定位感兴趣点。\n\
  \n数字取证调查 [4,10] 包括可获取的证据来源（如目击者证词、凭证、如生物指纹之类的实体证据）以及扣收数字磁盘驱动器中的数据。一旦完成数字取证调查，就可以重建数字犯罪的过去过程，这形成了决策的依据。最终裁定是由一组执行数字调查的人员之外对数字证据进行说明后做出的。数字调查涉及考虑到构成犯罪的事件来制定理论和假设。\n\
  \n因此，数字调查模型的道德准则 [9] 可归类如下（如图 2.2 所示）：\n\n*   数字证据的识别\n*   数字数据的保护\n*   从数字源中挖掘证据数据\n\
  *   以报告形式记录数字证据\n\n#### 2.5.1 数字源的识别\n\n数字调查的这一步可以再次细分为两个步骤：首先是识别来源，其次是验证这些来源在法律上是可接受的\
  \ [7]。来源包括各种磁盘存储器、内存卡、闪盘或计算机系统。当确认来源后，数字调查员必须在扣收的介质驱动器中区分出合适和不合适的数据，开始采集过程，随后创建精确副本。与案件无关的非必要介质驱动器将被销毁。\n\
  \n#### 2.5.2 证据数字数据的保护\n\n当从扣收的介质中识别并恢复数字证据后，必须遵守某些规定和限制进行保护，以便在法庭上展示 [4,7]。数据的保护决定了其法律效力。证据数据的保护应涉及隔离、安全和防护以防止篡改。数据的完整性通过\
  \ `MD5` 和 `SHA-1` 进行检查。通常使用防静袋防止扣收的介质驱动器受磁场影响，确保妥善保存。\n\n#### 2.5.3 从数字介质源挖掘证据数据\n\
  \n从数字介质源挖掘证据数据是一个枯燥、耗时且复杂的过程。感兴趣价值数据的挖掘类型取决于正在调查的数字犯罪案件。潜在价值数据的提取是独特的，且完全取决于所涉及的检索程序和分析技术\
  \ [7,10]。如果数字证据直接位于扣收的介质驱动器中，那么调查时间会较短。然而，如果数据被隐藏或删除，调查时间取决于删除文件的恢复。介质驱动器的空隙空间（slack\
  \ space）可能包含删除或隐藏文件的残留物。\n\n\n\n\n数字取证主要分为三个分支 [2,3,8]。\n\n1. 计算机取证；\n2. 网络取证；\n\
  3. 软件取证。\n\n### 2.6.1 计算机取证\n\n计算机取证学科之所以备受关注，是因为由于计算机在各种形式中的持续使用，犯罪呈现加速趋势，例如犯罪实体、用于实施非法活动的设备，或与侵入活动相关的证据库\
  \ [12,13]。计算机取证学科可以追溯到 1984 年，当时 FBI 实验室和其他执法机构开发了用于确认计算机证据的程序（图 2.3）。\n\n![FIGURE\
  \ 2.3 Computer forensics.](img/fig02_03.jpg)\n\n图 2.3 计算机取证。\n\n计算机取证检查是一个漫长且复杂的过程，需要取证人员花费数月甚至几年的仔细关注，才能从嫌疑系统中获取感兴趣的潜在数据\
  \ [13]。根据国家司法学院的说法，计算机取证检查的主要目标是通过经过批准的方法对数字证据进行保护、收集、验证、识别和解释，将犯罪追溯到源头并重构犯罪现场 [12]。\n\
  \n数字取证检查旨在获取以下内容：\n\n1. 发现嫌疑系统上的所有文件，包括删除和隐藏的文件、临时文件或交换文件；\n2. 寻找受保护文件的内容；\n3. 分析磁盘中的未分配空间以及空隙空间（slack\
  \ space），因为它们可能包含可能的证据；\n4. 对嫌疑系统的整个检查步骤制作文档报告，并列出可能的相关文件和暴露的文件数据。\n\n### 2.6.2\
  \ 网络取证\n\n20 世纪 90 年代初是网络取证或网络取证分支的诞生标志，其目的是防止对系统的恶意攻击。网络取证涉及获取、存储和检查网络审计追踪，旨在寻找安全漏洞或其他信息保证问题的源头\
  \ [2]（图 2.4）。数字取证的这一部分还承诺通过对网络攻击场景进行事后分析，提取潜在的价值价值数据。此类网络威胁包括所有类型的网络在线攻击，如拒绝服务（DoS）、分布式拒绝服务攻击、用户到根以及远程到本地攻击\
  \ [2]。网络或网络取证分支涵盖了各种活动和诊断实践，例如诊断入侵检测系统（IDS）的日志 [10]，调查参与网络攻击的网络流量以及网络设备 [2,4]。\n\
  \n![FIGURE 2.4 Network forensics.](img/fig02_04.jpg)\n\n图 2.4 网络取证。\n\n独立计算机和涉及互连计算机的网络有一个共同点：在完成非法尝试后，两个源都可能包含潜在的法律数字证据。可以检查路由器日志以获取任何关于恶意流量的嫌疑证据。因此，对来自路由器、交换机、IDS、防火墙、Web\
  \ 服务器和 Web 代理等不同来源的日志进行数字取证分析，有助于维护独立计算机系统以及网络或网络取证的安全。根据数字犯罪调查的需求及其类型，证据可以在服务器级、代理级或或其他多个来源收集。可以从\
  \ Web 服务器日志中查看事件的发生情况及其发生时间。另一方面，可以使用数据包嗅探器 [3] 追踪内部网络流量来积累潜在的数字证据，以证明任何类型的数字犯罪。\n\
  \n### 2.6.3 软件取证\n\n数字取证的这一分支涉及代码分析，以识别和分类恶意代码的作者 [3]。此类犯罪调查中的数字调查人员专注于识别恶意代码、自荐邮件的编写者、特征分析和分类。\n\
  \n### 2.7 数字犯罪调查工具及其概述\n\n数字犯罪的检查和评估是由数字取证人员使用取证调查工具完成的，这些工具通过维护证据的完整性和真实性，帮助保存和获取潜在证据，以便在法庭上进行进一步证明。诸如\
  \ `EnCase Toolkit` [14]、`Forensic Toolkit` [15]、`SafeBack Toolkit` [16] 和 `Storage\
  \ Media Archival Recovery Toolkit (SMART)` [17] 等调查工具是软件包，可用于收集和审查数字证据。数字调查工具用于特定任务，如镜像制作、搜索证据信息和生成报告。这些工具在功能图形用户界面上存在不同的观点，即命令行环境可以显著提升探索工作。数字调查工具由美国国家标准与技术研究院（NIST）[8]\
  \ 编制，该机构概述了此类调查工具针对数字犯罪现场需求的要求。下文将进一步展示可用的取证调查工具的功能、用性和局限性。\n\n### 2.7.1 EnCase\
  \ Toolkit\n\n\n\n\n\n在执法部门和私营公司进行的各种调查中，常用的数字取证调查工具是由 Guidance Software 设计的 [14]。该调查工具主要在所使用的\
  \ Windows 操作系统上运行，用于审查、获取并对可能在法庭上提交的感兴趣潜在数据准备陈述。`EnCase` 软件会创建嫌疑硬盘的镜像，以确保原始证据不受损坏。该工具具有用户友好的图形用户界面，并提供许多功能。该工具最大的吸引力在于可以在创建副本之前对嫌疑介质进行查看。该调查工具的这一功能可以帮助数字取证调查人员确定是否需要对相应的数字犯罪进行进一步调查。操作\
  \ `EnCase` 取证软件需要一个也称为加密狗的安全密钥，由它来控制对该软件的访问权限。`EnCase` 软件中的每个案件都被视为一个新案件，导致对嫌疑媒体驱动器进行映像及其查看。启动媒体驱动器的获取以进一步调查并寻找潜在证据。该软件具有查看所有文件的能力，包括隐藏和删除的文件。通过使用\
  \ `MD5` 和 `SHA1` 算法生成的哈希值来证明其真实性。`EnCase` 提供了不同的屏幕以以不同的格式显示和审查数据。提供类似于表格的电子表格格式，它描述了关于数字数据的不同信息，如文件名、文件扩展名和文件类型。该调查工具还提供了以缩略图形式查看图形图像的功能，使数字取证调查人员能够轻松快速地访问。要查看缩略图集中的任何嫌疑图像的放大视图，可以点击相应的图像以便在窗口屏幕的下部分查看。该工具还提供日历视图，可以从那里收集文件的创建、访问和修改日期等信息。人们还可以对特定案件的文件活动进行自定义。调查工具的报告视图提供了关于嫌疑设备中存在的文件和文件夹的完整文档报告。该文档报告还包括位级细节，如总扇区、总簇、媒体大小、书签的图形图像和文件、媒体驱动器系统中的操作系统环境以及进行调查的相应数字取证调查人员。\n\
  \n### 2.7.2 取证包\n\n`FTK` 调查工具是由 Access Data Corporation 开发的具有成本效益且有利的取证映像软件 [15]。它主要用于分析电子邮件。`FTK`\
  \ 的操作系统环境是 `windows`，且价格比 `EnCase` 调查工具便宜。作为任何调查工具的首要重要活动是创建被指控介质的验证副本，`FTK` 拥有创建硬盘和其他媒体驱动器副本的软件包。`FTK`\
  \ 工具可以创建扩展为 `.eo1`、`.smart`、`.aff` 和 `.raw` 的文件格式。`FTK` 调查工具的各种元素包括 `FTK Imager`、`Registry\
  \ spectator` 和 `Known File Filter` (`KFF`)。`FTK imager` 负责创建被控介质的验证副本映像，并对所有文件进行采样以寻找证据。`Registry\
  \ spectator` 检查嫌疑系统的注册表文件，以获取注册表中存在或修改的文件以及密码（如果使用了的话）的概述信息。`KFF` 主要通过通过包含所有已知文件哈希值的源数据库匹配其哈希值，来检查为检查而创建的副本拷贝的真实性。通过调查工具对文件格式的自识别，分析时间被大大缩短。如果发现了证据信息，工具将呈现从获取到证据收集分析的完整报告。`FTK`\
  \ 调查工具是自明易是的，并附带各种选项，通过计算 `MD5` 和 `SHA-1` 哈希值来检查所映像媒体驱动器的真实性。`FTK` 带有各种功能窗口，如案件详情概述窗口、`Investigation\
  \ Explorer` 窗口、`Graphics`、`Evidence Search`、`Graphics`、`Email Analysis` 窗口和一个特殊的书签标签，该标签可以快速访问所有已查看或解决的重要数字犯罪案件。\n\
  \n案件详情概述窗口以表格格式叙述正在检查的文件，可以向下滚动以找到感兴趣的项目。不同文件带有不同部分的标签页。人们可以通过点击相应的标签页查看该部分下的所有文件。`Investigation\
  \ Explorer` 窗口提供了由 `windows` 操作系统中的 `windows explorer` 叙述的精确层级结构。所有图形图像都由 `Graphics`\
  \ 窗口以缩略图形式部署，以便调查人员可以选择其证据图像进行放大查看。该调查工具的专业领域在于电子邮件以及收件箱消息到附件的心理分析（或邮件分析），以及对 `outlook\
  \ express` 的支持。`FTK` 工具带有两种强大的搜索方法：实时搜索和索引搜索。`live search` 使用位比较技术对搜索项进行处理，而 `indexed\
  \ search` 涉及 `dtsearch` 搜索引擎 [18]，该引擎基于嫌疑关键词搜索工作。通过一个特殊的书签窗口，数字取证调查人员可以快速访问并在证据文档报告写入额外的注释。\n\
  \n### 2.7.3 SafeBack 工具包\n\n`SafeBack` 是由 Armor Forensics 开发的基于 `DOS` 的数字调查工具 [16]，主要供全球的数字取证调查人员用于计算机安全措施。该调查工具能够创建被控媒体驱动器的副本模型，以便可以在映像的驱动器上进行调查，而不影响原始副本。`SafeBack`\
  \ 的功能限于映像，而不是对驱动器中的文件进行搜索或分析。`SafeBack` 调查工具使用 `SHA-256` 算法来保证插的完整性。由 `SHA-256`\
  \ 生成的验证码与数据一起存储。与其他两个调查工具相比，`SafeBack` 不需要安全密钥即可操作。`SafeBack` 工具从命令行提示符运行，特殊命令为\
  \ `Master.Exe`。\n\n### 2.7.4 存储介质存档恢复工具包\n\n`SMART` 由 ASR Data Acquisition and Analysis\
  \ [17] 开发，由 `Linux` 操作系统运行，主要供全球的法医调查机构、信息安全专业人士军事人员使用。与其他调查工具相比，`SMART` 带有用户友好的界面。它还结合了许多数字取证调查的功能。`SMART`\
  \ 是一种利用 `SHA-1` 算法检查映像媒体驱动器真实性的调查工具。它还为调查人员提供了使用 `MD5` 算法和循环冗余校验 32 算法 [17] 生成哈希码的选项。在功能方面，`SMART`\
  \ 仅用于通过检查媒体驱动器的位拷贝创建副本映像。该调查工具还提供了搜索和报告功能。使用安全密钥打开工具包并开始用于数字犯罪调查。\n\n\n\n\n该调查工具还提供了有关被扣硬盘的信息，例如被扣设备的大小、被扣介质设备中存在的文件和文件格式以及在其中发现相应的持久数据。该调查工具带有各种功能标签页，例如“获取”（Acquire），它可以帮助根据用户选择的自定义哈希算法创建介质驱动器的精确副本。SMART\
  \ 调查工具具有多种功能，包括搜索、过滤、哈希码生成及其与哈希数据库的匹配。该工具还有一个图形标签页，可以实现图形图像的缩略图表示。作为调查过程部分的图像可以标记为重要。“报告生成”标签页有助于生成详细的证据性文件报告，并提供预览和调整选项。证据性文件报告以\
  \ HTML 格式生成。\n\n### 2.8 数字犯罪调查工具的分类学\n\n所有数字调查工具在开发时都考虑了首要需求，即创建被扣磁盘驱动器的精确副本，以确保原始价值数据不被损坏，并可以通过生成哈希值在法庭上证明其真实性。哈希值的生成有助于保持镜像硬盘中潜在法律数字证据的准确性和完整性。副本的形成遵循位位复制，确保不对原始副本进行任何修改。除\
  \ `SafeBack` 之外的所有数字调查工具都能够执行文件分析、其阶段处理以及特定案件的感兴趣关键词搜索。数字调查员有权在不更改文件的情况下查看文件，这有助于发现案件的精确数据。文件的展示包含了所有信息，如文件名、文件创建日期、时间和文件大小。\n\
  \n数字调查工具的分类是基于调查工具所使用的操作系统类型以及该工具提供的特定功能（[图 2.5]）。对数字调查工具进行分类旨在简述其当前功能，并进一步发现其局限性，以应对日益增长计算机欺诈和网络犯罪的需求。\n\
  \n![FIGURE 2.5 数字犯罪调查工具的分类。](img/fig02_05.jpg)\n\n图 2.5 数字犯罪调查工具的分类。\n\n### 2.8.1\
  \ 数字调查工具的功能可以归类为\n\n#### 2.8.1.1 硬盘副本\n\n数字取证检查的首要且核心标准是保持原始数据不被触碰，而是需要创建被扣数据的精确副本。副本创建是通过逐扇区复制数据来制作镜像映像以获得位流副本的过程。潜在的数字证据通过获取过程提供，并结合\
  \ `MD5` 哈希算法和 `SHA-1` 算法生成哈希值以验证。副本创建是一个取决于介质大小耗时过程，然后对特定案件数据进行进一步检查。\n\n#### 2.8.1.2\
  \ 调查分析\n\n收集数据后，必须对数据进行分析，以解释数据并将其构建成建设性的格式。在此阶段，根据证据信息得出结论性意见的数据同样重要。数字证据数据的分析需要各种技术，例如通过搜索关键词发现数字证据。关键词长度应保持较短，以便在空隙空间或未分配空间中找到单词或字符串\
  \ [4,6–8]。分析技术还涉及签名分析，用于验证单个文件的唯一十六进制头签名。分析技术包括哈希值的生成及其匹配、注册表检查、电子邮件检查和过滤。\n\n####\
  \ 2.8.1.3 展示\n\n在某种数字调查中，分析图形图像是一项困难的任务。数字图形以及视频和音频文件很难追踪支持互联网上发生的任何数字犯罪。目前没有软件软件包可以对被扣介质驱动器中的图形、音频和视频文件进行分类。因此，数字调查员必须手动查看音频、视频和图像文件的内容，这是一项繁琐、单调且耗时的任务\
  \ [2,3,8]。所有数字调查工具都配备了文件展示功能，这减少了人为活动和手动处理时间。查看是从根级别观察文件的过程。\n\n#### 2.8.1.4 文档报告\n\
  \n报告是数字取证探索的重要步骤，因为它包含了获取数字犯罪调查的结果发现。报告是整个文档的呈现，描述了逐步的调查任务，如用于获取、记录、积累、保护、恢复、修复、跟踪和寻找关键证据的方法\
  \ [1,2]。报告应该是自解释且可追溯的。它应该指定所有直接存在的文件以及删除或可能完成数字犯罪案件故事的文件。报告应该记录所有相关数字证据的细节，以及关于数字犯罪现场的所有证明信息。报告应帮助数字取证调查员确定起诉后果，并应在法庭上获得正式认可。\n\
  \n### 2.9 数字犯罪调查工具的边界与建议\n\n当今数字调查工具在处理复杂的数字事件方面有很多缺点，因此本章此节旨在根据其主要优势和功能对数字调查工具进行概述和分类，并提出可以为未来研究方向提供的建议，以增强现有调查工具处理现代数字犯罪的能力。由于涉及的大量数据被放大，数字取证探索正变得耗时且更加多样化\
  \ [6,19–21]。由于几乎所有领域大数据的发展 [19,20]，数字调查调查依赖于目前的数字调查工具来解决犯罪案件。\n\n现有的数字调查工具面临以下局限性\
  \ [3,7,21]：\n\n*   减少大量数据中存在的冗余，\n\n\n\n\n-   识别数据之间的关联性\n-   确定数据的相似性并将数据分类分组\n\
  -   对查获的驱动器中直接可见、隐藏或已删除的数据进行简单且易于识别的可视化呈现\n-   识别可能产生潜在数字证据的感兴趣模式\n\n数字调查工具的局限性和边缘性可能无法应对这一数字世界中日益增长的数据维度、复杂性、容量、真实性和速度。由于对网络犯罪分子进行画像、追踪、追踪和查获是任何类型数字调查计算智能的重点，应当开发并增强处理大数据的容量、真实性和速度的融合技术\
  \ [6,19,20]，以实现易于可视化的效果，并对基础数字调查工具进行增强。进一步增强调查工具以适应新的问题解决技术和方法，将提高数字取证调查与研究的能力水平和卓越性。数据融合\
  \ [23,24]、数据挖掘和机器学习算法 [25] 在数字取证调查中的应用，可以为提高判决的严明程度提供大量的预期回报，缩短人工投入时间并降低成本。未来的研究方向应该是开发和发现现有调查工具的增强组件包，帮助数字调查员得出更好的结论，使数字信息技术对国家保持有用。\n\
  \n### 2.10 结论\n\n计算机在当今世界中发挥着不可或的作用，因为人们已习惯将其日常工作。数字信息技术时代通过提供卓越的信息存储空间和规划能力，极大扩展了我们的大脑能力。因此，人们的心理活动、记忆和评估过程由于受个人大脑控制且不向任何人开放，可以保持隐私和个人化；但我们输入计算机系统的内容无法被视为隐私。这一原则使得数字证据的收集成为可能。数字证据的整合是一项挑战性任务，因为网络犯罪分子利用计算机系统的不可探测性来隐藏身份。数字取证的主要目标是进行数字调查，以便将数字犯罪溯源源头，并确保数字证据的延续、持久以及取证步骤的清晰性。由于互联网是连接全球每一个系统的最大网络，计算机欺诈和网络犯罪可以在全球任何一点发生。为了保护敏感信息，不仅有必要采取保护措施，也有必要意识到此类事件的发生。尽管有许多精密的防御程序，信息资源仍然容易受到频繁的网络攻击。因此，全球的人都应该做好充分准备以应对此类网络威胁。尽管市场上提供了各种调查工具，但应当明确其能力和局限性，以便开展进一步研究来增强其功能。在本章中，对数字犯罪调查工具的简要回顾概述了其当前能力，并描述了进行犯罪调查以稳定收集不同类型数字证据的模型步骤。本研究的主要意图是推导出一个数字调查模型，作为现有证据获取工具包的辅助，提供离线可采纳的法律数字证据。\n\
