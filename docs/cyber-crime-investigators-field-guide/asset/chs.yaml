  \ AccessData 产品一起处理的相同案件，以便您能够看到相同类型的分析，并观察工具之间的相似性和差异。图 6.26 显示了 EnCase 4 的打开屏幕。\n\
  \n![图 6.26 EnCase 4 的打开屏幕](img/fig6.28.jpg)\n\n*图 6.26* EnCase 4 的打开屏幕。\n\n\n\n\n\
  -   [获取图像](https://doi.org/10.1201/9781003134817-7)时，点击`New`，这将打开`Case Options`屏幕。您可以输入信息或接受默认值（案件）`Name`、`Examiner\
