  DOI: [10.1201/9781003134817-13](https://doi.org/10.1201/9781003134817-13)\n\n过去约\
  \ 15 年，惊人的技术进展推动人类走向一场具有广泛变革潜力的转型，这种转型有可能在本 decade 内以不寻常的方式重新定义“成为人类”的含义。你每天在新闻中看到的关于各种人造（机械和电子）设备植入人体的报道层出不穷——新的假肢、新的假臂、心脏起搏器、从细胞培养或移植的新器官，以及其他种种。全球以近乎指数级的速度增长的这一科学计划，目前被称为后人类主义（transhumanism）。各国和地区之间在该技术的发展上展开竞争，涉及军事、法律、生物学、化学、工程、政治、生物伦理以及整个学术界。这些所谓的\
  \ GRIN 技术（基因组学、机器人技术、人工智能（AI）和纳米技术）正在基因组学、机器人技术、人工智能（AI）和纳米技术等领域不断被构建和增强。这些技术正在根本重新设计我们的身体、我们的思维、整体生理结构，甚至记忆。全球智库联合科学家和军事人员/各类学术机构推动我们走向一种尚未准备好的“优越人类”新物种。虽然自首例心脏移植数十年来进展缓慢，但这项事业如今正以指数级速度加速，这得益于我们信息系统的增强以及对身体和心智工作机制的更深入理解。这很可能导致在战场、城市和法庭上出现大众从未预料到的冲突。该项目由纳税人资金支持，未来将呈现出科幻电影中才会出现的景象，而大多数人都准备不足。你在新闻中听到过一些这些项目，但大量使用这些\
  \ GRIN 技术的建设正在世界各地的公共和私营实验室中默默进行，同样由纳税人资金出资。涉及的政府包括美国、加拿大、英国、中国、法国、澳大利亚以及其他国家。\n\
  \n`Neurotechnology` 是指任何电子设备与神经系统相连的过程或设备，包括通过医疗神经调控来增强或修复大脑功能的设备。值得一提的是以下几个网站：\n\
  \n- [`neurotechnology.com/`](https://neurotechnology.com)\n- [`www.techopedia.com/definition/34091/neurotechnology`](https://www.techopedia.com/definition/34091/neurotechnology)\n\
  - [`mcgovern.mit.edu/research-areas/neurotechnology/`](https://mcgovern.mit.edu/research-areas/neurotechnology/)\n\
  \n网络学（cybernetics）是另一项关键技术，属于 GRIN 范畴。得益于好莱坞的影响，基于网络学的机器（机器人与生物相结合的赛博人——赛博人）已成为流行文化中的热门话题。前人工智能实验室主任胡戈·德·加里（Professor\
  \ Hugo de Garis）告诉我们，21 世纪末之前很可能爆发一场重大战争，这场战争将导致数十亿人死亡，几乎是不可避免的。被称为“artilects”（即“人工智能”的缩写）的智能机器将比人类更加智能，进而威胁到全球霸权，从而引发支持\
  \ artilects 与反对者之间的冲突。即便在 21 世纪初，我们也已经面临关于 AI 实验和项目应走多远的政治、法律和科学争论。极有可能，许多实验室已经突破了普通人所认为的伦理底线，从而开展了上述讨论的技术。\n\
  \n你可能在想，我为什么要提这么多内容。其实，我已经参与过一些涉及人机接口被黑客攻击的案件，包括恶意软件攻击。所以，让我们继续往下看，你就会明白这一切最终指向何方。\n\
  \n在论文《工业社会及其未来》中，有人指出：随着人类面对日益复杂的问题，机器智能不断提升，人类最终会把决策交给机器，因为机器能更快、更准确地做出正确决策。到某个时点，人们想要关闭机器，但将无法做到，因为他们已经高度依赖机器，关闭机器等同于自杀。你现在就能看到一丝端倪。例如，电话刚出现时，你只需与对方交谈即可；而今天的手机不仅用于通话，还能追踪位置、在未经同意的情况下监听对话，甚至被人远程黑客入侵摄像头，让他人在不知情的情况下看到你的位置。这仅是起步。未来“更糟糕”的事情将接踵而至，有些人甚至不认为这些是坏事，而另一些人则感到震惊。起初这些变化是逐渐发生的，供应商会先提供人们想要的功能，然后“炸弹”就落下，他们在设备中植入本质上就是恶意软件或特洛伊木马。\n\
  \n我曾与一位居住在武汉、中国的华裔女士交谈，她指出所有的监控摄像头让她感到安全。我告诉她，她的想法是错误的，因为大多数摄像头没有人实时监控，它们是用来记录画面，以便在发现问题后，执法人员可以回放录像，寻找并抓捕恶意分子——而不是在事件发生时直接捕捉。她听到这个真相后感到震惊和惊恐。\n\
  \n以下是供你自行研究（使用 Google、DuckDuckGo 或其他搜索引擎）的有趣项目：\n\n- Ray Kurzweil – 纳米技术与 NASA 支持的跨学科研究生项目\
  \ Singularity University 的联合创始人，Ray 在人工智能领域做出过突破性工作。\n- Vernor Vinge – 圣地亚哥州立大学教授、计算机科学家\n\
  \  - Vision-21 Symposium – “The Coming Technological Singularity”\n    - 由 NASA\
  \ 刘易斯研究中心赞助\n- Kevin Warwick – 伦敦大学雷丁分校的网络学教授\n  - 研究重点：人机融合、人工神经网络、后人类主义\n- Millennium\
  \ Project – 全球智库，由联合国大学、史密森尼学院和 FGI（Futures Group International）资助\n\n\n\n\n## “State\
  \ of the Future” Report – Writing of genetic code like a computer program\n\n[content]\n\
  * Dr. James Hughes – Changesurfer Radio (weekly talk show) \n    * Director – Institute\
  \ for Ethics and\n<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk>