  \n## Chapter 15 Making use of open-source intelligence (OSINT)\n\nDOI: [10.1201/9781003134817-15](https://doi.org/10.1201/9781003134817-15)\n\
  \n在本章中，您将发现结构化信息与我在各种段落中进行的杂乱无章但均为有价值的内容相结合，请逐行阅读。\n\n对于取证分析师的工作与生活而言，开源情报（OSINT）的重要性与必要性体现在：在调查过程中，您可能已使用\
  \ AccessData 的 FTK 或 EnCase 或其他取证工具收集证据。但随后，您大概需要对大量信息进行分析，以弄清发生了什么、恶意行为者是谁、他们从何而来、不良事件何时发生、为何发生、如何发生。通过日志分析和\
  \ OSINT 工具的使用，您可以回答上述大部分问题。如果您尚未了解或使用 OSINT，本章将为您敞开眼界；若您已有 OSINT 背景，则本章可作为复习和参考。OSINT\
  \ 是从公开来源（杂志、报纸、网站、博客等）获取的数据，用于情报框架。在情报界，“ overt” 指公开可得的、不隐藏的来源。数据不必秘密即可有价值。事实上，通过收集和分析现有公开数据，可以发现“秘密”。公开阅读材料中源源不断的数据不断影响我们对世界事件的理解。请记住，数据与信息存在区别：数据是未经处理的原始收集内容，而信息是对数据进行分析和处理后获得的结果。\n\
  \n可供使用的工具众多，例如 [`archive.org`](https://archive.org)，您可以在其中搜索超过 570 亿个网页的历史（无论其当前是否存在）。Theharvester（在\
  \ Kali Linux 及其他地方可得：[`tools.kali.org/information-gathering/theharvester`](https://tools.kali.org)）是一款可用于在\
  \ Internet 上收集个人和组织信息的工具。其他工具（如 Python 和 Go）可供有编程经验者使用。\n\n在进行 OSINT 数据收集时，必须保持证据链（Chain\
  \ of Custody）。根据 NIST（[`csrc.nist.gov/glossary/term/chain\\_of\\_custody`](https://csrc.nist.gov)），它是“在证据的收集、保全和分析全生命周期中，记录每个处理证据的人、证据被收集或转移的日期/时间以及转移目的的过程”。\n\
  \n在调查中，您可能会收集涉及个人和企业的敏感数据，因此请记住您有责任妥善保护这些数据。您应仅在需要的时间内保留数据，随后将其销毁。您可以将数据交给销毁设施，或使用覆盖软件、用\
  \ sledgehammer（锤子）砸毁硬盘，或使用磁性擦除（需注意磁性擦除对 SSD 驱动器效果不佳）。建议使用加密、虚拟机和容器。同时，可使用 U 盘、外置硬盘，并尽可能使用专用主机进行每项调查。一些组织会在每次调查后擦除硬盘，然后自动写入新镜像。您也可以为每项调查使用全新硬盘，然后安全或销毁旧硬盘。Raspberry\
  \ Pi 可在此方面发挥显著优势，因为它可以使用可移除的 Micro-SD 卡。建议采用全盘加密和文件级加密。另一项安全措施是，当您不在机器前且未在活动使用时，应始终断开系统与网络（Internet\
  \ 或其他）的连接。虽然这有时会带来不便，但它也能为您的调查保驾护航。您所使用的网络应与公司主网络分离。\n\n\n\n\n-   [通过散布关于自己的虚假信息](https://wiki.example.org/feynmans_learning_method)来保护自己，这会让那些不认识你但正在寻找你的人感到困惑，他们分不清哪些是真实的，哪些是假的。它可能不会永久保护你，但肯定能让坏人延缓进度。保护自己免受网络爬虫侵害的另一种方法是在你使用的各类网站（如\
  \ LinkedIn）上在姓名前加一个表情符号。在 Windows 10 系统上使用表情符号只需按住 Windows 键并按下点号键即可。将光标放置在想插入表情符号的位置，然后双击选择的表情符号即可。如果你能做到这些，就不要穿会让你显眼的衣物。如果有人想进行图片搜索，穿有标志或其他图案的\
  \ T 恤和帽子（例如）会让你更容易被找到。\n\n让我们谈一谈数学，特别是三角函数。掌握三角函数可以在观察图片并试图确定其位置、方向等方面帮助很大。图片中的阴影既能提供方向信息，也能提供时间信息。\n\
  \n我们可以收集哪些 OSINT 数据？让你的想象力发挥作用，因为有许多地方可以收集，如公共记录、社交媒体、搜索引擎、数据泄露信息、电子邮件/电话号码查找网站、评论网站、Yelp、Trip\
  \ Advisor 等……细节绵长。\n\n如前所述，还有哪些工具可以用于收集 OSINT？如果你不介意花费一些金钱，可以选择 Hunchly（https://www.hunch.ly/），如果想要免费工具，可以选择\
  \ Zotero（https://www.zotero.org/）。技术包括屏幕录制（如 QuickTime）、网页下载、截图、归档、API 调用、Google\
  \ Dorks 等。请注意，Hunchly 会自动对所有下载的文件进行哈希处理。Hunchly 是一个加拿大产品。Google Earth Pro 也是全球侦查人员的绝佳工具。其他有用的工具包括\
  \ VeraCrypt（https://veracrypt.en.lo4d.com/windows）、Maltego（https://www.maltego.com）和\
  \ Autopsy（https://www.autopsy.com）。\n\n另一个值得关注的网站是 **OsintFramework.com**。以下是他们网站的摘录，展示了如何查找实现各种目标的工具：\n\
  \n![](img/inline15.1.jpg)\n\n在收集到各种数据后，请复制并存储到三个不同且相互远离的位置。这将有助于确保你的数据安全。在完成调查后，将数据移动到安全的离线存储介质，如加密的\
  \ U 盘和/或外部硬盘驱动器。这些介质应明确标记为“销毁日期”或“审查日期（可能需要销毁）”。切勿保留不需要的数据（但在销毁前请先考虑）。我不建议将数据存储在云端，除非是为了避免归因。如果使用云端存储，请务必建立非常严格的防火墙规则、强认证，并在未使用时关闭主机。\n\
  \nExifTool 也是你必须拥有的工具之一。它能做的事情之一是判断图片是否经过 Photoshop 修改。根据 [`linoxide.com/install-use-exiftool-linux-ubuntu-centos/:`](https://linoxide.com)：\n\
  \n“你可能在搜索图片恢复软件时遇到过 ExifTool。事实上，ExifTool 不仅仅是用于图片恢复的工具。它是一个开源程序，用于读取、修改和操作图像、视频、音频和\
  \ PDF 的元数据。元数据是附加在多媒体文件上的额外数据。例如，照片的元数据包括设备名称、图像分辨率、拍摄地点、拍摄时间及修改时间等。ExifTool 支持多种元数据格式，包括\
  \ EXIF、GPS、XMP、GeoTIFF、Photoshop IRB、ID3、FlashPix。相机写入 EXIF（可交换图像文件格式），本文主要讨论图像，但请注意\
  \ ExifTool 可用于修改任何文件的元数据。此外，如果你需要快速且安全地复制、移动、重命名、提取预览或一次性修改多张图片，ExifTool 是你的不二之选。”\
  \ 还需注意，如果没有 Exif 数据，则使用反向图像搜索。同时，Exif 也可用于非图像文件类型。\n\n使用 ExifTool：\n\n*   `sudo\
  \ apt-get install exiftool`\n\n*   `exiftool <filename.jpg>`\n\n请注意，ExifTool 的数据可以被修改或覆盖。获取该工具的渠道众多（请务必检查\
  \ md5 哈希以确保工具的有效性），例如 [`webintmaster.com`](https://webintmaster.com)。此外，还有其他图像分析和研究工具可供选择，你可能会感兴趣：\n\
  \n1.  Tradint.IO  \n    1.  a. 通过使用最佳工具和方法，执行全面的 Tradint（贸易情报）调查。只需输入公司名称/URL/行业/位置或它们的组合，即可获得按上下文排列的所需工具，适用于各类研究任务。\n\
  \n2.  TinEye（TinEye.com）  \n    1.  a. 反向图像搜索及更多功能\n\n3.  FotoForensics（FotoForensics.com）\
  \  \n    1.  a. 提交 JPEG 或 PNG 进行取证分析\n\n4.  Face（https://azure.microsoft.com/en-au/services/cognitive-services/face/）\
  \  \n    1.  a. 分析图像中的脸部\n\n5.  Market Researcher & Cyber Researcher\n\n6.  Exif\
  \ Viewer Pro  \n    1.  a. [`chrome.google.com/webstore/detail/exif-viewer-pro/mmbhfeiddhndihdjeganjggkmjapkffm?hl=en`](https://chrome.google.com/webstore/detail/exif-viewer-pro/mmbhfeiddhndihdjeganjggkmjapkffm?hl=en)\n\
