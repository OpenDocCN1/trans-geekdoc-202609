  \nUNIX will be used to mean both UNIX and Linux, since they are very similar. In\
  \ essence, Linux is another “flavor” of UNIX, similar to Solaris, AIX, and others.\
  \ A great benefit of Linux is that it is open-source (the source code is open for\
  \ all to see). A UNIX system command reference will be provided since it has been\
  \ widely used for decades and its use is increasing globally.\n\nWhen working on\
  \ a UNIX system, you could encounter either a graphical user interface (GUI such\
  \ as pictures/icons/words to point and click on) or a command line (various UNIX\
  \ commands must be typed to work with the system – not a point-and-click operation).\
  \ Working at the command line will be presented since the GUI is much easier to\
  \ use and more intuitive. Many skilled UNIX personnel do not have a GUI interface\
  \ on their machine because they much prefer to type commands at the command line\
  \ (more powerful and versatile – and more difficult).\n\nAt the command line, there\
  \ are various prompts that you could encounter, depending on how the owner has configured\
  \ the system. The prompts you see are indicative of the type of shell (environment)\
  \ the system owner is using. The shell allows the user to use a few commands/configurations\
  \ that are peculiar to that shell. Although there are others, the most common prompts/shells\
  \ you will come across are:\n\n*   Korn Shell Prompt     $  \n*   Bourne Shell Prompt   $\
  \  \n*   C Shell Prompt       %  \n\nAlthough there are many UNIX commands, I will\
  \ cover those that are most useful to an investigator and make extensive use of\
  \ examples to show how a command is most commonly used.\n\nFTP commands:\n\n? command\
