  \ [`www.arema.org/`](https://www.arema.org)\n\nWhen it comes to the cyber security\
  \ testing of trains and their associated rail networks, the past 10 years have seen\
  \ a significant increase in this activity since transportation is considered one\
  \ of the critical infrastructures in the United States. Some rail projects even\
  \ require a cleared facility to perform the security testing, such as at the Airbus\
  \ cleared facility in the Washington, DC area. It’s normal now to see three phases\
  \ of security testing for rail networks over the past three years:\n\n1.  Site audits\
  \ and evaluations\n\n2.  Supplier/component level testing \n\n    1.  a. Country\
  \ of origin being required for all electronic components down to the board and chip\
  \ level\n\n\n\n\n3. 在发货前，需进行整体系统安全检查  \n\n1. a. 由于维护端口可让你接入列车主干网络，因此包括对维护端口的渗透测试（HVAC\
