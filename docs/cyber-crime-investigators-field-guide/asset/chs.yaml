  \ | HFS+ (Power Mac) | FFS (BSD) | NTFS |\n| EXT2 | EXT3 | Reiser | UDF | CDFS (CD-ROM)\
  \ |\n| ISO 9660 Joliet | Sun Solaris |   |   |   |\n\n-   一个硬件安全钥匙（dongle），可为 USB\
  \ 或并行端口类型，在您希望对已收集的数据进行分析时是必需的。如果您仅希望对硬盘（或其他介质）进行获取（即位元流备份），则不需要硬件安全钥匙。\n\n-   进行搜索时，您会使用关键字。这些关键字是可能与当前案件相关的词汇。例如，在调查黑客案件时，您可能会有一份黑客工具名称或相关程序所使用的文件的关键字列表。例如，若有人远程控制了\
  \ Microsoft Windows 2000 系统，您可以将关键字“BO2K”加入列表，因为这是一种能够远程控制此类系统的黑客工具。关键字为全局，可在多个案件之间共享，存储在\
  \ `Keywords.ini` 文件中。通常分析员会将关键字分类到文件夹中，以便在不同类型案件中快速使用。当您参与多个案件时，很容易在不同案件之间关联和验证证据。加载相应的关键字后，您即可开始搜索，一次性搜索所有案件。\n\
  \n-   现在已实现两个独立窗口用于文件类型和文件签名。分析员最初看到的文件类型是从文件扩展名（如 exe、doc、xls、ppt 等）中提取的，但一旦启动签名分析，签名列会填充正确的信息。\n\
  \n-   EnCase 4 的新增功能包括：\n\n    * 支持 RAID。\n\n    * EnCase 4 能够提取所有文件和文件夹的所有者、组以及权限设置。\n\
  \n    * 当适用时，会显示 SID。\n\n    * NTFS 压缩文件可通过虚拟设备解压缩，然后像其他文件一样进行分析。\n\n    * 可以对 OLE（Object\
  \ Linking and Embedding）文件格式进行分析，该格式用于 Microsoft Word、PowerPoint、Excel 等多种应用。OLE\
  \ 文件可存储大量元数据（如 URL、最后保存者、修订日期、公司名称、文件作者、创建日期、打印时间、编辑时间等），EnCase 在使用“查看文件结构”命令时全部可见。\n\
  \n    * EnCase 附带的部分新 EnScripts 包括：\n\n        * 查找完全由特定字符填充的磁盘扇区\n\n        * 查找电子邮件地址\n\
  \n        * 在未分配簇中查找 JPEG、GIF、BMP 和 EMF 图像文件\n\n        * 查找所有 Internet Explorer\
  \ 历史记录\n\n        * 查找所有 Visa、American Express 和 MasterCard 信用卡号\n\n        * 解析\
  \ UNIX 和 Sun Solaris 日志文件\n\n        * 在 EnCase CD 中可找到 Irfanview，这是一款免费的图像查看器。您可以将其设置为\
  \ EnCase 的外部文件查看器。如果需要最新版本，请访问 [`www`](http://www) irfanview.com。\n\n-   在 EnCase\
  \ 4 中，最简便的媒体获取方式是使用 EnCase 网络启动盘（ENBD）。它允许您使用系统中的网络接口卡（NIC）而非使用并行或 USB 线缆。要使用 ENBD，您需要访问以下\
