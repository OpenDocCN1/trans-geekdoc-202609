  \n若要从命令行指定要分析的文件，输入：\n\n nta <完整路径名>  \n\n示例：\n\n nta d:\\\\tools\\\\iterns\\\\\
  AnalyzeMe.txt  \n\n使用 NTA 时，任何发现的潜在线索均应予以验证，因为由于交换文件的特殊工作方式，错误或误导信息的可能性存在。  \n\n\
  \n\nRemember: Swap files can be months or even years old.\n\n## AnaDisk\n\n* New\
  \ Technologies, Inc.\n\n* [`www.Forensics-Inti.com`](http://www.Forensics-Inti.com)\n\
  \nAnaDisk 是用于分析磁盘软盘的实用程序。AnaDisk 执行以下功能：\n\n* 将磁盘软盘的部分复制到文件中\n* 修复带有数据错误的磁盘软盘\n\
  * 不顾格式复制磁盘软盘\n* 在磁盘软盘中搜索文本\n* 分析磁盘软盘以确定密度、格式、更改和错误\n* 允许自定义磁盘软盘的格式，添加额外的轨道和扇区\n\
  * 可修改磁盘软盘上的数据\n* 提供 ASCII 和十六进制显示的物理扇区和文件\n\n上下文敏感帮助可通过 FI 键获得。\n\n要从 DOS 提示符中安装\
  \ AnaDisk，请输入：\n\n ADINSTALL <enter>\n\n按照提示进行操作。\n\n要启动 AnaDisk，请输入：\n\n ANADISK\
  \ <enter>\n\n主菜单出现，提供九个供选择的项目，具体取决于您想要执行的操作。按 FI 键可阅读关于这九个选项的说明：\n\n1. Scan：读取磁盘软盘并告知您是否存在任何问题。根据操作系统类型对磁盘软盘进行分类。按空格键可在扇区之间切换。顶部的黄色箭头指向上为侧\
  \ 0，向下为侧 1。为获得最快性能，请对每个选项选择“否”。如果出现“但偶数轨道和奇数轨道上的数据不同”消息，请按 Y 查看隐藏在磁盘软盘上的数据。\n\n\
  2. Sector：允许您按扇区方式编辑磁盘软盘。遵循提示并使用 FI 键获取帮助。\n\n3. File：根据文件名检查文件。遵循提示并使用 FI 键获取帮助。\n\
  \n4. Search：在磁盘软盘中搜索您指定的数据。遵循提示并使用 FI 键获取帮助。\n\n5. Copy：允许您对磁盘软盘进行真实复制。遵循提示并使用 FI\
  \ 键获取帮助。\n\n6. Repair：修复磁盘软盘上的数据错误。遵循提示并使用 FI 键获取帮助。\n\n7. FAT：允许您编辑文件分配表。遵循提示并使用\
  \ FI 键获取帮助。\n\n8. Format：允许您自定义磁盘软盘的格式。遵循提示并使用 FI 键获取帮助。\n\n9. Dump：将磁盘区域的扇区级复制到\
  \ DOS 文件中。遵循提示并使用 FI 键获取帮助。\n\n在执行各种功能时，系统会询问您是否希望写入审计文件。最好回答“是”，因为这将生成一个记录所选功能在执行期间发生情况的文件。\n\
  \n在某些功能期间，您会被问到各种问题。请使用方向键导航至选项。\n\n## Seized\n\n* New Technologies, Inc.\n\n* [`www.Forensics-Inti.com`](http://www.Forensics-Inti.com)\n\
  \nSeized 会锁定计算机并显示消息，声明计算机已作为证据被 confiscated，且不应操作。\n\nSeized 应复制到磁盘/Zip 磁盘等放置在计算机引导区的磁盘中，然后用证据胶带封\
  \ sealed，以防止引导磁盘/Zip/Jaz/CD 的轻易取出。只有 CMOS 设置中系统首次引导的设备才需要 Seized 程序。例如，如果 CMOS 设置将系统首次从磁盘驱动器（通常为驱动器\
  \ A）引导，则在引导磁盘中放置 Seized，文件名为 autoexec.bat，插入磁盘驱动器，并用证据胶带封 sealed。系统开机后，警告信息会闪烁并阻止系统使用。\n\
  \nSeized 由被 confiscated 系统的 autoexec.bat 文件调用。如果计算机开机，用户将看到 Seized 程序的闪烁警告信息。\n\n\
  如果系统配置为先从硬盘引导，并在硬盘的 autoexec.bat 文件的第一行放置 Seized，则 Seized 将阻止对系统的任何使用。如果稍后希望将系统恢复为可用状态，则需要从引导磁盘启动系统。系统启动后，编辑\
  \ autoexec.bat 文件并从中删除 Seized。此后系统将如常工作。命令语法为：\n\n SEIZED <enter>\n\n## Scrub\n\n\
  * New Technologies, Inc.\n\n* [`www.Forensics-Intl.com`](http://www.Forensics-Intl.com)\n\
  \nScrub 可用于永久删除硬盘数据。Scrub 使用全零位覆盖每个磁盘扇区，然后使用全一位覆盖，最后再进行一次写入十六进制 F6 的通行。可变次数的覆盖次数（即覆盖次数）可在\
  \ 1 到 32,000（约）之间变化。\n\nScrub 程序不适用于非 BIOS 驱动器（例如，它不适用于 Iomega Zip 驱动器）。命令行语法为：\n\
  \n scrub/d:<drives>/p:<number of passes>/g\n\n/d: 参数指定要擦除的驱动器（驱动器）。请记住，0 表示系统中的第一个硬盘驱动器，1\
  \ 表示第二个驱动器，2 表示第三个硬盘驱动器，以此类推。\n\n**注意**：您可以使用 /d:all 或 /d:a 表示擦除系统中所有硬盘驱动器。\n\n\
  /p:<number of passes> 参数用于指定硬盘擦除的次数。如果您未提供 /p: 的值，则默认对每个指定的硬盘进行两次擦除。\n\nScrub 在开始运行前通常会请求用户确认。如果您使用\
  \ /g 开关，Scrub 不会请求确认，这对于自动化擦除过程很有用。\n\n如前所述，默认情况下最后写入硬盘的十六进制模式是 F6。如果您希望写入其他十六进制模式，请使用\
  \ /v: yy 开关，其中 yy 为您想要的十六进制模式（如 E5、A3 等）。\n\n**注意**：参数的顺序（/v:、/g、/d:、/p）不影响结果，只要每个参数之间有空格，且参数内部不允许包含空格。\n\
  \n此外还有一个参数 /x。如果使用 /x，则会禁用对硬盘的自动检测以及使用 INT 13H BIOS 扩展。\n\n我将提供两个示例供说明：\n\n1. 擦除驱动器\
  \ 0、1、2、3，使用七次零和一的覆盖，最后一次使用 A4 模式，且用户不进行确认。\n\n scrub/d:0,1,2,3/p:7/g/v:A4\n\n2.\
  \ 擦除所有驱动器，使用八次零和一的覆盖，最后一次使用 D5 模式，且不需要用户确认。\n\n scrub/d:all/p:8/g/v:D5\n\n**注意**：切勿在正在擦除的驱动器上运行\
  \ Scrub，因为 Scrub 会锁定正在擦除的驱动器。\n\n## Spaces\n\n* New Technologies, Inc.\n\n* [`www.Forensics-Intl.com`](http://www.Forensics-Intl.com)\n\
  \nSpaces 的用途是创建包含空格（且仅空格）的文件。Spaces 创建的每个文件恰好包含 10,000 个空格。参与加密的人员发现，这使得 Spaces\
  \ 成为评估加密模式（以及计算机安全视角下的某些弱点）的理想工具。命令行语法为：\n\n spaces <enter>\n\n上述命令的结果是生成一个名为 spaces.001\
  \ 的文件，该文件恰好包含 10,000 个空格。\n\n## NTFS FileList\n\n* New Technologies, Inc.\n\n* [`www.Forensics-Intl.com`](http://www.Forensics-Intl.com)\n\
  \n* ntfsflst.exe\n\n命令语法为：\n\n NTFSFLST <FILE NAME> <VOLUME:> \\[<VOLUME\\] \\[/M\\\
  ]\n\n可以通过输入以下命令为文件名添加路径：\n\n /M 添加 MD5 值到输出。\n\n要显示计算机系统中硬盘卷的列表，请输入：\n\n NTFSLST\
  \ ID\n\n要查看计算机系统上的用户手册，请输入：\n\n NTFSFLST MAN | MORE\n\n例如，输入：\n\n NTFSFLST C:\\\\\
  SecretData D: E:/M\n\n在此情况下，我希望从卷 D 和卷 E 获取目录信息。将结果保存到 C 驱动器名为 SecretData 的文件中，文件扩展名为\
  \ .dbf（SecretData.dbf）。同时，/M 将提供 MD5 值。\n\n\n\nNTFS FileList 创建一个 `a.dbf` 文件的数据库，其中包含计算机目录信息。该文件可由\
  \ Microsoft Excel（或任何其他读取 `.dbf` 文件类型的程序）读取。\n\nMD5 哈希值用于判断文件内容是否被修改。它也可以用于识别内容相同的文件（无论文件名是什么）。\n\
  \nWindows NT 使用 Universal Coordinated Time（协调世界时，UCT）。NTFSFLST 也使用 UCT，因为它直接读取驱动器信息。必须考虑计算机设置的时区。例如，EST（东部标准时间）等于\
  \ GMT 减去五小时。\n\n**注意**：对于非常大的文件，NTFSFLST 可能会因为 NTFS 的复杂性而工作得非常慢。请耐心等待。大文件可能需要 15\
  \ 到 20 分钟。\n\n### NTFS GetFree\n\n*   *New Technologies, Inc.*\n\n*   *[`www.Forensics-Inti.com`](http://www.forensics-inti.com)*\n\
  \n*   *ntfsgetf.exe*\n\n要获得卷(s) 上可用空间的估计值，输入：\n\n NTFSGETF <VOLUME:> \\[<VOLUME:>..\\\
