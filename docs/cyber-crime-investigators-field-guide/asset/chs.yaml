  \ || cm. 禁用到远程 PIX 防火墙的版本 2 私有链接路径。 |\n| no nat || cm. 取消将网络与 IP 地址池关联。 |\n| no\
  \ outbound || cm. 移除之前使用 outbound 创建的访问列表。 |\n| no rip || cm. 禁用 RIP 更新。 |\n| no\
  \ route || cm. 从路由表中删除一条路由记录。 |\n| no snmp-server || cm. 停止 PIX 发送 SNMP 事件信息。 |\n\
  | no static || cm. 禁用虚拟池中本地 IP 地址与全局 IP 地址之间的永久映射（静态翻译槽）。 |\n| no syslog || cm.\
  \ 停止记录 syslog 消息（控制台、主机 IP 地址、输出设施级别）。 |\n| no telnet || pm. 禁用 IP 地址的 Telnet 访问权限。\
  \ |\n| outbound || cm. 创建一个访问列表，决定内部 IP 地址如何访问外部活动。 |\n| passwd || 设置 Telnet 和 HTML\
  \ 访问的密码，最多 16 个字符，不区分大小写。 |\n| ping || cm. 判断其他 IP 地址是否在 PIX 可见范围内。 |\n| reload\
  \ || pm. 从闪存中重新加载配置并重启系统。 |\n| rip || cm. 修改 RIP 设置。 |\n| route || cm. 为指定接口输入静态路由。\
  \ |\n| show || 根据模式不同，显示命令信息（包括年龄、ARP、认证等）。 |\n| show actkey || um. 显示激活密钥及用户许可证数量。\
  \ |\n| show blocks || um. 显示系统缓冲区利用情况。 |\n| show config || pm. 查看闪存中的配置。 |\n| show\
  \ hw || um. 显示硬件标识值。 |\n| show interface || um. 查看网络接口信息。 |\n| show memory || um.\
  \ 显示系统内存利用情况。 |\n| show processes || um. 显示正在运行的进程。 |\n| show version || um. 查看\
  \ PIX 版本。 |\n| show who || um. 显示 PIX 上的活动 HTTP 和 Telnet 管理员会话。 |\n| show xlate\
  \ || um. 显示翻译槽的内容。 |\n| snmp-server || cm. 提供 SNMP 事件信息。 |\n| static || cm. 将本地\
  \ IP 地址映射到全局 IP 地址。 |\n| syslog console || cm. 查看 PIX 上的 syslog 消息。 |\n| syslog\
  \ host || cm. 定义发送 syslog 消息的主机，syslog host ip_address。 |\n| syslog output || cm.\
  \ 开始发送 syslog 通知消息。 |\n| telnet || pm. 允许内部 IP 地址通过 Telnet 配置 PIX。 |\n| timeout\
  \ || cm. 设置翻译和连接槽的空闲最大时间。 |\n| who || um. 显示 PIX 上的活动 Telnet 管理员会话。 |\n| write erase\
  \ || pm. 清除闪存中的内容。 |\n| write floppy || pm. 将当前配置存储到软盘上。 |\n| write memory || pm.\
  \ 将当前配置保存到闪存中。 |\n| write terminal || pm. 在控制台查看当前配置。 |\n| 两大主要问题：防火墙的配置错误和代码漏洞。\
  \ |\n| 四个主要项：安全、性能、速度、管理（包括“易用性”）。 |\n| 在选择防火墙前，需要评估潜在风险并制定安全策略。 |\n| 防火墙无法保护的内容：企业工作站上的调制解调器。\
  \ |\n| 防火墙架构：三种基本的访问控制方法： |\n| 1. 包过滤：检查所有看到的数据包，然后根据预定义规则转发或丢弃它们。 |\n| 2. 代理：作为用户请求的中间体，在应用层（应用代理）或会话/传输层（电路中继）为所需资源设置第二个连接。\
  \ |\n| 3. 状态检查：像包过滤一样检查数据包，但进一步记住哪个端口号用于哪个连接，并在连接关闭后关闭对该端口的访问。Check Point 开发了状态检查架构，使防火墙能够安全地传输几乎任何应用。\
  \ |\n| 可执行内容（如 Java 和 ActiveX 对象）：互联网和内部网流量的一个令人不安的方面。可执行内容可以通过许多防火墙所允许的服务直接通过防火墙。Web\
  \ 用户可能会下载包含恶意 ActiveX 或 Java 对象的页面。由于防火墙已配置为允许 Web 访问，它会直接放行这些内容。 |\n| DMZ 设计：为内部网增加额外的保护措施。即使外部段的攻击者成功入侵\
  \ DMZ 机器，内部网络仍然受防火墙保护。 |\n| 日志文件会填满：此时最好关闭外部访问。与其覆盖旧日志条目或在没有日志的情况下继续运行，关闭外部访问更安全。\
  \ |\n| 防火墙警报：设置分页或电子邮件警报以应对未经授权的访问尝试。 |\n| SYN 洪水：也称为同步风暴；一种拒绝服务攻击；对 ISP 非常严重，会向防火墙发送大量\
  \ TCP 同步请求，导致防火墙耗尽所有缓冲区，无法接受合法连接。 |\n\n\n\n*   Java 和 ActiveX：Java 被认为比 ActiveX\
  \ 风险更小，因为它具有内置的安全控制，而 ActiveX 没有。Microsoft 表示，ActiveX 的长期安全解决方案是数字签名，用于保证每个对象的安全。Net\
  \ 管理员最好在防火墙处筛选可执行内容。\n\n*   防火墙配置项：\n\n    1.  a. 页面或电子邮件对未经授权的访问尝试发出警报。\n\n   \
  \ 2.  b. 远程禁用外部访问（外部接口）。\n\n    3.  c. 任何允许远程配置的产品都应对防火墙的连接进行身份验证和加密。\n\n    4.\
  \  d. 拒绝来自特定子网的访问。\n\n    5.  e. 记录被阻止的访问尝试。\n\n    6.  f. SYN 洪水攻击。\n\n    7. \
  \ g. Ping of death（死亡 Ping）。\n\n    8.  h. 记录满（full）。\n\n    9.  i. 磁盘满。\n\n   \
  \ 10. j. 电子邮件或分页警报用于：\n\n        1.  i. 传输超过 20 MB。\n\n        2.  ii. 1 点到 6 点之间的使用量超过\
  \ 5 MB，且流量超过 40 MB。\n\n        3.  iii. 每分钟请求的连接数过多。\n\n        4.  iv. 每分钟超过 10\
  \ 次尝试访问不存在的 IP 地址。\n\n        5.  v. IP 欺骗尝试：攻击者在防火墙外部将其机器配置为使用内部 IP 地址。\n\n   \
  \     6.  vi. 传输 /etc/password 或类似文件。\n\n## Appendix FDiscovering unauthorized access\
  \ to your computer\n\n使用“netstat”命令确定是否存在对工作站的未经授权连接。如下所示，使用 /? 参数可以查看“netstat”命令的“帮助”部分。\n\
  \nnetstat /? 显示协议统计和当前 TCP/IP 网络连接。\n\nNETSTAT \\[-a\\] \\[-e\\] \\[-n\\] \\[-s\\\
