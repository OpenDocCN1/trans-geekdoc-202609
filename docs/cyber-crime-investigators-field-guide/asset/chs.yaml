- "# \n网络犯罪调查员现场指南\n\n\n\n\n\n\n\n\n\n\n\n\n为确保可靠的数据和信息出版，已作出合理努力，但作者和出版商无法对所有材料的有效性或其使用的后果承担责任。作者和出版商已尽力追踪本出版物中复制的所有材料的版权所有者，并对未获得出版许可的版权所有者致以歉意。如果任何版权材料未被注明，请写信告知我们，以便在未来的再版中予以更正。\n\
  \n\n\n*商标声明*：产品或公司名称可能是商标或注册商标，仅用于识别和说明，且不意侵犯任何权利。\n\n\n\n\n\n\n我谨将此书奉献给网络安全领域的同行。你们对全球网络基础设施安全的无声奉献虽被许多人目不暇接，但我（以及许多其他人）想向你们表达感谢。如果没有你们，我们的全球计算机通信基础设施将陷入难以想像的混乱。\n\
  \n## 前言\n\n过去 50 年里，数据通信领域的发展堪称惊人。越南战争期间，我的服役地点之一是位于中国海的一个岛屿。我是一支信号情报小组的成员，负责拦截和解码战时通信流量。我们尽力对拦截的信息进行解码和分析，但很多时候需要借助当时高端的主\
  \ frame 计算机系统。我们是否拥有将数据上传到主 frame 进行处理，再下载回结果的通信网络？不可能。我们只能将大型磁带交给 SR-71 黑鸦（SR-71\
  \ Blackbird）飞行员，由其飞往美国进行主 frame 计算机处理。处理结果获得后，我们会收到电话通知，告知是否发现关键信息。要相信 50 年前的做法如此繁琐，如今难以想象。\n\
  \n快进到今天。数据网络现在让我们能够及时、高效地将信息传输到地球上几乎任何位置，甚至包括外太空的飞行器。但这种通信技术的巨大提升带来了什么？——为犯罪活动提供了新的场所。谁是\
  \ cyberspace 中的犯罪分子？首先是有组织犯罪，如黑手党等。他们的主要关注点是财务活动。他们发现了一种新的方式来“管理不善”他人的财务资源（以及其他方面）。此外，从事外国间谍活动的人也利用我们增强的通信系统。他们\
  \ routinely（常规地）侵入政府、军事和商业计算机系统，窃取商业秘密、新设计、新公式等。甚至你个人电脑上的数据也不安全。如果你像当今许多人一样在家办公，同时在家电脑上处理个人财务，那么你的个人数据以及你所在公司的数据都可能面临风险，落入那些利用弱点和未受保护系统的恶意分子之手。我本可以继续说下去，但相信你已经明白我的意思。\n\
  \n为什么会发生这种情况？我们无法让这些通信系统完全安全。为什么不行？请思考一下。银行、家庭和企业自古以来就存在。尽管对银行、家庭、飞机和企业都采取了各种安全措施，但我们仍无法完全保障它们的安全。银行抢劫、飞机劫持以及企业和家庭的入侵仍时有发生。几乎物理世界的任何事物都不\
  \ truly（真正）安全。如果各类实体（政府、军队、恶意个人、NGO 等）想要关注或目标化某事物，只要他们有时间、耐心和足够的资源，就极有可能获得他们想要的结果。我们不应指望\
  \ cyberspace 会有所不同。正如在物理世界中，我们必须时刻保持警惕，防范对政府、军队、企业和家庭的攻击，在 cyberspace 中也必须如此。因为人们现在可以在不被肉眼看到的情况下，进入你的家、办公室，甚至安全的政府或军事基地。他们可以在你不知情的情况下篡改公式、设计、财务数据，或窃取文件副本。\n\
  \n随着新兴技术的兴起——如嵌入衣物和消费品中的设备、物联网（IoT）设备、增强车载电子、机器人、5G、以及人类增强（Transhumanism）——这些技术对网络取证调查产生了（且仍在产生）重大影响。\n\
  \n这也说明我们必须继续在物理安全领域保持原有的做法，但也意味着我们必须在网络安全领域持续增强防护。已研发出大量硬件和软件产品来保护数据通信系统，这些产品必须进一步提升。过去\
  \ 30 年出台的许多新法律为执法机构提供了更有力的手段，以打击网络犯罪。同时，还需要具备既有调查天赋又深谙 cyberspace 技术的人才，他们能够调查计算机网络安全事件，并了解\
  \ cyberspace 的真实运作方式。本书的宗旨正是提供一套系统的调查框架，并结合 cyberspace 的知识与可用的调查工具，帮助读者明确“谁、在哪里、什么、何时、为何以及如何”进行调查。\n\
  \n## 作者简介\n\n**Bruce Middleton**，CISSP, CEH, NSA IAM, 和 PMP，是德克萨斯州休斯顿大学（BSEET）的毕业生，并持有\
  \ DeVry University（Naperville, Illinois）的 MBA 学位。\n\n\n\n\nBruce 拥有超过 25 年的数据通信网络设计与安全领域经验。他职业生涯起步于美国陆军服役期间在国家安全局（NSA）工作。过去三十年里，他为情报界、国防部以及多个联邦政府机构参与了多个极具吸引力的项目，期间与波音（Boeing）、通用技术系统（United\
  \ Technologies）、BAE Systems、哈里斯（Harris）和通用动力（General Dynamics）等政府承包商合作。Bruce 也是国际空间站通信系统设计与安全的关键参与者，同时是弗吉尼亚州注册私家侦探。\n\
  \nBruce 是计算机犯罪的国际演讲者，曾在 *Security Management* 杂志上撰写大量文章，并是 FBI InfraGard 计划的成员。过去五年，他的最新项目是在全球领先的轨道交通公司\
  \ Alstom（Alstom.com）——一家总部位于法国巴黎的法国公司——任职，担任北美区域网络安全经理。\n\n## Chapter 1 The initial\
  \ contact\n\nDOI: [10.1201/9781003134817-1](https://doi.org/10.1201/9781003134817-1)\n\
  \n当你第一次被客户联系（无论是面对面、电话还是电子邮件），在投入新案件之前，必须先回答一些具体问题。这些问题的答案将帮助你在现场取证和访谈人员时更加做好准备。同时请记住，你可能参与的案件种类多种多样。下面是一个简短的案件类型清单：\n\
  \n*   网页篡改  \n*   恶意篡改医院患者数据库  \n*   恶意篡改工程设计数据库  \n*   谋杀  \n*   伪证  \n*   间谍/破坏\
  \  \n*   商业机密盗窃  \n*   盗取公司营销计划  \n*   将电脑网络用作跳板攻击其他网络  \n*   恶意修改电脑控制的建筑环境控制系统\
  \  \n*   盗取公司投标和提案信息  \n*   修改军用武器系统  \n*   卫星通信系统被劫持  \n\n由于案件类型多样，请仔细阅读下面列出的问题，挑选出与你当前情况相关的项，忽略不相关的。根据具体情境，考虑提问的顺序。即使客户不清楚某些问题的答案，这些问题也能启动你和客户的思考过程。你可以根据需要增添其他问题，但请保持讨论简短：目的是让你在到达客户现场取证时更有准备，而非在此时就拥有所有可能问题的答案。确保你使用的沟通渠道对客户和所收集信息是安全的，例如：是否应使用加密电子邮件？是否应使用安全终端设备（STE，取代\
  \ earlier STU III）或其他支持加密语音和数据通信（如 SCIP）的设备？\n\n*   是否已部署 IDS（入侵检测系统）和/或 IPS（入侵防御系统）？如果有，由哪家厂商提供？\
  \  \n*   谁首先发现了该事件？  \n*   攻击者是否仍在线上？  \n*   是否有可疑人物？  \n*   是否已制定安全策略和程序？  \n*\
  \   是否已与 ISP（互联网服务提供商）和 LEO（执法机构）有联系？  \n*   你认为此次入侵的原因是什么？  \n*   设备的使用年限有多长？ \
  \ \n*   能否通过安全渠道快速提供你的网络架构电子副本？  \n*   你的设施使用哪些操作系统？  \n*   磁盘使用的是 FAT、NTFS 还是其他格式？\
  \  \n*   你的设施采用的硬件平台是什么（Intel、Sparc、RISC 等）？  \n*   受影响系统是否配备光驱、软盘等设备？  \n*   这些系统是否受到分类，或你将前往的区域是否分类？分类级别为何？在哪里传真我的安全许可？\
  \  \n*   受影响系统的硬盘尺寸是多少？是否使用 SSD？  \n*   系统管理员在你到达时是否可用，以及是否有其他专家（平台层、操作系统层、关键应用层）可供协助？\
  \  \n*   受影响系统存储了什么信息？这些信息对贵公司业务是否至关重要？  \n*   当你到达现场时，网络基础设施专家（路由器、集线器、交换机、防火墙等）是否会提供支持？\
  \  \n*   你是否已让物理安全人员封锁受影响系统周边区域，防止未经授权进入？如未做，请立即执行。  \n*   犯罪现场是否禁止或限制使用移动电话、Pager\
  \ 等电子通信设备？  \n*   请准备过去 30 天的系统备份磁带副本供我查阅。  \n*   请整理出所有参与受影响系统的人员名单，以及该系统涉及的项目清单。\
  \  \n*   请检查系统日志，到达现场时请准备一份过去 24 小时内访问受影响系统的人员列表。  \n*   受影响系统是否配备 SCSI（小计算机系统接口）或并行端口（或两者皆有）或其他接口？\
  \  \n*   请勿触碰任何设备，勿关闭或断电任何系统。  \n*   请告诉我附近有哪些酒店可供住宿？  \n*   我的预计到达时间是下午 6 点，现场是否有食堂可以提供晚餐？\
  \  \n*   请勿向不必要知道此事的人透露此事件。\n\n### Chapter questions\n\n*   1\\. 列出五种不同的案件类型。  \n\
  *   2\\. 列出在你到达客户现场前应有答案的八个问题。  \n*   3\\. 提问顺序的先后是否重要？  \n*   4\\. 整理相关问题并获取答案的两大主要原因是什么？\n\
  \n## Chapter 2 Client site arrival\n\nDOI: [10.1201/9781003134817-2](https://doi.org/10.1201/9781003134817-2)\n\
  \n前往客户现场的途中（无论是坐车、火车还是飞机），请不要浪费时间。专注于复习客户在 Chapter 1 中提供的答案。如果你取得了网络拓扑图，请在旅途中审阅该图。与团队成员（如果你是团队的一员）讨论应对问题的不同思路，在到达客户现场时已明确你的攻击计划。如果你是团队的一员，请记住只有其中一人是负责人，团队中的每个人必须全力支持团队负责人在客户现场的决策。\n\
  \n在客户现场的第一步是进行预简报，这大约需要 15 分钟，期间你将与客户及其提供协助的相关人员进行沟通，提出补充性问题，认识到关键人员（如经理、系统管理员、使用过受影响系统的重要项目人员、安全部门人员等），并获取现场最新情况（在此期间可能发生了新的变化）。此环节时间不宜过长，应快速进入取证流程。\n\
  \n\n\n\n-   1. 你在前往客户现场的途中应该在做什么？\n\n-   2. 如果你是团队的一员，请记住，只有`\\_\\_\\_\\_\\_\\_`人负责。团队上的每个人都必须完全支持`\\\
  _\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_`在客户现场。\n\n-   3. 你到达客户现场后，第一件事应该做什么？\n\
  \n-   4. 在预简报时，你应该提出的三个问题是什么？\n\n## Chapter 3 Evidence collection procedures\n\n\
  DOI: [10.1201/9781003134817-3](https://doi.org/10.1201/9781003134817-3)\n\nChapter\
  \ 3 讨论了证据收集工具，并涵盖了收集证据的程序，以确保证据在法庭上通常具有可采性。请记住，在阅读本章时，总会有新的工具和技术出现。同时，请记住，你所在国家认为的当前技术可能在其他欠发达或经济困难的国家不可用，因此你可能会被迫使用比你习惯的硬件和软件工具更不先进的设备。关键是要理解所涉及的概念，不要把自己和职业生涯局限于仅仅使用最新和最强大的工具集和计算机系统。你需要能够适应手头的一切，并充分利用它。下面的问题答案展示了程序的关键细节：\n\
  \n*   什么是 Locard’s Exchange Principle（洛卡德交换原则）？\n\n    任何进入犯罪现场的人或事物都会带走现场的某些东西，同时离开时也会留下一些属于自己的痕迹。\n\
  \n*   你应该去哪个网站阅读在法庭上被接受的计算机搜查和扣押指南？\n\n    [`www.justice.gov/sites/default/files/criminal-cips/legacy/2015/01/14/ssmanual2009.pdf`](https://www.justice.gov)\
  \ （阅读此信息并仔细阅读——了解美国宪法第四修正案。）\n\n*   联邦调查局（FBI）使用的六种调查技术，按顺序如下：\n\n    1.  检查记录、日志和文档。\n\
  \n    2.  访谈人员。\n\n```if (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\n\n\
  3. 进行监视。\n\n4. 准备搜查令。\n\n5. 如有必要，搜查嫌疑人的场所。\n\n6. 如有必要，没收证据。\n\n* 你与系统专家和网络基础设施专家在现场。你的第一步应该是什么？\n\
  \n    1.  a. 如允许，拍摄现场。这包括整体区域、计算机显示器、区域内设备的电子仪器信息（如手机、发送机等），以及布线连接（包括地板下的布线，如果地板是升起的）。\n\
  \n    2.  b. 如有必要，绘制草图。\n\n    3.  c. 如果存在活动的调制解调器连接（指示正在进行通信的闪烁灯），迅速拔掉它，并通过 rs-232\
  \ 连接向你的笔记本电脑获取内部调制解调器信息。调制解调器在这里正常吗？如果是，它此时正常运行吗？\n\n    4.  d. 移开天花板瓷砖并查看周围。\n\n\
  * 一个计算机犯罪调查员通常会按什么顺序执行这六个步骤？\n\n    1.  a. 如果攻击者仍在线上，启动追踪。追踪（也称为追踪回溯）是使用专用软件工具尝试获取攻击者（或攻击者）的地理位置的尝试。\n\
  \n    2.  b. 收集证据并维护链条管理（假设它将进入法庭）\n\n    3.  c. 采访目击者。\n\n    4.  d. 安装窃听器（如果未安装\
