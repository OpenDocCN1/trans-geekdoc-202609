  \ 屏幕。\n\n![Figure 7.10 Updated EMW screen.](img/fig7.10.jpg)\n\n*Figure 7.10* Updated\
  \ EMW screen.\n\n在 Figure 7.10 中，右键单击`PST & JC Files`条目，然后左键单击菜单上的`Standard Partition\
  \ Traverse`。点击文件夹可查看其中包含的文件。要保存当前`ILook`状态，右键单击`PST & JC Files`旁边的黄色图标，然后左键单击`Save\
  \ Mapping Data`。如果稍后退出`ILook`并希望恢复已保存的文件映射，右键单击黄色图标，然后左键单击`Load Mapping Data`。这将恢复您的会话。\n\
  \n现在，我们来执行文件映射后的文本搜索。点击您想要搜索的设备、分区、文件夹或文件，然后在 EMW 顶部的主菜单栏上点击`Search (F5)`，这将打开数据搜索窗口（`Figure\
  \ 7.11`）。\n\n![Figure 7.11 Data search window.](img/fig7.11.jpg)\n\n*Figure 7.11*\
  \ Data search window.\n\n请注意，`ILook`有三种搜索类型：标准、批量和索引。让我们快速浏览每一种。\n\n标准搜索引擎（SSE）允许您通过选择任意数据组来搜索案例数据。（参见`Figure\
  \ 7.11`中的数据组。）这是一种通过数据组中每个字节的原始文本搜索。由于这是一种彻底的技术，因此在大量数据中搜索可能需要相当长的时间。当您只想尝试三到四个搜索词来查看是否有命中时，SSE\
  \ 通常被使用。\n\n批量搜索引擎（BSE）允许您同时搜索最多 500 个 ASCII 关键词。这意味着 500 个关键词的搜索时间大约与 SSE 搜索一个词的时间相同。BSE\
  \ 也可以配置为同时搜索这 500 个 ASCII 关键词及其 Unicode 等价项。这是一种通过数据组中每个字节的原始文本搜索。由于这是一种彻底的技术，因此在大量数据中搜索可能需要相当长的时间。BSE\
  \ 的结果可以以多种格式显示。\n\n索引搜索引擎（ISE）使您能够以更高的速率搜索大量数据。首先，您需要构建索引数据库。一旦数据库构建完成，您就可以对数据库进行搜索，而不是像\
  \ BSE 和 SSE 那样对原始文本进行搜索。使用 ISE 的最佳情况是当您计划在一段时间内运行大量不同的文本搜索时。\n\n由于我们已经开发了关键词搜索列表（`KeywordsBAEl.txt`），让我们再次使用它并利用\
  \ BSE。首先，按照`Figure 7.12`所示设置数据搜索窗口。\n\n![Figure 7.12 Starting a bulk search.](img/fig7.12.jpg)\n\
