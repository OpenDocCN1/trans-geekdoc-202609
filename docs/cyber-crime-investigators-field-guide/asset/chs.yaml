  \n*   **Q:** 在启动带有磁盘的计算机时，应该检查哪个关键项？\n\n*   **A:** 检查 CMOS 设置，确保磁盘先启动。如果从硬盘启动，会损坏或丢失证据。是的，世界上仍有部分地区仍在使用磁盘，因此我在本书的新版本中保留了这些项目。\n\
  \n*   **Q:** 在你坐在受害者机器旁的第一个人应该是谁？\n\n*   **A:** 该系统的系统管理员，且该管理员是该系统类型的专家。\n\n* \
