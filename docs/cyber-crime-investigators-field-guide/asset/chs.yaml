  \ Let's extract it.\n\n\n\n\n## ElectrologIXS\n\nElectrologIXS 可以通过笔记本电脑和移动设备（使用\
  \ Web GUI 界面）进行连接。ElectrologIXS 还可以配置用于处理交叉控制。\n\n## Positive Train Control (PTC)\n\
  \n一种保护层，在一名列车工程师因分心发短信而未注意并导致严重列车事故后，该层被立法要求。\n\n- 强制红灯停止。\n- 可以是无线、有线或组合方式；铁路公司如\
  \ CSX 和 BNSF（两家前沿科技公司）通过光纤将其连接至路边设备，用于此类及其他用途。\n- 无线通信通常涉及 HMAC 认证和 OTA 加密。\n- 当\
  \ PTC 刚开始时，手机被放置在路边设备内用于无线通信，但如今使用以太网；你可以通过以太网电缆（密码保护，以及其他安全相关项目）将笔记本电脑连接到路边设备。\n\
  - 以太网用于连接 ElectroBlox 与 PTC 处理器。\n\n## Ultra-Cab II\n\n- 一个车载系统（车载意味着它安装在列车本身上）\n\
  - 强制限速并防止碰撞\n- 自动列车保护（ATP）– 自动列车控制（ATC）的子集\n- 强制限速\n  - 向列车操作员发出警告，若操作员不作任何反应，则在必要时自动停止列车\n\
  - 有助于防止列车碰撞和脱轨\n\n## ITCS\n\n- 一个车载系统（车载意味着它安装在列车本身上）\n- 必要时会停止列车\n- 速度强制\n- 使用路边设备\n\
  - 防止列车碰撞和脱轨\n- 使用 GPS 技术并利用基站\n- 网络中有一个 ITCS 服务器\n\n## RailEdge（用于铁路交通管理的软件包……类似于空中交通管制）\n\
  \n- 用于在铁路控制中心内部\n- 无安全关键项目\n- 在 Windows 和 Linux 上运行\n- 功能根据客户需求开启或关闭\n- 跟踪列车行进路线，并为货运和客运列车优先选择路线\n\
  - 中央数据位置 – 决策依据\n- 数据实时从路边设备等来源接收\n\n- 2 个产品\n  - TC/SCADA（TC = Train Control）\n\
  \    - ICONIS\n  - PACIS（类似于 ISM）\n    - 下一列车到达指示灯\n    - 公共广播\n- 实时乘客信息\n- 通过以太网或串行（Genesys\
  \ 协议允许通过串行实现以太网。Genesys 是开放协议。）\n- RailEdge 可与 ElectrologIXS 盒子对接，并要求其以多种方式移动轨道。如果请求被认为不安全，则路边设备会回复“否”。路边设备可通过\
  \ Edge Message Protocol（EMP）相互通信。关键通信协议包括 RP2000，这是一种专有的串行/以太网协议。关键通信和非关键通信在铁路网络中共存。对于关键通信（True\
  \ 为电压大于 8 伏，False 为电压小于 3 伏），用于安全和安保，意味着两个分支必须看到完全相同的通信内容；若不一致，则给定的命令不会执行。注意 RP2009\
  \ 是 HMAC 包装协议。铁路网络中还使用其他协议，如 ATCS（旧但仍在使用的开放协议）、ARES、FSFB2、ERTMS（欧洲）、MODBUS（用于非关键数据及回传至主办公室的数据等）。\n\
  \n## Switch machines\n\n- Hydra – 非关键应用\n- CTS2 – 关键应用\n- 消除延误\n- 使拥堵减少\n- 作为流产品销售\n\
  - 可与 RailEdge 和其他软件产品对接（只需协议一致）\n- 提高机车段效率\n\n## Wireless crossing\n\n- 通过无线通信进行信号控制的铁路交叉口\n\
  \n## 英国主要铁路系统\n\n- Network Rail\n- London Underground\n- Crossrail（位于伦敦）\n\n沙特阿拉伯利雅得拥有全球最大的地铁（公共交通系统\
  \ – [`riyadhmetro.sa/en/`](http://riyadhmetro.sa/en/))。该项目耗资 230 亿美元，为期五年，包含六条铁路线。它是无人驾驶的，并采用最新的\
  \ CBTC 技术。利雅得地铁项目由六条主线组成，总长度约 176 公里（约 110 英里），设有 85 个站点。利雅得地铁网络覆盖大多数人口密集区域、政府设施、教育和商业机构。采用\
  \ Urbanlis 信号系统并结合 HESOP 制动能回收系统使用。同时还使用自动化轨道铺设系统 Appitrack。\n\n热插拔板受恐怖分子和其他恶意行为者青睐。只需恶意行为者行贿获取代码更改，将路边设备关闭\
  \ 30 秒，然后插入另一块包含相同电子元件（并额外功能）的板子，即可实施恶意操作。这当然是不好的消息。请注意，路边设备的通信可用于停用正在运行的列车，而路边设备与正在运行的列车唯一的通信方式是通过\
  \ ITCS 或 PTC、220 Hz 无线电、SatCom 或蜂窝基站。许多路边设备内置调制解调器（调制速度在 300 Baud 至 19.2 Baud 之间）。恶意行为者还喜欢所谓的“Dark\
  \ Territory”（DT）。DT 是列车行驶期间通信基本中断的区域。在此期间，恶意行为者可能在物理或电子层面对列车进行恶意操作，直到为时已晚才被发现（例如在化学车厢上安装爆炸装置并运往人口密集区）。\n\
  \n嵌入式系统用于自动化列车（通常使用 ARM/ColdFire 处理器）。测试铁路产品安全性的一种工具是 Wurldtech（被 GE 收购）的 Achilles（[`nohau.eu/products/achilles-test-platform/`](https://nohau.eu)）。在铁路产品测试中，通常使用\
  \ National Instruments 的 Lab View（[`www.ni.com/getting-started/labview-basics/`](https://www.ni.com)）。铁路信号的模拟信号频率约为\
  \ 100 Hz，因为高频信号传播距离有限。\n\n我认为真正的网络安全问题是，很多时候即使能达到 80% 的准确率，也无法确定具体是谁执行了恶意行为。我们需要能够快速、轻松地确定具体是谁实施了该恶意动作。能够在全球范围内实现这一点，并结合\
  \ globally agreed cyber laws 进行补偿，将显著降低网络攻击，因为实施者将不再匿名。\n\nCENELEC（[`www.cenelec.eu/`](https://www.cenelec.eu)）是铁路行业的欧洲标准组织。\n\
  \n铁路行业遵循美国公共交通协会（APTA；[`www.apta.com/`](https://www.apta.com)）的标准/指南。与网络取证相关的 APTA\
