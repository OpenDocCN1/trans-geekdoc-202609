  \n    *   只需尝试这些以及其他 Google Dorks，以便熟悉它们\n\n通过 pi-hole（[`pi-hole.net/`](https://pi-hole.net)）可以消除不想要的广告干扰工作。pi-hole\
  \ 本质上是网络范围的广告阻断器。与其在每个设备/浏览器上安装广告拦截插件不同，你可以在网络上仅安装一次 pi-hole，随后它会自动保护所有浏览器/设备。pi-hole\
  \ 相当于在网络内部充当私有 DNS 服务器。它会拦截所有针对已知广告服务器域名的查询并阻止其加载，从而阻止广告下载。\n\n如果想了解搜索引擎对你的了解情况并将其删除，可以尝试\
  \ [`onerep.com/`](https://onerep.com)。他们似乎已经建立了成功的方法来处理此类问题。不过，防止他人收集关于你的信息的最佳方式是遵循军事和情报社区教导的做法——制造并散布关于自己的错误信息，这样不明真相的人就很难判断哪些是事实、哪些是虚构。全球许多情报机构的成员已经根据所学指导，进行了二十多年的此类操作。现在你需要么彻底消除，要么显著减少你的数字足迹。所谓数字足迹，就像汽车尾气一样，是你在使用互联网时留下的数据/数字残留。FBI\
  \ 已发布名为 “Digital Exhaust Opt Out Guide” 的文档，供你阅读并遵循。\n\n沿着同样的思路，不要认为 1985 年之前（甚至更久）的记录是准确的，尤其是军事和政府记录。1974\
  \ 年，军事及情报机构普遍使用 “burn bags”（烧毁袋）来处理机密信息。这些烧毁袋放置在负责机密信息的每位人员的书桌上，定时的卡车会收集这些袋子并将其带到地下室的烤炉中，用火焰永久性地销毁机密信息。1974\
  \ 年同时也是一个转型时期，纸质信息开始向计算机转移。当时不存在扫描仪，所有信息必须逐个文档手动输入电脑。当初并未意识到电子化信息的重要性。随着时间推移，越来越多的文档被输入电脑，由政府/军事当局设定的进度计划推动。这些计划越来越难以达成，且负责数千文档录入的工作人员日益感到无聊。上级和高级军官对这类录入工作毫无兴趣，也不认为它重要。录入任务通常分配给低级别人员，但有人发现这可以成为赚钱的途径。起初是以香烟作为报酬，随后报酬逐步升级为金钱。士兵们会找到进行录入的同事，要求他们更改入伍日期、服役期、战功徽章、战场晋升（导致晋升）以及其他众多记录。总之，一些在越南战争期间服役的军人因获得微不足道的小\
  \ favor，而接受了被一些人认为无意义的记录更改。虽然我没有个人了解其他案例，但这很可能在全球范围内同期同时发生在军政府和商业领域。人性如此。\n\n正则表达式是另一种数据提取的途径。此类操作可以使用\
