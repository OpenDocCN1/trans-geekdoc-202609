  \ 6.39* Highlighted information in case file.\n\n-   您可以看到我们获得了一些将需要交给执法机构的有趣信息。这些信息片段是`Analyst`在搜索磁盘空闲空间、交换空间和硬盘其他隐藏区域时可能发现的典型内容。我也看到过数小时、数天、数周甚至数月的对话，这些对话发生在系统被黑客入侵或被用于某种犯罪或恐怖活动的方式时。还需注意，您的关键词搜索也会生成大量垃圾数据（噪声）。这指的是因您使用的关键词或短语而出现但与当前案件无关的信息。\n\
  \n-   现在让我们转向执法界另一个重要的取证工具：`Ilook Investigator`。\n\n## 章节问题\n\n*   1\\. `EnCase\
  \ Forensic Edition`支持哪些平台和文件系统？\n\n*   2\\. `EnScript`的作用是什么？\n\n*   3\\. 可以为特殊调查需求和自动化任务创建自定义脚本吗？\n\
  \n*   4\\. `EnCase`是否已通过 NIST 验证？\n\n\n\n\n让我们来看看 `ILook`，这是一个用于分析计算机硬盘驱动器图像的法医工具。您看到的屏幕将取决于所使用的工具版本。我们不会像在前几章中使用\
  \ `EnCase` 和 `AccessData` 对 Patty 的谋杀案进行分析，而是将提供该法医工具的概述以及在调查涉及电子邮件、特别是 Microsoft\
  \ Exchange.pst 文件的调查过程中使用该工具的操作流程。该软件最初由 `Elliot Spencer` 开发，并免费向全球执法机构提供。`IRS`（内部税务局）通过其电子犯罪计划提供该软件。`ILook`\
  \ 利用 `Hashkeeper Database`，该数据库由司法部国家毒品情报中心维护。`NIST NSRL` 的某些哈希表也已包含其中。\n\n`ILook`\
  \ 用于检查任何法医成像系统生成的直扇区转储（也称为位流备份、位拷贝、位图）的数据。许多执法和商业成像工具都以此格式生成镜像。`ILook` 还支持对 `Safeback`\
  \ 图像文件、`EnCase` 图像文件、ISO（国际标准化组织）和 `CIF` CD 镜像、VMWare 虚拟磁盘，以及当然的 `ILook` 图像文件的检查。Table\
  \ 7.1 列出了 `ILook` 支持的文件系统。\n\n*Table 7.1* `ILook` 支持的文件系统。\n\n|   |\n\n| --- |\n\
