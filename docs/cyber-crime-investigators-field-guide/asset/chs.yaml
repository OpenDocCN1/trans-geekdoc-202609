  \n IIS 4.0 remote buffer overflow\n\n基于以上信息，我迅速访问各搜索引擎和网络安全站点，寻找具有上述特征的漏洞利用。访问的站点包括：\n\
  \n* yahoo.com\n\n* dogpile.com\n\n* 通过 deja.com 的 Usenet\n\n* eEye.com\n\n* hackernews.com\n\
  \n* rootshell.com\n\n* attrition.org\n\n* antionline.com\n\n在 rootshell.com 上，我找到了与本案例直接相关的以下信息：\n\
  \n* eEye Digital Security，一家 eCompany LLC 子公司，专注于网络安全和定制网络软件开发，近期公布了当今互联网上最易受利用的安全漏洞之一。该漏洞存在于\
  \ Microsoft Internet Information Server（IIS）的最新版本，而 IIS 是互联网上最常用的 Windows NT Web\
  \ 服务器。\n\n* 该漏洞允许任何运行最新版本 IIS 的 Web 服务器上的攻击者远程执行任意代码，从而获得系统级访问权限，进而读取服务器上所有数据。利用该漏洞的缓冲区溢出漏洞，攻击者可远程运行代码。\n\
  \n* eEye Digital Security 在测试 Retina™ 网络安全扫描器时发现了此漏洞。Retina 是一个网络安全审计与报告工具，目前处于\
  \ beta 阶段。其特性之一利用人工智能引擎，设计为像黑客一样思考，收集目标网络或 Web 服务器的数据并进行信息挖掘。收集到的数据随后用于网络审计，发现潜在的安全弱点。\n\
  \n* eEye Digital Security 已向 Microsoft 通报此安全漏洞，并与 Microsoft 安全团队合作提供修复方案。eEye 提供了针对\
  \ Web 服务器的即时修补程序以及完整的远程利用说明，详细内容可在 eEye 官网（[www.eEye.com](http://www.eeye.com)）于\
  \ Microsoft 发布正式补丁后查阅。\n\n受影响系统：\n\n* Internet Information Server 4.0（IIS4）\n\n\
  * Microsoft Windows NT 4.0 SP3 Option Pack 4\n\n* Microsoft Windows NT 4.0 SP4 Option\
  \ Pack 4\n\n* Microsoft Windows NT 4.0 SP5 Option Pack 4\n\n### 事后影响\n\n几乎 90% 的\
  \ Windows NT Web 服务器受此漏洞影响。即使服务器位于受保护的保险箱房间，后面装有 Cisco PIX，也能被利用此漏洞入侵。这提醒所有软件供应商，必须对自身产品进行常见安全漏洞的测试。应要求软件供应商提供更严格的安全保障。\n\
  \n### 供应商状态\n\n我们于 1999 年 6 月 8 日联系了 Microsoft。eEye Digital Security 提供了复现漏洞所需的全部信息以及修复方法。Microsoft\
  \ 安全团队确认了漏洞的真实性，并正在发布补丁。\n\n### 目标\n\n假设我们针对某个随机的财富 500 强公司进行攻击。任选其名。我们假设该公司拥有“先进”的安全防护，已在\
  \ Cisco PIX 后面加固，并部署了最佳的入侵检测软件。服务器仅允许端口 80 的入站连接。\n\n### 让我们跳舞\n\n我们编写的漏洞利用会导致远程机器缓冲区溢出，并从我们的\
