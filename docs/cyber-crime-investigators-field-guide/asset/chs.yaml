  \ 潜在的互联网交易与色情相关  \n\n使用 NTA 的基本图形界面（GUI）方法：\n\n nta <enter>\n\n使用方向键选中四项之一后按 <enter>：\n\
  \n1.  查找互联网浏览痕迹。  \n2.  查找电子邮件活动痕迹。  \n3.  查找图形和文件下载。  \n4.  导出全部互联网痕迹。  \n\n选择要分析的文件（必须与\
  \ NTA 位于同一目录）。\n\n*   回答 Y（Yes）以创建 .dbf 文件。  \n*   开始处理。  \n*   当 .dbf 文件生成完成后，使用\
