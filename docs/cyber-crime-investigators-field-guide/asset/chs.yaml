  \n关于选择用于 OSINT 的网页浏览器，我推荐使用 TOR、Brave 或 Firefox。我也建议在案件推进过程中使用不同的浏览器，这有助于防止他人窥探你的活动，即使你是一名正在办案的特工。另一个良好习惯是不断清除浏览历史、Cookie\
  \ 等。请注意，首先要查看的内容是 robots.txt 文件。同时，尽量在十个或更多不同的搜索引擎上进行搜索，因为国内网站通常提供更贴近案件的信息。例如，如果你在查找法国人的信息，可以\
  \ VPN 连接巴黎，然后在 Google、MetaGer.org 以及其他搜索引擎上从该地点进行搜索，这将提高生产力和结果的效率。如果你更喜欢替代 Google\
  \ Maps 的地图方案，可以尝试 OpenStreetMap.org、WikiMapia.org，甚至 Bing.com 和 Yahoo.com（请注意这些平台可能有其他平台没有的功能，多多尝试）。你可以尝试将自己\
  \ VPN 到特定位置，然后打开默认地图（如 WikiMapia），观察该位置的默认地图。当然，你也可以使用俄罗斯搜索引擎（对人类非常友好）Yandex.ru。如果使用\
  \ Yandex.ru，我建议先 VPN 连接到某个欧洲国家，然后再从那里使用该搜索引擎。\n\n其他值得关注的网站包括：\n\n*   WhatsMyName.app\n\
