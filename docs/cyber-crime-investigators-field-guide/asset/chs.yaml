  \n## Chapter 11 Case study\n\nDOI: [10.1201/9781003134817-11](https://doi.org/10.1201/9781003134817-11)\n\
  \nA historical case that I am familiar with will now be presented. As I mentioned\
  \ earlier in the book but this bears repeating, keep in mind as you read through\
  \ this chapter that there will always come new tools and technologies. Also keep\
  \ in mind that technology you consider current in your particular country could\
  \ be unavailable in other less-developed or economically challenged countries, and\
  \ as such you may be forced to work with hardware and software tools less advanced\
  \ than what you are used to. The important thing is that you understand the concepts\
  \ involved and don’t tie yourself and your career to only the latest and greatest\
  \ toolsets and computer systems available. Be able to adjust to whatever is at hand\
  \ for you to make use of. This case study will assist you with this and will also\
  \ give you an even better sense of how to use procedures and tools discussed in\
  \ previous chapters. The names, places, and some information have been altered to\
  \ protect prior clients. Any names that are similar to those of current corporations\
  \ or government agencies are coincidental. The persons in the case are:\n\n| Bill\
  \ Miter || Senior network security analyst |\n\n| --- | --- |\n| Bob Jacobs || Chief\
  \ executive officer (CEO) of Nortelem, Inc., Boston, Massachusetts |\n\n| James\
  \ Roberts || Router administrator(Who left and Steve Wier took his place) |\n\n\
  | Joe Freid || Cable technician |\n\n| Lucy Miles || Manager, system administrators\
  \ |\n\n| Ron Yougald || System administrator of hacked node |\n\n| Ross Pierce ||\
  \ Manager, physical security personnel |\n\n| Sam Miller || Member, physical security\
  \ |\n\n| Steve Wier || Router administrator |\n\n| Terry Reiner || Manager, firewall\
  \ and switch engineers/technicians |\n\nThe case began as so many others do – with\
  \ a call from a potential client who has obtained my name and contact information\
  \ from a previous, satisfied client. The first words I heard over the telephone\
  \ from Bob Jacobs, CEO of Nortelem, Inc., were,\n\n> 我们的网站在过去一周内至少被攻击了两次。第一次发生时，我的系统管理员\
  \ Ron Yougald 以为已经处理完毕——但实际上这次问题又再次出现。这对我们的声誉造成了损害。客户和公众会听说这件事，认为我们连自己的系统都无法妥善管理，更别提处理客户的问题了。\n\
  \n他本想继续说，但我打断了他，告诉 Bob 他需要冷静下来，不要在不安全的电话线上讨论敏感的公司事务。任何人都可能在偷听。随后我要求 Bob 提供他的电子邮件地址，并通过\
  \ AT&T 的 Secret Agent 产品发送加密邮件。Bob 能够在收到邮件后使用我们电话中商定的解密密码进行解密。邮件内容是我公司的标准合同。Bob\
  \ 需要审阅、签署并传真回我提供的传真号码。他在与法律部门花费了数小时审阅合同后，签署并传真了合同。在此期间，我验证了 Bob Jacobs 和 Nortelem\
  \ 确实是他所说的那样。现在我可以行动了——我立刻预订了飞往波士顿的机票，也就是 Nortelem, Inc. 的所在地。\n\n我在此说明，我的偏好是客户在接洽前已是我的网络取证服务的订阅客户。合同已签署，程序和密码已约定，公司按月、季度或年费（视客户情况而定）获得随时响应的服务。此外，我们已建立安全的通信渠道和相应的操作流程。在\
  \ Nortelem 的案例中，这些都没有建立，因此最初的通信并不安全，且在签署合同上耗时。\n\n### 旅行安全\n\n我还想强调个人安全的重要性。你计划协助的客户可能是交通、公用事业或金融等属于多个国家关键基础设施的组织，也可能是恐怖组织或有组织犯罪集团所发起的恶意事件。请不要轻视——在当今世界必须对此取\
  \ seriously。回想一下过去几年你读过的各种新闻报道。与其认为“这只会影响我和我处理的机器”，不如保持警惕，活着才是正道。我曾在 12 个国家为军队、情报机构、国防承包商和普通企业工作了\
  \ 50 年，多次受益于所接受的安全培训——这让我保全了性命。因此，我在这里将一些在旅行往返客户现场时可以采用的关键措施分享给你。你可能无法全部做到，但请尽可能多地尝试。\n\
  \n1.  时刻保持警觉。除非你有特殊原因必须盯着手机，否则在外出时尽量不要沉浸于手机中，并尽快放下手机，保持对周围环境的警觉。时刻留意周围发生的事，不要陷入一种错误的安逸心态。恶劣事件每天都会发生在人身上，别让自己成为统计数据，仅仅因为缺乏对周围情况的警觉。保持警惕，时刻如此。\n\
  \n\n\n2. 如果你要前往一个对你来说语言和文化都陌生，但街上大多数人都使用的国家，请学习一些可以在紧急情况下使用的简短关键短语，并在你停留的国家期间根据需要扩展你的词汇量。在我职业生涯的某个阶段，我曾在埃及工作了超过一年，在那里我每周上三次阿拉伯语课程。这种学习方式非常有益，别让自己在另一个国家工作时浪费时间在毫无意义的夜间活动上……要学习。你等到后来才会知道，因为某些偶然的闲暇学习而带来的全新冒险机会。\n\
  \n3. 别认为像达 elta、联合航空这类标准航空公司旅行是美洲（加拿大、美国、墨西哥、中美洲、南美洲）以及欧洲等地区唯一的出行方式。例如，你可能不知道，美国遍布许多私人跑道，公民在自家住宅或附近的农场等地维护这些跑道，这些人拥有自己的私人飞机就坐在那里。为了保持旅行的隐私性，利用这些设施——我已经有\
  \ 50 年的经验（是的，我在这行业已经很久了）。建立关系，即便你没有建立关系，许多这些人都乐意收取费用为你提供交通……所以直接去找他们，看看是否愿意走这条路。\n\
  \n4. 可能的话，不要使用电子钥匙（key fob）来遥控打开车门、后备箱或远程启动汽车。不要随身携带（将其放在无线电波无法穿透的安全盒中），而是使用普通钥匙。如果你随身携带电子钥匙，你既有被劫持的风险，车和你也可能被劫持。记住，一个钥匙\
  \ fob 可能打开多辆车，甚至在同一停车场……这取决于具体情况。\n\n5. 你可能会觉得下面这些项目带有负面联想，但请明白，在过去 50 年里我见过（以及更多）这些情况，所以你必须遵循童子军口号“准备好”（Be\
  \ Prepared），提前假设下面所有情况都会发生，不要找借口做不到这件事：\n\n    1. a. 你 somehow 失去了手机、笔记本电脑和钱包/手包的访问权限。请牢记至少（最好是\
  \ 3–10）一个可以用来救 yourself 和你的工作的电话号码，无论是朋友、同事、雇主、客户等。这个号码能帮助你摆脱当前的困境。\n\n    2. b.\
  \ 如果你使用像 Dropbox 这样的云存储，请务必强烈加密你存储的内容。拥有多个账户也是加分项，因为任何一个账户可能因各种原因失效。\n\n    3. c.\
  \ 你依赖 GPS（手机、车载、笔记本电脑或其他设备）来导航，但它出现故障。确保在出发前记住至少一条从 X 到 Y 的路线（X 和 Y 是关键地点）。如果你记忆力好，可以记住更多路线。你当然可以在钱包或手包里随身携带一张小地图，但要假设这些物品会丢失，因此请提前规划。\n\
  \n    4. d. 也许你在一个不想留下指纹的地点。如果是这样，要么戴手套，要么用像硅溶胶溶液之类的液体洗手，以防止手指上的油脂留下指纹。\n\n    5.\
  \ e. 也许你在做某项工作，希望尽量减少他人辨认你的可能性。现在许多摄像头遍布各地，隐私保护确实困难，但你可以显著提升隐私保护。戴帽子和墨镜，保持头部倾斜，使摄像软件更难通过算法识别你。同时要注意，你也可以通过手部顶部来被识别，而不只是指纹。现代摄像头甚至可以利用手指背面的纹路进行识别，如果相机能看到你手的另一侧（即指纹），同样可以辨认你。一个办法是戴手套；如果不方便，可以在手指或手上涂抹一种防止摄像头识别的液体。市面上有多种产品，普通人可以尝试“假装手上有中毒蔓越莓（或其他）”，然后用\
  \ calamine lotion（金缕梅洗剂）涂抹手指，既防止瘙痒，也让人不愿触碰。你是否有纹身或其他显著的皮肤异常，能够识别你？如果有，尽量覆盖或去除（皮肤科医生有各种光疗可以去除纹身……不要让对纹身的自豪感阻碍你覆盖或消除它）。其他项目包括眼睛，你可以使用改变眼色的隐形眼镜，同时阻止各种电子设备直接读取你的眼睛。动用想象力，查阅专注于“普通人防护装备”的网站。我还建议佩戴专门的旅行衣物，以防止扒窃者，例如查看：\
  \ \n\n        1. i. [`www.clothingarts.com/`](https://www.clothingarts.com)\n\n\
  \    6. f. 在你踏上旅程之前，如果有时间，最好在白板上逐步规划好每一步。前期的规划在你继续前进的道路上能起到巨大的作用。\n\n    7. g. 参加自卫课程，保持良好的身体状态。你不需要黑带，只需掌握几个稳健的攻防动作，并每天练习养成习惯。\n\
  \n    8. h. 如果你在外国工作，建议在当地开设银行账户并建立关系。同时，设立不同城市的邮政信箱用于邮件收发，这些在将来可能会非常有用。\n\n   \
  \ 9. i. 我不想再展开太多，因为这本身就可以写一本关于旅行安全的书，但我最后提到一项内容。也许有人想从你身后偷袭并勒死你。你觉得……这太疯狂了！谁也不想对自己做这种事！其他人也曾这么认为，而且现在已经不在人世。再次，花很少的一笔钱，你可以购买一款贴合皮肤、佩戴在颈部的舒适颈圈。有了它，从后方（或战斗中）袭击你的人将无法勒死你，颈部打击也会失效。网上有售这些以及其他隐蔽的攻防用品，它们看似普通却可能\
  \ salva 你的生命。做好准备！\n\n6. 在联邦、州和地方层面建立与执法机构的友好关系。这类关系在各种情况下都能发挥巨大作用，并在你需要时提供即时帮助——否则你可能得不到任何帮助，或被视为低优先级。因此，参加活动，与他们共进早餐、午餐或晚餐等，让关键供应商（最好是高层或管理层）认识你。\n\
  \n7. 学习摩斯密码。摩斯密码？！为什么？虽然它在当今现代化的世界中看起来格格不入，但全球仍有大量场合在使用。例如：\n\n\n\n\n1. a. 你被劫持，并且有一段视频正在拍摄你或你所在的小组。也许你需要让执法部门（或其他人）知道你的位置，以便他们能够前来救援。你只需用睁开和闭上眼睛的方式发送摩斯密码信息，仅仅说明你的位置。这可能就是救命稻草。\n\
  \n2. b. 你被关在一间没有窗户、只有门和墙壁的房间里，独自被囚禁。你认为隔壁的房间里可能有其他遇到困境的人。你轻轻敲墙壁以摩斯密码进行沟通。他们可能知道也可能不知道摩斯密码，但至少你可以尝试。\n\
  \n3. c. 你坐在咖啡馆（无论是外面还是里面），等待同事，而且出于某种原因，你们俩都不想让其他人知道你们认识彼此。如果你们俩都懂摩斯密码，就可以通过眼睛进行交流，但当然，你们只想进行极短的对话，否则别人可能会注意到。\n\
  \n**Wireshark and Python**\n\n在与客户的对话中，我们得知一个好消息……客户全天候（24 × 7 × 365）运行 Wireshark\
  \ 并保留 30 天的备份。这真是个好消息。在我们继续冒险之前，让我们花点时间了解 Wireshark 是什么以及它在我们的调查中能帮助我们做什么。这次讨论关于\
  \ Wireshark 将很简短，因为如果你想进一步学习，整本关于这方面的书都有。我们还将探讨如何使用像 Python 这样的编程工具（这里使用 PyShark）来增强我们与\
  \ Wireshark 的工作。\n\n在开始之前，请前往以下网址下载 Wireshark 和 Python：\n\n*   [`www.wireshark.org`](https://www.wireshark.org)\n\
  \n*   [`www.python.org/downloads`](https://www.python.org)\n\n下载适合你所使用的操作系统的文件。在我的情况下，我正在下载\
  \ Windows 的 Python 3.9.2 和 64 位 Windows 的 Wireshark 3.4.3。我们将使用 PyShark 来修改 Wireshark\
  \ 捕获和过滤数据包的方式。Wireshark 可以为我们完成以下操作：\n\n*   它允许我们查看网络上使用的协议。\n\n*   它捕获实时数据包。\n\n\
  *   它查看数据包内的详细协议信息。\n\n*   它根据各种标准过滤数据包。\n\n*   它检查安全问题。\n\n*   它观察什么时候发生、从哪里发生、如何发生。\n\
  \n下面是 Wireshark GUI 的外观：\n\n![](img/inline11.1.jpg)\n\n由于上面的截图中的文字较小，我们来逐段拆解，从上往下。\n\
  \n*   首先，我们看到文件名 **MostOfTheDay.pcapng**。\n\n*   接着，我们看到可以选择的各种菜单项。\n\n*   在数据包收集后，我们可以使用显示过滤器区域（Filter\
  \ Toolbar）来关注对我们重要的内容。\n\n![](img/inline11.2.jpg)\n\n**Packet List Pane (PLP)**：\n\
  \n*   这里显示了所有已捕获的数据包。每一行代表一个独立的数据包。\n\n*   列标题包括：\n\n    *   **No.**  \n       \
  \ *   – 这一列会显示标记数据包开始、结束等的符号。我稍后会详细说明这些符号及其含义。\n\n    *   **Time**\n\n    *   **Source**\n\
  \n    *   **Destination**\n\n    *   **Protocol**\n\n    *   **Length**\n\n    *\
  \   **Info**\n\n![](img/inline11.3.jpg)\n\n**Packet Details Pane (PDP)**：\n\n* \
  \  当你高亮选中 PLP 中的任何彩色行时，PDP 会显示该数据包的详细信息。\n\n![](img/inline11.4.jpg)\n\n**Packet\
  \ Byte Pane (PBP)**：\n\n*   显示当前选中的数据包的十六进制/ASCII 泄漏视图。\n\n![](img/inline11.5.jpg)\n\
  \n不久之前，我提到了 PLP 第一列中的符号，这些符号用于帮助你跟踪对话的流动。这些颜色是 Wireshark 默认配色方案的一部分。下面是这些颜色的说明：\n\
  \n*   **对话的第一个数据包**  \n    ![](img/inline11.6.jpg)\n\n*   **你所选中对话中的数据包**  \n  \
  \  ![](img/inline11.7.jpg)\n\n*   上述两项在 PLP 中可见。接下来是你尚未看到的项目……\n\n*   **不属于你所选中对话的数据包**\
  \  \n    ![](img/inline11.8.jpg)\n\n*   **你所选中对话的最后一个数据包**  \n    ![](img/inline11.9.jpg)\n\
  \n*   这两个箭头分别用于 DNS 请求（箭头向右）和 DNS 响应（箭头向左）  \n    ![](img/inline11.10.jpg)\n\n*\
  \   **选中数据包对该数据包的确认**  \n    ![](img/inline11.11.jpg)\n\n*   **选中数据包是重复确认该数据包**\
  \  \n    ![](img/inline11.12.jpg)\n\n*   **选中数据包与该数据包以其他方式相关联**  \n    ![](img/inline11.13.jpg)\n\
  \n*   另外注意，如果在 PDP 中观察到方括号 \\[ \\] 和链接，这些信息是 Wireshark 生成的，不是数据包本身的内容。\n\n对于我们的调查，不同对话的数据包颜色区分会很有帮助。Wireshark\
  \ 附带默认的着色规则，但你可以根据需要自行修改颜色。\n\n需要记住的是，Wireshark（以及任何其他协议分析工具）只能观察和解释它所知道的协议（数量众多）。全球有许多由军事和政府实体（例如联邦执法机构、情报组织如\
  \ MI-5/6、CIA、NSA、企业实体、有组织犯罪等）编写的秘密或专有协议。Wireshark 对这些协议一无所知。我早在 2000 年开始编写自己的协议，最初是为了实验目的，随后为了隐私和工作相关的需求。我发现\
  \ C 语言和 Intel/Motorola 汇编语言非常适合此类工作，尽管我曾在有空和兴趣时尝试过其他语言。如果你有兴趣，也有专门的书籍可以阅读。拥有这些技能的一个明显优势是，你可以搭建看似正常但能够隐蔽地等待入侵者的计算机网络和系统，而入侵者甚至不会察觉到你使用了未知的自定义协议。你可以按自己的意愿回应入侵者，而他们却毫不知情地在你的系统中移动、进入和退出，甚至把你的“礼物”留在他们自己的系统中，而他们很可能从未察觉。\n\
  \n此外，另一个有价值的技能是自己设计主板，并编写 BIOS、内核和操作系统（即使是微型的也能完成工作）。我早在 1985 年就使用 Z80 微处理器开始了这项工作。这类技能的应用范围广泛，尤其是对于注重隐私和安全的人来说，具有广泛的意义和好处。如果你感兴趣，也可以购买相关书籍进行学习。\n\
  \n好了，让我们继续深入案件……\n\n在前往杜勒斯机场的出租车旅程中，我给 Bob 发送了一封加密电子邮件（我的笔记本电脑已配置为无线加密通信），里面列出了需要立即回答的问题，以便我在飞机上更好地制定策略。（我通常坐出租车是因为这让我能够处理客户的问题，而不是花时间在交通堵塞上。）我是这样高效利用了可用的时间。我提出的问题和所作的评论如下：\n\
  \n*   你的物理安保人员是否已经尽可能地封锁了发生安全事件的区域？\n\n\n\n\n-   [不要在等我到达后才重新启动 Web 服务器。如果可能的话，直到我到达之前，任何人都不应该触碰该机器。]\
  \  \n-   `Note`: 如果系统管理员从未触碰该盒子，情况会好得多。由于 Ron 关闭了 Web 服务器，我丢失了可能有价值的随机访问存储器 (RAM)\
  \ 信息。现在，如果 Ron 重新启动服务器，我会因为操作系统在启动时会覆盖硬盘的某些关键区域，而丢失更多信息。  \n-   如我理解，受害者是一台运行 SP5（Microsoft\
  \ Service Pack）Option Pack 4 和 IIS4（Internet Information Server 4.0）的 NT4 Web 服务器。这是否正确？\
  \ [是的。务必了解客户所使用的平台/操作系统。这将极大地帮助你为解决手头的问题做准备。]  \n-   过去四周内是否对操作系统进行了任何更改？ [SP5 是在第一次入侵之后加载到\
  \ Web 服务器上的。随后，多个 Microsoft 安全补丁也相继安装，给客户一种安全感，但实际上这妨碍了我的调查，因为它再次导致硬盘上被覆盖了一些可能指向黑客的信息。他们在入侵后绝对不应该触碰该机器。他们最好的做法是拔掉机器后面的网络连接，使\
  \ Web 服务器不再在 Internet 上广播。]  \n-   `Note`: 如果你为操作系统安装任何补丁，请确保隐藏或删除旧系统文件。如果不这样做，黑客可以逆向补丁过程，撤销补丁并恢复那些存在漏洞的旧系统文件。\
  \  \n-   谁首先发现了被入侵的系统？具体时间是什么时候？ [物理安全成员 Sam Miller 首先在 7 月 23 日凌晨约 5 点发现了这次入侵。Sam\
  \ 随即联系他的经理 Ross Pierce，Ross 再联系 CEO Bob Jacobs。Bob 随后联系系统管理员经理 Lucy Miles，Lucy 则告知\
  \ Ron Yougald，让他关闭 Web 服务器。Ron 在约 5:47 点完成了关闭。]  \n-   哪些人拥有对这台机器的权限？他们拥有什么权限？ [该\
  \ Web 服务器位于 NorTrust 域内。此外，该服务器上还有本地安全组，可在启动后查看。我还提供了一份系统管理员、域管理员以及系统用户的名单。在此情况下，共有\
  \ 13 名系统/域管理员拥有对被入侵 Web 服务器的完整系统访问权限。这远远超过应有的数量。建议仅有两人拥有完整系统访问权限，当前的管理员密码应放入密封信封并锁在保险箱中，由物理安全部门监督。]\
  \  \n-   我需要一份他们的安全政策/程序文档，如果有的话。 [很抱歉，目前没有正式的安全政策/程序文档。文件访问权限是通过向 Web 服务器管理团队发送电子邮件请求来授予的。未使用\
  \ NT 审计软件。这些是安全措施不佳的做法。除非有明确的“公司需求”并且两名高级管理者同意并充分理解这些权限的业务意义，否则不应授予系统管理员权限。]  \n\
  -   有人知道这起事件的原因吗？ [不知道。]  \n-   这台 NT4 系统的使用年限是多少？ [Ron Yougald 约一年前配置并加载了 NT 系统。六个月后，Scott\
  \ Yaser 加载了 IIS4 配置。约三个月前，Darlene Mencer 对 IIS4 进行了重新配置。这些员工彼此不认识，也未就各自在服务器上的工作进行沟通。他们也没有记录所做的工作——时间不够，管理层优先事项其他。这同样是一项不佳的安全实践。顺便提一下，系统的使用年限很重要。老旧的硬盘可能表现得像被恶意篡改过。]\
  \  \n-   能否发送该盒子周围的网络基础设施的电子副本（不需要 IP 地址）？ [有些公司会提供此信息，有些则不会。如果你收到，请确保通信会话加密，并注意文档不致落入错误的人手中。拥有这些信息有助于在前往客户现场的途中制定攻击计划。]\
  \  \n-   对于这台 NT4 系统：它是以 FAT 还是 NTFS 方式设置的？ [启动 Windows NT 4.0 Server 系统的 C:\\\\\
  \ 驱动器使用 FAT，IIS4 与共享文件夹（D:\\\\ 驱动器）使用 NTFS。]  \n-   系统上的硬盘有多大？共有多少块？ [系统包含六块 9 GB\
  \ 的物理硬盘。这很重要，因为你需要确保备份介质能够容纳这些硬盘的容量。移动电话和无线笔记本连接 Internet 至关重要。如果在前往客户现场的途中发现你缺少所需设备，请致电确认客户现场附近是否有电脑供应店可以快速获取所需物品（如备份磁带、硬盘或光盘），或在线下单并安排次日达送达客户现场。]\
  \  \n-   后面的箱子是否配有 SCSI 或并行端口？ [两种端口均可用。SCSI 线缆有多种类型，务必确认具体是哪种。如果你没有必要的线缆，请确保可以从客户现场附近的本地电脑店获取，或在线下单并次日达。]\
  \  \n-   `Note`: 通过 SCSI 线缆进行备份的速度至少是使用并行线缆的九倍，因此尽可能使用 SCSI。]  \n-   该机箱是否配有光驱和软盘驱动器？\
  \ [是的。大多数较新系统都有这些设备，但有些较旧系统可能没有。如果没有，请确保可以使用外部光驱和外部软盘驱动器。如有需要，可向客户请求这些驱动器。]  \n\
  -   该系统是基于 Intel 平台（如 RISC 或 SPARC）还是其他？ [是的：Compaq Proliant 3000，采用双核 800 MHz 的\
  \ PII。但请注意，客户可能会给出答案，因为他们认为这是真的，或者他们不想告诉你他们其实不知道。现场到达后你可能会发现他们的回答是错误的，这同样适用于你提出的其他问题。]\
  \  \n-   该系统是否位于受限（分级）环境？ [不是。如果是分级环境，你需要确保已将适当的许可证传真至客户，以便在你到达时能够访问系统。此外，分级环境还要求你确认是否可以携带移动电话等通讯工具。若不能，请提前做好沟通安排。]\
  \  \n-   我到达现场后，需要你的系统专家在 NT 盒子本身以及与其网络基础设施（防火墙、路由器、交换机等）相关的工作人员身边。请提供他们的姓名和联系方式（电子邮件、电话）。\
  \  \n\n\n\n**注意**：您不能对一切都成为专家。您需要对构成网络基础设施的设备有一个总体理解，但您也需要在访问每个设备时有一位深入的专家与您同在。如果客户没有相关专业知识，请通过咨询公司或其他可用渠道安排该专业知识。\n\
  \n我还需要一名技术人员，能够向我介绍与被入侵的 Web 服务器相关的布线场所和布线橱柜。请提供姓名及联系方式（电子邮件和电话）。[通常，真正了解设施布线布局的人是那些实际敲了线的人。您需要能够从被入侵系统后面的端口一直追踪到布线橱柜（在天花板和楼下）。请不要仅凭某人的描述来判断线路的走向。该人员可能错误，线路可能已被窃听。您需要亲自确认。]\n\
  \n此事件不应向不需要知晓的人员透露。[这显而易见。客户不应公开该事件已发生，也不应公开网络取证调查员（CFI）将要到来调查的消息。保持低调。如果不这样做，您可能会面临新闻媒体上门或提示实施恶意行为的肇事者。如果是内部人员，他们可能在\
  \ CFI 到来前就掩盖自己的痕迹。]\n\n我需要对一些人员进行面谈。如果您的政策规定必须由人力资源（HR）人员在场，请提供至少两位 HR 人员的姓名及联系方式（电子邮件和电话）。[此情况需要\
  \ HR 人员参与。]\n\n**注意**：如果这是一个工会车间，合同或工会协议可能规定在对工会雇员进行任何质询时必须有工会代表在场。请务必遵守此规定，否则肇事者可能会因此获释。\n\
  \n系统管理员或安全人员是否定期查看系统日志？[不是。这虽然令人不快但并不意外。许多客户出于性能和磁盘存储考虑未开启系统审计，或仅有有限的日志。您也可能会遇到日志已开启但没有人时间审查的情况，以检查系统或网络是否存在恶意活动的迹象。]\n\
  \n您是否已部署入侵检测系统（IDS）？[没有，但我们已部署 Cisco PIX 防火墙。]\n\n**注意**：两者都应具备。有关 IDS 与防火墙的信息在本书附录中。\n\
  \n请提供该系统的备份磁带副本供我使用。[我强调的是副本而非原始磁带。请确认使用的是何种备份系统，并确保您拥有正确的还原设备。该设备可购买或租赁。客户甚至可能允许您将其带回实验室在调查期间使用。]\n\
  \n该 NT 系统在过去四周内是否曾进行过服务？[否。然而，设备外壳未保持上锁，钥匙在外壳上。 housing 该设备的房间已上锁，但多位人员持有钥匙。此情况极不安全。首先，NT\
  \ 网页服务器外壳应上锁，钥匙应由物理安全部门保管，同时房间钥匙也应由物理安全部门保管。若系统近期接受过服务，您需要查阅相关文档，并核实实际完成的工作与文档描述是否一致。有时维修人员会“植入”恶意硬件或软件。\n\
  \n过去四周内是否有不满的员工被解雇？[据我们所知没有。请注意回答的措辞。在大型组织中，员工可能在少数人知晓的情况下被解雇，他们可能认为该人员在休假或病假。请务必与\
  \ HR 确认此点。若有不满员工被解雇，则需获取其系统用户 ID 并仔细检查其用户 ID 下的日志活动。他们可能会以多种方式隐藏活动（取决于其专业水平），但这是一个良好的起点。]\n\
  \n您是否知道当前有任何不满的员工？[据我们所知没有。请在面谈时 discreet 地确认。仔细倾听受访者。您可能会发现线索。]\n\n过去三个月内是否发生过其他安全事件？[据我们所知没有。请保持审慎态度。您的客户可能一年前已被入侵但未觉察。若查阅某些存放此类信息的网站，您可能会为客户带来惊喜。两个主要站点供参考：rootshell.com\
  \ 与 ATTRITION.org。还有众多其他站点，但这两个是最佳选择。]\n\n实际拥有对该 NT4 盒子的物理访问权限的人员有哪些？[一位秘书持有钥匙并将其发放给需要的人员。未维护钥匙日志。显然这里存在明显的安全漏洞，虽然这种情况很常见。任何未获正式授权的人员都不应获取锁定服务器机房的钥匙。]\n\
  \n该系统位于防火墙内部还是外部？[位于防火墙内部，防火墙规则仅允许特定 IP/PORT 访问。防火墙已打开 80 与 21 端口，以便通过 Internet\
  \ 的人员能够访问 Web 服务器。端口 80 是 HTTP 流量的常规端口，端口 21 是 FTP 端口，用于文件传输。这也是部署 IDS 的另一理由。尽管防火墙可能允许恶意流量经由\
  \ 21 与 80 端口，但 IDS 可能能够检测并终止此类流量，或根据配置执行其他操作。]\n\n该系统是仅供 Internet 使用，还是配备额外的网卡（NIC）连接到组织内部网（\
  \ intranet）？[两者皆有。系统配备一张用于 Internet 的 NIC 以及一个用于 intranet 的虚拟主机（两个 IP 地址）。*\n\n\
  **注意**：此配置相当不安全，使用它的人员将面临内部网络被威胁的风险。\n\n该系统的所有用途是什么？[该 Web 服务器用于存放包含我们对各类产品和公司进行研究结果的\
  \ Oracle 数据库。法律要求我们使这些信息公开。]\n\n该系统使用哪些传输控制协议（TCP）/用户数据报协议（UDP）端口？其用途是什么？[我们认为 TCP\
  \ 80 与 21 为唯一开放端口。该系统还配置为 NT 远程管理。]\n\n我希望查看该系统的原始采购订单副本，显示其最初购买时的配置。我也希望获得任何硬件层面的服务或修改记录副本。[我们已有原始采购订单、配置及修改记录，可供您查阅。但该系统维护较为松散，我们不确定其实际配置是否与文档描述一致。]\n\
  \n\n\n**Note:** You can run a software program called InsightManager on NT to identify\
  \ the current configuration. If the same program was run at an earlier date, you\
  \ can compare the old report with the new one you just made.\n\nWere any new applications\
  \ recently (in the past four weeks) added to or removed from the system? [Three\
  \ system administrators stated that they did make some application file changes,\
  \ but they did not document which files were changed.]\n\nThe above question and\
  \ answer session occurred during my trip to the airport in the cab and while I waited\
  \ to board the airplane at the airport.\n\n> **Note:** If this had been an established\
  \ client, I would have had the answers to most of the above questions at the time\
  \ when the client initially contacted me. An established client has a checklist\
  \ to use when a network security incident occurs. The client quickly works through\
  \ the checklist, providing answers as well as possible, and e-mails me the results\
  \ via a secure encrypted link. This is a big timesaver. Saving time at the beginning\
  \ of an investigation makes it more likely that the resolution of the investigation\
  \ will be successful. The first 24 hours of a new case are critical.\n\nI am now\
  \ on the airplane, heading to Boston. My carry-on luggage is above my seat, stored\
  \ safely away. This is an important point. Never put your Cyber Forensics Equipment\
  \ Container (CFEC) in the hands of the airline personnel. Too much can go wrong.\
  \ You have expensive (and sensitive) hardware and software and are responsible for\
  \ it. If you arrive at the client site without your CFEC, you have a serious problem.\
  \ Always keep your Cyber Forensics Equipment (CFE) in carry-on luggage that has\
  \ wheels and a handle and is a size that fits in the compartment above your airplane\
  \ seat. The contents of a CFEC may vary to some degree, depending on your work,\
  \ but the following is a good standard to follow:\n\n- Velcro fasteners to keep\
  \ cables contained\n- Hard drives that will work in the system(s) you will investigate\n\
  - Read/write CD-ROMs\n- A wireless laptop loaded with vulnerability analysis, IDS,\
  \ CF software, etc.:\n  - Mijenix Fit It Utilities CD-ROM\n  - Norton Utilities\
  \ CD-ROM\n  - NTI (New Technologies, Inc.) CF tools\n  - EnCase\n  - Access Data\
  \ System Management Toolkit\n  - L3 Network Security Expert\n  - ISS Real Secure,\
  \ Internet Scanner, System Scanner\n  - NeoTrace\n  - Visual Route\n  - Microsoft\
  \ Office\n  - Internet and e-mail access\n  - Antivirus software\n  - PERL\n  -\
  \ Microsoft Visual C++ 6.0 or later\n  - Intel/Motorola Assembler\n  - Fortran\n\
  \  - Digital camera\n  - Bootable to Windows 95/98/2000, Linux, Solaris, Macintosh\n\
  \  - Network ICE (personal laptop firewall)\n  - Partition Magic and Boot Magic\n\
  \  - VMware\n  - MatLab\n  - Mathcad\n  - QuickTime\n  - Adobe Acrobat\n  - NetScan\
  \ Tools Pro\n  - War dialer\n  - Analyst’s notebook\n  - Big Business Directory\n\
  \  - Dragon voice recognition\n  - NFR\n  - SafeBack\n  - Video camera (no active\
  \ microphone)\n  - Boot diskettes for various operating systems/version levels\n\
  - Electronic copies of any documentation needed (paper is too bulky)\n- Cables:\
  \ all SCSI types, parallel, serial, telephone (RJ11), network (RJ45)\n- Tape recorder:\
  \ hand held, digital with IBM Via Voice and regular tape types\n- Technical Surveillance\
  \ Counter Measures (TSCM) equipment (The concern is that someone may have planted\
  \ a transmitter.):\n  - Radio frequency (RF)/microwave transmitter locator\n  -\
  \ White noise generator\n- DAT tape drive (I recommend Ecrix VXA-1 External SCSI.)\n\
  - Extra pens/pencils and a wire-bound notepad\n- A pair of Motorola radios (walkie\
  \ talkies)\n- Computer repair tool kit (includes antistatic wrist line)\n- Extra\
  \ battery and hard drive (duplicate of your current drive) for your laptop\n- Paper\
  \ and electronic copies of all e-mail/telephone numbers you might need\n- Jaz Drive\
  \ with 2-MB disks\n- All power cords, device connectors, and adapters required\n\
  - Cellular telephone\n- TechCard (to obtain 24/7 support on nearly any product)\n\
  - Credit cards, driver’s license, badges, etc. required\n- Passport\n- Portable\
  \ color printer that connects to your laptop (with extra ink cartridge)\n- 5.25-inch\
  \ diskettes with labels\n- Surge protector\n- Sequoia pocket books: Pocket Partner,\
  \ Pocket PCRef, WinRef, TechRef\n- Imation Super Disks for Macintosh computers\n\
  - Color-coded stickers (circular)\n- Cable labels\n- Evidence labels and chain of\
  \ custody forms\n- Erasable and nonerasable markers\n- Cameras (digital and film\
  \ type)\n- Kensington Sonic Lock Alarm\n- Kensington laptop security cable\n- Null\
  \ modem cable/Lap Link cable\n- NetWare CD-ROM or diskettes\n- Four-port mini 10/100\
  \ network hub\n- Mini projector for laptop\n- Fluke Network Meter\n- Duplicator\
  \ (to make second copy of the bitstream backup)\n\nThis may seem like a large amount\
  \ of equipment, but it all packs well into one carry-on piece of airplane luggage.\
  \ Lest I forget, there are two more important details:\n\n1. Be sure you have notified\
  \ at least one person (preferably two or three) to let them know where you are going;\
  \ provide them with emergency contact information.\n2. Be sure to inform your computer\
  \ crime attorney of your location, contact information, and general information\
  \ pertaining to the case. Your attorney should expect to be contacted and therefore\
  \ should readily respond to a ringing cell telephone or pager.\n\nI arrived at the\
  \ client site, Nortelem, in Boston, Massachusetts, and was met at the gate by a\
  \ security guard, who requested proper identification and then notified Bob Jacobs\
  \ of my arrival. The security guard inspected my CFEC and required me to sign a\
  \ statement stipulating my understanding of company policy pertaining to the equipment\
  \ I am bringing in. Bob picked me up at the gate and we went to a conference room.\
  \ The first thing I always do when I arrive at a site is to hold a 15-minute briefing.\
  \ (After reviewing the information Bob sent me, I contacted him and told him who\
  \ I would like to have available as soon as I arrived on site.) The briefing covered\
  \ the following topics:\n\n- Was physical security able to secure the area where\
  \ the security incident occurred?\n- Have you learned anything new since we last\
  \ communicated?\n- Do you have available the personnel I requested?\n- Web server\
  \ system administrators (at least two of them)\n- Firewall, switch, router experts\n\
  - NT4 operating system expert\n- Applications expert for the compromised system\n\
  - Legal, HR, and union (if necessary)\n\nIn summary, this is the procedure I followed.\n\
  \n- Begin the evidence collection process. This entails obtaining a bitstream backup\
  \ of the victim systems and collection of logs from routers, switches, firewalls,\
  \ etc. All evidence collection is done in accordance with DOJ (Department of Justice)\
  \ guidelines so the client can use the evidence in a court of law if desired.\n\
  - Obtain a copy of the victim system backups for the past week.\n- Interview personnel\
  \ involved with the victim systems.\n\nOnce I have obtained the abovementioned backups,\
  \ logs, and tapes and completed the interviews, I will return to my lab and begin\
  \ the analysis stage at my Cyber Forensics Lab (CFL). Using the backups, logs, tapes,\
  \ interview information, and bitstream backup, I will determine:\n\n- Were any changes\
  \ made to the operating system?\n- Were any changes made to applications or data?\n\
  - Did the perpetrator plant any hidden software on the systems?\n- Did the perpetrator\
  \ steal any data?\n- Did the perpetrator modify any data?\n- How did the culprit\
  \ manage to break into the system?\n- Why did the culprit break into the system?\n\
  - Who was the perpetrator?\n- Where does the perpetrator reside?\n\n\n\n-   [什么类型的机器被用来发动攻击？](https://example.org)\n\
  \n-   [攻击者使用了哪些黑客工具？](https://example.org)\n\n-   [攻击者是否已 compromise 客户现场的其他系统？](https://example.org)\n\
  \n-   [攻击者何时 compromise 了系统？](https://example.org)\n\n-   我还会向客户说明如何关闭找到的安全漏洞。\n\
  \n如果需要，我会每天让客户了解最新进展。我也会在调查结束后向客户提供一份完整的书面报告。\n\n我尽量控制在 15 分钟内完成这份简报。现在我将转向被 compromise\
  \ 的系统。该系统位于一间受保护区域，后面是上锁的门。首先，我小心打开计算机系统的外壳，查找任何异常情况。我对系统本身以及没有外壳的状态都拍照，同时拍摄系统所在的整体区域的照片。我也对该区域进行录像。为了检测（或控制）“bug”（射频/微波发射器），我使用\
  \ Boomerang 扫描房间。一次非常彻底的扫描可能需要数小时，但我并未进行彻底扫描，我只在本案中寻找快速安装的“业余”发射器。未发现任何异常后，我使用白噪声发生器作为防范隐蔽监控的安全措施。你的检查彻底程度取决于你的偏\
  \ paranoia（多疑）程度以及正在处理的案件。请记住，笔记本电脑和工作站/服务器的扬声器可以被设置为麦克风。你的客户或 perpetrator 可能在聆听你所说的一切。\n\
  \n我决定使用我的 Ecrix VXA-1 磁带驱动器来保存即将获取的比特流备份。我将 VXA-1 连接到机箱背面的 SCSI 端口，插入包含 SafeBack\
  \ 的启动软盘，然后通电启动系统。我浏览 SafeBack 的界面，然后比特流备份开始进行。一旦确认备份按计划进行（我观察约五分钟），我便离开房间去面谈各方人员。我确保警卫在门后锁上门并保持在场直到我返回。房间没有其他入口（通过天花板、地板或窗户）。比特流备份需要数小时才能完成，因此我现在最好的时间利用是面谈各人。我查看手表并记录显示的日期/时间。与此同时，我记录被\
  \ compromise 网络服务器显示的日期/时间。随着我在这份文档的后续段落中逐一检查网络基础设施的各项内容，我始终记录所有防火墙、路由器、交换机以及我将收集日志的其他设备的日期/时间。稍后，如果出现时间差异，我将能够根据我记录的时间进行关联，所有日志数据都可基于这些时间进行校正，并考虑任何偏差。\n\
  \n再次，在审阅我之前向 Bob Jacobs 请求的信息后，我向他发送了想要面谈的人员名单。我不知道所有人的姓名，因此如果我不清楚某人的姓名，我会向 Bob\
  \ 简要描述需要面谈的人物类型。他提供了相应的联系信息，并指示相关人员随时待命。并非总是容易获得我需要面谈的人员的访问权限（会议、休假、病假、在其他地点、培训等）。我想面谈的人员包括：\n\
  \n-   布线技术员\n\n-   部分系统/域管理员\n\n-   防火墙、路由器、交换机、VPN 专家\n\n-   操作系统专家\n\n-   应用程序专家\n\
  \n-   实际构建/修改网页的人员\n\n-   网络安全人员\n\n我从布线技术员开始，要求他带我沿着从被 compromise 的 Web 服务器背面的网线出发，一直到它实际连接到布线间\
  \ closet 中的交换机或集线器的路径。我们沿着电缆走，确实如他所说到达了目的地，没有任何绕路。令我惊讶的是，尽管布线间 closet 是上锁的，布线技术员仍走到前台的办公桌，打开抽屉，取出钥匙打开布线间\
  \ closet。我问他原因，他告诉我的是没有保持钥匙日志，任何知道钥匙位置的人都可以进入布线间 closet。这无疑点燃了我的红色警报灯。我做了记录，因为这显然属于物理安全漏洞。\n\
  \n在布线间 closet 内，我使用相机拍摄布局的照片。我之前得到的网络基础设施图示表明，要从 Internet 到达 Web 服务器，需要经过三台路由器和两台防火墙。假设这说法正确且假设（暂时）路由器和防火墙已正确配置，那么从\
  \ Internet 到 Web 服务器的安全性应当足够。然而，我从不完全依赖提供给我的图示。它们仅供参考，给出网络布局的大致概念。为了验证图示的准确性，我拔下\
  \ Web 服务器的网线，插入我的笔记本电脑（该笔记本电脑已配置为能够访问其网络，并获取了 Web 服务器原有的 IP 地址）到该端口。我先进行几次 “ping”\
  \ 以确认我已正确连接到本地设备。一切正常。随后，我在 DOS 提示符下执行 “netstat -nr” 来查看活动路由和活动连接。\n\n我的下一步是检查到已知的\
  \ Internet IP 地址的跳数。我原本期望至少看到五跳，因为图示中有三台路由器和两台防火墙。实际得到的跳数却是一！这真是一个震惊。这表明被 compromise\
  \ 的 Web 服务器与 Internet 上的 IP 地址之间只有一个设备在中间。布线技术员确认该地址属于他们的路由器之一。这意味着只有单台路由器位于被 compromise\
  \ 的 Web 服务器和 Internet 之间——这很有趣……且安全性极差。我感谢布线技术员的时间，并联系了路由管理员以便面谈。\n\n\n\n\nSteve\
  \ Wier 是负责企业路由器的高级人员。我向他解释了我刚刚遇到的情况，他随即带我去了正确的路由器。遗憾的是，这是 Steve 第一次在这台路由器上操作。我很快了解到，这只是\
  \ Steve 的第二周上班。在 Steve 之前担任该职位的个人（James Roberts）两周前已离开公司。我向 Steve 请求 James Roberts\
  \ 的联系方式，但 Steve 并没有。我需要向 HR 确认。Steve 与我一起检查了路由器的访问控制列表（ACL），发现它几乎是空的，没有针对受 compromized\
  \ 网络服务器的相关控制。我记录了这点，并让 Steve 立即为这台路由器设置正确的 ACL，然后检查其他路由器。他心悦诚服地同意。由于 Steve 的第一周主要在人力资源部接受各项必需培训，他对\
  \ ACL 的不当设置不负责；他在第二周才刚刚开始熟悉企业网络拓扑结构。我的下一通电话是给提供网络图的 Terry Reiner。我向 Terry 说明了我们关于路由器的发现。他起初不相信我，直到我把\
  \ Joe Freid（线缆技术员）和 Steve Wier 合并进通话。基于此次电话会议，Joe 组织了他的小组，开始了一周的布线追踪工作，确保他们拥有网络布局的坚实物理图。他们对基础设施图进行了若干更改，并移除了不再使用的布线。Terry\
  \ 向所有防火墙和交换机工程师/技术人员进行了简报，他们进行了一周的马拉松式检查和相互核对防火墙规则集与交换机配置（这也大约耗时一周，包括测试）。随后需要进行若干更改和增强。在此之前，Terry\
  \ 为我打印了所有防火墙规则集和交换机配置的清单。James 也为路由器做了同样的操作。Joe 给我提供了布线实际布局的地图，在小组进行更改前后的对比图。我与\
  \ James、Joe、Terry 一起，每日向 Bill Miter（高级网络安全分析员）汇报进展情况。\n\n从上述描述来看，可能让人误以为我在那里待了整整一周。事实并非如此。我只在那里待了一天，这段时间足以收集来自各类设备（防火墙、路由器、交换机、网络服务器）的比特流备份和日志，并面谈所需人员。我离开后，信息通过加密渠道交换，并且我们约定了对所有参与者都有意义的代码词。通常我会在非机密场所停留一天或两天，将所需资料带回华盛顿特区的实验室进行分析。如果我在机密场所工作，则必须遵守当地规则，这意味着我可能会在机密场所停留一个或两周（甚至更久），在现场完成全部分析。现场提供所需材料，我一般无法带走任何东西，具体取决于场所规定。因此，在第一天长时间的工作结束后，我返回受\
  \ compromized 网络服务器，通过 SafeBack 验证比特流备份，然后使用复制设备对备份进行第二次拷贝。即使该服务器在我的离开期间不得随意操作，我也需要确认是否有其他人在离开后对硬盘进行篡改。为此，我使用磁盘签名程序\
  \ DiskSig 对硬盘进行数学签名。如果硬盘被任何方式篡改，签名将会改变，从而提醒我硬盘已被修改。我会获取两份签名：一份包含引导扇区，另一份不包含引导扇区。我把磁盘刻录盘插入驱动器\
  \ A，里面装有 DiskSig 程序，并输入如下命令：\n\n``` \n*   disksig /b c: > a:\\\\NortlSig.bot\n*\
  \   disksig c: > a:\\\\NortlSig.nob\n```\n\n.bot 文件包含引导扇区的签名，.nob 文件不包含引导扇区。随后我取出磁盘刻录盘，正确标记它并收工，通知守卫网络服务器应保持安全，我已完成工作并将离开现场进行分析。\
  \ *注意：* 在离开现场前，务必制作第二份比特流备份，并在离开前检查两份备份是否可访问。同时，务必运行 MD5 校验并确认两份备份的数值相同，以确保它们是完全相同的复制品。返回实验室后，将一份通过\
  \ Fed Ex 寄送到实验室（或家中），另一份随机取机上飞机携带。若两份同时保存在同一处，可能会出现意外损失，导致两份都无法使用。将备份通过 Fed Ex 寄送时，请遵循美国国防部计算机取证实验室（DCFL）提供的取证运输指南（http://www.dcfl.gov）。\n\
  \n离开前，我向 Bob Jacobs（Nortelem  CEO）简报了当天的事件，并确保他拥有我的所有联系方式以及我后续行动的时间表。记住，始终保持礼貌、耐心和外交，即使对方未予回报。你永远不知道何时会需要他们的帮助或推荐。除非万一，否则不要焚烧桥梁。最后，务必在离开前检查您携带的所有硬件/软件，以免遗留遗忘。\n\
  \n在飞机上，我回想当天的事件，迅速入睡。大约晚上 10 点，我回到华盛顿特区，前往家中。我需要好好睡一觉，为分析比特流备份和日志做好准备。除非是极端紧急情况，否则不要在疲惫时进行分析，这会导致错误和漏掉线索。确保充足睡眠，早晨精神焕发地开始工作。睡觉前，将所有证据放入保险箱，并确保与其他案件或证据分离。您是唯一拥有该保险箱钥匙的人，这有助于维护证据链的完整性。\n\
  \n第二天早上，门铃响醒了我，是 Fed Ex，送来了我前一天寄出的比特流备份证据。只要包装完好且无损坏，我都不打开这类包裹（视为我的证据副本，绝不触碰）。我将在另一份我使用\
  \ SafeBack 制作的比特流备份上进行分析。吃完早餐并准备好后，我前往实验室，搭建分析机器，使用从未使用过的新硬盘（一台机箱内装有五块 100‑GB 硬盘）。受\
  \ compromized 网络服务器使用的硬盘为 60 GB。新硬盘很重要，必须确保不把本案证据与以往案件的信息混淆。我必须强调，在整个调查和分析过程中，细致的文档记录至关重要。保持详细的笔记，即使最终报告不必包含全部内容。假设每个案件最终都会进入法庭（尽管\
  \ 99% 的案件实际上不会）。\n\n\n\n\n确保您的取证分析系统（CFAS）已设置正确的日期/时间。在 CFAS 上新加入硬盘后，再次使用 SafeBack\
  \ 将 CFAS 的位流备份恢复。注意：CFAS 始终是独立机器，从未连接互联网。若配置否则，将会污染取证证据。恢复完成后，转入分析阶段。了解如何使用 CF 工具是一回事，而知道在何种情形下使用哪个工具则是另一回事。出色的调查技能也是必须的，且需能够快速应变。您需要在本书前面章节中所学的知识进行应用。\n\
  \n> **注意**：新硬盘标记为 C、D、E、F、G。驱动器 C 包含已恢复的受损系统位流备份，相关工具位于驱动器 D。\n\n第一步是获取驱动器 C 的 slack\
  \ 空间。所有工具的结果将放在驱动器 D 上。要从驱动器 D 获取驱动器 C 的 slack 并保存为名为 Nortelem_Slack 的文件，在驱动器 D\
  \ 中输入：\n\n getslack Nortelem_Slack c:\n\n接下来，我要获取驱动器 C 上的空闲空间（未分配空间），并将其保存为驱动器 D\
  \ 上名为 Nortelem_Free 的文件。这样可以恢复已删除且未被覆盖的文件或数据。在驱动器 D 中输入：\n\n getfree Nortelem_Free\
  \ c:\n\n对 Nortelem_Free 和 Nortelem_Slack，我需要生成 MD5 校验和以及 CRC 检查值，以确保文件完整性。将这些信息保存为同名加\
  \ .crc 后缀的文件，以便后续识别。所有操作在驱动器 D 上完成：\n\n crcmd5 Nortelem_Slack > Nortelem_Slack.crc\n\
  \n crcmd5 Nortelem_Free > Nortelem_Free.crc\n\n现在，我创建驱动器 C 的目录树摘要文件，包含 MD5 计算以及已删除文件的信息。将输出保存到驱动器\
  \ D，文件名为 NorDirTr。注意：要查看 NorDirTr 的内容，必须使用 FileCnvt 程序将其转换为 .dbf 文件（NorDirTr.dbf），随后即可在\
  \ Excel 中打开：\n\n filelist/m/d d:\\\\NorDirTr c:\n\n随后，我对之前创建的 slack 文件 Nortelem_Slack.S01\
  \ 进行分析。我需要一款能够将二进制数据转换为可读文本并从大量二进制数据中提取可能有意义的信息的工具。我选择使用 Filter_I。由于 Filter_I 与\
  \ slack 文件都位于驱动器 D，分析时也从该驱动器进行。\n\n 运行 Filter_I，选择 Filter，指定 Nortelem_Slack.S01\
  \ 文件\n\n注意，此次运行 Filter_I 生成的文件名为 Nortelem_Slack.F01。同时，所有非 ASCII 数据已被替换为空格。现在，我使用另外三个选项（Intel、Names、Words）对\
  \ Nortelem_Slack.S01 进行运行。\n\n于是，我得到以下三个附加文件：\n\n1. Nortelem_Slack.F02：这里出现了一些英文语言模式、密码、用户\
  \ ID。\n\n2. Nortelem_Slack.F03：这里出现了一些名称：xero、most-hated、Phiber Optik、infamous、Steve、Laura。\n\
  \n3. Nortelem_Slack.F04：这里获取了一些消息和可能的文件名：\n\n Stack overflow error.\n\n Divide by\
  \ zero error.\n\n Not enough space for environment.\n\n … change English units to\
  \ metric units…\n\n此情况严重。我立即联系 Nortelem，告知他们需要检查数据库，看是否将计算中的英文单位改为公制单位。虽然此信息来源于网页服务器，但由于其内部网络与互联网通过同一系统关联，若该系统受到其他企业网络信任，则其他系统可能受到影响。\n\
