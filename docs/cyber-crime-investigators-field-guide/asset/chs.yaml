  \n硬盘碎片空间中的数据很重要，因为它可能包含已删除文件的残留数据以及曾经存在于计算机内存中的数据。使用的文件扩展名是 `.sxx`（如 .s01、.s02 等）。\n\
  \n### NTFS VIEW\n\n*   *New Technologies, Inc.*\n\n*   *[`www.Forensics-Inil.com`](http://www.Forensics-Inil.com)*\n\
