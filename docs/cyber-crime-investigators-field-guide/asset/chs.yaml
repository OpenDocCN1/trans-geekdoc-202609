  \ on “bitchx.”\n\n![Figure 6.25 Search results for “crack.”](img/fig6.25.jpg)\n\n\
  *Figure 6.25* Search results for “crack.”\n\n我们可以继续演示，但您已经明白如何使用 EnCase 进行搜索。如果继续使用全部关键词（并包含与\
  \ AccessData 相同的关键词），最终会得到与 AccessData 相同的信息。\n\nEnCase 具备非常出色的报告功能，它会在您推进调查的同时自动生成报告。您可以在查看或编辑报告时，随时通过\
  \ **Report** 标签页进行书签和添加内容。请注意，需要点击 **Report** 标签页才能查看报告。\n\nEnCase 还有一个名为 **EScript**\
  \ 的有趣功能，它是基于 C 语言语法的编程工具，可按需增强 EnCase 的搜索能力。Guidance Software 在其网站上提供了大量可下载的 EScript\
  \ 文件。本文不涉及 EScript，但如果您熟悉 C/C++ 编程，由于语法相似，学习起来会非常容易。我在本例中使用的是 EnCase 3 版本，因为截至目前，大多数取证分析师都在使用该版本。需要注意的是，2003\
  \ 年 Guidance Software 推出了 EnCase 4 版本。下面我们来看看 EnCase 4 的主要特点。\n\n我们还需要指出，EnCase\
  \ 4 实际上有两个不同的版本。一个是 **EnCase Enterprise Edition**（简称 EEE、E‑cubed 或 E3），另一个是 **EnCase\
  \ Forensic Edition**（简称 EFE）。我们先简要讨论 E3，然后再详细说明 EFE 的工作原理。\n\nEnCase Enterprise\
  \ Edition（E3）最初于 2002 年 8 月进入市场。E3 为取证分析师（CFI）提供在网络设备上获取静态系统数据的能力。在 4 版本中，新增了能够通过局域网（LAN）或宽带网络（WAN）从服务器和工作站收集\
  \ **volatile system data**（volatile data capture）的功能，Guidance Software 将其命名为 **System\
  \ Snapshot**。4 版本还新增了 **log file parsing**（日志文件解析）功能。\n\n当我们说 **volatile system\
  \ data** 时，指的是位于 **RAM（随机存取存储器）** 中的数据。在 UNIX 系统上，如果电源中断，这些数据会写入硬盘上的 **core file**，可以使用\
  \ EnCase、AccessData 的 FTK（Forensic Tool Kit）或 NTI（New Technologies, Inc.）工具等进行分析。部分\
  \ Windows 系统在电源突然断开时，也会将部分 RAM 数据写入硬盘的空闲空间等区域，但没有专门的文件专门承载这些数据。如果我们想在系统运行期间读取 RAM\
  \ 数据，E3 可以实现。\n\n使用 E3 的 **System Snapshot** 能够获取哪些信息？以下是几个示例：\n\n* 系统在特定时点的具体运行状态\
  \  \n* 网络连接信息  \n* IP（Internet Protocol）地址  \n* 正在使用的 TCP（Transmission Control Protocol）和\
  \ UDP（User Datagram Protocol）端口  \n* 正在被访问的文件  \n* 系统上正在使用的账户（可据此判断是谁在使用该系统）  \n\
  * 运行的应用程序和进程  \n* 当前活动的 Windows 注册表键  \n\n在使用 EnCase Enterprise Edition 的 **System\
  \ Snapshot (E3SS)** 时，无需将系统下线，即可在不影响正常业务操作的前提下捕获 volatile 数据。取证分析师只需运行 E3 Snapshot\
  \ 脚本即可完成采集。需要注意的是，E3 的 System Snapshot 功能本身并非新颖——市面上已有其他工具具备相同甚至更强的采集能力。这里的创新在于\
  \ Guidance Software 将该功能整合进自身工具，并提供了友好的用户界面，使得管理员更易于获取 volatile 数据。\n\n\n\n\nE3\
  \ 还内置了过滤器，使用户能够进行更详细的开放端口分析。过滤器的软件代码可以由分析员查看和修改。E3 当前版本的另一个新功能是应用程序描述符（AD）。应用程序描述符通过其哈希值对可执行文件进行分类。这使得分析员可以通过哈希值匹配来识别正在运行的可执行文件。这意味着，如果你已加载大量已知黑客工具的哈希值，你可以将正在\
  \ RAM 中运行的进程哈希值与这些已知哈希值进行比对，快速判断系统上是否运行恶意程序。请注意，应用程序描述符与 E3 另一新功能 —  — 机器配置文件（MP）协同工作。机器配置文件用于确定在给定系统上应运行的进程。两者协同使用时，MP\
  \ 与 AD 可以让分析员对比系统上应运行的进程与实际运行的进程。这非常有启发意义。\n\nE3 仍然保留系统硬盘的预览功能，以便对硬盘上的数据进行分析。这里指的是静态数据（即实际存储在硬盘上的数据，而非\
  \ RAM 中的数据）。E3 的此预览功能让分析员能够通过网络查看硬盘内容，无需坐在正被调查的机器前。\n\n日志文件解析特定于感兴趣的日志文件类型。例如，我可以指示\
  \ E3 解析常见的 UNIX 日志文件，如 cron、history 或 spooler。它了解这些日志文件的结构，因而能够快速且轻松地以纯文本格式向分析员提供所需数据。\n\
  \n以上基本涵盖了 EnCase Enterprise Edition（E3）的新功能。现在我们转向 GS 旗舰产品 —  — EnCase Forensic\
  \ Edition（EFE）第 4 版。\n\nGuidance Software 为 EFE 第 4 版开发了一套相对新的界面，与第 3 版相比有所不同。首先要提及的是，我强烈推荐将\
  \ FastBloc LE 与 EFE 一起使用。FastBloc LE 是一款硬盘成像设备，能够让分析员以远快于原生 DOS（过去约 20 年以来的常规做法）的速度安全获取硬盘镜像（最高可达三倍速度）。FastBloc\
  \ LE 绝不会损害数据完整性，且专为 EnCase 软件设计。使用 FastBloc LE，你可以在 Microsoft Windows 环境中完成取证。额外的好处是，分析员可以安全地热插拔可疑驱动器，这非常便利。\n\
  \n由于我们已经使用第 3 版 EnCase 处理过一个案例，这里的重点将放在版 4 引入的新功能上。这些新功能包括 PST 文件支持（Microsoft Outlook\
  \ 电子邮件）、增强的 EnScript 函数、UNIX 文件支持、更快的取证、改进的复合文件和元数据恢复，以及磁盘配置支持。在此之前，再次提醒 EFE（以及\
  \ NTI、AccessData、ILook 的工具）已成功在全球数千场审判和听证中作为证据被接受。这四家供应商的工具和证据如今已成为计算机取证的标准。下面我们来详细了解\
  \ EnCase 4 的新特性：\n\n* 现在可以以纯文本格式查看 PST 文件（与以往 AccessData 的 FTK 所能做的一样）。它还能够处理可压缩加密和全加密，并且可以绕过\
  \ PST 文件密码（类似于 AccessData 的 FTK）。\n\n* 通过 Unicode 与高级语言支持，分析员可以使用与嫌疑人原始信息创建语言相同的语言输入关键词（并查看搜索结果和文档）。\n\
  \n* 可以通过组合第 3 版中可创建的简单过滤器，形成更复杂的过滤器。例如，你可以轻松执行“只显示大小不超过 500K 的 GIF、创建日期在 4/16/85\
  \ 至 9/23/87 之间的文件”这样的查询。简单过滤器使用布尔逻辑组合成复杂过滤器。\n\n* 时区管理允许分析员为每个证据文件、每个卷以及每个案件指定时区设置。\n\
  \n* 可以在 EnCase 内解析 UNIX 和 Linux 二进制日志文件（utmp、utmpx、wtmp、wtmpx），无需在 EnCase 之外解码这些文件。\n\
  \n* NTFS 文件会自动被 EnCase 识别，压缩文件会自动解压以进行纯文本分析。\n\n* 分析员可以在每个 NTFS 卷上查看文件/文件夹的所有权和权限（以安全标识符\
  \ SID 显示），并且可以将这些 SID 与注册表文件关联，以确定哪个用户和组名对应于每个 SID。\n\n* EnCase 4 会自动定位已删除的 Windows\
  \ 95/98 注册表键。\n\n以上即为主要新特性。随后对多个领域进行了增强：\n\n* 一个极具价值的增强是一次性打开多个案件并便捷地在它们之间切换的能力。\n\
  \n* 过滤器界面得到大幅改进。GS 工程师将过滤器界面与 EnScript 标签页分离，从而实现更快的创建、激活和停用过滤器。\n\n* 另一个值得注意的改进是\
  \ EnScript 编程接口的提升。分析员现在可以在不运行脚本的情况下编译并保存 EnScripts，新界面更便于代码编辑，并且新增的命令使 EnScript\
  \ 程序更强大。\n\n* 关键字搜索算法得到显著增强，提供了显著的搜索速度提升。你现在可以将多词关键字搜索几乎与单词关键字搜索一样快。\n\n对于不熟悉 EnCase\
  \ 的用户，我提供一下 EnCase 版本 3 与 4 共同具备的标准功能：\n\n* EnCase 处理图 6.1 中列出的文件系统。即使 EnCase 不认识某文件系统（显示为未分配簇的未分配簇），仍可进行关键字和文件头搜索；但无法获得文件名和文件夹结构。\n\
  \n* EnScript 宏语言让分析员能够开发过滤器和程序，进一步定制 EnCase 以实现更自动化的分析。\n\n* Picture Gallery 自动识别图形文件并以缩略图形式显示。\n\
  \n* EnCase 支持将物理磁盘镜像恢复到 Windows 硬盘。\n\n* 非侵入式预览模式允许查看硬盘内容，帮助分析员决定是否值得进行取证。\n\n*\
  \ 图形时间线查看器可用。\n\n* 分析员可以查看 Windows 注册表、Outlook 电子邮件文件（含附件）以及压缩文件。\n\n* 可以按多种标准对文件进行排序。\n\
  \n* 可在搜索中使用任何数量的搜索词进行关键字搜索。\n\n* 可对任意文件、文件片段或图像进行书签，并保存以供将来参考；这些书签可自动写入正在生成的报告中。\n\
  \n\n\n\n-   [Hex/Text]查看器显示任何文件的内容，文件空闲区以红色显示。\n\n-   图形图表可按簇或扇区显示磁盘分配情况。\n\n- \
  \  你可以查看交换文件、空闲空间、打印队列文件以及回收站的内容。\n\n-   你可以识别并验证文件签名，也可以根据需要添加自己的签名。\n\n-   你可以导出文件/文件夹（或其部分）。\n\
  \n-   你可以将磁盘或卷映像恢复到另一块硬盘。\n\n*表 6.1* EnCase 处理的文件系统。\n\n| FAT12 | FAT16 | FAT32\
