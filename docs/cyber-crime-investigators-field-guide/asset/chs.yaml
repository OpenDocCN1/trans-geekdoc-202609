  [content]\n-   [Feynman's learning method](https://wiki.example.org/feynmans_learning_method)\
  \ is inspired by **Richard Feynman**, the Nobel Prize winner in physics. \n\n1.\
  \  With Feynman's skills, you can understand the knowledge points in depth in just\
  \ `20 min`, and it is memorable and *hard to forget*. \n\n```\nif (condVar > someVal)\
  \ {console.log(\"xxx\")}\n```\n\n\n\n## 目的在于保护人类免受本章讨论的技术所带来的威胁\n\n## 时间和/或金钱的捐赠者包括惠普公司、Google、Sun\
  \ Microsystems 以及各类大学教授（例如普林斯顿大学的埃里克·马西金教授），等等\n\n## “Catastrophe: Risk and Response”\n\
  \n### 由美国上诉法院法官理查德·波斯纳撰写\n\n### 表示希望在白宫内设立风险与灾难办公室\n\n综上所述，认识到形势的严重性，让我们谈谈几个事项，首先是一位名叫马克·加斯（Dr.\
  \ Mark Gasson）的个人。请注意，加斯博士在英国雷丁大学系统工程学院任教。在与学校其他同事合作后，他决定通过在自己体内植入微芯片来实验，以观察植入后的效果。\n\
  \n基于我的背景和教育，我想知道如果有人劫持该微芯片会发生什么？加斯博士会怎样？他植入在手中的微芯片让他能够访问工作场所内的各个区域，并提供对手机及其他设备的访问权限。顺便提一下，加斯博士还认为人类进化的下一步是我们一直在讨论的\
  \ transhumanism（即通过改造自身生物学来与各种机器进行接口）。\n\n加斯博士在手中植入的微芯片确实被他自己感染了电脑病毒（他自行操作以观察结果）。正如我们所讨论的，这些设备通过电磁通信相互连接，因此他所使用的其他设备也随之感染。此事促使他向\
  \ BBC 新闻发表声明，称在享受这项技术带来的好处的同时，我们也必须做好应对其带来的风险的准备。我们可以通过技术提升自我，但正如手机一样，植入体内的设备及其通信的外部设备也容易受到恶意攻击……这导致了对人类及其通信设备的安全问题。\n\
  \n加斯博士的案例不过是冰山一角。更有可能的是，针对增强人类的病毒（或其他）随后会在全球范围内迅速传播到其他 transhuman（增强人类），并扩散到它们所通信的外部设备上。这本身就可能导致全球性灾难。假如这些病毒针对的是某种脑机接口（简称\
  \ BMI 和 BCI，即 Brain‑to‑Computer Interface），并最终导致人脑被恶意分子劫持，会怎样呢？约翰·赫根（John Horgan）在\
  \ Scientific American 中指出，达尔帕（DARPA）官员正在研究“网络战斗士兵”（cyborg）的概念，即士兵能够直接在大脑中下载作战所需的复杂细节。达尔帕还在尝试远程操控敌军的大脑。我们还需记住，英特尔公司（Intel）正在建设并测试所谓的“脑通信器”（Brain\
  \ to Brain，B2B），这些芯片在俄亥俄州匹兹堡的英特尔实验室研发，如今已在其他地点投入使用。丰田以及诸如犹他大学等多所大学也在该领域涉足。\n\n正如我们为各种陆地和海洋生物进行地理标记（geotag）一样，军方及其他部门也在进行一项持续的计划，即在人体中植入微型地理标记，以便这些人可以被即时定位，并在战斗或演习过程中更容易将士兵调度到合适的位置。在情报界（IC），友方和敌方都在进行类似的地理标记，虽然目前仍属自愿，但这将随之改变。正如推动全体接种\
  \ COVID‑19 疫苗一样，强制性植入用于地理标记的要求也指日可待……为了你的安全……确保你不参与非法活动…… wink wink。当然，这些植入设备将使行政流程更加便捷，例如访问家庭、工作、电脑、手机、报税、访问银行账户等诸多功能……这也是为何许多人愿意为植入付费……但代价是个人隐私的丧失。正如我们所见，黑客以及各类情报机构会入侵你的植入设备及其通信设备，以获取你的位置信息从而进行恶意目的。因此，正如往常一样，这将带来良好与负面的双重影响。\n\
  \n射频识别（RFID）标签目前也正被与各种 GRIN/NBIC 技术相结合。大多数人不清楚 RFID 的工作原理，但基本上它利用极小的集成电路（ICs）存储和处理数据，并通过极小的天线进行无线电波（电磁能量）的传输和接收。全球范围内，大中型企业以及军方和情报机构都在使用\
  \ RFID 来追踪库存和人员，这对全球供应链的管理大有帮助。Applied Digital Solutions、VeriChip Corporation、PositiveID\
  \ Corporation（VeriChip 与 Steel Vault Corporation 合并）以及其他全球公司正在推广此类技术，用于追踪库存和人员。需注意，美国食品药品管理局（FDA）已批准其\
  \ RFID 人体植入，并且目前仍在进行中。该 RFID 植入可通过卫星实现全球人员追踪。有趣的是，部分设备的供电方式是利用人体本身的机械运动，而某些纳米级晶体管则可由人体内的电池供电。RFID\
  \ 标签可由控制器或佩戴者激活。\n\n当然，政府希望借此追踪恐怖分子，但其应用范围已扩展到其他领域。它也带来一些正面效益，例如监测患有各类医疗问题的患者、将医疗记录存储在微芯片中以便在紧急情况下随身携带等。虽然他们宣称已实施隐私保护措施，但这些措施往往与手机上的隐私保护毫无意义——它们只能防止不关心你的人知道你的位置，却仍然允许政府部门在需要时随时获取你的位置，因而保护极其有限。此外，IBM\
  \ 等公司也持有相关专利。正如 COVID‑19 疫苗被强制接种的趋势一样，也不足为奇的是立法者可能会通过法律强制实施“芯片植入”。 \n\n\n\n-   [费曼学习法](https://wiki.example.org/feynmans_learning_method)的灵感源于诺贝尔物理奖获得者**Richard\
  \ Feynman**。\n\n1.  运用费曼技巧，你只需花上`20 min`就能深入理解知识点，而且记忆深刻，*难以遗忘*。\n\n```\nif (condVar\
  \ > someVal) {console.log(\"xxx\")}\n```\n\n\n\n当我们现在将我们的 ICD/pacemaker 数据与我们的 Apple\
  \ iWatch 数据进行比较时，我们发现有时 iWatch 显示的心率应能触发 ICD/pacemaker，但医疗设备未按患者的程序需求执行相应功能。随后对\
  \ ICD/pacemaker 的电压检查显示，在本应没有波动时存在电压波动/差异。从这起医疗法医案例中得出的启示是，随着 telemedicine 的普及以及植入式无线电子医疗设备的使用增多，迫切需要具备标准数字取证、医疗设备取证**和**医疗设备工程结合技能的人员。基于这三方面的大学学位在\
  \ 21 世纪正日益增长。\n\n## Chapter 14 Memory and incident response system commands\n\n\
