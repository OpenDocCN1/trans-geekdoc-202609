  \n# 第 8 章 密码恢复\n\nDOI: [10.1201/9781003134817-8](https://doi.org/10.1201/9781003134817-8)\n\
  \n密码恢复有多种工具可供选择，您可以在 Kali Linux 及其他地方找到它们。这里我将提及来自 AccessData 的 Password Recovery\
  \ Toolkit（PRTK）（[`www.AccessData.com`](http://www.accessdata.com)）。AccessData 自\
  \ 1987 年以来一直从事密码恢复。PRTK 被执法机构和企业使用。该产品每季度更新。阅读随 PRTK 的手册（.pdf 格式）和 ReadMe 文件。安装时，插入\
  \ CD-ROM 并按照提示操作。\n\n启动产品时，您将看到密码请求。插入产品随附的磁盘软盘到磁盘驱动器中。输入产品附带的默认密码（通常为 123）。参见 Simple\
  \ Start 向导及其四个选项。选择直接转到程序并开始操作。\n\n首先，点击编辑，更改密码，并删除产品默认提供的密码。输入新的安全密码（口令短语最佳）然后点击确定。现在磁盘软盘拥有新密码。您必须记住新密码。磁盘软盘仅在首次启动程序时使用。一旦程序运行，请在会话的其余时间移除磁盘软盘。但是，每次启动程序时，您必须在磁盘驱动器中插入磁盘软盘。\n\
  \n点击“选择驱动器/文件夹”（硬盘驱动器图标）图标，选择您感兴趣的驱动器，然后点击确定。添加文件将开始。如果您获得足够的文件并希望仅使用这些文件进行操作，可以点击红色停止图标。您也可以使用此图标单独选择文件或文件夹。\n\
  \n如果您希望使用复制/粘贴将显示的文件移动到 Excel，也可以使用 Microsoft Explorer 缩小 PRTK 窗口，然后将文件从 Microsoft\
  \ Explorer 拖放到 PRTK 窗口中。执行此操作后，会弹出一个对话框。最大化 PRTK 屏幕，然后点击打印机图标右侧的图标（选择文件夹图标）。这允许您逐个添加额外文件（也可以逐个添加多个文件）。\n\
  \n随后，将使用过滤器仅获取密码保护的文件。点击“单个文件/文件夹”图标。在弹出的对话框中，向下滚动并点击密码保护文件，选择您希望 PRTK 检查的文件或文件夹，然后点击添加按钮。现在，密码保护的文件将显示在\
  \ PRTK 屏幕上。\n\nPRTK 可以显示“注册类型”列是否如实反映文件实际类型（识别类型列）。这两列的差异是快速指示两列不匹配（通常应匹配）。这表明有人试图通过给文件名一个伪装文件类型的扩展名来隐藏信息。\n\
  \n文件哈希验证可由 PRTK 执行，以发现文件是否为其所声称的文件。它可以用于显示文件或文件在某个时间段内是否被修改。\n\n\n\n\n-   [密码恢复]有三个级别：易、中、难。密码可以在**易**级别（通常几分钟内即可破解）从以下内容恢复：\n\
  \n| Lotus 123 || Organizer |\n\n| --- | --- |\n\n| Access || Outlook |\n\n| ACT\
  \ || ProWrite |\n\n| Approach || QuatroPro |\n\n| Ascend || QuickBooks |\n\n| dBase\
  \ || Quicken |\n\n| Excel || Word |\n\n| Money || WordPro |\n\n-   密码可以在**中**级别（数小时至一两天）从以下内容恢复：\n\
  \n*   Paradox\n\n*   WordPerfect\n\n-   密码恢复最困难（最难）从以下内容：\n\n*   Ami Pro\n\n*  \
  \ Excel ‘97 and 2000 PGP\n\n*   PGPDisk\n\n*   PKZip\n\n*   Word 97 and 2000\n\n\
  -   你也可以为 PRTK 提供自己的自定义词典。这是基于你对案件中涉及的受害者/攻击者的了解情况而逐案进行的。PRTK 会记住过去恢复的所有密码。输入生物数据的步骤如下：\n\
  \n1. 点击**人物**图标（生物信息）。\n\n2. 点击 **New** 并为词典命名。\n\n3. 在描述和信息下，填入相应信息，然后点击右侧的 **Insert**\
  \ 按钮。\n\n4. 点击 **OK**。此时会创建一个大的词列表。\n\n5. 点击**人物书本**图标。\n\n6. 点击 **New** 并输入配置文件名称。（配置文件是词典的列表）\n\
  \n7. 在配置文件中选择所需的词典，然后点击 **OK**。\n\n8. 点击 **Drives/Folder** 图标（点击它）。\n\n9. 选择一些文件。\n\
  \n10. 选择想要的配置文件。\n\n11. 点击 **OK**。\n\n12. 打开 **恢复属性** 对话框并开始恢复。\n\n-   **Open File**\
  \ 按钮在恢复完成后允许访问密码保护的文件。当出现密码请求按钮时，使用 **Ctrl‑V** 粘贴已恢复的密码。\n\n**Note**: 右侧底部的四个按钮为：\n\
  \n*   **Start Recovery**（开始恢复）\n\n*   **Pause/Resume Recovery**（暂停/继续恢复）\n\n*  \
  \ **Skip Recovery Level**（跳过恢复级别，不建议在正常使用中使用；仅在电源故障时使用）\n\n*   **Stop Recovery**（停止恢复）\n\
  \n我们将现在逐步介绍完整流程。首先，尽可能多地了解 perpetrators（攻击者）。查看他们的照片、书籍、房间等。其次，确定你试图获取文件的目的。然后进入\
  \ PRTK。\n\n1. 打开 **Setup Profiles** 对话框。确保配置文件信息已正确设置（取决于 perpetrator 的生物信息和案件）。点击\
  \ **OK**。\n\n2. 点击 **Biographical Information** 图标（人物）。确保你拥有所需的全部信息。点击 **OK**。\n\
  \n3. 点击 **Select Drives/Folders** 图标并选择包含需要破解文件的案件文件夹。组织很重要。点击 **OK**。\n\n-   密码恢复立即开始，如你的屏幕所示。\n\
  \n-   随着恢复进度的推进，你可以将其他文件拖放到恢复界面。PRTK 会在每个文件轮到轮流时（点击弹出的对话框 **OK** 后）开始处理该文件。（通过在\
  \ PRTK 界面选择文件、右键单击并按 **Start Recovery** 按钮，可立即开始对该文件的处理。）\n\n-   如果 PRTK 表示无法获得密码，则转到\
  \ **Distributed Network Attack (DNA)** 产品。DNA 是一个客户端/服务器产品，利用多台机器的处理能力来破解密码。这些机器必须拥有连接\
  \ Internet 的 IP 地址。DNA 使用闲置的处理周期。其他机器的用户不会察觉这些周期的使用。一个机器被设置为 **DNA Manager**，它轮询客户端并分配工作量。\n\
