  \n## 你现在坐在受害者的系统前 – 你的做法应该是什么？\n\n你正坐在客户现场的受害者系统前。系统仍在运行，但客户在你到达现场期间已将系统从网络中移除。除此之外，系统自你被联系以来一直未被触碰。请注意，这是一个基于\
  \ Intel 平台的 Microsoft Windows 10 系统。在取证界仍没有明确共识，关于是否应该从计算机系统中拔掉电源插头以确保证据保持在当前状态，还是应该让系统保持激活（两者都有风险）如你到达现场时所见。保持系统开启的好处是你可以进行实时内存分析（例如使用\
  \ Volatility），但风险在于在此期间可能发生一些会抹去有价值证据的操作，或者发生远程访问（或 USB 访问等）导致证据丢失或系统受到不利影响。另一方面，如果你关闭一个运行\
  \ BitLocker 的系统，则会自动激活 BitLocker 加密。如果该组织拥有禁用 BitLocker 加密的代码，则不成问题，但你应在关闭系统前先确认这一点（也就是说，如果你怀疑\
  \ BitLocker 可能已启用且你不确定是否有解锁代码，则在确认前不要关闭计算机系统）。我的个人偏好是，如果 BitLocker 未启用，则拔掉电源插头（有些操作系统在拔掉电源插头时会自动将内存内容写入硬盘，但不一定所有系统都如此），但如前所述，并非所有人都认同此做法。根据具体情况和环境，有时我更倾向于迅速拔掉电源插头，制作硬盘的两份比特流备份/法医镜像，然后将系统重新开机，就像从未断电一样，使用其中一份硬盘重新连接网络，看看恶意行为者是否会进一步访问并加以追踪。原始硬盘存放在安全的地方，另一份副本用于即将进行的法医分析（如果你计划在法庭上使用，则原始硬盘和副本硬盘的链条管理至关重要，你应始终像要在法庭上作案一样规划你的步骤，除非客户明确书面说明不打算上法庭，否则应尽快进行）。我工作的大多数客户并不想上法庭，他们只想知道“谁、在哪里、什么、何时、为什么、如何”，以便他们能够采取他们认为合适的行动，因此这取决于你所工作的对象。这就是为什么始终建立与客户的稳定关系很重要。你需要了解客户的思维方式，因此要推广你和你的公司，尽可能建立这些稳定的关系。即使是新客户，也有可能其中一位或多位已建立的关系对方知道你，这有助于让新客户更容易进入工作，因为新客户已经对你的工作方式和信任度有所了解。\n\
  \n## 让我们稍作停顿，看看整体网络图景\n\n现在让我们思考你需要收集的所有证据实际所在位置。这不仅仅是你正在查看的计算机系统。该计算机连接到了某种网络基础设施，该网络中的各种设备很可能包含对你有兴趣的信息。作为法医专业人员，你至少需要对法医术语、网络架构（硬件和软件）、针对该架构可能进行的恶意活动有一个高层次的了解，而且越深入了解越好。我们现在就为你提供这个高层次的了解（或者如果你已经了解，则进行回顾）。\n\
  \n## 恶意软件\n\n恶意软件本质上是专门设计用来渗透计算机网络并很可能在网络所有者不知情或未经同意的情况下损害该网络的软件。恶意软件可能采取多种形式：\n\
  \n### 病毒\n\n病毒是一种在计算机（或其他网络设备，取决于其目的）上运行的恶意代码，且该代码在未经所有者知识的情况下感染网络设备。请注意，病毒需要终端用户在计算机系统上执行某些操作才能复制并传播。病毒有多种类型：\n\
  \n#### 加密\n\n一种将其负载加密的计算机病毒，目的是使检测更加困难。\n\n#### 程序\n\n这种病毒感染 either an application\
  \ or some type of executable file（要么感染某个应用程序，要么感染某种可执行文件）。\n\n#### 引导扇区\n\n存储在硬盘的第一个扇区中，并在计算机启动时加载到内存（RAM）中。\n\
  \n#### 多部分\n\n这种病毒会同时附着在引导扇区和系统文件上，然后移动到计算机系统上的其他文件进行感染。\n\n#### 宏\n\n\n\n\n病毒已嵌入到某种文档中（例如\
  \ Microsoft Excel 或 Word 文件），当最终用户打开文档时病毒会被执行。\n\n#### Stealth\n\n一种隐蔽病毒，攻击操作系统进程并阻止常规防病毒软件扫描。这些病毒潜伏在分区、文件和引导区，擅长有意规避扫描器的检测。\n\
  \n#### Hoax\n\n一封电子邮件（例如）警告不存在的病毒，并敦促收件人转发警告信息。当然，这会在“病毒式”传播时占用宝贵的网络带宽。\n\n####\
  \ Polymorphic\n\n这是标准加密病毒的增强形式。为规避检测，它每次执行时都会改变自身，更改解密模块。\n\n#### Armored\n\n该病毒拥有一层“保护层”，用于混淆试图分析其工作原理的个人或程序。\n\
  \n#### Metamorphic\n\n这是标准 polymorphic 病毒的增强形式。它能在感染文件之前完全重写自身。\n\n#### Worm\n\n\
  与病毒类似，但它可以自行复制（无需用户交互），并可能非常具有破坏性。例如，Conficker 蠕虫感染了数百万台计算机。\n\n#### Trojan horse\n\
  \n看似在做用户想要的事，但实际上是恶意的，并在后台执行用户不知情的活动。最常见的 Trojan 是 RAT（远程访问 Trojan），其目的是在用户不知情或未授权的情况下，让恶意分子远程控制你的计算机系统。\n\
  \n#### Ransomware\n\n越来越流行且危险（已严重影响医院、交通系统、学校、政府等。2018 年的 SamSam 已给乔治亚州亚特兰大市造成至少\
  \ 1500 万美元的损失，因为他们拒绝支付赎金）。这种恶意软件在受害者未支付赎金前阻止其访问数据（通常通过比特币支付）。即使支付赎金，也无法保证数据会被释放，或支付后不会在你的网络中攻击另一台计算机。支付可能也是非法的，如果你实际上在向恐怖分子或\
  \ FBI  watchlist 上的其他恶意实体提供资金时，你可能会被罚款甚至监禁。本质上，这种攻击利用你所使用的某些软件的漏洞来获取系统访问权限，并随后加密你的数据。防范此类攻击的最佳措施是始终保持计算机系统的最新备份。\n\
  \n#### Spyware\n\n隐蔽地在未经用户知识或同意的情况下收集用户或系统信息。键盘记录器是一个典型例子，它捕获受害者的按键并可以拍摄电脑屏幕，然后将其发送给攻击者。Adware\
  \ 是另一种 spyware，它会跟踪你的上网活动，然后向你投放广告以诱导购买产品（有时归类为“灰色软件”）。\n\n#### Rootkit\n\n这是最危险的一种，针对计算机系统的内核或引导加载程序。它设计用来隐藏自身并以管理员权限控制你的计算机系统而不被检测。因此，其他人控制你的计算机系统，且常规防病毒扫描无法发现。根包装程序常使用\
  \ DLL 注入（在运行时将恶意代码注入已加载的动态链接库，使其在系统重启后仍能持久化），以及恶意使用设备驱动程序。\n\n#### Spam\n\n大家都明白这是什么以及它有多烦人。其最常见的传播渠道是电子邮件。垃圾邮件发送者常利用开放的中继服务大规模发送信息，这本质上是一种滥用机制。\n\
  \n## 网络设备\n\n*   **Data Loss Prevention (DLP)**  \n    *   DLP 设备对数据在静止、传输和使用时进行实时监控，以检测数据盗取尝试。硬件和软件\
  \ DLP 解决方案均有。网络 DLP 系统可以是硬件或软件，部署在网络边界进行传输数据检测。云 DLP 系统是 SaaS（软件即服务），用于保护存储在云环境中的数据。端点\
  \ DLP 系统是软件客户端，用于监控计算机系统中正在使用的数据，可阻止文件传输或向管理员、数据所有者等发出警报。存储 DLP 系统是安装在数据中心服务器上的软件，用于检查静止数据。\n\
  \n*   **Firewall**  \n    *   防御系统免受不良网络流量的侵害。  \n    *   可基于主机或网络。  \n    *   可为软件或硬件。\n\
  \n*   **Intrusion Detection System (IDS)**  \n\n\n\n-   [硬件设备或软件应用程序](https://wiki.example.org/feynmans_learning_method)可监控特定系统或整个网络。当网络流量进入它时，实时进行数据分析以确定流量是否具有恶意性质。存在基于主机的\
  \ IDS（HIDS）和基于网络的 IDS（NIDS）。请注意，IDS 只能生成警报并记录可疑活动。请记住，您可以使用这些日志（以及网络上其他设备的日志）在攻击发生后重新创建网络上的事件（这有助于您理解攻击后发生了什么）。\n\
  \n-   入侵预防系统（IPS）\n\n    *   与 IDS 类似，IPS 不仅能警报和记录，还能对恶意网络流量采取行动，例如阻止流量继续进入网络基础设施。\n\
  \n## Microsoft Windows 操作系统和文件系统类型\n\n-   已分配存储空间\n\n    *   这是驱动器卷上存储文件的位置。\n\n\
  -   ASCII\n\n    *   美国信息交换代码（ASCII）是一种用于电子通信的字符编码标准。ASCII 代码表示计算机、电信设备和各种其他设备中的文本。\n\
  \n-   坏扇区\n\n    *   这是磁盘上不再能存储数据的位置。有很多原因会导致这种情况发生。\n\n-   Bit\n\n    *   Bit 只能是\
  \ 0（0 = 负电荷）或 1（1 = 正电荷）。\n\n-   位流备份\n\n    *   也称为取证图像。此过程会捕获硬盘上每一位（使用特定工具完成）。\n\
  \n-   Byte\n\n    *   由 8 位组成。如今，这通常被视为最小可寻址的存储单元，但某些旧型计算机系统具有 4 位可寻址的存储单元，具体取决于所在国家/地区。此外，一些从事电子设计的人会使用\
  \ 4 位的集成电路（Integrated Circuits），如果这些设备连接到您要检查的计算机，则在分析时需要考虑这一点。\n\n-   Cluster\n\
  \n    *   这是磁盘上一个逻辑存储单元，由连续的扇区组成。\n\n-   FAT12\n\n    *   不加密。\n\n    *   与 NTFS\
  \ 文件系统相比，元数据的价值较低。\n\n-   文件扩展名\n\n    *   这是完整文件名中跟在“点号”后的字母集合。例如，现代 Microsoft\
  \ Excel 文件名可能是 account-1.xlsx，其中文件扩展名是“xlsx”。这可能会产生误导，因为恶意行为者可能会在文件名上放置错误扩展名，让您误以为它是\
  \ Excel 文件，而实际上是可执行文件（.exe）。实际上，真正决定文件类型的是文件头。注意，Microsoft 文件资源管理器可能根本不会显示文件，如果文件扩展名与文件头显示的真实类型不匹配。\n\
  \n-   文件剩余空间\n\n    *   如果文件大小为 2400 字节（2.4 千字节 = 2.4 KB），而扇区大小为 512 字节，则需要 5 个扇区（2400\
  \ 字节/512 字节 = 4.7，向上取整为 5.0）来存储整个 2400 字节文件。剩余 153.6 字节（5.0 – 4.7 = 0.3 => 0.3 ×\
  \ 512 = 153.6 字节），这就是所谓的文件剩余空间。文件剩余空间是最后一个扇区中未使用的剩余字节。文件剩余空间很重要，因为数据可以隐藏在此处。这里逻辑文件大小为\
  \ 2400 字节（在 Microsoft 文件资源管理器中显示的大小），而物理文件大小为 2560 字节（512 × 5，即 5 个 512 字节的扇区，总计\
  \ 2560 字节）。\n\n-   Hiberfil.sys\n\n    *   包含随机存取存储器（RAM）内容的副本，当计算机进入 hibernate\
  \ 模式时会保存到硬盘。计算机启动时，Hiberfil.sys 的内容会重新加载到 RAM 内存中。\n\n-   NTFS\n\n    *   可能具有强加密功能。\n\
  \n-   操作系统\n\n    *   用于控制/管理计算机硬件及相关系统资源的程序。\n\n-   Pagefile.sys\n\n    *   保存从\
  \ RAM 到硬盘交换出的数据帧。这里可能包含大量有趣的信息供分析。交换文件本质上是 Microsoft Windows 用作 RAM 的硬盘区域。\n\n-\
  \   分区\n\n    *   一个逻辑存储区域。\n\n-   预取文件\n\n    *   这些文件包含有关应用程序的信息，例如它被运行的次数和运行时间。Microsoft\
  \ 声称预取文件可提升应用程序启动性能，但从取证调查员的角度来看，预取文件可以用于确定哪些应用程序被运行以及具体何时运行。这些信息可以发现系统所有者或管理员为仅仅删除证据而安装和运行的程序。\n\
  \n-   RAM\n\n    *   随机存取存储器。\n\n-   注册表\n\n    *   记录系统配置更改。\n\n-   扇区\n\n    *\
  \   磁盘上的磁性硬盘扇区大小可包括 512 字节、2048 字节、4096 字节及其他尺寸。\n\n-   轨道\n\n    *   想象一条橡皮筋缠绕在磁盘上，这能帮助您理解轨道的概念，轨道包含存储数据的扇区。\n\
  \n-   未分配存储空间（USS）\n\n    *   当您从计算机删除文件时，它在物理上仍然存在于驱动器卷上，但该存储空间现在可被另一个文件覆盖，USS\
  \ 当然可以用于在驱动器卷上创建新分区。\n\n-   Unicode\n\n    *   这是一种增强的 ASCII 版本，是一项国际编码标准，支持全球更多语言（以及其他内容）。\n\
  \n## 获取硬盘位流备份的详细步骤\n\n由于阅读此书的部分人对取证工作感兴趣，且市面上有许多工具，您应从工具角度着手，以提升在该领域的工作机会。以下是主要组织（美国及全球）广泛使用的九种取证工具清单：\n\
  \n1.  `Kali Linux` (`Sleuth Kit` 等)\n\n2.  `EnCase`\n\n3.  `AccessData’s FTK`\n\n\
  4.  `X-Ways Forensics`\n\n5.  `Paraben`\n\n6.  `Cellebrite`\n\n7.  `Magnet Axiom`（以及用于快速分析的\
  \ `Ignite`）\n\n8.  `Volatility`\n\n9.  `DD` (`Linux/Unix`)\n\n### `Kali Linux`\n\
  \n`Kali Linux` 可用于渗透测试，也可作为实时响应取证工具，因为它包含众多对完整取证调查至关重要的工具。在从 CD/DVD 或 USB 启动时，取证调查员可以从多个选项中选择，例如\
  \ Live（取证模式），保持证据驱动器不变（自动挂载其他存储介质已被禁用），这保证了原始证据的完整性。请注意，此模式下 `Kali` 防止向交换文件写入数据（最近存储在内存中的重要数据可能会出现在该文件中）。`Kali\
  \ Linux` 菜单如下：\n\n![](img/inline3.1.jpg)\n\n`Kali` 的取证部分提供以下功能（同时也有命令行工具可供使用），我们将在本书后续章节中进一步讨论：\n\
  \n![](img/inline3.2.jpg)\n\n\n\n我会指出，如果你担心你的取证工作在你所在的任何国家的法院上被接受，那么你需要遵循 Interpol\
  \ 在本文档中规定的实验室设置程序：“全球数字取证实验室指南”。目前，全球许多国家都在使用其他方法，但如前所述，如果你希望你的工作在你所在的任何国家的法院上被接受，则必须遵循本\
  \ Interpol 文档。此外，我们还需要关注 NIST（国家标准技术研究所）CFTT（计算机取证工具测试）计划。这个全球公开数据库提供了取证工具的测试结果，如果你要在法庭上作证，就需要确保你使用的是\
  \ NIST 给出了正面测试结果的工具。你可以在以下网址使用该数据库：\n\n*   [`www.nist.gov/itl/ssd/software-quality-group/computer-forensics-tool-testing-program-cftt/cftt-technical/disk`](https://www.nist.gov)\n\
  \n以及以下网址获取更多信息：\n\n*   [`www.dhs.gov/science-and-technology/nist-cftt-reports`](https://www.dhs.gov)\n\
  \n有时，为了验证目的，使用多于一个工具来发现相同的证据也是个好主意。Kali 为我们提供了实现这一点的能力。\n\n不过，事情并非全然顺利。目前也有大量工具可用于阻碍取证调查。以下是其中一些：\n\
  \n*   新型固态硬盘（SSD）比磁盘驱动器更擅长于数据删除\n\n*   Tor Browser\n\n*   加密\n\n    *   PGP\n\n\
  \    *   TrueCrypt\n\n    *   BitLocker\n\n    *   VeraCrypt … 举几例而已\n\n*   全球各地咖啡店（及类似场所）的匿名互联网接入\n\
  \n*   VPNs\n\n    *   全球有许多 VPN 提供商，他们要么不配合执法机构，要么因当地法律不必配合执法机构\n\n    *   许多提供商不保存日志，或者只保存极短时间（许多少于一个月）的日志\n\
  \n现在我们回到 Kali Linux 的关注点。还有其他书籍、视频等可以提供 Kali 的下载和安装细节，但这本书的重点不是这些，我只挑几个要点说明。\n\n\
  你可以从以下网址下载 Kali：\n\n[`www.kali.org/downloads/`](https://www.kali.org)\n\n这将提供你可以用于安装和设置\
  \ Kali 的 ISO 镜像。如果你没有单独的机器来安装 Kali，你可以使用 VirtualBox 等工具在虚拟机中运行 Kali。你可以使用 Rufus\
  \ 或 UNetbootin 等软件将 Kali 安装到各种可移动存储介质，如 U 盘、外部硬盘或 SD 卡上。VirtualBox 可从以下网址获取：\n\n\
  [`www.virtualbox.org/wiki/Downloads`](https://www.virtualbox.org)\n\n除了笔记本电脑或台式机，你还应该在\
  \ SD 卡或 U 盘上安装 Kali，以便在调查过程中使用。你可以使用 UNetbootin（[`unetbootin.github.io/`](http://unetbootin.github.io)）或\
  \ Rufus（[`rufus.ie/`](https://rufus.ie)）来实现这一点。虽然还有其他选择，但这两者足以应付。\n\n在获取硬盘的取证镜像（比特流备份/复制）之前，请务必使用写保护器，以防止在操作过程中污染正在获取的驱动器。\n\
  \n具体情况和工作环境不同，但如果可能，我更倾向于使用 Digital Intelligence 的 FRED 取证工作站：\n\n*   [`digitalintelligence.com/store/products/fred`](https://digitalintelligence.com)\n\
  \n同时，我也更倾向于使用 Digital Intelligence 的 UltraKit：\n\n*   [`digitalintelligence.com/store/products/w3008`](https://digitalintelligence.com)\n\
  \n    *   包含写保护器、适配器、连接器等，可根据需要进行定制\n\n在取证时，我们可能需要向相关方证明证据未被篡改，例如通过计算证据的哈希值。以下是一个示例，使用\
  \ md5sum 命令：\n\n*   `md5sum <path/drive>`\n\n*   `md5sum /dev/sda`\n\n首先，我们来看看几十年已经存在且全球可用的工具。你可以选择使用\
  \ SafeBack 或 EnCase 来获取比特流备份。在本例中，你选择了 SafeBack。你查看系统背面，发现有并行端口但没有 SCSI（Small Computer\
  \ Systems Interface）端口。如果能使用 SCSI 连接而不是并行端口，那么硬盘的比特流备份将花费更少的时间。因此，你也需要安装 SCSI 卡到受害系统上。（我总是把一张\
  \ SCSI 卡作为标准工具包的一部分随身携带。）以下是具体步骤：\n\n1.  从电脑背面拔掉电源插头（不是从墙壁拔）。\n\n2.  小心查找潜在的布防装置（虽然不太可能，但有可能），当你打开电脑外壳时，仔细观察内部是否有异常情况。拔掉硬盘的电源插头，防止它们意外启动。\n\
  \n3.  选择一张 SCSI 卡。我偏好的用于 Microsoft Windows 系统且具有 PCI 总线的 SCSI 卡是 Adaptec 19160，因为其高性能和可靠性。Adaptec\
  \ 19160 附带 EZ-SCSI 软件，驱动程序更新可通过 Internet 自动获取。Adaptec 会对其卡进行数百种 SCSI 系统的测试。我使用过的\
  \ Adaptec 卡从未出现过问题，因此强烈推荐它们。该卡提供五年保修，并在两年内提供免费技术支持（如果我需要帮助配置等）。\n\n4.  将 SCSI 卡安装到受害系统中开放的\
  \ 32 位 PCI 扩展插槽中。阅读随卡附带的小手册。取下一块通常为银色的扩展插槽盖。小心处理卡片，它包装在防静电袋中。在处理卡片前，请通过触摸接地的金属物体（如插电的电脑背面）来放电，以避免静电损坏卡片。PCI\
  \ 扩展插槽通常为白色或象牙色。当卡片卡入到位（可能需要用力按下）后，使用之前取下的插槽盖螺丝将卡片固定住。\n\n5.  将系统电源线重新插回电脑背面。\n\n\
  6.  插入 DOS 启动磁盘并开机。我稍后会说明这个启动磁盘。该启动磁盘是插入目标系统 A: 驱动器的磁盘（注意：启动介质也可以是 CD-ROM、Jaz 或\
  \ Zip 磁盘，具体取决于你在目标系统上拥有的设备）。我稍后会说明启动磁盘的内容。\n\n7.  开机后，按正确的键进入 CMOS BIOS 区域。有些系统的屏幕上会显示需要按的键。如果没有，一些常见的进入\
  \ CMOS BIOS 区域的键包括：\n\n    *   Dell 计算机          F12\n\n    *   Compaq          F10\n\
  \n    *   IBM            F1\n\n    *   PC 克隆机         Delete, Ctrl-Alt-Esc, Ctrl-Alt-Enter\n\
  \n8.  在 CMOS 设置中，确保计算机首先从磁盘启动。在 CMOS BIOS 设置中，记录时间并与你的手表时间进行比较。记录任何差异，以便以后参考。如果需要，也可以在开始取证（比特流备份）之前使用\
  \ NTI 取证工具“gettime”来获取时间。\n\n9.  退出 CMOS BIOS 例程并保存更改。\n\n\n\n10. 让计算机现在继续从磁盘启动。现在你知道系统会先从你的磁盘启动，而不会从系统硬盘启动。\n\
  \n11. 关闭计算机，拔下计算机背面的电源线，并重新连接硬盘电源线。\n\n12. 将计算机外壳装回，并将电源线重新插回计算机。此时不要重新开机。\n\n13.\
  \ 选择一种介质来备份受害者的硬盘。本例中，我将使用 Ecrix VXA-1 磁带驱动器。（我强烈推荐此磁带备份单元。通过访问 [`www.ecrix.com`](http://www.ecrix.com)\
  \ 了解更多关于该磁带驱动器的信息。每卷 Ecrix 磁带可容纳最高 66 GB 的数据，最大数据传输速率约为 6 MB/sec。）\n\n14. 在 Ecrix\
  \ 磁带驱动器的下部 SCSI 连接处放置一个 SCSI 终止器。确保没有 SCSI ID 冲突。（阅读随 Ecrix 磁带驱动器和 Adaptec SCSI\
  \ 卡一起提供的简短手册以获取更多信息。你可能不需要做任何操作，但为了保险起见请先阅读它们。）\n\n15. 将 50 针 SCSI 线从 Ecrix 磁带驱动器背面连接到受害系统背面的\
  \ Adaptec SCSI 卡外部连接器上。\n\n在对标准 SCSI 设置进行以下修改后，Ecrix VXA-1 与 SafeBack 兼容性极佳。请在实际指示你使用启动磁盘引导系统之前，先完成以下步骤：\n\
  \n1. 系统启动后，等待出现 “Press Ctrl-A for SCSI Setup” 提示，然后按 **Ctrl‑A**。\n\n2. 当 SCSI 设置菜单出现时，选择\
  \ “Configure/View Host Adapter Settings”。\n\n3. 接着选择 “SCSI Device Configuration”。\n\
  \n4. 将 “Initiate Sync Negotiation” 设置为 **NO**（针对所有 SCSI ID）。\n\n5. 将 “Maximum Sync\
  \ Transfer Rate” 设置为 **10.0**（针对所有 ID）。\n\n6. 将 “Enable Disconnection” 设置为 **NO**（针对所有\
  \ ID）。\n\n7. 按 “Esc” 并保存所有更改。\n\n我将使用的启动磁盘需要包含一些基本的 DOS 命令、Ecrix 和 Adaptec 软件驱动、SafeBack\
  \ 的 master.exe 程序以及若干其他取证工具。我正在制作的 DOS 启动磁盘同样适用于 Jaz 驱动器、Zip 驱动器（以及我正在使用的 Ecrix\
  \ 磁带驱动器）。创建 DOS 启动磁盘（在前往客户现场之前应已完成）：\n\n1. 将磁盘插入受信任系统的 A: 驱动器，在 DOS 命令行提示符下输入 `format\
  \ a:/s`（不要加引号）进行格式化。\n\n2. 格式化完成后，将以下文件加载到磁盘中：\n\n   - config.sys, autoexec.bat,\
  \ master.exe, aspi8u2.sys, guest.ini, himem.sys, fdisk.exe,\n   - format.com, smartdrv.exe,\
  \ restpart.exe, aspiatap.sys, aspippm2.sys, advaspi.sys,\n   - aspicd.sys, aspippml.sys,\
  \ guest.exe, aspil6l6.sys, nibble2.ilm, nibble.ilm,\n   - aspiide.sys, aspi8dos.sys,\
  \ drvspace.bin, driver.sys., crcmd5.exe, disksig.exe,\n   - doc.exe, filelist.exe,\
  \ getfree.exe, getslack.exe, getswap.exe, gettime.exe。\n\n   其中部分文件并非必需，但我过去发现它们对操作很有帮助，所以全部包含。这些文件的来源：DOS\
  \ 命令/驱动可从受信任机器的 `c:\\\\windows` 与 `c:\\\\windows\\\\command` 目录获得；驱动文件和部分可执行文件可从随\
  \ Adaptec SCSI 卡提供的介质、Ecrix 与 Iomega 产品介质，或其各自网站获取。上述 autoexec.bat 文件应包含以下语句：\n\n\
  \        smartdrv\n\n   config.sys 文件应包含以下语句：\n\n        files=30  \n        buffers=8\
  \  \n        lastdrive=z  \n        dos=high,umb  \n        device==himem.sys  \n\
  \        device=aspi8u2.sys/D\n\n3. 现在将启动磁盘（确保它不含病毒）插入受害机器，开机并观察屏幕上的系统提示。\n\n  \
  \ 1. a. 系统启动后，等待出现 “Press Ctrl-A for SCSI Setup” 提示，然后按 **Ctrl‑A**。\n\n   2. b.\
  \ 当 SCSI 设置菜单出现时，选择 “Configure/View Host Adapter Settings”。\n\n   3. c. 接着选择 “SCSI\
  \ Device Configuration”。\n\n   4. d. 将 “Initiate Sync Negotiation” 设置为 **NO**（针对所有\
  \ SCSI ID）。\n\n   5. e. 将 “Maximum Sync Transfer Rate” 设置为 **10.0**（针对所有 ID）。\n\n\
  \   6. f. 将 “Enable Disconnection” 设置为 **NO**（针对所有 ID）。\n\n   7. g. 按 “Esc” 并保存所有更改。\n\
  \n   8. h. 让系统继续启动到 DOS 提示符。\n\n4. 启动 SafeBack（运行磁盘中 master.exe 程序）。\n\n5. 输入审计文件名。（不能是你将证据保存的位置。）\n\
  \n6. 在 SafeBack 中选择以下设置：\n\n   Backup、Local、No Direct Access、Auto for XBIOS use、Auto\
  \ adjust partitions、  \n   Yes to Backfill on restore、No to compress sector data。\n\
  \n7. 使用方向键、空格键和相应字母选择要备份的内容，然后按 <Enter> 完成选择。\n\n8. 输入将保存备份映像的文件名。\n\n9. 按照提示继续操作。\n\
  \n10. 输入用于评论记录的文本。包括案件、机器以及异常项或程序的信息。\n\n11. 完成文本评论记录后按 “Esc”。位流备份即开始进行。\n\n当备份完成后，按\
  \ “Esc” 返回正确的界面，并对刚才创建的证据文件执行验证操作。离开客户现场前，务必立即复制磁盘/磁带。不要将复制的备份磁带放在同一容器中。按照 DCFL\
  \ 指南（[`www.dcfl.gov`](http://www.dcfl.gov)）将一份送至实验室，另一份携带至你的分析实验室。\n\n务必运行 NTI 的\
  \ DiskSig，获取受害硬盘的 CRC 校验和 MD5 校验和。详见 DiskSig 章节的说明，过程时间取决于硬盘大小。\n\n制作位流备份需要数小时。在此期间你应做什么？\n\
  \n首先，确保在备份进行期间磁盘镜像的安全性。只要它安全，就与网络基础设施专家讨论网络拓扑图。如果可能，实地走访基础设施。沿着从受害系统到端口、交换机、路由器、集线器的线路一路追踪，直至系统的连接点。客户现场的系统/基础设施专家会帮助你从相关防火墙、路由器、交换机等处收集日志信息。\n\
  \n始终保持所有收集证据的链条管理，并将证据存放在受控访问的安全区域内。\n\nChapter 4 将介绍行业广泛使用的各类取证与分析工具的详细信息，主要包括\
  \ Guidance Software（[`www.guidancesoftware.com`](http://www.guidancesoftware.com)）和\
  \ NTI（[http://www.forensics-intl.com](http://www.forensics-intl.com））的工具。NTI 的取证工具基于\
  \ DOS，已被执法机构和私人公司长期使用，并在法庭上得到充分验证。相反，Guidance Software 的 EnCase 相对较新。EnCase 的取证基于\
  \ DOS（尽管其预览模式可在 Microsoft Windows 中查看硬盘，以便在启动 DOS 取证前进行），但其分析工具运行于 Microsoft Windows\
  \ 环境（即一系列在 Windows 下的工具，简化分析过程）。\n\n* 1\\. 陈述 Locard’s Exchange Principle（劳卡德交换原则）。\n\
  \n* 2\\. 哪个网站可以查阅在法庭上被认可的计算机搜查与扣押指南？这里适用的宪法修正案是什么？\n\n* 3\\. 按顺序列出 FBI 使用的六种调查技术。\n\
  \n\n\n4. 可以使用哪些工具获取计算机硬盘的比特流备份？\n\n## Chapter 4 Evidence collection and analysis\
  \ tools\n\nDOI: [10.1201/9781003134817-4](https://doi.org/10.1201/9781003134817-4)\n\
  \n许多证据收集和分析工具可供商业使用。本章提供了几种可靠工具的描述。我仍在维护一些较旧的工具，因为它们在世界各地的多个位置仍在使用。\n\n## SafeBack\n\
  \n*   *New Technologies, Inc.*\n\n*   *[`www.Forensics-Intl.com`](http://www.forensics-intl.com)*\n\
  \n在您首次到达客户现场时，获取受损系统的比特流备份。比特流备份与常规复制操作不同。在复制操作中，您仅仅是将文件从一种介质（例如硬盘）复制到另一种介质（如磁带驱动器、Jaz\
  \ 驱动器等）。执行硬盘比特流备份时，您是获取硬盘的比特级复制，而非仅复制文件。硬盘上的每一个比特都会传输到您的备份介质（另一块硬盘、Zip 驱动器、Jaz 驱动器、磁带）。如果您感到惊讶地发现硬盘上存在隐藏数据（即硬盘上不只是您所见的文件名，还有更多内容），那么您即将进入一个新世界——网络取证调查员（CFI）的世界。\n\
  \n使用 SafeBack 与 Iomega Zip 驱动器配合的操作步骤如下。同样，此过程也可用于 Jaz 驱动器、磁带驱动器等。但您需要在启动盘上加载不同的驱动程序（软件模块）。\n\
  \n首先创建一个启动盘。为此，在您正在使用的计算机的软盘驱动器中插入一张软盘，然后执行以下步骤（co = 单击一次左键鼠标；dc = 左键双击；m = 将鼠标指针移动到）：\n\
  \n co Start\n\n m Programs\n\n co MS-DOS Programs\n\n 现在您看到：c: \\\\（或类似内容）。\n\n\
   现在输入命令：format a: / s。\n\n按照提示进行操作。（不需要标签，但如果在询问时希望给出标签，可以这样做。）\n\n现在一张已格式化的软盘已准备就绪。从您的\
  \ NTI SafeBack 软盘中，将以下文件复制到已格式化的软盘中：\n\n Master.exe\n\n Respart.exe\n\n从 Iomega\
  \ Zip 驱动器的 CD-ROM 中，将以下文件复制到已格式化的软盘中：\n\n advaspi.sys\n\n aspil616.sys\n\n aspi8dos.sys\n\
  \n aspiatap.sys\n\n aspiide.sys\n\n aspippml.sys\n\n aspippm2.sys\n\n nibble.ilm\n\
  \n nibble2.ilm\n\n guest.exe\n\n guest.ini\n\n guesthlp.txt\n\n smartdrv.exe\n\n\
  在已格式化的软盘上，设置 autoexec.bat 文件（c: \\\\edit a: \\\\ autoexec.bat <enter>），内容如下：\n\n\
   smartdrv.exe\n\n doskey\n\n guest\n\n保存文件（Alt-F-S）；退出程序（Alt-F-X）。\n\n关闭计算机，并通过\
  \ SCSI 或并行连接（取决于您拥有的类型）连接 Zip 驱动器。为 Zip 驱动器接通电源。\n\n在计算机的软盘驱动器中插入软盘，然后开机。计算机将从软盘启动并显示一些初始启动信息。启动完成后，屏幕上应出现一条消息，指示已为\
  \ Zip 驱动器分配了哪个字母驱动器。我假设分配的驱动器字母是 D。如果您的驱动器字母不同，请将 d: 替换为您的分配字母。\n\n现在从 A: 驱动器中的软盘运行\
  \ SafeBack。输入以下命令：\n\n a: <enter>\n\n master <enter>\n\n**请记住**：如果在出现的任何屏幕上需要额外帮助，请按\
  \ FI 键，系统将提供该屏幕相关的更多信息。\n\n您首先会被要求输入要写入审计数据的文件名。您可以选择任何名称，但最好选择与客户现场和您正在备份的计算机相关的有意义的名称。输入完名称后按\
  \ <enter> 即可进入下一屏。\n\n请注意，这里有多个选择需要做出。再次，使用 FI 键了解每个选择的更多信息。使用方向键在各行之间移动并进行选择。红色背景表示当前选中的选项。当您在每一行上完成选择后，请不要按\
  \ <enter>；使用下方向键移动到下一行并继续选择。请做出以下选择：\n\n*   功能：备份\n\n*   远程：本地\n\n*   直接访问：否\n\n\
  *   使用 XBIOS：自动\n\n*   调整分区：自动\n\n*   还原时回填：是\n\n*   压缩扇区数据：否\n\n*   然后按 <enter>。\n\
  \n这将转到驱动器/卷选择屏幕。按 FI 键获取有关该屏幕的更多信息。选择您希望备份到 Zip 驱动器的驱动器/卷。查看图例，了解应按哪些键进行选择。选择后，按\
  \ <enter> 移动到下一屏。\n\n您现在被要求输入将包含您正在备份的驱动器/卷镜像文件的名称。使用对您有意义的名称。完成后按 <enter> 进入下一屏。\n\
  \n您现在被要求输入文本评论。按 FI 获取更多信息。完成评论后，按 Esc（而非 <enter>）退出。SafeBack 开始执行备份过程。根据正在备份的驱动器/卷大小，在特定间隔可能会提示您插入额外的\
  \ Zip 磁盘。在出现请求时进行插入，并妥善标记磁盘以避免混淆。\n\n当备份过程完成后，使用 SafeBack 的“验证”选项（而不是您第一次选择的备份选项）验证备份是否无误。验证通过后，对\
  \ Zip 磁盘进行额外复制。一个副本是您的证据副本，将安全存放以维护适当的链条保管；另一个副本是您的工作副本，用于后续使用其他 CF 分析工具。\n\n现在，使用“还原”功能（与之前使用的“备份”功能不同）将您制作的\
  \ Zip 备份还原到另一台计算机（分析计算机 AC）的硬盘上。使用相同的方式连接 Zip 驱动器到分析计算机（AC），启动 AC 并使用启动软盘引导。启动完成后，按照相同的\
  \ SafeBack 启动流程（Master <enter>），但此次选择“还原”功能并遵循提示操作。如需帮助，请使用 FI 键。\n\n现在，SafeBack\
  \ 图像文件已恢复到 AC 上。接下来，我将介绍其他 CF 工具以进行分析。\n\n## GetTime\n\n*   *New Technologies, Inc.*\n\
  \n*   *[`www.Forensics-Intl.com`](http://www.forensics-intl.com)*\n\nGetTime 用于通过读取受害者计算机系统的\
  \ CMOS 读取日期和时间设置，以记录受害者计算机的时间和日期。在处理计算机证据之前，请执行此操作。将 CMOS 中的日期/时间与您手表或其他计时设备上的当前时间进行比对。请在处理计算机证据之前完成此步骤。\n\
  \n运行 GetTime 的步骤如下：\n\n gettime <enter>\n\n执行此操作后，会生成一个名为 STM-1010.001 的文本文件。请将此文档打印出来（或在\
  \ Microsoft Word 等文本编辑器中打开查看），并填写您使用的计时设备（如手表、时钟等）上的日期和时间。\n\n## FileList, FileCnvt,\
  \ and Excel\n\n*   *New Technologies, Inc.*\n\n*   *[`www.Forensics-Intl.com`](http://www.forensics-intl.com)*\n\
  \n在您将比特流备份恢复到分析计算机（AC）的 C 驱动器后，使用 FileList 对磁盘内容进行目录 catalog。FileCnvt 和 Excel 用于正确读取\
  \ FileList 程序的输出。\n\n首先在 DOS 提示符处单独输入 FileList：\n\n filelist <enter>\n\n这将显示该程序的语法。花一些时间研究所示的命令语法。我不会在我们的示例中使用所有提供的选项。\n\
  \n filelist/m/d a:\\\\DriveC C: <enter>\n\n\n\nThe above statement will catalog\
  \ the contents of `c:` , perform an MD5 computation on those contents (`/m`), contain\
  \ only deleted files from drive C (`/d`), and place the results in the file `a:\\\
  \\DriveC`.\n\nNow do the following:\n\n `dir/od a:` <enter>\n\nNote the files `DriveC.L0l`\
  \ and `DriveC.L99`. Because `DriveC.L99` is zero bytes in length (column 4 in the\
  \ DOS window), delete it with the command:\n\n `a:\\\\del DriveC.L99` <enter>\n\n\
  This leaves the `DriveC.L01` file. This file contains your cataloged data of drive\
  \ C. This file cannot be used directly. Run `FileCnvt` first. With both `FileCnvt`\
  \ and `DriveC.L01` in the same directory, type the following:\n\n `filecnvt` <enter>\n\
  \nIf more than one file is shown, choose `DriveC.L01` with the arrow keys and press\
  \ <enter>. You are asked to enter a unique name to describe the computer or client\
  \ you are working with. Enter a name of your choice and press <enter>. You are told\
  \ that `DriveC.dbf` (a database file) has now been created. Clear the computer screen\
  \ using the command:\n\n `cls` <enter>\n\nNow run Microsoft Excel. (You may use\
  \ any other program that reads `.dbf` files. I will assume you are using Excel.)\
  \ Open the `DriveC.L01` file. You will see three columns of information. Column\
  \ 3 provides the filenames of the deleted files (because you chose to use the `/d`\
  \ option).\n\nTo see the difference, now run `FileList` without the `/d` option:\n\
  \n `filelist a:\\\\DriveC c:` <enter>\n\n `fileenvt` <enter>\n\nLook at the results\
  \ in Excel.\n\nYou now have a spreadsheet that can be sorted and analyzed using\
  \ standard Excel commands. Using `FileList`, it is simple to review the chronology\
  \ of usage on a computer hard drive, several computer hard drives, or an assortment\
  \ of diskettes.\n\n## GetFree\n\n*   *New Technologies, Inc.*\n\n*   *[`www.Forensics-Inti.com`](http://www.Forensics-Inti.com)*\n\
  \nNow we want to obtain the content of all unallocated space (deleted files) on\
  \ drive C of your AC and place this data in a single file. This single file can\
  \ be placed on a diskette (or Zip Disk if more space is needed).\n\nYou can type\
  \ the following to see the syntax of this program:\n\n `getfree` <enter>\n\nTo estimate\
  \ the amount of filespace needed to hold the unallocated space, use the command:\n\
  \n `getfree C:` <enter>\n\nNear the bottom of the results of this command, we see\
  \ “A total of xxx MB is needed.” Replace the `xxx` with whatever value your system\
  \ shows you. Let us say that `xxx = 195`. This means one 250-MB Zip Disk could be\
  \ used to hold the 195 MB of data. Let us say that our Zip Drive is drive D. Therefore,\
  \ we would use the following command:\n\n `getfree/f d:\\\\FreeC c:` <enter>\n\n\
  The `/f` option allows us to filter out non-printing characters. Later in the investigation,\
  \ we may want to run `GetFree` without the `/f`, but to start, this is fine. The\
  \ `d:\\\\FreeC` is the Zip Drive (d:) and the `FreeC` is the filename chosen in\
  \ which to place the unallocated space data. The `c:` is the drive we are looking\
  \ on for unallocated space.\n\nNow, any files that were deleted from drive C are\
  \ in a single file (FreeC). This may provide some excellent data related to the\
  \ case we are working on.\n\n## Swap files and GetSwap\n\n*   *New Technologies,\
  \ Inc.*\n\n*   *[`www.Forensics-Intl.com`](http://www.Forensics-Intl.com)*\n\nIf\
  \ the bitstream backup that is on drive C of your AC is a Microsoft Windows operating\
  \ system or any other operating system that contains static swap files, you will\
  \ want to copy these swap files to your Zip Drive (drive D).\n\nIf this is a Microsoft\
  \ NT system (or Windows 2000, which is essentially NT 5), copy the `pagefile.sys`\
  \ file to a separate Zip Disk(s). You must do this copy operation in DOS mode (not\
  \ a DOS window running under NT) because while Windows NT is running, the `pagefile.sys`\
  \ file is being used and you cannot perform the copy.\n\nTo perform this copy operation,\
  \ go to the directory where `pagefile.sys` resides (usually `c:\\\\winnt\\\\system32\\\
  \\`) and, assuming your Zip Drive is drive D, use the following command:\n\n `c:\\\
  \\winnt\\\\system32\\\\copy pagefile.sys d:` <enter>\n\nFor systems such as Microsoft\
  \ Windows 95 or 98, look for `win386.swp` in `c:\\\\windows`. Perform the same type\
  \ of copy operation under DOS:\n\n `c:\\\\windows\\\\copy win386.swp d:` <enter>\n\
  \nUnder other Microsoft Windows systems, look for a file called `386SPART.PAR` and\
  \ perform the same type of copy operation to your Zip Drive under DOS.\n\nThere\
  \ are a number of other operating systems with a variety of different swap files.\
  \ See the documentation for the operating system you are using to obtain the names\
  \ and locations of these swap files.\n\nNow let us discuss the use of `GetSwap`.\
  \ The purpose of `GetSwap` is to obtain data found in computer “swap” or “page”\
  \ files, so that the data can later be analyzed during an investigation. `GetSwap`\
  \ will obtain all such data from one or more hard drive partitions in a single pass.\
  \ Because of the way swap space works, a document could have been created, printed,\
  \ and never “saved” but still be in swap space. Valuable data can be obtained from\
  \ swap space. `GetSwap` must be run under DOS, not MS Windows. Therefore, boot your\
  \ system to DOS by using either a boot diskette or choosing MS-DOS at startup before\
  \ using `GetSwap`.\n\nTo read the manual for `GetSwap` from a DOS prompt, use:\n\
  \n `getswap man | more` <enter>\n\nTo find out what types of partitions you have\
  \ on the drives (FAT, NTFS), use:\n\n `getswap id` <enter>\n\nIf you use the `/F`\
  \ option with `GetSwap` (`getswap d:\\\\SwapInfo C: / f`), the size of the swap\
  \ file can be significantly reduced by filtering out the binary data and leaving\
  \ only the ASCII text data to be analyzed. This is good for a first pass. If you\
  \ do not find what you are looking for, you can always run `GetSwap` again without\
  \ the `/F` so that you then have the binary data to analyze also.\n\nIf you want\
  \ to obtain all swap data (binary and ASCII text) from C and place the resulting\
  \ swap file data on your Zip Drive (D) in a file named `SwapData`, use the following\
  \ command:\n\n `getswap d:\\\\SwapData C:`\n\nIf you do not have additional drives\
  \ to obtain swap data from, such as drives E, F, and G, use the following command:\n\
  \n `getswap d:\\\\SwapData C: E: F: G:`\n\n`GetSwap` would search all the above\
  \ drives for swap data and place the information it found into `d:\\\\SwapData`.\
  \ Later, other tools will be used to analyze the swap data we have collected in\
  \ the file `SwapData`.\n\nTo run `GetSwap`, type:\n\n `GETSWAP` <Enter>\n\nThe command\
  \ syntax of the `GetSwap` command is:\n\n `GETSWAP <Filename> <Volume:> \\[<Volume:>\
  \ <Volume:>..\\] \\[/F\\]`\n\n**Note**: The path can be included with the filename.\
  \ The filename you specify will contain the swap data that is obtained from the\
  \ volume(s) you search. The `/F` may be added to filter out binary data and leave\
  \ only the ASCII text. You may look at ASCII text first if you wish, but remember\
  \ that binary data may contain important information.\n\nTo show a list of the hard\
  \ drive volumes that are recognized by `GetSwap`, type:\n\n `GETSWAP ID`\n\nTo see\
  \ the `GetSwap` manual, type:\n\n `GETSWAP MAN | MORE`\n\nTo use `GetSwap`, type:\n\
  \n `get swap c:\\\\D\\_Swap D:`\n\nThis will obtain the swap data from drive D and\
  \ place the results in the file:\n\n `c:\\\\D\\_Swap`.\n\n`GetSwap` will obtain\
  \ data from both NTFS and FAT-type partitions. The purpose of `GetSwap` is to retrieve\
  \ data found in swap or page files of computer systems. From these, you can search,\
  \ process, and analyze the data as you wish during an investigation. Swap file data\
  \ is stored in computer memory (virtual memory, i.e., – areas of the computer’s\
  \ hard drive). Because of this, the hard drive contains data that would normally\
  \ never be on the hard drive but only in RAM (random access memory).\n\n## GetSlack\n\
  \n*   *New Technologies, Inc.*\n\n*   *[`www.Forensics-Intl.com`](http://www.Forensics-Intl.com)*\n\
  \n`GetSlack` will be used to capture the data contained in the file slack of the\
  \ hard drive on our AC (drive C in our case). The file we create that contains the\
  \ file slack will be placed on the Zip Drive (drive D).\n\n\n\n文件会占用一个或多个磁盘簇。文件未完全填满的簇部分称为碎片空间。碎片空间由操作系统用于多种用途，但普通计算机用户无法查看。需要特殊工具才能查看碎片空间。调查中有价值的信息可能就在此处。\n\
  \n要观察命令语法，输入：\n\n getslack <enter>\n\n要估算 C 驱动器上的碎片空间，输入：\n\n getslack c: <enter>\n\
  \n当命令执行完毕后，你会在（靠近底部）看到类似“总共有 xxx MB 的碎片空间” 的提示，其中 xxx 为正在检查的驱动器上的碎片空间数量。\n\n要从 C\
  \ 驱动器实际获取碎片空间并存储到 Zip 驱动器 D，输入：\n\n getslack d:\\\\C\\_Slack C: <enter>\n\n如果我们想做同样的操作，并且还要过滤掉非打印字符，则输入：\n\
  \n getslack/f d:\\\\C\\_Slack C: <enter>\n\n### 临时文件\n\n在 Microsoft Windows 操作系统中，将\
  \ Windows 临时文件复制到 Zip 驱动器 D。这些文件具有 .tmp 扩展名。最简便的查找方法如下：\n\n1.  点击左键单击开始菜单。\n\n2.\
  \  将鼠标移动到“查找”。\n\n3.  点击“文件”或“文件夹”。\n\n4.  在“命名:”框中输入 \\* .tmp。\n\n5.  保持“包含文本:”框为空。\n\
  \n6.  在“查看:”框中输入 c:\\\\。\n\n7.  确保“包含子文件夹”框中有复选框。\n\n8.  点击“查找”框的左键单击。\n\n注意，第 4\
  \ 列表示你已找到驱动器 C 上的所有 .tmp 文件。将这些文件复制到 Zip 驱动器 D 的最简便方法是：\n\n1.  用左键单击选中名称列中的第一个文件。\n\
  \n2.  使用右侧滚动条滚动到底部。\n\n3.  按住 Shift 键，然后用左键单击选中最后一个文件。\n\n4.  名称列中的所有文件现在已高亮显示。\n\
  \n5.  将鼠标指针放在任意高亮文件上，按右键单击。\n\n6.  用左键单击选择“复制”。\n\n7.  最小化所有打开的窗口。\n\n8.  双击“计算机”图标。\n\
  \n9.  右键单击驱动器 D 图标。\n\n10. 用左键单击选择“粘贴”。\n\n你现在已将 .tmp 文件放在 Zip 驱动器 D 上。稍后你将使用 CF\
  \ 工具对这些 .tmp 文件进行分析。\n\n### Filter_I\n\n*   *New Technologies, Inc.*\n\n*   *[`www.Forensics-Inti.com`](http://www.Forensics-Inti.com)*\n\
  \nFilter_I 具有将二进制数据转换为可打印格式并从大量二进制数据中提取潜在有用数据的功能。另一个优秀的用途是为另一个 CF 工具 TextSearch\
  \ Plus 创建关键字列表。\n\n该工具用于分析你从自由空间（使用 GetFree）、交换空间（使用 GetSwap）、碎片空间（使用 GetSlack）以及临时文件中收集的数据。要使用\
  \ Filter_I，首先在 DOS 提示符下输入：\n\n filter_I <enter>\n\n你会看到一个包含四个选项的菜单。使用方向键在选项间切换，按\
  \ <enter> 激活所需选项。对每个高亮选项，按 FI 获取更多信息。四个选项如下：\n\n#### Filter\n\nFilter 选项分析所选文件，并将所有非\
  \ ASCII 数据替换为空格。文件大小保持不变，生成的文件可在 Microsoft Word 等文字处理程序中查看。\n\n对 Zip 驱动器 D 上收集的每个文件（FreeC、SwapData、C_Slack、.tmp\
  \ 文件）使用此选项。确保 Filter_I 与将要分析的文件（FreeC、SwapData、C_Slack、.tmp 文件）在同一目录下。这意味着 Filter_I\
  \ 要么加载在包含你收集文件的 Zip 磁盘（驱动器 D），要么将收集的文件移动到运行 Filter_I 的位置。操作步骤如下：\n\n1.  使用方向键选择\
  \ Filter 选项。\n\n2.  用方向键选择 SwapData 文件，然后按 <enter>。\n\n3.  回答 Y（是）以创建 SwapData.f01\
  \ 文件。处理完成后，会提示 SwapData.f01 已创建。\n\n4.  按任意键返回 Filter_I 选择菜单。\n\n现在打开另一个 DOS 窗口，进入包含\
  \ SwapData.f01 和原始 SwapData 文件的目录。注意它们的大小与之前相同。快速查看这两个文件，使用 DOS more 命令或 Microsoft\
  \ Word 等文字处理程序。由于创建原始 SwapData 文件时使用了参数排除二进制数据，因此这两个文件几乎没有区别（如果有的话）。因为二进制数据已被移除，Filter\
  \ 选项无需做任何事。如果之前未移除二进制数据，Filter 会将其替换为空格。现在处理 C_Slack 文件：\n\n1.  使用方向键选择 Filter 选项。\n\
  \n2.  用方向键选择 C_Slack.s01 文件，然后按 <enter>。\n\n3.  回答 Y（是）以创建 C_Slack.f01 文件。处理完成后，会提示\
  \ C_Slack.f01 已创建。\n\n4.  按任意键返回 Filter_I 选择菜单。\n\n观察这两个文件，注意到所有非 ASCII 数据已被替换为空格。\n\
  \n#### Intel\n\nIntel 选项分析所选文件，并获取符合英文单词模式的数据。你可能会发现密码、用户名、社会安全号码、电话号码、信用卡号码等。输出文件的大小远小于原始文件大小。该选项的输出为\
  \ ASCII 数据。可使用 Microsoft Word 等文字处理程序查看输出文件。\n\n现在对 C_Slack.s01 文件运行 Intel 选项。操作步骤如下：\n\
  \n1.  使用方向键选择 Intel 选项，然后按 <enter>。\n\n2.  用方向键选择 C_Slack.s01，然后按 <enter>。\n\n3.\
  \  回答 Y（是）以创建 C_Slack.f02 文件。处理完成后，会提示 C_Slack.f02 已创建。（注意 .f 02 是创建的，不是 .f 01。你已经有\
  \ C_Slack.f 01。）\n\n4.  按任意键返回 Filter_I 选择菜单。\n\n查看 C_Slack.f02 文件，看是否有可用于后续在 TextSearch\
  \ Plus 中生成关键字列表的词汇。按照之前对 C_Slack.s01 的操作，但改用 SwapData.f01 文件。你将得到 SwapData.f02 文件，以便查找更多关键词供日后使用。\n\
  \n#### Names\n\nNames 选项分析所选文件，并获取文件中列出的所有人名。找到的任何姓名都应加入你稍后使用 TextSearch Plus 生成的关键字列表。输出文件仅保存\
  \ ASCII 数据，可使用 Microsoft Word 等文字处理程序查看。\n\n现在对 SwapData.f01 文件运行 Names 选项。操作步骤如下：\n\
  \n1.  使用方向键选择 Names 选项，然后按 <enter>。\n\n2.  用方向键选择 SwapData.f01，然后按 <enter>。\n\n\
  3.  回答 Y（是）以创建 SwapData.f03 文件。处理完成后，会提示 SwapData.f03 已创建。\n\n4.  按任意键返回 Filter_I\
  \ 选择菜单。\n\n查看 SwapData.f03 文件，看是否有可用于后续在 TextSearch Plus 生成关键字列表的词汇。按照之前对 SwapData.f01\
  \ 的操作，但改用 C_Slack.s01 文件。你将得到 C_Slack.f03 文件，以便查找更多关键词供日后使用。\n\n##### Words\n\n\n\
  \n-   [Words 选项](https://www.Forensics-Inti.com)分析所选文件，并从电子邮件或文档处理程序中获取片段。该选项和生成的文件会获取与结构化句子中使用的英文单词相匹配的数据。最终输出文件仅保留\
  \ ASCII 数据，因此可以使用 Microsoft Word 等文档处理程序来读取该文件。\n\n-   现在运行 `Words` 选项，对 SwapData.f0l\
  \ 文件进行处理。具体步骤如下：\n\n    1.  使用方向键选中 Words 选项，然后按 <enter> 键。\n\n    2.  使用方向键选择 SwapData.f01，然后按\
  \ <enter> 键。\n\n    3.  回答 “Y”（是）以创建 SwapData.f04。处理完成后，会提示 SwapData.f04 已创建。\n\n\
  \    4.  按任意键返回 Filter_I 选择菜单。\n\n-   现在查看新创建的 SwapData.f04 文件。查看是否有可用于后续在 TextSearch\
  \ Plus 中使用的关键词列表。对 SwapData.f01 使用相同流程，但改用 C_Slack.s0l 文件。最终将得到 C_Slack.f04 文件，用于查找更多关键词。\n\
  \n-   **请记住**：同时运行 FilterJ 对临时文件以及使用 GetFree 获得的自由空间文件。在我们示例中，处理的文件生成了八个新文件，扩展名分别为\
  \ .f0l、.f02、.f03、.f04。\n\n### 关键词生成\n\n获得 TextSearch Plus 后期使用的关键词的三个步骤如下：\n\n1.\
  \ 在 (.f02、.f03、.f04) 文件中搜索关键词。\n\n    -   新线索\n\n    -   潜在密码和用户名\n\n    -   姓名、日期、地点等\n\
  \n2. 咨询该领域的专家。\n\n    -   会计师\n\n    -   工程师\n\n    -   化学家\n\n    -   其他执法人员\n\n\
  \    -   互联网等\n\n3. 考虑操作系统（UNIX、NT、VAX 等）、平台（Intel、DEC Alpha、SUN SPARC 等）、黑客工具、系统错误消息以及黑客工具或恶意活动生成的消息。\n\
  \n通常，在正常使用机器时出现的常见词汇不会被选为关键词。拥有该系统类型的专家帮助非常有价值，专家可以从该视角提供关键词。如果此前使用的关键词效果不佳，可能需要扩展关键词以包含更多常见系统词汇，从而花费更多时间评估结果。\n\
  \n下面的列表并非 exhaustive，只是我从查看由 Filter_I 生成的 Intel 文件（SwapData.f02）时挑选的示例关键词：\n\n>\
  \ Bad, Destroy, Exception, Error, Warning, Critical, Delete, Remove, Terminate,\
  \ Virus\n\n下面是从我的 Names 选项文件（SwapData.f03）生成的结果中挑选的十个关键词：\n\n> Shawn, Carlsbad,\
  \ Ronald Dickerson, Ann Arbor, Allentown, Charles Brownerstein, Franklin from IBM,\
  \ Bonnie Greason, 13 GHZ, allenpcq@odst23.com\n\n最后，以下是从我的 Words 选项文件（SwapData.f04）生成的结果中挑选的十个关键词：\n\
  \n> Abnormal program termination, Unexpected, Runtime error, BackOrifice,\n\n> \n\
  \n> Attacker, Exploited, Probe, Password, ntruder \\[the I was not there\\], suspicious\n\
  \n从操作系统角度看，如果正在处理疑似被恶意人员远程控制的 Microsoft NT 操作系统，可使用的关键词包括：\n\n> Cult, Dead, Cow,\
  \ BO2K, Back Orifice, BackOrifice, crtdll.dll, msadp32.acm, msacm32.dll\n\n特别要注意最后三个关键词：它们在\
  \ NT 系统上 BO2K 活动时会运行。\n\n**请记住**：搜索和使用关键词需要耐心和坚持。\n\n## TextSearch Plus\n\n*   *New\
  \ Technologies, Inc.*\n\n*   *[`www.Forensics-Inti.com`](http://www.Forensics-Inti.com)*\n\
  \n使用 TextSearch Plus 的命令如下：\n\n txtsrchp <enter>\n\n这将弹出一个包含 15 个选项的菜单。按 F1 键查看每个选项的帮助信息，然后继续阅读本文。\n\
  \n假设我们想使用 TextSearch Plus（TSP）对之前创建的文件 SwapData.f0l 进行关键词搜索。我们可以对之前创建的任何文件（C_Slack、FreeC、临时文件、Filter_I\
  \ 生成的文件等）进行搜索，但本例选择 SwapData.f01。\n\n使用方向键选择 Drive/Path，然后按 <enter> 键。注意光标现在所在位置。使用回退键删除原有内容，输入指向目标文件的完整路径。例如，如果\
  \ SwapData.f0l 位于 D: \\\\ InvesXCasel，则输入该路径。如果位于 D:\\\\，则输入 D:\\\\。不要在此处输入文件名（SwapData.f0l）。文件名有专门的位置。输入完整路径后，按\
  \ <enter> 键，返回菜单。\n\n使用下方向键选择 Continuous Search。查看你输入的路径下方的文字，下面那个词是 Continuous。其右侧会显示\
  \ off 或 on。按 <enter> 键切换 off 和 on。多次按 <enter> 直至显示 on。当 Continuous Search 为 off\
  \ 时，TSP 在每次匹配关键词时都会暂停；若为 on，则会将关键词匹配记录到日志文件，并自动继续搜索 SwapData 文件的其他关键词。\n\n接着，使用下方向键进入下一个选项\
  \ Editor/Lister。按 <enter> 键。注意光标位于 Type，这是一个 DOS 命令，用于查看文件。默认选项即 Type，使用即可。如需更改，可使用回退键将其替换为其他编辑器（如\
  \ EDIT），然后按 <enter> 返回菜单。\n\n按 <enter> 进入 File Specs 菜单选项，光标会移至左下角。在此输入文件名 SwapData.f01。可以使用通配符\
  \ \\*.\\* 来搜索 Drive/Path 目录下的所有文件，或搜索 SwapData 文件（\\* 可用于搜索所有 SwapData 文件，如 .f01\
  \ 到 .f04），但本例不做此操作。直接输入文件名 SwapData.f01 并按 <enter>。返回菜单后继续操作。\n\n使用下方向键选择 DOS Gateway，按\
  \ <enter> 键。这将进入 DOS 提示符，如有需要可在此执行 DOS 操作。在提示符处输入 EXIT 以返回 TSP 菜单。\n\n最后，选择 IntelliSearch\
  \ 菜单选项。按 <enter> 键可在开启和关闭之间切换。保持该选项开启可提升搜索结果，因此我们保持开启。该选项在搜索前会剔除所有标点符号和控制字符，例如搜索\
  \ “Bob” 时，即使 “Bob?” 出现在句末，也能去除问号后找到 “Bob”。\n\n关于 TSP 中使用的关键词，如果搜索 “Sue” 只输入该词，可能会因\
  \ “pursue” 等词而误命中。为避免此类情况，可在 “Sue” 前后加空格，即 “ Sue”。\n\n使用下方向键选择 Log File，按 <enter>\
  \ 键。然后删除 “Log output to:” 旁边的内容，输入想要创建的日志文件的完整路径和文件名，最后按 <enter> 返回菜单。\n\n\n**Note**:\
  \ 无法在包含正在搜索文件的驱动器上创建日志文件。因此，如果您的关键字模式文件位于 D 驱动器，您可以将 TSP 的输出发送到磁盘驱动器 A 中的软盘上的日志文件。\n\
  \n使用下箭头键并高亮显示“多个匹配”。这是一个切换开关。连续按 <enter> 键多次可以看到它在“多个匹配”开启和关闭之间切换。开启时，TSP 会对相同的关键字进行多次搜索；关闭时，TSP\
  \ 只搜索关键字的第一次出现。为了我们的目的，请保持开启，然后向下移动到下一个菜单项“Print Flag”。\n\n“Print Flag”是另一个切换开关，连续按\
  \ <enter> 键多次可切换其开关状态。开启后，TSP 的输出将同时发送到打印机和日志文件。为了我们的目的，请保持关闭。\n\n向下移动到“文本模式文件”，按\
  \ <enter>。注意光标的闪烁位置。输入您将创建的模式文件的完整路径和文件名（包含关键字列表）。按 <enter> 后返回菜单。\n\n向下移动到“子目录搜索”，按\
  \ <enter>。注意这是一个切换开关，连续按 <enter> 键多次可开启或关闭该选项。为了我们的目的，请保持关闭，因为我们已经直接指定了完整路径和关键字文件名。\n\
  \n向下移动到“排除文件规范”。这是另一个由 <enter> 控制的切换开关。为了我们的目的，请保持关闭，因为我们不希望阻止 TSP 检查任何特定文件。\n\n\
  向下移动到“WordStar 标志”。这是一个由 <enter> 控制的切换开关。除非您在使用 WordStar，否则请保持关闭。大概率您不会使用 WordStar，因此应保持关闭。\n\
  \n向下移动到“物理驱动器”。仅在同时选择“在物理层搜索”（通过顶部菜单的“区域”选择“物理磁盘搜索”）时才使用此选项。使用此选项不推荐，因为这不是常规的搜索方式，仅为满足政府机构的请求而加入\
  \ TSP。跳过此选项，直接移动到最后一个选项“文件警报”。\n\n“文件警报”在开启时会提醒您可能包含图形文件、压缩文件或已启用压缩的硬盘的文件。再次使用 <enter>\
  \ 键切换该选项的开关状态。为了我们的目的，我们将保持其开启状态。\n\n现在使用右箭头键移动到主菜单的“区域”选择。为了我们的目的，我们将高亮显示“文件”并按\
  \ <enter>。此时屏幕右上角应出现一个勾选标记。如果没有，请再次按 <enter>，因为这是一个切换开关。当“Search Files”旁边出现勾选标记（屏幕右上角）后，您可以移动到下一段。\n\
  \n我们现在创建关键字模式文件。使用左箭头键返回主菜单的“选项”。高亮显示“DOS 门户”并按 <enter>。在 DOS 提示符下输入 EDIT（使用 DOS\
  \ 文本编辑器；也可以使用其他 ASCII 文本编辑器）并输入您的关键字模式文件。我将我的关键字模式文件放在 d:\\\\Suspect.txt，文件内容如下（列表方法是必须的）：\n\
  \n*   Bad\n\n*   Destroy\n\n*   Exception\n\n*   Error\n\n*   Warning\n\n*   Critical\n\
  \n*   Delete\n\n*   Remove\n\n*   Terminate\n\n*   Virus\n\n*   Shawn\n\n*   Carlsbad\n\
  \n*   Ronald Dickerson\n\n*   Ann Arbor\n\n*   Allentown\n\n*   Charles Brownerstein\n\
  \n*   Franklin from IBM\n\n*   Bonnie Greason\n\n*   13 GHZ\n\n*   allenpcq@odst23.com\n\
  \n*   Abnormal program termination\n\n*   Unexpected\n\n*   Runtime error\n\n* \
  \  Attacker\n\n*   Exploited\n\n*   Probe\n\n*   Password\n\n*   ntruder\n\n*  \
  \ suspicious\n\n*   Cult\n\n*   Dead Cow\n\n*   BO2K\n\n*   Back Orifice\n\n*  \
  \ BackOrifice\n\n*   crtdll.dll\n\n*   msadp32.acm\n\n*   msacm32.dll\n\n您可以使用最多\
  \ 50 个关键字。无论是否大写字母都不影响。TSP 会查找单词，不区分大小写。保存文件时使用您告诉 TSP 使用的正确文件名，并将其放在您告诉 TSP 使用的正确目录中。如果文件使用了\
  \ .txt 扩展名，请在告诉 TSP 的模式文件名称末尾加上 .txt 扩展名。然后在 DOS 提示符下输入 EXIT 返回 TSP。\n\n在主菜单中使用箭头键移动到“搜索”，高亮显示“继续”，然后按\
  \ <enter>。TSP 开始关键字搜索，结果显示在监视器上。所有结果都会存储在您 earlier 指定的日志文件中。\n\n当 TSP 完成后，使用箭头键移动到主菜单的“退出”，按\
  \ <enter>。当询问是否保存当前配置时，按 Y 表示“是”。\n\n如果生成的日志文件过大，可以删除那些产生过多匹配的关键字。一旦您拥有日志文件，手动分析其中的线索和其他与案件相关的信息。使用任何文本编辑器（如\
  \ Microsoft Word for Windows）查看日志文件，确保彻底记录您的发现。\n\n关于 TSP 的其他注意事项：对于“物理驱动器”，如果使用\
  \ FI，则指的是软盘驱动器；如果使用 HI，则指的是第一块硬盘（H2 是第二块硬盘，以此类推）。如果文件或数据已加密，TSP 无法提供帮助，除非识别已加密文件的已知头信息。\n\
  \nCRCMD5\n\n*   *New Technologies, Inc.*\n\n*   *[`www.Forensics-Inti.com`](http://www.Forensics-Inti.com)*\n\
  \nCRCMD5 用于为 DOS 文件或文件组计算 CRC-32 校验和以及 128 位 MD5 摘要。CRCMD5 程序的语法如下：\n\n crcmd5 <options>\
  \ file1 file2 …\n\n文件名中可以使用通配符 \\* 和 ?。\n\n如果使用 /s 选项，则会对当前目录下的文件以及匹配指定文件规范的所有子目录中的文件进行校验。\n\
  \n如果指定 /h 选项，生成的输出为无头文本，仅包含文件名行。每行的最后字段为文件的完整路径，字段之间用空格分隔，随后是 RSA MD5 摘要。\n\n要为\
  \ C 驱动器和 D 驱动器上的所有文件生成校验和 MD5，输入：\n\n crcmd5/s C: D:\n\n要为位于 D 驱动器的 SwapData.f01\
  \ 文件生成校验和 MD5，输入：\n\n crcmd5 d:\\\\SwapData.f01\n\n要为 D 驱动器上的所有文件生成校验和 MD5，并以无头文本格式输出：\n\
  \n crcmd5/s/h D:\n\n要将 CRCMD5 的输出发送到您选择的文件名，使用以下命令：\n\n crcmd5/s/h D: > a:\\\\OutFile.txt（使用任意文件名即可）\n\
  \nCRC 检查和 MD5 摘要的作用是验证文件或文件组的完整性。例如，在收集证据文件后，运行 CRCMD5 以获取 CRC 校验和和 MD5 摘要。只要文件内容不变，这些值始终不变。如果值发生变化，则文件完整性可能已被破坏，文件可能不再在法庭上被采信。\n\
  \nDiskSig\n\n*   *New Technologies, Inc.*\n\n*   *[`www.Forensics-Inti.com`](http://www.Forensics-Inti.com)*\n\
  \nDiskSig 用于计算整个硬盘的 CRC 校验和 MD5 摘要。校验和和摘要包含硬盘上的全部数据，包括已删除和未使用的区域。默认情况下，硬盘的引导扇区不会计入此计算。\n\
  \n要为硬盘 D 生成 CRC 和 MD5 摘要，输入：\n\n disksig d:\n\n要为硬盘 C、D 和 E 生成 CRC 和 MD5 摘要，输入：\n\
  \n disksig C: D: E:\n\n要在计算时包含硬盘的引导扇区，输入：\n\n disksig/b D:\n\n要将 DiskSig 的输出发送到软盘而不是计算机显示器，输入：\n\
  \n disksig D: > a:\\\\DiskSigD.txt\n\n**Note**: 如果硬盘已被压缩，计算会在未压缩的原始硬盘上执行。\n\n\n\n\
  \n-   [DiskSig]的目的是验证硬盘的完整性。在用作证据的硬盘上运行 DiskSig 会生成 CRC 检查和 MD5 校验和。如果硬盘数据以任何方式被修改，CRC\
  \ 和 MD5 的值都会改变。\n\n### Doc\n\n*   *New Technologies, Inc.*\n\n*   *[`www.Forensics-Inti.com`](http://www.Forensics-Inti.com)*\n\
  \nDoc 是一个程序，用于记录当前运行目录的内容。输出提供了文件/目录名称、文件大小、文件日期以及文件时间（创建时间以小时、分钟、秒计）的列表。只读和隐藏文件也会显示。\n\
  \n如果希望输出到屏幕并使用标准报告名称，输入：\n\n doc <enter>\n\n标准报告文件会保存在运行 Doc 的目录中，文件名格式为 Doc-<Month><Day>.<report\
  \ number>。例如，若日期为 10 月 11 日且在此目录下首次运行，报告文件名为：\n\n Doc-1011.001.\n\n如果希望输出到磁盘的文件，输入：\n\
  \n doc > a:\\\\DocD.txt <enter>\n\n### Mcrypt\n\n*   *New Technologies, Inc.*\n\n\
  *   *[`www.Forensics-Intl.com`](http://www.Forensics-Intl.com)*\n\nMcrypt 用于加密和解密文件，提供多种加密级别。若同时使用文件压缩技术，正确的操作顺序是先压缩文件，再使用\
  \ Mcrypt 加密。若通过 Internet 将加密文件发送给他人，务必不要通过 Internet 传输解密所需的密码。应在面对面会面时决定密码（最佳），或通过电话与对方共享密码（但不要留在语音邮件中）。不要在与加密信息使用相同的介质（如\
  \ Internet）上传输密码。为了获得最佳安全性，切勿仅依赖加密。请确保锁好磁盘或其他存放加密文件的介质。随时可通过按下 F1 键获得上下文敏感帮助。\n\n\
  Mcrypt 有三种加密级别，每一种比前一种更强，但也更耗时：\n\n1. 专有加密（低级默认）\n\n2. DES（数据加密标准）CBF（高级默认）\n\n\
  3. 增强 DES（先使用 DES，再使用专有加密进行双重加密）\n\n mcrypt filename/Z\n\n在选择加密密码时，使用口令短语而非字典中可能查找到的简单密码。强密码至少包含八个字符，且应包含字母数字字符以及特殊字符（如\
  \ !、% 、@、#、\\*）。口令短语由您自行构造，以便记忆。例如：\n\n> The corn will be growing for the next 30\
  \ days!\n\n取每个单词的首字母（包括数字和特殊字符），得到密码：\n\n> tcwbgftn30d!\n\n此密码极难破解，同时易于快速输入，以防止他人观察。大写字母可进一步提升安全性，但会降低输入速度并增加记忆难度，因此不建议在密码中混用大小写字母。\n\
  \n在选择要加密的文件时，可通过命令行或在图形用户界面（GUI）使用空格键选择多个文件。所有文件可使用 + 键和 - 键进行选择与取消选择：\n\n mcrypt/m\
  \ 强制程序使用单色显示器。\n\n mcrypt/c 强制程序使用彩色显示器。\n\n例如，若要使用高级加密（DES CBF）加密位于 D 盘的 SwapData.f01\
  \ 文件，输入：\n\n mcrypt d:\\\\SwapData.f01/H\n\n若在工作会话中仅希望处理 *.txt 文件，可在 DOS 命令行中输入：\n\
  \n mcrypt \\*.txt\n\n**注意**：所有 DOS 通配符（**\\*** 和 **?**）均可使用。\n\n再如，若要在命令行中使用高级加密（DES\
  \ CBF）加密 D 盘上所有以 SwapData 为前缀的文件（.f01 到 .f04），输入：\n\n mcrypt d:\\\\SwapData.\\*/-E/H\n\
  \n输入密码后，文件即被加密。\n\n若要解密上述示例中的文件，使用 /-D 选项：\n\n mcrypt d:\\\\SwapData.\\*/-D/H\n\n\
  输入正确密码后，文件即被解密。\n\n若要启动程序并使用低级加密选项，输入：\n\n mcrypt\n\n若要启动程序并使用高级加密选项，输入：\n\n mcrypt/H\n\
  \n若要启动程序并使用增强 DES 加密级别，输入：\n\n mcrypt/Z\n\n对于站点许可版，可通过以下选项建立并利用“管理后门”：\n\n mcrypt/P\n\
  \n**请记住**：若建立后门，任何已加密的文件均可能被此后门 compromise。强烈不建议使用后门。\n\n与任何加密程序一样，完成加密文档的会话后，最好关闭计算机。这样可以清除密码从计算机\
  \ RAM 中的残留。Mcrypt 花费大量工作确保密码不会滞留在内存中，但出于安全起见，仍然建议在完成操作后关闭机器。\n\n若仅使用 GUI，请按以下步骤：\n\
  \n mcrypt <enter>\n\n使用方向键高亮 “Change Security Level”，然后按\n\n <enter>。\n\n此时右上角会显示\
  \ “High Security Selected”，这是一个切换状态。\n\n使用方向键高亮 “Change File Specs”。\n\n输入正确的路径和文件规格以便\n\
  \n encrypt/decrypt。\n\n使用方向键高亮 “Encrypt/Decrypt Files”，然后按\n\n <enter>。\n\n按 E 键加密或\
  \ D 键解密。\n\n使用空格键选择或取消选择您要加密或解密的文件。若只关注单个文件，选中该文件后按 <enter>。\n\n输入强密码（使用前文所述的口令短语）。\n\
  \n再次输入密码以确认。\n\n加密或解密过程开始。\n\n### Micro-Zap\n\n*   *New Technologies, Inc.*\n\n\
  *   *[`www.Forensics-Intl.com`](http://www.Forensics-Intl.com)*\n\n> *当使用标准 DOS（delete、erase）或\
  \ Microsoft Windows（95/98/NT/2000）技术擦除或删除文件时，文件实际上并未真正删除，仍然可以被懂得方法的人恢复。Micro-Zap\
  \ 实际消除文件名以及其关联的文件内容。*\n\nMicro-Zap 通过用十六进制 F6 模式覆盖文件来删除文件。默认一次覆盖，但通过七次覆盖可获得更高的安全级别。随时通过按下\
  \ F1 键获得程序帮助。文件被 Micro-Zap 消除后，关联的文件 slack 也被清除。举例来说：\n\n1.  要在特定目录中使用七次覆盖（/H 选项）删除所有\
  \ *.doc 文件：\n\n  zap \\*.doc/H.\n\n2.  按空格键。\n\n3.  确保 “Erase/Destroy Files” 被高亮显示；若未高亮，使用方向键选中。\n\
  \n4.  按 <enter>。\n\n5.  通过按 + 键或空格键选中所有 *.doc 文件。\n\n6.  按 <enter>。\n\n7.  按 Y（Yes）确认销毁文件。\n\
  \n8.  按空格键返回菜单或按 ESC 退出程序。\n\n若要七次覆盖并删除文件 Story.txt，使用：\n\n zap Story.txt/H\n\n\
   按 Y（yes）确认。\n\n若要一次覆盖并删除文件 Bonus.com，使用：\n\n zap Bonus.com\n\n 按 Y（yes）确认。\n\n\
  **注意**：如果让 Micro-Zap 删除零字节文件，它会提示您在 DOS 下自行处理。\n\n若想使用 GUI 界面而非命令行，但希望 Micro-Zap\
  \ 以七次覆盖选项初始化，请执行：\n\n1.  zap/h.\n\n2.  按空格键。\n\n\n\n\n3. 高亮 \"Specs\" 选项并按 <enter>。\n\
  \n4. 提供完整路径和文件规格（例如 d:\\\\stories\\\\\\\\*.txt）。\n\n5. 选择 \"Erase/Destroy Files\"\
  \ 并按 <enter>。现在你可以看到以 .txt 结尾的文件。\n\n6. 按 + 键选择全部，或对单个文件使用空格键。\n\n7. 按 <enter>。\n\
  \n8. 若不希望逐个确认每个文件的删除，按 N（No）。\n\n9. 按 Y（Yes）以销毁文件。\n\n### Map\n\n*   *New Technologies,\
  \ Inc.*\n\n*   *[`www.Forensics-Intl.com`](http://www.forensics-intl.com)*\n\nMap\
  \ 用于查找并识别 TSR（Terminate and Stay Resident）程序。TSR 是运行在计算机内存中的程序，但你可能未曾察觉。使用 Map 的方法是：\n\
  \n map <enter>\n\n你将看到六列信息：\n\n1.  PSP  \n2.  Program  \n3.  Parent  \n4.  Segs\
  \  \n5.  Size  \n6.  Hooked Interrupts  \n\n系统的 DOS 版本也会显示。\n\n若要查看 TSR 程序的更详细信息，输入：\n\
  \n map/d <enter>\n\n### M-Sweep\n\n*   *New Technologies, Inc.*\n\n*   *[`www.Forensics-Inti.com`](http://www.forensics-inti.com)*\n\
  \n即使你已看不见某个文件的文件名，也不意味着它（或其部分）不仍然存在于硬盘的某个位置。M‑Sweep 会删除这些旧文件的痕迹（通过 DOS 或 Windows\
  \ 命令删除的文件，但其内容仍然停留在硬盘或软盘上），通过覆盖当前未被保留文件使用的磁盘空间来实现。当计算机迁往其他部门或出售时，彻底清除这些旧文件尤为重要。\n\
  \nM‑Sweep 安全删除硬盘（8 GB 或更小）、所有软盘以及其他可移除媒体（FAT12、FAT16、FAT32 文件系统）上的残留数据。DoubleSpace\
  \ 或 DriveSpace 之类的压缩产品可以正常配合 M‑Sweep 使用，但请勿使用非微软的压缩产品（如 Stacker）。如果 M‑Sweep 遇到错误，请先运行\
  \ scandisk，然后重新执行 M‑Sweep。\n\nM‑Sweep 首先会清理所有碎片空间。完成此步骤后（耗时数秒至数分钟），M‑Sweep 会进行第二次扫描，清理未分配（已删除但仍包含文件数据的未分配空间）。默认模式下，M‑Sweep\
  \ 在当前运行的卷上对碎片空间和未分配空间各覆盖一次。\n\n交互式启动 M‑Sweep 的方法是：\n\n ms <enter>\n\n批量启动 M‑Sweep\
  \ 的方法是：\n\n ms/b <enter>\n\n批量模式让 M‑Sweep 可以无人值守运行。该命令可放入 autoexec.bat，以便系统重新启动时自动执行。\n\
  \n若要在其他卷（例如 D 盘）上运行 M‑Sweep，请输入：\n\n ms D: <enter>\n\n若要清理 C 盘上的临时或交换文件，可输入文件清理脚本：\n\
  \n ms/s:<ScriptName> C: <enter>\n\n若要查看 M‑Sweep 命令行选项的帮助，输入：\n\n ms/H <enter> ms/?\
  \ <enter>\n\n若希望批量模式下抑制大部分信息，可使用：\n\n ms/b/q <enter>\n\n其他命令行选项：\n\n /R: <filename>  Obtain\
  \ a cleaning status report file  \n                   Cannot have a report file\
  \ on the volume being cleaned.  \n\n / V: CDE       Cleans volumes C, D, E  \n                    Be\
  \ sure to place the volumes in size order (largest to smallest)  \n\n /XS           Forces\
  \ M‑Sweep to skip the cleaning of slack space  \n\n /XU           Forces M‑Sweep\
  \ to skip the cleaning of unused space  \n\n /n              Sets the number of\
  \ overwrites to be done (n = 1 to 9)\n\n在交互式模式下：\n\n*   使用 <tab> 和 <shift tab> 在字段之间切换，或使用鼠标指针。\
  \  \n*   通过按 Alt‑h 可打开帮助菜单获取更多信息。  \n*   当复选框中出现勾选标记时，表示该项已打开。\n\n清理 D 盘的步骤：\n\n\
  *   在 “… volumes will be cleaned:” 框中输入 D。  \n*   切换到其他字段。  \n*   勾选 “clean unused\
  \ space” 与 “clean slack space”。  \n*   切换到覆盖次数字段，输入 1‑9 之间的数字并回车。  \n*   按 Alt‑c\
  \ 开始清理过程（确保处于 DOS 模式，而非 MS Windows）。\n\n若要设置文件清理脚本以清理交换和临时文件：\n\n*   必须是纯文本文件类型。\
