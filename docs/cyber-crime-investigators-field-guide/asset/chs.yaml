  \ CE3-10BT CreditCard Ethernet 10 |\n\n-   如同我们在 EnCase 3 的讨论中回顾，分析员可以选择预览或获取媒体。您也可以在预览后决定获取媒体。预览模式的负面是您无法保存调查结果。\n\
  \n-   与 EnCase 3 不同，EnCase 4 强制分析员在获取前先预览。由于您未进行获取，您必须 physically 连接到预览的媒体才能查看案件结果。不过，能够将预览结果保存到案件文件是一个巨大的优势。通过预览，分析员可以运行关键字搜索并创建书签，这些内容可以保存到案件文件中。注意，大多数\
