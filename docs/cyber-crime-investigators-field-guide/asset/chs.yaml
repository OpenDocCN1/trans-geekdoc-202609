  \n不要因本章推荐的参考资料数量而感到不知所措。目的是帮助你集中精力购买特定学科所需的书籍。当然，还有其他优秀的书籍吗？有的。不过，我将列出我手头拥有且确信可靠的书籍。首先，我非常推荐的是来自\
  \ O’Reilly 的学习平台（https://www.oreilly.com） —  — 看看你觉得如何（基于订阅）。\n\n最好先获取这些书籍放入你的图书馆，然后按需使用。浏览每本书的目录和索引，然后逐页阅读每本书（约五秒/页），快速了解每本书的内容。当你需要某个学科的信息时，你会大致知道哪本书包含所需信息。\n\
  \n接下来，自我约束每天阅读 30 分钟，直到完成所有书籍。做标记、下划线，并在边缘做笔记。把它们变成你的。认识它们。随着你在调查中前进，这些书将像好朋友一样陪伴你。知识将帮助你抵御那些试图迷惑你的行为，并大幅提升你高效处理案件的能力。将书籍中的关键内容录制成音频，在驾驶时收听。这将帮助你更快获取信息并更好地记住。\n\
  \n## PERL 和 C 脚本\n\n编程语言“专家”，如 C、PERL 和 Intel Assembly（这三种是大多数撰写用于攻击计算机网络系统的恶意代码的开发者最常用的语言），指的是那些每天花费\
  \ 8 小时或更多时间多年如一日的编码者。虽然拥有这种水平的技能会很好，但对于大多数人来说并不实际。然而，你需要掌握一些编码基础，这样在调查中发现代码时，你能识别出它是代码，并在快速研究后对其功能或意图有一个基本的理解。因此，我不会在此尝试让你成为\
  \ C 或 PERL 专家。我只提供一些快速参考资料，方便你在调查中遇到代码时，至少能迅速理解其内容（哪怕仅是一点点）。我建议你购买以下参考书籍，并根据时间安排逐步阅读：\n\
