  \n*   （无额外说明，保持原样）\n\n\n\n## 附录 A 术语表\n\n*   `Application`: 软件，其主要功能是为终端用户提供特定功能，例如\
  \ `Microsoft Word`。\n\n*   `Application Layer`: ISO 参考模型的七层结构中的一层。该层提供终端用户与网络之间的接口。它支持电子邮件、查看网页，以及众多其他网络服务。\n\
  \n*   `ARCNET`: 由 `Datapoint Corporation` 在 1970 年代开发，是一种局域网（LAN）技术，曾与以太网竞争，但如今已不再使用。最初通过\
  \ ARCNET 的计算机最高可以 2.5 Mbps 进行通信，而该技术现在支持最高 20 Mbps（与当前以太网的 100 Mbps 和 1 Gbps 相比）。\n\
  \n*   `ARP`: 地址解析协议（Address Resolution Protocol）。这是 TCP/IP 协议族中的一种协议，用于在网络层的 IP\
  \ 地址与数据链路层的 MAC 地址进行关联。\n\n*   `ATM`: 异步传输模式（Asynchronous Transfer Mode）。一种面向连接的网络技术，使用\
  \ 53 字节的单元代替以太网的分组技术。根据厂商不同，吞吐量可在 Mbps 到 Gbps 之间变化。ATM 能在同一连接上同时传输音频、视频和数据，并为这种传输提供服务质量（QoS）。\n\
  \n*   `BBS`: 公告板系统（Bulletin Board System）。使用 BBS 需要调制解调器和 BBS 的电话号码。BBS 应用程序运行在计算机上，使用户能够通过该计算机交换电子邮件、聊天和文件。BBS\
  \ 不是 Internet 的一部分。\n\n*   `BIOS`: 基本输入输出系统（Basic Input Output System）\n\n*   `BMP`:\
  \ 位图（Bitmap）\n\n*   `BO`: Back Orifice\n\n*   `BO2K`: Back Orifice 2000\n\n*   `BOOTP`:\
  \ 引导程序协议（Bootstrap Protocol）\n\n*   `CBF`: 压缩二进制格式（Compressed Binary Format）\n\n\
  *   `CBT`: 计算机基于训练（Computer Based Training）\n\n*   `CFI`: 认证取证调查员（Certified Forensics\
  \ Investigator）或网络取证调查员（Cyber Forensics Investigator）\n\n*   `CF`: 计算机取证或网络取证（Computer\
  \ Forensics or Cyber Forensics）\n\n*   `CIF`: 共同中间格式（Common Intermediate Format）\n\
  \n\n\n\nCISSP: 认证信息系统安全专业人员\n\nCIRT: 计算机应急响应小组\n\nCMOS: 互补金属氧化物半导体\n\nCracker: 正确的名称是指那些有恶意意图非法入侵网络计算机系统的个人。`hacker`\
  \ 这个词常被误用（尽管是媒体对 `hacker` 的炒作），实际上 `hacker` 指代的是 `cracker`：`cracker` 会探测并发现计算机网络系统的弱点，然后利用专用工具和技术对这些弱点进行利用。\n\
  \nCRC: 循环冗余校验和\n\nCRCMD5: 循环冗余校验和消息摘要 5\n\nCybercrime: 涉及使用计算机网络的刑事犯罪。\n\nCyberspace:\
  \ 指由计算机网络创建的连接和位置（包括虚拟空间）。术语“Internet”已与之同义。\n\nDAT: 数字音频磁带\n\nData Link Layer (DLL):\
  \ 负责可靠地在物理链路（如布线）上传输数据的层，常用以太网等网络技术实现。DLL 会在传输前将数据封装为帧（或单元），并允许多台计算机在使用如 CSMA/CD（载波检测/碰撞检测）等媒体访问控制方法时共享同一物理介质。\n\
  \nDCFL: 国防计算机取证实验室\n\nDHCP: 动态主机配置协议\n\nEMF: 增强元文件格式\n\nEthernet: 当前广泛使用的局域网技术，利用\
  \ CSMA/CD 控制对物理介质（通常为 Cat5 以太网线）的访问。以太网的正常吞吐速率为 10 Mbps、100 Mbps 和 1 Gbps。\n\nFAT:\
  \ 文件分配表\n\nFDDI: 光纤分布式数据接口。这是一种环形令牌技术，使用通过光纤传输的编码光脉冲在计算机系统之间进行通信。它支持 100 Mbps 的数据速率，常作为服务器之间的骨干网络使用，并具备冗余设计：若网络中的某个主机故障，光信号可通过备用路径继续传输，保持网络正常运行。\n\
  \nFinger: 通过 `traceroute` 或 `finger` 命令在发起攻击的机器上运行，以获取关于攻击者的更多信息。\n\nGIF: 图形交换格式\n\
  \nGMT: 格林威治标准时间\n\nGREP: 全局正则表达式解析器\n\nHardware: 计算机网络的物理组件。\n\nHost: 与节点等同，指连接到网络的计算机或其他网络设备。\n\
  \nICQ: 发音为 “I Seek You”，是一种基于 Internet 的即时通信服务，用户可通过该应用在线交流，支持文本、语音、公告板、文件传输和电子邮件。\n\
  \nIDE: 集成设备电子\n\nIntelligent Cabling: 该领域正在进行研究，旨在消除大型的物理路由器、集线器、交换机、防火墙等硬件，将这些功能（即嵌入式智能）直接嵌入布线中。目前仍处于电化学/神经元研究阶段。\n\
  \nInternet: 全球计算机网络，连接并使得较小的网络能够通过标准化通信协议共享信息。虽然常说 Internet 不受任何单一实体控制或所有权，但这往往具有误导性，让许多用户误以为\
  \ Internet 没有人在管理。实际上，Internet 的正常运作必须在关键位置部署主要的电信交换机、路由器、卫星和光纤链路，这些设备均由少数大型企业拥有。这些企业随时可以关闭这些设备（从而关闭\
  \ Internet），或限制仅允许特定国家/地区使用，或对网络上的通信进行监控和控制。\n\nIP: 互联网协议\n\nISP: 互联网服务提供商，负责向最终用户提供\
  \ Internet 接入。虽然不必通过 ISP 才能接入 Internet，但这是大多数人使用的常规方式。\n\nIRC: 互联网聊天室，是一种需要在本机安装应用的服务，支持在线交谈、文件传输以及私聊。主要的\
  \ IRC 网络包括 IRCnet 和 DALnet。\n\nJPEG: 联合摄影专家组\n\nMAC Address: 媒体访问控制地址，是网络接口卡（NIC）内部嵌入的唯一编号，用于标识发送数据的机器并在数据链路层对数据进行寻址。\n\
  \nMD5: 消息摘要 5\n\nMessage Digest: 例如 MD5，消息摘要是由算法对数字对象（如你输入的文本）进行数学处理后生成的字母数字组合，形成该对象的数字指纹，用于验证消息的完整性。\n\
  \nMLA: 多日志分析\n\nModem: 调制解调器，是通过串行线（通常是电话线）将计算机或其他网络设备连接起来的硬件。发送时，调制器将数字数据转换为模拟信号；接收时，解调器将模拟信号转换回数字信号，供计算机识别。\n\
  \nNAT: 网络地址转换，用于隐藏内部网络的 IP 地址不被外部观察。NAT 盒子让网络管理员可以在内部网络中使用任意 IP 地址，从而缓解 IP 地址紧缺问题，同时隐藏内部主机免受攻击。\n\
  \nNetwork Layer: ISO 参考模型中的网络层，负责对信息进行寻址和路由以送达目的地。可想而知，该层就像邮局，依据信封上的地址投递信件。\n\n\
  Newsgroups: 通常是讨论性的，但不是实时交互的。新 sgroups 类似于在公告板上贴出消息，然后在不同时间检查是否有人回复。\n\nNFR: 网络飞行记录器\n\
  \nNFS: 网络文件系统\n\nNIC: 网络接口卡，是网络线缆插入计算机背部的卡片，负责将计算机连接到网络。主机至少需要一个 NIC，可能有多个。每个 NIC\
  \ 都会被分配一个 MAC 地址。\n\nNIST: 国家标准技术研究所\n\nNSCID: 国家安全委员会情报指令\n\nNSRL: 国家软件参考库\n\n\
  NTFS: 新技术文件系统\n\nNTI: 新技术公司\n\nNSA IAM: 国家安全局信息保障方法论师\n\nNSC: 国家安全委员会\n\nOSS: 战略服务办公室\n\
  \nPCI: 外围组件互连\n\nPERL: 实用提取和报告语言\n\nPGP: 很好的隐私\n\nPhysical Layer: ISO 参考模型中的物理层，由实际携带数据的布线及网络设备组成。\n\
  \n\n\n\n- **Port:** 一个 TCP/IP 协议套件中用于标识服务和应用的数值。例如，HTTP 网络流量使用端口 80。（见附录 C 以获取这些端口的列表。）\n\
  \n- **Presentation Layer:** ISO 参考模型的层，负责格式化和转换数据以满足所使用的特定系统的要求。\n\n- **PSP:** 私营部门职位\n\
  \n- **PST:** 个人存储文件夹\n\n- **RAID:** 冗余磁盘阵列（Inexpensive Disks）\n\n- **Router:** 连接两个或多个网络的网络节点，用于在网络之间发送数据（例如从\
  \ `137.13.45.0` 发送到 `43.24.56.0`）。这些网络可能都使用以太网，也可能是以太网与 ATM（或其他网络技术）组合。只要两者都使用共同的协议（如\
  \ TCP/IP 协议套件），即可通信。\n\n- **RSA:** Rivest‑Shamir‑Adleman\n\n- **SAM:** Security\
  \ Account Manager\n\n- **SB:** SafeBack\n\n- **Search Engine:** 基于用户提供的关键词或短语定位数据的\
  \ Internet 资源。这是当前互联网查找信息的主要方法。当前搜索引擎效率不高，但正在进行改进数据收集/过滤技术的研究。\n\n- **Session Layer:**\
  \ ISO 参考模型的层，协调网络节点之间的通信。可以用于初始化、管理和终止通信会话。\n\n- **SFA:** 软件取证分析\n\n- **Software:**\
  \ 在内存中运行的计算机/网络设备程序，用于执行某些功能。\n\n- **STU III:** 安全电话单元 – 第三代\n\n- **TCP:** 传输控制协议\n\
  \n- **TCP/IP:** 一个互联网协议套件。其结构如下：\n\n    - 进程层客户端：`FTP`, `Telnet`, `SMTP`, `NFS`,\
  \ `DNS`\n\n    - 传输层服务提供者：`TCP`（`FTP`, `Telnet`, `SMTP`）\n\n    - `UDP`（`NFS`, `DNS`）\n\
  \n    - 网络层：`IP`（`TCP`, `UDP`）\n\n    - 访问层：`Ethernet`（`IP`）\n\n    - 令牌环（`IP`）**`TCP\
  \ Sequence Prediction`**:** 通过伪造数据包来欺骗使用 IP 地址进行身份验证的应用程序（如 UNIX `rlogin` 和 `rsh`\
  \ 命令），使其误以为伪造数据包实际来自受信任的机器。\n\n- **TraceRoute:** 在源机器（攻击机）上运行 `traceroute` 或 `finger`\
  \ 命令，获取关于攻击者的更多信息。\n\n- **Transport Layer:** ISO 参考模型的层，负责在通信网络上管理数据的传输。\n\n- **TS/SCI/LP:**\
  \ 机密敏感隔离信息生活方式体检\n\n- **Tunneling:** 使用身份验证和加密设置虚拟专用网络（VPN）。\n\n- **URL:** 统一资源定位符\n\
