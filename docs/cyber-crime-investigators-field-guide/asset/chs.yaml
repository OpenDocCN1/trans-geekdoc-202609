  \  - Sanitization\n\n\n\n\nWhy is it that many railroads avoid “security automation”\
  \ tools to a degree? It’s because in numerous arenas, the security automation that\
  \ was supposed to help the organization (and it did for a time) ended up being the\
  \ very thing compromised by malicious actors, much to the chagrin of the organizations\
  \ opting for security automation. So, what do we do…throw the baby out with the\
  \ bathwater? No! Security automation to a degree is fine, but don’t let it be your\
  \ end all and be all. Break up the security automation with some “manual portions”\
  \ …items where you have to actually get up out of your seat and do something to\
  \ make the process continue. Yes, it does adversely impact efficiency, but on the\
  \ other hand it gives you control of that automated security process that was put\
  \ into place. Even if a malicious actor gains control of your security automation\
  \ capability, it only carries them so far. Once they encounter the manual breaks\
  \ that require someone to actually get up and do something…the hackers are stuck,\
  \ and can proceed no further until one or more manual steps are performed, and they\
  \ would need the right inside person to carry out those steps. An example (and this\
  \ is just an example, use your imagination to come up with ideas of your own) of\
  \ a manual step would be someone has to get up, place a DVD into a system, let the\
  \ software on the DVD activate, which then allows the process to continue. The DVD\
  \ is removed from the system and placed in a secure location when not being used.\
  \ It is not left in that system. There should be at least two manual breaks in your\
  \ security automation.\n\nVirtual signaling is considered a newer method of train\
  \ control (note VPM-3 executive software which is for virtual signaling; note that\
  \ ITCS virtual signaling is in place today) and the rail industry is now moving\
  \ into Predictive Analytics for diagnostics/maintenance activities. Pulsed Amplitude\
  \ Modulation (PAM) is used in the rail industry and has eight different amplitude\
  \ levels to communicate 3 bits per symbol. So, a 45-bit message can be transmitted\
  \ with 15 symbols in approximately 800 msec. These signals can be transmitted at\
  \ either baseband (DC) or carrier frequency (45 Hz +/- 15 Hz, so 30 to 60 Hz). Matched\
  \ filter processing at the receiver ensures the signal has the expected shape, which\
  \ provides additional security from electromagnetic interference (EMI) or other\
  \ malicious acts.\n\nWSDMM\n\n*   A device that collects/connects Wayside data\n\
  \nDAU\n\n*   A Wayside sensor\n\nATC\n\n*   Automatic Train Control \n\n    *  \
  \ Note that ATC has three subsystems \n\n        *   – ATP = Automatic Train Protection\n\
  \n        *   – ATO = Automatic Train Operation\n\n        *   – ATS = Automatic\
  \ Train Supervision\n\n*   For some rail networks, ATC is based on AccuTrack high\
  \ frequency track circuit\n\n*   ATC is essentially deals with communication with\
  \ train operations via cab signals and Wayside signals\n\nInfrared, magnetometers,\
  \ and/or lidar/radar are used in island detection at railroad crossings in some\
  \ locations. This is relatively new. From a forensics standpoint, it could well\
  \ be that your background does not include thorough knowledge of railroad products\
  \ that may fall into your line of investigation. You have the options of Internet\
  \ research (which may or may not be successful), finding and interviewing someone\
  \ who does know the railroad products of interest, or you can just consider the\
  \ rail product a black box and focus on the inputs and outputs. Either of the three\
  \ options can work for you, depending on the situation at hand.\n\nAlthough it makes\
  \ the rail network more vulnerable from a security perspective, most network engineers\
  \ nowadays opt for ethernet instead of serial cables because it gives them more\
  \ connectivity options and of course the system management benefits. Some rail entities\
  \ are also using cloud technology now, usually Microsoft Azure. Not all, but some\
  \ Wayside’s now have a network appliance inside the bungalow that monitors critical\
  \ components and provides easily accessible logs for incident analysis (so it’s\
  \ to this type of device you want to go to at the Wayside during a forensics investigation\
  \ if it exists there). Also, some railways are looking to stream all of their logs\
  \ 24/7, so look into that also. Rail systems are getting more and more into Big\
  \ Data Analytics and Predictive Analytics for maintenance purposes, so that is another\
  \ avenue you need to look into to see if it exists during an investigation. Make\
  \ a search for XTS files also since these are in use for Wayside scripts, etc. ([`www.datacamp.com/community/blog/r-xts-cheat-sheet`](https://www.datacamp.com))\n\
  \nDuring the design process, rail product engineers make use of ladder logic equations,\
  \ so you’ll want to look into this also ([`www.plcacademy.com/ladder-logic-tutorial/`](https://www.plcacademy.com))\n\
