  \ **Start Analysis** 开始分析。\n\n![Figure 6.20 Search screen.](img/fig6.20.jpg)\n\n\
  *Figure 6.20* Search screen.\n\n点击 **Bookmarks** 标签页，即可查看关键词（如图 6.21 所示）。在放大镜图标（旁边标有\
  \ “Search”）的方框内点击，所有搜索词前的复选框会瞬间出现蓝色对勾。\n\n![Figure 6.21 Viewing the keywords.](img/fig6.21.jpg)\n\
  \n*Figure 6.21* Viewing the keywords.\n\n点击某个搜索词后，相应的关键词会被高亮显示。例如，点击关键词 “Patty”，即可看到如图\
  \ 6.22 所示的搜索结果。可以看到我们获得了一些有价值的信息，后续需要交给执法部门处理。\n\n![Figure 6.22 Search results from\
  \ “Patty.”](img/fig6.22.jpg)\n\n*Figure 6.22* Search results from “Patty.”\n\n在底部窗格（如图\
  \ 6.23 所示），可以看到所选关键词周围的全部上下文文本。\n\n![Figure 6.23 Text surrounding the keyword.](img/fig6.23.jpg)\n\
  \n*Figure 6.23* Text surrounding the keyword.\n\n对关键词 “bitchx”（黑客工具）进行搜索，显示该系统使用了该工具（如图\
  \ 6.24 所示）。对关键词 “crack” 进行搜索，则揭示了用于破解密码的 xcrack 工具（如图 6.25 所示）。\n\n![Figure 6.24\
