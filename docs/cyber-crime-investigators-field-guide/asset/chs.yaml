  \n![](img/inline12.3.jpg)  \n\n此外，现代列车上还配备了可联网的内置麦克风和摄像头，用于监控潜在的恐怖袭击、犯罪活动等。电子乘客指示牌（显示乘客信息的电子标识）也必须得到保护（包括编写安全的软件），因为通过\
  \ Google 搜索可以找到过去被黑客入侵的交通标识。用于与列车通过维护端口进行交互的诊断软件会放置在带有正确代码、协议和其他嵌入式安全措施的维护笔记本电脑上。其他需要进行漏洞评估和渗透测试的铁路网络关键要素包括售票机、售票站以及整体通信系统。\
