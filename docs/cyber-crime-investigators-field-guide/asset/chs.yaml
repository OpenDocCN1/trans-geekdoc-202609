  \ statement “Suspicious access to SAM “(This is serious. The SAM registry can be\
  \ hacked. It can mean passwords for the system have been compromised.)”\n\nNames,\
  \ conversations, and other data\n\nA number of English word statements\n\nI will\
  \ now use the Text Search Plus program. Based on all the information collected thus\
  \ far, there is a strong indication that the web server may be remotely controlled\
  \ by an off-site third party (hacker). This can be done by the IIS4 exploit mentioned\
  \ above. It can also be done in other ways. Recall that you typed txtsrchp to access\
  \ this program on drive D. I know from prior experience that B02K (Back Orifice\
  \ 2000) is a hacker program that can remotely control an NT server. I used keywords\
  \ such as crtdll.dll, msadp32.acm, and msacm32.dll and searched the slack file Nortelem_Slack\
  \ for these files. Sure enough, I found all of them. This indicates that another\
  \ exploit has also been used against this box – B02K. This is serious. Someone has\
  \ absolute control of this web server from remote locations. This would also be\
  \ attributed to the hackers that we found earlier on the system (named above).\n\
  \nAgain, I notified the client that this machine was under remote control. I am\
  \ still waiting to hear whether or not other machines trusted the compromised system.\
  \ If so, other systems at Nortelem could have had their data altered, copied, stolen,\
  \ etc. This is quite serious for Nortelem. To find out whether other Nortelem systems\
  \ are running B02K (and to kill it if they are), their system administrators can\
  \ do the following:\n\n*   First kill the B02K process running in RAM.\n\n*   Delete\
  \ all signs of B02K in the registry.\n\n*   Delete any B02K-related files.\n\n*\
  \   Reboot the systems.\n\n\n\n进入`/path/to/xxx`目录，找到`xxx.json`。\n\n在表达式`cvar = avar\
  \ + bvar`中，加法运算符（`+`）将`avar`与`bvar`相加，得到它们的和`cvar`\n\n在`List.of(arg0, arg1, arg2)`中，`List`接口的工厂方法`of()`接受一系列的元素，返回包含它们的只读列表。\n\
  \n之后我们这样调用`cmd`命令：`cmd arg0 arg1 arg2`。\n\n```\nif (condVar > someVal) {console.log(\"\
  xxx\")}\n```\n[/content]\n\n[content]\nWord was received from Nortelem that trust\
  \ relationships involving the compromised web server were set up for a number of\
  \ internal systems. At the same time, I was also told that Nortelem did not properly\
  \ document these trust relationships. There was no choice now but to go to each\
  \ system individually and check them. This will be a time-consuming and tedious\
  \ job. Corporations should never tie their internal intranet and Internet web server\
  \ into the same system. Also, trust relationships between systems should be evaluated\
  \ very carefully before implementing them. If implemented, they should be carefully\
  \ documented. Using the same search engine/network security sites as before, a search\
  \ is done on the hacker names found during the analysis phase. It is found that\
  \ these individuals have hacked into a number of systems in the past. An additional\
  \ find based on the above information is that common gateway interface (CGI) scripts\
  \ were written in an insecure manner. This has been a source of major security problems\
  \ in the past for web servers in general.\n\nIn a formal report, the following recommendations\
  \ were made to Nortelem.\n\n### Recommendations\n\nTo recover from B02K and other\
  \ changes made by hackers:\n\n*   Format drive.\n\n*   Load NT O/S from a trusted\
  \ source.\n\n*   Load SP6A and the latest release of IIS.\n\n*   Ensure all user\
  \ accounts are valid.\n\n*   Change all passwords and use strong pass phrases.\n\
  \n*   Load basic website (not the CGI scripts you wrote).\n\n*   Put the basic website\
  \ on the network.\n\n*   Perform a remote penetration test.\n\n*   If CGI scripts\
  \ must be on the web server, clean up the CGI scripts and load them back on the\
  \ server.\n\n*   Perform a second penetration test.\n\n*   Perform a penetration\
  \ test at least monthly for the rest of the year since this web server is a target.\n\
  \n*   Check other boxes for “infections.”\n\n*   Do not host the intranet and Internet\
  \ on the same box.\n\n*   Ensure that your virus signatures are up to date and run\
  \ virus checks on the web server at least once per week.\n\n*   Check the Microsoft\
  \ website regularly for NT security patches and IIS updates/patches.\n\n#### Passwords\n\
  \nPasswords are your first line of defense. They must be strong and yet easy for\
  \ the end user to type and remember. Passwords should meet the following requirements:\n\
  \n1.  The password should not contain any word used in any dictionary in the world,\
  \ nor should it be the name of a popular person or machine (radio/television, etc.).\n\
  \n2.  The password should be composed from a pass phrase that the end user makes\
  \ up. For example, if I make up the phrase “The satellite will launch in 30 minutes,”\
  \ my password becomes the first character of each word and the numbers I typed.\
  \ So the above password is tswli30m. This password is easy to remember because the\
  \ user made up the phrase and it is easy to type. You can also include special characters\
  \ (such as !, #, or &) if you wish. This type of password is also very difficult\
  \ to break if a hacker is using a password-cracking program.\n\n3.  The password\
  \ should be a minimum of eight characters. Even if the hacker is using a password-cracking\
  \ program on a high-end machine, it will take much, much longer to break an eight-character\
  \ password than a seven-character password. Most hackers are impatient and will\
  \ stop the cracking process, moving on to an easier target.\n\n4.  Change passwords\
  \ every 30 days. As many as 60 days may be used, but doing so increases your exposure.\
  \ If someone is really focused on breaking into one or more of your systems and\
  \ is using a very high-end machine to do the processing, allowing 60 days makes\
  \ it more likely that the hacker will succeed. Trying to do it in 30 days is nearly\
  \ impossible if strong passwords are used.\n\n5.  System administrators should use\
  \ password-cracking programs such as L0phtCrack ([`www.helpnetsecurity.com/2012/09/30/l0phtcrack/`](https://www.helpnetsecurity.com))\
  \ and John The Ripper ([`www.openwall.com/john/`](https://www.openwall.com)) with\
  \ NT extensions.\n\n#### SAM file\n\nRestricting access to the SAM file is critical.\
  \ Physically locking up servers is the only way to prevent someone from walking\
  \ up with a diskette and booting to DOS to obtain the SAM or copying the backup\
  \ SAM\\_ from the repair folder.\n\nThe SYSKEY.SAM encryption enhancement should\
  \ also be used. SYS-KEY establishes a 128-bit cryptographic password encryption\
  \ key, rather than the 40-bit key that is provided with the server, and is used\
  \ by default. It can be configured by selecting Start Menu | Run and typing syskey.\n\
  \n#### Intrusion Detection Systems\n\nIntrusion Detection Systems (IDS) should be\
  \ installed in your network at either the box, subnet, departmental, or enterprise\
  \ level. I recommend a combination of ISS RealSecure, CMDS, Cisco NetRanger, and\
  \ Checkpoint\n\nFirewall-1 (or Cisco PIX). I recommend using these four together\
  \ because the vendors have worked together and all of the products “talk” to one\
  \ another and interact with one another, and one centralized report can be generated.\n\
  \n#### Insecure CGI Scripts\n\nThe following websites provide the documents you\
  \ must review to secure your public web server and write secure CGI scripts:\n\n\
  [`www.sei.emu.edu/pub/documents/sims/pdf/`](http://www.sei.emu.edu) sim011.pdf\n\
  \nThis .pdf document states specifically how to secure your public web server. Follow\
  \ the recommendations. They work. Note the attached html files that deal with writing\
  \ secure CGI scripts. Also go to the following web pages that deal with writing\
  \ secure CGI scripts:\n\n*   [`www.go2net.com/people/paulp/cgi-security`](http://www.go2net.com)\n\
  \n*   [`www.sunworld.com/swol-04-1998/swol-04-security.html`](http://www.sunworld.com)\n\
  \n*   [`www.w3.org/Security/Faq/wwwsf4.html`](http://www.w3.org)\n\n*   [`www.csclub.uwaterloo.ca/u/mlvanbie/cgisec`](http://www.csclub.uwaterloo.ca)\n\
  \n#### BO/BO2K\n\nBO/BO2K have the following characteristics:\n\n*   BO filenames\
  \ by default are [spacel.exe, boserve.exe, boconfig.exe]\n\n*   BO2K filenames by\
  \ default are bo2k.exe, bo2kcfg.exe, bo2kgui.exe, UMGR32.EXE, bo_peep.dll, bo3des.dll.\n\
  \n*   Operates over UDP.\n\n*   The default port is 31337 for BO.\n\n*   The default\
  \ configuration for BO2K is to listen on TCP port 54320 or UDP 54321, to copy itself\
  \ to a file called UMGR32. exe in%sys- temroot%, and to install itself as a service\
  \ called “Remote Administration Service.” These values can be altered by using the\
  \ bo2kcfg.exe utility that ships with the program.\n\n*   A BO plug-in known as\
  \ Saran Wrap hides BO within an existing standard InstallShield installer package,\
  \ making it easier to entice system users to execute it. Another plug-in called\
  \ Silk Rope links BO with another harmless executable, but one double click launches\
  \ them both, with a behind-the-scenes installation of BO. Even though it has not\
  \ been seen yet, a macro virus carrying BO might be coming our way.\n\nThe case\
  \ is now complete. Carefully store all evidence, label it properly, and always maintain\
  \ chain of custody. Even though the client does not wish to pursue this any further\
  \ at this time (they now know what was wrong and what to do to correct the problem),\
  \ in the years to come they might decide to go to court. This means evidence must\
  \ be kept secured as mentioned. I use mcrypt to encrypt and protect the evidence\
  \ I have collected.\n\nNortelem does not wish to pursue this in court because:\n\
  \n*   It gives them publicity they do not want. (Their reputation could be adversely\
  \ affected.)\n\n*   It could tie up their legal department for a long time.\n\n\
  *   It requires an additional expenditure of funds.\n\n## Chapter 12 Rail transportation\n\
  \nDOI: [10.1201/9781003134817-12](https://doi.org/10.1201/9781003134817-12)\n\n\n\
  \n\n我再次指出，Alstom（Alstom.com）在铁路交通领域的网络安全方面是一位伟大的领导者。下面我们简要查看他们的产品，但您也应该查看他们的优秀白皮书：[`www.alstom.com/sites/alstom.com/files/2020/09/15/Whitepaper%20Cybersecurity.pdf`](https://www.alstom.com)\n\
  \n首先，由于术语的历史使用，关于何时使用工业控制系统（Industrial Control System，ICS）和监控控制与数据采集系统（Supervisory\
  \ Control and Data Acquisition，SCADA）的争论仍在继续，尚未结束。如果您在工业自动化领域工作了数十年，那么这对您来说就很明确。但这里讨论的并不仅仅是行业专业人士。有人会说\
  \ SCADA 是 ICS 的子集。然而，对公众、各政府委员会成员以及媒体（在线、报纸、杂志、广播、电视）而言，SCADA 这个术语已经很为人知并被广泛使用。因此，我在此坚持使用\
  \ SCADA 这一术语。\n\n铁路系统本质上是一个滚动的 SCADA 系统（列车本身），它与路边设备（位于列车外部的设备，安装在我们称之为“小屋”的盒子中，以及铁路轨道旁的其他设备……受摄像头等监控）以及通信。控制中心（RCC）负责列车监控和控制，卫星、基站也参与其中。这里不再展开更多细节，足以用于网络取证用途。\n\
  \n我也想提及信息技术（IT）和运营技术（OT）这两个术语。OT 指的是用于管理 ICS/SCADA 系统的计算机网络/系统，而 IT 指的是用于商业/行政管理的计算机网络/系统。我可以指出，区分\
  \ IT 与 OT 的主要方式是：如果 IT 服务器/计算机/系统出现问题，可能只需重启或打补丁；但如果 OT 服务器/计算机/系统出现问题，则不能简单“重启”或“打补丁”，后果可能是人员伤亡、工厂爆炸、核设施灾难（如冷却系统失效）、污水处理厂公共供水被污染或列车脱轨。铁路系统根据您当前关注的系统部分，既包含\
  \ IT 网络也包含 OT 网络。您还可以引入物联网（IoT）概念，因为铁路系统中也嵌入了 IoT 设备。IoT 设备是物理硬件/软件实体（例如传感器），它们通过\
  \ Internet 进行监控、控制和数据交换。\n\n下面我们进入正题，了解与铁路行业设备和网络相关的关键内容，因为我相信大多数读者可能没有此领域背景。下面是一些典型的电子设备，它们与铁路系统网络相连：\n\
  \n*   闭路电视（CCTV）\n\n*   建筑自动化\n\n*   Wi‑Fi\n\n*   人机接口（HMI）\n\n*   访问控制系统（ACS）\n\
  \n*   信息目的信息亭（及更多）\n\n*   语音无线电系统\n\n*   安全网关（SGW）\n\n*   乘客计数系统（PCS）\n\n*   电子邮件、打印机、文件共享等\n\
  \n*   电话/对讲系统\n\n*   公共广播与客户信息系统（PACIS）\n\n*   停车管理\n\n*   票务/付费系统\n\n*   车辆维护\n\
  \n*   视频会议\n\n*   全球定位系统（GPS）\n\n*   列车控制管理系统（TCMS）\n\n*   数字标牌\n\n*   车辆段远程控制（此前曾被恶意\
  \ actors 通过中间人攻击成功……后续将详述）\n\n*   防火墙（FW）\n\n从上述列表可以看出，我们在本书先前章节中讨论的大多数项目与普通业务网络相同类型，因此相同的取证流程、程序和工具可以应用于这些项目（当然并非全部，后续再说明）。这对网络取证调查员/分析师而言是好消息。而且，上述所有项目过去都曾被恶意\
  \ actors 入侵，包括通过中间人攻击成功劫持车辆段远程控制的案例……该攻击之所以成功，是因为所使用的通信协议存在弱点。\n\n我们从高层（50,000‑foot）视角开始讨论网络，涉及的内容在本书其他章节有更详细阐述，若您感兴趣，也需要自行进行网络研究。请记住，如果在阅读本节时您产生“这从哪里来的？”或“他在在说什么？”的疑问，说明您可能漏掉了本书对应的阐述，或者需要自行进行补充研究。\n\
