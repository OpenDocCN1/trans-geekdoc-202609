  \ Appendix ECisco firewall commands\n\nCurrently, firewalls are the primary devices\
  \ used to protect the outside perimeter of a corporate, military, or government\
  \ network infrastructure. Properly configured, a firewall can be very useful in\
  \ preventing malicious users on the public Internet from accessing private data,\
  \ even when the organization has a connection to the Internet. Cisco is a major\
  \ supplier of Internet infrastructure devices, such as routers, firewalls, and virtual\
  \ private networks (VPNs). Because most networks encountered will have a firewall,\
  \ and because Cisco is a major supplier of network infrastructure components, the\
  \ commands used on a Cisco PIX firewall will be covered.\n\n## PIX command reference\n\
  \n“Help” information is available by entering a question mark by itself for a listing\
  \ of all commands or with a “command space ?”.\n\nYou can add comments to your configuration\
  \ by entering a colon as the first command in a line. Use comments to improve configuration\
  \ file readability or to make configuration file commands not executable.\n\n**Note:**\
  \ cm = configuration mode, pm = privileged mode, and um = unprivileged mode.\n\n\
  | age 15 || 设置私有链路密钥的有效期为 15 分钟，cm。 |\n\n| --- | --- |\n\n| apply || 将出站访问控制列表应用于\
  \ IP 地址，cm。使用出站列表来允许或禁止访问系统端口。 |\n\n| arp || cm. 向 PIX 防火墙的 ARP 表添加条目，arp 是一种低层\
  \ TCP/IP 协议，用于根据 IP 地址解析节点的物理地址。 |\n\n| arp timeout 42 || cm. 修改 ARP 表条目的有效时间，条目在\
  \ ARP 表中存在 42 秒后被清除。默认是 4 小时。 |\n\n| auth || 启用 PIX 用户认证，cm。最多 5 次登录机会。 |\n\n| auth-server\
  \ || 指定认证服务器的 IP 地址，cm。 |\n\n| auth-user || 指定认证用户的 IP 地址，cm。允许为 IP 地址提供认证服务。 |\n\
  \n| clear apply || cm. 清除对 IP 地址的之前的 outbound 访问控制列表应用。 |\n\n| clear arp || pm.\
  \ 清除 PIX 的 ARP 表条目。可以通过 MAC 或 IP 地址清除。 |\n\n| clear auth-user || cm. 移除 IP 地址的认证访问权限。\
  \ |\n\n\n\n\n| 明确 auth-server || cm. 指定认证服务器不再处理认证请求。 |\n| clear http || cm. 移除对\
  \ IP 地址的 HTTP 访问。 |\n| clear outbound || cm. 清除出站访问列表。 |\n| clear route || cm. 清除内部或外部接口的路由表。\
  \ |\n| clear snmp-server || cm. 清除 SNMP 连接或位置，或停止发送 SNMP 事件数据。 |\n| clear syslog\
