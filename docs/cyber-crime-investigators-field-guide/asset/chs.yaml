  if (condVar > someVal) {console.log(\"xxx\")}\n```\n\n# 2. 犯罪现场拍照步骤\n\nIf allowed,\
  \ photograph the crime scene. This includes the area in general, computer monitors,\
  \ electronic instrument information from devices that are lying around in the area\
  \ (cell phones, pagers, etc.), and cabling connections (including under the floor\
  \ if it is a raised floor). Make sketches as necessary. If there is an active modem\
  \ connection (flashing lights indicating communication in progress), quickly unplug\
  \ it and obtain internal modem information via an rs-232 connection to your laptop.\
  \ Look at raised ceilings. Is it normal for a modem to be here? If so, is it normal\
  \ for it to be active at this time?\n\n# 3. 确定是否有其他人通过 Solaris 1 远程登录并查看系统近期活动\n\
  \nYou now want to find out whether anyone else is on Solaris 1 (remotely) and what\
  \ has been going on with the system recently. What UNIX commands should you use?\n\
  \n* script a:\\\\SaturnNightsSolarisEvidence1: Opens a text file that will store\
  \ everything you do on this system. Note that we are sending our data to a floppy\
  \ drive, not to the hard drive of the Solaris system.\n\n* Date: To have the date/time\
  \ in this log.\n\n* Who: To obtain a list of currently logged in users.\n\n# 4.\
  \ 判断 Leopoldl 的来源含义\n\nYou notice someone on Solarisl named Leopoldl coming from\
  \ 221-4l-12.galaxy.com. What does this indicate?\n\n> Leopoldl is attached to Solarisl\
  \ via an ISP named galaxy.com.\n\n# 5. 显示所有 TCP/IP 连接\n\nYou now want to display\
  \ a list of recent and current Transmission Control Protocol/Internet Protocol (TCP/IP)\
  \ connections to the system.\n\nnetstat -a\n\nWhen you performed the last command,\
  \ you noticed a.telnet at the end of your system name. What does this indicate?\n\
  \nThere is a telnet connection between Solarisl and Leopoldl (on 221-41-12.galaxy.com).\n\
  \n# 6. 获取 Leopold1 的近期登录记录\n\nYou now want to obtain a list of recent logins pertaining\
  \ to Leopold1.\n\nlast Leopold1\n\nThe results of your last command indicate that\
  \ Leopoldl logged in earlier during the day and is currently logged into Solarisl.\
  \ You want to see all the processes running in memory that Leopoldl is running.\
  \ What do you type?\n\nps -aux | grep Leopold1\n\nThe results of your last command\
  \ indicate that the following processes are running that belong to Leopold1: 2365,\
  \ 2287, 2087, and 2001. In these processes you see two that alarm you. One is “Sniffer”\
  \ and the other is “256:47 rsh [www.cirrus.com](http://www.cirrus.com) exec/tmp/.hidden/BeatYou.”\
  \ This indicates the following:\n\n* “Sniffer” indicates that Leopold1 has planted\
  \ a device to monitor Solaris1 for logins, user IDs, passwords, specific traffic.\n\
  \n* The other indicates that for 256 minutes and 47 seconds the program BeatYou\
  \ has been running on a remote computer system named [www.cirrus.com](http://www.cirrus.com)\
  \ using the remote shell command rsh.\n\n# 7. 通知 FBI 并进行取证\n\nYou notify the FBI\
  \ agent working with you as to what you have found. He immediately utilizes bureau\
  \ contacts and gets in touch with the ISP (Internet Service Provider) galaxy.com,\
  \ then leaves for the ISP site. The ISP also does a traceback while the FBI agent\
  \ is on site and determines exactly where Leopold1 is coming from. The ISP moves\
  \ all logs pertaining to Leopold1 to a trusted system and backs them up to a DAT\
  \ tape. An FBI agent picks up the tape and brings it to you at SaturnNights. You\
  \ are now directed to remove Leopold1 from the system, collect RAM (Random Access\
  \ Memory) evidence, and collect all evidence from the Solaris1 hard drive. What\
  \ steps do you follow to remove Leopold1 and collect RAM evidence?\n\nTo remove\
  \ Leopold1 from the system, just remove all of his processes:\n\n* kill -9 2365\n\
  * kill -9 2287\n* kill -9 2087\n* kill -9 2001\n\nTo collect RAM evidence:\n\nps\
  \ -aux > a:\\\\SolarislRAMproc\n\nThis shows you all processes running and collects\
  \ this information to diskette.\n\nYou photograph the screen showing the information\
  \ on the processes. The Solaris1 expert tells you about each process that is running\
  \ and tells you there is a battery backup on the box. He opens the box and disconnects\
  \ it. You now pull the plug on the back of the box, which makes the box shut down\
  \ ungracefully and causes a panic, and all RAM information is written to a core\
  \ file.\n\nSolaris 1 is now inactive. The evidence cannot leave the site. You have\
  \ to do your analysis on site using the CF tools you brought with you. The FBI has\
  \ supplied you with a “scrubbed” Intel-based PC (personal computer) running Windows\
  \ XP. Also included are a diskette drive, a CD-ROM drive, and a new external 200-GB\
  \ hard drive that you will use to hold the bitstream backup of the Solaris 1 system.\
  \ In this case we will use SafeBack (from NTI \\[New Technologies, Inc.\\]) to obtain\
  \ this bitstream backup (we covered its use in a prior chapter).\n\nNow we can pick\
  \ up where we left off earlier. Lib27.s01 will represent the evidence we have collected\
  \ from the Solarisl system. Figure 5.4 shows where we are.\n\n![Figure 5.4 Evidence\
  \ we have collected from the Solarisl system.](img/fig5.4.jpg)\n\n*Figure 5.4* Evidence\
  \ we have collected from the Solarisl system.\n\nIf I click the Total File Items\
  \ button in the top left pane, I see the entry shown in Figure 5.5 in the bottom\
  \ pane.\n\n![Figure 5.5 Entry shown in the bottom pane.](img/fig5.5.jpg)\n\n*Figure\
  \ 5.5* Entry shown in the bottom pane.\n\nNotice in Figure 5.5 that I also placed\
  \ a check in the checkbox on the left. In the top right pane, I see the partial\
  \ contents of the LIB27.S01 file, as shown in Figure 5.6.\n\n![Figure 5.6 Partial\
  \ contents of the LIB27.S01 file.](img/fig5.6.jpg)\n\n*Figure 5.6* Partial contents\
  \ of the LIB27.S01 file.\n\nNotice the scroll bars on the right. I could scroll\
  \ through the rest of this file if I so desired. Remember that we are “pretending”\
  \ that this LIB27.S01 file is the contents of an entire hard drive. If it really\
  \ were, it would be very time consuming and tedious to scroll through the entire\
  \ file searching for evidence related to the crime at hand. What we want to do instead\
  \ is to perform a search. Recall the tabs along the top of the screen in Figure\
  \ 5.4.\n\nLet us click the Search tab and see what we come up with on the screen\
  \ shown in Figure 5.7.\n\n![Figure 5.7 Clicking the Search tab.](img/fig5.7.jpg)\n\
  \n*Figure 5.7* Clicking the Search tab.\n\nIn the top left pane notice that both\
  \ Indexed Search and Live Search appear. An indexed search is much faster than a\
  \ live search because you took the time up front to index the hard drive. This means\
  \ that when you read in the image of the hard drive, ADFTK took the time to index\
  \ the drive (i.e., it found everything on the hard drive and put the items into\
  \ alphanumeric order). As you can imagine, this makes the search function much faster.\
  \ However, if you do not have time to wait for the drive to index, then you use\
  \ the live search. In this case, the search engine starts from the beginning of\
  \ the hard drive and searches through the hard drive sector by sector looking for\
  \ the search terms (key words, numbers, phrases) that you provide.\n\nLet us take\
  \ a moment to discuss keyword generation. We will generate a short list of our own\
  \ here for demonstration purposes. In real life, these keyword lists are already\
  \ generated, based on the type of case you are working on. For instance, if you\
  \ are a DEA (Drug Enforcement Administration) agent working a drug-related case\
  \ you may have a keyword list as follows (this is only a short list to provide you\
  \ with an example):\n\n* Cocaine\n* Delivery\n* Heroin\n* Smack\n* Shipped\n* Police\n\
  \nIn a murder case, such as this one, a partial list of keywords could be:\n\n*\
  \ Poison\n* Knife\n* Weapon\n\nThese lists that are already made up are just something\
  \ to get you started. Based on interviews you do with various personnel, you will\
  \ be adding various words, numbers, and phrases to the list. Also your list will\
  \ grow as you search because you will learn more about the case as you progress\
  \ in your investigation.\n\nIf this were a hacker case, you would include terms\
  \ such as:\n\n* < Various hacker names and handles >\n\n\n\n\n-   [费曼学习法](https://wiki.example.org/feynmans_learning_method)的灵感源于诺贝尔物理奖获得者**Richard\
