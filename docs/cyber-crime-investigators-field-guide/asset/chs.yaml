  ## Chapter 5 AccessData’s Forensic Toolkit\n\nDOI: [10.1201/9781003134817-5](https://doi.org/10.1201/9781003134817-5)\n\
  \n## Creating a case\n\n让我们通过 AccessData 的取证工具包（ADFTK）来处理一个案件。为了让您在没有加载任何案件数据（即全新创建、未加载来源的情况）时看到界面样子，我们将演示整个流程（参见\
  \ Figure 5.1）。当然，您使用的工具版本可能不同，界面可能有所差异。\n\n![Figure 5.1 Evidence information.](img/fig5.1.jpg)\n\
  \n*Figure 5.1* Evidence information.\n\n点击 OK，会打开“创建新案件向导”。输入案件信息和案件描述，然后点击 Next。\n\
  \n在 Case Log Option 页面，您可以选择要记录的事件。默认选择所有事件。点击 Next 进入 Process to Perform 页面，选择要执行的过程，然后点击\
  \ Next，这会打开 Refine Case Default 页面。该页面允许您选择要观察的数据。对于新案件，点击 Include All Items，除非您只关注特定数据。\n\
  \n点击 Next 进入 Refine Index-Default 页面。这里您可以选择要索引的数据，或直接接受默认设置。\n\n点击 Next 打开 Add\
  \ Evidence to Case 页面。此页面允许您添加、编辑、删除或细化证据。点击 Add Evidence。因为我们正在分析一个单个文件（LIB27.S01），该文件包含\
  \ slack space，来源于受害者电脑，我们选择 Individual File，然后点击 Continue。高亮 LIB27.S01，然后点击 Open，这将显示\
  \ Evidence Information 页面。输入证据识别名称/编号和备注（Figure 5.2），然后点击 OK，返回 Add Evidence to\
  \ Case 页面。\n\n![Figure 5.2 The Add Evidence to Case screen.](img/fig5.2.jpg)\n\n\
  *Figure 5.2* The Add Evidence to Case screen.\n\n[Figure 5.2] 页面允许您对已完成的操作进行修改。您可以按\
  \ Back 键向前返回至之前的页面进行必要修改。处理证据时，点击 Next 按钮，这将显示 Case Summary 页面。点击 Finish 完成证据处理。\n\
  \n证据成功处理后，保存案件为 case.dat，然后退出程序。\n\n**Working on an existing case**\n\n现在让我们双击桌面上的\
  \ ADFTK 图标重新打开该程序。ADFTK 初始化时的第一屏会提示您打开现有案件，然后点击 OK。请注意，ADFTK 设计为“案件友好”。案件已保存为 case.dat，请高亮\
  \ case.dat，然后点击 Open。您会看到 Figure 5.3 所示的界面。\n\n![Figure 5.3 Highlight case.dat,\
  \ then click Open.](img/fig5.3.jpg)\n\n\n\n\n*Figure 5.3* Highlight `case.dat`,\
  \ then click `Open`.\n\n在我们继续讨论当前正在讨论的取证工具之前，让我们先了解一下我们正在调查的谋杀案。\n\nSaturnNights\
  \ Corporation 的总裁 Jack Milner 早上 5 点早到公司。当他到达并参观设施时，在工程部发现他的行政助理 Patty Powace 正伏在电脑前，已经死亡。电脑仍然开着。由于\
  \ SaturnNights 为联邦调查局（FBI）、中央情报局（CIA）和秘密服务（项目机密 Top Secret，所有项目人员均获 TS/SCI/LP 清级），FBI\
  \ 被召来调查。基于我们在网络取证方面的专业知识，Middleton Group（TMG）受 FBI 联系并被要求提供 CFI。TMG 的客服部门已核实 FBI\
  \ 代理人的身份，并通过您的手机联系到您。FBI 不会通过电话讨论敏感案件的细节，只能面对面交流。TMG 客服部门告诉您：“KGN，AJWNAFC，太阳很热，现在。”\n\
  \n根据您对 TMG CF 代码词的了解，您认识到该信息表明 FBI 正介入；您必须立即前往 SaturnNights 公司，并携带任何在 SUN Solaris\
  \ 系统（SPARC [Scalar Processor Architecture] 平台）上工作所需的工具。您向 TMG 客服部门询问您的凭证（TS/SCI/LP\
  \ 清级）是否已传真至相应部门。您收到肯定的答复。您确认已准备好所需物品，然后离开现场。鉴于此类事件的性质，您不会携带 CIRT（计算机事件响应团队）到现场。但您已联系相应的\
  \ CIRT 人员，并告知他们您可能会联系他们寻求帮助。\n\n您到达 SaturnNights，出示证件给入口的代理人。他通过电话快速核查，检查您的黑色背包，进行搜身；随后一名随扶进入场景并带您到八楼的现场。FBI\
