    # One Hot Encoding the Output


    ![image](d2d_images/chapter_title_below.png)


    In the output layer of the neural network, we will specify the number of output
    nodes. In the last chapter, we said that in case of more than two categories (binary
    category) we will have the `N` nodes in the output layer where `N` is the number
    of categories and is greater than 2. However, to use the neural network, we also
    have to convert our output labels array into one hot encoded matrix of `K` columns
    where `K` is the unique number of categories. The following script converts our
    label array `labels` into one hot encoded matrix. Execute the following script:


    ```python

    from sklearn.preprocessing import LabelEncoder

    encoder = LabelEncoder()

    y = encoder.fit_transform(labels)

    labels = pd.get_dummies(y).values

    ```


    In the above script, we first use the `LabelEncoder` class from `sklearn.preprocessing`
    library to convert `labels` into a series of integers. We then used the pandas
    library’s `get_dummies` method to convert this series of an integer into one hot
    encoded matrix.


    Finally, let’s split the data into training and test sets:


    ```python

    from sklearn.model_selection import train_test_split

    train_features, test_features, train_labels, test_labels = train_test_split(features,
    labels, test_size=0.2, random_state=0)

    ```


    ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |

    | --- | --- | --- |

    ![image](d2d_images/chapter_title_above.png)


    # Scaling the Data


    ![image](d2d_images/chapter_title_below.png)


    For Artificial Neural Network, it is necessary to scale the data, let’s scale
    the data using standard scalar.


    ```python

    from sklearn.preprocessing import StandardScaler

    feature_scaler = StandardScaler()

    train_features = feature_scaler.fit_transform(train_features)

    test_features = feature_scaler.transform(test_features)

    ```


    ![image](d2d_images/scene_break.png)


    These are the standard steps that are required for any machine learning algorithm.
    Now we will see how we use Keras to implement Artificial Neural Network.


    ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |

    | --- | --- | --- |

    ![image](d2d_images/chapter_title_above.png)


    # Importing Keras and Libraries


    ![image](d2d_images/chapter_title_below.png)


    We will import the Keras library and its classes: `Sequential` and `Dense`. The
    `Sequential` class is used to initialize the network while the `Dense` class is
    used to add layers. Execute the following script:


    ```python

    import keras

    from keras.models import Sequential

    from keras.layers import Dense

    ```


    Before we can add layers to the network, we need to initialize the network first.
    Execute the following script to do:


    ```python

    ann_clf = Sequential()

    ```


    ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |

    | --- | --- | --- |

    ![image](d2d_images/chapter_title_above.png)


    # Adding Input and Hidden Layers


    ![image](d2d_images/chapter_title_below.png)


    To add the input and hidden layers, the `Dense` class is used. The `units` parameter
    of the `Dense` class specifies the number of output nodes in the layer. The `kernel_initializer`
    parameter specifies the type of weights that should be initially for the layer.
    The `activation` parameter specifies the activation function while `input_dim`
    specifies the number of features in the input layers. It is important to mention
    that input layers is not created separately, rather the number of nodes for the
    input layer are specified via an `input_dim` parameter in the first hidden layer
    as shown:


    ```python

    h1 = Dense(units=9, kernel_initializer=''uniform'', activation=''relu'', input_dim=11)

    ann_clf.add(h1)

    ```


    In the first hidden layer, we set the number of nodes to 9. As a rule of thumb,
    the number of nodes should be the average of input and output nodes. We have 11
    input nodes and 6 output nodes. The average is 8.5, hence we use 9 nodes in the
    hidden layers. The weights have been initialized to uniform distribution while
    the activation function is `relu` which is basically shorthand notation for rectifier
    function. In the last chapter we said that for hidden layers, `relu` function
    yields better results.


    Finally, we call the `add` function of the `Sequential` class object `ann_clf`
    and pass it the first hidden layer that we just created.


    For the next hidden layer, everything remains same except we don’t need to specify
    the input dimensions since the second hidden layer will calculate input dimensions
    from the first hidden layer. Execute the following script to add the:


    ```python

    h2 = Dense(units=9, kernel_initializer=''uniform'', activation=''relu'')

    ann_clf.add(h2)

    ```


