- raw: 'This is a very famous problem and the dataset for this problem is also available
    on [google](https://www.kaggle.com/c/dogs-vs-cats) datasets. The original dataset
    contains around 25000, images. However, for the sake of simplicity and ease of
    download, we will use only 10,000 images for training and testing. The dataset
    for this chapter can be found in the animal\_datafolder which is available inside
    the Datasets folder that can be downloaded from the link described in the description
    section of this book.


    Understanding the Data


    Before we can move forward with coding the CNN, we need to understand how the
    dataset is arranged since we do not have a single CSV file that can be used as
    a data source. Rather we have a set of images. To implement machine learning models,
    we need dependent and independent variables. The independent variables are used
    to predict the dependent variables.


    To convert a set of images into independent and dependent variables, we have several
    options. One of the options is to name each image as cats or dogs, depending upon
    the image type, followed by a unique id. The images can then be used as independent
    variables. For creating a vector of dependent variables, we can parse each image
    name and depending upon the value found i.e. cat or dog we can add a certain entry
    into the dependent variable vector. This is cumbersome and involves some custom
    code.


    However, there is a better solution inKeras. We just need to arrange images in
    the certain folder structure and Keras will automatically detect the dependent
    and independent variables. Furthermore, Keras will also detect the training and
    test sets depending upon the directory structures.


    Therefore, for Keras to understand the independent and dependent variable we have
    to arrange images in a certain folder structure.


    First, you need a top-level folder that contains both the training and test set.
    Inside the top-level folder, you need two folders, one each for training and test
    sets. Inside both the training and test sets, you need folders for each category.
    For instance, if you have two types of images i.e. cats and dogs, you will need
    to create folders for cats and dogs inside the training and test set folders.


    The directory structure we will use in this Chapter looks like this:


    ![image](d2d_images/image035.png)


    You can see that we have one top-level folder animal\_data which contains test\_set
    and training\_set folders. The animal\_data folder also contains single\_predictionfolders,
    which we will not use in this Chapter. Both the test\_set and the training\_set
    folder contains dogs and cats folder. We will use 8 thousand images for training
    and 2 thousand for testing. Therefore, the training\_set folder contains 8 thousand
    images. Both the cats and dogs folder inside the training\_set folder contain
    4 thousand images each. Similarly, cats and dogs folders in the test\_set folders
    contain 1 thousand images each. If you open the cats folder, you will see images
    of the cats, while the dog’s folder contains images of the dogs.


    The good thing about this arrangement of the dataset is that you can use it for
    any problem. For instance, if you want to classify images of cars and trucks,
    simply create folders for cars and trucks in both training\_set and test\_set
    folder and you are good to go.


    We have prepared the data for Keras. Now is the time to code the convolutional
    neural networks in Keras. Follow these steps:


    1.  Importing Libraries


    As always, the first step is to import the required libraries. Execute the following
    script:


    from keras.models import Sequential


    from keras.layers import Conv2D


    from keras.layers import MaxPooling2D


    from keras.layers import Flatten


    from keras.layers import Dense


    Let’s see what each class does. The Sequential class from the keras.modelslibrary
    is used to build a neural network that contains multiple layers. Remember, we
    used this in the ANN section as well. The next class is the Conv2D class from
    the keras.layerslibrary. As the name suggests, this layer is used to perform the
    convolution and relu function on the input image. MaxPooling2D class from keras.layerslibrary
    is used to apply max pooling to the feature map generated as a result of convolution
    operation. Next, the Flatten class is used to flatten the pooled feature map into
    a column vector. Finally, the Dense class is used to create a densely connected
    layer.


    Initialize the Convolutional Neural Network


    The first step in building any neural network is to initialize it. We did this
    in the ANN section as well. This step is the same for almost all the neural networks:


    cnn\_clf = Sequential()


    We have initialized our neural network. The next step is to add layers to this
    network.


    Adding Convolution & Pooling Layers


    The first layer that we will add to our convolutional neural network is the convolution
    layer. To create a convolution layer, we will create an object of Conv2D class.


    The first parameter to the Conv2D class is the number of feature detectors, or
    filters or kernels. It is important to mention that the number of feature maps
    generated because of convolution layer will be equal to the number of feature
    detectors. We will use 32 feature detectors for the dogs and cats image classification.
    You can play around with more.


    The second parameter to the Conv2D class is the dimensions of the feature detector.
    We know that the feature detector is a matrix that we slide over the image to
    generate feature maps. We need to specify the rows and column of feature detector
    inside the parenthesis. We will use a 3 x 3 feature detector.


    The third parameter is the input shape parameter. This is basically the shape
    of the input image that the convolutional neural network expects.


    The images that we are going to use are colored images with different dimensions.
    In the last chapter, we discussed that black and white images have only one channel.
    On the other hand, colored images have three channels: red, green and blue. Though
    our images have different dimensions we will preprocess to have dimensions of
    64 x 64 pixels.


    So for our input\_shape parameter, we will specify (64, 64, 3); 64 x 64 for the
    pixels and three for the RGB channels. Finally, we have to specify the activation
    function. As discussed in the last chapter, the activation function we will use
    is the ReLu function.


    Execute the following script to create first convolution layer.


    conv1 = Conv2D (32, (3, 3), input\_shape = (64, 64, 3), activation = ''relu'')


    To add this convolution layer to our neural network, we will use the add function
    as follows:


    cnn\_clf.add(conv1)


    The next step is to add pooling layer. For that purpose, we will use the MaxPooling2D
    class. We only need to pass the dimensions of the pooling filter. We will use
    a 2 x 2 pooling filter for this task.


    pool1 = MaxPooling2D(pool\_size = (2, 2))


    Finally, let’s add the pooling layer to our CNN.


    cnn\_clf.add(pool1 )


    Let’s add one more convolution and pooling layer and add it to our convolutional
    neural network.


    To create and add a second convolutional layer, execute the following script:


    conv2 = Conv2D(32, (3, 3), activation = ''relu'')


    cnn\_clf.add(conv2)


    It is important to mention that for the second convolutional layer, we do not
    need to specify the input shape parameter since the second convolutional can automatically
    detect the input\_shape from the previous layer.


    To create and add second pooling layer, execute the following script:


    pool2 = MaxPooling2D(pool\_size = (2, 2))


    cnn\_clf.add(pool2)


    Flattening the Input


    We need to flatten the input data before we can use it with the densely connected
    neural network. To flatten input data from the previous convolution and pooling
    layers, we can use Flatten class as follows:


    cnn\_clf.add(Flatten())


    Adding Dense Layers'
