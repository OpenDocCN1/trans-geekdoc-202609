    # Applications of Deep Learning


    ![image](d2d_images/chapter_title_below.png)


    Owing to higher accuracy, deep learning is replacing conventional machine learning
    in almost every domain where a huge amount of data is available. Following are
    some of the most famous application areas of deep learning:


    1.  Driverless Cars


    Deep learning techniques enable driverless cars to identify the obstacles on the
    road, increase and decrease the speed of the vehicle and take turns as per the
    structure of the road.


    1.  Gaming Industry


    Deep learning is being widely employed in the gaming industry to develop intelligent
    characters and players that can perform as realistically as possible. [AlphaZero](https://www.theguardian.com/technology/2017/dec/07/alphazero-google-deepmind-ai-beats-champion-program-teaching-itself-to-play-four-hours),
    an AI created by Google using deep learning techniques recently defeated the world’s
    best chess-playing computer. AlphaZero learned all the chess techniques in less
    than four hours. 


    1.  Health Research


    Research in the health sector is making use of deep learning techniques to identify
    different diseases. For instance, human cell data received from high power electron
    microscopes is fed into deep learning algorithms to identify whether the cells
    are cancerous or not.


    1.  Computer Vision


    The domain of computer vision has long relied on pattern matching techniques.
    With the advent of machine learning, computer vision research was given a huge
    boost. However, the performance achieved by computer vision applications that
    employ deep learning has surpassed all previous research. Today deep learning
    is being used for image classification, video summarization, object character
    recognition, face recognition, and gate recognition etc.


    1.  Natural Language Processing


    Deep learning algorithms such as neural machine translation, sequence 2 sequence
    models and recurrent neural network have greatly improved the performance of different
    natural language processing tasks such as text classification, POS tagging, sentimental
    analysis, answer-question system generation etc.


