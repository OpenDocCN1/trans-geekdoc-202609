- raw: 'The final step in a convolutional neural network is to input the data from
    flatten layer to the densely connected layer. The densely connected layer is the
    same layer that we used to create ANN in chapter 3 and 4. We will use one hidden
    layer of 128 nodes. The following script adds a hidden layer:


    h1 = Dense(units = 128, activation = ''relu'')


    cnn\_clf.add(h1)


    In the output layer, we will use sigmoid activation function since we have binary
    outcome. Execute the following script:


    h2 = Dense(units = 1, activation = ''sigmoid'')


    cnn\_clf.add(h2)


    Compiling the CNN


    The compilation step of CNN is similar to ANN. We use the compile function and
    pass it the optimizer function, loss function and the metrics as shown below:


    cnn\_clf.compile(optimizer = ''adam'', loss = ''binary\_crossentropy'', metrics
    = \[''accuracy''\])


    Image Augmentation


    In our dataset, we have 8 thousand images to train our model on. This is actually
    a very small number and can result in over-fitting. Over-fitting refers to the
    phenomena where a machine learning models results in higher accuracy on training
    data but predicts test instances with lower accuracy.


    In simple machine learning problems, we only have to find a relation between the
    dependents and the independent variables. However, in the case of images, the
    machine learning model has to find relations between different parts of the image.
    Therefore, for image classification, a huge number of images is required.


    Luckily, Keras contains a class named image data generator that can help generate
    images of different types from the existing images so that we can have an increased
    number of images in the training set.


    ImageDataGenerator class generates copies of images and then performs tasks like
    switching image orientation, shrinks its size, distorting the image to create
    new unique images from the existing images.


    Look at the following script to see the working of ImageDataGenerator class.


    fromkeras.preprocessing.image import ImageDataGenerator


    train\_setgen = ImageDataGenerator(rescale = 1./255,


    shear\_range = 0.2,


    zoom\_range = 0.2,


    horizontal\_flip = True)


    In the script above, we first import the ImageDataGeneratorfrom the keras.preprocessing.image
    library. We then create an object of the class. In the constructor, we need to
    pass the values for rescaling, shear\_range, zoom\_range and horizontal\_flip.
    These are all the different types of transformations that will be applied to the
    images in order to different types of training data. In the script above, we apply
    these transformations for the training set.


    For the test set, we want to keep everything as it is except that we will scale
    the images. Execute the following script to create an image data generator for
    the test class.


    test\_setgen = ImageDataGenerator(rescale = 1./255)


    Creating Training and Test Sets


    We have created the classed for transforming training and testing set. We will
    use these classes to create training and tests sets that we are going to use.
    Take a look at the following script:


    training\_data = train\_setgen.flow\_from\_directory(r''D:/Datasets/animal\_data/training\_set'',


    target\_size = (64, 64),


    batch\_size = 32,


    class\_mode = ''binary'')


    test\_data = train\_setgen.flow\_from\_directory(''D:/Datasets/animal\_data/test\_set'',


    target\_size = (64, 64),


    batch\_size = 32,


    class\_mode = ''binary'')


    Since, our images are stored in a local directory; therefore, we need to call
    flow\_from\_directory method in order to apply transformation. The method takes
    four parameters. The first parameter is the path of the directory that contains
    the images that you want to transform.


    The second parameter is the target\_sizeparameter that specifies the dimensions
    of the images. In the first convolutional layer, we specified that our images
    are going to be 64 x 64 pixels. Therefore, pass a tuple of (64, 64) to the target\_sizeparameter.


    The second parameter is the batch size parameter, which specifies the batch size
    of the images that you want to generate. Finally, since we have two classes in
    the output i.e. cats and dogs, therefore, we set class\_modeparameter as a binary.


    Finding Accuracy


    We have training data and testing data in the desired format. The next step is
    to train the model and find the accuracy. Execute the following script to do so:


    cnn\_clf.fit\_generator(training\_data,


    steps\_per\_epoch = (8000/32),


    epochs = 25,


    validation\_data = test\_data,


    validation\_steps = (2000/32))


    To train our model we need to call the fit\_generator method on the cnn\_clfobject.
    We need to pass the training data as the first parameter. The second parameter
    is the steps\_per\_epochs which is basically batch size. Since we have 32 images
    in each batch, we divide the number of images in a batch by the total number of
    batches so that each image is used once for training during the batch. The number
    of epochs is the number of times you want to repeat the training overall batch.
    The validation\_data parameter received test\_data as a parameter. Finally, for
    the test set, you again have to pass the number of batches. Here again, we have
    2000 batches and in one batch 32 images are tested. Therefore, two test all the
    2000 images in the test set we divide 2000 by 32.


    The above script will run for 25 epochs. You will see improve in both accuracy
    and validation accuracy with each epoch. The accuracy is the accuracy achieve
    on the training set while the validation accuracy is the accuracy achieved on
    validation or test. Once the algorithm is trained, the result set looks like this:


    ![image](d2d_images/image055.png)


    You can see from the output that after 25 epochs, we receive an accuracy of 90.40%
    and validation accuracy of 80.10%, which is not bad given the fact that we used
    very simple parameters. You can try to improve accuracy by decreasing the batch
    size and increasing the number of epochs. Another way to increase the accuracy
    of the algorithm is to increase the number of convolutional layers. Finally, if
    you are unable to increase accuracy despite performing these steps, increase the
    target size of the image by adding more pixels along the horizontal and vertical
    axis. This will add more information to the algorithm, which may result in improved
    accuracy.


    Conclusion


    In this Chapter, we implemented a Convolutional Neural Network in Keras to classify
    images. We saw the different steps required for image classification. From the
    next chapter, we will start our discussion about Recurrent Neural Network (RNN).
    We will see different types of RNN and will try to solve problems such as time
    series analysis and text classification etc.


