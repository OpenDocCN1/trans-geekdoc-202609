    # Text Classification using RNN (LSTM)


    ![image](d2d_images/chapter_title_below.png)


    A text classification problem is a type of problems where you are given a text
    string, which can be a user comment on the Facebook or Twitter or an email message
    etc. Your job is to classify the text into one of the predefined categories. For
    instance, for the Facebook comments, predefined categories can be “Positive Comment”
    and “Negative Comment”. Similarly, for the email classification, possible categories
    can be “Ham” or “Spam”. An email is considered “Ham” if it is genuine. On the
    flip side, if an email is not genuine, for instance, it congratulates you on winning
    a million dollar lottery; it probably is a spam email.


    Text classification is a supervised learning problem, where you are given a set
    of documents as well as the category to which the document belongs. Your task
    is to train the algorithm on this data and predict the category for an unseen
    document. A document can be as long as a full book or an article, or as short
    as a single sentence.


    Several machine learning models have previously been developed for tasks like
    text classification. However, deep learning techniques have proven to be more
    successful than traditional machine learning Techniques. Particularly, LSTM has
    been proven as the state of the art for text classification problems.  LSTM is
    a type of recurrent neural network, which we studied in detail in Chapter 8. We
    used LSTM for time series analysis in Chapter 9. However, we did not dig deeper
    into the architecture of the LSTM. In this chapter, we will use LSTM for text
    classification. But before that, we will study the architecture of LSTM in detail.


