    ''relu''))


    ann\_clf.add(Dense(units = 6, kernel\_initializer = ''uniform'', activation =
    ''softmax''))


    ann\_clf.compile(optimizer = ''adam'', loss = ''categorical\_crossentropy'', metrics
    = \[''accuracy''\])


    returnann\_clf


    The train\_classifier method in the above script returns the ANN.


    1.  Implementing Cross-Validation


    To implement cross-validation in Keras, we will use cross\_val\_scoreclass of
    the sklearn.model\_selectionlibrary.  However, the cross\_val\_scoreclass accepts
    sklearn object. We have a classifier in Keras. To convert Keras classifier to
    sklearn compatible object, we will use KerasClassifier class of the keras.wrappers.scikit\_learnlibrary.


    The KerasClassifier class accepts keras classifier and converts into the sklearn
    classifier. The sklearn classifier can then be used for cross\_val\_score function.


    The classifier, feature set,and label set and the number of folds for cross-validation
    are passed as a parameter to the cross\_val\_score class as shown below:


    from keras.wrappers.scikit\_learn import KerasClassifier


    fromsklearn.model\_selection import cross\_val\_score


    keras\_ann\_clf = KerasClassifier(build\_fn = train\_classifier, batch\_size =
    10, epochs = 500)


