    这是一个非常著名的问题，该问题的数据可以在 [google](https://www.kaggle.com/c/dogs-vs-cats) 数据集中找到。原始数据集包含约
    25000 张图像。然而，为了简单起见便于下载，我们将仅使用 10,000 张图像进行训练和测试。本章节的数据可以在 `animal_datafolder`
    中找到，该文件夹位于 Datasets 文件夹内，你可以从书中描述部分提供的链接进行下载。


    # 理解数据


    在开始编写 CNN 代码之前，我们需要先了解数据集是如何安排的，因为我们没有可以作为数据源的单个 CSV 文件。相反，我们有一组图像。为了实现机器学习模型，我们需要因变量和自变量。自变量用于预测因变量。


    将一组图像转换为自变量和因变量，我们有几种选择。一种方法是根据图像类型将每张图像命名为 cats 或 dogs，后面跟一个唯一 id。这些图像就可以作为自变量。为了创建因变量向量，我们可以解析每个文件名，并根据找到的值（即猫或狗）在因变量向量中添加特定的条目。这非常繁琐并且涉及一些自定义代码。


    然而，Keras 有一个更好的解决方案。我们只需要将图像按照特定的文件夹结构安排，Keras 就会自动检测因变量自变量。此外，Keras 还会根据目录结构检测训练集和测试集。


    因此，为了让 Keras 理解自变量和因变量，我们必须按照特定的文件夹结构安排图像。


    首先，你需要一个包含训练集和测试集的顶层文件夹。在顶层文件夹内部，你需要两个文件夹，分别用于训练集和测试集。在训练集和测试集内部，你需要为每个类别创建文件夹。例如，如果你有两种类型的图像（即猫和狗），你需要在训练集和测试集文件夹内为
    cats 和 dogs 创建文件夹。


    我们在本章中使用的目录结构如下：


    ![image](img/image035.png)


    你可以看到我们有一个顶层文件夹 `animal_data`，它包含了 `test_set` 和 `training_set` 文件夹。`animal_data`
    文件夹还包含了 `single_predictionfolders`，我们在本章中不会使用。`test_set` 和 `training_set` 文件夹都包含
    dogs 和 cats 文件夹。我们将使用 8000 张图像进行训练，2000 张进行测试。因此，`training_set` 文件夹包含 8000 张图像。`training_set`
    文件夹中的 `cats` 和 `dogs` 文件夹各包含 4000 张图像。同样，`test_set` 文件夹中的 `cats` 和 `dogs` 文件夹各包含
    1000 张图像。如果你打开 `cats` 文件夹，你会看到猫的图像，而 dogs 文件夹包含了狗的图像。


    这种数据集安排方式的优点是它可以用于任何问题。例如，如果你想分类汽车和卡车的图像，只需在 `training_set` 和 `test_set` 文件夹中为
    cars 和 trucks 创建文件夹即可。


    我们已经为 Keras 准备好了数据。


    现在是用 Keras 编写卷积神经网络代码了。按照以下步骤操作：


    ## 1. 导入库


    一如既常，第一步是导入库：


    ```python

    from tensorflow.keras.models import Sequential

    from tensorflow.keras.layers import Conv2D, MaxPooling2D, Flatten, Dense

    ```


    ## 2. 初始化卷积网络


    第一步是初始化网络：


    ```python

    cnn_clf = Sequential()

    ```


    ## 3. 添加卷积和池化层


    下一步是添加层。如下创建第一个卷积层：


    ```python

    cnn_clf.add(Conv2D(32, (3, 3), input_shape=(64, 64, 3), activation=''relu''))

    cnn_clf.add(MaxPooling2D(pool_size=(2, 2)))

    ```


    让我们再添加一个卷积和池化层：


    ```python

    cnn_clf.add(Conv2D(32, (3, 3), activation=''relu''))

    cnn_clf.add(MaxPooling2D(pool_size=(2, 2)))

    ```


    ## 4. 输入扁坦化


    在与全连接神经网络使用数据之前，我们需要对输入进行扁坦化：


    ```python

    cnn_clf.add(Flatten())

    ```


