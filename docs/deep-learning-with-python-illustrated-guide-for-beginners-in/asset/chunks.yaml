    # Time Series Analysis with RNN


    ![image](d2d_images/chapter_title_below.png)


    In the previous chapter, we started our discussion about RNN. We said that RNN
    can be used for predicting sequential data. In this chapter, we will predict future
    stock prices for Microsoft with the help of LSTM which is one of the most commonly
    used versions of the LSTM. Let’s get straight to the task:


