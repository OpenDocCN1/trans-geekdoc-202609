    # LSTM Architecture


    ![image](d2d_images/chapter_title_below.png)


    Let’s first revise the architecture of RNN. The basic principle of RNN is that
    at time t, it receives the input Xt and the output at the previous time t-1.


    Note: Images for this section have been taken from [Colah’s Blog](https://colah.github.io/posts/2015-08-Understanding-LSTMs/).
    It is a very good resource to understand LSTM.


    RNN Revision


    The basic architecture of RNN looks like this:


    ![image](d2d_images/image046.png)


    This is an LSTM with one node. It has one input represented by Xt, one activation
    function that acts on the dot product of weights and one output, known as ht.
    If you unroll this node in a temporal space, it looks likes the following figure.


    ![image](d2d_images/image008.png)


    Here x is the input and h is the output. Let’s start from time t=0. At t=0, the
    input X0 is passed through the node and the output h0 is received. At time step
    t=1, the input x1 along with the previous output h0 is passed as input to the
    next node. The process continues until the final output is received.This architecture
    of neural network makes them ideal for the sequence problems such as time series
    analysis that we saw in the last chapter.


    The feedback mechanism enables RNN to take into account, past information while
    making decisions. RNN architecture has plenty of applications such as text classification,
    image captioning, speech recognition and neural machine translation. However,
    there is a problem with this simple RNN architecture.


    Problem with Simple RNN


    Though theoretically, RNN is capable of retaining the past information, in practice,
    this is not the case. RNN is only capable of remembering the recent information.
    It is not capable of remembering information after a large gap of sequence steps.
    In some cases, this is not a problem. For instance, take a look at the sentence
    “Birds fly in the \_\_\_”. Our RNN can easily predict the next word which can
    be “Sky” since the past 4 words were enough to predict the next word.


    However, in cases where the information from previous steps that are far away
    from the current time step, is needed, the RNN doesn’t seem to perform correctly.
    For instance, consider the following paragraph. The dotted lines represent any
    random text.


    “My father is an Italian. He likes to eat Pasta and Pizza. He watches football
    ...........................................................................................................................................................................................................................
    and he speaks \_\_\_\_ ”.


    Now if an RNN wants to predict the next word after “speaks”, it needs information
    from the beginning of the sentence i.e “My father is an Italian”. Unfortunately
    as the gap between the current time step and the previous time steps increase,
    RNN starts to forget the previous information due to phenomena called vanishing
    gradients. This is called a problem of long-term dependency.


    Solution: LSTM


    The LSTM (Long Short-Term Memory) neural network is capable of retaining information
    learned through a long number of time steps and hence can solve the problem of
    long-term dependency. Developed by [Hochreiter&Schmidhuber (1997)](http://www.bioinf.jku.at/publications/older/2604.pdf),
    several variants of LSTM have been developed till now.  However, we will study
    the basic version in this section.'
