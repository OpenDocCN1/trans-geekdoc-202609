    # Testing and Making Predictions


    ![image](d2d_images/chapter_title_below.png)


    To test and evaluate the algorithm that we just trained, we need to perform two
    steps: First, we have to predict the opening stock prices for January 2017 and
    then we have to compare the predicted stock prices with the actual stock prices.


    Let’s first load our test set. Remember the test set has been downloaded and stored
    in “ms-testing.csv” file. Execute the following script to load the test set:


    stock\_data\_testing = pd.read\_csv(''D:\\Datasets\\ms-testing.csv'')


    stock\_testing=  stock\_data\_testing.iloc\[:, 1:2\].values


    Let’s see how the trend of our test data for the month of January 2017 which we
    have to predict. Take a look at the following graph:


    ![image](d2d_images/image028.png)


    Figure 9.2: Trend of Opening Stock Price for January 2017


    From Figure 9.2, we can clearly see that opening stock price of Microsoft for
    the month of January sees a varying trend at the beginning of January and it ends
    up on the high. The trend is extremely non-linear and this is why we employed
    RNN with multiple layers to train the algorithm.


    As a next step, we will predict the trends for the month of January and will see
    if we get a curve similar to the one mentioned in Figure 9.2.


    It is very important to mention here that we trained our algorithm by using the
    opening stock price of previous 60 days to predict the opening stock price of
    the 61^(st) day.


    Now to make predictions on the test set, we again need the data in the same format.
    For example, to predict the start price for 1^(st) January 2017, we need the opening
    stock price of last 60 days which will come from training set since training set
    contains stock prices from January 2012 to December 2016.And similarly, to predict
    the stock price for 30^(th) January 2017, we will need input from the test set
    as well as from the training set.


    We prepare our input data for predictions by concatenating our training and test
    sets.


    stock\_total = pd.concat((stock\_data\[''Open''\], stock\_data\_testing\[''Open''\]),
    axis = 0)


    Since we only need the opening data, therefore we only concatenated the data for
    the “Open” column. The axis here specifies that the data will be connected vertically
    along the rows.


    Now what we need in the input is the previous 60 stock prices of Microsoft from
    the first day of January 2017 to the last day of January 2017. If you look at
    the “ms-training.csv” file, you will see that the first day of January 2017 is
    the 3^(rd) of January and the last day of January 2017 is the 30^(th) of January.
    Therefore we need to iterate through these dates.


    However, to get the previous 60 records, we can subtract the length of stock\_data\_testing
    from the length of stock\_total and subtract 60 from it. This will give us previous
    60 stock prices for 3^(rd) January 2017. This will be the lower bound of the input
    data. For the upper bound we can take the index of the last value of stock\_total.
    Execute the following script:


    test\_inputs = stock\_total\[len(stock\_total) - len(stock\_data\_testing) - 60:\].values


    Now we need to reshape the numpy array so that it is in the right format and then
    we will scale it as we did with our training data. To do so, execute the following
    script:


    test\_inputs = test\_inputs.reshape(-1,1)


    test\_inputs = normalizer.transform(test\_inputs)


    Once the data is scaled, we are ready to create the test data that we will be
    used for prediction. Our test data will contain 20 records, 1 each for each date
    in January 2017. Each record will be a feature vector consisting of 60 previous
    opening stock prices. Execute the following script to create the feature vector:


    test\_features = \[\]


    for i in range(60, 80):


    test\_features.append(test\_inputs\[i-60:i, 0\])


    Finally, we need to convert our test\_features list into numpy array which will
    then be used to convert into a format that can be used as input to the RNN as
    we did in the training phase. The following script converts the data into the
    required format:


    test\_features = np.array(test\_features)


    test\_features = np.reshape(test\_features, (test\_features.shape\[0\], test\_features.shape\[1\],
    1))


    Finally, to predict the stock prices, we will call the predict method on the stock\_predictor
    RNN that we trained in the last section as shown below:


    predictions =stock\_predictor.predict(test\_features)


    These predictions are scaled. To get the actual predictions, we need to reverse
    the scaling, we will use the inverse\_transform function of the normalizer object
    that we created in the last section:


    predictions = normalizer.inverse\_transform(predictions)


