- raw: "Welcome to Deep Learning with Python! If you are deciding to start your career\
    \ as a data scientist or machine learning expert, you have made a great decision.\
    \ Deep learning is one of the hottest research areas of current times with lots\
    \ of promise and great job opportunities. This book will help you build a foundation\
    \ in deep learning. The book is aimed at beginners as well as intermediate deep\
    \ learning experts. The book covers all the important concepts and problems that\
    \ you will face as a deep learning expert. Each chapter of the book starts with\
    \ theory followed by practical implementation in Python. We will solve a variety\
    \ of problems in this book ranging from digit recognition to image classification\
    \ and stock market prediction to NLP problems such as text classification and\
    \ sentimental analysis.\n\nThe book has been divided into three main sections.\
    \ The first section consists of an introduction, data pre-processing and simple\
    \ densely connected neural networks. The second section consists of convolutional\
    \ neural networks and its application to computer vision. We will solve the image\
    \ classification problem in this section. Finally, the third section is dedicated\
    \ to the recurrent neural networks where we will solve two types of problems:\
    \ time series analysis and natural language processing.\n\nThe best way to take\
    \ the most out of this book is to read the theory in each chapter, followed by\
    \ code implementation. Do not just copy and paste the code, rather try to understand\
    \ it and type it out by hand. Dataset is given for each problem; try to solve\
    \ the problem with different algorithms. For instance, if in the book, a problem\
    \ has been solved using the convolutional neural network; try to solve it via\
    \ a recurrent neural network as well and vice versa.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# \n\n\
    ![image](d2d_images/chapter_title_below.png)\n\n### Where to Find the Datasets?\n\
    \nThe datasets for this book can be downloaded from this link:\n\n[https://www.dropbox.com/s/6r10vemdcac72av/Datasets.rar?dl=0](https://www.dropbox.com/s/6r10vemdcac72av/Datasets.rar?dl=0)\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n\n| --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n\
    # Chapter 1\n\n![image](d2d_images/chapter_title_below.png)\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Introduction\n\
    \n![image](d2d_images/chapter_title_below.png)\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# What\
    \ is deep learning?\n\n![image](d2d_images/chapter_title_below.png)\n\nDeep Learning\
    \ is a branch of machine learning that deals with algorithms inspired by the functionality\
    \ and structures of the human brain. The term deep learning and neural networks\
    \ are often used interchangeably. However, deep learning is a domain whereas neural\
    \ networks are a variety of algorithms that collectively establish deep learning\
    \ as a separate domain.\n\nDeep learning algorithms are divided into three major\
    \ categories: i) Densely connected neural networks or commonly known as perception,\
    \ which is the most simple type of artificial neural network ii) Convolutional\
    \ Neural Networks (CNN), proven to be highly efficient for image recognition tasks\
    \ and iii) Recurrent Neural Networks, commonly used for natural language processing\
    \ and time series prediction. All the remaining neural networks are derived from\
    \ these three main categories.\n\nDeep learning involves a layered architecture\
    \ where the neural network is formed of multiple layers. The first layer of a\
    \ neural network is called the input layer while the last layer is called the\
    \ output layer. The input data is passed to the input layer, while the output\
    \ whether continuous or discrete, is calculated from the output layer. The layers\
    \ between the input and the output layers are called the hidden layers.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# History\
    \ of Deep Learning\n\n![image](d2d_images/chapter_title_below.png)\n\nValentinGrigorʹevich\
    \ and Alexey Grigoryevichare credited with developing first deep learning models\
    \ in 1965. They developed statistically analyzed models that used polynomial activation\
    \ functions. Most optimal features from each layer were selected statistically\
    \ and were handed over to the next layer. In 1970, due to unfulfilled promises\
    \ of AI, the funding for the AI and DL research was substantially curtailed resulting\
    \ in no significant research during that era except few individual efforts. This\
    \ time period is known as the AI winter. Significant research was undertaken in\
    \ the deep learning domain from 1970 to 2010; however, no significant advantage\
    \ of deep learning techniques was observed over conventional machine learning.\n\
    \nThough it was known that deep learning architecture, given the huge amount of\
    \ data and computing power, can beat traditional machine learning algorithm, no\
    \ results could prove that before 2012. The main reason was the lack of huge data\
    \ sets and computing power. However, around 2012, researchers were beginning to\
    \ show better results using DL algorithms. [Tomas published a paper in 2012](https://arxiv.org/pdf/1301.3781.pdf)\
    \ in which he showed that word embedding technique using the DL method can improve\
    \ the performance of natural language processing algorithms such as the sequence\
    \ to sequence models and neural machine translation.\n\nCurrently, deep learning\
    \ methods are almost always expected to beat traditional machine learning models\
    \ if a huge amount of data is available.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Advantages\
    \ of Deep Learning\n\n![image](d2d_images/chapter_title_below.png)\n\nFollowing\
    \ are some of the advantages of deep learning:\n\n1.  Given reasonable amount\
    \ machine learning models will beat traditional machine learning techniques by\
    \ a huge margin. But a large amount of data is the key here. The following image\
    \ explains that relationship:\n\n![image](d2d_images/image052.png)\n\nComparison\
    \ of DL and ML Performance against the amount of data ([Slide from Andrew Ng](https://www.slideshare.net/ExtractConf))\n\
    \n1.  DL eliminates the need for feature engineering by finding the most suitable\
    \ feature for the problem.\n\n2.  DL techniques can be easily adapted to new domains\
    \ such as recurrent neural networks are used to solve time series problems as\
    \ well as for natural language processing. Similarly, convolutional neural networks\
    \ are also being used for NLP and computer vision.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Disadvantages\
    \ of Deep Learning\n\n![image](d2d_images/chapter_title_below.png)\n\n1.  The\
    \ main disadvantage of deep learning is that it requires huge amounts of data\n\
    \n2.  Since lots of layers and nodes are involved in a neural network, a very\
    \ high-performance computing machine is required to run deep learning algorithms.\n\
    \n3.  Deep learning algorithms work as a black box and most of the time you don’t\
    \ know what’s happening at each node and how features are being selected."
  fmt: "\nWelcome to Deep Learning with Python! If you are deciding to start your\
    \ career as a data scientist or machine learning expert, you have made a great\
    \ decision. Deep learning is one of the hottest research areas of current times\
    \ with lots of promise and great job opportunities. This book will help you build\
    \ a foundation in deep learning. The book is aimed at beginners as well as intermediate\
    \ deep learning experts. The book covers all the important concepts and problems\
    \ that you will face as a deep learning expert. Each chapter of the book starts\
    \ with theory followed by practical implementation in `Python`. We will solve\
    \ a variety of problems in this book ranging from digit recognition to image classification\
    \ and stock market prediction to NLP problems such as text classification and\
    \ sentimental analysis.\n\nThe book has been divided into three main sections.\
    \ The first section consists of an introduction, data pre-processing and simple\
    \ densely connected neural networks. The second section consists of convolutional\
    \ neural networks and its application to computer vision. We will solve the image\
    \ classification problem in this section. Finally, the third section is dedicated\
    \ to the recurrent neural networks where we will solve two types of problems:\
    \ time series analysis and natural language processing.\n\nThe best way to take\
    \ the most out of this book is to read the theory in each chapter, followed by\
    \ code implementation. Do not just copy and paste the code, rather try to understand\
    \ it and type it out by hand. Dataset is given for each problem; try to solve\
    \ the problem with different algorithms. For instance, if in the book, a problem\
    \ has been solved using the convolutional neural network; try to solve it via\
    \ a recurrent neural network as well and vice versa.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# \n\n\
    ![image](d2d_images/chapter_title_below.png)\n\n### Where to Find the Datasets?\n\
    \nThe datasets for this book can be downloaded from this link:\n\n[https://www.dropbox.com/s/6r10vemdcac72av/Datasets.rar?dl=0](https://www.dropbox.com/s/6r10vemdcac72av/Datasets.rar?dl=0)\n\
    \n| ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)\
    \ |\n\n| --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n\
    # Chapter 1\n\n![image](d2d_images/chapter_title_below.png)\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Introduction\n\
    \n![image](d2d_images/chapter_title_below.png)\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# What\
    \ is deep learning?\n\n![image](d2d_images/chapter_title_below.png)\n\nDeep Learning\
    \ is a branch of machine learning that deals with algorithms inspired by the functionality\
    \ and structures of the human brain. The term deep learning and neural networks\
    \ are often used interchangeably. However, deep learning is a domain whereas neural\
    \ networks are a variety of algorithms that collectively establish deep learning\
    \ as a separate domain.\n\nDeep learning algorithms are divided into three major\
    \ categories: i) Densely connected neural networks or commonly known as perception,\
    \ which is the most simple type of artificial neural network ii) Convolutional\
    \ Neural Networks (CNN), proven to be highly efficient for image recognition tasks\
    \ and iii) Recurrent Neural Networks, commonly used for natural language processing\
    \ and time series prediction. All the remaining neural networks are derived from\
    \ these three main categories.\n\nDeep learning involves a layered architecture\
    \ where the neural network is formed of multiple layers. The first layer of a\
    \ neural network is called the input layer while the last layer is called the\
    \ output layer. The input data is passed to the input layer, while the output\
    \ whether continuous or discrete, is calculated from the output layer. The layers\
    \ between the input and the output layers are called the hidden layers.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# History\
    \ of Deep Learning\n\n![image](d2d_images/chapter_title_below.png)\n\nValentinGrigorʹevich\
    \ and Alexey Grigoryevichare credited with developing first deep learning models\
    \ in 1965. They developed statistically analyzed models that used polynomial activation\
    \ functions. Most optimal features from each layer were selected statistically\
    \ and were handed over to the next layer. In 1970, due to unfulfilled promises\
    \ of AI, the funding for the AI and DL research was substantially curtailed resulting\
    \ in no significant research during that era except few individual efforts. This\
    \ time period is known as the AI winter. Significant research was undertaken in\
    \ the deep learning domain from 1970 to 2010; however, no significant advantage\
    \ of deep learning was observed.\n\nThough it was known that deep learning architecture,\
    \ given the huge amount of data and computing power, can beat conventional machine\
    \ learning, the main reason before 2012 was the lack of data. However, around\
    \ 2012, researchers were beginning to show better results using DL. [Tomas published\
    \ a paper in 2012](https://arxiv.org/pdf/1301.3781.pdf) in which he showed that\
    \ word embedding technique using the DL method can improve the performance of\
    \ natural language processing algorithms such as the sequence to sequence models\
    \ and neural translation. Currently, deep learning methods are almost always expected\
    \ to beat machine learning if a huge amount of data is available.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Advantages\
    \ of Deep Learning\n\n![image](d2d_images/chapter_title_below.png)\n\nFollowing\
    \ are some of the advantages of deep learning:\n\n1. Given reasonable amount machine\
    \ learning models will beat traditional machine learning techniques by a huge\
    \ margin. But a large amount of data is the key here. The following image explains\
    \ that relationship:\n\n![image](d2d_images/image052.png)\n\nComparison of DL\
    \ and ML Performance against the amount of data ([Slide from Andrew Ng](https://www.slideshare.net/ExtractConf))\n\
    \n2. DL eliminates the need for feature engineering by finding the most suitable\
    \ feature for the problem.\n\n3. DL techniques can be easily adapted to new domains\
    \ such as recurrent neural networks are used to solve time series problems as\
    \ well as for natural language processing. Similarly, convolutional neural networks\
    \ are also being used for NLP and computer vision.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# Disadvantages\
    \ of Deep Learning\n\n![image](d2d_images/chapter_title_below.png)\n\n1. The main\
    \ disadvantage of deep learning is that it requires huge amounts of data.\n\n\
    2. Since lots of layers and nodes are involved in a neural network, a very high-performance\
    \ computing machine is required to run deep learning algorithms.\n\n3. Deep learning\
    \ algorithms work as a black box and most of the time you don’t know what’s happening\
    \ at each node and how features are being selected.\n"
  trans: "\n欢迎来到《Python 深度学习》！如果你决定开始你的数据科学家或机器学习专家职业生涯，那么你做出了一个明智的决定。深度学习是当前最热门的研究领域之一，具有广阔的前景和极佳的就业机会。这本书将帮助你建立深度学习的基础。本书不仅面向初学者，也面向中级深度学习专家。书涵盖涵盖了你作为深度学习专家将面对的所有重要概念和问题。书的每一章都从理论开始，随后是\
    \ `Python` 代码的实际实现。我们将在书中解决各种问题，范围从数字识别到图像分类，从股市预测到如文本分类和情感分析等 NLP（自然语言处理）问题。\n\
    \n本书分为三个主要部分。第一部分包含引言、数据预处理和简单的全连接神经网络。第二部分包含卷积神经网络及其在计算机视觉中的应用。我们将在这一部分解决图像分类问题。最后，第三部分专门介绍循环神经网络，我们将解决两类问题：时间序列分析和自然语言处理。\n\
    \n充分利用此本书的最佳方法是阅读每一章的理论，然后进行代码实现。不要仅仅复制和粘贴代码，而是要尝试理解它并手写出来。每个问题都提供了数据集；尝试用不同的算法来解决问题。例如，如果书中某个问题是用卷积神经网络解决的，尝试通过循环神经网络来解决，反之亦然。\n\
