    # LSTM Architecture


    The memory module of `RNN` consists of one layer. Where one input, along with
    the previous output or hidden state is being fed into the next node. The architecture
    of `LSTM` differs from `RNN` in a way that in addition to the output, it has a
    cell state vector as well which is responsible for maintaining long-term memory.
    The basic architecture of `LSTM` is shown below:


    ![image](d2d_images/image045.png)


    Don’t be intimidated by the above architecture, we will see each component of
    `LSTM` in detail.


    ## Cell State


    The first component of an `LSTM` is the cell state. Take a look at the following
    figure:


    ![image](d2d_images/image042.png)


    Cell state contains values that store the information from the previous time-steps.
    In the above figure, the `Ct-1` is the cell state at point `t-1`. In addition
    to the hidden state, the past cell state is also passed as input to the `LSTM`
    at time step `t`. Similarly, the cell state at time `t` i.e. `Ct` is passed as
    input to the `LSTM` at time `t+1` and so on.


    However, we do not need all of the past information. And depending upon the input
    we need to update the past information. To remove, add or modify information in
    the cell state, different types of gates are used in `LSTM`. Gates consist of
    a sigmoid operation in the neural net layer, followed by a pointwise multiplication
    operation.


    The following operations are performed in an `LSTM` neural network node at each
    time step.


    ### 1. Forget Gate


    In the first step, the information from the previous time step that is needed
    to be forgotten is passed to the cell state. The gate that performs this operation
    is called forget gate. Take a look at the following figure. Here `ft` refers to
    the forget gate.


    ![image](d2d_images/image006.png)


    In the forget gate, the previous hidden state, and the current input are concatenated
    and passed through a sigmoid function. For each value in the cell state, the sigmoid
    function returns `1` or `0`. Here `0` represents that okay forget this, while
    `1` represents that keep this information. The result of the sigmoid operation
    is pointwise multiplied with the existing cell state.


    Real world example of the forget gate can be the gender of the person. If a new
    person with a different gender comes, we need to change all the pronouns. The
    forget gate will help us forget the gender of the previous person.


    ### 2. Input Gate


    The next step is to find out the new information (if any, that is to be stored
    in the cell state). To find out the new information to be updated, two operations
    are required to be performed. The first one is to identify what part of the cell
    state is to be updated. This is defined by the input gate represented by `it`
    in the following figure. The second part is the vector of new values that will
    replace the old value and is represented by `C~tas` shown in the following figure.


    ![image](d2d_images/image023.png)


    A real-world example of this step is that it will find that gender has to be updated,
    while the `C^twill` result in the new value of the gender.


    ### 3. Updating the Cell State


    Now we have all the information needed to update the cell state. We just need
    to perform the operations that we derived in step 1 and step 2. Step 3 can be
    visually represented as:


