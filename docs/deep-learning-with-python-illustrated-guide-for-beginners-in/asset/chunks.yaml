    # 对输出进行独热编码


    ![image](img/chapter_title_below.png)


    在神经网络的输出层中，我们将指定输出节点的数量。在上一章中，我们提到在超过超过两个类别（二分类）的情况下，输出层中将有 `N` 个节点，其中 `N` 是类别的数量且大于
    2。然而，为了使用神经网络，我们还必须将输出标签数组转换为 `K` 列的独热编码矩阵，其中 `K` 是唯一类别的数量。以下脚本将我们的标签数组 `labels`
    转换为独热编码矩阵。执行以下脚本：


    ```python

    from sklearn.preprocessing import LabelEncoder

    encoder = LabelEncoder()

    y = encoder.fit_transform(labels)

    labels = pd.get_dummies(y).values

    ```


    在上述脚本中，我们首先使用 `sklearn.preprocessing` 库中的 `LabelEncoder` 类将 `labels` 转换为一系列整数。然后，我们使用
    pandas 库的 `get_dummies` 方法将这一系列整数转换为独热编码矩阵。


    最后，让我们将数据划分为训练集和测试集：


    ```python

    from sklearn.model_selection import train_test_split

    train_features, test_features, train_labels, test_labels = train_test_split(features,
    labels, test_size=0.2, random_state=0)

    ```


