- raw: 'Once the model is trained, the next step is to make predictions. It is important
    to note that during the training phase we had all the elements in the input sequence,
    however for the outputs, this is not going to be the case since we do not know
    every element in the input beforehand. But if you closely look at the training
    phase, you can see that the input to the next unit in the decoder LSTM is basically
    the output from the previous unit. This is shown in the following figure:


    ![image](d2d_images/image000.png)


    Decoder Inputs during Inference/Prediction Phase ([Image Reference](https://towardsdatascience.com/seq2seq-model-in-tensorflow-ec0c557e560f))


    Step 5 (Convert Embeddings to Words)


    The predictions are in the form of embedding vectors which we have to convert
    back to the words. This is the final phase of the sequence to sequence model.


    The steps explained in this section will become clear in the next section when
    we will implement the sequence to sequence model in code.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


