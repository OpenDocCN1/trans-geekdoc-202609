    \ ![image](d2d_images/image002.png). \n\nIn the previous chapter, we saw how `LSTM`\
    \ can be used for text classification. However, `LSTM` can be used for a variety\
    \ of natural language processing tasks. Sequence to sequence, also known as `seq2seq`\
    \ is one of the most famous examples of the `LSTM` applications for NLP. In this\
    \ article, we will first study the theory behind `seq2seq` models. We will then\
    \ move on to build a very simple Chatbot, capable of answering basic user queries.\
    \ The Chatbot will not be very advanced, but you will get the idea behind the\
    \ working principles of `seq2seq` architecture.\n\n## Sequence to Sequence Architecture\n\
    \nSeq2seq model executes in two phases: Training and Inference. The architecture\
    \ consists of two LSTM networks called encoder and decoder. Take a look at the\
    \ following figure:\n\n![image](d2d_images/image032.png)\n\nThe encoder is basically\
    \ responsible for encoding input and producing thought vector. The encoder LSTM\
    \ layers have been represented by the blue rectangles in the above figure. The\
    \ output from the encoding LSTM is the hidden state and cell state that will be\
    \ used as input by the decoder. \n\nThe decoder LSTM not only receives the input\
    \ from encoding LSTM, but it also receives the target output one step forward\
    \ as the input to generate the final response.\n\n"
