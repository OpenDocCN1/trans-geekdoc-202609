    To see the average of all the accuracies, you can call mean() function on the
    list as shown below:


    print(results.mean()) 


    The result shows 0.5653 i.e. 56.53%.


    Finally to see the standard deviation, execute the following script:


    print(results.std()) 


    The above script returns 0.0554 or 5.54% which means that tests performed on variance
    partitions of the dataset can return accuracy of around 51 to 61%.


