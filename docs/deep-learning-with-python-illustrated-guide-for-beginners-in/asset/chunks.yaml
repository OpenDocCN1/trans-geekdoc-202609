    _target):\n\noutput\\_tokens, h, c = decoder\\_model.predict(\n\n\\[target\\_seq\\\
    ] + states\\_value\n\n)\n\n\\# Get next word\n\nidx = np.argmax(output\\_tokens\\\
    [0, 0, :\\])\n\n\\# End sentence of EOS\n\nif eos == idx:\n\nbreak\n\nword = ''\n\
    \nif idx > 0:\n\nword = idx2word\\_target\\[idx\\]\n\noutput\\_sentence.append(word)\n\
    \n\\# Update the decoder input\n\n\\# which is just the word just generated\n\n\
    target\\_seq\\[0, 0\\] = idx\n\n\\# Update states\n\nstates\\_value = \\[h, c\\\
    ]\n\n\\# states\\_value = \\[h\\] # gru\n\nreturn ' '.join(output\\_sentence)\n\
    \nThe “generate\\_response” function takes input sequence as the parameter. It\
    \ first finds the hidden and cell state using the encoder model.\n\nIt then creates\
    \ a new random variable of size 1 x 1 and initializes it with the index of “sos”.\
    \ Remember, the first word of every sentence is “sos”. We then find the index\
    \ of “eos” since we want to end our target sequence generation when “eos” is predicted.\n\
    \nNext, we execute the loop with the number of iterations equal to the maximum\
    \ target sequence length. During each iteration, we insert our input target plus\
    \ the previous hidden state values to the decoder\\_model. In the output, we receive\
    \ probability distribution of all the possible words along with the hidden state\
    \ and cell state.\n\nWe find the word with the highest probability using the argmax\
    \ function and store its index. If the index is equal to the index of eos, we\
    \ exit our loop. Else if the index is greater than zero, we find the corresponding\
    \ word from the index and append it to the output\\_sentence list. Finally, we\
    \ join the individual words in the list and return it.\n\nStep 8: Making Predictions\n\
    \nThe final step is to test the chatbots that we just developed. Take a look at\
    \ the following script:\n\nwhile True:\n\n\\# Do some test translations\n\ni =\
    \ np.random.choice(len(input\\_texts))\n\ninput\\_seq = encoder\\_inputs\\[i:i+1\\\
    ]\n\ntranslation = generate\\_response(input\\_seq)\n\nprint('-')\n\nprint('Input:',\
    \ input\\_texts\\[i\\])\n\nprint('Response:', translation)\n\nans = input(\"Continue?\
    \ \\[Y/n\\]\")\n\nif ans and ans.lower().startswith('n'):\n\nbreak\n\nIn the script\
