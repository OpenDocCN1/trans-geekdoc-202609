    上述脚本将 keras 分类器转换为 sklearn 分类器。我们将使用 `sklearn.model_selection` 库中的 `GridSearchCV`
    类；因此，我们需要像在交叉验证部分所做的那样，将 keras 分类器转换为 sklearn 分类器：


    ## 创建参数字典


    网格搜索算法并不是随机运行并寻找算法的所有最佳参数的，因为这可能花费数年时间。例如，如果网格搜索算法开始测试 ANN 的 `batch_size` 参数从
    1 到 500 的每个值，那么算法至少必须运行 500 次，而这仅仅是针对一个参数。因此，会将你想要测试的每个参数的一组值传递给 `GridSearchCV`
    类。这些参数集以字典的形式传递进去。


    假设我们想为 ANN 测试不同的 `batch_size` 值和若干个 `epochs`（训练轮数），我们可以创建一个如下所示的字典：


    ```python

    grid_params = {''batch_size'': [10, 5],

    ''epochs'': [500, 300]

    }

    ```


    在上面的脚本中，我们创建了一个名为“grid_params”的字典，字典的键是参数名称，字典的值对应参数的值。从这些值集中，网格搜索算法将返回最佳组合。


    这里需要提到的是，网格搜索算法花费的时间很大取决于你想要测试的值以及交叉验证的折数（folds）。


    例如，在我们的案例中，`batch_size` 参数有 2 个值，`epochs` 有 2 个值。这种情况下总可能的组合为 2 x 2 = 4 次。将此值乘以折数，例如
    10。这使得产生了 40 次执行。在 40 次执行中，20 次有 500 次 `epochs`，而 20 次有 300 次 `epochs`，总共 1.6
    万次 `epochs`。这会让算法变慢。


    ## 创建参数字典（继续）


    为了执行网格搜索，我们需要创建一个 `GridSearchCV` 类的对象，并为其传递分类器、我们刚刚创建的参数字典、性能评估指标（我们将使用 `accuracy`）以及交叉验证折数。执行以下脚本以创建
    `GridSearch` 对象。


    ```python

    from sklearn.model_selection import GridSearchCV


    gs= GridSearchCV(estimator = keras_ann_clf,

    param_grid = grid_params,

    scoring = ''accuracy'',

    cv = 10)

    ```


    最后一步是在 `GridSearchCV` 对象上调用 `fit` 方法，并如所示传递训练集和测试集：


    ```python

    gs_result = gs.fit(features, labels)

    ```


    执行此操作可能需要一些时间。


    一旦上述脚本执行完毕，最后也是一步是查看网格搜索选择的参数。为了这样做，你可以如下所示使用 `GridSearchCV` 类的 `best_params_`
    属性：


    ```python

    print(gs_result.best_params_)

    ```


    输出如下：


    ```python

    {''batch_size'': 10, ''epochs'': 300}

    ```


    输出显示从给定的参数集中，最佳参数是 `batch_size` 为 10 和 300 次 `epochs`。使用上述参数值实现了最佳性能。最后，为了查看使用最优参数所实现的准确率，执行以下脚本：


    ```python

    print(gs_result.best_score_)

    ```

    0.5941213258286429


    你可以看到，当 batch size 为 10 且 `epochs` 为 300 时，我们获得的平均准确率为 59.41%，大于我们在上一节中 batch
    size 为 10 且 500 次 `epochs` 时得到的 56.53%。


