    # Training the Neural Network


    ![image](d2d_images/chapter_title_below.png)


    To train the neural network we first need to call the compile method of the Sequential
    class object. The method takes the optimization function, the loss function and
    the metrics as parameters. We will use ‘adam’ optimization function, you can also
    use ‘sgd’ for stochastic gradient descent. Details of different types of optimizers
    available in Keras can be found at this link: [https://keras.io/optimizers/](https://keras.io/optimizers/)


    Since we have categorical output, we will use “categorical\_crossentropy” function.
    If the output is binary, we need to use “binary\_crossentropy” function. The details
    of all the loss functions available in Kerascan be found at this link: [https://keras.io/losses/](https://keras.io/losses/)


    The performance metrics we are going to use will be accuracy. Execute the following
    script to run the compile function:


    ann\_clf.compile(optimizer=''adam'', loss=''categorical\_crossentropy'', metrics=\[''accuracy''\])


    Finally, to start training we need to call the fit method and pass it our training
    and testing set. We also need to pass the batch size and the number of epochs.
    For this example we only have 1599 records, therefore the batch size of 1 is good
    which means that weights will be updated with every observation. The number of
    epochs is 500. You can play around with these values to see the outcome. Execute
    the following script:


    ann\_clf.fit(train\_features, train\_labels, batch\_size=1, epochs = 500) 


    Once you execute the above method, the neural network will start executing, after
    each epoch you will see the accuracy displayed as shown in the following screenshot:


    ![image](d2d_images/image019.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
