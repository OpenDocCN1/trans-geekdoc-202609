    Here 0.2 means that 20% of the neurons will be dropped during each epoch.


    Let’s add three more layers of LSTM and dropout regularization. Take a look at
    the following script


    stock\_predictor .add(LSTM(units = 50, return\_sequences = True))


    stock\_predictor .add(Dropout(0.2))


    stock\_predictor .add(LSTM(units = 50, return\_sequences = True))


    stock\_predictor .add(Dropout(0.2))


    stock\_predictor .add(LSTM(units = 50))


    stock\_predictor .add(Dropout(0.2))


    You can see from the last LSTM layer that here we are not using “return\_sequence
    = True” since we are not adding any more LSTM layers after that.


    Adding Dense Layer


    We created LSTM layers in the last section. However, to make our RNN more robust
    we will add a dense layer at the end as we did with the CNN. Execute the following
    script to add a dense layer to our RNN:


    stock\_predictor .add(Dense(units = 1))


    The number of neurons in the output densely connected layer will be 1 here since
    we only have to predict a single value i.e. the opening stock price on a given
    day.


    Compiling RNN


    Like any other neural network, we need to compile our RNN in order to make train
    it on the training data. The following script compiles the algorithm.


    stock\_predictor.compile(optimizer = ''adam'', loss = ''mean\_squared\_error'')


    To compile the algorithm, we need to call the compile method on the Sequential
    model object which is “stock\_predictor” in our case. Here to calculate the loss
    we will use “mean\_squared\_error’ function and to reduce the loss or to optimize
    the algorithm, we will use the “adam” optimizer.


    Training the Algorithm


    The final step is to train the RNN. To do so, we will use the fit method of the
    Sequential object and pass it train\_feature, train\_labels, number of epochs
    and the batch size as shown below:


    stock\_predictor .fit(train\_features, train\_labels, epochs = 100, batch\_size
    = 32)


    When you execute the above script, you will see that our RNN will start training.
    Depending on the hardware, the training can take quite a bit of time.


