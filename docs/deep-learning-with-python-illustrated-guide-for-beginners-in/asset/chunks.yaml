    # LSTM 架构


    `RNN` 的记忆模块由一层组成。其中一个输入连同上一个输出或隐藏状态被馈入下一个节点。`LSTM` 的架构与 `RNN` 的不同在于，除了输出外，它还有一个细胞状态向量（cell
    state vector），负责维护长期记忆。`LSTM` 的基本架构所示：


    ![image](img/image045.png)


    不要被上述架构吓到，我们将详细查看 `LSTM` 的每一个组件。


    ## 细胞状态 (Cell State)


    `LSTM` 的第一个组件是细胞状态。请看下图：


    ![image](img/image042.png)


    细胞状态包含存储来自前几个时间步信息的值。在图中，`Ct-1` 是点 `t-1` 处的细胞状态。除了隐藏状态外，过去的细胞状态也会作为输入传递给时间步 `t`
    的 `LSTM`。同样，时间 `t` 的细胞状态（即 `Ct`）将作为输入传递给时间 `t+1` 的 `LSTM`，以此此类推。


    然而，我们不需要所有的过去信息。根据输入，我们需要更新过去的信息。为了在细胞状态中删除、添加或修改信息，`LSTM` 使用了不同类型的门（gates）。门由神经网络层中的
    sigmoid 操作组成，紧接着是逐点乘法（pointwise multiplication）操作。


    在 `LSTM` 神经网络节点的每个时间步，都会执行以下操作：


    ### 1. 遗忘门 (Forget Gate)


    在第一步中，需要遗忘的来自上时间步的信息被传递到细胞状态。执行此操作的门被称为遗忘门。请看下图。这里 `ft` 指的是遗忘门。


    ![image](img/image006.png)


    在遗忘门中，之前的隐藏状态和当前输入被拼接并通过 sigmoid 函数。对于细胞状态中的每个值，sigmoid 函数返回 `1` 或 `0`。在这里，`0`
    代表“可以忘记掉这个”，而 `1` 代表“保留此信息”。sigmoid 操作的结果与现有的细胞状态进行逐点乘法。


    遗忘门的现实例子可以是人的性别。如果来了一个性别不同的新人，我们需要更改所有的代词。遗忘门将帮助我们忘记上一个人的性别。


    ### 2. 输入门 (Input Gate)


    下一步是找到新信息（如果有，即要存储在细胞状态中的信息）。为了找到需要更新的新信息，需要执行两个操作。第一个操作是确定细胞状态的哪些部分需要更新。这由图中由
    `it` 表示的输入门定义。第二部分是将替换旧值的新值向量，由图中所示的 `C~tas` 表示。


    ![image](img/image023.png)


    这一步的现实例子是：它会发现需要更新性别，而 `C^twill` 的结果产生性别的新值。


    ### 3. 更新细胞状态 (Updating the Cell State)


    现在我们拥有了更新细胞状态所需的所有信息。我们只需要执行第 1 步和第 2 步中得出的操作。第 3 步可以视觉化地表示：


    ![image](img/image061.png)


    （注：原文后续存在大量重复段落，译文已按要求去重并保持逻辑连贯）


