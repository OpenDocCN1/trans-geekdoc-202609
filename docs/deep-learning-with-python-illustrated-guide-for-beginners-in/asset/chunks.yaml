- raw: 'Threshold function squashes the value of the sum of dot products (multiplication
    of weight matrix by input matrix) of weights and inputs between 0 and 1. If the
    sum is less than 0, activation function outputs 0. If the sum is positive, the
    activation function returns 1.


    1.  Sigmoid Function


    The sigmoid function is a smooth version of the threshold function. If the sum
    is greater than 0, the sigmoid function doesn’t exactly return 1, it returns a
    value closer to 1.  If the sum is less than 0, a value closer to zero is return.
    The sigmoid function looks like this. If the sum is zero, the value returned by
    the sigmoid function is 0.5.


    ![image](d2d_images/image053.png)


    1.  Rectifier


    The rectifier function returns 0 if the sum of weights and input dot product is
    less than zero and returns the actual value if the sum is greater than zero. 


    1.  Hyperbolic Tangent


    The hyperbolic tangent function is like the sigmoid function but squashes the
    value between 1 and -1 and returns zero when the input is zero. Returns positive
    number between 1 and 0 when the input is positive and returns a negative number
    between 0 and -1 if the input is 0.


