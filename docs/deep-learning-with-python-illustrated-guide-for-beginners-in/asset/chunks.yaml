    的 `Keras` 库来实现人工神经网络。`Keras` 库基本上是 Google 开发的低级机器学习库 `Tensorflow` 的封装。然而，`Tensorflow`
    需要非常深厚的机器学习知识以及上百行代码来实现实用的神经网络。但另一方面，通过 `Keras`，你只需要几行代码就可以实现一个 `ANN`。


