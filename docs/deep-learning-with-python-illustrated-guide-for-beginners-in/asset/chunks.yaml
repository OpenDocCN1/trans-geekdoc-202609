    # Multilayer Perceptron


    ![image](d2d_images/chapter_title_below.png)


    Now we know what a perceptron is and what an activation function is. Perceptron
    acts like logistic regression, it can find linear boundaries. However, real-world
    data is not always linearly separable. In such cases, a single neuron cannot be
    used. A solution to find non linearly separable boundaries is to use multiple
    neurons and chain them in the form of layers as shown below:


    ![image](d2d_images/image018.png)


    A multilayer Perceptron (Image from [texample.net](http://www.texample.net/tikz/examples/neural-network/))


    A multilayer perceptron (also known as a densely connected neural network) is
    the simplest neural network. It consists of an input layer which is similar to
    the perceptron. However, instead of directly predicting the output, it involves
    at least one or more hidden layers. Data from the input layer is passed to the
    immediate next hidden layer, which passes it to the next hidden layer and so on.
    Each hidden layers consists of two or more than two nodes. The dot product of
    inputs and weights is summed at each node and passed through an activation function.
    Normally, the activation function used in the hidden layers is a rectifier function
    while the activation function used at the output layer is a sigmoid function.


    If the output is continuous or binary, one output node is enough. However, if
    the output involves more than two categories, more than one nodes is required
    at the output layer each corresponding to each category.


