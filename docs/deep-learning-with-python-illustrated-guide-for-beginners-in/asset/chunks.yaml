    1.  Creating the ANN


    Now let’s create our artificial neural network that we will use for cross validation. 
    We will create a method that creates the artificial neural network with two hidden
    layers and one output layer as we did in the last chapter. Take a look at the
    following script:


    from keras.models import Sequential


