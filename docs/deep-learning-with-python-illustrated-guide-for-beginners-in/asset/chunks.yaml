    \n![image](img/chapter_title_below.png)\n\n以下是深度学习的一些优势：\n\n1. 在给定合理数据量的情况下，机器学习模型将大幅超过传统的机器学习。但这里的关键是大量数据。以下图片解释了这种关系：\n\
    \n（图片来自 Andrew Ng 的幻灯片）\n\n2. 深度学习通过寻找最合适的特征消除了对特征工程的需求。\n\n3. 深度学习技术可以很容易适应新领域，例如循环神经网络被用于解决时间序列问题，也用于自然语言处理。同样，卷积神经网络也被用于\
