    \ to Sequence Modelling with LSTM\n\nIn the previous chapter, we saw how `LSTM`\
    \ can be used for text classification. However, `LSTM` can be used for a variety\
    \ of natural language processing tasks. Sequence to sequence, also known as `seq2seq`\
    \ is one of the most famous examples of the `LSTM` applications for NLP. In this\
    \ article, we will first study the theory behind `seq2seq` models. We will then\
    \ move on to build a very simple Chatbot, capable of answering basic user queries.\
    \ The Chatbot will not be very advanced, but you will get the idea behind the\
    \ working principles of `seq2seq` architecture.\n\n## What is Sequence to Sequence\
    \ Modelling?\n\nIn chapter 8, we studied that `RNN` can be used for a variety\
    \ of applications. The applications of `RNN` can be divided into the following\
