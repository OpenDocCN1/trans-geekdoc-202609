    \nFinally, we write a function that takes in the input sequence, and returns back\
    \ the output sequence. The script for the function looks likes that:\n\ndef generate\\\
    _response(input\\_seq):\n\n\\# Encode the input as state vectors.\n\nstates\\\
    _value = encoder\\_model.predict(input\\_seq)\n\n\\# Generate empty target sequence\
    \ of length 1.\n\ntarget\\_seq = np.zeros((1, 1))\n\n\\# Populate the first character\
    \ of target sequence with the start character.\n\n\\# NOTE: tokenizer lower-cases\
    \ all words\n\ntarget\\_seq\\[0, 0\\] = word2idx\\_outputs\\['<sos>'\\]\n\n\\\
    # if we get this we break\n\neos = word2idx\\_outputs\\['<eos>'\\]\n\n\\# Create\
