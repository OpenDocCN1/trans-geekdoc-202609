    ![image](d2d_images/image057.png)


    Perceptron (Image from [Wikimedia.org](https://commons.wikimedia.org/wiki/File:Sadssa.png))


    A perceptron consists of one input layer and one output. The data is passed to
    the input layer for instance in the figure above x1, x2 to xn are the values of
    different feature attributes for a single data instance.  The number of nodes
    in the input layer depends upon the number of feature attributes. Input from the
    input layer is multiplied with the synapse which contains some weight; each feature
    in the input layer is multiplied by the corresponding weight and added to the
    bias values. We will discuss “bias later”. These values are passed to the output
    node where the sum of all of these multiplications is carried out using the following
    formula.


    ![image](d2d_images/image036.png)


    The sum is then passed through the activation function which is g(x) in the above
    figure which is basically the nucleus of the perceptron. The output of the activation
    function is treated as the final output of the perceptron. In the case of multilayer
    perceptron, the output of one perceptron is fed to the other perceptron and so
    on.


