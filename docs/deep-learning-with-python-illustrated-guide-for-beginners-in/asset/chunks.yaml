    \ above, we first import the `ImageDataGenerator` from the `keras.preprocessing.image`\
    \ library. We then create an object of the class. In the constructor, we need\
    \ to pass the values for `rescaling`, `shear_range`, `zoom_range` and `horizontal_flip`.\
    \ These are all the different types of transformations that will be applied to\
    \ the images in order to different types of training data. In the script above,\
    \ we apply these transformations for the training set.\n\nFor the test set, we\
    \ want to keep everything as it is except that we will scale the images. Execute\
    \ the following script to create an image data generator for the test class.\n\
    \n```python\ntest_setgen = ImageDataGenerator(rescale = 1./255)\n```\n\n## Creating\
    \ Training and Test Sets\n\nWe have created the classed for transforming training\
    \ and testing set. We will use these classes to create training and tests sets\
    \ that we are going to use. Take a look at the following script:\n\n```python\n\
    training_data = train_setgen.flow_from_directory(r'D:/Datasets/animal_data/training_set',\n\
    \                                               target_size = (64, 64),\n    \
    \                                           batch_size = 32,\n               \
    \                                class_mode = 'binary')\n\ntest_data = train_setgen.flow_from_directory('D:/Datasets/animal_data/test_set',\n\
    \                                               target_size = (64, 64),\n    \
    \                                           batch_size = 32,\n               \
    \                                class_mode = 'binary')\n```\n\nSince, our images\
    \ are stored in a local directory; therefore, we need to call `flow_from_directory`\
    \ method in order to apply transformation. The method takes four parameters. The\
    \ first parameter is the path of the directory that contains the images that you\
    \ want to transform.\n\nThe second parameter is the `target_size` parameter that\
    \ specifies the dimensions of the images. In the first convolutional layer, we\
    \ specified that our images are going to be 64 x 64 pixels. Therefore, pass a\
    \ tuple of `(64, 64)` to the `target_size` parameter.\n\nThe second parameter\
    \ is the `batch_size` parameter, which specifies the batch size of the images\
    \ that you want to generate. Finally, since we have two classes in the output\
    \ i.e. cats and dogs, therefore, we set `class_mode` parameter as a binary.\n\n\
    ## Finding Accuracy\n\nWe have training data and testing data in the desired format.\
    \ The next step is to train the model and find the accuracy. Execute the following\
    \ script to do so:\n\n```python\ncnn_clf.fit_generator(training_data,\n      \
    \                steps_per_epoch = (8000/32),\n                      epochs =\
    \ 25,\n                      validation_data = test_data,\n                  \
    \    validation_steps = (2000/32))\n```\n\nTo train our model we need to call\
    \ the `fit_generator` method on the `cnn_clf` object. We need to pass the training\
    \ data as the first parameter. The second parameter is the `steps_per_epochs`\
    \ which is basically batch size. Since we have 32 images in each batch, we divide\
    \ the number of images in a batch by the total number of batches so that each\
    \ image is used once for training during the batch. The number of epochs is the\
    \ number of times you want to repeat the training overall batch. The `validation_data`\
    \ parameter received `test_data` as a parameter. Finally, for the test set, you\
    \ again have to pass the number of batches. Here again, we have 2000 batches and\
    \ in one batch 32 images are tested. Therefore, two test all the 2000 images in\
    \ the test set we divide 2000 by 32.\n\nThe above script will run.\n"
  trans: "\n卷积神经网络的最后一步是将数据从展平层（flatten layer）输入到全连接层（densely connected layer）。全连接层与我们在第\
    \ 3 章和第 4 章中创建 ANN 时使用的相同层。我们将使用一个包含 128 个节点的隐藏层。以下脚本添加了一个隐藏层：\n\n```python\n\
    h1 = Dense(units = 128, activation = 'relu')\ncnn_clf.add(h1)\n```\n\n在输出层中，由于是二分类结果，我们将使用\
    \ sigmoid 激活函数。执行以下脚本：\n\n```python\nh2 = Dense(units = 1, activation = 'sigmoid')\n\
    cnn_clf.add(h2)\n```\n\n## 编译 CNN\n\nCNN 的编译步骤与 ANN 类似。我们使用 `compile` 函数并向其传递优化器函数、损失函数和指标，如下所示：\n\
    \n```python\ncnn_clf.compile(optimizer = 'adam', loss = 'binary_crossentropy',\
    \ metrics = ['accuracy'])\n```\n\n## 图像数据增强\n\n在我们的数据集中，有 8 万张图像用于训练模型。这实际上是一个非常小的数字，可能会导致过拟合（over-fitting）。过拟合是指机器学习模型在训练数据上的准确率较高，但对测试实例的预测准确率的现象。\n\
    \n在简单的机器学习问题中，我们只需要找到因变量和自变量之间的关系。然而，在图像的情况下，机器学习模型必须找到图像不同部分之间的关系。因此，对于图像分类，需要大量的图像。\n\
    \n幸运的是，Keras 包含一个名为 `ImageDataGenerator` 的类，它可以帮助从现有图像生成不同类型的图像，从而增加训练集中的图像数量。\n\
    \n`ImageDataGenerator` 类生成图像的副本，然后执行诸如切换图像方向、缩小尺寸、扭曲图像等任务，从现有图像中创建新的独特图像。\n\n\
    查看以下脚本以了解 `ImageDataGenerator` 类的工作。\n\n```python\nfrom keras.preprocessing.image\
    \ import ImageDataGenerator\n\ntrain_setgen = ImageDataGenerator(rescale = 1./255,\n\
    \                               shear_range = 0.2,\n                         \
    \      zoom_range = 0.2,\n                               horizontal_flip = True)\n\
    ```\n\n在上面的脚本中，我们首先从 `keras.preprocessing.image` 库导入 `ImageDataGenerator`。然后我们创建该类的对象。在构造函数中，我们需要传递\
    \ `rescaling`、`shear_range`、`zoom_range` 和 `horizontal_flip` 的值。这些都是应用于图像的不同类型的变换，以生成不同类型的训练数据。在上面的脚本中，我们为训练集应用了这些变换。\n\
    \n对于测试集，我们希望保持一切不变，只是缩放图像。执行以下脚本为测试类创建一个图像数据生成器。\n\n```python\ntest_setgen = ImageDataGenerator(rescale\
    \ = 1./255)\n```\n\n## 创建训练集和测试集\n\n我们已经创建了转换训练集和测试集的类。我们将使用这些类来创建要使用的训练集和测试集。查看以下脚本：\n\
    \n```python\ntraining_data = train_setgen.flow_from_directory(r'D:/Datasets/animal_data/training_set',\n\
    \                                               target_size = (64, 64),\n    \
    \                                           batch_size = 32,\n               \
    \                                class_mode = 'binary')\n\ntest_data = train_setgen.flow_from_directory('D:/Datasets/animal_data/test_set',\n\
    \                                               target_size = (64, 64),\n    \
    \                                           batch_size = 32,\n               \
    \                                class_mode = 'binary')\n```\n\n由于我们的图像存储在本地目录中；因此我们需要调用\
    \ `flow_from_directory` 方法来应用变换。该方法接受四个参数。第一个参数是包含你想转换的图像的目录路径。\n\n第二个参数是 `target_size`\
    \ 参数，指定了图像的尺寸。在第一个卷积层中，我们指定图像将是 64 x 64 像素。因此，向 `target_size` 参数传递一个元组 `(64, 64)`。\n\
    \n第三个参数是 `batch_size` 参数，指定了要生成的图像批大小。最后，由于我们的输出中有两个类（即猫和狗），因此我们将 `class_mode`\
    \ 参数设置为二分类（binary）。\n\n## 寻找准确率\n\n我们已经有了所需格式的训练数据和测试数据。下一步是训练模型并找到准确率。执行以下脚本进行操作：\n\
    \n```python\ncnn_clf.fit_generator(training_data,\n                      steps_per_epoch\
    \ = (8000/32),\n                      epochs = 25,\n                      validation_data\
    \ = test_data,\n                      validation_steps = (2000/32))\n```\n\n为了训练模型，我们需要在\
    \ `cnn_clf` 对象上调用 `fit_generator` 方法。我们需要将训练数据作为第一个参数传递。第二个参数是 `steps_per_epoch`，它基本上是批大小。由于每个批次有\
    \ 32 张图像，我们将图像总数除以批大小，以便在批处理期间每张图像被使用一次。`epochs` 的数量是你希望重复整个批训练的次数。`validation_data`\
    \ 参数接收了 `test_data` 作为参数。最后，对于测试集，你再次需要传递批数。在这里我们再次有 2000 个批次，每个批次测试 32 张图像。因此，两次测试即可完成测试集中所有的\
    \ 2000 张图像，我们将 2000 除以 32。\n\n上述脚本将运行。\n\n"
