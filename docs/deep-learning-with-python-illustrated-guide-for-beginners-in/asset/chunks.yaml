    # Grid Search


    ![image](d2d_images/chapter_title_below.png)


    The job of a machine learning algorithm is to find the best set of parameters
    or weights that yield best results. These parameters are found by the algorithms
    and depend upon the dataset. We cannot control these parameters.


    However, there is another set of parameters that is specified before the algorithm
    is run. For instance value of K for the KNN algorithm, the type of kernel for
    the SVM algorithm, the number of estimators for the Random forest algorithm, number
    of nodes, batch\_size, and the number of epochs for an artificial neural network
    and so on. These parameters can be controlled or specified.


    However, we do not really know the best value for these parameters. In the last
    section, we set the batch\_size of 10 for ANN with 500 epochs. However, we do
    not know if this is the ideal. What if the algorithm performs better with a batch
    size of 5 and 300 epochs?


    Grid Search algorithm helps us solve this problem. Basically what Grid Search
    algorithm does is, it automatically finds best parameters for a particular algorithm
    from a set of parameters.


