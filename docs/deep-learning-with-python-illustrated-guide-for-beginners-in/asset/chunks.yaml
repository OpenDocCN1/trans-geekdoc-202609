- raw: 'Both our inputs and output sentences are not of the same size. We will pad
    the inputs according to the longest sentence in the input text. Similarly, the
    target text and target text input will be padded as per the longest sentence in
    the output data. Execute the following script to pad input and output data:


    encoder\_inputs = pad\_sequences(input\_sequences, maxlen=max\_len\_input)


    decoder\_inputs = pad\_sequences(target\_sequences\_inputs, maxlen=max\_len\_target,
    padding=''post'')


    decoder\_targets = pad\_sequences(target\_sequences, maxlen=max\_len\_target,
    padding=''post'')


    Step 5:  Loading Word Embeddings and Creating Word Embedding Matrix


    We will use Glove embeddings to achieve vector representation of the word. Execute
    the following script to load pertained word vectors and create word embeddings:


    print(''Loading Word Vectors'')


    embedding\_dic = {}


    with open("E:/glove.6b.100d.txt", encoding= "utf8") as vector\_list:


    for line in vector\_list:


    dimensions = line.split()


    word = dimensions\[0\]


    vector = np.asarray(dimensions\[1:\], dtype=''float32'')


    embedding\_dic\[word\] = vector


    ––––––––


    ![image](d2d_images/scene_break.png)


    num\_words = min(VOCABULARY\_SIZE, len(word2idx\_inputs) + 1)


    embedding\_matrix = np.zeros((num\_words, VECTOR\_DIM ))


    for word, i in word2idx\_inputs.items():


    if i < num\_words:


    embedding\_vector = embedding\_dic.get(word)


    if embedding\_vector is not None:


    embedding\_matrix\[i\] = embedding\_vector


    Step 6:  Creating Input Embedding Layer and Output One Hot Encoded Layer


    Before we create our model, we need to create the input embedding layer and the
    one hot encoded output layer. Since we are using Softmax function at the output
    node, our output should be one hot encoded. The following script creates an embedding
    layer and one hot encoded output vector:


    embedding\_layer = Embedding(


    num\_words,


    VECTOR\_DIM,


    weights=\[embedding\_matrix\],


    input\_length=max\_len\_input,


    \# trainable=True


    )


    ––––––––


    ![image](d2d_images/scene_break.png)


    decoder\_targets\_one\_hot = np.zeros(


    (


    len(input\_texts),


    max\_len\_target,


    num\_words\_output


    ),


    dtype=''float32''


    )


    ––––––––


    ![image](d2d_images/scene_break.png)


    for i, d in enumerate(decoder\_targets):


    for t, word in enumerate(d):


    decoder\_targets\_one\_hot\[i, t, word\] = 1


    Step 7:  Creating the Model


    We have preprocessed all the data needed to create our model. Now is the time
    to create our model.


    As we said earlier, we need to create two LSTMs: an encoder LSTM and a decoder
    LSTM. Let’s first define the input, embedding layer and the output for the encoder.
    Execute the following script:


    encoder\_inputs\_placeholder = Input(shape=(max\_len\_input,))


    x = embedding\_layer(encoder\_inputs\_placeholder)


    encoder = LSTM(


    LSTM\_NODES,


    return\_state=True,


    )


    encoder\_outputs, h, c = encoder(x)


    encoder\_states = \[h, c\]


    In the script above, we create input place holders for the encoder input. We know
    that encoder receives a sequence of input sentences. Therefore, the shape of the
    input is the “max\_len\_input” parameter.


    Next, we pass our input through the embedding layer. Finally, we create our encoder
    and set its return state to true. The input passed through the embedding layer
    is passed to the encoder which returns output, hidden state, and cell state. From
    the encoder, we only need the cell state and hidden state, which we capture in
    the “encoder\_states” list.


    Similarly, let’s create input and output for the decoder. Execute the following
    script:


    decoder\_inputs\_placeholder = Input(shape=(max\_len\_target,))


    decoder\_embedding = Embedding(num\_words\_output, LSTM\_NODES)


    decoder\_inputs\_x = decoder\_embedding(decoder\_inputs\_placeholder)


    decoder\_lstm = LSTM(


    LSTM\_NODES,


    return\_sequences=True,


    return\_state=True,


    )


    decoder\_outputs, \_, \_ = decoder\_lstm(


    decoder\_inputs\_x,


    initial\_state=encoder\_states


    )


    In the script above, we first define the input place holder for the decoder. Notice
    the length of the input shape for the input place holder is “max\_len\_target”
    which is the length of the longest sentence in target\_text list. Next, we pass
    the input placeholder through embedding layer. We then create an LSTM with return\_sequences
    = True since we need output at every point in the decoder. Notice that the initial\_state
    of the decoder\_lstm is set to encoder\_states which consists of the hidden state
    and cell state of the encoder at the output unit.


    Next, we need to create a dense layer and pass the decoder output to the dense
    layer. Take a look at the following script:


    decoder\_dense = Dense(num\_words\_output, activation=''softmax'')


    decoder\_outputs = decoder\_dense(decoder\_outputs)


    Next, we need to create the model and compile it as shown below:


    model = Model(\[encoder\_inputs\_placeholder, decoder\_inputs\_placeholder\],
    decoder\_outputs)


    model.compile(


    optimizer=''rmsprop'',


    loss=''categorical\_crossentropy'',


    metrics=\[''accuracy''\]


    )


    Finally, we need to fit our model on our data that we created in Step 1 to Step
    6. Execute the following script to do so:


    r = model.fit(


    \[encoder\_inputs, decoder\_inputs\], decoder\_targets\_one\_hot,


    batch\_size=BATCH\_SIZE,


    epochs=EPOCHS,


    validation\_split=0.2,


    )


    You will see that our model will start training. At the end of 20 epochs, you
    should see an accuracy of around 87.21% as shown in the following figure:


    ![image](d2d_images/image043.png)


    Step 8: Making Predictions


    We have trained our model; the next step is to make predictions. In the prediction
    phase, we will again have encoder-decoder architecture. However, we will not train
    the encoders and decoders since we have trained them already. All we need to do
    is to change the input parameters.


    First, let’s discuss how our encoder will look like for making predictions. Take
    a look at the following script:


    encoder\_model = Model(encoder\_inputs\_placeholder, encoder\_states) 


    Here the encoder will be stand alone. Remember, we will not train the encoding
    model since we have already trained everything (Basically, in training the weights
    are updated). The weights have already been updated. The only job of the encoder
    is to take sequence as input and output the final hidden state and cell state
    of the LSTM.


    Next, we need to define the inputs and outputs for our decoder. In the training
    phase, the inputs to the decoder were the hidden and cell state from the last
    LSTM unit of the input sequence and the whole target sequence offset by 1. The
    output was the corresponding target sequence.


    In case of predictions, we do not have the whole target sequence since this is
    what we have to predict. The only thing we have is the hidden and cell state from
    the input sequence and the start of the word for the target sequence. The output
    of the decoder will be the corresponding target word and the cell state and the
    hidden state. This cell state and the hidden state, along with the predicted word
    will be used as input to the next LSTM unit for the decoder.


    Let’s create inputs for the decoder LSTM:


    decoder\_state\_input\_h = Input(shape=(LSTM\_NODES,))


    decoder\_state\_input\_c = Input(shape=(LSTM\_NODES,))


    decoder\_states\_inputs = \[decoder\_state\_input\_h, decoder\_state\_input\_c\]


    These are the hidden states and the cell state that each decoder LSTM will receive
    as input.


    Next, we need to specify the input shape. Since this time, there will only be
    a one word as input, the shape of input will be 1. The input is needed to be passed
    through, embedding layer. The following script does that:


    decoder\_inputs\_single = Input(shape=(1,))


    decoder\_inputs\_single\_x = decoder\_embedding(decoder\_inputs\_single)


    Finally, we need to pass the decoder\_states\_inputs, and decoder\_inputs\_single\_x
    as the single word to the decoder LSTM, that we trained during the training phase.


    decoder\_outputs, h, c = decoder\_lstm(


    decoder\_inputs\_single\_x,


    initial\_state=decoder\_states\_inputs


