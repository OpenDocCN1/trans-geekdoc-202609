    ![image](d2d_images/chapter_title_above.png)


    # Data Analysis


    ![image](d2d_images/chapter_title_below.png)


    If you open the file, you will see that it contains seven columns: Date, Open,
    High, Low, Close, Adj Close and Volume. We are only interested in predicting the
    future stock price at the opening of the day.


    Figure 9.1 shows how the price at the opening of the day faired over a period
    of five years. The pattern is extremely irregular and with a normal ANN, it is
    very hard to capture such a pattern. This is where LSTM comes to play. The LSTM
    is capable of finding such a sequential pattern in the data.


    We have visualized the data, now is the time to do some real programming. We will
    follow the traditional machine learning pipeline for this purpose.


    ![image](d2d_images/image005.png)


    Figure 9.1: Variation of Opening Stock Price over the years


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Importing the Libraries


    ![image](d2d_images/chapter_title_below.png)


    Import numpy as np


    importmatplotlib.pyplot as plt


    import pandas as pd


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Loading the Dataset


    ![image](d2d_images/chapter_title_below.png)


    The following script loads the dataset and stores it in the stock\_datadataframe.


    stock\_data = pd.read\_csv(''D:\\Datasets\\ms-training.csv'')


    We do not the whole dataset for training. We only need the values in the “Open”
    column. The following script extracts values from the open column and stores it
    in a numpy array:


    stock\_training=  stock\_data.iloc\[:, 1:2\].values


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Scaling the Data


    ![image](d2d_images/chapter_title_below.png)


    The input data to an LSTM should always be scaled. For the sake of this article,
    we will normalize our data so that it is scaled. Execute the following script
    to do so:


    fromsklearn.preprocessing import MinMaxScaler


    normalizer = MinMaxScaler(feature\_range = (0, 1))


    stock\_training\_scaled = normalizer.fit\_transform(stock\_training)


    In the script above we use the MinMaxScaler class from sklearn.preprocessing library.
    We use the feature\_range parameter to scale the data between 0 and 1.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Data Preprocessing


    ![image](d2d_images/chapter_title_below.png)


    Data pre-processing is one of the most important steps in a recurrent neural network.
    We need to input the data to an RNN in such a way that it contains the information
    about previous time steps as well as the current time steps since we said earlier
    that an RNN learns from previous data.


    To train our algorithm, we will use the opening stock price over the previous
    60 days. The number 60 has been chosen because various researchers have tried
    to predict the opening stock price at any given day based on previous 10, 20,
    and 50 and 60 days and the results show that the best performance is achieved
    on using last 60 days as input.


    In other words, we need to include past 60-time steps in the training data. The
    output or the label will contain only single value i.e. the opening stock price
    at 61^(st) day.


    The following script creates training and test sets:


    train\_features = \[\]


    train\_labels = \[\]


    for i in range(60, 1258):


    train\_features.append(stock\_training\_scaled\[i-60:i, 0\])


    train\_labels.append(stock\_training\_scaled\[i, 0\])


    In the script above, we declare two lists: train\_features and train\_labels.
    We then loop through 61^(st)  (index starts from zero in numpy array, hence the
    60^(th) index contains 61^(st) element) to the last element in the stock\_training\_scaled
    array.


    In each loop cycle, we append the previous 60 values to the train\_features list
    and the current value to the train\_labels list. In the output, we add the current
    element.


    Finally, we need to convert our training and test set to numpy arrays. The following
    script does that:


    train\_features, train\_labels = np.array(train\_features), np.array(train\_labels)


    Finally, we need to reshape our dataset into a specific format. The LSTM expects
    data in a three-dimensional format where the first dimension is the number of
    records in the training dataset, the second dimension is the number of time steps
    while the third dimension is the number of indicators. The number of indicators
    simply refers to the number of features. Let’s reshape our data so that it matches
    the requirements of LSTM.


    Execute the following script:


    train\_features = np.reshape(train\_features, (train\_features.shape\[0\], train\_features.shape\[1\],
    1))


    In the script above we use the reshape function from the numpy array. The first
    parameter to the reshape function is the dataset itself. We passed it the training\_feature
    list. The second parameter is the number of records in the training set. To find
    the number of records in the training\_shape we use the shape attribute. The third
    feature is the number of time steps which is basically the columns in the training\_features
    list and finally, the last parameter is the number of indicators. Since here we
    are only using 1 feature i.e. open, we set the number of indicator value to 1.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Creating RNN (LSTM)


    ![image](d2d_images/chapter_title_below.png)


    We have now converted our data into the right format. The next step is to build
    our RNN. We will create sequential RNN with multiple layers. It will have LSTM
    layer and finally a densely connected neural network layer at the end. We also
    use drop out regularization to avoid over-fitting our data. Execute the following
    script to import the libraries required to create RNN.


    from keras.models import Sequential


    from keras.layers import Dense


    from keras.layers import LSTM


    from keras.layers import Dropout


    \# Initialising the RNN


    regressor = Sequential()


    In the script above we imported the Sequential class from Keras.models library
    and Dense, LSTM and Dropout classes from Keras.layers library.


    Creating a Sequential Model


    We begin by creating a sequential model. We will add layers to this model. Execute
    the following script:


    stock\_predictor = Sequential()


    Adding LSTM Layer and Drop Out


    We will start building our sequential model with LSTM layer. To add the first
    LSTM layer, execute the following script:


    stock\_predictor .add(LSTM(units = 50, return\_sequences = True, input\_shape
    = (train\_features.shape\[1\], 1)))


    To the add LSTM layer to the sequential model, we pass the LSTM object to the
    add method. The first parameter to the LSTM object is the number of neurons in
    the layer, denoted by units. The second parameter is the return\_sequence which
    specifies that there will be more LSTM layers stacked on this layer. Finally,
    the third parameter is the input\_shape which takes two arguments: number of time
    steps and the number of indicators.


    After adding the LSTM layer, we need to add regularization which basically refers
    to the number of neurons dropped during each iteration of training. This is done
    in order to avoid over-fitting. Execute the following script to add drop out regularization:'
