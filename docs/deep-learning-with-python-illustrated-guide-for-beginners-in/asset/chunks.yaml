    )\n```\n\n在上面的脚本中，我们首先为解码器定义了输入占位符。注意输入占位符的输入形状长度为 `max_len_target`，它是 `target_text`\
    \ 列表中长句子的长度。接下来，我们将输入占位符通过嵌入层。然后我们创建了一个 `return_sequences = True` 的 LSTM，因为我们需要在解码器的每个点都获得输出。注意\
    \ `decoder_lstm` 的 `initial_state` 被设置为 `encoder_states`，它包含了编码器在输出单元的隐藏状态和单元状态。\n\
    \n接下来，我们需要创建一个全连接层（dense layer）并将解码器输出传递到全连接层。查看以下脚本：\n\n```python\ndecoder_dense\
    \ = Dense(num_words_output, activation='softmax')\ndecoder_outputs = decoder_dense(decoder_outputs)\n\
    ```\n\n接下来，我们需要按照所示创建并编译模型：\n\n```python\nmodel = Model([encoder_inputs_placeholder,\
    \ decoder_inputs_placeholder], decoder_outputs)\nmodel.compile(\n    optimizer='rmsprop',\n\
    \    loss='categorical_crossentropy',\n    metrics=['accuracy']\n)\n```\n\n最后，我们需要在第\
    \ 6 步创建的数据上拟合模型。执行以下脚本来实现：\n\n```python\nr = model.fit(\n    encoder_inputs, decoder_inputs,\n\
    \    decoder_targets_one_hot,\n    batch_size=BATCH_SIZE,\n    epochs=EPOCHS,\n\
    \    validation_split=0.2\n)\n```\n\n你会看到我们的模型开始运行。在 20 个 epoch 结束后，你应该能看到如下图所示\
    \ 87.21% 的准确率：\n\n![image](img/image43.png)\n\n## 第 8：进行预测\n\n我们已经训练了模型；下一步是进行预测。在预测阶段，我们将再次使用编码器-解码器架构。然而由于我们已经训练好了，我们不需要训练编码器。首先，让我们讨论一下编码器在预测时将是什么样的。查看以下脚本：\n\
    \n```python\nencoder_model = Model(encoder_inputs_placeholder, encoder_states)\n\
    ```\n\n在这里编码器将独立工作。记住，我们不需要训练编码模型，因为权重已经更新。\n\n接下来，我们需要定义解码器的输入和输出。在训练阶段，解码器的输入是来自输入序列的隐藏和单元状态以及整个目标序列。输出是对应的目标序列。\n\
    \n在预测情况下，我们没有整个目标序列，因为这是我们要预测的内容。我们只有输入序列的隐藏状态和单元状态，以及目标序列的起始词。解码器的输出将是目标词以及单元状态和隐藏状态。\n\
    \n为解码器 LSTM 创建输入：\n\n```python\ndecoder_state_input_h = Input(shape=(LSTM_NODES,))\n\
    decoder_state_input_c = Input(shape=(LSTM_NODES,))\ndecoder_states_inputs = [decoder_state_input_h,\
    \ decoder_state_input_c]\n```\n\n这些是解码器 LSTM 接收的隐藏状态和单元状态。\n\n接下来，我们需要指定输入形状。由于这次只有一个单词输入，输入的形状为\
    \ 1。输入需要通过嵌入层。以下脚本执行了该操作：\n\n```python\ndecoder_inputs_single = Input(shape=(1,))\n\
    decoder_inputs_single_x = decoder_embedding(decoder_inputs_single)\n```\n\n最后，我们需要将训练阶段训练好的\
    \ `decoder_states_inputs` 和 `decoder_inputs_single_x`（单个单词）传递给解码 LSTM：\n\n```python\n\
    decoder_outputs, h, c = decoder_lstm(\n    decoder_inputs_single_x,\n    initial_state=decoder_states_inputs\n\
    )\n```\n\n"
