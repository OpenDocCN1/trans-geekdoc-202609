    # Downloading the Data


    ![image](d2d_images/chapter_title_below.png)


    The stock market data of Microsoft can be downloaded from a variety of sources.
    However, for the sake of this article, we downloaded the data from the following
    link:


    [https://finance.yahoo.com/quote/MSFT/history/?guccounter=1](https://finance.yahoo.com/quote/MSFT/history/?guccounter=1)


    If you go the above link, you will see the latest stock data for Microsoft. You
    can apply a date filter to filter for any desired time period.


    In this chapter, to train our RNN, we will use the Microsoft stock data for 5years
    from 1-Jan-2012 to 31-Jan-2016. To test our algorithm and make evaluations, we
    will use the Microsoft data for one month i.e. January 2017.


    For the sake of this chapter, the training data has been downloaded and saved
    in the Datasets folder of the D drive by the name ms-training.csv. Similarly,
    the test file has been saved as ms-testing.csv in the same folder.'
