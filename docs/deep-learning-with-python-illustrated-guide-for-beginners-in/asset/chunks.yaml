    # How ANN Learns?


    ![image](d2d_images/chapter_title_below.png)


    Now we have seen the neural network, the next question is “how do neural networks
    learn”. How do they know that this image is a cat or this image is a plane? Neural
    network learning involves two phases: Feed Forward and Back Propagation.


    Feed Forward


    Following are the steps involved in the feed forward phase of a neural network:


    1.  The input features or the values in the input layer are multiplied by the
    corresponding weights, bias is added to the sum and the resultant value is passed
    into nodes the first hidden layer.


    1.  Each node of the first hidden layer contains an activation function. The activation
    function is applied to the values received from the input layer. This process
    is performed at each node of the hidden layer.


    1.  The resultant values from each node of the first hidden layer are multiplied
    by the weights of the second hidden layer (if any)or the weights of the output
    layer if there is no second hidden layer. The result is passed to each node in
    the second hidden layer where again an activation function is applied and the
    result value is passed to the next hidden layer. The process continues till the
    output layer. The values at the output layer are the final result of the algorithm.


    In the beginning, the weights are randomly selected; therefore the output is usually
    not correct. The only thing we can control in a neural network is the weight of
    the synapse. The data points are immutable. 


    Back Propagation


    1.  The first step in the back propagation is to calculate the difference between
    the value predicted by the output layer and the actual output. This difference
    is called loss. The function used to calculate the loss is called loss function
    or cost function. Loss functions can be of many types e.g. cross entropy and mean
    squared error.


    1.  To minimize the value, we have to find the instantaneous rate of change in
    the value returned by the cost function with respect to each weight. Basically,
    we to find the values of weights for which the value returned by the cost function
    is minimized. This is an optimization problem and can be solved using differentiation.
    For this purpose, the gradient descent algorithm can be used. Basically, in the
    gradient descent algorithm, the partial derivative of the cost function is found
    with respect to each weight. If the value is positive, it is subtracted from the
    current, otherwise, it is added.


    This process of feed forward and back propagation continues until an acceptable
    amount of accuracy is achieved. One cycle involving feed forward and back propagation
    phase are called an epoch.


