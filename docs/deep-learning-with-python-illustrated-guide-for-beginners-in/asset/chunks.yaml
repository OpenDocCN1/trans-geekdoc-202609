    _states\\_inputs\n\n)\n\nIn the preprocessing steps, we converted words to integers.\
    \ The output of our model will be an integer. We need to convert the integer back\
    \ to the word. Execute the following script to do so:\n\nidx2word\\_input = {v:k\
    \ for k, v in word2idx\\_inputs.items()}\n\nidx2word\\_target = {v:k for k, v\
    \ in word2idx\\_outputs.items()}\n\nHere, idx2word\\_input and idw2word target\
    \ are the dictionaries where the key is the integer and the value is the word\
