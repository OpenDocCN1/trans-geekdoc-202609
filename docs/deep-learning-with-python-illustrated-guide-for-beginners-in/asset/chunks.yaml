    In the previous chapter, we studied the theory of Artificial Neural Network. We
    saw how densely connected layered structure is used to learn parameters or weights
    that can be used to correctly predict the outcome. In this chapter, we will see
    how Python’s `Keras` library can be used to implement the artificial neural network.
    `Keras` library is basically a wrapper for `Tensorflow`, a low-level machine learning
    library developed by Google. However, `Tensorflow` requires really deep knowledge
    of machine learning plus a hundred of lines of code to implement a useful neural
    network. However, on the other hand with `Keras`, you can implement an `ANN` with
    a few lines of code.


    The problem that we are going to solve with our densely connected `ANN` is to
    predict the quality of wine depending upon several features.

