    # Evaluating and Tuning the ANN


    ![image](d2d_images/chapter_title_below.png)


    In the previous chapter, we developed an Artificial Neural Network that predicted
    the quality of the wine. To train and test our algorithm, we divided our data
    into 80% training set and 20% test set. This means that we did not test our algorithm
    on the 80% of the data and similarly we did not train our algorithm on the 20%
    of the data. What if the 20% test contains information that is valuable for training? 
    Training and testing the algorithms on a fixed subset of data may lead to variance
    problem.


    Another problem that affects the performance comparison of different algorithms
    is the use of various hyperparameters such as K in the KNN algorithm and batch\_size
    and epochs for ANN. To compare two algorithms, we need to find the parameters
    that result in best performance. This problem can be solved using the Grid Search
    algorithm. 


    In this chapter, we will study Cross Validation and Grid Search in detail.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Cross-Validation


    ![image](d2d_images/chapter_title_below.png)


    Earlier we said that splitting data randomly into training and test set can lead
    to variance problem. Variance in performance evaluation of an algorithm refers
    to scenarios where an algorithm performance varies depending upon the dataset
    being used for training and testing.


    Cross-validation is the solution to the variance problem. In cross-validation,
    the dataset is divided into K folds where K is any integer. Each of the K folds
    or partition is at least once used in the training set as well as a testing set.
    For instance, let’s divide the dataset into 10 partitions. In the first iteration,
    the first 9 partitions are used for training and 10^(th) partition is used for
    testing. In the second iteration, 1^(st) to 8^(th) and 10^(th) partition is used
    for training and 9^(th) partition is used for testing. The process continues until
    every partition is used at least once for testing. The final performance of the
    algorithm can be evaluated by taking the mean of the results from individual tests.
    This solves variance problem since now the result is based on the algorithm being
    trained and tested on the complete dataset.


