    # The sequence to Sequence Modelling with LSTM


    ![image](d2d_images/chapter_title_below.png)


    In the previous chapter, we saw how LSTM can be used for text classification.
    However, LSTM can be used for a variety of natural language processing tasks.
    Sequence to sequence, also known as seq2seq is one of the most famous examples
    of the LSTM applications for NLP. In this article, we will first study the theory
    behind seq2seq models. We will then move on to build a very simple Chatbot, capable
    of answering basic user queries.  The Chatbot will not be very advanced, but you
    will get the idea behind the working principles of seq2seq architecture.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # What is Sequence to Sequence Modelling?


    ![image](d2d_images/chapter_title_below.png)


    In chapter 8, we studied that RNN can be used for a variety of applications. The
    applications of RNN can be divided into the following types:


    ![image](d2d_images/image002.png)


    An example of “one to one” application can be an Image labeling task where you
    have an image as input and its corresponding label as output. Similarly, the example
    of RNN “one to many” applications can be image captioning where a single image
    is an input and a sentence explaining the image is the output. Text classification
    is a classic example of “many to one” applications.


    Finally, we have two types of “many to many” applications. In the first type,
    inputs and outputs have varying size while in the second type the input and outs
    have the same size. These “many to many” applications are solved using the sequence
    to sequence technique that we are going to learn in this chapter.


    Parts of speech tagging is an example of “many to many” applications with a fixed
    size. For each word in the output, you have a corresponding word in the output.
    On the other hand, Neural Machine Translation is an example of “many to many”
    applications with varying input and output sizes. For instance, a sentence in
    one language may have 4 words, while its translation can have 3 words. In this
    Chapter, our focus will be on the application of sequence to sequence modeling
    for “many to many” applications with varying input and output size.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Sequence to Sequence Architecture


    ![image](d2d_images/chapter_title_below.png)


    Seq2seq model executes in two phases: Training and Inference. The architecture
    consists of two stacked LSTM networks called encoder and decoder. Take a look
    at the following figure for a high-level understanding of Sequence to Sequence
    Architecture:


    ![image](d2d_images/image032.png)


    Encoder Decoder Model for Training Seq2Seq ([Image Reference](https://towardsdatascience.com/seq2seq-model-in-tensorflow-ec0c557e560f))


    As you can see in the figure, the encoder is basically an LSTM, which is responsible
    for encoding input sequence and producing thought vector.  Though vector consists
    of the hidden state and the cell state that will be used as input by the decoding
    LSTM. The encoder LSTM node layers have been represented by the dark blue rectangles
    in the above figure. The output from the Encoding LSTM is used as the input to
    the decoding LSTM (Shown in dark red). However decoding LSTM not only receives
    the input from encoding LSTM, but it also receives the output, moved one step
    forward as the input to generate the final response. Let’s take a look at the
    steps being performed during the executing of Sequence to sequence modeling, in
    detail.


    Step 1 (Preparing Inputs for Encoding LSTM)


    The input to the Encoding LSTM will be an input sentence, converted into the embedding
    vector. Remember, in the last chapter,  we used Glove embedding vectors, in order
    to convert words into 100-dimensional embedding vectors. The output from the encoding
    LSTM will be the hidden state and cell state. We discussed the concepts of hidden
    state and cell state in the last chapter.


    Step 2 (Preparing Inputs for Decoding LSTM)


    The decoder LSTM receives two inputs from the encoding LSTM along with target
    text offset by one element as shown in the following figure:


    ![image](d2d_images/image001.png)


    Decoder Inputs ([Image Reference](https://towardsdatascience.com/seq2seq-model-in-tensorflow-ec0c557e560f))


    You can see from the figure above that the decoder model receives the hidden state
    and cell state of the encoding LSTM as well as the target output as input, offset
    by one. You can see in the above figure that our target is represented as one
    hot encoded string of all the words in the vocabulary, while the input is the
    same string in its original format.


    Step 3 (Training the Encoder Decoder Model)


    Once the inputs and outputs have been decided for the encoder and decoder model,
    the next step is to train the model. Since our output is actually a matrix where
    rows represent the sequence length while columns represent the one hot encoded
    output for each element in the sequence, we will use softmax as the activation
    function. In every iteration, weights are adjusted to minimize the difference
    between the input string and predicted string.


    Step 4 (The Inference Decoder)'
