    # Environment Setup


    ![image](d2d_images/chapter_title_below.png)


    In this chapter, we will install the software that we are going to use to run
    our Machine learning Programs. There are several options available to implement
    machine learning, however, we will be using Python since most of the advanced
    machine learning community is working with Python for machine learning. To install
    Python several options available. You can simply install core Python and use a
    text editor like notepad to write Python programs. These programs can then be
    run via command line utilities. The other option is to install an Integrated Develop
    Environment (IDE) for Python. IDE provides a complete programming environment
    including Python installation, Editors and debugging tools. Most of the advanced
    programmers take the IDE route for Python development. We are also going to take
    the same route.


    Anaconda is the IDE that we are going to use throughout this book. Anaconda is
    light, easy to install and comes with a variety of development tools. Anaconda
    has its own command line utility to install third party software. And the good
    thing is that with Anaconda, you don’t have to separately install the Python environment.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Downloading and Installing Anaconda


    ![image](d2d_images/chapter_title_below.png)


    Follow these steps to download and install anaconda. In this section, we will
    show the process of installing Anaconda for windows. The installation process
    remains almost the same for Linux and Mac.


    1-  Go to the following URL [https://www.anaconda.com/download/](https://www.anaconda.com/download/)


    2-  You will be presented with the following webpage. Select Python 3.6 version
    as this is currently the latest version of Python. Click the “Download” button
    to download the executable file. It takes 2-3 minutes to download the file depending
    upon the speed of your internet.


    ![image](d2d_images/image048.png)


    3-  Once the executable file is downloaded, go to the download folder and run
    the executable. The name of the executable file should be similar to “Anaconda3-5.1.0-Windows-x86\_64.”
    When you run the file you will see installation wizard like the one in the following
    screenshot. Click “Next” button.


    ![image](d2d_images/image010.png)


    4-  “License Agreement” dialogue box will appear. Read the license agreement and
    Click “I Agree” button.


    ![image](d2d_images/image003.png)


    5-  From the “Select Installation Type” dialogue box, check the “Just Me” radio
    button and click “Next” button as shown in the following screenshot.


    ![image](d2d_images/image031.png)


    6-  Choose the installation directory (Default is preferred) from the “Choose
    Install Location” dialogue box and click “Next” button. You should have around
    3 GB of free space in your installation directory.


    ![image](d2d_images/image040.png)


    7-  From the “Advanced Installation Options” dialogue box, select the second checkbox
    “Register Anaconda as my default Python 3.6” and click the “Install” button as
    shown in the following screenshot.


    ![image](d2d_images/image054.png)


    The installation process will start which can take some time to complete. Sit
    back and enjoy a cup of coffee.


    8-  Once the installation completes, click the “Next” button as shown below.


    ![image](d2d_images/image056.png)


    9-  “Microsoft Visual Studio Code Installation” window appears, click “Skip” button.


    ![image](d2d_images/image029.png)


    10-  Congratulations, you have installed Anaconda. Uncheck both the checkboxes
    on the dialogue box that appears and “Finish” button.


    ![image](d2d_images/image034.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


