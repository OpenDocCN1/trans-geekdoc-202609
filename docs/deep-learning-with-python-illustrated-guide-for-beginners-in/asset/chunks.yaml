    # 添加输入和隐藏层


    ![image](img/chapter_title_below.png)


    为了添加输入和隐藏层，使用了 `Dense` 类。`Dense` 类的 `units` 参数指定了层输出节点的数量。`kernel_initializer`
    参数指定了初始权重类型。`activation` 参数指定了激活函数，而 `input_dim` 指定了输入层特征的数量。需要注意的是，输入层并不是单独创建的，而是通过第一个隐藏层中的
    `input_dim` 参数指定输入层的节点数，所示：


    ```python

    h1 = Dense(units=9, kernel_initializer=''uniform'', activation=''relu'', input_dim=11)

    ann_clf.add(h1)

    ```


    在第一个隐藏层中，我们将节点数设置为 9。根据经验，节点数应该是输入节点和输出节点的平均值。我们有 11 个输入节点和 6 个输出节点。平均值为 8.5，因此我们在隐藏层中使用
    9 个节点。权重已初始化为均匀分布，而激活函数是 `relu`，它本质上是整流函数的简写。


    最后，我们调用 `Sequential` 类对象 `ann_clf` 的 `add` 函数，并传入我们刚刚创建第一个隐藏层。


    对于下一个隐藏层，其他部分保持相同，只是我们不需要指定输入维度，因为第二个隐藏层将从第一个隐藏层计算输入维度。执行以下脚本添加：


    ```python

    h2 = Dense(units=9, kernel_initializer=''uniform'', activation=''relu'')

    ann_clf.add(h2)

    ```


