- raw: 'The memory module of RNN consists of one layer. Where one input, along with
    the previous output or hidden state is being fed into the next node. The architecture
    of LSTM differs from RNN in a way that in addition to the output, it has a cell
    state vector as well which is responsible for maintaining long-term memory. The
    basic architecture of LSTM is shown below:


    ![image](d2d_images/image045.png)


    Don’t be intimidated by the above architecture, we will see each component of
    LSTM in detail.


    The first component of an LSTM is the cell state. Take a look at the following
    figure:


    ![image](d2d_images/image042.png)


    Cell state contains values that store the information from the previous time-steps.
    In the above figure, the Ct\-1 is the cell state at point t-1. In addition to
    the hidden state, the past cell state is also passed as input to the LSTM at time
    step t. Similarly, the cell state at time t i.e. Ct is passed as input to the
    LSTM at time t+1 and so on.


    However, we do not need all of the past information. And depending upon the input
    we need to update the past information. To remove, add or modify information in
    the cell state, different types of gates are used in LSTM. Gates consist of a
    sigmoid operation in the neural net layer, followed by a pointwise multiplication
    operation.


    The following operations are performed in an LSTM neural network node at each
    time step.


    1.  In the first step, the information from the previous time step that is needed
    to be forgotten is passed to the cell state. The gate that performs this operation
    is called forget gate. Take a look at the following figure. Here ft refers to
    the forget gate.


    ![image](d2d_images/image006.png)


    In the forget gate, the previous hidden state, and the current input are concatenated
    and passed through a sigmoid function. For each value in the cell state, the sigmoid
    function returns 1 or 0. Here 0 represents that okay forget this, while 1 represents
    that keep this information. The result of the sigmoid operation is pointwise multiplied
    with the existing cell state.


    Real world example of the forget gate can be the gender of the person. If a new
    person with a different gender comes, we need to change all the pronouns. The
    forget gate will help us forget the gender of the previous person.


    1.  The next step is to find out the new information (if any, that is to be stored
    in the cell state). To find out the new information to be updated, two operations
    are required to be performed. The first one is to identify what part of the cell
    state is to be updated. This is defined by the input gate represented by it in
    the following figure. The second part is the vector of new values that will replace
    the old value and is represented by C^~tas shown in the following figure.


    ![image](d2d_images/image023.png)


    A real-world example of this step is that it will find that gender has to be updated,
    while the C^~twill result in the new value of the gender.


    1.  Now we have all the information needed to update the cell state. We just need
    to perform the operations that we derived in step 1 and step 2. Step 3 can be
    visually represented as:


    ![image](d2d_images/image061.png)


    1.  We calculated the cell state; the next step is to find the output or the hidden
    state for the next state. It again has two parts; the first part is the sigmoid
    of the input and the previous hidden layer. This decides the part of the state
    that we are going to output. The cell state is passed through “tan” activation
    function so that the output vector is between 0 and 1 and then multiplied by the
    result of the sigmoid in order to output only the part defined by the sigmoid
    operation. The operations performed for the calculation of the output have been
    shown below:


    ![image](d2d_images/image044.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # LSTM in Practice


    ![image](d2d_images/chapter_title_below.png)


    Let’s take a look at a very simple of LSTM to understand the concept of cell state,
    hidden state, and the output. Take a look at the following script:


    from keras.models import Model


    from keras.layers import Input, LSTM


    import numpy as np


    importmatplotlib.pyplot as plt


    sequence\_length = 8


    features = 2


    lstm\_nodes = 3


    X = np.random.randn(1, sequence\_length, features)


    input\_ = Input(shape=(sequence\_length, features))


    rnn = LSTM(lstm\_nodes)


    output = rnn(input\_)


    model = Model(inputs=input\_, outputs = output)


    out = model.predict(X)


    print("out:", out)


    In the script above, we create a simple LSTM with three nodes. The input to the
    LSTM is a single sequence of length 8 and 2 features per element in the sequence.
    We use the [Keras Functional API](https://keras.io/getting-started/functional-api-guide/)
    to create our LSTM model.


    In our LSTM, we first need to create the Input layer and specify the shape of
    the input. The Input layer takes two parameters: The length of the sequence and
    the number of features per element in the sequence.


    Next, we create a simple LSTM and pass it the number of nodes. Finally, for output,
    we can simply use the input passed through output.


    Next, we create our model. The model class again takes two parameters, the input,and
    the output. We can now use this model to directly predict the output of the sequence
    using the “predict” function. The data point that we generated is passed as input
    to “predict”. In the output, you will see a list of three numbers. Each number
    corresponds to the output produced by one weight. The output looks like this:


    ![image](d2d_images/image012.png)


    Using Return\_State Parameter


    You can also see the value of the cell state and the hidden state by passing “return\_state
    = True” to the LSTM function. Modify the above script as follows:


    from keras.models import Model


    from keras.layers import Input, LSTM


    import numpy as np


    importmatplotlib.pyplot as plt


    sequence\_length = 8


    features = 2


    lstm\_nodes = 3


    X = np.random.randn(1, sequence\_length, features)


    input\_ = Input(shape=(sequence\_length, features))


    rnn = LSTM(lstm\_nodes, return\_state= True)


    output = rnn(input\_)


    model = Model(inputs=input\_, outputs = output)


    out, hidden, cell = model.predict(X)


    print("out:", out)


    print("hidden:", hidden)


    print("cell:", cell)


    The output looks like this:


    ![image](d2d_images/image007.png)


    You can see that with “return\_state = True”, we can get the value of the hidden
    state, output and cell state at the end of the sequence. Another interesting,
    observation here is that the output is actually same as the value of the hidden
    state at the end of the sequence. This shows that depending upon the node or the
    time step, the output is actually the hidden state.


    Using Return\_Sequences Parameter


    In addition to finding the output at the end of the sequence, you can also calculate
    the output at each time step of the sequence. To do so, you need to pass the “return\_sequences
    = True” to the LSTM class as shown below. Take a look at the following script:


    from keras.models import Model


    from keras.layers import Input, LSTM


    import numpy as np


    importmatplotlib.pyplot as plt


    sequence\_length = 8


    features = 2


    lstm\_nodes = 3


    X = np.random.randn(1, sequence\_length, features)


    input\_ = Input(shape=(sequence\_length, features))


    rnn = LSTM(lstm\_nodes, return\_state= True, return\_sequences = True)


    output = rnn(input\_)


    model = Model(inputs=input\_, outputs = output)


    out, hidden, cell = model.predict(X)


    print("out:", out)


    print("hidden:", hidden)


    print("cell:", cell)


    The output of the script above looks like this:


    ![image](d2d_images/image016.png)


    In the script above you can see 8 output values for 3 weights. We had 8 elements
    in the sequence and since we set “return\_sequences = True”, we got 8x3 output
    values, one each for time step and corresponding weight.'
