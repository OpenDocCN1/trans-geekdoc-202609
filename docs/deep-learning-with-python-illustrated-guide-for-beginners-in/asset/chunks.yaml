    # Making Predictions and Evaluating the Algorithm


    ![image](d2d_images/chapter_title_below.png)


    To make predictions, we use the predict method of the Sequential object and pass
    it our test features as shown below:


    predictions = ann\_clf.predict(test\_features) 


    The confusion matrix and the accuracy methods used for evaluation accept test
    labels and predicted labels in the form of a one-dimensional array. However, we
    have our test labels as well as predictions in the form of one hot encoded matrix.
    To convert this one hot encoded matrix into one dimensional array of outputs,
    execute the following script:


    predictions = np.argmax(predictions,axis=1)


    test\_labels = np.argmax(test\_labels,axis=1)


    Finally, to construct confusion matrix and calculate accuracy on the test set,
    we can use confusion\_matrix and accuracy\_score class of sklearn.matrics library
    as shown below:


    fromsklearn.metrics import classification\_report, confusion\_matrix, accuracy\_score


    print(confusion\_matrix(test\_labels, predictions)) 


    print(classification\_report(test\_labels, predictions)) 


    print(accuracy\_score(test\_labels, predictions))


    The output of the above script looks like this:


    ![image](d2d_images/image058.png)


    The accuracy achieved is 59.35% in this case which is not so great. But now you
    know how a neural network works and what its different steps are. I would suggest
    you play around with different parameter such as activation functions, the optimizer
    and loss functions, number of nodes in the hidden layers, number of layers and
    so on to see if you get better results or not.


