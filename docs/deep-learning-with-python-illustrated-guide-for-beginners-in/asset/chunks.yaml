    # Spam and Ham Email Classification


    ![image](d2d_images/chapter_title_below.png)


    In the previous section, we saw the theory behind LSTM in detail. In this section,
    we will see the application of LSTM for ham and spam email classification. Since
    LSTM is ideal for sequence problems, therefore we can use it for natural language
    processing applications such as text classification.


    The dataset for this application can be found in the Datasets folder. The path
    to the datasets folder has been mentioned in the introduction section of the book.
    The dataset that we are going to use for this example is the “spam.csv”


    We will follow the standard machine learning library for this task. Follow these
    steps:


    1.  Importing Required Libraries


    The first step is to import the required libraries for this task. Execute the
    following script to do so:


    import os


    import sys


    import numpy as np


    import pandas as pd


    importmatplotlib.pyplot as plt


    fromkeras.models import Model


    fromkeras.layers import Dense, Embedding, Input


    fromkeras.layers import LSTM, Bidirectional, GlobalMaxPool1D, Dropout


    fromkeras.preprocessing.text import Tokenizer


    fromkeras.preprocessing.sequence import pad\_sequences


    fromkeras.optimizers import Adam


    fromsklearn.metrics import roc\_auc\_score


    fromsklearn.preprocessing import LabelEncoder


    1.  Configuration Settings


    Let’s set up the configurations for our application. Execute the following script:


    MAX\_SENTENCE\_LENGTH = 150


    VOCABULARY\_SIZE = 2000


    VECTOR\_DIM = 100


    TRAIN\_TEST\_SPLIT = 0.2


    BATCH\_SIZE = 64


    EPOCHS = 10


    Here MAX\_SENTENCE\_LENGTH will be the maximum length of the sequence. Since our
    sentences are of variable size, but we can only input fixed size data to LSTM,
    we will pad the shorter sentences by zero and make them the same length as the
    largest sentence of the corpus.


    VOCABULAR\_SIZE is the number of words that we will use to create the embedding
    layer. The VECTOR\_DIM will be the number of features per word in the sentence.
    The TRAIN\_TEST\_SPLIT will define the size of the training and test sets. A value
    of 0.2 here indicates that our data will be divided into 20% test set and 80%
    train set. Our batch size will be 64 and we will have 10 epochs.


    1.  Loading Pre-trained Word Embeddings


    Natural language consists of texts. However, machine learning algorithms work
    with numbers. Therefore, we need to convert text into numbers. Text representation
    in numerical format is called embeddings.


    There are several ways to convert text into numbers. We can create embeddings
    from scratch or we can use pre-trained word embeddings. For the sake of this chapter,
    we will use pre-trained word embeddings called [Glove](https://nlp.stanford.edu/projects/glove/),
    developed by researchers at Stanford University. The text file for word embedding
    can be found in the datasets folder by the name “glove.6b.100d”. In this file,
    400000 words have been represented as 100-dimensional vectors.


    Next, we need to load these word vectors into our application. Execute the following
    script to do so. Please double check the path of the “glove.6b.100d” file before
    executing the following script:


    print(''Loading Pretrained Word Vectors'')


    embedding\_dic = {}


    with open("E:/Datasets/glove.6b.100d.txt", encoding= "utf8") as vector\_list:


    for line in vector\_list:


    dimensions = line.split()


    word = dimensions\[0\]


    vector = np.asarray(dimensions\[1:\], dtype=''float32'')


    embedding\_dic\[word\] = vector


    print("Total Embedding Vectors:" +  str(len(embedding\_dic)))


    1.  Importing the Dataset


    Let’s import the dataset for this chapter. Execute the following script to import
    the data and display the first five records:


    print(''Read mails'')


    email\_data = pd.read\_csv("E:/Datasets/spam.csv", delimiter='','',encoding=''latin-1'')


    email\_data.head()


    The first five records look like this:


    ![image](d2d_images/image014.png)


    The first column i.e. v1 contains the labels or the classes for the text while
    the second column contains messages.  We do not need the last three columns. Let’s
    drop these columns. Execute the following script:


    email\_data.drop(\[''Unnamed: 2'', ''Unnamed: 3'', ''Unnamed: 4''\],axis=1,inplace=True)


    email\_data.info()


    1.  Text Preprocessing


    Let’s create two separate variables for emails and their corresponding labels.
    Execute the following script to do so:


    emails = email\_data\["v2"\].fillna("DUMMY\_VALUE").values


    labels = email\_data\["v1"\]


    Let’s first convert our labels to numbers. We will use LabelEncoder class for
    that, which converts text labels into corresponding integers. Execute the following
    script:


    le = LabelEncoder()


    labels = le.fit\_transform(labels)


    labels =labels.reshape(-1,1)


    After executing the above script if you compare the v1 column of the email\_datadataframe
    and the labels list, you can see clear corresponding between the label name and
    its corresponding integer encoding as shown in the following figure:


    ![image](d2d_images/image013.png)


    Like labels, we need to convert our email messages into numeric format where each
    sentence is of same length as the maximum sequence length. The following script
    performs that task.


    tok = Tokenizer(num\_words=VOCABULARY\_SIZE)


    tok.fit\_on\_texts(emails)


    email\_sequences = tok.texts\_to\_sequences(emails)


    email\_sequence\_matrix = pad\_sequences(email\_sequences, maxlen = MAX\_SENTENCE\_LENGTH)


    Here we use the Tokenizer class, to tokenize sentences into words. We then used
    the “texts\_to\_sequence” method of the Tokenizer object to convert words into
    integers. At this point time, sentences have been converted into corresponding
    integers but they are still not of the same size. To make sentences have the same
    size as the size of the largest sentence, we use the pad\_sequence class.


    1.  Create Embedding Matrix


    We loaded our pre-trained embeddings and we converted our emails into integers.
    Now is the time to create embeddings for the words in our email messages.


    If you execute the following script, you will see that our dataset has 8920 unique
    tokens or words:


    word2idx = tok.word\_index


    print(''Found %s unique tokens.'' % len(word2idx))


    Here “word2idx” basically contains mappings between words and their corresponding
    integer values.


    Let’s find the number of words that we want in our vocabulary. Earlier, we set
    this number to 2000. However, if the unique tokens are less than 2000, we will
    set our vocabulary size to unique tokens. The following script does that:


    total\_words = min(VOCABULARY\_SIZE , len(word2idx) + 1)


    We will then create an empty embedding matrix of size total\_words x VECTOR\_DIM
    as shown below:


    embedding\_matrix = np.zeros((total\_words, VECTOR\_DIM))


    Finally, we will fill this embedding matrix, with the vectors of 2000 most occurring
    words as shown below:


    for word, index in word2idx.items():


    if index < VOCABULARY\_SIZE:


    vector = embedding\_dic.get(word)


    if vector is not None:


    embedding\_matrix\[index\] = vector


    1.  Create Embedding Layer


    After creating the embedding matrix, the next step is to create the embedding
    layer. Embedding layer basically tells our LSTM the total vocabulary size, the
    dimensions of each element in the sequence, pre-trained embedding matrix to use
    (if any) and the maximum length of the sequence. The following script creates
    the embedding layer for our script:


    embedding\_layer = Embedding(


    total\_words,


    VECTOR\_DIM,


    weights=\[embedding\_matrix\],


    input\_length=MAX\_SENTENCE\_LENGTH,


    trainable=False


    )


    1.  Training The Model'
