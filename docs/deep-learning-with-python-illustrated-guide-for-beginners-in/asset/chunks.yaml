    MAX_SENTENCE_LENGTH = 200\nVOCABARY_SIZE = 2000\nVECTOR_DIM = 100\n```\n这里 `MAX_SENTENCE_LENGTH`\
    \ 将是序列的最大长度。`VOCABARY_SIZE` 是我们用于创建嵌入层的单词数。`VECTOR_DIM` 是句子中每个单词的特征数。我们的批量大小为\
    \ `4`，并将进行 `20` 个 epoch。\n\n### 步骤 3：导入并预处理数据集\n现在是加载和预处理数据了。我们将使用的数据是两个人类之间的对话，其中一人扮演机器人。本节的文件位于\
    \ `Datasets` 文件夹中，文件名分别为 `human_text.txt` 和 `robot_text.txt`。数据集也可以从这个 [kaggle\
    \ 链接](https://www.kaggle.com/eibriel/rdany-conversations/version/11) 在线下载。\n\n\
    在序列到序列学习中，我们需要三个独立的列表。第一个是输入文本列表，包含输入编码器 `LSTM` 的内容；第二个是目标文本列表，将作为解码器 `LSTM` 的输出；第三个是文本输入列表，将作为解码器\
    \ `LSTM` 的输入。让我们创建这三个列表：\n\n```python\ninput_texts = []\ntarget_texts = []\ntarget_texts_inputs\
    \ = []\n```\n\n接下来，我们将逐行读取 `human_text.txt` 和 `robot_text.txt`。记住 `robot_text.txt`\
    \ 中的每一行都是 `human_text.txt` 中对应行的响应。我们将逐行读取文件，移除行中所有的标点符号和额外的空格。然后，我们将检查输入行的单词数是否大于\
    \ `MAX_SENTENCE_LENGTH`，如果是，直接忽略该句子，因为我们不希望文档中出现非常长的句子。\n\n最后，我们将来自 `human_text.txt`\
    \ 的行插入到 `input_texts` 列表中，并将 `robot_text.txt` 的行插入到 `target_texts` 列表中。我们在目标文本中的所有行前面加上\
    \ `eos`（句子结束标记）前缀。`robot_text.txt` 的行也会被插入 `target_texts_inputs` 列表，但它们将带有 `sos`\
    \ 标记前缀，因为解码器 `LSTM` 的输入将目标输出相同，但会通过 `sos` 标记偏移一个。\n\n查看以下脚本以执行数据导入和预处理任务。你需要根据目录结构更改路径。\n\
    \n```python\nstring = \"how old are you how do you look like where do you live\"\
    \nformatted = re.sub(r'\\s+', ' ', string)\n\nwith open(\"Datasets/human_text.txt\"\
    , \"r\") as file1, open(\"Datasets/robot_text.txt\", \"r\") as file2:\n    for\
    \ human_text, robot_text in zip(file1, file2):\n        human_text = re.sub(r'[^\\\
    w\\s]', '', human_text)\n        robot_text = re.sub(r'[^\\w\\s]', '', robot_text)\n\
    \        if len(human_text.split()) <= MAX_SENTENCE_LENGTH:\n            input_texts.append(human_text)\n\
    \            target_texts.append(robot_text + \" eos\")\n            target_texts_inputs.append(\"\
    sos \" + robot_text + \" eos\")\n```\n"
