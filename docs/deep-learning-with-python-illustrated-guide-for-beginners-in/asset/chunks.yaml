    # How The Human Brain Works


    ![image](d2d_images/chapter_title_below.png)


    The human brain consists of billions of interconnected neurons. There are three
    major components of a human neuron: Dendrite, Nucleus, and Axon. The dendrite
    is responsible for receiving messages from other neurons or sensory organs. The
    nucleus acts as the central processing unit and processes the information received
    via dendrite. Finally, the processed information is passed to Axon which transmits
    it to next neuron.


