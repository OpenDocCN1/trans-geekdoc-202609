    # Creating a Chatbot Using Sequence to Sequence Model


    ![image](d2d_images/chapter_title_below.png)


    We have covered the theory behind sequence to sequence architecture. Now is the
    time to see a real-world application of sequence to sequence modeling.


    In this section, we will use Python’s Keras library to develop a sequence to sequence
    chatbot. The code template for the sequence to sequence model is available at
    [Keras official blog](https://blog.keras.io/a-ten-minute-introduction-to-sequence-to-sequence-learning-in-keras.html).
    This code can be used to create any sequence to sequence model. We will use this
    code to create our Chabot. So, let’s start.


    Step1: Importing the Library


    As always, the first step is to import libraries required to implement the sequence
    to sequence model. Execute the following script:


    import os, sys


    import re


    from keras.models import Model


    from keras.layers import Input, LSTM, GRU, Dense, Embedding


    from keras.preprocessing.text import Tokenizer


    from keras.preprocessing.sequence import pad\_sequences


    from keras.utils import to\_categorical


    import numpy as np


    import matplotlib.pyplot as plt


    Step 2: Configuration Settings


    BATCH\_SIZE = 4


    EPOCHS = 20


    LSTM\_NODES = 128 


    MAX\_SENTENCE\_LENGTH = 200


    VOCABULARY\_SIZE = 2000


    VECTOR\_DIM = 100


    Here MAX\_SENTENCE\_LENGTH will be the maximum length of the sequence. VOCABULAR\_SIZE
    is the number of words that we will use to create the embedding layer. The VECTOR\_DIM
    will be the number of features per word in the sentence. Our batch size will be
    4 and we will have 20 epochs.


    Step 3: Importing and Preprocessing the Dataset


    Now is the time to load and preprocess the data. The dataset that we are going
    to use is chat conversation between two humans. Where one of the humans play the
    role of a robot. The files for this section are available in the Datasets folder
    by the name “human\_text.txt” and “robot\_text.txt”. The dataset can be downloaded
    online from this [kaggle link](https://www.kaggle.com/eibriel/rdany-conversations/version/11)
    as well.


    In the case of sequence to sequence learning, we need three separate lists. The
    first one is the input text list that contains the input to the encoder LSTM,
    the second one is the target text list which will be the output of the decoder
    LSTM and the third one is the target text input list which will act as input to
    the decoder LSTM. Let’s create these three lists:


    input\_texts = \[\]


    target\_texts = \[\] 


    target\_texts\_inputs = \[\]


    Next, we will read both the “human\_text.txt” and “robot\_text.txt”, line by line.
    Remember that each line in the “robot\_text.txt” is a response to the corresponding
    line in the “human\_text.txt”.


    We will read the files line by line, remove all the punctuation and extra spaces
    from the lines. We will then check if the number of words in the input line is
    greater than the MAX\_SENTENCE\_LENGTH, simply ignore the sentence since we do
    not want very big sentences in our document.


    Finally, we will insert lines from “human\_text.txt” in the input\_texts lists,
    and the lines from “robot\_text.txt” will be inserted in the target\_texts lists.
    We prefix all the lines in target text with the “eos” (end of sentence tag). The
    lines from the “robot\_text.txt”, will also be inserted to the target\_texts\_inputs
    list, however, they will be prefixed with “sos” tag since the input to the decoder
    LSTM will be same as the target output, however, it will be offset by one using
    the “sos” tag.


    Take a look at the following script to perform the data import and preprocessing
    tasks. You will need to change the path as per your directory structure.


    string = "how old are you  how do you look like  where do you live"


    formatted = re.sub(r''\\s+'', '' '',  string, flags=re.I) 


    with open("E:/human\_text.txt", encoding="utf8") as textfile1, open("E:/robot\_text.txt",
    encoding="utf8") as textfile2:


    for human\_text, robot\_text in zip(textfile1, textfile2):


    human\_text = human\_text.strip()


    robot\_text = robot\_text.strip()


    human\_text = re.sub(r''\\W'', '' '', str(human\_text))


    robot\_text = re.sub(r''\\W'', '' '', str(robot\_text))


    human\_text = re.sub(r''\\s+'', '' '',  human\_text, flags=re.I)


    robot\_text = re.sub(r''\\s+'', '' '',  robot\_text, flags=re.I)


    input\_text = human\_text


    target\_text = robot\_text + '' <eos>''


    target\_text\_input = ''<sos> '' + robot\_text


    ––––––––


    ![image](d2d_images/scene_break.png)


    if len(input\_text.split()) > MAX\_SENTENCE\_LENGTH:


    break;


    input\_texts.append(input\_text)


    target\_texts.append(target\_text)


    target\_texts\_inputs.append(target\_text\_input)


    print("num samples:", len(input\_texts))


    Let’s print the number of samples in our dataset. Execute the following script
    to do so:


    print("num samples:", len(input\_texts))


    The output will display 581. Our sample size is really small but you will see
    that our chatbot will be able to answer really small queries.


    Step 4: Tokenizing and Padding the Sentences


    Before we can feed our sentences into LSTM, we need to convert them into word
    vectors. For Input, we will use glove word embeddings for our data but before
    that, we need to convert sentences into integers so that the integers can be used
    to index the embedding matrix, which contains the vector representation of the
    word. For the target text, we will use Keras built-in embedding, which we will
    see in a later section. For now, let’s tokenize our input and target data. Execute
    the following script to tokenize the input:


    tokenizer\_inputs = Tokenizer(num\_words=VOCABULARY\_SIZE )


    tokenizer\_inputs.fit\_on\_texts(input\_texts)


    input\_sequences = tokenizer\_inputs.texts\_to\_sequences(input\_texts)


    word2idx\_inputs = tokenizer\_inputs.word\_index


    max\_len\_input = max(len(s) for s in input\_sequences)


    In the script above, we tokenize the inputs, find the number of unique tokens
    in the input data and the length of the longest sentence.


    Similarly, to tokenize the target text and the target text input. Execute the
    following script:


    tokenizer\_outputs = Tokenizer(num\_words=VOCABULARY\_SIZE , filters='''')


    tokenizer\_outputs.fit\_on\_texts(target\_texts + target\_texts\_inputs) # inefficient,
    oh well


    target\_sequences = tokenizer\_outputs.texts\_to\_sequences(target\_texts)


    target\_sequences\_inputs = tokenizer\_outputs.texts\_to\_sequences(target\_texts\_inputs)


    ––––––––


    ![image](d2d_images/scene_break.png)


    word2idx\_outputs = tokenizer\_outputs.word\_index


    num\_words\_output = len(word2idx\_outputs) + 1


    max\_len\_target = max(len(s) for s in target\_sequences)'
