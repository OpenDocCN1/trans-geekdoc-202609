    # ReLu Operation


    ![image](d2d_images/chapter_title_below.png)


    Once the feature maps have been generated as a result of convolution operation,
    the next step is to perform ReLu operation. We studied Relu Operation in detail
    in Chapter 3. Convolution operation is linear. However, real-life images are not
    linear. To introduce non-linearity in the image, the ReLu operation is performed.


    In the ReLu, all the negative values in the feature maps are replaced by zero.
    The positive values are not changed.


    Suppose we have the following feature map:


    ––––––––


    ![image](d2d_images/scene_break.png)


    | \-4 || 2 || 1 || \-2 |


    | --- | --- | --- | --- |


    | 1 || \-1 || 8 || 0 |


    | 3 || \-3 || 1 || 4 |


    | 1 || 0 || 1 || \-2 |


    When the Relu function is applied on the feature map, the resultant feature map
    looks like this:


    | 0 || 2 || 1 || 0 |


    | --- | --- | --- | --- |


    | 1 || \-0 || 8 || 0 |


    | 3 || 0 || 1 || 4 |


    | 1 || 0 || 1 || 0 |


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Pooling


    ![image](d2d_images/chapter_title_below.png)


    Before looking at pooling, let us understand spatial invariance. Take a look at
    the following images of a cheetah. The first image is the actual image, in the
    second image the orientation is changed while in the third, the image is distorted.
    However, in all the three cases, we are able to Identity that this is a cheetah.
    We can identify, nose, ears, and eyes even if they are not in the same position
    in the image.


    ![image](d2d_images/image024.png)


    Fig 6.3: Spatial Invariance


    This is called spatial invariance where irrespective of the location of the feature,
    you can identify it. Pooling helps achieve spatial invariance.


    Like convolution, in pooling, we have a filter of any size. Suppose we have a
    filter of size 2x2. We place it on the image and the maximum value from that stride
    is selected. This is called max pooling. In some cases sum, average and min pooling
    is also used. Take a look at the following image:


    ![image](d2d_images/image063.png)


    Fig 6.4: Max Pooling


    In the 2^(nd) and 3^(rd) row and 3^(rd) and 4^(th) columns, we have values 1,
    1, 1 and 2. The maximum value is 2; you can see that maximum value in the pooled
    feature map on the right.


    Where there are no values to compare as is the case with the bottom right corner
    where we only have 1. It is forwarded to the pooled feature map.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Flattening


    ![image](d2d_images/chapter_title_below.png)


    To detect more features from an image, the output of the convolutional neural
    network i.e. pooled feature maps are used as input to the densely connected neural
    networks. Pooled feature maps are in the form of 2-D arrays. However, the input
    to the densely connected neural network should be in the form of a feature vector
    or 1-D array. In the flattening step, pooled feature maps are flattened as shown
    in the following figure:


    ![image](d2d_images/image017.png)


    Fig 6.5: Flattening


    In case of multiple pooled feature maps, they can be stacked together to form
    one long column vector.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Fully Connected Layer


    ![image](d2d_images/chapter_title_below.png)


    The last and final step of a convolutional neural network is to feed the flattened
    pooled feature maps into a densely connected neural network which we studied in
    chapter 4 and 5 as shown in Fig 6.6. This step is performed to find more features
    from the existing set of features generated by convolution, relu and pooling steps.


    ![image](d2d_images/image039.png)


    Fig 6.6: Feature Detectors


    To visualize CNN, check [this tool](http://scs.ryerson.ca/~aharley/vis/conv/flat.html)
    developed by [Adam Harley](http://www.cs.cmu.edu/~aharley/). This tool can be
    used to visualize CNN. You can write the digit in the digit box at the top left
    corner, and the CNN will detect what you have written. The CNN used by this tool
    has 2 layers of convolution, relu and pooling operations, followed by two densely
    connected layers as shown in the image below:


    ![image](d2d_images/image020.png)


    Fig 6.7: Visualizing CNN ([Check this tool](http://scs.ryerson.ca/~aharley/vis/conv/flat.html))


    Note: The pooling and ReLu operations have been combined together.


    I would suggest you play around with this tool and build more intuition about
    the convolutional neural network.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


