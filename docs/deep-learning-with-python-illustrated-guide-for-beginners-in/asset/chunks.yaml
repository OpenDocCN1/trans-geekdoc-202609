    # Introduction to Recurrent Neural Network


    ![image](d2d_images/chapter_title_below.png)


    In the previous chapter, we concluded our discussion about Convolutional Neural
    Network (CNN), which is an advanced type of Artificial Neural Network. CNN is
    commonly used for computer vision problems. In this chapter, we will study Recurrent
    Neural Network which is another advanced type of artificial neural network. and
    is commonly used to solve time series analysis problems. Recently a specialized
    form of RNN, known as Long Short-Term Memory (LSTM) is widely being used for time
    series analysis and natural language processing tasks such as machine translation
    and sequence to sequence modeling.


    In this chapter, we will briefly review the theory behind RNN. In the next few
    chapters, we will see the application of RNN for time series analysis and natural
    language processing.'
