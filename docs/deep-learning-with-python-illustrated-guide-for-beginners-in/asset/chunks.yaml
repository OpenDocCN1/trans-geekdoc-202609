    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Types of Memories in Human Brain


    ![image](d2d_images/chapter_title_below.png)


    We know that Artificial Neural Networks were modeled to imitate the human brain.
    The human brain has two types of memories: Long-Term Memory and Short Term Memory.
    For instance, with help of long-term memory, we can recognize the movie that we
    saw five years ago. We can recognize the faces of our close friends even if we
    see them after years. On the other hand,short-term memory normally helps us remember
    a thing for a short span of time and then it fades. For instance, we do not remember
    what we had in food three weeks ago. In the human brain, temporal lobe stores
    long-term memories and the frontal lobe is responsible for short-term memory.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # What is an RNN?


    ![image](d2d_images/chapter_title_below.png)


    An Artificial Neural Network is trained using repeated cycles of feed-forward
    and back-propagation steps. In feed-forward step, the error is calculated and
    in back-propagation, the weights are updated to reduce the error. Once the error
    is minimized, the weights can be saved. These weights constitute long-term memory.


    Recurrent Neural Networks differ from other neural networks in a way that in case
    of RNN, the output of the neuron is fed into itself as an input. This replicates
    the behavior of short-term memory of the human brain. Figure 8.1 shows the architecture
    of an RNN.


    ![RecurrentLayerNeuralNetwork.png](d2d_images/image022.png)


    Figure 8.1: Architecture of a Recurrent Neural Network


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Applications of an RNN


    ![image](d2d_images/chapter_title_below.png)


    The applications of RNN can be divided into three major categories:


    *   One to Many


    These are the type of applications where there is one input and multiple outputs.
    An example of such an application can be the image descriptor where an image is
    an input to the system and the description of the image is the output.


    *   Many To One


    Text classification is a typical example of such type of applications. For instance,
    in a spam classification application, a text string containing multiple words
    is fed as input to the system while the output is the label ham or spam.


    *   Many to Many


    Machine translation is one of the finest examples of the applications of RNN belonging
    to Many to Many category.


    For instance, if you have a sentence “The boy eats an apple and he likes mangoes
    too”. If you change the above sentence to “The girl eats an apple”, a leaves the
    rest of the sentence as it is, a RNN application will give a warning that “he”
    in “he likes mangoes” should be changed to “she” since RNN keeps tracks of previous
    information and it found the word “girl there” instead of a boy.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Steps of a Recurrent Neural Network


    ![image](d2d_images/chapter_title_below.png)


    As we saw earlier, a recurrent neural network is very similar to an Artificial
    Neural Network. The only addition is the feedback data from the hidden layer into
    itself. Like an ANN, the RNN also consists of multiple cycles of feed forward
    and back propagation steps.


    Feedforward


    Following are feed forward steps for the recurrent neural network:


    1.  For each node in the hidden layers, the input values are multiplied with the
    corresponding weight matrix of that particular hidden layer, which can be represented
    as Wxh \* X. Here Wxh is the weight matrix for the hidden layer h and X is the
    input vector. The asterisk here refers to the dot product between the two vectors.


    1.  Since at each node of the RNN, we input the data from the previous hidden
    state to the new hidden state. This can be represented as Whh \* h\[t-1\]. Here
    Whh is the weight matrix for hidden state h and h\[t-1\] is the output of the
    hidden state at the previous timestamp i.e. t-1.


    1.  The output from step 2 and 3 is added together along with the bias and is
    used as the input for the current hidden state.


    1.  The activation function is applied to the  input at the hidden state which
    generates new values.


    These steps are performed at each node in the network until the output nodes are
    reached.


    Backpropagation


    The backpropagation steps for the RNN are exactly the same as an ordinary ANN:


    1.  The error between the actual output and calculated output is calculated using
    a loss function which is normally negative log likelihood since the activation
    function used at the output node is usually softmax.


    2.  The error is back propagated throughout the network and the weights are updated
    accordingly.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Conclusion


    ![image](d2d_images/chapter_title_below.png)


    In this chapter, we saw the basic principle behind the recurrent neural network,
    which is the feedback mechanism from the output of the hidden state from the previous
    timestamp to the new timestamp. This allows RNN to remember what happened previously
    which in is helpful for predicting sequential data. In the next chapter, we will
    see how LSTM, which is a version of RNN, solves time series analysis problems
    such as future stock price prediction.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


