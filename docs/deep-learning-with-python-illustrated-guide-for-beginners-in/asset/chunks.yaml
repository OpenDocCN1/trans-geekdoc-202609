    Creating Parameter Dictionary


    Grid search algorithm doesn’t just randomly run and finds all the best parameters
    for an algorithm because it can take years. For instance, if the grid search algorithm
    starts testing each value for the batch\_size parameter of ANN from 1 to 500,
    the algorithm has to run a minimum of 500 times and that’s just for 1 parameter.
    Therefore a set of values for each parameter that you want to test is passed to
    the GridSearchCV class. These set of parameters and are passed in the form of
    a dictionary.


    Suppose we want to test different values for batch\_size, and a number of epochs
    for the ANN, we can create a dictionary that looks like this:


    grid\_params = {''batch\_size'': \[10, 5\],


    ''epochs'': \[500, 300\]


    }


    In the script above we create a dictionary named, “grid\_params” the keys for
    the dictionary are the names of the parameters and the values of the dictionary
    correspond to values of the parameter. From these set of values, the Grid Search
    algorithm will return the best combination.


    It is important to mention here that the grid search algorithm can take a lot
    of time depending upon the values that you want to test and the number of folds
    for the cross-validation.


    For instance, in our case, we have 2 values for the batch\_size parameter and
    2 values for epochs. Total possible combinations in this case are 2 x 2 = 4. Multiply
    this value with the number of folds e.g. 10. That makes it 40 executions. Out
    of 40, 20 executions have 500 epochs, while 20 executions have 300 epochs, which
    makes a total of 16 thousand epochs.  This can slow down the algorithm a bit.


    Creating Parameter Dictionary


    To execute the Grid Search, we need to create object of GridSearchCV class and
    pass it the classifier, the parameter dictionary that we just created, the performance
    evaluation metrics (we will use accuracy), and cross validation folds. Execute
    the following script to create GridSearch object.


    fromsklearn.model\_selection import GridSearchCV


    gs= GridSearchCV(estimator = keras\_ann\_clf,


    param\_grid = grid\_params,


    scoring = ''accuracy'',


    cv = 10)


    The final step is to call fit method on the GridSearchCV object and pass it the
    training and test set as shown below:


    gs\_result = gs.fit(features, labels)


    This can take a bit of time to execute.


    Once the above script executes, the last and final step is to see the parameters
    selected by grid search, to do so you can use the best\_params\_ attribute of
    the GridSearchCV class as shown below:


    print(gs\_result.best\_params\_)


    The output looks like this:


    {''batch\_size'': 10, ''epochs'': 300}


    The output shows that the best parameters from the given set of parameters are
    batch\_size of 10 and 300  epochs.


    Best performance is achieved with the aforementioned parameters values. Finally
    to see the accuracy achieved using the most optimal parameters, execute the following
    script:


    print(gs\_result.best\_score\_)


    0.5941213258286429


    You can see that with a batch size of 10 and epochs 300, we received average accuracy
    of 59.41% which is greater than 56.53% we obtained in the last section with a
    batch size of 10 and 500 epochs.


