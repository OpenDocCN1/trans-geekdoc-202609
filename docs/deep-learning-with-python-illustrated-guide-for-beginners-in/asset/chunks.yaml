    # 计算机如何看待图像


    ![image](img/chapter_title_below.png)


    这里需要提到，计算机处理图像的方式与人类不同。我们人类看到线条、曲线和不同的颜色。而计算机只能看到数字。对于灰度图像，图像被视为 0 到 255 之间的二维数组。对于彩色图像，有
    3 个 0 到 255 的通道，分别对应红、绿、蓝。


    假设我们有如下灰度图像，对我们来说是一个微笑，但对计算机来说，它仅仅是零的二维数组。为了简单起见，这里 1 表示黑色，0 表示白色。


    ![image](img/image059.png)


    ––––


    ![image](img/scene_break.png)


    现在我们知道了图像在内存中的样子。让我们开始讨论 CNN。执行神经网络需要执行的步骤如下：


    1. 卷积操作

    2. ReLU

    3. 池化

    4. 扁平化

    5. 全连接层


