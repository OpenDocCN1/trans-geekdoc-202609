    pixel values of feature detector and add the products together you get the following
    value:


    0x0 + 1x0 + 0x1 + 1x1 + 0x0 + 0x0 + 0x0 + 0x1 + 0x1 = 1


    You can see 1 in the bottom right corner of the Feature map.


    In reality, there are multiple feature detectors resulting in multiple feature
    maps as shown in the following image. An image has multiple features and one feature
    detector can detect one feature only.  Therefore it makes sense to have multiple
    feature detectors.


    ![image](d2d_images/image037.png)


    Fig 6.2: Feature Detectors


