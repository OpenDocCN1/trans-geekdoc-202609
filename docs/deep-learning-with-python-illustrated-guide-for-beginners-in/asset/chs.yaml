  \ | --- |\n\n![image](img/chapter_title_above.png)\n\n## 引言\n\n![image](img/chapter_title_below.png)\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n### 什么是深度学习？\n\
  \n![image](img/chapter_title_below.png)\n\n深度学习是机器学习的一个分支，处理受人类脑功能和结构启发的算法。“深度学习”和“神经网络”这两个词通常互换使用。然而，深度学习是一个领域，而神经网络是一类算法。\n\
  \n![image](img/chapter_title_below.png)\n\n深度学习是一种处理受人类脑功能和结构启发的算法的机器学习分支。深度学习和神经网络这两个词通常互换使用。然而，深度学习是一个领域，而神经网络是一类算法。\n\
  \n深度学习是一种处理受人类脑功能和结构启发的算法的机器学习分支。深度学习和神经网络这两个词通常互换使用。然而，深度学习是一个领域，而神经网络是一类算法。\n\n\
  深度学习是一种处理受人类脑功能和结构启发的算法的机器学习分支。深度学习和神经网络这两个词通常互换使用。然而，深度学习是一个领域，而神经网络是一类算法。\n\n\
  深度学习是一种处理受人类脑功能和结构启发的算法的机器学习分支。深度学习和神经网络这两个词通常互换使用。然而，深度学习是一个领域，而神经网络是一类算法。\n\n\
  深度学习是一种处理受人类脑功能和结构启发的算法的机器学习分支。\n\n深度学习算法被分为三大类：i) 全连接神经网络，ii) 卷积神经网络（CNN），iii)\
  \ 循环神经网络。\n\n深度学习涉及许多层。输入层和输出层之间的层被称为“隐藏层”。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ ||  || ![image](img/chapter_title_corner_decoration_right.png) |\n\n| --- | ---\
  \ | --- |\n\n![image](img/chapter_title_above.png)\n\n### 深度学习的历史\n\n![image](img/chapter_title_below.png)\n\
  \nValentin Grigoryevich 和 Alexey Grigoryevich 在 1965 年被誉为开发了神经网络。在 1970 年，由于缺乏数据，AI\
  \ 的资金减少，被称为“AI 寒冬”。\n\n尽管在 2012 年之前由于数据缺乏，但有了大量数据和计算能力，深度学习方法在 2012 年左右，研究人员开始看到更好的结果。Tomas\
  \ [`arxiv.org/pdf/1301.3781`](https://arxiv.org/pdf/1301.3781) 发表了一篇论文，展示了词嵌入技术如何改进自然语言处理。\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n### 深度学习的优势\n\
  \n![image](img/chapter_title_below.png)\n\n以下是深度学习的一些优势：\n\n1. 在给定合理数据量的情况下，机器学习模型将大幅超过传统的机器学习。但这里的关键是大量数据。以下图片解释了这种关系：\n\
  \n（图片来自 Andrew Ng 的幻灯片）\n\n2. 深度学习通过寻找最合适的特征消除了对特征工程的需求。\n\n3. 深度学习技术可以很容易适应新领域，例如循环神经网络被用于解决时间序列问题，也用于自然语言处理。同样，卷积神经网络也被用于\
  \ NLP 和计算机视觉。\n\n| ![image](img/chapter_title_corner_decoration_left.png) ||  ||\
  \ ![image](img/chapter_title_corner_decoration_right.png) |\n\n| --- | --- | ---\
  \ |\n\n![image](img/chapter_title_above.png)\n\n### 深度学习的劣势\n\n![image](img/chapter_title_below.png)\n\
  \n1. 深度学习的主要缺点是它需要大量的数据。\n\n2. 由于神经网络中涉及许多层和节点，因此需要高性能的计算机来运行深度学习算法。\n\n3. 深度学习算法像黑盒一样工作，大多数时候你不知道每个节点发生了什么，以及特征是如何选择的。\n\
  \n\n\n\n| ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n### 深度学习的应用\n\
  \n![image](img/chapter_title_below.png)\n\n由于具有更高的精度，深度学习正在几乎所有拥有海量数据的领域取代传统的机器学习。以下是深度学习的一些最著名的应用领域：\n\
  \n### 1. 自动驾驶汽车\n深度学习技术使自动驾驶汽车能够识别道路上的障碍物，根据道路结构增加或减少车速度并转弯。\n\n### 2. 游戏行业\n深度学习被广泛应用于游戏行业，用于开发能够尽可能真实真实的智能角色和玩家。[AlphaZero](https://www.theguardian.com/technology/2017/dec/07/alphazero-google-deepmind-ai-beats-champion-program-teaching-itself-to-play-four-hours)\
  \ 是谷歌使用深度学习技术创建的 AI，它最近击败了世界上顶尖的象棋计算机。AlphaZero 在不到四个小时内学会了所有的象棋技巧。\n\n### 3. 健康研究\n\
  健康领域的研究利用深度学习技术来识别不同的疾病。例如，从高功率电子显微镜接收的人类细胞数据被输入到深度学习算法中，以识别细胞是否为癌症。\n\n### 4. 计算机视觉\n\
  计算机视觉领域长期依赖模式匹配技术。随着机器学习的出现，计算机视觉研究得到了巨大的推动。然而，采用深度学习的计算机视觉应用所实现的性能超过了以往所有的研究。今天，深度学习被用于图像分类、视频摘要、物体识别、人脸识别和门禁识别等。\n\
  \n### 5. 自然语言处理\n神经机器翻译、序列到序列模型和循环神经网络等深度学习算法大大提高了不同自然语言处理任务的性能，如文本分类、词性标注（POS tagging）、情感分析、问答系统生成等。\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
