  \ | --- |\n![image](img/chapter_title_above.png)\n\n# 第 11 章\n\n![image](img/chapter_title_below.png)\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n| --- | --- | --- |\n![image](img/chapter_title_above.png)\n\n## 使用 LSTM 进行序列到序列建模\n\
  \n![image](img/chapter_title_below.png)\n\n在上一章中，我们看到了如何将 `LSTM` 用于文本分类。然而，`LSTM`\
  \ 可以用于多种自然语言处理任务。序列到序列（Sequence to sequence），也称为 `seq2seq` 是 `LSTM` 在 NLP 领域最著名的应用之一。在本文中，我们将首先学习\
  \ `seq2seq` 模型背后的理论。然后我们将开始构建一个非常简单的聊天机器人，能够回答基础的用户查询。这个聊天机器人不会非常先进，但你将理解 `seq2seq`\
  \ 架构工作原理的本质。\n\n| ![image](img/chapter_title_corner_decoration_left.png) ||  ||\
  \ ![image](img/chapter_title_corner_decoration_right.png) |\n| --- | --- | --- |\n\
  ![image](img/chapter_title_above.png)\n\n### 什么是序列到序列建模？\n\n在第 8 章中，我们学习了 `RNN`\
  \ 可以用于多种应用。`RNN` 的应用可以分为以下类型：\n\n![image](img/image002.png)\n\n“一对一”应用的示例：![image](img/image002.png)。\
  \ \n\n在上一章中，我们看到了如何将 `LSTM` 用于文本分类。然而，`LSTM` 可以用于多种自然语言处理任务。序列到序列，也称为 `seq2seq`\
  \ 是 `LSTM` 在 NLP 领域最著名的应用之一。在本文中，我们将首先学习 `seq2seq` 模型背后的理论。然后我们将开始构建一个非常简单的聊天机器人，能够回答基础的用户查询。这个聊天机器人不会非常先进，但你将理解\
  \ `seq2seq` 架构工作原理的本质。\n\n### 序列到序列架构\n\nSeq2seq 模型分两个阶段执行：训练和推理。该架构由两个 LSTM 网络组成：编码器（encoder）和解码器（decoder）。请看下图：\n\
  \n![image](img/image032.png)\n\n编码器主要负责编码输入并产生思维向量（thought vector）。编码器 LSTM 层由图中蓝色矩形表示。编码器\
  \ LSTM 的输出是隐藏状态和单元状态，它们将作为解码器的输入。\n\n解码器 LSTM 不仅接收来自编码 LSTM 的输入，还会接收上一步的目标输出作为输入以生成最终回复。\n\
  \n\n\n一旦模型训练完成，下一步就是进行预测。需要注意的是，在训练阶段，我们拥有输入序列中的所有元素，但对于输出来说，情况并非如此，因为我们无法预先知道输入中的每一个元素。但如果你仔细观察训练阶段，你会发现解码器（decoder）中下一个单元的输入基本上是上一个单元的输出。如下图所示：\n\
  \n![image](img/image00.png)\n\n### 推理/预测阶段的解码器输入 ([图片引用](https://towardsdatascience.com/seq2seq-model-in-tensorflow))\n\
  \n### 步骤 5：将嵌入转换为单词\n预测是以嵌入向量的形式存在的，我们必须将其转换回单词。这是序列到序列（sequence to sequence）模型的最后阶段。本节中解释的步骤将在下一节我们用代码实现序列到序列模型时变得清晰。\n\
  \n| ![image](img/chapter_title_decoration_left.png) | ![image](img/chapter_title_decoration_right.png)\
  \ |\n| --- | --- |\n\n![image](img/chapter_title_above.png)\n\n## 使用序列到序列模型创建一个机器人\n\
  \n![image](img/chapter_title_below.png)\n\n我们已经涵盖了序列到序列架构背后的理论。现在是时候查看序列到序列建模的实际应用了。在本节中，我们将使用\
  \ Python 的 `Keras` 库开发一个序列到序列聊天机器人。序列到序列模型的代码模板可以在 [Keras 官方博客](https://blog.keras.io/ten-minute-introduction-to-sequence-to-learning-in-keras.html)\
  \ 获取。这段代码可以创建任何序列到序列模型。我们将使用这段代码来创建我们的机器人。那么，让我们开始吧。\n\n### 步骤 1：导入库\n如既往，第一步是导入实现序列到序列模型所需的库。执行以下脚本：\n\
  \n```python\nimport os, sys\nimport re\nfrom keras.models import Model\nfrom keras.layers\
  \ import Input, LSTM, GRU, Dense, Embedding\nfrom keras.preprocessing.text import\
  \ Tokenizer\nfrom keras.preprocessing.sequence import pad_sequences\nfrom keras.utils\
  \ import to_categorical\nimport numpy as np\nimport matplotlib.pyplot as plt\n```\n\
  \n### 步骤 2：配置设置\n```python\nBATCH_SIZE = 4\nEPOCHS = 20\nLSTM_NODES = 128\nMAX_SENTENCE_LENGTH\
  \ = 200\nVOCABARY_SIZE = 2000\nVECTOR_DIM = 100\n```\n这里 `MAX_SENTENCE_LENGTH` 将是序列的最大长度。`VOCABARY_SIZE`\
  \ 是我们用于创建嵌入层的单词数。`VECTOR_DIM` 是句子中每个单词的特征数。我们的批量大小为 `4`，并将进行 `20` 个 epoch。\n\n###\
  \ 步骤 3：导入并预处理数据集\n现在是加载和预处理数据了。我们将使用的数据是两个人类之间的对话，其中一人扮演机器人。本节的文件位于 `Datasets` 文件夹中，文件名分别为\
  \ `human_text.txt` 和 `robot_text.txt`。数据集也可以从这个 [kaggle 链接](https://www.kaggle.com/eibriel/rdany-conversations/version/11)\
  \ 在线下载。\n\n在序列到序列学习中，我们需要三个独立的列表。第一个是输入文本列表，包含输入编码器 `LSTM` 的内容；第二个是目标文本列表，将作为解码器\
  \ `LSTM` 的输出；第三个是文本输入列表，将作为解码器 `LSTM` 的输入。让我们创建这三个列表：\n\n```python\ninput_texts\
  \ = []\ntarget_texts = []\ntarget_texts_inputs = []\n```\n\n接下来，我们将逐行读取 `human_text.txt`\
  \ 和 `robot_text.txt`。记住 `robot_text.txt` 中的每一行都是 `human_text.txt` 中对应行的响应。我们将逐行读取文件，移除行中所有的标点符号和额外的空格。然后，我们将检查输入行的单词数是否大于\
  \ `MAX_SENTENCE_LENGTH`，如果是，直接忽略该句子，因为我们不希望文档中出现非常长的句子。\n\n最后，我们将来自 `human_text.txt`\
  \ 的行插入到 `input_texts` 列表中，并将 `robot_text.txt` 的行插入到 `target_texts` 列表中。我们在目标文本中的所有行前面加上\
  \ `eos`（句子结束标记）前缀。`robot_text.txt` 的行也会被插入 `target_texts_inputs` 列表，但它们将带有 `sos`\
  \ 标记前缀，因为解码器 `LSTM` 的输入将目标输出相同，但会通过 `sos` 标记偏移一个。\n\n查看以下脚本以执行数据导入和预处理任务。你需要根据目录结构更改路径。\n\
  \n```python\nstring = \"how old are you how do you look like where do you live\"\
  \nformatted = re.sub(r'\\s+', ' ', string)\n\nwith open(\"Datasets/human_text.txt\"\
  , \"r\") as file1, open(\"Datasets/robot_text.txt\", \"r\") as file2:\n    for human_text,\
  \ robot_text in zip(file1, file2):\n        human_text = re.sub(r'[^\\w\\s]', '',\
  \ human_text)\n        robot_text = re.sub(r'[^\\w\\s]', '', robot_text)\n     \
  \   if len(human_text.split()) <= MAX_SENTENCE_LENGTH:\n            input_texts.append(human_text)\n\
  \            target_texts.append(robot_text + \" eos\")\n            target_texts_inputs.append(\"\
  sos \" + robot_text + \" eos\")\n```\n\n\n\n\n我们的输入和输出句子长度并不相同。我们将根据输入文本中最长的句子对输入进行填充。同样，目标文本和目标文本输入也将根据输出数据中最长的句子进行填充。执行以下脚本对输入和输出数据进行填充：\n\
  \n```python\nencoder_inputs = pad_sequences(input_sequences, maxlen=max_len_input)\n\
  decoder_inputs = pad_sequences(target_sequences_inputs, maxlen=max_len_target, padding='post')\n\
  decoder_targets = pad_sequences(target_sequences, maxlen=max_len_target, padding='post')\n\
  ```\n\n## 第 5 ：加载词嵌入并创建词嵌入矩阵\n\n我们将使用 Glove 嵌入来实现词的向量表示。执行以下脚本以加载训练过的词向量并创建词嵌入：\n\
  \n```python\nprint('Loading Word Vectors')\nembedding_dic = {}\nwith open(\"E:/glove.6b.100d.txt\"\
  , encoding = \"utf8\") as vector_list:\n    for line in vector_list:\n        dimensions\
  \ = line.split()\n        word = dimensions[0]\n        vector = np.asarray(dimensions[1:],\
  \ dtype='float32')\n        embedding_dic[word] = vector\n```\n\n![image](img/scene_break.png)\n\
  \n```python\nnum_words = min(VOCABULARY_SIZE, len(word2idx_inputs) + 1)\nembedding_matrix\
  \ = np.zeros((num_words, VECTOR_DIM ))\nfor word, i in word2idx_inputs.items():\n\
  \    if i < num_words:\n        embedding_vector = embedding_dic.get(word)\n   \
  \     if embedding_vector is not None:\n            embedding_matrix[i] = embedding_vector\n\
  ```\n\n## 第 6 ：创建输入嵌入层和输出 One Hot 编码层\n\n在创建模型之前，我们需要创建输入嵌入层和 One Hot 编码输出层。由于我们在输出节点使用了\
  \ Softmax 函数，因此我们的输出应该是 One Hot 编码的。以下脚本创建了一个嵌入层和 One Hot 编码输出向量：\n\n```python\n\
  embedding_layer = Embedding(\n    num_words,\n    VECTOR_DIM,\n    weights=[embedding_matrix],\n\
  \    input_length=max_len_input,\n    # trainable=True\n)\n```\n\n![image](img/scene_break.png)\n\
  \n```python\ndecoder_targets_one_hot = np.zeros(\n    (\n    len(input_texts),\n\
  \    max_len_target,\n    num_words_output\n    ),\n    dtype='float32'\n)\n```\n\
  \n![image](img/scene_break.png)\n\n```python\nfor i, d in enumerate(decoder_targets):\n\
  \    for t, word in enumerate(d):\n        decoder_targets_one_hot[i, t, word] =\
  \ 1\n```\n\n## 第 7 ：创建模型\n\n我们已经预处理了创建模型所需的所有数据。现在是创建模型的时候了。正如正如之前所说的，我们需要创建两个 LSTM：一个编码器\
  \ LSTM 和一个解码器 LSTM。让我们先定义编码器的输入、嵌入层和输出。执行以下脚本：\n\n```python\nencoder_inputs_placeholder\
  \ = Input(shape=(max_len_input,))\nx = embedding_layer(encoder_inputs_placeholder)\n\
  encoder = LSTM(\n    LSTM_NODES,\n    return_state=True,\n)\nencoder_outputs, h,\
  \ c = encoder(x)\nencoder_states = [h, c]\n```\n\n在上面的脚本中，我们为编码器输入创建了输入占位符。我们知道编码器接收一个输入句子序列。因此，输入的形状是\
  \ `max_len_input` 参数。\n\n接下来，我们将输入通过嵌入层。最后，我们创建了编码器并将其返回状态设置为 true。通过嵌入层的输入被传递给编码器，编码器返回输出、隐藏状态和单元状态。从编码器中，我们只需要单元状态和隐藏状态，将其捕获在\
  \ `encoder_states` 列表中。\n\n同样，让我们为解码器创建输入和输出。执行以下脚本：\n\n```python\ndecoder_inputs_placeholder\
  \ = Input(shape=(max_len_target,))\ndecoder_embedding = Embedding(num_words_output,\
  \ LSTM_NODES)\ndecoder_inputs_x = decoder_embedding(decoder_inputs_placeholder)\n\
  decoder_lstm = LSTM(\n    LSTM_NODES,\n    return_sequences=True,\n    return_state=True,\n\
  )\ndecoder_outputs, _, _ = decoder_lstm(\n    decoder_inputs_x,\n    initial_state=encoder_states\n\
  )\n```\n\n在上面的脚本中，我们首先为解码器定义了输入占位符。注意输入占位符的输入形状长度为 `max_len_target`，它是 `target_text`\
  \ 列表中长句子的长度。接下来，我们将输入占位符通过嵌入层。然后我们创建了一个 `return_sequences = True` 的 LSTM，因为我们需要在解码器的每个点都获得输出。注意\
  \ `decoder_lstm` 的 `initial_state` 被设置为 `encoder_states`，它包含了编码器在输出单元的隐藏状态和单元状态。\n\
  \n接下来，我们需要创建一个全连接层（dense layer）并将解码器输出传递到全连接层。查看以下脚本：\n\n```python\ndecoder_dense\
  \ = Dense(num_words_output, activation='softmax')\ndecoder_outputs = decoder_dense(decoder_outputs)\n\
  ```\n\n接下来，我们需要按照所示创建并编译模型：\n\n```python\nmodel = Model([encoder_inputs_placeholder,\
  \ decoder_inputs_placeholder], decoder_outputs)\nmodel.compile(\n    optimizer='rmsprop',\n\
  \    loss='categorical_crossentropy',\n    metrics=['accuracy']\n)\n```\n\n最后，我们需要在第\
  \ 6 步创建的数据上拟合模型。执行以下脚本来实现：\n\n```python\nr = model.fit(\n    encoder_inputs, decoder_inputs,\n\
  \    decoder_targets_one_hot,\n    batch_size=BATCH_SIZE,\n    epochs=EPOCHS,\n\
  \    validation_split=0.2\n)\n```\n\n你会看到我们的模型开始运行。在 20 个 epoch 结束后，你应该能看到如下图所示\
  \ 87.21% 的准确率：\n\n![image](img/image43.png)\n\n## 第 8：进行预测\n\n我们已经训练了模型；下一步是进行预测。在预测阶段，我们将再次使用编码器-解码器架构。然而由于我们已经训练好了，我们不需要训练编码器。首先，让我们讨论一下编码器在预测时将是什么样的。查看以下脚本：\n\
  \n```python\nencoder_model = Model(encoder_inputs_placeholder, encoder_states)\n\
  ```\n\n在这里编码器将独立工作。记住，我们不需要训练编码模型，因为权重已经更新。\n\n接下来，我们需要定义解码器的输入和输出。在训练阶段，解码器的输入是来自输入序列的隐藏和单元状态以及整个目标序列。输出是对应的目标序列。\n\
  \n在预测情况下，我们没有整个目标序列，因为这是我们要预测的内容。我们只有输入序列的隐藏状态和单元状态，以及目标序列的起始词。解码器的输出将是目标词以及单元状态和隐藏状态。\n\
  \n为解码器 LSTM 创建输入：\n\n```python\ndecoder_state_input_h = Input(shape=(LSTM_NODES,))\n\
  decoder_state_input_c = Input(shape=(LSTM_NODES,))\ndecoder_states_inputs = [decoder_state_input_h,\
  \ decoder_state_input_c]\n```\n\n这些是解码器 LSTM 接收的隐藏状态和单元状态。\n\n接下来，我们需要指定输入形状。由于这次只有一个单词输入，输入的形状为\
  \ 1。输入需要通过嵌入层。以下脚本执行了该操作：\n\n```python\ndecoder_inputs_single = Input(shape=(1,))\n\
  decoder_inputs_single_x = decoder_embedding(decoder_inputs_single)\n```\n\n最后，我们需要将训练阶段训练好的\
  \ `decoder_states_inputs` 和 `decoder_inputs_single_x`（单个单词）传递给解码 LSTM：\n\n```python\n\
  decoder_outputs, h, c = decoder_lstm(\n    decoder_inputs_single_x,\n    initial_state=decoder_states_inputs\n\
  )\n```\n\n\n\n\n`LSTM` 的输出将是 `decoder_output` 以及隐藏状态和单元状态。`decoder output` 将通过 `dense\
  \ layer`（全连接层）来产生最终输出，如最后的脚本所示：\n\n```python\ndecoder_states = [h, c]\ndecoder_outputs\
  \ = decoder_dense(decoder_outputs)\n```\n\n注意，我们将隐藏状态和单元状态存储在变量 `decoder_states`\
  \ 中，因为我们希望模型输出这些值。用于预测的采样模型可以使用以下脚本创建：\n\n## 采样模型\n\n### inputs\n- `y(t-1)`\n- `h(t-1)`\n\
  - `c(t-1)`\n\n### outputs\n--`y(t)`\n- `h(t)`\n- `c(t)`\n\n```python\n## The sampling\
  \ model \ndecoder_outputs, h, c = decoder_lstm(\n    decoder_inputs_single_x,\n\
  \    initial_state=decoder_states_inputs\n)\n```\n\n在预处理步骤中，我们将单词转换成了整数。模型的输出将是一个整数。我们需要将该整数转换回单词。执行以下脚本来实现此操作：\n\
  \n```python\nidx2word_input = {v:k for k, v in word2idx_inputs.items()}\nidx2word_target\
  \ = {v:k for k, v in word2idx_outputs.items()}\n```\n\n在这里，`idx2word_input` 和 `idw2word\
  \ target` 是字典，其键是整数，值是与整数对应的单词。这些字典将单词转换为整数。\n\n最后，我们编写了一个函数，它接收输入序列并返回输出序列。该函数的脚本如下：\n\
  \n```python\ndef generate_response(input_seq):\n    # 将输入编码为状态向量。\n    states_value\
  \ = encoder_model.predict(input_seq)\n    # 生成一个长度为 1 的空目标序列。\n    target_seq =\
  \ np.zeros((1, 1))\n    # 用起始字符填充目标序列的第一个字符。\n    # 注意：tokenizer 将所有单词转为小写\n   \
  \ target_seq[0, 0] = word2idx_outputs['<sos>']\n    # 如果得到这个则跳出\n    eos = word2idx_outputs[''']\n\
  \    # 创建翻译\n    output_sentence = []\n    for _ in range(max_len_target):\n   \
  \     output_tokens, h, c = decoder_model.predict(\n            [target_seq] + states_value\n\
  \        )\n        # 获取下一个单词\n        idx = np.argmax(output_tokens[0, 0, :])\n\
  \        # 句子 EOS 结束\n        if eos == idx:\n            break\n        word =\
  \ ''\n        if idx > 0:\n            word = idx2word_target[idx]\n        output_sentence.append(word)\n\
  \        # 更新解码器输入\n        # 即刚刚生成的单词\n        target_seq[0, 0] = idx\n       \
  \ # 更新状态\n        states_value = [h, c]\n        # states_value = [h] # gru\n  \
  \  return ' '.join(output_sentence)\n```\n\n`generate_response` 函数接收输入序列作为参数。它首先使用编码器模型找到隐藏状态和单元状态。\n\
  \n然后，它创建一个大小为 1 x 1 的新随机变量，并用 `sos` 的索引进行初始化。记住，每个句子的第一个单词都是 `sos`。然后我们找到 `eos`\
  \ 的索引，因为我们希望在预测到 `eos` 时结束目标序列的生成。\n\n接下来，我们执行循环，迭代次数等于最大目标序列长度。在每次迭代中，我们将输入目标加上之前的隐藏状态值插入到\
  \ `decoder_model` 中。在输出中，我们接收所有可能单词的概率分布，以及隐藏状态和单元状态。\n\n我们使用 `argmax` 函数找到概率最高的单词并存储其索引。如果该索引等于\
  \ `eos` 的索引，我们退出循环。否则，如果索引大于 0，我们从索引中找到对应的单词，并将其添加到 `output_sentence` 列表中。最后，我们将列表中的单个单词连接起来返回它。\n\
  \n## 第 8 步：进行预测\n\n最后一步是测试我们开发的聊天机器人。查看以下脚本：\n\n```python\nwhile True:\n    # 进行一些测试翻译\n\
  \    i = np.random.choice(len(input_texts))\n    input_seq = encoder_inputs[i:i+1]\n\
  \    translation = generate_response(input_seq)\n    print('-')\n    print('Input:',\
  \ input_texts[i])\n    print('Response:', translation)\n    ans = input(\"Continue?\
  \ [Y/n]\")\n    if ans and ans.lower().startswith('n'):\n        break\n```\n\n\
  在上面的脚本中，我们创建了一个无限循环。在循环内部，我们从输入列表中随机选择一个输入序列并将其传递给 `generate_response` 函数。循环一直持续，直到你不按“n”。这里是输出的快照：\n\
  \n![image](img/image09)\n\n这个机器人并不高效，因为我只使用了 `581` 个样本，这与开发聊天机器人的数据集相比非常小。不过，概念是一样的；你只需要更大的数据集来提高机器人的效率。\n\
