  \ import StandardScaler\nfeature_scaler = StandardScaler()\nfeatures = feature_scaler.fit_transform(features)\n\
  ```\n\n这些是执行任何机器学习算法时所需的标准步骤。现在我们将看到如何使用 `Keras` 库来实现人工神经网络。\n\n### 1. 创建 ANN\n\n\
  现在让我们创建一个将用于交叉验证的人工神经网络。我们将创建一个方法，创建一个具有两个隐藏层和一个输出层的人工神经网络，正如我们在上一章中所做的那样。如下所示：\n\
  \n```python\nfrom keras.models import Sequential\nfrom keras.layers import Dense\n\
  \ndef train_classifier():\n    ann_clf= Sequential()\n    ann_clf.add(Dense(units\
  \ = 9, kernel_initializer = 'uniform', activation = 'relu', input_dim = 11))\n \
  \   ann_clf.add(Dense(units = 9, kernel_initializer = 'uniform', activation = 'relu'))\n\
  \    ann_clf.add(Dense(units = 6, kernel_initializer = 'uniform', activation = 'softmax'))\n\
  \    ann_clf.compile(optimizer = 'adam', loss = 'categorical_crossentropy', metrics\
  \ = ['accuracy'])\n    return ann_clf\n```\n\n`train_classifier` 方法返回人工神经网络。\n\n\
  ### 2. 实现交叉验证\n\n为了实现交叉验证，我们使用 `sklearn.model_selection` 中的 `cross_val_score`。脚本如下：\n\
  \n```python\nfrom keras.wrappers.scikit_learn import KerasClassifier\nfrom sklearn.model_selection\
  \ import cross_val_score\n\nann_clf = KerasClassifier(build_fn=train_classifier,\
  \ batch_size=10, epochs=500)\nresults = cross_val_score(ann_clf, features, labels,\
  \ cv=10)\n```\n\n要查看 `cross_val_score` 返回的准确率，你可以打印：\n\n```python\nprint(results)\n\
  ```\n\n![image](img/image30)\n\n要查看所有准确率的平均值，调用：\n\n```python\nprint(results.mean())\n\
  ```\n\n结果显示 `0.5653` 即 `56.53%`。最后要查看标准差，执行：\n\n```python\nprint(results.std())\n\
  ```\n\n上述脚本返回 `0.0554` 或 `5.54%`，这意味着对数据集的测试准确率在 51% 到 61% 之间。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ ||  || ![image](img/chapter_title_corner_decoration_right.png) |\n| --- | ---\
  \ | --- |\n![image](img/chapter_title_above.png)\n\n### 7. 网格搜索\n\n机器学习算法的工作是找到产生最佳结果的参数集或权重。这些参数由算法发现并取决于数据集。\n\
  \n然而，在运行算法之前还有另一组参数需要指定。例如 `KNN` 算法的 `K` 值、`SVM` 算法的 `kernel` 类型、`Random forest`\
  \ 算法的 `estimators` 数量、人工神经网络的 `nodes`、`batch_size` 以及 `epochs` 数量等。这些参数是可以控制或指定的。\n\
  \n然而，我们并不知道这些参数的最佳值。在最后部分，我们为 ANN 设置了 `batch_size` 为 10，epochs 为 500。如果算法在 batch\
  \ size 为 5，epochs 为 300 时性能更好呢？\n\n网格搜索算法帮助我们解决这个问题。基本上，网格搜索算法做的是从一组参数 set 中自动为特定算法找到最佳参数。\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n| --- | --- | --- |\n![image](img/chapter_title_above.png)\n\n## 使用 Keras 实现网格搜索\n\
  \n要使用 `keras` 实现网格搜索，前 1 到 4 步以及 6、7 步与我们在交叉验证中执行的步骤相同。我们网格搜索不需要独热编码。因此，更新第 5 步即独热编码步骤脚本如下：\n\
  \n```python\nfrom sklearn.preprocessing import LabelEncoder\nencoder = LabelEncoder()\n\
  labels = encoder.fit_transform(labels)\n```\n\n在执行了上述七个步骤的脚本后，执行以下脚本：\n\n\n\n\n\n\
  ```\nkeras_ann_clf = KerasClassifier(build_fn = train_classifier)\n```\n\n上述脚本将\
  \ keras 分类器转换为 sklearn 分类器。我们将使用 `sklearn.model_selection` 库中的 `GridSearchCV` 类；因此，我们需要像在交叉验证部分所做的那样，将\
  \ keras 分类器转换为 sklearn 分类器：\n\n### 创建参数字典\n\n网格搜索算法并不是随机运行并寻找算法的所有最佳参数的，因为这可能花费数年时间。例如，如果网格搜索算法开始测试\
  \ ANN 的 `batch_size` 参数从 1 到 500 的每个值，那么算法至少必须运行 500 次，而这仅仅是针对一个参数。因此，会将你想要测试的每个参数的一组值传递给\
  \ `GridSearchCV` 类。这些参数集以字典的形式传递进去。\n\n假设我们想为 ANN 测试不同的 `batch_size` 值和若干个 `epochs`（训练轮数），我们可以创建一个如下所示的字典：\n\
  \n```python\ngrid_params = {'batch_size': [10, 5],\n'epochs': [500, 300]\n}\n```\n\
  \n在上面的脚本中，我们创建了一个名为“grid_params”的字典，字典的键是参数名称，字典的值对应参数的值。从这些值集中，网格搜索算法将返回最佳组合。\n\
  \n这里需要提到的是，网格搜索算法花费的时间很大取决于你想要测试的值以及交叉验证的折数（folds）。\n\n例如，在我们的案例中，`batch_size` 参数有\
  \ 2 个值，`epochs` 有 2 个值。这种情况下总可能的组合为 2 x 2 = 4 次。将此值乘以折数，例如 10。这使得产生了 40 次执行。在 40\
  \ 次执行中，20 次有 500 次 `epochs`，而 20 次有 300 次 `epochs`，总共 1.6 万次 `epochs`。这会让算法变慢。\n\
  \n### 创建参数字典（继续）\n\n为了执行网格搜索，我们需要创建一个 `GridSearchCV` 类的对象，并为其传递分类器、我们刚刚创建的参数字典、性能评估指标（我们将使用\
  \ `accuracy`）以及交叉验证折数。执行以下脚本以创建 `GridSearch` 对象。\n\n```python\nfrom sklearn.model_selection\
  \ import GridSearchCV\n\ngs= GridSearchCV(estimator = keras_ann_clf,\nparam_grid\
  \ = grid_params,\nscoring = 'accuracy',\ncv = 10)\n```\n\n最后一步是在 `GridSearchCV`\
  \ 对象上调用 `fit` 方法，并如所示传递训练集和测试集：\n\n```python\ngs_result = gs.fit(features, labels)\n\
  ```\n\n执行此操作可能需要一些时间。\n\n一旦上述脚本执行完毕，最后也是一步是查看网格搜索选择的参数。为了这样做，你可以如下所示使用 `GridSearchCV`\
  \ 类的 `best_params_` 属性：\n\n```python\nprint(gs_result.best_params_)\n```\n\n输出如下：\n\
  \n```python\n{'batch_size': 10, 'epochs': 300}\n```\n\n输出显示从给定的参数集中，最佳参数是 `batch_size`\
  \ 为 10 和 300 次 `epochs`。使用上述参数值实现了最佳性能。最后，为了查看使用最优参数所实现的准确率，执行以下脚本：\n\n```python\n\
  print(gs_result.best_score_)\n```\n0.5941213258286429\n\n你可以看到，当 batch size 为 10\
  \ 且 `epochs` 为 300 时，我们获得的平均准确率为 59.41%，大于我们在上一节中 batch size 为 10 且 500 次 `epochs`\
  \ 时得到的 56.53%。\n\n## 结论\n\n在本章中，我们看到了如何使用交叉验证来处理方差问题。我们还研究了如何使用网格搜索来选择算法的最佳参数。在下一章中，我们将卷积神经网络（CNN），这是一种极其强大的算法，通常用于计算机视觉问题。\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n| --- | --- | --- |\n![image](img/chapter_title_above.png)\n\n# 第 6 章\n\n![image](img/chapter_title_below.png)\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n| --- | --- | --- |\n![image](img/chapter_title_above.png)\n\n## 卷积神经网络简介\n\
  \n![image](img/chapter_title_below.png)\n\n在上一章中，我们实现了一个全连接神经网络，其中前层中的每个节点都连接到下一层中的每个节点。这是神经网络最简单的架构。然而，针对特定任务也开发了许多先进的神经网络。其中一种神经网络就是卷积神经网络（CNN），它用于识别以\
  \ 2D 形式存在的数据中的模式。\n\nCNN 常用于图像分类等计算机视觉问题。在本章中，我们将学习卷积神经网络背后的直觉。在下一章中，我们将用 Python\
  \ 实现卷积神经网络。\n\n| ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n| --- | --- | --- |\n![image](img/chapter_title_above.png)\n\n### 计算机如何看待图像\n\
  \n![image](img/chapter_title_below.png)\n\n这里需要提到，计算机处理图像的方式与人类不同。我们人类看到线条、曲线和不同的颜色。而计算机只能看到数字。对于灰度图像，图像被视为\
  \ 0 到 255 之间的二维数组。对于彩色图像，有 3 个 0 到 255 的通道，分别对应红、绿、蓝。\n\n假设我们有如下灰度图像，对我们来说是一个微笑，但对计算机来说，它仅仅是零的二维数组。为了简单起见，这里\
  \ 1 表示黑色，0 表示白色。\n\n![image](img/image059.png)\n\n––––\n\n![image](img/scene_break.png)\n\
  \n现在我们知道了图像在内存中的样子。让我们开始讨论 CNN。执行神经网络需要执行的步骤如下：\n\n1. 卷积操作\n2. ReLU\n3. 池化\n4. 扁平化\n\
  5. 全连接层\n\n| ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n| --- | --- | --- |\n![image](img/chapter_title_above.png)\n\n### 卷积操作\n\n\
  ![image](img/chapter_title_below.png)\n\n卷积神经网络涉及的第一步是卷积操作。\n\n在卷积操作中，我们有一个输入图像（如左侧所示）和一个特征检测器（也称为卷积算子或内核，如上图中\
  \ 3x3 矩阵形式所示）。\n\n![image](img/image021.png)\n\n图 6.1：卷积操作\n\n在卷积操作中，特征检测器从左到右、从上到移动图像。对应的像素相乘，并将所有对应像素的乘积相加。这里需要提到步长（stride）的概念。步长是特征检测器移动的步。步长为\
  \ 1 意味着检测器向右或向下移动一步。\n\n例如，在输入图像的右下角，你可以看到下面的数字矩阵：\n\n––––\n\n![image](img/scene_break.png)\n\
  \n| 0 || 1 || 0 |\n| --- | --- | --- |\n| 1 || 0 || 0 |\n| 0 || 0 || 0 |\n\n\n\n\
  \n\n当你将上述矩阵的每个像素值与特征检测器的对应像素值相乘并将结果相加时，你会得到以下值：\n\n`0x0 + 1x0 + 0x1 + 1x1 + 0x0\
  \ + 0x0 + 0x0 + 0x1 + 0x1 = 1`\n\n你可以在 `Feature map`（特征图）的右下角看到 `1`。\n\n现实中，有多个特征检测器会产生多个特征图，如下所示。图像具有多个特征，而一个特征检测器只能检测一个特征。因此，拥有多个特征检测器是有意义的。\n\
  \n![image](img/image037.png)\n\n图 6.2:特征检测器\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ ||  || ![image](img/chapter_title_corner_decoration_right.png) |\n\n| --- | ---\
  \ | --- |\n\n![image](img/chapter_title_above.png)\n\n### ReLu 操作\n\n![image](img/chapter_title_below.png)\n\
  \n一旦卷积操作生成了特征图，下一步是执行 ReLu 操作。我们在第 3 章详细学习了 `Relu Operation`。卷积操作是线性的。然而，现实中的图像是非线性的。为了在图像中引入非线性，执行了\
  \ `ReLu` 操作。\n\n在 `ReLu` 中，特征图中所有的负值都被替换为零。正值保持不变。\n\n假设我们有如下特征图：\n\n––––––––\n\n\
  ![image](img/scene_break.png)\n\n| \\-4 || 2 || 1 || \\-2 |\n| --- | --- | --- |\
  \ --- |\n| 1 || \\-1 || 8 || 0 |\n| 3 || \\-3 || 1 || 4 |\n| 1 || 0 || 1 || \\-2\
  \ |\n\n当 `Relu` 函数作用于特征图上，生成的特征图看起来如下：\n\n| 0 || 2 || 1 || 0 |\n| --- | --- | ---\
  \ | --- |\n| 1 || \\-0 || 8 || 0 |\n| 3 || 0 || 1 || 4 |\n| 1 || 0 || 1 || 0 |\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n### 池化\n\n\
  ![image](img/chapter_title_below.png)\n\n在学习池化之前，让我们先理解空间不变性（spatial invariance）。看看下面几张猎豹的图片。第一张是原始图像，第二张图像方向发生了改变，而第三张图像发生了失真。然而，在所有三种情况下，我们都能识别出这是一只猎豹。即使鼻子、耳朵和眼睛不在图像的相同位置，我们也能识别它们。\n\
  \n![image](img/image024.png)\n\n图 6.3: 空间不变性\n\n这被称为空间不变性，无论特征位于何，你都可以识别它。池化有助于实现空间不变性。\n\
  \n与卷积类似，在池化中我们拥有任意大小的过滤器。假设我们有一个大小为 `2x2` 的过滤器。我们将其放在图像上，并选择该步长内的最大值。这被称为最大池化（max\
  \ pooling）。在某些情况下也会使用和池化、平均池化最小池化。看下面的图：\n\n![image](img/image063.png)\n\n图 6.4:\
  \ 最大池化\n\n在第 `2`、`3` 行以及第 `3`、`4` 列中，我们有值 `1`、`1`、`1` 和 `2`。最大值是 `2`；你可以在右侧的池化特征图中看到这个最大值。\n\
  \n在没有值可比较的情况下（例如右下角，我们只有一个 `1`），它被传递到池化特征图中。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ ||  || ![image](img/chapter_title_corner_decoration_right.png) |\n\n| --- | ---\
  \ | --- |\n\n![image](img/chapter_title_above.png)\n\n### 展平\n\n![image](img/chapter_title_below.png)\n\
  \n为了从图像中检测更多特征，卷积神经网络的输出（即池化特征图）被用作全连接神经网络的输入。池化特征图是 `2-D arrays` 形式。然而，全连接神经网络的输入应该是特征向量或\
  \ `1-D array` 形式。在展平步骤中，池化特征图被展平，如图所示：\n\n![image](img/image017.png)\n\n图 6.5: 展平\n\
  \n在有多个池化特征图的情况下，可以将它们堆叠在一起形成一个长的列向量。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ ||  || ![image](img/chapter_title_corner_decoration_right.png) |\n\n| --- | ---\
  \ | --- |\n\n![image](img/chapter_title_above.png)\n\n### 全连接层\n\n![image](img/chapter_title_below.png)\n\
  \n卷积神经网络的最后一步是将展平后的池化特征图输入到全连接神经网络（我们在第 4 章和第 5 章学习过），如图 6.6 所示。执行这一步是为了从卷积、relu\
  \ 和池化步骤生成的现有特征集中找到更多特征。\n\n![image](img/image039.png)\n\n图 6.6: 特征检测器\n\n要可视化 CNN，请查看由\
  \ [Adam Harley](http://www.cs.cmu.edu/~aharley/) 开发的[这个工具](http://scs.ryerson.ca/~aharley/vis/conv/flat.html)。该工具可可视化\
  \ CNN。你可以在左上角的数字框中写数字，CNN 就会检测你写的内容。该工具使用的 CNN 具有 2 层卷积、relu 和池化操作，随后是两个全连接层，如下：\n\
  \n![image](img/image20.png)\n\n图 6.7: 可视 CNN (`scs.ryerson.ca/~aharley/vis/conv/flat.html))\
  \ 注意：池化和 ReLu 操作结合在了一起。\n\n建议你玩玩这个工具，对卷积网络建立更多直觉。\n\n| ![image` ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n## 总结\n\n\
  ![image](img/chapter_title_below.png)\n\n在本章中，我们学习了 CNN 背后的理论。我们看到了执行 CNN 的步骤。在下一章中，我们将在\
  \ Python 中实现 CNN。\n\n| ![image](img/chapter_title_corner_decoration_left.png) ||\
  \  || ![image](img/chapter_title_corner_decoration_right.png) |\n\n| --- | --- |\
  \ --- |\n\n![image](img/chapter_title_above.png)\n\n# 第 7 章\n\n![image](img/chapter_title_below.png)\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n## 使用卷积神经网络进行图像分类\n\
  \n![image](img/chapter_title_below.png)\n\n在上一章中，我们学习了什么是卷积神经网络（CNN）以及开发卷积神经网络涉及的各个步骤。\n\
  \n在本章中，我们将继续在 Python 中实现卷积神经网络。我们知道卷积神经网络可以学习识别如图像等二维映射图上相关的特征。在本章中，我们将使用 CNN 解决图像分类任务。给定一组图像，任务是预测某张图像包含猫还是狗。\n\
  \n\n\n\n\n这是一个非常著名的问题，该问题的数据可以在 [google](https://www.kaggle.com/c/dogs-vs-cats)\
  \ 数据集中找到。原始数据集包含约 25000 张图像。然而，为了简单起见便于下载，我们将仅使用 10,000 张图像进行训练和测试。本章节的数据可以在 `animal_datafolder`\
  \ 中找到，该文件夹位于 Datasets 文件夹内，你可以从书中描述部分提供的链接进行下载。\n\n### 理解数据\n\n在开始编写 CNN 代码之前，我们需要先了解数据集是如何安排的，因为我们没有可以作为数据源的单个\
  \ CSV 文件。相反，我们有一组图像。为了实现机器学习模型，我们需要因变量和自变量。自变量用于预测因变量。\n\n将一组图像转换为自变量和因变量，我们有几种选择。一种方法是根据图像类型将每张图像命名为\
  \ cats 或 dogs，后面跟一个唯一 id。这些图像就可以作为自变量。为了创建因变量向量，我们可以解析每个文件名，并根据找到的值（即猫或狗）在因变量向量中添加特定的条目。这非常繁琐并且涉及一些自定义代码。\n\
  \n然而，Keras 有一个更好的解决方案。我们只需要将图像按照特定的文件夹结构安排，Keras 就会自动检测因变量自变量。此外，Keras 还会根据目录结构检测训练集和测试集。\n\
  \n因此，为了让 Keras 理解自变量和因变量，我们必须按照特定的文件夹结构安排图像。\n\n首先，你需要一个包含训练集和测试集的顶层文件夹。在顶层文件夹内部，你需要两个文件夹，分别用于训练集和测试集。在训练集和测试集内部，你需要为每个类别创建文件夹。例如，如果你有两种类型的图像（即猫和狗），你需要在训练集和测试集文件夹内为\
  \ cats 和 dogs 创建文件夹。\n\n我们在本章中使用的目录结构如下：\n\n![image](img/image035.png)\n\n你可以看到我们有一个顶层文件夹\
  \ `animal_data`，它包含了 `test_set` 和 `training_set` 文件夹。`animal_data` 文件夹还包含了 `single_predictionfolders`，我们在本章中不会使用。`test_set`\
  \ 和 `training_set` 文件夹都包含 dogs 和 cats 文件夹。我们将使用 8000 张图像进行训练，2000 张进行测试。因此，`training_set`\
  \ 文件夹包含 8000 张图像。`training_set` 文件夹中的 `cats` 和 `dogs` 文件夹各包含 4000 张图像。同样，`test_set`\
  \ 文件夹中的 `cats` 和 `dogs` 文件夹各包含 1000 张图像。如果你打开 `cats` 文件夹，你会看到猫的图像，而 dogs 文件夹包含了狗的图像。\n\
  \n这种数据集安排方式的优点是它可以用于任何问题。例如，如果你想分类汽车和卡车的图像，只需在 `training_set` 和 `test_set` 文件夹中为\
  \ cars 和 trucks 创建文件夹即可。\n\n我们已经为 Keras 准备好了数据。\n\n现在是用 Keras 编写卷积神经网络代码了。按照以下步骤操作：\n\
  \n### 1. 导入库\n\n一如既常，第一步是导入库：\n\n```python\nfrom tensorflow.keras.models import\
  \ Sequential\nfrom tensorflow.keras.layers import Conv2D, MaxPooling2D, Flatten,\
  \ Dense\n```\n\n### 2. 初始化卷积网络\n\n第一步是初始化网络：\n\n```python\ncnn_clf = Sequential()\n\
  ```\n\n### 3. 添加卷积和池化层\n\n下一步是添加层。如下创建第一个卷积层：\n\n```python\ncnn_clf.add(Conv2D(32,\
  \ (3, 3), input_shape=(64, 64, 3), activation='relu'))\ncnn_clf.add(MaxPooling2D(pool_size=(2,\
  \ 2)))\n```\n\n让我们再添加一个卷积和池化层：\n\n```python\ncnn_clf.add(Conv2D(32, (3, 3), activation='relu'))\n\
  cnn_clf.add(MaxPooling2D(pool_size=(2, 2)))\n```\n\n### 4. 输入扁坦化\n\n在与全连接神经网络使用数据之前，我们需要对输入进行扁坦化：\n\
  \n```python\ncnn_clf.add(Flatten())\n```\n\n### 5. 添加密集层\n\n\n\n\n卷积神经网络的最后一步是将数据从展平层（flatten\
  \ layer）输入到全连接层（densely connected layer）。全连接层与我们在第 3 章和第 4 章中创建 ANN 时使用的相同层。我们将使用一个包含\
  \ 128 个节点的隐藏层。以下脚本添加了一个隐藏层：\n\n```python\nh1 = Dense(units = 128, activation = 'relu')\n\
  cnn_clf.add(h1)\n```\n\n在输出层中，由于是二分类结果，我们将使用 sigmoid 激活函数。执行以下脚本：\n\n```python\n\
  h2 = Dense(units = 1, activation = 'sigmoid')\ncnn_clf.add(h2)\n```\n\n### 编译 CNN\n\
  \nCNN 的编译步骤与 ANN 类似。我们使用 `compile` 函数并向其传递优化器函数、损失函数和指标，如下所示：\n\n```python\ncnn_clf.compile(optimizer\
  \ = 'adam', loss = 'binary_crossentropy', metrics = ['accuracy'])\n```\n\n### 图像数据增强\n\
  \n在我们的数据集中，有 8 万张图像用于训练模型。这实际上是一个非常小的数字，可能会导致过拟合（over-fitting）。过拟合是指机器学习模型在训练数据上的准确率较高，但对测试实例的预测准确率的现象。\n\
  \n在简单的机器学习问题中，我们只需要找到因变量和自变量之间的关系。然而，在图像的情况下，机器学习模型必须找到图像不同部分之间的关系。因此，对于图像分类，需要大量的图像。\n\
  \n幸运的是，Keras 包含一个名为 `ImageDataGenerator` 的类，它可以帮助从现有图像生成不同类型的图像，从而增加训练集中的图像数量。\n\
  \n`ImageDataGenerator` 类生成图像的副本，然后执行诸如切换图像方向、缩小尺寸、扭曲图像等任务，从现有图像中创建新的独特图像。\n\n查看以下脚本以了解\
  \ `ImageDataGenerator` 类的工作。\n\n```python\nfrom keras.preprocessing.image import\
  \ ImageDataGenerator\n\ntrain_setgen = ImageDataGenerator(rescale = 1./255,\n  \
  \                             shear_range = 0.2,\n                             \
  \  zoom_range = 0.2,\n                               horizontal_flip = True)\n```\n\
  \n在上面的脚本中，我们首先从 `keras.preprocessing.image` 库导入 `ImageDataGenerator`。然后我们创建该类的对象。在构造函数中，我们需要传递\
  \ `rescaling`、`shear_range`、`zoom_range` 和 `horizontal_flip` 的值。这些都是应用于图像的不同类型的变换，以生成不同类型的训练数据。在上面的脚本中，我们为训练集应用了这些变换。\n\
  \n对于测试集，我们希望保持一切不变，只是缩放图像。执行以下脚本为测试类创建一个图像数据生成器。\n\n```python\ntest_setgen = ImageDataGenerator(rescale\
  \ = 1./255)\n```\n\n### 创建训练集和测试集\n\n我们已经创建了转换训练集和测试集的类。我们将使用这些类来创建要使用的训练集和测试集。查看以下脚本：\n\
  \n```python\ntraining_data = train_setgen.flow_from_directory(r'D:/Datasets/animal_data/training_set',\n\
  \                                               target_size = (64, 64),\n      \
  \                                         batch_size = 32,\n                   \
  \                            class_mode = 'binary')\n\ntest_data = train_setgen.flow_from_directory('D:/Datasets/animal_data/test_set',\n\
  \                                               target_size = (64, 64),\n      \
  \                                         batch_size = 32,\n                   \
  \                            class_mode = 'binary')\n```\n\n由于我们的图像存储在本地目录中；因此我们需要调用\
  \ `flow_from_directory` 方法来应用变换。该方法接受四个参数。第一个参数是包含你想转换的图像的目录路径。\n\n第二个参数是 `target_size`\
  \ 参数，指定了图像的尺寸。在第一个卷积层中，我们指定图像将是 64 x 64 像素。因此，向 `target_size` 参数传递一个元组 `(64, 64)`。\n\
  \n第三个参数是 `batch_size` 参数，指定了要生成的图像批大小。最后，由于我们的输出中有两个类（即猫和狗），因此我们将 `class_mode` 参数设置为二分类（binary）。\n\
  \n### 寻找准确率\n\n我们已经有了所需格式的训练数据和测试数据。下一步是训练模型并找到准确率。执行以下脚本进行操作：\n\n```python\ncnn_clf.fit_generator(training_data,\n\
  \                      steps_per_epoch = (8000/32),\n                      epochs\
  \ = 25,\n                      validation_data = test_data,\n                  \
  \    validation_steps = (2000/32))\n```\n\n为了训练模型，我们需要在 `cnn_clf` 对象上调用 `fit_generator`\
  \ 方法。我们需要将训练数据作为第一个参数传递。第二个参数是 `steps_per_epoch`，它基本上是批大小。由于每个批次有 32 张图像，我们将图像总数除以批大小，以便在批处理期间每张图像被使用一次。`epochs`\
  \ 的数量是你希望重复整个批训练的次数。`validation_data` 参数接收了 `test_data` 作为参数。最后，对于测试集，你再次需要传递批数。在这里我们再次有\
  \ 2000 个批次，每个批次测试 32 张图像。因此，两次测试即可完成测试集中所有的 2000 张图像，我们将 2000 除以 32。\n\n上述脚本将运行。\n\
  \n\n\n\n\n![image](img/chapter_title_above.png)\n\n## 人脑中的记忆类型\n![image](img/chapter_title_below.png)\
  \ (等一下，让我重新格式化)\n\n![image](img/chapter_title_below.png)\n\n我们知道人工神经网络是为了模仿人脑而建模的。人脑有两种类型的记忆：长期记忆和短期记忆。例如，在长期记忆的帮助下，我们可以认出五年前看过的电影。即使在多年后见到亲密朋友，我们也能认出他们的脸。另一方面，短期记忆通常帮助我们记住某件事很短一段时间，然后它就会消失。例如，我们不记得三周前吃了什么。在人脑中，颞叶存储长期记忆，而额叶负责短期记忆。\n\
  \n## 什么是 RNN？\n![image](img/chapter_title_below.png) \n\n人工神经网络通过前向传播和反向传播步骤的重复循环进行训练。在前向传播步骤中，计算误差；在反向传播中，更新权重以减少误差。一旦误差降到最小，就可以保存权重。这些权重构成了长期记忆。\n\
  \n循环神经网络与其他神经网络的区别在于，在 RNN 的情况下，神经元的输出被作为输入馈回到自身。这复制了人脑短期记忆的行为。图 8.1 显示了 RNN 的架构。\n\
  \n![RecurrentLayerNeuralNetwork.png](img/image022.png)\n\n图 8.1：循环神经网络的架构\n\n###\
  \ RNN 的应用\n![image](img/chapter_title_below.png)\n\nRNN 的应用可以分为三大类：\n\n*   一对多（One\
  \ to Many）\n这类应用有一个输入和多个输出。此类应用的示例可以是图像描述符，其中图像是系统的输入，图像的描述是输出。\n\n*   对一（Many To\
  \ One）\n文本分类是此类应用的典型示例。例如，在垃圾邮件分类应用中，包含多个单词的文本字符串作为输入输入，输出是标签 ham（正常邮件）或 spam（垃圾邮件）。\n\
  \n*   多对多（Many to Many）\n机器翻译是属于多对多类 RNN 应用的最优秀示例之一。\n\n例如，如果你有一个句子“The boy eats\
  \ an apple and he likes mangoes too”（男孩吃了一个苹果，他也喜欢芒果子）。如果你将上面的句子改为“The girl eats\
  \ an apple”（女孩吃了一个苹果），并保持句子的其余部分不变，RNN 应用会给警告指出“he likes mangoes”中的“he”应该改为“she”，因为\
  \ RNN 会跟踪之前的信息，它发现那里是 girl（女孩）而不是 boy（男孩）。\n\n### 循环神经网络的步骤\n![image](img/chapter_title_below.png)\n\
  \n正如我们之前看到的，循环神经网络与人工神经网络非常相似。唯一的增加是从隐藏层到自身的反馈数据。像 ANN 一样，RNN 也由多个前向传播和反向传播循环组成。\n\
  \n### 前向传播（Feedforward）\n\n以下是循环神经网络的前向传播步骤：\n\n1.  对于隐藏层中的每个节点，输入值与该特定隐藏层的权重矩阵相乘，可以表示为\
  \ `Wxh * X`。这里 `Wxh` 是隐藏层 `h` 的权重矩阵，`X` 是输入向量。这里的星号表示两个向量之间的点积。\n2.  由于在 RNN 的每个节点处，我们将从上一个隐藏状态的数据输入到新的隐藏状态。这可以表示为\
  \ `Whh * h[t-1]`。这里 `Whh` 是隐藏状态 `h` 的权重矩阵，`h[t-1]` 是上一个时间戳（即 `t-1`）隐藏状态的输出。\n3.\
  \  步骤 2 和 3 的输出与偏置（bias）相加，作为当前隐藏状态的输入。\n4.  将激活函数应用于隐藏状态的输入，生成新值。\n\n这些步骤在网络的每个节点处执行，直到到达输出节点。\n\
  \n### 反向传播（Backpropagation）\n\nRNN 的反向传播步骤与普通 ANN 完全相同：\n\n1.  使用损失函数计算实际输出与计算输出之间的误差，损失函数通常是负对数似然，因为输出节点使用的激活函数通常是\
  \ softmax。\n2.  将误差反向传播到整个网络并相应地更新权重。\n\n## 结论\n![image](img/chapter_title_below.png)\n\
  \n在本章中，我们看到了循环神经网络背的基本原理，即从上一个时间戳隐藏层输出到新时间戳的反馈机制。这允许 RNN 记住之前发生过什么，这对于预测序列数据非常有帮助。在下一章中，我们将看到\
  \ LSTM（RNN 的一个版本）如何解决未来价格预测等时间序列问题。\n\n# 第 9 章\n## 使用 RNN 进行时间序列分析\n\n在上一章中，我们开始了对\
  \ RNN 的讨论。我们说 RNN 可用于预测序列数据。在本章中，我们将利用 LSTM 预测微软的未来股价，LSTM 是 LSTM 最常用的版本之一。让我们直接进入正题：（等一下，格式后续所示）\n\
  \n### 下载数据\n![image](img/chapter_title_below.png)\n\n微软的股票数据可以从多种来源下载。然而，为了本文的起见，我们从以下链接下载了数据：\n\
  \n[`finance.yahoo.com/quote/MSFT/history/?guccounter=1`](https://finance.yahoo.com/quote/MSFT/history/?guccounter=1)\n\
  \n如果你访问上述链接，将看到微软的最新股票数据。你可以应用日期过滤器来筛选任何所需的时间段。\n\n在本章中，为了训练我们的 RNN，我们将使用 2012 年\
  \ 1 月 1 日至 2016 年 1 月 31 日的 5 年微软股票数据。为了测试我们的算法并进行评估，我们将使用微软的一个月数据，即 2017 年 1 月的数据。\n\
  \n在本章的起见，训练数据已下载并保存到 D 盘的 Datasets 文件夹中，名为 `ms-training.csv`。同样，测试文件已保存为同一文件夹下的\
  \ `ms-testing.csv`。\n\n\n\n\n\n### 数据分析\n\n如果你打开该文件，你会发现它包含七列：日期（Date）、开盘价（Open）、最高价（High）、最低价（Low）、收盘价（Close）、调整后收盘价（Adj\
  \ Close）和成交量（Volume）。我们只对预测未来某天的开盘价感兴趣。\n\n这种价格变化的模式极其不规则，对于普通的人工神经网络（ANN），很难捕捉这种模式。这就是\
  \ LSTM 发挥用场的地方。LSTM 能够在大数据中找到这种序列模式。\n\n我们已经对数据进行了可视化处理，现在是时候进行真正的编程了。我们将遵循传统的机器学习流程来实现这一目标。\n\
  \n![image](img/image005.png)\n\n图 9.1：多年开盘价的变化。\n\n### 导入库\n\n```python\nimport\
  \ numpy as np\nimport matplotlib.pyplot as plt\nimport pandas as pd\n```\n\n###\
  \ 加载数据集\n\n以下脚本加载数据集并将其存储在 `stock_data` DataFrame 中。\n\n```python\nstock_data =\
  \ pd.read_csv('D:\\\\Datasets\\\\ms-training.csv')\n```\n\n我们不需要使用整个数据集进行训练。我们只需要“Open”（开盘）列的值。以下脚本从开盘列提取值并将其存储在\
  \ numpy 数组中：\n\n```python\nstock_training = stock_data.iloc[:, 1:2].values\n```\n\
  \n### 数据缩放\n\nLSTM 的输入数据应该始终经过缩放。为了本文起见，我们将对数据进行归一化以便进行缩放。执行以下脚本进行操作：\n\n```python\n\
  from sklearn.preprocessing import MinMaxScaler\n\nnormalizer = MinMaxScaler(feature_range\
  \ = (0, 1))\nstock_training_scaled = normalizer.fit_transform(stock_training)\n\
  ```\n\n在上面的脚本中，我们使用了 `sklearn.preprocessing` 库中的 `MinMaxScaler` 类。我们使用 `feature_range`\
  \ 参数将数据缩放在 0 和 1 之间。\n\n### 数据预处理\n\n数据预处理是循环神经网络中最重要的步骤之一。我们需要以这种方式将数据输入 RNN，使其包含有关之前时间步以及当前时间步的信息，因为我们之前提到过\
  \ RNN 是通过从之前的数据中学习的。\n\n为了训练我们的算法，我们将使用过去 60 天的开盘价。选择 60 这个数字是因为各种研究人员曾尝试根据之前的 10、20\
  \ 和 50 天来预测某特定日的开盘价，结果显示使用最后 60 天可以获得最佳性能。换句话说，我们需要在训练数据中包含过去 60 个时间步。标签将只包含单个值，即第\
  \ 61 天的开盘价。\n\n以下脚本创建训练集和测试集：\n\n```python\ntrain_features = []\ntrain_labels =\
  \ []\nfor i in range(60, 1258):\n    train_features.append(stock_training_scaled[i-60:i,\
  \ 0])\n    train_labels.append(stock_training_scaled[i, 0])\n```\n\n在上面的脚本中，我们声明了两个列表：`train_features`\
  \ 和 `train_labels`。然后，我们从第 61 天（numpy 数组中的索引从 0 开始，因此索引 60 包含第 61 个元素）循环到 `stock_training_scaled`\
  \ 数组的最后一个元素。在每个循环周期中，我们将之前的 60 个值添加到 `train_features` 列表中，并将当前值添加到 `train_labels`\
  \ 列表中。\n\n最后，我们需要将训练集和测试集转换为 numpy 数组。以下脚本执行了此操作：\n\n```python\ntrain_features,\
  \ train_labels = np.array(train_features), np.array(train_labels)\n```\n\n最后，我们需要重塑训练集和测试集的形状。以下脚本执行了此操作：LSTM\
  \ 需要的是三维格式，其中第一个维度是记录数，第二个维度是时间步，第三个维度是特征数量。重塑数据以匹配 LSTM 的要求。执行以下脚本：\n\n```python\n\
  train_features = np.reshape(train_features, (train_features.shape[0], 60,1))\n\n\
  ### 创建 RNN (LSTM)\n\n我们现在已经将数据转换为正确的格式。下一步是构建我们的 RNN。我们将创建一个包含多个层的顺序 RNN。它将包含 LSTM\
  \ 层，最后是一个全连接神经网络层。我们还使用了丢弃正则化来防止数据过拟合。执行以下脚本导入创建 RNN 所需的库。\n\n```python\nfrom keras.models\
  \ import Sequential\nfrom keras.layers import Dense\nfrom keras.layers import LSTM\n\
  from keras.layers import Dropout\n```\n\n初始化 RNN\n\n```python\nregressor = Sequential()\n\
  ```\n\n在上面的脚本中，我们从 `keras.models` 导入了 `Sequential` 类，从 `keras.layers` 导入了 `Dense`、`LSTM`\
  \ 和 `Dropout` 类。\n\n创建顺序模型\n\n我们从创建一个顺序模型开始。我们将为此模型添加层。执行以下脚本：\n\n```python\nstock_predictor\
  \ = Sequential()\n```\n\n添加 LSTM 层和 Dropout 层\n\n我们将开始构建 LSTM 层构建顺序模型。要添加第一个 LSTM\
  \ 层，执行以下脚本：\n\n```python\nstock_predictor.add(LSTM(units = 50, return_sequences\
  \ = True, input_shape = (train_features.shape[1], 1)))\n```\n\n为了向顺序模型添加 LSTM 层，我们将\
  \ `LSTM` 对象传递给 `add` 方法。`LSTM` 对象的第一个参数是层中的神经元数量，由 `units` 指定。第二个参数是 `return_sequences`，它指定在该层之后将堆叠更多的\
  \ LSTM 层。最后，第三个参数是 `input_shape`，它接受两个参数：时间步数和特征数量。\n\n添加 LSTM 层后，我们需要添加正则化，这基本上是指在训练每次迭代中丢弃的神经元数量。这样做是为了避免过拟合。执行以下脚本添加丢弃正则化：\n\
  \n\n\n\n\n```\nstock_predictor.add(Dropout(0.2))\n```\n`0.2` 表示在每个 epoch（epoch）中会有\
  \ 20% 的神经元被丢弃。让我们再添加三层 `LSTM` 和丢弃正则化。请查看以下脚本：\n\n```python\nstock_predictor.add(LSTM(units=50,\
  \ return_sequences=True))\n```\n\n```python\nstock_predictor.add(Dropout(0.2))\n\
  ```\n\n```python\nstock_predictor.add(LSTM(units=50, return_sequences=True))\n```\n\
  \n```python\nstock_predictor.add(Dropout(0.2))\n```\n\n```python\nstock_predictor.add(LSTM(units=50))\n\
  ```\n\n```python\nstock_predictor.add(Dropout(0.2))\n```\n从最后一个 `LSTM` 层可以看出，这里我们没有使用\
  \ `return_sequences = True`，因为之后不再添加任何 LSTM 层了。\n\n### 添加全连接层 (Dense Layer)\n\n\
  我们在上一节中创建了 `LSTM` 层。然而，为了让我们的 `RNN` 更健壮，我们将像处理 `CNN` 一样在末尾添加一个 `Dense` 层。执行以下脚本为我们的\
  \ `RNN` 添加全连接层：\n\n```python\nstock_predictor.add(Dense(units=1))\n```\n输出连接层中的神经元数量将为\
  \ 1，因为我们只需要预测一个值，即给定日的股票开盘价。\n\n### 编译 RNN\n\n与任何其他神经网络一样，我们需要编译 `RNN` 以便在训练数据上进行训练。以下脚本编译了该算法：\n\
  \n```python\nstock_predictor.compile(optimizer='adam', loss='mean_squared_error')\n\
  ```\n为了编译该算法，我们需要在 `Sequential` 对象上调用 `compile` 方法，在我们案例中该对象是 `stock_predictor`。在这里，计算损失时我们将使用\
  \ `mean_squared_error` 函数，为了优化算法，我们将使用 `adam` 优化器。\n\n### 训练算法\n\n最后一步是训练 `RNN`。为此，我们将使用\
  \ `Sequential` 对象的 `fit` 方法，并向其传递 `train_features`、`train_labels`、`epochs` 数量以及\
  \ `batch_size`，如下所示：\n\n```python\nstock_predictor.fit(train_features, train_labels,\
  \ epochs=100, batch_size=32)\n```\n执行上述脚本后，你将看到我们的 `RNN` 开始训练。取决于硬件情况，训练可能花费相当的时间。\n\
