  \ `sigmoid` 函数。Keras 激活函数的详细信息可以在[此处](https://keras.io/activations/)找到。执行以下脚本添加输出层。\n\
  \n```python\nop = Dense(units = 6, kernel_initializer = 'uniform', activation =\
