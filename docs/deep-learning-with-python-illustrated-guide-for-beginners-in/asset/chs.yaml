  \n# 第 3 章\n\n![image](img/image047.png)\n\n## 人工网络理论\n\n![image](img/image57.png)\n\
  \n人工神经网络（ANN）试图通过连接一系列神经元形成大型网络来模仿人类神经系统。\n\n### 人脑是如何工作的\n\n![image](img/image33.png)\n\
  \n人类大脑由数十亿相互连接的神经元组成。人类神经元有三个主要部分：树突（Dendrite）、核（Nucleus）和轴突（Axon）。树突负责接收其他神经元的信息。核作为中心单元并处理信息。最后，处理后的信息传递给轴突。\n\
  \n### 感知机\n\n![image](img/image36.png)\n\n人脑中的神经元类似于感知机。让我们看看感知器的样子：\n\n### 激活函数\n\
  \n在上一节中，我们看到了感知机的结构。我们说输入、权重以及偏置（bias）之和被传递给激活函数，激活函数对总和进行操作并给出最终输出。\n\n常用的激活函数有四种：\n\
  \n1.  阈值函数（Threshold Function）\n\n\n\n阈值函数将权重和输入点积之和（权重矩阵乘以输入矩阵的积）的值压缩在 0 和 1 之间。如果和小于\
  \ 0，激活函数输出 0。如果和为正数，激活函数返回 1。\n\n#### Sigmoid 函数\n\nSigmoid 函数是阈值函数的平滑版本。如果和大于 0，sigmoid\
  \ 函数并不会精确返回 1，而是返回一个接近 1 的值。如果和小于 0，则返回一个接近 0 的值。sigmoid 函数看起来如下。如果和为 0，sigmoid\
  \ 函数返回的值为 0.5。\n\n![image](img/image053.png)\n\n#### 整流器 (Rectifier)\n\n如果权重和输入点积之和小于\
  \ 0，整流函数返回 0；如果和大于 0，则返回实际值。\n\n#### 双曲正切 (Hyperbolic Tangent)\n\n双曲正切函数类似于 sigmoid\
  \ 函数，但它将值压缩在 1 和 -1 之间，并在输入为 0 时返回 0。当输入为正时，返回 1 到 0 之间的正数；当输入为 0 时（注：此处可能指输入为负），返回\
  \ 0 到 -1 之间的负数。\n\n![image](img/chapter_title_corner_decoration_left.png) ||  ||\
  \ ![image](img/chapter_title_corner_decoration_right.png) |\n\n| --- | --- | ---\
  \ |\n\n![image](img/chapter_title_above.png)\n\n## 多层感知器 (Multilayer Perceptron)\n\
  \n![image](img/chapter_title_below.png)\n\n现在我们知道了什么是感知器什么是激活函数。感知器的作用类似于逻辑回归，它可以找到线性边界。然而，现实世界的数据并不总是线性可分的。在这种情况下，无法使用单个神经元。寻找非线性可分边界的解决方案是使用多个神经元，并将它们以层的形式链起来，如下：\n\
  \n![image](img/image018.png)\n\n多层感知器（图片来自 [texample.net](http://www.texample.net/tikz/examples/neural-network/)）\n\
  \n多层感知器（也称为全连接神经网络）是最简单的神经网络。它包含一个与感知器类似的输入层。然而，它不是直接预测输出，而是涉及一个或多个隐藏层。来自输入层的数据被传递到紧邻的下一个隐藏层，由其传递到下一个隐藏层，依此类推。每个隐藏层由两个或两个节点组成。输入和权重的点积在每个节点处被求和，并通过激活函数。通常，隐藏层中使用的激活函数是整流函数，而在输出层使用的激活函数是\
  \ sigmoid 函数。\n\n如果输出是连续的或二分类的，一个输出节点就足够了。然而，如果输出涉及两个以上的类别，则输出层需要多个节点，每个节点对应一个类别。\n\
  \n![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n## 神经网络如何学习？\n\
  \n![image](img/chapter_title_below.png)\n\n现在我们已经看到了神经网络，下一个问题是“它们是如何学习的？”。神经网络的学习涉及两个阶段：前向传播\
  \ (Feed Forward) 和反向传播 (Back Propagation)。\n\n### 前向传播\n\n前向传播的步骤如下：\n\n1. 输入特征乘以权重，在和上加上偏置，并将结果传递到第一个隐藏层。\n\
  2. 第一个隐藏层的每个节点都包含一个激活函数。激活函数应用于从输入层接收的值。\n3. 每个节点的产生值乘以第二个隐藏层的权重，再次应用激活函数，并将结果传递到下一层。这个过程一直持续到输出层。\n\
  \n### 反向传播\n\n1. 反向传播的第一步是计算输出层预测值与实际输出之间的差异。这个差异被称为损失 (Loss)。用于计算损失的函数称为损失函数或代价函数。损失函数有许多类型，例如交叉熵和均方误差。\n\
  2. 为了最小化该值，我们必须找到函数相对于每个权重的瞬时变化率。这是一个优化问题，可以通过微分来解决。为了这一目的，可以使用梯度下降算法。基本上，在梯度下降算法中，找到代价函数相对于每个权重的偏导数。如果值为正，则从当前值中减去它，否则加上。这种前向传播和反向传播的过程持续到达到可接受的精度。一个包含前向传播和反向传播的循环被称为一个轮次\
  \ (epoch)。\n\n![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n## 结论\n\n\
