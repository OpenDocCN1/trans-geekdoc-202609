  \n为了训练神经网络，我们首先需要调用 `Sequential` 类对象的 `compile` 方法。该方法接受优化函数、损失函数和指标作为参数。我们将使用 ‘adam’\
  \ 优化函数，你也可以使用 ‘sgd’ 进行随机梯度下降。Keras 中可用的不同类型优化器的详细信息可以在此链接找到：[`keras.io/optimizers/`](https://keras.io/optimizers/)\n\
  \n由于我们是分类输出，我们将使用“categorical_crossentropy”函数。如果输出是二分类的，我们需要使用“binary_crossentropy”函数。Keras\
  \ 中可用的所有损失函数的细节可以在此链接找到：[`keras.io/losses/`](https://keras.io/losses/)\n\n我们将使用的性能指标将是\
  \ `accuracy`。执行以下脚本来运行 `compile` 函数：\n\n```python\nann_clf.compile(optimizer='adam',\
  \ loss='categorical_crossentropy', metrics=['accuracy'])\n```\n\n最后，为了开始训练，我们需要调用\
  \ `fit` 方法并传入我们的训练集和测试集。我们还需要传递 `batch_size` 和迭代次数（`epochs`）。对于这个例子，我们只有 1599 条记录，因此\
  \ `batch_size` 设置为 1 是合适的，这意味着权重将在每次观测时进行更新。`epochs` 的数量为 500。你可以尝试调整这些值以观察结果。执行以下脚本：\n\
  \n```python\nann_clf.fit(train_features, train_labels, batch_size=1, epochs = 500)\n\
  ```\n\n一旦执行了上述方法，神经网络将开始运行，在每个 epoch 之后，你将看到如下所示显示的 `accuracy`：\n\n![image](img/image019.png)\n\
