  \ 方法，并如下所示传入我们的测试特征：\n\n```python\npredictions = ann_clf.predict(test_features)\n\
  ```\n\n用于评估的混淆矩阵和准确率方法接受一维数组形式的测试标签和预测标签。然而，我们的测试标签以及预测都是独热编码（one hot encoded）矩阵形式。要将此独热编码矩阵转换为一维输出数组，请执行以下脚本：\n\
  \n```python\npredictions = np.argmax(predictions,axis=1)\ntest_labels = np.argmax(test_labels,axis=1)\n\
  ```\n\n最后，为了在测试集上构建混淆矩阵并计算准确率，我们可以如下所示使用 `sklearn.metrics` 库中的 `confusion_matrix`\
  \ 和 `accuracy_score`：\n\n```python\nfrom sklearn.metrics import classification_report,\
  \ confusion_matrix, accuracy_score\nprint(confusion_matrix(test_labels, predictions))\n\
  print(classification_report(test_labels, predictions))\nprint(accuracy_score(test_labels,\
  \ predictions))\n```\n\n上述脚本的输出如下：\n\n![image](img/image058.png)\n\n在这种情况下，实现的准确率为\
