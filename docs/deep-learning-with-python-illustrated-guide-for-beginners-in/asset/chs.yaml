  \ 1 月初的波动趋势，还正确地预测了 1 月底的股价激增。\n\n## 结论\n\n在本章中，我们通过 Python 的 `Keras` 库实现了一个 `RNN`。通过解决一个预测微软未来股票价格的时间序列分析问题，我们了解了实现\
  \ `RNN` 涉及的各种步骤。在下一章中，我们将看到 `RNN` 在自然语言处理领域的应用。\n\n# 第 10 章\n\n## 使用 RNN (LSTM)\
  \ 进行自然语言处理\n\n在上一章中，我们学习了如何使用循环神经网络（`RNN`）解决时间序列分析问题，例如股票价格预测。在本文，我们将介绍 `RNN`，特别是长短期记忆（`LSTM`）在自然语言处理中的应用。由于文本由句子组成，而句子基本上是单词的序列，`LSTM`\
  \ 可用于各种自然语言处理任务，如情感分析、文本分类、神经机器翻译等。在本章中，我们将看到如何将 `LSTM` 用于文本分类。在下一章中，我们将看到 `LSTM`\
  \ 在神经机器翻译任务中的应用。\n\n### 使用 RNN (LSTM) 进行文本分类\n\n文本分类是一类问题，即给你一个文本字符串（它可以可以是 Facebook\
  \ 或 Twitter 上的用户评论，或者是电子邮件等）。你的任务是将文本归类为预定义的类别之一。例如，对于 Facebook 评论，预定义的类别可以是“正面评论”和“负面评论”。同样，对于电子邮件分类，可能的类别可以是“正常邮件（Ham）”或“垃圾邮件（Spam）”。如果封邮件是真实的，则被视为“正常邮件”。相反，如果邮件不是真实的（例如它祝贺你中了百万美元彩票），它很可能是一封垃圾邮件。\n\
  \n文本分类是一个监督学习问题，系统会给你一组文档以及这些文档所属的类别。你的任务是在这些数据上训练算法，并预测未见文档的类别。文档的长度可以长如整本书或一篇文章，也可以短如一个句子。\n\
  \n之前已经针对文本分类等任务开发了多种机器学习模型。然而，深度学习技术被证明比传统的机器学习技术更成功。特别是 `LSTM` 已证明是文本分类问题的最先进技术。`LSTM`\
  \ 是循环神经网络的一种，我们在第 8 章中详细学习过它。我们在第 9 章中将 `LSTM` 用于时间序列分析。然而，我们没有深入研究 `LSTM` 的架构。在本章中，我们将使用\
  \ `LSTM` 进行文本分类。但在那之前，我们将详细学习 `LSTM` 的架构。\n\n## LSTM 架构\n\n让我们先复习 `RNN` 的架构。`RNN`\
  \ 的基本原理是在时间 `t`，它接收输入 `Xt` 和来自上一个时间 `t-1` 的输出。\n\n注意：本节的图片取自 [Colah 的博客](https://colah.github.io/posts/2015-08-Understanding-LSTMs/)。这是理解\
  \ `LSTM` 的一个非常好的资源。\n\n### RNN 复习\n\n`RNN` 的基础架构如下：\n\n![image](img/image046.png)\n\
  \n这是一个带有一个节点的 `LSTM`。它包含一个由 `Xt` 表示的输入、一个作用于权重点积的激活函数，以及一个被称为 `ht` 的输出。如果你在时间空间中展开这个节点，它看起来如下所示。\n\
  \n![image](img/image008.png)\n\n这里 `x` 是输入，`h` 是输出。让我们从时间 `t=0` 开始。在 `t=0` 时，输入\
  \ `X0` 经过节点并接收输出 `h0`。在时间步 `t=1`，输入 `x1` 以及之前的输出 `h0` 作为输入传递给下一个节点。该过程一直持续到接收最终输出。这种神经网络架构使其成为处理序列问题（如我们在上一章看到的时间序列分析）的理想选择。\n\
  \n反馈机制使 `RNN` 在做出决策时考虑到过去的信息。`RNN` 架构有许多应用，如文本分类、图像描述、语音识别和神经机器翻译。然而，这种简单的 `RNN`\
  \ 架构存在一个问题。\n\n### 简单 RNN 的问题\n\n尽管在理论上 `RNN` 能够保留过去的信息，但在实践中情况并非如此。`RNN` 只能记住最近的信息。它无法记住间隔大量序列步长之后的信息。在某些情况下，这并不是问题。例如，看这句话：“Birds\
  \ fly in the \\___”。我们的 `RNN` 可以很容易地预测下一个单词，即“Sky（天空）”，因为过去的 4 个单词已经足够预测下一个单词。\n\
  \n然而，在需要来自距离当前时间步较远的之前步骤的信息时，`RNN` 的表现似乎并不正确。例如，考虑以下段落。虚线代表任何随机文本。\n\n“我的父亲是一个意大利人。他喜欢吃意大利面和披萨。他看足球...........................................................................................................................................................................................................................并且他说\
  \ \\_\\_\\ ”\n\n现在，如果一个 `RNN` 想预测“speaks（说）”之后的单词，它需要句子开头的信息，即“我的父亲是一个意大利人”。遗憾的是，随着当前时间步与之前时间步之间间隔的增大，由于梯度消失等现象，`RNN`\
  \ 开始忘记之前的信息。这被称为长程依赖问题。\n\n### 解决方案：LSTM\n\n`LSTM`（长短期记忆）神经网络能够保留通过大量时间步学习到的信息，因此可以解决长程依赖问题。自\
  \ [Hochreiter &Schmidhuber (1997)](http://www.bioinf.jku.at/publications/older/2604.pdf)\
  \ 开发以来，目前已经开发了多种 LSTM 的变体。但在本节中，我们将学习其基础版本。\n\n\n\n\n## LSTM 架构\n\n`RNN` 的记忆模块由一层组成。其中一个输入连同上一个输出或隐藏状态被馈入下一个节点。`LSTM`\
  \ 的架构与 `RNN` 的不同在于，除了输出外，它还有一个细胞状态向量（cell state vector），负责维护长期记忆。`LSTM` 的基本架构所示：\n\
  \n![image](img/image045.png)\n\n不要被上述架构吓到，我们将详细查看 `LSTM` 的每一个组件。\n\n### 细胞状态 (Cell\
  \ State)\n\n`LSTM` 的第一个组件是细胞状态。请看下图：\n\n![image](img/image042.png)\n\n细胞状态包含存储来自前几个时间步信息的值。在图中，`Ct-1`\
  \ 是点 `t-1` 处的细胞状态。除了隐藏状态外，过去的细胞状态也会作为输入传递给时间步 `t` 的 `LSTM`。同样，时间 `t` 的细胞状态（即 `Ct`）将作为输入传递给时间\
  \ `t+1` 的 `LSTM`，以此此类推。\n\n然而，我们不需要所有的过去信息。根据输入，我们需要更新过去的信息。为了在细胞状态中删除、添加或修改信息，`LSTM`\
  \ 使用了不同类型的门（gates）。门由神经网络层中的 sigmoid 操作组成，紧接着是逐点乘法（pointwise multiplication）操作。\n\
  \n在 `LSTM` 神经网络节点的每个时间步，都会执行以下操作：\n\n#### 1. 遗忘门 (Forget Gate)\n\n在第一步中，需要遗忘的来自上时间步的信息被传递到细胞状态。执行此操作的门被称为遗忘门。请看下图。这里\
  \ `ft` 指的是遗忘门。\n\n![image](img/image006.png)\n\n在遗忘门中，之前的隐藏状态和当前输入被拼接并通过 sigmoid\
  \ 函数。对于细胞状态中的每个值，sigmoid 函数返回 `1` 或 `0`。在这里，`0` 代表“可以忘记掉这个”，而 `1` 代表“保留此信息”。sigmoid\
  \ 操作的结果与现有的细胞状态进行逐点乘法。\n\n遗忘门的现实例子可以是人的性别。如果来了一个性别不同的新人，我们需要更改所有的代词。遗忘门将帮助我们忘记上一个人的性别。\n\
  \n#### 2. 输入门 (Input Gate)\n\n下一步是找到新信息（如果有，即要存储在细胞状态中的信息）。为了找到需要更新的新信息，需要执行两个操作。第一个操作是确定细胞状态的哪些部分需要更新。这由图中由\
  \ `it` 表示的输入门定义。第二部分是将替换旧值的新值向量，由图中所示的 `C~tas` 表示。\n\n![image](img/image023.png)\n\
  \n这一步的现实例子是：它会发现需要更新性别，而 `C^twill` 的结果产生性别的新值。\n\n#### 3. 更新细胞状态 (Updating the Cell\
  \ State)\n\n现在我们拥有了更新细胞状态所需的所有信息。我们只需要执行第 1 步和第 2 步中得出的操作。第 3 步可以视觉化地表示：\n\n![image](img/image061.png)\n\
  \n（注：原文后续存在大量重复段落，译文已按要求去重并保持逻辑连贯）\n\n\n\n\n你还可以查看序列末的隐藏状态（hidden state）和单元状态（cell\
  \ state）。在这里，你可以再次观察到最后一个时间步的输出等于隐藏状态的值。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ ||  || ![image](img/chapter_title_corner_decoration_right.png) |\n| --- | ---\
  \ | --- |\n\n![image](img/chapter_title_above.png)\n\n## 垃圾邮件与正常邮件分类\n\n![image](img/chapter_title_below.png)\n\
  \n在上一节中，我们详细学习了 `LSTM` 的背后的理论。在本节中，我们将看到 `LSTM` 在正常邮件（ham）和垃圾邮件（spam）分类中的应用。由于 `LSTM`\
  \ 是序列问题的理想选择，因此我们可以将其用于自然语言处理应用，例如文本分类。\n\n该应用程序的数据可以在 `Datasets` 文件夹中找到。数据集文件夹的路径已在介绍部分提到。我们将在示例中使用的数据集是\
  \ `spam.csv`。\n\n我们将遵循标准的机器学习库来完成这项任务。请遵循以下步骤：\n\n### 1. 导入所需的库\n\n第一步是导入此任务所需的库。执行以下脚本来完成：\n\
  \n```python\nimport os\nimport sys\nimport numpy as np\nimport pandas as pd\nimport\
  \ matplotlib.pyplot as plt\nfrom keras.models import Model\nfrom keras.layers import\
  \ Dense, Embedding, Input\nfrom keras.layers import LSTM, Bidirectional, GlobalMaxPool1D,\
  \ Dropout\nfrom keras.preprocessing.text import Tokenizer\nfrom keras.preprocessing.sequence\
  \ import pad_sequences\nfrom keras.optimizers import Adam\nfrom sklearn.metrics\
  \ import roc_auc_score\nfrom sklearn.preprocessing import LabelEncoder\n```\n\n\
  ### 1. 配置设置\n\n让我们为应用程序设置配置。执行以下脚本：\n\n```python\nMAX_SENTENCE_LENGTH = 150\nVOCABULARY_SIZE\
  \ = 2000\nVECTOR_DIM = 100\nTRAIN_TEST_SPLIT = 0.2\nBATCH_SIZE = 64\nEPOCHS = 10\n\
  ```\n\n在这里，`MAX_SENTENCE_LENGTH` 是序列的最大长度。由于我们的句子大小是不固定的，但我们只能向 `LSTM` 输入固定大小的数据，因此我们将对较短的句子进行零填充，使其与语料库中最长的句子相等。\n\
  \n`VOCABULARY_SIZE` 是我们用于创建嵌入层使用的单词数量。`VECTOR_DIM` 是句子中每个单词的特征数。`TRAIN_TEST_SPLIT`\
  \ 定义了训练集和测试集的大小。此值 `0.2` 表示我们的数据将分为 20% 的测试集和 80% 的训练集。我们的批次大小（batch size）为 64，并将进行\
  \ 10 个轮次（epochs）。\n\n### 1. 加载预训练词嵌入\n\n自然语言由文本组成。然而，机器学习算法处理的是数字。因此，我们需要将文本转换为数字。数值格式的表示表示嵌入（embeddings）。\n\
  \n将文本转换为数字有多种方法。我们可以从零开始创建嵌入，也可以使用预训练的词嵌入。在本章中，我们将使用名为 [Glove](https://nlp.stanford.edu/projects/glove/)\
  \ 的预训练词嵌入，它由斯坦福大学的研究人员开发。词嵌入的文本文件可以在数据集文件夹中找到，名为 `glove.6b.100d`。在该文件中，400000 个单词被表示为\
  \ 100 维向量。\n\n接下来，我们需要将这些词向量加载到应用程序中。执行以下脚本来完成。请在执行之前双检查 `glove.6b.100d` 文件的路径。\n\
  \n```python\nprint('Loading Pretrained Word Vectors')\nembedding_dic = {}\nwith\
  \ open(\"E:/Datasets/glove.6b.100d\", encoding=\"utf8\") as vector_list:\n    for\
  \ line in vector_list:\n        dimensions = line.split()\n        word = dimensions[0]\n\
  \        vector = np.asarray(dimensions[1:], dtype='float32')\n        embedding_dic[word]\
  \ = vector\nprint(\"Total Vectors: \" + str(len(embedding_dic)))\n```\n\n### 1.\
  \ 加载数据集\n\n执行以下脚本来加载我们的垃圾邮件数据：\n\n```python\nprint('Read emails')\nemail_data =\
  \ pd.read_csv(\"E:/Datasets/spam.csv\", delimiter=',', encoding='latin1')\nemail_data.head()\n\
  ```\n\n![image](img/chapter_title_above.png)\n\n![image](img/chapter_title_below.png)\n\
  \n第一列包含标签，第二列包含邮件。我们不需要最后三列。让我们执行以下脚本来删除它们：\n\n```python\nemail_data.drop(['Unnamed:\
  \ 2', 'Unnamed: 3', 'Unnamed: 4'], axis=1, inplace=True)\nemail_data.info()\n```\n\
  \n![image](img/image14.png)\n\n### 1. 文本处理\n\n让我们为邮件和标签创建两个独立的变量。\n\n```python\n\
  emails = email_data[\"v2\"]\nlabels = email_data[\"v1\"]\n```\n\n现在我们需要将标签转换为数字。我们将使用\
  \ `LabelEncoder` 来实现。\n\n```python\nle = LabelEncoder()\nlabels = le.fit_transform(labels)\n\
  labels = labels.reshape(-1,1)\n```\n\n执行上述脚本后，你可以看到对应的编码：\n\n![image](img/image13.png)\n\
  \n类似于标签，我们需要对句子进行分词。此时句子已转换为整数，但它们的大小还不相同。为了使句子具有相同的长度，我们使用 `pad_sequences` 类。\n\
  \n```python\ntok = Tokenizer(num_words=VOCABULARY_SIZE)\ntok.fit_on_texts(emails)\n\
  email_sequences = tok.texts_to_sequences(emails)\nemail_sequence_matrix = pad_sequences(email_sequences,\
  \ maxlen=MAX_SENTENCE_LENGTH)\n```\n\n### 1. 创建嵌入矩阵\n\n我们加载了预训练嵌入并将邮件转换为整数。现在是为邮件中的单词创建嵌入了。执行以下脚本：\n\
  \n```python\nword2idx = tok.word_index\nprint('Found %s unique tokens.' % len(word2idx))\n\
  ```\n\n在这里 `word2idx` 基本包含了单词与整数之间的映射。让我们找到词汇表中需要的单词数量。之前我们将此数设置为 2000。然而，如果唯一标记少于\
  \ 2000，我们将词汇表大小设置为唯一标记的数量。以下脚本如下：\n\n```python\ntotal_words = min(VOCABULARY_SIZE,\
  \ len(word2idx) + 1)\n```\n\n然后我们将创建一个大小为 `total_words` x `VECTOR_DIM` 的空嵌入矩阵，如下所示：\n\
  \n```python\nembedding_matrix = np.zeros((total_words, VECTOR_DIM))\n```\n\n最后，我们将用\
  \ 2000 个高频单词的向量填充这个嵌入矩阵，如下：\n\n```python\nfor word, index in word2idx.items():\n\
  \    if index < VOCABULARY_SIZE:\n        vector = embedding_dic.get(word)\n   \
  \     if vector is not None:\n            embedding_matrix[index] = vector\n```\n\
  \n\n\n我们已经完成了训练模型所需的所有预处理工作。现在是实际训练模型的时候。执行以下脚本进行训练：\n\n```python\ninput_ = Input(shape=(MAX_SENTENCE_LENGTH,))\n\
  \nx = embedding_layer(input_)\n\nx = LSTM(20)(x)\n\noutput = Dense(1, activation=\"\
  sigmoid\")(x)\n\nmodel = Model(input_, output)\n\nmodel.compile(\nloss='binary_crossentropy',\n\
  optimizer=Adam(lr=0.01),\nmetrics=['accuracy']\n)\n```\n\n我们的模型中包含一个具有 20 个节点的 `LSTM`。我们还有一个一个全连接层。我们将使用的激活函数是“sigmoid”，而损失函数是“binary_crossentropy”，因为这是一个二分类问题。\n\
  \n现在作为最后一步，让我们在数据上训练模型，并查看算法返回的准确率。执行以下脚本：\n\n```python\nprint('Training model...')\n\
  \nclassifier = model.fit(\nemail_sequence_matrix,\nlabels,\nbatch_size=BATCH_SIZE,\n\
  epochs=EPOCHS,\nvalidation_split = TRAIN_TEST_SPLIT\n)\n```\n\n执行结束后，算法达到了 99.44%\
  \ 的准确率，这非常出色。最终结果所示：\n\n![image](img/image026.png)\n\n最后，让我们绘制算法随每个轮次（epoch）变化的准确率图。执行以下脚本来实现：\n\
  \n```python\nplt.plot(classifier.history['loss'], label='loss')\nplt.plot(classifier.history['val_loss'],\
  \ label='val_loss')\nplt.legend()\nplt.show()\n```\n\n输出如下：\n\n![image](img/image025.png)\n\
  \n你可以看到准确率在第 6 个 epoch 之后收敛。此外，准确率和验证准确率几乎相同，这说明我们的算法没有过拟合。\n\n## 结论\n\n在本章中，我们详细学习了\
  \ `LSTM`。我们看到了 `LSTM` 如何用于自然语言处理。我们使用 `LSTM` 解决了一个简单的文本分类任务，将邮件消息分为正常邮件（ham）和垃圾邮件（spam）。在下一章中，我们将看到\
  \ `LSTM` 在神经机器翻译任务中的应用。我们将开发一个能够回答基础查询的简单聊天机器人。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
