    The \(\Delta\)TOC index is calculated by:


    ```

    \(\Delta TOC = \frac{TOC_{After DG}}{TOC_{Before DG}}\)

    ```


    The TOC before and after the integration of the DG is calculated by the following
    expressions (Imran & Kowsalya, 2014):


    ```

    \(TOC_{Before DG} = K_2 \times P_{Loss}^{Before DG}\)

    ```


    ```

    \(TOC_{After DG} = \left( K_1 \times P_{Loss}^{After DG} \right) + \left( K_2
    \times P_{Loss}^{Before DG} \right)\)

    ```


    # 6.2.2 Equality constraints


    The equality constraints represent the load flow balance equations, which can
    be formulated as (Chang & Chinh, 2020; Dehghani et al., 2020; Elattar & Elsayed,
    2020; Hassan & Zellagui, 2019; Imran & Kowsalya, 2014; Karimizadeh et al., 2020;
    Osama et al., 2020; Yang et al., 2018):


    ```

    \(P_G + P_{DG} = P_D + P_{Loss}\)

    ```


    ```

    \(\mathcal{Q}_G + \mathcal{Q}_{DG} = \mathcal{Q}_D + \mathcal{Q}_{Loss}\)

    ```


    # 6.2.3 Inequality constraints of distribution line


    Inequality constraints represent the power system operating limits, which can
    be given as:


    (a) Bus voltage limits:


    ```

    \(V_{min} \le |V_i| \le V_{max}\)

    ```


    (b) Voltage drop limit:


    ```

    \(|1 - V_i| \le \Delta V_{max}\)

    ```'
