    # 6.1 Introduction


    # 6.1.1 Motivation


    The rapid development of distributed generators (DGs) in different forms and capacities
    is transforming the image of classical planning of electrical distribution systems
    (EDSs). Despite the benefits offered by renewable DG technologies, several economic
    and technical challenges can result from the inappropriate integration of DG into
    the existing EDS. As a result, optimizing DG preparation is critical to ensuring
    that the EDS’s output meets the expected power efficiency, voltage stability,
    power loss reduction, durability, and profitability (Abdmouleh, Gastli, Ben-Brahim,
    Haouari, & Al-Emadi, 2017; Ehsan & Yang, 2018).


    Decentralized power generation from renewable energy sources (REsSs) is a long-term
    solution that addresses the present environmental threats because of its widespread
    availability, sustainability, nonpolluting generation, and eco-friendliness. The
    most widely used renewable DG types are the photovoltaic (PV) and wind turbine
    (WT) systems, where generation is intermittent.


    Because of its universal affordability, reliability, nonpolluting generation,
    and eco-friendliness, decentralized power generation from REsSs is a long-term
    approach that addresses current environmental challenges. PV and WT systems, which
    generate intermittently, are the most commonly used renewable DG forms. DGs are
    a secure and cost-effective way to deliver power to consumers,'
  merge: -1
  img_proc: true
- pgno: 1
  md: 'and they are usually wired either to the distribution network or on the customer''s
    premises. As a result, it is critical to plan and distribute DGs optimally, in
    terms of scale, placement, and form, in order to achieve the expected economic,
    technological, environmental, and regulatory benefits of power systems (Zubo et
    al., 2017).


    # 6.1.2 Literature review


    There are numerous techniques and algorithms to address the optimal DG planning
    problem. In 2017, determination of optimal location of DG using analytical methods
    (AMs) was used for the minimization of active power loss (APL), cost of energy
    losses, and annual investment cost of DG units with a new voltage stability index
    (VSI) (Kazmi & Shin, 2017). These methods include the particle swarm optimization
    (PSO) algorithm for various techno-economic and environmental indices (Tanwar
    & Khatod, 2017), PSO for the maximization of profit and initial investments for
    distribution companies (Kansal, Tyagi, & Kumar, 2017), symbiotic organism search
    (SOS) algorithm to minimize APL (Nguyen-Phuoc, Vo-Ngoc, & Tran-The, 2017), flower
    pollination algorithm (FPA) approach in order to minimize APL and improve the
    bus voltage (Oda, Abdelsalam, Abdel-Wahab, & El-Saadawi, 2017), krill herd algorithm
    (KHA) in order to minimize line losses (Chithra Devi, Lakshminarasimman, & Balamurugan,
    2017), ant lion optimization algorithm (ALOA) to reduce APL and improve voltage
    deviation (VD) and VSI (Ali, Elazim, & Abdelaziz, 2017), and the applied gray
    wolf optimizer (GWO) algorithm for the minimization of active and reactive energy
    indexes (Sultana, Khairuddin, Mokhtar, Qazi, & Sultana, 2017).


    In 2018, a new and effective stochastic fractal search algorithm (SFSA) was applied
    based on three objectives involving APL, VD, and VSI (Nguyen & Ngoc Vo, 2018).
    Ant lion optimization algorithm (ALOA) was proposed for reduction of APL and VD
    (Hadidian-Moghaddam, Arabi-Nowdeh, Bigdeli, & Azizian, 2018), and ALOA for reducing
    APL and consequently maximizing the net saving (Ali, Elazim, & Abdelaziz, 2018).
    A new AM was applied for the optimization of DG-based wind farms (WFs) considering
    the voltage stability of the system and minimizing the cost components of WFs
    (Nikkhah & Rabiee, 2018), grasshopper optimizer algorithm (GOA) to minimize the
    energy VSI (Sultana et al., 2018), population-based incremental learning (PBIL)
    algorithm to reduce APL and VD (Grisales-Noreña, Montoya, & Ramos-Paja, 2018),
    differential learning with biogeography-based optimization (DLBBO) algorithm to
    minimize the APL (Ravindran & Victoire, 2018), dragonfly algorithm (DA) approach
    to reduce the APL-based loss sensitivity factors (LSF) (Suresh & Belwin, 2018),
    a comprehensive teaching-learning-based optimization (CTLBO) technique to minimize
    APL and maximize VSI (Quadri, Bhowmick, & Joshi, 2018), human opinion dynamics
    (HOD) technique to minimize APL and VD (Mahajan & Vadherva, 2018), and moth-flame
    optimization (MFO) algorithm to minimize APL (Tolba, Diab, Tulsky, & Abdelaziz,
    2018).'
