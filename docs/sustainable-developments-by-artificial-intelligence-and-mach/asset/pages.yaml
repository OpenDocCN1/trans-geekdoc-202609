    The first test system is a standard IEEE 33-bus system and composed of 33 buses,
    32 distribution lines with an active power load of 3715kW, and reactive power
    load of 2300kVar with nominal voltage of 12.66kV, as represented in Fig. 6.2B.
    The second test system is a standard IEEE 69-bus system, which is composed of
    69 buses, 68 distribution lines with active power load of 3791.89kW, and reactive
    power load of 2694.10kVar with nominal voltage of 12.66kV, as shown Fig. 6.2C.
    To illustrate the applicability of the proposed algorithm in large-scale distribution
    systems, it is applied on the standard IEEE 118-bus system, which is composed
    of 118 buses with active power load of 22.71 MW and reactive power load of 17.04MVar,
    as shown Fig. 6.2C. The nominal voltage is 12.66kV for all test systems.


    The convergence optimization characteristics of the proposed CAWOA algorithm for
    the three considered IEEE distributions systems in the presence of PV-DG and WT-DG
    are presented in Fig. 6.3.


    From the figure, when installing PV-DG, the IEEE 33-bus system takes almost 50
    iterations to achieve the optimal solution, whereas the IEEE 69-bus system obtains
    the optimal solution by iteration 170, and the larger systems IEEE 118-bus, takes
    a long time to achieve the optimal solution—more than 170 iterations—but for the
    three systems, a quick convergence in the first iterations can be observed.'
