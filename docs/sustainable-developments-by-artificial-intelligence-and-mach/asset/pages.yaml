    derive the WOA mathematical model. Modeling steps are detailed in the following
    subsections (Elaziz & Mirjalili, 2019; Mirjalili & Andrew, 2016). Fig. 6.1 represent
    the exploration mechanism implemented in basic WOA. This enhancement strategy
    can modify spiral and circular movements, depending on the measure of _p_ (Elaziz
    & Mirjalili, 2019).


    In the basic WOA approach, the movement between exploration and exploitation phase
    occurs with a decrease of distance control parameter "_a_" linearly from 2 to
    0. The cosine adapted WOA (CAWOA) approach employs the cosine function to tune
    the parameter "_a_" of the WOA for varying exploration and exploitation combinations
    over the course of iterations (Eid & Abraham, 2018). The CAWOA approach employs
    a cosine function instead of the linear function for the decay of the parameter
    "_a_" over the course of iterations; as given in Eq. (6.22). The use of a cosine
    feature for decaying "_a_" result in a differing exploration and exploitation
    combination (Saha & Panda, 2020). The pseudo code of the CAWOA technique is presented
    in Algorithm 6.1.


