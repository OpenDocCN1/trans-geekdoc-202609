    # 6.2 Problem formulation


    # 6.2.1 Multiobjective function


    In this chapter, the authors proposed a multiobjective function (MOF) for the
    EDS and represented by the following equations:


    ```

    $$MOF = \min \sum_{i=1}^{Nbus} \sum_{j=2}^{Nbus} \alpha_1 \cdot \Delta APL_{ij}
    + \alpha_2 \cdot \Delta TVV_i + \alpha_3 \cdot \Delta TOC_{ij}$$ (6.1)

    ```


    ```

    $$\sum_{m=1}^{3} \alpha_m = |\alpha_1| + |\alpha_2| + |\alpha_3| = 1$$ (6.2)

    ```


    In this chapter, $\alpha_1$ is taken as 0.5, while $\alpha_2$ and $\alpha_3$ are
    taken as 0.25, based on the practical, technical, and economic indicators. The
    three indices are presented by:


    ```

    $$\Delta APL = \frac{P_{Loss}^{After DG}}{P_{Loss}^{Before DG}}$$ (6.3)

    ```


    and:


    ```

    $$P_{Loss} = \sum_{i=1}^{Nbus} \sum_{j=2}^{Nbus} R_{ij} \frac{(P_{ij}^2 + Q_{ij}^2)}{V_i^2}$$
    (6.4)

    ```'
