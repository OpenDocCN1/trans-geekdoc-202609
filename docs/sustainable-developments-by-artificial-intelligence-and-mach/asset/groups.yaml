    | 符号 | 描述 |

    | --- | --- |

    | $V_1$ | 发电站处的电压等于 1.0 p.u. |

    | $V_{min}, V_{max}$ | 限定指定电压 |

    | $\Delta V_{max}$ | 最大电压跌落 |


    ## CAWOA 算法参数


    - A 和 C 系数向量

    - a 控制参数

    - b 表示对数螺旋状态的常数

    - D 第 i 条鲸鱼与猎物之间的距离

    - D'' 确定鲸鱼 i 到猎物的位置或距离

    - l 范围 -1 到 1 之间的任意数

    - p 范围在 0 到 1 之间的任意数

    - r 区间 0 到 1 内的随机向量

    - t 表示当前迭代

    - $t_{max}$ 最大迭代次数

    - X 位置向量

    - X* 迄今获得的最佳解的位置向量

    - $X_{rand}$ 任意位置向量（一条随机鲸鱼）


