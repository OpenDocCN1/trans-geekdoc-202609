    It is observed that the WT-DG installation contributes to more minimization of
    the power losses than the installation of PV-DG. These results are due to the
    contribution of the reactive power injected from WT-DG, and also the optimal power
    factors defined by the proposed algorithm. As mentioned above in Table 6.3, the
    power factors are set between 0.8 and 0.9 (lagging).


    Fig. 6.6 demonstrates the influence of DG installation on the bus voltage deviations
    of the three test systems. In general, the installation of the two types of DGs,
    i.e., PV-DG and WT-DG, will reduce the voltage deviation in all the buses. However,
    from the voltage variation curve, it can be recognized that the active and reactive
    powers injected from the integration of WT-DGs into the tested systems are more
    effective in minimizing the voltage deviations. Moreover, it can be noted that
    WT-DGs provide more improvement than PV-DGs in terms of system voltage level.


