    # 6.2.2 Equality constraints


    The equality constraints represent the load flow balance equations, which can
    be formulated as (Chang & Chinh, 2020; Dehghani et al., 2020; Elattar & Elsayed,
    2020; Hassan & Zellagui, 2019; Imran & Kowsalya, 2014; Karimizadeh et al., 2020;
