    ## 6.5 Conclusions


    In this chapter, the CAWOA algorithm has been proposed to solve the techno-economic
    analysis problem of optimal location and sizing of renewable DG in the EDSs. Thus,
    a multiobjectives function has been used for the optimal integration of PV-DG
    and WT-DG sources with the optimum power factors. The optimal power factors obtained
    by the proposed algorithms show a positive and clear effect on power losses and
    bus voltages, unlike many techniques posed in the literature, which suggest a
    predefined power factor. In general, the best results are obtained by installing
    the WT-DGs.


    In this study, the proposed algorithm is applied to minimize the active power
    losses index, voltage variation index, and the total operation cost index subject
    to the quality and inequality constraints within a predefined tolerance to avoid
    violation of these constraints. The active and reactive branch currents are calculated,
    and the results show that the currents are minimized after the installation of
    DGs and the profile of the current has greater reduction thru the presence of
    WT-DGs. Careful and realistic results have been attained by a linear change in
    loads; the loadability results show that the total power losses and the voltage
    profiles are proportional with the increasing or decreasing of loads.


    To show the performance of the proposed algorithms, the obtained results have
    been compared with other existing results of algorithms from the literature. The
    comparative study shows that CAWOA is better than the compared algorithms in terms
    of minimizing the power losses of the studied systems; furthermore, it performs
    well and obtains better results considering the same number of DGs installed in
    the systems. In general, the results show that CAWOA can handle this type of proposed
    objective function.


    This research work gives guidelines and hints for power distribution companies
    to reducing power losses. This work will also help the power distribution companies
    in incorporating small-sized renewable energy sources to distribution networks
    easily and more reliably.


