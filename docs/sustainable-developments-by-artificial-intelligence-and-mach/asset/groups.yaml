    ## 6.5 结论


    本章提出了 CAWOA 算法，用于求解 EDSs 中可再生能源分布式发电机（DG）最优选址与容量的技术经济分析问题。因此，采用了多目标函数，用于在最优功率因数下实现
    PV-DG 和 WT-DG 源的最优集成。所提算法得到的最优功率因数对功率损耗和节点电压具有积极且明显的影响，这与文献中许多提出预定义功率因数的技术不同。总体而言，安装
    WT-DG 可获得最佳效果。


    本研究中，所提算法被应用于在预定义容差范围内，在等式和不等式约束条件下，最小化有功功率损耗指数、电压变化指数和总运行成本指数，以避免违反这些约束。计算了有功和无功支路电流，结果表明，安装
    DG 后电流最小化，且电流剖面在 WT-DG 的存在下减少更多。通过负载的线性变化，得到了审慎且真实的结果；负载能力结果表明，总功率损耗和电压剖面随负载的增加或减少成正比。


    为了展示所提算法的性能，将所得结果与文献中其他现有算法结果进行了比较。比较研究表明，CAWOA 在最小化所研究系统功率损耗方面优于所比较的算法；此外，在系统中安装相同数量的
    DG 情况下，其表现良好并获得更好的结果。总体而言，结果表明 CAWOA 可以处理此类拟议的目标函数。


    本研究工作为配电公司降低功率损耗提供了指导和建议。该工作还将帮助配电公司更轻松、更可靠地将小型可再生能源纳入配电网络。


