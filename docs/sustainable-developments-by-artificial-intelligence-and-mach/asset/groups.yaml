    ## 基于技术和经济指标的电气配电系统中可再生能源的最优分配


    Mohamed Zellaguiᵃᵇ, Samir Settoulᶜ, and Heba Ahmed Hassanᵈ


    ᵃ魁北克大学电气工程系，蒙特利尔，QC，加拿大，ᵇ巴特纳2大学电气工程系，巴特纳，阿尔及利亚，ᶜ康斯坦丁1门图里大学电工技术系，康斯坦丁，阿尔及利亚，ᵈ开罗大学电力工程系，吉萨，埃及


    ## 6.1 简介


    ### 6.1.1 动机


    分布式发电机（DGs）以不同形式和容量迅速发展，正在改变电气配电系统（EDSs）经典规划的面貌。尽管可再生能源DG技术带来了诸多好处，但DG与现有EDS不当集成可能导致多种经济和技术挑战。因此，优化DG规划对于确保EDS的输出满足预期的电力效率、电压稳定性、功率损耗降低、耐用性和盈利能力至关重要（Abdmouleh,
    Gastli, Ben-Brahim, Haouari, & Al-Emadi, 2017; Ehsan & Yang, 2018）。


    基于可再生能源（RESs）的分布式电力生产是解决当前环境威胁的长期方案，因为其广泛可用性、可持续性、无污染发电和环境友好性。最广泛使用的可再生能源DG类型是光伏（PV）和风力涡轮机（WT）系统，其中发电具有间歇性。


    由于其普遍的经济性、可靠性、无污染发电和环境友好性，基于RESs的分布式电力生产是应对当前环境挑战的长期方法。PV和WT系统具有间歇性发电特点，是最常用的可再生能源DG形式。DG是向消费者供电的安全且经济有效的方式，通常连接到配电网络或客户场所。因此，从规模、位置和形式方面对DG进行最优规划和分布至关重要，以实现电力系统预期的经济、技术、环境和监管效益（Zubo
    et al., 2017）。


    ### 6.1.2 文献综述


    有大量技术和算法用于解决最优DG规划问题。2017年，利用解析方法（AMs）确定DG的最优位置，用于最小化有功功率损耗（APL）、能量损耗成本和DG单元年度投资成本，并引入新的电压稳定性指数（VSI）（Kazmi
    & Shin, 2017）。这些方法包括用于各种技术经济和环境指标的粒子群优化（PSO）算法（Tanwar & Khatod, 2017）、用于配电公司利润和初始投资最大化的PSO（Kansal,
    Tyagi, & Kumar, 2017）、用于最小化APL的共生生物搜索（SOS）算法（Nguyen-Phuoc, Vo-Ngoc, & Tran-The,
    2017）、用于最小化APL并改善母线电压的花粉传播算法（FPA）方法（Oda, Abdelsalam, Abdel-Wahab, & El-Saadawi,
    2017）、用于最小化线路损耗的磷虾群算法（KHA）（Chithra Devi, Lakshminarasimman, & Balamurugan, 2017）、用于减少APL并改善电压偏差（VD）和VSI的蚁狮优化算法（ALOA）（Ali,
    Elazim, & Abdelaziz, 2017）、以及用于最小化有功和无功能量指数的应用灰狼优化器（GWO）算法（Sultana, Khairuddin,
    Mokhtar, Qazi, & Sultana, 2017）。


    2018年，基于APL、VD和VSI三个目标，应用了一种新的有效随机分形搜索算法（SFSA）（Nguyen & Ngoc Vo, 2018）。提出了蚁狮优化算法（ALOA）用于减少APL和VD（Hadidian-Moghaddam,
    Arabi-Nowdeh, Bigdeli, & Azizian, 2018），并采用ALOA减少APL从而最大化净节约（Ali, Elazim, & Abdelaziz,
    2018）。采用了一种新的解析方法（AM）对基于DG的风力发电场（WFs）进行优化，考虑系统电压稳定性并最小化WFs的成本组件（Nikkhah & Rabiee,
    2018）、用于最小化能量VSI的蚱蜢优化算法（GOA）（Sultana et al., 2018）、用于减少APL和VD的基于种群的增量学习（PBIL）算法（Grisales-Noreña,
    Montoya, & Ramos-Paja, 2018）、用于最小化APL的基于生物地理学优化的差分学习（DLBBO）算法（Ravindran & Victoire,
    2018）、用于减少基于APL的损耗敏感因子（LSF）的蜻蜓算法（DA）方法（Suresh & Belwin, 2018）、用于最小化APL并最大化VSI的综合教学-学习优化（CTLBO）技术（Quadri,
    Bhowmick, & Joshi, 2018）、用于最小化APL和VD的人类舆论动态（HOD）技术（Mahajan & Vadherva, 2018）以及用于最小化APL的飞蛾火焰优化（MFO）算法（Tolba,
    Diab, Tulsky, & Abdelaziz, 2018）。


    2019年，混沌差分进化（CDE）技术被应用于最小化包括年度经济损失、维护成本和APL在内的各种目标（Kumar, Mandal, & Chakraborty,
    2019a）。采用了基于对抗的调谐混沌差分进化（OTCDE）技术，考虑成本指数、电压偏差指数和线路潮流容量指数（Kumar, Mandal, & Chakraborty,
    2019b），并采用大象群优化（EHO）算法减少所有母线的APL和无功功率损耗（QPL）（Prasad, Subbaramaiah, & Sujatha,
    2019）。将离散-连续超球面搜索（DC-HSS）算法应用于带有软开放点和DG的EDS中以最小化APL（Diaeldin, Abdel Aleem, El-Rafei,
    Abdelaziz, & Zobaa, 2019），采用蜘蛛猴优化（SMO）算法最小化电压偏差（Deb, Chakraborty, & Deb, 2019），应用启发量矩匹配（HMM）技术用于最小化APL和VD的多目标指数（Ehsan,
    Cheng, & Yang, 2019），采用飞蛾火焰优化（MFO）算法在实际阿尔及利亚EDS中减少APL和增强VSI（Settoul, Zellagui,
    Abdelaziz, & Chenni, 2019），并采用MFO算法最小化ALP（Settoul, Chenni, Hassan, Zellagui, &
    Kraimia, 2019）。生物地理学优化（BBO）算法被应用于在保持电压谐波畸变在限值内的同时降低APL（Duong, Pham, Nguyen, Doan,
    & Tran, 2019）、用于最小化APL的统一粒子群优化（UPSO）（Gkaidatzis et al., 2019）以及将APL最小化作为目标的混合PSO算法（Yaprakdal,
    Baysal, & Anvari-Moghaddam, 2019）。


    最近，在2020年，改进的哈里斯鹰优化（HHO）算法被用于最小化APL、减少VD和增加VSI（Selim, Kamel, Alghamdi, & Jurado,
    2020），改进的分布估计算法（IEDA）用于最小化APL（Yang, Yang, Wu, & Liu, 2018），修正的飞蛾火焰优化（MMFO）算法用于最小化总运行成本、APL、VD和污染排放（Elattar
    & Elsayed, 2020），回溯搜索优化（BTSO）算法用于最小化线路中的有功和无功功率流并最大化微电网成功指标（Osama, Zobaa, & Abdelaziz,
    2020）、基于博弈论策略的疯狂PSO（CRPSO）算法用于最小化购电成本和APL（Karimizadeh, Soleymani, & Faghihi, 2020）、考虑APL以及不同负载水平下电压调节器分接变化的郊狼优化算法（COA）（Chang
    & Chinh, 2020），并应用弹簧搜索算法（SSA）来最小化排放、VD、APL和能源成本（Dehghani, Montazeri, & Malik,
    2020）。


    ### 6.1.3 贡献与章节组织


    本章提出了一种基于修正WOA方法（称为余弦自适应WOA算法，CAWOA）的新方法，用于电力系统中基于RES的DG的最优集成，以实现技术经济效益。本研究的主要贡献和结论总结如下：


    - 使用CAWOA技术对各种基于DG的RES（太阳能光伏PV-DG和风能WT-DG）进行最优集成。

    - 将CAWOA方法应用于标准IEEE 33节、69节和118节EDS。

    - 最优集成已被选择以最小化各种技术和经济指标：测试系统的总APL、TVV和TOC。

    - 通过与现有优化技术进行比较，验证了所提算法的有效性。

    - 本章研究了不同类型的DG对配电线路中有功和无功支路电流的影响。

    - 它研究了在60%至120%之间变化的不同负载率下电压剖面和功率损耗的影响，以反映负载不确定性。


    本章包含五个部分及参考文献列表，组织如下：第6.2节介绍数学问题表述；第6.3节介绍所应用的CAWOA算法；第6.4节提供仿真结果、讨论及结果比较；第6.5节介绍结论。


    ## 6.2 问题表述


    ### 6.2.1 多目标函数


    在本章中，作者针对EDS提出了一种多目标函数（MOF），并由以下等式表示：


    $$MOF = \min \sum_{i=1}^{Nbus} \sum_{j=2}^{Nbus} \alpha_1 \cdot \Delta APL_{ij}
    + \alpha_2 \cdot \Delta TVV_i + \alpha_3 \cdot \Delta TOC_{ij}$$ (6.1)


    $$\sum_{m=1}^{3} \alpha_m = |\alpha_1| + |\alpha_2| + |\alpha_3| = 1$$ (6.2)


    在本章中，$\alpha_1$ 取为0.5，而$\alpha_2$和$\alpha_3$取为0.25，这是基于实践、技术和经济指标。三个指标由以下公式表示：


    $$\Delta APL = \frac{P_{Loss}^{After DG}}{P_{Loss}^{Before DG}}$$ (6.3)


    and:


    $$P_{Loss} = \sum_{i=1}^{Nbus} \sum_{j=2}^{Nbus} R_{ij} \frac{(P_{ij}^2 + Q_{ij}^2)}{V_i^2}$$
    (6.4)


