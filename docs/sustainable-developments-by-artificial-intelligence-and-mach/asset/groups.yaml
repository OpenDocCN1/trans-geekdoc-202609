    From this analysis, it is interesting to note that there is a significant improvement
    after the installation of DGs in terms of the minimization of the power losses,
    the enhancement of voltage profile, and also the minimization of the operating
    cost of the tested systems, but the main observation is that the contribution
    of WT-DG is higher than PV-DGs. This is related not just to the optimal reactive
    power defined by the proposed algorithm, but also to the optimal lagging power
    factors attained by the algorithm, which leads to the optimal choice of the active
    and reactive powers being injected by the WT-DGs installed in their optimal places.


    Fig. 6.4 shows the bus voltage profiles for different case studies performed for
    all distribution systems. The voltage profiles have improved across the tested
    power systems after the installation of DGs units. It can be seen that for different
    voltage profiles for each type of DG unit, the effect of the optimal factor obtained
    by the proposed algorithm allows the WT-DGs to maintain a better improvement to
    the voltage profiles and make them almost flat.


