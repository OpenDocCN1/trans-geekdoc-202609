  \ 6.5.** 提取特征和 ML 算法的结果 – BERT 上\n\n\n\n\n\n| **提取的特征** | **BERT NN** |\n| :---\
  \ | :--- |\n| **Acc (准确率)** | **F1** |\n| **BERT** | 训练 | 0.70 | 0.82 |\n| 测试 |\
  \ 0.96 | 0.98 |\n\n接下来的混淆矩阵说明了这一结果。在共 6,084 个样本中，“低风险”的预测为 5,888 个 (97%)，而“高风险”仅为\
  \ 196 个。因此，任何给定算法的准确率往往非常高，但其他指标却非常低。\n\n**表 6.6.** *混淆矩阵*\n\n| | **真实类别** |\n|\
  \ :--- | :--- |\n| | **低风险** | **高风险** |\n| **预测类别** | 低风险 | TP = 4714 | FP = 1174\
  \ |\n| 高风险 | FN = 145 | TN = 51 |\n\n训练集和测试集指标之间的主要差异揭示了经典机器学习算法的过拟合问题。随机森林技术对 TF-IDF\
  \ 实现了“完美”分类（准确率、精确率、召回率和 F1 分数均为 100%）。然而，当应用于测试集时，并没有产生类似的指标。为了防止这种过拟合，可以对算法参数进行修改，或者使用不同的测试方法。\n\
  \n我们已经证明，经典机器学习模型结合不同的经典词嵌入并不是自动识别内部审计文件中可能存在潜在风险特定章节的最佳选择。然而，当使用深度学习（DL）模型结合高级词嵌入时，观察到了显著改进。使用高级词嵌入\
  \ `FastText` 和 `GloVe` 训练 `CNN`、`LSTM` 和 `BERT` 等深度模型产生了更好的结果，且没有出现过拟合问题。我们在训练集中获得了更好的结果，在测试集中也获得了非常相似的结果，而无需考虑偏差和方差。显而易见，`CNN`\
  \ 和 `LSTM` 的表现均比 `BERT` 和其他算法异常出色。选择使用 `CNN` 还是 `LSTM` 取决于算法的速度。在我们的实验中，我们发现 `LSTM`\
  \ 明显比 `CNN` 快，但这很大程度上取决于所构建的深度学习模型的架构。对于本章介绍的架构，我们发现 `LSTM` 更好。但注意的是，当使用 `FastText`\
  \ 作为词嵌入时，`CNN` 和 `LSTM` 的训练速度都快得多。\n\n## 6.4. 结论与未来工作\n\n结果表明，可以使用机器学习算法来识别审计发现可能构成的风险水平。最佳模型可用于外部报告自动分类，以支持持续审计或年度规划中审计对象的选择。\n\
  \n事实证明，对于这类文本分类，深度学习模型比经典机器学习技术更合适。这些结果得到了 `Young et al.` (2017) 和 `Yin et al.`\
  \ (2017) 相似工作的证实。然而，我们证明了当使用 `GloVe` 和 `FastText` 等近期发布的高级词嵌入时，模型的准确率和 F1 分数显著更好。此外，所使用的经典机器学习方法无法建立良好的分类模型。相反，深度学习模型产生了令人深刻的指标。`CNN`\
  \ 和 `LSTM` 之间的差异在统计上并不显著。因此，在实际应用中，取决于使用讨论的哪种深度学习方法。\n\n## 6.5. 参考文献\n\n- Albashravi,\
