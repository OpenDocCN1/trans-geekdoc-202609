  \ 8.3 数据准备\n\n在本节中，我们将描述用于清理和准备数据的所有技术。\n\n### 8.3.1 数据清洗\n\n由于 NSL-KDD 数据集已经是旧\
  \ KDD '99 CUP 数据集的增强版本，不需要额外的清理：该集合已经清除了冗余数据和空值（Dhanabal and Shanthajah 2015）。\n\
  \n正常和异常条目的比例对于机器学习也是有利。\n\n在这一步（加载 arff 文件并对字符串进行 UTF-8 编码后），唯一的清理操作是删除 `num_outbound_commands`\
  \ 列，该列全为“0”。\n\n### 8.3.2 分类列编码\n\n清洗数据集后，第二步是将所有分类列转换为热编码（one-hot encoded）列。这意味着对于每个分类列的每个不同值，都会生成一个新列，属于该类别的行包含“1”，其他行包含“0”。\n\
  \n这种编码是准备 ANN 学习数据时最流行的选择（Potdar et al. 2017）。这样做是为了防止算法将类别解释为数字，这可能会导致算法认为某个类别是其他两个类别的平均值，这显然不是我们想要的。受影响的列包括：\n\
  \n* service;\n* protocol type;\n* super-user attempted;\n* flag;\n* wrong fragment;\n\
  * urgent.\n\n编码后产生的数据集包含 130 列，其中一列是目标列。\n\n注意二分类列不受编码影响。这是为了避免冗余列，因为二进制特征会产生两个对应的编码列，通过观察其中一个就可以推导出另一个。添加此类列只会增加数据集的噪声和大小，而不会为\
  \ ANN 添加有用信息。\n\n### 8.3.3 归一化\n\n对分类列编码后，现在必须对数值列进行处理。\n\n\n\n连续特征已经用 0 到 1 之间的数字表示，因此它们具有相同的量级。另一方面，离散列（描述如交换的字节数和各种计数器等特征）包含不同量级的正整数。\n\
  \n在这些列上，我们应用了归一化函数，主要有两个原因：\n\n*   为了将所有特征缩减到相同的量级：在分析分类问题中的特定实例时，我们并不关乎特征中所包含的绝对值，而是想知道这个值*相对于其他值*意味着什么。这避免了神经网络可能会给更大的数字分配更多权重的可能性。\n\
  *   为了减小离群值的影响：数据集中的某些记录数据包含极端值，例如非常长的数据包或非常长的连接。这些极端值代表特殊情况，但另一方面，我们希望我们的人工神经网络（ANN）主要识别最常见的情况。\n\
  \n出于这个原因，我们决定使用 `scikit-learn` 的 `Normalizer`^(2，它可以重新缩放每个样本的向量使其具有单位范数，且不受样本分布的影响。归一化过程完成如下：\n\
  \n*   在训练集上拟合模型；\n*   转换训练集；\n*   转换测试集（使用相同的归一化模型）。\n\n图 8.16 显示了归一化后训练集中数值结果的分布，而\
  \ 图 8.17 阐了应用于测试集的相同变换。\n\n![图 8.16. 归一化训练集中每个数值特征取值的分布](img/img8-16.jpg)\n\n**图\
  \ 8.16.** *归一化训练集中每个数值特征取值的分布*\n\n![图 8.17. 归一化测试集中每个数值特征取值的分布](img/img8-17.jpg)\n\
  \n**图 8.17.** *归一化测试集中每个数值特征取值的分布*\n\n作为该缩放器行为的示例，图 8.18–8.21 显示了两个特征在归一化前后的值分布。\n\
