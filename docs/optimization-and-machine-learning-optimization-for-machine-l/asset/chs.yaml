  \ of Metaheuristics*, 2, 415–433.\n\n# 3 基于群体元启发式算法解决特征选择问题\n\n**Mohamed SASSI**\n\
  \n法国宪兵队 PJGN IT 总监\n\n机器学习分类器需要大量数据来完成训练、验证和测试阶段。这些数据通常是高维的。然而，维度越高，由于大量无关和相关数据以及噪声，分类器的性能越差，更不用说维度灾咒了。这对机器学习算法是有害的：过拟合、高复杂度、高计算成本和精度低下。由此得出结论，为了获得更好的性能，必须实施高效的特征选择。然而，特征选择也是一个优化问题。因此，自然启发和基于群体的元启发算法，例如灰狼优化（GWO）算法，是解决该问题的最佳解决方案之一。本章将循序渐进地演示\
  \ `GWO` 在 `KNN`（k 最近邻）分类器特征选择中的应用，与 `GA` 和 `PSO` 元启发式算法相比，具有非常有竞争力的结果。\n\n\n\n\n\
  \n21 世纪以来，无论在哪个专业领域：法医学、医学、气象学、金融、天体物理、农学等，数据量都呈指数级增长。这种海量数据导致即使是最复杂的机器学习算法也会出现错误。\n\
  \n然而，得益于特征选择算法，这种观测结果并不意味着灾难。这些算法提取包含最有意义信息的数据子集。尽管如此，特征选择仍然是一个 NP 困难型多目标优化问题（Fong\
  \ *et al.* 2014; Siarry 2014; Hodashinsky and Sarin 2019）。该领域的大量研究表明，与其它优化算法（如确定性方法）相比，元启发式算法在解决这些问题上具有优越性（Sharma\
  \ and Kaur 2021）。基于种群的群智能元启发式算法已被证明在该领域是有效的。\n\n遗憾的是，我们发现很少有专门研究元启发式算法的书章节，而且这些章节并没有描述用于特征选择的元启发式算法的操作。元启发式算法是这些数据处理步骤的强大工具。\n\
  \n在本章中，我们并不创建一个新的元启发式算法。我们的贡献是以一种教育的方式，解释在连续研究空间中将现代元启发式算法应用于特征选择的所有步骤。为了实现这一点，我们参考了\
  \ Mirjalili 和 Emary 的工作（Mirjalili *et al.* 2014; Emary *et al.* 2016）。\n\n本章分为八部分，如下：第\
  \ 3.2 节 介绍了来自 GWO 算法自然性的灵感。第 3.3 节 建立了一个用于连续搜索空间优化的 GWO 数学模型。第 3.4 节 使我们能够同同特征选择的理论基础。第\
  \ 3.5 节 讨论了二值离散搜索空间中优化的数学建模。第 3.6 节 提供了二值化模块，使得连续元启发式算法能够在二值搜索空间中解决特征选择问题。第 3.7\
  \ 节 是本章的核心，因为它使用了第 3.6 节的二值化模块来创建二值元启发式算法 bGWO。第 3.8 节 将通过实验证明 bGWO 在 UCI 参考数据集的\
  \ 18 个数据集上解决特征选择问题的性能。\n\n## 3.2. 算法灵感\n\n灰狼属于犬科（*Canis lupus*，Canidae）。几个世纪以来，自大约两百万年前出现以来，狼已经开发并完善了它们的狩猎技术。它们在多个大陆的生存证明了这种狩猎技术对于寻找最佳猎物是最优的；因此它启发了\
  \ GWO 算法，该算法基于狼群的分级组织以及狩猎的四个阶段。\n\n### 3.2.1. 狼群等级\n\n狼群的核心在于其等级制度，分为四个群体：Alpha、Beta、Delta\
  \ 和 Omega（图 3.1）。\n\n![图 3.1. 狼群等级](img/img3-1.jpg)\n\n图 3.1. 狼群等级\n\n### 3.2.1.1.\
  \ Alpha 狼\n\nAlpha 狼与一只 Alpha 雌配配。它们统领狼群，并负责防御。\n\n### 3.2.1.2. Beta 狼\n\nBeta 狼协助\
  \ Alpha。它们在日常工作中协助 Alpha。\n\n### 3.2.1.3. Delta 狼\n\nDelta 狼的等级低于 Beta 狼。像 Beta\
  \ 一样，它们协助 Alpha 工作。\n\n### 3.2.1.4. Omega 狼\n\nOmega 狼处于狼群的底层。它们服从 Alpha、Beta 和\
  \ Delta。这种等级制度是狼群狩猎的关键。\n\n### 3.2.2. 狩猎的四个阶段\n\n狼群通过四个阶段进行狩猎，如图 3.2 所示：\n\n1. 搜索；\n\
  2. 追逐；\n3. 围猎直至困住；\n4. 攻击。\n\n狼群的等级和这四个阶段构成了 GWO 技术的支柱。在下一节中进行数学建模。\n\n![图 3.2.\
  \ 搜索、追逐、围猎和攻击](img/img3-2.jpg)\n\n图 3.2. 搜索、追逐、围猎和攻击\n\n## 3.3. 数学建模\n\n### 3.3.1.\
