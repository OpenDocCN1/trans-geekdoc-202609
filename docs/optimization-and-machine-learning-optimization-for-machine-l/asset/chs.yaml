  \n此外，雾云计算会在运行科学工作流和 IoT 工作流时影响完成时间。\n\n## 2.7. 结论\n\n在本章中，我们介绍了一种基于 MAS-GA 的雾云计算环境下的\
  \ IoT 工作流调度方法。提出了一种 IoT 工作流调度，旨在基于广泛使用的遗传算法（GA）元启发式算法创建一个多目标调度方案。我们通过在 WorkflowSim\
  \ 仿真器上的各种实验场景，测试并验证了该方法在执行真实用例 IoT 工作流时，在完成时间、成本和延迟方面创建最优 IoT 工作流调度方案的有效性。实验结果表明，雾云计算中基于\
  \ MAS-GA 的 IoT 工作流调度方法能够在最大化雾资源中工作流任务数量的同时，生成一个优化成本和延迟值的调度方案。未来的工作将扩展所提模型，使其包含一种代理协商机制，这可能有助于实现一个同时满足消费者和资源提供者的调度方案。\n\
