  \n## 5.4 实验设置\n\n本节简要回顾实验使用的数据集、评估标准和替代技术。\n\n### 5.4.1. *数据集*\n\n*MovieLens 数据集*：它提供了\
  \ MovieLens 网站用户对不同电影的真实的带时间戳的五星评分。此外，GroupLens 还提供了带有基因标签的电影，以机器于处理的方式对其进行描述。该数据集有多个版本，由文件中封装的评分总数表示（Harper\
  \ *et al*. 2015）。它们是：\n\n*   – *MovieLens 25M*：这个巨大的数据集提供了 2500 万条评分，适用于 162,000\
  \ 名用户对 62,000 部电影的评分。它于 2019 年 12 月发布。\n\n*   – *MovieLens 20M*：前一个版本的先驱，提供了 138,000\
  \ 名用户对 27,000 部电影的 2000 万条评分。它首次于 2015 年 4 月发布，最后更新于 2016 年 10 月。从那时起就停止了支持。\n\n\
  *   – *MovieLens 10M*：这是一个相当老的数据集，日期为 2009 年 2 月。它提供了 72,000 名用户对 10,000 部电影的 1000\
  \ 万条评分。一个交互注意力网络 137\n\n*   – *MovieLens 1M*：这是最流行的 MovieLens 数据集版本。它被广泛用于推荐系统的研究和基准测试。它包含了来自\
  \ 6,000 名用户对 4,000 部电影的 100 万条评分。其具体规格见表 5.2。\n\n*   – *MovieLens Small*：MovieLens\
  \ 版本的一个小型子集，包含了 100,000 名用户对 10,000 部电影的评分。它是较新版本（25M）的一个子集，用于教学目的。**表 5.2.** *MovieLens\
  \ 1M*\n\n| 用户数量 | 6040 |\n| --- | --- |\n| 电影数量 | 3883 |\n| 评分数量 | 1009 万 |\n| 稀疏度\
  \ % | 95.5% |\n| 物品描述 | 基因 |\n| 用户描述 | 人口统计学 |\n\n### 5.4.2. *评估指标*\n\n采用了两个影响性指标来评估框架：平均精确率和归一化累计增益。\n\
  \n平均精确率（MAP）是衡量信息检索准确性的流行指标（以及推荐系统）。对于查询集 `Q`，MAP 计算每个查询的平均精确率。结果始终在 0 到 1 之间，分数越高越好。\n\
  \n\\[5.15\\] ![Image](img/eqn5-15.jpg)\\[5.16\\] ![Image](img/eqn5-16.jpg)\n\n其中：\n\
  \n*   `TP`：真阳性：被系统检测为正的物品；\n*   `FP`：假阳性：被系统检测为负的物品；\n*   `Pr`：仅考虑前几个精确率。\n\n在推荐系统中，我们通常将结果裁剪为返回前\
  \ k 个元素，其中 `1<k<=q`。元素数量 `k` 取决于用途：系统可能会显示热门物品或符合当前口味的最佳物品等。因此，使用了 `MAP` 的更灵活的变体\
  \ `MAP @`。后者对较小的前 k 个元素集执行相同的计算过程：\n\n\\[5.17\\] ![Image](img/eqn5-17.jpg)\n\n推荐显示的排序对推荐系统的性能有影响。归一化累计增益（NDCG）是一种也用于信息检索系统的排序质量指标。NDCG\
  \ 根据物品在结果列表中的位置来衡量其归一化的用处，通过计算推荐的折扣累计增益（DCG）与其理想排序的 DCG 之间的比例来实现。结果 ∈ `[0 –1]` 表示推荐器的增益。因此，该值越高越好。\n\
  \n\\[5.18\\] ![Image](img/eqn5-18.jpg)\\[5.19\\] ![Image](img/eqn5-19.jpg)\\[5.20\\\
  ] ![Image](img/eqn5-20.jpg)\n\n其中：\n\n*   `DCG`：由推荐系统排序的预测物品集的折扣累计增益；\n*   `i DCG`：预测物品理想排序的折扣累计增益；\n\
  *   `Pos(q)`：推荐系统预测的 `q` 的位置；\n*   `iPos(q)`：`q` 的理想位置。\n\n`NDCG@k` 用于评估前 k 个推荐物品的排序质量。\n\
  \n### 5.4.3. *基准模型*\n\n个性化推荐系统与以下推荐系统进行了比较：\n\n\n\n\n\n*   *交互式注意力网络推荐系统*：是一种新型协同过滤推荐系统。这种先进技术基于共同注意力机制（co-attention\
  \ mechanism）。它的优势在于能够区分所有实体（用户-用户、物品-物品以及用户-物品）之间不同特征交互的重要性。\n*   *堆叠基于内容的过滤推荐系统*：这种基于内容的推荐系统由\
  \ Drif *et al.* (2020) 提出。堆叠集成利用了嵌入表示和堆叠集成学习的优势对内容进行建模。在这里，我们采用 `Random forest`\
  \ (Chollet *et al.* 2021) 模型作为元学习器（meta-learner），因为它通过在数据集的不同子样本上拟合多个决策树分类器，提高了预测准确性。\n\
  *   *神经协同过滤 (NCF)* (He *et al.* 2017)：该推荐系统应用 `MLP` 来学习用户-物品交互函数。\n*   *用于协同过滤的变分自编码器*\
  \ (MultiVAE) (Liang *et al.* 2018)：该技术在多项分布中对协同信息进行建模，为长尾部分的物品采样预测结果。\n*   *EnsVAE：用于推荐的集成变分自编码器*\
  \ (Drif *et al.* 2020)：符合 `EnsVAE` 标准的推荐系统为大量的用例提供了构建混合模型的简单指南。它通过通过学习每个物品评分的分布来输出兴趣概率，并尝试提供与相关的各种新物品。\n\
  \n## 5.5. 实验与讨论\n\n### 5.5.1. 超参数分析\n\n本节描述了对每个推荐系统分别进行的超参数分析步骤。所提出的实现方法基于 `Keras`\
  \ (Chollet *et al.* 2021)。此外，后者运行在 `Tensorflow` (Abadi *et al.* 2016)，这确保了可以通过复制相同的开发和评估环境来获得相同的结果。整个开发和评估阶段使用的机器是\
  \ `MacBook Pro` (16 GB 1600 MHz DDR3, GPU 2.2GHz 6-core Intel Core i7)。\n\n堆叠基于内容的推荐系统由一组回归模型和一个元学习器组成。堆叠（stacking）背后的思想是用强学习器来增强弱学习器。因此，一组表现出不同误差的弱学习器其性能与一组具有相似错误的强大学习器相同\
  \ (Géron *et al.* 2019)。因此，我们对堆叠 1–5 进行了分析，并关注每个学习器所使用的学习算法，以及元学习器的超参数。\n\n第一步是找到组成最佳堆叠的回归模型组合。对六种算法进行了网格搜索：`多项式核支持向量机`\
  \ (`SVM[poly]`) (Singh *et al.* 2016)、`RBF 核支持向量机` (`SVM[rbf]`)、`决策树` (`DT`)、`自动相关性检测回归`\
  \ (`ARD`)、简单的 `线性回归` (`LR`) 以及 `Random Forest`。表 5.3 报告了 k= 10、30 和 50 时前 5 个堆叠的结果。\n\
