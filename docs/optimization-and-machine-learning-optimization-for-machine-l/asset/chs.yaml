  \n### 7.4.1.3. 可行性代理\n\n其作用在于研究机器人下一步动作的可行性，以避免与可能的障碍或环境墙碰撞的风险（选择新行为）。可行性代理的主要作用反映了多智能体系统（MAS）在优化导航功能方面的体现。\n\
  \n### 能力：\n\n- 通过机器人中间构型与最终构型（要到达的目标构型）之间的距离优化目标函数。\n- 从中间构型集中选择最合适的一个，以获得最优路径（快速到达目标）且不与环境墙碰撞。\n\
  \n### 控制：\n\n- 更新其知识库（修改机器人的中间构型）。\n- 支持模糊控制器代理发送的消息（机器人中间构型列表）。\n\n### 动作计划：\n\n\
  图 7.7 展示了可行性代理图。该图显示了可行性代理采取的一系列动作。\n\n![图 7.7. 可行性代理通用流程](img/img7-7.jpg)\n\n**图\
  \ 7.7.** *可行性代理通用流程*\n\n### 7.4.1.4. 模糊控制器代理\n\n基于模糊推理和感知数据，该代理试图在机器人前方寻找可能的开口以退出给定状态并继续向目标前进。它为移动代理提供机器人移动所需的导航信息，如果机器人到达目标或处于阻塞状态，它还会发送停用指令。\n\
  \n### 能力：\n\n- 建立连接输入与输出的推理规则。\n- 机器人前方可能的结果。\n- 如果到达目标或存在阻塞情况，停止导航过程。\n- 定义阻塞情况。\n\
  \n### 控制：\n\n- 负责可行性代理的消息（选定的要到达中间构型）。\n- 更新知识库（更新环境的局部表示，添加和删除机器人前面的开口，选定的中间状态变为当前状态）。\n\
