  \ 1 到 50\n\n5.6 结论\n在本章中，我们提出并研究了一种利用用户-物品交互的推荐系统。`IPRec` 模型在潜在空间中利用了协同交互：第一个模型利用了注意力机制；第二个模型是多个基预测器的堆叠。在未来工作中，我们将该框架扩展到其他推荐任务并提供上下文数据。\n\
