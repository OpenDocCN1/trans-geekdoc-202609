  \ | | |\n\n### 1.2.1. *求解方法*\n\n`2L-CVRP` 是一个 NP-hard 问题，通过精确算法和元启发式算法求解：\n\nIori\
  \ *et al*. (2007) 使用精确算法求解小规模的 `2L-CVRP`，且仅针对序列变体。Gendreau *et al*. (2008) 使用禁忌搜索\
  \ (`TS`) 元启发式算法。对于序列情况，他们考虑了两种装载启发式方法，即 `LH2S` 和 `LH2U`。Zachariadis *et al*. (2009)\
  \ 提出了另一种元启发式算法，了 `TS` 和引导局部搜索，被称为 `GTS`。对于装载问题，他们使用了五种启发式方法和三种搜索来生成初始解。Fuellerer\
  \ *et al*. (2009) 提出了一种基于蚁群算法 (`ACO`) 的算法，而左下填充和接触周长算法用于解决装载问题。Leung *et al*. (2011)\
  \ 为路径问题提出了一种扩展的引导禁忌搜索 (`EGTS`) 算法，并使用最低线填充启发式方法 (`LBFH`) 求解 `2D-BPP`。Duhamel *et\
  \ al*. (2011) 使用贪婪适应搜索程序和进化搜索算法，记为 `GRASP-EL`。Leung *et al*. (2013) 研究了异质的车辆路径问题\
  \ (`2L-HFRP`)。他们提出了六种装载启发式方法来检查装载可行性（见表 1.1），并使用模拟退火结合局部搜索 (`SA-HLS`) 求解路径问题。Zacharidis\
  \ *et al*. (2013) 了一种了一种静态描述算法。Dominguez *et al*. (2016) 使用多启动随机算法和接触周长算法研究异质的 `2L-CVRP`。Wei\
  \ *et al*. (2015) 提出了一种变邻域搜索 (`VNS`) 方法来求解 `2L-CVRP`，并调整天线启发式方法以检查装载约束。Wei *et al*.\
  \ (2017) 提出模拟退火 (`SA`) 算法来求解 `2L-CVRP` 的 `2 |SO| L`、`2 |SR| L`、`2 |UO| L` 和 `2 |UR|\
  \ L` 版本。Sbai *et al*. (2017) 提出了一种基于适应遗传算法 (`GA`) 的新启发式方法来求解 `2L-CVRP`，仅考虑无限制的装载情况。Sabar\
  \ *et al*. (2020) 展示了异质的 `2L-CVRP`，记为 `2L-HFRP`。他们提出了两阶段方法：路径阶段和装载阶段。该问题通过 `MA`\
  \ 求解路径阶段，并使用五种启发式方法（见表 1.1）求解装载阶段。\n\n\n\n\n2L-CVRP 定义（Gendreau *et al.* 2008）于一个完全无向图\
  \ `G` = (*V*, *E*) 上，其中 `V` = {0， …, *n*} 是顶点集，`E` = { (*i*, *j* )| *i*, *j* ϵ*V*,\
  \ *i* ≠ *j*} 是边集，其特征由成本 `c[i j]` 表征。一组 `v` 辆同质车辆位于配送场，每辆车辆由 `D`、`W` 和 `H` 分别代表载重容量、宽度和高度。令\
  \ `A = W*H` 表示装载面积。客户 `i` {1， …, n} 的需求由 `m[i]` 件物品组成，总重量为 `d[i]`：物品 `I[il]` {*l*=1，\
  \ …, *m[i]**} 的宽度为 `w[il]`，高度为 `h[il]`。令 `a[i]` = ![Image](img/c1-in01.jpg) 表示客户\
  \ `i` 需求的总面积。图 1.1 展示了 2L-CVRP 求解的一个示例。\n\n### 1.2.3. 2L-CVRP 的变体\n\n在文献中，定义了多种\
  \ 2L-VRP 的变体，例如带有时间约束的 2L-CVRP、带有回程约束的 2L-CVRP 以及带有取送约束的 2L-CVRP。某些约束与装载配置有关：(1)\
  \ 方向装载，物品不能旋转；(2) 顺序装载，物品应根据客户访问顺序逆序进行装载；(3) 无限制装载，允许在路径规划过程中重新装载；以及(4) 非方向或旋转装载，允许物品在车辆内旋转\
  \ 90°。设计了四种版本的 2L-CVRP（`2|SO|L`、`2|SR|L`、`2|UO|L` 和 `2|UR|L`）。\n\n#### 1.2.3.1.\
  \ 带有时间约束的 2L-CVRP\n\n对于带有时间窗的 2L-CVRP (2L-CVRPTW)，为每个客户分配一个时间窗，在该窗内满足客户需求。Attanasio\
  \ *et al.* (2007) 考虑了一种 2L-CVRP 变体，其中每批货物必须在多天的时间窗 (TW) 内交付。他们提出了一个切割框架，在其中求解简化的整数线性规划\
  \ (ILP)。物品允许旋转，并假设基于顺序的装载。\n\nKhebbache-Hadji *et al.* (2013) 将车辆重量限制作为额外约束。作者针对路径规划和装箱问题提出了一种记忆体算法\
  \ (MA)。Sbai *et al.* (2017) 使用基于自适应遗传算法 (GA) 的新启发式算法求解 2L-CVRP，并设计了一种自适应浪费最小（ALWF）启发式算法来检查装载问题的可行性。Sbai\
  \ *et al.* (2017) 提出用于求解带时间窗 2L-CVRP 的自适应 GA；结果改进了所提方案的质量。Guimarans *et al.* (2018)\
  \ 提出了一种混合启发式搜索算法，用于求解具有随机旅行时间的 2L-CVRP 版本。\n\nSong *et al.* (2019) 考虑了带有装载和时间窗约束的多目标\
  \ VRP，以混合整数线性规划 (MILP) 模型表示。设计了一种广义邻域搜索 (GVNS) 算法来求解 MILP。\n\n#### 1.2.3.2. 带有回程的\
  \ 2L-CVRP\n\n在带有回程的 2L-CVRP (2L-CVRPB) 中，车辆可以先交付（线程），然后从客户处收集货物（回程）并将物品带回配送场。所有线程必须在回程之前完成。一旦客户需求被设计为一组\
  \ 2D 矩形重量物品，该问题被视为 2L-VRPB。\n\nPinto *et al.* (2015) 使用插入启发式算法和左下角启发式算法 (BLH) 研究了带有混合回程的\
  \ VRP。此外，Dominguez *et al.* (2016) 提出了一种混合算法：偏置随机启发式算法和大型邻域搜索元启发式框架，用于求解 2L-VRPB。\n\
  \n在相同的情况下，Zachariadis *et al.* (2017) 描述了一种局部搜索 (LS) 方法来求解 2L-VRPSDP 和 2L-VRPCB。Pinto\
  \ *et al.* (2017) 提出了一种求解 2L-VRPB 的 VNS 算法。\n\n#### 1.2.3.3. 带有取送约束的 2L-CVRP\n\n\
  在带有取送约束的 2L-CVRP 中，交付物品卸下，额外的取送物品被装载到车辆上。同样，带有取送 (PD) 和 2D 装载约束的 VRP 只在两项工作中得到了研究。第一项由\
  \ Malapert *et al.* (2008) 提出用于求解 2L-VRPPD。第二项由 Zachariadis *et al.* (2016) 引入，带有后进先出（LIFO）约束的同步取送\
  \ VRP (2L-SPD)。\n\n### 1.2.4. 计算分析\n\nGendreau *et al.* (2008) 和 Iori *et al.* (2007)\
  \ 生成了。特别是，`L`, `W` 是固定的。根据 Iori *et al.* (2007)，可用数据见 [`www.deis.unibo.it/research.html`](http://www.deis.unibo.it/research.html)。\n\
  \n对于第 1 类，每个客户被分配到一个物品。对于类 2–5，包含了 `m[i]`。无限制版本和顺序版本共享相同的测试。2L-CVRP 应考虑物品进入相应车辆的可行性。\n\
  \n## 1.3. 带有三维装载的带容量车辆路径问题\n\n3L-CVRP 集成了两个最热门的问题：CVRP 和 3D-BPP。该问题目标是在遵守三维约束的同时最小化旅行成本。3L-CVRP\
  \ 有许多运输应用（Ruan *et al.* 2013），例如厨房组件、机械部件、家用电器和软货的配送。表 1.2 对 3L-CVRP 的现有文献进行了对比研究，包括求解方法、变体和约束。\n\
  \n### 1.3.1. 求解方法\n\nGendreau *et al.* (2006) 研究了首篇报告 CVRP 和 3D 装载结合的工作；他们针对路径规划和装箱问题都提出了\
  \ TS 算法。他们提出了基于顺序的装载、堆叠和垂直稳定性约束，以及物品在车辆中的垂直方向。该工作源于意大利真实的家具配送案例。Aprile *et al.*\
  \ (2007) 开发了退火算法 (SA) 来求解 3L-CVRP。\n\nTarantilis *et al.* (2009) 结合 TS 和引导局部搜索 (GLS)\
  \ 来求解 3L-CVRP 的黑箱可行性。Fuellerer *et al.* (2010) 处理了大规模实例的 3L-CVRP，使用蚁群算法 (ACO) 求解路径规划；Ren\
  \ *et al.* (2011) 为路径子问题提出了分支定法，并使用集装箱算法验证物品进入相应车辆的装箱情况。Massen *et al.* (2012) 提出了一种基于列生成的启发式方法，用于具有黑箱可行性的车辆路径问题\
  \ (VRPBB)。\n\nBortfeldt (2012) 提出了 TS 和树搜索算法 (TRSA)，其中第一个用于路径问题，第二个用于装箱问题。Zhu *et\
  \ al.* (2012) 使用 TS 算法研究了 3L-CVRP。\n\nWisniewski *et al.* (2011) 为路径问题描述了一种 TS 和\
  \ 首次改进局部搜索。另一方面，装载通过一种随机的左下角算法高效地完成。Miao *et al.* (2012) 分别使用 GA 和 TS (GATS) 求解\
  \ 3L-CVRP 问题的路径和装箱子问题。\n\n\n\n\n\nRuan *et al*. (2013) 针对路径问题提出了蜜蜂交配优化算法 (`HBMO`)，并针对\
  \ 3D 装箱提出了六种启发式算法（`Back-Left-Low`、`Left-Back-Low`、`Max-Touching-Area-W`、`Max-Touching-Area-No-Walls-W`、`Max-Touching\
  \ Area-L` 和 `Max-Touching-No-Walls-L`）。\n\nCeschia *et al*. (2013) 研究了基于序列装箱和异构车队的\
  \ 3L-CVRP。他们提出了一种结合 `SA` 和大邻域搜索 (`LNS`) 的 `LS` 方法来在一个阶段解决该问题。他们考虑了堆叠和稳定性约束、方向约束、人员或叉车的最大触及长度以及分批交付的可能性。\n\
  \nTao and Wang (2015) 针对路径问题提出了一种简单的 `TS` 算法，针对装箱问题提出了一种最小浪费算法。\n\nJunqueira *et\
  \ al*. (2013) 提出了一种 `ILP` 精确方法来解决小规模的 3L-CVRP 实例（客户数量 <15）。他们假设为同质车队、基于序列的装箱、堆叠约束、方向约束和稳定性约束。作者考虑了客户现场物品的卸货模式。\n\
  \nHokima *et al*. (2016) 针对仅有 `LIFO` 约束但无易碎性和稳定性约束的 3L-CVRP 变体提出了两种分支定界算法。此外，作者还针对路径子问题提出了一种迭代局部搜索\
  \ (`ILS`) 方法。\n\nVega *et al*. (2020) 提出了一种结合了贪婪随机自适应搜索程序 (`GRASP`) 启发式算法和 Clarke-Wright\
  \ 节约算法 (`CWS`) 的混合启发式算法。\n\n### 1.3.2. 问题描述\n\n3L-CVRP 的定义如下（Gendreau *et al*. 2006）。令\
  \ `G = (V, E)` 为完全图，其中 `V = {0, 1, …, n}` 是包含 `n+1` 个顶点的集合，`E` 是连接每对顶点的完全边集。\n\n\
  顶点 `0` 对应配送场，而顶点 `{1, …, n}` 是待服务的 `n` 个客户。每条边被记为 `(i, j)`，并有一个相关的路径成本 `c[ij]`，其中\
  \ `(i, j = 0, …, n)`。\n\n还给出了由 `v` 辆同质车辆组成的车队，每种车辆由 `D`、`W`、`H` 和 `L` 特征，分别表示容量、宽度\
  \ `W`、高度 `H` 和长度 `L`。每辆车后面都有用于装卸操作的开口。假设开口的大小为车辆的 `W * H`。\n\n客户 `i` 的需求由一组 `m[i]\
  \ items` 组成，其总重量为 `d[i]` (`i = 1, …, n`）。客户 `i` 的每个物品 `k` 表示为 `I[ik]`，是一个 3D 立方体，具有宽度\
  \ `w[ik]`、高度 `h[ik]` 和长度 `l[ik]` (`i = 1, …, n`, `k = 1, …, m[i]`）。\n\n客户 `i` 要求的总需求表示为\
  \ `![Image](img/c1-in02.jpg)`。\n\n3L-CVRP 要求寻找一组最多 `v` 条路径，在确保遵守每个物品 3D 约束的前提下最小化总旅行成本。如果一个\
  \ 3D 装箱方案行的，前提是它没有超过车辆重量容量 `D`，并且在车辆空间内存在物品放置方案，满足经典的 3D-BPP 约束（物品不重叠且完全包含在箱体/车辆内）以及一系列操作约束。图\
  \ 1.2 展示了 3L-CVRP 解决方案的一个示例。\n\n![图 1.2. 3L-CVRP 解决方案的一个示例](img/img1-2.jpg)\n\n\
  **图 1.2.** 3L-CVRP 解决方案的一个示例\n\n### 1.3.3. 3L-CVRP 变体\n\n研究最丰富的 3L-CVRP 变体是带时间窗口的\
  \ 3L-CVRP、带回程的 3L-CVRP 以及带取送货的 3L-CVRP。3L-CVRP 集成了 3D-BPP 约束，如后进先出 (LIFO)物品旋转；垂直稳定性；易碎性和重量限制。\n\
  \n#### 1.3.3.1. 带时间窗口的 3L-CVRP\n\nMoura (2008) 提出了三个组织形式的目标，分别是最小化车辆数量、总距离以及最大化利用体积。Moura\
  \ and Oliveira (2009) 开发了一种顺序方法（使用 `LS` 和 `GRASP` 启发式算法）和一种分层方法（使用构造阶段、后构造阶段和局部搜索阶段）来解决\
  \ 3L-CVRPTW。目标是最小化车辆数量和总路径时间。在分层方法中，装箱问题被视为路径问题的子问题。\n\nBortfeldt and Homberger\
  \ (2013) 描述了两个步骤：第一步是根据每辆车辆的容量将物品装入车辆中。Zhang *et al*. (2017) 通过结合 `ABC` 为 3L-CVRPTW\
  \ 提出了一种 `TS`。Moura *et al*. (2019) 提出了一种 `MILP`。Vega *et al*. (2019) 研究了带有 3D 装箱约束的\
  \ VRP。Pace *et al*. (2015) 使用了 `ILS` 和模拟退火 (`SA`)。\n\n#### 1.3.3.2. 带回程的 3L-CVRP\n\
  \nVRP 与回程的结合是一个近期的问题。Bortfeldt *et al*. (2015) 针对 3D 回程 VRP 提出了 `LNS` 和变邻域搜索 (`VNS`)。Koch\
  \ *et al*. (2018) 处理了带时间窗口的 CVRP (`3L-VRPSDPTW`)。Re *et al*. (2018) 为 VRPBTW 扩展了\
  \ Bortfeldt *et al*. (2015) 方法。Koch *et al*. (2020) 为路径问题提出了一种 `TS` (`3L-VRPMB`)。\n\
  \n#### 1.3.3.3. 带取送货的 3L-CVRP\n\nBartok and Imreh (2011) 使用了一种简单的 `LS` 方法解决 3L-VRPPD。Mannel\
  \ and Bortfeldt (2016) 讨论了若干 3L-VRPPD 变体以及基于 `LNS` 的混合方法。\n\n#### 1.3.3.4. 带分批交付的\
  \ 3L-CVRP\n\nYi and Bortfeldt (2016) 以与 Gendreau 公式相同的装箱约束处理了 3L-SDVRP。Li *et al*.\
  \ (2018) 提出了一种新的数据驱动三层搜索算法。Bortfeldt and Yi (2020) 研究了 3L-SDVRP 的两种变体。\n\n\n\n\n\
  \n用于 3L-CVRP 的实例集可以在 [`www.or.deis.unibo.it/research.html`](http://www.or.deis.unibo.it/research.html)\
  \ 获取，由 Gendreau *等人* (2006) 引入。网上总共有 27 个 3L-CVRP 实例，为不同启发式和元启发式解的比较提供了一个有趣的测试平台。车辆的特征分别为\
  \ `W` = 25、`H` = 30 和 `L` = 60。每个客户的需求在 1 到 3 之间。车辆的容量为 0.75。\n\n### 表 1.2. 3L-CVRP\
