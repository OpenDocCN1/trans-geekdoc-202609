  \n通过这些图，我们注意到所采用方法（`MAS` 和 `fuzzy logic`）在复杂和变化环境下的移动机器人导航中的性能和效率。机器人始终能够在不与障碍物或环境墙壁碰撞的情况下到达目标，同时选择最短路径。\n\
  \n## 7.7. 结论\n\n控制架构的设计是自主移动机器人实现项目中的核心问题。在缺乏能够涵盖所有其他方案的通用解决方案的情况下，详细说明并证明导致所提议解决方案的设计过程至关重要。\n\
  \n在本章中，我们通过开发一种基于两种人工智能方法（`MAS` 和 `fuzzy logic`）混合的导航控制架构，为该问题提供了解决方案。本章还提供了推理机制的更多细节。机器人在导航期间的整体行为被归纳为两个基本程序：避障程序（共有七种情况：情况\
  \ 1，……情况 7）和接近目标程序（有一种情况：情况 8）。这些程序通过一些导航规则呈现，并使用 `fuzzy logic` 作为导航的进阶工具。\n\n所获得的仿真结果令人满意，因为尽管机器人所处的环境复杂，它仍然能够到达目标。这为我们为动态环境（移动障碍物）导航开发的架构铺平了道路。扩展到分布式移动机器人是可以实现的，因为所选架构能够通过添加特定代理来管理机器人之间的通信，确保与其他机器人的连接，从而拓宽了移动机器人的应用领域。因此，设计了一个由子系统组织的多代理系统，其中每个机器人都是一个子系统多代理。\n\
