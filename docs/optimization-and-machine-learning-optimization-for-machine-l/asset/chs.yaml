  \ |\n\n通过分析 Emary *et al.* (2016) 提供的结果，我们可以看到从全局来看，元启发式算法 `bGWO1` 和 `bGWO2` 比 `GA`\
  \ 和 `PSO` 更具竞争力和效率。\n\n## 3.9. 结论\n\n本章揭示了基于种群的元启发式算法在数据处理中的另一个用途，为机器学习算法服务。事实上，元启发式算法能够以非常良好的结果解决特征选择的优化问题。特征选择通过提高分类器的性能同时降低其复杂性，为分类器的训练提供了策略优势。\n\
  \n此外，我们还学习了如何将连续的种群元启发式算法适应到二值搜索空间的优化中。为此，我们选择了一种新的元启发式算法来解释二值化方法：灰狼元启发算法 `GWO`。\n\
  \n二值化方法由两个模块组成，并为特征选择创建了两种新的元启发式算法：`bGWO1` 和 `bGWO2`。\n\n在来自 UCI 参考系统的 18 个数据集上进行的实验结果证明了\
  \ `bGWO1` 和 `bGWO2` 相比 `bGA` 和 `bPSO` 算法的优越性。\n\n`bGWO` 的性能吸引了许多研究者的关注，并通过混合技术促进了改进，例如\
  \ `bPSOGWO` (Al-Tashi *et al.* 2017)。这表明元启发式算法 `GWO` 的改进空间很大。\n\n## 3.10. 参考文献\n\
