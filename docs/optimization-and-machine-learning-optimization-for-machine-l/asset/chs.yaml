  \ 73, 1–18.\n\nZhu, W., Qin, H., Lim, A., Wang, L. (2012). 一种带有增强装箱启发式算法的 3L-CVRP\
  \ 和 M3L-CVRP 的两阶段禁忌搜索.计算机与运筹学, 39(9), 2178–2195.\n\n\n**Marwa MOKNI¹,2 和 Sonia YASSA²**\n\
  \n*¹MARS 实验室 LR17ES05, 苏苏斯大学, 突尼西*\n\n*²ETIS 实验室 CNRS UMR8051, 巴黎高等大学, 法国*\n\n调度产生大量数据的延迟敏感物联网（IoT）应用是一项挑战。尽管云具有极大的计算和存储能力，但由于终端用户与云服务器之间的距离，云计算会影响延迟。因此，云的局限性导致了边缘计算的发展。在本中，我们利用云边协作对以工作流形式存在的物联网应用进行调度，并考虑物联网对象之间的关系和通信。所提出的调度方法由多智能体系统（MAS）支持，以利用每个代理独立的功能。我们的主要目标是创建一个同时优化多个\
  \ QoS 指标的最优解决方案；因此，我们采用了广泛使用的元启发式`遗传算法`作为优化方法。通过模拟一个医疗物联网应用和多个科学工作流基准对所提出的调度方法进行了测试。结果证明了方法的有效性；它生成了更好地优化所考虑的各种\
  \ QoS 指标的调度计划。\n\n## 2.1. 引言\n\n\n\n\n物联网（IoT）包含了大量的互联对象（Davami *et al.* 2021）。在某些情况下，物联网对象模型化了自动化流程（如智能家居、医疗保健等），这些流程涉及在严格的响应时间内执行，并需要高级编程技能。值得注意的是，在人类健康监测中，患者需要工具来轻松地监控和控制周围的物联网设备，并对自动化日常任务简单流程进行建模。为了解决这个问题，我们提出了一种自管理工作流建模，该建模以无环图的形式监控、控制并同步由物联网对象所生成的应用程序之间的关系。此时，工作流技术提供了活动的编排序列，以确保物联网应用程序的执行不出现任何错误或扰动（Hoang\
  \ and Dang 2017; Mokni *et al.* 2021）。因此，基于物联网的工作流需要满足其需求并优化其执行的计算资源。然而，尽管许多现有研究已经针对物联网流程提出了工作流模型，但物联网工作流调度尚未得到广泛讨论。在本章中，我们关注提供由工作流模型协调的物联网流程。鉴于物联网应用的特性（Matrouk\
  \ and Alatoun 2021），严格的延迟需求使得在云计算层面处理物联网工作流成为一个性能瓶颈。雾计算是思科（2015）提出的一种范式，它与云计算创建了一个协作架构，两者互得互补。雾服务与云服务之间的协作是产生最优基于物联网的工作流调度计划的合适解决方案，该计划可能同时需要降低延迟和显著的计算能力（Saeed\
  \ *et al.* 2021）。从思科的角度来看，雾计算（Chen *et al.* 2017）被认为是云计算从网络核心到网络边缘的本地扩展。雾计算节点安装在云计算层之下，靠近终端用户。这个高度虚拟化的平台在终端和传统云服务器之间提供计算、存储和网络服务，用户可以通过其移动设备访问。然而，随着工作流、网络和安全要求的日益增加，调度算法变得越来越具有挑战性，因为它们必须管理多个涉及不同利益相关者的者的矛盾参数。例如，工作流执行成本的降低将增加整体执行时间，并导致使用可靠性较低的机器。通常，雾云计算环境中的工作流调度是一个\
  \ NP-Hard 问题（Helali and Omri 2021），需要比简单规则更的方法来解决。因此，在本章中，我们提出了一种基于遗传算法（GA）的物联网工作流调度方法（Bouzid\
  \ *et al.* 2020），其旨在创建一个优化多个 QoS 指标的多目标优化解决方案。围绕分布式基础设施（如云计算）的关键问题是实现适应高层用户指令后状态和行为变化的技术和方法。满足这些要求的自管理、自检测和自主技术可以基于多智能体系统（MAS）。事实上，SMA（Mokni\
  \ *et al.* 2018）是一种非常适合模拟不同实体之间复杂交互现象的范式，这些现象需要协商用户访问、开发智能服务，并高效利用云计算和雾计算资源。在这种背景下，我们感兴趣围绕三层建模一个\
  \ SMA：物联网层、雾计算层和云计算层。这项工作的主要贡献是：\n\n* 针对物联网流程提出了工作流建模；\n* 开发了基于 `GA` 的多目标调度解决方案；\n\
  * 建模了 `MAS` 以增强调度方法的实体。\n\n本章的其余部分结构如下：[第 2.2 节](#c02.xhtml#sec2-2）介绍了与现有调度方法相关的工作。问题描述在[第\
  \ 2.3 节](#c02.xhtml#sec2-3）中给出。提出的模型及其设计和实现在[第 2.4 节](#c02.xhtml#sec2-4）中描述。[第 2.6\
  \ 节](#c02.xhtml#sec2-6）描述了实验设置并展示了性能评估的结果。[第 2.7 节](#c02.xhtml#sec2-7）给出了结论和未来工作。\n\
  \n\n\n工作流调度问题引起了研究者的广泛兴趣，被应用于各种计算环境（例如云计算、雾计算和云雾协同计算），并服务于多个领域，如科学、生物信息学和物联网（IoT）。Saeedi\
  \ *et al.* (2020) 中的方法提出了一种基于粒子群优化算法的云计算工作流调度方法。作者旨在通过缩短完成时间（makespan）、成本和能耗，并最大化虚拟机的可靠性，同时满足用户和云提供者的冲突需求。结果表明，所提算法在完成时间、成本和能耗方面优于\
  \ `LEAF`、`MaOPSO` 和 `EMS-C` 算法。Sun *et al.* (2020) 提出了一种基于免疫的 PSO 算法的工作流调度方法，其目的是分别在成本和完成时间方面生成最优调度计划。与\
  \ `PSO` 结果相比，该方法产生了最小成本和完成时间的调度方案。在 Shirvani (2020) 中，提出了一种基于离散 `PSO` 结合爬山局部局部搜索算法的科学工作流调度方法。该方法旨在创建一个最小化完成时间和总执行时间的调度方案，平衡探索与开发。Tarafdar\
  \ *et al.* (2021) 处理了云计算中的能耗问题，作者提出了一种针对具有预算限制的截止敏感型工作流高效调度算法。结果显示，该方法通过采用动态电压频率调整\
  \ (`DVFS`）来调整执行工作流任务的虚拟机的电压和频率，成功减少了能耗和违反期限。在 Nikoui *et al.* (2020) 中，在云计算环境中开发了一种科学工作流调度方法，通过应用混合离散粒子群优化\
  \ (`HDPSO`) 算法，旨在最小化总执行时间和完成时间。作者证明了在并行计算机器上进行可并行任务调度的效率，以缩短执行时间。Gu and Budati (2020)\
  \ 提出的另一种工作流调度方法旨在减少由于大规模工作流应用和海量资源消耗引起的能耗。作者基于蝙蝠算法开发了所提出的调度方法。Aburukba *et al.*\
  \ (2020) 在雾云计算中开发了一种物联网请求调度方法，旨在最小化延迟值。与各种算法相比，采用 `GA` 的结果降低了延迟。Kaur *et al.* (2020)\
  \ 提出了一种基于预测的动态多目标进化算法，称为 `NN-DNSGA-II` 算法。他们将人工神经网络与 `NSGA-II` 算法结合，调度云计算中的科学工作流，同时考虑到资源故障和随时间变化的可能数量。详细结果显示，所提方法在大多数测试用例中显著优于非预测类算法。实验结果表明，与\
  \ `CPOP`、`HEFT` 和 `QL-HEFT` 相比，该方法提供了更低的响应时间和完成时间。此外，Setlur *et al.* (2020) 提出了一种工作流调度方法，将\
  \ `HEFT` 算法与多种机器学习技术相结合，范围从用于每个任务复制次数的监督分类（如 `Logistic Regression`、`Max Entropy\
  \ Models`）。与 `Replicate-All` 算法相比，该方法改进了资源浪费和资源利用率等指标。Hoang and Dang (2017) 提出了一种基于区域的任务调度概念，以满足资源和敏感延迟需求，并为重型计算任务利用适当云资源。在\
  \ Abdel-Basset *et al.* (2020) 中，处理了雾计算中的物联网任务调度问题。作者提出了一种基于海洋捕食者算法 (`MPA`) 的调度方法，旨在提高不同的\
  \ QoS 指标。在 Aburukba *et al.* (2021 ) 中，在雾计算中提出了一种基于加权轮询算法的物联网调度方法。该开发方法基于智慧城市应用，旨在根据可用处理能力确保任务有效执行。\n\
  \n如表 2.1 所示，提出的科学工作流调度方法在云环境中开发，旨在优化一个或两个 QoS 指标，而未考虑延迟量。此外，混合雾云计算中的物联网任务调度方法旨在最大化雾资源利用率，而非通过云计算来最小化成本和延迟。此外，作者没有考虑异构性、物联网任务之间的关系或计算基础设施的高动态性。\n\
  \n本章介绍了一种基于 `MAS-GA` 的雾云计算物联网工作流调度方法，旨在优化完成时间、成本和延迟值。所提方法基于多智能体系统 (`MAS`)，考虑了不同的\
  \ QoS 指标。通过开发 `GA` 采用多目标优化方法创建物联网工作流调度方案。\n\n## 2.3. 问题公式化\n\n分布式基础设施上的工作流调度问题围绕三个主要实体：\n\
  \n* – 待执行的工作流任务；\n* – 需要分配的资源；\n* – 需要优化的服务质量指标。\n\n从形式上来说，工作流调度问题由两部分组成：`m` 个虚拟机\
  \ (`VMs`) 的供应商和一个由 `n` 个任务组成的用户工作流。必须在遵守任务间先验约束并优化不同 QoS 指标的情况下，将任务映射到虚拟机上。\n\n\
  **表 2.1.** *现有调度方法的比较*\n\n| **工作** | **雾云** | **云雾** | **元启发式** | **物联网工作流** | **动态性**\
