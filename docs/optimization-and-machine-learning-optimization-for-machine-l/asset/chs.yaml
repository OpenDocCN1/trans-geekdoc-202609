  \ `M1` 和 `M2` 进行二值化。\n\n### 3.7.1. 第一种算法 bGWO1\n\n在这种方法中，二进制向量 ![Image](img/x1bar)、![Image](img/x2bar)\
  \ 和 ![Image](img/x3bar) 的每个位 ![Image](img/bdi)*(t) 分别使用公式 \\[3.27\\]](#c03.xhtml#eqn3-27)–[\\\
  [3.29\\]](#c03.xhtml#eqn3-29), \\[\\[3.30\\]](#c03.xhtml#eqn3-30)–[\\[3.32\\]](#c03.xhtml#eqn3-32)\
