  \ --- | --- |\n| **Stack** || MAP@10 || MAP@30 || MAP@50 || NDCG@10 || NDCG@30 ||\
  \ NDCG@50 |\n| **Stack 1** || 0.75 || 0.72 || 0.7 || 0.62 || 0.71 || 0.74 |\n| **Stack\
  \ 2** || 0.79 || 0.75 || 0.73 || 0.65 || 0.72 || 0.76 |\n| **Stack 3** || 0.80 ||\
  \ 0.77 || 0.76 || 0.66 || 0.73 || 0.76 |\n| **Stack 4** || 0.82 || 0.78 || 0.77\
  \ || 0.66 || 0.75 || 0.75 |\n| **Stack 5** || 0.82 || 0.78 || 0.77 || 0.66 || 0.75\
  \ || 0.76 |\n\n堆叠基于内容的推荐系统由一组回归模型和一个元学习器组成。堆叠背后的思想是用强学习器来增强弱学习器。因此，一组表现出不同误差的弱学习器其性能与一组具有相似错误的强大学习器相同\
  \ (Géron *et al.* 2019)。因此，我们对堆叠 1–5 进行了分析，并关注每个学习器所使用的学习算法，以及元学习器的超参数。\n\n第一步是找到组成最佳堆叠的回归模型组合。对六种算法进行了网格搜索：`多项式核支持向量机`\
  \ (`SVM[poly]`) (Singh *et al.* 2016)、`RBF 核支持向量机` (`SVM[rbf]`)、`决策树` (`DT`)、`自动相关性检测回归`\
  \ (`ARD`)、简单的 `线性回归` (`LR`) 以及 `Random Forest`。表 5.3 报告了 k= 10、30 和 50 时前 5 个堆叠的结果。\n\
  \n### 5.5.2. 与基准模型的性能比较\n\n为了更深入地了解交互注意力网络的结果，我们可视化了了 10 个物品和 4 个用户的交互共同注意力权重。图\
  \ 5.7 显示，该推荐系统为最终评分预测构建了一个用户-物品共同注意力图。它识别了代表用户对物品相互影响的最相关权重。这归功于它能够从每个用户的贡献中捕捉互补信息并将其结合以预测效用矩阵。事实上，共同注意力模块强调了不同实体之间的依赖关系。\n\
  \n\n\n\n换句话说，`IPRec` 比其他模型能更好地召回用户的相关项目。它获取了用户-物品交互并证明了其高分。此外，交互注意力推荐系统和 `EnsVAE`\
  \ 推荐系统产生了具有竞争力的结果。例如，`IPRec`、`EnsVAE` 和交互注意力推荐器分别实现了 `MAP@10=0.89`、`MAP@10=0.87`\
  \ 和 `MAP@10=0.86`，这些均高于基准模型。`MultiVAE` 以多项分布的形式对协同信息建模，由于没有对数据的丰富表示进行建模，其 `MAP`\
  \ 值较弱。神经网络协同过滤（`NCF`）由于对用户和物品之间交互的建模，在 `k=10` 时给出了 `MAP@10=0.74` 分。\n\n表 5.4 在 MovieLens\
  \ 1M 数据集上对比方法的推荐准确率得分 (%)。我们为每个用户生成前 10、30 和 50 个项目。`MAP@k` 和 `NDCG@k` 的最佳性能用粗体字体突出。\n\
