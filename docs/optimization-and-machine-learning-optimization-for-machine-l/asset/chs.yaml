  \ |\n\n### 2.5.2. 适应度函数\n\n采用适应度函数 `F` 通过为这些指标每一个分配权重 `W[i]` 来优化多个 QoS 指标。每个权重定义了用户对该指标的重要性。适应度函数如公式\
  \ 2.8 所示。\n\n2.8 ![Image](img/eqn2-8.jpg)\n\n如公式 2.9 所示，我们采用归一化计算来确定方案的适应度值。事实上，QoS\
  \ 指标具有不同的值和尺度；此外，特定指标需要最大化，而另一些需要最小化。\n\n*MaxQoS[i]* 是在上迭代中发现的 `QoS[i]` 的最大值。\n\n\
  2.9 ![Image](img/eqn2-9.jpg)\n\n\n\n\n\n交叉算子通过结合被选个体的不同部分来产生新个体。首先，交叉算子从被选第一个父代（`individual\
  \ 1`）的调度顺序中随机选择两个点。然后，这两个点之间的任务位置将进行 `permuted`（重排）。这一步的结果是产生两个个体，称为后代。交叉算子的说明见图\
