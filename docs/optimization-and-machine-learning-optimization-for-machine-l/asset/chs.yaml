  \n**图 7.9.** *代理交互与通信。对于彩色版本，请参阅图 7.5](#fig7-5)*\n\n## 7.5. 模糊逻辑导航\n\n### 7.5.1.\
  \ 模糊逻辑概述\n\n模糊逻辑是数学的一个分支，并由此开发了一系列基础概念。为了理解模糊逻辑原理，我们只保留以下元素：\n\n- 模糊变量；\n- 推理规则。\n\
  \n通常情况下，模糊逻辑系统由三个重要模块组成：模糊化模块（允许从数字域到符号域转换）、推理模块（建立输入到输出的规则）以及反模糊化模块（将模糊信息转换为精确数值，Pelletier\
  \ 2000）。\n\n### 7.5.2. 机器人描述\n\n我们选择机器人平台：\n\n- 两个独立控制的驱动轮；\n- 添加在机器人前面的万轮以确保稳定性；\n\
