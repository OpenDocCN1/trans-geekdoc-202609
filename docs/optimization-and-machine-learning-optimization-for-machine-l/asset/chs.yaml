  \ | 99.31% | 1.09% |\n\n## 8.7. 在网络中部署\n\n本节描述了 IDS 所需的步骤。\n\n#### 8.7.1. 传感器\n\n\
  在网络中部署 IDS 的第一步是传感器。根据网络的大小和复杂程度，我们可以选择一个或多个传感器。在两种情况下，传感器都会监控流量。通常情况下，传感器有两个接口：一个用于监控，一个用于管理。\n\
  \n#### 8.7.2. 模型选择\n\n部署传感器后，我们必须选择部署哪种模型。模型选择取决于检测率或误报率等评估指标，也应考虑模型的复杂度。为了降低复杂度，我们可以采用之前描述的选择方法。\n\
  \n#### 8.7.3. 模型部署\n\n一旦 IDS 部署到网络中，我们希望它能以全自动的方式处理输入数据。这涉及到图 8.29 所示的几个步骤。\n\n\
  实现这种自动化方案有很多，从完全定制的方案到完全商业产品（COTS）。由于本文的模型是用 `TensorFlow`训练的，一种简单的方法是使用 `TensorFlow\
  \ Extend`(7)，这是一系列用于在环境中部署 `ANN` 模型的工具。图 8.30 描述了 `TFX` 框架的组件，涵盖从数据清洗到 `Keras` 模型验证的内容。\n\
  \n#### 8.7.4. 模型自适应\n\n模型上线后，应该使用来自网络的真实数据进行训练和更新。这是一项耗时的任务，需要网络处于临时的“安全”状态，以便模型能够学习系统的正常行为。\n\
  \n\n\n\n训练完成后，IDS 已经准备好在网络环境中使用。为了延长训练时间，可以分配一名人类监督员来检查被标记为异常的条目，并在必要时对其重新标记。同一个模型也可以定期使用更大的数据集或仅使用最新的条目进行重新训练。\n\
  \n## 8.8. 未来工作\n\n这项工作仅代表了如何使用人工神经网络（ANN）和 `TensorFlow` 建模并部署网络入侵检测系统（NIDS）的初步分析。模型可以进行许多改进以获得更好的性能，例如实现早停机制（early\
  \ stopping）代替固定数量的轮（epochs），以及调整 `Keras` 模型以适配 `TPU`（张量处理单元），这可以显著缩短所需的训练时间。\n\n\
  在真实网络中部署 IDS 时，还应对对目标网络进行深度分析。效率、延迟以及新网络环境中的样本采集等问题均特定于每个网络，如果我们想要实施 IDS 部署，必须考虑这些因素。\n\
