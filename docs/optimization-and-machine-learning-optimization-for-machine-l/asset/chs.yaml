  \ 的均值更新其位置 ![Image](img/xbar.jpg)。这种更新允许狼群接近最优解。\n\n[\\[3.6\\]](#c03.xhtml#eqn3_6)\
  \ ![Image](img/eqn3-6.jpg)[\\[3.7\\]](#c03.xhtml#eqn3_7) ![Image](img/eqn3-7.jpg)\\\
  [3.8\\] ![Image](img/eqn3-8.jpg)\\[3.9\\]](#c03.xhtml#eqn3_9) ![Image](img/eqn3-9.jpg)\\\
  [3.10\\] ![Image](img/eqn3-10.jpg)[\\[3.11\\]](#c03.xhtml#eqn3_11) ![Image](img/eqn3-11.jpg)[\\\
  [3.12\\]](#c03.xhtml#eqn3_12) ![Image](img/eqn3-12.jpg)\n\n\n\n\n机器学习分类算法是人工智能的一个组成部分，它们对需要处理的数据量具有极高的响应要求。因此，它们必须是响应式的、准确的、自适应的尽可能轻量化的。为了做到这一点，我们只为算法提供决策所需的必要数据，以免被冗余或无关数据所淹没。这就是特征选择的意义。本节将提供特征选择的理论基础，以及特征选择对机器学习分类器的主要优势。\n\
  \n### 3.4.1. 特征选择定义\n\n特征选择解决的是如何在原始数据集（通常是高维的）中选择最少特征的问题（Almomani *et al*. 2019）。因此，它是一种提取过程，通过消除无关和冗余特征来更好地理解数据集（Sharma\
  \ and Kaur 2021）。在实践中，特征选择包括利用*ad hoc* 算法对具有 `N` 个特征的输入数据集进行处理，并输出一个包含 `p` 个特征数据的子集，其中\
  \ `p < N`。图 3.9 展示了这一过程。但实现这一目标的方法有哪些？\n\n![图 3.9. 特征选择过程。如需此图彩色版，请访问 www.iste.co.uk/chelouah/optimization.zip](img/img3-9.jpg)\n\
  \n**图 3.9.** 特征选择过程。如需此图彩色版，请访问 [www.iste.co.uk/chelouah/optimization.zip](http://www.iste.co.uk/chelouah/optimization.zip)\n\
  \n### 3.4.2. 特征选择方法\n\n特征选择算法主要分为两大：混沌和二值（Sharma and Kaur 2021）。二值特征选择由于其良好的性能以及更好的理论和实践控制，在文献中使用得最广泛。因此，我们将在本章中实现二值选择。\n\
  \n二值特征选择类包含两种主要的特征选择方法：过滤式方法和包装式方法（Chandrashekar and Sahin 2014; Almomani *et al*.\
  \ 2019; Sakr *et al*. 2019; Sharma and Kaur 2021）。\n\n### 3.4.3. 过滤式方法\n\n过滤式方法独立于优化问题和分类器，这是其核心优势。它使用统计算法，通过分析数据的任何特定属性来计算每个特征的权重。这些权重将与一个阈值进行比较，从而提供特征分类。这种排序使得能够删除优于阈值的特征。然而，这种方法的精度远低于包装式方法的选择。文献中最常用的过滤式方法有（Sakr\
  \ *et al*. 2019）：\n\n* – 信息增益；\n* – 主成分分析；\n* – 特征特性的相关性选择。\n\n### 3.4.4. 包装式方法\n\
  \n包装式方法使用机器学习分类器来引导元启发式算法引导特征选择过程。因此，该方法*依赖于*分类器。此外，包装式方法比过滤式方法需要更多的计算和处理时间。然而，它的主要优势是提供了更高的精度，从而在解决特征选择问题时获得更好的结果。文献证实，包装方法优于过滤式方法（Siarry\
  \ 2014; Sakr *et al*. 2019; Sharma and Kaur 2021）。\n\n此外，基于种群的多解元启发式算法提供的结果比单解元启发式算法更好（Sakr\
  \ *et al*. 2019; Sharma and Kaur 2021）。因此，`GWO` 算法适用于解决特征选择问题。\n\n因此，在本章中，`GWO`\
  \ 将与包装二值特征选择方法相结合（Emary *et al*. 2016）。二值特征选择可以通过正向选择或反向消除来完成。\n\n### 3.4.5. 二值特征选择移动\n\
  \n包装式方法允许两种特征选择“移动”：正向选择和反向消除。正向或反向的选择主要取决于选择的二值向量初始化方法。\n\n#### 3.4.5.1. 正向选择\n\
  \n正向选择包括从最小特征开始，然后在选择过程中一个接一个插入特征，直到获得可接受的误差率。\n\n#### 3.4.5.2. 反向消除\n\n与正向选择不同，反向消除过程从最大特征开始，并在选择过程中逐个消除它们，直到获得可接受的误差率。\n\
  \n第 3.8 节中解释的实验结果证明了这两种选择移动的特性。\n\n### 3.4.6. 特征选择对机器学习分类算法的优势\n\n特征选择对机器学习分类算法有许多重益处。我们在这里列出最重要的：\n\
  \n* – 移除冗余和无关数据；\n* – 减少噪声；\n* – 缓解维度诅咒；\n* – 降低分类器复杂度；\n* – 提高监督学习质量；\n* – 提高分类准确率；\n\
  * – 减少分类器响应时间；\n* – 运行分类器时节省资源：内存、CPU、GPU 处理器处理器能量。\n\n考虑到上述优势，特征选择是分类器学习阶段数据处理的关键步骤。作为解决\
  \ NP-hard 多目标优化问题的强大算法，元启发算法 `GWO` 已成为创建成功分类器的基石之一。事实上，特征选择是二值搜索空间中的 NP-hard 多目标优化问题。因此，像\
  \ `GWO` 这样现代且强大的元启发算法能够解决这个问题。但在开发 `GWO` 元启发算法之前，我们必须首先了解二值搜索空间特征选择问题的数学建模。\n\n\
  ## 3.5. 特征选择问题的数学建模\n\n在本节中，我们详细介绍多目标特征选择问题的数学环境：二值搜索空间和需要最小化的目标函数。二值 `GWO` 元启发算法将在合理时间内为该问题提供可的解。\n\
  \n### 3.5.1. 优化问题定义\n\nPatrick Siarry (Collette and Siarry 2002) 将优化定义为“寻找给定函数的最小值或最大值”。因此，是在搜索空间中寻找一个使目标函数最小化或最大的数据向量。我们感兴趣的搜索空间是二值搜索空间。\n\
  \n### 3.5.2. 二值离散搜索空间\n\n二值离散搜索空间是指向量组件只能取离散值 0 或 1 的搜索空间。\n\n具有 `N` 个特征的二值搜索空间\
  \ `N^^N` 中二值向量的数学表示为 ![Image](img/c1-in09.jpg)。\n\n二值搜索空间 `N^N` 用具有 `2^N` 个顶点的超立方体表示。搜索空间\
  \ `N^N` 的 `2^N` 个二值向量位于顶点。例如，对于 `N=3`，`2³` 是一个具有八个二值向量位于八个顶点的立方体，如图 3.10 所示。\n\n\
  ![图 3.10. N=3 的二值搜索空间](img/img3-10.jpg)\n\n**图 3.10.** N=3 的二值搜索空间\n\n因此，对于具有 `N`\
  \ 个特征的特征选择问题有 `2^N – 1` 个解。空向量被忽略，因为它意味着不选择任何特征。\n\n\n\n\n因此，搜索空间 ![Image](img/b.jpg)^(`N*`)\
  \ 随着特征数量 `N` 的增大呈指数级增长。但为什么元启发式算法比其他算法更适用于特征选择问题呢？原因很简单：除非你投入几个小时甚至好几天的时间，否则无法使用确定性方法来解决特征选择问题（Zita\
  \ *et al*. 2010; Sharma and Kaur 2021）。我们需要的是在合理的等待时间内获得一个可以接受的解决方案。然而，文献中充斥着证明基于种群元启发式算法（如\
  \ GWO）有效性的文章。\n\n在进入下一节之前，我们需要理解如何将二进制向量转换为特征选择问题。为了实现这一点，让我们以一个具有 `N` = 6 的数据集为例。搜索空间\
  \ ![Image](img/b.jpg)⁶ 由二进制向量 ![Image](img/c1-in10.jpg) 组成。因此有 63 种可能的解决方案。将每个向量转换为该搜索空间中的特征选择解决方案极其简单：0\
  \ 表示该特征未被选择，1 表示相反。取超立方体的一个顶点：![Image](img/b.jpg)[`p`] = (0,1,0,0,1,0) 。该向量选择了 D2\
  \ 和 D5 两个特征，如图图 3.11 所示。\n\n![图 3.11 特征 D2 和 D5 的选择向量](img/img3-11.jpg)\n\n**图 3.11.**\
  \ *特征 D2 和 D5 的选择向量*\n\n这些二进制向量将由 GWO 元启发式算法产生，作为特征选择问题目标函数的输入。\n\n### 3.5.3. 特征选择的目标函数\n\
  \n我们之前提到，特征选择问题是一个多目标问题，准确来说是一个双目标问题。事实上，我们既必须最大化分类器的准确率，并最小化所选特征的数量。但在设置两个待优化的数学函数之前，有必要定义词汇，以便能够衡量分类器的质量。\n\
  \n#### 3.5.3.1. 准确率\n\n准确率衡量的是正确分类的比例。因此，该比例越高，分类器越能为我们提供良好的答案。\n\n#### 3.5.3.2.\
  \ 错误率\n\n错误率是准确率的补数。它衡量的是错误分类的比例。\n\n准确率和错误率根据真阳性 `TP`、真阴性 `TN`、假阳性 `FP` 和假阴性 `FN`\
  \ 的数量计算。它们的数学定义分别由[方程 \\[3.13\\]](#c03.xhtml#eqn3-13)和[\\[3.17\\]](#c03.xhtml#eqn3-17)提供。为了定义\
  \ `TP`、`TN`、`FP`，让我们以 CNN（卷积神经网络）分类器的具体示例，用于检测图片中的狗。\n\n#### 3.5.3.3. 真阳性 (TP)\n\
  \n这是包含狗且被正确分类的图片数量。\n\n#### 3.5.3.4. 真阴性 (TN)\n\n这是不狗且被正确分类的图片数量。\n\n#### 3.5.3.5.\
  \ 假阳性 (FP)\n\n这是没有狗但被分类为狗的图片数量。\n\n#### 3.5.3.6. 假阴性 (FN)\n\n这是包含狗但被分类为不包含狗的图片数量。\n\
  \n下面的混矩阵展示了 CNN 的结果（源图像：[`www.kaggle.com/`](https://www.kaggle.com/)）。\n\n![](img/c3-01.jpg)\n\
  \n现在让我们设置两个待优化的数学函数。\n\n函数 `A(B[i])` 是取决于二进制向量 ![Image](img/c1-in11.jpg) 的分类器准确率，函数\
  \ `D(B[i])` 是由二进制 `B[i]` 选择的特征数量，`N` 是特征规模。特征选择问题由[方程 \\[3.13\\]](#c03.xhtml#eqn3-13)、[\\\
  [3.14\\]](#c03.xhtml#eqn3-14)和[\\[3.15\\]](#c03.xhtml#eqn3-15)定义：\n\n[\\[3.13\\\
  ]](#c03.xhtml#eqn3-13) ![Image](img/eqn3-13.jpg)\n[\\[3.14\\]](#c03.xhtml#eqn3-14)\
  \ ![Image](img/eqn3-14.jpg)\n\n特征选择问题的两个目标函数 `f1` 和 `f2` 由[\\[3.15\\]](#c03.xhtml#eqn3-15)提供。目标是最大化这两个函数。\n\
  \n[\\[3.15\\]](#c03.xhtml#eqn3-15) ![Image](img/eqn3-15.jpg)\n\n由于这是一个双目标优化问题，有必要找到主导解；最优解位于帕累托边界（Pareto\
  \ border）上，如图图 3.12 所示。\n\n![图 3.12 具有帕累托意义的最优支配解边界](img/img3-12.jpg)\n\n**图 3.12.**\
  \ *具有帕累托意义的最优支配解边界*\n\n为了解决特征选择问题，单目标函数更适合 GWO 元启发式算法。为了实现这一点，只需将两个方程合并为一个通过权重系数连接的方程：`θ`\
  \ `ϵ` \\[0,1\\]\n\n[\\[3.16\\]](#c03.xhtml#eqn3-16) ![Image](img/eqn3-16.jpg)\n\n\
  系数 `θ` 用于为每个函数分配权重，以分配所需目标的重要性：我们是想提高分类器的性能，还是减少特征的数量？因此，这个系数很容易确定。\n\n此外，由于 GWO\
  \ 的本质属性是最小化，因此考虑错误率 `ℰ(B[i])` [\\[3.17\\]](#c03.xhtml#eqn3-17) 比考虑准确率 `A(B[i])`\
  \ [\\[3.13\\]](#c03.xhtml#eqn3-13) 更为方便。同样，与其使用被移除特征率 ![Image](img/c1-in12.jpg)，不如使用被选特征率\
  \ ![Image](img/c1-in13.jpg)。这提供了新的目标函数[\\[3.18\\]](#c03.xhtml#eqn3-18)：\n\n[\\[3.17\\\
  ]](#c03.xhtml#eqn3-17) ![Image](img/eqn3-17.jpg)\n[\\[3.18\\]](#c03.xhtml#eqn3-18)\
  \ ![Image](img/eqn3-18.jpg)\n\n现在我们有了待优化的新单目标函数。这个单目标优化问题在特征选择方法中更易实现。我们将在下部分详细介绍如何将适用于连续空间优化的元启发算法适应到二进制空间优化的元启发算法。\n\
  \n## 3.6. 适应二进制空间优化的元启发算法\n\n文献提供了多种二进制化元启发算法的方法（Crawford *et al*. 2017）。主要分为类：\n\
  \n- 允许保留策略和运算符的两步二进制化；\n- 通过将连续运算符转换为二进制运算符。\n\n第二类方法已成功应用于群体智能元启发算法，如粒子群优化（PSO）（Afshinmanesh\
  \ *et al*. 2005）。然而，这种方法无法推广到同类的其他元启发算法。\n\n本章的目标是通过集成两个新的数学模块 `M1` 和 `M2`，保持 GWO\
