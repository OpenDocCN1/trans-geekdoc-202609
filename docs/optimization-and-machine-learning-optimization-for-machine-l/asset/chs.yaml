  \ 1 所示。\n\n### 5.3.3. *堆叠基于内容的过滤推荐系统*\n\n基于内容的推荐系统将物品属性作为推荐的决定性因素注入。堆叠推荐系统以学习模型的形式为每个用户生成用户画像。首先，推荐系统从物品描述或评论中提取“标签”，并借助于斯坦福大学预训练的\
  \ GloVe 向量（Pennington *et al*. 2014）来计算每个物品的嵌入向量。之后，推荐系统采用堆叠集成学习技术来学习每个用户的画像，如图\
  \ 5.4 所示。\n\n令 `L = {L*[1]*, L*[2]*, ..., *L[l]**}` 为不同的回归模型，`x[train]` 为训练数据集。`U`\
  \ 和 `emb` 是自变量。基础回归模型的超参数为 `∀l ∈ L θ[*l*]`。回归算法的数量和类型是可调的。\n\n![Figure 5.4. 堆叠基于内容的过滤推荐系统](img/img5-4.jpg)\n\
