  \n**Alvise DE’ FAVERI TRON**\n\n*意大利理工学院 di Milano, 米兰, Italy*\n\n## 8.1 引言\n\n\
  ### 8.1.1 入侵检测系统\n入侵检测（Intrusion Detection）是现代网络安全中的一个关键概念。入侵检测与入侵防御系统（`IPS`）通过阻止进入网络所需的连接来保护网络免受已知恶意软件不同，它旨在分析网络的当前状态并识别系统中正在发生的潜在异常，并在发现后立即进行报告。这使得检测此前未知的恶意软件成为可能（Mukherjee\
  \ et al. 1994）。\n\n入侵检测系统通常分为以下几类（Lazarevic et al. 2003）：\n\n- **异常检测与滥用检测（Anomaly\
  \ versus misuse detection）**：在滥用检测中，数据集中的每个实例都被标记为“正常”或“入侵”，并在标记数据上训练学习算法。另一方面，异常检测方法通过构建正常数据的模型，并检测观测数据中偏离正常模型的偏差情况。\n\
  - **基于网络与基于主机（Network-based versus Host-based）**：网络入侵检测系统（`NIDS`）部署在网络内的战略点以监控流量，并可以识别网络中的可疑行为并将每个连接分类为正常或异常。\n\
  \n### 8.1.2 人工神经网络\n人工神经网络（`ANN`）是受人类大脑启发的监督机器学习算法。其核心思想是让许多被称为`神经元`的简单单元分层组织。在馈馈`ANN`中，某层的所有神经元都连接到下一层的所有神经元，依此类推直到最后一层，最后一层包含了神经网络的输出。这种网络在数据挖掘技术中是一种流行选择，并且已被证明是入侵检测的价值选择（Reddy\
  \ 2013; Subba et al. 2016）。\n\n在这里，我们正在构建一个在`NSL-KDD` 数据集上训练的前馈神经网络，用于将网络连接分类为两个可能的类别：正常或异常。这项工作的目标是最大化识别新数据的准确性，同时避免过拟合——过拟合发生在算法过度依赖数据，且无法对未见数据进行泛化时。\n\
  \n### 8.1.3 NSL-KDD 数据集\n用于训练和验证数网网的数据集是 `NSL-KDD` 数据集，它是 `KDD ‘99` 数据集的改进版本（Dhanabal\
  \ and Shanthajah 2015; Thomas and Pavithran 2018）。该数据集是入侵检测领域广名的基准，为每个实例提供 42 个特征。该数据集来自新布伦瑞克大学网站。数据集的详细分析见下一节。\n\
  \n## 8.2 数据分析\n本节提供了 `NSL-KDD` 数据集的完整分析。\n\n### 8.2.1 数据摘要\n`NSL-KDD` 数据集以两种形式提供：带有二进制标签的\
  \ `.arff` 文件和带有分类标签的 `.csv` 文件。由于本文目的是构建一个二分类器，我们将只关注 `.arff` 文件。提供的 `.arff` 文件包含约\
  \ 148500 条目。训练集和测试集是通过合并提供的 `.arff` 文件并按 80:20 的比例划分生成的。表 1 包含了数据集最重要的属性摘要。\n\n\
  | 数据摘要 |\n| :--- | :--- |\n| 总行数 | 148517 |\n| 列 | 42 |\n| 重复项 | 629 |\n| 空值 | 无\
  \ |\n\n### 8.2.2 特征\n对于该数据集的特征，它们可以分为四类（排除目标列）：\n\n- 6 个分类特征；\n- 5 个二进制特征；\n- 15\
