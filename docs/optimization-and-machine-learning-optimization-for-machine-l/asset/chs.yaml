  \  `µ`：隶属函数\n\n## 7.6 仿真与结果\n\n为了实现前面章节开发和描述的控制架构，在这一部分我们实现了一个基于传感器信息的未知环境局部规划器。移动机器人必须根据环境的变化做出决策；实施的程序确定机器人和目标的位置。所实现的仿真器基于多智能体系统（MAS）与模糊逻辑的混合。使用编程工具（`Borland\
  \ 5 c++`），该实现允许我们可视化在不同环境下的导航结果。\n\n针对不同的目标和机器人配置模拟了多次导航测试。图 7.26 和 7.27 显示了机器人到达目标的路径。\n\
