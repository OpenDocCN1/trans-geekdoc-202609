  \n# 4\n\n## 使用混合反应贪婪自适应搜索程序解决混合装配线问题\n\nBelkharroubi LAKDAR 和 Khadidja YAYAUI\n\n\
  *阿尔及利亚马斯卡拉大学*\n\n为了满足客户对不同产品的需求，许多行业使用特殊的混合装配线，以混合顺序对不同型号进行组装。在设计此类生产线时，必须解决一个关键问题——混合装配线问题，以最小化工作站数量（类型\
  \ 1）或循环时间（类型 2）。本章解决确定性任务时间的类型 2 混合装配线问题。为了解决这一问题，提出了一种贪婪随机自适应搜索程序（GRASP）的改进方法，被称为反应式\
  \ GRASP。这种反应式版本基于限制候选列表参数 `alpha` 值的变化，而基础版本基于固定值。`alpha` 值的变化有助于算法找到固定值无法找到的更好解决方案。此外，基础\
  \ GRASP 的局限在于未能充分利用之前的迭代；利用之前的信息可以影响构建阶段。我们提出的反应式 GRASP 与排名位置启发式算法混合以构建初始解决方案；然后在局部搜索阶段应用邻域搜索程序以改进构建的解决方案。将混合反应式\
  \ GRASP 的结果与基础 GRASP 的结果进行比较，以证明学习机制在扩展搜索空间方面的作用，从而增加发现良好解决方案的机会。\n\n## 4.1. 引言\n\
  \n\n\n\n\n# 组配线\n\n组配线是一种生产系统，包含若干个串联排列的工作站，并由输送带等物料处理系统相互连接。在每个工作站中，由不同的操作员（如人类、机器人和机器）执行一组任务。1913\
  \ 年，亨利·福特（Henry Ford）首次将组配线平衡问题（ALBP）应用于汽车工业。其目标是在尊重序关系的情况下，找到任务的最佳分配方案，以优化各项指标（Zhang\
  \ *et al*. 2019）。在文献中，ALBP 分为两类，如图 4.1 *简单组配线平衡问题的分类及其目标*\n\n| **问题** || **目标**\
  \ |\n| --- | --- |\n| `SALBP-1` | 最小化工作站数量 |\n| `SALBP-2` | 最小化循环时间 |\n| `SALBP-E`\
  \ | 最大化线线效率 |\n| `SALBP-F` | 获取可行的平衡 |\n\n![图 4.1. 组配线平衡问题分类](img/img4-1.jpg)\n\n\
  图 4.1. *组配线平衡问题分类*\n\n消除某些 SALBP 假设产生了属于 GALBP 的新 ALBPs（Saif *et al*. 2014）。随着客户对不同型号需求的变化，工业生产被迫在它们的制造系统中应用新类型的生产线来处理这一问题。这些线被称为混合型号组配线或多型号组配线，如图\
  \ 4.2\n\n图 4.2. *混合型号和多型号组配线。需此图彩色版本，请访问 [www.iste.co.uk/chelouah/optimization.zip](http://www.iste.co.uk/chelouah/optimization.zip)*\n\
  \n在混合型号组配线上，不同型号的单元是按任意顺序生产的；而在多型号组配线上，单元是分批生产的（Becker and Scholl 2006）。根据 van Zante-de\
  \ Fokkert 和 de Kok（1997）的研究，混合型号线和多型号线的区别在于批量大小；混合型号线的批量大小为一，而多型号线的批量大小大于一。此外，混合型号线忽略了多型号线批之间所需的准备时间。平衡混合型号组配线也是一个关键问题，它考虑了所有不同的产品型号，被称为混合型号组配线平衡问题（MiMALBP）。它可以分为两类：`MiMALBP-1`和`MiMALBP-2`（Zhang\
  \ *et al*. 2019）。MiMALBP 的解决涉及与 SALBP 类似的特定目标。MiMALBPs 的分类及其目标如表 4.2 *混合型号组配线平衡问题的分类及其目标*\n\
  \n| **问题** || **目标** |\n| --- | --- |\n| `MiMALBP-1` | 最小化工作站数量 |\n| `MiMALBP-2`\
  \ | 最小化循环时间 |\n\n与 SALBP 不同，在 MiMALBP 中，每个型号都有自己的序关系图。为了平衡混合型号线，可以通过将所有型号的图合并为一个综合序关系图，将问题转换为\
  \ SALBP。因此，所有任务都根据新图分配到工作站，不同型号的相似任务被分配到相同的工作站。这使得准备时间减少到可以忽略的极值（Saif *et al*. 2014）。\n\
  \n在组配线上，任务时间可以是确定性的、变异的、随机的或不确定的。确定任务时间被假设为一个固定变量，并且假设它在生产过程中保持不变。通常情况下，具有执行简单任务的可靠操作员的组配线减少了任务时间的波动；因此被认为是确定性的。变异任务时间通常考虑体力工人执行一组任务的组配线；因此，任务时间会根据不同的工人因素而变化。这些因素可能与他们执行任务的技能水平、经验、动机以及组内的沟通能力有关。机器故障也会导致任务时间的变化。最后，随机或不定的任务时间被视为未知变量，在文献中，研究人员使用了不同的方法来表示不变量，例如模糊变量和独立正态分布变量（Becker\
  \ and Scholl 2006; Rekiek and Delchambre 2006）。\n\n在文献中，已有研究针对 1 型 MiMALBP 和 2 型\
  \ MiMALBP 进行了求解。在本章中，我们解决 2 型 MiMALBP，因为其对提高生产率非常重要。因此，目标是在给定的工作站数量下找到最佳平均循环时间，以满足在同一条线上组配的所有相似产品的负载。在某些情况下，混合型号组配线上某些工作站的负载可能会超过循环时间，导致工作过载。为了最小化生产期间线过载次数，必须解决另一个问题：混合型号排序问题（MMSP）（Becker\
  \ and Scholl 2006）。MMSP 并不是本研究的一部分。\n\n## 4.2. 文献中的相关工作\n\n文献中的多项工作通过不同方法处理以最小化循环时间为目标的\
  \ MiMALBP。例如，Zhang *et al*.（2019）针对具有区间任务时间的稳健 2 型 MiMALBP 提出了一种混合遗传算法（HGA），结果表明所提的\
  \ HGA 能够高效求解此类规模问题。Aufy *et al*.（2020）使用连续启发式算法平衡 2 型 MiMALBP，使用了一种适用于直型和 U 型线的启发式模型。Raj\
  \ *et al*.（2016）提出了一种使用并行工作站的遗传算法迭代程序来求解 2 型 MiMALBP，以便在预定义的操作员数量下最大化组配线的生产率。\n\n\
  \n\n\nRabbani *et al.* (2016) 提出了一种用于求解机器人型混合模型装配线平衡问题（MiMALBP）二的多目标元启发式算法。这些提出的启发式算法是针对\
  \ U 型装配线开发的，第一种是非支配排序遗传算法 `NSGA-2`，第二种是多目标粒子群优化 `MOPSO`。结果显示，通常在解决不同规模的问题时，`NSGA-2`\
  \ 在性能方面优于 `MOPSO`。Lalaoui 和 Afia (2019) 提出了一种使用模糊控制器的响应型广义模拟退火算法（`GSA`）来解决 MiMALBP\
  \ 二。该模糊控制器被引导算法在早期迭代中探索整个搜索空间，结果显示这种方法比其原始对应方法可以获得更好的解决方案。Çil *et al.* (2020) 建立了一个数学模型并实现了一种蜂群算法来解决具有物理人机协作的\
  \ MiMALBP，以最小化模型的循环时间。该数学模型被用于求解小规模问题，蜂群算法用于求解大规模问题，结果表明所提出的模型和算法可以帮助经理有效地解决 MiMALBP。\n\
  \nRamezanian 和 Ezzatpanah (2015) 开发了一种新型帝国主义竞争算法，用于解决多目标混合模型装配线平衡和人员分配问题。最小化循环时间是第一个目标，与工人相关的成本是第二个要最小化的目标。结果显示，所提出的\
  \ `ICA` 在寻找接近目标值方面表现良好。Aghajani *et al.* (2014) 提出了一种整数规划模型，用于求解具有机器人设置时间的二的机器人混合模型双边装配线，以最小化给定配对站数量的循环时间，并使用模拟退火元启发式算法来避免求解大规模问题时巨大的计算时间。为了评估\
  \ `SA` 的性能，使用 `SA` 和名为 General Algebraic Modeling System（通用代数建模系统的软件求解了四个问题，通过比较结果发现，`SA`\
  \ 在更短的时间内比 `GAMS` 软件更有效地找到最优解，并用于解决大规模问题。Rabbani *et al.* (2012) 处理了具有多种 U 型布局的混合模型双边装配线平衡问题，以最小化循环时间和工作站数量，他们开发了一种混合整数规划问题公式来此类制造系统建模，并由于其复杂性，开发了一种基于遗传算法的启发式算法来求解。结果表明，所提出的框架在灵性和制造资源利用方面优于文献中的现有方法，以加速生产率。Çil\
  \ *et al.* (2017) 开发了一种基于束搜索的高效启发式算法，通过最小化所有模型的循环时间和来解决二机器人 MiMALBP。提出的算法与数学模型进行了比较，证明了其在解决不同基准问题上的效率，结果表明它是一个竞争工具。Tang\
  \ *et al.* (2016) 提出了一种带有逻辑字符串的 `HGA`，用于平衡具有顺序任务的混合模型装配线，以优化循环时间和工作负载差。混合了三种启发式算法以提高初始解种群质量。结果显示，所提出的算法可以用较少的计算量解决近优甚至是最优问题。\n\
  \n## 4.3. 问题描述与数学建模\n\n### 4.3.1. 问题描述\n\n对于给定的串联排列的工作站数量 `K`，必须找到最优循环时间 `C`。具有相似特征的不同型号产品\
  \ `M` 在同一条生产线上装配，每个型号都有自己的优先关系图 `G`，该图决定了任务 `T` 的执行优先级。任务时间是确定的，可能随型号而异；对于装配型号 `m`\
  \ 不需要的任务将通过将其处理时间固定为 `0` 来忽略。每个任务 `i` 被分配给一个工作站，并且在它的所有后继任务 `Si` 之前执行。因此，分配任务 `i`\
  \ 的工作站索引必须小于或等于分配该任务后继任务的所有工作站索引。分配到同一工作站的任务时间之和不能超过循环时间 `C`。为了根据这些信息平衡混合模型装配线，有两种方法：根据每个型号的优先关系图对每个型号进行生产线平衡，或者通过合并所有型号的图形成一个被称为组合优先关系图的最终图。第二方法是最常用的，因为它有助于找到所有型号的平均循环时间，并保证型号之间的公共任务被分配到同一个工作站。\n\
  \n所讨论的 MiMALBP-2 有以下假设：\n\n* – 装配线是串联的；\n* – 工作站数量已知且固定的；\n* – 每个型号的任务时间是确定的；\n\
  * – 公共任务必须分配到同一个工作站；\n* – 组合优先关系图通过合并不同型号的优先关系图得到；\n* – 任务分配受优先关系约束。\n\n### 4.3.2.\
