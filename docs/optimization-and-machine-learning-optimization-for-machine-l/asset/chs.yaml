  \n![图 7.27. 机器人在复杂环境（环境 3 和 4）中到达目标（避开了所有障碍物）。该图的彩色版本，请参见 www.iste.co.uk/chelouah/optimization.zip](img/img7-27.jpg)\n\
  \n图 7.27. *机器人在复杂环境（环境 3 和 4）中到达目标（避开了所有障碍物）。该图的彩色版本，请参见 [www.iste.co.uk/chelouah/optimization.zip](http://www.iste.co.uk/chelouah/optimization.zip)*\n\
  \n所采用的导航方法处理了机器人阻塞的情况。在死锁情况下，`fuzzy controller` 向运动代理发送一个停用消息以停止机器人，如图图 7.28 所示。\n\
