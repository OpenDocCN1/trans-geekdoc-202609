  \ 13, 55.\n\n基于多智能体系统和模糊逻辑用于机器人自主导航的混合方法\n\n**Khadidja YAHYAOUI**\n*马斯卡拉大学*\n\n\
  架构的设计是实现机器人项目中的核心问题。在没有一种方案可以涵盖所有方案的情况下，开发新方法是有关重要的。在这种背景下，本章提出使用多智能体范式和基于模糊逻辑推理机制来设计。架构必须考虑的约束（避免障碍、不与墙碰撞、未知环境、到达目标），基于代理的智能体系统以及围绕若干认知和反应代理构建的分布式架构，它们相互协作。我们的方法使我们能够\n\
  \n## 7.1 引言\n\n工业主要使用低自主性机器人来执行重复任务，以降低成本。机器人可以用于对人类危险的任务，例如地下矿井、化学或核能设施、水下世界和行星探索。因此，对人类敌意的环境是人们对具有增强自主性的机器人兴趣增加的根源。\n\
  \n我们选择混合方法和模糊逻辑的原因如下：\n\n*   模糊逻辑的调整和控制原理接近人类方法，因为处理的变量不是逻辑变量（例如二进制逻辑），而是接近人类语言的语言变量。此外，这些语言变量使用关于控制系统行为的规则进行处理（Buhler\
  \ 1994）。\n\n\n\n\n\n*   多智能体系统（MAS）理想上设计并实现为一组相互作用的智能体，通常以合作、竞争或共存模式存在（Chaib-draa\
  \ 1994; Ferber 1995; Moulin and Chaib-draa 1996; Chaib-draa *et al.* 2001）。移动机器人的控制架构是一种允许从基础单元构建复杂系统的组织，这些基础单元是每个负责特定子问题解决的多个模块（Ahmadzadeh\
  \ and Masehian 2015）。在此背景下，这种基于控制架构的 MAS 开发允许了感知、决策和动作函数的协调。\n\n*   本章其余部分的结构如下：第\
  \ 7.2 节作为相关工作，提供了移动机器人导航的关键方法。第 7.3 节介绍了问题定问题。在第 7.4 节中，我们描述了基于代理的控制架构。所采用的方法将在第\
  \ 7.5 节中解释。第 7.6 节提供了对智能体系统评估方法的讨论，最后第 7.7 节总结了本章。\n\n## 7.2. 相关工作\n\n移动和自主机器人技术是人工智能（AI）新方法的出现将产生有趣影响的研究领域之一。从经典方法（数学和算法）向行为方法（基于认知、学习、涌现和具身性等概念）的转变绝非易事，因为这涉及到心态的根本性变化以及机器人控制架构设计上的重大变革。这些架构面临的主要挑战是在面对复杂且动态的环境时，产生所谓的“智能”行为，例如自主性、学习、适应性、审议、意图等许多方面（Holzmann\
  \ *et al.* 2005）。因此，移动机器人的导航方法分为两类：经典方法和先进方法。环境的性质决定了导航方法。对于已知或部分已知的环境，我们选择传统方法；另一方面，如果环境未知，则在图\
  \ 7.1 中展示了当前的方法。在这种情况下，无法提前为机器人进行轨迹规划。\n\n![Figure 7.1. 移动机器人导航方法](img/img7-1.jpg)\n\
  \n图 7.1. *移动机器人导航方法*\n\n### 7.2.1. 经典方法\n\n这些方法的共同点是环境是完全或部分已知的，即静态且直观的环境。因此，移动机器人可以规划出一条避开障碍的连续轨迹。这些方法基于空间配置和所谓的势场法。\n\
  \n#### 7.2.1.1. 基于空间配置的方法\n\n这是基于单元格分解过程的一种技术，使用机器人环境的离散表示。精确分解会得到一组多边形。这些方法基于空间配置和所谓的势场法。\n\
  \n#### 7.2.1.2. 势场法\n\n这是是基于单元格分解过程的一种技术，使用机器人环境的离散表示。精确分解会得到一组多边形。这些方法基于空间配置和所谓的势场法。\n\
  \n### 7.2.2. 先进方法\n\n移动和自主机器人技术是人工智能（AI）新方法的出现将产生有趣影响的研究领域之一。从经典方法（数学和算法）向行为方法（基于认知、学习、涌现和具身性等概念）的转变绝非易事，因为这涉及到心态的根本性变化以及机器人控制架构设计上的重大变革。\n\
  \n\n\n\n多智能系统（MAS）受到了不同领域学者的极大关注，特别是在移动机器人领域。将智能体应用于机器人领域已经研究了二十多年，第一篇发表于 1996 年的文章概述了智能体在机器人中的优缺点（Jenkin\
  \ *et al*. 1996）。基于 MAS 的控制架构已为移动机器人的自主导航进行了建模。Iñigo-Blasco *et al*. (2012) 提出了一个多智能机器人系统的开发框架。Elfakharany\
  \ *et al*. (2020) 了一种通过深度强化学习模型结合两个步骤的方法：多机器人任务分配（MRTA）和多机器人路径规划（MRPP）。设计了一种基于多传感器融合（HBMF）的混合体传感器网络架构，以支持最先进的智能医疗服务，这些服务结合了各种传感器、通信、机器人数据处理技术。这项研究在\
  \ Lin *et al*. (2020) 中实现。\n\n## 7.3. 问题定位\n\n图 7.2 代表了移动机器人的全局架构；它是文献中描述的机器人架构的综合。\n\
  \n该架构的核心部分是感知模块、决策模块和运动模块。\n\n- **感知模块**：移动机器人中的感知概念涉及系统收集、处理和格式化对机器人有用信息的能力，以便其对周围的世界采取行动并做出反应。虽然在处理任务时，我们可以认为机器人环境是相对结构化的，但在部分未知区域进行自主导航时，情况就不再如此。此外，为了提取完成任务所需的有用信息，机器人必须拥有许多传感器，同时测量其内部状态和运行环境。传感器的选择显然取决于预期应用。为了专注于导航问题，本章将将讨论对该任务有用的传感器。\n\
  \n![图 7.2. 机器人架构结构](img/img7-2.jpg)\n\n**图 7.2.** *机器人架构结构*\n\n- **决策模块**：来自各种传感器的信息必须被解释为对所采取行动做出决策的有用元素，目标是向执行器、夹爪臂或轮电机发送正确的指令。在机器人设计的这一阶段，有必要赋予它形式的智能，通过对其采取的行动提供选择。这种决策在开始时是随机的，但它有助于形成一种考虑之前决策结果的学习形式。\n\
  \n- **运动模块**：运动模块随后由机械结构、动力以及移动机器人运动中使用的能量组成。移动机器人通常根据运动类型来命名，无论是轮式、步行式、潜水式还是飞行。。目前为止，不同的研究实验室根据运动类型对构建不同的移动机器人做出了贡献。\n\
  \n然而，我们注意到架构从分层架构向“智能”的演进，这伴随着向更具“自主”结构的“趋势”，这些结构局部管理其属性（组织、决策、行动、信息、通信、安全等），并利用这些属性来实现相同的目的和目标（Lin\
  \ *et al*. 2020）。\n\n我们的问题是如何对一个能够满足各种且有时矛盾要求的系统建模。\n\n## 7.4. 开发架构\n\n该系统围绕四个智能体（感知、运动、模糊控制器和可行性）设计。它们被分为两组。第一组包含感知智能体和运动智能体，它们具有访问并作用于环境的能力。另外两个——模糊控制器智能体和可行性智能体更具认知性，被严格禁止直接访问环境。每个智能体在导航期间都尝试独立为系统做出贡献。\n\
  \n机器人是一个复杂系统，通过其传感器感知世界并通过其执行器对其作用（感知-动作循环）。我们希望传感器和电机之间建立一种关系以获得所需的行为。开发的全局架构是完全分布的，不涉及任何主管。智能体可以通过社区可用的消息（邮箱）或数据（表示）与它们进行通信。\n\
  \n图 7.3 显示了基于智能体的移动机器人控制架构描述。该架构使得组织一组智能体的协调成为可能。\n\n![图 7.3. 基于智能体的移动机器人控制架构](img/img7-3.jpg)\n\
  \n**图 7.3.** *基于智能体的移动机器人控制架构*\n\n### 7.4.1. *智能体描述*\n\n#### 7.4.1.1. *感知智能体*\n\n\
  感知智能体根据红外传感器提供的测量值创建环境表示。对于每个中间情况，这些表示都会提供给其他智能体。能力包括：\n\n- 给出机器人的当前配置。\n- 确定目标相对于机器人的位置（距离和方向）。\n\
  - 为每个新情况确定障碍物相对于机器人的位置。\n- 计算环境墙壁的距离和方向。图 7.4 说明了这些测量值的计算。\n\n![图 7.4. 红外传感器提供的测量值（感知智能体的信息并提供给所有智能体）](img/img7-4.jpg)\n\
  \n**图 7.4.** *红外传感器提供的测量值（感知智能体的信息并提供给所有智能体）*\n\n#### 7.4.1.2. *运动智能体*\n\n也被称为动作智能体。它建立了用于控制机器人的律。这些指令是从模糊控制器智能体建立的表示。此外，运动智能体在机器人停止时激活感知智能体启动新的导航。*该智能体计算左右轮的速度设定值，以便到达中间或最终配置*。\n\
