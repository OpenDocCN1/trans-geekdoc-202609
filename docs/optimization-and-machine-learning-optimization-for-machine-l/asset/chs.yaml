  \n\n\n\n贪婪随机自适应搜索程序（`GRASP`）是一种多启动元启发式算法，它每次迭代包含两个阶段：构建阶段和局部搜索阶段。在构建阶段，使用两个列表构建一个可行解：候选列表（`CL`）和受限候选列表（`RCL`）。`CL`\
  \ 由所有可以添加到部分解中且不破坏其可行性的元素组成，然后通过贪心函数对所有元素进行评估，并选择增量成本最小的最佳元素形成 `RCL`。\n\n`RCL` 的限制要素要么基于元素数量（基于基数的），要么是基于元素的质量（基于价值的）。在基于基数的情况下，`RCL`\
  \ 可以包含 `E` 个具有最佳增量成本的元素，其中 `E` 是一个参数。在基于价值的情况下，`RCL` 的元素数量取决于参数 `α`，其中 `α` ϵ [0,\
  \ 1]，且阈值值为 `TC[th] = + α * (T[max] – T[min])`，其中 `T[min]` 和 `T[max]` 分别是最小和最大的增量成本。`CL`\
  \ 中增量成本不大于阈值的所有元素被插入 `RCL` 中。从 `RCL` 中随机选择一个元素添加到部分解中，一旦选择了元素，`CL` 就会更新。\n\n构建的解并不一定是最优解，因此它被传递到局部搜索阶段。局部搜索算法通过当前解邻域内的更好解来替换当前解，如果没有找到更好的邻域则停止。在每次迭代结束时，将局部搜索阶段找到的解与之前保留的最优解进行比较，如果它具有更好的目标值，则替换之前的解并成为找到的最佳解（Glover\
  \ and Kochenberger 2003; Marti et al. 2018）。\n\n## 4.5. 反应式贪婪随机自适应搜索程序\n\n基础 `GRASP`\
  \ 的主要缺点是由于丢弃所有关于所得解的信息，无法从之前迭代的历史中学习。已经提出了各种让 `GRASP` 从之前的迭代中学习的增强方案，这些方案影响构建阶段：反应式\
  \ `GRASP`、记忆与学习、成本扰动、基于部分构建解的局部搜索以及偏差函数（Marti et al. 2018）。\n\n反应式 `GRASP` 是由 Prais\
  \ 和 Ribeiro (2000) 首次提出的基础 `GRASP` 的第一种增强，用于寻找时隙分配问题的近似解。这种反应式版本的 `GRASP` 在构建阶段中整合了学习机制的概念。在每次\
  \ `GRASP` 迭代中，`α` 参数的值从离散的可能值集合 `Alpha = {α[i],… α[n]}` 中随机选择，使用的概率为 `P[i]`，`i=1,...,\
  \ n`，其中 `n` 是 `α` 的可能值的数量。这些概率取决于之前获得的解。\n\n在第一次 `GRASP` 迭代中，所有可能的 `α` 值具有相同的选择概率\
  \ `P[i]=1/n`。在随后的任何迭代中，令 `Ẑ` 为找到的最佳解，并令 `A[i]` 为使用 `α = α[i]` 找到的所有解的平均值，`i=1,...,\
  \ n`。\n\n```\nP[i]=1/n\nA[i] = average value of all solutions using α = α[i]\n```\n\
