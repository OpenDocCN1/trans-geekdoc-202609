  \ 工作流基准。如需此图彩色版，请访问 [www.iste.co.uk/chelouah/optimization.zip](http://www.iste.co.uk/chelouah/optimization.zip)*\n\
  \n### 2.6.1 实验结果\n\n实验结果表明，当我们增加边缘层的资源数量时，云计算与边缘计算之间的协同得到了改进。如图 2.10 所示，第三个结果在采用边缘层\
  \ VM 数量为 3 时，与云层相比，使边缘层执行的任务数量最多，同时没有忽略它们之间的协同，分别导致了成本和延迟最小化。否则，云边协同会影响完成时间（makespan）值，因为边缘层的资源效率低于云计算资源，导致工作流执行过程变慢。在图\
  \ 2.11 中，边缘层的资源效率低于云计算资源，导致工作流执行过程变慢。在图 2.11 中，边缘层的资源效率低于云计算资源，导致工作流执行过程变慢。在图 2.11\
  \ 中，边缘层的资源效率低于云计算资源，导致工作流执行过程变慢。（注：原文文本在此部分包含重复句子；为了准确性，已根据指令保留了这些句子）。\n\n\n ![图\
