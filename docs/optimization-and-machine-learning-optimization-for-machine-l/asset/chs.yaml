  \n在进行审计时，利用所有与审计范围或主题相关的可用信息可以提高结果的质量。分类审计中的文本文档（非结构化数据）可以利用额外信息来改进现有的结构化数据，从而为审计提供更好的知识。为了给知识发现提供更好的支持，可以应用自然语言处理（NLP）。本章比较了结合高级词嵌入的经典机器学习和深度学习算法，用于分类内部审计报告的发现。\n\
  \n## 6.1. 引言\n\n\n\n\n\n根据内部审计协会（IIA，2012）的定义，内部审计是“一种独立的、客观的保证和咨询活动，旨在为组织增加价值并改进其运营”。为了实现这一目标，审计师努力收集与组织有关的所有可用信息——无论内部还是外部。这些信息可以是结构化或非结构化数据的形式存在，审计师通过对其进行分析以提供有用的见解。考虑到如今产生的数据量，高效地使用数据工具至关重要。\n\
  \n数据科学广泛应用于财务和会计领域，各种相关文章和研究工作均证明了这一点。通常，人们使用多种不同的财务参数进行欺诈检测。然而，在过去的十年里，研究人员已利用自然语言处理（NLP）通过文本信息进行了研究。然而，与其他研究领域相比，审计在利用这些方法方面仍然落后（Gepp\
  \ *et al.* 2018）。\n\n深度学习（DL）无疑是人工智能背后的驱动力，它通过采用深层层次神经网络加速了自动化系统的质量，在这些神经网络中，复杂且抽象的特征（大多数经典机器学习（ML）算法无法识别的）很容易被检测到。利用深度学习力量的文本分析在审计领域的使用持续增长，特别是在欺诈检测的自动化方面。审计行业已经意识到需要对文本大数据进行分析，以增强审计的质量和相关性（EY_Reporting\
  \ 2015）。四大会计师事务所之一的德勤在其内部开发的“文档审查”平台中使用深度学习。同样，安永（原安永华）使用应用人工智能（AI）对租赁合同进行分析。值得注意的是，根据《福布斯》的一份报告，安永的欺诈检测系统准确率达到\
  \ 97%。此外，德勤的“Kira”平台以 D-ICE 的命名在其审计业务中使用。鉴于欺诈者使用的新颖方法，参与德勤 2016 年“未来审计”调查的 84% 的\
  \ 财务报表编制者、76% 的审计委员会成员和 70% 的财务报表使用者表示需要先进技术（EY_Reporting 2015）。\n\n随着审计变得越来越普遍，越来越多的财务欺诈案件被揭露，用于实施此类欺诈的技术正变得更加先进和多产。用于欺骗利益相关者和其他关联实体的最常见技术是印象管理（Jaafar\
  \ *et al.* 2018）。然而，由于大多数公司倾向于从事印象管理（无论财务状况如何，将其作为增强和参与回顾性意义构建的手段），通过其印象管理技术来跟踪欺诈公司是困难的。\n\
  \n总而言，现实世界中的大量文档没有标记，或者只有一小部分被归类。因此，将无监督或半监督算法应用于这些文档——将其自动归类为欺诈或非欺诈——是强制性的。然而，对这些文档进行分组的复杂性和误分类的风险仍然存在。\n\
  \n机器学习、深度学习和文本数据领域的许多工作建议使用标准财务比率来识别欺诈公司。然而，写作风格、评估技术、分析技术和报告程序各不相同。因此，在内部审计的情况下，仅关注财务方面以试图隔离需要进一步调查的领域（解决差异并实施纠正措施）是不可能的。\n\
  \n因此，在本章中，我们仅将文本信息与近年来开发的先进技术结合使用。我们对机器学习算法与高级词嵌入的各种组合进行了详尽比较。这种比较揭示了自动化识别文档内或多份文档内风险和非风险部分的最快且最有效的技术。\n\
  \n将整个文档或文档内内容自动分类为“风险”或“非风险”，将成为审计师为需要进一步人工分析的文档或审计对象创建风险排名的有效工具。\n\n我们的主要重点是比较使用经典词嵌入技术（例如双词和\
  \ TF-IDF）的机器学习和深度学习模型的性能。我们还测试了使用先进前沿词嵌入性能，如 `Word2Vec`、`Word2Vec-Avg`、`FastText`\
  \ 和 `GloVe`。我们使用经典的机器学习分类算法和深度学习模型演示了实验，即 `CNN`（卷积神经网络）、`LSTM`（长短期记忆）和 `BERT`（基于变换的双编码器表示）。\n\
  \n本章结构如下。第 6.2 节 使用人工神经网络（ANN）和决策树（DT）等经典机器学习技术，结合审计师意见和其他财务变量；这些变量包括公司的流动性比例和运营效率，并接受了柯尔莫哥夫-斯米尔诺、夏皮罗-威尔克和曼检验。另一项使用\
  \ `DT`、`NN` 和贝叶斯网络的实验在一个包含 76 家希腊制造公司的数据集上进行，其中 38 家被审计师归类为欺诈。神经网络分类器的准确率为 100%（Desai\
  \ and Deshmukh 2013）。\n\n另一项研究使用了数据挖掘技术，如多层前馈（MLFF）神经网络、支持向量机（SVM）、遗传规划（GP）、数据处理分组（GMDH）、逻辑回归（LR）和概率神经网络（PNN），对\
  \ 202 家中国公司进行了无特征选择的研究（Ravisankar *et al.* 2011）。同样，Yim (2011) 考虑了 100 家土耳其公司的财务比率，并使用了决策树和\
  \ `NN` 等分类器。\n\n\n\n\n\nYim (2011) 采用了一种新的标记方法，其中涉及欺诈评分。通过对 72 家公司进行欺诈评分赋值，将它们标记为欺诈或非欺诈。利用九个财务属性，测试了线性回归、`NN`、`KNN`、`SVM`、`Decision\
  \ Stump`、`M5P Tree` 和 `Decision Table` 等方法。结果发现随机森林是性能最好的模型（Yim 2011）。\n\nAbulaish\
  \ and Sah (2019) 提出了一种基于 n-grams、隐狄利利克分配（`LDA`）技术以及 `CNN` 的 `DL` 技术的数据增强方法，用于识别特定类别的词汇以丰富底层语料库并提高分类器性能；该方法根据类别标签丰富语料库。\n\
  \n某些研究（Mahmoud Hussein 2016）表明，未词干化的语料库使用 `SVM` 和 `Naive Bayes` 分别达到了 87.79% 和 88.54%\
  \ 的准确率。相比之下，词干化语料库的准确率较低，分别为 84.49% 和 86.35%。因此，我们尝试对词干化和未词干化的语料库使用传统的机器学习算法，以验证它们在内部审计文档分类案例中的性能。\n\
  \n`DL` 模型证明在文本分类方面比经典的 `ML` 更为合适（Yin *et al.* 2017; Young *et al.* 2017; Menger\
  \ *et al.* 2018），并使用双词组、`TF-IDF`、词嵌入和文档嵌入将 `NN`、`NB`、`SVM`、`DT` 与循环神经网络（`RNN`）和\
  \ `CNN` 进行对比。发现 `RNN` 优于其他技术，其他研究人员也是如此（Yin *et al.* 2017）。在俄语推文的情感分析中，对 `Word2Vec`、`CNN`、门控循环单元（`GRU`）和长短期记忆（`LSTM`）进行了公平比较（Arkhipenko\
  \ *et al.* 2016），结果发现 `GRU` 性能优于 `LSTM` 和 `CNN`，而 Chung (2014) 以及 Jozefowicz and\
  \ Zaremba (2015) 则认为 `GRU` 和 `LSTM` 之间没有明显的胜者。\n\n`RNN` 带来的偏置问题可以通过使用无偏的 `CNN` 模型来缓解（Lai\
  \ *et al.* 2015）。`RNN` 通过树结构捕捉文本语义，但很难用这种结构表示两个句子之间的关系。虽然 `RNN` 可以捕捉长文本的语义，但后面的词比前面的词占主导，因此在捕捉整个文档语义时存在限制。\n\
  \n对于较小的数据集执行同义词替换、随机插入、随机交换和随机删除的数据增强，并比较了 `CNN` 和 `LSTM` 的性能（Wei and Zou 2019）。然而，我们的数据集更大，某些单个语料库的最大长度接近\
  \ 100 万个字符。\n\n许多研究人员使用准确率、精确率、召回率和 `F1 score` 等多种指标，取决于建模解决的问题。有趣的是，我们发现准确率并不是不平衡数据集的首选性能衡量标准（Anand\
  \ *et al.* 2010），因为分类器会产生很高的预测准确率。因此，我们考虑其他指标（如精确率、召回率和 `F1 score`）以及准确率来评估分类器的优坏。\n\
  \n必须考虑数据质量和数据治理这两个重大问题（Claudiu *et al.* 2018）；用于文本的数据增强（Wei and Zou 2019）可以提高某些质量，即使对于强度较低的\
  \ `ML` 方法也是如此。在我们的数据集中，我们有高度不平衡的数据，在训练 `ML` 分类器和 `DL` 模型之前需要进行过采样。\n\n受这些研究工作的启发，我们实验使用了经典的\
  \ `ML` 算法，如 `Naive Bayes`（`NB`）、逻辑回归（`LR`）、`NN`、`SVM` 和随机森林；我们还整合了如 `CNN`、`LSTM`\
  \ 和 `BERT` 等 `DL` 模型。我们针对不同的经典词特征提取技术（如 `TF-IDF`、`Word2Vec`、`Word2Vec-Avg`）以及先进的词嵌入技术（即\
  \ `FastText` 和 `GloVe`）对这些不同的算法进行了测试。使用不同词嵌入的机器学习模型和深度学习模型的训练结果详见第 6.3 节](#c06.xhtml#sec6-3)。\n\
  \n### 6.2.1. 词嵌入\n\n除了使用经典的特征表示（如词袋模型 `BoW` 和 `TF-IDF`）测试我们的算法外，我们还使用了先进的词嵌入（如 `Word2Vec`、`Word2Vec-Avg`、`FastText`\
  \ 和 `GloVe`）进行测试。\n\n`Word2vec` 侧重于通过带有线性投影层和非线性隐藏层的神经网络语言模型来提高词表示的质量。神经网络学习的词分布式表示保留了词之间的线性规律，并被发现优于隐语义分析（`LSA`）。通过带有线性投影层和非线性隐藏层的神经网络语言模型提高词表示的质量，优于隐语义分析（`LSA`）（Mikolov\
  \ *et al.* 2013）。虽然 `RNN` 能够捕捉长文本的语义，但后面的词比前面的词更占主导，因此在捕捉整个文档语义时存在限制。`RNN` 通过树结构捕捉文本语义，并使用\
  \ `TF-IDF` 参数来衡量词的重要性（Djaballah *et al.* 2019）。\n\n另一方面，与 `Word2Vec` 不同，`FastText`\
  \ 作为黑盒提供（Bojanowski *et al.* 2017）。在标准多核 CPU 上可以在 10 分钟内训练超过 10 亿个词，并在 1 分钟内分类 32\
  \ 万个句子（Joulin *et al.* 2016）。\n\n最新的词嵌入方法被称为 `GloVe`（词向量表示）。由 Stanford（Pennington\
  \ *et al.* 2014）开发，获取词表示的无监督学习算法。它通过考虑词出现的上下文将语料库转换为矩阵。`GloVe` 利用了全局矩阵分解方法（即 `LSA`）和局部上下文窗口方法（即\
  \ `skip-gram`）。\n\n### 6.2.2. 深度学习模型\n\n#### 6.2.2.1. CNN 架构\n\n`CNN` 是一种多层神经网络架构，专为图像分类开发，接受代表二维（2D）像素和颜色通道的输入。我们将\
  \ `CNN` 架构应用于文本分类，此时输入是一维特征序列。我们通过解析预训练嵌入来计算词到嵌入的映射。这种嵌入索引和词索引被进一步用于计算嵌入矩阵。\n\n\
  我们构建了五层 `CNN` 架构，输出滤波器设置为 200，每层的卷积尺寸从二增加到六；每层后面都有一个池化层。非线性函数 `ReLu`（整流线性单元）应用于所有层，以加速收敛和反向传播。最后，我们使用扁平层来展平输出并将其馈到全连接层。输出层采用了\
  \ `softmax` 函数。\n\n#### 6.2.2.2. BERT 架构\n\n`BERT` 架构的实现分为两个阶段：预训练和微调。在预训练阶段，使用了掩码语言模型（`MLM`）和下一句预测（`NSP`）（Devlin\
  \ *et al.* 2018）。`BERT` 是一种基于 `Transformer` 架构的双向深度神经网络模型。`Transformer` 只使用注意力机制并取代了编码器-解码器实现中常用的循环层（Vaswani\
  \ *et al.* 2017）。与 `RNN` 解决方案相比，`Transformers` 可以并行且所需的计算资源更少。我们的 `BERT` 实现涉及文本预处理，为每个文本添加必要的标记\
  \ `[CLS]` 和 `[SEP]`，随后是 `BERT` 层和池化层。输出层已实现为使用 `sigmoid` 激活函数。\n\n#### 6.2.2.3.\
  \ LSTM 架构\n\n\n\n\n\n循环神经网络在每个时间步都会考虑当前输入 `x[t]` 以及上一个输出 `h[t-1]`，但它们在学习长期依赖关系方面存在困难；这导致了\
  \ `LSTM` 架构的发展。`LSTM` 由一个包含输入和输出主块的循环网络，以及三个门组成：输入门、输出门和遗忘门。\n\n输入块接收来自上一个循环块的信号。输入门是来自数据的新值，而输出门是块输出的过滤后的版本。遗忘门通过应用一个函数来“遗忘”某些元素。我们使用了一个嵌入大小为\
  \ 32 的嵌入层、嵌入维度为 300 的双向 `LSTM` 层以及一个扁平层，随后跟的是一个带有 `softmax` 激活函数的输出层。对于 `GloVe`\
  \ 和 `FastText` 等词嵌入的每情况，我们提取了相应的嵌入权重并将其输入到架构中。\n\n## 6.3 实验与评估\n\n巴西政府的内部审计报告是公开的，可以在互联网上以\
  \ PDF 文件的形式获取。同样，还有大量与政府各个子实体相关的之前的输出信息可以增加价值。\n\n为了找到这些信息，我们创建了一个模型，定义了所考虑的所有数据的类型和限制。由于巴西政府内部审计报告\
  \ (`CGU`) 使用 `JavaScript`，因此无法简单地使用 `wget` 工具获取链接列表来下载文档。为了下载这些数据（通常是上述 PDF 文件），我们使用了\
  \ `Selenium Automation Framework`，该框架附带了无头网页浏览器 `PhantomJS`。下一步是解析 PDF 文件以检索所需的信息。有许多不同的库和工具可以将\
  \ PDF 转换为纯文本文件。在性能和质量方面，我们通过 Apache 软件基金会（Apache Software Foundation）的 `Tika Parser`\
  \ 获得了最佳结果。由于报告在 PDF 中是文本形式，因此没有必要执行 OCR 过程。\n\n每份审计报告包含一个或多个发现，这些发现最初被分类为“informação”（信息）、“constatação”（发现）和“conclusão”（结论）。我们总共解析了\
  \ 8.9 万份文档，并通过 `regex`（正则表达式）从文档中提取必要的片段，编译了结构化数据。\n\n由于缺乏巴西葡萄语词形还原器，我们使用了词干提取（stemming）；因此无法在语义处理无法进行词性识别。词干提取会导致句子中的单词丢失其语境含义，因此在这项研究中，我们同时考虑了语料库的词干和非词干版本，以验证两种情况的结果。\n\
  \n![图 6.1. 测试的文本分类步骤和方法](img/img6-1.jpg)\n\n**图 6.1.** 测试的文本分类步骤和方法\n\n我们按年份对 89,000\
  \ 份文档的数据集进行了划分，选择了 2016–2019 年，以便使用最新的语料库并将我们的测试应用于现代场景。\n\n与欺诈检测数据集一样，审计报告数据集中的标签非常不平衡。高风险发现的百分比仅为约\
  \ 3%。当当我们使用不平衡数据集训练标准 ML 算法时，对应主类的数据将影响结果，导致结果对整个数据集而言是不准确且缺乏代表性的。\n\n对训练数据集进行过采样后，我们使用词袋模型、`TF-IDF`、`Word2Vec`\
  \ 和 `Word2Vec-Avg` 提取特征；我们使用 `Naive Bayes`、`logistic regression`（逻辑回归）、`SVM`、`random\
  \ forest`（随机森林）和神经网络等技术训练了我们的 ML 模型。除了尝试经典的特征提取技术外，我们还使用了流行的词嵌入，即 `FastText` 和 `GloVe`。训练集和测试集按\
  \ 70:30 的比例划分，我们所有的 ML 模型都经过了训练和测试。为了实验 DL 模型，根据上一节讨论的 `CNN` 和 `LSTM` 架构，我们再次使用了相同维\
  \ `FastText` 和 `GloVe` 词嵌入。此外，我们还通过将 `BERT` 应用于我们的场景进行了测试。\n\n在以下段落中，我们将讨论使用经典 ML\
  \ 技术和经典词嵌入的实验。乍一看，随机森林和神经网络技术似乎更好，但实际上结果并不理想，详见下。\n\n随机森林方法在训练集中实现了 100% 的准确率、精确率、召回率和\
  \ F1 分，优于任何其他算法。测试集的准确率为 78%，F1 分为 6%。这种高准确率伴随极低的 F1 分可以解释为数据集非常不平衡，“低”风险标签远多于“高”风险，导致大多数测试集被正确地标记为“低”，从而导致了高准确率；但实际上，这不是一个好的结果。其他算法也是如此。`logistic\
  \ regression` 和 `SVM` 的准确率似乎比 `naive Bayes` 好，但它们也面临模型过拟合的问题。\n\n**表 6.1.** 提取特征和\
