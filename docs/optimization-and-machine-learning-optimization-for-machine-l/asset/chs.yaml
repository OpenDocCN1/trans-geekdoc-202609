  \ 是工作流任务集 `T = (T[1]; ...; T[n])`，其中每个任务 `T[i] $\\in$ T` 由执行 IoT 应用所需的指令集组成。构成 IoT\
  \ 工作流 `G` 的所有任务都由以下特征描述：`Id`（用于区分任务的标识符）、表示指令行数的计算规模 `CS[i]`、地理位置 `GP[i]`（即指定其位置的经纬度值）以及一组前驱任务。`G`\
  \ 中的每个任务 `T[i]` 只有在所有前驱任务都执行后才能被执行。`T` 任务集通过先序约束相互关联，其中任务 `T[i]` 通过弧 `A[ij]` 与其后继任务\
  \ `T[j]` 连接，该弧的特征是通信权重 `CW[ij]`，它表示必须从 `T[i]` 传输到 `T[j]` 的数据量。\n\n### 2.3.2 资源建模\n\
  \n计算基础设施（云计算和雾计算）包含一组资源节点 `N = (N[1], ..., N[k])`。每个 `N[j]` 由一个利用率阈值 `UT[j]`、地理区域\
  \ `GA[j]` 以及一组虚拟机 `VM(VM[1], ..., VM[h])` 组成。驻宿于 `VM` 上的每个 `VM[i]` 以每秒处理的指令数（MIPS）表示的计算能力、带宽（即每秒可能传输的数据量）以及单位时间价格为特征。\n\
