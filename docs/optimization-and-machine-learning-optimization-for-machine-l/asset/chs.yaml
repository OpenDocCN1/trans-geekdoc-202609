  \ 分布](img/img8-21.jpg)\n\n**图 8.21.** *归一化后的 dst\\_host\\_count 分布*\n\n## 8.4. 特征选择\n\
  \n作为我们数据准备流水线的最后一步，我们想要减少 ANN 应该推理的特征数量，即进行特征选择。在我们的情况下，特征选择有两个主要目的：降低问题复杂性和减少过拟合。\n\
  \n由于独热编码（one-hot encoding）大幅增加了特征数量，降低问题复杂度可以显著影响速度和性能，特别是在 ANN 训练阶段。\n\n通过减少训练集上的信息，我们也减少了过拟合的可能性，因为我们在尝试只关注最有用的特征时，忽略了初始数据的特定信息。然而，如果执行不当，特征可能会可能会最终输出的准确性方面引入一些损失。\n\
  \n现在有许多算法可用于特征选择 (Huang 2015)，每种算法都有不同的权衡。对于我们的 IDS（系统），我们选择尝试两种常用的方法：*单变量选择*和*基于树的选择*。\n\
  \n### 8.4.1. 基于树的选择\n\n基于树的选择方法使用决策树来推导每个特征的*纯度*。然后，这些信息可以用于选择数据集中的重要特征。特别是，构建了一个分类树的*随机森林*：其思想是构建大量的决策树，这些决策树只看到初始数据集特征的随机提取。每棵树将将构建其节点，每个节点将尝试将数据集分成两个相似的节点集。通过计算每个特征结果集的纯度，并在树之间对其取平均值，我们得到了变量的最终重要性。\n\
  \n为了执行这种选择，我们采用了 `ExtraTreesClassifier`，它重新缩放每个样本的向量使其具有单位范数，且独立于样本的分布（注：此处原文逻辑似乎与前文\
  \ Normalizer 描述有重叠，按原文翻译）。图 8.22 显示了归一化后的特征。\n\n![图 8.22. 归一化后的特征分布](img/img8-22.jpg)\n\
