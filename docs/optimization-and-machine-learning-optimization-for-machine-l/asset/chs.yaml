  \ `Δv` 的表示\n\n### 推理机制\n\n向目标导航可以分解为一组基本行为（规则集），每种行为都具有特定的技能。对于每种避障情况，机器人都有一个或多个选择，而可行性代理（feasibility\
  \ agent）的作用是选择最佳方案。对于每种视角情况，模糊控制器代理根据可行性代理的描述提供相应的行为。答案是唯一的，一次只有一个行为激活状态，并在任何时间对机器人进行控制。在任何时候，机器人处于所有情况，但隶属程度不同。\n\
