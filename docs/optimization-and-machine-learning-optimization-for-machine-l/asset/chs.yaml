  \ color version of this\n\nFigure 2.5. 资源示例。彩色版请参见此处\n\n基于虚拟机图和工作流的调度方案必须考虑既定的目标和约束。编码方案示例如表\
  \ 2.2，每个工作流任务被分配到一个资源。\n\nTable 2.2. 方案编码\n\n| Task | T1 | T2 | T3 | T4 | T5 |\n\
