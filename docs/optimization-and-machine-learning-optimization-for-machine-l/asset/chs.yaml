  \ 数据集上的比较结果。基于 MAP 评估前-K 推荐列表的性能。排名位置 K 范围从 1 到 50。\n\n如图 5.9 所示，我们观察到交互注意力推荐器（`Co-attention-CF`）在\
  \ MovieLens 数据集上记录了较高的 `NDCG` 分。换句话说，项目在其 top-k 推荐列表中的排名与在真实值（ground-truth）列表中观察到的接近。应用注意力机制增强了对用户-物品交互的建模。事实上，用户对某个物品的态度越积极，它就越可能被具有相似喜好的用户推荐。注意\
  \ `EnsVAE` 推荐器和堆叠推荐器仍然表现出良好的 `NDCG` 分。堆叠推荐器在获取由堆叠学习器构建的用户整体兴趣方面有效。它捕捉了侧信息来为每个用户创建画像模型，同时优化了堆叠学习器的目标函数。\n\
  \n与上述模型相比，`IPRec` 的得分较低。由于对两个推荐器的平均聚合，它降低了某些项目的评分概率。鉴于 `NDCG` 是一种排序指标，这种降低可能会导致项目在查询中的位置错误，从而降低\
  \ `NDCG` 分。尽管如此，`MAP` 值的降低表明，这种差异化处理在某些查询上是有效的。通常，`IPRec` 算法在某些场景下表现更佳。因此，这种数据建模证明了某些表示数据对齐的性能。总之，这种方法在某些复杂情况下是可行的。\n\
