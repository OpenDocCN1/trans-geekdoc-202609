  \ *归一化后的特征分布*\n\n正如我们可以看到的，这两种方法选择了不同的特征。我们将在后面的章节中比较这些结果。\n\n## 8.5. 模型设计\n\n###\
  \ 8.5.1. 项目环境\n\n本工作收集的所有结果都是通过 `Python 3.6` 构建神经网络生成的。构建 ANN 模型使用了 `Keras` 库^(5)并将\
  \ `TensorFlow` 作为后端。因此，许多超参数和特定实现由这些框架提供。\n\n### 8.5.2. 构建神经网络\n\n我们构建神经网络的方法是尝试不同的层组合，并观察它们在准确率和损失方面的表现，比较训练集和测试集上的这些指标。\n\
  \n所有的神经网络都是使用 `Keras`^(6) 中的序列模型（即前馈模型）和密集层（即全连接层）实现的。遵循 (Kim and Gofman 2018) 的工作，测试的模型包含了浅层网络和深四层的深度网络。\n\
  \n### 8.5.3. 学习超参数\n\n在设计神经网络时，除了层数和每层的神经元数量外，还有许多超参数需要设置。特别是，在初始测试后选择了以下参数：\n\n\
  *   学习率：为了保持良好的收敛且不丢失精度，该参数被设置为 0.001。尝试过的其他值为 0.01 和 0.0001。\n*   优化算法：`Adam`，这是\
  \ `Keras` 提供的标准优化器之一。\n*   损失函数：`Binary-crossentropy`。由于我们正在构建一个二分类器，因此选择了它。\n\n\
  ### 8.5.4. 轮数\n\n每个模型都使用固定的轮数进行训练，该数值根据经验确定为 150。\n\n\n\n在未来的开发中，可以使用早停（early stopping）代替固定的轮数（epochs）来加速学习阶段：通过这种方式，只要准确率无法显著提高，训练就会停止，这可以在第\
  \ 150 个 epoch 之前很久发生。\n\n### 8.5.5. 批大小 (Batch size)\n\n选择批大小意味着学习阶段的速度和模型准确性之间的的一种权衡。批大小为\
  \ `1`（有时称为`在线学习` online learning）意味着在学习阶段的每个 epoch 中，输入数据将一次学习一个条目。\n\n具有远小于整个数据集但仍大于\
  \ 1 的批大小，例如 `16` 或 `32`（有时称为`小批量` mini-batch），意味着在一个学习 epoch 的单步操作中将同时分析多个一个条目。\n\
  \nKeskar 等人（2016）已经表明，与较大的批次相比，这种方案通常可能是更优的，因此我们的选择是将批大小设置为 `16`。\n\n### 8.5.6.\
  \ 丢弃层 (Dropout layers)\n\nDropout 正则化是防止模型过拟合的一种常用且成熟的方法（Srivastava 等人 2014）。该方法由向神经网络中添加\
  \ dropout 层组成。这些层被插在网络的其他层之间，其作用是按照一定的概率抑制前一层的输出。这等于在训练阶段随机丢弃部分输入的影响，这使得模型更加健壮并对过拟合产生免疫。\n\
  \n所选择的概率为：\n\n* – 输入层：`0.5`。输入层中的高 dropout 概率意味着并非所有特征都会被所有数据使用，这是尝试避免过拟合的核心思想。\n\
  * – 隐藏层：`0.2`。\n\n还尝试过其他概率，例如输入层使用 `0.8`，隐藏层使用 `0.5`，但模型的结果下降了。有关结果的更详细分析请参见第 8.6.4\
  \ 节。\n\n### 8.5.7. 激活函数 (Activation functions)\n\n对于隐藏层，在网络的浅层版本中尝试了不同的激活函数，以验证它们对最终分类器的影响。尝试了标准的激活函数：`relu`、`tanh`\
  \ 和 `sigmoid`。第 8.6.2 节 包含了使用不同激活函数进行的不同实验的结果。\n\n相反，输入和输出层保持固定的激活函数：输入使用 `relu`，输出使用\
  \ `sigmoid`。\n\n## 8.6. 结果比较\n\n测试了不同的模型以比较不同的解决方案并找到最适合此任务的。本节提供了所构建的每个神经网络模型性能之间的比较。\n\
