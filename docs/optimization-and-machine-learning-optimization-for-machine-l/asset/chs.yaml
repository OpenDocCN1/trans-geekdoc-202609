  使用的变异方法是交换变异。对于给定的个体，两个随机选择的任务将交换它们分配的资源。图 2.7 展示了交换变异操作的说明。在所选方案中，分配给任务 1 和任务 4\
  \ 的资源进行了交换。\n\n![图 2.7. 变异操作图](img/img2-7.jpg)\n\n图 2.7. *变异操作图*\n\n## 2.6 实验研究与结果分析\n\
  \n为了评估所提出的基于 MAS-GA 的 IoT 工作流调度方法，我们受到 Amazon EC2 实例特征的启发，定义了实验中使用的雾云协同计算资源。我们在真实的健康监测流程\
  \ IoT 工作流上测试了所提出的调度方法，如图 2.8 所示，并与图 2.9 所示的 Inspiral-15 科学工作流基准进行了对比。我们将云环境中的资源数量设置为四个\
  \ 个 VM，并将边缘环境的数量从 1 个 VM 变为 3 个 VM。\n\n图 2.8 展示了旨在远程监控医院患者健康的监测流程。该过程由包含三个主要任务的工作流管理。第一个任务称为“协调节点”，接收来自传感器的数据，进行存储并生成诊断信息。第二个任务是“医疗助手节点”，接收来自上一个节点关于是否发出紧急警报的诊断信息。最后一个任务是“医院节点”，根据从上一个节点收到的反馈做出决策。此外，我们执行了\
  \ inspiral-15 工作流基准，这是一个需要必要的计算能力完成的科学工作流。如图 2.9 所示，inspiral-15 包含 15 个并行和顺序结构的任务。\n\
