  \ 1 和 2 的经度。\n\n## 2.4 基于 GA 的 IoT 调度方法\n\n在本节中，我们介绍了与所提方法相关的概念、定义和符号。\n\n### 2.4.1\
  \ 架构模型\n\n建议的方法围绕三层建模。用户层由连接实体世界与虚拟世界的 IoT 设备组成。如图图 2.1 所示，这是一个具有三级的 IoT 系统。雾层包含一组资源节点\
  \ `N = (N[1], ..., N[k])`。每个节点由一个雾代理监督以实现雾资源的最大化。任何具有计算机、存储和网络连接的设备都可以作为雾节点，例如 Wi-Fi\
  \ 热点、交换机、路由器和嵌入式服务器（Cisco 2015）。雾层与云计算层协作，云层也配备了一组资源节点并由云代理监督。\n\n![Figure 2.1.\
  \ Solution architecture. For a color version of this figure, see www.iste.co.uk/chelouah/optimization.zip](img/img2-1.jpg)\n\
  \n**图 2.1. *解决方案架构。此图的彩色版本请访问 www.iste.co.uk/chelouah/optimization.zip*\n\n### 2.4.2\
  \ 多代理系统模型\n\nMAS 由位于特定环境的代理组成，代理根据某些关系进行交互、协作和谈判。MAS 中的每个代理都有明确的信息和计划，使其能够实现目标。在本章中，我们建模了一个由一组具有特定任务的代理类型组成的\
  \ MAS。\n\n#### 2.4.2.1 代理类型\n\n* – 经理代理\n\n全局工作流由第一类代理——经理代理（MA）管理。它负责监督工作流执行，并遵守规定的截止日期和预算。首先，`MA`\
  \ 开发混合最小切图算法将全局工作流划分为 p 个工作流，通过减少任务间的数据移动和通信成本来减少整体工作流执行时间。其次，每个生成的子工作流与一个合约代理关联，作为达成的合同。`MA`\
  \ 指定了需要遵守的子工作流特征、预算和截止日期。\n\n* – 合约代理\n\n\n\n我们工作中采用的多智能体系统（MAS）由一组合约代理 `CTA`（`CTA[1]`...`CTA[n]`）组成，其数量等于子工作流的数量。它们之间协作以以最短的执行时间执行全局工作流。每个代理都负责通过与最近的边缘代理（Fog\
  \ Agent）通信，在适当的资源上影响所有子工作流任务。`CTA[i]` 的限制是必须遵守的有限截止和预算。\n\n* – 边缘代理 (Fog Agent)\n\
  \n创建的 MAS 拥有一组边缘代理 `FA`（`FA[1]`, ... `FA[f]`），它们代表了边缘计算环境中的边缘资源提供者。每个 `FA[i]` ∈\
  \ `FA` 负责通过优化 QoS 指标，为收到的子工作流创建一个调度计划。\n\n* – 云端代理 (Cloud Agent)\n\n云端代理 `CA[i]`\
  \ ∈ `CA`（`CA[1], ..., `CA[c]`）管理一个云数据中心，负责与 FA 协作创建最合适的调度方案。\n\n### 2.4.3. 基于 MAS\
  \ 的工作流调度过程\n\nMA 作为全局工作流执行过程的监督器，启动了基于 MAS 的流调度过程。在对工作流应用划分算法 MMCG（Italiano et al.\
  \ 2011）后，MA 初始化了 p 个合约代理（CTA），并影响每个子工作流的特征、截止时间和预算约束。每个创建的 `CTA` 分析收到的子工作流并提出资源请求\
  \ `RR[i]`，如公式 2.7 所示，请求将被发送给最近的边缘代理 `FA[i]`。\n\n2.7 ![Image](img/eqn2-7.jpg)\n\n\
  其中：\n\n* – Id Tasks：代表子工作流中每个任务的唯一标识符组；\n* – Precedence Constraints：代表任务之间的关系，该关系决定了必须遵守的调度顺序（优先约束）；\n\
  * – QoSs：代表必须满足的不同服务质量指标；\n* – `CS[i]`：代表计算规模（Computing Size）；\n* – `D[i]`：代表由管理代理（Manager\
  \ Agent）施加子工作流执行截止时间；\n* – `B[i]`：代表由管理代理（Manager Agent）施加子工作流执行预算。\n\n`CTA` 代理拥有一个知识目录\
  \ `KD`（它类似于 JADE 框架创建的目录促进器“DFAgentDescription”（Bellifemine et al. 2000），提供了一个允许代理通过\
  \ ID 查找服务提供者代理的目录系统），包含所有边缘代理的信息，`CTA` 通过它挑选最近的边缘代理。在收到 `CTA` 的请求 `RR[i]` 后，`FA`\
  \ 将收到的 `RR[i]` 计算规模 `CS[i]` 与其利用阈值 `UT[i]` 进行比较。如果 `RR[i]` 符合 `UT[i]`，边缘代理将向 `CTA`\
  \ 提出一个由 GA 创建的资源调度方案。否则，在边缘资源利用最大化的背景下，`FA[i]` 必须在其资源上为子工作流任务生成一个符合其利用阈值的调度方案，并为剩余任务创建一个\
  \ `RR[j]`。随后，将 `RR[j]` 发送给 `KD` 中 `FA[i]` 的所有边缘代理以进行协作，并在边缘资源上寻找合适的调度计划。因此，`FA[i]`\
  \ 必须定义一个接收边缘代理调度方案的等待时间（WT）。如果超过 `WT` 且未接受任何调度建议，`FA[i]` 将 `RR[j]` 发送给云端代理。MA 在收到所有\
  \ `CTA` 的全局工作流调度计划后结束该过程。所提出的 MAS-GA 工作流调度方法步骤如图 algorithm 2.1\n\nFigure 2.2. GA\
  \ 流程图\n\n## 2.5. 基于 GA 的工作流调度计划\n\nGA 是常用的元启发式算法之一，通过优化工作流调度方案的 QoS 指标来解决多目标优化问题。Figure\
  \ 2.2 展示了全局 GA 流程图。GA 从随机创建第一种群开始，一组调度方案。根据不同的 QoS 指标，GA 通过计算适应度函数 `F` 来评估每个种群个体（调度方案）。之后，GA\
  \ 应用轮盘赌选择法选择最适合繁衍新代的个体，并对每对个体（称为“父代”）使用交叉算子产生两个称为“孩子”的新个体。然后，对产生的孩子应用变异算子。重复执行 GA\
  \ 直其收敛到最合适的调度方案或达到最大代数。Figure 2.3 展示了工作流调度过程的示例，这是生成种群的关键部分。调度过程选择就绪任务（即所有前驱任务已完成调度的任务）。将其调度到使适应度函数最小的虚拟机中。该过程重复进行，直到所有工作流任务都调度完毕。\n\
  \n![Figure 2.3. Workflow scheduling process](img/img2-3.jpg)\n\nFigure 2.3. 工作流调度过程\n\
  \n### 2.5.1. 方案编码\n\n工作流调度意味着每个任务都必须调度在适当的资源上且不破坏优先约束。Figure 2.2 展示了一个由五个任务组成的工作流示例，其中\
  \ `T[1]`、`T[2]` 和 `T[3]` 按顺序分组并并行执行，因为优先约束没有连接它们。`T[4]` 只有在所有前驱任务执行并传输数据后才能开始。Figure\
