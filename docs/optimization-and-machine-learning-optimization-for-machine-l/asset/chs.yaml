  \ 7(2), 117–132.\n\n\n\n\n推荐系统广泛用于建议与用户需求和偏好最匹配的商品（例如产品、新闻服务）。主要挑战在于建模包含多方面信息的实体之间的依赖关系，这些信息了用户偏好、物品属性以及用户之间的相互影响，导致了更复杂的特征。为了解决这个问题，我们设计了一个集成了协同过滤（CF）模块和堆叠（stacking）推荐模块的推荐系统。我们引入了交互注意力机制来建模用户与物品之间的相互影响关系。它允许将原始数据映射到高阶特征交互。此外，堆叠推荐器由一组回归模型和一个元学习器（meta-learner）组成，通过强学习器优化弱学习器的性能。所开发的堆叠推荐器考虑了推荐内容，为每个用户创建一个画像模型。在真实数据集上的实验表明，所提出的算法可以实现更准确的预测和更高的推荐效率。\n\
  \n# 5. 引言\n\n推荐系统已成为电子商务网站和其他平台（如社交网络和电影/音乐渲染网站）不可或缺的一部分。它们对这些企业的收入产生了巨大影响，并通过减少用户搜索和筛选海量数据时的认知负荷使用户受益。围绕推荐系统的研究主要分为三类：协同过滤（CF）方法、基于内容的方法以及结合这两种技术的混合方法。协同过滤推荐系统填充了未指定的评分，因为观测到的评分在不同用户和物品之间通常高度相关。基于内容的推荐系统使用带有评分标记的物品的描述性属性作为训练数据，创建特定于用户的分类或回归模型。混合推荐器提供了许多机会。事实上，结合来自不同系统的各个方面可以兼顾所长。许多研究人员将深度学习算法引入推荐系统中以提高准确性并解决冷启动问题。此外，深度学习在捕捉用户-物品连接的非线性方面显示了其有效性。He\
  \ *等人*（2017）提出了一种神经架构，具有学习更好表示、提取特征和生成用户-物品交互历史的潜力。在（Musto *等人* 2016; Tan *等人* 2016;\
  \ Okura *等人* 2017）的作品中，作者们开发了基于循环神经网络（RNNs）的推荐系统，以建模内容信息的时动态和序列演化。Tang *等人*（2018）提出了一种基于卷积神经网络（CNNs）的序列推荐。序列模式使用卷积过滤器作为图像的局部特征进行学习。此外，自编码器在表示用户-物品交互以实现简单准确的协同过滤方面证明了其有效性。Liang\
  \ *等人*（2018）提出了协同过滤的变分自编码器（MultiVAE）。\n\n作者定义了一个具有多项似然表示的生成模型。他们使用贝叶斯推理进行参数估计。Drif\
  \ *等人*（2020）提出了用于推荐的集成变分自编码器框架（EnsVAE）。该架构允许基于变分自编码器将子推荐器的预测效矩阵转换为兴趣概率。\n\n各种实体驱动着推荐过程，包括物品特征、用户偏好和用户-物品历史交互。通常，物品画像可能以产品描述的形式存在。同样，用户可能创建显式描述其兴趣的画像。许多工作建议建模这些不同实体之间的上下文依赖关系。然而，探索用户对物品相互影响的工作较少。在本章中，我们引入了一种新颖框架，建模高阶用户-物品特征以及潜空间中用户与物品之间的交互来解决这些局限性。我们的主要贡献总结如下：\n\
  \n* – 所提出的交互个性化推荐器（IPRec）学习用户行为与各种特征（如用户-物品画像信息和侧信息）之间的交互权重；侧信息的片段是属性。例如，用户可能与人口统计特征相关，如他们的姓名、地址、年龄、性别或职业。物品（如电影）可能带有与其关联的侧信息，如标题、演员、导演等。属性不仅与用户和物品维度相关，还与上下文维度相关。提供额外的侧信息可以提高评分预测的准确性。开发的两个组件是：(1)\
  \ 基于交互神经注意力网络的协同过滤推荐器；以及(2) 堆叠基于内容的推荐器。整合这些组件可以优化推荐任务。可以尝试使用两个不同模型预测的加权平均来近似这种混合模型的结果。\n\
  \n* – 基于交互神经注意力网络的协同过滤推荐器利用了用户和物品之间交互注意力的编码能力。它学习代表用户对物品相互影响的最相关权重。因此，它通过指示哪些高阶特征交互对预测具有信息量来提高推荐系统的准确性。\n\
  \n* – 堆叠基于内容的推荐器由一堆机器学习（ML）模型组成。结合其组成部分的预测能力可以提高预测准确性。该推荐器为每个用户创建一个画像模型，并从基于物品的侧信息中提取有价值的特征。\n\
  \n* – 经验评估表明，所提出的“IPRec”框架在多个真实数据集上显著优于先进基准模型。\n\n本章的其余部分组织如下。相关文献在[第 5.2 节](#c05.xhtml#sec5-2）中描述。[第\
  \ 5.3 节](#c05.xhtml#sec5-3）介绍了提出的架构。实验设置在[第 5.4 节](#c05.xhtml#sec5-4）中给出。实验结果在[第\
  \ 5.5 节](#c05.xhtml#sec5-5）中报告并讨论。[第 5.6 节](#c05.xhtml#sec5-6）总结了结论。\n\n## 5.2.\
  \ 相关工作\n\n### 5.2.1. 推荐系统中的注意力网络机制\n\n尽管几种深度学习模型为推荐系统提供了满意的解决方案，但在新物品未积累足够数据时，它们的效果较差。注意力机制（Vaswani\
  \ *等人* 2017）作为解决推荐系统中冷启动问题的方法引起了研究人员的关注。注意力机制允许模型根据上下文对输入实施不同的权重。Tay *等人*（2018）提出了一种多指针学习方案，该方案基于指针网络学习结合用户-物品交互的多视图。他们应用共同注意力机制分别从每个用户和物品的评论库中选择最有信息量的评论。Liu\
  \ *等人*（2021）开发了一种序列神经推荐，通过方面级评论建模用户的长期和短期偏好。该模型使用方面感知卷积和自注意力将与用户和物品相关的评论嵌入连续的低维稠密向量空间。Ying\
  \ *等人*（2018）引入了一种基于记忆组件和注意力机制的记忆注意力感知推荐系统，以学习深度自适应用户表示。\n\n\n\n\n\nKang 等人（2018）提出了一种基于自注意力机制的序列模型，该模型能够捕捉长期语义，但其预测是基于较少的动作的。在每个时间步，模型都试图从用户的动作历史中识别出哪些项目是相关的，并使用它们来预测下一个项目。Zhou\
  \ 等人（2018）通过设计局部激活单元开发了深度兴趣网络（DIN），以自适应地从与特定广告的历史行为中学习用户兴趣的表示。该算法学习聚合用户的历史序列以形成用户嵌入（user\
  \ embedding）。用户嵌入被视为项目嵌入的加权和，而注意力网络则获取每个项目嵌入的权重。在 Yakhchi 等人（2020）中，作者提出了一种基于深度注意力的序列（DAS）模型。它通过注意力机制在建模用户长期偏好时，处理项目之间虚假依赖关系的表示问题。\n\
  \n在之前的工作中，推荐引擎学习通过聚合用户历史序列来计算之前项目嵌入的注意力加权和。相比之下，所提出的框架不仅学习了用户兴趣与项目嵌入之间的交互，还增加了一个新组件，用于学习由带有协作信号的项目对用户决策的贡献所产生的相互影响，有助于解释复杂的用户-项目交互。\n\
  \n## 5.2.2 用于优化的堆叠机器学习\n\n集成机器学习算法增强了简单且易于理解模型的预测能力。它们需要更复杂的技术来准备模型，并需要更多的计算资源来训练模型。它们是一组较小的、具体的预训练模型的包装器（wrappers）。包装器随后遵循一个定义的策略将它们的预测聚合为最终结果。目前已经提出了多种集成方法，例如投票分类器、袋装（bagging）和粘贴（pasting）、提升法和堆叠（Pavlyshenko\
  \ 等人，2018）。堆叠是一个非常简单的想法，可以利用最强大的集成模型之一。堆叠不是使用“众”和“平均值”等简单的聚合函数，而是使用一个元学习器（meta-learner）模型来学习从底层预测到标签的映射。堆叠泛化集成可以使用预测集作为上下文，并条件地以不同的权重处理输入预测，从而产生更好的性能（Wolpert\
  \ 等人，1992）。\n\n目前已经提出了许多基于元学习的结合多个分类器的方法。Reid 和 Grudic（2009）在组合器层面对线性堆叠泛化应用正则化，以避免过拟合问题并提高性能。Jurek\
  \ 等人（2014）提出了一种基于元学习的方法，在元层面引入了无监督学习方法。所有基础分类器首先对验证集中的每个实例进行分类（Jurek 等人，2014）。分类过程的输出随后被视为新属性。K-Means\
  \ 聚类技术根据新属性将验证集中的所有实例划分为簇。簇的集合被视为最终的元模型，其中每个簇代表一类。Deng 等人（2012b）提出了核深度凸网络（K-DCN）架构，该架构由数量数量的模块堆叠在一起形成深度架构。Deng\
  \ 等人（2012a）提出了一种能够在极大规模数据集上进行并行训练的深度堆叠网络（DSN）。\n\n在推荐方面，Otunba 等人（2019）堆叠了广义矩阵分解（GMF）和多层感知器（MLP）的集成，该集成将构分模型的预测通过其他构分模型传递到最终输出。Bao\
  \ 等人（2009）结合了多个推荐引擎的预测以生成单个预测。他们首先将每个组件推荐引擎定义为层-1 预测器。然后他们使用元学习算法学习一个层-2 预测器，并将组件引擎的预测作为元特征。层-2\
  \ 预测器可以是根据所采用的元学习算法线性函数，也可以是非线性函数。他们定义了一个新的元特征，将输入用户/项目的属性作为额外的元特征。这允许在运行时根据用户/项目特征组合组件推荐引擎。在\
  \ Da 等人（2016）中，作者开发了三种基于多模态交互的集成方法。由传统推荐算法单独处理的不同类型的用户反馈被结合在一起，以优化用户画像的建模。与之前使用堆叠推荐器的工作不同，基于内容的堆叠式推荐器考虑了用于推荐的内容，为每个用户创建一个画像模型。其主要优势是嵌入表示能够在混合架构中整合侧信息的能力。\n\
  \n## 5.3 交互式个性化推荐器\n\n所提出的框架是协作交互注意力网络推荐器和深度堆叠推荐组件的混合。它为建模交互特征提供了更大的能力。我们构建了联合用户和项目交互注意力图来预测项目上的分布。这种注意力网络模型背后的核心思想是学习代表用户对项目相互影响的最相关权重。图\
  \ 5.1 展示了用户和项目之间的相互作用。例如，用户 1 和用户 3 都对同一个项目进行评分。用户 2 和用户 3 对项目 4 进行评分。因此，我们推导出项目\
  \ 4 用户 1 可能感兴趣。这是一种一阶交互。同样，我们可以观察到用户 1 和用户 2 关于项目 6 的交互。此外，我们推导出了可以定义为超过一个阶级的实体依赖的相互影响。例如，用户\
  \ 3 受到用户 2（与用户 1 相似的用户）兴趣的影响，产生了对项目 6 的兴趣。该组件通过整合用户-项目交互和用户对项目的相互影响，旨在建模不同实体之间的上下文依赖。\n\
  \n![图 5.1 交互式个性化推荐框架对不同实体间的相互影响](img/img5-1.jpg)\n\n图 5.1 交互式个性化推荐框架对不同实体间的相互影响\n\
  \n### 5.3.1 符号\n\n制定推荐任务的一种稳健方法是将其视为预测问题。因此，用户和项目之间的交互以实用矩阵 `R` 的形式表示。对于每个用户 `u`\
  \ ∈ `U`，推荐系统尝试预测所有未指定的评分 `ȓ[u]`。令 `U` = `u[1]`, `u[2]`, ..., `u[n]`** 和 `I` = `i[1]`,\
  \ `i[2]`, ..., `i[m]`** 分别为用户和项目的集合，其中 `n` 是用户数量，`m` 是项目数量。矩阵分解算法将矩阵 `M`[(]*[n]*[×]*[m]*[)]\
  \ 分解为两个矩阵 `P` E IR^(`N`[×]*`K`*) 和 `Q` E IR^(`M`[×]*`K`*)。用户对项目的交互被建模为潜向量的内积。设 `ui`\
  \ 是用户 `u` 对项目 `i` 分配的真实评分。\n\n\\[5.1\\]\n\n\n\n\n其中 `K` 表示隐空间的维度。隐因子模型是基于模型的协同过滤的一种先进方法。矩阵分解技术是一类广泛成功的隐因子模型，它们试图通过从物品评分模式中推断出的因子向量来表征物品和用户。物品因子与用户因子之间的高度相关性会导致推荐结果的产生。矩阵分解在二元数据预测任务中表现非常优异。然而，它无法捕捉对象及其相互作用的异质性，未能对评分所在的上下文进行建模。事实上，隐因子模型本质上是线性的，这限制了它们在推荐系统中的建模能力。最近，在神经网络的支持下，出现了越来越多的工作，通过将人工设计的非线性特征引入到线性隐因子模型中。在本章中，我们使用\
  \ 50 维的 `GloVe` 嵌入来表示隐空间。\n\n训练集 `T` 由 `N` 个元组组成。每个元组 `(u, i, ȓ_ui)` 表示用户 `u` 对物品\
  \ `i` 的评分。对于给定的预测评分矩阵，以用户为基础进行归一化。对于每个用户 `u` ∈ `U`，提取出最小评分 `min = min (r^(s)(ui))`\
  \ 和最大评分 `max = max (r^(s) (ui))`。然后将 min/max 缩放函数应用于 ![Image](img/rcap.jpg)如下所示：\n\
  \n\\[5.2\\] ![Image](img/eqn5-2.jpg)\n\n归一化步骤可以在评分矩阵生成之前、期间或之后进行。此外，人们可以轻松地为此目的调整基于神经网络的推荐器。`Sigmoid`\
  \ 被用输出层的激活函数，最终跳过了对 `Min/Max scaler` 的使用。在本章的剩余部分，我们使用表 5.1 给出的符号。\n\n### 表 5.1.\
  \ *符号*\n\n| **符号** | **定义与描述** |\n| --- | --- |\n| `r[ui]` | 用户 `u` 对物品 `i` 的评分值\
  \ |\n| `P^∈ IR^(N×K)` | 用户 `u` 的隐因子 |\n| `Q^∈ IR^(M×K)` | 物品 `i` 的隐因子 |\n| `g[1](),\
  \ g[2()` | 分别应用于用户和物品的 `LSTM` 模型 |\n| `e[u]` | 用户嵌入层 |\n| `e[i]` | 物品嵌入层 |\n| `a**u`\
  \ | 用户 `u` 的注意力网络 |\n| `a**i` | 物品 `i` 的注意力网络 |\n| `a[u]` | 用户 `u` 的最终注意力权重 |\n\
