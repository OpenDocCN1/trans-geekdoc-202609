  \n\n# 引言\n\n**Rachid CHEOUAH**\n*法国巴黎科技大学*\n\n机器学习正在改变我们的世界。很难想象有任何其他信息技术在过去几年中现实影响力方面的发展如此迅速。\n\
  \n机器学习与优化的领域高度交织。优化问题是机器学习的核心，而现代优化算法正越来越多地利用机器学习来提高效率。\n\n机器学习适用于科学的所有领域。存在许多学习方法，每种方法都使用不同的算法结构根据接收到的数据来优化预测。因此，本书的首要目标是介绍这两个领域共同的关键原理和方法。\n\
  \n本书介绍了依赖于机器学习和优化的算法在选择、配置和工程方面的最新进展。全书分为两个部分。第 1 部分专注于最常见的优化应用。第 2 部分描述并实现了若干机器学习的应用。\n\
  \n第 1 部分包含四个章节，重点关注优化算法的现实世界应用。\n\n第 1 章解决了带有装载限制的车辆路径问题，结合了两个组合优化问题：容量车辆路径问题（CVRP）和二维/三维装箱问题（2/3D-BPP）。作者们研究了真实的运输问题，例如家具或工业机械的运输。\n\
  \n\n\n\n第 2 章的主要目标是创建一个能够同时优化多个 QoS 指标的最合适调度方案；因此，作者将广泛使用的元启发式算法“遗传算法”作为一种优化方法。所提出的调度方法通过模拟医疗物联网应用（建模为工作流）和若干科学工作流基准进行了测试。结果显示了所提方法的有效性；它生成了一个更好地优化所考虑的各种\
  \ QoS 指标的调度计划。\n\n第 3 章重点关注灰狼优化算法（`GWO`）及其连续搜索空间的适应。它首先解决了二元离散搜索空间中优化的数学建模。随后提供了二值化模块，允许连续元启发算法解决二元搜索空间中的特征选择问题。这些二值化模块随后用于创建二元元启发算法\
  \ `bGWO`。最后，通过实验展示了 `bGWO` 在解决 UCI 机器学习库中 18 个数据集的特征选择问题上的性能。\n\n第 4 章解决了具有确定性任务时间的\
  \ 2 型混合模型装配线平衡问题。为了解决这个问题，提出了一种贪心随机自适应搜索过程的增强版——反应式贪心随机自适应搜索过程。该反应版本基于受限候选列表参数值\
  \ `alpha` 的变化。所提出的反应式 `GRASP` 与位置权重启发式算法混合以构建初始解。将所提出的混合反应式 `GRASP` 得的结果与基础 `GRASP`\
  \ 的结果进行比较，证明了学习机制的作用。\n\n第 2 部分包含四个章节，致力于人工智能、机器学习及其应用。\n\n推荐系统的主要挑战源于对各种实体之间依赖关系的建模，这整合了用户偏好、物品属性和用户间相互影响等多方面信息，导致了更复杂的特征。为了解决这个问题，第\
  \ 5 章的作者设计了用于推荐的堆叠机器学习模型。他们的推荐系统包含一个协同过滤（`CF`）模块和一个堆叠推荐模块。随后引入了交互式注意力机制来建模方面用户与物品之间的相互影响关系。在真实数据集上的实验表明，所提算法可以实现更准确的预测和更高的推荐效率。\n\
  \n在内部审计中，处理与审计范围或主题相关的所有可用信息的能力可以提高结果质量。对审计文本文档（非结构化数据）进行分类可以利用额外信息来改进现有的结构化数据，为审计过程提供更好的知识支持。第\
  \ 6 章展示了经典的机器学习算法与深度学习算法的结果对比，并结合高级词嵌入对内部审计报告的发现进行分类。\n\n控制架构的设计是自主移动机器人项目中的核心问题。在缺乏通用解决方案的情况下，必须提出一种新方法，详细说明智能系统的设计过程，该系统能够适应导航环境的所有变化。第\
  \ 7 章提议在用于受限环境下移动机器人自主导航的控制架构设计中使用多智能体范式和模糊逻辑。控制架构的设计旨在解决导航过程中产生的各种问题。它由四个代理组成：感知代理、可行性代理、运动代理和模糊控制代理。\n\
  \n入侵检测是现代网络中的关键概念。在第 8 章中，作者构建了一个在 NSL-KDD 数据集上训练的前馈神经网络，以便将连接分类为两类之一：正常或异常。其目标是最大化识别新数据的准确率。\n\
  \n\n## 1. 带载量限制的车辆路径问题：变体与求解方法概述\n\nInes SBAI1 和 Saous KRICHEN1\n[1] 突尼斯大学，突尼斯高等学院，LAROD\
  \ 实验室，突尼斯\n\n本章结合了两个最热门的组合优化问题，即带容量车辆路径问题（`CVRP`）和三维装箱箱问题（`23D-BPP`）。它重点关注现实中的运输问题，例如家具或工业机械的运输。通过调查\
  \ 76 现有贡献，对具有三维装载限制的 `CVRP` 进行了广泛概述。我们对文献中研究的 `CVRP` 变体提供了更新综述，并分析了文献中给出的一些流行的优化方法。同时，我们讨论了它们的变体和约束、它们在现实问题中的应用，以及对当前文献的影响。\n\
  \n### 1.1. 引言\n\n尽管车辆路径问题（`VRP`）是研究最充分组合优化问题，但实现最优且有效的结果仍然是一个挑战（Sbai *et al.* 2020a）。`VRP`\
  \ 旨在当使用一组完全相同的车辆访问一组客户时，最小化总旅行成本。`VRP` 用于许多现实应用，例如：药品分销、食品配送、城市公交问题和垃圾收集。`VRP` 的基本版本被称为带容量的\
  \ RP（`CVRP`）；每辆车辆都有一个固定容量，在装载物品时必须遵守且不能超过。其目标是最小化服务所有客户的总成本。通过添加时间窗口定义车辆的总旅行时间，可以将\
  \ `CVRP` 扩展为带时间窗口的 VRP（`VRPTW`）。它也可以扩展为带取送的 VRP（`VRPPD`），其中订单可以被取货和交付。基本 `CVRP`\
  \ 的另一个变体是带回程货的 VRP（`VRPB`）。在这里，取货和交付可以在单一路线中结合；因此，在空车辆从客户处收集货物之前，需要完成所有的交付请求。\n\n\
  \n\n\n从仓库装载并运输货物到不同的客户是物流行业中经常遇到的实际问题。装载问题可以扩展为装箱问题（BBP）。在考虑了与问题相关的维度数量后，装箱问题被分为\
  \ 2D 和 3D 问题。首个相关问题是 `2D-BPP` (Zang *et al*. 2017; Wei *et al*. 2018; Sbai and Krichen\
  \ 2019)，其中物品和箱体均为矩形，目标是在不发生重叠的情况下，将所有物品装入数量*最少*的箱体中。第二个问题是 `3D-BPP` (Araujo *et\
  \ al*. 2019; Pugliese *et al*. 2019)，这涉及寻找一种高效且准确的方法将 3D 矩形货物放入最少数量的 3D 容器（箱体）中，同时确保货物完全位于容器内部。\n\
  \n近年来，一些研究人员关注了路径规划与装载组合问题。该组合问题包括 2D 装载车辆路径问题（VRP），记为 `2L-CVRP`，以及 3D 装载车辆路径问题，记为\
  \ `3L-CVRP`。解决这些问题的目的是最小化服务每个客户的所有路线相关的总旅行成本，并满足所有装载维度的约束条件。这两个问题通过精确算法和元启发式算法求解，这些算法将在随后的章节中进行详细回顾。有关更多信息，请读者参考\
  \ Pollaris *et al.* (2015) 和 Iori and Martello (2010)，书中给出了关于带装箱问题的车辆规划的详细综述。\n\n\
  本章结构如下：第 1.2 节提供了关于与 2D 装载问题结合的 VRP 的文献概述，以及现有变体和约束。第 1.3 节重点关注带 3D 装载问题的 VRP 以及现有变体和约束。最后，在第\
  \ 1.4 节中，我们以结论和进一步研究的机会结束。\n\n## 1.2. 带有二维装载约束的带容量车辆路径问题\n\n`2L-CVRP` 是经典 `CVRP`\
  \ 的变体，其特征是客户需求的二维性。该问题旨在使用一组同质车队服务一组客户，并使总成本最低。必须遵守 2D 装载约束。\n\n`2L-CVRP` 于一系列现实问题中（Sbai\
  \ *et al*. 2020b），例如家电和专业清洁设备。表 1.1 给出了关于 `2L-CVRP` 现有文献的对比研究，包括求解方法、变体和约束。\n\n\
  **表 1.1.** *2L-CVRP 的对比研究*\n\n| **作者** || **问题** | **路径规划问题求解方法** | **装载问题求解方法**\
