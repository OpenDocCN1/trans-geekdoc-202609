    layout something specific as "Contact php" and to never ever delete the layout
    unless you want to break your PHP pages. I also suggest that you have all your
    PHP layouts organized into a single folder FileMaker Pro as an additional reminder
    to developers to be incredibly careful when making changes to any database content
    related to PHP.


    Changes to your layouts, value lists, tables, and scripts will break your PHP
    pages. If you make changes to your database you will have to update your PHP web
    pages.


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_61_0.png)


    Figure 5-11: Demo layout Designed Only for PHP Access


    # Naming Conventions


    Naming conventions for fields are not only important for FileMaker Pro, but also
    for PHP. Web pages tend to be a lot more fickle when it comes to special characters,
    whereas FileMaker lets you get away with them. Standard web conventions state
    that you should name fields using a-z, 0-9, underscore, and no special characters
    such as periods, spaces, or high ASCII characters such as "?. The field name should
    start with a letter rather than a number or underscore. For example, use "FirstName",
    not "First Name". Notice that I used an uppercase letter to start each word to
    make reading the field name easier.


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_61_1.png)


    > Absolutely do NOT change the field once it''s used on a PHP web page. If you
    make changes to your field names you will have to update your PHP web pages.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Syntax


    PHP code always starts with <?php and ?>. Each line of PHP code must end with
    a semicolon. The semicolon is used to distinguish one set of instructions from
    another. A PHP scripting block can be placed anywhere on the page. A PHP file
    will contain HTML and PHP. Below is a basic example that displays the text FileMaker
    API for PHP to a web browser. To output information to the browser you can use
    the PHP method echo or print. Echo is the more common, modern method.


    ```

    ```html

    <body>


    <?php

    echo "FileMaker API for PHP";

    ?>


    </body>

    <html>

    ```

    ```


    # Includes


    You can insert the contents of other PHP files into your PHP file before the server
    executes it. This is done with either the include() or require() function. This
    is very useful to perform tasks such as create a single database connection for
    your entire site, create custom functions, and insert headers, or other elements
    that will be reused more than once. It''s very similar to creating a sub-script
    in FileMaker with the point being to organize your code more logically and reuse
    as much code as possible. The include and require() functions are the same except
    how they handle errors when they can''t find the file.


    include() generates a fatal error, but the script will still continue to execute.

    require() generates a fatal error and stops the script at that.


    Every PHP file in this book will start with the include() to connect to the database
    using a predefined account name and password. Notice the "../Conn/ path. This
    relative path is up two folders from the current folder and into the Conn to find
    the dbaccess.php file. Conn is short for connection. Without connecting to the
    database, none of the FileMaker API methods will be able to retrieve any data
    from the database. This is a good example of reusing code more than one time.
    If you need to change the account name and password you only have to modify the
    dbaccess.php file once rather than every file in your web site.


    ```

    ```php

    <?php

    include(\../Conn/dbaccess.php");

    ?>

    ```

    ```


    # Comments


    There are two basic methods to comment your code. You can comment one or more
    lines of <!-- HTML code --> inside. A PHP tag you can use a single line comment
    with // or #. If you want to comment a large block using /* and */. It''s a good
    idea to comment your code so you know what the script is to do. HTML comments
    show up on the page source code of the user''s browser. Whereas PHP is a server-side
    scripting language, the PHP comments are stripped from the page before they are
    returned to the browser. In any case it''s probably wise not to include comments
    in your code such as account names and passwords that might create a security
    issue. I have seen bugs with Firefox that allow the browser to download the source
    code from the server!


    ```

    ```php

    <-

    HTML

    comment

    -->


    <?php

    // Single line comment

    n```

    ```


    # Single line comment'
