    # Portals


    I''ve mentioned this several times, but it''s worth mentioning again. The FileMaker
    API for PHP requires that you have any elements you want to display on the web
    page on the layout. This also applies to related records and portals. You need
    to include the portal on the layout with any fields that need to be displayed.
    Although it may seem awkward at first, you''ll see in the lessons that the API
    makes quick work of displaying and working with related records.'
