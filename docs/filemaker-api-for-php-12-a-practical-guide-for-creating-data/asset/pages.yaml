    $ch1 = ''chxl1:0'' . ''.labels'' . ''|2:Day|3|Temp'' . ''&'';

    $ch1 = ''chxp2:0,50,35'' . ''&'';

    ```


    Define the Y axis markers using the min and max values that are defined below.
    The labels are by default

    and are evenly spaced.


    ```

    $chxr = ''chr1:'' . $min . ''.'' . $max . ''&'';

    ```


    Define the value markers. I placed them on top of each data point. You can define
    the color, which data

    index to use, which points to draw, and the size of the labels.


    ```

    $chm = ''chm:N,000000,0,-1,11'' . ''&'';

    ```


    Create a random ID for the chart. This isn''t really required, but it is highly
    recommended. It will force the

    Google chart to refresh the chart each time it is requested.


    ```

    $chid = ''chid:'' . md5(uniqid(rand(),true)) . ''&'';

    ```


