  md: "```\nif(empty($_GET['FirstName']))\n{\n  $firstName='';\n}else{\n  $firstName=$_GET['FirstName'];\n\
    }\n```\n\nNow it starts to get a bit tricky with the logic. You have to determine\
    \ how many page links you need to display based on the number of records in the\
    \ found set and the max number of records to display per page. Start by using\
    \ the module function to figure out if there is a remainder when you divide the\
    \ count by the max number of records to display. If there is a remainder you'll\
    \ need to display one extra link for the remaining records on the last page. Otherwise\
    \ you have an even number of records to pages. The variable $totalLinks will be\
    \ important in the following code when building the actual pagination links.\n\
    \n```\nif($found % $max > 0)\n  $totalLinks = intval($found / $max) + 1;\nelse\n\
    \  $totalLinks=intval($found / $max);\n```\n\nThe final part of the PHP code is\
    \ to build the actual links so it looks like 1 2 3 4, where the link that is not\
    \ underlined is the page you are on and the underlined represent other pages of\
    \ records. During this process the skip value is the only thing that changes as\
    \ each page has to start at the record number chosen by the while loop and then\
    \ step down. The skip value of the links will be used as a counter while the while\
    \ loop runs. TotalLinks calculated above will be used to stop the loop when the\
    \ n is less than or equal to TotalLinks. $totalLinks also has to be more than\
    \ 1 page or there's no reason to create the pagination links. The trick to the\
    \ display is to not create a link for the page the user is on — only display the\
    \ page number when the page is equal to $. you will need to assemble the URL for\
    \ the link. The URL will include the values for page, skip, max, and the search\
    \ criteria for the FirstName. Each time you loop through the code you increment\
    \ $n by +1 until the criteria is no longer met. The URL will look like the example\
