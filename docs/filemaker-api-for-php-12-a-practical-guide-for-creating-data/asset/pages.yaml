- pgno: 256
  md: "# PHP Duplicate Record Script\n\nThe script's task is to take the Record ID\
    \ passed by the web page and find the parent record. Once the parent record is\
    \ found it will duplicate the parent and related records. This is a very common\
    \ script even for FileMaker client programming.\n\nStart by making sure you turn\
    \ on User Abort and Set Error Capture.\n\n+   - Allow User Abort [ On ]\n- Set\
    \ Error Capture [ On ]\n\nCreate the $RecordID variable from the script parameter\
    \ passed by the PHP code.\n\n```\nSet Variable [ $RecordID; Value:Get(ScriptParameter)\
    \ ]\n```\n\nUse the Demo php layout to find the parent record.\n\n```\nGo to Layout\
    \ [ \"Demo php\" (php_demo) ]\nEnter Find Mode [ ]\nSet Field [ php_demo::RecordID;\
    \ $RecordID ]\nPerform Find [ ]\n```\n\nMake sure you trap for errors and stop\
    \ the script if no records are found.\n\n```\nIf [ Get(LastError) > 0 ]\nHalt\
    \ Script\nEnd If\n```\n\nDuplicate the record and store the Record ID of the new\
    \ record so it can be passed to the foreign key for the new related records.\n\
    \n```\nDuplicate Record/Request\nSet Variable [ $PK; Value:php_demo::RecordID\
    \ ]\n```\n\nDuplicate the portal records from the original record. Then change\
    \ the foreign keys to the new primary key.\n\n```\nGo to Record/Request/Page [\
    \ Previous ]\nGo to Related Record [ From table: \"related_data\"; Using layout:\
    \ \"Related Data php\" \n(related_data) ] Show only related records\n```\n\nI\
    \ like to start from the last record when I duplicate records. It makes it easier\
    \ to know when you duplicate all the records because there are no records remaining\
    \ in the set as you omit the records after the foreign key is updated with the\
    \ new key value.\n\n```\nGo to Record/Request/Page [ Last ]\n```\n\nLoop through\
    \ all the records, creating a duplicate for each one and changing the foreign\
    \ key.\n\n```\nLoop\nDuplicate Record/Request\nSet Field [ related_data::$PK ]\n\
    Omit Record\nOmit Record\nExit Loop If [ Get(FoundCount) = 0 ]\nEnd Loop\n```\n\
    \nCommit the records to make sure they show up on the web.\n\nCommit Records/Requests\
    \ [ Skip data entry validation; No dialog ]"
  merge: -1
  img_proc: true
