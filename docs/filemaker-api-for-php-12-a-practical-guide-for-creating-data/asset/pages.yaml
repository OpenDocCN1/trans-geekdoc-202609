    \ dates is a little trickier because you have to make sure the format is correct\
    \ and the actual date is valid. In the case of FileMaker the format is MM/DD/YYYY.\
    \ The problem is that users can enter dates as DD/MM/YYYY or even incorrect dates\
    \ such as 02/31/2010. Therefore, the easiest way to validate the date is to use\
    \ the PHP explode function to pull the formatting of the entered date. Then reassemble\
    \ it into the desired format. Start by creating the variable with the contents\
    \ from the $_POST superglobal.\n\n```\n$Date=$_POST['Date'];\n```\n\nNext, use\
    \ the PHP explode method to separate the three sets of numbers (MM, DD, YYYY ),\
    \ based on the slash \"/ as the separator, into an array where $mm will be assigned\
    \ to the first array. $dd will be assigned to the second array. $yyyy will be\
    \ assigned to the third array.\n\n```\n$array=explode(\"/\", $Date);\n$mm=$array[0];\n\
    $dd=$array[1];\n$yyyy=$array[2];\n```\n\nNow you can reassemble the date using\
    \ the PHP checkdate method. If it is not a valid date you can stop the script.\
    \ If it is a valid date you can insert it into the database. You might be wondering\
    \ where the validation is for the slashes \"/\". When we used the explode function\
    \ we specified the separator as \"/\". If the user entered 12.12.2010 or 12-12-2010\
    \ the explode function would have placed the entire date into the first array\
    \ because it would not have found the required separator. Therefore, the date\
    \ format would be reassembled as 12.12.2010??, which is of course invalid.\n\n\
    ```\nif(!checkdate($mm, $dd, $yyyy))\n{\n  die(\"Invalid date \" . $Date);\n}\
    \ else\n{\n  $request->addField('Date', $_POST['Date']);\n}\n```\n\nValidating\
    \ email addresses also represents a significant challenge. Without sophisticated\
    \ web methods the only thing you can do is verify that the address represents\
    \ a valid format. A built method in PHP with the FILTER_VALIDATE_EMAIL option\
    \ lets you just do that. If the email address is valid you can insert the entry.\
    \ Otherwise you can stop the script and display a message to the user.\n\n```\n\
    if(filter_var($_POST['Email'],FILTER_VALIDATE_EMAIL))\n{\n  $request->addField('Email',\
    \ $_POST['Email']);\n} else\n```"
