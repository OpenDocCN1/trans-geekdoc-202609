    Start the PHP code by checking the form to see if the Save button was clicked.
    If it was clicked you can tell the $fm object to edit the record using the id
    passed in the URL. This time we need to use a new layout in the database - Related
    Data PHP. You can''t update the record on the demo php page. You need to have
    a separate layout for the Edit variable. For this example we''re only updating
    the Text field. Lastly, send a message to the user to let them know the record
    was saved.


    ```

    if (isset($_POST[''save'']) && $_POST[''save''] == ''Save'') {

    $edit = $fm->newEditCommand(''Related Data php'', $_REQUEST[''id'']);

    $edit->setField(''Text'', $_POST[''Text'']);

    $edit->execute();

    $message = ''<p>Your changes have been saved.</p>'';

    }

    ```


    Check to make sure the id is in the URL. If not, stop the script.


