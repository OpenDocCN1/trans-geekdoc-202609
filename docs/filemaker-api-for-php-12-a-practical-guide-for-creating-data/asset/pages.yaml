    \ method to retrieve the image from the container field. Again, you dont necessarily\
    \ need to know why or how. The upcoming lessons will demonstrate exactly how to\
    \ display an image from a container field both internally and externally. For\
    \ now, you'll include this file in your web sites \"as is\" if you intend to display\
    \ images from a container.\n\n> substr Returns a portion of the string by the\
    \ start and length parameters. This is very similar to the FileMaker Middle function.\n\
    \n```\nhttp://us.php.net/manual/en/function.substr.php\n```\n\n> header Used to\
