  md: '# Lesson 32: Install and Configure SSL to Work with FileMaker Server


    **Objective:** In this lesson you will learn how to install and configure SSL
    to work on Windows or OS X with FileMaker Server. There are although no sample
    files, it is important to know how to configure IIS and Apache as well as FileMaker
    Server to use SSL. This is the only method that will enable a secure connection
    between your web pages and web server. Enabling SSL on FileMaker Server only encrypts
    the connection between FileMaker Pro.


    **Difficulty:** Easy


    **Sample Files:** None


    **Page Navigation:** N/A


    FileMaker API Methods: N/A


    **Procedure:**


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_258_0.png)


    The first issue you may run into is actually binding your certificate to your
    web site. The way the process works as following:


    +   1. Open IIS Server.

    2. Click on the server in the Connections window.

    3. Click Server Certificates in the Security Section.

    4. Click the link to Create Certificate Request in the Actions window.


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_258_1.png)


    Figure 7-78: Prepare the Certificate Signing Request by creating a CSR.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '5. Follow the wizard to create the certificate file, also known as Certificate
    Signing Request (CSR). The certificate creates your public/private key pair that
    will be used to encrypt and decrypt the transactions. Enter the enrolling content
    for the CSR.


    +   a. Organization: use the business legally registered to the domain.


    +   b. Organizational Unit: use the department in your company that will use the
    certificate.


    +   c. Common Name: enter the fully qualified domain or URL for which you plan
    to use for your certificate, such as formulationspro.com. You can also use wildcard
    domains such as *.formulationspro.com, which will serve all subdomains. However,
    this typically cost more money. Check with your certificate.


    +   d. Country: use the 2-letter ISO code for your country, US for United States
    of America.


    +   e. State/Province: use the full name of your state, such as California.


    +   f. City/Location: use the full name of the city where you are located, such
    as San Diego.


    +   6. Click the Next


    +   7. In the Cryptographic Service Provider window, select Microsoft RSA Cryptographic
    Provider with 2048 bit length.


    +   8. Enter the path where you want to save the file (i.e. your desktop of folders)
    and click finish.


    +   9. Send the certificate to your Certificate Authority (CA). The company that
    you will with your SSL certificate (i.e. Verisign, Go Daddy, etc.). Some may want
    you to request and copy/paste content into their web server for submission.


    +   10. They will typically send you a file by your server. Then click the Complete
    Certificate Link in the Actions window and follow the wizard to install the certificate.


    +   11. Choose your site in the Connections window.


    +   12. Click the bindings in the Actions window. Your regular HTTP (Port 80)
    binding should be active.


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_259_0.png)


    13. Edit the Port 80 binding and change the host name to your web site (i.e. formulationspro.com).
    That will tell IIS to listen to any request using that domain for the web site
    folder.


    14. Now click Add to install the SSL binding. Choose hosts for the Type and Port
    443. You should be able to choose your newly installed certificate from the pop
    up menu for the binding.


    15. Click save when you are done and your web site should now be enabled to use
    SSL (i.e. https)'
