  md: '# Lesson 21: Run a Script — Import XLS File


    **Objective:** In this lesson you will learn how to upload an Excel file to the
    server. Then use a script to import the records from the Excel file. We are well
    accustomed to importing data using FileMaker Pro. Unfortunate, that''s not possible
    from a web page. The only way to import data is from a file stored on the server.
    FileMaker Server will only import records from the Documents folder. That location
    is not inside the web root directory. PHP cannot move files outside the root directory
    for security issues — you wouldn''t want an unknown web user moving over your
    server or network. Therefore, we''ll need to utilize the Trio File plugin to move
    the file from the web root to the FileMaker Documents folder.


    This is an Apache/OS X technique. IIS throws too many generic 500 errors with
    this PHP code. The code runs on IIS, but it still displays an error after the
    upload is completed. You will need the Trio File plugin server license to use
    this technique. Please follow the instructions from Trio to install the plugin
    on FileMaker Server for use with the web publishing engine. You can obtain the
    Trio File Plugin demo from our web site at www.trio.com or from the provided sample
    files. As of the writing this I have validated the use of version 6 of the plugin.


    Difficult


    **Sample Files:

    PHPFiles/Advanced/Lesson21/Import.php

    PHPFiles/Advanced/Lesson21/Trio File Plugin v6.1

    PHPFiles/Advanced/Lesson21/Import/sample_import.xls


    Page Navigation:


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_208_0.png)


    **FileMaker API Methods:**

    newSqlCommand()\execute()

    getMessage()

    newFindAllCommand()

    getLastRecord()

    EditRecord()

    newEditCommand()

    setField()

    PerformScriptCommand()


    **Code:**

    ''ve already used the import process in an earlier example. Therefore, there''s
    nothing really new from the PHP code perspective. The important changes in this
    process come from the use of the Trio File Plugin and the FileMaker script to
    move the xls file from the root directory to the FileMaker Server Documents folder.


    Always start by including the connection to the database.


    ```

    <?php

    include(\../../Conn/dbaccess.php");

    ?

    ```


    Create the variables for the messages to display to the users during the import
    process.


    ```

    <?php

    echo $message;

    ```'
