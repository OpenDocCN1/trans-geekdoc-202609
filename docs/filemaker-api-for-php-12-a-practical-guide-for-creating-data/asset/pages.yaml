  md: '# Lesson 34: PHP Calendar


    **Objective:** In this lesson you will learn how to create a dynamic calendar
    for month and day view. Every developer needs to be capable of producing a calendar-based
    solution for their clients. As the creator of the number one world-wide commercial
    calendar solution, Calendar Developer Tool, I can tell you that without a doubt,
    creating a calendar solution solely with FileMaker Pro is far more difficult than
    creating a PHP solution. With PHP, every day is built and displayed dynamically,
    you only need 1 table, and absolutely no extra table occurrences. If you include
    CSS and even some JavaScript you can replicate FileMaker Pro''s built-in features
    with minimal effort and minimal load on the server.


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_274_0.png)


    **Difficulty:** Difficult


    **Sample Files:**

    PHPFiles/Advanced/Lesson34/PHPCalendar.php

    PHPFiles/Advanced/Lesson34/PHPCalendaretail.php

    PHPFiles/Advanced/Lesson34/PHPCalendar.f12


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_274_1.png)


