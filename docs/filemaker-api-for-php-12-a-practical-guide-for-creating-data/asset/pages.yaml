    | List | Detail |


    **FileMaker API Methods:**

    newFindAllCommand()

    execute()

    getRecords()

    getRecordID()

    getField()

    getRecordByID()


    **Code:**


    The database has six fields. A full calendar might have more fields than this.
    However, I want to focus on the core requirements, the bells and whistles. You
    can add those to your own solution. Any good calendar solution allows a single
    event record to span one or more days. Therefore, each record has a DateFrom and
    a DateTo. Where the DateRange field comes in. Using the cRange custom function
    I''m able to create a list of dates for the event. The DateRange field is used
    in the solution to find the records for display in each of the calendar cells.
    The Time field keeps the records in order. The Event field is filled by the user
    for a short description of the event. Finally, the RecordID is the standard record
    identification that I prefer to include in all my PHP solutions so I have direct
    access to the FileMaker internal Number.


    Creating a calendar seems like a daunting task and all right it is. However, if
    you break it down into the basic sub-components you''ll figure out it''s a big
    table with a bunch of repeating table rows and table data. That should be the
    first key that code record really isn''t that difficult. You''ll loop through'
