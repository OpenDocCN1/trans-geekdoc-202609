    Create the search form to find the file SearchRecordsSimple.php to search by the
    field FirstName. This file will act as both the search form and the display for
    the set of records. The form uses the Get method, which means the search string
    will be viewable in the URL for the user. The input name FirstName will be passed
    as the name in the URL. I prefer to use the actual name of the field to make it
    easier to read the URL. The value will be what the user types in the search box.


