- pgno: 355
  md: "```\n</html>\n```\n\nvalidate_cc.php\n\nThe validate_cc.php file contains 2\
    \ main functions and a third that combines the results to determine the overall\
    \ result. The first function, validate_number_type determines the card type, number\
    \ of digits, and any prefix values match the supplied credit card number and type.\
    \ If the card passes the function returns the value of 1. If not, the function\
    \ returns a value of 0. This will be important at the end of this day. The code\
    \ below only works for VISA, MASTERCARD, AMEX, and DISCOVER. If you need to validate\
    \ additional cards you might find more information at:\n\nhttp://en.wikipedia.org/wiki/Credit_card_number.\n\
    \n```\n<php\nfunction validate_number_type($ccnum, $type = 'UNKNOWN')\n{\n //\
    \ Clean up input\n // Make sure this is all UPPERCASE to match the code below\n\
    $type = strtolower($type);\n // Remove everything except numbers\n$ccnum = preg_replace('/\\\
    D/', '', $ccnum);\n\n // Do basic validation for type specific credit cards\n\
    \ // Skip UNKNOWN\nif ($type == 'UNKNOWN')\n{\n    return 1;\n}\n\n // Mastercard:\
    \ 16 digits, prefix of 51-55\nelseif ($type == 'MASTERCARD')\n{\n    echo 'MC';\n\
    \    return (strlen($ccnum) != 16 && !strpos('5[1-5]', $ccnum)) ? 0 : 1;\n}\n\n\
    \ // Visa: 13 or 16 digits, prefix is 4\nselif ($type == 'VISA')\n{\n    echo\
    \ 'VISA';\n    return (strlen($ccnum) != 16 || substr($ccnum, 0, 1) != '4') ?\
    \ 0 : 1;\n}\n\n // AMEX: 15 digits, prefix of 34 or 37\nelse ($type == 'AMEX')\n\
    {\n    echo 'AMEX';\n    return (strlen($ccnum) != 15 && !strpos('3[47]', $ccnum))\
    \ ? 0 : 1;\n}\n\n // Discover: 16 digits, prefix of 6011\nelse ($type == 'DISCOVER')\n\
    {\n    echo 'DISC';\n    return (strlen($ccnum) != 16 || substr($ccnum, 0, 4)\
    \ != '6011') ? 0 : 1;\n}\nelse\n // Default: unknown type\nreturn -1;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 356
  md: "The second function in this file is the Luhn algorithm. This algorithm uses\
    \ the Modulo function to create a checksum that verifies the actual credit card\
    \ number is valid or not. It does not validate if the card has sufficient funds.\
    \ The responsibility of your gateway. was designed to protect against accidental\
    \ errors, malicious attacks. Credit cards and many generator identification numbers\
    \ use the algorithm as a simple method of distinguishing valid numbers from collections\
    \ of random digits. It will detect any single-digit error, as well as all transpositions\
    \ of digits. It will not, however, detect transposition of the two-digit sequence\
    \ 09 to 90. It will detect the 10 possible twin errors (it will not detect 22\
    \ -> 55, 33 -> 66 or 44 -> 77). It is not the only algorithm available. However,\
    \ it is the most common and will probably just fine unless your projects something\
    \ else. You can find more information about this function at:\n\nhttp://en.wikipedia.org/wiki/Luhn_algorithm.\n\
    \n```\nfunction luhn_check($ccnum {\n    // Remove everything except numbers\n\
    \    $ccnum=preg_replace('/\\D/', '', $ccnum);\n\n    // Set the length and parity\n\
    \    $number_length=strlen($ccnum);\n    $parity=$number_length % 2;\n\n    //\
    \ Loop through each digit and do the math\n    $total=0;\n    for($i=0; $i<$number_length;\
    \ $i++) {\n        $digit=$ccnum[$i];\n        // Multiply alternate digits by\
    \ two\n        if ($i % 2 == $parity) {\n            $digit*=2;\n            //\
    \ If the sum is two digits, add them together (in effect)\n            if ($digit\
    \ > 9) (\n                $digit-=9;\n            )\n        }\n        // Total\
    \ up the digits\n        $total+=$digit;\n    }\n\n    // If the total mod 10\
    \ equals 0, the number is valid\n    return ($total % 10 == 0) ? 1 : 0;\n}\n```\n\
    \nFinally, the validate_cc function pulls both the values from the above functions.\
    \ If both pass they will supply a value of 1 for a total of 1+1=2. That's Validate.php\
    \ page was checking for a value of 2. If one or either fails the maximum value\
    \ they can return 1. I'm assuming a value of 1 or 0 is returned the credit card\
    \ number has failed. I don't care how it failed. I just know that something is\
    \ wrong and will stop the user before the data is inserted into the database.\n\
    \n```\nfunction validate_cc($ccnum, $type = 'UNKNOWN') {\n    $validate_number_type\
    \ = validate_number_type($ccnum, $type);\n    $luhn_check = luhn_check($ccnum);\n\
    \    return $validate_number_type+$luhn_check;\n}\n?\n```"
  merge: -1
  img_proc: true
