  md: '# TextWrangler


    www.bbedit.com


    Cost: FREE


    At its most basic, a text editor is a tool for simply editing text. You can use
    a text editor for a wide variety of tasks from cleaning up data, to editing configuration
    files on your Mac or server, to writing HTML or coding. TextWrangler is considerably
    more modern and capable than BBEdit Lite. Among other things, it can open files
