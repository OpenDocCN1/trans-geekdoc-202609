  md: '# Lesson 39: Google Map API Store Locator


    **Objective:** In this lesson you will learn how to integrate the Google map API.
    If you''ve been trying to integrate Google maps into your FileMaker PHP site I
    know you''ve looked at their code and ever gave up or lost of time suffering through
    countless pages of documentation and JavaScript. As of May 2011 Brad Welled released
    a phenomenal PHP class that makes Google Maps extremely easy to use. Although
    it''s "officially supported" by Google because it''s not an in-house project,
    they did present it at their conference and provided Brad with a very nice site
    using their domain. That tells me that Google really likes it and so do I. You
    can find more information about the class at:


    ```

    http://code.google.com/p/php-google-map-api/

    ```


    **Difficulty:** Difficult


    **Sample Files:

    PHPFiles/Advanced/Lesson39/GoogleMap.php

    PHPFiles/Advanced/Lesson39/JSMIn.php

    PHPFiles/Advanced/Lesson39/StoreLocator.php

    PHPFiles/Advanced/Lesson39/StoreLocator.f12


    This lesson uses a separate database file to demonstrate the lesson. Please upload
    the StoreLocator.fmp2 database file to your server.


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_309_0.png)


    **Page Navigation:**


    | List |

    |---|


    **FileMaker API Methods:

    newPerformScriptCommand(

    getRecords(

    getField(



    **Code:**


    There are so many features available in Brad''s V3 release that I could spend
    a tremendous time to present a few of the most common requests from developers
    to cover everything. Rather than that I''m going to acquire and insert it into
    your own database. My goal is to transform the existing documentation (or lack
    thereof) and example code into something useful for the FileMaker developer community.
    The first example will be creating a store locator that utilizes Google''s Geocoding
    service to find and display records from the database with userdefined distance.


    The database has fields for name, address, city, and state. Those should be obvious.
    Next there are fields for the Latitude (Lat) and Longitude (Lon) of the restaurant.
    I''ve provided the data for the records. In the next lesson I will show you how
    to acquire and insert it into your own records. The SearchLocation, and Distance
    fields are used by the Store locator to find records based on user supplied. The
    Distance calculation uses the Great Circle Navigation Formula (a.k. Haversine
    formula) to calculate the distance between the user''s location and each of stores.
    More information about the formula can be found from my article, Map Distance,
    that I published using FileMaker Pro 9 at:


    ```

    http://www.formulations.com/pages/filemaker/detail.php?id=213

    ```


    or:'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'http://en.wikipedia.org/wiki/Haversine_formula


    or


    The math for the Distance calculation involves some fairly nasty Trigonometry.
    Since a math lesson isn''t the point of it I''ll let you understand the math on
    your own, knowing that you can use the calculation as and it will work correctly.
    The only thing I will say about the Distance calculation is that it calculates
    distance in miles. If you use it in kilometers, you can change the constant in
    the calculation from 3959 to 6371.


    The general steps in the process are as follows: the user submits with their current
    address or zip code and the next. Next, the PHP class contains the or zip code
    to Latitude and Long values. The more specific your request, the more accurate
    the lat/long values. That''s obvious. These values, along with the user''s requested
    date are submitted to the Store Locator script in the database. The script inserts
    values into the SearchLat, SearchLon, and Distance fields to acquire a found set
    of records. The records are sorted by the date, returned to the web page, and
    finally displayed to the user.


    StoreLocator.php


    There are two main processes to make this solution work. First is the PHP page.
    Second is the Store Locator. It''s more efficient to describe each one separately,
    so we''ll start with the StoreLocator.php page. Always start by including the
    connection to the database.


    ```

    <php

    require_once (''FileMaker.php'');

    $fm = new FileMaker();

    $fm->setProperty(''database'', StoreLocator);

    $fm->setProperty(''hostname'', ''http://127.0.0.1/'');

    $fm->setProperty(''username'', ''Admin'');

    $fm->setProperty(''password'', ''1234'');

    ```


    You''ll also need to include the two required classes included for you in the
    download file. GoogleMap.php contains all the code to connect to the Google Map
    API. You technically don''t need to do anything to this. However, if you look
    through it you''ll notice that you can configure any feature that is available
    through the API by changing the value from false to true. Most features are turned
    on by default in this file. I can''t say enough regarding the simplicity of control
    over the Google Map API. What would you do - change values from false to true
    or handle hundreds of lines of code from Google? Next is the JSMin.php file which
    is all. Again, my hat is off to Brad as he ported all the code to PHP. You don''t
    have to code any JavaScript. It just works!


    ```

    include_once(''GoogleMap.php'');

    include_once(''JSMin.php'');

    ```


    Next, create the form for you by using the PHP_SELF dynamic shortcut to point
    the form back to the same page. After that, you can set your distance popup menu
    with any values that make sense for your solution.


    ```

    <html>

    <head>

    </head>

    <body>

    <form action="<?php echo \$_SERVER[''PHP_SELF''];?>" method="get" id="search">

    Enter your address (Address, City, State) or Zip Code:

    <br>

    <input name="search" type="text">

    <br>

    Distance (miles):

    <select name="distance">

    <option value="5" selected>5</option>

    <option value="10">10</option>

    ?>

    ```


