  md: '# Part VIII — Additional Information


    The remainder of this book will contain mostly technical information. The goal
    is to provide you with additional resources to help you make informed decisions
    and become a better programmer and system administrator. In most cases you will
    not be responsible to create web pages. You''ll also be responsible to build the
    database and administer the server. Once you have built your initial site the
    majority of your daily tasks will be geared towards troubleshooting, tweaking,
    and needing new resources to improve your skill set.


    # Extended FileMaker vs. PHP Syntax


    If you''re like my comfort zone lies within the constraints of the FileMaker calculation
    engine and scripts, any time someone throws something out like PHP, AppleScript,
    VBA, you cringe at the thought of having anything new. Your first approach is
    usually to reach out to a plugin vendor that will keep you inside the calculation
    engine or create your own custom function. If that doesn''t work, most people
    either call a consultant or give up — proclaiming ‘it can’t be done with FileMaker’.
    Rest assured, I’ve come across very many scenarios in the past twenty-five years
    where FileMaker couldn''t handle the job. That includes relifying the calculation
    engine using PHP. This is exactly where I start when something new comes along.
    If the technology can do everything that the calculation engine can do, and not
    tax my brain, then a comparison of PHP math strings and functions will be helpful.
    In fact, you''ll find that how you can replicate the calculations using PHP has
    a lot more functions in PHP than FileMaker has to offer. PHP may even give you
    some good ideas for custom functions that you should install in FileMaker


    Sample Files: PHPFiles/FileMakerPHPSyntax.php


    Math Functions: http://us.php.net/manual/en/ref.math


    String Functions: http://us.php.net/manual/en/ref.strings


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_361_0.png)


    | FileMaker | PHP | Result | PHP Reference |

    |---|---|---|--|

    | 10³ | pow(10,3) | | http://us.php.net/manual/en/function.pow |

    | Acos(-0.5) | acos(-0.5) | 2.09 | http://us.php.net/manual/en/function.acos |

    | Asin(-0.5) | asin(-0.5) | -0.52 | http://us.php.net/manual/en/function.asin
    |

    | Atan(1) | atan(1) | | http://us.php.net/manual/en/function.atan |

    | Average("2";4";6") | $sum = (2+4+6); | 0.79 | http://us.php.net/manual/en/function.avg
    |

    | Case | $values = array("2", 4, 6"); $count = count($values); echo "count: "$count;
    if(...){} else{...} | | | http://us.php.net/manual/en/control-struct |

    | Cos(1.047) | cos(1.047) | 0.5 | http://us.php.net/manual/en/function.cos |

    | Count("2";4";6") | | | 4 | http://us.php.net/manual/en/function.count |

