  md: "# Upload.php\n\nAll the hard work of uploading, renaming, and validating the\
    \ file is done in this file. It includes a lot of built in PHP features to make\
    \ your life very easy. Uploading files is also available with ASP. However, I've\
    \ yet to find a JSP version that works with FileMaker Server.\n\nAlways start\
    \ by including the connection to the database.\n\n```\n<?php\ninclude(\"../Conn/dbaccess.php\"\
    );\n?>\n```\n\nStart making sure the Record ID was passed in the URL as the id\
    \ value. It is critical that we have this value to rename the file and match it\
    \ to the database record.\n\n```\nif (empty($_REQUEST['id']))\n{\\ die('The record\
    \ id is missing.');\n}\n```\n\nThe upload process is done with a form at the end\
    \ of the code. We need to check to see that the Post method is used and that the\
    \ user clicked the Upload button.\n\n```\nif (isset($_POST['upload']) && $_POST['upload']\
    \ == 'Upload')\n```\n\nNext, we can validate the file type that the user is trying\
    \ to upload using the $_FILES superglobal. In this example we are limiting the\
    \ upload to MIME types for gif, jpeg, jpg and png images. It's usually a good\
    \ idea to prevent any other known file types to prevent viruses from being uploaded.\n\
    \n![](img/5a2c5fda68d42e5d65f51850276e49ec_151_0.png)\n\nppjg is a \"progressive\"\
    \ jpg file. Processing jpeg divides the file into a series of scans. The first\
    \ scan shows the image at the equivalent of a very low quality setting, which\
    \ takes very little space. Following scans gradually improve the quality. Each\
    \ scan adds to the data already provided, so that the total storage requirement\
    \ is roughly the same as for a baseline JPEG image of the same quality as scan.\n\
    \n$FILES: Superglobal allows you to upload files from a client computer to the\
    \ server, capturing important information about the file.\n\n$FILES[\"file']['name\"\
    ] - the name of the uploaded file\n\n$FILES[\"file']['type'] - the type of the\
    \ uploaded file\n\n$FILES[\"file']['size'] - the size in bytes of the uploaded\
    \ file\n\n$FILES[\"file']['tmp_name'] - the name of the temporary copy of the\
    \ file stored on the server\n\n$FILES[\"file']['error\"] - the error code resulting\
    \ from the file upload\n\n```\nif(\n($_FILES[\"new_image\"][\type\"] == \"image/gif\"\
    \n  ($_FILES[\"new_image\"][\type\"] == \"image/jpg\"\n  ($_FILES[\"new_image\"\
    ][\type\"] == \"image/jpeg\"\n  ($_FILES[\"new_image\"][\type\"] == \"image/pjpg\"\
    \n  ($_FILES[\"new_image\"][\type\"] == \"image/png\"))\n```\n\n144"
