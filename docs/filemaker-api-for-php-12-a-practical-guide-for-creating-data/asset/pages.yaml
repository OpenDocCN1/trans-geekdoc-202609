  md: 'Objective: In this lesson you will learn how to expire download links. The
    proliferation of electronically downloaded software, ebooks, music, images, etc.
    has prompted the need to be able to automate the security of your intellectual
    property whereby the authorized purchaser is able to download the file. The biggest
    technical issue that you have to overcome is that you shouldn''t reveal the actual
    URL to the file to the purchaser. If they get to hold of a path to the file they
    could share with anyone on the Internet, or worse it be caught by multiple search
    engines. Then your product would quickly become free for everyone. So how you
    send them a link to a file, without hiding the actual path? Once they have the
    link can you prevent them from sharing it with someone else? This lesson will
    show you a very robust method to create a random link that is emailed to the customer.
    The link will also expire after a predefined number of days, which will be able
    to prevent downloads from multiple IP addresses, and will limit the number of
    attempted downloads.


    If you''re not familiar with this technique is useful I''ll point out FileMaker''s
    own software download page. Since FileMaker went completely electronic they had
    to decide a method to secure their software and license keys and turn them to
    a disk or place them on a network drive (such as many of our clients) you quite
    realize that if your customers forget to download their software and license is
    active for only 30 days. If when you call FileMaker Customer Service they can
    not only see if the files have been downloaded, but they can reactivate the record
    for you in a matter of minutes. Now I don''t know exactly how they set up their
    system, but if I would design guarantee that I would not be creating files or
    a new record in the database. I would simply update the random key and change
    the expiration date in the record. Then send you a new link via email. I''m sure
    your system is very similar to this approach.


    Difficulty: Difficult


    Sample Files:

    PHPFiles/Advanced/Lesson37/ExpireLink.php

    PHPFiles/Advanced/Lesson37/ExpireLink.fmp12


    > This uses a separate database file to manage the lesson. Please upload the ExpireLink.fmp12
    database file to your server.


    Page Navigation:


    +   - List


    FileMaker API Methods:

    newCommand()

    addCriterion()

    execute()

    getFirstRecord()

    getField()

    RecordID()

    newEditCommand()

    setField()


    Code:


    Theemo database is a simple, single URL link with several fields.'
  merge: -1
  img_proc: true
- pgno: 291
  md: "a calculation or look up the link from a product table and combine it with\
    \ the RandomKey value to complete the URL link. Finally, send the Link to the\
    \ customer in an email.\n\nThe **ExpirationDate** field is used to expire the\
    \ link. The field enters the current date plus 30 days when the record is created.\
    \ If the customer tries to download the file after the expiration the PHP code\
    \ will prevent them from downloading the file.\n\nThe **IPAddress** field can\
    \ be utilized to allow only a single user to download the file. This will prevent\
    \ the user from sharing the link with other people or the link cached on a server\
    \ engine, rendering your product free to the entirety! One to keep in mind when\
    \ you are testing that your localhost server's IPv6 address will be returned as\
    \ \":\". That's equivalent to 127.0.0.1 on an IPv4 network. Therefore, it may\
    \ look a bit strange when you are testing the solution. In the PHP code I added\
    \ an optional section that you can uncomment to acquire the real IP address of\
    \ users through a proxy server.\n\nThe **DownloadAttempts** field is used to track\
    \ how many times the user has downloaded the file by clicking the link. You may\
    \ reset the link if you're thinking outside the box you'll realize that you can\
    \ also use this file and technique to report usage statistics for your web site.\n\
    \nThe **FileName** field is the file user is allowed to download. For this example,\
    \ use a folder called \"downloads\" where I store all the files. In a full working\
    \ model after the customers make the newly created record will look like this\
    \ file from the product table.\n\nYou probably thinking that this process was\
    \ complicated; you had to generate an encrypted key for the URL, you had to create\
    \ new files with names, then delete them after they were downloaded, the files\
    \ themselves some exotic type of security, etc. The truth is that it's not complicated\
    \ you can see how the process works. The most complicated part is identifying\
    \ the components that you need to implement for your customers. The database fields\
    \ and PHP code isn't overly complicated. So let's get started with the PHP code:\n\
    \nStart by connecting to the database.\n\n```\n<html>\n<body>\n<?php\nrequire_once\
    \ ('FileMaker.php');\n$fm = new FileMaker();\n$fm->setProperty('database', 'ExpireLink');\n\
    $fm->setProperty('hotscape', 'http://127.0.0.1/');\n$fm->setProperty('username',\
    \ 'Admin');\n$fm->setProperty('password', '1234');\nn?>\n```\n\nWhen the user\
    \ clicks the link to send them in the email the first thing your code needs to\
    \ do is find the record in the database using the RandomKey passed in the URL.\
    \ If the record has been deleted you can stop the script. If you find a matching\
    \ record you can process the rest of the script.\n\n```\n$randomKey = $_GET['RandomKey'];\n\
    $request = $fm->newFindCommand('demo');\n$request->addFilter('RandomKey', $randomKey);\n\
    $result = $request->execute();\nif(FileMaker::isError($result)) {\n    echo \"\
    Your key no longer exists.\";\n    exit;\n} else {\n?>\n```\n\nIf the records\
    \ you exist can store the field values as variable to make it easier to process\
    \ the rest of the script. Just in case you need to update the recordID — that's\
    \ the internal FileMaker ID"
  merge: -1
  img_proc: true
- pgno: 292
  md: "number for the record.FileMaker updates records based on this number, not your\
    \ own auto-generated Serial number. We'll also need to convert the PHP date to\
    \ the FileMaker format of MM/DD/YYYY. To get the user's remote address we will\
    \ use the PHP $_SERVER method. This will work in all cases when the user is using\
    \ a proxy server that masks their IP address. I have included the optional code\
    \ in the web page to acquire this\n\n```\n$record = $result->getFirstRecord();\n\
    $link = $record->getField('Link');\n$expiringdate = $record->getField('ExpirationDate');\n\
    $ipaddress = $record->getField('IPAddress');\n$downloadattempts = $record->getField('DownloadAttempts');\n\
    $recordid = $record->getRecordID();\n$currentdate = date('m/d/Y');\n$filename\
    \ = $record->getField('FileName');\n$remoteipaddress = $_SERVER['REMOTE_ADDR'];\n\
    ```\n\nNow that we have all information as variables, we can get to work evaluating\
    \ the customer's authorization to download the file. When the customer first tries\
    \ someone is spoofing the IPAddress field will be blank. That makes sense because\
    \ we won't necessarily know where they are coming from. Therefore, if the $ipaddress\
    \ is empty, we can update the record with the customer's current IP Address. This\
    \ will look in the download for that specific IP Address. Therefore, nobody will\
    \ be able to access the download using the supplied link. After that it's as easy\
    \ as checking the IPAddress in the database against the customer's current IP\
    \ address to continue\n\n```\nif(empty($ipaddress)) {\n  $edit = $fm->newEdit('Demo',\
    \ $recordid);\n  $edit->addField('IPAddress', $remoteipaddress);\n  $edit->execute();\n\
    }\n```\n\n```\nelseif($ipaddress != $remoteipaddress) {\n  echo \"You are not\
    \ authorized to download this file\";\n  exit;\n}\n```\n\nThe next step is to\
    \ validate the expiration date of the link. If the current is greater than the\
    \ expiration date in the record you can run the script. Alternatively, some people\
    \ might recommend immediately deleting the record at this point to prevent it\
    \ from being accessed. However, I would caution you from a customer service perspective\
    \ that this will be much easier to allow your employees to reset the expiration\
    \ date of an existing record than to create a new record. I am just thinking about\
    \ customers who have to call FileMaker to get a new link to their software downloads.\n\
    \n```\nif($currentdate > $expirationdate) {\n  echo \"Your link is expired.\"\
    ;\n  exit;\n}\n```\n\nNext we want to update the DownloadAttempts field. This\
    \ can be used to limit the number of times the file can be downloaded by anyone\
    \ — even someone spoofing their IP address. For this demo I set the maximum number\
    \ of download attempts to 5. The added benefit of this concept is that you can\
    \ also use it for your web site statistics — how many times a specific file has\
    \ been downloaded, how many times has a specific page been accessed, etc. Do you\
    \ see the potential in just a few lines of code and a simple record in the database?\n\
    \n```\n$edit = $fm->newEdit('Demo', $recordid);\n$edit->addField('DownloadAttempts',\
    \ $downloadattempts+1);\n$edit->execute();\nif($downloadattempts >= 5) {\n  echo\
    \ \"You have exceeded the maximum number of downloads\";\n  exit;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 293
  md: "Once the customer passes all of your security checks we get to the more complex\
    \ part of the code. We need to build the header to the browser to download the\
    \ file without revealing the exact path to the file. Start by storing the path\
    \ to the file as the $fullPath variable. I hard-coded the path to the downloads\
    \ folder. Then concatenated the file.\n\n```\n$fullPath = \"downloads/\" . $filename;\n\
    ```\n\nInternet Explorer apparently has issues with web servers compressing the\
    \ file. You also don't want to tax the server to compress the file either. We'll\
    \ temporarily turn off the output compression setting in the php.ini file.\n\n\
    ```\nif(ini_get('zlib.output_compression')) {\n    ini_set('zlib.output_compression',\
    \ 'Off');\n```\n\nNext, it may seem obvious, but it's a good idea to check if\
    \ the file actually exists before we go any. Create the variables for the size\
    \ of the file and the extension. If you use the pathinfo method it will create\
    \ an array of useful information regarding the path and the file. It's much easier\
    \ to extract information using this array than to parse it using a custom function.\n\
    \n```\nif(file_exists($fullPath)) {\n    $size = filesize($fullPath);\n    $path_parts\
    \ = pathinfo($fullPath);\n    $ext = strtolower($path_parts['extension']);\n```\n\
    \n![](img/5a2c5fda68d42e5d65f51850276e49ec_293_0.png)\n\n![](img/5a2c5fda68d42e5d65f51850276e49ec_293_1.png)\n\
    \n![](img/5a2c5fda68d42e5d65f51850276e49ec_293_2.png)\n\nNow we can use the switch\
    \ method to \"switch\" the extension we stored in the $ext variable above with\
    \ the associated MIME type. In the sample code I provided a list of common file\
    \ types. You can add this to list or just utilize the last line of code that defines\
    \ a default value for \"application/force-download\".\n\n```\nswitch ($ext) {\n\
    \    case \"pdf\": $type=\"application/pdf\";n    case \"exe\": $type=\"application/octet-stream\"\
    ;n    case \"zip\": $type=\"application/zip\";n    case \"doc\": $type=\"application/msword\"\
    ;n    case \"xls\": $type=\"application/vnd.ms-excel\";n    case \"ppt\": $type=\"\
    application/vnd.ms-powerpoint\";n    case \"gif\": $type=\"image/gif\";n    case\
    \ \"png\": $type=\"image/png\";n    case \"jpg\";\n    case \"jpg\": $type=\"\
    image/jpeg\";\n    default: $type=\"application/force-download\";\n```"
  merge: -1
