  md: "```\nphp function: Users can define their own functions with any valid PHP\
    \ code.\nhttp://us.php.net/manual/en/functions.user-defined.php\n```\n\n```\n\
    php strtolower: Make the supplied string lower case.\nhttp://us.php.net/manual/en/function/strtolower.php\n\
    ```\n\n```\nphp explode: Split a string into an array by a delimiter.\nhttp://us.php.net/manual/en/function/explode.php\n\
    ```\n\n```\nphp end: Obtain the last element of an array.\nhttp://us.php.net/manual/en/function.end.php\n\
    ```\n\n```\nphp return: Ends the execution of the current function, returning\
    \ the argument as the value of the function.\nhttp://us.php.net/manual/en/function.return.php\n\
    ```\n\nNow we have a function that will obtain the extension we can define a variable\
    \ to create the final destination path and name that will be inserted into the\
    \ URL field in the record. Combine the previously defined $image_directory path,\
    \ the id value from the URL, a dot \". for the extension, and the extension from\
    \ the uploaded file using the function we created above for findext.\n\n```\n\
    $destination_file = $image_directory . $_REQUEST['id'] . \".\nfindext($_FILES['new_image']\
    \ . 'name');\n```\n\nNow we have all the pieces we need to move the temporary\
    \ file, rename the file, and update the database. Using the PHP move_uploaded_file\
    \ method and insert the $temporary_file and $destination_file variable we defined\
    \ above If the $move variable is successful we can update the database and set\
    \ the URL field. Otherwise, we should alert the user that there was an error.\n\
    \n```\n$move = move_uploaded_file($temporary_file, $destination_file);\nif ($move)\
    \ {\n  $url = $destination_file;\n  $insert = $fm->newEditCommand('Demo php',\
    \ $_REQUEST['id']);\n  $insert->addField('URL', $url);\n  $insert->execute();\n\
    } else {\n  die('There was an error moving the file');\n}\n```"
