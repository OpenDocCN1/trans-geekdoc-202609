- pgno: 269
  md: '# Lesson 33: PHP with AJAX


    **Objective:** In this lesson you will learn how to use AJAX in conjunction with
    your PHP pages. This lesson will display hundreds of records and show detail button
    for each record. The detail button will update a single record at a time rather
    than updating all records. AJAX stands for Asynchronous JavaScript and XML. You
    don''t have to use XML to make this work. This lesson will only use JavaScript
    and PHP. The power behind AJAX is the ability to retrieve data from your database
    and only update part of your web rather than reloading the entire page. The point
    behind AJAX is to reduce the load on your server. It is also cross-platform independent,
    which is always a nice bonus. I believe that with the use of any technology should
    be used appropriately. You won''t need to reinvent the wheel with AJAX for your
    design. It does take a lot of extra code and an extra web page each time you need
    to call the JavaScript function. If you are displaying 1 record at a time AJAX
    probably isn''t going to provide you with any noticeable improvement in performance.
    If, you are displaying a lot of records you could use AJAX to fetch the data from
    a single record when the user clicks a button to "show detail". I would also suggest
    that in a real-world design you need to display hundreds of records you want to
    re-think your design and implement a page system of say 10 records at a time to
    reduce the load on the server. If the user wants more information they can click
    the link and be to the single detail page. That will provide the same performance
    as AJAX, with less overhead and fewer technologies to support.


    **Difficulty:** Difficult


    **Sample Files:**

    PHPFiles/Advanced/Lesson33/show_all.php

    PHPFiles/Advanced/Lesson33/show_detail.php

    PHPFiles/Advanced/Lesson33/ajax.f12


    > This lesson uses a separate database file to demonstrate the lesson. Please
    upload the ajax.f12 database to your folder.


    **Page Navigation:**


    List | Detail | Database

    |---|---|---|


    **FileMaker API Methods:**

    newFindAllCommand()

    execute()

    getRecords()

    RecordID()

    getField()

    RecordByID()


    **Code:**

    The sample database has 152 records from pizza restaurants around the country.
    The whole point of AJAX is to improve performance. There the Demo layout only
    displays the Name field to match the show_all.php page. To maximize your layouts
    you should only have the fields that display on the web page. Adding additional
    fields slows down the response time. It may not be apparent for 152 records and
    four fields. However, under load with dozens of fields and thousands of records
    you could take an unnecessary performance hit, which is what AJAX can help solve.
    The second layout, Demo Detail, has the Address, City, and State fields. Notice
    that Name is not on the layout. That''s because the show_detail.php page that
    AJAX uses to retrieve the record only needs these three fields. Again, it''s all
    performance and using exactly what you need and nothing more.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'How does AJAX work? The user''s browser displays one or more records. On the
    web page (show_all.php) there is a button that the user can click to show more
    detail. JavaScript on the web page creates an XMLHttpRequest to send the HttpRequest
    to a second web page (show_detail.php). In layman''s terms this means when the
    user clicks the button a pre-defined URL string is created to request information
    from second web page. Usually the request is in POST format so we can send large
    amounts of data if necessary. Next the web page receives the HttpRequest and passes
    it to the server to retrieve the requested data. The database returns the records
    the second web page creates (using PHP) to format the data using HTML/CSS which
    is displayed directly on the user''s web page. Finally the JavaScript processes
    the data and updates the page content without a reload.


    Do you need to implement AJAX? There are no classes or JavaScript files (js) to
    install or order. Obviously, you''ll need to useMaker and PHP for this example.
    Realistically, you should know some basic JavaScript, HTML, and CSS. You can get
    away without knowing how to use HTML and CSS instead which is what I recommend.
    Most important is that the JavaScript function is perfectly defined. You''re not
    going to make too many changes to it. You''ll copy/paste the same code all the
    time and only tweak what need, such as the function name and/or any variables
    you want to pass to it. However, I''m going to show you how to use the * RecordID
    to easily grab the record every time without having to change the core JavaScript
    code for any solution.


    show_all.php


    Rather than starting at the beginning of the page and jump into the JavaScript
    code I''m going to start with the PHP code and the body. I feel that the JavaScript
    code will make more sense with this approach. Start by connecting to the database.


    ```

    <?php

    require ''FileMaker.php'';

    $fm = new FileMaker();

    $fm->setProperty(''database'', ''ajax'');

    $fm->setProperty(''host'', ''http://127.0.0.1'');

    $fm->setProperty(''username'', ''Admin'');

    $fm->setProperty(''password'', ''1234'');

    ```


    Next, find all the records from the Demo layout and store the results in the $records
    array. This will be used by the body of the web page to display the data.


    ```

    $request = $fm->findAllCommand(''Demo'');

    $result = $request->execute();

    $records = $result->getRecords();

    ```


    The body is where the dynamic work to display and the Show Detail button is performed.
    The AJAX works is that it replaces the content of a div tag that is returned from
    the show_detail.php page. In this case, we''re going to replace the contents of
    the DIV tag, which is intentionally empty for this demonstration. If you have
    any content in the DIV tag, it can''t be replaced. Since we''re working with multiple
    records on the page the ID of the DIV tag can''t be fixed. If we use a fixed name,
    only the first occurrence of a DIV tag will be replaced (which is very limited).
    However, it has to be dynamic. We will use JavaScript to dynamically name the
    DIV tag for each record that is displayed in the browser. The code loops through
    each of the records to store the RecordID value as the $id variable. We define
    the name field and the Show Detail button below it. When the user clicks the (onclick)
    it triggers the ShowDetail JavaScript function. Since the JavaScript to update
    a specific the key pathway to this section of code - passing the dynamic DIV tag
    name as the RecordID to the JavaScript function. Again, if you have more than
    one record on the page, you have to dynamically name the DIV tag or the JavaScript
    won''t work. As you expect if only one record on the page, you can give the DIV
    tag a fixed name. However, since we are dealing with a database and little tweaking
    code, I''d rather copy/paste the same code over and over and not have to worry
    about changing anything. This code will work for one record or multiple records.'
  merge: -1
  img_proc: true
