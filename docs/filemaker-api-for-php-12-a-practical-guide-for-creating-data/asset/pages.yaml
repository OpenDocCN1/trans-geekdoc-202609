- pgno: 48
  md: '# PART IV — Choosing a RAD tool vs. a Free Text Editor


    You need to have a text editor or rapid application development software (RAD)
    to create your web pages. Please don''t try to create web pages with Microsoft
    Word, Notepad, TextEdit, etc. The question is how much money you want to spend
    and how do you want to be? In my opinion, something is "free" does not necessarily
    mean you are going to be able to use it effectively in a commercial development
    environment. Your loss of time using free software could amount to well in excess
    of cost to purchase professional software development. Honestly, $400 is not too
    much if this is your reality, a critical business decision, or if you want tools
    that make you more productive. The Internet is not "free", but many people believe
    that it is, and that''s another topic of discussion.

    With that said, I recommend professional editors like Dreamweaver and BBEdit.
    Dreamweaver has the latest features and is fully integrated with the Adobe product
    line. There are hundreds of plugins from third party vendors to extend Dreamweaver.
    I also like the fact that it has built in coding capabilities for PHP, ASP, JSP,
    and SQL.


    Next comes BBEdit with Bare Bones Software.

    Next comes BBEdit with Bare Bones Software. BBEdit has improved significantly
    over the years. You''ll like it for its dedicated simplicity to creating web pages.
    BBEdit Lite does not exist anymore. It was replaced by the much-needed TextWrangler.
    TextWrangler is also free. However, you''ll notice the lack of integration and
    design view can make it more challenging to use. Please keep in mind that BBEdit
    and TextWrangler are for OS only.


    If you are looking for a free text editor for Windows you might want to consider
    Notepad++. It has a number of basic features for creating html code and syncing
    files with the server. The downfall is that its not necessarily the prettiest
    the most user-friendly option. Nvu is another option that has around for a long
    time and has recently been updated to support all OS users (except Lion 10.7)
    Vu was designed to look and feel like Dreamweaver.


    Lastly, if you are interested in PHP development you might want to evaluate Zend
    Studio. It is relatively expensive Dreamweaver However it does encompass PHP and
    will work with the Zend Framework PHP to extend PHP. Whereas Dreamweaver is possibly
    spread a little too thin because it has for so many technologies under one umbrella.
    Another thing about Zend is that they have a complete Web Application Server for
    PHP and a Cluster Manager if you need load balancing and scalability. Again, Zend
    is more professional, paid support and applications go a lot further than "free"
    applications such as Apache and IIS.


    # Dreamweaver


    www.adobe.com


    Cost: $399


    Adobe Dreamweaver CS6 empowers designers and developers to build standards-based
    websites with confidence. Work visually or directly in code, develop with your
    existing content management system like WordPress, Joomla, or Drupal, with CSS
    input templates. Simplify advanced development with integrated support for Subversion
    and custom PHP code hinting. Get fast and accurate browser-compatibility testing,
    and test dynamic content to integration with Adobe products.


    # BBEdit


    www.bbedit.com


    Cost: $49


    BBEdit 10 is the leading professional HTML and text editor for the needs of Web
    authors and software developers, this award-winning product provides an abundance
    of high-performance features for editing, searching, and manipulation of text.
    An intelligent interface provides easy access to BBEdit''s best-of-class features,
    including grep pattern matching, search and replace across multiple files (even
    opened files on remote servers), function navigation and syntax coloring for numerous
    source code languages, code folding, FTP and SFTP open and save, AppleScript,
    Mac OS X scripting support, text and code completion, and of course a complete
    set of robust HTML tools.'
  merge: -1
  img_proc: true
