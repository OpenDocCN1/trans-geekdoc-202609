  md: 'We''re not quite done with everything that needs be installed. You still need
    to install and configure FileMaker Server. Once FileMaker Server is installed
    and configured and you have FileMaker Server install FileMaker PHP you''ll be
    ready to go. Utilize FileMaker Server with PHP you only need FileMaker Server.
    You do not need FileMaker Server Advanced. The only reason why you need FileMaker
    Server Advanced is if you want to utilize Instant Web Publishing or access your
    database with ODBC or JDBC driver. For those of you that are PHP/MySQL programming
    you are probably used to using an ODBC driver. You can easily access a FileMaker
    database with PHP and an ODBC driver. The point of this is to cover the supported
    technology from FileMaker the API for PHP. The API does not need an ODBC driver.
    There are specific advantages and disadvantages of both methods, which are discussed
    at the end of the book.


    # Single Server Model Installation


    In the previous chapter you installed and configured Apache or IIS on your computer.
    You will now install FileMaker Server on the same computer. FileMaker Server will
    install what you need to use PHP including the PHP engine and the FileMaker API
    for PHP. If you have already installed PHP you will be able to choose your installation.
    Please note the following system requirements for the proper installation of FileMaker
    Server 12.


    +   * Windows 7 Professional SP1, 32-bit

    * Windows Server 2008 Standard SP2, 32-bit

    * Windows Server 2008 R2 SP1, 64-bit

    * Windows 7 Professional SP1, 64-bit

    * Windows Server 2008 Standard Editions SP2, 64-bit

    * Windows Server 2003 R2 SPC, 32-bit


    +   * Max OS X or OS X version 10.6.8, 32-bit or 64-bit

    * Mac OS X or OS X version 10.7, 64-bit


    > The installation of FileMaker Server on OS X and Windows is essentially the
    same. However, the screens will be slightly different.


