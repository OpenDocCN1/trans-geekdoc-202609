- pgno: 393
  md: '# # FileMaker API for PHP 12


    A Practical Guide for Creating Database Web Sites with FileMaker 12 and FileMaker
    Server 12


    The only complete reference book for the FileMaker API for PHP using FileMakerPro
    12 and FileMaker Server 12. Whether you are a beginner or a professional developer
    you will find the information in this book to be invaluable. Part I starts by
    getting you ready to publish data to the web with a primer about the basic HTML
    you will need to work with the examples in this book. Part II shows how to install
    and configure Apache or IIS as your web server. Part III shows how to install
    and configure FileMaker Server. Part IV provides information about free text editing
    tools to build your sites. Part V teaches you about PHP syntax to work with the
    examples in this book. Part VI explains the sample database fields, layouts, and
    scripts that are used for all the examples in the book. Part VII contains more
    than 60 complete and advanced PHP examples that will teach you to build professional
    websites. Part VIII wraps up the reference information with extended FileMaker
    vs PHP syntax, performance and security considerations, understanding logs and
    error code, and a FileMaker API for PHP reference guide. Lastly, this is a completely
    revised book. Every line of code has been re-validated with FileMaker Pro 12,
    IIS, and the latest browsers. Therefore, even if you have a previous version of
    the book it may be worth your time to study the new content in this book.


    ## Examples Include:


    +   * How to connect to the database

    * How to display images from a container field

    * Find records

    * Perform compound searches

    * Sort records

    * Insert records

    * Duplicate records

    * Delete records

    * Validate the data before inserting or updating records

    * Working with related records in portals

    * Uploading files to the server

    * Creating list and jump menu

    * Display search results

    * Create a login routine to secure your web pages

    * Running scripts using PHP code

    * Importing records after uploading an Excel file

    * Display record pagination and record navigation links

    * Working with multi-user web pages

    * Display Boolean and multi value check boxes

    * Display multi value list

    * Quick find method

    * Google reCAPTCHA

    * Google API pie, bar, and line chart

    * Google API maps and geoding

    * Display random banner ads

    * Session management

    * Display externally stored images and files

    * Install and configure SSL for HTTPS

    * PHP with AJAX

    * PHP Calendar

    * Working with dates

    * Email integration and attachments

    * Printing PDF reports

    * Printing sub summary reports

    * Validating phone numbers

    * Validating credit cards

    * Simultaneously updating multiple records

    * Submitting multiple page forms

    * Expire down links

    * Display HTML/CSS from database fields


    > For information visit us at: www.formulationspro.com


    > Contact the author Todd Duel at: tduell@formulationspro.com


