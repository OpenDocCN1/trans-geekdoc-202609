  md: "Next, check for any generic errors returned from the $_FILES superglobal.\n\
    \n```\nif($_FILES['xls_file']['error'] > 0)\n{\n    $error = $_FILES['file']['error'];\n\
    \    die ('There is an error with file: ' . $error);\n}\n```\n\nDefine the import\
    \ directory location on the server.\n\n```\n$import_directory = 'Import/';\n```\n\
    \nGet the temporary file name created by $_FILES superglobal for the uploaded\
    \ file.\n\n```\n$temporary_file = $_FILES['xls_file']['tmp_name'];\n```\n\nObtain\
    \ the extension for the file. It is de xls. However, we want to make sure we get\
    \ the absolutely correct extension so there are no import problems when we define\
    \ the exact path and name of the file in the FileMaker script.\n\n```\nfunction\
    \ destiny($filename)\n{\n    $filename = strtolower($filename);\n    $ext = explode(\"\
    .\", $filename);\n    $ext = end($ext);\n    return $ext;\n```\n\nDefine the file\
    \ location on the server. The new file name will be the Record ID value of the\
    \ last record from the database with the .xls extension.\n\n```\n$destination_file\
    \ = $import_directory . $id . \".\";\nfindext($_FILES['xls_file']['name']);\n\
    ```\n\nMove from the temporary location to the final destination on the server\
    \ using the PHP method move_upload_file. If the move was successful you can insert\
    \ a record in the PHP table with the logging path to the uploaded file.\n\n```\n\
    $move = move_uploaded_file($temporary_file, $destination_file);\nif($move)\n \
    \   $url = $destination_file;\n    $insert = $fm->newEditCommand('Import.php',\
    \ $id);\n    $insert->setField('URL', $url);\n    $insert->execute();\n```\n\n\
    Run the PHP Records script in the database to move the uploaded file from the\
    \ root folder to the FileMaker Server folders so the records can be imported into\
    \ the table from the xls file. Pass the Record ID ($id) to the script knows exactly\
    \ which file to import.\n\n```\n$layout = 'Import.php';\n$script = 'PHP Import\
    \ Records';\n$parameter = $id;\n$requestScript = $fm->newPerformScriptCommand($layout,\
    \ $script, $parameter);\n$results = $requestScript->execute();\n```\n\nFinally,\
    \ provide the user with a message telling them that the file was uploaded successfully.\
    \ Make sure to redirect them to the start page so they don't click the Import\
    \ button multiple times. You don't want them to import the records multiple times.\n\
    \n```\n$importMessage = '<p>The file was uploaded to the server successfully.\
    \ You will be re-directed to the start page in 3 seconds.';\n```"
