- pgno: 370
  md: '# Performance Considerations


    All system administrators need to know how to tweak the server operating system,
    the web and/or application server, the database, and their web pages to maximize
    the performance of their web site. FileMaker Server is adept at handling relatively
    large, complex web sites. It really doesn''t do well when you have thousands of
    concurrent connections because it''s not designed for load balancing outside of
    the server-side configurations. However, apparently FileMaker has modified their
    own for internal load balancing, but the database won''t scale even to the most
    developed server. In the past FileMaker could be hosted with a RAC, but that went
    away with FileMaker Server 7. Now we''re stuck with the supplied materials. As
    I mentioned previously, with today''s hardware and the tremendous improvements
    that FileMaker has made to the product line, your biggest performance problem
    is going to come from your bandwidth connection to the Internet and the skill
    in which you program your web pages.


    # Minimize the Number of Fields on PHP Layers


    When you search the database it will return every single field on the specified
    layer. Therefore, if you don''t display the fields on the web page you have wasted
    the performance of the database web to process useless information. If you make
    multiple lists for the same, it''s best to use only what you need instead of overwhelming
    the database to reduce the total number of records in your database. This also
    lets you filter relevant fields, then display the result from a layout with fewer
    fields using theSearchResultMethod. We saw how that works in the Quick Find example.
    In many cases your PHP layout will be accessed by FileMaker Pro clients, so you
    don''t need to do any fancy design work. A simple table will do the trick.


    # Minimize the Number of Records (Related) Displayed on PHP


    The same applies to portal records with related records as the. If you don''t
    need to display the records on the web page, the portal should not be on the layout.
    Related records compound the performance problems. You can have literally hundreds
    or thousands of records in a portal. When you return the parent record to the
    browser it''s going to return thousands of related records at the same time -
    except that if you use the related records, you can limit the number of related
    records that are returned to the web page using the setRelatedFilters Method.
    In option, if you have more than a handful of related records in any web solution
    you need to address your design issues first or it''ll will be a serious problem.


    # Use the setRange Method to Limit the Number of Records Returned to the Browser


    Just because you have a table 100,000 records does not mean that you should return
    100,000 records to the server. The more records you return to the browser the
    slower the server and database will respond. It''s also confusing to the user
    have to scroll through so many records. I recommend that you limit the number
    of records by using the setRange Method to specify the number of records to fetch
    from the database. This will enable the user to see the number of records from
    a pop menu choices with 10, 25, 50, and 100 records per page. You should program
    the number of records to return based on whatever your site uses.


    # Limit the Number of FileMaker Pro Connections to Minimum Number of Users


    Change the setting on FileMaker Server to max connected users. When I''m a client
    to query the server I always find that they set the limit to 1000 users "because
    they can". Because you can doesn''t mean that it''s the correct setting. FileMaker
    Server provides 2 threads for each user. If they aren''t being the performance
    of the database is being wasted. How do you know what is right start? By setting
    the limit to the maximum number of FileMaker Pro licenses that you have. Check
    the server statistics after a few weeks to a month. Then you''ll know the result.
    It would be good to know how many of our clients with 2500+ employees have more
    than 50 users on the server. If your FileMaker is only being used to host the
    database for your web site you are one of the lucky few with a big budget. In
    this case you probably only need to set the number of connections to the number
    of database developers, which is probably 1! However most must share their server
    with other business applications.


    # Limit the Maximum Number of Files to the Exact Number of Databases on the Server


    This issue is similar to the number of concurrent users to the database. Because
    you can just because FileMaker Server to host 125 files does not mean that it
    is the best setting. It simply wastes the performance of the server to have FileMaker
    Server main threads that are not being used. Since you don''t need to restart
    FileMaker when you add a new database to the server you can just as easily changing
    the setting on the file. Realistically, what I do on my servers is to set the
    number of files to one or two more than the total of'
  merge: -1
  img_proc: true
- pgno: 371
  md: 'files on the server. That way I was scratching my head to figure out why the
    file didn''t open after I uploaded it to the server.


    # Disconnect Idle Users.


    FileMaker Server is a client-server product. It means that there is a constant
    connection between the FileMaker Server and the FileMaker Pro clients. If the
    clients are idle for long periods of time it wastes the performance of the server.
    You should set the maximum idle time for FileMaker Pro clients to a setting such
    as one or two hours. I prefer this time range because it gives users enough time
    to go to a meeting or lunch break. Come back and resume the work. If they are
    longer than that they will be disconnected automatically. Otherwise your internal
    security issues will dictate if this needs to be more strict.


    This setting has nothing to do with your web server. The web server is not a persistent
    connection. When a search query is sent by the web server to a database connection
    opened, the records are found by the database and returned to the web server,
    then the connection is closed. That''s why FileMaker Server only allows 200 concurrent
    connections from the web server. The process is literally completed in milliseconds.
    Therefore, 200 concurrent connections can be thousands of concurrent users. If
    you have a lot of users they will wait in the queue until the server is ready
    to handle the request.


    # Assign FileMaker Server as Much RAM as Possible


    In most cases you will assign 64 GB of RAM to FileMaker Server which does not
    mean that this is the best idea. Again, just because you need enough RAM for the
    operating system and your web server to operate efficiently, you do have to determine
    the setting for how frequently you need to flush the cache. Most modern operating
    systems and processes can flush several gigabytes of RAM in 1 minute, which is
    the recommended setting. However, if you have a busy web server or a lot of users
    you can boost the performance of the server by increasing the time interval for
    the flushing process. The longer the interval, the more RAM you will use. By constantly
    changing and clearing the caches with information in RAM, the change will be.
    This is why you will want to set the flush interval lower. If your database doesn''t
    often change you can increase the flush interval and rely on the backup schedules
    to recover from an older copy if the file server crashes. You really don''t need
    to assign more RAM to FileMaker Server than the total size of your databases.
    You''re better off allowing the operating system and web server to utilize the
    extra RAM. Anytime the operating system has to dig into Virtual RAM the performance
    will take a huge hit because Virtual RAM is actually taken from the hard drive,
    which is the slowest component on your server.


    # Turn off the Server Logs


    For absolute performance you can turn off the logging for both the database and
    web server. The logs don''t take up much space. However, it''s just one more for
    the server to do that may not provide you with the most useful information. You
    can keep them on for your testing server so you can troubleshoot the web server,
    database server, and web pages. When you first set up your production server you
    also keep them for a period of time until you determine that the server is stable.
    If you encounter any problems you can always turn them back.


    # Turn off IWP


    If you are not going to use Instant Web Publishing IWP places to retrieve data
    from the database and generate all the images and design from your layouts. The
    more complex you make your layouts the longer the server will take to respond.
    Additionally, if you insert high quality graphics rather than those built in tools
    and colors from the color palette it will add more tax to the server to display
    your graphics.


    IWP shares the count web connections. You can assign up to 100 connections. Again,
    just because you can not make it the best. Typically when you are developing an
    IWP application you will know how many users will use the server via IWP. You
    can start with that number. Then after a few weeks you can check the server statistics
    for the peak number of users. Then change the setting to that number.


    # Choose the Appropriate Server Model


    FileMaker Server can be deployed by the application with three different models
    (4 configurations). The one you choose depends on your budget, performance needs,
    and security issues. The single server model is the cheapest, but has the slowest
    performance because all the applications have to share the same processor. The
    single machine model places the database server, web publishing engine, and web
    server all on one machine. The two machine model separates the web server and
    web publishing engine on one machine and'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'database server on another machine. This optimizes the load on the processors
    and allows maximum connectivity for the web users and the FileMaker Pro clients
    each machine. The limiting factor for performance is the web publishing engine.
    Where you place this component will obviously affect the performance of the machine
    it''s. So the question is, do you affect the performance of your web users or
    your FileMaker Pro as a result? FileMaker suggests placing it on the web server
    or on the machine hosting FileMaker Server as the overall method. That''s probably
    a good recommendation in most cases where the database is to hog RAM, but the
    downside of this configuration is that you have to invest in two servers. Lastly,
    the three machine option places each of the components on their own server. The
    downfall of this approach is that you''re talking about purchasing three servers.
    An inside tip about the three machine model is that not FileMaker has been able
    to prove that this configuration is significantly faster than two machine model.
    The only reason it exists is because some of your larger clients felt it better
    for the overall scale of the architecture. I''m not sure about that.


    So which model is right for you? For location server I would start with the easiest
    and cheapest deployment option, which is the single server model. If you find
    that you need more performance you can always use the installation wizard in the
    Admin Console to change the server to a two machine model. Your testing server
    can absolutely be a single server model on your work station or laptop top at
    the same time you have a FileMaker Pro client installed. I have the single machine
    model on my laptop so I can demonstrate sample web sites and databases running
    with Apache and FileMaker Server for client presentations.'
  merge: -1
  img_proc: true
- pgno: 373
  md: '# Security


    Security is a major concern when you create and host your own web site. Especially
    if you use credit card numbers, social security numbers, HIPAA protected information,
    or allow the upload of files to your server. Not only do you have to protect your
    web pages and data, but you have to protect the web server and database server.
    Fortunately, the physical security of the hardware is easy. All you have to do
    is lock the hardware in the server room and limit access to authorized personnel.
    Make sure you install accounts and passwords for the servers for each administrator.
    Never give your server''s Admin password to an internal developer. If someone
    calls the company you have to delete their account from the server and don''t
    have to worry that your master Admin password has to be changed on all your systems.


    # Connection String


    As mentioned earlier in the book, every web page has to make a connection to the
    database by including dbclass.php This file contains the account name and password
    to connect to the database. You never want this information to fall into the hands
    of a hacker because it will give them access to your database. This file should
    not be stored in the root directory of your web site. Keeping it in the root directory
    runs the risk that someone might be able to download the file and open it. Technically
    the connection is all hidden within PHP code, which means the web server should
    never return it as text to a web browser. However for some reason Apache might
    expose sensitive information. Therefore you should place the connection string
    inside the outside the root directory. On Apache, you should place it in the C:\inetpub\php
    folder.


    # FileMaker Accounts and Privileges


    Your database should have one or more specific Privilege sets and accounts. One
    account should be for guests, access you may want through the Internet. This will
    be extremely limited. For example, you may not want Internet users to add or delete
    records from your database. They are view only users. Another account should be
    for business purpose internal users that gives them more access to add and delete
    records and upload files. In elastic, the PHP Privilege Set is only used for web
    access to access the database. These accounts should have the bare minimum access.
    When normally do I create the PHP privilege sets to start with absolutely no access
    to anything — "All no access" for Records, Layouts, Value Lists, Scripts, Others,
    and Extended Privileges (only access via PHP). Then I go through each item one
    by one and until only the items that are needed. That way any hacker is able to
    get the account name and password can only perform tasks that the PHP Privilege
    Set is designed to do.


    # Sanitizing Incoming Data


    If you allow users to add, update, or upload files to your database and web server
    you will need to sanitize or filter the data with PHP code. It is not to trust
    your internal users. The problem is that they may insert data entry errors, such
    as a bad date format that will cause the database to throw an error. Hackers on
    the internet how ever try to insert PHP code, SQL code, links to other web sites
    with HTML code, insert thousands of garbage records, etc that can damage your
    web server, database, and even havoc on your site. The worst case scenario comes
    from uploading viruses to your web site. Even trusted users can unknowingly upload
    infected files. It''s best to limit what type of files are uploaded and scan them
    out of them folder.


    # FileMaker Server Administrator Groups


    FileMaker Server 12 has a feature that allows you to enable server access to "power
    users" so they can administer their own databases. This really offloads a lot
    of work from the administrator(s) to the group level. You can limit this group
    to their own specific folder of databases so they do not get on other systems
    on the server. The Privilege Sets can also limit the group to perform actions
    on the database, view statistics, and run schedules.'
  merge: -1
  img_proc: true
