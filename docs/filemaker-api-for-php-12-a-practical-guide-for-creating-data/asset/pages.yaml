    box with more than one value. Unfortunately, FileMaker uses its own method for
    check boxes and PHP knows nothing about the formatting to display a check box
    from FileMaker. A FileMaker list is a text field with carriage returns between
    each value. Only the formatting changes depending on the type of check box, radio
    button, down list, etc. Therefore, to display and insert a multi value check box
    takes a bit of extra work using PHP.


