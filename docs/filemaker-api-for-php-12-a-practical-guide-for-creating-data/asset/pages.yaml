    \  <th>Amount</th>\n</tr>';\n```\n\nNow we can loop through the data in the $records\
    \ variable by using the PHP method. This is where we'll need to think logically\
    \ about how display the Subtotal and Grand Total values, as these values don't\
    \ exist in the Body of the FileMaker layer.\n\n```\nforeach ($records as $record)\n\
    ```\n\nThe Subtotal row comes first in the code. However, it appears to be out\
    \ of order from a logical perspective. It will make much more sense once you find\
