    code. This will give you a clear idea of what we have attached. The headers are
    built, so we can include the message section of each email. Each message (and
    attachments) must be separated by a boundary with a unique string. We can create
    the boundary using a md5 hash of the current message. The message section of the
    file will be sent as text and encoded in 7-bit format. You must have two lines
    of feeds before the actual attachment or the email will not display correctly.


    ```

    $boundary = "++Multipart_Boundary_" . md5(time(""));";

    $headers = "Content-Type: multipart/mixed; boundary=$boundary";

    $boundary = "--$boundary\n";

    $message = "This is a multi-message email in MIME format.\n--$boundary\n\nContent-Type:
    text/plain; charset=ISO-8859-1\n\nContent-Transfer-Encoding: 7bit\n\nMessage:
    \\n--$boundary--";

    ```


    Before you include the attachments you check the total size of your server settings.
