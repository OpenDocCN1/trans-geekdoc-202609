    \ that you display images using container fields. You are much better off storing\
    \ the images on the server and using a text field with a path to the image. The\
    \ ContainerBridge.php works. However, you will take a big performance hit. The\
    \ FileMaker API for PHP is nice that it will work with container images. The XDBC\
    \ drivers for ASP and JSP do not work with FileMaker's proprietary container field.\n\
    \nDifficulty: Easy\n\n**Sample Files:** PHPFiles/Core/Lesson12/ContainerBridge.php\n\
    \n**Page Navigation:** Include file only.\n\nFileMaker API Methods: N/A\n\nCode:\n\
    \nSince this is already a stand-alone file, rather than going through each line\
    \ of code I'll describe its intended use. In PHP code you want to display an image\
    \ from a container you will use the following example code:\n\n```\n<img src=\"\
    ContainerBridge.php?path=' . urlencode($_GET['record']) . ' />\n```\n\nThe point\
    \ of this is to do two things. First, define the image source. You can see that\
    \ the code is passing the image source to ContainerBridge.php with the variable\
    \ \"path\" as an urlencoded container field in the database named \"Image\". If\
    \ you follow the value passed to the ContainerBridge.php file you will see that\
