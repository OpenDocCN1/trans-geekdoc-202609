  md: "This is achieved by taking the current time() value and subtracting the _SESSION['timeout']\
    \ value This will return the number of minutes the user has been inactive. If\
    \ the user has been inactive longer than the inactive limit we will destroy all\
    \ the session information and redirect the user to the login page.\n\n```\nif(isset($_SESSION['timeout']))\n\
    {\n  $session_life = time() - $_SESSION['timeout'];\n  if($session_life > $inactive)\
    \ {\n    $session_destroy();\n    header(\"Location:login.php\");\n  }\n}\n```\n\
    \n# time(0): Returns the current time in seconds from Jan 1. 1970.\n\n```\nphp\n\
    http://www3.php.net/manual/en/function.php\n```\n\nThe last line of code is set\
    \ to use the _SESSION['timeout'] value with the current time. Why does it come\
    \ last? Because every time the user accesses or refreshes the page within the\
    \ time limit you want to reset the timeout so they will have 10 minutes on their\
    \ clock. If you are really picky any you want to boot the browser entirely from\
    \ the page you are on the login page. Just still within their time limit. Also\
    \ include meta refresh code to force the page at a certain interval and redirect\
    \ the user to the login page. Just make sure that the refresh is set to run the\
    \ timeout value after the page isn't trying to refresh while the user is still\
    \ within their time limit. Otherwise, they will never get kicked out for inactivity\
    \ because the time will be constantly reset before the 10-minute limit. Lastly,\
    \ if you want to use the same inactive value for the refresh it will actually\
    \ grant the amount of time to the user before the page is forced to refresh. Therefore,\
    \ I recommend you use 1 second longer than the inactive time. If you want to use\
    \ the optional meta refresh code in the sample file you will have to do uncomment\
    \ the code as the comments.\n\n```\n$_SESSION['timeout'] = time();\n?\n```\n\n\
