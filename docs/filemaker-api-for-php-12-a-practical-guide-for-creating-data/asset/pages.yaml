  md: 'dramatically impact the performance of your web application. Therefore, the
    only way to improve performance is to create PHP workflow layouts that have only
    the fields and portals you need to display on your web pages. Of course, more
    layouts also mean more system management and more documentation. The good news
    is that FileMaker clients won''t access your PHP layouts. Therefore, you probably
    don''t need to create an extensive user interface. Just the fields and portals
