  md: "```\necho $importMessage;\n?>\n```\n\nCreate the form to import the file to\
    \ the server. Click Import to run the script to import the records.\n\n```\n<p>\n\
    \  <form action=\"ImportXLS.php\" method=\"post\" enctype=\"multipart/form-data\"\
    >\n  upload xls file for import: <input name=\"xls_file\" type=\"file\" />\n \
    \ <input type=\"submit\" name=\"import\" value=\"Import\" input />\n</form>\n\
    </p>\n```\n\nCheck if the user clicked the Import button. Validate the file they\
    \ are trying to upload is an Excel file using application/vnd.ms-excel.\n\n> You\
    \ NEVER allow unknown users to import records to your database. This process generally\
    \ be reserved for internal employees or trusted business partners.\n\n```\nif\
    \ (isset($_POST['import']) == 'Import') {\n  if ($_FILES['xls_file']['type'] ==\
    \ 'application/vnd.ms-excel') {\n```\n\nAdd a new record to the Import php table.\
    \ For this example, I'm using a separate table to track all the files that are\
    \ used to import records in the database. You can think of it as a log file. That\
    \ way you can troubleshoot any files that failed to import the file.\n\n```\n\
    $request = $fm->newAddCommand('Import php');\n$request->execute();\n```\n\nTrap\
    \ for errors, if the import was successful you can get the Record ID from the\
    \ very last record, which will be by the FileMaker script. Of course, if the validation\
    \ failed to the file not being Excel, you should supply the user with an error\
    \ message and stop the script.\n\n```\nif (FileMaker::isError($result)) {\n  $message\
    \ = \"<p> . $result->getMessage() . \"</p>\";\n  exit;\n} else {\n  $request =\
    \ $fm->newfindAllCommand('Import php');\n  $result = $request->execute();\n  $record\
    \ = $result->getLastRecord();\n  $id = $record->getObjectID();\n} else {\n  $type\
    \ = $_FILES['xls_file']['type'];\n  die ('Only xls files are allowed to be uploaded:\
    \ ' . $type);\n}\n```\n\n```\nphp FileMaker Syntax: getLastRecord()\n$record =\
    \ $result->getLastRecord();\n```"
