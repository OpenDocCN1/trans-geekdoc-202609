- pgno: 12
  md: "# Part I — Getting Ready for Web Publishing\n\nCreating web pages requires\
    \ you to have at least a basic working knowledge of HTML. If you are already familiar\
    \ with HTML you can skip Part I. Otherwise, I'll cover the basic HTML elements\
    \ that will be included in all the lessons. That way you wont encounter any surprises\
    \ and will be able to refer back to this if you get stuck for any reason.\n\n\
    One of the things you'll notice right away in the lessons is the simplicity of\
    \ the code. There are no graphics or design, very little page structure, and the\
    \ only use of HTML is to display the data from the database. This is for a reason.\
    \ I don't want you to get stuck trying to weed through a complex page with images,\
    \ CSS, and other elements. Once you learn the PHP code, the layout and design\
    \ is easy. For now, the only thing you need to know is how to display a PHP document.\
    \ The file needs to have the extension .php. That tells your web server to process\
    \ the PHP code on the page.\n\n# Create a Table\n\nData has to be placed into\
    \ a table so it can be displayed and organized in a logical fashion. Without tables\
    \ all your data will run together and end up as a mess. Take a look at the sample\
    \ code below and how it will display in a browser in Figure 1. You'll see that\
    \ the code creates a basic table with 2 columns and 2 rows. As in all HTML and\
    \ PHP documents you will have to start the document with the tags: <html><head><title><body>.\
    \ The <html> tags your web server to process anything in the document and present\
    \ it as HTML to the browser. In this case I named the page \"Sample Table\". Then\
    \ I closed the head section by using the tag </head>. All tags are closed by using\
    \ the forward slash / with the tag name. Don't forget to close the tags in the\
    \ same order in which they are created or you will get\nget some strange results.\n\
    \n```\n<html>\n<head>\n<title>Sample Table</title>\n</head>\n<body>\n<table border=\"\
    1\">\n  <tr>\n    <th>First Name</th>\n    <th>Last Name</th>\n  </tr>\n  <tr>\n\
    \    <td>Todd</td>\n    <td>Duell</td>\n  </tr>\n</table>\n</body>\n</html>\n\
    ```\n\n![](img/5a2c5fda68d42e5d65f51850276e49ec_12_0.png)\n\nFigure-1: Sample\
    \ Table\n\nNext is the <body> tag. This is where all the content for the web page\
    \ is displayed. It will be your job to create the PHP code to output the correct\
    \ html structure. For a simple table, which is used 99% of the time, you will\
    \ start with the <table> tag. Notice I included the attribute border=\"1\" because\
    \ this is because I wanted to draw a border"
  merge: -1
  img_proc: true
- pgno: 13
  md: 'with a line thickness of 1 pixel. There are a number of attributes that you
    can utilize for the cells, including padding and cell spacing.


    Most of the time you''ll want to create a header row using the first row with
    the `<tr>` tag. Then displayed the First Name and Last Name headers using the
    table header `<th>` tags. The `<th>` will display your headers with emphasis (i.e.
    bold) without actually having to use the `<em>` tag. Don''t forget to close the
    first row with the `</tr>` tag. Then move on to the content using the same process
    as above. Except this content, you will use the table `<td>` tag to display the
    data (i.e record data from the database) as plain text. Once you have created
    the document that you can use the tag as well as for the table, body, and html
    tag.


    The lesson here is not how to create a table, rows table header, table data, etc.
    The lesson is to observe the repetitive nature of designing HTML data. To put
    it in perspective; each record in the database will be wrapped in a `<tr>` tag.
    Each field will be wrapped in a `<td>` tag. While you are looping through records
    and fields your PHP code will simply start and stop tags to the data from the
    database. This will enable a browser to display the content.


    # Create a Form


    Forms will quickly become best friend when working with data from a database.
    You will use forms to search for records and submit data to create, update, and
    delete records. Inside the form you will be able to pass various pieces of information
    to the web server and database. The data can be either entered, as in the Search
    field 2, or can be hidden that you don''t want the user to be able to see.


    All forms use the `<form>` tag. The action attribute points to the document you
    want to process the form. It can either be an absolute path such as `http://www.mysite.com/Form.php`
    or it can be a relative path to another document in another format such as `../Different.php`.
    Sometimes the form will point to itself and sometimes it will point to a different
    file. It depends on how you want to set up your form for the user workflow. There
    are distinct advantages to both methods. Pointing the action to the same document
    means that you''ll only have one document to manage. However, the code on one
    document may be quite long to handle a variety of branching operations, discrete,
    logical fashion — similar to a second document will allow you to process the form
    in a more organized way. The downfall is that you''ll have your site to manage.


    ```

    <form action="Form.php" method="get">

    <input name="id" type="hidden" value="<?php echo $_GET[''id'']; ?>">

    <p>

    <input name="Search" type="submit" value="Submit">\p>

    </form>

    ```


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_13_0.png)


    Figure 1-2: Sample Form


    The method attribute is of critical importance. There are two methods that you
    can use to pass information between web pages — GET and POST. GET will send all
    the data from the form in the URL. The URL is visible to the users. The advantage
    of sending the data in the URL is that users will be able to bookmark your page.
    The disadvantage is that the users may be able to see information you don''t want
    them to be able to see. Additionally, there is a limit to how much data you can
    send in the URL. You can only send 2048 characters.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'may seem like a lot, but when you are creating and modifying requests, 2048
    characters can get used very quickly. The GET method is most useful for searches.


    The other method is POST. POST is sent in the header of the URL. That can hide
    from the user and send much larger amounts of data. Because the user can''t see
    the data doesn''t mean it''s secure. For real security, you still need to use
    an encrypted page (i.e. https). POST is useful for creating, updating, and deleting
    records.


    Both GET and POST data will be sent using Name=Value pairs. That means you''ll
    define the name of the value, such as the field name. Then type something like
    a text field for the user to enter data. For example, if you type T in Todd the
    Name=Value pair will be Search=Todd. To extend the logic of Name=Value pairs,
    the actual URL from the form will look like this:


    ```

    http://localhost/TodduePHP/Form.php?id=123&search=Todd&Search=Submit

    ```


    It starts with the name and word of of the file from the form attribute: http://localhost/TodduePHP/Form.php.
    Then it adds to all the Name=Value pairs defined in the form. In the example there
    are three Name=Value pairs. The first one is the value for the Record ID (id)
    and the value obtained from the exiting URL name of ''id''=123. The next is Search,
    the value you typed into the Search text box. Then the button that is pressed
    by the user is also set. In this case the Name=Value pair for the button is Search=Submit.
    In the example it is important to name your buttons in order to determine exactly
    which button was pressed. Especially when you have more than one button on your
    form:


    Now let''s back up for a moment and take a look at what you can put inside your
    form. In this example you''ve placed the hidden element of "id" in the specified
    type="hidden". Hidden values allow you to pass information to the web server and
    database without the user actually seeing any data on the browser screen. It is
    very useful for searches as Record ID''s. In the example I''m passing some PHP
    code that retrieves the URL from ''id'' with $_GET superglobal.


    ```

    <input name="id" type="hidden" value="<?php echo $_GET[''id'']; ?>">

    ```


    The other item I''m passing in the URL is the Search text from form field. I''ve
    given the name ''Search'' and defined it as a text field that the user can enter.
    There are also other enterable fields for text area, check radio button, list/menu,
    etc. that will be demonstrated in the example files later in the book. For now,
    it''s only important to know that the data in the form will be sent to the web
    server as Name=Value pair.


    ```

    Search: <input name="Search" type="text">

    ```


    Finally, you have to create a button to submit the form to the web server. The
    name in the Search and the value is defined as Submit. These values are also passed
    to the web server. It is very to create a FileMaker Pro script block where you
    have 3 buttons to choose from. When the user clicks a button the button they pressed
    by using the function Get(LastMessageChoice). In the case of a form, you''ll be
    checking for Search==Submit, which is probably a lot more intuitive than checking
    for Get(LastMessageChoice)=1, 2, or 3. I always have to look at the Show Message
    dialog box to figure out which button is for which response, especially when the
    default button is something other "OK".


    ```

    <input name="Search" type="submit" value="Submit">

    ```


    # Create a Link


    Links allow users to navigate from one page to another, within the same page,
    or pass information to the web server to perform processes as search for records.
    You probably recognize a link from ''Click Here'' on a page. Rather than displaying
    absolute or relative link to the location web page shows a text or image-based
    link. Links with databases are useful for a variety of items. In the example files
    we will be creating links to navigate detail pages based on Record ID and links
    to change the order of the records by the URL.


    All links start with the anchor tag <a href=""> where the value between the quotes
    for href is a relative or absolute path to a document. href stands for hypertext
    reference. Basically, it''s saying what the path to the document you'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'want to link to? Next, whatever text you want to display on the web browser
    (i.e. Click Here). Then close the anchor tag <a>. That''s it. Links are really
    easy.


    ```

    <a href="SearchResultsSimple.php?FirstName=Todd">Click Here</a>

    ```


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_15_0.png)


    Figure 1-3: Link


    # Meta Refresh and Redirect


    Meta refresh is also known as a redirect. It''s used to refresh or reload the
    current page or redirect the user to a different page after a defined amount of
    time. This is usually installed on a web site if pages have moved or your PHP
    code has changed and you have to have the user redirected to the starting page
    in the workflow.


    To refresh your page every 3 seconds you can use the following code. You probably
    don''t want to refresh your page very frequently because it makes a new call to
    the web server each time. I think you can imagine the load it put on the server
    if hundreds or thousands of users were refreshing their page every few seconds.
    That''s where AJAX (Asynchronous JavaScript) is probably much more useful because
    it can refresh certain sections of your page. An AJAX example will be covered
    later in the book.


    ```

    <meta http-equiv="refresh" content="3" />

    ```


    If you want to redirect happen at a certain time interval and send the user to
    a specific URL you can use the following code. The URL, of course is either a
    relative or absolute path.


    ```

    <meta http-equiv="refresh" content="3;URL=SearchResults.php" />

    ```


    If you want to redirect the user you only need to provide the following code without
    any tags on the page (i.e. html, head, body, etc.). Substitute the page (location)
    you want to go to.


    ```

    ? PHP

    header("Location:FindAllRecords.php");

    ```


    # Designing a Web Application


    Designing a web application is anything you''ve probably had to do when compared
    to developing a FileMaker Pro is the hook. As FileMaker makes most of the processes
    so seamless that you really don''t need to know what goes under the hood. As a
    FileMaker developer you''ve become accustomed to making one layout that does absolutely
    everything — search, create new records, modify records, delete records, etc.
    Well let''s say that a web application isn''t as quick as FileMaker. As a stateless
    process, there is no connection to the database server, you have to tell (program)
    the pages absolutely everything they need to know. That means you have to create
    all the necessary web pages for every single workflow. In many cases the workflows
    really can''t be reused. For example, to accommodate one FileMaker layout and
    all the things that it can do, you''ll have to make less than four web pages!
    If you portals on your layout, you''ll need to double that number. The good news
    is that there are standard methods and nomenclature to describe the workflow.
    Once you grasp the workflow and the nomenclature you can communicate and create
    any process for your users very quickly'
  merge: -1
  img_proc: true
