    Localhost vs. Your Production Server


    In a professional development environment you typically have a testing server
    and a production server. The testing server is frequently the same computer as
    your workstation. This book will assume that you are developing on your workstation
    that is exactly the same as the production server. When the files are ready to
    be served to the Internet, you will transfer (i.e. put) to the production server.
    The notable difference between the two environments comes in the connection file
    (dbaccess.php) and the URL that you use to access the web pages. This book assumes
    that you are going to have a single server setup. That means that Apache or IIS,
    PHP, and FileMaker are all on the same computer. This allows your connection file
    to use the hostspec of ''http://127.0.0.1''. 127.0.0.1 (i.e. localhost) means
    connect to the same computer that I''m'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'currently. The reason why this is convenient when you put your files from the
    testing to the production server you don''t have to make any changes to the database
    connection file. That''s because the environment is exactly the same and using
    ''127.0.0.1'' instead of a domain or IP address will still work correctly. There
    is one notable issue to be aware of: DO NOT use ''localhost'' as Windows has trouble
    resolving localhost will cause major performance and crashing issues. If you use
    a two-server setup with Apache or IIS and PHP on one machine, then using ''localhost''
    won''t work in your production environment. In this case you would have to change
    the hostspec connection in the dbaccess file on your server to your IP or domain
    name. The trick is to remember it and not to overwrite the production connection
    file with your development file. If the connection to the database won''t work.
    It won''t break anything or corrupt data, but your users won''t be able to access
    any web pages that they need from the database until you fix it.


    When testing your page on your testing server you will use the URL. Note that
    I placed the example files in the folder ''PHPFiles/Core/Lesson#''. This is simply
    to keep your testing server organized for different projects.


    ```

    127.0.0.1/PHPFiles/Core/Lesson/FindAllRecords.php

    ```


    When you access files on the production server use the URL:


    ```

    http://www.mydomain.com/PHPFiles/Core/Lesson/1/FindAllRecords.php

    ```


