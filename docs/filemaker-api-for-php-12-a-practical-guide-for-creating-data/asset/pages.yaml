    \ loop. Then it checks subsequent loop for the last $salesperson. If the $salesperson\
    \ doesn't match the SalesPerson in the loop you can assume you're about to start\
    \ a new subsummary section. Then you can add the Subtotal table row. This is a\
    \ very similar technique that I utilize all the time with lists of FileMaker records\
    \ where I compare the current record against the previous record to perform some\
    \ task when the records change values.\n\n```\nif(!empty($salesperson) and $salesperson\
    \ != $record->getField('SalesPerson'))\n{}\n```"
