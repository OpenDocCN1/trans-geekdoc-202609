  md: "If the file type matches what we're allowing for an uploaded file there's nothing\
    \ to do. Otherwise you should stopnthe script and alert the user that they are\
    \ trying to upload an unapproved file.\n\n```\n{\n  # true - do nothing\n} else\
    \ {\n  $type = $_FILES['new_image']['type'];\n  die ('Only gif, jpg, jpeg, and\
    \ png files are allowed to be uploaded: ' . $type);\n}\n```\n\nNext, we will validate\
    \ the file size by checking to see if it is more than 20 KB. I normally recommend\
    \ limiting the file size so we can prevent numerous errors. The $_FILES superglobal\
    \ measures file size in Bytes, which is approximately 1 MB = 1,000 KB. If you\
    \ want to be 1 KB = 1024 Bytes.\n\n```\nif($_FILES['new_image']['size'] > 20000)\
    \ {\n  $size = round($_FILES['new_image']['size']/20480,1);\n  die ('The file\
    \ cannot be larger than 20 KB: ' . $size . ' KB');\n}\n```\n\nBefore the file\
    \ is uploaded we can do one last check to see if there were any errors during\
    \ the upload. If there was an error we'll stop the script and alert the user.\n\
    \n```\nif($_FILES['new_image']['error'] > 0 {\n  $error = $_FILES['file']['error'];\n\
    \  die ('There is an error with your file: ' . $error);\n}\n```\n\nNow we can\
    \ set the variables for the image directory and get the name of the temporary\
    \ file on the server. The image directory is where we want the upload folder,\
    \ which is relative to the web page. The $_FILES superglobal will retrieve the\
    \ file from the temporary folder on the server. This is the only way to get the\
    \ name of the file because PHP will rename the temporary file to a unique, random\
    \ string such as php4H6d3M. Once the script ends the temporary file will be deleted\
    \ from the server.\n\n```\n$image_directory = 'Images';\n$temporary_file = $_FILES['new_image']['tmp_name'];\n\
    ```\n\nNext\n\n```\nfunction findext($filename) {\n  $filename = strtolower($filename);\n\
    \  $ext = explode(\".\", $filename);\n  $ext = end($ext);\n  return $ext;\n}\n\
    ```"
