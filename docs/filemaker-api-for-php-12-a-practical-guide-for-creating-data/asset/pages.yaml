  md: "Find all the records using the Subsummary Report layout. Since this is a basic\
    \ example, I didn't want to complicate the process with a form to find records.\
    \ The point isn't how to find records, the point is how to generate a subsummary\
    \ report.\n\n```\n<php\n$request = $fm->findAllCommand('Subsummary Report');\n\
    ```\n\nBefore we find the request we'll need to sort the records. The problem\
    \ is that the API doesn't provide us with a method to reorder the results based\
    \ on a summary field. That means we'll have to create the Subsummary Report script\
    \ in the database that will sort the records on the layout to display the report\
    \ as intended. Then we'll run the script using the setScript method. This method\
    \ will run the script after the find request is performed and FileMaker Server\
    \ sorts the records in default creation order. Then we can execute the request.\n\
    \n```\n$request->setScript('Subsummary Report');\n$result = $request->execute();\n\
    ```\n\nFileMaker Syntax: setScript($ScriptName, ScriptParameter)\n\n![](img/5a2c5fda68d42e5d65f51850276e49ec_349_0.png)\n\
    \nNext, for any errors returned by FileMaker Server.\n\n```\nif (FileMaker::getError($result))\n\
    {\n  echo \"<p>Error: \" . $result->getMessage() . \"</p>\";\nexit;\n}\n```\n\n\
    Store the contents of the records returned by FileMaker Server in the $records\
