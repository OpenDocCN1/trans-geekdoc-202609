  md: '# Lesson 28: Google reCAPTCHA


    Objective: In this lesson you will learn how to implement Google''s reCAPTCHA
    method to limit spammers and bots from submitting bogus records to your database.
    CAPTCHA is a program that can tell whether the user is a human or a computer.
    CAPTCHA technology has become very prevalent because no computer program can read
    distorted text as well as humans, so bots cannot navigate sites by CAPTCHA technology.
    However, I like the one from Google because it is constantly being updated and
    you do not have to do anything on your end to take advantage of the updates. The
    part that I like the best is that it is capable of detecting IP addresses that
    are solving too many CAPTCHA''s and will cut them off. Finally, if you are really
    interested, Google also has a library for Mailchimp, which will hide your email
    addresses that the user has to solve to acquire the email address. For more information
    about acquiring a free, fully CAPTCHA account you can go to Google''s web site
    at:


    http://www.google.com/recaptcha


    Difficulty: Easy


    Sample Files:

    PHPFiles/Advanced/Lesson28/captcha.php

    PHPFiles/Advanced/Lesson28/verify.php

    PHPFiles/Advanced/Lesson28/recapchalib.php


    Page Navigation:


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_243_0.png)


    FileMaker API Methods:


    There are no FileMaker API methods for this example.


    Code:


    The point of implementing the reCAPTCHA method from FileMaker methods is. This
    example is a simple form that sends information from the captcha page to the verify
    page before submitting it to the database. The reCAPTCHA method forces the user
    to verify the distorted text on the captcha page before the information can be
    passed to the verify page. The recaptib.php page supplied by Google has all the
    code to connect to Google where the processing is performed. There is no extra
    performance hit to your server and Google can keep you up to date with the latest
    security changes. You all have to do is some simple code


    captcha.php


    Create the form to submit contact information to the database. Point it to the
    verify php page.


    ```

    <html>

    <head>

    <title>reCAPTCHA</title>

    <body>

    <form action="verify.php" method="post">

    Name:<br>

    <input name="Name" type="text" size="30">

    <p>

    Email:<br>

    <input name="Email" type="text" size="30">

    <p>

    Message:<br>

    <textarea name="Message" cols="5" rows="5"></textarea>

    ```'
  merge: -1
  img_proc: true
