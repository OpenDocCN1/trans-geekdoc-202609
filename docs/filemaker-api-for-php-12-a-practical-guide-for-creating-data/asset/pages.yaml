    # Manage Security for "php_demo"


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_77_0.png)


    Figure 6-13: Accounts.


    # Security


    Security is extremely important when it comes to web users having access to your
    data. I cannot stress enough that you should NOT give any PHP enabled account
    access to the database that they should not have. You should specify custom privileges
    for records, layouts, value lists, and scripts. You should only allow access via
    PHP Web Publishing. You should not allow printing, managing extended privilege
    sets, overriding data validation, or allowing us to change the password. Menu
    commands should be set to minimum, if not completely removed with custom menus.
    The only privilege the PHP users should have access to is exporting records so
    the data can be displayed on the web. Other that be cautious about what privileges
    you give to the PHP users as they certainly do what you give to them. This means
    you may have one account for external customers who is locked down except records
    and a second for internal users that have more access based on their level of
    training.


    Choose privileges and save them as a "Privilege Set", which can be used by one
    or more accounts. If you edit a set, all accounts that use it will be affected.


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_77_1.png)


    Figure 6-14: Security.'
