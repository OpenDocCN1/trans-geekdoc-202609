  md: '# Lesson 36: Display HTML/CSS Using PHP


    **Objective:** In this lesson you will learn how to display HTML/CSS stored in
    a field. For those of you publishing data to the web using PHP you''ll eventually
    run across the need to display HTML or CSS content stored a field. For example,
    maybe you have a shopping cart with all the card stored in your product table,
    as our product Pay eCommerce Pro, or maybe you want to allow your users to type
    in stylized text and have it display on the web correctly without the users needing
    to know anything about HTML or CSS tags.


    **Difficulty:** Easy


    **Sample Files:**

    PHPFiles/Advanced/Lesson36/DisplayHTMLCSSUsingPHP.php

    PHPFiles/Advanced/Lesson36/DisplayHTMLCSSUsingPHP.fmp12


    > This lesson uses a separate database file to demonstrate the lesson. Please
    upload theHTMLCSSUsingPHP.fmp12 database file to your server.


    **Page Navigation:**


    +   - List


    **FileMaker API Methods:**

    newFindAllCommand()

    execute()

    getFirstRecord()

    getField()


    **Code:**


    ```

    Start by connecting to the database.


    ```html

    <body>

    <?php

    require_once (''FileMaker.php'');

    $fm = new FileMaker();

    $fm->setProperty(''database'', ''DisplayHTMLCSSUsingPHP'');

    $fm->setProperty(''hostspec'', ''http://127.0.0.1/'');

    $fm->setProperty(''username'', ''Admin'');

    $fm->setProperty(''password'', ''1234'');

    ?>

    </body>

    n```

    ```


    Scroll down to the bottom of the code where it starts with the following code:


    ```

    echo ''<td>'' . html_entity_decode($getField(''Text'')) . ''</td>'';

    ```


    | html_entity_decode(string): Convert all HTML entities to their applicable characters.
    | http://us.php.net/manual/function.html-entity-decode |


    What you notice is the use of the PHP function html_entity_decode(). What this
    function is to convert all the HTML entities to their applicable characters and
    display the HTML and CSS from the Text field as expected. If you were to omit
    this function using the normal FileMaker API for PHP code you would get the contents
    of the field'
