    ```\n\n```\n<?php\nrequire_once(\"../dbaccess.php\");\nif (isset($_GET['path']))\n\
    {\n  $url = $_GET['path'];\n  $url = substr($url, 0, strpos($url, \"?\"));\n\n\
    ```\n\n*"
