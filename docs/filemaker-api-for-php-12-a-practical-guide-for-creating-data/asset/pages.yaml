- pgno: 80
  md: '# Part II — Publishing FileMaker Data


    This is the part of the book you''ve been waiting for or some of the part you''ve
    been dreading. This section will dig into the FileMaker API for PHP and show you
    examples for all the available methods to create production quality, commercial
    web pages with the data from your FileMaker database. We''ll start out with the
    core examples, which demonstrate required techniques that you''ll need for every
    single web page. Then we''ll continue with the basics of display, search, create,
    delete, and edit records. Here we''ll tackle more complex topics such as portals
    and container fields. Finally, we''ll work on details that every site needs such
    as log in security, navigation, running scripts, using value lists, and validation.
    We''ll move on to the Advanced section that demonstrates everything else we learned.
    Once you''ve mastered these techniques you''ll have learned 95% of everything
    you need to use the FileMaker API for PHP. At that point you should be comfortable
    looking up anything else that you might need, which is what I also have to do
    as a professional developer.


    What is the best way to learn these methods? I suggest that you take your time
    and try to absorb only one or two examples per day. Each example will explain
    the objective, the difficulty level, provide page navigation appropriate, explain
    each line of code, and provide screenshots of the expected results on a web browser.
    The sample files included with this book are complete and functional. The absolute
    best way for you to learn the methods and PHP code is to type it out in your own
    text editor or using Dreamweaver. Rest assured, you will make mistakes and know
    that this is part of the learning process. The more you practice, the better you
    will get. One thing to keep in mind is that all the code is fully commented, so
    you will never get lost. In a production version you can remove most, if not all
    of the comments. Leave just enough comments in your files so you can back-track
    your train of thought. Comments in the PHP code will not appear on the web pages
    as they are stripped by the web server. However, this still doesn''t mean that
    you should store sensitive information such as account names, passwords, etc.
    in the comments because it still represents a possible security issue if someone
    was able to download your web pages.


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_80_0.png)'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# dbaccess Include PHP File


    **Objective:** Create the include file that is used for every PHP web page to
    connect to the FileMaker database. I recommend that you use the sample file as
    is and simply modify the connection information to match your own solution.


    **Difficulty:** Easy


    **Sample Files:** PHPFiles/Conn/dbaccess.php


    **Page Navigation:** Include file only.


    **FileMaker API Methods:

    FileMaker()

    setProperty()


    **Code:**

    All PHP code starts with <?php and ends with ?>. Start by using the PHP method
    require_once to load the FileMaker.php API for the API. This allows you to access
    all the methods in the API.


    ```

    <?php

    require_once (''FileMaker.php'');

    ```


    $fm = new FileMaker();

    Create the $fm object Take note of the variable name fm. This object will be called
    in every sample file to retrieve data from the database.


    The next section is your "connection string" to the database. Database is the
    exact name of the database. You do not need to include the fmp2 extension. Hostspec
    is the IP address (ex. http://192.168.1.100 or http://127.0.0.1) or domain name
    (ex. http://formulationspro.com) where the database is being served. If you have
    a single server solution http://127.0.0.1 will work perfectly. Technically, FileMaker
    assumes the hostspec of 127.0.0.1 if the property is not declared. I am assuming
    you are using a single server in this book. If you have a two server solution
    you will need to use the address of the server hosting the database. Username
    is the account name in the database — remember that the account needs to be assigned
    to a Privilege Set that is PHP enabled. Password is the password for the account.
    For the sample files and php_demo.fmp12 sample database the account is "Admin"
    and the Password is "1234".


    ```

    $fm->setProperty(''database'', ''php_demo'');

    $fm->setProperty(''hostspec'', ''http://localhost'');

    $fm->setProperty(''username'', ''Admin'');

    $fm->setProperty(''password'', ''1234'');

    ?

    ```


    > Do not use http://localhost on Windows. Windows is unable to resolve localhost
    to 127.0.0.1 and may cause poor performance and/or crashing problems. Instead,
    always use //127.0.0.1.'
