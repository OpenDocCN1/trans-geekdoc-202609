  md: '# Lesson 15: Create a Log in Procedure


    **Objective:** In this lesson you will learn how to perform a login procedure
    to protect your web pages from unauthorized access. The basic premise is to start
    at the Login.php page. If the login is successful and you are able to find a matching
    record in the database the user is redirected to the protected LoginSuccess.php
    page. If the user tries to open a protected web page without logging in first
    they will be redirected back to the Login.php page. Finally, although not required,
    it''s also nice to have a Logout.php page to end the user''s session.


    **Difficulty:** Difficult


    **Sample Files:**

    Login.php

    LoginSuccess.php

    Logout.php


    Page Navigation:


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_167_0.png)


    **FileMaker API Methods:**

    newFindCommand(

    addFindCriterion())

    execute(

    newFindAllCommand(

    getFoundSetCount()


    Code:


    Login.php


    Protected web pages require the use of sessions. PHP is really nice in that it
    handles the session for you with virtually no effort. The only special rule that
    you have to follow is code BEFORE the HTML tag, I prefer to place it as the very
    first code on the page. To start a session you only need to use the PHP method
    session_start(); I''m also going to declare the $_SESSION superglobal named "login"
    so I can track the login status on every protected page. To keep it simple, if
    login = 0 the user is not logged in. If login = 1, the user is logged in. Notice
    the login page that I am starting by declaring that user is NOT logged in. That
    way if they were on a page where they were logged they would be automatically
    logged out to protect your site by default.


    ```

    <?php

    session_start();

    $_SESSION[''login''] =0;

    ?>


    <html>

    <head>

    <title>Login</title>

    </head>

    <body>

    ```


    160'
