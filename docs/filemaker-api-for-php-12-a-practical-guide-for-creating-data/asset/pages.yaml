  md: '# Lesson 46: Validate Credit Cards


    **Objective:** In this lesson you will learn how to validate credit card data
    without a gateway. If you plan a shopping cart you will need to know how to validate
    the credit card data. Sure you can rely on your gateway to respond with pass or
    fail. However that would mean you will need to tax your server and/or load the
    database with junk records. You are much better off validating the card type,
    prefix, length and Luhn function by submitting to credit card to your gateway
    to receive your funds. This lesson will show you how to implement credit card
    validation with a production quality validation function that''s portable to any
    solution.


    **Difficulty:** Difficult


    **Sample Files:

    PHPFiles/Advanced/Lesson46/validate_cc.php

    PHPFiles/Advanced/Lesson46/ValidateCC.php

    PHPFiles/Advanced/Lesson46/ValidateCC.fmp12


