- pgno: 39
  md: '# Configure Web Publishing


    45. Click Web Publishing in the left window.


    46. On a test server it''s nice to know if errors are coming from the web publishing
    core, the web publishing engine, or FileMaker Server. Therefore, I would recommend
    selecting the radio button for Error level messages. If your production is stable
    you can uncheck the logging box to improve performance.


    47. On a test server you can set the number of web publishing sessions to 5 so
    you don''t lose performance. On the production you probably want to set the number
    of sessions to 100 since you won''t know how many people will be simultaneously
    accessing your web server. 100 connections doesn''t sound like a lot. However,
    the session is opened during the request (i.e. search for requests), and then
    is immediately closed once the information is sent back to the user''s browser.
    This happens in a fraction of a second. Therefore, 100 simultaneous sessions is
    actually a lot of capacity. Just keep in mind that the more unused you leave open,
    the slower the performance of the server.


    48. Click Save.


    ![](img/5a2c5fda68d42e5d65f51850276e49ec_39_0.png)


    Figure 3-19: General Settings Configuration


    49. We''re obviously going to access FileMaker data using the API for PHP. So
    you will need to check the box to enable PHP publishing.


    50. A few of the examples in the book use pre-validation to check the data on
    the web server before sending the data to the database. For the pre-validation
    you work to have you check the box to enable record data pre-validation.'
  merge: -1
  img_proc: true
