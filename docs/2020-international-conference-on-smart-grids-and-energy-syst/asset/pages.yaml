    elaborate explained in section III with each algorithm discussed in its respective
    subsection. Section IV discusses the numerical results obtained using the proposed
    model followed by a conclusion in section V that summarizes the work presented
    in this paper.


    # II. LITERATURE REVIEW


    A literature review of many papers has been conducted to identify a research gap.
    Many papers have been written to forecast both, solar irradiation and solar power
    generation. As will be established in section III-A, the techniques used in various
    papers focus on forecasting solar power generation. In the survey, three classes
    of works have been observed- first models with non-hybrid techniques, second models
    with NN-only hybrids and the third techniques that use a mixture of models used.
    The hybrid term refers to using more than one technique in conjunction with each
    other, as is presented in this paper.


    References [1], [2], and [4] are used when non-hybrid models based on computational
    intelligence. Piazza et al., in have used an artificial neural network (ANN) based
    architecture to forecast solar power based on temperature and irradiation. Along
    similar lines, Do [2] have used different models and have improved their performances.
    They have used a scaled performance, an ANN base and a multi-variate regression.
    Power [4] has used machine learning techniques to forecast forests and has forecasted
    solar power generation (SPG). Person et al., in, have used boosted decision trees
    of solar power generation and geographical conditions to forecast using weather
    prediction data (NWP), on a short term.


    References [51]


    # I. INTRODUCTION


    In order to policy level to increase renewable energy in power systems due to
    environmental impact, the use of solar energy has risen considerably in the post-decade.
    Many countries are now aiming for large-scale solar power implementation for energy.
    However, for this clean energy is solar power, which is depending on solar irradiation
    and is inherently stochastic. The uncertainty of solar power can be dealt with
    using appropriate techniques in order to do planning and scheduling for solar
    power to ensure maximum utility.


    In this paper, different learning algorithms are stitched together, forming a
    hybrid forecasting model based on a machine learning approach. The historical
    dataset used for building such prediction models is susceptible to missing data
    and outliers due to loss of data during grid failure events and faulty measuring
    instruments. In this work, the missing'
