    # III. METHODOLOGY


    # A. Pre-Processing


    Most time-series based forecasting models rely heavily on the accuracy and completeness
    of the historical data available for training. Two categories of historical data
    are considered in this paper include the total power general. Solar intensity
    is measured through various instruments and and memory recorder. These measurements
    are susceptible to measured accuracy owing to the edge and event intensity factors.
    In Our, data loss is observed in electricity meters measuring solar power generation
    in the event of grid solar clearances, generally which is prone to missing data
    and outliers.


    Raw data is measured for all training and testing purposes. This data is used
    to a univariate regressor to estimate the missing data through interpolation.
    A mathematical model is as shown in:


    ```

    $P_t = \beta_0 + \beta_1 P_t$$

    ```


    Here $P_t$ represents solar radiation (intensity) while $P_t$ represents generated
    power. This model is used to fill the missing data and filter the outliers.


    The data, after after pre-processing stage, is referred to as the dataset.


    As discussed, the first step of the proposed methodology is to clean the historical
    data through pre-processing. The subsequent stages (which are further discussed
    in III-B, III-C, III-D, III-E, III-F of this current section) are as:


    +   (i) Dataset is used to train the machine learning algorithms individually

    (ii) Forecasting errors are obtained for each individual algorithms

    (iii) an ensemble average (EA) model is used to handle the ends which forecasting
    error derived in [system]

    (iv) The EA acts as feature of the proposed methodology, the output of the EA
    will reflect the final predicted output.


    # B. Non-Linear Autoregressive Neural Network (NAR-NN)


    An autoregressive (NAR) model is one where the value of output k is dependent
    on its past values, i $k-1, k-2, ..., k-l$. Autoregressive models are used for
    forecasting applications. In this section, an autoregressive is used in a non-linear
    scenario.

    A neural network (NN) is a non-linear mapping between inputs and outputs. The
    NAR-NN has been used to fill a non-linear mapping between outputs and its past
    values. If $P_c[k]$ is the power generated at instant $k$ and if $f$ is a function
    representing a NN, then


    ```

    $P_c[k] = f(P_c[k-1], P_c[k-2], P_c[k-3], ..., P_c[k-l])$

    ```'
