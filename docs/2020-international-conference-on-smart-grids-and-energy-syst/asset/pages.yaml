    # IV. NUMERICAL RESULTS


    The proposed model is validated on a real-life dataset belonging to 1 MW solar
    plant, which is installed in the care of an educational institution, Panjrol Deendayal
    Patel University, Gujarat (23°09''15"N, 72°40''08"E). The historical dataset used
    to train, test and validate the model includes three-yearly data points pertaining
    to solar inception and solar power generator. This dataset has patches of missing
    data which are discussed in section III. All forecasting algorithms the proposed
    model has been trained and deployed on a system with Intel® i5-CPU with 8GB RAM
    using tools on MATLAB.


    As discussed in III, the first step of the proposed model is to train the dataset.
    The dataset is used to model different support algorithms like NARX-NAR, NAR-NN,
    ELM and RBF SVR. Each of these models has been trained and their degree of fit
    has been observed to decide on the order of the model and its performance acceptability.
    Forecasts of these models in comparison with historical dataset are shown in Fig.
    2, Fig 3 (forecasts of NAR-NN) and Fig 4 (forecast of ELM). These figures are
