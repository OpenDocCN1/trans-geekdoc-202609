    # G. Ensemble Averager (EA)


    Having trained models, an Ensemble Averager is defined which is the weighted average
    of the output of all algorithms. The weights of all have been learned using a
    linear model, as shown in Fig 1. If $Y_i$ is the output of the $i^{th}$ model
    and $c_i$ is the cost of the $i^{th}$ model, the ensemble output is given:


    ```

    $Y_{net} = \sum_{i=1}^{n}\alpha_i Y_i$

    ```


