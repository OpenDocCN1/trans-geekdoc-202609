    极端学习机是前馈神经网络，其权重不经过调整。这些权重被视为随机值，或者从其架构中继承。本质上，它们是正则化的神经网络，其中输出隐藏层没有正则化。这允许反转并将隐藏层处理为：


    ```

    $argmin_{\beta}||\beta||^2 + C\sum(\xi_i + \xi_i)^2 (9)

    ```


    这些在我们的应用中证明是有益的，如果它们是有帮助的（使得相对）结果受限于：


    ```

    $$\begin{cases} w_i^T x_i - b \le \xi_i \\ -w_i^T x_i - b \le \xi_i \\ \xi_i \ge
    0 \end{cases} (10)

    ```


    ELM 的数学公式与其所经历的回归神经网络部分相似。在他们的工作中，Huang 等人 [21] 将单层前馈神经网络 (SLFN) 的输出写为：


    然而，上述内容对于线性系统有效。为了引入非线性，那里使用了核函数基变换或高斯核。


    ```

    $H\beta = T (5)

    ```


    ```

    $k(x, x'') = e^{-\frac{||x-x''||^2}{2\sigma^2}} (11)

    ```


    ![](img/5b9f38a2da8b9ccf6581f5305ca25234_3_0.png)


    使用 RBF 核是因为它在其他核中实现了较小的误差。为了本文的目的，所提方法在自回归意义上被使用，通过 RBF 核来学习函数 $f(x) = w^Tx +
    b$。


    ## G. 集成平均值器 (EA)


    在训练模型后，定义了一个集成平均值器，它是所有算法输出的加权平均。所有权重都是使用线性模型学习的，如图 1 所示。如果 $Y_i$ 是第 $i$ 个模型的输出，$c_i$
    是第 $i$ 个模型的代价，则集成输出给出：


    ```

    $Y_{net} = \sum_{i=1}^{n}\alpha_i Y_i$

    ```


