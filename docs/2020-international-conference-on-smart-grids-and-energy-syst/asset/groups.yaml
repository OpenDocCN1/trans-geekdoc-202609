    **Abstract—** Solar power generation through photovoltaic technology is one of
    the most renewable energy sources. Solar power is growing rapidly due to its clean
    nature. From the system operation point of views, in this novel machine learning
    approach is proposed using an ensemble of models: Hybrid Ensemble Regression which
    exploits the advantages of different machine learning algorithms and incorporates
    them into a single model. Missing values in dataset have been dealt with using
    regression. The ensemble averaging is a verified method with many individual models,
    namely a non-linear autoregressive neural network, autoregressive neural network
    with exogenous signals (NAR), a least squares decision tree, support vector regression
    with RF and tested on a dataset of one MW solar power plant in Gujarat, India
    (23°15''11"N, 72°40''00"E). Proposed models are then used to forecast solar power
    generation.


    **Index Terms—** Technical Intelligence, Artificial Intelligence, Solar Power
    Forecasting, Ensemble Learning, Support Vector Machine, Neural Networks


