    ## 用于太阳能发电量预测的混合机器学习模型


    Anchit Nayak

    电气工程系

    Pandit Deendayal 石油大学 (DPDU)

    印度，甘迪纳格

    anchit.neet17@iot.pdpu.ac.in


    Leena Christine

    电气工程系

    Pandit Deendayal 石油大学 (DPDU)

    印度，甘迪纳格

    leena.santos@iot.pdpu.ac.in


    **摘要—** 通过光伏技术进行太阳能发电是最具再生性的能源来源之一。由于其清洁的特性，太阳能发电正在快速增长。从系统运行的角度来看，在这一新的机器学习方法中，提出了一种基于模型集成的模型：混合集成回归（Hybrid
    Ensemble Regression），该模型利用了不同机器学习算法的优势并将其整合到单一模型中。数据集中的缺失值已通过回归进行处理。集成平均是一种包含许多独立模型的经过验证的方法，即：非线性自回归神经网络、带有外生信号的自回归神经网络（NAR）、最小二乘法决策树、带随机森林（RF）的支持向量回归，并针对印度古吉拉特的一个
    1 MW 太阳能电站（23°15''11"N, 72°40''00"E）的数据集进行了测试。提出的模型随后用于预测太阳能发电量。


    **索引术—** 技术智能、人工智能、太阳能发电预测、集成学习、支持向量机、神经网络


    # I. 引言


    本文其余部分的结构大纲如下：第一节为引言，随后是第二节的文献综述。所提出的方法在第三节中进行了详细解释，每个算法均在各自的小节中进行了讨论。第四节讨论了使用所提模型获得的数值结果，最后在第五节给出了结论，总结了本文介绍的工作。


    # II. 文献综述


    对许多论文进行了文献综述，以确定研究空白。已有许多论文关于太阳能辐射和太阳能发电量的预测。正如 III-A 节所确定的，各种论文中使用的技术侧重于太阳能发电量的预测。在调查中，观察到三类工作：第一类是非混合式技术的模型，第二类是仅含神经网络（NN）的混合模型，第三类是使用混合模型的技术。“混合”一词指的是如本文所示，结合使用一种或多种技术。


    参考文献 [1]、[2] 和 [4] 用于基于计算智能的非混合模型。Piazza 等人使用基于人工神经网络（ANN）的架构，根据温度和辐射预测太阳能发电。类似地，Do
    [2] 使用了不同的模型并改进了它们的性能。他们使用了缩放性能、基于 ANN 的基础和多元回归。Power [4] 使用机器学习技术预测森林，并预测了太阳能发电量（SPG）。Person
    等人使用了太阳能发电和地理条件的增强决策树，利用天气预报数据（NWP）进行短期预测。


    为了由于环境影响而在政策层面增加电力系统的可再生能源，过去十年中太阳能的使用大幅增加。许多国家现在的目标是实现大规模的太阳能能源供应。然而，作为清洁能源的太阳能取决于太阳辐射，并且具有本质的随机性。太阳能的不确定性可以使用适当的技术来处理，以便对太阳能进行规划和调度，确保效用最大化。


    Gandelli 在 [5] 中使用了物理模型和 ANN 方法预测 SPG。利用水域地理坐标和数据细节预测区域。Fillipe 等人于 [6] 中使用了带有电气模型的自回归模型进行极短期预测。Dolara
    在 [7] 中使用了带有 ANN 的物理模型。Gradit 在 [8] 中使用了带有实时数据采集系统的 ANN。使用的模型包括多层感知器（MLP）ANN。Wolter
    等人使用了 ANN 模糊推理系统（ANNFS）和物理模型。


    参考文献 [9]、[10]、[11] 和 [12]：Zhang 等人在 [9] 中使用了混合的神经网络来预测预测值。Wang 等人在 [10] 中使用了集成回归模型。Cicero
    等人在 [11] 中使用了混合的神经网络。Bourzad 等人在 [12] 中使用了自回归平均（ARMA）。Haque 等人在 [14] 中使用了小波变换。[15]
    使用了自回归映射（ARTMAP）。[16] 使用了自回归平均系统。[17] [18] 使用了混合的 ANN。[19] 使用了 MLP。[20] 使用了 SVR、深度神经网络（DNN）和随机森林。


    综述显示，以下技术用于混合预测：

    - 最小二乘决策树

    - 基于的支持向量回归

    - 极端学习

    - NAR


    在下一节中提出了一个集成平均模型。


    # III. 方法论


    ### A. 预处理


    大多数时间序列预测模型很大程度上依赖历史数据的准确性和完整性。本文考虑了两类历史数据，包括总功率。由于事件因素，强度测量容易受到离值影响。


    原始数据用于训练和测试。通过插值法对缺失数据进行估计。数学模型如下：


    ```

    $P_t = \beta_0 + \beta_1 P_t

    ```


    在这里，$P_t$ 代表辐射（强度），而 $P_t$ 代表发电量。该模型用于填充缺失数据。


    预处理阶段后的数据被称为数据集。


    如所述，所提方法的第一步是通过预处理清理历史数据。随后的阶段（在本节的 III-B、III-C、III-D、III-E、III-F 中进一步讨论）如下：


    - (i) 使用数据集单独训练机器学习算法

    - (ii) 获取每个算法的预测误差

    - (iii) 使用集成平均（EA）模型处理系统中产生的预测误差

    - (iv) EA 作为所提方法的特征，EA 的输出将反映最终的预测结果。


    ### B. 非线性自回归神经网络（NAR-NN）


    自回归（NAR）模型是指输出 k 依赖于其过去值 k-1, k-2, ..., k-l 的模型。自回归模型被用于预测应用。在本节中，自回归被用于非线性场景。

    神经网络（NN）是输入与输出之间的非线性映射。NAR-NN 已用于填充输出与其过去值之间的非线性映射。如果 $P_c[k]$ 是 $k$ 刻生成的功率，且
    $f$ 是代表神经网络的函数，那么：


    ```

    $P_c[k] = f(P_c[k-1], P_c[k-2], P_c[k-3], ..., P_c[k-l])$

    ```


