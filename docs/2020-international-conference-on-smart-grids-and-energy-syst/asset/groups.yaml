    **Abstract—** Solar power generation through photovoltaic technology is one of
    the most renewable energy sources. Solar power is growing rapidly due to its clean
    nature. From the system operation point of views, in this novel machine learning
    approach, a model is proposed using an ensemble of models: Hybrid Ensemble Regression
    which exploits the advantages of different machine learning algorithms and incorporates
    them into a single model. Missing values in the dataset have been dealt with using
    regression. The ensemble averaging is a verified method with many individual models,
    namely a non-linear autoregressive neural network, autoregressive neural network
    with exogenous signals (NAR), a least squares decision tree, support vector regression
    with RF and tested on a dataset of one MW solar power plant in Gujarat, India
    (23°15''11"N, 72°40''00"E). Proposed models are then used to forecast solar power
    generation.


    **Index Terms—** Technical Intelligence, Artificial Intelligence, Solar Power
    Forecasting, Ensemble Learning, Support Vector Machine, Neural Networks


    # I. INTRODUCTION


    The outline of the rest of the paper is as follows. Introduction in section I
    is followed by a literature review in section II. The proposed methodology is
    elaborate explained in section III with each algorithm discussed in its respective
    subsection. Section IV discusses the numerical results obtained using the proposed
    model followed by a conclusion in section V that summarizes the work presented
    in this paper.


    # II. LITERATURE REVIEW


    A literature review of many papers has been conducted to identify a research gap.
    Many papers have been written to forecast both solar irradiation and solar power
    generation. As will be established in section III-A, the techniques used in various
    papers focus on forecasting solar power generation. In the survey, three classes
    of works have been observed: first models with non-hybrid techniques, second models
    with NN-only hybrids and the third techniques that use a mixture of models used.
    The hybrid term refers to using more than one technique in conjunction with each
    other, as is presented in this paper.


    References [1], [2], and [4] are used when non-hybrid models based on computational
    intelligence. Piazza et al. have used an artificial neural network (ANN) based
    architecture to forecast solar power based on temperature and irradiation. Along
    similar lines, Do [2] have used different models and have improved their performances.
    They have used a scaled performance, an ANN base and a multi-variate regression.
    Power [4] has used machine learning techniques to forecast forests and has forecasted
    solar power generation (SPG). Person et al. have used boosted decision trees of
    solar power generation and geographical conditions to forecast using weather prediction
    data (NWP) on a short term.


    In order to policy level to increase renewable energy in power systems due to
    environmental impact, the use of solar energy has risen considerably in the post-decade.
    Many countries are now aiming for large-scale solar power implementation for energy.
    However, for this clean energy is solar power, which is depending on solar irradiation
    and is inherently stochastic. The uncertainty of solar power can be dealt with
    using appropriate techniques in order to do planning and scheduling for solar
    power to ensure maximum utility.


    Gandelli, in [5], used a basic physical model and ANN approach to forecast SPG.
    Water geographical coordinates and data details were used to forecast region.
    Fillipe et al., in [6], used an auto-regressive model with an electrical model
    to predictions for very short horizons. Dolara, in [7], used a physical model
    with ANN. Gradit, in [8], used ANNs with a real-time data acquisition system.
    The models used include Multi-layer perception (MLP) ANN. Wolter et al. used ANN
    fuzzy inference system (ANNFS) and a physical model.


    References, [9], [10], [11] and [12] were used to forecast an ensemble (or hybrid)
    of neural networks. Zhang et al., in [9], used a neural network model with an
    ensemble intelligence algorithm and particle swarm optimization model. Wang et
    al. in [10], used a hybrid model with optimization and search algorithm. Ram used
    an ensemble of neural networks to forecast in [11], while Cicero et al. used ANNs
    using an analog technique.


    Next are models that used, both statistical and empirical approaches. For instance,
    Bourzadoum et al in [13] used a hybrid model with Autoregressive Moving Averaging
    model. SVR and Yang ANN used SVM approach to forecast short term horizons [14].
    Haque et used a wavelet transform method (ARTMAP) with a filter bank to forecast
    short term. [15] Dong et al., in [16], used several optimization maps, forecast
    solar irradiance via regression and particle swarm optimization (PSO) for very
    short forecast horizon. Reference [17] used a hybrid of ARMA (Autoregressive Moving
    Average System) ANN, ANFS (Autoregressive Non-linear Forecasting System) to optimize
    for very short-term forecasts. In [18], a transformation based on K-means algorithm
    was used in conjunction with MLP Neural. Reference [19] has presented a hybrid
    model with SVR and an ANN have been deployed for a very short and a short term
    forecast. [20] has presented a hybrid model of SVR, DNN (Deep Neural Network),
    gradient boosting and random forests.


    The survey reveals that the following forecasts have not been used in a hybrid
    (e.g., using Ensemble Average):


    - Least Squared Decision Tree

    - KNN-based Support Vector Regression

    - Extreme Learning

    - NAR and NAR Networks


    An Ensemble Average model is proposed in the next section, where all the above-mentioned
    techniques are used in forming a hybrid machine learning-based model.


    # III. METHODOLOGY


    ### A. Pre-Processing


    Most time-series based forecasting models rely heavily on the accuracy and completeness
    of the historical data available for training. Two categories of historical data
    are considered in this paper include the total power general. Solar intensity
    is measured through various instruments and and memory recorder. These measurements
    are susceptible to measured accuracy owing to the edge and event intensity factors.
    In Our, data loss is observed in electricity meters measuring solar power generation
    in the event of grid solar clearances, generally which is prone to missing data
    and outliers.


    Raw data is measured for all training and testing purposes. This data is used
    to a univariate regressor to estimate the missing data through interpolation.
    A mathematical model is as shown in:


    ```

    $P_t = \beta_0 + \beta_1 P_t

    ```


    Here $P_t$ represents solar radiation (intensity) while $P_t$ represents generated
    power. This model is used to fill the missing data and filter the outliers.


    The data, after pre-processing stage, is referred to as the dataset.


    As discussed, the first step of the proposed methodology is to clean the historical
    data through pre-processing. The subsequent stages (which are further discussed
    in III-B, III-C, III-D, III-E, III-F of this current section) are as:


    - (i) Dataset is used to train the machine learning algorithms individually

    - (ii) Forecasting errors are obtained for each individual algorithms

    - (iii) an ensemble average (EA) model is used to handle the ends which forecasting
    error derived in the system

    - (iv) The EA acts as feature of the proposed methodology, the output of the EA
    will reflect the final predicted output.


    ### B. Non-Linear Autoregressive Neural Network (NAR-NN)


    An autoregressive (NAR) model is one where the value of output k is dependent
