    # IV. 数值结果


    所提模型在属于教育机构 Panjayal Patel University, Gujarat 的真实数据集上进行了验证。用于训练、测试和验证模型的历史数据集包含了关于太阳能发电的三个年度数据点。该数据集的缺失数据在第三节中讨论。正如第三节所述，所提模型的第一步是使用带有
    Intel i5-CPU 和 8GB RAM 的系统通过 MATLAB 工具进行训练。


    通过测试架构使用试错法评估了延迟和隐藏层。权重也通过 Levenberg-Marquardt 算法学习。这些模型与历史数据集的对比预测显示，这些模型的拟合程度在图
    2、图 3 (NAR-NN) 和图 4 (ELM) 所示。


    在图 5 中绘制了 NAR-NN 和 ELM 的预测输出。观察发现，尽管单个算法受到其固有特征的限制，但它们的适当组合可以抵消每个模型的不准确性。由平均值器完成的如图所示。为了显示所提模型的正确性，将这些算法的均方根误差
    (RMSE) 和平均绝对误差 (MAE) 与所提模型的误差进行了比较。


