    \ 常用于促进计算机及其他设备之间的通信和资源共享。\n\n**局域网的特征：**\n\n* **地理区域有限**：`LANs` 通常覆盖一小块区域，例如单栋建筑或一组建筑。\n\
    * **高数据传输率**：由于规模有限，`LANs` 通常提供高速数据传输率，使其成为需要快速访问共享资源任务的理想选择。\n* **以太网或 Wi-Fi\
    \ 连接**：`LANs` 通常使用`Ethernet` 网线或`Wi-Fi` 技术将设备连接到网络。\n\n### 广域网 (WAN)\n\n广域网（`WAN`）跨越更大的地理区域，连接跨越城市、国家甚至大陆的多个\
    \ `LANs` 和网络。互联网本身是 `WAN` 最显著的例子，连接着全球数以十亿的设备。\n\n**广域网的特征：**\n\n* **地理区域大**：`WANs`\
    \ 可以覆盖遥远距离，连接不同城市、国家或大陆的设备。\n* **数据传输率较低**：由于涉及距离延伸，与 `LANs` 相比，`WANs` 通常提供的数据传输率较低。\n\
    * **利用公网和私有网络**：`WANs` 可以在公网（如互联网）或组织建立的私有网络上运行。\n\n### 虚拟专用网络 (VPN)\n\n 专用网络（`VPN`）将私有网络扩展到公网上，使用户可以发送和接收数据，就像他们的设备直接连接到私有网络一样。`VPNs`\
    \ 常用于访问互联网时增强安全性和隐私。\n\n**VPN 的特征：**\n\n* **安全数据传输**：`VPNs` 对数据加密以确保在公网上的安全传输，保护敏感信息免受未经授权的访问。\n\
    * **匿名性和隐私性**：通过掩盖你的 `IP address`，`VPNs` 提供了匿名性和隐私性，使第三方更难以跟踪你的在线活动。\n* **远程访问**：`VPNs`\
    \ 允许远程用户安全地访问私有网络上的资源，使其成为远程工作和访问地理限制内容的理想选择。\n\n理解理解不同类型的网络（包括 `LANs`、`WANs`\
    \ 和 `VPNs`）对于掌握现代通信和连接的复杂性至关重要。每种类型的网络都有独特的用途，满足特定的需求和要求。\n\n* `LANs` 在区域内促进通信和资源共享，为本地任务提供高速连接。\n\
    * `WANs` 连接跨越遥远距离的多个 `LANs` 和网络，实现全球通信和远程资源访问。\n* `VPNs` 为公网提供安全私密的访问，增强用户访问互联网时的安全性和匿名性。\n\
    \n# 第 2 章：网络安全基础\n\n在当今互联的世界中，网络安全已成为我们数字生活的基石。随着我们越来越依赖技术进行通信、工作和娱乐，保护我们的数据和隐私免受网络威胁的需求以前所未有的。本章将深入网络安全的基础，探索保护我们数字资产的原则、威胁和实践。\n\
    \n### 什么是网络安全？\n\n网络安全是指保护计算机系统、网络和数据免受盗、损坏或未经授权访问的实践。它包含一系列策略、技术和实践，旨在保护信息并确保数字资产的完整性、机密性和可用。\n\
    \n### 网络安全的支柱\n\n* **机密性 (Confidentiality)**\n机密性确保数据仅供授权的个人或系统访问。加密在维护机密性方面起着至关重要的作用，它将数据转换为授权方才能解码的代码格式。\n\
    * **完整性 (Integrity)**\n完整性确保数据在存储、传输和处理过程中保持不改变且不损坏。使用`校验和`和`数字签名`等技术有助于检测并防止数据未经授权的篡改。\n\
    * **可用性 (Availability)**\n\n"
