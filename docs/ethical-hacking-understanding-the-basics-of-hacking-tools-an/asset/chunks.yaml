    *   Phishing Attacks: Deceptive techniques used to trick users into disclosing
    sensitive information, such as usernames, passwords, and credit card details,
    usually through emails, websites, or messages.


    *   SQL Injection: Exploiting vulnerabilities in web applications to manipulate
    SQL queries and gain unauthorized access to databases, extract sensitive data,
    or execute arbitrary commands.


    *   Man-in-the-Middle (MitM) Attacks: Intercepting and relaying communication
