    \n## 1.2 计算机网络简介\n\n### 什么是计算机网络？\n\n计算机网络是由计算机、服务器和其他设备组成的，它们相互连接以共享资源并相互通信。这些网络可以简单到家庭或办公环境中连接的几台电脑，也可以复杂到跨越大陆的全球网络。\n\
    \n### 计算机网络的类型\n\n* **局域网 (LAN)**\n局域网，或 `LAN`，是连接有限区域内（如家庭、办公室或学校）设备设备的网络。`LANs`\
    \ 通常使用`Ethernet` 网线或`Wi-Fi`来连接设备，并允许共享打印机、文件和互联网连接等资源。\n\n* **广域网 (WAN)**\n广域网，或\
    \ `WAN`，跨越更大的地理区域，通常连接跨城市、国家或大陆的 `LANs`。互联网本身可以被视为最大的 `WAN`，连接着全球数以十亿的设备。\n\n\
    * **无线网络**\n无线网络（如 `Wi-Fi` 和蜂窝网络）使用无线电波传输数据，不需要物理电缆。这些网络提供了灵活性和便利性，允许设备在一定范围内进行无线连接和通信。\n\
    \n### 网络设备\n\n* **路由器 (Routers)**\n`Routers` 是本质的网络设备，用于在不同网络之间转发数据包。它们决定数据传输的最佳路径，确保设备之间的高效通信。\n\
    \n* **交换机 (Switches)**\n`Switches` 是连接网络内设备的设备，允许它们相互通信。与路由器不同，`switches` 工作在\
    \ `OSI` 模型的链路层（`Layer 2`），对于创建和管理 `LANs` 至关重要。\n\n* **调制解调器 (Modems)**\n`Modems`\
    \ 将网络连接到互联网，将来自你网络的数字数据转换为可以在通信线路（如电话线或电缆连接）上传输的格式。\n\n* **网络协议**\n网络协议是一组规范数据如何在网络上传输和接收的规则约定。一些常见的协议包括：\n\
    \n* `TCP/IP`: 传输控制协议/网协议是互联网的基础协议，负责跨网络路由数据包。\n* `HTTP/HTTPS`: 超文本传输协议及其安全版本 `HTTPS`\
    \ 是用于在互联网上传输网页的协议。\n* `FTP`: 文件传输协议用于在网络上的客户端和服务器之间传输文件。\n\n计算机网络构成了我们互联世界的骨干，实现了全球范围内的通信、协作和资源共享。对于任何在数字领域中导航的人来说，理解计算机网络的基础（从网络类型、设备到管理它们的协议）都是至关重要的。\n\
    \n当我们深入学习此书时，我们将探索网络技术的复杂性，揭示数据如何跨越网络传输、网络安全面临的挑战，以及驱动网络未来的创新。\n\n所以，让我们继续探索计算机网络这个迷人的世界，发现连接我们所有人的魔力吧！\n\
