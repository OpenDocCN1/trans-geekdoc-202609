    ## 1.2 Introduction to Computer Networks


    What is a Computer Network?


    A computer network is a collection of computers, servers, and other devices interconnected
    to share resources and communicate with each other. These networks can be as simple
    as a few computers connected in a home or office setting, or as complex as global
    networks spanning continents.


    Types of Computer Networks


    *   Local Area Network (LAN)


    A Local Area Network, or LAN, is a network that connects devices within a limited
    area, such as a home, office, or school. LANs typically use Ethernet cables or
    Wi-Fi to connect devices and allow for the sharing of resources like printers,
    files, and internet connections.


    *   Wide Area Network (WAN)


    A Wide Area Network, or WAN, spans a larger geographic area, often connecting
    LANs across cities, countries, or continents. The internet itself can be considered
    the largest WAN, connecting billions of devices worldwide.


    *   Wireless Networks


    Wireless networks, such as Wi-Fi and cellular networks, use radio waves to transmit
    data without the need for physical cables. These networks offer flexibility and
    convenience, allowing devices to connect and communicate wirelessly within a certain
    range.


    Network Devices


    *   Routers


    Routers are essential network devices that forward data packets between different
    networks. They determine the best path for data to travel, ensuring efficient
    communication between devices.


    *   Switches


    Switches are devices that connect devices within a network, allowing them to communicate
    with each other. Unlike routers, switches operate at the data link layer (Layer
    2) of the OSI model and are essential for creating and managing LANs.


    *   Modems


    Modems connect a network to the internet, translating digital data from your network
    into a format that can be transmitted over a communication line, such as a phone
    line or cable connection.


    *   Network Protocols


    Network protocols are sets of rules and conventions that govern how data is transmitted
    and received over a network. Some common protocols include:


    *   TCP/IP: The Transmission Control Protocol/Internet Protocol is the foundational
    protocol of the internet, responsible for routing data packets across networks.


    *   HTTP/HTTPS: HyperText Transfer Protocol and its secure version, HTTPS, are
    protocols used for transmitting web pages over the internet.


    *   FTP: File Transfer Protocol is used for transferring files between a client
    and a server on a network.


    Computer networks form the backbone of our interconnected world, enabling communication,
    collaboration, and resource sharing on a global scale. Understanding the basics
    of computer networks, from the types of networks and devices to the protocols
    that govern them, is essential for anyone navigating the digital landscape.


