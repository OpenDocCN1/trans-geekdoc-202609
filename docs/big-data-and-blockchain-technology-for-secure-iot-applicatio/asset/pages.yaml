  md: '# Decentralized trust


    # A framework for ensuring data integrity in IoT using blockchain


    R. Praveen Sam, A. Ravi Kumar, V. Subbaramaiah, and G. Anil Kumar


    # 3.1 INTRODUCTION


    The swift evolution of the Internet of Things (IoT) is fundamentally reshaping
    our daily lives [1]. With an increasing number of physical devices, such as smartphones,
    wearables, and vehicles, connecting to the Internet via embedded systems and sensors,
    substantial data can be gathered and transmitted to cloud computing systems for
    efficient data analysis and quicker decision-making. Additionally, these devices
    can execute tasks beyond human capabilities, exemplified by unmanned aerial vehicles,
    or drones, operating as a microcosm of IoT, undertaking diverse activities like
    package delivery, crop quality monitoring, and anomaly detection in farming [2].
    However, as IoT expands, the heightened connectivity and growing complexity of
    computing infrastructure expose vulnerabilities to cyber-attacks. Some physical
    devices are situated in insecure environments, susceptible to tampering by hackers.
    The wireless sensor network facilitates the transmission of data and operational
    commands to the Internet, a potentially untrusted communication channel, making
    them prone to unauthorized alterations. Consequently, ensuring device authorizations
    and maintaining data provenance [3,4] emerges as a critical concern.


    Furthermore, numerous existing IoT systems depend on centralized communication
    models connecting to servers or cloud computing platforms that handle processing
    and data storage. The predicament here lies in the server becoming a bottleneck
    and a prime target for cyber-attacks [5]. It also serves as a potential point
    of failure that could disrupt the entire network, impacting data integrity. Therefore,
    the challenge persists in establishing a genuinely trustworthy and integrated
    environment to support interconnected devices and computing infrastructure for
    secure data transfer. Improving communication security in a diversified environment
    can be achieved by creating a new framework based on blockchain technology for
    big data analytics inside the framework of smart city architecture. Blockchain
    is a revolutionary distributed ledger system that offers improved security due
    to its decentralized operation [6]. A chain of linked blocks containing'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'considerable data generated from transactions is created when fresh transactions
    are recorded in verified blocks. These blocks store a plethora of information,
    creating a detailed audit trail of every transaction. The distributed ledger technology
    known as blockchain eliminates the need for a central authority to verify transactions.
    Traditional data analysis methods face a formidable obstacle in the form of big
    data, which is defined as the collection of massive measurements [7]. As real-time
    big data applications continue to grow in popularity, so does the need for predictive
    big data analytics. Cameras, infrastructure, and smartphone apps let local governments
    monitor things like traffic, energy usage, and air pollution. Services, transportation,
    and public safety can all benefit from this data once it has been handled using
    technological methods [8]. Figure 3.1 shows the steps involved in collecting and
    processing data for smart cities using big data.


    In the contemporary landscape, diverse methods are employed for processing large
    volumes of transaction information online. Blockchain technology has proven to
    be highly effective in facilitating online data processing. Operating at a superior
    level, the distributed infrastructure of blockchain enables multiple remote accesses.
    In the course of transactions, data is kept in distinct databases by a number
    of different entities; the implementation of blockchain technology enables these
    groups to get access to a comprehensive system [9]. New research integrating blockchains
    with big data to improve smart city connectivity security is the main novelty.
    By developing an effective framework for communication


