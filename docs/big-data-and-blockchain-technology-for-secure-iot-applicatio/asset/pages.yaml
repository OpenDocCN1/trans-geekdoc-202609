  md: '![](img/6bf6d18cae16ff5abc8a617b617c781f_127_0.png)


    Figure 7.6 Latency overhead of in-memory blockchain, distributed file system,
    and graph database.


    blockchain delay from one node to all nodes to make sure it is fair to compare.
    Since the database-based provenance cannot scale beyond tens of nodes, the comparison
    is restricted to no more than 32 nodes. At lower scales (four nodes), the in-memory
    blockchain has latency overhead similar to the distributed filesystem, as shown
    in Figure 7.6. However, when the node count increases to eight or more, the in-memory
    blockchain outperforms the distributed filesystem. At every size, the in-memory
    blockchain far surpasses the graph database. The suggested in-memory blockchain
    outperforms the filesystem by a factor of 32 and the database by a factor of four
    at the 32-node size. The fact that the amortized per-node latency drops as the
    number of nodes increases is another notable feature of the in-memory blockchain.


    # 7.6 CONCLUSION


    This chapter presents a new architecture for blockchain systems that primarily
    uses memory to store ledgers, along with a consensus process that is specifically
    intended for this architecture. These developments, taken as a whole, make it
    possible to run a blockchain-like ledger service efficiently, which guarantees
    trustworthy data provenance on HPC systems. Experimental validation and theoretical
    support both back up the proposed consensus. An evaluation of a lightweight system
    prototype with more than one million transactions showed a 32× acceleration when
    compared to provenance services based on filesystems and a four orders of magnitude
    acceleration when compared to provenance services based on databases.'
