  md: 'In the system model, delay-sensitive tasks are assigned to fog virtual machines
    (VMs) for execution. Fog nodes, located closer to the edge of the network, host
    these VMs to minimize latency and ensure timely processing of time-critical tasks.
    Fog computing offers proximity to end devices, enabling faster response times
    and reduced network congestion for delay-sensitive applications. However, non-delay-sensitive
    tasks are scheduled on cloud VMs residing in centralized data centers. These tasks
    typically have less stringent latency requirements and can tolerate longer processing
    times. Cloud data centers provide ample computational resources and storage capacity,
    making them suitable for handling bulk processing and storage-intensive tasks.


    The below equations, total fog_tasks and total cloud_tasks, represent the total
    number of tasks allocated to fog and cloud VMs, respectively. These expressions
    are computed by summing up the number of tasks assigned to each fog VM and cloud
    VM, respectively. For example, total fog_tasks is calculated by adding the number
    of tasks assigned to each individual fog VM, denoted as fog_t1, fog_t2, and so
    on, up to fog_tn. Similarly, total cloud_tasks is calculated by summing up the
    number of tasks assigned to each cloud VM, denoted as cloud_t1, cloud_t2, and
    so on, up to cloud_tn. These expressions provide a straightforward way to compute
    the total workload allocated to fog and cloud VMs, which can be useful for analyzing
    resource utilization, workload distribution, and system performance in CFC environments.


    ```

    Total fog_tasks = fog_t1 + fog_t2 + ⋯ + fog_tm    (11.2)

    Total cloud_tasks = cloud_t1 + cloud_t2 + ⋯ + cloud_tn    (11.3)

    ```


    The core component of the system model is the HSMAO scheduler, which orchestrates
    the allocation of tasks to fog and cloud VMs based on their characteristics and
