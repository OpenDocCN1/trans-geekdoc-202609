    +   - C_i represents the computational requirement of task i.

    +   - w1, w2, w3, and w4 are weighting factors that determine the relative importance
    of response time, resource utilization, and meeting deadlines, respectively.


    The objective function aims to strike a balance between minimizing response time,
    resource utilization, and energy consumption, and ensuring timely completion of
    tasks. The weighting factors w1, w2, w3, and w4 can be adjusted based on the specific
    requirements and priorities of the CFC environment. Optimizing this objective
