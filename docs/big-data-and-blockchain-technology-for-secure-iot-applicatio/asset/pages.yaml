- pgno: 50
  md: '# 3.2 LITERATURE SURVEY


    In the context of cloud storage, ensuring the integrity of data becomes an essential
    component of the security strategy. This enables users to check the integrity
    of their data that is stored externally in an efficient manner. Here we give a
    rundown of what is already out there in terms of auditing systems, public verification,
    and blockchain authentication of data.


    # 3.2.1 Static model


    Numerous research endeavors have explored two fundamental static models for auditing
    outsourced data in cloud storage [12]. In one instance, a provable data possession
    (PDP) model was introduced in Ref. [13], leveraging RSA-based homomorphic verifiable
    tags. However, this model exclusively addresses static data storage and lacks
    thorough safety analysis [14]. Despite supporting public verifiability (delegating
    verification to a third party) and block-less verification (verifying without
    retrieving the raw data block), the scheme’s extension to a scalable PDP version
    still falls short in fully supporting dynamic data verification [15,16]. It encounters
    limitations when users attempt to insert, modify, or delete blocks dynamically.
    Another model, the provable retrievability (PoR) model, was proposed in Ref. [17].
    This model ensures the correct storage of data by cloud servers and efficient
    data retrieval for users, employing sampling and error-correcting codes. However,
    the PoR scheme assumes a fixed querying number for users, restricting its applicability
    to static data storage scenarios. An alternative recovery proof scheme was introduced
    in Ref. [18], employing the Boneh-Lynn-Shacham short signature scheme [19]. While
    efficient and compact, this scheme does not support dynamic data integrity verification.


    The PoR strategy places a more rigorous demand on data recoverability than the
    PDP scheme, which just checks data integrity. The PoR strategy improves data redundancy
    to withstand a given level of data loss or corruption by encoding and recovering
    data using error correction code algorithms.


    # 3.2.2 Dynamic model


    A dynamic PDP technique was presented by [20] to enable thorough dynamic data
    updates in the cloud for data integrity verification. This scheme involves splitting
    the data file into equal-length data blocks. For the purpose of integrity verification,
    each data block is given a tag. Modification, insertion, and deletion of data
    all occur on the smallest possible unit, the data block. The scheme uses an authentication
    database with rank information to maintain and validate the legitimacy of these
    tags. There is no public verification support in this scheme, even though it can
    validate dynamic data.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'There is no way to dynamically update the cloud data in the static models;
    it stays static. Dynamic models give cloud DOs the power to make real-time adjustments
    to their data. However, a lot of storage, communication, and processing power
    are required by both static and dynamic models.


    # 3.2.3 Public verification


    In most cases, allocating substantial computing and communication resources is
    necessary for data integrity verification. In order to lessen the impact on compute,
    communication, and storage resources, Data Owners (DOs) frequently assign the
    task of conducting verifications to a Third-Party Auditor (TPA) so that data users
    do not have to bear the overhead of managing and verifying the integrity of the
    data themselves. This delegation helps to ensure that the data remains trustworthy
    and secure, while minimizing the burden on the data users and allowing them to
    focus on utilizing the data rather than verifying it Refs. [21,22]. Having a TPA
    involved in an audit increases security concerns since the TPA can learn more
    about the outsourced data. As a result, having full faith in the TPA is not a
    given, which raises concerns about potential security and privacy risks. Consequently,
    protecting user data from the TPA is crucial, particularly for cloud storage of
    critical or secret material.


    There has been little progress in public verification efforts thus far. An effective
    method for public verification of the completeness of dynamic data was suggested
    by Ref. [23]. Unfortunately, this scheme’s communication overhead during verification
    makes it unworkable. Using a data structure known as the Range Information Authentication
    2–3 tree, which can securely handle dynamic data, a comprehensive dynamic update
    capability was provided in Refs. [24,25]. When it comes to public verifiability
    [26], looked at ways to make public authentication more secure by processing outsourced
    data before authentication, which would stop TPAs from stealing users’ data during
    public verification. The scheme has a high computational cost, but it was used
    in Ref. [27] to prevent TPAs from learning knowledge during verification using
    a random mask mechanism. Additionally, the centralized auditing service in this
    scheme is vulnerable, as a breakdown in the centralized service could lead to
    a complete halt of the auditing service. In Ref. [28], a privacy-aware public
    auditing mechanism for shared cloud data was proposed, constructing a homomorphic
    verifiable group signature [29]. However, this mechanism faces challenges, including
    potential interruptions in auditing services if the TPA is under attack. Furthermore,
    users could exploit security issues to manipulate compensation from Cloud Service
    Providers (CSPs).


    Global distributed file system construction has been the subject of much research,
    with mixed results. In the academic community, Andrew file system (AFS) is known
    as a very effective system. Over 100 million users can now be accommodated by
    industry platforms like BitTorrent, Napster, and KaZaA. The development of generic
    file systems that offer decentralized'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'distribution, low latency, and global coverage is an ongoing endeavor [30].
    From the client-server paradigm, which was originally developed for distributed
    systems with a smaller scale and a server with more processing power, the peer-to-peer
    (P2P) scheme evolved. Each node in a P2P network acts as both a client and a server,
    allowing for symmetric communication. Through the facilitation of direct communication
    between peers, P2P systems overcome bandwidth constraints in file sharing. The
    scalability and efficiency of file sharing are greatly improved when peers share
    files in parts instead of all clients requesting them from a server at once.


    # 3.3 METHODOLOGY


    The four primary components of the proposed system are shown in Figure 3.2: Data
    Owner Application (DOA), Data Consumer Applications (DCAs), Cloud Storage Service
    (CSS), and Blockchain. There are two subtypes of CSSs: private and public. Assuming
    a single DOA exists to generate data and upload it to the CSS, we will use this
    assumption throughout the study. A number of DOAs and DCAs are required for data
    integrity detection. Organizations that need the DIS can access it through the
    blockchain system, which requires them to launch a blockchain client on their
    own nodes. Any node can join or exit the blockchain network at any time.


    Although the Cloud can also operate as a blockchain node in actuality, for the
    sake of simplicity in our proposed service structure, CSS specifically refers
    to CSS. Smart contracts hosted on the blockchain enable the DIS


