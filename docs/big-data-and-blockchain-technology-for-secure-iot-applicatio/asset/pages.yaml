    # 10.2 FOUNDATIONS OF BLOCKCHAIN TECHNOLOGY


    # 10.2.1 Basics of blockchain technology


    The foundational ideas of blockchain technology lay the framework for understanding
    its decentralized and immutable characteristics, which are essential for its widespread
    adoption and acceptance. Fundamentally, a blockchain operates as a distributed
    ledger that documents transactions throughout a network of linked nodes, guaranteeing
    trust, security, and transparency without the need for middlemen. Every block
    in the blockchain consists of a collection of transactions that are cryptographically
    connected to the block before it, creating a sequential arrangement of blocks.
    Through the use of cryptographic hashing algorithms, this interlinking creates
    an immutable record of transactions, making it extremely impossible to alter previous
    data without the approval of the majority of network users [4].'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'Blockchain operates on a network architecture that is decentralized, whereby
    every participant, or node, maintains a complete copy of the entire blockchain
    ledger. This decentralization guarantees resilience against singular points of
    failure and prevents unauthorized manipulation of data, thereby enhancing the
    security and dependability of the network.


    By facilitating agreement among network participants regarding the authenticity
    of transactions, consensus mechanisms are essential to maintaining the integrity
    of the blockchain. Two popular consensus techniques are Proof of Stake (PoS) and
    Proof of Work (PoW). In order to validate transactions and add new blocks to the
    blockchain, PoW requires users to solve complex mathematical puzzles, whereas
    PoS chooses block validators based on stake and rewards honest behavior with money.


    Another essential component of blockchain technology are smart contracts, which
    are self-executing agreements with predefined terms and conditions built into
    the network. These programmable contracts eliminate the need for middlemen and
    streamline a variety of corporate operations by automatically carrying out activities
    when predetermined circumstances are satisfied.


    Blockchain technology has numerous uses in a variety of sectors, such as supply
    chain management, healthcare, and finance. It makes transactions safer and more
    transparent, lowers the risk of fraud and error, and promotes the development
    of decentralized apps (DApps) and new business models. To fully realize the disruptive
    potential of blockchain technology and explore its many applications in the modern
    digital economy, one must acquire a thorough understanding of its fundamentals.
    Figure 10.2 highlights the distinctive advantages of blockchain in comparison
    to other technologies.


    # 10.2.2 Types of blockchains


    Blockchain technology has developed to accommodate various use cases, resulting
    in different categories of blockchains. These categories can be broadly classified
    into three main groups: public blockchains, private blockchains, and consortium
    blockchains. Each group possesses its own distinct characteristics, advantages,
    and use cases.


    # 10.2.2.1 Public blockchains


    Public blockchains are decentralized networks in which anybody may join, see,
    edit, and verify transactions without needing to obtain authorization. Anyone
    can access the ledger and participate in the consensus process thanks to these
    open and transparent blockchains. Blockchains that are publicly accessible include
    Ethereum and Bitcoin.


    Public blockchains operate on the foundations of immutability, transparency, and
    decentralization. Since everyone in the network has equal access'
