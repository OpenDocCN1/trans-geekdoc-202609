  md: '![](img/6bf6d18cae16ff5abc8a617b617c781f_39_0.png)


    Figure 2.3 Full-SDMN architecture.


    Full-SDMN orchestration based on the services, which in turn build flows to programme
    the network components. The orchestration of NFV guarantees the creation and operation
    of these functions on the underlying network [24]. Lastly, SDN controllers manage
    the network’s physical components and operations. Crucial elements within the
    architecture include Home Gateways (GWs), situated at the edge network, functioning
    as gateways for various edge networks like 3GPP RAN (Radio Access Network), non-3GPP
    RAN, or wireline networks. As a result, Home GWs need to meet specific criteria
    regarding flexibility and scalability [25]. This involves the ability to create
    slices, manage and sustain the network, and host IoT services (see Figure 2.3).


    The authors go into detail about how various IoT companies roll out their services
    on a common network in the context of 5G for IoT applications. The three tenants
    in the multi-tenant IoT structure of Figure 2.4 represent different IoT applications:
    smart homes (Tenant 1), automated vehicles (Tenant 2), and electronic health records
    (Tenant 3). Communication between vehicles and the network infrastructure is essential
    in the context of automation cars in order to carry out a number of services,
    such as providing real-time traffic warnings, mapping, local weather updates,
    parking information, and popular news [26,27]. Due to the time-sensitive nature
    of these services, heterogeneous networks like 3GPP RANs, non-3GPP RANs, or Wireless
    Sensor Networks (WSNs) can be used to connect cars. Optimal throughput and low
    latency may also be achieved through the use of novel air interfaces (multi-radio
    access technology (RAT)) that guarantee dependable connectivity via a VCN and
    Virtual Radio Access Network (VRAN) or adjacent Home Gateways linked with RANs.
    Applications such as v-3GPP, v-non3GPP, and v-multi-RAT controllers can create
    and administer virtual local area networks (VRANs). Likewise, a Multi-Tenants
    Controller Application manages and controls the construction of a VCN to provide
    consistent and reliable services. The implementation of a controller application
    for service recovery is done to handle the possibility of service'
