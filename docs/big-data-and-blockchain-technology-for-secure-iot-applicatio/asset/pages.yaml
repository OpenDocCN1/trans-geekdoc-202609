  md: '# SDN-IoT integration with network function virtualization for improved performance


    CH N. Santhosh Kumar, Babu Pandipati, Marepalli Radha, and Gouthami Velakanti


    # 2.1 INTRODUCTION


    The IoT allows for the interconnection of many devices, resulting in vast networks
    that may function independently and anywhere. A wide variety of Internet-connected
    accessories, including computers, cellphones, home appliances, industrial systems,
    e-health gadgets, surveillance equipment, sensors for precision agriculture, and
    more, make up this interconnected landscape. Forecasts indicate that, by 2020
    [1], the number of these interconnected devices would exceed 45 billion, with
    a monetary worth surpassing USD 14 billion. There will be a need to deploy more
    network access and core devices due to the massive volumes of data generated by
    all these devices. Numerous technological obstacles exist in ensuring the seamless
    operation and integration of such massive IoT systems. Issues with data collecting
    and analysis, privacy, security, the topology of IoT nodes, communication protocols,
    edge access, and application and device heterogeneity are all part of these difficulties.
    In addition, re-establishing flows may be necessary due to dynamic topological
    changes introduced by the mobility of IoT devices [2]. An already complicated
    ecology is made much more so by the wide variety of applications. Virtualization
    and the programmability of software and hardware resources provide a practical
    way to reduce complexity, even though it may be impractical to create a single
    solution for all of these problems. Through the use of software, virtualization
    allows for the logical abstraction of a network’s underlying hardware elements.
    By decoupling control from hardware, this abstraction makes it easier to administer,
    update, and modify. New developments in virtualization have expanded its scope
    to include software integrated in hardware, which is now considered as a separate
    virtual function element [3].


    The fast growth of the Internet has made the problems of heterogeneity, scalability,
    and interoperability even more severe for conventional networks, which are notoriously
    rigid and unchanging. Network Function Virtualization (NFV) [4] and Software-Defined
    Networks (SDNs) [9] are two key virtualization techniques for communication networks
    that have evolved to tackle these difficulties. By turning the physical infrastructure'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'into a forwarding (data) plane and centralizing the control functions of routing
    devices, SDN completely changes the way networks are designed. Here, the controller
    is in charge of all policy and flow-related data, and the protocol that bridges
    the gap between the control and data planes is OpenFlow (OF) [5]. There are alternative
    ways that provide comparable functionality; these are cited in Refs. [6,7]. The
    ability to enforce configurations, regulations, and flows across the whole network
    is the main benefit of SDN. In addition to these benefits, SDN also allows for
    vendor independence, virtualization of network slices, improved security, and
    optimization of resource utilization. Conversely, NFV entails moving traditionally
    hardware-based tasks (such as firewall, load balancing, and path computation)
    to a software-based cloud. By moving away from specialized physical hardware and
    towards a more versatile virtualized environment, this approach improves flexibility
    and adaptability.


    SDN and NFV are two examples of new technologies being investigated for their
    potential to provide useful answers in this quest. In instance, SDN has attracted
    a lot of interest from academics and shown good results in data centre networks,
    where optimizing network and IT resources together is a main goal. The use of
    SDN by Google to manage the connections between its many data centres is a prime
    example [8]. A new paradigm in networking, SDN overcomes the shortcomings of conventional
    networks. It separates the control logic of a network from the forwarding plane,
    which was formerly tightly coupled. A network operating system or logically centralized
    controller realizes the control plane, which streamlines evolution, configuration,
    and policy enforcement [9]. NFV provides a new way to programme the network, allowing
    the operator to automate the management of data plane devices and optimize the
    use of network resources. Consequently, this improves the network’s performance
    in terms of data handling, control, and management [10].


    A theoretical network design known as NFV uses software running on commercially
    accessible, off-the-shelf servers to substitute dedicated network equipment like
    switches, routers, and firewalls. Saving energy, optimizing load, and making networks
    more scalable are all advantages of this method. One or more virtual machines
    (VMs) running various applications and processes spanning storage, network servers,
    switches, or even the cloud computing infrastructure make up the NFV architecture
    shown in Figure 2.2. As a result, specialized hardware appliances for certain
    network tasks are no longer necessary. SDN and NFV are complementary technologies.
    As a component of SDN, NFV virtualizes the SDN controller, making cloud deployment
    possible and allowing for dynamic controller movement to best-fit locations. By
    contrast, SDN enables NFV by providing customizable network connectivity across
    NFVs, leading to improved traffic engineering. Despite their shared interests,
    NFV and SDN do not share a common architecture since they are products of separate
    standard organizations. There are a number of proposed SDN designs for the Internet'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'of Things (IoT), but not all of them include a virtualized approach. Some examples
    include software-defined wireless network (SDWN), Sensor OF, software-defined
    networking wireless sensor network (SDN-WISE), and SDWN [11]. An early attempt
    to connect SDN, NFV, and the IoT is this work. IoT devices can share network resources
    in an effective and dependable manner after this integrated method is implemented.
    This paper presents an easy-to-understand SDN-IoT architecture that uses NFV to
    solve the scalability and mobility problems that plague the IoT. Improving network
    agility and efficiency for IoT applications is the desired result.


    Processing, correlating, and analysing raw data acquired from varied devices,
    including sensors, are crucial in IoT settings. Unfortunately, these procedures
    need to be carried out externally because these devices have limited resources.
    For this reason, it is essential to combine AI with superior analytical capabilities
    in order to learn anything from the massive amounts of data sent by IoT devices.
    Cloud of Things and Everything as a Service are two unique applications that arise
    from this strategy [12]. One of the biggest obstacles in this situation is making
    sure the services are good. SDN and NFV are critical to the upkeep of service-level
    agreements (SLAs) from a Quality-of-Service (QoS) standpoint. Their adaptability
    allows for the control and introduction of new network features or sensors in
    reaction to declining QoS levels or customer demands for supplementary services.
    Both the service’s QoS and the end users’ Quality of Experience (QoE) are improved
    by this. Cuts to operating and capital expenditures (OPEX and CAPEX) will have
    a multiplicative effect on the service and telecom industries [13].


    In this research, we present an IoT design that uses NFV and SDN to solve and
    show proofs of concept for QoS problems in these kinds of scenarios. The document
    is structured into four sections, beginning with the current introduction. Section
    2.2 outlines the related work. The subsequent section, Section 2.3, presents the
    methodology. Section 2.4 presents the results and discussion. The chapter concludes
    with Section 2.5.


    # 2.2 RELATED WORK


    SDN-based architectures for horizontal IoT services have been presented in studies
    [14,15] in order to deal with the different protocols that connect sensing and
    network domains. These designs make use of a gateway, which is an OF-based switch,
    to allow for the sending and receiving of instructions across many protocols.
    Converting protocols between the two domains is the major function of the gateway.
    Using a software-defined data plane, another study [16] suggested a method to
    connect two sensing domains. Here, the data plane plays the role of a bridge depending
    on the situation, allowing the SDN model to grow to include Layer 7 packet manipulation
    capabilities via the extension of programming functions inside the OF standard.
    Deploying these techniques in large-scale network setups is'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'problematic since they demand more computer resources and memory at the gateways,
    despite their promise. Figures 2.1 and 2.2 describe the SDN network and interconnection
    of IoT devices.


