  md: '# 11.3.2 Problem formulation


    The TS problem in CFC aims to efficiently allocate computational resources to
    execute a set of tasks while minimizing response time, maximizing resource utilization,
    and meeting task deadlines. Formally, let T represent the set of tasks to be scheduled,
    where each task t_i is characterized by its computational requirements C_i, deadline
    D_i, priority P_i, and sensitivity to delay. Additionally, let F denote the set
    of fog nodes and C represent the set of cloud data centers available in the system.
    The objective is to assign each task to a suitable computing resource (either
    fog node or cloud data center) and determine the optimal scheduling strategy to
    minimize overall response time and maximize resource utilization, while ensuring
    that all task deadlines are met.


    The time complexity of the HSMAO algorithm mainly depends on the number of iterations
    required to converge to an optimal solution. Typically, the time complexity of
    HSMAO can be expressed as O(N·M), where N represents the population size and M
    denotes the maximum number of iterations. Additionally, the complexity of individual
    operations within HSMAO, such as evaluating the fitness function and updating
    solution vectors, may vary depending on the specific implementation details.


    In the hybrid approach combining HS and Mexican Axolotl Optimization (MAO), the
    time complexity is influenced by the iterations performed by each algorithm and
    the interactions between them. Assuming N_HS and N_MAO as the population sizes
    for HS and MAO, respectively, and M_HS and M_MAO as the maximum number of iterations
    for each algorithm, the overall time complexity can be expressed as shown below.
    Additionally, the computational overhead incurred by the interaction between HS
    and MAO should also be considered in the time complexity analysis.


    O((N_HS + N_MAO)·(M_HS + M_MAO)) (11.4)


    # 11.3.2.1 Objective function


    The objective function for TS in CFC using the HSMAO algorithm aims to minimize
    overall response time while maximizing resource utilization and meeting task deadlines.
    Mathematically, the objective function f can be defined as follows:


    f = Σ_{i=1}^{n} ( w_1·R_i + w_2·U_i + w_3·E_i + w_4·(1 - D_i/C_i) ) (11.5)


    where


    +   - n is the total number of tasks.

    +   - R_i represents the response time of task i, which is the time taken for
    the task to be completed.'
