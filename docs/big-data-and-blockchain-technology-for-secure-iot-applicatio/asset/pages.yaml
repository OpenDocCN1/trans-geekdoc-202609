- pgno: 124
  md: 'The primary goal of clustering is to recognize both similar and dissimilar
    characteristics or patterns within the provided data. Similar points are determined
    using similarity functions. Subsequent to the clustering process, class labels
    are assigned to the clusters, a step referred to as classification. The clustering
    process takes input from various data sources and yields the output as clustered
    data. Clustering is widely applied in diverse applications such as pattern recognition,
    image processing and analysis, document categorization, stock market segmentation,
    exploratory data analysis, World Wide Web, metrology, healthcare, and social network
    analysis.


    # 7.3 THE NEW BLOCKCHAIN ARCHITECTURE FOR HPC


    A typical HPC system is depicted in Figure 7.3 as a whole, together with our proposed
    distributed in-memory ledger. While we have shown compute nodes without discs,
    certain bespoke HPC systems may really have node-local discs, so keep that in
    mind. As an example, the burst buffer is a local Solid State Drive (SSD) storage
    system used by the top-ten supercomputer Cori [33] at Lawrence Berkeley National
    Laboratory. Since burst buffers are more suited to short-term data caching than
    long-term archival, they are not a good fit for ledger applications. In line with
    the non-time-sharing character of scientific applications, they are usually purged
    after job execution for performance and security concerns. We suggest a secondary
    ledger and validator on remote storage to address the transient nature of ledger
    persistence on local storage. Our proposed system’s three main components—a distributed
    in-memory ledger, persistence protocols, and a distant persistent ledger—are depicted
    in the image. What follows is a discussion of each module in further depth.


    At its core, the first module is about deploying a distributed ledger across computing
    nodes that is optimized for high-performance interconnects like InfiniBand and
    protocols like Remote Direct Memory Access (RDMA). The goal is to improve communication-intensive
    consensus methods, namely PBFT [34], by using high-performance hardware. Hyperledger
    [13] and other permissioned blockchains use PBFT to ensure that only verified
    users can access the network. This sets it apart from permissionless blockchain
    systems like Ethereum [14], which are accessible to everybody, and is especially
    important in the HPC setting for scientific applications due to the strict authentication
    mechanisms that are in place. Diskless computing nodes and distant persistent
    storage synchronization is the focus of the second module. Data validity is strengthened
    by the persistent ledger kept in remote storage, and data reliability is enhanced
    as a result of this synchronization. The main obstacle is figuring out how to
    export the ledger from memory to the remote parallel file system. Persisting after
    each transaction is not practicable because it would cause a performance bottleneck'
