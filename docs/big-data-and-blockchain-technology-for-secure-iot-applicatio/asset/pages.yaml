    allocates tasks based on their characteristics and system constraints, achieving
    higher levels of resource utilization, lower response times, and reduced energy
    consumption compared to other algorithms. The results underscore the significance
    of HSMAO in enhancing the efficiency, performance, and sustainability of CFC systems.
    Moving forward, further research can explore additional optimization objectives,
    scalability considerations, and real-world deployments to fully harness the potential
    of HSMAO in addressing the evolving challenges of TS in CFC environments.


