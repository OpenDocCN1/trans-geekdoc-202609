  md: '# DeepShield


    A deep learning approach for robust fraud detection in credit financial transactions


    *Mulagundla Sridevi, Gouthami Velakanti, B. Deevena Raju, and Sadda Bharath Reddy*


    # 8.1 INTRODUCTION


    Financial statements are prepared by accounting and finance departments and then
    examined by regulatory agencies like SEBI and RBI to make sure they are authentic.
    A nation''s economic prosperity is dependent on the stability of its businesses
    and the security of its investors'' money. The financial situation, investments,
    obligations, interest paid, and interest earned can all be found in the financial
    statements. A company''s financial health is a true reflection of how its assets
    and liabilities have grown over time. These declarations are used by companies
    to get additional loans or investments. Rating agencies use them to assign credit
    scores, and investors use them to make educated investment decisions. Governments
    or third parties utilize the statements to recognize exceptional performance with
    prizes, while creditors use them to approve or recoup debts.


    It is possible for corporations to falsify financial statements in order to increase
    their attractiveness to potential investors, lenders, or award givers, because
    these statements are used by outside parties to evaluate a company''s financial
    health. It is crucial to confirm the legitimacy of financial statements before
    to making judgments, as fraud is becoming more common in emerging economies. An
    option for confirmation is to use a machine learning (ML) model, which can be
    a cataloging model trained on tagged financial records. Credible or dishonest
    are some of the terms used by professional auditors to classify statements.


    These ML models play a crucial role in categorizing financial information within
    the context of digital transitions within enterprises. Not only do they reveal
    whether fraud is present, but they also provide an explanation for why some assertions
    are deemed false. When conducting manual audits, it is critical for auditors to
    have a firm grasp on the main causes of fraud. Although the steps for creating
    a classification model or extracting key components are same, it is common practice
    to use an additional method, such SHAP, to determine which factors are crucial.
    Several algorithms have'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'been investigated in the past for the purpose of detecting financial statement
    fraud. Classification methods like as logistic regression (LR), xgboost, adaboost,
    and neural networks (NNs) are commonly employed; the models are selected according
    to the dataset’s characteristics and the level of accuracy needed. But not every
    algorithm can be explained. Black box models, such as NNs, xgboost, or adaboost,
    produce reliable classifications but do not reveal what criteria were used to
    arrive at that designation. So, ‘black box’ is a common name for these types of
    models.


    Successful alternative methods for accurate categorization include support vectors
    [4,5,6] and Zipf’s law [7]. NNs and belief networks [8], NNs using the backpropagation
    algorithm [9], NNs for risk assessment [10], preprocessing methods for data preparation
