    # 8.4.1 European card data


    This dataset covers two days of transaction data for European cardholders in September
    2013. It was retrieved from Kaggle and sourced from the Machine Learning Group
    of Université Libre de Bruxelles. With 31 characteristics and 284,807 examples,
    it is quite extensive. Out of all the samples, just 492 have been found to be
    instances of fraud, which is <0.172% of the total dataset. With the exception
    of ‘Time’ and ‘Amount’, all characteristics in the dataset have been transformed
    using PCA in order to preserve client privacy and safeguard the sensitive nature
    of transaction details. ‘Time’ shows the entire length of time that has passed
    since the first dataset sample, in seconds, and ‘length’ shows the total amount
    of money that has changed hands. The electricity consumption dataset of Uruguay
    (ECD) dataset is used in this investigation.


    # 8.4.2 Small card data


    This 3,075-sample dataset with 12 characteristics was sourced from Kaggle and
    is on the smaller side. There are numerical features and categorical features
    split evenly. Out of a total of 3,075 samples, 448 (or 14.6%) were found to be
    instances of fraud. Dataset features include merchant ID, date of transaction,
    average daily transaction amount, amount declined, number of declines per day,
    foreign transaction status, high-risk country status, average daily chargeback
    amount, average 6-month chargeback amount, frequency of 6-month chargebacks, and
    fraudulent status. We call this dataset SCD since its rows and columns are quite
