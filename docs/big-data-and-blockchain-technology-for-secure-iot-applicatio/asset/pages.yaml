  md: '# Table 1.1 Detailed analysis of existing works in cloud-fog environment


    | Ref. no. | Technique name | Parameters used | Contributions | Limitations |

    |---|---|---|---|---|

    | [9] | Dynamic self-organizing map (DSOM) | Makespan, response time, Dol | Effectively
    streamlines task scheduling (TS) within cloud-fog environments by emulating the
    brood parasitism behavior observed in cuckoo birds | May converge to local optima
    due to the stochastic nature of the algorithm; parameter tuning can be non-trivial,
    requiring careful adjustment for different problem instances |

    | [10] | Ant colony optimization for time series (ACOTS) | Makespan, average waiting
    time | Exhibits exceptional performance by significantly decreasing task completion
    time and enhancing resource utilization when contrasted with conventional scheduling
    methodologies | Vulnerable to premature convergence, especially when dealing with
    complex scheduling scenarios with dynamic workload variations |

    | [11] | Particle swarm optimization-based bullet (PSO-based BULLET) | Cost of
    execution, time duration, and energy expenditure, in addition to other quality
    of service (QoS) | Successfully strikes a harmonious balance between energy consumption
    and task completion time, catering to the unique demands of cloud-fog environments
    | May encounter challenges related to scalability when addressing extensive TS
    scenarios characterized by a multitude of tasks and resources; demands meticulous
    calibration of population size to avert premature convergence and ensure optimal
    performance |

    | [12] | Modified ant colony optimization (MACO) | Makespan and degree of imbalance
    | Significantly improves the overall system performance by optimizing task allocation
    and resource provisioning in fog computing environments | Lack of robustness in
    handling noisy and dynamic environments, where task arrival rates and resource
    availability may fluctuate rapidly |

    | [13] | Modified grey wolf optimizer (MGWO) | Makespan, energy consumption |
    Achieves near-optimal TS solutions by effectively exploring the solution space
    and exploiting promising regions | Limited by the absence of a mechanism to adaptively
    adjust algorithm parameters based on problem characteristics and environmental
    changes |'
