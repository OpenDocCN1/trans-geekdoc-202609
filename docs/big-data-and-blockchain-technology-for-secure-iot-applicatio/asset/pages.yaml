    enhances system performance and meets the desired quality of service objectives.


    # 11.3.2.2 Resource utilization


    Resource utilization, U_i, is mathematically defined as the ratio of the computational
    requirement of task i, denoted by C_i, to the total available computational resource
    of the allocated computing resource, represented as C_total.


    $U_i = \frac{C_i}{C_{total}}$ (11.6)


    The above equation quantifies the proportion of the allocated computational resource
    utilized by task i. This ratio serves as a measure of how efficiently the computing
    resource is being utilized for task execution. A resource utilization value close
    to 1 indicates optimal utilization, where the task fully consumes the allocated
    resource, while a value closer to 0 suggests underutilization. Efficient resource
    utilization is crucial for maximizing system performance and ensuring effective
    allocation of computing resources in CFC environments.


    # 11.3.2.3 Energy consumption


    The mathematical equation for energy consumption, E_i, in CFC can be expressed
    as the product of the power consumption rate of the computing resource allocated
    to task i and the execution time of the task.


    $E_i = P_i \times T_i$ (11.7)


    where P_i represents the power consumption rate and T_i denotes the execution
    time of task i. This equation quantifies the energy consumed by'
