- pgno: 38
  md: 'There have been a number of recent proposals to tackle the problem of installing
    large software packages on IoT gateways. As an example, a study [17] proposed
    using Docker containers to build gateway services in massive networks. In order
    to manage software-defined IoT systems, other research, including [18,19], included
    agents on gateways. Automating push and pull provisioning on gateways was the
    primary focus of research [20], which centred on software creation and packaging
    on the server side. When it comes to deployment, setup, and maintenance, managing
    IoT gateways gets more complicated as the volume of IoT networks increases.


    To address this, VNFs, or Virtual Network Functions, are built using SDN and NFV.
    These VNFs are then saved as images or containers within VMs. Because of this,
    NFV orchestration may produce, activate, or change the status of specific instances
    or services operating on IoT gateways with ease. To build an IoT infrastructure
    that can deploy different network functionalities on IoT gateways, it is considered
    as a feasible and resilient option to combine NFV orchestrations with SDN controllers
    and cloud software development. Data storage, processing, and transmission technologies
    that reduce the quantity of data delivered to the core are imperative, given the
    large surge in IoT traffic across networks [21]. An important step forwards in
    IoT infrastructure is the use of SDN/NFV and platform-specific virtualization
    (P4-based) switches on IoT gateways. This allows for benefits including fabric
    end-to-end (E2E) connectivity, dynamic scaling, and data pre-processing at the
    gateways. In addition, studies in Refs. [22,23] explored the technical relationships
    between the development of the IoT, Big Data Analytics (Big Data), Cloud Computing
    (Cloud), and SDN in the future 5G era. According to these research, 5G networks
    can handle the varied needs of IoT applications and transport the massive volumes
    of data produced by them more quickly and cheaply than previous generations. Data
    processing and storage can be accomplished through the use of cloud computing
    and Big Data, and SDN/NFV can set up a scalable network for optimal transfer of
    big data. In order to streamline the process of setting up instances for every
    gateway, NFV plays a vital role. The goal of these 5G designs is to facilitate
    the smooth incorporation of these technologies into IoT networks and applications,
    thereby accelerating their development. In a large-scale IoT ecosystem, one use
    case is the offloading of IoT gateway services.


    # 2.3 METHODOLOGY


    In the context of Full-SDMN (Software-Defined Mobile Middleware) architecture,
    the collaboration between NFV orchestration, Full-SDMN orchestration, and SDN
    controller plays a vital role in ensuring that the following are met: for network
    providers, Full-SDMN orchestration means coming up with new service policies that
    let them monitor and regulate things like security, IoT apps, mobile virtual network
    operators (MVNOs), and content delivery networks (CDNs). Virtual core networks
    (VCNs) are created by'
