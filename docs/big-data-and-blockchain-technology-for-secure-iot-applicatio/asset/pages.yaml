- pgno: 53
  md: 'to be implemented. Improved DIS efficiency and dependability are results of
    this decentralized deployment. We make a number of assumptions to address concerns
    regarding the efficiency and security of the blockchain system, which have a major
    influence on our solution. The first presumption is that, since every node is
    in it for themselves, a 51% attack [31] is very unlikely to succeed. Consider
    the Bitcoin blockchain as an example; a hostile actor would be less likely to
    launch a 51% attack and more likely to engage in mining. The second premise is
    that reaching a consensus on a blockchain does not take long. Current blockchain
    consensus periods may be longer (16–18 seconds per block) or even fail under poor
    network conditions; however, Ethereum’s blockchain is expected to enable consensus
    within an average length of 12.6 seconds. However, improvements in network and
    consensus algorithms may one day allow for the implementation of a consistently
    short time consensus.


    # 3.3.1 Blockchain


    Blockchain technology is the backbone of our proposed DIS, or Data Integrity Service.
    When the blockchain is first being set up, it is necessary for DOAs and DCAs to
    both join the network. This is the first step in creating a key pair, the public
    key of which will represent the node’s blockchain account. In order to complete
    a transaction, the account must have enough gas, and the secret key is required
    to access the account. Assumption: The blockchain system can continue to function
    with a sufficient number of nodes ready to act as miners.


    We implement a pay-per-transaction approach for the DIS by integrating blockchain
    into our platform. Only when the DOA needs to communicate with the smart contract
    does gas get used up. We found that this method greatly improved the DIS’s flexibility
    when compared to our previous study, which used the cloud Information Management
    System (IMS) model [32]. Due to processing limits, DOAs may find it superfluous
    and tough to obtain gas by acting as miners. Thus, in our model, CSPs can continue
    to make money by acting as blockchain miners and earning gas, so there is no loss
    of profit for them. Soon, CSPs will be able to transact with DOAs using the gas
    they have earned. Then, DOAs can use their data to barter with DCAs for gas or
    incentives. DCAs can evaluate their hardware capabilities and financial situation
    to determine if they want to participate as miners.


    # 3.3.2 Data Integrity Service (DIS)


    A smart contract is used to implement the DIS. Before data can be securely stored
    in the blockchain by means of a smart contract, it must first be encrypted locally.
    All on-chain transactions involving the smart contract may be transparently audited
    because each party’s account is used to engage with it. A node’s blockchain data
    is synchronized with the entire blockchain'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'network once the blockchain service (BS) is begun. When DOAs utilize the smart
    contract to insert data into the blockchain, the data does not become valid and
    available to other nodes until the blockchain reaches consensus. Read operations
    from the blockchain by DCAs via the smart contract, however, are lightning fast
    since DCAs are effectively reading data from their locally synced datasets. In
    comparison to the cloud-based IMS that was suggested in our earlier study, this
    feature makes our DIS more efficient [11]. DIS accessibility and flexibility are
    guaranteed with the deployment of the smart contract, which allows participants
    to engage with it at any moment. The only person or entity authorized to cancel
    or alter the DIS on the blockchain is the author. It is accessible at all times
    so long as the blockchain is running. The process of shutting down the blockchain
    system is made more complicated because, unlike services hosted by centralized
    providers, all participating nodes must stop providing BSs. Our proposed blockchain-based
    DIS outperforms the cloud-based IMS [11] in terms of efficiency and assurance.


    **Cloud Storage Service:** Every major cloud computing service provider, including
    Amazon S3, IBM BlueMix, Microsoft Azure, and Digital Ocean, offers data storage
    services. These services are designed to cater to clients’ economic capacities
    and application needs, providing flexible cloud storage solutions. In our framework,
    the CSS serves as a versatile data storage solution for DOs. Simultaneously, the
    Peer-to-Peer file system (P2PFS) facilitates data sharing between DOs and data
    consumers.


    # 3.4 RESULTS AND DISCUSSION


    The implementation of the proposed system is described in detail in this section.
    Our model is based on the proposed service framework, which is shown in Figure
    3.3 for its complex structure. DOAs are compatible with both desktop computers
    and mobile devices connected to the Internet. Tasks such as data generation, uploading
    to CSS, hash generation, encryption of the resulting hash, and writing to the
    Data Integrity Service on the Blockchain (DISSC) are responsibilities of the devices’
    DOAs. At the same time, data integrity verification is done using DOAs on PCs.
    Desktop and cloud-based DCAs are required to be able to execute the P2PFS and
    the BS. BSs are definitely within the capabilities of modern PCs. We talk about
    single-board computers with General Purpose Inputs/Outputs (GPIOs) when we talk
    about IoT devices that gather data from sensors. Such features are included in
    many modern single-board computers. One example is the Raspberry Pi. Before sending
    data blocks to the CSS, IoT devices can process them directly from sensors. Ethereum
    is the most developed blockchain platform that currently supports smart contracts,
    hence it is used to create the blockchain system. One effort to transfer files
    in a manner similar to HyperText Transfer Protocol (HTTP) is IPFS (Inter-Planetary
    File System), which is used to implement the distributed'
