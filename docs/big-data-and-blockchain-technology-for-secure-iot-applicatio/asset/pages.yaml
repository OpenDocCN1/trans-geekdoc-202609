    # 7.2.1 Applications of blockchain


    Blockchain, renowned for its safety and security attributes, finds extensive applications
    across various domains. Its versatile applications include cryptocurrency, healthcare,
    supply chains, smart contracts, advertising, financial services, IoT (Internet
    of Things), asset management, music, financial markets, voting, banking, cybersecurity,
    copyright and royalties, government, facilitating international payments, weapons
    tracking, cost reductions, digital currency, financial management, identity management,
    and land registration.


    # 7.2.2 Overview of clustering algorithms


    In the contemporary era, the clustering technique in data analysis is widely employed
    to address the emerging challenges associated with big data. This analytical approach
    involves partitioning a dataset into two subsets, where one subset comprises similar
    instances and the other encompasses dissimilar instances [3]. Various clustering
    methods are utilized for this partitioning process, including bi-clustering, density-based,
    graph-based, grid-based, hard clustering, hierarchical, model-based, partitioning,
    and soft clustering. The primary objective of clustering is to group data points
    into clusters based on their similarities, distinguishing one cluster from another.
    This process involves organizing similar points into one cluster and segregating
    other data points into separate groups. The sequential stages of clustering are
    visually represented in Figure 7.5.


    ![](img/6bf6d18cae16ff5abc8a617b617c781f_123_0.png)


    Figure 7.5 Clustering stages.'
