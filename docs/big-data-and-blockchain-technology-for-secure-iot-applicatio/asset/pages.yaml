    In the context of the e-healthcare scenario, a diverse array of intelligent devices,
    including smart sensors and actuators such as heartbeat sensors, body sensors,
    blood pressure devices, and wearable smart medical sensors, generate substantial
    amounts of data. This data encompasses information from sensors in WSNs like 6LoWPAN,
    ZigBee, non-3GPP RANs such as Wi-Fi, LoRa WAN, Bluetooth Low Energy, as well as
    personal patient data, health conditions, and medical treatment histories [28].
    Consequently, the e-health network is required to possess capabilities for effective
    communication, perception, data processing, analysis, and the conversion of physical
    data into tangible effects [9]. Improving healthcare services while decreasing
    healthcare expenses is the ultimate aim. The next scenario is the smart home,
    where, like e-healthcare, the IoT is being used to seamlessly integrate smart
    sensors into smart home surroundings. The ultimate goal of this integration is
    to make home users’ lives easier by better monitoring and coordinating the living
    space [29,30]. Central air conditioning, lighting, curtains, and heating systems,
    as well as other multimedia systems like video intercoms, background music, and
    smart appliances, all incorporate smart sensors. Home GWs allow these devices
    to connect to remote services, interact over the IoT, and intelligently control
    other physical devices for things like security, entertainment, energy saving,
    and safety. As gateways, home GWs are vital in the smart home environment, sending
    packets to their final destinations and separating services.


    # 2.4 RESULTS AND DISCUSSION


    The simulation findings centre on the behaviour of the Infrastructure and Control
    and Virtualization Layers to show that the suggested framework is feasible. Mininet
    emulations were used for this purpose [31]. The research community has mostly
    embraced Mininet as the SDN emulation. Virtual hosts, OF switches, and links are
    all components of Mininet, which employs python scripts to mimic user-defined
    network topologies. There is a direct correlation between the capacity of the
    underlying host system and the emulation performance in real-time applications.
    Using small-scale topologies ensures accurate results and memory/CPU separation
    in this situation. A virtual computer running Linux Ubuntu 16.04 is used to replicate
    the topology on an Acer Swift 3 server (Intel i7, 2.7 GHz, 8 GB). Here, the topology
    depicted uses core, aggregation, and edge OpenFlow-enabled'
