    # 8.3.2 Long short-term memory network


    Long short-term memory, often known as LSTM, is classified as a type of NN known
    as Recurrent Neural Networks (RNNs). Long short-term memory, often known as LSTM,
    is classified as a type of NN known as Recurrent Neural Networks (RNNs) is designed
    as memory-enabled NNs, as opposed to regular NNs, which are unable to remember
    past data and need to retrain for each new task. The vanishing gradient problem,
    however, makes short-term memory a common challenge for RNNs. Put simply, during
    backpropagation, the gradient decreases as it travels backward in the network,
    resulting in minimal modifications to the weights. This means that RNNs can only
    store short-term information, as the earlier layers of the network do not learn
    much and cannot recall early examples in long sequences. LSTM networks overcome
    RNNs’ short-term memory problem by including a network memory (cell state) that
    is passed across each step. The forget gate, input gate, and output gate are the
    essential components that are linked to each phase. Each gate in the process has
    a specific function: the forget gate selects data to be retained from the previous
    phase, the input gate selects data to be added from the current step, and the
    output gate selects the concealed state for the next step (Table 8.1).


