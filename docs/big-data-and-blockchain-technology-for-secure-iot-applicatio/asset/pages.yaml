  md: '# HSMAO


    Efficient resource allocation in cloud-fog Internet of Things (IoT) networks using
    metaheuristic scheduling algorithm


    Santhosh Kumar Medishetti, VNLN Murthy, Ruqqaiya Begum, and Ganesh Reddy Karri


    # 11.1 INTRODUCTION


    Cloud-Fog Computing (CFC) has revolutionized the landscape of distributed computing
    by offering a flexible and scalable infrastructure for hosting diverse applications
    and services [1]. This paradigm leverages both centralized cloud data centers
    and distributed fog nodes located closer to end-users to efficiently process and
    manage computing tasks. Task Scheduling (TS) plays a pivotal role in optimizing
    resource utilization, minimizing latency, and enhancing overall system performance
    in CFC environments.


    Traditional TS approaches often face challenges in dynamically allocating resources
    to meet the varying demands of applications and users. The inherent complexity,
    heterogeneity, and dynamic nature of CFC environments require innovative optimization
    techniques to achieve efficient TS [2]. In recent years, metaheuristic optimization
    algorithms have garnered significant attention due to their ability to efficiently
    search large solution spaces and adapt to changing environmental conditions.


    In this context, this research focuses on proposing a novel approach for TS in
    CFC environments utilizing the Harmony Search Mexican Axolotl Optimization (HSMAO)
    algorithm. Inspired by the harmonious behavior of Mexican axolotls in their natural
    habitat, HSMAO aims to strike a balance between exploration and exploitation to
    effectively optimize TS in dynamic and heterogeneous computing environments [3].


    The unique characteristics of HSMAO make it well-suited for addressing the challenges
    associated with TS in CFC [4]. By dynamically adapting to changing workload conditions
    and resource availability, HSMAO seeks to optimize resource allocation, minimize
    response time, and reduce energy consumption in CFC environments [5].


    In this chapter, we present a comprehensive investigation of the proposed HSMAO
    algorithm for TS in CFC environments. We evaluate its'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'performance against state-of-the-art scheduling algorithms using various performance
    metrics and workload scenarios. The results obtained demonstrate the effectiveness
    and robustness of HSMAO in optimizing TS, thereby contributing to the advancement
    of resource allocation strategies in CFC. The contribution of this study is as
    follows:


    +   - A novel optimization approach HSMAO introduces a unique blend of harmony
    search (HS) and Mexican axolotl-inspired principles for CFC TS, addressing resource
    allocation challenges in dynamic environments.

    +   - HSMAO optimizes resource allocation, minimizing response time and energy
    consumption in CFC systems by dynamically adapting to workload changes.

    +   - This study evaluates HSMAO against state-of-the-art algorithms, showcasing
    its effectiveness and providing insights for designing efficient resource allocation
    in dynamic computing environments.


    The outline of chapter will begin with an introduction, providing an overview
    of TS in CFC and introducing the HSMAO algorithm. Section 11.2, Related Work,
    will follow, reviewing existing research on TS in CFC environments. Section 11.3,
    Research Methods, will detail the design and implementation of HSMAO. Section
    11.4, Results, will then be presented, showcasing the performance of HSMAO compared
    to existing algorithms. Finally, Section 11.5, Conclusion, will summarize the
    findings, discuss implications, and outline future research directions.


    # 11.2 RELATED WORK


    Table 11.1 literature survey conducted for TS in CFC using the HSMAO algorithm
    provides a comprehensive overview of existing research in this domain. The survey
