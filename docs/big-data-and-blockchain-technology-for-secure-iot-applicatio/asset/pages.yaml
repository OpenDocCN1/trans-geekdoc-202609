  md: '![](img/6bf6d18cae16ff5abc8a617b617c781f_56_0.png)


    Figure 3.4 Duration required for the retrieval of data blocks.


    outlines the time spent retrieving data blocks of different sizes in the CSS-N
    model. The test results demonstrate that our proposed framework can effectively
    support the integrity verification of data blocks by multiple DOAs or DCAs.


    # 3.5 CONCLUSION


    Cloud data security revolves around three fundamental aspects: confidentiality,
    integrity, and availability, commonly known as CIA. In our earlier research, we
    introduced the concept of Data Integrity as a Service to address concerns related
    to data integrity in CSSs. A notable drawback of existing techniques is the reliance
    on a trusted third-party authority for completing data integrity verification
    tasks. However, this assumption may not always hold true, leading to potentially
    untrustworthy results in data integrity verification. This paper introduces efforts
    to implement a blockchain-based DIS, providing several advantages over previous
    works. It enhances reliability, as the service cannot be terminated by a single
    cloud party. The efficiency of data integrity verification improves with an increasing
    number of clients. The proposed framework supports the trading of data with data
    consumers and implements a pay-per-transaction model for DIS.'
