- pgno: 85
  md: 'needs to be stored and accessed on the healthcare cloud server. The hospital
    is responsible for overseeing the enrollment of mobile devices and operating the
    healthcare cloud server. The healthcare cloud server functions as the overseer
    of E-healthcare data, providing various services including data storage, uploading,
    and downloading. E-healthcare data in this system are a valuable resource for
    illness management, control, scientific research, and teaching. This has garnered
    increasing attention [3]. Data sharing has become an essential structural element
    in this setting, enabling real-time data interaction between medical professionals
    and patients, as well as providing real-time monitoring. The implementation of
    security measures for data sharing is crucial in order to prevent unauthorized
    user access and safeguard the data in the MHN. The ABE public key cryptosystem
    offers meticulous control over ciphertext access. The ABE system establishes a
    connection between the ciphertext and the key based on properties, allowing decryption
    only when a user’s secret key aligns with the characteristics of the ciphertext.
    In the development of Key-Policy Attribute-Based Encryption (KP-ABE), a message
    is encrypted by using characteristics such as “profession: nurse, sex: female,
    and institution: hospital A,” while keys are produced based on access regulations
    such as “profession: nurse ∧ sex: female.” Decryption of ciphertext is contingent
    upon the alignment of characteristics with the access policy. Ciphertext-policy
    attribute-based encryption (CP-ABE) is a variant of KP-ABE where the ciphertext
    is linked to an access policy and the key is linked to characteristics [4].


    ABE is a valuable cryptographic technology that permits for the safe transfer
    of information to untrustworthy repositories, such as external web servers. ABE
    facilitates the efficient transmission of data provided among many stakeholders
    based on their respective roles or characteristics. Conventional encryption methods
    provide encryption from one end to another, but need individuals to supply decryption
    keys or store data in several encrypted copies with distinct keys. Neither choice
    is suitable. ABE may minimize the burden of key management in comparison to conventional
    encryption techniques. ABE offers precise access control and encryption that covers
    the whole communication process. Unscrupulous individuals may get access to encrypted
    data stored in the public repository that is not compatible with their confidential
    key. Nevertheless, in the absence of intelligible encryption keys, they are unable
    to comprehend the substance of the data. In addition, KP-ABE provides user privacy
    safeguards. In KP-ABE [5], a decryption user may access the authorized ciphertext
    even without knowledge of the encryptor. The data owner just has to identify the
    categories of users who are allowed to decode the ciphertext. Preserving the privacy
    and security of the MHN has evident advantages. When devices with limited resources
    are involved, there are certain problems that need resolution. In addition, devices
    with constrained resources include those with limited computational capabilities,
    storage capacity, and combined computing and storage capabilities, such as iPads
    and smartphones.'
