    P2PFS. Protocol II and Protocol IV data verification is made easier with the use
    of IPFS.


    In order to test the feasibility of our framework and related protocols, we have
    built a prototype system. Due to the ever-changing nature of IoT data, we assume
    that it is stored in data blocks of varying sizes, and that these blocks are combined
    to generate datasets. In most cases, you have to check the integrity of certain
    data blocks before you can guarantee the whole dataset is secure. Our current
