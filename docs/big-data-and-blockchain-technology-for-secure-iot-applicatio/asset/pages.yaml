    Figure 2.1 Software-defined network architecture for Internet of Things platform
    and integrated Internet of Things gateways.


    ![](img/6bf6d18cae16ff5abc8a617b617c781f_37_1.png)


    Figure 2.2 Interconnections among IoT components.'
