- pgno: 125
  md: 'due to the considerable I/O overhead. In the third and final module, we validate
    the distributed ledger on persistent storage. Since every compute node updates
    the ledger in volatile memory (or temporary persistent local storage that is erased
    after a job is finished), there must be an uncompromised ground truth on permanent
    persistent storage to validate ledger copies in case of disasters (like when half
    of the compute nodes crash and lose their ledgers). Keep in mind that compute
    nodes that rely just on memory are not necessarily less dependable than those
    that have permanent storage. However, if the process that was responsible for
    initiating the memory were to be killed, the data that was saved in memory would
    be lost.


    # 7.4 SYSTEM IMPLEMENTATION


    The prototype system [21] for the blockchain architecture and consensus methods
    that are being suggested will be implemented using Java. You can find the project
    webpage at https://explab.org/http://cse.unr.edu/hpdic/proj/imb, where you can
    also get the source code and other information. The prototype’s main modules are
    now available for download, and we plan to release supplementary components and
    plug-ins as soon as they pass our quality assurance tests. There are more than
    1,800 lines of code in the current codebase. Local ledgers are kept as independent
    files in the prototype’s virtualized environment, and network latency is regulated
    by a time delay that is parameterized by random statistical distributions (with
    average, variation, and seed). In order to deploy the prototype on production
    systems, we are currently working on packaging it into Docker containers.


    Our present emphasis is on the ledger and consensus, in accordance with the suggested
    system decomposition in Ref. [7], which specifies four primary components (ledger,
    consensus, cryptography, and smart contract). We use the SHA-256 hash algorithm
    [35] for the chained blocks. Application wrapping using pseudo transactions with
    dummy numerical values allows the prototype to accept multiple applications, as
    the current implementation does not support smart contracts. The ledger and consensus
    implementation are covered in detail in the following sections. The suggested
    PoR consensus relies on a consensus protocol between compute nodes, which is similar
    to traditional PoW but simplifies the computationally difficult problem found
    in Bitcoin [12]. Our system’s PoW consists of three primary components. First,
    a node stores freshly made transactions, which are then sent to other nodes and
    shared storage, until they form a block that can be mined. Second, every node
    in the network that can process data, including those with shared storage, will
    try to verify the block and add it to their local blockchain. In mining, the node
    that finds the solution adds the block to its local in-memory blockchain and gets
    the reward. If the block does not pass validation during this round, it will be
    queued up on the corresponding compute node for processing at a later time. This
    phase is in line with the'
