    # 6.5 CONCLUSION


    In particular, evaluation and prediction present formidable obstacles to the detection
    of intrusions in smart homes. New developments in blockchain technology and AI
    hold great potential for tackling these issues. Yet, it is difficult to execute
    such solutions efficiently due to the power and processing limits of devices in
    the majority of smart home configurations. This research sought to address this
    knowledge vacuum by presenting a minimally invasive approach to intrusion prediction
    and detection that makes use of a blockchain-based architecture and DELM. The
    proposed solution was evaluated using several statistical approaches; the findings
    show that the DELM method is more reliable than the others. With an impressive
    accuracy rate of 94.81%, the suggested DELM method produced outstanding results.
    Additional datasets and various architectures are being considered as part of
    the ongoing investigation into these promising results.


