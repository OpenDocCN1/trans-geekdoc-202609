- pgno: 43
  md: 'Initially, both streaming flows exhibit similar behaviour (best effort), leading
    to comparable average PSNR values. The vertical black line indicates the point
    at which the QoS-App is downloaded and configured in the Floodlight controller.
    As anticipated, after the QoS-App configuration, the switches’ behaviour is automatically
    adjusted to identify flows and assign different QoS policies. Consequently, the
    h2–h7 traffic demonstrates superior PSNR levels compared to the h1–h8 flow. In
    this context, the average PSNR for w-QoS is 26.54 dB, while the w/o-QoS stream
    averages 23.73 dB.


    A notable dip in the plot and the experiments reveal that this unexpected effect
    is primarily induced by fast-moving scenes during that period. The increased network
    load during these scenes leads to a decrease in PSNR.


    With w-QoS, the average SSIM is 0.814, whereas without w/o-QoS streaming, it is
    0.738. The results show that the controller may adjust the network’s behaviour
    and data flow balance on the fly to meet user needs.


    # 2.5 CONCLUSION


    The present work examines the benefits brought about by SDN and NFV paradigms
    in IoT environments and proposes an SDN/NFV architecture tailored for IoT networks.
    The experiment evaluates the controller’s ability to dynamically manage network
    behaviour in the context of the ITSCO 2018 – Special Session on IoT and Smart
    Communities. The test topology, based on Mininet, and the analysis of video streaming
    demonstrate that the floodlight controller has the capability to real-time modify
    the QoS/ QoE of different flows. Consequently, future research challenges involve
    finding a balance and orchestrating virtual resources in IoT environments. Additionally,
    optimizing algorithms for real-time streaming within SDN/ NFV architectures presents
    a significant challenge.


