  md: '# Securing HPC data clusters with in-memory blockchain


    # A provenance enhancement approach


    Maradana Durga Venkata Prasad and Srikanth T


    # 7.1 INTRODUCTION


    Blockchain represents a distributed storage paradigm that incorporates various
    technologies, including encryption algorithms, peer-to-peer networks, and consensus
    algorithms [1]. Recognized as a revolutionary innovation, its decentralization,
    tamper-proof information, and traceability features have made it a disruptive
    force in recent years. Despite its transformative potential, large-scale commercial
    blockchain applications demand a high-performance and scalable storage architecture,
    surpassing the capabilities of traditional public blockchain architectures [2].
    This has led to the emergence of consortium blockchains, specifically designed
    to handle extensive transactions in business scenarios, offering superior storage
    performance compared to public counterparts [3].


    However, existing consortium blockchain platforms face storage bottlenecks, primarily
    rooted in their reliance on key-value databases like LevelDB. As data volumes
    increase, this results in significant reading/writing amplification and constant
    compaction, diminishing storage efficiency and causing performance bottlenecks.
    Furthermore, key-value databases prove unsuitable for handling substantial single
    pieces of data, leading to exponential increases in storage delays as transaction
    data size grows. Efforts to enhance consortium blockchain storage performance
    have mainly focused on reducing data storage volume rather than restructuring
    the underlying architecture [4]. Approaches such as compressing node data and
    collaborative data storage aim to minimize data in blockchain nodes. However,
    excessive data reduction risks compromising the integrity of blockchain records.
    Some researchers propose distributed extensions, particularly employing distributed
    file systems, to address massive data storage challenges. Yet, these architectures
    prioritize storage extension over performance, failing to meet the efficiency
    needs of enterprise-level business scenarios requiring rapid and reliable reading/writing
    capabilities (Figure 7.1).


    Provenance systems traditionally fall into two categories: centralized and distributed.
    SPADE, a prominent centralized system, manages provenance'
