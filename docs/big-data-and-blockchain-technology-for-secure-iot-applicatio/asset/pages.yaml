    state transfer - application programming interface (REST-API). The Quality-of-Service-App
    [14] is utilized in this experiment. Two hosts, h1–h8, are linked to each edge
    switch (s4–s7). Virtual hosts create data for video streaming and stand in for
    IoT devices. Using real-time protocol over user datagram protocol (RTP/UDP), the
    virtual hosts broadcast the video file “highway cif” (Telecommunication Networks
    Group) over a VideoLAN client (VLC) server. The video’s resolution is 352×288
    and its file size is 4.23 MB. The format is highway cif.mp4, which is an MPEG4-encoded
    file. There are two thousand frames in the 66-second video. The experiment’s goal
    is to demonstrate the controller’s capability to modify the behaviour of switches
    in a way that does not interfere with the network’s regular operation. The experiment
    makes use of two streaming flows: one delivers video from h2 to h7, while the
    other sends video from h1 to h8. The first stream does not have Quality-of-Service
    certification. The two videos are sent over the network at the same time. The
    45-second streaming time is used to download and install the QoS-App on the controller.
    Afterwards, the QoS-App is set up automatically to regulate the link bandwidth
    according to the flow. Data rates of up to 2 Mbps are allowed for w-QoS streaming
    (from h2 to h7) and up to 0.4 Mbps for w/o-QoS flow (from h1 to h8). Following
    this, the received streams are saved as individual video files. According to Ref.
    [32], the Evalvid Tool, developed by the Department of Telecommunication Systems,
