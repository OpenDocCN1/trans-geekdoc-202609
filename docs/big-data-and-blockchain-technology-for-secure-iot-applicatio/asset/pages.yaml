    R. Nareshkumar, S. Umarani, Bharathi V, P. Sasikumar, and P. Uma Maheswari


    # 5.1 INTRODUCTION


    The advancement and widespread use of cyber-physical systems (CPSs) have enabled
    physical equipment to perform five key activities through the utilization of computers
    and networks. These functions include computation, communication, precise control,
    remote coordination, and autonomy [1]. Implementing a CPS will significantly enhance
    the competitiveness of key industrial sectors, including the mobile healthcare
    network (MHN). The structure of the MHN is seen in Figure 5.1. In the MHN [2],
    the mobile device is tasked with collecting data and uploading it to the healthcare
    cloud server. The patient and doctor possess a substantial amount of data that


    ![](img/6bf6d18cae16ff5abc8a617b617c781f_84_0.png)


    Figure 5.1 Data delegation [14].'
  merge: -1
