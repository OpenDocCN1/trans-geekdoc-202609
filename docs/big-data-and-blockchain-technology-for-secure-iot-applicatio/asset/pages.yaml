  md: 'tokens. We do both formal and informal security evaluations to assess the resilience
    of the proposed system against possible adversarial assaults. PR. Kumar et al.
    [15] proxy re-encryption (PRE) enables a partially trusted intermediary, equipped
    with a re-encryption key, to convert a ciphertext encrypted using one key into
    an encryption of the same message using a different key. Attribute-based proxy
    re-encryption (AB-PRE) is an extension of PRE that allows for precise control
    over access to encrypted data and the ability to delegate access rights. Nevertheless,
    conventional AB-PRE is plagued by a single point of failure due to its dependence
    on a solitary proxy for executing ciphertext changes. In order to address this
    issue, this work presents a novel concept known as attribute-based threshold proxy
    re-encryption (AB-TPRE), which employs a number of proxies (N) for the purpose
    of transformations. In AB-TPRE, the re-encryption key is divided into N shares,
    with each proxy getting one share to produce a transformed ciphertext share. The
    converted ciphertext can only be successfully constructed when a certain number
    of transformed ciphertext shares, known as the threshold (t), are combined. In
    addition, we propose the implementation of a share updatable feature to mitigate
    the security risk associated with the potential leaking of shares. This property
    enables the refreshing of re-encryption key shares.


