  md: 'as fraudulent. The nature of the solution dictates the choice of assessment
    metric. This research makes use of the confusion matrix, which classifies cases
    as either positive (fraud) or negative (non-fraud). False positives indicate non-fraud
    cases anticipated as fraud, genuine negatives imply fraud instances forecast as
    non-fraud, and true negatives indicate accurately predicted fraud cases. Take
    a look at the F1 score, accuracy, precision, and recall equations down below to
    learn more about the assessment measures.


    Accuracy = (TP + TN) / (TP + FP + TN + FN)  (8.1)


    Recall = TP / (TP + FN)  (8.2)


    Precision = TP / (TP + FP)  (8.3)


    F1Score = 2 * (Precision × Recall) / (Precision + Recall)  (8.4)


    Improvements in accuracy can be achieved by decreasing the occurrence of false
    positives, which are correlated with positive projected values. Precision is an
    appropriate indicator when the cost of false positives is substantial. The number
    of false negatives should be minimized in order to maximize recall, as it is connected
    to actual positives (Eq. 8.3). Achieving high recall is typically prioritized
    in scenarios when the cost of false negatives is large. Striking a balance between
    the two is of the utmost importance for detecting credit card fraud. A high recall,
    but poor accuracy, precision, and F1 score are the result of labeling all samples
    as fraudulent. However, if we assume that all samples are legitimate, we will
    have great accuracy but no recall, and our precision and F1 score will be unknown.
    To conduct comparisons, this research makes use of all four metrics: accuracy,
    precision, recall, and F1 score.


