    # 1.2 LITERATURE SURVEY


    The literature survey on scheduling IoT tasks in CFC environments using the CSOA
    reveals a growing interest in addressing the challenges posed by the dynamic nature
    of IoT workloads and the diverse computing resources available in cloud and fog
    architectures. Previous studies have explored various scheduling approaches, including
    traditional heuristic algorithms and meta-heuristic optimization techniques, to
    optimize resource utilization, minimize latency, and enhance QoS metrics in IoT
    deployments. However, while these methods have shown promise in specific scenarios,
    they often struggle to adapt to the dynamic and heterogeneous nature of IoT environments
    effectively.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Emerging research suggests that metaheuristic optimization algorithms, such
    as CSOA, offer a promising avenue for addressing the complexities of IoT TS. Studies
    have demonstrated the effectiveness of CSOA in solving various optimization problems
    by mimicking the brood parasitism behavior of cuckoo species, enabling efficient
    exploration of solution spaces and discovery of optimal task allocation strategies.
    By applying CSOA to IoT TS in CFC environments, researchers aim to develop a novel
    methodology capable of dynamically allocating tasks to appropriate computing resources
    based on real-time conditions and constraints. This literature survey highlights
    the need for further investigation into CSOA-based scheduling approaches and their
    potential to improve resource utilization, system performance, and scalability
    in IoT deployments.


    Table 1.1 presents a comprehensive literature survey of existing works focused
    on TS within CFC environments. Each entry in the table highlights a specific scheduling
    technique, detailing its parameters, contributions, and limitations. Various machine
    learning, bio-inspired algorithms, and optimization approaches are examined in
    terms of their applicability to TS in CFC environments. Each technique''s contribution,
    such as effectiveness in high-dimensional spaces, state-of-the-art performance
    in image classification, or suitability for sequential data modeling, is carefully
    noted alongside its limitations, such as susceptibility to overfitting, computational
    intensity, or sensitivity to parameter choice. By presenting this literature survey
    in a structured table format, the overview facilitates a comparative analysis
    of different techniques, aiding researchers in identifying suitable methodologies
    for their specific TS challenges in CFC environments.


    This literature survey underscores the diverse range of techniques employed in
    TS optimization in CFC, shedding light on their respective strengths and weaknesses.
    As CFC environments become increasingly prevalent in modern computing ecosystems,
    the need for efficient TS mechanisms grows more pressing. By examining the contributions
    and limitations of various scheduling techniques, researchers can better understand
    the landscape of existing approaches and formulate informed strategies for optimizing
    resource allocation, minimizing task completion time, and enhancing overall system
    performance in CFC environments. The insights gleaned from this literature survey
    serve as a valuable foundation for future research endeavors aimed at advancing
    the cutting edge in cloud-fog TS and addressing the evolving challenges of modern
    computing paradigms.


