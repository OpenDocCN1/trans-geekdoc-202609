  md: 'among the many linked devices in smart cities, this study incorporates enhanced
    blockchain and big data components, marking a major step forward. This study differs
    from others in that it seeks to remedy problems with data transmission, validation,
    package width range, and the decrease in information exchange between node generations.
    The methodology employed is rigorous and scientifically implemented, leading to
    a revised framework that makes the extensive findings of our study reliably predictable.
    Additionally, computational findings have undergone validation to ensure their
    accuracy.


    Blockchain, the technology underpinning Bitcoin, introduces a fully decentralized
    system, prompting subsequent endeavors to apply it in decentralizing existing
    Internet service infrastructures [10]. The blockchain system and data storage
    procedures have both benefited from the many efforts that have investigated its
    potential use for verifying the integrity of stored data since its inception.
    Retricoin [11] is one such project that aims to use Proof of Retrievability (PoR)
    instead of the energy-intensive Proof of Work (PoW) to verify data integrity and
    generate coins for big files. These methods indicate a bright future for completely
    decentralized data integrity assurance. Despite the optimistic outlook, the practicality
    of decentralized data storage with acceptable efficiency remains a challenge.
    Currently, cloud storage services are often considered, but, for data integrity
    services, exploring decentralized frameworks becomes worthwhile. This paper proposes
    a blockchain-based framework to facilitate decentralized data integrity verification
    for IoT data stored in semi-trusted cloud environments. The primary contributions
    of this paper can be succinctly outlined as follows.


    +   - The article substitutes the centralized node’s Integrity Management Service
    with a completely decentralized Data Integrity Service (DIS) based on blockchain.
    This removes the need for trust in third-party auditors (TPAs) and enhances the
    dependability of the DIS.

    +   - The document suggests protocols for verifying data integrity within a fully
    decentralized setting and presents a framework that allows both data owners (DOs)
    and data consumers to authenticate specific data without depending on any singular
    TPA.

    +   - The document illustrates the practicality of the suggested protocols and
    framework by creating a proof-of-concept demonstrator implemented on a private
    blockchain system.


    The remainder of the chapter is structured as follows: In Section 3.2, we conduct
    a review of relevant literature to offer insights into the motivation behind our
    research. Section 3.3 provides methodology. Section 3.4 outlines the results and
    discussion. The research concludes with a summary and suggestions for potential
    future research in Section 3.5.'
