  md: 'The system functions as a clustered data structure, with Secure Hash Algorithm
    (SHA)-256 (Secure Hash Algorithm) and the previous hash block authenticating each
    data block. The basic components of a block consist of the following: the block
    number, the hash of the previous block, details about transactions, a nonce, and
    timestamps. While nonces are considered random variables, timestamps are considered
    continuous variables. Nodes in the network that validate and mine data are continually
    solving cryptographic puzzles by hashing together static data (blocks) and dynamic
    data (timestamps and nonces) to produce a number with many consecutive leading
    zeroes [24]. The miners who successfully place the block into the blockchain by
    determining the right hash value are crowned champions. To ensure that a block
    is legitimate, the proof of work mechanism is employed.


    As miners in a blockchain system, every node in a smart home that is linked to
    an IoT device communicates with a memory pool. All transactions that are waiting
    to be included in the blockchain to create a new block are stored in this memory
    pool. Using a Merkle tree, transactions are validated and summarized. Then, miners
    all throughout the smart home system will be able to see the valid transactions
    that have been added to the block. To create a Hash of Block, miners tweak the
    nonce and timestamp. After that, the programme tries to check if the generated
    hash matches the target [25]. The hash is attached to the chain as soon as a miner
    produces a valid block. This procedure repeats until the hash value is greater
    than or equal to the specified threshold. The proof of work is added to the chain
    and validated for efficiency if the hash value is smaller than the target value.
