  md: 'standard PoW between compute nodes, but with a modified PoW (i.e., PoR) designed
    for the provenance of scientific data, which is then double-validated by the storage
    node’s ground truth. In the end, consensus is achieved when the block is added
    to the local blockchain by a node and stored in shared storage. After that, it
    is sent to other peers in the network for validation. Upon successful validation,
    the first node adds the block to their local blockchain and sends it out to the
    rest of the network. Then, when each node confirms the block’s legitimacy, they
    update their local blockchains.


    # 7.5 RESULTS AND DISCUSSION


    This research uses Intel Core-i7 4.2 GHz CPUs and 32 GB of 2,400 MHz DDR4 memory
    [21]. The latency of an InfiniBand network is 1 µs [36], whereas that of an Ethernet
    network is 250 µs. Two other blockchain systems and two other provenance systems
    will be compared to the proposed in-memory blockchain prototype as part of the
    evaluation. Conventional Blockchain, installed on a shared-nothing cluster linked
    by Ethernet, is the initial blockchain system. The second system is a hypothetical
    blockchain that does not use permanent storage but instead makes use of high-performance
    networking connectivity like InfiniBand or RDMA. The lack of data durability makes
    it an impractical solution, but it does set the performance upper bound for the
    in-memory blockchain that is being proposed. Java is used to implement all three
    blockchain systems, and adequate optimization efforts have been made. Both the
    database and file systems under consideration have provenance systems as built-in
    modules.


    Database provenance monitoring and querying is the main focus of SPADE [4], a
    graph database system. Built on top of the distributed file system FusionFS [38],
    FusionProv [1] is the provenance module for file-system provenance. The standards
    are structured like a bank transfer in terms of the format of the transactions.
    The system checks the submitted transaction’s legitimacy at the beginning of each
    transaction. If the request is legitimate, two nodes will have their statuses
    (balances) modified and the new information will be sent to every other node in
    the network. Our investigations show that each block can include anywhere from
    one to ten transactions, with an average of four transactions per block.


    # 7.5.1 Comparison to filesystems and databases


    In this research, we present an in-memory blockchain as a provenance tool. Two
    other tools, a distributed filesystem for HPC [38] and a relational database for
    graph processing [4], each impose their own latency overhead. With an in-memory
    blockchain, the latency is unique to the node that wins the race and adds the
    block at the end. Unlike the other two systems, this one does not experience latency
    on any of its nodes. We disperse the in-memory'
