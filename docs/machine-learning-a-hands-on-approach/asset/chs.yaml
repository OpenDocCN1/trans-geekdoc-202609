  \n# 人工神经网络\n\n| 10 || 人工神经网络 |\n| --- | --- |\n\n## 学习目标\n\n在本章结束时，你将能够：\n\n•解释基本概念并给出人工神经网络（`ANNs`）的定义\n\
  \n•描述 `ANNs` 的类型，包括前馈网络（`FNNs`）、卷积神经网络（`CNNs`）、循环神经网络（`RNNs`）、长短期记忆（`LSTM`）网络和生成对抗网络（`GANs`）\n\
  \n•阐述自编码器的结构和功能：线性、去噪、稀疏、变分和对抗\n\n•列出 `ANNs` 在图像识别、自然语言处理、自动化决策、时间序列分析、网络安全和预测分析等领域的应用\n\
  \n•提供对 `ANNs` 未来发展和潜在进步的见解\n\n## 10.1 神经网络简介\n\n在最基本的形式中，‘神经元’处理信息。神经元连接使它们之间能够交换脉冲和信息。用于处理信息的机制基于神经元连接的强度；这些连接可能强也可能弱。此外，其他神经元的传入连接会影响每个神经元的内在状态。每个神经元都有一个激活函数，其取决于当前状态并有助于预测它将发送的信号。神经网络可以被可视化为由数学过程组成的计算图。\n\
  \n神经网络包含三个层：输入层、隐藏层和输出层。输入层接收输入信息，随后通过隐藏层进行计算。最后，输出层根据输入数据提供最终预测或结论。\n\n神经网络中的每个节点对接收到的数据进行一些计算，然后将结果发送到下一层。通过利用\
  \ `gradient descent` 或其他优化技术来最小化诸如 `mean squared error` 之类的损失函数，该算法学习每个节点的权重或参数。可以将输入数据视为隐藏层的抽象图示。这些层帮助神经网络使用内部逻辑理解各种数据元素。由于神经网络的输出是数值向量，并且弥合了实际数据与网络对数据的表示之间的差距，因此我们需要一个明确的输出层。输出层可以被视为一个翻译器，有助于理解网络的逻辑并转换目标值。\n\
  \n神经网络由两个主要组成部分构成：架构和学习。架构是指神经元在网络中的排列和连接方式。根据任务和数据，有不同类型的架构：\n\n•前馈架构：神经元按层组织，连接仅从一层到下一层。网络中没有循环或反馈。这种架构适用于不需要记忆或时间信息的简单任务，例如图像识别或分类。\n\
  \n•循环架构：神经元按层组织，但某些连接在层内或层间形成循环或反馈。这种架构允许网络存储和处理顺序或时间信息，例如自然语言语音识别或生成。\n\n•卷积架构：网络有一个或多个卷积层，对输入数据应用滤波器以提取特征。这种架构特别适用于处理空间信息，例如图像或视频。\n\
  \n•单层和多层架构：单层网络只有一个神经元层，即输入或输出。这种架构简单，只能执行线性操作，例如逻辑函数或线性回归。多层架构网络在输入和输出层之间有多个隐藏层。这种架构可以捕捉数据中更复杂和非线性的模式，例如人脸识别或情感分析。\n\
  \n学习是指网络如何调整其权重和偏置以提高在给定任务上的性能。学习方法根据数据类型和反馈的可用性而不同。一些标准方法有：\n\n•监督学习：网络同时获得输入和输出数据，并通过最小化衡量实际结果与期望结果之间误差的损失函数来学习将输入映射到输出。此方法需要标记数据和预定义的目标函数，例如\
  \ `mean squared error` 或 `cross-entropy`。\n\n•无监督学习：网络仅获得输入数据，并在没有外部指导的情况下学习发现数据中的模式或结构。此方法不需要标记数据或预定义的目标函数。然而，它可能使用信息最大化或稀疏性等标准来评估学习表示的质量。\n\
  \n•强化学习：网络获得输入数据以及根据其行为或输出而给出的奖励或惩罚反馈。它通过最大化随时间的累积奖励来学习优化其行为。此方法不需要标记数据或预定义的目标函数，但需要动态环境和定义任务目标的奖励函数。\n\
  \n例如，执行手写数字识别的神经网络可能使用前馈多层架构，并基于 `backpropagation` 和 `gradient descent` 的监督学习方法。生成图像字幕的神经网络可能使用循环卷积架构，并基于\
  \ `policy gradient` 和奖励塑造的强化学习方法。\n\n## 10.2 人工神经网络简介\n\n人工神经网络（`ANNs`）是一种模仿生物神经网络（如大脑）形式和操作的计算系统。人工神经元是\
  \ `ANNs` 中发现的一组连接组件，它们处理并将信号传递给其他神经元。每个神经元都有一个非线性激活函数来定义其输出，每个连接都有一个权重来控制信号的强度。可以使用层来组织\
  \ `ANNs`，并且每层可以不同地改变输入。\n\n通过根据学习算法修改其权重以减少计划输出和实际输出之间的误差，`ANNs` 可以从数据中学习。在这种监督学习中，使用具有已知输入和输出的示例来训练网络。`ANNs`\
  \ 也能够进行无监督学习，这涉及在未标记数据中识别模式和特征。\n\n\n\n\n\n想象一下，你正在学习如何区分不同类型的水果，例如苹果和橙子。当然，苹果通常是圆形的并且是红色的，而橙子通常是圆形的并且是橙色的。然而，有时会出现变种，区分它们可能具有挑战性。现在你有一个擅长识别水果的朋友。他可以通过外观来识别它们，并告诉你它们是苹果还是橙子。所以你决定请朋友教你，以便你能向他学习。你的朋友解释说，他会评估水果的许多方面，例如它们的质地、颜色和形状。然后，根据每个属性的重要性，他会给它一个特定的权重。例如，他可以给形状赋予比颜色或质地更大的权重，因为他认为这是最关键的方面。他还说，他会将这些特征与他对苹果和橙子的理解进行对比。例如，如果一种水果是球形且红色，则它很可能是苹果。如果它呈圆形且呈橙色，则是橙子。\n\
  \n你现在想要创建一个能够自行做出这些选择的系统。`ANN`可以帮助做到这一点。`ANN`模拟我们大脑的工作方式，由称为神经元的相互连接节点构成。在这种情况下，你将创建一个`ANN`，它使用水果的特征（特性）作为输入（Table\
  \ 10.1），就像你向朋友描述水果的形状、颜色和质地一样。\n\nTable 10.1 水果的特征及其权重\n\n| S. No || Characteristic\
  \ || Weight of the characteristic || Apple || Orange |\n\n| --- | --- | --- | ---\
  \ | --- |\n\n| 1 || Color || 0.8 || Depends || Orange color |\n\n| 2 || Skin texture\
  \ || 0.9 || Smooth || Knobby |\n\n| 3 || Visible seeds in fruit || 0.7 || Yes ||\
  \ Depends |\n\n| 4 || Mean diameter of fruit || 0.2 || 7.9 cm || 7.6 cm |\n\n然后，网络的神经元会被这些特征的信息所喂养。网络中的每个神经元都有一个权重，就像你的朋友分配给属性的权重一样。网络将这些权重与输入属性集成，以确定水果是苹果还是橙子。`ANN`通过一个称为训练的过程改变这些权重，使用你提供的模型水果集。首先，它将预测与正确答案（由你提供）进行比较，以随着时间的推移提高其准确性。然后相应地修改权重。它用越来越多的实例重复此操作，直到掌握对这些水果的分类。一旦训练完成，`ANN`将使用修改后的权重来确定它以前从未见过的新水果是苹果还是橙子。因此，`ANN`相当于一个数学模型，它从实例中获取知识以做出预测或分类判断，就像你从朋友的专业知识中学会区分苹果和橙子一样。\n\
  \n`ANN`s 可用于解决各种问题，包括异常检测、降维、聚类、回归、分类等。例如，`ANN`s 可用于识别手写数字、识别疾病、预测股价、生成自然语言等。`ANN`s\
  \ 的多功能性和可扩展性以及它们表示非线性和动态交互的能力是其优点之一。它们还可以处理复杂和嘈杂的数据。\n\n另一方面，`ANN`s 的高计算成本、缺乏可解释性和可解释性，以及容易过拟合和局部最小值是一些缺点。还有一些限制如下：\n\
  \n•数据和资源需求：`ANN`s 通常需要大量标记数据才能有效训练并避免过拟合。收集和处理这些数据可能成本高昂且耗时。此外，`ANN`s 可能有数百万甚至数十亿个参数需要在训练期间更新，需要高性能硬件和软件。`ANN`s\
  \ 的复杂性和规模也使它们难以在现实场景中部署和维护。\n\n•可解释性和可解释性：`ANN`s 通常是黑盒模型，产生输出而不揭示底层逻辑或推理。这可能给理解`ANN`s\
  \ 如何做出决策、验证其正确性以及调试错误带来挑战。此外，`ANN`s 可能无法为其输出提供理由或证据，这会影响用户和利益相关者的信任和接受度。例如，诊断医疗状况的`ANN`可能无法解释它为何选择特定诊断或它认为哪些特征相关。\n\
  \n•泛化和外推：`ANN`s 旨在从数据中学习并推广到未见情况。然而，这并不总是如此，尤其是在数据嘈杂、有偏或不足时。`ANN`s 可能过度拟合训练数据，在新数据或不同数据上表现不佳。或者，`ANN`s\
  \ 可能拟合不足，无法捕捉底层模式或关系。此外，`ANN`s 可能难以从数据中外推并处理新颖或意外的场景或事实。例如，识别人脸的`ANN`可能无法识别戴口罩的人脸或不同种族的人脸。\n\
  \n## 10.2.1 人工神经元的数学模型\n\n人工神经元的一般数学模型如图 Fig. 10.1 所示。这里，`x[1]`、`x[2]`∙∙∙和`x[n]`。是人工神经元从外部源接收的输入。源可以是用户提供的输入或从数据中提取的特征。每个输入都与人工神经元通过标记有合适权重的有向边相连。因此对于输入`x[1]`、`x[2]`∙∙∙、`x[n]`对应的权重为`w[1]`、`w[2]`∙∙∙、`w[n]`...人工神经元有两个部分：求和和激活。求和是输入与其对应权重的乘积之和。结果作为输入提供给激活，激活产生输出。\n\
  \n![](img/f10-1.jpg)\n\nFigure 10.1  人工神经元的数学模型\n\n描述该过程的数学方程如下所示：\n\n(10.1)\n\n\
  $t = \\\\sum\\\\limits\\_{i = 1}^{n}x\\_{i}w\\_{i}$\n\n(10.2)\n\n*y* = *f*(*t*)\n\
  \n激活函数可以被视为产生输出的非线性滤波器。其他常用的激活函数有：\n\n(10.3)\n\n$f\\\\left( t \\\\right) = \\\\\
  left\\\\{ \\\\begin{matrix} {1,} & {t \\\\geq \\\\theta} \\\\\\\\ {0,} & {< \\\\\
  theta} \\\\\\\\ \\\\end{matrix} \\\\right.$\n\n(10.4)\n\n$f\\\\left( t \\\\right)\
  \ = \\\\frac{1}{\\\\left( {1 + e^{- \\\\alpha t}} \\\\right)}$\n\n(10.5)\n\n$f\\\
  \\left( t \\\\right) = \\\\frac{e^{x} - e^{- x}}{e^{x} + e^{- x}}$\n\n(10.6)\n\n\
  $f\\\\left( t \\\\right) = \\\\left\\\\{ \\\\begin{matrix} {1,} & {t \\\\geq 0}\
  \ \\\\\\\\ {0,} & {t < 0} \\\\\\\\ \\\\end{matrix} \\\\right.$\n\n不同类型的激活函数，例如 sigmoid（方程\
  \ 10.4）、tanh（方程 10.5）和 ReLU（方程 10.3）具有不同的属性和应用。\n\nSigmoid 函数：这是神经网络中最常用的激活函数。需要\
  \ sigmoid 函数的原因是许多学习算法要求激活函数可微分，因此连续。阶跃函数在这种情况下不适用，因为它不连续。详细来说，激活函数是将神经元输入转换为其输出的数学函数，它在模型中引入非线性，这反过来使神经网络能够学习更复杂的决策边界。Sigmoid\
  \ 函数是最早且最常用（流行）的激活函数之一，因为它具有一些理想的特性：\n\n•它是非线性的。\n\n•它可以轻松用于基于梯度的优化方法。\n\n•它易于理解。\n\
  \n•它易于实现，因为它具有简单的公式。\n\n\n\n\n\n`sigmoid` 函数将任意输入值映射到 0 到 1 之间的值，并且对于二元分类以及逻辑回归问题很有用。它是一个\
  \ S 形曲线。随着输入值增加，输出值开始时缓慢增加，然后迅速接近 1，最后趋于平稳。sigmoid 函数也有一些局限性：\n\n• 它可能遭受梯度消失问题，这意味着当输入值非常大或非常小时，函数的梯度变得非常小。这会减慢甚至阻止网络的学习过程。\n\
  • 它可能导致神经元饱和，这意味着当输入值非常大或非常小时，函数的输出变得非常接近 0 或 1。这会降低网络对输入变化的敏感度。\n• 它不是零中心化的，这意味着函数的输出始终为正。这会在相邻层的梯度中引入不期望的相关性并影响网络的学习过程。\n\
  \n因此，提出了诸如 `tanh`、`ReLU`、`leaky ReLU` 等替代激活函数来克服这些缺点。然而，sigmoid 函数仍然是神经网络中一个重要的激活函数。\n\
  \n例如，一个人工神经元有两个输入 `x1` 和 `x2`，权重 `w1` 和 `w2`，以及偏置 `b`。其 sigmoid 激活函数如下所示：\n\n```\n\
  Output = sigmoid(w1 * x1 + w2 * x2 + b)\n```\n\n该神经元的输出将是一个介于 0 和 1 之间的值，取决于输入、权重和偏置值。例如，如果\
  \ `w1 = 0.5`，`w2 = -0.3`，`b = -0.2`，`x1 = 0.8`，且 `x2 = 0.6`，则输出为：\n\n```\nOutput\
  \ = sigmoid(0.5 * 0.8 -0.3 * 0.6 -0.2) = sigmoid(0.04) = 0.51\n```\n\n这意味着这些输入略微激活了该神经元。\n\
