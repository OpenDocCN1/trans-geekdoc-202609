  \ |\n| 1.5090 || 1.5072 || 1.5001 || 1.5001 |\n| 1.5072 || 1.5058 || 1.5001 || 1.5001\
  \ |\n\n你可以看到，函数无法从点 1.5001 进一步移动，尽管局部最小值在 0 处。这是我们能从收敛到 1.5001 的梯度下降算法达到的最小值。\n\n\
  梯度下降是一种强大的优化技术，它迭代地更新模型的<|message|> 参数以最小化损失函数。然而，它仍面临一些影响其性能的具体挑战：\n\n• 它可能收敛到局部最优而非全局最优。这意味着算法可能在损失函数并非最低值而是被更高值包围的局部最小值处停止。这在损失函数为非凸且具有多个最小值时可能发生。\n\
  \n• 学习率值有显著影响。学习率是一个超参数，控制每次迭代中参数更新的幅度。如果学习率太小，算法可能需要很长时间才能收敛或陷入平坦区域。如果学习率太大，算法可能\
  \ overshoot 最优点并发散或振荡。\n\n• 如果模型复杂，会出现过拟合问题。过拟合意味着模型在训练数据上表现良好，但在新数据或未见数据上表现不佳。这可能发生在模型具有太多参数或特征以至于捕捉到数据中的噪声或无关模式时。\n\
  \n• 对于大数据集或高维空间，收敛速度缓慢。这是因为梯度下降需要在每次迭代中计算损失函数关于所有参数的梯度，这对于大数据集或具有许多特征的模型来说在计算上昂贵且耗时。\n\
  \n### 10.3 人工神经网络的类型\n\n前馈神经网络 Feedforward neural network (FNN)：你可以将其想象为一条单行道。没有循环或反馈，信息从输入流向输出。它类似于一个神经元网络，以单向携带数据。前馈神经网络经常用于语言处理或图像识别。\n\
  \n卷积神经网络 Convolutional neural network (CNN)：CNN 主要用于理解视觉数据，就像我们的大脑解释图像一样。它将滤波器或“特征检测器”应用于图像的各个部分以寻找模式和形状。例如，它可能识别图像中的边缘、角落或纹理。CNN\
  \ 用于许多不同的应用，包括图像分类、对象识别和图像合成。\n\n循环神经网络 Recurrent neural network (RNN)：RNN 是一种具备记忆的网络。它可以处理文本和其他序列数据类型，如时间序列。它具有形成循环的连接，使数据能够回流到早期过程。该网络在进行预测时会记住并考虑先前的数据。RNN\
  \ 常用于情感分析、语音识别和语言翻译。\n\n\n\n\n\n## 长短期记忆（LSTM）网络\n它是一种 `RNN` 形式，在序列数据中识别长期依赖方面表现出色。传统\
  \ `RNNs` 的“短期记忆”限制得到了解决。由于 `LSTMs` 包含专门的记忆单元，它们可以通过在每个步骤中选择性地记住或遗忘来处理并在更长序列中保留相关信息。语言建模、语音识别和手写识别是\
  \ `LSTMs` 的突出应用。\n\n## 生成对抗网络（GAN）\n`GAN` 是一种独特的网络，其中两个模型，即生成器和判别器，被竞争性地相互对抗。生成器试图产生人工数据，例如照片，使其与实际数据非常相似，而判别器的任务是区分两者。通过这种对抗过程，`GANs`\
  \ 可以产生极其逼真的数据，这使它们适用于图像合成、视频制作和数据增强等工作。\n\n## 10.3.1 前馈神经网络（FNN）\n又称为多层感知器，这里信息沿单一路径从输入层经过一个或多个隐藏层最终到达输出层（Fig.\
  \ 10.9）。输入、隐藏和输出层是构成 `FNN` 架构的三种基本层类型。每个层由处理和发送信息的神经元（节点）组成。输入数据，例如样本的特征，被发送到输入层。然后，输入层中的每个神经元代表输入数据的一个方面。\n\
  \n位于输入层和输出层之间的是所谓的隐藏层。为了提取相关模式和特征，它们计算传入数据。隐藏层的总数以及每层中神经元的总数都可能根据问题的复杂程度而变化。\n\n\
  ![](img/f10-9.jpg)\n\nFigure 10.9 Feedforward network (FFN)\n\n输出层产生网络的最终输出，可以是预测、分类或回归值。任务的类型决定了输出层中神经元的数量。例如，如果目标是将照片分类到不同的组中，则输出层中的每个神经元可以代表一个特定类别。每个神经元在\
  \ `FNN` 中执行的两个基本过程是输入的加权和以及激活函数。\n\n每个输入的权重反映了其相对重要性，将其与前一层的输入相乘。计算这些加权输入的总和。然后将加权总和通过激活函数传递，这使得网络变得非线性。激活函数根据加权总和决定是否刺激神经元。它增加了适应性并使网络能够理解输入和输出之间的复杂关系。\n\
  \n### 前向传播\n从输入层开始，前向传播过程涉及将输入数据通过网络的隐藏层移动，直到到达输出层。每个神经元计算其加权和以生成输出并应用激活函数。该过程一直持续到输出层，在那里这些输出作为下一层的输入。\n\
  \n### 训练\n为了训练 `FNN`，我们需要一个包含输入数据及其应产生正确输出的标记数据集。在整个训练过程中，网络修改与每个神经元关联的权重，以减少其预测与正确输出之间的差异。这是通过使用损失函数和\
  \ `gradient descent` 等优化方法来衡量网络性能来实现的。\n\n考虑这个用于手写数字识别的简单 `FNN` 示例。输入层中的神经元代表输入图像中的像素。隐藏层处理输入图像以提取特征，如边缘、曲线或模式。输出层由\
  \ 10 个神经元组成，每个神经元代表 0 到 9 的一个数字。输出层中活动值最高的神经元表示预测的数字。通过在标记的手写数字数据集上进行训练，该 `FNN`\
  \ 学会将输入模式与相关数字联系起来。训练后，它甚至可以在以前未见过的图像中识别手写数字。\n\n`FNNs` 具有适应性，并经常用于各种任务，包括自然语言处理、图像识别以及许多其他需要模式检测和预测的应用。\n\
  \n## 10.3.2 卷积神经网络\n卷积神经网络，也称为 `CNN`，是一种 `ANN` 类型，可以处理复杂且高维的输入，包括声音、图像、视频和口语。`CNNs`\
  \ 明确设计用于分析和理解视觉数据，就像我们的大脑一样。\n\n`CNNs` 由多个层组成，例如卷积、池化、激活和全连接层，每个层对输入数据执行不同的操作。\n\
  \n### 卷积层\n卷积层是 `CNN` 的基本组成部分。它包含多个特征检测器或滤波器，这些滤波器有条不紊地在输入图像上滑动。每个滤波器使用卷积数学运算来识别特定模式或特征，例如边缘、纹理或形状。卷积涉及将滤波器权重与匹配的像素值相乘，并将滤波器应用于图像的小区域。所得值相加以提供一个指示该区域是否存在特定特征的值。通过在整个图像上重复此过程，会创建一个突出显示已识别特征的新特征图。\n\
  \n### 池化层\n`CNN` 经常在卷积层之后添加池化层。该层在保留关键细节的同时降低特征图的维度。它使网络对识别特征的大小或位置变化更具抵抗力。`Max\
  \ pooling` 是最常用的池化方法。对于特征图上的每个较小区域，选择最显著的值。通过这样做，特征图的大小被减小，同时保留最重要的信息。\n\n卷积和池化层通常在\
  \ `CNN` 的末尾后跟一个或多个完全连接的层。这些层类似于传统的前馈神经网络中的层，其中每一层的每个神经元都与前一层的每个神经元相连。\n\n### 神经元操作\n\
  与典型神经网络中的神经元一样，全连接层中的神经元计算前一层输入的加权和并将结果通过激活函数传递。这些神经元中的激活表示网络的最终输出。\n\n### 训练\n\
  用于训练 `CNN` 的是包含输入图像及其相关标签的标记数据集。与其他神经网络一样，网络在训练过程中修改其偏差和权重以减少其预测与正确标签之间的差异。这是通过使用适当的损失函数和\
  \ `gradient descent` 等优化技术来实现的。\n\n让我们看一个用于图像分类的 `CNN` 示例，可以区分猫和狗。`CNN` 的一部分层接收输入图像的像素值。连续的卷积层将识别图像的各个方面，例如边缘、纹理或形状。由于池化层，特征图将被缩小，同时仍包含必要的数据。通过在标记的猫和狗照片集合上进行训练，该\
  \ `CNN` 学会将猫和狗的视觉模式与其相应标签联系起来。此外，在训练后，它还能正确识别新的、未见过的狗或猫的照片。\n\n\n\n\n\nCNNs 还能将从大量数据中学习到的知识推广到新颖且未研究过的材料。CNNs\
  \ 汲取灵感于大脑视觉皮层的生物学设计和运作方式，视觉皮层由对各种视觉场刺激作出反应的神经元组成。CNNs 的基础是 `kernels`，有时也称为 `filters`。使用\
  \ `convolution` 方法，`kernels` 从输入中提取关键数据。\n\n## 10.3.2.1 Convolutional Layer\n\n\
  `CNN` 中的 `convolutional layer` 对输入数据执行一种称为 `convolution` 的数学运算（Fig. 10.10）。\n\n\
  ![](img/f10-10.jpg)\n\nFigure 10.10  Convolutional layer\n\n`Convolution` 指将 `filter`，也称为\
  \ `kernel`，应用于输入数据的局部区域，并产生输出值，该值是 `filter` 与输入值的加权和。`filter` 在输入数据上滑动，按称为 `strides`\
  \ 的步长移动，并产生称为 `feature map` 的输出矩阵。`feature map` 捕获与当前任务相关的输入数据的空间模式和特征（Fig. 10.11）。\n\
  \n![](img/f10-11.jpg)\n\nFigure 10.11  Image representation in a matrix\n\n![](img/f10-12.jpg)\n\
  \nFigure 10.12  Convolution logic in the matrix format\n\n假设我们有一个大小为 `6 x 6` 像素的输入图像。我们想应用一个具有大小为\
  \ `3 x 3` 像素的 `filter` 且 `stride` 为 `1` 的 `convolutional layer`。`filter` 将在输入图像上滑动，从左上角开始，并为图像的每个\
  \ `3 x 3` 区域产生一个输出值。输出 `feature map` 将包含由 `filter` 检测到的输入图像的边缘、角点和形状的信息（Fig. 10.12）。\n\
  \n一个 `convolutional layer` 可以有多个 `filters`，每个 `filter` 产生不同的 `feature map`。`feature\
  \ maps` 沿深度维度堆叠在一起，形成 `convolutional layer` 的输出体积。`filters` 可以具有不同的大小、`strides`\
  \ 和 `padding` 选项，以控制输出体积的形状和大小。`filters` 也是可学习参数，在训练过程中会更新以优化 `CNN` 的性能。\n\n## 10.3.2.2\
  \ Pooling Layer\n\n由 `convolutional layers` 生成的 `feature maps` 的大小由 `pooling layer`\
  \ 减小，`pooling layer` 是 `CNN` 的一部分。池化的主要优点是它提高了网络效率并通过减少参数数量和计算量来避免过拟合。它通过使网络对输入图像中特征的位置和方向变化更具弹性来改善泛化能力和平移不变性。\n\
  \n最常用的池化程序是 `average` 和 `maximum pooling`。还有其他形式。`average pooling` 确定平均值，而 `maximum\
  \ pooling` 在被过滤的 `feature map` 的每个区域中选择最大值。例如，如果我们对一个 `4 x 4` `feature map` 应用 `2\
  \ x 2` 最大池化 `filter` 且 `stride` 为 `2`，我们得到如 Fig. 10.13 所示的 `2 x 2` 输出。\n\n![](img/f10-13.jpg)\n\
  \nFigure 10.13  Pooling by choosing maximum\n\n如果我们对一个 `4 x 4` `feature map` 应用\
  \ `2 x 2` `average pooling` `filter` 且 `stride` 为 `2`，我们得到如 Fig. 10.14 所示的 `2 x\
  \ 2` 输出。\n\n![](img/f10-14.jpg)\n\nFigure 10.14  Pooling by choosing the average\n\
  \n`max pooling` 保留每个区域中最显著的特征，而 `average pooling` 则使特征变得圆滑。这两种方法都有助于减少 `feature\
  \ maps` 中的噪声和多余信息。在 `global pooling` 中，使用整个空间维度上的最高值或平均值，将 `feature map` 的每个通道减少为单个值（Fig.\
  \ 10.15）。\n\n![](img/f10-15.jpg)\n\nFigure 10.15  Single-value pooling\n\n这有助于产生特征的紧凑表示，或在完全连接层之前降低所需参数的数量。\n\
  \n在 `CNN` 架构中，`pooling layers` 通常放置在一個或多个 `convolutional layers` 之后。它们可以根据所需的下采样程度具有各种\
  \ `filter` 大小和 `strides`。`Pooling layers` 是 `CNNs` 的基本组成部分，对于从图像中提取显著特征至关重要。\n\n\
  优点：`Pooling layers` 是 `CNNs` 的常见组成部分，`CNNs` 广泛用于图像识别和分类任务。`Pooling layers` 对由 `convolutional\
  \ layers` 产生的 `feature maps` 执行子采样操作，这为 `CNN` 模型带来了一些优势。`pooling layers` 的三个主要优点是维度缩减、平移不变性和特征选择。\n\
  \n维度缩减是指减少数据集或模型中维数或变量数量的过程。这有助于提高模型的效率和性能，并防止过拟合。过拟合发生在模型从训练数据中学习过多而无法很好地推广到新数据或未见数据时。通过减少\
  \ `feature maps` 的空间维度，`pooling layers` 可以降低模型的计算成本和内存使用，并减少需要学习的参数数量。\n\n平移不变性是\
  \ `pooling layers` 可以帮助在 `CNNs` 中实现的另一个重要属性。平移不变性意味着模型能够识别和分类图像中的物体，而不论其在图像中的位置。这是有益的，因为我们希望模型对输入图像中的细微变化或位移具有鲁棒性，而这些在现实场景中很常见。`Pooling\
  \ layers` 可以通过聚合或汇总 `feature map` 中像素的局部邻域信息来提供平移不变性。\n\n特征选择是从输入数据中选择或提取对特定任务或目标最相关或最具信息量的特征的过程。这有助于提高模型的准确性和可解释性，并减少噪声和冗余。`Pooling\
  \ layers` 可以通过对 `feature maps` 应用非线性函数来执行特征选择，从而根据其重要性或相关性增强或抑制某些特征。\n\n缺点：`pooling\
  \ layers` 的第一个缺点是它们会导致信息丢失。`Pooling layers` 对 `feature map` 的局部区域应用诸如 max 或 average\
  \ 之类的函数并输出单个值。这意味着一些来自输入 `feature map` 的信息被丢弃，这可能对最终的分类或回归任务是必要的。`pooling layers`\
  \ 的第二个缺点是它们可能导致 `feature maps` 过度平滑。`Pooling layers` 降低了 `feature maps` 的空间分辨率，这可能导致丢失对最终分类或回归任务很重要的精细细节。\n\
  \n\n\n\n\n池化层的第三个缺点是它们引入了需要调优以实现最佳性能的超参数。池化层有两个主要超参数：池化区域的大小和步长。池化区域的大小决定了在每个输出特征图中有多少空间信息被聚合和减少。步长决定了池化区域沿输入特征图移动的距离。这两个超参数都影响特征图的计算效率与表征能力之间的权衡。如果我们使用较小的池化区域或较小的步长，我们可以保留更多的空间信息并获得更多的输出特征图，但代价是更多的计算和内存。如果我们使用较大的池化区域或较大的步长，我们可以减少计算和内存需求，但代价是丢失更多的空间信息并获得更少的输出特征图。因此，找到这些超参数的最佳值需要一些试错和模型构建方面的专业知识。\n\
  \n### 10.3.2.3 激活函数\n\n在 CNN 中，卷积层的输出会受到称为激活函数的数学运算的影响。它们为网络提供非线性，使其能够识别输入数据中的复杂模式和特征。此外，激活函数还控制输出值的范围和大小，这可能会影响网络的性能和稳定性。在\
  \ CNN 中可以应用各种类型的激活函数，每种都有其独特的优点和缺点。下面讨论最典型的一种。\n\n#### Sigmoid\n这种具有 S 形曲线的函数被称为\
  \ sigmoid 曲线，将结果转换为可理解为 0 到 1 之间值的概率。它对于人脸识别或图像分割等二元分类任务很有帮助。然而，它存在梯度消失问题，这使得在反向传播期间更新权重变得困难，因为梯度对于显著的正值或负值变得非常小。sigmoid\
  \ 函数的其他有利特性包括其可微性、单调性和单一拐点。逻辑函数是其中最常用的 sigmoid 函数之一，定义如下。\n\n`f(x) = 1 / (1 + e^(-x)),`\n\
  \n其中 `x` 是任意实数值，`e` 是自然对数的底。\n\n逻辑函数的图如图 Fig. 10.16 所示。\n\n![](img/f10-16.jpg)\n\
  \nFigure 10.16  Logistic function graph\n\n正如你所看到的，当 `x` 接近负无穷和正无穷时，逻辑函数分别接近 0 和\
  \ 1。拐点位于 `y = 0.5`，也是逻辑函数的一条水平渐近线。该逻辑函数在机器学习中经常被使用，特别是在逻辑回归和人工神经网络中。逻辑函数可以用作人工神经网络中神经元的激活函数，决定神经元对输入的响应程度。逻辑函数可以模拟生物神经元的行为，生物神经元具有触发阈值和饱和点。此外，通过使用逻辑函数添加非线性，网络可以学习更复杂的模式。\n\
  \n#### Tanh\n该函数被认为是一种缩放的 sigmoid 函数，将输出映射到 1 和 1 之间的值。它也适用于分类任务，因为它产生零中心的结果，可以具有启发性。然而，它仍然存在梯度消失问题，尽管比\
  \ sigmoid 函数稍轻。`tanh` 函数是双曲函数或三角等价物之一，其定义是使用双曲线而不是圆。`tanh` 函数被称为 `sinh` 和 `cosh`\
  \ 的比值，即双曲正弦和双曲余弦函数。`tanh` 公式为：\n\n`tanh(x) = sinh(x) / cosh(x)`\n\n作为替代，我们也可以使用指数函数如下定义\
  \ `tanh`：\n\n`tanh(x)` 等于 `(e^x - e^-x) / (e^x + e^-x)`\n\n`tanh` 函数的一些有趣特征包括：\n\
  \n• 因为它是一个奇函数，`tanh(-x)` 总等于 `-tanh(x)`，无论 `x` 为何。\n• 它的取值范围是 `(-1, 1)`。因此，它永远不会超过或低于这些数字。\n\
  • 当 `x` 接近无穷大时，它在 `y = 1` 处有一条水平渐近线，而当 `x` 接近负无穷大时，它在 `y = -1` 处有一条渐近线。\n• 它的周期为\
  \ `pi * i`，其中 `i` 是虚数和周期单位。\n\n#### ReLU\n这代表修正线性单元。它是一种在 CNN 中常用的激活函数类型。激活函数是确定神经元基于其输入的输出的数学运算。`ReLU`\
  \ 有一个简单的公式：`f(x) = max(0, x)`。这意味着它取零和输入值的最大值并将其作为输出返回。例如，如果输入是 `-2`，输出是 `0`；如果输入是\
  \ `3`，输出是 `3`。`ReLU` 相对于其他激活函数有几个优点。首先，它快速且易于计算，因为它只涉及比较操作。其次，它高效，因为它通过使输出稀疏化来降低网络的计算复杂度。第三，它有助于克服梯度消失问题，即网络的梯度变得非常小而阻止学习。这是因为某些激活函数，如\
  \ `sigmoid` 或 `tanh`，其输出限定在 `-1` 和 `1` 之间，并且对于大输入，其导数接近于零。相反，`ReLU` 对于正输入具有无界输出，其导数要么为\
  \ `0` 要么为 `1`。这意味着它保留了正输入的梯度并允许学习继续。\n\n然而，`ReLU` 也存在一些缺点。其中之一是死亡 `ReLU` 问题，即某些神经元停止学习并变得不活跃。这是因为\
  \ `ReLU` 对于负输入具有零输出和零导数。如果神经元长时间只接收负输入，它将永远不会触发，其权重也不会被更新。这可能导致信息丢失和网络表达能力的降低。为避免此问题，已经提出了一些\
  \ `ReLU` 的变体，例如 leaky `ReLU` 或 parametric `ReLU`，它们对于负输入具有轻微的正斜率。\n\n#### Leaky\
  \ ReLU\n`Leaky ReLU` 是一种激活函数，如果输入为正则简单返回输入，如果为负则返回零。然而，`ReLU` 有一个被称为死亡 `ReLU` 问题的缺点，这意味着如果神经元长时间只接收负输入，一些神经元可能会变得不活跃并停止学习。这会降低网络的表达能力和准确性。为解决此问题，leaky\
  \ `ReLU` 为负输入引入了轻微的正斜率，而不是将它们设为零。这意味着 leaky `ReLU` 的输出如果输入为正则是输入本身，如果输入为负则是输入的一部分。分数通常选择为\
  \ `0.01`，但可以是任何小的正数。通过这样做，leaky `ReLU` 允许一些梯度流经负值，这有助于保持神经元活跃并学习。例如，如果输入是 `-5`，`ReLU`\
  \ 的输出是 `0`，但 leaky `ReLU` 的输出是 `-0.05`。\n\n`Leaky ReLU` 可以提高 CNN 的稳定性和性能，特别是在具有许多层的较深网络中。`Leaky\
  \ ReLU` 可以防止梯度消失问题，即当梯度通过多层传播时变得太小而无法有效更新权重。`Leaky ReLU` 还可以通过向网络引入一些噪声和随机性来减少过拟合问题，这起到了正则化的作用。\n\
  \n\n\n\n\nSoftmax：该函数将输出转换为一个值向量，其范围从 0 到 1，总和为 1。它是 `sigmoid` 函数在多类分类问题（如图像识别或自然语言处理）中的推广。每个类别标签根据输出值的相对大小获得一个概率。它通常与\
  \ `cross-entropy loss function` 配对，作为 `CNNs` 中的最终激活函数。例如，我们有一个图像识别问题，需要将图像分类为四类之一：猫、狗、鸟或鱼。我们可以使用\
  \ `CNN` 从图像中提取特征并产生一个输出值向量，每个类别一个。然而，这些输出值不是概率且可能不在同一范围内。为了将它们转换为可能性，我们可以应用 `softmax`\
  \ 函数。\n\n`softmax` 函数的工作原理是对每个输出值进行指数运算，然后除以所有指数值之和。这样，更大的输出值将具有更高的概率，而较小的输出值将具有更低的概率。`softmax`\
  \ 函数还具有这样的性质：它对输出向量加上或减去一个常数是不变的，这意味着它不依赖于输出值的绝对大小，而只依赖于它们的相对差异。例如，假设来自 `CNN` 的输出向量是\
  \ `[2.3, 1.2, -0.8, 0.5]`。如果我们应用 `softmax` 函数，我们得到 `[0.57, 0.21, 0.03, 0.18]`。这些是图像属于每个类别的概率。我们可以看到，`softmax`\
  \ 函数为第一类（猫）分配了最高概率，为第三类（鸟）分配了最低概率。所有概率之和为 1。\n\n`softmax` 函数通常用作 `CNNs` 中多类分类问题的最终激活函数。这意味着我们可以在应用\
  \ `softmax` 函数后，使用损失函数比较预测概率与真实标签。`cross-entropy loss function` 是一种常见的损失函数，用于衡量预测概率与真实标签的匹配程度。`cross-entropy\
  \ loss function` 会惩罚自信但错误的预测，并奖励自信且正确的预测。例如，假设图像的真实标签是猫（第一类）。`cross-entropy loss\
  \ function` 将计算猫的预测概率的负对数，即 `-log(0.57) = 0.56`。这个相对较低的损失值表明预测接近真实标签。另一方面，如果真实标签是鸟（第三类），`cross-entropy\
  \ loss function` 将计算 `-log(0.03) = 3.51`。这是一个很高的损失值，表明预测远离真实标签。\n\n我们可以通过在图像和标签的训练集上最小化\
  \ `cross-entropy loss function` 来训练 `CNN` 学习产生对新图像准确预测的最优参数。\n\n## 10.3.2.4 Training\
  \ CNNs\n\n`CNN` 可以分析结构化数据，如文本、音频或图像。多个层构成 `CNNs`，每个层对输入数据应用不同的操作。这些操作包括卷积、池化、激活、归一化和丢弃。`CNN`\
  \ 的目标是从数据中提取分层特征，这些特征可应用于分类、分割、检测和生成等各种任务。\n\n图像分类或根据内容为图像命名，是 `CNNs` 最受欢迎的用途之一。当\
  \ `CNN` 正在训练时，模型会输入图像及其标签，并使用诸如随机梯度下降（`SGD`）或 `Adam` 之类的优化算法调整层权重。优化算法试图最小化的对象是计算预测标签与实际标签之间差异的损失函数。例如，`cross-entropy`、均方误差或铰链损失是一些可以根据任务和数据选择的损失函数。\n\
  \n### Steps in the training process\n\n1. 使用预训练模型或随机种子设置层权重。\n2. 重新排列并将数据集划分为标签和图像的组。\n\
  3. 对每个批次执行以下操作：\n   a. 前向传播：运行照片通过模型的层并计算预测输出。\n   b. 反向传播：使用链式法则确定损失函数关于权重的梯度。\n\
  \   c. 更新：使用优化算法和学习率参数更新权重。\n4. 继续执行步骤 2 和 3，直到损失函数收敛或达到预定的轮数（遍历整个数据集的迭代次数）。\n\n\
  `CNN` 的性能可以使用多种标准来评估：准确率、精确率、召回率和 F1 分数。这些指标可以从训练集验证或测试集分别计算。模型的超参数，如学习率、批大小和轮数，可以使用验证集进行调整。测试集可用于衡量模型对新数据的泛化能力。\n\
  \n## 10.3.2.5 Transfer Learning in CNN\n\n机器学习模型可以使用从一项任务中获得的知识来帮助另一项任务，这就是迁移学习。迁移学习可以应用于\
  \ `CNNs` 以提高图像识别模型的效率和效果。\n\n使用预训练的 `CNN` 模型作为新任务的特征提取器或微调器是迁移学习的核心概念。预训练的 `CNN`\
  \ 模型是在大量且多样的数据集（如 `ImageNet`）上训练后学会从图像中提取标准和高级特征的模型。这些属性对许多不同的图像识别任务都有帮助，例如目标检测、人脸识别或图像分割。此外，使用预训练的\
  \ `CNN` 模型使我们能够利用模型的现有知识，而无需从头开始训练新模型，这可能成本高昂且耗时。\n\n特征提取和微调是迁移学习在 `CNNs` 中的两种典型应用。在特征提取期间，我们仅在预训练的\
  \ `CNN` 模型之上训练一个新的分类器，将其作为固定的特征提取器。这种情况适用于新任务与先前任务差异很大或数据集较小的场景。例如，如果我们想根据少量花卉图像的数据集对花卉进行分类，我们可以使用预训练的\
  \ `CNN` 模型从照片中提取特征，然后在其之上训练一个简单的线性分类器。在微调期间，我们在训练时更新预训练 `CNN` 模型的部分或全部参数。这种情况适用于新工作包含大量数据集或与旧任务相似时。\n\
  \n`CNNs` 中的迁移学习应用：\n• `FaceNet`：该 `CNN` 模型在大量带有人脸图像的数据集上训练，标签指示两个面孔是否属于同一个人。然后该模型可以通过在较小的目标人脸数据集上进行微调，用于特定的面部识别任务，如人脸验证、人脸聚类和人脸对齐。例如，`FaceNet`\
  \ 可以通过比较它们在欧几里得空间中的嵌入来验证两张照片是否显示同一个人。\n• `Mask R-CNN`：该 `CNN` 模型执行实例分割，识别并分类图像中的每个对象，并为每个对象生成像素级掩码。该模型基于先前训练的用于目标检测的\
  \ `CNN` 模型（如 `Faster R-CNN`）构建，然后添加一个新的分支用于分割掩码预测。该模型可以进一步在带有不同类别对象注释掩码的图像数据集上进行微调。例如，`Mask\
  \ R-CNN` 可以分割并标记空中图像中的每个人、汽车、树木和建筑物。\n\n\n\n\n\n### Style transfer\n该方法使用迁移学习将一张图像的内容与另一张图像的风格结合，创建新图像。该方法使用在大型自然图像数据集上训练用于图像分类的预训练\
  \ `CNN` 模型，例如 `VGG-19`，从两张图像中提取内容和风格特征。然后使用梯度下降，该方法优化新图像以匹配原始图像的内容和风格特征。例如，风格迁移可用于创建艺术图像，将城市风光照片的内容与梵高《星夜》画作的风格融合。\n\
  \n## 10.3.2.6 Applications of CNNs\n\n`CNN`s 在许多领域得到广泛应用，包括计算机视觉、自然语言处理 (`NLP`)、音频处理和生物医学成像。`CNN`\
  \ 应用的一些示例如下：\n\n• **Face recognition**: `CNN`s 可以学习在图片或视频中识别人脸并将其与已识别个人的数据库进行比较。这可应用于社交网络、安全或身份验证需求。例如，Facebook\
  \ 使用名为 `DeepFace` 的 `CNN` 来识别和标记照片中的人物。`DeepFace` 在标准人脸识别基准上可达到 97.35% 的准确率。\n\n\
  • **Image captioning**: `CNN`s 可以通过融合视觉和语言数据来生成图像的自然语言描述。这可以实现无障碍访问、教育或娱乐。例如，Google\
  \ Photos 使用名为 `Show and Tell` 的 `CNN` 为用户上传的照片生成标题。`Show and Tell` 可以生成相关、有信息且语法正确的标题。\n\
  \n• **Object detection**: `CNN`s 可以使用边界框或掩码在图片或电影中识别和分类物体。这可用于机器人技术、自动驾驶或间谍活动。例如，`YOLO`\
  \ (`You Only Look Once`) 是一种 `CNN`，可以实时视频流中检测和定位多个物体。`YOLO` 在标准目标检测基准上可达到 45% 的平均平均精度。\n\
  \n• **Style transfer**: `CNN`s 可以使用从多个层学习到的特征表示将一种图像的风格迁移到另一张图像。这可用于艺术、想象或个性化用途。例如，`Neural\
  \ Style Transfer` 是一种可以将绘画的风格应用于照片的技术。`Neural Style Transfer` 可以创建视觉上吸引人且富有表现力的图像。\n\
  \n• **Medical diagnosis**: `CNN`s 可以分析 X 射线、MRI 和超声波等诊断测试的图像以发现异常或疾病。这可应用于医疗护理、诊断或治疗。例如，`CheXNet`\
  \ 是一种 `CNN`，可以从胸部 X 射线图像中诊断 14 种不同的胸部疾病。`CheXNet` 在某些疾病上可以优于放射科医生，在其他疾病上可以达到相当的性能。\n\
  \n`CNN`s 是坚固且多功能的工具，可以处理复杂和多样化的数据。因此，它们继续激发新的研究和创新，同时革新众多领域和应用。\n\n## 10.3.3 Recurrent\
  \ Neural Networks\n\n循环神经网络 (`RNN`s) 是 `ANN`s 的一个子集，能够处理顺序数据，包括语音、视频和自然语言。与前馈神经网络具有固定的输入和输出大小不同，`RNN`s\
  \ 通过保持一个依赖于先前输入的内部状态来处理可变长度的输入和输出。因此，`RNN`s 可以捕捉数据中的时间模式并学习长期依赖关系。`RNN`s 通常用于情感分析、语音识别和语言翻译。\n\
  \n**Memory and Feedback**：`RNN` 能够记住或保留其在序列中遇到的先前信息的上下文，这是其基本特征之一。这种记忆是通过使用反馈连接实现的，该连接允许序列中早期阶段的数据反馈到网络中。`RNN`\
  \ 具有一个充当其上下文或记忆的隐藏状态。`RNN` 在序列的每个步骤接收输入，并根据该步骤的输入和前一步的隐藏状态生成输出。隐藏状态在每个步骤都会使用当前输入和先前的隐藏状态的数据进行更新。`RNN`\
  \ 一步一步地处理序列，在每个阶段合并输入并根据需要更改隐藏状态。因此，由于它对每个序列步骤使用相同的权重和偏差集，因此它可以使用随时间推移的数据识别模式和依赖关系。\n\
  \n`RNN`s 由循环单元组成，这些是简单的计算单元，接受输入向量并产生输出向量。每个循环单元还具有一个隐藏状态向量，用于保存来自先前输入的数据。在每个时间步，都会将非线性函数应用于当前输入和初始隐藏状态以更新向量。然后使用隐藏状态向量生成输出向量，可选择使用另一个非线性函数。\n\
  \n消失或爆炸梯度问题是 `RNN`s 面临的基本困难之一，该问题发生在反向传播期间损失函数相对于网络参数的梯度变得非常小或非常大时。因此，很难在长序列上训练\
  \ `RNN`s，因为梯度通常会随时间指数级衰减或增加。已经提出了多种方法来解决这个问题，包括梯度裁剪、`LSTM` (`long short-term memory`)\
  \ 单元、`GRU`s (`gated recurrent units`) 和注意力机制。\n\n`CNN` 和 `RNN` 在某些方面有所不同：\n\n• `CNN`\
  \ 设计用于处理空间数据，例如图像、视频或 2D/3D 形状。`RNN` 设计用于处理顺序数据，例如文本、语音或时间序列。\n\n• `CNN` 没有先前输入的记忆，只能从数据中学习局部特征。`RNN`\
  \ 具有存储先前状态的记忆单元，可以从数据中学习长期依赖关系。\n\n• `CNN` 需要固定大小的输入和输出，这意味着数据必须填充或裁剪以适应网络。`RNN`\
  \ 可以处理可变长度的输入和输出，这意味着网络可以动态适应数据。\n\n• `CNN` 更专业、有效、僵硬且受限，这意味着它可以在特定任务上表现良好，但很难推广到其他领域或任务。`RNN`\
  \ 更具适应性、可泛化性、复杂且容易过拟合和梯度消失，这意味着它可以从多样化的数据源学习，但也更难训练和优化。\n\n例如，`CNN` 可用于图像分类、目标检测、人脸识别或语义分割。`RNN`\
  \ 可用于自然语言处理、语音识别、机器翻译或文本生成。\n\n### 10.3.3.1 Long Short-Term Memory Networks\n\n\
  这是一种能够识别顺序输入中长期依赖关系的 `RNN` 类型。`RNN`s 是通过迭代编码先前输入的隐藏状态来处理顺序数据的神经网络。然而，`RNN`s 遇到的消失和膨胀梯度问题使得学习长期依赖关系变得困难。`LSTM`\
  \ 网络使用三个控制信息在记忆单元进出流动的门和一个可以随时间存储和更新信息的记忆单元来解决这些问题：输入门、遗忘门和输出门（`Fig. 10.17`）。\n\n\
  ![](img/f10-17.jpg)\n\nFigure 10.17 LSTM logic\n\n输出门决定应从单元输出什么数据，输入门决定应添加什么新数据，而遗忘门决定应从单元中删除什么过时数据。因此，`LSTM`\
  \ 网络可以学习顺序数据中的复杂和持久模式，包括语音、视频和口语语言。\n\n### 10.3.3.2 Gated Recurrent Unit Networks\n\
  \n\n\n\n\nRNNs 的梯度消失或爆炸问题使得理解长期依赖变得困难。为了解决这个问题，重置门和更新门是门控循环单元（GRU）网络中使用的两种门类型（图\
  \ 10.18）。\n\n![](img/f10-18.jpg)\n\n图 10.18  门控循环单元网络\n\n这些门调节从当前输入和初始隐藏状态中记住或丢失多少数据。GRU\
  \ 网络在许多任务上表现优于普通 RNN，因为它们可以被训练以选择性地在长序列上回忆或遗忘相关信息。\n\n### 10.3.3.3 训练 RNN\n\n使用带有序列数据和相应标签的标记数据集来训练\
  \ RNN。与其他神经网络一样，RNN 在训练期间修改其权重和偏差，以减少其预测与准确标签之间的差异。这是通过使用适当的损失函数和诸如梯度下降之类的优化技术实现的。消失或爆炸梯度的问题在通过时间反向传播（BPTT）期间出现，当损失函数相对于网络参数的梯度变得非常微小或非常大时就会发生这种情况。由于此原因，网络可能学习非常缓慢，或者变得不稳定并发散。已经提出了许多解决方案来解决这个问题，包括正则化、梯度裁剪以及\
  \ LSTM 和 GRU 等高级 RNN 设计。\n\n### 10.3.3.4 RNN 的应用\n\nNLP、语音识别、机器翻译、文本合成、图像描述、视频分析和音乐作曲只是\
  \ RNN 已成功使用的任务中的几个。此外，RNN 通常与其他神经网络架构结合使用，包括 Transformer 和 CNN，以受益于每个模型的特点。因此，RNN\
  \ 是最强大和最通用的深度学习技术之一，不断激发新的研究和应用。\n\nRNN 可以处理时间序列、语音、音频、视频和其他序列数据。由于 RNN 的记忆机制，它们可以模拟复杂和动态的过程，使其能够存储和使用来自先前输入的数据。NLP、语音识别、机器翻译、文本生成、情感分析、图片描述、视频分析、音乐合成等领域和应用已广泛使用\
  \ RNN。\n\nRNN 由一组单元或神经元组成，这些单元或神经元以循环方式连接以形成有向循环。在每个时间步，每个单元接收一个输入向量并输出一个输出向量和一个隐藏状态向量。隐藏状态向量包含在同一单元或额外单元的下一个时间步的输入中。以这种方式，隐藏状态向量充当存储输入历史的记忆。根据任务，输出向量可用于预测句子中的下一个词、生成对问题的回答或对情感进行分类。\n\
  \nElman 网络，通常称为简单循环网络（SRN），是最简单和最广泛使用的 RNN 架构之一。在此设计中，每个单元具有三组权重：连接隐藏状态向量到自身的循环权重、连接隐藏状态向量到输出向量的输出权重以及连接输入向量到隐藏状态向量的输入权重。首先，使用输入向量和前一个隐藏状态向量的加权和来计算隐藏状态向量，然后使用非线性激活函数（如\
  \ sigmoid 或 tanh）进行计算。最后，通过将另一个激活函数（如 softmax）添加到隐藏状态向量的加权和来计算输出向量。\n\n其关键特征之一是\
  \ RNN 识别序列数据中长期依赖和上下文信息的能力。例如，在自然语言处理中使用时，RNN 可以学习语言的句法和语义规范并生成连贯且富有洞察力的短语。然而，RNN\
  \ 的一个基本问题是由于梯度消失或爆炸问题，它们难以学习长期关系。当误差函数随时间传播时，关于权重的梯度变得极其微小或极其巨大，从而难以有效地更新权重时，就会产生这个问题。这个问题可能导致\
  \ RNN 忘记或忽视来自遥远输入的数据，或者导致它们变得不稳定并产生不规则的输出。\n\n已经提出了许多 RNN 变体和扩展，包括 LSTM 网络、GRU、双向\
  \ RNN（BRNN）、注意力机制和 Transformer 网络，以解决这个问题。这些架构引入了各种机制来控制信息流和梯度随时间的变化，包括调节每个单元输入和输出的门、跳过某些时间步的连接、集中于重要输入序列段的对齐，以及识别所有输入之间相互依赖关系的全局自注意力。\n\
  \nRNN 的研究和开发在 ML 和 AI 中仍在进行中。RNN 研究的当前问题和潜在方向如下：\n\n• 提高 RNN 的可扩展性和有效性，以用于大规模应用。\n\
  • 创建新的架构和方法来处理多模态和异构的序列数据。\n• 寻找 RNN 可以提供新视角和解决方案的新领域和用途。\n• 提高 RNN 的可解释性和可说明性以增强信心和理解。\n\
  • 在学习和创建 RNN 中纳入人类反馈和先验知识。\n\nRNN 是序列事件和数据的实用建模工具。在各种应用和领域中已显示出令人印象深刻的结果。然而，它们也遇到一些限制和困难，需要进一步的研究和创新。尽管如此，通过扩展\
  \ RNN 研究，我们可以为人工智能和机器学习开辟新的途径和机遇。\n\n### 10.3.3.5 RNN 的挑战\n\n注意力机制是帮助 RNN 专注于每个输出的输入序列基本元素的另一种方法。它们根据输入对输出的贡献程度为每个输入赋予权重或分数。然后，使用这些权重创建的输入序列的加权平均值或摘要被馈送到输出层。以这种方式，它们可以在不依赖于网络的隐藏状态的情况下识别长期依赖。\n\
  \n外部记忆模块可以改善 RNN，这些模块可以使用记忆网络这一较新的技术在较长时间内存储和检索数据。这些记忆模块可通过网络控制的读写操作访问。这使个人能够保存诸如事实、规则或完成需要演绎和推理的困难任务所需的一般知识等信息。\n\
  \n梯度消失或爆炸的问题为 RNN 带来了额外的挑战。因此，在训练期间，学习可能会变得缓慢或不稳定，因为用于更新网络参数的梯度或错误可能会变得非常小或非常大。这发生在\
  \ RNN 使用 BPTT 在多个时间步上乘以多个矩阵来计算梯度时。如果这些矩阵的值接近于零或一，当梯度在网络中传播时，这些矩阵将表现出指数增长或收缩。\n\n\
  使用梯度裁剪、正则化或初始化方法是对此问题的一些解决方案。梯度裁剪是一种简单的方法，通过在梯度超过预定限制时对其进行缩放来限制梯度的大小。这可以防止它们变得过大或过小并造成数值问题。正则化是另一种减少过拟合并提高泛化能力的技术。\n\
  \n### 10.3.4 生成式 AI\n\n\n\n\n\n# 生成式人工智能\n\n生成式人工智能是人工智能的一个分支，专注于从零开始创建新的内容或数据，例如图像、文本、音乐、代码等。它之所以重要，有几个原因：它可以帮助我们探索新的可能性和场景，这些场景否则我们可能无法想象或模拟。例如，生成式人工智能可以创建不存在的人脸的逼真图像，或为产品、建筑物或艺术品生成新颖的设计。它可以通过提供灵感、反馈或帮助来增强我们的创造力和生产力。它可以帮助我们为各种目的生成高质量的数据，例如训练其他人工智能模型、测试软件或系统，或进行研究或分析。例如，生成式人工智能可以产生模仿真实世界数据但保护隐私和安全的人工合成数据。\n\
  \n存在不同类型的生成式人工智能模型：生成对抗网络（`GANs`）、变分自编码器（`VAEs`）和 Transformer 模型。我们将详细研究 `GANs`\
  \ 和 `VAEs`。\n\nTransformer 模型标志着机器学习领域的革命性进步。其独特的架构允许对序列进行并发处理，这与传统模型的顺序数据处理不同。研究社区目前正致力于研究\
  \ Transformer 的机制，这些努力使人们对 Transformer 模型的未来充满乐观。有关更多详细信息，请参阅第 11 章。\n\n## 10.3.4.1\
  \ 生成对抗网络\n\n这种类型的神经网络可以从输入中输出逼真且多样化的数据。`GAN` 由两个组件组成：判别器和生成器（Fig. 10.19）。判别器的目标是正确分类数据，而生成器的目标是欺骗判别器。生成器旨在创建与正确数据相似的虚假数据，而判别器则努力区分真实数据和虚假数据。在对抗训练过程中，判别器和生成器相互竞争以变得更有效。\n\
  \n![](img/f10-19.jpg)\n\nFigure 10.19 生成对抗网络（`GAN`）\n\n众多领域，包括计算机视觉、NLP、音频合成等都使用\
  \ `GANs`。例如，`GANs` 可以生成逼真的人、动物、风景甚至艺术品的图像。此外，`GANs` 可以提高低分辨率照片的质量，从照片中消除噪声，或在图像之间交换风格。此外，`GANs`\
  \ 可用于 NLP 生成文本，例如标题、摘要、故事或对话。从文本或其他输入创建语音或音乐是 `GANs` 的另一个应用。\n\n### 训练 GAN\n\n判别器和生成器以对抗的方式进行训练，判别器试图抓住生成器，而生成器试图欺骗判别器。目标/目的是达到一种状态，即判别器无法区分生成器产生的数据和实际数据。\n\
  \n`GAN` 训练的一个基本概念是损失函数，它衡量生成器和判别器的表现如何。这是因为生成器试图通过生成看起来像准确数据的虚假数据来欺骗判别器，而判别器则试图区分真实数据和虚假数据。损失函数反映了这两个目标之间的权衡。\n\
  \n另一个重要概念是正则化，它通过对模型参数或输出添加一些约束或惩罚来防止过拟合或欠拟合。例如，过拟合发生在模型记住训练数据并且无法推广到新输入时。同时，欠拟合发生在模型需要更复杂并且无法捕捉数据的复杂性时。正则化可以帮助平衡模型的复杂性和简单性，从而提高其泛化性能。\n\
  \n评估指标衡量生成数据的质量和多样性。评估 `GANs` 具有挑战性，因为需要对什么是良好的生成有一个明确的定义。\n\n### 改进 GAN 训练的方法\n\
  \n让我们看看在低数据情况下改进 `GAN` 训练的一些最先进方法。其中一种方法是数据增强，它通过对现有数据应用一些转换或扰动来增加数据量和多样性。例如，可以旋转、裁剪、翻转或改变图像的颜色/亮度来创建新图像。数据增强可以减少过拟合并提高生成数据的鲁棒性和多样性。\n\
  \n另一种方法是自监督学习，即通过解决不需要人工标注的额外任务从无标签数据中学习良好的表示。例如，可以将图像块的旋转角度、颜色或位置预测作为自监督任务。自监督学习可以从有限数据中提取有意义的特征并提高生成数据的质量和真实性。第三种方法是迁移学习，它利用在大型数据集上预训练的模型的知识迁移到小型数据集上的新模型。\n\
  \n### 应用\n\n`GANs` 已在各个领域中使用，包括创建 3D 物体、视频预测和图像。图像生成是 `GANs` 最广泛使用的用途之一。`GANs` 可以生成人类面孔、动物、风景和其他主题的逼真且多样的图像。\n\
  \n一种可以生成具有各种风格和特征的高质量人脸图像的 `GAN` 是 `StyleGAN`。它还可以修改现有照片，改变其年龄、性别、表情和头发颜色。另一个例子是图像到图像转换器\
  \ `CycleGAN`，它可以将图像更改为例如图片到绘画、马到斑马、夏季到冬季等。\n\n### 挑战\n\n`GAN` 训练是一项复杂的任务，我们可能会遇到多种困难，从而损害其性能和稳定性：\n\
  \n• 模式崩溃：当生成器仅提供一小范围的输出，甚至对各种输入提供相同的输出时，就会发生模式崩溃。这表明生成器只关注少数几个可能欺骗判别器的模式，从而导致无法代表准确数据分布的多样性。模式崩溃可能源于多个问题，包括生成器和判别器之间的不平衡、目标函数的错误选择或参数初始化不正确。防止或减轻模式崩溃的潜在补救措施包括：\n\
  \n  ● `Wasserstein loss`：这种替代目标函数衡量实际和虚构数据分布之间的分离，而不是它们的重叠。即使判别器非常好或完美，`Wasserstein\
  \ loss` 也能为生成器提供更平滑、更有洞察力的梯度信号。\n\n  ● 展开 `GANs`：这种方法调整生成器损失函数，使其考虑当前判别器的输出以及未来判别器迭代的输出。这可以防止生成器过度优化单个判别器，并迫使其考虑更长期的观点。\n\
  \n  ● 小批量判别：这种技术允许判别器在小批量内比较不同样本，而不是单独检查它们。这使判别器能够识别模式崩溃并为生成器提供更有启发性的输入。\n\n\n\n\
  \n\n## 收敛性不足\n当生成器和判别器在训练过程中振荡或发散，而不是达到稳定的平衡时，这被称为非收敛。结果，生成器可能产生质量低下或错误的输出，或者无法从数据中得出有效结论。许多因素都可能导致非收敛，包括不合适的学习率、生成器与判别器设计之间的不平衡，或不合适的优化算法。以下是一些可能加强或保证收敛的方法：\n\
  \n### 梯度惩罚\n基于判别器的梯度范数，该正则化方法在目标函数中添加惩罚项。这有助于防止梯度爆炸或消失，并对判别器函数施加平滑限制。\n\n### 谱归一化\n\
  该正则化方法归一化判别器中每一层权重矩阵的谱范数（最显著的奇异值）。这有助于保持梯度稳定并控制判别器函数的 Lipschitz 常数。\n\n### Adam\
  \ 优化器\n该自适应优化算法根据每个参数先前的梯度和动量修改其学习率。`Adam` 优化器可以帮助处理噪声数据、稀疏梯度以及各种参数尺度。\n\n## 3D\
  \ 视角\n在 3D 对象或设置中，GANs 通常发现理解和复制 3D 透视元素（如深度、遮挡、光照和阴影）具有挑战性。这可能导致平面或失真的视觉效果，可能与人类感知不符。此外，由于\
  \ GANs 必须获取高层次的几何和语义信息以及像素级特征，因此 3D 透视是一项具有挑战性的任务。以下是一些改善 3D 透视的潜在方法：\n\n### 3D-GANs\n\
  这些 GANs 使用 3D 体素网格而不是 2D 像素网格。在不使用中间表示或 2D 投影的情况下，3D-GANs 可以直接从噪声向量生成 3D 形状。\n\n\
  ### StyleGANs\n这些 GANs 使用风格迁移方法来调节图像生成的多个方面，包括形状、纹理、颜色和姿态。`StyleGANs` 可以在不同抽象层级修改潜在代码并将其注入生成网络的各个层。\n\
  \n### CycleGANs\n`CycleGANs` 是可以在没有配对数据的情况下学习域到域映射的 GANs。`CycleGANs` 可以将不同视角的图像进行转换，例如从正面视图到侧面视图或从空中视图到街景视图。\n\
  \n## GAN 的评估\nGAN 评估技术的三大主要类别是定量、定性和混合。定量方法使用数值度量来评估生成样本的质量、多样性、保真度和相似性。在定性方法中，通过人类判断或视觉检查来评估生成样本的感知真实性和多样性。最后，混合技术结合定量和定性方法以进行更全面的分析。\n\
  \n定量方法比定性方法更客观、可扩展，但经常会忽略生成样本的感知特征。例如，一些定量指标可能更偏好模糊或噪声样本而不是清晰锐利的样本，或者它们可能需要考虑生成样本的语义相关性或连贯性。此外，由于不同的定量指标可能彼此不一致或与人类判断不一致，因此比较多个\
  \ GAN 模型并选择最佳模型可能具有挑战性。\n\n与定量方法相比，定性方法更具同理心和直观性，但更容易产生偏见和不一致。例如，人类判断可能因任务、上下文、评估者的偏好和经验水平而有所不同。此外，进行定性方法通常耗时且成本高，尤其是在大规模或高维数据的情况下。\n\
  \n通过有效融合定量和定性方法，混合方法旨在克服各自的缺点。例如，一些混合方法使用定量指标对样本进行排序或选择以进行定性评估，而其他方法则使用定量测量来校准或验证定量指标。与单独使用定量或定性方法相比，混合方法可以提供对\
  \ GAN 的更全面和更可靠的评估。\n\n设计有效的、高效的人机界面以收集人类反馈，在评估过程中平衡定量和定性方面，以及处理各种评估标准之间潜在的冲突或权衡，是混合方法必须克服的一些挑战。\n\
  \n## 10.4 其他类型的 ANN\n10.4Other Types of ANNs\n\n其他独特类型的 ANN 是自组织映射 (`SOMs`) 和玻尔兹曼机\
  \ (`BMs`)。`SOMs`，有时称为 Kohonen 映射，是一类主要用于数据可视化和降维应用的无监督学习算法。它们最早由 Teuvo Kohonen 在\
  \ 1980 年代使用，通过将高维数据离散化并排列到二维映射中，同时保持原始数据的拓扑特征。玻尔兹曼机 (`BMs`) 另一方面，是一种可用于特征学习、降维和联想记忆的随机循环神经网络。它们以统计力学中的玻尔兹曼分布命名，该分布用于其采样函数。\n\
  \n### 10.4.1 自组织映射 (SOMs)\n这种无监督 ML 方法可以在保持数据拓扑结构的同时提供高维数据集合的低维表示。它是一种减少数据维度的方法。因此，`SOMs`\
  \ 可以识别数据中的模式和相似性并将其显示在二维映射上，其中每个节点代表一组相关数据点。为了使 `SOMs` 发挥作用，必须首先创建一个具有与输入数据相同维度的权重向量的节点网格。在随机初始化后，节点根据竞争学习方法迭代更新。对于每个输入数据点，选择获胜节点及其邻近节点，并全部向数据点移动。随时间推移，邻域大小和学习率随着节点收敛到稳定位置而减小。\n\
  \n`SOMs` 可用于多种应用：\n\n- **数据可视化**：通过将复杂的高维数据集转换到低维空间，其中节点之间的距离显示数据点之间的相似性，`SOMs`\
  \ 可以帮助探索和理解大型复杂数据集。例如，`SOMs` 可用于可视化书面内容和客户细分。\n- **数据压缩**：`SOMs` 可以通过将大数据集划分为更少的节点，每个节点代表一个原型或聚类质心来缩小其大小。例如，`SOMs`\
  \ 可用于压缩图像、声音或电影。\n- **异常检测**：`SOMs` 可以通过计算它们与最近节点的分离或它们在地图上的密度来定位异常数据点。例如，`SOMs`\
  \ 可用于查找欺诈、网络渗透或疾病。\n\n`SOMs` 有多种类型，例如：\n\n- **U-matrix**：这种可视化方法使用不同的颜色或色调来表示地图上相邻节点之间的距离。U-matrix\
  \ 可以显示聚类结构和数据集的边界。\n- **分量平面**：这是一种可视化权重向量的方法，使用不同的颜色或色调在不同的映射中显示每个维度的值。分量平面显示数据集中每个属性的相关性和差异。\n\
  \n\n\n\n\n热力图：这种可视化技术使用各种颜色或色调来表示每个节点被选为输入数据点的获胜节点的频率。数据集的分布和密度可以在命中图上看到。\n\n##\
  \ 10.4.2 玻尔兹曼机 (MBs)\n\n这是一种 `ANN`，可以在无监督的情况下学习发现数据中的令人兴奋的特征。它们由对称且双向连接的节点组成，这意味着每个节点都可以向任何其他节点发送和接收信号。此外，节点可以是可见的或隐藏的，具体取决于它们代表可观察数据还是潜在变量。\n\
  \n`BM` 通常由多个可见层和隐藏层组成，其中每个可见层的节点都连接到每个隐藏层的节点。隐藏层中的每个节点都接收来自可见层节点的输出的输入（Fig. 10.20）。\n\
  \n![](img/f10-20.jpg)\n\nFigure 10.20 玻尔兹曼机\n\n`BMs` 是随机性和生成模型，这意味着它们可以根据连接的权重定义的概率分布和节点的激活函数随机采样网络的不同状态。`BMs`\
  \ 中的学习旨在调整权重，以便网络可以生成与训练数据相似的数据。\n\n`BMs` 的一个挑战是它们训练计算成本高，尤其是在它们具有许多隐藏节点层时。这是因为学习算法需要从网络的平衡分布中采样，这涉及多次更新所有节点，直到它们达到稳定状态。为了解决这个问题，提出了一种称为受限玻尔兹曼机\
  \ (`RBM`) 的变体，它限制节点之间的连接，使得同一层内没有连接（Fig. 10.21）。\n\n![](img/f10-21.jpg)\n\nFigure\
  \ 10.21 受限玻尔兹曼机\n\n`RBMs` 也可以堆叠在一起形成深度信念网络 (`DBNs`)，它们是分层模型，可以从数据中学习多个抽象级别。`DBNs`\
  \ 可以逐层训练，使用一个 `RBM` 的输出作为另一个 `RBM` 的输入。这样，每个 `RBM` 都可以学习捕捉数据中高阶相关性的特征（Fig. 10.21）。\n\
  \n深度信念网络 (`DBNs`) 由众多隐藏层组成，这些隐藏层相互连接但不在同一层内。每一层都作为特征提取器，将输入数据转换为更高级别的表示。\n\n预训练和微调是\
  \ `DBNs` 的两个训练步骤。首先，每个 `RBM` 使用对比散度方法单独进行预训练，减少数据与模型分布之间的差异。然后，为了完善分类或回归任务，整个 `DBN`\
  \ 使用监督学习技术，如梯度下降或反向传播，进行集体训练。`DBN` 的应用包括语音识别、图像识别、自然语言处理和推荐系统。它们还可以增强以处理其他数据类型，例如连续、分类或时间数据。\n\
  \n![](img/f10-22.jpg)\n\nFigure 10.21 RBM 网络作为深度信念网络 (`DBN`)\n\n## 10.4.3 模块化神经网络\
  \ (MNNs)\n\n`MNNs` 是一种人工神经网络，由执行不同任务或功能的多个模块或子网络组成（Fig. 10.22）。`MNNs` 旨在克服传统神经网络的一些局限性，例如可扩展性、复杂性和泛化能力。`MNNs`\
  \ 使用分而治之的方法，将复杂问题分解为专门模块可以解决的更简单的子问题。模块可以通过各种机制进行通信，例如共享权重、中间输出或更高级别的表示。模块还可以具有不同的架构、学习算法和激活函数，具体取决于它们正在解决的子问题。\n\
  \n![](img/f10-23.jpg)\n\nFigure 10.22 模块化神经网络 (`MNN`)\n\n`MNNs` 的主要优点之一是它们可以降低训练和推理的计算成本和内存需求，因为每个模块可以独立或并行训练和更新。`MNNs`\
  \ 还可以提高网络的泛化性能和鲁棒性，因为每个模块可以学习专注于与其实任务相关的输入数据的特定特征或方面。此外，`MNNs` 可以促进在不同领域或任务之间转移和重用知识，因为模块可以共享或适应新问题。\n\
  \n`MNNs` 的一些类型如下：\n\n在分层模块化神经网络 (`HMNNs`) 中，模块按分层结构排列，例如树或金字塔（Fig. 10.23）。低层模块处理原始输入数据并提取低级特征。相比之下，高层模块整合低层模块的输出并提取高级特征或做出预测。`HMNN`\
  \ 的一个例子是 `CNN`，其中每个卷积层都可以被视为执行特征提取和池化的模块。\n\n![](img/f10-24.jpg)\n\nFigure 10.23\
  \ 分层模块化神经网络 (`HMNN`)\n\n协同模块化神经网络 (`CMNNs`) 由众多模块组成，它们共同合作解决一个共同问题。每个模块可能负责单独的任务或职责，例如处理输入、产生输出、纠正错误或做出决策。模块还可以通过反馈回路或共识程序进行通信，使它们能够协调其行动并受益于彼此的知识。\n\
  \n循环神经网络 (`RNNs`)，通常用于时间序列分析、语音识别和 `NLP` 等应用中的序列数据处理，是 `CMNNs` 的一个例子。`RNN` 中的每个循环单元都是一个模块，它根据输入和先前状态更新隐藏状态，使其类似于\
  \ `CMNN`。模块的记忆或上下文，可以理解为隐藏状态，使其能够识别数据中的长期依赖关系和时间模式。沿序列传递的隐藏状态使循环单元之间能够进行通信。`RNN`\
  \ 的输出层可以产生一个词或一个标签，也可以每一步产生输出。\n\n在竞争模块化神经网络 (`CPMNNs`) 中，模块竞争解决问题。模块可以有不同的目标或标准，例如准确性、速度、多样性或新颖性。此外，模块可以通过奖励信号或选择机制相互影响。`CPMNN`\
  \ 的一个例子是 `GAN`，其中生成器和判别器可以被视为竞争生成逼真样本并将其与真实样本区分开的模块。\n\n### 10.5 构建神经网络架构\n\n神经网络是强大的计算模型，可以从数据中学习并执行分类、回归、生成和强化学习等各种任务。然而，设计适用于不同问题和领域的神经网络架构并不是一项简单任务。它需要大量的试错、直觉和专业知识。\n\
  \n\n\n\n\n# 神经网络架构权衡与反向传播\n\n## 复杂性与性能权衡\n\n构建神经网络架构的主要挑战之一是在复杂性与性能之间进行权衡。一方面，更复杂的架构可以从数据中捕捉更多特征和模式，并实现更高的准确性和泛化能力。然而，另一方面，更复杂的架构也需要更多的计算资源，如内存、时间和能量，并且可能容易过拟合和不稳定。因此，在神经网络设计中找到复杂性与性能之间的最佳平衡至关重要。\n\
  \n## 正则化策略\n\n克服这一困难的一种方法是使用诸如 `dropout`、`batch normalization`、`weight decay` 和提前停止的正则化策略。这些技术可以通过向网络参数或输出引入噪声或惩罚来帮助减少过拟合并改善泛化。例如，`dropout`\
  \ 在训练期间随机丢弃网络中的某些单元，这可以防止特征的协同适应并迫使网络学习更鲁棒的表示。`Batch normalization` 将每一层的输入归一化为零均值和单位方差，这可以减少内部协变量偏移并加速收敛。`Weight\
  \ decay` 通过包含一个惩罚项来改变损失函数，该惩罚项将网络权重减小到零，消除其过度增长并导致数值问题。最后，提前停止在验证误差停止下降或开始增加时停止训练过程，这可以避免对训练数据的过拟合。\n\
  \n## 架构搜索技术\n\n架构搜索技术，包括 `grid search`、`random search`、进化算法、强化学习和基于梯度的方法，是解决此问题的另一种方法。这些技术通过探索大量可能的架构空间并根据标准或目标函数对它们进行评估，帮助自动化为给定问题和数据集找到最佳架构。例如，`grid\
  \ search` 会穷举尝试所有预定义超参数的组合（如层数、单元数、激活函数等）。然后，它选择在验证集上取得最佳性能的那个。`Random search` 从预定义范围或分布中随机采样超参数并以类似方式选择最佳者。进化算法使用突变、交叉和选择等生物学概念在世代间构建结构种群。强化学习使用一个代理，该代理根据来自环境（如验证集上的性能）的奖励学习选择架构的策略。最后，基于梯度的方法使用关于架构参数的目标函数的梯度来迭代更新它们。\n\
  \n## 局限性\n\n然而，这些技术也存在一些局限性和挑战。例如，正则化技术可能会向网络输出或参数引入一些偏差或方差，影响其可解释性或可迁移性。此外，架构搜索技术可能需要大量计算资源或时间来探索大量架构空间或在大型数据集上评估它们。此外，它们可能遭受局部最优或对验证集的过拟合。\n\
  \n因此，构建神经网络架构是一个技术问题，也是一门艺术和科学。它需要创造力、直觉、领域知识、实验、评估和迭代。\n\n## 10.6 使用反向传播训练神经网络\n\
  \n神经网络是能够从输入中学习并执行多种操作的计算机模型，包括生成、回归和分类。根据期望输出的反馈更改神经网络的参数；然而，从数据中学习是必要的。反向传播是这种技术的名称，是人工智能中最重要的算法之一。\n\
  \n反向传播技术计算损失函数关于神经网络参数的梯度。神经网络的损失函数衡量神经网络在特定输入-输出对上的性能。梯度显示每个参数需要改变多少以减少损失。通过对参数进行微小调整并沿着梯度的反方向移动，神经网络可以逐步提高其性能。\n\
  \n反向传播已取代其他算法，成为训练具有多个非线性单元层的密集神经网络的首选方法。\n\n### 多层感知器训练\n\n多层感知器使用反向传播算法进行训练。该算法有三个主要阶段：\n\
  \n• 前向阶段\n\n• 计算误差并将其向后传播\n\n• 更新权重\n\n考虑一个拓扑为 `(n + 1) - (p + 1)` 的 MLP，即输入层有 `n`\
  \ 个神经元和一个偏置神经元，隐藏层有 `p` 个神经元和一个偏置神经元，输出层有 `m` 个神经元（Fig. 10.24）。\n\n![](img/f10-26.jpg)\n\
  \n图 10.24 具有 n–p–m 拓扑的 MLP 模型\n\n#### 记号\n\n输入向量：`X = (x[1] ,x[2],∙∙∙,x[n] )`\n\n\
  输出向量：`O = (O[1],O[2],∙∙∙,O[m])`\n\n其中\n\n`m[ij]` : 连接输入层第 i 个神经元与隐藏层第 j 个神经元的权重\n\
  \n`w[jk]` : 连接隐藏层第 j 个神经元与输出层第 k 个神经元的权重\n\n`h[j]` : 第 j 个隐藏神经元的求和输入\n\n`H[j]` :\
  \ 第 j 个隐藏神经元的输出\n\n`y[k]` : 第 k 个输出神经元的求和输入\n\n`Y[k]` : 第 k 个输出神经元的输出\n\n`δ[k]`\
  \ : 第 k 个输出神经元的误差项\n\n#### 算法\n\n1. 一次性初始化所有权重。\n2. 输入层中的每个神经元（`x[i]`，`i = 1∙∙∙n`）从外部源接收，通过权重提供给隐藏层的神经元。\n\
  3. 隐藏层中的每个神经元（`h[j]`，`j = 1∙∙∙p`）计算输入和权重的乘积之和并应用激活函数以产生输出。\n\n```\nh_j = sum_{i\
  \ = 1}^{n} x_i * m_ij + m_0j\nH[j] = f (h[j])\n```\n\n4. 隐藏层中每个神经元的输出通过权重作为输入提供给输出层的神经元。\n\
  5. 输出层中的每个神经元（`y[k]`，`k = 1∙∙∙m`）计算输入和权重的乘积之和并应用激活函数以产生输出。\n\n```\ny_k = sum_{j\
  \ = 1}^{p} H_j * w_jk + w_0k\nY[k] = f ( y[k] )\n```\n\n6. 计算输出层中每个神经元的误差。\n\n```\n\
  δ[k] = (O[k] - Y[k]) * f′( y[k] )\n```\n\n7. 计算隐藏层与输出层之间权重应进行的调整。\n\n```\n∆w [jk]\
  \ = η * δ[k] * H[j]\n∆w[0k] = η * δ[k]\n```\n\n8. 将误差向后传播到隐藏层。\n9. 每个隐藏神经元（`h[j]`，`j\
  \ = 1∙∙∙p`）通过权重接收误差项并通过与其激活函数的导数相乘来计算误差信息项。\n\n```\nδh_j = sum_{k = 1}^{m} δ_k *\
  \ w_jk\nδH[j] = δh[j] * f′ (h[j])\n```\n\n10. 计算输入层与隐藏层之间权重应进行的调整。\n\n```\n∆m[ij]\
  \ = η * δH[j] * x[i]\n∆m[0j] = η * δH[j]\n```\n\n11. 一次性更新所有权重。\n\n```\nm[ij] (new)\
  \ = m[ij] (old) + Δm[ij]\nm[0j] (new) = m[0j] (old) + Δm[0j]\nw[ij] (new) = w[ij]\
  \ (old) + Δw[ij]\nw[0j] (new) = w[0j] (old) + Δw[0j]\n```\n\n12. 重复从步骤 2 到 9 的过程，直到满足停止条件为止。\n\
  \n#### 使用的激活函数\n\nMLP 中常用的激活函数是 `sigmoid` 和 `tanh`。Sigmoid 函数定义为\n\n```\nf( x )\
  \ = 1 / ( 1 + e^{- x} )\n```\n\n该函数的导数用函数本身表示。\n\n\n\n\n\n$f^{\\\\prime}\\\\left(\
  \ x \\\\right) = \\\\frac{- 1}{\\\\left( {1 + e^{- x}} \\\\right)^{2}}\\*e^{- x}\\\
  *\\\\left( {- 1} \\\\right) = \\\\frac{e^{- x}}{\\\\left( {1 + e^{- x}} \\\\right)^{2}}\
  \ = f\\\\left( x \\\\right)\\\\left( {1 - f\\\\left( x \\\\right)} \\\\right)$\n\
  \n图 10.25 显示了一个 MLP 的数值示例。\n\n![](img/f10-26.jpg)\n\n图 10.25  示例 MLP 数值示例\n\n为简化计算过程，省略了偏置输入。但用户应牢记，在\
  \ MLP 的实现中应包含偏置。设学习率 `η` = 0.1，第一输入模式为 `[2,3]`，实际输出为 1。\n\n`h[1] = x[1] * m[11]\
  \ + x[2] * m[21] + m[01]` ⇒ `h[1] = 2 * 0.11 + 3 * 0.21 = 0.85`\n\n`h[2] = x[1]\
  \ * m[12] + x[2] * m[22] + m[02]` ⇒ `h[2] = 2 * 0.12 + 3 * 0.0.8 = 0.48`\n\n$H_{1}\
  \ = f\\left( h_{1} \\right) = \\frac{1}{\\left( {1 + e^{- h_{1}}} \\right)} = \\\
  frac{1}{\\left( {1 + e^{- 0.85}} \\right)} = 0.70$\n\n$H_{2} = f\\left( h_{2} \\\
  right) = \\frac{1}{\\left( {1 + e^{- h_{2}}} \\right)} = \\frac{1}{\\left( {1 +\
  \ e^{- 0.48}} \\right)} = 0.61$\n\n`y[1] = h[1] * w[11] + h[2] * m[22] + w[01]`\
  \ ⇒ `y[1] = 0.70 * 0.14 + 0.61 * 0.15 = 1.895`\n\n$Y_{1} = f\\left( y_{1} \\right)\
  \ = \\frac{1}{\\left( {1 + e^{- y_{1}}} \\right)} = \\frac{1}{\\left( {1 + e^{-\
  \ 0.895}} \\right)} = 0.86$\n\n误差项\n\n`δ[1] = (O[1] - Y[1]) * f′ = (O[1] - Y[1])\
  \ * f(y[1]) * (1- f(y[1]))`\n\n`= (1- 0.86) * f(1.895) * (1 - f(1.895))`\n\n`= 0.14\
  \ * 0.86 * 0.14 = 0.017`\n\n隐藏层与输出层之间的权重调整\n\n`Δw[11] = 0.1 * 0.017 * 0.70 = 0.0012`\n\
  \n`Δw[11] = 0.1 * 0.017 * 0.61 = 0.0001`\n\n从输出层到隐藏层的误差反向传播\n\n`δh[1] = δ[1] * w[11]\
  \ = 0.017 * 0.14 = 0.0024`\n\n`δh[2] = δ[1] * w[21] = 0.017 * 0.15 = 0.0025`\n\n\
  `δH[1] = δh[1] * f′(h[1]) = 0.0024 * 0.70 * 0.30 = 0.0050`\n\n`δH[2] = δh[2] * f′(h[2])\
  \ = 0.0025 * 0.61 * 0.39 = 0.0006`\n\n输入层与隐藏层之间的权重调整\n\n`∆m[11] = 0.1 * 0.005 *\
  \ 2 = 0.001`\n\n`∆m[12] = 0.1 * 0.0006 * 2 = 0.00012`\n\n`∆m[21] = 0.1 * 0.005 *\
  \ 3 = 0.0015`\n\n`∆m[12] = 0.1 * 0.0006 * 3 = 0.00018`\n\n所有权重的更新\n\n`w[11] (new)\
  \ = w[11] (old ) + ∆w[11] = 0.14 + 0.0012 = 0.1412`\n\n`w[21] (new) = w[21] (old\
  \ ) + ∆w[21] = 0.15 + 0.0010 = 0.1510`\n\n`m[11] (new) = m[11] (old ) + ∆m[11] =\
  \ 0.11 + 0.001 = 0.111`\n\n`m[12] (new) = m[12] (old ) + ∆m[12] = 0.12 + 0.00012\
  \ = 0.12012`\n\n`m[21] (new) = m[21] (old ) + ∆m[21] = 0.21 + 0.0015 = 0.2115`\n\
  \n`m[22] (new) = m[22] (old ) + ∆m[22] = 0.08 + 0.00018 = 0.08018`\n\n反向传播伴随着一些挑战。其中，最显著的有如下几点：\n\
  \n•选择正确的学习率：学习率是一个超参数，决定了参数更新的频率。如果学习率需要更高，训练过程可能会延迟并陷入局部最小值。相反，如果学习率过高，训练过程可能会发散并在理想答案附近振荡。\n\
  \n•处理消失和爆炸梯度：随着梯度通过各种神经网络层级，它们可能会变得极小或非常巨大。这可能导致参数变化过少或过多，从而不利地影响性能或导致数值不稳定。\n\n\
  •防止过拟合和欠拟合：过拟合发生在神经网络被记忆性训练但无法推广到新数据时。相反，当神经网络欠拟合时，它在训练和测试数据集上都难以处理，无法从训练集中学习。可以使用多种正则化方法，包括\
  \ dropout、权重衰减、批归一化和数据增强，来避免过拟合和欠拟合。\n\n尽管存在这些障碍，反向传播仍然是训练神经网络的可靠且有价值的工具。凭借正确的设计决策和优化技术，反向传播可以帮助神经网络在各种任务和领域上表现出色。\n\
  \n### 10.7 自编码器\n\n10.7 自编码器\n\n自编码器是一种无监督神经网络，可以学习编码和解码数据。它有助于特征提取、生成建模、数据压缩和降维。自编码器由编码器和解码器两个组件组成（图\
  \ 10.26）。编码器将输入数据 `x` 转换为潜在表示 `z`，其通常比 `x` 更简单。解码器使用 `z` 尝试即时重建 `x`。重建误差被用作训练网络的反馈信号。自编码器旨在学习数据的简洁且有意义的表示，同时保持其基本特征。\n\
  \n![](img/f10-27.jpg)\n\n图 10.26  简单自编码器\n\n自编码器有各种类型：\n\n•线性自编码器：这种自编码器是最简单的，使用线性变换同时进行编码和解码（图\
  \ 10.27）。它与主成分分析 (`PCA`) 相当，后者识别数据中捕获最大方差的正交方向。解码器尝试创建与输入完全相同的输出。\n\n![](img/f10-28.jpg)\n\
  \n图 10.27  线性自编码器\n\n•去噪自编码器：这会向输入数据 (`x`) 引入噪声，然后尝试恢复原始干净数据。这迫使网络学习数据的基本结构并忽略不重要的像素（图\
  \ 10.28）。\n\n![](img/f10-29.jpg)\n\n图 10.28  去噪自编码器\n\n•稀疏自编码器：这种类型对潜在表示 `z` 施加稀疏约束，限制任何给定时间激活单元的数量。这使网络能够学习独立、稀疏且更易理解的特征（图\
  \ 10.29）。\n\n![](img/f10-30.jpg)\n\n图 10.29  稀疏自编码器\n\n•变分自编码器：这些自编码器将潜在表示 `z` 建模为随机分布而不是确定性向量。这使网络能够推断潜在变量并从学习到的分布中生成新样本（图\
  \ 10.30）。\n\n![](img/f10-31.jpg)\n\n图 10.30  变分自编码器逻辑\n\n•对抗自编码器：这里，自编码器采用对抗训练方法，其中编码器-解码器网络试图欺骗判别器网络。相反，判别器网络寻求区分真实样本和伪造样本。这种类型的结果是更准确和多样化的数据重建（图\
  \ 10.31）。\n\n![](img/f10-32.jpg)\n\n图 10.31  对抗自编码器\n\n自编码器用于各种应用，包括：\n\n•图像处理：自编码器可用于人脸识别、人脸压缩、去噪、在画、超分辨率、着色和风格迁移。\n\
  \n•NLP：自编码器可执行文本摘要、释义、翻译、情感分析、主题建模和创作。\n\n•语音处理：自编码器有助于增强、压缩、识别、合成和转换语音。\n\n•推荐系统：自编码器可应用于基于内容、协同、混合和冷启动问题。\n\
  \n•异常检测：自编码器能够检测异常，如异常值、欺诈、入侵、错误和疾病。\n\n然而，自编码器也面临一些挑战，例如：\n\n\n\n\n\n## 自编码器挑战\n\
  \n- **过拟合**：自编码器可能会学习记忆输入数据，而不是对新数据进行泛化。像 `dropout`、`weight decay` 或 `early stopping`\
  \ 这样的正则化策略可以帮助缓解这个问题。\n- **欠拟合**：自编码器可能会遗漏复杂的数据结构或在编码时丢失一些关键信息。可以使用更深或更大的网络，以及添加\
  \ `classification` 或 `clustering` 等额外任务来改善这一点。\n- **模式崩溃**：由于潜在空间缺乏多样性或表达能力，自编码器可能会对各种输入给出相似或相同的输出。利用对抗或变分方法并对潜在空间施加限制或惩罚可以防止这种情况。\n\
  - **可解释性**：自编码器可能会获得难以理解的潜在表示。可以通过可视化或探测潜在空间，或采用稀疏或可 disentangled 的表示来改善这一点。\n\n\
  因此，自编码器是一种强大且灵活的无监督学习工具，可以训练以高效有效地编码和解码数据。它们在许多领域和学科中有多种用途，但也存在重大问题和限制，需要进一步研究和改进。\n\
  \n# 10.8 ANNs 的应用\n\nANNs 可以从照片和视频中学习，以识别物体、人脸、场景、情绪和其他视觉方面。它可用于 NLP。让我们研究 ANN 的一些其他应用。\n\
  \n## 10.8.1 使用 ANNs 进行图像识别\n\n识别和将图像分类到多个预定义类别之一的过程称为图像识别。它是 ANNs 最受欢迎的用途之一。ANNs\
  \ 非常适合图像识别和其他计算机视觉问题，因为它们可以从示例中学习并在数据中发现模式。\n\n使用 ANNs 进行图像分析和识别的一些优点如下：\n\n- 它们在处理复杂和高维数据时需要较少的准备。\n\
  - 它们可以利用无监督或半监督学习技术从大量标记不足或未标记的数据中学习。\n- 它们可以在各种基准上以先进的水平执行，并在某些活动中超过人类准确性。\n\n\
  然而，使用 ANNs 进行图像分析和识别存在一些困难和限制，例如：\n\n- 它们需要大量内存/处理能力来运行和训练。\n- 如果数据不够充分和具有代表性，它们容易过拟合和欠拟合。\n\
  - 它们容易受到对抗性攻击；其中恶意输入被用来欺骗或操纵它们。\n- 它们的决策和结果不可解释或无法解释。\n\n使用 ANNs 进行图像识别的主要步骤如下：\n\
  \n1. **图像预处理**：这涉及将原始图像数据转换为 ANNs 可使用的格式，例如通过调整大小、裁剪、归一化、增强等。\n2. **特征提取**：此过程涉及筛选图像数据以查找和提取有意义的信息，例如边缘、角、形状、颜色、纹理等。CNNs\
  \ 可用于自动或手动完成此任务。此外，特征检测器或滤波器可以被设计来手动完成此操作。\n3. **分类**：这涉及根据其特征对图像进行标记，例如猫、狗、汽车等。可以使用全连接或\
  \ softmax 层，即可以线性或非线性地改变特征并输出每个类别概率的神经元层来完成此操作。\n4. **评估**：这涉及衡量 ANN 在准确率、精确率、召回率、F1\
  \ 分数和其他图像识别任务中的表现。这可以通过使用验证或测试集来实现，这些集合是未用于训练 ANN 的图像集合，而是用于衡量其泛化能力。\n\n## 10.8.2\
  \ 使用 ANNs 进行自然语言处理\n\n自然语言处理（NLP）是 ANNs 的知名应用。ANNs 可以学习从文本或语音数据中理解和创建自然语言。它们可以执行各种任务，包括情感分析、机器翻译、文本摘要、问答、对话系统、文本生成等。\n\
  \nANNs 能够从数据中学习而无需显式规则或特征是其主要优势之一。它们适合处理复杂和多样的自然语言输入，这些输入通常包含歧义、不确定性和噪声。我们必须将自然语言数据转换为人工神经元可以理解的数值格式才能使用\
  \ ANNs 进行 NLP；这可以通过词嵌入、字符嵌入和子词嵌入来实现。这些方法将单词或子词的语义和句法特征转换为整数向量。一旦我们有了它们的数值表示，我们就可以根据目的和架构将不同类型的\
  \ ANNs 馈入自然语言数据。\n\n### NLP 中使用的 ANN 类型\n\n- **前馈神经网络（FNNs）**：这些 ANNs 是最简单的类型，将信息从输入层通过一个或多个隐藏层传递到输出层。例如，当文本是输入，输出是标签或分数时，可以使用\
  \ FNNs 执行文本分类或情感分析等任务。\n- **循环神经网络（RNNs）**：RNNs 能够处理顺序数据，例如句子或段落。RNNs 具有内存系统，使其能够保留和访问主要数据。RNNs\
  \ 可用于输入和输出均为词序列的任务，如文本摘要或机器翻译。\n- **卷积神经网络（CNNs）**：CNNs 能够检测输入数据中的细微变化和特征。CNNs 通过将滤波器或核应用于输入来创建特征图。当文本是输入，标签或分数是输出时，可以使用\
  \ CNNs 执行文本分类或情感分析等任务。\n- **Transformer 网络**：Transformer 网络是 ANNs 的子集，它们通过使用注意力过程学习各种输入组件之间的连接。网络可以专注于对每个输出组件最相关的数据，这要归功于注意力过程。Transformer\
  \ 网络可用于输入和输出均为词序列的应用，例如机器翻译或问答。\n\n### ANNs 在 NLP 中的挑战\n\n- 它们需要大量数据和计算能力来训练和竞争。\n\
  - 对于资源有限的语言或领域，它们可能遇到数据稀缺或稀疏的问题。\n- 由于数据或模型中的错误或偏差，它们可能会产生荒谬或不合适的输出。\n- 它们可能无法捕捉自然语言的细微差别或复杂性，例如讽刺、幽默、反讽或语用学。\n\
  - **数据质量和数量**：ANNs 为了训练良好，需要大量标记或未标记的数据。然而，并非所有自然语言数据都是可访问的、可靠的或具有代表性的。此外，一些自然语言数据中的偏差、不准确或不一致可能会影响\
  \ ANNs 的准确性和公平性。\n- **可解释性和可解释性**：ANNs 有时被视为黑盒模型，因为它们不能清楚地解释或证明其选择或结果。当 ANNs 用于\
  \ NLP 中敏感或关键的任务时，这可能会带来伦理、法律和社会问题。这也可能阻止 ANNs 被修复和改进。\n- **泛化和适应**：ANNs 可能难以适应与训练数据不同的新任务、语言或领域。这可能会限制它们在\
  \ NLP 中的使用和可扩展性。此外，动态或随时间变化的自然语言输入可能会使 ANNs 变得不那么适应。\n\n以下是使用 ANNs 在 NLP 中的一些好处：\n\
  \n- 它们可以使用分布式表示来捕捉自然语言的语义和句法方面。\n\n\n\n\n- 它们可以使用 `transformers` 或 `RNNs` 来模仿自然语言的顺序性和上下文相关性。\n\
  - 它们可以使用大型预训练模型，这些模型可以针对任务或领域进行定制，例如 `BERT` 或 `GPT-3`。\n- 它们可以使用注意力机制或 beam search\
  \ 生成流畅连贯的自然语言输出。\n- 多模态和多模态：`ANNs` 可以处理各种自然语言数据格式，包括文本、语音、照片和视频。这可能使 NLP 应用和交互更加多样化和丰富。此外，`ANNs`\
  \ 可以使用多种模态的自然语言输入来提高其功能和性能。\n- 迁移学习和预训练：`ANNs` 可以利用其知识在新任务上表现更好或在现有任务上提高性能。这可以降低训练\
  \ `ANNs` 所需的信息量和计算量。此外，`ANNs` 可以在大量未标记数据上预先训练，以发现可以为特定任务完善的广泛表示。\n- 生成新的连贯自然语言内容，例如文本、诗歌、小说或对话，是\
  \ `ANNs` 的优势。这可能使 NLP 应用和交互更具想象力和表现力。此外，`ANNs` 生成的自然语言内容可以针对特定受众、情况或目标进行定制。\n\n\
  ### 10.8.3 使用 ANNs 进行自动化决策\n\n自动化决策 `ADM`，即在没有人工干预的情况下做出决策，是 `ANNs` 的新应用之一。`ADM`\
  \ 在金融、医疗、安保和交通等需要可扩展性、精确性、一致性和速度的行业中可能很有帮助。然而，`ADM` 也伴随着若干风险和困难，包括道德、法律、社会和技术问题。\n\
  \n使用 `ANNs` 进行 `ADM` 有许多好处，包括其处理非线性和高维数据的能力。在无需显式特征工程或领域专业知识的情况下，`ANNs` 可以从庞大、多样的数据集中发现复杂的模式和相关性。这使它们适合处理涉及模糊性、不确定性和不确定性的问题。例如，`ANNs`\
  \ 可以识别欺诈、识别疾病、提供产品推荐并个性化学习。\n\n`ANNs` 用于 `ADM` 的多功能性和可扩展性是另一个优点。随着环境变化，`ANNs` 可以用新数据进行更新和训练，使其能够适应不断变化和动态的条件。此外，通过修改其架构、参数和激活函数，`ANNs`\
  \ 也可以为各种任务和目标创建和优化。例如，`ANNs` 可用于优化资源分配、预测消费者行为、生成内容和管理机器人。\n\n然而，使用 `ANNs` 进行 `ADM`\
  \ 存在一些必须考虑的缺点。其中一个主要缺点是它们需要可解释性和透明度。`ANNs` 通常被视为黑箱，提供结果而不说明其得出结果的方式。这使得理解、验证和信任其判断变得困难，特别是当这些判断影响人们的生活和福祉时。例如，`ANNs`\
  \ 可用于拒绝贷款、拒绝申请者、评分任务和解雇员工。\n\n另一个缺点是使用 `ANNs` 进行 `ADM` 时可能存在偏见和错误。`ANNs` 在训练时继承并放大数据中已有的偏见和缺陷，可能导致不公平和错误的結果。此外，改变\
  \ `ANN` 输入或输出以造成伤害或麻烦的对抗性攻击也可能成为问题。例如，`ANNs` 可能偏袒少数群体、传播虚假信息、伪造图像并渗透计算机系统。\n\n因此，使用\
  \ `ANNs` 进行 `ADM` 的利弊取决于领域和环境，必须仔细权衡。`ANNs` 可以为复杂问题提供稳健和灵活的解决方案，但也带来需要谨慎和责任感的伦理和技术问题。\n\
  \n在没有人工输入或监督的情况下，`ADM` 指的是基于数据和算法做出选择或采取行动。`ANNs` 和其他 AI 技术如基于规则的系统、决策树或机器学习可用于实现\
  \ `ADM`。`ADM` 可用于各种活动，包括自动驾驶汽车、推荐系统、互联网广告、欺诈检测等。\n\n`ANNs` 和 `ADM` 具有以下共同特征：\n-\
  \ 它们是数据驱动的。它们使用大量数据来发现模式、预测未来或提供建议。\n- 它们是可适应的。它们可以改变其参数或规则以适应新情况和环境。\n- 它们可以扩展。它们可以成功处理复杂和高维数据集。\n\
  - 它们是开放和诚实的。它们可以证明或解释其选择或行为。\n\n然而，`ANNs` 和 `ADM` 也面临一些困难和限制：\n- 它们有偏见。它们使用的數據或算法中的偏见可能被它们继承或放大，这可能导致对特定群体或个人不公平或歧视性的结果。\n\
  - 它们容易出错。它们使用的数据或方法可能包含噪声、异常值、异常或对抗性攻击，导致它们出错或表现不佳。\n- 它们需要更精确。由于其复杂性或缺乏支持文档或问责程序，它们可能难以理解或解释。\n\
  - 它们是道德的。它们对人权、价值观、自主性、尊严、隐私和安全的影响可能引发道德问题。\n\n因此，为了确保其质量、可靠性、公平性、问责性和社会责任，`ANNs`\
  \ 和 `ADM` 需要详细的设计、评估、监管和治理。\n\n以下是 `ANNs` 和 `ADM` 应用的一些示例：\n- Google 的 DeepMind\
  \ AlphaGo：一个基于 `ANN` 的程序，在复杂的棋盘游戏围棋中击败了世界冠军。\n- IBM 的 Watson：一个基于 `ANN` 的系统，使用大量结构化和非结构化数据源来回答各种主题的自然语言查询。\n\
  - Facebook 的 News Feed：一个基于 `ADM` 的系统，根据用户偏好和使用模式调整用户在社交媒体平台上看到的内容。\n- 亚马逊的 Alexa：一个基于\
  \ `ADM` 的系统，提供语音服务，包括信息检索、娱乐、商业和智能家居控制。\n\n### 10.8.4 使用 ANNs 进行时间序列分析\n\n通过时间分析顺序数据的模式和趋势的技术被称为时间序列分析。它在金融、经济、工程、医学等多个行业中有许多用途。时间序列分析的一些重要问题是数据中变量之间复杂和动态的相互作用，以及可能改变观测值的的不确定性和噪声。\n\
  \n`ANNs` 用于时间序列分析的主要优势如下：\n- `ANNs` 可以处理数据中变量之间的非线性和复杂相互作用，而传统统计技术可能无法做到。\n- `ANNs`\
  \ 可以从大量数据中学习并很好地推广到新场景，从而提高预测能力和准确性。\n- `ANNs` 可以处理缺失或嘈杂的数据并包含各种信息来源，这可以提高研究的准确性和可靠性。\n\
  \n使用 `ANNs` 进行时间序列分析有几个缺点：\n- 训练和评估 `ANNs` 所需的时间/资源可能会限制其可扩展性和效率。\n- `ANNs` 有时被称为黑箱模型，这意味着很难理解或分析其内部逻辑。\n\
  - 过拟合或欠拟合问题可能导致 `ANNs` 过度记忆训练数据或未能捕捉其基本特征。\n\n\n\n\n\n### 时间序列分析中 ANN 的实际应用：\n\n\
  • 预测 `stock prices`、`currency exchange rates`、`inflation rates` 等。\n• 查找异常值、欺诈、奇异点等。\n\
  • 对语音信号、脑电图、心电图等进行分类。\n• 生成文本、图形、音乐等。\n\n## 10.8.5 使用 ANN 进行网络安全\n\n网络安全是当代世界中最重要且最具挑战性的领域之一。随着数字设备和网络的使用增加，网络攻击、数据泄露和恶意软件感染的危害也在上升。网络安全专家需要利用各种技术和方法对这些攻击进行持续监控、检测和预防。\n\
  \nANN 在网络安全应用中具有多种优势：\n\n• 它们可以处理庞大、多样的数据集，包括网络流量、日志、图片、文本等。\n• 它们无需手动升级，因为它们可以从新数据中学习并适应不断变化的情况。\n\
  • 它们可以捕捉到传统技术可能遗漏的细微模式和异常。\n• 它们可以提供易于理解和解释的结果，帮助安全分析师确定风险的类型和来源。\n\n让我们看看 ANN 如何应用于各种网络安全活动。\n\
  \n入侵检测是识别和响应网络或系统上可疑或恶意活动的过程。通过学习将网络流量或系统事件分类为正常或异常类别，ANN 可用于入侵检测。例如，ANN 可以使用网络数据包或系统日志的数据集进行训练，以识别指向攻击或入侵的模式。除了检测异常外，ANN\
  \ 还可以生成警告或反应。\n\n分析并理解恶意软件的特征和行为，例如病毒、蠕虫、特洛伊木马、勒索软件等的做法被称为恶意软件分析。通过训练它们根据特征或行为识别和分类恶意软件样本，ANN\
  \ 可用于恶意软件分析。例如，ANN 可以使用恶意软件二进制文件或执行跟踪的数据集进行训练，以识别恶意软件的类型、家族或功能。ANN 还可用于生成签名或规则以检测或阻止恶意软件感染。\n\
  \n网络钓鱼检测是观察和阻止伪造的电子邮件或网站，这些电子邮件或网站试图欺骗用户泄露个人信息或执行破坏性行为。通过学习根据其内容或外观区分真实和网络钓鱼电子邮件或网站，ANN\
  \ 可用于网络钓鱼检测。例如，ANN 可以在电子邮件或网页的数据集上进行训练，以识别指向网络钓鱼企图的特征，例如伪造的发件人地址、欺骗性链接、紧急请求等。ANN\
  \ 可以向遇到网络钓鱼电子邮件或网站的用户发出警告或建议。\n\n识别并从用户邮箱中删除不需要或未经请求的电子邮件的行为称为垃圾邮件过滤。通过学习根据其内容或元数据将电子邮件分类为垃圾邮件或正常邮件（非垃圾邮件），ANN\
  \ 可用于垃圾邮件过滤。例如，ANN 可以在电子邮件集合上进行训练，以识别垃圾邮件特征，例如关键词、附件、发件人声誉等。ANN 可提示用户对收到的垃圾邮件采取反馈或操作，例如删除、报告或阻止它们。\n\
  \n因此，ANN 在多方面优于传统的网络安全技术。我们在使用 ANN 进行网络安全时面临的一些困难和限制如下：\n\n• 可扩展性：ANN 需要大量数据和计算能力进行训练和运行。这对网络安全应用构成了障碍，因为数据可能稀疏、嘈杂、不平衡或动态。此外，由于网络威胁形势不断演变，ANN\
  \ 必须经常适应和升级其模型。为了处理网络安全数据和事件的复杂性和多样性，ANN 必须具有可扩展性和适应性。\n• 鲁棒性：由于 ANN 易受对抗性攻击的影响，即恶意行为者影响输入数据或模型参数，由\
  \ ANN 做出预测或决策可能不准确或具有误导性。例如，攻击者可以创建对抗性示例，即有效输入的轻微修改版本，以欺骗 ANN 错误地对其进行分类。这对网络安全应用可能产生重大影响，因为攻击者可以绕过监控或预防措施，触发误报，或错误诊断问题。因此，ANN\
  \ 必须坚固且对敌对攻击具有抵抗力，以确保其在网络安全中的可靠性和准确性。\n• 隐私：ANN 通常使用敏感和私密数据来训练和运行其模型。由于数据可能包含不应发布或泄露的私人或机密信息，这对网络安全应用提出了隐私问题。例如，ANN\
  \ 需要访问用户行为或网络流量数据来查找异常或恶意活动。然而，这些数据也可能泄露相关用户或组织的身份或偏好。因此，ANN 必须尊重并保护数据提供者和用户的隐私，并确保其遵守所有适用的法律和法规。\n\
  • 伦理：ANN 可能改变网络安全应用中利益相关者的权利和义务，这可能对这些应用产生伦理影响。例如，ANN 可能会做出影响用户或组织安全或福祉的决策或建议。与此同时，这些决策或建议可能对审计员或人类用户来说并不明显或不可理解。此外，这些决策或建议可能对所有相关方都不公正或不公平。因此，ANN\
  \ 必须维护伦理标准和价值观，并确保其对网络安全负责和问责。\n\n## 10.8.6 使用 ANN 进行预测分析\n\n预测分析是 ANN 的一种应用，它使用数据、统计方法和\
  \ ML 方法来发现模式和趋势。企业和组织可以利用预测分析来改善决策、简化流程、降低风险并提高生产力。\n\nANN 能够处理非线性和高维数据，这在许多行业中很常见，包括银行、医疗保健、营销和教育，这一点是其优势之一。\n\
  \n金融：ANN 有助于预测股票价格、汇率、信用风险、欺诈检测、投资组合优化等。例如，ANN 可以通过从历史数据和市场指数中学习来估计金融资产的未来走势。此外，金融机构可以使用\
  \ ANN 来评估客户的信用状况并发现欺诈活动。ANN 还必须在金融领域处理数据质量、可解释性、立法和伦理问题。\n\n医学：ANN 可用于识别疾病、预测结果、建议疗法和个性化护理。例如，ANN\
  \ 可以分析医学影像、基因组数据、电子健康记录和可穿戴设备，以识别异常、分类疾病并推荐干预措施。此外，ANN 可以帮助医疗从业者优化资源、控制成本并提高护理质量。然而，医疗保健\
  \ ANN 还必须处理数据保护、安全、可靠性和信任等问题。\n\n\n\n\n\n## Marketing\n`ANNs` 可应用于消费者细分、行为预测、产品或服务推荐以及活动优化。例如，`ANNs`\
  \ 可通过学习客户数据（包括人口统计、偏好、购买历史和网络活动）来发现趋势和偏好。然后，基于每个客户的预期需求和兴趣，`ANNs` 可帮助营销人员定制其商品和信息。然而，`ANNs`\
  \ 在其营销活动中还必须处理数据收集、同意、开放性和公平性问题。\n\n## Education\n`ANNs` 可用于评估学生的表现、提供建议或反馈、定制课程或内容，以及提高动机或参与度。例如，`ANNs`\
  \ 可分析学生数据，包括测试结果、学习偏好、兴趣和目标，以评估其进展并提供量身定制的批评或帮助。基于每个学生的预期能力或偏好，`ANNs` 还可以帮助教育工作者为他们量身定制课程或教学法。`ANNs`\
  \ 在教育中还必须应对数据可访问性、有效性、偏见和伦理等诸多问题。\n\n## Predictive Analytics Benefits\n使用 `ANNs`\
  \ 进行预测分析有诸多益处。其中之一是其处理输入和输出变量之间复杂和非线性交互的能力。`ANNs` 可以泛化到新场景并从大量数据中学习。它们还可以根据新数据调整权重并适应不断变化的环境。`ANNs`\
  \ 对于涉及推荐系统、自然语言处理、语音识别和图像识别的问题尤其有帮助。\n\n## Predictive Analytics Challenges\n`ANNs`\
  \ 尽管如此，也给预测分析带来了困难。解释和描述 `ANNs` 如何做出预测的难度是其中之一。`ANNs` 通常被称为黑箱，因为它们在隐藏其底层逻辑或推理的同时产生结果。这可能会降低用户和利益相关者对预测的信心。数据欠拟合和过拟合的可能性是另一个困难。当\
  \ `ANN` 从训练数据中学习过多而无法泛化到新数据时，就会发生过拟合；当 `ANN` 从训练数据中学习不足时，就会欠拟合，需要赶上基本模式或特征。过拟合和欠拟合都可能导致预测需要纠正或提高准确性。\n\
  \n## Best Practices\n因此，在将 `ANNs` 应用于预测分析时，遵循一些最佳实践至关重要。其中一些理想实践包括：\n• 选择 `ANN`\
  \ 的 exemplary 架构和设计，包括层数和类型、激活函数和学习算法。\n• 预处理和清理数据，包括删除异常值、缺失数据、噪声和不重要特征。\n• 将数据划分为训练集、验证集和测试集，并使用交叉验证方法评估\
  \ `ANN` 的性能。\n• 对 `ANN` 进行正则化和微调以避免过拟合或欠拟合，使用诸如 dropout、权重衰减、提前停止和超参数调整等技术。\n• 解释和阐述\
  \ `ANN` 的预测，例如，使用可视化工具、特征重要性指标或可解释 AI 方法来理解 `ANN` 的工作原理。\n\n## Applications\n`ANNs`\
  \ 已在以下应用中成功用于预测分析：\n• Netflix 采用 `ANNs` 根据用户评分、口味和行为推荐电影和电视节目。\n• Google 使用 `ANNs`\
  \ 根据用户的 demographics、搜索历史和浏览模式预测用户将点击哪些广告。\n• Amazon 采用人工神经网络（`ANNs`）根据过往购买、浏览模式和推荐预测客户将购买的产品。\n\
  • 根据用户的点赞、评论、分享和兴趣，Facebook 采用 `ANNs` 预测他们会感兴趣的帖子或内容。\n\n## 10.9 Future of ANNs\n\
  正如我们所见，`ANNs` 可以执行复杂的任务，包括分类、回归、聚类、生成、强化学习和从数据中学习。`ANNs` 已在多个领域得到广泛应用，包括机器人技术、计算机视觉、NLP、语音识别和医疗保健。我们现在将讨论\
  \ `ANNs` 对社会的影响、当前 `ANN` 研究趋势、`ANN` 技术的最新发展以及 `ANN` 的未来潜在方向。\n\n### Effect on Society\n\
  `ANNs` 在许多领域对社会产生了重大影响。它们使得能够实现新的程序和服务，从而提高生产力和效率，激发创造力并提高生活质量。以下是这些应用和服务的几个实例：\n\
  • 人脸识别：`ANNs` 能准确快速地在图片和视频中识别人脸。这可用于安全、身份、身份验证和社交媒体。\n• 机器翻译：`ANNs` 可准确地将语音/文本从一种语言翻译成另一种语言。这可应用于商业、旅游、教育和沟通。\n\
  • 自动驾驶汽车：`ANNs` 能够自主地操控、加速、制动和导航车辆。这可用于娱乐、便利、安全和交通。\n• 图像生成：`ANNs` 可根据文本或草图生成逼真的视觉效果。这可用于教育、游戏、设计和艺术。\n\
  • 推荐系统：`ANNs` 能够分析用户行为和偏好，以提供针对商品、服务、信息或活动的个性化建议。这可应用于社交网络、电子商务、娱乐和教育。\n\n虽然 `ANNs`\
  \ 对社会带来了显著益处，但它们也带来了必须管理的重大风险和问题。其中这些困难和风险包括：\n• 伦理问题：`ANNs` 可能引发涉及人类尊严、隐私、正义、问责和开放性的道德问题。例如，我们如何保护\
  \ `ANNs` 训练和推断所使用的私人信息？我们如何确保 `ANNs` 不会污名化或伤害特定种族或族群？我们如何追究 `ANNs` 或其创建者的行为或结果的责任？我们如何告知用户或其他利益相关者\
  \ `ANNs` 所做出的选择或行动？我们如何在尊重 `ANNs` 的同时保持人们的自主性和尊严？\n• 社会影响：`ANNs` 可能影响就业、教育、文化和人际关系等社会方面。例如，`ANNs`\
  \ 将如何影响劳动力市场和员工所需的技能？`ANNs` 将如何影响我们的教学和学习方式？`ANNs` 将对我们的社会和价值观产生什么影响？`ANNs` 将如何影响我们的情感和社交互动？\n\
  • 安全问题：`ANNs` 可能受到滥用或攻击，从而危及其完整性或功能。例如，我们如何阻止或识别导致 `ANNs` 分类或错误预测事物的对抗性示例？我们如何阻止或减少破坏或劫持\
  \ `ANNs` 的有害尝试？如何阻止或控制 `ANNs` 的未经授权或有害使用？\n\n### Research Trends\n`ANN` 研究领域活跃且动态，不断变化和改进。以下是\
  \ `ANN` 研究中的一些当前趋势：\n• 深度学习：深度学习是 ML 的一个子集，使用深度神经网络（`DNNs`），它包含多个人工神经元层，可以学习数据的分层表示。`DNNs`\
  \ 在图像识别、语音合成、自然语言理解和游戏玩法等多个任务中表现出色。`CNNs`、`RNNs`、`GANs`、Transformer 网络（`TNNs`）和图神经网络（`GNNs`）是一些常见的\
  \ `DNN` 类型。\n\n\n\n\n\n## 元学习\n元学习（使用神经网络从数据中学习。元学习的目的是增强神经网络在各种任务或领域中的泛化、适应和迁移能力。学习学习、神经架构搜索（`NAS`）和少样本学习是一些流行的元学习技术。\n\
  \n# 神经符号学习\n机器学习的一个子领域，将符号思维与神经网络融合。神经符号学习通过将神经网络与程序、知识库和逻辑融合，力求提高神经网络的表现力、可解释性和鲁棒性。神经逻辑网络（`NLN`）、神经定理证明器（`NTP`）和神经符号概念学习器（`NSCL`）是神经符号学习的一些知名技术。\n\
  \n# 技术进展\n`ANN`技术不断发展和改进，以协助`ANN`应用和服务的创建与实现。`ANN`技术的一些最新发展包括：\n\n## 硬件\n硬件是`ANN`技术的重要组成部分，为大规模神经网络的训练和推理提供所需的计算能力和内存。提供`ANN`操作卓越性能和效率的专用芯片包括图形处理单元（`GPUs`）、张量处理单元（`TPUs`）、神经形态芯片和量子芯片。这些是硬件方面的一些最新突破。\n\
  \n## 软件\n软件为创建和实现神经网络提供所需的工具和框架，是`ANN`技术的另一个关键要素。开源库如`TensorFlow`、`PyTorch`、`Keras`和`JAX`，提供`ANN`构建的高灵活性和易用性，是软件方面的最新进展之一。\n\
  \n## 数据\n数据是`ANN`技术的重要组成部分，因为它为神经网络提供训练和测试所需的知识和信息。用于`ANN`学习的大规模数据集包括`ImageNet`、`Wikipedia2Vec`、`Common\
  \ Crawl`和`Open AI Codex`，以及其他近期的数据创新。\n\n# 其他前景\n随着`ANNs`不断进步和变化以满足社会的需求和期望，它们拥有光明的前景。未来`ANNs`可能朝以下方向发展：\n\
  \n## 类人智能\n`ANN`研究的长期目标是开发能够执行人类能够完成的任何智力工作的神经网络。为了拥有与人类相当的智能，神经网络必须具备常识、创造力、情感、意识和自我意识等技能。人工通用智能（`AGI`）、人工超智能（`ASI`）和人工意识（`AC`）是一些可用于开发类人智能的方法。\n\
  \n## 脑机接口\n这种`ANN`技术的尖端应用旨在将神经网络与人类大脑连接起来。脑机接口可能使人类与机器之间、以及个人之间实现交互和直接通信。脑机接口可改善认知、记忆、学习、感知和情感。潜在的缺点包括道德、社会和安全问题。\n\
  \n## 人工生命\n人工生命是`ANN`技术的未来应用，目标是创造具有生命特征的合成生物或生态系统。人工生命可能促进新形态、新模式或生命过程的演化。它可能为太空探索、生物工程、环境保护和科学研究提供优势。人工生命也可能在伦理、社会和安全方面带来挑战。\n\
  \n## 总结\n• 神经网络由三层组成：输入层、隐藏层和输出层。\n• 人工神经网络（`ANNs`）是一种模仿生物神经网络，如大脑的形式和运作的计算系统。`ANNs`中存在一组相互连接的组件，称为人工神经元，它们处理并向其他神经元传递信号。通过根据学习算法调整权重以减少预期输出与实际输出之间的误差，`ANNs`可以从数据中学习\n\
  • 前馈神经网络（`FNN`）就像一条单行道。信息在没有任何循环或反馈的情况下从输入移动到输出。\n• 卷积神经网络（`CNN`）主要用于理解视觉数据，就像我们的大脑解释图像一样。它对图像的各个部分应用滤波器或特征检测器以找到模式和形状\n\
  • 循环神经网络（`RNN`）是一种具备记忆的网络。它可以处理文本和其他序列数据类型，如时间序列。\n• 长短期记忆（`LSTM`）网络是一种`RNN`形式，擅长识别序列数据中的长期依赖关系。\n\
  • 生成对抗网络（`GAN`）是一种独特的网络，其中两个模型，生成器和判别器，被竞争性地相互对抗。\n• 自组织映射（`SOMs`）在保持数据拓扑结构的同时，提供高维数据集合的低维表示。\n\
  • 玻尔兹曼机是一种`ANN`，可以在无监督的情况下学习发现数据中的有趣特征。受限玻尔兹曼机（`RBMs`）可以堆叠形成深度信念网络（`DBNs`），这是一种分层模型，可以从数据中学习多个抽象层次。\n\
  • 模块化神经网络（`MNN`）由多个模块或子网络组成，执行不同的任务或功能。合作模块化神经网络（`CMNNs`）是一种特定的神经网络设计，由多个模块协作解决共同问题。\n\
  • 自编码器是一种无监督神经网络，可以学习编码和解码数据。线性自编码器是最简单的类型，它使用线性变换执行编码和解码。\n\n## 练习\n\n## Part A（客观题）\n\
