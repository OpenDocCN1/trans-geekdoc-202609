  ### Summary\n\n• `Jupyter Notebook` 是数据科学工具包不可或缺的一部分，提供了一个基于 Web 的交互式计算平台，可无缝集成实时代码、方程、叙述性文本和可视化。\n\
  \n• Python 丰富的机器学习库生态系统，如 `scikit-learn`、`TensorFlow` 和 `PyTorch`，可以在笔记本中轻松利用。\n\
  \n• 用户可以在单元格中编写 Python 代码，执行它，并立即看到结果，这对于需要频繁调整和即时反馈的机器学习任务特别有用。\n\n• `Jupyter Notebook`\
  \ 的交互式输出功能对机器学习特别有益，因为它允许创建交互式可视化，有助于理解复杂的数据集和模型。\n\n| APPENDIXA || Model Course\
  \ Structure |\n| --- | --- |\n\n### Option 1\n\nCredits: 5\n\nContacts per week:\
  \ 3 lectures\n\n#### Module I\n\n机器学习导论：什么是机器学习，机器学习历史，机器学习在计算机科学和问题解决中的作用，为什么机器学习，设计与学习，机器学习中的训练与测试，机器学习中的预测和描述性任务，机器学习任务的特征，数据驱动解决方案的缺点，良好的机器学习问题，设计学习系统（机器学习生命周期）。\n\
  \n#### Module II\n\n计算学习理论：计算学习的定义，计算学习理论的目标，计算学习理论的历史，计算学习理论的重要性，计算学习理论中使用的主要方法（`Inductive\
  \ Learning`、`Deductive Learning`、`Abductive Learning`、`Reinforcement Learning`），Probably\
  \ Approximately Correct（`PAC`）学习，机器学习复杂性理论（学习的计算复杂性，空间复杂性，学习的样本复杂性（有限假设空间，无限假设空间），学习的时空复杂性，错误界学习模型，基于实例的学习，惰性与急切学习，生成式学习，计算学习理论的应用（`NLP`、计算机视觉、机器人），计算学习理论的评估指标，计算学习理论的未来方向（深度学习，可解释人工智能（`XAI`）、量子机器学习）。\n\
  \n#### Module III\n\n无监督学习：什么是无监督学习，无监督学习的类型：聚类、异常检测、降维和关联。聚类的类型包括硬聚类和软聚类，`K-Means`\
  \ 聚类，层次聚类，模糊 C 均值聚类，`DBSCAN`，高斯混合模型（`GMMs`），均值漂移聚类，高斯混合密度估计，马尔可夫随机场（`MRFs`），异常检测类型包括隔离森林算法，局部异常因子（`LOF`），单类支持向量机（`OC\
  \ SVM`），降维算法包括 `PCA`，线性判别分析（`LDA`），因子分析（`FA`），核主成分分析（`KPCA`）。`FP-Growth` 算法，`Apriori`\
