  \ Adversarial Networks (GANs)`\n\n### 124\n哪种类型的 `Modular Neural Network (MNN)`\
  \ 由多个模块组成，这些模块合作并相互通信以解决共同问题？\n\na) `Hierarchical Modular Neural Networks (HMNNs)`\n\
  \nb) `Competitive Modular Neural Networks (CPMNNs)`\n\nc) `Recurrent Neural Networks\
  \ (RNNs)`\n\nd) `Generative Adversarial Networks (GANs)`\n\n### 125\n哪种类型的神经网络可以被视为\
  \ `Cooperative Modular Neural Networks (CMNNs)` 的示例？\n\na) `Convolutional Neural\
  \ Networks (CNNs)`\n\nb) `Recurrent Neural Networks (RNNs)`\n\nc) `Modular Neural\
  \ Networks (MNNs)`\n\nd) `Generative Adversarial Networks (GANs)`\n\n### 126\n哪种类型的\
  \ `Modular Neural Network (MNN)` 可促进在不同领域或任务之间转移和重用知识？\n\na) `Hierarchical Modular\
  \ Neural Networks (HMNNs)`\n\nb) `Competitive Modular Neural Networks (CPMNNs)`\n\
  \nc) `Recurrent Neural Networks (RNNs)`\n\nd) `Modular Neural Networks (MNNs)`\n\
  \n### 127\n哪种类型的神经网络可以被视为 `Competitive Modular Neural Networks (CPMNNs)` 的示例？\n\n\
  a) `Convolutional Neural Networks (CNNs)`\n\nb) `Recurrent Neural Networks (RNNs)`\n\
  \nc) `Modular Neural Networks (MNNs)`\n\nd) `Generative Adversarial Networks (GANs)`\n\
  \n### 128\n哪种类型的神经网络可以被视为 `Hierarchical Modular Neural Networks (HMNNs)` 的示例？\n\n\
  a) `Convolutional Neural Networks (CNNs)`\n\nb) `Recurrent Neural Networks (RNNs)`\n\
