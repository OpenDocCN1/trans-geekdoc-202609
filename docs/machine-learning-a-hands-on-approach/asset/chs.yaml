  \ 6.1Introduction\n\n在上一章中，我们讨论了计算学习理论（`CLT`），它是理论计算机科学的一个分支，研究机器学习（`ML`）模型和算法的设计与分析。`ML`模型是数据的数学表示，可以用于预测、分类、聚类等。它们是可以从数据中学习并优化`ML`模型参数的程序。理解`CLT`、`ML`模型和`ML`算法之间的关系的一种方法是使用一个表格，沿着不同的维度对它们进行比较，如\
  \ Table 6.1 所示。\n\nTable 6.1CLT、ML 算法和 ML 模型之间的差异\n\n| Dimension || CLT || ML algorithm\
  \ || ML model |\n| --- | --- | --- | --- |\n| Goal || 提供关于 ML 方法性能和复杂度的理论保证和界限。\
  \ || 找到 ML 模型的最优或接近最优参数，使损失函数最小化或效用函数最大化。 || 捕捉数据的底层结构和规律性，并在此基础上进行预测或决策。 |\n| ---\
  \ | --- | --- | --- |\n| Example || PAC 学习，VC 维数，Rademacher 复杂度等。 || 梯度下降，随机梯度下降，期望最大化，K-means\
  \ 等。 || 线性回归，逻辑回归，神经网络，决策树等。 |\n| Challenge || 处理表达能力与泛化之间的权衡，并应对数据中的不确定性和噪声。 ||\
  \ 找到能够在高维和大规模问题中收敛到良好解的高效可扩展算法。 || 选择合适的模型复杂度和避免数据的过拟合或欠拟合。 |\n\n### 6.2Models in\
  \ Machine Learning\n\n用于`ML`的数据通常由属性和标签组成。属性是描述数据的特征或变量，例如身高、体重、颜色。标签是我们想要预测或解释的结果或目标，例如类别、分类、分数。每个属性和标签的组合称为一个实例，表示数据中的单个观察或示例。\n\
  \n例如，如果我们想根据一个人的血压和血糖水平预测其是否患有糖尿病，那么每个人的血压和血糖水平就是属性，其糖尿病状态就是标签。\n\n实例空间是从属性生成的全部可能实例的集合。结果空间是可以分配给实例的全部可能标签的集合。例如，如果我们有两个属性，血压和血糖水平，每个属性有\
  \ 10 个可能值，则实例空间有 10 × 10 = 100 个可能实例。如果有两个可能标签，糖尿病或非糖尿病，则结果空间有两个可能结果。有时，实例空间和结果空间是相同的，例如当我们想根据相似性将实例聚类成组时。\n\
  \n`ML`模型在数学上表示特征与标签之间的关系。它可以被视为将实例映射到结果的函数。模型可以从数据中使用各种算法和技术进行学习。\n\n总体而言，`ML`模型分为三类：逻辑、几何和概率。\n\
  \n#### 6.2.1Logical Models\n\n逻辑模型是使用规则或条件进行预测或分类的`ML`模型。它们也称为基于规则或树模型，因为它们通常具有树状结构，其中每个节点代表一个规则或条件，每个分支代表一个结果或决策。逻辑模型易于解释和说明，因为它们可以被翻译成遵循如果-那么逻辑的自然语言陈述。\n\
  \n考虑绘制以预测乳腺癌类型的数据，如 Fig. 6.1 所示。\n\n该图显示了基于年龄和肿瘤大小的恶性和良性病例之间的明显分离。给定其年龄和肿瘤大小，我们可以使用此信息创建一个逻辑模型来预测新患者的癌症类型。这样的逻辑模型的一个可能规则可以是：\n\
  \n`if age> a1 and tumour size> t1, then malignant, else benign`\n\n![](img/f6-1.jpg)\n\
  \nFigure 6.1 年龄与肿瘤大小之间的数据图\n\n这是一个基于规则的模型或树模型的简单示例，其中条件（`age > a1 and tumor size\
  \ > t1`）是根节点，结果（`malignant or benign`）是叶节点。条件可以进一步拆分为两个子条件（`age > a1 and tumour\
  \ size > t1`），它们构成树的内部节点。\n\n考虑 Table 6.2 所示的数据。它包含五个属性，其中四个是特征属性，一个是结果属性。有 14 个数据实例，结果属性是`Play_Tennis`，其取值可以是\
