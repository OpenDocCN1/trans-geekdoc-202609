  \nd) RNN 适用于分类任务，而前馈神经网络用于回归任务。\n\n## 64. RNN 中哪种类型的单元使网络能够在完成任务时专注于相关信息，如在句子中回忆单词“India”的示例所示？\n\
  \na) 注意力机制\n\nb) 长短期记忆（LSTM）\n\nc) 门控循环单元（GRU）\n\nd) 循环单元\n\n## 65. 哪种类型的 RNN 专门设计用于解决梯度消失和爆炸问题？\n\
