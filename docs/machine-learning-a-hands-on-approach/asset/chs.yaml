  \nc) 表格数据\n\nd) 序列数据\n\n## 68. 什么决定了 LSTM 网络中应从记忆单元输出的数据？\n\na) 输入门\n\nb) 遗忘门\n\n\
  c) 输出门\n\nd) 记忆单元\n\n## 69. LSTM 网络中哪些门调节记忆单元的进出信息流？\n\na) 输入门、遗忘门和输出门\n\nb) 输入门、输出门和隐藏门\n\
