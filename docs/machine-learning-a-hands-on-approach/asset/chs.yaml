  \ Anaconda 环境中使用 RStudio 进行 R 编程。\n\n### 13.32.3 R 中的 glmnet 包\n\nR 中的 `glmnet`\
  \ 包是用于拟合具有 L1 和 L2 正则化的线性和逻辑回归模型的工具。`glmnet` 包提供了该技术的有效且可扩展的实现，使其成为 ML 和数据科学应用的热门选择。\n\
  \n该库的目的是拟合具有不同类型正则化的广义线性模型（GLMs），例如 LASSO、岭回归或弹性网络。这些方法可以帮助降低模型的复杂性并提高性能，尤其是在处理高维或稀疏数据时。`glmnet`\
  \ 包可以处理各种类型的响应变量，例如高斯、二项式、泊松、Cox 和多项式。\n\n`glmnet` 包可在 ML 中用于各种任务，例如特征选择、分类、回归、生存分析或聚类。该包提供了一个易于使用的接口，用于使用\
  \ `glmnet()` 函数拟合正则化模型，该函数将响应变量、预测变量以及正则化的类型和强度作为参数。该包还提供交叉验证、预测、绘图和模型选择的功能。\n\n\
  `glmnet` 包基于 Friedman 等人在 2010 年发表的一篇论文，该论文描述了正则化 GLM 的算法和理论。该包可在 CRAN 上获得，可使用以下命令安装和加载：\n\
  \n```r\ninstall.packages(\"glmnet\", repos =\"https://cran.us.r-project.org\")\n\
  library(glmnet)\n```\n\n### 13.32.4 R 中的 caret 包\n\n\n\n\n\nThe caret package is\
  \ a popular and powerful package for ML in R. The name `caret` stands for classification\
  \ and regression training, and it provides a consistent interface for training,\
  \ tuning, and evaluating various types of models. The `caret` package can handle\
  \ many tasks related to ML, such as data preprocessing, feature selection, cross-validation,\
  \ model selection, and performance assessment.\n\nOne of the main advantages of\
  \ the `caret` package is that it allows the user to access and compare many different\
  \ algorithms from different R packages using a common syntax and set of arguments.\
  \ For example, the `train()` function can be used to fit a wide range of models\
  \ by specifying the `method` argument. Some of the available methods include linear\
  \ regression, logistic regression, decision trees, random forests, support vector\
  \ machines, and neural networks. The `train()` function also performs automatic\
  \ tuning of model hyperparameters using grid search or random search, and evaluates\
  \ model performance using resampling techniques such as K-fold cross-validation\
  \ or bootstrapping.\n\nAnother useful feature of the `caret` package is that it\
  \ offers several functions for data preprocessing, such as centering, scaling, imputation,\
  \ transformation, and encoding. These functions can be applied to the training data\
  \ and then automatically applied to any new data using the `preprocess` and `predict`\
  \ functions. This ensures that the data is processed consistently and avoids errors\
  \ or inconsistencies when applying the model to new data.\n\nThe `caret` package\
  \ offers several methods for feature selection, such as filter methods (based on\
  \ correlation or importance scores), wrapper methods (based on recursive feature\
  \ elimination or genetic algorithms), and embedded methods (based on regularization\
  \ techniques such as lasso or elastic net).\n\nThe `caret` package has detailed\
  \ documentation and a website ([`topepo.github.io/caret/`](https://topepo.github.io/caret/))\
  \ that contains many examples and tutorials on how to use the package for various\
  \ tasks and applications.\n\n## 13.32.5 R Program for Regularization Techniques\n\
  \nHere is an R program to demonstrate the regularization techniques, Ridge and LASSO.\
  \ Ridge uses L2 norm, which adds the square of the coefficients to the loss function\
  \ while LASSO uses L1 norm, which adds the absolute value of the coefficients to\
  \ the loss function. Ridge tends to shrink all the coefficients equally, while LASSO\
  \ tends to make some coefficients zero. This makes LASSO more suitable for feature\
  \ selection and sparse models\n\n```\n# Load the libraries\n\nlibrary(glmnet)\n\n\
  library(caret)\n\n# Generate some data with 10 features and 100 observations\n\n\
  set.seed(123)\n\nX <- matrix(rnorm(1000), ncol = 10)\n\ny <- X %*% c(1, 2, 3, 4,\
  \ 5, 0, 0, 0, 0, 0) + rnorm(100)\n\n# Split the data into training and testing sets\n\
  \ntrain_index <- createDataPartition(y, p = 0.8, list = FALSE)\n\nX_train <- X[train_index,\
  \ ]\n\ny_train <- y[train_index]\n\nX_test <- X[-train_index, ]\n\ny_test <- y[-train_index]\n\
  \n# Fit a linear model without regularization\n\nlm_model <- lm(y_train ~ X_train)\n\
  \nsummary(lm_model)\n\n# Fit a linear model with ridge regularization\n# Use cross-validation\
  \ to find the optimal value of lambda (the penalty parameter)\n\nridge_model <-\
  \ cv.glmnet(X_train, y_train, alpha = 0, family = \"gaussian\")\n\nplot(ridge_model)\n\
  \n# Fit a linear model with LASSO regularization\n# Use cross-validation to find\
  \ the optimal value of lambda (the penalty parameter)\n\nlasso_model <- cv.glmnet(X_train,\
  \ y_train, alpha = 1, family = \"gaussian\")\n\nplot(lasso_model)\n\n# Compare the\
  \ coefficients of the three models\n\ncoef(lm_model)\n\ncoef(ridge_model, s = \"\
  lambda.min\")\n\ncoef(lasso_model, s = \"lambda.min\")\n\n# Compare the prediction\
  \ errors of the three models on the test set\n\nlm_pred <- predict(lm_model, newdata\
  \ = X_test)\n\nridge_pred <- predict(ridge_model, newx = X_test, s = \"lambda.min\"\
  )\n\nlasso_pred <- predict(lasso_model, newx = X_test, s = \"lambda.min\")\n\nmean((lm_pred\
  \ - y_test)²) # Mean squared error of linear model\n\nmean((ridge_pred - y_test)²)\
  \ # Mean squared error of Ridge model\n\nmean((lasso_pred - y_test)²) # Mean squared\
  \ error of Lasso model\n```\n\n## 13.32.6 R Program for Linear Classifiers\n\nThe\
  \ Iris data set is a classic example of multivariate data analysis. The purpose\
  \ of this data set is to demonstrate various techniques of exploratory data analysis,\
  \ such as summary statistics, visualization, clustering and classification. It can\
  \ be used in ML to train and test different models of supervised learning, such\
  \ as linear regression, logistic regression, K-nearest neighbors, decision trees\
  \ and neural networks. The Iris data set is built-in to the R programming language\
  \ and can be accessed by typing `data(iris)` in the console.\n\nThis is an R program\
  \ that demonstrates the linear classifier ML algorithm. The goal is to find the\
  \ line that maximizes the margin between the classes. We will only use two features\
  \ (`sepal length` and `width`) and two classes (`setosa` and `versicolor`) of the\
  \ Iris data set.\n\n```\n# Load the iris data set\n\ndata(iris)\n\n# Subset the\
  \ data to only include setosa and versicolor\n\niris <- subset(iris, Species %in%\
  \ c(\"setosa\", \"versicolor\"))\n\n# Plot the data and color by species\n\nplot(iris$Sepal.Length,\
  \ iris$Sepal.Width, col = iris$Species, pch = 19, xlab = \"Sepal Length\", ylab\
  \ = \"Sepal Width\")\n\nlegend(\"topright\", legend = c(\"setosa\", \"versicolor\"\
  ), col = c(\"black\", \"red\"), pch = 19)\n\n# Convert the species factor to a numeric\
  \ variable, where setosa is 1 and versicolor is -1\n\ny <- as.numeric(iris$Species)\n\
  \ny[y == 2] <- -1\n\n# Create a matrix of features with a column of ones for the\
  \ intercept\n\nX <- cbind(1, iris[, c(\"Sepal.Length\", \"Sepal.Width\")])\n\n#\
  \ Initialize the weights vector to zero\n\nw <- rep(0, ncol(X))\n\n# Define the\
  \ learning rate and the number of iterations\n\nalpha <- 0.01\n\niter <- 1000\n\n\
  # Define a function to calculate the prediction error\n\nerror <- function(w, X,\
  \ y) {\n  # The prediction is the sign of the dot product of X and w\n  pred <-\
  \ sign(X %*% w)\n  # The error is the sum of the absolute values of the differences\
  \ between the prediction and the true label\n  err <- sum(abs(pred - y))/2\n  return(err)\n\
  }\n\n# Define a function to update the weights using gradient descent\n\nupdate\
  \ <- function(w, X, y, alpha) {\n  # The gradient is the average of the product\
  \ of X and y for the misclassified points\n  misclassified <- which(sign(X %*% w)\
  \ != y)\n  grad <- colMeans(X[misclassified, ] * y[misclassified])\n  # The new\
  \ weights are the old weights plus the product of the learning rate and the gradient\n\
  \  w_new <- w + alpha * grad\n  return(w_new)\n}\n\n# Run the gradient descent algorithm\
  \ for a fixed number of iterations\n\nfor (i in 1:iter) {\n  # Update the weights\n\
  \  w <- update(w, X, y, alpha)\n  # Print the error and the weights at every 100\
  \ iterations\n  if (i %% 100 == 0) {\n    cat(\"Iteration:\", i, \"\\n\")\n    cat(\"\
  Error:\", error(w, X, y), \"\\n\")\n    cat(\"Weights:\", w, \"\\n\")\n  }\n}\n\n\
  # Plot the data and the decision boundary\n\nplot(iris$Sepal.Length, iris$Sepal.Width,\
  \ col = iris$Species, pch = 19, xlab = \"Sepal Length\", ylab = \"Sepal Width\"\
  )\n\nlegend(\"topright\", legend = c(\"setosa\", \"versicolor\"), col = c(\"black\"\
  , \"red\"), pch = 19)\n\nabline(a = -w[1]/w[3], b = -w[2]/w[3], lty = 2)\n\n# Sample\
  \ input: sepal length = 5.5, sepal width = 2.5\n# Sample output: versicolor (red\
  \ point below the line)\n```\n\n## 13.32.7 The e1071 Package of R\n\nThe `e1071`\
  \ package is a collection of miscellaneous functions for statistics and ML in R.\
  \ It was developed by the Department of Statistics, Probability Theory Group (Formerly:\
  \ E1071) at TU Wien, Austria. The package includes functions for latent class analysis,\
  \ short-time Fourier transform, fuzzy clustering, SVM, shortest path computation,\
  \ bagged clustering, naive Bayes classifier, generalized K-nearest neighbour classifier\
  \ and more.\n\n\n\n\n\n`e1071` 包最受欢迎的功能之一是其对 `libsvm` 库的接口，该库为分类和回归问题提供了 SVM 的高效实现。`e1071`\
  \ 包允许用户为 SVM 模型指定各种参数，例如核的类型、误分类成本、多项式核的次数、径向基核的 gamma 参数等。该包还提供了使用交叉验证或自助法调整 SVM\
  \ 模型超参数的功能。\n\n`e1071` 包可用于需要基于复杂数据构建稳健且准确的预测模型的机器学习应用中。例如，该包可使用不同类型的核和 SVM 算法对文本文档、图像、基因表达数据等进行分类。该包还可使用\
  \ epsilon- 或 nu- 回归 SVM 对数值或顺序数据执行回归分析。该包提供多种方法来评估 SVM 模型的性能，例如混淆矩阵、ROC 曲线、敏感性和特异性度量等。\n\
  \n## 13.32.8R 程序演示贝叶斯分类器\n\n下面是一个演示贝叶斯分类器机器学习算法的 R 程序。分类器预测具有最高后验概率的类别，后验概率是先验和似然的乘积。\n\
  \n``` \n# Load the e1071 package, which contains a function for creating and using\
  \ a naive Bayes classifier\nlibrary(e1071)\n\n# Create some synthetic data for illustration\
  \ purposes\n# The data has two features (x and y) and two classes (A and B)\nset.seed(123)\
  \ # Set the random seed for reproducibility\nn <- 100 # Number of instances\nx <-\
  \ rnorm(n) # Generate random values for x from a normal distribution\ny <- rnorm(n)\
  \ # Generate random values for y from a normal distribution\nclass <- sample(c(\"\
  A\", \"B\"), n, replace = TRUE) # Assign random class labels to each instance\n\
  data <- data.frame(x, y, class) # Create a data frame with the features and the\
  \ class\n\n# Plot the data to visualize the distribution of the classes and the\
  \ features\nplot(data$x, data$y, col = data$class, pch = 19, xlab = \"x\", ylab\
  \ = \"y\")\nlegend(\"topleft\", legend = c(\"A\", \"B\"), col = c(\"black\", \"\
  red\"), pch = 19)\n\n# Split the data into training and testing sets\ntrain_index\
  \ <- sample(1:n, 0.8 * n) # Randomly select 80% of the instances for training\n\
  train_data <- data[train_index, ] # Subset the data frame for training\ntest_data\
  \ <- data[-train_index, ] # Subset the data frame for testing\n\n# Create a naive\
  \ Bayes classifier using the training data\nmodel <- naiveBayes(class ~ x + y, data\
  \ = train_data)\n\n# Print the model to see the estimated prior probabilities and\
  \ the conditional probabilities of each feature given each class\nprint(model)\n\
  \n# Predict the class labels for the testing data using the model\npred <- predict(model,\
  \ test_data)\n\n# Compare the predicted labels with the actual labels to evaluate\
  \ the accuracy of the model\ntable(pred, test_data$class)\n\n# Compute the accuracy\
  \ as the proportion of correct predictions\naccuracy <- sum(pred == test_data$class)\
  \ / length(test_data$class)\ncat(\"The accuracy of the model is\", accuracy, \"\\\
  n\")\n\n# Create a new instance with some arbitrary values for x and y\nnew_instance\
  \ <- data.frame(x = 0.5, y = -0.5)\n\n# Predict the class label for the new instance\
  \ using the model\npred_new <- predict(model, new_instance)\ncat(\"The predicted\
  \ class for the new instance is\", pred_new, \"\\n\")\n\n# Compute the posterior\
  \ probabilities for each class given the new instance using the model\nposterior\
  \ <- predict(model, new_instance, type = \"raw\")\ncat(\"The posterior probabilities\
  \ for each class are\", posterior, \"\\n\")\n```\n\n## 13.32.9R 程序演示 KNN 分类器\n\n\
  这是一个演示 KNN 分类器机器学习算法的 R 程序。`k` 参数可通过交叉验证或其他方法选择。距离度量可以是欧几里得、曼哈顿、闵可夫斯基或其他用户自定义函数。\n\
  \n``` \n# Load the required packages\nlibrary(class)\nlibrary(ggplot2)\n\n# Generate\
  \ some sample data for two classes\nset.seed(123) # Set the random seed for reproducibility\n\
  x1 <- rnorm(50, mean = 0, sd = 1) # Generate 50 random numbers from a normal distribution\
  \ with mean 0 and sd 1\ny1 <- rnorm(50, mean = 0, sd = 1) # Generate 50 random numbers\
  \ from a normal distribution with mean 0 and sd 1\nx2 <- rnorm(50, mean = 3, sd\
  \ = 1) # Generate 50 random numbers from a normal distribution with mean 3 and sd\
  \ 1\ny2 <- rnorm(50, mean = 3, sd = 1) # Generate 50 random numbers from a normal\
  \ distribution with mean 3 and sd 1\nclass <- c(rep(\"A\", 50), rep(\"B\", 50))\
  \ # Assign the class labels A and B to the data points\ndata <- data.frame(x = c(x1,\
  \ x2), y = c(y1, y2), class = class) # Combine the data into a data frame\n\n# Plot\
  \ the data using ggplot2\nggplot(data, aes(x = x, y = y, color = class)) + geom_point()\
  \ + ggtitle(\"Sample data\")\n\n# Split the data into training and testing sets\n\
  train_index <- sample(1:100, size = 80) # Randomly select 80 indices for the training\
  \ set\ntrain_data <- data[train_index, ] # Subset the data frame by the training\
  \ indices\ntest_data <- data[-train_index, ] # Subset the data frame by the testing\
  \ indices\n\n# Apply the k-NN classifier to the test data using k = 5 and Euclidean\
  \ distance\npred_class <- knn(train = train_data[, c(\"x\", \"y\")], test = test_data[,\
  \ c(\"x\", \"y\")], cl = train_data$class, k = 5)\n\n# Compare the predicted class\
  \ with the true class\ntable(pred_class, test_data$class)\n\n# Calculate the accuracy\
  \ of the classifier\naccuracy <- sum(pred_class == test_data$class) / length(test_data$class)\n\
  accuracy\n\n# Plot the test data with the predicted class\nggplot(test_data, aes(x\
  \ = x, y = y, color = pred_class)) + geom_point() + ggtitle(\"Test data with predicted\
  \ class\")\n```\n\n## 13.32.10 ggplot2 简介\n\n`ggplot2` 是一个基于图形语法声明式创建图形的系统。它是 R\
  \ 编程语言中的一个包，使你能够使用一致且连贯的语法创建数据可视化。你可以用它创建简单的散点图、条形图和线图等数据可视化，以及更高级和复杂的数据可视化，如详细地图。\n\
  \n`ggplot2` 的目的是提供一个用于创建图形的框架，这些图形具有表现力、优雅且易于修改。它遵循图形语法原则，这是一组指定如何将数据映射到美学、使用哪些图形元素以及如何协调多个视图的规则。通过使用这种语法，你可以创建广泛的图形，以满足你的特定需求。\n\
  \n`ggplot2` 可用于机器学习中探索和理解数据，以及传达分析结果。例如，你可以使用 `ggplot2` 创建直方图、箱线图、散点图或密度图来检查变量的分布和关系。你还可以使用\
  \ `ggplot2` 创建热图、等高线图或曲面图来可视化复杂函数或模型。你还可以使用 `ggplot2` 通过 `plotly` 或 `shiny` 等包创建交互式图形。\n\
  \n## 13.32.11 使用 R 实现 PCA\n\n下面是一个演示 PCA 机器学习的 R 语言程序。该程序对鸢尾花数据集执行 PCA，这是多元数据分析的常见示例。\n\
  \n该程序使用 `caret` 和 `ggplot2` 库执行 PCA、训练 KNN 分类器并可视化结果。该程序还使用混淆矩阵评估分类器的准确性。该程序表明 PCA\
  \ 可以帮助根据花瓣和萼片的测量值分离不同类别的鸢尾花。\n\n``` \n# Load the required libraries\nlibrary(caret)\n\
  library(ggplot2)\n\n# Load the iris data set\ndata(iris)\n\n# Split the data into\
  \ training and testing sets\nset.seed(123)\ntrainIndex <- createDataPartition(iris$Species,\
  \ p = 0.8, list = FALSE)\n```\n\n\n\n\n`trainData <- iris[trainIndex, ]`\n\n`testData\
  \ <- iris[-trainIndex, ]`\n\n### 对数值特征执行 PCA\n\n```\npreProc <- preProcess(trainData[,\
  \ -5], method = \"pca\", thresh = 0.95)\ntrainPC <- predict(preProc, trainData[,\
  \ -5])\ntestPC <- predict(preProc, testData[, -5])\n```\n\n### 将类别标签添加到 PCA 数据中\n\
  \n```\ntrainPC$Species <- trainData$Species\ntestPC$Species <- testData$Species\n\
  ```\n\n### 在 PCA 数据上训练 k 近邻分类器\n\n```\nknnFit <- train(Species ~., data = trainPC,\
  \ method = \"knn\", tuneLength = 10)\n```\n\n### 在测试 PCA 数据上预测类别标签\n\n```\nknnPred\
  \ <- predict(knnFit, testPC)\n```\n\n### 评估分类器的准确率\n\n```\nconfusionMatrix(knnPred,\
  \ testPC$Species)\n```\n\n### 绘制带有类别标签的 PCA 数据\n\n```\nggplot(trainPC, aes(PC1,\
  \ PC2, color = Species)) +\n  geom_point() +\n  labs(title = \"PCA of iris data\"\
  )\n```\n\n## 13.32.12 使用 R 实现 LDA\n\nLDA 通过找到能最大化类别间分离的特征线性组合来工作。在本示例中，我们将使用鸢尾花数据集。\n\
  \n### 加载所需的包\n\n```\nlibrary(MASS) # for lda function\nlibrary(ggplot2) # for plotting\n\
  ```\n\n### 加载鸢尾花数据集\n\n```\ndata(iris)\n```\n\n### 将数据拆分为训练集和测试集（分别为 80% 和 20%）\n\
  \n```\nset.seed(123) # for reproducibility\ntrain_index <- sample(1:nrow(iris),\
  \ 0.8 * nrow(iris))\ntrain_data <- iris[train_index, ]\ntest_data <- iris[-train_index,\
  \ ]\n```\n\n### 使用全部四个特征在训练数据上执行 LDA\n\n```\nmodel <- lda(Species ~., data = train_data)\n\
  ```\n\n### 打印模型摘要\n\n```\nprint(model)\n```\n\n模型摘要显示每个类别的先验概率、每个特征的组均值以及线性判别式的系数。线性判别式的系数是用于将原始特征变换到能最大化类别分离的低维空间中的权重。在本例中，有两个线性判别式，因为我们有三个类别，而线性判别式的数量比类别数少一个。\n\
  \n### 绘制数据投影到前两个线性判别式上的图\n\n```\nplot(model)\n```\n\n该图显示第一个线性判别式 `LD1` 将 setosa\
  \ 与其他两个物种分开，而第二个线性判别式 `LD2` 将 versicolor 和 virginica 分开。该图还显示了每个类别的 95% 置信椭圆。\n\n\
  ### 使用模型预测测试数据的类别标签\n\n```\npred <- predict(model, test_data)\n```\n\n### 打印混淆矩阵\n\
  \n```\ntable(pred$class, test_data$Species)\n```\n\n混淆矩阵显示模型正确或错误分类的每个类别的观测数量。在本例中，模型正确分类了全部\
  \ 30 个测试观测。\n\n### 计算模型在测试数据上的准确率\n\n```\naccuracy <- sum(diag(table(pred$class,\
  \ test_data$Species))) / nrow(test_data)\nprint(accuracy)\n```\n\n准确率为 100%，这意味着模型完美地分类了测试数据。\n\
  \n## 13.32.13 R 中的 kernlab 包\n\n`kernlab` 包是用于分类、回归、聚类、新颖性检测、分位数回归和降维的基于核的 ML 方法的综合集合。它包括\
  \ SVM、谱聚类、核 PCA、高斯过程和 QP 求解器等流行算法。\n\n`kernlab` 包的目的是为在 R 中实现和使用核方法提供统一的框架。它利用 R\
  \ 的新 S4 对象模型，并允许用户创建自定义核和算法。\n\n该包可用于需要非线性和灵活模型来捕捉数据中复杂模式的 ML 应用。例如，可以使用 `ksvm`\
  \ 函数使用不同的核函数和超参数执行分类或回归。或者，可以使用 `kpca` 函数使用核主成分分析执行降维或特征提取。`kernlab` 包还支持诸如 `onlearn`\
  \ 之类的在线学习算法，可以在不重新训练的情况下用新数据更新模型。\n\n## 13.32.14 R.matlab 包\n\n`R.matlab` 是一个 R\
  \ 包，提供读取和写入 MAT 文件的方法，MAT 文件是存储 MATLAB 数据的二进制文件。它还允许用户从 R 内部控制 MATLAB 并通过 TCP/IP\
  \ 连接或文件系统在 R 和 MATLAB 之间交换数据。\n\n`R.matlab` 的目的是促进 R 和 MATLAB 之间互操作性，这两种语言都是科学计算和数据分析的流行语言。`R.matlab`\
  \ 可用于希望利用两种语言优势的用户，例如 R 丰富的统计和图形功能以及 MATLAB 的数值和工程工具。\n\n`R.matlab` 可在 ML 中以多种方式使用：\n\
  \n- 读取和写入包含 ML 数据集或模型的 MAT 文件，例如神经网络、支持向量机或决策树。\n- 从 R 内部运行执行 ML 任务的 MATLAB 脚本或函数，例如训练、测试或评估。\n\
  - 在 R 和 MATLAB 之间传输 ML 对象，例如矩阵、向量或列表，以便进一步处理或可视化。\n\n要使用 `R.matlab`，用户需要从 CRAN 安装该包，并在其系统上安装\
  \ MATLAB v6 或更高版本。用户还需要在 MATLAB 端加载一个小型 Java 插件以启用 TCP/IP 通信。有关如何使用 `R.matlab` 的更多详细信息，用户可以查阅包文档或一些在线教程。\n\
  \n## 13.32.15 R 中 LPP 的实现\n\n此 R 程序演示了 LPP ML 方法。LPP 可以通过使用核函数应用于具有非线性结构复杂数据。\n\n\
  ### 加载所需的包\n\n```\nlibrary(kernlab)\nlibrary(R.matlab)\n```\n\n### 加载样本数据（USPS 手写数字）\n\
  \n```\ndata <- readMat(\"usps.mat\")\nX <- data$fea # feature matrix (256 x 9298)\n\
  y <- data$gnd # label vector (9298 x 1)\n```\n\n### 归一化特征矩阵\n\n```\nX <- scale(X)\n\
  ```\n\n### 定义最近邻数量（k）和降维数（d）\n\n```\nk <- 10\nd <- 2\n```\n\n### 使用 k 近邻构建邻接图\n\n\
  ```\nW <- knn.graph(X, k, directed = FALSE)\n```\n\n### 计算度矩阵（以 W 行和为对角线的对角矩阵）\n\
  \n```\nD <- diag(rowSums(W))\n```\n\n### 计算拉普拉斯矩阵（L = D - W）\n\n```\nL <- D - W\n\
  ```\n\n### 求解广义特征值问题：X' * L * X * alpha = lambda * X' * D * X * alpha\n\n```\neig\
  \ <- geigen(t(X) %*% L %*% X, t(X) %*% D %*% X, symmetric = TRUE)\n```\n\n### 按升序对特征值排序并选择\
  \ d 个最小值（除第一个零特征值外）\n\n```\neig$values <- sort(eig$values, index.return = TRUE)\n\
  eig$values <- eig$values$x[2:(d + 1)]\neig$vectors <- eig$vectors[, eig$values$ix[2:(d\
  \ + 1)]]\n```\n\n### 从特征向量获得变换矩阵（alpha）\n\n```\nalpha <- eig$vectors\n```\n\n###\
  \ 使用 alpha 将原始数据投影到降维子空间\n\n```\nZ <- X %*% alpha\n```\n\n### 绘制带有不同标签不同颜色的投影数据\n\
  \n```\nplot(Z, col = y, pch = 19, xlab = \"First dimension\", ylab = \"Second dimension\"\
  , main = \"LPP projection of USPS data\")\n```\n\n输入：大小为 256 x 9298 的特征矩阵 `X` 和大小为\
  \ 9298 x 1 的标签向量 `y`  \n输出：大小为 9298 x 2 的投影数据 `Z` 的图，不同标签用不同颜色\n\n## 13.32.16 在\
