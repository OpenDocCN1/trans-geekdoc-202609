  ]^(*T*) |\n\n| ⋮ || ⋮ || ⋮ || ⋮ || ⋮ |\n\n| 30 || $\\\\begin{matrix} {\\\\lbrack\
  \ 0.0031,} \\\\\\\\ {0.005\\\\rbrack} \\\\\\\\ \\\\end{matrix}^{T}$ || ⋮ || 0.000121\
  \ || ⋮ |\n\n| 函数收敛缓慢 |\n\n## 4.6 约束优化\n\n机器学习问题是一个优化问题，我们在给定某些条件下寻求最佳结果。约束优化通过对远离最优点的位置引入约束来帮助找到此最优解。例如，神经网络中的常见约束是权重不能太小或太大，这有助于在训练模型时避免过拟合和欠拟合。约束优化还可以通过强制执行公平性约束，例如基于年龄或性别的非歧视，来帮助在训练期间避免偏差。这可以防止模型对某些人群做出不公平或有偏见的决定，并确保自动化决策过程的公平性。\n\
  \n约束优化技术还允许我们通过同时考虑多个目标来解决复杂问题，帮助我们在构建模型架构时快速识别不同目标和目标之间的权衡。最后，约束优化有助于结果的可解释性，这对于产生复杂输出的机器学习算法尤其重要，例如深度学习模型。通过添加简单的约束，如“保持特征相关”或“在合理时间内最大化模型准确性”，我们可以提高对各个部分如何促成整体性能的理解，而不会牺牲模型预测的稳定性或准确性。\n\
  \n约束优化问题的形式为\n\n(4.18)\n\nmin *f*(*x*)\n\n与此问题相关联的拉格朗日函数为\n\n(4.19)\n\n$\\\\min\\\
  \\left( {x,\\\\lambda,\\\\upsilon} \\\\right) = f\\\\left( x \\\\right) + \\\\sum\\\
  \\limits\\_{i = 1}^{m}\\\\lambda\\_{i}g\\_{i}\\\\left( x \\\\right) + \\\\sum\\\\\
  limits\\_{j = 1}^{p}\\\\upsilon\\_{j}h\\_{j}\\\\left( x \\\\right)$\n\n`λ[i]`′ and `υ[j]`′\
  \ 被称为拉格朗日乘子。拉格朗日在每个可行点上产生成本函数的族下界。\n\n拉格朗日乘子通常用于机器学习中求解优化问题。它们通过采用限制并帮助塑造函数结果的约束来优化系统的参数。例如，机器学习算法通常采用正则化，这涉及在目标函数中引入惩罚项以减少过拟合并提高泛化能力。此惩罚项可以表示为拉格朗日乘子，其中可以为模型中的每个参数或特征集指定所需的正则化。此技术可以帮助模型避免过拟合，同时帮助它们在未见数据上表现更好。\n\
  \n另一个例子是使用神经网络进行分类任务时；拉格朗日乘子通常用于尝试通过对特定参数添加约束来优化类别之间的决策边界，以尝试提高准确性或减少误分类错误。在优化过程中通过这些惩罚项引入约束有助于算法找到不同类别之间更好的决策边界。\n\
  \n### Example 22: Minimize `x` + `y`\n\n约束是一个外部因素。\n\n与此问题相关联的拉格朗日函数为\n\n`L(x,y,υ)` = `x` + `y` + `υ`(`x`²+`y`²−1)\n\
  \n计算此函数的梯度以确定驻点。\n\n$\\\\nabla L\\\\left( {x,y,\\\\upsilon} \\\\right) = \\\\begin{pmatrix}\
  \ {1 + 2\\\\upsilon x} \\\\\\\\ {1 + 2\\\\upsilon y} \\\\\\\\ {x^{2} + y^{2} - 1}\
  \ \\\\\\\\ \\\\end{pmatrix}$\n\n∇`L(x,y,υ)` = 0\n\n⇒1+2`υx`=0;1+2`υy`=0;`x`²+`y`²−1=0\n\
  \n求解这些，我们得到 `x = y = - 1/(2υ)` 且 `υ = ± 1/(√2)`\n\n驻点为 `(1/√2,1/√2)` 和 `(-1/√2,-1/√2)`\n\
  \n### Example 23: Maximize `f(x,y) = x*y`\n\n尽管这是一个约束优化问题，但问题看起来很简单。对于如此简单的问题，我们可以使用直接代入法。\n\
  \n直接代入允许我们将约束重写为单个变量。\n\n重写给定的约束，我们得到 `y = 100 − x`。\n\n现在问题被转换 为 `f(x,100−x) =\
  \ x(100−x) = 100x − x²`\n\n通过对 f 求微分，我们得到 `f′(x) = 100 − 2x`。\n\n令 `f′(x) = 0`，\n\
  \n我们确定二阶导数 `f″(x) = −2 < 0`\n\n因此函数将在 (50, 50) 处达到最大值。\n\n同一问题也可以使用拉格朗日乘子求解。\n\n\
  `L(x,y,λ) = f(x,y) + λ(x+y−100) = x*y + λ(x+y−100)`\n\n$L^{\\\\prime} = \\\\begin{pmatrix}\
  \ {y + \\\\lambda} \\\\\\\\ {x + \\\\lambda} \\\\\\\\ {x + y - 100} \\\\\\\\ \\\\\
  end{pmatrix}$\n\n`L′=0`⇒`x=y=−λ`，\n\n`x+y=100`⇒`−2λ=100`⇒`λ=−50`⇒`x=y=50`\n\n##\
  \ 4.7 对偶优化问题\n\n对偶优化是机器学习的一种技术，同时优化两个目标。当同一优化问题中存在相互竞争的目标时，这可能很有用。例如，为网上购物者构建推荐系统可能需要优化结果的准确性和速度，或在欺诈检测算法中平衡最小化假阳性和假阴性。在对偶优化技术中，一个目标被视为“主要”，另一个被视为“次要”。首先优化主要目标，然后次要目标尝试改进通过优化主要目标找到的值。为了实现这一点，最优解的每一步都必须满足两个目标。在任何给定时间，可能需要稍微牺牲其中一个目标（同时仍高于某个阈值），以便它们随着时间的推移以相互兼容的解决方案得到满足。\n\
  \n使用对偶优化找到的最优解有时不会在两个目标之间完全平衡，但通常仍应提供令人满意的结果。通过使用对偶优化而不是传统的单目标方法，工程师可以确保其系统更稳健，并且可以在不牺牲任何单个指标过多的情况下同时考虑许多不同类型的需求。\n\
  \n\n\n\n\n## 对偶定理\n\n在线性规划（`LP`）中，每一个以标准形式定义的极大化问题（原问题）都将有一个称为对偶的 `LP` 极小化问题。原问题和对偶问题是关联的。一个问题的每一个可行解都会给出另一个问题的最优值的界限。这就是对偶定理。对偶定理是\
  \ `ML` 中用于做出更好决策的强大工具。它指出，如果两个优化问题相关，那么一个问题的解将与另一个问题的解相关。\n\n在监督学习中，对偶定理常用于解决诸如回归或分类任务等\
  \ `LP` 问题。假设我们有一组数据点，具有某些特征（自变量）和特定的标签（因变量）。我们可以使用 `LP` 技术来确定哪些特征对正确预测标签更为重要。这使我们能够识别哪些特征具有更高的预测能力，并据此改进我们的模型。在无监督学习任务如聚类或异常检测中，对偶定理可以帮助我们确定两个数据集可能如何相关，即使它们可能不包含相同的标签或类别。这使我们能够发现否则会被忽视的数据模式。\n\
  \n在诸如游戏算法等强化学习任务中，对偶定理帮助我们通过比较基于智能体采取的不同行动（例如玩家）的预期奖励来创建最小化损失的策略。通过使用源自该定理的 `LP`\
  \ 技术计算游戏环境中不同状态的预期奖励，我们可以比不使用它时更有效地优化不同情况的策略。最后，已发现神经网络在优化尝试期间将其纳入设计过程时也能受益，因为它有助于减少过拟合并提高在预测未见数据点时输出的准确性。\n\
  \n## 原问题和对偶问题\n\n设方程 `(4.20)` 中定义的问题被视为原问题。\n\n```\n\\text{Maximize}\\sum\\limits_{j\
  \ = 1}^{n}c_{j}x_{j}\n```\n```\n\\text{subject to}\\sum\\limits_{j = 1}^{n}a_{ij}x_{j}\
  \ \\leq b_{i}\\forall i = 1\\cdots m\n```\n`(4.20)`\n\n`x[j] >= 0`\n\n原问题的对偶定义为\n\
  \n```\n\\text{Maximize}\\sum\\limits_{i = 1}^{m}( - b_{j})y_{i}\n```\n```\n\\text{subject\
  \ to}\\sum\\limits_{j = 1}^{m}( - a_{ij})y_{i} \\leq - c_{j}\\forall j = 1\\cdots\
  \ n\n```\n`(4.21)`\n\n`y[i] >= 0`\n\n弱对偶定理指出，对偶问题的任何可行解都大于原问题的任何可行解。换句话说，一个问题的最优解不可能比其对偶问题的最优解更差。这意味着即使问题的精确解难以找到，也可以通过求解其对偶版本来获得最佳可能值的良好上界。在\
  \ `ML` 中，该定理可以解决与监督和无监督学习算法相关的优化问题。例如，在线性回归模型中最小化目标函数（或成本函数）需要找到模型参数的正确组合以最小化预测误差。求解该问题的对偶版本可能会产生不同的解。然而，它为我们提供了最小可能预测误差的下界，这使我们能够确定当前的模型参数是否足以获得良好的预测，或者是否需要更精细的调整。\n\
  \n类似地，在 `K-means` 和高斯混合模型（`GMM`）等聚类应用中，弱对偶定理可用于在计算最优聚类分配的闭式表达式不可用或计算成本过高时找到近似解。例如，在\
  \ `GMM` 中，通常不可能获得精确解，因为每个数据点必须与其概率分布相关联；然而，通过使用弱对偶定理，我们可以在不诉诸蒙特卡洛模拟/基于采样的算法等计算昂贵方法的情况下，为每个数据点构造参数的改进下界。最后，该定理已成功应用于马尔可夫决策过程（`MDPs`）。在\
  \ `MDPs` 中，我们需要解决涉及多个变量和约束的复杂优化问题；在这里，弱对偶同样帮助我们通过求解这些问题的更简单版本来获得最优值的更好估计，从而比仅依赖爬山等启发式搜索技术获得更好的近似。\n\
  \n## 强对偶定理\n\n强对偶定理指出，如果原问题存在最优解（`x[1]*`,`x[2]*`,⋯,`x[n]*`）使得\n\n`(4.22)`\n\n```\n\
  \\sum\\limits_{j = 1}^{n}c_{j}x_{j}^{*} = \\sum\\limits_{i = 1}^{m}b_{i}y_{i}^{*}\n\
  ```\n\n强对偶定理在 `ML` 中用于为优化特定算法提供数学证明。该定理指出，对于任何给定的优化问题，都存在一个解能够最大化目标函数并同时满足问题的约束。换句话说，如果算法被设计为高效地找到满足特定标准或目标的解或解集，那么该解可以通过坚实的对偶性被证明是最优的。强对偶在诸如\
  \ `SVMs` 等特定 `ML` 算法中至关重要。在这些情况下，它保证任何提出的解都将满足其指定的目标，同时提供有关该最优解是如何找到的以及如何改进它的见解。例如，`SVM`\
  \ 算法使用强对偶来确保它们能够通过找到一个最优超平面来准确分类数据点，该超平面最大化其与每个类别边界点的间隔距离。\n\n## 原优化问题\n\n考虑一个约束优化问题\n\
  \n```\nMinimize f(x)\n```\n```\nsubject to gi <= 0, ∀i = 1⋯m\n```\n`(4.23)`\n\n\
  `hj = 0 ∀j = 1⋯p`\n\n该问题也称为原优化问题。\n\n原优化问题是一个数学问题，涉及为一组参数找到最优解。该问题可用于优化特定的 `ML`\
  \ 算法和流程。原优化问题在深度学习中很有益，在那里它们被用来帮助创建和改进神经网络。例如，许多深度学习算法利用原优化问题来识别网络中权重和偏置的最佳组合。这有助于确保网络能够准确识别模式、在图像或视频中识别对象，或以最大准确度执行其他任务。原优化还可以确定在使用回归模型或监督\
  \ `ML` 方法时进行准确预测的最佳参数。\n\n原优化问题还可以帮助减少过拟合，通过帮助研究人员找到神经网络的最佳模型大小和层数。通过使用这种技术，研究人员可以在层数过少导致欠拟合和层数过多导致过拟合之间找到理想的平衡。总体而言，原优化有效地允许研究人员和工程师以最小的努力优化\
  \ `ML` 算法。它使他们能够从各种可能性中快速识别出最优解，而无需进行耗费更多时间和资源的不必要的广泛试错测试方法。\n\n## 拉格朗日对偶\n\n给定某个优化问题的拉格朗日\
  \ `L(x,λ,ν)`，拉格朗日对偶定义为一个函数：\n\n`(4.24)`\n\n`F(λ,ν) = inf L(x,λ,ν),`\n\n其中 `x` ϵ\
  \ 原问题定义域 `D`。\n\n对于上面定义的原优化问题，对偶优化问题定义为\n\n`(4.25)`\n\n`Maximize F (λ, v), subject\
  \ to λ >= 0`\n\n4.8Dynamic Programming\n\n\n\n\n\n## 动态规划\n\n动态规划通过组合子问题的解来解决问题的。动态规划方法只对子问题或子子问题求解一次并将结果存储在类似表格的结构中。这种方法主要用于解决优化问题。\n\
  \n### 最优性原理\n\n如果一个问题的最优解的子解本身对各自的子问题也是最优解，则称该问题满足最优性原理。最优性原理在机器学习中被广泛用于通过迭代过程寻找最佳模型结构。例如，它可用于为给定模型找到最优参数集，确定神经网络的最优规模和复杂度，或为给定问题定义最佳超参数。本质上，这种方法涉及在每次迭代中求解子问题，然后将它们的解组合起来，以获得比任何单个子问题解更好的解。该方法已成功解决诸如特征选择、半监督学习、强化学习优化和深度学习优化等具有挑战性的问题。\n\
  \n马尔可夫决策过程（`MDP`）由状态、动作、奖励以及每个状态下每个动作效果的描述组成。强化学习旨在学习最优策略，而 `MDP` 提供环境。在这种情况下，动态规划被用于确定最优解。\n\
  \n## 4.9 次线性算法\n\n次线性算法是指通过读取输入的微小比例并在输出解之前以次线性时间处理输入来解决给定问题的算法。这些算法可能给出精确解，也可能通过随机化提供近似解。\n\
  \n次线性算法在机器学习中变得越来越流行。这些算法可用于传统方法无法处理的大型数据集。使用次线性算法的主要思想是减少从大型数据集中获得准确结果所需的计算次数。这有助于提高性能，减少处理时间，并最大限度地减少任务所需的资源。在机器学习中，次线性算法可用于各种任务，如特征选择、聚类、分类和回归。\n\
  \n### 示例 27\n\n确定一个由 `{1∙∙∙n}` 的排列组成的给定数组 `A[1: n]` 中的奇数，其中 `n > 1`，并输出一个索引 `*i*`，使得\
  \ `A[i]` 为奇数。\n\n确定性方法在 `O(n)` 时间内输出精确解。随机算法可能在 `O(1)` 时间内产生输出。思路很简单：随机选择一个元素并检查它是否为奇数。重复直到找到奇数。\n\
  \n流式算法是指通过读取流式输入（流式输入）并借助随机化给出精确解或近似解来解决给定问题的算法。这些算法根本不会存储输入序列；它们是‘即时’运行的。它们仅使用次线性量的内存处理流式输入。\n\
  \n与随机算法和近似算法的概念一样，次线性算法旨在在多项式时间内没有可用解时提供某种解。\n\n## 4.10 图\n\n图是一种非线性数据结构，由非空的顶点集合和边的集合组成。它表示为\
  \ `G = (V , E)` 图的示例如图 Fig. 4.7 所示。有四个顶点和七条边。\n\n`V` = `{v[1],v[2],v[3],v[4]}`\n\
  \n图由邻接矩阵或邻接表表示。对于图 Fig. 4.7 所示的图，邻接矩阵（Table 4.1）以 `|V| × |V|` 的维度定义。\n\n![](img/f4-7.jpg)\n\
  \nFigure 4.7  一个具有四个顶点和七条边的图\n\nTable 4.1 图 Fig. 4.7 中给出的图的邻接矩阵。\n\n|  || v1 ||\
  \ v2 || v3 || v4 |\n| --- | --- | --- | --- | --- |\n| v[1] || 0 || 1 || 1 || 1\
  \ |\n| v[2] || 1 || 0 || 2 || 0 |\n| v[3] || 1 || 2 || 0 || 1 |\n| v[4] || 1 ||\
  \ 0 || 1 || 1 |\n\n邻接矩阵中的条目表示对应顶点之间的边数。顶点 `v[2]` 和 `v[3]` 之间有两条边；因此邻接矩阵中为数字 2。\n\
  \n### 无向图\n\n无向图中的边是无序的，即两个顶点之间的边用 `(u, v)` 或 `(v, u)` 表示是相同的。\n\n无向图在机器学习中很有用，因为它们允许表示数据关系。特别是，它们可用于识别不同变量之间的模式并帮助决定哪些变量应用于模型中。例如，无向图可用于了解两个变量如何相互作用；如果一个变量对另一个变量有直接影响，则这两个变量将在图中具有直接连接。这种类型的分析在构建模型时很有帮助，因为它可以帮助确定哪些因素对给定结果最重要。\n\
  \n无向图还可以帮助通过将相似的数据点聚类在一起或识别需要进一步调查或从数据集中删除的异常值来分析复杂数据集。使用网络结构可以推断观察值之间的隐藏连接并揭示有关数据集的有见地的信息。这使得无向图对于模型构建过程中的探索性分析和特征选择至关重要。\n\
  \n### 有向图\n\n有向图中的边是有序的或由有向对表示。有向图是机器学习的重要工具，因为它可以表示数据点之间的关系并探索从一个点到另一个点的不同路径。遍历图结构的能力使算法能够识别数据中的模式并从中得出有价值的结论。此外，有向图可用于聚类和分类等任务。例如，有向图可用于监督学习任务，如回归分析，其中必须根据一些自变量预测因变量的值。通过使用图结构中边表示的关系，算法可以学习改变对象或实体的某些特征如何影响其输出值。这使得更容易理解在预测值时哪些特征是必不可少的以及如何最好地使用该信息。\n\
  \n在无监督学习任务如聚类分析或自然语言处理中，有向图有助于识别数据片段之间一般模式，这些数据片段否则无关或难以手动分类。这有助于机器学习如何不同信息片段可能相关，从而能够根据已知的知识对未知数据点做出更准确的预测。\n\
  \n这里，顶点 `u` 和 `v` 之间的边表示为 `(u, v)`，其中边的尾部在 `u`，头部在 `v`。因此 `(u, v)` 和 `(v, u)` 是不同的。\n\
  \n\n\n\n\n## Self-loop 和 Multiple edges\n\n一个从顶点指向自身的边称为 `self-loop`。`Self-loops`\
  \ 可用于建模节点以某种方式与其自身相关的情况。例如，如果想建模两个人之间的友谊，可以有一条两端都指向同一顶点的边。如果一对顶点之间有多条边，则这些边称为 `multiple\
  \ edges`。`Multiple edges` 在 ML 中用于捕捉并量化不同实体之间关系强度。例如，在社交网络中，`multiple edges` 可用于建模两个人联系的紧密程度或他们相互互动的可能性。在推荐系统中，`multiple\
  \ edges` 可用于根据其类别或上下文对相关项目之间的亲和度进行评分。此信息可被诸如 `collaborative filtering` 或 `matrix\
  \ factorization` 等算法用于做出推荐。`Multiple edges` 还使诸如 `neural graph networks` 等算法成为可能，这些算法有助于在图结构中编码实体之间的复杂关系，并利用这些复杂交互比传统方法更准确地做出预测。\n\
  \n对于具有 `n` 个顶点的图，最大不同边的数量为 $\\frac{n\\left( {n - 1} \\right)}{2}$。\n\n### Complete\
  \ Graph\n\n具有恰好 `n(n - 1)/2` 条边的无向图称为 `complete graph`。在 ML 中，`complete graphs`\
  \ 有助于识别难以检测的数据模式。例如，我们想识别哪些变量彼此相关。在这种情况下，使用 `complete graph` 比分别检查变量的各个配对要容易得多。`complete\
  \ graph` 为我们提供了整个数据集的概览，并使我们更容易看到不同变量如何相互作用。`Complete graphs` 还帮助机器基于大型数据集或多因素可能同时起作用的高维问题做出决策。通过分析\
  \ `complete graph` 内的模式，ML 算法可以更轻松地确定哪些因素对特定结果或决策贡献最大，并基于这些发现做出预测。最后，`complete graphs`\
  \ 提供了一种有效的数据可视化方式，使人类能够更好地理解其结构和含义，并比没有此工具更快地识别异常值或异常。\n\n### Subgraph\n\n对于图 `G\
  \ = (V, E)`，存在图 `G′` 使得 `V(G′)` ⊆ `V(G)` 且 `E(G′)` ⊆ `E(G)`。\n\n![](img/f4-8.jpg)\n\
  \nFigure 4.8  A subgraph of the graph given in Fig. 4.7\n\n`Subgraphs` 在 ML 中很有帮助，因为它们允许机器识别数据中的模式和关系。`Subgraphs`\
  \ 是包含原始图的部分或全部节点和边的子图（Fig. 4.8）。通过将主图分解为更小的组件，`subgraphs` 使机器能够轻松地在复杂数据集中找到模式。例如，假设我们试图使用客户交易数据集来预测信用卡欺诈。在这里，我们可以根据日期、商户类型或位置对客户交易进行分组来创建\
  \ `subgraphs`。这将使我们更好地了解客户支出模式并检测可能表明欺诈活动的异常。\n\n`Subgraphs` 还使机器能够从先前学习过的模型中学习，同时仍能识别新的关系。通过从相似但不同的数据集中创建多个\
  \ `subgraphs`，机器可以将先前模型的结果与当前结果进行比较，并比以往更快、更准确地对未来数据点做出更好的预测。此外，`subgraph` 算法可用于降维，这有助于减少大型数据集中的噪声，以便机器专注于基本特征而不是被无关信息淹没。当处理难以让计算机从大量可用数据点中识别有意义模式的非结构化数据集时，这尤其有帮助，因为其\
  \ sheer volume 或复杂性。\n\n### Path\n\n从顶点 `v1` 到 `v3` 的路径是顶点序列，其中任意两个相邻顶点由一条边连接。\n\
  \n### Cycle\n\n`cycle` 是初始顶点和最终顶点相同的路径。换句话说，序列的起点和终点相同。路径可以在返回起点之前经过许多顶点，从不访问任何顶点两次（除起点和终点外）。这意味着它形成一个闭合环。`Cycles`\
  \ 在图论中至关重要，因为它们可以衡量诸如连通性或连通图中的两点之间的距离等属性。它们还解决特定问题，如寻找最小生成树或在有向图中识别强连通分量。\n\n###\
  \ Connected Graph\n\n无向图被称为 `connected` 当且仅当每对不同顶点之间存在一条路径。无向图是 `connected` 的，如果从任何顶点到另一个顶点都有一条路径。这意味着对于图中的任意两个不同顶点，都可以通过不重新访问已访问节点的路径从一个到达另一个。换句话说，无向图中的每个节点都可以通过某种边或步骤序列从每个其他节点到达。如果两个不同顶点之间没有路径，则无向图不被视为\
  \ `connected`。\n\n### Degree of a Vertex\n\n无向图中与顶点关联的边的数量称为该顶点的 `degree`。顶点（也称为节点）是图上的一个点，该顶点的\
  \ `degree` 表示它连接到多少个其他节点。此数字可用于衡量节点之间连接的强度并理解它们之间的关系。在 ML 中，顶点的 `degree` 可帮助确定算法中最重要的连接，并更好地理解正在分析的数据。例如，假设一个节点相对于同一网络中的其他节点具有较高的\
  \ `degree`。这可能表明该节点对于使用算法做出正确预测或分类比其他节点更重要。\n\n该概念也可以在构建诸如 `neural networks` 或 `decision\
  \ trees` 等模型时使用，其中了解哪些特征最重要（因此应给予更多权重）有助于提高性能。在这些情况下，更高的 `degrees` 可能表示比 `degrees`\
  \ 较低的特征更具预测性或更有意义的特征，表明它们不应受到模型的太多关注，因为它们对模型的预测/决策缺乏相关性。\n\n对于有向图，顶点 `v` 的 `in-degree`\
  \ 是以 `v` 为头的边的数量。顶点 `v` 的 `out-degree` 是以 `v` 为尾的边的数量。\n\n## 4.11 Transforms\n\n\
  连续函数 `f(t)` 的傅里叶变换定义为\n\n$F\\left( \\mu \\right) = \\int\\limits_{- \\infty}^{+\
  \ \\infty}f\\left( t \\right)e^{- j2\\pi\\mu t}dt$,\n\n其中 `t` 和 `µ` 是连续变量。\n\n逆傅里叶变换定义为\n\
  \n$f\\left( t \\right) = \\int\\limits_{- \\infty}^{+ \\infty}f\\left( t \\right)e^{j2\\\
  pi\\mu t}d\\mu$\n\n这两个方程表示一个傅里叶变换对。\n\n欧拉公式，`e^(-j2πμt) = cos(2πμt) - j sin(2πμt)`\n\
  \n\n\n\n\n## 傅里叶变换\n\n傅里叶变换是一种将任意给定函数分解为一系列正弦和余弦函数的数学技术。它是 `ML` 中的一项基本工具，因为它允许我们通过将数据从时域转换到频域来更有效地分析数据。在\
  \ `ML` 中，傅里叶变换可以将图像等复杂信号分解为计算机更容易解释和理解的更简单分量。通过将图像或声音片段分解为其基本元素，我们在使用 `ML` 算法时可以更好地决定模型或程序中应包含什么。例如，假设我们有一张某人面部的照片。傅里叶变换可以帮助将这张照片分解为眼睛、鼻子和嘴唇等单独部分，从而在构建用于识别目的的模型或程序时为这些不同部分赋予权重。\n\
  \n傅里叶变换还有助于减少数据集中的噪声，使仅保留相关特征，这些特征随后可使用 `SVMs` 和神经网络（`NNs`）等各种 `ML` 算法进行进一步处理。这样，噪声被消除，同时保留有意义的信息，以提高基于此类数据集构建的\
  \ `ML` 模型的预测准确性。\n\n## 卷积\n\n两个函数的卷积涉及将一个函数在其原点上叠加到另一个函数上并使其滑动通过另一个函数。在滑动过程中的每个位移位置，计算包括乘积之和。它定义为\n\
  \n$\\left( {f\\*h} \\right)\\left( t \\right) = \\int\\limits\\_{- \\infty}^{+ \\\
  infty}f\\left( \\tau \\right)h\\left( {t - \\tau} \\right)d\\tau$\n\n卷积是一种 `ML`\
  \ 技术，通过对不同输入执行数学运算来帮助我们识别数据中的模式。它常用于图像识别和分类任务，其中它有助于识别图像中可用于区分一个物体与另一个物体的特征。基本方法是取多个小数据窗口并对这些窗口应用一组数学运算，例如乘法、加法或减法，以检测某些模式或特征。重复此过程直至达到所需结果，从而产生代表图像特征的一组值。然后结果可用于进一步的分析和预测任务。\n\
  \n在 `ML` 应用中，卷积可以帮助计算机理解图像中哪些部分对于分类对象或预测结果很重要。例如，假设我们想根据过去一周的一系列天气图像预测明天是否会下雨。我们可以使用卷积滤波器来识别每张图片中哪些部分最可能与降雨相关——例如乌云或大雨——以便我们的算法在预测明天的天气时考虑这些模式。\n\
  \n## 卷积的性质\n\n• 卷积是可交换的，即信号卷积的顺序对结果没有影响。\n\n`x(t) * y(t) = y(t) * x(t)`\n\n• 卷积对加法具有分配性。\n\
  \n`x(t) * [y(t)+z(t)] = [x(t)*y(t)] + [x(t)*z(t)]`\n\n• 卷积是结合的。\n\n`x(t) * [y(t)*z(t)]\
  \ = [x(t)*y(t)] * z(t)`\n\n• 平移性质：信号与时移的卷积会导致输出信号发生平移。\n\n如果 `x(t) * y(t) = z(t)`，\n\
  \n## 离散余弦变换（DCT）\n\n考虑序列 `p(n)`，0 ≤ `n` ≤ `N` − 1。该序列的一维 DCT 定义为\n\n$q\\left( k\
  \ \\right) = \\alpha\\left( k \\right)\\sum\\limits\\_{n = 0}^{N - 1}p\\left( n\
  \ \\right)\\cos\\left\\lbrack \\frac{\\pi\\left( {2n + 1} \\right)k}{2N} \\right\\\
  rbrack,0 \\leq k \\leq N - 1$\n\n$\\alpha\\left( 0 \\right) = \\frac{1}{\\left.\
  \ \\sqrt{}N \\right.}$\n\n$\\alpha\\left( k \\right) = \\sqrt{\\frac{2}{N}1 \\leq\
  \ k \\leq N - 1}$\n\n逆变换由下式给出\n\n$p\\left( n \\right) = \\sum\\limits\\_{k = 0}^{N\
  \ - 1}\\alpha\\left( k \\right)q\\left( k \\right)\\cos\\left\\lbrack \\frac{\\\
  pi\\left( {2n + 1} \\right)k}{2N} \\right\\rbrack,0 \\leq n \\leq N - 1$\n\n正变换和逆变换一起构成\
  \ DCT 对。\n\nN × N 离散余弦变换矩阵由下式给出\n\n$c\\left( {k,n} \\right) = \\left\\{ \\begin{matrix}\
  \ \\frac{1}{\\left. \\sqrt{}N \\right.} & {k = 0,0 \\leq n \\leq N - 1} \\\\ {\\\
  sqrt{\\frac{2}{N}}\\cos\\left\\lbrack \\frac{\\pi\\left( {2n + 1} \\right)k}{2N}\
  \ \\right\\rbrack} & {1 \\leq k \\leq N - 1,0 \\leq n \\leq N - 1} \\\\ \\end{matrix}\
  \ \\right.$\n\n`DCT` 是一种常用的 `ML` 技术，通过从图像或音频信号中去除不太重要的信息来减少数据量。这允许更高效地存储和传输数据。此外，`DCT`\
  \ 有助于保留大部分基本特征并减少信号中的噪声。在计算机视觉中，`DCT` 检测图像特征，如边缘、形状和纹理。它可应用于灰度图像和彩色图像，允许更快处理，因为它仅关注少数显著频率而不是图像内的所有频率。此外，与傅里叶变换或小波等其他方法相比，该技术可以用更少的参数实现更明确的目标识别。\n\
  \n它还可用于在数据通过网络传输或存储在磁盘驱动器上之前压缩大型数据集，因为减少数据大小可显著减少传输时间和存储成本。除了计算机视觉应用外，`DCT` 在语音处理任务中也很受欢迎，例如语音识别系统和文本转语音合成器，因为它能够从声波中提取人类耳朵无法检测到的显著特征，例如音高周期性模式和共振峰结构等。此外，提取的特征有助于机器以比其他方法（如傅里叶变换或小波分析技术）更高的准确率将语音信号转换为有意义的词语和句子。因此，它在自动语音识别系统中极为流行，这些系统使用\
  \ `DNNs`、`SVMs` 和隐马尔可夫模型（`HMMs`）等 `ML` 算法训练的模型。\n\n离散余弦变换（`DCT`）和离散傅里叶变换（`DFT`）是信号处理不可或缺的部分。然而，它们服务于不同的目的并表现出不同的特征，特别是在优化算法的背景下。`DCT`\
  \ 仅使用实数，与对称扩展序列的傅里叶级数系数密切相关，这使其非常适合受益于数据压缩的应用，例如图像和音频编码。这是因为 `DCT` 能够将信号能量集中到少数系数中，这一特性称为谱紧凑性。另一方面，`DFT`\
  \ 使用复数，与周期性扩展序列的傅里叶级数系数相关，并在各个领域广泛用于频谱分析。\n\n## DCT 的性质\n\n• `DCT` 是实数且正交的。\n\n\
  • `DCT` 不是 `DFT` 的实部。\n\n• `DCT` 对高度相关数据具有极佳的能量紧凑性。\n\n• `DCT` 是一种快速变换。\n\n## 离散正弦变换（DST）\n\
  \n一维序列的正弦变换对由下式给出\n\n$q\\left( k \\right) = \\sqrt{\\frac{2}{N + 1}}\\sum\\limits\\\
  _{n = 0}^{N - 1}p\\left( n \\right)\\sin\\frac{\\pi\\left( {k + 1} \\right)\\left(\
  \ {n + 1} \\right)}{N + 1}0 \\leq k \\leq N - 1$\n\n$p\\left( n \\right) = \\sqrt{\\\
  frac{2}{N + 1}}\\sum\\limits\\_{k = 0}^{N - 1}q\\left( k \\right)\\sin\\frac{\\\
  pi\\left( {k + 1} \\right)\\left( {n + 1} \\right)}{N + 1}0 \\leq n \\leq N - 1$\n\
  \nN × N `DST` 矩阵由下式给出\n\n$\\sqrt{\\frac{2}{N + 1}}\\sin\\frac{\\pi\\left( {k + 1}\
  \ \\right)\\left( {n + 1} \\right)}{N + 1}0 \\leq k,n \\leq N - 1$\n\n\n\n\n\n##\
  \ 离散正弦变换\n\n`DST` 是一种强大的数学工具，用于 `ML` 和数据科学的其他领域。它将信号或图像转换为其频率分量，从而实现更高效的处理和分析。在\
  \ `ML` 中，`DST` 应用于数据集合，这些集合对于传统方法来说过大或过于复杂，无法快速处理。将数据集分解为其频率分量可以加快模式和相关性的计算。这使得识别数据中的聚类成为可能，从而使机器学习模型做出更好的预测或决策。`DST`\
  \ 也已成功应用于图像处理应用，例如人脸识别和目标检测算法。\n\n## DST 的性质\n\n- 正弦变换是实数、对称和正交的。\n- 正弦变换不是 `DFT`\
  \ 的虚部。\n- 正弦变换是一种快速变换。\n\n## 信息论\n\n4.12 信息论\n\n信息论是数学的一个分支，处理信息的量化与操纵。它主要用于研究通信系统和数据压缩。近年来，信息论也已应用于\
  \ `ML`，其中它可以为学习算法及其性能提供见解。克劳德·香农于 1948 年在其开创性论文《通信的数学理论》中首次发展了信息论。香农定义了信息数学理论所需的核心概念：熵、互信息和信道容量。这些概念随后被用于研究电话网络、无线电广播和光纤电缆等通信系统。\n\
  \n在 `ML` 中，信息论的应用用于衡量数据集或算法需要从中学习或解决的任务的复杂性或不确定性；根据信息论指标，任务被认为越复杂，其熵值就越高。此外，`ML`\
  \ 研究人员还能够使用这些相同的指标来评估各种问题的性能，以及根据它们在这些任务上的各自表现比较不同的学习算法，包括速度（训练时间）和准确性（成功率）。\n\n\
  互信息对于数据集内的特征选择很有帮助，这意味着在模型输入中不必包含所有特征，工程师将只选择相关特征，从而在保留变量之间重要关系的同时减少数据中的噪声。\n\n\
  下面给出了与信息论相关的各种术语的定义：\n\n### 随机变量\n\n在随机实验的样本空间上定义的实值函数称为随机变量。它可以是离散的或连续的。随机变量在 `ML`\
  \ 中是一个有价值的工具，因为它们可以量化与预测或结果相关的不确定性。例如，随机变量（如概率）可以为预测算法的不同结果分配概率。这使得 `ML` 系统能够为更可能的结果分配更高的概率，为不太可能的结果分配更低的概率。它还使人类更容易解释并根据算法的结果做出决策。随机变量也可以用于强化学习算法中的决策。通过应用特定的奖励值或惩罚值，模型可以根据其对随机变量的理解学习哪种操作产生最高的期望回报。这有助于通过使用随机变量分配的值权衡利弊来更好地控制决策，而不是完全依赖直觉或纯粹的试错方法。此外，随机变量提供了不同数据集在分析神经网络等复杂系统时如何相互作用的见解。它们提供了输入数据点与其各自的输出之间相关性的信息，这些输出来自使用它们训练的\
  \ `ML` 模型。这进一步使我们能够识别改进的领域，在创建模型时我们可以调整参数以提高准确性或效率，这有助于在开发 `ML` 算法时做出更明智的决策。\n\n\
  #### 离散随机变量\n\n取有限个不同值的随机变量称为离散随机变量。它之所以不同，是因为它只能取整数或来自有限列表的特定值，而与之相对，连续随机变量可以在区间内取任意值。这意味着离散随机变量在其范围内取任意值的概率必须总和为\
  \ 1。例如，假设你有一个实验，你掷两颗骰子并计算点数总数（点数是可能的值）。点数可以是 2 到 12 之间的任意整数，给出 11 种可能的结果（2–12）。每个结果的概率将根据每个数字可用的组合数量而变化。例如，通过掷两颗骰子得到\
  \ 7 有六种不同的方法：(1 + 6)、(2 + 5)、(3 + 4)、(4 + 3)、(5 + 2) 和 (6 + 1)。因此，掷出 7 的概率等于 6/36，即等于\
  \ 1/6。总而言之，离散随机变量对于我们想要计算具有预定义结果的某些事件的概率的情况很有用，例如掷骰子或抛硬币。\n\n#### 连续随机变量\n\n在区间上取无限个值定义的随机变量称为连续随机变量。它可以从给定区间内的无限集合的数字中取任意值。它与离散随机变量不同，后者只有有限的可能值。连续随机变量的例子包括摄氏温度、海洋中的水深和树干直径。连续随机变量通常用于描述与物理现象相关的概率，例如时间、空间或速度。此外，它们对于建模具有平滑和渐进变化的数据很有用，例如股价或人口增长。在处理连续随机变量时，我们通常使用概率密度函数（`PDFs`）而不是概率质量函数（`PMFs`）。`PDF`\
  \ 为数轴上的区间而不是单个点分配概率，并帮助我们确定随机选择的数值落在某个范围内的机会。为了计算与连续分布相关的概率，我们可以使用积分而不是求和，因为它们是通过对所有可能的值进行积分获得的，而不是像离散分布那样简单地将所有可能性相加。当处理概率密度函数时，求和规则不再适用，因为它们没有固定的结果数量；这使得计算这种类型的分布的概率比离散分布要困难得多，在离散分布中，我们只需将与每个结果相关的所有可能性加起来即可获得所需的结果。\n\
  \n## 概率分布\n\n`PD`：随机实验或事件的每个结果的可能性可以通过概率分布来衡量。\n\n随机事件 `E` 具有概率 `P(E)`，包含 $I\\\\\
  left( E \\\\right) = \\\\log\\\\frac{1}{P\\\\left( E \\\\right)} = - \\\\log P\\\
  \\left( E \\\\right)$ 个信息单位。\n\n\n\n\n\n## 概率分布\n\n如果 `P(E) = 1` 则 `P(E) = 0`，这表明没有信息被归于它，即该事件没有不确定性。`PD`\
  \ 是 `ML` 中的一个关键概念，用于捕捉不确定性和随机性。它使我们能够估计事件发生或不发生的可能性，并衡量变量之间关系强弱。`PD` 可以在决策过程中发挥重要作用，帮助确定哪种模型架构或超参数将产生最佳结果。例如，在构建分类算法或神经网络等模型时，概率分布可用于选择具有最强预测能力的适当输入特征并最小化过拟合。`PD`\
  \ 还可以通过测试模型是否对少量数据点的变化足够敏感来帮助验证模型。模型的预测准确性也受其预期性能的先验知识的影响，该知识可通过研究与特定参数的不同值相关联的概率分布来获得，例如正则化系数\
  \ `lambdas` 和学习率。最后，概率分布在从模型进行预测时发挥着重要作用——它有助于根据过去数据点计算出的概率而不是绝对值来创建未来可能发生情况的估计值（例如贝叶斯推断）。这种方法使我们能够构建更可靠的预测系统，这些系统不易因异常值或极端情况而出现错误，在这些情况下，输出与给定特定输入集的预期差异很大。\n\
  \n## 熵\n\n离散随机变量 `x` 在概率分布 `p(x)` 下的熵定义为\n\n$H_{x} = - \\sum\\limits_{x \\in \\\
  chi}p\\left( x \\right)\\log_{2}p\\left( x \\right)$\n\n熵给出了随机变量不确定性的度量。\n\n在信息论中，熵指定了编码实例类别所需的最小比特数。在\
  \ `ML` 中，熵提供了训练数据集合中不纯度的度量。熵用于衡量数据中包含的信息量。它可作为评估模型性能的评估指标，也被纳入用于决策和优化的许多算法中。熵在 `ML`\
  \ 中的主要用途与决策树有关。决策树是一种使用层次结构对数据点进行分类的算法类型。熵衡量每个决策树分支内的不确定性，使我们能够决定哪个分支需要进一步探索，哪个应该被丢弃。这有助于我们评估模型对未见数据的表现，使其成为评估模型整体性能的重要组成部分。\n\
  \n熵在 `ML` 中的另一个常见应用是特征选择或特征重要性分析。通过计算不同特征的熵值，我们可以更好地理解它们包含多少信息，并确定哪些特征在预测目标变量时具有更重要的贡献。当处理具有许多特征的大型数据集时，计算熵可以帮助我们通过仅选择提供有关目标变量有用信息的相关特征来减少噪声。最后，熵在优化问题中发挥着重要作用；这包括神经网络或其他基于具有多个特征的数据集构建的复杂模型，在训练它们在未见数据点上以获得更好的泛化性能并避免过拟合问题之前，需要对它们应用一些正则化方法（例如\
  \ `L1`/`L2`）。熵可以帮助确定应为哪些权重分配更高值以减少计算复杂性，同时仍通过选择相关性更高（预测能力更强）的权重来优化性能水平。\n\n例如，抛硬币是一个随机事件。两种可能的结果是正面和反面，概率相等均为\
  \ 0.5。该事件的熵计算为\n\n$H_{x} = - \\sum\\limits_{x \\in \\chi}^{}p\\left( x \\right)\\\
  log_{2}p\\left( x \\right) = - \\sum\\limits_{i = 1}^{2}0.5*\\log_{2}\\left( 0.5\
  \ \\right)$\n\n =  − (0.5*(−1)+0.5*(−1)) = 1\n\n事件结果的均匀概率产生最大不确定性，因此熵最大。\n\n## 信息增益\n\
  \n由于根据特定属性对样本进行划分而导致熵的预期减少称为信息增益。它是 `ML` 中最关键的概念之一。它帮助机器通过评估数据质量并提供对给定数据集内所含信息量的洞察来做出决策。在\
  \ `ML` 中，信息增益决定了哪些属性在做出准确预测时最有用或最相关。这使我们能够识别并专注于在预测时对结果影响最大的特征。本质上，信息增益衡量了使用特定属性（或划分）与不使用它相比我们好在哪里。例如，如果根据属性对数据集进行划分会导致创建两个不同的子集，每个子集具有不同的分布（如果该属性与类别成员资格之间存在信息关系），则这将被视为信息增益，因为它将提供比划分数据集之前更多的信息。这使我们能够更好地从数据中学习，并在后续做出更准确的预测。为了衡量这种信息增益，可以使用熵等指标来计算给定数据集内的随机性或无序程度。这使我们能够量化在\
  \ `ML` 算法的训练阶段使用不同属性或划分时是否在准确性方面有任何实际收益，例如决策树归纳方法。例如，假设特定划分/属性与另一个相比没有提供任何实际收益。在这种情况下，它的信息增益会较低，而提供收益的属性可能会导致更高的增益。\n\
  \n设 `S` 为具有多个属性的训练样本集，由 `A` = {`A[1]`,`A[2]`,⋯,`A[n]`} 表示。\n\n$\\text{Information}\\\
  ,\\text{Gain}\\left( {S,A_{i}} \\right) = \\text{Entropy}\\left( S \\right) - \\\
  sum\\limits_{v\\, \\in \\,\\text{values}\\,of\\, A_{i}}\\frac{\\left| S_{v} \\right|}{\\\
  left| S \\right|}\\text{Entropy}\\left( S_{v} \\right)$\n\n第二项表示 `S` 之后的预期熵。\n\n\
  ## 流形\n\n机器学习处理的是与更高维度相关的数据。在更高维度可视化数据很难绘制。为了更好地理解和可视化数据，应减少数据的维度。用于降维的方法有很多。\n\n\
  流形是一种描述弯曲空间的数学结构。它是将欧几里得几何中用于描述在曲率可变的环境中移动物体的思想推广。流形可以被认为是一个抽象的数学对象，它平滑地连接多个点。为了更好地理解这一点，可以把它想象成一张纸；如果你弯曲一个角，整张纸都会变得弯曲，但它上面的所有点仍然以某种方式连接在一起。当我们使用流形来建模我们的世界时就会发生这种情况——即使空间在我们周围弯曲，我们仍然可以使用数学来理解它，通过连接它的所有点。流形还允许我们描述不同形状如何相互作用以及它们如何随时间和距离而变化。总之，流形为我们从实践和理论两个角度理解我们的宇宙提供了一个强大的工具！\n\
  \n4.13Manifolds\n\n\n\n\n\n## 流形学习\n\n## 局部线性嵌入 (LLE)\n\n对流形进行建模的过程称为流形学习。局部线性嵌入\
  \ (`LLE`) 是一种流形学习技术，用于非线性降维。`LLE` 通过将训练实例与其近邻关联来产生高维数据的低维嵌入。`LLE` 是一种非线性降维技术，用于在保留其原始结构和信息的同时降低数据维度。当数据具有高维度，使得可视化或分析具有挑战性时，这可能是有益的。`LLE`\
  \ 技术目标是找到原始数据的低维表示，这些表示在局部相似的同时保留全局结构。局部相似意味着在进行降维后，数据集中相似的点仍然保持接近。这可以通过让每个点由其 `K-nearest\
  \ neighbors` 表示来实现，因为这些点很可能在局部相似。为了保留全局结构并识别本质特征，在此过程中远距离点之间的距离不能被忽略。\n\n要使用 `LLE`\
  \ 降低数据集的维度，首先，每个数据点必须找到其 `K-nearest neighbors` 并用这些数据点形成一个 `n-dimensional` 向量（其中\
  \ `n` 等于样本数）。接下来，它将为每个邻居计算权重，以便所有 `n` 个向量主要沿其局部方向对齐，但仍保持彼此之间的远距离相关性；这是通过最小化一个称为重构误差的目标函数来完成的，该函数衡量每个点能够通过使用从\
  \ `K-nearest neighbors` 选择步骤构建的权重矩阵从其邻居重构的程度。最后，在为每个样本的对应邻居找到权重后，这些加权样本将使用奇异值分解\
  \ (`SVD`) 或其他技术如 `PCA` 投影到低维空间。\n\n## 奇异值分解 (`SVD`)\n\n`SVD` 是一种强大且多用途的方法，用于数学、计算机科学和工程的许多领域。`SVD`\
  \ 是一种用于将矩阵分解为其构成部分的算法。它也被称为矩阵分解过程。此分解将原始矩阵分解为三个较小的矩阵：两个酉矩阵和一个包含奇异值的对角矩阵。`SVD` 算法已被用于各种应用，包括图像压缩、信号处理、人脸识别系统和文本挖掘。在图像处理中，例如，它可用于通过丢弃被认为对进一步分析或显示目的冗余或无用的信息来减小图片的大小。就文本挖掘应用而言，`SVD`\
  \ 可用于通过术语-文档矩阵 (`TDMs`) 分析文档，从而捕捉其语义内容。通过将这些 `TDMs` 中不同文档的词组合在一起，我们可以正确分析这些文档的内容，通过识别其中讨论的话题以及这些话题是否在所有文档样本中得到充分代表；这使我们能够根据其内容或主题将相似的文档更准确地分组，而无需使用任何形式的聚类/分组算法，如\
  \ `KNN`/`K-means` 聚类方法。\n\n`SVD` 还可应用于从音频信号中降低噪声，以及通过降低维度使数据更易于存储压缩；这有助于提高内存效率并加快计算时间。结果将包含原始庞大维度空间中的所有全局信息，并为我们提供压缩表示，降低到低维空间，同时不丢失任何本质的局部/全局结构，并且在计算上高效。\n\
  \n## 总结\n\n• 集合是一个定义良好的对象集合，有限集合用于分类、聚类和回归。空集，用 `∅` 表示，表示缺失或无关的数据点。无限集，包含无限多个元素，用于机器学习中的大数据集或连续数据。集合的笛卡尔积用于数据分析以识别变量之间的关系。关系是笛卡尔积的子集，表示元素之间的关系，并用于使用监督学习算法如决策树、`SVM`\
  \ 和神经网络进行预测。\n\n• 函数允许机器基于不断变化的输入做出准确预测，尤其是在股票价格预测或图像识别等复杂任务中。凸函数，如严格凸函数和凸组合，最小化执行任务相关的总成本。凸组合方法结合多个模型，减少复杂性并提高准确性。凸包概念描述了物体在边界线方面的形状，顶点形成凸包。\n\
  \n• 梯度向量是机器学习中使用的数学工具，用于计算变量变化的方向和幅度。它们用于梯度下降等优化算法中，以找到给定函数中特定参数的最优值。Hessian 矩阵是给定函数二阶偏导数的矩阵，有助于识别局部最大值或最小值。优化可分为三类：线性和非线性、约束和无约束，以及离散、连续和概率。\n\
  \n• 局部和全局最优点被认为是局部和全局最优。约束优化有助于在考虑特定约束的同时找到最佳解决方案。双优化同时优化两个目标。弱对偶定理指出，任何对偶问题的可行解都大于原问题的任何可行解。强对偶定理为优化算法提供了数学证明。\n\
  \n• 动态规划通过组合子问题的解来解决问题的。亚线性算法通过读取输入的微小比例并在亚线性时间内处理它来解决问题的。完全图有助于识别数据中难以检测的模式。子图有助于识别数据中的模式和关系。傅里叶变换将函数分解为正弦和余弦函数，从而实现高效的数据分析。信息论是数学的一个分支，已应用于机器学习，以提供对学习算法和性能的见解。\n\
