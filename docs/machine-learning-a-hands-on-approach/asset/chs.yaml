  \n## 12.5.2 预测电力需求和供应\n\n在风电预测中，HyRef 是 IBM 开发的系统，可以提前 36 小时以 90% 的准确率预测风电场的发电量。HyRef\
  \ 使用来自卫星、雷达、传感器和摄像机等多个来源的天气数据，在不同高度和位置创建风速和风向的高分辨率模型。然后 HyRef 将 ML 算法应用于这些模型，为每台风力涡轮机和风电场生成预测。HyRef\
  \ 还可以通过检测异常和故障来优化风力涡轮机的运行和维护。通过使用 HyRef，公用事业公司可以更好地规划其发电组合和调度策略，并减少对化石燃料和温室气体排放的依赖。\n\
  \n太阳能预测中 ML 应用的另一个例子是由 Google 子公司 DeepMind 开发的系统，该系统可以根据卫星图像预测太阳能板的发电量。该系统还可以考虑每个面板的方向和效率，以及附近物体造成的遮挡效应。通过使用该系统，Google\
  \ 可以优化其数据中心对太阳能的使用并减少其碳足迹。\n\n### 参考文献\n\n• Vestas. IBM Big Data Success Stories.\
