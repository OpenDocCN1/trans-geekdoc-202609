  58. (a)\n59. (b)\n60. (c)\n61. (a)\n62. (b)\n\n## 机器学习中的概率与统计\n\n| 机器学习中的概率与统计 |\n\
  | --- |\n## 学习目标\n\n在本章结束时，你能够：\n- 解释概率和统计的基础概念\n- 定义联合概率、边缘概率和条件概率\n- 识别离散和连续概率分布\n\
  - 使用贝叶斯定理更新概率估计\n- 使用矩生成函数(`MGF`)描述概率分布\n- 使用极大似然估计(`MLE`)估计参数\n- 利用极大后验估计(`MAP`)进行贝叶斯推理\n\
  - 解释密度函数及其在概率中的作用\n\n2.1 引言\n\n概率论和统计学是机器学习（ML）和数据科学的基础。数据预处理、清洗和可视化都高度依赖概率和统计。因此，理解这些术语的定义对于了解它们是如何联系的至关重要。\n\
  \n随机现象的数学研究是概率论的主题。相反，被称为统计学的数学领域关注收集、检查、解释和展示数据。\n\n监督学习算法如线性回归和平向量机（SVM）利用概率分布和统计推理技术根据过去的值预测未来。例如，某公司想使用线性回归算法预测股票。它首先收集不同期间的历史价格。然而，收集的数据包含内在噪声。因此，我们使用概率分布（如正态分布）来消除离群值。然后，我们运行多种统计检验来评估模型拟合的程度（如\
  \ F 检验）。基于此，我们评估性能并进行必要的调整，直到模型经过充分。之后，我们使用机器学习根据实际市场运动评估模型并进行必要的调整。\n\n另一个例子是利用卷积神经网络（CNN）对照片进行分类。在将照片馈入\
  \ CNN 训练过程之前，我们首先需要标记好的图像或照片。我们可以通过使用 LabelImg 等程序进行手动标记、从在线图像集合（如 ImageNet）下载已标记的图像，或者从网站/社交媒体页面爬取无标记照片并使用众包服务（如亚马逊机械众）进行标记来获取。在这里，我们主要通过基于输入像素概率计算的卷积层执行特征提取。然后，我们将提取的特征通过带有感知器神经元的全连接层，这些神经元的权重将被调整数次，直到出现优化的概率，预测每个照片预期的类别。\n\
  \n2.2 概率\n\n随机事件及其发生概率的研究被称为概率。它衡量特定事件发生的可能性，表示为 0 到 1 之间的数字，其中 0 表示不确定性（不可能性），1\
  \ 表示确定性（可能性）。\n\n\n\n\n\n## 引言\n\n以抛掷一枚均匀硬币为例。出现正面的概率和反面的概率均为 0.5。因此，如果我们反复抛掷硬币，我们预计正反面出现的概率是相当的（表\
  \ 2.1）。\n\n表 2.1 抛掷硬币及其可能的结果和概率\n\n| 可能的结果 || 结果数量 | 概率（结果数量/总结果数量） |\n| --- | ---\
  \ | --- |\n| 正面 || 1 || 1/2 = 0.5 |\n| 反面 || 1 || 1/2 = 0.5 |\n| 总计 || 2 | |\n\n\
  另一个例子是掷六面骰。由于有六种可能的结果，其中只有一个 `1`，因此掷出 `1` 的概率是 1/6。骰子上上有三个偶数，因此掷出偶数的概率是 3/6 或 ½（表\
  \ 2.2）。\n\n表 2.2 掷骰子及其可能的结果和概率\n\n| 可能的结果 || 结果数量 | 概率（结果数量/总结果数量） |\n| --- | ---\
  \ | --- |\n| 偶数 || 3(2, 4, 6) || 3/6 = 0.5 |\n| 奇数 || 3(1, 3, 5) || 3/6 = 0.5 |\n\
  | 总计 || 6(1, 2, 3, 4, 5, 6) | |\n\n此外，概率用于统计推断，统计推断是指从样本数据推断关于总体信息的过程。例如，如果我们想知道喜欢香草冰淇淋超过巧克力冰淇淋的人数百分比，我们可以对随机样本进行调查，并使用概率论对整个总体得出结论。概率是数学中的一个基本概念，广泛应用于机器学习（ML）和统计分析。它为我们提供了一个框架来建模和理解随机事件，并根据它们发生的概率做出明智的。\n\
  \n## 2.3 概率论\n\n概率在机器学习中起着至关重要的作用，因为它为数据中不确定性的建模和推理提供了坚实的基础，而这是许多机器学习算法的基本方面。概率论允许我们通过以下方式量化不确定性，并根据概率推理做出明智的决策：\n\
  \n*   **监督学习**：概率论用于 `naive Bayes` 和 `logistic regression` 等技术，以估计输入属于特定类的概率。\n\
  *   **无监督学习**：在 `K-means` 和高斯混合模型等聚类算法中，概率分布用于对数据的底层结构建模。\n*   **强化学习**：在这里，概率根据特定动作的奖励期望值来估计奖励函数。\n\
  *   **贝叶斯网络**：概率图模型用于表示和推理不确定性知识，这是许多现实应用中的共同特征。\n\n## 2.4 联合概率、边缘概率和条件概率\n\n概率是衡量某事发生可能性的一种方法。我们在日常生活中利用概率做出决策。[注：提示中提供的剩余文本包含高度重复且无意义的短语；已根据指令清理了核心概念定义，在保留核心内容的同时删除了冗余错误。]\n\
  \n\n\n\n金融也是概率论发挥重要作用的领域之一。例如，我们可以使用概率论估计公司破产的可能性，或使用概率论计算股票投资组合的预期收益。\n\n概率论在工程中用于构建可靠且耐用的系统，在物理学中用于模拟粒子和系统的行为。最后，它被应用于计算机科学，用于数据分类以及在人工智能（AI）和\
  \ `ML` 中生成预测。\n\n## 2.5 统计学\n\n数据收集、分析、解释、展示和组织都是统计学的范畴，统计学是数学的一个分支。它提供了一个基于数据进行理解和决策的框架，并应用于商业、科学、医学和社会科学等多个领域。例如，企业可能会采用统计分析，根据历史销售信息来预测客户对某种产品的需求。\n\
  \n统计学通过收集和检查数据集来对其进行推断。它涉及多种方法，包括聚类（将相关部分合并）、回归分析（识别变量之间的相关性）、描述性统计（比较平均值）和推断统计（形成预测）。此外，它在评估各种\
  \ `ML` 模型的有效性方面很有帮助。它还通过使用 `t-tests`和卡方检验将模型的准确性与实际结果进行比较，从而提供了验证模型的策略。最后，在模型针对真实数据进行测试之前，统计学通过提供分析数据集的方法发挥了至关重要的作用。\n\
  \n统计学是 `ML` 中不可或缺的，因为它为分析和解释数据提供了框架。统计方法用于理解变量之间的关系，并识别可用于构建预测模型的模式。统计学在 `ML` 中的一些示例包括：\n\
  \n* 数据探索与清洗：在构建预测模型之前，需要对数据进行分析以识别模式并消除错误或不一致之处。可以使用描述性统计和图形化表示等统计方法来实现这一点。\n* 数据预处理：特征缩放和归一化等统计技术可以转换数据，使\
  \ `ML` 算法能够更好地理解数据。\n* 模型选择：使用统计方法比较不同模型的性能，并选择出提供最佳准确率的模型。\n* 模型评估：使用交叉验证和假设检验等统计技术来评估模型的性能并确定其有效性。\n\
  \n结论是，统计学是在各个领域中检查数据并从数据得出结论的有效工具。\n\n## 2.6 概率分布的核心概念\n\n在处理概率分布时，理解某些关键概念和计算方法至关重要。\n\
  \n### 2.6.1 随机变量\n\n随机变量是指那些根据情况而具有不同值的变量。它们是理解特定情况非理性的数学工具。此外，它们被用于 `ML` 中分析数据集并估计潜在的模式和相关性。\n\
  \n考虑一个包含多个变量的数据集，例如年龄、性别等。你可以将每个变量视为独立的随机变量（`RV`）。使用 `RV` 理论，你可以确定这组特定变量在未来发生的概率。例如，你可以使用\
  \ `RV` 计算某明年是女性且年龄为 25 岁的可能性。\n\n随机变量在 `ML` 中至关重要，因为它们代表了概率模型中的数据点。它们可以模拟影响预测、分类或聚类任务结果的不确定或未知值。\n\
  \n`RVs` 也可以用于 `ML` 算法来测试假设，并利用历史数据集对未来事件做出预测。例如，假设我们有一个假设：“购买昂贵物品的人往往年龄偏大”。我们可以通过构建一个捕捉年龄信息的\
  \ `RV` 来测试这一假设，并将其与昂贵物品和廉价物品的购买记录进行比较。然后我们可以从这些结果中推导出一个统计量，根据这两个变量在相互比较时的关联紧密程度告诉我们我们的假设是真是假。\n\
  \n### 2.6.2 平均值\n\n概率分布的平均值（或平均数）通过相加所有可能的结果并将总和除以结果的总数来计算。例如，通过相加所有学生的身并除以总人数来得到平均身高。\n\
  \n\n\n\n例如，如果你同时投掷两次硬币 10 次，你预计会得到五次正面和五次反面（你的方差将显示你离这个理想结果有多近）。期望是随机变量中心趋势的度量。它是通过将变量的每个可能值与其发生的概率相乘，然后将这些乘积相加得到的。结果是变量的期望值。期望公式可以表示为：\n\
  \nE(X) = ∑ x * P(X = x)，其中 `X` 是随机变量，`x` 是 `X` 的一个可能值，`P(X = x)` 是 `X` 取值为 `x` 的概率。\n\
  \n例如，考虑一个均匀的六面骰子。掷骰子的可能结果是 1、2、3、4、5 和 6，每个结果的概率均为 `1/6`。骰子点数结果的期望值可以计算为：\n\nE(X)\
  \ = (1 * 1/6) + (2 * 1/6) + (3 * 1/6) + (4 * 1/6) + (5 * 1/6) + (6 * 1/6) = 3.5\n\
  \n这意味着，如果我们多次掷骰子，平均结果将是 3.5。\n\n另一方面，方差衡量的是随机变量分布的离散程度。一组值（如从种总体中抽样的观测值或样本）之间的差异被测量为方差。它衡量了数据点与其均值或平均值之间的离散程度。它可以用于判断一个观测数据点是由驱动其发生的底层因素导致的概率更大，还是由纯随机偶然导致的概率更大。\n\
  \n它是通过取偏离均值的平方的期望值计算的。方差的公式可以表示为：\n\nVar(X) = E[(X - E(X))²]，其中 `X` 是随机变量，`E(X)`\
  \ 是它的期望值。\n\n继续以掷均匀六面骰子的例子，骰子结果的方差可以计算为：\n\n```\nVar(X) = E[(X - E(X))²]\n= [(1\
  \ - 3.5)² * 1/6] + [(2 - 3.5)² * 1/6] + [(3 - 3.5)² * 1/6] + [(4 - 3.5)² * 1/6]\
  \ + [(5 - 3.5)² * 1/6] + [(6 - 3.5)² * 1/6] = 35/12\n```\n\n方差的平方根被称为标准差，它是衡量分布离散程度的常用标准。\n\
  \n让我们假设，我们打算使用带有梯度下降优化的线性回归，根据邮政编码和中收入水平等局部特征来预测房价。在训练模型之前，我们可能会同时进行方差分析和期望分析。首先，我们将使用方差分析来识别房价显著高于或低于目标中值的区域，让我们知道在训练期间应该向哪些区域投入更多资源。接下来，我们将使用期望分析来确定在位置相关因素（如中收入水平或邮政编码变化）给出，房价增加或减少的幅度，允许我们适当调整模型直到其符合我们的预期。\n\
  \n高方差模型容易产生过拟合，在训练集上表现良好但在测试数据上表现较差。然而，低方差模型在训练和测试数据上表现良好，但可能对数据欠拟合。核 SVM 和决策树是高方差模型的例子，而线性回归是低方差模型。均方误差\
  \ (`MSE`) 是一种期望，用于衡量回归问题中实际值与预测值之间的差异。例如，期望值可以用于计算聚类算法的准确性。\n\n总之，方差衡量了模型在感知训练数据后预测新数据的能力。期望则用于衡量算法和模型的性能。\n\
  \n## 2.7 概率分布\n\n数字集合被称为标准分布，它们出现的频率比根据平均发生次数预测的要高。标准分布（也称为概率分布）经常用于数学、科学和经济学来描述随机变量并分析数据。此外，这些标准分布可以用于机器学习（ML）来理解数据趋势和模式，或对相关对象进行分组。\n\
  \n标准分布在机器学习中至关重要，因为它们有助于揭示数据趋势和模式的洞察，使企业和机构能够更有效地应对变化的业务需求。因此，企业可以通过应用正态分布、泊松分布和指数分布等统计建模技术，在最大化收益的同时最小化支出，最终获得更高的成功！\n\
  \n概率分布总体具有广泛的实际用途。例如，企业利用概率分布来模拟损益的分布，保险公司利用模拟理赔的分布。此外，科学家利用它们来模拟实验中数据的分布，气象预报员利用它们来预测特定天气模式的可能性。\n\
  \n假设检验是概率分布的一个典型用途。给定一个总体均值或比例，概率分布确定了获得特定样本均值或样本比例的概率。\n\n根据组样本对总体做出假设或推断被称为统计推断。例如，置信区间和\
  \ p 值帮助我们评估结果由偶然产生的可能性，它们是通过概率分布计算的。\n\n概率分布可以是离散的，也可以是连续的。连续概率分布用于对可以在给定范围内取任何值的事件建模，而离散概率分布用于对只能取特定值的发生建模。我们现在将详细研究这些内容。\n\
  \n### 2.7.1 离散概率分布\n\n对取特定值的概率的模型被称为离散概率分布。任何具有计数且有限结果的概率分布都是离散的。这表明变量的可能值是不同且相互独立的。\n\
  \n概率质量函数 (`PMF`) 用于描述离散分布，提供了每个可能结果的概率。例如，因为可能的结果只有 1 到 6，所以掷六面骰子的概率分布是离散的。\n\n\
  二项分布、多项分布、泊松分布和伯努利分布是离散概率分布的一些例子。\n\n#### 2.7.1.1 二项分布\n\n这是离散概率分布的一种，用于模拟在定义的独立试验中出现特定次数成功的概率。二项分布用于模拟只有两种可能结果的情况，如成功或失败。固定次数独立试验中成功的次数在统计学中经常被建模。例如，10\
  \ 次硬币掷中面的次数可以使用二项分布进行建模。\n\n二项分布的 `PMF` 为：\n\n```P(X = k) = (n choose k) * p^k *\
  \ (1 - p)^(n - k)\n```\n\n变量 `X`、`n`、`p`、`k` 和 `(n choose k)` 都是随机的。`X` 是随机变量，`p`\
  \ 是成功概率，n 是试验次数，k 是成功的次数。在机器学习中，二项分布经常用于模拟点击率、转化率和流失率等二结果。例如，我们可能有一个包含 1000 名消费者的数据集，并根据他们的人口统计和行为信息估计有多少人会购买。带有二项分布的二分类逻辑回归模型可预测客户购买产品的概率。\n\
  \n\n\n\n\nA/B 测试是二项分布在机器学习中的另一个应用。这里，我们随机将消费者分为两组，并向他们展示网站或应用的多个迭代。在测量每个组的转化率后，使用二项分布对偶然观察到转化率的概率进行建模。这使我们能够评估两组之间转化率差异的统计显著性。\n\
  \n通过了解二项分布，机器学习专家可以创建更稳健的模型和更精确的预测。它用于诸如二元分类等任务，其中涉及预测给定输入是否属于两个类别之一。此外，它有助于确定一组独立试验中每次试验成功或失败的概率。\n\
  \n### 2.7.1.2 多项分布\n\n这用于建模具有超过两种可能结果的数据。这种方式是对二项分布的推广，二项分布描述的是具有两种可能结果的数据。例如，多项分布可以应用于自然语言处理，以模拟文档或文档语料库中单词的频率分布。在这种情况下，每个单词都可以被视为一个类别，多项分布可用于模拟每个单词在文档或语料库中重复出现的频率。\n\
  \n图像分类是多项分布在机器学习中的另一个应用。在这种情况下，一张图片可以用特征向量来表示，例如像素值或颜色直方图。可以利用多项分布来模拟这些特征的分布，其中每个特征都与一个类别相关联。\n\
  \n多项分布的众多特性使其在机器学习中具有价值。由于它是一个离散分布，因此可用于建模计数数据。由于它是多项似然函数的共轭先验，因此也可以用作贝叶斯推断中的先验分布。\n\
  \n假设我们有一组电子邮件数据，我们希望根据特定术语在电子邮件中出现的频率将每封电子邮件分类为垃圾邮件或非垃圾邮件。每封电子邮件可以表示为一个词频向量，其中向量中的每个项目代表特定单词在电子邮件中出现的频率。可以利用多项分布来模拟每个单词出现的频率，其中每个单词表示一个特定类别。\n\
  \n另一个例子是主题建模，这是一种探索大型文本数据集的流行技术。它基于这样一个想法：每个语料库文档都包含不同主题的混合，每个主题都表示为单词上的概率分布。在这种情况下，多项分布估计单词出现在特定主题中的可能性，从而有助于识别给定语料库最相关的主题。另一个应用是情感分析。例如，它可用于模拟文本语料库中积极、消极或中立态度的分布，并帮助将新文档根据最可能存在的情感分类为这三组之一。\n\
  \n### 2.7.1.3 泊松分布\n\n这被广泛用于复制随时间发生的偶发事件，例如一小时内通过收费站的车辆数量或呼叫中心每天接到的电话数量。因此，泊松分布表示在给定平均发生率的情况下，事件随时间发生的可能性，例如顾客每周购买商品的次数或游客每月到达城市的次数。这使我们能够估计此类事件在此时间范围内发生的可能性，以便为库存需求等做出必要的计划。\n\
  \n假设我们每天平均有 10 位顾客光顾我们的商店。利用泊松分布和其他变量如季节性，我们可以估计此类事件在此时间范围内发生的可能性，以便为库存需求等做出必要的计划。\n\
  \n### 2.7.1.4 伯努利分布\n\n这在机器学习中经常被使用。由于它是一个离散分布，成功或失败是唯一可能的结局。任何具有两种结果的二元事件，例如抛硬币，都可以使用伯努利分布进行建模。该分布仅接受一个参数，即成功的概率\
  \ `p`。失败的可能性为 `1-p`。\n\n情感分析使用伯努利分布来评估文本是积极还是消极。例如，我们可以估计某个单词出现的可能性，以将新评论分类为积极或消极。想象一下，我们有一个包含\
  \ 100 次抛硬币的数据集。获得正面或反面的可能性可以使用伯努利分布进行建模。假设正面出现的概率为 `0.6`。之后，我们可以预测获得正面的可能性为：\n\n\
  ```\nP(X=1) = p = 0.6\nP(X=0) = 1 - p = 0.4\n```\n\n另一个例子是欺诈检测。利用伯努利分布，我们可以预测一笔交易是否会是欺诈性的。如果某笔交易更可能为欺诈性而非非欺诈性，我们可以利用这些信息将未来交易分类为欺诈性或非欺诈性。\n\
  \n逻辑回归模型是伯努利分布在机器学习中的一个应用，这些模型经常用于分类任务，其中我们有一些数据点被标记为一个组，例如猫，而其他数据点被标记为另一个组，例如狗。\n\
  \n### 2.7.2 连续概率分布\n\n一种连续概率分布，称为均匀分布，表示在特定范围内发生的随机变量具有相等的机会。连续分布由概率密度函数 (`PDF`)\
  \ 描述，该函数提供了特定值发生的相对可能性。\n\n\n\n\n例如，因为身高可以取指定范围内的任何值，因此特定人群中成年男性的身高概率分布是连续的。正态分布（通常称为高斯分布）是一种连续概率分布。许多现实世界中的现象（如\
  \ IQ 分数的分布）都是使用正态分布进行建模的。\n\n### 2.7.2.1 正态分布\n\n正态分布由于其在直方图中的形状，有时高斯分布或钟形曲线，是一种常见的标准分布类型。由于\
  \ 50%的值高于均值，50%的值低于均值，它关于均值对称。由于其遵循规律模式且易于预测特定结果的概率，这种分布在统计学中被频繁使用。例如，标准分布模型可以计算在已知\
  \ 70%的学生分数在 80% 到 90% 之间的情况下，能够在考试中获得 A 等级的学生人数。这是因为大多数结果可能会落在这一范围内，而不是落在两端（超过 90%\
  \ 或低于 80%）。\n\n机器学习经常使用它来模拟现实世界的事件，如物理量的测量或传感器读取中的噪声。在股票市场分析中，高斯分布可用于模拟股票的收益分布，其中均值反映平均收益，标准差代表股票的波动性。均匀分布和高斯分布被应用于各种机器学习场景，包括：\n\
  \n• **数据生成**：创建可能用于训练和测试机器学习模型的合成数据。例如，在图像识别案例中，可以使用均匀分布生成人工图像，以模拟图像中的像素值。\n\n•\
  \ **聚类**：将相似的数据点聚集在一起。例如，高斯分布可以用于对具有相似购买模式的消费者进行聚类，并在客户细分的背景下代表客户购买的分布。\n• **特征选择**：使用特征选择方法评估数据集中特征的重要性。例如，在文本分类案例中，文档中的单词频率可以使用多项分布进行建模，只有概率最高的单词才能被作模型的特征。\n\
  \n正态分布可以代表各种现实世界的现象，包括成年男性身高和果实重量。\n\n正态分布的 PDF（概率密度函数）给出：\n\n```\nf(x) = (1 / (σ\
  \ * sqrt(2π))) * exp(-((× - µ)²) / (2σ²))\n```\n\n其中 `µ` = 均值，`σ` = 标准差。\n\n###\
  \ 2.7.2.2 指数分布\n\n随时间随机且独立发生的事件之间的间隔，通常使用指数分布进行建模。假设你是一个呼叫中心员工，需要知道下一次客户来电之前的时间间隔。指数分布可以帮助确定客户在下一分钟、五分钟或任何其他时间来电的概率。\n\
  \n在机器学习中，它可以被用于，例如表示事件之间的间隔，如网站用户点击之间的间隔。通过检查这段时间，我们可能会发现更多关于用户行为的信息，并修改网站设计以提高用户参与度。\n\
  \n### 2.7.2.3 均匀分布\n\n这类分布假设落在特定范围内的所有值发生的概率相相等。这意味着，如果将每个值落在范围内的概率绘制成图，将产生一条平直的水平线。投掷公平骰子是均匀分布作用的一个说明。均匀分布可以描绘均匀的分布。\n\
  \n正态分布可以代表各种现实世界的现象，包括成年男性身高和果实重量。\n\n### 2.8 概率分布示例\n\n• **抛掷硬币**：抛掷硬币时，正面或反面的概率相等。例如，正面的出现概率为\
  \ `1/2`。反面的出现概率为 `1/2`。\n• **掷骰子**：投掷公平骰子时，每个数字出现的概率相等。例如，可以掷出 `1` 到 `6` 之间的任何数字。\n\
  • **学生身高**：如果均值为 `5` 英尺，标准差为 `0.5` 英尺，则正态分布可以确定学生达到该高度的概率。\n• **完成任务所需的时间**：例如，如果完成某任务的平均时间为\
  \ `10` 分钟，我们可以使用指数分布来确定任务完成的概率。\n• **通过红灯的车辆数量**：如果我们知道每分钟通过红灯的平均车辆数为 `10`，则泊松分布可以计算特定时间内通过红灯的特定数量车辆的概率。\n\
  • **温度**：例如，如果平均温度为 `70` 度，标准差为 `5` 度，可以使用正态分布计算温度为特定值的概率。\n• **产品销售**：例如，如果我们知道销售概率为\
  \ `0.2`，则可以使用二项分布来确定单日内成五笔交易的概率。\n• **产品缺陷数量**：例如，如果我们知道一个产品的平均缺陷数为 `2`，则泊松分布可以计算特定产品具有特定数量缺陷的概率。\n\
  • **客户到达时间**：例如，如果标准差为 `15` 分钟，平均到达时间为上午 10 点，我们可以使用正态分布计算客户在那个时间到达的概率。\n• **产品寿命**：例如，一个产品的平均寿命为五年。在这种情况下，我们可以使用指数分布来确定产品在给定时间内故障的概率。\n\
  • **两点之间的距离**：如果我们知道平均距离为 `100` 米，标准差为 `10` 米，则可以使用正态分布来确定距离为特定值的概率。\n• **股票价格**：如果我们知道股票的均值和标准差，可以使用对数正态分布确定股票价格为特定值的概率。\n\
  • **反应时间**：例如，如果平均反应时间为 `0.3` 秒，标准差为 `0.05` 秒，我们可以使用正态分布来确定反应时间在特定范围内的概率。\n\n\n\n\
  \n- **交通流量**：如果我们知道通过通过特定交叉路口的平均车辆数为每分钟 `20` 架，我们就可以使用 `Poisson` 分布来确定在给定时间内通过特定数量车辆的概率。\n\
  - **温度波动**：如果我们知道平均温度和温度波动的标准差，我们就可以使用正态分布来确定温度在特定范围内的概率。\n- **通话时长**：如果我们知道通话的平均时长，我们就可以使用指数分布来确定通话持续特定时间的概率。\n\
  - **降水量**：如果我们知道平均降雨量以及伽马分布的尺度参数和形状参数，我们就可以使用伽马分布来确定发生特定量降雨的概率。\n- **贷款违约**：如果我们知道单笔贷款违约的概率以及投资组合中贷款的总数，二项分布可以计算该投资组合中特定数量贷款违约的概率。\n\
  - **客户到达**：如果我们知道每小时或每天平均到达的客户数，`Poisson` 分布可以计算在特定时间内有特定数量客户到达的概率。\n- **考试成绩**：如果我们知道考试成绩的平均值和标准差，我们就可以使用正态分布来确定特定分数或分数范围的概率。\n\
  - **销售预测**：如果我们知道历史销售数据以及销售的平均值和标准差，我们就可以使用正态分布来确定未来销售在特定范围内的概率。\n- **网站流量**：如果我们知道网站每天或每小时平均访问人数，我们就可以使用\
  \ `Poisson` 分布来确定在给定时间内特定数量访问人数的概率。\n\n概率分布对于理解和分析随机事件及现象至关重要。离散和连续概率分布有其特征和用途，不同类型的概率分布适用于不同事件的建模。\n\
  \n## 2.9 条件分布\n\n条件分布描述了两个随机变量之间的联系。它显示了在另一个变量取值的情况下一个变量发生的概率。例如，如果我们有一个只能取值为 `0`\
  \ 或 `1` 的随机变量 `X`，另一个只能取值为 `A`、`B` 或 `C` 的随机变量 `Y`，我们可以使用条件分布来解释在给定 `X` 时 `Y` 取每个值的概率。这种概率模型有助于我们理解各种变量之间的关系，并可预测未来数据。\n\
  \n取决于相关随机变量的类型，它可以是离散或连续的。如果相关的随机变量本身是离散的，则条件分布是离散的。相反，如果随机变量是连续的，则条件分布是连续的。例如，人的身高可以是一个连续随机变量，而性别是一个离散随机变量。\n\
  \n考虑掷两个硬币的简单情况。假设第一枚硬币出现正面后，我们也在寻找另一枚出现正面的概率。在这种情况下，第一枚硬币的结果决定了第二枚硬币的条件分布。如果第一枚硬币是反面，第二枚硬币的条件分布将会不同。\n\
  \n在统计学机器学习中，条件分布经常用于建模和预测。例如，它被用于自然语言处理（NLP），根据句子中之前的词来预测某个词出现的概率。它还用于图像识别，即在给定一组视觉特征的情况下预测特定对象的概率。\n\
  \n## 2.10 联合分布\n\n与条件分布类似，联合分布表示两个（或多个）变量同时发生的联合概率。这些分布评估了示例变量 `X` 和 `Y` 在任何给定时刻为\
  \ `0` 或 `1` 的概率。通过联合分布，我们可以确定两个变量是否相关；例如，`X` 的增加会导致 `Y` 的增加吗？其中一个的下降意味着另一个的下降吗？检查联合分布可以提供这类问题的答案。\n\
  \n联合分布可能是连续的或不连续的。如果随机变量是离散的（如掷硬币），联合分布对应于特定的值。相反，如果随机变量是连续的（如温度计上的温度），则必须对联合分布进行积分以表示概率密度。联合分布对于理解随机变量之间的相关性和依赖关系都有帮助。\n\
  \n例如，假设我们想研究学生的学习时间与特定主题成绩之间的相关性。我们可以将这些数据显示为表格或矩阵，其中行对应不同的学习时间，列对应不同的学生成绩（表 2.3）。\n\
  \n### 表 2.3：学生学习时间与主题成绩之间的相关性\n\n| 学习时间 | A 等 | B 等 | C 等 |\n| --- | --- | --- |\
  \ --- |\n| 1 | 0.05 | 0.10 | 0.05 |\n| 2 | 0.10 | 0.20 | 0.10 |\n| 3 | 0.05 | 0.10\
  \ | 0.05 |\n\n单元格中的数字代表了学生在学习特定小时数后获得特定成绩的联合概率。例如，一个学生学习两个小时后获得 `B` 等成绩的联合概率为 `0.20`。\n\
  \n在这种情况下，我们还可以计算学习时间和单项成绩的边缘分布。无论成绩如何，学生都可以通过查看学习时间的边缘分布来确定他们学习特定小时数的概率。同样地，无论学习时间长短，成绩的边缘分布给出了学生获得特定成绩的概率。\n\
  \n许多统计学科，如回归分析、假设检验和机器学习，可能从联合分布的概念中获益。例如，联合分布用于机器学习训练贝叶斯网络和马尔可夫模型等概率模型，这些模型可以根据变量之间的关系预测未来发生。联合分布提供了一种理解两个或多个随机变量之间联系的方法，有助于预测行为。\n\
  \n## 2.11 组合数学\n\n组合数学是概率论和统计学中各种情况可能结果的计数或计算研究。许多学科使用组合数学，包括游戏论、概率论、计算机科学和机器学习。\n\
  \n组合数学用于机器学习在大数据集中发现传统方法难以发现的模式。它涉及寻找不同的数据点组合，以揭示数据集中的趋势或相关性。\n\n\n\n\n排列（Permutation）的概念是概率论中组合学的一个例子。排列是对象/项目按特定顺序的配置。例如，考虑“cat”这个词。“cat”一词中的字母有\
  \ `3!`（3 的阶乘）即六种不同的排列方式。可以出现六种组合：cat, cat, atc, act, tca, 和 tac。排列在概率论中用于确定一组对象所有可能的排列方式。\n\
  \n组合（Combination）是从更广泛的集合中选择项目而不考虑其顺序。例如，假设你希望从五个五个大球（红、蓝、绿、黄、紫）中随机选择三个。可能有五种不同的组合；选择\
  \ `3` 个等于 `10`。这 `10` 种可能的组合是 (红、蓝、绿)、(红、蓝、黄)、(红、蓝、紫)、(红、绿、黄)、(红、绿、紫)、(红、黄、紫)、(蓝、绿、黄)、(蓝、绿、紫)、(蓝、黄、紫)\
  \ 和 (绿、黄、紫)。在概率论中，组合用于计算从更大的集中选择子集的方法数。\n\n组合学在机器学习（ML）中用于确定各种算法可能的结果数量。它可以用于确定决策树中潜在划分的数量以及每个划分的结果数量。\n\
  \n它还可以辅助特征工程，即研究人员通过以新颖的方式融合旧变量来创建新变量的过程。例如，研究人员可以通过将年龄和职业数据融合为单个变量，从而创建一个新的性别变量。通过采用组合技术，他们可以更精确地发现数据中的模式，从而使机器学习模型获得更好的预测结果。\n\
  \n## 2.12 概率规则与公理\n\n概率有助于我们理解事件发生的可能性。它拥有公理和规则，使能够预测事件发生的概率。有助于理解概率的主要公理和规则如下：\n\
  \n*   **等等定律 (Law of Equality)**：任何给定事件发生的概率必须在 0 到 1 之间；换句话之，`0 ≤ P(A) ≤ 1`，其中\
  \ `0 ≤ P(A)` 是事件 A 发生的概率。\n*   **加法法则 (Law of Addition)**：该规则有助于预测两个独立事件发生时的结果；如果\
  \ `A` 和 `B` 是两个独立事件，那么 `P(A or B) = P(A) + P(B)`。因此，我们可以通过将它们各自的概率相加来计算两个独立事件同时发生的概率。\n\
  *   **乘法法则 (Multiplication Rule)**：该规则适用于两个相互依赖的事件；例如，如果事件 `A` 和 `B` 相互依赖，那么 `P(A\
  \ and B) = P(A) * P(B|A)`。在此例中，如果 A 发生，B 也发生的概率由条件概率 `B|A` 表示。\n*   **条件概率规则 (Rule\
