  \ 编写 Python 程序\n\n我们将使用 Spyder 终端编写所有机器学习程序。Spyder 终端（图 13.3）是一个工具，允许用户在交互式环境中编写和运行\
  \ Python 程序。它包含两个主要窗格：编辑器窗格和控制台窗格。编辑器窗格位于终端左侧，用户可以在此使用语法高亮、代码补全和调试等各种功能编写 Python\
  \ 代码。控制台窗格位于终端右侧，分为两个子窗格：绘图窗格和 I/O 窗格。绘图窗格位于终端右上角，用户可以在此查看 Python 程序的图形输出，如图表、图形和图像。I/O\
  \ 窗格位于终端右下角，用户可以在此查看 Python 程序的终端输出，如打印语句、错误和警告。I/O 窗格也可以用于输入 Python 程序的终端输入，如命令行参数或用户输入。\n\
  \n## 13.5 对鸢尾花数据集进行数据操作\n\n鸢尾花数据集是一个经典数据集，包含三种鸢尾花物种的信息：setosa、versicolor 和 virginia。每个物种都有\
  \ 50 个观测值，包含四个特征：花萼长度、花萼宽度、花瓣长度和花瓣宽度，均以厘米为单位计量。统计学家 Ronald Fisher 于 1936 年将该数据集引入，作为线性判别分析的示例。\n\
  \n该数据集可从各种来源获得，例如 UCI 机器学习库、Kaggle、scikit-learn 等。它可能具有不同的格式，例如 CSV、JSON、pickle\
  \ 或 Python 对象，具体取决于来源。\n\n要免费下载数据集，我们可以使用以下方法之一：\n\n• 来自 UCI 机器学习库：前往 [`archive.ics.uci.edu/ml/datasets/Iris`](https://archive.ics.uci.edu/ml/datasets/Iris)\
  \ 并点击“Data Folder”。然后下载文件“iris.data”，其中包含数据集的逗号分隔值。可选地下载文件“iris.names”，其中包含数据集的描述。\n\
  \n• 来自 Kaggle：前往 [`www.kaggle.com/uciml/iris`](https://www.kaggle.com/uciml/iris)\
