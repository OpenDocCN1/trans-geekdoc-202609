  \n给定一个函数的图像，可以很容易地判断该函数是否为凸。对于图像上每对点 `(s1, f(s1))` 和 `(s2, f(s2))`，如果线段始终位于图像上方，则函数是凸的。如果连接线段始终严格位于图像上方，则是严格凸的。\n\
  \n读者可以通过考虑任意一对点来检查 Fig. 4.2 至 4.4 中定义的函数图像的凸性或强凸性。\n\n## 4.2.1 Properties of Convex\
  \ Functions\n\n• 设 `f[1], f[2], ..., f[p]` 为 `p` 个定义在 `ℝ^(n)→ℝ` 上的凸函数，定义为 `$g\\\
  left( x \\right) = \\sum\\limits_{i = 1}^{p}\\alpha_{i}f_{i}\\left( x \\right)$`\
  \ 也是凸的。\n\n• 如果 `f1` 是凸的且 `α ≥ 0`，也是凸的。\n\n• 每个线性或仿射函数都是凸的。\n\n• 如果 `f(x)` 和 `g(x)`\
  \ 是凸函数，则 `f ○ g` 也是凸的。\n\nFigure 4.5 显示了凸函数的几何可视化。\n\n![](img/f4-5.jpg)\n\nFigure\
  \ 4.5 凸函数的几何可视化\n\n## 4.2.2 Other Definitions\n\n### Concave Function\n函数 `f:ℝ^(n)→ℝ`\n\
  \n(4.5)\n\n`f(α x + (1−α) y) ≥ α f(x) + (1−α) f(y)`\n\n凹函数是一种在绘制时呈现凸形（向上开口）的数学函数。该函数在\
  \ ML 中有多种用途。在监督学习中，模型旨在根据输入特征预测目标变量，凹函数可以通过更容易检测局部最小值或最大值来帮助优化。当成本函数（衡量模型预测准确性的指标）绘制成图形时，其形状取决于模型的工作效果而是凸的或凹的。浅的凸曲线表明更多的训练会有所帮助，而深的曲线通常表明过拟合（模型对训练数据拟合得过于紧密）。\n\
  \n凹成本曲线通常比其凸对应物表明更好的性能，通过更容易识别具有较低值的区域来允许更高效的优化。此外，一些无监督学习模型（不使用目标变量）也依赖于使用凹函数最小化成本。\n\
  \n### Strictly Concave Function\n函数 `f:ℝ^(n)→ℝ`\n\n(4.6)\n\n`f(α x + (1−α) y) >\
  \ α f(x) + (1−α) f(y)`\n\n注意：`f` 是凹的当且仅当 `f` 是凸的。类似地，`f` 是严格凹的当且仅当 `-f` 是严格凸的。\n\
  \n仿射函数 `f(x) = a^(T) x + b, (a ∈ ℝ^(n), b ∈ ℝ)` 是既凸又凹的函数。\n\n在使用严格凹函数进行 ML 时，人们通常会查看目标函数值（成本）的变化，并通过在每一步考虑输入或参数的微小变化来逐步减少它们。严格凹函数使我们能够快速高效地分析任何变化对整体成本产生的影响，而无需对正在测试的每一种可能的输入或参数组合进行计算。严格凹函数快速分析复杂数据集的能力也使其能够作为更复杂的预测模型（如神经网络）的一部分使用，其中多个神经元层可以同时训练，每个层都从前一层接收反馈，了解其输出如何影响下游性能；这有助于使训练比传统方法更快、更准确，传统方法往往不需要这种对一个层在训练期间如何影响另一个层的洞察。\n\
  \n### Convex Combination\n点集 `x[1], ⋯ x[k]` 的凸组合定义为 `$\\sum\\limits_{i = 1}^{k}\\\
  alpha_{i}x_{i}$` 使得 `$\\alpha_{i} \\geq 0\\forall i = 1\\cdots k\\,\\text{and}\\\
  ,\\sum\\limits_{i = 1}^{k}\\alpha_{i} = 0$`。\n\n凸组合方法将不同的模型组合成一个，对所有单个模型取加权平均。分配给每个模型的权重基于每个模型的准确性以及它们协同工作的效果。\n\
  \n例如，假设你有三个不同的回归模型来预测股价，而不是只选择其中一个。在这种情况下，你可以用凸组合将它们组合起来，从组合结果中获得更准确的预测。相同的概念适用于\
  \ ML 的其他领域，例如分类或聚类算法。\n\n该技术通过结合来自多个来源的信息而不是仅依赖一个来源来做出算法或系统所做的所有预测或决策，从而有助于创建更稳健、更准确的系统。此外，该方法在进行更改以优化结果时允许更大的灵活性，因为权重可以轻松调整，而无需从头重建整个模型。\n\
  \n### Convex Hull\n集合 `S` 的凸包是 `S` 中点的所有凸组合的集合。\n\n(4.7)\n\n`$\\left. conv\\left(\
  \ s \\right) = \\{\\alpha_{1}x_{1} + \\cdots + \\alpha_{n}x_{n}\\text{|}x_{i} \\\
  in \\text{S},\\alpha_{i} \\geq 0,i = 1\\cdots n,\\sum\\limits_{i = 1}^{n}\\alpha_{i}\
  \ = 1 \\right\\}$`\n\n集合 `S` 的凸包是包含 `S` 的最小凸集。\n\n凸包是数学和计算机科学中使用的概念。它描述了物体的形状，以可以绘制以包围它的边界线来表示。其思想是找到一组点，称为顶点，形成凸包，使得这些点包围区域内的任何点也属于凸包。\n\
  \n凸包在 ML 中有许多应用，因为它们可以检测数据集中的模式和聚类。例如，如果你想识别数据点更集中聚类的特定区域，你可以使用凸包技术在这些区域周围绘制边界，突出显示这些聚类的位置。这种类型的分析在欺诈检测中很有帮助，因为它有助于识别可能表明欺诈活动的聚类或异常行为。该技术还可以提高对新数据集进行分类的准确性，因为它允许我们快速轻松地将相似点分组到类别中，而无需逐个检查每个点。\n\
  \n### Gradient\n函数 `f:ℝ^(n)→ℝ` 的梯度定义为\n\n(4.8)\n\n`$\\nabla f\\left( x \\right):\
  \ = \\left\\lbrack {\\frac{\\partial f\\left( x \\right)}{\\partial x_{1}},\\frac{\\\
  partial f\\left( x \\right)}{\\partial x_{2}},\\cdots,\\frac{\\partial f\\left(\
  \ x \\right)}{\\partial x_{n}}} \\right\\rbrack^{T}$`\n\n换句话说，对于函数 `f:ℝ^(n)→ℝ`。\n\
  \n梯度向量是一种数学工具，有助于计算某些变量变化的方向和幅度。在 ML 中，梯度向量用于梯度下降等优化算法。梯度下降是一种迭代方法，通过计算相对于这些参数的导数来找到给定函数中特定参数的最优值。它使我们能够找到优化成本函数并最小化\
  \ ML 模型中误差的参数值。\n\n\n\n\n\n在实践中，这意味着在训练复杂的模型 such `ANNs` 时，`backpropagation` 可用于计算每个层相对于每个参数（`weights`\
  \ 和 `bias`）的导数，并将其与 `gradient vectors` 结合使用以在训练过程中减少误差。这促进了高效的搜索过程，因为我们不必在找到一组最优的\
  \ `weights` 和 `bias` 值用于我们的 `ANNs` 之前手动测试成千上万甚至数百万种组合。\n\n### Properties of a gradient\
  \ vector\n\n• 与函数等值线正交\n• 指向函数增长最快的方向\n• 负梯度指向函数下降最快的方向\n• 向量 `v` `v` 的点积\n\n###\
  \ Example 10: `f(x,y) = 4x² + 2y² − 5 xy`. Find the gradient at (2,3).\n\n`∇ f(x,y)\
  \ = [ 8x - 5y ; -5x + 4y ]`\n\nEvaluating the gradient at (2, 3),\n\n`∇ f(x,y) =\
  \ [ 1 ; 2 ]`\n\n### Stationary Point\n\n点 `x̄ ∈ ℝⁿ` 被称为驻点。\n\n### Example 11: `f(x,y)\
  \ = x² + y²`\n\n`∇f(x,y)=[2x,2y]ᵀ =0 ⇒ (x,y)=(0,0)`\n\n即，原点是驻点。\n\n优化涉及找到最优的 `weights`\
  \ 和 `hyperparameters`，以便在未见数据上提供最准确的性能。实现此目的的一种方法是使用 `gradient descent`，其中我们朝着最优点迈出小步，最优点称为驻点或局部最小值。在\
  \ `gradient descent` 中，我们从初始猜测开始，并迭代地朝向更低的误差率移动，直到就该特定参数集而言无法再改进为止，这被称为在驻点处收敛。\n\
  \n驻点要么因为它们是局部最小值（其邻域中的最低点）而具有零梯度，要么因为它们位于平坦表面（平原区域）上而在所有方向上具有相等梯度。优化 ML 模型的主要目的是找到在未见数据上评估时产生最小误差的参数；因此，识别这些驻点有助于我们优化模型并产生比以前更准确的结果。\n\
  \n### Hessian Matrix\n\n对于函数 `f:ℝⁿ→ℝ`。\n\n`ℋ(x) = ∇[∇f(x)]ᵀ = ∇²f(x)`\n\n(4.9)\n\
  \n```\nℋ(x) = [ ∂²f(x)/∂x₁²  ...  ∂²f(x)/∂x₁xₙ\n         ⋮          ⋱    ⋮\n   \
  \      ∂²f(x)/∂xₙx₁ ... ∂²f(x)/∂xₙ² ]\n```\n\n### Example 12: `f(x,y) = 4x² + 2y²\
  \ − 5 xy`. Find the Hessian matrix.\n\n```\n∇[ ∇f(x,y) ] = ∇[ [8x - 5y ; -5x + 4y]\
  \ ] = [ 8  -5 ; -5  4 ]\n```\n\nHessian 矩阵是给定函数的二阶偏导数矩阵（导数的导数）。在 ML 中，它对于通过确定底层函数是凸还是凹来确定某一点是否存在局部最大值或最小值至关重要。此外，它可以帮助识别哪些参数对于预测输出至关重要以及如何改进它们。\n\
  \n例如，我们希望确定使我们获得某些 ML 问题最大全局结果的参数。我们可以使用 Hessian 矩阵对每个参数关于目标函数求偏导数，然后计算其特征值。如果所有特征值都是正的，则意味着其对应的参数在预测输出中发挥着至关重要的作用，因为它有助于实现更好的结果；如果任何特征值为负，则其对应的参数对预测输出没有太大影响，应相应调整以获得更好的结果。\n\
  \n### 4.3 Optimization Problems\n\n优化通常被定义为根据特定标准从一组备选方案或可用选择中选择最佳选择。一般而言，优化问题被定义为在某些约束条件下，对变量的良定义函数的最小化或最大化。优化问题在\
  \ ML 中被广泛用于帮助找到提供最佳可能结果的参数集。这是通过定义一个目标函数来实现的，该函数衡量给定模型的性能，然后优化该函数使其最大化或最小化。\n\n\
  例如，在处理分类或回归等监督学习任务时，通常使用优化问题来确定模型的最佳参数，从而在未见数据上实现最大准确率。这可以通过最小化某些误差度量（例如均方误差或对数损失）并找到使该度量最小化的参数来实现。\n\
  \n同样，无监督学习算法也使用诸如聚类算法之类的优化技术来识别没有关联标签的数据模式。优化问题对于在训练神经网络模型时进行超参数调优也很有帮助。它使我们能够在不同的超参数组合（例如层数和每层神经元数）中进行搜索，同时最大化我们的验证指标（例如准确率），从而使我们能够从模型中获得更好的性能。\n\
  \n优化可以大致分为三类：(a) 线性和非线性，(b) 约束和无约束，(c) 离散、连续和概率。\n\n线性优化涉及为诸如最小化成本函数或最大化利润等问题找到最优解，以找到可能的最有效解。它通常用于创建监督\
  \ ML 模型，因为它有助于为线性问题找到最佳拟合解。它也可以用于无监督模型，其中它可以通过优化聚类算法或主成分分析中涉及的参数来识别数据中的聚类或趋势。\n\n\
  非线性优化寻找最优解而不需要精确的数学公式。它有助于更一般的任务，例如训练神经网络和其他深度学习架构，在这些任务中，传统的线性方法由于其处理非线性映射函数的局限性而无法提供准确的结果。非线性优化算法的工作方式是查看不同的输入如何影响输出，然后选择那些在给定特定标准的情况下产生最佳结果的输入，从而能够从复杂数据集中进行更准确的预测。\n\
  \n约束和无约束优化技术使我们能够通过设置在优化算法性能时需要满足的某些边界或约束来创建更准确的模型。无约束优化是指在不对参数施加任何限制或约束的情况下找到最优解。它用于许多类型的\
  \ ML 应用，其中所有参数都是未知的，例如监督学习算法如决策树和 SVM，以及深度学习技术如反向传播。这种技术涉及尝试每个参数的不同值，直到实现最优解。\n\n\
  \n\n\n\n另一方面，约束优化是指在对每个参数可用值施加限制或约束的同时寻找最优值。这种技术常用于回归和分类问题，其中一些一般信息（如特征范围）可以应用于缩小可能的解。\
  \ 此外，还可以在目标函数上施加约束，例如线性或非线性约束，以找到比无约束优化技术更好的解，同时迭代/步骤更少；这显著降低了计算成本，同时仍能实现高精度。\n\n\
  离散、连续和概率优化帮助我们基于随机概率分布而不是预定值做出决策，例如梯度下降方法中的步长。 通过离散优化，我们可以基于代表数据集中类别的离散值而不是两点之间的连续值做出决策；这使我们能够更好地理解每个变量如何影响整体优化结果，从而为决策树等机器学习算法或\
  \ K-means 等聚类方法提供更好的准确性。\n\n连续优化关注连续变量，其中在优化参数时考虑导数；这有助于识别全局最小值，从而通过从微积分相关运算中取导数进行仔细调优，进一步提升模型性能，例如在卷积神经网络\
  \ `CNNs` 等深度学习应用中广泛使用的梯度下降方法。\n\n最后，概率优化试图通过使用概率分布近似函数而不是设定值来做出最佳猜测；这有助于我们在没有确切答案的情况下组合多个片段，仍能获得足够接近的结果，因为它能够模拟不同的分布，从而更准确地处理数据集中发现的不确定性。这使其非常适合处理来自自然语言处理\
  \ `NLP` 任务的非结构化数据集，例如情感分析应用。\n\n## 4.3.1 符号和基本术语\n\n`(4.10)`\n\n```\nMinimize f(x)\
  \ subject to fi ≤ 0, i = 1⋯m, hj = 0, j = 1⋯p\n```\n\n方程 `(4.10)` 表示优化问题的基本符号。问题的目标是确定\
  \ `x`。\n\n* `x ∈ ℝ^(n)` 称为优化变量。\n* 函数 `f:ℝ^(n)→ℝ` 被称为目标函数或成本函数。\n* 不等式 `fi ≤ 0`\
  \ 称为不等式约束函数。\n\n不等式约束可以应用于问题以求解。它们决定了解的变量值，从而为解提供边界。在机器学习中，不等式约束可用于解决优化和特征选择等问题。正确应用时可带来更准确的预测和更好的结果。\n\
  \n不等式约束也有助于提高分类和回归树 `CART` 等监督学习算法的性能。在 `CART` 模型中，不等式约束与成本敏感分裂规则一起使用，鼓励做出经济上有利的决策而非统计上最优的决策。总体而言，在模型训练期间使用适当的不等式约束可确保机器学习算法更好的泛化能力，同时避免因模型过于复杂而导致的潜在性能问题。\n\
  \n* 等式 `hj = 0` 称为等式约束，对应的函数 `h[j]:ℝ^(n)→ℝ` 称为等式约束函数。\n\n等式约束是指要求两个值相等的任何限制。在机器学习中，等式约束在优化复杂模型时很有帮助。通过添加等式约束，算法可以使用数学方程和/或其他形式的逻辑更好地将数据转换为可用于预测分析或模型优化的信息。这使算法能够更高效、更准确地工作，同时考虑给定参数集内的所有可能解。\n\
  \n* 目标函数和所有约束都定义良好的点集称为优化问题的定义域。方程 `(4.10)` 中定义的优化问题的定义域为\n\n`(4.11)`\n\n```\n$D\
  \ = \\left( {\\underset{i = 1}{\\overset{m}{\\cap}}f_{i}} \\right)\\, \\cap \\left(\
  \ {\\underset{j = 1}{\\overset{p}{\\cap}}\\, h_{j}} \\right)~$\n```\n\n优化问题的定义域也有助于机器比人类更高效地识别大量数据中的模式。例如，在处理文本文档或图像等非结构化数据时，优化问题可以确定哪些特征对预测特定结果或根据内容正确分类项目最重要。这种方法通常用于深度学习应用中，研究人员依赖\
  \ `DNNs` 快速准确地从海量数据中提取有意义的信息，而无需太多人工工作。\n\n优化算法对于帮助机器更快学习并基于给定输入做出准确预测至关重要，同时减少与传统分析方法相关的手动劳动成本，传统方法在每一步都需要大量人工参与。\n\
  \n* 点 `x ∈ D` 如果满足方程 `(4.10)` 中定义的所有约束，则称为可行点。\n* 如果方程 `(4.10)` 定义的问题存在至少一个可行点，则称该问题为可行问题。否则称为不可行问题。\n\
  * 所有可行点的集合称为可行集。\n\n可行集和问题是机器学习的重要组成部分。它们帮助我们理解数据以及数据之间的关系。可行集收集可用于解决给定问题的变量。这些变量可以包括分类、聚类、分类和回归，有助于机器学习算法优化结果。另一方面，可行问题是用于获得特定问题集最优解的数学方程或模型。例如，在处理线性回归问题时，我们使用最小二乘法来找到最佳拟合线，以根据过去的数据点预测未来值。\n\
  \n同样，在处理分类问题时，我们使用逻辑回归方法。在这两种情况下，模型都使用成本或损失函数进行优化，这有助于我们为问题获得最优解。\n\n* 方程 `(4.10)`\
  \ 定义的问题的最优值定义为\n\n`(4.12)`\n\n```\nopt* = inf{ f(x) | fi ≤ 0, i = 1⋯m, hi = 0, i\
  \ = 1⋯p },\n```\n\n其中 `inf` 表示下确界值或最小值\n\n* 对于不可行问题，`opt* = ∞`\n* 如果存在可行点 `x[k]`\
  \ 使得 `f(x[k]) → -∞ as k → ∞`，则称此类问题为无界。\n* 点 `x*` 如果是可行点并且求解方程 `(4.10)` 定义的问题使得\
  \ `f(x*) = opt*`，则称其为最优点。\n* 如果点 `x` 可行且 `f(x) ≤ opt* + ϵ`，则 `x` 称为 `ϵ`-最优。\n* 如果存在最优点，则问题是可解的。\n\
  * 优化问题也可以是最大化问题，通过考虑最小化问题中目标函数的否定。\n\n## 4.3.2 标准形式下的优化问题表示\n\n优化的标准形式是一种数学方法，用于通过最小化或最大化函数值来优化目标函数。这涉及在某些约束条件下找到方程的最大值或最小值或不等式。标准形式要求所有变量非负并且位于所有不等式的左侧，而任何限制解的值必须位于右侧。\n\
  \n\n\n\n\n例如，一个不等式如 `x + 2 ≤ 4` 在其标准形式中可以写成 `x ≤ 2`。在这种情况下，`2` 是一个约束，因为它必须从 `x`\
  \ 中减去以符合所需格式。所有等式约束也必须等于零才能符合此形式。例如，如果我们有 `p = q + 3`，那么在其标准形式中，这将变为 `p – q = 3`，并且\
  \ `q` 将不再出现在任一侧，因为它已被 `0`（右手边）所取代。这种方法使我们能够快速识别哪些变量需要调整以实现我们期望的结果，并简化问题求解。\n\n###\
  \ Example 13: Consider the optimization problem\n\nMinimize `f(x)`\n\nsubject to\
  \ `low[i] ≤ x[i] ≤ high[i]`, `i = 1⋯n`, `x[i] ∈ ℝ^(n)`\n\nThis problem can be converted\
  \ to the standard form as\n\nMinimize `f(x)`\n\nsubject to `low[i] − x[i] ≤ 0`,\
  \ `i = 1⋯n`\n\n`x[i] − high[i] ≤ 0`, `i = 1⋯n`\n\n### 4.3.3 Local Optima and Global\
  \ Optima\n\nA feasible point is said to be locally optimal if there are no other\
  \ feasible points in its neighborhood with a lower objective value. A feasible point\
  \ is said to be globally optimal if there are no other feasible points in its neighborhood\
  \ with a lower objective value.\n\nFormally they are defined as follows: A point\
  \ `x` is called locally optimal if it is feasible and there exists some `R > 0`\
  \ such that all feasible points `z` with `x – z[2] ≤ R` satisfy `f(x) ≤ f(z)`.\n\
  \nNote: `x – z[2]` represents the Euclidean norm.\n\nA point `x` is called globally\
  \ optimal if it is feasible and for all feasible points `z`, `f(x) ≤ f(z)`.\n\n\
  Local optima and global optima are concepts used in ML to determine the optimal\
  \ solution to a problem. Local optima is the best solution within a particular region,\
  \ while global optima is the best solution that could be achieved anywhere. Local\
  \ optima can be seen as narrow valleys or hills in a landscape of possible solutions.\
  \ Getting stuck in one of these local optima means that any changes made to improve\
  \ one aspect of the solution will worsen other aspects, resulting in a worse outcome\
  \ than staying at that optimum local state. The relative flatness and closeness\
  \ of neighboring solutions mean that finding an even better solution than this local\
  \ maximum requires big jumps across various parameters instead.\n\nOn the other\
  \ hand, global optima are like being on top of a mountain peak from which every\
  \ direction looks downwards – it is much easier to identify improvement areas and\
  \ take steps towards them without risking getting stuck in another suboptimal state\
  \ again. Furthermore, any changes will likely result in an improved overall outcome\
  \ since all neighboring solutions look less attractive than this summit point.\n\
  \nML algorithms use different techniques, such as `gradient descent` or `simulated\
  \ annealing`, to search for local and global optima when solving problems involving\
  \ multiple input variables (which can often yield thousands or even millions of\
  \ possible combinations if left unchecked). This helps ensure they find both satisfactory\
  \ and ‘best’ results by exploring all possible configurations before giving up on\
  \ their search process – maximizing accuracy and effectiveness for tasks such as\
  \ an image or speech recognition where solutions must be near perfect for successful\
  \ completion.\n\nFor a convex optimization problem, all locally optimal points are\
  \ globally optimal.\n\n### 4.4 Convex Optimization\n\nAn optimization problem is\
  \ convex if its objective function is a convex function, inequality constraints\
  \ are convex and equality constraints are affine.\n\n(4.13)\n\nMinimize `f(x)` subject\
  \ to `fi ≤ 0`, `hj = 0`, `i = 1⋯m`, `j = 1⋯p`,\n\nwhere `fi ≤ 0` are convex sets\
  \ and `hj = 0` are affine functions.\n\nThe three main requirements for a convex\
  \ optimization problem are:\n\n• Objective function should be convex\n• Inequality\
  \ constraints should be convex\n• Equality constraints are affine functions only\n\
  \nThe feasible set of a convex optimization problem is convex since its domain is\
  \ defined as\n\n(4.14)\n\n```\n$D = \\text{domain}\\left( f \\right)\\, \\cap^{}\\\
  left( {\\underset{i = 1}{\\overset{m}{\\cap}}f_{i}} \\right) \\cap^{}\\left( {\\\
  underset{j = 1}{\\overset{p}{\\cap}}h_{j}} \\right)$\n```\n\nThe inequality constraints\
  \ defined in Equation (4.13) should always be less than or equal to zero because\
  \ the zero-sublevel set of `f[i]` is a convex set and hence the feasible region.\
  \ If the constraints are greater than or equal to zero, it is no longer a convex\
  \ set. The optimal value determined would no longer be a global optimum.\n\nConvex\
  \ optimization is preferred over general optimization due to the fundamental property\
  \ that any locally optimal point is globally optimal.\n\nFormally, if `x` is feasible\
  \ and `x ∈ D` and satisfies all constraints and minimizes `f` in a local neighborhood,\
  \ then\n\n(4.15)\n\n`f(x) ≤ f(y) ∀ feasibly, x − y[2] ≤ ρ`\n\nLinear programming\
  \ (`LP`), quadratic programming (`QP`) and semi-definite programming (`SDP`) are\
  \ special cases of convex optimization problems.\n\n### Example 14\n\nMinimize `f(x)\
  \ = x1² + x2²`\n\n```\nsubject to f1(x) = x1 / (1 + x2²) ≤ 0; h1(x) = (x1 + x2)²\
  \ = 0\n```\n\n### 4.5 Unconstrained Optimization\n\nMinimization/Maximization problems\
  \ defined over `f:ℝ^(n)→ℝ` without any constraints on the input are called unconstrained\
  \ problems. Optimizing such unconstrained problems is called unconstrained optimization.\n\
  \nDepending on specific criteria and variables, unconstrained optimization is used\
  \ to find the optimal solution to a problem or task. By using unconstrained optimization,\
  \ it becomes easier to train models in ML and make them more accurate. In ML, the\
  \ goal is to minimize a cost function or error rate. This is where unconstrained\
  \ optimization comes into play; it helps us find the best possible parameters for\
  \ our model so that our cost function can be minimized as much as possible (or at\
  \ least be as close to minimal as possible).\n\nUnconstrained optimization algorithms\
  \ such as `gradient descent` are used since they efficiently find local and global\
  \ minima of functions with many variables. Using unconstrained optimization techniques,\
  \ we can find an optimal set of parameters to give us a minimum error rate throughout\
  \ our training process. This enables us to create better models which are more accurate\
  \ and precise when presented with unknown data points.\n\n### Example 15\n\nFind\
  \ `x` that minimizes `f(x)`, where `x ∈ ℝ`, that is, `x` is a scalar.\n\nAny local\
  \ extremum will have the property `f′(x) = 0`. Such points are called stationary\
  \ points or critical points. The stationary point may be (local) minimum, maximum\
  \ or saddle point. The absolute lowest/highest level of `f(x)` is called the global\
  \ minimum/maximum.\n\n*If `f″(x) > 0` → the point is a local minimum*\n*If `f″(x)\
  \ < 0` → the point is a local maximum*\n*If `f″(x) = 0` → the point is a saddle\
  \ point*\n\nThe plot of the function looks like the one shown in Fig. 4.6.\n\n![](img/f4-6.jpg)\n\
  \nFigure 4.6 A one-dimensional function plot\n\n### Example 16\n\nFind `x` that\
  \ minimizes `f(x)`, where `x ∈ ℝ^(n)`, that is, `x` is a vector.\n\nFor a vector,\
  \ gradient should be calculated. Any local extremum will have the property `∇f(x)\
  \ = 0`. Such points are called stationary points or critical points. The stationary\
  \ point may be (local) minimum, maximum or saddle point. The absolute lowest/highest\
  \ level of `f(x)` is called the global minimum/maximum.\n\n*If ℋ is positive definite\
  \ → the point is a local minimum*\n*If ℋ is negative definite → the point is a local\
  \ maximum*\n*If ℋ is indefinite(neither positive definite nor negative definite)\
  \ → the point is a saddle point*\n\n\n\n\n\n如果海森矩阵 `ℋ` 的所有特征值都为正，则该矩阵被称为正定。\n\n\
  如果海森矩阵 `ℋ` 的所有特征值都小于零，则该矩阵被称为负定。\n\n如果海森矩阵 `ℋ` 的某些特征值为正，而某些可能是负或零，则该矩阵被称为不定。\n\n\
  ### 4.5.1 求解输入为标量的无约束优化问题\n\n牛顿法是一种广泛使用的优化技术，用于在机器学习中寻找无约束优化问题的最小值。它是一种迭代方法，可用于求解非线性方程，并可应用于任何函数，无论其性质如何（线性、非线性、凸或非凸）。\n\
  \n在机器学习的无约束优化问题中，了解导数和梯度下降的概念很有帮助。当处理无约束问题时，我们通常旨在找到代价函数值最低的点。该点对应于该特定目标函数的全局最小值。梯度下降允许我们通过沿目标函数向下迈出小步，直到达到局部最小值；即偏导数等于\
  \ 0 的位置。在数据量较小的情况下，该方法通常效果良好；然而，随着数据集变得更大、更复杂，梯度下降在收敛到最佳解之前可能需要相当长的时间（因为在搜索空间中每一步都可能相当重要）。这就是牛顿法发挥作用的地方。\n\
  \n与梯度下降那样尝试许多小步不同，牛顿法在每次迭代中利用搜索空间中第一阶和二阶导数（或梯度）的信息，每次迭代朝着找到局部最小值迈出一步。这也有助于确保我们不会因目标函数中的平坦区域或鞍点而在搜索空间的任何点上陷入停滞——这会导致在尝试优化机器学习中的无约束问题时，传统方法如梯度上升/下降出现问题。相反，牛顿法可以通过使用一阶和二阶导数快速识别搜索空间内的潜在最优点。这使我们能够比其他技术，如梯度上升/下降，更快地找到更好的解！\n\
  \n假设函数 `f`:ℝ→ℝ。从初始估计 `x1` 开始，下一点可以近似得到。一般地，\n\n(4.16)\n\n```\n$x_{k + 1} = x_{k}\
  \ - \\frac{f\\left( x_{k} \\right)}{f'\\left( x_{k} \\right)}$\n```\n\n该过程重复直至收敛。\n\
  \n例 17：求 `x`² − 2 = 0 的近似解。\n\n| k | x | f (x) = x2 − 2 | f ′(x) = 2x |\n| --- |\
  \ --- | --- | --- |\n| 1 | 2 | 2 | 4 |\n| 2 | 1.5 | 0.25 | 3 |\n| 3 | 1.416667 |\
  \ 0.006944 | 2.833333 |\n| 4 | 0.000006 | 2.828431 | 2.828431 |\n| 5 | 1.414216\
  \ | 0 | 2.828427 |\n\n该过程收敛，近似解为 `$1.414216 \\approx \\left. \\sqrt{}2 \\right.$`\n\
  \n牛顿法对函数给出了良好的近似，但存在一些缺点：\n\ni. 如果 `f`^′(`x`[`k`]) = 0，则该方法失效。\n\nii. 在某些情况下，近似值可能重复。\n\
  \niii. 它对初始选择敏感。\n\niv. 在某些情况下，`x`[n] 可能未定义。\n\n### 4.5.2 梯度下降法（求解输入为向量的无约束优化问题）\n\
  \n梯度下降 GD 是一种一阶优化算法，用于确定给定多元函数的局部最小值/最大值。GD 是一种在机器学习中用于根据误差/损失函数更新模型参数的基础算法。该算法通过计算损失函数相对于每个参数的梯度，然后以降低损失函数值的方式更新每个参数。这种过程重复进行，直到我们达到一个点，进一步的更新不再改善模型的性能。\n\
  \nGD 通常用于监督学习任务，例如线性回归和逻辑回归或神经网络，其中你拥有可用于计算误差/损失的标记数据。通过优化这些参数，我们可以比仅使用试错方法更准确、更高效地进行预测。\n\
  \nGD 的要求是函数应可微且凸。如果函数可微，则其在定义域的每一点都有导数。对于一元函数来说，若连接任意两点的线段始终位于曲线之上或之上，则该函数为凸。检查一元函数是否凸的另一种方法是计算二阶导数并检查其是否大于零；即\
  \ `f`^″(`x`) > 0。\n\n例 18：`f`(`x`) = `x`² + `x` − 5\n\n`f`^′(`x`) = 2`x` + 1；`f`^″(`x`)\
  \ = 2\n\n由于二阶导数大于零，给定函数是严格凸的。\n\n例 19：`f`(`x`) = `x`⁴ − 2`x`³ + 2\n\n`f`^′(`x`)\
  \ = 4`x`³ − 6`x`² = `x`²(4`x`−6)\n\n`f`^″(`x`) = 12`x`² − 12`x` = 12`x`(`x`−1)\n\
  \n如果 `f`′(`x`) = 0,.这些点的斜率为零，因此它们是函数极值（最小值或最大值）的可能候选点。\n\n如果 `f`^′′(`x`) = 0,.\n\
  \n该函数在 x < 0 和 x > 1 时为凸。对于 0 和 1 之间的值，函数为凹，因为二阶导数小于零。\n\n在点 `x` = 0 处，函数具有最小值。由于函数在某些点上是凸的，因此该函数称为拟凸。\n\
  \n对于多元函数，梯度是每个主方向上的偏导数向量。\n\n例 20：`f`(`x`,`y`) = 2`x`² + `y`²\n\n```\n$\\frac{\\\
  partial f\\left( {x,y} \\right)}{\\partial x} = 4x\\frac{\\partial f\\left( {x,y}\
  \ \\right)}{\\partial y} = 2y$\n```\n\n```\n$\\nabla f\\left( {x,y} \\right) = \\\
  begin{bmatrix} {4x} \\\\ {2y} \\\\ \\end{bmatrix}$\n```\n\n点 (1, 2) 处的梯度为\n\n```\n\
  $\\nabla f\\left( {1,2} \\right) = \\begin{bmatrix} 4 \\\\ 4 \\\\ \\end{bmatrix}$\n\
  ```\n\n梯度向量表明斜率在 x- 和 y- 轴上是相同的。\n\n工作机制：我们从一个任意点开始，寻找要移动到的下一个点。决策将基于方向和步长。方向有助于我们朝使函数收敛的方向移动。步长决定函数收敛的速度。该过程重复进行，直到函数收敛到一个稳定点。\n\
  \n从任意点 `x`⁰ 开始\n\n(4.17)\n\n```\n⇒x^(k + 1)=x^(k)−λ∇f(x^(k))\n```\n\n由于目标是最小化给定的无约束函数，一个合理的方法是选择步长以使下一个点的值最小化。步长值过高可能不收敛或发散（将点射出区域）。步长值过低将缓慢地朝收敛进行。适中的值将朝收敛移动。\n\
  \n梯度下降算法\n\n步骤 1：设 k = 0。\n\n步骤 2：选择初始点 `x`⁰。\n\n步骤 3：计算该点的梯度。\n\n步骤 4：使用公式 (4.17)\
  \ 在梯度的负方向或相反方向选择下一个点。\n\n步骤 5：重复步骤 3 和 4，直到满足停止准则。\n\n停止准则可以是固定迭代次数或 `∇f(x^(k))`\
  \ ≥ `ε`。\n\n例 21：最小化 `f`(`x`) = `x`[1]² + `x`[2]²\n\n```\n$\\nabla f\\left( x \\\
  right) = \\begin{bmatrix} {2x_{1}} \\\\ {2x_{2}} \\\\ \\end{bmatrix}$\n```\n\n选择\
