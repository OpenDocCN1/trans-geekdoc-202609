  \ yes 还是 no 类。\n\n设测试实例为\n\n`t = {Sky = sunny,Temp = cool,Humidity = high,wind =\
  \ strong}`\n\n我们需要确定这个测试实例是否允许玩家打网球。\n\n`p (t) = max (p (t|yes), p (t|no))`\n\n\
