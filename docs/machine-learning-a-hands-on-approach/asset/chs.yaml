  \ Sky = Rain 具有较高的信息增益，因此 Wind 被选为子节点。现在决策树看起来像 Fig. 8.7。\n\n决策树无法进一步扩展，因为所有叶节点都已达到。从决策树我们可以观察到，并非所有属性都需要参与决策树的构建。在这种情况下，属性\
  \ Temp 并未成为决策树的一部分；因此，我们可以推断 Temp 在做出决策时没有显著影响。\n\n最后，决策规则可以从根节点到每个节点以析取-合取的方式生成。\n\
  \n玩家将打网球如果\n\n(Sky = Overcast)∨ (Sky = Sunny ∧Humidity = Normal)∨ (Sky = Rain ∧Humidity\
  \ = Normal)\n\n![](img/f8-7.jpg)\n\nFigure 8.7 最终的决策树\n\n决策树学习中的假设空间搜索：假设空间包括给定数据的所有可能的决策树。ID3\
  \ 算法从简单到复杂搜索假设空间，类似于爬山法中的方法。它从一个空的决策树开始。选择根节点。进一步创建节点。采用爬山法，使用信息增益和熵度量。\n\nID3 搜索所有有限离散值函数的完整空间。它只维护一个假设。一个重要的关注点是它没有回溯选项。这表明它可能陷入局部最优。它可能收敛到局部最小值。\n\
  \n它在每一步都使用所有训练样本。但在每一步中，每个属性都是基于已选属性进行评估。这意味着假设将在每一步中受到改进，并且由于这一特性，它对错误不敏感。\n\n\
  决策树学习中的归纳偏置：对于给定数据，可能存在与数据一致的决策树。ID3 偏好短树而不是大树。ID3 选择节点为具有高信息增益的属性的树。具有高信息增益的属性靠近根节点，并且此类属性优于其他属性。\n\
  \nID3 与候选消除算法之间的基本区别是，ID3 不完全地搜索完整的假设空间（搜索所有可能的决策树），而候选消除算法完全地搜索不完整的假设空间。\n\n##\
  \ 8.3.2 The C4.5 Algorithm\n\nC4.5 算法是对 ID3 算法的改进，解决了其若干局限性：\n\n•Handling continuous\
  \ attributes: Unlike ID3, which can only handle nominal attributes, C4.5 can handle\
  \ continuous attributes by creating threshold-based splits. For example, if you\
  \ have a data set with a continuous attribute like “age,” C4.5 can determine a threshold\
  \ (such as age > 30) to split the data.\n\n•Handling missing data: C4.5 can handle\
  \ missing data by using a probabilistic approach. It assigns the most probable value\
  \ based on the distribution of known values. For example, assume there is a customer\
  \ data set with missing values in the “income” attribute. C4.5 assigns the most\
  \ probable income value based on the distribution of known incomes in the data set.\n\
  \n•Overcoming overfitting: C4.5 uses pruning to reduce overfitting. It removes branches\
  \ that have little importance, making the model more generalizable. For example,\
  \ assume there is a weather data set used to predict whether to play tennis. C4.5\
  \ removes branches that do not significantly improve the prediction accuracy, such\
  \ as those based on rare weather conditions.\n\n•Gain ratio: C4.5 uses the gain\
  \ ratio instead of information gain to overcome the bias towards attributes with\
  \ many values. The gain ratio normalizes information gain by the intrinsic information\
  \ of a split. For example, assume there is a data set with attributes like color\
  \ and size. C4.5 uses the gain ratio to choose the best attribute for splitting,\
  \ avoiding bias towards attributes with many unique values like color.\n\n(8.5)\n\
  \n\n\n\n\n$\\text{Split}\\,\\text{Info}_{A}\\left( S \\right) = - \\sum\\limits_{i\
  \ = 1}^{v}\\frac{\\left| D_{i} \\right|}{\\left| D \\right|} \\times \\log_{2}\\\
  left( \\frac{\\left| D_{i} \\right|}{\\left| D \\right|} \\right)$\n\n`Split Info`\
  \ 表示将数据集 `S` 按属性 `A` 的 `v` 个取值划分为 `v` 个子集时可能产生的潜在信息。\n\nC4.5 使用的另一个度量是增益率，其定义为\n\
  \n(8.6)\n\n$\\text{Gain}\\,\\text{Ratio}\\left( A \\right) = \\frac{\\text{Gain}\\\
  left( A \\right)}{\\text{Split}\\,\\text{Info}_{A}\\left( S \\right)}$\n\n再次取用相同的\
