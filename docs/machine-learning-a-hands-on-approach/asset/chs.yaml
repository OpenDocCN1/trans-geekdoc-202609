  \n# 13.32.25 R 中的单层感知器学习算法\n\n单层感知器是一种人工神经网络类型，可以学习对线性可分模式进行分类。它由输入层、单个输出节点以及一组由学习规则更新的权重和偏置组成。\n\
  \n## 定义激活函数\n\n```r\nsigmoid <- function(x) {\n  1 / (1 + exp(-x))\n}\n```\n\n##\
  \ 定义激活函数的导数\n\n```r\nsigmoid_prime <- function(x) {\n  sigmoid(x) * (1 - sigmoid(x))\n\
  }\n```\n\n## 定义学习率\n\n```r\neta <- 0.1\n```\n\n## 定义 epoch 数\n\n```r\nepochs <-\
  \ 100\n```\n\n## 定义输入模式和期望输出\n\n```r\nX <- matrix(c(0,0,0,1,1,0,1,1), nrow = 4,\
  \ ncol = 2, byrow = TRUE)\nY <- c(0,1,1,0)\n```\n\n## 随机初始化权重和偏置\n\n```r\nW <- runif(2,\
  \ -1, 1)\nb <- runif(1, -1, 1)\n```\n\n## 训练感知器\n\n```r\nfor (i in 1:epochs) {\n\
  \  for (j in 1:nrow(X)) {\n    Z <- X[j,] %*% W + b\n    A <- sigmoid(Z)\n    E\
  \ <- Y[j] - A\n    W <- W + eta * E * sigmoid_prime(Z) * X[j,]\n    b <- b + eta\
  \ * E * sigmoid_prime(Z)\n  }\n  cat(\"Epoch:\", i, \"Error:\", sum((Y - sigmoid(X\
  \ %*% W + b))²), \"\\n\")\n}\n```\n\n## 在输入模式上测试感知器\n\n```r\ncat(\"Output:\", sigmoid(X\
  \ %*% W + b), \"\\n\")\n```\n\n# 13.32.26 R 中的 RBF 算法\n\n## 加载径向基函数库\n\n```r\nlibrary(rbf)\n\
  ```\n\n## 定义输入数据矩阵 X 和输出向量 y\n\n```r\nX <- matrix(c(1, 2, 3, 4, 5, 6), nrow = 3,\
  \ ncol = 2)\ny <- c(7, 8, 9)\n```\n\n## 打印输入数据\n\n```r\nprint(\"Input data:\")\n\
  print(X)\nprint(y)\n```\n\n## 创建具有高斯核和 sigma = 0.5 的径向基函数模型\n\n```r\nmodel <- rbf(X,\
  \ y, kernel = \"gaussian\", sigma = 0.5)\n```\n\n## 打印模型参数\n\n```r\nprint(\"Model\
  \ parameters:\")\nprint(model$beta)\nprint(model$centers)\nprint(model$sigma)\n\
  ```\n\n## 预测新输入向量 x_new 的输出\n\n```r\nx_new <- c(2.5, 3.5)\ny_pred <- predict(model,\
  \ x_new)\n```\n\n## 打印预测结果\n\n```r\nprint(\"Prediction:\")\nprint(x_new)\nprint(y_pred)\n\
  ```\n\n## 总结\n\n• 要在 Windows 环境中部署 Python，请从官方网站 (`https://www.Python.org/dlownloads/`)\
