  \ |\n\n正如你所见，数据点现在已沿特征轴按其类别标签分离，可以通过简单的阈值或线性分类器轻松分类。\n\n\n\n\n\n总体而言，`LDA` 为处理高维数据集提供了一种有效的方法，在传统方法因数据集中存在过多特征而难以区分不同类别时尤为适用。此外，通过准确识别来自嘈杂环境的高维数据集中的相关特征，可以获得比其他方法更准确的分类结果，例如逻辑回归或决策树算法，因为它们能够在保留数据集中点的重要信息的同时降低噪声。\n\
  \n## 7.3.3.4 因子分析\n\n因子分析 (`FA`) 是一种用于识别变量之间潜在关系的统计技术。它常用于研究中，以帮助揭示观察数据背后的潜在结构。该技术已广泛应用于各个领域，包括心理学、经济学和教育学。其核心在于通过分析数据集中每个变量与其他变量的关系来减少变量数量。这有助于研究人员解释多个方面如何相互影响，并可在预测结果或现象时帮助他们了解哪些因素最重要。\n\
  \n在进行 `FA` 时，研究人员会收集参与者关于其研究主题或假设相关的不同特征或项目的數據。然后他们利用这些数据生成相关性，表示每个变量在集合内与其他变量的相关程度有多强。作为此过程的一部分，他们还会根据参与者在研究中包含的所有项目上的回答，为每个参与者计算因子得分。\n\
  \n为了使因子分析结果可靠且准确，研究人员必须确保收集的数据有效且可靠，即数据准确反映了所测量的内容，并且不因测量问题或信息收集或处理过程中的错误而包含误差。此外，必须有足够大的样本量，因为较小的样本量可能导致过拟合，即由于数据点分布稀疏而在不相关信息之间发现不准确的模式。最后，研究人员在解释\
  \ `FA` 研究结果时必须格外谨慎，因为结果可能并不总是反映真实的潜在关系，而可能是基于噪声的虚假关联。\n\n因子分析有两种类型，探索性和验证性。\n\n\
  ### 探索性因子分析 (`EFA`)\n\n这可以将大量观察变量浓缩为一组较小的潜在因子，可用于解释观察变量之间的关系。`EFA` 的目标是识别一组相关变量之间的潜在模式和关系，并揭示解释它们之间变异的隐藏或“潜在”因子。\n\
  \n为实现此目的，`EFA` 比较成对测量项目之间的相关系数，以评估它们是否在多次观察中共享相似的模式，还是仅由偶然相关。`EFA` 不仅依赖于以测量变量作为预测因子，而是使用矩阵代数技术和线性模型来分析测量变量之间的相关性并提取其共同的潜在因子。这些因子代表研究数据集中不同但相关的概念或过程。通过揭示这些潜在结构，研究人员可以更好地理解单个变量如何相互作用以及它们如何影响整体结果，例如客户满意度调查或学业表现指标。此外，通过考虑由测量误差引起的噪声，`FA`\
  \ 使研究人员能够快速高效地从复杂数据集中获得有意义的信息，而不会牺牲模型中的准确性或严谨性。这使其成为寻求对数据集更深入见解的研究人员以及需要快速减少预测变量数量而不牺牲结果质量的人们不可或缺的工具。它还有助于他们识别形成可用于进一步研究的独立因子的密切相关项目簇。\n\
  \n进行 `EFA` 的第一步是确定与分析相关的变量。通常，这些变量可以是数值型或分类型，并且它们之间应以某种方式相关。接下来，你需要确定这些相关性中是否有统计学意义——这可以通过在数据集上运行统计检验来实现，例如\
  \ `Pearson` 相关或 `Spearman` 秩相关检验。\n\n一旦你确定了具有统计学意义的相关性，你需要决定要使用哪种 `FA` 模型——`EFA`\
  \ 或 `CFA`。`EFA` 通常在对数据集中因子可能的样子知之甚少时使用；`CFA` 通常在先前研究中已识别出数据集结构和内容中的已知因子时使用。\n\n\
  接下来，你需要为模型选择因子提取方法——这包括根据你希望从数据集中提取多少因子以及在过程中使用每种算法进行多少次迭代，选择 `PCA`、`MLE`、迭代主成分提取方法\
  \ (`IPCEM`) 等。一旦选定，使用适当的统计软件包，如 `SPSS` 或 `R` 软件包如 `MLR` 或 `FactoMineR`，根据最适合你需求的语言，在数据集上运行所选的因子提取方法。\n\
  \n最后，在使用因子提取方法运行所有必要分析后，必须使用计算出的指标进行评估，例如 Kaiser–Meyer–Olkin (`KMO`) 抽样充分性度量和 Bartlett\
  \ 球形检验、累积方差解释比例、碎石图等。评估研究后，解释研究结果。这意味着研究旋转方法、特征值、特征向量等，并通过其解释来理解它们。解释结果后，应根据探索性因子分析研究得出的发现得出结论。\n\
  \n`EFA` 是一种有价值的工具，可在不完全依赖回归模型等监督方法的情况下揭示数据集中变量之间的隐藏关系。\n\n### 验证性因子分析 (`CFA`)\n\n\
  `CFA` 在 `EFA` 的基础上，通过检验已识别的因子是否在多个数据集或样本中保持一致，从而进行检验。这使研究人员能够确保其研究结果可靠，而不仅仅是由于测试样本中的偶然或随机性。例如，假设你想研究年龄如何影响客户对产品的满意度。在这种情况下，你可以使用\
  \ `CFA` 来确保你的结果在包含不同年龄组的多次调查中保持一致。`CFA` 是一种用于帮助识别一组变量潜在结构的统计技术。它检验关于观察变量之间关系的理论模型和假设，例如态度、行为和态度。`CFA`\
  \ 常用于心理学研究中，以检验关于人格、认知过程、情绪和其他现象的理论。\n\n`CFA` 首先指定一个模型或假设，说明各种观察变量如何相关。该模型应基于关于这些变量及其关系的现有知识或理论。然后研究人员使用统计技术分析来自各种来源的数据（调查和访谈），以确定所提出的模型是否与数据拟合。如果拟合，则意味着观察变量之间假设的关系得到了经验证据的支持——这就是为什么它被称为“验证性”分析！\n\
  \n\n\n\n下一步涉及评估该拟议模型解释数据集中观察到的变异性的程度（其拟合优度）。通常，研究人员会使用多种不同的拟合指标，例如卡方统计量、均方根误差近似值（`RMSEA`）、比较拟合指数（`CFI`）、\
  \ Tucker–Lewis 指数（`TLI`）、赤池信息准则（`AIC`）等。这些拟合指标提供了假设模型与数据集拟合程度的总体衡量，可以给出初始假设是否需要修改的线索。\n\
  \n最后，在确定 `CFA` 是否支持假设后，研究人员必须有意义地解释其结果并将其应用于现实生活情境中，因为 `CFA` 对观察变量之间因果关系或对不同群体/情境的具体影响几乎没有启示。总之，`CFA`\
  \ 可以成为研究人员寻找其关于某些现象假设背后证据的强大工具，以指导对这些主题的进一步研究。\n\n### 7.3.4 关联规则挖掘\n\n一种称为关联规则挖掘的无监督学习方法可用于在数据集中查找各种元素之间的联系。它帮助零售商通过揭示客户经常一起购买的产品之间的联系来制定营销策略。\n\
  \n市场篮子分析是关联规则挖掘的常用应用，企业利用它来深入了解客户的购买模式。它可以提供产品频繁共同购买模式的见解。哪些商品表现出互补性或替代性？哪些产品适合交叉销售或向上销售？哪些策略可以增强商店布局或产品定位以最大化销售额？\n\
  \n考虑一个超市旨在检查其消费者在特定时间段内进行的交易的场景。从数据中得出的一个明确规则可能是：\n\n`{bread, butter} -> {jam}`\n\
  \n该规则意味着购买面包和黄油的客户很可能也会购买果酱。该规则由两个部分组成：位于箭头左侧的先行项，以及位于箭头右侧的后行项。先行项表示情况或原因，而后行项表示结果或后果。\n\
  \n为了评估规则的质量，有必要量化其支持度和置信度。支持度是指数据集中包含先行项和后行项的交易比例。例如，如果数据集中有 1000 笔交易，其中 200 笔包含面包、黄油和果酱，则该规则的支持度计算为\
  \ 200 除以 1000，得出 0.2 的值。支持度衡量规则在数据集中的频率。\n\n置信度是指包含先行项和后行项的交易比例。例如，如果 300 笔交易包含面包和黄油，其中\
  \ 200 笔交易也包含果酱，则该规则的置信度可计算为 200 除以 300，得出 0.67 的值。置信度是衡量规则根据先行项预测后行项的可靠性的指标。\n\n\
  商店可以通过遵循这些准则来制定营销策略以提高其收入。例如，它可以为购买面包和黄油的消费者提供果酱的折扣或代金券，或在商店中将果酱 strategically 放置在面包和黄油旁边以刺激冲动购买。此外，它可以检测一起购买频率低或销售不佳的产品，并制定策略以提高其可见度或吸引力。\n\
  \nWeb mining 是关联规则挖掘的另一个应用。它系统地从网页、超链接和服务器日志等网络数据中提取有价值的信息。例如，可以制定关联规则如下：‘如果用户访问页面\
  \ A，则他们很可能也会访问页面 B。’\n\nWeb mining 可分为 Web 内容挖掘、Web 结构挖掘和 Web 使用挖掘。Web 内容挖掘涉及检查和解释互联网上发现的多种形式的数据，例如文本、照片、音频、视频和其他多媒体信息。Web\
  \ 结构挖掘关注分析网站的链接和排列，包括其连接性和组织结构。Web 使用挖掘检查用户在互联网上的行为和参与度，包括其浏览历史、点击流数据和反馈。\n\nWeb\
  \ mining 在众多领域和目标中具有多样化的应用和优势。它可以通过理解用户查询和偏好来提高网络搜索引擎的质量和相关性。它可以通过提供与用户资料和行为相符的定制内容和服务来改善定制化和推荐系统。Web\
  \ mining 可以通过检测网络流量和交易中的不规则模式和异常来帮助识别欺诈活动和网络攻击。\n\n关联规则学习可分为三种算法：`Apriori`、`ECLAT`\
  \ 和 `FP Growth`。我们现在将详细介绍这三种算法。\n\n#### 7.3.4.1 Apriori 算法\n\n`Apriori` 算法是一种 `ML`\
  \ 算法，可以揭示大型数据集中项目之间的关联。它由 Rakesh Agrawal 和 Ramakrishnan Srikant 于 1994 年开发。该算法的核心在于寻找频繁项集或经常一起出现的项目。这种技术基于这样一个前提：如果一个项集在数据集中经常出现，那么该项集的任何子集也经常出现。`Apriori`\
  \ 算法最常用于市场篮子分析和推荐系统。\n\n该算法首先扫描数据以找到所有单项集（包含一个元素的项集）。当这些单个项集满足最小用户定义频率或支持阈值时，它们被认为是“频繁”的，这意味着它们必须出现在给定数据集的所有交易中的至少某个预定百分比中。此初始阶段创建了一个库存列表，我们可以从中构建更强大和复杂的项集组合，这些组合也将通过我们的频率测试。\n\
  \n一旦确定了频繁的单项集，下一步就是寻找对（包含两个元素的项集）和三元组（包含三个元素的项集），其中每个新组合将我们之前确定的单项集列表中的一个元素与第一步生成的整个库存列表中的另一个新元素结合起来。\n\
  \n步骤\n\n1. 执行数据库扫描并统计每个项目的频率。收集支持值等于或高于最小支持阈值的项目并将其放入名为 `L1` 的集合中，表示常见的 1-项集。\n\
  2. 通过将 `L1` 与自身组合来创建潜在的 2-项集。这涉及组合两个 1-项集，其中具有长度为 k – 1 的公共前缀，其中 k 是当前项集的大小。例如，`{apple}`\
  \ 和 `{banana}` 的组合产生 `{apple, banana}`，而 `{apple}` 和 `{orange}` 无法组合，因为没有共享前缀。\n\
  3. 执行另一次数据库扫描并统计每个候选 2-项集的频率。消除支持低于最小支持水平的候选者并获得集合 `L2`，由频繁的 2-项集组成。\n4. 重复步骤 2\
  \ 和 3，直到无法再生成候选者或无法发现更多频繁项集。由所有 `Lk` 集合组成的集合等同于所有频繁项集的集合。\n\n我们利用频繁项集来发现关联规则并强制执行最小置信度阈值。为了获得规则，我们遍历每个频繁项集\
  \ `X` 并构建 `X` 的所有非空子集。对于每个子集 `Y`，如果规则的置信度满足或超过最小置信度阈值，我们创建规则 `Y -> (X \\ Y)`。\n\n\
  \n\n\n\n考虑一个水果店提供各种水果的场景，例如苹果、香蕉、橙子、葡萄和菠萝。在此背景下，让我们检查已发生的交易：\n\n`T1`: {apple, banana,\
  \ orange}\n\n`T2`: {banana, grape}\n\n`T3`: {apple, banana, grape}\n\n`T4`: {apple,\
  \ grape}\n\n`T5`: {banana, pineapple}\n\n对于 `Apriori` 方法，我们将使用最小支持度为 0.4，对应交易量的\
  \ 40%，以及最小置信度阈值为 0.7，对应规则的 70%。\n\n首先，我们彻底检查数据库并统计每个项目的出现频率。苹果出现在 3 笔交易中，香蕉出现在 4\
  \ 笔交易中，橙子出现在 1 笔交易中，葡萄出现在 3 笔交易中，菠萝出现在 1 笔交易中。唯一支持度大于或等于 0.4 的水果是苹果、香蕉和葡萄。因此，`L1`\
  \ = {{apple}, {banana}, {grape}}。\n\n在第 2 步，我们通过将 `L1` 与自身结合来创建潜在的 2-项集。我们得到一组包含水果对的集合：{{apple,\
  \ banana}, {apple, grape}, {banana, grape}}。\n\n在第 3 步，我们执行第二次数据库搜索以统计每个候选 2-项集的频率。项集\
  \ {apple, banana} 出现在 2 笔交易中，{apple, grape} 出现在 3 笔交易中，{banana, grape} 出现在 2 笔交易中。在选项\
  \ {apple, grape} 中，只有苹果和葡萄的支持值大于或等于 0.4。因此，集合 `L2` 仅由 {{apple, grape}} 组成。\n\n在第\
  \ 4 步，生成额外的候选项或识别额外的频繁项集已不再可能；因此，我们终止该过程。所有频繁项集的集合可以表示为 `L` = `L1` ∪ `L2`，其中 `L1`\
  \ 和 `L2` 是包含以下项目的集合：{apple}, {banana}, {grape}，和 {apple, grape}。\n\n我们采用 `L` 方法来发现关联规则并强制执行最小置信度阈值。我们遍历\
  \ `L` 中每个频繁项集 `X` 以获得期望的结果。然后我们构建 `X` 的所有可行非空子集。对于每个子集 `Y`，如果规则的置信度等于或超过 0.7，我们创建规则\
  \ `Y` -> (`X` - `Y`)。我们获得的规则如下：\n\n{apple} -> {grape} 置信度为 3/3 = 1\n\n{grape} ->\
  \ {apple} 置信度为 3/3 = 1。\n\n这些原则表明，购买苹果的顾客也以 100% 的确定性购买葡萄，反之亦然。\n\n计算此置信度百分比值需要除以\
  \ count(`X` `Y`)/ count(`X`)，其中 `X` 表示在先前步骤中收集的适用子集计数中直接位于 `Y` 之前的目标项集值。这本质上证明了相关项集在整个输入数据集中一起出现的频率，而不仅仅是随机独立地出现——从而成功地从最终输出结果中删除了误报，并最终导致更好的准确性。\n\
  \n`Apriori` 算法不需要关于数据结构的先验知识，由于其迭代性质，它可以快速处理庞大的数据集，并且产生人类可以轻松理解的清晰规则。缺点是，该方法无法很好地处理数值数据，并且倾向于生成大量误报，如果在它们到达结果阶段之前没有仔细过滤掉，就会导致不准确的结果。\n\
  \n### 7.3.4.2 ECLAT 算法\n\n`ECLAT` 代表 equivalence class transformation。 该算法使用‘深度优先’搜索在交易数据库中找到频繁项集。它的执行速度比\
  \ `Apriori` 算法更快。与适用于水平数据集的 `Apriori` 算法不同，`ECLAT` 算法仅适用于垂直格式的数据集。\n\n`ECLAT` 算法是用于在交易数据库中查找频繁项集的方法。频繁项集是一组在超过指定最小交易次数中出现的项目。`ECLAT`\
  \ 算法使用垂直数据格式，其中每个项目都与 `tidset` 相关联，`tidset` 是包含该项目的交易 ID 的集合。例如，苹果的 `tidset`（交易\
  \ ID 集）为 {`T1`, `T3`, `T4`}，香蕉的 `tidset` 为 {`T1`, `T2`, `T3`, `T5`}，依此类推。\n\n####\
  \ 步骤\n\n1. 从所有单项及其 `tidsets` 的集合开始。\n2. 按 `tidset` 大小降序对项目进行排序。\n3. 通过连接共享前 k –\
  \ 2 个项目且具有频繁 `tidsets` 的大小为 k – 1 的项目集对来生成大小为 k 的候选项集。\n4. 通过相交其父项集的 `tidsets` 来计算每个候选项集的\
  \ `tidset`。\n5. 修剪任何 `tidset` 大小小于最小支持阈值的候选项集。\n6. 重复步骤 3 到 5，直到无法再生成候选项或所有候选项都被修剪。\n\
  \n让我们将此算法应用于水果店中关联水果的示例，交易如下，最小支持度为 2。\n\n`T1`: {apple, banana, orange}\n\n`T2`:\
  \ {banana, grape}\n\n`T3`: {apple, banana, grape}\n\n`T4`: {apple, grape}\n\n`T5`:\
  \ {banana, pineapple}\n\n该算法从以下单项及其 `tidsets` 开始：\n\napple: {`T1`, `T3`, `T4`}\n\
  \nbanana: {`T1`, `T2`, `T3`, `T5`}\n\ngrape: {`T2`, `T3`, `T4`}\n\norange: {`T1`}\n\
  \npineapple: {`T5`}\n\n该算法按 `tidset` 大小对项目进行排序：\n\nbanana: {`T1`, `T2`, `T3`, `T5`}\n\
  \napple: {`T1`, `T3`, `T4`}\n\ngrape: {`T2`, `T3`, `T4`}\n\norange: {`T1`}\n\npineapple:\
  \ {`T5`}\n\n该算法通过连接共享第一个项目且具有频繁 `tidsets` 的项目对来生成大小为 2 的候选项集：\n\nbanana apple: {`T1`,\
  \ `T3`}\n\nbanana grape: {`T2`, `T3`}\n\napple grape: {`T3`, `T4`}\n\n该算法通过相交其父项目的\
  \ `tidsets` 来计算每个候选项集的 `tidset`：\n\nbanana apple: {`T1`} ∩ {`T1`, `T3`} = {`T1`}\n\
  \nbanana grape: {`T1`, `T2`, `T3`, `T5`} ∩ {`T2`, `T3`, `T4`} = {`T2`, `T3`}\n\n\
  apple grape: {`T1`, `T3`, `T4`} ∩ {`T2`, `T3`, `T4`} = {`T3`, `T4`}\n\n该算法修剪任何 `tidset`\
  \ 大小小于 2 的候选项集：\n\nbanana apple: 已修剪\n\nbanana grape: 未修剪\n\napple grape: 未修剪\n\n\
  该算法对大小为 3 的项集重复该过程：\n\nbanana grape apple: 已修剪\n\ngrape apple banana: 已修剪\n\n由于无法再生成候选项或所有候选项均被修剪，算法停止并返回以下频繁项集：\n\
  \nbanana\n\napple\n\ngrape\n\nbanana grape\n\napple grape\n\n最重要的结论是 `ECLAT` 与垂直数据格式兼容。由于大多数数据集采用水平格式，因此在应用此算法之前，我们必须先将它们转换为垂直格式。`Apriori`\
  \ 在处理更广泛的数据集时通常表现最佳。因此，小型和中型数据集更适合 `ECLAT` 方法。在 `Apriori` 算法中，我们需要多次扫描数据库以查找频繁项集；使用垂直\
  \ `ECLAT` 数据集可减少此限制。`ECLAT` 中数据库只需扫描一次。由于使用了深度优先搜索，`ECLAT` 使用的内存比 `Apriori` 少。因此，它比\
  \ `Apriori` 更快。\n\n### 7.3.4.3 FP Growth 算法\n\n该算法是一种用于在交易数据集中发现频繁项集的数据挖掘技术。它是 `Apriori`\
  \ 算法的扩展。`FP Growth` 算法收集每个交易中存在的项目列表，然后找出在许多交易中经常一起出现的项目模式。该算法非常高效，即使与 `Apriori`\
  \ 等其他算法相比，也能快速处理大量数据。\n\n它使用一种称为 `FP tree`（频繁模式树）的树结构来比传统的哈希表或位图更有效地存储交易。树结构使其能够高效、快速地识别频繁项集，因为它将有关其频率的所有信息存储在一个地方，而不是逐一查看单个交易。\n\
  \n#### 步骤\n\n1. 计数步骤——计算每个项目的支持计数（在所有交易中出现的次数）。\n\n\n\n\n\n## 构造步骤 – 基于步骤 1 的结果构建\
  \ FP 树。\n\n一旦使用这些步骤构建了 FP 树，算法就会通过修剪策略扫描它以寻找频繁模式，其中罕见的项目会被从考虑中移除，直到只剩下支持度足够的项目。\n\
  \n最后，在每个层级找到的模式可以组合成更大的模式，使其更容易被人类理解或在 `SQL` 或 `NoSQL` 等数据库系统内进行进一步分析。\n\n### 算法步骤及水果店关联水果的示例\n\
  \n1. 扫描交易数据库并统计每个项目的频率。按频率降序对项目进行排序并丢弃任何不频繁的项目。例如，如果最小支持度为 3，则我们可以从交易中丢弃 `orange`\
  \ 和 `pineapple`，并得到以下排序后的频繁项目列表：`{banana, apple, grape}`。\n\n2. 通过按排序后频繁项目的顺序将每个交易作为路径插入树中来构造\
  \ FP 树。如果路径已存在，则增加对应节点的计数。例如，插入 `T1` 将创建路径 `{banana:1 -> apple:1 -> grape:1}`。插入\
  \ `T2` 将创建新分支 `{banana:2 -> grape:2}`。插入 `T3` 将与 `T1` 和 `T2` 共享前缀 `{banana:3}`，然后创建新节点\
  \ `{apple:2}`。插入 `T4` 将与 `T1` 共享前缀 `{apple:3}`，然后创建新节点 `{grape:3}`。插入 `T5` 将创建新分支\
  \ `{banana:4 -> pineapple:1}`。\n\n最终的 FP 树如下所示：\n\n```\nbanana:4\n\n| \\\\\n| pineapple:1\n\
  | /\napple:3\n| \\\\\ngrape:3\n|\ngrape:2\n```\n\n3. 通过递归地为每个项目寻找条件模式来挖掘 FP 树，从排序后频繁项目列表的底部开始。条件模式是树中通向某个项目的子路径，以及它的频率。例如，`grape`\
  \ 的条件模式为：\n- `{apple, banana}: 1`\n- `{banana}: 2`\n- `{apple}: 1`\n\n4. 通过使用其条件模式作为交易并再次应用步骤\
  \ 1 和 2，为每个项目构造条件 FP 树。例如，`grape` 的条件 FP 树为：\n\n```\nbanana:3\n|\napple:2\n```\n\
  \n5. 通过将根项目与其分支的所有可能子集组合，从每个条件 FP 树中提取频繁项集。例如，从 `grape` 的条件 FP 树中得到的频繁项集为：\n- `{grape}:\
  \ 4` `support = 4/5 = 0.8`\n- `{grape, banana}: 3` `support = 3/5 = 0.6`\n- `{grape,\
  \ apple}: 2` `support = 2/5 = 0.4`\n- `{grape, apple, banana}: 1` `support = 1/5\
  \ = 0.2`\n\n6. 对排序后频繁项目列表中的每个项目重复步骤 3 到 5，直到找到所有频繁项集。\n\n`FP Growth` 算法是一种强大的工具，可以分析大型数据集并快速发现重要模式。其可扩展性和多功能性使其成为各种应用的理想选择，例如网络挖掘、市场篮子分析、推荐引擎以及文本挖掘任务，如情感分析和作者识别。凭借其能够部署在\
  \ `Hadoop` 集群等大量数据上的能力，该算法帮助组织在比传统数据库短得多的时间内从数据中发现重要见解。它被用于银行、零售、医疗保健部门以及其他需要从大型数据集中快速获得见解的行业。\n\
  \n## 7.4 马尔可夫模型\n\n`Markov models` 是基于过去数据进行预测的数学工具。这些模型被用于各个领域，包括经济学、工程学和医学。\n\n\
  马尔可夫模型的核心概念是未来可预测地依赖于现在。因此，它们使用“状态转移”——随时间从一个状态到另一个状态的变化。所以，例如，如果你试图预测患者的健康状况如何随时间变化，你会查看他们的当前状况以及导致他们如此的因素\
  \ `such as diet or lifestyle choices`。然后你可以使用先前的数据和对未来的预测来估算接下来可能发生的情况。\n\n马尔可夫模型本质上是一个考虑这些过去状态及其可能未来结果的方程。它通过查看在特定条件或参数下过去类似事件发生的频率来计算每个结果的概率。然后该概率可以根据某些条件和变量保持不变\
  \ `or close enough` 的情况预测接下来会发生什么。\n\n除了进行预测之外，马尔可夫模型还可以用于决策过程，例如金融投资机会或针对特定疾病或病症患者的医疗治疗。模型有助于确定哪条路径更可能导致成功，根据其对随时间通过不同状态的各种路径的概率计算。\n\
  \n## 7.5 隐马尔可夫模型\n\n隐马尔可夫模型 `HMM` 是一种强大且广泛使用的统计模型，可应用于许多任务，例如语音识别、机器翻译和生物信息学。`HMM`\
  \ 模拟事件发生的概率，基于序列中的先前事件。它为无法直接观察的隐藏状态分配概率。\n\n在其核心，`HMM` 是一个由两个组件组成的概率图模型：状态和转移。状态是无法直接观察的潜在未知事件。转移表示在一系列中从一个状态改变到另一个状态的机会。基于先前事件，这些状态的转移决定接下来会发生什么。\n\
  \n`HMM` 可用于许多应用，例如识别手写文本或语音识别，因为它允许我们在任何时间点考虑观察的多种可能解释，并在预测未来时考虑所有先前的观察。这使得 `HMM`\
  \ 在处理具有可变长度或不完整信息的序列数据时非常强大，而其他模型可能因其更僵化的结构和对其内部数据分布的假设而难以应对。\n\n`HMM` 也已成功用于机器翻译，因为它们可以从小数据集中快速学习复杂的语言模式。这归功于它们能够通过在预测句子或短语中单词顺序时考虑上下文相关信息而很好地在不同上下文和语言之间泛化，即使在训练过程中从未见过它们。此外，它们通常在生物信息学研究中用作分析\
  \ DNA 序列的工具，查看基因的转录调控网络。\n\n### 7.5.1 学习 HMM 参数\n\n学习 `HMM` 参数对于处理序列数据至关重要。这是因为\
  \ `HMM` 可以帮助我们发现序列中不同元素之间可能仍未被发现的隐藏模式。\n\n\n\n\n\n首先，必须先确定模型所需的状态数和转换数。例如，如果我们要对基因表达进行建模，就需要多个表示不同基因表达水平的\
  \ state，例如 `active`、`inactive` 和 `transitioning`。每个 state 还可能有众多转换，这些转换决定了它如何随时间从一个\
  \ state 转变到另一个 state。一旦这些组件被确定，就必须通过收集在不同条件下观察到的序列数据并基于这些观察结果构建模型，来估计每个 state 或\
  \ state 之间转换的概率分布。这通常涉及在通过诸如 `EM algorithm` 等各种方法进行细化之前，根据先前的经验或直觉猜测这些概率可能是什么样子。`EM\
  \ algorithm` 通过根据期望值调整估计值，直到它们收敛到最能拟合我们数据集的最优解的方式工作。一旦所有参数都已使用 `EM algorithm` 等适当方法充分估计，就可以使用这些信息来进行预测，这些预测需要在事先准确学习概率分布。\n\
  \n例如，该技术已被用于创建 `NLP` 应用，其中准确预测词语使用模式可实现与计算机更有效的通信，以及语音识别系统，其中准确的预测有助于计算机更准确地识别人类语音。总之，学习\
  \ `HMM` 参数是处理序列数据的重要组成部分，因为它帮助我们揭示序列中元素之间的隐藏关系，然后可用于需要事先准确学习概率分布的预测任务。\n\n### 7.5.2\
  \ Decoding States from Observations\n\n解码 `ML` 算法的状态可以为其决策过程提供宝贵的见解，并帮助研究人员优化其性能以最大化准确性。这是通过观察不同的输入如何影响模型的输出，然后解码每个状态以识别可能受益于改进或更改的区域来实现的。为此，研究人员使用可视化工具，例如热力图，它以对预测结果的影响来描绘每个状态，以及概率方法，例如\
  \ `Bayesian networks` 或 `Markov models`，它们使我们能够追溯导致任何给定结果的所有可能路径。通过从观察中解码状态，我们可以更好地理解为什么基于它们对结果的影响而做出某些决定而不是其他决定。例如，假设某个特定输入显著影响了输出。在这种情况下，我们知道它对于做出准确预测至关重要，并且在优化工作期间应给予更多关注。\n\
  \n此外，在进行更改或实施新功能之前识别可以改进的区域，使我们能够在不遇到意外后果的情况下测试什么效果最好。可视化对于帮助我们深入了解决策过程特别有用，因为它们使我们能够看到从数据中出现的模式或集群，这些模式或集群如果只是直接查看数据则不会明显。此外，像\
  \ `Bayesian networks` 和 `Markov models` 这样的概率方法在获得更深入的理解方面发挥着重要作用，因为它们同时考虑多个结果，而不是一次只考虑一个结果。\n\
  \n### 7.6 Matrix Factorization and Matrix Completion Models\n\n`Matrix factorization`\
  \ 和 `matrix completion` 模型可用于监督和无监督 `ML` 场景。在无监督学习中，`matrix factorization` 用于在无需标记数据的情况下发现数据集中的潜在模式或集群。例如，它可以识别文档集合中的主题或在推荐系统中对相似的组项目进行分组。在监督学习中，`matrix\
  \ completion` 可以填补数据集中的缺失值，例如基于用户评分预测电影评分。在这种情况下，模型使用具有已知输出的现有数据进行训练，然后用于预测新数据中的缺失值。总之，这取决于\
  \ `matrix factorization` 和 `matrix completion` 模型的应用和用例是在监督或无监督学习上下文中使用。\n\n`Matrix\
  \ factorization` 和 `matrix completion` 是数据分析和 `ML` 中使用的两种技术，可用于解决复杂问题。`Matrix factorization`\
  \ 用于将矩阵分解为其组成部分。相比之下，`matrix completion` 用于推断矩阵中的缺失值。\n\n`Matrix factorization`\
  \ 将原始矩阵分解为更简单的组件，例如主成分、潜在特征或奇异值。通过应用此方法，可以降低原始矩阵的维度（也称为特征选择），使其更容易分析，通过减少噪声并提高可解释性。例如，假设您有一个包含\
  \ 10 个不同变量的输入数据集。您可以使用因子分析将此数据集减少到 5 个与模型构建过程更相关的变量。这还可以帮助提高预测性能，因为它降低了模型复杂性。\n\n\
  `Matrix completion` 使用统计方法，例如低秩近似或核范数最小化。低秩近似通过使用凸优化技术（如 `gradient descent` 或正则化最小二乘）最小化重建解的秩，从可用观测中重建完整数据。低秩近似背后的思想是用更少的独立分量（或变量）来近似数据。这减少了计算所需的内存和计算能力，简化了分析并使其更快。在低秩近似中，从数据集中选择一组特征子集，其中包含关于它的大部分信息。此子集可以使用诸如\
  \ `PCA` 或奇异值分解（`SVD`）等算法确定。这些方法找到捕获数据集中大部分方差的正交基，然后使用此基通过将每个表示为此正交基中其他特征的线性组合来降低其维度。这些简化表示比其完整对应物更容易存储和处理，允许在不牺牲太多准确性或有关原始输入特征的有意义信息的情况下实现更快的计算时间。\n\
  \n此外，低秩近似使算法开发更易于管理，因为它在减少可能压倒模型性能的噪声和无关细节的同时保留了数据集中的基本模式。例如，考虑诸如人脸识别或使用 `CNN` 的物体检测等图像检测算法。低秩近似在训练期间以及推理时都因其相对于传统方法（如\
  \ `SVM` 或逻辑回归）的计算效率优势而被广泛使用，传统方法需要更长的训练/推理时间，但与 `CNNs` 相比提供的准确性较低。\n\n\n\n\n\n核范数最小化尝试通过最小化其核范数（奇异值之和）来恢复损坏数据集的底层低秩结构。与传统的插补方法（如均值插补）相比，这种技术的优势在于它只能选择那些最能解释数据中观察到的模式的条目，同时忽略异常值或无关变量。它利用两个主要组件：核范数正则化和凸优化。核范数正则化有助于减少过拟合，而凸优化有助于为给定问题找到最优解。从本质上讲，核范数最小化是一个迭代过程，即查看数据点并尝试将其拟合到预测模型或函数中。为了实现这一点，我们使用诸如凸优化的数学工具以及诸如`L1`或`L2`范数等正则化技术，这些技术有助于我们最小化过拟合。这样，我们就可以构建准确的模型，其参数比传统方法如线性回归或`K-means`聚类更少。这种方法的本质优势在于其能够准确预测结果，即使对用于训练模型的假设很少。\n\
  \n此外，由于它最小化错误而不是最大化准确性，因此比其他方法如支持向量机（`SVMs`）更不容易过拟合。这使其适合处理稀疏数据集，这些数据集对输入变量如何与输出变量相关知之甚少。\n\
  \n矩阵分解和矩阵补全因其能够帮助发现数据集中的隐藏特征、恢复损坏的图像和视频、预测用户偏好等任务而在近年来得到了广泛研究。\n\n## 7.7 Generative\
  \ Models\n\n生成模型可用于监督和无监督学习任务。监督生成模型经过训练以利用标记数据，其中输出变量已知，例如分类或回归问题。监督生成模型的例子包括`Gaussian\
  \ naive Bayes`和条件生成对抗网络（`CGAN`）。另一方面，无监督生成模型在未标记数据上训练，其中输出变量未知。这些生成模型通常用于聚类和降维任务。无监督生成模型的例子包括`autoencoder`、`variational\
  \ autoencoder`（`VAE`）和生成对抗网络（`GAN`）。无论模型是监督还是无监督，完全取决于提供给模型作为输入的数据类型和手头的任务。\n\n\
  生成模型通过发现现有数据的底层结构来生成新数据。这些模型能够从头创建逼真的数据。它们可用于各种任务，例如生成合成图像、语音合成、自然语言处理、文本生成和推荐系统。\n\
  \n混合模型是使用统计技术在训练集中发现聚类的生成模型。给定观察到的数据，它们允许您估计一组变量上的概率分布。混合模型可以使用从训练数据集中学习到的混合组件对未见数据点进行预测或分割决策。例如，它们可用于图像分类任务，其中我们希望识别不同的对象，或分割任务，其中我们希望区分图像中不同区域。\n\
  \n## 7.8 Latent Factor Models\n\n潜在因子模型基于这样一个想法：不同变量或特征之间存在一种秘密关系，称为潜在因子。这种关系通常无法从原始数据中看到，但可以从中推断出来。例如，假设我们有一个包含人们电影偏好的数据集。我们可能会假设一个驱动这些偏好的底层潜在因子‘电影类型兴趣’，但这在原始数据中无法轻易看到。潜在因子模型允许我们通过分析数据集中不同变量或特征之间的相关性，然后推断哪些因子可以解释它们，从而揭示这种秘密关系。\n\
  \n潜在因子模型相对于传统方法如线性回归的主要优势在于，它们可以解释变量之间的非线性关系，并且由于它们仅使用少量‘潜在’（隐藏）因子而不是必须分别考虑每个变量，因此比传统方法更有效地处理大量数据。潜在因子模型在营销、金融、图像识别和自然语言处理（`NLP`）中有许多应用。\n\
  \n由于此`mmodel`的步骤涉及复杂的计算，大多数现代实现严重依赖于诸如图形处理单元（`GPUs`）的向量处理技术。除了与传统`CPU`相比显著加快计算速度外，`GPU`还可以处理比通常可放入`CPU`内存中的更大数据集，这有助于促进更强大的分析。这与在计算周期期间传输大量数据时产生的较少开销成本相关，从而导致更快的收敛时间和整体改进的准确率。\n\
  \n## 7.9 Inference Models\n\n图形模型中的推理和机器学习中的信念传播是密切相关的概念，因为它们都涉及从给定数据集中收集信息。图形模型，也称为贝叶斯网络，是表示变量之间关系的一种流行工具。该模型通过使用表示它们之间条件依赖性的图状结构，提供了一种有效表示多个变量的概率分布的方法。从这些模型进行推理涉及计算与变量的不同配置相关联的概率或值。最常见的方法称为信念传播或消息传递。\n\
  \n信念传播基于一种迭代算法，该算法使用在图中节点之间传递的消息来为关于由图表示的系统的任何给定查询得出最终答案。它首先用其关于其值的先验信念初始化每个节点，然后根据其邻居和先前的信念向其他节点传递消息，直到所有节点就其各自的值达成共识。将这些消息在所有节点中传播使得能够计算出准确反映图形模型底层概率分布的答案，即使由于数据可用性有限或特定系统中存在高度随机性（如天气预报）而存在相当大的不确定性。\n\
  \n该算法首先创建一个模型或信念网络，由表示不同变量及其之间可能关系的节点和边组成。每个节点包含有关其可能特定值的信息，具体取决于其与网络中其他节点的连接。信念网络可以表示为三个部分：\n\
  \n•证据节点（包含观察到的数据）\n\n•决策节点（包含基于证据的决策）\n\n•效用节点（包含有关特定结果有多 desirable 的信息）\n\n\n\n\
  \n\n一旦这三个组件被定义，信念传播就会开始在节点之间传递消息，以计算与每个节点的状态或决策相关的概率或期望效用值。在每个处理周期中，消息会根据它们在网络中的连接从一个节点传递到另一个节点。这一过程将持续进行，直到所有消息都被处理完毕，并且只有一个可能的解释，其概率高于所有其他解释（或直到无法再改进为止）。此时算法停止处理，因为它已经得出结论。\n\
  \n在机器学习应用中，信念传播可用于根据观测到的数据点对未来事件或状态进行预测，而无需明确形成关于它们的概率假设（即，无需访问完整的领域知识）。此外，与传统的“暴力”方法相比，当面对包含高维输入和输出的大型数据集时，信念传播算法在效率上扩展得更好——即使面临此类挑战，也能让从业者比以前更快地应用推理技术，而不会牺牲准确性。\n\
  \n## 7.10 非负矩阵分解\n\n非负矩阵分解（`NMF`）是一种分解技术，涉及将矩阵分解为两个具有非负元素的分量矩阵。`NMF`与其他分解方法（如`SVD`）的主要区别在于对分解分量元素的限制为非负。这种限制具有优势，例如可解释性得到改善，因为在许多现实世界应用中，负值比正值更有意义。\n\
  \n`NMF`背后的思想是，任何给定的复杂数据集都可以由构成其结构的更简单的部分或分量组成，然后可以使用该技术识别这些部分。为此，`NMF`首先用两个矩阵 `W`\
  \ 和 `H` 表示原始数据集 `A`，它们的乘积近似于 `A`：`A ≈ WH`，其中 `W` 表示“权重”或“载荷”，`H` 表示“模式”或“特征”。此外，`W`\
  \ 和 `H` 仅具有非负条目，这使得它们比来自 `SVD` 的对应物更易解释，因为在许多情况下负条目没有意义。\n\n`NMF`通过最小化 `A` 与 `WH`\
  \ 之间的距离来同时优化 `W` 和 `H`，通常通过平方弗罗贝尼乌斯范数 `||A–WH||2≤2²` 来衡量，通过迭代更新每个矩阵，直到它们收敛到不再根据某些指标（如均方误差\
  \ `MSE`）改善结果的点。一旦收敛，我们就得到了最优解，最优权重 `W∗` 和模式 `H∗` 近似于我们的原始数据集 `A ≈W∗H\\*`。然后可以使用这些分量来揭示数据中可能以前不可见或不理解的隐藏模式，在对其应用\
  \ `NMF` 之前。\n\n## 7.11 无监督学习的优势\n\n无监督机器学习是一种人工智能形式，可以在没有任何外部指导或标签的情况下发现数据中的模式。这种类型的人工智能允许计算机独立学习并揭示数据集中的隐藏关系。它通过将相似的数据分组到簇中并使用算法识别这些簇内的模式来工作。通过这样做，计算机可以找到不同数据片段之间的相关性，并在没有人类帮助的情况下预测未来趋势。无监督机器学习的一个优势是其能够通过自动化否则需要大量人力的工作来节省时间和金钱。例如，假设一家公司拥有包含客户信息的大型数据集，例如年龄、性别、位置等。无监督机器学习算法可以分析该数据集并揭示不同因素之间隐藏的趋势或相关性，这些趋势或相关性对于人工查看数据集的人来说可能并不明显。这可以使公司根据这些发现做出更好的决策，从而增加利润或提高客户服务水平。\n\
  \n此外，它有助于降低计算成本，让机器为你做那些否则对人类分析师来说太昂贵或耗时的工作。无监督机器学习也可用于异常检测——识别数据集中可能表明欺诈活动或其他异常的异常模式——以及诸如面部识别软件等图像识别应用，该软件可以在不事先告知要查找的个人（即没有标签）的情况下从图像中识别个人。它还已被用于数据集中没有明确标签的聚类应用，例如市场细分，其中客户根据其相似性而不是人类事先给定的预定义特征（带标签）分组到类别中。\n\
  \n## 7.12 无监督学习的缺点\n\n过拟合在机器学习中很常见，主要是在模型过于复杂或数据不足或失真时。过拟合发生在模型在拟合训练数据时表现出高准确性；然而，它难以将这种知识应用于新颖或未见过的数据。这意味着模型可以准确表示训练数据的外部信息或不重要方面，而不是基本模式或框架。让我们考虑一个场景，我们希望使用一种不需要标记数据的算法对一组动物照片进行分组。如果算法对像素的颜色或形状过于敏感，它可能会错误地根据这些特征对照片进行分组，而不是实际的动物组。将模型应用于具有不同颜色或形状的新图像将产生较差的性能。\n\
  \n无监督机器学习的另一个缺点是执行和微调这些算法所涉及的巨大计算费用。与依赖明确定义的客观函数或准确性指标来驱动学习过程的监督学习不同，无监督学习通常涉及在没有明确定义标准的情况下探索许多模型和参数。此过程可能非常耗时且资源密集，特别是处理大量和复杂的数据集时。要使用诸如\
  \ `PCA` 或 `t-分布随机邻居嵌入`（`t-SNE`）等无监督算法对高维数据集执行降维，可能需要尝试不同数量的分量或困惑度值。这是为了找到保留最多信息或捕获数据中最显著变化的最佳表示。\n\
  \n此外，无监督机器学习经常产生人类难以分析和理解的结果。无监督算法没有指定的标签或类别可以赋予数据。相反，它们使用相似性或距离度量生成自己的表示或簇。这些表示或簇可能与人类相关的或直观的概念不一致，或产生过于复杂的假设来证实或反驳。\n\
  \n### Summary\n\n• 无监督学习是一种机器学习类型，其中计算机程序尝试在没有给定特定示例或标签进行学习的情况下在数据中寻找模式和关系。\n\n\n\
  \n\n\n## 聚类与无监督学习方法\n\n`Clustering algorithms` 用于识别数据中的模式并将相似的数据点分组。`Hierarchical\
  \ clustering algorithms` 用于将相似对象分组为聚类层次结构。`Fuzzy C-Means clustering` 使用模糊逻辑代替硬聚类边界，使其适用于具有重叠特征和类别的数据集，这些类别无法通过传统方法轻松分离。`DBSCAN`\
  \ (`Density-Based Spatial Clustering of Applications with Noise`) 使用密度作为识别空间数据库中聚类的标准，例如包含地理信息系统\
  \ `GIS` 的数据库。\n\n`Gaussian mixture models` (`GMMs`) 是概率模型，假设每个点属于 `k` 个高斯中的一个，并基于概率值分配权重，使点可同时分配到多个聚类。`MeanShift\
  \ Clustering` 算法迭代地将数据点的质心向更高密度区域移动。它不需要标记数据或涉及任何预先确定的目标或输出。\n\n`Gaussian mixture\
  \ density estimation` 在复杂数据集中寻找模式并在没有类别标签先验知识的情况下进行预测。`Markov random fields` (`MRFs`)\
  \ 模拟不同变量之间的复杂关系。\n\n`Anomaly detection` 是程序查找与剩余数据点不同的数据点。`isolation forest` 算法使用决策树来识别数据中的异常。\n\
  \n`Local outlier factor` (`LOF`) 使用基于密度的聚类以无监督方式识别异常，通过查看特定数据点与其在 `n` 维空间中的邻居的接近程度，其中\
  \ `n` 表示数据集中存在的特征数量。\n\n`One-class support vector machine` (`OC SVM`) 通过拟合一个最佳分离日常示例与异常示例的单一模型来识别异常，使用超平面分离技术，然后基于训练阶段使用\
  \ `SVM` 技术构建的此模型将任何新示例分类为一类或另一类。\n\n`Dimensionality reduction` 是简化复杂问题同时保留原始数据集相关信息的强大工具。\n\
  \n`PCA`，或 `principal component analysis`，是用于在保留其最重要的特征的同时减少数据集维度的<|message|> 方法。`KPCA`\
  \ 是 `PCA` 的非线性版本，使用核函数作为线性变换的替代方案将数据转换为低维空间。\n\n`Linear discriminant analysis` (`LDA`)\
  \ 是通过找到特征的最佳线性组合来对数据进行分类的方法。\n\n`Factor analysis` (`FA`) 是识别变量之间潜在关系的统计技术。因子分析的两种主要方法是探索性和验证性。\n\
  \n`Association rule mining` 可用于在数据集中找到各种元素之间的连接。`FP Growth` 算法是发现事务数据库中频繁项集的有效方法。`Apriori`\
  \ 算法可以揭示大型数据集中项目之间的关联。`ECLAT` (`equivalence class transformation`) 算法使用深度优先搜索在事务数据库中找到频繁项集。\n\
  \n在监督学习中，`Markov model` 使用标记数据进行训练，意味着数据具有目标或输出变量。然后模型用于对新的未标记数据进行预测。在无监督学习中，`Markov\
  \ model` 仅使用输入数据进行训练，而不使用标记输出。`hidden Markov model` (`HMM`) 在无监督学习中使用未标记数据集进行训练。\n\
  \n`Unsupervised generative models` 在未标记数据上训练，其中输出变量未知。这些生成模型通常用于聚类和降维任务。\n\n`Latent\
  \ factor models` 是生成模型，使用潜在变量（未直接观察到的变量）来捕捉数据集中的模式并从中获得见解。\n\n图形模型中的推理和 `ML` 中的信念传播是密切相关的概念，因为它们都指从给定数据集收集信息。\n\
  \n`Belief propagation` 是 `ML` 算法，专门用于为给定证据集找到最可能的解释。`belief network` 可以表示为三部分：证据节点（包含观察数据）、决策节点（包含基于证据的决策）和效用节点（包含特定结果有多\
  \ desirable 的信息）。\n\n## EXERCISES\n\n## Part A (Objective Questions)\n\n1. 在 `K-means`\
