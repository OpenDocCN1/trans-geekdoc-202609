  \ |\n\n## 学习目标\n在本章结束时，你将能够：\n- 定义机器学习的基本概念并解释其历史背景\n- 解释机器学习在计算机科学中的意义及其在解决问题中的作用\n\
  - 阐述监督学习原理及其子类别——回归和分类\n- 详细阐述无监督学习的概念，包括聚类和关联\n- 解释强化学习的过程和目标\n- 阐明迁移学习和元学习的概念及其在机器学习中的相关性\n\
  - 识别已机器学习解决的现实问题\n- 讨论数据驱动解决方案的缺点和局限性\n- 定义良好的机器学习问题\n- 概述机器学习系统从设计到部署的生命周期\n\n\
  ## 1.1 简介](#07_Contents.xhtml#sub-1)\n\n\n\n\n计算机科学和统计学与机器学习相结合创建预测模型。机器学习利用算法处理海量数据以寻找模式，并在迭代过程中进行学习。理想情况下，是基于这些影响关键增长指标的洞察做出决策。\n\
  \n\n\n\n## 机器学习的历史\n\n- **1967 年**：Cover 和 Hart 发表了一篇名为《最近邻域模式分类》的文章。该文章假设机器学习是一种归纳逻辑技术，可将输入对象分为两组。分类模式将项目分配到与其最近邻居相同的类别中。在这一技术的帮助下，根据各种属性对对象进行分类，其中许多属性是分类或数值型的，并且可能具有重叠的值。\n\
  - **1979 年**：斯坦福大学学生创建的“斯坦福小车”能够在空间中自主绕过障碍物。\n- **随着 2 世纪 80 年代的开始**，研究人员开始探索机器如何在没有显式程序规则的情况下进行学习。\n\
  - **1981 年**：Gerald DeJong 基于解释的学习（`EBL`）利用计算机分析训练数据，并通过忽略无关数据生成其可以适用的通用规则。\n- **1985\
  \ 年**：Terry Sejnowski 和 Charles Rosenberg 创建了 `NETtalk`，这是一种神经网络，单周内学会了如何正确发音 20,000\
  \ 个单词。\n- **1986 年**：Geoffrey Hinton 和 David Rumelhart 提出了一种名为反传播算法的新算法。这是首次使用人工神经网络从输入数据中学习的算法。\n\
  - **1997 年**：当 IBM 的深蓝号击败象棋大师加里·卡斯帕罗夫时，计算机首次击败人类象棋专家。\n- **2006 年**：计算机科学家 Geoffrey\
  \ Hinton 将神经网络研究重新命名为“深度学习”。从那时起，它成为最流行的技术之一。\n- **2010 年**：得益于微软 Kinect 能够每秒 30\
  \ 次的速度追踪 20 个人体特征，人们可以通过移动和手势与计算机交互。\n- **2011 年**：IBM 的 Watson 在《危险一答》（Jeopardy）中击败了人类对手。\n\
  - **2012 年**：Google 开发了一种深度神经网络，学习了识别 YouTube 视频中人物和猫的图像。\n- **2014 年**：聊天机器人 Eugene\
  \ Goostman 通过了图灵测试。约 33% 的活动评审员认为 Goostman 是人类。Facebook 开发了一个名为 `DeepFace` 的深度神经网络，该公司声称其识别人物的精度可以达到人类。\n\
  - **2016 年**：Google 的人工智能算法击败了一位职业围棋手，这被认为是世界上最具挑战性的棋类，复杂程度是象棋数倍。在围棋比赛中，Google DeepMind\
  \ 创建的 `AlphaGo` 算法赢得了所有五局。\n- **2017 年**：Waymo 开始在美国测试无人驾驶车辆，但后部仅留有备份驾驶员。他们在同年晚些时候在菲尼克斯推出了全自动驾驶巡游车。\n\
  - **2017 年至今**：从 2017 到 2024 年，构建神经网络和深度学习算法推动了许多领域的发展。行业在 2020 年优先考虑 AI 伦理和可解释性，以提高算法的公平性、透明度和责任感。到\
  \ 2022 年，随着机器学习业务的增长，生成模型主导了内容生产和仿真。AI 在图像分类、视觉推理和语言解释方面优于人类。然而，它缺乏竞争数学和常识逻辑等高级认知技能。预计机器学习市场到\
  \ 2024 年将达到 210 亿美元，这说明了其快速增长和人工智能投资的趋势。\n\n![](img/f1-3.jpg)\n\n图 1.3 机器学习的历史\n\
  \n在动物身上观察到的学习原理也启发了机器学习算法的发展。避饵回避实验和斯金纳的鸽子迷信等实验说明了动物行为如何与数据采样和经验风险最小化等机器学习概念相关。通过理解这些原理，机器学习研究人员可以开发更有效的算法，使其从数据中学习并随着时间的推移提高准确性。\n\
  \n避饵回避实验涉及老鼠及其学习行为。实验表明，老鼠倾向于在吃一顿饱饭之前吃少量的食物。这种行为类似于机器学习中的数据采样概念。在机器学习中，数据采样涉及从较大的数据集中选择子集来训练模型。这个过程有助于降低模型的计算复杂度并提高其准确性。\n\
  \n斯金纳的鸽子迷信实验涉及鸽子及其对奖励的行为。实验显示，当鸽子随机收到奖励时，它们会产生迷信行为，即使奖励与它们的行为无关。这种行为类似于机器学习中的经验风险最小化概念。经验风险最小化涉及最小化模型预测输出与数据实际输出之间的差异。这个过程有助于提高模型的准确性并减少过拟合的风险。\n\
  \n## 今天的机器学习\n\n机器学习在研究方面取得了巨大进展，渗透到我们生活的各个方面。例如自动驾驶汽车、亚马逊的 Alexa、聊天机器人、推荐系统等。它结合了聚类、分类、决策树以及监督学习、无监督学习和强化学习技术。例如，2020\
  \ 年世界正在应对疫情时，OpenAI 发布了 `GPT-3`，这是一种革命性的自然语言处理算法，具有根据提示生成类似于人类语言文本的卓越能力。`GPT-3`语言模型使用了\
  \ 1750 亿参数并利用 Microsoft Azure AI 超级计算机进行训练，目前被认为是世界上最先进、最复杂的语言模型。\n\n2022 年，采用 `GPT-3.5`\
  \ 的 `ChatGPT` 作为免费研究预览，彻底改变了 AI 机器人的可用性和实用性。这一重大发布为开发者和 AI 爱好者提供了一个关键工具。OpenAI 在\
  \ 2023 年推出了 `ChatGPT Plus`，这是一种具有更少停机时间和新功能的高级会员服务，显示了对高级 AI 的需求。同年，微软在对话式 AI 中加入了由\
  \ `ChatGPT` 驱动的 `Bing` 功能。开发者可能会使用 `API` 为其应用程序添加 `ChatGPT` 功能，从而扩展其用例。AI 的快速增长是惊人且令人鼓舞的，`ChatGPT`\
  \ 和 `Bing` 中的 OpenAI `GPT-4` 承诺提供更好的可靠性、创造性和解决问题的能力。\n\n\n\n\n在计算机科学中，机器学习（ML）被广泛用于处理大规模数据集或需要巨大计算能力的问题，例如图像识别或自然语言处理（NLP）。例如，假设有一组照片需要根据其内容进行标记。可以创建一个机器学习算法来检测图像中的特定方面，例如色彩组成和纹理。\n\
  \n这种算法技术明显快于人工标记，因为它不需要人类的经验；它只需要在相关数据集上进行训练，就能根据内容可靠地识别照片。此外，一旦在某一种类型的数据集上完成训练，相同的算法就可以频繁地重复用于类似的图像识别任务，而无需额外的训练，从而获得更高效的结果。\n\
  \n机器学习展现价值的另一个例子是通过分析由 `Google Analytics` 等大数据分析公司指出的历史趋势来预测用户行为。这有助于企业更好地理解用户如何与他们的服务/产品互动，从而定制产品以最大化用户参与度，同时最小化地减少与开发/营销相关的成本。\n\
  \n## 1.5 为什么需要机器学习？](#07_Contents.xhtml#sub-5)\n\n机器需要学习的原因之一是为了执行超出人类能力的任务。例如，机器可以处理和分析人类无法处理的大量数据，如数千次科学实验的结果。机器还可以从自己的经验中学习并随着时间的推移提高性能，这被称为经验学习。\n\
  \n让我们考虑一个科学实验的例子，涉及测试不同的化学组合以产生所需的反应。人类科学家可能会进行多次试验并记录结果，但对科学家来说，分析变量之间所有可能的模式和相关性将非常困难且耗时。然而，机器可以使用数据挖掘技术来发现隐藏的见解并从数据中生成假设。机器还可以使用机器学习算法来测试、完善其假设并优化其结果。\n\
  \n机器需要学习的另一个原因是为了模拟人类的能力，例如语音识别和图像识别。这些任务要求机器理解和解释自然语言和视觉信息，而这些是非结构化且复杂的数据形式。\n\n\
  让我们考虑一个可以将语音转为文本的语音识别系统。人类听者可能理解说话者在说什么，但对他们来说，准确且快速地写每一个单词将是非常挑战性的。然而，机器可以使用语音识别技术将声波转换为数字信号，并从中提取特征。机器还可以使用\
  \ `NLP` 技术来解析句子并为单词赋予意义。机器可以从自己的错误和反馈中学习，并随着时间的推移提高准确性和速度。\n\n机器学习的增长得益于几乎无限的可访问、负担得起的数据存储选项、计算能力的可访问性和负担能力、更廉且更强大的处理器的开发以及高速互联网的普及。得益于这些数字化转型因素，人们可以快速自动地创建能够快速准确分析大量复杂数据集的模型（图\
  \ 1.4）。\n\n机器学习使公司保持竞争另一种方法是自动化复杂流程，例如制造装配线或客户服务机器人。自动化可以提高效率，同时减少与劳动费用相关的成本。\n\n\
  由于其多功能性和可扩展性，机器学习被工业人士和学术界广泛拥抱。尽管在开发这些算法时仍面临挑战（解释性容易、避免过拟合），但机器学习继续改变我们解决问题的方式，提供比以往任何时候都更多的机会，准确分析状况并得出有意义的结论。\n\
  \n![](img/f1-4.jpg)\n\n`图 1.4`\n\n## 为什么需要机器学习？\n\n机器学习的实际应用使用数据来驱动业务结果，对组织的底线产生重大影响。组织已经采用机器学习作为创建模型、制定策略和规划的最佳方法，并且需要一个系统来有效地分析它。此外，具有机器学习能力的自动化有助于消除与手动任务相关的偏差，手动任务中可能会发生人为错误。\n\
  \n机器学习可以快速准确地识别数据中的复杂关系，而手动这样做将花费大量的时间和精力。结果是组织可以更快速地发现良机的机会和潜在风险。最后，机器学习帮助零售等行业实现个性化体验，通过利用从客户与网站和移动应用程序互动中收集的行为分析数据，公司可以根据个人偏好定制产品，同时通过使用机器人的人工智能驱动自动对话提供更高效的客户服务；这为客户提供了快速解决方案，因为他们不需要等待可能几小时或几天的代表回复。\n\
  \n## 1.6 机器学习的适应性](#07_Contents.xhtml#sub-6)\n\n适应性是指机器学习系统根据环境当前状态调整决策的能力，而不需要人工干预或从头开始训练。例如，用于垃圾邮件检测的自适应机器学习系统可以通过根据用户或电子邮件服务器的反馈更新模型，识别随时间出现的新类型垃圾邮件。机器学习的适应性可以通过不同的方式实现，取决于环境变化的类型和程度。常见方法如下：\n\
  \n- 在线学习：这是一种增量学习的形式，机器学习系统在新的数据到达时持续更新其模型，而不存储或访问之前的数据。在线学习可以处理数据分布或任务的逐渐或中度变化，但如果变化是突然或剧烈的，可能会遭受灾难性遗忘。\n\
  \n\n\n\n\n- **主动学习**：这是一种选择性学习的形式，机器学习系统从无标记数据池中查询信息量最大或不确定性数据点，并从专家（如人类专家或模拟器）获取其标签。主动学习可以降低标注成本并提高模型准确性，特别是在数据稀缺或存在噪声的情况下。主动学习还可以通过关注最相关或新颖的数据点来处理数据分布或任务的变化。\n\
  - **强化学习**：这是一种交互式学习的形式，机器学习系统通过在环境中的自身行为及其后果进行学习，而不需要显式的标签或监督。强化学习可以优化长期目标或奖励，这可能取决于环境的状态和其他智能体的动作。强化学习可以通过探索不同的动作并利用最佳动作，来处理反馈或奖励函数的变化。\n\
  \n## 1.7 设计与学习\n\n设计和学习是机器学习中两个不同的维度。解决问题的方法是它们之间的主要区别。通过从历史数据中学习来开发能够精确预测未来结果的预测模型，是学习的重点。另一方面，创建新的算法或架构来解决如图像识别、自然语言处理和自动驾驶等挑战性的现实世界问题，则是设计的重点。\n\
  \n设计要求原创性，并且经常涉及新算法或架构框架的创建。这可能涉及修改已使用的算法或从零开始构建完全全新的模型。与领域专家合作以理解要解决的问题并生成解决方案也可能是设计过程的一部分。设计是使用具有关于输入数据的特定参数或假设的算法或模板来创建模型。这包括设计深度神经网络（`DNN`），这是一种由由神经元连接的多个层组成的\
  \ AI 模型。设计者需要定义网络将使用哪些类型的层（例如卷积层）、这些层如何连接（例如跳跃连接），以及每层权重将使用什么值（这决定了神经元对另一个神经元的影响强度）。\n\
  \n设计意味着创建实现所需结果的新方法或技术。相比之下，学习可以认为是将当前的算法或架构应用于数据以推导出结果。\n\n无监督学习和监督学习是学习的额外类别。监督学习需要标记数据，这意味着在创建模型之前，输入数据必须具有指定预期输出的标签。然后使用标记数据训练模型以发现输入与输出的映射。无监督学习则力于直接从数据中识别模式，不需要标记数据。在这个过程中，算法通过完善其内部参数来更好地模拟输入/输出之间的关系，以便在给定训练期间未见过的新输入时准确预测未来结果。使用诸如\
  \ `backpropagation`（反向传播）等技术有助于在处理大量数据或复杂问题时确保准确性，在这些情况下，传统方法可能会因为无法比爬山算法等手动优化技术更快地优化超参数等而失败。\n\
  \n设计和学习是机器学习开发项目中密切相关但又不同的概念。设计者创建具有适当架构的机器（`design`），而学习者使用这些设计加上现有数据集对它们进行完善。通过理解这两个概念，开发者可以快速、自适应且高效地构建解决方案，因为设计者专注于构建模型，而学习者致力于优化模型。综上所述，设计意味着开发新的算法或架构，而学习是将当前的算法或架构应用于输入数据以做出预测。\n\
  \n## 1.8 机器学习中的训练与测试\n\n训练和测试是机器学习过程中两个关键组成部分，它们共同工作以产生可靠的模型。训练和测试是模型构建过程中的两个不同阶段。测试涉及评估模型在新数据上的性能，而训练涉及从训练数据中构建模型。换句话说，测试是使用以前见过的数据来验证模型，而训练是从数据中学习。\n\
  \n### 训练\n训练是向模型提供输入数据以学习如何识别模式或识别变量之间关系的过程。这可以根据要解决的问题使用监督或无监督方法。在训练期间，将不同的算法应用于输入数据，并不断调整参数直到找到最优解决方案。训练的主要目标是确保模型在未见的示例或测试集上表现良好。因此，它涉及调整权重和超参数等参数，直到在提供的示例/数据点/输入的子集（`training\
  \ set`）上得到满意的结果。\n\n训练模型的过程涉及几个步骤：\n\n1. 数据预处理：这涉及将原始数据转换为模型可以使用的形式。`normalization`（归一化）、`scaling`（缩放）、`transformation`（转换）、`imputation`（插值）和\
  \ `encoding`（编码）等技术用于机器学习算法准备数据。统计学和数学帮助我们理解数据的属性和分布，并选择合适的数据处理方法。\n2. 特征工程：这涉及从现有数据中创建可以提高机器学习算法性能的新特征或变量。统计学和数学有助于识别相关特征、衡量其重要性，并应用\
  \ `dimensionality reduction`（降维）、`feature selection`（特征选择）、`feature extraction`（特征提取）和\
  \ `feature construction`（特征构建）等技术。\n3. 模型选择：这涉及为给数据集选择最佳模型。这需要理解数据类型以及最能解决问题的模型类型。需要为给定的问题和数据集选择最好的机器学习算法。统计学和数学有助于根据假设、复杂性、准确性、泛化能力和鲁棒性比较不同的算法。它们还有助于使用\
  \ `cross-validation`（交叉验证）、`grid search`（网格搜索）、`random search`（随机搜索）和 `Bayesian\
  \ optimization`（贝叶斯优化）等方法调整算法的超参数。\n\n\n\n\n\n## 4. 模型拟合\n\n这涉及到优化模型参数以拟合数据。这是通过梯度下降等优化算法完成的，该算法通过调整模型参数来最小化预测误差。`gradient\
  \ descent` 是一种强大的优化技术，用于找到使损失函数最小化的参数最优值。在机器学习（ML）中，损失函数衡量模型与数据的拟合程度，目标是最小化模型预测值与实际结果之间的误差。`gradient\
  \ descent` 的原理是沿着损失函数下降最快的方向迭代更新参数，并使用学习率来控制每次更新的。\n\n`gradient descent` 的挑战之一是选择合适的学习率。如果学习率太小，算法将花费很长时间才能收敛到最优解；如果学习率太大，算法可能会越过最优解并导致发散。`gradient\
  \ descent` 的另一个挑战是它可能会陷入局部最小值，在这些区域损失函数的值比周围的任何点都低，但并不一定是全局最低值。为了避免这个问题，研究人员开发了一些\
  \ `gradient descent` 的变体，它们使用不同的策略来探索损失函数的区域图并跳出局部最小值。以下是几种常见的 `gradient descent`\
  \ 类型：\n\n### 批量梯度下降 (BGD)\n\n这是 `gradient descent` 最简单的形式，它能确保算法收敛到全局最小值，但当数据集很大时，它的速度会非常慢且计算开销巨大。`BGD`\
  \ 是一种迭代优化方法，涉及沿下降最快的方向移动，该方向由函数的负梯度决定。在机器学习中，该函数通常作为损失函数或误差函数，用于量化模型与数据之间的拟合程度。可以通过最小化损失函数从数据中获取模型参数。`BGD`\
  \ 涉及在每次迭代中利用整个数据集来计算梯度。`BGD` 的优势是，只要学习率足够小，就能确保收敛到损失函数的全局最小值。另一个优点是 `BGD` 可以很容易地并行化并分布在许多机器或处理器上。当数据集非常大时，`BGD`\
  \ 的局限性就会显现，会导致性能缓慢和计算成本高。此外，当数据集修改或加入新数据点时，算法必须利用整个数据集重新计算梯度，导致潜在的浪费和效率低下。另一个缺点是\
  \ `BGD` 可能对离群点和噪声数据点敏感，这可能导致性能不佳和解决方案不理想。\n\n### 随机梯度下降 (SGD)\n\n`SGD` 采用了一种改进方法，不再利用整个数据集，而是在每次迭代中随机选择单个数据点（或一小组数据点）并基于此计算梯度。这最小化了计算成本并允许更快的更新。此外，当从随机子集计算梯度时，算法具有固有的变性和随机性。这种特性防止了算法陷入次优局部最小值或鞍点。`SGD`\
  \ 可以适应不同的数据分布并有效处理噪声或冗余数据，性能优于传统的 `gradient descent` 方法。然而，`SGD` 也存在某些局限性和障碍。一个问题是从随机样本得出的梯度可能表现出显著的噪声和不准确，导致参数更新的波动和不稳定。另一个障碍是\
  \ `SGD` 对数据点的排列和选择非常敏感，影响其收敛性和整体效率。研究人员开发了许多 `SGD` 的变体和扩展来解决这些困难并增强其效率和鲁棒性。其中一种技术是\
  \ `momentum`，它将上一次更新的一部分纳入当前更新中，以加速收敛并减轻震荡。另一种技术是自适应学习率，它可以为每个参数动态调整学习率。\n\n###\
  \ 小批量梯度下降\n\n这是一种结合了 `BGD` 和 `SGD` 优点以优化机器学习模型参数的方法。小批量梯度下降将训练数据集划分为较小的子集，称为小批量（mini-batches）。然后在每次迭代中利用每个小批量来计算梯度并修改参数。实施这种技术可以减轻\
  \ `SGD` 中固有的噪声和变异性，同时增强批量梯度下降的速度和有效性。理想的小批量大小取决于几个方面，包括数据分布、模型架构和硬件设置。可以通过为每个参数采用不同的学习率，或利用根据先验梯度动态调整的自适应学习率来增强小批量梯度下降。这些技术的几个示例包括\
  \ `momentum`、`RMSProp`、`Adam` 和 `AdaGrad`。\n\n### 基于动量的梯度下降\n\n这是 `gradient descent`\
  \ 的另一种形式，有助于加速优化过程并防止其陷入局部最小值。它包含一个动量组件，通过缩放因子将先前的参数调整监控并纳入当前更新中。通过这种方法，算法可以在梯度保持稳定且平滑的区域有效积累速度，而在梯度频繁改变方向的区域减速。这有助于算法更快地跳出低梯度区域或局部最小值，并减轻最优点周围的震荡。基于动量的梯度下降是机器学习和深度学习中常用的优化方法，由于其能够提高神经网络和其他复杂模型的性能和效率，而被广泛应用。\n\
  \n\n\n\n\n## 自适应梯度下降\n\n这是一类算法，它们根据每个参数的历史梯度自适应地调整每个参数的学习率。这意味着，更新大且频繁的参数将具有较低的学习率，而更新小且不频繁的参数将具有较高的学习率。通过这种方式，算法可以避免越过最优值或陷入局部最小值。一些示例包括\
  \ `AdaGrad`、`Adadelta`、`RMSProp` 和 `Adam`。\n\n`AdaGrad` 是一种学习率缩放算法，与梯度平方和的平方根成反比。这意味着学习率随着梯度的时间累积而减小。这对于稀疏特征是有利的，但也可能导致学习率变得过小并停止学习过程。\n\
  \n`Adadelta` 是 `AdaGrad` 的扩展，解决了学习率递减的问题。它没有使用累积和，而是采用梯度平方的移动平均值。此外，它还提供了一个衰减率参数，以调节平均值衰减的速度。通过这种方式，算法可以适应变化的梯度并保持更稳健的学习率。\n\
  \n`RMSProp` 是另一个 `AdaGrad` 扩展，它也使用了梯度平方的移动平均值，但公式不同。平均值的平方根分割了学习率，并包含一个动量参数，将上一次更新的百分比整合到当前更新中。通过这种方法，算法可以加速收敛过程并克服优化过程中的停滞点。\n\
  \n`Adam` 是一种流行的算法，结合了 `Adadelta` 和 `RMSProp` 的思想。它同时使用梯度和梯度平方的移动平均，并引入了两个名为 `beta1`\
  \ 和 `beta2` 的参数来控制这些平均值的衰减率。此外，它执行偏置校正以考虑这些平均值的初始值。通过这种方式，算法可以在极少超参数调优下实现快速稳定的收敛。\n\
  \n## 5. 模型评估\n\n这涉及评估模型在未见数据上的表现。这意味着要使用 `accuracy`（准确率）、`precision`（精确率）、`recall`（召回率）、`F1-score`、`ROC\
  \ curve`、`AUC`、`confusion matrix`（混合矩阵）、`MSE`（均方误差）、`MAE`（平均绝对误差）、`R2-score` 等指标来评估机器学习模型的质量和有效性。统计学和数学有助于解释这些指标，测试结果的显著性，并诊断过拟合、欠拟合、偏差和方差等潜在问题。\n\
  \n## 6. 模型解释\n\n这涉及解释机器学习模型是如何工作的，以及它们为什么做出某些预测或决策。统计学和数学有助于理解算法的逻辑和机制，并使用 `feature\
  \ importance`（特征重要性）、`partial dependence plots`（部分依赖图）、`SHAP values` 和 `LIME` 等方法可视化或量化它们的输出。\n\
  \n## 7. 测试\n\n测试指的是评估机器学习算法在未见数据点或输入上的表现，与其训练时（估计）的性能相比。这种评估有助于判断给定算法得出的预测是否与人类对相似输入的预测结果相符（验证）。\n\
  \n测试通常包括将可用输入分为两个子集：一个用于训练，另一个用于测试；这有助于确保结果无偏见，因为两个集合都包含来自提供的数据集的随机分布示例（交叉验证）。测试阶段还允许我们衡量\
  \ `accuracy rate`（准确率得分）、`recall score`（召回率得分）和 `precision score`（精确率得分）等性能指标，然后可以将它们与基准值或早期迭代中实现的值进行比较，并在需要时调整参数以进一步改进。此外，它指示了与我们解决给定问题的方法相关的过拟合/欠拟合问题。此外，某些机器学习算法利用交叉验证技术，在“训练”与“测试”数据集之间的不同组合/划分中进行多次测试；这进一步有助于确保结果无偏见。\n\
  \n## 1.9 机器学习与自动化\n\n机器学习和自动化是两个相关但不同的概念，在人工智能的背景下经常被互换使用。然而，它们具有不同的含义和影响。\n\n机器学习是计算机科学的一个分支，涉及创建可以从数据中学习并随时间推移提高性能的系统或算法。它可以用于\
  \ `classification`（分类）、`regression`（回归）、`clustering`（聚类）、`recommendation`（推荐）、自然语言处理等任务。另一方面，自动化是一个更广泛的术语，指的是在没有人工干预的情况下使用技术来控制或运行过程。它可以应用于制造、交通和医疗保健等多个领域。\n\
  \n机器学习与自动化之间的主要区别在于，机器学习涉及从数据中学习，而自动化涉及执行预定义的规则或指令。机器学习可以使自动化适应变化的条件或情况，而自动化可以使机器学习扩展或加速其运行。机器学习和自动化还可以以各种方式互补。例如，机器学习可以用于优化或改进自动化系统的性能，而自动化可以用于为机器学习收集或标记数据。\n\
  \n机器学习和自动化都是重要且强大的技术具有具有各个行业和领域的潜力。然而，它们也带来了需要解决的挑战和限制。例如，机器学习可能需要大量的数据或计算资源，而自动化可能需要仔细的设计或监管。此外，机器学习和自动化可能会产生需要考虑的伦理或社会影响，例如对人类工作、隐私、安全和问责的影响。因此，理解机器学习和自动化之间的异同并负责任地使用它们是至关重要的。\n\
  \n\n\n\n\n## 1.11 与机器学习相关的某些术语\n\n让我们用例子来解释这些术语。购买优质的秋葵手指时，应该注意以下几点：\n\n• 颜色应该是亮绿色，没有任何棕色或黑色斑。\n\
  • 质地应该是坚实且脆的，而不是软的或糊烂的。\n• 尺寸应该是中等的，不要太小或太大。\n• 形状应该是直的且细的，而不是弯曲或扭曲。\n\n这些因素是 `domain\
  \ set`（域）的示例，它是特定属性或特征的可能值的集合。`domain set` 定义了属性可以取值的数值范围和类型。\n\n`label`（标签）代表对象或观测值类别或分类的值。例如，在分类问题中，`label`\
  \ 可以是是或否、正或负、垃圾邮件或非垃圾邮件等。`label` 通常是我们想要从数据中预测或学习的输出或目标变量。\n\n`domain point`（域点）是属性或特征的具体值或实例。例如，如果属性是\
  \ `color`（颜色），那么 `domain point` 可以是 `green`（绿色）、`red`（红色）、`blue`（蓝色）等。`domain point`\
  \ 通常是我们用于预测或学习 `label` 的输入或独立变量。\n\n`mapping function`（映射函数）是一个将 `domain points`\
  \ 与 `labels` 联系起来的数学函数。例如，如果我们有一个映射函数 `f(x) = y`，那么 `x` 就是 `domain point`，`y` 就是\
  \ `label`。`mapping function` 描述了输入如何影响输出，或者特征如何影响目标。\n\n`learner`（学习器）是从数据中学习 `mapping\
  \ function` 的算法或模型。例如，`learner` 可以是决策树、神经网络、逻辑回归等。`learner` 试图找到最拟合数据并使误差最小的 `mapping\
  \ function`。\n\n`predictor`（预测器）是一个使用学习到的 `mapping function` 来预测新 `domain point`\
  \ 的 `label` 的函数。例如，如果我们有一个预测器 `p(x) = f(x)`，那么 `p(x)` 就是 `predictor`，`f(x)` 就是学习到的\
  \ `mapping function`。`predictor` 将 `mapping function` 应用于新输入并输出预测的 `label`。\n\n\
  ## 1.12 机器学习的类型\n\n机器学习中使用的算法和技术用于构建从数据中学习并做出预测或决策的模型。以下是机器学习的类型：监督学习、无监督学习、强化学习、迁移学习和元学习。\n\
  \n![](img/f1-5.jpg)\n\n[图 1.5] 机器学习的类型\n\n### 1.12.1 监督学习\n\n监督学习是指使用良好的“标记”训练数据对机器进行训练，并它们根据这些数据预测输出。“标记数据”意味着某些已经标记了正确输出的输入数据。尽管这种方法需要准确的数据标记，但在适当应用时，监督学习非常有吸引力并能产生极的结果。监督者指导机器使用训练数据正确地预测输出。\n\
  \n训练数据集为算法提供了问题所需的标记参数，并与最终数据集共享许多特征。它为算法提供了有关问题、解决方案以及要处理的各种数据点的信息。为了建立数据变量之间的因果关系，机器学习算法随后寻找输入参数之间的关系。例如，监督学习算法的目标是找到一个映射函数，将输入变量\
  \ (`x`) 映射到输出变量 (`y`)。它所应用的概念类似于学生在老师的监督下学习。\n\n当训练和处理完成后，我们通过提供样本数据来测试模型，看它是否能准确预测输出。系统使用标记数据构建模型以理解数据集并学习每条数据。在现实世界中，监督学习也可以用于风险评估、图像分类、欺诈检测和垃圾邮件过滤。当我们在\
  \ Amazon Prime Video 上播放电影或剧集时，我们也在告知机器学习算法根据我们的偏好寻找类似的节目。\n\n监督学习可以进一步分为两类算法：回归和分类。分类和回归是用于解决广泛现实问题的两种基础机器学习问题类型。从本质上说，分类是一种目标是预测类别结果（分类）的问题类型，而回归是一种目标是预测连续结果的问题类型。\n\
  \n例如，如果一个人担心他们的儿子是否能找到工作，这是一个分类问题。结果是二元的：找到工作或不找到。同样，如果一个人想知道他们的儿子多大时会结婚，这是一个回归问题。输出将是一个数值。另一个分类问题的例子是，一个人想知道新娘来自哪个地区。答案将是一个城市或区域。\n\
  \n![](img/f1-6.jpg)\n\n[图 1.6] 监督学习的类型\n\n#### 1.12.1.1 回归\n\n如果输入变量和输出变量之间存在关系，则使用回归算法。它用于预测连续变量，例如天气预报、市场趋势和股票价值。属于监督学习的一些流行回归算法包括线性回归、回归树、贝叶斯线性回归和多项式回归。\n\
  \n##### 线性回归\n\n在这里，数学方程描述了两个或多个变量之间的关系。例如，研究了“因变量”和额外变量（“自变量”）。回归使用自变量对目标进行建模。这些模型根据它们使用的自变量数量以及它们考虑的关系类型而异。\n\
  \n考虑一种情况，你希望根据工作年限和教育背景预测你的月薪。月薪可以是线性回归中的因变量，而工作年限和教育背景可以被视为自变量。\n\n为了对落在数据集值范围内的新观测进行预测，我们需要识别最能捕捉数据的数学方程。普通最小二法\
  \ (`OLS`) 是最流行的线性回归类型，它确定一条每个点与其估计线上对应值之间的平方距离和最小的直线。这种方法为我们模型的未知参数提供了一个估计，我们可以使用外推技术对数据集范围之外的新数据点进行此预测。\n\
  \n##### 回归树\n\n使用回归树预测连续目标变量。根据输入特征的值，它递归地将数据划分为不同的分支，并使用每个叶节点中值的平均值或中位数来预测目标变量。决策树或回归树中的每个内部节点代表一个特征，树形结构中的每个叶节点代表一个预测值或类别。\n\
  \n\n\n\n\n回归树的根（第一个节点）包含了所有的训练数据。然后使用目标变量的平均值或中位数等标准将数据集分为两个部分，创建右、左子节点。\n\n###\
  \ 贝叶斯回归\n当数据集数据量过少或分布不均时，贝叶斯回归非常有帮助。与传统的回归技术（其输出仅源自单一属性值）不同，贝叶斯回归模型的输出源自一个概率分布。结果\
  \ `y` 由正态分布产生（其中均值和方差经过归一化）。贝叶斯线性回归旨在识别模型参数的“后验”分布，而不是参数本身。因此，假设模型参数除输出 `y` 之外还遵循某种分布。\n\
  \n### 多项式回归\n该模型将因变量 (`y`) 与自变量 (`x`) 之间的关系建模为 n 次多项式。与线性回归一样，多项式回归利用变量 `x` 和 `y`\
  \ 之间的关系寻找数据点的最优路径。例如，它经常用于预测 COVID-19 等传染疾病的传播速度。存在多种多项式回归，因为多项式方程的次数没有上限，可以达到第\
  \ n 次。例如，多项式方程的二次项通常表示为二次方程。如所述，该次数可以达到第 n 次，你可以创建任意数量的方程。\n\n### 1.12.1.2 分类\n\n\
  第二类监督学习方法使用分类模型从观察到的类别值中得出结论。它利用输入训练数据预测新数据落入预定义类别之一的概率。将电子邮件过滤为“垃圾邮件”或“非垃圾邮件”是分类最用途之一。\n\
  \n在机器学习（ML）中，有两种不同的分类类型。当一个问题只有两个可能的类别时，被称为二分类类别（例如“猫或狗”、“是或否”）。如果有两个以上的潜在类别，则该问题是一个多分类分类器。\n\
  \n一些分类算法包括 K 近邻、决策树、随机森林、支持向量机 (`SVM`) 和线性分类器。\n\n##### K 近邻 (KNN)\n`KNN` 被归类为懒惰学习器，因为它不创建任何预测模型。相反，它存储所有训练数据，并根据新数据点与存储点的相似性对新数据点进行预测。这种技术将数据集中最近的对象分组，并识别最常见或平均的特征。它根据距离它最近的数据点属于哪个组，来确定该数据点加入任何组的概率。\n\
  \n##### 决策树\n`decision tree` 最适用于解决分类问题；也可以用于处理回归难题。它每次将数据点分为两个相似组，从“树干”开始，通过“分支”，最后到“叶子”，直到组之间彼此密切。这种方法类似于流程图。树结构分类器中的内部节点代表数据集的特征，分支代表决策过程，每个叶子节点代表分类结果。它们不需要特征缩放，且易于理解。此外，与其他算法相比，对数据清洗的要求较低。它还剔除了不重要的特征。\n\
  \n##### 随机森林\n`random forest` 是从随机选择的数据子集中抽取的许多棵决策树的集合，它可能比单个决策树更准确地预测结果。\n\n#####\
  \ 支持向量机 (SVM)\n这种著名的机器学习算法经常用于分类和回归任务。具体而言，它被用于解决分类问题。在 N 维空间中寻找可以将数据点划类的最佳决策边界是\
  \ `SVM` 的主要目标，最佳决策边界被称为超平面。支持向量是 `SVM` 选择用于确定超平面的极端向量。`SVMs` 使用超平面根据共同特征对对象进行分组，并为\
  \ N 维空间中的每个对象生成坐标。\n\n##### 线性分类器\n这些分类器根据属性线性组合的值对对象进行分类。对象的特征也被称为特征值，它们通常以特征向量的形式显示给机器。此类分类器实现了与非线性分类器相当的准确率，同时训练和使用所需时间更少，成为解决文档分类等现实问题、更广泛地解决具有许多变量（特征）问题的极佳解决方案。\n\
  \n### 1.12.2 无监督学习\n\n顾顾名，无监督学习没有数据标签，是在没有任何监督的情况下，从未标记数据中学习模式的过程。\n\n例如，假设我们有一个商店销售交易数据集，想要找出哪些物品比其他物品卖得更频繁。我们不需要告诉计算机物品是什么。只需将数据输入到无监督学习算法（如聚类或关联规则挖掘），让计算机发现物品之间的模式和关系。无监督学习算法的输出可以帮助我们理解客户行为和偏好，并优化商店的库存和营销策略。\n\
  \n给机器的是一组未标记、未分类或分类的数据，算法需要在没有任何监督的情况下对这些数据进行操作。无监督学习的目标是找到输入数据中的结构和模式，根据相似性对数据进行分组，并以压缩格式表示该数据集。与监督学习相比，无监督机器学习服务并不流行，因为它们在日常生活中的应用较少。无监督学习创建隐藏结构。数据点之间的关系由算法随机或抽象地感知，完全不需要人类的输入。无监督学习算法可以适应数据，而不是一个特定的、定义的且固定的问题陈述。\n\
  \n假设给无监督学习算法一个包含不同类型牛和奶图像的输入数据集。该算法未在给定数据集上进行训练，这意味着它对数据集的特征一无所知。无监督学习算法的任务是独立识别图像特征。无监督学习算法通过根据图像之间的相似性将图像数据集聚类来完成此任务。\n\
  \n在无监督学习中，我们没有预定的结果。机器试图从海量数据中寻找有用的见解。它可以进一步分为两类：聚类和关联（图 1.7）。异常检测和降维也是其他类型。我们将在第\
  \ 6 章详细讨论。\n\n![](img/f1-7.jpg)\n\n图 1.7 无监督学习算法类型\n\n#### 1.12.2.1 聚类\n\n\n\n\n\
  \n将对象分组到不同的类中的过程，使得相似性最强的对象聚集在一起，并且与其他组的对象保持极少或没有相似性，这被称为聚类（Clustering）。类是指位置或放置得相互接近的关联项目或个体的集合。由于类中的每个点通常在这些特征上表现出相似性，机器学习（ML）可用于识别特征并区分这些类。聚类是许多解决各行业数据问题的机器学习应用的基础。在理想的世界里，机器能够根据物理特征识别各种对象并区分它们。因此，聚类算法可以广泛应用于图像分割、统计数据分析、医学科学中的疾病分类以及营销研究中的客户分类等任务。常用的聚类算法有\
  \ `K-means`、`MeanShift clustering` 和 `DBSCAN`。\n\n##### K-Means 聚类\n这是一种流行的数据探索和分析无监督机器学习技术。它用于将数据点分组或聚类为不同的类别。其目的是根据特定特征将数据集划分为有子组。算法检查每个数据点并根据属性相似性将其分配到若干组中的一组。\n\
  \n`K-means` 算法可以分析包含离散、连续、数值实体的数据。然而，该算法存在缺陷，包括在处理分类数据、离群值和非线性数据时的困难。此外，如果我们能预设想要多少个数据类，将会有帮助。最后，`K-means`\
  \ 最适用于较小的数据集，因为它会对所有数据点进行迭代。结果是如果数据集包含许多数据点，对它们的分类将花费更长的时间。\n\n考虑以下示例。假设一家公司生产运动鞋，并想将其客户分为两个不同的组：男性和女性。我们将从收集客户信息（如年龄、性别、购物偏好和消费模式等）开始，然后使用\
  \ `K-means clustering` 来确定不同的标准，决定谁应该去哪一组！\n\n例如，假设数据表明 18 岁到 25 岁之间的消费者通常在运动鞋上花费更多。在这种情况下，这一特定年龄组可能被归为一类，其质心代表较高的支出。相比之下，30\
  \ 岁或以上可能有不同购买模式的客户将形成另一个独立的类，其特征是代表鞋类支出减少的质心。这种区分使该机构能够通过考虑年龄来理解并预测客户行为。\n\n#####\
  \ MeanShift 聚类\n与 `K-means` 算法不同，`MeanShift` 算法不需要我们指定类的数量。如果我们需要对数据中的模式进行澄清，算法会自动确定类的数量，这是相对于\
  \ `K-means` 的显著优势。密集数据点区域使用滑动窗口、基于质心的算法来定位中心组/类点。所有中心点候选者都是滑动窗口点的平均值。然后通过后处理对这些窗口进行排序，以删除重复项并给出最终的组中心点。图像分割任务是\
  \ `MeanShift clustering` 最频繁使用的地方。核密度估计是 `MeanShift` 算法的基础。\n\n`MeanShift` 算法迭代地将每个数据点分配给最近的类质心，该质心是随机初始化的。然后，每个点在空间中根据点最多的地方（即模式）进行迭代移动。这与\
  \ `K-means` 算法相似。由于平均值是自动发现的，这种方法克服了组选择和类中心选择的问题。由于直观地收敛到数据点最多的区域，聚类结果也表现出数据感性。\n\
  \n##### DBSCAN\n基于密度的应用空间聚类是一种根据数据点密度识别聚类的显著算法。`DBSCAN` 不需要预先指定类的数量。它适用于任意形状。\n\n\
  ##### 关联\n关联是第二种无监督学习。关联规则挖掘基于共现性发现关联。它确定了在事务数据中频繁出现的项目集。它被用于购物篮分析和网络挖掘。关联规则使得营销策略更具实用性；例如，购买\
  \ `X items`（例如刷子）的人也倾向于购买 `Y items`（例如牙膏）。\n\n购物篮分析通过识别经常购买的项目来检查消费者购买模式。零售商通过分析这些内容创建营销策略。网络挖掘具有支持不同数据类型的独特能力。网络的许多方面产生了各种挖掘方法，包括网页、网页间的链接以及可以跟踪用户活动的网络服务器日志。关联规则学习可以分为三种算法：`Apriori`、`ECLAT`\
  \ 和 `FP Growth`。\n\n###### Apriori 算法\n`Apriori` 算法使用关系数据库学习关联规则并挖掘频繁项目集。它有助于识别组合购买的产品，主要用于购物篮分析。\n\
  \n该算法使用广度优先搜索和哈希树高效确定项目集。其 `join`（连接）和 `prune`（剪枝）步骤压缩了搜索空间。它建立了两个对象之间连接的强度或弱点。从大型数据集中寻找频繁项目集涉及一个迭代过程。经常使用的项目集是那些支持度高于阈值或用户指定的最小支持度的。这意味着如果\
  \ `A` 和 `B` 共同构成频繁项目集，那么 `A` 和 `B`单独也应该是频繁项目集。\n\n这是关联学习算法中最简单、最易理解的算法。规则直观且易于与终端用户交流。然而，该算法的缺点是在处理大型数据集时，可能无法更快、更高效。它使用大量资源多次扫描数据库，生成许多候选集并检查每一个集。\n\
  \n###### ECLAT 算法\n`ECLAT` 代表等价类转换。它使用深度优先搜索技术在事务数据库中寻找频繁项目集。它的运行比 `Apriori` 算法快。`ECLAT`\
  \ 算法只能应用于垂直格式的数据集。由于大多数数据集都是水平格式，为了应用 `ECLAT` 算法，我们必须首先将其转换为垂直格式。因此，`ECLAT` 算法在中小型数据集上运行更好。由于使用了深度优先搜索方法，`ECLAT`\
  \ 算法与 `Apriori` 相比内存需求较低。`ECLAT` 算法的结果是带有支持度的频繁项目集。\n\n\n\n\n\n##### FP Growth 算法\n\
  \n`FP`（频繁模式）增长算法是 Apriori 算法的改进版本。该算法不再生成候选集，而是通过寻找频繁项集来提高性能。它采用了分治的策略。\n\n### 1.12.3\
  \ 强化学习\n\n机器学习（ML）的一个显著缺点是训练模型需要海量的数据。模型越复杂，所需的数据可能越多。所需的数据可能不存在，或者我们无法获取正确的数据。此外，收集的数据可能需要更加可靠，它可能包含错误值或缺失值，或者需要更新。从动作的小子集中学习无法帮助扩展适用于特定问题的庞大解决方案。机器必须学会独立执行动作，而不仅仅向人类学习。这些问题通过强化学习（RL）得到了解决。\n\
  \n强化学习是机器学习的一个分支，通过一系列决策来训练模型返回问题的优化解决方案。强化学习与监督学习的区别在于，后者的训练数据带有答案，因此模型根据正确答案本身进行训练。相比之下，强化学习中没有答案，而是由强化智能体决定做什么来执行给定任务。在没有数据集的情况下，它必须从经验中学习。强化学习解决特定类型的问题，即决策是顺序的且目标是长期的，例如游戏、、机器人等。\n\
  \n例如，你无法直接告诉狗该做什么，因为它无法听懂人类语言。因此，我们采取了不同的方法。例如，如果狗以符合要求的方式表现，我们就用食物奖励它。现在，每当狗遇到相同的情境时，它都会更热切地执行类似的动作，期待更大的奖励（食物）。这类似于发现狗从满意的体验中学习“该做什么”。同时，当面对负面体验时，狗也学会了“不该做什么”。在这种情况下，狗是暴露在环境（家）中的智能体。例如，当你的狗坐下时，你用特定的单词要求它去散步。智能体通过一个动作从一个“状态”移动到另一个“状态”。例如，你的狗从躺下转变为走动。\n\
  \n智能体的响应是一个动作，而策略（policy）是在给定状态下选择动作的方法，以获得更好的结果。在转换之后，它们可能会受到奖励或惩罚。强化有两种类型：正向强化是指由于外部事件导致行为的强度和频率增加；换句话说，它以良好的方式影响行为。负向强化是指由于不利条件的停止或避免而加强了行为。\n\
  \n[RL] 系统的主要元素有：\n- 智能体或学习者（在这种情况下是狗）\n- 智能体交互的环境（家）\n- 智能体遵循以采取动作的策略\n- 智能体在采取动作时观察到的奖励信号（食物）\n\
  \n智能体通过试错获得知识，并利用其经验改进性能。智能体不断重复这三件事——采取动作、改变状态或保持状态不变以及获取反馈——这有助于它学习和探索周围环境。\n\n\
  在强化学习中，必须指导智能体了解环境和适当的行动方案。然后智能体执行后续动作，并根据上一个动作的反馈修改其状态。结果，智能体可能会收到延迟奖励。为了最大化正奖励，智能体必须探索随机环境。在强化学习中，我们根据要解决的问题描述向受控环境中引入模型，而不是使用实际数据来解决。模型与该环境交互并独立地提出解决方案，不受人类干预。为了引导它朝着正确的方向发展，如果它执行了接近目标的动作，我们就给予它正奖励；如果它远离目标，则给予它负奖励。在机器学习中实现强化学习有三种方法：\n\
  \n- **基于价值的方法（Value-based approach）**：寻找最佳价值函数，或在任何策略下任何给定状态下可能的最大价值，是基于价值的方法的目标。因此，智能体会预期策略所涵盖的任何状态的长期回报。\n\
  - **基于策略的方法（Policy-based approach）**：在不使用价值函数的情况下，基于策略的方法识别出获得重大潜在奖励的最佳行动方案。在这种方法中，智能体尝试实施策略，使每个动作都有助于未来奖励的最大化。两种策略构成了基于策略的方法主体：确定性策略（任何状态的策略产生相同的动作）和随机策略（该策略中产生的动作由概率决定）。\n\
  - **基于模型的方法（Model-based approach）**：智能体通过与环境虚拟模型交互来学习环境。这种方法缺乏特定的解决方案或算法，因为每个环境的模型表示都是唯一的。\n\
  \n尽管监督学习和强化学习都使用输入和输出之间的映射，但强化学习使用奖励和惩罚作为优坏行为的信号，而监督学习则是为智能体提供执行任务正确行动方案的反馈。强化学习的目标与无监督学习不同。在无监督学习中，目标是识别数据点之间的相似性和差异。在强化学习中，目标是识别适当的动作模型，以最大化智能体的整体累积奖励。\n\
  \n### 1.12.4 迁移学习\n\n监督机器学习模型通过标记数据开发和训练，以执行特定任务。算法接收映射后的输入和期望输出。随后模型可以使用识别出的模式和趋势来分析新数据。\n\
  \n这种方式创建的模型在与训练数据相同的环境中使用时将以高准确性解决问题。然而，如果现实应用中的条件或环境超出训练数据，其准确性将大幅下降。即使任务相似，可能也需要基于新训练数据的新模型。人类非常擅长任务之间的知识迁移。这意味着每当我们遇到新问题或任务时，我们都能识别它并应用来自以前学习经验的相关知识。这使得我们的工作变得简单，并能快速完成。例如，想象被要求学习你并不熟悉的\
  \ `Python` 语言，尽管你已经如何用 `Java` 写程序。在这种情况下，`Java` 语言的知识将用于管理 `Python` 语言的学习。这会让事情比初学者来说简单得多。这种观点在现实生活中是有益的，因为它们帮助我们变得更完美并增加经验。\n\
  \n相同的方法导致了机器学习中“迁移学习”一词的产生。在这里，从用于一个任务的模型中获得的信息可以再次作为另一个任务的基础。对于与图像或自然语言处理（NLP）相关的任务，从头开始训练模型是不常见的，因为迁移学习是广泛应用的。迁移学习使用模型中已经训练的相关部分来解决不同但相关的问题。这是模型运行所需的基础知识。程序员将需要确定哪些模型组件需要重新训练，哪些组件与新任务相关。此外，由于模型已经获取了可能对第二个任务有用的通用特征，这有助于防止过拟合。\n\
  \n\n\n\n迁移学习在任何学习中都是至关重要的。人类只被教了某些任务或问题以便在这些领域取得成功。我们所有人都会遇到未接触过的情况，但仍然能够以一种即兴的方式解决问题。从许多经验中学习并将“知识”导出到新环境的能力，正是迁移学习的核心所在。\n\
  \n迁移学习在结合一个能够识别图像集中特定主题的机器学习模型时最有可能成功。模型中处理主题识别的部分可以被保留。但用于突出显示特定主题以进行分类的算法组件则需要重新训练。在这种情况下，没有必要从头开始构建和重新训练\
  \ ML 算法。研究人员和数据科学家更倾向于从预训练模型开始，这种模型已经知道如何分类物体，并学习了图像中边缘和形状等通用特征。\n\n源任务（source task）是将知识迁移到目标任务的任务。目标任务（target\
  \ task）是指由于从源任务迁移知识而产生改进学习效果的任务。在迁移学习过程中，从源任务利用的知识和快速进展被用于改进到新目标任务的学习和开发。然而，如果迁移方法降低了新目标任务的性能，则被称为负迁移（negative\
  \ transfer）。在使用迁移学习方法时，面临的挑战之一是在相关任务之间提供并确保正迁移，同时避免负迁移。为了理解需要迁移学习知识的哪些部分，我们需要弄清楚哪些部分的知识最能反映源和目标。我们的目标是提高目标任务的性能，而不是让它变差。\n\
  \n## 使用迁移学习的原因\n\n主要优点是不需要大量数据、节省训练时间以及提高神经网络的性能（在大多数情况下）。迁移学习可以应用于多个行业。由于数据可用性不足，获取数据始终是一个障碍。然而，使用足够的数据可以获得高性能。\n\
  \n当偶尔无法获取大量数据但又需要从头开始训练神经网络时，迁移学习会很有帮助。因为模型已经过训练，迁移学习允许使用较少的训练数据构建健壮的 ML 模型。这在 NLP\
  \ 中特别有用，因为产生大量的标记数据集需要专家知识。此外，由于减少了训练时间，我们使用完成相关任务时发现的模式开始学习过程，而不是从头开始。如果两个模型是为了执行可比的任务而创建的，它们就可以共享通用知识。这种开发\
  \ ML 模型的方法需要更少的资源和更少的标记数据来训练新模型。\n\n## 迁移学习的缺点\n\n只有当信息“合适”时才能进行迁移。在此语境下定义什么是“合适”需要付出努力，并且通常需要实验。例如，如果你不认为一个骑着玩具飞机飞翔的小孩可以处理真实的飞机，这将是有益的。同样的规则适用于迁移学习：尽管难以衡量，但迁移学习有一个最高水平。它只是适用于某些问题情况的解决方案。例如，如果两个任务差异巨大，或者两个任务之间的数据分布非常不同，预训练模型可能不适用于第二个任务。如果模型在第二个任务上微调过度，迁移学习可能会导致过拟合，因为它可能会学习到无法良好泛化到新数据的任务特有特征。最后，预训练模型和微调过程在计算上可能是昂贵的，并且需要专门的硬件。\n\
  \n## 冻结与可训练层\n\n我们现在如何决定训练哪些层以及冻结哪些层呢？简单的解决方案是更频繁地冻结层，当你有更多想要从预训练模型中继承的特征时。例如，如果预训练模型可以识别某些蔬菜品种，我们必须识别额外的蔬菜品种。在这种情况下，具有新物种的新数据集与已训练模型模型有许多共同特征。因此，我们冻结更多层，以便在新模型中使用它的大部分知识。\n\
  \n考虑另一种场景，预训练模型可以识别图像中的汽车，而我们希望应用该知识来识别人类。在这种情况下，由于数据集完全不同，冻结许多层并不是一个好主意，因为这将产生像汽车、轮胎类型等对新数据集无用的特征。结果，我们使用从基础网络复制的低层特征来训练整个网络。\n\
  \n让我们考虑目标任务的大小与基础网络不同的所有场景：\n\n- **目标任务较小且与源任务相似**：由于数据集较小，我们可以微调网络。然而，这可能会导致过拟合。目标任务的类别数量可能会发生变化。因此，我们添加一个满足新类别数量的全连接层。现在我们冻结模型的其余部分，只训练最新的层。\n\
  - **目标任务较大且与源任务相似**：在这种情况下，由于数据集很大，没有过拟合的可能性。在这里，移除了先的全连接层，并添加了具有适当类别数量的新全连接层。我们现在使用新的数据集训练整个模型。这确保了在处理大型数据集时调整模型架构。\n\
  - **目标任务较小且与源任务不同**：预训练模型的高层特征无法使用，因为目标数据集不同。在这种情况下，从预训练模型的末尾移除大部分层，然后为新数据集添加具有适当类别数量的新全连接层。通过这种方式，我们可以利用之前训练模型的低层特征来训练剩余层以适应新数据集。有时，在末尾添加新层之前训练整个网络是有益的。\n\
  \n## 1.12.5 元学习\n\n“元（meta）”一词通常指的是综合或抽象的东西。例如，元宇宙是一个虚拟世界或世界中的世界；元数据是关于其他数据的数据；以此类推。\n\
  \n良好的机器学习模型通常需要大量样本进行训练。而人类学习新概念和技能的速度要快得多。即使是孩子只见过几次猫和鸟，他们也能区分它们。会骑自行车的人可能很快就能学会骑摩托车，几乎不需要演示。因此，我们是否可以设计出具有相似属性的机器学习模型，即通过少量示例快速学习新概念和技能？这本质上就是元学习要解决的问题。\n\
  \n\n\n\n## 元学习\n\n在计算机科学中，元学习（meta learning），被称为“学习学习”，是 `ML` 的子集，它从其他 `ML` 算法的输出中学习。在\
  \ `ML` 中，我们经常需要找到哪些算法最适用于我们的数据这些算法通过从历史数据中学习来生成模型，然后这些模型可以被用于预测我们任务的结果。元学习算法不直接使用历史数据，而是从\
  \ `ML` 模型的输出中学习。元学习算法将学习算法的元数据作为输入。然后它们进行预测并提供关于这些学习算法性能的信息作为输出。例如，`ML` 模型将图像作为输入，如果目标是分类图像，则会预测类别。另一方面，元学习模型将这些\
  \ `ML` 模型的预测作为输入，并基于这些预测预测图像类别。\n\n从这个意义上说，元学习发生在机器学习的上一层。它帮助研究人员理解哪些算法能从数据集中生成最佳/更好的预测。学习模型的性能取决于其训练数据集、算法和参数。为了找到性能最好的算法和算法参数，需要许多实验。元学习方法帮助他们发现并优化实验次数。结果是在更短的时间内获得更好的预测。学习模型中图像的元数据可以包括它的尺寸、分辨率、风格、创建日期和所有者。\n\
  \n我们期望一个优秀的元学习模型能够很好地适应或泛化到训练期间从未遇到过的新任务和环境。适应过程本质上是一个微型学习阶段，发生在测试期间，但对新任务配置的接触有限。最终，适应后的模型可以完成新任务。例如，一个在非狗图像上训练的分类器在看到几张狗的照片后，可以判断给定图像是否包含狗。一个游戏机器人（针对\
  \ `game 1`）可以快速学会一个新游戏（称为 `game 2`）。\n\n## 1.13 被动学习与主动学习\n\n被动学习是机器学习的一种，它不使用来自环境的反馈来调整学习者的行为。发送垃圾邮件是被动学习的一个例子，垃圾发送者在不知道信息是否有效的情况下发送信息。垃圾发送者依赖固定的规则或假设来生成信息，例如使用某些关键词或短语。归纳偏置（Inductive\
  \ bias）是学习者从有限数据集进行预测或泛化时所使用的假设集。它对于学习是必要的，因为如果没有它，学习者将无法与数据一致的无限可能假设中进行选择。垃圾发送者用于生成信息的规则就是归纳偏置的一个例子。然而，这种归纳偏置可能不是最优的，因为它可能无法反映真实的偏好。主动学习（Active\
  \ learning）是一种机器学习技术，旨在减少训练所需的标记数据。它通过从未标记数据中选择信息量丰富的示例来实现。异常检测（Anomaly detection）是一项机器学习任务，涉及识别偏离正常或预期的实例。异常可以指示问题，可以应用于网络安全、医疗保健、金融等领域。主动学习和异常检测可以结合起来创建一个强大稳健的系统，以检测复杂环境中的异常。例如，主动学习系统可以监控网络流量并在遇到可疑或异常模式时向管理员提供反馈。通过这种方式系统可以随时间更新其性能。\n\
  \n## 1.14 在线学习与批量学习\n\n在线学习和批量学习是两种训练机器学习模型的不同方法。在线学习，也称为增量学习或在线学习，是一种模型在数据数据到达时从中学习的方法，而无需重新训练。批量学习，也称为离线学习或批量学习，是一种模型从固定数据集学习，然后将学到的知识应用于新数据的方法。在线学习的主要优势是它可以适应变化的数据和环境，并高效地处理流式数据。在线学习适用于推荐系统、垃圾过滤、欺诈检测和情感分析等应用，这些数据是动态变化的。在线学习的主要挑战是它需要仔细细调学习率和遗忘因子，这些因素决定了模型更新多少参数以及忘记多少知识。批量学习的主要优势是它可以利用整个数据集优化模型参数，并获得更高的准确性。批量学习适用于图像识别、自然语言处理和语音识别等应用，这些数据是相对静态且高质量的。批量学习的主要挑战是它的计算成本高且耗时，并且可能无法处理新数据。\n\
  \n## 1.15 机器学习模型与算法的区别\n\n学者之间常见的困惑领域之一是 `ML` 模型和算法之间的区别。这是因为在 `ML` 和数据科学的各种情况下，这些术语是互用的。\n\
  \n算法可以被认为是告诉计算机如何执行任务的指令。算法可以使用任何编程语言编写，但它们通常使用 `Python` 或 `R` 等高级语言来定义输入和输出。算法定义了处理数据所需的步骤，包括预处理（清洗和归一化）、特征提取（识别价值特征）、参数估计（确定参数的最佳值）、训练（构建模型）和评估（测试准确性）。算法通过提供快速处理大量数据的有效手段，为大多数\
  \ `ML` 应用奠基础。\n\n另一方面，模型是数据的表示，可用于 `ML` 中的预测或分类任务。模型是通过将算法应用于包含已知结果或类别的输入集来生成的；然后这些训练好的模型可以被应用于新的数据集，以对未知结果或类别进行预测。\n\
  \n\n\n\n算法定义了数据应当如何被处理，而模型则代表了现有数据集之间的关系，当应用于新数据时，这些关系可以提供对未知结果的洞察；两者在成功的 ML 应用中都起着至关重要的作用，但根据其在特定应用背景下的用途，它们通过不同的技术和方法来实现。算法与模型的概念也与处理大量数据的监督方法与无监督方法密切相关。监督方法涉及使用带标记的输入样本来训练算法。相比之下，无监督方法涉及在不要求任何标记示例的情况下识别模式。例如，支持向量机（`SVMs`）利用监督学习，意味着它需要标记的输入；在这里，人们可以将\
  \ `SVM` 描述为既是一种算法也是一种预测模型，因为它根据这些标签生成特定的决策边界，从而为可能标签的未来“未知”情况提供洞察（在这些情况下标签可能尚未存在）。相反，`K-means`\
  \ 聚类属于无监督学习，意味着在应用之前不需要标签；在这里，`K-means` 通常仅被描述为算法方法，因为它的输出反映了模式而无法访问任何已知标签，与 `SVM`\
  \ 相比，其洞察在预测未来案例方面的基础较弱。\n\n最终，理解算法与模型的区别使我们能够根据手头的预期目标对选择合适的方案做出更好的决策——无论是利用监督/无监督方法结合相关的算法/模型结构来对真实世界场景做出准确预测。在实现方面，ML\
  \ 模型通常使用 `TensorFlow` 或 `scikit-learn` 等 ML 库进行实现。相比之下，算法通常使用 `Python`、`Java` 或\
  \ `C++` 等编程语言实现。\n\n## 1.16 数据驱动解决方案的缺点\n\n尽管机器学习已应用于每个行业，并帮助组织做出比经典方法更有效、更明智且数据驱动的决策，但它仍然存在许多不忽视的问题。\n\
  \n##### 海量数据\n其中一个缺点是它需要大量可靠且准确的数据才能产生价值。如果使用的数据是不完整或不准确的，那么得出的结果和结论将是无效的。此外，公司必须了解他们应该如何构建其数据集，以便他们能够从中推导出有意义的洞察。最后，组织需要具有经验的人员，他们知道如何正确地解释和利用这些信息。\n\
  \n##### 数据更新\n这些系统需要频繁使用新数据集进行更新以保持其相关性——就像任何其他技术系统或业务流程一样，如果你不持续更新它，可能会随着时间的推移看到收益递减。此外，如果你过度依赖仅基于预测性分析的自动化决策，可能会出现关于模型中引入偏差的潜在担忧，这可能导致不准确的预测/建议。\n\
  \n##### 隐私与安全问题\n在实施任何形式的数字解决方案时都应考虑隐私和安全问题。例如，未能遵守《通用数据保护条例》（`GDPR`）可能会导致巨额罚款以及声誉损害，从而对业务运营产生负面影响。\n\
  \n##### 训练数据不足\n任何 `ML` 算法的输出质量高度依赖于其训练数据。如果训练数据不足或包含偏偏的样本，`ML` 模型将无法正确学习，其输出将是不准确的。此外，训练数据不足可能导致过拟合或欠拟合，这两种情况都会降低机器学习算法的性能。\n\
  \n##### 数据质量差\n数据在 `ML` 中至关重要，并且必须是高质量的。另一方面，低质量的数据会导致糟糕的结果并限制算法的有效性。低质量数据有多种形式：\n\
  \n*   **噪声数据**：噪声或无关的信息会对 `ML` 算法的性能产生重大的负面影响。训练示例中的噪声越多，模型可能会忽略特征之间的某些真实关系，导致预测准确率较低。这种噪声信息还会产生过拟合问题，因为模型很难从随机噪声中检测模式。为了减轻这种影响，在训练开始之前识别并从数据集中移除无关特征是关重要的。\n\
  *   **不完整数据**：不完整的数据集是另一个常见问题，由于特定条目中缺失或记录错误的值引起。这些缺失值被称为数据集中的“空洞”，会对性能产生负面影响。此外，它们可能会导致模型根据不完整的信息做出错误的假设，当数据集中存在过多“空洞”时，会降低预测准确性。为了防止这些问题的出现，在使用这些数据进行训练之前识别并移除任何缺失值或异常条目是关重要的；否则，应在训练早期考虑移除它们，以减少对准确性的潜在影响。\n\
  *   **不准确数据**：低质量数据集的另一个问题是不准确的条目，这些可能是由预处理阶段或手动输入错误（如拼写错误）造成的。这些不准确性会降低准确率水平并增加过拟合风险。如果在训练阶段或推理操作期间基于损坏的样本做出错误的假设，可能会产生错误结果。\n\
  *   **不洁数据**：不洁数据集主要指包含不一致性、离群值、重复条目和无关输入的数据。这些异常在建模系统中构成了严重风险，因为基于错误假设的准确预测可能会导致代价错误。此外，大型数据库中的异常会导致瘫痪，遇到异常记录时人类和计算机算法都不知道采取什么行动。因此，消除所有此类差异至关重要，以减少它们对建模操作的影响并最终提高预测准确性并减少伦理缺失。因此，拥有无错误异常的高质量清洁数据集是\
  \ ML 基础设施赖以生存的支柱之一。\n\n### 非代表性训练数据\n这是一个用于描述未能准确反映其旨在代表的人口的数据集的术语。这对于使用此类数据作为输入的\
  \ ML 模型可能会产生重大影响。通常，非代表性训练数据会导致不公平的模型预测、潜在的决策偏差以及对底层人口的估计不准确。如果 ML 模型使用不代表底层人口的数据集进行训练，那么它们可能无法无偏见地识别本质模式。\n\
  \n\n\n\n\n此外，非代表性的训练数据可能会导致对特定群体内部特征和行为的估计不准确。如果将其用于市场预测或经济政策决策等预测性分析，可能是危险的。当将其应用于推荐引擎和聊天机器人等生产系统时，它还会影响用户体验和信任度。这些问题会对依赖\
  \ AI 技术的企业产生严重影响，因此妥善筛选其数据集对它们至关重要。\n\n## 过拟合\n过拟合是机器学习工程师和数据科学家面临的一个常见问题。在这种情况下，模型学习并保留了过多的训练数据。结果是它在训练数据上表现良好，但在未知的测试数据上需要改进。此外，过拟合会降低机器学习系统的泛化能力，导致在对新数据集进行预测或分类时，对现实情况产生错误表述。通过使用线性性和参数化方法，我们可以防止机器学习模型出现过拟合。\n\
  \n### 解决过拟合的技术\n为了解决过拟合问题，可以应用一些技术：\n\n(a) **交叉验证**：在训练模型之前，将数据集划分为训练集和测试集，以确保它能记住输入内容。然后，使用\
  \ `k-fold`（k 折交叉验证）或 `Leave One Out (LOO)`（留法）等交叉验证方法，可以确定模型在接触新数据时的表现。\n\n(b) **正则化**：这涉及到在训练过程中对参数施加限制，使其保持简单并开始记忆，而不是从输入中泛化。\n\
  \n(c) **特征选择**：在将特征输入机器学习模型以提高其在不同数据集上的泛化能力之前，使用特征选择方法来识别数据中的无关特征，这可以在降低复杂性的同时提高准确性，并降低与数据不必要特征相关的过拟合风险。它涉及使用如\
  \ `principal component analysis (PCA)`（主成分分析）、`stability selection`（稳定性选择）等算法，从大型特征空间中识别本质特征，其准确率得分高于传统的特征选择方法（如\
  \ `stepwise regression` 逐步回归），后者由于其在大特征空间中的线性性质，往往受到维数灾咒的困扰。\n\n## 特征选择的重要性\n特征选择是机器学习过程中一个必要且至关重要的阶段，因为它严重影响了模型的准确性和有效性。通过消除多余或无关紧要的属性，我们可以降低数据的维度，从而带来多个优势，包括：\n\
  \n*   **增强模型性能和精度**：通过仅利用与目标变量显示显著相关的特征，我们可以规避过拟合和数据噪声问题，增强模型的泛化能力。\n*   **最小化计算支出和时间**：通过使用较少数量特征，我们可以加速模型的训练和推理过程，同时节省内存和存储容量。\n\
  *   **提高可解释性和清晰度**：通过减少特征数量，我们可以增强对模型运行机制以及每个特征对预测个体贡献的理解。\n\n## 特征选择方法\n特征选择有多种方法论和途径，具体取决于数据的性质、学习目标以及用于评估的标准。几种常用技术包括：\n\
  \n### 过滤技术/方法\n这些方法使用 `correlation`（相关性）、`variance`（方差）、`information gain`（信息增）和\
  \ `chi-squared test`（卡方检验）等统计量单独评估每个特征。选择高分特征，同时剔除低分特征。过滤方法高效且简单，尽管它们没有考虑特征之间的相互作用或学习过程。\n\
  \n过滤方法是特征选择的一种类别，它利用统计量来评估每个特征相对于目标变量的相关性和显著性。过滤技术与封装方法的区别在于，它们不依赖于特定的分类器或预测器来识别最佳特征子集。相反，过滤方法独立于任何学习方法。它们可以作为将数据输入任何算法之前的初步步骤。过滤方法的一个主要优势是其计算效率和可扩展性，因为它们只需要处理一次数据。它们还避免了过拟合问题。过滤中采用的几种流行策略包括：\n\
  \n*   **信息增**：该指标衡量了某个特征为目标变量贡献了多少价值信息或减少了多少熵。显示出更多信息增的特征对于分类任务更具相关性且具启发性。\n*  \
  \ **卡方检验**：它评估了特定特征与目标变量之间关系的统计显著性。卡方值较高的特征显示出更有可能依赖目标变量，使其分类更有优势。\n*   **Fisher\
  \ 分数**：该分数量化了特定属性的跨类方差与类内方差相比的比例。具有较高 Fisher 分数的特征具有更强的判别能力，在区分不同类别方面更有效。\n*   **缺失值率**：这是一个量化特定特征中缺失值比例的指标。缺失值百分比较大的特征可靠性较低，可能为模型引入噪声或偏差。\n\
  \n### 封装方法\n这些方法通过单独评估每个特征或特征子集来评估特定学习算法的有效性。通过选择优良特征并消除阻碍的特征，可以增强算法性能。封装方法比过滤方法具有更高的精度，并提供更深入的分析。然而，它们也是计算密集型的，且容易过拟合。\n\
  \n### 嵌入技术\n这些方法将特征选择整合到学习过程中。算法选择相关特征并消除无关特征。嵌入式方法兼具过滤方法和封装方法的优点，同时具有算法特定性。\n\n\
  (d) **模型集成技术**：这些包括组合多个独立模型，通过减少集成架构中任何一个组件导致错误的概率来提高准确性。`Bagging`、`boosting`、`stacking`\
  \ 以及其他技术被用于这些过程。然而，所有这些方法都基于相同的原理：组合许多“弱”或低准确率的个体模型，会产生预测能力优于任何单一组件的强学习器。\n\n(e)\
  \ **数据增强**：这是一个通过随机更改给定目标数据集中的现有示例，人为向现有数据集添加更多示例的过程，直到达到所需尺寸，同时保持与原始数据集目标标签或类别相同的分布模式。与不使用增强数据集相比，这显著提升了机器学习算法预测未见样本的能力。\n\
  \n\n\n\n总而言之，上述方法有助于降低简单的未正则化线性分类器的风险，防止它们在接触到新类型的输入样本/数据集时，变得过于复杂，并开始记忆输入而非从其输入中泛化。这不仅提高了预测能力，还增强了对部署阶段遇到的非预见未来场景的鲁棒性，从而获得更好的结果。\n\
  \n### 欠拟合 (Underfitting)\n当使用较少的数据点训练机器学习模型时，它会产生不完整且错误的结果。这通常发生于我们拥有较小的数据集，并尝试用非线性数据开发线性模型时。在这种情况下，模型的复杂度被破坏，机器学习规则对于数据集来说变得过于简单而易应用，从而导致模型做出错误的预测。此外，欠拟合会导致高偏差（high\
  \ bias），这意味着模型倾向于在不同的数据点上犯下相似的错误。为了避免欠拟合，机器学习工程师和从业者需要理解模型中应该构建多少灵活性，以及在使用适当的验证技术（如交叉验证、`k-fold\
  \ validation` 和 `LOO validation`）时应使用多少正则化。\n\n此外，特征工程在避免欠拟合方面发挥着至关重要的作用，通过帮助从噪声数据集中识别有意义的特征，并结合如\
  \ `PCA` 等降维技术，后者有助于在保留大部分有用信息的同时减少输入变量的数量。最后，也可以采用如 `AdaBoost` 等增强算法。\n\n### 监控与维护\
  \ (Monitoring and maintenance)\n监控和维护模型对于实现机器学习应用的成功结果至关重要。通过适当的维护可以使模型变得可靠，从而产生准确的结果。监控允许我们检测模型何时出现问题。当由于环境变化或业务需求导致新数据进入系统时，我们使用诸如\
  \ `accuracy`、`recall` 和 `precision` 等指标来了解我们的系统相对于现有数据的表现如何。此外，监控还帮助我们跟踪不同的超参数如何随时间影响模型性能，以便我们在需要时对其进行调整以获得最佳性能。通过维护机器学习模型，我们可以在需要时应用定期更新，确保其在整个使用周期内保持准确和可靠。\n\
  \n### 数据漂移 (Data drift)\n在机器学习中，数据漂移是指用于训练模型的数据分布随时间推发生了偏移（无论是缓慢还是快速）。为了避免这个问题，企业必须使用相关技术制定策略，在数据漂移发生时立即进行检测和处理。处理这个问题有许多选择。\n\
  \n组织应该投资于监控工具，以跟踪数据集的变化，并在这些变化开始影响机器学习模型的准确性时发出警报。此外，企业应该使用新数据集持续重新训练其算法，以跟上不断变化的模式或趋势。对任何创建的新模型都应进行定期测试，以便企业在将其投入生产环境之前，能够衡量其相对于现有基准或性能标准的表现情况。\n\
  \n其次，公司必须确保机器学习算法使用的所有输入变量在同一数据集的整个生命周期内，不同版本之间保持一致；否则，输入可能会发生足够的变化，导致由给定算法早期版本生成的输出结果变得无效。\n\
  \n### 缺乏技能人才 (Lack of skilled resources)\n机器学习是一个快速发展的领域，它正在改变着我们在日常生活中与技术和系统交互的方式。虽然机器学习的潜力巨大，但由于该领域缺乏技能人才，这些潜力尚未被完全实现。因此，随着公司寻找利用其能力并使其产品更智能的方法，对熟练机器学习专业人士的需求急剧增加。遗憾的是，需要更多既具备传统软件工程实践知识，又掌握机器学习成功开发产品所需的数据科学技术知识的合格人才。此外，构建高质量的模型需要多个学科的专业知识，包括数学和计算机科学。\n\
  \n数据科学家需要理解数学、计算机科学、数据科学技术和统计学。他们还需要理解建模技术（如监督/无监督分类）以及 `R` 或 Python 的 `scikit-learn`\
  \ 等工具。\n\n### 机器学习的过程复杂性 (Process complexity of machine learning)\n理解和操作机器学习系统的困难程度被称为过程复杂度。这是一个问题，因为它增加了开发过程的时间和成本，并增加了出现问题的风险。在机器学习中，过程复杂度通常是由数据管理不当或算法或特征选择不当引起的。它与运行时性能直接相关。此外，由于对每个组件缺乏足够的知识，工程师在设计这些组件时更容易出错。\n\
  \n处理复杂性导致机器学习问题的另一个例子是部署。在此背景下，部署是指将已训练的模型投入生产环境，用于图像识别和语音识别等现实任务。然而，部署机器学习系统需要复杂的环境架构。由于对流程缺乏理解，此阶段的任何错误都可能导致整个系统的崩溃。\n\
  \n### 数据偏差 (Data bias)\n机器学习中的数据偏差是一种现象，由于训练数据的问题导致模型产生了不准确的结果。当数据集中的某些元素被过度加权或需要比其他元素更重要时，这些错误就会存在。它通常是由不完整或不准确的数据集、数据点分布不均、数据分类错误，甚至是偏偏的算法引起的。偏差的数据会导致不准确的结果、倾斜的结果和其他分析错误。然而，我们可以通过确定数据集中实际偏差的何处来解决这一错误。\n\
  \n另一种常见的偏差形式涉及标记不正确或分类错误的数据集，这会导致模型在尝试从这些缺陷数据集中学习时误入歧途。最后，偏差的另一个主要来源源于算法本身——特别是那些根据预定义标准（如年龄段或种族/民族特征）设计的算法——它们根据预设参数而非实际证据人为地限制预测结果。\n\
  \n为了减少或消除机器学习模型中的数据偏差，可以使用几种技术：\n\n- `Data balancing`（数据平衡）：涉及通过对少数类进行过采样和对多数类进行欠采样，确保数据集中所有类别都得到平等的表示。\n\
  \n\n\n\n\n- **数据增强 (Data augmentation)**：这涉及基于现有示例生成新示例，通过旋转和噪声注入等变换，创建代表真实场景的合成训练样本。\n\
  - **集成方法 (Ensemble methods)**：这些方法有助于处理类别不平衡问题，并减少由于特定子组或类别的样本有限的数据集引起的偏差，因为它们能够将多个模型组合成一个强大的预测系统，其性能优于任何单一模型。用于此目的最著名的集成方法是`boosting`，它将弱学习器组合成一个集成整体，每个学习器的强度随着每一轮预测的进行而增强，直到在测试时获得最佳结果。\n\
  - **正则化技术 (Regularization techniques)**：如`dropout`、`weight decay`（权重衰减）和`early stopping`（早停），也可用于在处理偏置数据集时通过惩罚复杂模型来减少过拟合，防止它们从训练数据中的噪声中学习无关的特征或模式，这些特征在测试阶段没有价值；\n\
  - **特征工程 (Feature engineering)**：这涉及通过探索性分析在数据集中寻找相关的特征（属性），然后选择那些最能捕捉每个类别核心信息的特征，以便将其有效地作为建模的输入变量，同时忽略冗余特征，因为如果不加检查，这些特征可能会增加偏差。\n\
  \n### 缺乏解释性 (Lack of explainability)\n可解释性在机器学习（ML）系统中至关重要，因为它允许我们理解算法是如何以及为什么做出某些判断的。随着越来越多复杂的模型被用于预测分析和自动化决策，可解释性正变得越来越重要。\n\
  \n解决这一问题的策略之一是增加系统的透明度。这可能包括显示用于训练的数据，以及关于生成预测时考虑了哪些属性的信息。此外，允许用户通过可视化与模型交互，使他们能够更好地理解其输入如何影响输出，并据此调整参数。另一种策略是在可行的地方采用可解释模型而非复杂的模型。\n\
  \n最后，将领域知识引入我们的机器学习系统中，允许我们提供独特的见解。\n\n### 良好的机器学习问题 (Well-posed Machine Learning)\n\
  良好的机器学习问题是一个能够从 `E` 学习并产生 `P` 的计算机程序。良好的机器学习问题的概念对于理解 `T` 至关重要，这涉及到根据数据产生更好的 `P`。\n\
  \n### 18 设计学习系统（机器学习生命周期） (Designing a Learning System)\n机器学习使计算机系统能够在被显式编程的情况下进行学习。但机器学习到底是如何运作的？这可以通过机器学习生命周期来定义。这是一种开发机器学习项目的循环方法。\n\
  \n通常，机器学习模型用于解决分类、聚类或回归等问题。在开始之前必须明确项目目标。例如，如果目标是根据用户的观看历史创建一个推荐电影的系统，则应该明确输出的结构以及推荐电影的标准是什么。一旦知道了项目目标，拥有足够的数据来构建模型是非常重要的。如果没有足够的数据，构建模型将困难。数据的类型和数量取决于具体的问题和使用的模型。\n\
  \n机器学习程序的生命周期由六阶段组成。任何机器学习程序的成功取决于每个阶段的执行情况。\n\n1. **理解业务问题 (Understanding the Business\
  \ Problem)**：在启动任何机器学习项目之前，理解预期结果和目标至关重要。从利益相关者那里收集所有信息。随后，与项目负责人合作确定需求和目标是工作的一部分。然后，确定业务的哪些方面需要机器学习解决方案，以及如何判断你已成功。\n\
  2. **数据收集 (Gathering Data)**：在了解需要做什么之后，下一步是收集足够的相关数据，以便模型能够学习并应用于实时场景。这涉及收集与机器学习程序要解决的问题相关的标记数据集。根据你的用例，你可能需要从不同的来源收集数据，例如`网络爬虫`或购买第三方数据集，这些有助于你用高质量的数据集启动项目。学习机器学习算法需要清洁、充足的训练数据。你必须理解机器学习模型将如何以及是否与实时数据一起运行。\n\
  \n\n\n### 3. 数据准备与处理\n现在你已经确定了数据源，必须将这些信息转换为适用于机器学习训练的内容。这种方法涉及从许多源收集数据、对其进行标准化处理、识别并纠正错误信息、删除重复和不必要的信息，并将数据划分为训练集、测试集和验证集。我们还进行特征工程部分，通过提取新特征来提高模型的稳健性，从而帮助我们提高模型的的准确性。\n\
  \n### 4. 数据分析\n在此阶段，我们使用各种技术可视化不同变量之间的关系以及它们之间的相关性，以便从中提取有意义的见解。它还能帮助我们识别数据集中是否存在异常（如果有的话）。最后，它将帮助我们根据问题描述（例如分类与回归）选择合适的算法进行建模。\n\
  \n### 5. 训练\n在收集所有相关数据集后，训练阶段使用这些数据集作为输入构建模型。该模型将包含参数，这些参数会根据模型识别新输入数据（通常称为验证集）特征的准确性进行调整。在此步骤中，可能会进行一些预处理，例如归一化值或将其转换为更适合学习算法（如\
  \ `ANNs` 人工神经网络或 `DTs` 决策树）的格式。一些流行的机器学习框架如 `scikit-learn` 提供了许多易用工具，可以快速方便地执行这些类型的预处理任务。\n\
  \n### 6. 测试与部署模型\n训练完成后，是时候将测试集应用于已训练的模型以验证其性能了；之后，根据在测试集上获得的结果，预测结果可以被接受或拒绝。这一过程被称为\
  \ `cross-validation`（交叉验证），其中通过比较预测结果与实际结果，对训练模型在未见过的实例进行测试，以便在将其部署到现实应用之前衡量训练模型的泛化能力（准确性）。这一阶段等同于应用程序开发的质量保证过程。最后一步将包括创建的模型集成为应用程序的形式，例如网页和移动应用。此外，将这些模型部署到云服务器等在线服务中，使得应用程序通过\
  \ `API calls` 在全球范围内可用，允许用户轻松访问。\n\n持续对你的模型进行调整和迭代。持续监控并改进它。毕竟，技术在演变和变化，业务需求在改变，现实世界会定期制造意外状况。这些变量中的任何一个都可能导致额外的需求。将你的机器学习模型视为一个移动应用程序。程序将不断地需要调整、更新和改进。你的\
  \ ML 模型也是如此。\n\n## 总结\n- 机器学习 (`ML`) 由 Arthur Samuel 在 1959 年创立，是一门让计算机在没有显式编程的情况下进行学习的科学领域。它结合了聚类、分类、决策树、监督学习、无监督和强化强化技术来解决复杂问题。机器学习的增长得益于易用的、廉价的数据存储、计算能力、更低成本的处理能力以及高速互联网的普及。\n\
  - 设计和学习是 `ML` 的两个不同方面。学习侧重于开发可以预测未来结果的预测模型，而设计侧重于为图像识别和自动驾驶等现实问题创建新算法。\n- `ML` 是一个迭代过程，涉及训练、测试和提高模型准确性。预测任务和描述性任务是机器学习任务的两大类型。\n\
  - 监督学习涉及机器使用标记良好的训练数据进行训练并预测输出。它可以被分为两类：回归和分类。回归算法用于预测连续变量。\n- 无监督学习涉及机器使用未标记的数据进行训练。它可以被分为两类：聚类和关联。\n\
  - 强化学习是 `ML` 的分支，模型学习通过做出决策来获得最优解决方案。\n\n## 练习\n\n## A 部分（单选题）\n\n1. 普通编程与机器学习编程之间的主要区别是什么？\n\
