  171.(d)\n\n| 5 || 计算学习理论 |\n| --- | --- |\n\n### Learning Objectives\n\n本章结束时，你将能够：\n\
  \n•解释计算学习理论的基本概念\n•描述计算学习理论的目标和历史发展\n•解释计算学习理论的意义和主要方法论，包括归纳、演绎、溯因和强化学习\n•解释 probably\
  \ approximately correct (PAC) 学习模型及其相关性\n•分析机器学习的复杂性理论，涵盖计算、空间和样本复杂性\n•评估学习算法的时间复杂度和错误界学习模型\n\
  •欣赏生成式学习的原理并将其与判别式模型进行对比\n•评估计算学习理论中使用的各种评估指标\n•预测计算学习理论的未来趋势和方向，包括深度学习、可解释 AI (XAI)\
  \ 和量子机器学习\n\n5.1Introduction\n\n\n\n\n\n计算学习理论（CLT）是人工智能（AI）的一个分支，专注于设计和分析从数据中学习的算法。这是一个相对较新的研究领域，但它已对机器学习（ML）和\
  \ AI 的发展产生了重大影响。其核心，计算学习理论关注的是理解支配学习过程的原理。它寻求理解机器如何从数据中学习，如何从数据中泛化，以及如何利用这些知识做出决策。它还寻求理解机器如何从经验中学习以及如何适应不断变化的环境。CLT\
  \ 理论还关注学习算法的应用。这涉及理解学习算法如何在现实世界应用中使用，例如在机器人技术、自然语言处理（NLP）和计算机视觉中。\n\n## 5.2 计算学习理论的目标\n\
  \nCLT 与统计学领域密切相关，统计学也处理数据的分析。计算学习理论的主要目标（目标）是开发能够从数据中学习并对未来数据做出预测的算法。\n\n计算学习理论领域自\
  \ 1950 年代以来就已存在，近年来取得了 tremendous 的增长。这归功于大型数据集的日益可用性、强大计算工具的发展以及强大 ML 算法的出现。其核心，计算学习理论关注的是开发能够从数据中学习的算法。这涉及开发能够识别数据中的模式并利用这些模式对未来数据做出预测的算法。这是通过使用各种技术完成的，例如监督学习、无监督学习、强化学习和深度学习。\n\
  \n监督学习涉及使用标记数据，其中标签是预先已知的。无监督学习涉及使用未标记数据，其中标签未知。这种类型的学习用于识别数据中的模式并将数据点聚类到组中。\n\n\
  强化学习是一种学习类型，其中智能体与环境交互并根据其行为获得奖励或惩罚。这种类型的学习用于开发能够学习在环境中执行任务的智能体。深度学习是一种使用人工神经网络（ANNs）从数据中学习的学习类型。这种类型的学习用于开发能够识别数据中的模式并对未来数据做出预测的模型。\n\
  \nCLT 的另一个目标（目标）是理解从数据中可以学习的内容的边界（限制）。这包括意识到学习算法的样本复杂度。学习算法必须遇到的用于学习一个函数的数据点的数量被称为样本复杂度。样本复杂度表示算法学习一个函数所需的数据量。这些指标根据学习挑战的特征而变化，例如学习者考虑的假设空间的大小或复杂性、接近目标概念所需的准确度程度，以及学习者生成合理假设的概率。\n\
  \n## 5.3 历史\n\nCLT 的历史可以追溯到 1950 年代，当时艾伦·图灵提出了图灵测试来衡量计算机像人类一样思考的能力。图灵的工作为 AI 的发展奠定了基础。在\
  \ 1960 年代，AI 研究人员开始探索使用计算机从数据中学习的概念。这导致了第一个 ML 算法的开发，例如决策树和神经网络。\n\n1970 年代见证了监督学习算法的发展，例如线性回归和逻辑回归。这些算法能够从标记数据中学习并对未来做出预测。在\
  \ 1980 年代，无监督学习算法，例如聚类和主成分分析，被开发出来。这些算法能够从未标记数据中学习并对未来做出预测。\n\n在 1990 年代，第一个深度学习算法，例如卷积神经网络（CNNs）和循环神经网络（RNNs），被开发出来。这些算法能够从大量数据中学习并对未来做出预测。今天，计算学习理论是一个活跃的研究领域，并在各种应用中使用。\n\
  \n## 5.4 计算学习理论的重要性\n\nCLT 的重要性在于它帮助我们理解 ML 和 AI 的基本原理。通过理解这些原理，我们可以开发能够从数据中学习并对未来事件做出预测的算法。这在\
  \ AI 中尤其重要，因为算法用于做出决策和解决问题。\n\nCLT 还帮助我们理解 ML 算法的局限性，以便我们可以开发能够更高效、更准确地从数据中学习的更好算法。这在数据挖掘中很有用，其中算法用于识别大型数据集中的模式和趋势。\n\
  \n最后，使用 CLT，我们可以理解如何设计能够更有效、更高效地从数据中学习的算法。这在机器人技术中具有极大价值，其中算法用于控制机器人并做出决策。\n\n因此，CLT\
  \ 的目标是理解以下内容：\n• 什么样的任务是可学习的？\n• 可学习性需要什么样的数据？\n• 学习算法的时间和空间需求是什么？\n\n## 5.5 主要方法\n\
  \n其核心，CLT 关注的是理解从数据中学习的过程（Fig. 5.1）。这涉及理解可用于学习的数据类型、可用于从数据中学习的类型算法，以及这些算法在不同类型数据上的性能。特别是，CLT\
  \ 关注理解算法如何以既准确又高效的方式从数据中学习。\n\n![](img/f5-1.jpg)\nFigure 5.1 Core of computational\
  \ learning\n\n存在不同类型的 CLT，每种都关注从数据中学习的不同的方面。如前所述，监督算法从标记数据中学习，无监督算法从未标记数据中学习，强化算法从奖励和惩罚中学习，而进化算法则从进化过程中学习。CLT\
  \ 还关注理解这些算法的性能。这涉及理解它们的准确性和效率，以及它们对新数据的泛化能力。\n\nCLT 中使用的主要方法如下：\n• 归纳学习：这是 AI 中最常用的学习类型。在这里，计算机程序被赋予一组训练数据（正确输入和输出的具体示例），然后被要求生成一个通用规则或模型，可用于预测新输入的输出（Fig.\
  \ 5.2）。\n• 演绎学习：在这里，计算机程序被赋予一组规则或模型（通用），然后被要求使用这些规则或模型为新输入生成正确输出（Fig. 5.2）。\n![](img/f5-2.jpg)\n\
  Figure 5.2 Inductive and deductive learning\n• 溯因学习：在这里，计算机程序被赋予一组训练数据（不完整观察），然后被要求生成一个假设（对数据的一种可能解释），该假设与数据一致（Fig.\
  \ 5.3）。\n![](img/f5-3.jpg)\nFigure 5.3 Abductive learning\n\n\n\n\n\n### 强化学习\n\
  这里，一个计算机程序被给定一组奖励和惩罚，然后被要求学习一个 `policy`（一组规则），以最大化奖励并最小化惩罚。\n\n我们现在将详细探讨其中的每一个。\n\
  \n### 5.5.1 归纳学习\n\n归纳学习是人工智能中最常见的机器学习类型。这是一个计算机程序被给定一组训练数据，其中包含正确输入和输出的示例的过程。然后使用这些数据生成一个通用规则或模型，该模型可用于预测新输入的输出。\n\
  \n`Inductive Learning = Experience + Knowledge + Reasoning`\n\n这种学习方式使用经验、知识和推理来得出结论并做出预测。归纳学习的过程类似于人类从经验中学习的方式。与人类一样，机器从示例中学习并利用这些信息预测新情况。\n\
  \n归纳学习的一个例子是电子邮件中使用 `spam filters`。首先，垃圾邮件过滤器在被标记为垃圾邮件或非垃圾邮件的电子邮件上进行训练。然后，基于这些电子邮件的特征，算法创建一个模型，可用于将新电子邮件分类为垃圾邮件或非垃圾邮件。\n\
  \n在归纳学习中，准确性取决于训练数据的质量。如果训练数据有偏差或不足，模型将无法精确预测新输入的输出。因此，必须拥有多样化且具有代表性的训练数据集，以确保模型能够做出准确的预测。\n\
  \n归纳学习有效这一想法在归纳学习假设中被正式表述。该假设断言，如果一个假设在大量且具有代表性的训练示例上拟合数据良好，那么它在全新的测试示例上也会拟合数据良好。例如，如果假设“所有鸟都会飞”与大多数鸟类训练示例相符，我们可以预期它也将与大多数鸟类测试案例相符。\n\
  \n然而，并非所有理论都一样。有些可能过于狭窄或过于宽泛，无法充分解释数据。例如，断言“所有鸟都是黑色的”过于狭窄，因为它忽略了不同鸟类颜色的存在。断言“所有动物都会飞”过于宽泛，因为它涵盖了鸟类以外的物种。一个有说服力的假设应该是恰到好处的。这被称为\
  \ `bias–variance trade-off`。\n\n归纳学习算法寻求选择最能准确描述数据并将其推广到新数据的最佳假设。为此，它们必须浏览各种潜在假设并使用一组标准对其进行评估。一个标准可能是假设与训练数据集的匹配准确度。假设的复杂性或简洁程度也可能是额外的标准。`Occam’s\
  \ razor`，即最佳假设是拟合事实最好的假设，是平衡这些要求的一种流行方法。\n\n归纳学习在机器学习中很有帮助，因为它帮助我们从数据中学习，并根据所学做出预测或决策。例如，它可用于根据动物特征对动物照片进行分类，或根据客户兴趣向客户推荐产品。通过归纳学习，我们可以从我们可能之前没有注意到的事实中获得新知识或新见解。\n\
  \n### 5.5.2 演绎学习\n\n这是一种机器学习类型，其中计算机程序被提供一组预定义规则或模型，它使用这些规则或模型为新输入生成准确输出。在这种方法中，计算机必须根据提供的规则或模型进行逻辑推理，以推断新信息并预测结果。\n\
  \n`Deductive Learning = Knowledge + Reasoning`\n\n演绎学习是一种推理形式，其中结论是从一组前提或事实中得出的。在这里，如果前提为真，则结论必然为真。演绎学习的一个例子是在医学诊断中使用\
  \ `decision trees`。决策树是通过输入来自具有不同症状和结果的各种患者的数据而创建的。利用这些信息，计算机生成一个决策树，可用于根据新患者的症状预测其预后。这种方法已成功诊断出许多医学状况，包括心脏病和癌症。\n\
  \n另一个例子是在金融中使用 `expert systems`。专家系统是旨在模拟人类专家在特定领域的决策能力的计算机程序。在金融领域，专家系统可用于分析市场趋势并预测未来价格。通过输入来自各种来源的数据，包括新闻文章和财务报告，系统可以对市场方向做出明智的预测。\n\
  \n### 5.5.3 溯因学习\n\n这涉及生成与一组训练数据一致的假设。这种学习方法近年来变得越来越流行，许多研究人员和开发人员都在探索其潜在应用。\n\n\
  它表示为 `P(H|E) = P(E|H) × P(H) / P(E)`。这表明在给定证据 `E` 的情况下假设 `H` 的概率等于在给定假设的情况下证据的概率乘以假设的概率除以证据的概率。换句话说，这是给定证据的假设的概率，同时考虑了假设的先验概率。\n\
  \n基本思想是计算机程序被给定一组训练数据，然后被要求生成一个解释数据的假设。此外，假设必须与数据一致，这意味着它必须能够根据训练数据中的模式准确预测新数据。\n\
  \n溯因学习使其在学习过程中具有更大的灵活性，这是其主要优势之一。与其他类型的机器学习不同，溯因学习不需要预定义的特征或变量集。相反，程序可以根据其在数据中观察到的模式生成自己的假设。\n\
  \n例如，一家公司希望预测未来一年内最有可能离职的员工。他们可以使用溯因学习来分析员工的工作满意度、薪水和其他因素，并生成关于哪些因素最有可能导致员工流失的假设。这些信息随后可用于制定保留员工和减少流失的策略。\n\
  \n另一个例子是在医学诊断中。医生可以使用溯因学习算法分析患者数据并根据症状和其他临床因素生成最可能的诊断假设。这可以帮助医生做出更精确的诊断和更有效的治疗计划。\n\
  \n### 5.5.4 强化学习\n\n强化学习程序被指示根据奖励和惩罚做出决策。该程序必须发现一个 `policy` 或原则，以最大化奖励并最小化惩罚。这种学习类型经常用于机器人技术、游戏和其他计算机必须根据不完整或模糊数据做出决策的应用中。\n\
  \n`Bellman equation` 用于强化学习。它描述了给定行动的预期奖励与所有可能行动的预期未来奖励之间的关系。它指出，给定行动的预期奖励等于即时奖励加上未来可以采取的最佳行动的折扣预期奖励。它以\
  \ 1957 年提出它的理查德·贝尔曼命名。\n\n在数学上，它可以表示为：`V*(s) = max(Q(s,a)) + E[V*(s′) | s,a]`。在这个等式中，`V*(s)`\
  \ 是状态 `s` 的最优值，`Q(s, a)` 是在状态 `s` 中采取行动 `a` 的预期值，而 `E[V*(s′) | s, a]` 是由此产生的状态的预期值，且\
  \ `a` 是状态 `s` 中的行动。\n\n\n\n\n\n## 强化学习示例\n\n强化学习的一个例子是训练机器人导航迷宫。机器人到达迷宫终点时会获得奖励，撞墙或卡住时会受到惩罚。通过试错，机器人学会了哪些行为会导致奖励，哪些会导致惩罚，并据此调整其行为。\n\
  \n另一个例子是训练计算机程序玩象棋之类的游戏。程序赢棋时会获得奖励，输棋时会受到惩罚。通过反复对弈和分析成功的策略，程序学会了哪些走法最有可能导致胜利，哪些应避免。\n\
  \n强化学习可以成为创建智能系统的有力工具，使其能够基于不完整或不确定的信息做出决策。然而，精心设计奖励和惩罚至关重要，以确保系统学习到期望的行为。\n\n##\
  \ 5.6 近似正确学习\n\n学习是一个通过经验、学习或指导获取知识和技能的过程。近年来备受关注的一种学习类型是近似正确 `PAC`。当数据存在噪声或不完整时，该方法是有益的，因为它允许创建能够在输入不完美的情况下仍能准确预测结果的模型。\n\
  \n`PAC` 方程是描述从给定数据集学习过程的数学公式。它指出，给定一组数据点，学习算法可以用一定的概率和精度近似目标函数。该方程定义为：\n\n`P(f(x)\
  \ ≈ y) ≥ 1 - ε`，\n\n其中 `P` 是概率，`f(x)` 是目标函数，`y` 是学习算法的输出，`ε` 是错误率。\n\n`PAC` 学习的一个例子是语音识别。当一个人说话时，其声音会受到各种因素的影响，包括背景噪声、口音和言语障碍。为了准确识别语音，模型必须考虑这些变化。采用\
  \ `PAC` 学习方法，研究人员可以创建能够在音频数据不完美时仍识别语音模式的模型。\n\n另一个例子是计算机视觉。这里的输入数据可以是图像或视频，可能包含各种失真或错误。例如，一只猫的照片可能拍摄角度异常、模糊或背景中有其他物体。为了准确识别图像中的猫，`PAC`\
  \ 学习模型可以被训练以识别猫的特定特征，即使这些特征在输入数据中并不总是存在。\n\n假设 `f`：`X`→`Y` 与训练样本 (`x`[1],`y`[1])，⋯，(`x`[*n*],`y`[*n*])\
  \ 一致 当且仅当 `f(x[i])` = `y[i]` ∀`i`。\n\n给定任何一组标记示例 `S`，算法 `A` 与 `S` 一致，如果它存在并且输出‘无一致概念’，否则。`PAC`\
  \ 模型的目标是定义假设 `h`，使得 `h` 在 `D` 上的误差很小。\n\n给定样本集 `S` = {(`x`[1],`y`[1]),⋯(`x`[*m*],`y`[*m*])}，概念\
  \ `h` 相对于 `S` 的经验误差定义为\n\n```\n$err_{S}\\left( h \\right) = \\frac{1}{m}\\sum\\\
  limits_{i = 1}^{m}I\\left\\lbrack {h\\left( x_{i} \\right) \\neq y_{i}} \\right\\\
  rbrack$\n```\n\n`PAC` 模型的核心思想是假设训练样本来自单一的固定分布空间。目标是使用样本集 `S` 学习一个概念 `h`，使其在 `D`\
  \ 上的真实误差很小。\n\n`PAC` 学习旨在实现高效学习。为此，我们需要证明高效的学习算法能够确定一个与目标概念近似相同的假设。在此过程中，我们定义两个参数\
  \ `ε` 和 `δ`，并证明以至少 `(1 - δ)` 的概率，系统可以学习到误差最多为 `ε` 的概念\n\n如果算法在 `PAC` 模型中学习，则它很可能（置信度为\
  \ `(1 - δ)`）输出一个近似正确（风险最多为 `ε`）的假设。\n\n### 有限一致假设空间的复杂度\n\n```\n$m \\geq \\frac{1}{\\\
  varepsilon}\\left\\lbrack {\\ln\\left( H \\right) + \\ln\\left( \\frac{1}{\\delta}\
  \ \\right)} \\right\\rbrack$\n```\n\n这里，标记示例是足够的，因此以 `(1 - δ)` 的概率，所有 `h` ϵ `H`\
  \ 且\n\n`errorD` ≥ ∈ 具有 `errorS` > 0\n\n以至少 `(1 - δ)` 的概率，所有 `h` ϵ `H` 使得 `err[S]`\
  \ (`h`) 意味着\n\n```\n$error_{D} \\leq \\frac{1}{m}\\left\\lbrack {\\ln\\left( H \\\
  right) + \\ln\\left( \\frac{1}{\\delta} \\right)} \\right\\rbrack$\n```\n\n### 有限不一致假设空间的复杂度\n\
  \n```\n$m \\geq \\frac{2}{2\\varepsilon^{2}}\\left\\lbrack {\\ln\\left( H \\right)\
  \ + \\ln\\left( \\frac{2}{\\delta} \\right)} \\right\\rbrack$\n```\n\n这里，标记示例是足够的，因此以\
  \ `(1 - δ)` 的概率，所有 `h` ϵ `H` 具有\n\n`|errorD−errS|` < `ε`\n\n### 5.6.1 奥卡姆剃刀\n\n\
  可以表述为“偏好最能拟合数据的简单假设”。当在不同模型之间进行选择时，该原则常用于机器学习。解释最简单的模型通常最有可能正确。除非向模型添加更多假设（偏置），否则无法泛化到训练数据之外。\n\
  \n考虑一个定义为 `H`=`h`：`X`→`Y` 的假设。所有 `2^N` 实例都必须被标记。\n\n假设 `h` 相对于目标概念 `C` 和观测分布 `D`\
  \ 的真实误差是根据 `D` 抽取的实例被 `h` 误分类的概率。\n\n`errorD` = `P[x ∼ D][c(x)≠h(x)]`\n\n奥卡姆剃刀被用作机器学习中的归纳偏置。归纳偏置是机器学习算法为了形成假设或对一组训练实例进行泛化而做出的假设，目标是对未观察到的数据进行分类。为此，我们需要使用\
  \ `PAC` 学习来定义模型的设置。\n\n## 5.7 机器学习复杂性理论\n\n机器学习复杂性理论是人工智能的一个分支，研究复杂系统的行为。它关注算法如何与数据交互以及如何用于做出决策。机器学习复杂性理论是一个快速增长的领域，在金融、医疗保健和机器人等多个行业都有应用。例如，在金融领域，算法用于预测股价和做出投资决策。在医疗保健领域，算法用于诊断疾病和推荐治疗方法，而在机器人领域，这些算法用于控制机器人并决定它们应如何移动和与环境交互。\n\
  \n它基于这样一个思想：机器可以从数据中学习，并且数据的复杂性可用于做出预测和决策。这是通过使用算法分析数据并确定模式和趋势来实现的。然后数据复杂性可用于创建可用于决策的模型。\n\
  \n数据的复杂性由变量的数量和变量之间的关系数量决定。数据越复杂，做出预测和决策就越困难。\n\n### 5.7.1 学习计算复杂度\n\n学习算法的计算复杂度是指产生模型所需的时间和资源。这可能受多个变量的影响，例如数据集的规模和复杂性、必须分析的特征数量以及所采用的机器学习算法类型。\n\
  \n\n\n\n\n作为一个说明，假设一家银行想要使用机器学习算法来预测哪些借款人最有可能违约贷款。他们需要分析大量的数据，包括客户的信用历史、收入和其他相关因素的信息。如果银行使用简单的逻辑回归模型，就可以用相对较少的资源产生相当准确的预测。然而，如果他们选择更复杂的深度学习模型，则可能需要投资昂贵的硬件和软件，并投入大量时间和人力来训练模型。\n\
  \n学习算法的复杂性对于模型的准确性和可靠性也可能产生重要影响。在某些情况下，更复杂的模型可以产生更准确的预测或识别数据中更微妙的模式。然而，这些模型也可能更容易过拟合，即模型变得过于专门化于训练数据，无法推广到新的数据集。\n\
  \n更复杂的算法通常需要更长的时间来分析数据并生成模型。这可能会对需要实时预测或快速决策的应用造成实质性不利影响。机器学习研究人员和开发人员优化计算复杂性的一种方法是探索专门设计用于减少生成模型所需操作次数的新算法和技术。例如，诸如剪枝和量化之类的技术可用于简化复杂的神经网络并降低其计算复杂性，而不会牺牲准确性。另一种方法是仔细选择输入数据中要分析的特征。专注于最相关和最具信息量的特征可以大幅减少生成模型所需的操作次数，而不会损害其准确性。因此，学习算法的复杂性通常以时间和空间复杂度来衡量。时间复杂度衡量算法完成任务所需的时间，而空间复杂度衡量存储算法的数据和结果所需的内存量。\n\
  \n与学习算法计算复杂性相关的挑战包括设计高效算法、优化这些算法以及理解其行为的困难。解决这些挑战的一种潜在方案是使用近似算法，即产生近似结果而非精确结果的算法。近似算法通常比精确算法更快，并且需要的内存更少。另一种潜在解决方案是使用并行计算，这允许多个处理器同时处理同一问题。这可以显著降低算法的时间和空间复杂度。\n\
  \n## 5.7.2 学习算法的空间复杂度\n\n空间复杂度衡量存储算法的数据和结果所需的内存量。它是计算学习中的一个重要考虑因素，因为它会显著影响算法的效率和有效性。例如，如果算法需要大量内存来存储数据和结果，则在特定设备或系统上运行可能会很慢甚至不可能。\n\
  \n空间复杂度模型的方程通常表示为 `S(n) = c*n`，其中 `S(n)` 是空间复杂度，`n` 是输入大小，`c` 是一个常数。该方程表明空间复杂度与输入大小成正比。换句话说，随着输入大小的增加，算法的空间复杂度会成比例地增加。\n\
  \n在计算学习中衡量空间复杂度有几种方法，包括表示数据所需的位数以及算法执行期间必须存储的中间结果的数量。空间复杂度还可能取决于算法的具体实现以及用于存储数据的的数据结构。\n\
  \n减少计算学习中空间复杂度的一个常见方法是使用诸如数据压缩或降维之类的技术。这些技术减少了存储数据和结果所需的内存量，同时保持算法的准确性和有效性。另一个重要考虑因素是空间与时间的权衡。在某些情况下，使用更多内存来存储中间结果可能更有效地减少整体算法执行时间。然而，在其他情况下，权衡可能是相反的，使用更少的内存并接受更长的运行时间可能更有效。\n\
  \n## 5.7.3 学习算法的样本复杂度\n\n样本复杂度与学习一项任务所需的样本数量有关。如果机器学习算法可以用少量样本学习一项任务，则可以说它具有较低的样本复杂度。相反，如果算法需要大量样本来学习一项任务，则可以说它具有较高的样本复杂度。样本复杂度由多个因素决定，包括任务的复杂性、所使用的数据类型、所使用的特征数量以及所使用的模型类型。\n\
  \n在机器学习中，任务的复杂性由多个因素决定，包括变量的数量、类别的数量以及这些变量之间的关系。用于预测天气模式的机器学习算法是复杂任务的典型例子。这是因为需要考虑的变量众多，例如温度、湿度和气压，以及这些变量之间可能影响结果的许多关系。另一方面，设计用于预测抛硬币结果的机器学习算法会简单得多。这是因为只有两种可能的结果，正面或反面，没有其他变量需要考虑。在这种情况下，算法需要分析过去的数据并使用概率来预测未来抛硬币的结果。\n\
  \n关于计算学习，所使用的数据类型对于实现准确结果至关重要。这是因为机器学习中使用的数据是算法基于其进行预测的基础。因此，所使用的数据必须与所做的预测相关。例如，设计用于预测股票价格的机器学习算法需要从财务数据中学习，而设计用于预测体育比赛结果的算法则需要体育数据。可用数据的数量也显著决定了机器学习算法中使用的特征数量。例如，设计用于预测信用评分的机器学习算法需要许多特征，例如收入、信用历史和就业状态，才能做出准确的预测。另一方面，设计用于预测特定事件结果的机器学习算法需要的特征更少。\n\
  \n计算学习涉及选择合适的算法和用于训练模型的优化方法。所选模型类型受需要解决的问题的影响。优化方法决定了算法如何调整其模型参数以最小化预测与实际结果之间的误差。例如，`stochastic\
  \ gradient descent (SGD)` 是一种优化方法，它比 `batch gradient descent (BGD)` 优化更频繁地更新模型的参数。`SGD`\
  \ 对于大数据集特别有用，因为批量优化在计算上可能很昂贵。\n\n提高机器学习算法样本复杂度的一个技术是特征选择。这涉及从数据集中选择最关键的特征，这有助于减少算法需要学习的大量冗余或无关数据。例如，在客户购买习惯的数据集中，特征选择可能涉及识别最关键的变量，例如年龄、性别和收入，同时排除不太相关的变量，例如发色或鞋码。\n\
  \n\n\n\n\n另一种技术是 `feature engineering`，它涉及将数据转换为更适合 ML 算法的形式。这可能涉及归一化、缩放和降维技术。最后，超参数调优优化\
  \ ML 算法的参数以提高其性能。这可能涉及诸如 `grid search` 或 `random search` 等技术，有助于为给定算法识别最佳参数。\n\n\
  ## 5.7.3.1 有限假设空间的样本复杂度\n\n这是指从给定的假设空间准确学习一个概念所需的最少示例数量。样本复杂度取决于假设空间的大小和所需的准确度水平。\n\
  \n有限假设空间的样本复杂度方程如下：\n\n`Sample Complexity = log(|H|) / ε`，\n\n其中 `|H|` 是有限假设空间中的假设数量，`ε`\
  \ 是所需的准确度。\n\n该方程表明，空间中的假设数量和所需的准确度决定了有限假设空间的样本复杂度。假设数量越大，就需要更多的样本才能达到所需的准确度。同样，所需的准确度越高，就需要更多的样本才能实现。\n\
  \n例如，考虑一个二元分类问题，其中假设空间由二维空间中所有可能的线性分隔符组成。学习正确分隔符达到 90% 准确度所需的样本复杂度大约为 100 个示例。然而，如果假设空间由更复杂的函数组成，例如具有多层的神经网络，则实现相同准确度水平所需的样本复杂度可能显著更高。\n\
  \n另一个例子是用于分类的决策树算法。在这种情况下，假设空间由可从可用特征构建的所有可能决策树组成。学习具有一定准确度水平的决策树所需的样本复杂度取决于特征的数量和底层数据分布的复杂性。\n\
  \n## 5.7.3.2 无限假设空间的样本复杂度\n\n对于无限假设空间而言，样本复杂度的問題变得至关重要。在这里，挑战在于确定需要多少个示例才能确保假设在长期内表现良好。\n\
  \n以下公式给出了无限假设空间的样本复杂度方程：\n\n`Sample Complexity = log(H)/ε`，\n\n其中 `H` 是假设空间中的假设数量，`ε`\
  \ 是学习算法所需的准确度。\n\n该方程表明，学习算法对无限假设空间的样本复杂度与假设数量的对数成正比。换句话说，假设越多，就需要更多的数据样本才能达到所需的准确度。\n\
  \n假设我们试图预测一个人是否会喜欢某部特定电影。无数因素会影响他们的意见，例如类型、演员、导演等。我们可以创建无限数量的假设来解释这些因素，每个假设都有其自己的参数和假设。\n\
  \n在这种情况下，样本复杂度是指我们必须调查多少名影迷才能准确预测新的人是否会喜欢这部电影。如果我们只调查了少数几个人，我们的结果可能会因偶然或个人偏好而产生偏差。但如果我们调查了数千人，我们对预测的信心就会更大。\n\
  \n无限假设空间的另一个例子可以在机器学习领域找到。想象我们试图训练一台计算机识别不同类型的动物，从狗和猫到斑马和长颈鹿。我们可以创建无限数量的假设来解释区分这些动物的各种特征，例如它们的毛皮图案、身体形状等。\n\
  \n在这种情况下，样本复杂度是指我们需要向 ML 算法输入多少张动物图像才能准确分类新图像。因此，如果我们只在几十张图像上训练算法，它可能难以推广到新数据。但如果我们在数千张图像上训练它，它就有更好的机会识别模式并做出准确的预测。\n\
  \n## 5.7.4 学习的时间复杂度\n\nML 中学习的时间复杂度是指 ML 算法从数据中学习并做出准确预测所需的时间。它是在为给定任务选择算法时需要考虑的重要因素。不同的算法具有不同的时间复杂度，选择能够快速准确学习的算法非常重要。\n\
  \nML 中学习的时间复杂度由数据集的大小、任务的复杂性和所使用的算法类型决定。\n\n任务越复杂、数据集越大，机器学习所需的时间就越长。想象你试图训练一台机器识别手写数字。如果我们只有少量样本可供使用（比如\
  \ 100 个），那么学习的时间复杂度相对较低。这是因为机器能够快速处理数据并学习以相对较高的准确度识别数字。另一方面，如果你使用的是更广泛的数据集（比如 10,000\
  \ 个样本），学习的时间复杂度会高得多。这是因为机器必须处理更多有意义的数据，这需要更多的时间和计算能力。\n\n此外，如果手头的任务更复杂（例如识别手写字母而不是数字），学习的时间复杂度会进一步增加。值得注意的是，有办法减轻数据大小和任务复杂性对学习时间的影响。例如，可以预处理数据以减少其大小或复杂性，并且可以优化算法以使其更高效。然而，这些解决方案只能做到一定程度，最终，ML\
  \ 中学习的时间复杂度由底层任务和数据集决定。\n\n所使用的算法类型在确定学习时间复杂度方面也起着至关重要的作用。一些算法在从数据中快速准确学习方面比其他算法更有效。像\
  \ `SGD` 和 `mini-batch SGD` 这样的算法非常适合从大型数据集中学习，因为它们一次基于数据的小子集（或“迷你批次”）更新模型参数，这使得计算更快、更高效。\n\
  \n另一方面，像 `K-nearest neighbor` (`KNN`) 和 `decision trees` 这样的算法更适合较小的数据集。这是因为它们涉及大量的计算和内存使用，这在处理大量数据时会减慢学习过程。当然，一些算法介于这两个极端之间。例如，`support\
  \ vector machines` (`SVMs`) 以其对小数据集和大数据集都高效而闻名，并且能够以高准确度处理复杂的决策边界。\n\n## 5.8 基于错误的学习模型\n\
  \n这是一种试图捕捉人类从错误中学习本质的模型。这一范式背后的概念是我们学习时会犯错误，并且这些错误是学习过程不可或缺的一部分。此外，该模型假设我们有一些反馈机制来告诉我们何时犯了错误，并且我们利用这种反馈来调整未来的行为。\n\
  \n基于错误的学习模型是一种用于估计给定决策预期损失的算法。它使用一组数据点来根据过去犯的错误次数计算决策的预期损失。其方程如下：\n\n`Expected Loss\
  \ = (Number of Mistakes + 1) / (Number of Data Points + 2)`\n\n\n\n\n\n## 5.9 基于实例的学习\n\
  \n基于实例的学习，也称为基于示例的学习，是一种机器学习形式，其中模型通过存储和分类单个示例来学习，而不是遵循预定义规则。它是一种懒惰学习形式，因为模型仅在引入新实例时才执行分类。基于实例学习模型的方程通常表示为：\n\
  \n`Predicted Output = f(Inputs, Instances)`\n\n该方程表明，模型的预测输出是输入和实例的函数。实例是用于训练模型的数据点，可能包括输入值和输出值。模型会查看实例并利用它们来预测新输入的输出。\n\
  \n`K`-最近邻 (`KNN`) 是基于实例学习算法的一个例子。它是一种简单而有效的分类和回归技术。新的实例根据其在训练集中 `K` 个最近邻居的多数类别进行分类。例如，如果我们有一个包含花卉物种的数据集，其属性包括花瓣长度、宽度和萼片长度，我们就可以使用\
  \ `KNN` 根据其属性确定新花卉的物种。\n\n另一个例子是基于案例的推理 (`CBR`)。这是一种利用过去经验（案例）来解决新问题的解决问题技术。`CBR`\
  \ 通过从案例库中检索相似案例、调整解决方案以适应新问题，并将解决方案作为新案例保留以供将来使用来工作。例如，如果我们有一个医学诊断的案例库，我们就可以使用 `CBR`\
  \ 根据患者的症状和病史诊断新患者。\n\n当数据存在噪声或特征之间的关系复杂时，基于实例的学习是有益的。此外，它允许灵活和自适应学习，因为模型可以轻松地纳入新实例并相应地调整其分类规则。\n\
  \n然而，基于实例的学习也可能计算成本高昂，并且如果数据集过大或特征数量过高，容易出现过拟合。它还要求仔细选择距离度量，以确保相似实例能够被正确识别。\n\n\
  ## 5.10 懒惰学习和急切学习\n\n学习是我们生活不可或缺的一部分。我们从经验、周围的人以及各种知识来源中学习。在机器学习中，学习有两大类：懒惰学习和急切学习。\n\
  \n懒惰学习是一种在系统等待查询发出后再使用训练数据进行预测的学习类型。这也称为基于实例的学习，因为它使用特定的数据实例来进行预测。懒惰学习模型的方程如下：\n\
  \n```\nF(x) = argmin h∈H Σi=1nL(h(x_i), (y_i))\n```\n\n该方程表明，懒惰学习模型的输出是从假设集 (`H`)\
  \ 中选择使每个输入 (`x_i`) 及其对应输出 (`y_i`) 的损失 (`L`) 之和最小化的假设 (`h`)。换句话说，懒惰学习模型通过最小化总误差来找到最适合数据的假设。一个例子是\
  \ `K`-最近邻算法。在这里，系统等待查询发出，然后在训练数据中查找 `K` 个最近邻居，并利用它们的输出来进行预测。\n\n另一方面，急切学习是一种在任何查询发出之前，系统就从训练数据中学习模型的\
  \ learning 类型。这也称为基于模型的学习。急切学习模型的方程如下：\n\n`Loss = f(w) + λR(w)`\n\n其中 `w` 表示模型的权重，`f(w)`\
  \ 是损失函数，`λR(w)` 是正则化项。\n\n损失函数量化了预测输出与实际输出之间的差异，而正则化项则惩罚较大的权重以防止过拟合。模型的目标是最小化损失函数和正则化项。急切学习的一个例子是决策树算法。在这里，系统从训练数据中构建一个树状模型，可用于预测任何查询。\n\
  \n这两种学习方式各有优缺点。懒惰学习在计算上成本较低，因为它不需要训练或构建模型。然而，在进行预测时可能较慢，因为它对每个查询都依赖训练数据。另一方面，急切学习在进行预测时速度更快，因为模型已经构建完成。然而，急切学习在计算上可能成本高昂，需要从训练数据中构建模型。\n\
  \n因此，当训练数据庞大且查询不频繁时，懒惰学习更合适。当查询频繁且训练数据较小时，急切学习更合适。最终，选择使用哪种学习方式取决于计算成本与预测准确性之间的权衡。\n\
  \n## 5.11 生成式学习\n\n生成式学习是一种机器学习方法，其包括构建一个代表数据生成过程的模型。这是通过获取数据内部基本模式和联系的知识，然后利用这些信息生成与现有数据相似的新实例来实现的。生成式学习与判别式学习不同，因为它涉及构建能够预测特定样本类别标签的模型。\n\
  \n当数据稀缺或数据异常复杂时，生成式学习具有优势。通过理解其底层结构，生成模型能够生成与原始数据相似的新实例。例如，考虑一个包含手写数字的数据集。生成模型能够学习数据内部的基本模式和联系，然后利用这些信息生成与原始数据非常相似的手写数字新实例。\n\
  \n生成式学习模型有多种类型，如概率、生成、潜在变量和生成对抗网络。\n\n概率模型采用概率论来阐明给定数据中变量之间的相互联系。一个实例是朴素贝叶斯分类器。它是一种常用的用于文本分类的简单概率模型。该模型获取每个词在每个类别中出现的可能性，然后利用这些信息预测给定文本样本的类别\
  \ designation。\n\n换句话说，决策的期望损失是通过将过去犯的错误数量除以数据点数量加二来计算的。该方程有助于确保决策的期望损失不会过高或过低。\n\
  \n学习如何踩自行车踏板是基于错误（基于失误）的学习的一个例子。当我们第一次骑自行车时，我们很可能会犯许多错误。我们可能会从自行车上摔下来，失去平衡，或朝错误的方向转向。然而，每次我们犯错时，我们都会从中学习。我们调整平衡、转向和踏板，以避免重复同样的错误。\n\
  \n基于失误界限的学习模型在人工智能和机器学习中有许多应用。例如，它可用于训练算法识别数据中的模式。通过对错误提供反馈，算法可以学习区分不同类型的数据，并在未来做出更准确的预测。\n\
  \n\n\n\n\n生成模型获取数据内部的基本模式和连接的知识，然后利用这些知识生成数据的新实例。`Gaussian mixture models` 和 `hidden\
  \ Markov models` 是生成模型的实例。`Gaussian mixture models` 估计数据的潜在分布并利用这一知识生成新的数据实例。`Hidden\
  \ Markov models` 获取数据的潜在组织结构并利用这一知识生成数据的新序列。\n\n涉及潜在变量的模型通过检测解释可观察数据的隐藏或潜在因素来揭示数据的根本框架。`Principal\
  \ component analysis (PCA)` 和 `factor analysis` 是潜在变量模型的例子。`PCA` 使用主成分通过识别解释数据变异性的成分来揭示数据的潜在结构。`Factor\
  \ analysis` 是一种统计方法，用于识别解释数据集中变量之间联系的基本因素。\n\n`Generative adversarial networks (GANs)`\
  \ 是一种生成模型，由两个神经网络组成。初始网络生成数据的新实例，而后续网络评估生成样本的质量。两个网络同时训练，以开发能够生成顶级数据实例的生成器网络。\n\n\
  ### 5.11.1 Importance of Generative Learning in Machine Learning\n\n生成学习在机器学习中的重要性源于其学习数据潜在结构的能力。这在数据量有限的情况下尤其有用。通过学习数据中的潜在模式和关系，生成模型可以生成与原始数据相似的新示例，即使只有少量数据可用。\n\
  \n例如，生成模型可用于创建现实中不存在但看起来逼真自然的人脸、动物或场景的合成图像。这些合成图像可用于各种任务，例如数据增强、图像编辑或风格迁移。\n\n生成学习的另一个优势是它可以帮助我们理解和探索数据的潜在结构和模式。例如，生成模型可用于发现影响数据的隐藏因素或维度，例如人脸图像的姿势、表情或身份，或文本文档的主题、情感或语气。然后可以操纵或控制这些潜在因素以生成数据的不同变体。\n\
  \n然而，生成学习也面临一些挑战和局限性。其中一个主要挑战是确保生成数据质量和多样性。质量是指生成数据看起来或听起来有多逼真自然，而多样性是指生成数据彼此之间以及与原始数据有多不同和多变。平衡这两个方面通常很困难，因为增加一个可能会降低另一个。例如，如果我们生成太多相似的图像或文本，它们可能看起来逼真但缺乏多样性。另一方面，如果我们生成太多多样化的图像或文本，它们可能看起来不自然或不逼真。\n\
  \n另一个挑战是评估和衡量生成模型的性能。与判别模型不同，后者可以通过将预测与真实标签进行比较来评估，生成模型没有明确的目标或标准来评判其输出。因此，很难量化生成模型的好坏。评估生成模型的可能方法之一是使用人类判断，例如评分或偏好，或使用代理指标，例如似然或距离。然而，这些方法要么是主观的，要么是间接的，可能无法涵盖生成学习的各个方面。\n\
  \n### 5.11.2 Probabilistic Models\n\n这些是用于表示数据中不确定性和随机性的数学模型。这些模型用于进行预测、识别模式和分类数据。概率模型主要有两种类型：生成式和判别式。\n\
  \n`Generative models` 用于对输入数据及其对应输出的联合概率分布进行建模。它们用于生成与训练数据相似的新数据点。例如，生成模型可用于生成与训练图像相似的新图像。\n\
  \n`Discriminative models` 用于对给定输入数据的输出的条件概率分布进行建模。它们用于将输入数据分类到不同类别。例如，判别模型可用于将电子邮件分类为垃圾邮件或非垃圾邮件。\n\
  \n`Bayes’ theorem` 是一个用于根据先验知识或证据计算事件发生的概率的公式。它以英国统计学家托马斯·贝叶斯命名。公式为：\n\n```\nP(A|B)\
  \ = P(B|A) × P(A) / P(B)\n```\n\n其中 `P(A|B)` 是在事件 B 已发生的情况下事件 A 发生的概率；`P(B|A)` 是在事件\
  \ A 已发生的情况下事件 B 发生的概率；`P(A)` 是事件 A 发生的先验概率；`P(B)` 是事件 B 发生的先验概率。\n\n`Maximum likelihood\
  \ estimation (MLE)` 是一种用于估计统计模型参数的方法。它涉及找到使似然函数最大化的参数值。似然函数是衡量模型拟合观测数据程度的函数。例如，如果我们有一组人的身高数据，我们可以使用\
  \ `MLE` 来估计身高的均值和方差。均值是所有人的平均身高，方差是身高围绕均值的变化程度。方差越高，身高差异越大。\n\n`MLE` 是统计学中非常有用且强大的方法。它可用于估计许多不同类型模型的参数，例如线性回归、逻辑回归或神经网络。它还可用于比较不同模型并查看哪个模型更适合我们的数据。\n\
  \n`Naive Bayes classifier` 是一种基于 `Bayes’ theorem` 的分类算法。它被称为“朴素”，因为它假设输入数据的特征彼此独立。该算法通过计算给定输入数据的每个类别的条件概率，然后选择概率最高的类别。例如，`naive\
  \ Bayes classifier` 可用于根据电子邮件中使用的词语将电子邮件分类为垃圾邮件或非垃圾邮件。\n\n### 5.11.3 Generative\
  \ Models\n\n`Generative models` 用于生成与训练数据相似的新数据点。它们用于各种应用，例如图像生成、文本生成和音乐生成。它们与判别模型不同，后者用于将输入数据分类到不同类别。\n\
  \n生成模型有几种类型，但其中一些最常见的是如下：\n\n* `Gaussian Mixture Models (GMMs)`: 这些用于将复杂的数据分布建模为更简单的高斯分布的组合。它们通常用于图像和语音识别应用。例如，在图像识别中，`GMMs`\
  \ 可用于对图像中肤色的分布进行建模。这在人脸检测等应用中很有用，其目标是将皮肤区域与非皮肤区域分离。同样，在语音识别中，`GMMs` 可用于对不同音素的分布进行建模，音素是语音的基本单位。通过对音素的分布进行建模，`GMMs`\
  \ 可用于识别所说的话。\n\n\n\n\n\nGMMs 也常用于聚类应用中，其目标是将相似的数据点分组。在这种情况下，GMM 可用于对数据的分布进行建模，然后根据数据点属于各个高斯分布的可能性对数据点进行聚类。\n\
  \n### Hidden Markov Models (HMMs)\n这些模型用于对数据序列进行建模，其中系统的状态无法直接观察。它们常用于语音识别和 NLP\
  \ 应用中。例如，HMM 可用于对某人的语音进行建模，然后识别该人所说的话。详细来说，HMM 由两种类型的变量组成：隐藏状态和观测。隐藏状态是影响观测数据的潜在变量，但它们无法直接测量。观测是被记录并可见的变量。隐藏状态与观测之间的关系使用概率分布进行建模。HMM\
  \ 有两组概率：转移概率和发射概率。转移概率描述了从一个隐藏状态移动到另一个隐藏状态的可能性。发射概率描述了从一个隐藏状态生成一个观测的可能性。\n\n例如，假设我们想用\
  \ HMM 来建模天气。我们可以定义两个隐藏状态：低压和高壓。我们还可以定义两个观测：下雨和干燥。转移概率告诉我们从低压转到高压，或反之的可能性。发射概率告诉我们在特定气压下下雨或干燥的可能性。\n\
  \nHMM 可以使用历史数据进行训练以估计转移概率和发射概率。这可以使用 Baum–Welch 或前向-后向等算法完成。训练完成后，HMM 可用于根据观测序列解码最可能的隐藏状态序列。这可以使用\
  \ Viterbi 算法等算法完成。\n\n使用 HMM 的一些应用示例有：\n\n- Speech recognition: An HMM can be used\
  \ to model the speech signals of a person and then recognize the words they are\
  \ saying.\n- Activity recognition: An HMM can be used to model the actions of a\
  \ person or an object from a video and then recognize what they are doing.\n- Gene\
  \ finding: An HMM can be used to model the DNA sequences of an organism and then\
  \ find the regions that encode proteins.\n\nHMMs 有用之处在于它们可以捕捉数据的序列特性并处理观测中的不确定性和变异性。然而，它们也有一些局限性：\n\
  \n- 它们假设隐藏状态遵循马尔可夫性质，这意味着当前状态仅取决于前一个状态，而不取决于任何其他过去状态。\n- 它们假设在给定隐藏状态的情况下观测是独立的，这意味着不同观测之间没有相关性。\n\
  - 它们可能需要大量数据才能准确训练并避免过拟合或欠拟合。\n\n### Autoencoders\nAutoencoders 是训练用于重构输入数据的神经网络。它们用于学习输入数据的压缩表示，可用于图像生成和异常检测等任务。例如，autoencoder\
  \ 可用于通过学习输入人脸图像的特征来生成新的面部图像。\n\n## 5.11.4 Latent Variable Models\n\n这是一种统计模型，通过引入未观测和隐藏变量的概念，即潜在变量，来描述不同变量之间复杂的关系。这些模型用于在数据中发现无法直接观察到的模式和结构。\n\
  \n有不同类型的潜在变量模型，但其中最常见的是 PCA、因子分析和潜在狄利克雷分配 (`LDA`)。\n\n`PCA` 是一种统计方法，用于通过找到能解释数据中大部分方差的较少数量的变量来降低数据集的维度。`PCA`\
  \ 常用于金融等领域，可用于从股市数据中提取信息，或在生物学中，可用于分析基因表达数据。\n\n因子分析是另一种用于寻找解释观测变量之间相关性的潜在因子的方法。换句话说，它有助于识别影响观测变量的共同因子。例如，在心理学中，它可用于识别影响不同行为的潜在人格特征。\n\
  \n潜在狄利克雷分配是一种在 NLP 中用于识别文本语料库中主题的模型。它常用于情感分析等应用中，可用于识别文本的整体情感，或在主题建模中，可用于将相似的文章分组在一起。\n\
  \n## 5.11.5 Generative Adversarial Networks\n\n生成对抗网络，或 GANs，是一种用于生成与原始训练数据相似的新数据的\
  \ ML 模型。GANs 由两个神经网络组成：生成器和判别器。生成器负责从随机噪声中创建新样本，而判别器负责区分生成样本和真实样本。\n\n生成器神经网络以随机噪声向量作为输入并生成与训练数据相似的新样本。判别器神经网络然后以生成的样本和来自训练数据的真实样本作为输入并尝试区分它们。随着训练的进行，生成器网络变得更擅长生成可以欺骗判别器网络的逼真样本，而判别器网络变得更擅长区分真实样本和伪造样本。\n\
  \nGANs 有广泛的应用，其中一些列在下面：\n\n- Image synthesis: To generate realistic images that\
  \ can be used in a variety of applications, such as video games, movies, and virtual\
  \ reality.\n- Data augmentation: To generate new data samples that can be used to\
  \ train ML models. This can be useful in cases where the amount of training data\
  \ is limited.\n- Style transfer: To transfer the style of one image onto another.\
  \ This can be used to create new images with a specific style, such as converting\
  \ a photograph into a painting.\n- Text generation: To generate new text data, such\
  \ as product descriptions or news articles.\n- Drug discovery: To generate new molecules\
  \ that can be used in drug discovery. This can help to speed up the process of discovering\
  \ new drugs.\n\n## 5.11.6 Future Directions in Generative Learning\n\n生成学习在近年取得了长足进步，并且有几个令人兴奋的方向正在发展。生成学习的未来方向包括：\n\
  \n- Improved image synthesis: While GANs have been successful in generating realistic\
  \ images, there is still room for improvement in terms of image quality and diversity.\
  \ Future research in generative learning will focus on developing more advanced\
  \ models that can generate higher quality and diverse images.\n- Multimodal generation:\
  \ Multimodal generation is the ability to generate data that combines multiple modalities,\
  \ such as text, audio, and images. This can be useful in applications like virtual\
  \ assistants, where the system needs to respond with a combination of text and audio.\n\
  - Video synthesis: While GANs have been successful in generating static images,\
  \ there is still a long way to go in terms of video synthesis. Future research in\
  \ generative learning will focus on developing models that can generate realistic\
  \ and diverse videos.\n- Improved text generation: Text generation is another area\
  \ where generative learning has made significant progress. However, there is still\
  \ scope for improvement in terms of generating text that is more coherent and human-like.\n\
  \n\n\n\n\n•医疗保健的生成建模：生成建模正被用于医疗保健中生成可用于训练机器学习模型的合成数据。该领域未来的研究将重点开发能够生成逼真且多样化的医学图像和数据的模型。\n\
  \n•对抗攻击：对抗攻击是一种网络攻击类型，攻击者可以通过对输入数据添加微小、难以察觉的更改来欺骗 ML 模型。生成学习可用于开发能够检测并防御对抗攻击的模型。\n\
  \n### 5.12 一致学习\n\n5.12Consistent Learning\n\n算法 `A` 对于概念类 `C` 使用假设 `H` 而言是一致学习器，如果\
  \ ∀`*n*`，∀`*c*` ∈ `*C*`[*n*]，且∀`*m*`，给定(`*x*[1]`,`*C*(*x*[1])`)，⋯，(`*x*[*m*]`,`*C*(*x*[*m*])`)\
  \ 作为输入，其中 `*x*[*i*]` ∈ `*X*`[*n*] 使得 ∀`*i*` = 1⋯`*m*`，`*h*`(`*x*[*i*]`) = `*c*`(`*x*[*i*])。如果\
  \ `A` 的运行时间在多项式 `n`、size (`C`) 和 `m` 中，则称 `A` 为高效一致学习器。\n\n#### 5.12.1 Vapnik–Chervonenkis\
  \ (VC) 维数\n\n一致学习器可用于在输出假设来自规模不太大且为多项式的类时开发 PAC 学习算法。如果输出假设大小为无限，则上述结果无法应用。在这种情况下，使用\
  \ VC 维数。\n\n破碎：假设我们有两个点。线性分类器能否正确分类这两个点的标记？这两个点可以以四种不同的方式进行标记（Fig. 5.4）。\n\n![](img/f5-4.jpg)\n\
