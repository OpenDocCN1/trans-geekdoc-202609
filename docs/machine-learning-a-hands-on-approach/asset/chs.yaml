  \ spam) * P(not spam))`\n`= 0.5 * 0.01 * 0.4 / (0.5 * 0.01 * 0.4 + 0.1 * 0.05 *\
  \ 0.6) = 0.25`\n\n`P(not spam | free trial offer and john@example.com)`\n\n\n\n\n\
  \n`= P(free trial offer and john@example.com | not spam) * P(not spam) / P(free\
  \ trial offer and john@example.com)`\n\n`= P(free trial offer | not spam) * P(john@example.com\
