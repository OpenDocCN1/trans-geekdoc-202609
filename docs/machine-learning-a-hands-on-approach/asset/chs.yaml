  这种方法的最大缺点是它是一个耗时过程，如果假设空间非常大则不实用。虽然不实用，但它为比较其他概念学习算法的性能设定了标准。\n\n为了进一步简化，我们在以下假设下进行公式化：\n\
  \n所有假设的概率相等，即 $P\\left( h \\right) = \\frac{1}{\\left| H \\right|}\\forall h \\\
  in H$\n\n似然概率定义为 $P\\left( {D\\text{|}h} \\right) = \\left\\{ \\begin{matrix} {1,}\
  \ & {\\text{if}\\, h\\left( x_{i} \\right) = c_{i}} \\\\ {0,} & \\text{else} \\\\\
  \ \\end{matrix} \\right.$\n\n如果 `h (x[i] )= c[i]` 则我们称该假设是一致的，否则它是不一致的。\n\n基于假设，很明显对于所有不一致的假设，`P\
  \ (h|D) = 0`。\n\n对于一致的假设，按如下计算\n\n$\\left. P\\left( {h\\text{|}D} \\right) = \\\
  frac{\\text{Likelihood} \\times \\text{Prior}}{\\text{Evidence}}\\Rightarrow\\frac{1\
  \ \\times \\frac{1}{\\left| H \\right|}}{P\\left( D \\right)} \\right.$\n\n证据按如下计算\n\
  \n$P\\left( D \\right) = \\sum\\limits_{h_{i} \\in H}P\\left( {D\\text{|}h_{i}}\
  \ \\right)P\\left( h_{i} \\right)$\n\n假设空间中的每个假设要么是一致的，要么是不一致的。\n\n设 `H[1]` 表示所有一致假设的集合，`H[2]`\
  \ 表示所有不一致假设的集合。设 `n[1]` 表示 `H[1]` 的基数，`n[2]` 表示 `H[2]` 的基数。则，\n\n$P\\left( D \\\
  right) = \\sum\\limits_{h_{i} \\in H_{1}}P\\left( {D\\text{|}h_{i}} \\right)P\\\
  left( h_{i} \\right) + \\sum\\limits_{h_{i} \\in H_{2}}P\\left( {D\\text{|}h_{i}}\
  \ \\right)P\\left( h_{i} \\right)$\n\n$\\left. \\Rightarrow\\sum\\limits_{h_{i}\
  \ \\in H_{1}}1 \\times \\frac{1}{\\left| H \\right|} + \\sum\\limits_{h_{i} \\in\
  \ H_{2}}0 \\times \\frac{1}{\\left| H \\right|} \\right.$\n\n$\\left. \\Rightarrow\\\
  sum\\limits_{h_{i} \\in H_{1}}\\frac{1}{\\left| H \\right|} \\right.$\n\n$\\left.\
  \ \\Rightarrow\\frac{n_{1}}{\\left| H \\right|} \\right.$\n\n因此，我们可以写出一致假设的后验概率为\n\
  \n$\\left. P\\left( {h\\text{|}D} \\right) = \\frac{\\text{Likelihood} \\times \\\
  text{Prior}}{\\text{Evidence}}\\Rightarrow\\frac{1 \\times \\frac{1}{\\left| H \\\
  right|}}{P\\left( D \\right)}\\Rightarrow\\frac{1 \\times \\frac{1}{\\left| H \\\
  right|}}{\\frac{n_{1}}{\\left| H \\right|}}\\Rightarrow\\frac{1}{n_{1}} \\right.$\n\
  \n### 8.5.4.1 Bayes’ Optimal Classifier\n\n\n\n\n\n贝叶斯定理用于计算条件概率。同样的方法也用于确定最大后验概率（`MAP`）。出现的一个普遍问题是“最可能的假设是什么？”或“新实例最可能的分类是什么？”。为了解答这些问题，使用了贝叶斯最优分类器。\n\
  \n设训练集表示为 `D`，测试集表示为 `V`。设 `v[i] ∈ V` 为测试数据集 `V` 的一个实例。使用贝叶斯最优分类器对新实例 `v[i]` 的最优分类确定为\n\
  \n(8.12)\n\n$\\left. \\begin{matrix} {\\arg\\max} \\\\ {v_{i} \\in V} \\\\ \\end{matrix}\\\
  sum\\limits_{h_{j} \\in H}P\\left( v_{i} \\middle| h_{j} \\right)P(h_{j} \\middle|\
  \ D) \\right.$\n\n考虑三个假设 `h[1]`、`h[2]`、`h[3]`，其后验概率分别为 0.45、0.3 和 0.25，其中 `h[1]`\
  \ 属于正类，而 `h[2]` 和 `h[3]` 属于负类。由于 `h[1]` 的后验概率较高，`h[MAP]` 一个新实例 `x` 被识别为 `x ∈ h[1]`。\n\
  \n`P(h[1]|D)=0.45`; `P(positive|h[1])=1`; `P(negative|h[1])=0`\n\n`P(h[2]|D)=0.3`;\
  \ `P(positive|h[2])=0`; `P(negative|h[2])=1`\n\n`P(h[3]|D)=0.25`; `P(positive|h[3])=0`;\
  \ `P(negative|h[3])=1`\n\n$\\left. \\sum\\limits_{h_{i} \\in H}P\\left( {\\text{positive}\\\
  left| h_{i} \\right.} \\right)P(h_{i} \\middle| D) = 0.45 \\right.$\n\n$\\left.\
  \ \\sum\\limits_{h_{i} \\in H}P\\left( {\\text{negative}\\left| h_{i} \\right.}\
  \ \\right)P(h_{i} \\middle| D) = 0.55 \\right.$\n\n然而，根据贝叶斯最优分类器，可以确定为\n\n$\\left.\
  \ \\begin{matrix} {\\arg\\max} \\\\ {v_{i} \\in V} \\\\ \\end{matrix}\\sum\\limits_{h_{j}\
  \ \\in H}P\\left( v_{i} \\middle| h_{j} \\right)P(h_{j} \\middle| D)\\Rightarrow\\\
  begin{matrix} {\\arg\\max} \\\\ {v_{i} \\in V} \\\\ \\end{matrix}\\left( {0.45,0.55}\
  \ \\right) = 0.55 \\right.$\n\n贝叶斯最优分类器表明新实例 `x` 属于负类。\n\n### 8.5.4.2 贝叶斯信念网络\n\n\
  朴素贝叶斯分类器假设对于给定的目标值，所有变量或属性都是条件独立的，而贝叶斯信念网络允许对变量子集进行条件独立。贝叶斯信念网络或简称为贝叶斯网络提供了一组变量上的概率分布。\n\
  \n设 `X = (X[1], X[2],∙∙∙, X[n] )` 表示一组随机变量，其中每个 `X[i] ∈ V(X[i])`。贝叶斯网络是一个有向无环图，它将\
  \ `X` 上的联合分布指定为每个节点上的条件分布的乘积。它表示为\n\n(8.13)\n\n$\\left. P\\left( {X_{1} = x_{1},X_{2}\
  \ = x_{2},\\cdots,X_{n} = x_{n}} \\right) = \\prod\\limits_{i = 1}^{n}p(x_{i} \\\
  middle| \\text{parents}\\left( x_{i} \\right)) \\right.$\n\n考虑一个简单的贝叶斯网络（Fig. 8.10）。\n\
  \n![](img/f8-10.jpg)\n\nFigure 8.10 简单贝叶斯信念网络的示例\n\n`P(A,B,C) = P(C|A,B)P(A)P(B)`\n\
  \n对于贝叶斯网络，存在两个组成部分——一个图形结构用于显示条件独立性假设，以及每个变量给定其父节点的概率值。有向边表示直接依赖。任意两个变量之间不存在边表示条件独立。\n\
  \n如果假设图仅有三个节点 `A`、`B` 和 `C` 且没有任何边，则表示所有变量 `A`、`B` 和 `C` 都是条件独立的。在这种情况下，边际独立性使用联合概率分布定义（概率的交叉乘积规则）为\n\
  \n`P(A,B,C) = P(A)P(B)P(C)`\n\n考虑贝叶斯网络，其中 `B` 和 `C` 在给定 `A` 的条件下独立（Fig. 8.11）。\n\
  \n![](img/f8-11.jpg)\n\nFigure 8.11 B 和 C 在给定 A 的条件下独立的贝叶斯网络\n\n`P(A,B,C) = P(B|A)P(C|A)P(A)`\n\
  \n例如，`X` 在家中安装了报警器以检测其不在时发生的盗窃。报警器有时即使行人经过房屋也会响应。`Y` 和 `Z` 是 `X` 的邻居，他们向他保证当报警器响起时会打电话（Fig.\
  \ 8.12）。\n\n![](img/f8-12.jpg)\n\nFigure 8.12 表示不同事件或状态的随机变量 T、PD、A、Y 和 Z\n\n`P(T\
  \ ,PD, A,Y ,Z ) = P(Y |A)P(Z|A)P(A|T ,PD)P(T )P(PD)`\n\n给定条件独立性表为\n\n`P(T = True)\
  \ = 0.002 ⇒ P(T = False) = 0.998`\n\n`P(PD = True) = 0.001 ⇒ P(PD = False) = 0.999`\n\
  \nTable 8.16 Table with random variables T, PD, and P(A)\n\n| T | PD | P(A = True)\
  \ | P(A = False) |\n| --- | --- | --- | --- |\n| True | True | 0.94 | 0.06 |\n|\
  \ True | False | 0.95 | 0.05 |\n| False | True | 0.69 | 0.31 |\n| False | False\
