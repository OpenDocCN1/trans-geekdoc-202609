  | False | 0.05 | 0.95 |\n\nTable 8.18 Table with random variables A and P(Z)\n\n\
  | A | P(Z = True) | P(Z = False) |\n| --- | --- | --- |\n| True | 0.75 | 0.25 |\n\
  | False | 0.02 | 0.98 |\n\n问题陈述：计算在无盗窃且无行人，但 `Y` 和 `Z` 给 `X` 打电话的情况下 `A` 的概率。\n\n\
  `P(Y ,Z, A,¬T ,¬PD) = P(Y |A)P(Z|A)P(A|¬T ,¬PD)P(¬T )P(¬PD)`\n\n⇒ `P(Y ,Z, A,¬T\
  \ ,¬PD) = 0.91× 0.75 × 0.001× 0.998 × 0.999 = 0.00068045`\n\n因此，贝叶斯信念网络是一个表示联合分布的有向无环图。该网络中的推理或推理能够高效地计算适当的条件概率。\n\
  \n### 8.5.4.3 期望最大化算法\n\n期望最大化（`EM`）和贝叶斯信念网络（`BBNs`）都是概率建模和统计推断领域中的两种强大框架。`EM` 是一种迭代方法，用于在统计模型依赖于未观测的潜在变量时寻找参数的最大似然或\
  \ `MAP` 估计。`BBNs` 另一方面是一种概率图模型，通过有向无环图表示一组变量及其条件依赖关系。`EM` 与 `BBNs` 之间的关系在于 `EM`\
  \ 可用作在复杂 `BBNs` 中执行高效参数估计的计算方法，尤其是在处理不完整数据集时。\n\n数据集包含两组变量，即观测变量和未观测变量。观测变量是直接测量的。未观测或隐藏变量是从观测变量推断出来的。隐藏变量也称为潜在变量。定义在同时具有观测变量和未观测变量的数据集上的模型称为潜在变量模型。\n\
  \n`EM` 算法可用于多种目的，如预测数据集中缺失值、寻找局部最大似然参数等。\n\n步骤\n\n输入：不完整数据\n\n步骤 1：初始化：用初始值初始化所有参数。然后提供不完整数据。我们假设数据来自概率分布。\n\
  \n步骤 2：期望：基于观测数据猜测缺失数据的值。\n\n步骤 3：最大化：将期望步骤中生成的数据补全以更新参数值。\n\n步骤 4：收敛检查：如果值未收敛，则转到步骤\
  \ 2 并重复直到收敛。\n\n假设有两枚硬币，`C1` 和 `C2`。用 `C1` 抛硬币得到正面的概率为 `θ[1]`，用 `C2` 抛硬币得到正面的概率为\
  \ `θ[2]` 我们需要通过进行各种实验来找到 `θ[1]` 和 `θ[2]` 的值。\n\n设每枚硬币抛 10 次，我们选择重复实验 5 次。每枚硬币在每次试验中的结果在\
