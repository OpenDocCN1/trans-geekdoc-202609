  \n### 12.8.2 流程自动化\n\n\n\n\n\n流程自动化涉及自动化重复或手动任务，可提高金融运营的效率和准确性。`ML` 可以帮助金融机构通过使用机器人流程自动化\
  \ (`RPA`) 来自动化各种流程，`RPA` 是一种使用软件机器人或数字员工执行模仿人类操作的任务的技术。例如，`ML` 可以帮助会计师事务所通过使用光学字符识别\
  \ (`OCR`) 来自动化数据录入和对账，`OCR` 是一种可以将扫描图像或文档转换为可编辑文本的技术，用于从发票、收据或银行对账单中提取数据。`ML` 还可以帮助税务顾问通过使用\
  \ `NLP` 来自动化税务准备和申报，`NLP` 用于解释税法和法规并生成税务表格。\n\n### References\n• Machine Learning\
