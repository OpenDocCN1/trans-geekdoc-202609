  \n### 10.2.4 梯度下降\n\n梯度下降是一种一阶优化问题。梯度是多元函数导数的推广。如果 `f (x[1], x[2]∙∙∙,x[n] )` 是若干变量的可微标量函数，则其梯度是一个向量，其分量为该函数\
  \ `f` 的 *n* 个偏导数。因此，它是一个向量值函数。\n\n梯度表示函数图像切线的斜率。它指向函数增长最快的方向，其大小为图像的斜率。它通过最小化成本或损失函数来寻找模型的最佳参数或权重。这是一个迭代过程，其中参数在每次迭代中都被调整以达到最优值。\n\
  \n要使用梯度下降找到函数的局部最小值，我们应按当前点处函数梯度的负值成比例地取值。如果我们朝梯度的正方向移动，则会接近函数的局部最大值，称为梯度上升。\n\n\
  梯度下降也称为最速下降法或最速下降法。使用梯度下降的两个要求是函数应可微且为凸。\n\n梯度下降算法：梯度下降算法的思路是，在每次迭代中，使用当前点和学习率计算下一个点。它减去该值，因为我们需要最小化成本函数。它用方程表示\n\
  \n`p[n + 1] = p[n] - η∇f(p[n])`，\n\n其中 `p[n]` 是当前点，`p[n+1]` 是下一个点，`η` 是学习率，`∇f(p[n])`\
  \ 表示当前点的梯度。学习率的优点在于它控制收敛过程。如果值很小，则收敛会延迟。如果值很大，则收敛无法保证。\n\n例如，`f (x) = x² - 3x`。\n\
  \n`f′ (x) = 2x - 3` 且 `f′′ (x) = 2`，这保证了函数是凸的。\n\n函数的图像如图 Fig. 10.8 所示。\n\n![](img/f10-8.jpg)\n\
  \nFigure 10.8 函数 `x² − 3x` 的图像\n\n假设我们位于点 15。我们必须使用梯度下降算法从该点向局部最小值移动。\n\nTable 10.7\
  \ 追踪梯度下降算法\n\n| 当前点 || 使用梯度下降方程 `p[n+1] = p[n] - 0.1* (2x - 3)` 的下一个点 || 当前点 ||\
  \ 使用梯度下降方程 `p[n+1] = p[n] - 0.1* (2x - 3)` 的下一个点 |\n| --- | --- | --- | --- |\n\
