  \ R 中的逻辑回归\n\n逻辑回归是一种回归分析类型，它根据一个或多个预测变量（例如年龄、性别、收入等）对二元结果（例如是/否、成功/失败等）的概率进行建模。逻辑回归模型使用逻辑函数（也称为\
  \ sigmoid 函数）将预测变量的线性组合映射到 0 到 1 之间的值，表示结果为 1 的概率。逻辑函数形式为：`p = 1 / (1 + exp(-z))`，其中\
  \ `z` 是预测变量及其系数的线性组合。逻辑回归模型的系数可以使用最大似然估计来估计，该方法找到使观察到的数据的可能性最大化的值。\n\n在 R 中，我们可以使用\
  \ `glm` 函数拟合逻辑回归模型，将 `family` 参数指定为 `binomial`。例如，假设我们有一个名为 `students` 的数据集，其中包含\
  \ 100 名学生的信息，例如他们的性别（男或女）、他们的数学成绩（满分 100 分）以及他们是否通过或未通过课程（通过或未通过）。我们希望根据学生的性别和数学成绩对通过课程的概率进行建模。我们可以使用以下代码拟合逻辑回归模型：\n\
  \n``` \n# Load the data\nstudents <- read.csv(\"students.csv\")\n\n# Fit the model\n\
  model <- glm(pass ~ gender + math, data = students, family = binomial)\n\n# Summarize\
  \ the model\nsummary(model)\n```\n\n\n\n\n\nThe summary output shows the estimated\
  \ coefficients, their standard errors, z-values, and p-values. The coefficients\
  \ indicate how much the log-odds of passing the course change for a unit change\
  \ in the predictor variable, holding other variables constant. For example, the\
  \ coefficient for `gendermale` is `-0.76`, which means that male students have lower\
  \ log-odds of passing the course than female students by 0.76 units, on average.\n\
  \nThe p-value for `gendermale` is 0.04, which means that this effect is statistically\
  \ significant at the 5% level. The coefficient for `math` is 0.08, which means that\
  \ for every one point increase in `math` score, the log-odds of passing the course\
  \ increase by 0.08 units, on average. The p-value for `math` is 0.001, which means\
  \ that this effect is also statistically significant at the 5% level. To obtain\
  \ the predicted probabilities of passing the course for each student, we can use\
  \ the `predict` function with the `type` argument set to `response`.\n\nFor example,\
  \ to get the predicted probabilities for the first 10 students in the dataset, we\
  \ can use:\n\n```r\npredict(model, newdata = students[1:10,], type = \"response\"\
  )\n```\n\nThe output shows that the first student has a predicted probability of\
  \ 0.82 of passing the course, while the second student has a predicted probability\
  \ of 0.54, and so on.\n\nTo evaluate the performance of the logistic regression\
  \ model, we can use various metrics such as accuracy, sensitivity, specificity,\
  \ precision, recall, F1-score, ROC curve, AUC, etc. These metrics compare the predicted\
  \ outcomes with the actual outcomes and measure how well the model classifies the\
  \ data\n\nIn R, we can use various packages and functions to calculate these metrics.\
  \ For example, we can use the `caret` package and its `confusionMatrix` function\
  \ to obtain a confusion matrix and some metrics such as accuracy and kappa.\n\n\
  ```r\n# Load the caret package\nlibrary(caret)\n\n# Create a vector of predicted\
  \ outcomes based on a cutoff value of 0.5\npred <- ifelse(predict(model, type =\
  \ \"response\") > 0.5, \"pass\", \"fail\")\n\n# Create a confusion matrix and print\
  \ some metrics\nconfusionMatrix(pred, students$pass)\n```\n\nThe output shows that\
  \ the model has an accuracy of 0.81 and a kappa of 0.61, which are both reasonably\
  \ good values. The confusion matrix shows that out of 100 students, 41 were correctly\
  \ classified as pass (true positives), 40 were correctly classified as fail (true\
  \ negatives), 9 were incorrectly classified as pass (false positives), and 10 were\
  \ incorrectly classified as fail (false negatives).\n\n# 13.32.20 SVM in R\n\n```r\n\
