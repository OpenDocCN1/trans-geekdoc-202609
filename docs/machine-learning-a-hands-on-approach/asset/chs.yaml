  \ spam) * P(spam) + P(free trial offer | not spam) * P(john@example.com | not spam)\
  \ * P(not spam))`\n\n`= 0.1 * 0.05 * 0.6 / (0.5 * 0.01 * 0.4`\n\n考虑下面给出的样本数据集：\n\
