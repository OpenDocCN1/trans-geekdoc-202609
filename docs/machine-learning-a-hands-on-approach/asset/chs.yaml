  \n#### 感知器算法\n\n1. 将权重初始化为零向量。\n2. 取第一个输入并执行乘积之和。然后应用激活函数。\n3. 如果预测输出与原始输出匹配，则不执行任何操作\n\
  4. 如果预测输出与实际输出不匹配，则使用感知器学习规则调整权重。\n5. 考虑下一个输入并重复该过程，直到完成一个输入周期。\n6. 重复步骤 2 到 5 的过程，直到算法收敛。\n\
