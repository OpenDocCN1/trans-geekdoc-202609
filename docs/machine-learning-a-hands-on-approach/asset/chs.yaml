  \n### 矩生成函数 (Moment Generating Function)\n\n这是一个数学概念，用于描述概率和统计学中的随机变量。它是理解概率分布特征的有效工具，包括均值、方差、偏度和峰度。\n\
  \n\n\n\n\n# 示例 6：指数分布模拟了泊松过程中事件发生之间的时间。指数分布的矩生成函数（MGF）公式如下：\n\n`M(t) = λ / (λ -\
  \ t)`\n\n我们可以通过对 `MGF` 求一阶导数并在 `t = 0` 处求值，来确定指数分布的期望值，即 `1//λ`。同样，我们可以通过求二阶导数并在\
  \ `t = 0` 处求值来获得方差，即 `1/λ²`。\n\n均值、方差、偏度和峰度是可以通过 `MGFs` 理解的矩的示例。它们在机器学习（ML）中被广泛用于对数据建模和估计概率分布参数。\n\
  \n## 2.14 最大似然估计\n\n极大似然估计（`MLE`）根据一组观测值计算概率分布的参数。在给定模型参数的情况下，最大化观测数据的似然是模型训练的一种常用机器学习技术。例如，`MLE`\
  \ 可用于线性回归，以估计减少响应变量期望值与实际值之间`差异`的系数。此外，在逻辑回归中，也可以使用 `MLE` 来估计对于给定预测变量集检测二元结果似然最大的参数。\n\
  \n贝叶斯统计框架利用概率分布来模拟不确定性，它与先验分布和后验分布有联系。在贝叶斯统计中，先验分布代表我们对模型参数的预先认知，而后验分布代表我们根据数据观测得出的修正认知。\n\
  \n被称为极大后验概率（`MAP`）估计的贝叶斯技术利用先验分布和似然函数来确定最可能出现的参数值。由于 `MAP` 旨在将数据驱动的 `MLE` 方法与贝叶斯估计的先验信息相结合，它可以被视为\
  \ `MLE` 与贝叶斯估计之间的折中。`MAP` 估计经常在机器学习中用于逻辑回归和神经网络等模型的正则化。\n\n采样技术被机器学习用于从复杂的概率分布中创建样本。采样技术被机器学习用于从复杂的概率分布中创建样本。采样技术被机器学习用于从复杂的概率分布中创建样本。例如，`MLE`\
