  \n# 8.5.5 Logistic Regression\n\nLogistic regression is a linear model used when\
  \ the output variable is binary, meaning it has two possible values: yes or no.\
  \ It attempts to model the likelihood of the output variable having one of two values.\
  \ The equation for this model is as follows:\n\n`log(odds) = β0 + β1x1 + β2x2 +...\
  \ + βp xp`,\n\nwhere `odds` is the probability of the output variable being one\
  \ of the two values; `x1`, `x2`,..., `xp` are the input variables; `β0` is the intercept;\
  \ and `β1`, `β2`,..., `βp` are the slopes.\n\nFor example, we can predict whether\
  \ someone will buy a particular product (yes/no). In order to do that, we can look\
  \ at past customer behavior, such as how often they purchased similar products from\
  \ the same company or how much money they typically spent on products from the company.\
  \ By looking at past information, we can create an ML model that can precisely predict\
  \ the likelihood of someone purchasing our product based on their past behavior.\n\
  \n\n\n\n\n一旦模型创建完成，就必须使用现有数据对其进行测试，以查看其预测结果的准确性是否足以在实际应用中使用。如果模型表现足够好，我们就可以在没有访问客户全部历史行为的情况下使用它来做出关于客户的决策；这一过程被称为预测分析，目前许多企业都在使用它来更好地围绕营销活动和客户定位策略做出决策。\n\
  \n逻辑回归可以根据阶数分为三种类型（Table 8.23）。在二项式（二元）逻辑回归中，因变量只能有两种可能的类型。在多项式逻辑回归中，因变量可以有三种或更多种可能的无序类型。最后，在序数逻辑回归中，因变量可以有三种或更多种可能的顺序类型。\n\
  \nTable 8.23 逻辑回归模型类型的特征\n\n| Characteristics || Binary logistic regression || Multinomial\
  \ logistic regression || Ordinal logistic regression |\n| --- | --- | --- | ---\
  \ |\n| Outcome || Binary outcome || Multiple outcomes || Ordered outcomes |\n| Estimation\
  \ || Maximum likelihood || Maximum likelihood || Probit or logit link function |\n\
  | Error function || Cross-entropy || Softmax || Cumulative logit link function |\n\
  | Assumptions || Independence of errors, linearity of log odds, constant variance\
  \ in the conditional distribution of the dependent variable given a value of the\
  \ predictor variables || Same as binary LR + equal probabilities across categories\
  \ || Same as binary LR + proportional odds assumption |\n| Interpretation || Odds\
  \ ratio || Probability ratios || Size measures effect |\n\n### 8.5.5.1 Binary Logistic\
  \ Regression\n\n在二元逻辑回归中，因变量只能有两个值，通常编码为 0 和 1。目标是根据自变量的值预测因变量为 1 的概率。逻辑函数用于建模自变量与因变量之间的关系。它是一条\
  \ S 形曲线，将自变量的线性组合转换为 0 到 1 之间的概率值。\n\n逻辑函数定义为：\n\n```\nP(Y=1) = 1 / (1 + e^–(b0+b1X1+b2X2+...+bnXn))\n\
  ```\n\n其中 `P(Y=1)` 是因变量为 1 的概率，`b0` 是截距，`b1`、`b2`、...、`bn` 是系数，`X1`、`X2`、...、`Xn`\
  \ 是自变量。\n\n在逻辑回归中，系数表示对应自变量每变化一个单位，因变量对数几率的变化。因变量为 1 的对数几率定义为：\n\n```\nlog(odds)\
  \ = log(P(Y=1) / (1–P(Y=1))) = b0+b1X1+b2X2+...+bnXn\n```\n\n二项式逻辑回归在机器学习中常用于预测客户流失，即客户停止使用产品或服务的概率。它也用于信用评分，以预测贷款违约的概率\n\
  \n一家银行拥有之前贷款的历史数据，包括借款人的信用评分、收入、就业历史以及是否违约的信息。利用这些数据，银行希望建立一个二项式逻辑回归模型来预测未来贷款申请人的违约概率（Table\
  \ 8.24）。\n\nTable 8.24 信用评分、收入和就业历史\n\n| Credit score || Income (in thousands) ||\
  \ Employment history (in years) || Default |\n| --- | --- | --- | --- |\n| 650 ||\
  \ 50 || 5 || 0 |\n| 700 || 60 || 7 || 0 |\n| 600 || 40 || 3 || 1 |\n| 550 || 35\
  \ || 2 || 1 |\n| 750 || 70 || 10 || 0 |\n\n在本例中我们有五个观测值，每个观测值有四个（4）个自变量和一个（1）个因变量（`default`）。我们的目标（二元逻辑回归）是创建模型以根据自变量预测违约。为了建立模型，我们可以使用二项式逻辑回归公式，该公式将二元响应变量（在本例中为违约）的概率建模为一个或多个自变量的函数。模型的输出是违约概率，范围从\
  \ 0 到 1。模型方程看起来像这样：\n\n```\nlogit(p) = b0 + b1*credit_score + b2*income + b3*employment_history\n\
  ```\n\n其中 `p` 是违约的概率，`b0` 是截距，`b1`、`b2` 和 `b3` 分别是自变量 `credit_score`、`income` 和\
  \ `employment_history` 的系数。\n\n我们可以使用模型估计的系数为新的贷款申请人做出预测。例如，一名新申请人信用评分为 620，收入为\
  \ $45,000，就业历史为 4 年。我们可以将这些值代入模型方程以获得违约概率的估计值：\n\n```\nlogit(p) = –2.576 + 0.002*620\
  \ + 0.056*45 – 0.690*4\nlogit(p) = –2.576 + 1.24\nlogit(p) = –1.336\np = 0.207\n\
  ```\n\n根据此模型，该申请人的违约概率估计为 0.207，即 20.7%。\n\n### Polynomial Regression\n\n考虑高度相关但本质上非线性的数据。在这种情况下，对数据执行多项式回归以拟合多项式方程。\n\
  \n多项式回归的一般方程形式为。\n\n```\nhθ = θ[0] + θ[1]x + θ[2]x² + ∙∙∙+ θ[m]x^m\n```\n\n多项式回归最好地近似了因变量与自变量之间的关系。多项式模型用于近似复杂的非线性关系。\n\
  \n为了找到模型多项式的合适次数，可以使用向前选择或向后选择。向前选择会增加次数直到达到最佳拟合。模型可以从二阶开始测试。在向后选择中，选择一个较高次数的多项式并降低多项式的阶数直到达到最佳拟合。\n\
  \n### 8.5.5.2 Multinomial Logistic Regression\n\n多项逻辑回归（`MLR`）是二元逻辑回归的扩展版本，允许因变量具有多于两个可能的无序类别。模型的方程如下：\n\
  \n```\nlog(odds) = β0j + β1jx1 + β2jx2 +... + βpjxp\n```\n\n其中 `j` 是因变量的类别，`x1`、`x2`、...、`xp`\
  \ 是自变量，`β0j` 是第 j 类别的截距，`β1j`、`β2j`、...、`βpj` 是第 j 类别的斜率。\n\n然后使用 softmax 函数将几率转换为概率，该函数在可能类别上产生概率分布：\n\
  \n```\nP(y=j | x) = e^(β0j + β1jx1 + β2jx2 +... + βpjxp) / (∑ k=1 to K e^(β0k +\
  \ β1kx1 + β2kx2 +... + βpkxp))\n```\n\n其中 `y` 是因变量，`j` 是类别；`x1`、`x2`、...、`xp` 是自变量，`K`\
  \ 是类别数；`β0k`、`β1k`、`β2k`、...、`βpk` 是第 k 类别的斜率。\n\n`MLR` 可用于：\n\n- 自然语言处理（`NLP`），根据其内容确定文本的分类，例如新闻文章或推文。\n\
  - 图像，根据其属性的值预测图像的类别，例如动物或植物。\n- 生物信息学，根据表达水平预测基因的类别成员资格。\n\n`MLR` 可以处理分类变量和连续变量，使其灵活且适应不同的数据类型。它还可以处理缺失数据和异常值，这些在现实世界的数据集中很常见。\n\
  \n以下是 `MLR` 在机器学习中的一些示例：\n\n情感分析：一家公司可以使用 `MLR` 根据原始文本内容本身预测客户评论的情感，例如积极、消极或中性。\n\
  \n\n\n\n\n假设一家公司想要分析其产品的客户评论以确定每条评论的情感。假设他们有一个包含 100 条评论的数据集，标记为正面、负面或中性。他们还有每个数据集的一组特征，例如正面和负面词的数量、评论的长度以及特定关键词的存在/缺失。\n\
  \n公司现在可以将此数据集拆分为训练集和测试集。然后，他们将使用训练集来训练模型，这涉及为每个特征找到权重，以最大化模型上观测数据的似然。一旦模型训练完成，公司就可以开始使用它来预测新评论的情感。\n\
  \n假设公司有一条具有以下特征的评论：\n\n正面词数量：10\n\n负面词数量：3\n\n评论长度：100 词\n\n关键词“love”的存在：是\n\n关键词“hate”的存在：否\n\
  \n给定这些特征，模型将使用训练期间学习到的权重来计算每种情感（正面、负面或中性）的概率。例如，它可能会计算：\n\n正面情感的概率：0.8\n\n负面情感的概率：0.1\n\
  \n中性情感的概率：0.1\n\n根据这些概率，模型将预测该评论的情感为正面。公司可以使用此多项逻辑回归模型来预测新评论的情感，并利用此信息改进其产品或营销策略。\n\
  \n图像识别：研究人员可以使用多项逻辑回归根据其特征，如颜色和形状，来预测图像中的鸟类物种。\n\n基因表达分析：生物学家可以使用 MLR 根据其表达水平来预测基因的类别成员资格，是否与疾病相关。\n\
  \n## 8.5.5.3 序数逻辑回归\n\n序数逻辑回归用于分类任务，其中因变量有超过两种可能的有序类别。它类似于二元和多项逻辑回归，但因变量是有序的。模型的方程如下：\n\
  \n```\nlog(odds) = β0j + β1jx1 + β2jx2 +... + βpjxp,\n```\n\n其中 `j` 是因变量的类别，`x1`、`x2`、...、`xp`\
  \ 是自变量，`β0j` 是第 j 个类别的截距，`β1j`、`β2j`、...、`βpj` 是第 j 个类别的斜率。\n\n然后将赔率通过累积分布函数转换为累积概率：\n\
  \n```\nP(y≤j | x) = 1 / (1 + e^–(β0j + β1jx1 + β2jx2 +... + βpjxp)),\n```\n\n其中\
  \ `y` 被视为因变量，`j` 是类别，自变量为 `x1`、`x2`、... 和 `xp`。\n\n序数逻辑回归在各个领域得到广泛应用，包括医疗保健、教育和社会科学。例如，序数逻辑回归可在医学领域用于根据多种临床因素，包括年龄、血压和胆固醇水平，预测疾病的严重程度。根据其学术成绩，如考试成绩、出勤率和参与度，教育中可使用序数逻辑回归预测学生的成绩。在社会科学中，序数逻辑回归可以根据人口统计变量如年龄、性别和教育，预测对政治问题的同意程度。\n\
  \n序数逻辑回归可以处理分类和连续变量，使其灵活且适应不同的数据类型。它还可以处理缺失数据和异常值，这些在现实世界的数据集中很常见。\n\n以下是 ML 中序数逻辑回归的更多示例：\n\
  \n疾病严重程度预测：医疗服务提供者可以使用序数逻辑回归根据各种临床变量，如血压、胆固醇水平和年龄，预测疾病的严重程度，如轻度、中度或重度。\n\n学生成绩预测：教师可以使用序数逻辑回归根据其学术表现，如考试成绩、出勤率和参与度，预测学生的成绩，如\
  \ A、B 或 C。\n\n政治同意预测：研究人员可以使用序数逻辑回归根据人口统计变量，如年龄、性别和教育，预测对政治问题的同意程度，如强烈同意、同意或不同意。\n\
  \n## 8.5.6 感知机\n\n感知机是一种 AI 技术，自 1960 年代以来一直用于二元分类任务。它通过将多个输入与其分配的权重相乘，然后将这些结果相加形成单一输出来工作。然后将此单一输出值与预定的阈值进行比较以做出最终的二元分类。通过调整每个输入的权重，算法可以从错误中学习并随着时间的推移提高其准确性。\n\
  \n感知机是一种线性回归算法，可用于线性和非线性分类任务。此外，通过引入输入特征的非线性变换，如多项式展开或核方法，感知机可以建模非线性决策边界，从而解决更复杂的分类问题。因此，通过对输入数据的适当特征工程，感知机可以处理线性和非线性回归任务。\n\
  \n感知机是一个节点和连接的人工神经网络，可用于 ML 解决分类问题。感知机接受图像文件及其相关数据/信息作为输入。感知机构建一个模型，该模型稍后可以使用学习到的参数生成输出。然后此输出可用于识别图像中的对象或对数据进行分类。\n\
  \n它由三个基本组件组成：输入层、权重和偏置，以及激活函数。输入层接收由感知机处理的数据。与此同时，每个特征都有与其关联的权重和偏置，在训练期间进行调整以获得最佳性能。最后，计算所有输入的加权和，该加权和通过激活函数传递以产生二元（0\
  \ 或 1）或连续（0–1）输出。\n\n激活函数：激活函数在神经网络中是必要的，因为它为模型引入非线性，使其能够从数据中学习复杂模式和特征。符号函数根据输入的符号返回+1\
  \ 或-1，不是激活函数，因为它是线性的并且不保留输入幅度的任何信息。\n\n最常用的激活函数是 sigmoid 函数和双曲正切（`tanh`）函数（Fig.\
  \ 8.13）。\n\n![](img/f8-13.jpg)\n\nFigure 8.13  不同类型的函数\n\nSigmoid 函数：此函数将输入映射到 0\
  \ 到 1 之间的值，可解释为概率。它对二元分类问题有用，但有一些缺点，如容易饱和、梯度消失且不是零中心。\n\nSigmoid 函数可以定义为：\n\n```\n\
  f(x) = 1 / (1 + exp(–x))\n```\n\n如果 sigmoid 函数的输入为 2，则输出将为 0.8808。如果输入为-2，则输出将为\
  \ 0.1192。\n\nTanh 函数：此函数将输入映射到-1 到 1 之间的值，类似于 sigmoid 但为零中心。它对分类问题也有用，但在极值处仍会遭受饱和和梯度消失。\n\
  \nSign 函数：此函数如果输入为正则输出+1，如果输入为负则输出-1。它创建一条 S 形曲线，值范围从 0 到 1。与此同时，tanh 产生对称的输出值范围在-1\
  \ 到+1 之间。符号函数不是激活函数，因为它是线性的并且不保留输入幅度的任何信息。\n\n在数学上，符号函数可以定义为：\n\n```\nf(x) = +1,\
  \ if x > 0\n      –1, if x < 0\n```\n\n\n\n\n\n如果 `sign` 函数的输入为 5，则输出将为 `+1`。如果输入为\
  \ –3，则输出将为 –1。\n\n### Step function\n它是一个分段函数，如果输入大于或等于零则输出 1，如果输入小于零则输出 0。数学上，阶跃函数可以定义为：\n\
  \n```\nf(x) = 1, if x >= 0\n      0, if x < 0\n```\n\n如果阶跃函数的输入为 3，则输出将为 1。如果输入为\
  \ –2，则输出将为 0。\n\n### Other types of activation functions\n\n* `ReLU`: 该函数如果输入为正则返回输入，否则返回\
  \ 0。它简单、快速、易于实现，并且避免了饱和和梯度消失的问题。然而，它也可能导致某些神经元死亡，如果它们从未接收到正输入，会导致稀疏表示和资源浪费。\n* `Leaky\
  \ ReLU`: 该函数是 ReLU 的修改版本，对于负输入返回一个小的负值而不是 0。其目的是通过允许负输入的梯度流动来解决神经元死亡的问题。然而，它仍然不能保证所有神经元都会激活，并且负斜率的最佳值并不明确。\n\
  * `ELU`: 该函数是 ReLU 的另一个修改版本，对于负输入返回输入的指数减 1。它具有平滑、零中心且避免神经元死亡的好处。然而，它比 ReLU 和 Leaky\
  \ ReLU 计算成本更高，并且如果输入过大，也可能导致梯度 overshooting。\n\n## Working of Perceptron\n\n###\
  \ Step 1\n将所有输入值与其对应的权重值相乘并相加以确定加权和。数学上，我们可以按如下方式计算加权和：\n\n```\n∑wi*xi = x1*w1 +\
  \ x2*w2 +…wn*wn\n```\n\n向此加权和添加一个称为偏差 `b` 的特殊项以改善模型的性能。\n\n```\n∑wi*xi + b\n```\n\
  \n### Step 2\n在交替步骤中，对加权和应用激活函数，这给我们一个值，要么是双精度形式，要么是非停止值，如下所示：\n\n```\nY = f(∑wi*xi\
  \ + b)\n```\n\n根据层数，感知器模型分为两种类型：单层和多层。\n\n### 8.5.6.1 Single-layer Perceptron Model\n\
  \n单层感知器模型是一种由前馈网络和激活阈值传递函数组成的人工神经网络类型。该模型用于用二进制输出分离线性可分对象。该算法不包含存储数据，而是为输入随机分配权重。在所有输入\
  \ `weights` 相加后，如果总和超过预定值，则输出将被激活并指示为 1。单层感知器只能学习线性可分离模式。\n\n### 8.5.6.2 Multi-layer\
  \ Perceptron Model\n\n多层感知器 `MLP` 是一种用于确定输入和输出变量之间复杂关系的复杂 AI 工具。它可用于构建线性回归和非线性回归任务的预测模型。`MLP`\
  \ 由相互连接的多个神经元层组成，每个层中的每个连接都分配有权重。输入层接收并将输入数据传递给后续层。另一方面，最终层产生预测输出。`MLP` 可以利用其众多神经元层对大型数据集中的复杂模式进行建模，使其能够有效地用于监督学习任务，例如分类和回归问题。因此，`MLPs`\
  \ 可以为各种变量之间的关系提供宝贵的见解。\n\n图像分类是 `MLPs` 在机器学习中的一个应用。`MLPs` 用于根据其内容对照片进行分类。首先，`MLP`\
  \ 在一组标记图像上进行训练，并学习识别与不同类别相关的图像中的模式。训练后，`MLP` 可以根据其内容准确地对新照片进行分类。另一个例子是在语音识别中识别所说单词。`MLP`\
  \ 在对一组所说单词的数据集进行训练后，可以识别与不同单词相关的音频信号中的模式。训练后，`MLP` 在识别新单词方面具有很高的准确度，这使其成为语音识别应用的宝贵工具。\n\
  \n以下是使用 `MLP` 的一些好处：\n\n* `MLP` 可以将复杂的非线性问题分解为较小的子问题，然后分别解决每个子问题。这是通过使用多个节点和权重层实现的，每个层都处理前一层的输出以创建更复杂的输出。例如，`MLP`\
  \ 可应用于自然语言处理、语音识别和图像识别。\n* `MLP` 对各种问题具有灵活性，因为它对小输入数据和大输入数据都有效。此外，`MLP` 可以处理高维数据并从输入数据中提取相关特征。例如，`MLP`\
  \ 可用于预测房屋价格，其中输入数据包括位置、卧室数量和平方英尺等各种因素。\n* 一旦 `MLP` 训练完成，它可以快速高效地进行预测。这是因为权重和偏差已在训练期间学习，模型可以应用这些知识对新数据进行预测。\n\
  * `MLP` 能够在大型和小型数据集上保持相同的准确率。这是因为 `MLP` 不受数据集大小的限制，并且可以适应问题的复杂性。例如，`MLP` 可用于预测客户流失，其中数据集的大小可能因公司而异。\n\
  \n`MLP` 的缺点如下：\n\n* `MLP` 需要大量的计算资源，尤其是在处理大型数据集或深度网络时。使用大量隐藏层的深度网络的训练可能是一个耗时的过程，并且需要强大的硬件。例如，使用多个\
  \ GPU 训练 `MLP` 对 `ImageNet` 等大型数据集中的图像进行分类可能需要数天甚至数周的时间。\n* `MLP` 是一个黑盒模型，因此很难解释输入变量如何影响输出。此外，与线性模型或决策树不同，`MLP`\
  \ 需要提供对模型中每个特征重要性的更清晰的见解。例如，假设使用 `MLP` 预测房屋价格。可能需要澄清哪些因素，例如卧室数量或位置，在决定价格方面最重要。\n\
  * 训练集的数据质量和模型选择的超参数会显著影响 `MLP` 性能。如果训练数据代表真实世界数据，模型的准确率将会提高。\n\n### 8.5.6.3 Limitations\
  \ of the Perceptron Model\n\n感知器模型的一个限制是激活函数中使用的硬限传递函数将输出限制为仅两个可能值，0 或 1。这意味着感知器只能将输入向量分类为两个类别，并且无法指示与分类决策相关的确定性或概率程度。例如，我们正在尝试对猫和狗的图像进行分类。在这种情况下，感知器模型将仅为每张图像输出\
  \ 0 或 1，而没有关于其决策的置信度的信息。\n\n感知器模型的另一个限制是它只能用于对线性可分的输入向量集进行分类。换句话说，分离两个类别的决策边界必须是输入特征的线性函数。如果输入向量是非线性的，则感知器模型无法准确地对它们进行分类。例如，我们正在尝试对手写数字进行分类。感知器模型可能难以区分形状相似但曲线不同的数字，例如\
  \ 6 和 8。同样，这是因为这两个数字之间的决策边界不是输入特征的线性函数。\n\n\n\n\n\n为了克服这些局限性，通常会使用更先进的 ML 模型，例如神经网络、SVM\
  \ 和决策树。\n\n## 8.5.7 支持向量机\n\n支持向量机或 SVM 是一种非线性模型，是用于分类和回归问题最受欢迎的有监督学习算法之一。SVM 算法的目的是产生优雅的线或决策边界，该边界可以将\
  \ n 维空间划分为类别，以便我们能够流畅地将新的数据点放入正确的顺序中。未来。这种优雅的决策边界称为超平面。SVM 选择有助于创建超平面的极值点向量。这些极端情况称为支持向量；因此得名算法。\n\
  \nSVM 用于 ML 任务，例如人脸检测、图像分割和文本分类。这使得 SVM 成为识别一只奇怪的猫科生物是猫还是犬科动物的完美模型。要使用 SVM 创建准确的模型，我们必须首先用许多猫和狗的图像训练我们的模型。这将使算法能够学习与每种动物相关的特征，从而能够区分它们。然后，我们可以通过向其提供有关我们奇怪生物的信息来测试此模型，并查看它为我们提供的输出。SVM\
  \ 通过从每个组中选择称为支持向量的极端情况，在两组数据之间创建决策边界——在这种情况下，猫和犬科动物。\n\nSVM 可以分为两种类型：线性和非线性。\n\n\
  ### 线性 SVM\n\n它将数据分为两个不同的类别。当数据点线性可分时效果最佳，这意味着它们可以通过画一条直线分为两组。线性 SVM 使用这条线来拟合模型并准确预测新数据点属于哪个组。例如，考虑一个基于各种特征（例如年龄、皮肤癌家族史等）预测某人是否患皮肤癌的应用程序。在这种情况下，所有特征都可以在一个图中组合并分为两组：患有皮肤癌的人和未患皮肤癌的人。线性\
  \ SVM 将在这张图上画一条直线，以准确区分这些组。需要注意的是，线性 SVM 仅适用于类别线性可分的数据集；如果类别之间没有明显的分界线，则必须使用其他更复杂的方法。此外，由于线性\
  \ SVM 依赖于通过多个点绘制直线来做出准确预测，因此在处理小数据集时预测的准确性较低。\n\n考虑训练数据 `{(x[i] ,d[i] )}`, `i =\
  \ 1..n`, 其中 `x[i]` 是输入模式，`d[i]` 是相应的标签。决策边界的方程为\n\n(8.14)\n\n`w^T x + b = 0`,\n\n\
  其中 `x` 是输入向量，`w` 是偏置。\n\n对于类别 `d[i] = +1`，`w^T x[i] + b ≥ 0`\n\n同样对于 `d[i] = -1`，`w^T\
  \ x[i] + b < 0`\n\n对于权重向量 `w` 和偏置 `b`，超平面与最近数据点之间的分离称为分离裕度 `ρ`。这种超平面称为最优超平面。超平面的几何构造：设\
  \ `w[0]` 和 `b[0]` 为最优权重向量和偏置。相应的超平面为 `w[0]^T x + b[0] = 0`。\n\n判别函数定义为 `g(x) = w[0]^T\
  \ x + b[0]`。该判别函数提供了从 `x` 到超平面的距离的代数度量（Fig. 8.14）。\n\n![](img/f8-14.jpg)\n\n图 8.14\
  \ 超平面的几何\n\n考虑一个点 `x`。设 `xp` 为 `x` 在超平面上的投影。点 `x` 可以表示为\n\n```\n$x = xp + r\\frac{w_{0}}{w_{0}}$,\n\
  ```\n\n其中 `xp` 是 `x` 在超平面上的法向投影，`r` 是距离。\n\n`r` 的值可以为正或负，具体取决于 `x` 的位置。投影点 `xp`\
  \ 在超平面上。这意味着\n\n`g(x) = w[0]^T x + b[0] = 0`\n\n```\n$= w_{0}^{T}\\left( {xp + r\\\
  frac{w_{0}}{w_{0}}} \\right) + b = 0$\n$= w_{0}^{T}\\left( {xp} \\right) + w_{0}^{T}r\\\
  frac{w_{0}}{w_{0}} + b = 0$\n= g(x_p) + r w[0] = 0\n```\n\n⇒ `g(x)=r w[0]` ∵ `g(x_p)=0`\
  \ (`x_p` 位于线上)\n\n```\n$\\Rightarrow r = \\frac{g\\left( x \\right)}{w_{0}}$\n```\n\
  \n我们需要确定一个最优超平面，以最大裕度分离数据，因此参数 `w[0]` 和 `b[0]` 的选择方式为，对于数据集 `{(x[i] ,d[i] )}` 中的任意点\
  \ `x[i]`\n\n`w[0]^T x[i] + b[0] ≥ 1` 对于 `d[i] = +1`（或）\n\n(8.15)\n\n`w[0]^T x[i]\
  \ + b[0] ≤ -1` 对于 `d[i] = -1`\n\n满足方程的给定数据集中的点子集称为支持向量。这些数据点更接近决策边界，对分类器的可分性构成挑战，而其他数据点则很容易分离。\n\
  \n支持向量到最优超平面的代数距离为\n\n(8.16)\n\n```\n$r = \\left\\{ \\begin{matrix} {\\frac{1}{w_{0}},}\
  \ & {\\text{if}\\, d_{i} = + 1} \\\\ \\frac{- 1}{w_{0}} & {\\text{if}\\, d_{i} =\
  \ - 1} \\\\ \\end{matrix} \\right.$\n```\n\n最优分离裕度因此计算为 `2 / w[0]`。得到的最优超平面是唯一的；最优权重向量在两个类别之间提供最大分离裕度。\n\
  \n### 非线性 SVM\n\n这是一种用于无法线性分离的数据集的 SVM 分类器。我们可以通过画一条直线来分离线性排列的数据，但我们无法为非线性数据创建一条直线。例如，在\
  \ Fig. 8.15 中，数据无法使用单条直线分离。\n\n![](img/f8-15.jpg)\n\n图 8.15 非线性分类数据图\n\n因此，必须在传统线性分析的范围之外创建新的边界。所以我们需要增加另一个维度来区分这些数据值。我们对线性数据使用了两个维度，`x`\
  \ 和 `y`，因此对于非线性数据，我们将添加第三个维度，`z`。它可以按如下方式计算：`z = x2 + y2`\n\n通过包含第三个维度，样本空间将看起来像\
  \ Fig. 8.16。\n\n![](img/f8-16.jpg)\n\n图 8.16 具有另一个维度的非线性分类数据图\n\nSVM 现在将以以下方式将数据集划分为类别。考虑\
  \ Fig. 8.17 中显示的图像。\n\n![](img/f8-17.jpg)\n\n图 8.17 具有三个维度的非线性分类数据图\n\n由于我们处于三维空间中，它看起来像是平行于\
  \ `x` 轴的平面。如果我们将其平移到 `z=1` 的 2D 空间中，它将看起来像 Fig. 8.18。\n\n![](img/f8-18.jpg)\n\n\
  图 8.18 具有三个维度的非线性分类数据图（2D 空间）\n\n#### 核函数\n\n核函数或核方法是在数据不可线性分离时进行模式分析的强大工具。它们允许我们将线性分类器，例如\
  \ SVM，应用于非线性问题，通过将数据映射到数据变得线性可分的高维特征空间。这种映射由核函数完成，该函数在不显式转换它们的情况下计算特征空间中两个数据点的内积。这被称为“核技巧”，它降低了分类器的计算复杂度和内存需求。\n\
  \n\n\n\n\n存在不同类型的核函数，例如多项式、高斯径向基函数（RBF）、sigmoid 等。每种核函数都有其优缺点，核函数的选择取决于数据的特征和问题的性质。例如，多项式核适用于具有多项式关系的数据，而\
  \ RBF 核非常适合具有聚类或局部模式的数据。Sigmoid 核在神经网络和逻辑回归中很有用。\n\n核方法在支持向量机中被广泛使用。核方法也可以应用于其他机器学习技术，例如聚类、降维、特征提取等。\n\
  \n## 8.6 有监督学习的應用\n\n由于其出色的准确性和效率，有监督学习已在许多不同的领域得到广泛应用。它涉及使用标记数据训练模型，其中输入和输出相互匹配。然后模型就能根据新的输入数据预测结果的能力。\n\
  \n### 图像分类\n这是指根据内容为照片分配描述性标签。例如，描绘猫科动物的图像可以标记为‘cat’，而描绘犬科动物的图像可以标记为‘dog’。这是一种有监督学习的形式，其中模型从标记的照片集合中获取知识，然后将已接受的规则应用于新图像。\n\
  \n特征提取是图像分类中的关键步骤。因此，模型从图像的像素中辨别出相关数据，包括边缘、形状、颜色、纹理和模式。这些特征随后被用于将图片与当前标签进行比较并选择最合适的匹配。特征提取可以通过多种技术实现，包括卷积神经网络（CNN）。\n\
  \n评估是图像分类过程中的另一个关键阶段。这意味着模型对其从未遇到过的新图像的性能进行评估。评估可以利用多种标准进行，包括准确率、精确率、召回率和 F1 分数。这些指标代表被准确标记的图像数量、被错误标记的图片数量以及模型未能标记的图像数量。评估有助于识别模型的优势和劣势，从而实现有针对性的改进。\n\
  \n图像分类在不同领域提供了众多优势。例如，在医疗保健中，图像分类可以通过分析医学图像，包括 X 光、MRI 扫描和超声图像，帮助医生诊断疾病。图像分类有助于监测治疗进展并识别异常或不正常情况。\n\
  \n它可以通过及时识别和分类人脸、物体、车辆和活动来优化监控系统的安全性和有效性。图像分类可以通过准确识别涉案人员，以及在公共区域检测武器、爆炸物和潜在威胁，帮助预防犯罪和恐怖活动。\n\
  \n图像分类可以通过根据其努力提供交互式和量身定制的反馈来优化学习体验并提高学生成绩。图像分类通过利用照片，有助于开发逼真且引人入胜的虚拟环境，例如在电子游戏、电影和模拟中。\n\
  \n### 欺诈检测\n有监督学习在检测欺诈活动方面发挥着至关重要的作用。例如，我们可以利用一个将交易分类为欺诈或非欺诈的数据集。模型随后可以学习表明交易可能具有欺骗性的模式或特征。\n\
  \n实施欺诈检测系统可以帮助金融机构减轻因欺诈活动造成的财务损失。欺诈是一个严重的问题，每年造成数十亿美元的费用。骗子采用多种策略欺骗或操纵个人向他们提供资金或个人数据。\n\
  \n### 风险评估\n通过分析数据，有监督学习被用于风险评估，以预测特定事件发生的可能性。考虑我们希望确定借款人未能偿还从金融机构获得的贷款的概率的场景。这种情况被称为贷款违约，它可能给借款人和贷款人带来问题。为了防止这种情况，我们可以采用有监督学习来训练一个模型，该模型可以预测每个借款人的贷款违约可能性。模型从过去借款人的历史数据中学习，包括其收入、信用评分、贷款金额、还款历史等。随后，模型利用这些数据为每个潜在借款人分配一个数值，表示其风险水平。随着分数的增加，贷款违约的可能性也会增加。银行可以利用此分数来决定是否批准或拒绝贷款申请，或修改贷款的利率或其他条件。\n\
  \n### 垃圾邮件过滤\n有监督学习可应用于垃圾邮件过滤，这涉及识别和消除来自电子邮件帐户的不可取或恶意消息。垃圾邮件通信可能令人烦恼、具有欺骗性或可能有害，因为它们可能包含恶意软件、网络钓鱼\
  \ URL 或欺诈计划。因此，拥有能够自主辨别和排除此类消息的程序是有利的，从而保护用户。\n\n## 8.7 有监督学习的局限性和挑战\n\n有监督学习面临过度拟合或欠拟合数据的困难。过拟合发生在算法过度纳入数据中的噪声或无关的随机变化，超过了准确预测所需的程度。因此，算法擅长准确匹配其所遇到的數據，但在将此知识应用于不熟悉的数据时却难以应对。各种策略，包括交叉验证和正则化，可以用来解决这个问题。\n\
  \n偏见或不公是指算法或数据对特定人群或情况表现出不公平或不准确。算法的预测或判断可能会对受影响的个人产生不利影响。偏见或不公平可能发生在用于训练算法的数据未能代表现实世界或其旨在解决的问题时。例如，假设人脸识别系统使用的数据集主要由白人后裔组成。在这种情况下，它可能无法有效地对肤色较深的个人进行识别。这是因为算法需要更多接触多样化的数据集才能培养区分不同肤色的能力。因此，认识有监督学习中偏见或不公平的可能来源和后果并采取措施避免或减轻它们至关重要。一些潜在措施包括：\n\
  \n• 收集更全面、更多样化和公平的数据，该数据准确代表现实世界和特定关注领域。\n• 评估和验证算法在各种群体和环境中的性能和精度。\n• 提供算法预测或判断的全面分析和解释，以及它们的理由和贡献要素。\n\
  • 监督和检查算法的结果和影响并纠正任何不准确或负面后果。\n• 在设计和实施算法时，参与并征求多元利益相关者和专家的意见。\n\n\n\n\n\n创建能够做出公平且精确结论的算法的一个障碍是保证其在适当的数据集上进行训练。并非所有数据集都同样适合此目标。特定数据集可能在偏见、不完整、过时或与算法旨在解决的主题无关方面表现出偏差。\n\
  \n# 摘要\n\n• `Supervised machine learning` 是人工智能的一个分支，它使用标记数据来训练能够对数据进行分类或预测结果的算法。分类问题涉及将数据分配到离散类别，例如垃圾邮件或非垃圾邮件，狗或猫等。`KNN`、`decision\
  \ tree`、`random forest`、`support vector machine` 和 `linear classifiers` 是分类的例子。\n\
  \n• `K-nearest neighbor` (`KNN`) 是一种算法，它根据特征空间中其 `k` 个最近邻居的多数投票来对数据输入进行分类。\n\n•\
  \ `decision trees` 算法构建一个树状结构，在每个节点根据某些标准对数据输入进行分割。它易于解释并且可以处理分类和数值特征，但容易过拟合或欠拟合。\n\
  \n• `random forests` 算法结合多个决策树，并使用投票或平均方案聚合它们的预测。\n\n• `support vector machine`\
  \ (`SVM`) 算法试图找到一个超平面，以最大间隔将数据输入分离到不同的类别。它可以通过使用不同的核，如多项式、径向基函数 (`RBF`) 或 sigmoid\
  \ 来处理线性和非线性分类问题。`Soft margin SVM` 找到将数据分离为两个类别的最佳线性边界，该边界的间隔尽可能宽，同时允许一定程度的误分类。`Hard\
  \ margin SVM` 试图找到一个超平面，以最大可能的间隔完全分离类别且没有重叠的数据点。\n\n• `Linear discriminant analysis`\
  \ (`LDA`) 是一种假设特征在每个类别内服从高斯分布的方法，并试图找到一个线性投影以最大化类别之间的分离。\n\n• `Naive Bayes classifier`\
  \ 是一种假设特征在给定类别下条件独立的方法，并试图使用频率计数来估计每个类别中每个特征值的概率。\n\n• 判别模型学习直接从输入特征预测输出变量（例如类别标签），而不对输入和输出的联合分布进行建模。线性分类器的判别模型的例子有\
  \ `logistic regression`、`perceptron` 和 `support vector machine`。\n\n• `Perceptron`\
  \ 是一种方法，它根据训练数据上的错误迭代更新权重，直到没有错误或达到最大迭代次数为止。根据层数，感知器模型分为两种类型：单层和多层。\n\n• `Neural\
  \ networks` 由相互连接的节点层组成，这些节点使用激活函数和权重处理和转换数据输入。它们可以从数据中学习复杂和非线性模式，但可能难以调优和解释。\n\n\
  • `Activation function` 是神经网络中使用的数学工具，用于确定神经元是否应被触发。它为模型增加了非线性，并使其能够识别数据中的复杂模式。\n\
  \n## 练习\n\n## Part A (Objective Questions)\n\n1. 一家公司希望根据历史数据预测下一季度的销售额。这种情况代表哪种类型的机器学习问题？\n\
  a) Classification\nb) Regression\nc) Clustering\nd) Association\n\n2. 一家电子邮件服务提供商旨在将传入的电子邮件分类为垃圾邮件或非垃圾邮件。哪种类型的监督学习算法适合此任务？\n\
  a) `K-Means`\nb) `Decision Tree`\nc) `K-Nearest Neighbor` (`KNN`)\nd) Association\
  \ Rule Mining\n\n3. 一名研究人员正在根据医学检查结果预测给定患者是否患有特定疾病。这是什么类型的机器学习问题？\na) Classification\n\
