  c) 区分真实数据和伪造数据\nd) 提高泛化性能\n\n### 89\n哪种方法通过对现有数据应用变换或扰动来增加 GAN 训练中的数据量和多样性？\na)\
  \ 迁移学习\nb) 数据增强\nc) 自监督学习\nd) 无监督学习\n\n### 90\nGAN 训练中哪种方法涉及通过解决不需要人工标注的额外任务来从无标签数据中学习良好的表示？\n\
