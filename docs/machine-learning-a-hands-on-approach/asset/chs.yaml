  \ energy. Google DeepMind, last accessed on July 12, 2024. [`deepmind.com/blog/article/machine-learning-can-boost-value-wind-energy`](https://deepmind.com/blog/article/machine-learning-can-boost-value-wind-energy)\n\
  \n## 12.5.3 能源基础设施维护\n\n能源和公用事业行业面临的挑战之一是确保能源资产的正常运行和维护，例如风力涡轮机、发电厂、输电线路和管道。这些资产通常暴露在恶劣的环境条件、磨损和运行压力下，并且通常分布在广阔的地理区域，使得手动监控和检查变得困难且成本高昂。\n\
  \nML 可以通过分析来自各种来源的数据提供此类解决方案，例如传感器、摄像机、无人机和其他设备收集的有关能源资产状态和性能的信息。ML 算法可以从历史和当前数据中学习，以识别指示资产正常或异常行为的模式、趋势和异常值。\n\
  \n用于能源和公用事业行业异常和故障检测的一些 ML 系统示例是：\n\n• Siemens 的 MindSphere：这是一个基于云的平台，可连接和分析来自风力涡轮机和其他能源资产的数据。它使用\
  \ ML 来监控资产的健康状况和性能，并在出现任何问题或缺陷时提醒操作员。这有助于提高风电的可用性和可靠性并降低维护成本。\n\n• GE Power 的 Predix：这是一个基于云的平台，可连接和分析来自发电厂和其他能源资产的数据。它使用\
  \ ML 来检测发电厂中的异常并提供纠正措施的建议。这有助于提高发电的安全性和效率并减少停机时间。\n\n### 参考文献\n\n• Siemens Insights\
  \ Hub (MindSphere): The Power of Industrial IoT. Engineering Industries eXcellence,\
  \ last accessed on July 12, 2024. [`www.indx.com/en/product/siemens-mindsphere-1`](https://www.indx.com/en/product/siemens-mindsphere-1)\n\
  \n• What is Predix Platform? GE Vernova, last accessed on July 12, 2024. [`www.ge.com/digital/documentation/edge-software/c_what_is_predix_platform.html`](https://www.ge.com/digital/documentation/edge-software/c_what_is_predix_platform.html)\n\
  \n## 12.5.4 能源和公用事业行业的其他应用\n\n对能源基础设施的主要威胁之一是网络攻击，它可能危及能源公司的数据和运营，并导致电网中断或损坏。为了防止和减轻此类攻击，ML\
  \ 可用于分析来自网络、系统、设备和用户的数据，并检测任何指示潜在网络攻击的异常或可疑活动。例如，Microsoft 开发了一款名为 Azure Sentinel\
  \ 的 ML 系统，它可以收集和关联来自日志、电子邮件、云服务等各种来源的数据，并使用高级分析和自动化实时识别和响应网络威胁。这有助于确保能源公司的数据和运营安全，防止中断或损坏。\n\
  \n对能源基础设施的另一个威胁是物理攻击、自然灾害或人为错误，它们可能损坏电网或影响其性能。为了提高电网的弹性，ML 可用于识别脆弱区域并优先考虑升级投资。例如，美国最大的电力控股公司之一\
  \ Duke Energy 使用 ML 分析来自传感器、天气模型、历史记录等的数据，并识别电网中因风暴或其他事件最有可能失效或性能不佳的区域。这有助于降低因风暴或其他事件造成的停电或停电风险。\n\
