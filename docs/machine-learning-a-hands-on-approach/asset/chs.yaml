  \n我们可以使用网格搜索或随机搜索来找到分类模型的最佳超参数。\n\n![](img/img24.jpg)\n\n![](img/img25.jpg)\n\n\
  当你在 Jupyter Notebook 中运行此程序时，它将输出网格搜索找到的最佳超参数以及包含精确率、召回率和 F1 分数等指标的分类报告。在这种情况下的样本输入是\
  \ Iris 数据集。输出将是 SVM 分类器的最佳超参数，即导致根据网格搜索获得最佳模型性能的 `C`、`gamma` 和 `kernel` 的值。分类报告提供了对模型在输入数据上性能的详细分析。\n\
  \n此示例是对使用网格搜索进行超参数调优的简单演示。在实践中，你会将数据集拆分为训练集和测试集，以在未见数据上评估模型的性能。此外，你可能希望探索更广泛的超参数值和更复杂的模型，具体取决于数据集的复杂性和你试图解决的问题。\n\
  \n### 14.23 交叉验证\n\n我们可以应用交叉验证技术来评估机器学习模型的鲁棒性。\n\n![](img/img26.jpg)\n\n在此程序中，我们首先导入必要的模块。我们使用\
  \ Iris 数据集。然后使用 100 棵树初始化随机森林分类器。`cross_val_score` 函数用于执行 5 折交叉验证，该方法将数据集分为 5 部分，在\
  \ 4 部分上训练模型，并在剩余的 1 部分上进行测试。此过程重复 5 次，以便每个部分都用于测试一次。输出将显示每个折的准确率，这让我们了解模型在不同数据子集上的表现。平均准确率也会打印出来，提供模型性能的整体评估。输出表明我们的模型相当鲁棒，在所有折上都具有较高的准确率。\n\
  \n### 14.24 集成方法\n\n我们可以探索随机森林和梯度提升等集成方法，以提高模型的预测性能。\n\n![](img/img27.jpg)\n\n输入是由\
  \ scikit-learn 的 `make_classification` 函数生成的合成数据集，该函数创建了一个具有 1000 个样本、20 个特征、2 个信息特征和\
  \ 10 个冗余特征的二分类问题。输出将是在训练和测试数据集后随机森林和梯度提升模型的准确率分数。由于数据集生成的随机性和算法中的随机过程，每次运行程序时实际数字都会有所不同。\n\
  \n此程序首先从 scikit-learn 导入必要的模块。然后生成适合二分类的合成数据集。数据集被拆分为训练集和测试集。两个集成分类器，随机森林和梯度提升，被初始化并在训练数据上拟合。然后使用模型预测测试集的类别标签。最后计算并打印每个模型的准确率，提供它们在数据集上预测性能的简单比较。在\
  \ Jupyter 环境中运行此程序之前，请记得使用笔记本单元中的命令 `!pip install scikit-learn` 安装 scikit-learn。\n\
  \n### 14.25 聚类分析\n\n我们可以使用层次聚类对相似样本进行分组。\n\n![](img/img28.jpg)\n\n![](img/f14-10.jpg)\n\
  \n图 14.10 聚类分析程序的输出\n\n程序首先导入必要的库：NumPy 用于数据操作，Matplotlib 用于绘图，pandas 用于数据结构，以及\
  \ SciPy 用于层次聚类。创建样本数据 `X`，代表 10 个样本，每个样本有 2 个特征。这些数据随后被转换为 pandas DataFrame 以便于使用。SciPy\
