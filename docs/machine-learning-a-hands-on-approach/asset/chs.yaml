  # 13.32.17 R 中的感知机\n\n感知机是一种神经元的简单模型，可以学习执行二元分类。逻辑门是接收一个或多个二元输入并产生二元输出的函数。我们可以通过调整感知机的权重和偏置来使用感知机实现逻辑门\n\
  \n例如，AND 门如果两个输入都为 1 则返回 1，否则返回 0。我们可以使用权重 `w1 = 1`、`w2 = 1` 和偏置 `b = -1.5` 的感知机实现\
  \ AND 门。感知机输出由公式 `y = step(w1 * x1 + w2 * x2 + b)` 给出，其中 `step` 是一个函数，如果参数为正则返回\
  \ 1，否则返回 0。\n\n以下是使用感知机实现 AND 门的 R 代码：\n\n``` \n# Define the step function\nstep\
  \ <- function(x) {\n  if (x > 0) {\n    return(1)\n  } else {\n    return(0)\n \
  \ }\n}\n\n# Define the perceptron function for the AND gate\nAND <- function(x1,\
  \ x2) {\n  # Set the weights and bias\n  w1 <- 1\n  w2 <- 1\n  b <- -1.5\n  # Compute\
  \ the output\n  y <- step(w1 * x1 + w2 * x2 + b)\n  return(y)\n}\n```\n\n``` \n\
  # Test the AND gate with some inputs and outputs\ninputs <- c(0, 0, 0, 1, 1, 0,\
  \ 1, 1)\noutputs <- c(0, 0, 0, 0, 0, 0, 0, 1)\n\nfor (i in seq(1, length(inputs),\
  \ by = 2)) {\n  x1 <- inputs[i]\n  x2 <- inputs[i + 1]\n  y <- outputs[i + 1]\n\
  \  print(paste(\"AND(\", x1, \",\", x2, \") =\", AND(x1, x2), \"Expected:\", y))\n\
  }\n```\n\n同样，我们可以使用不同的权重和偏置通过感知机实现其他逻辑门。例如，OR 门如果任一或两个输入为 1 则返回 1，否则返回 0。我们可以使用权重\
  \ `w1 = 1`、`w2 = 1` 和偏置 `b = -0.5` 的感知机实现 OR 门。感知机输出由相同的公式 `y = step(w1 * x1 + w2\
  \ * x2 + b)` 给出。\n\n以下是使用感知机实现 OR 门的 R 代码：\n\n``` \n# Define the perceptron function\
  \ for the OR gate\nOR <- function(x1, x2) {\n  # Set the weights and bias\n  w1\
  \ <- 1\n  w2 <- 1\n  b <- -0.5\n  # Compute the output\n  y <- step(w1 * x1 + w2\
  \ * x2 + b)\n  return(y)\n}\n```\n\n``` \n# Test the OR gate with some inputs and\
  \ outputs\ninputs <- c(0, 0, 0, 1, 1, 0, 1, 1)\noutputs <- c(0, 0, 0, 1, 0, 1, 0)\n\
  ```\n\n# 13.32.18 R 中的线性回归\n\n此程序执行以下步骤：\n\n1. 它从 csv 文件加载数据集，其中包含两个变量：`x` 和 `y`。\n\
