  \n| 8 | | 监督学习：分类 |\n| --- | --- |\n\n## 学习目标\n\n在本章结束时，你将能够：\n\n• 描述监督学习的基础\n\n\
  \n\n\n• 描述监督学习算法涉及的步骤\n\n• 解释 K\\-最近邻（KNN）算法\n\n• 解释决策树的结构和功能\n\n• 讨论随机森林的概念和应用\n\
  \n• 识别不同类型的线性分类器\n\n• 解释线性分类器的优势\n\n• 学习如何确定线性分类器的权重\n\n• 描述线性分类器的生成模型\n\n• 描述线性判别分析（LDA）\n\
  \n• 描述线性判别分析（LDA）\n\n• 解释朴素贝叶斯分类器\n\n• 解释多项式回归\n\n• 讨论多项式逻辑回归\n\n• 解释序数逻辑回归\n\n\
  • 定义感知器及其激活函数\n\n• 识别感知器模型的类型（单层和多层）\n\n• 讨论感知器模型的局限性\n\n• 解释支持向量机（SVM）及其类型（线性和非线性）\n\
  \n• 解释 SVM 中超平面和支持向量的概念\n\n• 识别监督学习的各种应用\n\n• 讨论监督学习的局限性和挑战\n\n## 8.1 引言\n\n监督机器学习（ML）是人工智能（AI）的一个分支，它使用标记数据来训练算法对数据进行分类或预测结果。标记数据意味着某些输入数据已经用正确的输出进行了标注，这有助于算法学习输入变量与输出变量之间的关系。监督学习的目的是找到一个映射函数，使其能够很好地推广到新数据。监督学习问题主要有两种类型：分类和回归。\n\
  \n分类问题涉及将数据分配到离散类别，例如垃圾邮件或非垃圾邮件，狗或猫，苹果或橙子（Fig. 8.1）。例如，监督学习算法可用于根据其内容和发送者对电子邮件进行分类。算法将从已被人类标记为垃圾邮件或非垃圾邮件的电子邮件训练集学习。然后，它将学习到的规则应用于新电子邮件并将其分配到适当的类别。\n\
  \n![](img/f8-1.jpg)\n\nFigure 8.1 分类算法示例\n\n回归问题涉及预测连续值，例如房屋价格或销售额。例如，监督学习算法可用于根据房屋的特征和位置预测房屋价格。算法将从已被人类标记了价格的房屋训练集学习。然后，它将学习到的函数应用于新房屋并估计其价格。\n\
  \n监督学习在图像分类、欺诈检测、风险评估、垃圾邮件过滤等各个领域都有许多应用。它可以帮助组织大规模、高精度地解决现实世界问题。然而，监督学习需要大量标记数据，而获取这些数据可能昂贵且耗时。它可能出现过拟合或欠拟合。如果数据或算法反映了某种潜在的歧视或偏见，它可能存在偏见或不公平。因此，监督学习需要仔细设计和评估以确保其有效性和可靠性。\n\
  \n#### Steps\n\n1. 收集并标记训练数据，该数据应具有足够的特征和示例来代表问题域。特征是描述数据的属性或变量，例如身高、体重、颜色。标记数据意味着为每个示例分配一个目标值，例如类别、分数、评级等。目标值是算法旨在预测或分类的内容。训练数据应代表问题域，意味着它应捕捉现实世界数据的多样性和复杂性。\n\
  \n2. 根据数据类型、函数的复杂性和可用的计算资源，为问题选择合适的算法。监督学习算法有很多类型，例如线性回归、逻辑回归、决策树、支持向量机（`SVM`）和神经网络。每种算法都有其自身的优缺点，有些算法比其他算法更适合某些类型的数据或问题。函数的复杂性是指算法的灵活或表达能力，即它捕捉数据中非线性或复杂模式的能力。计算资源是指算法运行和从数据中学习所需的时间和内存。\n\
  \n3. 在训练数据上训练算法，通过调整其参数以最小化误差或损失函数，该函数衡量算法拟合数据的程度。参数是控制算法如何工作的变量，例如权重、偏差、阈值等。误差或损失函数是一个数学公式，用于量化算法的预测与实际目标值之间的差距。训练的目标是找到使误差或损失函数最小化的参数的最优值。这可以通过使用各种优化技术来实现，例如梯度下降、随机梯度下降、遗传算法等。\n\
  \n4. 在测试集上评估算法的性能，测试集是训练数据的一个子集，未用于训练。测试集用于衡量算法对新数据的泛化能力。泛化是指算法对未见过或新颖的数据做出准确预测的能力，这些数据不是训练数据的一部分。算法的性能可以通过使用各种指标来评估，例如准确率、精确率、召回率、F1\
  \ 分数、均方误差等。\n\n5. 使用算法对新数据进行预测，或通过调整其参数或使用更多数据来改进它。例如，如果算法被训练将动物图像分类为猫或狗，它可用于对训练集或测试集之外的新动物图像进行分类。或者，如果算法在测试集或新数据上的性能不令人满意，则可以通过调整其参数或使用更多数据来改进它。调整参数意味着稍微改变它们的值，看看是否能改善误差或损失函数。使用更多数据意味着向训练数据添加更多示例或特征，使其更具代表性和信息性。\n\
  \n一些最常见的监督分类算法类型是 K-最近邻（`KNN`）、决策树、随机森林、支持向量机（`SVM`）、线性分类器和神经网络。\n\n## 8.2 K-最近邻\n\
  \nK-最近邻（`KNN`）是一种监督 ML 算法，可用于分类和回归任务。`KNN` 背后的主要思想是相似的数据点往往具有相似的标签或输出。因此，给定一个新数据点，`KNN`\
  \ 可以通过查看特征空间中其 K 个最近邻居的标签或输出来预测其标签或输出。特征空间是 n 维空间，其中每个维度代表数据的特征或属性。例如，如果我们有关于花的数据，两个特征是花瓣长度和花瓣宽度，那么特征空间是一个\
  \ 2D 平面，其中每个点代表一朵花。\n\n\n\n\n\n# KNN 概述\n\n`KNN` 的目标是通过在已正确标记的训练数据集中找到相似的案例并将这些标签应用于未知实例，从而正确分类未知实例。为此，我们必须首先定义一个距离度量来衡量两个数据点的接近程度，例如欧几里得距离或余弦相似度。其次，我们必须为\
  \ `K` 选择一个合适的值——这决定了在对未知实例进行预测时将使用多少个邻居。最后，我们必须决定在合并每个邻居的投票时应使用哪种类型的加权方案——均匀加权将所有邻居视为同等重要。相比之下，逆加权会比远处的邻居赋予更近的邻居更大的重要性。\n\
  \n`KNN` 也可用于回归任务；它不是根据邻域中的多数投票分配类别标签，而是计算它们之间的平均值或均值（逆权重仍可能适用）。\n\n`KNN` 是最简单却强大的\
  \ ML 算法之一，它允许我们使用不同观测值之间的相似性度量对未见数据进行分类，同时避免了像一般线性模型等其他算法中所需的显式建模技术等耗费成本的参数估计程序。此外，由于没有对潜在分布做出先验假设，即使训练示例数量有限时也适用，使其成为一种稳健的模型，能够在不同场景下产生可靠的结果。此外，像\
  \ Netflix、Amazon、YouTube 等门户在其推荐引擎中使用它们。\n\n## 距离度量\n\n为了找到新数据点的 `K` 个最近邻居，`KNN`\
  \ 使用欧几里得、曼哈顿或汉明等距离度量。这些距离在下面的等式中定义：\n\n(8.1)\n\n$\\\\text{Euclidean}\\\\,\\\\text{Distance:}\\\
  \\sqrt{\\\\sum\\\\limits\\_{i = 1}^{k}\\\\left( {x\\_{i} - y} \\\\right)^{2}},$\n\
  \n(8.2)\n\n$\\\\text{Manhattan}\\\\,\\\\text{Distance}:\\\\sum\\\\limits\\_{i =\
  \ 1}^{k}\\\\left| {x\\_{i} - y} \\\\right|$,\n\n其中 `x[i]` 表示训练数据点，`y` 表示测试数据点。\n\
  \n距离度量衡量特征空间中两个数据点相距多远。距离越小，数据点越相似。\n\n![](img/f8-2.jpg)\n\n图 8.2  KNN 示例\n\n考虑\
  \ 图 8.2。两个类别的训练点分别绘制为圆圈和三角形。测试实例显示为正方形。目标是将正方形分类为三角形或圆圈。首先，确定正方形与所有其他点（圆圈和三角形）之间的距离。以序号、训练点形状（圆圈、三角形）和距离为列，将其显示在表格中。按距离升序对表格进行排序。如果\
  \ `K = 3`，选择前 3 行（例如，圆圈、圆圈、圆圈）。因此，我们将正方形分类为属于圆圈类。如果 `K = 7`，选择前 7 行（4 个圆圈，3 个三角形）。这里我们也将正方形分类为属于圆圈类。\n\
  \n类 P 数据（表 8.1）显示为黑色圆圈，类 N 数据显示为灰色圆圈。最后一个输入的未知类用叉号表示（图 8.3）。\n\n表 8.1 类 P 和 N 表示为\
  \ x 和 y\n\n| x || y || Class |\n| --- | --- | --- |\n| 58 || 8 || P |\n| 58 || 9\
  \ || P |\n| 58 || 13 || P |\n| 60 || 9 || P |\n| 60 || 10 || P |\n| 63 || 10 ||\
  \ P |\n| 63 || 11 || P |\n| 60 || 14 || N |\n| 63 || 14 || N |\n| 65 || 11 || N\
  \ |\n| 65 || 12 || N |\n| 65 || 15 || N |\n| 68 || 12 || N |\n| 61 || 11 || ? |\n\
  \n![](img/f8-3.jpg)\n\n图 8.3  类 P 和 N 表示为图形\n\n要确定查询输入 (61,11) 的类别，我们需要确定每个点到查询输入的距离并按非降序对距离进行排序（表\
  \ 8.2）。\n\n表 8.2x 和 y 与 (60,11) 之间的欧几里得距离\n\n| x || y || Class || Euclidean distance\
  \ between (x, y) and (60, 11) || Ranking distance |\n| --- | --- | --- | --- | ---\
  \ |\n| 58 || 8 || P || 3.6 || 8 |\n| 58 || 9 || P || 2.82 || 3 |\n| 58 || 13 ||\
  \ P || 2.82 || 3 |\n| 60 || 9 || P || 2 || 2 |\n| 60 || 10 || P || 1 || 1 |\n| 63\
  \ || 10 || P || 3.16 || 7 |\n| 63 || 11 || P || 3 || 5 |\n| 60 || 14 || N || 3 ||\
  \ 5 |\n| 63 || 14 || N || 4.24 || 9 |\n| 65 || 11 || N || 5 || 10 |\n| 65 || 12\
  \ || N || 5.09 || 11 |\n| 65 || 15 || N || 6.40 || 12 |\n| 68 || 12 || N || 8.06\
  \ || 13 |\n\n根据距离，如果我们选择 `K = 5`，所有三个最小距离都属于类 P，因此我们决定 (60, 11) 的类为 P。\n\n如果我们选择\
  \ `K = 5`，在五个最小距离中，四个距离属于类 P，一个距离属于类 N。因此我们根据多数决定 (60,11) 的类为 P。\n\n一旦找到 `K` 个最近邻居，`KNN`\
  \ 就会进行多数投票以确定新数据点的标签或输出。这意味着 `KNN` 将 k 个邻居中最常见的标签或输出分配给新数据点。例如，如果我们有一个具有三个类别 A、B\
  \ 和 C 的分类问题，并且我们设置 `K = 5`，那么 `KNN` 将查看新数据点的 5 个最近邻居的标签并统计每个标签出现的次数。如果有 3 个邻居的标签为\
  \ A，1 个邻居的标签为 B，1 个邻居的标签为 C，则 `KNN` 将预测新数据点属于类 A。\n\n`KNN` 是一种简单直观的算法，可以处理多类问题，意味着它可以处理多于两个类别。它还可以处理类别之间的非线性边界，意味着它可以捕捉数据中的复杂模式。然而，`KNN`\
  \ 也有一些缺点。其中之一是对于大型数据集来说计算成本很高，因为它必须计算每对数据点之间的距离并对它们进行排序以找到 k 个最近邻居。另一个缺点是它对数据中的噪声和异常值敏感，因为它们会影响多数投票。此外，`KNN`\
  \ 会受到 `K` 和距离度量的选择影响，这会影响算法的准确性和性能。\n\n## 餐厅选择示例\n\n在本示例中，我们将使用 `KNN` 根据五个数据集的评分、价格和菜系来选择餐厅。数据集显示在\
  \ 表 8.3 中。\n\n表 8.3 餐厅评分示例\n\n| Restaurant || Rating || Price || Cuisine |\n| ---\
  \ | --- | --- | --- |\n| A || 4.5 || $$$ || Italian |\n| B || 3.0 || $$ || Chinese\
  \ |\n| C || 4.0 || $$ || Mexican |\n| D || 3.5 || $ || Indian |\n| E || 4.0 || $$$\
  \ || French |\n\n假设我们想要选择一家评分高、价格适中且菜系我们喜欢的餐厅。我们可以使用 `KNN` 找到与我们偏好最相似的餐厅。我们首先需要定义一个距离度量来衡量基于其特征的两家餐厅的接近程度。一个可能的度量是欧几里得距离，计算方法为：\n\
  \n```\nd = \\sqrt{{(r_{1} - r_{2})}^{2} + {(p_{1} - p_{2})}^{2} + {(c_{1} - c_{2})}^{2}}\n\
  ```\n\n其中 `r`、`p` 和 `c` 分别是每家餐厅的评分、价格和菜系。菜系特征可以编码为数值，例如意大利菜为 1，中国菜为 2，等等。使用此度量，我们可以计算我们偏好与每家餐厅之间的距离（表\
  \ 8.4）。\n\n表 8.4  餐厅评分示例，距离计算\n\n| Restaurant || Distance |\n| --- | --- |\n| A\
  \ || 1.41 |\n| B || 2.24 |\n| C || 1.0 |\n| D || 2.0 |\n| E || 2.24 |\n\n我们然后选择\
  \ `K` 个最近邻居，即距离最小的餐厅。在这种情况下，`K = 3`，因此我们选择 A、C 和 D 作为候选。\n\n\n\n\n\n最后一步是根据邻居的多数投票为我们的偏好分配标签。由于三个邻居中有两个的评分为\
  \ 4.0，我们可以将我们的偏好标记为评分为 4.0。同样，由于三个邻居中有两个的价格为 ![](img/dd.png)，我们可以将我们的偏好标记为价格为 ![](img/dd.png)。最后，由于菜系没有明显的多数，我们可以选择我们最喜欢的一种或使用其他标准来打破平局。因此，基于\
  \ `KNN`，我们可以选择餐厅 C 作为最符合我们偏好的最佳选择。\n\n## 8.3 决策树\n\n决策树是一种流行且广泛使用的 ML 算法，可以执行分类和回归任务。它们基于根据某些标准将数据划分为更小且更同质的子集的想法，例如特征的值或测试的结果。结果是一个树状结构，其中每个节点代表数据的一个子集，每个分支代表一个决策规则，每个叶节点代表最终预测。\n\
  \n决策树从树的顶部（根节点）开始，通过遵循特定规则向下进行。决策树的根节点包含特定属性，然后在每个级别将其拆分为分支或路径，导致包含进一步属性的不同节点，直到一条路径导致特定结果或决策。构建此流程图模型首先从大型数据集中选择一个属性，然后根据某些条件将其拆分为多个层级，最后经过许多中间阶段/节点后得出结论。\n\
  \n例如，假设我们想根据温度、湿度、风速等各种输入预测明天印度金奈是否会下雨。为此，我们可以使用决策树，从最重要的输入开始，即温度。温度是一个很好的起点，因为研究表明它对天气模式有很大影响。\n\
  \n决策树将有一个代表温度的根节点，然后它将分为两个分支：一个用于低温，一个用于高温。每个分支然后将有另一个节点代表另一个输入，例如湿度。湿度也很重要，因为它会影响空气中存在的湿度，这可能导致降雨。决策树将根据湿度的值再次分为更多分支：低、中或高。\n\
  \n每个分支将继续分为更多节点和分支，直到我们到达叶节点，即最终预测。叶节点将根据导致它的输入组合告诉我们明天是否会下雨。\n\n例如，如果温度低且湿度高，叶节点可能会说“是的，明天会下雨”。如果温度高且湿度低，叶节点可能会说“不，明天不会下雨”。要为上述场景绘制流程图，我们可以使用以下步骤：\n\
  \n1.Start with a start symbol (a circle or an oval) and write “Start” inside it.\n\
  \n2.Draw an arrow from the start symbol to a decision symbol (a diamond) and write\
  \ “Temperature?” inside it. This symbol represents the question of whether the temperature\
  \ is low or high.\n\n3.Draw two arrows from the decision symbol, one pointing to\
  \ the left and one pointing to the right. Label the left arrow as “Low” and the\
  \ right arrow as “High”. These arrows represent the possible outcomes of the question.\n\
  \n4.Draw another decision symbol at the end of each arrow and write “Humidity?”\
  \ inside them. These symbols represent the question of whether the humidity is low\
  \ or high.\n\n5.Draw two arrows from each decision symbol, one pointing down and\
  \ one pointing up. Label the down arrows as “Low” and the up arrows as “High”. These\
  \ arrows represent the possible outcomes of the question.\n\n6.Draw a leaf node\
  \ (a rectangle) at the end of each arrow and write the corresponding prediction\
  \ inside them. For example, if the temperature is low and the humidity is high,\
  \ write “Yes, it will rain tomorrow”. If the temperature is high and the humidity\
  \ is low, write “No, it will not rain tomorrow”.\n\n7.Draw an arrow from each leaf\
  \ node to an end symbol (a circle or an oval) and write “End” inside it.\n\n流程图应如下所示\
  \ Fig. 8.4。\n\n![](img/f8-4.jpg)\n\nFigure 8.4 Structure of a decision tree\n\n\
  决策树以高效处理分类数据和数值数据而闻名。此外，与线性回归等其他 ML 算法不同，它们在创建模型之前不需要任何初始化特征缩放。它们还由于模型中内置的非线性而与其它技术相比提供了更好的准确性。此外，在使用决策树技术时，关于缺失值的数据操作是可选的，因为它们即使在数据集中缺少一些值的情况下也能构建分类器。\n\
  \n另一个出色的应用是在医疗诊断系统中，在分析包含症状和治疗信息的庞大数据集时，它们在诊断患者疾病方面被证明非常有帮助且准确。\n\n决策树可能会遇到诸如过拟合或欠拟合等问题。过拟合发生在模型过于复杂并且准确地拟合可用数据但无法有效推广到未见数据时。欠拟合是模型过于简单，无法充分捕捉数据，并在应用于新数据时表现出较差的性能。为了减轻这些问题，可以在决策树上采用特定方法，包括剪枝、正则化或集成方法。\n\
  \n剪枝是消除或减少树中不显著增加预测或增加误差的特定节点或分支。例如，如果一个节点只拥有少量样本或最小的信息增益，则可能将其剪枝以简化模型并降低过拟合的可能性。剪枝可以在树的构建期间进行（预剪枝）或在树结构化之后进行（后剪枝）。\n\
  \n正则化对树的增长施加限制或惩罚，例如限制深度、节点数量或每个节点所需的最小样本数。这些限制可以阻碍树的增长，防止其变得过大或过深并降低过拟合的风险。正则化还可以提高模型的计算效率和可解释性。\n\
  \n集成方法将许多决策树集成在一起，例如随机森林或提升，以构建更稳健和精确的模型。随机森林是一种集成技术，它使用各种特征和数据子集创建许多决策树。然后将这些树的预测进行平均以减少方差并提高准确性。提升是一种集成策略，它逐步生成许多决策树。每一棵树旨在纠正前一棵树产生的错误，然后以不同权重组合它们的预测以减少偏差并提高准确性。\n\
  \n因此，决策树算法可以在问题和数据符合以下要求时应用：\n\n•When the instances are represented by attribute–value\
  \ pairs\n\n•When the target function has discrete output values\n\n•When the training\
  \ data contains errors\n\n•When the training data has missing values\n\n### 8.3.1\
  \ 迭代二分器 3 (ID3) 算法\n\n基本的决策树学习算法是迭代二分器 (ID) 算法。第三个版本非常流行，因此被称为 `ID3`。\n\n\n\n\n\n\
  `ID3` 通过自顶向下构建的方式学习决策树。正如名称所示，该算法是一种迭代方法。Dichotomiser 意为划分——算法根据决策树的构建方式将属性划分为两个或多个组。为了确定应将哪个属性作为根节点，会对所有属性进行统计评估。\n\
  \n#### 步骤\n\n1. 计算整个数据集的熵。\n2. 计算每个属性的信息增益。信息增益最大的属性为根节点。\n3. 如果所有示例都属于同一类，则返回具有相应类标签的单个节点。\n\
  4. 否则使用信息增益最大的属性 `A` 将数据集拆分为子集。\n5. 重复该过程，直到所有属性耗尽或无法进一步扩展树为止（当节点为叶节点时）。\n\n`ID3`\
  \ 算法用于选择决策树中节点属性的度量是信息增益和熵。\n\n信息增益或增益计算熵的减少。信息增益最高的节点将被选中。其计算公式如下：\n\n(8.3)\n\n\
