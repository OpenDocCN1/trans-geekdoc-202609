  \n## 12.7 机器学习在银行业的应用\n\n`ML` 已被各个行业广泛采用，包括银行业，以改善其业务流程、客户体验和风险管理。本节将探讨 `ML` 在银行业的一些应用，并提供示例和案例研究来说明其益处和挑战。\n\
  \n### 12.7.1 信用审批\n\n信用审批是评估借款人信用状况并确定贷款条款和条件的过程。对银行而言，这是一个至关重要的职能，因为它影响其盈利能力、风险管理和客户满意度。\n\
  \n传统上，信用审批依赖于对财务报表、信用评分和其他因素的手工分析。然而，这种方法可能耗时、成本高昂，并且容易出现错误和偏见。此外，它可能排除那些没有足够信用历史或属于服务不足群体（如低收入或农村人口）的潜在客户。\n\
  \n`ML` 可以通过自动化对大量复杂数据集的分析来增强信用审批，例如交易记录、社交媒体活动、手机使用情况和替代数据源。`ML` 还可以提供更准确、一致的信用风险评估，以及贷款的个性化和动态定价。此外，`ML`\
  \ 可以通过扩大传统方法下被忽视的客户的信贷获取来促进金融包容。\n\n例如，`Zest AI` 是一家为信用审批提供 `ML` 解决方案的公司。`Zest AI`\
  \ 声称其平台可以将贷款损失减少 25%，将批准率提高 15%，并将偏见减少 30%。`Zest AI` 与多家银行和贷款机构合作，例如 `Discover`、`BMO\
  \ Harris Bank` 和 `Prestige Financial Services`。另一个例子是 `LenddoEFL`，它使用心理测量测试、行为数据和替代数据来评估新兴市场客户的信用状况。\n\
  \n`ML` 在信用审批中具有许多益处，但也带来了一些挑战和风险。例如，`ML` 模型可能复杂且不透明，使得难以解释其决策过程或确保符合法规。`ML` 模型还可能继承或放大数据或算法中的偏见和错误，导致不公平或歧视性结果。此外，`ML`\
  \ 模型可能容易受到网络攻击或对抗性操纵，损害其安全性和可靠性。\n\n因此，`ML` 在信用审批中需要谨慎的设计、验证、监控和治理。\n\n#### 参考文献\n\
