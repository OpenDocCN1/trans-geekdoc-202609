  -1 || +1 |\n| +1 || \\-1 |\n| +1 || +1 |\n\n这些特征比 PCA 更能捕捉原始数据的非线性结构。\n\n### 7.3.3.3\
  \ 线性判别分析\n\n线性判别分析（`LDA`）是一种通过寻找特征的最优线性组合来对数据进行分类的方法。它是一种监督学习技术，使用线性函数将两个或多个类别分开。`LDA`\
  \ 旨在找到最佳的线性判别函数，以最好地将类别分离到不同的类别中。\n\n`LDA` 首先计算每个类别的均值和方差，以确定哪些特征有助于区分它们。然后算法找到这些特征的最佳组合，以最好地区分它们，这就成为判别函数。最后，算法评估该函数将每个类别彼此分离的程度，以确定其作为分类器的准确性和有效性。\n\
  \n`LDA` 可用于降维、特征选择、异常检测和分类问题。由于其能够在保留数据集中重要信息的同时降低噪声，它已被证明在图像识别、人脸识别/检测和语音识别/合成等应用中非常有帮助。此外，它还在医学诊断中得到成功应用，可根据患者病历提供的症状和其他属性帮助诊断疾病。\n\
  \n#### 步骤\n\n#### Step 1: Prepare the Data\n这意味着在开始分析之前确保数据已得到适当的格式化和清理。数据集应包含所有相关的输入变量和期望的输出变量（如类别标签）。此外，确保没有缺失值或异常值会影响结果的准确性。\n\
  \n#### Step 2: Choose an Appropriate Distance Metric\n接下来，你需要决定在计算点间距离以执行 `LDA`\
  \ 分类时使用合适的距离度量。常用的方法包括欧几里得距离和曼哈顿距离；然而，根据你的应用需求和目标，其他选项也是可用的。\n\n#### Step 3: Calculate\
  \ the Mean Vectors for Each Class\n你必须为数据集中每个类别的数据点计算均值向量；即，在每个希望由 `LDA` 分类标准分类的数据点“类别”组内的所有观测值中求平均值。然后均值向量用作参考点，可使用上述提到的多种度量之一（如欧几里得或曼哈顿）计算其他向量之间的距离。\n\
  \n#### Step 4: Compute the Between-Class Covariance Matrix\n对于数据集中类别的每对组合，我们需要计算一个协方差矩阵，描述它们在比较所涉及的每个特征维度上相对于彼此的位置；这将使我们能够更好地捕捉类别之间的差异，而不仅仅是单个值，而是多个变量上的分布——这在执行像\
  \ `LDA` 这样更高级形式的统计推断时至关重要。然后我们将这些单独的协方差矩阵合并成一个更大的矩阵，称为“类间协方差矩阵”，它捕捉了在分析集中包含的所有特征上两个给定类别之间存在多少变化。\n\
  \n#### Step 5: Compute the Within-Class Covariance Matrix\n接下来，你需要计算“类内协方差”，描述与自身相比单个组内的方差；即，同一组成员沿给定特征轴存在多少变化。这里同样，为每个成对组合类别分别计算矩阵，然后将它们合并为更大的“类内协方差”，捕捉本次练习中研究的每个不同分组内的方差。\n\
  \n#### Step 6: Compute the Linear Discriminants\n最后，利用之前步骤收集的信息计算实际的线性判别式本身：利用类间和类内协方差来确定最佳方向轴，以便将不同组投影到该轴上以形成最优分离平面，使其在复杂的多维特征空间中彼此可区分。在确定这些方向轴后，应用标准超平面方程来定义基于过去分析中观察到的值区分簇的边界。通过应用在开发阶段考虑的模型训练集获得的线性判别式，任何\
  \ ML 解决方案都可以实现稳健的结果，获得与原始模型生成过程之外生成的新输入相关的预测。\n\n下面是一个具有两个特征和三个类别的数据集（Table 7.27）的示例，以及\
