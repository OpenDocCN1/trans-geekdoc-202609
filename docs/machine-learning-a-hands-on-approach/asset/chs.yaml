  树状图中的每个叶节点代表一个样本，y 轴代表聚类之间的距离或不相似性。输入是程序中定义的数组 `X`，代表二维空间中 10 个样本的坐标。输出是显示样本层次聚类的树状图。绘图不会在文本响应中显示，但在\
  \ Jupyter Notebook 中运行代码时，它将内联显示。\n\n### 14.26 深度学习\n\n![](img/img29.jpg)\n\n![](img/img30.jpg)\n\
  \n![](img/img31.jpg)\n\n此程序首先导入必要的库并加载 Iris 数据集。然后通过独热编码目标值并将数据集拆分为训练集和测试集来预处理数据。神经网络模型构建了两个隐藏层，每个隐藏层有\
  \ 10 个神经元，以及一个具有 3 个神经元的输出层，对应于三种鸢尾花物种。模型使用 Adam 优化器和分类交叉熵损失函数进行编译。训练模型 100 个 epoch\
  \ 后，在测试集上进行评估并打印准确率。最后，程序对样本输入进行预测并打印预测类别和实际类别以进行比较。在 Jupyter Notebook 中运行此程序前请记得安装\
  \ TensorFlow 和所需的库。你可以使用 `pip install tensorflow` 安装 TensorFlow。\n\n### 14.27 深度学习：Keras\n\
  \n我们可以使用 Keras 等库实现一个简单的神经网络来对鸢尾花物种进行分类。\n\n![](img/img32.jpg)\n\n\n\n\n\n该程序首先导入必要的库并加载\
  \ `Iris` 数据集。目标变量被进行 one-hot 编码，以便将其转换为可提供给神经网络的格式。然后将数据集拆分为训练集和测试集。定义了一个 `sequential`\
  \ 模型，具有两个隐藏层，每个隐藏层有 10 个神经元并使用 `ReLU` 激活函数。输出层有 3 个神经元，对应于 `Iris` 的 3 个物种，并使用 `SoftMax`\
