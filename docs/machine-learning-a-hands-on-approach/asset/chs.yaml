  ### 6.4.7 候选消除算法\n\n使用候选消除过程来找到与给定训练示例集一致的所有假设的集合。算法维护的两个假设集合是一般边界 (`G`) 和特定边界 (`S`)。与正例一致的最一般假设在一般边界中找到，而与负实例一致的最具体假设在特定边界中找到。算法中最初的两个是覆盖一切的最一般假设\
  \ `G`，以及覆盖无物的最具体假设 `S`。然后算法对每个训练样本修改 `G` 和 `S`，删除任何不一致的假设并引入仍然一致的最小泛化或特化。过程在 `G`\
  \ 和 `S` 在称为版本空间的假设集合上达成一致时结束。\n\n候选消除算法能够处理不规则数据和概念漂移，使其在 ML 中有效。噪声数据的例子是错误或异常值，不能准确代表概念。当概念随时间演变，以至于先前的实例可能不再适用或准确时，就会发生概念漂移。候选消除技术可以通过在\
  \ `G` 和 `S` 中保留多种潜在假设而不是只确定一个来处理这些情况。然后系统可以适应新实例并丢弃不再有效的旧实例。通过评估版本空间的宽窄，算法还可以确定其预测的准确性。\n\
  \n算法如下：\n\n将 `G` 初始化为最大一般假设的集合\n\n将 `S` 初始化为最大具体假设的集合\n\n对于每个训练样本 `d` ∈ `D`，执行\n\
  \n如果 `d` 是正例，则\n\n从 `G` 中删除与 `d` 不一致的任何假设\n\n对于每个与 `d` 不一致的假设 `s` ∈ `S`\n\n从 `S`\
  \ 中删除 `s`\n\n将 `S` 的所有最小泛化 `h` 添加到 `S` 中，使得\n\n`h` 与 `d` 一致，并且 `G` 的某个成员比 `h` 更一般\
  \ 从 `S` 中删除任何比 `S` 中其他假设更一般的假设\n\n如果 `d` 是负例，则\n\n从 `S` 中删除与 `d` 不一致的任何假设\n\n对于每个与\
  \ `d` 不一致的假设 `g` ∈ `G`\n\n从 `G` 中删除 `g`\n\n将 `g` 的所有最小泛化 `h` 添加到 `G` 中，使得\n\n`h`\
  \ 与 `d` 一致，并且 `S` 的某个成员比 `h` 更具体 从 `G` 中删除任何比其他假设更不一般的假设\n\n下面的例子展示了如何使用候选消除过程解决一个简单的概念学习问题。给定一些具有天空、气温、湿度、风、水和预测等特征的日子实例，挑战是学习晴天的概念。特征可以是晴天、多云、温暖、寒冷、高、低、强、弱和温暖。晴天是正例的例子，而多云天是负例。\n\
  \n表 6.13 概念学习中的候选消除\n\n| 示例 | 天空 | 气温 | 湿度 | 风 | 水 | 预报 | 类别 |\n| --- | --- | ---\
  \ | --- | --- | --- | --- | --- |\n| E1 | Sunny | Warm | Normal | Strong | Warm\
  \ | Same | + |\n| E2 | Sunny | Warm | High | Strong | Warm | Same | + |\n| E3 |\
  \ Rainy | Cold | High | Strong | Warm | Change | \\- |\n| E4 | Sunny | Warm | High\
  \ | Strong | Cool | Change | + |\n\n初始的 `G` 和 `S` 集合为：\n\n`G` = {< ?, ?, ?, ?, ?,\
  \ ?>}\n\n`S` = {< Ø, Ø, Ø, Ø, Ø, Ø>}\n\n看到 `E1` 后，`G` 和 `S` 变为：\n\n`G` = {< ?, ?,\
  \ ?, ?, ?, ?>}\n\n`S` = {< Sunny, Warm, Normal, Strong, Warm, Same>}\n\n看到 `E2`\
  \ 后，`G` 和 `S` 变为：\n\n`G` = {< ?, ?, ?, ?, ?, ?>}\n\n`S` = {< Sunny, Warm, ?, Strong,\
  \ Warm, Same>}\n\n看到 `E3` 后，`G` 和 `S` 变为：\n\n`G` = {< Sunny, ?, ?, ?, ?, ?>}\n\n\
  `S` = {< Sunny, Warm, ?, Strong, Warm, Same>}\n\n看到 `E4` 后，`G` 和 `S` 变为：\n\n`G`\
  \ = {< Sunny, ?, ?, Strong, ?, ?>}\n\n`S` = {< Sunny, Warm, ?, Strong, ?, ?>}\n\n\
  最终的版本空间为：\n\n`VS` = {< Sunny, Warm, ?, Strong, ?, ?>}\n\n### 6.4.8 关于版本空间和候选消除算法的说明\n\
  \n候选消除算法是一种用于发现与一组训练示例一致的假设的技术。算法维护的两个假设集合是一般边界 (`G`) 和特定边界 (`S`)。与所有正实例一致的最一般假设在一般边界中找到。相比之下，与所有正例一致的最具体假设在特定边界中找到。随着新例子的发现，算法修改初始的\
  \ `G` 和 `S`，它们持有最一般和假设。`G` 和 `S` 之间的版本空间是与我们见过的所有示例兼容的所有假设的集合。\n\n只要满足两个条件，算法学习到的版本空间就会趋向于准确捕捉输入概念的假设：训练样本中没有错误，并且存在描述目标思想的假设。\n\
  \n\n\n\n\n算法可能无法识别一致的假设，如果这些条件被破坏。例如，如果训练数据存在缺陷，例如噪声或错误标记，算法可能会从 `G` 或 `S` 中移除一些准确的假设，或向\
  \ `G` 或 `S` 中添加一些错误假设。空的版本空间表示没有任何假设可以解释所有示例。或者，如果没有假设能够充分表达目标概念，例如概念过于复杂或无法在假设空间中表达，算法可能不会收敛到单一假设，而是收敛到庞大或无限的版本空间。\n\
  \n候选消除方法在 ML 中很有帮助，因为它可以从正实例和负实例中学习，并且目标概念可能会演变。通过报告有多少假设与示例一致，算法还可以提供对其学习假设的置信度水平。通过请求\
  \ `G` 或 `S` 之外的案例的标签，算法还可以为用户或教师产生新的查询，压缩版本空间并提高学习准确性。\n\n### Summary\n\n• 机器学习模型在数学上表示特征与标签之间的关系。模型的三个类别是逻辑、几何和概率。\n\
  • 逻辑模型是使用规则或条件进行预测或分类的模型。\n• 在几何模型中，数据在 2D 或 3D 超平面中表示。具有四个或更多属性的数据难以可视化，只能在虚拟空间中想象。\n\
  • 距离模型是一种几何模型，使用距离度量来分离结果空间。决定特定空间中两点相距多远的称为距离度量。\n• 预测模型是概率模型，用于估计给定某些输入属性的结果的条件概率。\n\
  • 生成模型是概率模型，用于估计输入和结果属性的联合概率。机器学习中概率模型的某些示例是朴素贝叶斯、逻辑回归、高斯混合模型和隐马尔可夫模型。\n• 特征是任何\
  \ ML 应用的驱动力。它们代表数据的可测量特征，可进一步用于执行分类或聚类以进行预测或执行分析。最佳特征有助于模型实现高准确性。\n• 将数据集特征的域更改称为特征转换。这有许多应用：\n\
  • 阈值化：使用截止值，此方法将数值或序数属性转换为二进制特征。\n• 离散化：这里，定量特征值被转换为序数特征值。\n• 从初始特征集中选择与学习任务相关且具有指导性的特征子集是特征选择过程。\n\
  • 过滤方法根据统计或信息论指标（如互信息、卡方检验、相关性等）对特征进行排序和评估，而不使用学习模型。\n• 包装方法使用学习模型作为黑箱来评估特征。\n•\
  \ 内在学习方法在学习过程中包含特征选择。在训练阶段，它们要么改变目标函数，要么采用正则化方法来惩罚或删除不必要或冗余的特征。\n• 前向选择是一个迭代过程。它从单个特征开始，迭代添加特征，并在每次迭代中评估模型。当新添加的特征不再提高模型的性能时，过程结束。\n\
  • 概念学习寻求从输入数据中提取广泛类别的定义。\n• 使用候选消除算法来找到与给定训练示例集一致的所有假设的集合。\n\n## EXERCISES\n\n##\
