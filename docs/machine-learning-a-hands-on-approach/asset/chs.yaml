  b) 平衡模型的复杂性和简单性\nc) 评估判别器和生成器的性能\nd) 调节欺骗判别器与区分真实数据之间的权衡\n\n### 85\n用于防止 GAN 训练中过拟合或欠拟合的一种技术是什么？\n\
