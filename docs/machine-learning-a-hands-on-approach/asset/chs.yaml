  | --- | --- |\n\n### Learning Objectives\n\nAt the end of this chapter, you will\
  \ be able to:\n\n• Define unsupervised learning\n• Identify the types of unsupervised\
  \ learning: clustering, anomaly detection, dimension reduction, and association\n\
  • Differentiate between the types of clustering: hard and soft\n• Explain the various\
  \ clustering algorithms: K\\-means clustering, hierarchical clustering, fuzzy C-means\
  \ clustering, DBSCAN, Gaussian mixture models (GMMs), MeanShift clustering, Gaussian\
  \ mixture density estimation, and Markov random fields (MRFs)\n• Describe the anomaly\
  \ detection techniques: isolation forest algorithm, local outlier factor (LOF),\
  \ and one-class support vector machine (OC SVM)\n• Apply dimensionality reduction\
  \ algorithms such as PCA, linear discriminant analysis (LDA), factor analysis (FA),\
  \ and kernel principal component analysis (KPCA)\n• Utilize association algorithms\
  \ such as FP Growth, Apriori, and ECLAT\n• Explain the Markov models and hidden\
  \ Markov models (HMM)\n• Explore matrix factorization and matrix completion models\n\
  • Discuss generative models and latent factor models\n• Explain inference models\
  \ and non-negative matrix factorization (NMF)\n• Evaluate the advantages and disadvantages\
  \ of unsupervised machine learning\n\n## 7.1Introduction\n\nUnsupervised learning\
  \ is a machine learning (ML) technique in which a machine is given unstructured\
  \ data with no labels and asked to find patterns, similarities, and relationships\
  \ between the data points. The output of this process is a model that can be used\
  \ to make predictions or draw insights from the data. Unlike supervised learning,\
  \ there is no human intervention. Instead, the algorithm must uncover hidden structures\
  \ and relationships within the given data set.\n\nUnsupervised learning algorithms\
  \ are often used for clustering data sets into groups based on specific characteristics\
  \ or dimensions or for anomaly detection, where outliers in the data set are identified.\
  \ Unsupervised learning can also be used in natural language processing (NLP) tasks\
  \ such as identifying topics within a document.\n\n## 7.2What and Why of Unsupervised\
  \ Learning\n\nUnsupervised learning is a type of ML where the computer program tries\
  \ to find patterns and relationships in data without being given specific examples\
  \ or labels to learn from. It is like trying to solve a puzzle without being given\
  \ any hints. Instead, the program uses algorithms to explore the data and find patterns\
  \ on its own.\n\nFor example, an unsupervised learning algorithm takes the input\
  \ data set containing images of bulls and cows and performs analysis (Fig. 7.1).\
  \ The algorithm observes the features of each image, such as shape, size, color,\
  \ and texture. It then uses clustering techniques to group similar images into clusters.\
  \ By doing this, it can recognize patterns in the data without knowing which categories\
  \ of images belong to each cluster.\n\n![](img/f7-1.jpg)\n\nFigure 7.1 Unsupervised\
  \ learning example\n\nThis technique can identify types of bulls or cows even if\
  \ there is no clear distinction between them in the input data set. For example,\
  \ suppose two cows have very similar shapes but differ slightly in color or texture.\
  \ Unsupervised learning algorithms can still identify them as two distinct clusters\
  \ despite their similarities.\n\nUnsupervised learning is also helpful in separating\
  \ a single object from its surroundings in an image by creating multiple clusters\
  \ from that single object and its environment – this is known as segmentation. This\
  \ technique can help computer vision applications accurately distinguish objects\
  \ within an image, which is impossible with supervised learning approaches alone.\
  \ Some examples of segmentation using unsupervised learning are image and document\
  \ segmentation. In image segmentation, an image is separated into different regions\
  \ or objects based on color, texture, edges, or other visual characteristics. Document\
  \ segmentation is typically used to separate a document into its constituent parts,\
  \ such as paragraphs, headings, and subheadings (Fig. 7.2).\n\n![](img/f7-2.jpg)\n\
  \nFigure 7.2 Documentation segmentation example\n\nOverall, unsupervised learning\
  \ algorithms are valuable tools that provide insights into data sets that, due to\
  \ their complexity, would otherwise require manual analysis. This makes them an\
  \ excellent tool for data scientists looking to gain insights quickly and effectively\
  \ from large data sets.\n\nIt can also help detect anomalies and outliers in data\
  \ sets or predict future behaviors by recognizing patterns from past events. In\
  \ addition, unsupervised learning models can be used for marketing purposes by grouping\
  \ customers with similar interests together so marketers can better target them\
  \ with relevant offers and promotions.\n\nUnsupervised learning allows us to uncover\
  \ insights about our data without it needing to be labeled or categorized; this\
  \ makes it helpful in dealing with real-world situations where not all information\
  \ is already known beforehand.\n\n## 7.3Types of Unsupervised Learning\n\nIn ML,\
  \ unsupervised learning allows computers to identify patterns in data without training\
  \ data or human instruction. Clustering, anomaly detection, dimension reduction,\
  \ and association rule learning are the four primary subcategories of this form\
  \ of learning (Fig. 7.3).\n\n![](img/f7-3.jpg)\n\nFigure 7.3 Types of unsupervised\
  \ learning\n\nEach of these types is now discussed in detail.\n\n### 7.3.1Clustering\n\
  \nClustering algorithms are an essential type of unsupervised ML used to identify\
  \ patterns in data and group similar data points together. Clustering is used to\
  \ find structure in unlabeled data, such as trends and groupings, to understand\
  \ the data set better. The main goal is to create clusters or groups of data points\
  \ that are like each other and dissimilar from points in other clusters.\n\nThere\
  \ are two main types of clustering algorithms (Fig. 7.4): hard (assigning a point\
  \ to one cluster based on similarity) and soft (assigning a point to multiple clusters,\
  \ allowing for overlap).\n\n![](img/f7-4.jpg)\n\nFigure 7.4 Types of clustering\n\
  \n\n\n\n\n硬聚类是指根据点与簇中其他点的相似性，将点分配到一个簇中。例如，如果你有一组水果，如苹果、橙子和香蕉，你可以使用硬聚类根据它们是甜还是酸来对水果进行分组。苹果将被归入甜类，而橙子则属于酸簇（Fig.\
  \ 7.5）。\n\n![](img/f7-5.jpg)\n\nFigure 7.5  Hard clustering example\n\n软聚类是指点可以同时被分配到多个簇中，并且簇之间允许重叠。例如，我们有一组动物，包括猫、狗、马、牛和山羊；我们可以对该数据集使用软聚类，通过创建一个宠物簇（猫、山羊和狗）以及一个农场动物簇（马、山羊和牛），两者重叠，因为山羊属于两个组（Fig.\
  \ 7.6）。\n\n![](img/f7-6.jpg)\n\nFigure 7.6  Soft clustering example\n\n硬方法和软方法都可以帮助对相似的项目进行分组，从而使它们之间的模式更加明显。聚类后的数据随后可以进行详细研究，使我们能够理解趋势或在数据集中发现新知识。聚类算法可应用于各个领域，包括图像分割、市场研究的客户分类、发现数据趋势的统计分析，以及医学科学中的疾病分类。\n\
  \n有不同类型的聚类方法（Fig. 7.7），每种方法都有其自身的优缺点：\n\n• 分区聚类：此方法将数据划分为非层次化的组，例如 `K-means`、`K-medoids`\
  \ 等。每个数据点恰好属于一个簇，簇的数量是预先指定的。此方法适用于球形且分离良好的簇，但对于复杂形状或噪声数据可能效果不佳。\n\n• 层次聚类：此方法创建簇的树状结构，例如凝聚或分裂聚类。每个数据点可以根据层次级别属于一个以上的簇。簇的数量可以通过在所需级别处剪切树来确定。此方法可以捕捉复杂形状和异常值，但可能计算成本高昂且对距离度量的选择敏感。\n\
  \n• 基于密度的聚类：此方法将簇识别为数据点的密集区域，由低密度区域分隔，例如 `DBSCAN`。每个数据点最多属于一个簇，一些数据点可能不属于任何簇（噪声）。簇的数量不是预先指定的，取决于密度参数。此方法可以处理任意形状和异常值，但对于变化的密度或高维数据可能效果不佳。\n\
  \n• 基于分布模型的聚类：此方法假设数据点由概率分布的混合生成，例如 `Gaussian mixture models`。每个数据点以一定的概率属于一个或多个簇，簇的数量是预先指定的或由模型选择标准确定。此方法可以捕捉数据的统计特性，但对于非高斯或重叠的簇可能效果不佳。\n\
  \n• 模糊聚类：此方法为每个数据点为每个簇分配隶属度，例如 `fuzzy C-means`。每个数据点以不同的隶属度属于一个或多个簇，簇的数量是预先指定的。此方法可以处理重叠和噪声数据，但可能对初始化和收敛标准敏感\n\
  \n![](img/f7-7.jpg)\n\nFigure 7.7  Types of clustering algorithms\n\n### 7.3.1.1\
  \ K-means Clustering\n\n这是一种流行的无监督机器学习技术，用于数据探索和分析。它用于将数据点分组或聚类到不同的簇或类别中。`K-means`\
  \ 旨在根据特定特征将数据集划分为有意义的子组。该算法检查每个数据点并根据属性相似性将其分配到若干组之一。名称来源于它需要在运行算法之前指定特定数量的组（`K`）。因此，`K`\
  \ 指定了必须生成的预定义簇的数量。之后，算法将通过确定每个簇的质心（或中心点）将数据集划分为 `K` 个簇。这是通过迭代过程实现的，在每次迭代中点被分配到其最近的质心。然后质心根据分配给它们的点的平均值进行更新。最后，簇数据点被分配到最近的质心，直到没有点未被分配。\n\
  \n质心是形状或物体的几何中心。它们可以通过求出构成形状或物体的所有点的坐标的平均值来计算。例如，要找到三角形的质心，我们可以使用公式：\n\n```\n(x,\
  \ y) = ( (x1 + x2 + x3) / 3, (y1 + y2 + y3) / 3)\n```\n\n其中 `(x1, y1)`、`(x2, y2)`\
  \ 和 `(x3, y3)` 是三角形的顶点。该公式之所以有效，是因为质心将三角形的每条中线分为两段，比例为 2:1。中线是连接顶点与对边中点的线段。\n\n\
  下面是一个如何找到三角形质心的简单示例。假设我们有一个顶点为 `A(2, 4)`、`B(6, 8)` 和 `C(10, 4)` 的三角形。要找到质心，我们将坐标代入公式：\n\
  \n```\n(x, y) = ( (2 + 6 + 10) / 3, (4 + 8 + 4) / 3)\n(x, y) = (18 / 3, 16 / 3)\n\
  (x, y) = (6, 16/3)\n```\n\n因此，三角形的质心位于 `(6, 16/3)`。我们可以通过绘制中线并观察它们在此点相交来验证这一点。\n\
  \n`K-means` 算法通过基于数据点相似性将数据集划分为 `K` 个不同的簇来工作。它可以处理以下类型的数据：\n\n• 离散数值数据：这些是可计数的数值，如售出产品的数量或网站访问次数。例如，如果你有不同地区售出产品的数量数据，`K-means`\
  \ 可以对销售额相似的地区进行聚类。这有助于识别具有相似销售模式的区域。\n\n• 连续数值数据：这些可测量的值可以在范围内取任意值，如温度或身高。例如，使用个人的年收入和年龄数据，`K-means`\
  \ 可以对收入和年龄特征相似的个人进行聚类。这种实际应用对于市场细分特别有用，在那里你希望识别具有相似财务和人口特征的人群。\n\n• 连续实体：这些是指可以在连续尺度上表示的数据点。例如，在图像处理中，像素强度是恒定值。`K-means`\
  \ 可以根据像素强度将图像分割成不同的区域，这在目标检测和图像压缩应用中很有帮助。\n\n然而，该算法在处理分类数据、异常值和非线性数据时存在困难。此外，你需要决定想要多少个数据簇。最后，`K-means`\
  \ 最适合应用于较小的数据集，因为它会迭代所有数据点。因此，如果数据集包含许多数据点，对其进行分类将需要更长的时间。\n\n\n\n\n\n## K-means\
  \ 聚类输入与迭代过程\n\n我们需要两个输入才能使 `K-means` 聚类正确工作：期望的簇/组数量以及一组带有相关值 `features` 的观测值。最初，我们必须随机为每个观测值/数据点/特征向量分配一个簇标签，通常为\
  \ 0 或 1。然而，任何整数值都取决于我们希望将数据集划分为多少个簇 `K`。然后，对于每个组，我们需要计算 `centroid`，它代表其在每个维度上的平均位置，以及相对于数据集中所有其他组测量的整体大小/体积。\n\
  \n完成这些步骤后，我们可以开始多次循环遍历数据集，同时通过一种称为 `expectation maximization` 的迭代过程相应地调整质心。这通过为观测值分配新的标签来实现，最接近它们所属的组，在经历迄今为止的每次迭代之后，从而努力最小化簇内距离，同时最大化簇间距离。这为我们提供了越来越准确的预测，关于哪些观测值落在整个样本空间的哪些类别/子组中，使用\
  \ `Euclidean distance` 指标进行比较。\n\n在预先指定的时间内没有迭代之间显著变化后，在有足够的计算资源的情况下，应该能迅速达到收敛，确保真正的分类准确性。\n\
  \n## 应用案例：运动鞋公司客户分组\n\n假设一家公司生产运动鞋，想要将其客户分为两个不同的群体：男性和女性。我们将首先收集客户信息，例如年龄、性别、购物偏好和消费模式等，然后使用基于\
  \ `K-means` 聚类的<|message|> 方法来确定不同的标准以确定谁应该去哪里。\n\n例如，大多数年龄在 18 至 25 岁之间的人倾向于在鞋子上花钱，而年龄在\
  \ 30 岁以上的人则相反，从而仅基于年龄就产生了明显的区分。这表明两组年龄段的鞋类消费习惯存在显著差异：18–25 岁组和 30 岁及以上组。\n\n###\
  \ 观察要点\n\n• 基于年龄的消费习惯：年轻人群 `18–25` 倾向于在鞋子上花费更多钱。这可能是由于时尚趋势、社会影响以及对个人外表的更高兴趣。老年人群\
  \ `30+` 不太可能在鞋子上花费同样多。他们可能会优先考虑其他开支，例如家庭需求、抵押贷款或储蓄。\n\n• 基于性别的分析：一旦数据按性别分解，每个年龄组中男性和女性的数量与总体趋势完全一致。这种一致性为决策提供了坚实的基础，表明\
  \ 18–25 岁的年轻男性和女性更有可能在鞋子上花费，而 30 岁以上的老年男性和女性则不太可能这样做。\n\n• 假设和结论：根据消费模式，可以假设年轻人群\
  \ `18–25` 属于鞋类支出较高的类别，而老年人群 `30+` 属于鞋类支出较低的类别。这种区分使营销人员和企业能够量身定制其产品和营销策略，有效地针对适当的年龄组。\n\
  \n## K-means 执行步骤\n\n### Step 1: Data Collection\n第一步是收集客户数据。在这种情况下，我们收集客户信息，例如年龄、性别、购物偏好和消费模式。\n\
  \n### Step 2: Define K\n接下来，我们需要定义我们想要形成的簇的数量 `K`。在这个例子中，我们希望将客户分为两个不同的群体：男性和女性。\n\
  \n### Step 3: Initialize Centroids\n下一步是随机初始化 `K` 个质心。`centroid` 是簇中心的点。在我们的例子中，我们随机选择两个质心：一个用于男性，一个用于女性。\n\
  \n### Step 4: Assign Data Points to Clusters\n下一步是根据 `Euclidean distance` 将每个数据点分配给其最近的质心。在我们的例子中，我们将计算每个客户与每个质心的距离，并根据性别将他们分配给最近的质心。\n\
  \n### Step 5: Update Centroids\n在所有数据点都被分配到簇后，我们根据该簇中所有数据点的平均值更新每个簇的质心。这是为了确保质心位于簇的中心。\n\
  \n### Step 6: Reassign Data Points\n然后我们根据更新后的质心值，将每个数据点重新分配给其最近的质心。此过程重复进行，直到质心不再移动，或达到最大迭代次数。\n\
  \n### Step 7: Interpret Results\n最后一步是解释聚类算法的结果。在我们的例子中，我们将通过分析每个簇中客户的特征来解释结果，以确定决定谁应该去哪里的不同标准，基于性别。\n\
  \n## 示例 1：五条记录计算\n\n让我们考虑我们有五个数据点 `records` 的例子：我们假设前三个数据点是男性，最后两个数据点是女性。每个数据点的鞋类支出和年龄在\
  \ Table 7.1 中给出。\n\nTable 7.1 Spending pattern\n\n| Customer ID || Age || Gender\
  \ || Spending on shoes |\n| --- | --- | --- | --- |\n| 1 || 20 || Male || 500 |\n\
  | 2 || 25 || Male || 800 |\n| 3 || 30 || Male || 400 |\n| 4 || 35 || Female || 700\
  \ |\n| 5 || 50 || Female || 300 |\n\n男性簇的质心计算如下：\n\n男性簇的平均年龄为 `(20 + 25 + 30)/3\
  \ = 25`\n\n男性簇的平均鞋类支出为 `(500 + 800 + 400)/3 = 567`\n\n因此，男性簇的质心为 `(25, 567)`。\n\n\
  女性簇的质心计算如下：\n\n女性簇的平均年龄为 `(35 + 50)/2 = 42.5`\n\n女性簇的平均鞋类支出为 `(700 + 300)/2 = 500`\n\
  \n因此，女性簇的质心为 `(42.5, 500)`。\n\n重复步骤 4–6 直到收敛：我们现在重复步骤 4–6，直到质心不再发生变化。在我们只有五个数据点的例子中，我们已经收敛，并且我们找到了两个簇：\n\
  \n男性簇有客户 ID 1、2 和 3，质心为 `(25, 567)`\n\n女性簇有客户 ID 4 和 5，质心为 `(42.5, 500)`\n\n一旦我们确定了两个簇，我们就可以根据客户与两个质心的距离将客户分配到男性或女性簇。在实践中，我们将使用更多的数据点和超过两个簇以获得更准确的聚类。\n\
  \n接下来，算法计算每个簇的均值，这将作为新的质心。在我们的例子中，将计算每个簇中客户的平均支出和年龄，从而为男性和女性群体得出新的质心。我们根据其特征值将每个客户分配给最近的质心。计算每个客户与质心之间的距离，并将客户分配给最近质心的组。此过程重复进行，直到质心不再发生变化或达到最大迭代次数。\n\
  \n最终，我们将根据他们的消费模式和年龄拥有两个不同的群体，男性和女性。这些信息可由公司用于根据每个群体的偏好和需求量身定制其营销工作和产品供应。\n\n\n\n\
  \n## 示例 2：某人希望根据购买的频繁产品类型将客户分为两个不同的簇\n\n他们可以输入之前购买产品的单个商品信息，并找到人们购买的商品之间的相关关系，以确定某些商品是否构成相同的部分簇，从而影响未来挑选不同商品的决策过程。假设我们有一组\
  \ 5 位客户及其对不同产品的购买历史。列可以包括 `Customer ID`、`Product 1`、`Product 2`、`Product 3` 等，列数取决于公司销售的产品数量。我们可以使用\
  \ `K-means` 聚类根据客户购买最多的产品对客户进行分组。\n\n#### 步骤\n\n1. **选择簇的数量**：在本例中，我们希望根据客户购买最多的产品类型将客户分为两个簇。\n\
  2. **选择初始质心**：从数据集中随机选择两位客户作为每个簇的初始质心。\n3. **计算距离**：计算每个客户与每个质心之间的距离。最常用的距离度量是 `Euclidean\
  \ distance`。\n4. **将客户分配到簇**：将每个客户分配到距离最近的质心的簇。\n5. **计算新的质心**：重新计算每个簇的质心，作为分配给该簇的所有客户的均值。\n\
  6. **重复步骤 3–5**：重复步骤 3-5，直到质心不再发生变化，或达到最大迭代次数。\n7. **解释结果**：一旦算法收敛，结果簇可以根据每个客户购买最频繁的产品进行解释。\n\
  \n例如，簇 1 可能由最频繁购买 `Product 1` 和 `Product 2` 的客户组成，而簇 2 可能由最频繁购买 `Product 3` 和 `Product\
  \ 4` 的客户组成。公司随后可以利用这些信息相应地为每个簇量身定制营销策略。\n\n例如，如果我们有 5 位客户和 4 种产品，我们的商品频率矩阵可能如下所示\
  \ Table 7.2。\n\nTable 7.2 五位客户和四种产品\n\n| Customer | Product 1 | Product 2 | Product\
  \ 3 | Product 4 |\n| --- | --- | --- | --- | --- |\n| 1 | 3 | 2 | 1 | 4 |\n| 2 |\
  \ 0 | 1 | 4 | 2 |\n| 3 | 2 | 3 | 0 | 1 |\n| 4 | 1 | 2 | 3 | 2 |\n| 5 | 3 | 1 | 2\
  \ | 0 |\n\n计算每个数据点与每个质心之间的距离。在我们的示例中，我们将计算每个客户与两个质心之间的距离，这两个质心代表两个簇（产品 A 的频繁购买者和产品\
  \ B 的频繁购买者）。\n\n将每个数据点分配到最近的质心。此步骤涉及根据上一步计算的距离对最接近每个质心的客户进行分组。例如，如果一位客户购买了两次产品 A\
  \ 和一次产品 B，他们将被分配到经常购买产品 A 的客户簇。\n\n根据步骤 5 中的新分组重新计算每个簇的质心。这涉及计算分配给每个质心的所有数据点的均值。在我们的示例中，我们将计算每个簇中每种产品的购买频率平均值。\n\
  \n当质心在迭代之间不再显著移动时，即达到收敛。此时算法停止，簇被视为已最终确定。一旦确定了簇，公司就可以利用这些信息做出有关产品开发、营销和销售策略的决策。\n\
  \n## 选择合适的簇数（K）\n\n选择最佳簇数是聚类分析中的一个关键阶段，因为它决定了数据的划分方式以及可能从中提取的见解。因此，建立确定合适簇数的标准或程序至关重要。\n\
  \n选择的簇数可能受到先前信息或专业知识的影响。例如，在对大学学生的数据进行聚类时，我们可以利用院系或学院的数量作为初始参考。这种假设基于这样一种观点：来自不同院系的学生表现出不同的特征或行为。在根据两个特征对电影数据进行聚类时，即预算（高或低）和选角（明星或非明星），使用四个组是合适的，因为这些属性有四种潜在组合。\n\
  \n业务需求和资源限制是可能影响簇数选择的另外因素。有时，我们可能对聚类数据有一个明确的目标或目的，例如划分、分类或建议。在这种情况下，我们可能有一个预定的簇数量，我们希望实现，这由问题的规范或限制指导。例如，一位电影制作人可能会对电影进行分类以吸引不同的受众或市场。在这样做时，他们可能有一个预定的细分数量他们希望建立，例如主流、小众、艺术院线或独立。假设一位电影制作人在预算或时间方面资源有限。在这种情况下，他们可能会对电影进行聚类以确定最有利可图或可行的资金和选角组合。\n\
  \n然而，在缺乏任何先前信息或对分组数据明确目标的情况下，我们有多种情况。对于这种情况，有必要采用统计方法或标准来确定最合适的簇数。这些现在将详细讨论。\n\n\
  ### 肘部法\n\n肘部法通过计算每个数据点与其指定簇中心之间的平方距离之和（`SSD`）来确定聚类算法中最合适的簇。簇中心代表每个簇内的平均或典型位置，而\
  \ `SSD` 量化每个簇内的紧凑性或同质性。理想情况下，我们的目标是最小化 `SSD`，表明数据点接近其各自的簇中心并且与邻近簇明显分离。然而，当簇的数量增加时，`SSD`\
  \ 将表现出更缓慢的下降，因为数据被逐步划分为越来越小的组。最终，增加簇的数量对改善 `SSD` 的收益将递减，并可能导致引入噪声或过拟合。\n\n通过使用 `K-means`\
  \ 聚类并使用不同的 `K` 值，我们可以生成每个 `K` 值的 `SSD` 曲线图。这可以如 Fig. 7.8 所示。\n\n![](img/f7-8.jpg)\n\
  \nFigure 7.8 使用肘部法确定 K 值\n\n### 轮廓系数法\n\n轮廓系数法用于评估聚类结果的有效性。要使用轮廓系数法，需要计算每个数据点的轮廓分数。轮廓分数是衡量数据集中聚类质量的指标。\n\
  \n让我们表示数据点的索引。`a(i)` 表示 `i` 与同一簇中所有其他点之间的平均距离，而 `b(i)` 表示 `i` 与任何其他簇中所有其他点之间的最小平均距离。轮廓分数\
  \ `s(i)` 是一个介于 -1 到 1 之间的指标，-1 表示聚类效果差，1 表示簇分离良好。`s(i)` 的公式通过 `b(i)` 减去 `a(i)` 然后除以\
  \ `a(i)` 和 `b(i)` 中较大的值来计算。\n\n\n\n\n\n接近 1 的数值表示该数据点与其自身簇高度相似（高内聚），且与其他簇差异显著（高分离）。值接近\
  \ 0 的数据点表示其接近两个簇之间的边界，可能被分配到任一簇。约 –1 的数值表示该数据点在其簇内凝聚度低，且与其他簇的分离度低，表明差异程度高。\n\n每个簇的轮廓分数计算为该簇内所有数据点轮廓分数的平均值。整个数据集的轮廓分数计算为各簇轮廓分数的平均值。理想的簇数是使给定数据集的轮廓分数最大化的那个。\n\
  \n考虑一个场景，我们拥有一个包含四个不同属性的数据集，我们的目标是将其分类为两个或三个不同的组。我们可以使用聚类技术获取聚类结果。随后，可采用轮廓方法来评估每个聚类结果的质量。Table\
  \ 7.3 显示了各种情况下每个数据点和簇的轮廓评分。\n\nTable 7.3Silhouette rating example\n\n| Data point\
  \ || Cluster 1 (`K` = 2) || Cluster 2 (`K` = 2) || Cluster 1 (`K` = 3) || Cluster\
  \ 2 (`K` = 3) || Cluster 3 (`K` = 3) |\n| --- | --- | --- | --- | --- | --- |\n\
  | 1 || 0.65 || \\- || 0.65 || \\- || \\- |\n| 2 || 0.55 || \\- || 0.55 || \\- ||\
  \ \\- |\n| 3 || 0.60 || \\- || \\- || 0.60 || \\- |\n| 4 || \\- || 0.70 || \\- ||\
  \ \\- || 0.70 |\n| 5 || \\- || 0.75 || \\- || \\- || 0.75 |\n| 6 || \\- || 0.80\
  \ || \\- || \\- || 0.85 |\n| Cluster || 0.60 || 0.75 || 0.60 || 0.60 || 0.75 |\n\
  | Data set || `0.68` ||  || `0.65` ||  ||  |\n\n很明显，当 `K` = 2 时，得分高于 `K` = 3 时。这表明两个簇比三个更适合该数据集。很明显，簇\
  \ 2 中的数据点的轮廓分数高于簇 1 中的数据点，这表明簇 2 比簇 1 更紧密且更具区分性。\n\n轮廓方法是有用的工具，但它也有某些局限。例如，对于簇重叠或形状非球形的数据集，或包含噪声或异常值的数据集，其性能可能不佳。因此，建议采用可视化检查、专业知识或统计分析等替代方法来补充轮廓方法。\n\
  \n### Gap Statistic\n\nGap Statistic 方法用于确定给定数据集中最合适的簇数。其基本概念是数据应表现出更多结构或模式，而非随机噪声。因此，通过对数据进行聚类，`SSD`\
  \ 与其簇中心之间的距离应最小化。Gap Statistic 方法旨在通过比较实际数据的 `SSD` 与具有相似特征（如大小和形状）的随机生成数据的 `SSD`\
  \ 来确定理想平衡。假设随机生成的数据缺乏任何可辨识的结构或簇，导致其 `SSD` 随簇数变化时变化很小。Gap Statistic 方法计算 gap，即衡量观察数据的\
  \ `log(SSD)` 与随机生成数据的 `log(SSD)` 之间差异的指标，对每个簇数而言。随着 gap 的增大，实际数据表现出比随机数据更大的模式或聚类程度。理想的簇数是使\
  \ gap 最大化的那个。\n\n让我们考虑对一些二维数据点进行聚类的示例。我们可以通过对每个数据点与其簇中心之间的平方距离求和来计算每个聚类的 `SSD`。Table\
  \ 7.4 显示了每个聚类的 `SSD` 值。\n\nTable 7.4 SSD values for each clustering\n\n| Number\
  \ of clusters (`K`) || `SSD` |\n| --- | --- |\n| 2 || 9.2 |\n| 3 || 6.4 |\n| 4 ||\
  \ 4.8 |\n| 5 || 3.6 |\n\n`SSD` 值随着簇数增长而下降，正如预期的那样。然而，这些信息并不能提供理想的聚类解决方案，因为我们需要了解由随机噪声产生的预期\
  \ `SSD`。\n\n为此，我们可以生成一组与原始数据大小和结构相匹配的随机数据，然后计算每个可能的簇数的 `SSD`。我们可以重复此过程以获得每个簇数量的平均\
  \ `SSD`。Table 7.5 说明了任意数据及其对应的平均 `SSD` 值。\n\nTable 7.5Average `SSD` values for random\
  \ data\n\n| Number of clusters (`K`) || Average `SSD` |\n| --- | --- |\n| 2 || 8.9\
  \ |\n| 3 || 8.7 |\n| 4 || 8.6 |\n| 5 || 8.5 |\n\n随机数据的平均 `SSD` 几乎不受簇数影响，正如预期的那样。因此，对随机数据进行聚类对其离散度的降低影响很小。\n\
  \n现在，我们可以通过从随机数据的 `SSD` 的对数中减去实际数据的 `SSD` 的对数来计算每个簇数的 gap 统计量。Table 7.6 显示了对应于每个簇数的\
  \ gap 值。\n\nTable 7.6Gap values for each cluster count\n\n| Number of clusters (`K`)\
  \ || Gap |\n| --- | --- |\n| 2 || \\-0.03 |\n| 3 || \\-0.17 |\n| 4 || \\-0.23 |\n\
  | 5 || \\-0.26 |\n\n很明显，随着簇数的增加，差异扩大，但对于所有 `K` 值仍为负。因此，所有聚类的 `SSD` 都等于或高于随机噪声。因此，没有任何聚类具有可辨识的结构或模式。基于此场景，可以推断出没有确定的簇数最适合此特定数据集。\n\
  \nGap Statistic 方法是确定给定数据集中最合适的簇数的常用方法。然而，该技术存在缺陷和一些局限性和假设，必须予以考虑。Gap Statistic\
  \ 方法的一个基本前提是，随机创建的参考分布与真实数据共享相似属性，包括维度和形状。因此，随机数据必须具有与实际数据相同数量的特征和实例，并且应在相同的域内均匀分布。然而，在实践中实现这一目标可能具有挑战性和不可靠性，因为实际数据通常表现出复杂的结构和模式，而简单的随机模型无法充分代表。\n\
  \n另一个障碍在于我们生成能够忠实模拟噪声的随机数据的能力。噪声是指与任何簇无关的数据中不需要的波动或不准确。Gap Statistic 方法假设噪声是均匀分布的且与簇无关。然而，这一断言对于某些真实数据集可能不成立，因为噪声可能表现出可辨识的结构或模式，从而影响聚类结果。如果噪声与某些属性或数据相关，它可以生成新的簇或扭曲实际的簇。这可能导致不准确的\
  \ gap 值和对理想簇数的错误确定。\n\n\n\n\n\n间隙统计方法（gap statistic method）的另一个限制是确定潜在聚类数范围，这可能具有挑战性。该范围应足够宽泛以涵盖真正的最佳值，同时避免过度的计算和错误的結果。如果范围过于有限，我们可能会错过最优值，最终得到不理想的聚类。在范围过宽的情况下，我们可能会面临过拟合或欠拟合的问题，即我们要么识别出过多的微小聚类，要么识别出有限数量的大聚类，这些聚类无法准确地代表实际的数据结构。\n\
  \n另一个局限性是其未能考虑影响聚类质量的额外因素，例如聚类的形状、大小或彼此之间的距离。分析仅集中于使用 `SSD` 来量化聚类内部的离散度。然而，`SSD`\
  \ 可能无法全面或令人满意地捕捉不同聚类应用或场景中的所有复杂性或倾向。必须谨慎行事，并辅以其他技术或标准，以确保稳健可靠的聚类结果。\n\n## 7.3.1.2\
  \ 层次聚类\n\n层次聚类是一种强大的无监督学习算法，它使用层次化方法将数据点分组到聚类中。它首先为每个数据点分配其聚类，然后在确定不同数据点之间的相似性和差异时，以层次树结构进行合并。因此，算法可以通过比较这些特征来识别模式并根据共享特征创建聚类。这种类型的聚类可用于各种应用，例如客户细分或识别大型数据集中的模式。\n\
  \n层次聚类的一个优点是它不需要关于数据集的先验知识或对其结构的任何假设，使其适合探索性分析。由于它可以捕捉到与其他方法相比物体组之间更细微的差异，因此通常比其他算法产生更准确的结果。用户可以通过更改相似性标准或链接方法等参数，轻松根据其特定需求修改聚类。\n\
  \n让我们考虑一个在线商店客户的数据集，其中每个客户由其年龄、性别、收入和购买历史描述。目标是根据这些特征的相似性对客户进行聚类。\n\n#### 步骤\n\n\
  **步骤 1：距离计算。** 第一步是计算每对客户之间的距离。在这里，我们可以使用 `Euclidean distance` 作为客户之间相似性的度量。我们可以用表格形式表示数据集，其中每一行代表一个客户，列代表特征。Table\
  \ 7.7 显示了五个客户的详细信息。\n\nTable 7.7 客户详情\n\n| Customer || Age || Gender || Income ||\
  \ Purchase history |\n| --- | --- | --- | --- | --- |\n| 1 || 30 || Male || 50000\
  \ || Low |\n| 2 || 35 || Female || 60000 || Medium |\n| 3 || 25 || Female || 40000\
  \ || High |\n| 4 || 45 || Male || 80000 || Low |\n| 5 || 50 || Female || 90000 ||\
  \ High |\n\n**步骤 2：创建距离矩阵。** 接下来，我们需要根据客户的特征定义客户之间的距离或相似性度量。一个可能的选择是 `Euclidean\
  \ distance`，它是对应特征值平方差之和的平方根。例如，客户 1 和客户 2 之间的 `Euclidean distance` 为：\n\n```\n\
  sqrt((30-35)² + (0-1)² + (50000-60000)² + (0-1)²) = 10001.41\n```\n\n其中我们已将性别和购买历史特征编码为二进制变量（0\
  \ 表示男性/低，1 表示女性/高）。使用此距离度量，我们可以构建一个距离矩阵（Table 7.8），显示所有客户之间的成对距离。\n\nTable 7.8 距离矩阵\n\
  \n| Distance || 1 || 2 || 3 || 4 || 5 |\n| --- | --- | --- | --- | --- | --- |\n\
  | 1 || 0 || 10001.41 || 10001.41 || 30001.41 || 40001.41 |\n| 2 || 10001.41 || 0\
  \ || 20001.41 || 20001.41 || 30001.41 |\n| 3 || 10001.41 || 20001.41 || 0 || 40001.41\
  \ || 50001.41 |\n| 4 || 30001.41 || 20001.41 || 40001.41 || 0 || 10001.41 |\n| 5\
  \ || 40001.41 || 30001.41 || 50001.41 || 10001.41 || 0 |\n\n**步骤 3：构建树状图。** 树状图是一种树状图，显示客户基于其相似性的层次关系。我们首先将每个客户视为一个单独的聚类，然后合并最近的聚类，直到最终得到一个包含所有客户的单个聚类。\n\
  \n我们使用单链接、完全链接、平均链接或 Ward 方法等不同方法执行聚类算法。在这里，我们将使用单链接，它合并其成员任意一对之间的最小距离最小的聚类。\n\n\
  算法从每个客户作为一个单独的聚类开始：\n\n`{1}`, `{2}`, `{3}`, `{4}`, `{5}`\n\n矩阵中最小的距离是 `10001.41`，它出现在客户\
  \ 1 和客户 3 之间，以及客户 2 和客户 4 之间。我们可以将这些对合并为两个聚类：\n\n`{1, 3}`, `{2, 4}`, `{5}`\n\n下一个最小的距离是\
  \ `20001.41`，它出现在客户 2 和客户 5 之间，以及客户 3 和客户 5 之间。我们可以将这些对合并为两个聚类：\n\n`{1, 3, 5}`,\
  \ `{2, 4}`\n\n最后一步是将剩下的两个聚类合并为一个：\n\n`{1, 3, 5, 2, 4}`\n\n这是使用单链接层次聚类的最终聚类结果。此示例的树状图显示在\
  \ Fig. 7.9 中。\n\n![](img/f7-9.jpg)\n\nFigure 7.9 树状图示例\n\n层次聚类可以应用于广泛的数据集，并且特别适用于识别大型和复杂数据集中的模式。它也可以用于数据可视化和探索性分析，因为生成的树状图提供了数据点之间关系清晰的可视化。\n\
  \n层次聚类的两种主要类型是凝聚聚类和分裂聚类（Fig. 7.10）。\n\n![](img/f7-10.jpg)\n\nFigure 7.10 凝聚和分裂聚类\n\
  \n凝聚聚类是一种层次方法，它首先将每个数据点视为一个单独的聚类。然后它逐步合并最相似的聚类，直到达到特定数量的聚类或预定的停止条件。可以使用各种方法来量化聚类之间的相似性，包括单链接（最小距离）、完全链接（最大距离）、平均链接（平均距离）和\
  \ Ward 方法（最小方差）。\n\n分裂聚类是一种层次方法，它首先将所有数据点分组到一个单一聚类中，然后迭代地将聚类划分为更小的聚类，直到达到指定的聚类数量或预定的停止条件。聚类可以使用多种标准进行划分，例如数据点之间的最大距离、数据点的最小密度或最小轮廓系数。\n\
  \n\n\n\n\n一种层次聚类的方法是对论文按照其各自的主题进行分类。凝聚聚类首先将每个文档视为其自身的簇，然后合并共享相似词语或概念的簇，直到达到预先确定的主题数量或相似度阈值。分裂聚类首先将所有文档分组到一个单一簇中，并根据词语或关键词的差异性将簇划分为更小的子簇。此过程一直持续到达到预先确定的主题数量或差异度阈值。\n\
  \n### 7.3.1.3 模糊 C 均值聚类\n\n这是一种流行的<|message|> 数据挖掘技术，它使用模糊逻辑在大型、复杂的数据集中识别簇。与其他聚类算法不同，它不依赖于刚性边界来分配标签或定义每个簇的特征。相反，它利用数据点之间的概率关系，根据其属于每个类别的可能性将它们分配到组中。这种方法可以对复杂数据集进行更准确的分类。此外，它有助于发现标准方法可能忽略的细微模式。\n\
  \n该算法为每个数据点相对于数据集内所有其他点分配一个隶属度值或关联度。0 到 1 之间的概率通常用于表示该值，较高的值表示属于该簇的可能性更大，较低的值表示联系较弱。算法评估这些概率以确定应根据其相似性或差异性将哪些点分组。一旦完成，它就可以使用这些分组作为类别或标签，将新数据点分类到相应的组中。\n\
  \n由于模糊 C 均值聚类不需要为分配类别制定严格规则，因此在处理包含异常值和不规则值的复杂数据集时，可以允许更具创造性的解决方案。此外，其识别细微模式的能力使其成为许多需要模式识别的领域不可或缺的工具，例如计算机视觉应用和金融市场分析。与传统聚类方法相比，尽管它具有优势，但该算法仍存在一些缺点，例如需要大量的计算资源，如果应用于时间限制是问题的庞大数据集，其实用性可能会受到限制。\n\
  \n为了说明该聚类算法，让我们考虑一个假设场景，其中数据集包含客户及其在各种产品上的消费习惯。产品包括鞋子、服装和配饰。我们旨在根据其购买行为的相似性将客户细分为组，并为每个组设计定制营销策略。\n\
  \n#### 步骤\n\n1. 首先，我们需要指定要创建的簇的数量并初始化 `fuzzy membership matrix`。`fuzzy membership\
  \ matrix` 包含每个数据点对每个簇的隶属度。为了简化，让我们假设我们想要创建两个簇，并随机初始化 `fuzzy membership matrix`。\n\
  \n2. 接下来，我们需要根据初始 `fuzzy membership matrix` 计算两个簇的 `centroids`。簇的 `centroid` 是簇中所有数据点的加权平均值，其中权重为隶属度。`centroids`\
  \ 代表每个簇的中心或原型。\n\n3. 我们需要计算每个数据点与两个簇的 `centroids` 之间的距离。我们可以使用任何距离度量，例如 `Euclidean`\
  \ 或 `Manhattan distance`。距离衡量数据点与簇 `centroid` 的远近。\n\n4. 我们需要根据每个数据点与 `centroids`\
  \ 之间的距离更新 `fuzzy membership matrix`。我们使用 `fuzzy membership function`，它为更接近簇 `centroid`\
  \ 的数据点分配更高的隶属度，为远离簇 `centroid` 的数据点分配更低的隶属度。`fuzzy membership function` 还取决于 `fuzziness\
  \ factor`，它控制簇之间的重叠程度。较高的 `fuzziness factor` 意味着更多的重叠，较低的 `fuzziness factor` 意味着更少的重叠。\n\
  \n5. 接下来，我们重复步骤二到四，直到算法收敛。算法收敛时，`fuzzy membership matrix` 或簇的 `centroids` 没有显著变化。\n\
  \n6. 最后，我们需要将每个数据点分配给隶属度最高的簇。这导致数据的软划分，其中每个数据点以不同的隶属度属于多个簇。然后我们可以分析每个簇的特征并识别每个簇中客户之间的共同模式。\n\
  \n为了解释其工作原理，让我们考虑数据点：`{(1, 2), (3, 5), (6, 8), (7, 10)}`。假设我们想将它们聚类为两个组：`A` 和 `B`。我们首先为每个数据点随机分配每个簇的隶属度值（Table\
  \ 7.9）。\n\nTable 7.9Fuzzy C-means data point and membership\n\n| Data point || Membership\
  \ in A || Membership in B |\n| --- | --- | --- |\n| (1,2) || 0.7 || 0.3 |\n| (3,5)\
  \ || 0.6 || 0.4 |\n| (6,8) || 0.2 || 0.8 |\n| (7,10) || 0.1 || 0.9 |\n\n隶属度值表示每个数据点属于每个簇的强度。它们必须对每个数据点求和为一。接下来，我们根据数据点及其隶属度值的加权平均值计算每个簇的\
  \ `centroids`。例如，簇 `A` 的 `centroid` 为：\n\n`(0.7 * 1 + 0.6 * 3 + 0.2 * 6 + 0.1 *\
  \ 7) / (0.7 + 0.6 + 0.2 + 0.1) = 2.9`\n\n`(0.7 * 2 + 0.6 * 5 + 0.2 * 8 + 0.1 * 10)\
  \ / (0.7 + 0.6 + 0.2 + 0.1) = 4`\n\n同样，簇 `B` 的 `centroid` 为：\n\n`(0.3 * 1 + 0.4\
  \ * 3 + 0.8 * 6 + 0.9 * 7) / (0.3 + 0.4 + 0.8 + 0.9) = 5.9`\n\n`(0.3 * 2 + 0.4 *\
  \ 5 + 0.8 * 8 + 0.9 * 10) / (0.3 + 0.4 + 0.8 + 0.9) = 8`\n\n然后，我们根据每个数据点到每个簇的 `centroids`\
  \ 的距离，使用涉及一个称为 `fuzziness coefficient` 的参数的公式更新每个数据点的隶属度值，该参数控制簇的模糊程度。较高的 `fuzziness\
  \ coefficient` 意味着簇之间更多的重叠，而较低的值意味着更多的分离。\n\n数据点对簇的隶属度值与到该簇 `centroid` 的距离成反比，幂为\
  \ `m`，该幂控制聚类的模糊度。`m` 的较高值意味着更多的模糊，较低的值意味着更多的清晰。`m` 的常见选择是 `2`。\n\n例如，`(1, 2)` 到簇\
  \ `A` 的 `centroid` 的距离为：\n\n`sqrt((1 – 2.9)² + (2 – 4.5)²) = sqrt(5) = ~2.24`\n\n\
  `(1, 2)` 到簇 `B` 的 `centroid` 的距离为：\n\n`sqrt((1 – 6.4)² + (2 – 8.9)²) = sqrt(58)\
  \ = ~7.62`\n\n`(1, 2)` 对簇 `A` 的隶属度值为：\n\n`(1 / sqrt(5))^(2 / (m – 1)) / ((1 / sqrt(5))^(2\
  \ / (m – 1)) + (1 / sqrt(58))^(2 / (m – 1))) = ((sqrt(58))^m / ((sqrt(58))^m + (sqrt(5))^m))`\n\
  \n如果我们选择 `m = 2`，则变为：\n\n`(sqrt(58)² / ((sqrt(58))² + (sqrt(5))²)) = ((58 / (58\
  \ + 5))) = ~0.92`\n\n`(1, 2)` 对簇 `B` 的隶属度值为：\n\n`(1 / sqrt(58))^(2 / (m - 1)) /\
  \ ((1 / sqrt(5))^(2 / (m - 1)) + (1 / sqrt(58))^(2 / (m - 1)))`\n\n`= ((sqrt(5))^m\
  \ / ((sqrt(58))^m + (sqrt(5))^m))`\n\n如果我们选择 `m = 2`，则变为：\n\n`(sqrt(5)² / ((sqrt(58))²\
  \ + (sqrt(5))²))`\n\n`= ((5 / (58 + 5))) = ~0.08`\n\n我们重复计算 `centroids` 和更新隶属度值的过程，直到隶属度值收敛或达到预定义阈值。结果是数据点被划分为两个簇的模糊划分，其中每个数据点对每个簇都有一个隶属度。\n\
  \n### 7.3.1.4 DBSCAN\n\n\n\n\n\n## 基于密度的噪声应用空间聚类\n\n基于密度的噪声诱导应用空间聚类是一种众所周知的基于密度的聚类算法。它比\
  \ `K-means` 更适合识别聚类，因为它会在更广泛的空间数据库中交叉检查其数据点的密度。该算法将低密度区域划分为高密度区域。\n\n## 咖啡店示例\n\n\
  想象你有一个数据集，其中包含城市中所有咖啡店的地理坐标（纬度和经度）。当你将 `DBSCAN` 应用于此数据集时，算法会寻找咖啡店密集聚集的区域。例如，在市中心，由于人流量大和需求高，咖啡店很可能彼此靠近。`DBSCAN`\
  \ 将识别这些咖啡店聚类为一个单一群体。\n\n另一方面，在郊区，咖啡店可能分布得更分散。`DBSCAN` 将把这些识别为单独的聚类，甚至如果它们相距太远则视为噪声。例如，如果在广阔的郊区只有少数几家咖啡店散布，它们可能不会形成密集的聚类。\n\
  \n此外，`DBSCAN` 可以识别离群点。这些是远离任何其他咖啡店的咖啡店，例如偏远地区的一家孤立咖啡店。算法会将这些标记为噪声或离群点，因为它们不属于任何聚类。\n\
  \n因此，聚类可以在任意形状中找到。你需要在起始数据点的邻域内有最少数量的点才能开始聚类过程。否则，这些数据点将成为噪声。`DBSCAN` 算法也不需要预设的聚类数量。该算法选择一个任意点，然后识别该任意点附近的其他点。\n\
  \n随后，利用任意点识别出的数据点被识别为一个聚类。远离任意点的点（噪声/离群点）则用于识别聚类的其他迭代中。该算法对离群点具有鲁棒性，或不会将离群数据点包含在任何聚类中，这使其相对于\
  \ `K-means` 和 `MeanShift` 具有显著优势。`K-means` 对数据集中的每个实例进行聚类，而 `DBSCAN` 不会将噪声点（离群点）包含在合法聚类中。非全局聚类对\
  \ `K-means` 来说具有挑战性，而 `DBSCAN` 则能轻松处理。不同于 `DBSCAN`，`K-means` 算法并不预设数据集的数据点来自高斯分布。\n\
  \n## 演示数据\n\n为了演示 `DBSCAN` 的运行，我们将检查 Table 7.10 中呈现的后续数据点。\n\nTable 7.10`DBSCAN`\
  \ data points\n\n| ID | X | Y |\n| --- | --- | --- |\n| 1 | 1 | 2 |\n| 2 | 2 | 2\
  \ |\n| 3 | 3 | 2 |\n| 4 | 4 | 2 |\n| 5 | 5 | 2 |\n| 6 | 6 | 2 |\n| 7 | 7 | 2 |\n\
  | 8 | 8 | 2 |\n| 9 | 9 | 2 |\n| 10 | 10 | 2 |\n\n## 参数和过程\n\n该算法由两个参数定义：epsilon\
  \ (`eps`) 和最小点数 (`minPts`)。`eps` 表示两个点被归类为邻居的距离上限，而 `minPts` 表示建立聚类所需的最小点数。对于本例说明，我们假设\
  \ `eps` 的值为 1.5，`minPts` 的值为 3。\n\n过程始于选择一个随机位置，指定为点 1，并识别在 `epsilon` 指定距离内的所有相邻点。在此情况下，点\
  \ 2 是点 1 的唯一相邻点。由于邻居点的数量低于最小所需数量 (`minPts`)，点 1 被归类为噪声且未分配到任何聚类。\n\n程序随后随机选择另一个点，例如点\
  \ 4，并识别其在 `eps` 距离内的邻居点。在此情况下，点 3、4、5 和 6 与点 4 相邻。鉴于邻居点的数量等于或超过最小所需点数 (`minPts`)，点\
  \ 4 被指定为核心点并分配到新形成的聚类，称为 `cluster A`。\n\n过程通过迭代包含点 4 的所有邻居点，随后是它们各自的邻居，只要它们在 `eps`\
  \ 距离内并且拥有至少 `minPts` 个邻居，就不断扩大 `cluster A`。在此实例中，点 3、5 和 6 被指定为核心点并包含在 `cluster\
  \ A` 中。点 2 被指定为边界点并包含在 `cluster A` 中，因为它位于核心点指定的距离 (`eps`) 内。然而，它不具备最小邻居点数 (`minPts`)。\n\
  \n随后，程序随机选择另一个位置，记为点 8，并进行相同的操作。在此情况下，点 7、8、9 和 10 与点 8 相邻。鉴于邻居数量等于或超过最小点数 (`minPts`)，点\
  \ 8 被归类为核心点并分配到新形成的聚类，称为 `cluster B`。算法通过以递归方式包含点 8 的所有相邻点及其各自的相邻点来扩大 `cluster B`。只要点在\
  \ `eps` 距离内并且拥有至少 `minPts` 个邻居，此扩展就会继续。在此实例中，点 7、9 和 10 被指定为核心点并包含在 `cluster B`\
  \ 中。\n\n程序随机选择另一个点，称为点 1，并确定它已处理完毕并被指定为噪声。一旦所有点都已处理，算法即结束。\n\n最终结果中有两个聚类：`cluster\
  \ A`，包含点 {2,3,4,5,6}，以及 `cluster B`，包含点 {7,8,9,10}。点 1 被视为无关数据而被忽略。\n\n## 优点\n\n\
  `DBSCAN` 的主要好处之一是其能够在没有关于数据或聚类结构先验知识或假设的情况下检测各种形状、大小和密度的聚类。与 `K-means` 和层次聚类不同，`DBSCAN`\
  \ 不要求用户事先指定聚类数量；相反，它会自动检测数据中的聚类数量。它对噪声也具有鲁棒性，因为它会忽略分布过于稀疏或与其他点隔离的点，因此不太可能属于任何有意义的结构。这使得\
  \ `DBSCAN` 成为分析具有噪声特征或离群点的复杂数据集的理想选择。\n\n另一个优点是用户不必担心指定诸如距离阈值之类的参数，这些参数可能会极大地影响性能；相反，他们可以调整两个关键参数：`epsilon`\
  \ (`ε`)，它决定了两个点必须有多接近才被视为“邻居”；以及 `minPts`，它指定每个点在一定半径内必须拥有的最小邻居数才能形成聚类。通过经验丰富的分析师适当设置这些参数，`DBSCAN`\
  \ 可以轻松发现数据集中的隐藏模式，而无需依赖聚类结构的先验假设或需要人工用户干预。\n\n## 缺点\n\n`DBSCAN` 是聚类大型数据集的实用算法。然而，它可能对离群点敏感，导致点被错误分类并产生意外结果。如果\
  \ `DBSCAN` 将其参数设置得过低，这些离群点可能会被归类为噪声而不是聚类的一部分；如果设置过高，整个聚类可能会被遗漏或因其密度相似而被错误分组。为了避免这个问题，考虑数据集中存在的离群点并相应地调整参数至关重要。\n\
  \n\n\n\n\n例如，存在许多与附近点相比密度较低的聚集点。在这种情况下，增加 `epsilon` 和 `minPts` 可能有助于确保所有聚集点都能得到充分识别。同样，如果存在一个以上密度相似的组/簇，例如由重叠的簇或组/簇本身内部密度变化引起，则将\
  \ `epsilon` 设置得高于通常水平将有助于确保所有簇都能得到正确分配，尽管由于是离群点，一些对象仍可能落在各自边界之外。\n\n最后，在处理包含多个重叠且各异簇的大型数据集时，建议不仅调整参数值，还应在运行\
  \ `DBSCAN` 之前先检查可能的离群点，因为这将提高准确性并减少不必要的计算。\n\n### 7.3.1.5 高斯混合模型\n\n高斯混合模型 (`GMM`)\
  \ 结合概率分布来建模数据，每个分量代表数据中不同类型的模式。它是一个概率模型，根据观察值属于每个簇的可能性，将每个观测值分配给一个或多个簇。`GMM` 背后的基本假设是，所有数据点都可以用高斯分布的混合，或“簇”来解释。每个簇关联的均值和协方差矩阵定义了其在多维特征空间中的形状和分布。簇的数量不必事先指定，因为算法将在训练阶段确定这一点。\n\
  \n#### 步骤\n\n1. `GMM` 的第一步涉及估计哪些分量最能解释输入数据，通过最大化由一组观测数据点给出的似然函数。这涉及估计每个分量的参数，如均值和协方差。\n\
  \n2. 在第二步中，观测值根据其似然度分配给簇；即在特定特征（如身高、体重等）上的取值下，它们属于特定分量/簇的概率有多大。例如，如果两个观测值具有非常相似的特征（它们的身高和体重都相似），它们很可能被分配到同一分量/簇，因为它们很可能源自同一个来源（而不是两个不同的来源）。这使我们能够在数据集中找到组，而无需标签，即使它们可能重叠（如果两个簇的均值重叠）。对多个簇具有较高似然度的观测值可能同时成为两个组的成员。\n\
  \n完成这些步骤后，我们可以利用这些信息进行进一步分析，甚至对未来行为做出预测。\n\n理解 `GMM` 的一种方法是使用期望最大化 (`EM`) 算法，该算法迭代更新参数直至收敛。`EM`\
  \ 算法包括两个步骤：E 步和 M 步。在 E 步中，算法根据当前参数计算每个数据点属于每个分量的后验概率。在 M 步中，算法通过最大化对数似然函数来更新参数，该函数是各分量对数似然的加权和。\n\
  \n例如，假设我们有一组 10 个人的身高和体重数据，如表 7.11 所示。\n\n表 7.11 GMM 数据点\n\n| Height || Weight |\n\
  | --- | --- |\n| 170 || 65 |\n| 180 || 75 |\n| 190 || 85 |\n| 160 || 55 |\n| 165\
  \ || 60 |\n| 175 || 70 |\n| 185 || 80 |\n| 195 || 90 |\n| 155 || 50 |\n| 150 ||\
  \ 45 |\n\n我们可以使用 `GMM` 将此数据聚类为两组，假设每组遵循双变量高斯分布，然后从数据中估计这些分布的参数。我们需要估计的参数是：\n\n•\
  \ 每个组的均值向量，即包含该组平均身高和体重的二维向量。\n\n• 每个组的协方差矩阵，即捕获该组内身高和体重变异性和相关性的二乘二矩阵。\n\n• 每个组的混合系数，即表示属于该组的数据比例的标量。\n\
  \n我们可以随机初始化参数，例如：\n\n– 组 1 的均值：`(160, 60)`\n\n– 组 2 的均值：`(180, 80)`\n\n– 组 1 的协方差：`[[100,\
  \ 0], [0, 100]]`\n\n– 组 2 的协方差：`[[100, 0], [0, 100]]`\n\n– 组 1 的权重：`0.5`\n\n– 组\
  \ 2 的权重：`0.5`\n\n可以使用 `EM` 算法估计这些参数：\n\n1. 期望步骤：在此步骤中，我们计算每个数据点属于每个组的概率，给定参数的当前估计值。此概率也称为责任或后验概率。例如，如果我们有两个组，均值分别为\
  \ `(170,65)` 和 `(180,75)`，协方差和混合系数相等，则第一个数据点 `(170,65)` 属于第一个组的概率高于第二个组，因为它更接近其均值。计算此概率的公式基于贝叶斯定理和多元高斯密度函数。\n\
  \n2. 最大化步骤：在此步骤中，我们根据期望步骤计算的概率更新参数的估计值。我们使用这些概率作为权重来计算每个组的加权平均值和协方差。我们还对这些概率进行归一化以获得新的混合系数。更新参数的公式源于最大化数据的对数似然函数。\n\
  \n然后我们可以应用 `EM` 算法更新参数直至收敛。经过几次迭代后，我们可能会得到以下结果：\n\n– 组 1 的均值：`(152.5, 47.5)`\n\n\
  – 组 2 的均值：`(182.5, 77.5)`\n\n– 组 1 的协方差：`[[62.5, -12.5], [-12.5, 62.5]]`\n\n– 组\
  \ 2 的协方差：`[[62.5, -12.5], [-12.5, 62.5]]`\n\n– 组 1 的权重：`0.4`\n\n– 组 2 的权重：`0.6`\n\
  \n我们重复这两个步骤直至收敛，这意味着参数在迭代之间没有显著变化。参数的最终估计值定义了最适合数据的 `GMM`。\n\n基于这些参数，我们可以将每个数据点分配给最可能的组，如\
  \ Table 7.12 所示。\n\nTable 7.12 GMM 数据点与最终分类\n\n| Height || Weight || Group |\n|\
  \ --- | --- | --- |\n| 170 || 65 || 2 |\n| 180 || 75 || 2 |\n| 190 || 85 || 2 |\n\
  | 160 || 55 || 2 |\n| 165 || 60 || 2 |\n| 175 || 70 || 2 |\n| 185 || 80 || 2 |\n\
  | 195 || 90 || 2 |\n| 155 || 50 || 1 |\n| 150 || 45 || 1 |\n\n这是使用 `GMM` 的一种可能的聚类结果。`GMM`\
  \ 的优点是它可以捕捉簇的形状和方向，而不像 `K-means` 等其他方法假设簇为球形。`GMM` 的缺点是它需要比其他方法更多的参数和计算，并且如果分量数量过大或数据稀疏，可能会出现过拟合。\n\
  \n### 7.3.1.6 MeanShift 聚类\n\n这是一种迭代地将数据点的质心向更高密度区域移动的聚类算法。它不需要标记数据，也不涉及任何预定的目标或输出。与\
  \ `K-means` 算法不同，`MeanShift` 算法不需要我们指定簇的数量。假设你需要对数据中的模式进行澄清，算法会自动确定簇的数量。密集的数据点区域使用基于滑动窗口质心的算法来定位中心组/类点。所有中心点候选都被视为滑动窗口点的均值值。随后对这些窗口进行后处理排序以去除重复项并给出最终的组中心点。\n\
  \n\n\n\n\n## 均值漂移聚类最常用于图像分割任务\n\n核密度估计是均值漂移算法的基础。该算法迭代地将每个数据点分配给最近的聚类质心，质心初始时是任意设定的。然后，每个点根据点最多的位置，即众数，在空间中迭代移动。这种方法克服了群组和聚类中心的选取，因为均值是自动发现的。聚类也表现出数据感知性，因为它们直观地收敛到数据点最多的区域。这里，窗口大小至关重要，因为它决定了聚类的尺度并直接影响检测到的聚类数量。较小的窗口大小可能导致许多小的聚类，而较大的窗口大小可能将不同的聚类合并为一个。因此，如果窗口大小太小，可能导致过拟合。如果窗口大小太大，可能导致欠拟合。因此，窗口大小的半径是一个关键因素，可能导致非平凡且有时不利的聚类结果。\n\
  \n随机选择的圆形滑动窗口被定义为具有核半径 `r` 的点 `C`。爬山式均值漂移算法通过连续迭代将核向更高密度的区域移动，并在收敛时重复该过程。最后，在后处理阶段，候选窗口会被过滤。该过程最终产生一组质心和分配的数据点组\
  \ (Table 7.13)。\n\nTable 7.13MeanShift clustering data points\n\n| Height || Weight\
  \ |\n| --- | --- |\n| 170 || 65 |\n| 180 || 75 |\n| 190 || 85 |\n| 160 || 55 |\n\
  | 165 || 60 |\n| 175 || 70 |\n| 185 || 80 |\n| 195 || 90 |\n| 155 || 50 |\n| 150\
  \ || 45 |\n\n#### Steps\n\n1. 将每个数据点初始化为聚类质心。\n2. 对于每个数据点，计算以该数据点为中心、在一定半径内（带宽）的所有点的均值。例如，如果我们对身高使用\
  \ 10 cm 的带宽，对体重使用 5 kg 的带宽，则第一个数据点（170 cm，65 kg）在此半径内的点的均值为（172.5 cm，67.5 kg）。\n\
  3. 将每个数据点移动到上一步计算的均值。例如，第一个数据点将从（170 cm，65 kg）移动到（172.5 cm，67.5 kg）。\n4. 重复步骤 2\
  \ 和 3，直到收敛或达到最大迭代次数。收敛意味着移动后数据点不再显著移动。\n5. 将聚类质心识别为收敛后未移动的点。这些是密度函数的众数，表示数据中的聚类。\n\
  \n使用此算法，我们可以从给定数据中得到两个聚类：一个聚类有四个点围绕（195 cm，90 kg），另一个聚类有六个点围绕（165 cm，60 kg）。\n\n\
  ### Advantages\n\n均值漂移聚类是分析数据的有效且灵活的工具。它可以在无需事先了解数据的情况下，快速识别复杂数据集中任何大小或形状的聚类。均值漂移对噪声和异常值也具有鲁棒性，使其适用于现实世界的应用，其中数据可能包含错误或不一致，从而对其他聚类算法产生不利影响。这使其成为探索性分析的理想选择，用于尝试理解变量与数据集之间的关系。均值漂移聚类也因其灵活性及与\
  \ K\\-means 聚类等聚类算法相比的效率，而被广泛用于机器学习应用，如对象跟踪和图像分割。有了均值漂移，机器学习模型可以快速在大批量数据中识别模式，从而比使用传统方法可能实现的更准确的预测。\n\
  \n### Disadvantages\n\n均值漂移聚类的主要缺点之一是其无法有效处理高维数据集。随着维度增加到 10 或 12 以上，算法对距离度量的依赖变得越来越无意义。它在处理更大数据集时需要更好的扩展性。另一个缺点是选择适当参数的难度，例如带宽和核函数，如果必须正确选择，则需要大量的领域知识或反复试验。这可能导致如果操作不当而产生次优结果，因此用户在开始分析之前必须了解这些参数如何影响聚类过程。最后，由于其依赖于爬山技术等局部优化方法，均值漂移聚类有时会收敛到局部最优而非全局最优——即使正确应用也可能导致不准确的聚类。\n\
  \n## 7.3.1.7 Gaussian Mixture Density Estimation\n\n高斯混合密度估计（GMDE）是一种重要的无监督学习技术，用于在复杂数据集中寻找模式并在没有类别标签先验知识的情况下进行预测。它使用概率密度函数（PDF）对数据建模，将多个\
  \ PDF 组合成一个整体概率分布。PDF 是通过在每个聚类上拟合高斯分布来确定的，因为它们最适合表示此类数据集中数据点的形状。然后使用 EM 算法来估计每个混合模型组件的参数。\n\
  \n该算法首先假设每个组件的初始参数值，然后通过连续迭代调整它们，使其最好地拟合数据。每次迭代根据当前参数值计算给定点属于特定组件的概率。它在最大化步骤中相应地修改它们，以便对需要更好表示的数据集的某些部分产生更大影响。一旦该过程完成并获得稳定的参数估计，这些\
  \ PDF 就可以用于进一步分析，例如预测新观测值或深入了解数据集中的模式。\n\n例如，我们想根据某人的过去购买习惯预测他们是否会购买某件商品。在这种情况下，我们将使用\
  \ GMDE 算法，如 K\\-means 聚类或 EM，它将帮助我们使用其概率密度识别数据集中的聚类，从而准确预测哪些客户可能属于买家或非买家，具体取决于他们所属的聚类。这一强大的工具帮助企业更好地了解其客户，通过识别不同变量之间的隐藏关系，最终使他们在产品开发或营销策略制定时能够做出更好的决策。GMDE\
  \ 也可有效用于医学诊断。医生可以根据患者病史将具有相似特征的患者聚类在一起，根据其相关概率，在症状出现前及早检测疾病。\n\nGMDE 通过估计多个高斯分布的参数来实现，这些高斯分布是看起来像钟形曲线的数学函数，以最好地拟合观测数据并确定其潜在结构。此过程称为最大似然估计（MLE）。它涉及调整每个组件的参数，直到它们达到给定各自观测聚类的最高可能似然。这种技术可以帮助我们在没有关于所研究潜在现象的额外训练或信息的情况下，基于过去的观测对新的观测做出更准确的预测。\n\
  \n\n\n\n\n例如，考虑你想根据今天的天气预测明天是否会下雨的情况。你可以使用 `MLE` 与 `GMDE` 来估计在温度和风速与今天相似的日子里通常降雨量的概率分布。一旦确定了该概率分布，你就可以根据当前条件对明天的降雨量落入特定范围的可能性做出更明智的决策。\n\
  \n完成后，这些组件可用于根据其关于每个组件 `PDFs` 的似然值将未见的观测值分类到相应的聚类中；较高的值表示与特定聚类关联的可能性更高。相比之下，较低的值会指向与特征空间中附近其他聚类的关联可能性较低。`GMDE`\
  \ 还可以对未见数据点进行预测，或与 `K-means` 和层次聚类等其他 ML 算法结合时执行聚类任务，例如异常检测和异常识别。\n\n## 7.3.1.8\
  \ Markov Random Field\n\n`Markove` 随机场 (`MRF`) 是一种强大的数学工具，用于建模不同变量之间复杂的关联。它们在计算机视觉、`NLP`、医疗诊断等任务中至关重要。基本思想是每个变量与其局部环境相关联，而非其全局状态。例如，在图像模型中，每个像素将依赖于周围的像素；或在文本模型中，每个词将依赖于其邻近的词，而非整个文档。`MRFs`\
  \ 允许我们捕捉数据中的长程相关性，从而比传统方法做出更好的预测。\n\n除了用于天气预报或预测股票价格等复杂任务外，`MRFs` 还可用于更具体的学习活动，如解谜或玩游戏。例如，在解决拼图时，我们可以使用基于\
  \ `MRF` 的方法，根据不同拼块如何契合以及它们形成解决方案一部分的可能性为其分配概率。同样，在玩国际象棋或跳棋等棋盘游戏时，我们可以使用 `MRF` 结构，根据其在特定情况下对赢得游戏有利的可能性为某些走法分配权重。\n\
  \n## 7.3.2 Anomaly Detection\n\n异常检测是指程序寻找与其它数据点不同的数据点。例如，如果你有人们在商店花费金额的数据，程序可能会寻找远高于或低于平均值的数据点。这对于识别欺诈或异常行为非常有用。\n\
  \n异常检测通过收集现有数据点的信息，将其用作参考，然后寻找偏离该参考集的新数据点来工作。根据单个点偏离被认为正常程度的大小，系统可以将其标记为潜在问题或不值得进一步调查。该技术不需要任何关于分布的先验知识——意味着无需指定应标记哪些类型的值——使其非常适合在不同领域和数据集上检测意外事件。\n\
  \n示例包括在银行记录中发现欺诈性金融活动，或在工业环境中识别故障机器。与监督学习等传统方法相比，异常检测在处理缺失值和大量噪声数据时具有诸多优势，而传统方法往往因依赖于包含每个观测值完整信息的标记训练集而失败，而这些信息可能并不总是可用。\n\
  \n![](img/f7-11.jpg)\n\nFigure 7.11 Types of anomaly detection algorithms\n\n异常检测算法的类型（Fig.\
  \ 7.11）为隔离森林算法、局部异常因子 (`LOF`) 和单类支持向量机 (`OC SVM`)。这些将在下面详细讨论。\n\n### 7.3.2.1 Isolation\
  \ Forest Algorithm\n\n顾名思义，隔离森林是一种集成方法，与随机森林有相似之处。换句话说，它通过对众多决策树的预测取平均值来为给定数据点授予最终异常分数。隔离森林与传统异常检测算法的不同之处在于，它立即尝试隔离异常数据点，而不是先定义什么是“正常”，然后将其他一切识别为异常。\n\
  \n假设我们有 Fig. 7.12 所示的数据点。\n\n![](img/f7-12.jpg)\n\nFigure 7.12 Isolation forest\
  \ algorithm: Data points\n\n隔离森林技术随机选择一个维度（具体来说，与 `x-axis` 相关的维度）并沿该维度随机分割数据（Fig.\
  \ 7.13）。\n\n![](img/f7-13.jpg)\n\nFigure 7.13 Isolation forest algorithm: Dimension\
  \ linked to the `x-axis`\n\n由此产生的两个子空间建立了不同的子树。在此实例中，切分是为了将单个点与数据集的其余部分分开。初始二叉树在第一层由两个节点组成。一个节点代表初始切分左侧的点的子树，而另一个节点代表右侧的单个点（Fig.\
  \ 7.14）。\n\n![](img/f7-14.jpg)\n\nFigure 7.14 Isolation forest algorithm: Roots\
  \ with isolation points\n\n必须认识到，集成中的其余树将选择不同的初始分割。在给定的示例中，初始分割未能将异常值与数据其余部分分开（Fig.\
  \ 7.15）。\n\n![](img/f7-15.jpg)\n\nFigure 7.15 Isolation forest algorithm: Further\
  \ splits\n\n由此产生的树由两个节点组成（Fig. 7.16）：一个代表位于线左侧的点，另一个代表位于线右侧的点。\n\n![](img/f7-16.jpg)\n\
  \nFigure 7.16 Isolation forest algorithm: With two nodes\n\n该方法迭代进行，直到树的每个叶节点对应于数据集中的一个单独数据点。在我们给出的示例中，第二次迭代成功识别并分离出异常值与数据其余部分（Fig.\
  \ 7.17）。\n\n![](img/f7-17.jpg)\n\nFigure 7.17 Isolation forest algorithm: Separating\
  \ outliers from the rest\n\n完成此阶段后，树将如 Fig. 7.18 所示。\n\n![](img/f7-18.jpg)\n\nFigure\
  \ 7.18 Isolation forest algorithm: With three nodes\n\n需要注意的是，分割可以在另一个维度发生（Fig.\
  \ 7.19），正如这个第三个决策树的情况。\n\n![](img/f7-19.jpg)\n\nFigure 7.19 Isolation forest algorithm:\
  \ Split in multiple dimensions\n\n通常，异常数据点会在较浅的树深度下被发现于较小的边界框中，与其他点相比。在使用训练好的隔离森林模型进行推理的过程中，最终的异常分数计算为每个单独决策树生成的分数的平均值。在上述情况下，隔离前的平均分割次数\
  \ = 3 (2+3+4/3)\n\n\n\n\n\n## 分类变量\n隔离森林技术可以通过将分类变量描绘为矩形来利用分类变量，每个矩形的大小与出现频率成正比。这使得可以识别出现频率较低的异常值（Fig.\
  \ 7.20）。\n\n![](img/f7-20.jpg)\n\nFigure 7.20 Isolation forest algorithm: Categorical\
  \ variables, step 1\n\n我们将潜在值的集合定义为从第一个值的中位数到最后一个值的中位数之间的范围（Fig. 7.21）。我们在域内随机选择一个点，然后确定指定矩形的最近边缘。这用于我们的分割。\n\
  \n![](img/f7-21.jpg)\n\nFigure 7.21 Isolation forest algorithm: Categorical variables,\
  \ step 2\n\n为了保持公平，森林中剩余的树将采用替代排序（Fig. 7.22）。\n\n![](img/f7-22.jpg)\n\nFigure 7.22\
  \ Isolation forest algorithm: Categorical variables, step 3\n\n该算法的工作原理如下：\n\n1.\
  \ 它随机选择数据的一个子集，并通过基于随机选择的特征和该特征范围内随机选择的阈值来分割数据，从而构建一棵二叉树。\n2. 它重复此过程，直到每个数据点被隔离在叶节点中或达到最大树深度。\n\
  3. 它计算从根节点到每个数据点的叶节点的路径长度，即隔离它所需的分割次数。\n4. 它对这样的一片森林中的路径长度取平均值并进行归一化，以得到每个数据点的异常分数。异常分数范围为\
  \ 0 到 1，其中较高的值表示更异常的数据点。\n\n下面给出隔离森林的一个简单逐步示例：\n\n1. 假设我们有一个包含两个特征 `x` 和 `y` 的数据集，我们想检测该数据集中的异常值。我们随机选择数据的一个子集，比如\
  \ 10 个点，并将它们分配给一棵二叉树。\n2. 我们随机选择一个特征，比如 `x`，以及 `x` 范围内的一个阈值，比如 3.5。我们根据其 `x` 值是否小于或大于\
  \ 3.5 将数据分为两组。\n3. 我们对每组重复此过程，随机选择一个特征和一个阈值。例如，对于 `x < 3.5` 的组，我们可能选择 `y` 作为特征并将\
  \ 2 作为阈值，并根据其 `y` 值是否小于或大于 2 将该组分为两个子组。\n4. 我们继续此过程，直到每个数据点被隔离在叶节点中或达到最大树深度。例如，如果最大树深度为\
  \ 3，我们在分支的三个层级后停止分割。\n5. 我们通过计算隔离每个数据点所需的分割次数来计算每个数据点的路径长度。例如，如果一个数据点在第一层被隔离，其路径长度为\
  \ 1；如果它在第二层被隔离，其路径长度为 2；以此类推。\n6. 我们对这样的一片森林中的路径长度取平均值并进行归一化，以得到每个数据点的异常分数。例如，如果我们构建\
  \ 100 棵树并对其路径长度取平均值，我们可能会得到一个平均路径长度为 1.2 的数据点的异常分数 0.8，表明它很可能是异常值。\n\n隔离树可以被视为一种数据结构，其中每个叶节点代表一个异常值（或异常）。例如，假设一个点似乎远离其周围的点。它被认为是非正常的，并在隔离树上形成其叶节点。此外，所有标准点，被其他常规点包围，在此决策树结构上形成其分支，从而使我们能够在没有事先标签或训练数据的情况下更轻松地识别数据集中的异常。\n\
  \n隔离森林算法相对于传统方法，如聚类，具有若干优势，因为它能够在没有任何先验知识的情况下检测甚至不明显的异常值，并且由于其对由噪声或测量误差引起的数据集中的异常值的鲁棒性，通常在欺诈检测等实际应用中发现。因此，这些原因，加上其与其它算法相比的效率，使其在当今的机器学习从业者中相当受欢迎。\n\
  \n### 7.3.2.2 Local Outlier Factor\n\n局部异常因子（`LOF`）算法使用基于密度的聚类，以无监督的方式通过查看特定数据点在其\
  \ `n` 维空间中与邻居的接近程度来识别异常值，其中 `n` 表示数据集中存在的特征数量。较高的值表明它比其邻居更有可能成为异常值，反之亦然；如果给出较低的值，这些点更可能是正常点，因为它们周围有更近的邻居。\n\
  \n`LOF` 算法是异常检测的强大工具。它是一种非参数方法，用于识别数据中的异常值，可以帮助分析人员检测与邻近点显著不同的点。局部异常因子衡量单个点与其直接区域相比的突出程度。\n\
  \n`LOF` 算法首先使用 `K` 最近邻估计计算每个点的局部密度。这意味着对于任何给定点，`LOF` 将查看 `K` 个最近的观测值并计算平均密度值，称为可达距离（`RD`）。然后，它将此\
  \ `RD` 值用于计算每个数据点的分数，称为“局部异常因子”或 `LOF`，并将这些值与其他所有点进行比较，以确定哪些是异常值，哪些不是。它有助于识别哪些观测值在与邻居或整个数据集相比时可被视为异常。\n\
  \n为了说明 `LOF` 算法的工作原理，让我们考虑一个包含两个特征 `x` 和 `y` 以及五个观测值 A、B、C、D 和 E 的示例数据集。该数据集显示在\
  \ Table 7.14。\n\nTable 7.14 LOF base data\n\n| Observation | | X | | Y |\n| ---\
  \ | --- | --- |\n| A | | 1 | | 2 |\n| B | | 2 | | 3 |\n| C | | 3 | | 4 |\n| D |\
  \ | 10 | | 11 |\n| E | | 11 | | 12 |\n\n`LOF` 算法的第一步是使用 `K` 最近邻估计计算每个点的局部密度。为简单起见，假设\
  \ `K = 2`，这意味着我们将查看每个点的两个最近观测值。Table 7.15 显示了每个点与其两个最近邻居之间的距离，以及平均距离，即每个点的 `RD`。\n\
  \nTable 7.15 LOF nearest neighbor distances\n\n| Observation | | Nearest neighbours\
  \ | | Distances | | Rd |\n| --- | --- | --- | --- |\n| A | | B,C | | 1.41, 2.83\
  \ | | 2.12 |\n| B | | A,C | | 1.41, 1.41 | | 1.41 |\n| C | | B,D | | 1.41, 9.90\
  \ | | 5.66 |\n| D | | C,E | | 9.90, 1.41 | | 5.66 |\n| E | | D,C | | 1.41, 11.31\
  \ | | 6.36 |\n\n`LOF` 算法的第二步是通过比较其 `RD` 值与其最近邻居的 `RD` 值来计算每个点的 `LOF` 分数。`LOF` 分数的公式为：\n\
  \n`LOF(p) = (Sum of RD values of p’s nearest neighbors / k) / RD(p)`\n\nTable 7.16\
  \ 显示了数据集中每个点的 `LOF` 分数。\n\nTable 7.16 LOF scores of each data point\n\n| Observation\
  \ | | LOF score |\n| --- | --- | --- |\n| A | | 0.33 |\n| B | | 0.50 |\n| C | |\
  \ 0.50 |\n| D | | 1.76 |\n| E | | 1.77 |\n\n\n\n\n\n最后一步是根据 `LOF` 分数识别异常值。如果一个点的\
  \ `LOF` 分数显著高于 1，则认为它是异常值，这意味着它的密度远低于其邻居或整个数据集。在本例中，点 `D` 和 `E` 的 `LOF` 分数较高，因此是异常值，而点\
  \ `A`、`B` 和 `C` 的 `LOF` 分数较低，因此是正常观测值。\n\n除了是一种有效的异常检测方法外，`LOF` 相对简单：因为它仅使用一个参数\
  \ – `K-nearest neighbor` – 因此无需像其他机器学习算法那样进行复杂的调优或超参数优化。这使得 `LOF` 快速、高效，并且易于部署到真实世界的数据集上，无需花费太多精力或时间去调整参数，而这些参数在使用更复杂的算法如\
  \ `SVMs` 时可能会遇到。\n\n### 7.3.2.3 一类支持向量机\n\n`One-class support vector machine` (`OC\
  \ SVM`) 使用一类模型根据数据点与其他数据点在数据集中的相似性对数据点进行分类。它使用非线性超平面作为正常观测值和异常观测值之间的决策边界。`OCSVM`\
  \ 背后的基本概念是它在训练数据集周围创建 `n` 维超球面或边界，并将落在此边界之外的任何新观测值分离为异常值。该技术使用诸如多项式、线性、sigmoid 或径向基函数\
  \ (`RBF`) 等核函数来创建超球面。\n\n`RBF` 核是最常用的，因为它能够正确捕捉数据集中的非线性，而其他核则不能。我们使用诸如 `gamma` 值、衡量误分类惩罚的代价因子\
  \ `C`，以及在使用多项式核时训练模型的度参数 `d` 等参数。`Gamma` 值决定每个训练样本对决策边界的影响程度，而代价因子 `C` 指定在确定最优决策面时应给予正则化参数更高权重还是训练精度；也就是说，当\
  \ `C = 0` 时，对误分类没有惩罚，而在高值时则对误分类错误施加更重的惩罚。因此，它有助于创建对过拟合问题如数据集中存在的噪声具有鲁棒性的模型。较高的 `gamma`\
  \ 值表示每个样本对构建超平面有更大的影响。同时，较低的值会降低影响，但通过避免过拟合来提高泛化潜力。此外，度参数有助于我们根据数据集中特征的数量决定模型的复杂程度。\n\
  \n一旦确定了所有这些参数，我们就可以继续进行拟合/训练过程，在该过程中算法通过优化技术（如梯度下降）为给定问题找到最优解。获得最优解后，我们需要通过提供来自同一分布的一些新的未见数据点样本来测试训练好的模型，以便系统能够判断它们是否属于同一类。\n\
  \n### 7.3.3 降维\n\n降维是一种简化复杂问题的有力工具，同时保留原始数据集的相关信息。随着数据集中变量数量的增加，理解和解释这些变量的复杂性也随之增加。\n\
  \n该技术可以降低数据分析的复杂性和计算成本，提高预测算法的准确性，并简化数据可视化。主成分分析 (`PCA`) 是降维最常用的方法之一。`PCA` 通过找到输入特征之间的线性组合来实现降维，使得它们之间解释的方差最大。通过这样做，我们可以显著减少特征空间，同时仅牺牲模型解释的总方差的一小部分。\n\
  \n其他方法包括线性判别分析 (`LDA`)、因子分析 (`FA`)、Sammon 映射和 `Isomap`。每种方法都有其优缺点，因此在开始任何项目之前研究每种方法都是值得的。例如，如果你的数据集中有六个变量\
  \ (`A`、`B`、`C`、`D`、`E` 和 `F`)，你可以使用降维将其减少到 `A-B-C-D` 或 `A-E-F`。这将使我们能够用比最初假设更少的维度捕捉模式，而不会丢失对原始数据集结构和可能被遗漏的有价值见解的理解。\n\
  \n`PCA`、`LDA` 和其他方法通常被归类为降维技术，但这并不是它们的首要目的。相反，它们是寻找数据有效且有意义的表示的方法，以捕捉最相关信息并丢弃噪声或冗余。降维是这一过程的结果，而非其本身的目标。\n\
  \n#### 7.3.3.1 主成分分析\n\n主成分分析 (`PCA`) 是一种用于在保留其最重要的特征的同时减少数据集维度的方法。换句话说，它可以将大量数据压缩为更少数量的变量，同时信息损失最小。`PCA`\
  \ 找到原始变量的线性组合（或成分），这些组合解释了数据中最大量的方差。换句话说，它找到变量的最佳组合，以最好地捕捉关于数据集中所有其他变量的最多的信息。这意味着\
  \ `PCA` 将数百甚至数千个独立变量减少到少数几个，而不会丢失太多关于它们之间的关系以及它们所代表的内容的信息。\n\n`PCA` 的思想是将复杂问题简化为更简单、更易于管理的形式。它通过识别不同变量之间的潜在模式和关系并删除对正确理解它们不太重要的变量来实现这一点。此外，`PCA`\
  \ 还有助于特征选择；确定哪些特征的权重更大可以帮助研究人员识别在创建模型或对数据集进行分析时应重点关注哪些特征。\n\n**步骤**\n\n**步骤 1：收集和预处理数据。**\
  \ 这包括将数据组织成适当的格式，处理缺失值，删除异常值并对其进行标准化。预处理有助于确保所有变量都是数值型并且可用于进一步分析。\n\n**步骤 2：计算变量之间的相关性。**\
  \ 在预处理之后，每个变量需要在进行 `PCA` 分析之前与其对应的一个或多个变量进行相关性计算。这种两个或多个变量之间的相关性可以帮助识别它们之间的关系，表明它们在使用机器学习算法进行预测或分类任务时可能有多有用。\n\
  \n**步骤 3：计算协方差矩阵：** 一旦计算出相关性，就需要使用文献中可用的合适数学方程计算协方差矩阵。协方差矩阵告诉我们不同特征之间的变化程度。它解释了如果其他任何特征发生变化，某个特定特征会带来多少变化。高协方差值表示两个特征之间存在重要的依赖性，而低值则表示依赖性较弱。\n\
  \n**步骤 4：执行特征值分解。** 此步骤涉及从协方差矩阵计算特征值。在这里，每个列向量对应于特征列的特征向量，这些特征列包含与输入矩阵中发现的相同元素，但根据其相对于其他特征值的显著性以不同的方式排列。这使我们能够将重要特征与不太重要的特征分开，并相应地减少维度，而不会丢失原始数据集中包含的大量信息。\n\
  \n\n\n\n\n## Step 5: Select the Principal Components\n这里，我们根据各特征向量对数据集中总方差的贡献，从所有先前计算的特征向量中选择最佳主成分，即应始终先选择解释方差比率最高的，随后选择第二高的，以此类推，直到达到所需的主成分数。由此我们保持累积解释方差比率高于某一阈值水平，这使我们能够在大幅降低处理过程中所涉及维度的同时保持预测任务所需的准确性。\n\
  \n## Step 6: Project the Data onto the Selected Principal Components\n在确定了模型的最佳主成分后，就要将输入数据投影到这些仅由所选主成分组成的新创建的低维空间中。\n\
  \n例如，假设有一个包含四个变量 `X1`、`X2`、`X3` 和 `X4` 的样本数据集。该数据集有 10 个观测值，显示在 Table 7.17\n\nTable\
