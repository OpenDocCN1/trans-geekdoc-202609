  \nOutput:\n\n![](img/687-1.jpg)\n\n### 13.6 Finding Outliers\n13.6Finding Outliers\n\
  \n```python\ndef find_outlier(ds,col):\n    quart1 = ds[col].quantile(0.25)\n  \
  \  quart3 = ds[col].quantile(0.75)\n    IQR = quart3 - quart1 #Inter-quartile range\n\
  \    low_val = quart1 - 1.5*IQR\n    high_val = quart3 + 1.5*IQR\n    ds = ds.loc[(ds[col]\
  \ < low_val) | (ds[col] > high_val)]\n    return ds\n```\n\n我们想要编写一个函数来查找数据集中的异常值：`def\
  \ find_outlier(ds, col)`。该函数将数据集 (`ds`) 和列名 (`col`) 作为输入参数。它返回数据集的一个子集，其中仅包含给定列中的异常值。异常值定义为与第一或第三四分位数相距超过\
  \ 1.5 倍四分位距 (`IQR`) 的值。`IQR` 是列值的第 75 百分位数 (`quart3`) 与第 25 百分位数 (`quart1`) 之间的差值。第一四分位数是通过在列上调用\
  \ `quantile()` 方法并将 0.25 作为参数来计算的。第三四分位数是通过在列上调用 `quantile()` 方法并将 0.75 作为参数来计算的。异常值的下界\
  \ (`low_val`) 是通过从第一四分位数减去 1.5 倍 `IQR` 计算得出的。异常值的上界 (`high_val`) 是通过向第三四分位数加上 1.5\
  \ 倍 `IQR` 计算得出的。`loc()` 方法用于通过选择列值小于 `low_val` 或大于 `high_val` 的行来过滤数据集。过滤后的数据集作为函数的输出返回。\n\
  \n### 13.7 Removing Outliers\n13.7Removing Outliers\n\n```python\ndef remove_outlier(ds,col):\n\
  \    quart1 = ds[col].quantile(0.25)\n    quart3 = ds[col].quantile(0.75)\n    IQR\
  \ = quart3 - quart1 #Inter-quartile range\n    low_val = quart1 - 1.5*IQR\n    high_val\
  \ = quart3 + 1.5*IQR\n    df_out = ds.loc[(ds[col] > low_val) & (ds[col] < high_val)]\n\
  \    df_out.dropna(axis=0, how = 'any')\n    return df_out\n```\n\n该程序是一个函数，接受两个参数：数据集\
  \ (`ds`) 和列名 (`col`)。该函数旨在使用四分位距 (`IQR`) 方法从数据集的给定列中移除异常值。函数执行以下步骤。\n\n它使用 `quantile()`\
  \ 方法计算列值的第一四分位数 (`quart1`) 和第三四分位数 (`quart3`)。它将 `IQR` 计算为第三四分位数与第一四分位数之间的差值。它将异常值的下界和上界定义为分别在第一和第三四分位数下方和上方\
  \ 1.5 倍 `IQR`。它使用 `loc()` 方法过滤掉数据集的列值在下界和上界之内的行，并将它们分配给新的 DataFrame (`df_out`)。它使用\
  \ `dropna()` 方法删除任何列中存在缺失值的行。它返回新的 DataFrame (`df_out`)，其中仅包含给定列的非异常值。Table 13.2\
  \ 列出了与删除行相关的各种函数。\n\nTable 13.2Various functions related to removing rows\n\n| S.No\
  \ || Function || Explanation |\n| --- | --- | --- |\n| 1 || data = data.drop_duplicates()\
  \ || Removing duplicate rows |\n| 2 || data = data.dropna(axis = 0, how = 'all')\
  \ || Removing all rows where the values of any columns are NaN |\n| 3 || data =\
  \ data.dropna(axis = 1, how = 'all') || Removing all columns where the values of\
  \ any rows are NaN |\n| 4 || data = data.dropna(axis = 0, how = 'any') || Removing\
  \ all rows where the values of any columns are NaN |\n| 5 || data = data.dropna(axis\
  \ = 1, how = 'any') || Removing all columns where the values of any row are NaN\
  \ |\n\n### 13.8 Imputing Null Values\n13.8Imputing Null Values\n\n```python\ndef\
  \ impute_nullvalues(ds,col):\n    hp_mean = np.mean(data[col])\n    imputedrows\
  \ = data[data[col].isnull()]\n    imputedrows = imputedrows.replace(np.nan, hp_mean)\n\
  \    #Then the portion of the data set not having any missing row is kept apart.\n\
  \    missval_removed_rows = data.dropna(subset=[col])\n    # Then join back the\
  \ imputed rows and the remaining part of the data set.\n    data_mod = pd.concat([missval_removed_rows,\
  \ imputedrows])\n    # data_mod = missval_removed_rows.append(imputedrows, ignore_index=True)\n\
  \    return data_mod\n```\n\n在移除异常值后，我们可以使用函数 `impute_nullvalues(ds, col)` 对列中的空值进行处理，用该列的均值替换。\
  \ 该函数接受数据集 (`ds`) 和列名 (`col`) 作为参数。它返回一个修改后的数据集，其中列中的缺失值被非缺失值的均值替换。\n\n首先，它使用 NumPy\
  \ 计算列中非缺失值的均值：`hp_mean = np.mean(data[col])`。然后，它使用 pandas 创建数据集的一个子集，其中列具有缺失值：`imputedrows\
  \ = data[data[col].isnull()]`。接下来，它使用 pandas 用均值替换缺失值：`imputedrows = imputedrows.replace(np.nan,\
  \ hp_mean)`。然后，它使用 pandas 创建数据集的另一个子集，其中列没有缺失值：`missval_removed_rows = data.dropna(subset=[col])`。最后，它使用\
  \ pandas 将两个子集连接起来形成修改后的数据集：`data_mod = pd.concat([missval_removed_rows, imputedrows])`。\n\
  \n或者，它也可以使用 `append()` 方法连接两个子集：`data_mod = missval_removed_rows.append(imputedrows,\
  \ ignore_index=True)`。它将修改后的数据集作为函数的输出返回：`return data_mod`。\n\n### 13.9 Capping\
  \ the Outlier Values\n13.9Capping the Outlier Values\n\n```python\ndef cap_outlier(ds,\
  \ col):\n    outliers = find_outlier(ds,col)\n    quart1 = data[col].quantile(0.25)\n\
  \    quart3 = data[col].quantile(0.75)\n    IQR = quart3 - quart1 #Getting the value\
  \ of IQR\n    outliers.loc[:, col] = 1.5*IQR # Capping the outlier values with 1.5\
  \ times IQR value…\n    outlier_removed_rows = remove_outlier(data,col)\n    data_mod\
  \ = pd.concat([outlier_removed_rows, outliers])\n    #data_mod = outlier_removed_rows.append(outliers,\
  \ ignore_index=True)\n    return data_mod\n```\n\n该函数接受数据集 (`ds`) 和列名 (`col`) 作为输入。它返回一个修改后的数据集，其中给定列中的异常值被限制。限制意味着用某个阈值替换异常值。这可以帮助减少异常值对数据分析的影响。\n\
  \n`outliers = find_outlier(ds, col)`\n\n此行调用另一个函数来查找列中的异常值。\n\n`quart1 = data[col].quantile(0.25)`\n\
  \n此行计算列的第一四分位数，即数据下半部分的中位数。\n\n`quart3 = data[col].quantile(0.75)`\n\n此行计算列的第三四分位数，即数据上半部分的中位数。\
  \ `IQR = quart3 - quart1`。此行计算四分位距 (`IQR`)，即第三四分位数与第一四分位数之间的差值。\n\n`outliers.loc[:,\
  \ col] = 1.5*IQR`\n\n此行用 1.5 倍 `IQR` 值替换异常值，这是限制异常值的常见方法。\n\n`outlier_removed_rows\
  \ = remove_outlier(data, col)`\n\n此行调用另一个函数从原始数据集中删除包含异常值的行。\n\n`data_mod = pd.concat([outlier_removed_rows,\
  \ outliers])`\n\n此行将不含异常值的数据集和已限制的异常值连接（合并）成一个新数据集。\n\n`data_mod = outlier_removed_rows.append(outliers,\
  \ ignore_index=True)`\n\n\n\n\n\n这行被注释掉了，这意味着它不会被执行。它是连接两个数据集的另一种方式，但会忽略行的原始索引。`return\
  \ data_mod`。这行将修改后的数据集作为函数的输出返回。\n\n### 13.10 将数据拆分为训练集和测试集\n\n将数据拆分为训练集和测试集是机器学习中的常见做法。这样做的主要原因是评估模型的性能和泛化能力。训练数据用于拟合模型参数，而测试数据则衡量模型预测新数据和未见数据的能力。通过拆分数据，我们可以避免过拟合，即模型从训练数据中学习过多而无法泛化到新数据。\n\
  \n拆分数据的优势如下：\n\n• 它使我们能够估计模型在新数据上的准确率和错误率，这对于选择最佳模型和调整其超参数至关重要。\n• 它帮助我们检测和防止过拟合，从而导致性能不佳和预测不可靠。\n\
  • 它使我们能够根据测试结果比较不同的模型和算法，这有助于我们为问题选择最合适的模型。\n• 它为我们提供了一种验证我们对数据和模型的假设和假设的方法，这可以提高我们对结果的理解和解释。\n\
  \n## 将数据拆分为训练集和测试集\n\n```\nX_train, X_test, Y_train, Y_test = train_test_split(X_scaled,\
  \ Y, test_size = 0.2, random_state = 42)\n```\n\n```\n# The parameter, test_size\
  \ sets the ratio of test data to the input data to 0.2 or 20% and random_state sets\n\
  # the seed for random number generator\n```\n\n此程序使用 `sklearn.model_selection` 模块中的\
  \ `train_test_split()` 函数将数据拆分为训练集和测试集。该函数接受四个参数：`X_scaled`、`Y`、`test_size` 和 `random_state`。`X_scaled`\
  \ 是已缩放为零均值和单位方差的输入数据。`Y` 是输出数据或目标变量。`test_size` 是一个介于 0 和 1 之间的浮点值，指定用作测试集的数据比例。在本例中，`test_size`\
  \ 设置为 0.2，这意味着 20% 的数据将用于测试，其余 80% 将用于训练。`random_state` 是一个整数值，设置在拆分前对数据进行洗牌的随机数生成器的种子。通过将\
  \ `random_state` 设置为固定值，例如 42，我们可以确保每次运行程序时都能重现相同的拆分。该函数返回四个值：`X_train`、`X_test`、`Y_train`\
  \ 和 `Y_test`。这些分别是训练集和测试集的输入和输出数据。\n\n### 13.11 训练和评估模型\n\n我们必须在机器学习中训练和评估模型，以确保其在新数据和未见数据上表现良好。训练模型涉及在给定的训练数据集上找到使损失函数最小化的最优参数。评估模型包括在未用于训练的单独验证集或测试集上衡量模型的性能。\n\
  \n训练和评估模型的优势如下：\n\n• 训练模型使我们能够从数据中学习并发现可用于预测或推理的模式或关系。\n• 评估模型使我们能够评估模型对新数据的泛化程度并避免过拟合或欠拟合问题。\n\
  • 训练和评估模型可以帮助我们比较不同的模型或算法并为我们的任务或问题选择最佳模型。\n• 训练和评估模型可以帮助我们通过调整超参数、添加正则化或使用更多数据来改进模型。\n\
  \n## 训练逻辑回归模型\n\n```\nmodel = LogisticRegression()\nmodel.fit(X_train, Y_train)\n\
  # making predictions on the test set\nY_pred=model.predict(X_test)\n# Evaluating\
  \ the model performance\nfrom sklearn.metrics import accuracy_score, confusion_matrix,\
  \ classification_report\nprint (accuracy_score(Y_test, Y_pred)) # 1.0\nprint (confusion_matrix(Y_test,\
  \ Y_pred)) # [[1 0 0 0] [0 9 0] [0 0 11]]\nprint (classification_report(Y_test,\
  \ Y_pred))\n```\n\n上述程序是使用逻辑回归将数据分类为三个类别的示例。该程序执行以下步骤：\n\n1. 它从 `sklearn.linear_model`\
  \ 模块导入 `LogisticRegression` 类并创建名为 `model` 的实例。\n2. 它使用模型的 `fit` 方法在训练数据上训练它，训练数据由两个数组组成：`X_train`\
  \ 和 `Y_train`。`X_train` 包含每个样本的输入特征，`Y_train` 包含相应的类别标签（0、1 或 2）。\n3. 它使用模型的 `predict()`\
  \ 方法对测试数据进行预测，测试数据是另一个名为 `X_test` 的数组。预测结果存储在名为 `Y_pred` 的数组中。\n4. 它通过使用 `sklearn.metrics`\
  \ 模块中的各种指标来评估模型性能。\n5. 它导入 `accuracy_score`、`confusion_matrix` 和 `classification_report`\
  \ 函数并打印其结果。\n\n`accuracy_score()` 函数返回正确预测的比例，在本例中为 1.0。`confusion_matrix()` 函数返回一个矩阵，显示每个类别有多少样本被正确或错误分类。对角线元素代表真正例，而非对角线元素代表假正例和假负例。`classification_report`\
  \ 函数返回一个文本报告，总结每个类别的精确率、召回率、f1 分数和支持度。精确率是真正例与所有预测为正例的比例，召回率是真正例与所有实际为正例的比例，F1 分数是精确率和召回率的调和平均值，支持度是每个类别中的样本数。\n\
  \n### 13.12 防止过拟合的正则化技术\n\n正则化技术是修改学习算法或模型以降低复杂性并防止过拟合的方法。正则化技术可以通过向模型参数添加约束或惩罚来帮助避免过拟合，例如将它们收缩到零或限制其大小。正则化技术的一些示例是\
  \ L1 和 L2 正则化、dropout、提前停止和数据增强。\n\n不同的因素，例如训练集和验证集之间的性能差距、模型的复杂性、数据的大小和质量以及问题的领域知识，可以指示要使用的正则化技术。\n\
  \nRidge 和 LASSO 都是帮助防止线性回归模型过拟合的正则化技术。以下是演示这些正则化技术的 Python 程序：\n\n```\n# Import\
  \ necessary libraries\nimport numpy as np\nimport pandas as pd\nfrom sklearn.linear_model\
  \ import Ridge, Lasso\nfrom sklearn.model_selection import train_test_split\nfrom\
  \ sklearn.metrics import mean_squared_error\n# Load the dataset\ndata = pd.read_csv('data.csv')\n\
  print(data.shape)\ndata.head()\n# Checking for any null values in dataset\ndata.isnull().sum()\n\
  # Split the dataset into training and testing sets\nX_train, X_test, y_train, y_test\
  \ = train_test_split(data.drop('target', axis=1), data['target'], test_size=0.2,\
  \ random_state=42)\n# Ridge Regression\nridge = Ridge(alpha=0.5)\nridge.fit(X_train,\
  \ y_train)\n# Lasso Regression\nlasso = Lasso(alpha=0.5)\nlasso.fit(X_train, y_train)\n\
  # Evaluate the models\nridge_pred = ridge.predict(X_test)\nlasso_pred = lasso.predict(X_test)\n\
  ridge_mse = mean_squared_error(y_test, ridge_pred)\nlasso_mse = mean_squared_error(y_test,\
  \ lasso_pred)\nprint(\"Ridge MSE:\", ridge_mse)\nprint(\"Lasso MSE:\", lasso_mse)\n\
  ```\n\n输出：\n\n```\n# Ridge MSE: 0.034\n# Lasso MSE: 0.041\n```\n\n\n\n\n\n在本程序中，我们首先导入必要的库。然后我们加载数据集并使用\
  \ `train_test_split` 函数将其拆分为训练集和测试集。随后我们使用 `alpha` 值设为 `0.5` 创建岭回归和 LASSO 回归模型。我们将这些模型拟合到训练数据上并预测测试集的目标值。最后，我们使用均方误差\
  \ (`MSE`) 评估模型并打印结果。\n\nML 程序的输出表明，岭回归模型的均方误差 (`MSE`) 低于 LASSO 回归模型。这意味着岭模型对数据的拟合更好，且比\
  \ lasso 模型更不容易过拟合。岭模型通过将特征系数的平方值添加到损失函数中来惩罚系数，而 LASSO 模型则通过添加其绝对值来惩罚系数。LASSO 模型可以将某些系数收缩为零，从而实现特征选择，但它也可能引入偏差和方差。岭模型保留所有特征，但也可以降低它们对预测的影响。因此，正则化参数\
  \ (`alpha`) 的选择对两个模型都至关重要，因为它决定了偏差与方差之间的权衡。可以使用交叉验证技术来找到使两个模型的 `MSE` 最小的最佳 `alpha`\
  \ 值。\n\n## 13.13 实现线性回归\n\n以下是实现线性回归的完整 Python 程序：\n\n```python\n# Import necessary\
