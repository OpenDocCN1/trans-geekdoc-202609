  \n![](img/img22.jpg)\n\n![](img/img23.jpg)\n\n该程序首先导入用于数据处理、模型创建和评估的必要模块。加载 Iris\
  \ 数据集并拆分为训练集和测试集。初始化随机森林分类器模型并在训练数据上进行训练。然后使用模型的预测来计算准确率、精确率、召回率、F1 分数和混淆矩阵。最后，提供一个样本输入以及模型的预测和过程说明。此程序使用指定的指标对\
