  \ `Sky` 获得，因此它是 C4.5 生成的决策树的根节点 (Fig. 8.8)。\n\n![](img/f8-8.jpg)\n\nFigure 8.8 Decision\
  \ tree obtained using the C4.5 algorithm\n\n### 8.3.3 The CART Algorithm\n\n`CART`\
  \ 代表分类与回归树。可用于分类和回归问题。如果目标变量设为类别标签，则使用所得决策树进行分类。另一方面，如果目标变量是数值或预测/估计某数量的数值，则使用所得决策树进行回归。\n\
  \n`CART` 使用基尼指数作为划分数据的度量。其定义为\n\n(8.7)\n\n$\\text{Gini}\\left( S \\right) = 1 -\
  \ \\sum\\limits_{i = 1}^{m}p_{i}^{2},$\n\n其中 `p[i]` 是 `S` 中的一个实例属于类别标签 `c[i]` 的概率，总共有\
  \ `m` 个类别。`Gini(S )` 衡量给定数据集 `S` 的总不纯度。\n\n为了找到划分，我们计算每个属性的基尼指数。设属性 `A` 根据两种取值划分为两组\
  \ `D1` 和 `D2`。则 `A` 的基尼指数计算为\n\n(8.8)\n\n$\\text{Gini}_{A}\\left( S \\right) = \\\
  frac{\\left| {D1} \\right|}{\\left| D \\right|}\\text{Gini}\\left( {D1} \\right)\
  \ + \\frac{\\left| {D2} \\right|}{\\left| D \\right|}\\text{Gini}\\left( {D2} \\\
  right)$\n\n对于离散值属性，选择基尼指数最小的属性作为其划分子集。对于连续数据，采用与 C4.5 算法类似的策略。\n\n在属性 `A` 上产生的纯度降低为\n\
  \n(8.9)\n\n*Δ*Gini(*A*) = Gini(*S*) − Gini*A*\n\n选择使纯度降低最大化的属性作为划分属性。\n\n### 8.3.4\
  \ Drawbacks of Decision Tree Learning\n\n决策树是分类问题中流行的 ML 技术。然而，它们也有一些需要解决的局限性：\n\
  \n• 无法处理连续属性：决策树只能根据属性的离散值对数据进行划分。这意味着如果一个属性具有连续的取值范围，如身高或体重，决策树必须将其离散化为箱或区间。这可能导致信息和精度的损失，以及树的复杂性增加。\n\
  \n• 无法确定决策树生长的深度：决策树如果数据中属性和类别很多，可能变得非常庞大和复杂。这可能导致过拟合，即树在训练数据上表现良好，但在新数据或未见数据上表现不佳。为了避免过拟合，决策树需要进行剪枝或在某一点停止生长。然而，确定何时停止生长树没有明确或最优的标准。不同的剪枝方法可能导致精度与复杂性之间的不同权衡。\n\
  \n• 无法处理训练数据中存在缺失属性值的情况：决策树要求训练数据中的每个实例对每个属性都有值。然而，在现实世界数据中，可能存在某些属性值缺失或未知的实例。这对决策树学习构成挑战，因为不清楚如何根据此类属性划分数据。处理缺失值的方法有多种，如忽略它们、用均值或众数值替换它们，或使用概率模型。然而，每种方法都有其假设和局限性。\n\
  \n• 计算效率高：决策树学习是一种贪心算法，试图在树的每个节点找到最佳划分。这意味着它必须在每个节点评估所有可能属性的所有可能划分。这在数据具有许多属性和实例时可能计算成本很高。此外，决策树学习并不能保证找到最优或全局解，因为它可能陷入局部最优。\n\
  \n### 8.4 Random Forests\n\n随机森林是一种可执行分类和回归任务的 ML 算法。它基于集成学习的思想，即将多个弱学习器组合起来创建强学习器。弱学习器是一个简单的模型，可以做出预测，但错误率较高。强学习器是一个复杂的模型，可以做出准确的预测，但计算成本高。\n\
  \n随机森林中的弱学习器是决策树，它们是根据某些标准将数据划分为更小子集的图形模型。例如，如果我们想将一个人分类为患糖尿病或不患糖尿病，我们可以使用一个决策树来提问诸如“这个人的年龄是否超过\
  \ 50 岁？”或“这个人的血糖水平是否超过 200？”之类的问题。每个问题导致树中的一个分支，每个分支以表示类别标签（糖尿病或无糖尿病）的叶节点结束。\n\n\
  随机森林使用许多不同的决策树。每个决策树在随机森林中进行预测，结果由获得最多票数的预测决定。此方法用于确定随机森林在分类任务中的结果 (Fig. 8.9)。\n\
  \n![](img/f8-9.jpg)\n\nFigure 8.9 Random forest example\n\n为了说明随机森林的工作原理，让我们考虑一些例子：\n\
  \n\n\n\n\n想象一下，我们尝试从一组身高和体重数据中预测一个人的 `BMI`（身体质量指数）值。在这里，我们可以使用监督学习技术，例如 `linear\
  \ regression`。然而，我们可以通过 `random forest` 将事情推进一步，考虑不同的输入参数，如年龄、性别、身高和体重，这可能会提高我们的预测准确性。为了实现这一点，我们将从这四个输入特征中随机选择一些子集，并将其对应的\
  \ `BMI` 值作为训练示例，即我们的“训练集”。然后，我们将使用这些子集作为每个树的输入或特征构建多个决策树，同时将其标记为 `BMI` 值，即我们希望模型在面对新数据点时能够准确预测的输出变量或目标标签。\n\
  \n假设你有一组大量图像，分为猫和狗两类，你希望每次呈现新图像时都能对其进行分类。当然，这可以使用其他监督学习算法来完成，例如 `SVM`。然而，由于其复杂性，它们不一定能产生最高的准确率分数。在这里，`random\
  \ forest` 证明了其价值，因为它不仅能够定量分析像素值，还能够在多个猫-狗图像实例中对像素内的形状模式进行定性检查，从而提高图像分类的准确性。\n\n\
  `Random forests` 确实有一些缺点。它们可能过拟合数据，这意味着它们从数据中的噪声和异常值中学习得太多，无法推广到新数据。它们也可能不稳定，这意味着数据中的微小变化可能导致树结构的大幅变化。为了解决这些问题，`random\
  \ forests` 使用两种技术：`bagging` 和 `feature selection`。\n\n`Bagging` 指的是自助聚合，这意味着有放回地抽样数据并从这些样本中创建多个决策树。每个决策树都在不同的数据子集上训练，因此它们可能具有不同的错误和偏差。通过组合这些树，我们可以降低预测的方差并提高准确性。组合可以通过分类任务的投票或回归任务的平均来获得。例如，如果我们有\
  \ 10 个决策树，其中 7 个预测糖尿病，3 个预测无糖尿病，我们可以使用多数投票并将糖尿病分配为最终预测。\n\n`Feature selection` 意味着在决策树的每个节点随机选择一组特征（变量）来分割数据。这降低了树之间的相关性并增加了集成模型的多样性。例如，如果我们有\
  \ 100 个特征，并且在每个节点选择 10 个特征，我们可以创建使用不同特征组合进行预测的不同树。\n\n## 8.5 线性分类器\n\n线性分类器是一种强大的\
  \ ML 技术，用于监督学习问题，根据数据的属性将新数据分类到广泛的类别中。标准的线性分类器包括线性 `SVMs` 和 `logistic regression`，它们使用线性决策边界将数据划分为不同的组。目标是识别将数据划分为不同组的决策边界，并在\
  \ `logistic regression` 的情况下，使用 sigmoid 函数将输出转换为 0 到 1 之间的概率。虽然这些方法对线性可分的数据集有帮助，但核方法，例如核技巧，可以用于将非线性可分的数据集映射到更高维空间。总体而言，线性分类器是分类问题的实用工具。然而，它们的有效性可能受到其对线性可分数据的需求以及依赖于单一线性决策边界的限制。\n\
  \n让我们考虑一个例子，我们有一个包含房屋价格信息的数据集，例如每栋房屋的平方英尺和卧室数量。鉴于他们的收入水平，我们希望利用这些信息来预测某人是否有能力购买其中一栋房屋。为此，我们可以使用线性分类器，例如\
  \ `logistic regression`，它将使用线性方程拟合我们的数据集，并根据其平方英尺和卧室数量的值与同一价格范围内其他房屋的比较，为每个观测值生成概率（得分更高的观测值更有可能）。\n\
  \n然后可以将此概率分数用于预测某人是否能够购买并负担得起我们给定数据集中的一栋房屋，不同的输入变量例如收入水平或邮政编码区域。例如，通过这种方法，我们可以根据不同标准生成一个人能够负担特定房产的可能性概率，这有助于我们在无需明确编程指令的情况下对潜在购房者的能力做出更准确的决策。\n\
  \n要了解线性分类器的工作原理，我们需要引入一些数学符号。设 `X` 为描述对象的 `d` 个特征的向量，例如电子邮件中的词频。设 `y` 为表示对象类别的分类变量，例如垃圾邮件或非垃圾邮件。设\
  \ `K` 为可能类别的数量，设 `w_k` 为类别 *k* 的权重向量。那么，给定 `X` 的类别 k 的分数为\n\n(8.10)\n\n`sk = w[k]^T\
  \ X`\n\n点积是衡量两个向量相似度的一种方法：当向量指向同一方向时，它很高，当它们指向相反方向时，它很低。基于其特征的分数 `sk`。\n\n线性分类器然后将\
  \ `X` 分配给得分最高的类别：\n\n(8.11)\n\n`y = argmax(k) sk`，\n\n其中 `argmax(k)` 表示找到使 `sk`\
  \ 最大的 `k` 的值。这意味着线性分类器将特征空间划分为由超平面分隔的区域，其中每个区域对应一个类别。超平面是二维中线的推广和三维中平面的推广：它是比原始空间低一维的子空间，将空间划分为两部分。例如，在\
  \ 2D 中，超平面是一条线；在 3D 中，超平面是一个平面；在 4D 中，超平面是 3D 空间。\n\n有不同的方式可以从一组带标签的训练数据中学习权重 `w_k`。一些方法基于生成模型，试图建模\
  \ `X` 和 `y` 的联合概率分布；一些方法基于判别模型，试图建模给定 `X` 的 `y` 的条件概率分布；一些方法基于优化技术，试图最小化衡量预测类别与真实类别之间误差的损失函数。\n\
  \n### 8.5.1 线性分类器的优点和缺点\n\n线性分类器的优点是它们简单且训练和使用速度快，尤其是在特征数量很大时。它们还可以为许多实际问题实现高准确率，例如文档分类或图像识别、情感分析、垃圾邮件检测等。这意味着线性分类器可以高效处理高维数据，而无需太多计算资源或内存。\n\
  \n另一个优点是它们易于解释和说明。定义线性分类器决策边界的线性函数可以写成特征的加权和，其中权重表示每个特征对分类任务的重要性或相关性。\n\n\n\n\n\n\
  线性分类器不仅快速、简单、准确且可解释，而且灵活且可适应。它们可以扩展和修改以适应不同类型的数据和问题。例如，线性分类器可以与非线性变换或核函数结合，以处理线性不可分的数据。线性分类器还可以通过在目标函数中添加一个控制线性函数复杂性或平滑度的项来进行正则化或惩罚，以防止过拟合或欠拟合。线性分类器还可以与其他机器学习技术集成，例如集成方法、提升、装袋等，以提高其鲁棒性和多样性。它们还可以适应不同的学习场景，例如在线学习、主动学习、半监督学习等，通过根据新数据或反馈增量或选择性地更新其权重。\n\
  \n然而，线性分类器也存在一些局限性。例如，它们无法捕捉特征与类别之间复杂的非线性关系，并且可能对数据中的异常值或噪声敏感。因此，对于需要更具表达能力的模型的问题，例如图像识别、自然语言生成等，线性分类器可能效果不佳。\n\
  \n### 8.5.2 学习线性分类器的权重\n\n有不同的方法可以从一组带标签的训练数据中学习线性分类器的权重。其中一些方法是生成模型，它们试图建模特征和类别的联合概率分布，而另一些是判别模型，它们试图建模给定特征的类别条件概率分布。\n\
  \n生成模型的例子：\n\n`Linear discriminant analysis` (`LDA`)：该方法假设特征在每个类别内服从高斯分布，并试图找到一个线性投影以最大化类别之间的分离。\n\
  \n`Naive Bayes classifier`：该方法假设特征在给定类别下条件独立，并试图使用频率计数估计每个类别中每个特征值的概率。\n\n判别模型的例子：\n\
  \n`Logistic regression`：该方法假设每个类别的分数是特征值的逻辑函数，并试图通过梯度下降或其他优化技术最大化观测数据的似然。\n\n`Perceptron`：该方法根据训练数据上的错误迭代更新权重，直到没有错误或达到最大迭代次数。\n\
  \n`Support Vector Machine` (`SVM`)：该方法试图找到一个分离类别的超平面，使其间隔最大，使用二次规划或其他优化技术\n\n###\
  \ 8.5.3 线性判别分析\n\n`Linear discriminant analysis` (`LDA`) 是一种旨在找到高维特征空间到低维空间的线性投影的方法，该投影最大化不同类别数据之间的分离。\n\
  \n它基于两个假设：第一，特征在每个类别内服从高斯分布；第二，特征的协方差矩阵在所有类别中相等。这些假设意味着数据是线性可分的，即线性决策边界可以准确地分离不同的类别。\n\
  \n`LDA` 通过找到一组线性判别式来工作，这些判别式是特征空间中最好地区分不同类别的方向。`LDA` 通过最大化类间方差与类内方差的比率来实现这一点，该比率也称为\
  \ Fisher 准则。该比率衡量投影数据点按类别聚类的程度以及它们彼此之间的距离。\n\n让我们考虑一个属于两个不同类别的二维数据点的例子。当我们在二维平面上绘制数据点时，我们可以看到没有一条直线可以完全分离这两个类别。然而，如果我们对该数据应用\
  \ `LDA`，我们可以找到一个线性判别式，将数据点投影到一维线上。在这条线上，我们可以看到投影的数据点按类别分离得比在原始平面上更好。\n\n`LDA` 是一种广泛用于监督学习的用于将数据点根据其特征分类到不同组的方法。`LDA`\
  \ 的优势在于其简单性和计算有效性。估计每个类的均值和协方差是 `LDA` 的唯一要求，这可以通过矩阵运算轻松完成。接下来，它将数据映射到低维空间以优化不同类之间的区分。通过降低问题的维度和复杂性，使其变得更快捷、更容易解决。\n\
  \n为了说明这一好处，让我们设想一个面部识别的案例。假设我们拥有一个包含不同个体面部照片的数据集，我们的目标是确定图像中每个人的身份。执行此任务的一种方法涉及利用每张图像的原始像素值作为特征，然后使用\
  \ `logistic regression` 或 `SVM` 等分类器。然而，这种策略存在几个局限性。首先，因素的数量非常庞大，相当于每张图像中的像素数量。因此，该问题在维度上变得复杂，需要大量的处理资源。此外，原始像素值可能无法涵盖每个面部的根本属性，例如其形状、颜色、纹理等。这加剧了问题，使其变得嘈杂而复杂。\n\
  \n`LDA` 可以通过将原始像素信息转换为更重要和更紧凑的表示来解决这些局限性。`LDA` 通过根据训练数据计算每个类（每个人的面部）的平均值和方差来实现这一点。均值是表示每个人面部算术平均值的统计量，而协方差量化每个像素偏离常态的程度。统计数据涵盖了每个面部的核心属性，包括其形状、颜色、纹理等。随后，`LDA`\
  \ 识别出一个线性映射，通过将数据投影到维度更少的空间来优化类之间的区分。这意味着投影的数据点与其自身类的均值更接近，而不是其他类的均值。这简化了问题的分类，因为类定义更清晰，重叠更少。\n\
  \n`LDA` 发现的低维空间通常被称为判别空间，因为它能够区分不同的类。该空间的维度等于类别数减一。例如，当我们的数据集包含 10 个人时，`LDA` 将数据映射到\
  \ 9 维空间。减少后的特征空间远小于原始空间，后者可能包含数百或数百万个维度，具体取决于图像分辨率。这极大地降低了任务的计算成本和复杂性。潜在狄利克雷分配 (`LDA`)\
  \ 是一种简单而有效的方法，可以提高监督学习任务的准确性和效率。\n\n\n\n\n\n## LDA 的优势\n\nLDA 的一个优势在于其能够处理多重共线性，即当某些变量表现出强相关性时，导致模型内部不稳定和冗余。这些因素可能导致过拟合、将知识应用于新情况的能力受限，以及对特征重要性的评估不精确。LDA\
  \ 使用合并协方差矩阵来解决此问题，合并协方差矩阵是每个类别特有的协方差矩阵的加权平均值。协方差矩阵量化了每个属性彼此之间变化的程度以及它们对类别分离的各自贡献。\n\
  \nLDA 的另一个优势在于其能够有效处理特征数量远超训练样本数量的情况。这种现象经常出现在高维数据集中，例如照片或文本，其中可以从数据中提取大量潜在特征，但有效学习的数据点却不足。LDA\
  \ 适用于这种情况，因为它将数据的维度降低到与类别数量相符，防止过拟合并增强泛化能力。\n\n## LDA 的局限性\n\n然而，LDA 也有一些局限性。它依赖于某些假设，这些假设在现实世界中可能并不总是适用。其基本假设之一是数据呈现高斯分布，其特征为钟形曲线并且围绕均值对称分布。该假设预设数据中不存在任何异常值、偏态或多峰性，而这些都是众多数据集中常见的属性。异常值有可能影响数据的均值和方差，而均值和方差对于\
  \ LDA 计算最佳线性判别至关重要。\n\n偏态量化了数据分布不对称的程度。数据的偏态可以是正的也可以是负的，这取决于数据在均值右侧或左侧的尾部更大。偏态可能会影响\
  \ LDA 对每个类别所假设的高斯曲线的形状和位置。\n\n多峰性是指数据的分布呈现多个峰值或模式的特征。它表明数据在每个类别内存在多个子组或簇。多个模式的存在可能会与\
  \ LDA 假设每个类别遵循单峰高斯分布的假设相矛盾。\n\nLDA 假设特征的协方差矩阵在所有类别中相等，这意味着特征在每个类别内的变异性和相关性相同。在某些情况下，该假设可能不现实，不同类别可能具有不同的变异和特征之间依赖性的模式。\n\
  \nLDA 还假设数据是线性可分的，这意味着存在一条线性边界可以将数据分离到不同的类别中。对于某些复杂数据集而言，该假设可能不成立，其中数据可能存在特征之间的非线性关系或交互。\n\
  \nLDA 在高维特征空间中可能表现不佳，其中特征数量远大于数据点数量。在这种情况下，LDA 可能遭受过拟合，即它对训练数据拟合得过于紧密，无法推广到新数据。此外，由于协方差矩阵的庞大尺寸以及算法中涉及的特征值分解，LDA\
  \ 可能面临计算挑战。在这种情况下，其他方法如 `PCA` 可能更合适。\n\n### 8.5.4 Naive Bayes 分类器\n\n`Naive Bayes`\
  \ 分类器是一种简单但强大的 ML 技术，可用于分类任务。它由两部分组成，即 naive 和 Bayes。\n\n**Naive:** 它之所以被称为这样，是因为它做了一个简化假设，即用于预测结果的特征彼此独立，意味着它们以任何方式都不相互影响或依赖。这种假设在现实场景中通常不现实，但它使算法能够快速且易于实现。例如，假设我们想根据颜色、形状和味道将水果分类为苹果或橙子。朴素贝叶斯分类器会假设这三个特征彼此独立，并且每个特征对水果是苹果还是橙子的概率贡献相等。因此，如果我们观察到一个红色、球形且甜味的水果，分类器会将给定类别下每个特征的概率相乘并进行比较，以决定哪个类别更可能。在这种情况下，该水果将被分类为苹果，因为红色、球形和甜味在苹果中出现的可能性比在橙子中更高。然而，这种独立性假设在现实中可能并不总是成立。\n\
  \n**Bayes:** 它基于贝叶斯定理的应用，该定理指出在另一事件 B 发生的条件下事件 A 发生的概率等于在事件 A 发生的条件下事件 B 发生的概率乘以事件\
  \ A 的概率除以事件 B 的概率。换句话说，`P(A|B) = P(B|A) * P(A) / P(B)`。\n\n在分类的上下文中，事件 A 是我们想要分配给实例的类别或类，而事件\
  \ B 是描述该实例的特征或属性集合。例如，如果我们想根据主题和发件人将电子邮件分类为垃圾邮件或非垃圾邮件，则 A 是垃圾邮件或非垃圾邮件标签，B 是主题和发件人信息。朴素贝叶斯分类器试图估计给定特征的每个类别的概率\
  \ `P(A|B)`，然后选择概率最高的类别作为预测。\n\n然而，直接从数据估计 `P(A|B)` 可能很困难，特别是当存在许多特征和类别时。因此，朴素贝叶斯分类器做了一个简化假设，即在给定类别的条件下特征是条件独立的。这意味着在给定类别下观察到某组合特征的概率等于在该类别下每个特征概率的乘积。\n\
  \n例如，如果我们假设在给定垃圾邮件或非垃圾邮件标签的条件下主题和发件人是独立的，则 `P(subject and sender | spam) = P(subject\
  \ | spam) * P(sender | spam)`。\n\n利用此假设，我们可以重写贝叶斯定理如下：\n\n`P(A|B) = P(B|A) * P(A)\
  \ / P(B)`\n`= P(feature1 | A) * P(feature2 | A) *... * P(featuren | A) * P(A) /\
  \ P(B)`\n\n我们可以根据训练数据中每个特征值和类别的频数来估计 `P(feature1 | A)` 和 `P(A)`。例如，如果我们总共有 100 封电子邮件，其中\
  \ 40 封是垃圾邮件，60 封不是垃圾邮件，20 封垃圾邮件的主题中有‘free’一词，而 10 封非垃圾邮件的主题中有它，则 `P(spam) = 40/100\
  \ = 0.4` 且 `P(free | spam) = 20/40 = 0.5`。我们也可以通过对给定 B 的所有可能类别的概率求和来估计 `P(B)`。例如，如果我们想计算\
  \ `P(free)`，我们可以使用以下公式：\n\n`P(free) = P(free | spam) * P(spam) + P(free | not spam)\
  \ * P(not spam)`\n`= 0.5 * 0.4 + 0.1 * 0.6 = 0.26`\n\n一旦我们拥有了所有这些概率，我们就可以将它们代入贝叶斯定理并比较给定实例的不同类别的概率。例如，如果我们想对主题为‘free\
  \ trial offer’且发件人为‘john@example.com’的电子邮件进行分类，我们可以计算以下概率：\n\n`P(spam | free trial\
  \ offer and john@example.com)`\n`= P(free trial offer and john@example.com | spam)\
  \ * P(spam) / P(free trial offer and john@example.com)`\n`= P(free trial offer |\
  \ spam) * P(john@example.com | spam) * P(spam) / (P(free trial offer | spam) * P(john@example.com\
