  \ 文档（面向高级用户）、常见问题解答（常见问题）和关于对话框（用于鸣谢和许可证）的选项。\n\n### 13.4.4 Python 中的基本数据类型\n\n\
  Python 有五种标准数据类型：\n\n- `Number`\n- `String`\n- `List`\n- `Tuple`\n- `Dictionary`\n\
  \nPython 变量无需显式声明即可保留内存空间。声明在您将值赋给变量时自动发生。等号（`=`）用于将值赋给变量。`=` 左侧的操作数是变量的名称，`=` 右侧的操作数是存储在变量中的值。\n\
  \n\n\n\n\n### 例如：\n\n```\n>>> var1 = 24\n>>> var2 = 28.72\n>>> var3 = \"Machine\
  \ Learning\"\n>>> type(var1)\nOut[38]: int\n>>> print(var1)\n24\n>>> type(var2)\n\
  Out[39]: float\n>>> print(var2)\n28.72\n>>> type(var3)\nOut[40]: str\n>>> print(var3)\n\
  Machine Learning\n```\n\nPython 变量可以通过使用数据类型名称作为函数（实际上是一个包装类）并将要转换类型的变量作为参数传递来轻松地从一种数据类型转换为另一种数据类型。然而，并非所有数据类型都可以相互转换；例如，字符串到整数/数字是不可能的。\n\
  \n```\n>>> var2 = int(var2)\n>>> print(var2)\n28\n>>> type(var2)\nOut[42]: int\n\
  ```\n\n## 13.4.5 for 和 while 循环以及 if-else 语句\n\n### for 循环\n\n语法：\n\n```\nfor i\
  \ in range(<lowerbound>,<upperbound>,<interval>):\n    print(i*i)\n```\n\n例如，打印\
  \ 1 到 4 的所有整数的平方。\n\n```\nfor i in range(1,5):\n    print(i*i)\n```\n\n1\n4\n9\n\
  16\n\n```\nfor i in range(1,20,5):\n    print(i)\n```\n\n1\n6\n11\n16\n\n### while\
  \ 循环\n\n语法：\n\n```\nwhile <condition>:\n    <do something>\n```\n\n例如，打印 1 到 3 的所有整数的立方。\n\
  \n```\ni = 1\nwhile i < 4:\n    print(i*i*i)\n    i = i + 1\n```\n\n1\n8\n27\n\n\
  ### if-else 语句\n\n语法：\n\n```\nif <condition>:\n    <do something>\nelse:\n     \
  \ <do something else>\n```\n\n例如，如果一个数字为负数则打印其平方。如果是正数，则打印该数字。\n\n```\ni = -5\n\
  if i < 0:\n    print(i*i)\nelse:\n    print(i)\n```\n\n25\n\n## 13.4.6 编写函数\n\n\
  语法：\n\n```\ndef functionname(parametername,…):\n    (function_body)\n```\n\n例如，计算输入数字\
