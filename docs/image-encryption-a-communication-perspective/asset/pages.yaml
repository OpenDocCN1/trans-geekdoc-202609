- pgno: 146
  md: 'considering the problem of the joint estimation of the clock frequency offset
    and of the channel impulse response, particularly when the observation window
    has to be rather large [166–168].


    # 8.11.1 System Model


    Let us consider the reception of one standard OFDM block that has passed through
    a nonflat fading channel. After removing the guard interval, the observation window
    size is $T_o = NT$ where $N$ is the number of subcarriers, $T$ is the sampling
    period at the transmitter, and $1/T_o$ is the spacing between two adjacent subcarriers.
    Consequently, the continuous-time received signal $y_N^{(a)}(t)$ is written as
    follows:


    $y_N^{(a)}(t) = \sum_{k \in Z} d_{N,k} g^{(a)}(t - kT) + v^{(a)}(t) \quad (8.27)$


    where $(d_{N,k})_{k=0,1,...,N-1}$ represents the output of the $N$-fold IFFT device
    of the transmitter. This OFDM symbol is devoted to training and therefore is assumed
    to be known at the receiver. As usual, $N$ is a power of 2. The unknown impulse
    response $g^{(a)}(t)$ represents the complete channel that includes the transmit
    filter, the propagation channel, and the receiver low-pass filter. Finally, $v^{(a)}(t)$
    is an additive noise independent of the data. Because of the oscillators'' imperfection,
    the transmitter and receiver clocks are not synchronized.


    Therefore, $y_N^{(a)}(t)$ is sampled at $(1 + \delta)T$ instead of $T$, where
    $\delta$ is an unknown offset lying in the known interval $[-\delta_{\max}, \delta_{\max}]$.
    The parameter $\delta_{\max}$ is related to the precision of the oscillators used
    in the transmission chain. The asymmetric digital subscriber line (ADSL)/VDSL
    norms [167], for instance, recommend that $\delta_{\max}$ be equal to $10^{-4}$.
    The discrete time received signal $y_N(n) = y_N^{(a)}(n(1 + \delta)T)$ is then
    written


    $y_N(n) = \sum_{m \in Z} d_{N,n-m} g^{(a)}(mT + n\delta T) + v(n) \quad (8.28)$


    where $v(n) = v^{(a)}(n(1 + \delta)T)$ is assumed white Gaussian circular with
    zero mean and known variance $\sigma^2 = E[|v(n)|^2]$. As usual, $g^{(a)}(lT)$
    is assumed time limited with the time support included in $[0, LT]$ where $L$
    is a known integer. We thus write $g_l = g^{(a)}(lT)$ for $l = 0, ..., L-1$.'
  merge: -1
