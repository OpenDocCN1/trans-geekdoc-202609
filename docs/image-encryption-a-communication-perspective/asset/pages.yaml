    # 8.9.1 The Clipping Method


    Clipping is the simplest method that can limit the amplitude of the signal to
    some desired threshold value. It is a nonlinear process and may cause in-band
    distortion and out-of-band radiation. This leads to degradation in the BER performance
    [162,163]. In the clipping method, when the amplitude exceeds a certain threshold,
    it is hard clipped, while the phase is saved. Namely, when we assume the phase
    of the baseband OFDM signal \bar{x}_m is \phi_m and the threshold is A, the output
    signal after clipping will be given as follows:


    ```

    \bar{x}_m = \begin{cases} A e^{j\phi_m} & |\bar{x}_m| > A \\ \bar{x}_m & |\bar{x}_m|
    \le A \end{cases} \tag{8.25}

    ```'
