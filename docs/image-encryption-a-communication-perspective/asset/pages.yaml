    # 6.3.2 Effect of the Normalized Block Size on Block Dependency


    The block independency problem gives the opportunity for a hacker to exchange
    any cipher block without detection. The preprocessing network solves this problem
    by making this exchange affect other blocks besides the replaced block in the
    decryption process.


    On the other hand, with the SPN, if a block is received in error, this error will
    propagate through other blocks during the decryption process, and these blocks
    will be decrypted incorrectly even if they'
