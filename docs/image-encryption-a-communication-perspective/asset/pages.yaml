  md: 'by 32. The cipher key is similarly a rectangular array with four rows and a
    number of columns equal to the key size divided by 32. The number of rounds performed
    on the intermediate state is related to the key size. For key sizes of 128, 192,
    and 256 bits, the number of rounds is 10, 12, and 14, respectively. Each round
    consists of a fixed sequence of transformations, except the first and the last
    round [16–18].


    The AES consists of rounds. Any round, except the final one, consists of SubBytes,
    ShiftRows, MixColumns, and AddRoundKey operations. In the final round, no MixColumns
    operation is performed. In the SubBytes step, a linear substitution for each byte
    is performed according to Figure 2.9. Each byte in the array is updated using
    an 8-bit S-box, which provides the nonlinearity in the cipher system [16–18].


    The S-box is derived from the multiplicative inverse over the finite Galois field
    GF(2^8), known to have good nonlinearity properties. To avoid attacks based on
    simple algebraic properties, the S-box is chosen to avoid any fixed points and
    any opposite fixed points [16–18].


    The ShiftRows step operates on the rows of the state. It cyclically shifts the
    bytes in each row. For the AES, the first row is left unchanged. Each byte of
    the second row is shifted a single byte to the left. Similarly, the third and
    fourth rows are shifted by offsets of 2 and 3 bytes, respectively. For the block
    of size 128 bits and 192 bits, the shifting pattern is the same [16–18].


    In this way, each column of the output state of the ShiftRows step is composed
    of bytes from each column of the input state. In the case of the 256-bit blocks,
    the first row is unchanged, and the shifting for


