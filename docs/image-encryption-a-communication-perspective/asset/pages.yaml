- pgno: 150
  md: '# SIMULATION EXAMPLES


    # 9.1 Simulation Parameters


    In our simulations, we carried out the encryption of the Cameraman image with
    the previously discussed encryption algorithms. Then, the encrypted images were
    transformed into a binary format and used for orthogonal frequency division multiplexing
    (OFDM) modulation. Both additive white Gaussian noise (AWGN) and Rayleigh fading
    channels were considered in the simulations. A normalized carrier frequency offset
    (CFO) of 0.1 was used in some of the simulation experiments. PAPR reduction techniques
    were used in some other experiments. In all experiments, 128 subcarriers and quaternary
    phase shift keying (QPSK) were used. The simulation parameters are summarized
    in Table 9.1.


    To evaluate the quality of the decrypted images at the receiver, we used the peak
    signal-to-noise ratio (PSNR) between the original image and the decrypted image.
    Figures 9.1 to 9.3 illustrate the variation of the PSNR of the decrypted image
    with the signal-to-noise ratio (SNR) in the channel (E_b/N_0) for the fast Fourier
    transform (FFT)-OFDM system with different encryption algorithms in an AWGN channel
    for different numbers of subcarriers. These figures showed that as the number
    of subcarriers is increased, the quality of the decrypted images is improved.


    In this section, several experiments compare between the encryption algorithms
    and select the most suitable system for the transmission of encrypted images.
    To better illustrate the results, each encryption algorithm was studied for a
    different number of subchannels as shown in Figures 9.4 to 9.6 without equalization
    and Figures 9.7 to 9.9 with zero-forcing (ZF) equalization. From these figures,
    it is clear that equalization enhances the system performance dramatically. The
    best-obtained results from an encryption algorithm were for the chaotic encryption
    algorithm because it is a permutation-based ciphering algorithm.'
  merge: -1
  img_proc: true
