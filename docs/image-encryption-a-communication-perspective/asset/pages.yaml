- pgno: 120
  md: '# OFDM LIMITATIONS


    # 8.1 Introduction


    OFDM has been adopted in the European digital audio and video broadcasting radio
    system and is being investigated for broadband indoor wireless communications.
    Standards such as High-Performance Radio Local-Area Network (HIPERLAN2), Institute
    of Electrical and Electronics Engineers (IEEE) 802.11a, and IEEE 802.11g have
    emerged to support services based on the Internet Protocol (IP). Such systems
    are based on OFDM and are designed to operate in the 5-GHz band [147].


    Unfortunately, OFDM communication systems have two primary problems: the high
    sensitivity to carrier frequency offsets (CFOs) and the high peak-to-average power
    ratio (PAPR). The sensitivity to CFOs breaks the subcarriers’ orthogonality, and
    the high PAPR requires system components with a wide linear range to accommodate
    for the signal variations. Otherwise, nonlinear distortion, which results in a
    loss of subcarrier orthogonality and hence a degradation in the system performance,
    occurs [148–152].


    Researchers have proposed various methods to combat the intercarrier interference
    (ICI in OFDM systems. The existing approaches that have been developed to reduce
    ICI can be categorized into frequency domain equalization, time domain windowing,
    and self-cancellation (SC) schemes. In addition, statistical approaches have been
    explored to estimate and cancel ICI. In this chapter, the effects of CFO and PAPR
    problems are studied with solutions to these problems and to reduce their effects
    on the transmitted encrypted images.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# 8.2 Analysis of Intercarrier Interference


    The main problem of OFDM is its susceptibility to small differences in frequency
    at the transmitter and receiver, normally referred to as frequency offset. This
    frequency offset can be caused by Doppler shift due to relative motion between
    the transmitter and receiver or by differences between the frequencies of the
    local oscillators at the transmitter and receiver. The frequency offset is modeled
    as a multiplicative factor introduced in the channel, as shown in Figure 8.1 [153–155].


    The received signal is given by


    $$y(n)=i(n)\exp\left(\frac{j2\pi n\epsilon}{N}\right)+w(n) \tag{8.1}$$


    where ε is the normalized frequency offset and is given by $\Delta fNT_s$. $\Delta
    f$ is the frequency difference between the transmitted and received carrier frequencies,
    and $T_s$ is the subcarrier symbol period. $w(n)$ is the additive white Gaussian
    noise (AWGN) introduced in the channel.


    The effect of this frequency offset on the received symbol stream can be understood
    by considering the received symbol $Y(k)$ on the kth subcarrier [151–153].


    $$Y(k)=X(k)S(0)+\sum_{\substack{l=0\\l\ne k}}^{N-1}X(l)S(l-k)+W(k) \tag{8.2}$$


    where $k=0,1,\ldots,N-1$; $N$ is the total number of subcarriers; $X(k)$ is the
    transmitted symbol for the kth subcarrier; $W(k)$ is the fast Fourier transform
    (FFT) of $w(n)$; and $S(l-k)$ are the complex coefficients for the ICI components
    in the received signal. The ICI components are


    ![](img/47f81eeb5093bf67426e3b948e0d8952_121_0.png)


    Figure 8.1  Frequency offset model.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'the interfering signals transmitted on subcarriers other than the *k*th subcarrier.
    The complex coefficients are given by [151–153]


    $$S(l-k)=\frac{\sin(\pi(l+\varepsilon-k))}{N\sin(\pi(l+\varepsilon-k)/N)}\exp\left(j\pi\left(1-\frac{1}{N}\right)(l+\varepsilon-k)\right)
    \tag{8.3}$$


    # ### 8.3 CFO in FFT-OFDM System Model


    In FFT-OFDM, the modulated symbols are grouped into blocks, each containing *N*
    symbols, and the inverse FFT (IFFT) is performed. The resulting signal after the
    IFFT can be expressed as follows [138,151–153]:


    $$x(n)=\frac{1}{\sqrt{N}}\sum_{k=0}^{N-1}X(k)e^{j\frac{2\pi nk}{N}},\quad 0\le
    n\le N-1 \tag{8.4}$$


    where *N* is the number of subcarriers. *X(k)* represents the *k*th modulated
    symbol.


    At the end of the transmitter, a guard interval is inserted between symbols with
    hybrid guard interval or zero padding to eliminate the intersymbol interference
    (ISI). The resulting signal is then transmitted through the wireless channel.


