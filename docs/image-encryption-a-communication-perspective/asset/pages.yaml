    The clipping ratio (CR) is a useful means to represent the clipping level. It
    is the ratio between the maximum power of the clipped signal and the average power
    of the unclipped signal. If the IFFT/inverse direct cosine transform (IDCT)/inverse
    direct wavelet transform (IDWT) output signal is normalized, the unclipped signal
    power is 1. If we clip the IFFT/IDCT/IDWT output at level A, then the CR is (A)^2/1
    = (A)^2.


