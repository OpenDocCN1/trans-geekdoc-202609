  md: '![](img/47f81eeb5093bf67426e3b948e0d8952_29_0.png)


    # Figure 2.4 Expansion process.


    algorithm and key of size 56 bits are used for both encryption and decryption
    except for minor differences in the key schedule. The key is usually expressed
    as a 64-bit number, but every eighth bit, one bit is used for parity checking
    and is ignored. These parity bits are the least-significant bits of the key bytes.
    The key can be any 56-bit number and can be changed at any time, although some
    selections can be considered weak keys.


    The DES is based on four basic operations: expansion, permutation, XOR, and substitution.
    The data to be encrypted are first divided into 64-bit blocks and fed into an
    Initial Permutation (IP) stage, in which each block is divided into two subblocks,
    each with a 32-bit length. The right subblock is fed into a Feistel function (f-function),
    which is depicted in Figure 2.4. It operates on half a block (32 bits) at a time
    and consists of four stages as shown in Figure 2.5.


    +   1. Expansion. The 32-bit half block is expanded to 48 bits using the expansion
    permutation, denoted as E in the diagram, by duplicating half of the bits. The
    output consists of eight 6-bit (8 × 6 = 48 bits) pieces, each containing a copy
    of 4 corresponding input bits plus a copy of the immediately adjacent bit from
    each of the input pieces to either side.

    +   2. Key mixing. The result is combined with a subkey using an XOR operation.
    Sixteen 48-bit subkeys, one for each round, are derived from the main key using
    a key-schedule mechanism.

    +   3. Substitution. After mixing with the subkey, the block is divided into eight
    6-bit pieces before processing by the Substitution boxes (S-boxes). Each of the
    eight S-boxes replaces its six input bits with four output bits according to a
    nonlinear transformation, provided in the form of a lookup table. The S-boxes
    provide the core of security of the DES.'
