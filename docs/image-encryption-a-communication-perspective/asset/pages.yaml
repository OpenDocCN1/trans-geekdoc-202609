  md: '$$\int_{0}^{T} s_{i}(t) s_{j}(t) dt = \begin{cases} 1 & i=j \\ 0 & i\neq j
    \end{cases} \tag{7.1}$$


    Equation (7.2) shows a set of orthogonal sinusoids that represent the subcarriers
    for an unmodulated real OFDM signal [115,116].


    $$s_{k}(t)=\begin{cases} \sin(2\pi k f_{0} t) & 0<t<T \\ 0 & \text{otherwise}
    \end{cases} \quad k=1,2,\dots,N \tag{7.2}$$


    where $f_{0}$ is the subcarrier spacing, $N$ is the number of subcarriers, and
    $T$ is the symbol period. Because the highest-frequency component is $N f_{0}$,
    the transmission bandwidth is also $N f_{0}$.


    # 7.2.2 Frequency Domain Orthogonality


    In the frequency domain, each OFDM subcarrier has a sinc sin(x)/x frequency response.
    This is a result of the symbol time corresponding to the inverse of the carrier
    spacing. As far as the receiver is concerned, each OFDM symbol is transmitted
    for a fixed time $T_{FFT}$ with no tapering at the ends of the symbol. This symbol
    time corresponds to the inverse of the subcarrier spacing of $1/T_{FFT}$ Hz. The
    rectangular, boxcar waveform in the time domain results in a sinc frequency response
    in the frequency domain. The sinc shape has a narrow main lobe with many side
    lobes that decay slowly with the magnitude of the frequency difference away from
    the center. Each carrier has a peak at the center frequency and nulls evenly spaced
    with a frequency gap equal to the carrier spacing [113].


    The orthogonal nature of the transmission is a result of the peak of each subcarrier
    corresponding to the nulls of all other subcarriers. When this signal is detected
    using an FFT (fast Fourier transform), the spectrum is not continuous but has
    discrete samples. If the FFT is time synchronized, the frequency samples of the
    FFT correspond to just the peaks of the subcarriers; thus, the overlapping frequency
    region between subcarriers does not affect the receiver. The measured peaks correspond
    to the nulls for all other subcarriers, resulting in orthogonality between the
    subcarriers [113–115].'
  merge: -1
