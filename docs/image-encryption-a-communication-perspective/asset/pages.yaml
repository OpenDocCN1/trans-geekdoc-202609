    $T_s$ is the OFDM symbol duration, and $w(n)$ is AWGN. After that, the received
    signal is transformed into the frequency domain via the FFT as follows:


    $$R(k)=\sum_{n=0}^{N-1}r(n)e^{-j\frac{2\pi nk}{N}} \tag{8.6}$$'
