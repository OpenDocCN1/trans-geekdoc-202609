    # 8.7 Simulation Parameters


    In our simulations, we carried out the encryption of the Cameraman image with
    the previously discussed encryption algorithms. Then, the encrypted images were
    transformed into a binary format and used for OFDM modulation. Both AWGN and Rayleigh
    fading channels were considered in the simulations. A normalized CFO was used
    in some of the simulation experiments. PAPR reduction techniques were used in
    some other experiments. In all experiments, 128 subcarriers and quaternary phase
    shift keying (QPSK) were used. The simulation parameters are summarized in Table
    8.1.


    To evaluate the quality of the decrypted images at the receiver, we used the peak
    signal-to-noise ratio (PSNR) between the original image and the decrypted image,
    which is defined as follows:


    $$PSNR = 10\log_{10}\left(\frac{255^2}{MSE}\right) \tag{8.18}$$


    where the mean square error (MSE) is defined as


    $$MSE = \frac{1}{U^2}\sum_{i=1}^{U}\sum_{j=1}^{U}[f(i,j)-\hat{f}(i,j)]^2 \tag{8.19}$$


