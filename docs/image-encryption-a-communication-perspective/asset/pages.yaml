  md: 'Common analog modulation schemes include frequency modulation (FM), amplitude
    modulation (AM), and phase modulation (PM). Common single-carrier modulation schemes
    for digital communications include amplitude shift keying (ASK), frequency shift
    keying (FSK), phase shift keying (PSK), and quadrature amplitude modulation (QAM)
    [115].


    OFDM is different from frequency division multiplexing (FDM) in several ways.
    In conventional broadcasting, each radio station transmits on a different frequency,
    effectively using FDM to maintain a separation between the stations. There is,
    however, no coordination or synchronization between each of these stations. With
    an OFDM transmission system such as DAB or digital video broadcasting (DVB), the
    information signals from multiple stations are combined into a single multiplexed
    stream of data. These data are then transmitted using an OFDM ensemble that is
    made from dense packing of several subcarriers. All the subcarriers within the
    OFDM signal are time and frequency synchronized to each other, allowing the interference
    between subcarriers to be carefully controlled. These multiple subcarriers overlap
    in the frequency domain but cause small effects of intercarrier interference (ICI)
    due to the orthogonal nature of the modulation. Typically, with FDM the transmission
    signals need to have a large frequency guard band between channels to prevent
    interference. This lowers the overall spectral efficiency. However, with OFDM,
    the orthogonal packing of the subcarriers greatly reduces this guard band, improving
    the spectral efficiency [116–122].


    Each of the carriers in an FDM transmission system can use an analog or digital
    modulation scheme. There is no synchronization between the transmissions, so one
    station could transmit using FM and another in a digital form using FSK. In a
    single OFDM transmission system, all the subcarriers are synchronized to each
    other, restricting the transmission to digital modulation schemes. OFDM is symbol
    based and can be thought of as a large number of low-bit-rate carriers transmitted
    in parallel. All these carriers transmit using synchronized time and frequency,
    forming a single block of spectrum to ensure that the orthogonal nature of the
    structure is maintained. Because these multiple carriers form a single OFDM transmission,
    they are commonly referred to as subcarriers, with the term carrier reserved for
    describing the radio-frequency (RF) carrier mixing the'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'signal from baseband. There are several ways of looking at what makes the subcarriers
    in an OFDM signal orthogonal and why this prevents interference between them [116–119].


    # 7.2.1 Orthogonality


    Signals are orthogonal if they are mutually independent of each other. Orthogonality
    is a property that allows multiple information signals to be transmitted perfectly
    over a common channel and detected without interference. Loss of orthogonality
    results in blurring between these information signals and degradation in communications.


    Many common multiplexing schemes are inherently orthogonal. Time division multiplexing
    (TDM) allows transmission of multiple information signals over a single channel
    by assigning unique time slots to each separate information signal. During each
    time slot, only the signal from a single source is transmitted, preventing any
    interference between the multiple information sources. Because of this, TDM is
    orthogonal in nature [116–119]. In the frequency domain, most FDM systems are
    orthogonal as each of the separate transmission signals is well spaced out in
    frequency, preventing interference. The term OFDM has been reserved for a special
    form of FDM. The subcarriers in an OFDM signal are spaced as close as is theoretically
    possible while maintaining orthogonality between them.


    OFDM achieves orthogonality in the frequency domain by allocating each of the
    separate information signals onto different subcarriers. OFDM signals are made
    up from a sum of sinusoids, with each one corresponding to a subcarrier. The baseband
    frequency of each subcarrier is chosen to be an integer multiple of the inverse
    of the symbol time, resulting in all subcarriers having an integer number of cycles
    per symbol. As a consequence, the subcarriers are orthogonal to each other [123–130].


    Sets of functions are orthogonal to each other if they match the conditions in
    Equation (7.1). If any two different functions within the set are multiplied and
    integrated over a symbol period, the result is zero for orthogonal functions.
    If we look at a matched receiver for one of the orthogonal functions, then the
    receiver will only see the result for that function. The results from all other
    functions in the set integrate to zero and thus have no effect [115].'
  merge: -1
  img_proc: true
