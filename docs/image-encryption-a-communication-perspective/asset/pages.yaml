    [142]


    H1(z)=z^{-a}G0(-z) and G1(z)=z^{a}H0(-z) (7.10)

    where a must be odd (usually a = ±1).


    The second PR condition is that the transfer function from X(z) to Y(z) should
    be unity [142]:


    {H0(z)G0(z)+H1(z)G1(z)}=2 (7.11)'
