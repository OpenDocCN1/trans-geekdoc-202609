  md: '# 8.4 CFO in DCT-OFDM System Model


    The main advantage of the discrete cosine transform (DCT) lies in its excellent
    spectral energy compaction property, which makes most of the samples transmitted
    close to zero, leading to a reduction in the ISI. In addition, it uses only real
    arithmetic rather than the complex arithmetic used in the FFT. This reduces the
    signal-processing complexity, and the in-phase/quadrature imbalance [150,151].
    In the DCT-OFDM system, the transmitted signal is given by [136,137,139–143]


    $x(n)=\sqrt{\frac{2}{N}}\sum_{k=0}^{N-1}X(k)\beta(k)\cos\left(\frac{\pi k(2n+1)}{2N}\right),\quad
    p=0,...,N-1\;(8.11)$


    where $X(k)$ is the $k$th symbol of the input signal. $\beta(k)$ can be written
    as follows:


    $\beta(k)=\begin{cases}\frac{1}{\sqrt{2}} & k=0\\ 1 & k=1,2,...,N-1\end{cases}\;(8.12)$


    In the DCT-OFDM system, the complex coefficients for the interference components
    in the received signal can be expressed as follows [151–153]:


    $S(l,k,\zeta)=\frac{1}{2N}\beta_k\beta_l\big[\phi(l+k-\zeta)+\phi(l-k-\zeta)+\phi(l+k+\zeta)+\phi(l-k+\zeta)\big]$
    $+j\big[\Gamma(l+k-\zeta)+\Gamma(l-k-\zeta)-\Gamma(l+k+\zeta)-\Gamma(l-k+\zeta)\big]\;(8.13)$


    where $\zeta=2T\Delta f$ is the normalized CFO for the DCT-OFDM system [151–153].'
