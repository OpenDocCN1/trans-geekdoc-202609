    # 8.11 Sampling Clock Offset


    The detection of OFDM symbols cannot be done properly without reliable clock synchronization.
    One synchronization step consists of estimating the OFDM symbol timing, which
    is the delay between the transmitted and the received OFDM symbols. In a certain
    number of applications where these symbols are short, estimating this delay is
    enough. However, as soon as the number of samples per OFDM symbol (or, equivalently,
    the number of subcarriers) becomes large, the frequency offset between the transmitter
    sampling clock and the receiver sampling clock in its free oscillation mode also
    has to be considered. Indeed, this offset leads to a sampling delay that drifts
    linearly in time over the OFDM symbol. Without any compensation, this drift hampers
    the receiver performance as soon as the product of the relative clock frequency
    offset with the number of subcarriers becomes nonnegligible in comparison with
    one [180]. For instance, in very-high-speed digital subscriber line (VDSL) transmissions,
    these two quantities can respectively reach 10⁻⁴ and 4096 [167], making the clock
    frequency offset compensation mandatory. As another example, power line transmissions
    (PLTs) in the band (1 MHz, 20 MHz) [168] show similar behavior with respect to
    this phenomenon.


    As it is well known, the part of the OFDM symbol that enters the FFT device at
    the receiver comes after a cyclic prefix. As the prefix has a length comparable
    to the channel impulse response length, it is precisely when the channel is long
    that a long duration has to be chosen for the useful part of the OFDM symbol to
    reduce the impact of the cyclic prefix on the spectral efficiency. It is therefore
    worth'
