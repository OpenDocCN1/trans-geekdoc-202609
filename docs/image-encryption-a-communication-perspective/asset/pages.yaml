- pgno: 24
  md: '+   3. Number of rounds: Multiple rounds increase security.

    +   4. Encryption modes: They define how messages larger than the block size are
    encrypted.


    Unlike block ciphers that operate on large blocks of data, *stream ciphers* typically
    operate on smaller units of plaintext, usually bits. So, stream ciphers can be
    designed to be exceptionally fast, much faster than a typical block cipher. Generally,
    a stream cipher generates a sequence of bits as a key (called key stream) using
    a pseudorandom number generator (PRNG) that expands a short secret key (e.g.,
    128 bits) into a long string (key stream) (e.g., 10^6 bits), and the encryption
    is accomplished by combining the key stream with the plaintext. Usually, the bitwise
    XOR operation is chosen to perform ciphering, basically for its simplicity [6–9].
    Stream ciphers have the following properties [22, 23]:


    +   1. They do not have perfect security.

    +   2. Security depends on the properties of the PRNG.

    +   3. The PRNG must be unpredictable; given a consecutive sequence of output
    bits, the next bit must be hard to predict.

    +   4. Typical stream ciphers are very fast.


    # 2.3.2 Classification According to Keys


    According to keys, there are two kinds of ciphers following the relationship of
    K_e and K_d. When K_e = K_d, the cipher is called a private-key cipher or a symmetric
    cipher. For private-key ciphers, the encryption/decryption key must be transmitted
    from the sender to the receiver via a separate secret channel. When K_e ≠ K_d,
    the cipher is called a public-key cipher or an asymmetric cipher. For public-key
    ciphers, the encryption key K_e is published, and the decryption key K_d is kept
    private, for which no additional secret channel is needed for key transfer. In
    conventional encryption as shown in Figure 2.2, the sender encrypts the data (plaintext)
    using the encryption key, and the receiver decrypts the encrypted data (ciphertext)
    into the original data (plaintext) using the decryption key. In symmetric encryption,
    both encryption and decryption keys are identical. Figure 2.3 shows the public-key
    encryption (asymmetric encryption), in which the encryption and decryption keys
    are different. Public-key cryptography solves the problem of conventional cryptosystems
    by distributing the key'
