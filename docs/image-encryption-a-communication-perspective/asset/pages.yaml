  md: '# ORTHOGONAL FREQUENCY

    DIVISION MULTIPLEXING


    # 7.1 Introduction


    The main objective of this book is to study image encryption from a communication
    perspective. So, we need to determine if an encryption algorithm fits the communication
    requirements. It is time now to switch to wireless communication to understand
    the communication process and its limitations and hence to study the performance
    of the decryption algorithms after the communication process. We consider multicarrier
    modulation (MCM), especially orthogonal frequency division multiplexing (OFDM),
    in our study because it is the new trend in wireless communication systems. MCM
    is used not only in the physical layer of several wireless network standards such
    as Institute of Electrical and Electronics Engineers (IEEE) 802.11a, IEEE 802.16a,
    and HIPERLAN2 (High-Performance Radio Local Area Network Type 2), but also in
    HDTV (high-definition television) applications that include image communication
    [111,112]. OFDM overcomes the effects of multipath fading by breaking the signal
    into several narrow-bandwidth carriers. This results in a low symbol rate reducing
    the amount of ISI (intersymbol interference). The high tolerance to multipath
    fading makes OFDM more suited to transmissions with a high data rate in terrestrial
    environments compared to single-carrier transmissions.


    The transmission frequency, receiver velocity, and required multipath tolerance
    all determine the most suitable transmission mode to use. Doppler spread is caused
    by rapid changes in the channel response due to movement of the receiver through
    a multipath environment. It results in random frequency modulation of the OFDM
    subcarriers, leading to signal degradation. The amount of Doppler spread is proportional
    to the transmission frequency and the velocity of movement.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '![](img/47f81eeb5093bf67426e3b948e0d8952_107_0.png)


    Figure 7.1 Frequency response of the subcarriers in a seven-tone OFDM signal.


    The closer the subcarriers are spaced, the more susceptible the OFDM signal is
    to Doppler spread, so the different transmission modes in digital audio broadcasting
    (DAB) and HDTV allow a trade-off between the amount of multipath protection (length
    of the guard period) and the Doppler spread tolerance [113].


    The OFDM signal has the spectrum shown in Figure 7.1. In the frequency domain,
    each OFDM subcarrier has several sinc-shaped frequency responses. The sinc shape
    has a narrow main lobe with many side lobes that decay slowly with the magnitude
    of the frequency shift away from the center. Each carrier has a peak at the center
    frequency and nulls evenly spaced with a frequency gap equal to the carrier spacing
    [114,115].


    # 7.2 Basic Principles of OFDM


    All wireless communication systems use a modulation scheme to map the information
    signal to a form that can be effectively transmitted over the communication channel.
    A wide range of modulation schemes has been developed, with the most suitable
    one depending on whether the information signal is an analog waveform or a digital
    signal.'
