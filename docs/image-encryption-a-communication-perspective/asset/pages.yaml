- pgno: 18
  md: '# ## I\n

    INTRODUCTION


    The presence of communication networks has prompted new problems with security
    and privacy. Having a secure and reliable means for communicating with images
    and video is becoming a necessity, and its related issues must be carefully considered.
    Hence, network security and data encryption have become important. Images can
    now be considered one of the most usable forms of information. Image and video
    encryption have applications in various fields, including wireless communications,
    multimedia systems, medical imaging, telemedicine, and military communications
    \[1--5].


    In this book, image encryption algorithms are studied for the purpose of wireless
    communication of images in a secure form. The main objective is to come to a conclusion
    whether a certain image encryption algorithm is suitable for wireless communication
    applications. In this regard, we explore in this book some of the number-theory-based
    encryption algorithms such as the Data Encryption Standard (DES), the Advanced
    Encryption Standard (AES), and the RC6 algorithms \[6--12]. These algorithms are
    known in the literature as strong encryption algorithms. Our main concern is not
    only the strength of the encryption algorithm, but also its ability to work with
    the limitations of wireless communication systems. Unfortunately, some of the
    ciphers used currently were not designed for image encryption. For example, the
    AES implemented in the Electronic Code-Book (ECB) mode is not recommended for
    encrypting images because of the repetitive data patterns existing in images.
    So, we either modify these ciphers to work for image encryption or search for
    other approaches suitable for this task. This book tries to investigate both directions.


    For this purpose, we have also explored another branch of cryptography that depends
    on chaos theory. The usage of chaotic cryptography for image encryption is promising.
    The idea of using chaos for'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'encryption can be traced to Shannon’s classical article [13]. Chaotic maps
    have been applied to cryptography in several different ways. Chaotic sequences
    have several good properties, including ease of generation, sensitive dependence
    on the initial conditions, and noise-like behavior. Applying the chaos to cryptography
    was a great contribution to improve the security of data due to the adequate properties
    of chaotic sequences [14,15].


    To make the study in this book comprehensive, we switch in Chapters 7 and 8 to
    communication concepts concentrating on the orthogonal frequency division multiplexing
    (OFDM) system. In these chapters, we present a simplified model for the OFDM communication
    system with its different implementations, with concentration on the limitations
    of this system, and how these limitations affect the quality of received images
    after decryption. An extensive comparison study is presented in Chapter 9, considering
    different possible scenarios and different encryption algorithms to determine
    which encryption algorithm is suitable for which scenario. Finally, we include
    all MATLAB® codes utilized in the experiments in this book to open the door for
    researchers who wish to complete this study using different ideas.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# FUNDAMENTALS OF IMAGE ENCRYPTION


    # 2.1 Introduction


    We are living in the information age; we need to keep information about every
    aspect of our lives. In other words, information is an asset that has a value
    like any other asset. As an asset, information needs to be secured from attacks.
    Since 1990, communication networks created a revolution in the use of information.
    Authorized people can send and receive information from a distance using communication
    networks. To be secure, information needs to be hidden from unauthorized access
    (confidentiality), protected from unauthorized change (integrity), and available
    to an authorized entity when it is needed (availability). Although these three
    requirements have not changed, they now have some new dimensions. Not only should
    information be confidential when it is stored in a computer, but also there should
    be a way to maintain its confidentiality when it is transmitted over a communication
    network [16].


    Information transmitted over computer networks currently is not only text but
    also audio, images, and other multimedia types. The field of multimedia security
    has matured in the past decade to provide a class of tool sets and design insights
    for the protection and enhancement of digital media under a number of diverse
    attack scenarios. Research in multimedia security was first motivated partly by
    the increasing use of digital means to communicate, store, and represent entertainment
    information such as music and video. The digital form allowed the perfect duplication
    of information and almost seamless manipulation and tampering of the data. This
    created new types of security attacks not addressed in the past by the entertainment
    industry. The paradigm shift from analog to digital multimedia for'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'entertainment has bad an enormous impact on artists, publishers, copyright
    holders, and consumers [17,18].


    This chapter gives the principles underlying the design of cryptographic algorithms.
    A review of the different issues that arise when selecting, designing, and evaluating
    a cryptographic algorithm is presented. Diffusion-based cipher algorithms along
    with their modes of operation are covered. Chaotic encryption with a Baker map
    is also discussed.


    # 2.2 Basic Concepts of Cryptography


    *Image security* is based on cryptography. In fact, some basic concepts from cryptography
    are used as building blocks (primitives) for applications in image security. For
    a better understanding of issues concerning image security, an overview of cryptography
    is presented first.


    # 2.2.1 *Goals of Cryptography*


    *Cryptography* is a study of techniques (called *cryptosystems*) that are used
    to accomplish the following four goals [1,16–18]:


    +   - Confidentiality

    +   - Data integrity

    +   - Authentication

    +   - Nonrepudiation


    The study of the techniques used to break existing cryptosystems is called *cryptanalysis*.
    Since cryptography and cryptanalysis are greatly dependent on each other, people
    refer to *cryptology* as a joint study of cryptography and cryptanalysis. Let
    us try to understand all four goals of cryptography.


    *Confidentiality* refers to the protection of information from unauthorized access.
    An undesired communicating party, called an adversary, must not be able to access
    the communication material. This goal of cryptography is a basic one that has
    always been addressed and enforced throughout the history of cryptographic practice.


    *Data integrity* ensures that information has not been manipulated in an unauthorized
    way. If the information is altered, all communicating parties can detect this
    alteration.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '_Authentication methods_ are classified into two categories: entity authentication
    and message authentication. _Entity authentication_ is the process by which one
    party is assured of the identity of a second party involved in a protocol, and
    that the second has actually participated immediately prior to the time the evidence
    is acquired. _Message authentication_ is a term used analogously with data origin
    authentication. It provides data origin authentication with respect to the original
    message source and data integrity but with no uniqueness and timeliness guarantees.


    _Nonrepudiation_ means that the receiver can prove to everyone that the sender
    did indeed send the message. That is, the sender cannot claim that he or she did
    not encrypt or sign certain digital information.


    Fortunately, modern cryptography has developed techniques to handle all four goals
    of cryptography.


    # 2.2.2 Principles of Encryption


    The basic idea of _encryption_ is to modify the message in such a way that only
    a legal recipient can reconstruct its content [16–18]. A discrete-value cryptosystem
    can be characterized by


    +   - a set of possible plaintexts _P_

    +   - a set of possible ciphertexts _C_

    +   - a set of possible cipher keys _K_

    +   - a set of possible encryption and decryption transformations _E_ and _D_


    An _encryption system_ is also called a cipher, or a cryptosystem. The message
    for encryption is called _plaintext_, and the encrypted message is called _ciphertext_.
    Denote the plaintext and the ciphertext by _P_ and _C_, respectively [16–19].
    The encryption procedure of a cipher can be described as


    $$C = E_{K_e}(P) \tag{2.1}$$


    where _K_ is the encryption key, and _E_ is the encryption function. Similarly,
    the decryption procedure is defined as


    $$P = D_{K_d}(C) \tag{2.2}$$'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/47f81eeb5093bf67426e3b948e0d8952_23_0.png)


    Figure 2.1  Encryption/decryption of a cipher.


    where K_d is the decryption key, and D is the decryption function. The security
    of a cipher should only rely on the decryption key K_d as an adversary can recover
    the plaintext from the observed ciphertext once the adversary gets K_d. Figure
    2.1 shows a block diagram for encryption/decryption of a cipher.


    # 2.3 Classification of Encryption Algorithms


    Encryption algorithms can be classified in different ways: according to structures
    of the algorithms, according to keys, or according to the percentage of the data
    encrypted [19,20].


    # 2.3.1 Classification According to Encryption Structure


    Encryption algorithms can be classified according to encryption structure into
    block ciphers and stream ciphers.


    A *block cipher* is a type of symmetric-key encryption algorithm that transforms
    a fixed-length block of plaintext data into a block of ciphertext data of the
    same length. The fixed length is called the *block size*. For several block ciphers,
    the block size is 64 or 128 bits. The larger the block size, the more secure is
    the cipher, but the more complex are the encryption and decryption algorithms
    and devices. Modern block ciphers have the following features [21]:


    +   1. Variable key size

    +   2. Mixed arithmetic operations, which can provide nonlinearity

    +   3. Data-dependent rotations and key-dependent rotations

    +   4. Lengthy key schedule algorithms

    +   5. Variable plaintext/ciphertext block sizes and variable number of rounds


    Block ciphers can be characterized by


    +   1. Block size: Larger block sizes mean greater security.

    +   2. Key size: Larger key sizes mean greater security.'
