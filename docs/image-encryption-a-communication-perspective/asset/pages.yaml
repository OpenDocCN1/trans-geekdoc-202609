  md: '# 7.5 Communication Channels


    # 7.5.1 Additive White Gaussian Noise Channel


    For an additive white Gaussian noise (AWGN) channel, the received signal $r(t)$
    is expressed as [141]


    $r(t) = s(t) + n(t)$


    (7.22)


    where $s(t)$ is the transmitted signal, $r(t)$ is the received signal, and $n(t)$
    is the AWGN with power spectral density given by [141]


    $\Phi(f) = N_0/2$ [W/Hz]


    (7.23)


    where $N_0$ is a constant that is often called the noise power density.


    # 7.5.2 Fading Channel


    The path between the transmitter and receiver is characterized by various obstacles
    and reflections, which lead to a fading effect at the receiver as shown in Figure
    7.4. We can take the following expression to simulate the incoming signal at the
    receiver in the Raleigh fading scenario [141]:


    $f(t) = x(t) + j \cdot y(t)$


    (7.24)


    = $\left[ \sqrt{\frac{2}{N_1+1}} \sum_{n=1}^{N_1} \sin\left(\frac{\pi n}{N_1}\right)
    \cos\left\{2\pi f_d \cos\left(\frac{2\pi n}{N_1}\right) t\right\} + \frac{1}{\sqrt{N_1+1}}
    \cos(2\pi f_d t) \right]$


    ![](img/47f81eeb5093bf67426e3b948e0d8952_117_0.png)


    Figure 7.4 A wireless channel with multipath propagation.'
