    # 4.3.2 Key Space Analysis


    A good image cryptosystem algorithm should be sensitive to the cipher keys. For
    the homomorphic image cryptosystem, the key space analysis and test are summarized
    in the following sections.


    # 4.3.2.1 Exhaustive Key Search


    For a secure image cryptosystem, the key space should be large enough to make
    the brute-force attack infeasible [88]. The RC6 algorithm is a 128-bit encryption
    scheme. An exhaustive key search will take 2^k operations to succeed, where k
    is the key size in bits. An attacker simply tries all keys, one by one, and checks
    whether the given plainimage encrypts to the given cipherimage.


    For a practical use of the homomorphic cryptosystem, assume that the secret key
    length is 128 bits. Therefore, an opponent may try to bypass guessing the key
    and directly guess all the possible combinations. The opponent will need about
    2^128 operations to successfully determine the key. If an opponent employs a 1000-MIPS
    (million instructions per second) computer to guess the key by the brute-force
    attack, the computational load is then


    $$\frac{2^{128}}{1000\times10^6 \times 60 \times 60 \times 24 \times 365} > 10.7902831\times10^{21}\
    \text{years}\quad(4.3)$$


    This is practically infeasible.


    For chaotic Baker map encryption, the key is dependent on the width (or height)
    of an image. This is due to the scrambling phenomena of the chaotic Baker map.
    For the 512 × 512 Lena image,'
