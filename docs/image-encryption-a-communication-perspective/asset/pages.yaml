    were received correctly. So, there is a need for a trade-off between the block
    dependency and the error propagation.


    If an encrypted block was received in error, the application of the decryption
    algorithm on this block will propagate the error in two neighboring network blocks
    in different manners. This is attributed to the randomization of the diffusion
    mechanism in the decryption algorithm. If an error occurs in an intermediate encrypted
    block, the error spreads over three decrypted blocks. If this error occurs in
    the first or the last encrypted block, the error spreads over two decrypted blocks
    only. This is shown in Figure 6.7, where the shaded blocks refer to network blocks
    with different errors, and white blocks refer to the absence of errors. Every
    decrypted block of size w is represented by two network blocks. From this figure,
    we can see that the block dependency is ensured, but the error propagation slightly
    increases compared to the CBC mode.


    # 6.4 Simulation Examples


    Several experiments have been performed to test the effect of the suggested mechanism
    on image encryption in the ECB mode. Both the AES and RC6 algorithms have been
    used as the encryption algorithms. The Cameraman image shown in Figure 6.8 has
    been used in these experiments.'
