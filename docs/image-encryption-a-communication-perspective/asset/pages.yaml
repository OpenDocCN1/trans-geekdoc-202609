- pgno: 119
  md: 'where $i_1$ is the received in-phase symbol, $q_1$ is the quadrature received
    symbol, $i_0$ is the transmitted in-phase symbol, $q_0$ is the quadrature transmitted
    symbol, and $\mathbf{A}$ is the transition matrix of the fading environment that
    is given by [130]


    $$\mathbf{A} = \begin{pmatrix} a_{11} & a_{12} \\ a_{21} & a_{22} \end{pmatrix}
    \tag{7.29}$$


    The channel matrix is Toeplitz with $a_{11}=a_{22}$ and $a_{12}=-a_{21}$. To perform
    channel equalization, we need to estimate the matrix $\mathbf{A}^{-1}$ as follows
    [130]:


    $$\mathbf{A}^{-1}= \frac{1}{\sqrt{a_{11}^2 + a_{12}^2}} \begin{pmatrix} a_{11}
    & a_{12} \\ -a_{12} & a_{11} \end{pmatrix} \tag{7.30}$$


    Because the transmitted and received symbols are known, we can estimate the channel
    coefficients using Equations (7.28) and (7.30) as follows [130]:


    $$a_{11}=a_{22}=\frac{1}{\sqrt{i_1+q_1}}\left(i_0 i_1 + q_0 q_1\right) \tag{7.31}$$


    $$a_{21}=-a_{12}=\frac{1}{\sqrt{i_1+q_1}}\left(q_0 i_1 + i_0 q_1\right) \tag{7.32}$$


    Once the channel is estimated, it can be used for equalization with unknown transmitted
    symbols [113]. Equalization is not the only problem encountered in wireless communication
    of images with OFDM. There are some other limitations that may affect the quality
    of transmitted images, especially if they are encrypted. Some of these problems
    are addressed in the next chapter.'
