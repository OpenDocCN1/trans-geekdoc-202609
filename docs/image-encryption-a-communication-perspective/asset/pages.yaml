- pgno: 111
  md: '# ### 7.3 OFDM System Model


    This section briefly reviews the key steps in an OFDM communication system that
    can be used for the transmission of encrypted images. The first step is the image
    encryption; the general model of a typical encryption system could be described
    with the following equation [131]:


    $E(P, K) = C$ (7.3)


    where $P$ is the plainimage, $E$ is the encryption algorithm, $K$ is the encryption
    key, and $C$ is the cipherimage. The cipherimage is transmitted through the communication
    channel. At the receiver side, the decryption procedure could be represented by
    [131]


    $D(C, K'') = P''$ (7.4)


    where $D$ is the decryption algorithm, $K''$ is the decryption key (it may or
    may not be the same as the encryption key $K$), and $P''$ is the recovered plainimage.


    At the transmitter side, the encrypted data are converted into parallel data of
    $N$ subchannels. Then, the data of each parallel subchannel are modulated using
    a modulation scheme like PSK or QPSK (quaternary PSK). For QPSK of $N$ subchannels
    $(d_0, d_1, d_2, \dots, d_{N-1})$, each $d_n$ is a complex number $d_n = d_{I_n}
    + j d_{Q_n}$, where $d_{I_n}$ and $d_{Q_n}$ are $\{1, -1\}$ [131–135].


    # #### 7.3.1 FFT-OFDM


    In FFT-OFDM, the modulated data are fed into an inverse FFT (IFFT) circuit, and
    the OFDM signal is generated. The OFDM splits a high-data-rate sequence into a
    number of low-rate sequences that are transmitted over a number of subcarriers
    equal to $N$. The $N$ subcarriers are chosen to be orthogonal; that is, $f_n =
    n \Delta f$, where $\Delta f = 1/T_s$ and $T_s$ is the OFDM symbol duration. The
    resulting signal can be expressed as follows [136]:


    $x(n) = \frac{1}{\sqrt{N}} \sum_{k=0}^{N-1} X(k) e^{j \frac{2 \pi k n}{N}}, \
    0 \leq t \leq T_s$ (7.5)


    where $X(k)$ represents the discrete-time samples.'
