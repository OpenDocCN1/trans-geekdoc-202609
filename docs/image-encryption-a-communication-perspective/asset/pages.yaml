  md: '# Diffusion Mechanism

    for Data Encryption

    in the ECB Mode


    # 6.1 Introduction


    The implementation of any block cipher algorithm depends on the mode of operation,
    which governs the relation between blocks during the encryption process. The ECB
    mode is one of the possible modes of operation. In this mode, each block is encrypted
    independently. Unlike different modes of operation, this mode allows parallel
    processing, which is a great advantage. Unfortunately, because the encryption
    of each block does not depend on other blocks, an adversary can replace any block
    with a previously intercepted block without detection; hence, the message is hacked
    without the need to know the key. This major security problem is called the block
    independency problem. In addition, identical plaintext blocks are encrypted to
    identical ciphertext blocks, so symmetrical large data patterns, like those in
    images, cannot be hidden using any encryption algorithm implemented in the ECB
    mode [98–102].


    Two actions are discussed in this chapter to solve the block independency problem
    in the ECB mode [103]. The first action is to make the values of the data bytes
    functions of their positions in the data stream. The second action is to perform
    a diffusion process between these bytes. These two actions are preprocessing actions
    that are performed prior to the application of any block cipher algorithm implemented
    in the ECB mode. First, an addition step, which is used to remove any identical
    plaintext blocks, is performed. Then, an substitution permutation network (SPN)
    is used to make the diffusion between the bytes. A schematic diagram of this mechanism
    is shown in Figure 6.1.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '![](img/47f81eeb5093bf67426e3b948e0d8952_89_0.png)


    Figure 6.1 The suggested mechanism for encryption and decryption in the ECB mode:
    (a) encryption; (b) decryption.


    # 6.2 The Preprocessing Network


    The disadvantages of the ECB mode limit its applicability in modern cryptography
    despite its advantage of parallel processing [104]. If we can preprocess the data
    to diffuse bytes together before encryption, these disadvantages will be avoided.
    The preprocessing network consists of two parts: an addition part and an SPN.


    # 6.2.1 The Addition Part


    The objective of the addition process is to make the byte values functions of
    their positions in the data stream. This process helps in eliminating identical
    plaintext blocks. A function of the byte position is added to the byte value as
    follows:


    B(i) = (B(i) + f(i)) mod 256 (6.1)


    where i is the position of the byte in the data stream, and B is the byte value.


    The function f(i) is used because it satisfies the following conditions:


    +   - **Randomness.** The resulting values from this function for every i are
    random with equal probability.

    +   - **Irregularity.** The differences between each byte and its neighbors in
    the data stream after the addition of this function to the byte values are unpredictable
    and unrepeatable.

    +   - **Nonperiodicity.** This function is nonperiodic because it satisfies the
    following condition:


    f(i) ≠ f(i + n) ≠ f(i + 2n) ≠ f(i + 3n) ≠ ... (6.2)'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'Here, we test three functions to find the one that satisfies the given conditions:


    $f_1\left( i \right) = 7\times\left( i + 13 \right) \mathrm{mod}\ 256 \qquad (6.3)$


    $f_2\left( i \right) = \left( 7\times\left( i + 3 \right) \right)^5 \mathrm{mod}\
    256 \qquad (6.4)$


    $f_3\left( i \right) = \mathrm{fix}\left( \sqrt{7\times\left( i + 13 \right)^5}
    \right) \mathrm{mod}\ 256 \qquad (6.5)$


    where the fix function is used to round the value of its argument toward the lower
    nearest integer.


    The functions have been tested for values from 1 to 1024, and the results are
    given in Figure 6.2. The probability density functions (PDFs) of the outputs of
    these functions are shown in Figure 6.3.


    From these figures, we can see that $f_3(i)$ gives a random, irregular, and nonperiodic
    output with a uniform PDF.


    # 6.2.2 The SPN


    The SPN is used to diffuse the bytes of the data together after the addition step.
    First, the data are divided into blocks of $n$ bits. This network block size $n$
    is different from the encryption algorithm block size $w$. After that, a chain
    of XOR operations is performed as shown in Figure 6.4. The subkey $K_1$ works
    as an initial key for the first XOR, and then the result is XORed with the next
    block up to the end of the plaintext. Each block resulting from this chain of
    XORs is permuted bit-by-bit as shown in Figure 6.5. A block-based permutation
    is performed after that. Finally, another chain of XORs is implemented beginning
    with a subkey $K_2$.


    # 6.3 Implementation Issues


    The preprocessing network performance depends mainly on the correct determination
    of the SPN block size $n$ and its relation to the encryption algorithm block size
    $w$. The effect of the normalized block size $(n/w)$ on the diffusion and block
    dependency is studied.'
  merge: -1
  img_proc: true
