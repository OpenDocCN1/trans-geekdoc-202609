- pgno: 12
  md: '# Preface


    We try in this book to look at image encryption with the eyes of communication
    researchers. Traditional studies of encryption concentrate on the strength of
    the encryption algorithm without taking into consideration what is after encryption.
    What is after encryption is the question we must answer to select the appropriate
    encryption algorithm. For real-life applications, what is after encryption is
    communication of encrypted images. With the advances in mobile and TV applications,
    we have to transmit encrypted images wirelessly. So, “Do our encryption algorithms
    tolerate the wireless communication impairments?” is the question we are trying
    to answer in this book.


    We can summarize the main contributions in this book as follows:


    +   - This book is devoted to the issue of image encryption for the purpose of
    wireless communications.

    +   - Diffusion as well as permutation ciphers are considered in this book, with
    a comparison between them using different evaluation metrics.

    +   - Modifications are presented to existing block ciphers either to speed up
    or to enhance their performance.

    +   - The wireless communication environment in which the encrypted images needs
    to be communicated is studied.'
  merge: -1
  img_proc: true
