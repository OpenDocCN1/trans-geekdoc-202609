  md: '# # CHAOTIC IMAGE ENCRYPTION WITH DIFFERENT MODES OF OPERATION


    # ## 5.1 Overview


    Chaos theory consistently plays an active role in modern cryptography. The attractiveness
    of using chaos as the basis for developing a cryptosystem is mainly its random
    behavior and sensitivity to initial conditions and parameter settings that fulfill
    the classic Shannon requirements of confusion and diffusion [89]. Chaos-based
    algorithms have shown some exceptionally good properties in many concerned aspects
    regarding security, complexity, speed, computational overhead, and so on. Some
    chaotic cryptosystems based on ergodicity have been proposed [90,91]. A number
    of chaos-based image [91,92] and random number generation algorithms [67,93–95]
    based on discrete chaos have been proposed, but security is generally not high
    enough [96,97].


    This chapter discusses implementing chaotic Baker map scrambling of image pixels
    using three different modes of operation: CBC, CFB, and OFB. This implementation
    depends on the block size S, where S = N × N pixels, and an IV that works as the
    main key. The bits of the IV must be random and uncorrelated as much as possible
    to yield a powerful encryption mechanism. In the chapter experiments, the image
    encrypted is Lena, which is a 512 × 512 grayscale image, and parts of an encrypted
    version of the Cameraman image are used in the IV (Figure 5.1).


    # ## 5.2 Chaotic Encryption with Modes of Operation


    The main objective of chaotic encryption with different modes of operation is
    to increase the security of chaotic encryption with moderate computation time
    and adjust it to encrypt images with arbitrary'
