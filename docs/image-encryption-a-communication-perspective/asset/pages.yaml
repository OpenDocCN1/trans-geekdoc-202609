  md: 'A guard interval is added at the start of each OFDM symbol to eliminate the
    ISI, which occurs in multipath channels. An OFDM symbol is extended in a cyclic
    manner to avoid the ICI. As a result, a channel that is highly frequency selective
    is transformed into a large set of individual flat fading, non-frequency-selective,
    narrowband channels. At the receiver, the guard interval is removed, and the time
    interval [0, Tᵢ] is evaluated.


    # 7.3.2 DCT-OFDM


    The structure of the discrete cosine transform (DCT)-OFDM system is similar to
    that of FFT-OFDM but with the IFFT and the FFT modules replaced by inverse discrete
    cosine transform (IDCT) and DCT modules, respectively. The main advantage of the
    DCT lies in its excellent spectral-energy compaction property, which makes most
    of the samples transmitted close to zero, leading to a reduction in the ISI. In
    addition, it uses only real arithmetic rather than the complex arithmetic used
    in the FFT. This reduces the signal processing complexity and the in-phase/quadrature
    imbalance [136,137]. In the DCT-OFDM system, the transmitted signal is given by
    [138–140]


    $$x(n)=\sqrt{\frac{2}{N}}\sum_{k=0}^{N-1}X(k)\beta(k)\cos\left(\frac{\pi k(2n+1)}{2N}\right),\quad
    p=0,\ldots,N-1 \tag{7.6}$$


    where X(k) is the kth symbol of the input signal. β(k) can be written as follows:


    $$\beta(k)=\begin{cases}\frac{1}{\sqrt{2}}, & k=0\\1, & k=1,2,\ldots,N-1\end{cases}
    \tag{7.7}$$


    # 7.3.3 Discrete Wavelet Transform–OFDM


    The OFDM requires a cyclic prefix to remove ISI. This causes overhead, and this
    overhead may sometimes be too large for the system to be effective. The use of
    the wavelet transform reduces the ISI and ICI [138, 141,142]. The structure of
    the discrete wavelet transform'
