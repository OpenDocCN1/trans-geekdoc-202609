    # 2.8 Chaos and Cryptography


    Chaos theory has been established since the 1970s in many different research areas,
    such as physics, mathematics, engineering, biology, and others. The most well-known
    characteristics of chaos are the so-called butterfly effect (sensitivity to initial
    conditions) and the pseudo-randomness generated by deterministic equations. Many
    fundamental properties of chaotic systems have their corresponding counterparts
    in traditional cryptosystems. Chaotic systems have several significant features
    favorable to secure communications, such as ergodicity, sensitivity to initial
    conditions and control parameters, and random-like behavior [38–40]. With all
    these advantages, scientists expected to introduce new and powerful tools of chaotic
    cryptography. So, chaos has become a new rich source of new ciphers [31–35].


    Chaotic dynamic systems are dimensional nonlinear dynamic systems that are capable
    of complex and unpredictable behavior. Chaos describes a system that is sensitive
    to initial conditions to generate an apparently random behavior but at the same
    time it is completely deterministic. These properties of chaos have much potential
    for applications'
