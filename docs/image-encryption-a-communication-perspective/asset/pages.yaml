  md: 'and diffusion. The fundamental building block of the DES is a single combination
    of these techniques: a substitution followed by a permutation on the data based
    on the key. After an initial permutation, each block is broken into a right half
    and a left half, each with 32 bits. Then, there are 16 rounds of identical operations,
    called f functions, in which the data are combined with the key. After these rounds,
    the right and left halves are joined, and a final permutation, the inverse of
    the initial permutation, finishes the algorithm.


    # 2.6.2 Double DES


    A naïve way of improving the security of a block cipher algorithm is to encrypt
    each block twice with two different keys. First, encrypt a block with the first
    key and then encrypt the resulting ciphertext with the second key. Decryption
    is the reverse process. In the Double DES encryption algorithm, each 64-bit block
    of data is encrypted twice with the DES algorithm, first with a key $K_1$ and
    then with another key $K_2$. The scheme involves a key of 112 bits.


    The resultant doubly encrypted ciphertext block should be much harder to decrypt
    using an exhaustive search. Instead of $2^{56}$ attempts, it requires $2^{128}$
    attempts to find the key and $2^{112}$ attempts to break the encryption. In 1981,
    Merkle and Hellman declared their “meet-in-the-middle” attack, which proved the
    weakness of the Double DES algorithm [47]. The “meet-in-the-middle” attack is
    a known plaintext attack that requires that an attacker have both a known piece
    of plaintext and the corresponding ciphertext. The attack requires storing $2^{56}$
    intermediate results when trying to crack a message that has been encrypted with
    the double DES. Merkle and Hellman developed a time-memory trade-off that could
    break this double-DES encryption scheme in $2^{56+1}$ trials, not in $2^{112}$
    trials.


    # 2.6.3 Triple DES


    The dangers of the Merkle-Hellman “meet-in-the-middle” attack can be circumvented
    by performing three block encryption operations.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'This method is called Triple DES. Triple DES is performed by executing the
    DES three times, producing an effective key size of 168 bits. In the Triple DES,
    each 64-bit block of data is encrypted three times with the DES algorithm. In
    practice, the most common way to perform the Triple DES is


    +   1. Encrypt with key 1.

    +   2. Decrypt with key 2.

    +   3. Encrypt with key 3.


    To decrypt, reverse the steps:


    +   1. Decrypt with key 3.

    +   2. Encrypt with key 2.

    +   3. Decrypt with key 1.


    For several applications, we can use the same key for both key 1 and key 3 without
    creating a significant vulnerability. The choice between Single, Double, and Triple
    DES is a trade-off between performance and security requirements [45].


    # 2.6.4 International Data Encryption Algorithm


    The International Data Encryption Algorithm (IDEA) cipher was first presented
    by Lai and Massey in 1990 under the name Proposed Encryption Standard (PES). After
    Biham and Shamir presented differential cryptanalysis, the authors strengthened
    their cipher against the attack and named it the Improved Proposed Encryption
    Standard (IPES). The IPES name was changed to the International Data Encryption
    Algorithm (IDEA) in 1992. This algorithm was intended as a replacement for the
    DES. IDEA is a block cipher that operates on 64-bit plaintext blocks. The key
    is 128 bits long. There are eight identical rounds, and the same algorithm is
    used for both encryption and decryption. It uses both confusion and diffusion.
    The design philosophy behind the algorithm is based on mixing operations from
    different algebraic groups. Three algebraic groups (XOR, addition modulo, and
    multiplication modulo) are mixed in this algorithm [16,18], and they are all easily
    implemented in both hardware and software. All of these operations operate on
    16-bit subblocks.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 2.6.5 Blowfish


    Blowfish is a 64-bit block cipher with a variable-length key. It was designed
    in 1993 by Schaneier [16]. This algorithm consists of two parts: key expansion
    and data encryption. Key expansion converts a key of up to 448 bits into several
    subkey arrays totaling 4168 bytes. Data encryption consists of a simple function
    iterated 16 times. Each round consists of a key-dependent permutation and a key-
    and data-dependent substitution. All operations are additions and XORs on 32-bit
    words. The only additional operations are four indexed array data lookups per
    round. The keys must be precomputed before any data encryption or decryption,
    with decryption exactly the same as encryption except that the subkeys are used
    in reverse order.


    # 2.6.6 RC5 Algorithm


    The iterated block RC5 was introduced by Rivest, Shamir, and Adleman in 1994 [48].
    The main feature of the RC5 is the heavy use of data-dependent rotations. RC5
    has a variable word size w, a variable number of rounds r, and a variable secret
    key with b bytes. It is represented as RC5 w/r/b. The nominal value of w is 32
    bits, and RC5 encrypts blocks of two words. The RC5 is composed of encryption,
    decryption, and key expansion. The expanded key contains t = 2 × (r + 1) words.
    The primitive operations of the RC5 are illustrated in Table 2.3. Generally, RC5
    is a fast symmetric block cipher that is suitable for hardware and software implementations
    with low memory requirements. It provides high security when good parameters are
    chosen.


    Table 2.3 Primitive Operations of RC5


    | Operation | Description |

    |---|---|

    | a + b | Integer addition modulo 2^w |

    | a − b | Integer subtraction modulo 2^w |

    | a ⊕ b | Bitwise XOR of w-bit words |

    | a * b | Integer multiplication modulo 2^w |

    | a <<< b | Rotate the w-bit word a to the left by the amount given by the least-significant
    lg w bits of b |

    | a >>> b | Rotate the w-bit word a to the right by the amount given by the least-significant
    lg w bits of b |'
