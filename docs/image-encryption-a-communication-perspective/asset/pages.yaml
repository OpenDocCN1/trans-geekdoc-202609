    # 4.3 Security Analysis and Test Results


    A good encryption scheme should resist all kinds of known attacks, such as the
    known-plaintext attack, the ciphertext-only attack, the statistical attack, the
    differential attack, and the various brute-force attacks. The security of the
    homomorphic image cryptosystem was investigated for digital images under the brute-force
    attack, the statistical attacks, and the differential attacks [81–85].


    Some security analysis results, including the key space analysis, the statistical
    analysis, and the differential analysis have been presented [60,86,87]. Tests
