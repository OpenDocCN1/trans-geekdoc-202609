    the process of decimation and interpolation by 2:1 at the output of H0 and H1
    effectively sets all odd samples of these signals to zero.


    For the low-pass branch, this is equivalent to multiplying x0(n) by 1/2(1+(-1)^n).
    Hence, X0(z) is converted to {X0(z)+X0(-z)}. Similarly, X1(z) is converted to
    1/2{X1(z)+X1(-z)}.


    Thus, the expression for Y(z) is given by [142]


    Y(z)=1/2{X0(z)+X0(-z)}G0(z)+1/2{X1(z)+X1(-z)}G1(z)

    =1/2 X(z){H0(z)G0(z)+H1(z)G1(z)}

    +1/2 X(-z){H0(-z)G0(z)+H1(-z)G1(z)} (7.9)


    The first PR condition requires aliasing cancellation and forces this term in
