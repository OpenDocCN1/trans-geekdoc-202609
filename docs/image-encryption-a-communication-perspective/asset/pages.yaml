    space and transmission time.


    # 2.6 Conventional Symmetric Block Ciphers


    This section gives a brief overview of the construction of some popular conventional
    encryption algorithms. Each of the following encryption algorithms is a symmetric
    block cipher algorithm. Symmetric means that the key used for encryption and decryption
    is the same; block means that the data (information) to be encrypted is divided
    into blocks of equal length [35–45].


    # 2.6.1 Data Encryption Standard


    The Data Encryption Standard (DES) is the most well-known symmetric-key block
    cipher. It was selected by the National Bureau of Standards as an official Federal
    Information Processing Standard (FIPS) for the United States in 1976, and it subsequently
    enjoyed widespread use internationally [46].


    The DES is a block cipher, which encrypts data in 64-bit blocks. A 64-bit block
    of plaintext goes at one end of the algorithm, and a 64-bit block of ciphertext
    comes out at the other end. The same'
