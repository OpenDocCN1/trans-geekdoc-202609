- pgno: 36
  md: "# 2.6.7 RC6 Algorithm\n\nThe RC6 block cipher is a modified version of RC5\
    \ that uses four working registers instead of two and integer multiplication as\
    \ an additional primitive operation. The integer multiplication process greatly\
    \ enhances the diffusion achieved per round, which leads to greater security,\
    \ fewer rounds, and increased throughput. The key schedule of RC6-w/r/b is similar\
    \ to the key schedule of RC5-w/r/b. The only difference is that for RC6-w/r/b,\
    \ more words are derived from the user-supplied key for use during encryption\
    \ and decryption. The user supplies a key of b bytes, where 0 ≤ b ≤ 255. From\
    \ this key, 2r + 4 words (w bits each) are derived and stored in the array S[0,\
    \ ..., 2r + 3]. This array is used in both encryption and decryption [12]. Generally,\
    \ RC6 consists of two Feistel networks whose data are mixed via data-dependent\
    \ rotations. The operations in a single round of RC6 contain two applications\
    \ of the squaring function f(x) = x(2x + 1) mod 2^32, two fixed 32-bit rotations,\
    \ two data-dependent 32-bit rotations, two XORs, and two additions modulo 2^32.\
    \ The steps of RC6 encryption and decryption are summarized next, and the block\
    \ diagrams of RC6 encryption and decryption are shown in Figures 2.7 and 2.8,\
    \ respectively.\n\n# 2.6.7.1 RC6 Encryption Algorithm\n\n```\nInput: Four w-bit\
    \ plaintext values stored in registers\nA, B, C, and D\n    Number r of rounds\n\
    \    w-bit round keys S[0, ..., 2r+3]\nOutput: Four w-bit ciphertext values stored\
    \ in\nregisters A, B, C, and D.\nProcedure: B = B + S [0];\n    D = D + S [1];\n\
    \    For i = 1 to r do\n    {t = (B × (2B + 1)) <<< lg w;\n    u = (D × (2D +\
    \ 1)) <<< lg w;\n    A = ((A ⊕ t) <<< u) + S [2i];\n    C = ((C ⊕ u) <<< t) +\
    \ S [2i + 1];\n    (A, B, C, D) = (B, C, D, A); }\n    End\n    A = A + S [2r\
    \ + 2];\n    C = C + S [2r + 3];\n```"
