    # 8.5 CFO in DWT-OFDM System Model


    The transmitted signal with discrete wavelet transform (DWT)-OFDM is given by
    [138]


    x(n) = Σ_{k=0}^{N} X(k) φ(t - kT)  (8.16)


    where φ(t) is the wavelet basis functors. Some attempts have been made to predict
    the CFO effect on DWT-OFDM, but, as of yet, no closed-form expression has been
    presented for this task.


    # 8.6 CFO Compensation


    There are many techniques that were developed to compensate for the CFO in multicarrier
    communication systems. In this chapter, the compensation process is carried out
    in the time domain. Mathematically, for the OFDM system, the received sequence
    is multiplied by a time domain sequence e^{-j2πnε/N} before the FFT/DCT/DWT processing.
    The compensated signal can be formulated as follows for AWGN [151–153]:


    r_c(n) = e^{j2πnε/N} r(n) = x(n) + e^{j2πnε/N} w(n)  (8.17)


    In fading channels, as we know, estimation of the channel transfer function is
    needed. The channel transfer function estimate may be computed using any algorithm
    that gives reliable estimates. In our design, the zero-forcing (ZF) channel estimator
    was applied to obtain'
