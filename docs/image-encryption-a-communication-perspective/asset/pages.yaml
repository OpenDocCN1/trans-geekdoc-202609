    # 9.4 Simulation Experiments of PAPR Reduction Methods


    Several experiments were carried out to test the effect of the PAPR reduction
    methods on the process of encrypted image transmission with OFDM. A convolutional
    code with rate 1/2, constraint length 7, and octal generator polynomial (133,171)
    are adopted to reduce the effect of PAPR reduction on the quality of received
    images. The compared PAPR reduction methods are clipping, companding, and hybrid
    clipping-and-companding methods.


    The performance of the process of original image transmission with the chaotic
    algorithm and three different diffusion algorithms for (FFT/DCT/DWT)-OFDM systems
    with N = 128 and G = 32 over an AWGN is shown in Figures 9.130 to 9.132. From
    these figures, it'
