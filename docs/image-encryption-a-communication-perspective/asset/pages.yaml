- pgno: 113
  md: '(DWT)-OFDM system is similar to that of FFT-OFDM but with the IFFT and the
    FFT modules replaced by indirect discrete wavelet transform (IDWT) and DWT modules,
    respectively. The transmitted signal with DWT-OFDM is given by [138]


    x(n)=∑_{k=0}^{N} X(k)φ(t−kT'')

    (7.8)


    where φ(t) is the wavelet basis function.


    Further advantages of the DWT-OFDM are as follows:


    +   1. It requires less overhead as it does not require a cyclic perfix (CP).

    +   2. It does not require a pilot tone, which takes about 8% of the subbands.

    +   3. DWT-OFDM is inherently robust to ISI and ICI.


    The DWT is explained in the following section.


    # 7.3.4 Discrete Wavelet Transform


    Wavelets have become a popular tool in most signal-processing and communications
    applications. The conventional DWT may be regarded as equivalent to filtering
    the input signal with a bank of band-pass filters whose impulse responses are
    all approximately given by scaled versions of a mother wavelet. The scaling factor
    between adjacent filters is usually 2:1, leading to octave bandwidths and center
    frequencies that are one octave apart [138,139]. The outputs of the filters are
    usually maximally decimated so that the number of DWT output samples equals the
    number of input samples, and the transform is invertible as shown in Figure 7.2.


    # 7.3.4.1 Implementation of the DWT


    The DWT is normally implemented by digital filters as shown for the one-dimensional
    (1D) case in Figure 7.2. The art of finding a good wavelet lies in the design
    of the set of filters H₀, H₁, G₀, and G₁ to achieve various trade-offs between
    spatial and frequency domain characteristics while satisfying the perfect reconstruction
    (PR) condition [142]. In Figure 7.2,'
