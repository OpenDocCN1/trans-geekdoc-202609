  md: 'The RC6 block cipher algorithm and the chaotic Baker map scrambling algorithm
    have been chosen as they are representatives of different encryption families.
    The first one belongs to the family of diffusion algorithms, and the second one
    belongs to the family of permutation algorithms. The objective is to decide which
