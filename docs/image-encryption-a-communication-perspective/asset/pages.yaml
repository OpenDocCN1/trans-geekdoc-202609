  md: '![](img/47f81eeb5093bf67426e3b948e0d8952_75_0.png)


    Figure 5.1 Encrypted version of Cameraman image.


    dimensions. We investigated chaotic encryption with three modes of operation:
    CBC, CFB, and OFB [16–18]. The three modes were tested to decide which one would
    increase the data-hiding ability of the cryptosystem. Chaotic encryption with
    modes of operation can be simply summarized in the following three steps:


    +   1. Scan the image row by row.

    +   2. Convert the scanned rows to w blocks, each with N × N pixels.

    +   3. Encrypt these blocks using the 2D chaotic Baker map in the CBC, CFB, or
    OFB mode as explained in the following sections.


    The block diagram of chaotic encryption with modes of operation is shown in Figure
    5.2.


    # 5.3 Implementation Issues


    As stated in the previous section, chaotic encryption can be implemented in three
    different modes of operation. It is based on the 2D chaotic Baker map as the main
    encryption algorithm. It is known that the permutations induced by the Baker map
    behave as typical random permutations. An IV is used as the main key. This IV
    must be random to resist the brute-force attack. The XOR operations between the
    bits of the IV and the bits of the data blocks change the values of the pixels,
    which makes the encryption algorithm behave like a 3D Baker map. The algorithm
    also uses a secondary key, which is the key used by the Baker map to scramble
    the pixels.


    Chaotic encryption with modes of operation is based on the segmentation of the
    image to be encrypted into blocks. The block size is'
