  md: '+j\sqrt{\frac{2}{N_1}}\sum_{n=1}^{N_1}\sin\left(\frac{\pi n}{N_1}\right)\cos\left\{2\pi
    f_d\cos\left(\frac{2\pi n}{N_1}\right)t\right\} \quad (7.25)


    where the wave number of the incoming wave is $N_0$, and $N_1$ is given by


    $N_1 = 1/2((N_0/2) - 1)$ \quad (7.26)


    # 7.6 Channel Estimation and Equalization


    Channel estimation and equalization constitute a major challenge in current and
    future communication systems. The equalizers utilized to compensate for the ISI
    can be classified as linear and nonlinear equalizers [147]. Linear equalizers
    are simple linear filter structures that try to invert the channel in the sense
    that the product of the transfer functions of the channel and the equalizer fulfills
    a certain criterion. This criterion can either be achieving a completely flat
    transfer function of the channel filter concatenation or minimizing the mean square
    error at the filter output [148]. One of the most popular linear equalizers is
    the zero-forcing (ZF) equalizer. The ZF solution can be written as [148]


    $\mathbf{W}_{ZF} = (\mathbf{H}^H\mathbf{H})^{-1}\mathbf{H}^H$ \quad (7.27)


    where $\mathbf{H}$ is the matrix of the channel transfer function.


    The advantage of the ZF equalizer is that the statistics of the additive noise
    and source data are not required.


    Channel estimation can be performed with pilot symbol estimation (PSE). With an
    OFDM system, the wideband channel is divided into a number of narrowband channels.
    Thus, channel estimation can be performed by inserting pilot symbols with a known
    modulation scheme into the transmitted signal. Based on these pilot symbols, the
    receiver can measure the channel transfer function for each subcarrier using interpolation
    techniques [113].


    The mathematical model for the PSE and equalization can be represented as follows
    [144]:


    $\begin{pmatrix} i_1 \\ q_1 \end{pmatrix} = A \begin{pmatrix} i_0 \\ q_0 \end{pmatrix}$
    \quad (7.28)'
