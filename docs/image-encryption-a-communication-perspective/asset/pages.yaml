    First, being completely deterministic means that we can always obtain the same
    set of values provided we have exactly the same mapping function and initial conditions.
    Because chaotic functions are sensitive to initial conditions, any slight difference
    in the initial values used means that the ciphertext produced using chaos will
    be completely different. This means that the system will be strong against brute-force
    attacks as the number of possible keys is large.


    The basic properties of chaotic systems are the determinism, the sensitivity to
    initial conditions and parameters, the topological transitivity, and the ergodicity
    [51–55].


    Determinism means that chaotic systems have some determining mathematical equations
    ruling their behavior.


    Sensitivity to initial conditions means that when a chaotic map is iteratively
    applied to two initially close points, the iterations quickly diverge and become
    uncorrelated in the long term. Sensitivity to parameters causes the properties
    of the map to change quickly when slightly perturbing the parameters on which
    the map depends. Hence, a chaotic system can be used as a pseudorandom number
    generator.


    Topological transitivity is the tendency of the system to quickly scramble up
    small portions of the state space into an intricate network of filaments. Local,
    correlated information becomes scattered over the state space.


    The ergodicity of a chaotic map means that if the state space is partitioned into
    a finite number of regions, no matter how many, any orbit of the map will pass
    through all these regions. The ergodicity of a chaotic map is ensured by the topological
    transitivity property.


    Many properties of chaotic systems, such as mixing and sensitivity to initial
    conditions, have their corresponding counterparts in traditional cryptosystems.
