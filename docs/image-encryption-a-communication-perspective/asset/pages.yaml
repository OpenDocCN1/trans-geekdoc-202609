    # 6.5 Summary


    In this chapter, an efficient approach has been presented to solve the problems
    associated with encryption in the ECB mode. A preprocessing network processes
    the data before encryption to diffuse the data bytes together prior to the application
    of the encryption algorithm in the ECB mode. The test results have shown that
    any encryption algorithm implemented in the ECB mode with the preprocessing network
    achieves good diffusion characteristics and high encryption quality without losing
    the parallel processing advantage.'
