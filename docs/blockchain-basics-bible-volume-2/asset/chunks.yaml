- fmt: '

    Unfortunately, most people who already know about bitcoins are too lazy to do
    some research to understand their potential. My first experience with `bitcoin`
    was back in 2013, and I didn''t give it much thought. I understood that `bitcoin`
    is a form of online payment method, and criminals mostly use it due to its untraceable
    nature. It''s just that. The news doesn''t mention it very often, apart from the
    occasional cyberattack where the hackers demand `bitcoin` to unlock the system.


    In any case, at the beginning of this year, I rediscovered `bitcoin` as I studied
    Network Security, so I told my buddy Rob about it. According to him, `bitcoin`
    had a value of about $300, and he was aware of its existence. It was inconceivable
    for me to believe that one `bitcoin` was worth $300 when Rob told me! `Bitcoin`
    was something I had never heard of before. It still didn''t occur to me that it
    only exists in digital format. I still thought it was like a real physical coin.
    Afterward, another friend Viktor, who was overhearing our conversation, asked
    why I had never heard of `bitcoin` before! Hence, I said, "Yes, I heard about
    it, but I didn''t realize it was worth that much." I became more interested in
    it and began to do some research on it. Several days later, I had an idea to make
    `bitcoin` with my old laptop! As a result, Viktor and Rob were curious about how
    computers could generate `bitcoins`, and I told them that I heard they were worth
    about $300 each, and I might be able to generate one or two each week. It was
    clear that I had no idea what I was talking about, and they told me it wasn''t
    that straightforward. It was, however, impossible for them to explain how it''s
    done. According to them, I was thinking like a hacker, and I shouldn''t have been
    thinking like that, as it was for criminals. However, I did say that it sounded
    like an exciting technology. “So what''s the benefit of having `bitcoin`?” they
    asked. Interested in something in particular? Are you interested in buying something
    from the dark web? It left me speechless, so I didn''t say anything. Meanwhile,
    I started learning and acknowledging everything I could about `bitcoin`, which
    led me to another fascinating technology known as `Blockchain`.


    It is relevant to note that most people have been misled by fake news, and for
    those that might be interested, understanding how `bitcoin` or `Blockchain` functions
    takes time. Consequently, most people don''t get involved in research and give
    up before they start.


    # The Trigger


    When Lehman Brothers collapsed, some of you might recall when everything seemed
    just fine back then. Then, the largest bankruptcy in US history, the 15th of September
    2008, occurred. Lehman Brothers were operating in other countries too, and the
    outcome of that day was the same wherever it was located.


    The time was when I was working in Canary Wharf, London, UK. I was working as
    an assistant manager in a restaurant called `Nando''s` during those days. Groups
    of people arrived at our restaurant carrying boxes containing their belongings
    from the office. Our server informed us that they would not be eating there anymore.
    We did''t understand what these customers were talking about at first because
    we had been working hard and were isolated from the news.


    Our attention was quickly drawn to the news at Canary Wharf, where we discovered
    that Lehman Brothers UK had been placed in administration (bankruptcy) just 45
    minutes earlier. Consequently, we understood and realized that those who used
    to eat lunch at our restaurant would no longer have the opportunity to come around.
    A day earlier, 2,000 people had lost their jobs. A total of 2,500 more followed
    the following day, on the 16th of September. Our management team decided to provide
    free soft drinks to those who just lost their jobs to demonstrate our sympathy.
    All of those customers were also lost along with others. I just wanted to share
    my experience right at the beginning of the recession in 2008 when I was working.
    The Lehman Brothers bankruptcy led to many more Banks and Financial Institutions
    choosing administration over bankruptcy protection. News channels were awash with
    stories about another large company losing all its assets, time and time again.
    Unemployment rose simultaneously, and then slowly, many people began losing their
    homes due to unpaid mortgage payments.


    Many small businesses needed to close. People were thinking twice before spending
    money in the restaurant, as there were fewer customers there. It was not just
    the US and UK that suffered from the financial crash, but many other countries
    that are still suffering from recessions. During that period, the housing price
    began to fall and finding a new job was difficult, especially since overqualified
    individuals applied everywhere. Job openings, however, were not sufficient to
    meet the demand.


    # The Inventor


    F irst and foremost, please realize that this book was written in the second quarter
    of 2017. Consequently, once you have finished reading this book, fresh light may
    have been shone on who Satoshi Nakamoto is.


    Let''s attempt to figure out who Satoshi Nakamoto is based on what we know right
    now.

