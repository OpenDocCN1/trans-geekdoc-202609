  trans: '

    遗憾的是，大多数已经知道 `bitcoin` 的人太懒了，不愿意通过研究来了解它的潜力。我第一次接触 `bitcoin` 是在 2013 年，我当时并没有想太多。我明白
    `bitcoin` 是一种在线支付方式，犯罪分子主要由于其不可追溯的特性而使用它。仅此而已。新闻中并不经常提到它，除非偶尔发生黑客要求用 `bitcoin`
    来解锁系统的网络攻击。


    无论如何，在今年初，我在学习网络安全时重新发现了 `bitcoin`，于是我告诉了我的哥们 Rob 这件事。据他所，`bitcoin` 的价值大约是 300
    美元，而且他也知道它的存在。当 Rob 告诉我一个 `bitcoin` 就值 300 美元时，这对我来说是不可思议的！`Bitcoin` 是我以前从未听说过的东西。我仍然没有意识到它只以数字形式存在。我仍然认为它像一种真实的实体硬币。后来，另一个路过听到我们对话的友
    Viktor 问，为什么我以前没听过 `bitcoin`！于是我说：“是的，我听过，但我没意识到它值那么多钱。”我变得越来越感兴趣，并开始对它进行一些研究。几天后，我产生了一个主意，用我的旧笔记本电脑制作
    `bitcoin`！结果，Viktor 和 Rob 对计算机如何生成 `bitcoins` 感到好奇，我告诉他们我听说每个大约值 300 美元，我可能每周可以生成一两个。显然，我完全不知道自己在说什么，他们告诉我这没那么简单。然而，他们也无法解释具体是如何操作的。根据他们的话，我思考得像个黑客，我不应该那样思考，因为那是犯罪分子的思维。不过，我确实说这听起来像是一项令人兴奋的技术。“所以拥有
    `bitcoin` 有什么好处？”他们问道。对某些东西特别感兴趣吗？你想从暗网买东西吗？这让我无口无言，所以我什么也没说。与此同时，我开始学习并认可关于 `bitcoin`
    的一切知识，这引导我发现了另一个被称为 `Blockchain` 的迷人技术。


    值得注意的是，大多数人被假新闻误导了，对于那些可能感兴趣的人来说，理解 `bitcoin` 或 `Blockchain` 的运作需要时间。因此，大多数人没有参与研究，在开始之前就放弃了。


    # 触发


    当雷曼兄弟破产时，你们中的一些可能记得那时一切看起来都很好。然后，美国历史上最大的破产事件发生了，那是 2008 年 9 月 15 日。雷曼兄弟也在其他国家运营，无论位于何处，那天的结果都是样的。


    当时我正在英国伦敦的金雀码头（Canary Wharf）工作。那几天，我在一家名为 `Nando''s` 的餐厅担任助理经理。成群的人带着装着他们办公物品的箱子来到我们的餐厅。我们的服务员告诉我们，他们将不再在那里用餐了。起初我们并不理解这些客户在说什么，因为我们一直在努力工作，与新闻隔绝了。


    我们的注意力很快被金雀码头的新闻吸引，我们发现雷曼兄弟英国公司在 45 分钟前已被接管（破产）。因此，我们理解并意识到，那些以前在我们餐厅吃午饭的人将不再有机会过来了。一天前，有
    2000 人失去了工作。在第二天，即 9 月 16 日，又有 2500 人失业。我们的管理团队决定为那些刚刚失业的人提供免费软饮料，以表达我们的同情。所有这些客户和其他人一起流失了。我只想在
    2008 年衰退之初我工作时分享我的经历。雷曼兄弟的破产导致更多银行和金融机构选择接管而非破产保护。新闻频道充斥着另一家大公司损失所有资产的故事，一次又一次。失业率同时上升，然后慢慢地，许多人由于无法偿还抵贷款开始失去他们的房屋。


    许多小企业不得不关闭。人们在餐厅花钱之前会三思，因为那里的顾客变少了。不仅是美国和英国遭受了金融风暴的影响，还有许多其他国家仍在遭受衰退的困扰。在那期间，房价开始下跌，寻找新工作很困难，尤其是当许多资历过高的人到处申请时。然而，职位空缺不足以满足需求。


    # 发明者


    首先，请意识到这本书是写于 2017 年第二季度的。因此，一旦你读完这本书，关于 Satoshi Nakamoto 到底是谁，可能会有新的发现。


    让我们尝试根据我们目前所知的信息来推测一下 Satoshi Nakamoto 是谁。


    '
- fmt: '

    First and foremost, `Satoshi Nakamoto` is the creator of `bitcoin` as well as
    `blockchain technology`. Even though it is a fictitious identity, this is how
    he announced himself to the internet. It''s a boy''s name. It is plausible, however,
    that `Satoshi Nakamoto` is a woman. This is one of the most perplexing puzzles
    in the realm. Instead, most people do not want to know who `he` is; however, they
    are grateful for the technology he built. It is a common misconception that `Satoshi
    Nakamoto` has owned `Bitcoin` and `blockchain technology` since he invented them.
    The identity of `Satoshi Nakamoto` is not relevant since he does not control it.


    ### The Mystery Remains

    But, we still want to know who is behind the curtain, so let''s think about it
    again. `Satoshi Nakamoto` might be a guy or a woman, a couple of individuals,
    or even a gaggle of women, for all we know. `Satoshi Nakamoto` might be a small
    group of ten persons or a large group of one hundred people. `Satoshi Nakamoto`
    might be a toddler or an elderly man. Finally, `Satoshi Nakamoto` may have died
    shortly after releasing his `white paper`, leaving little opportunity to reveal
    his true identity.


    I understand if you''re tired of hearing these allegations, so let''s start thinking
    in a new way. `Satoshi Nakamoto` may not be human at all. You may think of it
    as having reached your limit. However, it is strange that we haven''t been able
    to find out who `Satoshi Nakamoto` is in the last decade; where he lives, but
    who he is—honestly—we have no clue. Someone may be able to identify him.


    ### Cultural Influence

    I have always enjoyed watching science fiction films, and I recently discovered
    one called `Arrival`. Some of these classic films are still relevant today. Back
    in the day, for example, science fiction books depicted certain products or technologies
    that we could use in the future, as well as others that we have been using for
    years. I don''t want to dig into many technicalities but consider this: it was
    only a thought that one day we might be able to achieve something like that. And
    nowadays we use `Skype` and `Facebook Video Chat` daily.


    Millions of individuals are connected and capable of staying on `Skype video chat`
    for hours on end. The original `iPhone` was developed and released to the public
    ten years ago in 2007. We''ve seen some tremendous developments since then, and
    the following decade will be even more spectacular.


    So, returning to `Arrival`, I hope you''ve already watched it and it won''t ruin
    anything for you. If you haven''t already watched it, you might want to skip the
    following few sentences. In the film, we are visited by `Aliens` who come to assist
    humanity by offering visibility in the future. But, again, if you haven''t seen
    the movie yet, you''ll probably despise me for this.


    The film''s themes are outstanding, so it is no surprise that it got an Oscar,
    even though it may have deserved more, but that is just my view. When I think
    about this sci-fi film, I think about its similarity to the same principles. We
    obtained `Blockchain technology` from an unknown individual—or, more accurately,
    from an unknown person. Our world will shift radically as a result of an anonymous
    source! I''m curious how the film''s makers came up with the idea... I''m not
    saying there are `Aliens` out there, but I also can''t say there aren''t. What
    I can tell you is that this technology fascinates `IT Professionals`, `Software
    Developers`, `Experienced Programmers`, and even `Cybersecurity Experts`, and
    it is sometimes referred to as `ALIAN TECHNOLOGY`. The blockchain is massive,
    and it will undoubtedly take months, if not years, to completely comprehend its
    complexities and how it fits into the larger picture. Another issue is that it
    is increasingly being claimed that this technology is simply too sophisticated
    for one man to create. As a result, `Satoshi Nakamoto` could not have been working
    on it alone.


    So, let us return to the million-dollar question: "Who is Satoshi Nakamoto?" First,
    let''s look at some of the claims made over the years so you can make your own
    decision. You must realize that `Satoshi Nakamoto` fell silent in 2009 and stayed
    so for the following five years, at least on the forum where he previously commented
    and was always active.


    ### Not Satoshi

    `Satoshi Nakamoto` was 41 years old when the `Bitcoin white paper` was published,
    according to legend. He is Japanese. However, the initial code produced for the
    blockchain was written in English, and it would be impossible for a Japanese individual
    to write like that. It would imply that he hired or was working with someone who
    speaks flawless English to create the code.


    In 2014, a few newspapers began to publish about `Dorian Nakamoto`, who was living
    in the United States in California at the time. `Satoshi` was `Dorian''s` given
    name at birth. Furthermore, additional facts might lend credence to his claim
    to be the true inventor of `Blockchain`. Apparently, the first reporter who attempted
    to contact him asked him, via `email`, if he had anything to do with `bitcoin`.


    `Dorian''s` reaction was, "I am no longer involved with that, and I cannot address
    it. It has been delegated to others. They are now in command of everything. I''m
    no longer connected." That, of course, raised suspicions, and reporters descended
    on `Dorian''s` home in California. He read his `email` again after understanding
    how serious it was and tried to explain himself.


    First and foremost, he has denied any affiliation with `bitcoin`. In fact, he
    stated that he had no idea what `bitcoin` was until his son informed him of the
    news, at which point he checked it up on the `internet`. He also went public and
    stated, "I have nothing to do with `bitcoin`. It has nothing to do with development.
    I was merely an engineer doing something else at the time. If you look at the
    time spent in 2001, you''ll notice that I wasn''t there. I was employed by the
    government through a contracting firm. I only think the fictional name was inserted
    by mistake."


    There have also been revealed papers indicating that he has been conducting classified
    work for the `US Government` as well as the `US Military`. He has also signed
    agreements stating that he would not be able to disclose any role in his prior
    efforts with secret projects. Following this occurrence, an unexpected message
    appeared on a `P2P forum` where the `Real Satoshi Nakamoto` used to post after
    five years of silence. "I am not Dorian Nakamoto," he says.


    ### The Wright Claim

    `Craig Wright`, a well-known Australian businessman, emerged in 2015 as the next
    probable candidate to be `Satoshi Nakamoto`. Documents regarding `Craig Wright`
    had begun to leak to `Wired magazine` from an unnamed source. However, the majority
    of them provided proof that suggested `Craig Wright` was `Satoshi` himself. `Craig`
    has mentioned that he is considering releasing a `Cryptocurrency paper` in one
    of them, issued in August 2008. This, of course, became a highly appealing contender
    for `Satoshi Nakamoto''s` first `white paper`, which was published in October
    2008, barely a month later.


    Another leak, this time from `Wired magazine`, was another statement by `Craig
    Wright`, but this time from January 2009. He wrote this time that `bitcoin` is
    set to go live. The very first `bitcoin transaction` took place in January 2009.
    `Wired magazine` also reported that they had received several `e-mails` and transcripts
    confirming the relationship.


    There were several leaks about `Craig Wright`, particularly in `Wired magazine`.
    In May of 2016, though, everything changed. On his blog, `Craig Wright` said that
    he is now prepared to confess that he is `Satoshi Nakamoto` openly.

    '
