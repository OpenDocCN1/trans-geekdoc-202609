    The excavator who addresses the hash puzzle, and his square is on the fundamental
    chain, will get the square prize and every one of the exchanges expenses (tx1
    and tx2) in this square. On the other hand, the excavator who has addressed the
    hash puzzle, and his square is a vagrant fork, can''t spend the square award and
    exchange expenses since his square isn''t on the fundamental chain. 


    Platform testing 


    Because of the scaling exchanges, the first blockchain that was made back in 2009
    requires specific support. In earlier days, there were a number of exchanges;
    be that as it may, as of mid-2017, there are near 150,000 exchanges each day.
    That implies more than 6,250 exchanges inside 60 minutes, which boils down to
    105 exchanges consistently, which means almost 2 exchanges occur each second.


    I trust you can comprehend that the framework expects updates to ensure that a
    large number of exchanges can be taken care of by the organization. As of now,
    there are many blockchain occupations available, and on the off chance that you
    have great programming abilities, you could turn into an extraordinary blockchain
    engineer.'
