  trans: '

    观察者在其他被称为加密确认（Cryptographic confirmations），而利用的标记是额外查看验证。将标记从交易信息结构和区块信息结构中分离出来，并放入它们各自的信息结构中。从交易信息结构中移除标记是基本解释；尽管如此，存在一些副作用，那么我们来研究一下这些。首先，副作用并非在每种情况下都是糟糕的；说实话，对于
    `SegWit`，可以预见到一些非常确定的结果。


    ### 比特币的目标

    第一个目标是清理 `Bitcoin` 的部分元素。交易信息中不是静态的一个元素是数字签名。为了与标记覆盖的所有其他内容保持一致，这些位置的签名无法被成功更改，除非破坏标记；尽管如此，实际的标记是可以被篡改（malleated）的。这意味着当标记从交易信息中被移除时，交易
    ID（exchange ID）将不再出现在标记上。


    交易 ID 的哈希值不依赖于标记，这意味着交易 ID 无法被篡改。这本身是一个巨大的转折。另一方面，它有助于锚定交易、闪电网络和支付通道。它将解决我们目前在交易灵活性方面遇到的许多问题。


    ### 交易灵活性

    简单来说，交易灵活性是 `Bitcoin` 以及其他加密框架中的一个障碍，在那里你可以对交易发布未经许可的改进，并使用备用交易 ID 再次广播。但是，当然，你无法更改资产的来源或资产的去向，因为标记覆盖了这些；尽管如此，你可以对标记进行微小的更改。


    让我们用简单直接的方式思考这个问题。假设标记包含数字 `5`。计算 `5` 和 `05` 的研究结果非常相似，但假设你出于特定目标对数字进行填充零，它将改变该交易的唯一指纹，无论该标记是否以相同的方式解析。这意味着，你可以更改标记的一部分，因为它没有覆盖这些部分，它们将交付一个具有完全唯一
    ID 的交易。通过这样做，你可以将其注入组织并制造混乱。交易灵活性曾因某些盗窃和 `Bitcoin` 交易而被指责，在这些情况下，人们利用交易灵活性获得某种双重提现。它还允许你对网络完成
    `DOS` —— 拒绝服务攻击；也可以针对使用支付通道或将许多交易连接在一起的个人。


    ### SegWit 如何允许网络中产生更多交易？

    `SegWit` 的迷人特征之一是你可以开始对比计算区块估计，并通过 `SegWit` 提供直接增加的能力。交易是进入区块链的途径；因此，你希望交易上的标记被区块链认可。然而，当交易在区块链中后，没有人会在未来的任何时候检查这些标记；通常情况下，我们不会回过来看很久以前发生的旧交易。它们就包含在区块链中。它们已经被通过了：因此，旧交易现在是受信的。标记仅用于通过一次授权。例如，当你写一张纸质支票时，你可以选择进入在线财务系统，并在支票提交并收到资金后查看支票的图片。它不是银行声明的一部分，除了检查一次它是否被批准之外，你不需要操心它；之后，它就一直留在那里，不再需要它了。这种情况也适用于标记。你需要理解数字签名占据了某些交易总空间的
    75%。此外，交易越多，标记就越大。巨大、复杂的内容和多签名具有巨大的标记，它们占据了区块链上的大量空间，并且再次，在通过后人们不再考虑它们。


    另一个替代方法是从交易信息结构中移除标记，这需要一个硬叉（hard fork）。然而，这种技术允许通过 `SegWit` 来增加区块容量。交易是进入区块链的途径；因此，你希望交易上的标记被区块链认可。然而，当交易在区块链中后，没有人会在未来的任何时候检查这些标记；通常情况下，我们不会回过来看很久以前发生的旧交易。它们就包含在区块链中。它们已经被通过了：因此，旧交易现在是受信的。标记仅用于通过一次授权。例如，当你写一张纸质支票时，你可以选择进入在线财务系统，并在支票提交并收到资金后查看支票的图片。它不是银行声明的一部分，除了检查一次它是否被批准之外，你不需要操心它；之后，它就一直留在那里，不再需要它了。

    '
