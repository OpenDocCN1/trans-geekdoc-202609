  trans: '

    在过去的几年里，全球涌现了成千上万家银行。银行体系不会在明天消失，至少还需要二十年的时间。然而，现在已经有了替代银行的科技；我们需要做的只是让所有的供应商、员工和雇主都应用
    `blockchain` 技术。这并不是很难办到的事情。尽管如此，我们大多数人对现有系统非常熟悉，因此采用新系统可能需要一段时间。


    黄金


    当黄金从货币中被淘汰并被纸币取代时，花了很长时间才实施，并让每个人都理解现在支付的是纸币而非黄金。正如之前所说，黄金在大多数国家仍然是一个可行的支付选项；尽管如此，它并不是任何地方都能被接受。


    当你去当地杂货店时，你不会用黄金支付；然而，其他机构可能接受。你无法用黄金支付，就像你在线购买东西时也无法用黄金支付一样，除了这是一种过时的方法之外，还有其他原因。


    让我们先来看看黄金的灵活性。假设你想去社区的咖啡馆买杯卡布奇诺。用黄金支付咖啡的前景令人生畏。


    除了可能切得比预想更大的切口之外，你该如何为店主切开或切割合适的黄金呢？关键点在于，没有一种贵金属可以被广泛用于支付机制。它太重了，而且将其切割或切成所需的份数是很困难的；因此，未来将其用作货币是不可行的。


    现金


    不幸的是，纸币（或货币）正在不断地打印。结果是，确定市场上有多少钱是不可能的。打印得越多，它的价值就越低。我们从历史中得知，经过一段时间后，打印的钱之多到最终会失去价值。通货膨胀成为首要考虑的问题，许多人因为银行所有储蓄的损失而变得贫困。结果，政府被迫为所谓的“新经济”制造新的纸币。


    问题是，这个系统已经反复遭遇了惨痛的失败，因此我们都知道它是没用的。问题在于政府和银行集化了这个系统，普通人几乎没有追救手段。另一方面，数字货币是不可挡的，并且像
    `bitcoin` 一样，具有从根本上改变现状的潜力。


    纸币的另一个问题是它极易伪造。每天都会发生无数涉及各种类型纸币的事件。纸币制作得有多精美都没有关系，它可以被复制。结果，假币将永远存在。另一方面，加密货币是不可能伪造、复制或仿造的。


    考虑到 `blockchain` 代表信任和数字货币的精确数量，你必须理解加密货币可能很快超过任何纸币，特别是如果它是中心化的话。


    是的，这是正确的！然而，只会产生 2100 万个比特币。那么，会有足够的钱分给大家吗？另一方面，每个 `bitcoin` 包含 1 亿个 `Satoshis`。我不擅长算术，所以我用计算器算出了总共会有多少个
    `Satoshi`，答案是 `2,100,000,000,000,000`。


    地球上有大约 80 亿人口。所以我将这个巨大的数字除以 80 亿，看看地球上的每个人可能平均分配到多少 `Satoshis`。我得到了以下数字：`262,500`。


    现实情况是，60% 的人口一生储蓄永远不会超过 20,000.00 美元；但在你得出结论之前，请考虑这一点：每个 `Satoshi` 都可以使用 `blockchain`
    技术划分为其他分数，例如另外 1 亿份。如果这还不够，这些分数可以进一步划分为另外 1 亿份更小的部分，以此此类推。话虽如此，我希望你意识到 `Bitcoin`
    有潜力为全世界提供一种新货币。然而，目前已经存在大量不同的货币，各大机构已开始考虑开发自己的数字货币。


    瑞波


    目前使用 `Swift` 进行国际交易是一个头疼的问题。它可能需要 3-5 个工作日，而不是像 `bitcoin` 和其他加密货币那样几秒钟。


    更不用说成本了，资金转账太慢了，而且某些国家可能不会使用它。除了极快之外，使用使用 `blockchain` 平台的多种加密货币支付的成本非常低，甚至完全没有成本。`Bitcoin`
    钱包也可以在线获取，供任何人使用。


    每个人——意思是每一个人。你必须在开设新银行账户时满足银行提出的标准。某些要求可能包括拥有有效地址、年满 18 岁、拥有雇主提供的关于你的工作和工资的证明等。如果你有智能手机而不是所有这些烦恼，你可以在不需要上述任何标准的情况下开设
    `bitcoin` 账户。你甚至可以在几秒钟内开始国际交易。


    正如你所看到的，现有的问题是，如果我想从你那里买东西，我必须通过 `PayPal` 将钱从我的银行转到你的银行，然后由它付给你。要付款，至少需要另一个所谓的信誉第三方。另一方面，`blockchain`
    会为我们验证那笔交易。结果，我们不再需要银行或其他信誉第三方。只需要几分钟的互联网连接。


    你必须意识到，由于各种原因，有超过 20 亿个人没有银行账户。例如，他们可能不符合条件，或者他们可能穿得不体进入银行。当然，个人可能只是拒绝开设银行账户，但大多数人离银行太远了。结果，他们放弃了拥有账户。他们可能会访问互联网。因此这可以作为他们的银行，对吧？所以还有什么能阻止你呢？这对他们来说非常有用，而且许多人正在这样做。

