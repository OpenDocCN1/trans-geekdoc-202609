  trans: '

    此后不再需要银行了；尽管如此，由于我们需要对所拥有的东西格外用心，某些 IT 能力将帮助我们免受数字暴徒的侵害。当你发现保护自己的网络资产是如此简单时，你也会理解到这比开设账本要简单得多。


    通过这种方式，年轻化和前沿化的进展将加速探索加密货币世界最常见的方式。另一方面，某些个人可能需要熟悉最困难的方法，因为许多人在仅仅开始投入资源学习和执行安全措施后就遭到了黑客攻击。`Blockchain`
    的时代已经开启，它将改变世界。


    没有专业基础的普通人可能很难相信这一点，并且很可能会说 `blockchain` 本身并无用武处。尽管如此，编程工程师、安全专家、巨型金融机构、金融科技初创公司和银行目前已经表现出了明显的兴趣，并贡献了力量、制定了自己的规范。英特尔、微软、思科系统、戴尔等许多大型顶尖的创新公司现在都环绕着
    `blockchain` 及其错综复杂的细节。因此，日子正蓄积着迎接这场变革的巨大爆发，即未来的创新，或者我应该说，下一个网络！


    感谢你购买这本书。我希望这本书能让你对货币命运以及与人或机器一起进行 `Work` 的真实背景提供一些知识。虽然我本意是想避免在 `Blockchain`
    运作情况下会出现的大量技术术语，但这是一本高层次的指南，某些情况很难仅以这种方式表述。我即将出版的关于 `Bitcoin` 的书籍将提供关于如何安全可靠地投资这种高级黄金的最有效方法的更多细节。


    此外，我将讨论 `Cryptocurrency` 交易以及如何把握投资 `Bitcoin` 或或其他 `Cryptocurrency` 的最佳时机。我同样会指导你如何通过租赁硬件成为一名矿工，以及你如何利用你的电脑
    甚至你的 `Android` 手机开始挖掘数字货币。


    最后，如果你参与了这本书的内容，请花些时间分享你的感悟并发布评论。这将被视为弥足珍贵！

    '
