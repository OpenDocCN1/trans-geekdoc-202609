  trans: '


    首先，`Satoshi Nakamoto` 是 `bitcoin` 以及 `blockchain technology` 的创造者。尽管这是一个虚构的身份，但这就是他向互联网介绍自己的方式。这是一个男名。不过，`Satoshi
    Nakamoto` 是一个女性也是可能的。这是该领域最令人困惑的谜团之一。相反，大多数人并不想知道`他`是谁；然而，他们对他所创造的技术感激不尽。有一种常见的误解，认为
    `Satoshi Nakamoto` 自发明它们以来就一直拥有 `Bitcoin` 和 `blockchain technology`。由于他并不控制这些，所以`Satoshi
    Nakamoto` 的身份并不重要。


    ### 谜团依然存在

    但我们仍然想知道幕后人是谁，所以让我们重新思考一下。据我们所知，`Satoshi Nakamoto` 可能是一个男人，也可能是一个女性，是一对夫妇，甚至是一群女性。`Satoshi
    Nakamoto` 可能是一个由十人组成的小，也可能是一个由百人组成的群体。`Satoshi Nakamoto` 可能是一个幼儿，也可能是一位老人。最后，`Satoshi
    Nakamoto` 可能在发布 `white paper` 后不久就去世了，没有留下机会揭示他的真实身份。


    如果你听厌了这些指控，我理解，所以让我们用新的方式开始思考。`Satoshi Nakamoto` 可能根本不是人类。你可能认为这已经达到了极限。然而，奇怪的是，在过去的十年里，我们一直无法发现
    `Satoshi Nakamoto` 是谁；他住在哪里，但他是谁——老实说——我们毫无绪。也许有人能认出他。


    ### 文化影响

    我一直喜欢看科幻电影，最近我发现了一部名为《Arrival》的电影。这些经典电影在今天仍然具有意义。例如，过去，科幻小说描述了我们未来可能使用的某些产品或技术，以及我们已经使用了多年的其他技术。我不想探讨许多技术细节，但考虑一下：这只是一个想法，即某一天我们可能实现那样的。而现在我们每天都在使用
    `Skype` 和 `Facebook Video Chat`。


    数百万个人连接在一起，能够在 `Skype video chat` 上连续通话数小时。最初的 `iPhone` 是十年前在 2007 年开发并向公众发布的。从那时以后，我们看到了巨大的进步，而下一个十年将更加壮观。


    回到《Arrival》，我希望你已经看过了，而且它不会破坏你的任何体验。如果你还没有看过，你可能想跳过接几句话。在电影中，`Aliens` 访问了我们，通过提供对未来的预见来帮助人类。但再次，如果你还没有看这部电影，你可能会因此而鄙视我。


    电影的主题非常出色，所以它获得奥斯卡奖并不意外，尽管它本应该获得更多，但这仅仅是我的观点。当我想到这部科幻电影时，我想起了它与相同原理的相似性。我们从一个未知个体——或者，更准确地说，从一个未知的人那里获得了
    `Blockchain technology`。由于一个匿名来源，我们的世界将因此发生根本性的变化！我很好奇电影制作者是如何想出这个想法的……我不是说外面真的有
    `Aliens`，但我也无法说没有。我可以告诉你的是，这项技术让 `IT Professionals`、`Software Developers`、`Experienced
    Programmers` 甚至 `Cybersecurity Experts` 都着迷，它有时被称为 `ALIAN TECHNOLOGY`。区块链是巨大的，无疑需要几个月甚至几年才能完全理解它的复杂性以及它如何融入大局。另一个问题是，越越来越多的人声称这项技术太复杂，一个男人是无法创造的。因此，`Satoshi
    Nakamoto` 不可能独自完成这项工作。


    所以，让我们回到这个价值百万的问题：“谁是 Satoshi Nakamoto？”首先，让我们看看年来提出的某些说法，以便你做出自己的决定。你必须意识到，`Satoshi
    Nakamoto` 在 2009 年陷入了沉默，并在随后的五年里一直保持沉默，至少在他之前评论并一直活跃的论坛上是。


    ### 不是 Satoshi

    根据传说，当 `Bitcoin white paper` 发布时，`Satoshi Nakamoto` 年 41 岁。他是日本人。然而，为区块链产生的初始代码是用英语编写的，一个日本人是不可能写出那样的内容的。这意味着他雇佣或与一位英语流利的人合作创建了代码。


    2014 年，一些报纸开始报道关于 `Dorian Nakamoto` 的消息，他当时住在美国加利福尼亚。`Satoshi` 是 `Dorian` 出生时的名字。此外，额外的事实可能使他自称
    `Blockchain` 真实发明者的说法更有说服力。显然，第一个试图联系他的记者通过 `email` 询问他是否与 `bitcoin` 有任何关系。


    `Dorian` 的反应是：“我不再参与了，我无法处理这个问题。它已经交给了其他人。他们现在控制着一切。我不再有联系了。”这无疑引起了怀疑，记者们涌入了 `Dorian`
    在加利福尼亚的家。在意识到事情的严重性后，他再次阅读了他的 `email` 并试图解释自己。


    首先，他否认了与 `bitcoin` 的任何关联。事实上，他表示在他的儿子告诉他这个消息之前，他并不知道 `bitcoin` 是什么，在那个刻他在 `internet`
    上查了证。他还公开表示：“我与 `bitcoin` 没有关系。它与开发无关。我当时只是一个在做其他事情的工程师。如果你看 2001 年花费的时间，你会发现我并不在那儿。我是通过一家承包公司受政府雇佣的。我只认为那个虚构的名字是误插进去的。”


    还揭露了一些文件，表明他一直在为 `US Government` 以及 `US Military` 执行机密工作。他还签署了协议，规定他无法披露自己之前参与秘密项目的任何角色。在该事件发生后，在一个
    `P2P forum` 上出现了一条意料之外的消息，那个 `Real Satoshi Nakamoto` 在沉默五年后曾在那里发帖。“我不是 Dorian
    Nakamoto，”他说。


    ### Wright 的说法

    `Craig Wright` 是一位著名的澳大利亚商人，于 2015 年出现，成为 `Satoshi Nakamoto` 的下一个可能候选人。关于 `Craig
    Wright` 的文件开始向 `Wired magazine` 泄露。然而，大多数文件都提供了证据，暗示 `Craig Wright` 本人 `Satoshi`。`Craig`
    在其中一份文件中提到他考虑在 2008 年 8 月发布一份 `Cryptocurrency paper`。


    另一个泄露，这次来自 `Wired magazine`，是 `Craig Wright` 的另一个声明，但这次是 2009 年 1 月的。他写道 `bitcoin`
    将上线。第一笔 `bitcoin transaction` 发生在 2009 年 1 月。`Wired magazine` 还报告说收到了几封 `e-mails`
    和记录，证实了这种关系。


    '
- fmt: '

    This was another watershed moment, although many people remained skeptical. Craig
    posted on his blog two days later that he would finally share a series of posts
    to establish the groundwork for his astonishing claim. Craig has changed that
    post with the following instead of presenting evidence:


    "I''m sorry." I was sure that I could pull it off. I felt like I could leave my
    years of obscurity and hide behind me. But as this week''s events developed and
    I prepared to reveal the proof of access to the early keys, I broke. I''m lacking
    in bravery. I am unable to.


    When the rumors started, my credentials and character were attacked. Then, when
    those charges were found to be untrue, fresh claims arose.


    I am aware that this flaw will cause significant harm to individuals who have
    it.


    Jon Matonis and Gavin Andersen, in particular, helped me. I am only able to hope
    my acts do not permanently tarnish their honor and credibility.


    They were not duped, but I know the rest of the world would never accept it. I
    can only apologize.


    "And good-by."


    Craig has been labeled a liar by the bitcoin community since he has not offered
    any proof that he is the genuine Satoshi.


    Craig then performed yet another spectacular motion. He requested an interview
    with the BBC. He then revealed his identity as Satoshi Nakamoto, the inventor
    of bitcoin. Craig further indicated that he would not take any trophy or award
    for this innovation since he is not interested in money or anything else from
    anyone, and he surely does not need anyone''s support.


    When the reporter asked him why he had been hiding for so long and how he had
    only now revealed himself, he had a relatively straightforward explanation.


    Craig stated that he did not choose to approach the cameras since he has individuals
    that selected this for him; yet, he is unhappy with the current scenario because
    it will damage many of his friends and family and his staff members.


    The interviewer then asked him what he wanted from the notion of being the founder
    of Bitcoin, but he responded that he didn''t want anything, only to keep working
    on his projects. Craig said that just because he developed bitcoin or publicly
    published a paper for free to benefit people, it does not mean that he is obligated
    to do so in the future.


    That doesn''t mean he should become a well-known celebrity, and no one should
    push him to reveal what projects he''s working on. Then he went on to say that
    he was the driving force behind the invention of Bitcoin. He did, however, require
    assistance in finishing it.


    The reporter then said something that most people are interested in. As the creator
    of bitcoin, Craig must own 5% of every bitcoin preserved, which is a substantial
    sum of money. The value of bitcoin decreases whenever traders sell bitcoin for
    dollars. However, because the creator owns so much of it, there is concern that
    if the designer sells all of it when the price is high, the bitcoin would most
    likely fluctuate.


    So the reporter proceeded to question him how much bitcoin he possessed and how
    much he had deployed thus far. Craig just responded that it doesn''t matter how
    many he has; rather, what matters is when he would deploy them.


    Craig then concluded his statement by saying that he understands that some people
    will believe him while others will not, but he doesn''t care because he will never
    be on camera.


    The truth is that Craig is quite compelling, and I''m at a loss for words. I won''t
    pass judgment on him or Dorian, but the environment we live in is certainly odd.
    Consider that for a moment. We anticipate someone who denies any connection, but
    when we locate a man who admits to being him, we don''t believe him. Doesn''t
    it sound like we''ll never find out whom the actual Satoshi is?


    Craig has shown how he initiated the very first bitcoin transaction. But he only
    let one person view it, and that was a reporter with no technical background.
    The average techie is not convinced. Craig has stated that he has never wished
    to be photographed. Still, now that he''s done it—proven he''s the genuine Satoshi—he
    needs to back it up with proof that he conducted the first bitcoin transaction,
    and he has many options for how to do it. One proper method is to have someone,
    such as a bitcoin specialist, look at it and confirm that he is not lying. His
    approach is a little phony because no one can guarantee that he is who he claims
    to be 100 percent of the time.


    So, what exactly is the objective of all of this? Some have speculated that if
    Craig assumed the title of Satoshi, the actual Satoshi would send a message in
    some way allowing him to be located. However, unlike Dorian, there has been no
    more communication from the genuine Satoshi.


    Consider this: if you were one of the world''s wealthiest men in secret, what
    would you do?


    Would you go to the BBC and broadcast this to the entire world? Speaking to the
    World not only makes Craig popular among ordinary people, but it also puts him
    at risk of being attacked by cybercriminals and black hat hackers immediately
    soon. It''s so basic that anyone could grasp it right away. So, when you think
    of someone brilliant enough to develop a technology that will change, if not already
    has changed the world, don''t you think of hackers?


    As previously stated, most IT professionals are not convinced, so the question
    of which the real Satoshi Nakamoto is remained unanswered.


    Some believe Craig was the genius behind blockchain technology, while others believe
    Dorian was the genius. Nevertheless, most bitcoin community members are skeptical
    that they have anything to do with bitcoin or blockchain. There are numerous other
    possibilities as well, and I am going to explain a few of them.


    ## Nick Szabo


    According to sure researchers, a significant theory is that Nick Szabo writes
    the bitcoin white paper. In comparison to more than ten possible people involved
    in bitcoin''s creation, Szabo''s published writings were the closest linguistically
    to Satoshi Nakamoto''s original white paper.


    In addition to being a computer scientist, Nick Szabo is also an expert cryptographer
    and expert in Bitcoin. Furthermore, he is renowned for his talks on Blockchain
    technology, digital currencies, and smart contracts.


    These themes pique the curiosity of many individuals—particularly well-known speakers
    on the subject of Blockchain or bitcoin. However, few people know what some of
    these so-called specialists were up to before Bitcoin''s inception. In 1998, Nick
    Szabo came up with the concept of "Bit Gold," decentralized digital money. Isn''t
    it a strange coincidence? Nick had the concept, but he also devised a mechanism
    for Bit Gold and subsequently built it. Nick did not update his weblog daily.
    In reality, he had a reputation for not publishing anything; but, when bitcoin
    was launched in 2008—just two months after its formal release—Nick began to write
    more extensively about Bit Gold. There isn''t a lot of information on him. It
    is not much known about him. An excellent example is that Nick''s birth date has
    not even been verified by anyone yet; as a result, other curious individuals have
    begun to dig deeper into Nick.


    Nick Szabo was listed on Wikipedia as a law professor at George Washington University;
    however, the University had no record of anyone by that name. In other words,
    this has given rise to the possibility that Nick Szabo is not even his real name
    but instead his pen name.


    Since Nick does not have a verified age, education, location, or even previous
    work career, there is no evidence to prove that he is the father of bitcoin; therefore,
    he is the top candidate within the technology world.

    '
