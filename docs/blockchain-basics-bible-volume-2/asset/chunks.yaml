    由于本书将深入探讨人们不愿谈及的知识和细节元素，我假设你对区块链有基础了解。提到区块链时，就像任何其他既有技术一样，只有少数人对学习它是如何工作的感兴趣。因此，我祝贺你决定进一步追求你的热忱。大多数人仅仅对听音乐感兴趣，而从没有学过如何操作
    CD 播放器。当然，现在有了新的听音乐或有声书的方式。尽管如此，这是我一直最喜欢的例子之一，每当我准备向一个对我要说的话不的人解释任何事情时，我总会使用它。


    事实是，你不需要知道 CD 播放器是如何工作的，也不需要知道音乐是如何通过蓝牙技术无线传输到你的扬声器的。这没关系；但是，每当你学习一个新单词，你就会形成一个新的脑细胞，提高你的
    IQ，从而变得更加聪明。你还会减少丢失所有脑细胞的风险。据发现，一旦人年龄达到 30-40 岁，脑细胞就开始死亡，并在物理上消失，而且对此几乎无能为力。人类平均每十年流失
    5-10% 的脑力；然而，这取决于各种因素。不过，全球平均水平是 7%。无论发生什么，脑细胞都会死亡。


    然而，你可以通过学习新单词、新技能或对你大脑任何新颖事物来继续生长新的脑细胞。事实也证明，学习新语言可能会通过产生许多新脑细胞来提高你的 IQ。


    这种新语言是什么？你可以开始学习德语、意大利语或法语。然而，涉及到技术时，有许多语言要学习：`C+`、`C++`、`Python`、`SQL`、`JAVA`、`Pascal`、`PHP`
    以及数百种。你好奇和学习的每一分钟都将让你脱颖而出。


    本书将集中于区块链技术。尽管它相对新，但更深入的检查发现，允许区块链运行的底层技术在过去已经存在。我将详细介绍这些每种技术。


    我将深入探讨每种技术；由于区块链的发展，某些新协议必须在后面的章节中介绍。


    总的来说，你必须意识到区块链和比特币并不是同义词。区块链是一种在比特币网络上首次实现的技术。区块链是比特币的本质。然而，比特币仅仅是一种可能替代法定货币的加密货币。尽管如此，并不是每个人起初都能理解这一概念。


    区块链解决了一个我们一直存在的问题：信任。通过利用区块链技术，我们可以消除对可信赖第三方服务的依赖。结果，通过互联网进行的任何支付或交换将局限于两个人。


    这是革命性的，因为我们可以扩大信任鸿沟。结果，期货市场将更快、更廉价，且不受年龄、种族、性别、职业、国籍或任何其他限制。


    为了保存所有在区块链上注册过的条目，区块链使用了分布式账本系统。此外，工作量证明被用来支持记录（稍后会详细介绍）。


    矿工也起着关键作用，他们必须解决的最两个挑战是：


    1. 持续验证交易

    2. 为已存在的系统添加新价值


    个人或任何比特币公民都可以成为矿工，但随着时间的推移，出现了几家大型公司，例如 `Genesis Mining`，你可以作为个人加入并租赁他们的矿矿设施。


    多年来，许多其他矿工建立了矿池，许多人提供加入这些矿池。


    矿工加密区块，这需要大量的计算能力，并确保它们不会被简单复制。验证过程可以通过多种方式进行，取决于矿工。某些矿工可能使用不同的软件来加速身份验证过程，甚至创建自己的内部软件。他们使用什么程序没有区别，因为他们所有的工作都将通过验证。过程开始于矿工收集在网络上广播的交易，检查它们，最后将转账和活动的集合封装成一个新区块。


    对于添加到网络的每个封存区块，矿工将获得比特币作为奖励。每隔 10 分钟，就会构造一个新的区块。结果，每天会产生 144 个区块。如前所述，成功向区块链添加新区块的矿工将获得比特币奖励。


    从 2008 年到 2012 年，创建新区块的奖励是 50 个比特币。每隔四年，新区块的奖励减半；因此，从 2012 年到 2016 年，每个新区块的奖励为
    25 个比特币。


    自 2016 年以来，矿工向区块链添加一个新区块的奖励一直是 12.5 个比特币；然而，从 2020 年开始，将是 12.5 个比特币（在 2024 年之前，有
    6.25 个比特币可用）。


    # 对等网络


    为了保持区块链的运行需要一个运行在互联网上的组织。此外，在组织内部，有特定的更新。这些更新是必要的，以始终保持框架处于最新。假设你有一个电脑并在上面运行区块链，这对于该组织是至关重要的。这样，许多设备可以通过互联网相互通信并持续更新彼此。由于没有中心服务器或集中式服务器的特殊地位，相比之下，这种组织被称为对等组织。这种组织已经存在了很长时间。因此，对此没有任何意外的。在任何情况下，由于它没有中心服务器的任何类型，这种组织绝非统一的，而是去中心化的
    P2P 组织。这至关重要，因为这让你知道没有一个网络上的节点可以控制其他剩余的节点。

