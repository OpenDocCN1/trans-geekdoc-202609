    There is no physical presence of this currency since it only exists in a digital
    format. Therefore, there does seem to be some fluctuation in its value. It has,
    however, maintained a strong trend for a long time: in addition, it has steadily
    increased. For example, it was `0.05` dollars per bitcoin back in 2008 when the
    dollar started competing. Yet, one bitcoin has touched a record high value of
    `$2,912.00` in June 2017, its highest level to date. In the years since its creation,
    Bitcoin has demonstrated its ability to reach its peak repeatedly and increased
    in value above anything we have ever seen with any other form of currency.


    According to the currency exchange rate for bitcoin against the dollar for the
    past ten years, it has continued to grow. As long as bitcoins keep on increasing
    in value, especially around the four-year mark, I believe that will continue to
    happen. What makes me think that? You will just have to trust me.


    ## Do you know how many bitcoins there are?


    That''s a good question, and you can figure it out yourself. Depending on the
    date and time, you should read this book at the right time and the right place.
    Before calculating anything complicated, let''s look at some facts we are familiar
    with. On `October 31, 2008`, the first `50` bitcoins were created. Every 10 minutes
    after that, an additional `50` bitcoins were created. By 2016, bitcoin production
    had been reduced to half - `25` bitcoins were created every ten minutes. As of
    2016, the process has followed the same principles, meaning `12.5` bitcoins are
    created every 10 minutes until 2020. There will be 21 million bitcoins on the
    market by 2140 when this process is completed.


    ## Bad reputation


    For those unfamiliar with the Dark Web, let me give you a brief overview. The
    Dark Web is so fascinating that I could write a whole book about it in the future.
    But I am not attracted to online transactions involving drugs or guns. Just because
    it is a list of things I can purchase on the Dark Web doesn''t mean I will ever
    purchase anything from there.


    In essence, you need to understand that the Internet, in its current form, through
    search engines like `Google`, `Yahoo`, and `Bing`, isn''t the only one out there.
    `TOR`, another search engine, allows you to access the darknet, known as the darknet.
    `TOR` network is sometimes referred to as onion router or onion network. By hiding
    the end-user''s IP address, `TOR` makes what they do on the internet untraceable.


    The only thing your `ISP` knows is that you visited the `TOR` network, regardless
    of what website you visited. You could explore the site yourself and see what
    kind of services are available there, but that is entirely up to you. As you browse
    the dark web, you will encounter ugly services. I have been to the dark web before
    to get a feel for it. Lastly, I''m sorry to mention these, but I have seen simply
    disgusting things, and I do not recommend this to those who are easily upset.
    I am referring to the fact that the gun and drugs traders on `Tor` accept Bitcoin
    as a payment method. The `TOR` network and Bitcoin are untraceable. This makes
    the Dark Web an ideal hideout for criminals.


    ### Do criminals use Bitcoin as well?


    You bet they do. When they seek illegal goods or services online, they have little
    choice but to resort to illegal means. I encourage you to think about using bitcoin
    because criminals also use it before you close this book. Cryptocurrencies are
    not intended for criminals. There are 3 billion people worldwide who can be saved
    with bitcoin when it comes to financing. Bitcoin was designed for everyone, so
    don''t disregard those 3 billion people.


    ### Account hacking risks


    The second problem is that people have their bitcoin wallets emptied due to account
    hacking. Let me be clear. Rather than bitcoin itself, the hackers compromise end-user
    computers and mobile devices. The value of bitcoin has gone up immensely, and
    hackers are also becoming more educated. The hacking of Bitcoin accounts has changed
    their game, and they have realized that it is profitable and untraceable; therefore,
    why not do it? There is no need to worry about this issue anymore. If you decide
    to buy a wallet, just be sure that you always back it up and always have all the
    security features enabled. Fortunately, some security features like 2-step authentications
    don''t require much time or effort, but it''s better to be prepared than to assume
    that hackers won''t find you. People who have lost bitcoin accounts due to hacks
    have stopped trading or investing in bitcoin and other cryptocurrencies.


