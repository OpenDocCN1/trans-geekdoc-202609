    my experience right at the beginning of the recession in 2008 when I was working.
    The Lehman Brothers bankruptcy led to many more Banks and Financial Institutions
    choosing administration over bankruptcy protection. News channels were awash with
    stories about another large company losing all its assets, time and time again.
    Unemployment rose simultaneously, and then slowly, many people began losing their
    homes due to unpaid mortgage payments.


    Many small businesses needed to close. People were thinking twice before spending
    money in the restaurant, as there were fewer customers there. It was not just
    the US and UK that suffered from the financial crash, but many other countries
    that are still suffering from recessions. During that period, the housing price
    began to fall and finding a new job was difficult, especially since overqualified
    individuals applied everywhere. Job openings, however, were not sufficient to
    meet the growing demand; as a result, the market stagnated.


    The news, like most people, is manipulated a great deal and serves only to create
    fear and drama amongst hard-working people... I am not trying to harm any company''s
    image, but controlling the media is an excellent way to manipulate people, beliefs,
    and freedom by making people believe that the world is exactly what the media
    is providing, the use of media such as news channels and newspapers is indeed
    one of the best methods to create slaves. Just think about the number of people
    you meet on an average day. A few people, if not most, will tell you a story that
    begins, "Did you hear the news?"


    Of course, someone else will follow up with, "Where did you hear that?" The response
    will be something along the lines of, "I heard it on XYZ news station, or in the
    news, or read it in the XYZ newspaper." Everything is enormous news for a few
    days, sometimes weeks, and then it''s all forgotten. Why is this so? Surprisingly,
    around the same time, on an unfrequented internet forum, a document titled Bitcoin
    was uploaded to a cryptography mailing list on metzdown.com. A Peer-to-Peer Electronic
    Cash System was the subtitle.


    So, what exactly is it? It''s not from CNN, the BBC, NBC, CNBC, or any other news
    station. As a result, it must be gibberish, right? Yeah, it''s probably bogus
    news, and whatever it is, it appears too convoluted. As a result, it piqued no
    one''s curiosity. This white paper was released in October 2008, less than two
    months after the world''s largest financial catastrophe. The author identified
    himself as Satoshi Nakamoto and outlined a few facts about Bitcoin, new digital
    money. He added that he felt he had discovered a solution to the world''s most
    pressing problem, a technology known as the blockchain. He also demonstrated how
    it works and that it has already been developed and is functioning in software
    form on the existing internet.


    There are various opinions about what happened, and you may discover multiple
    answers regarding what transpired, the most crucial of which is—why now? How could
    such a significant paper be released so soon after the worst financial catastrophe
    in history? Of course, we could find out someday soon, but we may never know what
    sparked the birth of Blockchain technology.


    # The Inventor


    F irst and foremost, please realize that this book was written in the second quarter
    of 2017. Consequently, once you have finished reading this book, fresh light may
    have been shone on who Satoshi Nakamoto is.


    Let''s attempt to figure out who Satoshi Nakamoto is based on what we know right
    now.'
