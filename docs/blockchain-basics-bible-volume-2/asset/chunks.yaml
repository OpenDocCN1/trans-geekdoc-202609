    这种货币没有物理实体，因为它只以数字格式存在。因此，它的价值确实存在波动。然而，它长期以来保持着强劲的趋势：此外，它一直在不断增长。例如，在 2008 年美元开始竞争时，每个比特币的价格仅为
    `0.05` 美元。然而，在 2017 年 6 月，一个比特币曾触及 `$2,912.00` 的历史高点，这是其迄今的最高水平。自从诞生以来，比特币已经证明了它多次触峰的能力，其价值增幅超过了我们见过的任何其他形式的货币。


    根据过去十年比特币兑美元的汇率，它一直在持续增长。只要比特币的价值继续增加，特别是在每四年的节点左右，我相信这种情况会持续下去。我为什么会这么想呢？你只需要相信我。


    ## 你知道有多少个比特币吗？


    这是一个很好的问题，你可以自己算出来。根据日期和时间，你应该在正确的时间和正确的地点读这本书。在计算任何复杂的内容之前，让我们来看一些我们熟悉的实。`2008
    年 10 月 31 日`，第一批 `50` 个比特币被创造。此后每隔 10 分钟就会产生额外的 `50` 个比特币。到 2016 年，比特币的产量减少了一半——每
    10 分钟产生 `25` 个比特币。从 2016 年起，该过程遵循相同的原则，这意味着到 2020 年每 10 分钟产生 `12.5` 个比特币。当这一过程完成后，到
    2140 年市场上将有 2100 万个比特币。


    ## 坏名


    对于不熟悉暗网的人，让我给你们做一个简要介绍。暗网非常迷人，以至于我以后可以就它写一本书。但我对涉及药物或枪支的在线交易并不感兴趣。仅仅因为这是一份我可以在暗网上购买的清单，并不意味着我将会从那里购买任何东西。


    从本质上，你需要理解目前形式的互联网（通过 `Google`、`Yahoo` 和 `Bing` 等搜索引擎）并不是唯一的。`TOR` 是另一个搜索引擎，它允许你访问被称为暗网的
    darknet。`TOR` 网络有时被称为洋葱路由或洋葱网络。通过隐藏终端用户的 IP 地址，`TOR` 使他们在互联网上的行为变得无法追溯。


    你的 `ISP` 唯一知道的就是你访问了 `TOR` 网络，无论你访问了什么网站。你可以自己探索该网站并看看那里提供什么种的服务，但这完全取决于你。当你浏览暗网时，你会遇到一些糟糕的服务。我以前去过暗网以感受一下。最后，我很抱歉要提到这些，但我见过过非常令人作恶的东西，我不向那些容易情绪波动的人推荐这样做。我指的是
    `Tor` 上的枪支和毒品交易接受比特币作为支付方式。`TOR` 网络和比特币是不可追溯的。这使得暗网成为了犯罪分子的理想藏身处。


    ### 犯罪分子也使用比特币吗？


    那是肯定的。当他们在线寻找非法商品或服务时，他们除了采取非法手段别无选择。在你读合上这本书之前，我鼓励你考虑使用比特币，因为犯罪分子也在使用它。加密货币并不是为犯罪分子设计的。在融资方面，全球有
    30 亿人可以被比特币拯救。比特币是为每个人设计的，所以不要忽视那 30 亿人。


    ### 账户黑客风险


    第二个问题是人们由于账户被黑导致比特币钱包被清空。让我明确一下。与其说是比特币本身，不如说是黑客入侵了终端计算机和移动设备。比特币的价值大幅上升，黑客也变得越来越学识。对比特币账户的攻击改变了他们的游戏规则，他们意识到这样做是有利且不可追溯的；因此，为什么不这样做呢？没必要再担心这个问题了。如果你决定买一个钱包，请务必始终进行备份，并始终开启所有的安全功能。幸运的是，像双重身份验证这样的安全功能不需要花费太多时间或精力，但防患未缪总比认为黑客找不到你要好。因黑客丢失比特币账户的人已经停止了比特币和其他加密货币的交易或投资。


    ## WikiLeaks


    WikiLeaks 是一个组织……（文本已截断）


