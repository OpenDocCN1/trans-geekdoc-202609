    话如此，前向兼容性是指 1998 年版本的 Microsoft Word 适配没有经过重新设计，无论如何，它都会打开我们今天使用的存档，或者什么都没有，带有特定的目标。它很可能无法看到所有独特的内容，也可能无法看到部分亮点；尽管如此，它具有打开存档的选项。在这里，软分叉（delicate
    forks）具有前向兼容性，这意味着没有迁移到新代码的客户不会崩溃也不会离开，因此他们跟上当前的链。他们之所以批准是因为他们可能无法看到新功能；尽管如此，他们可以这样做。经检查，硬分叉（hard
    fork）意味着假设你不进行重新设计，你现在可以放弃某些区块，并且你现在离开了链的某些。


    ### 克服风险

    变化是持续的，特别是在考虑相似性时。如前所述，对框架的任何更改无疑都会产生影响。软分叉、硬分叉，它们都存在漏洞，尽管许多功能在测试网（Testnet）上不断进行测试。例如，测试网在执行之前运行了很长时间，在任何更改发生之前允许更多的尝试。挖掘者对任何更改都变得异常，并确保在执行前进行不同的测试。总体观点是，软分叉比硬分叉风险小。然而，某些人指出问题在于它们没有限制组织进行彻底改革，这意味着你可能会有很多老客户。尽管如此，有些设计师喜欢有更大程度的方法，并简单地相信只要你不重新设计，你就应该。


    ### 闪电网络

    闪电网络是一个二层组织，也被称为数据组织。它期望通过使用巧妙的协议将组织规模从每秒百万次交易扩展到数十亿次。例如，收款不是按月或按周，而是持续地。刷新，这不是吗？我确定你也会同样喜欢的！想象一下检查你的网络支付并看到它持续显示，每秒向你显示另一个金额。总的来说，我们为什么不看看这个想法是如何引入这个世界的。


    ### 交易所太慢了

    每月收款是荒谬的。每周收款要好得多；然而尽管如此，我也有过许多每天收款的情况。每天收款通常是我倾向的；尽管如此，我当时在一个资金基础上，它在任何地方都没有被记录；在这里，我无法代表那些日子。使用区块链，特别是闪电网络，可以让你同时收到付款，这被记录在永恒的账本中。


    作为代表，我接受这是一种极好的付款方法；尽管如此，请从业务角度考虑。想象你拥有一个使用大量人的组织。每个月人们都在分摊付款，确保每个人都能有效地收到付款。但是，在任何批准之前，它需要通过银行，诚实地说，需要许多银行才能让每个人收到付款。在这里，闪电网络将是每家企业的首选。


    既然你对区块链和比特币在闪电网络方面的运作已经有一些不错的信息，它稍微扭转了原理；让我来说明一下原因：我们意识到当我们发送比特币时，我们会广播交易，然后，我们需要等待确认，而确认只是以区块的形式定期出现。


    当区块形成后，它汇聚了许多交易并记录在账本上。尽管如此，假设你静静等待下一个确认，你需要信任下一个区块会被批准，这可能需要额外的 10 分钟。由于闪电网络剥离了当前框架顶部，使用替代层有其自己的支付层。


    ### 交易所费用高昂

    闪电网络保证交易无费用。再次，这是新的，本质上是因为每笔交易都有费用，这些费用有时比以前的交易大。费用是为了在交易列表中关注你的交易。你支付的费用越多，获得确认的速度越快。不支付费用似乎你可能永远不会被组织确认。


    ### 安排

    你应该从简单易懂的角度考虑它。想象当你去一家酒吧（Pub），服务员告诉你你需要支付现金，或者，假设你决定用卡支付，最低订单需要达到 5 美元。这是因为对于每笔交易，酒吧都需要向供应商支付特定的费用。尽管如此，假设你开了一个账单并只支付一次，最终会有一笔交易费用需要支付。


    当你在闪电网络上创建一个支付通道时，你需要存储特定数量的比特币。目前你正在通过将这些比特币交给组织来证明对这些比特币的所有权。它还支持多签名。框架有一种实现这些规则安排的方法；这样，你就不需要信任区块会被确认。当交易被宣布后，它是即时的；因此，你不需要延迟等到这些资产被支持。


    由于我们没有限制矿工将这些交易写入区块链，按照通常情况，你需要向矿工支付交易费用。这个框架允许你进行多次付款；尽管如此，你可能需要在需要的时候进行沟通。

