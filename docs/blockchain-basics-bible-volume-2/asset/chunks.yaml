    集中化组织的另一个问题是，一个中心节点准备将最底端的消息传递给组织的其余部分。首先，它需要将流量发送到专家节点或服务器，然后此时该服务器将有权执行许多操作。服务器可以在将流量发送到某些其他节点之前对其进行控制。处理流量对服务器节点来说是有好处的，因为当服务器从客户
    A 处获取流量时，服务器不会再向客户 A 发送类似的流量（因为无论如何，那里都是源头）。在其他相同的情况下，服务器会将流量发送给其他客户，但假设这种交换现在受到了控制，那么其他节点或客户
    A 都将永远无法查看它。另一个问题同样可能发生，万一服务器选择仅将流量发送给特定的客户群体，而不是给每一个人。再次，这可能会削弱广泛共享组织的力量，而且由于区块链的存在，这并不是一种益处。在统一组织中可能发生更遗憾的事情是：当节点获取到用于讨论的流量（即关于最新确认区块的信息）时，想象该节点选择不将此信息传递给另一个客户。这将导致区块链破产。通过这种方式，框架的主要运作方式是利用去中心化的
    P2P 组织。如果你不由得思考服务器如何自己做出这样的选择，事实上，它并不会这样做。尽管控制一个服务器或一小群服务器对于个人来说可能是直接，但对于 P2P
    组织而言，一个怀有恶意预期（如黑客攻击）或控制流量的个人将难以做到这一点，原因显而易见。在物理上管理一个遍布全球的巨大机器集群几乎是不可想象的。这就是为什么假设你需要建立一个组织并成为首脑的动力；你通过拥有一个你可以在需要时监控的专家节点来创建一个传统的公司化组织。再次，P2P
    网络没有首脑。因此，没有人可以责备，组织中的每台机器都承担着类似的义务。


    ## Timing


    在任何框架中，无论是集中的还是分散的，总是存在某些延迟。这被称为闲置。当一个设备到达另一个设备时，时间上永远是不相同的。闲置是信息在源点和最终目标之间传输时具有特征的时间。这是你可能需要理解的内容，因为信息的传播需要一些时间，特别是当去中心化框架上有许多节点时。


    我们应该观察一个模型以进行更好的安排。想象节点 A 准备将其最新的区块传递给节点 B、C 和 D。P2P 网络也被称为盲目组织，因为它们对正在移动什么类型的信息一无所知；它们只知道，一旦有信息需要跨组织移动，它们将进行传输，确保所有节点都获得相同的信息。回到我们关于四个节点及其信息传播的示例。想象节点
    A 位于美国洛杉矶；节点 B 位于澳大利亚悉；节点 C 位于南非开敦；节点 D 位于英国伦敦。


    它们将获得相同的信息；在任何情况下，某些节点可能比其他节点更快获得信息。沿此，交换请求可能会根据节点而异。


    简而言之，分布式组织实用的原因如下：


    *   通过不在不同节点间共享所有信息，而不是将所有内容保留在一个集中区域，来减少开销。

    *   降低信息重复和被控制的风险。

    *   减少外部阻碍；因此，每笔智能合约的交换都有更少的费用和更快的执行。


    ## Hashing


    这是大多数人在可能的情况下会直接跳过的另一个点，我并不能责怪他们。密码学的复杂性并不是大多数人梦想要了解的。存在许多类型的加密；尽管如此，我将尽力使其易于你理解。


    自古希腊和罗马人以来就使用了示例性的加密，甚至在埃及也是如此；然而，我们的重点是现代密码学，特别是与计算机相关的加密。在我进一步带你之前，让我详细阐述一些在进入密码学之前理解至关重要的基本术语。


    ### Hash


    哈希（Hashing）指的是一组良好的估计数字序列，例如 128、256、512、1024、2048 等数字。哈希可以在文本、图片、音频文件、视频文件甚至编程代码等文档上执行。它创建一个取决于特定文档的唯一哈希值。单个文档通过一侧进入哈希；然后它会在另一端以混合的形式输出。无论你尝试对什么类型的文档处理，结果都是唯一的。例如，你可能尝试对
    "blockchain" 进行 `md5` 哈希。该哈希值将与 "blockchain1" 完全不同。


    从根本上说，`MD5` 取代了 `MD4`。


    让我向你展示两个本质上相同的词之间有多大的区别。正如我提到的 "blockchain"，我将对其执行并创建一个 `md5` 哈希。好了，所以 "blockchain"
    的 `md5` 哈希是：`5510a843bc1b7acb9507a5f71de51b98`


    然而，现在，我将在 "blockchain1" 上执行相同的 `md5` 哈希。看看结果：`1150228f14788047028d774b7c83c56`


    如你所见，这是完全不同的东西；这是因为词是唯一的，尽管它们是相同的；它是另一个 `md5` 哈希。我们现在用数字来试试吧，为了方便起见，我将使用很少的数字，这样你就能看到哈希有多神奇。这次我将对数字字符串
    123 执行 `md5` 哈希，然后是对 124，并检查是否有任何差异。我们开始吧，好吗？好了，我已对数字字符串：123 执行了 `md5` 哈希，哈希值为：`202cb962ac59075b964b07152d234b70`


    现在我将对数字字符串 124 执行相同的 `md5` 哈希：


    `C8ffe9a587b126f152ed3d89a146b445`


    我能给你最接近的例子是指纹或 `DNS`。这些也很有趣，而且没有两个人的 `DNS` 或类似的特征标记。哈希已被广泛应用，主要由程序员们使用。主要原因之一是确保产品在下载过程中没有被更改或篡改。我以前在用另一个代码重新设计一个
    `Cisco Switch` 时遇到过问题，导致它进入了 `Romon` 模式，因为我太粗心，甚至没有检查产品的 `md5` 哈希值。幸运的是，我是在测试环境中操作而不是生产环境网络；尽管如此，这造成了巨大的痛苦，并花了几个小时才恢复到之前的设计。对于我的情况，我从正确的源下载了代码；但事实证明，我们的
    `Proxy` 服务器很可能在途中损坏了。

