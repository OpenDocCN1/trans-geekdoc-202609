    这至关重要，因为加法需要第三个块点；尽管如此，添加两个垂直焦点是一个不明确的策略。因此，这种结果导致所谓的 `Elliptic Identity`（椭圆恒等），也称为
    `Infinity`（无穷大）。此的理由在于，当你尝试相加两个垂直焦点时，永远不会有第三个捕获，而且你无法刻化该选项。


    然后，考虑再次添加一个高亮本身：


    假设你正在添加一个高亮，将没有后续的视角可以考虑，你也无法在它们之间定义一个边界。但是，在一切相等的情况下，你可以通过 `A` 定义边界，并找到它会在弯曲处何处阻塞。


    每当你完成该操作，它就与之前的系统相似，通过定义一个向上的边界，该线条捕捉了弯曲，而交叉点将找到点 `B`。注意，`B` 现在等于 `A + A`。


    这也被称为 `Point Doubling`（点倍增）。这无疑是完成众多事件的典型方法。这基本上也与另一种被称为 `square`（平方）的计算与不同的计算相同。如果你反复地进行点倍点，你正在做的是关于椭圆弯曲的增强。


    我们应该将其称为为 `2A` 并继续考虑我们需要确定 `3A` 的可能性。为了对倍倍 `A` 执行一些增加，你需要执行多次点乘法，这意味着多次将 `A` 与自身相加。


    首先，你需要定义 `2A` 和 `A` 之间的边界，以及该线条阻塞弯曲的任何地方，你像之前做的那样翻越 `x` 轴。显而易见，图上有大量的跳动，即使只执行几次重复。这种计算与平方重复计算相同。这就是
    `Elliptic Curve Cryptography`（椭圆曲线加密）变得直观的地方，因为要分离重复并找到一个与你增加的不同的特定点，在基于普通变量的数学中是不行的。


    例如，假设你被给予数字 `10`，有人说他增加了 `5` 给你得到数字 `10`，你会意识到倍增后的另一个数字将是 `2`。在任何情况下，在椭圆弯曲中都不是这样工作的。这被称为
    `elliptic bend discrete logarithm issue`（椭圆弯曲离散对数问题）。为了处理乘数点，你必须计算给定点的每一个乘积，直到你观察到匹配的那一个。这是荒谬的，特别是当你使用更大的数值时；因为该问题的计算复杂性。


    如果不麻烦的话，要完全理解 `Elliptic Curve Algorithm`（椭圆曲线算法）是什么可能本身就需要整本书，说实话，好几本书。尽管如此，我尝试对这种比特币以及区块链创新所使用的此类加密提供一个总体概述。目前，`Elliptic
    Curve Cryptography` 是今天最广泛使用的加密系统。然而，在使用椭圆弯曲密钥交换时，计算私钥在计算上是不可能的。


    ## Checksum（校验和）


    某些 ID 号包含了数字。其中一部分无法面向公众，例如财务余额号码。这些数字可以是被称为 `Checksum Digits`（校验位）的字符数量，用于在你输入错误的可识别证明号码时进行错误定位。


    我们应该看一个英国账账号，例如：


    `GB29 NWBK 6016 1331 9268 19`


    在这个模型中，两位数的校验值是 `29`。有一种特殊的计算应用于此账目以计算出这个校验值。例如，假设你通过编写以下内容写错了该记录号码：


    `GB29 NWBK 6016 1331 2968 19`


    任何英国银行应用程序都会看到这是一个错误，因为这个号码的校验值不符。


