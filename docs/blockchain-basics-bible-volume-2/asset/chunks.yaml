    # 在创建靓性地址时，只有公钥（比特币地址）是自定义的。私钥将保持随机。从原则上说，整个位置都可以自定义；尽管如此，要产生一个前缀超过 6 或 7 个字符的位置是不可行的。


    有几个网站可以为你制作靓性地址；无论如何，除非它们使用了“分拆密钥年龄联合技术”（split-key age joined），否则不要使用其中任何一个。这种功能是他们会创建一个公钥和私钥密钥对，你将公钥交给他们。然后，他们会用你的公钥创建一个靓性地址，这这也是另一个密钥对。利用这种方法，帮助创建另一个靓性地址的机构只会知道预期用于比特币的私钥的一部分。如果他们不使用这种方法，那么在那个时候可以想象这些机构有权夺取放在该位置上的任何比特币。


    关于靓性地址有几个大问题值得了解。例如，正如我所提到的，任何人都可以创建靓性地址，这很棒。然而，程序员——或任何抱有糟糕期望的人——也可能意识到现实并尝试利用它来获取自己的利益。例如，一个黑客程序员会做的事情确实非常直接：他们可以在他们的比特币地址中使用你真实的组织或礼物名称，并尝试通过模仿你或任何善意的业务来获取资产。另一个缺点是，生成更长的前缀可能需要花费大量时间一天。


