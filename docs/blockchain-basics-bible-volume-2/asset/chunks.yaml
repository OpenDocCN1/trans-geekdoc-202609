    假设有人需要查看这些细微差别，他们需要先向银行请求批准。一切都取决于进入背后的合理理由。在任何情况下，这里的重点是，这种传统的记录框架目前仍在类似的工作。有几种不同类型的记录框架；尽管如此，关于区块链卓越的记录框架，它并不是集中的。它依赖于分布式网络；因此，它是一个去中心化的记录框架。


    ### 分布式账本


    区块链平台并不使用集中的数据库；在同等的情况下，每个节点都拥有存储在分布式网络上的记录副本。加密形式货币（如比特币记录）仅在分布式账本中存储余额数据。尽管如此，不同的平台实际上可以存储其他数据。区块链平台，例如区块链，可以在分布式账本中存储任何数据。一些模型包括：


    * 身份数据

    * 患者数据

    * 真实遗嘱数据等等


    这种技术也被称为公共账本或无许可账本。当没有中心权威监督对账本的访问时，这种账本被称为公共账本，或者再次称为无许可账本。从根本上说，你或任何人都可以加入当前的分布式网络（显然是免费的），并获得任何时候在区块链上记录过的所有当前交易的副本。这可以追溯到
    2009 年 1 月，当时这个卓越的记录开始有趣的运行。显而易见，这与当前金融框架所提供的完全相反。


    ### 私有账本


    当有一个中心权威监督对账本的访问时，它在那时被称为私有账本，也称为许可账本。再次，这不是一个分布式网络，你需要向中心服务器请求授权以获取记录的副本。


    区块链记录被构想为一系列相互关联的方块（区块）。每个方块由一个包含元数据的头部组成，例如其前一个区块哈希、Merkle 根哈希和 `nonce`，随后是交易列表。最后，这些方块通过引用其每个父方块的哈希相互关联。


    ### 区块


    基础链中的所有方块都被编号，从数字 `0` 开始，然后是 `1`、`2`、`3`、`4`、`5` 等。所以绿色方块是第一个创建的主区块，也被称为起始区块，它的区块编号为
    `zero`。


    紫色方块是那些形成短链且无效链的区块，它们被称为区块链分叉。区块链分叉一直在发生。此外，这些侧分叉也被称为孤立分叉。


    考虑到一切，比特币区块是定期创建的；尽管如此，以太坊区块基本上像时钟一样设定。区块高度是链中方块的数量，起始区块的高度为 `1`。侧分叉上的区块可以与基础链上的方块具有相似的高度。分布式网络上的特定节点正在创建这些方块。这些节点被称为矿工。每个矿工都会收集个人在网络上发送的每个交易，并将有效的交易传输到不同的节点。每个矿工获取这些收集的活动并将其放在一个新创建的方块中。这些交易安排被编号为
    `tx0`、`tx1`、`tx2`、……、等等。`Tx` 代表交易，后面跟着数字。主交易（`tx0`）被称为 `coinbase` 交易。矿工向自己的地址发放区块奖励的交易。这就是比特币产生的方式。对于比特币矿工，在
    2017 年此时，区块奖励是 `12.5` 比特币；尽管如此，在起始区块时期，每个区块产生的奖励是 `50` 比特币。对于比特币，区块奖励每隔 `210,000`
    个方块划分一次。在经过 `64` 次减半后，奖励将变为零。例如，其他交易 `tx1` 或 `tx2` 是比特币从所有者地址转移到受益人地址的交易。每个交易都需要少量的交易费用。这种费用将继续增加，作为矿工的动力。


    当矿工开发区块后，他应该对他的交易列表应用一个哈希。首先解决哈希问题的矿工被允许在网络上广播他的区块。这对于任何需要它的人来说都是可见的。其他矿工将获得这个区块，并将其添加到自己的链中。


    当这种情况发生时，会产生临时分叉。例如，分叉 A 和分叉 B。假设网络上 `70 %` 的矿工正在挖掘分叉 A，其余矿工在处理分叉 B。在这种模型中，分叉
    A 成为基础链，因为它包含了从起始区块的最长序列。因此，矿工应该一直挖掘长链。在这种模型下，分叉 B 上的区块将成为孤立区块。


