  trans: '

    区块链工程师的薪非常优厚；在英国，一个极具经验的区块链设计师的年薪从 8 万到 15 万英镑不等，甚至每年达到 30 万英镑，而且我讨论的是英镑，而不是美元。问题在于，只有少数人理解区块链，因为所需的详细信息可能让人应接不暇，而且对所有人来说并不是最好的选择。掌握关于
    `C++`、`SQL` 或 `Python` 的信息可能极具价值，如果你热于学习这些编程语言，它将会有回报。二十年前，每个人都认同 IT 是未来，而大多数未来的职位都需要掌握此类技能。拥有一些
    IT 基础无疑是极好的，特别是当你打算转身投入这一行业时；尽管如此，让我们简要解释一下。掌握 IT 技能意味着许多事情；你应该明确目标并并在这些方面进行练习。


    毫不夸张地说，我可以说未来大发展的职位将是程序员，或者更准确地说，是区块链设计师。从哪里开始呢？找一个针对初者的 `Python` 编程在线课程，配合一本参考书。然而，在我开始关于编程能力的完全不同的话题之前，让我稍微澄清一下当前区块链工程师在测试目的下使用的环境。


    ### 测试网 (Testnet)


    `testnet` 是工程师用于测试目的的备用区块链。在 `testnet` 上挖出的加密货币（也称为 `testnet coins`）没有真实价值。`testnet`
    为工程师提供了一个沙箱环境，用于分析，而无需使用真实的加密货币或担心破坏基础链。基础链也被称为 `mainnet`（主网）。如果你正在考虑挖掘 `bitcoin`，这就是。你可以通过建立你的
    `Bitcoin` 或 `Ethereum` 节点来快速挖掘你的 `Bitcoin` 或 `Ethereum` 测试网币。


    `testnet` 上的矿工较少，哈希难度也足够低，更容易找到简单的解决方案来解决哈希难题——而且还能获得区块奖励。然而，`mainnet` 和 `testnet`
    是两个独立的组织，无法将币从一个阶段发送到另一个阶段，反之亦然。要挖掘 `Bitcoin testnet`，你需要生成一个不同的 `testnet Bitcoin
    address`。`Bitcoin testnet address` 始终以字母 `m` 或 `n` 开头。`Bitcoin testnet address`
    不会影响 `mainnet`。


    尽管如此，对于 `Ethereum` 来说，`testnet` 和 `mainnet` 没有区别。然而，类似的地址将属于两个组织：`testnet` 和 `mainnet`。就此，你必须非常小心不要将它们混淆。


    ### 水龙头 (Faucets)


    获取 `testnet coins` 的另一种方法是寻找 `Bitcoin fixture` 或 `Ethereum spigot`。`fixture` 是一个根据你的位置提供有限数量
    `testnet coins` 的网站，作为是你完成该网站描述的任务的回。你可以毫不夸张地在谷歌上搜索 `Bitcoin fixture` 和 `blockchain
    spigot`。


    ### SegWit (分离见证)


    #### SegWit 概述

    既然我刚刚澄清了一些工程师使用的测试工具，我们来看看还有什么东西需要真实区块链网络的支持。`SegWit` 代表 `Segregated Witness`（分离见证）。`SegWit`
    有许多种解释方式。然而，其专业细节对某些人可能非常困惑；因此，我将尝试在深入研究之前简单地解释。


    `SegWit` 是区块链网络的一项更改；具体来说，它是区块内部的更改。我是一个组织专家，很容易说，在选择实施某项改进（特别是在开发环境内部）时，是因为有一个问题需要处理。目前区块的问题非常简单。每个区块可以处理
    `1MB` 的信息，这意味着所有的交易细节。


    一旦区块内有了足够的信息，区块就会被固定，矿工开始创建另一个新区块。需要处理的问题是，每个区块都被某些信息填满了；然而，毫无疑问，已经确定每个区块应该包含更多信息。我之前解释过每个区块包含数据包；说实话，每笔交易细节都记录在区块链上，具体是在区块内部。记录的信息是区块号、目标位置、源地址、交易价值、哈希计算等。记录的最主要数据是包含数字签名和公共密钥的实际内容。要让区块在分布式账本网络上通过验证，这些区块链规则的片段必须包含在内容之中。然而，已经确定目前的状况是在萎缩系统，需要进行重新设计。这个扩展性问题本应该被处理；就此，区块链设计师想出了一个主意。


    #### 方案

    该方案被称为 `SegWit`。尽管如此，实施 `SegWit` 的真实方案是从区块中移除内容，使区块变得轻量；这样为额外的交易留出更多空间，并加速系统运行。尽管如此，该提议有一个潜在的副作用。内容仍然是需要的，因为区块链规则无法更改；因此，该提议的一部分是，还有一个旧区块将包含这些内容。这对于某些人来说非常困惑，特别是对于那些没有专业背景的人来说。


    例如，假设你使用价值 `$100` 的 `Bitcoin` 进行支付，交易费用可能花费你大约 `$0.30` 美。然而，当你需要从附近的咖啡店买一杯 1 美元的咖啡时，`0.30`
    的交易费可能就太贵了。就此，已经明确了这一点：如果我们能在每个区块中添加更多交易，比如增加一倍，这意味着每笔交易的成本将是目前的一半。然而，为了在区块中容纳更多交易，必须移除某些东西。发现是内容可以重新组合并添加到第一个区块的旧区块中，这被称为
    `Segregated Witness`（分离见证），又即 `SegWit`。

