    - 区块链的优缺点

    - 区块链的能力

    - 结论


    # 引言


    本书为初学者理解区块链技术提供了一份极佳的指南。熟悉这项技术的读者如果避开技术细节，可以更好地理解其内容。然而，如果你具有某些 IT 背景，某些术语将更容易理解。不过，这并非必须的。本书使用日常英语编写以避免混淆，它将引导你一步步了解数字货币创建的整个过程。


    我们的目标是通过追溯历史并总结金融史，理解是什么导致了我们当前社会中几种加密货币的诞生。随后，我们将探讨比特币发明的初衷及其理论。随着讨论的进行，我们应该回顾一些区块链之父的候选者。讨论的后续部分将介绍什么是分布式账本以及它是如何工作的。之后将介绍矿工及其职责以及他们是谁。然后它将讨论区块是如何创建的，最后它们是如何汇聚成被称为区块链的链的。


    我们将在最后章节中详细讨论我们在区块链上实施的安全措施。此外，通过研究这项技术的目的和未来银行系统，我们将尝试理解现状。


    # 区块链简览


    本书为初学者理解区块链技术提供了一份极佳的指南。熟悉这项技术的读者如果避开技术细节，可以更好地理解其内容。然而，如果你具有某些 IT 背景，某些术语将更容易理解。不过，这并非必须的。本书使用日常英语编写以避免混淆，它将引导你一步步了解数字货币创建的整个过程。


    我们的目标是通过追溯历史并总结金融史，理解是什么导致了我们当前社会中几种加密货币的诞生。随后，我们将探讨比特币发明的初衷及其理论。随着讨论的进行，我们应该回顾一些区块链之父的候选者。讨论的后续部分将介绍什么是分布式账本以及它是如何工作的。之后将介绍矿工及其职责以及他们是谁。然后它将讨论区块是如何创建的，最后它们是如何汇聚成被称为区块链的链的。


    我们将在最后章节中详细讨论我们在区块链上实施的安全措施。此外，通过研究这项技术的目的和未来银行系统，我们将尝试理解现状。


    # 历史中的金融


    本节侧重于通过创新来理解我们的存在。让我们回到数百年前，看看我们发现了什么。


    由于交易是我们食物链中的基础组成部分，它一直存在于我们的生活中，并且可能永远不会消失。


