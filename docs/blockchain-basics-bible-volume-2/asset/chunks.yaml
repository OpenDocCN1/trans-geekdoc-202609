  trans: '

    虽然在预算摘要审查中，确认交易事项是一个结构性区块，但这仅仅是其重要角度之一。审计包括一项评估，即记录的交易是否得到了适用证明的稳固、无偏、精确且显而易见的支持。将交易记录在稳健的区块链中，可能为特定的财务报告报述提供充分合理的审计证据（例如，记录在区块链上的资源已从供应商转移到买方）。例如，在用比特币换取某项物品时，该比特币交易被记录在区块链上。在任何情况下，检查员理论上可能都有权通过专门评估比特币区块链上的数据来决定所转让的物品。与此，在区块链中记录交易可能会提供与交易理念相关的充分合理的审计证据。任何情况下，记录在区块链中的交易可能是：


    * 未经批准的、欺诈的或非法的

    * 在关联方之间执行

    * 与“链外”侧边协议相关

    * 在财务摘要中表述不准确


    此外，财务报告中记录的许多交易反映了与可核实支出相反的评估值。无论基础交易是否记录在区块链中，审计师无论都必须考虑并对管理层的评估执行审计策略。


    无边界的区块链接收可能使用重点领域获取审计信息，CPA 审计师可能会制定策略直接从区块链获取审计证据。尽管如此，无论何时，对于此类交易，CPA 审查员需要考虑数据因错误或欺诈而错误的风险。这将引入新的困难，因为区块链可能不受受评估因素的限制。因此，CPA
    审查员应该从区块链中提取信息并考虑其是否稳固。这一循环可能包括考虑与区块链环境相关的通用信息技术控制（`GITCs`）。它还可能要求 CPA 检查理解并评估特定区块链协议规范的可靠性。这种评估可能必须包含该规范是否可以控制的想法。


    随着越来越多的机构研究私有或公共区块链，CPA 审计师应该了解这作为财务报告另一个数据源对其审计产生的潜在影响。他们还必须评估管理层对先进资产和负债的会计安排，这些目前在国际财务报告准则或美国通用会计原则尚未直接处理。最后，他们应该考虑如何调整审计技术以利用区块链优势来应对持续风险。


    ## 区块链审计轨迹会在我们不久的未来出现？


    关于区块链如何影响审计和确认函，有许多问题，包括其执行速度。目前，区块链正在影响那些使用区块链记录交易的机构的 CPA 审计师，接收速度预计将继续扩大。然而，区块链技术短期内不会取代财务报告和财务摘要审计。财务报告反映了管理层的陈述，包括估计，其中许多无法在区块链中被轻易汇总或确定。


    此外，财务报告的独立审计提高了资本市场部门框架有效运行所需的信任。这种信任的任何崩溃都可能损害实体的声誉、股价和投资者价值，并导致罚款、处罚或资源损失。财务报告的客户预计
    CPA 审计师应利用他们的专业怀疑对预算报告进行独立审计。CPA 审计师得出他们是否已获得合理的确认，即某实体的财务报表总体而言没有重大性错述，无论是因为欺诈还是错误。区块链可能不会取代财务报告审查员来做出这些决定。


    CPA 审计师需要筛选区块链技术的进展——它将影响客户的数据技术框架。因此，CPA 审计师应该熟悉区块链技术的基础，并与专家合作审查与区块链相关的复杂的专业风险。


    此外，CPA 审计师应当了解利用其客户对区块链技术的接收来进一步开发审计期间数据收集的权利。他们还应该考虑区块链技术是否允许他们创建自动化的审计计划。评估工作应该拥抱并“投入”不可避免的区块链接收带来的机遇和挑战。CPA
    审计师和确认供应商敦促筛选区块链技术的进步，因为他们有机会开发、学习并从他们能够适应快速变化的业务世界所需的全面证明能力中获益。


    ## 结论


    我希望你已经对区块链归属的内容以及该框架有多复杂有了初步了解。我将在几秒钟后写另一本书，更深入地解释比特币以及如何安全可靠地做出贡献。


    总来说，你需要理解的是区块链和比特币不是同一种东西。区块链是一种技术，它的首次应用是在名为比特币的舞台。比特币是区块链。然而，比特币本身只是一种适用于替代政府发行货币的加密货币。并不是许多人从一开始就喜欢这个想法。区块链解决了我们一直面临的问题：信任，利用椭圆曲线加密法和大量的计算能力。利用区块链技术允许我们通过提供先进的标记和数字计算来避免信任外部机构。通过这种方式，互联网上的任何支付或交易都将在特定的两个实体之间进行。

    '
