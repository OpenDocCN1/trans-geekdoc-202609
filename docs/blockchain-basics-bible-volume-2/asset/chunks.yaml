  trans: '

    每当他被问及是否与 `Bitcoin` 有关，据报道他总是否认，并且已经沉默很长时间。遗憾的是，媒体中充斥着大量虚假、捏造的新闻，简直令人难以置信。在 21
    世纪初，互联网是唯一的合法新闻来源；然而，现在大多数出版物已迁移到在线，发现真相需要付出巨大的努力。也就是说，大多数不断寻找真相的人——我指的是那些只研究技术的
    IT 专业人士——并不阅读报纸或虚假新闻频道。当一项技术发明被发布时，例如 `blockchain`，这些技术极客们会痴迷于寻找究竟是谁创造了它，并会开始研究直到发现真相。科技大师们之间的共识似乎是，尼克·萨博（Nick
    Szabo）是 `bitcoin` 的真正创造者。


    之前，我提到过关于 `Blockchain` 技术之父可能候选人有很多假设。当然，答案取决于你问的是谁；但是，我想介绍一些可能在创建 `bitcoin` 中起过作用的主要人物。


    ## 团队合作


    由于其复杂性，人们普遍认为 `blockchain` 可能涉及许多人物，而不是某一个特定的个人。当被问及这个问题时，克雷格（Craig）表示他得到过一些帮助。然而，负责人是他本人。因此，许多人开始相信这可能不是克雷格，而是中本聪（Satoshi
    Nakamoto），这代表的是一个群体而不是一个个人的名字。


    这三个词的日语分别是 Satoshi、`Naka` 和 `Moto`。`Satoshi` 的意思是思维清晰或智慧，`Naka` 的意思是内部。这三个单词可以用许多不同的方式组合。最常见的方式之一是团队或个人说类似的话：我从内到外完全理解了这个系统。你可以用“我们”代替“我”。但
    `Blockchain` 并非偶然。为了创造这项技术，我们需要清晰的思维、充分理解其每一个方面的能力，最后，`Blockchain` 是一个巨大的基石。


    由于 `Blockchain` 的结构，相反的思考者相信想法是由一个人构思的。因此，让一个团队一起思考并创造类似的东西，其深度可能不够。例如，我指的不是普通的技术人员，而是一个自互联网婴儿时期起就在工作的软件开发者。另一个例子是，我想起了尼克·萨博（Nick
    Szabo），而不是一个富有的澳大利亚人或一个长期没有参与任何事务的老年日本人。


    在我们结束这一章时，我留给你的想象力去决定中本聪是谁。然而，正如我之前提到的，这可能完全取决于阅读这本书的日期；但现在，在 `Blockchain` 技术发明近十年后，我们仍然没有证明中本聪
    100% 是他所声称的身份。


    ## 基于区块链的分布式账本


    这是一本写给新者的手册。因此，我将尝试用尽可能少的专业术语来描述账本系统。首先，将账本系统想象成一个家族树；但是，存储的不是名字，巨大的账本系统存储的是关于支付金额和地址的信息。账本存储了所有追溯到第一笔交易的美元金额的支付记录。在涉及地址时，没有
    `URLs` 或地理地址。相反，它们是 `bitcoin` 地址或任何其他加密货币的地址。账本跟踪所有的加密货币交易。


    此外，之前的转账当前价值会被不断计算。分配给每笔交易的价值由账本的一部分表示，而账本的其他部分则代表每笔交易的日期和时间。这与任何现行的银行系统非常相似。


    你可以看到谁在何时转了哪个账户，以及每笔交易花费了多少；尽管如此，账本里并没有银行。此外，地址并不代表个人的身份，也没有指示谁拥有什么。


    因此，这可能被称为匿名账本系统。你应该知道，如果一个人没有亲属，银行有权没收其银行账户。


    除了银行之外，任何政府机构（包括警察、`FBI` 或其他政府机构）在发现有效理由时都可以没收任何银行账户。在巨大的账本，唯一可以访问 `bitcoin` 账户的个人是持有该账户密码的人。


    当然，这是有的；如果你忘记了 `bitcoin` 钱包的密码，账本的价值将永远丢失。如果你忘记了银行账户密码，你可以联系银行，他们会问你安全问题，你确认自己是账户主；银行会给你访问权限。然而，如果你有一个
    `bitcoin` 账户，没有任何银行会协助你访问它。因为账本是完全去中心化的，任何人都可以查看。


    因此，每个人都可以查看你的 `bitcoin` 账户以及该钱包中的价值。然而，没有人能确定该账户与你有关。


    由于 `blockchain` 技术，每笔交易都经过验证并放入区块中；每个区块都加入之前验证过的区块。最终，它们共同创建了一条 `blockchain` 链。每个
    `bitcoin` 公民都需要保留一份 `blockchain` 的副本，在系统创建一个区块后，每个区块链成员都会收到一个完成的封存区块。


    系统随后会自动验证每个区块并将每个区块分配给每个公民。这就是 `blockchain` 如何存储曾经发生过的每笔交易和价值。在不需要中央权威的情况下，这些解决方案确保了每笔交易的真实性和准确性。


    如果这一切对你来说很陌生，请记住系统会为你处理一切，而你作为一名 `bitcoin` 公民，不需要自己进行计算，反正那也需要很长时间。


    矿工负责在交易经过验证后将其密封到账本中。每个新验证的区块都必须添加到公民的 `blockchain` 中；然而，在接受新区块之前，每个人必须检查新区块中所有的逻辑连续性，以确保所有成本转账合法。这防止了黑客或恶意意图的人复制或伪造交易。


    尝试窃取 `bitcoin` 或任何其他加密货币是非法的。由于验证结果将永久存储在巨大的账本和 `blockchain` 中。


    为了竞争，使用了哈希（`hashes`），同时也用于验证每个区块并确保每个公民收到相同的记录。


    我希望包含关于账本如何分布及其验证程序的细节没有误导你。事实上，每个验证步骤在技术上都是通过组合过程完成的。你应该意识到每秒都有数千次操作。


    ## 矿工


    让我们从考虑价值是如何进入系统的。中本聪（Satoshi Nakamoto）仅在 2008 年产生了 5 万个比特币以开始这一过程。如果他从一开始就创建了全部
    2100 万个，比特币将一文不值，这个概念也将是荒谬的。相反，中本聪是从创建少量的 `bitcoin` 开始的。

