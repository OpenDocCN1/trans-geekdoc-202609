  trans: '


    这是另一个转折点时刻，尽管许多人仍然持有怀疑态度。Craig 在两天后在他的博客上发帖，称他将最终分享一系列文章，为他令人震惊的主张奠定基础。Craig 更改了那篇帖子，取而代之的是而非提供证据：


    “对不起。”我曾确信自己可以做到的。我觉得自己可以把多年的孤寂无名抛在身后。但随着本周事件的发展，当我准备好揭示访问早期密钥的证明时，我崩溃了。我缺乏勇气。我做不到。


    当传闻开始时，我的资历和品格遭到了攻击。然后，当那些指控被证明是不实的时，新的指控又接之而生。


    我意识到这种缺陷会给有这种缺陷的人造成巨大的伤害。


    Jon Matonis 和 Gavin Andersen 特别地帮助了我。我只希望我的行为不会永久地损害他们的名誉和信誉。


    他们没有被愚骗，但我知道世界上其他地方永远不会接受这一点。我只能道歉。


    “并再见。”


    由于 Craig 没有提供任何证明自己是真实 Satoshi 的证据，比特币社区一直把他标记为骗子。


    Craig 随后又进行了一个壮观的动作。他请求接受 BBC 的采访。随后他揭露了自己的身份——比特币的发明者 Satoshi Nakamoto。Craig
    进一步表示，他不会为这项发明接受任何奖杯或奖励，因为他对金钱或来自任何人的任何东西都不感兴趣，而且他也不需要任何人的支持。


    当记者问他为什么隐藏了这么久，以及为什么现在才揭露自己时，他有一个相当直接的解释。


    Craig 表示，他没有选择面对镜头，因为有个人为他做了这个决定；但他对现状感到不愉快，因为这将损害他的许多朋友、家人和员工。


    采访者随后问他，对于“比特币创始人”这一身份他想要什么，但他回答说他什么都不要，只想继续研究他的项目。Craig 说，仅仅因为他开发了比特币或为了造福人类免费发表了一篇论文，并不意味着他未来有义务这样做。


    这并不意味着他应该成为一个名人，也不应该任何人迫他透露他正在研究的项目。接着他继续说，他是发明比特币背后的推动力量。然而，他在完成这项工作确实需要帮助。


    记者随后说了一个大多数人都感兴趣的问题。作为比特币的创造者，Craig 必须拥有每个保留比特币的 5%，这是一笔巨款。每当交易者将比特币卖成美元时，比特币的价值就会下降。然而，由于创造者拥有大量的比特币，人们担心如果设计师在价格高位卖出所有比特币，比特币很可能会产生波动。


    于是记者接着提问他拥有多少比特币以及到目前为止部署了多少。Craig 回答说，他拥有多少并不重要；重要的是他何时部署它们。


    Craig 随后总结了他的陈述，表示他理解一些人会相信他而另一些人则不会，但他不在乎，因为他永远不会出现在镜头前。


    事实是，Craig 很有说服力，我无言以对。我不会对他或 Dorian 做出评判，但我们所处的环境确实很奇怪。考虑一下。我们预感到一个否认任何联系的人，但当我们找到一个承认自己就是他的人时，我们却不相信他。这听起来不像我们永远无法发现真正的
    Satoshi 是谁吗？


    Craig 展示了他如何发起第一笔比特币交易的。但他只让一个人看过了，而那是一个没有技术背景的记者。普通的技术人员并不信服。Craig 表示他从未想过被拍照。尽管如此，既然他已经做到了——证明了他是真实的
    Satoshi——他就需要用他执行过第一笔比特币交易的证明来支撑，他有很多方法可以做到。一种正确的方法是让某人（例如比特币专家）查看并确认他没有撒谎。他的方法有点虚假，因为没有人能保证他在
    100% 的时间内都是他所声称的身份。


    那么，这一切的目的究竟是什么？有些人推测，如果 Craig 接受了 Satoshi 的头衔，真正的 Satoshi 会以某种方式发送信息，让他被发现。然而，与
    Dorian 不同，真正的 Satoshi 没有再进行过交流。


    考虑一下：如果你是暗中世界上最富有的男士之一，你会做什么？


    你会去 BBC 向整个世界广播这个吗？向世界说话不仅让 Craig 在普通人中变得流行，还让他立即面临被网络犯罪分子和黑客客攻击的风险。这太基础了，任何人都能立刻理解。所以，当你想到一个足够聪明的人开发出将改变（如果还没有改变）世界的技术时，你难道没有想到黑客吗？


    如前所述，大多数 IT 专业人员并不信服，因此关于谁才是真正的 Satoshi Nakamoto 的问题仍然悬而未决。


    有些人认为 Craig 是区块链技术背后的天才，而另一些人认为 Dorian 是天才。尽管如此，大多数比特币社区成员怀疑他们与比特币或区块链有任何关系。还有许多其他可能性，我解释其中一些。


    ## Nick Szabo


    根据某些研究人员的说法，一个重要的理论是 Nick Szabo 编写了比特币白皮书。与参与比特币创造的十多个可能的人相比，Szabo 发表的著作在语言上与
    Satoshi Nakamoto 的原始白皮书最接近。


    除了是计算机科学家，Nick Szabo 还是一名密码学家和比特币专家。此外，他在区块链技术、数字货币和智能合约方面闻名。


    '
- fmt: '

    Whenever he has been questioned if he has anything to do with `Bitcoin`, he has
    reportedly always denied it, and he has been silent for a long now. Unfortunately,
    there is so much bogus, made-up news in the media that it''s almost incredible.
    The internet was the sole legitimate source of news at the beginning of the twenty-first
    century; however, now that most publications have migrated online, it takes a
    great amount of effort to discover the truth. That is to say, most people who
    are constantly looking for the truth, and I am referring to IT professionals who
    just study technology, do not read newspapers or false news channels. When a technological
    invention is announced, such as the `blockchain`, these nerds become obsessed
    with finding out who exactly created it, and they begin to research until they
    find out the truth. The consensus among tech gurus appears to be that Nick Szabo
    is the real creator of `bitcoin`.


    Previously, I mentioned that there are many assumptions about possible candidates
    for the father of `Blockchain` technology. Of course, the answer will vary depending
    on who you ask; however, I wanted to introduce some of the main characters who
    may have had some role in creating `bitcoin`.


    ## Teamwork


    Due to its complexity, there is a general belief that `blockchain` may have involved
    many characters rather than one specific individual. When asked about it, Craig
    said that he had some help. However, the main person in charge was him. Therefore,
    many have begun to believe it may not be Craig, but rather Satoshi Nakamoto, who
    represents a group of individuals rather than an individual''s name.


    Japanese names for the three words are Satoshi, `Naka`, and `Moto`. `Satoshi`
    means clear thinking or wisdom, and `Naka` means inside. It is possible to combine
    these three words in many different ways. One of the most common is when the team,
    or the individual, says something like: I understand this system completely from
    the inside out. You could substitute us instead of I. But `Blockchain` is no accident.
    For this technology to be created, we needed clear thinking, the ability to fully
    understand every aspect of it, and finally, `Blockchain` is a large foundation.


    Because of the `Blockchain`''s structure, the opposite thinkers are confident
    that one person conceived the idea. Therefore, having a team of people think together,
    creating something similar, would not be as in-depth. For example, rather than
    the average techie, I am talking about a group of people who have been working
    on the internet since its infancy and are software developers. As another example,
    Nick Szabo comes to mind, not a wealthy Australian or an older Japanese who hasn''t
    been involved in anything for a long time.


    As we close this chapter, I leave it to your imagination to decide who Satoshi
    Nakamoto is. Yet, as I mentioned earlier, it may all depend on the date when the
    book was read; but for now, nearly a decade after the invention of `Blockchain`
    technology, we still have no proof that Satoshi is 100% who he claims to be.


    ## Blockchain-Based Distributed Ledger


    This is a handbook for newcomers. As a result, I will try my best to describe
    the ledger system in as few technical terms as possible. First, consider the ledger
    system as a family tree; however, instead of names, the massive ledger system
    stores information about payment amounts and addresses. The ledger stores all
    payment records dating back to the first transaction ever made in terms of dollar
    amounts. There are no `URLs` or geographical addresses when it comes to the addresses.
    Instead, they are `bitcoin` addresses or addresses for any other cryptocurrency.
    The ledger keeps track of all cryptocurrency transactions.


    In addition, the current values of prior transfers are constantly calculated.
    The value allocated to each transaction is represented by one portion of the ledger,
    while other sections of the ledger represent the date and time of each transaction.
    This is a lot like any of the current banking systems.


    You can see who transferred to which account, when, and how much each transaction
    cost; nevertheless, there is no banker in the ledger. Furthermore, the addresses
    do not represent the identities of the persons, nor do they indicate who owns
    what.


    As a result, this might be referred to as an anonymous ledger system. You should
    know that the bank has the authority to take an individual''s bank account if
    he or she has no relatives.


    In addition to banks, any government agency, including the police, `FBI`, or other
    government agency, can seize any bank account if they identify a valid reason.
    The only individual who has access to a `bitcoin` account within the vast ledger
    is the person who holds the password to that account.


    Of course, it''s risky; if you forget the password to your `bitcoin` wallet, the
    ledger''s value will be lost forever. If you forget your password for your bank
    account, you contact the bank, they ask you security questions, and you confirm
    that you are the account owner; the bank will give you access. However, if you
    have a `bitcoin` account, no bank will assist you in accessing it. Because the
    ledger is entirely decentralized, anyone can see it.


    As a result, everyone may view your `bitcoin` account, as well as the amount of
    value in that wallet. No one, however, can determine that account is linked to
    you.


    Because of `blockchain` technology, every transaction is validated and placed
    in a block; each block joins the previously validated blocks. Eventually, they
    all create a `blockchain` chain. Every `bitcoin` citizen is required to preserve
    a copy of the `blockchain`, and after each block that the system creates, each
    blockchain member receives a finished sealed block.


    The system then automatically verifies each block and assigns each block to each
    citizen. This is how `blockchain` stores every transaction and value ever made.
    Without the necessity for a central authority, these solutions assure the authenticity
    and rectification of every transaction.


    If all of this seems unfamiliar to you, keep in mind that the system handles everything
    for you, and you, as a `bitcoin` citizen, don''t have to conduct any calculations
    yourself, which would take a long time anyway.


    The miners are in charge of sealing each transaction into the ledger once it has
    been validated. Each new verified block must be added to each citizen''s `blockchain`;
    however, before accepting a new block, everyone must examine the logical continuation
    of all the values in the new block to ensure that all the cost transfers are legal.
    This also prohibits hackers or individuals with evil intentions from replicating
    transfers or counterfeiting them.


    Attempting to steal `bitcoin` or any other cryptocurrency is against the law.
    This is an important step since the validation will be stored indefinitely in
    the vast ledger and the `blockchain`.


    For the competition, `hashes` are used, as well as to validate each block and
    ensure that each citizen receives the same record.


    I hope I didn''t mislead you by including details about how the ledger is distributed
    and its procedure to validate each transaction. The fact is that each validation
    step is technically accomplished by combining different processes. You should
    also be aware that thousands of procedures are performed every second. As a result,
    I''ve tried to stay away from the technicalities as much as possible.


    ## Miners


    Let''s begin by considering how new value enters the system. Satoshi Nakamoto
    merely produced 50,000 bitcoins to begin the process in 2008. If he had created
    all 21 million in the first place, the bitcoin would have been worthless, and
    the concept would have been ridiculous. Satoshi, on the other hand, began by creating
    a small quantity of `bitcoin`.

