    again. Satoshi Nakamoto might be a guy or a woman, a couple, a group of individuals,
    or even a gaggle of women, for all we know. Satoshi Nakamoto might be a small
    group of ten persons or a large group of 100 people. Satoshi Nakamoto might be
    a toddler or an elderly man. Finally, Satoshi Nakamoto may have died shortly after
    releasing his white paper, leaving him little opportunity to reveal his true identity.


    I understand if you''re tired of hearing these allegations, so let''s start thinking
    in a new way. Satoshi Nakamoto may not be human at all. You may think of me as
    having reached my limit.


    However, it''s strange that we haven''t been able to find out who Satoshi Nakamoto
    is in the last decade; not where he lives, but who he is—honestly—we have no clue.
    Someone may be able to identify him. However, no confirmation has ever had enough
    proof to show who Satoshi is.


    I''ve always enjoyed watching science fiction films, and I recently discovered
    one called Arrival. Some of these classic films are still relevant today. Back
    in the day, for example, some science fiction books depicted certain products
    or technologies that we could use in the future, as well as others that we''ve
    been using for years. I don''t want to dig into many technicalities but consider
    facetime back in the 1980s. It was only a thought that one day we might be able
    to achieve something like that. And nowadays, we use Skype and Facebook Video
    Chat daily.


    Millions of individuals are connected and capable of staying on Skype video chat
    for hours on end utilizing our cell phones. The original iPhone was developed
    and released to the public ten years ago, in 2007. We''ve seen some tremendous
    developments since then, and the following decade will be even more spectacular.


    So, returning to the film Arrival, I hope you''ve already watched it and that
    I won''t ruin anything for you. If you haven''t already watched it, you might
    want to skip the following few sentences.


    In the film, we are visited by Aliens who are come to assist humanity by offering
    visibility in the future. But, again, if you haven''t seen the movie yet, you''ll
    probably despise me for this.


    The film''s themes are outstanding, so it''s no surprise that it got one Oscar,
    even though it may have deserved more, but that''s just my view. When I think
    about this sci-fi film, I think about its similarity to the same principles. We
    obtained Blockchain technology from an unknown individual—or, more accurately,
    from an unknown person.


    Our world will shift radically as a result of an anonymous source! I''m curious
    how the film''s makers came up with the idea... I''m not saying there are Aliens
    out there, but I also can''t say there aren''t. What I can tell you is that this
    technology fascinates IT Professionals, Software Developers, Experienced Programmers,
    and even Cybersecurity Experts, and it is sometimes referred to as an ALIAN TECHNOLOGY."


    The blockchain is massive, and it will undoubtedly take months, if not years,
    to completely comprehend its technical complexities and how it fits into the larger
    picture.


    Another issue is that it is increasingly being claimed that this technology is
    simply too sophisticated for one man to create. As a result, Satoshi Nakamoto
    could not have been working on it alone.


    So, let us return to the million-dollar question: "Who is Satoshi Nakamoto?" First,
    let''s take a look at some of the claims made over the years so you can make your
    own decision. You must realize that Satoshi Nakamoto fell silent in 2009 and stayed
    so for the following five years, at least on the forum where he previously commented
    and was always active.


    Not a Satoshi


    Satoshi Nakamoto was 41 years old when the Bitcoin white paper was published,
    according to legend. He is Japanese. However, the initial code produced for the
    blockchain was written in English, and it would be impossible for a Japanese individual
    to write like that. It would imply that he hired or was working with someone who
    speaks flawless English to create the code.


    In 2014, a few newspapers began to publish about Dorian Nakamoto, who was living
    in the United States in California at the time. Satoshi was Dorian''s given name
    at birth. Furthermore, additional facts might lend credence to his claim to be
    the true inventor of Blockchain. 


    Apparently, the first reporter who attempted to contact him asked him, via e-mail,
    if he had anything to do with bitcoin.


    Dorian''s reaction was, "I am no longer involved with that, and I cannot address
    it." It has been delegated to others. They are now in command of everything. "I''m
    no longer connected." That, of course, raised suspicions, and reporters descended
    on Dorian''s home in California. He read his e-mail again after understanding
    how serious it was and tried to explain himself.


    First and foremost, he has denied any affiliation with bitcoin. In fact, he stated
    that he had no idea what bitcoin was until his son informed him of the news, at
    which point he checked it up on the internet. He also went public and stated,
    "I have nothing to do with bitcoin." It has nothing to do with development. I
    was merely an engineer doing something else at the time. If you look at the time
    spent in 2001, you''ll notice that I wasn''t there. I was employed by the government
    through a contracting firm. I only think the fictional name was inserted by mistake."


    There have also been revealed papers indicating that he has been conducting classified
    work for the US Government as well as the US Military. He has also signed agreements
    stating that he would not be able to disclose any role in his prior efforts with
    secret projects.


    Following this occurrence, an unexpected message appeared on a P2P forum where
    the Real Satoshi Nakamoto used to post after five years of silence. "I am not
    Dorian Nakamoto," he says.


    Craig Wright, a well-known Australian businessman, emerged in 2015 as the next
    probable candidate to be Satoshi Nakamoto.


    Documents regarding Craig Wright had begun to leak to Wired magazine from an unnamed
    source. However, the majority of them provided proof that suggested Craig Wright
    was Satoshi himself.


    Craig has mentioned that he is considering releasing a Cryptocurrency paper in
    one of them, issued in August 2008. This, of course, became a highly appealing
    contender for Satoshi Nakamoto''s first white paper, which was published in October
    2008, barely a month later.


    Another leak, this time from Wired magazine, was another statement by Craig Wright,
    but this time from January 2009. He wrote this time that bitcoin is set to go
    live. The very first bitcoin transaction took place in January 2009.


    Wired magazine also reported that they had received several e-mails and transcripts
    confirming the relationship. "A leaked correspondence from Wright to his lawyer
    from June 2008 shows Wright imagining a peer-to-peer distributed ledger."


    There were several leaks about Craig Wright, particularly in Wired magazine. In
    May of 2016, though, everything changed. On his blog, Craig Wright said that he
    is now prepared to confess that he is Satoshi Nakamoto openly.'
