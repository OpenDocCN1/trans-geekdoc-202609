    所有高昂的防火墙、入侵防御系统和入侵检测系统，除非经过适当升级，否则都是徒用功。你必须意识到，如果有人具备社会工程技巧并破解了其中任何一个设备的密码，那么拥有所有安全防护也毫无意义。其后果将是戏剧性的（事实通常也是如此），但世界上大多数金融机构已经停止向新闻媒体谈论被黑客攻击事件，因为担心这会损害它们的声誉并带来耻辱。


    由于公司将所有数据都集中存储，黑客只需要针对一家公司就可以渗透其系统；这就是为什么黑客知道一切都是可以被破解的。攻破任何系统只需要时间和精周的规划；然而，对于像
    `blockchain` 这样的系统，则需要的时间和精周的规划。


    这是极不可能的。尽管专家说这并非不可能，但仍然需要巨大的计算能力。此外，`blockchain` 并不受防火墙或任何检测预防系统的保护。相反，`blockchain`
    的力量源于它是完全去中心化的。我的意思很直白。尽管如此，我会尽力用通俗易懂英语来解释。


    由于 `blockchain` 是一项开源技术，任何人都可以运行该软件。因此，你可以选择永不购买 `bitcoins` 或投资任何 `cryptocurrency`。然而，你可以通过运行
    `blockchain` 软件成为 `blockchain` 社区的一员。该软件免费下载和使用，你对任何人都没有义务，但如果你决定运行它，你将成为一个区块链社区成员。


    一旦你成为成员，你的设备将成为 `blockchain` 的一部分，每当形成新区块时，你的设备都会收到该交易记录。


    由于你的设备现在已成为 `blockchain` 的一部分，需要更多的设备被黑入才能完全破解该链。由于你的设备正在运行 `blockchain` 软件，它现在对现有的去中心化系统做出贡献。没有中心化的副本，每个用户都与其他其他人相同的信任水平。我是说没有主节点，因为每个设备都拥有相同的镜像数据，这使得黑客几乎不可能。`blockchain`
    已经使用了近十年，从未被破解过。


    这令人兴奋，因为 `blockchain` 为任何能够破解系统的人提供了一个价值 70 亿美元的匿名大奖。多年来，无数黑帽黑客、大型犯罪组织和网络犯罪集团因为其高价值而盯上了
    `blockchain`。


    尽管如此，`blockchain` 从未被破解过，也没有经历过任何形式的缓慢。这证明了核心功能结构设计良好；然而，正如我之前提到的，任何东西都是可以被破解的；这只是时间问题。IT
    专家通常认为，随着技术的飞速发展，未来一切皆有可能。`blockchain` 系统被攻击的方法由量子技术定义。然而，这将需要破解数百万已经在运行 `blockchain`
    软件的机器。


    此外，为了有效，对所有这些设备的黑客攻击必须非常迅速地。即使我们不知道 `Satoshi` 是谁或他具备什么能力，有一点是肯定的：他创建了这个系统。结果，他将能够访问他产生的第一个区块，允许他根据需要影响
    `blockchain` 系统。随着时间的推移，出现了多种 `blockchain` 技术，`bitcoin` 的价值也不断增加；个人也开始向许多 `cryptocurrencies`
    投入巨额资金。结果，人们已经对 `Satoshi Nakamoto` 是谁失去了兴趣，或者他多年来已经单纯被遗忘了；但是，如果他（或她）仍然活着并渴望操纵系统，这是可行的，尽管我不认为这种结果会符合大多数人的利益。


    # 商业用途


    技术世界有很多极客，也包括我。另一方面，有些人并不一样同。所以，对你来说，我如何定义极客？因为外面对有这么多不同的极客，所以我将从那些友好的开始。


    视频游戏改变了世界，许多年轻人和成年人已经痴迷于他们最喜欢的作品。然而，那些从未花费一整晚晚上或一天（或两者兼有）来玩在线游戏的人，可能很难理解为什么某些人会对视频游戏成瘾。


    有那种只玩游戏并并在上面花钱的极客，但也有其他一种。部分极客痴迷于新工具和软件，认为必须尽快检查它们，即使其中某些软件是从种子站非法获取的。


    另一方面，其他极客并不一定会免费下载所有东西，他们倾向于购买正版软件或工具，以便在拥有实物时感觉更好。正版软件能提供更好的感受，许多极客购买它是出于对软件做出贡献的作者的尊重。


    ## 设计师与开发者


    提到 `blockchain` 时，最近出现了几家新公司，它们正在开发一种协议，允许使用其内部开发的货币来玩某些在线游戏。更棒的是，他们设计了极佳的在线游戏，玩家可以通过贡献其游戏电脑、`PlayStations`、`X-Boxes`
    以及其他设备的 `CPU` 或 `GPU` 功率来参与他们的 `cryptocurrency`。由于这些方法将被充分利用并定期贡献，它们的价值将飙升。


    如你所示，`blockchain` 将允许基于 `blockchain` 技术创建新货币和在线游戏社区。我用游戏作为一个例子。许多行业，如点播音乐、点播电影、社交网络网站等，现在正以类似的方式使用
    `blockchain` 技术。


    智能合约（如 `Ethereum`）的引入是迄为止最重要的基于 `blockchain` 的技术之一。现在有很多不同的区块链，每一种都会在某个时刻对我们的未来产生影响。有很多去中心化众筹、医疗、供应链、博客网站和实时共享选项（仅举几个），但最重要的是
    `IoT`。


    `IoT` 通常被称为物联网，用于 `blockchain` 的近年来增长迅速。近年来，物联网用于 `blockchain` 的增长。物联网也被称为智能设备、连接设备、物理设备或无人驾驶车辆。这些设备的目标是连接到网络并开始共享数据。自动化日常生活是一项涉及软件、电子产品和通信传感器的小规模业务。然而，当它发生在大规模项目上时，例如虚拟电厂、智能家居、智能交通，甚至可以使用
    `blockchain` 技术运行的智能城市，那里才是大钱所在。大人物的大规模业务计划需要多年的规划；然而，实现它的技术现在已经存在了。


    这些倡议将允许直接整合到现实世界的计算机系统中，提高效率、准确性和经济优势，同时消除人类参与。


    机器机器（`M2M`）连接已经在使用。然而，`blockchain` 将通过加速虚拟化并将数据加密到区块中进一步改进这一点，允许我们充分利用数据。


