- fmt: '

    However, as the bitcoin community expands, more value will be necessary to keep
    the system alive. Therefore, a certain method is required to maintain the system;
    Satoshi has devised a solution by defining a position. This method addresses not
    one but two issues: 1. Validating transactions continuously 2. Adding fresh value
    to a system that already exists. `Miner` is the name of the character.


    Individuals or any bitcoin citizen can be miners. However, several huge firms
    have emerged over time, such as `Genesis Mining`, where you may join and hire
    their mining facilities as an individual. In addition, many other miners have
    formed pools throughout the years, and many of them offer to join these pools
    for a variety of reasons that I will detail momentarily.


    Let me first explain why they are known as miners and what they do. They are.
    As the analogy with gold or any other valuable metal has been exploited, they
    are referred to as miners. They collaborate to produce a new value, just like
    gold miners do when they dig underground. Bitcoin miners, on the other hand, record
    each transaction on the ledger. As a result, we may refer to miners, finalizers,
    or authenticators as miners, finalizers, or authenticators.


    Miners are paid with bitcoins in exchange for their efforts, and this is how new
    value is generated to the system. The miners use specific methods to check, authenticate,
    certify, and finish the transactions. The transaction record cannot be updated
    after the miners have generated a new block approved by the citizens, making it
    permanent information. This, too, will be irrevocable. As a result, no individual
    will ever be able to contest it or amend it in the future.


    The miners encrypt the blocks, which requires a significant amount of computational
    power, ensuring that they cannot be simply copied. Validating processes may be
    done in a variety of ways, depending on the miner. Some miners may utilize different
    software or even create their in-house software to speed up the authentication
    process. It makes no difference what program they use because all of their work
    will be scrutinized. It begins when a miner begins to collect transactions that
    have been broadcasted on the network, then checks those transactions before sealing
    those collections of transfers and operations into a new block. A miner is awarded
    bitcoins for each sealed block added to the network.


    # Creation Of Blocks


    Each block creation can be explained in many ways; however, some may seem very
    confusing, but you also need to consider your level of technical knowledge. The
    first time you hear it or read it may be challenging. In previous explanations,
    we have seen that miners have a unique role in verifying each transaction as a
    block. This time, let''s see how blocks are generated.


    1. A new block will be created. Although they may only be halfway through validating
    a block, the miners will eventually give up and focus on starting a new block.

    2. New transactions can be selected. There are thousands of operations broadcast
    across the network, and miners get to choose from them.

    3. Check the priority of the transaction. This time, the miners can go back to
    number one by starting a new block if they find that the previously selected transaction
    is not that significant. On the other hand, the miners may continue to the next
    step if the priority is high.

    4. Verify the validity of the transaction. Again, there is no exception for any
    miner to omit this step; it is a process that all miners must follow. Should the
    transaction be found to be false or invalid, the miners will have to stop the
    process and go back to number 1, where they will begin a new block and hopefully
    obtain another valid transaction.

    5. The transaction should be accepted. Valid transactions must be accepted if
    they were tested previously.

    6. Transact securely. The transaction must now be sealed if it has been verified
    as valid and accepted.

    7. Within the block, add the transaction to the transaction tree. Once the previous
    steps have been verified, add the transaction to the transaction tree.

    8. Determine how much each transaction is worth. For a block to be sealed, miners
    must ensure that there are enough transactions in the transaction tree. In the
    case of insufficient transactions, the miner will not secure the block until there
    are enough transactions. Therefore, the miners must add new transactions until
    there are enough for the block to be sealed until they go back to the number 2
    process again and again.

    9. Interruption should be checked. To complete this process, the miner must ensure
    that no other miners have sealed the block since they with the same transaction
    inside.

    10. The block must be sealed. As soon as the miners receive enough transactions
    to be sealed, the block will be sealed.

    11. You should broadcast the block. During sealing the new block, the miners must
    broadcast the newly sealed block; if they are interrupted, they may have to start
    a new block from scratch.

    12. The new block should be started. However, the next step in this process is
    back to step number one, as you can see. During the process of sealing the block,
    miners might get interrupted, and once the block has been broadcast, if another
    miner with the same transactions has already sealed another block, the block cannot
    be accepted. Rather, it must be started from scratch.


    It takes about ten minutes for each block to be created. This results in 144 blocks
    being created every day. As I mentioned before, the miners who have successfully
    added a new block into a blockchain get rewarded a degree of bitcoin. For example,
    between 2008 and 2012, each new block would be rewarded with 50 bitcoins. Every
    four years, the reward for a new block is halved; therefore, from 2012 through
    2016, the reward for a new block was 25 bitcoins.


    A miner currently receives 12.5 bitcoins for adding a new block to the blockchain
    since 2016, but that will change to 6.25 bitcoins from 2020 until 2024. Until
    the last bitcoin is generated in 2140, this process will continue.


    # Security On The Blockchain


    Some of you might say, "blockchain is a cutting-edge technology that will positively
    impact the globe." But, "Is it secure?" remains the question.


    Yes, to put it briefly. But first, consider what the system has already accomplished.
    The truth is that whatever is connected to the Internet, or connected to a system
    with a web connection, can be hacked and corrupted.


    Even if a gadget does not use a connection, it can still be hacked if you have
    physical access to it. One example is a laptop or desktop computer that can be
    broken into and launched with a Linux disc. Take banks, for example, if you want
    to go further. They are constantly compromised; of course, they have ceased announcing
    these types of instances because they would lose all of their patrons if they
    did. In late 2015, a teenager hacked the head of the `FBI`, and most people find
    it amusing. Even though the `FBI`''s security is very highly organized, it is
    nevertheless vulnerable to hacking. Even `Kevin Mitnick` hacked the `FBI` for
    three years and listened to the agents'' phone conversations while talking about
    himself, so the `FBI` might not be the ideal example to use.


    When it comes to the `NSA` or `National Security Agency`, you''ve probably heard
    about `Edward Snowden`. `Snowden`, who stormed out with classified documents,
    demonstrates that even the `NSA` has flaws. Confidential documents or even secrets
    can be leaked.

