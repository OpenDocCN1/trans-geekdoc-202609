    # Introduction


    The book offers an excellent guide to understanding Blockchain technology for
    beginners. Those who are unfamiliar with this technology can gain a better understanding
    of the contents if they avoid technical details. However, some terms will be more
    understandable if you have some IT background. It isn''t necessary, though. It
    has been written in everyday English to avoid confusion, and it will walk you
    through the entire process of how digital currency was created step-by-step.


    Our goal is to understand what caused the birth of several cryptocurrencies in
    our current society by going back in time and summarizing the history of finance.
    We then examine the primary objective behind the invention of Bitcoin as well
    as the theory behind it. As we move forward, we should review some of the possible
    candidates for the birth father of blockchain. The next part of our discussion
    will describe what a distributed ledger is and how it operates. Afterward, the
    miners are introduced, their responsibilities, and who they are. Then it discusses
    how the blocks are created, and finally, how the blocks culminate into a chain
    called a Blockchain.


    We will discuss in more detail what security measures we have put in place on
    the Blockchain in the last chapters. In addition, by examining the purpose of
    this technology and future banking systems, we will attempt to understand what.


