    # IV. DISCUSSION


    All single-tag classifiers had an accuracy of 70% for all tags, indicating that
    classification was possible. Only the Family classifier was oriented. There are
    three reasons for this:

    The first is the effect of variation. Words in Japanese that are used to refer
    to the same person. For example, one could be referred to as “parents” or “爸爸”
    or “妈妈”. So, and is it is also possible to refer as “parents” or “father” or “mother”
    in the text. However, it is necessary to vary the use of words depending on the
    granularity of classification. For example, the Family classifier predicted Sibling
    instead of Family. To refine the classification it is necessary to reduce the
    granularity of words like “parents” and “sibling”.

    Since the dataset used for untagged Friend and Family. The number of sentences
    with these tags increases because the sentences were extracted randomly. As a
    result, text which has the highest number of'
