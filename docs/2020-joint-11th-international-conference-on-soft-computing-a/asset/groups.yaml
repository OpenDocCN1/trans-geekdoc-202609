    Third, because TF-IDF was used for vectorization, the context in the sentence
    was not considered. This can be solved by using Bidirectional Encoder Representations
    from Transformers (BERT) for context-aware vectorization. However, over emotional
    sentences, and many with incorrect structures, and many misspelled words, these
    factors can hinder a correct guess.


    The multi-tag classification showed that the percentage of errors did not reach
    the theoretical value. In the method, the accuracy of each classifier can be increased
    by improving the accuracy of the single label classifiers. In addition, the prediction
    results revealed an annotation error, so multiple people are needed to annotate
    the dataset to improve its objectivity.


    We proposed a method that can re-train each classifier by adjusting the parameters
    and changing the training algorithm for each classifier. This makes possible to
    do flexibly with the challenges of each classifier. If the accuracy of the solution
    was reduced as a result of implementing the solution, we can determine whether
    to apply the solution for each classifier.


    # V. CONCLUSIONS


    In this study, we proposed a classification method by automatic tagging BBS using
    a Naive Bayesian method. As result, the accuracy was 70% for each classifier,
    indicating that classification is possible. The classifier identifies correct
    tags to sentences that have been annotated with incorrect tags. However, the precision
    was lower than the recall, so some text will be incorrect tags.


    In the future, we aim to create more detailed tags and improve the accuracy of
    the classifier. We will also collect data from other BBS and social networking
    sites to scale our data. We found that problems related to parents written in
    texts were more about mothers than fathers. This is because mothers are more involved
    in their children''s lives in Japan, and are more likely to think and act for
    their children properly. Conversely, fathers may be reluctant and less involved
    in parenting. By analyzing the worries and consultations of school refusal students,
    we can discover the latent problems that persist.


