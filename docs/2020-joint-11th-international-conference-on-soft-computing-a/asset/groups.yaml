    **Abstract**—This study proposes a classification method for the automatic tagging
    of posts on an Internet bulletin board for school refusal students. Four tags
    are defined based on the concern: health, family, and study. A status is generated
    for each tag, and multiple tags are assigned. The results of classification showed
    that the accuracy of each class was more than expected, but precision was low
    for the others than Family. As the solutions, by reviewing the dataset and changing
    the method, we will choose the method that is most appropriate for each class.


    **Index Terms**—classification, machine learning, sentence


    I. INTRODUCTION

    Non attendance in Japan is increasing every year. There were 164,558 non-attending
    students in 2018 according to the Ministry of Education, and the rate of increase
    was as high as 14.2% in the past [1], which is a serious problem. Moreover, there
    are other types of students who are not included in the definition of “Non-attendance”
    by the Ministry of Education [2]. In this study we define school refusal students
    as elementary students who have anxiety or worries about going to school.

    Sugiyama indicated that external factors were the main reasons for school refusal.
    In addition, many of them have a poor physical condition that cannot control.
    Sugiyama suggests the period of school refusal is a “maintenance period”, while
    Haaito calls it a “recharging period”. They also stated that it is important to
    support children by not forcing them to do things they do not want to do and by
    allowing them to do the things they want to do. The most effective support is
    to trust the child and wait for the completion of the time without providing assistance.

    During the maintenance and recharging period, when children refuse spontaneously
    to discuss their concerns, their parents and teachers should also be a good mentor.
    However, sometimes students cannot discuss cause of of problems because of a teacher
    or parent, or due to a psychological problem. In such cases, they can discuss
    their worries with a counselor or support group, person service, or on


    networking sites or Internet bulletin board (BBSs) for school refusal students.
    In this study, we consider the use of a BBS.

    A BBS for school refusal students enables them to post their worries and concern
    about other posts. Comments can be made by users who have had similar experiences
    or worries. Those who do not post can also read about those with similar problems.
    Reading that makes them feel better in that they are not the only ones with worries.

    This study proposes a classification method for the automatic tagging of posts
    on BBS for school refusal students. The proposed method enables us to categorize
    the experiences and worries into posts easily. The students will be able to read
    many posts with similar problems. In cases when there are multiple factors of
    concern in a single post, multiple tags can be assigned to a single post.


    II. PROPOSED METHOD


    Tags are automatically assigned using machine learning. The dataset contains the
    postings of two BBS for school refusal students [6], [7].

    Only refused school high students discussing his or own concerns were extracted.
    As a result, 1,599 sentences were extracted. The selected sentences were annotated
    by one person. Four tags were defined based on the reasons for the refusal there
    as follows:


    +   1) Friend

    (friends, sisters, juniors, bullying, class, etc.)

    2) Teacher

    (teacher, etc.)

    3) Family

    (parent, father, brother, sister, etc.)

    4) Study

    (schoolwork, examination, etc.)


    Each tag is assigned to a text when it contains a problem or consultation related
    to a post. Multiple tags are allowed. The number of each tag is shown in Table
    I.

    Each sentence is morphologically analyzed using GiNZA, and the words of nouns,
    adjectives, and verbs are extracted. The words are then vectorized with TF-IDF.'
