    # 基于机器学习的拒学学生烦扰与咨询帖文分类研究


    Ishikura Rikuto

    Takeda Mashiro 和 Iwasashita Shinji

    东京工业大学 计算机与媒体科学学院 生物信息学系研究生

    计算机科学学院

    日本，东京

    g22120081e@edu.teu.ac.jp {takeda, Iwasashita}@sf.teu.ac.jp


    **摘要**—本研究提出了一种针对拒学学生网络公告板帖子进行自动标签分类的分类方法。根据关注点，定义了四个标签：健康、家庭和学习。为每个标签生成一个状态，并分配了多个标签。分类结果显示，每个类别的准确率均高于预期，但除“家庭”类外，其他类别的精确率较低。作为解决方案，通过回审数据集并调整方法，我们将为每个类别选择最合适的方法。


    **索引词**—分类，机器学习，句子


    I. 引言

    日本的缺勤上学人数每年都在增加。根据文部科学省的数据，2018年共有164,558名缺勤学生，在过去的增长率高达14.2%[1]，这是一个严峻的问题。此外，还有其他未包含在文部科学省“缺勤”定义中的学生类型[2]。在本研究中，我们将拒学学生定义为对上学产生焦虑或忧虑的小学学生。


    杉山（Sugiyama）指出外部因素是拒学的主要原因。此外，他们中许多人的身体状况不良且无法控制。杉山认为拒学期间是一个“维持期”，而海斗（Haaito）则称之为“充电期”。他们还认为，通过不强迫孩子做他们不想做的事，并允许他们做想做的事来支持孩子是很。最有效的支持是信任孩子并等待时间的完成，而不提供帮助。


    在维持和充电期间，当孩子自发地拒绝讨论他们的烦扰时，他们的父母和老师也应该成为良好的导师。然而，有时学生因为老师或父母或心理问题无法讨论问题的原因。在这种情况下，他们可以在咨询师、支持小组、个人服务，或者在社交网站或针对拒学学生的网络公告板（BBS）上讨论他们的烦扰。在本研究中，我们考虑了使用BBS。


    拒学学生的BBS让他们发布自己的烦扰，并对其他帖子发表看法。具有相似经历或烦扰的用户可以发表评论。不发帖的人也可以阅读那些有类似问题的人的内容。阅读这些让他们感觉好受，因为他们发现自己不是唯一担忧的人。


    本研究提出了一种针对拒学学生BBS帖子进行自动标签分类的分类方法。所提出的方法使我们能够轻松将经历和烦扰分类到帖子中。学生将能够阅读许多类似问题的帖子。当一个帖子中存在多个关注因素时，可以给单个帖子分配多个标签。


    II. 提议方法


    使用机器学习自动分配标签。数据集包含两个拒学学生BBS的帖子[6], [7]。仅提取了讨论其或自身烦扰的拒学高中生的帖子。结果是，共提取了1,599句句子。选定的句子由一人进行标注。根据其中拒学的原因定义了四个标签，如下所示：


    - 1) 朋友（朋友、姐妹、后辈、欺凌、班级等）

    - 2) 老师（老师等）

    - 3) 家庭（父母、父亲、兄弟、姐妹等）

    - 4) 学习（作业、考试等）


    当文本包含与帖子相关的问题或咨询时，会为其分配每个标签。允许分配多个标签。每个标签的数量如表所示。每句句子使用 GiNZA 进行形态法分析，并提取名词、形容词和动词。然后使用
    TF-IDF 对这些词进行向量化。


    # 表 I

    每个标签的数量


    | 朋友 | 老师 | 家庭 | 学习 |

    |---|---|---|---|

    | 767 | 203 | 602 | 213 |


    仅有包括欺凌在内的朋友问题。朋友分类器将包含“死亡”字的16句句子误标为错误标签。


    # 表 III

    混淆矩阵 (%)


    | | 朋友 | 老师 | 家庭 | 学习 |

    |---|---|---|---|---|

    | 预测 | | 38.7 | 52.5 | 18.5 |

    | 结果 | 60.9 | 22.2 | 20.6 | 19 |

    | 家庭 | 62.5 | 18.75 | 28.13 |


    使用了朴素贝叶斯分类器并采用了多模态模型，当词数较大时，模型的分类准确率更高。为每个标签生成一个分类器，每个句子通过所有分类器，当可以分配多个标签到数量时。


    我们使用交叉验证来评估分类器的准确性。数据集按1:1的比例分为标记和未标记，并分为训练数据和验证数据。每次都进行了多次尝试和验证。


    ### A. 单标签分类验证


    为了验证每个标签分类器的准确性。使用数据集的75%用于训练，25%用于验证。进行了四次试验。


    ### B. 多标签分类验证


    整个数据集中具有多个标签的162句被分为三组，每组的平均标签数量尽可能相似。其中一组用于验证，另外两组用于测试。对于。


    ### B. 多标签分类


    多标签分类的评估结果如表IV所示。多标签分类的准确率显示，平均标签数为。54个句子被预测为错误标签。在这种情况下，多标签分类的准确率为45.4%。因此，理论值。


    # 表 IV

    正确预测单词的数量


    | | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|

    | 测试 1 | 15.0 | 22.0 | 13.0 | 4.0 | 0.0 |

    | 测试 2 | 3.0 | 17.0 | 17.0 | 1.0 | 0.0 |

    | 测试 3 | 4.0 | 17.0 | 20.0 | 11.0 | |

    | 平均 | 9.0 | 18.7 | 16.7 | 8.6 | |


    III. 评估


    单标签和多标签分类的准确性通过每个评估进行评估。


    ### A. 单标签分类


    单标签分类的评估如表II所示。所有标签的准确率都高于70%。为了防止预测错误标签，需要在精确率上调整分类器。然而，除了家庭外，所有分类器都得到了召回率结果。


    # 表 II

