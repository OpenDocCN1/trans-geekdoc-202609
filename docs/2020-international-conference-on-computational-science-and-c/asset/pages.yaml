    # I. INTRODUCTION


    **Abstract—** The COVID-19 pandemic is the defining global health crisis of our
    time which is currently challenging families, communities, health systems, and
    governments all over the world. It is critical to detect and isolate positive
    cases as early as possible for timely treatment to prevent further spread of the
    virus. It was found in early studies that patients present abnormalities in chest
    radiography are characteristic of those infected with COVID-19. In the current
    context, an accessible and automated screening tool is needed to make a quicker
    PCR test, especially with limited available X-ray machines and dedicated kits
    in labs and hospitals. Several approaches have been proposed based on deep learning
    using supervised transfer learning techniques on Convolutional Neural Networks
    (CNNs). These block approaches are largely non-interactive and their predictions
    suffer due to a lack of labeled data. This work focuses on the development of
    an automated system for COVID-19 by performing feature learning using deep neural
    networks with a driven approach and retrieving images based on an query. Our method
    provides a benchmark towards the goal of realistic comparison and real interaction.
    The system is trained and tested on an image of 1700 Chest images from two different
    resources with encouraging results based on precision and recall. It is hoped
    that the proposed system may help reduce the visual error of human operators and
    enhance sensitivity for Covid-19 detection.


    COVID-19 pandemic is the defining global health crisis of our time and the greatest
    we have faced since World War II. This global health crisis is challenging families,
    communities, health systems and governments. A critical step in the fight against
    COVID-19 is screening of infected patients, such that those infected can receive
    immediate treatment as well as to mitigate the spread of the virus. Testing for
    COVID-19 involves inserting a 6-inch swab (like a Q-tip) into the nose and mouth
    (nasopharyngeal swab) for several seconds and rotating it. The swelling is then
    subsided and enough sample of nasal material is collected. The swab is then inserted
    into a container and sent to a lab for reverse transcription polymerase chain
    reaction (PCR) testing, which can detect the RNA of the coronavirus SARS-CoV-2
    respiratory specimens. It is widely utilized for symptomatic and asymptomatic
    individuals. Health workers, first responders and other service employees, people
    exposed to infected patients in places where COVID-19 risk is high, are also being
    tested. The accuracy and specificity of testing is a time-consuming and laborious
    manual process from collection of specimens to obtain the test result. The current
    sensitivity (around 70%) of the nucleic acid tests, many suspected patients to
    be tested multiple times several days before reaching a confident diagnosis.


    **Keywords—** X-ray, COVID-19, Computer Aids Diagnosis, Screening Tool, Deep Learning,
    Image Retrieval


    As a result, there is a need for an automated system for rapid triage, accessibility,
    and portability. In some early studies [2-8], it is found that patients present
    abnormalities in chest radiography (e.g., X-ray or chest tomography'
