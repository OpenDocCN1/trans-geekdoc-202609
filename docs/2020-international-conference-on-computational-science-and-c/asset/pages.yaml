    The descriptiveness and power of features to effectively represent the structure
    and characteristics of images and effectively handle the within-variance and between-class
    similarity are critical to achieve good classification and retrieval. Recent research
    in pattern recognition has highlighted the capabilities of Convolutional Neural
    Networks (CNNs) to solve tasks such as classification, segmentation and object
    detection, achieving the art performance. This is attributed to the ability of
    CNNs to learn a hierarchical representation of raw data to capture the intrinsic
    features without manual design. Deep learning architectures are formed by combination
    of linear and nonlinear transformations to obtain various and useful representations
    of data. This, data-driven representation discard irrelevant information and features
    only those that are useful for the intended task. Automatic feature learning or
    learning deep data from image has a difference with manual extraction of the intrinsic
    features and provides an alternative to the handcrafted features. By the variety
    of the feature learning method, it might be possible to tailor the features to
    a specific application, such as classification [10].


    Deep learning systems potentially assist clinicians for identifying abnormalities
    related to COVID-19 in triaging and treating high-risk patients, as well as help
    overcome the difficulty of COVID-19 images available for machine learning development.
    So, many of the proposed approaches show promising results based on transfer learning
    in smaller data sets. For example, three deep learning models (ResNet50, MobileNetV2
    and Inception) were used to detect COVID-19 from X-ray images (50 COVID-1 images
    and 50 normal chest X-rays) and evaluation show that the ResNet50 model achieved
    the highest classification accuracy, followed by Inception [3] and obtains accuracy
    by InceptionResV2. Hindi et al [12] proposes COVID-Net (a deep CNN network) to
    detect COVID-19 cases in a dataset of 5941 chest X-ray images of four different
    categories with 83.5%. The technique (CAD-Net) is presented in [3] to fine-tune
    a pre-trained ResNet50 architecture to improve model performance and reduce time.
    Haram et al [8] proposed a CADConet model with multiple convolutional layers for
    feature filtering on each layer and a classification accuracy of 98.8% for most
    cases (COVID vs. No-COVID) and 87.02% for most cases (COVID vs. No-Pneumonia)
    where images were obtained from two different datasets. There are also recent
    studies on COVID-19 detection using various deep learning models with CT [13–15].


    However, many of these systems are non-interactive and the presentation lacks
    the ability to explain the reason of the decision-making. It would be more effective
    if a radiologist is interested in the decision making process by means of an interactive
    approach; however the limited number of cases in a database of diseased cases,
    similar to the one in our study allows in to predict the quality of taken image.
    Our hypothesis is that by providing with a set of pathology-confirmed cases as
    computer output, the system can learn to predict and not suggest a second demand.
    In the last years, diagnostic CAD systems that use chest X-ray retrieval (CBIR)
    to search for the relevant images has been attracting huge research provided radiologists
    with visual aid and to increase their confidence in CAD-ued results in the decision
    making. Furthermore, CBIR would be a useful aid in the training of students, residents
    and less experienced radiologists would help them view images that look similar,
    but may have differing pathology and help them see how the pattern in their current
    case resembles a pattern in cases previously to be normal or different disease


