    # VI. EXPERIMENTS AND RESULTS


    Data collection and evaluation is the final most important step for validating
    the effectiveness of a retrieval or classification system. There exist large CBIR
    datasets, due to new X-ray images with COVID-19 symptoms which widely hinders
    the research and development of AI methods. We hypothesized that other infections
    with similarity to COVID-19 could be used to train models capable of identifying
    this new disease. For our experiment we used the combined 1580 X-ray images from
    NIH dataset and publicly available COVID-19 chest-ray images [27]. The NIH dataset
    contains 112,210 frontal images of 30,805 unique patients. The dataset contains
    abnormal pulmonary and cardiothoracic conditions that include nodule, pneumothorax,
    infiltrate,


