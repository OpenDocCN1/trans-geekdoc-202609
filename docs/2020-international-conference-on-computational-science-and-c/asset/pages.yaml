    # ## CONCLUSIONS


    In this paper, a learning-based retrieval system is proposed for the detection
    of COVID-19 and other abnormal pulmonary cardiothor conditions in CXRs. It is
    hypothesized that such a system would greatly improves the screening process for
    radiologists in CXRs. However, for real clinical integration of such a system
    it is important to combine data with clinical findings and laboratory examination
    results to better screening, detection and diagnosis of COVID-19. In future, we
    will work further in using information from these multi-source data, for accurate
    and efficient diagnosis, analysis and follow-up.


