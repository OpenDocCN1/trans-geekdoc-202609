    # III. FEATURE EXTRACTION WITH LEARNING


    # II. SYSTEM MODEL


    ![](img/e62b4ae95084b48527fba145217ae057_2_0.png)


    Fig. 1 represents the architecture of the proposed system which is divided into
    offline and online phases.


    Feature extraction is a critical method of medical image. In selecting effective
    features, research efforts have been focused on capturing the color, texture,
    and shape of images. The descriptiveness and discriminative power of features
    from X-ray achieve good classification and reliable performance. Instead of using
    any-crafted features, transfer learning techniques can be used to extract features
    of X-ray image from small datasets using CNN models. Transfer learning increases
    the efficiency of the feature extraction as it has been proven to boost model
    accuracy with fewer data and less required training. CNNs trained on large-scale
    datasets such as ImageNet have demonstrated themselves at the task of transfer
    learning. Networks learn a set of discriminating features to represent various
    objects objects [19]. Using a pretrained CNN as a feature extractor rather than
    training from scratch is effective as it transfers learning (i.e. filters) from
    others where more data is available and avoids a time-consuming training needs
    [20].


    The off-phase (left) involves pre-processing and feature extraction of database
    images for indexing purpose. The images are processed by resizing and normalizing
    the pixels before passing to a feature extractor network. Our features are extracted
    using a CNN trained on a convolutional denoising autoencoder for feature generation
    in a latent space and several other Transfer Learning based deep feature extracts
    (which excludes the last two fully connected layers of CNN) on ImageNet dataset.
    This system pre-processes all the database images by resizing it for the first
    CNN approaches. Using the transfer learning approach, the deep features of the
    images in the database are extracted by passing them through them


    To perform deep feature extraction based on transfer learning, we use VGG-19,
    ResNet-50 [22], and DenseNet[69] as our pre-trained CNN models on ImageNet dataset
    of 1000 cases. These CNN learns features are used to retrieve reliable accurate
    classification results. VGG-19 consists of 16 fully convolutional layers which
    have been used as a baseline feature extractor [21]. ResNet, for Residual Learning
    is another neural network which is built by the VGG architecture. Typical ResNet
    models use bottleneck-layers with triple nonlinearities (ReLU) and batch normalization
    between [22]. Skipping effectively simplifies the network, using fewer layers
    in the initial stages. This speeds up learning by reducing the vanishing gradient
    problem, as there are fewer layers to propagate through the network. Then we gradually
    update the skipped layers. Whereas, traditional CNN with layers have L connections—one
    between each layer and its subsequent layer—the Dense


