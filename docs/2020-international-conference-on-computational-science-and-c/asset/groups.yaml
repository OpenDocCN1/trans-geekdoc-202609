    # 基于深度迁移学习和去噪自动编码器的 COVID-19 检测胸片图像检索系统


    O. F. Layode

    计算机科学系

    摩根州立大学

    巴尔的摩，美国

    layode@morganstate.edu


    Md Rahman

    计算机科学系

    摩根州立大学

    巴尔的摩，美国

    md.rahman@morganstate.edu


    ## I. 引言


    **摘要—** COVID-19 疫情是我们这个时代最具性的全球健康危机，目前正挑战着全球范围内的家庭、社区、医疗系统和政府。尽早检测并隔离阳性病例以进行及时治疗，防止病毒进一步扩散至关重要。早期研究发现，胸部放射检查中出现异常的患者是感染
    COVID-19 者的特征。在当前背景下，需要一种易于获取的自动化筛选工具来进行更快的 PCR 测试，特别是在实验室和医院的 X 射线设备和专用试剂盒有限的情况下。目前已经提出了几种基于卷积神经网络（CNNs）上使用监督迁移学习技术的深度学习方法。这些方法的方法在很大程度上是非交互的，并且由于缺乏标记数据，其预测结果受到影响。本工作专注于开发一种
    COVID-19 自动化系统，通过通过驱动的方法使用深度神经网络进行特征学习，并根据查询检索图像。我们的方法为实现真实比较和真实交互的目标提供了一个基准。该系统在来自两个不同资源的
    1700 张胸部图像上进行了训练和测试，基于精确率召回率显示了令人鼓舞的结果。希望所提出的系统有助于减少人类操作员的视觉误差，并提高对 COVID-19 检测的灵敏度。


    COVID-19 疫情是我们这个时代最具性的全球健康危机，也是自第二次世界大战以来我们面临的最大挑战。这场全球健康危机挑战着家庭、社区、医疗系统和政府。抗击
    COVID-19 的关键一步是对感染患者进行筛选，以便受感染者能够接受立即治疗并减轻病毒的传播。COVID-19 检测涉及向鼻腔和口中插入 6 英寸长的签子（如棉签）持续几秒钟并旋转。随后肿胀消退，收集到足够的鼻腔样本。然后将签子放入容器并送到实验室进行逆转录聚合链反应（PCR）检测，该检测可以检测新冠冠病毒
    SARS-CoV-2 呼吸道标物的 RNA。它被广泛用于有症状和无症状个体。医护人员、应急响应人员和其他服务人员，在 COVID-19 高风险地区暴露于感染患者的人员也在接受检测。检测的准确性和特异性是从采集样本到获得检测结果的耗时费力的人工过程。目前核酸检测的灵敏度（约
    70%）导致许多疑似患者在得出确诊结果前需要在好几天内进行多次检测。


    **关键词—** X 射线、COVID-19、计算机辅助诊断、筛选工具、深度学习、图像检索


    因此，需要一种用于快速分诊、易于获取且具有便携性的自动化系统。在一些早期研究 [2-8] 中，发现患者在胸部放射检查中表现出的异常（例如 X 射线或胸部 扫描
    (CT) 成像）是感染新型冠状病毒者的特征，表现为早期的双侧、多灶性玻璃样影变且呈后部分布（主要在下叶），以及晚期的肺性实变。然而，这些发现可能控制病毒传播和抗击
    COVID-19 方面起着至关重要的作用。例如，CT 扫描是筛选和诊断包括肺炎在内的多种疾病最易获取的检查方法之一，可以补充 PCR 测试。然而，手动解释
    CT 图像取决于放射科医的经验，尤其是大多数视觉判断对于从其他肺炎中检测出 COVID-19 是必要的。此外，即使在可用的情况下，能够读取 CT 扫描的专家也仍然短缺。因此，非常希望有一种计算机辅助诊断
    (CAD) 系统，让放射科医生能够更快速、更准确地解释放射图像以检测 COVID-19。尽管机器学习结合放射学可能有助于该疾病的准确检测，并有助于解决偏远村庄缺乏专科医生的问题。


    来自来自几个可用数据集的 X 射线图像，用于在 COVID-19 与其他肺炎（例如细菌性肺炎和非 COVID-19 肺炎）以及健康受试者之间进行分类。


    特征有效表示图像结构和特征的描述性以及有效处理类内差异和类间相似性的能力对于实现良好的分类和检索至关重要。模式识别领域的近期研究强调了卷积神经网络（CNNs）解决分类、分割和目标检测等任务的能力，达到了顶尖性能。这归功于
    CNN 学习原始数据层次化表示的能力，能够在无需手动设计的情况下捕捉内在特征。深度学习架构由线性非线性变换的组合组成，以获得数据的各种实用表示。这种数据驱动的表示丢弃了无关信息和特征，仅保留对目标任务的特征。自动特征学习或从图像中学习深度数据与手动提取内在特征有所不同，并为手工特征提供了替代方案。通过特征学习方法的多样性，可能为特定应用（如分类
    [10]）定制特征。


    深度学习系统潜在地可以协助临床医生在分诊和治疗高危患者时识别与 COVID-19 相关的异常，并帮助克服用于机器学习开发的 COVID-19 图像可用性方面的困难。因此，许多提出的方法在较小数据集上基于迁移学习显示出很有前景的结果。例如，使用了三个深度学习模型（ResNet50、MobileNetV2
    和 Inception）从 X 射线图像（50 张 COVID-19 图像和 50 张正常 X 射线）中检测 COVID-19，评估显示 ResNet50
    模型达到了最高准确率，其次是 Inception [3]。Hindi 等人 [12] 提出了 COVID-Net（一种深度 CNN 网络），在 5941 张胸部
    X 射线数据上检测 COVID-19，准确率为 83.5%。CADNet 技术在 [3] 中通过微调预训练的 ResNet50 架构来提高模型性能。Haram
    等人 [8] 提出了具有多个卷积层的 CADNet 模型，用于每层进行特征过滤，在大多数病例（COVID 对非 COVID）中分类准确率为 98.8%，在大多数病例（COVID
    对非肺炎）中准确率为 87.02%。还有使用各种深度模型结合 CT 检测 COVID-19 的近期研究 [13–15]。


    然而，这些许多系统是非交互的，且演示缺乏解释决策原因的能力。如果放射科医生能通过交互方法对决策过程感兴趣，将更有效；但疾病病例数据库中的病例数量有限，与我们的研究类似，这允许我们预测拍摄图像的质量。我们的假设是，通过提供一组病理确认病例作为计算机输出，系统可以学习预测而不是建议第二次需求。在过去几年，使用胸部
    X 射线检索 (CBIR) 搜索相关图像的诊断 CAD 系统吸引了大量研究，为放射科医生提供了视觉辅助，并增强了他们对 CAD 决策结果的信心。此外，CBIR
    将是学生、住院医生和经验较少的放射科医生培训的有用工具，帮助他们查看相似但病理可能不同的图像，并帮助他们观察当前病例中的模式如何与之前的病例相似。


    近期研究表明，深度学习的使用可以显著提高 CAD 系统的性能，例如图像分类（病变检测）、乳腺摄影乳癌检测、肺分割以及 3D 脑图像流形的分割 [11]。胸部
    X 射线上的深度学习技术用于 COVID-19 检测也越来越流行，正如最近观察到研究界存在发表热潮一样。在成像领域，大部分的研究仅使用


