    图 1 表示所系统的架构，分为离线和在线阶段。


    特征提取是医学图像的关键方法。在选择有效特征时，研究重点在于捕捉图像的颜色、纹理和形状。X 射线图像特征的描述性和判别能力实现了良好的分类和可靠的性能。与其使用任何手工特征，可以使用迁移学习技术利用
    CNN 模型从小数据集提取 X 射线图像的特征。迁移学习提高了特征提取的效率，因为它被证明可以用更少的数据和更少的训练需求提高模型准确性。在 ImageNet
    等大规模数据集上训练的 CNN 已经在迁移学习任务中证明了自己。网络学习一组判别性特征来表示各种物体 [19]。使用预训练的 CNN 作为特征提取器而不是从头开始训练是有效的，因为它从数据更丰富的地方转移了学习成果（即滤波器），并避免了耗时的训练需求
    [20]。


    离线阶段（左侧）涉及为了索引之目的而对数据库图像进行预处理和特征提取。在传递给特征提取网络之前，对图像进行缩放和像素归一化处理。我们的特征是使用在卷积去噪自动编码器上训练的
    CNN 在潜空间中生成的特征，以及 ImageNet 数据集上若干其他基于迁移学习的深度特征提取（不包括 CNN 的最后两个全连接层）。该系统通过缩放大小对所有数据库图像进行预处理。使用迁移学习方法，通过传递图像来提取数据库中图像的深度特征。


    为了执行基于迁移学习的深度特征提取，我们使用 VGG-19、ResNet-50 [22] 和 DenseNet[69] 作为在包含 1000 个案例的 ImageNet
    数据集上的预训练 CNN 模型。这些学习到的特征被用于检索可靠准确的分类结果。VGG-19 由 16 个全卷积层组成，已作为基准特征提取器使用 [21]。残差学习
    ResNet 是另一种由 VGG 架构构建的神经网络。典型的 ResNet 模型使用带有三重非线性（ReLU）和批归一化的瓶颈层 [22]。跳跃连接有效率简化了网络，在初始阶段使用较少的层。这通过减少网络中传播的层数来减少梯度消失问题，从而加速了学习。然后我们逐渐更新跳跃层。传统的分层
    CNN 具有 L 个连接——每层与其后续层之间有一个连接——而密集卷积网络（DenseNet）具有 L(L+1) / 2 个连接。对于每一层，所有前层的特征图都作为输入，并将其自身的特征图加到所有层
    [25]。密集层是窄的 n（每层 12 个滤波器），仅向网络的“集体知识”中添加一小部分特征图，并保持特征图不变——以及基于网络中所有特征图的最终分类器。


    输出层的原始数据。类似于主成分分析（PCA），自动编码器可以获得数据与代码空间方向之间的映射。


    表 1. 预训练 CNN、特征提取层和维度


    | 网络 | 特征提取层 | 特征维度 |

    |---|---|---|

    | Resnet50 | 全池化层 | 2048 x 1 |

    | Densen169 | 全池化层 | 1024 x 1 |

    | VGG19 | 全连接（密集）层 | 4096 x 1 |


    ![](img/e62b4ae95084b48527fba145217ae057_3_0.png)


    图 2. 我们提出的自动编码器架构


    去噪自动编码器是一种学习去噪图像的前馈神经网络。通过这种方式，网络在图像上学习有趣的特征。如果自动编码器已训练以编码图像，我们可以使用网络的编码器部分来学习数据集中的图像表示。通过堆叠去噪自动编码器构建的去噪自动编码器
    (dda) 用于无监督学习和分类检索。我们提出的编码器-解码器架构 (2) 使用卷积层接收输入图像并尝试重建图像。编码器将输入图像 (224 x 3) 通过卷积层、批归一化和
    ReLU 压缩为更小的特征图。（此处后续重复内容已省略）

