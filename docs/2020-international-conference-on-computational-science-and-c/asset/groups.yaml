    categories, improving specificity. Furthermore, an integrated system based on
    both classification and retrieval would be more effective and robust compared
    to individual classification or retrieval approach. To address the limitation
    of the CAD in detecting Covid-19 and the chance of using CBR to provide clinical
    decision support for medical images of diseases, this paper proposes an integrated
    classification and retrieval Decision System (DSS) for detection with an ‘user
    easy’ interface fusion and ensemble techniques in deep features. Deep features
    are extracted by using transfer learning in pre-trained CNNs and deep autoencoder.
    Our method uses deep features by fusing combinations using a canonical correlation
    analysis. Based on image-based visual queries submitted by radiologists, the proposed
    system would retrieve by displaying images of each case as well as classifying
    the image category as different. Although radiologists play a key role due to
    their vast experience in this field, the proposed DSS can assist to obtain accurate
    diagnosis and eliminate as insufficient number of available RT-PCR test kits,
    test times, and limited test of results.


