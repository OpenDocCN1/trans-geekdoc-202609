    # I. INTRODUCTION


    **Abstract—** The COVID-19 pandemic is the defining global health crisis of our
    time which is currently challenging families, communities, health systems, and
    governments all over the world. It is critical to detect and isolate positive
    cases as early as possible for timely treatment to prevent further spread of the
    virus. It was found in early studies that patients present abnormalities in chest
    radiography are characteristic of those infected with COVID-19. In the current
    context, an accessible and automated screening tool is needed to make a quicker
    PCR test, especially with limited available X-ray machines and dedicated kits
    in labs and hospitals. Several approaches have been proposed based on deep learning
    using supervised transfer learning techniques on Convolutional Neural Networks
    (CNNs). These block approaches are largely non-interactive and their predictions
    suffer due to a lack of labeled data. This work focuses on the development of
    an automated system for COVID-19 by performing feature learning using deep neural
    networks with a driven approach and retrieving images based on an query. Our method
    provides a benchmark towards the goal of realistic comparison and real interaction.
    The system is trained and tested on an image of 1700 Chest images from two different
    resources with encouraging results based on precision and recall. It is hoped
    that the proposed system may help reduce the visual error of human operators and
    enhance sensitivity for Covid-19 detection.


