    表 2. 平均精确率


    数据收集和评估是验证检索或分类系统有效性的最后也是最重要的步骤。由于存在具有 COVID-19 症状的新 X 光图像，这很大程度上阻碍了 AI 方法的研发。我们假设与
    COVID-19 相似的其他感染可以用于训练能够识别这种新疾病的模型。对于我们的实验，我们使用了来自 NIH 数据集和公开的 COVID-19 胸闷的 1580
    张组合 X 光图像 [27]。NIH 数据集包含 30,805 名唯一患者的 112,210 张正面图像。该数据集包含异常的肺部和心胸疾病，包括结节、气胸、浸润，


    在我们的数据集中，图像（75% 和 25%）分别被用于训练（总共 1700 张）和图像查询（文本）检索。检索 2 显示了加权平均精确率。我们基于 DenseNet19
    开发的自动编码器获得了 0.4368 的最佳结果。该值在所有应用方法中获得了最佳平均值。图 3 显示，基于 DenseNet19 的深度特征在我们的数据集上具有最高精确率。相似性度量对于
    EUD 和 MSE 均获得。然而，基于 AutoEncoder 的性能优于其他方法。欧几里距离证实了表 2 中的结果。图 4 显示了检索界面的快照，顶部是查询图像，底部显示
    10 张最相似的图像（使用 MSE 作为距离度量）。总体而言，界面对用户友好，可以通过不同的选择进行检索。


    ![](img/e62b4ae95084b48527fba145217ae057_5_0.png)


    ## 结论


    本文提出了一种基于学习的检索系统用于检测 COVID-19 和异常肺胸。假设这种系统将极大改进筛选过程。然而，为了更好地筛选、诊断，将此类系统与临床发现和实验室结果相结合是重要的。未来，我们将利用来自多个源的信息。


