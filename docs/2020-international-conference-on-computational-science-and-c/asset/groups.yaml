    基于代表每张 X 光图像的深度特征对数据集进行分类。由于深度学习将数据转换为可区分的特征，提取特征的相似性也可以推导出图像的相似性。基于内容的检索（CBIR）算法的搜索和检索取决于距离度量衡量相似性的有效性。当前的
    CAD 方案在使用 CBIR 技术（如 k 近邻搜索方法）时搜索 k 个最相似的参考（图像）。差异（距离）越小，计算机对比较图像的“相似性”水平越高。查询图像（图像）特征向量与参考（图像）特征向量之间的差异使用不同的距离度量计算，例如查询图像与数据库之间的欧几里距离、曼顿距离和余弦相似性。因此，应用于特征集的距离度量的有效性至关重要。选择距离度量时还应考虑计算效率和速度。在本文中，均方误差（MSE）、相关距离（COD）和欧几里距离评估了这些度量的准确性。计算向量
    X 和 Y 之间的距离为：


    ```

    MSE = \frac{1}{n} \sum_{i=1}^{n} (X_i - Y_i)^2

    ```


    MSE 表示点集之间回归线的距离，如下：


    ```

    MSE = \frac{2}{n} \sum_{i=1}^{n} (X_i - Y_i)

    ```


    较低的 MSE 表示相似性更好，反之亦然。而 COD 衡量向量之间的线性和非线性关联


    ```

    COD = \frac{2}{n} \sum_{i=1}^{n} X_i Y_i

    ```


    肺不张、肺炎、胸腔积液增厚、水肿、心肌病、肺气、纤维化、实变。一个图像中存在多种疾病被标记为多标签集。Covid-19 图像由专业放射科医生标记为 COVID-19
    检测，并收集自近期发表的论文和文章 [28]。


