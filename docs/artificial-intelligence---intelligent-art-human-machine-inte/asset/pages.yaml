    is: Instead of text just referring to other text, here text is correlated with
    image information. This raises the hope that arbitrary signs can be linked to
    things in the world to produce grounded meaning.


    Harnad’s hypothesis that neural networks in particular could address the grounding
    problem has recently been taken up by media scholars Lehr Weatherby and Brian
    Justin with their notion of “indexical AI”. It is named after Charles Sanders
    Peirce’s notion of the index. Unlike the symbol, which has a purely conventional
    relationship to its refer (as “dog”, “chien”, and “Hull” all refer to the same
    thing), the index is causally linked to it (as smoke refers to fire).


    With this coinage, the authors make Harnad’s project the basis of a description
    of contemporary technological culture: “Digital systems, relying on the neural
    network, have left the world of symbol behind and have to ground themselves here,
    now, for you – they are able to point to real states of affairs.” (Weatherby andie
    2022)¹² Neural networks bridge the world – as data on which they have


