    new roles of artists in working with AI. Moisésorta Valenzuela explains:


    Sometimes I''m overfitting the model which is like you train it on very few data,
    but you augment it. So, e.g. originally had 13 minutes of data but you augment
    it with some techniques and then it learns. But it''s all just that. So, when
    you train the prior to loop it''s really constant, but it becomes this kind of
    phantom transitions of the neural network that''s always trying to make this loop
    and these transitions because it just knows this data. But kind of fit because
    I augmented it. And then using this with some other model I trained [...]. (in
    Tillmann 2022, appendix, CX)


