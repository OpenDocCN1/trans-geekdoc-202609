    For AI researchers who seek to make computers more human, this state of affairs
    describes what cognitive psychologist Stevan Harnad called the “symbol grounding
    problem”: Symbols, like those in Weizenbaum’s transformation operation, have no
    intrinsic meaning for computers, without the background of practical knowledge
    of the world, they can only refer to other symbols, to any reality beyond them.
    They are not grounded in the world, and there is no way out of this “symbol/ symbol
    merry-go-round. Whatever meaning there is can only “parasitic”, and is projected
    onto by human interpreters. (Harnad 1990:340, 339)


    Harnad’s criticism, however, was directed against one particular type of AI, which
