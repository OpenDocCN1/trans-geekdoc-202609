    The key issues in AI ethics include the concentration of power and resources in
    a few major platforms (such as OpenAI and its CEO Sam Altman), the digital disenfranchising
    and victimization of socially disadvantaged people, the danger of misaligned goals
    (such as automated drones), the non-transparent scraping and annotating of data,
    the non-transparent demands on energy, and water resources of huge data centers,
    and more. Indeed, the blanket rejection of technologies by the very people who
    are responsible for its inception is irritating. Others (Chellappa 2022) are more
    sane, highlighting the potential of AI in aiding and improving human decision-making.

    The even frantic debate about ChatGPT and GPT-4 seems to be narrowly engaged with
    issues of ethics and education. The ability to simulate meaningful discourse poses
    grave ethical questions and has rightly led to hectic responses in the world of
    education, the issues go beyond the protection of fake news or deepfake images.
    The focus has largely remained on the machine mimicry of human creativity with
    words, images, music, and other traditional means of expression, while the larger
    dimension of an expanded and potentially new machine art that works in both generative
    and multimodal ways, has so far remained under the radar.

    In both ethical and aesthetic respects, data curation and documentation are essential,
    reflecting the fact that creative processes (rather than merely its products)
    must be seen as an inalienable and, on the contrary, crucial part of aesthetic
    practice and the field of art. Just as as a student without knowing how the text
