    own terms suggests the philosophical influence of the nature of art” (136). Art
    no longer leaves it to philosophy to settle the score. Instead, such philosophical
    reflections have become integral to the artistic practices, processes and products
    (if any) themselves.


    The material, stylistic and morphological consequences of this is summed up by
    Lucy Lippard with her notion of the ‘dematerialization of art’. A kind of conceptual
    (with a capital C) in which the idea and the material form is secondary, lightweight,
    ephemeral, cheap, unpretentious and/ ‘dematerialized’. (1973) This explains why
    art after Duchamp does not have a specific style and can look like anything –
    not specific at all. It can be any material, “anywhere and at any time by anybody”
    (s), even the formalist artist critic Greenberg, who shortly displaced Duchamp
