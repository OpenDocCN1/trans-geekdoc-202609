  md: '# # Sound of Contagion – An Artistic Research Project

    Exploring A.I. as a Creative Tool

    for Transmedia Storytelling


    Wenzel Mehnert, Robert Laidlow, Chelsea Haith & Sara Lauschber


    # ## Introduction


    Sound of Contagion (SoC) is a transmedia art project addressing the cultural narratives
    surrounding global diseases and pandemics through different media. It is born
    out of the collaborative partnership between the University of the Arts in Berlin
    and the University of Oxford and explores the usage of Artificial Intelligence
    (A.I.) in creative processes. We used texts written by the machine learning algorithm
    GPT-2, which was trained on narratives about pandemics from the last 2500 years.
    From the resulting text fragments we built a world that serves as a basis for
    narratives, illustrations, musical compositions and a lecture performance.


    Besides the aesthetic and creative output, the project is a research endeavour
    that explores the usage of A.I. as a creative tool to facilitate interdisciplinary
    working. Through the practical collaboration between artists, researchers and
    technology, the imaginary A.I. can independently and consciously create art is
    shifting towards the notion that A.I. becomes a tool that inspires and encourages
    collective-creative processes. This, work follows a collaborative paradigm and
    acknowledges A.I. as a creative tool with its own unique aesthetic.


    This article is an insight into the project. It is a case study of how A.I. is
    used as a creative tool within an interdisciplinary collective working in the
    fields of literature studies, cultural studies, composition and visual arts.


    # ## About the project


    The project Sound of Contagion (SoC) understands itself as a practice-based research
    project that uses artistic practices as an approach to understand A.I. as a creative
    tool. It is borne out of the Oxford / Berlin Creative Collaborations activities
    (supported and funded by the University of the Arts in Berlin (Germany) and the'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Artificial Intelligence – Intelligent Art?


    University of Oxford (UK), which fosters projects and research across the arts
    and humanities, supported by the Mindero Foundation through the Mindero-Oxford
    Challenge Fund.


    From the beginning, we focused on an interdisciplinary collaboration, as each
    member had a different artistic and academic background: Chelsea Haith, with a
    background in publishing, journalism and gender studies, and Wenzel Mehnt, with
    a background in cultural studies and narratology, represented the humanities.
    Sara Laubcher, working as a professional illustrator, and Robert Laidlow, composer,
    researcher and AI-expert, represent the artistic side. Through the interdisciplinary
    nature of the project, it started with several different research questions that
    were guiding the thought process without limiting the creativity and necessary
    openness of an artistic research project:


    How can A.I. be used as a tool within an interdisciplinary, creative project?
    How do we acknowledge the unique agency of the tool? How do we integrate within
    a human-technical collaboration?


    The project started in the beginning of 2020, shortly after the Covid19 virus
    was first reported in Europe. We took this global transition into the unknown
    future of lockdowns and social distancing as the starting point for our endeavour.
    Through the international distribution of our project partners and the lockdown
    situations, we were forced to set up the project solely through digital communication
    technologies like Zoom and Miro. Some of us had not met in person, but only digitally.


    # Dataset, Data & Processes


    # Dataset


    Cognitively occupied with the pandemic, the project became an opportunity to process
    and deal with the shifting situation through the experiences. We decided to work
    with narratives of previous generations and how they dealt with pandemics, epidemics
    or similar global phenomena. Principally led by Chelsea Haith at this stage, we
    selected texts, all dealing with pandemics and plagues, as the dataset to train
    the A.I. and curated the selection from the last 2500 years of pandemic literature.
    We permitted novels and plays only. One reason was the focus on narratives and
    reappearing tropes that could hint at cultural patterns, the other, that we were
    interested to see, what a machine learning algorithm might do with these. The
    selection of dataset already had interesting consequences for the outputs generated.


    We divided the texts into two data sets – Sophocles to the year 2000 was one data
    set, and texts published between 2000 to 2020 the other. This splits the total
    dataset roughly in half. This split provoked its own insights into cultural preoccupa-'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Wenzel Mehner, Robert Laidlow, Chelsea Haith & Sara Laubcher: Sound of Contagion


    in the last two decades as well as the increased popularity and thus production
    of dystopian and apocalyptic narratives in popular literature in the same period.
    As a total data set, these serve as cultural artifacts and represent the collective
    memory from which we draw and confront the changing environment. The earliest
    of our selection was David Mulroy''s translation of Sophocles'' *Oedipus Rex*
    (Sophocles, 2014 [49 BC]), while the latest was Lauren Beukes'' *Afterland* (2021).
    These texts were used to train the A.I. model with the aim to generate new text
    fragments based on the dataset.


    # Data


    To create an A.I. model that could generate new texts, based on existing texts
    referring to pandemics, we first had to make two decisions:


    +   - What would comprise the dataset upon which the A.I. was trained?

    - Which A.I. algorithm would we use?


    The choice of training data has been shown to make an enormous difference to the
    output of generative A.I. algorithms, even when other parameters are left the
    same (Leeming 2022; Mehri et al. 2017; Caillon & Esling 2021). Similarly, two
    different A.I. algorithms trained on the same kind of dataset can produce entirely
    generics; for example, *WaveNet* (Van den Oord et al. 2016) trained on Beethoven
    sonatas with e.g., PRISM-SampleRNN re-implementation trained on the same (Melen
    2020).


    We first decided the choice of A.I. algorithm, which was to be GPT-2 Simple (Wolff
    2019). GPT-2 Simple is a reimplementation of the popular and well supported GPT-2
    A.I. algorithm (Radford et al. 2019), developed and released by OpenAI. We chose
    this algorithm because of its capacity to be fine-tuned to produce specific types
    of text, while utilizing rules it learned through general training. In this context,
    fine-tuning means that we began with a GPT-2 model that had already learned the
    ''rules'' of English and then directed this model to apply to of our dataset.
    We found it much superior for the task we had in mind other contemporary algorithms,
    which relied only on the fine-tuned dataset (e.g., WordRNN). We also had prior
    experience with this algorithm (de Roux et al. 2019) which helped in speeding
    up the early process. Finally, GPT-2 Simple is easily accessible online through
    Google Colab, and does not require a GPU on personal computer to train. This allowed
    each member to access it with their own machine during COVID-19 lockdowns, facilitating
    easier discussion and collaboration.


    For the choice of dataset, we decided upon a set of 21 pandemic-related fictional
    texts, from across the last two millennia (as described above). This decision
    was reached as a compromise between wanting a substantial amount of data to train
    GPT-2 Simple and on our interest in being able to – or at least, thinking we were
    able'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Artificial Intelligence - Intelligent Art?


    to – draw links between specific GPT-2 Simple generations and specific works in
    the dataset. We felt identifying the A.I. algorithm''s reference points would
    assist in the world-building and narrative prose elements of the project.


    # Training the Models


    We initially trained GPT-2 Simple several times using this dataset, creating a
    variety of models. Most important parameters included the base type of model that
    we then fine-tuned (124M or 355M), how the dataset was divided, and how many steps
    the model was left to train before we sampled generations from it. From this initial
    experimentation and iteration, we chose a set of parameters we felt were most
    suitable for our project. This decision was made collaboratively and subjectively,
    according to our qualitative judgment of the models'' text generations.


    To create the test, we made the following decisions:


    We used the 124M model as base. Generations from this baseline model tended to
    reflect more strongly the ideas of pandemics that our dataset focused upon.


    We split the dataset (in full, 12MB in size), into two halves. These were texts
    written prior to the year 2000 (8.1MB in size) and post-2000 (5.7MB in size).
    Each dataset was more heterogenous than the full dataset, which allowed for finer
    control of text generation.


    We trained the models for 4000 steps on Google Colab.


    Once we created the two fine-tuned models (pre-2000 and post-2000), we sampled
    text generations from them. These generations were both ''seeded'' and ''not seeded''.


    In this context, seeding meant that the beginning of a sentence and the A.I. algorithm
    continued from that point. Not seeded allowed us to ''point'' the model towards
    talking about specific elements of pandemics, whereas not seeding us to see how
    the model would ''write'' without a specific context, after being fine-tuned on
    a pandemic dataset. Generations also have a ''temperature'' between o and which
    is a rough index of how much randomness is introduced into the system. The ''temperature''
    of the generations we created was generally 0.8 as this gave us texts that, in
    our opinion, at least some kind of sense. There was some variation, with some
    generations being as high as 0.95 or as low as 0.5.


    On balance, the fine-tuning method seemed to be a success in that the models would
    consistently write about plagues, fevers, illness, chaos, destruction, displacement
    and other related themes, even when they were not seeded. While the models did
    not appear to overfit (copy exactly from the dataset), it was sometimes clear
    some parts of the dataset had a greater prominence in its generations. A stand-out
    example would be Stephen King''s The State (1990) in the pre-2000 dataset, which
    was particularly long at 1152 pages.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Wenzel Mehner, Robert Laidlow, Chelsea Haith & Saura Laubcher: Sound of Contagion
    101


    Through this iterative process of training, sampling, dataset adjustment, and
    further training, we began to get a feel for how the fine-tuned models wrote,
    and how we might get different kinds of responses out of them. We instructed the
    two models in exactly the same way, providing us with a contrasting pair of generations
    for each seed. The post-2000 model, for example, was prone to creating successive
    lines of dialogue. We used several texts from that that were seeded with a single
    quotation mark and with single-word pronouns. The pre-2000 model more often described
    landscape in more poetic language. From the pre-2000 model we utilized more generations
    seeded with phrases like ‘the pandemic’, ‘the plague’, and ‘when it began’.


    With the training of the models complete and several hundred generations sampled,
    the project moved to the next stage involving world-building, narrative probes,
    and transmedia collaboration.


    # A.I. as a creative tool


    One of a guiding principles of the project was to treat the results of the A.I.
    as a unique form of creativity and acknowledging the creative agency of the algorithm
    with its own flaws and failures as a new aesthetic form. One of these “failures”,
    in the context of fictional writing, is that the text itself does not hold any
    sense – as the author did not create any sense in the place. One of thought that
    helped us understand our relation to this text comes from Roland Barthes famous
    essay The death of the author (1978 1961). Here Barthes proclaims that the origin
    of a text does not lie with the author, but with its destination: the reader (142
    ff.). Barthes starts with a description of an author who argues against:


    > The author, when believed in, is always conscious of the place of his own book:
    book and author stand on a single line, divided into a before and an after. The
    author is thought to nourish the book, which is to say that he exists before it,
    thinks, suffers, lives for it, is is in the same relation of antecedence to it
    as a father to his child. (145)


    In our case, there is no author – it is not even as that has never been alive
    – and there no message or moral to convey is purposefully inscribed in the text.
    Furthermore, the A.I., particularly the GPT2 algorithm we used, still lacked a
    semantic understanding. It did not make connections between the characters, or
    the places mentioned in the text fragments. Rather, the A.I. produced text fragments
    that are similar to the narratives used as training data, without understanding
    the context or the connections between the elements of the narratives. It recombined
    the passages'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Artificial Intelligence – Intelligent Art?


    we fed it with it, and the results are an arbitrary combination of different writings,
    like Barthes describes in the following:


    A text is made of multiple writings, drawn from many cultures and entering into
    mutual relations of dialogue, parody, contestation, but there is one place where
    this multiplicity is focused and that place is the reader, not, as was hitherto
    stated, the author. The reader is the space on which all the quotations that make
    up a writing are inscribed without any of them being lost; a text''s unity lies
    not in its origin but in its destination (148).


    In the context of fictional writing, this means that the meaning of a text is
    given by the reader, who constantly creates the sense and searches for coherence
    – this is particular when reading text fragments created by a GPT2 algorithm,
    as they not only lack meaning but also forces the reader to constantly seek for
    a meaning and brings the reader into the active role of interpretation and drawing
    connections. The non-coherent text created by the A.I. is a unique perspective.
    This is the unique aesthetic of text fragments produced by a GPT2 algorithm. Thus,
    the A.I. is not capable of doing it, the practice of sense-making and creating
    coherence had to come from us.


    # Worldbuilding


    For reason and following the guiding principle described above, we considered
    all the text fragments as Narrative Probes (Fischer & Mehmert 2021). Narrative
    Probes are flash fiction as narratives that all probe into the same possible world,
    following a specific logic that we had to uncover. The narrologist Marie-Laury
    Ryan uses the metaphor of the text as windows to the extralinguistic realm of
    characters, facts, and states of affairs serving as references to the linguistic
    expressions (Ryan 2001: 91) Reading and getting immersed into literature transports
    your mind into this extralinguistic realm, a world that constantly formed in your
    head as you read out.展现 & Taylor call this process worldbuilding and constitute
    that the reader carries out a construction of a world by pieces pieces to structure
    in place evaluating the pieces in the light of what is known about the world so
    far, and, conversely, evaluating the whole world in mind, we treat the text fragments
    as a multitude of windows that showed us snippets of a storyworld that as readers
    had to piece together. Therefore, through a structured deconstruction of the text
    fragments, engaged in a worldbuilding process based on the textual cues that we
    found in the fragments, loosely building on the work of Wolf (2012) and Mehmert
    & Fischer (2021):'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Wenzel Mehner, Robert Laidlow, Chelsea Haith & Sara Laubcher: Sound of Contagion
    103


    In the first step we detected the elements of the world. For this process, five
    cues were of specific importance to us: Places, events and references to time,
    characters mentioned, values and norms as specific objects.

    In the second step, we enriched the elements with additional information that
    either came from the text or was already given by the logic (e.g. when the text
    refers to a leader, there is also a group of people following).

    The third step was to create connections between the enhanced elements (e.g. if
    two characters were mentioned in two different text fragments, and we assume they
    both exist in one world, what is the connection between the two?).


    # Example


    To give an example, we will explain the process with the following two text fragments:


    Fragment I:

    They came to a real leader, they said to each other. A real man, not a fake leader,
    not an actor who pretended to be a leader. He was real. He lived, and he led his
    people to a real leader. This real man was the one they called their real leader.
    He was named Mannum, and Mannum knew this about himself; he had practiced seduction
    and charm the time. The pandemic of war had begun.


    Fragment II:

    "Then, friend," said Piranesi,"make death eternal in the liquor laws, so that
    no person may return to drink after consuming what they drank".


    In Fragment I learn two important things about the world: (1) In this world exists
    a character named Mannum. We can say that Mannum is not an honest leader and a
    god liar, thus is not to be trusted and rather an evil character. (2) We also
    have an event, the pandemic of war stands in connection to Mannum as it has been
    mentioned right after. So in the world that we want to explore, there is some
    kind of biological war going on but we do not know why and who is involved.


    In Fragment II, two characters are mentioned. The first character, named Piranesi,
