    # Composing and Songwriting in Practice


    Composing and Songwriting can be understood as complex creative processes to create
    specific musical forms and expressions, depending on the goal and purpose (such
    as song, film music, theater music, radio jingles, advertising jingles / music,
    radio plays, or special genres). If one asks OpenAI''s GPT-3 what songwriting
    is, the following was generated in a request in February 2023:


    Songwriting is the process of creating a musical composition to express emotion,
    ideas, or stories. It requires a combination of creativity, knowledge of music
    theory, and technical skill in the production of the music. It typically involves
    the composition of melodies, chord progressions, and lyric writing.. (OpenAI Playground
    2023)


    However, further influences and practices such as the creation of melodies and
    rhythms, chord voice leading, instrumentation and arrangement (Moore 2013; Perricone
    2018; Moylan 2020). Also, in the age of digital music production, it includes
    the design of sounds and tools to create sounds. Processes of writing parts of
    the song often overlap with production-oriented tasks in Digital Audio Workstations
    (DAW). Also, songwriting and composing are often collaborative efforts of distributed
    creativity (Clarke / Duffman 2017) and with different expertise, including situated
    non-verbal communication, embodiment and affect, musical interplay and interaction
    in creative practices (Bennett 2011, 2012; Barrett 2014; Thompson 2015; Bishop
    2018; Cook 2018).


    # AI and Songwriting in Practice


    In the following paragraphs, we will discuss three main findings from expert views
    and will accompany them with findings in literature. The three points are: 1)
    working with AI in general, 2) potentials and creative approaches, and 3) challenges
    and risks.


    # Working with AI and its impact on the creative process


    While in the field of experimental computer music or algorithmic composition,
    programs have been developed since the 1950s, and it is only since the 1990s that
    a (very)


    > Horta Valenzuela (sound artist, technologist and musician), and Jovanka von
