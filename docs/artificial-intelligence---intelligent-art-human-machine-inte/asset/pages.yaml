- pgno: 68
  md: '# Synthetic Form


    In this section, we ask how artists can guide neural networks when creating volumetric
    forms, and what happens when AI meets materiality. After working for a while with
    DL tools that produce 2D outputs, it is an obvious step to explore possibilities
    to produce 3D results. To our surprise, it was not an easy task to find the solution
    (Oct 2021). Psychedelic Forms is a series of sculptures in ceramics and recycled
    plastic through which we investigated the possibilities of AI in producing physical
    sculptures. The project re-interprets antique culture in the contemporary language
    and tools.


    Following the same paradigm shift as the previous section, text2mesh is a CLIP-based
    model that does not require a dataset, a 3D object and text prompt as input. Here,
    the model actually does not create a 3D model but stylises the inserted one. And
    it is guided by input text.


    The criteria for selection were the following: first, the form had to be intriguing,
    and second, it should be possible to produce it in material afterwards. It was
    clear that we had to modify each model because the physical world has gravity,
    and the DL model does not take this into account. Some generated models were discarded
    because they were seen as not-fixable, although interesting in their shape.


    The process demonstrated here is quite an unusual way to create an object. After
    extensive experimentation with the tool, we learned how words words shapes and
    colours. This knowledge gave us a chance to treat prompts as poetic input. Thus,
    we created short poems to guide NN. The best ones survived as titles and are reflected
    in the forms.


    The artists did not strictly follow the original model but took the creative liberty
    to modify the shape and determine the colour by manually glazing the sculptures.
    The dripping technique was used for the sculptures. This served as a metaphor
    for liquid latent space and the psychedelic production process (this was the artists''
    inner feeling about the creative process because they did not know what results
    would be achieved in the end).


    Sometimes, AI-generated vertex colouring was taken as inspiration, sometimes totally
    ignored. Nevertheless, digital sculptures were exhibited alongside the physical
    ones to undergo the transformation and human role in the creative process. Although
    ceramic sculptures were 3D printed in, the fabrication process had to follow the
    traditional way of producing pottery (see final sculptures in figure 5).


