  md: '# Jens Schröter: AI, Automation, Creativity, Cognitive Labor 37


    to transcend cotidian, rational consciousness by these techniques; the idea was
    to release unconscious impulses and energies.


    Surrealism''s discourse on automatic strategies in art was very different from
    Shklovsky''s approach. While Shklovsky expected of art to overcome automatization,
    Surrealism used ''automatic strategies''—however, the surrealists did not understand
    ''the automatic'' as a set of mechanized, formulaic forms (as Shklovsky did) but
    on the contrary as that, by its spontaneity, disrupted rational consciousness.
    The goals, however, were comparable—to transcend conventional, cotidian consciousness,
    to open up new possibilities of perception and presumably. I will come back to
    these early strategies of art to cope with the automatic below.


    # A constellation in the 1960s


    We make a jump to the 1960s. After 1945 new technologies emerged—computers to
    spread, from 1946 to 1953 were the Macy conferences on cybernetics and in the
    1956 Dartmouth conference was held, which developed the notion of "artificial
    intelligence." It was, among others, the promise of these radical new technologies
    that led to new waves of fear. As Amy Mix (2000) has shown in her magisterial
    study Inventing Ourselves out of Jobs, automation and its advantages in terms
    of productivity and its possible disadvantages in terms of unemployment were intensely
    debated issues in the United States after 1945 and especially since the 1960s.
    Whatever is nearly automatically done by humans, whatever is a human automatism
    in principle can be automated. In fact, Understanding Media by Marshall McLuhan
    (1994: 346–359) from 1964 is a somewhat enigmatic last chapter on automation.
    Ever emerging media theory could not do otherwise to react to the discussions
    on automation and labor in the 1960s. Only some years later the idea to produce
    artworks in a creative style with the aid of computers.


    In 1967, Michael Noll published his essay "The Computer as a Creative Medium".
    Noll argued that "creativity has universally been regarded as the person and somewhat
    mysterious domain of man" (1967: 89) and describes the computer as a new medium
    for the artist and speaks of the cooperation between artist and this medium. But
    although he does not argue that computers could or replace artists, the experiment
    he describes is in a way about precisely that. He made a synthetic Mondrian and
    asked a presumably non-representative sample about the two images:


    In general, these people seemed to associate the randomness of the computer-generated
    picture with human creativity whereas the orderly bar placement of'
