  md: '# Jan Torge Claussen: The Roughness of Neural Networks 265


    the concert hall: "Those involved with the composition of experimental music find
    ways and means to remove themselves from the activities of the sounds they make.
    Some employ chance operations"Cage 1961:10). In principle, however, a certain
    degree of loss of control is present in every musicking thing. Game theory, for
    example, makes clear what may apply to musicians and their instruments, namely
    that players not only play a game but are also played by it (Claussen 2021; Huizinga
    1998). And Pierre Boulez states for the aleatory piece of music, that it is like
    a labyrinthing a number of possible paths, that have been precisely designed by
    the artist, while chance plays the role of setting the course (Boulez et al. 1964).


    In the face of machine learning, however, this collaboration seems to take on
    a new dimension. The playing of predictable change, the labyrinth with its diverse
    branches, becomes much faster, more intricate and more mobile and can persist
    in similar things— inspire something uniquely new. All most important is to devote
    oneself to this field, of course without falling in love with the "gadgets" and
    losing oneself in the sense of McLuhan (1964: 22).


    A good strategy is to approach the boundaries, of predictability but also of one''s
    own listening habits. Otherwise, users will only ever produce what is already
    present in the respective musicking thing, and thereby correspond to widespread
    listening habits. (Ahlers et al. 2022; Ismael-Wending 2016) music tools, games
    and instruments are part of social contexts and imply specific ways of dealing
    with them. In the best case, this empowerment of things leads to human hybrids
    rich in variation; in the worst case, to the one-dimensional repetition of what
    the respective musicking demands at the most obvious level. Users, artists and
    producers are always in the process of negotiating the boundaries of this influence.
    Media education takes place within this process. In musicking things, there is
    the chance to learn about music production cultures, heterochronous (Pletto 2020:
    25) music history or the power of well-timed mood and timbre, in short, to practise
    what Kodwo Eshun (1999: 22) calls “beat education." Concerning machine learning,
    this raises the obvious question of intelligence. Whether the ghost in the machine?
    Eduardo Miranda (2021: 20) emphasizes that AI is a great tool to musical intelligence.
    Intelligence includes human abilities such as creativity, subjectivity and emotion,
    interaction and embodiment. At the same time, these properties inherent in music
    make it an interesting field for research. Both in AI and concerning human educational
    processes.


    However, as machine learning could be used to create a future of endless repetitions
    of things that have been heard before, a future where no one can be sure if someone
    is embodying the original or only speaking in the voice of the original, it also
    offers the chance to value the moment, the live experience full of trace, raw
    materials, failures, experiments and collaborative performances.'
