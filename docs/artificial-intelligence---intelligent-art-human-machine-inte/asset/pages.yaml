    In many ways, the MusickingThings that are currently flooding the market under
    the label of "artificial intelligence" spark similar expectations today. Like
    the new possibilities for automation and the technical disposal of musical ideas
    back then, many of the current "smart" musical and sound technologies promise,
    on the one hand, to simplify and streamline the workflow. On the other hand, they
    provide a form of increased creativity and productivity as well as independence
    or superiority of certain skills, experience or training in a previously unprecedented
    way. Considering the current discourse surrounding them, e.g. in online communities
    or the media public sphere, these promises seem to fall on fertile ground. Accordingly,
    the mere emergence of these technologies, currently mainly in the form of software
    and software plug-ins, is not only accompanied by questions about what this technology
    is capable of "achieving" and how it will change musical creation and (industrial)
    cultural production, but is also largely dominated by them. On one hand, this
    reflects the expectation that the technical artefact itself, detached from any
    musical and cultural contexts or forms of practice, already enables you to recognise
    musical futures. The ability to "design" musical and sound technology in a direct
    way. The other hand, expresses the fascination and joy for the technical functioning
    of the music machine in the hands of the human individual, which promises the
    increase of (musical) potency and productivity through technological progress.
    In this way, the double bind of musician and MusickingThing, based on the binary
    of human/tool and on the notion or phantasm of human/male control over and through
    the technical Other, is perpetuated. The mode of exploring the "artificial" Other
    – the promising new, supposedly intelligent music and sound technology – always
    includes an area of exploiting it.


    At the time, the current hype about technologies framed as "intelligent" or "smart"
    is also accompanied by the question of what (quasi-)human qualities the technical
    Other possesses. In terms of musical and sound technology, this is primarily about
    not notions of creativity, originality and musical context sensitivity, all qualities
    that were traditionally reserved for humans. Can the machine be musical? Can it
    be original? Can it mimmingly? Can it be the equal of the artist, composer, mixing
    engine, mastering engineer, etc. In these respects? By framing MusickingThings
    as "intelligent" – be it a composing machine, an automated mastering service or
    a smart assistant to improve your songwriting or production –, a counterpart is
    conjured that promises devotion and servitude to the human, but also seems suspicious
    and mysterious in a way due to its neither determined aleatory behaviour.'
