- pgno: 109
  md: '# Artificial Intelligence – Intelligent Art?


    program might be built by considering some existing repository of stories and
    to select from it one story at random. The user would get a new story every time,
    and she would have difficulty to tell whether the story has been generated by
    the system or selected from a set of prewritten stories. A more elaborate approach
    would be to consider input in terms of a series of keywords or phrases to narrow
    down the set of possible stories returned. The development of a system under this
    approach requires the existence of a vocabulary for presenting queries formulated
    in terms of various characteristics such as: details about the concepts in the
    story world, details about characters and relations between them, plot structures
    that capture causal and temporal relations between events in the story, or details
    about the potential effect of the story on its audience. The most elaborate approach
    would be to provide a text prompt that describes the story in some way, and have
    the story generator provide a matching prompt.


    Existing story generators have progressively shifted from the early attempts that
    worked on an empty input to the most recent neural solutions that adapt complex
    text prompts, with intervening systems that worked on keyword-based queries of
    different complexity.


    # Original Stories


    If one further establishes the constraint that the outcomes must be original –
    that is, not already available in some form – the task becomes more difficult.
    Two different challenges need to be met: how to build a story and how to judge
    if a newly built story is sufficiently different from those already existing be
    considered original.


    # Building Stories


    The task of building a story from constituent elements, in the hope that the result
    may be original, requires solving two basic problems: what to consider as constituent
    elements and what type of procedure can be employed to put together those constituents
    so that the result be valid story. Several approaches have been considered in
    the past, but some are reviewed here as illustrative examples. For more detailed
    reviews, readers are referred to existing surveys in the field (Kybartas / Bidarka
    2016; Alhussain / Azmi 2021). Some approaches breaking existing stories into pieces
    and then recombine the resulting set of pieces from a large set of different stories
    into new instances of stories.


    The simplest approach of this type relies on individual words as the pieces that
    are obtained from and then recombined. Attempts to achieve this based on statistical
    models of have proven successful in the past at producing legible text, original
    but lacking sense (Brown et al. 2015). This procedure is also the basis for the
    recent work on transformers (Wolf et al. 2020) that has become the rage in the
    world of AI. It is only when systems built based on these models have started
    to be'
