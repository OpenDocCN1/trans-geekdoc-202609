- pgno: 116
  md: '# Pablo Gervás: Challenges and Opportunities for Computational Construction
    of Narratives 119


    With respect to the classic pipeline for natural language generation systems (Reiter
    / Dale 2000) the transition from story world to discourse corresponds to the task
    of content planning, and the transcription from discourse to the stages of sentence
    planning and surface realization. The content planning task will optionally include
    a task of selecting which events in the story world are included in the story,
    which aligns with the recently formulated task of story lifting (Ryan 2018). Research
    efforts related to generation of stories based on known facts covered in the section
    "Stories for a Specific Purpose" correspond to tasks of narrative composition.


    # Processing Narratives: Narrative Interpretation


    When the situation is presented in this manner, it becomes clear that there is
    a set of possible computational tasks corresponding to the transitions from text
    to discourse and from discourse onto a conceptual representation of the story
    world. These correspond to subtasks of narrative interpretation. This task of
    narrative interpretation has been a long-s goal in the field of artificial intelligence,
    originally as natural language understanding (Allen 1995). Historically, a succession
    of un-met expectations over the years lead the natural language processing community
    to operate under a progressively shrinking scope, focusing more and more on specific
    sub-tasks instead of attempting anything like processing text onto an exhaustive
    representation of its meaning. Recent efforts to model identification of narrative
    structure (Gervás 2022) correspond to the transition between discourse and story
    world, including the possibility of a given discourse referring to no one single
    story world but to a number of interrelated story worlds.


    The attempts at developing computational models of the reading task would also
    constitute instances of the narrative interpretation task. Very little is known
    about this task, because it has only recently to be treated computationally. This
    makes it stand out as an open field for challenges and opportunities for future
    research.


    # Conclusions


    The panorama of research efforts described in this paper suggest that story telling
    needs to be considered not as a single monolithic task but as a set of interconnected
    sub-tasks. A simple distinction between text, discourse and story world provides
    means for describing some of these sub-tasks in processes of narrative generation,
    narrative composition and narrative interpretation


    In terms of how the existing research on computational narrative relates to human
    performance on equivalent basic goals related to the construction of stories,
    it'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'is clear that computational solutions have a long way to go. The analysis presented
    in the sections "Programs that Deliver Stories" and "Rethinking Basic Assumptions"
    constitutes a fair review of the particular tasks considered to this point in
    past research on computational narrative. However, it becomes clear, regardless
    of which of the combinations of transitions between the levels have already been
    explored in computational systems, the approach that humans apply to the storytelling
    task takes advantage of a very broad combination of this set of tasks. Some writers
    plan out the plot of their story to the very end and only then sit down to write
    it. This would align with the idea of building a discourse and telling it. Other
    authors construct a whole word and then tell stories in that world. Others sit
    each day to produce a number of pages of text with no idea how the plot is going
    to proceed as a result. The same writer might start from a sentence that sounds
    promising to him (text), work out in head how the characters might react to the
    resulting situation (simulation on the story world) then work it all to ensure
    the revealing moment take place at the optimal point in the scene to maximize
    its impact on the reader (iteration of discourse revision guided by a metric for
    impact), possibly guided by a dynamic model of how the reader progressively react
    to the sentences as they appear in the text

    As a result, the various specific challenges described in the paper one must add
    the grandeur challenge of exploring how all of these specific challenges may interact
    in more complex processes of story writing.


