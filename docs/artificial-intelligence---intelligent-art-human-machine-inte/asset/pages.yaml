    do not currently have judgment capability, only “reckoning”. (2019: xvii) In his
    view, it is problematic if we use systems that are only capable of reckoning for
    judgment tasks. (2019: xix) As long as machines are not capable of that, it is
    our obligation to judge computations. This means we must consciously decide for
    or against computations (and be able to do so). In terms of the social relation,
