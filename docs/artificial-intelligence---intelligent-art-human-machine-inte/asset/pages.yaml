  md: '# AI, Automation, Creativity, Cognitive Labor


    Jens Schröter


    # Introduction


    Let me begin with a somewhat bizarre article from the Frankfurter Allgemeine Zeitung
    from 29 August 2022. Under the title, "Who''s afraid of DALL-E 2?", addresses
    the fact that software like DALL-E 2, Midjourney or Stable Diffusion is now available
    on the Internet, software that uses artificial intelligence to generate images
    out of text prompts (Böhringer 2022). The article states in its sub-headline:
    "Art from artificial intelligence has reached the threshold of commercialization.
    Illustrators and comic artists fear for their jobs and feel cheated of their ideas".
    Many artists are upset that machine learning learns from their images to simulate
    their style – and then put images in the style of the artist for free, so to speak.
    The article explains: Style cannot be easily protected by copyright. A new kind
    of class difference is feared: on the one hand, a monopoly of automated art production
    for the masses, as it was already imagined in Orwell''s Nineteen Eighty-Four and
    very expensive real work by artists for the other.


    This may or not come true; what I want to discuss is the configuration of AI,
    automation, creativity and labor in its historical transformations. My chapter
    has four parts. First, I want to point to the fact that long before computers
    and AI emerged there was a relation between artistic creativity and the automatic
    at the beginning of the 20th century. Second, I want to discuss a configuration
    of the 1960s regarding the simulation of artistic style. Thirdly, I want to present
    some preliminary musings on the non-automatability of artistic work. In my fourth
    part I want to discuss, very briefly, the situation today – and to suggest, based
    on a paper by Hal Foster (1996), the notion of ‘style’ without museums’. In the
    fifth part, I offer a short conclusion that invokes the work of Actress as Darren
    J. Cunningham.


    +   1 Original title: "Wer Angst vor DALL-E 2?"

    2 Translation Schroeter, original quote: "Kunst von Künstler Intelligenz hat die
    Schwelle der Kommerzialisierung erreicht. Illustratoren und Comiczeichner fürchten
    um ihre Jobs und fühlen sich um ihre Ideen betrogen."'
