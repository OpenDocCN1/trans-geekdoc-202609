  md: '262 Artificial Intelligence - Intelligent Art?


    As philosopher Sybille Krämer (1998) describes referring to the theory of McLuhan
    (1964), media represent the blind spot of media use. Humans recognize them by
    their malfunctions, the stuttering compact disc, the feedbacks guitar, the coarse
    pixels in the video stream when the internet connection breaks and precisely by
    the noisy artifacts generated by the algorithm of an artificial intelligence when
    generating a sound. For example, such striking artifacts are generated by the
    artist Holly Herndon with her AI ''Spawn''. This instrument, or musicking (Alers
    et al. 2022; Ismael-Wendt 2016), was trained for two years based on data from
    her own voice, her composing and her ''just living alongside it'' to dynamically
    generate a unique repertoire of sounds. Tracable and audible, Spawn or Holly Herndon''s
    hybrid voice on the album Proto (2019) is particularly evident based on ''Birth''.
    Herndon describes based on her artistic approach, the neural network becomes audible,
    which more adequately represent the current state of AI research and its artistic
    application that would otherwise be the case:


    A lot of the press releases prevent AI in this very glossy way that erases all
    of the human labor that went into training whatever AI is doing. It also creates
    this illusion of being more developed than it is. When you''re dealing with automated
    composing, you get a MIDI score at the end, and when you push that through a digital
    instrument, it sounds really clean. We''re dealing with sound as material, and
    by using audio material, you can really hear the roughness of the neural network
    trying to figure out what to do. That was something that we chose, because we
    wanted to make that clear: [that] the current state of the technology is still
    developing. That''s what''s exciting about it: we still can have a say in which
    direction it goes. (Friedlander, 2019)


    For Holly Herndon and other scientists, it is clear that AI alone will never be
    creative, but that creativity always comes from collaborations between humans
    and AI. She is already offering a tool for that.


    # Further Experiments from Holly+ to Jimi Hendrix and Tone Transfer


    With Holly+, the artist has made a tool available that enables users to sing with
    her voice. As is the case with all other AI tools, new sounds can be created directly
    in the prompt. This so-called ''promptism'' (Hayward 2022), as artists have already
    named this phenomenon, is easily accessible comes with other challenges: [S]some
    of my AI images took 30+ tries to match closely to my goal. I had clear picture
    of what I wanted in my head, but it''s a matter of articulating in a way that''s'
