  md: '# Artificial Intelligence in Songwriting and Composing – Perspectives and Challenges
    in Creative Practices


    Björn Tillmann, Wolf-Georg Zaddach


    Artificial Intelligence (AI) has been a synonym for intensively discussed and
    continuously developed approaches in the culture of digital for several years
    (Stalder 2020). It is regarded as a disruptive technology with great potential
    for change in almost all areas of human life. This also applies to the field of
    music. For example, Melissa Awdeeff (2019:1), after analyzing the first music
    album jointly created by an AI and humans (Hello World, 2018), states that we
    are “on the edge of a new popular music production”. Streaming platforms have
    also been influencing music which is suggested to listeners (and which not) for
    several years, in the case of Spotify, for example, through algorithmic constellations
    such as “collaborative filtering”, “conventional neural networks and audio models”
    for analyzing basic musical parameters (Whitehouse 2021).


    AI technologies are increasingly entering artistic and creative work. Artists
    engaged with different AI in recent years and published their work, such as Holly
    Herndon with the album Proto (2020) or Benoit Carré’s and François Pachet’s work
    on the Beatles-style pop “Daddy’s Car”, realized through Flow Machines, as well
    as the subsequent and mentioned album Hello World (2018). At the same time, through
    tools such as Jukebox, IRCAM''s real-time timbre transfer tool RAVE (2022), short
    for Realtime Audio Variational AutoEncoder, or music production (Sonible, Izotope,
    among others; Friiler / Zaddach / Meyer 2023) are becoming more and more widespread.
    These rapid developments require a multi-perspective and critical examination
    and classification, which includes creative professionals. Hence, after introducing
    songwriting and composing as practice, we will discuss the usage of AI in songwriting,
    its potentials, challenges, and risks for professional practice. The article is
    based on semi-structured qualitative interviews with four professional composers
    and songwriters intensively work with AI.


