    The heart of Dall-E is a machine learning model called CLIP. Via an encoder, it
    is fed with vectorized text-image pairs taken from the Internet – for example,
    a photo of a cat with a caption "this is my cat". CLIP is trained to predict which
    vector matches image vector; the result is a comprehensible stochastic model that
    correlates image information with text information, but stores it as one type
    of information. In figure 2, this is the table in which the scalar product of
    the text and image vectors is listed – the better the text and image, the better
    this value; when the original image and text are paired, it is of course optimal
    (those are the boxes running diagonally).


    CLIP is remarkably good at image recognition: If you present it with an unknown
    cat photo, it never recognizes it as "cat". But in a second step, it becomes an
    image generator. To this, it works in conjunction with another machine learning
    model GLIDE (Guided Language to Image Diffusion for Generation and Editing), which
    has already been trained on a large set of images. If the


