    from a Japanese Buddhist perspective. Ganz unpacks the winter with myths of annihilation
    and de-animation and how it also takes contemporary discussions of the fraught
    Frankensteinian relations of the producers and products in robotics.


    Machines increasingly perform complex tasks that we think of as the prerogative
    of humans. AI systems have achieved important milestones in the context of specific
    applications (''expert systems''), and systems using ''good old-fashioned AI''
    (GOFAI), i.e. symbolic, rule-based AI. This kind of weak (narrow) AI helped Deep-Blue
    Gary Kasparov at Chess (1997) and was gradually augmented with deep learning architectures
    to better human experts at a further set of highly published, performative events,
    beating them at games such as Jeopardy (IBM Watson 2011), and, aided by neural
    networks, Go (AlphaGo 2016; see Heisler 2017).


    From the hopes of the 1950s to the early 1990s, AI neural networks were becoming
    increasingly data-driven, ''trained'' (and, therefore, ''learning''), stochastic
    pattern recognition apparatuses. They can perform feats, as exhibited by persuasive
    agents built to access large amounts of data in the ''Project Debater'' (IBM Watson
    2019), and subsequently debates at the universities of Oxford, Cambridge, and
    finally, at the House of Lords, by the humanoid Ai-Da.


    the idea of AI is ancient, having already prepared Hellenistic mythmaking. As
    historian Adrienne May argues, ''before the clockwork traditions of the Middle
    Ages and the automata of early modern Europe'', Hellenic Greece was already rich
    in visions that anticipated robots and contemporary AI technologies, such as the
    ''bronze robot Talos, the techno-witch Medea, the genius craftsmen Daedalus, the
    fire-bringer Prometheus, and Pandora, the female created by Hephaestus (May 2018:
    1). May''s study throws to sharp relief that this emerging cultural imaginary
    of ''made, not born'' artificial life is palpably present in the narrative we
    around the myths of the divine Prometheus and Hephaestus, the Greek god of craftsmen,
    as well as human creators such as Medea and Daedalus. ''biotechnique of the ancient
    Greeks went some way towards not just imagining, but self-operating devices.


    the tradition of defining humans as opposed to animals and other organisms is,
    therefore, long, but more recently, the definition of humans against their mechanisms,
