  md: '# 210 Artificial Intelligence - Intelligent Art?


    Dan Boneh showed in their study “Do Users Write More Insecure Code with AI Assistants?”
    (2022) that programmers (referred to here, interestingly, as “users”) are significantly
    more confident in their code when it is written in co-authorship with an AI. Contrarily,
    while programs written without AI resulted in a less secure feeling on the part
    of the programmers, they resulted in actually more secure code with fewer vulnerabilities.
    Even though this study is only representative to a limited extent due to its size
    and the lack of a broad enough sample, it can exemplify our behavior towards machine-generated
    results. In co-authorship it is easy to give away responsibility.


    Art is characterized by its need for interpretation. It wants to be questioned.
    Just in this it can be a training ground for questioning (of calculations). In
    the contemplation of art, we automatically find ourselves in the mode of critique.
    Juliane Rebentisch (2022: 165*) describes critical thinking (that specifically
    in relation to the formation of common sense through the judgment of taste according
    to Kant) with Hannah Arendt as a form of “habitualization:


    > One must be practiced in, one must be “used to” not simply accepting things
