- pgno: 8
  md: '# Eckart Voigts, Dietmar Elfein, Jan Röhner: Artificial Intelligence – Intelligent
    Art? 11


    critique of false universalism with techno-utopianism. A transhumanist might develop
    the vision of machine adapts improving or superseding human adapters, whereas
    a critical posthumanist might assign technologies according to their contribution
    to overcoming the traditional focus on white, Western or European citizens.


    Since these technologies might be able to modify the human body, they fuel control
    anxieties and insecurities about posthumanism (cf. Vint 2007: 8, 182), which tie
    in with notions of (human) identity. The idea of posthuman machine adapters replacing
    human creativity is fraught with anxieties. Posthumanist discourse also illustrates
    that machines are always tied with notions of embodiment, as discussed in Katherine
    Keyes''s How We Became Posthuman: “embodiment makes clear that thought is a much
    broader cognitive function depending for its specificities on the embodied forming
    it” (Hayles 1999: xiv).


    It is therefore, hardly surprising that the cultural imaginary of AI in literature
    from E.T.A. Hoffman’s “The Sandman (1817), Mary Shelley’s Frankenstein; or The
    Modern Prometheus (1818), and Philip K. Dick Do Androids of Electric Sheep (1968),
    to consider various variants like Janette Winterson’s Frankenstein (2019), Ian
    McEwan’s Makes Like Me (2019), or Kazuo Ishiguro’s Kara and the Sun (2021) tend
    to cast the discussion of AI in humanoid-android forms.


    In various forms and approaches, the same is true of movies such as Ridley Scott’s
    Blade Runner (1982) and its sequel Blade Runner 2049 (2017), James Cameron’s Terminator
    (franchise 1984), Michael Crichton’s Westworld (1972) and Soderbergh (2002), Alex-Prost’s
    Asimov-inspired I Robot (2004), Pixar’s S.T.L. of Solaris (1961) by Tarkovsky,
    Pixar’s Wall-E (Andrew Stanton, 2008), Steven Spielberg’s A.I. (2012), Robert
    & Frank (Jake Schreier, 2012), Spike Jonze’s Her (2013), Alex Gardner’s Ex Machine
    (2014), and Maria Schader’s Ich bin Dein Mensch (2021) or the TV series Real Humans
    (2012, UK / US / 2015), and find many other examples. The best-known AI in science
    fiction, Stanley Kubrick’s HAL 9000 well-bent on self-preservation in A Space
    Odyssey (1968), has a voice and an iconic red eye. The same applies to the theatre,
    where AI systems have evolved from their ancestors, the marionettes, and to the
    stage beginnings in Čapek’s play R.U.R. (1920) to robot performers in Rimini Protokoll
    / Thomas Melle’s Uncanny Valley (2018) and beyond. The inherent performativity
    of robots whose identities derive entirely from their performance” is discussed
    by LePage (2012: 1430) and could also be applied to AI systems in general, whether
    embodied or not: they are what they do.


    In this contribution to the text, Shoshannah Ganz gives a particularly intriguing
    contribution to the cultural imaginary of AI, Rokuro Inoue’s mosaic science fiction
    novel Kikou No Eve / Automatic Eve (2014). The question discussed in this text
    reverberates with the issues raised in the preceding paragraphs about machine
    agency, consciousness or even a machine soul, and it does'
