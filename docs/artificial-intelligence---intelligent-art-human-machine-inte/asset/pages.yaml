    Other notable developments to GANs brought improvements to quality and resolution
    (Karras et al. 2017). In 2018, the release of StyleGAN (Karras 2021), a model
    built on a combination of ideas from Style Transfer and PGAN, demonstrating convincing
    images of human faces. In his article “To recognize fake AI-generated Images”,
    the artist Kyle McDonald (McDonald 2018) investigated the images generated by
    StyleGAN, and highlighted the visual artifacts found. At a glance images look
    like photographs, but patches of straight hair, misaligned eyes, or mismatched
    earrings reveal the difficulties GANs have in managing “long-distance dependencies”
    in images.


    In 2017 Attention Is All You Need (Vaswani et al. 2017) proposed a new network
    architecture called the Transformer. This model addressed the long-distance dependency
    issue in RNNs and CNNs by rethinking how we could handle sequences. Rather than
    looking at a single word by word, the Transformer observes the relationship between
    all elements of the sequence simultaneously. Being able to handle long distance
    dependencies made the Transformer appropriate for natural language generation.
    Artists and poets such as Allison Parrish have explored the VAEs for short text
    generation, but with the emergence of LLM passages of long, coherent texts could
    be generated (Brown et al. 2020). As dataset sizes increased, they have become
    harder for individuals to train themselves, and the mode of interaction has shifted
    from curated datasets and homemade scripts, but web APIs and third party services.
    While it is more difficult to participate in the training process, the availability
    of services and interfaces provides new ways of working with these models that
    can produce less technical and more playful approaches. For example, Hito Steyer-serl
    used GPT-3 to create Twenty-One Art Worlds: A Game Map (2021) and described the
    process as “fooling around” with GPT-3 to write descriptions of different Art
    Worlds, using the tool in the process of world building. In the resulting text
    it is difficult to distinguish which words may have been written by Steyer and
    which were written by GPT-3.


