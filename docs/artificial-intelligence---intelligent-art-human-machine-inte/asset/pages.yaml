    # Creativity in Generative Neural Networks


    My focus hasially fallen on so-called Generative Adversarial Networks (GAN), as
    these have been considered particularly innovative in computer music research
    and actually have a promising architecture concerning a form of artificial creativity.
    This is because within this specific method of machine learning, two neural networks
    are developed that work against each other. The so-called generator creates new
    data from randomly generated data, while the other network, the discriminator,
    checks whether the newly generated data could also come from the original data
    set. In other words, it checks whether the images are iterations or could be originals.
    The calculations are complete when enough imitations are to.


    This approach is not so different from human learning methods. A big part of learning
    a musical instrument is to copy the playing styles of existing artists and how
