    (Doctoral Thesis, Estonian Academy of Arts 2018).


    Chelsea Haith (PhD) is a commercial qualitative researcher based in Sydney, Australia.
    Her doctoral work at the University of Oxford focused on narratives future scenarios
    and technologies and their political intent. While at Oxford she researched the
    network Futures Thinking. As the Executive Producer of the web series Will Machines
    Make Us Laugh? which considers the use of AI in producing comedy, and she is the
    host of the Narrative Futures podcast. In February 2020, she co-founded the AI
    & Creativity Project Contagion. Since leaving academia in 2022, she has centered
    on ocean swimming and experiments with AI tools in commercial research.


    Ilona Kravczyk (PhD) is a lecturer in Acting at Norwich University of the Arts,
    a performer, vocalist, and researcher of embodied voice. In her practice-as-research
    PhD, she developed a Process-oriented approach to voicework and performer training
    focused on care and preservation of a performer’s well-being. Her recent work
    explores possible overlaps between physical, musical theatre, experimental music,
    and sound art, integrating new ethics and aesthetics of voicing and acting in
    the theatre formed by post-Grotowskiian practice. Ilona is a founder of DreamVoice
    and and co-founder of Insoundcontent.


    Dr. Angela Krewani is Professor of Media Studies at Marburg University. She is
    the author of Moderne und Wirklichkeit: Amerikanische Schriftstellerinnen in Paris
    (1992) and Hybride Formen: New British Cinema – Television Drama – Hypermedia
    (2001) and editor of Artefacts/Artificions (2000) and co-editor of Marshall McLuhan,
    Transatlantic Perspectives (2014). She has also published on imaging in the natural
    sciences, including biomedicine and nanotechnology. She was a fellow at the ZIF
    in Bielefeld in 2006–2007 and visiting professor at Brooklyn College, New York,
    in 2008. She completed a book on media art, Medienkunst. Theorie, Praxis, Ästetik
    (2016), and co-edited a book on authorship, Constructions of Media Authorship.
    Investigating Aesthetics from Early Modernity to the Digital Age (2021). Her most
    recent publication traces the mediality of the Corona pandemic, Das Virus in medialer
    Diskurse. Zur Rolle der Medien in der Corona-Krise (2022); co-edited with Peter
    Zimmermann.'
