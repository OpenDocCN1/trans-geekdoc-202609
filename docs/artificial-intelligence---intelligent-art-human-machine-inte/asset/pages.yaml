  md: '# Artificial Intelligence – Intelligent Art?


    lation to the specific embodied practices involved. Kate refers to herself as
    "guilty" of anthropomorphizing the technology. There are studies showing when
    people anthropomorphize AI technology this has an impact on how they consider
    the AI itself to be accountable for things that happen (e.g. Epstein, et al. 2020).
    This has a clear implication for AI and ethics, because it calls into question
    whether the machine should be accountable or those developed it. But Kate also
    says she is paying no attention to the computer (also reflected in her comments
    on Flow), in part because her attention is directed towards her embodied practice.
    What is interesting is these two forms of reflection are entrusted. One concerns
    the (embodied) feelings of the experienced practitioner in accomplishing the task,
    which involves paying some kind of attention to the location of the sensors, but
    the sensors are not the focus of attention. The fact that attention can shift
    here to the sensors, to the AI system and some form of agency temporarily attributed
    to it seems to underpin the complexity and relational fluidity that exists in
    these kinds of assemblages.


    # Conclusions and Areas of Further Research


    We believe there is rich potential for future research and exploring the study
    of small-scale artistic research projects like this one (a techno-social system
    in miniature) with a view toward developing and refining tools for these entwined
    forms of self-reflection. As previously stated, AI-based systems are products
    of collaborative and team effort. If these efforts are also viewed as assemblages,
    the question is not whether or not the same kind of self-reflective processes
    might apply, but how to apply them. This points toward an ethics-in-practice approach
    that could potentially inform the wider discussions about AI and ethics. Therefore,
    we call for more projects like this one to be further studied and consulted by
    other fields. There are other research areas that can be further developed here
    as well. Our project has already begun creating a new epistemology of practice
    that goes somewhat against the original ethics of the post-grotowskian training:
    originally training was specific about human-human interaction, and embodied exchange
    of energy. And it is interesting to discover what changes when the machine gets
    involved, and what the limitations of this system are when it encounters such
    an established tradition of embodied practice and research.


    # Bibliography


