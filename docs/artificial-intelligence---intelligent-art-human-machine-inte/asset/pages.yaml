    options are usually cheaper to produce. This, in turn, leads to the polarization
    of avant-garde do-it-yourself narratives in the sense of self-built or hand-manipulated
    electronic instruments and interfaces, which only want to connect to the usual
    choices in art music.


    The next steps in the development of electronic and then computer-based music
    production, digital sound synthesis and audio sampling, were ready for the market
    at the turn of the decade in the 1980s (Brockhaus 2017, Bennett / Bates 2018).
    In 1983, the Yamaha DX-7 with its FM synthesis changed popular music production,
    and as early as 1979, the Fairlight CMI, the first, still very expensive hardware
    sampler, was introduced. Six years later, in 1985, a cheaper alternative appeared
    with the Ensoniq Roland. The MIDI standard, first introduced in 1982, made it
    possible to control and synchronize several sound generators from a central unit,
    an interface. From 1984 onwards (Steinberg for the C-64), software sequencers
    developed as control units were successively expanded into digital audio workstations
    (DAWs) as music production centres and recording studio replacements. For some
    time now, deep learning algorithms have also been used in these DAWs as- or auxiliary
    programs (plug-ins, virtual instruments, etc.).


    In this context, many AI programmers are commercially available extensions (Magenta
    Studio, Flow Machines Pro) or are published as part of independent, cloud-based
    production environments / apps (Amper Music, Flow Machines, AIWA...), the results
    of which can be further processed in other DAWs if required (Avdeeff 2019, Schümer
    / Haberer / Brautschek 2022, Zhang / Yan / Briot 2023). Therefore, the goal is
    not to compose independently of humans, but to make the production environments
    of humans ''creatives'' more comfortable. In their article, Wolf-Georg Zaddach
    and Björn Tillman give an overview of these AI helpers in music production, as
    of the end (2022). The article is also based on interviews with some of the leading
    humans in this development, such as Benoît Carré (Flow Machines).


    The creation of similarities to human music is one of the basic strategies used
    to promote such algorithms, apps or platforms – from The Beatles-style song (Daddy''s
    Car, Flow Machines by Sony CSI on YouTube, 2018 on vinyl by Benoît Carré and Françoise
    Packet) to the third and fourth movements of Beethoven''s 10th Symphony. Invariably,
    the artistic aim is still merely to prove the music product as new and indistinguishable
    from human products along the lines of the Turing test. The goal, therefore, is
    frequently not a genuine, innovative machine creativity, but the imitation of
    human work processes that, are carried out by humans, might be requiring creativity.'
