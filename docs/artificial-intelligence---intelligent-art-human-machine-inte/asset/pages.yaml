  md: '# Artificial Intelligence – Intelligent Art?


    Large language models, such as ChatGPT, Claude or BARD and LaMDA, basically still
    no longer vectorize individual words – which would be impossible given the huge
    amount of training data. Instead, ChatGPT uses a network architecture called the
    "transformer" to build embeddings of entire word sequences (Meng et al. 2023).
    To do so, transformers use the concept of "attention" (Brown et al. 2017). The
    model learns to establish relationships between words in a sequence; from these
    patterns, the transformer constructs vectors that represent the entire sequence
    – so-called contextualized embeddings. In contrast to word vectors, these sequence
    embeddings take into account a much larger context. In a decoder function, the
    transformer then uses these contextualized embeddings to generate new text that
    match the input context. The ability to build such complex sequence representations
    is the key to the performance of large language models (Wolfram 2023). The effect,
    nevertheless, is that large models, by their immense training alone, are able
    to produce situational understanding, as LaMDA did, without being "in a situation"


