- pgno: 115
  md: '# Artificial Intelligence - Intelligent Art?


    assumptions, computational storytelling may be described in terms of a number
    of component sub-tasks that embody transitions between story world, discourse
    and text. The sub-task of narrative generation involves construction ex novo of
    either text, discourse or world. The sub-task of narrative composition involves
    building a discourse that tells some story from a world, or building a text that
    tells a given discourse. The sub-task of narrative interpretation involves reconstructing
    the conceptual discourse that underlies a given text, or reconstructing the world
    that underlies a discourse. These ideas are expanded in the following sections.


    # Constructing Narratives: Narrative Generation and Narrative Composition


    Let us consider narrative generation as the task of constructing a story that
    did not exist before. Faced with the distinction between story world, discourse
    and text, an engineer wishing to design a story generator decides how many of
    these levels she wishing to represent within her design. All these levels are
    interconnected, in the sense that a reader faced a text will interpret a discourse
    as its meaning, and imagine a story world as its content. The question is at how
    many of these levels will the program operate.


    The system could generate text directly, with no additional representations in
    terms of discourse or story world. This is indeed the choice favoured by neural
    approaches to the story generation task.


    The system could focus on generating discourse, abstracting away the complexities
    of generating language but still building a sequence of discourse - represented
    conceptually - that has a valid narrative structure. This presents the advantage
    that story world does not have to be represented in the system. The approaches
    described above that rely on abstract representations of the meaning of stories
    as story actions operate under this.


    Because people are better readers of logic representations, systems that generate
    discourse usually include a module that transcribes the discourse onto text. This
    process is not really generating the story, but rather finding a way of telling
    text as a story that already exists as discourse. We refer to tell this task as
    narrative composition.


    The system could include an explicit representation of the story world. Stories
    can now be built by generating events or characters, or locations in the story
    world directly and then find a way of telling the story of what happens in her
    story world. This is the choice favoured by story generators based on simulation
    of an underly world (Ryan 2018). Under this approach, two further tasks are needed:
    one that transcribes possibly a selection of the events in the story world onto
    a discourse, and one that renders the resulting discourse as text. Both are instances
    of narrative composition.'
