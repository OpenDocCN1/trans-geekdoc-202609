  md: '# Artificial Intelligence - Intelligent Art?


    For most of the past decade, GAN has been a dominant and defining element of AI
    Art. GANs are trained using a competitive game, played by two players: the Generator
    and the Discriminator. The Generator wins by making an image that the Discriminator
    thinks is from the original dataset. The Discriminator wins by successfully identifying
    images the Generator has made. By playing this game repeatedly, both sides slowly
    learn when they have been fooled and so they do not fall for the same tricks again.
    The Generator gets better at making images, and the Discriminator gets better
    at detecting these fakes. At the end of the game we are left with a Generator
    that is very good at generating new images, with the qualities and style of our
    original inputs.


    Image-to-Image Translation with Conditional Adversarial Nets (Isola et al. 2016),
    known as pix2pix, showed a process of converting one image into another type.
    Mario Klimingmann''s Alternative Face used the pix2pix model with a dataset of
    biometric face markers and the music videos of the singer François Hardy. This
    allowed him to control the movement of the face with this form of digital puppetry,
    which he demonstrated by transferring the facial expressions of the political
    consultant Kellyanne Conway onto Hardy''s face as she talks about "alternative
    facts".


    In 2015, on the Google research blog, the post Inception: Going Deeper into Neural
    Networks (Mordintsev / Olah / Tyka 2015) described a tool developed by researchers
    attempting to understand how image features are understood in the hidden layers
    of the NN. This model enhances an image with the NN''s attempts to find the features
    of the dataset it was trained. The creative use of DeepDream was proposed by the
    authors in the original article "It also makes wonder whether NNs could become
    a tool for artists - a new way to remix visual concepts - or perhaps shed a little
    light on the roots of the creative process in general." DeepDream''s psychedelic
    imagery quickly caught the attention of interest and artists around the world,
    resonating with those interested in understanding the cross-over between biological
    and neurological reconstructions of images. Memo Atkinson''s work All Watched
    By Machines of Loving Grace: Deepdream edition for an exhibition of DeepDream
    artworks in 2016, hallucinated over an aerial photograph of the GCHQ headquarters.
    This work raises questions about the motivations of the organisations funding
    the development of artificial intelligence, and in doing so make the dreamlikes
    a little more nightmareish.


