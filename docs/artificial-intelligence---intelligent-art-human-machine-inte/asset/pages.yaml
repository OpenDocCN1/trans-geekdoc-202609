    counter-argument that embraces the underlying postist agenda can, however, easily
    be constructed by pointing to the fact that extensional definitions are necessarily
    constructed and therefore neither wrong nor right, but rather useful or problematic
    according to their consequences and applications.


    Given the hugely different approaches and perspectives across disciplines, the
    definition should lend itself to functioning as an explanans in those cases where
    this is required, but it should also be to work as an explanandum for these same
    cases. In other words, definitions should not be designed as the starting or end
    point of an explanatory chain or system, but in relation to the other elements
    within the same explanatory system. Just as with signifier and signified in signs,
    the explanans of one definition is the explanandum of another, and every necessarily
    opens up new questions. In that sense, definitions are relational in a stroke,
    Saussarean sense, being marked by the differences to other elements within the
    same system and relying on Derrida’s difference as refutation of the “notion of
    being a fully present and self-present term that would be a terminus of any chain
    of signification” (Baugh 1997: 128)


    While each discipline will at any point treat it as either explanans or explanandum,
    but not, it is important to guarantee the translatability, that is to make sure
    that the explanans can be substituted for the explanandum and vice versa with
    minimal loss of coherence or information. It makes sense for a truly interdisciplinary
    definition to render the phenomenon necessarily a subset of the concept, and the
    real definition of the nominal definition.


    Finally, and this may be an overly obvious point, a definition of any kind needs
    to assume that something is explainable in principle. This is especially true
    in a research context and the aim of research is to provide those explanations.
    So, before returning to the issue of creativity, this leaves us with the following
    criteria:

    A successful definition


    +   1. affords (conceptual) operations not afforded by competing definitions

    2. focuses on differences that make a difference

    3. is neither too broad nor too narrow (equilibrium between intensional and extensional
    definition)

    4. provides linked and interchangeable explanans and explanandum (are part of
    the same explanatory system rather than beginning or end point of an explanatory
    chain)

    5. avoids dogmatic declarations of non-explicability'
