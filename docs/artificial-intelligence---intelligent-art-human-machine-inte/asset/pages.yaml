  md: '# Material Films in the Age of Artificial Intelligence.

    Some Remarks on Automated Creativity

    in Contemporary Experimental Film


    Christoph Seelinger


    # Introduction


    In their book AI for Arts, authors Niklas Hageback and Daniel Hedblom (2021: 62)
    point out that film, contrary to literature and music, is a far more complex art
    from a technical perspective. Since in film the various forms of human creativity
    are interwoven to form a holistic work of art, it would currently still be impossible
    for an algorithm to generate a complete feature-length film on the basis of a
    short sequence, for example. The authors summarise that the production of films,
    at least superficially, has been greatly simplified by green screens and digital
    technology, but as with other art forms, technology so far only been able to exploit
    a fraction of its potential possibilities—“the quality of the artwork still largely
    depends on the human artist, and so far it is hard to detect any quality improvements
    vis-à-vis earlier tech-equipped and tech-savvy generations (ibid).


    In their brief section devoted to “moving pictures”, the authors implicitly talk
    about primarily elements of commercial narrative cinema that realises (more or
    less) coherent narratives in an economic context with the help of human actors.
    Even a brief mention of independent films, which Hageback and Hedblom apparently
    understand as a sub-genre of general industrial filmmaking, occurs rather casually:
    “However, as for film, the advancements in technology have democratised film making,
    in that movies can be produced on small budgets, with less technical skills required,
    which has allowed for sub-genres, such as indie movies, to evolve and find an
    audience” (ibid).


    However, this largely ignores reflections on audio-visual artefacts in the context
    of experimental films produced beyond dominating companies and dominating narratives,
    in which narrative elements are present at most in rudimentary or abstract form,
    and whose rhythms thus resemble those of musical or poetic works to a considerably
    greater extent. Accordingly, in the following article I will use two examples
    to present procedures with which artists of contemporary'
