  md: '# Artificial Intelligence – Intelligent Art? An Introduction


    Eckart Vaigts, Dietmar Elflein, Jan Röhner


    # Man-Machines from Ancient Greece to ChatGPT


    This volume offers a critique and assessment of forms and consequences of algorithmic
    ''creativity'' that have emerged in the context of digital encoding in electronic
    media, appropriating, complementing, superimposing, and transforming established
    practices, ethical norms, as well as concepts of creativity. The interconnected
    digital world holds large quantities of available data and is here conceived as
    an ever-changing space of permanent and increasingly automated copy, transformation
    and adaptation.


    As algorithmic processing increasingly pervades everyday life, it is also making
    its way into the worlds of art, literature and music. In doing so, it shifts notions
    of creativity and evokes non-anthropocentric perspectives on artistic practice.
    Negotiating the aesthetic, cultural, and social implications of this development
    is an ongoing process to which many fields of inquiry and research have responded
    to the recent challenges of AI developments, it is our view that the role of AI
    in artistic practice deserves more attention than it has received. Critical debates
    about the impact of artificial technology and science on societies (Manyika 2022),
    education (Holmes et al. 2019), economies (Brynjolfsson 2014, Agrawal 2018), and
    media (O''Neil 2016, Sudmann 2019) and military (Scharre 2019) have been part
    and parcel the earliest appearances of the term and its institutional implementation
    in the 1950s. While AI research has, therefore, focused to a large extent on useful
    applications in medicine and elsewhere, or the political, ethical, legal, philosophical,
    social, educational, military, and economic dimensions of artificial intelligence
    developments, only recently have turned aesthetic concerns into clearer focus
    (Miller 2019, Manovich 2018, Zylinska 2020, Zeilinger 2021, Hageback / Hedblom
    2021, Reck Miranda 2021, Schöhnthal 2022, Moormann / Ruth 2023). This volume follows
    a similar trajectory, seeking to reconnect and reorient the discussion of AI so
    that the cultural dimension of artistic practice in literature, film, art and
    music is taken into consideration.'
