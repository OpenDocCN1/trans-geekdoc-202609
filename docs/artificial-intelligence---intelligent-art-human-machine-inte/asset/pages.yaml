    conceptual scaffolding of the bodymind continuum suitable for a technological
    design. The training works by making the actor aware of moments at which their
    body and act as one – giving them, through the process of repeated training, the
    ability to work more frequently, and more deeply, access a state of “freedom from
    the time-lapse between inner impulse and reaction in such a way that the impulse
    is already an outer reaction” (Grotowski & Barba 2002: 16). Voice and singing
    are important parts of this process.


    Embodied voice training in post-Grotowian practice seeks to express deep psychophysical
    states through voice, in moment-to-moment situations in relation to self and partners.
    Thus, “performers are trained to ‘experience the body as music, a melodic and
    rhythmic vibration’ (Dowling, 2011: 248) that allows one to be affected by others
    within musical and rhythmic structures” (Krawczyk 2021: 24). Last but not least,
    the choice of focusing on one post-Grotowian technique is rooted in the first-hand
    experience that our team of practitioners had with this type of practice. We wanted
    to model a practice that we had a thorough understanding of-


    # Team


    AI-based systems are products of collaborative and team effort. As previously
    mentioned, we consider a process of reflexivity in relation to one’s own practice
    to be an integral part of our research framework and a necessary step toward an
    ethical guideline for AI research. In which we take from Leurs (2017: 139) the
    principle of an “ethics of care”, which is described as “value-based” and cognisant
    of the dependencies, parcial, political commitments and personal involves of researchers”,
    we believe that awareness about the process of research, development and decision
    making starts with the team. In a small team and project like ours with focus
    on augmenting a pre-existing psychophysical training method, it is easier to explore
    the ecologies of skills, knowledge, but also experience, subjective preferences,
    and embodied abilities, which the practitioners and researchers bring to the room.
    Together, these create a distinctive ontology of practice for the enacted “assemblages
    of doings” (Leeker 2017: 13) – in which body dataification, a core focus of the
    research, is undertaken in an iterative way – that opens space in the kind of
    reflexivity we propose could be undertaken in other practice contexts.


