    2. Curating the training set: For artists it is important, that they can curate
    the material based on their own taste and intentions. It is literally about one’s
    possibility to decide which data the AI should work with to create new material
    since this would encompass the ability to enter the artist’s ideas into the system.
    The problem is that the AI must be pre-trained, which can pose problems from an
    ethical point of view, as be discussed in section 2.3. A challenge here can be
    the required ability to deal with file formats and program codes at this stage
    of AI tools.

    3. Evaluation, curation and further processing of the output: The generated material
    cannot be the final outcome, but must be evaluated, processed further, and integrated
    (or excluded). The creative approaches can encompass – like prior creative music
    production practices – sampling or manipulating of the AI-generated material.
    This reinforces the need for at least songwriting and music production skills.


    Valuela summarizes the task for artists is about “deciding what you want, sonically,
    because you can get easily overwhelmed by the possibilities of the models” (in
    Tillmann 2022, appendix, CII). In that sense, it becomes clear aesthetic experience
    and vision, knowledge of the different challenges of songwriting in general, and
    an artistic goal in the broadest sense are still important skills and features
