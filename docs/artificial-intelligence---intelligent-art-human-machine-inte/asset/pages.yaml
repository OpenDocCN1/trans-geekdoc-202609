    For a ‘Sound of Contagion’ event at Oxford University in November 2021, (Robert
    Laidlow) composed a piece for tenor and synthesizer Disc Fragments, which used
    texts as part of this project. This piece is in seven movements, the first and
    last being somewhat symmetrical—that is, Movement 1 is similar to 7, 2 to 6, and
    3 to 5. This arch form was a parallel to the nested narrative form that Chelsea
    Haith assembled from ''GPT-2'' we generated earlier. The texts for six movements
    (all except Movement 4) were generated by fine-tuned GPT-2’. These texts dictated
    the form and material of the music; here, the first movement, At Delphi, is discussed
    as an example. There was a certain mysticism that intrigued him in this text:


    Fragment III:


    +   At Delphi

    A Prayer

    Let not the Impossible Him

    The Impossible Him take what he has done

    Take it,

    Steal it,

    put the word in your mind,

    take it,

    tother choice.


    The use of ‘Delphi’, the Impossible Him’, and ‘put the words in your mind’ implied
    to me that ‘GPT-2’ could be read as imitating an oracle. I wanted to create a
    sense of ritual and of unseen pattern, similar to (for example) Massen’s Quartet
    for the End of Time. The voice part is constructed from a series of interlocking
    patterns. Ten pitches repeat, superimposed on a rhythmic pattern repeating every
