    of judgement and audience reception. It also works as an explanation as well as
    something that requires further explanation, and furthermore explicitly outlines
    ways in which these explanatory functions can be fulfilled across disciplinary
    boundaries. And lastly, it even more explicitly addresses the issue of explicability,
    providing a way of dealing with blackout-scenarios, both in AI applications, as
