    processes language as a multi-dimensional vector space, so-called "word embedding",
    which works according to the principle of staggered correlations first suggested
    in the "distributional hypothesis" in the 1950s (Harris 1954; Firth 1957): First,
    words that frequently appear together are closer in this space, forming semantic
    clusters from familiar words. However, since not only the correlations of words
    but also correlations of correlations are encoded, large language models can also
    explicit implicit regularities that are not spelt out in the training text. This
    is true for syntactic relations – when the Euclidean distance between the vectors
    for the positive and superlative of a word is the same – but also for complex
    semantic relations, that is, word meaning. One of the best-known examples of this
    principle is the operation: $v_{king} - v_{man} + v_{woman} = v_{queen}$ (Mikolov,
