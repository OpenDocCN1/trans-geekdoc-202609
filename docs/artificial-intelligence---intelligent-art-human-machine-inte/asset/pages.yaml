  md: 'formal. As discussed, to produce original individual music, a multitude of
    artistic decisions must be made that can quickly become overwhelming without the
    appropriate skills and knowledge.


    # Conclusion


    The interviews provided important practitioner insights into concrete ways of
    dealing and reflecting on working with AI for songwriting and composing. Working
    with AI has a comprehensive impact on creative practices, ranging from aspects
    perceived as positive (acceleration, enrichment, and augmentation) to those perceived
    as critical (ethical and aesthetic issues). It also became clear that although
    artists can understand AI as a partner, they still tend to subordinate it to the
    playful mode of creative work and, for example, incorporate an unintended use
    and exploitation. The interviewees also described new challenges and roles. Like
    the findings of Moffat and Sandler (2019) for music production, designing of (sounds,
    tools) becomes an important task of the workflow, so that we can observe a shift
    to ‘aesthetic curation’ in songwriting and composing when it comes to working
    with AI.


    The research could also show that due to the rapid advancement of technology as
    well as the professions involved in it, it is necessary that a large-scale debate
    about creativity and AI is accompanied by “artistic reasoning” and reflection
    of artists (Borgdorf 2012:167). This means that artists need to engage much more
    with AI to explore the scope, contribute evaluations to AI performances and ultimately
    perspectives for socially negotiated discourses around aesthetics, arts, and ethics.
    A consequence of this would be to involve more artists in AI labs and collaboratively
    in the research and development process (Deruty et al. 2022). Artistic Research
    as an emerging field represents an extremely promising approach to this (Borgdorf
    / Peters / Pincho 2020; Zaddach 2021, 2023). In addition, the consequences of
    AI in the field of music and music industry must be more academically investigated
    and accompanied from an even broader, interdisciplinary and professional perspective,
    since “models of taste, identity and motivation will become important as the next
    step in powering a more human-like AI generation” (Brown 2021:15). This also means,
    that AI must also be anchored in the concrete curricula in study programs and
    training courses.


    In our understanding, it may be the complexity and relevance of creative art practices
    for human-beings remains the main difference and differentiation point between
    non-AI and music, even though authors like Hannes Bajohr see limitations in such
    an approach and argue for a post-humancentric ‘critique of aesthetic AI’ (Bajohr
    2022) or like Arthur Miller concludes that ‘in the future machines will be fully
    creative and may even surpass us’ (Miller 2019: 336). However, we argue'
