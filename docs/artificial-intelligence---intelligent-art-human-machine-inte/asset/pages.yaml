  md: '# Mattis Kuhn: AFFIRMATIVE - REJECT. With and Against Ai 209


    The different perspectives, which express themselves not only in terms of content
    but also stylistically, are transferred into a common language model, which in
    principle creates a polyphony in language model. In combination with one''s perspective,
    this can positively result in an extension to external perspectives, i.e., multiple,
    open authorship. In dealing with algorithms that have internalized statistical
    correlations of the dataset, a (limited) polyphony emerges.


    In turn, dealing with (generative) algorithms can also lead to the loss of one''s
    own voice:


    At the beginning, the algorithmically generated strings did not have the highest
    meaning for me. I obviously realised that they were not my thoughts. They did
    not originate in me, they are external to me. Nevertheless, they are partially
    inspiration for my own thoughts. However, it turns out that the machine, which
    is supposed to complement, expand, my thoughts, sometimes leads to speechlessness
    on my part. I rely on the intelligent typewriter. By outsourcing myself and my
    abilities into the machine, my abilities without it decrease. My efforts to develop
    thoughts myself diminish. Primarily I look for suitable suggestions from the machine.
    (Kuhn 2021: 114)⁸


    Thus, using AI means working with external perspectives, whose weight sometimes
    outweighs one''s perspective. On the other hand, this can create more openness.
    The role models (such as "partner" and "companion") suggest singular entities,
