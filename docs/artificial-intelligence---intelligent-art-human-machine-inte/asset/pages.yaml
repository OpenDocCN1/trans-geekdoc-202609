    # Challenges and risks


    As in the general discussion about AI, challenges and especially risks in the
    usage of AI in music and songwriting in particular are debated a lot (Beato 2023;
    Clancy 2023a; Friiler/Zaddach/ Meyer 2023; Deruty et al. 2022). While there is
    the argument that AI can offer some advantages in the creative process, three
    key issues are expressed by the interviewees: legal, ethical, and aesthetic aspects.


    # Legal aspects


    Legal aspects relate to copyright and the associated remuneration of rights holders
    and associated parties. Many different experts as well as data are involved in
    the creative process with these tools: the (usually) copyright protected creators
    of the data used in the data set, the programmers of the codes, the providers
    of the service, the machine or algorithm itself and the artist (who can also occupy
    several of these positions).


    While there are exceptions in the context of research, a problem arises when the
    data used to train the AI is not transparent. Often it is not possible to find
    out which data was used for the generated output. Some argue that AI becomes a
    producer on its own, gaining similar rights as the human counterpart, or that
    the programmers of the AI code hold rights. Carré negates that:'
