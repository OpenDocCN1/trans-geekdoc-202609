  md: '# # The Marcel Duchamp Case in, against, or after Artificial Creativity


    Jan Lhmann Stephensen


    In the introductory chapter titled "Even an AI could do that" of the book Artificial
    Aesthetics: A Critical Guide to AI, Media and Design (2021–23), which is currently
    being published chapter-by-chapter on digital culture theorist Lev Manovich''s
    homepage, Emanuele Arielli, Manovich''s co-author, notes that while some sorts
    of art with more ''traditional'' or ''classical'' characteristics seem quite straightforward
    for an AI to produce, the oeuvre of Marcel Duchamp poses a set of perhaps unsolvable
    problems. In this paper, I will discuss how this argument makes good sense, while
    on other levels less so. In extension of this, I want to reflect on what the logic
    underlying Arielli''s argument might tell us how the ''project'' of artificial
    creativity and artmaking is currently being pursued and perceived.


    # ## Marcel Duchamp, the proto-post-conceptual contemporary artist?


    Artmaking performed by an anonymously working artificial intelligence has come
    to stand as the ''final frontier'' of artificial creativity research (Colton &
    Wiggins 2012), the successful reproduction of Marcel Duchamp, given his status
    as arguably the most important artists of the 20th Century, would be the pinnacle
    of such endeavours. But it actually would so for a number of other reasons than
    the ones Arielli suggests. As I will argue, when I dive into the actual passage
    in "Even an AI could do that", Arielli extends his proposition concerning Duchamp
    to include contemporary art in general, thereby suggesting quite reasonably, I
    would argue—that Duchamp would be considered some kind of proto-conceptual artist
    and also a precursor to contemporary art so-called ''post-conceptual art''. This
    is for instance in accordance with the perspective of Juliane Rebentisch,¹ notes
    that contemporary art no longer seeks to conform to genres or traditions, and
    in this connection credits both the readymade and conceptual art for this ''turn'',
    that has left (or enriched) us with an "unfathomable diversity of artworks" (2013:'
  merge: -1
  img_proc: true
- pgno: 123
  md: '111) as well as with a lot of philosophical and art-theoretical issues to deal
    with. So, the problems Duchamp might pose to AI-art are quite similar to the ones
    which contemporary art would pose, Duchamp just happens to be a good paradigmatic
    example.


    Those familiar with Duchamp scholarship would know that this kind of proposition
    seems to indicate that I am taking sides in heated debates (cf. Buchloch et al.
    1994; Lund / Wagner 2019); I am more or less saying that this particular reading
    – Duchamp as a ‘practical philosopher’ of (pre- and post-) conceptual art – should
    be regarded as the ‘true meaning’ of Duchamp. In my opinion, I am not. I am simply
    referring to the mainstream reception history of Duchamp. Which, of course – and
    here comes an important point of this paper – is not really just a process in
    which the oeuvre of Duchamp has been received or interpreted in this or that,
    right or wrong. It is a process of co-production, that is of making the person
    Marcel Duchamp and his oeuvre into that ‘Duchamp’, which over the decades – beginning
    in the postwar decades when he rediscovered (cf. Crow 1996: 81–87) – has taken
    place between artists, critics, academics, philosophers of art, etc., that is
    within the institution which sociologist of art Howard Becker (1982) refers to
    the ‘art world’. So, perhaps it is meaningful to think of ‘Duchamp’ as a product
    purely than a producer (or even creator).


    In fact, to to the conclusion of this paper, it is really the complicated nature
    of these kinds of inherently social and also political and / or ideological processes
    of co-production within the art world (including Academia), which all entail the
    co-production of art works and their ‘meanings’, as well as artists’ oeuvres and
    (the conception) of artists’ creativity’, that is so difficult for an AI to grasp.
    the problem for an AI is this formalistic aspects concerning an artificial Duchamp
    artwork might ‘look like’, but the fuzzy social stuff that surrounds it.


    # ‘Art and ‘creativity’ as social categories – and their un-artificial Others


    Secondly, this perspective on the socio-historical character of Duchamp into ‘Duchamp’
    and his ‘brand’. It is also applicable to the categories of art and creativity
    in general terms. Thus, I would agree, we should never speak of these phenomena
    as things that just are, in essentialist terms. ‘Art-ness’ or ‘creativity’ is
    a status that is conferred upon artefacts, practices or people – or for that sake:
    technologies – and in this way ‘art’ or ‘creative’ /’creativity’ are co-produced
    through social actions, to make matters even more complicated, are embedded in
    material, technological and ideological contexts. Hence, at least in principle,
    anything (or anyone) could become ‘art'''
