  md: '# Contemplating Automaton Consciousness through Creativity in Rokuro’s Inui’s
    Automatic Eve


    Shoshannah Ganz


    Rokuro Inui’s Kikou No Eve is a work of science fiction published in Japanese
    in 2014 and translated into English by Matt Treyvaard as Automatic Eve in 2019.
    Molly Tanzer describes Automatic Eve as “[a] dark and fascinating meditation on
    what makes us human – think Blade Runner, but set in the Floating World of Edo
    Japan” (2019: front cover). While an apt enough description of a binary – human
    vs. not human – and seminal as Blade Runner is to cultural representations of
    human-automaton relationships, I would argue that Rokuro Inui’s Automatic Eve
    works to break boundaries of human-machine by demonstrating the ‘soul of things’
    or the spontaneous and human-imbued consciousness of automaton. I would like to
    introduce Rokuro Inui’s novel inquiry with an examination of how posthumanism
    facilitates the break and how the historical and contemporary Shinto and Buddhist
    religious and cultural context of Japan further allows for an historical-religious
    and cultural preface for the other-than-more-human possessing consciousness; in
    the language of Buddhism, all beings possess the potential to achieve Buddhahood
    or enlightenment.


    For Donna Haraway, Rosie Braidotti, and Carl Wolfe, many others, far from reinforcing
    the boundaries of human and other, the automaton is a symbol of the breach of
    boundaries or even the dissolution of the lines that separate the human from automaton.
    For Bruno Latour, Jane Bennett, and Deleuze and Guattari, the automaton or robot
