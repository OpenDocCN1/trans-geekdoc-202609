  md: '# Artificial Intelligence – Intelligent Art?


    +   3. The attribution is based on the transformation of conceptual and / or aesthetic
    spaces upon audience contact with the idea or object (3rd-person creativity),
    where the audience explicitly includes any creators or co-creators during and
    after the process of creation (i.e. in attributing creativity, creators are a
    privileged subset of the audience). (One with diachronic access, first access,
    and agency for further change; 1st-person creativity)


    +   4. Any such transformation of conceptual and aesthetic spaces, as well as
    their genesis and recognition is explainable in principle, but not predictable
    (and thus remains non-deterministic).


    It seems clear that this definition is designed to be open to (but not to confirm
    by) the design of machines being creative in relevant ways. By focusing on the
    reception-and inscription of creativity, as well as the processes involved in
    creative behaviour, there is no fundamental distinction between human artists
    and potential non-human authors or sources, other than any distinctions enforced
    by the respective community of judgement.


    Also, it does not require machines to possess or access, conceptual or aesthetic
    spaces themselves, avoiding dependence on certain ontological maps to AI concepts
    and interpretations, which offers conceptual flexibility.


    Thus, many of the most controversial issues in artificial or machine creativity
    can be treated as creativity in general, while also offering pathways to resolving
    some issues around the role of AI in creative processes by pointing out the crucial
    role of the community of judgement. Even more crucially, however, the proposed
    definition disentangles questions of creativity from the related, fundamentally
    distinct question of art. Even in the field of creative AI, dominated by critical
    reflections on the relationship between human and machine, as well as there is
    a tendency to fix the relationship between creativity and art for granted. This
    leads to confusing claims about creativity, as that it “reduced [in discussions
    of generative AI] to repetition of the same” (Zylinska 2022: 50). This holds mostly
    true in artistic, but not in a stricter sense. Generative AI produces an output
