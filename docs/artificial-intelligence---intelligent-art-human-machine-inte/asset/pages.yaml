  md: 'Furthermore, in contrast to creativity does not come with the kind of philosophical
    tradition that would give us a panoply of competing, contextualised and critically
    vetted definitions to choose from. Instead, it has made an astonishing journey
    from religious creation to a core skill within a globalised workforce within a
    mere 200 years, and from obscure mark of artistic genius subject to scientific
    enquiry in a fraction of that. Over period of time, the question ‘What is creativity?”,
    has expressed a number of related and interwoven, yet distinct questions, so that
    there are competing questions when it comes to a basis for defining creativity.
    Historically (that is, diachronically), these questions have touched upon the
    relationship between human and divine creation; between mind, soul, spirit, and
    a creative touch of genius; or transcendental quality of the creator. The competition
    here is about which domain creativity ever belongs to. It is a tradition that
    is still alive in dogmatic assertions that creativity cannot be fully explained.


    From a contemporary perspective, the questions we usually concern such as: How
    do we attribute creativity? How do we produce ideas and objects that are deemed
    creativity? What is the role of creativity in society and discourse? Why do we
    want to be creative? And, in discussing artificial creativity, why would earth
    want to make machines to create, as well? This clear shift in focus is indicative
    not only of the secularisation of especially Western society, but even more of
    capitalist free-market economies and the resulting shifts in societal norms. While
    the historical genesis and notions of creativity is without doubt fascinating,
    this paper will focus on a synchronic perspective. In order to do this, we must
    first sample definitions and approaches currently on offer and evaluate in how
    far they succeed in answering (all) the questions raised above.


    # Functional Definitions


    Before it makes sense to look at different attempts to define creativity, however,
    it is crucial to consider not only criteria for a good definition, but remind
    ourselves that the ultimate end of the act of defining is. Given the success of
    data-driven approaches in pattern-recognition and prediction, it might even seem
    that the task of becoming so somewhat redundant and outdated. Indeed, from domain-specific,
    concept- and definition-based theory towards a kind of ‘post-theory’ relying on
    correlations and machine-generated classification has been noted by some. (Hansen
    2022) Whatever works, goes. Consequently, there seems to be


    In fact, it seems that this connection between shifting notions of creativity
    and the economic climate in which they have taken place explains the ‘whiff of
    reactionism or conservatism’ attached to discussions around authorship.'
