- pgno: 125
  md: '# Artificial Intelligence - Intelligent Art?


    So, the problem I would argue, is not, as it is so often claimed, that we have
    yet figured out what creativity (or art) is (and subsequently: how to reproduce
    it). It is rather, that we have forgotten that we have, in fact, invented it,
    as well as how and why (Stephensen 2022). And we have forgotten that it for instance
    at some point would have been unthinkable – to paraphrase both Andreas Reckwitz
    and Michel Foucault (2003) – to think of ourselves as the creative; to expect
    and evaluate your workplace as the natural venue for the actualization of your
    creative nature and aspirations; or for that sake: to think of creativity being
    as pivotal to our socio-economic structures that it is crucial to automate the
    form of artificial creativity. As Donna Harvey seminally notes, “it matters what
    we use to think with other ideas with”, “it matters concepts we think to think
    other concepts with.” (2016: 12 and 118). Hence, as a minimum, it would be a good
    starting point to recognize the fact that we are, in fact, thinking with ideas.


    # Even an AI could do that!


