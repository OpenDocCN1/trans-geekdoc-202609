  md: '# About the Authors


    **Robin Auer** is currently working towards a PhD as part of an interdisciplinary
    research project on automated creativity in literature and music at TU Braunschweig,
    funded by the federal state of Lower Saxony, Germany. His work focuses on the
    interplay between human and machine creativity in coupled embodied creativity
    systems, (particularly artistic) creativity and art itself. Previously, he has
    completed degrees at Ruptcht-Universität Heidelberg and Merton College, Oxford.
    His research interests includes theories of consciousness and creativity, philosophy
    of mind, science and language, as well as semiotics, and literary theory. He has
    published papers on transhumanism & embodiment, as well as the literary works
    of J.R.R. Tolkien.


    **Hannes Bajajr** (PhD) is a postdoc at the Seminar for Media Studies at the University
    of Basel. He works on the history of ideas of the 20th century, political philosophy,
    and the theories of the digital. Most recently, he published *Schreibenlassen.
    Texte für Literatur im Digitalen* (Berlin 2022), *Schreiben in Distanz* (Hildesheim
    2023) and (Berlin, Miami) (2023). Beginning the fall of 2024, he will be an assistant
    professor of German at the University of California, Berkeley.


    **Jenifer Becker** is a writer and cultural scholar living in Berlin. Her work
    deals with ambivalences of digital cultures. She completed her doctorate in 2021
    at the Literaturinstitut Hildesheim, where she has been teaching and researching
    since 2015. Current artistic-scientific research projects deal with the influence
    of adaptive technologies (AI) on writing processes, writing procedures as well
    as genres. She is the director of the AI-Labkit project. She writes prose and
    multimedia performances. Novel *Zeiten der Langweile* was published by Hanser
    in 2023.


    Dr. **Nikita Brainski** works at the intersection of musicology and the study
