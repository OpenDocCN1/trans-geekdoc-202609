  md: '# Artificial Intelligence – Intelligent Art?


    machines, bringing meaning and values, including dominant assumptions and biases
    that subordinate, into the process of one''s own knowledge creation. We believe
    this calls for more critical introspection of one''s own practice following Leur
    (2017:145) who states,


    > "it is through being critically self-reflective about one''s positionality,
    locating practices within wider power relations and structures, that we can begin
    to destabilise the normalised politics of knowledge production".


    Therefore, in presenting the framework below, we aim also to reflect on the positionality
    and the ethics of our research, in part through revealing the individuals and
    the corresponding assemblages in the development of tools and processes.


    # Strand One: Augmentation of performative practice through An wearable design


    This section proposes a hybrid methodological framework that discusses the technical
    and formal aspects of augmenting an embodied practice for actor training by means
    of a custom-made wearable device which gives the body a voice. The device is an
    interactive system that uses an Artificial Intelligence (AI)-based module to map
    movements to synthesised sound. Our framework draws on techniques from the fields
    of contemporary performance, wearable technology design, Human-Computer Interaction
    (HCI) and AI pipeline design.


    # Methodological framework


    Embodied Voice and AI project, our team focused on a particular method for physical
    actor training chosen from the post-Grotowskian repertoire. This choice of method
    was motivated by reasons. First, according to Wolf (1996), Grotowski’s practice,
    constituted a laboratory of embodied research, and his rigorous system of actor
    training mirrored his fascination with science. Thus, his epistemic aims towards
    reproducibility of results and claims of scientific objectivity resulted in methodologically
    unique approaches to the embodied practice. This structured way of working, which
    inspired generations of practitioners, could serve as a


    +   1 Grotowski was a Polish theatre director and theorist whose innovative approaches
    to theatre training involved the study of performers immediate, "organic,"animal-like"
    psychophysical responses to impulses where "there is no discursive moment to block
    organic reaction, to get in the way" (Richards 2003:66). He called the process
    of eradicating such blocks via negative (Grotowski & Barca 2002:17).'
