    # Conclusion: Human Learning through Machine Learning


    In the age of timbre transfer and after the death of the author (Barthes 1962),
    two things can be said. Thanks to spawning as a form of machine learning, it will
    be possible in the future to speak with the voices of dead authors without sampling
    them directly and producing something they have already said. And as this is least
    unreasonable to the amateur, it bears numerous dangers and uncertainties. But
    it also bears creative potentials that can be found at the edges of various AI
    productions. As the previous experiment showed, the result is not the trained
    Hendrix sound, but an in-between that is tempting and more than the reproduced
    imitation of the original. Such approaches are apparently not least because we
    listen exclusively with our ears but also with our other senses, our memories
    and depending on the most diverse contexts (Schulz 2018; Stereo 2023). In this
    way, the reference to Hendrix becomes culturally significant without being recognized
    as a sound event.


    The neural networks are characterized by their type of so-called unsupervised
    deep learning. Once the process is set in motion, it cannot be continuously monitored
    or interrupted by a human. In this sense, the human autonomously determines the
    parameters of the process, as I have shown with some examples, and ultimately
    orders the results with a view to an aesthetically meaningful outcome. Following
    Marshall McLuhan (1964), the question is: What is the message of AI? In other
    words: What influence does it have on music and its protagonists, compositions
    and performances? For researching the messages of AI, and for recognizing the
    limitations during the use of the media that determine our situation, application-oriented
    approaches are crucial, such as those provided by the Magenta project from the
    environment of Google’s AI Tensor Flow or artists like Holly Herndon.


    Collaborating with the tools means relinquishing part of the control, as was already
    practised a decade ago in particular the aleatoric and open works of John Cage,
    Pierre Boulez or Karl-Heinz Stockhausen in relation to the classical score or'
