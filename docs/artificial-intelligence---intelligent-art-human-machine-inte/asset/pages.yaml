    # AI Art


    The innovative dimensions of cybernetics are updated and reflected in the courses
    on artificial intelligence (AI) and its aesthetic Dimensions. From a technological
    point of view, the discussion about AI and art has taken on a current dimension
    with the introduction of Neural Networks from 2015 on which can be described as
    a paradigmatic change within computing (Sudmann 2018: 55–59). Accordingly, the
    resumed interest in Neural Networks is due publication by Krizhevsky/Sutskever/Hinton
    from 2012, which explored the possibility of image recognition by reducing the
    error rate more than 50% and revived the interest in Neural Networks (Sudmann
    2018: 61). In contrast to ''symbolic AI'', which could generate intelligent producers,
    the new Neural Networks were designed to simulate thinking processes through a
    large number of interconnected processing nodes, or ''neurons'', which work together
    to process information and make predictions or decisions based on that information.
    At a high level, a Neural Network takes in data, processes through multiple layers
    of interconnected nodes, and produces an output. Each node in the network is connected
    to multiple other nodes and processes a small portion of the input data. As the
    data passes through the network, it is transformed and combined at each node,
    with the output of one node serving as the input for the next node. This process
    continues until the final output is produced (Sudmann 2018: 60).


    The strength of the connections between nodes, and the weights assigned to each
    node, determine how the network processes the input data. These connections and
    weights are adjusted through a process called training, in which the network is
    presented with a large number of examples and the correct output for each example.
    The network then adjusts the connections and weights based on how well it is to
    produce the correct output for each example (cf. Sudmann 2018: 59–61).


    Neural networks are a powerful tool for AI and machine learning, and have been
    applied to a wide range of tasks, including image and speech recognition, language
    translation, and decision making. In the context of art, Neural Networks have
    been trained to understand the style of canonic painters or musicians, and let
    the networks reproduce them. “The Next Rembrandt”, for example, is a project in
    which a Neural Network was trained on a dataset of Rembrandt''s paintings and
