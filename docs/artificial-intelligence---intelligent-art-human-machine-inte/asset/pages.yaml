  md: '270 Artificial Intelligence - Intelligent Art?


    She further says: "We assert our attachment to the species as if it were a matter
    of fact, so much so that we can construct a fundamental notion of Rights around
    the Human" (ibid.). The above-quoted European Artificial Intelligence Act is one
    attempt to construct a fundamental notion of ''Rights around the Human'' and therefore
    makes a hard cut between ''human'' and ''the technology'' or the ''machine'' –
    a diagnosis that falls behind well-established insights of Feminist Science and
    Technology. Already back in 1991, Donna Haraway questioned the dualism human on
    one hand and machine on the other. She called this a ''leaky distinction'' (152).
    An anthropocentrism, however, leaves this dualism intact and focuses only on one
    side: the human. By reading the guidelines for a regulation of AI above, it becomes
    apparent that it contains several judgements about technology that inform and
    infuse this anthropocentric perspective: one reads aboutworthiness or risks².
    This allows to a humanist concept of an individual, that is (or should be) autonomous,
    by reason wisdom and rationality. It is an "aesthetics (as a mode of philosophical
    enquiry") (Fazi 2029: 3) that perceises digitalisation, computation and technology
    as something non-human that can be perceived by means of human aesthetics. This
    is a problem, because this is merging the paradigms of human exceptionalism mentioned
    above. "There are warnings about a ''data colonialism'' (Coudry/Meijas 2019: 83)
    where corporations act as colonizers who deploy digital infrastructures of connection
    to monetize social interactions, and the colonized are relegated to the role of
    subjects who are driven to use these infrastructures in order to ensure their
    social lives" (86). It seems paradoxical to criticize the human-centeredness as
    one possible reason for marginalization and this new form of colonialism and not
    rather a lack thereof (human-centeredness). I refer again over history to exclude
    marginalized people from the realm of humanity. Eduardo Viveiro de Castro (2009)
    analyses the construction of anthropology''s subject and hints at the fact that
    his founding patron could be Copernicus who only perceives himself in the Other.
