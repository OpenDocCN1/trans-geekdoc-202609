  md: '# Mattis Kuhn: AFFIRMATIVE – REJECT. With and Against Ai 207


    #  Extension through technology


    One of the goals in designing and implementing technology is to extend our cognitive
    abilities. A canonical artistic project in this regard is "Signwave Auto-Illustrator
    by Adrian Ward (2000). Through adding generative processes he extends the tool
    palette for working with vector data known from Adobe Illustrator, which itself
    extends the design competence of the user. Ward''s software is also uncontrollable
    to a certain degree, which can give the impression of machine autonomy. The program
    not only does what it is asked to do, but goes beyond it, which also puts it beyond
    the control of the user. "In opposition to the familiar and reliable functions
    in Adobe Illustrator, the functions in Auto-Illustrator are not strange, bordering
    on the nonsensical, but partly uncontrollable. The software tool more or less
    autonomously generates various effects of surprise and randomness in the design
    process". (Transmedia 2013) This points to the influence that tools, especially
    software, export to our design (and on the world in general) through their guidelines
    and restrictions, and how they are constructed, and used by us-oriented tools.
    In point, see Trogmann (2020).


    In everyday life, this authorship of software is toughened or marginalized; in
    "Signwave Auto-Illustrator" it emerges. Of course, the resulting artifacts rely
    on the interaction of the user with the software and would emerge without them.
    But it is obvious that authorship does not lie solely with them; Ward co-inscribes
    himself in the artifacts with his software. According to Ward, it is "naive [...]
    to ascribe autonomy to a machine program because it executes the agenda and inscribed
    subjectivity of its programmer [...]". (Cramer 2021: 283)*


    # Working against technological development


    Software enables us to do things that would not be possible and often unthinkable
    without it. This is especially evident through the developments in machine learning
    in recent years. However, extension has its price in the dependency on these extensions
    and possibly their authors, etc. (In relation to Adobe software, this is only
    now becoming clear through its business model of the "Creative Cloud". Art produced
    by machine learning is to a strong extent conditioned by technological developments.
    On the one hand, this has always been true specifically for technology-heavy art
    (media art), but on the other hand, the effects have been more widespread in recent
    years. There are several reasons for this. Following on Rautberg''s considerations
    mentioned above, technology corporations, as well as university research institutions,
    have chosen particular art genres and canonical works to demonstrate algorithmic
    capabilities. On the other hand, ML applications have become so accessible that
    no programming is required at all to'
