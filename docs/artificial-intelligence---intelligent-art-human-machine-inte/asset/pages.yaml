  md: '# Artificial Intelligence – Intelligent Art?


    widespread in a variety of social contexts – including those of music. The attribution
    of artistic autonomy to technology conjures a new kind of machinic counterpart
    that supposedly threatens the privileged position of humans. This implies an understanding
    of the relationship between human and machine as binary. Accordingly, the emergence
    of “intelligent” technologies is associated with questions about the equality
    of human and machinic creativity, by the liberation from musical work through
