  md: '# Embodied Voice and AI: a Techno-Social System in Miniature


    Diana Serbanescu, Scott DeLahunta, Ilona Krawczyk, Kate Ryan, Mika Satomi


    # Motivations


    One of the original motivations for the practice-based research presented in this
    paper is rooted in the premise that embodied knowledge is relevant to the field
    of AI, not only in terms of application to design but also in terms of critical
    practice. A key proponent for integrating embodied knowledge into Human-Computer
    Interaction, Schiphorst (2009: 225) reckons ''embodiment in the context of designing
    for technology'' matters, and ''concepts as embodied cognition and embodied interaction''
    require strategies that take advantage of our senses, accessing a richer and more
    articulated form of human being. In terms of critical practice, feminist techno
    science scholars such as Leurs (2017:137) regard the researcher as an embodied
    subject, and stress the importance of materiality, by emphasizing the relational
    entanglement of bodies and infrastructures in the creation of knowledge. In her
    seminal book, Artificial Knowing: Gender and the Machine, Adam (2006) argues that
    ''the body plays a crucial role in the making of knowledge''. The draw on feminist
    research to counter the dominant science discourses that show elite intelligence
    with rationalistic problem solving, in which claims for objectivity and universal
    truths propagate feminist calls, a ''view from nowhere''. Anthropological Suchman
    (2007) in her critique of the ''disembodied intelligence in AI'' also points out
    ''feminist theorists have extensively documented the subordination, if not erasure,
    of the body within the Western philosophical canonical'', an erasure Suchman claims
    to the field of AI and Robotics.


    While addressing the wide literature and theory in both application design and
    feminist critical practices lie outside the scope of this paper, these are the
    kind of perspectives that provided the original motivations for embarking on our
    research project. Continued research will further explore the implications of
    these theories for this practice-based setting. What can we do is to acknowledge,
    as Suchman (2007) posits, following Haraway (1997: 11), that ''technologies [...]''
    are forms of materialised figuration''. They are brought into existence by assemblages
    of humans and'
