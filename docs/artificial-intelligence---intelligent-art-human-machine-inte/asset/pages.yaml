  md: '# Artificial Intelligence – Intelligent Art?


    As Mike D''Errico (2022: 9) argues, Eurocentric standards of music such as the
    twelve-tone-scale or 4/4 time signatures are inscribed in most music songwriting
    and production tools such as DAWs. Such a "white racial frame" (Ewell 2020) leads
    to unconscious biases and practices of exclusions. Potentially, AI tools could
    overcome this, however, depends on ethical considerations in the manufacturing
    process. Ethically questionable practices of companies producing AI tools can
    potentially be reproduced in the results of such – even if they contradict the
    intentions and views of the users. This constantly confronts the problem that
    through their use of AI they would support (neoliberal) global powers, dependencies,
    racism or misogyn ideologies that they may criticize. The aforementioned communities
    could help to deal with issue. Examples of that are the Glitch Feminism Manifesto¹
    or the work of the ‘Indigenous Protocol and Artificial Working Group.’


    Another concern are the working conditions of songwriters and composers in the
    field. A field not only at risk but already heavily influenced by algorithms is
    the field of commercial music for movies, teasers and commercials. Potentially,
    this can expand to specific and instrumental microgeneres or mood-based background
    music, which play a significant commercial role on streaming services like Spotify.
    The mentioned potential of accelerating the process could lead to new business
    standards with expectations and deadlines that literally require the usage of
    AI. Further, exploitative practices on the shoulders of creatives that have been
    prevalent for some time in the development of music software and hardware (and
    not just there) (D''Errico 2022), must be critically observed and prevented.


    Aesthetic aspects

    Finally, the interviewees discussed aspects that regard the role of the creative
    human in relation to AI. All Interviewees are convinced that artists would not
    be replaced by AI in future. Instead, they see AI as an extension of the toolbox
    of creatives as described above. This appears to be a widespread view and is described
    by Artemi-Maria Gioti as “human-computer co-exploration” (Gioti 2021: 62–64) respectively
    “distributed human-computer co-creativity” (Gioti 2021: 56). D''Errico speaks
    of “interface aesthetics”, defining it as “a general framework for working through
    relationships between theory and practice, concept and technique, aesthetics and
    poiotics” (D''Errico 2022: 15). Second, the interviewees emphasize the relevance
    of the aesthetic dimensions of creative practices. They see a difference between
    AI and one that has an intrinsic desire of artists to express themselves and create
