  md: '# Conclusion


    This chapter looks at the complex relationship between art and AI. In historical
    retrospect, it was possible to show the extent to which a connection between technology
    and art was established with the help of the cybernetic claim to art. However,
    in its early days, technical art was not integrated into the art world, but existed
    in parallel, mainly in the technical universities.


    The shift in emphasis of artistic creativity to machine processes raises questions
    about the status of authorship. It becomes clear that authorship in artistic processes
    functions only as a ban in the discourse and as a sales strategy. With regard
    to the avant-garde productions of early modernism, Anke Finger (2021) clearly
    shows that many works of avant-garde provide a reflexive network between materials,
    media and creative actors.


    The newly developed Neural Networks continue a programme developed by cybernetics
    organising independent feedback and learning processes. Creative work thus becomes
    the hallmark of digital intelligence. Questions about the specific creativity
    of Neural Networks also touch upon the social, structural and aesthetic dimensions
    of the art system, and are ultimately linked to the concept of art.


    Another aspect of neural creativity cannot be ignored by the networks'' working
    methods. As has become clear in the meantime, the results of the networks depend
    on their data situation and their respective input. The input or visual archive
    of the networks comes from aesthetic and/or social decisions. These interfaces
    provide the space for a creative, aesthetic cooperation between machine and artist,
    thus opening up the network of materials, procedures, media and art business that
    was already in use in the avant-gardes. The creative, artistic intervention in
    the workings as Inke Arns (2021) points out. With this creative intervention in
    the workings of artificial intelligences, a traditional function of art, that
    critical reflection on contemporary societies, has been restored. And, at the
    same time, the unsettling intelligence of artificial thinking domesticated?


