    Who do we want to be each other?


    The new computerised MusikingThings that were produced and marketed widely in
    the 1980s as part of a globalised system of work – the TB-303 being one of them
    – associated with specific expectations at the time. The availability and functionality
    of these things promised a democratisation of music production in several respects:
    through their affordability, more people should be able to have production tools
    at their disposal; through the possibilities of digital storing and automation,
    music production should be more accessible and there should be fewer musical and
    technical prerequisites changed (Heberge 1997: 72–90). Correspondingly, the rhetoric
    around electronic music changed fundamentally. However, “[t]the notion of music
    technologies’ democratising powers is a myth and a miscalculation: the tropes
    of broad access and effortless music-making feed off of labour happening elsewhere,”
    as Luice Végneroi (2017: 251) notes with reference to the neo-colonial and patriarchal
    exploitation of women in Southeast Asia by the transnational electronics industry.
