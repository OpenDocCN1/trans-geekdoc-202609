    # Acting with other perspectives


    Machine learning based on Big Data works with the perspectives of others. Image
    models are based on thousands of photographs, usually taken by people (or machines)
    other than those who develop and use the models. See, for example, the artistic
    explorations of the conditions under which datasets are created by Philipp Schmidt
    (2019), Elisa Giardina Papa (2020) and Andrew Harvey / Jules Laplace (2021). Of
    course, many perspectives are also neglected or excluded in the process, see the
    “Feminist Data Set” by Caroline Sinders (2017) and the “Library of Missing Datasets
    2.0” Mimi Onuoha (2018).⁷ Nonetheless, an artificial neural network developed
    in this way can broaden one''s perspective.


    The different external perspectives can be particularly evident when working with
    large-scale language models. Even though these are still based on very exclusive
    data sets, it is possible to infer the origin of generated texts on the basis
    of stylistic differences. See the different text types on the same topic in Kahn
    (2022): All texts have in common that their topic is “Grasslands for Insects”.
    Are written in the form of a short scientific text or an abstract, others from
    a first-person perspective or in the style of an advertisement or a short narrative.
    The model (GPT Neo) was trained with the dataset “Pile” (Gao 2021). This is composed
