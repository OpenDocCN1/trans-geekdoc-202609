  md: '# Where Machine and Muse¹ – Towards a Creativity of AI Art


    Angela Krewani


    # Introductory remarks


    Art was and is regarded as a field of human creativity, which far exceeds machine
    processes. However, the discursive separation into mind and machine has a long
    tradition preceding digital art, aptly described by Stefan Rieger as “negative
    semantics”. According to Rieger, this tradition can be found in the guiding values
    of the Goethe period, which was dedicated to individualisation and therefore also
    distinguished the mechanical as “disdainful” (2018: 117). In the historical tradition,
    the individual and the mechanical are mutually exclusive, as is still advocated
    in discourse today. Dieter Mersch (2019: 66), for example, currently argues against
    the procedures of artificial intelligence, stressing that the history of cybernetics
    postulates an abbreviated “homology of logical structures and the synaptic activity
    of nerve cells”. For him, the close entanglement of consciousness and technology
    is the hallmark of the historical and current debate about artificial intelligence.
    Mersch contrasts the negative impact of cybernetic thinking and digital technology
    with phenomenological considerations of body knowledge, which do not fit into
    the equation of consciousness and machine. On this basis Mensch formulates a “critique
    of algorithmic rationality” that positions itself beyond algorithmic creativity.


