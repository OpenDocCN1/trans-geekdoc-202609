    # AI-based tools in music: A possible timeline


    To better navigate change, it is helpful to sort existing and future technologies
    in temporal categories, grouping together those that are already available, those
    that are likely to appear soon, and those that are possible, but only in a relatively
    longer term. The following overview aims to create a hypothesis about these temporal
    categories:


    Music-related technologies that are commonly available now:


    +   1. Searching existing corpora of musical notation for motifs and melodies.

    Example: notation-based search in the database "Répertoire International des Musicales"
    (RISM. Advanced search, no date).


    +   2. Automatic detection of pitch in (preferably monophonic) recordings.

    Example: pitch detection in the software "Sonic Visualiser", using one of the
    available "Vamp" plugins (program extensions) (Sonic Visualiser, no date).


    +   3. Transcription of recordings (preferably, one instrument, specially piano).

    Example: Transcription of piano recordings using the tool "Onsets and Frames"
    by Magenta (Hawthorne et al., 2018).


    +   4. Detection of tempo and key (notated Western music using the "music21" programming
    toolkit (Cuthbert / Aiza 2010).


    In short-term future, the developments seem likely to appear in areas of work
    related to music:


    +   1. Comprehensive high-quality corpora of historical notated music

    Example of existing work that points in this direction: Digital editions of Beethoven''s
    works, available at: (Beethovens Werkstatt, no date)


    +   2. Further work in directly generated sound, without the intermediary step
    of creating notation

    Existing work that points in this direction: The "Jukebox" project at OpenAI (Dhariwal
    et al. 2020).


    In a longer-term perspective, the following new possibilities are, in my opinion
    likely to occur:'
