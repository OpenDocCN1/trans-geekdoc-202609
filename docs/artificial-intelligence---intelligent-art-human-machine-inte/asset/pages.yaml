  md: '# Nikita Baguinski: The Upcoming Change in Human Musical Thinking 251


    +   1. Almost fully automated "pipelines" for producing music in popular genres,
    based on statistics of the audience’s listener behaviour and other characteristics.

    Developments that might point in this direction: Existing music-generating technologies.
    Statistical approaches towards data about listener behaviour.


    +   2. Streamlined and standardized searching, collecting, and presenting of relevant
    findings from large corpora of music literature.

    M point in this direction: Existing tools for summarizing text as well as for,
    conversely, augmenting bulletpoints into this text, notably, GPT-3 from OpenAI
    (Brown et al., 2020).

    Recommendation systems for academic literature used by university libraries and
    services such as Google.


    This short essay does not touch upon questions of ethics and academic independence
    arise in the technological situation in which many music-related actors find themselves
    in this moment. Still, I want to briefly mention here that services like Spotify
    and social media companies have collected data user interaction with music that
    could become a paradigm-shifting new kind of measurement of human musical behaviour.
    However, ethical questions connected to the use of data, and the very independence
    of academic research in a situation where researchers depend on privately owned
    data are urgent problems that need to be addressed by a broad discussion in the
    research community.


    Finally, I would like to end this with a few words concerning its intrinsically
    speculative character. Like any other attempt at thinking through the future,
    this essay will inevitably be defeated by the future itself in certain areas,
    and confirmed by others. My ideas about possible future developments that I present
    here do not have the goal of predicting the future in its entirety, of fostering
    productive debate, testing ideas for interdisciplinary collaboration, and of triggering
    discussions on which future-influencing steps need to be made, and in which direction.
    It is crucial to create more collaborative expertise on technological tools in
    music-related areas, bringing together expertise from many areas, including musicology,
    music theory, computer science, sociology, the history of science and technology,
    and the history of humanities.


    A critical reflection on the possible impact of AI tools on individuals, society,
    culture, and academia is needed to lessen the danger of ignoring change until
    its negative aspects have established themselves in a too deep and obvious manner,
    as has happened with previous examples of social media such as filter bubbles.
    At the same time, it is vital to steer clear of critique based on purely emotional
    assumptions about technology and its effects. Informed solutions and sustainable
    roadmaps for future change are now required in many areas of professional music.
    A balanced approach is vital for guiding music professionals and musicologists
    through the impending period of orientation and change due to the emergence of
    AI-based tools and large collections of music-related data.'
