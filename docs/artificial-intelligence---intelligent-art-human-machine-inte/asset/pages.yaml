- pgno: 13
  md: 'B Bender ("We now have machines that can mindlessly generate words, but we
    have learned how to stop imagining a mind behind them", in Tiku 2022) and Nitasha
    Tiku (2022, "there is already a tendency to talk to Siri or Alexa like a person")
    have articulated this reverse problem in human—machine interaction: the fallacious
    tendency to inappropriately accord sentence. The discourse around AI has suffered
    immensely by various interests guiding the language used, not the least to boost
    and monetize businesses such as OpenAI (sponsored by Microsoft and for-Elon Musk).


    The main argument by Bender et al. (2021: 616) again relies on the lack of semantics,
    coherence and comprehension in full:


    Our understanding of coherence derives from our ability to recognize interlocutors''
    beliefs and intentions within context. [...] Text generated by an LM is not grounded
    in communicative intent, any model of the world, or any model of the reader''s
    state of mind. It can''t have been, because the training data never shared thoughts
    with a listener, nor does the machine have the ability to do that. The problem
    is, if one side of the communication the implicit does not mean, then the comprehension
    of the implicit meaning is an illusion arising from our singular human understanding
    of language [...]. Contrary to how it may seem when we observe its output, an
    LM is a system for haphazardly stitching together sequences of linguistic forms
    it has in its vast training data, according to probabilistic information about
    how they combine, but without any reference to meaning: a stochastic parrot.


    The communis opinio holds, therefore, that language models such as GPT-4 emulate,
    or simulate understanding on the basis of statistical knowledge. It is surprising
    that while terminologies of ''simulation'' and ''emulation'' are frequently used
    with reference to these language models and NLP, and the ability of AI to simulate
    and emulate the cultural imagery in films as The Matrix (1999), the full implications
    of this AI aspect have been too rarely examined. When we think of, instance, NLP
    applications as simulation engines articulate that they are merely imitating the
    production of language — when we address AI productions as emulations, we suggest
    that they are artificial in the sense of being real, but not produced by natural
    means. Clearly, the idea of emulation is closer to what AI language generation
    is: the recombination of linguistic items according to probability. It is, therefore,
