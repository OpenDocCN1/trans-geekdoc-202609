    In these essays, but also in Zaddock/Tillmann, the man-machine remains a potentially
    flawed one that draws its humanity from this non-perfection. At the same time,
    modernization thrusts through the introduction and implementation of new technologies,
    whether in music production, marketing, presentation or consumption, always mean
    rationalization unless what. Jobs of musicians, technicians or such editors are
    eliminated, and usually a new, but numerically smaller number of new jobs are
    created. Nikita Braguinski deals with such potential effects of AI from the perspective
    of music theory. What processes relevant to music theory can be imitated by machines,
    and, therefore, have an impact on the job description of musicians, composers,
    teachers and researchers?


    # AI Aesthetics and AI Ethics


    It will become clear that aesthetic and ethical issues are inextricably linked
    in the field of AI art, and in this spirit, this volume must not skirt the ethically
    problematic of AI creativity, issues of fairness, transparency, bias and safety.
    These issues were paradigmatically raised in Catherine O''Neill''s diagnosis in
    2016. She argues that the conjunction of Big Data and algorithms – described as
    Weapons of Math Destruction in their title – are pervasive, opaque and unregulated.
    What is more, O''Neill misses in a wholesale manner the potential of stochastic
    and probabilistic data applications for contributing to progress and tackling
    challenges: “Big Data processes codify the past. They do not invent the future.
    O''Neill 2024) requires moral imagination, and that''s something only humans can
    provide”. The recent Oxford Handbook of Ethics explores the logic and socio-cultural
    questions of AI from a variety of viewpoints. Timnit Gebru’s chapter “Race and
    Gender” discusses automated facial analysis systems that have higher error rates
    for dark-skinned women, while having minimal errors on light-skinned men. She
    summarizes that AI “has been shown (intentionally or unintentionally) systematically
    discriminate those who are already marginalized” (Gebru 253).


    We can agree with Gebru that the sociopolitical and ethical investigation of harmful
    consequences of AI is lagging behind its technological advances. Attempts at regulating
    AI have increased, such as the ban of ChatGPT in Italy (in April 2023). In 2021,
    the EU has sought regulation of AI in its proposal for landmark AI Act, by applying
    a classification system that proposes three risk categories (unacceptable risk,
    such as government-social scoring; high-risk, such as CV-scanning tools; unregulated
    low risk applications). In March 2023, the “Future of Life Institute” published
    an open letter demanding a moratorium on AI research,'
