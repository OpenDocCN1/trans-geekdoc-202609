    by Omar Peracha (https://omarperacha.github.io/make-js-fs-fake/). This repeats
    itself twenty-three beats.


    In this A.I. generated text, among others, I was struck by its sudden ending.
    When ''GPT-2'' is generating, the user instructs how many characters to generate.
    Due to its transformer architecture, ''GPT-2'' does not plan forward. It only
    looks back to what has already been generated whenever it generates a new token.
    When it reaches its arbitrary character limit set by the user, it simply stops.
    It cannot plan a 100-character length ''story'', for example, because it is not
    able to plan forward. In this movement the music simply stops when the text comes
    to an end, which does not coincide with the end of any pattern described above.
    The inspiration for such a technique comes also from composers such as Birtistle
    (i.e., Carmen Arcadiae) and Edmund Finnis (i.e., The Air, Turning).


    # Lecture Performance


    As already hinted in the paragraph above, the last transformation of the work
    came in form of a lecture performance at the University of Oxford in November
    2021. The performance was a mixture of different media and perspectives. The first
    part introduced the process, the creation of the fragments and explained the rebuilding
    process. In the second part we read the narratives, presented the illustrations,
    and performed the musical pieces on stage. Throughout the Performance we presented
    perspectives of the project through different means of interaction: while Robert
    and the musicians were on stage, the reading of the fragments done byenzel as
    well as a contextualisation of the fragments by Chelsea, came via zoom. After
    the presentation, there was a Q&A session in which the audience got invited to
    discuss with the performers, pose questions to the project and engage in a discussion.


    # A.I. for transmedia collaborations


    Through this project, we found that A.I. acted as a useful way to facilitate collaborations
    across different media and disciplines. We were able to use algorithms generating
    text, and despite having very different levels of experience with algorithmic
    processes or computer programming in general. This allowed us to contribute meaningfully
    to artistic areas that were not naturally ours own. Going forward, it seems as
    A.I. might be as useful as a means to ''try''-another collaborator''s discipline.
    This might allow collaborators to much more quickly engage in higher-level discussions
    and decision-making.


    In addition, using A.I. as part of a collaborative artistic project inherently
    mandated many creative decisions to which we all contributed. During the'
