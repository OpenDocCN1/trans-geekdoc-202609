  md: 'CLIP (Radford et al. 2021) and DALL-E (Ramesh et al. 2021) signalled the start
    of a new era of image generation. Although the DALL-E model was not released,
    CLIP was made available to the public, and the model was quickly adopted by AI
    artists who applied the idea of CLIP guidance to various image generation techniques.
    Ryan Murdock produced the called DeepDaze, combining CLIP and SIREN, and BigSleep,
    combining CLIP and BIGGAN, which were subsequently adopted by Catherine Crowson
    in the widely distributed VQGAN+CLIP notebooks.


    The paper Denoising Diffusion Probabilistic Models (Ho / Abbeel 2020) introduced
    a different method for creating generative models. This technique trains a model
    by adding increasing amounts of noise to an image and having the model remove
    the noise, resulting in a model that can generate images from only noise. Diffusion
    models, when combined with CLIP or other conditioning processes, enable much faster
    text-to-image processing.


    The popularity and accessibility of these techniques was further raised by the
    product release of DALL-E 2 (Ramesh et al. 2022) and Midjourney became popular
    it is now the largest Discord server with over 5 million members as of writing.
    Following the releases of these products, open source models such as Stable Diffusion
    have also been developed. There are many benefits of using free and open source
    models for artists. Being able to modify and develop on your hardware allows the
    artist to pursue their own experimental approaches, not restricted to the interface
    designed by a service provider.


    The artist''s involvement in generating new images with these models is vastly
    different from working with GANs. Rather than building custom datasets and training
    models, instead the focus has shifted to writing prompts that can generate the
    images artists want to find, and designing interfaces for exploring these prompts
    Johannes coined the term "Promptism" (Heron / Dryhurst 2022) for art practice,
    and wrote a Humorous Prompt manifesto using GPT-3. Against a backdrop of models
    trained on hundreds of millions of images scraped from the internet, the manifesto
    asserts "The prompt must always be yours" (Johannes 2021).


