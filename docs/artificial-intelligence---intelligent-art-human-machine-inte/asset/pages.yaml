  md: '# Artificial Intelligence – Intelligent Art?


    ecological problems this material carries. We composed four different datasets
    of images of layered plastics in our planet: landfills, plastic on top of water,
    plastic underwater, and plastiglomers. The ProGAN model was trained on a local
    machine using pytorch and took a week to train, and we used part of the images
    generated during training to create a video composition.


    A metal totem displaying those synthetic, as plastic is, layers, we draw attention
    not only to the problem of waste but also question whether AI has similarity with
    this material. Since the invention of plastic, this material was applied almost
    everywhere because of its perfect qualities, until we realised that it is not
    sustainable and ecology-friendly. Will a similar story happen with AI?


    From the practice-based research perspective, this artwork artists'' desire to
    move from a still to moving image and towards sculptural form that is held back
    by the early stage of machine learning technology: low resolution images from
    one to another.


    The next artworks postcard Landscapes of Lanzarote (00:18:37) and II (00:18:40)
    in 2021 demonstrate the artists'' ability to create video works with StyleGAN2
    (figure 2). The hypnotic appearance of these works, where one frame morphs rather
    into another, shows the artists'' ability in guiding the outputs of the NN. Vector
    curation and composition of a journey through the latent space, created by training
    the model on specific datasets of 2000+, were crucial and integral parts of the
    artistic process.


    The artwork talks about critical tourism and how circulation of images representing
    touristic gaze overpowers the nature of seeing. In the words of Jonas Larsen “reality”
    becomes tourism, and for visual consumption (2006: 241–257). Here, we scraped,
    where licence allowed, the location-tagged images from Flickr and composed two
    datasets of photos categorized as tourism or landscape.


    As we have written elsewhere,


    the art project consists of two videos representing a journey of critical tourism
    through the latent space of AI-generated images using StyleGAN2. Later the images
    are composed into latent interpolations that take the form of smoothly progressive
    videos. The two videos are random walks in the latent space of the StyleGAN2 trained
    models, creating a cinematic synthetic. The audiovisual piece shows an animated
    image through the melted liquid acquired from the dataset of static images. The
    video flows from point to point, generating new views and meaning spaces through
    the latent space''s movement. The audio was created after the video was generated
    in response to the visual material to complete the art piece. (Gulajeva / Canet
    Sola 2022)


