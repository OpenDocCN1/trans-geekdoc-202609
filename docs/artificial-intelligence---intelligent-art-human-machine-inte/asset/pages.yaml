  md: '# Nikita Braguinski: The Upcoming Change in Human Musical Thinking 249


    different from capabilities of human actors, creators of technological tools need
    to redefine the activity from what a human can do to what their tool does, often
    claiming that the core of the activity is somehow preserved in the process (Sterne
    / Razlogova 2019).


    Some examples of how music-related activities could change intrinsically as a
    result of becoming AI-based:


    +   1. An AI-based search of a large corpus of musical notation, aiming to find
    melodies which have been borrowed or reused in different works, would arguably
    yield results that are different from what a human musicologist might produce.
    The reason is that the human musicologist would employ his or her memory and the
    understanding of how musical styles, epochs, and composers are related to look
    for possible candidates, whereas a machine learning system would group melodies
    by mathematically defined features, and these will not necessarily correspond
    to any concepts from music theory.

    2. A clustering of works done by an AI system might create groupings where the
    principle why these works belong together is not clear to the human observer.


    # What does the user want from the tool?


    The future course of development with regard to music theory as a tool also depends
    on the needs and wishes of those who employ this tool in their day-to-day work.
    Understanding technological routes in music are more probable than others additionally
    involves who has an intrinsic interest in introducing AI-based tools into these
    areas.


    The following group of actors is in my view likely to be more interested AI-based
    tools than others:


    +   1. Individuals who hope to become more efficient in their work through new
    technology or to gain status by showing their use of the newest tools.

    2. Institutions who seek to save money by streamlining their workflows.

    3. Technical researchers who wish to see their technological ideas used in practice.

    4. Companies producing, advertising, and selling the tools.


    On the other hand, there are also likely to be actors who would be opposed to
    the intrusion of AI-based tool into an area of work that until now not existed
    without such technologies. Particularly, those who are critical of the new tool''s
    ability to really carry out the work it is purportedly made for will resist attempts
    by other actors to introduce it. Motivations are also likely to be related to
    issues of labor and job security.'
