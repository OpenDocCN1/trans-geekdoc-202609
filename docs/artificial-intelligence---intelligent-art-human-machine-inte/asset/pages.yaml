    in relation to the piano. However, other techniques, such as vibrate on the guitar,
    sliding over the fingerboard, plucking or bending are neglected in favour of better
    predictability:


    The physical process through which sound is produced is abstracted away. This
    dramatically reduces the amount of information models are required to produce,
    making the modelling problem more tractable and allowing for lower-capacity models
    to be used effectively. (Dieleman 2019)


    This is partly comparable to the gamification strategies used in digital applications
    for learning musical instruments, where the tracking of this type of technique
    on the guitar is also not reliable (Claussen 2019, 2021). But just as it isably
    complex to capture and translate the sounds of a conventional electric guitar
    in its entire sound spectrum than the pressed keys of a Guitar Controller, it
    is also much more complicated and involves more wiring to train neural networks
    phonographically directly based on sounds. In, however, it frees one from being
    tied to a few symbolic parameters and encoders timbre, space, amplification and
