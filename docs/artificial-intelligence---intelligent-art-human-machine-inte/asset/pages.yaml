  md: '# Jan Torge Claussen: The Roughness of Neural Networks 261


    project, for example, as waveforms or spectrograms are used rather than piano
    rolls (Engel et al. 2019). In all cases, however, images of sounds are the basis
    of the calculations, even if representations of the audio signal are more comprehensive
    than midi scores, which hide sound and performance. It remains to be said: The
    machine does not listen, it reads preferably clean symbolic representations.


    # The Rasping of Neurons


    What is striking about various academic projects (Cádiz et al. 2021; Dhariwal
    et al. 2020; Dong et al. 2017; Engel et al. 2019) is that they largely focus on
    optimizing and perfecting sounds, timbres or musical sequences that are more familiar
    to us. This is all the more true for commercial applications as AI* and Co., which
    produce soundtracks are by no means at developing a unique or creative AI, but
    rather at producing voices in an application-- a cost and licence-optimised way
    for video games, films or advertising clips. In the search for a peculiar, previously
    unknown voice, on the other hand, the focus is precisely on these imperfect faces
    where the limits of the audio are exhausted, so that errors or glitches come to
    light. This is also a phenomenon that was particularly expressed in the playing
    of Jimi Hendrix (1967) on the electric guitar, as he made musical use of feedback,
    noises from amplifiers and electronic components of the instrument. So listeners
    as well as the transcriptionists who convert his songs into machine-readable MIDI
    notes could not always be sure it was a disturbance or part of his music.


    The history of media formats is determined by two opposing tendencies. On one
    hand, the focus is on optimization processes to create an almost perfect sound.
    The most important characteristic of the digital CD was that it was not even perceived
    as a sound carrier. On the other hand, artists were interested in artifacts and
    errors of new technologies. In relation to digital media technology or the compact
    disc, for example, they created a post-digital error aesthetic of the last millennium
    (Cascone 2000; Claussen 2020; Großmann 2003). Exemplary of these are the compilations
    titled Clicks & Cuts (2000–2003) by the German label ‘Mille Plateaux’ as well
    as various works by artists such as Markus Pop Oval or the media artist Yasunao
    Tone, who among other things, changed the CD surface by pasting and scratching
    it to create new and altered sounds that no longer correspond to the original
    recording (Stuart 2003). In this way, they elevated the jumps, skip noises and
    loops, which are otherwise perceived as a disturbance, to the aesthetic material
    of their music.


