    other words, a definition should be focused on information in the sense of Bateson,
    meaning “a difference makes a difference” (Bateson 1987: 460).


    Additionally, the definition should be able to ideally accommodate all, but potentially
    as many cases as possible, while at the same time being narrow as possible as
    well. It ought to tread the fine line between too broad (which would limit its
    usefulness and complicate the study of the phenomena involved), and too narrow
    (which would exclude too many perspectives and in doing so reduce its bound, cross-disciplinary
    appeal). It should especially not exclude on certain academic disciplines or indeed
    common-sense usage. This give and take between breadth and narrowness can be expressed
    in more technical terms as an approximation towards an equilibrium between maximum
    intentionality (defining in terms of properties, characteristics, and membership
    of higher-order groups) and maximum extension (of some of lower-order objects
    / concepts that belong to this group; examples of the Understanding). As these
    are generally correlated, the task of finding this equilibrium is difficult and
    relies on the elimination of contradictions rather than the complete overlap of
    the two. What this is that the different methodologies and matters of disciplines
    should not pose a fundamental problem, as they result in in-alignments rather
    than contradictions.


    Another tension in a definition is between what Locke calls nominal and real definitions.
    A nominal definition specifies cases of correct usage of a term by providing linguistic-contextual
    criteria or examples. A real definition, contrast, gives criteria for applying
    the term to a referent by identifying characteristics and properties of that referent.
    In short and somewhat simplified words, a nominal definition explains the word,
    while a real definition explains the denoted referent of the word. The distinction
    may be clear and obvious for physical objects, it is less so for culturally complex
    phenomena such as creativity and others, due to the fact that there is no identifiable
    referent. In fact, one of the most contested points is whether in these cases
    the nominal definition is a subset of the real definition, or vice versa.


    One crucial caveat in assessing the extensional definition in a field such as
    AI is that we need to distinguish clearly between metaphorical and literal uses.
    We tend to sneak into extensional definitions through a metaphorical back-door,
    due to our tendency to explain the new in terms of the familiar. Therefore talking
    about machines ‘thinking’ does not imply that the activation of their circuitry
    constitutes an example of thought in the same way that talking about what a machine
    ‘knows’ does not mean that there is knowledge, but rather that data storage is
    employed to achieve availability of task-relevant information broadly reminiscent
    of the ways in which humans draw on knowledge in similar situations. As a result
    of this abundance of mentalistic metaphors in the field, AI discourse is ripe
    with such examples of mis-extended extensional definitions that render the task
    of providing intentional definitions all but impossible. There is, of course,
    a wider (posthuman-'
