  md: '# Robin Markus Auer: Creativity and Function 147


    be creative, while epistemological creativity would be concerned with how we know
    about creativity, or how we come to think of something creative.


    They also, crucially, have opposing explanatory functions. This is evident in
    the ways in creativity, like intelligence and other related terms, serves in discourse
    to demarcate a dividing line between the human and non-human where this otherwise
    be difficult to justify. Pluntly, we often call sometimes creative when we have
    no better explanation for how it was created by a human in ways that we think
    non-human entities would not be able to. The concept or theory fulfils a discursive
    function to fill in certain gaps that we, justifiably or not, feel need to be
    filled. This is challenged by concepts of co-creativity, actor-networks or ever
    autonomous creativity.


    Another approach that focuses on this reception and discourse-side perspective
    of the concept is the ''Lovelace effect'', proposed by Natale and Hendrickson,
    which ''mediates actual software functionality with how individuals conceptualize
    and interpret software, reminding us that all outcomes of interactions between
    humans and machines represent constant implicit and indirect negotiation between
    programmer intent and user experience.'' (2022:13), the idea being that in the
    absence of a clear understanding of how the algorithms work, users are likely
    to apply the same theory of mind that they do to understand other humans.


    # A Synthetic Definition of Creativity – Creativity On Go


    In current, usually domain-specific definitions of creativity, overlap of concept
    and phenomenon is limited and contested. Instead, a truly interdisciplinary definition
    should render the phenomenon necessarily a subset of the concept. As a result,
    creativity as an ''inexplicable explanans'', will have to be excluded, for the
    sake of enabling research. The aim of empirical research in this framework would
    be to increase the share of the explainable phenomenon subset within the concept
    set. Let me come now to the proposed working definition, which has four parts


    +   1. Creativity is a socially and culturally relevant attraction of novelty
    and effectiveness to a created idea, practice, or object.

    2. Creativity is knowingly attributed to any (co-)creators as well as the processes
    and practices involved in the creation of said idea, practice, or object. (Similarly,
    it is without doubt often attributed for having done so in the past. For processes
    and practices in particular it likely makes sense to introduce some kind of distinction
    between those labelled creative in the sense of 1, and those mentioned here. There
    is certainly a kind of bias, which will lead an audience to label anything produced
    by someone who has regularly been labelled creative in the past.)'
