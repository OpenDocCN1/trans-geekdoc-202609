- pgno: 110
  md: '# Pablo Gervás: Challenges and Opportunities for Computational Construction
    of Narratives 113


    prompted with full sentences describing the desired output that successful results
    have made their appearance. We will address these models in the section "Acceptable
    Stories", when I discuss more elaborate ways of requesting a story.


    Another approach to generating stories from pieces of prior stories involves instead
    of words abstraction of the stories and finding ways of recombining these abstractions
    into conceptual representations of a story that can then be transcribed as text.
    That is essentially what story generation based on planning (Young et al. 2013).
    In this approach, a set of planning operators is constructed as an abstraction
    of the events that appear in a story. Each planning operator represents an event
    in a story – usually in some form of predicate logic that allows a predicate to
    represent the action and a set of argument variables to represent the characters
    or objects that participate in it – but it also encodes additional information
    of which other predicates are preconditions or post-conditions of that event.
    This allows a planner to create chains of events that are causally linked to one
    another, from an initial situation to a goal. For planning-based story generators,
    the initial situation and the final goal are usually provided as input.


    This type of approach is faced with the important challenge of having sufficient
    coverage to generate a broad range of stories, which constitutes a significant
    bottleneck for the approach. Attempts have been made to solve the problem by means
    methods of knowledge engineering (Neill / Ried 2014) and crowdsourcing (Guzdial
    et al. 2015).


    Other efforts rely on similar abstractions of the meaning of events in a story
    as predicates associated with pre-conditions and post-conditions but follow the
    emphasis on goal-driven causality of the narrative paradigm. The Mexico systems
    design their abstractions for story actions based on different conceptual approaches.
    (Pérez y Pérez 2019) relies on a set of story actions that associate character
    emotions and tensions between characters as preconditions or post-conditions.
    The ProperWryter system (Gervás 2015) relies on existing abstractions on relevant
    events (Propp 1928) and dependencies established between them by virtue of being
    actions associated with narrative roles as villains or heroes.


    This approach also suffers from the lack of a broad vocabulary of story actions
    to employ. This is known in artificial intelligence as the knowledge acquisition
    bottleneck – a long-standing problem (Cullen / Bryan 1988) that remains current
    to this day (Pasini 2021). Supported by a knowledge engineering effort to annotate
    plots of musicals (Gervás et al. 2016), the ProperWryter system achieved success
    when it was engaged in the production of the first computer-generated musical,
    which was staged at the London West End for two weeks in 2016 (Colton et al. 2016).


    # Judging Story Originality


    However, building complete stories up from elementary blocks is no guarantee that
