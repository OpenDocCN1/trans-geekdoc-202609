    Figure 1 shows a schematic representation of the custom-made AI-based wearable
    device designed by Mika Satomi. The device is a collar, endowed with sensors that
    can be attached to eight points on the body, to accomplish the function of motion-capture.
    At the back of each collar there is a Bela, which acts as a processing unit. All
    the computational process: data capture, posture recognition and mapping through
    a machine learning (ML) module, sound synthesis locally on the Bela board contained
    in each collar. The ML module is based on ml-lib, a library of machine learning
    externals for Max and Pure Data, built for the Gesture Recognition Toolkit by
    Nick Gillian. A speaker sits on the front of the collar, emitting sounds that
    can react to the position of the sensors, or how the performer moves their body.


    The ML model is trained on incorporating real-time data from the sensors placed
    on Kate’s body. The data is captured in specific poses, which are devised according
    to our movement framework and agreed upon collaboratively by Kate Ryan and Diane
    Sebastian. These data points are then mapped to parameters of the synthesizer.
    Due to the fact that every time Kate is wearing the collar, there are small alterations
    in the placement of the sensors on her body, the training needs to be performed
    at the beginning of each rehearsal-rehearsal. During the rehearsal, the stretch
    of the material and consequently the resistance of the conductive fabric is also
    slightly altered, introducing small variations in the data and compromising the
    accuracy of the mappings. To counter this, the system needs to


