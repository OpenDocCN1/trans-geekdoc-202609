    generate a new painting in the style of the Dutch master (https://www.nextrembrandt.com).
    The network Deep Dream programme operates to create surreal or ''dreamlike images''.
    The Deep Dream programme uses a Convolutional Neural Network (CNN), a special
    type of Neural Network designed for processing images and visual data. CNNs are
    a type of artificial Neural Network specifically designed to process data with
    a grid-like topology, as an image. They are particularly useful for tasks such
    image classification and object detection, as they are able to automatically learn
    features and patterns in the data. The Deep Dream can then be used to alter the
    image and create new, surreal-looking images. This is done by using the CNN to
    amplify and manipulate the objects and shapes in the image. The result is an image
    consisting of nested, distorted, and fantastical shapes and patterns (Miller 2021:
    90).


    The creation of images is mainly brought about by the so-called Generative Adversarial
    Networks (GAN). The GAN is a type of Neural Network that is composed of two parts:
    a generator and a discriminator. The generator produces mismatched outputs, as
    images or audio, based on the input data it is given, the discriminator attempts
    to distinguish the outputs from the contents of its data base. The two parts compete
    with each other, with the generator trying to produce outputs that are as realistic
    as possible, and the discriminator trying to become better at detecting fake outputs.
    This competition drives the network to improve, result in the generation of high-quality
    outputs and even creative results (Miller 2021: 92).


    A prominent and much-discussed result of a GAN is the digital portrait of the
    fictitious Edmond de Belamy, by the artist-collective Obvious. Although generated
    and by a GAN, the portrait was sold at Christie''s for $432,500. Although its
    creation definitely undermined the idea of art and artistic authorship, it the
