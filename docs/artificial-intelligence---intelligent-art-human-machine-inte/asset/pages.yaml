  md: '# Artificial Intelligence – Intelligent Art?


    # Acceptable Stories


    The need for systems that construct artifacts to include procedures for assessing
    the quality of their outputs arises from the fact that such systems essentially
    explore a search space of possible artifacts, and not all the artifacts in that
    search space are equally valid. Once a specific type of artifact is defined in
    a way that allows to be constructed computationally, it becomes very easy to produce
    a very large number of different instances of it. Ensuring that the produced instances
    are acceptable is usually a little more difficult. Making them all valuable is
    a significant challenge.


    To address this challenge in the field of narrative generation, recent efforts
    have focused on defining metrics for story quality. Traditional engineering practice,
    these efforts usually identify one specific aspect that is known to impact the
    perception of quality and attempt to model it, without considering other aspects
    that are also relevant. Examples of what have been considered in the story are:
    character belieability (Gomes et al. 2013), semantic coherence across the relevant
    events such as birth / death or romantic entanglements (Gervás / Concepción /
    Méndez 2021), reproduction of features observed in human-written stories (Leon
    et al. 2020), consistent use of entities across the narrative (Papalampidi / Cao
    / Kocisky 2022) or probability of each sentence in the story with and without
    its preceding story context (Sap et al. 2022).'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Pablo Gervás: Challenges and Opportunities for Computational Construction
    of Narratives 115


    The set of relevant aspects that should be considered is very large, and efforts
    should be made to integrate these various models so that they can be applied together
    onto the same stories. The quality of story generators would improve significantly
    once these metrics can be applied as filters to their output.


    The integration of a metric on story quality – essentially a story critic module
    – into a story generator presents another important challenge. Story generation
    systems are generally constructed on the basic assumption that they take an input
    and generate an output that is a story. The idea that one should read the output,
    reflect upon it, and based on reflection, rework it in some way is fundamental
    for the human approach to writing (Flower / Hayes 1981; Sharples 1999). However,
    generation systems constructed on a similar basis are far and far between. The
    Mexico system is a remarkable exception, being based on Sharples'' cognitive model
    of the writing task (Sharples 1999).


    There is another view on the quality of stories that differs slightly from whether
    it is a good story. This view considers whether the story is acceptable as an
    instance of a story described by some user that the requests it. Many of the features
    described as above potential input could be to narrow down the set of stories
    that are acceptable in response to a specific input: categories of stories, details
    on the world or the characters, plot structures or potential effects of the story
    on its audience. If an instance of this type is made available, a story returned
    by a story generator in response to a specific request would only be acceptable
    to the extent that it matches the given request.


    The recent development of neural-based solutions for text generation such as GPT-2
    and GPT-3 (Zhang / Li 2021) makes this type of story capable of responding to
    user prompts with large paragraphs of valid and fluid text. These solutions are
    based on a large language model trained over a neural network representation,
    and these models essentially capture the relationships between words as featured
    in examples of text written by humans. The interactive nature of these solutions
    has made it possible to present requests for stories as simple sentences that
    describe the desired story. The tests carried out so far on how acceptable the
    responses of these systems are in their correlation with the given prompts show
    outstanding results for instances of general conversation, even though testers
    remain unconvinced of their general validity (Elkins / Chun 2020). More exhaustive
    tests need to be carried out on the applicability of these solutions in the realm
    of narrative generation.


    # Stories for a Specific Purpose


    This observation leads to the final but not less important challenge that story
    generation faces: generating stories for specific purposes. The concept of purpose
    is very difficult to represent formally in terms that a computational system would
    under-'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'stand. Yet it is crucial for guiding the composition of any message in any
    media that is aimed at communicating to an audience (Smedley 1952).


    Story generator systems rarely consider any representation of purpose among their
    inputs. In most cases, when a story is generated there is some idea in the mind
    of the designer of what the stories should achieve. As a result, story generation
    modules are sometimes included in systems designed for very clear purposes, such
    as teaching children about bullying (Aylet et al. 2007), supporting emergency
    rescue training (Hullett / Mateas 2009), or for military training (Zook et al.
    2012). In such cases, there is a clear purpose that the generated story has to
    fulfill, and the generator is designed with purpose in mind. By the identification
    of the purpose and the tuning of the generation mechanism to ensure the generated
    stories achieve it are wholly in the mind of the designer and not explicitly modeled
    in the system.


    The main body of research on storytelling has focused on generating stories whose
    content is constructed at the same time as the story. This sidesteps one of the
    main purposes of storytelling used by people, which is to convey a set of events
    that has actually happened. In this case, the overall description of the task
    changes significantly. The set of inputs to consider to a potential system that
    builds stories must necessarily include a description of the events the story
    needs to convey. In most cases, the construction procedure is expected to respect
    that set of events and not introduce any additional ones that did not occur. This
    slightly different formulation of the task has been addressed more rarely but
    exists systems that generate stories about events that the story generator receives
    as input: stories about interactions between a user and an intelligent agent (Behroo
    / Swann / Jhala 2015), stories abstract from the moves of a given chess game (Gervás
    2014), stories about a user constructed from data on their routines acquired via
    sensors (Reddington / Tintarev 2021), stories to explain cybersecurity risks (Afzaliserets
    et al. 2020) or narrative biographies from personal data (Farrow / Dickinson /
    Aylett 2015) or biographies extracted from the knowledge (Kim et al. 2002).


    Living as we do in world obsessed with fake news, we also need to consider a version
    of the task where a story is generated based on a given set of facts, but purposefully
    departs from it at some point when building a story about them. This is another
    storytelling that is intuitively familiar to most people: biased historians or
    philosophers do it to their audiences, parents do to soften the world for their
    children, transgressors do to hide their offenses. It is the key task underlying
    historical fiction or fictional accounts of recent events. From a computational
    point of view this task can be understood as a combination of the task of generating
    a new story with the task of telling a known set of facts. This particular of
    the task has been addressed computationally by attempting to match the known set
    of events to a particular plot structure, allowing mismatching real events'
