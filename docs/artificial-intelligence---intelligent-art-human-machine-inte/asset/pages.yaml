    # Methods of generative literature: The connectionist paradigm


    The appearance of generative literature is as diverse as the methods used to generate
    the texts. "Generative literature" as a concept is nebulous, as it has already
    discussed under the guise of computational, electronic or digital literature and
    as such carries within itself a historical and poetic tradition of its own (cf.
    Hayles 2008; Rettberg 2019; Schöntaler 2022; Bajohr 2022). The methods of specific
    literature genres range from Markov chains to algorithmic randomizations to Natural
    Language Generation based on datasets annotated, scraped or written texts (cf.
    Lamb / Brown / Clarke 2021; V. Stegern / Theune 2019; Bajohr 2022; Linardaki 2022).
    When it comes to AI prose or narrative prose that is written in assistance of
    AI, no specific methods of categorization exists for yet. To scholar and author
    Hannes Bajohr (2020: 19) proposes to distinguish them from a media-technological
    perspective using: "the sequential paradigm of generative literature [...] employs
    linear algorithms, and the connectionist paradigm [...] is based on neural nets."
    "The sequential paradigm (Bajohr: 2020) groups texts that are ''executed'' as
    a sequence of rule-steps." Production modes in the realm of the connectionist
    – the paradigm my research mainly evolves around – involve the employment of artificial
    neural nets with the ability to generate natural language. To put briefly, artificial
    neural networks are computational systems that mimic the functioning of the brain,
    working with units labelled artificial neurons (cf. Yang / Yang 2014). ANNs that
    are able to generate natural language are trained via machine and deep learning.
    In literary contexts one could either train a system by feeding it a (small) self-selected
    dataset, use a pretrained or choose to tune a pretrained system. Training one''s
    own system allows total control over the data, but the output does not match the
    quality of language found in the currently available pretrained transformers,
    such as GPT-3. The autoregressive language model GPT-3 has been released 2020'
