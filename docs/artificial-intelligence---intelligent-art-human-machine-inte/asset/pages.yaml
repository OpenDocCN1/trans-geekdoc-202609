  md: '# Artificial Intelligence – Intelligent Art?


    mans and machines and it follows that “AI can deny your vulnerable, bodily, earthly,
    and dependent existential condition” (Coeckelbergh 2020: 196). In the following
    section we will pick up Fjelland''s point about situated cultural knowledge and
    participation in the larger picture of the life-world. While the ethics of transformative
    AI also been an extensive and burgeoning field in AI discourses (Lin 2022, Coeckelbergh
    2020, Bartneck 2021, Hauer 2022), the question of how AI continues to shape cultural
    and aesthetic practices has been frequently side-lined. It is only recently, with
    a number of highly published cases, that the field of aesthetic and cultural production
    has fully acknowledged that various transformations have had an enormous impact
    on aesthetic practices and products and will continue to reshape and revolutionize
    the field of cultural production. It is precisely here that this volume finds
    footing. What the Rise of the Robots (Ford 2015) occurring in The Fourth Industrial
    Revolution (4IR, Schwab 2016) or the Second Machine Age (2MA, Brynjolfsson / McAfee
    2014), creating Life 3.0 (Tegmark 2017), cannot be ignored by the fields of literary
    studies, music studies or arts.


    AI applications simulate human creativity, but they do so without being entangled
    in life, having enhanced interpersonal exchange and emotional contact, unable
    to be committed or empathetic, engaged or disadvantaged, angry or cool. Issues
    of accuracy and bias are compromised by the inventiveness of large language models.


    The most spectacular recent advances in AI have affected speech such as speech
    recognition or speech-to-text (STT), speech synthesis and text-to-speech (TTS),
    speech generation (as GPT), image generation and text-image applications (such
    as DALL-E), and machine translation (as DEEP-L). Most of these applications run
    under few global players such as Google, Amazon, Twitter/X, Meta and Nieinh (2016),
    with the socio-economic rules of platform capitalism (Srnice 2016), and Microsoft
    regulating access to data, with OpenAI (misnamed as it is a proprietary platform)
    while AI is frequently sponsored by the corporations dominating AI industries,
    there is also a case for critical resistance (Zeilinger 2021: 13) and counter
    programmes (Schönthaller 2021: 327) against digital platform capitalism.


    Large language models (GPT-4) with chatbot interfaces (ChatGPT) have become so
    proficient that recent debates have been started on whether we have come closer
    to artificial general intelligence. Calls for regulating this powerful tool even
    have made the headlines and while many countries are considering moves to regulate
    AI tools, Italy has the first western nation to temporarily ban ChatGPT. The recent
    case of Blake Lemoine is instructive. The Google researcher published his interaction
    with language model LaMDA and subsequently was heavily criticized and eventually
    fired for implying that LaMDA was sentient:'
