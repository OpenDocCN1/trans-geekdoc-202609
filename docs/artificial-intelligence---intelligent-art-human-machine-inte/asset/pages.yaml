    experimental film adapt AI technologies and/or automated creative processes for
    their own aesthetic purposes and create an update of historical precursor forms
    like cinéma absolu or cinéma by means of algorithmically assembled digital images.
    The focus of my consideration will be the artists Vadim Epstein and Eva [Ev] Jagle
    (alias Einhorn sterbate) with their major works "Ghosts" and "Inspirationquellen".
    In his 2021 short movie "Ghosts", Epstein creates a kind of meditative film of
    virtual space through the use of image-to-image translation GANs, while in Jagle''s
    "Inspirationsquellen" from 2020, a (seemingly) randomly assembled cluster of virtually
    constructed rooms, objects and camera movements form the basis for the creation
    of very personal, rhiz-like intertwined parallel worlds. The fact that both Epstein
    and Jagle have published their films in the public domain on the video platforms
    Vimeo or YouTube is only one aspect identifies them as part of a counter-current
    against a prevailing blockbuster cinema in which technical innovations first and
    foremost subordinated to the dictates of narrative and economic gain.


    # Ghosts of digital modernity


    Istanbul-based multimedia artist Vadim Epstein states about his eight-minute short
    film "Ghosts", which is just one of his countless projects, that it is "is the
    most complete and extended opus from the ongoing series, exploring complexity
    emergence, based on the feedback loops" (2021). In the same statement that Epstein
    attached to his video within the commentary section on Vimeo, he elaborates further
    on the process of creation:


    Multidomain-to-image transforming neural network StarGAN2 has been used here recurrently,
    reprocessing its own output without additional inputs. The models have been trained
    on both figurative imagery and abstract art, to enrich and intensify visual &
    semantic expertise. Moreover, part of the training data was synthetic itself:
    few source datasets were generated with custom StyleGAN2 models, adding another
    layer of mediation to distance it even farther from the real.


    What we eventually get is an ever-changing shape-shifting loosely controlled flux,
    which appears more lifelike and expressive on its own, than obscure resemblance
    of the origin flesh, stuck in the neural convolutions (ibid).


    The Generative Adversarial Network, or GAN, mentioned by Epstein is a machine
    learning model capable of generating data on its own. It consists of two competing
    artificial neural networks, one of which, the generator, has the task of generating'
