  md: '# Christoph Seelinger: Material Films in the Age of Artificial Intelligence
    179


    real-looking data, while the other, the so-called discriminator, is supposed to
    identify the data as real or artificial. Through constant learning and many iterations,
    the results are emancipating themselves more and more from their appearance as
    virtual reality. Accordingly, the generator produces data that the discriminator
    checks for artificiality on the basis of data sets from non-virtual reality. The
    aim of the generator is to sooner or later produce data sets that the discriminator
    can no longer distinguish from real data. First, the generator produces random
    data, (for example, pictures). The discriminator, which was previously trained
    with real data, to recognise whether it is real or artificially generated data.
    In a second step, the discriminator returns its results to the generator network.
    The generator then tries to generate new data more similar to the real data, which
    the discriminator checks again. Since the two networks are logically coupled and
    train each other, both are involved in a continuous learning process. With each
    iteration, the artificial data becomes successfully more akin to the real data
    (cf. Wiegand 2018).


    One of the most famous examples of GANs is probably the so-called "Meow Generator"
    by Alexia Jolicoeur-Martineau. The biostatistician and expert in statistics and
    machine learning from Montreal fed Meow Generator with 10,000 photographic images
    of cats. After a short wait period she received 9304 images of fictitious cats
    with 64 × 64 pixels resolution and 6445 images of fictitious animals, purely fictitious
    animals that her GAN constructed from the given data (Jolicoeur-Martineau: 2017).


    The typical areas of application of a GAN can therefore obviously be found in
    the fields of film and photography: it can be used to create missing backgrounds
    that look deceptively real – for example, of crowd scenes in blockbusters where
    a handful of extras are artificially stylised into a gigantic army. Other possible
    applications in film or image editing are the subsequent colouring of black and
    white shots, the generation of artificial voices or the creation of three-dimensional
    objects from sketches or 2D templates. Hageback and Hedblom also address the increasingly
    virtual phenomenon of deepfakes, which they call


    the most interesting breakthrough this far with regard to moving pictures. Here
    artificial intelligence is used to project human appearances on moving pictures
    where they do not exist. In a similar manner as it is possible to emulate a human''s
    language, this technique, deploying a type of neural networks, generative adversarial
    networks (GAN), allows for replicating an individual''s face with its idiosyncratic
    facial moves, or bodily movements. It means that an actor can be altogether replaced
    by another actor or let the algorithm adjust the face of an actor to make them
    appear younger'
