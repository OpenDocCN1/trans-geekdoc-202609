  md: '# Robin Markus Auer: Creativity and Function 141


    confusion and conflation of research and development, which have for a long time
    been merged in businesses. While development may be justified by success only,
    research is fundamentally theory- and knowledge-directed, and the task of defining
    is a crucial step in the theorising of any phenomenon, a cognitive exercise directed
    at understanding rather than merely replicating or predicting. A definition comes
    with certain epistemic implications and advantages that ‘merely’ solving a problem
    cannot.


    Its etymology and practical usage suggest that a definition is “[a] precise statement
    of the essential nature of a thing; a statement or form of words by which anything
    is defined” (OED Online “definition, n.’) and thus an authoritative paradigm.
    As this very passage shows, definitions are used as a starting point, due to this
    authoritative, agreed-upon, and seemingly fixed nature. Yet, on the other hand,
    there are further definitions of what a definition speaks a different truth. Definition,
    we learn, is also “[the setting of bounds or limits; restriction] (ibid.), as
    well as “[the action of determining a controversy or question at issue; determination,
    decision] (ibid.). Furthermore, in the field of logic, definition refers to ‘the
    action of defining, or stating exactly what a thing is, or what word means (ibid).
    Structurally, a definition brings the explanandum (that which is be explained)
    with the explanans (which it explains).


    In his Tractatus Logico-Philosophicus, Wittgenstein wrote that “[the object of
    philosophy is the classification of thought. Philosophy is not a theory but an
    activity” (1922: 4.112) The very same truth holds for definition as one of philosophy’s
    main endeavours. The takeaway is not only that definition is a process rather
    than a definitive and fixed statement, but also that it has undergone several
    shifts in meaning, inherently exemplifying this dynamic nature of definitions.
    This tension between the assumed fixed nature of definitions in most everyday
    situations and the dynamic process of definition as part of academic inquiry has
    to be taken into account when developing criteria for a ‘good’, i.e. successful,
    definition.


    # Coming With Criteria


    As naive, essentialist notions of what creativity is lead nowhere, there must
    be criteria for the definition other than capturing what creativity ‘really is’.
    Instead, we have to judge the definition by the options it affords us, and the
    practical advantages it provides over other definitions, prioritizing clarity
    over certainty. In fact, we can reframe definitions as epistemic affordances that
    offer us ways of knowing and learning about the world. If, “[a]ffordances are
    functional meanings” (Windsor 2004: 180), it makes sense to understand definitions
    in the very same way. Furthermore, a definition ought to be precise in the sense
    of offering maximum effective distinction. In'
