    # Discussion


    According to the media hype around AI, this technology is intelligent enough to
    create art autonomously (Perez 2018; Vallance 2022). However, the reality is different.
    According to computer scientist and a co-inventor of Sir Luc Julia, AI does not
    exist. He advocates for machines'' multiple intelligences that often outperform
    humans. However, machine intelligence is limited and discontinuous compared to
    human'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# G. Guljajeva, M. Canet Sola, I. Clarke: Artistic-Guided Neural Networks


    intelligence (Julia 2020). Therefore, it is vital to have artistic practices around
    this technology, as a counter possible to the AI fantasies served by the industry
    and mass media.


    We see AI as a creative tool with its own possibilities and limitations, which
    can stimulate artists'' creativity through unexpected outputs. Research has shown
    that tool-making expands human cognitive level and constitutes evolution in culture
    (Stout 2016). Similarly, as a new tool, generative AI could potentially enrich
    creativity by allowing new production pipelines that can generate unique results.


    Coming back to the synthetic images, we can say that all machine-synthetic image-based
    works discussed here have particular aesthetics: with Deep Dream and GAN. Unlike
    the output of GANs, Deep Dream has a more recognizable style and can be seen as
    a filter that transforms every inputted image instead of learning from the given
    dataset.


    Regarding GAN aesthetics, visual appeal is inherited from two entities to a large
    extent: the dataset and the model itself. GANs have a particular footprint, as
    seen in all works produced with this model. The visual palette comes from the
    used datasets. For example, if a dataset is homogeneous (only landscape images),
    then we will easily recognize landscapes in the generated output. However, if
    images in the dataset have a lot of variation, the output is rather abstract.
    PostCard Landscapes from Lanzarote illustrate this well. Also, when photos in
    the dataset look similar, the output will be similar, as was the case with the
    Synthetic Landscapes of Tartu video work where frames from red floured walks in
    a city were extracted. When we talk about video generated with the neural net,
    then manual guidance of latent space offered more variations than an audio-led
    approach.


    ![](img/3fc307aac7c3cdbb393e4b8732cd1843_70_0.png)


    Synthetic image works have encouraged us to work with formats images and videos
    that we did not engage in before our practice, but we found it exciting working
    with AI and video. For example, AI video generation has been done in a perfect
    loop since images are synthetically generated. However, creating real-time AI
    work is much more complex because some models are too slow. It might take a few
    minutes to render a single image. The limitations inspire us to devise new solutions
    and work in new mediums. Moreover, the limitations of the medium has always been
    a good challenge for our creativity.


    With GANs or other image-generation tools has become much easier in recent years,
    although used to be quite difficult. We must note that for practitioners, easy-to-use
    tools, such as DALL-E and Midjourney, offer little creative freedom, and thus,
    are less attractive to the artists. These products tend to instrumentalize the
    user rather than the other way around. At the same time, open source models offer
    more creative freedom and enable broader use of artistic ideas.


    The work with generated text demonstrates demonstrates that AI is not context-aware
    but maps concepts automatically without understanding semantics. More importantly,
    as shown in the ENA project the audience must also be guided alongside the AI.
    In'
