  md: '# # The Upcoming Change in Human Musical Thinking.

    What Does a Music Professional do in the Age of AI?


    Nikita Braguinski


    Despite its essay dedicated to images of centuries-old tradition and stability,
    musical theory as a tool for thinking never stands still. It is in a process of
    constant change, often due to the emergence of new music-related technologies,
    as well as mental “apparatuses” such as the cultural techniques of mathematics
    (Assayag / Feichtinger / Rodrigues 2002; Magnusson 2019; Braguinski 2022).


    This essay is dedicated to understanding what the future of musical knowledge
    might look like in an era in which musical tools based on machine learning would
    become common. It addresses the following set of questions:


    +   - Which musical activities can already be partially or fully imitated through
    AI based on machine learning or could be imitated in near future?

    - How might these activities become redefined to the experiences with AI?

    - Which actors are likely to be more interested in the introduction of AI-based
    tools?

    - What could be possible timeline of future change look like?


    In the past music theory has already withstood several technological upheavals,
    such as sound recording technologies appeared at the end of the 19th century,
    or when sound visualization allowed new kinds of analysis(for examples of these
    early technologies, see: Braguinski 2019a, 2019b).


    In all cases music theory was – until now – able to continue asserting itself
    as a valid tool for the understanding and creation of music by adapting to the
    new circumstances. This process is, however, neither linear nor deterministic.
    Different factors influence it. This is why the understanding of change and the
    creation of informed predictions necessitate a transdisciplinary approach to the
    interplay of technology and musical theory.


    To begin this essay, I want to first of all draw attention to the fact that technological
    change in music not only concerns practising musicians and listeners. In discussions
    of music technology it is often overlooked that it may also have career-'
