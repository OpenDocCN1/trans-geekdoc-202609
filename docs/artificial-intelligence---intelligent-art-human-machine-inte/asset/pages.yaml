    I think that the owner of the technology cannot have any rights on the music that
    is generated. Otherwise, you would have given rights to the person who created
    an instrument. When you play the piano, who should you pay? ''Schimmel?'' It''s
    not gonna work, even if those tools work are different because they generate original
    music. (in Tillmann 2022, appendix, CXVI)


    This statement points to the legal facts and the discussion which has just been
    begun (Vincent 2022). This discussion is complicated by lengthy decision-making
    processes regarding a reformation of copyright at the political level with different
    developments in different countries. Art and music became a special testing ground
    for AI (Wittpahl 2019: 257–270; Du Sautoy 2009). With reference to French economist
    and philosopher Jacques Attali, Clencya (2023b2) sees high relevance in the argument
    that music is an important set of negotiation and herald for social change. In
    engaging with AI from a creative perspective, new insights and perspectives, or
    those neglected in the discussion, could be gained and introduced, and "may provide
    wisdom for the broader macroeconomic and the environmental ecosystem" (Clencya
    2023b: 2). Debates about copyright, and corresponding remuneration are an essential
    part of it.


    # Ethical aspects


    Another concern expressed by the interviewees regards ethical dimensions. Algorithms
    and the AI training processes can be biased, racist, misogynist, traumatized –
    as they are only as ethical as the axioms of the trainer and the data set that
    was used. Horta Valenzuela asks critically:


    I think the issues that we should talk about, why is AI so white? Why is AI so
    male driven and why are companies firing their black employees in ''AI ethics?''
    Why are these kind of issues happening? The sets really racist or producing kind
    of fucked shit even though the companies are trying to mitigate; (in Tillmann
    2022, appendix, CXIV)'
