    about technology than about our own self and world determination by means of identification
    and distinction.⁵The role models, however, obscure the fact that technology is
    a part of us that we cannot consider completely detached at all. For example,
    for some people the (temporary) separation from their smartphone feels like the
    absence of a body part. This is hardly surprising, given that the living environment
    is shifting to the virtual and without technology we lack the perceptual and action
    apparatuses for this environment. Andy Clark and David Chalmers (1998: 8) define
    the connection between humans and their cognitive extensions as a “coupled system”:
    “[...] the human organism is linked with an external entity in a two-way interaction,
    creating a coupled system that can be seen as a cognitive system in its own right”.
    If one part falls away, the system breaks.


    With the increasing merging of humans with technology, it is thus also bit strange
    to work with role models: “Part of me is my cognitive partner.” In following,
    I would like to describe this relationship between human and machine in artistic
    production processes not by means of role models, but by the “with and against.”
    The “with” stands for the identification and agreement of the human being with
    the machine and the artifacts calculated by it, the “against” for the difference
    and the contradiction towards them. Thereby, “with” and “against” are not clearly
    distinguished by pro and con. Both terms can be positive or negative. The text
    operates less on an analytical level than describing, (artistic) practice: how
    do we behave with and against AI, how do we act in dealing with AI? It is not
    only about a more accurate description of current conditions and a better understanding
