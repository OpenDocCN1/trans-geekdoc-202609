  md: '# Outcomes


    # Nested Narratives


    Working with A.I. in such a way can be seen as an intriguing source of inspiration.
    It gives you material to play around with, to dig in, to take out, to transform,
    to iterate and make sense of it. The result of your sense-making process was a
    nested narrative, meaning a story within a story, within a story. Each part plays
    in a different time and features different characters, however, they are still
    connected with each other.


    +   - Layer 1: 17th Century // Piranesi & Mannum plotting a war

    - Layer 2: 1981 // A girl searching for her mother

    - Layer 3: 2021 // The Writer, trying to stay sane


    The first part is a story about the 17th century about the two characters introduced,
    above, Piranesi & Mannum. Both are plotting a war using a biochemical weapon that
    fails and extinguishes Mannum kingdom and the people living within. In the second
    part, we follow the story of a little girl called Emily. At the beginning of the
    story, she reads a comic about the story of Piranesi & Mannum, this is her first
    narrative is nested within the second. While she reads the story, a TV news anchor
    is presenting the latest development of an actual pandemic that is raging all
    over the world. We situated this situation in the 1981 and the pandemic, which
    the news anchor is referring to, is the AIDS pandemic. Emily’s narrative is nested
    within a third narrative. The last one plays in 2021. Here we have text fragments
    about a person they called The Writer. He is similar to our real lived experience
    in 2021. Due to the Covid-19 restriction and the social lockdown, he stays in
    a small apartment in New York. To stay sane, he starts to write a story about
    a young girl called Emily, which is how the second narrative is nested within
    the third. Furthermore the writer mirrored our experience, as we were in lockdown
    during the production phase of this project as well.


    # Illustrations


    As mentioned in the introduction to this project, Sound of Contagion follows a
    transmedia approach to storytelling, thus we transformed the narratives into different
    mediums beyond text. The first transformation was based on the illustration by
    Sara Laub. We picked key scenes of each nested narrative as prompts for Sara,
    who illustrated them in her own style. She got inspired and created the second
    output of our project.


    The first illustration shows Mannum and Piranesi, sitting in an old library plot-ting
    how to use the bioche weapon. In the second illustration we see who Emily is'
