    the discourse (or I would write: hype) around “artificial intelligence” in the
    context of musical practice with a focus on the relationships between human and
    things involved in making music enter into. In doing so, I draw on Johannes Ismael-Wend’s
    postcolonial-informed concept of Things (2016), which considers all technical
    artefacts involved in making – also beyond the category of “musical instrument”
    – as knowledge complexes and theoretical objects that interact with musicians
