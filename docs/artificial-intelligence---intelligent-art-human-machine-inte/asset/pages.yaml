    # Division of labour in the Writers’ Room: Conceptualisations with AI


    The third collaborative practice that I want to draw attention to operates at
    the conceptual level of writing. I would like to discuss this collaborative relationship
    among the term Writers’ Room. Literary writing is still primarily framed as an
    individual act and thus highly romanticised, whereas stories in other sectors
    are usually developed as collaborative projects – think movie and gaming industries.
    A collaborative process of conceptualisation with neural networks could be broken
    down into three development segments: 1) setting, 2) character development and
    3) plot development. These narrative sections are fleshed out in dialog form,
    with concepts emerging in conversation with GPT-3 or in tandem with specialized
    fiction or screenwriting programmes. I would like to illustrate this method with
    an example. When I started on a novel about a chick writer who wants to interview
    Hugh Grant to boost her career, I tried to construct the story outline and develop
