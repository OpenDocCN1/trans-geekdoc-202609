  md: '# Creativity and Function


    Robin Markus Auer


    # The Advent of Creative AI


    While Artificial Intelligence and its various applications have been the focus
    of research and awareness for a while now, Artificial Creativity (the use of AI
    for creative and artistic ends) has only recently moved into the spotlight. Suddenly,
    however, it seems ubiquitous. Within mere months, several new iterations of text-to-image
    generators, as well as the particular release of ChatGPT and GPT4, have raised
    public interest and awareness of the topic – already at an all-time high – to
    a new level and shifted attention to the narrower field of text and image generators.
    Newspapers overflow with daily articles telling the public how to use ChatGPT
    to recreate creative output, or explaining why its arrival marks an important,
    ever-varying threshold in language-focussed creative AI.


    All of these assessments of ChatGPT and similar AIs are based on a loosely understood
    notion of creativity, or on the ideas of who identify as creatives, complicating
    issues, as these people are in some way or another heavily invested in the importance
    and uniqueness of the creative process. In critically assessing the creative capabilities
    of ChatGPT and related AI applications, we are still lacking a clear definition
    of creativity, especially one that works across disciplines. This paper meant
    to alleviate this problem by providing a cross-disciplinary definition of creativity
    in the context of current AI research and development, and to shine a light on
    what the exact purpose of such a definition might be in the first place.


    # A Multitude of Questions


    So, what is creativity? Given the ubiquity of creativity in modern western societies,
    it is easy to forget that its boom is a relatively recent phenomenon and from
    the very beginning, any definition of creativity has struggled, not least due
    to the fact that individuals and disciplines have approached the phenomenon with
    a range of pre-existing expectations and convictions.'
