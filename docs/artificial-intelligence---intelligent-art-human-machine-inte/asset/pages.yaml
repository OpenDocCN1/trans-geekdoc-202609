  md: '# About the Authors 287


    Mattis Kuhn, artist and curator, works on the reciprocal design of humans, machines
    and the shared environment. The focus is on text based machines (algorithms, artificial
    intelligence, formal systems, software) and the intertwining of humanities with
    engineering. Essential aspects are identity, decentralization, human-machine associations,
    networks, and AI. Recently his book “Selbstgespräche mit einer KI” (Soliloquies
    with an AI) and “Grasslands for Insects” have been published by oxcoa and windpark
    books. He co-curated the exhibitions “I am here to learn – On Machinic Interpretations
    of the World” and “How to Make a Paradise – Seduction and Generation in Generated
    Worlds” at Frankfurter Kunstverein. He studied art at University of Art and Design
    Offenbach and Experimental Inics at University for Media Art Cologne. Currently,
    he is Artistic Associate for Creative Coding at Bauhaus-University Weimar and
    part of the research group zero at University for Media Art Cologne.


    Sebastian Kunas is a musician, sound artist, and editor with a background in sub
    and DIY culture as well in cultural and sound studies. Besides his strong penchant
    for music repetition and playing with sound in the electronic domain, he is a
    semi-proficient multi-instrumentalist and producer. He is active in various contexts,
    working with theatre collectives, and producing sound. He is also experienced
    in playing, recording, and touring bands. In the department of Kulturwissenschaften
    & ästhetische Kommunikation at the University of Hildesheim, he is a member of
    the collective ARK (Arkstrated Rhyththme Complexities), a changing association
    of artists, scholars, and electronic MusickingThings,who/which perform heterochronicity
    and multi-track knowledge, looking for post-representative sound formats. Their
    works have been presented at CTM Festival Berlin, HKW Berlin, ifa-Galerie Berlin,
    MK&G Hamburg, MARKK Hamburg, among others. https://skusku.de/


    Robert Laidlow is a composer and researcher in the UK. His work is known for discovering
    and developing new forms of musical expression rooted in the relationship between
    advanced technology and live performance. He is currently a Fellow Composition
    at Jesus College, Oxford. 2018–22 he was the Prism PhD Researcher in Artificial
    Intelligence with the BBC Philharmonic Orchestra at the Royal Northern College
    of Music. His music has been broadcast on national and international radio and
    television. He has been awarded a Royal Philharmonic Society Composer’s Prize,
    an Ian Juritz Prize, and has been nominated for Ivor Novello Composers Awards.
    Recently he has presented research at the Cyborg Soloists Musics ex Machina symposium,
    the Royal Musical Association Annual Conference, the Society for Music Analysis
    annual conference, Creative Music Symposium 2023, and the AI & Music Creativity
    annual conference.'
