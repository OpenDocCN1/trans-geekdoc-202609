  md: '# V. Guljajeva, M. Canet Sola, I. Clarke: Artist-Guided Neural Networks 65


    something negative in art. It is easy to see that people from the industry advocate
    for the first position, and theory scholars for the second one. But in which ways
    AI is deployed in art practice? Hence, it is not the focus of this paper to discuss
    whether AI can make art, rather how AI can be useful for artists and what new
    ideas it can offer. By using practice-based research methodology, we decode the
    role of AI tools in artistic practice and trace the evolution of such artistic
    work. In this paper, the practice of duo Varvara & Mar was used as a case study,
    which provided us with the insides in this research.


    In this chapter, we explore in various ways how AI was deployed in creative, dividing
    it into four categories based on medium: synthetic image, synthetic text, synthetic
    form, and translation models. From the view of the practitioner, the limitations,
    new possibilities, and change in production processes are discussed.


    # Synthetic Image


    Our exploration of DL with image generation in 2017 when we used Google Deep Dream
    algorithm. The idea behind the Neuronal Landscapes project'' was to imagine how
    the Estonian landscape will look like in 100 years'' time (commission work for
    Estonian History Museum). Since machine mysterious synthetic vista began to be
    prevalent, the artwork offers an experience of what it is like to see the environment
    through machine eyes, and to be immersed in an endless hallucinated simulacra
    depicting Estonian society''s evolution throughout time: from forest and land
    farm, towards polarisation and increasing digitalization. For that purpose, a
    360° VR video (00:09:39 long) was created. First, the video material was filmed
    and edited. Doming with two 360 cameras carried by a drone to achieve a seamless,
    continuous shot, without a visible camera. After the stabilisation of the image,
    each frame was passed through the DeepDream algorithm. The rendering process took
    30 days'' time on two (for that time) powerful machines with Nvidia TitanX GPUs
    working in parallel. Although we could change parameters of the algorithm to slightly
    customise the effect, the imprint of the algorithm was still very present. At
    the end, Google Deep Dream became sort of a generative filter to the images.


    In the next project, ProGAN was developed. For the first time we worked with datasets
    and training GAN models. PlasticLand (2019)¹ talks about plastic waste and'
