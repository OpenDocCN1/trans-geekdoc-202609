- pgno: 105
  md: '# Artificial Intelligence – Intelligent Art?


    training portion these included decisions as what comprised the dataset or datasets,
    the type of model we were going to fine-tune, what our preferred parameters were
    when we training the models, and how we were going to sample generations from
    these models. Later, they included which elements of the generations we were going
    to keep or discard, and how much (if all) we would or edit them. Since there was
    no dedicated human writer on the team, these decisions were made collectively.


    Utilising A.I. as part of a creative process also differed from a normal collaborator
    in the sense that A.I. did not fundamentally understand the context of what it
    is writing. While it can create plausible-sounding sentences and stories, it is
    not aware that this is doing, and there is no intentionality behind any of the
    ‘creative decisions it makes. This is very different from human writers. We therefore
    felt empowered to make radical decisions when treating the text, including transforming
    into entirely different media, but also felt liberated in its found-state, even
    if that found-state was nonsensical and narratively underdeveloped. None of our
    readings of the material could be ‘right'' or ‘wrong’. This is especially true
    of the GPT-2 model we were using compared to models released closer to the time
    of this paper, which have shown significant improvement in understanding underlying
    context of text and ability to develop logical statements (Griffiths 2022).


    # Conclusion


    In this project, we explored the use of A.I. as a creative tool for transmedia
    storytelling. The project points to the cultural-semantic flaws, which are peculiar
    for the creative results of A.I. works and fills this gap with the filmmaking
    done by human actors. SOC challenged the myth that A.I. could replace authors,
    poets or other creators of art, entertainment or fiction in general. Instead,
    by using them in a creative process, A.I makes an important contribution to new
    art forms, foster inspiration for artistic practices and promote independent modes
    of expression.


    We started with a GPT-2 algorithm, trained on a vast amount of fictional literature
    about pandemics and plagues, that generated incoherent text fragments. Through
    the process of worldbuilding, linking the fragments and creating an imaginary
    world, we acknowledged the unique aesthetic of the A.I., its flaws and particular
    form of non-writing, and made the tool part of the collaboration between different
    disciplines and practitioners. By documenting the process, we showed that A.I.
    is not an autonomous author, that creates art on its own, but that it has the
    potential to become a tool in an emerging toolbox that it needs new artistic approaches
    to make use of this tool and shape it to its own desires.


    Last but not least, this insight into the process also serves as an inspiration
    for continuous, creative engagements with A.I. software. As past events have shown
    – and surely future development will proof – A.I. technology becomes a fixed part
