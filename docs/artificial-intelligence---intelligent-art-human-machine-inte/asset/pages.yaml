    Another approach is to tell stories tailored for a specific audience. This is,
    yet again, an aspect of the storytelling job that is considered inseparable from
    the task itself by human writers, and yet very rarely addressed in story generation
    systems. Fortunately, we are beginning to see research aimed in this direction,
    such as a module to enhance a video game by able to tell stories tailored to a
    specific player, based on a model for each individual player (Ramirez / Bulitko
    2010).


    Whether the goal is to achieve a particular purpose or satisfy a specific user,
    it is clear that generator systems would do a much better than they understand
    the potential reactions of the audience of their output. Computational models
    of how this might be achieved in terms of having specific models of the reader
    action in the generation system have been proposed (Gervás / León 2016). Although
    this type of integration is yet in the future, efforts already exist to build
    computational models of the reading task. In the case of metrics on story quality,
    specific approaches tend to focus on aspects of the task, such as understanding
    the set of events in a given discourse (Niehaus / Young 2014), modeling the reaction
    of the reader in terms of an evolving curve of suspense (Dousis 2015), interpretation
    of embedded stories within a frame story (Gervás 2021), or reconstruction of the
    actual chronology of a story told in a discourse that allows flashbacks (Gervás
    2022).


    # Rethinking Basic Assumptions


    In view of the analysis presented to this point, it is important to accept that
    the conceptual of computational story-telling should be considered not as a single
    task, but as a set of interconnected tasks, all related to narrative, but corresponding
    to formulas that are very different in computational terms, as described above.
    Most of the existing systems for computational storytelling operate at the level
    of discourse as understood by Ricoeur (1976): a sequence of sentences, where each
    sentence involves a predicate applied to some entities that need to be identified
    by the subject (and objects) of the story. This view abstracts away from what
    Ricoeur describes as “the particular structure of the particular linguistic system”,
    which would be closer to the text.


    From the point of view of a detailed analysis of computational storytelling, this
    distinction between text and discourse provides a key tool to understand the broad
    range of solutions that have been developed over the years. Suppose we consider
    that a story describes a story world – often fictional but not necessarily so.
    Suppose also that its narrative structure can be represented by some form of discourse,
    that may be rendered as text but which may allow rendering in other formats. Under
    these'
