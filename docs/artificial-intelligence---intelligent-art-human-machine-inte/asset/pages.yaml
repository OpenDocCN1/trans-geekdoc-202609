    This fallacy led leading researchers to reiterate the dumbness of what Emily M.
    Bender has "stochastic parrots" (in Bender et al. 2021: 2016). "Fooling people
    into thinking a program is intelligent is just not the same as building programs
    that are intelligent," argued Gary Marcus (2022). On the basis of large pre-trained
    data-sets and an enormous number of algorithmic operations, AI systems have become
    remarkably proficient at (1) recognizing patterns, and (2) predicting patterns.
    As Sudmann (2019:12) explains the been in "machine learning techniques and especially
    artificial neural networks (ANN) by advances in natural language processing, speech
    and image recognition in the first decades of the 21st century after many previous
    dead ends. Machine learning is an umbrella term for systems that "analyze and
    learn statistical patterns in complex data structures in order to predict for
    a certain input x the corresponding outcome y, without being explicitly programmed
    for this task." (ibid).


    The correctness of answers in a pre-trained large language model (LLM) such as
    ChatGPT is purely statistical that they sound plausible, but due to a lack of
    reasoning and knowledge statistics might still be incorrect, leading to failures
    in simple mathematics, commons reasoning and factual information about the world
    that it has no means to verify (Bang et al. 2023). This effect is often addressed
    as "hallucination" that the ability to predict the next word in a syntax should
    not be mistaken for superhuman intelligence or creativity. Two ways of countering
    these shortcomings are (1) expanding the data resources, and (2) exploring Reinforcement
    Learning with Human Feedback with the data emerging in dialogue exchanges. These
    improvements, however, will in all likelihood not the fundamental architecture
    of these stochastic systems. As Once Wyse (2019:1) summarizes:


    DNNs (deep learning neural networks) are "black boxes" where high-level behavior
    is not explicitly programmed, but emerges from complex interactions of thousands
    or millions of simple computational elements. Their behavior is often described
    in anthropomorphic terms that can be misleading, seem magical, or stroke fears
    of an imminent singularity in which machines become "more" than human.'
