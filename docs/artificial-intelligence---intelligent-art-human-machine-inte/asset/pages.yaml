  md: '# A Multitude of Answers


    The difficulties in defining creativity are widely acknowledged. In their paper
    ‘AI-esthetics and the Anthropocentric Myth of Creativity’, Arielli and Manovich
    state that ‘when we try to give a working and operational definition of these
    notions [of creativity], we see how elusive they are’ (4–5) and Margaret Boden,
    one of the fore-most authorities on creativity, agrees that ‘[c]reatativity is
    mysterious [...] the very concept is seemingly paradoxical’. (1996: 75) Nonetheless,
    however, they and others have repeatedly tried to capture creativity.


    # A Cognitive Perspective


    Margaret Boden takes as a starting point the so-called ‘standard definition’,
    which Runco and Jaeger formulate in a very concise way as: ‘Creativity requires
    both originality and effectiveness’. (2012: 92) This definition works in terms
    of necessary and sufficient criteria. If something is not original, it cannot
    be creative. Similarly, if something is not effective, it cannot be creative.
    Only when something is both original and at the same time we can say that it is.
    Now, effectiveness in this case should not be misinterpreted as a kind of problem-solving
    effectiveness only, but more broadly as achieving some kind of end, be it practical,
    or sensualaesthetic in nature. Surprise is sometimes used as a stand-in for originality,
    and a distinction can be made between cases of varying degrees of originality.
    Boden writes ‘Many creative ideas, however, are surprising in a deeper way. Their
    concern novel ideas that not only did happen before, but that [...] could not
    have happened before’. (1996: 76)


    Consequently, [we] now distinguish first-time novelty from radical originality.
    A merely novel idea is one that can be described and / produced by the set of
    generative rules are as other, familiar, ideas. A genuinely original or radically
    creative idea is one that cannot. It follows that the ascription of creativity
    always tacit or explicit reference to some specific generative system’ (ibid.
    78).


    This is interesting to acknowledge creativity is a matter of degrees; there are
    stronger and weaker cases, and it is possible that it would make sense to define
    creativity along prototypical cases. Furthermore, creativity, or rather the ascription
    thereof, is relative to context, more precisely to specific generative systems.
    This also implies that creativity requires rules to be broken. You can only be
    creative in a domain if there are conventions or constraints to violate the first
    place.'
