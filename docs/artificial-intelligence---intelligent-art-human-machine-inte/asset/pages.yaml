  md: 'itate realist and modernist paintings are claimed to be art (Manovich 2022).
    At the same time, experimental art forms, like installation, interactive, performance
    and sound art, are often overlooked unless they are promoted by a large corporation.


    Instead of re-telling a short but dense history of DL technology development,
    in the next section, we focus on the appearance of NN tools that raised interest
    among the artists that led to meaningful artwork production.


    # Historical overview of deep learning development


    DL is a subset of machine learning (ML) using Deep Neural Networks (DNN) to learn
    underlying patterns and structures in large datasets. In 2012, a DNN designed
    by Alex Krizhevsky outperformed other vision algorithms to achieve the new state
    of the art in the ImageNet Large Scale Vision Recognition Challenge Krizhevsky
    / Sutskever / Hinton 2017. This model, AlexNet, signalled the start of a new DL
    era. Over the past decade, DNNs have continued to grow in size and complexity,
    and are now used in a wide range of tasks including Computer Vision, Natural Language
    Processing, and even playing games like Go. As AI technology has developed and
    become more prevalent in real-world systems, artists have been exploring its limits
    and potentials, adapting these models to their own practices.


    As the number of scientific publications on artificial intelligence grows exponentially
    (Krenn et al. 2022), and the artistic interest grows alongside, it is useful to
    map out the influential papers, and related applications, to track the evolution
    of the AI-Art space in relation to the technological advances. Figure 1 shows
    a timeline of the development of generative models for images and text. Using
    this diagram we can make a few observations on the past ten years: the dominance
    of GANs for image generation, the influence of the Transformer on Large Language
    Models (LLM), and the growing interest in multi-modal approaches and translation
    models. The starting period of image generation using DNNs be be traced back to
    the creation of Variational Auto-Encoder (VAE) (Kingma / Welling 2013), and the
    Generative Adversarial Network (GAN) (Goodfellow et al. 2014). These models showed
    different ways in which a neural network can be trained on a large dataset, and
    then used to generate outputs that resemble but do not copy the original dataset.'
