  md: '# V. Guljajeva, M. Canet Sola, I. Artist-Guided Neural Networks 69


    Analysing synthetic books, Varvara Guljajeva has stressed the importance of input
    in the AI text-generation systems (2021). In addition, one also needs to guide
    the audience participation and interaction with the chatbot. For this purpose,
    we have adopted the traditional theatre method for guiding actors, as a way to
    guide the audience, and thus, the bot, too. Stage directions were used as a guiding
    method, which triggered thematic conversation and offered meaningful dialogue
    between humans and the AI system. We found the conversations so meaningful we
    decided to publish a book that contains all the conversations with ENA.


    With this project, we learned that it is essential to guide neural networks via
    audience interaction. In order to do this, it is also necessary to guide the audience.
    Without audience interaction guidance, it is nearly impossible to achieve meaningful
    navigation of NNs.


    # Translation models


    This category focuses on translation models that enable interactive and installation-based
    formats. Translation refers to the conversion of media, or as we put it, translation
    of semiotic spaces. To illustrate this, we demonstrate *Dream Painter*,¹⁴ an installation
    that translates the audience''s dreams to a line-drawing produced by a robot (see
    figure 4). As described earlier: “Dream Painter is an interactive robotic art
    installation that explores the creative potential of speech-to-AI-drawing transformation,
    which is a translation of different semiotic spaces performed by a robot. We extended
    the AI model CLIPdraw using CLIP encoder and the differential rasterizer diff
    for transforming the spoken dreams into a robot-drawn image”.Can Sola / Guljajeva
    2022)“Design- and technology-wise, the installation is composed of four layers:
    audience interaction via spoken word, AI-driven multicolored drawing software,
    control of an industrial robot arm, and kinetic mechanism, which makes paper progression
    after each has been completed. These interconnected parts are orchestrated into
    an interactive and autonomous system in the form of an art installation [...].
    Guljajeva / Can Sola 2022b Out of all the projects, this was the most difficult
    to realise.


    In this project, we investigated how guidance of NNs could be interactive and
    real-time instead of non-interactive and pre-determined, as shown in previous
    examples of our work. It is important to note that methods, such as dataset composition
    and output curation were not used in this case. In fact, visual curation is totally
    missing. The artists created an interactive system to be experienced and covered
    by the audience. This means the audience determines the output. Instead of curating
    a dataset, a CLIP model is used that can produce real-time output


