  md: '# Jan Lehmann Stephensen: The Marcel Duchamp case in, against, or Artificial
    Creativity 127


    ‘creative’, or both.⁵ Yet, this does not happen; and certainly not randomly. It
    always happens as a part of a complicated social game in the art world (cf. Becker)
    or within the so-called ‘creativity complex’ (cf. Reckwitz 2017), and typically
    in ways that are entangled with other concerns such as ideology, politics, and
    economy.⁶


    All of this raises a hot of discussions, which are impossible to cover in full
    detail here. Most important is the following: insisting on thinking about both
    creativity and art as socially becoming phenomena enable us to problematize the
    problematic assumption persistently resonating throughout discourse on artificial
    creativity and artmaking, namely phenomena *pre-exist* in an *un*-artificial form.
    In short: the idea that creativity and art exist in ‘natural’ forms that we get
    to know more about and reproduce, is the fundamental logic underlying so much
    artificial creativity research within academia, software-engineering, the art
    world(s), and the zones in which all these meet.


    This logic of course simply be a bi-product of the world ‘artificial’, since it
    mostly bends towards the ‘emulation’, which according to Jensen (2018) means to
    ‘reproduce [...] in a way that is causally identical to the thing being uttered’,
    rather than ‘simulation’, which means to ‘pretend’ or ‘give the appearance of’
    pre-existing), which is what the Turing-test measures (which is not without its
    own set of problems either, but that is another paper). It probably also has to
    do with a lack of historical awareness, whereas even interest. Regardless of why
    this might be, the point is: dominant discourses on artificial creativity and
    / or art end up reinforcing a historically inherited notion of some pre-existing,
    natural, or unartificial humanity (for instance as a capacity to make art). This
    has also been pointed out by Zylinska in her book *AI Art.*the frequently questioned
    ‘Can computers be creative?’, she notes, ‘reveals itself to rather reductive because
    it is premised on a pre-technological idea of the human as a self-contained subject
    of decision and action’ (2020: 55). So, these notions of artificial art / creativity’
    are often based in and reproduce, or even reinforce, the assumption of the pre-existence
    of an autonomous, purely human creativity that is not already socially, culturally,
    technologically, and / ideologically entangled. Which is quite paradoxical it
    contradicts the often-repeated claims that AI will fundamentally challenge the
    human monopoly on being the creative species, the only making art.


    +   ⁵ Creativity is often, as anthropologist Tim Ingold (2011) puts it, “read
    backwards”, that is inferred from the canon artworks as part of the artists’ (inherent)
    ability/creativity. In other words: the outcome of social negotiation processes
    (often containing cultural and material aspect as well) are typically naturalized
    as essential, inherent, sometimes even innate, individual characteristics.


    +   ⁶ Various creativity (both concepts and practices) have emerged in intimate
    entanglement with broader socio-politically and ideologically loaded debates and
    struggles especially since WW2 (cf. Stephen 2016; 2020; 2022).'
