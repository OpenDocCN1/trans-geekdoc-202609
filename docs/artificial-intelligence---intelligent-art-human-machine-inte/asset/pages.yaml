- pgno: 71
  md: '# 74 Artificial Intelligence – Intelligent Art?


    the case of ENA, stage directions were used, and in the Dream Painter project,
    the concept of dream telling was applied to guide the participants in turn guided
    the neural net through their interaction, creating a chain reaction. Navigating
    concepts in latent space is artistically interesting and inspiring, which was
    especially evident when working with form. The artists went beyond semantics and
    learned how to guide neural networks with a text prompt and 3D object.


    The presented practice represents a paradigm shift in machine learning, moving
    away from composing datasets for GANs and towards translating semiotic spaces
    through diffusion models. The evolution in practice shows how artists discover
    and learn to work with the DL toolset, embracing its possibilities and limitations.
    In the case of practice-based research, practice can be seen as a lab for testing
    artistic ideas with technology through chance until control is encountered.


    # Conclusion


    In this article, we have summarised DL development from the perspective of artists''
    interests concentrating on the image, video, text, 3D object generation, and translation
    models. We applied practice-based research methodology to investigate the role
    and possibilities of recent co-creative AI tools in artistic practice.


    It is difficult to keep pace with AI development. In less than a decade, we have
    gone from blurry black-and-white faces to impressive high-resolution images guided
    by text prompts. The user level has gone from difficult to easy, which on one
    side, broadens possibilities for creation, but on another, it diminishes experimentation
    and creativity, since AI outputs seem ready-made. This is also demonstrated by
    the exploratory nature of the body of work presented.


    Furthermore, it was noticed that creative AI, especially GAN models, have recognizable
    aesthetics, which in the long run, become repetitive. This led to the change of
    outputs by artists. The curation of datasets, models, and outputs, all with NN
    guidance, have become the toolset of an artist working with AI. Finally, these
    models can generate multiple outputs, but the art is giving the right input to
    guide the desired output and selecting the results best serve the concept


    As Andy Warhol had envisioned in 1963, eventually, art production will become
    mechanised and automated. In his own words: “I want to be a machine”, which was
    also a reflection on time’s vast industrialization process. Resonating with today’s
    deep learning: I want my machine to do art.'
