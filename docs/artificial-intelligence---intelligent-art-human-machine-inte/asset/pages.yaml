    The question of what is consciousness and how we know something possesses said
    incredibly complex in all fields of inquiry, that many philosophers and theologians
    resort to statements such as the following made by Penti O Haikonen in Consciousness
    and Robot Sentence “[t]the philosophy of mind has tried to solve the mystery of
    consciousness, but with limited success” (2012: 2). Other disciplines, as psychology
    and neuroscience, have attempted to define consciousness through “neural activities
    with conscious states” (2012: 2), but have come short of explaining how the neural
    activity can demonstrate awareness of consciousness. Engineers and programmers
    likewise attested to define consciousness through systems theory as a product
    of movement and learned behavior through socialization. Thus, the inquiry into
    consciousness has been left at partially unanswered and far from resolved into
    simple definitions. This automaton consciousness remains a realm for artists and
    writers. Referring to this, Nicola Reeves and David St-Onge argue that the automaton
    is our impulse for animation, which fundamentally means the process by which a
    soul (anima) appears spontaneously in an artefact, expands to include movement
    and behaviour (2016: n.p.). Further, Reeves and St-Onge Etym speaking ‘automaton’
    thus describes a machine that can not only move or work, but also think and will,
    three notions that are usually associated with beings infused with a mind: conscious
    living beings”. This question of automatons have a soul or consciousness is at
    the heart of Rokuro Inoue’s novelistic world in Automatic Eve.


