    Varvara Guljajeva, Mar Canet Sola,¹ Isaac Clarke


    # Introduction


    It is claimed that recent advancements in AI, such as CLIP-based Midjourney and
    DALL-E, are supposed to augment our creativity. For the first time, it does not
    sound so absurd that artists can find themselves out of jobs (Nicholas 2017).
    Not artists would have ever had a secure and stable job, but deep learning (DL)
    tools might eventually lead to losing some commercial commissions. However, such
    relying on a modern art approach where skills are in the centre of attention and
    not the conceptual idea. Quoting Lev Manovich—“Since 1970 the contemporary art
    world has become conceptual, he focused on ideas. It is no longer about visual
    skills but semantic skills”. (2022, 62) Echoing Aaron Hartmann, once painters
    were in a similar situation when photography was invented and took over the niche
    of portrait-making. And photography had to wait another 40 years until it got
    recognized as an artistic medium (Hertzmann 2018). Visual artists had to re-invent
    themselves and re-think the meaning of painting.


    Computer art with the invention of the computer. Arts, such as Vera Molnar and
    Manfred Mohr, created their first computer-generated artworks in the 1960s using
    scientific lab computers at night when they were not used by scientists. Early
    computer artists were re-purposing a machine for artistic use and writing code
    to make art on. Since the creation process was mediated by a computer, it may
    seem to the general audience that artists were simply pressing a button and the
    computer doing art for them. Hence, the question of authorship emerged: is the
    artist a machine or human?


    Paradoxically, today with the appearance of neural networks (NN) and their creative
    applications, the same question re-appears. For example, Aaron Hartmann has written
    several articles arguing (2018, 2020). Lev Manovich also describes how AI-generated
    images that im-


