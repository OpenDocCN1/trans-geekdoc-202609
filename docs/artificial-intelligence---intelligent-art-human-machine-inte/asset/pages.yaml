  md: 'changing consequences for musicologists and other music professionals who employ
    formal musical knowledge.


    Accordingly, it is an important task to look for ways to anticipate and discuss
    future changes of these tools used by music professionals, creating opportunities
    for a smoother and more productive transition into the new technological situation.


    For discussing the imaginations of a *future* musical knowledge, a possible starting
    point can be the *history of music*. Existing literature illustrates the fact
    that theories of music are normally structured, even if implicitly, around the
    specific abilities and limits of the human subject (Christensen 2008; Cambouropolis
    / Kaliakatos-Papakastas 2021), meaning that human listening is at the core of
    these attempts to create a formal system for making and analyzing music.


    At the same time, capable technological tools for carrying out various music-related
    tasks have started to emerge during the previous decades, following developments
    in machine learning. Examples are tools for impacting human musical creativity
    (Niehaus 2009; Brier / Hadjes / Pachet 2020; Miranda 2021), and for impacting
    decision-making in technology-assisted processing of audio, affecting the aesthetics
    of the recordings (Sterne / Razalogova 2019).


    Of all such music-related tasks, only the music-generating systems and the recommender
    systems used by online streaming companies to present their recordings have currently
    received substantial interest.


    Especially the tools in the area of computational creativity as the generation
    of music are well represented in literature which also includes topological overviews
    of current and historical technical developments (Adveeff 2019; Gioti 2020; Bown
    2021; Tatar / Pasquier 2019; Lubart 2005). The inputs connected to audio recommender
    systems have also been discussed at length by Eriksson et al. (2018); Born et
    al. (2021) and others.


    By contrast, the field of formal musical knowledge itself, the theories that are
    created and used in music theory, as well as in musical practice, has remained
    underrepresented in literature.


    Today, one of the biggest challenges for music education is the ability of modern
    AI to create images without using the familiar terms and constructions of human
    music. To put it differently, we are in a new situation where we have (or imaginations
    of) works created with the help of AI as if they were created through well-known,
    explicit *rules* of composition, whereas they are actually created through the
    training of a neural network using musical *examples*. This means that musical
    theory the tension between explicit (rules) and implicit (examples) knowledge
    is now becoming more and more problematic, making the status of its explicit or
    implicit mode of education and work much less clear than it was in previous eras
    of music and technology.


    An even greater challenge to human musical theory is the ability of modern machine
    learning systems to work directly with sound, bypassing the level of musical'
