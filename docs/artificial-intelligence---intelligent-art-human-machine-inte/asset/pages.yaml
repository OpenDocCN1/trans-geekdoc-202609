    By introducing the concept of ''symbiotic gestures'', Suchman (2017) notices that
    ''humans and artefacts are mutually constituted''. Scott Gage in the practice
    observes intra-action between the human performer and the technological artifact.
    Kate is exploring the limits of the machine, and the machine reacts to Kate''s
    actions. It is a continuous exploration of boundaries. From the sides, and by
    adjusting the parameters of this human-machine interaction, Mika is also modulating
    the boundaries between the human and the system. By suggesting shifts in attention
    focus, Diana is also altering the boundaries of this interaction. This type of
    exploring exercises in practice the notion that ''agencies – and associated accountabilities
    – reside neither in us nor in our artifacts but in our intra-actions'' (Suchman
