    Cybernetics - derives from the Greek ''kybernetes'' meaning ''steersman''; our
    ''governor'' comes from the Latin version of the word. The term cybernetics was
    first used by Norbert Wiener around 1948. In 1948 his book ''Cybernetics'' was
    subtitled ''communication and control in animal and machine''. The term refers
    to systems of communication and control in complex electronic devices like computers,
    which have definite similarities with processes of communication and control in
    the human nervous system. A cybernetic device responds to stimulus from outside
    and in turn affects external environment, like a thermostat that responds to the
    coldness of a room by switching on the heating and altering the temperature. This
    process is called feedback. Exhibits in the show are either produced with a cybernetic
    device (computer) or are cybernetic devices in themselves. They react to something
    in the environment, either human or machine, and in response produce sound, light
    or movement. Serendipity - was coined by Horace Walpole in 1754. There was a legend
    about three princes of Serendip (old name for Ceylon) who used to travel throughout
    the world and whatever it they looked for, they always found something much better.
    Walpole used the term serendipity for the faculty of making happy chance discoveries.
    Through the use of cybernetic devices to make graphics, film and poems, as well
    as other reasoning machines that interact with the spectator, many happy discoveries
    were made. Hence the title of this show. (Reichardt 1968)


