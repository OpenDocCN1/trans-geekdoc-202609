- pgno: 69
  md: '# Artificial Intelligence – Intelligent Art?


    Since we had never engaged in ceramics before, the whole production process felt
    psychedelic: unexpected NN processes led to transformation by numerical, physical,
    and chemical processes, all guided by both the artists and chance. Hence, the
    art project highlights the relationship between different agencies.


    In the end, we can say that AI is not prepared for the physical world. It created
    nice images, but one wants to materialise the output, it requires considerable
    additional work. However, those extra processes were very rewarding and creative
    in our case. In this project, AI served as an inspiration or a departing point
    more than anything else. In other words, the experimental phase of technology
    is necessary for experimental practices, and this can lead to the creation of
    a new production pipeline. The fine line between control and chance when guiding
    the neural networks and related processes is likely the main creative drive for
    the artists.


