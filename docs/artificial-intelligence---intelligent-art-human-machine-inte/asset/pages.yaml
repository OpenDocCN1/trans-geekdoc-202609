  md: 'the Mondrian painting seemed to them machinelike. This finding does not, of
    course, detract from Mondrian’s artistic abilities. (1967: 92)


    His experiment is was about simulating a style of an artist to produce works that
    could substitute the artist – since the non-expert subjects identify the simulation
    as the real artwork. In that sense, Noll formalizes cognitive labor. Interestingly,
    at the very beginning of his paper Noll discusses the question of“how does an
    artist work” (1967: 90) and tries, starting from an anecdote by Henri Matisse
    about his stepwise-process, to get to grips with the creative process:


    Most of all, the Matisse anecdote suggests that the artistic process involves
    some form of “program”, one certainly more complex than the anecdote admits, a
    definite program of step-by-step action. Without doing too violence to our sense
    of what is appropriate, we might compare it to a computational hillclimbing technique
    in which the artist is trying to optimize or stabilize at a high level the parameter
    “excitement”. (1967: 90)


    There have been further attempts to automate style, for example in the work of
    Kirsch and Kirsch (1988). The authors demonstrate these methods with algorithmic
    descriptions of the styles of Richard Diebenborn and Joan Miró and the generation
    of new compositions in their styles.


    Although Noll’s work pointed in that direction, however, art was not rationalized
    away and transformed, via real subsumption as Marxists would put it, under an
    industrial regime of mass production.


    # Some theoretical reflections: Why can artistic work not be automated?


    Artistic work seems to be a type of work that seemingly cannot or should be formalized,
    algorithmized, and automatized. But why? At least first, the art market looks
    exactly like any other market: artists have to earn money with their work and
    their ‘works’. It is not a realm of freedom, but only a kind of service or consumer
    goods that serves a special market. But on consumer markets we find lots of products
    that are mainly produced by machines and have no authority signal attached to
    it (although there are things like brands, of course). The idea of art without
    the intervention of a human author or creator – and even her role consists precisely
    in demonstratively withdrawing – does not seem plausible to us. But even if we
    don’t want to use a nowadays obsolete notion like ‘genius’ by the definition non-automatable,
    we still insist on a certain originality and novelty in art that is not the result
    of random processes (although randomness can be used, but as part of an original
