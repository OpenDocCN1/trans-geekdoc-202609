  md: 'It needs to be stressed that the problem of automation and creativity has a
    multifaceted genealogy going back at least to the beginning of the twentieth century
    perhaps even earlier when we think about the nervous discussions on the possibilities
    of producing art with photography in the 19th century. One argument there was
    that the automatic image generation in photography and the unintended would contradict
    the idea of artistic intentionality (see for this interesting discussion Kemp
    1980: 8). Since then the question of automation, automatism etc. haunted the question
    of art.


    # de-automatization, automatism – at the beginning of the 20th century


    At the beginning of the twentieth century there were parallel developments which
    center around notions that are not identical, but at least similar and are connected
    to the ‘automatic’ in a wider sense


    +   a. Where Russian Formalism and especially Viktor Shlovsky, who argued that
    the task of art is to ‘defamiliarize’ perception, to make ‘it strange’. Shlovsky
    saw quotidian perception marked by automatization. “Automation eats things, clothes,
    furniture, your wife, and the fear of war” (Shlovsky 2015: 162). He did not explicitly
    refer to industrial automation – but his essay Art as Device explicitly mentions
    1917, years after Ford first installed a famous assembly line for the production
    of cars. Nevertheless, Shlovsky sometimes refers e.g. to the car as a made too’.
    a paradigmatic example. Ginsburg, quoting Shlovsky: “We know how life is made
    and how Don Quixote and the car are made too’. Literary criticism as a scientific
    enterprise, art as a technological artifact” (Ginsburg 1996:8). In another passage
    Shlovsky explicitly mentions the ‘automatic’ (quoted in Platonov 2016: 19) and
    he is quoted as follows: “The machine changes more than anything else” (in Lvoff
    2016: 65). Art, on the other hand, should present things (or processes) – so that
    we are holders see them, in a way, for the first time. Art was not supposed to
    change the political implications of industrial automation or the conditions at
    workplaces, but at least could change and refresh a petrified perception. Automatization
    and perceptual automatism were to be estranged by art to provide a fresh look
    onto the world.


    +   b. Automatisms also played a role in a very different field of art that emerged
    only a few years later than Russian Formalism, namely Surrealism. This was related
    to notions of psychic and bodily automatisms that emerged in psychology and psychoanalysis
    in the late 19th century – and somewhat automatic psychic processes were offered
    modern after media technologies. Surrealism developed (among others) so-called
    strategies of automatic writing and drawing, e.g. Breton (2007) wrote a nowadays
    essay on ‘the automatic message’ in 1933. The surrealists thought'
