- pgno: 1
  md: 'Eckart Voigts is a professor of English literature at Technische Universität
    Braun-schweig. He has written, edited and co-edited numerous books and articles.

    Robin Markus Auer is working towards a PhD as part of an interdisciplinary-search
    project on automated creativity in literature and music at Technische Universität
    Braunschweig. His work focuses on the interplay between human and machine creativity
    in coupled embodied creativity.

    Dietmar Elfelein (apl. Prof. Dr.) teaches popular music at Technische Universität
    Braunschweig. He is a member of the advisory board of the German speaking branch
    of the International Association for the Study of Popular Music.

    Sebastian Kunas is a musician, sound artist, producer and educator with background
    in sound and DIY culture as well as cultural and sound studies. He teaches electronic
    sound and music practice and supervises the electronic studio and the recording
    studio at the Faculty of Cultural Studies and Aesthetic Communication at Universität
    Hildesheim. He is a member of the collective ARK (Arrested Rhythm-machine Complexities),
    a changing association of artists, scholars and electronic MusicThings.

    Jan Röhner is a professor for Modern literature in the technical-scientific world
    in the Department of German Letters at Technische Universität Braunschweig. His
    research interests range from avantgarde poets and cinema, autobiography and war,
    landscape and geopolitics, and wilderness writing to feminism and contemporary
    literature.

    Christoph Selinger is a research assistant in modern German literature studies
    at the Institute of German Studies at TU Braunschweig, where he completed his
    doctorate in 2021. Previously, he completed the interdisciplinary Master’s programme
    “Culture of the Techno-Scientific World” at TU Braunschweig. His research focuses
    on the interfaces between film and literature, border crossings in (audiovisual)
    media, the connection between literature/film and the avant-garde, and the so-called
    “trivial culture”.'
