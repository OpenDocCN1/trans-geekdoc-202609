  md: 'Often, it seems hard to distinguish artificial artificial intelligence technologies
    from the more general field of digital computation. The terminology of AI is indeed
    closely linked to the discourse of automation – a much wider term that includes
    not only the pre-digital world, but also the advances of technologies that seek
    to automate (i.s. self-govern) processes. The automaton is thus, a special case
    of a self-operating machine. The distinction is often made that automation ventures
    in it beyond software programming and algorithms – i.e the rule-governed world
    of ‘if-then’ – and, instead, uses-learned processes, modifiable algorithms and,
    therefore, data processing that goes beyond algorithmic instructions (but inevitably
    code-written rules). An AI system is, therefore, any device that perceives its
    environment and takes actions that maximize its chance of successfully achieving
    its goals.


    Various debates, arguments and predictions have ensued about the power and development
    of AI. AI enthusiasts like Raymond Kurzweil (2005) predicted that AI will begin
    by what he calls ‘singularity’ around 2045, the dawn of a new civilization that
    will enable us to transcend our biological limits and amplify our creativity.
    In this new world, there will be no clear distinction between human and machine,
    real reality and virtual reality”. In view of fact that machines have recently
    been found to perform non-programmed or at least traceable tasks (machine learning),
    the supposedly clear boundary between AI and HI (human intelligence) seems to
    become fluid. The concept of “code poetry – poetry that can be performed by humans
    and computers, mixing the norms of literature and coding – can be seen as the
    merging of humans and machines.


    Most of these arguments imply several points of view on definitions of the “human”
    and a variety of “posthuman” or “transhuman”. Advances in information science
    and biotechnology (artificial organs, cloning, splicing, multiple part bases,
    expansion of longevity, etc) cast shadows on the idea that we can maintain-clear
    boundaries between organisms and machines. Non-human or post-human hybrids, for
    instance, as robots, bots (automated applications), androids (human robots), replants
    (robotic androids), cyborgs (cyberorganisms) or clones (genetic replicas), providing
    new perspectives from which humanity can revert, rethink, access, and even reconstruct
    the human body, its role, and relation to biotechnological means. As a consequence,
    significant discussions on human ‘normality’ and human exceptionalism have emerged.
    The frequently used qualifier, ‘critical posthumanism, is prefixed to mark the
    difference between posthumanism and transhumanism. On the one hand, critical posthumanism
    engages poststructuralist, colonialist and feminist deconst, invariably pointing
    out that ideologies of Enlightenment ‘liberal humanism’ tended to serve the white,
    male, European cis-male only (cf. Hayles1999: xiv; Vint 2007: 12; Braidotti 2013:
    50).

    On the other hand, transhumanism denotes a positive attitude towards technologies
    that promise an improvement of the ‘human’, countering the post-anthropological'
