    neurons”. They also have an emotional effect that comes with having designed one’s
    own timbre and making it usable in other contexts, similar to how musicians emphasise
    the value of specially recorded or discovered sounds and music sequences when
    sampling or djing. Otherwise, “spawning”, by Herndon the methods of timbre transfer,
