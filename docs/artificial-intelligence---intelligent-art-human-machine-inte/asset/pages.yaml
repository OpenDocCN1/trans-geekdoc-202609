    # Free-floating and grounded systems


    Despite constant admonitions from computer scientists, linguists, and cognitive
    psychologists to use terms such as intelligence and consciousness with care, the
    industry remains immune to such warnings. Thus, critics accused Lemoine of having
    fallen for the "ELIZA effect" (Christian 2022) – of having projected intelligence
    and consciousness onto LaMDA – a susceptibility Joseph Weizenbaum already observed
    in 1966 among users of his ELIZA chatbot: Although ELIZA merely mimicked a Rogerian
    psychoanalyst, mirroring the patient’s statements back to them as questions, its
    users behaved as if the program were a conscious agent interested in their well-being.


    The classic objection here is the following: Computers are symbol-processing systems
    that deal with syntax alone, not without semantics – they can process logical
    forms but without substantive meaning (Cramer 2008). For their operations it is
    irrelevant which objects or concepts the symbols name in a human world and which
