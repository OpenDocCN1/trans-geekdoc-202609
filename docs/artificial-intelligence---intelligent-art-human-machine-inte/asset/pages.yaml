  md: '# Digital Aesthetics: A Symbolism of the Body and a More-than-Human Mode of
    Enquiry


    Jannis Steinke


    New developments in digitalisation and especially technological innovations in
    terms of the use of Artificial intelligence often reinstall an anthropomorphism
    and anthropocentrism by diagnosing a transhumanistic technooptimism or technosololutism
    that claims to be able to “reverse-engineer extinction via AI” (Zylinska 2020:
    40). Zylinska calls this the “Anthropocene Imperative: a call to humans to respond
    to multiple crises of life while there is still time (ibid.). The current attempt
    by the European Union to regulate so-called high-risk systems of AI displays a
    similar paradigm;


    AI should be a tool for people and a force for good in society with the ultimate
    aim of increasing human well-being. Rules for AI available in the Union market
    or otherwise affecting people in the Union should therefore be human centric,
    so that people can trust that the technology is used in a way that is safe and
    compliant with the law, including the respect of fundamental rights.


    This guideline emphasizes the ‘human-centeredness’ as the all-encompassing norm
    that frames these regulations. The ‘human’ must be protected by all means from
    a harm that could potentially be caused by an unsafe technology, in this case
    by a form of Artificial Intelligence. While this aligns with the EU’s responsibilities
    of protecting its citizens from harm – on a political level –, the concept of
    ‘human’ is also problematic in an onto-epistemological perspective. Rosi Braidotti
    (2013) indicates the fact that “Not all of us can say, with any degree of certainty,
    that we have always been human, or that we are only that. Some of us are not even
    considered fully human now, let alone at previous moments of Western social, political
    and scientific history.” (1)'
