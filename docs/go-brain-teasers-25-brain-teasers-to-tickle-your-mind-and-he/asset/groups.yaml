    - justforfunc 中的“为什么 Go 中有 nil 通道？”\n\n## 17. 一个有趣的字符串\n\n清单 29. strint.go\n\n\
    ```go\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\ti := 169\n\t\
    s := string(i)\n\tfmt.Println(s)\n}\n```\n\n在进入下一页之前，试着猜猜输出是什么。\n\nstring 类型支持从\
    \ int 进行类型转换，它会将此整数视为一个 rune。字符码点 169 是版权符号（©）。通常犯此错误的人来自 Python 等语言，在 Python\
    \ 中 str(169) → \"169\"。\n\n如果要将数字转换为字符串（或将字符串转换为数字），请使用 strconv 包：\n\n清单 30. strint_conv.go\n\
    \n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"strconv\"\n)\n\nfunc main()\
    \ {\n\ti := 169\n\ts := strconv.Itoa(i)\n\tfmt.Println(s)\n}\n```\n\n字符串也支持从字节切片进行类型转换：\n\
    \n清单 31. strint_byte.go\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc\
