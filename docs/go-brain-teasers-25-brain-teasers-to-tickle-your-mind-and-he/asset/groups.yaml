  - '[PAGE 7]


    # FORWARD BY DAVID CHENEY


    As a fan of trivia, in the salad days of my education as a software engineer,
    one of my favourite books was Josh Bloch and Neal Gafter’s Java Puzzlers. I liked
    that the authors didn’t simply set out to stump readers with the obscure language
    factoids. Instead, each question was treated as an opportunity to educate the
    reader on the history and deeper meaning of a less travelled aspect of the language.


    When I discovered, far too many years into my Go experience than I care to mention,
    that copy returned the number of elements copied, my first thought was wow, how
    had I missed that. My second thought was I wonder how many people I can trick
    with this. Thus was born my #golang pop quiz series of tweets.


    With tweet sizes being what they are the requirement to fit an entire Go program
    into a single tweet proved a challenge. Divining the correct answer to a #golang
    pop quiz and the opportunity to follow Bloch and Gafter’s example to educate,
    rather than frustrate, was left as an exercise to the reader.


    In Go Brain Teasers, Miki has prepared a set of tests that seek not to simply
    baffle, but to enlighten. Go Brain Teasers’ provides the reader with the opportunity
    to learn the why behind that what!?!.'
