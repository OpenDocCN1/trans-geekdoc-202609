    }\n```\n\nTry to guess what the output is before moving to the next page.\n\n\
    *iota* is Go's version of an enumerated type. It can be used inside a *const*\
    \ declaration. *iota* grows by one for each constant in the same group. If you\
    \ specify an operation on *iota* (e.g. addition), it'll carry on.\n\n`<<` is the\
    \ left shift operator, it'll move the bits in a number n places to the left.\n\
    \n- 1 in binary (8 bit) is 00000001\n- 1<<3 is 00001000, which is 8\n\nIn our\
    \ case, we start with *Read* = 1<<*iota* which translates to 1<<0 -> 0001, which\
    \ is 1. Then there's an implicit 1<<1 -> 0010 for *Write* which is 2 and finally\
    \ an implicit 1<<2 -> 0100 for *Execute* which is 4.\n\nYou'll mostly use these\
    \ bit operations for flags. You can pack 8 flags in one byte using | [14] (called\
    \ \"bitmask\") and efficiently check if a flag is set with & [15].\n\n*Listing\
    \ 46. iota_check.go*\n\n```\nmask := Read | Execute\n\nif mask&Execute == 0 {\n\
    \    fmt.Println(\"can't execute\")\n} else {\n    fmt.Println(\"can execute\"\
    ) // will be printed\n}\n\nif mask&Write == 0 {\n    fmt.Println(\"can't write\"\
    ) // will be printed\n} else {\n    fmt.Println(\"can write\")\n}\n```\n\niota\
    \ values are numbers, in some cases you’d like your constants to have a human-readable\
    \ representation. This is done by giving these constants a type and implementing\
    \ fmt.Stringer interface for this type.\n\nListing 47. iota_str.go\n\n```\npackage\
    \ main\n\nimport (\n\t\"fmt\"\n)\n\ntype FilePerm uint16 // 16 flags are enough\n\
    \nconst (\n\tRead FilePerm = 1 << iota\n\tWrite\n\tExecute\n)\n\n// String implements\
    \ fmt.Stringer interface\nfunc (p FilePerm) String() string {\n\tswitch p {\n\t\
    case Read:\n\t\treturn \"read\"\n\tcase Write:\n\t\treturn \"write\"\n\tcase Execute:\n\
    \t\treturn \"execute\"\n\t}\n\n\treturn fmt.Sprintf(\"unknown FilePerm: %d\",\
    \ p) // don't\n\tuse %s here :)\n}\n\nfunc main() {\n\tfmt.Println(Execute) //\
    \ execute\n\tfmt.Printf(\"%d\\n\", Execute) // 4\n}\n```\n\nI'll leave it as an\
