  mdcn: "\n\n## GO 脑筋急转弯\n锻炼你的大脑\n\n![](img/07a7b391d92ba53dcfe8da4b75a4aed7_0_0.png)\n\
    \n```go\npackage main\n\nimport (\n \"fmt\"\n)\n\nfunc main() {\n var π = 22 /\
    \ 7.0\n fmt.Println(π)\n}\n```\n\n这段代码能编译吗？它会打印什么？\n\n25 个令人困惑的脑筋急转弯及解答\n米基·特贝卡\n\
    \n## 为什么是 Go 脑筋急转弯？\n\nGo 编程语言是一种简单的语言，但和其他所有语言一样，它也有自己的怪癖。本书将这些怪癖作为教学机会。通过了解你知识中的空白\
    \ - 你会在所做的事情上变得更好。\n\n大量研究表明，在学习过程中犯错的人比不犯错的人学得更好。如果你在修复 bug 时在工作中采用这种方法 - 你会发现你更享受调试过程，并在修复每个\
    \ bug 后成为更好的开发者。\n\n这些脑筋急转弯将帮助你避免错误。有些来自我将 bug 发布到生产环境的亲身经历，有些来自其他人同样的经历。\n\n\
    脑筋急转弯很有趣！我们极客喜欢谜题和解决它们。你也可以使用这些脑筋急转弯来给同事留下深刻印象，举办知识竞赛，共同进步。\n\n其中许多脑筋急转弯来自我在会议和聚会中出的测验。我发现人们非常喜欢它们，而且它们往往能活跃气氛。\n\
    \n在每章开始时，我会展示一个简短的 Go 程序，并要求你猜测输出。可能的答案可以是：\n\n- 不会编译\n- 恐慌\n- 死锁\n- 某些输出（例如 [1\
    \ 2 3]）\n\n> 我使用 Go 版本 1.14.1 来运行代码，输出在未来版本中*可能*会发生变化。\n\n在进入答案和解释之前，请先猜测输出。猜测输出后，我鼓励你自己运行代码并查看输出，然后再阅读解决方案和解释。我教授编程多年，发现这种做法非常有效。\n\
    \n## 关于作者\n\nMiki 拥有本古里安大学的计算机科学学士学位。他还在那里学习计算语言学硕士学位。\n\nMiki 热衷于教学和指导。他在世界各地教授各种技术主题的研讨会，并指导了许多年轻开发者走上成功之路。Miki\
    \ 参与开源，拥有自己的多个项目，并为多个项目做出了贡献 - 包括 Go 项目。他使用 Go 超过 10 年。\n\nMiki 撰写了《锻造 Python》，是\
    \ LinkedIn Learning 的作者，也是 Go Israel Meetup、GopherCon Israel 和 PyData Israel Conference\
    \ 的组织者。\n\n## 关于代码\n\n你可以在 https://github.com/tebeka/go-brain-teasers 上找到脑筋急转弯的代码。该代码根据\
    \ Apache License 2.0 版权所有，请尊重它。\n\n我尽量保持代码简短，并移除与脑筋急转弯无关的任何内容。这不是你通常编写代码的方式。\n\
    \n## 关于你\n\n我假设你在某种程度上了解 Go 并有使用它进行编程的经验。本书不是用来学习如何用 Go 编程的。如果你不了解 Go，恐怕这些脑筋急转弯不适合你。\n\
    \n我建议先学习 Go（这也很有趣），网上有很多资源 [1]。\n\n当然，我们 353solutions 提供广泛的“实操”Go 研讨会。我们很乐意听取您的需求。\n\
    \n- 1 Google 是你的朋友。\n\n## 大卫·钱尼的前言\n\n作为趣闻爱好者，在我作为软件工程师的求学青春时代，我最喜欢的书之一是 Josh\
    \ Bloch 和 Neal Gafter 的《Java Puzzlers》。我喜欢作者们不只是为了用晦涩的语言冷知识来难倒读者。相反，每个问题都被视为教育读者了解语言不常见方面的历史和深层含义的机会。\n\
    \n当我发现，在 Go 经验中远超我愿意提及的许多年之后，copy 返回已复制元素的数量时，我的第一想法是 wow，我怎么会错过这个。我的第二个想法是我想知道我能用这个骗过多少人。于是，我的\
    \ #golang 流行测验系列推文诞生了。\n\n考虑到推文的长度限制，要将一个完整的 Go 程序装进单条推文是个挑战。推断 #golang 流行测验的正确答案，以及遵循\
    \ Bloch 和 Gafter 的示例来教育而非让读者沮丧的机会，留给读者作为练习。\n\n在《Go 脑筋急转弯》中，Miki 准备了一组测试，其目的不是简单地令人困惑，而是启发读者。《Go\
    \ 脑筋急转弯》为读者提供了解究其原因的机会。\n\nDavid Cheney\n悉尼，2020 年 4 月\n\n## 献词\n\n献给 Sharon，她忍受了我在隔离期间的行为\
    \ - 以及之前 20 年的行为。\n\n## 脑筋急转弯\n\n> 教育不是学习事实，而是训练\n> 头脑思考。\n\n~ 阿尔伯特·爱因斯坦\n\n##\
    \ 1. 一个数字 π\n\n清单 1. pi.go\n\n```go\npackage main\n\nimport (\n \"fmt\"\n)\n\n\
    func main() {\n var pi = 22 / 7.0\n fmt.Println(pi)\n}\n```\n\n在翻到下一页之前，请先猜测输出是什么。\n\
    \n这段代码将打印：3.142857142857143\n\n这里有两个令人惊讶的地方：一个是 π 是有效的标识符，第二是 22 / 7.0 实际上可以编译。\n\
    \n让我们从 π 开始。[2]。Go 语言规范关于标识符的说明：\n\n> 标识符命名程序实体，如变量和类型。标识符是一个或多个字母和数字的序列。标识符的第一个字符必须是字母。\n\
    \n字母可以是 Unicode 字母，包括 π。写起来很有趣，但在实际中会让你的同事生活更困难。我可以使用我正在使用的编辑器 - Vim 轻松输入 π，但大多数编辑器和\
    \ IDE 都需要更多努力。\n\n我发现 Unicode 标识符有帮助的唯一场景是将数学公式转换为代码。除此之外，请使用纯正的老式 ASCII。\n\n\
    现在来看 22 / 7.0。Go 类型系统不允许在整数（22）和浮点数（7.0）之间进行除法（或任何其他数学运算）。但等号右边的是常量，而不是变量。常量的类型在使用时定义，在这个例子中，编译器会将\
