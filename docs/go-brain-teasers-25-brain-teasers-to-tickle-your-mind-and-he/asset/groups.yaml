    \ // 129\n}\n```\n\n当从字节切片转换为字符串时，Go 会复制字节切片 - 这会进行内存分配。在映射中，你不能使用 []byte 作为键，存在一个编译器优化：\n\
    \n清单 32. strint_map.go\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc\
    \ main() {\n\tm := map[string]int{\n\t\t\"hello\": 3,\n\t}\n\tkey := []byte{'h',\
    \ 'e', 'l', 'l', 'o'}\n\tval := m[string(key)] // no memory allocation\n\tfmt.Println(val)\
    \ // 3\n}\n```\n\n### 17.1. 延伸阅读\n\n- strconv 包\n- golang.org/x 中的 runenames\n\
    - 使用[byte 作为映射键]，来自 Dave Cheney 的《高性能 Go 工作坊》\n\n## 18. 一份工作要做\n\n清单 33. job.go\n\
    \n```go\npackage main\n\nimport (\n\t\"fmt\"\n)\n\ntype Job struct {\n\tState\
    \ string\n\tdone chan struct{}\n}\n\nfunc (j *Job) Wait() {\n\t<-j.done\n}\n\n\
    func (j *Job) Done() {\n\tj.State = \"done\"\n\tclose(j.done)\n}\n\nfunc main()\
    \ {\n\tch := make(chan Job)\n\tgo func() {\n\t\tj := <-ch\n\t\tj.Done()\n\t}()\n\
    \n\tjob := Job{\"ready\", make(chan struct{})}\n\tch <- job\n\tjob.Wait()\n\t\
    fmt.Println(job.State)\n}\n```\n\n在进入下一页之前，试着猜猜输出是什么。\n\n这段代码将打印：ready\n\n乍一看，代码似乎没问题。你在\
    \ **工作** 结构体的方法中使用了指针接收器。**等待** 调用返回这一事实表明通道已关闭。\n\n问题出在 **ch** 的定义上。它是 **工作**\
    \ 类型的通道，而不是 **\\*工作**，这意味着当你将变量 **job** 发送过通道时，你实际发送的是它的副本。在 Go 中，通道是一种“指针类”类型，因此即使\
    \ goroutine 内部有一份 **job** 的副本，**j.done** 指向的通道与 **job.done** 指向的通道是同一个。\n\nGo\
    \ 中的字符串不是“指针类”。当你在 goroutine 内部调用 **j.Done()** 时，你会修改 goroutine 中 **job** 副本的\
    \ **状态** 字段的值。此更改不会反映在第 28 行声明的 **job** 变量中。\n\n解决方法是将 ch 的类型设为 **\\*工作**\n\n\
    清单 34. job_ptr.go\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\n)\n\ntype Job\
    \ struct {\n\tState string\n\tdone chan struct{}\n}\n\nfunc (j *Job) Wait() {\n\
    \t<-j.done\n}\n\nfunc (j *Job) Done() {\n\tj.State = \"done\"\n\tclose(j.done)\n\
    }\n\nfunc main() {\n\tch := make(chan *Job)\n\tgo func() {\n\t\tj := <-ch\n\t\t\
    j.Done()\n\t}()\n\n\tjob := Job{\"ready\", make(chan struct{})}\n\tch <- &job\n\
    \tjob.Wait()\n\tfmt.Println(job.State)\n}\n```\n\n### 18.1. 延伸阅读\n\n- Go 中不存在按引用传递\n\
    - Go 规范中的通道类型\n- Go 并发模式：管道和取消\n- Go 之旅中的通道\n\n## 19. 报错与否\n\n清单 35. error.go\n\
    \n```go\npackage main\n\nimport (\n\t\"fmt\"\n)\n\ntype OSError int\n\nfunc (e\
    \ *OSError) Error() string {\n\treturn fmt.Sprintf(\"error #%d\", *e)\n}\n\nfunc\
    \ FileExists(path string) (bool, error) {\n\tvar err *OSError\n\treturn false,\
    \ err // TODO\n}\n\nfunc main() {\n\tif _, err := FileExists(\"/no/such/file\"\
    ); err != nil {\n\t\tfmt.Printf(\"error: %s\\n\", err)\n\t} else {\n\t\tfmt.Println(\"\
    OK\")\n\t}\n}\n```\n\n在进入下一页之前，试着猜猜输出是什么。\n\n这段代码将打印：error: <nil>\n\n第 19 行的 if\
    \ 语句表示 err != nil，但 err 打印出来却是 <nil>。此外，第 14 行的 err 未初始化，这意味着它的值为指针的零值——即 nil。\n\
    \n如果你查看 src/runtime/runtime2.go，会看到以下定义：\n\n```go\ntype iface struct {\n    tab\
    \    *itab\n    data   unsafe.Pointer\n}\n```\n\n- itab 描述接口\n- data 是指向实现该接口的值的指针\n\
    \n仅当 itab 和 data 都为 nil 时，接口才被视为 nil，而此处并非这种情况。\n\n解决方法是**始终**在返回错误时使用 error 类型的变量。\n\
