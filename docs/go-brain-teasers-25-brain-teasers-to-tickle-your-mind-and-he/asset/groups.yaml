    \ nil map 而不会 panic。\n\nlen 和访问值（例如 m[\"errors\"]）在 nil map 上都可以工作。len 返回 0，而按键访问值将做以下操作：\n\
    \n- 如果键在 map 中，返回与之关联的值\n- 如果键不在 map 中，返回值类型的零值\n\n在这个例子中，键 \"errors\" 在 map 中未找到，你将得到\
