    \nimport (\n\t\"fmt\"\n)\n\nfunc main() {\n\tvar m map[string]int\n\tfmt.Println(m[\"\
    errors\"])\n}\n```\n\n> Try to guess what the output is before moving to the next\
    \ page."
  - '[PAGE 17]


    The zero value for an uninitialized map is nil. Some operations on Go’s map type
    are "nil safe" - meaning they will work with a nil map without panicking.


    Both len and accessing a value (e.g m["errors"]) will work on a nil map. len returns
    0 and accessing a value by a key will do the following:


    +   - If the key is in the map, return the value associated with it

    +   - If the key is not in the map, return the zero value for the value type


    In this example, the key "errors" is not found in the map and you’ll get back
    the zero value for int, which is 0.


    This behavior is handy. If you want to count items (say word frequency in a document),
    you can do m[word]++ without worrying if word is in the map m or not.


    This leads to the question: How can you know if a value you got from a map is
    because it’s there or because it’s the zero value for the value type? The answer
    is to use the comma, ok paradigm.


    When you type val, ok := m[key]. ok will be true if we got the value from the
    map and false if key is not in the map.'
