- pgno: 36
  md: 'This code will print: 1.2100000000000002


    You might have expected 1.21 which is the right mathematical answer.


    Some new developers, when seeing this or similar output, comes to the message
    boards and say "We found a bug in Go!". The usual answer is RTFM.[5].


    > Floating point is sort of like quantum physics: the closer you look, the messier
    it gets.

    > ~ Grant Edwards


    The basic idea behind this issue, is that in floating points we sacrifice accuracy
    for speed (i.e. cheat). Don’t be shocked, it’s a trade-off we do a lot in computer
    science.


    The result you see conforms with the floating point specification. If you’ll run
    the same code in Python, Java, C ... you will see the same output.


    See the links below if you’re interested in understanding more about how floating
    points work. The main point you need to remember is that they are not accurate,
    and accuracy worsens as the number gets bigger.


    One implication is that when testing with floating points, you need to check for
    "roughly equal" and decide what is an acceptable threshold. Testing libraries
    such as testify have ready-made functions (such as InDelta) to check that two
    floating numbers are approximately equal.'
