  md: 'Go serializes a `time.Time` to JSON, it doesn''t include the monotonic clock
    in the output. When we read back the time to t2, it doesn''t contain the monotonic
    reading and the comparison fails.


    The solution to the problem is written in time.Time''s documentation


    *In general, prefer t.Equal(u) to t == u, since t.Equal uses the most accurate
    comparison available and correctly handles the case when only one of its arguments
