  md: 'This code will print: 2 2 2


    You probably expected 1 2 3. Each goroutine sleeps n milliseconds and then prints
    n. wg.Wait() will wait until all goroutines are done and then the program will
    print a newline.


    However, the n that each goroutine uses is the same n defined in line 11. This
    is known as a closure.[6]


    This is the reason that by design goroutines (and deferred) are written as function
    invocation with parameters.


    You have two options to solve this bug. The first, and my preference, is to pass
    n as a parameter to the goroutine.


