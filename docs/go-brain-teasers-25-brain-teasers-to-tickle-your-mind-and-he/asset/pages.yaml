  md: '# # WHY GO BRAIN TEASERS?


    The Go programming language is a simple one, but like all other languages it has
    its quirks. This book uses these quirks as a teaching opportunity. By understanding
    the gaps in your knowledge - you’ll become better at what you do.


    There’s a lot of research showing that people who make mistakes during the learning
    process learn better than people who don’t. If you use this approach at work when
    fixing bugs - you’ll find you enjoy bug hunting more and become a better developer
    after each bug you fix.


    These teasers will help you avoid mistakes. Some of the teasers are from my own
    experience shipping bugs to production, and some from others doing the same.


    Teasers are fun! We geeks love puzzles and solving them. You can also use these
    teasers to impress your co-workers, have knowledge competitions and become better
    together.


    Many of these brain teasers are from quizzes I gave at conferences and meetups.
    I’ve found out that people highly enjoy them and they tend to liven the room.'
