  md: 'This code will print: 1 3 4


    Go’s short variable declaration (: =) can be used in a "multi values" context
    - where there is more than one variable on the left side.


    If all variables on the left are new - you’re good.


    ```

    a, b := 1, 2

    ```


    If you have no new variables, you’ll get a compilation error.


    ```

    a, b := 1, 2

    a, b := 2, 3 // error: no new variables on left side of :=

    ```


    When there’s a mix, like in this teaser - you’re still good as long as the types
    match. In this case, when you do:


    ```

    b, c := 3, 4

    ```


    b is an existing variable, and the type of 3 which is int matches the current
    type of b - OK here. c is a new variable, making this statement OK.'
