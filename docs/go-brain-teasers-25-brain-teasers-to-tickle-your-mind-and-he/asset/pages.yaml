- pgno: 52
  md: "Slice notation (e.g. s1[3:7]) is \"half-open\".[7], meaning from the first\
    \ index up to, but not including the last index. In s2 case you'll get indices\
    \ 3, 4, 5 & 6. Which means the length (len) is 4.\n\nThe capacity is how many\
    \ items there are from the start of the slice to the end of the underlying array.\
    \ In s2 we start at 3 and can go up to 10, meaning the capacity is 7.\n\nYou can\
    \ check length and capacity with the built-in len and cap functions. len(s2) is\
    \ 4 and cap(s2) is 7.\n\nThe next piece you might be missing is how append works.\
    \ When you call append it will check the capacity, if there is enough space append\
    \ will change the underlying array with the appended item and return a slice pointing\
    \ to the same array with bigger length. If there's no more space in the underlying\
    \ array, append will create a new and bigger array, copy over the old array, update\
    \ the new array with the new item and return a slice pointing to the new array.\n\
    \nHere's a possible implementation of append\n\n```\nfunc Append(items []int,\
    \ i int) []int {\n\tif len(items) == cap(items) { // No more space in\nunderlying\
    \ array\n\t\t// Go has a better growth heuristic than adding 1\nevery append\n\
    \t\tnewItems := make([]int, len(items)+1)\n\t\tcopy(newItems, items)\n\t\titems\
    \ = newItems\n\t} else {\n\t\titems = items[:len(items)+1]\n```"
