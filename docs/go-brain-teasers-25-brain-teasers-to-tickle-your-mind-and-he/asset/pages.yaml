  md: "This code will print: 891239 [11]\n\nWhat you have here is a race condition.\
    \ The operation to increment an integer is not atomic, meaning the code can get\
    \ interrupted mid-operation. On top of that there is the memory barrier - to speed\
    \ things up, modern computers have a CPU cache where they try to fetch values\
    \ from before going the long way to main memory.\n\nIf you look at the assembly\
    \ output of count.go.[12] you'll see the code generated for count++ on line 16.\n\
    \n```\n0x0045 00069 (count.go:16)    PCDATA  $0, $1\n0x0045 00069 (count.go:16)\
    \    PCDATA  $1, $4\n0x0045 00069 (count.go:16)    MOVQ    \"\".&count+56(SP),\
    \ AX\n0x004a 00074 (count.go:16)    PCDATA  $0, $0\n0x004a 00074 (count.go:16)\
    \    INCQ    (AX)\n```\n\nMOVQ will fetch the current value of the counter to\
    \ the AX register. This might come from the memory or from the cache.\n\nThe Go\
    \ toolchain can help you detect such race conditions. Both go run and go test\
    \ have a -race flag to detect race conditions. You can try it out:\n\n```\n$ go\
    \ run -race count.go\n===================================\nWARNING: DATA RACE\n\
    Read at 0x00c00011a010 by goroutine 8:\n  main.main.func1()\n      /home/miki/Projects/go-brain-teasers/code/count.go:16\
    \ +0x6c\n```"
