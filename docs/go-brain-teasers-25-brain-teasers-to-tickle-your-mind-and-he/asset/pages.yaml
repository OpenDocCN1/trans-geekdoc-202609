  md: '```

    This code will print: A B

    ```


    Normally, the Go compiler will not let you define two functions with the same
    name in the same package. However init is special. Here''s what the documentation
    says:


    > Multiple such functions may be defined per package, even within a single source
    file. In the package block, the init identifier can be used only to declare init
    functions, yet the identifier itself is not declared. Thus init functions cannot
    be referred to from anywhere in a program.


    init is the final stage in package initialization after imported modules are initialized
    and package-level variables are initialized.


    Since you can initialize package-level variables with function calls, save init
    for special cases. Also try to avoid package level variables as much as you can.
    I seldom write init functions and prefer to do initialization in main where I
    have better control on order of initialization, error handling and logging.


    One of the problems with package-level variables or init is that you can’t return
    error values. If you have an error in init, the best course of action is to panic
    and not to continue execution in a bad state. To support that, some of'
