    \ created at:\nmain.main()\n/home/miki/Projects/go-brain-teasers/code/count.go:14\
    \ +0xe4\n\nGoroutine 7 (finished) created at:\nmain.main()\n/home/miki/Projects/go-brain-teasers/code/count.go:14\
    \ +0xe4\n=====================================\n```\n\nTo solve this problem you\
    \ can use a sync/Mutex to ensure only one goroutine updates count at time.\n\n\
    # Listing 40. count_mu.go\n\n```\npackage main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\
    \n)\n\nfunc main() {\n\tvar count int\n\tvar wg sync.WaitGroup\n\tvar m sync.Mutex\n\
    \n\tfor i := 0; i < 1_000_000; i++ {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tm.Lock()\n\
    \t\t\tdefer m.Unlock()\n\t\t\tdefer wg.Done()\n\t\t\tcount++\n\t\t}()\n\t}\n}\n\
    ```"
