  md: "*iota* is Go's version of an enumerated type. It can be used inside a *const*\
    \ declaration. *iota* grows by one for each constant in the same group. If you\
    \ specify an operation on *iota* (e.g. addition), it'll carry on.\n\n`<<` is the\
    \ left shift operator, it'll move the bits in a number n places to the left.\n\
    \n+   - 1 in binary (8 bit) is 00000001\n+   - 1<<<3 is 00001000, which is 8\n\
    \nIn our case, we start with *Read* = 1<<*iota* which translates to 1<<0 -> 0001,\
    \ which is 1. Then there's an implicit 1<<1 -> 0010 for *Write* which is 2 and\
    \ finally an implicit 1<<2 -> 0100 for *Execute* which is 4.\n\nYou'll mostly\
    \ use these bit operations for flags. You can pack 8 flags in one byte using |\
