- pgno: 12
  md: 'This code will print: 3.142857142857143


    There are two surprising things here: one is that π is a valid identifier and
    the second is that 22 / 7.0 actually compiles.


    Let’s start with π.[2]. The Go language specification on identifiers says:


    > Identifiers name program entities such as variables and types. An identifier
    is a sequence of one or more letters and digits. The first character in an identifier
    must be a letter.


    Letters can be Unicode letters, including π. This can be fun to write, but in
    practice it’ll make your coworkers’ life harder. I can easily type π using the
    editor I’m using - Vim, however most editors and IDE’s will require more effort.


    The only place I’ve found out that Unicode identifiers are helpful, is when translating
    mathematical formulas to code. Apart from that, stick to plain old ASCII.


    Now to 22 / 7.0. The Go type system will not allow dividing (or any other mathematical
    operation) between an integer (22) and a float (7.0). But what you have on the
    right side of the = are constants, not variables. The type of a constant is defined
    when it is being used, in this example, the compiler will convert 22 to a float
    to complete the operation.'
  merge: -1
  img_proc: true
