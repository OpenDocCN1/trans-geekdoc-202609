  md: 'This code will print: uint8 int32 footnote:[The %T verb prints the type of


    the parameter.]


    Go strings are UTF-8 encoded. When you access a string with [] or with len, Go
    will access the underlying []byte. byte is a type in Go that''s aliased to uint8.


    When you iterate over a string in Go, you will get the Unicode character - called
    rune which is an alias to int32. This is due to the fact the characters in UTF-8
    can be up to 4 bytes.


    If you print a rune using the %v verb, you''ll see the numeric value. Use the
    %c verb to display the character. If you see ? or other characters instead of
    the rune you''re trying to print, it means the current font does not support it.
    There''s no single font that can display all fonts in the Unicode specification.


    There are several ways to write rune literal, let''s have a look:'
