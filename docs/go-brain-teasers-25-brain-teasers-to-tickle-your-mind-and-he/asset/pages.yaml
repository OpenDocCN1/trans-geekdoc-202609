  md: 'This code will print: a\tb


    The Go spec says:


    There are two forms: raw string literals and interpreted string literals.


    Raw strings are enclosed in backticks (e.g. `hello`), interpreted strings are
    enclosed in quotes (e.g. "hello"). In raw strings, \ has no special meaning, so
    the `\t` is two characters - backslash and the letter t. If it was an interpreted
    string, then \t would be interpreted as the tab character.


    Apart from the usual \t (tab), \n (newline) and friends, you can also use Unicode
    code points in interpreted strings. fmt.Println("\u2122") will print ™.


    One of the most common uses for raw strings is to create multi-line strings.


    ```

    // An HTTP request

    request := `GET / HTTP/1.1

    Host: www.353solutions.com

    Connection: Close

    `

