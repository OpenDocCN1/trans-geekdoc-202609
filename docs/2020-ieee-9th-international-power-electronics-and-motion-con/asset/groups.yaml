    To establish thermal resistance model, the heat transfer is analyzed by calculating
    the power loss of the main heating device when the variable frequency supply is
    working, including the loss of IGBT integrated module, large-capacity capacitor.
    The power loss of the IGBT can be calculated by (2).


    ```

    $P_{IGBT} = P_{IGBT\_cond} + P_{cond\_IG} + P_{cond\_die} \quad (2)$

    ```


    ```

    $P_{cond\_IG} = 0.5 \times(\frac{V_{on}^2}{R_{dj}} + V_{on} \cdot R_{dj} + m\cos\alpha)\frac{R_{dj}^2}{\pi}\frac{\pi}{8}
    \quad (3)$

    ```


    ```

    $P_{sw} = (E_{on} + E_{off})f_{sw} \quad (4)$

    ```


    ```

    $P_{cond\_die} = 0.5 \times(\frac{I_{dk}^2}{R_{dk}} + I_{dk} \cdot R_{dk} - m\cos\alpha)\frac{R_{dk}^2}{\pi}\frac{\pi}{8}
    \quad (5)$

    ```


    ```

    $P_{rec\_die} = \frac{E_{rec} \cdot f_{sw}}{\pi \times I_{nom} \cdot V_{nom}}
    \quad (6)$

    ```


    Fig. 4. The global temperature field of the inverter


    # B. Data Acquisition and Preprocessing


    - Features Selection: The IGBT junction temperature in state is mainly maintained
    by line voltage, phase current, switching frequency and ambient temperature, so
    they are selected as attributes of samples. The range of line voltage is 100-400V,
    the switching frequency is 1-10kHz, and the ambient temperature is 25-50 degrees
    Celsius.

    - Data Cleaning: The cleaning of anomalous samples depends on. When it is found
    the sample may be wrong, simulation run again.

    - Data Preprocessing: Normalize these four features. PCA is used to analyze contribution
    ratio of each characteristic. The result contribution ratio of line voltage is
    small (about 0.067), and phase current is large, so we delete line voltage. Using
    mean square error to evaluate performance before and decision, the validity of
    PCA for features is confirmed. Secondly, stratified sampling method is adopted
    to process the data from phase current, 200 groups of data where the product of
    line voltage and phase current is less than 2000 Watts. 200 groups of samples
    are collected and split into training and test set in 8:2 ratio. The training
    set needs to be preprocessed and used for training. The test set is used for prediction
    of performance of models. Distribution of the data is shown in Fig. 5. It can
    be found that the raw data is good for learning the real law in the data.


    ![](img/aab8a93a6c87f1ebc72883c9d4586963_2_0.png)


