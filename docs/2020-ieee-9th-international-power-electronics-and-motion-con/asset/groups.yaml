    # 基于机器学习方法的 IGBT 结节温度估计


    苗洁, 尹勤, 王浩, 刘阳, 李海春

    华中科技大学 智能科学与自动化学院

    中国，武汉

    miaojijiao@hust.edu.cn, yuanqin@163.com, wanghaos@hust.edu.cn, yangliu@hust.edu.cn,
    lihai@163.com

    段三鼎

    华荣驱动技术有限公司

    中国，武汉

    dnduansanding@hiconics.com


    **摘要—** 可靠性下降近 55% 是由结温升高引起的。IGBT 结温估计是一个需要最小化的关键因素。在本文中构建了包括支持向量回归（SVR）、森林和贝叶斯神经网络（BPN）在内的多种机器学习模型。仿真结果证实并证明了该方法可用，并具有良好的工业应用前景。


    *关键词—IGBT 结节温度估计，机器学习，性能评估*


    # I. 引言


    在功率器件制造技术中，能量转换与传输器件的器件成本以及 IGBT 的优化一直是双方的研究重点。在结温估计领域，基于电路或传感器的传统方法易受环境影响。机器学习的目的是通过数据驱动的方法提高其性能，实现工程自动化并推理现有的知识系统。


    在许多功率变流器设计中，工程师经常利用有限元法（FEM）来估计 IGBT 结温。建立机器学习模型的方法与有限元法（FEM）不同。该方法主要基于物理模型，而机器学习是基于我们提出的场景中的数据。当使用机器学习模型时，不需要在器件中建立复杂的数学模型并定义结构参数。机器学习将数据转化为模型，因此具有计算速度快、精度高以及自适应和自学习的能力。在大数据情况下，机器学习学习模型在动态特性和准确性方面比仅使用
    FEM 方法更具优势。


    基于 ISODATA 的多分类学习模型 [1] 针对 IGBT 动作多个特征参数的内部相关性比使用单一参数的方法具有更好的分类性能。在 [2] 中，提出了一种基于
    BPN 和森林的虚拟传感（VS）方法用于 IGBT 电流估计。


    机器学习方法分为三步：第一步是特征提取主成分分析（PCA），最后一步是使用交叉验证（CV）方法进行评估 [3]。PCA 也应用于 Park 矢量以解决 q-d
    空间的不确定性 [4]，且第一主成分与故障相关。


    电力电子系统中使用了许多非线性学习算法，如 [4]–6]。在 RF 中用于将数据分类到输入阶段以发生在哪一阶段。在 [5] 中，使用基于 SVM 的方法预测锂电池的健康状况。在
    [6] 中，采用 BPN 方法检测异常模式识别系统以识别缺陷传感器，以确定结中的缺陷类型。


    本文的其余部分如下：第二部分描述了仿真模型的建立和三种机器学习算法。第三部分详细分析了仿真结果。最后部分是结论和未来工作。


    # II. 估计准备


    IGBT 结温估计的过程如图 1 所示。在 ANSYS Icepak 上建立了逆变器的热仿真模型。对整个区域的温度场执行了热仿真分析。


    此工作由广东省重点研发计划资助（资助号：2019B0011027007）。


    根据上述分析，IGBT 模块的温度由功率损、热阻和环境温度决定。功率损可以简单地计算，但热阻的分析非常困难。因此，本文使用 ANSYS 分析传递模式。根据逆变器的物理结构和数据参数构建了
    3D 热模型，如图 3 所示。根据逆变器的实际运行环境，在模型上进行了流固耦合仿真。仿真结果如图 4 所示。


    ![](img/aab8a93a6c87f1ebc72883c9d4586963_1_0.png)


    图 1. IGBT 结估计过程


    # A. ANSYS Ipecak 仿真


    温度 $T_j$ 由公式 (1) 给出，功率半导体器件的热阻如图 2 所示。


    ```

    $T_j = P(R_{th,j} + R_{th,hs} + R_{hs-a}) + T_a \quad (1)$

    ```


    ![](img/aab8a93a6c87f1ebc72883c9d4586963_1_1.png)


    模块功率损


    ![](img/aab8a93a6c87f1ebc72883c9d4586963_1_2.png)


    图 3. 逆变器的 3D 热模型


    ![](img/aab8a93a6c87f1ebc72883c9d4586963_1_3.png)


    图 2. 瞬态热模型


    为了建立热模型，根据逆变器的实际运行环境，在模型上进行了流固耦合仿真。仿真结果如图 4 所示。功率损可以简单计算：


    ```

    $T_j = P(R_{th,j} + R_{th,hs} + R_{hs-a}) + T_a \quad (1)$

    ```


    ```

    $T_j = P(R_{th,j} + R_{th,hs} + R_{hs-a}) + T_a \quad (2)$

    ```


    ```

    $T_j = P(R_{th,j} + R_{th,hs} + R_{hs-a}) + T_a \quad (3)$

    ```


    ```

    $T_j = P(R_{th,j} + R_{th,hs} + R_{hs-a}) + T_a \quad (4)$

    ```


    ```

    $T_j = P(R_{th,j} + R_{th,hs} + R_{hs-a}) + T_a \quad (5)$

    ```


    ```

    $T_j = P(R_{th,j} + R_{th,hs} + R_{hs-a}) + T_a \quad (6)$

