    # II. PREPARATION FOR ESTIMATION


    The process of IGBT junction temperature estimation is shown in Fig. 1. The thermal
    simulation model of the inverter is established on ANSYS Icepak. The thermal simulation
    analysis is carried out on the whole temperature of the field.


    This work was supported by the Key Area R&D Project of Guangdong (Grant No.2019B0011027007).


    From the above analysis, the temperature of the IGBT module is determined by power
    loss, thermal resistance and ambient temperature. The power loss can be calculated
    simply, but the analysis of thermal resistance is very cumbersome. Therefore,
    this paper uses ANSYS to analyze the transfer mode. The 3D thermal model is constructed
    based on the physical structure and data parameters of the inverter, as in Fig.
    3. According to actual operating environment of the inverter, the fluid-solid
    coupling simulation is carried out on the model. The simulation results are shown
    in Fig. 4.


    ![](img/aab8a93a6c87f1ebc72883c9d4586963_1_0.png)


    Fig. 1. The process of IGBT junction estimation


    # A. ANSYS Ipecak Simulation


    The temperature $T_j$ is given by (1) and the thermal resistance of power semiconductor
