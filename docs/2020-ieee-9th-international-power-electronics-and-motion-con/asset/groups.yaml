    # C. BPNN-based models


    The BPNN architecture is shown in Fig. 7. Peak value of phase current, switching
    and ambient temperature are chosen as the input of the BPNN model. The output
    of the model is IGBT number. The number of hidden layer and output layer is 4
    and 1, respectively.


    # III. MODEL BUILDING AND SIMULATION


    # A. SVR-based Model


    SVR is based on the support vector machine. In the higher dimensional space original
    sample is used, the insensitive function is used to generate relaxation relation
    of the classification to obtain a segment. The SVR can be expressed as:


    $$\min_{w,b,\xi} \|w||^2 + C \sum_{i=1}^{n} \max(0, \xi_i)$$


