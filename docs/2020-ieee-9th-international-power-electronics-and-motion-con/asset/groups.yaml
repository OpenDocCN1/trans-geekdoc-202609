    - SVR 预测值


    ![](img/aab8a93a6c87f1ebc72883c9d4586963_3_0.png)


    图 8. 估计结果


    可以发现，SVR 和 BP 模型均优于 RF 模型。SVR 的 MAPE 和 MAE 值略小于 BPNN，而其 MSE 和 RMSE 则较大。


    结果表明，基于 SVR 或 BPNN 算法的提出的模型适用于 IGBT 结温预测的工业应用。


    ## IV. 结论与未来工作


    温度循环是导致 IGBT 设备疲劳和失效的主要原因，因此有必要保证热设计和设备的优化使用，延长设备寿命并提高可靠性。本研究揭示了 SVR、RF 和 BPNN
    算法对 lecap 仿真模型中 IGBT 结温的影响以及上述模型的通用性能。本文获得的结果显示，SVR 和 BP 模型性能优于 RF，SVR 的大多数估计值比
    BP 模型更接近真值，但存在几点显著差异；前者优于后者，但稳定性不如后者。通过仿真，SVR 和 BP 模型可用于研究模块运行期间结温的变化。


    未来的工作将开展进一步研究，通过实验评估这些模型的可性。此外，进一步的研究将提高这些模型的准确性并获得更好的估计结果。物理实验将在后续论文中给出。


