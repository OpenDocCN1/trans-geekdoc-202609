  md: '# IGBT Junction Temperature Estimation Based on Machine Learning Method


    Ji Miao, Qian Yin, Hao Wang, Yang Liu, Haichun Li

    School of Artificial Intelligence and Automation

    Huazhong University of Science and Technology

