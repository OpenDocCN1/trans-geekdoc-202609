    dnduansanding@hiconics.com


    **Abstract—** nearly 55% of the decrease of reliability is caused by the increase
    of junction temperature. IGBT junction temperature estimation is a vital factor
    to minimize. In this paper, multiple machine learning-based models including Support
    Vector Regression (SVR), Forest and Bayesian Neural Network (BPN) are constructed
    to estimate the junction temperature under different parameters. The simulation
    results confirm and prove that this method can be used and have a good prospect
    of industrial application.


    *Keywords—IGBT junction temperature estimation, machine learning, performance
    evaluation*


    # I. INTRODUCTION


    In the manufacturing technology of power devices, the device cost of energy transformation
    and transmission, the optimization of IGBT has always been the research focus
    at both. In the field of junction temperature estimation, conventional methods
    based on circuit or sensor are easy to be affected by the environment. The purpose
    of machine learning is to improve its performance with data-driven approach, automating
    engineering and reasoning the existing knowledge system.


    In many power converter designs, the engineers often utilize the FEM method to
    estimate IGBT junction temperature. The method of establishing a machine learning
    model is different from the Finite Element Method (FEM). The method is mainly
    based on physical model while the machine learning is based on the data from the
    scenario we present. There is no need to build complex mathematical models and
    define structural parameters in the device when we use machine learning model.
    Machine learning turns the data into a model, so it has fast speed calculation,
    high accuracy and the ability of self-adaptation and self-learning. In the case
    of large data, the


    model by machine learning has more advantages in dynamic characteristics and accuracy
    just using the FEM method.


    The Multi-class learning model based on ISODATA the internal correlation of multiple
    characteristic parameters in the act of IGBT in [1] has better classification
    performance to the method using a single parameter. In [2], a BPN and Forest virtual
    sensing (VS) method is proposed for IGBT current estimation.


    Machine learning methods are divided into three steps, the first step is feature
    extraction Principal Component Analysis (PCA), the last step is evaluation using
    Cross-Validation (CV) method. [3]. PCA is also applied to Park''s Vector to solve
    the uncertainty in the q-d space [4] and the first principal component is associated
    to the fault.


    Many nonlinear learning algorithms are used in power electric system, as [4]–6].
    In the RF is used to classify the data into that input phase to which phase occurs.
    In [5], a method based on SVM is used to predict the health of Li-ion batteries.
    In [6], the BPN method is adopted to detect the anomaly pattern recognition system
    to identify defect sensors to determine the type of defect in junction.


    The remainder of the paper is as follows: II describes the building of simulation
    model and three machine learning algorithms. Section III, the simulation results
    are analyzed in detail. In the last section, conclusions and future work


    # II. PREPARATION FOR ESTIMATION


    The process of IGBT junction temperature estimation is shown in Fig. 1. The thermal
    simulation model of the inverter is established on ANSYS Icepak. The thermal simulation
    analysis is carried out on the whole temperature of the field.


