    To establish thermal resistance model, the heat transfer is analyzed by calculating
    the power loss of the main heating device when the variable frequency supply is
    working, including the loss of the IGBT integrated module, large-capacity electrolytic
    capacitor. The power loss of the IGBT can be calculated by (2).


    ```

    $P_{IGBT} = P_{IGBT\_cond} + P_{cond\_IG} + P_{cond\_die} \quad (2)$

    ```


    ```

    $P_{cond\_IG} = 0.5 \times(\frac{V_{on}^2}{R_{dj}} + V_{on} \cdot R_{dj} + mcos\alpha)\frac{R_{dj}^2}{\pi}\frac{\pi}{8}
    \quad (3)$

    ```


    ```

    $P_{sw} = (E_{on} + E_{off})f_{sw} \quad (4)$

    ```


    ```

    $P_{cond\_die} = 0.5 \times(\frac{I_{dk}^2}{R_{dk}} + I_{dk} \cdot R_{dk} - mcos\alpha)\frac{R_{dk}^2}{\pi}\frac{\pi}{8}
    \quad (5)$

    ```


    ```

    $P_{rec\_die} = \frac{E_{rec} \cdot f_{sw}V_{dc}}{\pi \times I_{nom} \cdot V_{nom}}
    \quad (6)$

    ```


