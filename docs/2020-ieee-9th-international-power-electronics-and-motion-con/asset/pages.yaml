    # B. Data Acquisition and Preprocessing


    +   1) Features Selection: The IGBT junction temperature in state is mainly maintained
    by line voltage, phase current, switching frequency and ambient temperature, so
    they are selected as feature attributes of samples. The range of line voltage
    is 100-400V, the switching frequency is 1-10kHz, and the ambient temperature is
    25-50 degrees Celsius.


    +   2) Data Cleaning: The cleaning of anomalous samples depends on handling. When
    it is found the sample run may be wrong, the simulation run is run again to.


    +   3) Data Preprocessing: Normalize, these four features. PCA is used to analyze
    contribution ratio of each characteristic. The result variance contribution ratio
    of line voltage is small (about 0.067), and phase current is large, so we delete
    line voltage feature.

    Using mean square error to evaluate performance before and after decision, the
    validity of PCA for features is confirmed. Secondly, stratified sampling method
    is adopted to process the data from phase current, 20 groups of'
