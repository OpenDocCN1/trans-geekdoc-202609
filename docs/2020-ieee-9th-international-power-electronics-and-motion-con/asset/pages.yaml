    # D. Simulation Results and Performance Evaluation


    In the training phase, 10-fold cross validation is used to train the three models.
    The prediction results and error of the three different algorithms are shown in
    Fig.6 and Fig.7, respectively.


    +   * True Value

    * BPNN Predictive Value

    * RF Predictive Value

    * SVR Predictive Value


    ![](img/aab8a93a6c87f1ebc72883c9d4586963_3_0.png)


    Fig. 8. The result of estimation


    It can be found that every of SVR and BP models is better than that of RF. The
    MAPE and MAE values of SVR are slightly smaller than that of BPNN, while the MSE
    and RMSE are larger.


    The results show that the proposed model based on SVR or BPNN algorithm is suitable
    for industrial applications of IGBT junction prediction.


    # IV. CONCLUSION AND FUTURE WORK


    Temperature cycling is a main reason which leads to fatigue and failure of IGBT
    device, so it is necessary to guarantee thermal design and optimal use of the
    device, extend device life and improve reliability. This research reveals effect
    of SVR, RF and BPNN algorithm on IGBT junction of lecap simulation model and the
    general performance of above models. The results obtained from the presented show
    that SVR and BP models perform well than RF, most of estimation values of SVR
    are closer to the true value than BP model, but there are a few points greatly
    different; the former has better than the latter, but stability is less than the
    latter. After simulation, SVR and BP models can be used to study the change of
    junction temperature during module operation


    Future works are to undertake further research to assess the feasibility of these
    models through experiments. Besides, further research will be to undertake the
    accuracy of these models and get better estimation results. Physical experiments
    will be given in subsequent papers.


