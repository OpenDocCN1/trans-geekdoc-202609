- pgno: 247
  md: 'The pipeline has been divided into three stages:


    +   - REVIEW APPS

    +   - STAGING

    +   - PRODUCTION


    # REVIEW APPS


    This creates review apps for open pull requests. Each review apps has a unique
    URL that can be shared for testing purposes. For standardizing it, you can set
    the pattern of the review app’s URL.


    When there is an open pull request, it gets created automatically for review purposes,
    and after the pull request is merged, the review apps gets deleted. It means that
    the app is no longer accessible.


    Note: You should enable both Heroku Pipelines and GitHub integration for the Heroku
    app to use review apps.


    Under REVIEW APPS, hit the Enable Review Apps button.


    After that, in the pop-up window, select the checkboxes for the following:


    +   - Create new review apps for new pull requests automatically: When enabled,
    every new pull request opened will create a review app automatically, and the
    pull request that is closed will delete that Review app.

    +   - Destroy stale review apps automatically: You get the dropdown option for
    the lifespan of the app, like After 1 day, 2 days, 5 days, or 30 days. The default
    value is 5 days.


    Click on Enable Review Apps.


    # STAGING


    Staging apps can be used to preview code changes and features before being deployed
    to production, which is known as the pre-production stage. Directly deploying
    it to the production environment by skipping staging deployment is not recommended.
    It may happen that an app that is working on your local machine may not work on
    Heroku (cloud). You might spend a lot of time finding and fixing an issue and
    lose face in front of customers. Once you verify an app that is working properly
    in the staging environment, you should push it to the production environment by
    using the Promote to production button.


    Under STAGING, add the staging app.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# # PRODUCTION


    Production apps run your customer-facing code. It is recommended to promote your
    code from a staging app only after it has been tested.


    Under **PRODUCTION**, you should create a new app for production.


    # # Heroku Pipeline flow


    When someone pushes the changes to a branch (other than the master branch), then
    on the GitHub repository, hit the **Compare & pull request** button and click
    on the **Create pull request** button. You should see a new app getting built
    (under **REVIEW APPS**) upon pull request on GitHub. Once the app is ready, you
    can see that the review app is up and running.


    If everything goes well, the lead developer can go back to GitHub and merge the
    pull request to the master branch of the GitHub repository. Within a few seconds,
    the staging app should start building. Once it is deployed, you can open it and
    verify the staging app. However, if you push the changes directly to the master
    branch, the staging app will start building, and it will bypass the **REVIEW APPS**
    stage.


    You can pass the staging app to the tester or QA team and if everything goes well,
    one can finally push it to **PRODUCTION**.


    When you hit the **Promote to production** button on Heroku, your production app
    will be live.


    The following figure shows the workflow of the automated Heroku pipeline when
    integrated with the GitHub repository on Heroku.


    ![](img/cc4299656808e62a294f1843a1e18e72_248_0.png)


    Figure 10.3: Heroku-automated pipeline'
