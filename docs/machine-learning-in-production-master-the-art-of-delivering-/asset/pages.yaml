  md: '# tox.ini


    This is the tox configuration file. Tox automates and standardizes the testing
    in Python. It is a virtualenv management and test command-line tool to check if
    your package is compatible with different Python versions. Tox will first create
    a virtual environment based on the configuration provided, install dependencies
    and finally execute the commands provided in the configuration.


    **tox-gh-actions** is a plugin that enables tox to run on GitHub Actions. Hence,
    you need to install **tox-gh-actions** in the GitHub Actions workflow before running
    the tox command.


    This file aims to check the functioning of the package against Python-3.7. It
    will install the required dependencies and run the pytest command.


    ```

    1. [tox]

    2. envlist = py37

    3. skipsdist=True

    4.

    5. [gh-actions]

    6. python =

    7.     3.7: py37

    8.

    9. [testenv]

    10. install_command = pip install {opts} {packages}

    11. deps =

    12.    -r requirements.txt

    13.

    14. setenv =

    15.    PYTHONPATH=src/

    16.

    17. commands=

    18.    pip install requests

    19.    pytest -v test.py

    20.    pytest -v src/tests/

    ```


    # workflow.yml'
