    # AWS CodeBuild


    A CodeBuild is a fully managed Continuous Integration (CI) service backed by AWS
    infrastructure that allows developers to automate the build, test, and deploy
    containers or packages quickly. It works on an on-demand or pay-as-you-go model,
    that is, it charges users based on the minute for the compute resources they have
    used.


    The CodeBuild config file type is YAML. This file contains a series of phases
    and commands to execute the build specified by the developer.


    *buildspec.yaml*


    In this case, the buildspec.yaml file first installs the tox package in the install
    phase. Next, it will run the tests using tox and log in to AWS ECR in the pre_build
    phase. Then, the buildspec.yaml file will build a Docker container image with
    the latest tag in the build phase and push the image to the AWS ECR repository
    in the post_build phase. Finally, specify the details for pytest reports, such
    as files, a base directory, and file format. Also, provide the filename to be
    stored as an artifact in the S3 bucket.'
