    # Create CI/CD pipeline using Jenkins


    Now, you will build a simple CI/CD pipeline using GitHub and Jenkins. When developers
    push the updates to the GitHub repository, the GitHub webhook detects the changes
    and sends the notification to Jenkins. Jenkins pulls the latest code from the
    GitHub repository, builds the Docker image, and runs the container using that
    image. Next, it trains the model and exports the pickle object from the trained
    model. In the next step, pytest results are exported and displayed in Jenkins.
    After passing all the tests, it will run the ML web app. Finally, it will send
