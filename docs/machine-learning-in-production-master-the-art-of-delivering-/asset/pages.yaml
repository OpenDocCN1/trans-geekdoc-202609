    # ## Monitoring


    Monitoring is an essential part of the deployment. It is recommended to monitor
    ECS clusters and other integrated services to ensure the high availability of
    applications. This enables you to check the overall health of ECS containers.
    First, create a plan for the resources and services that need to be monitored.
    Next, decide the action to be taken if a specified event is detected. Decide who
    should be notified of the event or error, where to monitor metrics and events,
    and so on.


    ECS provides cluster-level statistics, such as:


    +   - CPU Utilization—Current% of CPU utilized by the ECS cluster

    +   - Memory Utilization—Current% of Memory utilized by the ECS cluster


    Amazon ECS metric data is automatically sent to CloudWatch in 1-minute periods
    that get captured for 2 weeks. **Amazon CloudWatch Container Insights** allows
    you to aggregate and analyze metrics and logs from containerized applications.
    It helps to monitor utilization metrics such as CPU, memory, disk, and network.
    It also provides diagnostic information about container restart failures.


    You can create an AWS Lambda function that will get triggered if a specified event
    is detected and will send the alert to the slack channel. This way, team members
    and developers will be notified about the alert.


