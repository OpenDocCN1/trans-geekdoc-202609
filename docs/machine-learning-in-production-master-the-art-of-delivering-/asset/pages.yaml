- pgno: 142
  md: '# # Docker containers


    An instance of a container is created when you run the Docker image. You can use
    the same Docker image to run as many containers as you want. It is an important
    component of the Docker ecosystem. Docker runs containers in an isolated environment.


    An additional layer called a container layer, gets automatically created on top
    of the existing image layers when the developer runs a container. A Docker container
    has its own read and write layer, which allows developers to make changes that
    are specific to that container. Suppose you are running three containers using
    the same Docker image, and you install another version of the python package inside
    a running container. This will not affect the existing version of the python package
    in other containers. Docker manages the data within the Docker container using
    Docker Volumes.


    All the files that you created in an image or a container are part and parcel
    of the Union file system. However, the data volume is part of the Docker host
    file system, and it is simply mounted inside the container.


    It is initialized when the container is created. By default, it is not deleted
    when the container is stopped. Data volumes can be shared across containers too
    and can be mounted in read-only mode as well.


    The command to check all the running containers is `docker ps`.


    The command to check all the running and stopped containers is `docker ps -a`.


    # ## Detached mode


    To run Docker in the background, run the container in detached mode. You can use
    the `-d` flag to run the container in detached mode.


    # # Docker container networking


    Typically, a Docker host comprises multiple Docker containers. Docker containers
    also need to interact and collaborate with local as well as remote ones to come
    out with distributed applications. The bridge network is the default network interface
    that Docker Engine assigns to a container.


    ```

    docker network ls

    ```


    This command will show you the list of networks and their scope. The output contains
    the following headers:


    ```

    NETWORK ID, NAME, DRIVER, SCOPE

    ```


    To check the network details of any Docker container, use the following command,
    followed by the network ID:'
  merge: -1
  img_proc: true
- pgno: 143
  md: '```

    docker network inspect <NETWORK ID>

    ```


    # Port mapping


    The -p flag is used to map container ports to host ports. Consider this example:


    ```

    docker run -p <myport>:<containerport> nginx

    ```


    > Note: To observe the output, use docker logs [container_id].


    # Create a Dockerfile


    Dockerfile follows a simple and easy-to-understand structure, that is, # comment,
    followed by an instruction and an argument. It is a standard practice to write
    instructions in the uppercase to differentiate between instructions and arguments.


    # FROM


    +   The FROM instruction sets the base image for subsequent instructions.

    +   A valid Dockerfile must have a FROM instruction.

    +   FROM can occur multiple times in the Dockerfile.


    # CMD


    +   CMD defines a default command to execute when a container is being created.

    +   CMD does not get executed while building an image.

    +   Can be overridden at runtime.


    # RUN


    It executes a command in a new layer on top of the current image and commits the
    results.


    # COPY


    The COPY instruction copies new files or directories from <src> and adds them
    to the file system of the container at the path <dest>.


    # ENTRYPOINT


    This helps you to configure the container as an executable; it is similar to CMD.
    There can be at max one instruction for ENTRYPOINT; if more than one is specified,
    only the last one will be honored.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# WORKDIR <path>


    This sets the working directory for the RUN, CMD, and ENTRYPOINT instructions
    that follow it.


    # EXPOSE


    This exposes the network ports on the container, on which it will listen at runtime.


    # ENV


    This will set the environment variables <key> to <value> within the container.
    When a container is running from the resulting image, it will pass and persist
    all the information to the application running inside the container.


    # Build a Docker image


    Using the docker build command, users can automate a docker build that executes
    several command-line instructions in succession.


    The docker build command builds an image from a Dockerfile and a context:


    ```

    docker build -t ImageName:TagName dir

    ```


    Where:


    +   - -t: Image tag

    +   - ImageName: The name you want to give to your image

    +   - TagName: The tag you want to give to your image

    +   - dir: The directory where the Dockerfile is present


    For the current directory, simply use . (period):


    ```

    sudo docker build -t myimage:v1 .

    ```


    Check the newly created image using the docker images command.


    The next step is to build the container from the newly created image.


    > Note: To check all the commands run against that image, execute the following
    command docker history [Image_id]


    # Run a Docker container


    A Docker container is a runtime instance of a Docker image. The docker run command
    can run the Docker image as follows:


    ```

    docker run --name test -it myimage:v1

    ```'
  merge: -1
  img_proc: true
