    allows Prometheus to track and scrape its metrics and store them locally. Prometheus
    offers client libraries that can be used to instrument your application. In this
    scenario, you will be using the Prometheus Python client in the FastAPI application
    to expose its metrics that need to be tracked.


    A Prometheus server scrapes and stores metrics from instrumented jobs in time
    series format. This data can be fetched using PromQL - query language, and it
    can be used to visualize the metrics. It comes with an alert manager to handle
    alerts.


