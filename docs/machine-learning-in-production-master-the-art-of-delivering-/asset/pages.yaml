  md: '# cloudbuild.yaml


    Cloud builders are container images with common languages and tools installed
    in them. Cloud Build offers pre-built Docker images that can be used in the config
    file to execute commands. These pre-built images are available in the Container
    Registry at gcr.io/cloud-builders/.


    In this case, the cloudbuild.yaml file will run the tests using tox and pyt est.
    Next, it will build the Docker container image with the latest tag. Following
    that, it will push the image to the Container Registry and run the bash command
    to check the list of files in the current directory. Finally, it will pull the
    image from the Docker container to deploy it on Google Kubernetes Engine (GKE).


    ```

