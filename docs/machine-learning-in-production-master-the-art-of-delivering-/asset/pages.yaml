    # Modular programming


    Python is a modular programming language. Modular programming is a design approach
    in which code gets divided into separate files, such that each file contains everything
    necessary to execute a defined piece of logic and can return the expected output
    when imported by other files that will act as input for them. These separate files
    are called modules.


    # Module


    A module is a Python file that can hold classes, functions, and variables. For
    instance, load.py is a module, and its name is load.


    # Package


    A package contains one or more (relevant) modules, such that they are interlinked
    with each other. A package can contain a subpackage that holds the modules. It
    uses the inbuilt file hierarchy of directories for ease of access. A directory
    with subdirectories can be called a package if it contains the __init__.py file.


    Packages will be installed in the production environment as part of the deployment,
    so before you package anything, you’ll want to have answers to the following deployment
    questions:


    +   * Who are your app’s users? Will your app be installed by other developers
    doing software development, operations people in a data center, or a less software-savvy
    group?

    +   * Is your app intended to run on servers, desktops, mobile clients (phones,
    tablets, and so on), or embedded in dedicated devices?

    +   * Is your app installed individually, or in large deployment batches?


    The following figure depicts the sample structure of the Python package, where
    f1, f2, f3, f4, and f5 are modules of the package.'
