- pgno: 136
  md: '# Objectives


    After studying this chapter, you should be able to build and deploy ML models
    into production as a container or orchestration service using Docker. You should
    be able to create a Dockerfile, which contains all the commands to be executed.
    Using Dockerfile, you should be able to build and run Docker images. You should
    also be able to run container service in the background using a detached mode.
    Finally, you can deploy an ML model using Docker.


    # Introduction to Docker


    Docker is a containerization platform to package applications and their dependencies
    in the form of a container. It ensures that all the required libraries and dependencies
    are wrapped in an isolated environment to run the application smoothly in the
    development, test, and production environments. Docker is popular among developers
    as it is lightweight, fast, portable, secure, and more efficient than virtual
    machines. A containerized application will start running as soon as you run the
    Docker container.


    Docker has its own Docker registry, called Docker hub. Docker hub allows developers
    to store and distribute container images over the internet. An image tag enables
    developers to differentiate images. A Docker registry has public and private repositories.
    A developer can store a container image on the Docker hub using the push command
    and retrieve one using the pull command.


    # It works on my machine!


    Many a time, the code works perfectly on your machine but throws an error when
    you run it on another machine. This happens with developers and data scientists
    as well. The reason could be anything from a different OS to a different release
    of an OS, different python versions, or dependency issues. So, when they face
    this issue, they might end up spending a lot of time fixing it. With Docker, you
    should not encounter these issues, as Docker packages require files, configuration,
    and commands for seamless flow.


    # Long setup


    The traditional method of deploying in production environments takes a lot of
    time, as it needs to move the necessary files, install dependencies, configure,
    and save the output manually. Many a time, developers need to set up the environment
    first. It is more time-consuming when you have to repeat this process for different
    stages of the project, such as development, pre-production, and production. Manual
    deployment scripts are difficult to manage.'
  merge: -1
  img_proc: true
