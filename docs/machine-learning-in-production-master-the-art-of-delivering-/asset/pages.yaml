- pgno: 101
  md: '# CHAPTER 5


    # MLflow-Platform to

    Manage the

    ML Life Cycle


    # Introduction


    The Machine Learning life cycle involves many challenges. For instance, data scientists
    need to try different models containing multiple parameters and hyperparameters.
    They need to keep track of the model that is performing well and its parameters.
    Next, they need to save the serialized model for reusability. This chapter explains
    the role of MLflow in an ML life cycle. MLflow is a platform for streamlining
    machine learning development, including tracking experiments, packaging code into
    reproducible runs, and sharing and deploying models. It can manage a complete
    ML life cycle.


    # Structure


    This chapter discusses the following topics:


    +   - Introduction to MLflow

    +   - MLflow tracking

    +   - MLflow projects

    +   - MLflow models

    +   - MLflow model registry'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# # Objectives


    After studying this chapter, you should be able to train, reuse and deploy ML
    models using MLflow. You should also be able to track model evaluation metrics
    and model parameters, pickle the trained models, and compare two model results
    on MLflow UI. MLflow supports many downstream tools when it comes to deployment.
    You should be able to pick any iteration (by run ID) that is outperforming others
    and consume it through Python code, terminal, or postman.


    # # Introduction to MLflow


    MLflow is an open-source platform for managing the end-to-end machine learning
    life cycle.


    MLflow allows data scientists to run as many experiments as they want before deploying
    the model into production; however, it keeps track of model evaluation metrics,
    such as RMSE and AUC. It also tracks the hyperparameters used while building the
    model. It enables you to save the trained model along with its best hyperparameters.
    Finally, it allows you to deploy an ML model into a production server or cloud.
    You can even keep track of the models being used in staging and production so
    that other team members can be aware of this information.


    MLflow is library-agnostic, that is, you can use any popular ML library with it.
    Moreover, you can use any popular programming language for it as MLflow functions
    can be accessed via REST API and Command Line Interface (CLI).


    Integrating MLflow with your existing code is quite easy as it requires minimal
    changes. If you are working on a local system, it will automatically create a
    mlrun directory, wherein it stores the output, artifacts, and metadata. It creates
    a separate directory for each run. However, you can specify the path to create
    the mlrun directory. MLflow allows you to store information of each run into databases,
    such as MySQL or PostgreSQL.


    MLflow is more useful in the following scenarios:


    +   - Comparing different models: MLflow offers a UI that allows users to compare
    different models. You can compare Random Forest vs Logistic regression side by
    side, along with their model metric and parameters used. MLflow supports a wide
    range of model frameworks.


    +   - Cyclic model deployment: In production, it is required to push a new version
    of the model after every data change, when new requirements come up, or after
    building a model better than the current one. In these scenarios, MLflow helps
    keep track of the models that are in staging (pre-production) and models that
    are in production with versions and brief descriptions.'
  merge: -1
  img_proc: true
