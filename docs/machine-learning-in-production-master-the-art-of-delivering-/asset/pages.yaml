    17. - name: ''gcr.io/cloud-builders/docker''

    18.   id: Push

    19.   args: [''push'', ''gcr.io/$PROJECT_ID/mlapp:latest'']

    20.

    21. - name: ''gcr.io/cloud-builders/gcloud''

    22.   id: Bash

    23.   entrypoint: /bin/sh

    ```'
