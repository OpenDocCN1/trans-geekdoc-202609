- pgno: 7
  md: '# Preface


    Productionizing the machine learning model is a complex task that requires a comprehensive
    understanding of the latest technologies and CI/CD pipeline. MLOps become increasingly
    popular in the field of Data Science.


    This book is designed to provide a comprehensive guide to building and deploying
    ML applications with MLOps. It covers a wide range of topics, including the basics
    of Python programming, Git, Machine Learning life cycle, Docker, and advanced
    concepts such as packaging Python code for ML models, monitoring, model security,
    Kubernetes, testing using pytest and the use of CI/CD pipeline for building and
    deploying robust and scalable ML applications on cloud platforms, including Azure,
    GCP, and AWS.


    Throughout the book, you will learn about the MLOps, various tools, and techniques
    to deploy ML models. You will also learn how to use them to productionize ML models
    and applications that are efficient, scalable, and easy to maintain. Additionally,
    you will learn about best practices and design patterns for MLOps.


    This book is intended for data scientists, software developers, data engineers,
    data analysts, and managers who are new to MLOps and want to learn how to productionize
    ML models. It is also helpful for experienced data scientists and ML engineers
    who want to expand their knowledge of these technologies and improve their skills
    in deploying ML models in production.


    With this book, you will gain the knowledge and skills to become proficient in
    the field of MLOps. I hope you will find this book informative and helpful.


    **Chapter 1: Python 101** – explains the Python fundamental concepts needed for
    the reader to equip with the prerequisites required for this book, including Python
    installation, data structures, control statements, loops, functions, and data
    manipulation using pandas. This is a quick refresher for those who have worked
    with Python. If you are a beginner, this chapter will cover the most common Python
    commands needed to build and deploy ML models in production. It allows the reader
    to learn fundamental concepts related to the Object-Oriented Programming paradigm
    using Python.


    **Chapter 2: Git and GitHub Fundamentals** – presents a detailed overview of Git
    workflow, including common Git commands with practical examples. This is'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'essential content for the entire book, as this chapter covers fundamental aspects
    of Git and GitHub that influence technical decisions to build the CI/CD pipelines
    to deploy ML models in the production environment.


    **Chapter 3: Challenges in ML Model Deployment** – covers the various stages of
    the ML life cycle, including details on the challenges of each stage. It also
    covers the common challenges in deploying models in the production environment
    and how MLOps can help to overcome them. Additionally, the chapter discusses different
    approaches to deploying ML models in production.


    **Chapter 4: Packaging ML Models** – allows the reader to learn fundamental concepts
    related to modular programming using the Python language, including Python packaging,
    dependency management, and good practices of software development to develop stable,
    readable, and extensible code for robust enterprise applications. Furthermore,
    the chapter explains the virtual environment, testing code using pytest, serializing,
    and deserializing ML models. It covers packaging ML models, code, and dependencies
    so that the package can be installed and consumed on another machine or server.


    **Chapter 5: MLflow-Platform to Manage the ML Life Cycle** – gives special attention
    to streamlining machine learning development, including tracking experiments,
    packaging code into reproducible runs, and sharing and deploying models. It demonstrates
    how to train, deploy, and reuse ML models using MLflow through practical examples
    based on the use case. This chapter explains the role of MLflow in an ML life
    cycle.


    **Chapter 6: Docker for ML** – shows the basic concepts of Docker and provides
    practical examples of common Docker commands with a use case for the reader. Learning
    these commands allows the reader to package ML code with its dependencies and
    run the application inside Docker containers. This chapter includes practical
    examples of Docker objects such as Docker images and containers.


    **Chapter 7: Build ML Web Apps Using API** – explains in detail the most commonly
    used frameworks for building web-based ML apps using the Python language, including
    FastAPI, Streamlite, and Flask. It also allows the reader to learn the basics
    of Gunicorn, NGINX, and APIs, including an explanation of REST APIs, and much
    more.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '**Chapter 8: Build Native ML Apps** – is dedicated to building native ML applications
    in Python to give the reader more familiarity with converting Python apps into
    Windows and Android apps and ways to consume them. This chapter covers practical
    examples of working with Tkinter, kivy, kivyMD, pyinstaller, and buildozer.


    **Chapter 9: CI/CD for ML** – allows the reader to learn and implement the different
    stages of the CI/CD pipeline using GitHub and Jenkins, including committing, building,
    testing, and deploying. This chapter explains the GitHub and Jenkins integrations
    to build an automated CI/CD pipeline for deploying ML apps using Python and Docker.


    **Chapter 10: Deploying ML Models on Heroku** – will guide the reader in configuring
    and building a CI/CD pipeline using GitHub Actions to deploy a web-based ML app
    on the Heroku platform. This chapter also explains three methods for deploying
    the web app on Heroku: Heroku Git, GitHub integration, and Container registry.
    It covers practical examples for creating workflow (YAML) files for GitHub Actions,
    including using tox and pytest for testing the code, and an automated Heroku pipeline
    for faster deployments.


    **Chapter 11: Deploying ML Models on Microsoft Azure** – explains the step-by-step
    approach to building CI/CD pipeline using GitHub Actions to deploy web-based ML
    apps to Azure web services. In the other approach, the reader will learn to build
    a CI/CD pipeline and deploy web-based scalable ML apps to Azure Container Instances
    (ACI) and Azure Kubernetes Service (AKS) using Azure DevOps and Azure Machine
    Learning (AML) Service.


    **Chapter 12: Deploying ML Models on Google Cloud Platform** – Shows how to build
    an automated CI/CD pipeline to deploy ML models on Google Kubernetes Engine (GKE),
    without the need to integrate any external tool, service, or platform. This chapter
    allows the reader to learn and implement Kubernetes functionality to run scalable
    ML apps using Google Kubernetes Engine (GKE).


    **Chapter 13: Deploying ML Models on Amazon Web Services** – presents an overview
    of various cloud compute services offered by Amazon Web Services (AWS). This chapter
    allows the reader to learn and implement an automated CI/CD pipeline with Continuous
    Training (CT) to deploy scalable enterprise ML apps on Amazon Elastic Container
    Service (ECS). Additionally, it covers the integration of Application Load Balancer
    (ALB), Amazon Virtual Private Cloud'
  merge: -1
  img_proc: true
- pgno: 10
  md: '(Amazon VPC), and security groups into Amazon Elastic Container Service (ECS)
    for building robust and secure enterprise ML apps.


    **Chapter 14: Monitoring and Debugging** – is dedicated to monitoring ML and operational
    metrics, including servers, cost of services, drifts in ML, input data, ML models,
    and much more. This chapter shows the importance and fundamental concepts of monitoring
    in the ML life cycle. It also covers practical examples using whylogs and WhyLabs
    for ML model monitoring, and Prometheus and Grafana for operational monitoring.


    **Chapter 15: Post-Productionizing ML Models** – presents a detailed overview
    of adversarial machine learning, including different types of adversarial attacks
    and how to mitigate them. It also covers fundamental concepts of A/B testing and
    the future scope of MLOps in the industry.'
  merge: -1
  img_proc: true
