    This chapter discussed the importance of modular programming in the production
    environment; virtual environments play a crucial role when you are working on
    multiple projects. After that, you explored the steps to create and activate a
    virtual environment. You can list the packages to be installed inside the virtual
    environment in the requirements.txt file so that all the required packages can
    be installed in one go. Writing test cases boosts confidence about the package,
    functions, and overall integrity. Packages are portable and reusable, and they
    can be easily debugged.


