    # # Set up the MySQL server for MLflow


    You can install MySQL server if it is not installed already. For this, you can
    also refer to the official document at https://dev.mysql.com/doc/mysql-apt-repo-quick-guide/en/.


    First, create mlflow_user in MySQL using the following command:


    ```

    mysql -u mlflow_user

    CREATE USER ''mlflow_user''@''localhost'' IDENTIFIED BY ''mlflow''

    GRANT ALL ON db_mlflow.* TO ''mlflow_user''@''localhost'';

    FLUSH PRIVILEGES;

    ```


    Enter the password when prompted.


    Create and select the database:


    ```

    CREATE DATABASE IF NOT EXISTS db_mlflow;

    use db_mlflow;

    ```


    To know which user(s) have the access to db_mlflow database and its privileges,
    you can execute the following command:


    ```

    SELECT * FROM mysql.db WHERE Db = ''db_mlflow''\G;

    ```'
