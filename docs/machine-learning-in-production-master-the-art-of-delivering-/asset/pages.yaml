    and saving the serialized models.


    # Points to remember


    +   - The Python package holds multiple modules, and each module contains functions,
    classes, and variables.

    +   - The MANIFEST.in file contains the list of files to be included and excluded.

    +   - The requirements.txt files hold the list of packages to be installed using
    pip.

    +   - Python refers to serialization and deserialization by the terms pickling
    and unpickling, respectively.

    +   - The __Init__.py file indicates that the directory should be treated as a
    package.


