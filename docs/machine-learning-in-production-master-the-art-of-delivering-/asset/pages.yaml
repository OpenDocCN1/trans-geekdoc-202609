    # Drift in ML


    Model drift means a change in the behavior of ML models or that the model

    is not performing as expected or per the Service Level Agreement (SLA). Model

    performance may degrade after deploying it to production, as the model can receive

    data that was not introduced during model training.


    # Types of drift in ML


    There are mainly three types of drift in ML:'
  merge: -1
  img_proc: true
- pgno: 411
  md: '+   - Data drift

    +   - Prediction drift

    +   - Concept shift


    # Data drift


    Data drift is when the distribution or characteristics of input features change
    with reference to training data. It is also known as feature drift, population
    drift, or covariate shift. If the distribution of input data changes, then its
    predictions might get affected as the model is not prepared for it.


    If a new category gets added to the feature post-deployment, then it may cause
    an error while making the prediction, as it was not there at the time of model
    training.


    Another example could be, suppose there is a feature called **Credit Rating**
    in training data, and it has high weightage, which means a change in this feature
    may cause a major change in model output. Now, the business decided to go with
    Moody’s credit rating instead of S&P. This will cause a change in input data.
    For instance, S&P’s AA- is equivalent to Moody’s Aa3 rating.


    The following equation shows that the distribution of training data does not match
    the distribution of reference (production) data.


    Mathematically, data drift can be defined as follows:


    ```

    P(X) ≠ Pref(X)

    ```


    Where P(X) denotes the input data probability distribution.


    # Prediction drift


    As input data changes with data drift, this may cause a change in the target or
    prediction variable. It refers to a change in predictions over time. It is also
    named a prior probability shift, label drift, or unconditional class shift. This
    can also occur due to the removal or addition of new classes. Retraining the model
    can help mitigate the model degradation owing to prediction drift.


    Mathematically, prediction drift can be defined as follows:


    ```

    P(Y) ≠ Pref(Y)

    ```


    Where P(Y) denotes the prior probability distribution of target labels.


    # Concept shift


    A concept shift occurs when the relationship between independent variables and
    dependent or target variables changes. It is also known as posterior class shift,
    conditional change, or real concept drift. It refers to changes in the relationship'
  merge: -1
  img_proc: true
- pgno: 412
  md: 'between the input variables and the target variables. If you detect any significant
    concept shift, it is very likely that your model''s predictions are unreliable.
    A **Concept** in Concept shift refers to the relationship between independent
    and dependent variables.


    For instance, a car insurance company changes its claim policy that a claim for
    a specific part of the car will be rejected. Suppose that part of the car got
    damaged in an accident, the customer''s claim for it will be rejected. In this
    scenario, mapping between the input feature and target feature changes even though
    the distribution of input data remains the same.


    Mathematically, concept shift can be defined as follows:


    $P(Y|X) \neq Pref(Y|X)$


    Where $P(Y|X)$ denotes the posterior probability distribution of the target labels.


    Following are the patterns of concept shift:


    +   - Sudden or abrupt

    +   - Gradual

    +   - Recurring or cyclic

    +   - Incremental

    +   - Temporary


    ![](img/cc4299656808e62a294f1843a1e18e72_412_0.png)


    Figure 14.2: Different patterns of concept shift


    # Techniques to detect the drift in ML


    Statistical distance measurement using distance metrics between two distributions
    is useful for detecting drift in ML.


    If there are many independent variables in the dataset, then you can use dimensionality
    reduction techniques, such as PCA. Tracking many features can increase the load
    on the monitoring system and sometimes it becomes difficult to mitigate drift
    by targeting specific features.


    Basic statistical metrics, such as mean value, standard deviation, correlation,
    and minimum and maximum values comparison, can be used for calculating the drift
    between training and current independent variables.


    Distance measures like Population Stability Index (PSI), Characteristic stability
    index (CSI), Kullback–Leibler divergence (KL-Divergence), Jensen–Shannon divergence
    (JS-Divergence), and Kolmogorov–Smirnov (KS) statistics can be used for continuous
    features.'
  merge: -1
  img_proc: true
- pgno: 413
  md: 'The cardinality checks, Chi-squared test, and entropy can be used for categorical
    variables.


    Control charts and histogram intersections can be used to detect a drift in data.


    Finally, there are several platforms for model monitoring, such as WhyLabs, and
    libraries, such as deepchecks, and alibi-detect. They come with easy integrations
    and a ready framework for drift detection. The best part about this is that most
    of them provide a drift detection framework, storage for logs and historical data,
    intuitive monitoring dashboards, and alert mechanisms for critical events.


    # Addressing the drift in ML


    Once you detect the drift in the ML model, it can be addressed in the following
    ways:


    # Data quality issues


    If there is an issue with input data, then it can be easily fixed. For instance,
    high-resolution images were provided for training face recognition models; however,
    low-resolution images were passed to the deployed model.


    # Retraining the model


    After detecting the data or concept shift, retraining the model with recent data
    can improve its performance. Sometimes production data is not sufficient to train
    the model. In that case, you can combine historical data with recent production
    data and give more weight to recent data.


    Here are four strategies for retraining the model:


    +   - **Periodically retraining**: Scheduling it at a fixed time, for instance,
    every Monday at 10 PM

    +   - **Data or event-driven**: When new data is available

    +   - **Model or metric driven**: When accuracy is lower than a threshold or SLA

    +   - **Online learning**: Where the model continuously learns in real-time or
    near real-time on the latest data


    # Rebuilding or tuning the model


    If retraining the model doesn’t work, then you may need to consider rebuilding
    it or tuning it on recent data. You can automate this using a pipeline.'
