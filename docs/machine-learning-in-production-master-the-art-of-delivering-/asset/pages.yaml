- pgno: 4
  md: '# About the Author


    **Suhas Pote** has over eight years of multidisciplinary experience in data science,
    playing central roles in numerous projects as a technical leader and data scientist,
    delivering projects using open-source technologies for big companies, including
    successful projects in South America, Europe, and the United States. He is experienced
    in client engagement and working collaboratively with different teams. Currently,
    he is a process manager at Eclrx and is an accomplished postgraduate, having completed
    a degree in Data Science, Business Analytics, and Big Data. He holds a Bachelor’s
    degree focused on Electronics and Telecommunication Engineering. In the meantime,
    he successfully got many certifications in data science and related tools. Furthermore,
    the author participates as a speaker in Data Science conferences and writes technical
    articles on machine learning and related topics. He also contributes to technical
    communities worldwide, such as Stack Overflow.'
