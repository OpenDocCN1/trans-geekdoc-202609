- pgno: 405
  md: '# # CHAPTER 14

    # Monitoring and Debugging


    # ## Introduction


    So far, you have learned various techniques to deploy ML models in production.
    However, deploying a model into production is not the end; monitoring is the next
    important step. This chapter talks about concepts and techniques of model monitoring.
    Model monitoring is not limited to the final endpoint where the model is deployed;
    you should also integrate it into the intermediate stages wherever required. The
    static ML model is trained offline on historical data. However, this model may
    not deliver consistent performance forever. The main reasons could be changes
    in input data, business requirements, and model degradation over time.


    # ## Structure


    The following topics will be covered in this chapter:


    +   * Importance of Monitoring

    +   * Fundamentals of ML monitoring

    +   * Metrics for monitoring your ML system

    +   * Drift in ML - Types and detection techniques

    +   * Operational monitoring using Prometheus and Grafana

    +   * ML model monitoring with whylogs and WhyLabs'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# # Objectives


    After studying this chapter, you can start monitoring ML models. You should be
    able to understand the importance and fundamentals of monitoring, decide on the
    metrics to monitor for your project and understand the concept of drift in ML,
    its types, and techniques to detect the drift. You should also be able to monitor
    drift in the data using whylogs, an open-source lightweight library, and WhyLabs,
    an observability platform. You should be able to integrate Prometheus and Grafana
    with FastAPI, and operational monitoring with open-source tools, that is, Prometheus
    and Grafana.


    # ## Importance of monitoring


    Once an ML model is deployed in production, it is essential to monitor it in order
    to ensure that the model''s performance stays up to the mark and it continues
    to deliver reliable output seamlessly. As a matter of fact, there are many reasons
    for failure in ML apps or services, such as pipeline failure, model degradation
    over time, change in model input data, system or server failure, and change in
    the schema.


    Multiple teams are involved while deploying models to production, which usually
    includes a team of Data Scientists, Data Engineers, and DevOps. If prediction
    errors increase, who will be held responsible? Who is the owner of the model in
    production?


    Due to COVID-19, banks'' ML model''s performance was heavily affected. The model''s
    predictions were far away from the actual figures. This is the case of a shift
    in input data. This should give you an overview of the challenges post-deploying
    models into production and the necessity of monitoring ML models.


    Monitoring is essential when it comes to comparing new and old models'' performance
    and their predictions over time. There could be latency issues, that is, delayed
    output. For tracking and investigating latency issues, efficient monitoring is
    needed. You need to monitor input data to ensure that production input data is
    being processed like the training data. To track and handle extreme values, out
    of the range values, or special cases before passing them to the models, monitoring
    is required. Last but not least is model security, that is, monitoring is required
    to track any external attack on the model or system.


    The objectives of ML monitoring are as follows:


    +   - To detect the issues or failures at early stages so that necessary steps
    can be taken

    +   - To keep a track of resource usage and model prediction to evaluate model
    and system performance in the production environment'
  merge: -1
  img_proc: true
- pgno: 407
  md: '+   - To detect the change in distribution, schema, and anomalies in input
    data that may cause an error in the predictions

    +   - To ensure the availability of model predictions and that they are explainable

    +   - To track and store metrics in specified storage or database


    Model monitoring helps data scientists to reduce model failures, avoid downtime,
    and ensure reliable outcomes for users.


    # # Fundamentals of ML monitoring


    ML monitoring refers to tracking the performance, errors, metrics, and such of
    deployed models and sending alerts (when required) to ensure models continue performing
    above an acceptable threshold. It is not limited to tracking input data or model
    degradation. However, it should take all the things into account that may affect
    model performance directly or indirectly. ML monitoring helps decide whether an
    existing model needs to be updated.


    The following are the essential steps to consider:


    +   - **Monitoring is the key**: Monitoring is essential once a model is deployed
    in production. Monitoring enables you to track and fix issues or errors in a faster
    manner. Monitoring can be broadly divided into two types:

    +     - **Functional monitoring**: In the case of ML, functional monitoring refers
    to tracking metrics, errors, and performance related to ML models, such as accuracy
    and outliers.

    +     - **Operational monitoring**: Operational monitoring refers to tracking
    system-specific metrics, such as CPU and RAM utilization, uptime, and throughput.


    +   - **Scalable integration**: Monitoring should be easy to integrate with your
    existing infrastructure and workflow. The monitoring system should be seamless
    and scalable to integrate. It should be able to track multiple models if there
    is more than one model. The monitoring solution should be platform agnostic so
    that it can be used for different types of deployment, having different tech stacks.


    +   - **Metrics tracking**: Tracking accuracy is not enough. Monitoring systems
    should be able to track all the metrics that can affect model and system performance
    over time. A centralized monitoring system should use multiple performance metrics
    to give the overall status of the solution. Use different metrics for different
    types of features. For instance, min, max, mean, standard deviation, and outliers
    can be used for numerical data. The metrics records and logs need to be stored
    in a database so that they can be analyzed later on.'
  merge: -1
  img_proc: true
- pgno: 408
  md: '+   **Alert system for important events**: You cannot track 100+ metrics manually
    24x7; hence, the alert system should be part of the monitoring solution. Not everything
    needs an alert. You may be tracking 20+ metrics; however, only a few metrics need
    high attention. For instance, if input data drift is exceeding the threshold,
    then the alert system should send the notification to the responsible team or
    Data Scientists. The whole purpose of the alert system is to notify concerned
    teams or individuals so that issues or errors can be avoided or can be solved
    at the earliest to ensure consistency in ML model performance.


    +   **Root cause analysis and debugging**: Once you get the alert, you may need
    to act on it. You can start the root cause analysis to determine the issue and
    fix it by debugging. For instance, if model accuracy is going below the threshold,
    it could be because of a change in the distribution of input data or anomalies.


    To design an efficient monitoring system, you need to consider existing pipelines
    and infrastructure. There are mainly three pillars of monitoring:


    +   **Processing and Storage**: It processes and stores the critical metrics in
    a database or data source with a timestamp. You can query the metrics when required.


    +   **Graphs and Dashboard**: It will query or fetch the monitoring metrics from
    a connected database or data source. You can choose the visualization as per the
    type of metrics. Here, you have to decide the metrics that need to be displayed.
    It should summarize overall monitoring with intuitive graphs.


    +   **Alert**: Finally, it should send an alert to the concerned team or data
    scientists to take immediate action, if required. This helps to prevent future
    failures or mitigate the impact.


    The following figures show the three pillars of the monitoring system for effective
    monitoring:


    # Pillars of Monitoring System


