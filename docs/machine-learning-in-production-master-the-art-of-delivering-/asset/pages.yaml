  md: '# CHAPTER 13

    Deploying ML Models on Amazon Web Services


    # Introduction


    Cloud computing refers to storing and accessing data and applications over the
    internet. Usually, data is stored on a remote server. Simply put, you can access
    data and applications from anywhere on the internet without worrying about the
    physical or on-premises infrastructure, which makes cloud computing more popular
    among organizations.


    Amazon Web Services (AWS) helps solve on-premises infrastructure issues. AWS can
    spin up 100-1000 servers in a few minutes and, extra or unused servers will be
    removed. It is easy to scale applications with AWS. You can add more storage for
    applications or data. AWS helps focus on building and deploying applications on
    the cloud without worrying about setting up infrastructure from scratch.


    Refer to the previous chapters if you need to study the concepts discussed, such
    as packaging ML models, FastAPI, Docker, and CI/CD pipeline.


