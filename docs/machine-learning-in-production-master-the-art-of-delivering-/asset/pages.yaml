  md: 'The following figure shows the workflow created for the current use case:


    ![](img/cc4299656808e62a294f1843a1e18e72_250_0.png)


    Unlike Jenkins, GitHub Actions comes with the runners (GitHub-owned servers available
    for common OSs like Windows, Linux, and macOS) to build, test and deploy the work.
    GitHub supports a plethora of languages, such as Node.js, Python, Java, Ruby,
    PHP, Go, Rust, and .NET.


    GitHub Actions automation is managed using workflows. Workflows are nothing but
    the yml or YAML files you placed in the .github/workflows directory in the same
    project repository.


    GitHub Actions are free to use, but some limits are set for them.


    You can read more about GitHub Actions at https://docs.github.com/en/actions.


    # Configuration


    GitHub Actions need a minimal GitHub configuration. Firstly, go to the GitHub
    repository where the codebase and required files are available. Next, by default,
    you will be redirected to the Code tab; switch to the Settings tab, and from the
    left panel, choose the Secrets option under the Security section. After that,
    select Actions under the Secrets menu. Finally, use the New repository secret
    button to add the following secrets:


    HEROKU_API_KEY: You can get the Heroku API key from the following path on the
    Heroku platform.

    Heroku Login | Account settings | Account | API Key | Reveal/Regenerate API Key


    HEROKU_APP_NAME: This is the Heroku app name. Here, provide the app name that
    you have created for staging, that is, docker-ml-cicd.


    HEROKU_PROD_APP_NAME: This is another app that is to be created for production.
