    # # Deployment with GitHub repository integration


    Heroku comes with the GitHub integration method, which enables you to automate
    the deployment process. Post GitHub and Heroku integration, any changes pushed
    to the repository will trigger the process that deploys the Heroku app at the
    end.


    On Heroku, you can create a pipeline and add both apps to it. Heroku allows you
    to create review (temporary) apps before deploying the staging app. This additional
    option enables you to see the working of the app before pushing it to the staging
    or pre-deployment stage.'
