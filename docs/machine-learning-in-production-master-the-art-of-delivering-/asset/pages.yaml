    # # Amazon Elastic Container Service (ECS)


    Amazon Elastic Container Service (ECS) is a container orchestration tool used
    for managing and running Docker containers. Amazon Elastic Container Service (ECS)
    is a fully managed container management service offered by AWS. In the current
    scenario, ECS with the Fargate model will be used. It will take care of managing
    the cluster and load balancing. It will also make sure the application is up and
    running.


    Let’s understand the terms used in the Amazon Elastic Container Service (ECS):


    +   - **Task Definition**: The task definition allows you to specify which Docker
    image to use, which ports to expose, how much CPU and memory to allot, how to
    collect logs, and how to define environment variables. This is a blueprint that
    dictates how a Docker container should launch.

    +   - **Task**: A task resembles an **instance** of task definition. It can be
    created independently, that is, without an Amazon ECS cluster. This will spin
    up a container with an application running in it. It will not replace itself automatically
    if it stops or fails due to some error.'
  merge: -1
  img_proc: true
- pgno: 371
  md: '+   - **Service:** A Service is responsible for creating and maintaining the
    desired number of tasks up and running all the time. If any task fails or is stopped
    due to some error, then the ECS Service will replace that task with a new one.
    It refers to the **task definition** file to create tasks.

    +   - **Cluster:** It is a logical group of container instances.

    +   - **Container:** This is the Docker container created during task instantiation.


    The following figure resembles the Amazon Elastic Container Service (ECS) architecture.


    ![](img/cc4299656808e62a294f1843a1e18e72_371_0.png)


    Figure 13.12: Amazon Elastic Container Service (ECS)—Architecture


    # ## AWS ECS deployment models


    AWS ECS Deployment model can be chosen as per your requirement. Let’s look at
    the models AWS Elastic Container Service (ECS) mainly offers for cluster deployment.


    # ## EC2 instance


    **EC2 (Elastic Compute Cloud)** is a virtual machine in the cloud. First, configure
    and deploy EC2 instances in the cluster to run the containers. It provides more
    granular control over the instances. You can choose the instances as per requirement.


    This model is a better choice if you want to do the following:


    +   - Run containerized applications continuously'
  merge: -1
  img_proc: true
- pgno: 372
  md: '+   - Have better control over the auto-scaling configuration

    +   - Use a Classic Load Balancer (CLB) to distribute workloads

    +   - Use Graphical Processing Unit (GPU)

    +   - Use Elastic Block Storage (EBS)

    +   - Deploy large and complex applications


    # Fargate


    This is a serverless pay-as-you-go model. You will be charged based on the computing
    capacity selected and the time of usage. ECS with Fargate is a container orchestration
    tool used for running Docker based containers without having to manage the underlying
    infrastructure.


    This model is a better choice if you want to do the following:


    +   - Run the task occasionally or for a short period

    +   - Containerized applications should be able to handle sudden spikes in incoming
    traffic

    +   - Use application and network load balancers to distribute workloads

