    # # CI/CD pipeline for ML


    CI/CD is an acronym for **Continuous Integration/Continuous Delivery/Deployment
    (CI/CD)**. The purpose of the CI/CD pipeline is to automate the chain of interconnected
    steps to deploy an application or release a new version of the software.


    When a new feature gets added to the application, any improvement needs to be
    integrated with the application. However, it involves different teams that execute
    multiple tasks and validate them before moving on to the production stage. Mostly,
    this is a manual and time-consuming process, and it can cause a delay in the release
    of the new version.


    CI/CD pipeline helps in automating the testing, running error-free code for the
    application, faster deployments, saving time and cost for developers, high reliability,
    and so on.


    CI/CD pipeline enables you to push the changes from development to deployment
    quickly, which usually consist of four stages:


    +   • **Commit code changes**: After making changes to the file or code, the developer
    pushes the updates to the source repository. This activity is often performed
    in a team. CI/CD pipeline enables any team member to check the integrity of the
    code. Hence, you can automatically push the changes to the repository after it
    passes the tests.

    +   • **Build**: In this phase, it fetches the changes from the repository for
    the build. It keeps a watch on the source repository for any changes. As soon
    as it detects the changes, it initiates the build process and validates the build
    results after build completion.

    +   • **Test**: The test phase runs the automated tests, such as unit tests, pytest,
    and API tests, on top of the build. It is a vital stage of the CI/CD pipeline.
    This'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'ensures the overall integrity of the code and prevents any broken code from
    passing on to the next phase.


    +   - Deploy: This phase deploys the changes to the production environment.


    The following figure shows the different stages of the CI/CD pipeline. However,
    organizations can modify it as per their goals.


    ![](img/cc4299656808e62a294f1843a1e18e72_209_0.png)


    Figure 9.1: CI/CD Pipeline


    Listing down some popular tools for CI/CD pipeline:


    +   - Jenkins

    +   - GitHub Actions

    +   - Bamboo

    +   - CircleCI

    +   - GitLab CI/CD

    +   - Travis CI


    # Continuous Integration (CI)


    In Continuous Integration (CI), the team of developers builds, run, and test code
    in local environments first. If everything goes well then, they push the updates
    to the repository. After this, the chain of steps starts to run, which involves
    the build, run, and test stages. The project members get notified at each step
    and get timely updates, such as the build outcome and test outcomes. Finally,
    the artifacts get stored and the report of the current status is sent via email
    or notified via Slack.


    When a team of developers is working on the same application, they push the code
    changes to the repository. However, due to changes in the environment, such as
    the'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'production environment, the code can break or throw an error. On the other
    hand, there could be a conflict between updates, when multiple developers try
    to push the updates of the application to the central code repository. This issue
    is taken care of by the CI stage, where developers can push the changes that will
    pass through the defined stages, such as build, run, and test, to ensure that
    the code is working properly without any issues. However, if any of the CI stages
    fail, then you will be notified, and the further process stops. This way, you
    can avoid integrating any broken code into production. Developers can frequently
    push and check the functioning of the code, flow, and integrity of the code or
    applications before pushing it to the next stage for deployment.


    # Continuous Delivery/Deployment (CD)


    CD refers to Continuous Delivery or Continuous Deployment (the terms are used
    interchangeably) based on the level of automation you are planning to implement.
    The CD stage depends on the CI stage. Once the CI stage is completed, it triggers
    the CD stage in the pipeline. The purpose of the Continuous Delivery (CD) stage
    is to deliver an error-free codebase or artifact to the pre-production environment.
    In this stage, you can add a series of test cases (wherever required) to ensure
    a stable build and functional application. It sends the test status report to
    the team or developer, and then the application is manually pushed to the production
    environment. If any of the steps fail, you may need to carry out the entire process
    again with the required updates.


    On the other hand, continuous deployment goes one step further and deploys the
    application from the pre-production environment to the production environment
    quickly. This removes the step of manual deployment of an application to the production
    environment. However, it is optional, as it depends on the developer and operation
    team to choose the level of automation they want to implement as per the business
    and application’s nature.


    # Continuous Training (CT)


    A new stage introduced in the traditional CI/CD pipeline is Continuous Training
    (CT). In this stage, you expect the models to be trained continuously as new data
    comes in or any event occurs, such as the accuracy of the model dropping below
    the acceptable threshold. This may add slight complexity to CI/CD pipeline, but
    it is essential for Machine Learning deployment.


    With CI/CD, Continuous Training (CT) is equally important in MLOps. Model retraining
    depends on scenarios and various other factors, such as how frequently data is
    changing and the schema of input data. It also depends on events such as accuracy
    dropping below an acceptable threshold, specific periods such as the end of every
    week, or manual triggers.'
  merge: -1
  img_proc: true
