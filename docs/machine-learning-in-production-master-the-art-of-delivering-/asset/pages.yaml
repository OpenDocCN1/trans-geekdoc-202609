    # # Serializing and de-serializing ML models


    Serializing is a process through which a Python object hierarchy is converted
    into a byte stream, whereas deserialize is the inverse operation, that is, a byte
    stream (from a binary file or bytes-like object) is converted back into an object
    hierarchy. In Python, serialization and deserialization refer to pickling and
    unpickling, respectively.


    Here, `joblib.dump()` and `joblib.load()` will be used as a replacement for a
    `pickle.dump()` and `pickle.load` respectively, to work efficiently on arbitrary
    Python objects containing large data, large NumPy arrays in particular, as shown
    here.


    Import the joblib library:


    ```

    1. import joblib

    ```


    Then create an object to be persisted:


    ```

    2. joblib.dump(ML_model_object, filename)

    ```


    An object can be reloaded:


    ```

    3. joblib.load(filename)

    ```


    > Note: If you are switching between Python versions, you may need to save a different
    joblib dump for each Python version.


