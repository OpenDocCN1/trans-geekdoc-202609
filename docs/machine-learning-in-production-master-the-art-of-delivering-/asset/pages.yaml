  md: '# Create and run the service in the background:


    Create a **systemd** unit file that allows the Ubuntu boot system to start Gunicorn
    automatically and serve up the Flask application every time the server starts.


    First, go to the _system_ directory using the following command:


    ```

    cd /etc/systemd/system

    ```


    Next, you need to create a service for the Flask app


    ```

    sudo nano flaskapp.service

    ```


    Then, add the following commands to it and save it:


    ```

    1. [Unit]

    2. Description=Flaskapp Gunicorn Service

    3. After=network.target

    4.

    5. [Service]

    6. User=suhas

    7. Group=www-data

    8. WorkingDirectory=/home/suhas/webapi/flask

    9.

    10. ExecStart=/usr/bin/gunicorn3 --workers 3 --bind unix:flaskapp.sock -m 007
    app:app

    11. Restart=on-failure

    12. RestartSec=10

    13.

    14. [Install]

    15. WantedBy=multi-user.target

    ```


    In the preceding service, you are instructing Gunicorn to start three worker processes,
    which can be updated afterward. Then, create and link the UNIX socket file. In
    the current scenario, **007** is used for access so that the socket file allows
    access to the owner and group and restricts others. Then, pass the filename of
    the app.


    ```

    sudo systemctl daemon-reload

    ```


    ```

    sudo service flaskapp restart

    ```'
