    # # pytest fixtures


    pytest fixtures are basic functions, and they run before the test functions are
    executed. pytest fixtures are useful when you are running multiple test cases
    with the same function return value.


    It can be declared by the @pytest.fixture marker. The following is an example:


    ```

    1. @pytest.fixture

    2. def xyz_func():

    3.    return "ABC"

    ```


    When pytest runs a test case, it looks at the parameters in that test function’s
    signature and then searches for fixtures that have the same names as those parameters.
    Once pytest finds them, it runs those fixtures, captures what they returned (if
    any), and passes those objects into the test functions as arguments.


    You can configure **pytest** using the _pytest.ini file.


