    # ## Introduction


    Nowadays, automation is all around us. By automating the manual process, you save
    time, effort, and cost. The best part about automation is that it reduces human
    errors. You can automate most of the parts while incorporating new changes or
    updates in the application.


    CI/CD pipeline enables you to deploy the updates to the application in an automated
    way. This chapter will touch upon the elements of the CI/CD pipeline and ways
    to leverage it for ML applications. In this chapter, you will learn the different
    stages of the CI/CD pipeline, their importance in MLOps, and how to build one.


    # ## Structure


    This chapter discusses the following topics:


    +   - CI/CD pipeline for ML

    +     - Continuous Integration (CI)

    +     - Continuous Delivery/Deployment (CD)

    +     - Continuous Training (CT)

    +   - Tools and platforms for building CI/CD pipeline'
