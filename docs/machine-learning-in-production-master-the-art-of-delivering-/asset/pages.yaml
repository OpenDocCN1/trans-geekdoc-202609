  md: 'Container Registry uses the hostname, project ID, image, and tag or image digest
    to access images, where image digest is the sha256 hash value of the image contents.
    The format is as follows:


    ```

    HOSTNAME/PROJECT-ID/IMAGE : TAG

    ```


    Or


    ```

    HOSTNAME/PROJECT-ID/IMAGE : @IMAGE-DIGEST

    ```


    The following figure shows the GCP Container Registry after enabling the Container
    Registry API, where mlapp is an app name and gcr.io is a hostname. Currently,
    gcr.io hosts the images in the United States.


    ![](img/cc4299656808e62a294f1843a1e18e72_336_0.png)


    Figure 12.5: Container Registry


    # Kubernetes


    Container orchestration is an automation of the operational process needed to
    run containerized workloads and services. It automates tasks like deployment,
    scaling up-down, lifecycle management, load balancing, configuration, security,
    resource allocation, health monitoring, and networking of containers.


    Kubernetes (also known as K8s or Kube) is an open-source platform for container
    orchestration. It allows the application to scale on the fly, without interrupting
    the application running in production. It creates multiple replicas of containerized
    applications quickly to handle increased traffic and automatically reduces the
    number of replicas when traffic decreases.


    Deployment on Kubernetes creates Pods with containers inside them. Pods are the
    smallest unit in the Kubernetes environment. A Pod can have one or more containers.
    It always runs on a Node; however, a Node can have multiple Pods. A Node is just
    a worker (VM or physical machine) in a Kubernetes environment. All nodes are managed
    by a control plane.'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'Every Node runs the Kubelet and container runtime, such as Docker. Kubelet
    is the medium of communication between the control plane and the Node. It also
    manages Pods and running containers inside the Node. Container runtime such as
    Docker will pull the image from the registry and it will run the containerized
    application.


    # Google Kubernetes Engine (GKE)


    Google Kubernetes Engine (GKE) offers the infrastructure to manage, deploy, and
    scale containerized applications. The underlying architecture of GKE consists
