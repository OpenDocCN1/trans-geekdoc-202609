    # pass statement


    In Python, the pass statement acts as a placeholder. If you are planning to add
    code later in loops, function definitions, class definitions, or if statements,
    you can write a pass to avoid any errors as it does nothing. It allows developers
    to write the logic or condition afterward and continue the execution of the remaining
    code.


    Syntax:


    ```

    if condition:

    pass

    ```


    # Example: 1.11 Pass statement


    ```

    1. num = 10

    2. if num % 2 == 0:

    3.     pass

    ```


