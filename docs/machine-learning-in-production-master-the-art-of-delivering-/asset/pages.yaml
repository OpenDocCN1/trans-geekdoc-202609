  md: 'You can check the status of NGINX using the following command:


    ```

    sudo service nginx status

    ```


    Now, go to the following path:


    ```

    cd /etc/nginx/sites-enabled/

    ```


    > Note: NGINX configuration files do not have any extension, and every line should
    be closed using ; (semicolons).


    Create a new configuration file for the Flask app:


    ```

    sudo nano flask_app

    ```


    Then, add the following snippet and save the file:


    ```

    1. server{

    2.     listen 80;

    3.     server_name 0.0.0.0;

    4.

    5.     location / {

    6.         proxy_pass http://unix:/home/suhas/webapi/flask/

    flaskapp.sock;

    7.     }

    8. }

    ```


    Here, you are dictating NGINX to listen to port **80**. Inside the location block,
    pass the request to the socket using **proxy_pass**. After changing the NGINX
    file, restart the NGINX service using the following command:


    ```

    sudo service nginx restart or sudo systemctl restart nginx

    ```


    You can check the status of NGINX using the following command:


    ```

    sudo service nginx status

    ```


    Go to the directory where the _app.py_ file is located and run the following command
    to start the Gunicorn server:


    ```

    gunicorn3 app:app

    ```


    Open a new tab in the browser and enter the IP in the address bar. You should
    see the Flask app up and running.'
