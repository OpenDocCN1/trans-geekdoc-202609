    Figure 5.5: MLflow components


    This chapter will cover each component’s functionality with examples.


    # MLflow tracking


    MLflow tracking is an API and UI for logging parameters, code versions, metrics,
    and artifacts when running your machine learning code and for visualizing the
    results.


    MLflow captures the following information in the form of runs, where each run
    means executing a block of code:


    +   - **Start and end time:** It records the start and end times of an experiment.

    +   - **Source:** It can be the name of the file to launch the run or the MLproject
    name.

    +   - **Parameters:** They contain the data in key-value pairs. These are nothing
    but the model input parameters you want to capture, such as the number of trees
    used in a random forest algorithm. For instance, `n_estimators` is key, and its
    value is 100. You need to call MLflow’s `log_param()` to store the parameters.

    +   - **Metrics:** A metric is used to measure the performance of the model, such
    as the accuracy of the model. It holds the data in a key-value pair; however,
    the value should be numeric only. You need to call MLflow’s `log_metric()` to
    store the metric.'
