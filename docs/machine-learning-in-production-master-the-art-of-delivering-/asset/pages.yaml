  md: '# Data structures


    Data structures are nothing but particular ways of storing and managing data in
    memory so that it can be easily accessed and modified later. Python comes with
    a comprehensive set of data structures, which play an important role in programming
    because they are reusable, easily accessible, and manageable.


    # Common data structures


    You will study some of the common data structures in this section.


    # Array


    Arrays are collections of homogeneous items. One can use the same data type in
    a single array.


    # Example: 1.2 Array data type


    ```

    1. import array as arr

    2.

    3. my_array = arr.array("i", (1, 2, 3, 4, 5))

    4.

    5. print(my_array)

    6. array(''i'', [1, 2, 3, 4, 5])

    7.

    8. print(my_array[1])

    9. 2

    ```


    # Dictionary


    Dictionaries are defined as comma separated **key:value** pairs enclosed in curly
    braces.


    # Example: 1.3 Dictionary data type


    ```

    1. my_dict = {''name'': ''Adam'', ''emp_id'': 3521, ''dept'': ''Marketing''}

    2. print(my_dict[''name''])

    3. Adam

    ```


    # List


    It is a collection of heterogeneous items enclosed in square brackets. One can
    use the same or different data types in a list.'
  merge: -1
  img_proc: true
