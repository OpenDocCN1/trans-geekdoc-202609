    # service.yaml


    This file connects the containerized application to the end user. The role of
    service.yaml is to expose an interface to a Pod created by deployment.yaml, which
    enables network access between cluster and service. It exposes the deployed application
    to the external world. Port 8000 of containerized application is mapped with port
    80. In ports, you can specify more than one port. In this case, the type of service
