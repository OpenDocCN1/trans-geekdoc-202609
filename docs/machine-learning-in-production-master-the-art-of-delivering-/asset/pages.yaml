    # Figure 12.8: Kubernetes cluster


    All manifest files contain the apiVersion field. Each Kubernetes configuration
    file has three sections: metadata, specification, and status. Metadata and specification
    are provided by the developers in the configuration files; however, the status
    part is managed by Kubernetes. For instance, if 2 replicas are declared but only
    one replica is up and running, then Kubernetes scrutinize the status and creates
    one more replica to match the desired state and the actual state. As shown as
    follows, Kubernetes configuration files are placed in the k8s directory. The labels
    and selectors are responsible for connecting service and deployment files. The
    same labels should be used in the service.yaml and deployment.yaml files for successful
    communication between service and deployment.


    ```

    k8s

    |-- deployment.yaml

    |-- service.yaml

    ```


    # deployment.yaml


    This file contains the configuration of Kubernetes deployment, such as the number
    of replicas to be created and the container image to be deployed. The role of
    deployment.yaml is to launch a Pod with a containerized app and ensure that the
    necessary number of replicas are always up and running in the Kubernetes cluster.
    In the following file, a template is a blueprint for a Pod. It has its own metadata
    and specification. In this case, the replicas field is set to 2, which means it
    will create two replicas of the Pods.


    +   1. apiVersion: apps/v1

    +   2. kind: Deployment

    +   3. metadata:'
