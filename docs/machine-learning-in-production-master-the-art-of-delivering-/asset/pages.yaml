- pgno: 445
  md: 'place in the model training stage or the production stage. In this chapter,
    you will get familiar with different types of attacks so that you can implement
    adequate solutions to prevent them.


    Following are the terms related to model security:


    +   - **Poisoning**: Passing malicious data to the training process aiming to
    change the model output

    +   - **Extraction**: Reconstructing a new model from the target model that will
    function the same as the targeted model

    +   - **Evasion**: Attempting to change the label to a particular class by making
    small variations in input

    +   - **Inference**: Figuring out whether a specific dataset was part of the training
    data

    +   - **Inversion**: Getting information about training data from the trained
    model by reverse engineering


    # Adversarial attack


    It is a method of generating hostile data inputs. Attackers intentionally send
    malicious data to the model so that the model makes incorrect predictions. As
    the model learns the new data patterns, this attack causes an error in the predictions
    of the model. This malicious input data may seem normal to humans; however, small
    changes in input data may have a large impact on model predictions.


    Adversarial attacks can be classified into two main categories based on the goal
    of attackers:


    +   - **Targeted attacks**: Attackers attempt to change the label to a particular
    target. For this, they can change the input data source to a specific target.
    It requires more time and effort.

    +   - **Non-targeted attacks**: Attackers do not have any specific target that
    the model should predict. However, they change the label without any specific
    target. It requires less time and effort.


    Attackers can use the following methods for adversarial attacks:


    +   - **Black-box method**: In this method, attackers can send the input data
    to the model and get the output based on it.

    +   - **White-box method**: In this method, the attacker is aware of almost everything
    about the ML model, such as training data and the weights assigned to features.'
  merge: -1
  img_proc: true
- pgno: 446
  md: '# Data poisoning attack


    In a data poisoning attack, attackers have access to input or source data. They
    change the input data in such a way that the model will make incorrect predictions
    that are unreliable for making any business decisions or taking any action. Attackers
    can add some noise to the original data to cause alterations in the prediction
    of the model. This attack targets the training data and modifies it intelligently.


    # Distributed Denial of Service attack (DDoS)


    It refers to passing complex data to models that will take more time to make predictions.
    This type of attack limits the use of models for the users. For this, attackers
    can inject some malware to control the system or server.


    # Data privacy attack


    Data privacy refers to the confidentiality of Personally Identifiable Information
    (PII) and Personal Health Information (PHI). Attackers attempt to learn this type
    of sensitive information through this type of attack. It can be information about
    the model or training data. ML models like Support Vector Machines (SVMs) may
    leak the information, as support vectors are data points from training data.


    Data privacy attacks can be broadly classified into the following categories:


    +   Membership inference attack: The goal of this attack is to determine whether
    input X is part of the training data. Mostly, shadow models are used in this type
    of privacy attack. Shadow model training uses a shadow dataset in order to imitate
    the target model. The output of the shadow models is then passed as an input to
    the meta-model. Finally, the output of the meta-model is used to extrapolate properties
    of training data or model. Over-fitted models are prone to data privacy attacks.


    +   Input inference attack: It is also known as model inversion or data extraction
    attack. It is the most common type of attack. The goal of this attack is to extract
    information from the training dataset by reverse engineering the model. It can
    also target learning the statistical properties of input data, such as probability
    distribution. Attackers can attempt to learn the features that are not encoded
    explicitly while training the model.


    +   Model extraction attack: It is also known as a parameter inference attack.
    The goal of this attack is to learn the hyper-parameters of the model and then
    reconstruct the model that behaves like the targeted model. Interestingly, over-fitted
    models are difficult to extract due to high prediction errors based on test data.'
  merge: -1
  img_proc: true
- pgno: 447
  md: '# Mitigate the risk of model attacks


    The ML pipeline can be broadly divided into two phases: the training phase and
    the test phase. You can address various ML model attacks based on these phases.


    # Training phase


    A data scientist performs activities like data gathering, data cleansing, feature
    engineering, choosing suitable algorithms, hyperparameter tuning, and model building.
    Attackers target this phase via attacks like data poisoning. If a model is trained
    on poisoned data, you cannot rely on its predictions.


    You can implement the following techniques to mitigate the risk of attacks during
    the training phase:


    +   - Data encryption

    +   - Protect the integrity of training data

    +   - Robust statistics

    +   - Data sanitization


    # Test phase


    In this phase, attackers target ML models. Model extraction attacks are common
    among attackers. They attempt to determine whether input X is part of training
    data or try to steal model parameters defined during the training phase.


    The following techniques can be implemented to mitigate the risk during the test
    phase:


    +   - Adversarial training

    +   - Autoencoders

    +   - Distillation

    +   - Ensemble techniques

    +   - Limit the number of requests per user


    You can use a Python library Adversarial Robustness Toolbox (ART) and a command-line
    tool Counterfit for ML model security. This library will defend against the most
    common types of ML attacks. It also supports popular ML frameworks, libraries,
    and data types.


    # A/B testing


    A/B testing is widely used in marketing, website designs, and email campaigns
    to learn and understand user preferences. The goal of A/B testing is to increase
    the conversion rate, success rate, revenue, and so on.'
  merge: -1
  img_proc: true
- pgno: 448
  md: 'A/B testing involves splitting the audiences or customers from the population
    into equal sets. These sets will route to the control version and the experimental
    version. The control version is the existing version, whereas the experimental
    version is the new or challenger version. First off, define the problem statement
    for the A/B test, the null hypothesis, and the alternative hypothesis for the
    problem statement. Next, design the experiment to track and analyze the metric,
    and then run and validate the experiment. After that, compare the statistics of
    the output. Finally, make the decision based on the results. If the A/B test is
    not performed correctly, then its output will be unreliable.


    Data scientists perform an offline evaluation of ML models by dividing data into
    training and validation sets. However, the A/B test allows you to perform the
    online evaluation of ML models by measuring business metrics or success rates.
    The A/B test can be implemented when you perform operations on training data,
    such as scaling and normalizing or applying different algorithms, and hyper-parameters
    while model building. An MLOps engineer or a data scientist can deploy multiple
    models simultaneously to test models in production. Google Cloud (GCP) and Amazon
    SageMaker allow the deployment of multiple models into the production behind the
    same endpoint to decide which model is performing better from the business point
    of view.


    A Multi-Armed Bandit (MAB) is an advanced version of A/B testing. It is more complex
    than the A/B test, as it uses ML algorithms while dynamically allocating more
    traffic to the better-performing version and less traffic to the underperforming
    version based on the data.


    # MLOps is the future


    The field of Machine Learning is booming. Industries are making ML a critical
    part of the business development process, and many new challenges are being addressed
    by the ML system.


    MLOps can handle the complexity and scalability of ML models. Hence, the demand
    for MLOps is increasing across the industry. There is a shortage of MLOps engineers
    in the industry, as MLOps is an intersection of Machine Learning and software
    development. Companies need to set up separate teams for MLOps engineers, or they
    can upskill their data scientists to execute MLOps tasks. MLOps cut costs and
    reduce the manual efforts of the overall ML life cycle. This allows data scientists
    and ML engineers to focus on other productive tasks.


    MLOps is getting more popular than DevOps. Your model may be performing well in
    the local environment; however, if it is not reaching end users or customers,
    then its business impact is low. More than 85% of ML models are not deployed into
    the production environment. MLOps engineers can fill the gap between research'
