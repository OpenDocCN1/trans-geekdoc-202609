    # Virtual environments


    While working on multiple projects, **ProjectA** requires **PackageY_version2.6**,
    whereas **ProjectB** requires **PackageY_version2.8**. In such scenarios, you
    can’t keep both versions of the same package globally.


    The virtual environment is the solution. It allows you to isolate dependencies
    for each project. You can create the virtual environment anywhere and install
    the required packages in it.


    Without the virtual environment, packages are installed globally at the default
    Python location:


    ```

    /home/suhas/.local/lib/python3.6/site-packages

    ```


    With the virtual environment, packages are installed inside the virtual environment’s
    Python location:


    ```

    /home/suhas/code/packages/venv_package/lib/python3.6/site-packages

    ```


    Installing different versions of the same package in different virtual environments
    for different projects is possible. You can have five packages in **venv1** and
    nine packages in **venv2**.


