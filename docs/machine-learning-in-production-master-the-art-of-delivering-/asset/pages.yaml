    and other useful information. The MLflow project component helps you to manage
    dependencies, and it can be run from the GitHub repository. The MLflow registry
    acts as a central location for registered models and changing the states, such
    as staging and production.


    In the next chapter, you will learn how to use a docker for portability in transferring
    ML projects from one machine to another or to the server.


