  md: '# CHAPTER 3 Challenges in ML Model Deployment


    # Introduction


    A study found that 87% of Data Science and Machine Learning projects never make
    it into production. In this chapter, you will study common problems you may face
    while deploying machine learning models.


    Deploying ML models is entirely based on your end goals, such as frequency of
    predictions, latency, number of users, single or batch predictions, and accessibility.


    # Structure


    +   - This chapter covers the following topics:

    +   - ML life cycle

    +   - Types of model deployment

    +   - Challenges while deploying models

    +   - MLOps

    +   - Benefits of MLOps'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Objectives


    This chapter will cover the various approaches to deploy ML models in production.
    After studying this chapter, you should be able to use MLOps to overcome challenges
    in the manual deployment of ML models. You will also study the different phases
    of the ML life cycle in this chapter.


    # ML life cycle


    The machine learning life cycle is a periodic process. It starts with the business
    problem, and the last stage is monitoring and optimization. However, it is not
    so straightforward. For instance, if there is a modification in the business requirement,
    you may have to execute all the stages of the ML life cycle again. In some scenarios,
    you may have to go back to the previous stages of the ML life cycle to fulfill
    the criteria of that specific stage. For example, if you get lower accuracy of
    the model than the threshold, you need to revisit the previous stages to improve
    the accuracy. It can be done by adding new features, optimizing model parameters,
    and so on.


    The following figure shows the different stages of the ML life cycle.


    ![](img/cc4299656808e62a294f1843a1e18e72_54_0.png)


    Figure 3.1: ML life cycle'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# ## Business impact


    The first and most important stage is defining an idea and its impact on the project.
    Starting a project without considering the business impact, complexities, expected
    results, and time required may lead to delayed delivery, repetitive work, and
    poor resource utilization.


    The business impact could be anything, like an increase in revenue, a decrease
    in expenses, or reducing human errors. One needs to understand the business pain
    points and try to assess the possibilities of having an ML solution that will
    solve multiple business problems. In some scenarios, getting quick results is
    more important.


    # ## Data collection


    Data collection is the process of gathering data from one or multiple sources.
    Although it looks easy, it is not. Before collecting the data, you need to answer
    the following questions:


    +   - What data needs to be collected?

    +   - What are the different sources of the data?

    +   - What is the type of data?

    +   - What is the size of the data?


    In the real world, you may have to collect data from different sources, like relational
    databases, NoSQL databases, the web, and so on. To avoid any glitches or delays,
    you must build the pipeline for data collection.


    For better results, you can combine the available data with external data, such
    as social media sites, weather data, and public data.


    Here are a few ways to collect data:


    +   - E-surveys

    +   - Authorized web scraping tool

    +   - Click data

    +   - Social media platforms

    +   - Website tracking

    +   - Subscription/ registration data

    +   - Image data - CCTV/ camera'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   - Voice data - customer care


    Set up a meeting with clients/stakeholders and domain experts to get to know the
    data. They will help you understand the data so that you can decide which data
    needs to be collected for model building.


    # Challenges:


    +   - Data is scattered in different locations

    +   - No uniformity in the data

    +   - Combining data from different sources

    +   - 3Vs: volume, velocity, variety

    +   - Data storage


    # Data preparation


    The data collected usually is in a raw format. One needs to process it so that
    it can be used for further analysis and model development. This process of cleaning,
    restructuring, and standardization is known as data preparation.


    Around 70%-80% of the time goes into this stage of the ML project. This is a tedious
    task, but it is unavoidable. Data reduction technique is used when you have a
    large amount of data to be processed.


    Data preparation aims to transform the raw data into a format so that EDA, that
    is, Exploratory Data Analysis, can be performed efficiently to gain insights.


    # Challenges:


    +   - Missing values

    +   - Outliers

    +   - Disparate data format

    +   - Data standardization

    +   - Noise in the data


    # Feature engineering


    In this stage, you prepare the input data that can be fed to the model, which
    makes it easier for the machine learning model by deriving meaningful features,
    data transformations, and so on.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'Suppose you are combining the features to create a new one that could help
    ML models to understand the data better and identify hidden patterns. For instance,
    you mix sugar, water, and lemon juice to make lemonade rather than consuming them
    separately.


    Here are a few feature engineering techniques:


    +   - Label encoding

    +   - Combining features to create a new one

    +   - One hot encoding

    +   - Imputation

    +   - Scaling

    +   - Removing unwanted features

    +   - Log transformation


    # Challenges:


    +   - Lack of domain knowledge

    +   - Creating new features from the existing set of features

    +   - Selecting useful features from a set of features


    # Build and train the model


    ML model building requires the previous stages to be completed successfully. First,
    you should have the training, test, and validation sets ready (for supervised
    algorithms). After a baseline model is created, it can be compared with new models.


    This process involves the development of multiple models to see which one is more
    efficient and gives better results. You must consider the computing resource requirements
    for this stage.


    Once the final model is built on the training data, the next step is to check
    its performance against the unseen, that is, the test data.


    # Challenges:


    +   - Model complexity

    +   - Computational power

    +   - Identifying a suitable model

    +   - Model training time'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# # Test and evaluate


    Here, you will build the test cases and check how the model is performing against
    the new data. Pre-production or pre-deployment activities are done here. Performance
    results are analyzed and, if required, you have to go back to the previous stages
    to fix the issue.


    After passing this stage, you can push the ML model into the production phase.


    # ### Challenges:


    +   • Insufficient test data

    +   • Reiterating the process until the output fulfills the requirements

    +   • Identifying the platform to evaluate model performance on real data

    +   • Deciding which test to use

    +   • Logging and analyzing test results


    # # Model deployment


    This refers to exposing the trained ML models to real-world users. Your model
    is performing well on test and validation sets, but if another system or users
    cannot utilize it, then it does not meet its purpose.


    For instance, you have built a model to predict customers who are likely to churn,
    but it is not done until you deploy a model that will start delivering the predictions
    on real data.


    Model deployment is crucial because you have to consider the following factors:


    +   • Number of times predictions to be delivered

    +   • Latency of the predictions

    +   • ML system architecture

    +   • ML model deployment and maintenance cost

    +   • Complexity of infrastructure

    +   • This will be covered in detail in the following chapters.


    # ### Challenges:


    +   • Portability issues

    +   • Scalability issues

    +   • Data-related challenges

    +   • Security threats'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# # Monitoring and optimization


    Last but not least, monitoring and optimization is the stage where observing and
    tracking are required. You will have to check the model performance as it degrades
    over time.


    If the model metrics, such as accuracy, go below the predefined threshold, then
    it needs to be tracked, and a model needs to be retrained, either automatically
    or manually. Similarly, input data needs to be monitored because it may happen
    that the input data schema does not match or it contains missing values.


    Apart from this, the infrastructure metrics, such as RAM, free space, and system
    issues, need to be tracked.


    It is good to maintain the log records of metrics, intermediate outputs, warnings,
    and errors.


    **Challenges:**


    +   - Data drift

    +   - Deciding the threshold value for different metrics

    +   - Anomalies

    +   - Finalizing model evaluation metrics that need to be tracked


    # # Types of model deployment


    There are various ways to deploy ML models into production; however, there is
    no generic way to do it. This section will walk you through popular ways to deploy
    ML models.


    # # Batch predictions


    This is the simplest method. Here, the ML model is trained on static data to make
    predictions, which are saved in the database, such as MS-SQL, and can be integrated
    into existing applications or accessed by the business intelligence team.


    Generally, ML model artifacts are used for making predictions as it saves time.
    Model artifact needs to be updated on new data for better predictions.


    This method is well-suited for small organizations and beginners. You can schedule
    the cron job to make predictions after certain time intervals.


    **Pros:**


    +   - Affordable

    +   - Less complex'
  merge: -1
  img_proc: true
- pgno: 60
  md: '+   - Easy to implement


    # Cons:


    +   - Moderate latency

    +   - Not suitable for ML-centric organizations


    # Web service/REST API


    Web service/REST API is the popular method for deploying models. Unlike batch
    predictions, it does not process a bunch of records; it processes a single record
    at a time. In near real-time, it takes the parameters from users or existing applications
    and makes predictions.


    It can take inputs as well as return the outputs in JSON format. JSON is a popular
    and compatible format that makes it easy for software or website developers to
    integrate it into existing applications.


    When an event gets triggered, REST API passes the input parameters to the ML model
    and returns the predictions.


    # Pros:


    +   - Easy to integrate

    +   - Flexible

    +   - Economical (pay-as-you-go plan)

    +   - Near real-time predictions


    # Cons:


    +   - Scalability issues

    +   - Prone to security threats


    # Mobile and edge devices


    When there are situations such as actions/ decisions that need to be taken immediately
    or there is no internet connectivity, the ML model needs to be deployed on these
    devices.


    Edge devices include sensors, smartwatches, and cameras installed on robots.


    This type of deployment is different from the preceding methods. In this, input
    data may not go to remote servers for making predictions. There are cloud service
    providers, such as Microsoft Azure, that offer the required infrastructure for
    this. Tiny Machine Learning (TinyML) is another such alternative capable of performing
    on-device sensor data analytics at an extremely low power.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'ML models deployed on mobile devices are useful. Developing ML-based android
    / IOS applications, such as voice assistant or camera image-based attendance,
    are use cases of ML models deployed on mobiles.


    +   Pros:

    +   * Low power requirement

    +   * Cost-effective

    +   * Smaller sizes


    +   Cons:

    +   * Limited hardware resources

    +   * A complex and tedious process


    # Real-time


    +   * Here, analysis is to be done on streaming data. In this approach, the user
    passes input data for prediction and expects (near) real-time prediction. This
    is quite a challenging approach compared to the ones you studied previously.

    +   * You can decrease the latency of the predictions by small-sized models, caching
    predictions, No-SQL databases, and so on.


    +   Pros:

    +   * Very low or no latency

    +   * Can work with streaming data


    +   Cons:

    +   * Complex architecture requirements

    +   * Computationally expensive


    # Challenges in deploying models in the production environment


    Deploying machine models in production is crucial. While deploying ML models,
    technical challenges are not the only ones. The following are the common challenges
    you may come across.


    # Team coordination


    If you are working in a small organization or a small data science team, you might
    need to play different roles and will be responsible for end-to-end model development.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'However, in large organizations, there are separate teams for different stages.
    These teams interact with each other to carry out the entire process. Most of
    the time, the production or the succeeding team is not aware of the preceding
    stages. Lack of coordination and miscommunication can lead to the failure of the
    ML life cycle.


    # Data-related challenges


    Usually, data scientists develop models on a limited amount of data in the experimentation
    phase, but they might face challenges while deploying models in the production
    environment as large-scale data can impact the model performance.


    New data keeps on changing its behavior, but the data preparation/pre-processing
    stage may not be able to handle these new issues. For instance, string records
    are present in a numeric column. At times, re-running the experiments by fixing
    the issues is required to get reliable results.


    # Portability


    Portability issues arise when moving the codebase from your local machine to the
    server and vice versa. For instance, suppose you developed a model and want to
    move the code to the server to rerun the model. However, you may face issues,
    like the library not being compatible with the current OS version, and the line
    of code working with Python’s x version and not with the currently installed version.


    In such cases, creating a virtual environment and re-installing the packages are
    required.


    # Scalability


    Suppose you deployed models using web service and 100x more users are trying to
    access the same API. REST API may stop responding or the latency may increase.


    Managing ML models on a small scale is relatively easy compared to large organizations,
    where multiple models are being served on a scale. Deploying models on a scale
    is still a new thing for many organizations.


    # Robustness


    In a nutshell, the robustness of ML models is measured by the reliable output
    delivered despite the variations in the input data. In the real world, delivering
    100% accuracy is nearly impossible. So, one can say that prediction error on unseen
    data should be close to training error.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'User behavior can be unpredictable. For instance, suppose a model requires
    a string value, but the user provides an alphanumeric value. In such scenarios,
    the model output might not be reliable.


    # Security


    ML systems are prone to security breaches. They may be forced to deliver false
    predictions by deliberately providing poisonous data or adding noise to the data.
    The models perform better when trained on new data. However, a person or a group
    of people can deliberately pass the poisonous data to the model, intending to
    change the model predictions.


    Data security is at risk as the model keeps training on new data. While training
    the model, attackers can steal sensitive information.


    # MLOps


    MLOps combines machine learning processes and best practices of DevOps to deliver
    consistent output with automated pipelines and management. MLOps has been an emerging
    space in the industry for the last few years.


    The following figure shows the increasing popularity of MLOps over time.


    ![](img/cc4299656808e62a294f1843a1e18e72_63_0.png)


    Figure 3.2: The rise of MLOps. Source: Google trends


    MLOps bridges the gap between machine learning experiments and model deployment
    in the production environment. Nowadays, many data scientists are forced to execute
    the MLOps processes manually.


    The MLOps process involves multiple professionals, and data scientists play a
    critical role. Subject matter experts understand and collect the requirements
    from the client. Then, data engineers collect the data from multiple sources and
    execute the ETL jobs. Once this is done, data scientists build the models and
    the DevOps'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'team builds the CI/CD pipeline and monitors it. Finally, feedback is sent to
    the data scientist or the concerned team for validation.


    MLOps streamline and automate this process to speed up delivery and build efficient
    products / services.


    MLOps is a combination of three disciplines as shown in the following figure


    ![](img/cc4299656808e62a294f1843a1e18e72_64_0.png)


    *Figure 3.3: Machine learning operations*


    MLOps is different from DevOps because the code is usually static in the latter,
    but that’s not the case in MLOps.


    In MLOps, the model keeps training on new data, so a new model version gets generated
    recurrently. If it meets the requirements, it can be pushed into the production
    environment. This is why MLOps requires **Continuous Training** (CT) along with
    **Continuous Integration** (CI) and **Continuous Delivery/Deployment** (CD).


    In DevOps, developers write the code as per the requirements and then release
    it to the production environment, but in the case of machine learning, developers
    first need to collect the data and clean it. They write code for model building
    and then build the ML model. Finally, they release it into the production environment.


    # # Benefits of MLOps


    MLOps processes not only speed up the ML journey from experiments to production,
    but also reduce the number of errors. MLOps automates Machine Learning and Deep
    Learning model deployment in a production environment. Moreover, it reduces dependency
    on other teams by streamlining the processes.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Efficient management of ML life cycle


    MLOps takes care of the ML life cycle by following the fundamental principles
    of machine learning projects. It is based on agile methodology. An automated CI/CD
    pipeline helps speed up the process of retraining models on new data, testing
    before the deployment, monitoring, and feedback loops. The current stage depends
    on the output of the preceding stages, so there are fewer chances of issues in
    the deployment process.


    If the amount of traffic or number of requests increase for a deployed model,
    it increases the required resources; similarly, the required resources decrease
    when the amount of traffic or number of requests reduces.


    There are many platforms (like GitHub Actions) available in the market that help
    you set up MLOps workflow.


    # Reproducibility


    > Developer: It works on my machine.


    > Manager: Then, we are going to ship your machine to the client.


    +   • Reproducibility plays a crucial role in the ML life cycle. While transferring
    the code files to another machine or server, reproducibility reduces debugging
    time. MLOps works on **DRY (Don’t Repeat Yourself)** principles and allows you
    to get consistent output.


    +   • Given the same input, the replicated workflow should produce an identical
    output. For this, developers use container orchestration tools like Docker so
    that it will create and set up the same environment with dependencies in another
    machine or server for consistent output.


    # Automation


    Mostly, developers deploy models several times before the final deployment to
    ensure that everything is in place and the output is as expected. Without automation,
    this would be a time-consuming and tedious process. Automation increases productivity,
    as you are less likely to test, deploy, scale, and monitor ML models manually.


    At every stage, certain rules and conditions are implemented, and the model moves
    to the next stage only when these conditions are met. This reduces the active
    involvement of other teams every time you are planning to deploy it in production.


    There is a low or no delayed deployment with testing since one inter-team dependency
    is reduced.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'After making the required changes in the code, speedy deployment is done in
    an automated fashion (if it passes the test cases and satisfies the conditions).
    This increases the overall productivity of the team.


    # Tracking and feedback loop


    Tracking model performance, metrics, test results, and output becomes easy if
    you set up MLOps workflow properly. The model’s performance may degrade over time,
    hence one may need to retrain the model on new data.


    Thanks to tracking and feedback loops, it sends alerts about the model’s performance,
    metrics, and so on.


    For instance, if the feedback loop sends the information that model accuracy has
    dropped below 68%, then the model needs to be retrained. Again, it will check
    the model’s performance. If it is above the threshold level, it will pass on to
    the next stage; else, the model needs to be recalibrated using the latest data.


    # Conclusion


    In this chapter, you studied the key challenges faced while deploying ML models
    in production. At the beginning of this chapter, you learned how the ML life cycle
    works, and you understood its different stages and their challenges. Next, you
    got exposure to different types of model serving techniques and looked at their
    pros and cons. Then, you analyzed the challenges you may face while deploying
    ML models in production. Finally, you learned the benefits of MLOps.


    In the next chapter, you will learn to develop, build and install custom python
    packages for ML models using a use case.


    # Points to remember


    +   - MLOps bridges the gap between the Machine Learning experiments stage and
    its model deployment in the production environment.

    +   - Model deployment strategy depends on business requirements, users, and applications.

    +   - MLOps combines machine learning processes and best practices of DevOps to
    deliver consistent output with automated pipelines and management.'
  merge: -1
  img_proc: true
