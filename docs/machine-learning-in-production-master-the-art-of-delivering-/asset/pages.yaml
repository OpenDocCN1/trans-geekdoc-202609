  md: '# CHAPTER 2

    Git and GitHub Fundamentals


    # Introduction


    It is difficult to maintain multiple versions of files while working in a team.
    Git solves this problem by allowing developers to collaborate and share files
    with other team members. This chapter covers the most needed basic Git and GitHub
    concepts that form the foundation of this book. It explains Git configuration,
    forking Git repo, pushing your codebase to GitHub, and the cloning process. In
    addition, it covers an introduction to GitHub Actions, common Git commands with
    syntax, and examples. Maintaining multiple versions of files when working in a
    team can be difficult, but Git is the solution.


    # Structure


    The following topics will be covered in this chapter:


    +   • Git concepts

    +   • Common Git workflow

    +   • Install Git and create a GitHub account

    +   • Common Git commands

    +   • Let''s Git'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# # Objectives


    After studying this chapter, you should know how to execute Git commands and connect
    to remote GitHub repositories. Understand and execute Git processes. You should
    know how to push, fetch, and revert changes to the remote Git repository, and
    you should be familiar with how to install and perform the basic configuration
    of Git on your machine or server.


    # # Git concepts


    Git is an open-source Distributed Version Control System (DVCS). A version control
    system allows you to record changes to files over a period.


    Git is used to maintain the historical and current versions of source code. In
    a project, developers have a copy of all versions of the code stored in the central
    server.


    Git allows developers to do the following:


    +   - Track the changes, who made the changes, and when

    +   - Rollback/restore changes

    +   - Allow multiple developers to coordinate and work on the same files

    +   - Maintain a copy of the files at the remote and local level


    The following image depicts Git as a VCS in a team where developers can work simultaneously
    on the same files and keep track of who made the changes. Here, F1, F2, and F3
    are file names.


    ![](img/cc4299656808e62a294f1843a1e18e72_42_0.png)


    Figure 2.1: Git scenario in team'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Git + Hub = GitHub


    Git and GitHub are separate entities. Git is a command-line tool, whereas GitHub
    is a platform for collaboration. You can store files and folders on GitHub and
    implement changes to existing projects. By creating a separate branch, you can
    isolate these changes from your existing project files.


    GitHub Actions makes it easy to automate all your software workflows with Continuous
    Integration/Continuous Deployment. You can build, test, and deploy the code right
    from GitHub.


    # Common Git workflow


    The following figure depicts the general Git workflow. It covers operations like
    creating or cloning the Git repository, updating the local repository by pulling
    files from the remote repository, and pushing the local changes to the remote
    repository.


    ![](img/cc4299656808e62a294f1843a1e18e72_43_0.png)


    Figure 2.2: Git workflow'
