    # # Set up an AWS account


    First of all, set up an AWS account; however, this is a one-time activity. It
    is ready to use immediately on log in.


    The AWS Free Tier provides customers the ability to explore and try out AWS services
    free of charge up to specified limits for each service. The Free Tier consists
    of three different types of offerings, a 12-month Free Tier, an Always Free offer,
    and short-term trials.


    # ## Step 1: Create or log in to the existing AWS account


    Create an AWS account (if you don''t have one) and sign in. A free trial account
    can be created on the AWS platform at https://aws.amazon.com/free.


    First, click on the Create a Free Account button. Next, provide the login details,
    such as email ID, password, and AWS account name. Then, select the account type
    (Professional or Personal) and provide contact information. After that, issue
    PAN and payment details. Finally, complete the verification process on the identity
    verification page.


    After a few minutes, the account will be activated and ready to use. Select a
    plan as per your requirements.


    # ## Step 2: Create an IAM user and provide the required permissions


    After signing in to the AWS Management Console, open the IAM console - https://console.aws.amazon.com/iam/.
    IAM stands for Identity and Access management. Next, click on Users in the navigation
    pane and choose Add users. Then, provide the user name for that user and choose
    the access type. After that, select the existing policies from the attached existing
    policies or create a new one for that user. In this scenario, Administrator access
    is given to the IAM user. Tags are optional. Finally, review and complete the
    process. Do not forget to save the user details like Access key ID, Secret access
    key, and user name. In this case, an IAM user will be used to execute all the
    tasks. Hit the Create user button and complete the process.'
