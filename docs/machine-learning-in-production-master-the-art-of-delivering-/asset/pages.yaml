    files for Kubernetes in this chapter. By the end of it, you should be able to
    create triggers in Cloud Build for the automated deployment of ML apps.


    # Google Cloud Platform (GCP)


    **Google Cloud Platform** (**GCP**) comprises cloud computing services offered
    by Google, which uses the same infrastructure as the one used by YouTube, Gmail,
    and other Google platforms or services. The platform offers a range of services
    for compute, Machine learning and AI, networking, IoT, and BigData. Here are a
    few services offered by the GCP:


    +   - Google’s compute engine provides VM instances to run the code and deploy
    the apps.

    +   - AI and Machine learning services like Vertex AI, which is an end-to-end
    ML life cycle management and unified platform. Data Scientists can upload the
    data, build, train, and test ML models easily.

    +   - AI building blocks, such as Vision AI, help derive insights from images
    using AutoML.

    +   - Container services, such as Container Registry and **Google Kubernetes Engine**
    (**GKE**), manage Docker images and allow developers to build scalable applications.

    +   - BigQuery and data proc to process and analyze large amounts of data.

    +   - Databases, such as Cloud SQL and Cloud Bigtable, store data on the cloud.

    +   - Developer tools, such as Cloud Build, Cloud Source Repositories, and Google
    Cloud Deploy to automate CI/CD process.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '+   - Management tools, such as Deployment Manager and Cost Management, help
    you to track the deployment and cost of tools or services used in projects.

    +   - Networking services, such as **Virtual Private Cloud (VPC)**, let you create
    a virtual private cloud environment within a public cloud. Multiple projects created
    in different regions can communicate with each other without openly communicating
    through the public internet.

    +   - Security services, such as cloud key management, firewalls, and security
    center.

    +   - Storage services, such as Cloud Storage, allow you to store artifacts.

    +   - Serverless computing, such as Cloud Function, is an event-driven serverless
    compute platform. This Function as a Service (FaaS) lets you run the code with
    no server or containers.

    +   - Operations services, such as Cloud Logging and Cloud Monitoring, let you
