  md: '# ## Introduction to Jenkins


    Jenkins is an open-source, modular CI/CD automation tool written in Java that
    comes with several plugins. Jenkins enables the smooth and continuous flow of
    building, testing, and deploying apps with a recently updated or developed codebase.
    It has a large community support and is popular among developers.


    If the build is successful, then Jenkins automatically executes a series of steps
    from the code repository, and if everything goes well, it deploys the application
    to the server.


    Here are some salient features of Jenkins:


    +   - Jenkins is an open-source, free, and modular tool.

    +   - It is created by developers and for developers.

    +   - Jenkins is easy to install, configure and can be installed on Linux, MacOS,
    and Windows.

    +   - A large number of Jenkins plugins are available for popular cloud platforms.

    +   - Jenkins’s master can distribute the load to multiple slaves and enable faster
    processing.


