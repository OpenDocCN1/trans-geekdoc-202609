    Here are the concepts and key features of the model registry:


    +   * **Registered model**: Once the model is registered using MLflow’s UI or
    API, the model is considered a registered model. MLflow’s model registry captures
    model versions and keeps track of the model’s stages (for example, production,
    and staging) and other metadata.

    +   * **Model version**: MLflow’s model registry maintains the version of each
    model after registering it. For instance, if you saved a model name with a classification
    model, then it would be assigned to version 1 by default. However, after saving
    that model with the same name again, it will be saved as version 2.

    +   * **Model stage**: For each model version, you can assign different stages,
    like staging, production, and archived. However, you cannot assign two stages
    to the same version of the model.'
