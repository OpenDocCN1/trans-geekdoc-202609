  md: '# Example: 1.4 List data type


    ```

    1. my_list=[''apple'', 4, ''banana'', 6]

    2. print(my_list[0])

    3. apple

    ```


    # Set


    A set is a collection of unique (non-duplicate) elements enclosed in curly braces.
    A set can take heterogeneous elements.


    # Example: 1.5 Set data type


    ```

    1. my_set = {3,5,6}

    2. print(my_set)

    3. {3, 5, 6}

    ```


    ```

    1. my_set = {1, 2.0, (3,5,6), ''Test''}

    2. print(my_set)

    3. {1, 2.0, ''Test'', (3, 5, 6)}

    ```


    # String


    A string is used to store text data. It can be represented by single quotes ('''')
    or double quotes ("").


    # Example: 1.6 String data type


    ```

    1. print(''The cat was chasing the mouse'')

    2. The cat was chasing the mouse

    ```


    # Tuple


    Tuples are collections of elements surrounded by round brackets (optional), and
    they are immutable, that is, they cannot be changed.


    # Example: 1.7 Tuple data type


    ```

    1. my_tuple_1 = (''apple'', 4, ''banana'', 6)

    2. print(my_tuple_1[0])

    3. apple

    ```


    Tuple can be declared without round brackets, as follows:


    ```

    1. my_tuple_2 = 1, 2.0, (3,5,6), ''Test''

    2. print(my_tuple_2[0])

    3. 1

    ```'
