- pgno: 351
  md: 'Here are some of the widely used compute services offered by AWS that can be
    used as per the business or application requirements. These services will be discussed
    later in the chapter.


    # # Amazon Elastic Compute Cloud (EC2)


    Amazon EC2 is a virtual machine that represents a remote server. Amazon EC2 service
    is grouped under **Infrastructure-as-a-Service (IaaS)**. Amazon EC2 enables applications
    with resizable computing capacity, and these EC2 machines are known as instances.
    You can create multiple instances with different computing sizes. You can even
    upgrade the ram, vCPU, and so on after creation, so you do not need to recreate
    a new instance and configure it again. This is why the elastic term is used.


    # # Amazon Elastic Container Service (ECS)


    Amazon **Elastic Container Service** (**ECS**) enables you to deploy, scale, and
    manage containerized applications. It manages containers and enables developers
    to run containerized applications across the cluster of EC2 instances. However,
    it is not based on Kubernetes. Amazon ECS is free, meaning you don''t need to
    pay for the ECS cluster. However, additional charges are to be paid for EC2 instances
    running in ECS tasks. There are mainly two ways to launch an ECS clusters:


    +   - Fargate Launch

    +   - EC2 Launch


    Amazon ECS is a technology owned exclusively by AWS. ECS easily integrates with
    AWS **Application Load Balancer (ALB)** and **Network Load Balancer (NLB)**.


    # # Amazon Elastic Kubernetes Service (EKS)


    Amazon **Elastic Kubernetes Service** (**EKS**) is a Kubernetes service backed
    by AWS, which enables you to build Kubernetes clusters on AWS without manually
    installing Kubernetes on EC2. Amazon Elastic Kubernetes Service (EKS) allows you
    to manage or orchestrate containers in a Kubernetes environment. You need to pay
    for the EKS cluster, with additional charges for EC2 instances running inside
    the Kubernetes pod. Amazon EKS service set up and manages the Kubernetes control
    plane for you.


    It is a good choice if you are looking for multi-cloud functionality and additional
    features compared to the Amazon **Elastic Container Service** (**ECS**).


    # # Amazon Elastic Container Registry (ECR)


    Amazon **Elastic Container Registry** (**ECR**) allows developers to store, share
    and deploy Docker images on Amazon ECS. It provides security to images stored
    in'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'it. Amazon Elastic Container Registry (ECR) is integrated with Amazon ECS.
    It is similar to the Docker Hub container registry but is managed by AWS. It allows
    you to store private Docker container images in it.


    # AWS Fargate


    Simply put, AWS Fargate is a serverless compute for containers. You pay for the
    usage per minute for the resources used by containers like virtual CPU (vCPU)
    and memory. AWS Fargate is compatible with both Amazon Elastic Container Service
    (ECS) and Amazon Elastic Kubernetes Service (EKS).


    # AWS Lambda


    AWS Lambda is simple and less expensive. It is a serverless and event-driven compute
    service; it is a Function as a Service (FaaS). That means you don’t need to manage
    servers or clusters. Events could be any simple activity, such as a user clicking
    on links to get the latest news. The term Lambda is supposed to be borrowed from
    functions of lambda calculus and programming. Mostly, it comprises three components:


    +   - A function: It is the actual code to perform the task.

    +   - A configuration: It dictates the execution of a function.

    +   - An event source: This is the event that triggers the function. However,
    this component is optional.


    AWS Lambda is a good choice for event-driven programming or when you need to access
    several services.


    # Amazon SageMaker


    AWS also provides a machine learning platform as a service, that is, Amazon SageMaker.
    It removes the overhead of managing and maintaining servers manually. It also
    reduces the time and cost of machine learning model deployment on the AWS cloud.


    Amazon SageMaker is a cloud-based machine learning platform that enables data
    scientists and developers to build, train, tweak, and deploy machine learning
    models in production environments. It uses Amazon Simple Storage Service (S3)
    to store the data and comes with over 15 most commonly used built-in machine learning
    algorithms for training the data. It deploys the ML models to SageMaker endpoints.
    Amazon SageMaker uses the Amazon Elastic Container Registry (ECR) to store container
    images.'
