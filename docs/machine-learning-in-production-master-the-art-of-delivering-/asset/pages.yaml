    # # Container Registry


    Container Registry is a container image managing and storing private container
    images service offered by GCP. It allows users to push and pull container images
    securely. In this case, the Docker container image will be pushed to the Container
    Registry. The Kubernetes engine will pull the image to deploy the ML app on the
