  md: 'The good thing about service over standalone tasks is that if any one of the
    tasks fails or shuts down due to any reason, the service will replace it with
    a new task to maintain the desired number of tasks up and running. The issue with
    a service without a load balancer is that when it replaces a task or creates a
    new one, the public IP will get changed, which makes it a bit difficult to keep
    a track of the latest or running tasks for that service.


    These public IPs can be accessed by the external world through the internet. However,
    you can restrict access to the public IP of tasks by updating inbound rules in
    the security group of service mlapp-sg. Go to the mlapp-sg security group, remove
    inbound rules (if they exist), add a new rule and specify container port, that
    is, 8000 in Port range, and choose the security group of the load balancer, that
    is, mlapp-lb-sg instead of 0.0.0.0/0 or anywhere in the source. Finally, you can
    save the rules. This will restrict the direct access to public IPs of tasks for
    the external world through the internet.


    Let’s check the deployed containerized app with an application load balancer.
    Go to the load balancer page, copy its DNS name, and run it on the browser (paste
    and enter). It should display a text message. This is the root page of the application.


    Then, pass the input data in <ALB DNS name>/docs and check the prediction output,
    as shown in the following figure. Here, you don’t need to pass the port and IP
