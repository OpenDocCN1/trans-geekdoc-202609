    # # Introduction to Amazon Web Services (AWS)


    Amazon Web Services (AWS) is a cloud infrastructure where you can host applications.
    In 2006, AWS started offering IT services to the market in the form of web services.
    AWS is one of the leading cloud service providers.


    # # AWS compute services


    Amazon Web Services (AWS) offers compute services for managing workloads that
    comprise many servers or instances.'
