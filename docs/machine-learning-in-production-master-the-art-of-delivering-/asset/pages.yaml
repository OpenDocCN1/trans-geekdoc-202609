    Observability Platform.


    Following are the salient features of WhyLabs:


    +   - **Minimal setup time**: You can start by installing lightweight open-source
    library whylogs with **pip install whylogs**. In no time, a summary of the dataset
    can be generated, that is, whylogs profiles, which helps you do the following:

    +     - Track changes in datasets

    +     - Visualize the summary statistics of datasets

    +     - Check the data quality by defining data constraints


    +   - **Seamless integration**: It can be integrated with the existing data pipelines,
    model life cycle, model framework, and MLOps Ecosystem easily.


    +   - **Data privacy**: WhyLabs works with a statistical summary of the data created
