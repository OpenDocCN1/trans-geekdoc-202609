- pgno: 460
  md: '# # Machine Learning in Production


    ## DESCRIPTION


    ''Machine Learning in Production'' is an attempt to decipher the path to a remarkable
    career in the field of MLOps. It is a comprehensive guide to managing the machine
    learning lifecycle from development to deployment, outlining ways in which you
    can deploy ML models in production.


    It starts off with fundamental concepts, an introduction to the ML lifecycle and
    MLOps, followed by comprehensive step-by-step instructions on how to develop a
    package for ML code from scratch that can be installed using pip. It then covers
    MLflow for ML life cycle management, CI/CD pipelines, and shows how to deploy
    ML applications on Azure, GCP, and AWS. Furthermore, it provides guidance on how
    to convert Python applications into Android and Windows apps, as well as how to
    develop ML web apps. Finally, it covers monitoring, the critical topic of machine
    learning attacks, and A/B testing.


    With this book, you can easily build and deploy machine learning solutions in
    production.


    +   ## KEY FEATURES

    +   - Explore several ways to build and deploy ML models in production using an
    automated CI/CD pipeline.

    +   - Develop and convert ML apps into Android and Windows apps.

    +   - Learn how to implement ML model deployment on popular cloud platforms, including
    Azure, GCP, and AWS.


    +   ## WHAT YOU WILL LEARN

    +   - Master the Machine Learning lifecycle with MLOps.

    +   - Learn best practices for managing ML models at scale.

    +   - Streamline your ML workflow with MLflow.

    +   - Implement monitoring solutions using whylogs, WhyLabs, Grafana, and Prometheus.

    +   - Use Docker and Kubernetes for ML deployment.


    ## WHO THIS BOOK IS FOR


    Whether you are a Data scientist, ML engineer, DevOps professional, Software engineer,
    or Cloud architect, this book will help you get your machine learning models into
    production quickly and efficiently.'
