  md: '# # Deployment with Container Registry


    Heroku Container Registry allows you to deploy your Docker images to Heroku.


    Make sure you have a working Docker installation and are logged in to Heroku using
    the following command:


    ```

    `heroku login`

    ```


    You''ll be prompted to enter any key to go to your web browser to complete the
    login process.


    A new browser window will open up and will ask you to log in. You may add the
    `-i` or `--interactive` option to stay in the terminal and pass the login details
    when asked.


    Make sure you are in the project directory where `Dockerfile` is located.


    Now, log in to Heroku Container Registry:


    ```

    `heroku container:login`

    ```


    Build the image and push it to the container registry on Heroku using the following
    syntax:


    ```

    `heroku container:push <process-type> --app [app name]`

    ```


    In this case, it is a web process, and the `--app` parameter holds Heroku’s app
    name.


    Finally, release the image to your app:


    ```

    `heroku container:release <process-type> --app [app name]`

    ```


    Run the following command to see the app running in the browser:


    ```

    `heroku open --app [app name]`

    ```


    > Note: Pipeline promotions are not supported in the container registry method.


    # # GitHub Actions


    GitHub Actions is a continuous integration and continuous delivery (CI/CD) platform
    that helps you automate your development workflows at the same place as your code
    (that is, GitHub repository) and collaborate on pull requests and issues. You
    can write individual configurable tasks known as actions and combine them to create
    a custom workflow. Workflows are custom automated processes within GitHub.'
