    # # MLflow projects


    Once you are done with the experimentation phase, your next step would be packaging
    all the code as a project with its dependencies. Let’s say you want to shift the
    codebase and dependencies to the server or to another machine; MLflow will do
    the job for you.


    MLflow allows you to package the codebase and its dependencies to make it reproducible
    and reusable. MLflow projects provide API and CLI capabilities that will help
    you integrate your model in MLOps.


    You can run the MLflow project directly from the remote git repository (provided
    it should contain all the necessary files); alternatively, you can run it from
    the local CLI.


    Following are the fields of the MLproject file:


    +   - **Name:** It is the name of the project, and it can be any text.


    +   - **Environment:** This is the environment that will be used at the time of
    execution of the entry point command. This will contain dependencies/ packages
    required by the entry point or MLflow project.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '+   * **Entry point:** The entry point section holds the command to be executed
    inside the MLflow project environment. This command can take arguments; it is
    a mandatory field and cannot be left blank.


    +   * **Parameters:** This section holds one or more arguments that will be used
    by the entry point commands, but it is optional.


    Create a conda.yaml file:


    ```

    1. name: Loan_prediction

    2.

    3. channels:

    4.   - defaults

    5.

    6. dependencies:

    7.   - python=3.7

    8.   - pip

    9.   - pip:

    10.    - mlflow

    11.    - numpy==1.19.5

    12.    - pandas==1.1.5

    13.    - matplotlib==3.3.4

    14.    - scikit-learn==0.24.2

    ```


    Then, create an MLproject file:


    ```

    1. name: Loan_prediction

    2.

    3. conda_env: conda.yaml

    4.

    5. entry_points:

    6.   main:

    7.     command: “python train.py”

    ```


    Switch to the directory where the MLproject file and the conda environment are
    present. Locate the YAML file and run:


    ```

    mlflow run .

    ```'
