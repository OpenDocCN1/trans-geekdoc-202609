    # Constraints for data quality validation


    With whylogs, you can use constraints for performing data validation. This feature
    can be used in unit tests or CI/CD pipelines so that further errors can be avoided.
    You can set constraints on profile metrics, such as count, distribution, and type.
    The whylogs also supports user-defined custom metrics. You need a whylogs profile
    to set the constraints on data.


    Setting a new constraint is simple; you need to assign values to the following:


    +   - name: It can be any string to describe the constraint.

    +   - condition: It is a lambda expression.

    +   - metric_selector: It is the type of metric to be measured or validated.


