  trans: '


    一旦神经网络被‘训练’到令人满意的水平，它就可以作为分析工具用于其他数据。为此，用户不再指定任何训练运行，而是允许网络仅在 `forward propagation`
    模式下工作。新的输入被呈现给输入模式，在那里它们被过滤并由中间层处理，就好像训练正在进行一样，然而，在这一点上输出被保留并且没有发生 `backpropagation`。前向传播运行的输出是数据的预测模型，然后可以用于进一步的分析和解释。


    也可能过度训练神经网络，这意味着网络已被训练精确地仅响应一种类型的输入；这很像死记硬背。如果发生这种情况，则学习将不再发生，网络在神经网络术语中被称为已被“grandmothered”。在实际应用中，这种情况并不太有用，因为对于每一种新的输入类型都需要一个单独的
    grandmothered 网络。


    ## 神经网络的优势


    神经网络凭借其从复杂或不精确数据中提取意义的非凡能力，可以用来提取模式并检测人类或其他计算机技术都难以察觉的趋势。训练好的神经网络可以被视为其被训练分析的信息类别的“专家”。然后该专家可用于在感兴趣的新情况下提供预测并回答“如果”问题。


    其他优势包括：


    * 自适应学习：能够根据训练数据或初始经验学习如何执行任务。

    * 自组织：`ANN` 可以在学习期间创建自己的组织或对接收到的信息的表示。

    * 实时操作：`ANN` 计算可以并行进行，正在设计和制造专用硬件设备以利用这种能力。

    * 通过冗余信息编码的容错：网络的部分破坏会导致性能相应下降。然而，即使在网络遭受重大损坏的情况下，一些网络能力仍可能保留。


    ## 神经网络如何运作


    神经网络的操作类似于大脑的神经网络。神经网络中的“神经元”是一个简单的数学函数，根据架构捕获和组织信息。该网络与曲线拟合和回归分析等统计方法非常相似。


    神经网络由层层互连的节点组成。每个节点都是一个 `perceptron`，类似于多元线性回归。感知器将多元线性回归产生的信号馈入激活函数，该函数可能是非线性的。


    在多层感知器（`MLP`）中，感知器排列在互连的层中。输入层接收输入模式。输出层包含分类或输出信号，输入模式可以映射到这些信号。例如，模式可能是一系列关于某只证券的技术指标的量化值；潜在的输出可以是“买入”、“持有”或“卖出”。隐藏层调整输入的权重，直到神经网络的误差最小化。据理论认为，隐藏层提取输入数据中具有预测输出能力的显著特征。这描述了特征提取，其功能类似于统计技术如主成分分析。


    ## 神经网络的应用


    神经网络广泛用于金融运营、企业规划、交易、商业分析以及产品维护。神经网络在商业应用中很常见，例如预测和市场研究解决方案、欺诈检测和风险评估。


    神经网络分析价格数据并揭示基于彻底分析的数据做出交易决策的机会。网络可以检测其他技术分析方法无法发现的微妙非线性相互依赖关系和模式。然而，投资者从神经网络中期望的效率提升最多为
    10%。总会有数据集和任务类别，之前使用的算法仍然更优。算法本身并不重要；针对目标指标的准备充分的输入信息决定了神经网络的成功。


    ## 神经网络与传统计算有何不同？


    为了更好地理解人工神经计算，首先要了解传统的‘串行’计算机及其软件如何处理信息。串行计算机有一个中央处理器，可以寻址存储数据和指令的内存位置。计算是通过处理器从内存地址读取指令以及指令所需的数据，然后执行指令并将结果保存到指定的内存位置中完成的。在串行系统（以及标准的并行系统）中，计算步骤是确定性的、顺序的和逻辑的，并且可以从一个操作跟踪到另一个操作给定变量的状态。


    相比之下，`ANNs` 并非顺序的或不一定是确定性的。没有复杂的中央处理器，而是存在许多简单的处理器，它们通常只做比取其来自其他处理器的输入的加权和更少的事情。`ANNs`
    不执行编程指令；它们对呈现给它的输入模式并行响应（无论是模拟的还是实际的）。也没有用于存储数据的单独内存地址。相反，信息包含在网络整体的激活‘状态’中。‘知识’因此由网络本身表示，这在字面上说比其各个组件的总和还要多。


    ## 神经网络应用于何处？


    神经网络是通用逼近器，如果你用来建模的系统对误差有很高的容忍度，它们效果最好。因此不建议使用神经网络来平衡你的支票簿！然而它们非常适用于：


    * 捕获关联或在模式集合中发现规律性；

    * 数据的量、变量的数量或多样性非常大时；

    * 变量之间的关系模糊不清；或，

    * 关系难以用传统方法充分描述。


    ## 它们的局限性是什么？


    神经网络分析和其局限性有很多优势，要正确讨论这个主题，我们需要查看每种单独的网络类型，这对于本次一般讨论来说是不必要的。然而，关于反向传播网络，有一些具体问题潜在用户应该注意。


    反向传播神经网络（以及许多其他类型的网络）在某种意义上是终极的‘黑箱’。除了定义网络的总体架构并可能用随机数对其进行初始种子化外，用户除了输入数据、观察其训练并等待输出外别无他事。事实上，有人说过关于反向传播，“你几乎不知道自己在做什么”。一些自由可用的软件包（`NevProp`、`bp`、`Mactivation`）确实允许用户在定期时间间隔内采样网络的‘进展’，但学习本身自行进行。这种活动的最终产品是一个训练好的网络，它除了其自身的内部数学之外，不提供定义关系的方程或系数（如回归）。网络‘就是’关系的最终方程。


