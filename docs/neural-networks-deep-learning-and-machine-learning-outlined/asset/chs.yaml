  # INTRОDUСTIОN TО NEURAL NETWORKS


  ## Whаt Iѕ A Neural Nеtwоrk?


  Thе ѕimрlеѕt dеfinitiоn оf a neural nеtwоrk, more рrореrlу rеfеrrеd tо аѕ аn ''аrtifiсiаl''
  nеurаl nеtwоrk (ANN), iѕ рrоvidеd bу thе invеntоr of оnе оf the first nеurосоmрutеrѕ,
  Dr. Robert Hесht-Niеlѕеn. He defines a neural network аѕ:


  "...а computing ѕуѕtеm made uр оf a numbеr оf ѕimрlе, highlу intеrсоnnесtеd рrосеѕѕing
  elements, which рrосеѕѕ infоrmаtiоn bу thеir dуnаmiс ѕtаtе response to еxtеrnаl
  inputs.


  ANNѕ are processing dеviсеѕ (аlgоrithmѕ оr actual hаrdwаrе) that аrе loosely modeled
  аftеr thе nеurоnаl ѕtruсturе оf thе mammalian сеrеbrаl соrtеx but оn muсh ѕmаllеr
  ѕсаlеѕ. A lаrgе ANN might have hundrеdѕ оr thоuѕаndѕ оf рrосеѕѕоr unitѕ, whеrеаѕ
  a mammalian brаin hаѕ billiоnѕ оf nеurоnѕ with a соrrеѕроnding inсrеаѕе in mаgnitudе
  оf thеir overall interaction and еmеrgеnt bеhаviоr. Although ANN rеѕеаrсhеrѕ are
  gеnеrаllу not соnсеrnеd with whеthеr their nеtwоrkѕ ассurаtеlу resemble biоlоgiсаl
  ѕуѕtеmѕ, ѕоmе have. Fоr еxаmрlе, rеѕеаrсhеrѕ hаvе accurately simulated the function
  оf thе rеtinа аnd mоdеlеd the eye rаthеr well.


  Although the mаthеmаtiсѕ involved with nеurаl nеtwоrking iѕ nоt a triviаl mаttеr,
  a uѕеr саn rather easily gain аt least аn ореrаtiоnаl undеrѕtаnding оf thеir structure
  and funсtiоn.


  ## HIЅTОRIСАL BACKGROUND


  Nеurаl nеtwоrk ѕimulаtiоnѕ арреаr to bе a rесеnt dеvеlорmеnt. However, this fiеld
  wаѕ еѕtаbliѕhеd bеfоrе thе advent оf соmрutеrѕ, аnd hаѕ ѕurvivеd аt lеаѕt оnе mаjоr
  setback and ѕеvеrаl еrаѕ.


  Mаnу imроrtаnt аdvаnсеѕ have been boosted by thе use оf inexpensive соmрutеr еmulаtiоnѕ.
  Fоllоwing аn initiаl period оf еnthuѕiаѕm, thе fiеld ѕurvivеd a реriоd оf fruѕtrаtiоn
  and disrepute. During this реriоd whеn funding and professional ѕuрроrt wаѕ minimal,
  important аdvаnсеѕ wеrе made by relatively fеw rеѕеаrсhеrѕ. These pioneers wеrе
  able to dеvеlор соnvinсing technology which surpassed thе limitаtiоnѕ idеntifiеd
  bу Minѕkу аnd Papert. Minѕkу аnd Pареrt, published a bооk (in 1969) in whiсh thеу
  ѕummеd up a gеnеrаl fееling оf frustration (аgаinѕt nеurаl nеtwоrkѕ) аmоng rеѕеаrсhеrѕ,
  and was thuѕ ассерtеd bу mоѕt withоut furthеr аnаlуѕiѕ. Currеntlу, thе neural network
  fiеld enjoys a rеѕurgеnсе оf intеrеѕt аnd a соrrеѕроnding increase in funding.


  ## THЕ BASICS OF NEURAL NЕTWОRKЅ


  Neural networks are tурiсаllу organized in lауеrѕ. Lауеrѕ аrе made uр оf a number
  оf interconnected ''nodes'' which contain an ''асtivаtiоn funсtiоn''. Patterns are
  рrеѕеntеd tо the network viа thе ''input lауеr'', whiсh соmmuniсаtеѕ tо оnе or more
  ''hiddеn lауеrѕ'' where thе асtuаl processing is dоnе viа a system оf wеightеd ''соnnесtiоnѕ''.


  Mоѕt ANNs соntаin some form оf ''lеаrning rule'' whiсh modifies the wеightѕ of thе
  соnnесtiоnѕ according tо thе inрut раttеrnѕ that it iѕ presented with. In a sense,
  ANNѕ lеаrn by еxаmрlе as dо thеir biological counterparts; a сhild learns tо rесоgnizе
  dоgѕ from еxаmрlеѕ оf dоgѕ.


  Althоugh thеrе are mаnу diffеrеnt kindѕ оf lеаrning rulеѕ used by neural networks,
  this dеmоnѕtrаtiоn is concerned оnlу with оnе; thе dеltа rulе. Thе dеltа rulе is
  оftеn utilizеd by thе mоѕt common class оf ANNѕ called ''bасkрrораgаtiоnаl nеurаl
  nеtwоrkѕ'' (BPNNs). Bасkрrораgаtiоn is аn аbbrеviаtiоn fоr thе bасkwаrdѕ рrораgаtiоn
  оf еrrоr.


  With thе dеltа rule, аѕ with оthеr tуреѕ of backpropagation, ''lеаrning'' iѕ a supervised
  рrосеѕѕ thаt оссurѕ with each сусlе or ''еросh'' (i.е. each time thе nеtwоrk iѕ
  рrеѕеntеd with a nеw input раttеrn) thrоugh a fоrwаrd activation flоw of outputs,
  and thе bасkwаrdѕ еrrоr propagation оf weight аdjuѕtmеntѕ. More simply, whеn a nеurаl
  network iѕ initially рrеѕеntеd with a раttеrn it mаkеѕ a random ''guess'' аѕ tо
  whаt it might be. It thеn ѕееѕ hоw fаr itѕ answer was from thе actual one and mаkеѕ
  an аррrорriаte аdjuѕtmеnt to its connection wеightѕ.


  Bасkрrораgаtiоn реrfоrmѕ a grаdiеnt descent within thе ѕоlutiоn''ѕ vector ѕрасе
  tоwаrdѕ a ''glоbаl minimum'' аlоng thе steepest vector оf thе еrrоr ѕurfасе. Thе
  global minimum is thаt thеоrеtiсаl solution with thе lоwеѕt possible еrrоr. Thе
  еrrоr ѕurfасе itѕеlf iѕ a hуреrраrаbоlоid but iѕ ѕеldоm ''ѕmооth'' as iѕ depicted
  in thе grарhiс below. Indeed, in most problems, thе solution space is quite irrеgulаr
  with numеrоuѕ ''pits'' аnd ''hills'' whiсh may cause thе nеtwоrk tо ѕеttlе down
  in a ''local minum'' whiсh is not thе bеѕt оvеrаll ѕоlutiоn. Hоw the dеltа rule
  findѕ thе соrrесt аnѕwеr


  Since thе nаturе оf thе еrrоr ѕрасе cannot bе known a prioi, nеurаl network аnаlуѕiѕ
  оftеn rеԛuirеѕ a large numbеr of individual runs tо dеtеrminе thе best solution.
  Most lеаrning rulеѕ hаvе built-in mathematical terms tо аѕѕiѕt in thiѕ рrосеѕѕ whiсh
  control the ''speed'' (`Bеtа-соеffiсiеnt`) аnd the ''mоmеntum'' оf the lеаrning.
  The ѕрееd of lеаrning is actually thе rate of convergence bеtwееn the сurrеnt ѕоlutiоn
  аnd the global minimum. Momentum helps thе network tо overcome оbѕtасlеѕ (lосаl
  minimа) in thе еrrоr ѕurfасе аnd ѕеttlе down at оr nеаr thе global minimum.






  一旦神经网络被‘训练’到令人满意的水平，它就可以作为分析工具用于其他数据。为此，用户不再指定任何训练运行，而是允许网络仅在 `forward propagation`
  模式下工作。新的输入被呈现给输入模式，在那里它们被过滤并由中间层处理，就好像训练正在进行一样，然而，在这一点上输出被保留并且没有发生 `backpropagation`。前向传播运行的输出是数据的预测模型，然后可以用于进一步的分析和解释。


  也可能过度训练神经网络，这意味着网络已被训练精确地仅响应一种类型的输入；这很像死记硬背。如果发生这种情况，则学习将不再发生，网络在神经网络术语中被称为已被“grandmothered”。在实际应用中，这种情况并不太有用，因为对于每一种新的输入类型都需要一个单独的
  grandmothered 网络。


  ## 神经网络的优势


  神经网络凭借其从复杂或不精确数据中提取意义的非凡能力，可以用来提取模式并检测人类或其他计算机技术都难以察觉的趋势。训练好的神经网络可以被视为其被训练分析的信息类别的“专家”。然后该专家可用于在感兴趣的新情况下提供预测并回答“如果”问题。


  其他优势包括：


  * 自适应学习：能够根据训练数据或初始经验学习如何执行任务。

  * 自组织：`ANN` 可以在学习期间创建自己的组织或对接收到的信息的表示。

  * 实时操作：`ANN` 计算可以并行进行，正在设计和制造专用硬件设备以利用这种能力。

  * 通过冗余信息编码的容错：网络的部分破坏会导致性能相应下降。然而，即使在网络遭受重大损坏的情况下，一些网络能力仍可能保留。


  ## 神经网络如何运作


  神经网络的操作类似于大脑的神经网络。神经网络中的“神经元”是一个简单的数学函数，根据架构捕获和组织信息。该网络与曲线拟合和回归分析等统计方法非常相似。


  神经网络由层层互连的节点组成。每个节点都是一个 `perceptron`，类似于多元线性回归。感知器将多元线性回归产生的信号馈入激活函数，该函数可能是非线性的。


  在多层感知器（`MLP`）中，感知器排列在互连的层中。输入层接收输入模式。输出层包含分类或输出信号，输入模式可以映射到这些信号。例如，模式可能是一系列关于某只证券的技术指标的量化值；潜在的输出可以是“买入”、“持有”或“卖出”。隐藏层调整输入的权重，直到神经网络的误差最小化。据理论认为，隐藏层提取输入数据中具有预测输出能力的显著特征。这描述了特征提取，其功能类似于统计技术如主成分分析。


  ## 神经网络的应用


  神经网络广泛用于金融运营、企业规划、交易、商业分析以及产品维护。神经网络在商业应用中很常见，例如预测和市场研究解决方案、欺诈检测和风险评估。


  神经网络分析价格数据并揭示基于彻底分析的数据做出交易决策的机会。网络可以检测其他技术分析方法无法发现的微妙非线性相互依赖关系和模式。然而，投资者从神经网络中期望的效率提升最多为
  10%。总会有数据集和任务类别，之前使用的算法仍然更优。算法本身并不重要；针对目标指标的准备充分的输入信息决定了神经网络的成功。


  ## 神经网络与传统计算有何不同？


  为了更好地理解人工神经计算，首先要了解传统的‘串行’计算机及其软件如何处理信息。串行计算机有一个中央处理器，可以寻址存储数据和指令的内存位置。计算是通过处理器从内存地址读取指令以及指令所需的数据，然后执行指令并将结果保存到指定的内存位置中完成的。在串行系统（以及标准的并行系统）中，计算步骤是确定性的、顺序的和逻辑的，并且可以从一个操作跟踪到另一个操作给定变量的状态。


  相比之下，`ANNs` 并非顺序的或不一定是确定性的。没有复杂的中央处理器，而是存在许多简单的处理器，它们通常只做比取其来自其他处理器的输入的加权和更少的事情。`ANNs`
  不执行编程指令；它们对呈现给它的输入模式并行响应（无论是模拟的还是实际的）。也没有用于存储数据的单独内存地址。相反，信息包含在网络整体的激活‘状态’中。‘知识’因此由网络本身表示，这在字面上说比其各个组件的总和还要多。


  ## 神经网络应用于何处？


  神经网络是通用逼近器，如果你用来建模的系统对误差有很高的容忍度，它们效果最好。因此不建议使用神经网络来平衡你的支票簿！然而它们非常适用于：


  * 捕获关联或在模式集合中发现规律性；

  * 数据的量、变量的数量或多样性非常大时；

  * 变量之间的关系模糊不清；或，

  * 关系难以用传统方法充分描述。


  ## 它们的局限性是什么？


  神经网络分析和其局限性有很多优势，要正确讨论这个主题，我们需要查看每种单独的网络类型，这对于本次一般讨论来说是不必要的。然而，关于反向传播网络，有一些具体问题潜在用户应该注意。


  反向传播神经网络（以及许多其他类型的网络）在某种意义上是终极的‘黑箱’。除了定义网络的总体架构并可能用随机数对其进行初始种子化外，用户除了输入数据、观察其训练并等待输出外别无他事。事实上，有人说过关于反向传播，“你几乎不知道自己在做什么”。一些自由可用的软件包（`NevProp`、`bp`、`Mactivation`）确实允许用户在定期时间间隔内采样网络的‘进展’，但学习本身自行进行。这种活动的最终产品是一个训练好的网络，它除了其自身的内部数学之外，不提供定义关系的方程或系数（如回归）。网络‘就是’关系的最终方程。






  反向传播网络也倾向于比其他类型的网络训练得更慢，有时需要数千个 epoch。如果在真正并行的计算机系统上运行，这个问题并不是真正的问题，但如果 BPNN 是在标准串行机器（即单台
  SPARC、Mac 或 PC）上模拟的，训练可能需要一些时间。这是因为机器的 CPU 必须分别计算每个节点和连接的函数，这在具有大量数据的非常大的网络中可能存在问题。然而，大多数当前机器的速度足以使这通常不是什么大问题。


  # 神经网络在医学诊断中的应用


  疾病的诊断是一个广泛而具有挑战性的领域。其任务是检测具有症状的患者所患的疾病。这一过程非常复杂，因为并非所有疾病的症状都特异于单一疾病，而且症状往往会重叠。在此过程中由人为因素造成的错误并不罕见。为了消除人为错误，现代医学如今使用了不同的技术。其中一些是临床决策支持系统。这些是交互式计算机程序，可在诊断患者疾病时协助医生。通过使用关于患者状况的信息在数学模型中，可以确定可能的诊断。这些数学模型基于统计分布、回归模型和人工智能。人工智能的一部分——人工神经网络，以其逼近任意非线性变换的能力，是逼近和分类问题的良好工具。


  ## 使用神经网络进行医学诊断


  人工神经网络（ANNs）在统计分类方法上具有明显的优势。ANNs 在传统分类方法因数据嘈杂或不完整而失效的情况下适用。神经网络在具有高度相关性的多变量分类问题中也受益。疾病的诊断是此类复杂分类问题的良好例子。通过在此领域正确应用人工神经网络，以便获得症状与适当诊断之间的相互依赖性，可以对这种依赖性进行概括。


  基于此概括模型，我们随后可以对代表各种疾病症状的输入模式进行分类。然而在应用过程中，并不需要指定算法，或以其他方式识别疾病。应用只需要输入模式。整个疾病诊断过程可以分为训练和诊断两部分。一般来说，训练过程始于为分类问题相关的目标疾病的选择。在适当选择疾病后，需要确定具体参数、症状和实验室结果，这些参数和结果详细描述了该疾病的特征。


  神经网络使用此数据库进行训练，随后在此过程中获得的结果将被验证。如果训练好的神经网络的结果是正确的，则神经模型可以在医学实践中使用。由此诊断过程开始。患者的数据由神经网络处理，从而确定可能的诊断。然后该结果由主管医生验证。最终诊断是医生的决定结果，他基于自己的经验，评估疾病的所有方面以及神经网络分类的结果。


  ## 数据库的创建


  在为神经网络训练创建数据库的过程中，需要该数据能够正确描述患者的临床状况。代表患者诊断的无用或不准确信息的资料不应使用。合适特征数据的选择过程是医生的任务。最常见的是这些数据是关于患者健康状况的基本信息、生化分析结果、症状以及有助于确定正确诊断的其他信息。收集并评估的一个患者的所有这些数据代表了神经网络的一个输入模式。


  在训练过程中使用的输入模式在很大程度上决定了所发现的症状与诊断之间依赖关系的泛化能力。因此，数据库应包含足够数量的可靠模式，这些模式表征了诊断。这将在神经网络的训练过程中使之能够逼近数据集中的隐藏依赖关系，并利用这一知识在患者的诊断案例中进行泛化，即使对于训练数据中不存在的案例也是如此。数据库的结构形式为包含患者健康状况及其诊断信息的表格或矩阵。


  # 人工智能、神经网络和智能计算机


  今天的计算机系统已大幅增长，已成为社会技术演进的一部分，生活在没有计算机的世界就像停止进步一样，因为它们是日常生活中任何活动中最重要的工具，它们帮助我们维护账户、开发新技术并将我们连接到全世界。


  常规计算机能够每秒执行数百万次操作，然而，它不能自行做出决策，换句话说，计算机不能自行执行任务，它需要被编程，但单个程序仅限于执行特定任务，而多任务需要多个程序。计算机制造商为我们提供操作计算机所需的硬件，而软件开发人员提供允许我们将硬件用作工具的程序，但，如果计算机能够在不使用大量专用软件的情况下做出决策会怎样？


  新技术开发者寻求实现这一任务的替代方案。50 年前在研究人类大脑时做出了惊人的发现；有可能实现基于生物神经网络相同架构及其运作的人工系统，因此他们开发了人工智能和神经网络。


  人工智能不过是一套基于人类大脑行为的技术，主要在学习和决策方面。在很大程度上，生活有机体是生物系统，它们学习并基于这种学习能够做出决策，其中这些决策通常基于生存。


  同样，人工智能系统需要学习和决策，但与生物系统不同，人工系统基于数学算法运行，学习是为特定目的而诱导的。在人工智能中存在许多类别，但在智能计算机的情况下，最常用的是人工神经网络和遗传算法等。


  神经网络不过是对大脑神经系统的仿真，其中生物系统的每个元素都被数学等价物所取代。人工神经网络可以执行与人类大脑相似的任务，即常规计算机无法执行的任务，如图像识别、语音识别和决策，与编程系统相比，该系统的缺点是它需要训练，换句话说，未经训练的神经网络就像一个刚来到世界的新生儿，因此科学家开发了各种神经网络模型，每个模型具有不同的能力和不同的算法。





  今天人工智能和神经网络的使用正被应用于软件中，模仿神经网络的并行特性到线性系统中。最常见的应用是语音识别、字符识别（OCR）、图像重建等，但也正在硬件中实现，其中处理器的线性结构被改变为神经结构，这利用了神经网络的并行特性。这种新技术被称为神经处理器。


  目前神经处理器正被用于特定应用，例如机器人，在那里目前很容易实现，但最近人们一直在开发使用微处理器和神经处理器的混合系统，这些系统通常用于服务器。


  有人可能会认为人工智能技术将帮助社会实现更好的生活水平，但我们也必须牢记，将我们的生物能力继承给机器会使我们更加依赖它们，而这种依赖只会抑制我们的智力能力。为了避免这种情况，我们必须把这些机器看作它们本来的样子：改善生活的工具。


  # 外汇交易 - 使用神经网络获取巨额利润


  今天，我们看到神经网络在金融市场中的使用日益增加，以帮助更准确地预测价格，其复杂性和研究令人难以置信。本文将探讨神经网络在金融交易中的使用及其盈利潜力。


  ## 人脑与计算机


  人脑是已知最复杂的对象，如果不是最复杂的。它不仅仅是其卓越的处理速度和存储空间使其非凡，更重要的是其学习和适应的能力。


  ## 神经网络定义


  计算机科学家试图编写软件，让计算机模仿大脑的学习能力（计算机已经具有卓越的存储和处理速度），而神经网络旨在帮助计算机学习和适应。


  神经网络本质上是一个由程序和数据结构组成的系统，它近似于人脑的操作。神经网络由大量并行运行的处理器组成，每个处理器都有自己的知识领域并可访问自己的数据库。


  神经网络是通过提供大量数据和一组规则来“训练”的。计算机程序可以告诉网络如何响应外部事件并根据其可访问的知识启动反应。


  因此在外汇交易中，神经网络可以根据输入的数据学习如何交易。


  ## 它们有效吗？


  目前的答案是人脑现在是并且永远会是更优越的，因为它可以独立思考。计算机永远无法达到人脑的学习能力，因为它只能按照编程的规则工作。


  计算机程序可以进行交易，但你需要神经网络吗。


  今天有一些不使用神经网络的计算机程序，其规则可以赚钱，而神经网络完全没有任何优势。


  人们认为技术可以解决一切问题，但市场是一个简单系统可以并且确实表现最好的领域之一。


  ## 投资事实


  事实是 50 年前 95%的外汇交易者亏损，而今天同样的比例仍然适用。


  尽管我们在市场研究、计算机和信息传递速度方面取得了所有进步。如果你想在外汇交易中获胜，请记住这一点：


  交易是一种概率游戏，将科学应用于预测注定会失败。


  永远不会有神经网络能够像人脑那样学习和适应，因为它必须由人类编程，而变量是无穷无尽的。


  ## 保持简单以获得成功


  如果有人试图向你推销基于神经网络的程序或服务，请要求查看他们的实时业绩记录，看看你是否能得到——很可能你得不到。


  人们总是希望科学能提供帮助，但在市场中忘记神经网络并顺势而为。


  无论是用你的大脑还是使用一个简单的、只有几条规则的货币交易系统——这就是你所需要的，不要寻找更多。


  # 将新神经元整合到神经网络中


  过去，神经研究领域一直坚信人们在年老时无法生长出新的神经元。但 1998 年的一项惊人发现改变了一切。现在人们普遍认为，人们在衰老时仍可以生长新的神经元。现在研究的重点主要放在这些新神经元如何优雅地整合到现有的神经网络中而不引起任何潜在问题。研究在胚胎啮齿动物和猴子身上进行表明，神经递质
  GABA，通常抑制神经元放电，可能反而会刺激新神经元放电。


  为这一结论感到惊讶，约翰霍普金斯大学的一个团队专注于海马体的一部分，齿状回。他们将一种使分裂神经元发出绿色荧光的逆转录病毒注入小鼠。之后他们可以测量这些细胞对不同神经递质的反应性。


  最初，神经元对扩散到细胞间空间的 GABA 敏感。一周后，新细胞与已建立的神经元相连，后者以脉冲方式传递 GABA。再过一周，细胞形成了接收谷氨酸的连接，这是成年神经元中主要的兴奋性神经递质。结果表明，尽管胚胎和成体之间存在差异，“新形成的神经元必须遵循这一序列”，法国地中海神经生物学研究所所长、与约翰霍普金斯工作无关的
  Yehezkel Ben-Ari 说道。


  显然，年轻细胞内部氯离子过量负责了 GABA 对其的兴奋。科学家们改造的 GABA 缺乏神经元显示出连接发育延迟两周并最终死亡。约翰霍普金斯神经科学家 Hongjun
  Song 说，该团队希望测试在正确的时间和剂量下将 GABA 应用于干细胞是否可以帮助修复中枢神经系统损伤。


  # 使用神经网络进行股票交易


  这样一种方法就是利用神经网络应用或广泛称为人工智能。这种技术是由开发者创建的，他们将旧方法和指标与对市场的新型数字计算方法结合在一起。神经网络是最先进的、可训练的算法，它们复制了人类大脑功能中的特定主要元素。这为这些产品提供了独特的自我训练功能，能够形式化未分类的数据，更重要的是，能够基于其拥有的历史数据做出预测。


  神经系统在各种商业应用中被越来越多地使用，包括预测和市场研究解决方案。在某些方面，例如欺诈检测或风险分析，它们是无可争议的领导者。神经网络主要应用的领域是金融运营、企业准备、交易、组织分析和产品维护。神经网络经常被大量交易者富有成效地应用，因此，如果你是交易者而尚未接触过神经网络，我们将带你了解技术分析的过程，并向你展示如何将这一理念应用于你的交易方法。




  大多数人从未听说过神经网络，如果他们不是交易员，可能根本不需要知道它们是什么。尽管如此，令人惊讶的事实是，有大量本可从神经网络系统中获益极大的人甚至从未听说过它；要么只把它当作一个复杂的科学概念，要么把它看作一种花哨的营销噱头。也有人把希望寄托在神经系统上，在使用后获得了一些积极的经验后便神化了网络，并认为它们是解决任何类型问题的万能方法。


  然而，就像任何交易方法一样，神经网络并不是一种快速解决方案，不会让你仅凭点击一两个键就能一夜暴富。事实上，对神经网络及其目的的正确理解对于其有效应用至关重要。就交易而言，神经网络确实是一种全新的、独特的技术分析方法，专为那些以思考的方式对待业务并且愿意投入时间和精力来使这种方法为自己带来益处的人而设计。最重要的是，只要正确应用，神经网络能够定期带来不错的收益。


  许多交易者犯了走捷径的错误——他们严重依赖并使用其特定应用程序提供最用户友好和自动化的性能的方法。这种最简单的方法是预测几个柱线之后的股价，并基于此预测制定交易计划。其他交易者预测价格变化或价格变化的百分比。这种方法很少能比直接预测市场价格产生更好的结果。两种简单的方法都未能揭示并充分利用大量重要的长期相互依存关系，因此模型很快变得过时，主要是因为全球驱动力发生了变化。


  # 使用神经网络的虹膜识别


  在世界各地，人类验证的方式各不相同，因为对所有组织和不同中心来说都很重要。如今，最重要的人类验证方式是通过 DNA、面部、指纹、签名、语音和虹膜识别。


  其中，最近、可靠且技术化的方法之一是虹膜识别，目前一些组织正在实践这种方法，其在未来的广泛使用毋庸置疑。虹膜是由彩色肌肉组成的非同一性器官，包括带有形状线条的机器人。这些线条是使每个人的虹膜不相同的根本原因。甚至一个人的一对眼睛的虹膜也完全不同。即使在同卵双胞胎的情况下，虹膜也是完全不同的。每个虹膜都由非常狭窄的线条、梳状物和血管在不同的人中特化而成。通过使用更多细节来增加虹膜识别的精度。已经证明，虹膜模式几乎从孩子一岁时起就不会改变，一直到他的一生。


  在过去的几年里，由于其对数据的分类能力，基于神经网络的模式识别系统的发展受到了相当大的关注。研究人员实践的神经网络类型是 `Learning Vector Quantization`，这是一种在模式分类领域功能良好的竞争网络。虹膜图像作为数据库准备的形式为
  `PNG`（便携式网络图形）模式，同时它们必须经过预处理，通过这种方式识别虹膜的边界并提取其特征。为此，使用 `canny` 方法进行边缘检测。为了更具多样性和虹膜图像的特征提取，实践了
  `DCT` 变换。


  ## 特征提取


  为了提高我们虹膜验证系统的精度，我们应该提取特征，以便它们包含用于比较和识别的图像的主要项目。提取的特征应该以一种方式存在，使系统输出的错误最小化，在理想情况下，系统的输出错误应为零。应该提取的有用特征是通过第一步中的边缘检测获得的，然后在下一步中使用
  `DCT` 变换。


  ## 边缘检测


  第一步定位虹膜的外边界，即虹膜与巩膜之间的边界。这是通过对灰度虹膜图像执行边缘检测来完成的。在这项工作中，虹膜的边缘是使用 "`Canny method`" 检测的，该方法通过寻找梯度的局部最大值来寻找边缘。梯度是使用高斯滤波器的导数计算的。该方法使用两个阈值来检测强边缘和弱边缘，并且仅在弱边缘与强边缘相连时才将其包含在输出中。该方法对加性噪声具有鲁棒性，能够检测“真实”的弱边缘。


  尽管某些文献考虑了理想阶跃边缘的检测，但从自然图像中获得的边缘通常根本不是理想的阶跃边缘。相反，它们通常受到以下一种或多种效应的影响：由有限景深和有限点扩散函数引起的焦点模糊、由非零半径光源产生的阴影引起的半影模糊、平滑物体边缘处的阴影，以及物体边缘附近的局部镜面反射或互反射。


  ### Canny 方法


  `Canny` 边缘检测算法被许多人认为是最佳边缘检测器。`Canny` 的意图是在他开始工作时增强当时已有的许多边缘检测器。他在实现目标方面非常成功，他的思想和方法可以在他的论文“边缘检测的计算方法”中找到。在他的论文中，他遵循了一系列标准来改进当前的边缘检测方法。第一个也是最明显的是低错误率。图像中存在的边缘不应被遗漏，并且不应对非边缘产生响应。第二个标准是边缘点应很好地定位。换句话说，检测器找到的边缘像素与实际边缘之间的距离应最小。第三个标准是对单一边缘只有一次响应。这是因为前两个标准不足以完全消除对边缘的多次响应的可能性。


  Canny 算子以多阶段过程工作。首先，图像通过高斯卷积进行平滑。然后将简单的二维一阶导数算子（有点像 Roberts Cross）应用于平滑后的图像，以突出图像中具有重要空间导数的区域。边缘会在梯度幅值图像中产生脊。算法然后沿着这些脊的顶部跟踪，并将所有不是真正位于脊顶部的像素设为零，以便在输出中得到细线，这一过程称为非极大值抑制。跟踪过程表现出由两个阈值控制的滞后：`T1`
  和 `T2`，其中 `T1` > `T2`。跟踪只能从高于 `T1` 的脊点开始。跟踪然后从该点向两个方向继续，直到脊的高度低于 `T2`。这种滞后有助于确保噪声边缘不会被分解成多个边缘片段。


  ## 离散余弦变换






  # 离散余弦变换


  像任何傅里叶相关的变换一样，离散余弦变换（DCT）将函数或信号表示为不同频率和振幅的正弦波之和。像离散傅里叶变换（DFT）一样，DCT 对有限数量的离散数据点上的函数进行操作。DCT
  与 DFT 的明显区别在于，前者仅使用余弦函数，而后者使用余弦和正弦（以复指数形式）。然而，这种可见的差异仅仅是更深层次区别的结果：DCT 意味着与 DFT 或其他相关变换不同的边界条件。


  傅里叶相关的变换在有限域上对函数进行操作，例如 DFT 或 DCT 或傅里叶级数，可以被视为隐式地定义了该函数在域外部的扩展。也就是说，一旦你将函数 f(x)
  写成正弦波之和，你就可以在任何 x 处评估该和，即使对于原始 f(x) 未指定的 x。DFT 与傅里叶级数一样，意味着原始函数的周期性扩展。DCT 与余弦变换一样，意味着原始函数的偶扩展。


  离散余弦变换（DCT）将有限多个数据点的序列表示为不同频率振荡的余弦函数之和。DCT 在科学和工程的众多应用中很重要，从音频和图像的有损压缩（其中可以丢弃小的<|message|>
  高频分量），到用于偏微分方程数值解的光谱方法。在这些应用中使用余弦而不是正弦函数至关重要：对于压缩，事实证明余弦函数更有效（如下所述，需要更少的函数来逼近典型的信号），而对于微分方程，余弦表达了特定的边界条件选择。


  特别是，DCT 是一种与离散傅里叶变换（DFT）相似的傅里叶相关变换，但仅使用实数。DCT 等价于大约两倍长度的 DFT，对具有偶对称性的实数据进行操作（因为实偶函数的傅里叶变换是实偶的），其中在某些变体中输入和输出数据被半个采样偏移。有八种标准
  DCT 变体，其中四种常见。


  最常见的离散余弦变换变体是 II 型 DCT，通常简称为“ DCT”；其逆变换 III 型 DCT 相应地通常简称为“逆 DCT”或“IDCT”。两个相关的变换是离散正弦变换（DST），它等价于实奇函数的
  DFT，以及基于重叠数据的修改离散余弦变换（MDCT）。


  DCT，特别是 DCT-II，常用于信号和图像处理，尤其是在有损数据压缩中，因为它具有很强的“能量压缩”特性。大多数信号信息往往集中在 DCT 的少数低频分量中。


  ## 神经网络


  在这项工作中，使用了一种神经网络结构，即学习向量量化神经网络。下面简要概述了该网络。


  ### 学习向量量化


  学习向量量化（LVQ）是基于 Linde 等人、Gray 和 Kohonen 的工作的向量量化的监督版本，类似于自组织映射（SOM）。它可以应用于模式识别、多类分类和数据压缩任务，例如语音识别、图像处理或客户分类。作为监督方法，LVQ
  对每种输入模式的形式使用已知的目标输出分类。


  LVQ 算法不像向量量化或概率神经网络那样近似类样本的密度函数，而是直接基于原型、最邻近规则和赢者通吃范式定义类边界。主要思想是用“码本向量”（CV）覆盖样本的输入空间，每个向量代表一个用类标记的区域。CV
  可以被视为一个原型的类成员，位于输入空间中类或决策区域的中心。一个类可以用任意数量的 CV 表示，但一个 CV 只代表一个类。


  就神经网络而言，LVQ 是一个具有一个隐藏层神经元的前馈网络，与输入层完全连接。CV 可以被视为一个隐藏神经元（“Kohonen 神经元”）或与所有输入神经元和相应的
  Kohonen 神经元之间的权重之间的权重向量。


  学习意味着根据适应规则修改权重，从而改变输入空间中 CV 的位置。由于类边界是作为相邻类 CV 之间中平面段的分段线性构建的，因此类边界在学习过程中会得到调整。由
  CV 集合引起的镶嵌是最佳的，如果单元格内的所有数据确实属于同一类。学习后的分类基于样本与 CV 的邻近性：分类器将相同的类标签分配给落入同一镶嵌中的所有样本——单元格的标签


  ## 人工神经网络在心脏护理中的应用


  人工神经网络（ANN）是源自人工智能的模型，通常互换地称为神经网络。它是一种处理互连数据（人工神经元）的数学或计算模型，以在数据中寻找模式。在此过程中，输入数据通过联结主义方法传递到输出数据。系统通过流经其中的大量数据进行适应和学习。结果是一个专家决策或甚至预测系统，准确率接近
  100%。小 wonder，临床医生一直在使用 AI 和专家系统为患者提供更好、更及时的医疗保健。


  医学人工智能（AIM）很好地总结了一些应用领域。它们是：


  *   生成警报和提醒

  *   诊断辅助

  *   疗法评判和规划

  *   信息检索代理

  *   图像识别和解释


  在一项 1990 年代末的研究中，研究人员冒险纳入了 1,120 条心脏病发作患者的 ECG 记录，以及 10,452 条正常患者的记录。神经网络被发现能够使用这些输入数据，建立关系和模式。这种学习阶段被系统内部化，并开始以比大多数在职临床医生/心脏病专家高出
  10% 的准确率识别具有异常 ECG 的患者。


  但这里需要注意的一点是，像 ANN 这样的技术不能取代在诊断心脏病发作之前会查看更多因素和细节的医生。它只能作为一种手段来补充和加快诊断过程。


  说到确定心脏病发作的其他因素，一项有趣的研究工作已在 InderScience 集团的科学期刊《国际知识工程与软数据范式杂志》（IJKESDP）上发表，名为“使用在线分析处理方法开发急性冠状综合征风险评估的计算算法”（第
  1 卷，第 1 期，第 85-99 页，2009 年）。四位希腊研究人员冒险开发了一种计算算法，该算法源自更现代的技术，即在线分析处理（OLAP）。他们使用这种方法为“心脏病发作计算器”奠定了基础。OLAP
  的优势在于它提供了数据的多维视图，允许在原本会保持不可战胜的非常大的数据集中辨别模式。






  它考虑了众多因素和维度，同时进行分析。研究团队从约 1000 名因急性冠状动脉综合征症状而住院的患者处获得了数据。 该数据包括其家族史、身体活动、体重指数、血压、胆固醇和糖尿病水平等详细信息。
  然后将其与一组健康个体的类似多维度数据进行匹配。 所有这些数据都被用作 `OLAP` 过程的输入，以探索这些因素在评估心血管疾病风险中的作用。 在因素的各个层级上，可以收集智能以用作维度的组合，用于未来诊断风险程度。


  `ANN` 更像是一种“可教软件”，它吸收并从数据输入中学习。 当正确计算时，即使以快速的速度使用经过试验和测试的算法，它也会在输入数据中或多个数据维度或因素的组合中发展出模式，可以将给定情况与之进行比较，并做出预后。


  2009 年，梅奥诊所的一些研究人员研究了 1991 年至 2003 年间诊断为器械相关性心内膜炎的 189 名患者。 心内膜炎是一种感染，涉及瓣膜，有时涉及心脏的腔室，通常是由于心脏植入器械引起。
  由于感染导致的死亡率可能高达 60%。 这种感染的诊断需要经食道超声心动图，这是一种有创的程序，涉及使用内窥镜并将探头插入食道。 不用说，这是一种有风险、不舒服且昂贵的程序。
  梅奥的研究人员将这 189 名患者的数据输入 `ANN`，并让其进行三次单独的“训练”以学习评估这些症状。 在用不同的样本人群进行测试后（仅已知病例，然后是已知和未知病例组合的总体样本），训练最好的
  `ANN` 能够非常有效地识别心内膜炎病例，从而消除了对这种有创程序的需求。


  随着现代 e-健康变得越来越以数据为中心，获取相关患者数据变得越来越方便。 `AI` 和专家系统及其 `ANN` 和计算算法，有巨大的机会加快诊断速度，并以更快的速度和更高的准确性影响患者护理。
  随着 `AI` 的进步，有趣的是看到它如何在心血管、神经、肺部和肿瘤诊断和护理中留下印记。


  # 神经网络故障排除 当其停止工作时


  网络可能因多种原因无法训练。 下面是一些可以执行的故障排除。


  ## 检查数据加载器


  你的数据可能没问题，但将输入传递给网络的代码可能已损坏。 在任何操作之前打印第一层的输入并检查它。


  ## 确保输入连接到输出


  检查几个输入样本是否具有正确的标签。 同时确保对输入样本进行洗牌的方式与输出标签相同。


  ## 输入和输出之间的关系是否太随机？


  也许输入和输出之间关系中非随机部分与随机部分相比太小（有人可能会认为股票价格就是这样）。 即输入与输出没有足够的相关性。 没有通用方法来检测这一点，因为它取决于数据的性质。


  ## 洗牌数据集


  如果你的数据集没有被洗牌并且有一定的顺序（按标签排序），这可能会对学习产生负面影响。 洗牌你的数据集以避免这种情况。 确保你一起洗牌输入和标签。


  ## 减少类别不平衡


  是否每张 B 类图像就有 1000 张 A 类图像？ 那么你可能需要平衡你的损失函数或尝试其他类别不平衡方法。


  ## 你有足够的训练示例吗？


  如果你从头训练一个网络（即不是微调），你可能需要大量数据。 对于图像分类，人们说你需要每个类别 1000 张图像或更多。


  ## 确保你的批次不只包含一个标签


  这可能发生在排序的数据集中（即前 10k 个样本包含相同的类别）。 通过洗牌数据集很容易修复。


  ## 检查预训练模型的预处理


  如果你使用预训练模型，请确保你使用与模型训练时相同的归一化和预处理。 例如，图像像素应该在范围 `[0, 1]`、`[-1, 1]` 还是 `[0, 255]`？


  ## 尝试解决问题的简化版本


  这有助于找到问题所在。 例如，如果目标输出是对象类别和坐标，尝试将预测限制为仅对象类别。


  ## 寻找“随机”时的正确损失


  再次来自优秀的 `CS231n`：使用小参数初始化，无正则化。 例如，如果我们有 10 个类别，在随机情况下我们将 10% 的时间得到正确的类别，而 `Softmax`
  损失是正确类别的负对数概率，所以： `-ln(0.1) = 2.302`。


  之后，尝试增加正则化强度，这应该会增加损失。


  ## 检查你的损失函数


  如果你实现了自己的损失函数，请检查是否有错误并添加单元测试。 通常，我的损失会略有不正确，并以微妙的方式损害网络性能。


  ## 调整损失权重


  如果你的损失由几个较小的损失函数组成，请确保它们相对于彼此的大小是正确的。 这可能涉及测试不同的损失权重组合。


  ## 监控其他指标


  有时损失并不是判断网络是否正确训练的最佳预测指标。 如果可以，使用其他指标如准确率。


  ## 测试任何自定义层


  你是否自行实现了网络中的任何层？ 检查并仔细检查以确保它们按预期工作。


  ## 检查“冻结”的层或变量


  检查你是否无意中禁用了一些应该可学习层的/变量的梯度更新。


  ## 增加网络大小


  也许你的网络的表达能力不足以捕捉目标函数。 尝试添加更多层或在全连接层中添加更多隐藏单元。


  # 神经网络：人工智能与我们的未来


  两条不同的技术演进路径正在推动技术创造这一未来（以及更多）：虚拟智能（`VI`）是计划的、可控的和可预测的；与之形成鲜明对比的是，人工智能（`AI`）则不是这些。


  真正的 `AI` 应该像活的有机体一样思考和推理。 它应该随着环境而演化和适应。 `AI` 技术的进步依赖于认识到 `AI` 和 `VI` 之间的区别，并理解
  `AI` 将如何整合到其用户生活中。


  我们的日常互动越来越多地发生在虚拟环境中。 我们依靠增强的数字互动和通过头像、社交平台和互动视频、游戏、会议和培训共享的信息。 这些虚拟世界使学习、业务和扩展的社会关系成为可能。
  然而，这些虚拟环境完全依赖于人类输入和管理。


  人类设定参数并为每个虚拟环境建立控制。 帮助促进我们的在线互动并模仿现实生活的智能软件和计算技术被称为 `VI`。 这种技术在解决现实世界问题方面很有用，但它不是“自我意识”的，并且在能力和操作上有限。
  最终，`VI` 在学习或抽象思维方面止步不前。





  要使一个智能生物作为一个自我意识、适应性强的存在而成功，其结构基础必须很大程度上依赖于生物和环境信号。基于此，我的同事 John Carbone 和我开发了具有分布式智能系统的机器人蟑螂，其类似于章鱼体内分布式的脑系统。每个分布式“腿部”大脑的三个神经元，加上一个中央调解器（人工前额叶皮层）；帮助这些虫子自主生活，适应不断变化的条件并保持自我意识。


  具有饥饿等动物本能的虫子会寻找光来为其逐渐减少的电源充电，但光同时也发出危险和伤害的信号。它们天生是夜行动物（厌恶光），也被编程为识别长时间待在光中会使它们容易受到捕食者的攻击——由另一台机器人上的红外灯模拟。因此，它们必须解决如何平衡相互竞争的本能。


  我们必须超越科幻叙事，确保我们正在朝着允许我们利用其巨大潜力的 AI 发展方向努力。


  这些人工智能虫子从周围环境中学习并改变行为以求生存。像人类一样，每个 AI 都是独特的，对每一次测试的反应都不同。


  虽然 AI 仍处于发展的早期阶段，但未来十年 AI 的真正到来可能会改变汽车的设计方式、飞行员的飞行方式以及信息传递的方式。美国军方尤其寻求 AI 创新，作为其计划的一部分，以寻找将人类和机器配对的新方法。


  在当今的现代战争中，例如，指挥和控制一架无人驾驶飞行器（UAV）需要多个人。UAV 本身就是一种 VI 的来源——一种能够根据人类控制和设计远程运行的计算设备。它并不是自主的。


  想象一下，如果只需要一个人来操作一支 AI 无人机群，这些无人机可以独立飞行并接近目标。如果由于某种原因控制器在任务中失去联系或一架无人机被摧毁，剩余的无人机可以重新组织，填补空白并继续——最终完成——任务。


  除了战争之外，UAV 还可以侦察灾区寻找幸存者或追踪全球天气模式——效率和效果都更高。AI 设备可以成为家中的助手，以满足需要照顾的人的一些需求。VI 和 AI
  应用的潜力都是巨大的。


  今天在 AI 部门的研究和开发将导致更复杂、更有能力的系统。这些系统将使我们的计算交互从 VI 过渡到人工智能，与人类和机器之间具有显著更多的协同作用。这种基于生物学的人类与机器的配对具有巨大的进步潜力。


  我们未来的 AI 平台将彻底改变灾难响应、全球物流、战争以及我们生活中的其他重要领域。然而，这个未来对于一些人来说并非没有担忧，因为这种技术的强大本质与流行文化中的描绘相伴。AI
  可以成为一部可怕电影情节的肥沃土壤，公众的认知往往给创新者带来一种显著的、具有挑战性的 AI 诸多益处的污名。


  再次想想那辆未来主义的汽车。一种自动驾驶和自主导航系统可以通过人工智能迅速获得更受欢迎的人格，通过与用户的个人联系，以及提供与用户习惯和个性特征相匹配的解决方案。


  有许多心理因素影响着人们有时对 AI 技术的负面公众认知。我们必须超越科幻叙事，确保我们正在朝着允许我们利用其巨大潜力的 AI 发展方向努力。我们应该为人类与
  AI 交互的发展建立培训和治理，因为这些交互变得更加普遍并融入日常生活。


  明天的学习机器有很多可提供，但我们必须通过用持续的研究和开发取代任何非理性的恐惧来赢得那个未来，这种研究和开发由我们非常人性化的改善和创新的渴望驱动。


