    Liquid electrolyte is an indispensable component of the current commercial lithium-ion
    batteries¹. The existing commercial electrolytes are mostly carbonate-based, and
    composed of five to ten different materials. Experimentally exploring molecular
    interactions for the rational design of electrolytes is expensive, time consuming
    and heavily reliant on chemists'' intuition and experience. Limitations poses
    challenges in transitioning from proof-concept experiments to products markets,
    particularly due to the increasing complexity in optimizing the properties of
    multiplicity liquids.


    Atomistic simulation is an accessible and feasible alternative to exhaustive experimentation.
    However, to achieve reliable requirements, such as high accuracy and sufficient
    timescale and lengthscale. Quantum mechanical simulations offer high accuracy
    in describing electronic properties, yet they are computationally intensive and
    impractical for large-scale and complex systems like liquid electrolytes. While
    classical methods, although efficient, often sacrifice accuracy in capturing molecular
    structures and behavior of electrolytes, there presents a need for a balanced
    and general approach that can reconcile the difference between and in modeling
    liquids with electrolytes: multiple solvents and varying types of ions.


