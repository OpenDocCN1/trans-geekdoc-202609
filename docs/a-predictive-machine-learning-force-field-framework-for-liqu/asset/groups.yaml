    (BAMBOO) workflow, designed for constructing MLFFs for the MD simulations of organic


    In II, we describe the setup of semi-local, electrostatic and direct interactions
    in BAMBOO. In gallery, we explicitly compute the interactions between corresponding
    types of atoms and the two types of atoms to calculate the total energy. (1) The
    semi-local interaction is generated by a GNN with message layers to decode the
    data in the following section. The GET takes the atom types $\{i\}$ and the relative
    coordinates $r_{ij} = |r_i - r_j|$ as input, and outputs the energy $E_{ij}$ to
    encode the local environment. We further input $\{i\}$ to a multilayer perceptron
    to output the predicted predicted energy $E_i^{sc}$. (2) The electrostatic energy
    is computed by summing all $E_{ij}$. The representations of $\{i\}$ are fed into
    another neural network to output the predicted electrostatic energy $E_{ij}^{el}$.
    The total electrostatic energy $E^{el}$ is based on the predicted charge distribution
    under the framework of charge equilibrium$^{40}$. (3) Dispersion energy is directly
    computed on DFT-B3LYP correction$^{41}$. Finally, we sum the dispersion energy
