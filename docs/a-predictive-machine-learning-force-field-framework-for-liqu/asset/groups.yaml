    # Separation of interactions


    Once we reach the first layer, we use neural network-based per atom energy $E_i$
    and atomic charges $q_i$ using two fully connected networks. Then, we define the
    electrostatic energy based on charge density theory. In this work, we improve
    the charge density using MLFF for efficiency. We use a regularization strategy
