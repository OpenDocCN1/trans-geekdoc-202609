    4 以及补充。


    # 相互作用的分离


    一旦到达第一层，我们使用两个全连接网络利用基于神经网络的每个原子能量 $E_i$ 和原子电荷 $q_i$。然后，我们根据电荷密度理论定义静电能。在这项工作中，我们使用机器学习力场（MLFF）改进了电荷密度以提高效率。我们对
    GNN 使用了正则化策略来生成，并包含了通过 MD 步长生成的昂贵平衡求解器。此外，对于结构，我们可以通过密度 $D^{(i)}$ 定义势能面。最后，我们将神经网络、静电和色散相互作用结合起来，计算每个原子的总能量和力。关于相互作用分离的更多细节请见补充方程
    (22–45)、补充表 1 以及补充。


    # 密度对齐


    我们使用集合模型作为执行密度对齐的基准。为了对齐混合物，我们首先计算每种液体的概率 $P(\rho)$。通过训练 BAMBOO 模型来适应均匀压力（$\Delta
    P$）。使用这些不同的 MLFF，我们使用 600 pN 步生成密度分布。然后，我们为每种液体建立 $\Delta\rho$ 与 $\Delta P$ 之间的线性相关性。利用这一点，我们可以确定每种液体的值
    $V$。通过此，我们确定了应整合到每种液体 MLFF 中的特定 $\Delta P$ 值，以实现对齐。最后，我们使用补充方程 (58) 提供的结果——为每种液体确定的适当
    $\Delta P$ 值——将基准模型与集合数据进行对齐。关于 BAMBOO 密度对齐的细节请见补充方程 (54–58) 和补充图 9–13。


    # BAMBOO 的初始训练


    我们使用 GET 架构和结构来生成不同的相互作用，使用结合能量、力、维里张和应力的损失函数来训练 BAMBOO 中的神经网络。具体而言，BAMBOO 对电荷的训练通过四个方面：首先是训练神经网络、力和电荷，以及其他来自电势电荷密度的静电势；第三点是训练密度，即通过
    DFT $D$ 来自电荷密度的宏观观测值；第四点是对齐平衡结构。


    在这项工作中，我们使用 PyTorch 在 BAMBOO 中构建了神经网络，并使用学习率为 $10^{-2}$ 的 AdamMax 优化器。在训练过程中，权重衰减设置为
    0.0001，而学习率以 $10^{-4}$ 的速率降低。批大小为 128。该模型由三层组成，嵌入维度为 64。它具有 16 个注意力头，每层消息传递层使用
    0.5 Å 的截断，并包含了用于预测能量和力的双层全连接网络。


    # MLFFs


    我们使用 LAMMPS 进行 BAMBOO 的 MD 模拟。对于每个系统，初始步骤是能量最小化，限制为最大 10000 次迭代和 100000 次评估。之后，系统处于平衡状态，步长保持在至少
    1 fs。密度值如表所示。然后，我们在 DFT 集合下运行 4-ns 的生产运行，以估计液体的密度和电导率。我们使用 Einstein-Nernst 方法以及之前工作“On-surface
    of Maxwell-Wagner”中描述的方法计算电导率。MD 模拟的细节请见补充方程 (64)。


    # 数据可用性


    数据集可在 https://huggingface.co/datasets/ml-bamboo 获取。完整数据集包含参数、LAMMPS 的原子结构以及最终结果，集合数据和结果也可在
    Zenodo 获取：https://doi.org/10.5281/zenodo.6460320 (参考文献)。


    # 代码可用性


    源代码、GET 训练模型以及用于模拟的 LAMMPS 输入文件可在 https://github.com/bydentance/bamboo 获取，也可在
    Zenodo 获取：https://doi.org/10.5281/record.6460320 (参考文献)。


    # MLFF 的集合知识发现


    在这项工作中，我们使用带有随机种子的 DFT 测试了四个模型。随后，我们为所有系统从600 ps 等向同性 (NPT) MD 和 400 ps 正则系 (NVT)
