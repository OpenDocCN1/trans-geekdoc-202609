    近年来，利用机器学习力场（MLFFs）进行分子动力学（MD）模拟的使用日益增加。这一趋势主要归功于 MLFF 提供的结果比从头算量子力学模拟更快，且具有化学级精度。虽然经典方法高效，但在捕捉电解质的分子结构和行为方面往往会牺牲精度，因此需要一种平衡且通用的方法，来调和建模电解质中的差异：多种溶剂和不同类型的离子。


