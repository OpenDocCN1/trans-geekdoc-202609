    included. In addition, the structures, we can define the potential energy surface
    by density $D^{(i)}$. Finally, we combine the neural network, electrostatic and
    dispersion interactions to compute the total energy and force of each atom. More
    details of separation of interactions are provided in Supplementary Equations
    (22–45), Supplementary Table 1 and Supplementary


    # Density alignment


    We use the ensemble model as the baseline for performing density alignment. To
    align the mixture, we first calculate the probability $P(\rho)$ of each liquid.
    By training the BAMBOO model to adapt to uniformly pressures ($\Delta P$). Using
    these different MLFFs, we use 600 pN steps to generate the density profiles. We
    then establish a linear correlation between $\Delta\rho$ and the $\Delta P$ for
    each liquid. Leveraging this, we can determine the value $V$ for each liquid.
    Using this we identify the specific $\Delta P$ that should be incorporated into
    the MLFF for each liquid to achieve alignment. Finally, we use the results provided
    in Supplementary Equation (58)–the appropriate $\Delta P$ value identified for
    each liquid–align the baseline model with the ensemble data. Details on the density
    alignment of BAMBOO are provided in Supplementary Equations (54–58) and Supplementary
    Figures 9–13.


    # Initial training of BAMBOO


    We use the GET architecture and structure to generate different interactions,
    using a loss function combining energy, force, viral and stress to train the neural
    networks in BAMBOO. Specifically, the charge is trained by BAMBOO is by four aspects:
    first is to train the neural network, force and charge and other with the electrostatic
    potential from charge density from electric potential; the third is to train the
    density, a macroscopic observable from charge densities by DFT $D$; and the fourth
    is to align the equilibrium structures.


    In this work, we build neural networks in BAMBOO using PyTorch, and use the AdamMax
    optimizer at a learning rate of $10^{-2}$. In the training, the weight decay is
    set to 0.0001, while the learning rate decreases at a rate of $10^{-4}$. The batch
    size is 128. The model consists of three layers with an embedding dimension of
    64. It features 16 attention heads, uses a cut-off of 0.5 Å per message passing
    layer and includes the fully connected networks with two layers for predicting
    energy and force.


    # MLFFs


    We use LAMMPS for the MD simulations for BAMBOO. For each system, the initial
    step is energy minimization, which is constrained to a maximum of 10000 iterations
    and 100000 evaluations. Following this, the systems are subjected to equilibration
    with a step size maintained at at least 1 fs. The density values are provided
    in the following table. We then run 4-ns of production run under the DFT ensemble
    to estimate the density and conductivity of the liquids. We calculate the conductivities
    using the Einstein-Nernst and a method described in previous work ''On-surface
    of Maxwell-Wagner''. Details of the MD simulations are provided in Supplementary
    Equations (64).


    # Data availability


    Datasets are available at https://huggingface.co/datasets/ml-bamboo. The full
    dataset includes parameters, atomic structures for LAMMPS, and the final results,
    ensemble data and the results are also available in Zenodo at https://doi.org/10.5281/zenodo.6460320
    (ref).


    # Code availability


    The source codes, the GET training model and the LAMMPS input for simulations,
    are available at https://github.com/bydentance/bamboo and at Zenodo at https://doi.org/10.5281/record.6460320
    (ref).


