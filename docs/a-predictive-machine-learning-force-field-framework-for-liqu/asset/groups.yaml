    本文的主要贡献总结如下：

    (1) 我们提出了一种集成图等变变换器（GET）架构的机器学习模型，以捕捉半局部和直接静电相互作用。

    (2) 我们证明了集成知识蒸馏算法的应用，以减少基于机器学习的 MD 模拟所得结果的波动。

    (3) 我们提出了一种物理感知数据算法，将 MLFF-MD 模拟与实验数据对齐，这确保了物理一致性，并证明了未包含在对齐过程中的液体具有显著的局限性。因此，BAMBOO
    在预测各种液体的密度、粘度和离子电率方面表现出先进的精度。


