    # 用于液体电解质开发的预测性机器学习力场框架


    接收：2024年5月9日

    采纳：2025年2月10日

    发表：2025年4月1日


    Sheng Gong¹,³, Yumin Zhang¹,³, Zhenliang Mu²,³, Zhichen Pu²,

    Hongyi Wang², Xu Han², Zhaiao Yu¹, Mengyi Chen², , Tianze Zheng²,, Zhi Wang¹,,

    Lifei Chen¹,, Zhenze Yang¹,, Xiaojie Ji, Shaochen Shi², , Weihao Gao²,,⁵

    Wen Wan¹⁵


    尽管机器学习力场（MLFFs）在固体和小分子中得到了广泛应用，但在应用 MLFFs 模拟液体电解质方面存在明显空白——液体电解质是商业锂电池的关键组件。我们介绍了字节跳动人工智能分子模拟加速器
    BAMBOO，这是一个用于分子动力学的预测性框架，并展示了其在锂电池液体电解质背景下的能力。我们设计了一个受物理启发的图等变变换器架构作为 BAMBO 的骨干，以从量子力学模拟中学习。此外，我们引入了集成知识蒸馏方法并将其应用于
    MLFFs，以减少分子动力学模拟观测值的波动。最后，我们结合 BAMBOO 提出了一种密度对齐算法，该算法在预测各种溶剂和盐的密度、粘度和离子电率等关键电解质性质方面展现了先进的精度。当前模型在
    15 多种化学物质上进行了训练，在各种体系中实现了 0.01 g cm⁻³ 的平均密度。


    液体电解质是目前商业锂电池不可或缺的组件¹。现有的商业电解质大多基于碳酸盐，由五到十种不同的材料组成。通过实验探索分子相互作用以进行电解质理性设计既昂贵又耗时，并且严重依赖化学家的直觉和经验。局限性为从概念实验向产品市场的转化带来了挑战，特别是由于优化多种液体性质的复杂性日益增加。


    原子级模拟是详尽实验的一种便捷且可行的替代方案。然而，为了达到可靠性要求，例如高精度以及足够的时间尺度和长度尺度。量子力学模拟在描述电子性质方面具有高精度，但其计算量巨大，对于像液体电解质这样的大规模复杂系统是不实行的。虽然经典方法是高效，但往往在捕捉电解质的分子结构和行为方面牺牲了精度，因此需要一种平衡且通用的方法，来调和建模电解质中的差异：多种溶剂和不同类型的离子。


