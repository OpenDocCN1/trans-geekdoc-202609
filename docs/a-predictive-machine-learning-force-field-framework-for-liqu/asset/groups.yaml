    Li 原子电荷


    近似结构函数


    | | SSSP 0.751 | SSSP 0.484 | SSSP 0.182 |

    |---|---|---|---|

    | CIP | 0.171 | 0.260 | 0.276 |

    | AGG | 0.078 | 0.246 | 0.542 |


    ![](img/ac51b572e1f4f05e6515577021393961_5_1.png)


    图 1：BAMEO 中溶剂化 Li 的原子电荷分布和结构函数。左侧：5.49 wt% DMC:EC 环境中 1.12 m、2.25 m 和 3.74 m 的电荷分布。每个面板中的虚线从左到右表示高于
    O 的分布。第二条和第三条虚线代表与 CIP 和 AGG 相关的未配对相互作用电值。左侧：基于纯溶剂和少组分电解质等系统的电荷分布和结构函数，BAMEO 在密度和粘度预测方面与简单系统具有相似的水平（补充信息
    1）。更重要的是，我们证明对于多组分系统，BAMEO 的预测精度高于目前用于模拟液体性质的先进方法，如液体优化电势（OPAX）框架。溶剂（碳酸乙烯）和电解质的
    MD 模拟在 283-343 K 温度范围内保持稳定。对于密度预测，我们发现与基础分子相比，溶剂化配合物的 BAMEO 表现非常出色。


    作为对 DFT 数据集中不存在的分子的迁移性，我们采用了 BAMEO 对化学物种的迁移性程度。对于 BAMEO 是否能模拟与 DFT 训练集包含类型类似的分子（补充图
    1），我们发现对于具有不饱和键的系统，BAMEO 可以通过长时间 MD 模拟准确预测性质。对于 BAMEO 能够模拟的分子，其密度分别为 1.045 g/cm³、1.11
    g/cm³ 和 1.7 wt%。为了让 BAMEO 能够样本外系统，我们需要足够的努力来提高迁移性。第一个方法是考虑机器学习电势，例如 MACE-FF（参考文献
    24），它在数百万种配置上进行了训练。使用大规模训练策略的限制也限制了断键事件的使用。最近的工作表明，基于 GNN 的模型比基于局部描述符的模型更健壮，这可以启发……


    ## 溶液结构和原子电荷


    除了对宏观性质的准确预测外，BAMEO 显式预测原子电荷使其能够提供液体溶液结构的额外见解。这里我们展示了从 0.5 m、3.7 m 和每公斤盐浓度模拟的三种环境的
    Li- 和 O- 电荷直方图。Li 与 DMC 的重量比 1:49 在所有环境中保持一致。所有三个 FST 的直方图在补充图 15 和 16 中。


    ## 讨论


    在图 3a 中观察到三个不同的峰。每个峰（Li+）分别位于 0.622、0.626 和 0.632。随着浓度从 0.5 m 变为 3.7 m，峰发生了移动，尽管高度不同。具体而言，最高峰对应的最低
    Li 浓度从 0.5 m 增加到 3.7 m。


    总结，我们提出了用于液体 MD 模拟的 BAMEO框架。首先，我们使用 GET 架构分离局部（原子）静电和色散相互作用，利用 DFT 计算的知识。我们引入了来自
    BAMEO MD 模拟的集成解码结果。此外，我们提出了一种基于物理的对齐方法，以建立宏观和微观尺度结果之间一致的关系。我们的结果证明了对齐过程在减少差异方面的有效性。


    电荷分布的变化揭示了不同浓度下变化的溶液结构。我们解构了 3 ns MD 模拟帧，并检查了 Li+ 离子的溶液结构。溶液结构的类型及其比例列表并在每个电荷直方图中所示。这些比例与观察到的第一溶剂壳轨迹一致，随后提取了由溶剂分子包围的第一溶剂壳的中心轨迹。


    我们对 BAMEO 在溶剂和电解质上的性能进行了全面评估。我们的模拟结果表明，单个 BAMEO 模型可以高精度预测性质、结构和电荷。BAMEO 模型能够模拟各种成分中最多
    15 种物种。这种健健性强调了 BAMEO 在促进实际分子系统设计和优化方面的价值。


    通常，溶液结构分为 SIP、CIP 和 AG。SIP 表示由溶剂分子组成的结构；CIP 结构包含一个阴离子；AG 是由溶剂和阴离子组成的结构。我们对 0.5
    m、2.2 m 和 3.7 m Li 环境的 FST 半径分析分别为 0.791、0.494 和 0.182。CIP 半径为 0.171、0.260 和 0.322，AG
    半径为 0.076、0.142。SIP、CIP 和 AG 之间的差异显示为 Li+ 浓度的函数。我们可视化了峰高效应。


    ## 方法


    众所周知，Li+ 与周围分子（包括溶剂和阴离子）之间的溶液相互作用与基于 Li+ 的配环境正比。电解质可能会导致溶液环境中部分电荷的极化诱导变化。我们希望通过对齐
    FST 内不同环境的 Li+ 电荷分布来证明这一点。我们观察到三个重叠的分布（图 3d–f），而其他显示出所有浓度的单一分布（补充图 17）。


    ## GET


    如图 3 所示，识别出两个峰并用红色虚线标出。我们假设这些峰源于 Li+ 环境中的两种氧原子。这与我们的模拟观察一致，即在 0.5 m 时，由于低浓度和 AG
    相互作用，Li+ 周围着溶剂和阴离子原子。这些单元可能没有通过溶剂分子的稳定。在锂离子电解质中，溶剂分子带电，DM 设计用于极化正离子，导致阴离子释放溶剂分子。-0.370
    和 -0.360 的电荷分布表明自由 FST 潜在的四面体差异。


