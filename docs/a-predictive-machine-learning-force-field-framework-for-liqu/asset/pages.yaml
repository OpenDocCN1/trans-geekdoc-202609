    liquids, with a particular focus on electrolytes. The main contributions of this
    paper are summarized as follows: (1) We present a ML model that integrates a graph
    equivariant transformer (GET) architecture to capture both semi-local and direct
    electrostatic interactions. (2) We demonstrate the application of an ensemble
    knowledge distillation algorithm to reduce the fluctuation of results obtained
    from ML-based MD simulations. (3) We propose a physics-informed data algorithm
    aligning MLFF-MD simulations with experimental data, which ensures physical consistency
    and demonstrates considerable limitations to liquids not included in the alignment
    process. As a result, BAMBOO shows state-of-the-art accuracy in predicting the
