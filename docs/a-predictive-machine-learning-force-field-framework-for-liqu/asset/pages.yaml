    # Ensemble distillation and density alignment


    In Fig. 2, we illustrate the concept of ensemble knowledge-distillation in machine
    learning can introduce various challenges into MD simulations. With particular,
    if we use electrolytes that GNNs trained with different datasets report, the density
    results vary, yielding divergent macroscopic properties. This density fluctuation
    is an inherent process which, in particular, an MD simulation in liquids, can
    be treated as fluctuations of density around 0.004 g/cm³ across different random
    seeds of the BAMBO MLFFs.


    In Fig. 6, we show that density alignment effectively reduces density errors from
    0.005 g/cm³ to 0.001 g/cm³. Importantly, the reduction in error achieved, using
    only 13 experimental data points included in the alignment, transfers to not only
    the tested molecules but also those with higher salt concentrations (Supplementary
    Figs 10a and 12a). For example, the density of molecules with hydrogen bonding
    characteristics is significantly improved.


    To address this issue we aim to mitigate the discrepancy among MD simulations
    by using ensemble of MLFFs to predict the energy and forces of MD trajectories.
    We aggregate the mean and use this mean value to optimize the MLFFs. In Fig. 2
    and Supplementary Table 7, we demonstrate the standard deviation of density predictions
    from five models by more than 50%, from 0.030 g/cm³ to 0.014 g/cm³. In particular,
    ensemble knowledge distillation does not require new DFT bodies. By BAMBO and
    electrolytes used, this concept can be applied to any MLFF for systems. In Supplementary
    Table 8, we provide another example of utilizing ensemble knowledge-distillation
    on the fluctuation results of M3GN* in simulating solid-state phase


