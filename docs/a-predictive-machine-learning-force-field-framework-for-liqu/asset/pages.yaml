    In recent years, there has been a growing utilization of machine learning force
    fields (MLFFs) to perform molecular dynamics (MD) simulations. This trend is primarily
    attributed to the ability of MLFF to deliver results faster than initio quantum
    mechanical simulations, as well as chemical quality data with comparable accuracy.
    The development of MLFFs has been limited by the lack of high-quality data for
    diverse fields of matter. This field has also seen a shift from descriptor-based
    rotation-invariant MLFFs$^{1-16}$ towards graph neural networks (GNNs) with rotation-equivariant
    representations$^{17-20}$ and transformers. On the other, progress has been made
    by incorporating constraints derived from general physical consistency into MLFFs.
    This includes electrostatic interactions$^{21-24}$ and spin-spin interactions.


    # Results


    Advances in the architecture of ML models and the concept of ‘universal’ ML, which
    allows a single model to simulate a wide range of systems, have gained increasing
    attention within the field of solid-state materials$^{25-30}$ and bio-organic
    molecules$^{31-32}$. However, when it comes to electrolytes, which are complex
    mixtures, the ability of ML to predict multiple properties across various solvents
    and salts is still lacking. This limitation may arise from the complex challenges
    inherent in electrolytes, such as the coexistence of different species and the
    formation of ion pairs and clusters (AGG). As a result, utilizing to simulate
    aqueous systems$^{33-34}$, molecular liquids and ionic liquids$^{35}$ remains
    a notable research difficulty focused on MLFF for electrolytes.


    We illustrate the workflow of BAMBOO. In Ia., we simulate local environments within
    lithium electrolyte as gas clusters and subsequently use density functional theory
    (DFT) to compute their energies, structures, and properties. In Ib., we demonstrate
    the broad accuracy of BAMBOO on various molecules and salts in the DFT dataset
    (Fig. 1). In particular, our focus encompasses compounds commonly found in electrolytes
    utilizing lithium ions, such as carbonates. In Ic., we incorporate two most frequently
    used organic liquids—ethanol (EO) and acetone (AC)—to show the generalizability
    of the trained model. The quantities calculated using DFT are used to train a
    GNN to generate the MLFF. The MLFF is then used to perform MD simulations. These
    independently trained GNNs are then compared with measured data, specifically
    density in this context, to evaluate their performance. Details of methodology,
    distillation and alignment algorithm are provided in the following sections.


    Prior to this work, several efforts have been made to simulate electrolytes using
    MLFFs: Ref29 utilized deep potential to calculate the density and solution structure
    of LiTFSI in water; Ref36 used a charge reactive neural network to predict the
    ionic conductivity of electrolytes in solvents. Despite achieving some success,
    these studies lack clear evidence regarding the generalizability of their findings
    across a wide range of electrolytes. For instance, Ref30 used a charge reactive
    neural network to achieve high accuracy only for specific salt systems.


    In addition to the scarcity of MLFFs for electrolytes, there are two major challenges
    encountered with MLFFs: we have encountered issues of data scarcity and fluctuation
    of results, which stem from the inherent nature of ‘machine-learning’ and the
    partial usability of MLFFs. Most deep learning-based models are solely relying
    on quantum mechanical simulations, which lack the flexibility to match experimental
    data of diverse systems across different scales.


    Despite the conceptual challenge of universal molecular fields$^{37-39}$, deep
    learning-based MLFFs are available parameters are limited by optimized experimental
    results.


