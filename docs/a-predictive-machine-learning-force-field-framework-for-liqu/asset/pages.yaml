    Despite the widespread applications of machine learning fields (MLFFs) in solids
    and small molecules, there is a notable gap in applying MLFFs to simulate liquid
    electrolytes—a critical component of commercial lithium-ion batteries. We introduce
    ByteDance Artificial Intelligence Molecular simulation Booster BAMBO, a predictive
    framework for molecular dynamics, with a demonstration of its capability in the
    context of liquid electrolytes for lithium batteries. We design a physics-inspired
    graph equivariant transformer architecture as the backbone of BAMBO to learn from
    quantum mechanical simulations. Additionally, we introduce an ensemble knowledge
    distillation approach and apply it to MLFFs to reduce the fluctuation of observations
    from molecular dynamics simulations. Finally, we propose a density alignment algorithm
    alongside BAMBO which demonstrates state-of-the-art accuracy in predicting key
    electrolyte properties such as density, viscosity and ionic conductivity across
    various solvents and salts. The current model, trained on more than 15 chemical
    species, achieves an average density of 0.01 g cm⁻³ on various


