  md: "# B.4 ARIMA Model Save Bug Workaround\n\nZae Myung Kim discovered this bug\
    \ in September 2016 and reported the fault. You can read all about it here:\n\n\
    +   BUG: Implemented `__getnewargs__()` method for unpickling.  \nhttps://github.com/statsmodels/statsmodels/pull/3217\n\
    \nThe bug occurs because a function required by pickle (the library used to serialize\
    \ Python objects) has not been defined in Statsmodels. A function `__getnewargs__`\\\
    [^1] must be defined in the ARIMA model prior to saving that defines the arguments\
    \ needed to construct the object. We can work around this issue. The fix involves\
    \ two things:\n\n+   1. Defining an implementation of the `__getnewargs__()` function\
    \ suitable for the ARIMA object.\n\n2. Adding the new function to ARIMA.\n\nThankfully,\
    \ Zae Myung Kim provided an example of the function in his bug report so we can\
    \ just use that directly:\n\n```\n```\ndef __getnewargs__(self):\n    return ((self.endog),(self.k_lags,\
    \ self.k_diff, self.k_ma))\n```\n```\n\nListing B.7: Example of defining the missing\
    \ pickle function.\n\nPython allows us to monkey patch an object, even one from\
    \ a library like Statsmodels. We can define a new function on an existing object\
    \ using assignment. We can do this for the `__getnewargs__()` function on the\
    \ ARIMA object as follows:\n\n```\n```\nARIMA.__getnewargs__ = __getnewargs__\n\
    ```\n```\n\nListing B.8: Example of adding the missing function to the ARIMA class.\n\
    \nThe complete example of training, saving, and loading an ARIMA model in Python\
    \ with the monkey patch is listed below:\n\n```\n```python\n# save and load an\
    \ ARIMA model with a workaround\nfrom pandas import read_csv\nfrom statsmodels.tsa.arima_model\
    \ import ARIMA\nfrom statsmodels.tsa.arima_model import ARIMAResults\n\n# monkey\
    \ patch around bug in ARIMA class\ndef __getnewargs__(self):\n    return ((self.endog),(self.k_lags,\
    \ self.k_diff, self.k_ma))\nARIMA.__getnewargs__ = __getnewargs__\n\n# load data\n\
    series = read_csv('daily-total-female-births.csv', header=0, index_col=0, parse_dates=True,\n\
    \                  squeeze=True)\n# prepare data\nX = series.values\nX = X.astype('float32')\n\
    ```\n```\n\n\\[^1]: https://docs.python.org/2/library/pickle.html#object.__getnewargs__"
