  md: '# ## Chapter 4


    # # Load and Explore Time Series Data


    The Pandas library in Python provides excellent, built-in support for time series
    data. Once loaded, Pandas also provides tools to explore and better understand
    your dataset. In this lesson, you will discover how to load and explore your time
    series dataset. After completing this tutorial, you will know:


    +   - How to load your time series dataset from a CSV file using Pandas.

    - How to peek at the loaded data and query using date-times.

    - How to calculate and review summary statistics.


    Let’s get started.


    # ## 4.1 Daily Female Births Dataset


    In this lesson, we will use the Daily Female Births Dataset as an example. This
    dataset describes the number of daily female births in California in 1959. You
    can learn more about the dataset in Appendix A.4. Place the dataset in your current
    working directory with the filename `daily-total-female-births.csv`.


    # ## 4.2 Load Time Series Data


    Pandas represented time series datasets as a Series. A Series¹ is a one-dimensional
    array with a time label for each row. The main function for loading CSV data in
    Pandas is the read_csv() function². We can use this to load the time series as
    a Series object, instead of a DataFrame, as follows:


    ```

    ```

    # load dataset using read_csv()

    from pandas import read_csv

    series = read_csv(''daily-total-female-births.csv'', header=0, index_col=0, parse_dates=True,
    squeeze=True)

    print(type(series))

    print(series.head())

    ```

    ```


    ¹http://pandas.pydata.org/pandas-docs/stable/generated/pandas.Series.html

    ²http://pandas.pydata.org/pandas-docs/stable/generated/pandas.read_csv.html'
  merge: -1
  img_proc: true
