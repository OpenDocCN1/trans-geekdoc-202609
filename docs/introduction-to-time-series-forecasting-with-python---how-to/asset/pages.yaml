    # ## 19.8 Residual Autocorrelation Plot


    Autocorrelation calculates the strength of the relationship between an observation
    and observations at prior time steps. We can calculate the autocorrelation of
    the residual error time series and plot the results. This is called an autocorrelation
    plot. We would not expect there to be any correlation between the residuals. This
    would be shown by autocorrelation scores being below the threshold of significance
    (dashed and dotted horizontal lines on the plot).


    A significant autocorrelation in the residual plot suggests that the model could
    be doing a better job of incorporating the relationship between observations and
    lagged observations, called autoregression. Pandas provides a built-in function
    for calculating an autocorrelation plot, called **autocorrelation_plot**().


