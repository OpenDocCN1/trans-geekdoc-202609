  md: "# ## B.3 ARIMA Model Save Bug\n\nWe can easily train an ARIMA model on the\
    \ Daily Female Births dataset. The code snippet below trains an ARIMA(1,1,1) on\
    \ the dataset. The model.fit() function returns an ARIMAResults object on which\
    \ we can call save() to save the model to file and load() to later load it.\n\n\
    ```\n```\n# save and load an ARIMA model that causes an error\nfrom pandas import\
    \ read_csv\nfrom statsmodels.tsa.arima_model import ARIMA\nfrom statsmodels.tsa.arima_model\
    \ import ARIMAResults\n# load data\nseries = read_csv('daily-total-female-births.csv',\
    \ header=0, index_col=0, parse_dates=True, squeeze=True)\n# prepare data\nX =\
    \ series.values\nX = X.astype('float32')\n# fit model\nmodel = ARIMA(X, order=(1,1,1))\n\
    model_fit = model.fit()\n# save model\nmodel_fit.save('model.pkl')\n# load model\n\
    loaded = ARIMAResults.load('model.pkl')\n```\n```\n\nListing B.3: Save and load\
    \ an ARIMA model that causes an error.\n\nRunning this example will train the\
    \ model and save it to file without problem. An error will be reported when you\
    \ try to load the model from file.\n\n```\n```\nTraceback (most recent call last):\n\
    \  File \"...\", line 16, in <module>\n    loaded = ARIMAResults.load('model.pkl')\n\
    \  File \".../site-packages/statsmodels/base/model.py\", line 1529, in load\n\
    \    return load_pickle(fname)\n  File \".../site-packages/statsmodels/iolib/smpickle.py\"\
    , line 41, in load_pickle\n    return cPickle.load(fin)\nTypeError: __new__()\
    \ takes at least 3 arguments (1 given)\n```\n```\n\nListing B.4: Example error\
