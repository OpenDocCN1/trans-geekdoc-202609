    # ## 7.4  Downsampling Data


    The sales data is monthly, but perhaps we would prefer the data to be quarterly.
    The year can be divided into 4 business quarters, 3 months a piece. Instead of
    creating new rows between existing observations, the `resample()` function in
    Pandas will group all observations by the new frequency.


    We could use an alias like **3M** to create groups of 3 months, but this might
    have trouble if our observations did not start in January, April, July, or October.
    Pandas does have a quarter-aware alias of Q that we can use for this purpose.
    We must now decide how to create a new quarterly value from each group of 3 records.
    A good starting point is to calculate the average monthly sales numbers for the
    quarter. For this, we can use the `mean()` function. Putting this all together,
    we get the following code example.


    ```

    # downsample to quarterly intervals

    from pandas import read_csv

    from pandas import datetime

    from matplotlib import pyplot


    ```'
