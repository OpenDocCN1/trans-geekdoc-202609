  md: "# 23.4. Autoregression of Residual Error\n\n+   2. Predict the residual error\
    \ using the autoregression model.\n\nThe autoregression model requires the residual\
    \ error of the 15 previous time steps. Therefore, we must keep these values handy.\
    \ As we step through the test dataset timestep by timestep making predictions\
    \ and estimating error, we can then calculate the actual residual error and update\
    \ the residual error time series lag values (history) so that we can calculate\
    \ the error at the next time step.\n\nThis is a walk forward forecast, or a rolling\
    \ forecast, model. We end up with a time series of the residual forecast error\
    \ from the train dataset and a predicted residual error on the test dataset. We\
    \ can plot these and get a quick idea of how skillful the model is at predicting\
    \ residual error. The complete example is listed below.\n\n```\n# forecast residual\
    \ forecast error\nfrom pandas import read_csv\nfrom pandas import DataFrame\n\
    from pandas import concat\nfrom statsmodels.tsa.ar_model import AR\nfrom matplotlib\
    \ import pyplot\n\nseries = read_csv('daily-total-female-births.csv', header=0,\
    \ index_col=0, parse_dates=True, squeeze=True)\n\n# create lagged dataset\nvalues\
    \ = DataFrame(series.values)\ndataframe = concat([values.shift(1), values], axis=1)\n\
    dataframe.columns = ['t', 't+1']\n\n# split into train and test sets\nX = dataframe.values\n\
    train_size = int(len(X) * 0.66)\ntrain, test = X[1:train_size], X[train_size:]\n\
    train_X, train_y = train[:,0], train[:,1]\ntest_X, test_y = test[:,0], test[:,1]\n\
    \n# persistence model on training set\ntrain_pred = [x for x in train_X]\n\n#\
    \ calculate residuals\ntrain_resid = [train_y[i]-train_pred[i] for i in range(len(train_pred))]\n\
    \n# model the training set residuals\nmodel = AR(train_resid)\nmodel_fit = model.fit()\n\
    window = model_fit.k_ar\ncoef = model_fit.params\n\n# walk forward over time steps\
    \ in test\nhistory = train_resid[len(train_resid)-window:]\nhistory = [history[i]\
    \ for i in range(len(history))]\npredictions = list()\nexpected_error = list()\n\
    \nfor t in range(len(test_y)):\n\t# persistence\n\twhat = test_X[t]\n\terror =\
