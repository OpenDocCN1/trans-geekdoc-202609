    \ ARIMA(p,d,q) requires three parameters and is traditionally configured manually.\
    \ Analysis of the time series data assumes that we are working with a stationary\
    \ time series. The time series is almost certainly non-stationary. We can make\
    \ it stationary by first differencing the series and using a statistical test\
    \ to confirm that the result is stationary. The example below creates a stationary\
    \ version of the series and saves it to file *stationary.csv*.\n\n```\n# statistical\
    \ test for the stationarity of the time series\nfrom pandas import read_csv\n\
    from pandas import Series\nfrom statsmodels.tsa.stattools import adf\n\n# create\
    \ a differenced time series\ndef difference(dataset):\n\tdiff = list()\n\tfor\
    \ i in range(1, len(dataset)):\n\t\tvalue = dataset[i] - dataset[i - 1]\n\t\t\
    diff.append(value)\n\treturn Series(diff)\n\nseries = read_csv('dataset.csv',\
    \ header=None, index_col=0, parse_dates=True, squeeze=True)\nX = series.values\n\
    # difference data\nstationary = difference(X)\nstationary.index = series.index[1:]\n\
    # check if stationary\nresult = adf(stationary)\nprint('ADF Statistic: %f' % result[0])\n\
    print('p-value: %f' % result[1])\nprint('Critical Values:')\nfor key, value in\
    \ result[4].items():\n\tprint('\\t%s: %.3f' % (key, value))\n# save\nstationary.to_csv('stationary.csv',\
    \ header=False)\n```\n\nListing 30.14: Create a stationary version of the Boston\
    \ Robberies dataset.\n\nRunning the example outputs the result of a statistical\
    \ significance test of whether the 1-lag differenced series is stationary. Specifically,\
    \ the augmented Dickey-Fuller test. The results show that the test statistic value\
    \ -3.980946 is smaller than the critical value at 5% of -2.893. This suggests\
    \ that we can reject the null hypothesis with a significance level of less than\
    \ 5% (i.e. a low probability that the result is a statistical fluke). Rejecting\
    \ the null hypothesis means that the process has no unit root, and in turn that\
    \ the 1-lag differenced time series is stationary or does not have time-dependent\
