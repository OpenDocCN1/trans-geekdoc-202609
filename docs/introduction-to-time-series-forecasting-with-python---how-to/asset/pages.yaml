  md: '# 21.3.2 Configuring AR and MA


    Two diagnostic plots can be used to help choose the p and q parameters of the
    ARMA or ARIMA. They are:


    +   * **Autocorrelation Function (ACF).** The plot summarizes the correlation
    of an observation with lag values. The x-axis shows the lag and the y-axis shows
    the correlation coefficient between -1 and 1 for negative and positive correlation.

    * **Partial Autocorrelation Function (PACF).** The plot summarizes the correlations
    for an observation with lag values that is not accounted for by prior lagged observations.


    Both plots are drawn as bar charts showing the 95% and 99% confidence intervals
    as horizontal lines. Bars that cross these confidence intervals are therefore
    more significant and worth noting. Some useful patterns you may observe on these
    plots are:


    +   * The model is AR if the ACF trails off after a lag and has a hard cut-off
    in the PACF after a lag. This lag is taken as the value for p.

    * The model is MA if the PACF trails off after a lag and has a hard cut-off in
    the ACF after the lag. This lag value is taken as the value for q.

    * The model is a mix of AR and MA if both the ACF and PACF trail off.


    # 21.4 Estimation


    Estimation involves using numerical methods to minimize a loss or error term.
    We will not go into the details of estimating model parameters as these details
    are handled by the chosen library or tool. I would recommend referring to a textbook
    for a deeper understanding of the optimization problem to be solved by ARMA and
    ARIMA models and optimization methods like Limited-memory BFGS used to solve it.


    # 21.5 Diagnostic Checking


    The idea of diagnostic checking is to look for evidence that the model is not
    a good fit for the data. Two useful areas to investigate diagnostics are:


    +   1. Overfitting.

    2. Residual Errors.


    # 21.5.1 Overfitting


    The first check is to check whether the model overfits the data. Generally, this
    means that the model is more complex than it needs to be and captures random noise
    in the training data. This is a problem for time series forecasting because it
    negatively impacts the ability of the model to generalize, resulting in poor forecast
    performance on out-of-sample data. Careful attention must be paid to both in-sample
    and out-of-sample performance and this requires the careful design of a robust
    test harness for evaluating models.'
