    # 14.1 Seasonality in Time Series


    Time series data may contain seasonal variation. Seasonal variation, or seasonality,
    are cycles that repeat regularly over time.


    A repeating pattern within each year is known as seasonal variation, although
    the term is applied more generally to repeating patterns within any fixed period.


    > — Page 6, *Introductory Time Series with R*.


    A cycle structure in a time series may or may not be seasonal. If it consistently
    repeats at the same frequency, it is seasonal, otherwise it is not seasonal and
    is called a cycle.


    # 14.1.1 Benefits to Machine Learning


