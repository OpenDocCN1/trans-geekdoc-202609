  md: "# ### 14.3 Seasonal Adjustment with Differencing\n\nA simple way to correct\
    \ for a seasonal component is to use differencing. If there is a seasonal component\
    \ at the level of one week, then we can remove it on an observation today by subtracting\
    \ the value from last week. In the case of the Minimum Daily Temperatures dataset,\
    \ it looks like we have a seasonal component each year showing swing from summer\
    \ to winter.\n\nWe can subtract the daily minimum temperature from the same day\
    \ last year to correct for seasonality. This would require special handling of\
    \ February 29th in leap years and would mean that the first year of data would\
    \ not be available for modeling. Below is an example of using the difference method\
    \ on the daily data in Python.\n\n```\n# deseasonalize a time series using differencing\n\
    from pandas import read_csv\nfrom matplotlib import pyplot\nseries = read_csv('daily-minimum-temperatures.csv',\
    \ header=0, index_col=0,\n        parse_dates=True, squeeze=True)\nX = series.values\n\
