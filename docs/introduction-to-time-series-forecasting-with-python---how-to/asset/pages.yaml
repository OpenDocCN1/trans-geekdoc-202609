    # # 32.6 ARIMA Models


    In this section, we will develop Autoregressive Integrated Moving Average, or
    ARIMA, models for the problem. We will approach modeling by both manual and automatic
    configuration of the ARIMA model. This will be followed by a third step of investigating
    the residual errors of the chosen model. As such, this section is broken down
    into 3 steps:


    +   1. Manually Configure the ARIMA.

    2. Automatically Configure the ARIMA.

    3. Review Residual Errors.'
