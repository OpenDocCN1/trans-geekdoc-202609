    \ dataset and plot the differenced result.\n\nRunning the example outputs the\
    \ result of a statistical significance test of whether the differenced series\
    \ is stationary. Specifically, the augmented Dickey-Fuller test. The results show\
    \ that the test statistic value -6.126719 is smaller than the critical value at\
    \ 1% of -3.534. This suggests that we can reject the null hypothesis with a significance\
    \ level of less than 1% (i.e. a low probability that the result is a statistical\
    \ fluke). Rejecting the null hypothesis means that the process has no unit root,\
    \ and in turn that the time series is stationary or does not have time-dependent\
    \ structure.\n\n```\n```\nADF Statistic: -6.126719\np-value: 0.000000\nCritical\
