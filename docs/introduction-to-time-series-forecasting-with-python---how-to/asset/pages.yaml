  md: '# # Chapter 9


    # ## Moving Average Smoothing


    Moving average smoothing is a naïve and effective technique in time series forecasting.
    It can be used for data preparation, feature engineering, and even directly for
    making predictions. In this tutorial, you will discover how to use moving average
    smoothing for time series forecasting with Python. After completing this tutorial,
    you will know:


    +   - How moving average smoothing works and some expectations of your data before
    you can use it.


    +   - How to use moving average smoothing for data preparation and feature engineering.


    +   - How to use moving average smoothing to make predictions.


    Let''s get started.


    # ## 9.1 Moving Average Smoothing


    Smoothing is a technique applied to time series to remove the fine-grained variation
    between time steps. The hope of smoothing is to remove noise and better expose
    the signal of the underlying causal processes. Moving averages are a simple and
    common type of smoothing used in time series analysis and time series forecasting.
    Calculating a moving average involves creating a new series where the values are
    comprised of the average of raw observations in the original time series.


    A moving average requires that you specify a window size called the window width.
    This defines the number of raw observations used to calculate the moving average
    value. The moving part in the moving average refers to the fact that the window
    defined by the window width is slid along the time series to calculate the average
    values in the new series. There are two main types of moving average that are
    used: Centered and Trailing Moving Average.


    # ### 9.1.1 Centered Moving Average


    The value at time (t) is calculated as the average of raw observations at, before,
    and after time (t). For example, a center moving average with a window of 3 would
    be calculated as:


    ```

    *center_ma(t) = mean(obs(t - 1), obs(t), obs(t + 1))*


    (9.1)

    ```'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'This method requires knowledge of future values, and as such is used on time
    series analysis to better understand the dataset. A center moving average can
    be used as a general method to remove trend and seasonal components from a time
    series, a method that we often cannot use when forecasting.


    # 9.1.2 Trailing Moving Average


    The value at time (t) is calculated as the average of the raw observations at
    and before the time (t). For example, a trailing moving average with a window
    of 3 would be calculated as:


    ```

    trail_ma(t) = mean(obs(t - 2), obs(t - 1), obs(t))          (9.2)

    ```


    Trailing moving average only uses historical observations and is used on time
    series forecasting. It is the type of moving average that we will focus on in
    this tutorial.


    # 9.2 Data Expectations


    Calculating a moving average of a time series makes some assumptions about your
    data. It is assumed that both trend and seasonal components have been removed
    from your time series. This means that your time series is stationary, or does
    not show obvious trends (long-term increasing or decreasing movement) or seasonality
    (consistent periodic structure).


    There are many methods to remove trends and seasonality from a time series dataset
    when forecasting. Two good methods for each are to use the differencing method
    and to model the behavior and explicitly subtract it from the series.


    Moving average values can be used in a number of ways when using machine learning
    algorithms on time series problems. In this tutorial, we will look at how we can
    calculate trailing moving average values for use as data preparation, feature
    engineering, and for directly making predictions. Before we dive into these examples,
    let’s look at the Daily Female Births dataset that we will use in each example.


    # 9.3 Daily Female Births Dataset


    In this lesson, we will use the Daily Female Births Dataset as an example. This
    dataset describes the number of daily female births in California in 1959. You
    can learn more about the dataset in Appendix A.4. Place the dataset in your current
    working directory with the filename `daily-total-female-births.csv`.


    # 9.4 Moving Average as Data Preparation


    Moving average can be used as a data preparation technique to create a smoothed
    version of the original dataset. Smoothing is useful as a data preparation technique
    as it can reduce the random variation in the observations and better expose the
    structure of the underlying causal processes.'
