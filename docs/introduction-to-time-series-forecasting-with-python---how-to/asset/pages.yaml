    # # 9.5 Moving Average as Feature Engineering


    The moving average can be used as a source of new information when modeling a
    time series forecast as a supervised learning problem. In this case, the moving
    average is calculated and added as a new input feature used to predict the next
    time step. First, a copy of the series must be shifted forward by one time step.
    This will represent the input to our prediction problem, or a `lag=1` version
    of the series. This is a standard supervised learning view of the time series
    problem. For example:


    ```

    ```

    x,      y

    NaN,    obs1

    obs1,   obs2

    obs2,   obs3

