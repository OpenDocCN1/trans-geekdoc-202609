    The Statsmodels API does not make it easy to update the model as new observations
    become available. One way would be to re-train the AR model each day as new observations
    become available, and that may be a valid approach, if not computationally expensive.
    An alternative would be to use the learned coefficients and manually make predictions.
    This requires that the history of 29 prior observations be kept and that the coefficients
    be retrieved from the model and used in the regression equation to come up with
    new forecasts.


    The coefficients are provided in an array with the intercept term followed by
    the coefficients for each lag variable starting at **t** to **t-n**. We simply
    need to use them in the right order on the history of observations, as follows:


    ```

    $\hat{y} = b0 + (b1 \times X1) + (b2 \times X2) \ldots (bn \times Xn)$ (22.3)

    ```


