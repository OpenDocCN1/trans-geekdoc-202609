  md: '# Chapter 22


    # Autoregression Models for Forecasting


    Autoregression is a time series model that uses observations from previous time
    steps as input to a regression equation to predict the value at the next time
    step. It is a very simple idea that can result in accurate forecasts on a range
    of time series problems. In this tutorial, you will discover how to implement
    an autoregressive model for time series forecasting with Python. After completing
    this tutorial, you will know:


    +   - How to explore your time series data for autocorrelation.

    - How to develop an autocorrelation model and use it to make predictions.

    - How to use a developed autocorrelation model to make rolling predictions.


    Let''s get started.


    # 22.1 Autoregression


    A regression model, such as linear regression, models an output value based on
    a linear combination of input values. For example:


    yhat = b0 + (b1 × X1)

    (22.1)


    Where yhat is the prediction, b0 and b1 are coefficients found by optimizing the
    model on training data, and X is an input value. This technique can be used on
    time series where input variables are taken as observations at previous time steps,
    called lag variables. For example, we can predict the value for the next time
    step (t+1) given the observations at the current (t and previous t-1). As a regression
    model, this would look as follows:


    X(t + 1) = b0 + (b1 × X(t)) + (b2 × X(t − 1))

    (22.2)


    Because the regression model uses data from the same input variable at previous
    time steps, it is referred to as an autoregression (regression of self).'
  merge: -1
  img_proc: true
- pgno: 200
  md: "# ## 22.2 Autocorrelation\n\nAn autoregression model makes an assumption that\
    \ the observations at current and previous time steps are useful to predict the\
    \ value at the next time step. This relationship between variables is called correlation.\
    \ If both variables change in the same direction (e.g. go up together or down\
    \ together), this is called a positive correlation. If the variables move in opposite\
    \ directions as values change (e.g. one goes up and one goes down), then this\
    \ is called negative correlation.\n\nWe can use statistical measures to calculate\
    \ the correlation between the output variable and values at previous time steps\
    \ at various different lags. The stronger the correlation between the output variable\
    \ and a specific lagged variable, the more weight that autoregression model can\
    \ put on that variable when modeling. Again, because the correlation is calculated\
    \ between the variable and itself at previous time steps, it is called an autocorrelation.\
    \ It is also called serial correlation because of the sequenced structure of time\
    \ series data.\n\nThe correlation statistics can also help to choose which lag\
    \ variables will be useful in a model and which will not. Interestingly, if all\
    \ lag variables show low or no correlation with the output variable, then it suggests\
    \ that the time series problem may not be predictable. This can be very useful\
    \ when getting started on a new dataset.\n\nIn this tutorial, we will investigate\
    \ the autocorrelation of a univariate time series then develop an autoregression\
    \ model and use it to make predictions. Before we do that, let’s first review\
    \ the Minimum Daily Temperatures data that will be used in the examples.\n\n#\
    \ ## 22.3 Minimum Daily Temperatures Dataset\n\nIn this lesson, we will use the\
