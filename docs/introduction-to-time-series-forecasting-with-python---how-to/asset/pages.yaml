    We can make the same changes for the data files for the manual case. Specifically,
    we can update the man_data.npy and man_obs.npy respectively. The complete example
    is listed below.


    ```

    # update the data for the manual model with a new obs

    import numpy

    # get real observation

    observation = 48

    # update and save differenced observation

    lag = numpy.load(''man_data.npy'')

    last_ob = numpy.load(''man_obs.npy'')

    diffed = observation - last_ob[0]

    lag = numpy.append(lag[1:], [diffed], axis=0)

    numpy.save(''man_data.npy'', lag)

    # update and save real observation

    last_ob[0] = observation

    numpy.save(''man_obs.npy'', last_ob)

    ```


