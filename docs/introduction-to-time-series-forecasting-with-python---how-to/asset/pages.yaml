    It looks nothing like a time series.


    ![](img/da419ed7447ef051ee9d00167b7274cf_106_0.png)


    This is not a random walk. It is just a sequence of random numbers also called
    white noise (see Chapter 10). A common mistake that beginners make is to think
    that a random walk is a list of random numbers, and this is not the case at all.


    # ## 11.2 Random Walk


    A random walk is different from a list of random numbers because the next value
    in the sequence is a modification of the previous value in the sequence. The process
    used to generate the series forces dependence from one-time step to the next.
    This dependence provides some consistency from step-to-step rather than the large
    jumps that a series of independent, random numbers provides. It is this dependency
    that gives the process its name as a random walk or a drunkard’s walk. A simple
    model of a random walk is as follows:


    +   1. Start with a random number of either -1 or 1.

    2. Randomly select a -1 or 1 and add it to the observation from the previous time
    step.'
