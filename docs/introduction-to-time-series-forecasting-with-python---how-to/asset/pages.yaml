    # A Gentle Introduction to the Box-Jenkins Method


    The Autoregressive Integrated Moving Average Model, or ARIMA for short is a standard
    statistical model for time series forecast and analysis. Along with its development,
    the authors Box and Jenkins also suggest a process for identifying, estimating,
    and checking models for a specific time series dataset. This process is now referred
    to as the Box-Jenkins Method. In this lesson, you will discover the Box-Jenkins
    Method and tips for using it on your time series forecasting problem. Specifically,
    you will learn:


    +   - About the ARIMA process and how the 3 steps of the Box-Jenkins Method.

    - Best practice heuristics for selecting the **q**, **d**, and **p** model configuration
    for an ARIMA model.

    - Evaluating models by looking for overfitting and residual errors as a diagnostic
    process.


    Let’s get started.


    # 21.1 Autoregressive Integrated Moving Average Model


    An ARIMA model is a class of statistical model for analyzing and forecasting time
    series data. ARIMA is an acronym that stands for AutoRegressive Integrated Moving
    Average. It is a generalization of the simpler AutoRegressive Moving Average and
    adds the notion of integration. This acronym is descriptive, capturing the key
    aspects of the model itself. Briefly, they are:


    +   - **AR: _Autoregression_**. A model that uses the dependent relationship between
    an observation and some number of lagged observations.

    - **I: _Integrated_**. The use of differencing of raw observations (i.e. subtracting
    an observation from an observation at the previous time step) in order to make
    the time series stationary.

    - **MA: _Moving Average_**. A model that uses the dependency between an observation
    and residual errors from a moving average model applied to lagged observations.'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'Each of these components are explicitly specified in the model as a parameter.
    A standard notation is used of ARIMA(p,d,q) where the parameters are substituted
    with integer values to quickly indicate the specific ARIMA model being used. The
    parameters of the ARIMA model are defined as follows:


    +   * **p**: The number of lag observations included in the model, also called
    the lag order.

    * **d**: The number of times that the raw observations are differenced, also called
    the degree of differencing.

    * **q**: The size of the moving average window, also called the order of moving
    average.


    # ## 21.2 Box-Jenkins Method


    The Box-Jenkins method was proposed by George Box and Gwylm Jenkins in their seminal
    1970 textbook Time Series Analysis: Forecasting and Control^{1}. The approach
    starts with the assumption that the process that generated the time series can
    be approximated using an ARMA model if it is stationary or an ARIMA model if it
    is non-stationary. The 2016 5th edition of the textbook (Part Two, page 177) refers
    to the process as a stochastic model building and that it is an iterative approach
    that consists of the following 3 steps:


    +   1. **Identification.** Use the data and all related information to help select
    a sub-class of model that may best summarize the data.

    2. **Estimation.** Use the data to train the parameters of the model (i.e. the
    coefficients).

    3. **Diagnostic Checking.** Evaluate the fitted model in the context of the available
    data and check for areas where the model may be improved.


    It is an iterative process, so that as new information is gained during diagnostics,
    you can circle back to step 1 and incorporate that into new model classes. Let’s
    take a look at these steps in more detail.


    # ## 21.3 Identification


    The identification step is further broken down into: Assess whether the time series
    is stationary, and if not, how many differences are required to make it stationary.
    Identify the parameters of an ARMA model for the data.


    # ### 21.3.1 Differencing


    Below are some tips during identification.


    +   * **Unit Root Tests.** Use unit root statistical tests on the time series
    to determine whether or not it is stationary. Repeat after each round of differencing.

    * **Avoid over differencing.** Differencing the time series more than is required
    can result in the addition of extra serial correlation and additional complexity.


    ¹http://www.amazon.com/dp/1118675029?tag=inspiredalgor-20'
