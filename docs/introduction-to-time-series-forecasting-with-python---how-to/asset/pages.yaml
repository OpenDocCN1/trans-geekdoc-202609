  md: "# 30.4  Persistence\n\nThe first step before getting bogged down in data analysis\
    \ and modeling is to establish a baseline of performance. This will provide both\
    \ a template for evaluating models using the proposed test harness and a performance\
    \ measure by which all more elaborate predictive models can be compared. The baseline\
    \ prediction for time series forecasting is called the naive forecast, or persistence.\
    \ This is where the observation from the previous time step is used as the prediction\
    \ for the observation at the next time step. We can plug this directly into the\
    \ test harness defined in the previous section. The complete code listing is provided\
    \ below.\n\n```\n```python\n# evaluate a persistence model\nfrom pandas import\
    \ read_csv\nfrom sklearn.metrics import mean_squared_error\nfrom math import sqrt\n\
    # load data\nseries = read_csv('dataset.csv', header=None, index_col=0, parse_dates=True,\
    \ squeeze=True)\n# prepare data\nX = series.values\nX = X.astype('float32')\n\
    train_size = int(len(X) * 0.50)\ntrain, test = X[0:train_size], X[train_size:]\n\
    # walk-forward validation\nhistory = [x for x in train]\npredictions = list()\n\
    for i in range(len(test)):\n\t# predict\n\tyhat = history[-1]\n\tpredictions.append(yhat)\n\
    \t# observation\n\tobs = test[i]\n\thistory.append(obs)\n\tprint('>Predicted=%.3f,\
    \ Expected=%.3f' % (yhat, obs))\n# report performance\nrmse = sqrt(mean_squared_error(test,\
    \ predictions))\nprint('RMSE: %.3f' % rmse)\n```\n```\n\nListing 30.7: Persistence\
    \ forecast model on the Boston Robberies dataset.\n\nRunning the test harness\
    \ prints the prediction and observation for each iteration of the test dataset.\
    \ The example ends by printing the RMSE for the model. In this case, we can see\
    \ that the persistence model achieved an RMSE of 51.844. This means that on average,\
    \ the model was wrong by about 51 robberies for each prediction made.\n\n```\n\
    ```\n... \n>Predicted=241.000, Expected=287\n>Predicted=287.000, Expected=355\n\
