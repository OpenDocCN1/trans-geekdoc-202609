- pgno: 65
  md: '# # Chapter 7


    # ## Resampling and Interpolation


    You may have observations at the wrong frequency. Maybe they are too granular
    or not granular enough. The Pandas library in Python provides the capability to
    change the frequency of your time series data. In this tutorial, you will discover
    how to use Pandas in Python to both increase and decrease the sampling frequency
    of time series data. After completing this tutorial, you will know:


    +   - About time series resampling, the two types of resampling, and the 2 main
    reasons why you need to use them.

    - How to use Pandas to upsample time series data to a higher frequency and interpolate
    the new observations.

    - How to use Pandas to downsample time series data to a lower frequency and summarize
    the higher frequency observations.


    Let''s get started.


    # ## 7.1 Resampling


    Resampling involves changing the frequency of your time series observations. Two
    types of resampling are:


    +   - **Upsampling**: Where you increase the frequency of the samples, such as
    from minutes to seconds.

    - **Downsampling**: Where you decrease the frequency of the samples, such as from
    days to months.


    In both cases, data must be invented. In the case of upsampling, care may be needed
    in determining how the fine-grained observations are calculated using interpolation.
    In the case of downsampling, care may be needed in selecting the summary statistics
    used to calculate the new aggregated values.


    There are perhaps two main reasons why you may be interested in resampling your
    time series data:'
  merge: -1
  img_proc: true
- pgno: 66
  md: "+   - **Problem Framing:** Resampling may be required if your data is not available\
    \ at the same frequency that you want to make predictions.\n\n+   - **Feature\
    \ Engineering:** Resampling can also be used to provide additional structure or\
    \ insight into the learning problem for supervised learning models.\n\nThere is\
    \ a lot of overlap between these two cases. For example, you may have daily data\
    \ and want to predict a monthly problem. You could use the daily data directly\
    \ or you could downsample it to monthly data and develop your model. A feature\
    \ engineering perspective may use observations and summaries of observations from\
    \ both time scales and more in developing a model. Let’s make resampling more\
    \ concrete by looking at a real dataset and some examples.\n\n# 7.2  Shampo Sales\
    \ Dataset\n\nIn this lesson, we will use the Shampo Sales dataset as an example.\
    \ This dataset describes the monthly number of sales of shampoo over a 3 year\
    \ period. You can learn more about the dataset in Appendix [A.1](https://example.com/A.1).\
    \ Place the dataset in your current working directory with the filename `shampoo-sales.csv`.\n\
    \nThe Shampoo Sales dataset only specifies year number and months (e.g. 1–01).\
    \ A custom function is used to parse the dates and baseline the year number on\
    \ an arbitrary year (1900) so that the date-times can be interpreted correctly\
    \ in the Pandas *Series*.\n\n# 7.3  Upsampling Data\n\nThe observations in the\
    \ Shampoo Sales are monthly. Imagine we wanted daily sales information. We would\
    \ have to upsample the frequency from monthly to daily and use an interpolation\
    \ scheme to fill in the new daily frequency. The Pandas library provides a function\
    \ called `resample()` on the *Series* and *DataFrame* objects<sup>1</sup>. This\
    \ can be used to group records when downsampling and making spaces for new observations\
    \ when upsampling.\n\nWe can use this function to transform our monthly dataset\
    \ into a daily dataset by calling resampling and specifying the preferred frequency\
    \ of calendar day frequency or *D*. Pandas is clever and you could just as easily\
    \ specify the frequency as *1D* or even something domain specific, such as *5D*.\
    \ Pandas provides a table of built-in aliases<sup>2</sup>.\n\n```\n```python\n\
    # upsample to daily intervals\nfrom pandas import read_csv\nfrom pandas import\
    \ datetime\n\ndef parser(x):\n    return datetime.strptime('%Y-%m' % x, '%Y-%m')\n\
    \nseries = read_csv('shampoo-sales.csv', header=0, index_col=0, parse_dates=True,\
    \ squeeze=True, date_parser=parser)\nupsampled = series.resample('D').mean()\n\
    print(upsampled.head(32))\n```\n```\n\n<sup>1</sup> [https://pandas.pydata.org/pandas-docs/stable/reference/api/pandas.Series.resample.html](https://pandas.pydata.org/pandas-docs/stable/reference/api/pandas.Series.resample.html)\n\
    \n<sup>2</sup> [https://pandas.pydata.org/pandas-docs/stable/user_guide/timeseries.html#timeseries-offset-aliases](https://pandas.pydata.org/pandas-docs/stable/user_guide/timeseries.html#timeseries-offset-aliases)"
