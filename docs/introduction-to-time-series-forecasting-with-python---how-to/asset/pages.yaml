    # # 30.8 Extensions


    This tutorial was not exhaustive; there may be more that you can do to improve
    the result. This section lists some ideas.


    +   * **Statistical Significance Tests.** Use a statistical test to check if the
    difference in results between different models is statistically significant. The
    Student''s t-test would be a good place to start.

    * **Grid Search with Data Transforms.** Repeat the grid search in the ARIMA hyperparameters
    with the Box-Cox transform and see if a different and better set of parameters
    can be achieved.

    * **Inspect Residuals.** Investigate the residual forecast errors on the final
    model with Box-Cox transforms to see if there is a further bias and/or autocorrelation
    that can be addressed.

    * **Lean Model Saving.** Simplify model saving to only store the required coefficients
    rather than the entire `ARIMAResults` object.'
