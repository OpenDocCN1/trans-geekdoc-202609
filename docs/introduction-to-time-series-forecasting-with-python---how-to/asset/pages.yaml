    \nYou must select a model. This is where the bulk of the effort will be in preparing\
    \ the data, performing analysis, and ultimately selecting a model and model hyperparameters\
    \ that best capture the relationships in the data. In this case, we can arbitrarily\
    \ select an autoregression model (AR) with a lag of 6 on the differenced dataset.\
    \ We can demonstrate this model below. First, the data is transformed by differencing,\
    \ with each observation transformed as:\n\n> $value(t) = obs(t) - obs(t - 1) \\\
    tag{27.1}$\n\nNext, the AR(6) model is trained on 66% of the historical data.\
    \ The regression coefficients learned by the model are extracted and used to make\
    \ predictions in a rolling manner across the test dataset. As each time step in\
    \ the test dataset is executed, the prediction is made using the coefficients\
    \ and stored. The actual observation for the time step is then made available\
    \ and stored to be used as a lag variable for future predictions.\n\n```\n```python\n\
    # fit and evaluate an AR model\nfrom pandas import read_csv\nfrom matplotlib import\
    \ pyplot\nfrom statsmodels.tsa.ar_model import AR\nfrom sklearn.metrics import\
    \ mean_squared_error\nimport numpy\nfrom math import sqrt\n\n# create a difference\
    \ transform of the dataset\ndef difference(dataset):\n\tdiff = list()\n\tfor i\
    \ in range(1, len(dataset)):\n\t\tvalue = dataset[i] - dataset[i - 1]\n\t\tdiff.append(value)\n\
    \treturn numpy.array(diff)\n\n# Make a prediction give regression coefficients\
    \ and lag obs\ndef predict(coef, history):\n\tyhat = coef[0]\n\tfor i in range(1,\
    \ len(coef)):\n\t\tyhat += coef[i] * history[-i]\n\treturn yhat\n\nseries = read_csv('daily-total-female-births.csv',\
    \ header=0, index_col=0, parse_dates=True, squeeze=True)\n# split dataset\nX =\
    \ difference(series.values)\nsize = int(len(X) * 0.66)\ntrain, test = X[0:size],\
    \ X[size:]\n```\n```"
