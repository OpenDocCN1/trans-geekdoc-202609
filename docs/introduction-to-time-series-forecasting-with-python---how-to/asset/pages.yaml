  md: '# # Chapter 20


    # # Reframe Time Series Forecasting Problems


    You do not have to model your time series forecast problem as-is. There are many
    ways to reframe your forecast problem that can both simplify the prediction problem
    and potentially expose more or different information to be modeled. A reframing
    can ultimately result in better and/or more robust forecasts. In this tutorial,
    you will discover how to reframe your time series forecast problem with Python.
    After completing this tutorial, you will know:


    +   - How to reframe your time series forecast problem as an alternate regression
    problem.

    - How to reframe your time series forecast problem as a classification prediction
    problem.

    - How to reframe your time series forecast problem with an alternate time horizon.


    Let''s get started.


    # ## 20.1 Benefits of Reframing Your Problem


    Reframing your problem is the idea of exploring alternate perspectives on what
    is to be predicted. There are two potential benefits to exploring alternate framings
    of your time series forecast problem:


    +   1. Simplify your problem.

    2. Provide the basis for an ensemble forecast.


    Both benefits ultimately have the result of leading to more skillful and/or more
    robust forecasts.


    # ### 20.1.1 Simplify Your Problem


    Perhaps the largest wins on a forecasting project can come from a reframing of
    the problem. This is because the structure and type of prediction problem has
    so much more impact than the choice of data transforms, choice of model, or the
    choice of model hyperparameters. It is the biggest lever in a project and must
    be carefully considered.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 20.1.2  Ensemble Forecast


    In addition to changing the problem you are working on, reframing plays another
    role: it can provide you with a suite of different, but highly related problems
    that you can model. The benefit of this is that the framings may be different
    enough to require differences in data preparation and modeling methods.


    Models of differing perspectives on the same problem may capture different information
    from the input and in turn result in predictions that are skillful, but in different
    ways. These predictions may be combined in an ensemble to result in a more skillful
    or more robust forecast. In this tutorial, we will explore three different ways
    you may consider reframing your time series forecast problem. Before we dive in,
    let''s look at a simple univariate time series problem of forecasting the minimum
    daily temperature to use as context for the discussion.


    # 20.2  Minimum Daily Temperatures Dataset


    In this lesson, we will use the Minimum Daily Temperatures dataset as an example.
    This dataset describes the minimum daily temperatures over 10 years (1981-1990)
    in the city Melbourne, Australia. You can learn more about the dataset in Appendix
    A.2. Place the dataset in your current working directory with the filename `daily-minimum-temperatures.csv`.


    # 20.3  Naive Time Series Forecast


    The naive approach is to predict the problem as-is. For reference, we will call
    this the naive time series forecast. In this case, the seasonal information can
    be removed to make the series seasonal stationary. The time series can then be
    modeled based on some function of the lagged observations. For example:


    ```

    $$Temp(t + 1) = B0 + (B1 \times Temp(t)) + (B2 \times Temp(t - 1)) ... (Bn \times
    Temp(t - n))$$  (20.1)

    ```


    Where `Temp(t+1)` is the next temperature in the series to predict, `B0` to `Bn`
    are coefficients learned from training data and `Temp(t)` to `Temp(t-n)` are the
    current and lagged observations. This may be fine or even required by many problems.
    The risk is that a preconceived idea of how to frame the problem has influenced
    data collection, and in turn perhaps limited the results.


    # 20.4  Regression Framings


    Most time series prediction problems are regression problems, requiring the prediction
    of a real-valued output. Below are 5 different ways that this prediction problem
    could be re-phrased as an alternate regression problem:


    +   - Forecast the change in the minimum temperature compared to the previous
    day.


    +   - Forecast the minimum temperature relative to the average from the past 14
    days.


    +   - Forecast the minimum temperature relative to the average the same month
    last year.'
