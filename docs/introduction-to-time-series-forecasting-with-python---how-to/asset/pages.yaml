- pgno: 214
  md: '# 23.4 Autoregression of Residual Error


    We can model the residual error time series using an autoregression model. This
    is a linear regression model that creates a weighted linear sum of lagged residual
    error terms. For example:


    error(t + 1) = b0 + (b1 × error(t)) + (b2 × error(t - 1)) . . . + (bn × error(t
    - n)) (23.2)


    We can use the autoregression model (AR) provided by the Statsmodels library.
    Building on the persistence model in the previous section, we can first train
    the model on the residual errors calculated on the training dataset. This requires
    that we make persistence predictions for each observation in the training dataset,
    then create the AR model, as follows.


    ```

    # autoregressive model of residual errors

    from pandas import read_csv

    from pandas import DataFrame

    from pandas import concat

    from statsmodels.tsa.ar_model import AR

    series = read_csv(''daily-total-female-births.csv'', header=0, index_col=0, parse_dates=True,
    squeeze=True)

    # create lagged dataset

    values = DataFrame(series.values)

    datframe = concat([values.shift(1), values], axis=1)

    datframe.columns = [''t'', ''t+1'']

    # split into train and test sets

    X = dataframe.values

    train_size = int(len(X) * 0.66)

    train, test = X[1:train_size], X[train_size:]

    train_X, train_y = train[:,0], train[:,1]

    test_X, test_y = test[:,0], test[:,1]

    # persistence model on training set

    train_pred = [x for x in train_X]

    # calculate residuals

    train_resid = [train_y[i]-train_pred[i] for i in range(len(train_pred))]

    # model the training set residuals

    model = AR(train_resid)

    model_fit = model.fit()

    window = model.fit.k_ar

    coef = model_fit.params

    print(''Lag=%d, Coef=%%s'' %% (window, coef))

    ```


    Listing 23.6: Autoregression model of persistence residual errors on the Daily
    Female Births dataset.


