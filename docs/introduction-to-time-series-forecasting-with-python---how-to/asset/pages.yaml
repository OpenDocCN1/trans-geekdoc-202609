  md: '# # Appendix B


    # ## Workaround for Saving ARIMA Models


    The Autoregressive Integrated Moving Average Model, or ARIMA, is a popular linear
    model for time series analysis and forecasting. The Statsmodels library provides
    an implementation of ARIMA for use in Python. ARIMA models can be saved to file
    for later use in making predictions on new data. There is a bug in the current
    version of the Statsmodels library that prevents saved models from being loaded.
    In this tutorial, you will discover how to diagnose and work around this issue.
    Let''s get started.


    # ### B.1 Daily Female Births Dataset


    In this lesson, we will use the Daily Female Births Dataset as an example. This
    dataset describes the number of daily female births in California in 1959. You
    can learn more about the dataset in Appendix A.4. Place the dataset in your current
    working directory with the filename *daily-total-female-births.csv*.


    # ### B.2 Python Environment


    Confirm you are using the latest version of the Statsmodels library. You can do
    that by running the script below:


    ```

    ```

    # check the version of statsmodels

