    # ## 11.6 Is Your Time Series a Random Walk?


    Your time series may be a random walk. Some ways to check if your time series
    is a random walk are as follows:


    +   - The time series shows a strong temporal dependence that decays linearly
    or in a similar pattern.

    - The time series is non-stationary and making it stationary shows no obviously
    learnable structure in the data.

    - The persistence model provides the best source of reliable predictions.


    This last point is key for time series forecasting. Baseline forecasts with the
    persistence model quickly flesh out whether you can do significantly better. If
    you can''t, you''re probably working with a random walk. Many time series are
    random walks, particularly those of security prices over time. The random walk
    hypothesis is a theory that stock market prices are a random walk and cannot be
    predicted⁶.


    A random walk is one in which future steps or directions cannot be predicted on
    the basis of past history. When the term is applied to the stock market, it means
    that short-run changes in stock prices are unpredictable.


