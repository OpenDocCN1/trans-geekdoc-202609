    # ## 14.4 Seasonal Adjustment with Modeling


    We can model the seasonal component directly, then subtract it from the observations.
    The seasonal component in a given time series is likely a sine wave over a generally
    fixed period and amplitude. This can be approximated easily using a curve-fitting
    method. A dataset can be'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'constructed with the time index of the sine wave as an input, or x-axis, and
    the observation as the output, or y-axis. For example:


    | Time Index, Observation |

    | --- |

    | 1, obs1 |

    | 2, obs2 |

    | 3, obs3 |

    | 4, obs4 |

    | 5, obs5 |


    Listing 14.6: Example of time index as a feature.


    Once fit, the model can then be used to calculate a seasonal component for any
    time index. In the case of the temperature data, the time index would be the day
    of the year. We can then estimate the seasonal component for the day of the year
    for any historical observations or any new observations in the future. The curve
    can then be used as a new input for modeling with supervised learning algorithms,
    or subtracted from observations to create a seasonally adjusted series.


    Let’s start off by fitting a curve to the Minimum Daily Temperatures dataset.
    The NumPy library provides the polyfit() function¹ that can be used to fit a polynomial
    of a chosen order to a dataset. First, we can create a dataset of time index (day
    in this case) to observation. We could take a single year of data or all the years.
    Ideally, we would try both and see which model resulted in a better fit. We could
    also smooth the observations using a moving average centered on each value. This
    too may result in a model with a better fit.


    Once the dataset is prepared, we can create the fit by calling the polyfit() function
    passing the x-axis values (integer day of year), y-axis values (temperature observations),
    and the order of the polynomial. The order controls the number of terms, and in
    turn the complexity of the curve used to fit the data. Ideally, we want the simplest
    curve that describes the seasonality of the dataset. For consistent sine wave-like
    seasonality, a 4th order or 5th order polynomial will be sufficient. In this case,
    I chose an order of 4 by trial and error. The resulting model takes the form:


    $$y = (x^{4} \times b1) + (x^{3} \times b2) + (x^{2} \times b3) + (x^{1} \times
    b4) + b5 \quad (14.1)$$


    Where y is the fit value, x is the time index (day of the year), and b1 to b5
    are the coefficients found by the curve-fitting optimization algorithm. Once fit,
    we will have a set of coefficients that represent our model. We can then use this
    model to calculate the curve for one observation, one year of observations, or
    the entire dataset. The complete example is listed below.


    ```

    ```python

    # model seasonality with a polynomial model

    from pandas import read_csv

    from matplotlib import pyplot

    from numpy import polyfit

    series = read_csv(''daily-minimum-temperatures.csv'', header=0, index_col=0,

    parse_dates=True, squeeze=True)

    # fit polynomial: x^2*b1 + x*b2 + ... + bn

    X = [i%365 for i in range(0, len(series))]

    y = series.values

    degree = 4

    coef = polyfit(X, y, degree)

    print(''Coefficients: %s'' % coef)

    ```

    ```


    ¹https://docs.scipy.org/doc/numpy/reference/generated/numpy.polyfit.html'
