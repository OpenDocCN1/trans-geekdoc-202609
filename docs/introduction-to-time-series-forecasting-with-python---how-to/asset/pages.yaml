    # ## 31.3 Test Harness


    We must develop a test harness to investigate the data and evaluate candidate
    models. This involves two steps:


    +   1. Defining a Validation Dataset.

    2. Developing a Method for Model Evaluation.


    # ### 31.3.1 Validation Dataset


    The dataset is not current. This means that we cannot easily collect updated data
    to validate the model. Therefore, we will pretend that it is 1953 and withhold
    the last 10 years of data from analysis and model selection. This final decade
    of data will be used to validate the final model. The code below will load the
    dataset as a Pandas Series and split into two, one for model development (dataset.csv)
    and the other for validation (validation.csv).


    ```

    # separate out a validation dataset

    from pandas import read_csv

    series = read_csv(''water.csv'', header=0, index_col=0, parse_dates=True, squeeze=True)

    split_point = len(series) - 10

    dataset, validation = series[0:split_point], series[split_point:]

    print(''Dataset %d, Validation %d'' % (len(dataset), len(validation)))

    dataset.to_csv(''dataset.csv'', header=False)

    validation.to_csv(''validation.csv'', header=False)

    ```


