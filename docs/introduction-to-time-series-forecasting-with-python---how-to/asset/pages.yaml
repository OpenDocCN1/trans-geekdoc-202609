- pgno: 93
  md: "# 9.5. Moving Average as Feature Engineering\n\nNext, a second copy of the\
    \ series needs to be shifted forward by one, minus the window size. This is to\
    \ ensure that the moving average summarizes the last few values and does not include\
    \ the value to be predicted in the average, which would be an invalid framing\
    \ of the problem as the input would contain knowledge of the future being predicted.\n\
    \nFor example, with a window size of 3, we must shift the series forward by 2\
    \ time steps. This is because we want to include the previous two observations\
    \ as well as the current observation in the moving average in order to predict\
    \ the next value. We can then calculate the moving average from this shifted series.\
    \ Below is an example of how the first 5 moving average values are calculated.\
    \ Remember, the dataset is shifted forward 2 time steps and as we move along the\
    \ time series, it takes at least 3 time steps before we even have enough data\
    \ to calculate a `window=3` moving average.\n\n| Observations,        | Mean |\n\
    |----------------------|------|\n| NaN                  | NaN  |\n| NaN, NaN \
    \            | NaN  |\n| NaN, NaN, 35         | NaN  |\n| NaN, 35, 32        \
    \  | NaN  |\n| 30, 32, 35           | 32   |\n\nListing 9.4: Contrived example\
    \ of a shifted time series with lag variables and a moving average.\n\nBelow is\
    \ an example of including the moving average of the previous 3 values as a new\
    \ feature, as well as the original `t` input feature for the Daily Female Births\
    \ dataset.\n\n```\n# moving average smoothing as feature engineering\nfrom pandas\
    \ import read_csv\nfrom pandas import DataFrame\nfrom pandas import concat\nseries\
    \ = read_csv('daily-total-female-births.csv', header=0, index_col=0, parse_dates=True,\n\
    \                  squeeze=True)\ndf = DataFrame(series.values)\nwidth = 3\nlag1\
    \ = df.shift(1)\nlag3 = df.shift(width - 1)\nwindow = lag3.rolling(window=width)\n\
    means = window.mean()\ndataframe = concat([means, lag1, df], axis=1)\ndataframe.columns\
    \ = ['mean', 't', 't+1']\nprint(dataframe.head(10))\n```\n\nListing 9.5: Example\
    \ of moving average as feature engineering on the Daily Female Births dataset.\n\
    \nRunning the example creates the new dataset and prints the first 10 rows. We\
    \ can see that the first 3 rows cannot be used and must be discarded. The first\
    \ row of the `lag=1` dataset cannot be used because there are no previous observations\
    \ to predict the first observation, therefore a `NaN` value is used.\n\n|    |\
    \ mean     | t     | t+1 |\n|----|----------|-------|-----|\n| 0  | NaN      |\
    \ NaN   | 35  |\n| 1  | NaN      | 35.0  | 32  |\n| 2  | NaN      | 32.0  | 30\
    \  |\n| 3  | NaN      | 30.0  | 31  |\n| 4  | 32.333333| 31.0  | 44  |\n| 5  |\
    \ 31.000000| 44.0  | 29  |"
