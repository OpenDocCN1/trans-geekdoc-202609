- pgno: 330
  md: "# ### 32.6.1 Manually Configured ARIMA\n\nThe ARIMA(p, d, q) model requires\
    \ three parameters and is traditionally configured manually. Analysis of the time\
    \ series data assumes that we are working with a stationary time series. The time\
    \ series is almost certainly non-stationary. We can make it stationary this by\
    \ first differencing the series and using a statistical test to confirm that the\
    \ result is stationary.\n\nThe seasonality in the series is seemingly year-to-year.\
    \ Seasonal data can be differenced by subtracting the observation from the same\
    \ time in the previous cycle, in this case the same month in the previous year.\
    \ This does mean that we will lose the first year of observations as there is\
    \ no prior year to difference with. The example below creates a deseasonalized\
    \ version of the series and saves it to file stationary.csv.\n\n```\n```python\n\
    # create and summarize stationary version of time series\nfrom pandas import read_csv\n\
    from pandas import Series\nfrom statsmodels.tsa.stattools import adfuller\nfrom\
    \ matplotlib import pyplot\n\n# create a differenced series\ndef difference(dataset,\
    \ interval=1):\n    diff = list()\n    for i in range(interval, len(dataset)):\n\
    \        value = dataset[i] - dataset[i - interval]\n        diff.append(value)\n\
    \    return Series(diff)\n\nseries = read_csv('dataset.csv', header=None, index_col=0,\
    \ parse_dates=True, squeeze=True)\nX = series.values\nX = X.astype('float32')\n\
    # difference data\nmonths_in_year = 12\nstationary = difference(X, months_in_year)\n\
    stationary.index = series.index[months_in_year:]\n# check if stationary\nresult\
    \ = adfuller(stationary)\nprint('ADF Statistic: %f' % result[0])\nprint('p-value:\
    \ %f' % result[1])\nprint('Critical Values:')\nfor key, value in result[4].items():\n\
    \    print('\\t%s: %.3f' % (key, value))\n# save\nstationary.to_csv('stationary.csv',\
    \ header=False)\n# plot\nstationary.plot()\npyplot.show()\n```\n```\n\nListing\
    \ 32.12: Create a stationary version of the dataset and plot the differenced result.\n\
    \nRunning the example outputs the result of a statistical significance test of\
    \ whether the differenced series is stationary. Specifically, the augmented Dickey-Fuller\
    \ test. The results show that the test statistic value -7.134898 is smaller than\
    \ the critical value at 1% of -3.515. This suggests that we can reject the null\
    \ hypothesis with a significance level of less than 1% (i.e. a low probability\
    \ that the result is a statistical fluke). Rejecting the null hypothesis means\
    \ that the process has no unit root, and in turn that the time series is stationary\
    \ or does not have"
