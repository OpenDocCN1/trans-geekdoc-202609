- pgno: 228
  md: "# 24.4 Rolling Forecast ARIMA Model\n\nThe ARIMA model can be used to forecast\
    \ future time steps. We can use the predict() function on the ARIMAResults object$^{4}$\
    \ to make predictions. It accepts the index of the time steps to make predictions\
    \ as arguments. These indexes are relative to the start of the training dataset\
    \ used to make predictions.\n\nIf we used 100 observations in the training dataset\
    \ to fit the model, then the index of the next time step for making a prediction\
    \ would be specified to the prediction function as start=101, end=101. This would\
    \ return an array with one element containing the prediction. We also would prefer\
    \ the forecasted values to be in the original scale, in case we performed any\
    \ differencing ($d>0$ when configuring the model). This can be specified by setting\
    \ the typ argument to the value ',levels': typ='levels'.\n\nAlternatively, we\
    \ can avoid all of these specifications by using the forecast() function$^{5}$\
    \ which performs a one-step forecast using the model. We can split the training\
    \ dataset into train and test sets, use the train set to fit the model, and generate\
    \ a prediction for each element on the test set.\n\nA rolling forecast is required\
    \ given the dependence on observations in prior time steps for differencing and\
    \ the AR model. A crude way to perform this rolling forecast is to re-create the\
    \ ARIMA model after each new observation is received. We manually keep track of\
    \ all observations in a list called history that is seeded with the training data\
    \ and to which new observations are appended each iteration. Putting this all\
    \ together, below is an example of a rolling forecast with the ARIMA model in\
    \ Python.\n\n```\n```python\n# evaluate an ARIMA model using a walk-forward validation\n\
    from pandas import read_csv\nfrom pandas import datetime\nfrom matplotlib import\
    \ pyplot\nfrom statsmodels.tsa.arima_model import ARIMA\nfrom sklearn.metrics\
    \ import mean_squared_error\nfrom math import sqrt\n# load dataset\ndef parser(x):\n\
    \    return datetime.strptime('190'+x, '%Y-%m')\nseries = read_csv('shampoo-sales.csv',\
    \ header=0, index_col=0, parse_dates=True, squeeze=True, date_parser=parser)\n\
    # split into train and test sets\nX = series.values\nsize = int(len(X) * 0.66)\n\
    train, test = X[0:size], X[size:len(X)]\nhistory = [x for x in train]\npredictions\
    \ = list()\n# walk-forward validation\nfor t in range(len(test)):\n    model =\
    \ ARIMA(history, order=(5,1,0))\n    model_fit = model.fit(disp=0)\n    output\
    \ = model_fit.forecast()\n    yhat = output[0]\n```\n```\n\n$^{4}$http://statsmodels.sourceforge.net/develop/generated/statsmodels.tsa_arima_model.ARIMAResults.html\n\
    $^{5}$http://statsmodels.sourceforge.net/develop/generated/statsmodels.tsa_arima_model.ARIMAResults.forecast.html"
  merge: -1
  img_proc: true
