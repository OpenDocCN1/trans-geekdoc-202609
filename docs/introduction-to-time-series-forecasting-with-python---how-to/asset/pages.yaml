    These error values are in the original units of the predicted values. A mean absolute
    error of zero indicates no error.


    # ## 17.4 Mean Squared Error


    The mean squared error, or MSE, is calculated as the average of the squared forecast
    error values. Squaring the forecast error values forces them to be positive; it
    also has the effect of putting more weight on large errors. Very large or outlier
    forecast errors are squared, which in turn has the effect of dragging the mean
    of the squared forecast errors out resulting in a larger mean squared error score.
    In effect, the score gives worse performance to those models that make large wrong
    forecasts.


    mean_squared_error = mean(forecast_error²)    (17.4)


    We can use the mean_squared_error() function<sup>2</sup> from scikit-learn to
    calculate the mean squared error for a list of predictions. The example below
    demonstrates this function.


    ```

    # calculate mean squared error

    from sklearn.metrics import mean_squared_error

    expected = [0.0, 0.5, 0.0, 0.5, 0.0]

    predictions = [0.2, 0.4, 0.1, 0.6, 0.2]

    mse = mean_squared_error(expected, predictions)

    print(''MSE: %.1f'' % mse)

    ```


    Listing 17.7: Example of calculating mean squared error.


    Running the example calculates and prints the mean squared error for a list of
    expected and predicted values.'
