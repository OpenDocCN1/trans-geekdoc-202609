- pgno: 14
  md: '# ## Chapter 1


    # ## Python Environment


    The Python ecosystem is growing and may become the dominant platform for applied
    machine learning. The primary rationale for adopting Python for time series forecasting
    is because it is a general-purpose programming language that you can use both
    for R&D and in production. In this lesson, you will discover the Python ecosystem
    for time series forecasting. After reading this lesson, you will know:


    +   - The three standard Python libraries that are critical for time series forecasting.

    - How to install and setup the Python and SciPy environment for development.

    - How to confirm your environment is working correctly and ready for time series
    forecasting.


    Let''s get started.


    # ### 1.1 Why Python?


    Python is a general-purpose interpreted programming language (unlike R or Matlab).
    It is easy to learn and use primarily because the language focuses on readability.
    It is a popular language in general, consistently appearing in the top 10 programming
    languages in surveys on StackOverflow (for example, the 2015 survey results¹).


    Python is a dynamic language and is well suited to interactive development and
    quick prototyping with the power to support the development of large applications.
    This is a simple and very important consideration. It means that you can perform
    your research and development (figuring out what models to use) in the same programming
    language that you use in operations, greatly simplifying the transition from development
    to operations.


    Python is also widely used for machine learning and data science because of the
    excellent library support. It has quickly become one of the dominant platforms
    for machine learning and data science practitioners and is in greater demand than
    even the R platform by employers (see the graph below).'
  merge: -1
  img_proc: true
- pgno: 15
  md: '![](img/da419ed7447ef051ee9d00167b7274cf_15_0.png)


    Figure 1.1: Plot of Python machine learning jobs (blue) compared to R machine
    learning jobs from indeed.com.


    # ## 1.2 Python Libraries for Time Series


    SciPy is an ecosystem of Python libraries for mathematics, science, and engineering<sup>2</sup>.
    It is an add-on to Python that you will need for time series forecasting. Two
    SciPy libraries provide a foundation for most others; they are NumPy<sup>3</sup>
    for providing efficient array operations and Matplotlib<sup>4</sup> for plotting
    data. There are three higher-level SciPy libraries that provide the key features
    for time series forecasting in Python. They are Pandas, Statsmodels, and scikit-learn
    for data handling, time series modeling, and machine learning respectively. Let’s
    take a closer look at each in turn.


    # ### 1.2.1 Library: Pandas


    The Pandas library provides high-performance tools for loading and handling data
    in Python. It is built upon and requires the SciPy ecosystem and uses primarily
    NumPy arrays under the covers but provides convenient and easy to use data structures
