    The dataset is non-stationary, meaning that the mean and the variance of the observations
    change over time. This makes it difficult to model by both classical statistical
    methods, like ARIMA, and more sophisticated machine learning methods, like neural
    networks. This is caused by what appears to be both an increasing trend and a
    seasonality component.


    In addition, the amount of change, or the variance, is increasing with time. This
    is clear when you look at the size of the seasonal component and notice that from
    one cycle to the next, the amplitude (from bottom to top of the cycle) is increasing.
    In this tutorial, we will investigate transforms that we can use on time series
    datasets that exhibit this property.


