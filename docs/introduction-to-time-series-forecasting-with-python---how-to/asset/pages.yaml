- pgno: 166
  md: '# Chapter 17


    # Forecasting Performance Measures


    Time series prediction performance measures provide a summary of the skill and
    capability of the forecast model that made the predictions. There are many different
    performance measures to choose from. It can be confusing to know which measure
    to use and how to interpret the results. In this tutorial, you will discover performance
    measures for evaluating time series forecasts with Python. Time series generally
    focus on the prediction of real values, called regression problems. Therefore
    the performance measures in this tutorial will focus on methods for evaluating
    real-valued predictions. After completing this tutorial, you will know:


    +   - Basic measures of forecast performance, including residual forecast error
    and forecast bias.

    - Time series forecast error calculations that have the same units as the expected
    outcomes such as mean absolute error.

    - Widely used error calculations that punish large errors, such as mean squared
    error and root mean squared error.


    Let’s get started.


    # 17.1  Forecast Error (or Residual Forecast Error)


    The forecast error is calculated as the expected value minus the predicted value.
    This is called the residual error of the prediction.


    ```

    forecast_error = expected_value − predicted_value      (17.1)

    ```


    The forecast error can be calculated for each prediction, providing a time series
    of forecast errors. The example below demonstrates how the forecast error can
    be calculated for a series of 5 predictions compared to 5 expected values. The
    example was contrived for demonstration purposes.


    ```

    # calculate forecast error

    expected = [0.0, 0.5, 0.0, 0.5, 0.0]

