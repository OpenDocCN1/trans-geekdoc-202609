    # A Gentle Introduction to the Random Walk


    How do you know your time series problem is predictable? This is a difficult question
    with time series forecasting. There is a tool called a random walk that can help
    you understand the predictability of your time series forecast problem. In this
    tutorial, you will discover the random walk and its properties in Python. After
    completing this tutorial, you will know:


    +   * What the random walk is and how to create one from scratch in Python.

    * How to analyze the properties of a random walk and recognize when a time series
    is and is not a random walk.

    * How to make predictions for a random walk.


    Let’s get started.


    # 11.1 Random Series


    The Python standard library contains the random module¹ that provides access to
    a suite of functions for generating random numbers. The randrange() function²
    can be used to generate a random integer between 0 and an upper limit. We can
    use the randrange() function to generate a list of 1,000 random integers between
    0 and 10. The example is listed below.


    ```

