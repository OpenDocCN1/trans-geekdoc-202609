    # ## 26.6 Extensions


    The grid search method used in this tutorial is simple and can easily be extended.
    This section lists some ideas to extend the approach you may wish to explore.


    +   * **Seed Grid.** The classical diagnostic tools of ACF and PACF plots can
    still be used with the results used to seed the grid of ARIMA parameters to search.

    * **Alternate Measures.** The search seeks to optimize the out-of-sample root
    mean squared error. This could be changed to another out-of-sample statistic,
    an in-sample statistic, such as AIC or BIC, or some combination of the two. You
    can choose a metric that is most meaningful on your project.

    * **Residual Diagnostics.** Statistics can automatically be calculated on the
    residual forecast errors to provide an additional indication of the quality of
    the fit. Examples include statistical tests for whether the distribution of residuals
    is Gaussian and whether there is an autocorrelation in the residuals.

    * **Update Model.** The ARIMA model is created from scratch for each one-step
    forecast. With careful inspection of the API, it may be possible to update the
    internal data of the model with new observations rather than recreating it from
    scratch.

    * **Preconditions.** The ARIMA model can make assumptions about the time series
    dataset, such as normality and stationarity. These could be checked and a warning
    raised for a given of a dataset prior to a given model being trained.'
