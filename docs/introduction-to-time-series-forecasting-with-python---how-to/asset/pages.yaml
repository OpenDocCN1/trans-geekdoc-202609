  md: "# 5.4 Date Time Features\n\nLet’s start with some of the simplest features\
    \ that we can use. These are features from the date/time of each observation.\
    \ In fact, these can start off simply and head off into quite complex domain-specific\
    \ areas. Two features that we can start with are the integer month and day for\
    \ each observation. We can imagine that supervised learning algorithms may be\
    \ able to use these inputs to help tease out time-of-year or time-of-month type\
    \ seasonality information. The supervised learning problem we are proposing is\
    \ to predict the daily minimum temperature given the month and day, as follows:\n\
    \n```\nMonth, Day, Temperature\nMonth, Day, Temperature\nMonth, Day, Temperature\n\
    ```\n\nListing 5.3: Example of month and day features.\n\nWe can do this using\
    \ Pandas. First, the time series is loaded as a Pandas `Series`. We then create\
    \ a new Pandas `DataFrame` for the transformed dataset. Next, each column is added\
    \ one at a time where month and day information is extracted from the time-stamp\
    \ information for each observation in the series. Below is the Python code to\
    \ do this.\n\n```\n# create date time features of a dataset\nfrom pandas import\
    \ read_csv\nfrom pandas import DataFrame\n\nseries = read_csv('daily-minimum-temperatures.csv',\
    \ header=0, index_col=0, \n      parse_dates=True, squeeze=True)\ndatframe = DataFrame()\n\
    datframe['month'] = [series.index[i].month for i in range(len(series))]\ndatframe['day']\
    \ = [series.index[i].day for i in range(len(series))]\ndatframe['temperature']\
    \ = [series[i] for i in range(len(series))]\nprint(datframe.head(5))\n```\n\n\
    Listing 5.4: Example of date-time features in the Minimum Daily Temperatures dataset.\n\
    \nRunning this example prints the first 5 rows of the transformed dataset.\n\n\
    month day temperature\n0 1 1 20.7\n1 1 2 17.9\n2 1 3 18.8\n3 1 4 14.6\n4 1 5 15.8\n\
    \nListing 5.5: Example output of date-time features in the Minimum Daily Temperatures\
    \ dataset.\n\nUsing just the month and day information alone to predict temperature\
    \ is not sophisticated and will likely result in a poor model. Nevertheless, this\
    \ information coupled with additional engineered features may ultimately result\
    \ in a better model. You may enumerate all the properties of a time-stamp and\
    \ consider what might be useful for your problem, such as:\n\n+   * Minutes elapsed\
    \ for the day.\n* Hour of day.\n* Business hours or not."
