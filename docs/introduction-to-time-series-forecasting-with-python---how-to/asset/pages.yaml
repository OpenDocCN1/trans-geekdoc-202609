    # 27.7 Extensions


    Generally, it is a good idea to keep track of all the observations. This will
    allow you to:


    +   - Provide a context for further time series analysis to understand new changes
    in the data.

    - Train a new model in the future on the most recent data.

    - Back-test new and different models to see if performance can be improved.


    For small applications, perhaps you could store the raw observations in a file
    alongside your model. It may also be desirable to store the model coefficients
    and required lag data and last observation in plain text for easy review. For
