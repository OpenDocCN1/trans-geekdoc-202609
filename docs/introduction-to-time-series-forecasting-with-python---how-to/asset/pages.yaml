  md: "# ## 13.2 Shampoo Sales Dataset\n\nIn this lesson, we will use the Shampoo\
    \ Sales dataset as an example. This dataset describes the monthly number of sales\
    \ of shampoo over a 3 year period. You can learn more about the dataset in Appendix\
    \ **A.1**. Place the dataset in your current working directory with the filename\
    \ `shampoo-sales.csv`.\n\n# ## 13.3 Detrend by Differencing\n\nPerhaps the simplest\
    \ method to detrend a time series is by differencing. Specifically, a new series\
    \ is constructed where the value at the current time step is calculated as the\
    \ difference between the original observation and the observation at the previous\
    \ time step.\n\n$value(t) = observation(t) - observation(t - 1)$ (13.1)\n\nThis\
    \ has the effect of removing a trend from a time series dataset. We can create\
    \ a new difference dataset in Python by implementing this directly. A new list\
    \ of observations can be created. Below is an example that creates the difference\
    \ detrended version of the Shampoo Sales dataset.\n\n```\n# detrend a time series\
    \ using differencing\nfrom pandas import read_csv\nfrom pandas import datetime\n\
    from matplotlib import pyplot\n\ndef parser(x):\n    return datetime.strptime('190'+x,\
    \ '%Y-%m')\n\nseries = read_csv('shampoo-sales.csv', header=0, index_col=0, parse_dates=True,\n\
    \    squeeze=True, date_parser=parser)\nX = series.values\ndiff = list()\nfor\
    \ i in range(1, len(X)):\n    value = X[i] - X[i - 1]\n    diff.append(value)\n\
    pyplot.plot(diff)\npyplot.show()\n```\n\n**Listing 13.1:** Difference the Shampoo\
    \ Sales dataset.\n\nRunning the example creates the new detrended dataset and\
    \ then plots the time series. Because no difference value can be created for the\
    \ first observation (there is nothing for it to be subtracted from), the new dataset\
    \ contains one less record. We can see that indeed the trend does appear to have\
    \ been removed (compared to original plot in the Appendix)."
