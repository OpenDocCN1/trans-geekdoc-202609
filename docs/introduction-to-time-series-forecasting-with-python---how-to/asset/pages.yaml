  img_proc: true
- pgno: 146
  md: '# 15.4  Stationary Time Series and Forecasting


    Should you make your time series stationary? Generally, yes. If you have clear
    trend and seasonality in your time series, then model these components, remove
    them from observations, then train models on the residuals.


    If we fit a stationary model to data, we assume our data are a realization of
    a stationary process. So our first step in an analysis should be to check whether
    there is any evidence of a trend or seasonal effects and, if there is, remove
    them.


    > — Page 122, Introductory Time Series with R.


    Statistical time series methods and even modern machine learning methods will
    benefit from the clearer signal in the data. But...


    We turn to machine learning methods when the classical methods fail. When we want
    more or better results. We cannot know how to best model unknown nonlinear relationships
    in time series data and some methods may result in better performance when working
    with non-stationary observations or some mixture of stationary and non-stationary
    views of the problem.


    The suggestion here is to treat properties of a time series being stationary or
    not as another source of information that can be used in feature engineering and
    feature selection on your time series problem when using machine learning methods.


    # 15.5  Checks for Stationarity


    There are many methods to check whether a time series (direct observations, residuals,
    otherwise) is stationary or non-stationary.


    +   • **Look at Plots:** You can review a time series plot of your data and visually
    check if there are any obvious trends or seasonality.


    +   • **Summary Statistics:** You can review the summary statistics for your data
    for seasons or random partitions and check for obvious or significant differences.


    +   • **Statistical Tests:** You can use statistical tests to check if the expectations
    of stationarity are met or have been violated.


    Above, we have already introduced the Daily Female Births and Airline Passengers
    datasets as stationary and non-stationary respectively with plots showing an obvious
    lack and presence of trend and seasonality components. Next, we will look at a
    quick and dirty way to calculate and review summary statistics on our time series
    dataset for checking to see if it is stationary.


    # 15.6  Summary Statistics


    A quick and dirty check to see if your time series is non-stationary is to review
    summary statistics. You can split your time series into two (or more) partitions
    and compare the mean and variance of each group. If they differ and the difference
    is statistically significant, the time series is likely non-stationary. Next,
    let’s try this approach on the Daily Births dataset.'
