  md: '# ## Chapter 13


    # ## Use and Remove Trends


    Our time series dataset may contain a trend. A trend is a continued increase or
    decrease in the series over time. There can be benefit in identifying, modeling,
    and even removing trend information from your time series dataset. In this tutorial,
    you will discover how to model and remove trend information from time series data
    in Python. After completing this tutorial, you will know:


    +   - The importance and types of trends that may exist in time series and how
    to identify them.


    +   - How to use a simple differencing method to remove a trend.


    +   - How to model a linear trend and remove it from a sales time series dataset.


    Let’s get started.


    # ### 13.1 Trends in Time Series


    A trend is a long-term increase or decrease in the level of the time series.


    > > In general, a systematic change in a time series that does not appear to be
    periodic is known as a trend.

    >

    > — Page 5, *Introductory Time Series with R*.


    Identifying and understanding trend information can aid in improving model performance;
    below are a few reasons:


    +   - **Faster Modeling:** Perhaps the knowledge of a trend or lack of a trend
    can suggest methods and make model selection and evaluation more efficient.


    +   - **Simpler Problem:** Perhaps we can correct or remove the trend to simplify
    modeling and improve model performance.


    +   - **More Data:** Perhaps we can use trend information, directly or as a summary,
    to provide additional information to the model and improve model performance.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 13.1.1 Types of Trends


    There are all kinds of trends. Two general classes that we may think about are:


    +   - **Deterministic Trends**: These are trends that consistently increase or
    decrease.


    +   - **Stochastic Trends**: These are trends that increase and decrease inconsistently.


    In general, deterministic trends are easier to identify and remove, but the methods
    discussed in this tutorial can still be useful for stochastic trends. We can think
    about trends in terms of their scope of observations.


    +   - **Global Trends**: These are trends that apply to the whole time series.


    +   - **Local Trends**: These are trends that apply to parts or subsequences of
    a time series.


    Generally, global trends are easier to identify and address.


    # 13.1.2 Identifying a Trend


    You can plot time series data to see if a trend is obvious or not. The difficulty
    is that in practice, identifying a trend in a time series can be a subjective
    process. As such, extracting or removing it from the time series can be just as
    subjective. Create line plots of your data and inspect the plots for obvious trends.
    Add linear and nonlinear trend lines to your plots and see if a trend is obvious.


    # 13.1.3 Removing a Trend


    A time series with a trend is called non-stationary. An identified trend can be
    modeled. Once modeled, it can be removed from the time series dataset. This is
    called detrending the time series. If a dataset does not have a trend or we successfully
    remove the trend, the dataset is said to be trend stationary.


    # 13.1.4 Using Time Series Trends in Machine Learning


    From a machine learning perspective, a trend in your data represents two opportunities:


    +   - **Remove Information**: To remove systematic information that distorts the
    relationship between input and output variables.


    +   - **Add Information**: To add systematic information to improve the relationship
    between input and output variables.


    Specifically, a trend can be removed from your time series data (and data in the
    future) as a data preparation and cleaning exercise. This is common when using
    statistical methods for time series forecasting, but does not always improve results
    when using machine learning models. Alternately, a trend can be added, either
    directly or as a summary, as a new input variable to the supervised learning problem
    to predict the output variable.


    One or both approaches may be relevant for your time series forecasting problem
    and may be worth investigating. Next, let''s take a look at a dataset that has
    a trend'
  merge: -1
  img_proc: true
