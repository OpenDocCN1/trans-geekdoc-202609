- pgno: 90
  md: "# ### 9.4. Moving Average as Data Preparation\n\nThe `rolling()` function¹\
    \ on the Series Pandas object will automatically group observations into a window.\
    \ You can specify the window size, and by default a trailing window is created.\
    \ Once the window is created, we can take the mean value, and this is our transformed\
    \ dataset.\n\nNew observations in the future can be just as easily transformed\
    \ by keeping the raw values for the last few observations and updating a new average\
    \ value. To make this concrete, with a window size of 3, the transformed value\
    \ at time (t) is calculated as the mean value for the previous 3 observations\
    \ (t-2, t-1, t), as follows:\n\n$$\\begin{equation}\\begin{aligned} obs(t) = \\\
    frac{1}{3} \\times (obs(t-2) + obs(t-1) + obs(t)) \\end{aligned} \\tag{9.3}$$\n\
    \nFor the Daily Female Births dataset, the first moving average would be on January\
    \ 3rd, as follows:\n\n$$\\begin{equation}\\begin{aligned} obs(t) = \\frac{1}{3}\
    \ \\times (obs(t-2) + obs(t-1) + obs(t)) \\\\ = \\frac{1}{3} \\times (35 + 32\
    \ + 30) \\\\ = 32.333 \\end{aligned} \\tag{9.4}$$\n\nBelow is an example of transforming\
    \ the Daily Female Births dataset into a moving average with a window size of\
    \ 3 days, chosen arbitrarily.\n\n```\n```python\n# moving average smoothing as\
    \ data preparation\nfrom pandas import read_csv\nfrom matplotlib import pyplot\n\
    \nseries = read_csv('daily-total-female-births.csv', header=0, index_col=0, parse_dates=True,\n\
    \                squeeze=True)\n# tail-rolling average transform\nrolling = series.rolling(window=3)\n\
    rolling_mean = rolling.mean()\nprint(rolling_mean.head(10))\n# plot original and\
    \ transformed dataset\nseries.plot()\nrolling_mean.plot(color='red')\npyplot.show()\n\
    # zoomed plot original and transformed dataset\nseries[:100].plot()\nrolling_mean[:100].plot(color='red')\n\
    pyplot.show()\n```\n```\n\nListing 9.1: Example of moving average as data preparation\
    \ on the Daily Female Births dataset.\n\nRunning the example prints the first\
    \ 10 observations from the transformed dataset. We can see that the first 2 observations\
    \ will need to be discarded.\n\n| Date       |   |\n|:-----------|:--|\n| 1959-01-01\
    \ | NaN |\n| 1959-01-02 | NaN |\n| 1959-01-03 | 32.333333 |\n| 1959-01-04 | 31.000000\
    \ |\n| 1959-01-05 | 35.000000 |\n| 1959-01-06 | 34.666667 |\n\n¹http://pandas.pydata.org/pandas-docs/stable/generated/pandas.Series.rolling.html"
