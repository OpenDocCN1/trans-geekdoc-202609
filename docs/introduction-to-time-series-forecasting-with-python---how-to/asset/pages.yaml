  md: '# Chapter 23

    Moving Average Models for Forecasting


    The residual errors from forecasts on a time series provide another source of
    information that we can model. Residual errors themselves form a time series that
    can have temporal structure. A simple autoregression model of this structure can
    be used to predict the forecast error, which in turn can be used to correct forecasts.
    This type of model is called a moving average model, the same name but very different
    from moving average smoothing. In this tutorial, you will discover how to model
    a residual error time series and use it to correct predictions with Python. After
    completing this tutorial, you will know:


    +   - About how to model residual error time series using an autoregressive model.

    - How to develop and evaluate a model of residual error time series.

    - How to use a model of residual error to correct predictions and improve forecast
    skill.


    Let’s get started.


    # ### 23.1 Model of Residual Errors


    The difference between what was expected and what was predicted is called the
    residual error. It is calculated as:


    *residual_error = expected − predicted*  (23.1)


    Just like the input observations themselves, the residual errors from a time series
    can have temporal structure like trends, bias, and seasonality. Any temporal structure
    in the time series of residual forecast errors is useful as a diagnostic as it
    suggests information that could be incorporated in the predictive model. An ideal
    model would leave no structure in the residual error, just random fluctuations
    that cannot be modeled.


    Structure in the residual error can also be modeled directly. There may be complex
    signals in the residual error that are difficult to directly incorporate into
    the model. Instead, you can create a model of the residual error time series and
    predict the expected error for your model. The predicted error can then be subtracted
    from the model prediction and in turn provide an additional lift in performance.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'A simple and effective model of residual error is an autoregression. This is
    where some number of lagged error values are used to predict the error at the
    next time step. These lag errors are combined in a linear regression model, much
    like an autoregression model of the direct time series observations. An autoregression
    of the residual error time series is called a Moving Average (MA) model. This
    is confusing because it has nothing to do with the moving average smoothing process.
    Think of it as the sibling to the autoregressive (AR) process, except on lagged
    residual error rather than lagged raw observations.


    In this tutorial, we will develop an autoregression model of the residual error
    time series. Before we dive in, let''s look at a univariate dataset for which
    we will develop a model.


    # # 23.2 Daily Female Births Dataset


    In this lesson, we will use the Daily Female Births Dataset as an example. This
    dataset describes the number of daily female births in California in 1959. You
    can learn more about the dataset in Appendix A.4. Place the dataset in your current
    working directory with the filename `daily-total-female-births.csv`.


    # # 23.3 Persistence Forecast Model


    The simplest forecast that we can make is to forecast that what happened in the
    previous time step will be the same as what will happen in the next time step.
    This is called the *naive forecast* or the persistence forecast model. This model
    will provide the predictions from which we can calculate the residual error time
    series. Alternatively, we could develop an autoregression model of the time series
    and use that as our model. We will not develop an autoregression model in this
    case for brevity and to focus on the model of residual error.


    We can implement the persistence model in Python. After the dataset is loaded,
    it is phrased as a supervised learning problem. A lagged version of the dataset
    is created where the current time step (**t**) is used as the input variable and
    the next time step (**t+1**) is taken as the output variable.


    ```

    ```python

    # create lagged dataset

    values = DataFrame(series.values)

    dataframe = concat([values.shift(1), values], axis=1)

    dataframe.columns = [''t'', ''t+1'']

    ```

