    # ## 15.2 Non-Stationary Time Series


    Observations from a non-stationary time series show seasonal effects, trends,
    and other structures that depend on the time index. Summary statistics like the
    mean and variance do change over time, providing a drift in the concepts a model
    may try to capture. Classical time series analysis and forecasting methods are
    concerned with making non-stationary time series data stationary by identifying
    and removing trends and removing seasonal effects. Below is an example of the
    Airline Passengers dataset that is non-stationary, showing both trend and seasonal
    components. You can learn more about the dataset in Appendix A.5.


    ```

    ```python

    # load time series data

    from pandas import read_csv

