  md: "creating a lag feature for our daily temperature dataset. The values are extracted\
    \ from the loaded series and a shifted and unshifted list of these values is created.\
    \ Each column is also named in the DataFrame for clarity.\n\n```\n# create a lag\
    \ feature\nfrom pandas import read_csv\nfrom pandas import DataFrame\nfrom pandas\
    \ import concat\nseries = read_csv('daily-minimum-temperatures.csv', header=0,\
    \ index_col=0,\n                   parse_dates=True, squeeze=True)\ntemps = DataFrame(series.values)\n\
    dataframe = concat([temps.shift(1), temps], axis=1)\ndataframe.columns = ['t',\
    \ 't+1']\nprint(dataframe.head(5))\n```\n\nListing 5.8: Example of *lag=1* features\
    \ on the Minimum Daily Temperatures dataset.\n\nRunning the example prints the\
    \ first 5 rows of the new dataset with the lagged feature.\n\n  t    t+1\n0 NaN\
    \  20.7\n1 20.7 17.9\n2 17.9 18.8\n3 18.8 14.6\n4 14.6 15.8\n\nListing 5.9: Example\
    \ output of *lag=1* features.\n\nYou can see that we would have to discard the\
    \ first row to use the dataset to train a supervised learning model, as it does\
    \ not contain enough data to work with. The addition of lag features is called\
    \ the *sliding window* method, in this case with a window width of 1. It is as\
    \ though we are sliding our focus along the time series for each observation with\
    \ an interest in only what is within the window width. We can expand the window\
    \ width and include more lagged features. For example, below is the above case\
    \ modified to include the last 3 observed values to predict the value at the next\
    \ time step.\n\n```\n# create lag features\nfrom pandas import read_csv\nfrom\
    \ pandas import DataFrame\nfrom pandas import concat\nseries = read_csv('daily-minimum-temperatures.csv',\
    \ header=0, index_col=0,\n                   parse_dates=True, squeeze=True)\n\
    temps = DataFrame(series.values)\ndataframe = concat([temps.shift(3), temps.shift(2),\
    \ temps.shift(1), temps], axis=1)\ndataframe.columns = ['t-2', 't-1', 't', 't+1']\n\
    print(dataframe.head(5))\n```\n\nListing 5.10: Example of *lag*\n\nRunning this\
    \ example prints the first 5 rows of the new lagged dataset.\n\n   t-2   t-1 \
    \    t    t+1\n0 NaN   NaN  20.7  20.7\n1 NaN  20.7  17.9  17.9\n2 20.7  17.9\
