    # ## 28.5  Plotting the Confidence Interval


    The confidence interval can be plotted directly. The ARIMAResults object provides
    the plot_predict() function that can be used to make a forecast and plot the results
    showing recent observations, the forecast, and confidence interval. As with the
    forecast() function, the confidence interval can be configured by specifying the
    alpha argument. The default is 0.05 (95% confidence), which is a sensible default.
    The example below shows the same forecast from above plotted using this function.


    ```

    ```

    # plot the confidence intervals for an ARIMA forecast

    from pandas import read_csv

    from matplotlib import pyplot

    from statsmodels.tsa.arima_model import ARIMA

    # load data

    series = read_csv(''daily-total-female-births.csv'', header=0, index_col=0, parse_dates=True,
    squeeze=True)

    # split into train and test sets

    X = series.values

    X = X.astype(''float32'')

    size = len(X) - 1

    train, test = X[0:size], X[size:]

    # fit an ARIMA model

    model = ARIMA(train, order=(5,1,1))

    model_fit = model.fit(disp=False)

    # plot some history and the forecast with confidence intervals

    model_fit.plot_predict(len(train)-10, len(train)+1)

    pyplot.legend(loc= ''upper left'')

    pyplot.show()

    ```

    ```


    Listing 28.5: Plot the confidence interval for forecasts on the Daily Female Births
    dataset.


    The plot_predict() function will plot the observed y values if the prediction
    interval covers the training data. In this case, we predict the previous 10 days
    and the next 1 day. This is useful to see the prediction carry on from in sample
    to out-of-sample time indexes. This is contracted with the actual observations
    from the last 10 days. Finally, we can see the confidence interval as a gray cone
    around the predicted value. This is useful to get a spatial feeling for the range
    of possible values that an observation in the next time step may take.'
