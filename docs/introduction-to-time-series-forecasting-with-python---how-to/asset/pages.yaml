    # ### 15.3 Types of Stationary Time Series


    The notion of stationarity comes from the theoretical study of time series and
    it is a useful abstraction when forecasting. There are some finer-grained notions
    of stationarity that you may come across if you dive deeper into this topic. They
    are:


    +   - **Stationary Process**: A process that generates a stationary series of
    observations.

    - **Stationary Model**: A model that describes a stationary series of observations.

    - **Trend Stationary**: A time series that does not exhibit a trend.

    - **Seasonal Stationary**: A time series that does not exhibit seasonality.

    - **Strictly Stationary**: A mathematical definition of a stationary process,
    specifically that the joint distribution of observations is invariant to time
    shift.'
