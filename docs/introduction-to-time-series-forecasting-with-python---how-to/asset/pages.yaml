  md: '![](img/da419ed7447ef051ee9d00167b7274cf_43_0.png)


    Again, you can see that we must discard the first few rows that do not have enough
    data to train a supervised model. A difficulty with the sliding window approach
    is how large to make the window for your problem. Perhaps a good starting point
    is to perform a sensitivity analysis and try a suite of different window widths
    to in turn create a suite of different $views$ of your dataset and see which results
    in better performing models. There will be a point of diminishing returns.


    Additionally, why stop with a linear window? Perhaps you need a lag value from
    last week, last month, and last year. Again, this comes down to the specific domain.
    In the case of the temperature dataset, a lag value from the same day in the previous
    year or previous few years may be useful. We can do more with a window than include
    the raw values. In the next section, we’ll look at including features that summarize
    statistics across the window.


    # ## 5.6 Rolling Window Statistics


    A step beyond adding raw lagged values is to add a summary of the values at previous
    time steps. We can calculate summary statistics across the values in the sliding
    window and include these as features in our dataset. Perhaps the most useful is
    the mean of the previous few values, also called the rolling mean.


    We can calculate the mean of the current and previous values and use that to predict
    the next value. For the temperature data, we would have to wait 3 time steps before
    we had 2 values to take the average of before we could use that value to predict
    a 3rd value. For example:


    ```

    ```

    mean(t-1, t), t+1

    mean(20.7, 17.9), 18.8

    19.3, 18.8

    ```

    ```


    ![](img/da419ed7447ef051ee9d00167b7274cf_43_1.png)


    Pandas provides a $rolling()$ function ${ }^{3}$ that creates a new data structure
    with the window of values at each time step. We can then perform statistical functions
    on the window of values collected for each time step, such as calculating the
    mean. First, the series must be shifted. Then the rolling dataset can be created
    and the mean values calculated on each window of two values. Here are the values
    in the first three rolling windows:


    ```

    ```

    #, Window Values

    1, NaN

    2, NaN, 20.7

    3, 20.7, 17.9

    ```

    ```


    ![](img/da419ed7447ef051ee9d00167b7274cf_43_2.png)


    This suggests that we will not have usable data until the 3rd row. Finally, as
    in the previous section, we can use the $concat()$ function to construct a new
    dataset with just our new columns. The example below demonstrates how to do this
    with Pandas with a window size of 2.'
