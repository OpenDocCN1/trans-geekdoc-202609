    # Persistence Model for Forecasting


    Establishing a baseline is essential on any time series forecasting problem. A
    baseline in performance gives you an idea of how well all other models will actually
    perform on your problem. In this tutorial, you will discover how to develop a
    persistence forecast that you can use to calculate a baseline level of performance
    on a time series dataset with Python. After completing this tutorial, you will
    know:


    +   - The importance of calculating a baseline of performance on time series forecast
    problems.

    - How to develop a persistence model from scratch in Python.

    - How to evaluate the forecast from a persistence model and use it to establish
    a baseline in performance.


    Let’s get started.


    # 18.1  Forecast Performance Baseline


    A baseline in forecast performance provides a point of comparison. It is a point
    of reference for all other modeling techniques on your problem. If a model achieves
    performance at or below the baseline, the technique should be fixed or abandoned.
    The technique used to generate a forecast to calculate the baseline performance
    must be easy to implement and naive of problem-specific details. Before you can
    establish a performance baseline on your forecast problem, you must develop a
    test harness. This is comprised of:


    +   1. The dataset you intend to use to train and evaluate models.

    2. The resampling technique you intend to use to estimate the performance of the
    technique (e.g. train/test split).

    3. The performance measure you intend to use to evaluate forecasts (e.g. root
    mean squared error).


    Once prepared, you then need to select a naive technique that you can use to make
    a forecast and calculate the baseline performance. The goal is to get a baseline
    performance on your time series forecast problem as quickly as possible so that
    you can get to work better understanding the dataset and developing more advanced
    models. Three properties of a good technique for making a baseline forecast are:'
  merge: -1
  img_proc: true
- pgno: 171
  md: '+   - **Simple**: A method that requires little or no training or intelligence.

    - **Fast**: A method that is fast to implement and computationally trivial to
    make a prediction.

    - **Repeatable**: A method that is deterministic, meaning that it produces an
    expected output given the same input.


    A common algorithm used in establishing a baseline performance is the persistence
    algorithm.


    # ## 18.2 Persistence Algorithm


    The most common baseline method for supervised machine learning is the Zero Rule
    algorithm. This algorithm predicts the majority class in the case of classification,
    or the average outcome in the case of regression. This could be used for time
    series, but does not respect the serial correlation structure in time series datasets.
    The equivalent technique for use with time series dataset is the persistence algorithm.


    The persistence algorithm uses the value at the current time step (**t**) to predict
    the expected outcome at the next time step (**t+1**). This satisfies the three
    above conditions for a baseline forecast. To make this concrete, we will look
    at how to develop a persistence model and use it to establish a baseline performance
    for a simple univariate time series problem. First, let’s review the Shampoo Sales
    dataset.


    # ## 18.3 Shampoo Sales Dataset


    In this lesson, we will use the Shampoo Sales dataset as an example. This dataset
    describes the monthly number of sales of shampoo over a 3 year period. You can
    learn more about the dataset in Appendix A.1. Place the dataset in your current
    working directory with the filename `shampoo-sales.csv`.


    # ## 18.4 Persistence Algorithm Steps


    A persistence model can be implemented easily in Python. We will break this tutorial
    down into 4 steps:


    +   1. Transform the univariate dataset into a supervised learning problem.

    2. Establish the train and test datasets for the test harness.

    3. Define the persistence model.

    4. Make a forecast and establish a baseline performance.

    5. Review the complete example and plot the output.


    Let’s dive in.'
