  md: '# Chapter 19


    # Visualize Residual Forecast Errors


    Forecast errors on time series regression problems are called residuals or residual
    errors. Careful exploration of residual errors on your time series prediction
    problem can tell you a lot about your forecast model and even suggest improvements.
    In this tutorial, you will discover how to visualize residual errors from time
    series forecasts. After completing this tutorial, you will know:


    +   * How to create and review line plots of residual errors over time.

    * How to review summary statistics and plots of the distribution of residual plots.

    * How to explore the correlation structure of residual errors.


    Let’s get started.


    # 19.1 Residual Forecast Errors


    Forecast errors on a time series forecasting problem are called residual errors
    or residuals. A residual error is calculated as the expected outcome minus the
    forecast, for example:


    residual_error = expected – forecast (19.1)


    Or, more succinctly and using standard terms as:


    e = y - yhat (19.2)


    We often stop there and summarize the skill of a model as a summary of this error.
    Instead, we can collect these individual residual errors across all forecasts
    and use them to better understand the forecast model. Generally, when exploring
    residual errors we are looking for patterns or structure. A sign of a pattern
    suggests that the errors are not random.


    We expect the residual errors to be random, because it means that the model has
    captured all of the structure and the only error left is the random fluctuations
    in the time series that cannot be modeled. A sign of a pattern or structure suggests
    that there is more information that a model could capture and use to make better
    predictions.


    Before we start exploring the different ways to look for patterns in residual
    errors, we need context. In the next section, we will look at a dataset and a
    simple forecast method that we will use to generate residual errors to explore
    in this tutorial.'
