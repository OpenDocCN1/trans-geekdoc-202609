  md: "3. Repeat step 2 for as long as you like.\n\nMore succinctly, we can describe\
    \ this process as:\n\n$y(t) = B0 + B1 \\times X(t - 1) + \\epsilon(t)$\n\n(11.1)\n\
    \nWhere **y(t)** is the next value in the series. **B0** is a coefficient that\
    \ if set to a value other than zero adds a constant drift to the random walk.\
    \ **B1** is a coefficient to weight the previous time step and is set to 1.0.\
    \ **X(t-1)** is the observation at the previous time step. **e(t)** is the white\
    \ noise or random fluctuation at that time. We can implement this in Python by\
    \ looping over this process and building up a list of 1,000 time steps for the\
    \ random walk. The complete example is listed below.\n\n```\n```python\n# create\
    \ and plot a random walk\nfrom random import seed\nfrom random import random\n\
    from matplotlib import pyplot\nseed(1)\nrandom_walk = list()\nrandom_walk.append(-1\
    \ if random() < 0.5 else 1)\nfor i in range(1, 1000):\n    movement = -1 if random()\
    \ < 0.5 else 1\n    value = random_walk[i-1] + movement\n    random_walk.append(value)\n\
