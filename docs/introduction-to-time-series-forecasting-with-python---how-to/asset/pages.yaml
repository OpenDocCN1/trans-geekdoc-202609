  md: "This yearly view of the data is an interesting avenue and could be pursued\
    \ further by looking at summary statistics from decade-to-decade and changes in\
    \ summary statistics.\n\n# ## 31.6  ARIMA Models\n\nIn this section, we will develop\
    \ Autoregressive Integrated Moving Average or ARIMA models for the problem. We\
    \ will approach modeling by both manual and automatic configuration of the ARIMA\
    \ model. This will be followed by a third step of investigating the residual errors\
    \ of the chosen model. As such, this section is broken down into 3 steps:\n\n\
    +   1. Manually Configure the ARIMA.\n2. Automatically Configure the ARIMA.\n\
    3. Review Residual Errors.\n\n# ### 31.6.1  Manually Configured ARIMA\n\nThe *ARIMAp,d,q*\
    \ model requires three parameters and is traditionally configured manually. Analysis\
    \ of the time series data assumes that we are working with a stationary time series.\
    \ The time series is likely non-stationary. We can make it stationary by first\
    \ differencing the series and using a statistical test to confirm that the result\
    \ is stationary. The example below creates a stationary version of the series\
    \ and saves it to file *stationary.csv*.\n\n```\n```\n# create and summarize a\
    \ stationary version of the time series\nfrom pandas import read_csv\nfrom pandas\
    \ import Series\nfrom statsmodels.tsa.stattools import adfuller\nfrom matplotlib\
    \ import pyplot\n\n# create a differenced series\ndef difference(dataset):\n \
    \ diff = list()\n  for i in range(1, len(dataset)):\n    value = dataset[i] -\
    \ dataset[i - 1]\n    diff.append(value)\n  return Series(diff)\n\nseries = read_csv('dataset.csv',\
    \ header=None, index_col=0, parse_dates=True, squeeze=True)\nX = series.values\n\
    X = X.astype('float32')\n# difference data\nstationary = difference(X)\nstationary.index\
    \ = series.index[1:]\n# check if stationary\nresult = adfuller(stationary)\nprint('ADF\
    \ Statistic: %f' % result[0])\nprint('p-value: %f' % result[1])\nprint('Critical\
    \ Values:')\nfor key, value in result[4].items():\n print('\\t%s: %.3f' % (key,\
    \ value))\n# plot differenced data\n```\n```"
