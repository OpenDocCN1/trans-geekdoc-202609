- pgno: 30
  md: '# ## 3.4  Sliding Window With Multiple Steps


    The number of time steps ahead to be forecasted is important. Again, it is traditional
    to use different names for the problem depending on the number of time-steps to
    forecast:


    +   - **One-step Forecast**: This is where the next time step (t+1) is predicted.


    +   - **Multi-step Forecast**: This is where two or more future time steps are
    to be predicted.


    All of the examples we have looked at so far have been one-step forecasts. There
    are a number of ways to model multi-step forecasting as a supervised learning
    problem. For now, we are focusing on framing multi-step forecast using the sliding
    window method. Consider the same univariate time series dataset from the first
    sliding window example above:


    ```

    ```text

    time, measure

    1,    100

    2,    110

    3,    108

    4,    115

    5,    120

    ```

    ```


    Listing 3.7: Example of a small contrived time series dataset.


    We can frame this time series as a two-step forecasting dataset for supervised
    learning with a window width of one, as follows:


    ```

    ```text

    X1,  y1,   y2

    ?,     100,  110

    100,  110,  108

    110,  108,  115

    108,  115,  120

    115,  120,  ?

    120,  ?,     ?

    ```

    ```


    Listing 3.8: Example of a univariate time series dataset as a multi-step or sequence
    prediction supervised learning problem.


    We can see that the first row and the last two rows cannot be used to train a
    supervised model. It is also a good example to show the burden on the input variables.
    Specifically, that a supervised model only has X1 to work with in order to predict
    both y1 and y2. Careful thought and experimentation are needed on your problem
    to find a window width that results in acceptable model performance.


    # ## 3.5  Summary


    In this lesson, you discovered how you can re-frame your time series prediction
    problem as a supervised learning problem for use with machine learning methods.
    Specifically, you learned:


    +   - Supervised learning is the most popular way of framing problems for machine
    learning as a collection of observations with inputs and outputs.


    +   - Sliding window is the way to restructure a time series dataset as a supervised
    learning problem.'
  merge: -1
