  md: '# # 19.5 Residual Summary Statistics


    We can calculate summary statistics on the residual errors. Primarily, we are
    interested in the mean value of the residual errors. A value close to zero suggests
    no bias in the forecasts, whereas positive and negative values suggest a positive
    or negative bias in the forecasts made. It is useful to know about a bias in the
    forecasts as it can be directly corrected in forecasts prior to their use or evaluation.


    Below is an example of calculating summary statistics of the distribution of residual
    errors. This includes the mean and standard deviation of the distribution, as
    well as percentiles and the minimum and maximum errors observed.


