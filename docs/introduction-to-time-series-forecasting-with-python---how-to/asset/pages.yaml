    # ## 6.7 Lag Scatter Plots


    Time series modeling assumes a relationship between an observation and the previous
    observation. Previous observations in a time series are called lags, with the
    observation at the previous time'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'step called \textbf{lag1}, the observation at two time steps ago \textbf{lag=2},
    and so on. A useful type of plot to explore the relationship between each observation
    and a lag of that observation is called the scatter plot. Pandas has a built-in
    function for exactly this called the lag plot. It plots the observation at time
    \textbf{t} on the x-axis and the observation at the next time step (\textbf{t+1})
    on the y-axis.


    +   - If the points cluster along a diagonal line from the bottom-left to the
    top-right of the plot, it suggests a positive correlation relationship.

    - If the points cluster along a diagonal line from the top-left to the bottom-right,
    it suggests a negative correlation relationship.

    - Either relationship is good as they can be modeled.


    More points tighter in to the diagonal line suggests a stronger relationship and
    more spread from the line suggests a weaker relationship. A ball in the middle
    or a spread across the plot suggests a weak or no relationship. Below is an example
    of a lag plot for the Minimum Daily Temperatures dataset.


    ```

    # create a scatter plot

    from pandas import read_csv

    from matplotlib import pyplot

    from pandas.plotting import lag_plot

    series = read_csv(''daily-minimum-temperatures.csv'', header=0, index_col=0, parse_dates=True,
    squeeze=True)

    lag_plot(series)

    pyplot.show()

    ```


    Listing 6.10: Example of a Lag scatter plot on the Minimum Daily Temperatures
    dataset.


    The plot created from running the example shows a relatively strong positive correlation
    between observations and their \textbf{lag1} values.'
  merge: -1
  img_proc: true
