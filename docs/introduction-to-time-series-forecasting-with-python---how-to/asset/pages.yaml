    \ and when calculated against lag values in time series, it is called autocorrelation\
    \ (self-correlation). A correlation value calculated between two groups of numbers,\
    \ such as observations and their lag=1 values, results in a number between -1\
    \ and 1. The sign of this number indicates a negative or positive correlation\
    \ respectively. A value close to zero suggests a weak correlation, whereas a value\
    \ closer to -1 or 1 indicates a strong correlation.\n\nCorrelation values, called\
    \ correlation coefficients, can be calculated for each observation and different\
    \ lag values. Once calculated, a plot can be created to help better understand\
