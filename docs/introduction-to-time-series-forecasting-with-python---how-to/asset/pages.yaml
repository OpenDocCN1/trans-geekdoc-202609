- pgno: 246
  md: '# # Chapter 27


    # # Save Models and Make Predictions


    Selecting a time series forecasting model is just the beginning. Using the chosen
    model in practice can pose challenges, including data transformations and storing
    the model parameters on disk. In this tutorial, you will discover how to finalize
    a time series forecasting model and use it to make predictions in Python. After
    completing this tutorial, you will know:


    +   - How to finalize a model and save it and required data to file.

    - How to load a finalized model from file and use it to make a prediction.

    - How to update data associated with a finalized model in order to make subsequent
    predictions.


    Let’s get started.


    # ## 27.1 Process for Making a Prediction


    A lot is written about how to tune specific time series forecasting models, but
    little help is given to how to use a model to make predictions. Once you can build
    and tune forecast models for your data, the process of making a prediction involves
    the following steps:


    +   1. **Model Selection**. This is where you choose a model and gather evidence
    and support to defend the decision.

    2. **Model Finalization**. The chosen model is trained on all available data and
    saved to file for later use.

    3. **Forecasting**. The saved model is loaded and used to make a forecast.

    4. **Model Update**. Elements of the model are updated in the presence of new
    observations.


    We will take a look at each of these elements in this tutorial, with a focus on
    saving and loading the model to and from file and using a loaded model to make
    predictions. Before we dive in, let’s first look at a standard univariate dataset
    that we can use as the context for this tutorial.'
  merge: -1
  img_proc: true
