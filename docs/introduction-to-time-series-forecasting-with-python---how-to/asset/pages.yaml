    A class of more extreme trends are exponential, often graphed as a hockey stick.
    Time series with an exponential distribution can be made linear by taking the
    logarithm of the values. This is called a log transform. As with the square and
    square root case above, we can demonstrate this with a quick example. The code
    below creates an exponential distribution by raising the numbers from 1 to 99
    to the value e, which is the base of the natural logarithms or Euler’s number
    $(2.718\dots)$\[^1].


