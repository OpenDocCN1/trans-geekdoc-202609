- pgno: 11
  md: '+   • **Harnes Temporal Structure**: You will be able to analyze time series
    data and understand the temporal structure inherent in it such as trends and seasonality
    and how these structures may be addressed, removed and harnessed when forecasting.

    • **Evaluate Models**: You will be able to devise a model test harness for a univariate
    forecasting problem and estimate the baseline skill and expected model performance
    on unseen data with various performance measures.

    • **Apply Classical Methods**: You will be able to select, apply and interpret
    the results from classical linear methods such as Autoregression, Moving Average
    and ARIMA models on univariate time series forecasting problems.


    You will be a capable predictive modeler for univariate time series forecasting
    problems using the Python ecosystem.


    # Limitations


    This book is not all things to all people. Specifically:


    +   • **Time Series Analysis**: This is a book of time series forecasting, not
    time series analysis. The primary concern of this book is using historical data
    to predict the future, not to understand the past.

    • **Advanced Time Series**: This is not a treatment of complex time series problems.
    It does not provide tutorials on advanced topics like multi-step sequence forecasts,
    multivariate time series problems or spatial-temporal prediction problems.

    • **Algorithm Textbook**: This is a practical book full of rules of application
    and code recipes. It is not a textbook, it does not describe why algorithms work
    or the equations that govern them.

    • **Python Language Book**: This is not a treatment of the Python programming
    language. It does not provide an introduction to the history, syntax or semantics
    of Python code.


    It is important to calibrate your expectations to the goals and principles of
    what this book is designed to achieve.


    # Structure


    This book is presented as a series of lessons and projects.


    +   • **Lessons**: Lessons take a tutorial format and focus on teaching one specific
    topic with just enough background to provide a context for the topic with a focus
    on examples and working code to demonstrate the topic in practice.

    • **Projects**: Projects take a tutorial format and focus on the application of
    a suite of topics presented in lessons focused on getting an outcome on a real
    world predictive modeling dataset.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'This book is primarily comprised of tutorial lessons. Lessons are organized
    into 5 main topics or themes. These are as follows:


    +   * **Fundamentals:** This part contains introductory material such as how to
    setup a SciPy environment, examples of time series problems and what differentiates
    them from other types of predictive modeling and important concepts like random
    walk and white noise.

    * **Data Preparation:** This part contains lessons on how to prepare data for
    forecasting. This includes methods such as scaling, transforms and feature engineering
    designed to better expose the inherent structure of the problem to modeling algorithms.

    * **Temporal Structure:** This part focuses on the temporal structure of forecasting
    problems. This includes understanding systematic changes in the data over time
    such as trends and seasonality and the concept of stationarity.

    * **Evaluate Models:** This part focuses on how to evaluate the performance of
    forecasts. This includes methods to back-test an algorithm, evaluate the skill
    of a model, perform diagnostics on the predictions from a model and reframe a
    problem.

    * **Forecast Models:** This part focuses on classical linear models for time series
    forecasting. This includes autoregression, moving average and autoregressive integrated
    moving average or ARIMA models.


    The lessons of the book culminate in three projects. The projects are designed
    to demonstrate both a structure for working through a forecasting project and
    the key techniques demonstrated in the book. These projects include:


    +   * **Project 1:** Monthly Armed Robberies in Boston.

    * **Project 2:** Annual Water Usage in Baltimore.

    * **Project 3:** Monthly Sales of French Champagne.


    # ## Summary


    You now have an idea of how the book is organized. You also now know the principles
    behind why the lessons are laser focused on fast repeatable results to help you
    deliver value as quickly as possible on your on time series forecasting projects.


    # ## Next


    Next begins the Fundamentals part and the lessons focused on how time series forecasting
    problems are structured and how they are different to other types of predictive
    modeling problems. The first lesson gives you some background on how to setup
    your Python development environment.'
  merge: -1
  img_proc: true
