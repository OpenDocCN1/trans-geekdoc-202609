    \ figure it out  \nquickly.\n\nDon't panic if you're not a perfect match. I will\
    \ provide resources to help out including help on setting up a Python environment\
    \ and resources for learning more about machine learning.\n\n# ## How to Read\n\
    \nThe book was designed to fit three different reading styles. They are:\n\n+\
    \   - **End-to-End:** The material is ordered such that you may read the book\
    \ end-to-end,  \ncover-to-cover and discover how you may work through time series\
    \ forecasting problems.\n\n+   - **Piecewise:** The lessons are standalone so\
    \ that you can dip in to the topics you require  \npiecewise for your forecasting\
    \ project.\n\n+   - **Template:** The projects are structured to provide a template\
    \ that can be copied and  \nused to work through your own forecasting projects.\n\
    \nPick the reading style that is right for you to get the most out of the book\
    \ as quickly as possible.\n\n# ## Reading Outcomes\n\nIf you choose to work through\
    \ all of the lessons and projects of this book, you can set some reasonable expectations\
    \ on your new found capabilities. They are:\n\n+   - **Time Series Foundations:**\
    \ You will be able to identify time series forecasting problems  \nas distinct\
    \ from other predictive modeling problems and how time series can be framed as\
    \  \nsupervised learning.\n\n+   - **Transform Data For Modeling:** You will be\
