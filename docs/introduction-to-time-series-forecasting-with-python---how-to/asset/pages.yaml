  md: "```\n```\n6   35.000000  29.0   45\n7   34.666667  45.0   43\n8   39.333333\
    \  43.0   38\n9   39.000000  38.0   27\n```\n```\n\nListing 9.6: Example output\
    \ of moving average as feature engineering on the Daily Female Births dataset.\n\
    \nThe next section will look at how to use the moving average as a naive model\
    \ to make predictions.\n\n# ## 9.6 Moving Average as Prediction\n\nThe moving\
    \ average value can also be used directly to make predictions. It is a naive model\
    \ and assumes that the trend and seasonality components of the time series have\
    \ already been removed or adjusted for. The moving average model for predictions\
    \ can easily be used in a walk-forward manner. As new observations are made available\
    \ (e.g. daily), the model can be updated and a prediction made for the next day.\
    \ We can implement this manually in Python. Below is an example of the moving\
    \ average model used in a walk-forward manner.\n\n```\n```\n# moving average smoothing\
    \ as a forecast model\nfrom math import sqrt\nfrom pandas import read_csv\nfrom\
    \ numpy import mean\nfrom sklearn.metrics import mean_squared_error\nfrom matplotlib\
    \ import pyplot\nseries = read_csv('daily-total-female-births.csv', header=0,\
    \ index_col=0, parse_dates=True, squeeze=True)\n\n# prepare situation\nX = series.values\n\
    window = 3\nhistory = [X[i] for i in range(window)]\ntest = [X[i] for i in range(window,\
    \ len(X))]\npredictions = list()\n\n# walk forward over time steps in test\nfor\
    \ t in range(len(test)):\n    length = len(history)\n    yhat = mean([history[i]\
    \ for i in range(length-window, length)])\n    obs = test[t]\n    predictions.append(yhat)\n\
    \    history.append(obs)\n    print('predicted=%f, expected=%f' % (yhat, obs))\n\
    rmse = sqrt(mean_squared_error(test, predictions))\nprint('Test RMSE: %.3f' %\
    \ rmse)\n# plot\npyplot.plot(test)\npyplot.plot(predictions, color='red')\npyplot.show()\n\
    # zoom plot\npyplot.plot(test[:100])\npyplot.plot(predictions[:100], color='red')\n\
    pyplot.show()\n```\n```\n\nListing 9.7: Example of moving average for prediction\
    \ on the Daily Female Births dataset."
