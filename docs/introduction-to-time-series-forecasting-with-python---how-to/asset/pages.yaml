    \n```\ntraining_size = i × (n_samples / (n_splits + 1)) + (n_samples mod (n_splits\
    \ + 1))\ntest_size = n_samples / (n_splits + 1) (16.1)\n```\n\nWhere **n_samples**\
    \ is the total number of observations and **n_splits** is the total number of\
    \ splits. Let's make this concrete with an example. Assume we have 100 observations\
    \ and we want to create 2 splits. For the first split, the train size would be\
    \ calculated as:\n\n```\ntrain = i × (n_samples / (n_splits + 1)) + (n_samples\
    \ mod (n_splits + 1))\n     = 1 × (100 / (2 + 1)) + (100 mod (2 + 1))\n     =\
    \ 33.3\n     = 33 (16.2)\n```\n\nThe test set size for the first split would be\
    \ calculated as:\n\n```\ntest = n_samples / (n_splits + 1)\n     = 100 / (2 +\
    \ 1)\n     = 33.3\n     = 33 (16.3)\n```\n\nOr the first 33 records are used for\
    \ training and the next 33 records are used for testing. The size of the train\
    \ set on the second split is calculated as follows:\n\n```\ntrain = i × (n_samples\
    \ / (n_splits + 1)) + (n_samples mod (n_splits + 1))\n     = 2 × (100 / (2 + 1))\
    \ + (100 mod (2 + 1))\n     = 66.6\n     = 66 (16.4)\n```\n\nThe test set size\
    \ on the second split is calculated as follows:\n\n```\ntest = n_samples / (n_splits\
    \ + 1)\n     = 100 / (2 + 1)\n     = 33.3\n     = 33 (16.5)\n```\n\nOr, the first\
    \ 67 records are used for training and the remaining 33 records are used for testing.\
    \ You can see that the test size stays consistent. This means that performance\
    \ statistics calculated on the predictions of each trained model will be consistent\
    \ and can be combined and compared. It provides an apples-to-apples comparison."
