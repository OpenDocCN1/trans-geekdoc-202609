    train, test = X[1:len(X)-7], X[len(X)-7:]\n# train autoregression\nmodel = AR(train)\n\
    model_fit = model.fit()\nwindow = model_fit.k_ar\ncoef = model_fit.params\n# walk\
    \ forward over time steps in test\nhistory = train[len(train)-window:]\nhistory\
    \ = [history[i] for i in range(len(history))]\npredictions = list()\nfor t in\
