  md: '# # Chapter 16

    ## Backtest Forecast Models


    The goal of time series forecasting is to make accurate predictions about the
    future. The fast and powerful methods that we rely on in machine learning, such
    as using train-test splits and *k*-fold cross-validation, do not work in the case
    of time series data. This is because they ignore the temporal components inherent
    in the problem. In this tutorial, you will discover how to evaluate machine learning
    models on time series data with Python. In the field of time series forecasting,
    this is called backtesting or hindcasting. After completing this tutorial, you
    will know:


    +   - The limitations of traditional methods of model evaluation from machine
    learning and why evaluating models on out-of-sample data is required.

    - How to create train-test splits and multiple train-test splits of time series
    data for model evaluation in Python.

    - How walk-forward validation provides the most realistic evaluation of machine
    learning models on time series data.


    Let''s get started.


    # ## 16.1 Model Evaluation


    How do we know how good a given model is? We could evaluate it on the data used
    to train it. This would be invalid. It might provide insight into how the selected
    model works, and even how it may be improved. But, any estimate of performance
    on this data would be optimistic, and any decisions based on this performance
    would be biased. Why?


    It is helpful to take it to an extreme: A model that remembered the timestamps
    and value for each observation would achieve perfect performance. All real models
    we prepare will report a pale version of this result.


    When evaluating a model for time series forecasting, we are interested in the
    performance of the model on data that was not used to train it. In machine learning,
    we call this unseen or out-of-sample data. We can do this by splitting up the
    data that we do have available. We use some to prepare the model and we hold back
    some data and ask the model to make predictions for that period. The evaluation
    of these predictions will provide a good proxy for how the model will perform
    when we use it operationally.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'In applied machine learning, we often split our data into a train and a test
    set: the training set used to prepare the model and the test set used to evaluate
    it. We may even use *k*-fold cross-validation that repeats this process by systematically
    splitting the data into *k* groups, each given a chance to be a held out model.


    These methods cannot be directly used with time series data. This is because they
    assume that there is no relationship between the observations, that each observation
    is independent. This is not true of time series data, where the time dimension
    of observations means that we cannot randomly split them into groups. Instead,
    we must split data up and respect the temporal order in which values were observed.


    In time series forecasting, this evaluation of models on historical data is called
    backtesting. In some time series domains, such as meteorology, this is called
    hindcasting, as opposed to forecasting. We will look at three different methods
    that you can use to backtest your machine learning models on time series problems.
    They are:


    +   1. Train-Test split that respect temporal order of observations.

    2. Multiple Train-Test splits that respect temporal order of observations.

    3. Walk-Forward Validation where a model may be updated each time step new data
    is received.


    First, let’s take a look at a small, univariate time series data we will use as
    context to understand these three backtesting methods: the Sunspot dataset.


    # ## 16.2 Monthly Sunspots Dataset


    In this lesson, we will use the Monthly Sunspots dataset as an example. This dataset
    describes a monthly count of the number of observed sunspots for just over 230
    years (1749–1983). You can learn more about the dataset in Appendix A.3. Place
    the dataset in your current working directory with the filename `sunspots.csv`.


    # ## 16.3 Train-Test Split


    You can split your dataset into training and testing subsets. Your model can be
    prepared on the training dataset and predictions can be made and evaluated for
    the test dataset. This can be done by selecting an arbitrary split point in the
    ordered list of observations and creating two new datasets. Depending on the amount
    of data you have available and the amount of data required, you can use splits
    of 50-50, 70-30 and 90-10. It is straightforward to split data in Python.


    After loading the dataset as a Pandas Series, we can extract the NumPy array of
    data values. The split point can be calculated as a specific index in the array.
    All records up to the split point are taken as the training dataset and all records
    from the split point to the end of the list of observations are taken as the test
    set. Below is an example of this in Python using a split of 66-34.'
