  md: '# Chapter 10


    # A Gentle Introduction to White Noise


    White noise is an important concept in time series forecasting. If a time series
    is white noise, it is a sequence of random numbers and cannot be predicted. If
    the series of forecast errors are not white noise, it suggests improvements could
    be made to the predictive model. In this tutorial, you will discover white noise
    time series with Python. After completing this tutorial, you will know:


    +   - The definition of a white noise time series and why it matters.

    - How to check if your time series is white noise.

    - Statistics and diagnostic plots to identify white noise in Python.


    Let’s get started.


    # 10.1 What is a White Noise?


    A time series may be white noise. A time series is white noise if the variables
    are independent and identically distributed with a mean of zero. This means that
    all variables have the same variance (*sigma2*) and each value has a zero correlation
    with all other values in the series. If the variables in the series are drawn
    from a Gaussian distribution, the series is called Gaussian white noise.


    # 10.2 Why Does it Matter?


    White noise is an important concept in time series analysis and forecasting. It
    is important for two main reasons:


    +   - **Predictability:** If your time series is white noise, then, by definition,
    it is random. You cannot reasonably model it and make predictions.

    - **Model Diagnostics:** The series of errors from a time series forecast model
    should ideally be white noise.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Model Diagnostics is an important area of time series forecasting. Time series
    data are expected to contain some white noise component on top of the signal generated
    by the underlying process. For example:


    ```

    $$y(t)=signal(t)+noise(t)$$

    ```


    Once predictions have been made by a time series forecast model, they can be collected
    and analyzed. The series of forecast errors should ideally be white noise. When
    forecast errors are white noise, it means that all of the signal information in
    the time series has been harnessed by the model in order to make predictions.
    All that is left is the random fluctuations that cannot be modeled. A sign that
    model predictions are not white noise is an indication that further improvements
    to the forecast model may be possible.


    # ## 10.3 Is your Time Series White Noise?


    Your time series is not white noise if any of the following conditions are true:


    +   - Does your series have a non-zero mean?

    - Does the variance change over time?

    - Do values correlate with lag values?


    Some tools that you can use to check if your time series is white noise are:


    +   - **Create a line plot**. Check for gross features like a changing mean, variance,
    or obvious relationship between lagged variables.

    - **Calculate summary statistics**. Check the mean and variance of the whole series
    against the mean and variance of meaningful contiguous blocks of values in the
    series (e.g. days, months, or years).

    - **Create an autocorrelation plot**. Check for gross correlation between lagged
    variables.


    # ## 10.4 Example of White Noise Time Series


    In this section, we will create a Gaussian white noise series in Python and perform
    some checks. It is helpful to create and review a white noise time series in practice.
    It will provide the frame of reference and example plots and statistical tests
    to use and compare on your own time series projects to check if they are white
    noise. Firstly, we can create a list of 1,000 random Gaussian variables using
    the `gauss()` function from the `random` module1. We will draw variables from
    a Gaussian distribution with a mean (`mu`) of 0.0 and a standard deviation (`sigma`)
    of 1.0. Once created, we can wrap the list in a Pandas `Series` for convenience.'
