- pgno: 236
  md: '# ### 25.4.1 Autoregression Intuition


    Consider a time series that was generated by an autoregression (AR) process with
    a lag of k. We know that the ACF describes the autocorrelation between an observation
    and another observation at a prior time step that includes direct and indirect
    dependence information. This means we would expect the ACF for the AR(k) time
    series to be strong to a lag of k and the inertia of that relationship would carry
    on to subsequent lag values, trailing off at some point as the effect was weakened.


    We know that the PACF only describes the direct relationship between an observation
    and its lag. This would suggest that there would be no correlation for lag values
    beyond k. This is exactly the expectation of the ACF and PACF plots for an AR(k)
    process.


    # ### 25.4.2 Moving Average Intuition


    Consider a time series that was generated by a moving average (MA) process with
    a lag of k. Remember that the moving average process is an autoregression model
    of the time series of residual errors from prior predictions. Another way to think
    about the moving average model is that it corrects future forecasts based on errors
    made on recent forecasts. We would expect the ACF for the MA(k) process to show
    a strong correlation with recent values up to the lag of k, then a sharp decline
    to low or no correlation. By definition, this is how the process was generated.


    For the PACF, we would expect the plot to show a strong relationship to the lag
    and a trailing off of correlation from the lag onwards. Again, this is exactly
    the expectation of the ACF and PACF plots for an MA(k) process.


    # ## 25.5 Summary


    In this tutorial, you discovered how to calculate autocorrelation and partial
    autocorrelation plots for time series data with Python. Specifically, you learned:


    +   - How to calculate and create an autocorrelation plot for time series data.

    - How to calculate and create a partial autocorrelation plot for time series data.

    - The difference and intuition for interpreting ACF and PACF plots.


    # ### 25.5.1 Next


    In the next lesson you will discover how you can use grid search to tune an ARIMA
    model.'
  merge: -1
  img_proc: true
