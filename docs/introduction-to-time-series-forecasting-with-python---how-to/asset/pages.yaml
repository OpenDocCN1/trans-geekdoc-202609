    # 27.4 Finalize and Save Time Series Forecast Model


    Once the model is selected, we must finalize it. This means save the salient information
    learned by the model so that we do not have to re-create it every time a prediction
    is needed. This involves first training the model on all available data and then
    saving the model to file.


    The Statsmodels implementations of time series models do provide built-in capability
    to save and load models by calling `save()` and `load()` on the fit `ARResults`
    object$^{1}$. For example, the code below will train an AR(6) model on the entire
    Female Births dataset and save it using the built-in `save()` function, which
    will essentially pickle the `ARResults` object.


    The differenced training data must also be saved, both for the lag variables needed
    to make a prediction, and for knowledge of the number of observations seen, required
    by the `predict()` function of the `ARResults` object. Finally, we need to be
    able to transform the differenced'
