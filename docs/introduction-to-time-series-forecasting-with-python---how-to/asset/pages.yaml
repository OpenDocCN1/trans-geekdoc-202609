    squared series is linear, we would expect the histogram to show a uniform distribution.
    The example below performs a $\sqrt{}$ transform on the time series and plots
    the result.


    ```

    ```python

    # square root transform a contrived quadratic time series

    from matplotlib import pyplot

    from numpy import sqrt

    series = [i**2 for i in range(1,100)]

    # sqrt transform

    transform = series = sqrt(series)

    pyplot.figure(1)

    # line plot

    pyplot.subplot(211)

    pyplot.plot(transform)

