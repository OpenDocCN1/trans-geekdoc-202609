  md: '# # Chapter 25


    # # Autocorrelation and Partial Autocorrelation


    Autocorrelation and partial autocorrelation plots are heavily used in time series
    analysis and forecasting. These are plots that graphically summarize the strength
    of a relationship with an observation in a time series with observations at prior
    time steps. The difference between autocorrelation and partial autocorrelation
    can be difficult and confusing for beginners to time series forecasting. In this
    tutorial, you will discover how to calculate and plot autocorrelation and partial
    correlation plots with Python. After completing this tutorial, you will know:


    +   - How to plot and review the autocorrelation function for a time series.

    - How to plot and review the partial autocorrelation function for a time series.

    - The difference between autocorrelation and partial autocorrelation functions
    for time series analysis.


    Let''s get started.


    # ## 25.1 Minimum Daily Temperatures Dataset


    In this lesson, we will use the Minimum Daily Temperatures dataset as an example.
    This dataset describes the minimum daily temperatures over 10 years (1981-1990)
    in the city Melbourne, Australia. You can learn more about the dataset in Appendix
    A.2. Place the dataset in your current working directory with the filename `daily-minimum-temperatures.csv`.


    # ## 25.2 Correlation and Autocorrelation


    Statistical correlation summarizes the strength of the relationship between two
    variables. We can assume the distribution of each variable fits a Gaussian (bell
    curve) distribution. If this is the case, we can use the Pearson''s correlation
    coefficient to summarize the correlation between the variables. The Pearson''s
    correlation coefficient is a number between -1 and 1 that describes a negative
    or positive correlation respectively. A value of zero indicates no correlation.


    We can calculate the correlation for time series observations with observations
    with previous time steps, called lags. Because the correlation of the time series
    observations is calculated with'
  merge: -1
  img_proc: true
