- pgno: 143
  md: '# # Chapter 15

    ## Stationarity in Time Series Data


    Time series is different from more traditional classification and regression predictive
    modeling problems. The temporal structure adds an order to the observations. This
    imposed order means that important assumptions about the consistency of those
    observations needs to be handled specifically. For example, when modeling, there
    are assumptions that the summary statistics of observations are consistent. In
    time series terminology, we refer to this expectation as the time series being
    stationary. These assumptions can be easily violated in time series by the addition
    of a trend, seasonality, and other time-dependent structures. In this tutorial,
    you will discover how to check if your time series is stationary with Python.
    After completing this tutorial, you will know:


    +   - How to identify obvious stationary and non-stationary time series using
    line plot.

    - How to spot-check summary statistics like mean and variance for a change over
    time.

    - How to use statistical tests with statistical significance to check if a time
    series is stationary.


    Let''s get started.


    # ### 15.1 Stationary Time Series


    The observations in a stationary time series are not dependent on time. Time series
    are stationary if they do not have trend or seasonal effects. Summary statistics
    calculated on the time series are consistent over time, like the mean or the variance
    of the observations. When a time series is stationary, it can be easier to model.
    Statistical modeling methods assume or require the time series to be stationary
    to be effective. Below is an example of the Daily Female Births dataset that is
    stationary. You can learn more about the dataset in Appendix A.4.


    ```

    ```

    # load time series data

    from pandas import read_csv

    from matplotlib import pyplot

    series = read_csv(''daily-total-female-births.csv'', header=0, index_col=0, parse_dates=True,
    squeeze=True)

    series.plot()

    pyplot.show()

    ```

    ```


    Listing 15.1: Load and plot Daily Female Births dataset.'
