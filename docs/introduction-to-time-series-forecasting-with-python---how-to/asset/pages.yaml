  md: '# Chapter 26


    # # Grid Search ARIMA Model Hyperparameters


    The ARIMA model for time series analysis and forecasting can be tricky to configure.
    There are 3 parameters that require estimation by iterative trial and error from
    reviewing diagnostic plots and using 40-year-old heuristic rules. We can automate
    the process of evaluating a large number of hyperparameters for the ARIMA model
    by using a grid search procedure. In this tutorial, you will discover how to tune
    the ARIMA model using a grid search of hyperparameters in Python. After completing
    this tutorial, you will know:


    +   - A general procedure that you can use to tune the ARIMA hyperparameters for
    a rolling one-step forecast.

    - How to apply ARIMA hyperparameter optimization on a standard univariate time
    series dataset.

    - Ideas for extending the procedure for more elaborate and robust models.


    Let''s get started.


    # ## 26.1 Grid Searching Method


    Diagnostic plots of the time series can be used along with heuristic rules to
    determine the hyperparameters of the ARIMA model. These are good in most, but
    perhaps not all, situations. We can automate the process of training and evaluating
    ARIMA models on different combinations of model hyperparameters. In machine learning
    this is called a grid search or model tuning. In this tutorial, we will develop
    a method to grid search ARIMA hyperparameters for a one-step rolling forecast.
    The approach is broken down into two parts:


    +   1. Evaluate an ARIMA model.

    2. Evaluate sets of ARIMA parameters.


    The code in this tutorial makes use of the scikit-learn, Pandas, and the Statsmodels
    Python libraries.'
  merge: -1
  img_proc: true
- pgno: 238
  md: "# ## 26.2 Evaluate ARIMA Model\n\nWe can evaluate an ARIMA model by preparing\
    \ it on a training dataset and evaluating predictions on a test dataset. This\
    \ approach involves the following steps:\n\n+   1. Split the dataset into training\
    \ and test sets.\n2. Walk the time steps in the test dataset.\n    (a) Train an\
    \ ARIMA model.\n    (b) Make a one-step prediction.\n    (c) Store prediction;\
    \ get and store actual observation.\n3. Calculate error score for predictions\
    \ compared to expected values.\n\nWe can implement this in Python as a new standalone\
    \ function called evaluate_arima_model() that takes a time series dataset as input\
    \ as well as a tuple with the p, d, and q parameters for the model to be evaluated.\
    \ The dataset is split in two: 66% for the initial training dataset and the remaining\
    \ 34% for the test dataset.\n\nEach time step of the test set is iterated. Just\
    \ one iteration provides a model that you could use to make predictions on new\
    \ data. The iterative approach allows a new ARIMA model to be trained each time\
    \ step. A prediction is made each iteration and stored in a list. This is so that\
    \ at the end of the test set, all predictions can be compared to the list of expected\
    \ values and an error score calculated. In this case, a root mean squared error\
    \ score is calculated and returned. The complete function is listed below.\n\n\
    ```\n```\n# evaluate an ARIMA model for a given order (p,d,q)\ndef evaluate_arima_model(X,\
    \ arima_order):\n    # prepare training dataset\n    train_size = int(len(X) *\
    \ 0.66)\n    train, test = X[0:train_size], X[train_size:]\n    history = [x for\
    \ x in train]\n    # make predictions\n    predictions = list()\n    for t in\
    \ range(len(test)):\n        model = ARIMA(history, order=arima_order)\n     \
    \   model_fit = model.fit(disp=0)\n        yhat = model_fit.forecast()[0]\n  \
    \      predictions.append(yhat)\n        history.append(test[t])\n    # calculate\
    \ out-of-sample error\n    rmse = sqrt(mean_squared_error(test, predictions))\n\
    \    return rmse\n```\n```\n\nListing 26.1: Function to evaluate an ARIMA model\
    \ using out-of-sample error.\n\nNow that we know how to evaluate one set of ARIMA\
    \ hyperparameters, let's see how we can call this function repeatedly for a grid\
    \ of parameters to evaluate."
  merge: -1
  img_proc: true
- pgno: 239
  md: "# ## 26.3 Iterate ARIMA Parameters\n\nEvaluating a suite of parameters is relatively\
    \ straightforward. The user must specify a grid of p, d, and q ARIMA parameters\
    \ to iterate. A model is created for each parameter and its performance evaluated\
    \ by calling the evaluate_arima_model() function described in the previous section.\
    \ The function must keep track of the lowest error score observed and the configuration\
    \ that caused it. This can be summarized at the end of the function with a print\
    \ to standard out.\n\nWe can implement this function called evaluate_models()\
    \ as a series of four loops. There are two additional considerations. The first\
    \ is to ensure the input data are floating point values (as opposed to integers\
    \ or strings), as this can cause the ARIMA procedure to fail. Second, the Statsmodels\
    \ ARIMA procedure internally uses numerical optimization procedures to find a\
    \ set of coefficients for the model. These procedures can fail, which in turn\
    \ can throw an exception. We must catch these exceptions and skip those configurations\
    \ that cause a problem. This happens more often than you would think. Additionally,\
    \ it is recommended that warnings be ignored for this code to avoid a lot of noise\
    \ from running the procedure. This can be done as follows:\n\n```\n```python\n\
    import warnings\nwarnings.filterwarnings(\"ignore\")\n```\n```\n\nListing 26.2:\
    \ Disable Python warnings.\n\nFinally, even with all of these protections, the\
    \ underlying code libraries may still report warnings to standard out, such as:\n\
    \n```\n```text\n** On entry to DLASCL, parameter number 4 had an illegal value\n\
    ```\n```\n\nListing 26.3: Example error message from underlying libraries.\n\n\
    These have been removed from the results reported in this tutorial for brevity.\
    \ The complete procedure for evaluating a grid of ARIMA hyperparameters is listed\
    \ below.\n\n```\n```python\n# evaluate combinations of p, d and q values for an\
    \ ARIMA model\ndef evaluate_models(dataset, p_values, d_values, q_values):\n \
    \   dataset = dataset.astype('float32')\n    best_score, best_cfg = float(\"inf\"\
    ), None\n    for p in p_values:\n        for d in d_values:\n            for q\
    \ in q_values:\n                order = (p,d,q)\n                try:\n      \
    \              rms = evaluate_arima_model(dataset, order)\n                  \
    \  if rmse < best_score:\n                        best_score, best_cfg = rmse,\
    \ order\n                        print('ARIMA%s RMSE=%.3f' % (order,rmse))\n \
    \               except:\n                    continue\n    print('Best ARIMA%s\
    \ RMSE=%.3f' % (best_cfg, best_score))\n```\n```\n\nListing 26.4: Function to\
    \ grid search configurations for an ARIMA model.\n\nNow that we have a procedure\
    \ to grid search ARIMA hyperparameters, let’s test the procedure on two univariate\
    \ time series problems. We will start with the Shampo Sales dataset."
  merge: -1
  img_proc: true
