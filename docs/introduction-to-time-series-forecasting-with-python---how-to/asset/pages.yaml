- pgno: 266
  md: 'know what will work, let alone which methods will work well on your problem
    beforehand. And that the best source of knowledge on a forecasting project comes
    from the results of trial and error with real historical data.


    +   - Select or devise a time series forecast process that is tailored to your
    project, tools, team, and level of expertise.

    - Write down all assumptions and questions you have during analysis and forecasting
    work, then revisit them later and seek to answer them with small experiments on
    historical data.

    - Review a large number of plots of your data at different time scales, zooms,
    and transforms of observations in an effort to help make exploitable structures
    present in the data obvious to you.

    - Develop a robust test harness for evaluating models using a meaningful performance
    measure and a reliable test strategy, such as walk-forward validation (rolling
    forecast).

    - Start with simple naive forecast models to provide a baseline of performance
    for more sophisticated methods to improve upon.

    - Create a large number of perspectives or views on your time series data, including
    a suite of automated transforms, and evaluate each with one or a suite of models
    in order to help automatically discover non-intuitive representations and model
    combinations that result in good predictions for your problem.

    - Try a suite of models of differing types on your problem, from simple to more
    advanced approaches.

    - Try a suite of configurations for a given problem, including configurations
    that have worked well on other problems.

    - Try automated hyperparameter optimization methods for models to flush out a
    suite of well-performing models as well as non-intuitive model configurations
    that you would not have tried manually.

    - Devise automated tests of performance and skill for ongoing predictions to help
    to automatically determine if and when a model has become stale and requires review
    or retraining.


