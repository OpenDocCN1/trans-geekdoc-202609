    In this tutorial, you discovered a suite of 5 standard time series performance
    measures in Python. Specifically, you learned:


    +   * How to calculate forecast residual error and how to estimate the bias in
    a list of forecasts.

    * How to calculate mean absolute forecast error to describe error in the same
    units as the predictions.

    * How to calculate the widely used mean squared error and root mean squared error
    for forecasts.


    # ### 17.6.1 Next


    In the next lesson you will discover the naive forecast called the persistence
    model.'
