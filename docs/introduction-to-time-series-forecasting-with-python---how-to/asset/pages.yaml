    # 5.7 Expanding Window Statistics


    Another type of window that may be useful includes all previous data in the series.
    This is called an expanding window and can help with keeping track of the bounds
    of observable data. Like the rolling() function on DataFrame, Pandas provides
    an expanding() function4 that collects sets of all prior values for each time
    step.


    These lists of prior numbers can be summarized and included as new features. For
    example, below are the lists of numbers in the expanding window for the first
    5 time steps of the series:


    ```

    #, Window Values

    1, 20.7

    2, 20.7, 17.9,

    3, 20.7, 17.9, 18.8

    4, 20.7, 17.9, 18.8, 14.6

    5, 20.7, 17.9, 18.8, 14.6, 15.8


    Listing 5.19: Example of manual expanding window.

    ```


