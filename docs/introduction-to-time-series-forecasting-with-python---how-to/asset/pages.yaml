- pgno: 198
  md: '# 21.5.2 Residual Errors


    Forecast residuals provide a great opportunity for diagnostics. A review of the
    distribution of errors can help tease out bias in the model. The errors from an
    ideal model would resemble white noise, that is a Gaussian distribution with a
    mean of zero and a symmetrical variance. For this, you may use density plots,
    histograms, and Q–Q plots that compare the distribution of errors to the expected
    distribution. A non-Gaussian distribution may suggest an opportunity for data
    pre-processing. A skew in the distribution or a non-zero mean may suggest a bias
    in forecasts that may be correct.


    Additionally, an ideal model would leave no temporal structure in the time series
    of forecast residuals. These can be checked by creating ACF and PACF plots of
    the residual error time series. The presence of serial correlation in the residual
    errors suggests further opportunity for using this information in the model.


    # 21.6 Summary


    In this lesson, you discovered the Box-Jenkin s Method for time series analysis
    and forecasting. Specifically, you learned:


    +   - About the ARIMA model and the 3 steps of the general Box-Jenkin s Method.

    - How to use ACF and PACF plots to choose the **p** and **q** parameters for an
    ARIMA model.

    - How to use overfitting and residual errors to diagnose a fit ARIMA model.


    # 21.6.1 Next


    In the next lesson you will discover how to develop an autoregressive model.'
