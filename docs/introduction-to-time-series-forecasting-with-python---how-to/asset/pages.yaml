    # Time Series Forecast Projects


    A time series forecast process is a set of steps or a recipe that leads you from
    defining your problem through to the outcome of having a time series forecast
    model or set of predictions. In this lesson, you will discover time series forecast
    processes that you can use to guide you through your forecast project. After reading
    this lesson, you will know:


    +   - The 5-Step forecasting task by Hyndman and Athanasopoulos to guide you from
    problem definition to using and evaluating your forecast model.

    - The iterative forecast development process by Shmueli and Lichtendahl to guide
    you from defining your goal to implementing forecasts.

    - Suggestions and tips for working through your own time series forecasting project.


    Let’s get started.


    # 29.1 5-Step Forecasting Task


    The 5 basic steps in a forecasting task are summarized by Hyndman and Athanasopoulos
    in their book *Forecasting: principles and practice*<sup>1</sup>. These steps
    are:


    +   1. **Problem Definition.** The careful consideration of who requires the forecast
    and how the forecast will be used. This is described as the most difficult part
    of the process, most likely because it is entirely problem specific and subjective.

    2. **Gathering Information.** The collection of historical data to analyze and
    model. This also includes getting access to domain experts and gathering information
    that can help to best interpret the historical information, and ultimately the
    forecasts that will be made.

    3. **Preliminary Exploratory Analysis.** The use of simple tools, like graphing
    and summary statistics, to better understand the data. Review plots and summarize
    and note obvious temporal structures, like trends seasonality, anomalies like
    missing data, corruption, and outliers, and any other structures that may impact
    forecasting.


    <sup>1</sup>http://www.amazon.com/dp/0987507109?tag=inspiredalgor-20'
  merge: -1
  img_proc: true
- pgno: 263
  md: '+   4. **Choosing and Fitting Models.** Evaluate two, three, or a suite of
    models of varying types on the problem. Models may be chosen for evaluation based
    on the assumptions they make and whether the dataset conforms. Models are configured
    and fit to the historical data.


    +   5. **Using and Evaluating a Forecasting Model.** The model is used to make
    forecasts and the performance of those forecasts is evaluated and skill of the
    models estimated. This may involve back-testing with historical data or waiting
    for new observations to become available for comparison.


    ![](img/da419ed7447ef051ee9d00167b7274cf_263_0.png)


    Figure 29.1: 5-Step Forecasting Task.


    This 5-step process provides a strong overview from starting off with an idea
    or problem statement and leading through to a model that can be used to make predictions.
    The focus of the process is on understanding the problem and fitting a good model.


    Each model is itself an artificial construct that is based on a set of assumptions
    (explicit and implicit) and usually involves one or more parameters which must
    be “fitted” using the known historical data.


    — Page 22, *Forecasting: principles and practice*.


    # 29.2  Iterative Forecast Development Process


    The authors Shmueli and Lichtendahl in their book *Practical Time Series Forecasting
    with R: A Hands-On Guide*² suggest an 8-step process. This process extends beyond
    the development of a


