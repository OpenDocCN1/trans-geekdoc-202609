    # 32.7 Model Validation


    After models have been developed and a final model selected, it must be validated
    and finalized. Validation is an optional part of the process, but one that provides
    a last check to ensure we have not fooled or misled ourselves. This section includes
    the following steps:


    +   - **Finalize Model:** Train and save the final model.

    - **Make Prediction:** Load the finalized model and make a prediction.

    - **Validate Model:** Load and validate the final model.


    # 32.7.1 Finalize Model


    Finalizing the model involves fitting an ARIMA model on the entire dataset, in
    this case on a transformed version of the entire dataset. Once fit, the model
    can be saved to file for later use. The example below trains an ARIMA(0,0,1) model
    on the dataset and saves the whole fit object and the bias to file. There is a
    bug in the current version of the Statsmodels library that results in an error
    when you try to load a saved ARIMA model from file. Learn more about'
