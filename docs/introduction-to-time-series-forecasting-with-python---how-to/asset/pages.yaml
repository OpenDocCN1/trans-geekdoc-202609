    # ## 6.5 Box and Whisker Plots by Interval


    Histograms and density plots provide insight into the distribution of all observations,
    but we may be interested in the distribution of values by time interval. Another
    type of plot that is useful to summarize the distribution of observations is the
    box and whisker plot. This plot draws a box around the 25th and 75th percentiles
    of the data that captures the middle 50% of observations. A line is drawn at the
    50th percentile (the median) and whiskers are drawn above and below the box to
    summarize the general extents of the observations. Dots are drawn for outliers
    outside the whiskers or extents of the data.'
  merge: -1
  img_proc: true
