- pgno: 9
  md: '# # Welcome


    Welcome to the *Introduction to Time Series Forecasting with Python*. You are
    one of those rare people that have decided to invest in your education and in
    your future and I am honored that I can help.


    This book will show you how to make predictions on univariate time series problems
    using the standard tools in the Python ecosystem. Time series is an important
    and under served topic in applied machine learning, Python is the growing platform
    for machine learning and predictive modeling, and this book unlocks time series
    for Python. But, you have to do the work. I will lay out all of the topics, the
    tools, the code and the templates, but it is up to you to put them into practice
    on your projects and get results.


    Before we dive in, it is important to first dial in to the goals, limitations
    and structure of this book to ensure that you can get the most out of it, quickly,
    efficiently and also have a lot of fun doing it. Let’s start with the goals of
    the book.


    # ## Goals


    The goal of this book is to *show you how to get results on univariate time series
    forecasting problems using the Python ecosystem*. This goal cannot be achieved
    until you apply the lessons from this book on your own projects and get results.
    This is a guidebook or a cookbook designed for immediate use.


    # ## Principles


    This book was developed using the following five principles:


    +   * **Application**: The focus is on the application of forecasting rather than
    the theory.

    * **Lessons**: The book is broken down into short lessons, each focused on a specific
    topic.

    * **Value**: Lessons focus on the most used and most useful aspects of a forecasting
    project.

    * **Results**: Each lesson provides a path to a usable and reproducible result.

    * **Speed**: Each lesson is designed to provide the shortest path to a result.


    These principles shape the structure and organization of the book.'
  merge: -1
  img_proc: true
