    # # 27.5 Make a Time Series Forecast


    Making a forecast involves loading the saved model and estimating the observation
    at the next time step. If the **ARResults** object was serialized, we can use
    the **predict()** function to predict the next time period. The example below
    shows how the next time period can be predicted. The model, training data, and
    last observation are loaded from file.


    The period is specified to the **predict()** function as the next time index after
    the end of the training data set. This index may be stored directly in a file
    instead of storing the entire training data, which may be an efficiency. The prediction
    is made, which is in the context of the differenced dataset. To turn the prediction
    back into the original units, it must be added to the last known observation.


    ```

    # load AR model from file and make a one-step prediction

    from statsmodels.tsa.ar_model import ARResults

    import numpy

    # load model

    model = ARResults.load(''ar_model.pkl'')

    data = numpy.load(''ar_data.npy'')

    last_ob = numpy.load(''ar_obs.npy'')

    # make prediction

    predictions = model.predict(start=len(data), end=len(data))

    # transform prediction

    yhat = predictions[0] + last_ob[0]

    print(''Prediction: %f'' % yhat)

    ```


    Listing 27.9: Load the AR model and make a prediction for the Daily Female Births
    dataset.


    Running the example prints the prediction.


