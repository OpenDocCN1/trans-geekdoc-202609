    # ## 17.5 Root Mean Squared Error


    The mean squared error described above is in the squared units of the predictions.
    It can be transformed back into the original units of the predictions by taking
    the square root of the mean squared error score. This is called the root mean
    squared error, or RMSE.


    $$rmse = \sqrt{mean\ squared\ error}\ \ \ \ (17.5)$$


    This can be calculated by using the `sqrt()` math function on the mean squared
    error calculated using the **mean_squared_error()** scikit-learn function.


    ```

    # calculate root mean squared error

    from sklearn.metrics import mean_squared_error

    from math import sqrt

    expected = [0.0, 0.5, 0.0, 0.5, 0.0]

    predictions = [0.2, 0.4, 0.1, 0.6, 0.2]

    mse = mean_squared_error(expected, predictions)

    rmse = sqrt(mse)

    print(''RMSE: %f'' % rmse)

    ```


    Listing 17.9: Example of calculating root mean squared error.


    Running the example calculates the root mean squared error.


    ```

    RMSE: 0.148324

    ```


    Listing 17.10: Example output of calculating root mean squared error.


    The RMSE error values are in the same units as the predictions. As with the mean
    squared error, an RMSE of zero indicates no error.


