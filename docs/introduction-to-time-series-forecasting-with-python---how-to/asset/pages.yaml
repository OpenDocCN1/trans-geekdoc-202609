  md: "# 11.4 Random Walk and Stationarity\n\n\n\nTherefore we can expect a random\
    \ walk to be non-stationary. In fact, all random walk processes are non-stationary.\
    \ Note that not all non-stationary time series are random walks. Additionally,\
    \ a non-stationary time series does not have a consistent mean and/or variance\
    \ over time. A review of the random walk line plot might suggest this to be the\
    \ case. We can confirm this using a statistical significance test, specifically\
    \ the Augmented Dickey-Fuller test$^{4}$.\n\nWe can perform this test using the\
    \ adf$uller()$ function$^{5}$ in the Statsmodels library. The complete example\
    \ is listed below.\n\n```\n\n# calculate the stationarity of a random walk\nfrom\
    \ random import seed\nfrom random import random\nfrom statsmodels.tsa.stattools\
    \ import adf$uller\n# generate random walk\nseed(1)\nrandom_walk = list()\nrandom_walk.append(-1\
    \ if random() < 0.5 else 1)\nfor i in range(1, 1000):\n    movement = -1 if random()\
    \ < 0.5 else 1\n    value = random_walk[i-1] + movement\n    random_walk.append(value)\n\
    # statistical test\nresult = adf$uller(random_walk)\nprint('ADF Statistic: %f'\
    \ % result[0])\nprint('p-value: %f' % result[1])\nprint('Critical Values:')\n\
    for key, value in result[4].items():\n    print('\\t%s: %.3f' % (key, value))\n\
    \n```\n\nListing 11.4: Example of calculating stationarity of a random walk.\n\
    \nThe null hypothesis of the test is that the time series is non-stationary. Running\
