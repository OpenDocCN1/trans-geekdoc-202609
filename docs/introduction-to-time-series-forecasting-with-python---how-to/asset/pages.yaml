  md: '# ## 8.4 Box-Cox Transform


    The square root transform and log transform belong to a class of transforms called
    power transforms. The Box-Cox transform ${}^{2}$ is a configurable data transform
    method that supports both square root and log transform, as well as a suite of
    related transforms.


    More than that, it can be configured to evaluate a suite of transforms automatically
    and select a best fit. It can be thought of as a power tool to iron out power-based
    change in your time series. The resulting series may be more linear and the resulting
    distribution more Gaussian or Uniform, depending on the underlying process that
    generated it. The `scipy.stats` library provides an implementation of the Box-Cox
    transform. The `boxcox()` function ${}^{3}$ takes an argument, called `lambda`,
    that controls the type of transform to perform. Below are some common values for
    `lambda`:


    +   - `lambda = -1.0` is a reciprocal transform.

    - `lambda = -0.5` is a reciprocal square root transform.

    - `lambda = 0.0` is a log transform.

    - `lambda = 0.5` is a square root transform.

    - `lambda = 1.0` is no transform.


    For example, we can perform a log transform using the `boxcox()` function as follows:


    ```

    ```

    # manually box-cox transform a time series

    from pandas import read_csv

    from pandas import DataFrame

    from scipy.stats import boxcox

    from matplotlib import pyplot

    series = read_csv(''airline-passengers.csv'', header=0, index_col=0, parse_dates=True,
    squeeze=True)

    dataframe = DataFrame(series.values)

    dataframe.columns = [''passengers'']

    dataframe[''passengers''] = boxcox(dataframe[''passengers''], lambda=0.0)

    pyplot.figure(1)

    # line plot

    pyplot.subplot(211)

    pyplot.plot(dataframe[''passengers''])

    # histogram

    pyplot.subplot(212)

    pyplot.hist(dataframe[''passengers''])

    pyplot.show()

    ```

    ```


    Listing 8.8: Box-Cox transform of the Airline Passengers dataset.


    Running the example reproduces the log transform from the previous section.


    > ${}^{2} \ https://en.wikipedia.org/wiki/Power_transform#Box.E2.80.93Cox_transformation

    ${}^{3} \ https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.boxcox.html'
  merge: -1
