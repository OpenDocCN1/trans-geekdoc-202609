- pgno: 117
  md: '# # Chapter 12


    # # Decompose Time Series Data


    Time series decomposition involves thinking of a series as a combination of level,
    trend, seasonality, and noise components. Decomposition provides a useful abstract
    model for thinking about time series generally and for better understanding problems
    during time series analysis and forecasting. In this tutorial, you will discover
    time series decomposition and how to automatically split a time series into its
    components with Python. After completing this tutorial, you will know:


    +   - The time series decomposition method of analysis and how it can help with
    forecasting.

    - How to automatically decompose time series data in Python.

    - How to decompose additive and multiplicative time series problems and plot the
    results.


    Let''s get started.


    # ## 12.1 Time Series Components


    A useful abstraction for selecting forecasting methods is to break a time series
    down into systematic and unsystematic components.


    +   - **Systematic:** Components of the time series that have consistency or recurrence
    and can be described and modeled.

    - **Non-Systematic:** Components of the time series that cannot be directly modeled.


    A given time series is thought to consist of three systematic components including
    level, trend, seasonality, and one non-systematic component called noise. These
    components are defined as follows:


    +   - **Level:** The average value in the series.

    - **Trend:** The increasing or decreasing value in the series.

    - **Seasonality:** The repeating short-term cycle in the series.

    - **Noise:** The random variation in the series.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# # 12.2 Combining Time Series Components


    A series is thought to be an aggregate or combination of these four components.
    All series have a level and noise. The trend and seasonality components are optional.
    It is helpful to think of the components as combining either additively or multiplicatively.


    # ## 12.2.1 Additive Model


    An additive model suggests that the components are added together as follows:


    ```

    $$y(t)=Level+Trend+Seasonality+Noise\tag{12.1}$$

    ```


    An additive model is linear where changes over time are consistently made by the
    same amount. A linear trend is a straight line. A linear seasonality has the same
    frequency (width of cycles) and amplitude (height of cycles).


    # ## 12.2.2 Multiplicative Model


    A multiplicative model suggests that the components are multiplied together as
    follows:


    ```

    $$y(t)=Level\times Trend\times Seasonality\times Noise\tag{12.2}$$

    ```


    A multiplicative model is nonlinear, such as quadratic or exponential. Changes
    increase or decrease over time. A nonlinear trend is a curved line. A nonlinear
    seasonality has an increasing or decreasing frequency and/or amplitude over time.


    # # 12.3 Decomposition as a Tool


    This is a useful abstraction. Decomposition is primarily used for time series
    analysis, and as an analysis tool it can be used to inform forecasting models
    on your problem. It provides a structured way of thinking about a time series
    forecasting problem, both generally in terms of modeling complexity and specifically
    in terms of how to best capture each of these components in a given model.


    Each of these components are something you may need to think about and address
    during data preparation, model selection, and model tuning. You may address it
    explicitly in terms of modeling the trend and subtracting it from your data, or
    implicitly by providing enough history for an algorithm to model a trend if it
    may exist. You may or may not be able to cleanly or perfectly break down your
    specific time series as an additive or multiplicative model.


    Real-world problems are messy and noisy. There may be additive and multiplicative
    components. There may be an increasing trend followed by a decreasing trend. There
    may be non-repeating cycles mixed in with the repeating seasonality components.
    Nevertheless, these abstract models provide a simple framework that you can use
    to analyze your data and explore ways to think about and forecast your problem.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# ## 12.4 Automatic Time Series Decomposition


    There are methods to automatically decompose a time series. The Statsmodels library
    provides an implementation of the naive, or classical, decomposition method in
    a function called seasonal\_decompose(). It requires that you specify whether
    the model is additive or multiplicative.


    Both will produce a result and you must be careful to be critical when interpreting
    the result. A review of a plot of the time series and some summary statistics
    can often be a good start to get an idea of whether your time series problem looks
    additive or multiplicative. The seasonal\_decompose() function returns a result
    object. The result object contains arrays to access four pieces of data from the
    decomposition.


    For example, the snippet below shows how to decompose a series into trend, seasonal,
    and residual components assuming an additive model. The result object provides
    access to the trend and seasonal series as arrays. It also provides access to
    the residuals, which are the time series after the trend, and seasonal components
    are removed. Finally, the original or observed data is also stored.


    ```

    ```

    from statsmodels.tsa.seasonal import seasonal_decompose

    series = ...

    result = seasonal_decompose(series, model=''additive'')

    print(result.trend)

    print(result.seasonal)

    print(result.resid)

    print(result.observed)

    ```

    ```


    Listing 12.1: Example of decomposing a time series.


    These four time series can be plotted directly from the result object by calling
    the plot() function. For example:


    ```

    ```

    from statsmodels.tsa.seasonal import seasonal_decompose

    from matplotlib import pyplot

    series = ...

    result = seasonal_decompose(series, model=''additive'')

    result.plot()

    pyplot.show()

    ```

    ```


    Listing 12.2: Example of plotting a decomposed time series.


    Let''s look at some examples.


    # ### 12.4.1 Additive Decomposition


    We can create a time series comprised of a linearly increasing trend from 1 to
    99 and some random noise and decompose it as an additive model. Because the time
    series was contrived and was provided as an array of numbers, we must specify
    the frequency of the observations (the freq=1 argument). If a Pandas Series object
    is provided, this argument is not required.


    ```

    ```

    # additive decompose a contrived additive time series

    from random import randrange

    from matplotlib import pyplot

    ```

    ```'
