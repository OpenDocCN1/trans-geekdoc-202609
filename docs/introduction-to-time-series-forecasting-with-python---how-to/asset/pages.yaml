  md: '# ## Chapter 34

    ## Further Reading


    This is just the beginning of your journey with time series forecasting with Python.
    As you start to work on methods or expand your existing knowledge of algorithms
    you may need help. This chapter points out some of the best sources of help.


    # ### 34.1 Applied Time Series


    There are a wealth of good books on applied time series suitable for the machine
    learning perspective. Most are focused on time series using the R platform. Nevertheless,
    even though the code is not directly usable, the concepts, methods and descriptions
    are still valuable. This section lists some useful books on applied time series
    that you may consider.


    +   * Rob J. Hyndman and George Athanassopoulos, *Forecasting: principles and
    practice*, 2013. `http://amzn.to/211n93c`

    * Galit Shmueli and Kenneth Lichtendahl, *Practical Time Series Forecasting with
    R: A Hands-On Guide*, 2016. `http://amzn.to/2k3QpuV`

    * Paul S. P. Cowpertwait and Andrew V. Metcalfe *Introductory Time Series with
    R*, 2009. `http://amzn.to/2kIQscS`


    # ### 34.2 Time Series


    There are a ton of textbooks on time series analysis and forecasting. Most are
    intended for undergraduate and postgraduate courses, requiring knowledge of statistics,
    calculus and probability. If I were to choose one, it would be the seminal book
    on the topic by the developers of the Box-Jenkins method:


    +   * George E. P. Box, Gwilym M. Jenkins, et. al., *Time Series Analysis: Forecasting
    and Control*, 2015. `http://amzn.to/2kIPc9j`'
