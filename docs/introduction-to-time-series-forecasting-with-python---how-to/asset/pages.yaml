    # ## 17.2 Mean Forecast Error (or Forecast Bias)


    Mean forecast error is calculated as the average of the forecast error values.


    ```

    $mean\_forecast\_error = mean(\{ forecast\_error \}) \quad \quad \quad (17.2)$

    ```


    Forecast errors can be positive and negative. This means that when the average
    of these values is calculated, an ideal mean forecast error would be zero. A mean
    forecast error value other than zero suggests a tendency of the model to over
    forecast (negative error) or under forecast (positive error). As such, the mean
    forecast error is also called the forecast bias. The forecast error can be calculated
    directly as the mean of the forecast values. The example below demonstrates how
    the mean of the forecast errors can be calculated manually.


    ```

    # calculate mean forecast error

    expected = [0.0, 0.5, 0.0, 0.5, 0.0]

    predictions = [0.2, 0.4, 0.1, 0.6, 0.2]

    forecast\_errors = [expected[i]-predictions[i] for i in range(len(expected))]

    bias = sum(forecast\_errors) * 1.0/len(expected)

    print( ''Bias: %f '' % bias )

    ```


    Listing 17.3: Example of calculating mean forecast error.


    Running the example prints the mean forecast error, also known as the forecast
    bias. In this case the result is negative, meaning that we have over forecast.


    ```

    Bias: -0.100000

    ```


    Listing 17.4: Example output of calculating mean forecast error.


    The units of the forecast bias are the same as the units of the predictions. A
    forecast bias of zero, or a very small number near zero, shows an unbiased model.


    # ## 17.3 Mean Absolute Error


    The mean absolute error, or MAE, is calculated as the average of the forecast
    error values, where all of the forecast values are forced to be positive. Forcing
    values to be positive is called making them absolute. This is signified by the
    absolute function `abs( )` or shown mathematically as two pipe characters around
    the value: |value|.


    ```

    $mean\_absolute\_error = mean(\{ abs(\{ forecast\_error \}) \}) \quad \quad (17.3)$

    ```'
