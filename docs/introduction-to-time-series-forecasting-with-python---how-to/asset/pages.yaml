    # 31.6.2 Grid Search ARIMA Hyperparameters


    The ACF and PACF plots suggest that we cannot do better than a persistence model
    on this dataset. To confirm this analysis, we can grid search a suite of ARIMA
    hyperparameters and check that no models result in better out-of-sample RMSE performance.
    In this section, we will search values of p, d, and q for combinations (skipping
    those that fail to converge), and find the combination that results in the best
    performance. We will use a grid search to explore all combinations in a subset
    of integer values. Specifically, we will search all combinations of the following
    parameters:


    +   -   p: 0 to 4.

    -   d: 0 to 2.

    -   q: 0 to 4.


