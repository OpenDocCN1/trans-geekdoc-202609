  md: '# # Chapter 28


    # # Forecast Confidence Intervals


    Time series forecast models can both make predictions and provide a confidence
    interval for those predictions. Confidence intervals provide an upper and lower
    expectation for the real observation. These can be useful for assessing the range
    of real possible outcomes for a prediction and for better understanding the skill
    of the model In this tutorial, you will discover how to calculate and interpret
    confidence intervals for time series forecasts with Python.


    Specifically, you will learn:


    +   - How to make a forecast with an ARIMA model and gather forecast diagnostic
    information.

    - How to interpret a confidence interval for a forecast and configure different
    intervals.

    - How to plot the confidence interval in the context of recent observations.


    Let’s dive in.


    # ## 28.1 ARIMA Forecast


    The ARIMA implementation in the Statsmodels Python library can be used to fit
    an ARIMA model. It returns an **ARIMAResults** object. This object provides the
    *forecast*() function that can be used to make predictions about future time steps
    and default to predicting the value at the next time step after the end of the
    training data. Assuming we are predicting just the next time step, the *forecast*()
    method returns three values:


    +   - **Forecast**. The forecasted value in the units of the training time series.

    - **Standard error**. The standard error for the model.

    - **Confidence interval**. The *95%* confidence interval for the forecast.


    In this tutorial, we will better understand the confidence interval provided with
    an ARIMA forecast. Before we dive in, let’s first look at the Daily Female Births
    dataset that we will use as the context for this tutorial.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# 28.2 Daily Female Births Dataset


    In this lesson, we will use the Daily Female Births Dataset as an example. This
    dataset describes the number of daily female births in California in 1959. You
    can learn more about the dataset in Appendix A.4. Place the dataset in your current
    working directory with the filename **daily-total-female-births.csv**.


    # 28.3 Forecast Confidence Interval


    In this section, we will train an ARIMA model, use it to make a prediction, and
    inspect the confidence interval. First, we will split the training dataset into
    a training and test dataset. Almost all observations will be used for training
    and we will hold back the last single observation as a test dataset for which
    we will make a prediction.


    An ARIMA(5,1,1) model is trained. This is not the optimal model for this problem,
    just a good model for demonstration purposes. The trained model is then used to
    make a prediction by calling the **forecast()** function. The results of the forecast
    are then printed. The complete example is listed below.


    ```

    ```python

    # summarize the confidence interval on an ARIMA forecast

    from pandas import read_csv

    from statsmodels.tsa.arima_model import ARIMA

    # load dataset

    series = read_csv(''daily-total-female-births.csv'', header=0, index_col=0, parse_dates=True,
    squeeze=True)

    # split into train and test sets

    X = series.values

    X = X.astype(''float32'')

    size = len(X) - 1

    train, test = X[0:size], X[size:]

    # fit an ARIMA model

    model = ARIMA(train, order=(5,1,1))

    model_fit = model.fit(disp=False)

    # forecast

    forecast, stderr, conf = model_fit.forecast()

    # summarize forecast and confidence intervals

    print(''Expected: %.3f'' % test[0])

    print(''Forecast: %.3f'' % forecast)

    print(''Standard Error: %.3f'' % stderr)

    print(''95%% Confidence Interval: %.3f to %.3f'' % (conf[0][0], conf[0][1]))

    ```

    ```


    **Listing 28.1: Calculate the confidence interval of a forecast on the Daily Female
    Births dataset.**


    Running the example prints the expected value from the test set followed by the
    predicted value, standard error, and confidence interval for the forecast.


    ```

    ```text

    Expected: 50.000

    Forecast: 45.878

    Standard Error: 6.996

    95% Confidence Interval: 32.167 to 59.590

    ```

    ```


    **Listing 28.2: Example ARIMA forecast and confidence interval on the Daily Female
    Births dataset.**'
