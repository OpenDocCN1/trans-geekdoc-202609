- pgno: 290
  md: "function to transform the data:\n\n$\\quad transform = log(x)$, IF $lambda\
    \ = 0$ \n $\\quad transform = \\frac{x^{lambda} - 1}{lambda}$, IF $lambda \\neq\
    \ 0$\n\n(30.1)\n\nThis transform function can be reversed directly, as follows:\n\
    \n$\\quad x = exp(transform)$, IF $lambda = 0$ \n $\\quad x = exp(\\frac{log(lambda\
    \ \\times transform + 1)}{lambda})$, IF $lambda \\neq 0$\n\n(30.2)\n\nThis inverse\
    \ Box-Cox transform function can be implemented in Python as follows:\n\n```\n\
    ```python\n# invert Box-Cox transform\nfrom math import log\nfrom math import\
    \ exp\ndef boxcox_inverse(value, lam):\n    if lam == 0:\n        return exp(value)\n\
    \    return exp(log(lam * value + 1) / lam)\n```\n\nListing 30.24: Function to\
    \ invert the Box-Cox transform.\n```\n\nWe can re-evaluate the **ARIMA(0,1,2)**\
    \ model with the Box-Cox transform. This involves first transforming the history\
    \ prior to fitting the ARIMA model, then inverting the transform on the prediction\
    \ before storing it for later comparison with the expected values. The **boxcox()**\
    \ function can fail. In practice, I have seen this and it appears to be signaled\
    \ by a returned **lambda** value of less than -5. By convention, **lambda** values\
    \ are evaluated between -5 and 5.\n\nA check is added for a **lambda** value less\
    \ than -5, and if this the case, a **lambda** value of 1 is assumed and the raw\
    \ history is used to fit the model. A **lambda** value of 1 is the same as **no-transform**\
    \ and therefore the inverse transform has no effect. The complete example is listed\
    \ below.\n\n```\n```python\n# evaluate ARIMA models with box-cox transformed time\
    \ series\nfrom pandas import read_csv\nfrom sklearn.metrics import mean_squared_error\n\
    from statsmodels.tsa.arima_model import ARIMA\nfrom math import sqrt\nfrom math\
    \ import log\nfrom math import exp\nfrom scipy.stats import boxcox\n\n# invert\
    \ box-cox transform\ndef boxcox_inverse(value, lam):\n    if lam == 0:\n     \
    \   return exp(value)\n    return exp(log(lam * value + 1) / lam)\n\n# load data\n\
    series = read_csv('dataset.csv', header=None, index_col=0, parse_dates=True, squeeze=True)\n\
    # prepare data\nX = series.values\nX = X.astype('float32')\ntrain_size = int(len(X)\
    \ * 0.50)\n```\n\n```"
