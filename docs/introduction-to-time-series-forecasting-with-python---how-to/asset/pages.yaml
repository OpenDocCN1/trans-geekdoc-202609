    # Performance Measure


    The observations are a count of robberies. We will evaluate the performance of
    predictions using the root mean squared error (RMSE). This will give more weight
    to predictions that are grossly wrong and will have the same units as the original
    data. Any transforms to the data must be reversed before the RMSE is calculated
    and reported to make the performance between different methods directly comparable.


    We can calculate the RMSE using the helper function from the scikit-learn library
    mean_squared_error() that calculates the mean squared error between a list of
    expected values (the test set) and the list of predictions. We can then take the
    square root of this value to give us an RMSE score. For example:


    ```

    from sklearn.metrics import mean_squared_error

    from math import sqrt

    ...

