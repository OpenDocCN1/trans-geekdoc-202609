    # 用于预测计算机应用硕士（MCA）专业学生表现的机器学习算法实现


    Dipti Verma

    MCA 部门，

    DYPCAM

    浦买，印度

    dipti.vasudev@gmail.com


    K. Nirmala

    MCA 部门，

    DYPCAM

    浦买，印度

    skita_nirmala@rediffmail.com


    摘要— 机器学习（ML）正通过其创新积极地夺回每个领域和行业。机器学习在教学方面的能力不断扩大，并在以所有可能的方式帮助所有人方面达到了极高度。它能够产生强有力的结果，并对对已在各个领域成功实施的机器学习算法进行预测。教育领域并非没有机器学习的广阔自由空间，因此本文中实现了该算法以预测学生的表现。基于机器学习算法收集的不同数据，仔细选择了恰当且合适的模型，从而可以为性能的提升制定计划。


    Ciolacu, Ali Fallah Tohani, Leon Binder 和 Mujahid Svasta 关注带有智能设备、某些传感器和可穿戴设备的人工智能教育系统，用于自结构学习。应用于机器学习的教育
    4.0 方法的初步结果。Amandeep Kaur、Nitin Umesh、Barinder Singh 撰写的名为《分析学生过去历史数据并预测学生学术表现》的论文，重点在于通过考虑个人、经济、社会、文化、学校环境等不同因素，通过这些方法的结果来预测学术表现。


    **关键词**— 机器学习，MCA 专业，线性回归，逻辑回归，决策树


    # I 引言


    机器学习已成功应用于银行、保险、零售、股票交易所和美国交易所等许多领域。本文展示了机器学习算法的实现，用于预测学生的表现。结果已成功实施，并在此进行讨论。在这个学生的真实性在其职业中起着重要作用的时代，机器学习可以被证明是预测的一个方向；并利用这种方法从学生的才华中提取最大的价值。


    # II 文献综述


    在 Alexander J. Jameson 和 Mary L. Simpton 撰写的研究论文《使用机器学习评估计算机教育中的干预》中，重点关注了表现水平的有效性。在这篇研究论文中，通过查询标记来考虑构建预测模型。


    - 1) 观察了机器学习算法对过程级信息的影响。

    - 2) 建立了用于预测结果的机器学习技术类型结果。


    在 Monica 撰写的研究论文《教育 4.0 - 人工智能辅助教育：利用机器学习早期识别以支持学生成功》中


    # III. 方法正则化


    机器学习是使系统变得智能的科学。机器学习可以说，在成功实施和准确预测结果方面，它改善了人类的生活 [1]。


    机器学习是根据我们从未察觉到的情况使你的事物变得智能的艺术。我们的系统可以根据数据对新问题做出响应。数据被分为训练集、测试集和结果，随后对这些结果进行比较、分析并生成新结果。机器学习几乎涵盖所有领域，教育领域也是如此。如今，教学已成为一种挑战。学生越聪明，情况越好。课堂互动性越高，因此机器学习存在巨大的差距。其中一些列举如下：


    - 自适应学习

    - 预测分析

    - 预测结果

    - 录取预测和纠正措施

    - 针对学生的个性化学习

    - 自动评分系统

    - 预防原因

    - 教师对弱势学生的支持


    # IV AI 的最新趋势


    人工智能和机器学习被发现在许多领域被采纳和实施，包括：


    - i) 关注自学学习的强化学习。

    - ii) 用于解决刑事案件和失踪人员的人脸识别，

    - iii) 情感判断，

    - iv) 识别手写体，

    - v) 计算机视觉，

    - vi) 语音识别，

    - vii) 语音的识别和判断，

    - viii) 解决欺诈和故障案件。

    - ix) 医疗和健康领域

    - x) 学术和教育领域在 AI 中没有多少探索。


    ![](img/f9fc79b70a40bda2ea9ebd5e4dfbc65c_1_0.png)


    # V 问题陈述与研究意义


    研究目标是展示“机器学习技术是否有利于提高 MCA 学生的表现”。


    通过正确和适当的方法确保学生的技能至关重要。及时分享结果将为学生提供机会。因此，实施、测试并检查了机器学习算法，以确定适用于学生表现的最佳算法。


    机器学习的预测和预测将帮助机构在大学考试之前采取纠正措施，并在学习中指导引导学生。


    # VI 目标与假设


    - 通过早期预测结果来提高 MCA 学生的表现。

    - 通过机器学习模型指导并增强学生对表现的意识。


    根据收集的数据，我能够预测以下内容：


    在 HSC、SSC 和数量上得分较高的学生更有可能在 MCA 中获得良好的表现。根据收集的数据得出了以下假设：

    H0: 机器学习技术得分的学生无助于提高 MCA 课程中学生的成绩。

    H1: 机器学习技术有助于提高 MCA 课程中学生的成绩。


    # VII 目标与假设


    此处执行研究的研究设计如下图所示。基本上，研究中使用的不同模块以逻辑方式排列，以便对研究项目进行有效的论点说明；它组织了数据收集、实验和分析的设计。


    # 抽样方法-分层抽样与便利抽样


    数据收集-如抽样方法所述，使用了分层抽样和便利抽样技术，研究工作的数据从大学学生中收集。它包含了第一批 MCA 学生的记录，包括他们的 SSC、HSC、毕业、CET
    最终分补考数据，并通过 Excel 集合收集数据。


    # VIII 不同机器学习的实现


    ## A. 线性回归


    线性回归是使系统变得智能的科学。机器学习可以说，在成功实施和准确预测结果方面，它改善了人类的生活 [1]。


    机器学习是根据我们从未察觉到的情况使你的事物变得智能的艺术。我们的系统可以根据数据对新问题做出响应。数据被分为训练集、测试集和结果，随后对这些结果进行比较、分析并生成新结果。机器学习几乎涵盖所有领域，教育领域也是如此。如今，教学已成为一种挑战。学生越聪明，情况越好。课堂互动性越高，因此机器学习存在巨大的差距。其中一些列举如下：


    - 自适应学习

    - 预测分析

    - 预测结果

    - 录取预测和纠正措施

    - 针对学生的个性化学习

    - 自动评分系统

    - 预防原因

    - 教师对弱势学生的支持


    ## B. 逻辑回归


    逻辑回归通过概率衡量变量与一个或多个独立特征之间的关系。


    $f(x)=1/(1+e^{-x})$


    ![](img/f9fc79b70a40bda2ea9ebd5e4dfbc65c_2_0.png)


    图 1：线性线的绘图


    ## C. 决策树算法


    决策树（DT）被认为是分类中广泛使用的机器学习算法之一。决策树运行像一棵倒立的树，其中每个节点代表一个预测（特征），每个叶子节点代表一个结果（响应变量）。DT
    用于根据 IF-THEN 规则树来决定特定值可以被接受还是拒绝。


    ![](img/f9fc79b70a40bda2ea9ebd5e4dfbc65c_2_1.png)


    图 2：决策树


    ## I. 数据收集与整合


    收集工作完成了实时数据采集。数据包含 53 名学生。数据包括姓名、性别、电子邮件 ID、SSC 分数、HSC 分数、毕业分数、MCA 分数、补考详情、背景数量。数据已在
    Excel 文件中汇总。数据快照如下所示。


    ![](img/f9fc79b70a40bda2ea9ebd5e4dfbc65c_2_2.png)


    图 3：Excel 格式的数据集


    ## II. 方法论


    该研究旨在找出 MCA 最终成绩与学生之前的 SSC、HSC 和毕业成绩之间的关系。通过实施不同的算法检查模型的准确性。


