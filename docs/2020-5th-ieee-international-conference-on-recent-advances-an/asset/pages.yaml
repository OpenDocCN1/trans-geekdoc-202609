    # ## B. Logistic Regression


    Logistic regression measures the relationship between the dependent feature and
    one or more independent features by estimating probabilities utilizing logistic
    function [31].


    $f(x)=1/(1+e^{-x})$


    After Linear Regression does not give result Logistic regression model was implemented
    for predicted the MCA final of student algorithm implemented in open source. The
    probability predicted by logistic classifier of the student learned, which were
    important to calculate the probability of student getting good score.


    The data was divided into 80:20 ratio for training and testing the model. The
    model was trained on 80% of data, testing of model is done on 20% of data. The
    result received by implementing logistic regression model was not satisfactory
    and this was tested on testing data. This was proved by implementing confusion
    matrix.


    # ## C. Decision Tree Algorithm


    Decision Tree (DT) is considered to be one of widely used Machine Learning algorithms
    in classification. A Decision Tree works like an inverted tree, wherein each node
    represents a predictor (feature), and each leaf node represents an outcome (response
    variable). DT is used to take a decision that a specific value can be accepted
    or rejected given tree in form of IF-THEN rules. A smart and intelligent system
    is built using Decision Tree, pvalue received after implementing the DT was significantly
    low and this was tested successfully on testing data. Figure 2 shows the tree
    received after implementing DT. Data training, dataset is done successfully on
    data set.


    ![](img/f9fc79b70a40bda2ea9ebd5e4dfbc65c_2_1.png)


    Fig. 2: Decision Tree


