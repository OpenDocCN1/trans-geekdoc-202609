    # Pandas


    Pandas provide highly intuitive and user-friendly high-level data structures.
    "Pandas" has achieved popularity in the machine learning algorithm developer community,
    with built-in techniques for data aggregation, grouping, and filtering as well
    as results of time series analysis. The Pandas library has two primary structures:
    one-dimensional "Series" and two-dimensional "Data Frames."


    Some of the key features provided by “Pandas” are listed below:


    +   - A quick and effective "Data Frame object" with embedded indexing to be used
    in data manipulation activities.

    +   - Tools to read and write data between internal memory data structures and
    multiple file formats, such as "CSV" and text, "Microsoft Excel," "SQL databases,"
    and quick "HDF5 format".

    +   - Intelligent data alignment and integrated management of incomplete data
    by achieving automatic label driven computational alignment and readily manipulating
    unorganized data into an orderly manner.

    +   - Flexible reconstructing and pivoting of datasets.

    +   - Smart label-based slicing and indexing of big data sets, as well as the
    creation of data subsets.'
