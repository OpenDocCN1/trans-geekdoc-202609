    使用压缩格式时，可以将我们的数据从几千兆字节减少到几百兆字节，而不是几千兆字节，并可以实现向其他服务器或云计算更轻松的传输过程，以便进行算法的长时间运行。如果您想处理这种情况，那么处理
    .npz 文件格式将是这种情况下的最佳选择，并且它将确保对原生 NumPy 文件格式压缩版本提供正确的支持。


