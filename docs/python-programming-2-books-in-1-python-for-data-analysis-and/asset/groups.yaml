    it easier, and we will use the pip, which is the package installer for Python.
    This will make it easier to get things done and will ensure that the NumPy library
    is going to work on any computer that you would like. We can then talk about some
    of the basics of working with NumPy later on, so we see why this library is such
    an important one to work with.


    ### Installing NumPy on a Mac OS


    The first operating system that we will look at is how to install the NumPy on
    our Mac computers. We can do this with several different Python versions, and
    the steps are similar to one another to make things easier. To start, we need
    to open up the terminal on your computer. In addition, you get that open, type
    in python to get the prompt for this language to open for you. When you get to
    this part, follow the steps below to help get it going:


    - 1. We want to press on Command and then the Space Bar. This will help us to
    open up the spotlight search. Type in the word "Terminal" before pressing on entering.

    - 2. This should bring up the terminal that we want to use. We can then use the
    command of pip in order to install the NumPy package. This requires the coding
    of “pip install numpy” to get going.

    - 3. Once you have gotten a successful install, you can type in python to this
    again to get that python prompt. You should check to see which version of python
    is displayed there. You can then choose to use your command of import in order
    to include the package of NumPy and use it in any codes that you would like in
    the future.


    That method works the best with Python 2.7. You can also go through and install
    the NumPy package on Python 3. This is going to be similar. However, when you
    are done opening the terminal that we detailed in the first step above, you would
    use the pip3 command in order to install NumPy. Notice that we are going to work
    with pip3 rather than pip from before. Otherwise, the steps are going to be the
    same.


    ### Installing NumPy on a Windows System


    It is important to remember that the Python language is not going to be on the
    Windows operating system by default, so we need to go through and do the installation
    on our own to use it. You can go to www.python.org and find the version that you
    want to use. Follow the steps that are there in order to get Python ready to go
    on your own computer. Once you have been able to get Python installed successfully,
    you can then open up the command prompt that is on your computer and use pip in
    order to install the NumPy library.


    ### Installing NumPy on the Ubuntu Operating Systems


    Ubuntu and some of the Linux distributions may not be as common and as popular
    to work with as some of the other options out there, but they can still do many
    amazing things when it comes to helping us get our work done. It is a good option
    to use for things like hacking, machine learning, and data analysis, and it is
    known to work well with the Python language.


    You will find that similar to the Mac operating system, Python is going to already
    be installed on this kind of computer. However, there is a problem because the
    pip is not going to be installed. If you would like to have the complete package
    to get this work done, download this from www.python.org, and then get it installed
    on your operating system using the apt install command to get this done.


    In addition, there is an alternative manner to get this done. You can work with
    the install pip command on ubuntu and then install NumPy. This is often the better
    of the two ways to do it because it is simple and just needs a few commands. Keep
    in mind with this one that you have to have the root privileges on your system
    to help install pip and NumPy, or it will not work.


    You can do all of this by opening up the terminal that is found in ubuntu and
    then install pip with the command of “pip3 using apt”. Once you have this pip
    installed on your computer, you can then go through and install NumPy with the
    same commands that you used in the other operating systems.


    ### Installing NumPy on Fedora


