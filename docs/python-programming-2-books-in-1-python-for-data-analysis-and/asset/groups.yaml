    ## Chapter 5: NumPy Package Installation


    Earlier, we took some time to look at the different libraries that come with the
    Python language, and the ones that will work the best with data analysis. With
    that in mind, it is time for us to start working with some of the steps to installing
    the most basic, but also important, the library is known as NumPy.


