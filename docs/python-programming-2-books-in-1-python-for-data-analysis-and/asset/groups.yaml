    ## Python Sets


    In Python, Sets are collections of data types that cannot be organized and indexed.
    Sets do not allow for duplicate items and must be written within curly brackets,
    as shown in the syntax below.


    ```python

    set = {"string1", "string2", "string3"}

    print(set)

    ```


    Unlike the Python List and Tuple, you cannot selectively display desired items
    from a Set by referencing the position of that item because the Python Set are
    not arranged in any order. Therefore, items do not have any indexing. However,
    the “for” loop can be used on Sets (more on this topic later in this chapter).


    Unlike Python Lists, you cannot directly **change the data values of Python Sets**
    after they have been created. However, you can use the “add()” method to add a
    single item to Set and use the “update()” method to one or more items to an already
    existing Set. Let''s look at the example below:


    ```python

    set = {"string1", "string2", "string3"}

    set.add("newstring")

    print(set)

    ```


    OUTPUT - {"string1", "string2", "string3", "newstring"}


    ```python

    set = {"string1", "string2", "string3"}

    set.update(["newstring1", "newstring2", "newstring3"])

    print(set)

    ```


    OUTPUT - {"string1", "string2", "string3", "newstring1", "newstring2", "newstring3"}


    You can also determine the **length** of a Python Set using the “len()” function,
    as shown in the example below:


    ```python

    set = {"string1", "string2", "string3", "string4", "string5", "string6",

    "string7"}

    print(len(set))

    ```


    OUTPUT - 7


    To selectively **delete a specific item from a Set**, the “remove()” method can
    be used as shown in the code below:


    ```python

    set = {"string1", "string2", "string3", "string4", "string5"}

    set.remove("string4")

    print(set)

    ```


    OUTPUT - {"string1", "string2", "string3", "string5"}


    You can also use the “discard()” method to delete specific items from a Set, as
    shown in the example below:


    ```python

    set = {"string1", "string2", "string3", "string4", "string5"}

    set.discard("string3")

    print(set)

    ```


    OUTPUT - {"string1", "string2", "string4", "string5"}


    The “pop()” method can be used to selectively delete only the last item of a Set.
    It must be noted here that since the Python Sets are unordered, any item that
    the system deems as the last item will be removed. As a result, the output of
    this method will be the item that has been removed.


    ```python

    set = {"string1", "string2", "string3", "string4", "string5"}

    A = set.pop()

    print(A)

    print(set)

    ```


    OUTPUT -

    "string2"

    {"string1", "string3", "string4", "string5"}


    To delete the entire Set, the “del” keyword can be used, as shown below.


    ```python

    set = {"string1", "string2", "string3", "string4", "string5"}

    del set

    print(set)

    ```


    OUTPUT - name ''set'' is not defined


    To delete all the items from the Set without deleting the variable itself, the
    “clear()” method can be used, as shown below.


    ```python

    set = {"string1", "string2", "string3", "string4", "string5"}

    set.clear()

    print(set)

    ```


    OUTPUT - set()


    You can **join multiple Sets** with the use of the “union()” method. The output
    of this method will be a new Set that contains all items from both the sets. You
    can also use the “update()” method to insert all the items from one set into another
    without creating a new Set.


    ```python

    Set1 = {"string1", "string2", "string3", "string4", "string5"}

    Set2 = {155, 255, 355, 455, 55}

    Set3 = Set1.union(Set2)

    print(Set3)

    ```


    OUTPUT - {"string1", 155, "string2", 255, "string3", 355, "string4", 455,

    "string5", 55}


    ```python

    Set1 = {"string1", "string2", "string3", "string4", "string5"}

    Set2 = {155, 255, 355, 455, 55}

    Set1.update(Set2)

    print(Set1)

    ```


    OUTPUT - {255, "string1", 155, "string4", 55, "string2", 355, "string3",

    455, "string5"}


    You can also use the “set()” constructor to create a Set, as shown in the example
    below:


    ```python

    Set1 = set(("string1", "string2", "string3", "string4", "string5"))

    print(Set1)

    ```


    OUTPUT - {"string3", "string5", "string2", "string4", "string1"}


