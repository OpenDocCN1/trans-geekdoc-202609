    - 2. 这应该会打开我们想要使用的终端。然后可以使用 pip 命令来安装 NumPy 包。需要输入代码“pip install numpy”来开始。

    - 3. 安装成功后，可以再次输入 python 来获取 Python 提示符。你应该查看显示的是哪个版本的 Python。然后可以选择使用 import
