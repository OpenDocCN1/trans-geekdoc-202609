    # Bar Chart


    The “bar” method can be used to generate a bar chart in matplotlib. These charts
    are not capable of auto calculating the occurrences of each category, so the “value_counts”
    function from the Pandas library needs to be used. Any set of categorical data
    lacking a wide variety of categories can be easily plotted using the bar chart.
    However, any data set containing more than 30 categories of data are too complicated
    to yield an easy to understand bar chart. The sample code below will allow creation
    of a bar chart from the “wine review” dataset using the “values_count” function.


    ```

    ```python

    "# creation of figure and axis

    fig, ax = plt.subplots ()

    # counting the occurrence of each class

    data = wine_reviews [''points''].value_counts()

    # getting x and y data

    points = data.index

    frequency = data.values

    # creation of bar chart

    ax.bar (points, frequency)

    # setting title and labels

    ax.set_title (''Wine Review Scores'')

    ```

    ```'
