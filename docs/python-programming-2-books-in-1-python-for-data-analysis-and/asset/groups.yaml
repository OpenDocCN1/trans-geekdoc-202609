    data analysis, you will find that you can use it in three different manners. These
    include:


    - 1. You can use it to convert a Python dictionary or list, or an array in NumPy
    to a data frame with the help of this library.

    - 2. You can use it to open up a local file with Pandas. This is usually going
    to be done in a CSV file, but it is also possible to do it in other options like
