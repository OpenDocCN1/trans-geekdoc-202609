    \ |\n\n## 第 3 章：使用 Python 进行数据可视化与分析\n\n### 大数据\n\n2001 年，Gartner 将大数据定义为“以不断增加的体量和越来越高的速度到达的、包含更多样性的数据”。这促成了“三个\
    \ V”的形成。大数据是指来自各种无穷数据源、不断涌现的结构化和非结构化数据的洪流。这些数据集规模庞大，无法使用传统分析工具和技术进行分析，但其下隐藏着大量有价值的洞察。\n\
    \n### 大数据的“Vs”\n\n**体量** – 要将给定数据集归类为大数据，其体量必须显著大于传统数据集。这些数据集主要由非结构化数据组成，仅包含有限的结构化和半结构化数据。非结构化数据或价值未知的数据可从网页、搜索历史记录、移动应用程序和社交媒体平台等输入源中收集。公司的规模和客户群通常与其获取的数据体量成正比。\n\
    \n**速度** – 数据被收集并采取行动的速度即为大数据的速度。公司越来越多地采用本地服务器与云服务器相结合的方式，以提高数据收集速度。现代“智能产品和设备”需要实时访问消费者数据，以便能够为其提供更具吸引力和更增强的用户体验。\n\
    \n**多样性** – 传统上，数据集主要包含结构化数据，非结构化和半结构化数据体量较小，但大数据的兴起催生了视频、文本、音频等新型非结构化数据类型，这些类型需要先进的工具和技术来清洗和处理，以便从中提取有意义的洞察。\n\
    \n**真实性** – 大数据分析中必须考虑的另一个“V”是真实性。这指的是数据的“可信度或质量”。例如，像“Facebook”和“Twitter”这样的社交媒体平台，其博客和帖子中包含话题标签、缩写以及各种输入错误，会显著降低数据集的可靠性和准确性。\n\
    \n**价值** – 数据已演变为一种具有内在价值的独立货币。就像传统货币一样，大数据的最终价值与从中获取的洞察成正比。\n\n> “大数据的重要性不在于你拥有多少数据，而在于你如何使用它。你可以从任何来源获取数据并进行分析，以找到能够实现\
    \ 1) 降低成本、2) 缩短时间、3) 新产品开发和优化产品、以及 4) 明智决策的答案。”\n> \n> - SAS\n\n### 大数据的运作方式\n\
    \n要从大数据中获得洞察，需要完成三项重要操作：\n\n**集成** – 传统的 ETL（提取、转换、加载）等数据集成方法无法整合来自大数据核心的各种不相关来源和应用程序的数据。需要先进的工具和技术来分析体量远大于传统数据集的大数据集。通过整合这些分散来源的大数据，公司能够分析并提取有价值的洞察，从而发展和维持业务。\n\
    \n**管理** – 大数据管理可定义为“对大量结构化和非结构化数据进行组织、管理和治理”。大数据需要高效且廉价的存储，这可以通过使用本地服务器、云服务器或两者的组合来实现。公司能够从世界任何地方无缝访问所需数据，然后按需使用所需的处理引擎处理这些数据。目标是确保数据质量高，并且所需的工具和应用程序可以轻松访问。大数据来自各种多样化的来源，包括社交媒体平台、搜索引擎历史记录和通话日志。大数据通常包含大量非结构化和半结构化数据，这些数据以多种格式存储。为了处理和存储这些复杂数据，公司需要比传统关系型数据库和数据仓库平台更强大、更先进的数据管理软件。\n\
    \n市场上已有能够将大数据与传统数据仓库系统结合的新平台，采用“逻辑数据仓库架构”。作为这一努力的一部分，公司需要决定哪些数据必须出于合规和监管目的而受到保护，哪些数据必须保留以供未来分析使用，哪些数据没有未来用途可以被处置。此过程称为“数据分类”，它允许对数据子集进行快速高效的分析，以便纳入公司的即时决策过程。\n\
    \n**分析** – 一旦大数据被收集且易于访问，就可以使用先进的分析工具和技术对其进行分析。此分析将提供有价值的洞察和可操作的信息。可以使用人工智能和机器学习算法探索大数据，以进行发现并开发数据模型。\n\
    \n### 大数据分析\n\n大数据和大数据分析这两个术语经常混用，因为大数据的固有目的就是为了被分析。“大数据分析”可定义为一组定性和定量方法，用于检查大量非结构化、结构化和半结构化数据，以发现数据模式和有价值的隐藏洞察。大数据分析是一门科学，通过使用机器学习算法和自动化分析技术分析大数据，收集指标、关键绩效指标以及容易在原始数据洪流中丢失的数据趋势。“大数据分析”所涉及的不同步骤如下：\n\
    \n**收集数据需求** – 了解为实现业务目标和宗旨需要收集哪些信息或数据非常重要。数据组织对于高效、准确的数据分析也至关重要。数据可以按性别、年龄、人口统计、位置、种族和收入等类别进行组织。还必须决定用于分析的所需数据类型（定性和定量）和数据值（可以是数值或字母数值）。\n\
    \n**收集数据** – 原始数据可以从社交媒体平台、计算机、摄像头、其他软件应用程序、公司网站甚至第三方数据提供商等不同来源收集。大数据分析本质上需要大量数据，其中大部分是非结构化数据，仅包含有限的结构化和半结构化数据。\n\
    \n**数据组织和分类** – 根据公司基础架构，数据组织可以在简单的 Excel 电子表格中完成，也可以使用许多能够处理统计数据的工具和应用程序。数据必须根据大数据分析流程第一步中收集的数据需求进行组织和分类。\n\
    \n**清洗数据** – 为了充分且快速地进行大数据分析，确保数据集没有冗余和错误非常重要。只有符合数据要求的完整数据集才能进入最终分析步骤。需要对数据进行预处理，以确保只分析高质量数据，并且公司资源得到合理利用。\n\
    \n> “大数据是高体量、高速度和/或高多样性的信息资产，要求具备成本效益的创新形式\n\n"
