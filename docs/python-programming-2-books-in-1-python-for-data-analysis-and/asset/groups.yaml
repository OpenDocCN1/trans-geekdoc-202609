    \n## 第1章：数据科学基础技术\n\n在技术领域，数据被定义为“由计算机处理和存储的信息”。我们的数字世界已用数据淹没了现实。从网站上的一次点击，到智能手机全天每秒都在追踪和记录我们的位置，我们的世界正被数据淹没。从这海量数据的深处，可以提取出解决我们尚未遇到的问题的方案。利用数学方程和统计学，从可度量的数据集中提取洞察的这一过程，可定义为“数据科学”。数据科学家的角色往往非常多样，常与计算机科学家和统计学家相混淆。本质上，任何愿意深入海量数据以获取信息的人或公司，都可以被称为数据科学从业者。例如，像沃尔玛这样的公司会跟踪和记录客户的店内和线上购买行为，以提供个性化的产品和服务推荐。像Facebook这样的社交媒体平台允许用户列出当前位置，通过分析用户本身提供的海量数据，能够识别全球迁徙模式。\n\
    \n“数据科学”一词最早的有记载使用可以追溯到1960年，并被归功于“彼得·瑙”，据称他将“数据科学”用作计算机科学的替代词，并最终引入了“数据学”这一术语。1974年，瑙出版了一本名为《计算机方法简明调查》的书，书中广泛使用了“数据科学”这一术语。1992年，在“第二届日法统计研讨会”上提出了数据科学的当代定义，承认了一门主要关注数据类型、维度和结构的新学科的出现。\n\
    \n> \"数据科学仍在不断发展，成为技术型专业人员最具前景且需求量大的职业道路之一。当今，成功的数据专业人士明白，他们必须超越分析大量数据、数据挖掘和编程技能等传统技能。\n\
    > \n> 为了为其组织挖掘有用情报，数据科学家必须掌握数据科学生命周期的完整范畴，并具备在流程的每个阶段最大化回报所需的灵活性和理解力。\"  \n> –\
    \ 加州大学伯克利分校\n\n商业高管日益增长的兴趣在很大程度上促成了“数据科学”这一术语近期的流行。然而，许多记者和学术专家并不承认数据科学是统计学领域之外的独立研究领域。同一社区内的一群人认为，数据科学是“数据挖掘”和“大数据”的通用说法。数据科学的定义在技术社区内一直存在争议。需要结合计算机编程技能、领域专业知识以及统计学和数学算法方面的专业技能，才能从大量原始数据中提取有价值的洞察，这一研究领域被称为数据科学。\n\
    \n## 数据科学生命周期\n\n对于结构化数据科学项目，最受推荐的生命周期是“团队数据科学流程”（TDSP）。该流程广泛用于需要基于人工智能和/或机器学习算法部署应用程序的项目。它也可以定制并用于执行“探索性数据科学”项目以及“临时分析”项目。TDSP生命周期被设计为敏捷且按顺序迭代的步骤，作为使用预测模型所需任务的指导。这些预测模型需要部署在公司的生产环境中，以便用于开发基于人工智能的应用程序。该数据科学生命周期的目标是高速交付和完成指向明确的参与终点的数据科学项目。任何数据科学项目的无缝执行都需要团队内部以及与利益相关者之间有效沟通任务。\n\
    \n“团队数据科学流程”的基本组成部分是：\n\n### 数据科学生命周期的定义\n\nTDSP生命周期中概述项目执行从开始到结束所需交互步骤的五个主要阶段是：“业务理解”、“数据获取与理解”、“建模”、“部署”和“客户验收。”\
    \ 请继续阅读，稍后将介绍详细信息！\n\n### 标准化项目结构\n\n为了使团队成员能够无缝、轻松地访问项目文档，从而实现信息的快速检索、模板的使用以及共享目录结构，这大有裨益。所有项目文档和项目代码都存储在“版本控制系统”中，例如“TFS”、“Git”或“Subversion”，以改进团队协作。业务需求及相关任务和功能存储在敏捷项目跟踪系统中，例如“JIRA”、“Rally”和“Azure\
    \ DevOps”，以便对每个功能的代码进行增强跟踪。这些工具还能帮助估算项目生命周期中涉及的资源和成本。为了确保每个项目的有效管理、信息安全和团队协作，TDSP赋予在版本控制系统中为每个项目创建单独存储。在组织内采用所有项目的标准化结构，有助于在整个组织中创建机构知识库。\n\
    \nTDSP生命周期在集中位置为所有所需文档以及文件夹结构提供标准模板。用于数据探索和功能提取的编程代码文件可以使用提供的文件夹结构进行组织，该结构还保存有关模型迭代的记录。这些模板使团队成员能够轻松了解他人已完成的工作，并能无缝添加新团队成员到给定项目。Markdown格式支持文档模板的轻松访问，以及编辑或更新。为了确保项目目标和目的定义明确，并确保交付物的预期质量，这些模板为每个项目提供包含重要问题的各种检查清单。例如，“项目章程”可用于记录项目范围以及项目正在解决的业务问题；标准化数据报告用于记录数据的“结构和统计”。\n\
    \n### 数据科学项目的基础设施和资源\n\n为了有效存储基础设施并管理共享分析，TDSP建议使用以下工具：“机器学习服务”、数据库、“大数据集群”和基于云的系统来存储数据集。容纳原始以及经过处理或清理的数据集的分析和存储基础设施可以是基于云的，也可以是本地部署的。这种分析和存储基础设施允许分析的可重复性，并防止数据重复和冗余，这些重复和冗余可能导致不一致和不必要的基础设施成本。提供了工具来授予对共享资源的特定权限并跟踪其活动，从而允许团队每个成员安全地访问资源。\n\
    \n### 项目执行的工具和实用程序\n\n在大多数组织中，对现有流程做任何更改往往都颇具挑战性。为了鼓励并提高对这些更改采纳的一致性，可以实施TDSP提供的若干工具。TDSP提供的工具可以轻松自动化数据科学生命周期中的一些基本任务，包括“数据探索”和“基准建模”。为了允许将共享工具和实用程序无烦恼地贡献到团队的“共享代码仓库”，TDSP提供了一个定义明确的结构。此举导致\n\
    \n"
