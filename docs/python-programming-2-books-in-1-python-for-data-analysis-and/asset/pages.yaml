  md: '# Chapter 2: Data Analysis


    Now that we have a bit of an understanding of the Python language and all that
    it entails, it is time for us to look at the main event of data analysis. Learning
    how to work with the Python language is great, but real-world applications are
    some of the best ways to learn a language and make it worth our time a bit more.
    Python works great with data analysis, so let us look at what data analysis is
    all about and how we can use it for some of our own needs.


    To start, data analysis is going to be the process of cleaning, inspecting, transforming,
    and modeling our data with the objective of finding some of the most useful information
    in it, coming to some sound conclusions, and then supporting the decision making
    the process of a company. This sounds like a lot for one process to handle, but
    when we use the right algorithms (supplied to us and run by Python). It is definitely
    possible.


    There are going to be a lot of different approaches and facets that come with
    our data analysis, and when we put it all together, we will be able to choose
    from a wide number of techniques to get it done. Often it depends on which method
    we like the most and what information we are hoping to get out of the process
    as well. If our goals are to learn about our customers and how they behave, the
    data analysis we will complete will be different from if we'
  merge: -1
  img_proc: true
- pgno: 19
