- pgno: 204
  md: 'There are three important actions required to gain insights from big data:


    **Integration** – The traditional data integration methods such as ETL (Extract,
    Transform, and Load) are incapable of collating data from a wide variety of unrelated
    sources and applications that are you at the heart of big data. Advanced tools
    and technologies are required to analyze big data sets that are exponentially
    larger than traditional data sets. By integrating big data from these disparate
    sources, companies are able to analyze and extract valuable insight to grow and
    maintain their businesses.


    **Management** – Big data management can be defined as “the organization, administration,
    and governance of large volumes of both structured and unstructured data.” Big
    data requires efficient and cheap storage, which can be accomplished using servers
    that are on-premises, cloud-based or a combination of both. Companies are able
    to seamlessly access required data from anywhere across the world and then processing
    this is a data using required processing engines on an as-needed basis. The goal
    is to make sure the quality of the data is high-level and can be accessed easily
    by the required tools and applications. Big data gathered from all kinds of Dale
    sources including social media platforms, search engine history and call logs.
    The big data usually contain large sets of unstructured data and the semi-structured
    data which are stored in a variety of formats. To be able to process and store
    this complicated data, companies require more powerful and advanced data management
    software beyond the traditional relational databases and data warehouse platforms.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'New platforms are available in the market that is capable of combining big
    data with the traditional data warehouse systems in a "logical data warehousing
    architecture." As part of this effort, companies are required to make decisions
    on what data must be secured for regulatory purposes and compliance, what data
    must be kept for future analytical purposes, and what data has no future use and
    can be disposed of. This process is called "data classification," which allows
    a rapid and efficient analysis of a subset of data to be included in the immediate
    decision-making process of the company.


    Analysis – Once the big data has been collected and is easily accessible, it can
    be analyzed using advanced analytical tools and technologies. This analysis will
    provide valuable insight and actionable information. Big data can be explored
