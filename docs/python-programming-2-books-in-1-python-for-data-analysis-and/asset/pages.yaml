    # Data Visualization with Scatter Plots


    A scatter plot can be defined as "a two-dimensional data visualization that uses
    dots to represent the values obtained for two different variables-one plotted
    along the x-axis and the other plotted along the y-axis." It is also known as
    “scatter graph” or "scatter chart." For instance, the "scatter plot" seen in the
    picture below depicts a fictional set of height and weight measures for children.
    Each "dot" in the plot is used to represent an individual, with measures of their
    height along the "x-axis" and weight along the "y-axis."


    ![](img/fe3427740784586362e0a35d3200b425_225_0.png)'
