    # Data Science Strategies


    Data science is mainly used in decision-making by making precise predictions with
    the use of “predictive causal analytics,” “prescriptive analytics,” and machine
    learning.


    Predictive causal analytics – The “predictive causal analytics” can be applied
    to develop a model that can accurately predict and forecast the likelihood of
    a particular event occurring in the future. For example, financial institutions
    use predictive causal analytics based tools to assess the likelihood of a customer
    defaulting on their credit card payments, by generating a model that can analyze
    the payment history of the customer with all of their borrowing institutions.


    Prescriptive analytics - The “prescriptive analytics” are widely used in the development
    of “intelligent tools and applications” that are capable of modifying and learning
    with dynamic parameters and make their own “decisions.” The tool not only predicts
    the occurrence of a future event but is also capable of providing recommendations
    on a variety of actions and its resulting outcomes. For example, the self-driving
    cars gather driving related data with every driving experience and use it to train
    themselves to make'
  merge: -1
  img_proc: true
