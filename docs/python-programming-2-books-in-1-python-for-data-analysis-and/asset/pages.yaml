  md: '# Chapter 4: Understanding the Data Analytics Process


    Now it is time for us to look a bit more into some of the mechanics that are there
    for a good data analysis. All of these need to be in place to ensure that the
    data analytics is going to work, that we get the right kind of data, and that
    we will be able to get all of it to flow together and do well. This is sometimes
    a difficult process to work with, but you will find that when we combine the parts
    and make sure that we understand how they work, it is easier to see what we need
    to do to get this done. With that in mind, let us look at the six main phases
    that come with data analysis and explore what we can do with each one.


    # The Discovery Phase


    This is a fun phase to work with because it can set the stage for the rest of
    the project that we need to work on. This part is all about figuring out what
    kind of data we need, what our goals are, and what we would actually like to figure
    out later on after the whole analysis is done. We do not want to take this part
    lightly, and it usually is not a good idea to just go and gather up a bunch of
    data without first figuring out what we need and what we want to do.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'We want to start out with a good idea of what the business wants to accomplish
    when they do this analysis. Do they want to figure out more about their customer
    base? Do they want to learn if there is a new niche, they can go into? Do they
    want to learn more about their competition and how they can utilize that information
    to get ahead? There are many reasons that companies want to use the data analysis,
    but if you do not have a plan in place ahead of time, then it is going to be a
    mess. You will waste time gathering up information, with no plan at all.


    When this is done, it is time for us to figure out which methods we will use for
    gathering up the data. Data analysis is going to be useless if we are not able
    to go through and discover the data that we want to use in our algorithms. The
    good news is that there are tons of places with data in our modern world, and
    we just need to do some research and figure out which ones are going to provide
    us with the data that we need.


    We can choose to spend some time on social media and see what people are saying
    to us or how they are interacting with us. We can send out surveys and do focus
    groups to learn a bit. We can do research online and on some websites to figure
    out what is going on there. We can look to our own websites and see what customers
    are buying and some of the demographics that match up there as well.


    There is no limit to the amount of information that we can gather, but we want
    to ensure that we are gathering up the right kind of information in the process.
    Just because you have many data at your disposal does not mean that you are going
    to use it well, or that it is even relevant to what you are'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'trying to be done. Take your time when it comes to gathering up that data and
    figure out what is important and what is not.


    # The Data Preparation Phase


    Once you have had some time to prepare for the information that you want, and
    to figure out what questions you would like to see solved in the process, it is
    time for us to go through and work with the phase of data preparation. At this
    point, we have a bunch of data from a bunch of different places and sources. This
    is a great thing. However, you will not have to search through the data very long
    to figure out that, it is a mess, and that there is some work for you to do to
    get it ready.


    If you try to push your data through the chosen algorithm in its current state,
    you are not going to get accurate information and results. The algorithm will
    be confused at what you are trying to do along the way. There will be missing
    values, incomplete entries, duplicates, outliers that can throw off the average,
    and more. Despite the extra work that is going to happen here, your algorithms
    require that the data you want to be interpreted is organized and prepared in
    the proper manner.


    There are a few things that we need to focus on in order to make this happen.
    First, we need to deal with outliers. These are going to be the points that are
    way far from the average and were just some once in a lifetime kind of things.
    If the majority of your customers are between the ages of 18 to 25, but you have
    a couple of customers who are 75, the older group can probably be ignored.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Those were likely individuals purchasing stuff for someone in the younger group.
    However, if you add them into the mix and put them through the algorithm, it is
    going to skew your results. You may, if you leave these outliers in there, start
    to think your age demographics are individuals 30 to 35 because the older group
    messed with things a bit and took the average too high.


    Now, this does not mean that we get rid of the outliers all of the time. Many
    times it does, but there are some situations where the outliers are going to tell
    us a lot of information in the process. If there are a decent number of outliers
    that fall in the same spot, this could be a goldmine, telling you of a new product
    or a new demographic that you could possibly reach. Maybe the average age of your
    customer is 18 to 25, but then you look and see there is a concentration of outliers
    in the 30 to 35 range. This may be something that you need to explore in more
    detail and then capitalize on.


    In addition to working with the outliers, we need to spend some time looking at
    the duplicate values. Sometimes especially since we are gathering data from many
    different sources, we are going to end up with some information that is duplicated.
    This is not a big deal if it is just a few sources. However, when we have many
    duplicates, it is going to mess with the results that you get. It is often best
    to reduce and even eliminate the duplicates to get the best results.


    In addition, the final thing that we need to focus on when it comes to our data
    preparation is to make sure that the missing values are taken care of. If you
    have a few missing values, then you can probably erase that part of the'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'data and be fine. However, many times, filling it in with the mean or the average
    of the other columns with it can be a good way to still use that information without
    getting error messages from your algorithm.


    # Planning Out the Model Phase


    Now it is time for us to move on to some model planning. This is where you and
    your team are going to start creating the model or the algorithms that you want
    to use in order to move this process along and ensure that it is going to work
    the way that you want. Based on the work that you did in the other two steps,
    the model that you choose to use is going to vary, and this is the stage where
    we figure out the best steps to take.


    During this part, the team is going to spend some time determining which workflow,
    techniques, and methods are going to be needed to help us later when we build
    up our model. We figure out how we can best use the data that we have been collecting
    all this time, and work from there. The team will also need to explore some of
    the data they have to learn more about the relationship that is there between
    the variables, and then they can select the variables that are the most important
    here.


    The reason that we are going to do this is that it helps us to figure out the
    models that are the most suitable to work with. When we know more about the variables,
    and we can find the pattern of the ones that are the most important to our needs,
    the model will lend itself to us pretty well. This can save us a lot of time and
    effort and can make sure that we do not have to work on a bunch of different models
    in the hopes that we will get the right one.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# The Model Building Phase


    The fourth phase that we are able to spend our time on is model building. This
    is going to be where we get to work figuring out how to make a model that can
    learn from the input it gets and will be able to sort through some of the data
    that we have as well. It is a great phase to work with and can be seen as some
    of the most fun as well.


    In this phase, your team is going to take time developing the sets of data that
    they want to use for testing, training, and for various production purposes for
    their algorithms as well. In addition, in this phase, the team builds and then
    executes the models based on some of the work that has been done in the previous
    phase as well.


    In addition, the team here is going to take the time to consider whether the tools
    that it already has will be enough to run the models. Sometimes they have the
    right tools and more to get it all done and other times they will need to go through
    and add in a more robust environment for executing their models and some of the
    workflows that they want to accomplish.


    # The Communication Phase


    Once you have had a chance to work on building your model and pushing the chosen
    data through it, it is time for us to look at some of the key insights and patterns
    that are there, and communicate them to others around us. This data analysis was
    likely done for some reason, usually to help a'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'company in the process, and the team who did this work must be able to help
    communicate this to the right people.


    Sometimes, this is going to be a challenge. The individuals in the company who
    order this analysis may recognize the importance of doing it and want to get the
    results. However, they may not understand all of the technical terms like a data
    analyst can. It is up to you and your team to communicate the results clearly
    and concisely to the audience.


    In this phase, the team, along with some of the major stakeholders in the company,
    are going to determine whether the results of the project are going to be a success
    or a failure based on some of the criteria that were set out in the first phase
    we talked about before. The team needs to be able to identify some of the key
    findings, quantify the business value of this, and then go through and develop
    a narrative to help convey and summarize the findings so everyone can understand
    and use them.


    There are a number of methods that can be used to help communicate the results.
    You can use visuals to help show it, along with some spreadsheets and reports.
    Think about your audience before you get started on this one to ensure that you
    are presenting the data in a manner that the other party will be able to use and
    understand.


    # Operationalize


    The final phase that we are going to look at here is to operationalize. This is
    where the team is going to take all of the work that we were able to handle'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'and look over in the other five steps, and then deliver it to those who need
    it. This includes the technical documents, codes, briefings, and all of the final
    reports as well.


    In addition, depending on the results of this, and what the suggestions and insights
    are all about, the company may decide to take this information and run a kind
