  md: '# Stage IV – Deployment


    The goal of this stage is to release the solution models to a lower production
    like environments such as pre-production environment and user acceptance testing
    environment before eventually deploying the model in the production environment.
    The primary task to be accomplished in this stage is “operationalization of the
    model.”


    # Operationalize the model


    Once you have obtained a set of models with expected performance levels, these
    models can then be operationalized for other applicable applications to use. According
    to the business requirements, predictions can be made in real-time or on a batch
    basis. In order to deploy the model, they must be integrated with an open “Application
    Programming Interface” (API) to allow interaction of the model with all other
    applications and its components, as needed.


