  md: '# # Chapter 3: Data Visualization and Analysis with Python


    # ## Big Data


    In 2001, Gartner defined Big data as "Data that contains greater variety arriving
    in increasing volumes and with ever-higher velocity." This led to the formulation
    of the "three V''s". Big data refers to an avalanche of structured and unstructured
    data that is endlessly flooding and from a variety of endless data sources. These
    data sets are too large to be analyzed with traditional analytical tools and technologies
    but have a plethora of valuable insights hiding underneath.


    # ## The “Vs” of Big data


    **Volume** – To be classified as big data the volume of the given data set must
    be substantially larger than traditional data sets. These data sets are primarily
    composed of unstructured data with limited structured and semi-structured data.
    The unstructured data or the data with unknown value can be collected from input
    sources such as webpages, search history, mobile applications, and social media
    platforms. The size and customer base of the company is usually proportional to
    the volume of the data acquired by the company.


    **Velocity** – The speed at which data can be gathered and acted upon the first
    to the velocity of big data. Companies are increasingly using a combination of
    on-premise and cloud-based servers to increase the speed of their data'
  merge: -1
  img_proc: true
- pgno: 203
  md: "collection. The modern-day \"Smart Products and Devices\" require real-time\
    \ access to consumer data, in order to be able to provide them a more engaging\
    \ and enhanced user experience.\n\n**Variety** – Traditionally a data set would\
    \ contain majority of structured data with low volume of unstructured and semi-structured\
    \ data, but the advent of big data has given rise to new unstructured data types\
    \ such as video, text, audio that require sophisticated tools and technologies\
    \ to clean and process these data types to extract meaningful insights from them.\n\
    \n**Veracity** – Another \"V\" that must be considered for big data analysis is\
    \ veracity. This refers to the \"trustworthiness or the quality\" of the data.\
    \ For example, social media platforms like \"Facebook\" and \"Twitter\" with blogs\
    \ and posts containing a hashtag, acronyms, and all kinds of typing errors can\
    \ significantly reduce the reliability and accuracy of the data sets.\n\n**Value**\
    \ – Data has evolved as a currency of its own with intrinsic value. Just like\
    \ traditional monetary currencies, the ultimate value of the big data is directly\
    \ proportional to the insight gathered from it.\n\n> “The importance of big data\
    \ doesn’t revolve around how much data you have, but what you do with it. You\
    \ can take data from any source and analyze it to find answers that enable 1)\
    \ cost reductions, 2) time reductions, 3) new product development and optimized\
    \ offerings, and 4) smart decision making.”\n> \n> - SAS\n\n# **The functioning\
    \ of big data**"
