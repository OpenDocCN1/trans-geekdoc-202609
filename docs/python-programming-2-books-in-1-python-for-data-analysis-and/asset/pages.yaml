  md: 'better driving and maneuvering decisions.


    **Machine learning to make predictions** – To develop models that can determine
    future trends based on the transactional data acquired by the company, machine
    learning algorithms are a necessity. This is considered as “supervised machine
    learning,” which we will elaborate on later in this book. For example, fraud detection
    systems use machine learning algorithms on the historical data pertaining to fraudulent
    purchases to detect if a transaction is fraudulent.


    **Machine learning for pattern discovery** – To be able to develop models that
    are capable of identifying hidden data patterns but lack required parameters to
    make future predictions, the “unsupervised machine learning algorithms,” such
    as “Clustering,” need to be employed. For example, telecom companies often use
    the “clustering” technology to expand their network by identifying network tower
    locations with optimal signal strength in the targeted region.


    # Data Science vs Data Analysis


    The terms of data science and data analytics are often used interchangeably. However,
    these terms are completely different and have different implications for different
    businesses. Data science encompasses a variety of scientific models and methods
    that can be used to manipulate and analyze structured, semi structured, and unstructured
    data. Tools and processes that can be used to make sense of gather insight from
    highly complex, unorganized and raw data set falls under the umbrella of data
    science. Unlike data analytics that is targeted to verify a hypothesis, data science'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'boils down to connecting data points to identify new patterns and insights
    that can be made use of in future planning for the business. Data science moves
    the business from inquiry to insights by providing a new perspective into their
    structured and unstructured data by identifying patterns that can allow businesses
    to increase efficiencies, reduce costs and recognize the new market opportunities.


    Data science acts as a multidisciplinary blend of technology, machine learning
    algorithm development, statistical analysis, and data inference that provides
    businesses with enhanced capability to solve their most complex business problems.
    Data analytics falls under the umbrella of data science and pertains more to reviewing
    and analyzing historical data to put it in context. Unlike data science, data
    analytics is characterized by low usage of artificial intelligence, predictive
    modeling and machine learning algorithms to gather insights from processed and
    structured data using standard SQL query commands. The seemingly nuanced differences
    between data analytics and data science can actually have a substantial impact
    on an organization.


