    +   2. Generalized linear model: This is similar to the other option that

    +   we talked about, but it is often considered as more of a

    +   generalization or the extension of that model. It is used to help

    +   with some of the discrete dependent variables that are out there.


    +   3. Item response theory. The models that are used for this one are

    +   going to spend time assessing one latent variable from some of

    +   the other binary measured variables that are out there.


    In addition to this, there are tons of different approaches that you can use to

    analyze your data. They can all be fun, and in some cases, you will be able

    to utilize more than one of these at a time. It all depends on what you want'
