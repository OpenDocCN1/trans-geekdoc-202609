  md: '# Chapter 4: Machine Learning and Predictive Analysis


    # Machine Learning


    Machine Learning can be defined as a subsidiary of artificial intelligence technology
    driven by the hypothesis that machines are capable of learning from data by identifying
    patterns and making decisions with little to no human assistance. The science
    of machine learning was birthed as a theory that computers have the potential
    to self-learn specific tasks without needing to be programmed, using the pattern
    recognition technique. As the machines are exposed to new data, the ability to
    adapt independently is the iterative aspect of machine learning. They can learn
    from and train themselves with prior computations to generate credible and reproducible
    decisions and results. The Machine learning algorithms have been in use for much
    longer than one would think, but their enhanced capability to analyze “big data”
    by automatically applying highly complex and sophisticated mathematical calculations
    rapidly and repeatedly has been developed recently.


    Machine learning allows the analysis of large volumes of data and delivers faster
    and more accurate results. With proper training, this technology can allow organizations
    to identify profitable opportunities and business risks. Machine learning, in
    combination with cognitive technologies and artificial'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'intelligence, tends to be even more effective and accurate in processing massive
    quantities of data. The machine learning algorithms can be categorized into four:


    **Supervised machine learning algorithms** – These algorithms are capable of applying
    the lessons from the previous runs to new data set using labeled examples to successfully
    make predictions for the future events. For example, a machine can be programmed
    with data points labeled as “F” (failed) or “S” (success). The learning algorithm
    will receive inputs with corresponding correct outputs and run a comparison of
    its own actual output against the expected or correct, in an attempt to identify
    errors that can be fixed to make the model more efficient and accurate. With sufficient
    training, the algorithms are capable of providing ‘targets’ for any new data input
    through methods like regression, classification, prediction and ingredient boosting.
    The analysis starts from a known training data set and the machine learning algorithm
    then produces an “inferred function” to make future predictions pertaining to
    the output values. For example, supervised learning algorithm based system are
    smart enough to anticipate and detect the likelihood of fraudulent credit card
    transactions being processed.


    **Unsupervised machine learning algorithms** – These algorithms are used in the
    absence of classified and labeled training data sources. According to SAS, “Unsupervised
    Learning algorithms are used to study ways in which the system can infer a function
    to describe a hidden structure from unlabeled data i.e., to explore the data and
    identify some structure within.” Similar to the supervised learning algorithms,
    these algorithms are able to explore the data and draw inferences from data sets,
    but cannot figure out'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'the right output. For example, identification of individuals with similar shopping
    attributes, who can be segmented together and targeted with similar marketing
    campaigns. These algorithms are widely used to identify data outliers, provide
    product recommendations, and segment text topics using techniques like “singular
    value decomposition,” “self-organizing maps,” and “k-means clustering.”


    **Semi-supervised machine learning algorithms** – As the name indicates, these
    algorithms fall somewhere in between supervised and unsupervised learning and
    are capable of using labeled as well as unlabeled data as training sources. A
    typical training set would include the majority of the unlabeled data with a limited
    volume of the labeled data. The systems running on semi-supervised learning algorithms
    with methods such as prediction, regression and classification are able to significantly
    improve their learning accuracy. In situations where the acquired labeled data
    requires relevant and skilled resources for the machine to be able to train or
    learn from it, the semi-supervised learning algorithms are best suited. For example,
    identification of individual faces on a web camera.


    **Reinforcement Machine learning algorithms** – These algorithms are capable of
    interacting with their environment by producing actions and discovering errors
    or rewards. The primary characteristics of reinforcement learning are trial and
    error research method and delayed reward. With the use of these algorithms machines
    can maximize its performance by automatically determining the ideal behavior within
    a specific context. The reinforcement signal is simply reward feedback that is
    required by the machine or software agents to learn which actions yield the fastest
    and'
  merge: -1
  img_proc: true
