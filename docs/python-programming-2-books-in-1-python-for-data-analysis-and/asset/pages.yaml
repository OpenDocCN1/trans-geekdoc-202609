- pgno: 21
  md: '# What is Data Analysis?


    When it comes to working with data analysis, there are going to be a few methods
    that you are able to work with. These phases will ensure that you can handle the
    data in the proper manner and that it will work the way that we want it to. These
    are going to include some of the initial phases of cleaning our data, working
    with whether the data is high enough quality, quality measurement analysis, and
    then we enter into the main data analysis.


    All of these steps are going to be important to the work that we want to do with
    data analysis. Without all of them, even though some may seem to have nothing
    to do with data analysis in the first place, our analysis is not going to be very
    accurate or good. Since companies are often going to rely on these analyses for
    important decisions, having accurate and high-quality data is going to be important.


    The first step that we need to focus on here is data cleaning. This is the first
    process, and while it may not be as much fun as we see with the algorithms and
    more that come with data analysis, they are still important. This is the part
    of the process where we match up records, check for multiples and duplicates in
    the data, and get rid of anything that is false or does not match up with what
    we are looking for at this time.


    When that part is done with the part of cleaning our data, it is time for us to
    go through and do a bit of quality assurance here. We want to make sure that the
    data we work with is going to work for any algorithm that we'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'would like to focus our time and attention on. Using things like frequency
    counts and descriptive statistics can help us out with this.


    It is never a good idea to go through and analyze data that does not meet some
    of your own personal standards. You want to make sure that it will match up with
    what you want to do with some of your work on the analysis, that it is accurate,
    and it will get the job done for you, as well.


    When the quality analysis part is done, it is time to make sure that the measurement
    tools that we use here are going to be higher in quality as well. If you are not
    using the same measurements on each part of this, then your results will be skewed
    in the process. If you are using the right ones, though, you will find that this
    gives you some options that are more accurate and can help you really rely on
    the data analysis.


    Once the whole process of making sure you clean the data, and we have done the
    quality analysis and the measurement, it is time to dive into the analysis that
    we want to use. There are a ton of different analysis that we can do on the information,
    and it often will depend on what your goals are in this whole process. We can
    go through and do some graphical techniques that include scattering plots. We
    can work with some frequency counts to see what percentages and numbers are present.
    We can do some continuous variables or even the computation of new variables.


    There are tons of algorithms that are present when we work on this, and it will
    again depend on your goals. Some are better for helping you to see the best decision
    to make out of several options, such as the decision tree and'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'random forest. Others are going to be better for helping us to sort through
    our information and see what patterns are there, such as the clustering algorithms.
    Having a good idea of what you are looking for out of the data and what you hope
    to gain from it can make a world of difference.


    # The Main Data Analysis


    Now it is time for us to go through and work with what is known as the main data
    analysis. There are many parts that come with this as well, and we have to remember
    that this is a big process. It will take some time and is not always as easy and
    straightforward as we would hope in the beginning. During this part, after we
    have had a chance to go through and clean the data and get it organized, including
    cleaning it off and some of the work that we did before, it is time to enter into
    the main data analysis in order to get some things done in the manner that we
    want.


    There are a few methods that we need to use to make this work. For example, the
    confirmatory and the exploratory approaches will help us out. These are not going
    to allow us to have a clear hypothesis stated before we analyze the data. This
    ensures that we are not going to be tempted to bring in our ideas to the mix.
    We will go through the information and see what is there, and I hope that be able
    to learn something from it in the process.


    Then we are able to check on some of the stability that shows up in the results.
    The stability of the results using cross-validation, statistical methods, and
    sensitivity analysis is going to help. We want to make sure that the results we
    are able to get are accurate and will be able to repeat themselves. If we run
    through it a few times and end up with a few different'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'answers, how are we supposed to know which result is the right one for us?

    This takes some time and dedication to be done but can be the right method

    to help us out.


    We can then work with a few different methods of statistics to help us pick

    out the algorithm that we want to work with and to make sure that we can

    see what is going on with everything. Some of the statistical methods that

    we are able to utilize here will include:


    +   1. The general linear model: There are a number of models of

    +   statistics that are going to work with the general linear model in

