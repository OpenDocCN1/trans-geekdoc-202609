- pgno: 108
  md: '# Chapter 1: Foundational Data Science Technologies


    In the world of technology, Data is defined as “information that is processed
    and stored by a computer.” Our digital world has flooded our realities with data.
    From a click on a website to our smart phones tracking and recording our location
    every second of the day, our world is drowning in the data. From the depth of
    this humongous data, solutions to our problems that we have not even encountered
    yet could be extracted. This very process of gathering insights from a measurable
    set of data using mathematical equations and statistics can be defined as “data
    science.” The role of data scientists tends to be very versatile and is often
    confused with a computer scientist and a statistician. Essentially anyone, be
    it a person or a company that is willing to dig deep to large volumes of data
    to gather information, can be referred to us data science practitioners. For example,
    companies like Walmart keeps track of and record of in-store and online purchases
    made by the customers, to provide personalized recommendations on products and
    services. The social media platforms like Facebook that allow users to list their
    current location is capable of identifying global migration patterns by analyzing
    the wealth of data that is handed to them by the users themselves.


    The earliest recorded use of the term data science goes back to 1960 and credited
    to “Peter Naur,” who reportedly used the term data science as a substitute for
    computer science and eventually introduced the term'
  merge: -1
  img_proc: true
- pgno: 109
  md: "\"datalogy.\" In 1974, Naur published a book titled “Concise Survey of Computer\
    \ Methods,” with liberal use of the term data science throughout the book. In\
    \ 1992, the contemporary definition of data science was proposed at “The Second\
    \ Japanese-French Statistics Symposium,” with the acknowledgment of emergence\
    \ of a new discipline focused primarily on types, dimensions and structures of\
    \ data.\n\n> \"Data science continues to evolve as one of the most promising and\
    \ in-demand career paths for skilled professionals. Today, successful data professionals\
    \ understand that they must advance past the traditional skills of analyzing large\
    \ amounts of data, data mining, and programming skills.\n> \n> In order to uncover\
    \ useful intelligence for their organizations, data scientists must master the\
    \ full spectrum of the data science life cycle and possess a level of flexibility\
    \ and understanding to maximize returns at each phase of the process.\"  \n> –\
    \ University of California, Berkley\n\nAn increasing interest by business executives\
    \ has significantly contributed to the recent rise in popularity of the term data\
    \ science. However, a large number of journalists and academic experts, do not\
    \ acknowledge data science as a separate area of study from the field of statistics.\
    \ A group within the same community considers data science is the popular term\
    \ for “data mining” and “big data.” The very definition of data science is up\
    \ for debate within the tech community. The field of study that requires a combination\
    \ of skill set including computer programming skills, domain expertise, and proficiency\
    \ in statistics and mathematical algorithms to be able to extract valuable insight\
    \ from large volumes of raw data is referred to as data science."
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Data Science Lifecycle


    The most highly recommended lifecycle to structured data science projects, the
    “Team Data Science Process” (TDSP). This process is widely used for projects that
    require the deployment of applications based on artificial intelligence and/or
    machine learning algorithms. It can also be customized for and used in the execution
    of “exploratory data science” projects as well as “ad hoc analytics” projects.
    The TDSP lifecycle is designed as an agile and sequential iteration of steps that
    serve as guidance on the tasks required for the use of predictive models. These
    predictive models need to be deployed in the production environment of the company,
    so they can be used in the development of artificial intelligence based applications.
    The aim of this data science lifecycle is high speed delivery and completion of
    data science projects toward a defined engagement end point. Seamless execution
    of any data science project requires effective communication of tasks within the
    team as well as to the stakeholders.


    The fundamental components of the “Team Data Science Process” are:


    # Definition of a data science lifecycle


    The five major stages of the TDSP lifecycle that outline the interactive steps
    required for project execution from start to finish are: “Business understanding,”
    “Data acquisition in understanding,” “modeling,” “deployment” and “customer acceptance.”
    Keep reading for details on this to come shortly!


    # Standardized Project Structure'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'To enable seamless and easy access to project documents for the team members
    allowing for quick retrieval of information, use of templates, and a shared directory
    structure goes a long way. All project documents and the project code our store
    and a “version control system” such as “TFS,” “Git” or “Subversion” for improved
    team collaboration. Business requirements and associated tasks and functionalities
    are stored in an agile project tracking system like “JIRA,” “Rally” and “Azure
    DevOps” to enable enhanced tracking of code for every single functionality. These
    tools also help in the estimation of resources and costs involved through the
    project lifecycle. To ensure effective management of each project, information
    security and team collaboration, TDSP confers the creation of separate storage
    for each project on the version control system. The adoption of a standardized
    structure for all the projects within an organization aid in the creation of an
    institutional knowledge library across the organization.


    The TDSP lifecycle provides standard templates for all the required documents
    as well as folder structure at a centralized location. The files containing programming
    codes for the data exploration and extraction of the functionality can be organized
    to using the provided a folder structure, which also holds records pertaining
    to model iterations. These templates allow the team members to easily understand
    the work that has been completed by others as well as for a seamless addition
    of new team members to a given project. The markdown format supports ease of accessibility
    as well as making edits or updates to the document templates. To make sure the
