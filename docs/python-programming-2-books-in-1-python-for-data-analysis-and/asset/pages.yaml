- pgno: 12
  md: 'Python is a very popular programming language that is high-level and general-purpose.
    It was designed in 1991 by Guido van Rossum and then developed by Python Software
    Foundation. It was developed in the beginning with an emphasis on having codes
    that were readable to all, and the syntax was made to help programmers find better
    ways to express the concepts that they wanted in fewer lines of code.


    During the late 1980s, history was about to be written brand new. It was during
    this time when some of the work on the modern Python language first began. Soon
    after this time, Guido van Rossum began doing some of the application based work
    in 1989 at the Centrum Wiskunde and Informatica, which was found in the Netherlands.


    Working on the Python language was just a hobby project to get started because
    van Rossum was just looking for something that could capture his interest during
    the Christmas break. The programming language, which Python is known to have succeeded,
    is the ABC Programming language.


    ABC was something that van Rossum had worked to create earlier on in his own career,
    but he had seen that there were a few issues with the features and more of this
    language. After some time, he decided that he needed to go through and make some
    changes to improve it, which led him to take the syntax of the ABC language, and
    some of the good features that were still found in it, and make it into something
    new.


    The inspiration that is found with the name of this language was from Monty Python''s
    Flying Circus since van Rossum was a big fan of this and'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'he wanted to come up with a name that was unique, short, and maybe even a bit
    mysterious for the invention he was working with on Python. Van Rossum continued
    to work as the leader on this language until July of 2018, but he was considered
    a benevolent dictator who allowed other developers to work on the language with
    many free reigns to give us the language that we know and live today.


    The official Python language was released in 1991. When this release happened,
    it used a lot fewer codes in order to express the concepts of coding when compared
    with other languages like C++, C, and Java. The design philosophy that came with
    this was good compared to the others.


    For the most part, the main objective that we can see with the Python language
    is that it was to provide readable code and a lot of productivity that was advanced
    for the developer.


