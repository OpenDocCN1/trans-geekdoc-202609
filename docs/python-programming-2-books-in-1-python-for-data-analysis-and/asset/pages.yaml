    data analysis techniques:


    +   1. “Univariate non-graphical” - This technique looks at a single variable
    or data column at a time and displays the results as a statistical summary.

    +   2. “Multivariate non- graphical” - This technique looks at two or more variables
    or data columns at a time and displays the results as a statistical summary.

    +   3. “Univariate graphical” - This technique looks at a single variable or data
    column at a time and displays the results diagrammatically or using pictorial
    graphs.

    +   4. “Multivariate graphical” - This technique looks at two or more variables
    or data columns at a time and displays the results diagrammatically or using pictorial
    graphs.


    EDA helps in the determination of the best predictive model to address the business
