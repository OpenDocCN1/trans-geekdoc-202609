- pgno: 25
  md: 'to do with the data. A few of the options that are available to try out include:


    +   1. A cross-cultural analysis to see if the same results are going to happen
    between different countries or different cultures.

    +   2. Content analysis

    +   3. The grounded theory analysis

    +   4. The discourse analysis

    +   5. The narrative analysis

    +   6. The hermeneutic analysis

    +   7. The ethnographic analysis.


    Keep in mind that when we are doing some of the data analysis work that we want
    to accomplish, a lot of it is going to have nothing to do with the actual analysis
