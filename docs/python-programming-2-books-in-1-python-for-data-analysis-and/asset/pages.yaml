    # Qualification and Prioritization of Leads


    There are three primary categories employed in business to business or B2B predictive
    analytics marketing to qualify and prioritize prospective customers or “leads.”
    These categories are:


    +   “Predictive scoring” which is used to prioritize prospective customers on
    the basis of their likelihood to make an actual purchase


    +   “Identification models” which are used to identify and acquire new prospective
    customers on the basis of attributes that are shared with the existing customers
    of the company.


    +   “Automated segmentation,” which is used to separate and classify prospective
    customers on the basis of shared attributes to be targeted with the same personalized
    marketing strategies and campaigns.


    The predictive analytics technology needs a large volume of sales data that serves
    as a building block and training material to increase the accuracy and efficiency
    of the predictive models. Small brick-and-mortar companies cannot afford to expand
    their computing resources. Therefore, are unable to efficiently collect customer
    behavioral data from their in-store sales. This translates into a competitive
    edge for larger companies with more advanced computing system, which exacerbates
