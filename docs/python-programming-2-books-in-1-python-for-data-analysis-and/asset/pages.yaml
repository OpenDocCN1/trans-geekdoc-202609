    # Model training


    A wide variety of modeling algorithms are available in the market today. The algorithm
    that meets the criteria of your project must be selected. The process for “model
    training” can be divided into four steps which are:


    +   1. Creation of a “training data set” as well as a “test data set” by appropriately
    dividing the input data.

    +   2. Development of the model with the use of the “training data set.”

    +   3. Evaluation of the training and the test data set, by employing various
    machine learning algorithms as well as related “tuning parameters” that are designed
    to help answer the previously discussed five types of questions from the existing
    data set.

    +   4. Assess the best fit for the solution to resolve the business problem by
    comparing all available methods using key performance indicators and metrics.


    TDSP provides an “automated modeling and reporting tool” that is capable of running
    through multiple algorithms and “parameters sweeps” to develop a “baseline model”
    as well as a “baseline modeling report” that can serve as a performance summary
    for each “model and parameter combination.”


