    # Exploratory analysis of customer data


    “Exploratory Data Analysis” or EDA provides a comprehensive view of existing customer
    data generated pertinent customer data sources such as product prices, current
    and historical customer surveys, product usage, purchase history, and demographics.
    It is considered as an approach to look at the data without the use of any statistical
    model and the data inferences. The term “Exploratory Data Analysis” was coined
    by John Tukey, in his book released in 1977. Some of the main reasons to use exploratory
    data analysis are:


    +   • Preliminary selection of the applicable “predictive models.”

    +   • Verification of underlying assumptions.

    +   • Make sure the company is asking the right questions to expand its customer
    base.

    +   • Detect potential data anomalies, redundancies and errors.

    +   • Determination of the relationship between the “explanatory variables.”

    +   • Assessment of the direction and size of the relationship between “explanatory
    variables” and “outcome variables.”


    The customer data collected in the database form of a rectangular array with individual
    columns for “subject identifier,” “outcome variable” and “explanatory variable.”
    It is rather challenging to look at a spreadsheet'
