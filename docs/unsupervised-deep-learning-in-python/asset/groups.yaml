  mdcn: "\n变得不相关。\n\n再次回到问题——我们如何找到 Q 以便按照这种特定的方式旋转数据？\n\n# 可视化\n\n一旦我们对每个维度的数据信息按降序排序，我们就可以取前两个并绘制散点图。这将让我们对数据点之间的分离有一个直观认识，并允许我们创建高维数据的视觉表示。\n\
