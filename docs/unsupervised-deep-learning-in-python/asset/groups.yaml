  - '[PAGE 49]


    Another method, which is the method we are going to use, makes use of a function
    called the free energy.


    We define the free energy as the negative log of the sum over all h of the top
    part of the joint probability.


    F(v) = -log(sum[h]{ exp(-E(v,h)) })


    It''s hard to prove because you can''t just use direct algebraic notation, but
    if you are interested in learning more this is a result of all the units conditionally
    independent, and it is related to something called the sum-product algorithm.
    In any case, the free energy reduces to:


    F(v) = -b^Tv - sum[j=1..M]{ log(1+exp(c(j)) + v^T W(:;j)) }


    So that it now no longer depends on h at all.


    When you use this in the cost function and take the derivative, what you get is
    a simpler expression with only one expected value.


    dJ(v)/dw = dF(v)/dw - sum[v''] P(v'')dF(v'')/dw


    Notice how this actually gives us the same update rules as before.


    We call the first term the positive phase and the second term the negative phase.


    Since the first term goes in the direction of the free energy at the sample v,
    it''s basically trying to reduce the energy for that particular v, which corresponds
    to a higher probability for that sample v.


    The other term, the negative phase, tries to lower the probability for ALL possible
    values of v.'
  - '[PAGE 50]


    One last note about RBMs is that we can stack just like how we stack autoencoders
    and do “greedy layer-wise pretraining”.


    Except when we stack RBMs they get a special name - they are called deep belief
    networks.


    One small note about the proper terminology here - “deep belief network” refers
    to the unsupervised model, whereas if you train it in a supervised way it is called
    a “deep neural network”.


    Sometimes “deep belief network” can also refer to the stacked autoencoder configuration
    from the last chapter.


    # Contrastive Divergence


    In this section we are going to talk about the sampling algorithm, called contrastive
    divergence, that we use to estimate the gradient we derived in the last section.


    If you found the material in the last lecture hard, don’t worry too much about
    it, because following the steps of the CD algorithm is actually much easier.


    Contrastive divergence is usually called CD-k, meaning you do k steps of Gibbs
    sampling.


    What that means, given a training sample v0, we are going to calculate p(h0|v0)
    which is just the usual forward pass on the network. Next, we are going to use
    those probabilities to draw a sample of h - call that h0.


    So if p(h_j | v) is 0.3, then h_j will be 1 with probability 0.3.


    Next, we do a backwards pass, so we calculate p(v1|h0). Now we use these probabilities
    to draw a sample of samples v1.


    Next, we calculate p(h1|v1), and take a sample of h again. We keep repeating this
    process to infinity.'
  - '[PAGE 51]


    0-0-0-0-...

    v0 h0 v1 h1...


    By going to infinity, we get an exact answer, but we obviously cannot train the
    neural network for that long.


    What researchers have found is that k=1 works just fine. We will use k=1 also,
    which will allow us to avoid having to do any loops.


    In pseudocode, the process might look something like this:


    ```

    def derivative(v0):

    p_h0 = self.forward(v0)

    h0 = sample(p_h0)

    p_v1 = self.backward(h0)

    v1 = sample(p_v1)

    p_h1 = self.forward(v1)

    return v0.dot(p_h0.T) - v1.dot(p_h1.T)

    ```


    Of course, that would work fine if we were using numpy, but we are going to use
    Theano,

    which will find the gradients automatically.


    What we will do instead, is after we calculate v1 from v0, we will set the objective
    to the

    free_energy(v0) - free_energy(v1), and let Theano calculate the gradient for us.


    One interesting thing is, because we don''t actually want to calculate P(v), we
    still want to

    plot some cost function as training progresses.


    We are going to continue to use the cross-entropy error like we did with autoencoders,
    and

    if you run the code you''ll see that despite a completely different training algorithm

    and theoretical framework, this error function still decreases as we train.'
