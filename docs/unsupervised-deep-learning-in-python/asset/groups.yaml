    ## 第 2 章：t-SNE


    在本节课程中，我们将讨论另一种名为 t-SNE 的降维和可视化方法。t 代表我们引入了 t 分布，而 SNE 代表“随机邻域嵌入”（stochastic neighbor
    embedding）。


    t-SNE 的一个很大优势是它是一种非线性方法，因此比 PCA 具有更表达能力。


    ### 为什么要学习 t-SNE？


    有两个原因：


    - 1) t-SNE 由 Geoffrey Hinton 共同开发，如你所知，他是深度学习领域的灵魂人物之一。

    - 2) 通过使用 t-SNE，我们可以看到通过更复杂的数学模型如何克服 PCA 的局限性。


    PCA 和 t-SNE 之间的一个关键区别（除了 t-SNE是非线性的之外）是 t-SNE 并没有转换模型。


    相反，t-SNE 只是直接修改输出以最小化代价函数。


    这意味着你不会有任何训练集和测试集，而且在对某些数据进行拟合后无法对数据进行转换。


    t-SNE 的工作原理本质是尝试保持每个输入向量之间的距离。


    我们将从对称 SNE 开始，因为它在直觉上更符合逻辑。


    在原始数据 $X$ 上，我们定义了一个联合概率分布 $p(i,j)$，它等于：


    $p(i,j) = \frac{\exp(-|x_i - x_j|^2 /(2s^2))}{\sum_{k \neq m} \exp(-|x_m - x_k|^2
    /(2s^2))}$


    注意，$i$ 和 $j$ 不是像我们在处理 PCA 时那样的维度索引，而是数据集中的第 $i$ 个和第 $j$ 个数据点，即第 $i$ 个和第 $j$ 个样本。


    注意它看起来有点像高斯分布。你可以将“s” 思考为一个超参数。它控制着分布的“扩散程度”。


    接下来，我们有了低维映射 $Y$，我们以相同的方式定义它，但没有 $s$ 项。


    $q(i,j) = \frac{\exp(-|y_i - y_j|^2)}{\sum_{k \neq m} \exp(-|y_m - y_k|^2)}$


    注意我们只是设置了 $p(i,i) = q(i,i) = 0$。


    我们定义了两个概率分布，一个位于 $X$ 中每对点之间，另一个位于 $Y$ 中每对点之间。我们通常只是随机初始化 $Y$ 中的每个数据点。即：如果我们正在寻找一个
    2 维表示，我们会创建 $Y$ 为：


    `Y = np.random.randn(N, 2)`


    一旦完成这些，我们就可以尝试通过优化关联 $p(i,j)$ 和 $q(i,j)$ 的目标函数来寻找更好的 $Y$。如果你不熟悉如何比较概率分布，我们通常使用
    Kullback-Leibler 散度（KL 散度）：


    $C = D_{KL}(P || Q) = \sum p(i,j) \log\left(\frac{p(i,j)}{q(i,j)}\right)$


    如果 $P$ 和 $Q$ 完全相同，该值将为 0。我们解决这个问题的方法与解决其他此类类型的方法相同——对目标函数求导并进行梯度下降。注意，在这类模型中我们没有权重——所以我们是关于输出映射
    $Y$ 求梯度。即：


    `Y <- Y - learning_rate * dC/dY`


    之前的对称 SNE 有一个问题被称为“拥挤问题”（crowding problem），它阻止了簇的自然形成。t-SNE 对 $Q$ 和 $P$ 使用了稍微不同的分布，这有助于拉开簇。它们的定义如下：


    $p(i,j) = \frac{p(i | j) + p(j | i)}{2}$


    其中：


    $p(j | i) = \frac{\exp(-|x_i - x_j|^2 /(2s^2))}{\sum_{k} \exp(-|x_i - x_k|^2 /(2s^2))}$


    注意每个样本都有自己的“s”。尽管根据上面的定义相对简单，但代价函数保持不变。问题在于它是慢的，并且对内存有巨大，因为我们需要为 $i=1..N$ 和 $j=1..N$
    计算 $q(i,j)$ 和 $p(i,j)$，这自然是 $O(N^2)$ 的。它有一个变体称为 Barnes-Hut，运行时间为 $O(N \log N)$，但仍然对内存有巨大需求。这是
    SciKit Learn 中使用的默认方法。一种解决方案是仅抽取几百个点并对其执行 t-SNE，或者如果你愿意等待并有足够的内存。


    ### 练习


    - 在 MNIST 数据集上尝试使用 scikit-learn 中的 t-SNE。

    - 根据上面的定义尝试编写你自己的实现，并利用自动微分。


    ## 第 3 章：自动编码器


    在本章中，我们将讨论自动编码器。自动编码器其实并不新奇，只是对你已经熟悉的东西进行了一小改动。监督学习模型作为 API 有两个主要功能：`fit` 和 `predict`。通常我们调用神经网络时，会调用
    `model.fit(X, Y)`，然后在进行预测时调用 `model.predict(X)`。但如果我们只是让神经网络尝试预测它自己呢？所以我们改用 `model.fit(X,
    X)`。


    这正是自动编码器的本质。在我之前的很多课程中，我们做的是分类，但请记住 $X$ 可以是任何实值。所以如果你正在尝试预测一般的实值，可以使用平方误差，它会变得更像回归。你也可以仍然使用交叉熵误差，并将你的输入和输出视为二值，即使这些变量并不是严格的二值。你会看到我们在自动编码器和
    RBM 中都这样这样做，并且你会发发现这两种误差函数都是有效的。你可以认为像 MNIST 这样的图像具有像素强度：0 表示完全没有强度，1 表示最大强度，因为我们总是通过
    255 进行缩放。


    为了让输出介于 0 和 1 之间，我们将在隐藏层和输出层都使用 sigmoid 函数。我们有时对自动编码器和 RBM 使用的一种轻微修改是权重共享（shared
    weights）的理念。因此，我们不再在输出层使用另一个权重，而是直接使用第一个权重的转置。


    `Z = sigmoid(XW + b)`

    `X_hat = sigmoid(ZW^T + c)`


    当我们在观察卷积神经网络时首次遇到权重共享的概念，因为同一个过滤器传递到图像的每个部分。记住，权重共享是一种正则化，因为我们减少了参数的数量，从而减少了过拟合概率。


    接下来，回到平方误差目标。如果我们用权重和输入来表示它（忽略偏置），我们得到：


    $J = \|X - \sigma(XW)W^T\|^2$


    记得我们在做 PCA 的时候，我要求你记住目标函数吗？


    $J = \|X - XX^T\|^2$


    考虑一下如果我们在这里**不**使用 sigmoid 会发生什么：


    $J = \|X - XWW^T\|^2$


    我们实际上只是变回 PCA！你实际上可以将自动编码器视为一种非线性 PCA。这是在进行非线性映射，就像 t-SNE 一样。注意这不是全貌，因为我们没有考虑偏置，而且我们没有要求权重的每列长度为
    1，或者每列正交，或者它们以任何特定方式排序。所以虽然函数形式看起来“像”PCA，但它并没有做 PCA 所做的所有事情。


    ### 去噪自动编码器


    在本节中，我们将讨论另一种正则化方法。记住，当我们被给一个数据集时，我们不必只在该数据集上进行训练。


