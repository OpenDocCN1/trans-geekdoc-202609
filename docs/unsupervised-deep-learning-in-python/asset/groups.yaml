    # Chapter 1: Principal Components Analysis


    In this chapter we are going to talk about PCA or principal components analysis.
    There are 2 components to their description:


    +   1) describing what PCA does and how it is used

    2) the math behind PCA.


    What does PCA do? Firstly, it is a linear transformation.


    If you think about what happens when you multiply a vector by a scalar, you’ll
    see that it never changes direction. It only becomes a vector of different length.
    Of course, you could multiply it by -1 and it would face the opposite direction,
    but it can’t be rotated arbitrarily.


    Ex. 2(1, 2) = (2, 4)


    If you multiply a vector by a matrix - it CAN change direction and be rotated
    arbitrarily.


    Ex. [[1, 1], [1, 0]]T = [3, 1]T


    What does PCA do? Simply put, a linear transformation on your data matrix:


    Z = XQ


    It takes an input data matrix X, which is NxD, multiplies it by a transformation
    matrix Q, which is DxD, and outputs the transformed data Z which is also NxD.


    If you want to transform an individual vector x to a corresponding individual
    vector z, which would be z = Qx. It’s in a different order because x is in a data
    matrix it’s 1xD row vector, but when we talk about individual vectors they are
    Dx1 column vectors. It’s just convention.


    What makes PCA an interesting algorithm is how it chooses the Q matrix.'
