    Ex. In 2 dimensions:


    ```

    E = [ e1 0 ]

    [ 0 e2 ]

    ```


    ```

    V = [ v11 v12 ]

    [ v21 v22 ]

    ```


    Where v(i,j) is the ith component of the jth eigenvector.


    It’s easy to prove that:


    ```

    CV = VE

    ```


    Try it yourself on paper with the scalar components.


    One last ingredient is that the matrix V is orthonormal. This means that any eigenvector
    dotted with itself is 1, and any eigenvector dotted with another different eigenvector
    is 0.


    Ex.


    ```

    viᵀVj = 0 if i != j

    viᵀTVi = 1

    ```


    In matrix form:


    ```

    VTV = I (the identity matrix)

    ```


    Finally, we’ll now look at the transformed data, Z. Remember that we still don’t
    know what Q is. But let’s solve for its covariance. Notice how we can express
    the covariance of Z in terms of the covariance of X.'
