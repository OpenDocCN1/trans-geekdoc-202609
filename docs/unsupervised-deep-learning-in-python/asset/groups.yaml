    X = X + eps*dJ/dX

    ```


    Where eps is a small number.


    What you should find that is the image itself doesn''t look any different (remember,
    matplotlib will scale your values to be from 0..255), but the neural network has
    a good chance of classifying the image wrong, even when it classifies the original
    image right.


    What implications does this have in terms of training a neural network?


    You surely don''t want your neural network to be so easily fooled, and the key
    here is something we''ve already talked about before:


    Data augmentation.


    The example I like to give: an upside-down cat is still a cat. A cat shifted to
    the left is still a cat. A rotated cat is still a cat.


    So if you only have one cat, you should create these invariant transformations
    and include them as training data.


    Similarly, a cat with some noise is still a cat.


    This is like what we did with autoencoders - set some of the inputs to 0. A cat
    with some 0s is still a cat, so add that as training data.


    And like we''ve seen in this chapter, a cat + some “intelligently designed” noise
    is still a cat, so include that as training data too.


    By including all these forms of data augmentation, you are making your neural
    network more robust.


