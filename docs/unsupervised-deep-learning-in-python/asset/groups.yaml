    \n```\nviᵀVj = 0 if i != j\nviᵀTVi = 1\n```\n\n矩阵形式：\n\n```\nVTV = I（单位矩阵）\n```\n\
    \n最后，我们现在来看转换后的数据 Z。记住我们仍然不知道 Q 是什么。但让我们求解它的协方差。注意我们如何用 X 的协方差来表示 Z 的协方差。\n\n\
    ```\nC_z = (Z - mz)^T(Z - mz) / N\nC_z = (XQ - mQ)^T(XQ - mQ) / N\nC_z = Q^T(X\
    \ - m)^T(X - m)Q / N\nC_z = Q^T[(X - m)^T(X - m) / N ] Q\nC_z = Q^T C Q\n```\n\
    \n我们可以用 X 的协方差和 Q 来表示 Z 的协方差！\n\n接下来看看如果我们选择 Q = V 会发生什么。\n\n```\nC_z = V^TCV\n\
    ```\n\n但记得 CV = VE。\n\n```\nC_z = V^TV E\n```\n\n记住 V 是正交的，所以 V^TV = I（单位矩阵）。因此：\n\
    \n```\nC_z = E\n```\n\n我们得到 Z 的协方差等于 E，即特征值的对角矩阵。\n\n这一切意味着什么？\n\n由于 E 的所有离对角元素均为\
    \ 0，这意味着任何维度 i 都与任何其他维度 j 相关，这意味着转换后的数据没有相关性。\n\n所以通过选择 Q = V，我们让 Z 去了相关。接下来，因为我们按降序排序了\
    \ E，这意味着 Z 的第一个维度具有最大的方差，第二个维度具有次大的方差，以此此类推。\n\n# PCA 目标\n\nPCA 推导中一个并不立即明显的点是它实际上最小化了一个目标函数。\n\
    \n目标函数是你自然预期的——它是数据的平方重建误差。\n\n```\nJ = || X - XQQ¹ ||²\n```\n\n由于 Q 是正交的，我们知道\
