  - '[PAGE 41]


    H(P, Q) = cross-entropy between P and Q

    H(P) = entropy of P

    D_{KL}(P || Q) = KL divergence between P and Q


    H(P,Q) = -sum[i]{ P(i) logQ(i) }

    H(P) = -sum[i]{ P(i) logP(i) }

    D_{KL}(P || Q) = sum[i]{ P(i)log( P(i) / Q(i) }


    We can show that:


    H(P,Q) = H(P) + D_{KL}(P || Q)


    Why is this significant?


    The derivative of a constant is 0. Therefore, the gradient, and thus gradient
    descent, is the same for both cross-entropy and KL divergence.


    So when we use cross-entropy on the autoencoder, what we''re really saying is
    the distribution of the input X is the target distribution, and the distribution
    of the reconstruction of X is the output distribution, and we would like them
    to be the same.


    # Summary


    The MOST important concept to get out of this is that for the single autoencoder,
    the “Z” is a “low-dimensional representation” of the input data X. We saw this
    same concept with PCA. We will see it again with RBMs.'
