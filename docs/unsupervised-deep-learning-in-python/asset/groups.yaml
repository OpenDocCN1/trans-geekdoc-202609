    # # Chapter 4: Restricted Boltzmann Machines and Deep Belief Networks


    In this chapter we are going to talk about Restricted Boltzmann Machines and deep
    belief networks, which is just stacked Restricted Boltzmann Machines - used in
    exactly the same way we stacked autoencoders.


    It’s interesting to look back at what we’ve learned at this point.


    When we did linear regression - we were able to calculate the derivative of the
    cost, set it to 0, and solve for the weights to get the best weights.


    With logistic regression and neural networks, you know that we can’t directly
    solve for the weights, so we take the derivative of the cost with respect to the
    weights, and take small steps in that direction.


    With RBMs, we enter an even more difficult situation. We can’t even calculate
    the derivative, so instead we try to estimate it approximately using Gibbs sampling,
    which is a special case of Markov Chain Monte Carlo.


    To understand RBMs, we first have to talk a little bit about Markov random fields.


    A Markov random field is just a graph of states, where each node is a state, which
    is a random variable.


    A B

    0—

    |V|

    |/

    0—0

    C D


    P(A, B, C, D)'
  - '[PAGE 44]


    A Markov random field represents a joint probability distribution, i.e. the probability
    of all those random variables.


    2 things to note about the MRF:


    First: that the Markov property holds, i.e.:


    P(s(t) | s(t-1), s(t-2), ...) = P(s(t) | s(t-1))


    The next state only depends on the current state, and not on any states before
    that.


    Second: the graph is undirected, so you can move along any edge in any direction.


    This brings us to the concept of Boltzmann machines.


    Boltzmann machines are Markov random fields where everything is connected to everything.


    The idea is you define an energy on the network, and your goal is to find the
    minimum energy state, much like how physical systems do.


    In fact, the Boltzmann distribution, which is the distribution we use when we
    talk about Boltzmann machines and restricted Boltzmann machines, is from statistical
    mechanics.


    The energy is defined as:


    E(s) = -( sum[i,j]{ w(i,j)s(i)s(j) } + sum[i]{ b(i)s(i) }


    It’s not super important since we won’t be using this exact form, but recognize
    the “structure” here. There’s a 2-D weight that gets multiplied by “interaction
    terms” and a 1-D linear weight.


    Now we can go from Boltzmann machines to restricted Boltzmann machines.'
  - '[PAGE 45]


    Here instead of everything being connected to everything, we instead have a “bipartite

    graph”.


    ![](img/6a1ceac8fa2fd0cda459693f13163e4e_45_0.png)


    This means that everything on the left is connected to everything on the right,
    and vice

    versa.


    We usually label the nodes on the left the visible units (v), and the nodes on
    the right the

    hidden units (h). This gives us a latent variable model, just like with PCA and

    autoencoders.


    Note that the Markov property still holds. What this means in this graph is that
    we have

    conditional independence. So the probability p(h(i) | v) is independent of the
    probability

    p(h(j) | v).


    Similarly, if you go in the other direction (remember, this graph is undirected),
    the

    proability p(v(i) | h) is independent of the probability p(v(j) | h).


    With RBMs we technically assume both the visible units and hidden units are binary
    units.


    This is why we used the sigmoid for autoencoders also, and why we only use the
    sigmoid

    uniformly throughout this book.


    We know that this works just fine for MNIST, and in fact a lot of data is binary.
    All

    categorical variables, since we use one-hot encoding, are binary, as are bag of
    words

    models, so basically anything to do with NLP will work here too.'
  - '[PAGE 46]


    There is some material out there that goes over at a high level how you could
    have Gaussian units, but these other formulations have been reported to have stability
    issues, so we won''t cover them here.


    We are ready to talk about the math behind RBMs.


    Note that this is very similar to the regular Boltzmann machine, there is one
    term that depends on the interaction of 2 different nodes, and then a bias-like
    term that depends only on one node.


    The total energy is E(v,h) = -bᵀv - cᵀh - vᵀh


    So if v is Dx1 and h is Mx1, then W must be DxM, which is what we usually have
    in a neural network.


    b is Dx1 and c is Mx1 to give us a valid dot product.


    Note that in terms of these variables, the conditional probabilities we talked
    about earlier are:


    p(h | v) = sigmoid(Wᵀv + c) (forward direction)

    p(v | h) = sigmoid(Wh + b) (backward direction)


    Like autoencoders, we again use shared weights.


    Now that we have an expression for our energy function, we can now define the
    joint probability of v and h.


    P(v,h) = exp(-E(v,h)) / Z


    Where:'
  - '[PAGE 47]


    ```

    Z = sum{ exp(-E(v,h) }

    ```


    We call Z the partition function, which just ensures that all the probabilities
    add up to 1.


    Note that this itself is intractable to calculate, because the summations mean
    summing over all possible values of v and h. Since they are both binary variables,
    that is O(2^N) for each of them.


    Ex. if M=3, then the possible values for h are:


    +   000

    001

    010

    011

    100

    101

    110

    111


    And and must sum over all of them.


    What we want then, given this model, is to maximize P(v), which is P(v,h) marginalized
    over h. This is because we don''t actually care about the values of h, we just
    want to maximize the probability of what we have seen, which is v.


    i.e.


    ```

    P(v) = sum[h]{ P(v, h) }

    ```


    As usual, we don''t maximize P(v) directly, but rather the log of P(v). So let''s
    begin by trying to take its derivative with respect to some arbitrary parameter
    w.


    ```

    d(-log(P(v))/dw

    ```'
  - '[PAGE 48]


    ```

    d(-log(sum[h]) { P(v,h) } / dw

    d=(-log(sum[h]) { exp(-E(v,h)) } / Z )

    d=sum[h]{ P(h | v)E(v,h) -sum[v,h]{ P(v,h)E(v,h) }

    =Eh|v{ E(v,h) - Ev,h{ E(v,h) }

    ```


    This is read as “the expected value of E(v,h) over the conditional distribution
    P(h | v)” - “the expected value of E(v,h) over the joint distributoon P(v, h)”.


    Since we end up with is the difference between 2 expectations. The first expectation
    is easy but the second expectation is hard because it requires an infinite number
    of Gibbs samples. We usually call the first term the clamped term and the second
    term unclamped term.


    Let’s take the previous expression and expand it. Let’s do the input to hidden
    weights explicitly.


    ```

    J = sum[h]{ P(h | v)E(v,h) -sum[v,h]{ P(v,h)E(v,h) }

    dJ/dW(i, j) = -sum[h]{ P(h | v) h(j|i) } +sum[v]{ P(v,h)P(h | v)h(j|i) }

    dJ/dW(i, j) = -prob(i|j=1 | v(i))+sum[v]{ P(v)p(h|j=1 | v(i) }

    dJ/dW(i, j) = -sigmoid(c(j) + vW*(;j))v(i)+sum[v]{ P(v)sigmoid(c(j) + vW*(;j))v(i)
    }

    ```


    We can denormalize the biases and use these 3 update equations:


    ```

    dJ/dW(i, j) = -sigmoid(c(j) + vW*(;j))v(i)+sum[v]{ P(v)sigmoid(c(j) + vW*(;j))v(i)
    }

    dJ/b(i) = v(i)-sum[v]{ P(v)v(i) }

    dJ/dc(j) = sigmoid(c(j) + vW*(;j))-sum[v]{ P(v)sigmoid(c(j) + vW*(;j)) }

    ```


    Now you see what we mean by the clamped term and unclamped term. We are going
    to get the first term simply by direct calculation, but we are going to get the
    second term - which requires a sum over all v - which is infeasible - by sampling.


    Note that if we were to code the RBM using numpy, we would use the actual gradient
    expressions directly as I previously defined them, but since Theano automatically
    finds gradients we don’t have to.'
