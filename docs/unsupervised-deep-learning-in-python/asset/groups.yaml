    # Python 中的无监督深度学习


    使用 Python 和 Theano 编写的现代神经网络掌握数据科学与机器学习


    作者：The LazyProgrammer (http://lazyprogrammer.me)


    # 引言


    - 第1章：主成分分析 (PCA)

    - 第2章：t-SNE

    - 第3章：自动编码器与堆叠去噪自动编码器

    - 第4章：受限玻尔兹曼机与深度信念网络

    - 第5章：特征可视化

