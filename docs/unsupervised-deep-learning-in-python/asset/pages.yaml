- pgno: 18
  md: 'dimension of Z has the most variance, the second dimension of Z has the second
    most variance, and so on.


    # The PCA Objective


    One thing that is not immediately obvious with the PCA derivation is that it actually
    minimizes an objective function.


    The objective function is what you would naturally expect - it''s the squared
    reconstruction error of the data.


    ```

    J = || X - XQQ¹ ||²

    ```


    Since Q is orthonormal, we know that Qᵀ = Q⁻¹.


    In other words, the transpose of Q is equal to the inverse of Q.


    We can thus reconstruct X using the transpose instead of the inverse.


    We''ll encounter this again when we look at autoencoders.


    Q_k is just the first k eigenvectors of the covariance of X - meaning that it''s
    a Dkx matrix.


    By multiplying X by Q��, we get Z��, the first k columns of Z. Remember, this
    gives us Z “without the noise”.


    Since we are now not using the full Q, there will be a non-zero reconstruction
    error.


    And we can get back the reconstruction by multiplying by Qₖ.


    Xhat = Zₖᵀ'
  merge: -1
  img_proc: true
