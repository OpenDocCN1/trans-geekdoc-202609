- pgno: 32
  md: 'Since each time we use an autoencoder, we are trying to get a more compact
    representation than what we had in the previous layer, we are going to want each
    layer to be smaller in size than the previous layer.


    Note that this doesn''t necessarily have to be the case. We could in fact have
    a huge number of hidden units in the middle layer. Theoretically, if we had N
    training samples, and N hidden units, then we could get a perfect reconstruction
    because each of the N columns of W could be responsible for reproducing a different
    sample.


    You would think that this would lead to severe overfitting, however researchers
    found it does not overfit, and even a number of hidden units greater than N can
    work.


    In our code, we will use classes and objects to represent the ANN and Autoencoder.


    This will help us compartmentalize our code much better, given the fact that we
    can have an arbitrary number of autoencoders.


    We can then simply make the hidden output of each autoencoder the input into the
    next autoencoder.


    # Greedy layer-wise pretraining


    The process that we''ve just talked about is called “greedy layer-wise pretraining”.


    The reason it is called greedy you should understand if you have ever studied
    algorithms. Greedy intuitively means you make the best short-sighted decision,
    which in our case is simply training one layer of the autoencoder.


    While it is theoretically not optimal, it actually helps a lot with supervised
    training, which is the next step, and that is why we call it pretraining.


    The last step in the process is to add a logistic regression layer to the end
    of the stacked autoencoders.'
