- pgno: 14
  md: '# The Math Behind PCA


    Now let us turn to the second part of the PCA description - how to actually find
    the transformation matrix Q.


    To recap, I''ve just told you about all the magical things this Q matrix can do:


    +   1) Make Z uncorrelated even though X is correlated

    2) Order each column in Z by its information content (variance)


    A lot of the steps here may seem arbitrary at first, but you''ll see how it all
    fits together in the end and results in all the properties I talked about in the
    previously.


    The first step is to calculate the covariance of X.


    C(x(i), x(j)) = E[ (x(i) - m(i))(x(j) - m(j)) ] = sum(n=1..N){ (x_n(i) - m(i))(x_n(j)
    - m(j)) } / N


    Where m(i) is the mean of all x(i).


    If i = j then it''s just the regular variance. In other words, the diagonals of
    the C matrix are the variances of each dimension of X. This will be important
    later.


    In matrix form:


    C = (X - m)^T(X - m) / N


    This gives us a DxD matrix. Remember, D is the dimensionality and N is the number
    of data points.


    Technically you can''t subtract the mean like that because it has a different
    shape than X, but we will assume that broadcasting is being used.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Eigenvalues and Eigenvectors


    Recall that a DxD matrix has D eigenvalues and D eigenvectors. If you don''t know
    what eigenvalues and eigenvectors are, I''m going to give you a short introduction.


    Remember that matrices in general change the direction of, or rotate, a vector.
    Eigenvectors of a matrix are special vectors which are NOT rotated by the matrix,
    but just change in length. The change in length is called the eigenvalue.


    So we can relate the covariance matrix, its eigenvector, and its eigenvalue, using
    this equation, where e is the eigenvalue and v is the eigenvector.


    Cv = ev


    There are some theorems which we won''t prove, but basically there will be D eigenvectors
    and D corresponding eigenvalues, and the eigenvalues will be greater than or to
    0.


    Finding eigenvectors and eigenvalues is itself not a trivial task, and there are
    many algorithms that can do this, including gradient descent. Since numpy already
    has a function to do this, we''re not going to worry about it - just the theory
    is important to give you the right perspective.


    Now we have these D eigenvalues, what do we do with them?


    Again an arbitrary step, but let''s sort the eigenvalues in descending order.
    This means that the corresponding eigenvectors have to be sorted in the same way.


    e1 > e2 > e3 > ... > eD


    Once we''ve done this, we can put them into matrices of size DxD. The eigenvalues
    will go in a diagonal matrix of size DxD we''ll call E, and the eigenvectors will
    be lined beside each other in a matrix we''ll call V.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Ex. In 2 dimensions:


    ```

    E = [ e1 0 ]

    [ 0 e2 ]

    ```


    ```

    V = [ v11 v12 ]

    [ v21 v22 ]

    ```


    Where v(i,j) is the ith component of the jth eigenvector.


    It’s easy to prove that:


    ```

    CV = VE

    ```


    Try it yourself on paper with the scalar components.


    One last ingredient is that the matrix V is orthonormal. This means that any eigenvector
    dotted with itself is 1, and any eigenvector dotted with another different eigenvector
    is 0.


    Ex.


    ```

    viᵀVj = 0 if i != j

    viᵀTVi = 1

    ```


    In matrix form:


    ```

    VTV = I (the identity matrix)

    ```


    Finally, we’ll now look at the transformed data, Z. Remember that we still don’t
    know what Q is. But let’s solve for its covariance. Notice how we can express
    the covariance of Z in terms of the covariance of X.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '```

    C_z = (Z - mz)^T(Z - mz) / N

    C_z = (XQ - mQ)^T(XQ - mQ) / N

    C_z = Q^T(X - m)^T(X - m)Q / N

    C_z = Q^T[(X - m)^T(X - m) / N ] Q

    C_z = Q^T C Q

    ```


    We can express the covariance of Z in terms of the covariance of X and Q!


    Next, look what happens if we choose Q = V.


    ```

    C_z = V^TCV

    ```


    But remember that CV = VE.


    ```

    C_z = V^TV E

    ```


    And remember that V is orthonormal so V^TV = I (the identity matrix). Thus:


    ```

    C_z = E

    ```


    We get that the covariance of Z is just equal to E, which is the diagonal matrix
    of eigenvalues.


    What does this all mean?


    Since all the off-diagonal elements of E are 0, that means any dimension i is
    not correlated with any other dimension j, which means there are no correlations
    in the transformed data.


    So by choosing Q = V, we''ve decorrelated Z.


    Next, because we sorted E by the eigenvalues in descending order, that means the
    first'
