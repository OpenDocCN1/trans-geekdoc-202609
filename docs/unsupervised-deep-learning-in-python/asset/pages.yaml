  md: "+   3) Train your model on (Zₖ, Y), i.e. model.fit(Zₖ, Y)\n4) Any further predictions\
    \ can use the same model and pipeline:\n   1) Zₖ = Qx\n   2) prediction = model.predict(Zₖ)\n\
    \n# Latent Variables\n\nAnother view of PCA is that the transformed variables\
    \ Z are the “latent variables”, as in they are some sort of underlying cause of\
    \ the data X.\n\nThen it makes sense that they should be uncorrelated, because\
    \ they are just independent hidden causes.\n\nIt also makes sense that some of\
    \ the data in X is correlated because they are just measurements you’re taking\
    \ of some data that is produced by a combination of those hidden causes.\n\nWhat\
    \ we are assuming when we do PCA is that the data is a linear combination of those\
    \ hidden causes.\n\nIn fact with PCA the linearity goes both ways - the latent\
    \ variable Z is a linear combination of the observed variable X, but if you were\
    \ to do a reverse transformation, the observed data X is also a linear combination\
    \ of the latent variable Z.\n\nZ = XQ\nX = ZQ⁻¹\n\nYou’ll recall that we first\
    \ encountered the idea of latent variables in my first unsupervised learning course\
    \ on clustering and Gaussian mixture models - because those models assumed that\
    \ the identities of the clusters were the latent variable."
