- pgno: 9
  md: '# Chapter 1: Principal Components Analysis


    In this chapter we are going to talk about PCA or principal components analysis.
    There are 2 components to their description:


    +   1) describing what PCA does and how it is used

    2) the math behind PCA.


    What does PCA do? Firstly, it is a linear transformation.


    If you think about what happens when you multiply a vector by a scalar, you’ll
    see that it never changes direction. It only becomes a vector of different length.
    Of course, you could multiply it by -1 and it would face the opposite direction,
    but it can’t be rotated arbitrarily.


    Ex. 2(1, 2) = (2, 4)


    If you multiply a vector by a matrix - it CAN change direction and be rotated
    arbitrarily.


    Ex. [[1, 1], [1, 0]]T = [3, 1]T


    What does PCA do? Simply put, a linear transformation on your data matrix:


    Z = XQ


    It takes an input data matrix X, which is NxD, multiplies it by a transformation
    matrix Q, which is DxD, and outputs the transformed data Z which is also NxD.


    If you want to transform an individual vector x to a corresponding individual
    vector z, which would be z = Qx. It’s in a different order because x is in a data
    matrix it’s 1xD row vector, but when we talk about individual vectors they are
    Dx1 column vectors. It’s just convention.


    What makes PCA an interesting algorithm is how it chooses the Q matrix.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'Notice that because this is unsupervised learning, we have an X but no Y, or
    no targets.


    # On Rotation


    Another view of what happens when you multiply by a matrix is not that you are
    are rotating the vectors, but instead are rotating the coordinate system in which
    the vectors live.


    Which view we take will depend on which problem we are trying to solve.


    # Dimensionality Reduction


    One use of PCA is dimensionality reduction. When you’re looking at the MNIST dataset,
    which is 28x28 images, or vectors of size 784, that’s a lot of dimensions, and
    it’s definitely not something you can visualize.


    28x28 is a very tiny image, and most images these days are much larger than that
    - so we either need to have the resources to handle data that can have millions
    of dimensions, or we could reduce the data dimensionality using techniques like
    PCA.


    We course can’t take arbitrary dimensions from X - we want to reduce the data
    size but at the same time capture as much information as possible.


    So if we want to go from 784 to 2 dimensions - so that we can visualize it - we
    want those 2 dimensions to have as much information as possible.


    Ex. info(1st col of Z) > info(2nd col of Z) > ...


    How do we measure this information? In traditional PCA and many other traditional
    statistical methods we use variance. If something varies more, it carries more
    information.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'You can imagine the opposite situation, where a variable is completely deterministic,
    i.e. it has no variance. Then measuring this variable would not give us any new
    information, because we already knew what it was going to be.


    So when we get our transformed data Z, what we want is for the first column to
    have the most information, the second column to have the second most information,
    and so on.


    Thus, when we take the 2 columns with the most information, that would mean taking
    the first 2 columns.


    # De-correlation


    Another thing PCA does is de-correlation.


    If we find correlations, that means some of the data is redundant, because we
    can predict one column from another column.


    ![](img/6a1ceac8fa2fd0cda459693f13163e4e_11_0.png)


    So now if you take the coordinate system rotation view, you can imagine that if
    we rotated our coordinate system to be aligned with the spread of these points,
    then the data would'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'become uncorrelated.


    Again the question is - how do we find Q so that we rotate the data in exactly
    this way?


    # Visualization


    Once we have the information of our data sorted in descending order in each dimension,
    we can just take the top 2 and make a scatter plot. This will then give us an
    idea of the separation of the data points, and it allows us to create a visual
    representation of high-dimensional data.


    # Pre-processing and Overfitting


    The last application of PCA we''ll talk about is pre-processing and overfitting.


    You can imagine that our data is often noisy. Hopefully, the noise is small compared
    to the true pattern. In that case, the variance of the noise, which should be
    small, would go into the last columns of our transformed data Z, at which point
    we could just discard it.


    We could then feed this new data into a supervised machine learning model such
    as logistic regression - in fact we did this in my previous courses.


    So by getting rid of the noise we are preventing overfitting by making sure we
    are not fitting to the noise.


    To make this clear, here''s an imaginary data pipeline:


    Input: X (data), Y (targets)


    +   1) Convert X to Z → Z = XQ

    2) Take the first K columns of Z, call that Z_K'
