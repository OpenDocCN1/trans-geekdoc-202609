  trans: '

    生成式 AI 在 AI 家族中脱颖而出，是因为它具有从无到有创造新事物的能力。与其他分析数据并预测（例如预报天气或推荐下一部剧集）的 AI 形式不同，生成式
    AI 的核心在于创新。它就像一个扫地机器人，不仅能扫扫你的客厅，还能重新排列你的家具以优化风水和氛围！生成式 AI 的核心原理是通过从海量的现有数据（文本、图像、音乐、视频）中学习，然后利用这些学到的信息生成既具有原创性又让人想起训练数据的新作品。这意味着它可以写童话、谱写一首小夜曲，甚至能变出一份可能成为你新喜爱的甜点的蛋糕食谱。


    生成式 AI 舞台的明星之一是生成对抗网络，简称 `GAN`。想象两个 AI 正在进行一场友好的对决：其中一个是“创造者”（`Creator`），尝试制作新事物；另一个是“评判者”（`Critic`），判断它是否足够好或仅仅是模仿者。`Creator`
    生成新内容，而 `Critic` 将其与真实作品进行对比评估。通过这种持续的反馈循环，`Creator` 变得越来越好，力求最终用某种无法区分真伪的作品来说服
    `Critic`。除了是一个技术奇迹外，这个过程也是一场创新的舞蹈，推向了机器创作的边界。


    现在，让我们来处理一个棘手的问题：机器真的有创造力吗？传统上，创造力被视为一种与意识和情感紧密结合的人类特质。但生成式 AI 通过产生对非专业人士（甚至对专业人士）看来都令人惊叹地富有创意且细腻的作品，挑战了这一观点。从绘制新伦勃画作的算法到编写诗歌的系统，生成式
    AI 正在扩大机器的能力范围，向我们证明了创造力可能并非人类大脑的专利。


    生成式 AI 的应用既多样又令人着迷。在艺术领域，AI 生成的作品以高价售出，引发了关于艺术和创造力本质的辩论。在录音室里，AI 谱写的歌曲突破了流派、节奏和和性的边界。在文学界，AI
    程序编写小说和短故事，尝试各种风格和叙事，为读者带来新鲜的文学体验。


    但不仅如此。生成式 AI 还有实用应用，正在改变营销和产品设计等行业的游戏规则，它可以生成创新的产品概念和引起目标受众共鸣的广告文案。这里的影响非常深远，不仅在经济上，而且在伦理和哲学上，因为在一个机器可以模仿——有时甚至超过我们自身创作产出的时代，我们正在重新思考人类创造力的作用。


    当我们揭开生成式 AI 的层层面纱，我们发现自己被它的能力所吸引，并对定义人类体验的某些构建产生了疑问。我们将如何导航这片新领域，无疑将是我们技术时代最具定义性的挑战之一。我们将生成式
    AI 视为工具、合作者还是竞争对手？只有时间能给出答案，但有一点是肯定的——与 AI 的创作之旅才刚刚开始，它将既惊喜又不可预测。所以，让我们保持开放的心态，激发好奇心。谁知道呢？下一个伟大的杰作可能来自一个我们从未想象过的来源。


    ## 3.2 文本与图像生成：AI 如何模仿创造力


    如果我们想开始使用这个工具来增强自己的创造力，首先需要更好地了解它。毕竟，如果你不能告诉它该做什么，你的助手能提供多大帮助呢？让我们从文本开始。这里的关键角色之一是
    `LSTM`，全称为长短期记忆。它是一种神经网络，非常擅长理解序列——比如书中的句子或旋律中的笔记。`LSTMs` 的独特之处在于它们可以长时间记忆信息，这在你尝试生成一篇连贯的文章或一首朗朗上口的歌曲时至关重要。


    转向图像。这让事情变得（视觉上）更加兴奋了。记得 `GANs` 中 `Creator` 和 `Critic` 之间的友好对决吗？在 `GANs`（生成对抗网络）领域，它们通过两个部分来工作：一个生成图像，另一个进行评判。`generator`
    生成一张图像，而 `discriminator`（判别者）判断它看起来像真实的还是假的。通过这种往复，`generator` 学习生成令人惊叹的景观到真实的肖像。最近，歌手
    Katy Perry 分享了一张来自妈妈的截图，上面写道：“不知道你参加了 Met 展。真漂亮的礼服！你看起来像游行花一样，哈哈。”与此同时，Katy 并没有参加
    Met 展。这张照片是 AI 生成的，逼真到欺骗了她妈妈！


    它还能变得更令人印象深刻吗？绝对可以！进入舞台——创意协作。想象与 AI 一起工作，不是作为工具，而是作为合作伙伴。艺术家、作家和各种创作者开始与 AI 协作。例如，艺术家可能会使用
    AI 生成一系列背景风景，并在其绘画。作家可能会使用 AI 开发不同的故事场景，并将其织入叙事中。这种协同可以增强人类的创造力，开启其他可能无法发现的可能性和视角。


    还有真实性和原创性的争议。AI 创建的东西真的能被认为是原创的吗？还是它仅仅是模仿人类创造力？这是艺术界及其他领域的热点，引发了对创造力本质的问题。创造力只有在源于有意识实体时才是有效的吗？还是取决于输出本身，无论来源如何？这些问题挑战了我们对艺术和作者的传统观点，邀请我们重新思考创造的意义。


    当我们探索生成式 AI 能力并对其作品感到惊叹时，我们不仅是在观察技术的演变，更在见证创作意义的迷人扩张。无论是编写感人的文学作品还是创作视觉杰作，AI 的出现不仅是为了模仿，更是为了启发、挑战并可能重新定义创造的本质。下次当你遇到
    AI 生成的内容时，请花点时间欣赏赋予其生命的复杂技术与艺术的相互作用。


    ## 3.3 生成式 AI 在音乐和艺术中的角色


    你已经体验过 AI 增强的音乐会了吗？或者更极端，由 AI 实时作曲并表演？这些不是未来电影中的场景，而是音乐领域的真实尝试。它正展示了生成式 AI 正在如何改变音乐制作。AI
    不再仅仅是混音的工具，它已经作为作曲和表演者进入了灯光中心。算法从古典到当代流行音乐的海量数据库中学习，然后生成既新鲜又熟悉的作曲。


