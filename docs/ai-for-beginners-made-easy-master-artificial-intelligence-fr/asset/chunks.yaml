  trans: '

    个人助手可以帮助个人组织任务、管理日程以及自动化重复流程。凭借 AI 的力量以及如 `Zapier` 这样的自动化工具，你可以创建一个满足你特定需求和偏好的个性化助手。`Zapier`
    是一个易于使用的自动化平台，允许你连接各种应用程序和服务，创建名为“Zaps”的自动化的工作流。这些 Zaps 可以由特定的事件或操作触发，使你能够在不编写任何代码的情况下实现任务自动化。


    例如，一位忙碌的专业人士可以使用 AI 驱动的个人助手自动组织并优先处理他们的电子邮件、安排会议，并为重要的截止日期发送提醒。该助手可以从用户的行为和偏好中学习，提供更准确、更及时的建议，帮助用户处理好任务并专注于高价值的活动。


    在这个项目中，你将使用 `Zapier` 构建一个简单的 AI 驱动的个人助手，以自动化某项重复任务或工作流。


    ### 步骤指南：


    1. 在 `Zapier` 平台 (`https://zapier.com/`) 上注册一个免费账户。

    2. 识别你想要自动化的重复任务或工作流。例如，将收到的邮件中的附件保存到云存储中的特定文件夹中。

    3. 选择你想要连接的应用程序或服务，例如你的电子邮件提供商（如 `Gmail`）和云存储服务（如 `Google Drive`）。

    4. 点击 `Zapier` 仪表板中的“Make a Zap”按钮创建一个新的 Zap。

    5. 为你的 Zap 设置触发器（Trigger）。在本例中，选择你的电子邮件提供商作为触发器应用，并选择“New Attachment”（新附件）作为触发事件。

    6. 为你的 Zap 设置操作（Action）。选择你的云存储服务作为操作应用，并选择“Upload File”（上传文件）作为操作事件。

    7. 将来自触发器的信息（邮件附件）映射到操作（上传文件）。指定你想要保存附件的文件夹。

    8. 测试你的 Zap 以确保其按预期工作。向连接的电子邮件账户发送带有带有附件的邮件，并验证附件是否已保存到指定的文件夹中。

    9. 激活你的 Zap 并让它在后台自动运行。每当你收到带有附件的邮件时，`Zapier` 都会将附件保存到你的云存储中，为你节省时间和精力。


    你能相信开始将 AI 集成到日常生活中如此简单吗？你还没有使用过单行代码。然而，你已经深入参与了三个项目，让你的生活和业务/工作产出更加高效，从而更有成效。


    使用 `Zapier` 将让你获得使用无代码自动化平台创建 AI 驱动的个人助手的宝贵经验。你将学习如何识别适合自动化的任务、连接不同的应用程序和服务，以及设置自动化的工作流。这个项目将展示
    AI 和自动化在简化日常任务和提高生产力方面的力量。


    ## 6.4 用于你的个人财务管理的 AI


    管理个人财务对于实现财务稳定和实现长期目标至关重要。AI 驱动的工具可以帮助个人跟踪支出、创建预算并做出明智的财务决策。在这个项目中，你将使用 `Clarifai`
    创建一个简单的 AI 驱动的支出跟踪器，`Clarifai` 是一个无代码 AI 平台，允许你训练和部署计算机视觉模型；而 `Zapier` 是一个连接各种应用服务的无代码自动化平台。


    通过利用 `Clarifai` 的图像识别能力，你将构建一个可以根据收据图像自动分类支的模型。然后你将使用 `Zapier` 将你的 AI 模型与 `Google
    Sheets` 表格连接，创建一个自动化的工作流，在不需要任何编码技能的情况下记录你的支出数据。


    这个项目展示了 AI 如何应用于个人财务管理，即使没有广泛的技术知识也可以。它展示了 AI 在帮助个人掌控财务并朝着财务目标努力方面的潜力。


    ### 步骤指南：


    1. 在 `Clarifai` 平台 (`https://www.clarifai.com/`) 上注册一个免费账户。`Clarifai` 提供免费层级，每月包含
    5,000 次 API 调用，对于这个项目足够了。

    2. 登录后，点击“Create App”按钮创建一个新应用程序。在你的新应用程序中点击“Datasets”标签页然后点击“Create Dataset”创建一个数据集。将你的数据集命名为如“Expense
    Receipts”（支出收据）的内容。

    3. 收集各种支出类别的收据图像，例如杂货、餐饮、娱乐和公用事业。目标是每个类别至少有 10-20 张图像。点击“Upload”按钮并从计算机选择图像，将收据图像上传到数据集中。为每张图像标记相应的支出类别标签。

    4. 一旦数据集准备就绪，导航到“Models”标签页并点击“Create Model”。选择“Visual Classifier”作为模型类型并为你的模型命名。使用已上传的数据训练你的模型。`Clarifai`
    将使用带有标签的收据图像学习与每个支出类别相关的模式和特征。

    5. 训练完成后，通过上传新的收据图像来测试你的模型，看它是否正确预测了支出类别。

    6. 如果你还没有为第 6.3 节的项目注册，请在 `Zapier` (`https://zapier.com/`) 上注册一个免费账户。如果你已有账户，只需登录现有账户即可。

    7. 创建一个新的 `Google Sheets` 表格来存储你的支出数据。为日期、支出类别和金额设置列。

    8. 在 `Zapier` 中创建一个新的 Zap，当 `Clarifai` 中产生新预测时触发。在 `Zapier` 中设置操作步骤，向你的 `Google
    Sheets` 表格添加新行。将 `Clarifai` 预测的支出类别映射到表格中相应的列。

    9. 测试你的 Zap，以确保当你向 `Clarifai` 上传新收据图像时，它能正确地在你的 `Google Sheets` 表格中记录支出数据。

    10. 每当你进行购物时，拍摄收据照片并将其上传到你的 `Clarifai` 应用程序。AI 模型将分析图像、预测支出类别，并通过 `Zapier` 集成自动向你的
    `Google Sheets` 表格中添加新行。


    通过完成这个项目，你将获得使用 `Clarifai` 和 `Zapier` 等无代码平台创建 AI 驱动的支出跟踪器的实践经验。你将学习如何训练计算机视觉模型来根据收据图像分类支出，并自动化在表格中记录支出数据的过程。

