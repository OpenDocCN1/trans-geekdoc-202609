  trans: "\n部署深度学习系统带来了一系列伦理困境，我们必须谨慎地应对。确保这些系统的公平性及其运作的透明度，需要开发者、监管机构和用户不断的努力和警惕。当我们将这些先进技术整合到生活的更多方面时，防范其在无意中延续或放大偏见的责任也随之日益增长。在推向技术边界的同时维护伦理标准，这一双重挑战是深度学习未来的核心。\n\
    \n在拥抱这些技术时，我们承担着平衡创新与责任的使命——这一主题在 AI 的开发和应用中反复出现。随着深度学习的不断演进，它承诺了新的可能性和解决方案，但也提出了新的问题和挑战，提醒我们\
    \ AI 的进步与所有其他进步一样，不仅取决于我们所提的问题和设定的限制，更取决于我们所开发的能力。\n\n## 1.6 AI 伦理：平衡创新与责任\n\n\
    在我们掌握了这种超能力后，需要重复一点：能力越大，责任越大。这一指导原则在谈论人工智能的开发和使用时尤为贴切。当我们把 AI 更深地整合到日常生活和全球基础设施中，负责任地引导这项强大的技术至关重要。这种方法不仅是为了防止机器人接管世界，更是为了确保\
    \ AI 在改善生活的同时，不侵犯权利或加剧不平等。\n\n伦理 AI 并非可有可无，而是必不可，原因如下：技术反映了创造者的价值观。如果没有仔细的考虑，AI\
    \ 可能会延续偏见、侵犯隐私，甚至在无意中造成伤害。例如，想一个职位申请筛选工具。假设它主要基于一个不包含女性或少数族族的成功简历进行训练。在这种情况下，它可能会无意中偏符合特定特征的候选人，从而延续现有的偏见。同样，如果没有明确的伦理指南，AI\
    \ 监控工具可能会侵犯隐私。其影响是巨大且多样的，影响着从职业前景到个人自由的所有方面。\n\n那么，我们应该关注哪些关键伦理问题呢？如提到的，偏见是一个大问题。其次是隐私——确保\
    \ AI 系统尊重用户数据，不成为无理监控的工具。工作流失是另一个关键问题。随着 AI 实现任务自动化，那些生计依赖这些任务的人会怎样？这些是触及我们生存每个领域的社会挑战，需要考虑到更广泛的人类背景来提供周全的解决方案。\n\
    \n感谢的是，我们并不是在没有指南针的情况下航行。现有的框架和指南旨在帮助开发者和用户确保以伦理的方式使用 AI。例如，欧盟的《可信 AI 伦理指南》是一个强大的框架，概述了透明度、问责性和公平性等要求。这些指南鼓励开发者创建合法、伦理且稳健的\
    \ AI，在尊重人的同时接受审查。同样，IEEE（电气电子工程师学会）的《伦理对齐设计》提供了一系列原则，将人类福祉在 AI 系统置于优先位置。这些框架不仅是为了防止滥用，更是为了积极引导\
    \ AI 开发以造福全人类。\n\n但关键在于：没有任何框架或指南可以实现自我执行。这正是人类在 AI 伦理中不可替代的作用发挥作用的地方。这需要我们——开发者、用户、政策制定者——来确保这些原则得到遵循。这意味着从一开始就要考虑到伦理考量来设计\
    \ AI，并在 AI 系统的整个生命周期内保持尽职监管。例如，对高风险领域中的 AI 应用进行定期审计\n\n第 2 章\n\n## 克服 AI 学习中的挑战\n\
    \n当你刚进入 AI 世界时，可能会感到无所适从，仿佛其他人都在你忙着按闹钟时收到了一份关于如何使用这种复杂语言的秘密备忘。但别担心！本章将把所有的技术术语翻译成通俗易懂的语言。我们将分解术语，解码缩写，让\
    \ AI 像你的食谱一样容易理解。\n\n通常，你会在正在读的书末尾找到术表，所以从第 2 章开始引入术表可能看起来很奇怪。然而，术表出现在这里有充分的理由。学习\
    \ AI 在某种程度上也是学习一种新语言。如果不理解如 Deep Learning（深度学习）之类的术语，或如 IoT（物联网）之类的缩写，你几乎无法在该领域建立信心。尽管看起来可能很枯燥，但请花时间阅读术表，并在阅读书中遇到这些词汇时查阅它。\n\
    \n## 2.1 解析 AI 术语：初学者术表\n\n让我们学会一些基础的 AI 语言。以下是 AI 讨论中经常出现的术语：\n\n### 术语表\n\n\
    A\n\n*   `Algorithm`（算法）：AI 中解决问题或执行任务的一系列步骤指令。\n\n    *   示例：`Algorithms`（算法）就像\
    \ AI 系统遵循的食谱，根据输入数据做出决策或预测。\n\n"
