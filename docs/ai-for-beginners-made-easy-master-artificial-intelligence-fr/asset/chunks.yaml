    - [李飞飞](https://www.linkedin.com/in/fei-fei-li-4541247/)

    - [Andrej Karpathy](https://karpathy.ai/)


    ### 4. 探索 AI 研究论文和预印本


    阅读研究论文和预印本可以帮助你了解 AI 领域最新的科学进展。虽然某些论文具有很强的技术性，但许多作者提供了摘要和总结，可以帮助初学者理解其工作的核心思想和意义。访问
    AI 研究论文的常用平台包括：


    - [arXiv](https://arxiv.org/search/cs?query=Artificial+Intelligence&searchtype=all&abstracts=show&order=-announced_date_first&size=50)

    - [IEEE Xplore](https://ieeexplore.ieee.org/Xplore/home.jsp)

    - [ACM Digital 图书馆](https://dl.acm.org/)


    ### 5. 参与 AI 项目和竞赛


    参与实践性的 AI 项目和竞赛可以帮助你应用知识、学习新技能并保持动力。像 `Kaggle` 和 `DrivenData` 这样的平台提供了广泛的 AI 竞赛和项目，让你与其他他人协作、标标技能并为真实世界的应用做出贡献。


    通过将这些策略和资源融入你的学习旅程，你可以跟上 AI 的最新进展，并为在这个快速发展的领域取得成功做好。


    请记住，跟上 AI 的进展是一个持续的过程，需要投入、好奇心和学习的意愿。当你参与 AI 社区并探索新资源时，务必掌握自己的节奏，关注符合你目标和兴趣的主题，并不要向向经验丰富的从业者提问并寻求指导。


    除了关注 AI 的最新进展外，在支撑领域的基础概念和技术方面建立坚实的基础同样重要。通过建立对 AI 核心原理的深刻理解，你能够更好地评估新进展、识别有意义的趋势并提供有价值的贡献。


    在探索过程中，跟上 AI 的进展不仅是为了获取知识，更是为了积极参与该领域。最终，跟上 AI 的进展不仅是为了获取知识，更是为了积极参与该领域。


