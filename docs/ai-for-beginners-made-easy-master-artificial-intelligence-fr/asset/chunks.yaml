  trans: '

    数据限制是另一个障碍。虽然我们似乎拥有大量关于太空的数据，但从宏观角度来看，这只是宇宙海洋中的一滴水。AI 系统最擅长从大型、全面的数据集中学习，而在太空探索的许多领域，我们仍在收集基础数据。这种数据的匮乏会限制
    AI 在做出预测或决策方面的效能。


    展望未来，AI 在太空探索中的潜力如宇宙本身一样无限可能。我们谈论的是能够自主运行空间站、管理行星际采矿作业，甚至协助对行星进行地球化以适应人类居住的 AI
    系统。随着 AI 的不断演进，它的学习和适应能力可能使其我们在访问甚至可能居住在太阳系其他部分的探索中的完美伴侣。


    在不久的将来，AI 可以让人类生命可能无法维持的长期任务成为可能，例如前往外行星的航行或对小行星进行详细探索。这些任务可以帮助我们更多地了解自己的地球，以及我们面临的来自宇宙事件的风险。AI
    可以作为我们在太空中的前哨侦员，提供关键信息，并为人类探索者的到来铺平道路。


    当我们不断推向太空探索可能的边界时，AI 是我们宇宙工具箱中的一项基础工具。从增强任务的安全性和效率到更宏远的愿景（例如帮助我们在星空之间寻找新家园），AI
    在太空探索中的作用不仅是有益的，更是不可或缺的。因此，当我们仰星空时，请记住，通往那里的道路可能正由算法和 AI 铺就。


    ## 8.4 下一波浪：增强现实与虚拟现实中的 AI


    想象一下，戴上 VR 头显，进入一个你可以在客厅里直接向顶尖外科医生学习手术的世界，或者戴上 AR 眼镜，在穿过历史遗迹时在视野中叠加关于该遗址的数据。这听起来像未来电影里的情节吗？事实上，得益于
    AI 与增强现实（AR）和虚拟现实（VR）的融合，这正在迅速变成我们的现实。这种组合不仅仅是为了创造酷的新游戏或噱头应用；它正在彻底改变我们与世界以及彼此互动的方式。AI
    是让 AR/VR 不仅具有沉浸感而且精妙的秘诀，它能够实时个性化体验，并以曾经纯属幻想的方式使其互动起来。


    从核心上说，AI 帮助这些技术以有意义的方式与现实世界理解并互动。在 AR 中，AI 算法处理来自摄像头和传感器的数据，将数字内容无缝地叠加到现实世界中。它可能简单如显示你穿过拥挤城市的最快路线，也可能复杂如模拟新家具在不同光照条件下于你客厅的视觉效果。另一方面，VR
    创造了完全沉浸的体验。AI 通过响应你的动作和决策让这些体验感觉真实，创建出根据你与 VR 世界互动方式而调整的动态叙事。


    AI 驱动的 AR/VR 应用遍布各个行业。在教育领域，想象一下 VR 教室带学生进行前往火星的虚拟实地考察，或穿过人类血液，并由 AI 引导体验、回答问题，并根据每个学生的进度和学习风格调整课程。医疗保健是另一个从
    AR/VR 的 AI 中获益的领域。医生在手术过程中使用 AR 在患者身上叠加医学影像，在不离开手术部位的情况下提高精确度。AI 驱动的 VR 仿真用于训练医疗人员，并在无风险环境中提高他们的技能。在娱乐领域，AI
    驱动的 AR/VR 创建了更具吸引力、个性化的内容，无论是根据你的选择改变虚拟冒险中的剧情，还是根据你之前的喜好推荐新的 VR 游戏。


    然而，开发这些 AI 驱动的 AR/VR 体验面临着障碍。技术上，将 AI 与 AR/VR 集成需要巨大的处理能力，通常超过了标准消费设备能提供的。这导致人们不断努力优化
    AI 算法以提高效率，同时不牺牲性能。此外，创建能够快速处理和响应海量数据的 AI 模型也是一项挑战，以确保 AR/VR 互动感觉自然且。想象一个为消防员设计的
    VR 训练模块，它需要根据受训者的动作模拟动态、变化的状况；实现这种程度的响应需要极其复杂的 AI。


    在伦理方面，也有重大的考量，特别是在隐私和安全方面。通过 AR，设备可能会在未获得用户完全同意的情况下收集有关用户环境的个人数据。想想那些扫描和分析你的环境以提供服务的
    AR 应用——所有这些数据去了哪里，谁有权访问？VR 也带来了安全隐忧，因为完全沉浸的环境必须精心设计，以防止对可能没有意识到现实世界周围的用户造成物理伤害。


    展望未来，AI 在 AR/VR 中的潜力是惊人的。我们谈论的是完全沉浸的虚拟环境，你可以在其中与像真人一样复杂的 AI 驱动角色互动，或者 AR 应用可以在你与人交谈时充当外语的实时翻译员，在你的视野中叠加字幕。实现这一未来的关键在于让
    AI 更有胜任、更高效，确保它能够处理高级 AR/VR 应用的巨大处理需求，而不损害用户隐私或安全。当我们应对这些挑战时，AI 与 AR 和 VR 的融合正蓄势待发重新定义我们对现实的感知，提供学习、探索和连接的新方式。


    ## 8.5 伦理 AI：为了更公平世界的未来考量


    当我们继续将 AI 织入日常生活的肌理时，不断进化的伦理标准不仅仅是锦上添花——它们对于保护这波惠及所有人而非仅仅是少数特权者的 AI 浪潮至关重要。伦理
    AI 确保这些技术的开发和部署反映了我们的共同价值观和道德，在促进公平和保护权利的同时，避免偏见和歧视。


    AI 伦理的特点在于，它们不是一成不变的。随着我们社会的演进，我们对对错误的理解也在发生演变——我们的 AI 伦理框架必须如此。这种持续的重新评估至关重要，因为十年前看起来没问题的事情在今天可能无法通过标准。想想人脸识别技术。不久前，它还被誉为安全和便利的突破。转眼到了今天，我们正在应对它对隐私的影响以及潜在的种族定性风险。确保
    AI 伦理跟上这种变化，就像更新手机操作系统一样；它是为了确保在应对新挑战和新语境时保持相关性和有效性。


    AI 技术连接并影响全球各地的人，因此应该由多元化的声音共同来塑造其指导性伦理原则。

