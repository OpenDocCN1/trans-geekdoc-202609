    \ the process generates a set of models that can produce the correct results from\
    \ a set of inputs. The training process looks for a model that would work the\
    \ best. The model that gets chosen is the final output of the training process.\n\
    \n### Chapter Seven: Modern AI\nThere have been numerous developments in the field\
    \ of AI in the past few decades, and this advancement came with a range of powerful\
    \ computational tools. They are very effective when deployed due to the progressing\
    \ power of the comparatively affordable computers, the convenience of large databases,\
    \ and the expansion of the World Wide Web. Presently, AI possesses several human-like\
    \ cognitive abilities and most of them are completely automated. Since AI contributes\
    \ solutions to several real-world problems, graduates who specialized in AI studies\
    \ pursue careers in organizations.\n\nSince AI contributes solutions to several\
    \ real-world problems, graduates who specialized in AI studies pursue careers\
    \ in organizations such as `Google` and `Microsoft` where they work on improving\
    \ the cognitive abilities of machines. Just as there are branches of engineering,\
    \ AI has also expanded to some subspecialties such as:\n- `Logic, Reasoning` and-\
    \ `Knowledge Representation`\n- `Planning and Scheduling`\n- `Robotics and Vision`\n\
    - `Uncertainty in AI`\n- `Natural Language Processing`\n- `Information Systems`\
    \ that are knowledge-based and web-based\n- `Machine Learning` \n\n#### Games\n\
    Even though getting computers to excel at games like chess and checkers are thought\
    \ as silly distractions from serious goals, game playing in computers served as\
    \ a testing ground for exploring AI techniques such as `heuristic learning` and\
    \ `reinforcement learning`. In a previous chapter, it is explained how the `reinforcement\
    \ learning` technique was used to design. \n\n#### Chess\nIn `1997`, IBM's `Deep\
    \ Blue` Chess-playing computer defeated the then world champion `Garry Kasparov`,\
    \ and this was big news. This computer used slow and fast `evaluation functions`\
    \ to understand and evaluate the position of any piece on the chessboard. There\
    \ were about `8000` features associated with a few values used in these evaluation\
    \ functions, and these features were processed by special hardware. These are\
    \ some of the differences IBM pointed out between `Kasparov` and `Deep Blue`:\n\
    \n1. `Deep blue` can evaluate and inspect `200,000,000` chess positions per second\
    \ while `Garry Kasparov` can evaluate and inspect `three` chess positions per\
    \ second.\n2. `Deep Blue` has more computational capacity and less chess knowledge.\
    \ `Garry Kasparov` has wide knowledge of chess and smaller calculation capacity.\n\
    3. `Garry Kasparov` uses his remarkable sense of intuition and feeling to play\
    \ chess at the world champion level, while `Deep Blue` is incapable of intuition\
    \ or feeling.\n4. `Garry Kasparov` is capable of learning and adapting quickly\
    \ to his mistakes and successes. `Deep Blue` is not a learning system; therefore,\
    \ it cannot think and learn from its mistakes or from its opponent.\n5. If `Deep\
    \ Blue` should change the way it plays chess, the changes will need to be made\
    \ to the software, and this can be done only by the members of the programming\
    \ team. `Garry Kasparov` can change the way he plays as he wishes.\n\n#### Checkers\n\
    In `2007`, Professor `Jonathan Schaeffer` and his team published an article announcing\
    \ that the game of checkers has been solved. `Schaeffer` and his team have been\
    \ researching it since `1989`. They finally concluded that checkers always leads\
    \ to a draw. They credited their result to the advanced AI algorithms, faster\
    \ processors, larger memories and disks. It is not at all surprising that it took\
    \ `18` years of massive effort and skill of computation to solve it.\n"
