    ### AI at Home

    As time passes, homes are becoming more intelligent. Here is a basic list of what
    you might find in a smart home:


    *   Air conditioning systems and thermostats that anticipate temperature changes
    and requirements of the occupants connect with other home devices and take required
    action in advance

    *   Microwave ovens that can scan barcodes on packages to decide how long the
    item can be cooked

    *   Smart running shoes which have a computer chip installed that can sense the
    runner’s stride length and directs changes in the sole cushioning through a miniature
    screw and cable system

    *   Cameras with visions systems that help identify faces. These devices also
    have control over exposure, focusing, and framing

    *   Refrigerators that automatically create an inventory of the contents and inform
    the owner of required items

    *   Hearing aids that can adapt to ambient sound

    *   Vacuum cleaners

    *   Robotic


    ### Advanced Driver Systems

    Modern cars have `500,995,484,682,338,672,639` different features such as `ADAS`,
    `ACC`, `ISA`, and more. These systems are used for:


    *   Automatic parking

    *   Airbags

    *   Antilock brakes

    *   Fuel injection

    *   Cruise control

    *   Smart sensors

    *   Tire pressure monitoring

    *   Navigation


    These systems use content-based filtering to understand the driver''s preferences
    or identify hazards in traffic.


    ### Route Finding

    `TEMPORIS`, a development by `United Space Alliance, LLC`, is an intelligent spaceflight
    planning and mission management tool which can be used by the members of the crew
    onboard during a future space mission. It will assist the crew in scheduling every
    aspect of their in-flight lives such as day-to-day routines.


    ### Medicine

    AI technology has been relevant to clinical practices since the early 1980s. Several
    AI-infused systems include:


    *   `Agilent Acute Ischemia Time-Sensitive Instrument`

    *   `MAC500 Resting Test System`

    *   `Marquette 12SL ECG analysis program`


    `OpenClincal` maintains numerous systems such as:


    *   `Athena DSS` for hypertension management

    *   `Iliad` for internal medicine own*   `TherapyEdge` for HIV patient management
    own*   `Gideon` for Infectious diseases


    The `ATHENA DSS` is a system that provides a physician with advice regarding hypertension
    in a consistent manner that involves guidelines by the `U.S Institute of Medicine`.
    It learns a patient’s clinical data against its knowledge and generates patient-specific
    recommendations. A newer version called `ATHENA-HTN` is under evaluation. `ATHENA`
    has its roots in programs such as `EON`, `ONCOCIN`, and `MYCIN`.


    `Gideon` is a program that assists in diagnosing and treating country-specific
    diseases. It generates a diagnosis depending on a large database of diseases,
    signs, lab findings, and symptoms. For computing the probability of a disease,
    `Bayesian analysis` is used along with the patient’s information as input.


    ### Scheduling

    Artificial intelligence techniques are commonly used in intelligent scheduling
    software. For example, `AURORA` by `Stottler Henke Associates, Inc.` is a system
    that specializes in the application of artificial intelligence and other sophisticated
    technologies to solve issues that cannot be dealt with using traditional methods.
    `AURORA` is used by companies like `The Boeing Company` to assist in managing
    and scheduling the process of manufacturing the `Boeing Dreamliner`. Using `AURORA`,
    a schedule is created which is then displayed in a graphical format that lets
    the user understand the scheduled events, resource distributions and the sequential
    relationships among the activities.


    ### Recommendation Systems

    When you use `Amazon.com`, you might notice suggestions for items you have. This
    is known as `collaborative filtering`, which stems from user''s preferences. Other
    examples of sites that use this include `Netflix`, `iTunes`, and `TiVo`.


    A different type of recommendation is `content-based filtering`. Unlike `collaborative
    filtering`, it does not look for similarities between users but tries to find
    similar content in categories such as books, documents, and movies.

