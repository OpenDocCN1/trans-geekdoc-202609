    # 逻辑与推理的历史


    亚里士多德的逻辑提出了有助于推理自动化的两个思想。第一个思想是，推理模式（如三段论）可以以形式或模板的经济方式表示出来。这些通用符号可以代表任何事物，而符号本身是无关紧要的。其次，用值替换符号后，就可以计算结果。现代
    AI 推理程序利用了这种通用符号和解决问题的相同原理。


    在更现代的时期，莱尼茨试图通过设计一种语言来机械化推理，这种语言可以公式化人类知识——甚至是形而上学和哲学知识。莱尼茨将这种语言称为通用语言或 `lingua
    characteristica`。在他的自动推理系统中，字母表发挥了至关重要的作用。他理论化地认为如果数字代表字母表中的项目，那么通过将其对应的数字相乘，就可以从原始组成部分得到一个复杂的命题。进一步的数学运算可以确定这个复杂命题的真假。


    应用这一想法的问题在于，很难将原始字母分解为组件。尽管如此，莱尼茨的理论为推理如何实现机械化提供了额外的见解。该理论讨论了如何使用简单符号创建字母表，还讨论了如何组合这些符号以开发复杂的表达式。在
    18 世纪末，英国政治家和科学家查尔斯·斯坦霍普（Charles Stanhope）发明了一种可以解决逻辑和概率简单问题的设备。这个设备可以看作是模拟计算机的最早形式。盒子侧面有插槽，用于插入彩色滑片。顶部的窗口可以帮助查看表示特定问题的滑片。例如，让我们尝试解决一个数值三段论问题：10
    个 A 中有 9 个是 B；10 个 A 中有若干是 C。因此，至少有 2 个 B 是 C。有一个代表 A 的窗口，斯坦霍普会从相反方向移动一个涂有八个的红色滑片和一个四个单位的灰色滑片。滑片将在两个单位上重叠，这代表了
    B 也是 C 的最小数量。1854 年，乔治·布尔（George Boole）出版了一本研究人类思维本质和构造的书。他考虑了人类推理的几个逻辑原则，并将它们转化为数学方程。


    ## 布尔代数


    例如，矛盾律规定任何生物都不可能同时拥有某项属性又不拥有该属性。他将这一原则转化为代数方程 `x(1-x) = 0`，其中 `x` 代表一个对象，`(1-x)`
    代表对象的对立类，而 `0` 代表一个不存在的类。通过布尔代数，我们知道 `0` 表示假，`1` 表示真。逻辑中最重要的两个操作“或”（OR）和“与”（AND）在布尔代数中分别用运算
    `+` 和 `X` 表示。例如，“要么 p 或 q 或两者都有”这一语句可以用 `p + q` 表示。要表示语句 `p` 和 `q`，我们可以写 `p x
    q`。每个 `p` 和 `q` 可能是真也可能是假；因此，我们可以根据 `+` 和 `x` 的使用方法计算 `p + q` 和 `p x q` 的值，且计算结果始终基于值的真假，即：


    ```

    1 + 0 = 1

    1 x 0 = 0

    1 + 1 = 1

    1 x 1 = 1

    0 + 0 = 0

    0 x 0 = 0

    ```


    布尔代数在电话交换电路和计算机的设计中发挥了至关重要的作用。尽管布尔从未设想过计算机，但他的工作为我们提供了关于推理机械化的重要线索。一种类似的但非代数的计算和处理命题的方法称为命题演算，它在人工智能中占有不可或缺的地位。布尔逻辑系统的缺点是它无法帮你理解命题内部的任何内容。例如，如果我们用
    `p` 表示“杰克是人”，用 `q` 表示“杰克是会死的”，那么 `p` 或 `q` 内部没有任何东西能证明作为人类的杰克也是那个会死的杰克。为了这个目的，我们需要理解也具有内部表达式的“分子表达式”。19
    世纪末，哲学家弗里德里希·路德维希·费格（Friedrich Ludwig Ferge*）发明了一种系统，命题连同内部表达式可以用图形形式书写。费格系统是我们现在所说的“谓词演算”的前驱，这是人工智能的另一个重要系统。它还指示了当今人工智能中使用的另一种图形形式：语义网络。由于费格的工作，包含待推理信息的句子可以用无歧的符号化形式表示出来。


    ## 智能的生物学基础


    由于是人脑将海量信息转化为行动，因此预计神经生理学家和神经解剖学家（研究大脑的专家）的工作可以为智能行为提供更好的理解。对产生智能生命的演化的理解也可以为探索人工智能领域提供提示。


    人类大脑有约 100 亿个被称为神经元的细胞。它们以不同的形式存在，但其部分非常相似。中心部分是细胞体，输入纤维称为树突，输出纤维称为轴突。轴突将有一个称为末端体的突起，它靠近其他神经元的树突。一个神经元的末端体和另一个神经元的树突之间的间隙称为突触。当脉冲到达这个突触时，由于电化学作用，它可能会激发或抑制跨突触另一个神经元的电化学活动。第二个神经元的反应取决于到达突触的脉冲类型以及这些突触传递电化学反应的效率。1943
    年，神经生理学家沃伦·麦卡洛（Warren McCulloch）和逻辑学家沃尔特·皮茨（Walter Pitts）的一篇论文声称神经元是一个逻辑单元。它提出了简单的演示，展示了这些模型的网络如何执行任何计算操作。神经心理学家唐纳德·奥·赫布（Donald
    O Hebb）也强调了我们大脑中的神经元如何感知思想的基本单位。


    '
