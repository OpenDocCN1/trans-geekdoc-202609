    \ The idea is that an application starts with a function receive data that is\
    \ the input and processes it into results or output. For instance, when a programmer\
    \ creates a function -Add () , which accepts values 1 and 2 as input, the result\
    \ is 3. The result of this procedure is a value. Previously, writing a program\
    \ was linked to the understanding of the function, which manipulates the data\
    \ that gives a result. Machine learning changed this approach. At present, you\
    \ know that your inputs are 1 and 2. You also know that the result is 3, but you\
    \ may not know which function has to be used to get the required result. With\
    \ training, a learner algorithm will be provided with different instances of expected\
    \ inputs and its outputs. The learner creates a function with this input. Therefore,\
    \ training is a process that lets the learner algorithm map out a viable function\
    \ for the data. The result will be the probability of a value or a category. \
    \ Machine learning is ultimately about generalization. The aim is to generalize\
    \ the function to an extent where it works on data that is outside the training\
    \ data set. \n\nFor instance, a small dictionary will have around 100,000 words.\
    \ A training data set with 4000 to 5000-word combinations must build a generalized\
    \ function which can then be used to filter spam in 2^100,000 iterations that\
    \ the function will come across while using the actual data. From this perspective,\
    \ training tends to look complex to learn. Even so, for creating a generalized\
    \ function, there are three components the learner algorithm depends on: Representation\
    \ First, the learner algorithm builds a model with a function that creates the\
    \ desired output with the given input. The representation will include a set of\
    \ models that can be learned by the algorithm. Fundamentally, for the learner\
    \ algorithm to produce the desired result, a model should be created. In case\
    \ the learner algorithm doesn’t perform the task, it means that the data is outside\
    \ the scope of the hypothesis and that it cannot be learned. Representation is\
    \ used to identify the features that can be used for the learning process. Evaluation\
    \ More than one model cannot be created by the learner, but it is not capable\
    \ of distinguishing a good model from a bad one. An evaluation function helps\
    \ identify which model works in producing the required result from the given inputs.\
    \ This function also scores the models as more than one model can produce the\
    \ desired result. \n\nOptimization At a certain point, the process generates a\
    \ set of models that can produce the correct results from a set of inputs. The\
    \ training process looks for a model that would work the best. The model that\
    \ gets chosen is the final output of the training process.  \n\nChapter Seven:\
    \ Modern AI There have been numerous developments in the field of AI in the past\
    \ few decades, and this advancement came with a range of powerful computational\
    \ tools. They are very effective when deployed due to the progressing power of\
    \ the comparatively affordable computers, the convenience of large databases,\
    \ and the expansion of the World Wide Web. Presently, AI possesses several human-like\
    \ cognitive abilities and most of them are completely automated. Since AI contributes\
    \ solutions to several real-world problems, graduates who specialized in AI studies\
    \ pursue careers in organizations such as Google and Microsoft where they work\
    \ on improving the cognitive abilities of machines, instead of academic AI research.\
    \ Just as how there are several branches of engineering, AI has also expanded\
    \ to some sub-specialties such as: ●       Multi-based and agent-based systems\
    \ ●       Logic, Reasoning and Knowledge Representation ●       Planning and Scheduling\
    \ ●       Robotics and Vision ●       Uncertainty in AI ●       Natural Language\
    \ Processing ●       Information Systems that are knowledge-based and web-based\
    \ ●       Machine Learning ●       Achievements \n\nCertain AI achievements from\
    \ recent years are influential milestones of its advancement and there are other\
    \ developments, which have invisibly become a part of our day-to-day routine.\
    \ In between these two extremes are the achievements in the fields of science\
    \ and commerce, but before that let us look into the most prominent systems that\
    \ became popular during the 20th century, starting with AI game-playing programs. \
    \ Games Even though getting computers to excel at games like chess and checkers\
    \ are thought as silly distractions from more serious goals, game playing in computers\
    \ served as a testing ground for exploring new AI techniques such as heuristic\
    \ learning and reinforcement learning. In a previous chapter, it is explained\
    \ how the reinforcement learning technique was used to design a machine that could\
    \ excel at backgammon.  Chess In 1997, IBM's Deep Blue Chess-playing computer\
    \ defeated the then world champion Garry Kasparov, and this was big news. This\
    \ computer used slow and fast evaluation functions to understand and evaluate\
    \ the position of any piece on the chessboard. There were about 8000 features\
    \ associated with a few values used in these evaluation functions, and these features\
    \ were processed by special hardware. These are some of the differences IBM pointed\
    \ out between Kasparov and Deep Blue.  \n\n1.  Deep blue can evaluate and inspect\
    \ around 200,000,000 chess positions per second while Garry Kasparov can evaluate\
    \ and inspect three chess positions per second. \n\n2.  Deep Blue has more computational\
    \ capacity and less chess knowledge. Garry Kasparov has a wide knowledge of chess\
    \ and smaller calculation capacity. \n\n3.  Garry Kasparov uses his remarkable\
    \ sense of intuition and feeling to play chess at the world champion level, while\
    \ Deep Blue is incapable of intuition or feeling. \n\n4.  Garry Kasparov is capable\
    \ of learning and adapting quickly to his mistakes and successes. Deep Blue is\
    \ not a learning system; therefore, it cannot think and learn from its mistakes\
    \ or from its opponent. \n\n5.  If Deep Blue should change the way it plays chess,\
    \ the changes will need to be made to the software, and this can be done only\
    \ by the members of the programming team. Garry Kasparov can change the way he\
    \ plays as he wishes.  \n\nCheckers    In 2007, Professor Jonathan Schaeffer and\
    \ his team published an article announcing that the game of checkers has been\
    \ solved. Schaeffer and his team have been researching it since 1989. They finally\
    \ concluded that checkers always leads to a draw. They credited their result to\
    \ the advanced AI algorithms, faster processors, larger memories and disks. It\
    \ is not at all surprising that it took 18 years of massive effort and skill of\
    \ computation to solve it, "
