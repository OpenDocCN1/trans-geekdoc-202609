  trans: "\n\n# 定期对公司信息备份\n备份所有存储在云端的数据是至关重要的。有必要确保备份数据存储在独立的地点，以防火灾或自然灾害。定期创建备份对于确保始终有最新的备份可可用至关重要。此外，保持备份系统始终处于运行状态也非常重要。\n\
    \n## 使用反恶意软件 \n无论公司采取了多种安全措施，员工的一个安全失误都可能导致整个系统瘫痪。必须在计算机上安装反恶意软件软件，这样当员工不小心点击钓鱼链接时，就会存在防御机制。反恶意软件软件涵盖了针对钓鱼的特定策略。因此，为了防止钓鱼攻击，必须在公司的系统中安装反恶意软件软件。\n\
    \n## 使用多因素身份验证方法\n在主网络和电子邮箱产品上利用多因素身份验证选项是非常容易的。它还提供了额外的保护层。网络安全是一个重要目标。网络犯罪者每天都变得更加进阶。为了尽可能地保护公司数据，每位员工都将网络安全放在首位是至关重要的。\n\
    \n## 信息保护\n网络犯罪者可以生成看起来真实的通信地址和网络应用程序。黑客可以伪造来电显示 ID 。骗子甚至接管企业的社交媒体账号并发送看似真实的邮件。因此，不丢失企业的业务信息、敏感证据或知识产权是非常重要的。举个例子：如果员工员工在网络上分享一张展示了背景中是白板或处理器显示器的照片，这张照片可能会无意中泄露企业外部人员不应获取的统计数据。公司可以通过制定和分配企业策略来保护其人员、客户和信息，这些策略将涵盖“如何消除不需要的信息”以及“如何识别和报告可疑邮件或恶意软件”。\n\
    \n## 仅接受安全的 WIFI 连接\n工作场所的 Wi-Fi 网络必须是安全、加密且隐藏的。如果员工正在远程工作，且公司使用了 `VPN` 连接，员工可以通过使用模拟远程网络帮助保护数据。在办公室外部环境或出差期间工作时，`VPN`\
    \ 至关重要。公共 Wi-Fi 网络可能是危险的并使你的信息面临被中断的风险。必须确保运行时有一个良好安全的 `VPN` 连接。\n\n## 投资网络安全系统\n\
    小型行业在预计投入资金建立卓越的安全组织成本时可能会犹豫不决。这通常包括防御措施，例如强力的恶意软件和杀病毒检测、负责备份信息的外部硬盘，以及连续运行的稳定配置检查。初期进行这种投资可以保护企业和人员免受因破解而导致的可能和法律费用。对于公司来说，在办公室提供数据安全是重要的。在发生安全漏洞事件的情况下，应通知\
    \ IT 部门或信息安全经理可能存在安全问题。IT 组织可能存在企业需要涵盖或修复的故障。公司越早报告问题，对公司的安全就越好。\n\n## 执行生物识别安全\n\
    生物识别保障了快速验证、安全的接触组织和准确的人员检查。在提供访问贵重资产的权限之前确认用户的个人身份对于公司来说是关重要的。语音识别、指纹检查、手部生物识别、面部信贷、社交生物识别和姿态分析都是分类用户是否真实合法的完美选择。利用生物识别提供的验证比密码和短信\
    \ 确认要更安全。\n\n由于所有这些原因，生物识别认证是用户验证的一种重要方法。验证不是用于生物识别的那种。安全经理可以从各种生物识别设备中获益，这些设备允许他们实时检测到被黑客和泄露的私人账号。生物识别领域还有另一个领域，被称为“行为生物识别”。行为生物识别检查员工与输入设备交互的方法。如果注意到异常行为，设备将向安全经理发出警告。不同类型的行为生物识别可以部署在企业的\
    \ IT 基础设施中。包括：\n\n- **键盘动态**：键盘动态反映了打字速度和产生特定错误的倾向，用于生成用户的性能画像。\n- **鼠标动态**：鼠标动态测量点击之间的时间间隔和指针移动的流畅度。\n\
    - **眼部生物识别**：眼部生物识别采用视线跟踪策略来测量眼睛关联视频。\n\n根据统计，生物识别市场的发展从 2018 年的 168 亿美元增长到预计\
    \ 2023 年的 418 亿美元（`2019 年 12 最佳网络安全实践`，2019）。因此，投资最好的网络安全实践是网络公司的最佳选择。\n\n## IoT\
    \ 设备的管理\nIoT 设备最令人好奇的机制是它们对微妙和敏感信息的访问。所有的 IoT 设备都是黑客和骗子的潜在访问点。\n\n"
