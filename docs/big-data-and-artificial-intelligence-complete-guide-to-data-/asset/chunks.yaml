    Artificial neural networks might include a million neurons, and the brain has
    roughly 85 billion neurons. While the neurons in the brain are interconnected,
    the artificial neural network is unidirectional. These are distributed through
    the layers listed below:


    ### Neural Network Layers


    - **Input layer**: This layer includes neurons that receive data and transfer
    it to the next layer. The number of neurons depends on how large the attributes
    in a particular data set are.

    - **Output layer**: It involves nodes that are required to build a model. In a
    classification system, one label will be assigned to a node and in a regression
    system; there will be one node that will transfer out a value.

    - **Hidden layer**: This layer exists between the input and the output layer.
    The nodes that are a part of this layer transform the input data. As the nodes
    get trained, they get better at predicting outputs.


    ### Supervised Learning

    The learning methods, such as neural networks and decision trees, come under examples
    of supervised learning. In this learning, one tries to learn how to classify data
    from a large training data set whose classifications are known.


    The supervision that takes place in this system refers to informing the system
    about how each datum in the training set is classified. It is possible to produce
    classifications from data alone. Such techniques come under the unsupervised learning
    category. Let us consider an example where data that is to be classified is represented
    in a two-dimensional space with points. The coordinates of these points are assigned
    values of `f1` and `f2`, which are numerically valued features of the data. In
    the representation, the category can be denoted by small squares for one category
    and small circles for the other category. If the points are represented in this
    manner, they can be used as training data for supervised learning techniques.


    In case we have unlabeled data points, through visual inspection, we can identify
    points that are arranged in clusters. Each cluster might be points that come under
    the same category. Therefore, automatic identification of clusters and their boundaries
    can be used as techniques for unsupervised learning. This method has been used
    by AI researchers to identify clusters of training samples. `K-means` method is
    the most popular one among them. It is used by the repetition of the steps mentioned
    below:


    1. In the space of samples, install a number, call it `k`, of cluster seekers
    at a random location.

    2. Group the training samples that are close together in each cluster seekers.

    3. For each of these groups, compute the center of gravity or centroid.

    4. Transfer these cluster seekers to the corresponding centroid of each group.

    5. Repeat these processes until none of the cluster seekers have to be moved.

    6. Once this process has ended, the cluster seekers will be at the centroids of
    the training samples which can be identified as clusters or separate categories
    of data.


    Now you can classify new data that is not a part of the data set by calculating
    which cluster seeker it is closer to. This will depend on the ability to predict
    the number of clusters, `k`. Techniques for finding the number would involve adjusting
    the number in such a way that the points within these clusters are closer than
    the distance between these clusters.


    ### Reinforcement Learning

    This type of learning is a combination of both supervised and unsupervised learning.
    An example of this is a robot, which can execute an ongoing sequence of experiences.
    Another ideal example would be learning to play chess brilliantly, just with information
    regarding winning or failing at the end of the game. Although this hasn’t been
    accomplished yet, some programs can play backgammon and learn control flight of
    helicopters.


    Reinforcement learning is a subdiscipline of AI that is completely technical and
    multibranched. In its most basic form, this type of learning is about traversing
    through a set of states, transferring from one to another until a state where
    a reward is attained. It is just like the experiments where a rat learns how to
    navigate through a maze.


    Let us use the maze as an example to understand the basic concepts of reinforcement
    learning. The rat is expected to go from point A to point B, where there is a
    reward (cheese). There are points in the maze that the rat might recognize from
    before. In technical terms, these are known as states. When the rat reaches each
    of these locations, it can choose between, let’s say, four actions like turning
    left, right, forward or backward. The actions will depend on the state. Every
    move takes the rat from one state to the next one in the maze. This set of actions
    and states can be considered as a graph for better understanding.


    Let us now consider a robotic rat, who is learning how to navigate through a maze.
    Initially, the robot goes through the maze without any prior knowledge about it,
    that is to say, that it does not know the effects of its actions in any state
    that it is subjected to. If it were provided with a map or a graph, it would learn
    to find a path to the endpoint using that information. Trial and error methods
    are one way to use the graph of states in order to find the links for moving through
    the maze. A second option and the most commonly used reinforcement learning method
    is to label all the states the robot has passed through randomly. In technical
    terms, this is called a policy for navigating the maze that connects to every
    action with a labeled state. The optimal policy would be the one that connects
    each state to that action which leads through the shortest path in the maze. Reinforcement
    learning is about learning this optimal policy or policies.


    ![](Image00004.jpg)


    Another method involves assigning a value or a number to every action at each
    state and then modifying these values until it reaches the endpoint. This technique
    is known as `Q-learning`. It starts with the robot allotting a name to a state
    where it starts and also allotting a value or number to all the actions it takes
    in that state. We can assume that the robot memorizes all the states that it visited
    during its learning process and can differentiate between these states and the
    new ones. During this learning process, the robot takes the action that has been
    assigned the highest value.


    ![](Image00005.jpg)


    Since there is just a single action during the initial state, which leads the
    robot to a new state, it allocates a new random value to the actions that are
    possible in that particular state. This step is illustrated in the figure above.
    Next comes the important step in learning, as the robot is aware that it can reach
    a new state that has actions with the highest value, which is 6. It then updates
    the value of the action named 3 that leads to that state by giving it a value
    that is consistent with an action that is worth 6. This adjustment of 3 does not
    go all the way to the highest number, 6, but just to 5. This is illustrated in
    the right-hand side sketch where the adjusted value is represented with a larger
    font and shade than the other fonts. This process is repeated. In every state,
    the action will depend on the largest valuation number, which is then adjusted
    to a valuation number that is closer to the largest number in that state. Although
    this process starts with random numbers being assigned to states, the trial and
    error method will lead it towards the state where a reward is given. The action
    that leads to this reward stage will be assigned a valuation number which is almost
    close or similar to the value given to the reward state. This step is illustrated
    in the figure below.

    '
  trans: '


    人工神经网络可能包含百万个神经元，而大脑大约有 850 亿个神经元。大脑中的神经元是相互连接的，而人工神经网络是单向的。这些网络分布在下面列出的层中：


    ### 神经网络层


    - **输入层**：该层包含接收数据并将其传输到下一层的神经元。神经元的数量取决于特定数据集中属性的大小。

    - **输出层**：它涉及构建模型所需的节点。在分类系统中，一个标签将分配给一个节点；在回归系统中，将有一个节点输出一个值。

    - **隐藏层**：该层存在于输入层和输出层之间。属于该层的节点会对输入数据进行转换。随着节点的不断训练，它们预测输出的能力会变得更好。


    ### 监督学习

    神经网络和决策树等学习方法属于监督学习的范例。在这种学习中，人们尝试从分类已已知的大型训练数据集中学习如何分类数据。


    系统中发生的“监督”是指告知系统训练集中每条数据是如何被分类的。仅通过数据本身产生分类是可能的，此类技术属于无监督学习范畴。让我们考虑这样一个例子：待分类数据用点表示在二维空间中。这些点的坐标被赋予了
    `f1` 和 `f2` 的值，这些是数据的数值化特征。在表示中，一个类别可以用小正方形表示，另一个类别可以用小圆圈表示。如果点以这种方式表示，它们就可以作为监督学习技术的训练数据。


    如果我们有未标记的数据点，通过视觉检查，我们可以识别出成簇排列的点。每个簇可能都是属于同一类别的点。因此，自动识别簇及其边界可以作为无监督学习的技术。AI
    研究人员已使用这种方法来识别训练样本的簇。`K-means` 方法是其中最流行的。它通过重复下面提到的步骤来实现：


    1. 在样本空间中，随机位置安装数量为 `k` 的聚类寻找者。

    2. 将靠近的训练样本分组到每个聚类寻找者中。

    3. 计算这些组中每个组的重心（质）。

    4. 将这些聚类寻找者转移到每个组对应的重心。

    5. 重复这些过程，直到没有聚类寻找者需要移动为止。

    6. 一旦过程结束，聚类寻找者将位于训练样本的重心上，这些重心可以被识别为簇或单独的数据类别。


    现在，你可以通过计算新数据更接近哪个聚类寻找者，对不属于该数据集的新数据进行分类。这将取决于预测簇数量 `k` 的能力。寻找数量的技术涉及调整数量，使得这些簇内的点距离小于这些簇之间的距离。


    ### 强化学习

    这种学习是监督学习和无监督学习的结合。这方面的例子是机器人，它可以执行持续的经验序列。另一个理想的例子是学习出色地下棋，仅根据关于游戏结束时胜利或失败的信息。尽管这尚未实现，但某些程序已经玩双陆棋并学习控制直升机飞行。


    强化学习是人工智能的一个分支，完全是技术性的且多分支的。在最基本的形式中，这种学习关于遍历一组状态，从一个状态转移到另一个状态，直到获得奖励的状态。这就像老鼠学习如何穿过迷宫的实验。


    让我们用迷宫来理解强化学习的基本概念。老鼠预计从 A 点走到 B 点，那里有奖励（奶酪）。迷宫中有老鼠以前可能识别的点。在技术术语中，这些被称为状态。当老鼠到达这些位置中的每一处时，它可以从四个动作中选择，例如向左、向右、向前或向后。动作取决于状态。每一次移动都让老鼠从迷宫中的一个状态移动到下一个状态。这些动作和状态的集合可以被视为图以便更好地理解。


    现在让我们考虑一只机器人鼠，它正在学习如何穿过迷宫。最初，机器人在没有任何先验知识的情况下通过迷宫，也就是说，它不知道在所经历的任何状态下其动作的影响。如果给它提供地图或图，它将学习使用这些信息找到找到终点的路径。试错法是使用状态图寻找穿过迷宫连接的方法之一。第二种选择也是最常用的强化学习方法是随机标记机器人经过过的所有状态。在技术术语中，这被称为导航迷宫的策略，它将每个动作与带标记的状态连接起来。最优策略是将每个状态连接到能够通过迷宫最短路径到达终点的动作。强化学习就是关于学习这种最优策略或多个策略。


    ![](img/Image00004.jpg)


    另一种方法是对每个状态下的每个动作分配一个值或数字，然后不断修改这些值直到到达终点。这种技术被称为 `Q-learning`。它始于机器人为起始状态分配一个名称，并为在该状态下采取的所有动作分配一个值或数字。我们可以假设机器人记住了学习过程中访问过的所有状态，并能够区分这些状态和新状态。在学习过程中，机器人采取被分配了最高值的动作。


    ![](img/Image00005.jpg)


    由于在初始状态只有一个引导机器人进入新状态的动作，它为该特定状态下可能的动作分配一个新的随机值。这一步如上图所示。接下来是学习中重要的一步，因为机器人意识到它可以到达一个具有最高值（即
    6）动作的新状态。然后它通过给该状态一个与价值 6 的动作一致的值，来更新通往该状态的名为 3 的动作的值。这种对 3 的调整并没有达到最高数字 6，而仅仅到了
    5。这在右侧的草图中所示，调整后的值比其他字体更大、阴影更深。这个过程不断重复。在每个状态下，动作将取决于最大的评分数字，然后该数字会被调整为更接近该状态内最大数字的评分数字。虽然这个过程是从给状态分配随机数开始的，但试错法将引导它走向给予奖励的状态。通往这一奖励阶段的动作将被分配一个与奖励状态的值几乎接近或相似的评分数字。这一步如下图所示。


    '
