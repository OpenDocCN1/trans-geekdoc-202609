    右侧图显示了导致目标动作的调整后值。需要注意的是，如果机器人以后遇到类似的处境，它将使用这种基于奖励的值进行反向传播。![](img/Image00006.jpg)参考下方的插图来了解什么是反向传播。让我们考虑一种场景：机器人发现自己处于图中箭头标记的状态。它遵循从该状态开始最大的估值数字。这引导它进入另一个更接近目标状态的状态。估值为
    99 的动作将是通往目标状态的状态。因此，刚刚采取的动作的估值从 11 改变为 98，如右图所示。这种通过反向传播增加更接近目标的状态中的动作价值的方法，其回报与目标状态本身一样丰厚。


    ![](img/Image00007.jpg)


    大多数强化学习的迭代可以阐述如下：


    1. 在多个状态中都将提供奖励。这意味着不仅关乎单个目标状态，还关乎多个通往奖励状态的状态。奖励将用正数、零或负数表示。

    2. 与其寻找与通往单个目标的最的最路径相关的策略，不如学习能够增加未来预期奖励数量的策略。通常，在学习策略时，遥远未来的预期奖励不如即时预期奖励受关注。

    3. 在特定阶段采取的动作并不总是会导致相同的状态。人们可以尝试学习可能导致其他状态的概率，这属于一种名为优先扫描（prioritized sweeping）的学习方法。在
    `Q-learning` 过程中，这些概率不被考虑，因为它们会影响分配给状态-动作对的学习过程。

    4. 另一个影响该过程的复杂因素是机器人的传感装置不准确。因为机器人对自己所处的状态将有错误的认知。


    # 第六章：大数据基础


    计算机使用各种各种算法执行任务来管理数据。在最基础的形式，算法是一种帮助执行一组操作的程序。`Create`（创建）、`read`（读取）、`update`（更新）和`delete`（删除）是算法的四个基本数据操作。尽管这些操作看起来简单，但它们是计算机操作的基础。随着数据集变得复杂，计算机使用应用程序中的算法来执行更多工作。大数据涉及复杂的数据集，计算机以非确定性的方式使用模式识别来进行处理。因此，为了构建一个可以学习的系统，需要复杂的数据集供算法进行模式识别。此外，这种模式识别还需要一个简单的子集来进行统计分析或对整个数据集进行预测。应用大数据最常见的例子是卖家跟踪消费者购买行为创建的在线数据库。识别正确的数据源有助于创建机器学习实例，使机器能够以期望的方式学习并产生数据。大数据与统计学的结合可以创造完美的机器学习场景，机器可以预测任何给定事件的概率。


    是算法影响了学习过程和结果。算法需要一个训练过程，因为它改变了看待大数据的方式。这种训练涉及数据子集，这些子集用于创建模式，算法必须利用这些模式从给定的训练中区分特定情况和一般情况。尽管大数据意味着大量数据，但它与任何其他大型数据库都完全不同。它更复杂且具有深度。与通用编程相比，数据源可以帮助通过足够的细节更高效地解决问题。例如，考虑谷歌的自动驾驶汽车。汽车不仅应该拥有硬件及其在空间位置的信息，还应该拥有它如何影响人类决策、环境条件、路况和其他车辆的知识。因此，数据源将包含许多具有影响的变量。由于机器人将对其所处的状态有错误的认知，另一个影响过程的复杂因素是机器人的传感装置不准确。


    是算法影响了学习过程和结果。算法需要一个训练过程，因为它改变了看待大数据的方式。这种训练涉及数据子集，这些子集用于创建模式，算法必须利用这些模式从给定的训练中区分特定情况和一般情况。尽管大数据意味着大量数据，但它与任何其他大型数据库都完全不同。它更复杂且具有深度。与通用编程相比，数据源可以帮助通过足够的细节更高效地解决问题。例如，考虑谷歌的自动驾驶汽车。汽车不仅应该拥有硬件及其在空间位置的信息，还应该拥有它如何影响人类决策、环境条件、路况和其他车辆的知识。因此，数据源将包含许多具有影响的变量。由于机器人将对其所处的状态有错误的认知，另一个影响过程的复杂因素是机器人的传感装置不准确。


    通过分析训练数据来确定模式，并且算法将执行由开发者编写的任务。因此，个人数据在该环境中是不相关的。


    涉及到数据时的另一个问题是隐私，但机器学习是关于具体的，并没有那么帮助。


    ## 大数据的来源


    对于机器学习应用，你首先需要一个数据源，例如企业数据库。为了创建有用的数据源，必须创建新数据。开发者构建现有数据源并根据客户端-服务器架构的需求，但这可能对于机器学习实例不起作用，因为它们为了节省硬盘空间进行了优化。因此，它们不具备所需的深度。当你越来越熟悉机器学习时，你会遇到无法使用标准数据库解决的情景。


    ### 公共来源


    大学、非营利组织、政府和其他机构通常拥有公开的数据库。你可以单独使用，也可以将其与其他数据库结合创建机器学习的大数据。例如，你可以结合各种地理信息系统 (`GIS`）来构建大数据，帮助决策工厂或商店的选址。这种机器学习系统可以考虑各种信息，例如要支付的税额，甚至是部分土地的高度。使用公共数据的最大优势是即使对于商业用途通常也是免费的，在某些情况下，你只需要支付少量的费用。


    此外，数据库将保持在完美状态，因为机构有某些任务；他们利用这些数据产生收入或内部使用。在使用公共源数据时，有许多问题需要考虑。首先，你必须确保能够获得一些有用信息。下列出了你在做决定时可以遵循的一些标准：


    1. 数据源的格式

    2. 使用数据源的费用（如有）

    3. 使用数据源的许可，因为某些源受版权保护

    4. 清洗数据以供机器学习使用时可能出现的问题

    5. 适当的基础设施或数据访问提供


    '
