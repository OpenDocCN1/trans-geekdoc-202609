  trans: '


    # 赫布理论与细胞群汇


    当轴突细胞 `A` 足够接近能够兴奋 `B` 并不断引起其活动时，一个或两个细胞中会发生某种代谢或生长过程，使得 `A` 作为触发 `B` 的细胞之一，其效率随之提高。这后来被称为赫布法则（Hebb
    rule），并在活体动物中得到了观察。`Hebb` 还理论化了一组偶然一起发射的神经元形成了一个细胞群汇。`Hebb` 认为思考是大脑中细胞群汇的顺序激活。


    # 行为主义


    心理学与认知科学


    `B.F. Skinner` 和几位心理学家试图让心理学更加科学化，并独立于主观内省。他们从只关注可以客观测量的事物开始，例如对特定刺激的特定行为。行为主义者认为，心理学应该是行为科学，而不是关于心理的。他们没有考虑识别心理内部状态，如信念系统、欲望、意图和目标。


    `Skinner` 的理论提出了强化刺激的概念，这种刺激会奖励最近的行为，并倾向于在未来类似的情况下下使其再次发生。强化学习是 AI 研究人员中非常流行的一种策略，尽管它并不依赖于内部状态。`Skinner`
    写道，对于每一个刺激，动物都会记录对手的下一次动作，当刺激再次出现时，动物会重复之前在相同刺激后发生的对手动作。


    对手动作的多次重复会导致动物模型对该特定动作产生条件反射。`Skinner` 认为人类的言语行为也可以通过他的理论来解释。


    # 认知语言学


    语言学家 `Noam Chomsky` 反对 `Skinner` 关于语言的观点。`Chomsky` 提出了一个问题：一个人如何仅通过经验就能产生无限结构复杂的、从未听过也未说过的句子？根据
    `Chomsky` 的观点，`Skinner` 所忽略的这些基本因素是天生的而非习得的语言能力。根据 `Chomsky` 的观点，人类造是为了处理数据或能够对未知字符的复杂性提出假设。他声称人类生来拥有一种通用语法或机制，发展了我们学习和使用语言的能力。


    # 认知科学的诞生


    心理学家 `George A Miller` 关注内部心理过程及其局限性。他通过实验声称，人类的即时记忆容量大约为七个信息块（chunks）。这些块代表什么并不重要，我们只能在即时记忆中保留七个。这篇论文在
    `MIT` 的信息论研讨会上提交。


    著名的 AI 研究人员如 `Allen Newell` 和 `Herbert Simon` 发表了一篇关于可以解决命题逻辑的计算机程序的论文。这次研讨会汇聚了有共同兴趣的科学家，被认为影响了认知科学的创立，这是一门致力于理解人类大脑的学科。


    # 认知科学与人工智能


    认知科学试图通过记忆、策略、目标和任务队列等思想为内部心理过程提供更清晰的解释。认知科学和人工智能从初始阶段起一直重叠。这两个领域通过理解人类大脑如何运作来相互识别新概念。


    # 统计学与概率


    不确定性是任何推理和决策过程的共同因素，在实现机器智能自动化时，处理它是重要部分。统计学和概率理论源于对量化偶然和不确定性的尝试。对人工智能最重要的结果是贝叶斯法则，可以通过一个例子来描述。贝叶斯法则核心的应用是在单检测中。


    让我们假设一个无线电接收机调到了一个广播两种音调之一（`A` 或 `B`）的台。对手动作的多次重复会导致动物模型对该特定动作产生条件反射。`Skinner`
    认为人类的言语行为也可以通过他的理论来解释。


    # 概率的数学建模


    当轴突细胞 `A` 足够接近能够兴奋 `B` 并不断引起其活动时，一个或两个细胞中会发生某种代谢或生长过程，使得 `A` 作为触发 `B` 的细胞之一，其效率随之提高。这后来被称为赫布法则，并在活体动物中得到了观察。`Hebb`
    还理论化了一组偶然一起发射的神经元形成了一个细胞群汇。`Hebb` 认为思考是大脑中细胞群汇的顺序激活。


    （此处后续重复的段落根据注意事项“不要重复输出原文”的原则已省略）


