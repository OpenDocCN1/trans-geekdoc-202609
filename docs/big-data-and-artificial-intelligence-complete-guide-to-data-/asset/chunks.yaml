    TEMPORIS 可以通过点击命令将此过程缩短至瞬间。`AURORA` 软件在 `TEMPORIS` 中起着主要作用。


    ### 自动交易

    为了对货币、股票和商品进行实时交易数据和新闻分析以做出买卖决策，使用了数据挖掘、决策方法和文本处理等人工智能技术。更新的新闻源均以数字格式提供，如 `Dow
    Jones Elementized News Feed` 和 `The Reuters News Scope Archive`。例如，`Reuters` 为其客户提供基于程序化交易技术的新闻，并带有机器可读且全面的全球新闻存档。事件在突破时刻立即发布，并带有精确到秒级的时间戳。信息还会标记在多个元数据字段中，以便于机器读取。《纽约时报》上发表的一篇关于自动交易的文章显示，抑郁、焦虑和破产等术语之间存在关联。这类相关性可以在股票交易算法的帮助下启动股票交易。`Stream
    base Systems` 是另一家公司，其提供的产品可以跟踪多个市场的风险状况，并立即制定出精细策略以捕捉瞬即逝的交易机会。


    ### 业务实践

    业务规则管理系统是 20 世纪基于规则的专家系统的后裔。`BLAZE ADVISOR 6.1`、`Information Builders Web FOCUS`
    和 `ILOG’s J Rules 6.0` 就是一些示例。这些规则表达了公司的运营方式、约束和政策。在 `BRM` 中，这些规则通常以类英语的计算机可读的语言表示。由于这些业务规则随时间变化，因此必须进行更新以反映公司当前的政策。


    ### 语言翻译

    如今有许多商业自然语言翻译系统。`MASTOR` 是 `IBM` 的语音转语音翻译器，可以将英语语音翻译成普通话语音。同样，`BBN Technologies`
    也设计了多种语音处理系统，例如 `Broadcast Monitoring System`，它有助于创建一个可搜索的国际电视连续存档。该系统能够自动将实时音频流翻译成英语。翻译和字幕将与视频同步。


    ### 人脸识别

    人们通常擅长识别或区分熟悉的脸孔，无论是在照片还是现场。无论比例、光照条件、面部表情和姿势如何，这都是可能的。计算机在该领域正在不断进步，可以在银行、机场以及任何需要验证个人身份的地方看到它们。那么，计算机人脸识别进展到什么程度了？2007
    年，`国家标准与技术研究所` 进行了一项人脸识别测试，并宣布在人类的低误报率下，有七种自动人脸识别算法在各种光照条件下优于或比人类的人脸识别水平。此外，在这七种算法中有三种在所测量的整个误报率范围内优于或同于人类。人们创建了多种算法，其中一些基于流行的模式识别方法。从图像中提取面部样本特征，机器会将这些特征与大型识别人脸数据库中的相似特征进行比较。某些算法使用了
    `Bayesian` 方法和 `HMMs`。


    ### 结论

    你已经读到了这本书的最后。正如书中所提到的，人工智能涉及许多领域，正因为如此，研究人员和工程师发现了许多强大的计算工具。为了总结人工智能的思想和成就，它被分为四大类，如完整的人工智能系统、架构、过程和表示。以下是每组的一些主要成就：


    *   **完整的人工智能系统（执行任务的系统）：** `DENDRAL`、`LT`、`MSYS`、语音识别系统、`Genghis`、`Deep Blue`
    以及其他游戏机器、无人驾驶汽车、`CALO` 和 `RAX`。

    *   **架构（人工智能的组织原理）：** `Pandemonium`、三层架构、`BDI 架构`、产生系统、`黑板架构`、皮层模型、基于行为的架构、`ACT-R`
    和 `SOAR`。

    *   **过程（执行工作的例程）：** `Parsing`、扩散激活、边缘和区域查找滤波器、`STRIPS`、`A*` 及其后裔、求解、`beam search`
    和 `Rete 算法`、基于案例的推理、`Bayes rule`、聚类、基于 `GSAT` 和 `DPLL` 的方法、`Q-learning`、内核计算、范围限制、遗传算法和潜在语义分析。

    *   **表示（由过程创建、修改和访问的结构）：** 向量、语义网络、图形模型、决策树、帧、文法、黑板、脚本、逻辑表达式、程序和增强转换网络。


    许多学科对人工智能的成功做出了贡献。正如书的开头提到的，人工智能的早期先驱者从逻辑与数学、概率与统计、神经科学、语言学、心理学和计算机工程中获得了灵感和线索。可以说，到目前为止这一追求所取得的重大进展与合并和利用其他学科的思想有关。目前还没有出现关于人工智能的主流理论，也许以后也不会有。随着追求的持续，没有人知道未来的智能系统将通过人工智能支持的学科所扩展的方法组合来利用什么。有机会，其中某些技术将与更智能的技术结合而产生更好的用途。可能会有那么一天，人们写下书籍，讲述在亚里士多德梦想两千五多年后，我们现在拥有了可以根据我们的意愿或自动执行任务的工具。


    ### 来源

    *   `https://alex.smola.org/drafts/thebook.pdf`

    *   `http://ciml.info/dl/v0_8/ciml-v0_8-all.pdf`

    *   `https://courses.csail.mit.edu/6.034/ai3/rest`

    *   `http://artint.info/AIPython/aipython`

    *   `https://www.cs.cmu.edu/afs/cs/class/15381-s07/www/slides/011607comboIntro.pdf`

    *   `https://stacks.stanford.edu/file/druid:qn160ck3308/qn160ck3308.pdf`

    *   `http://etext.library.adelaide.edu.au/a/aristotle/a8pra/`

    *   `http://www.asc-cybernetics.org/foundations/timeline.htm`

    *   `http://www.stat.ucla.edu/history/essay.pdf`

