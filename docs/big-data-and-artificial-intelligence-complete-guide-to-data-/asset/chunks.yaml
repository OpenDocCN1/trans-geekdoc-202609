    TEMPORIS can reduce this to a moment with the click on a command. `AURORA` software
    plays a major role in `TEMPORIS`.


    ### Automated Trading

    For analysis of real-time trading data and news for automatic buy-sell decision-making
    on currencies, stocks and commodities, artificial intelligence techniques such
    as data mining, decision methods and texting processing are used. Updated news
    sources are all available in digital formats like `Dow Jones Elementized News
    Feed` and `The Reuters News Scope Archive`. For instance, `Reuters` provides its
    customers with news based programmatic trading techniques with a machine-readable
    and comprehensive archive of global news. Events are posted exactly at the time
    of breaking and it will be time-stamped to the second. The information will also
    be tagged to several metadata fields for easy machine consumption. An article
    published in the `New York Times` on automated trading revealed that there was
    an association between terms such as depression, anxiety and bankruptcy. These
    types of correlations can be used to initiate stock trades with the help of stock
    trading algorithms. `Stream base Systems` is another firm that provides a product
    that can track risky market conditions throughout multiple markets and instantly
    figure out refined strategies to take short-lived trading opportunities.


    ### Business Practices

    Business Rule Management Systems are progenies of the rule-based expert system
    from the 1980s. `BLAZE ADVISOR 6.1`, `Information Builders Web FOCUS` and `ILOG’s
    J Rules 6.0` are some examples. These rules express the way a company operates-,
    its constraints and policies. In `BRM`’s these rules are generally expressed in
    English-like, computer-readable languages. Since these business rules change from
    time to time, they have to be updated to reflect the present company’s policies.


    ### Translating Languages

    Many commercial natural language translation systems are available nowadays. `MASTOR`
    is `IBM`’s speech-to-speech translator that can translate English speech into
    Mandarin speech. Similarly, `BBN Technologies` have also designed several speech-processing
    systems such as the `Broadcast Monitoring System`, which helps create a continuous
    archive of international television that is searchable. The system will be able
    to translate real-time audio stream into English automatically. The translation
    and transcript will be in sync with the video.


    ### Facial Recognition

    People are generally good at identifying or distinguishing familiar faces whether
    it’s in a photograph or in person. It is possible to do this, irrespective of
    the scale, lighting conditions, facial expressions, and pose. Computers are advancing
    in this area and can be found in banks, airports and anywhere where your personal
    identity has to be verified. So, how far has computer facial recognition progressed?
    A 2007 `National Institute of Standards and Technology` conducted a facial recognition
    test and announced that, at low false alarm rates for humans, there was seven
    automated facial recognition algorithm that was better than or comparable to the
    human level of facial recognition under various lighting conditions. Additionally,
    three of the seven algorithms are better than or comparable to humans for the
    full range of false alarm rates measured. A variety of algorithms have been created
    out of which some are based on popular pattern recognition methods. The sample
    features of the face from the image are pulled out, and the machine compares these
    features to those that are similar to it in a larger database of identified faces.
    Certain algorithms use `Bayesian` methods and `HMMs`.


    ### Conclusion

    You have reached the end of this book. AI relates to numerous fields, as mentioned
    in the book, and it is for this reason that researchers and engineers have discovered
    many powerful computational tools. To summarize the ideas and accomplishments
    of AI, it has been divided into four main groups, such as complete AI systems,
    architectures, processes and representations. Here are some major accomplishments
    in each group:


    *   **Complete AI systems (systems that do things):** `DENDRAL`, `LT`, `MSYS`,
    speech recognition systems, `Genghis`, `Deep Blue` and other game-playing machines,
    driverless automobiles, `CALO` and `RAX`.

    *   **Architectures (Organizational principles for AI):** `Pandemonium`, three-level
    architectures, `BDI architectures`, production systems, `Blackboard architectures`,
    cortical models, behavior-based architectures, `ACT-R` and `SOAR`.

    *   **Processes (Routines that do the work):** `Parsing`, spreading activation,
    edge and region finding filters, `STRIPS`, `A*` and its progeny, resolution, `beam
    search` and the `Rete algorithm`, case-based reasoning, `Bayes rule`, clustering,
    `GSAT` and `DPLL` based methods, `Q-learning`, `Kernel computations`, `Circumscription`,
    genetic algorithms and latent semantic analysis.

    *   **Representations (structures that are created modified and accessed by processes):**
    Vectors, semantic networks, graphical models, decision trees, frames, grammars,
    blackboards, scripts, logical expressions, programs and augmented transition networks.


    Many disciplines have contributed to AI’s successes. As mentioned at the beginning
    of this book, the early pioneers of AI took inspiration and clues on how to proceed
    from logic and mathematics, probability and statistics, neurosciences, linguistics,
    psychology, and computer engineering. Truly, the significant advancement that
    has occurred in this quest to date has to do with merging and utilizing the ideas
    from other disciplines. No predominant theory about AI has surfaced yet and maybe
    there is not going to be one. As the pursuit continues, no one knows what intelligent
    systems of the future will utilize through combinations of methods extended by
    AI supporting disciplines. There are chances where some of these technologies
    will be of better use with smarter technologies. There could come a time when
    books would be written on how two and half millennia after Aristotle’s reveries,
    we now have the tools that perform tasks either at our will or by themselves depending
    on the needs.


