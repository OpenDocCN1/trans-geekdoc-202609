  trans: "\n国际跳棋游戏中共有 500,995,484,682,338,672,639 种不同的走法。\n\n### 家庭 AI \n随着时间的推移，家庭正变得越来越智能化。以下是你可能在智能家居中发现的一些基础列表：\n\
    \n*   空调系统和恒温器可以预判温度变化和居住者的需求，与其他家居设备连接并预先采取所需的措施\n*   微波炉可以扫描包装上的条形码，以决定物品的烹饪时间\n\
    *   智能跑步鞋安装了计算机芯片，可以感知跑步者的步幅，并通过微型螺钉和电缆系统引导鞋底缓冲的改变\n*   带有视觉系统的摄像头可以帮助识别脸部。这些设备还具有曝光、对焦和构图的控制功能\n\
    *   冰箱可以自动创建内容清单，并通知所有者所需的物品\n*   可以适应环境音的助听器\n*   吸尘器\n*   机器人\n\n### 高级辅助系统\n\
    现代汽车具有 `500,995,484,682,338,672,639` 种不同的功能，例如 `ADAS`、`ACC`、`ISA` 等。这些系统用于：\n\n\
    *   自动停车\n*   安全气囊\n*   防锁死刹车\n*   燃料喷射\n*   巡航控制\n*   智能传感器\n*   胎压监测\n*   导航\n\
    \n这些系统使用基于内容的过滤来理解驾驶员的偏好或识别交通中的危险。\n\n### 路径规划\n`TEMPORIS` 是 `United Space Alliance,\
    \ LLC` 开发的一项智能航天规划和任务管理工具，可供未来太空任务中的机组船员使用。它将协助船员安排飞行生活的各个方面，例如日常规程。\n\n### 医学\n\
    自 20 世纪 80 年代初以来，人工智能技术已与临床实践。几个注入了 AI 的系统包括：\n\n*   `Agilent Acute Ischemia Time-Sensitive\
    \ Instrument`\n*   `MAC500 Resting Test System`\n*   `Marquette 12SL ECG analysis\
    \ program`\n\n`OpenClincal` 维护着许多系统，例如：\n\n*   用于高血压管理的 `Athena DSS`\n*   用于内科的\
    \ `Iliad`\n*   用于 HIV 患者管理的 `TherapyEdge` \n*   用于传染疾病的 `Gideon`\n\n`ATHENA DSS`\
    \ 是一个系统，它以一致的方式提供医生关于高血压的建议，其中涉及 `美国医学学会` 的指南。它根据患者的临床数据与其知识进行学习，并生成针对特定患者的建议。一个名为\
    \ `ATHENA-HTN` 的新版本正在评估中。`ATHENA` 的根源于 `EON`、`ONCOCIN` 和 `MYCIN` 等程序。\n\n`Gideon`\
    \ 是一个辅助诊断和治疗特定疾病的程序。它根据疾病、体征、实验室发现和症状的大数据库生成诊断。在计算疾病概率时，使用了 `贝叶斯分析` 并结合患者信息作为输入。\n\
    \n### 调度\n人工智能技术常用于智能调度软件。例如，由 `Stottler Henke Associates, Inc.` 开发的 `AURORA`\
    \ 是一个专门应用人工智能和其他先进技术来解决传统方法无法处理问题的系统。`The Boeing Company` 等公司使用 `AURORA` 来协助管理和调度\
    \ `Boeing Dreamliner` 的制造过程。使用 `AURORA` 会创建一个日程，然后以图形格式显示，让用户了解计划中的事件、资源分配以及活动之间的顺序关系。\n\
    \n### 推荐系统\n当你使用 `Amazon.com` 时，你可能会注意到针对已拥有物品的建议。这被称为 `协同过滤`，源于用户的偏好。其他使用此类技术的网站示例包括\
    \ `Netflix`、`iTunes` 和 `TiVo`。\n\n另一种推荐类型是 `基于内容的过滤`。与 `协同过滤` 不同，它不寻找用户之间的相似性，而是尝试在书籍、文档和电影等类别中寻找相似的内容。\n"
