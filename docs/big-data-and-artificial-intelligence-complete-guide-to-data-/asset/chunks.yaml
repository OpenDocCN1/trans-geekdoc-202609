- raw: "Chapter Two: What is AI? A deeper understanding of what Artificial Intelligence\
    \ means can be attained through eight definitions of AI laid out along two dimensions.\
    \ One dimension is concerned with reasoning and thought processes, while the other\
    \ is based on behavior. In the figure shown below, we see the eight definitions\
    \ of AI. The definitions on the left side measure success with respect to human\
    \ performance. The ones on the right measure rationality based on ideal performance.\
    \ A system can be considered rational if it does the right thing, considering\
    \ what it knows. ![](Image00002.jpg)All four approaches have been followed through\
    \ in the past, and each approach was used by different people using different\
    \ methods. \n\nThe human centered approach was based on observations and hypotheses\
    \ about human behavior; therefore, it was more like empirical sciences. The rationalist\
    \ approach included a mix of engineering and mathematics. The different groups\
    \ have converged and disparaged each other. We shall look into these approaches\
    \ in detail.  The Turing Test Approach: Acting Humanly  Alan Turing proposed the\
    \ Turing test in 1950 that helped to obtain the operational definition of artificial\
    \ intelligence. A computer would pass the Turing test if it could not identify\
    \ whether a response to a written question asked by a human being came from a\
    \ human or another machine. The focus should be on how the computer was programmed\
    \ to pass the test. The groundwork gives us plenty of insights into how to mechanize\
    \ intelligence. This computer should have capabilities such as: ●       Communicating\
    \ in English through natural language processing ●       Store what it hears or\
    \ knows through knowledge representation ●      Using the stored information to\
    \ draw conclusions or predictions using automated reasoning ●      To detect and\
    \ predict some new patterns through machine learning The Turing test intentionally\
    \ disregarded direct interaction between the computer and the human interrogator,\
    \ \n\nas physical simulation is not required for intelligence. In the total Turing\
    \ test, a video signal is used to test the subject’s perpetual abilities. The\
    \ computer will need to complete the tasks below to pass this test:  ●       Vision\
    \ to observe or see objects ●       Use robotics to manipulate and move objects\
    \ around The basic composition of most AI is based on the above mentioned six-disciplines.\
    \ Turing deserves all the credit, since this test is relevant even after 60 years\
    \ of its making. Researchers, however, pay little attention towards passing the\
    \ Turing test, as they believe it is more important to understand the internal\
    \ workings of the intelligence rather than trying to know how to duplicate an\
    \ archetype. The Cognitive Modeling approach: Thinking humanly If we say that\
    \ a particular computer program thinks like a human, we must first know how the\
    \ human mind works. We must figure out the internal mechanisms of our brain. There\
    \ are three ways to find this. One is through introspection- where we try to understand\
    \ our thoughts as they pass us by. The second method is through psychological\
    \ experimentations- where an individual is observed in action. The third method\
    \ is brain imaging- where the brain is observed in action. After gathering precise\
    \ information about how our brain functions, it is possible to convert it into\
    \ a computer program. If the program’s input-output behavior is similar to its\
    \ human behavior, \n\nit proves that the program involves certain mechanisms that\
    \ could also be operating in our brain.  Cognitive science is a discipline that\
    \ brings together AI computer methods and techniques from psychology that can\
    \ develop accurate and testable theories of the human mind. A lot of confusion\
    \ was created in the early days of AI. A researcher would claim that an algorithm\
    \ performs well on a certain task, and it is, therefore, proof that it is a good\
    \ model of human performance. Modern-day researchers separated this into two claims,\
    \ and this distinction has helped in the rapid growth of both fields.  The Laws\
    \ of Thought Approach: Thinking Rationally  Aristotle's syllogisms gave us patterns\
    \ for argument structures that drove to correct conclusions in the correct circumstances.\
    \ These laws of thought were believed to give insights into how our mind operates\
    \ and the field called logic stemmed from this very school of thought. The 19th-century\
    \ logicians came up with different laws that added meaning to objects and its\
    \ relationships with the world around. The logistic approach to artificial intelligence\
    \ is about trying to build programs based on these relationships to create intelligent\
    \ systems. This approach has two crucial obstacles. Firstly, it is difficult to\
    \ take informal knowledge and create formal terms, especially when this knowledge\
    \ is not 100% certain. Secondly, there is a difference between solving a problem\
    \ in practice and solving it in principle. \n\nEven if the problem has just around\
    \ a hundred facts, it will require a lot of computational resources unless it\
    \ has a framework that provides information on what step to try initially. The\
    \ Rational Agent Approach: Acting Rationally Computer agents perform several functions\
    \ such as; perceive its environment, operate autonomously, persist over a long\
    \ period of time, create and achieve goals, and adapt to change. A rational agent\
    \ comes into use where there is uncertainty; it helps achieve a goal or provides\
    \ the best-expected outcome. In the laws of thought approach, the emphasis is\
    \ placed on the right conclusions. Drawing the correct conclusions can always\
    \ be expected from a rational agent, but correct conclusions do not always sum\
    \ up to rationality. In certain situations, there is no right thing to be done,\
    \ but something has to be done. There are also ways where acting rationally does\
    \ not involve any inferences.  The rational agent approach has two positive points.\
    \ It is more general than the laws of thought approach because the right conclusion\
    \ is one of the many possibilities for achieving rationality. It is also quite\
    \ responsive to scientific development than approaches that are based on human\
    \ behavior. An important point to keep in mind is that we will find as we go on\
    \ that reaching the perfect level of rationality - that is always doing the right\
    \ thing - is not viable in complicated environments. \n\nChapter Three: Basic\
    \ Concepts in AI Data The static, dynamic, factual, raw, and discrete observations\
    \ of a particular area of interest are data. The systematic processing of this\
    \ data produces information. Numerical values within most environments always\
    \ represent data. Data can be defined as the physical and transactional records\
    \ of an enterprise’s activities, and this will serve as its basic building blocks\
    \ of information. They are products of observation and to observe is to sense.\
    \ Therefore, it has to be processed before utilizing the information. Data to\
    \ an analyst, problem-solver or investigator might mean sentences, numbers, assumptions\
    \ or records. It is the known factors irrespective of its form or origin. In other\
    \ fields, it could mean facts or hypothesis where data is used as an assumption. \
    \ Although data is used as evidence, it is not always true. It is difficult to\
    \ prove whether the given set of data is true or false. It requires advanced processing\
    \ to gain more information from the existing data. For instance, the temperature\
    \ of one particular day is a singular atom of data, and it is treated as a fact.\
    \ There will be many atoms like this one, and they can be combined using standard\
    \ logical operations. Universal statements like \"the daily maximum temperature\
    \ should be above 30 degrees\" should also be considered. These universal statements\
    \ are much stronger than the atoms of data; therefore, it is difficult to finalize\
    \ on what the truth is. These types of data should go through another screening\
    \ to produce the required authentic information. "
