    \ [Bibliography](#text00158.html#a20B) \n\nArtificial Intelligence And Life A\
    \ Complete Guide to the Basic Concepts in AI, Neural Networks, Machine Learning\
    \ and Data Science. Hans Weber \n\nIntroduction Intelligence is a quality that\
    \ enables an entity to perform certain functions according to the external environment.\
    \ Artificial Intelligence (AI) is the pursuit of making machines intelligent.\
    \ If you can relate to this definition, then several things such as animals, humans\
    \ and certain machines can be considered as intelligent beings. On one end of\
    \ this spectrum are machines and animals with their varying degrees of intelligence\
    \ and on the other end of this continuum are human beings. They can perform numerous\
    \ tasks, add reason and logic to them, generate and understand languages and perceive\
    \ as well as react to sensory stimuli. Additionally, they can also play games,\
    \ prove theorems, create music and art, write history and synthesize large volumes\
    \ of information. To do this, humans require a wide array of abilities with no\
    \ discontinuities, and they are heavily dependent on their external environment.\
    \ It is for these reasons that AI should also be looked into from a larger perspective.\
    \ This is applicable to all facets of life such as statistics, linguistics, logic,\
    \ electrical engineering and computer science.  This book has been structured\
