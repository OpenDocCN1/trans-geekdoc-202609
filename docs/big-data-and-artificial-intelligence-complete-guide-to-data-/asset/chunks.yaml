- raw: "Therefore, this strategy is based on the idea that no hypothesis will be completely\
    \ trusted without the evidence, which led to that output. Upon analysis, you can\
    \ prove or disapprove the hypothesis. Similarly, it is impossible to establish\
    \ which disease a person is affected by without testing all the symptoms. The\
