    Therefore, at least 2 B''s are C''s. There is a window that represents A, and
    Stanhope would move a slide with eight units that was painted in red and also
    a slide with four units that was painted in grey from opposite directions. The
    slides will overlap in two units, and this represents the minimum number of B''s
    that are also C''s. In 1854, George Boole published a book that looked into the
    nature and constitution of the human mind. He considered several logical principles
    of human reasoning and transformed them into a mathematical equation.


    ## Boolean Algebra


    For instance, the principle of contradiction states that it is impossible for
    any being to possess a quality and not possess it at the same time. He then made
    this principle into an algebraic equation, `x(1-x) = 0`, where `x` symbolizes
    an object, `(1-x)` symbolizes the contrary class of the object, while `0` represents
    a class that does not exist. Through Boolean algebra, we know that `0` denotes
    falsehood and `1` denotes truth. Two of the most important operations in logic,
    ‘OR’ and ‘AND,’ are symbolized in Boolean algebra by the operations `+` and `X`,
    respectively. For instance, the statement "either p or q or both" can be represented
    by `p + q`. To represent the statement `p` and `q`, we could write `p x q`. Each
    `p` and `q` could either be true or false; therefore, we can calculate the value
    of `p + q` and `p x q` by how `+` and `x` are used and the values are always calculated
    in terms of whether the value is true or false, that is:


    ```

    1 + 0 = 1

    1 x 0 = 0

    1 + 1 = 1

    1 x 1 = 1

    0 + 0 = 0

    0 x 0 = 0

    ```


    Boolean algebra played a vital role in the design of telephone switching circuits
    and computers. Although Boole never envisioned computers, his work led us to an
    important clue about the mechanization of reasoning. A similar approach, but not
    algebraic, for calculating and manipulating propositions known as propositional
    calculus, plays an integral part in artificial intelligence. The main drawback
    of Boole''s logical system was that it does not help you understand anything internal
    to the propositions. For instance, if we proposed "Jack is human" by `p` and "Jack
    is mortal" by `q`, there is nothing internally present in `p` or `q` to prove
    that Jack who is human is also the same Jack who is mortal. For this purpose,
    we need to understand "molecular expressions" which also have internal expressions.
    Towards the end of 19th century, philosopher Friedrich Ludwig Ferge invented a
    system where propositions, along with internal expressions, can be written in
    a graphical form. Ferge system was the frontrunner for what we now refer to as
    the "predicate calculus," another vital system in artificial intelligence. It
    also indicates another graphical form that is used in present-day artificial intelligence:
    semantic networks. Due to Ferge''s work, sentences that included information to
    be reasoned could be represented in unambiguous and symbolic forms.


    ## Biological Foundations of Intelligence


    Since it is the human brain that processes vast amounts of information into action,
    it is to be expected that works of neurophysiologists and neuroanatomists, those
    who study the brain, can provide a better understanding of what intelligent behavior
    is. An understanding of human evolution, which brought forward intelligent life,
    can also provide hints to help explore the field of artificial intelligence.


    The human brain has about 10 billion cells called neuro. They are found in different
    forms, but their parts are quite similar. The central part is the cell body or
    soma, incoming fibers are called dendrites and the outgoing fibers are axons.
    The axon will have a projection called terminal buttons that come close to the
    dendrites of other neurons. This gap between the terminal button of one neuron
    and dendrite of another is called a synapse. When a pulse reaches this synapse,
    as a result of electrochemical actions, it may excite or inhibit the electrochemical
    activity of the other neuron across the synapse. What the second neuron does will
    depend on the type of pulses that arrive at the synapses and the efficiency of
    those synapses in transmitting electrochemical reactions. In the year 1943, a
    paper by neurophysiologist Warren McCulloch and logician Walter Pitts claimed
    that the neuron was a logic unit. It proposed a simple demonstration of neurons
    and showed how networks of these models could perform any computational operations.
    A neuropsychologist, Donald O Hebb, also emphasized how neurons in our brains
    perceived the basic units of thought.

