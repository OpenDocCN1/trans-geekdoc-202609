    In case the data is not represented as points, then a different technique to measure
    data closeness must be employed. Third, when considering the closest data points
    will the points closer to each other influence the result more than the ones that
    are at a distance from each other. The most basic `k-nearest neighbor` can be
    extended by weighing the importance of those data points, based on their closeness.
    Mostly, a `kernel` is used to give a gradually diminishing weight to very distant
    points. Fourth, what should the value of `k` be? How many neighbors are going
    to be employed to make a decision about one particular data? With the right kind
    of `kernel`, every data point can be considered. The points that are very far
    will have zero or negligible influence on the particular decision. The relevant
    question now is how distant should a `kernel` be to influence the outcome. Lastly,
    after considering all the weighed neighbors, how can a decision be made about
    assigning numerical values or value? Should it be according to the majority vote
    of the neighbors, or should it be the average of the weighted members? Different
    versions of statistical regression methods can be used based on this choice.


    ### Case-Based Reasoning

    This is a subfield of AI that can be viewed as a generalized type of memory-based
    learning. Case-based reasoning involves a library of cases that are used to analyze,
    interpret and solve new cases. For instance, in the field of medicine, therapeutic
    and diagnostic records of patients constitute a library of cases; once a new case
    surfaces, cases that are similar to it can be found from this library, which would
    help diagnoses and therapy. In the field of law, older legal scenarios are used
    to interpret and study new cases.


    If there are cases that are similar to a new case, they are considered as neighbors
    in a general space of cases. To find close neighbors, the idea of proximity should
    be according to the measure of similarities. The most famous pioneer of case-based
    reasoning is `Janet Kolodner`, who is a professor of cognitive science and computing.
    She describes the process in this way: cases that need to be retrieved are the
    ones that are good cases. They have the potential to construct relevant ideas
    for a new case. This retrieval is worked out using a feature of the new case as
    indexes into the library of cases. Cases with subsets of those features labeled
    to them or features that can be derived from these features will be retrieved.
    We will now have an array of promising cases to choose from and reason with. Case-based
    reasoning has turned out to be the most successfully applied AI technologies in
    recent years. They have prominent application in commercial and industrial areas.
    Customer care centers and diagnostic systems are the most common applications.


    ### Decision Trees

    This is a new type of advanced machine learning technique that involves the automatic
    construction of structures or networks known as decision trees form large sets
    of data. Decision trees involve a series of test that helps determine a numerical
    value or category to assign to a data record. They are most applicable for non-numeric
    as well as numeric data. The methods used to construct them automatically will
    be described in detail.


    #### Data Mining and Decision Trees

    Data mining involves the extraction of useful information from a large volume
    of information. For instance, think of a database that includes credit card behavior.
    This will come with payment records, average purchase amounts, average balances,
    late fee charges and it will go on. By using the right data mining methods, you
    will be able to find out that people with higher late fee charges, higher average
    purchases and other similar features are most likely to have high average balance.


    One important method of data mining uses data to construct decision trees. This
    can be elaborated using a simple example. Consider a company such as `Walmart`.
    Imagine that they have maintained a database with information about customers
    that they have previously mailed regarding a discount coupon. The information
    would include details such as the location of household, type of house if the
    customer has shopped with `Walmart` before or if the customer has ever responded
    to any of their customer mails before. If this information were to be tabulated,
    the information in each row would be called a `record`. The item on top of the
    column would be the `attributes` and the items listed in the columns would be
    its values. After analysis of this database, a decision tree can be constructed.


    ![](Image00003.jpg)


    The figure illustrated above can give you an idea about which household responded
    to the mails and which ones didn’t. The tests on the values are at the interior
    nodes of the decision tree (boxes); the results are at the tips of the tree (the
    leaves) in ovals. These trees help at predicting the expected response before
    sending the mails. Several methods have been developed to construct these decision
    trees. Here are some examples:


    ##### EPAM

    This system was developed in the late 1950s and is the earliest method used to
    construct decision trees. `Edward Feigenbaum` developed it as his Ph.D. dissertation.
    It is named after its acronym, `Elementary Perceiver and Memoriser`. The goal
    of his research was to predict and explain the phenomenon of human learning. This
    program is still considered as a vital contribution towards AI intelligence.


    ##### CLS

    This program was developed in 1960s by `Carl Hovland` and his student `Earl B`.
    They developed a computer model of human concept. `CLS` is the acronym for `Concept
    Learning`.


    ##### ID3

    `ID3` is the acronym for `Iterative Dichotomizer`. `J Ross Quinlan` developed
    it in the late 1970s. Using this program data records could be divided into data
    sets iteratively until they come under two distinct categories. Later versions
    of this program had more than two categories.


    ##### C4.5

    Quinlan continued to develop advanced and applicable decision tree systems. He
    developed the `C4.5` system that could compute databases with attributes that
    had numerical values and categories. During this period, several developments
    that are of significance to the AI research took place. This was due to the collaboration
    between statisticians and AI people. `CART` stands for classification and regression
    trees. It was developed by `Jerome Friedman` and is similar to `C4.5` when dealing
    with numeric attributes.


    ##### Inductive Logic Programming

    Many techniques have been developed to study relational rules from databases and
    other background knowledge. `Quinlan` developed the earliest system for studying
    relational rules called `FOIL`. Since the rules learned can be applied in computer
    languages such as `PROLOG`—which is a language based on logic—a field was dedicated
    to learning them called `Inductive Logic Programming`.


    ##### Neural Networks

    Neural networks help to identify links or patterns between data that has no direct
    relationship between input and output or instances. The neural nets would identify
    a pattern between data sets. Let us consider constructing a system to identify
    animals based on their attributes or features. If we want the system to identify
    a tiger, the model that you give should not be of a four-legged animal and warm
    blood. As the system would not be able to understand whether it is a tiger or
    a lizard or even a dolphin. A combination of these attributes, however, can help
    the system identify the right animal. If you divide these attributes by a thousand,
    you will understand the complexity of neural networks. A broader understanding
    of artificial neural networks can be obtained by looking into how the human brain
    works. There is a vast difference in scale—human neural networks that continue
    to increase in size as time goes by.

