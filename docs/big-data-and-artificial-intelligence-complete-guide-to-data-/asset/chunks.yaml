    \ correct conclusions can always be expected from a rational agent, but correct\
    \ conclusions do not always sum up to rationality. In certain situations, there\
    \ is no right thing to be done, but something has to be done. There are also ways\
    \ where acting rationally does not involve any inferences. The rational agent\
    \ approach has two positive points:\n\n* It is more general than the laws of thought\
    \ approach because the right conclusion is one of the many possibilities.\n* It\
    \ is also quite responsive to scientific development than approaches that are\
    \ based on human behavior.\n\nAn important point to keep in mind is that we will\
    \ find as we go on that reaching the perfect level of rationality - that is always\
    \ doing the right thing - is not viable in complicated environments.\n\n# Chapter\
    \ Three: Basic Concepts in AI\n\n## Data\n\nThe static, dynamic, factual, raw,\
    \ and discrete observations of a particular area of interest are data. The systematic\
    \ processing of this data produces information. Numerical values within most environments\
    \ always represent data. Data can be defined as the physical and transactional\
    \ records of an enterprise’s activities, and this will serve as its basic building\
    \ blocks of information. They are products of observation and to observe is to\
    \ sense; therefore, it has to be processed before utilizing the information. Data\
    \ to an analyst, problem-solver or investigator might mean sentences, numbers,\
    \ assumptions or records. In other fields, it could mean facts or hypothesis where\
    \ data is used as an assumption.\n"
  trans: "\n\n# 第二章：什么是人工智能？\n\n通过两个维度列出的八种人工智能定义，可以对人工智能的含义有更深入的理解。其中一个维度关注推理和思维过程，另一个维度则基于行为。在下图中，我们看到了人工智能的八种定义。左侧的定义根据人类表现来衡量成功；右侧的定义则根据理想性能来衡量理性。如果一个系统在考虑其所知的情况下做了正确的事，它就可以被认为是理性的。![](img/Image00002.jpg)这四种方法在过去都曾被采用，每种方法都被不同的人使用不同的方法过。\n\
    \n以人为的方法基于对人类行为的观察和假设；因此，它更像经验科学。理性主义方法包含了工程学和数学的结合。不同的群体之间相互汇聚也相互贬。我们将详细研究这些方法。\n\
    \n## 图灵测试方法：像人类一样行动 \n\n艾伦·图灵在 1950 年提出了`图灵测试`，这有助于获得人工智能的操作性定义。如果一台计算机无法识别人类提出的书面问题的回答是来自人类还是另一机器，这台计算机就通过了`图灵测试`。重点应该放在计算机如何被编程以通过测试上。这一基础为我们如何机械化智能提供了丰富的见解。这台计算机应该具备以下能力：\n\
    \n* 通过`自然语言处理`用英语交流\n* 通过`知识表示`存储它听到的或所知的内容\n* 使用`自动推理`利用存储的信息得出结论或预测\n* 通过`机器学习`检测并预测一些新模式\n\
    \n`图灵测试`刻意地忽略了计算机与人类提问者之间的直接交互，因为智能不需要物理模拟。在总的`图灵测试`中，使用视频信号来测试受体的持续能力。计算机需要完成以下任务才能通过此测试：\n\
    \n* 用于观察或看到物体的视觉\n* 使用`机器人学`操作和移动物体\n\n大多数人工智能的基本组成基于上述的六个学科。图灵值得所有的赞誉，因为这项测试在提出\
    \ 60 年后仍然具有相关意义。然而，研究人员对通过`图灵测试`并不十分关注，因为他们认为理解智能的内部工作机制比试图复制一个原型更为重要。\n\n## 认知建模方法：像人类一样思考\
    \ \n\n如果我们说某个特定的计算机程序像人类一样思考，我们必须首先了解人类大脑是如何运作的。我们必须弄清楚大脑的内部机制。发现这一方法有三种：\n\n\
    1. 一种是通过内省——我们尝试在思绪流过时理解它们。\n2. 第二种方法是通过心理实验——观察个体的活动状态。\n3. 第三种方法是脑成像——观察大脑的活动状态。\n\
    \n在收集了关于大脑如何运作的精确信息后，可以将其转换为计算机程序。如果程序的输入输出行为与其人类行为相似，就证明该程序涉及某些机制，这些机制也可以在我们大脑中运行。\n\
    \n`认知科学`是一门结合了人工智能计算机方法和心理学技术的学科，可以开发出关于人类思维的准确且可测试的理论。在人工智能早期，产生了很多困惑。研究人员会声称某个`算法`在特定任务上表现良好，因此证明它是人类表现的良好模型。现代研究人员将这一观点拆分成了两个主张，这种区分有助于这两个领域的快速增长。\n\
    \n## 思维规律方法：理智地思考 \n\n亚里士多德的`三段论`为我们提供了论证结构的模式，这些模式能够在正确的情况下得出正确的结论。这些思维规律被认为可以提供我们大脑如何运作的见解，逻辑学领域也正源于这一学派。19\
    \ 世纪的逻辑学家提出了不同的规律，为物体及其与周围世界的关系增了意义。人工智能的逻辑方法是尝试基于这些关系建立程序，以创建智能系统。\n\n这种方法面临两个关键障碍：\n\
    \n* 首先，要提取非正式知识并创建正式术语是困难的，特别是当这些知识不是 100%确定的时候。\n* 其次，在实践中解决问题与在原则上解决问题之间存在。\n\
    \n即使问题只有大约一百个事实，也需要大量的计算资源。\n\n## 理性代理方法：理智地行动 \n\n计算机代理执行若干功能，例如：\n* 感知环境\n*\
    \ 自主运行\n* 长期持续\n* 创建并实现目标\n* 适应变化\n\n理性代理在存在不确定性的地方投入使用；它帮助实现目标。在思维规律方法中，重点放在正确的结论上。人们总是预期理性代理得出正确的结论，但正确的结论并不总是等同于理性。在某些情况下，没有正确的事要做，但必须做点什么。还有一些方式，理智地行动并不涉及任何推理。理性代理方法有两个优点：\n\
    \n* 它比思维规律方法更通用，因为正确的结论是许多可能性之一。\n* 它比基于人类的方法对科学发展的反应更灵敏。\n\n一个需要记住的重要点是，随着我们将下去，会发现达到完美的理性——即始终做正确的事——在复杂的环境中是不可行的。\n\
    \n# 第三章：人工智能的基本概念\n\n## 数据\n\n对特定感兴趣区域的静态、动态、事实、原始和离散的观测称为数据。对这些数据的系统化处理产生信息。大多数环境中的数值始终代表数据。数据可以被定义为企业活动的物理和交易记录，这将作为其信息的构建区块。它们是观察的产物，而观察就是感知；因此在使用信息之前必须对其进行处理。对于分析师、问题解决者或调查人员来说，数据可能意味着句子、数字、假设或记录。在其他领域，它可能意味着事实或数据被用作假设的假设。\n\
    \n"
