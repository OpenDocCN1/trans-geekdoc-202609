    # Private sources

    Private Amazon and Google are examples of some private organizations that maintain
    a large database, which has all sorts of useful information. In this scenario,
    you are expected to pay a fee for access to this data, especially when the commercial
    setting is used. The one major restriction is that you may not be able to download
    the data to your server and this can affect your machine-learning environment.
    For instance, certain algorithms work slowly with data that can only be accessed
    in small pieces. The major benefit you get when using data from a private database
    is the perfect consistency that you can expect. When compared to the information
    from a public server, this data will be cleaner. You will also have access to
    a bigger database with a diverse amount of data types. All this depends on when
    you get the data.


    ## Building new data from existing data

    You can use existing data as a starting point to create a new data source since
    old data is not best suited for creating new machine learning scenarios. For instance,
    you might have a customer database that includes all customer orders, but this
    data is not suitable for machine learning as it lacks the tags or categories required
    to classify the data into specific types. Machine learning mostly works on 80%
    of the data, but the remaining 20% of the cases will have to be worked out by
    professionals who decide how to react to a specific data and then act upon it.
    In this scenario, you will need people who would include additional information
    such as tags.


    ## Using existing data sources

    Your organization has hidden data in all kinds of places; the problem is in learning
    how to recognize this data as useful data. For instance, in order to track an
    assembly line, you may have employed sensors that track how the assembly process
    works and make sure that the line remains systematic. The visuals from these sensors
    can be potential input for a machine learning scenario, as they track how the
    product moves, how it affects customer satisfaction and even the fee you pay for
    postage. The basic idea is to transform the existing data into a new kind of data
    that lets you optimize the functioning of your organization.


    ## Statistics and Machine Learning

    Although statistics and machine learning are part of very different fields, they
    have many similarities. Statistics is one among five schools of thoughts that
    make machine learning attainable. The five schools of thought are:

    * **Symbolists**: This stems from logic and philosophy. It relies on the inverse
    deduction for problem solving.

    * **Connectionists**: This stems from neuroscience. It depends on `back-propagation`
    for solving problems.

    * **Evolutionaries**: It originates from evolutionary biology. It depends on `genetic
    programming` for problem solving.

    * **Bayesians**: This originates from statistics and depends on `probabilistic
    inferences`

    * **Analogies**: This originates from psychology and depends on `kernel machines`
    to do love issues. The end goal of machine learning is to merge strategies and
    technologies within the five Schools of thought. The goal is to create a single
    algorithm or master algorithm that can learn just about anything.


    ## Role of Algorithms

    In the field of machine learning, everything pivots around algorithms. It is like
    a procedure or formula employed for problem solving. The domain of the problem
    affects the type of algorithm that is used, but the basic hypothesis is always
    the same. It could be about any problem, just like driving a car or playing chess.
    Initially, the problem would look extremely complex, but, in the end, the basic
    goal is to get the passenger from one position to the next without creating any
    damage. You can imagine an algorithm to be like a box or container that stores
    a procedure which can be used to solve a specific problem. They approach data
    with the help of a succession of well-defined states. The states will be defined
    but not necessarily in a deterministic manner. The ultimate goal is to design
    an algorithm to solve problems. There are cases where inputs that are given to
    an algorithm serves as the basis for just defining an output. The output will
    remain the main focus. Transitioning between states should be expressed using
    a well-defined and formal language that the computer can process. When solving
    a problem or processing data, an algorithm tends to define, clean and carry out
    a function. This function will correspond to the problem that is to be solved
    by the algorithm.


    ## Strategies for Algorithms

    ### Symbolic Reasoning

    In symbolic reasoning, deduction widens the sphere of human knowledge, and induction
    uplifts the level of human knowledge. An inverse deduction is a term that is commonly
    referred to as induction. Induction generally opens up new areas for exploration
    and deduction helps understand the depth of this field. Therefore, induction is
    the scientific part of this kind of reasoning, and deduction is the engineering
    side. These two strategies always work in close association with each other. It
    starts by identifying a new area for exploration and then inspecting this area
    to understand if its problems can be solved. For instance, consider a tree with
    green leaves, through deduction; we could say that if the tree is green and, green
    leaves mean that it is alive, then this tree must be alive too. Through induction,
    we could infer that if the tree is green and if the tree is alive, then green
    trees are alive.


    ### Brain Modeling

    This is the most popular strategy among all. Silicon is used in place of neurons,
    and the brains functions are reproduced. Every neuron decodes one part of a problem,
    and when several neurons work in parallel to each other, the problem can be solved
    as a whole. `Backpropagation` is the method by which errors are removed from networks
    that are built to be like the neurons in our brain. It works by altering the `weights`
    and `biases` of the network. `weights` are inputs such as values or numbers that
    affect the result and `biases` are the attributes that are finally chosen. The
    aim is to keep altering the `biases` and `weights` until the point where the actual
    output is similar to the desired output. Since each neuron solves one part of
    the problem, when they come together, they pass data to the next neuron, thus
    forming the final output.


    ### Evolutionary Modeling

    This system depends on the theory and principles of evolution for problem solving.
    Which means that this technique is about the survival of the fittest, that is,
    draw out any aspect that doesn’t fit with the desired output. A `fitness function`
    would regulate the feasibility of each function in problem solving. A tree structure
    is used to determine the best solution depending on the output function. The function
    that passes through a level gets to be part of the next level of functions. This
    next-level will be closer to the end goal but may not be the solution for the
    problem. This strategy is heavily reliant on languages and recursions that reinforce
    recursions to decode a problem. The interesting outcome of this technique is algorithms
    that evolve; that is, one generation builds the next one.


    ### Bayesian Inference

    This is a statistical method that is used to solve problems. It is common knowledge
    that statistical methods can produce multiple correct outputs. The choice would
    then be about finding the right function with the highest probability of succeeding.
    For instance, while using these techniques, you can use a set of symptoms as data
    and connect a specific disease to one symptom, and this would be your output.
    There will be cases where multiple diseases will have similar symptoms, here the
    probability is critical as the user might be able to relate to a disease with
    lower probability, but it could be the right output in that scenario.

    '
