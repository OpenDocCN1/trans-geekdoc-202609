    For instance, if an agent is being trained to be a taxi driver, each time the
    instructor shouts "brake" the agent tends to learn a condition, that is, action
    rule for when to pull the brake (component 1); it also learns that the instructor
    does not always shout. The machine is told that there are buses on the road using
    some images from a camera. The machine will then learn to recognize them (2).
    By attempting actions and observing the results, like braking hard on a wet road,
    it learns the results of its actions (3). Lastly, when it does not receive any
    instruction or tip from the passenger, it can learn about its total utility function
    (4).


    ## Representation and Prior Knowledge

    There are many examples of representations for agent components, such as first-order
    logic and propositional sentences in a logical agent; Bayesian networks for a
    decision-theoretic agent and so on. Efficient learning algorithms are used in
    all these representations. Various other types of learning include inductive learning
    which is where an agent learns from a general function or rule, analytical or
    deductive learning is where the agent goes from a general rule to a new rule that
    is logically generated and is preferred as it leads to more efficient processing.


    ## Feedback to Learn From

    Three types of feedback govern three main types of learning:


    ### Unsupervised Learning

    The agent figures out patterns in the data that is given without any feedback
    being supplied. Clustering is the most common example of unsupervised learning.
    Clustering involves detection of useful clusters from the input. For instance,
    a taxi agent would slowly develop a concept of good days and bad days of traffic
    without being given any prior knowledge or examples by its instructor.


    ### Reinforcement Learning

    In this type of learning the agent uses chains of reinforcements to study. For
    instance, when the taxi agent is not given any tip at the end of a journey, it
    is an indication that something wasn''t done right. Then the agent decides as
    to what action was responsible for the negative response.


    ### Supervised Learning

    An agent discerns some examples of ‘input-output pairs’ and ascertains a function
    that links the input to the output. In the example mentioned above (first component),
    the inputs are percepts and the instructor who says, “Brake”, gives the outputs.
    In the second component, the inputs are visuals through a camera and the outputs
    come from the instructor who says, "This is a bus." In component 3, the function
    is the theory of braking from states and the stopping distance in feet. The output,
    in this case, is available from the agent''s percepts; the teacher will be its
    environment.


    ### Semi-supervised Learning

    We will be given labeled instances and must try to understand what we can from
    a collection of unlabeled instances in this type of learning. The labels themselves
    may not be the truths that we think it is. For example, you are trying to build
    a program that can guess someone''s age based on their photograph. You can start
    by collecting labeled examples like photographs with the person''s information.
    This is supervised learning. In reality, there will be people who must have lied
    about their age. The inaccuracies might be systematic and to figure it out unsupervised
    learning should be used. This will include images, reported ages and true ages.
    This creates a continuum between supervised and unsupervised learning.


    ## Chapter Five: Machine Learning

    The combination of automated data-gathering systems along with inexpensive mass
    memory storage devices has led to the acquirement and preservation of large amounts
    of data. It could be temperature readings, pressure readings, financial data,
    point-of-scale customer purchases, news feed, etc. Efficient data mining techniques
    will be required to quantify, extract and classify useful information from this
    large volume of raw data. Machine learning has become vital for the analysis of
    massive amounts of data. The larger the volume of the data, the better it is.


    In most cases, machine-learning techniques build hypotheses from data. For instance,
    if a large volume of data indicates many instances of swans being white and zero
    instances of swans being other colors, then the learning algorithm will conclude
    that “all swans are white.” These conclusions are inductive and not deductive.
    Deductive learning is about inferences based on logic and the premises, while
    inductive learning is about constructing hypotheses, which always involves alterations
    with additional data. That is to say that, there might be an undiscovered island
    full of black swans. Inductive learning based on large volumes of data has extreme
    importance. Undeniably, science itself is based on inductive learning and its
    inferences.


    ## Memory-Based Learning

    The most practiced approach by AI when dealing with large volumes of data is to
    reduce the volume in some way. For instance, a neural network will represent what
    is fundamental about a large training data set with the networks structure and
    weight values. Similar to this is the Bayesian network where data is condensed
    into the network’s node structure and conditional probability tables. We now have
    rapid-access computer memories that help to store and compute large amounts of
    data without any prior compression or condensation processes. These methods do
    not condense data unless it is needed for a specific task. All the required reduction
    is performed when a decision is to be made.


    Here are some of the memory-based learning methods:


    - The nearest neighbor method- this is used for classification of a point in a
    multidimensional space.

    - The k-nearest neighbor rule, for instance, allocates a data point to a similar
    category as the majority of the k stored data points that are nearest to it. The
    k-nearest neighbor rule is an ideal example of memory-based learning, and it raises
    a lot of questions about probable extensions. Firstly, to use the nearest neighbor
    rule, each datum has to be a list of numbers, that is, a point or vector in a
    multidimensional space. The first question that can be raised is how should the
    data be represented for the nearest neighbor method to be applicable? Second,
    how will the distance be measured between data points? When data is represented
    as points in multidimensional space, Euclidean distance can be used.

