    如果数据不是以点的形式表示，则必须采用不同的技术来衡量数据之间的接近性。第三，在考虑最近的数据点时，彼此距离较的点对结果的影响是否比彼此远离的点更大？最基础的
    `k-nearest neighbor`（k 近邻）可以通过根据这些数据点的接近程度赋予其权重来扩展。通常使用一个 `kernel`（核）来给非常远的点赋予逐渐衰减的权重。第四，`k`
    的值应该是多少？需要使用多少邻居来对某个特定数据做出决策？通过合适的 `kernel`，每个数据点都可以被考虑在内。非常远的点对特定决策的影响为零或可以忽略不计。现在的相关问题是，`kernel`
    应该多远才能影响结果。最后，在考虑了所有加权邻居后，如何对分配数值或类别做出决策？是应该根据邻居的多数投票，还是应该根据加权成员的平均值？根据这一选择，可以使用不同版本的统计回归方法。


    ### 基于案例推理 (Case-Based Reasoning)

    这是人工智能的一个子领域，可以被视为一种广基于内存的学习。基于案例推理涉及一个案例库，用于分析、解释和解决新案例。例如，在医学领域，患者的治疗和诊断记录构成了一个案例库；一旦出现新案例，就可以从该库中找到与它相似的案例，这将有助于诊断和治疗。在法律领域，旧的法律场景被用于解释和研究新案例。


    如果存在与新案例相似的案例，它们在案例的通用空间中被视为邻居。为了找到接近的邻居，邻近性的构思应该根据相似性的度量。基于案例推理最著名的先驱是 `Janet
    Kolodner`，她是认知科学和计算领域的教授。她这样描述这一过程：需要检索的案例是那些良好的案例。它们具有为新案例构建相关想法的潜力。这种检索是通过使用新案例的特征作为案例库的索引来完成的。被标记了这些特征子集的案例，或者可以从这些特征推导出的特征的案例将被检索。现在我们拥有一组有前景的案例可以进行选择和推理。基于案例推理已被证明近年来应用最成功的人工智能技术之一。在商业和工业领域有着广泛的应用。客户服务中心和诊断系统是最常见的应用。


    ### 决策树 (Decision Trees)

    这是一种新型先进机器学习技术，涉及从大型数据自动构建被称为决策树的结构或网络。决策树涉及一系列测试，有助于确定分配给数据记录的数值或类别。它们最适用于非数值数据也适用于数值数据。将详细描述用于自动构建这些树的方法。


    #### 数据挖掘与决策树 (Data Mining and Decision Trees)

    数据挖掘涉及从海量信息中提取有用信息。例如，考虑一个包含信用卡行为的数据库。这会包含支付记录、平均购买金额、平均余额、逾期费用等等。通过使用正确的数据挖掘方法，你将发现那些逾期费用较高、平均购买金额较高以及其他相似特征的人最可能拥有高平均余额。


    数据挖掘的一种重要方法是利用数据构建决策树。可以使用简单的示例来详细阐述。考虑像 `Walmart`（沃尔玛）这样的公司。想象他们维护着一个关于客户信息的数据库，他们之前曾向这些客户发送过优惠券。这些信息将包括家庭位置、房屋类型、如果客户之前是否在
    `Walmart` 购物过，或者客户之前是否响应过他们的任何客户邮件等。如果这些信息被制成表格，每行中的信息被称为一个 `record`（记录）。列顶部的项目将是
    `attributes`（属性），列中列出的项目是其值。对该数据库进行分析后，就可以做出决策。


    ![](img/Image0003.jpg)


    上述图示可以让你了解哪些家庭响应了邮件，哪些没有。属性上的测试位于决策树的内部节点（方框）；结果位于树的末端（叶子）（圆形）。这些树有助于预测预期响应。已有多种方法被开发用于构建这些树。这里有一些例子：


    ##### EPAM

    该系统开发于 20 世纪 50 年代代，是构建决策树的最早方法。`Edward Feigenbaum` 作为他的博士论文开发了它。它根据缩写命名，即 `Elementary
    Perceiver and Memoriser`。他的研究目标是预测和解释人类现象。该程序仍然被认为是对人工智能的重要贡献。


    ##### CLS

    该程序是由 `Carl Hovland` 和他的学生 `Earl B` 在 60 年代代开发的。他们开发了一个关于人类概念的模型。`CLS` 是 `Concept
    Learning` 的缩写。


    ##### ID3

    `ID3` 的缩写是 `Iterative Dichotomizer`（迭代二分器）。`J Ross Quinlan` 在 70 年代代开发了它。使用该程序，数据记录可以被迭代划分直到属于两个不同的类别。该程序的后续版本具有多个类别。


    ##### C4.5

    Quinlan 继续开发先进且实用的决策树系统。他开发了 `C4.5` 系统，它可以处理具有数值和类别的数据库。在此期间，发生了对人工智能研究具有重要意义的发展。这是由于统计学家和人工智能人员之间的合作。`CART`
    代表分类回归树。它由 `Jerome Friedman` 开发，在处理数值属性时与 `C4.5` 。


    ##### Inductive Logic Programming

    已经开发了许多技术从数据库和其他背景知识中研究关系规则。`Quinlan` 开发了用于研究关系规则最早系统，称为 `FOIL`。由于学习到的规则可以应用于
    `PROLOG` 等基于逻辑的计算机语言，产生了一个专门学习它们的领域，被称为 `Inductive Logic Programming`。

    '
