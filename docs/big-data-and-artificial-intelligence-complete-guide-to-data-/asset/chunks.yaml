- raw: "Introduction Welcome to the world of Big Data. This book will give you a complete\
    \ insight into the basic concepts in Data Science, Cyber Security, Analytics,\
    \ and Metrics. The first section of the book will describe the concepts of Big\
    \ Data. Everyone knows that data and information in the current technical and\
    \ business world are crucial. Big data refers to large amounts of data sized data\
    \ in structured and unstructured arrangements that affect business on a daily\
    \ basis. The amount of data does not matter. Data affects the businesses and organization\
    \ of that business. Big data is examined for insights that generate better choices\
    \ and planned corporate changes. Data science is a vast subject that uses technical\
    \ approaches, procedures, processes, and schemes to get information from many\
    \ sources. The second portion of the book will describe the concepts of Cyber\
    \ Security. Cyber-security is the field of protecting processors, servers, systems,\
    \ grids, and information from malevolent attacks. Cybersecurity is also known\
    \ as IT security. This guide will describe the different categories of cybersecurity\
    \ in detail, the methods, procedures used, and how the systems are protected.\
    \ The final portion of this guide will deal with analytics and metrics for big\
    \ data. Analytics and metrics define the methods in which the data is converted\
    \ into ideas that are applied across businesses and corporations. This book will\
    \ also discuss performance analytics and metrics of big data, data science, and\
    \ cybersecurity. \n\nChapter One: Big Data and Data Science Nowadays, we all live\
    \ in a world of information and data. In this digital age, Data is present everywhere.\
    \ The digital data is increasing at a fast rate. According to statistics, the\
    \ data gets multiplied by two times every two years (Vaidya, 2019). In a company\
    \ or business, data is considered as a primary asset. The process of data processing\
    \ includes concepts of data science, data analysis, and big data. Some years ago,\
    \ data was produced only by the work-force working in companies. The data that\
    \ was generated before used to have some specific structure. It usually consisted\
    \ of employee records, delivery information, the amount of money generated and\
    \ hiring information, etc. With the advancements in technology, now, the data\
    \ comes in large volumes and in many different formats. Data is produced in large\
    \ volumes by networking, databases, and the new technology of cloud computing.\
    \ A flood of new information is forming every day. Large amounts of data come\
    \ in an unstructured format. One common example of unstructured or semi-structured\
    \ data is the data used during the transaction of payment (Big data Basics). An\
    \ innovative age of Big Data is evolving. The effects of the corporate sector\
    \ and government organizations are enormous. Large databases are studied and analyzed\
    \ to find new patterns of data. This extracted data is used for decision-making\
    \ capability in business corporations. \n\nCurrently, data scientists are searching\
    \ for new ways to make new uses of large databases. To forecast the data and information,\
    \ everybody needs data experts. The fields of Data Science and Big Data hold the\
    \ vital key to the future of the data field. The field of data science is significant\
    \ for improved advertising and promotion. Businesses are utilizing data and information\
    \ to examine their advertising plans and generate better commercial advertisements.\
    \ The demand and requirement for data experts are growing so rapidly that it was\
    \ predicted that by 2018, there would have been a 50% gap in the availability\
    \ of data experts versus the requirement (Thompson). The increasing significance\
    \ of data science has led to the development and prominence of data scientists.\
    \ These data specialists are currently an essential part of trademarks, industries,\
    \ community organizations, and non-profit administrations. The data experts work\
    \ determinedly to organize the enormous quantity of information and regulate appropriate\
    \ designs and strategies in the data. In this way, the data can be efficiently\
    \ used to understand future objectives and ideas. History of Data Science The\
    \ beginning of the field of data science can be found around fifty years back\
    \ when it was used as a substitute for computer science in 1960 by Peter Naur.\
    \ During the year 1974, Peter printed a book called \"Concise Survey of Computer\
