    # Chapter Six: Big data Essentials


    Big Data Applications that use various algorithms to perform tasks are used by
    computers to manage data. In its most basic form, an algorithm is a procedure
    that helps perform a set of operations. `Create`, `read`, `update` and `delete`
    are four basic data operations of an algorithm. Although these operations look
    simple, they are the basis of everything that is done on a computer. As the dataset
    becomes, more complex, the computer uses the algorithms found in the application
    to perform more work. Big data involves complex data sets, and the computer uses
    pattern recognition in a non-deterministic manner to process it. Therefore, to
    build a system that can learn, a complex dataset is required for the algorithm
    to use pattern recognition. Additionally, this pattern recognition also requires
    a simple subset for statistical analysis or predictions of the whole data set.
    The most common example of employing big data is in online databases created by
    sellers who track consumer purchases. Identifying the right sources of big data
    helps create machine-learning instances where a machine can learn and produce
    data in the desired manner. A combination of big data and statistics can create
    the perfect machine-learning scenario, where the machine can predict the probability
    of any given event.


    It is the algorithm, which can affect the learning process and the result. A training
    process is required for algorithms as it changes how it views big data. This training
    involves subsets of data that are used for creating patterns that the algorithm
    has to use to distinguish specific cases from general cases that were given for
    training. Although big data implies a lot of data, it is extremely different from
    any other large database. It is more complex and has depth. When compared to general
    programming, big data sources can help solve problems more efficiently with just
    enough details. For instance, consider Google’s self-driven car. Not only should
    the car have information regarding the hardware and its position in space but
    also the knowledge as to how it affects human decisions, environmental conditions,
    road conditions and other vehicles. The data source would, therefore, include
    numerous variables that have some influence on the workings of the car. With a
    traditional programming system, data will not be efficiently processed in real-time.
    If the car is going to crash, you will need the system to predict it before the
    event and not five minutes after it has crashed. The problem is in learning how
    to control big data. The sheer volume of a data set is not the only thing that
    has to be considered, but also where it can be stored and transferred for further
    processing. Generally, it is stored in memory by developers for fast processing.
    Options such as hard drive are time-consuming and expensive. Another concern when
    it comes to big data is privacy, but machine learning is all about specifics,
    but it’s not that helpful.


    It determines patterns by analyzing training data, and the training algorithm
    will perform tasks that were not programmed by its developers. Therefore, personal
    data is not relevant in that environment.


    ## Sources of Big Data


    For a machine learning application, you first require a big data source such as
    corporate-owned databases. In order to create useful sources of big data, new
    data has to be created. Developers construct existing data sources and depending
    on the needs of the clients-server architecture, but this may not work for machine
    learning instances as they are optimized to save space on the hard drive. Therefore,
    they do not possess the required depth. When you become more familiar with machine
    learning, you will come across scenarios that cannot be solved using a standard
    corporate database.


    ### Public sources


    Universities, non-profit organizations, governments and other organizations often
    have an open database that is available to the public. You can use this alone
    or combine it with other databases to create big data for machine learning. For
    instance, you can combine various Geographic Information Systems (`GIS`) to build
    big data to help with decisions such as the positioning of new factories or stores.
    This type of machine learning system can consider all kinds of information, such
    as the amount of taxes that are to be paid and even the elevation of a portion
    of land. The biggest advantage of using public data is that it is mostly free
    of cost even for commercial use, and in some cases, you have to provide a nominal
    fee.


    Also, the database would be maintained in perfect condition as the organization
    has some mandate; they use this data to generate income or utilize the data internally.
    There are a number of issues you have to consider while using public source data.
    Firstly, you have to make sure that you can attain some useful information. Listed
    below are some criteria’s you can follow while making a decision:


    1. The format of the data source

    2. The fee, if any, for using the data source

    3. Permission to use the data source since some sources are copyrighted

    4. Potential issues when cleaning the data so that it can be used for machine
    learning.

    5. Provision of proper infrastructure or access to the data source

