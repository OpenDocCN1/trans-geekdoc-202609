    因此，这种策略基于这样一个观点：在没有证据的情况下，任何假设都不会被完全信任，这导致了相应的输出。通过分析，你可以证明或反驳该假设。同样，如果不测试所有症状，就不可能确定一个人受到哪种疾病的影响。这项技术最常用的领域是垃圾邮件过滤。


    ### 训练数据集

    其核心思想是应用程序从一个名为 `receive data` 的函数开始，该函数作为输入并处理成结果或输出。例如，当程序员创建一个函数`Add ()` 时，它接受
    `1` 和 `2` 作为输入，结果是 `3`。该过程的结果是一个值。在此之前，编写程序与对 `function` 的理解相关，通过 `function` 来操作数据以产生结果。


    机器学习改变了这种方法。现在，你知道输入是 `1` 和 `2`。你也知道结果是 `3`，但你可能不知道需要使用哪个 `function` 来获得所需的结果。通过训练，学习器算法将获得不同的预期输入及其输出的实例。学习器通过这些输入创建一个
    `function`。因此，训练是一个让学习器算法为数据映射可行函数的过程。结果将是一个值或一个类别的概率。


    机器学习最终关乎泛化。其目标是将函数泛化到某种程度，使其在训练数据集之外的数据上有效。


    例如，一个小型字典将包含大约 `100,000` 个单词。包含 `4000` 到 `5000` 个单词组合的训练数据集必须构建一个泛化函数，该函数随后可以在在使用实际数据时遇到的
    `2¹⁰⁰,000` 次迭代中过滤垃圾邮件。从这个角度来看，学习看起来往往很复杂。尽管如此，为了创建一个泛化函数，学习器算法依赖于三个组成部分：


    #### 表示（Representation）

    首先，学习器算法构建一个带有 `function` 的模型，该函数根据给定输入创建所需的输出。表示将包含一组可以由算法学习的模型。从根本上说，为了让学习器算法产生所需的结果，必须创建一个模型。如果学习器算法没有执行任务，意味着数据超出了假设的范围，无法被学习。表示用于识别可以用于学习过程的特征。


    #### 评估（Evaluation）

    学习器无法创建多个模型，但它又无法区分好模型和坏模型。`evaluation function`（评估函数）有助于识别哪个模型能够根据给定输入产生所需的结果。该函数还会对模型进行评分，因为可能有多个模型产生所需的结果。


    #### 优化（Optimization）

    在某个特定点，该过程会生成一组可以从一组输入产生正确结果的模型。训练过程会寻找效果最好的模型。被选中的模型就是训练过程的最终输出。


    ### 第章：现代 AI

    在过去的几十年里，AI 领域取得了许多进展，这种进步伴随着一系列强大的计算工具。由于价格低廉的计算机性能不断提高、大型数据库的便利以及互联网的扩张，它们在部署时非常有效。目前，AI
    具有多种类人的认知能力，其中大部分是完全自动化的。由于 AI 为多个现实问题提供了解决方案，专攻 AI 研究的毕业生在机构中寻求职业。


    由于 AI 为多个现实问题提供了解决方案，专攻 AI 研究的毕业生在 `Google` 和 `Microsoft` 等机构工作，致力于提高机器的认知能力。正如工程分支一样，AI
    也扩展到了一些子领域，例如：

    - `逻辑、推理`（Logic, Reasoning）和 `知识表示`（Knowledge Representation）

    - `规划与调度`（Planning and Scheduling）

    - `机器人与视觉`（Robotics and Vision）

    - `AI 中的不确定性`（Uncertainty in AI）

    - `自然语言处理`（Natural Language Processing）

    - 基于知识和 Web 的信息系统（Information Systems）

    - `机器学习`（Machine Learning）


    #### 游戏

    尽管让计算机擅长国际象棋和跳棋等游戏被认为是对严肃目标的的愚的分散，但计算机游戏曾作为探索`启发学习`（heuristic learning）和`强化学习`（reinforcement
    learning）等 AI 技术的测试场。在之前的章节中解释了如何使用`强化学习`技术进行设计。


    #### 国际象棋

    `1997` 年，IBM 的 `Deep Blue`（深蓝）象棋计算机击败了当时的世界冠军`加里·卡斯帕罗夫`（Garry Kasparov），这是一条大新闻。这台计算机使用快速和慢
    `evaluation functions` 来理解和评估棋盘上任何棋子的位置。这些评估函数中使用的少数值与约 `8000` 个特征相关，这些特征由特殊硬件处理。以下是
    IBM 指出的 `Kasparov` 和 `Deep Blue` 之间的一些差异：


    1. `Deep blue` 每秒可以评估和检查 `200,000,000` 个国际象棋局面，而 `Garry Kasparov` 每秒只能评估和检查 `three`
    个局面。

    2. `Deep Blue` 具有更强的计算能力但象棋知识较少。`Garry Kasparov` 拥有丰富的象棋知识但计算能力较小。

    3. `Garry Kasparov` 利用他卓越的直觉和感觉以世界冠军的水平下棋，而 `Deep Blue` 不具备直觉或感觉。

    4. `Garry Kasparov` 能够快速学习并适应他的错误和成功。`Deep Blue` 不是学习系统；因此，它不能从自己的错误或对手那里思考和学习。

    5. 如果 `Deep Blue` 需要改变它的下棋方式，则需要对软件进行更改，这只能由编程团队的成员完成。`Garry Kasparov` 可以根据自己的意愿改变下棋的方式。


    #### 跳棋

    `2007` 年，乔纳森·谢弗（Jonathan Schaeffer）教授和他的团队发表了一篇文章，宣布跳棋游戏已被解决。`Schaeffer` 和他的团队自
    `1989` 年以来一直在研究它。他们最终得出结论：跳棋总是和局。他们将结果归功于先进的 AI 算法、更快的处理器、更大的内存和磁盘。花费 `18` 年的巨大努力和计算技能来解决它，这一点也不意外。

