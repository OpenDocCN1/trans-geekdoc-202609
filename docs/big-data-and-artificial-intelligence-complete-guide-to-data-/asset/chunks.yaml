    # 第四章：大数据的分析与指标


    大数据分析包含了系统的分析和决策能力。指标包括对性能的衡量以及对公司内部进展的衡量。这些指标提供了至关重要的性能指示。指标回答了“什么类”的问题，而分析则回答了“那怎样（So
    what）”的问题。本节将深入探讨大数据、数据科学和网络安全的分析与指标。


    ## 大数据与数据科学的分析与指标


    大数据分析是一个非常复杂的程序，通过检查大规模且多样化的数据组和信息，以揭示材料，如隐藏的模式、未识别的关联、市场趋势和客户偏好，这些信息可以帮助企业做出明智的业务决策。总的来说，数据分析技能和技术提供了一种检查数据组并对给定信息进行推断的方法，这将帮助企业做出明智的业务选择。数据分析为有关业务流程和展示的基础问题提供了解决方案。


    大数据分析是一个渐进式分析的过程，包含了复杂的请求，其特征包括分析模型、计算程序以及由高性能分析组织驱动的“假设分析（what-if investigation）”。大数据分析取决于特定的分析方案和软件，以及极高效的计算方案；大数据分析提供了许多业务效益。其中一些效益如下：


    * 创新的收入机会。

    * 高效的广告。

    * 改进的客户服务。

    * 更好的工作效率。

    * 相比竞争对手的优势。


    大数据分析要求大数据预测者、数据专家、分析建模师、数学家和其他分析专家来检查组织业务信息日益增长的能力。这些专家还可以分析其他类型经常被预测性业务智能操作和分析过程所遗漏的信息。数据分析的方式是，`Hadoop`集群和`NoSQL`组织主要被用作大数据的阶段部分，在发送到数据仓库或逻辑数据库进行分析处理之前。


    通常处理的数据是精确的格式。这种格式对于关系型结构更有利。当数据完整时，可以使用通常用于渐进式分析程序的软件进行检查。文本挖掘和计算分析软件在大数据分析过程中也起着巨大的作用。这类软件具有将业务智能数据主流化并提供数据可视化工具的能力。


    数据科学家使用许多性能指标，例如`Correctness`（正确性）、`memory`（内存）、`accuracy`（准确率）、`understanding`（理解度）等。数据科学家通过图像使用性能指标，以便任何人都能理解预测模型。用于评估性能的最重要性能指标是`accuracy`。该指标描述了模型预测某种情况的准确性。另一个性能指标被称为`precision`（精确率）。该指标显示了特定情况下结果的精确度。`sensitivity`（灵敏度）性能指标描述了模型内部敏感的内容。`specificity`（特异性）性能指标显示了给定信息中的特定标准。这
    4 个性能指标被大数据领域用于准确地描述用于预测分析的预测模型。


    ## 网络安全分析与指标


    企业目前面临着更广泛和更频繁的网络威胁。这些网络威胁包括各种类型的`APTs`（高级持续性威胁）、网络冲突、通过僵尸网络程序的不受限制活动、恶意脚本、恶意软件攻击（通过`Dark
    Net`（黑网）提供服务），甚至是来自企业和组织内部人员的内部威胁。这一切包括拒绝服务攻击（`DDoS`）、中间人网络攻击、钓鱼攻击、加密挖矿、勒索软件和数据泄露，每天不断地冲击各个维度和所有行业的行业。


    安全分析是用于网络安全的一种方法。它专注于对信息的分析以创建实际的安全行动。例如，观察到的系统流量可用于在真实危险发生之前识别黑客尝试的迹象。任何企业，无论何种类型，无法预测公司的未来。在安全威胁的情况下，安排和安装能够检查安全行动的安全分析技术，可以在网络威胁影响
    IT 组织之前检测到它。网络安全分析领域正在兴起。这个领域充满了前景，并为希望避免漏洞的企业提供了有力的解决方案。


    '
