    # Hebbian Theory and Cell Assemblies


    When an axon cell `A` is close enough to excite `B` and constantly fires it up,
    some metabolic or growth process takes place in one or both cells in a way that
    `A`''s efficiency, as one of the cells firing `B`, increases. This was later known
    as Hebb rule and was observed in living animals. `Hebb` also theorized that a
    group of neurons that happens to fire together formed a cell assembly. `Hebb`
    believed that thinking was the sequential activation of groups of cell assemblies
    in the brain.


    # Behaviorism


    Psychology and Cognitive Science


    `B.F. Skinner` and several psychologists attempted to make psychology more scientific
    and independent of subjective introspection. They started this by only concentrating
    on what could be measured objectively, such as, particular behavior as a reaction
    to a specific stimulus. The behaviorists believed that psychology should be about
    behavioral science and not of the mind. They did not consider the idea of identifying
    internal states of mind, such as belief systems, desires, intentions and goals.


    `Skinner`’s theories gave the idea of reinforcing stimulus, which rewards recent
    behavior and tends to make it happen again under similar circumstances (in the
    future). Reinforcement learning is a very popular strategy among AI researchers,
    even though it does not depend on internal states. `Skinner` wrote that, for each
    stimulus, the animal makes a note of the opponent''s next move and the next time
    the stimulus recurs, the animal duplicates the opponent''s moves that followed
    the same stimulus previously.


    More repetition of the opponent''s move leads to the animal model being conditioned
    to that particular move. `Skinner` suggested that verbal behavior in humans could
    also be explained through his theory.


    # Cognitive Linguistics


    `Noam Chomsky`, a linguist, argued against `Skinner`’s ideas about language. `Chomsky`
    raised the question as to how a person can produce an infinite variety of previously
    unheard and unspoken sentences with complex structures just through experience.
    These fundamental factors that `Skinner` omits are, according to `Chomsky`, linguistic
    abilities that are inborn and not learned. According to `Chomsky`, human beings
    are created to handle data or can formulate the hypothesis of unknown character
    and complexity. He claimed that humans, by birth, have a universal grammar or
    a mechanism, which develops our ability to learn and use language.


    # The Birth of Cognitive Science


    Psychologist `George A Miller` focused on internal mental processes and its limitations.
    He claimed through his experiments that the immediate memory capacity of humans
    was approximately seven chunks of information. It didn''t matter what the chunks
    represented, and we can only hold seven of them in our immediate memory. This
    paper was presented at a Symposium on Information Theory at `MIT`.


    Famous AI researchers such as `Allen Newell` and `Herbert Simon` gave a paper
    on a computer program that could solve propositional logic. This Symposium brought
    together scientist with overlapping interest and is thought to have influenced
    the founding of Cognitive Science, a discipline devoted to the understanding of
    the human mind.


    # Cognitive Science and Artificial Intelligence


    Cognitive science tried to give a clearer explanation for internal mental processes
    through ideas like memory, strategies, goals and task queues. Cognitive science
    and artificial intelligence have always overlapped since its initial phase. These
    two fields have helped each other identify new concepts by understanding how the
    human mind works.


    # Statistics and Probability


    Statistics and Probability Uncertainty is the common factor in any reasoning and
    decision-making processes, and dealing with it is an important part when it comes
    to automating intelligence in machines. The theory of statistics and probability
    stems from the attempt to quantify the laws of chance and uncertainty. The most
    important results for artificial intelligence is the Bayes rule that can be described
    through an example. The most integral application of Bayes rule is in single detection.


