- raw: "Data is basically empirical, and it is difficult to value the fictitious non-empirical\
    \ data. Information The structured, organized, processed, and presented data that\
    \ can be used is information. This processed data is what makes decision making\
    \ easier. There is, however, some information that is not data. Processing data\
    \ is about calculations of data, aggregation of data or corrections on data, in\
    \ such a way that there are generations of information.  You can add value to\
    \ data in different ways: ●      Contextualized- the purpose for which the data\
    \ was collected is given ●      Categorized - the units of analysis or major components\
    \ of the data is available ●      Calculated- if the method used to analyze the\
    \ data is given, that is, whether it was done mathematically or statistically.\
    \ ●      Corrected- if the errors were removed from the collected data ●      \
    \ Condensed- if the data was concisely summarized Furthermore, information can\
    \ be accessed, transmitted, distributed, generated, stored, processed, consumed,\
    \ produced, searched for, compressed, used, and duplicated. Information can also\
    \ have different attributes assigned to it. It can be quantitative, qualitative\
    \ or sensitive information.  \n\nKnowledge Knowledge is defined as human understanding\
    \ of a subject gained through complete study and experience of the subject. You\
    \ can consider information and data as a collective mass, but knowledge is based\
    \ on understanding the problem area, learning, and thinking individually. Knowledge\
    \ is derived from information the way information is generated from data. It is\
    \ the fusion of human perceptive processes that results in inferences. It is a\
    \ true belief system that is associated with human actions and is generated from\
    \ a flow of information. It is mostly subjective, personal and inherently local.\
    \ It does not exist objectively. Intelligence A deeper understanding of concepts\
    \ and models leads to a higher level of knowledge called wisdom. An application\
    \ of principles, morals, and expertise is required to gather and use wisdom. This\
    \ type of maturity comes with age and experience. This idea of wisdom was taught\
    \ to us by ancient philosophers like Plato and Aristotle even though there are\
    \ controversies around it. Further advancement to this wisdom is known as intelligence.\
    \ \n\nArtificial Intelligence Artificial intelligence involves a wide array of\
    \ tools and technologies that can be combined in a variety of ways to perform,\
    \ sense and cognize along with the capability to learn from experience and adapt\
    \ with time. Knowledge based systems were the most predominant and practical branch\
    \ of AI. It was applied in several areas and organizations of the world. They\
    \ were labeled as expert system shells and came with hundreds of tools. These\
    \ systems were good enough to create an individual discipline for itself. Other\
    \ concepts such as rule-based knowledge representation, machine learning, reasoning\
    \ with uncertainty, verification of domain knowledge were other areas that grew\
    \ in the field of academics.  Classifications Classifications refer to the division\
    \ of data into separate classes by employing models. Training data sets are created\
    \ for these models, which will be assigned to each class so that the algorithm\
    \ can learn. Real time information is given to this model that belongs to these\
    \ classes. This model generates a relationship that exists in the input data depending\
    \ on what the model knows from the data set. Support vector machines and decision\
    \ trees are some common classifications. The algorithms will always require a\
    \ clear-cut definition of these classes; therefore, classification can be considered\
    \ as a form of supervised machine learning. \n\nAssociation Association is a type\
    \ of analysis that helps identify any existing links between data instances. It\
    \ can be explained through a market basket analysis, where a link can be found\
    \ in the data instances of any shopper and what's placed in the basket. The information\
    \ could be virtual or real, and the algorithm always provides comparisons. Associations\
    \ come under the unsupervised machine-learning spectrum. Decision Trees Decision\
    \ trees are classifiers. They include two tasks: tree pruning and tree induction.\
    \ The latter involves pre-classified data instances that are taken as input. Decisions\
    \ are made based on splitting the data set and recursing on the split data set\
    \ until every set is categorized. The main aim while building a tree is to create\
    \ child nodes that are considered pure. This makes sure that the splits for classifications\
    \ are small in number. A complete decision tree will always be complex and may\
    \ include a lot of unnecessary structure that will be difficult to distinguish\
    \ from the other type. Tree pruning refers to the removal of these unnecessary\
    \ structures and make it more comprehensible. It also helps reduce over-fitting. \
    \ Deep Learning Deep learning involves several hierarchical layers to process\
    \ the data in a non-linear manner, and some lower-level ideas help define the\
    \ higher-level ideas. \n\nDeep learning can be considered as a class of machine\
    \ learning methods that exploit many layers of non-linear information processing\
    \ for the supervised or unsupervised method of extraction and transformation and\
    \ pattern recognition and classification. \n\nChapter Four: How Machines Learn \
    \ An intelligent agent is an entity that can perceive its environment using a\
    \ sensor and act upon its environment through its actuators. For instance, we\
    \ have our eyes, ears and other sensory organs. Our legs, hands, vocal tract,\
    \ etc. act as the actuators. A software agent gets input through file contents,\
    \ keystrokes and network packets. It acts on the environment using a display screen,\
    \ writing files or by sending network packets. An agent can be considered as learning\
    \ if its performance improves on future tasks after observing its environment.\
    \ Learning can range from something as basic as writing down a phone number to\
    \ complexities, such as theories of the universe.  \n\n1.  Why do we need an agent\
    \ to learn?  \n\n2.  If the design of the agent can be improvised, then why not\
    \ just program it into the agent? \n\nThere are three main reasons for this. First,\
    \ the designers can't predict all the type of situations the agent will be subjected\
    \ to at a time. For instance, if a robot is designed to navigate mazes, it has\
    \ to learn the layout of every maze it encounters. Second, changes are inevitable,\
    \ and it is difficult for the designer to predict it over time. For instance,\
    \ if a program is designed to predict future stock market prices, then it should\
    \ learn to adapt to low and high conditions. Third, it is a difficult task even\
    \ for human programmers to program a solution by themselves. \n\nFor instance,\
    \ people are generally good at recognizing family members, but even the best programmers\
    \ find it nearly impossible to design a computer to do it without a learning algorithm. \
    \ Forms of Learning Any agent can be improved by learning from data and the techniques\
    \ used to improve it depend on four major factors: ●       The component that\
    \ is to be improved ●       The prior knowledge the agent has ●      The type\
    \ of representation used for the component and data ●       The feedback that\
    \ is available to learn from Components to be Improved The agent would include\
    \ components such as: ●       A direct mapping system about current conditions\
    \ to actions ●      A means to draw inferences which are relevant to its environment\
    \ from its percept sequence ●      Information regarding how the environment evolves\
    \ and the agent's possible responses to it ●       Utility information showing\
    \ the desirability of world conditions ●       Action-value information. ●      \
    \ Goals that maximizes the agent's utility "
