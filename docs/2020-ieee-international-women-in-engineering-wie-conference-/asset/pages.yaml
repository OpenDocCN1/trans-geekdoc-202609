    # VII. CONCLUSION


    In this study, the writers have explored the field of intrusion detection and
    proposed a layered model that could work well for common and rare attacks. The
    challenges of designing a working model of detecting attacks has been described.
    The implementation was done via a machine learning approach using various algorithms
    and techniques. Finally, it is safe to state that the proposed model has higher
    detection rate for types of attacks, lower alarm rate and lower computational
    cost in comparison with the coexing models. In future aim, the proposed model
    is to use non-parametric techniques to obtain more useful features for intrusion
    detection, improving the detection rate by separating the normal from the anomalous
    ones. It could be an efficient solution for organizations and industries to ensure
    their server safety.


    Analyzing Fig-3, it can be seen that the first layer (of SVM), the false alarm
    rate is lower than the coexing models. But in the second layer the proposed model
    performed better, obtaining 0.0237% false alarm when using Train-20 dataset and
    0.0204 % in using Test set as well using testing the proposed model.


