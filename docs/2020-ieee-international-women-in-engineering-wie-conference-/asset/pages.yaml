    # B. Support Vector Machine (SVM)


    Support Vector Machine, we generally considered as a supervised learning algorithm
    [8]. It creates a N-dimensional hyperplane and separates the information into
    different categories. SVM can perform classification. Without the fundamental
    algorithm, SVM can classify the data into two categories.


    Given a set of occasions with labeled {x, y}, where y is the name of occurrence,
    SVM works by maximizing the margin to achieve the most effective execution of
    performance in terms of classification [6].


    The computation issue of margin-maximizing bounding function in SVM can be identified
    by the subsequent QP problem:


    Minimize:


    ```

    W(\\alpha) = \sum_{i=1}^{n} \alpha_i + \frac{1}{2} \sum_{i=1}^{n}\sum_{j=1}^{n}
    y_i y_j \alpha_i \alpha_j <X_i, X_j> \dots (2)

    ```


    Subject to:


    ```

    $y_i \alpha_i = 0 \dots (3)

    ```


    Here, the number of training data represents by 1, is 1 variable where each communicates
    with the training data xi. Soft margin parameter C controls the impact of deviations
    in the training data. The data points are clustered, and the class boundaries
    can be expressed as linear functions. SVM Equation (3) is the computation of vector,
    where each element indicates the weight of each of the data points. The support
    vectors are the data points with a greater value, containing a value not equal
    to 0 on the other hand. SVM maps all training data into a greater dimensional
    space. SVM is able to discover and correlate a maximal margin in this greater
    dimensional space [6] [8].


