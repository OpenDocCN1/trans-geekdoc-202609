    # IV. FEATURE SELECTION AND ALGORITHM


    # A. Feature Selection


    Feature selection can be defined as a pre-processing stage in both data mining
    and machine learning. It helps to define the features that are convenient for
    class prediction [11]. Feature selection is a technique that is used to minimize
    the number of features in an application high dimensional data. The technique
    of selecting features can improve performance, predictive accuracy and decreasing
    the complexity of the results [9].


    For selection procedure, the linear correlation efficient method is the most common
    and the most used all over the world. For variables pairs (x, y), the linear correlation
    coefficient r could be derived by the following formula,


    ```

    $$\frac{\sum(x_i - \bar{x})(y_i - \bar{y})}{\sqrt{\sum(x_i - \bar{x})^2 \sum(y_i
    - \bar{y})^2}} = \dots (1)$

    ```


    Here, $\bar{x}$ and $\bar{y}$ are considered as the mean of x and y, respectively.
    The value of r lies between -1 and 1. If x and y


