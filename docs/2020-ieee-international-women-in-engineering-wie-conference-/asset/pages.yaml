    Probe, U2R and R2.


    Keywords—Intrusion Detection, Anomaly, Feature Selection, Random Forest, SVM


    In this study, the proposed intrusion detection system uses Filter Correlation
    Method for selecting the features to reduce dimensionality. Support Vector Machine
    algorithms used as classifiers in the two layers. This study proposes a model
    which can detect anomalies of attacks at a low computational cost and false alarm
    rate.


    # I. INTRODUCTION


    One of the most significant problems in modern era is the Internet. While many
    use the Internet for constructive purposes, some individuals use it as an opportunity
    for malicious intent. As more users are connected to the Internet and more networks
    become accessible in our everyday lives, the Internet and its connected computers
    are becoming increasingly more targets for attacks [1]. These attacks could lead
    to network flooding, information theft or ever damage.


    Intrusion refers to the unwanted interruption or unauthorized access to a network
    or a system. It is the process of entering a computer by bypassing the security
    systems. It can lead to network flooding, information theft or ever damage. An
    IDS functions by monitoring network traffic and observing a network to detect
    malicious behavior or violations of policy. The system administrator is informed
    of any malicious behavior or compromise using a security information and event
    management system [2]. The detector redundant inspected data and then determines
    the possibility of an intrusion perceived as sign of these activities. In addition,
