    ## V. 数据集与实现


    使用 NSL-KDD 基准数据集来测试所提模型。KDD 数据集 [12] 是 NSL-KDD 数据集的更新改进版本。该数据曾用于入侵检测系统（IDS）的竞赛。每个
    NSL-KDD 记录包含一个主机间链接，包含 11 个特征（例如：Normal、login、Root、Source，命名为攻击或原始 KDD 数据集中特定攻击的名称）。


    NSL-KDD 用于测试所提模型 [12]；KDD99 按攻击类型从 DARPA 提取。通过消除重复和减少数量，NSL-KDD 从 KDD99 衍生而来的。包含两个训练集和两个测试集（数据集包含
    DDoS、Probe、U2R 和 R2 攻击类）。


    ### B. 数据预处理


    在预处理阶段，原始数据集被转换为归一化，以便实现决策并减少计算开销；具体如下：


    所有类别特征都被标记为不同的数字，如下：（TCP = 1, UDP = 1, ICMP = 1)。


    为了避免某种偏置，包含连续值的特征将使用以 2 为底的对数转换为离散值。之后使用以下连续值 z 将结果值转换为整数：


    ```

    $if(z \geq 2) = log(z + 1) \dots \quad (5)$

    ```


    为了获得更好的分类效果，随后实施了归一化过程，并将攻击分类分为正常类和四类。


