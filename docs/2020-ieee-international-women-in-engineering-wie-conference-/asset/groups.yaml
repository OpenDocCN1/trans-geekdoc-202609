    在提出的双层模型中，第一层执行数据预处理以及降维。分类使用支持向量机（SVM）完成。在所提模型的第二层之后，通过实施随机森林算法的特定分类，增强了异常活动与正常行为之间的区分。


    # III. 提提出的模型


    为了更好地区分异常行为和正常行为，将在分类之前执行特征选择过程。在所提出的双层模型中，第一层执行数据预处理以及降维。分类使用支持向量机（SVM）完成。在所提模型的第二层之后，通过实施随机森林算法的特定分类，增强了异常活动与正常行为之间的区分。


    ### B. 支持向量机 (SVM)


    支持向量机通常被认为是监督学习 [8]。它创建了一个分离数据的超平面。给定一组标记的 {x, y}，SVM 中最大化间距的计算为：


    ```

    f(w, b) = \frac{1}{2} \|w\|^2 + C \sum_{i=1}^{n} \xi_i

    ```


    受限于：


    ```

    y_i(w^T x_i + b) \geq 1 - \xi_i

    ```


    在这里，间距参数 C 控制偏差的影响。支持向量是值不等于 0 的数据点。另一方面，SVM 将所有数据映射到更高维空间，能够在该空间内发现并关联最大间距 [6]。


    ### C. 随机森林


    一组无监督或分类回归被称为随机森林 [12]。另一方面，一种用于提高准确率的集成分类器是随机森林（RF）。随机森林创建了许多分类树，每棵树都是通过对原始数据的自助采样（bootstrap
    sample）开发的。任务通过使用一棵树来完成。在形成森林后，对每一棵树都执行需要归类的的分类。随机森林算法中某一层的特征重要性是在所有树上取平均值。


    # IV. 特征选择与算法


    ### A. 特征选择


    特征选择可以定义为数据挖掘和机器学习中的预处理阶段。它有助于定义有利于类别预测的特征 [11]。特征选择是一种用于减少应用高维数据中特征数量的技术。特征选择技术可以提高性能、预测准确性并降低结果的复杂度
    [9]。


    对于选择程序，线性相关法是全世界常用的。对于变量对 (x, y)，线性相关系数 r 可以可以通过公式得出：


    $$r = \frac{\sum(x_i - \bar{x})(y_i - \bar{y})}{\sqrt{\sum(x_i - \bar{x})^2 \sum(y_i
    - \bar{y})^2}}}$$


