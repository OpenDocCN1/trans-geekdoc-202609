    proposes a two layered-based model that uses filter for dimensionality reduction
    with Random Forest and Support Vector Machine. It achieved a very good detection
    rate against all sorts of attacks including a low rate of false alarms. The contribution
    of this study is providing a framework for scientists designing good intrusion
    detection systems to keep industry and organization safe from the cyber threats
    as it achieved the desired goals of a functional IDS model.


