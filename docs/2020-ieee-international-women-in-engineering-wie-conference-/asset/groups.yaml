    IDS 模型的预期目标。


    截至漏洞数量的入侵检测特征持续进行到 [3]。异常活动可分为四类：DoS、探测（Probe）、U2R 和 R2。


    关键词——入侵检测、异常、特征选择、随机森林、SVM


    在项研究中，提出的入侵检测系统使用过滤相关法选择特征以降低维度。支持向量机（SVM）算法在两层中用作分类器。该研究提出的模型能够以较低的计算成本和误报率检测出攻击异常。


    # I. 引言


    现代时代最重要的问题之一是互联网。虽然许多人将互联网用于建设性目的，但也有人将其视为恶意意图的机会。随着连接到互联网的用户增加，我们的日常生活中网络变得越来越容易，互联网及其连接的计算机正日益成为攻击的目标
    [1]。这些攻击可能导致网络泛滥、信息盗取或损坏。


    入侵是指对网络或系统的意外中断或未经授权的访问。它是绕过安全系统进入计算机的过程。它可能导致网络泛滥、信息盗取或任何损害。IDS 通过监控网络流量和观察网络来检测恶意行为或违反策略的行为。系统管理员将使用安全信息和事件管理系统通知任何恶意行为或入侵
    [2]。检测器对冗余数据进行检查，然后确定感知为此类活动迹象的入侵可能性。此外，很难保持


    在 [6] 中，作者提出了一种基于 SVM 并结合层次聚类算法的入侵检测系统。他们能够轻松检测常见的攻击类型，但无法有效地检测稀有攻击。在 [4] 中，他们提出了一种双层模型，在两层中用
    LDA 进行特征选择，并使用 SVM 和 KNN。该研究对未见和稀见的攻击（如 U2R 和 R2L）实现了非常好的检测率。然而，结果低于使用的现有方法。在
    [7] 中，提出了一种基于子空间方法的聚类的无监督异常检测模型来识别异常。该方法没有指定应该处理哪些特定的攻击。在 [8] 中，他们提出了使用随机森林和 SVM
    作为分类器的双层模型。该研究实现了非常好的检测率。在 [10] 中，作者解释了特征选择过程的功能，并说明了它为数据集能够提供的显著收益


