    # AI 模型与网络


    ![](img/image_rsrc10E.jpg)


    ## 如何为企业构建 AI 策略


    虽然人们对制定市场计划已有许多了解，但制定 AI 计划是一个全新的领域。你如何着手制定 AI 策略？人工智能在各个市场和领域蕴含着巨大的机遇。世界领先的 AI
    宣道者吴恩达（Andrew Ng）提到，制定 AI 计划是他《AI 转换指南》中的关键要素。随着 AI 将改变每一个行业，你该如何制定一个合理的策略来利用它的力量？


    AI 策略究竟是什么？初创公司与大企业在 AI 策略设计方面存在哪些差异？AI 策略的制定与传统策略的设计不同。本章的目标是引导临床医生制定定制化 AI 计划的过程。这些发现基于我的个人经验，以及与来自
    `Toyota`、`Google`、`AI Fund` 等许多机构的顶级 AI 专家的交流。你将学习 AI 策略如何应用于公司计划、其关键要素，以及如何区分优秀和糟糕的
    AI 策略。


    ### 业务策略与 AI 策略


    有一种 AI 方法可以帮助业务策略。业务计划决定了公司的发展方向。哪些计划将产生最大的业务价值？哪些特征使产品从竞争对手中脱颖而出？业务策略通过具体目标体现，例如以关键绩效指标
    (`KPIs`）或目标与关键结果 (`OKRs`）的形式。此类方法监控了实现 AI 策略目标的进展。德中 AI 协会副主席 Raphael Kohler 指出，充分理解
    AI 策略的目的至关重要。他指出，辩论不能基于技术，而必须以业务价值为引导。正如业务策略一样，AI 方法也没有一成不变的方案。—— Dominik Haitz。公司与这些
    `KPIs` 的达成保持一致。AI 策略的目标是为 `KPIs` 的有效性提供路线图。


    ### AI 的机遇与挑战


    平衡 AI 的优劣势是理解 AI 如何帮助你的业务策略的关键。你不能指望在不采取任何主动行动的情况下，就让那些“魔法师”在你的公司上洒下机器学习的魔法来获得任何实用的东西。——
    Cassie Kozyrkov。总的来说，AI 可以做三件事：简化运营、创造新产品、改进现有产品。自动化流程的一个例子是机器人流程自动化（RPA），它将员工从枯燥、重复的任务中解放出来。AI
    还将帮助企业开发全新的新产品，例如，智能家居音箱就是 AI 驱动的。最后，它还能提升现有产品。如今大部分信誉评估由 AI 驱动。算法处理的知识比人类多得多，从而降低了消费者信贷的总成本。此外，AI
    正在处理需要理解上下文的复杂任务，或者人类需要执行多次的任务。AI 非常擅长执行定义狭的活动，但在不可预测的条件下表现较差。在准备 AI 投入之前，考虑 AI
    的性质和局限性至关重要。利用 AI 构建企业独特的竞争优势。—— Andrew Ng。


    ## AI 方法的关键要素


    现在你已经了解了 AI 策略如何应用于公司策略，以及会出现哪些可能性和问题，你如何着手制定它呢？就像每家公司都受到能源的影响一样，每个公司总有一天会受到 AI
    的影响。尽管没有任何 AI 策略是完全相同的，但它们都需要解决类似的问题。每个 AI 方法的核心组件包括“三位一体”：`数据`、`基础设施`、`算法`，并由`技能`和`组织`基础支撑。让我们深入研究每个组件。


    ### 数据


    没有数据就没有 AI。它们指的是对公司发展重要的所有信息。这可以包括从自动驾驶汽车的传感器数据到业务决策的财务数据等。数据政策的实施是每个 AI 方法的关键部分。吴恩达建议解决以下问题：


    * 你可以从战略角度收集哪些数据？

    * 你是在收集所有数据还是仅收集部分数据？


    `AI Company` 的 AI 总监 Jason Risch 强调了战略性获取数据速度的重要性。数据迟钝不应再是一个选项。Jason 观察到初创公司和大型企业中“精选”数据方法的崩溃。那些集中于在开发功能性公司之前就关注设计的初创公司会失去宝贵的资本。同样，由于数据丰富而购买初创公司的企业往往难以让他们对它们产生兴趣。这是医疗保健行业的一个典型弱点，企业在上面赌注计算机会从随机结果中发现趋势。诀窍在于收集“正确”的信息。数据是过去十年企业崛起的主要来源。数据驱动的决策是成功的关键，因此你需要确定一个强大的数据策略。-
    Tarry Singh。


    在制定数据计划后，是时候讨论下一步了。


    ### 基础设施


    这是 AI 方法的第二个主要方面。基础设施关注如何使数据可用，并为处理数据提供必要的计算能力。AI 模型对计算资源非常渴求，AI 团队需要正确的基础来构建和部署模型。理想情况下，这个网络是根据业务需求定制的。


    * 你可以建立一个单一的数据仓库吗？

    * 你使用的是云基础设施还是本地解决方案？


    集中式数据仓库汇化了对组织内可用数据的访问。在传统业务中，你可以发现数据存储在孤岛中，其他部门无法查看。这同样具有经济、公司和法律基础。然而，通过业务去中心化可以实现对组织内可用数据的访问。（注：原文此处存在大量重复句子，已根据逻辑进行优化处理）。


