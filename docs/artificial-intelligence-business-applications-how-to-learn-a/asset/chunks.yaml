- fmt: '

    Experienced numerous breakthroughs over the last decade that have brought "significant
    societal benefits and contributed to the economic vibrancy of the nation," as
    per "Planning for the future of Artificial Intelligence," a study released by
    the Obama administration in 2016. A few examples of Narrow AI include:

    * Google search.

    * Image recognition software.

    * Siri, Alexa and other assistants.

    * Self-driving cars.

    * IBM''s Watson.


    ## Machine Learning and Deep Learning

    Most of Narrow AI is driven by developments in machine learning and deep learning.
    Knowing the difference between artificial intelligence, machine learning, and
    deep learning can be frustrating. Venture capitalist Frank Chen provides a clear
    description of how to differentiate between them, noting: "Artificial intelligence
    is a collection of algorithms and knowledge that attempt and simulate human intelligence.
    Machine learning is among them, and deep learning is one of the few machine learning
    technologies."


    Simply put, machine learning feeds computational data and uses mathematical methods
    that support it. Automatic learning consists of both supervised learning (using
    named data sets) and unsupervised learning (using blank data sets). Deep learning
    is a form of machine learning which runs signals through a biologically influenced
    neural network architecture. This contains a variety of opaque layers from where
    the data is interpreted, allowing the computer to go "deep" in its learning, making
    correlations, and weighting inputs for the best output.


    ## Artificial General Intelligence

    The development of a human-level intelligence system that can be extended to any
    mission, is the Holy Grail for several AI researchers, but the hunt for AGI has
    been challenging. The quest for a "simple algorithm for learning and behaving
    in any environment" (Russel and Norvig 27) is not new, but time has not eased
    the complexity of actually constructing a computer with a complete range of cognitive
    abilities. AGI has long become a science fiction futuristic inspiration in which
    super-intelligent machines overpower mankind, but researchers conclude that it''s
    not anything we need to think about now, it’s too early.


    ## AI History

    Artificial intelligence and Intelligent robots first emerged in the ancient Greek
    myths of antiquity. Aristotle''s invention of syllogism and the use of deductive
    logic was a crucial moment in the pursuit of mankind to consider its own intellect.
    Although the origins, the past of artificial intelligence as we think of it today
    is less than a century old. The origins of modern AI can be traced back to the
    efforts of classical philosophers to characterize human thinking as a symbolic
    method.


    But the AI sector was not formally established until 1956 at a meeting at Dartmouth
    College in Hanover, New Hampshire, where the word "artificial intelligence" was
    coined. The MIT cognitive scientist Marvin Minsky and others who attended the
    conference, were highly optimistic about the future of AI. "Within a decade [...\]
    the issue of developing ''artificial intelligence'' will be significantly overcome,"
    Minsky is quoted in the novel "AI: The Tumultuous Quest for Artificial Intelligence"
    (Basic Books, 1994); \[Super-Intelligent Machines: 7 Autonomous Futures\] but
    it wasn''t that easy to create an artificially intelligent being.


    After several studies opposing success in AI, government funding and interest
    in the field declined – a period from 1974 to 1980 that became known as the AI
    Winter. Later, the field resumed in the 1980s, when the British government started
    funding it again partially, to cope with Japanese efforts. The sector endured
    another winter winter 1987 to 1993, coinciding with the failure of some early
    general-purpose computers and reduction in government funds. Yet work began to
    pick up again after that, and in 1997, `IBM''s Deep Blue` was the first machine
    to beat the chess champion, Garry Kasparov. And in 2011, `Watson''s machine` dominated
    the "Jeopardy!" quiz by defeating reigning champions Brad Rutter and Ken Jennings.


    ## The Turing Test

    The challenge created by British mathematician and computer scientist `Alan Turing`
    in 1950 to determine whether a machine is clever was controversial. Many researchers
    and AI experts still agree that the `Turing test` is not a good measure of artificial
    intelligence. "The vast majority of people in AI who have been learning about
    it think it''s a very poor test because it only looks at outward actions," said.


    ## Comparison between Artificial and Human Intelligence

    Insight into AI systems has been a lively debate since Turing invented machines:

    * Is it feasible for robots to behave like human beings?

    * How far are we from the world of smart machines?

    * Was the brain inspired by the artificial neural network?

    * Why don''t we talk about enhancing human intelligence by looking at AI?


    Human intelligence is not only about knowledge; education is also an integral
    part of wisdom, and we will develop human intelligence through improved schooling.
    But it seems like we are much more effective in training machines than we are
    in humans. There may be a lot of potential theories for this. AI is a statistical
    model, and most of the time, we will create a measure to help understand, while
    education has cultural, social, and political elements. In fact, in AI, we will
    experiment more easily to figure out which learning approach works. On the other
    hand, there are drawbacks of innovation in the area of education. Asimov once
    said, "The saddest thing of life now is that science collects knowledge faster
    than humanity collects wisdom."


    ## Rule-based versus Self-learning Approach

    There are two solutions to AI:

    1. Rule-based method where you hardcode all the rules for the algorithm to obey.

    2. Self-learning approach (i.e. machine learning) where you display the data to
    the algorithm and it understands the patterns and transformations.


    There is an overwhelming consensus that machine learning is equivalent to rule-based
    algorithms for perceptual tasks. Yet this is not who we are when it comes to human
    schooling. We are dictating enforcing so-called facts instead of presenting evidence
    allowing students to know their own facts. This stops students from internalizing
    their ideas. This may be enough for small problems, such as routine activities.
    However, in order to deal with new challenges, one has to bend and combine solutions
    easily. This comes only by knowing the meaning of the ideas, not by memorizing
    them.


    "The students are not called upon to know, but to memorize the contents narrated
    by the teacher" — Paulo Freire. As we do in machine learning, we will focus on
    people learning for themselves, in other words, self-education. Self-education
    is, I firmly believe, the only kind of real education there is. The only function
    of a school is to make self-education easier; failing that, it does nothing —
    Isaac Asimov.


    ## Stimulating Self-Learning

    Even if we believe that self-learning is the path forward, how are we going to
    do it? AI developers have made a tremendous effort to understand machine learning,
    and we have a large body of knowledge that we can use. We use an optimization
    algorithm called `gradient descent` for many machine learning tasks. Basically,
    this is how the computer thinks. It is an iterative algorithm: it solves the solution
    step by step. It begins with making a prediction, giving it input on how far it
    is from reality, making then a new, slightly improved prediction. This series
    continues until we are satisfied with the difference between the projections and
    the real facts. In other words, learning is an involved step-by-step cycle where
    the algorithm rethinks its conclusions at every step, developing a little more.


    We can also learn a few lessons by going into the testing phase. Anyone working
    on `ML` knows by heart that you train an algorithm using one data set (called
    `training data`) and use another data set for testing (called `test data`) to
    make sure that the algorithm is not memorizing (`over-fitting`) but actually learning.
    The `training data` and the `test data` will, of course, come from the same distribution.
    You can''t teach math and expect good answers to questions about history.


    ## Zeno''s Paradox Example

    If you construct a cat classifier, you train the algorithm by showing pictures
    of cats, for example: `Kitty`, `Tigger`, `Cosmo`, `Figaro`. Suppose you decide
    to hit a wall 1 meter away from you. To do that, you first need to fly to the
    center (`1/2 m`). The remaining gap (`1/2 m`) is true. You must first hit the
    middle point (`1/4 m`). This goes on and on, and there will always be an infinitesimal
    space between you and the wall. You can touch the wall, but you will never reach
    it.


    Ideally, this conversation can bring them to understand the concepts of infinitesimal,
    or at least to build a sense for them. Using `gradient descent`, we should ask
    students to think about instantaneous velocity: "Average velocity is a change
    over a given period. But how do you calculate the instantaneous speed? Instant
    means that the time interval is zero and you can''t switch because the time doesn''t
    run. It seems that the instantaneous velocity will be `0/0=undefined`." Again,
    after several iterations, they will possibly come to the conclusion that as the
    time interval reaches `0`, the average velocity reaches instantaneous velocity.
    In Zeno''s paradox, this is what the derivative is (the derivative of displacement
    as a function of time), and they themselves reached this conclusion when trying
    to find answers to some questions.


    ## Conclusion

    From this interpretation, we can also enter the above equation. I am not saying
    that the equations should be excluded from school, but students should consider
    the inspiration behind these calculations. I am not an authority on teaching derivatives
    to humans. Thus, I have attempted to provide a rough description of a self-learning
    approach to them. What’s critical here is the method, not the derivatives. This
    definition can be extended to any topic. For example, to teach photography, instead
    of setting down guidelines for good photography, you can guide students to good
    websites, books, etc. so that they can see and create their own interpretation
    of photography. In the meantime, you should arrange exhibits to exchange their
    pictures and develop through positive discussions.


    If you''re interested in studying the derivatives, watch Grant Sanderson''s video.
    It''s a perfect example of good instruction. At some point, he asks a few questions
    and says, "stop and think." That is the whole idea. One needs to stop and think
    in order to understand more. He also says, "If it feels weird and paradoxical,
    fine! You''re grappling with the same problem as the math fathers did..." In a
    way, he''s encouraging you to become Newton, and that''s what self-learning is.


    In addition, it''s safe to assume that as artificial intelligence is a representation
    of human intellect, it would be a massive mistake if we did not make use of its
    results:

    * we would encourage self-learning instead of rule-based learning. We realize
    that machine learning is the path forward for the AI domain.

    * Students should strengthen their own conclusions. As we do in `gradient descent`,
    we could only tracking the learning process, giving students input at every stage,
    but not the answer.

    * To ensure that students strive not to memorize, we will challenge them with
    scenarios that have never been encountered before. For machine learning, we frequently
    evaluate a dataset algorithm that has never been used before.

