    # 市场现状


    人工智能目前已渗透到我们生活的许多方面，在不久的将来它将一直存在。这种对最佳开源人工智能应用的俯视式观察提醒了我们人工智能已经如何塑造了我们的生活。想象一个你正在餐厅里用餐的模拟世界。在这个假设的例子中，从你盘子里盛放的食物到照顾你的服务员，一切都是根据你的口味和性格进行规划的，而完全没有问过你任何一个问题。想象这样一个世界，只有这家餐厅准备餐食的角度或服务员的微笑可以根据潜在的建议进行衡量，以匹配你的风格或心情。在这样的特定场景下，如果你正尝试买一双鞋，你只需要在手机上滑动几次，所有你喜欢的颜色的、具有精确鞋底形状和高跟高度的可用鞋子就会出现在你的电脑上。这完全归功于机器学习（`ML`）——而且无疑是无限的。


    人工智能或 `AI`已经渗透了我们生活的几个方面。让我们想想 2018 年吧！我们用来用于搜索和驱动智能手机的许多语音识别技术都是一个新时代的开端。我们尚未掌握
    `AI` 的全貌。一小部分 `AI` 技术现在已安装我们的车辆内部。苹果的 `Siri`、谷歌的 `OK Google` 和亚马逊的 `Alexa` 应用也在运行，从而在监控你的声音和语音的同时回答你的问题。这些由
    `AI` 支持的平台提供了自然语言处理网络，并能够响应命令。你现在可以获得目的地的指引并搜索类似的餐厅，这一切只需在手机上揉搓手指即可！目前，自动驾驶车辆正在开发中，机器人数量正在不断增加，因为预计它们将在非常遥远的未来在某些领域取代人类。你可能会想象机器人酒店前台接待和清洁我们房屋的机器人，将我们变成沙发土豆。是的，好吧，让我们从事情的轻松的一面来看吧！


    机器学习是人工智能的一部分，与计算机自学习紧密结合。这确保了机器可以学习进化和轻松适应，而不需要编程。自动化被定义为一种新的数字技术，它在任何过程中都不再需要人的帮助。换句话说，这被视为一种程序功能。这种方法对特定过程或设备使用各种管理机制，例如自动化机械、装配线、锅炉、电信网络、容器、飞机和车辆，这意味着人类的干预很少或没有。一些过程甚至已经完全计算机化。我们今天所知的自动化始于
    11 世纪的基础设备，其中包括水轮。逐渐地，人们开始建造这些基础设备并随着时间的推移而进化。


    ## 市场上最常用的 12 种人工智能工具


    ### Apache Mahout

    这是一个位于 `Apache License` 下的开源机器学习平台。它最初设计用于改进涉及统计和线性代数的常见数学问题的处理工作。这个 `ML` 工具由
    `Apache Software Foundation` 开发，基于一个名为 `Mahout Hadoop` 的框架。数据研究人员使用这个开源深度学习平台对
    `Big Data` 进行关键且彻底的研究。对客观数据的理解可以推导出有价值的信息并识别模式。`Mahout` 算法通过首先将数据保存到 Hadoop 分布式文件系统，帮助用户对
    `Big Data` 进行聚类和分组。它是跨操作系统的并为用户提供 `R` 语法环境。链接：`https:/mahut.apache.org/`。


    ### 分布式机器学习工具包 (DMTK)

    它只是一个简化各种 `Big Data` 活动的开源 `ML` 工具。`DMTK` 由 `Microsoft` 发布，向此工具包添加新的复杂的算法。该工具包帮助研究人员根据其需求更改和调整算法来与其工作。从历史上看，研究人员处理
    `Big Data` 时需要大量的计算资金，因为已经证明更大的数据模型有助于提高性能，但那变得非常困难。`DMTK` 允许在系统算法和 `ML` 算法中发挥创造力。链接：`http:/www.dmtk.io/`。


    ### 开源神经网络 (OpenNN)

    是一个用 `C++` 语言编写的开源库。它是为了学习和神经网络的应用而构建的。该库具有简单、深层的架构，用于高级的 `ML` 研究。这个开源库被用于垂直物流和营销。`OpenNN`
    允许高强度计算，因为它具有更快的处理器速度。链接：`http:/www.openn.net/`。


    ### OpenCyc

    它是一个使文本理解成为可能的开源知识资源。`Cycorp` 发布了 `OpenCyc` 以确保消费者可以免费访问此知识库，以便他们可以在许多应用程序中使用
    `OpenCyc`。`OpenCyc` 广泛的知识库包含了各种定义、数据、分类法、陈述和法律。它可以通过两种方式访问，即本体论和语义网端点。上述也可以称为永久的
    `URIs`，这意味着所有的 `RDF` 版本和人类类型都返回给用户。`Cycorp` 允许用户浏览海量档案并分析相关信息以提供正确的分析。这有助于区分单个关键词搜索的相对术语和同义词，并确保应用程序像个人一样运行，从而展示了人类的认知能力和判断力。`OpenCyc`
    一直为 `AI` 开发者的倡议提供支持，他们现在可以使用他们的本体论来确保机器学习（`ML`）可以被人类干扰，以阻止机器造成损害。`Cyc` 支持 `AI`
    开发者的倡议，他们现在可以使用他们的本体论来确保机器学习（`ML`）可以被人类干扰，以阻止机器造成损害。链接：`http:/www.cyc.com /opendec/`。


    ### H2O

    这是一个由 `H2O.ai` 开发的开源 `ML` 开发平台，供程序员和 AI 研究人员使用。它使用 `R`、`Python` 和 `Java` 语言编写，用于让用户获取有价值的教训。链接：`http:/www.h2o.ai/`。


    ### TensorFlow

    这种由 `Google Brain` 的开源 `ML` 库帮助你在两种编程语言——`C++` 和 `Python` 中编写数据流和函数。`TensorFlow`
    由 `Google` 开发用于更好的 `AI` 应用。这个开源 AI 平台也被 `Gmail` 和 `Google Search` 使用。它的可用性没有限制。你可以将其用于
    `TPUs`、`CPUs` 以及 `Mac` 上的手机或平板电脑。`TensorFlow` 于 2015 年以 `Apache Source License`
    发布。链接：`https:/www.tensorflow.org/`。


    ### Deeplearning4j

    正如其所示，`Deeplearning4j` 是一个专为深度学习设计的开源 AI 平台，由位于旧金山的 AI 研究人员产生，根据 `Apache License
    2.0`。它使用 Java 虚拟机 (`JVM`)。该库被称为 `ND4J`，处理 `CPUs` 和 `GPUs`。该架构用于创建神经网络并具有几种复杂的可视化方法。这种方法用于信息安全以及图像识别领域，可以在各种
    `API` 语言如 `Python` 和 `Clojure` 中找到。链接：`https:/deeplearning4j.org/`。


    ### Caffe

    这是一个由 `Berkeley Vision and Learning Center` 开发的开源 AI 平台。它支持深度学习并能够存储数百万图像。它具有惊人的速度并在
    `BSD-Clause` 许可证下发布。这种复杂的 AI 方法被翻译为 `C++` 并具有 `GUI`，让你可以在 `CPU` 和 `GPU` 之间切换。这种方法被多个项目中的研究人员使用，并在多媒体领域建立了实现。链接：`http:/caffe.berkeley.org/`。


    ### ONNX (开放神经网络交换)

    ONNX 作为一种 AI 研究人员常用的深度学习模型开源 AI 格式。它主要是 `Facebook` 的计划；然而它由 `Microsoft` 和 `AWS`
    资助。这个开源深度学习平台建立于 2017 年，当时 `Facebook` 和 `Microsoft` 两家科技公司聚在一起构建 `ML` 应用。此接口允许用户添加他们的创意材料，如可扩展图形，并允许他们根据自己的规格更改网络。链接：`https:/onnx.ai/`。


    ### Ory

    它是基于 `Spark` 和 `Apache Kafka` 的开源应用。`Ory` 支持更大规模的实时学习。该框架被 AI 研究人员用于应用开发以及分组。链接：`http:/orix.io/`。


    ### Apache SystemML

    这是一个可扩展的开源 AI 框架，专注于 `Big Data` 并设计用于解决复杂的数学问题。它可以应用于 `Spark` 和 `Hadoop`。它运行在
    `Python`-R` 语法上。它应用于 `GPUs` 的深度学习和处理的网络架构。链接：`https:/systemml.apache.org/`。


    ### MLlib

    它由 `Apache Spark` 引入，是一个用于学习算法的机器学习平台。这个 AI 框架使用了许多常用语言，如 `R`、`Scala`、`Java` 和
    `Python`。它将在 `Hadoop`、`Kubernetes` 或云端等平台上运行。这个库包含了许多深度学习和关键的 `ML` 算法。它让 `ML`
    对于 AI 研究人员来说更简单更现实。


    ### 企业的 AI 趋势


    大多数人经常将人工智能与科幻反乌托邦等同起来，但随着人工智能的增长在我们的日常生活中变得日益普及，这种形象正在消退。现在，人工智能是一个家喻户晓的名字（偶尔甚至出现在家庭中——你好，`Alexa`！）。虽然人工智能在现代文化中的采用是最近的发展，但这绝对不是一个新主意。人工智能科学领域产生于
    1956 年，但需要几十年的研究在创建人工智能程序并将其转化为技术现实方面取得实质进展。人工智能在工业中有广泛的应用。现实中，我们大多数人每天都以这种或其他方式与人工智能互动。从普通到惊艳，人工智能正在挑战每一个每个行业的几乎任何市场活动。当人工智能创新泛增时，这对于希望保持竞争优势的公司来说正变得至关重要。人工智能领域一直在进行大量工作。我们无法绘制一张
    `AI` 如何进展的地图。尽管如此，我们应该寻找那些引起大量兴趣并符合业务趋势的技术；


    1.  AI 将逐步跟踪并优化业务流程。虽然劳动力中的第一批机器人主要涉及包装和生产线等手动任务的自动化，但今天的软件机器人能够完成我们通常在计算机上完成的常规但必要的工作。填写文档、创建报告和提供文件都是计算机可以完成的，跟踪我们所做的并学习如何做。这种技术——机器人技术——将我们从繁琐的手工工作中解放出来。


    2.  持续的个性化将在实时发生。这种现象由 `阿里巴巴` 和 `Google` 等公司的兴起驱动，以及提供定制化内容的能力。像 `Dominos` 这样的服务将知道我们最可能订购什么，并确保“立即购买”图标在我们面前出现。


    3.  随着数据变得越来越可用，AI 变得更有价值。数据的可用性对于想要进入自动决策的企业和组织来说也是障碍。然而，随着数字领域模拟过程的方法的发展，AI
    可以在离开设施的情况下驱动数小时。2020 年将看到模型准确性的提高，使它们更高效。


    4.  更多计算机正在使用 AI 驱动的技术。随着实施 `AI` 的设备和技能变得更便宜且更容易获得，下一个十年将看到各种形状和大小的机器开始探索。AI 技术逐渐整合到汽车、家电器和办公设备中。


    5.  人类与 AI 的协作正在增长。越来越多的人将习惯与 `AI` 驱动的设备和机器人一起。工具正在被开发，允许我们利用人类的能力——那些 `AI` 尚未处理的能力——如创造力、策略和沟通。


    6.  AI 越来越多在“边缘”。当我们在搜索 `Google` 或翻阅 `Netflix` 评论时，我们日常生活中使用的 AI 发生在“云端”——在我们手中或桌面上。数据驱动的算法在远程数据中心内运行，实时分析将逐渐成为我们交流的基础设施，即使我们有不稳定的或没有互联网连接，我们最终也能做到这一点。


    7.  AI 逐渐被用于创建视频、歌曲和游戏。有些东西，即使在 2020 年仍然总是留给人类。然而，人工智能对娱乐媒体的影响预计将增加。去年，我们看到在 `AI`
    的帮助下，罗伯特·德尼罗变年轻了，马丁·斯考塞斯的壮丽作品《爱尔兰人》，以及使用 `AI` 产生全新的视觉效果和技巧可能会变得更加流行。在整个视频游戏中，`AI`
    可以继续被用于构建供玩家战斗的人类敌人，并不断改变游戏性和难度，使游戏对每个技能水平的玩家来说仍然是迷人的体验。因此，尽管 AI 生成的音乐可能不是每个人的菜，但
    `AI` 在生成复杂的声景方面表现出色——想想 `Spotify` 或 `Google Play` 等平台上的智能播放列表，它们将旋律适应我们日常生活的心情和节奏。


    8.  在网络防御中，人工智能将变得越来越重要。当黑客、钓鱼和社会操纵攻击在人工智能先进预测算法的推动下变得越来越复杂时，智能技术可以在保护我们免受这些入侵方面发挥日益重要的作用。AI
    可以识别计算机活动或购买可能是恶意行为的信号。5G 和其他网络技术将为公司提供新方式提供服务的绝佳机会。信息保护支出将继续增加，具有特定能力的人将被强烈需要。


    9.  我们许多人将与 AI 通信，可能还没有意识到。面对现实吧，考虑到近年来客户服务中自然语言聊天机器人的大增，我们没有人知道自己是在与机器人还是人类互动。然而，随着用于训练自然语言处理的数据集继续扩大，人类与机器之间的区别可能变得难以区分。随着深度学习和如强化学习等半机器学习模型的引入，旨在适应我们的模式并从我们自己的语言推导出含义的算法将变得更加强大。因此，虽然我们都可能假设在寻找知识或帮助时倾向于与人交流，但机器人实现了在回答请求方面变得更有效更可靠的承诺。考虑到驱动客户服务门户的技术的持续创新和成熟，可能会发生实际变化。


    10. 但即使我们不知道，AI 会记住我们。也许更令人不安的是，随着我们进入下一个十年，脸部识别系统的推出预计只会加速。不仅在中国（政府希望将脸部识别成为进入电信网络和公共交通等设施的强制要求），而且在全球范围内。公司和政策制定者正在不断通过这些方式询问我们是谁，并理解我们的态度和行为。


    '
