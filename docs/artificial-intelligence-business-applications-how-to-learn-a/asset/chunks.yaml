    # TO KNOW ABOUT AI


    Problems will begin with how we interpret "AI" and related words for business
    audiences. If you follow the most popular Artificial Intelligence posts, it''s
    easy to get swept up in their thought-provoking consequences and forecasts. The
    effect of AI on culture and everyday life should be felt by all, and many journalists
    and futurologists will help us deal with what that involves. Company is more prosaic,
    though, and what is most relevant typically comes down to sales, expenses, consumers
    and competitiveness. Clearly, there is a need to address larger image concerns,
    even legal ones. But also, these are heavily affected by the same four goals in
    the company sense.


    So, to understand what AI means to business leaders, we should continue by looking
    at the topic through the kind of lens they use. What quickly becomes apparent
    is even clarifying what the word "Artificial Intelligence" entails to a company
    audience is not as easy as we would have expected. There are several meanings,
    each of which meets the interests of various viewers. Some concentrate on computer
    science, while others show the past of the word. Some are very philosophic in
    nature; others are of doubtful utility. For instance, one of the top five search
    results for "What is Artificial Intelligence" told us that "Artificial Intelligence,
    also called Machine Intelligence, is machine-proven intelligence."


    We are exacerbating this by using `AI` as a catch-all suffix for a variety of
    related (-ish) concepts, such as Artificial Intelligence, `Machine Learning`,
    `Deep Learning` and `Big Data`. There are, of course, major differences between
    them, but they are not relevant here. For our purposes, we will use a single mark
    ("AI") and describe it in business-oriented terms. Business customers typically
    tend to concentrate on actions, results and market interest. So to frame the discussion
    for business audiences, here is the definition of AI that we use at `AI Prescience`:
    for business, "AI" means computer-that perform, improve or reshape business activities
    by simulating human behavior, with the goal of enhancing business efficiency,
    or efficiency. At one level, this is a fairly straightforward view of AI, with
    an emphasis on business outcomes. Note, however, that the distinguishing characteristic
    of AI is its capacity to mimic human behavior, not to reproduce it. That is not
    necessarily what we think, because it means that how simulation is done is subordinate
    to what it facilitates. Yet that''s usually the truth for companies.


    ## Why Business Leaders Do Not Know If AI is "Intelligent"


    This kind of connotation is taken away from the fact that — in a business context
    — it is not relevant if artificial intelligence functions the same way as a human
    brain. It doesn''t matter whether or not AI is "truly" intelligent. What matters
    to business is whether AI can produce better results in jobs where human beings
    are/were needed. This view sees AI as just another step in the evolution of computerization,
    and even industrialization. What sets this step apart from earlier technology
    is that it carries out (and gradually improves) things that we thought only humans
    could do. This is because it consists of computational programs with features
    that we thought were reserved for humans.


    Examples of human characteristics AI simulates include:

    *   Understanding and recognition of our environs (such as cameras in self-)

    *   Interpreting and assigning "meanings" to information (such as converting hand-sketches
    and notes to `HTML` web pages)

    *   Handling ambiguity (such as knowing whether someone looking online for "golf
    clubs" wants to buy golf equipment or find places to play).


    Now, we''ve got a chance to simplify any or all of it. If the result is stronger,
    whether the intelligence is "actual" or artificial is not especially important
    in terms of market results. That''s not to suggest that business leaders should
    not be involved in the other ramifications of AI, such as ethical dilemmas and
    the effect on the workplace. Or, if anything, the reverse. It''s just that if
    their decision-making standard is solely market results, potentially complicated
    AI decisions can then seem very straightforward. But that''s going to push us
    through a very different debate, one after another. For the time being, the biggest
    message for market executives is that AI development in the industry is more about
    changing the things that people historically had to do. But that''s just scratching
    the surface, of course.


    ## What else company leaders need to learn about AI?


    ### Why should Market Leaders take note that AI is all about data & computation?


    When market owners have an insight on what AI is, they generally don''t need to
    grasp the nuances of how it functions. However, the understanding is not complete
    without the knowledge of some of the fundamental principles. Of the main concepts
    behind AI, perhaps fundamental to business is that AI requires powerful machines
    to store huge, unprecedented volumes of data. Irrespective of implementation and
    intent, AI is basically searching for trends, correlations and variations in the
    data it receives.


    The consequences for market audiences are: to benefit from AI, and companies need
    to collect and maintain large volumes of data, use extensive computer analysis,
    storage and resources to derive value from it. It could entail new capabilities,
    which were not historically applicable to most companies. The data we are concerned
    about is not just conventional computerized company records, such as sales receipts,
    product catalogues and customer account descriptions; but it also contains printed
    records, web material, handwritten pages and audio-visual materials (e.g. photographs,
    videos and phone calls).


    That''s because today''s technologies can digitally collect almost all meaningful
    details, regardless of what type, almost. With previous waves of technology, data
    could generally only be inserted into a computer system. One way to bring this
    to life is to ask whether a person can identify a piece of data and understand
    what it means. If they do, so either AI can, or eventually it can learn how to
    do it.


    So, it''s definitely to be able to do so quicker, to accommodate even bigger volumes.
    Company data sizes are mindboggling — hundreds of millions or billions of things
    (such as bank transfers or consumer clicks) are commonplace. Yet cheap storage
    means that we can conveniently store all of this and more. And cheap computational
    power means that we can easily scan the details. And, from a certain point of
    view, it makes sense to archive everything we might possibly learn about, in case
    happens to be useful. That''s why cloud computing is always linked to AI. Most
    of what AI can do for the industry has been technically feasible before, but with
    prohibitive costs or timescales. Today, it''s inexpensive and convenient for everyone
    to use computing resources that were traditionally only available to governments.
    So, to use AI efficiently in your business, you may need to collect and process
    data that you may not have care of, and use technologies that you may not have
    considered. And to do so, you''re going to need access to resources you may not
    have before.


    ### How AI Unleash Data & Computing


    Teams are developing applications that integrate data and computation in specific
    ways. One collection of AI technologies turns collected data into accessible knowledge
    to be passed on other programs to do something with it. Examples:

    *   Recognizing text in photographs or handwriting.

    *   Recognizing words in details that consist of spoken commands or records.

    *   The detection of facial expressions in data, consisting of videos and images.

    *   The second form of AI technology analyzes data gathered in order to identify
    trends, correlations and anomalies.

    *   AI can, for example, analyze sales data to discover new, previously unseen
    insights into what makes company successful with individual customers.

    *   If an obstacle is met by a self-driven vehicle, AI can make it idle and re-route
    to its destination with the least delay.


    If the challenge is vulnerable human, he or she will call for help. Well using
    AI in business means using these technologies to solve real, relevant problems.
    AI experts will be familiar with the features of the problem that make it ideal
    for an AI solution, the availability of accurate data. But there are also other
    characteristics of the problem that make it (or not) ideal for an AI solution.
    How an AI system thinks and deals with unpredictable circumstances is a vital
    part to develop AI systems. That is also when variations in vocabulary tend to
    exist with terms such as "supervised" and "unsupervised", or "narrow" and "general"
    knowledge. One of the essential things about AI to consider for business leaders
    is to pick the right challenge to tackle and the right market change to the goal.
    This will largely rely on the expertise of their AI staff, along with restrictions
    as scheduling and budget. Yet hopefully, it''s going to be important where business
    executives have a degree of awareness about themselves. This is because applying
    AI to the industry is a real minefield of unpredictable outcomes and unintended
    effects. There appear to be a growing array of instances where corporate executives
    pay the price for high-profile IT problems, not technology executives. And, if
    AI''s business outcomes are not good, the blame lies with the business leaders
    who ordered the research, not the data scientists who did it.


    ## Data Holds Secrets About Our Industry & Consumers We''re not likely to know
    yet


    The data we have on company organizations such as consumers and goods, the more
    relationships AI can examine between them. E.g., if you know the customer name,
    address, date of birth and transaction history, you can start creating some valuable
    insights. Even if you do learn more about their daily life, how they spend their
    spare time, and how they have the most effect over them, there are more valuable
    information to discover about them. Retailers have done this for years, e.g. using
    age, class, socio-economic background, and so on, for targeted promotions.


    But now, we have access to more data than we ever imagined we could. For example,
    social media accounts and updates together offer a nuanced picture of a person''s
    personal and professional life. AI provides the opportunity to access the secrets
    kept inside the records, in ways that business is only beginning to understand.
    More specifically, we''re only beginning to understand what our data should express,
    and the kind of inferences and theories that arise. This also happens because
    of unexpected effects and is usually understood only through reconsideration.
    For example, profile problems surrounding unintended ethnic or gender discrimination
    of recruiting processes indicate that diversity is going to remain a controversial
    feature of AI for a long time to come. Another explanation begins with the ad
    placement, then finishes somewhere that we obviously haven''t seen yet:

    *   It''s normal to get a little frightened when an online ad "knows" about the
    website you''ve just visited, maybe with another application.

    *   It''s even more disturbing when a commercial refers to something you mentioned
    in an email or social network post.

    *   If businesses know so much about you that they can pick hyper-advertisements,
    who will decide what else they could/would/should do with that knowledge as they
    discover new ways to monetize it?


    When things are set up, the solutions are undoubtedly those of the corporate executives.
    So, they''re there. Takeaways to the company executives:

    *   In order to make successful use of AI in your business, you need a wide variety
    of data of different types.

    *   You would now require more computing resources and capacity than you had before
    and new expertise of those on the existing technology & company teams.

    *   The more data you get, the more ways you''re going to figure out how to use
    it.

    *   As the forms you can use data & AI through, so will the chances to save money.

    *   But that would go hand-in-hand with expanded incentives to do illegal stuff
    with data and AI technology — unintentionally or knowingly.

    *   Efficient use of AI technologies to enhance business is a joint endeavor because
    as a market leader, you are part of a large team of people who will make progress.

    *   However, when AI creates issues, liability can be less broadly spread.

    *   As a market executive, you are part of a much smaller community who can decide
    how a company plans and reacts to AI''s business opportunities and threats.

    *   And as regulators and policymakers generally fail to keep up with technological
    advances, you may find yourself facing concerns, decisions and dilemmas far beyond
    your own business.

