    2. 理性地思考。

    3.像人一样行动。

    4. 理性地行动。


    前两种理论涉及思维过程和逻辑，而其他理论则涉及行动。特别是 Norvig 和 Russell 关注致力于获得最佳结果的**理性智能体**，他们注意到“图灵测试所需的所有始终允许智能体采取理性的行动”（Russel
    and Norvig）。麻省理工学院（MIT）的人工智能与计算机科学教授帕特里克·温斯顿（Patrick Winston）将人工智能描述为“约束算法，它通过符号揭示了支持将思维、解释和行为结合在一起的循环模型”。尽管这些概念对普通人来说可能很模糊，但它们有助于将该学科确立为计算机科学的一个领域，并提供了一个蓝图描述。在
    2017 年的日本 AI Experience 上面对观众演讲时，DataRobot 首席执行官 Jeremy Achin 在演讲之初对目前 AI 的用法给出了如下描述：“AI
    是一种能够执行通常需要人类智能才能的任务的计算机系统……其中一些人工智能系统由机器学习驱动，某些由深度学习控制，而另一些则需要人类智能”。


    ## AI 是如何使用的？


    ![](img/image_rsrc10E.jpg) 人工智能通常分为大类：


    *   **弱人工智能 (Narrow AI)**：通常被称为“贫弱 AI”，这种人工智能在有限的上下文内工作，是人类智能的体现。这始终基于异常出色地完成单项任务，尽管这些计算机看起来很聪明，但它们的工作受到的限制比最简单的人类智力要多得多。

    *   **通用人工智能 (AGI)**：AGI 也被称为“强 AI”，是我们在电影中看到的人工智能，包括《西部世界》中的机器人或《星际迷航：下一代》中的数据博士。AGI
    是一种拥有通用知识的计算机，像人类一样，它可以利用这些知识解决任何问题。

    *   **窄人工智能 (Narrow Artificial Intelligence)**：窄人工智能是迄今为止最积极的人工智能发现。窄人工智能专注于执行特定任务，它具有


