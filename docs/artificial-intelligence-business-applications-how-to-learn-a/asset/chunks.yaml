    # HOW MACHINE LEARNING WORKS


    ![](image_rsrc10E.jpg)


    The three key building blocks of the Machine Learning program are the model, the
    parameters, and the learner.


    * The `model` is the device that makes predictions.

    * The `parameters` are the variables considered by the algorithm to make predictions.

    * The `learner` changes the `parameters` and the model to match the forecasts
    with the actual performance.


    Let us draw on the analogy of beer and wine to explain how machine learning works.
    The machine learning model here has to determine whether a drink is beer or wine.
    The criteria selected are the color of the drink and the alcohol concentration.


    ### The First Step: Know from a training package

    It means taking a sample data collection of multiple drinks for which the amount
    of color and alcohol is defined. Now, we need to describe the definition of each
    group, that is, wine and beer, in terms of the value of the `parameters` for each
    form. The model can use the definition to determine if a new drink is a wine or
    a beer. You should represent the values of the ''color parameters'' and ''alcohol
    percentages'' as `x` and `y` respectively. Then `(x, y)` determines the parameters
    for every drink in the training results. This data collection is considered a
    training package. These values, when plotted on a graph, provide a prediction
    in the form of a line, a rectangle, or a polynomial that is ideally matched to
    the desired results.


    ### The Second Step: Calculation of the error

    Once the model has been trained on a defined set, it needs to be checked for inconsistencies
    and errors. We use a new collection of data to accomplish this mission. The result
    of this study will be one of the four:


    * `True Positive`: when the model determines when the situation is real.

    * `True Negative`: where the model does not foresee the situation when it is absent.

    * `False Positive`: when the algorithm forecasts a state when it is absent.

    * `False Negative`: if the model does not foresee the situation while it is present.


    For the sake of convenience, we have chosen only two parameters to tackle the
    machine learning question, namely the percentage of color and alcohol. But in
    fact, you''re going to have to consider hundreds of parameters and a wide range
    of learning data to solve a machine learning problem.


    ### Noise and Errors

    The theory that has been generated would have a lot of mistakes due to the noise.
    This is an unwelcome phenomenon that obscures the underlying interaction in the
    data set and weakens the learning cycle. There are many explanations for this
    disturbance to occur:


    * Wide collection of training results.

    * Errors in input results.

    * Data labelling errors.

    * Unobservable characteristics that could have an effect on the classification
    but are not included in the training set due to lack of evidence.


    You should tolerate a certain amount of training error due to noise in order to
    make the theory as clear as possible.


    ### Testing and Generalization

    While an algorithm, or theory, works well into a training set, it may fail to
    apply to another set of data outside the training set. It is also important to
    decide if the algorithm is suitable for new data. Checking with a collection of
    new data is the way to test this.


    Generalization also refers to how accurately the model forecasts the effects of
    a new data collection. When we change the theory algorithm to the highest possible
    precision, there still may be fewer errors in the training data, but there may
    be more errors when analyzing new data. We''re finding this `underfitting`. On
    the other hand, if the theory is too complex to match well with the outcomes of
    the study, it can’t be generalized appropriately. That is the case of `overfitting`.
    In any case, the findings are fed back to train the algorithm further.


    ## Differences between Machine Learning and Artificial Intelligence

    AI addresses more detailed problems when designing a system, utilizing areas such
    as cognitive science, image recognition, artificial learning, or computer neural
    networks. On the other hand, ML stimulates the computer to benefit and learn from
    the outside world. The exterior atmosphere may be anything like optical storage
    units, cameras, electrical parts, and others. Artificial intelligence also allows
    robots and systems to perceive and perform the things that people perform. While
    machine learning relies on feedback received or queries asked by users, the system
    works by checking on information present in the knowledge base and then generates
    output.


    ## The technology of Data and Machine Learning

    Data science is the collection and interpretation of data generated by various
    sources to develop useful conclusions that will support a variety of market purposes.
    Data Science method includes the acquisition, purification, interpretation, and
    visualization of data for the purpose of identifying useful correlations and insights.


    When data sets are large, and it is technically difficult for data scientists
    to interpret them, machine learning plays a critical role. Machine learning is
    the capacity of a system to learn and process data on its own, without human intervention.
    Specific algorithms and methods such as `regression`, `supervised clustering`,
    `naive Bayes`, and many more, are used to introduce machine learning models.


    ## What Is Machine Learning?

    We are currently living in a "data era," where a vast amount of data is collected
    and stored every day. To face this growing amount of data, machine learning methods
    have become inescapable. So much that you probably use them dozens of times a
    day without even noticing!


    Let''s start with an example of an "everyday" machine learning contribution for
    millions of users: the algorithm behind Facebook. If you "like" a post, or stop
    scrolling to read something, the algorithm learns from this and starts to populate
    your feed with similar content. This learning is done continuously, and so your
    user experience more enjoyable. This is only one example!


    Apple can recognize your friend''s face in the photo you just took. Amazon Echo
    understands you and can answer your questions. Your vacuum cleaner can even navigate
    its way around your house, while Netflix is recommending videos that match your
    profile.


    Formally, machine learning is the science of getting computers to realize a task
    without being explicitly programmed for it. In other words, the big difference
    between classical and machine learning algorithms lies in the way we define them.
    Classical algorithms are given exact and complete rules to complete a task. Machine
    learning algorithms are given general guidelines that define the model, along
    with data. This data should contain the missing information necessary for the
    model to complete the task. So, a machine learning algorithm can accomplish its
    task when the model has been adjusted according to the data. We say that we `fit
    the model on the data` or that `the model has to be trained on the data`.


    Let''s illustrate this with a simple example. Let''s say we want to predict the
    price of a house based on its size, the size of its garden, and the number of
    rooms it has. We could try to build a classical algorithm that answers this problem.
    This algorithm would have to take the three house features and return the predicted
    price based on an explicit rule. In this example, the exact house pricing formula
    has to be known and coded explicitly. But in practice, this formula is often not
    known. On the other hand, we could build a machine learning algorithm. First,
    such an algorithm would define a model that can be an incomplete formula created
    from our limited knowledge. Then, the model would be adjusted by training on given
    housing price examples. In doing so, we combine a model with some data.

