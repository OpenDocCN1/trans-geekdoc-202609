    # 什么是 AI ![](img/image_rsrc10E.jpg)


    AI 整合了一系列创新，其目标是模仿人类思维和理性的循环。“人工智能”一词发明于 20 世纪 50 年代后期，但由于数据存储、计算机的出现以及对消费品的大力投入，它变得更加流行。后期的
    AI 还涉及了问题解决等课题。整个 20 世纪 60 年，美国国防部开始教授计算机模仿简单的类思维。20 世纪 70 年，国防高级研究计划局（DARPA）将早期技术应用于街道规划计划。2003
    年，在 `Siri`、`Alexa` 或 `Cortana` 成为家户晓之前，DARPA 就创建了智能个人助手。这项工作为我们今天技术中看到的自动化和系统化思维铺平了道路，包括决策系统和可以构建以支持和提高人类技能的智能搜索系统。


    AI 的发展已为医院、旅游、安全、银行、工程、零售等多个领域提供了多种优势。物联网（`IOT`）是一个通过互联网连接普通物品的电子系统网络，允许数据的传输和检索，移动技术的普及使得大量的有用知识得以收集。然而，搜索、审阅和解释这些数据将花费大量的时间精力来帮助我们。区别在于，人类只能消耗极少的信息，而
    AI 可以在极短时间内消化并分析海量数据。AI 为电子记录增加了人类层面的知识和逻辑。下一个显而易见的技术进步是有用信息的产生，我们可以专注于如何处理这些智能。


    看待 AI 的最佳方式是将其比作婴儿：数据是技术世界通往经验意识的源。孩子在进行智能对话之前，必须学习一系列基本技能。这个孩子需要老师的鼓励和指导；同样，从业者或专家必须始终与
    AI 手练习，以学习如何恰当行动。与婴儿不同，机器在开发时并不具备区分视觉刺激、音乐、声音、气味或触觉的感知能力。尽管如此，各种技术正在演变为模拟人类感的通用能力。这些及相关系统的应用就是
    AI。


    ## 核心概念


    - **机器学习**使理论模型的构建自动化。它利用来自`神经网络`、`数学`、`运筹分析`和`物理学`的方法来发现数据中的秘密见解，而无需专门编程规定去哪里寻找或假设什么。

    - **基于规则的机器学习 (RBML)** 是计算机科学中的一个概念，指任何发现、学习或创建用于处理、控制或实施“规则”的机器学习系统。例如，基于规则的系统可能会规定：“如果交易费用超过
    1,000,000 美元，则触发欺诈检查。”开发软件的人应该将该规则实现在软件中。

    - **神经网络**是机器学习的一种，由相互连接的单元（如神经元）组成，通过响应外部输入和在每个单元之间传输信息来处理信息。该方法涉及多次数据传递，以发现相关关系并从未知数据中推导出重要性。

    - **深度学习**涉及具有多个层处理单元的大型神经网络，利用计算资源的进步和先进的训练方法，从海量数据中学习复杂模式。流行的实现包括图像识别和语音识别。

    - **认知计算**是 AI 的子领域，寻求与机器的正常类人体验。通过使用 AI 和认知处理，最终目标是让计算机通过解释图像和语音的能力模仿人类活动——然后以连贯的方式做出响应。

    - **计算机视觉**专注于模式识别和深度学习，以了解图片或视频的内容。当机器人能够存储、评估和理解图片时，它们就可以实时记录照片或视频并观察周围环境。

    - **自然语言处理 (NLP)** 是计算机解释、理解和产生人类语言（包括语音）的潜力。`NLP` 的下一个水平是帮助人们使用通用普通语言与机器通信以执行任务。

    - **聊天机器人**是一种使用 `NLP` 和 AI 模仿人类通信的软件程序。本质上，这是一种可以说话或回复消息的计算机。

    - **图形处理器**对 AI 至关重要，因为它们具有迭代处理所需的高算力。神经网络的教学需要大数据加计算资源。

    - **物联网**从移动应用（如 `Google Home`、`Ring 摄像头` 和 `Alexa`）中产生海量数据，但这些数据仍未被分析。自动化 AI
    模型应该鼓励我们使用更多模型。

    - **高级算法**已经开发并整合到新的方式中，以更快速、更高效且不同的速率处理更多数据。智能分析是检测和预判异常现象、识别动态结构和使特定场景最大化的秘诀。

    - **应用程序接口 (APIs)** 是轻量级应用包，使得将 AI 特性应用到现有应用和软件包变得简单。它们可以为安全系统添加人脸识别技术，并添加解释图像、生成说明和标题的功能，或提供引人入目的图像趋势和见解。与树树不同，数据规则是查看或验证数据的某些基本准则。


    ## 行业趋势与策略


    根据跨国公司 `SAS` 和 `Accenture` 最近的一项调查，越来越多影响力较小的企业现在开始探索这种新兴技术如何帮助实现其目标，大多数人发现早期尝试是成功的。潜在的经济机会是巨大的，为此，AI
    是政府新工业战略中列出的四大主要挑战之一，旨在将英国置于技术的前沿。其目的是确保国家能够充分利用这些重大的全球性发展，改善人们的生活和繁荣，最重要的是，这不仅来自大型企业。只有当该国更多的中企业开始考虑如何从中获利时，才能取得真正的动力。


    在破解纳粹恩玛密码、帮助盟军赢得第二次世界大战后不到十年，数学家艾伦·图灵用一个简单的问题再次改变了历史：“机器会思考吗？”图灵的论文《计算机器与智能》（1950
    年）以及随后的图灵测试设定了人工智能的基本目标和概念。AI 的核心是计算机科学的一个分支，旨在以肯定的方式回答图灵的问题。它是重建或模拟人类智能的尝试。人工智能巨大的目标导致了许多问题和辩论，以至于对该领域的特定描述并没有被普遍接受。将
    AI 本质上描述为“构建智能机器”的主要局限在于，它没有完全解释人工智能到底是什么；谁让计算机变得智能？在他们的开基性教材《人工智能：现代方法》中，作者 Stuart
    Russell 和 Peter Norvig 通过统一他们在关于计算机中智能体概念的工作来解决这一主题。记住这一点，AI 是“研究智能体获取环境经验并执行行为。”（Russel
    and Norvig viii）Norvig 和 Russell 试图讨论以前定义 AI 领域的四种不同方法：


