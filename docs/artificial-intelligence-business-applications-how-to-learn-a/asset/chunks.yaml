    human thought. In the 1970s, the Defense Advanced Research Projects Agency (DARPA)
    applied early technologies to street planning programs. In 2003, DARPA created
    intelligent personal assistants, long before Siri, Alexa, or Cortana became household
    names. This work paved the way for the automation and systematic thinking that
    we see in today''s technologies, including decision-making and smart search systems
    that can be built to support and improve human skills. AI has grown to provide
    multiple advantages in a number of sectors, such as hospitals, travel, security,
    banking, engineering, retail, and more. The Internet of Things (IOT), a network
    of electronic systems linking ordinary items over the Internet, allows data to
    be transmitted and retrieved, and the proliferation of mobile technologies allows
    huge volumes of useful knowledge to be gathered. Nonetheless, searching, reviewing
    and interpreting the data will take a lot of time and energy to help us. The difference
    is that humans can only consume a small amount of information where AI can digest
    and analyze vast volumes of data within a fraction of time. AI adds knowledge
    and logic at the human level to electronic records. The next apparent technical
    advancement is the production of useful information, and we can concentrate on
    what to do with that intelligence. The best way to look at AI is like a baby child:
    data is the source to experiential awareness in the technology world. A kid has
    to learn a range of basic skills before he or she can have a smart conversation.
    This child needs encouragement and instruction from a teacher; in the same way,
    the practitioner or specialist must always practice hand-in-hand with AI to learn
    how to act properly. Unlike the infant, machines have not been developed with
    a perceptual capacity to differentiate between visual stimuli, music, voice, scent,
    or touch. Nevertheless, various techniques are evolving common capabilities for
    the emulation of human senses. The application of these and related systems would
    be AI. Here are a set of primary concepts: •       Machine learning automates
    theoretical model construction. It uses approaches from neural networks, mathematics,
    operations analysis and physics to discover secret insights into data without
    specifically programming where to look or what to suppose. •       Rule-based
    machine learning (RBML) is a concept in computer science meant to include any
    machine learning system that discovers, learns, or creates ''rules'' for processing,
    controlling, or implementing. For example, a rule-based system may state, "If
    there is a transaction costing more than USD 1,000,000, trigger a fraud check."
    People who developed the software should have implemented the rule into the software.
    •       A neural network is a type of machine learning consisting of interconnected
    units (like neurons) that process information by responding to external inputs
    and transmitting information between each unit. The method involves several data
    passages to find relations and to deduce significance from unknown data. •      
    Deep learning engages massive neural networks with several layers of processing
    units, taking advantage of advancements in computational resources and advanced
    training methods to learn complex patterns in large volumes of data. Popular implementations
    include image and speech recognition. •       Cognitive computing is an AI sub-field
    that seeks a normal, human-like experience with machines. Use AI and cognitive
    processing, the ultimate goal is for a computer to mimic human activities through
    the ability to interpret images and speech — and then to respond in a coherent
    manner. •       Computer vision focuses on patterns identification and deep learning
    to know what''s in a picture or video. When robots are able to store, evaluate
    and comprehend pictures, they can record photos or videos in real time and view
    their surroundings. •       Natural Language Processing (NLP) is the computers
    potential to interpret, understand and produce human languages, including speech.
    The next level of NLP is to help people to communicate with machines using common,
    ordinary language to execute tasks. •       A chatbot is a software program that
    uses NLP and AI to mimic human communication. Essentially, this is a computer
    that can talk or respond to messages. •       Graphical processing units are important
    to AI as they have the high computational power needed for iterative processing.
    The teaching of neural networks needs big data plus computing resources. •      
    The Internet of Things produces vast volumes of data from mobile apps, such as
    Google Home, Ring cameras, and Alexa, but the data remains still unanalyzed. Automating
    AI models should encourage us to use more of them. •       Advanced algorithms
    have been developed and integrated in new ways to process more data, more rapidly,
    and at different rates. Intelligent analysis is the secret to detect and anticipate
    unusual phenomena, recognize dynamic structures and maximize particular scenarios.
    •       Application Processing Interfaces (APIs) are lightweight application bundles
    that make it easy to apply AI features to existing apps and software bundles.
    They can add face recognition technologies to security systems and Q&A functionality
    that explain images, generate captions and headlines, or provide fascinating images
    trends and insights. Unlike a decision tree, the data rules are some of the fundamental
    guidelines for how to view or verify the data. Nonetheless, these rules or algorithms
    do not have the cognitive features required to view gray areas. Machine learning,
    or rule-based machine learning, must therefore be implemented in order to continue
    to help it understand, without being directly told what to do. Like the human
    brain, the neural network is a connecting route that tends to draw data and make
    such decisions or hypotheses. Deep learning includes multilayer neural networks.
    Computer vision relies on deep learning and pattern recognition to recognize what''s
    in a picture or video. That is what we see in face-recognition apps. NLP technology
    offers an ability to observe, interpret and produce human language, including
    speech. It is therefore the integration of all these technologies, like cognitive
    computing, that enables AI to have a human-like interaction with the user. Simply
    put, Artificial Intelligence (AI) explains the ability of a computer to make human-like
    decisions on its own, and Machine Learning (ML) is the mechanism by which this
    is done/learned. A machine is designed to evaluate existing data and, using advanced
    algorithms, learn from that data if there is a statistical association that can
    be used to determine future outcomes. We already use AI in a variety of ways:
    from Personal Digital Assistants at home (e.g. Alexa) to Social Media on your
    phone (e.g. LinkedIn) to Search Engines on your computer (e.g. Google). It is
    a technology that has, of all, been embraced by these Silicon Valley tech pioneers
    and has really begun to develop itself in recent years through a number of key
    drivers •       Ongoing increases in the speed and cost of computer processing
    capacity and the rise of cloud computing; •        a huge increase in the volume
    of available electronic data; •        the production and use of automation According
    to a recent survey undertaken by consultancy multinationals SAS and Accenture,
    an increasing number of less influential businesses are now beginning to explore
    how this emerging technology can help their goals, and most find early ventures
    to be successful. The potential economic opportunities are immense and, to this
    end, AI is one of the four major challenges set out in the government''s new industrial
    strategy to place the United Kingdom at the forefront of the technologies of the
    future. The purpose is to ensure that the nation takes full advantage of these
    major global developments, enhances people''s lives and prosperity, and, most
    importantly, it won’t only come from larger enterprises. Real traction will only
    be accomplished if more of the country''s medium-sized businesses begin to consider
    how they can profit from this revolutionary trend. Less than a decade after cracking
    the Nazi Enigma encryption code, helping the Allied Forces win the Second World
    War, mathematician Alan Turing changed history for the second time with a simple
    question: "Do machines think?" Turing''s paper "Computing Machinery and Intellect"
    (1950), and his subsequent Turing Test, set the fundamental goal and concept of
    artificial intelligence. At its heart, AI is a branch of computer science that
    seeks to address Turing''s question in an affirmative way. It is an attempt to
    recreate or emulate human intelligence in computers. The vast goal of artificial
    intelligence has led to many questions and debates. So much that no particular
    description of the field is universally accepted. The major limitation of describing
    AI as essentially "building machines that are smart" is that it doesn''t fully
    explain what artificial intelligence really is; Who makes the computer smart?
    In their seminal textbook ‘Artificial Intelligence: A Modern Approach’, the writers
    Stuart Russell and Peter Norvig address the topic by unifying their work on the
    concept of intelligent agents in computers. Keeping that in mind, AI is "the study
    of agents acquiring environmental experiences and executing behavior." (Russel
    and Norvig viii) Norvig and Russell seek to discuss four different approaches
    that have previously characterized the field of AI: '
