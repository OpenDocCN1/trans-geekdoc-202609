    # UNSUPVISED MODELS


    The two main categories of machine learning techniques are supervised and unsupervised
    learning. In supervised learning, we want to get a model to predict the label
    of data based on their features. In order to learn the mapping between features
    and labels, the model has to be fitted on given examples of features with their
    related labels. We say that "the model is trained on a labeled dataset." Predicted
    labels can be numbers or categories. For example, we could build a model that
    predicts the price of a house, implying we would want to predict a label that''s
    a number. In this case, we would talk about a regression model. Otherwise, we
    might also want to define a model that predicts a category, like "cat" or "not
    cat," based on given features. In this situation, we would talk about a classification
    model.


    In unsupervised learning, we want to define a model that reveals structures in
    some data that are described only by their features but with no labels. For example,
    unsupervised learning algorithms can help answer questions like "Are there groups
    among my data?" or "Is there any way to simplify the description of my data?"
    The model can look for different kinds of underlying structures in the data. If
    it tries to find groups among the data, we will talk about a clustering model.
    An example would be a model that divides customers of a company based on their
    profiles. Otherwise, if we have a model that transforms data and represents them
    with a smaller number of features, we would talk about a dimension reduction model.
    An example of this would be a model that summarizes the multiple technical characteristics
    of some cars into a few main indicators.


    In summary, supervised learning models associate a label with each data point
    described by its features, whereas unsupervised learning models find structures
    among all the data points. In a sense, supervised learning is similar to learning
    the names of fruits from a picture book: you associate the characteristics of
    the fruit — the features — with the names written on the page — the label. Typical
    examples of supervised learning algorithms are linear regression, logistic regression,
    support vector machines, neural networks, and so on. Unsupervised learning, on
    the other hand, is like taking the same fruit picture book, analyzing all of the
    fruits to detect patterns, and then group them by color and size. Typical examples
    of unsupervised learning algorithms are k-means clustering, hierarchical clustering,
    principal component analysis, autoencoders, and so on.


    ## Types of Machine Learning Algorithms


    Machine learning came a long way from a science fiction fancy to a reliable and
    diverse business tool that amplifies multiple elements of the business operation.
    Its influence on business performance may be so significant that the implementation
    of machine learning algorithms is required to maintain competitiveness in many
    fields and industries. The implementation of machine learning into business operations
    is a strategic step and requires a lot of resources. Therefore, it''s important
    to understand what do you want the ML does for your particular business and what
    kind of bonuses different types of ML algorithms bring to the table. In this article,
    we''ll cover the major types of machine learning algorithms, explain the purpose
    of each of them, and see what the benefits are.


    ### Supervised Machine Learning Algorithms


    Supervised ML Algorithms are those that involve direct control of the process.
    In this case, the product labels must sample the data corpus and set the strict
    limits under which the algorithm runs. It is a spoon-fed type of machine learning:

    * you pick what kind of knowledge output (samples) you want to "feed" an algorithm;

    * what kind of outcomes you want (for example, "yes/no" or "true/false").

    * From the machine''s point of view, this cycle is more or less a "join line"
    routine.

    * The primary goal is to scale the complexity of the data and to make projections
    of inaccessible, possible, or unknown data on the basis of the labelled one.

    * Supervised machine learning involves two main processes: classification and
    regression.

    * Classification is a method in which incoming data is classified on the basis
    of previous data samples, and manually trains an algorithm to classify and categorize
    those categories of items accordingly. The device must know how to distinguish
    types of content, perform an optical character, picture, or binary identification
    (whether the next given bit of data is compliant or non-compliant with basic criteria
    in the form of "yes" or "no").

    * Regression is the method of defining trends and estimating the prediction of
    constant outcomes.

    * Linear Regression;

    * Logistic Regression;

    * Random Forest;

    * Gradient Improved Trees;

    * Supporting Vector Machines (SVM);

    * Neural Networks;

    * Decision Trees;

    * Naive Bayes;

    * Closest Neighbor;


    #### Usage examples for supervised learning algorithms


    The most important areas of use for supervised learning include market estimation
    and pattern modeling in banking, distribution, and stock trading. In both cases,
    the algorithm uses input data to determine the opportunity and quantify possible
    outcomes. Sales enablement systems, such `Seismic` and `Highspot`, use this kind
    of algorithm to pose different potential scenarios for consideration. The task
    of the supervised learning algorithm is to determine the opportunity and quantify
    possible outcomes.


    ### Unsupervised Machine Learning Algorithms


    Unsupervised Instruction is that which does not require supervision by the author.
    If the key point of supervised learning is that you know the outcome and need
    to figure out the data, then in the case of unsupervised learning, the expected
    results are unpredictable and yet to be determined. Another major difference between
    these two is that supervised learning uses branded data, while unsupervised learning
    relies on unmarked data. An unsupervised learning algorithm is used for:

    * exploring the nature of the information;

    * extracting useful insights;

    * identifying patterns;

    * applying this in order to improve performance.


    Simply put, unsupervised learning explains knowledge by examining through making
    sense of it. Unsupervised learning algorithms use the following methods to classify
    the results:

    * Clustering: is an analysis of the results to divide them into relevant classes
    (i.e. clusters) based on their internal characteristics without sufficient awareness
    of category. Credentials are characterized by the resemblance of individual data
    and also by their dissimilarity to the others (which may be used to detect anomalies).

    * Reduction of dimensions: there seems to be a lot of noise in the input data.
    Machine learning algorithms utilize dimensional reduction to eliminate this noise
    when distilling the related information.

    * k-means clustering;

    * t-SNE (t-Distributed Stochastic Neighbor Embedding);

    * PCA (Principal Component Analysis);


    #### Using Unsupervised Learning Algorithm Examples


    Digital marketing and ad tech are the areas in which it is used to the fullest
    potential. In addition, this algorithm is also used to analyze customer knowledge
    and to change the service accordingly. The problem is that there are a number
    of so-called "known unknowns" in the incoming data. The entire success of the
    company process relies on the ability to make use of unlabeled data and to get
    valuable information from it. Modern data processing is fitted with unsupervised
    algorithms. `Lotam` and `Salesforce` are currently among the most popular data
    processing systems to implement this ML algorithm. As such, unsupervised learning
    can be used to classify target user audiences on the basis of such attributes
    (behavioral data, personal data features, unique device settings, etc.).


    ### Semi-supervised Computer Learning Machine


    Semi-supervised learning algorithms are the middle ground between supervised and
    unsupervised algorithms. In fact, the semi-supervised model incorporates certain
    elements of both into one element of its own. Here is how semi-supervised algorithms
    work:

