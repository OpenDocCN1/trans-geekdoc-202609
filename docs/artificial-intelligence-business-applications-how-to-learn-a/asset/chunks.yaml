    # AI 之论 ![](img/image_rsrc10E.jpg)


    制定 AI 计划是一项团队协作。你需要对 AI 方案的关键要素有深入的见解。团队的构成在创业者和企业之间有所不同。初创公司通常根据 `Software Engineer`
    的技术输入以及 `Product Owner` 或 `Business Manager` 的市场输入，由较小的团队来构建 AI 方案。企业部门则具有更丰富的功能。曾为全球最大的汽车制造商开发过内部
    AI 方案的 Andreas Meier 明白，在拥有特定职位的组织中，你需要大量的市场经验来追求成功的 AI 方案。在公司中你需要许多拥有特定职位的人，而在某些公司中，你只需要少数通才就能构建出出色的
    AI 方案。


    ## 正确与错误的 AI 策略之特征


    在不同公司中，正确和错误的 AI 策略具有相似的特征。有效的 AI 计划是影响力驱动的，在业务上资金充足，在时间、薪酬以及愿景方面也有充足资金。糟糕的 AI
    方案是炒作驱动的，专注于技术而非效果，并且仅聘佣 2–3 名 `Data Scientists` 来负责项目。确保你努力摆脱后者。


    ## 企业与初创公司的 AI 策略


    创建 AI 方案对于企业和初创公司具有特殊性。Raphael Kohler 表示，公司需要接受过时的流程，并且经常面临当前企业变革管理的挑战，而初创公司则应该依靠加入良性的
    AI 循环。Andreas Meier 意识到，为 AI 规划影响力路线可能是困难的。他指出，大公司在简化 AI 流程方面有很大的空间。对于 Andreas
    来说，开始并交付价值至关重要。另一方面，公司将专注于生产即使没有 AI 也表现良好的产品，但随着更多消费者使用该产品，它会缓慢增长。然后对客户互动进行评估以增强产品，从而吸引越来越多的消费者。如果他们加入了
    AI 良性循环，那么 AI 初创公司无疑处于成功的道路上。


    信息是驱动 AI 引擎的燃料，因此，学习如何收集原始数据以及消费者的正确输入以迭代开发产品，其重要性不言而喻。Jason Risch


    ## 如何开发机器学习模型


    为了构建良好的机器学习模型，你需要遵循以下步骤：

    * 制定问题。

    * 收集并清洗数据。

    * 可视化结果。

    * 准备算法。

    * 根据规范评估结果。


    你将采取这些步骤来解决问题：制定查询。尽管电影预算和收入不同，但问题与你之前看到的那个是一样的。问题是：“这部电影将赚取多少钱/收入？”你需要收集信息。为了进行数据审查，你需要一份美元计价的电影预算和美元计价的电影收入。你可以使用这个网站来收集信息。你所做的就是导入数据并以
    `Excel` 格式打开它以进行分析。（为了简单起见，你也可以从这里导入数据。）


    ### 清洗数据


    下一步是清理错误的细节。你可能会发现，在某些情况下，Excel 表格中的数据包含 `$0`。对这的解释可能是电影日期在未来，或者该电影从未上映。可能还有更多原因导致其中包含
    `$0` 数字，但目前请删除这些 `$0` 行。这样，它们就不会在实验中产生任何虚假错误，并专注于实际结果。如上文所述，重点将放在 `output budget`（输出预算）和
    `world total`（全球总计）这两列上，因为这些是你将映射到图表上的列。数据清除后，删除 `$sign` 并替换章节名称。


    ### 探索与可视化


    是时候看看制作预算和全球总票房是否相互关联。现在，为了做到这一点，请导入 `.csv` 文件以便对其进行“魔法操作”。点击 `Jupyter` 图标，这将带你进入计算机。点击
    `Import` 导入名为 `Movie_Revenue_Edited.csv` 的文件。下一步是开始一个新笔记本。在 Jupyter 文件中进入 `File
    Menu -> New Notebook -> Python 3`。这将为你打开一个新的 Python `3` 笔记本实例。我已将我的日志命名为 `My Movie
    Prediction`。（你也可以查看完整的电影线性回归笔记本）。


    此时，你需要使用 `Pandas` 应用程序来访问笔记本中的 `csv` 文件。`Pandas` 是一个预构建的数据科学库，可以帮助你轻松地分析和清洗结果。它构建在名为
    `NumPy` 的流行数据科学库之上。`Pandas` 适用于广泛的数据集，如 `Excel`、`CSV`、`SQL`。你可以在每个单元格中编写标记或代码。你应该选择一个代码单元格并运行它，以获得笔记本中正确的结果。以下是一个导入文件并显示数据的示例（请确保按照图像所示，将代码插入到单个单元格中）：


    ```python

    import pandas as pd

    # 使用 pandas read_csv 方法将 csv 文件读取为数据

    data = pd.read_csv(''Movie_Revenue_Edited.csv'')

    data

    ```


    下一步是将数据加载到图表的 `X-axis` 和 `Y-axis` 中。`X` 将是制作预算，`Y` 将代表数据表中的全球票房。为了实现这一功能，你需要将
    `csv` 数据映射到行和列。这可以通过使用 `Pandas Data` 结构轻松完成。


