    在过去的十年里，人工智能取得了许多突破，带来了“显著的社会效益并为国家的经济活力做出了贡献”，正如奥巴马政府于 2016 年发布的《人工智能未来规划》所示。狭义人工智能（Narrow
    AI）的例子包括：

    * Google 搜索。

    * 图像识别软件。

    * Siri、Alexa 以及其他助手。

    * 自动驾驶汽车。

    * IBM 的 Watson。


    ## 机器学习与深度学习

    大多数狭义人工智能是由机器学习和深度学习的发展驱动的。了解人工智能、机器学习和深度学习之间的区别可能会让人感到困扰。风险投资人陈峰（Frank Chen）提供了一个关于如何区分它们的清晰描述，他指出：“人工智能是尝试并模拟人类智能的算法和知识集合。机器学习是其中之一，而深度学习是少数几种机器学习技术之一。”


    简单来说，机器学习是为计算提供数据，并使用支持它的数学方法。自动学习包括监督学习（使用命名的数据集）和无监督学习（使用空白数据集）。深度学习是机器学习的一种形式，它通过受生物学影响的神经网络架构运行信号。这包含多种用于解释数据的不透明层，允许计算机在学习中“深挖”，建立关联并对输入进行权重以获得最佳输出。


    ## 通用人工智能

    开发一种可以扩展到任何任务的人类水平智能系统，是许多 AI 研究人员的圣杯，但对通用人工智能（AGI）的追求充满了挑战。对“一种可以在任何环境中进行学习和行为表现的简单算法”（Russel
    and Norvig 27）的追求并不新鲜，但时间并没有减轻构建一个具有完整认知能力的计算机的复杂性。AGI 长期以来一直是科幻未来的灵感，超级智能机器战胜人类，但研究人员得出结论认为，这不是我们需要考虑的问题，现在还太早了。


    ## AI 历史

    人工智能和智能机器人最早出现在古希腊神话中。亚里士多德发明的三段论和对演绎逻辑的使用是人类追求自身智力思考的一个关键时刻。尽管我们今天所认为的人工智能的起源和过去还没有一个世纪的历史。现代
    AI 的起源可以追溯到古典哲学家试图将人类思维表征为符号方法的努力。


    但直到 1956 年在纽罕普什州汉诺威的达特茅斯学院举行的一次会议上，AI 领域才正式建立，“人工智能”一词也在此被创造。麻理工学院的认知科学家马文·明斯基（Marvin
    Minsky）和其他参加会议的人士对 AI 的未来非常乐观。在小说《AI：人工智能的动荡探求》（Basic Books, 1994）中，引用了明斯基的话：“在十年内……开发‘人工智能’的问题将得到显著解决，”；[超级智能机器：七个自主未来]；但要创造一个人工智能生物并没有那么容易。


    在经历了数项反对 AI 取得成功的研究后，政府的资助和对该领域的兴趣下降了——1974 年至 1980 年的这段时期被称为“AI 寒冬”。后来，该领域在 20
    世纪 80 年代恢复，当时英国政府开始再次部分提供资助，以应对日本的努力。该行业在 1987 年到 1993 年间经历了又一个寒冬，这与一些早期通用计算机的失败以及政府资金的减少相吻。然而，之后工作开始好升，1997
    年，`IBM 的深蓝（Deep Blue）`成为第一台击败象棋冠军加里·卡斯帕罗夫（Garry Kasparov）的机器。2011 年，`Watson 机器`通过击败现任冠军布拉德·鲁特（Brad
    Rutter）和肯·詹宁（Ken Jennings）主宰了《危险问答》（Jeopardy!）节目。


    ## 图灵测试

    英国数学家和计算机科学家`艾兰·图灵（Alan Turing）`在 1950 年提出的判断机器是否聪明的挑战充满了争议。许多研究人员和 AI 专家仍然认为`图灵测试`不是衡量人工智能的好方法。“AI
    领域绝大多数学习它的人认为，这是一个非常糟糕的测试，因为它只看外行为。”


    ## 人工智能与人类智力的比较

    自从图灵发明机器以来，对 AI 系统的洞察一直是活跃的话题：

    * 机器人像人类一样行为是可能的吗？

    * 我们距离智能机器的世界有多远？

    * 大脑是否受到了人工神经网络的启发？

    * 为什么我们不通过观察 AI 来增强人类智力？


    人类智力不仅关乎知识；教育也是智慧不可或缺的一部分，我们将通过改进教育来发展人类智力。但似乎我们在训练机器方面比训练人类要有效得多。这可能有许多潜在的理论。AI
    是一个统计模型，在大多数时候，我们会创建一个衡量标准来帮助理解，而教育具有文化、社会和政治元素。事实上，在 AI 中，我们可以更容易地进行实验来确定哪种学习方法有效。另一方面，教育领域的创新也存在缺点。阿西莫曾说：“现在生活中最悲哀的事情是，科学收集知识的速度快于人类收集智慧的速度。”


    ## 基于规则的方法与自学习方法

    AI 有两种解决方案：

    1. 基于规则的方法，你为算法硬编码所有它必须遵守的规则。

    2. 自学习方法（即机器学习），你将数据展示给算法，由它理解模式和变换。


    人们有一种压倒性的共识，认为对于感知任务，机器学习等同于基于规则的算法。但在涉及人类教育时，这并不是我们的现状。我们是在强制要求执行所谓的“事实”，而不是提供证据让学生了解自己的事实。这阻止了学生内化他们的想法。这对于小问题（如日常活动）来说可能足够了。然而，为了应对新挑战，必须灵活地弯曲并组合解决方案。这只有通过理解思想的含义，而不是通过记忆才能实现。


    “学生被要求不是知道，而是记忆老师叙述的内容”——保罗·弗雷雷（Paulo Freire）。正如我们在机器学习中所做的那样，我们将专注于人们为自己学习，换句话说，自我教育。我坚信，自我教育是唯一的真正教育。学校的功能是让自我教育变得更容易；否则，它无事一处——艾萨克·阿西莫夫（Isaac
    Asimov）。


    ## 激发自学习

    即使我们相信自学习是未来的道路，我们该如何做呢？AI 开发者在理解机器学习方面付出了巨大的努力，我们有大量的知识可以利用。我们在许多机器学习任务中使用一种名为`梯度下降（gradient
    descent）`的优化算法。基本上，计算机是这样思考的。它是一个迭代算法：一步一步解决解决方案。它从做出预测开始，给出它距离现实有多远的输入，然后进行操作。

