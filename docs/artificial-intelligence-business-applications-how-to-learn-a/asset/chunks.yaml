    # 了解人工智能


    问题将从我们如何向商业受众解释“AI”（人工智能）及相关概念开始。如果你关注最热门的人工智能文章，很容易被那些引发深思的后果和预测所吸引。AI 对文化和日常生活的影响是每个人都能感受到的，许多记者和未来学家将帮助我们应对其中涉及的方面。然而，公司的运营则要务实得多，最相关的内容通常归结为销售、支出、消费者和竞争力。显然，有必要处理更广泛的形象问题，甚至是法律问题。但同样地，这些问题也受到公司层面上相同这四个目标的严重影响。


    因此，为了理解 AI 对业务领导者意味着什么，我们应该继续通过他们使用的视角来观察这个话题。很快发现，即使是为公司受众澄清“人工智能”一词的含义，也并没有我们预想的那么容易。它有多种含义，每种含义都满足不同观众的兴趣。有些集中在计算机科学，而另一些展示了该词的过去。有些本质上非常具有哲学性；另一些则用性存疑。例如，“什么是人工智能”的前五个搜索结果之一告诉我们：“**人工智能，也称为机器智能，是机器证明的智能。**”


    我们使用 `AI` 作为各种相关（类））概念的统称后缀，如人工智能、`Machine Learning`、`Deep Learning` 和大数据，这加剧了这种情况。当然，它们之间存在巨大差异，但这些差异在这里并不相关。就我们的目的，我们将使用单一标记（“AI”）并用以业务为向的术语对其进行描述。商业客户通常倾向于关注行动、结果和市场兴趣。因此，为业务受众界定讨论范围，是
    `AI Prescience` 使用的 AI 定义：对于业务而言，“AI”意味着计算机通过模拟人类行为来执行、改进或重塑业务活动，目标是提高业务效率或效能。在某种程度上，这是一个对
    AI 相当直观的观点，强调业务结果。但请注意，AI 的区分特征是它模仿人类行为的能力，而不是复制它。这并不一定是我们所想的，因为这意味着如何进行模拟从属于它所促进的内容。但对于公司来说，这通常是事实。


    ## 为什么业务领导者不知道 AI 是否“智能”


    这种内涵让我们忽略了一个事实——在商业语境下，人工智能的功能是否与人类大脑运作方式相同并不重要。AI 是否“真正”智能并不重要。业务界关乎的是 AI 能否在人类过去或现在需要人类参与的工作中产生更好的结果。这种观点将
    AI 仅仅视为计算机化（甚至是工业化）演进的又一步。而这一步与早期技术的区别在于，它执行了（并逐渐改进了）我们曾认为只有人类才能做的事情。这是因为它包含了我们认为是人类所特有的特征的计算程序。


    AI 模拟的人类特征示例包括：

    *   对环境的理解和识别（例如自动驾驶汽车中的摄像头）

    *   对信息进行解释和赋予“意义”（例如将手绘草图和笔记转换为 `HTML` 网页）

    *   处理歧义性（例如知道在网上搜索“高尔夫球杆”的人是想买高尔夫设备还是想找打球的地方）。


    现在，我们有机会简化其中任何或全部内容。如果结果更强大，无论智能是“真实”的还是人工的，在市场结果方面都不特别重要。这并不是意味着业务领导者不应该参与 AI
    的其他影响，例如伦理困境和对职场的影响。或者，恰恰相反。只是如果他们的决策标准仅仅是市场结果，那么潜在复杂的 AI 决策就会显得非常简单。但这将迫使我们进入一个又一个完全不同的辩论。目前，对市场高管来说最大的信息是，行业中的
    AI 发展更多是关于改变人们历史上必须做的事情。当然，这只是触山一角。


    ## 公司领导还需要学习关于 AI 的什么？


    ### 为什么市场领导者应该注意 AI 的核心是数据与计算？


    当市场所有对 AI 是什么有了洞察，他们通常不需要掌握其运作的细差别。然而，如果没有对某些基本原理的了解，这种理解是不完整的。AI 背后的主要概念中，对业务至关重要的可能是
    AI 需要强大的机器来存储海量的、前所未有的数据。无论实施和意图如何，AI 基本上是在其接收的数据中寻找趋势、相关性和变化。


    对市场受众的后果是：为了从 AI 中获益，公司需要收集和维护大量数据，使用广泛的计算机分析、存储和资源从中提取价值。这可能涉及新的能力，而这些能力在历史上并不适用于大多数公司。我们关注的数据不仅是传统的计算机化公司记录（如销售收据、产品目录和客户账户描述），还包含打印记录、网页材料、手写页面以及视听材料（例如照片、视频和电话记录）。


    这是因为今天的技术可以以数字方式收集几乎所有有意义的细节，无论是什么类型（几乎）。在之前的技术浪潮中，数据通常只能输入计算机系统。使之生的一种方法是询问人是否可以识别某条数据并理解其含义。如果他们可以，那么
    AI 也可以，或者最终它可以学会这样做。


    所以，它绝对能够更快地这样做，以适应更大的数据量。公司数据规模令人惊叹——数亿或数十亿项。廉价的存储意味着我们可以方便地存储所有这些内容。廉价的计算能力意味着我们可以轻松扫描细节。从某个角度来看，存档我们可能学到的一切都是有用的。这就是为什么云计算始终与
    AI 相关联。AI 能做的大部分事情在技术上是可行的，但受限于成本或时间；而今天，对每个人来说都是便宜且方便的。因此，为了在业务中高效使用 AI，你可能需要收集和处理你可能没有的数据，并使用你可能没有考虑的技术。


    ### AI 如何释放数据与计算


    团队正在开发以特定方式整合数据和计算的应用程序。AI 技术将收集的数据转化为可访问的知识，示例：

    *   识别照片中的手写字

    *   识别语音命令或记录中的词汇

    *   识别视频和图像中的面部表情

    *   AI 分析收集的数据以识别趋势、相关性和异常

    *   AI 可以通过分析销售数据来发现关于客户的此前未见的洞察，从而使公司获得成功

    *   如果通过自动驾驶车辆遇到障碍，AI 可以使其空闲并重新路由以实现最小延迟


    如果挑战是人类，他或她将寻求帮助。在业务中使用 AI 意味着使用这些技术来解决现实问题。AI 专家将熟悉使 AI 解决方案变得理想的问题。但也有其他使 AI
    解决方案不理想的。AI 系统如何思考和处理不可预测的情况是开发 AI 的关键部分。这同样涉及词汇“监督”（supervised）和“无监督”（unsupervised），或“窄”（narrow）和“通用”（general）。业务领导者考虑
    AI 的一项要任务之一是选择正确的挑战来应对。这在很大程度上取决于其 AI 员工的专业知识，以及进度和预算。然而，希望业务高管对自己有一定程度的意识。这是因为将
    AI 应用于行业是一个不可预测的结果和意外影响的雷区。出现了越来越多的案例，由公司高管为重大 IT 问题买单，而不是技术高管。如果 AI 的业务结果不好，责任在于下令的业务领导者，而不是执行工作的数据科学家。


    ## 数据包含了关于我们行业和消费者的尚未为人知的秘密


    我们拥有的关于消费者和商品的数据越多，AI 检查它们之间关系就越多。例如，如果你知道客户姓名、地址、出生日期和交易历史，你就可以创建一些价值的洞察。即使你更多地了解他们的日常生活、如何度过闲暇时间以及他们最大的影响，还有更多关于他们的价值信息可以发现。零售商多年来这样做，例如使用年龄、阶级、社会经济背景等进行目标营销。


    但现在，我们拥有的数据比想象的要多。例如，社交媒体账号和更新共同提供了个人和职业生活的细致画像。AI 提供了访问记录中隐藏秘密的机会，而业务才开始理解这些方式。更具体地说，我们才开始理解我们的数据应该表达什么，以及产生的推论和理论。这由于由于意外的影响，并且通常通过重新审视来理解。例如，招聘过程中围绕无意的种族或性别歧视的问题表明，多样性在未来很一段时间内将是
    AI 的一个争议特征。另一种解释从广告投放开始，结束在我们显然尚未看到的地方：

    *   当在线广告“知道”你刚刚访问的网站（可能是通过另一个应用程序）时，感到有点害怕是正常的。

    *   当广告提到你在电子邮件或社交网络帖子中提到的内容时，会更令人不安。

    *   如果企业对你如此了解以至于可以挑选精准广告，当他们发现新的变现方式时，谁来决定他们还可以/应该用这些知识做什么？


    当事情安排好后，解决方案无疑属于公司高管。所以，它们在那里。给公司高管的启示：

    *   为了在业务中成功使用 AI，你需要各种类型的广泛数据。

    *   你现在需要比以前更多的计算资源和能力，以及现有技术和公司团队的新专业知识。

    *   获得的数据越多，你发现如何使用它的方法就越多。

    *   随着你使用数据和 AI 的形式增加，省钱的机会也会增加。

    *   但这将伴随着对数据和 AI 技术进行非法行为的动机增加——无论无意还是故意。

    *   高效使用 AI 技术来增强业务是一项共同努力，因为作为市场领导者，你是一个取得进步的大团队的一部分。

    *   然而，当 AI 产生问题时，责任可能不会分散得分散。

    *   作为市场高管，你是一个更小社区的成员，可以决定公司如何计划和应对 AI 的业务机会和威胁。

    *   而且由于监管机构和政策制定者通常跟不上技术进步，你可能会发现自己面临着超出自己业务范围的担忧、决策和困境。


