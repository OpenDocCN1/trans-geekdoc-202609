    you''re going to figure out how to use it. •       As the forms you can use data
    & AI through, so will the chances to make & save money. •       But that would
    go hand-in-hand with expanded incentives to do illegal stuff with data and AI
    technology — unintentionally or knowingly. •       Efficient use of AI technologies
    to enhance business is a joint endeavor because as a market leader, you are part
    of a large team of people who will make progress. •        However, when AI creates
    issues, liability can be less broadly spread. •       As a market executive, you
    are part of a much smaller community who can decide how a company plans and reacts
    to AI''s business opportunities and threats. •       And as regulators and policymakers
    generally fail to keep up with technological advances, you may find yourself facing
    concerns, decisions and dilemmas far beyond your own business. '
