    1:1 直观、开放且交互的互动为消费者提供服务，满足他们的需求并帮助他们发现价值资源。去年，全球油气公司 `Shell` 引入了一个名为“Shelly”的新聊天机器人，帮助消费者确定哪些变化更适合他们的车辆。`Shelly`
