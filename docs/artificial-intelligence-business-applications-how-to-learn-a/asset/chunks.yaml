    to employees in their line. Let’s investigate the final component of your AI Strategy
    — the organization. Organization. The last but arguably most important component
    of the AI Strategy is to prepare your organization for AI. Evaluate precisely
    your organizational design and the development processes. Then, align them with
    best practices. •       How do you enable your AI team to provide business value
    across teams and domains? •        Are your processes ready for the ML workflow?
    The benefits of Artificial Intelligence are omnipotent; it is paramount to understand
    that AI cannot work in silos. Instead of working in vertical customer-focused
    business units, AI can be seen as a horizontal enabler of the company. AI is capable
    of impacting internal processes, create new products, or improve existing ones.
    To do that, Andrew Ng recommends establishing a separate unit which becomes the
    central enabling point of AI across the company. This unit then works together
    with existing departments to find high-impact AI projects and to support their
    implementation. Enabling AI across the company requires understanding of the Machine
    Learning Workflow. This follows a highly iterative process, with the outcome far
    from certain. You can use tools like the AI Project Canvas to evaluate the potential
    for success, but you can hardly guarantee specific outcomes. The very experimental
    nature of AI makes it hard to follow company-wide goal measurements. You can’t
    promise a working model without thoroughly evaluating the data. Thus, it is difficult
    to estimate the real business impact of AI projects without first investing in
    ETL and initial data analysis. — Rachel Berryman. Consider your processes: are
    they ready to support AI? If you work in a safety-critical industry, chances are
    that don’t exist processes to verify statistical learning models. Does your company
    follow waterfall engineering processes? Reconsider your current development process
    and check if it aligns with the Machine Learning Workflow. Now that you understand
    the fundamental components of an AI Strategy let’s have a look at how to avoid
    common pitfalls. '
