  trans: '


    # 无监督模型


    机器学习技术主要分为两类：监督学习和无监督学习。在监督学习中，我们希望让模型根据数据的特征来预测其标签。为了学习特征与标签之间的映射关系，模型必须在给定的特征及其相关标签示例上进行拟合。我们称为“模型在标记的数据集上进行训练”。预测的标签可以是数字也可以是类别。例如，我们可以构建一个预测房屋价格的模型，这意味着我们希望预测一个数字类型的标签。在这种情况下，我们称之为回归模型。否则，我们可能还想定义一个根据给定特征预测类别的模型，例如“猫”或“不是猫”。在这种情况下，我们称之为分类模型。


    在无监督学习中，我们希望定义一个模型来揭示某些数据中的结构，这些数据仅由特征描述但没有标签。例如，无监督学习算法可以帮助回答诸之的问题：“我的数据是否存在分组？”或“是否有方法可以简化对数据的数据的描述？”模型可以在数据中寻找不同类型的底层结构。如果它尝试在数据中寻找分组，我们称之为聚类模型。例如，一个根据个人资料划分公司客户的模型。否则，如果我们有一个转换数据并用较少特征来表示它的模型，我们就称之为降维模型。这方面的示例是将某些汽车多种技术特性总结为几个主要指标的模型。


    总而言之，监督学习模型将标签与特征描述的每个数据点联系起来，而无监督学习模型则在所有数据点之间寻找结构。在某种意义上，监督学习类似于从图果书中学习水果名称：你将水果的特征——特征——与页面上写着的名称——标签——联系起来。监督学习算法的典型示例有线性回归、逻辑回归、支持向量机、神经网络等。另一方面，无监督学习就像是拿着同一本水果图谱，分析所有的水果以检测模式，然后根据颜色和大小对其进行分组。无监督学习算法的典型示例有
    k-means 聚类、层次聚类、主成分分析、自动编码器等。


    ## 机器学习算法的类型


    机器学习已经从一种科幻式的幻想变成了一种可靠且多样化的业务工具，能够放大业务运营的多个元素。它对业务绩效的影响可能是如此巨大，以至于在许多领域和行业中，必须实施机器学习算法才能保持竞争力。将机器学习引入业务运营是一个战略性步骤，需要大量的资源。因此，了解你希望机器学习为你的特定业务做什么，以及不同类型的机器学习算法能带来什么样的收益至关重要。在本文，我们将涵盖机器学习算法的主要类型，解释每种算法的目的，并看看它们的益处。


    ### 监督机器学习算法


    监督机器学习算法是那些涉及对过程直接控制的算法。在这种情况下，产品标签必须采样数据语料，并设定算法运行的严格限制。这是一种“喂养式”的机器学习：

    * 你选择想要“喂”给算法的什么类型的知识输出（样本）；

    * 你想要得到什么样的结果（例如，“是/否”或“真/假”）。

    * 从机器的角度来看，这个循环在多大程度上是一个“连接线”例程。

    * 主要目标是扩展数据的复杂性，并根据标记数据对不可访问、可能或未知的数据进行投影。

    * 监督学习涉及两个主要过程：分类和回归。

    * 分类是一种根据之前的数据样本对输入数据进行分类的方法，并手动训练算法对这些类别的物品进行相应的分类和分类。设备必须知道如何区分内容的类型，执行光学字符、图片或二进制识别（判断下一个给定的位数据是否符合“是”或“否”形式的基本准则）。

    * 回归是定义趋势和估计常量结果预测的方法。

    * 线性回归；

    * 逻辑回归；

    * 随机森林；

    * 梯度提升树；

    * 支持向量机 (SVM);

    * 神经网络；

    * 决策树；

    * 朴素贝叶斯；

    * 最近邻；


    #### 监督学习算法的用法示例


    监督学习最重要的应用领域包括银行、配送和股票交易中的市场估计和模式建模。在这两种情况下，算法使用输入数据来确定机会并量化可能的结果。销售支持系统，如 `Seismic`
    和 `Highspot`，使用这种算法来提出不同的潜在考虑方案。监督学习算法的任务是确定机会并量化可能的结果。


    ### 无监督机器学习算法


    无监督指令不需要作者的指导。如果监督学习的关键在于你知道结果并需要找出数据，那么在无监督学习的情况下，预期结果是不可预测且待决定的。这两者的另一个主要区别是监督学习使用标记数据，而无监督学习依赖未标记数据。无监督学习算法用于：

    * 探索信息的本质；

    * 提取有用的见解；

    * 识别模式；

    * 应用这些来提高性能。


    简单来说，无监督学习通过检查使其意义来解释知识。无监督学习算法使用以下方法对结果进行分类：

    * 聚类：对结果进行分析，根据其内部特征将其划分为相关的类（即簇），而对类别的认知不足。凭据的特征取决于单个数据的相似性，以及它们与其他数据之间的差异（这可以用于检测异常）。

    * 降维：输入数据中似乎有很多噪声。机器学习算法在提取相关信息时利用降维来消除这些噪声。

    * k-means 聚类；

    * t-SNE (t 分布随机域嵌入)；

    * PCA (主成分分析)；


    #### 无监督学习算法示例


    数字营销和广告技术是充分利用其潜的领域。此外，这种算法还用于分析客户知识并相应调整服务。问题有很多所谓的“已知未知”。公司流程的整个成功取决于利用未标记数据并从中获取价值信息的能力。现代数据处理配备了无监督算法。`Lotam`
    和 `Salesforce` 是目前实施这种机器学习算法的最流行的数据处理系统。因此，无监督学习可以根据此类属性（行为数据、个人数据特征、唯一设备设置等）对目标用户群体进行分类。


    ### 半监督学习机器


    半监督学习算法是监督算法和无监督算法之间的中间地。事实上，半监督模型将两者的某些元素整合到自身的一个元素中。以下是半监督算法的工作原理：


    '
- fmt: '

    # Semi-supervised Machine Learning


    1. Semi-supervised machine learning algorithm uses a small range of sample data
    labelled to form the specifications of the process (i.e. train itself).

    2. The limit results in a partially trained model that will later be given the
    task of marking unmarked data. The tests are called pseudo-labelled data.

    3. Finally, branded and pseudo-labelled data sets are merged, producing a distinct
    algorithm that incorporates concise and statistical features of supervised and
    unsupervised learning.


    Semi-supervised learning uses the grouping process to classify data objects and
    the clustering process to divide them into different sections.


    ## Applications

    Semi-supervised example application of machine learning The legal and health care
    sectors, among others, handle online content recognition, image, and voice processing
    with the aid of semi-supervised algorithms. In the case of web content processing,
    semi-supervised learning is extended to crawling engines and content aggregation
    schemes. In both cases, a wide range of marks is used to classify material and
    organize it in different configurations. This method, however, includes human
    feedback for further classification. `UClassify` would be a perfect example of
    this.


    The `GATE` (General Architecture for Text Engineering) is another well-known method
    in this area. In the case of image and speech analysis, a marking algorithm is
    used to provide a valid image or speech analytic model with a coherent transcription
    based on a sample corpus. E.g., it may be an MRI or a CT scan. With a limited
    collection of outstanding scans, it is possible to have a cohesive model capable
    to detect anomalies in the images.


    # Reinforcing Machine Learning Algorithms


    Strengthening computing is what is generally known as machine computing artificial
    intelligence. Essentially, reinforcement learning is all about the creation of
    a self-sustained mechanism that, during sequential sequences of attempts and failures,
    develops itself on the basis of a mixture of labelled data and encounters with
    incoming data.


    Strengthened ML uses a method called `exploration/exploitation`. The dynamics
    are simple: the action takes place, the effects are measured, and the next action
    considers the outcomes of the first action. Reward signals that arise while executing
    particular tasks are at the heart of reinforcement learning algorithms. In a way,
    incentive signals act as a navigation device for reinforcement algorithms. They''re
    giving us an idea of a correct and wrong course of action.


    Two main types of incentive signals are:

    - A constructive reward signal facilitates the consistent execution of a specific
    sequence of acts.

    - Negative incentive signal penalizes the success of certain tasks and encourages
    the algorithm to stop getting drawbacks.


    However, the role of the incentive signal can vary depending on the nature of
    the provided information. Thus, compensation signals may be further categorized
    according to the requirements of the operation. Overall, the program aims to optimize
    positive incentives and minimize negatives.


    More popular reinforcement learning algorithms include:

    - `Q-Learning`

    - `Temporal Difference (TD)`

    - `Monte-Carlo Tree Search (MCTS)`

    - `Asynchronous Actor-Critical Agents (A3C)`


    # Usage Scenarios for Improved Machine Learning Algorithms


    Reinforcement Machine Learning is suitable when restricted or conflicting information
    are available. In this case, an algorithm may build its operating procedures on
    the basis of data interactions and related processes. Modern NPCs and other video
    games use a lot of this form of machine learning model. Reinforcement Learning
    provides versatility to the AI reactions to the behavior of the player, thereby
    offering viable challenges. For example, the collision detection app uses this
    form of ML algorithm to move vehicles and people in `Grand Theft Auto`.


    Self-driving cars often rely on improved learning algorithms. For example, if
    a self-driving car (e.g. `Waymo`) senses a road turn left - it will trigger the
    `change left` scenario, and so on. The most prominent example of this variation
    of reinforcement learning is `AlphaGo`, who went head-to-head with the second-best
    Go player in the world and outplayed him, estimating the sequences of acts out
    of the current board position.


    Marketing and Ad Tech processes, on the other hand, also use Reinforcement Learning.
    This form of machine learning algorithm can make the retargeting process much
    more robust and effective in providing conversion by closely adjusting to the
    user''s behavior and contextual context. Additionally, Reinforcement learning
    is used to improve and modify natural language processing (`NLP`) and conversation
    generation for chatbots to:

    - Mimic the theme of an input post.

    - Develop more stimulating, insightful kinds of answers.

    - Find appropriate answers according to the consumer reaction.


    With the advent of `Google DialogFlow` development, this bot was more of a UX
    challenge than a technological achievement.

    '
