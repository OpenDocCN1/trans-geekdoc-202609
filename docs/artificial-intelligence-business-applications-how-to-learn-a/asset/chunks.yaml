    describes AI as "constraint-algorithms, revealed by symbols that endorse loop-models
    that tie thought, interpretation and behavior together." Although these concepts
    can appear vague to the average person, they help to center the subject as an
    area of computer science and offer a blue-description. While addressing the crowd
    at Japan AI Experience in 2017, DataRobot CEO Jeremy Achin began his speech by
    giving the following description of how AI is used today: “AI is a computer system
    capable of performing tasks that normally require human intelligence... some of
    these artificial intelligence systems are driven by machine learning, some of
    them are controlled by deep learning, and some of them require human intelligence”.


