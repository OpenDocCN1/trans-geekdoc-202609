    # 引言 ![](img/image_rsrc10E.jpg)


    您的营销技术是否正在利用技术创新的巨大进展，在关键的时间和地点触达您的客户呢？在现代业务的竞争中，未能关注如`artificial intelligence`等新兴技术的发展，可能会导致客户参与度远落于那些拥有技术增强的竞争对手。多年来，定向广告的标准模型是识别行为相似性标记（例如订阅特定主题的出版物），并创建吸引您所选客户群体的内容。但在当今这种超个性化的环境中，这种“一刀切”的策略已不再灵验。然而，设计真正定制的、规模化的广告和营销所需的人力，使得精准定位客户变得几乎是不可能的。不过，得益于`artificial
    intelligence`，我们现在拥有资源来实现这一点，并让定位、联系和转化客户变得比以往任何时候都容易。同样重要的是，`artificial intelligence`
    能够简化营销系统，消除曾经阻碍 1:1 交互和个性化内容改进的高昂成本。在本书中，我们将讨论公司利用 `artificial intelligence` 增强
    1:1 营销活动质量和效率的不同方法，并展望 `AI` 未来如何改变企业与用户沟通的方式。


    ## 人工智能以及为什么它对您的营销未来至关重要


    `AI` 是企业不可或缺的工具，用于从数据源获取重要见解和领先方法。近期关于`artificial intelligence`（`AI`）有许多炒作，但很少有人真正知道它是什么。`Artificial
    intelligence` 是计算机科学的一个分支，专注于开发能够随时间推移不断学习并增强性能的软件。虽然计算机非常擅长快速收集大量数据，但在历史上，只有人类头脑才能知道如何处理这些知识和信息，以及如何利用它们来实现特定目标。20
    世纪 50 年代，计算机科学家开始寻找构建能够解决问题并模仿人类思维应用程序的方法。最近的 `AI` 系统已帮助处理诸如街道制图等“快速”任务，到 2003
    年，作为 `Alexa` 或 `Siri` 等网络助手基础的基础设施已经就位。如今，`AI` 的算法能够不断学习并响应不同的“输入”，无论是人类语音、X 射线图像或其他数据类型。而且
    `AI` 改变其行业各个方面（从开发到客户服务）的能力是巨大的。公司现在正使用 `AI` 监控消费者行为、预测人口遵守情况、预测销售并提供顶级的客户支持。事实上，技术现在负责驱动我们所熟悉并享受的日常应用，如
    `Siri`、`Cortana`、`PayPal`、`Google Maps` 等，涉及 `machine learning`、`deep learning`
    和 `natural language processing`（`NLP`）等多个 AI 领域。这引发了一个问题：如果 `AI` 技术如此强大，我该如何利用它来推进公司的营销策略？


    ## 企业如何使用 AI 提升其营销 ROI


    随着 `AI` 的出现，企业不仅获得了与客户进行个体沟通的潜力，还能将他们留下的数据转化为未来最好代表他们的蓝图。随着 `AI` 算法的持续增长以及复杂的计算能力变得更具商业价值，企业正在逐渐增加人工智能在其营销策略中的作用。`artificial
    intelligence` 有时用于解码隐藏在海量证据中的信号，它通过提供深度统计能力来准确预测消费者行为，从而提供了关键的战略优势。


    ### 使用预测性分析预测购买趋势


    `Predictive analytics` 使用大量数据预测可能的结果。像 `Target` 这样的公司重点关注 `predictive analytics`，以精地预测客户的购买习惯。2012
    年，该公司在能够准确预测一名青少年怀孕后登上了头条，而这种预测考虑了她在发现自己（意外地）怀孕之前的购物模式。这一事件既显示了营销公司所用算法的准确性，也显示了在使用这些新兴技术期间对人类控制的持续需求。


    ### 使用深度学习识别复杂对象


    `Deep learning` 允许机器“读取”图像、文本、语音和其他数据结构以保存有用信息。在讨论 `deep learning` 的使用时，如果没有讨论社交巨头
    `Facebook` 如何使用基于来自 `Instagram` 用户提交图像的强大对象识别系统，讨论就是不完整的。尽管该公司声称收集到的智能未被用于进一步解释消费者行为，但新的开源倡议为其他企业继续利用这种分析技术打开了大门。


    ### 使用聊天机器人改进客户服务


    然而，不仅仅是电子行业的核心领域在使用人工智能来改进消费者服务。通过智能聊天机器人的支持，企业通过 1:1 直观、开放且交互的互动为消费者提供服务，满足他们的需求并帮助他们发现价值资源。去年，全球油气公司
    `Shell` 引入了一个名为“Shelly”的新聊天机器人，帮助消费者确定哪些变化更适合他们的车辆。`Shelly` 不仅有助于促进与公司的 1:1 客户互动，根据
    `Shell India` 董事 `Mansi Madan Tripathy` 的说法，它消除了停机时间并减少了 25-30% 的消费者成本。`Tripathy`
    还认为 `Shelly` 对传感器驱动的数据聚合将提高将现代技术纳入公司生理结构的车队的健康和运行性能。


    ## 总结


    随着 `AI` 的普及，消费者对企业提高服务水平的期望也之增加。同样，当公司应该提供博客、在线订单和其他全渠道购买选项时，消费者会要求来自响应式的、有意义的交流。此外，`AI`
    的性能是人类完全无法实现的。尽管我们可能与机器人竞争，但这种资源密集型工作对那些利用员工专业知识处理非编程活动的企业是有益的。现代营销人员需要继续考虑 `AI`
    可以推进公司目标的许多方向并继续实施它们。等待整个行业范式的转变将使企业难以跟上。


    ## 使用人工智能提升消费者体验


    企业正在改变消费者体验其品牌的方式，整合智能聊天机器人、预测性分析和其他定制服务以提供更具响应性的客户服务。最终，消费者将转向提供最易获取、低成本附加值的企业。人工智能已成为一项关键技术，使企业不仅满足客户的需求，还能满足自己的需求。我们最近讨论了
    `Shell` 如何使用聊天机器人改进其客户体验。现在让我们看看 `Shell` 或油气行业的其他机构如何继续将 `AI` 整合到其营销计划中，以更好地利用大多数消费者每周使用一次的工具：加油站。


    ### 使用人工智能查看消费者钱包数据


    许多零售商现在提供消费者奖励以促进对特定票券的使用。随着 `AI` 算法的持续增长以及复杂的计算能力变得更具商业价值，企业正在逐渐增加人工智能在其营销策略中的作用。`artificial
    intelligence` 有时用于解码隐藏在海量证据中的信号，通过提供深度统计能力来准确预测消费者行为提供了关键战略优势。使用预测性分析预测购买趋势。`Predictive
    analytics` 使用大量数据预测可能的结果。像 `Target` 这样的公司重点关注 `predictive analytics`，以精地预测客户的购买习惯。2012
    年，该公司在能够根据其发现自己（意外地）怀孕之前的购物模式准确预测青少年怀孕后登上了头条。这一事件显示了营销公司所用算法的准确性，也显示了在使用这些新兴技术期间对人类控制的持续需求。使用深度学习识别复杂对象。`Deep
    learning` 允许机器“读取”图像、文本、语音和其他数据结构以保存有用信息。在讨论 `deep learning` 的使用时，如果没有讨论社交巨头 `Facebook`
