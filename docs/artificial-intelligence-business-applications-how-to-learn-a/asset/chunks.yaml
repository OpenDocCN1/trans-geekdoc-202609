- fmt: "\n# OF THE AI ![](image_rsrc10E.jpg)\n\nThe development of an AI plan is a\
    \ team effort. You need a range of insights around the key elements of the AI\
    \ approach. The team composition varies among entrepreneurs and businesses. Startups\
    \ build an AI approach in smaller teams based on technical input from the `Software\
    \ Engineer` and market input from the `Product Owner` or `Business Manager`. Corporate\
    \ departments have more functionalities. Andreas Meier, who has developed an internal\
    \ AI approach for the world's largest carmaker, understands that in organizations\
    \ with specific positions, you need a lot of market experience in order to pursue\
    \ a successful AI approach. You need a wide number of people with specific positions\
    \ in a company, while in companies you can build a marvelous AI approach with\
    \ a few generalists.\n\n## Hallmarks of right and wrong AI Strategies\n\nAcross\
    \ firms, right and wrong AI tactics share similar characteristics. Effective AI\
    \ Plans are impact-driven, well-funded in the business and well-funded in terms\
    \ of time, compensation as well as aspirations. Bad AI Approaches are hype-driven,\
