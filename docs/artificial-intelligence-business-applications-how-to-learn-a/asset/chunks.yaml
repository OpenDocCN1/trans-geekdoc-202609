    # 如何将 AI 应用于你的营销


    ![](img/image_rsrc10E.jpg)


    人工智能（`AI`）是优化消费者服务的重要驱动力，并帮助广告商预测客户的需求。数字营销基于这种统计技术，无疑是触达目标受众最成功的方式之一。`AI` 的简要事实是：这项技术允许机器人以人类相同的方式解决挑战。几十年来，计算机程序一直是通过手动编程，以便从特定的输入产生特定的输出。当使用
    `AI` 时，机器可以使用数据来识别模式并做出决策，而无需针对此进行专门训练。


    ## AI 实现的一对一优化


    当今营销领域对定制化信息的关注日益重视。通过使用复杂的分析工具、`CRM` 以及社交媒体，可以显著提升营销活动的投资回报率（ROI）。这三项技术共同实现了一种战略性的、多层的策略，能够定义、识别并自动生成个性化的通信。关注“一对一”优化而非“一对万”，更多地在于了解客户：他们需要什么、渴望什么以及在想什么。通过了解这些，你应该能够为每个人提供正确的答案和准确的信息。


    一旦你进入了真正的一对一营销模式，`AI` 就可以用于减少消费者与公司的接触次数，使他们只关联某些具有真实意义的接触。这必须自动处理，而基于 `AI` 的工具正为此提供帮助。解决方案实现了实时自动化，为每个客户提供个性化通知，让他们始终获得正确的提示以帮助他们进入购买流程的下一个阶段，从而带来更多的购买和更高的
    ROI。


    `AI` 让广告商能够不断进化。得益于使用机器学习改进的模型算法，新的创新可以更频繁地进行评估。一个利用机器学习进行测试的组织能够帮助公司在创新上超越对手。


    ## 人机协作实现最佳结果


    技术的飞速发展已将 `AI` 等技术推到了实际上可以与人类效率和准确性相媲的水平。那么，你如何利用这项新技术获得最佳结果呢？正如埃里克·布尼约夫森和安德鲁·麦卡菲在《第二次机器时代》书中所述，机器辅助的人类玩家可能击败机器人。这意味着将专业沟通与尖端技术相结合是一个获胜法宝。你需要专家来解读数据，并找出如何将来自先进
    `AI` 的新想法转化为新的战术。基于 `AI` 的软件功能是一个良好的开始，但真正的游戏规则改变者在于，广告商如何将他们获得的信息推向尚未探索的新方向。这正是我们看到
    `AI` 在营销中真正重要之处的地方。在，人工智能之外，人类智能在 `AI` 的使用中将继续发挥主要作用。


    ## AI 应用营销


    以下是 `AI` 在营销方面可以做的一些工作：


    ### 广告优化

    基于 `AI` 的营销软件可以帮助你进行 `A / B` 营销测试，既节省时间又资源，并利用机器学习算法以最少的时间开发高质量的广告内容。计算机自动跨渠道划分预算以优化
    ROI。它每分钟处理数千个微型活动并建立新方法。在自动化的支持下，你仍然可以维护针对潜在营销的消费者体验知识，并使用最具效益的触点来产生 ROI。


    ### 培训

    对数千个因素（包括创新因素）进行持续的 `A-B` 监控。`AI` 的性能增长速度快于人类。这部分是因为 `AI` 可以利用细小的知识碎片来尝试预测。


    ### 自动化和定制内容

    通过基于 `AI` 的技术，多媒体创意可以被设计为用于一对一通信，而非大众传播。这在几分之一秒内在大范围内动态实现，从而允许广告商向客户发送定制化信息。这已被证明是增加营销活动
    ROI 的完美方式。


    ### 语义研究

    基于 `AI` 的技术被用于根据识别单词模式的需求，定义并处理类别和文档中的语言结构。


    ### 聊天机器人创建

    `Chatbot` 被定义为在个人层面处理客户的人工智能平台。这是一种解决不复杂消费者问题的成本效益高的方法。例如，《纽约时报》每天在其社交媒体网络上发送近
    300 条消息。过去，一个人必须手动发布这些消息中的每一条，但报社开发了一个 `chatbot` 来自动管理社交帖子。今天，它还能预测哪些故事表现良好，哪些需要更多推广。通过机器人自动完成任务，人类开发者就有更多时间投入到
    `AI` 无法处理的创新方面。


    ### 智能决策

    诸如 `Google Analytics 360 Suite` 和 `Adobe Analytics` 等分析应用基于 `AI` 技术，为数据驱动的决策提供了强有力的平台。通过回顾过去数据（包括物理触点和竞争对手数据），计算机将告诉我们哪些有效，哪些无效。机器能够中断特定细节并对潜在的下一步行动提供有见地的输入。


    ### 在正确的时间、正确的地点获取正确的用户

    `AI` 通过根据职业、就业情况、薪水、欲望、性别以及年龄等人口统计数据划分最佳受众，来鼓励数字广告。对于数字广告，潜在买家将轻松地坐在家里，使用智能手机和桌面电脑搜索网站寻找最想要的物体。基于
    `AI` 的应用确保你在正确的时间、正确的地点遇到正确的用户。


    ## 使用 AI 增加营销收入

    如果使用得当，`AI` 将把营销投资转化为更多的销售和改进的品牌体验。美国成功的通信领域愿景家约翰·瓦纳梅克曾发明了这样一种说法：“我花在广告上的钱有一半被浪费了；问题是，我不知道是哪一半。”幸运的是，这对我们来说已不再是真的。通过将智能机器和智慧人类相结合，我们能够确保任何项目（无论大小）都能完成它应该做的事情：实现客户收入最大化。


