  \ 用例：预测\n\n预测变量的能力是控制系统的一项变革性能力。与其依赖事后修正系统状态的反应性策略（这通常需要巨大的努力来克服惯性），预测允许提前调整以引导系统达到目标状态。这种主动方法可以节省能源并简化控制过程。然而，这种方法的有效性取决于预测的准确性和系统的特定的动力学特性。\n\
  \n### 温控器温度预测\n\n问题定义：一家电器公司要求你设计一种创新的温控器，旨在彻底改变室内温度调节。与温控器根据当前读数调整温度不同，这种新模型通过预测房间内的温度变化来主动管理气候。\n\
  \n\n\n\n\n### 解决方案\n\n该解决方案包含一个独立设备，用于采集温度和相对湿度（RH），并运行推理模型来预测房间在未来 20、40 和 60 分钟的温度和湿度。该设备像普通温控器一样与空调系统（HVAC）交互，使用三根电缆：两根用于供电，第三根用于开关。为了显示房间的当前状态并为用户提供更改设定值（所需温度）的方法，设备将与专门用于交互的\
  \ UI 模块进行无线通信。该 UI 还可以同时显示多个温控器的温度。下图所示各个模块之间的概念连接：\n\n![](img/figure_7.11.png)\n\
  \n图 7.11：概念图（温度预测）\n\n温控器必须能够准确预测未来一小时的房间温度。这种能力取决于温控器学习并适应其所处特定环境的能力。作为初始设置的一部分，温控器被设计为在几天内收集房间的温度数据。这一关键的数据采集阶段让温控器能够理解房间独特的热特性和模式。\n\
  \n一旦温控器积累了足够的数据，它就能对未来的温度波动做出明智的预测。通过预判这些变化并调整加热或空调系统，温控器可以更高效地维持舒适的室内气候。\n\n这种预测方法的潜在收益是巨大的。这种先进的温控器可以使加热和冷却成本节省高达\
  \ 20%。这种节省不仅减少了房主的支出，还对更广泛的节能工作做出了贡献。这种创新的温控器代表了气候控制技术的重大飞跃，结合了便利性、效率和环境责任。\n\n\
  ### 数据采集\n\n温度数据以 1/60 Hz（每分钟一次）频率从内部温度和 RH 传感器采集，并通过简单的卡尔曼滤波器以消除信号噪声。为了训练模型，我们在温控器将放置的房间采集了\
  \ 24 小时的数据。下图所示用于训练、测试和验证的比例：\n\n![](img/figure_7.12.png)\n\n图 7.12：训练数据集（温度预测）\n\
  \n## 处理\n\n采集的数据被分成 8 秒一个的数据块，并以房间 20 分钟后的空间温度进行标记。每个不同的标签将定义一个新类（就像传统的分类一样）。房间的温度范围决定了类的数量。如果我们想预测更窄范围内的温度，我们需要一个能够保证小数足够精确的温度传感器。图\
  \ 7.13 所示的聚类图说明相似的输入产生相似的输出。样本形成的模式代表了回归模型需要学习和捕捉的多维关系。\n\n![](img/figure_7.13.png)\n\
  \n图 7.13：聚类图（温度预测）\n\n## 模型\n\n我们使用一个输入层具有 8 个节点的深度学习模型。每个节点将接收来自样本的读取值。记住，样本长度为\
  \ 8 秒，每秒一次读取值。输入层全连接到一个具有 20 个神经元的密集层，随后连接到另一个具有 10 个神经元的密集层（图 7.14）。输出是一个单节点全连接层，将返回回归值。\n\
  \n![](img/figure_7.14.png)\n\n图 7.14：回归模型（温度预测）\n\n我们将通过提供随时间变化的读取序列作为输入来实现输入的并行。换句话说，我们将一次性发送整个样本，而不是只发送最近的读取值。这种方法相当于指示模型从曲线的形状中学习，使其能够推断未来状态。\n\
  \n密集层神经网络的一个基本方面是它们总是返回数字，这正是我们回归任务所需要的。由于最后一层只有一个节点，在每次迭代中计算误差只需将标签与该最后一层的输出进行比较即可。在训练期间，每个密集层的权重都会通过名为反向传播的过程自动调整，以减少该误差。通过足够的数据和迭代，模型学会了识别模式，并从以前未见过的数据中推断未来温度。需要强调的是，由于我们使用特定房间的温度数据训练模型，它只知道如何预测该房间的温度。\n\
  \n图 7.15 中的训练、验证和测试结果显示，验证阶段实现了 0.03 的损失值，表明模型在验证数据集上的误差较低。在测试阶段，模型表现出 100% 的准确率，表明它完美地预测了测试数据集上的输出。然而，对于回归问题来说，这种异常高准确率引发了对过拟合的潜在担忧，因为模型可能学习了特定于测试数据的模式，而不是泛化到未见过的数据。\n\
  \n![](img/figure_7_15_NEW.png)\n\n图 7.15：训练、验证和测试指标（温度预测）\n\n## 系统实现\n\n该解决方案包含两个模块。模块\
  \ 1 是采集和回归设备，模块 2 是用户界面（UI）。下图显示了每个模块的各个组件及其连接和电源：\n\n![](img/figure_7_16_NEW.png)\n\
  \n图 7.16：连接图（温度预测）\n\n应用程序需求规定它需要一种让用户建立房间设定值的方法，并提供当前和预测状态的可视性。因此，该解决方案的实现假设每个智能温控器都在同一设备上采集数据并执行回归，同时将其状态发送到中央显示器。\n\
  \n模块 1 使用 Arduino Nano 33 BLE Sense 采集并运行回归模型。辅助微控制器 `NRF52840` 通过 BLE 网格向模块 2 发送消息。不需要额外的传感器或外设，因为\
