  \ `PID function` 以确定运行执行器命令的最佳路径。<br>5. 将控制命令发送到执行器。 |\n\n表 7.3: Block 2 的伪代码（温室控制）\n\
  \n### 网络\n\n温室内部不断变化的情况以及需要重新调整设备以优化测量和执行器效果的需求，使得使用无线网络连接传感器和执行器变得非常有必要。无线网络还简化了新组件的添加，便于集成。`data\
  \ acquisition Blocks` 将其数据发布到 `aggregator` 订阅的共享通道，而控制命令则发布在由 `actuators` 监控的独立通道上。每个消息负载都包含一个用于指定目标执行器的标识符。\n\
  \n| 块(s) || 动作 | 通道 |\n| --- | --- | --- |\n| 1 | 发布到 | CH1 |\n| 2 | 订阅自 | CH1 |\n\
  | 2 | 发布到 | CH2 |\n| 执行器 | 订阅 | CH2 |\n\n表 7.4: 网络配置（温室控制）\n\n### 功耗分析\n\n`data\
  \ acquisition Blocks` 可以由电池供电，因为读数频率非常低（大约每分钟一次）。在读取间隔期间，`Block` 保持在睡眠模式。\n\n| 电源\
