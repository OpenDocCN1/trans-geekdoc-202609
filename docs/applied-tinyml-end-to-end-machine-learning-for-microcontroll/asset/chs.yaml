  \ | $30 |\n| NRF52840 Dongle | 2 | $12 | $24 |\n| 电源 | 2 | $30 | $60 |\n\n表 8.10：材料清单（声音异常）\n\
  \n材料的成本约为 $159。\n\n### 用例：跨时间的异常检测](#contents.xhtml#sc4_303a)\n\n问题定义：一家商业房地产公司正面临租客对房间太热或太冷的投诉。通常，在收到投诉时，租客已经很不不快了，由于房间处于阈值之外已有一段时间，解决问题需要更长时间。楼宇运营商希望实时检测温度异常，以便在租客察觉之前提供快速响应。然而，目前的系统每层只有几个传感器，难以识别特定区域的异常。\n\
  \n解决方案：建议的解决方案由传感器组成，这些传感器可以捕捉周围温度，并结合分类模型和异常评分系统检测任何异常活动或异常。楼层上的每个房间都将与放置在楼层中间的中央设备通信，该设备可以通过互联网将信号发送到云端，当传感器检测到任何异常时，云端将通知楼宇运营商。概念图（如图\
  \ 8.22 所示）展示了解决方案的总体思路，传感器通过网络连接，其中一个节点具有将数据发送到云端的能力。\n\n![](img/figure_8.22.png)\n\
  \n图 8.22：概念图（温度异常）\n\n### 数据采集](#contents.xhtml#sc4_305a)\n\n为了确保对商业空间的准确监控，建议对所有需要监控异常的区域采集空间温度。这允许为每个空间创建专门的模型，而不是依赖于云端处理数据的通用异常检测模型。通过在边缘运行\
  \ TinyML 模型，可以在本地检测异常。房间温度不会瞬时变化，因此每分钟采集一次温度数据就足够。初始模型使用 24 小时的数据进行训练，但未来的版本可以使用不同天气条件下的几天数据进行训练。数据划分如图：\n\
  \n![](img/figure_8.23.png)\n\n图 8.23：测试数据集（温度异常）\n\n\n\n\n\n温度信号是按照 `1/60Hz` 频率采集的一系列测量值。为了测量温度随时间的变化率，我们缓存了最后十次读取值。在将读取值输入\
  \ `TinyML` 模型之前，我们需要检查是否存在间隙、频率变化（例如接收到三次读取而非一次）以及可能由传感器故障而非实际温度异常引起的离群值。为了做到这一点，我们使用了卡尔曼滤波（`Kalman\
  \ filter`），它通过遵循简单的物理规则来确定读取的准确性。如果传感器提供的数据不是摄氏度，我们将原始字节数据转换为摄氏度。最近的十次读取值将以 `1Hz`\
  \ 的频率（每秒一个数据点）进行重采样，并发送到 `TinyML` 模型，从而产生 600 个特征。\n\n## 模型\n\n我们使用分类模型与 `k-means`\
  \ 函数的并行配置来识别房间温度的异常。分类模型接收代表过去 10 分钟房间温度的 600 个特征，并将它们输入到全连接密集层。下一层是具有 20 个参数的稠密层，并使用\
  \ `ReLU` 函数激活。第三层是另一个具有 10 个参数的稠密层，同样使用 `ReLU` 函数激活。最后，输出通过 `SoftMax` 函数，该函数将密集网络的输出转换为概率分布。该分布显示了样本代表正常行为的概率。\n\
  \n在完成初始分类后，我们随后将样本通过 `K-means` 函数来确定其异常得分。该得分通过计算代表正常操作的簇中心与基于核心特征的样本之间的距离来确定。这一过程允许我们识别房间温度读取值中的任何异常。\n\
  \n如[图 8.24]所示，该模型在识别温度异常方面表现出强大的性能，验证损失低至 0.27，测试准确率高达 94.86%，表明它训练良好，并能够泛化到未见数据。使用具有\
  \ 32 个簇和 `0.3` 阈值的 `K-means` 聚类，通过根据点与类中心的接近程度对其进行分类，增强了模型细化异常检测的能力。将时间序列压缩为 7 个有意义的特征，表明特征工程是有效的，它在保留关键信息的同时降低了维度。然而，尽管指标看起来良好，模型检测细微或边缘情况异常的能力仍应在现场部署期间进一步验证，以确保在各种现实世界场景中的稳健性。\n\
  \n![](img/figure_8.24.png)\n\n图 8.24：训练、验证和测试指标（房间温度异常）\n\n## 系统实现\n\n系统由两种不同类型的模块（Blocks）组成。`Block\
  \ 1` 负责采集温度读取值并确定其异常得分。你可以根据该方案想要覆盖的房间数量多次复制 `Block 1`。另一方面，你只需要一个 `Block 2`，它接收所有\
  \ `Block 1` 设备的状态（而非读取值）。然后，它通过互联网连接将此信息发送到警报系统。通过无线网络的信息流如图实现图所示：\n\n![](img/figure_8.25.png)\n\
  \n图 8.25：连接图（房间温度异常）\n\n`Block 1` 使用 `Arduino Nano 33 BLE Sense` 构建，它集成了温度传感器和一个能够运行\
  \ `TinyML` 分类模型和 `K-means` 函数的 `ARM-M` 微控制器。`Block 1` 使用辅助微控制器（`NRF52840 Dongle`）向\
  \ `Bluetooth Mesh Network` 发送消息。\n\n`Block 2` 使用具有双处理器的 `Thingy9160` 构建。第一个（`NRF52840`）接收来自\
  \ `BLE Mesh Network` 的状态消息，第二个（`NRF9160`）连接到 `NRFCloud`。\n\n\n\n\n\n* 异常检测用例 3：[`studio.edgeimpulse.com/public/378014/live`](https://studio.edgeimpulse.com/public/378014/live)\n\
