  材料估计成本为 $258。\n\n### 用例：估算\n传统的回归受限于数值输入。深度学习和卷积网络开启了多模态回归的可能性。现在可以从图像、声音甚至口头描述中推导出数值。以下用例探索了多因素验证的概念，展示了通过多种方式验证测量的方法。\n\
  \n### 图像重量估计\n问题定义：一个谷物市场希望实现结账流程自动化，同时不增加财务损失的风险。确定系统除了重量平衡返回的测量值外，还能通过另一种方法验证谷物的重量。该解决方案应能够实时地分类并推断产品重量，以避免结账过程的延迟。\n\
  \n\n\n\n\n如果检测到重量差异，系统将激活 `Service` 指示灯，通知人工助手提供进一步帮助。此外，另一盏灯将指示用户在推理进行时等待、继续处理下一个物品，或等待服务助理协助处理交易。\n\
  \n## 数据获取 (##contents.xhtml#sc4_264a)\n\n运行回归和分类模型所需的数据是来自自选结账机顶部数字摄像机的图像。图像以 `10Hz`\
  \ 的频率进行捕获。由于微控制器不会在内存中存储图像历史。模型应该能够以足够的速度执行推理和回归，以避免产生积压。如果发生积压，较新的图像将覆盖旧图像。无论如何，一旦分类结果返回并获得批准，用户就可以移动到下一个物品。\n\
  \n在此用例的试点阶段中，仅使用了一种谷物。如图 7.18 所示，训练集每个重量和类别包含 50 张图像。重量从 `0g` 开始，在每个类别中每隔 `50g`\
  \ 增加一次，直到 `1000g`。数据集包含 1000 张图像。由于这是一个受控环境，超市要求用户使用标准托盘称量谷物。使用同一个托盘会让基于图像的回归准确得多。\n\
  \n![](img/figure_7_18_NEW.png)\n\n图 7.18: 训练数据集（重量估计）\n\n## 处理 (##contents.xhtml#sc4_265a)\n\
  \n与第 3 章中的图像分类——动作分类一样，我们需要在将图像发送到模型之前对其处理。首先，将其变为正方形，然后缩放到 `160x160`。此用例的灵感来自 Aditya\
  \ Mangalampalli 的博客文章，该文章描述了将图像缩小到 `96x96` 如何导致模型到无法有效。\n\n如果光线条件良好，将增强谷物的颜色和细节。三个颜色通道都是必要的，因为颜色在谷物分类中起着重要作用。\n\
  \n发送到分类和回归模型的特征总数为 `76,800`。每个像素都是一个特征（`160x160x3 = 76,800`）。下面的图显示了相似输出的分组，这意味着相似的输入返回相似的输出，这正是我们要的：\n\
  \n![](img/figure_7.19.png)\n\n图 7.19: 聚类图（重量估计）\n\n## 模型 (##contents.xhtml#sc4_266a)\n\
  \n由于我们使用的是图像，使用卷积神经网络来利用图像的空间关系是有意义的。\n\n神经网络由一个输入层组成，包含 `76,800` 个特征，全连接到一个具有 `32`\
  \ 个神经元的二维卷积层。该层的卷积核大小为 `3x3`。我们使用了填充（padding）来在每次卷积后保持相同大小。输出经过归一化，并通过 `ReLu` 激活函数运行以引入非线性。下面的图显示了网络的结构图：\n\
  \n![](img/figure_7.20.png)\n\n图 7.20: 图像回归神经网络（重量估计）\n\n紧接第一个卷积层之后，我们有一个 `MaxPooling`\
  \ 层，它通过保留每两个像素中的最大值来将参数尺寸减半。\n\n第二个二维卷积层具有 `16` 个神经元，卷积核为 `3x3`。它与第一个卷积层具有相同的参数：相同的填充、归一化和\
  \ `ReLu` 激活。\n\n`MaxPool` 层将参数尺寸缩小一半。然后，整个矩阵被扁平化（flattened），这意味着所有参数都变成一个非常长的一维数组。之后，我们丢弃每四个读取中的一个（将其置零）以减少过拟合。注意，丢弃函数仅在训练期间应用。\n\
  \n最后一层（输出层）具有单个节点。该层返回推理结果。该值使用均方根函数与标签进行比较。在训练期间，此误差会传递给隐藏层，以调整它们的权重并在下次训练迭代中改进。\n\
  \n需要注意的重要点是，虽然所有标签可以是整数，但推理的输出可能带有小数点。记住，根结底每个神经元都代表一个线性方程。线性方程乘以其斜率并加上偏移量。在结果中返回小数是完全正的。这是回归函数的特征，它返回的是已知点之间的值。\n\
  \n图 7.21 显示了训练、验证和测试的结果。显示模型难以有效泛化，表现为高验证损失（`135.12`）和极低的测试准确率（`1.22%`）。这表明由于特征与数据的比例过高（仅从\
  \ `2,000` 张图像中提取了 `76,800` 个特征），可能存在过拟合或学习不足。仅有两个卷积层的 CNN 架构对于该任务可能太简单，数据集可能缺乏足够的多样性或规模来捕捉谷堆外观的变化。改进模型架构、增加或增强数据集以及优化特征表示有助于解决这些问题并增强性能。\n\
  \n![](img/figure_7_21_NEW.png)\n\n图 7.21: 训练、验证和测试指标（重量估计）\n\n## 系统实现 (##contents.xhtml#sc4_267a)\n\
  \n如图 7.22 所示，实现包含两个模块。模块 1 捕获数据并处理基于图像的回归。回归结果被发送到称量谷物的设备（模块 2）。模块 2 比较两个读取值并判断是否存在可接受的差异。如果差异显著，模块\
  \ 2 向负责通知的外部灯发送 I2C 命令。\n\n等待，文本继续：\n\n模块 1 使用运行回归模型的 Nicla Vision 实现，并通知负责向网络发布冲突状态的次级控制器（`52840`）。\n\
  \n模块 2 使用 `52840` 和 Arduino Nano 33 的组合实现。前者接收来自模块 1 的消息并将有效负载发送给后者。模块 2 中的 Arduino\
  \ 还通过存储在 SD 卡中来保留所有事件的状态。SD 志器是一个通过 I2C 总线接收命令和数据的外部组件。\n\n\n\n\n\n| --- | --- |\n\
