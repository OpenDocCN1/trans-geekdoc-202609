  \ Dongle` | 4 | $12 | $48 |\n| `Neopixel Strip (60x)` | 1 | $99 | $99 |\n| `Power\
  \ Source 1A @5v` | 4 | $30 | $120 |\n\n表 3.2：材料清单（工人跌落检测）\n材料近似成本为 $472。\n\n###\
  \ 用例：运动分析 (#contents.xhtml#sc2_109a)\n\n运动分类能够检测作为行为指示的特定运动模式。通过分析来自加速度计和陀螺仪的数据，机器学习模型可以识别并区分不同类型的运动，从微妙的手势到复杂的活动。\n\
  \n### 风格跟踪 (#contents.xhtml#sc3_110a)\n\n此用例侧重于车辆运动的分类，包括加速、刹车、转弯和速度变化，以建立监控驾驶行为和性能的端到端解决方案。问题定义：一家保险公司正在进行实验，以确定向司机提供实时反馈是否可以减少事故。公司愿意为使用反馈设备的司机提供大幅折扣。设备将配备一个安装在仪表板上的小型扬声器，如果驾驶行为被认为危险或超出正常范围，扬声器将发出哔声。\n\
  \n解决方案：建议的解决方案涉及使用运行 `TinyML` 模型的微控制器，并配备内置加速度计以检测驾驶事件及其强度。微控制器与轨道播放器串行通信，当司机操作汽车不小心时，播放器会产生离散的哔声。司机可以以非侵入且不分心的方式听到这些哔声。\n\
  \n下图显示了建议解决方案的示意图：\n\n![](img/figure_3.26.png)\n\n图 3.26：解决方案概念（汽车风格跟踪）\n\n\n\n\n\
  \n此用例的目标是确定车辆是否正在危险驾驶。为了收集训练数据，我们在测试车辆的仪表盘上安装了一个带有三个加速度计的设备。`Y-axis` 与车辆行驶方向对齐。`Y-axis`\
  \ 上的负值表示加速，正值表示减速。`X-axis` 垂直于车辆行驶方向并与路面平行。`X-axis` 上的负值表示右转产生的离心力，正值表示左转。`Z-axis`\
  \ 垂直于行驶面，并与地球引力加速度 `9.81m/s²` 对齐。当汽车行驶时，它会受到各种力的影响，其中某些力可能大于重引力（`1G`）。例如，当你以大约 `15\
  \ km/h` 的速度行驶并需要突然刹车以避免撞到人时，你将体验到约 `1G` 的加速度（位于 `Y-axis`）。这是安全的，但并非愉快的体验，如果你是一个优秀的驾驶员，这种情况不应频繁发生。该设备在车辆移动时记录加速度数据，在车辆停车并关闭时停止记录。\n\
  \n图 3.27 显示了训练数据集的特征，其中包括突然刹车和正常行驶的不同实例样本。数据集分为三个部分：训练集（`70%`）、测试集（`20%`）和验证集（`10%`）。\n\
  \n![](img/figure_3.27.png)\n\n图 3.27：训练、测试和验证数据集（汽车驾驶风格跟踪器）\n\n如果你是一个危险驾驶员，你可能会采取更多冒险，例如闯黄灯、不让其他车辆并线，或尝试在车辆之间穿插。虽然大多数时候驾驶员可能能够幸脱，但偶尔他们必须突然刹车以避免碰撞。最初，我们尝试对变道、加速和减速等驾驶行为进行分类，以识别不同的驾驶风格。然而，我们发现突然刹车是所有指示危险驾驶的风格中的共同因素。因此，我们创建了一个二分类数据集，其中\
  \ `50%` 的样本代表突然刹车，另外 `50%` 代表不超过 `0.5G` 的常规驾驶操作（如正常转弯、加速和减速）。\n\n## 处理\n\n在 `15\
  \ km/h` 下的突然刹车是一个短时间事件，平均持续在 `500` 到 `1000ms` 之间。当车辆以较低速度行驶时，减速峰值的持续时间比高速长。因此，此模型不适用于检测高速下的真实碰撞。\n\
  \n`2000 ms` 的处理窗口足以显示突然刹车事件。处理块从三个加速度计时间序列中分析出 `39` 个特征。值得注意的是，对于这一特定用例，最重要的特征是\
  \ `Y axis` 的谱功率。本质上，模型通过分析在 `Y-axis` 上释放的能量来检测突然减速事件。参考下图：\n\n![](img/figure_3.28.png)\n\
  \n图 3.28：突然刹车的样本\n\n注意 `X` 和 `Z` 方向的加速度是恒定的，而 `Y` 方向的加速度显示出一个峰值约为 `10 m/s²` 的减速过程。\n\
  \n图 3.29 清楚地表明了两类数据之间存在明显的区分。垂直方向的扩散展示了数据集的多样性，但重要的是，水平方向的接近也反映了常规行驶事件与突然刹车事件之间的相似性。\n\
  \n![](img/figure_3.29.png)\n\n图 3.29：显示突然刹车事件与正常行驶事件分离的聚类图\n\n## 模型\n\n我们处理了 `100`\
  \ 个样本，提取了 `39` 个特征。这些特征被输入到一个三层神经网络中，以 `0.0005` 的学习率进行 `30` 次循环。\n\n第一层是一个具有 `20`\
  \ 个神经元的全连接层，接收来自所有 `39` 个特征的输入。输出经过 `L1`正则化并由 `ReLU` 函数激活，然后发送到第二个密集层。第二层由十个神经元组成，同样具有\
  \ `L1`正则化和 `ReLU` 激活。最后一个密集层有两个神经元，每个代表一个类别，并由 `SoftMax` 函数激活。\n\n该模型在 `80MHz` 的\
  \ `Cortex M4` 上运行需要 `1 ms`。下图显示了数据在各个阶段的分布情况：\n\n![](img/figure_30.png)\n\n图 3.30：训练、验证和部署阶段（汽车驾驶风格跟踪器）\n\
  \n## 系统实现\n\n下图显示了其构建模块之间的连接图。此外，它还展示了它们的输入输出：\n\n![](img/figure_31.png)\n\n图 3.31：连接图（驾驶风格跟踪器）\n\
  \n模块 1（采集模块）利用两个微控制器。第一个微控制器是 `Arduino 33 Sense`，它配备了加速度计用于捕捉、处理和分析车辆运动。分析的输出由本地脚本接收，该脚本准备一个命令发送给第二个微控制器——即\
  \ `NRF5240` Dongle。虽然在车内建立网状网络似乎是多必要的过度工程，但它开启了许多可能性，例如自定义仪表盘、与云端的实时通信以及黑匣子记录。\n\
  \n模块 2（执行器模块）同样与其他用例相同的组件。它包含一个 `NRF5240` dongle，用于订阅并接收来自 `Block 1` 的突然刹车消息。此外，它整合了一个\
  \ `Adafruit feather` 和一个 `4 Ohm 3W` 扬声器。这种设置为驾驶员提供了听觉反馈。听觉反馈是一种微妙的哔嘟声，与汽车提供的其他提醒驾驶员注意事件的听觉提示信号类似。\n\
  \n## 源码\n\n训练好的模型以及处理安装在车辆上的加速度计数据的逻辑被加载到 `Block 1`。在表 3.13 中，伪代码逐步解释了如何捕捉数据、处理数据、处理模型、由后处理阶段分析结果并通信到其外围块。\n\
