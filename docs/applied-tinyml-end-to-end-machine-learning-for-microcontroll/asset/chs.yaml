  \n图 3.15：训练、验证和测试指标（工具使用跟踪器）\n\n## 系统实现\n下图带有三个主要构建块及其连接的连接图。此外，它显示了它们的输入、输出和电源源：\n\
  \n![](img/figure_3.16.png)\n\n图 3.16：连接图（工具使用跟踪器）\n\n模块 1（采集块）利用两个微控制器。第一个是 `Arduino\
  \ Nano 33 BLE Sense`，它捕获三个加速度计的数据，对其进行处理并运行运动分类 TinyML 模型。一个红色 LED 连接到该微控制器的 `GPIOs`，向操作者指示使用错误。当检测到连续窗口的不正确运动时，会准备发送到网络的两条消息。第一条消息包含激活模块\
  \ 2 灯的命令，第二条消息包含激活模块 3 声音警报的命令。这些消息发送到第二个微控制器（`NRF52840 Dongle`），将其发布到网状网络。\n\n\
  模块 2（执行块）使用 `NRF52840 Dongle` 通过网状网络从模块 1 接收消息。输入的消息发送到 `Arduino 33 BLE`，它负责使用 `NeoPixel`\
  \ 协议激活警报灯。\n\n模块 3（执行块）同样使用 `NRF52840 Dongle` 接收来自模块 1 的消息。信号发送到 `Adafruit feather\
  \ with the track player wing`，以播放存储在其 `SD card` 上的警报配乐。\n\n\n\n训练好的模型以及从工具震动中采集数据、处理数据、将其输入模型、验证并校验输出的逻辑已加载到\
  \ `Block 1` 中。下表中的伪代码逐步解释了数据如何交接给固件的不同部分，以及最终发送到网络的命令，用于触发视觉警报和听觉警报动作：\n\n| `c:edgeml_3_1`\
