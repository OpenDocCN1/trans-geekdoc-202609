  \ $720。\n\n## 用例：修正\n\n传感器融合的一种常见应用是使用补充传感器来修正计算中的误差和漂移。这是通过以两种方式计算同一个指标来实现的，然后根据各自的不确定性赋予其中更大的权重。这些不确定性在滤波器的数学模型中以协方差的形式表示。\n\
  \n## 无人机加速度计和陀螺仪\n\n问题定义：一家消费电子公司正在开发一种新产品：带有摄像机的紧凑无人机。这种创新的无人机集成了先进的惯性单元（IMU），这对运行至关重要。IMU\
  \ 提供无人机在三个轴（X、Y、Z）上的精确加速度和陀螺仪数据。这些测量值对于理解和控制无人机的运动至关重要。\n\n此用例中的传感器融合组件是自包含的，告知其导航系统。下图显示没有与外部设备的通信或链接：\n\
  \n![](img/figure_6.13.png)\n\n图 6.13：概念图（陀螺仪修正）\n\n陀螺仪读取值的主要用途之一是确定无人机的姿态，即空间中任何时刻的方向。准确的姿态信息对于稳定飞行和有效操控至关重要。然而，设计团队在测试阶段遇到了巨大的挑战。他们观察到陀螺仪的角度读取值在飞行过程中随时间漂移。随着飞行的进行，漂移变得越来越严重，最终导致读取值不可靠，无人机无法使用。\n\
  \n\n\n\n\n### 解决方案\n团队正在探索一种传感器融合解决方案来解决角度漂移问题。传感器融合是一种结合多个传感器数据以提高整个系统准确性的方法。在这种情况下，建议的解决方案涉及使用加速度计读数来修正陀螺仪数据中的漂移。通过将加速度计数据与陀螺仪读数相结合，团队旨在对无人机的俯仰角（pitch）和横滚角（roll）实现更稳定、准确的测量。这种修正对于确保无人机的可靠性能和运行稳定性至关重要。\n\
  \n惯性测量单元（IMU）的读数将被发送到运行 `Kalman filter` 的微控制器，该滤波器将根据一组加速度计的实时数据修正陀螺仪读数。输出将是指示实际\
  \ `Roll` 和 `Pitch` 角的修正后信号。该信号将发送到无人机的中央控制器。\n\n### 数据采集\n来自 IMU 有六个感兴趣的数据点：`X`、`Y`\
  \ 和 `Z` 陀螺仪读数以及 `X`、`Y` 和 `Z` 加速度计读数。采集频率为 `62,5Hz`（每 `16ms` 读取一次），所示 [图 6.14]。我们正在使用\
  \ `Arduino Nano 33 BLE Sense LSM9DS1 IMU` 并进行实时计算。传感器融合允许我们忽略原始数据，仅保存 `Kalman filter`\
  \ 的最后状态。\n\n![](img/figure_6.14.png)\n\n图 6.14：高频横滚和俯仰角读数\n\n测试数据集由 6 个数据点组成：`X`、`Y`\
  \ 和 `Z` 加速度计以及 `X`、`Y` 和 `Z` 陀螺仪，所示：\n\n![](img/figure_6.15.png)\n\n图 6.15：训练数据集（陀螺仪修正）\n\
  \n## 处理\n陀螺仪的一个显著局限性是缺乏稳定的参考点，导致随时间产生的测量漂移。加速度计在检测任何形式的加速度方面非常精确，但由于对所有运动都敏感，可能会产生误性的旋转角。然而，加速度计受益于一个可靠的参考点：地球恒定的引引力。\n\
  \n我们将采用传感器融合技术来应对每种传感器的缺点。这种方法通过利用陀螺仪的准确性和加速度计的稳定参考点，生成一组精炼的横滚和俯仰角，有效减轻漂移并提高整体精度。\n\
  \n在 `Kalman filter` 使用陀螺仪和加速度计读数之前，我们必须进行若干转换。\n\n首先，我们必须通过将读数除以 `131` 将陀螺仪的原始数据转换为物理单位。陀螺仪的数字信号返回带符号的\
  \ 16 位整数，范围从 `-32768` 到 `+32767`。根据 IMU 规范，该范围代表 `-250` 到 `250` 度/秒。也就是说，如果用 `32767/250`，我们得到\
  \ `131.072`，即 `1` 度/秒的值。注意，陀螺仪返回的是角速度而非角度。稍后，我们将该速度转换为滤波器可以使用的角度。\n\n下一步是根据加速度计读数计算\
  \ `roll` 和 `pitch` 角，并将用这些角来修正陀螺仪角。我们可以使用勾股定理计算总加速度，然后使用 `atan()` 函数获取弧度制角度。我们将结果乘以\
  \ `180/Pi` 将其转换为度。\n\n卡尔曼滤波器估计测量误差和估计协方差。它根据 `Kalman Gain` 决定信任哪一个：陀螺仪数据还是加速度计。\n\
  \n## 系统实现\n实现使用了 `NRF52840`，其输出通过 `UART` 发送到无人机。\n\n![](img/figure_6.18.png)\n\n\
  图 6.18：连接图（陀螺仪修正）\n\n### 源代码\n伪代码强调了三个主要组件：\n1. 微控制器接收加速度计和陀螺仪的读数。\n2. 算法为传感器融合算法准备数据。\n\
  3. 传感器融合算法使用 `Kalman filter` 计算横滚和俯仰角。\n4. 横滚和俯仰角通过 `UART` 发送到无人机。\n\n\n\n\n\n本章通过解释卡尔曼滤波（Kalman\
  \ filter）的内部原理引入了传感器融合的概念。然而，还有许多其他专用滤波器可能更适用于特定场景。用例展示了现实生活中传感器融合应用的多样性，包括传感器融合链链、读数的增强以及实时纠正指标的能力。\n\
  \n在下一章中，我们将讨论深度学习回归。与传感器融合类似，回归模型能够使用一个或多个输入来生成一个或多个数值。\n\n## 参考文献\n\n*   O. Univ.-Prof.\
  \ Dr. Hermann Kopetz Institut fur Technische Informatik 182 [`mobile.aau.at/~welmenre/papers/elmenreich_Dissertation_sensorFusionInTimeTriggeredSystems.pdf`](https://mobile.aau.at/~welmenre/papers/elmenreich_Dissertation_sensorFusionInTimeTriggeredSystems.pdf)\n\
  *   H. F. Durrant-Whyte. Toward a Fully Decentralized Architecture for Multi-Sensor\
  \ Data Fusion. In at IEEE International Conference on Robotics and Automation, volume\
  \ 2, pages 1331–1336, Cincinnati, OH, USA, 1990.\n*   Humidex, [`www.ccohs.ca/oshanswers/phys_agents/humidex.html`](https://www.ccohs.ca/oshanswers/phys_agents/humidex.html)\n\
  *   Kalman filter, Alex Becker, [`www.kalmanfilter.net/kalman1d.html`](https://www.kalmanfilter.net/kalman1d.html)\n\
