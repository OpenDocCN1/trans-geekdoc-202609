  \ `PID function` 炼这些动作，并发送生成的控制命令。\n\n| `c:tinyml_7_1b` || 代码位置：Arduino Nano 33\
  \ BLE @ Block 2 |\n| --- | --- |\n| ![](img/table_7.3.png) || 接收来自所有传感器和执行器的数据，运行控制函数并执行回归。伪代码<br>1.\
