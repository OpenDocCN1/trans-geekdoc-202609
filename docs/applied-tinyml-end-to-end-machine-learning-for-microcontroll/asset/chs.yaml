- "# Applied TinyML：微控制器的端到端机器学习示例\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n**献给**\n\n我亲爱的女儿们：\n\
  \nDianna\n\n和 Luna\n\n# 作者简介\n\nRicardo Cid 是一位专门从事机电学的机械工程师，从事嵌入式系统工作已 20 多年。在学校期间，甚至在\
  \ `IoT` 一词出现之前，他就在帮助工程学院（`UNAM`）的一个团队将洗衣机连接到互联网（直到今天，他还没搞清楚将洗衣机连接上网是否有必要）。毕业后，他搬到了纽约，在担任一家非常成功的旅游行业公司工程主管的同时，利用空余时间为艺术家设计舞台机器人；在那家公司，他在\
  \ `cloud` 早期就开创了系统创建工作，在大数据和海量流量方面积累了丰富的经验。\n\n大约在 2015 年，他在哥伦比圆环的艺术与设计博物馆（Museum\
  \ of Arts and Design）进行了为期六月的驻留，其的项目让他获得了多项奖项，内容创作随音乐跳动的 3D 打印机制。凭借其独特的技能组合（包括机械工程、电子学、企业级软件、`APIs`、`云`\
  \ 和大数据），纽约最大且最著名的房地产组合之一向他提供了一个独特的机会，从零开始构建一个智能建筑操作系统，并将超过 15 座摩天大楼作为沙盒。\n\n在那段惊人的经历中，Ricardo\
  \ 实验了海量数据，并构思了一系列针对当时新兴技术 `machine learning` 的应用。Ricardo 和他的团队构思了数十个原型，其中一些从未面世过，但它们为一系列算法奠定了基础，这些算法最终为美国多处建筑（包括联邦政府建筑和全球最大的银行）节省了数百兆瓦的电力。\n\
  \n在该公司工作满六周年之际，Ricardo 意识到将许多此类智能带到边缘设备中是一个巨大的机会，可以避免关键的网络安全和可靠性单点故障。2023 年，Ricardo\
  \ 创建了一家设计工作室，专门致力于架构和构建在受限环境中运行 `ML` 模型的边缘解决方案。\n\n# 审稿者简介\n\nMartin Yanev 是一位成就卓就的软件工程师，在航空航天和医疗技术等多个行业拥有近十年的经验。在他辉煌的职业生涯中，Martin\
  \ 在空交通管制和色谱系统等关键领域的开发和集成尖端软件解决方案方面开辟了自己的天地地。他作为菲奇斯堡州立大学（Fitchburg State University）受尊敬的导师和计算机科学教授而闻名，对\
  \ `OpenAI APIs` 的全频谱有深入理解，并在构建、训练和微调 AI 系统方面展现了精湛技艺。作为广受认可的作者，Martin 分享了他的专业知识，帮助他人应对\
  \ AI 开发的复杂性。凭借他卓越的履历和多方面的技能组合，Martin 继续推动创新，驱动软件工程领域的变革性进展。\n\n# 致谢\n\n首先，我想感谢你，读者，选择了这本书。我希望在读完这本书后，你能受到启发去创作优秀的系统和设备，让更多人加入这场冒险。\n\
  \n我还想向整个家人表示感谢，他们在创作本书期间的支持。他们积极参与了许多用例的数据采集：当我拿着加速度计时他们开车接、在冰箱里放置传感器、在钢琴上弹奏以测试分类模型、拍摄他们的手势、在他们跳跃时模拟自由落体。我们共同完成了这一切。\n\
  \n如果没有 BPB 团队，这一切都不会发生，我对他们感激不尽。从相信书籍理念，到在修订期间保持耐心、接受我的修改、指导我完成整个过程；这一切都带着他们最好的态度和善意。\n\
  \n最后，我需要感谢整个 `TinyML` 生态系统及其出色的社区。所有的工具、所有的 `SDKs`、书籍、博客文章等都是黄金，感谢你们。特别感谢 `Nordic`、`Bluetooth`、`Arduino`\
  \ 和 `Edge Impulse`。\n\n# 前言\n\n这本书的创意源于我对 `machine learning` 与嵌入式系统交叉领域的痴。在过去的几年里，我见证了\
  \ `AI` 如何改变行业。许多强大的应用程序仍然锁定在云服务器和大型计算基础设施中。我这本书的目标是帮助缩小这一差距，向读者证明将智能带到边缘设备是可能的，并让希望在真实世界、低功耗环境中部署机器学习的工程师、爱好者和创新者们能够触及\
  \ `TinyML`。\n\n\n\n\n\n这本书的另一个重要方面是其广面性。每个概念的原理都解释得较为浅显；然而，它涵盖的领域非常广泛。我们并不仅仅关注 TinyML\
  \ 模型的的数据科学方面，还涵盖了系统设计（将需求映射到需要解决的假设业务问题上）、数据获取挑战（而不是仅仅假设互联网上有现成的数据集）、特征提取（这受数据质量直接影响，这是生产环境中的一个真实问题）、模型设计（在资源浪费不允许许可的受限环境中，理解模型在底层的工作原理至关重要）、电子组件配置（使用现有的电子组件，而不是仅仅在模拟器中运行）、网络连接（因为现实世界的解决方案通常分布在多个区域，而不是局限于单个位置）、功耗考虑（因为不能假设可以连接到电网）以及物料清单研究（因为成本是现实系统中的一项基本衡量指标）。\n\
  \n本章将带领读者了解全书使用的概念和术语。它还确定了书中每个用例的范围。\n\n本章侧重于根据特定用例识别定义声音的特征。我们对人声利用梅尔频率倒谱系数（MFCC），它在识别语调、节奏和沉默等语言属性方面表现出色。对于瞬态声音，采用傅里叶系数通过其在不同频率上的功率分布来描绘声音，这对于捕捉每种声音的独特能量轮廓至关重要。通过频谱分析周期性音调，以发现其独特的频率特征。我们利用卷积神经网络来利用声音的空间表示（跨越时间和幅值）进行模式识别，训练模型将输出层转换为概率分布，用于分类声音样本。\n\
  \n在探索运动分类时，我们从三个正交放置的加速度计收集数据，以准确描述物体的运动。通过将加速度计读数分解为十三个不同的特征并将波形分割成小的时间窗口，我们计算了均方根、峰度、谱峰度和偏度等指标。这些指标揭示了运动的关键方面，从指示运动能量的平均功率，到峰度和偏度，提供了关于运动频率和突发性的见解。丰富的数据集输入密集神经网络，实现了从轻微到剧烈运动的精确分类。\n\
  \n侧重于图像分类，我们通过连接到微控制器的数字相机获取图像。预处理步骤包括将图像调整为正方形格式，如果颜色不是关键的，则将其转换为 8 位灰度图，以简化物体识别模型的应用。图像被缩放到标准大小，以适应神经网络的容量。我们并不是从零开始训练，而是应用了行业标准的\
  \ TinyML 模型和一种称为迁移学习的技术，使用我们的数据集高效地训练模型，实现了一个适用于各种机器视觉场景的快速准确的系统。\n\n本章介绍了跟踪，这是一种经常与图像分类配合的技术，用于在连续的视频帧中一致地识别物体。无论是跟踪移动还是静态物体，该方法涉及首先使用卷积神经网络对物体进行分类，然后比较它们的顺序位置，根据接近程度推断它们是否为同一个物体。成功的跟踪为物体分配一致的\
  \ ID，即使在变化过程中也能保持身份。\n\n传感器融合被视为一种结合来自多个源数据的高级方法。我们将传感器融合分为互补型、竞争和合作型。互补融合汇集了同一事件的不同视角，而竞争融合则通过冗余寻求可靠性。合作融合合并了来自不相关事件的数据以合成新信息。\n\
  \n本章探索了使用深度神经网络从一个或多个数据源推断数值值。我们展示了将特征工程与深度学习相结合如何扩展回归应用的的领域。我们讨论了回归如何根据历史数据预测未来状况。\n\
  \n本章研究异常检测，旨在识别偏离预期模式的发生。与分类不同，异常检测侧重于检测模型以前未见过的行为或事件。\n\n\n\n\n如果被问及什么是可以分析环境、理解正在发生的事件并在没有外部帮助的情况下做出的，可能的回答是一个生物体，特别是动物。这是正确的，但你也可以准确地说是一个应用型\
  \ TinyML 系统。TinyML 应用在数据源或数据源附近收集数据、分析数据、提取见解并对环境做出反应。这种方法具有显著优势：它通过将数据本地化确保了隐私，实现了无云端延迟的实时决策，通过分布式决策消除了单点故障，降低了通信成本，并创建一个由数千个设备朝着目标工作的可扩展系统。此外，分布式计算降低了功耗，使得电池或太阳能供电在离网使用中变得可行。\n\
  \n在本章中，我们首先概述了数据采集，讨论了理想的数据类型和频率、外围设备、标记技术和降噪。接下来，我们将引导你完成处理、特征选择和提取。然后，我们将研究机器学习（ML）模型类型、合适的架构以及用于提高准确性的超参数调优。在获得模型的精炼结果后，我们将展示如何编写程序来使用或通信此结果，包括向执行器和显示器下发命令。\n\
  \n在分布式应用中，数据采集、处理和执行很少发生在同一设备上，这需要网络进行设备通信。你将学习使用发布/订阅范式来实现可扩展的去中心化通信。最后，理解功耗并选择合适的电源至关重要，正如准备物料清单以确保你的项目的财务和维护可行性也同样重要。\n\
  \n\n本章涵盖了以下主题：\n\n\n\n本章的目标是介绍贯穿全书的术语和概念。我们首先概述 TinyML 及其在人工智能（AI）中的作用，然后探索构成 TinyML\
  \ 应用的要素。我们概述了创建 TinyML 应用的步骤，从定义问题和开发概念，到决定数据采集、选择特征、创建模型，以及至关重要的在考虑硬件、网络和功耗使用的情况下进行部署。\n\
  \n\nTinyML 应用运行在计算能力有限且低功耗要求的设备上。然而，这些限制是技术性的，而非目标导向的。如果我们能将图形处理器（GPU）的能力集成到微控制器中，并仅靠一个电池运行十年，那么目标仍然是一个运行在边缘的自给自足实体。因此，业界通常将这些应用称为\
  \ EdgeML。\n\n在独立应用中，每个设计决策都会影响每个子系统。数据的大小和频率决定了传感器类型、交换协议、传输网络、处理微控制器、存储内存、显示接口和电源。\n\
  \nTinyML 是 AI 的一个子集，专门为将 AI 的能力应用于最小且最节能的硬件而设计。虽然 AI 包含了许多技术和应用，但 TinyML 专注于让这些技术中的一部分在资源最受限的场景下工作。\n\
  \n最小化 AI 模型尺寸的核心概念在于意识到：你可以在强大的机器上训练模型，但在功耗低得多的微控制器上部署它们。通常，TinyML 模型的训练在强大的云 GPU\
  \ 上进行，利用高达数百 GB 的海量数据集。通过采用各种优化策略来减少模型的维度并接受微小的（通常是感知不到的）准确率损失，模型的大小可以缩小到仅几兆字节。这种尺寸的缩小使得模型部署到微控制器上变得可行。然而，这种方法仅适用于具有特定输入输出的特定模型。尽管存在这些限制，研究社区仍然保持异常活跃，频繁发布新的白皮书，将先进的\
  \ AI 模型引入 TinyML 领域。这一进展始于用于麦克风激活的声音分类，扩展到图像分类，随后是异常检测，最终到达紧凑语言模型。\n\n\nTinyML 应用开发的格局正在发生，使其比以往任何时候都更容易获取和直观。历史上，将物理行为建模并实现在应用程序中需要对数学有深层理解以及丰富的软件工程技能。然而，机器学习为开发创造了一种新的、更自然的方法论，这种方法更容易理解，并镜像了人类的学习过程。就像个人通过试错而不是背诵语法规则来获得语言技能一样，机器学习模型从示例中学习。通过提供数据集并指示预期的结果，模型通过多次尝试进行迭代调整，随着时间的推移不断提高其准确性。\n\
  \n这种开发范式的演变显著降低了进入 TinyML 领域的准入门槛。通过为非技术人员提供易于使用的数据采集工具、模块化处理组件、模型训练接口和实际使用示例，机器学习技术正变得更广泛的受众可用。这种技术的民主化赋能了任何对学习和应用机器学习感兴趣的人，为跨多个领域的广泛采用和创新铺平了道路。这种转变的影响是深远的，它承诺让那些此前因传统方法复杂而被排除在技术开发过程之外的人，释放出创造性的解决方案和应用。\n\
  \n\nTinyML 应用是一种解决存在于业务、组织或地点实际问题的解决方案。本书将教导读者如何定义、设计、计划、预算和构建 TinyML 应用。\n\n一个\
  \ TinyML 应用包含数据科学、软件、机器学习、电子、网络、电源管理和用户界面（UI）等许多元素。尽管如此，将它的组件简化为抽象的构建块也是可能的。\n\n\
  保持正轨的最佳方法是遵循一种方法论，让我们看到大局，消除不必要的复杂性，并在处理系统的每一个方面，同时专注于创造提供价值的产物。\n\n在整本书中，我们使用 10\
  \ 步法来定义问题、开发可能成为解决方案的概念、选择合适的模型、选择正确的特征、使用正确的工具训练并测试模型，并将所有这些整合到一个可以部署到真实环境的嵌入式解决方案中。\n\
  \n该方法的步骤如下：\n\n2. 开发\n3. 数据采集\n4. 特征工程\n5. 模型创建\n6. 集成机器学习模型\n7. 硬件、电子和连接\n8. 网络\n\
  9. 电源管理\n10. 材料和成本\n\n这些步骤在后面的章节中进行了详细解释。\n\n\n这一步涉及勾界定当前状况、必要需求和成功标准，同时对各种可能的解决方案保持开放态度。在开始任何项目之前，你应该能够回答以下十个问题。包含答案的文档将指导后续步骤中的设计决策，并验证最终的实现。\n\
  \n\n\n\n\n首先，我们定义问题：\n\n* 当前状态是什么？\n* 期望状态是什么？\n* 哪些障碍阻碍了从当前状态到期望状态的转换？\n* 该解决方案将以何种方式利用？\n\
  \n接下来，我们识别解决问题所需的可用数据，并建立用于跟踪进度的指标：\n\n* 哪些数据可以用于解决这个问题？\n* 你希望系统产生什么输出来证明其有效性？\n\
  * 解决方案是否需要对环境进行任何更改？\n\n最后，我们指定解决方案的约束条件：\n\n* 解决方案必须在何处实施？\n* 解决方案是否有在独立电源上运行？\n\
  * 解决方案必须提供实时更新吗？\n* 该解决方案分配的时间预算和资金预算是多少？\n\n意识到这份文档是动态的并会随着时间演变至关重要。随着项目进展到各个阶段，你可能会发现最初的目标可能更具雄心并需要完善，或者你打算使用的数据难以获取，从而需要备替代方案。此外，项目地点的变化或环境条件的转变也可能发生。将这些发展视为迭代过程的一部分，在这一过程中，调整是可以接受且符合预期的。关键是要专注于解决当前的问题。\n\
  \n\n在这一步中，我们绘制一个草图，展示利用 `TinyML` 技术的潜在解决方案。这一阶段本质上是迭代的，通常需要多次迭代以符合预期的指标、功能和运行成本。\n\
  \n概念开发的核心思想是生成多个选项以减少选择次优解决方案的风险，这通过探索解决方案空间来实现。为了做到这一点，我们为同一个问题起草至少三种不同的解决方法。你需要至少三个，而不是一个，因为通常情况下，第一个概念承载了我们对某个解决方案的所有偏见和假设，它并不一定是最优的，但在大多数情况下，它是基于个人偏好的。第二个概念将允许你探索解决相同问题的新方法。第三个概念将是第一个和第二个概念之间的良好结合。\n\
  \n\n创建概念的最佳方法是用块来表示其功能。每个块应该只做一件事情。每个块可以被表示为一个具有输入和输出的黑盒。\n\n\n你可以将像这样的想法转化为图表：“三个门中的每一个门都应该有一个人数传感器，通过无线通信连接到显示总人数的\
  \ LED 面板”。\n\n绘制一个具有与组件数量相同的框（或块）的图，为每个框命名，并列出其主要特征（颜色、类型、电压等）。通过在连接块的箭头上写字来指示块之间移动的数据（温度信号、推理结果、图像等）。尝试估算每个组件的成本。在块旁边写下数字。\n\
  \n一旦你有了几个不同的概念图，请通过比较它们的共同点来对它们进行相互评估：\n\n* 创建一个列出组件总成本的表格。项目成本在合理预算之内吗？\n* 组件容易找到吗？\n\
  * 你知道如何实现每一个组件吗？\n* 解决方案是否需要对环境进行任何更改？\n* 解决方案提供实时更新？\n* 预算是多少？\n\n\n边缘计算是将数据带到源头的行为。\n\
  \n\n传感器是将物理信号转换为电信号的设备。在选择传感器时，你需要考虑的特性包括：\n\n* 范围：输入的最小和最大限制。你的应用程序需要的最小值和最大值是多少？传感器通常设计为覆盖一个范围（例如温度）。然而，如果你的传感器尝试读取范围之外的内容，输出将不会显示真实值，这会导致你的应用程序得出错误的结论。\n\
  \n* 准确性：读数与正确值的符合程度。经常获得错误值的风险有多少？传感器的准确性通常与其价格成正比。在大多数情况下，平均准确性对于你的应用程序已经足够。当误报比漏报代价更高时，准确性至关重要。换句话说，如果错过事件的代价高于产生误报，你就想投资一个准确的传感器。\n\
  \n* 灵敏度：系统或仪器检测读数微小变化的能力。你的应用程序在意细微波动吗？灵敏度衡量传感器从微弱刺激中识别和提取有用信息的能力，定义为它可以有效运行的最小信号水平。有两个主要限制限制了传感器的灵敏度；第一个是它的分辨率，定义为传感器设计感知的最微小变化。第二个限制是传感器组件允许引入信号的噪声。较高分辨率和良好噪声屏蔽的传感器通常更贵。在投资之前，问自己你的应用程序是否需要高灵敏度。\n\
  \n* 稳定性：传感器尽管受到外部变化或干扰，随时间推移保持一致输出的能力。你的应用程序将在不可预测的环境中运行吗？传感器应该能够测量且仅测量一件事情，忽略周围正在发生什么。传感器不受其他因素影响的程度就是它的稳定性。如果你想设计一次系统并将其安装到多个环境中，请考虑这一特性。\n\
  \n* 重复性：传感器在未改变的条件条件下，通过重复试验一致地产生相同结果的能力。\n\n\n\n\n您的应用程序是否尝试检测长时间范围内的变化？或者读数将用作参考点？如果传感器测量相同的事件，它应该始终返回相同的结果。**重复性**刻画了传感器随时间推移对读数引入的误差。了解这种误差对于通过滤波、定期重置传感器或在结果中考虑该误差来消除它至关重要。\n\
  \n\n您的应用程序需要多快地响应变化？当读数是必须快速响应事件的控制系统的一部分时，此参数至关重要。响应时间的延迟可能是由称为`滞后`（hysteresis）的现象引起的，这种现象由于组件对变化的临时性阻碍了传感器状态的变化。延迟的另一个原因是使用过滤器。许多传感器在返回数据之前会对其清洗。将信号通过过滤器是以延迟为代价的。过滤器越好，延迟就越短，结果也越好。\n\
  \n\n应用程序将在户外还是在恶劣环境中运行？这一特性涉及实际实现中安装的每个传感器。耐用性有许多维度。显而易见的是设备需要承受的机械应力，但还有电气热应力。传感器能存过电压浪涌吗？它会在炎热的日子里融化吗？\n\
  \n\n并非所有输入都是通过传感器获取的；在许多情况下，用户按下按钮、激活开关、移动滑块或旋转旋盘是系统用于触发过程、推断数据或向执行器发出控制命令的方法。用户输入与传感器之间的区别并没有明确定义。例如，光开关是一种用于冲马桶的近距离传感器。TinyML\
  \ 创造了更多例子，得益于分类和回归模型，UI 得到了扩展。例如，一个检测并识别人脸的分类跟踪传感器可以替代身份验证用户的键盘。\n\n基础用户输入设备有许多类型，如按钮、开关、滑块、旋盘和键盘。与传感器一样，它们具有相同的特性：范围、准确性、灵敏度、稳定性、重复性、响应时间和耐用性。\n\
  \nUI 组件的输出与传感器输出相似，可以是模拟的或数字的。同样，一旦信号到达微控制器，它就会被转换为 `8-bit` 或 `16-bit` 数字信号。\n\n\
  \n驱动程序是负责接收来自传感器的信号并使其供运行 TinyML 模型的软件易于使用的软件组件。\n\n驱动程序在促进计算系统与传感器之间的通信方面起着至关重要的作用。每个驱动程序都有针对特定需求定制的独特功能。某些驱动程序设计用于使用常用协议（`I2C`、`UART`、`ISP`）与传感器接口，确保数据的无缝传输。然而，当传感器在专有或非标准协议上运行时，则需要自定义的驱动程序来实现通信。\n\
  \n驱动程序的数据处理方式差异很大。某些驱动程序设计为被动接收连续数据流，而另一些则主动向传感器请求数据。此外，某些驱动程序可以将模拟信号转换为数字格式，使数据更易于数字处理。\n\
  \n某些驱动程序提供了基本数据传输之外的高级数据管理功能。它们可能会聚合数据以提供概述，缓冲数据以防止连接中断期间的丢失，或使用移动窗口计算并输出近期读数的平均值。其他驱动程序可以分包处理数据，确保结构化且高效的数据处理。\n\
  \n安全和数据完整性也是至关重要的考虑因素。某些驱动程序可以接收加密数据，保持传输信息的机密性和安全性。接收数据的确认是另一个功能，确保数据传输过程可靠且错误能被及时发现。\n\
  \n某些驱动程序提供额外的处理能力以增强数据质量和可用性。它们可以纠错、插值缺失数据以保持连续性、过滤噪声以提高信号清晰度并翻译或转换数据为更有用的格式。此外，某些驱动程序具有重采样功能，允许根据数据调整采样率。\n\
  \n驱动程序架构有很多部分和变体，但主要有三个步骤：\n\n1. 驱动程序与传感器通信并将字节带入内存。\n2. 驱动程序解释字节并将其转换为系统使用的格式。\n\
  3. 它处理额外的功能（如果有），如缓冲、加密、修正、滤波、重采样等。\n\n驱动程序位于微控制器内部，通常使用系统相同的语言编写。它们也被称为传感器的库。\n\
  \n\n特征工程是从原始数据中选择、修改或创建新特征以提高模型性能的过程。它涉及利用领域知识从数据中提取和转换最相关的信息，使其更适合建模。有效的特征工程通过提供原始数据中可能无法直接观察到的数据表示，可以显著提高模型的准确性。这一步至关重要，因为所用特征的质量和相关性直接影响模型学习和做出准确预测或决策的能力。\n\
  \n## 图像特征工程\n\n图像特征工程是将原始图像数据转换为 ML 模型可以理解并用于预测或分类的结构化格式的过程。这一过程至关重要，因为它有助于突出区分类别的图像元素，增强模型的学习效率和预测准确性。图像特征工程通常如下如下：\n\
  \n- **预处理**：初始步骤涉及清洗和归一化图像。清洗意味着移除损坏或不符合某些标准的图像。归一化通常涉及将像素值缩放到标准范围（通常是 0 到 1 之间），以减少图像差异并帮助模型更有效地学习。\n\
  - **尺寸缩小**：图像在输入 ML 模型之前通常会被调整为统一尺寸。这不仅确保了数据集的一致性，还减少了计算负载。尺寸的选择取决于模型的需求以及保留足够分类细节与最小化计算需求之间的平衡。\n\
  - **颜色空间转换**：根据应用程序，将图像从一种颜色空间转换为另一种（例如从 `RGB` 转换为灰度图或 `HSV`）可能会有益。对于某些任务，颜色可能并不重要，将图像转换为灰度可以简化模型而不产生显著影响。对于其他应用程序，不同的颜色空间可能比标准的\
  \ `RGB` 更有效地突出相关特征。\n\n\n\n\n\n`Image augmentation` 通过对图像应用一系列随机变换（如旋转、缩放、翻转和裁剪），人工增加了训练数据集的大小和多样性。这有助于模型具有更好的泛化能力，并降低过拟合的风险，特别是当可用数据集有限。\n\
  \n\n加速度计读取数的特征工程涉及处理加速度计的原始时间序列数据，以提取有意义的属性（特征），从而有效捕捉运动的底层模式。加速度计测量一个或多个方向上的加速度，产生的数据可能包含丰富的信息，但难以直接解释。在这种背景下，特征工程的目标是将这些数据转换为更容易\
  \ `ML` 模型识别模式（如步行、跑步或其他物理活动）的形式。\n\n该过程从对原始加速度计数据的预处理开始，可能包括滤波以消除噪声以及将数据归一化到一致的比例。考虑到加速度计数据的时间序列特性，通常会将连续流分段为较小的固定大小的窗口。这种分段至关重要，因为它允许模型分析离散的数据块，从而更容易识别和分类短期的运动模式。\n\
  \n对于每个数据窗口，通常会提取各种统计特征和时域特征。这些特征可以包括加速度信号的 `mean`、`median`、`standard deviation`\
  \ 和 `range` 等基础统计，它们提供了数据中心趋势和变性的总结。更复杂的特征，如均方根 (`RMS`)、信号幅度面积 (`SMA`) 和零交叉率 (`zero-crossing\
  \ rate`)，有助于捕捉运动的能量、强度和频率。此外，通过 `Fourier Transform` 等技术获得的频域特征可以提供关于运动主频的见解，这可以指示特定类型的活动。\n\
  \n\n`ML` 中 `sound` 输入的特征工程是一个关键过程，涉及将原始音频信号转换为一组描述性特征，以捕捉声音的核心特征。鉴于音频信号是复杂的，并且包含广泛的频率、持续强度，提取有意义的特征对于训练\
  \ `ML` 模型执行语音识别、音乐流分类或环境声音检测等任务至关重要。\n\n该过程从对音频数据的预处理开始，可能包括归一化以确保不同录音音量水平的一致性，并可能将音频转换为统一的格式和采样率。还可以应用降噪技术来清理录音并提高提取特征的质量。\n\
  \n声音特征工程的一个基础步骤是从音频波形中提取相关特征。时域特征，如 `zero-crossing rate`（信号从正变负及反之变化的速率）和 `energy`（信号值的平方和，并根据信号长度归一化），捕捉了声音的基本属性。然而，音频信号中的许多有用信息在频域或作为时频域的组合中表示得更好。\n\
  \n通过 `Fourier Transform` 等技术提取的频谱特征可以提供关于声音内部不同频率功率分布的见解。常见的频谱特征包括 `spectral centroid`（指示频谱质心）、`spectral\
  \ bandwidth`（频谱带宽）和 `spectral roll-off`（包含特定百分比总频谱能量的频率）。另一组强大的特征集是 `Mel-Frequency\
  \ Cepstral Coefficients` (`MFCCs`)，它们模拟了人类耳朵。\n\n\n来自传感器捕获的时间序列数据的特征工程涉及将随时间收集的顺序数据转换为\
  \ `ML` 模型可以有效使用的结构化格式。鉴于传感器在工业监控、医疗保健和可穿戴技术等领域的普及，准确解释传感器数据的能力至关重要。\n\n该过程通常从预处理步骤开始，以确保数据质量和一致性。这可能包括清理数据以消除噪声、归一化以标准化值范围、通过插值处理缺失值，并可能将连续流分段为可操作的离散窗口。这些窗口随后可以被单独分析。\n\
  \n对于每个窗口或分段，可以提取各种特征：\n\n- 统计特征：基础统计度量，如 `mean`、`median`、`standard deviation`、`variance`、`minimum`\
  \ 和 `maximum`，提供了数据中心趋势和离散性的总结。这些特征很容易计算。\n-  Temporal 特征：包括 `lag features`（之前时间步的值）和\
  \ `moving averages`（移动平均），有助于捕捉数据中的时间依赖关系和趋势，对于预测和分析至关重要。\n- 频域特征：应用 `Fourier Transform`\
  \ 或 `Wavelet Transform` 将时间序列转换为频域，允许提取与主频和周期模式相关的特征。\n- 自相关特征：`autocorrelation\
  \ function` 测量序列中数据点在不同滞后时间的相互相关性，可以揭示重复模式或季节性的存在。\n- 领域特定特征：利用领域知识创建特定于应用程序或传感器类型的特征可以显著提高模型性能。例如，在可穿戴技术中，捕捉人类活动强度和频率的特征（如每分钟步或心率变异性）非常有信息价值。\n\
  - 衍生和积分特征：计算时间序列的 `derivative`（变化率）或 `integral`（累和）可以突出传感器读取数随时间的变化或数量的累积。\n\n特征选择随特征提取之后，其中识别并保留信息量丰富且相关的特征用于模型训练，同时移除冗余或无关的特征。这一过程对于提高模型准确性和减少过拟合至关重要。\n\
  \n\n在获取数据并定义特征后，下一步是决定哪个模型更适合执行任务并帮助我们实现目标。\n\n\n\n\n机器学习系统是一个从数据中学习模式的数学构模型。它通过训练调整自身的结构和参数，以最小化预测值与实际结果之间的误差。一旦训练完成，ML\
  \ 模型就可以根据新的、未见的数据做出预测或决策。这些模型是机器学习的核心，根据任务和可用数据量，其范围可以从简单的线性回归到复杂的深度神经网络。它们被广泛应用于各种领域，包括图像识别、自然语言处理和预测性分析，并随着接触到更多数据不断适应并提高性能。准备模型涉及的任务包括选择算法、划分数据、训练模型、评估模型、监控和更新模型。\n\
  \n\n根据问题类型、数据的性质和预期的结果选择合适的机器学习算法。分类可以帮助你识别类别，回归允许你推断数量，而异常检测则寻找数据中不寻常的模式。让我们详细查看这些内容：\n\
  \n*   **声音分类**：这是一个训练机器学习模型以识别并将声音归类为预定义类别或标签的过程。通过分析音频数据，这些模型学习了识别能够区分不同声音的模式和特征，例如人声、音乐、环境噪音或动物叫声。这涉及到从音频信号中提取相关特征（如频率分量、幅度和时间特征），并将其输入神经网络。\n\
  \    *   *应用*：语音识别、异常声音监控、噪声监测等。\n*   **动作分类**：这涉及训练机器学习模型，根据传感器数据识别并归类物理运动或活动的类型。该过程通常使用来自嵌入设备中的加速度计、陀螺仪或其他运动传感器的数据。模型从传感器数据中的模式中学习，例如运动、速度、方向和加速度。\n\
  \    *   *应用*：健康与健身追踪、驾驶风格、自由落体物体检测等。\n*   **图像分类**：这是一种技术，通过训练机器学习模型来识别并将图像归类为预定义的类别或范畴。该过程涉及分析视觉数据，从图像中提取相关特征（如纹理、颜色、形状和空间关系），并使用这些特征教授模型如何区分不同类型的图像。由于深度学习模型在处理复杂图像数据方面的高效性，特别是\
  \ `CNNs` 常用于此项任务。\n    *   *应用*：人脸识别系统、医学影像诊断、目标检测、内容分类等。\n*   **回归**：基于机器学习的回归是一种预测建模技术，用于估计因变量与一个或多个自变量之间的关系。目标是理解因变量如何随着自变量的变化而变化。与预测离散标签的分类不同，回归预测的是连续的结果。各种类型的神经网络被用于建模和预测这些连续结果，使回归成为分析和预测数值型数据的多功能工具。\n\
  \    *   *应用*：传感器值预测、实时控制、重量估算等。\n*   **异常检测**：这是一种识别数据中不符合预期行为的异常模式或离群点技术。这是通过在代表正常操作或状态的数据上训练机器学习模型来实现，允许其学习底层的模式和分布。一旦训练完成，模型就可以检测出新数据中偏离这些模式的情况，从而预示潜在的异常。\n\
  \    *   *应用*：离群点检测、漏水检测、入侵检测。\n\n\n划分数据集的原理是机器学习中的一项基础实践，旨在准确评估模型性能并防止过拟合。数据集被划分为训练集、验证集和测试子集，用途如下：\n\
  \n*   **训练集**：该数据集用于训练模型，使其学习数据中的底层模式和关系。根据来自该数据集的反馈，调整模型参数以最小化误差。\n*   **验证集**：模型在训练后会在验证集上进行测试。该数据集不用于训练，而是用于评估模型对新数据的泛化能力。这在不触碰测试集的情况下调整模型超参数和做出关于模型架构的决策至关重要。使用验证集有助于及早发现过拟合，因为在该集上的性能可以指示模型何时开始学习训练数据中的噪声而非信号。\n\
  *   **测试集**：这是在模型训练和验证后用于评估其性能的最终、未接触的数据集。在独立数据集上测试模型可以为其对未见数据的泛化能力提供无偏评估。为了确保评估的准确性，该数据必须在过程结束时使用一次。\n\
  \n\n\n\n\n\n机器学习模型的评估过程是紧随训练阶段之后的关键步骤，旨在衡量模型在未见数据上的表现性能。这一步骤对于评估模型的泛化能力至关重要，泛化能力是指模型将其所学知识应用于新的、相似问题的能力。评估涉及使用与机器学习任务类型（分类、回归、聚类）相应的特定指标。例如，分类任务可能使用准确率、精确率、召回率、F1\
  \ 分数以及 ROC 曲线下的面积（`AUC-ROC`）。相比之下，回归任务可以使用均方误差（`MSE`）、均方根误差（`RMSE`）或平均绝对误差（`MAE`）。\n\
  \n该过程通常涉及一个被称为测试集的数据集，模型在训练阶段未见过该数据集。这确保了评估反映了模型在真实世界条件下的性能。在许多情况下，还会采用交叉验证技术，以确保评估不会因数据划分训练集和测试集的方式产生偏差。交叉验证涉及将数据集分为若干子集，然后多次训练和评估模型，每次使用不同的子集作为测试集，剩余数据用于训练。最终性能是所有这些迭代的平均值，从而对模型性能提供更稳健的估计。\n\
  \n\n机器学习模型的调优和优化过程对于通过系统调整参数和配置来增强其性能至关重要。在对初始模型进行训练和评估后，调优涉及对控制学习过程和模型架构的超参数进行实验。超参数包括学习率、模型复杂度（例如神经网络的层数）、正则化强度等，具体取决于所使用的算法类型。\n\
  \n优化使用了网格搜索、随机搜索或更高级的方法（如贝叶斯优化）等技术。网格搜索在指定范围内对超参数的全面组合进行模型性能评估，而随机搜索则随机选择组合，提供更快速但较不详尽的探索。另一方面，贝叶斯优化利用之前评估的结果来智能地选择下一组要评估的超参数，通常能更高效地找到最优配置。\n\
  \n该过程本质上是迭代的，需要经过多轮训练和评估，以根据所选指标（例如分类任务的准确率、精确率、召回率，或回归任务的 `MSE`、`RMSE`）确定产生性能的超参数集。\n\
  \n此外，模型优化可能涉及特征工程和选择，以提高模型输入质量或探索不同的模型架构。调优和优化的目标是获得一个性能良好的模型，使其良好地拟合训练数据并有效地泛化到新的未见数据。\n\
  \n\n将机器学习模型部署到连接有限的边缘设备面临着独特的挑战，需要精细的规划和优化，以确保模型在设备限制内有效运行。该过程从优化机器学习模型开始，以适应设备有限的处理能力、内存和存储能力。模型剪枝、量化和知识蒸馏等技术可以在保持预测性能的同时，减少模型尺寸和计算需求。这一优化阶段可能涉及使用为边缘部署设计的专用工具和框架，如\
  \ `TensorFlow Lite` 或 `PyTorch Mobile`，它们可以将模型转换为更高效的格式以便在低功耗设备上执行。\n\n模型优化完成后，将进行打包部署，通常带有极的运行时环境，以便在边缘设备上进行模型推理。部署过程必须考虑设备的操作系统、硬件规格以及运行模型所需的软件栈。考虑到连接受限，模型被设计为本地执行推理，直接在设备上处理数据并在无需不断与服务器通信的情况下做出决策。这不仅节省了带宽，还确保了设备在没有网络连接的情况下独立运行。当连接可用时，将实施数据同步策略，允许设备更新模型参数、发送聚合见解或根据需要下载新模型和更新。\n\
  \n\n监控和维护机制也是部署过程中的重要组成部分。这些系统可以设计为以最少的数据传输运行，专注于指示模型性能和设备健康的关键指标。由数据变化或算法改进驱动的模型更新将经过仔细管理，以尽力减少带宽占用和干扰。通常采用增量更新，仅传输自上一个版本以来的变化。\n\
  \n\n应用程序代码是指为了在软件应用程序中执行特定任务、函数或操作而编写的计算机程序或软件指令。这段代码形成了任何应用程序的骨干，决定了其行为、功能以及与用户、应用程序和其他硬件资源的交互。\n\
  \n将机器学习模型集成到应用程序代码中，可以将静态应用程序转换为动态的 AI 增强系统，该系统能够从数据中学习、做出决策并随着时间的推适应新信息。集成涉及在应用程序内部编写与机器学习模型交互的代码。这包括将模型加载到应用程序环境中、以模型期望的格式准备或预处理输入数据（例如缩放图像、对类别数据），以及调用模型进行预测。在接收预测后，应用程序可能需要在展示或根据结果采取行动之前对结果进行后处理（例如解码输出、应用阈值）。\n\
  \n\nTinyML 应用是一种运行在微控制器等低功耗、资源受限设备上的机器学习系统。\n\n\n- 连接到传感器和其他输入外设。\n- 运行独立的机器学习模型。\n\
  - 执行应用程序代码。\n- 控制开关、电机和其他执行器。\n-与其他设备通信。\n- 在电池、太阳能或低电压电源上运行。\n\n在最简单的形式下，TinyML\
  \ 应用由单个设备组成，该设备获取数据、运行模型，并根据结果信息执行操作。\n\n在数据源分布在很大区域（如仓库或酒店）的情况下，将 TinyML 应用保持在一个设备中（例如在每个区域使用一个传感器独立分析读数）是具有挑战性的。此外，这不仅难以实现，而且不建议。设备资源受限的特性无法维持多个源的分析，更不用在单个设备上运行几个机器学习模型并控制多个执行器了。解决这一扩展性问题的方案是将计算分散在多个设备上。\n\
  \n\n\n\n使用多个设备要求我们以不同的方式思考数据。传统的范式要求捕获并将原始传感器数据转发到云端进行进一步检查，这种范式在基于边缘的系统中无法、也不应该被复制。根本性的转变基于这样一个原则：数据和信息不是一回事。传感器捕获的数据应该在本地进行处理，只有信息可以在不同设备之间共享。\n\
  \n\n数据和信息是相关的概念，但在处理和分析的语文中，它们的意义和功能有显著差异。\n\n数据是指没有任何背景的、未处理的原始事实和数字。它可以以各种形式存在，如数字、文本、图像或声音，通常通过测量、观察或响应来收集。数据本身可能无法传达直接的意义；例如，代表一段时间内温度的数字列表仅仅是没有任何背景的数据。\n\
  \n相反，信息是经过处理、组织或结构化的数据，旨在添加背景并使其具有意义和实用性。在分析数据、解释数据并将其放入语境之后，你得到的就是信息。使用之前的例子，如果将收集到的温度数据进行组织，以显示随时间变化的趋势（例如异常），它就变成了可以指导决策的信息。\n\
  \n\n信息仅需几个字节，且传输间隔可以比原始数据更长。因此，对于资源受限的设备，在内存和电池使用方面，传输信息比发送原始数据要易管理得多。\n\n以低频率发送和接收几个字节是运行受限（低内存、小计算能力，且在许多情况下由电池供电）的\
  \ TinyML 设备网络的关键。\n\n低功耗网络技术存在许多场景。`LoRa` 实现了远距离的低功耗通信，`LTE-M` 利用蜂窝基础设施实现了低功耗通信，`Bluetooth\
  \ Mesh` 实现了局域内的低功耗通信，这仅是例子。从设计上来说，这些技术的带宽都极低。需要发送的字节越少，所需的能量、内存和计算就越少。这使得低功耗网络成为\
  \ TinyML 应用完美匹配。\n\n使用网络需要额外的硬件。微控制器可以同时运行 TinyML 模型并管理其无线网络通信；然而，不建议这样做。使用辅助微控制器是网络通信的优选。书中的大多数示例使用\
  \ `Arduino` 作为主微控制器运行 `TinyML` 模型，并使用 `NRF52840 Dongle` 作为辅助微控制器，通过 `Bluetooth Low\
  \ Energy Mesh Network` 接收和发送无线消息。\n\n\n下图展示了 TinyML 应用中的设备和组件如何通过低功耗网络相互连接：\n\n\n\
  \n在本书中，设备被描绘为带有连接引脚的块，引脚与其物理尺寸对应。连接用线条描述，起始于传输信息的设备引脚，结束于接收信息的设备引脚。请参考以下约定：\n\n\
  - **块 (Blocks)**：每个设备通过其图框块显示以下特征。\n    - **名称 (Name)**：设备的唯一名称（例如 `Temperature\
  \ Room 5`）。\n    - **类型 (Type)**：设备类型（例如 `Temperature Sensor`）。\n    - **技术特性**：相关的设备规格（例如\
  \ `10mA @5V`）。\n- **连接 (Connections)**：每个连接在其线条沿线显示其特征。\n    - **数据 (Data)**：其正在传输的数据引用（例如\
  \ `Raw Temperature Data`）。\n    - **协议 (Protocol)**：通信中使用的协议（例如 `I2C`、`UART` 等）。\n\
  \    - **方向 (Direction)**：显示哪个组件正在接收应用数据的箭头。\n    - **网络 (Network)**：如果连接涉及无线网络，线条为虚线，并明确标出其特征（例如\
  \ `Channel`、`Frequency`、`Subscription` 等）。\n- **固件 (Firmware)**：如果要在设备上加载固件或模型：\n\
  \    - **固件 (Firmware)**：加载到设备上的固件名称（例如 `Anomaly-2`）。\n    - **TinyML 模型 (TinyML\
  \ model)**：加载到设备上的模型名称（例如 `_1`）。\n\n\n在考虑设计和构建 TinyML 应用时，联网是一个议题。正如最后章节所示，只有在需要跨空间进行设备分布或复杂连接时，联网才是必要的。\n\
  \n低功耗网络适用于需要低功耗和广泛覆盖的设备。相比之下，传统的局域网倾向于高速数据传输、稳定性和更高的功耗。\n\n\n低功耗 Mesh 网络是一种旨在低功率内连接设备的无线通信网络。局域网（LAN）是连接有限地理区域（如家庭、学校或办公楼）内的计算机和设备以共享资源信息的网络。\n\
  \nMesh 网络的特征如下：\n\n- **设计原理**：低功耗 Mesh 网络是基于短距离通信技术设计的。它采用 Mesh 架构，允许设备之间直接或通过其他设备进行通信，形成节点网格。\n\
  - **用途和场景**：低功耗 Mesh 网络主要针对低功耗、低带宽的应用。它是物联网（IoT）场景、智能业务自动化以及在没有路由器的情况下需要广泛覆盖应用的理想选择。\n\
  - **能量效率**：低功耗 Mesh 网络具有极高的效率，适用于电池供电的设备。\n- **范围和速度**：虽然低功耗 Mesh 网络通过设备间的跳跃传输扩展了范围，但与传统局域网相比，其速度较低，因为它针对小数据数据包进行了优化。\n\
  - **可扩展性**：低功耗 Mesh 网络可以支持数个节点，便于大规模设备网络。\n\n局域网（LAN）的特征如下：\n\n- **设计原理**：传统的局域网通常基于\
  \ `Ethernet`（有线）或 `Wi-Fi`（无线）技术，旨在短距离内的高速传输。\n- **用途和场景**：局域网适用于办公、家庭和工业网络，这些环境需要计算机、服务器和其他网络设备的高数据吞吐量和可靠连接。\n\
  - **能量效率**：对于传统局域网（尤其是有线的），能量效率不是主要考虑，因为它们通常持续电源。\n- **范围和速度**：传统局域网提供更高的数据传输速度和稳定的连接，但在没有中继器或桥接器等额外硬件的情况下，范围通常限于建筑物或特定的地理区域。\n\
  - **可扩展性**：虽然局域网可以支持许多设备，但其可扩展性通常受中央路由器或交换机的容量以及管理扩展网络的复杂性。\n\n\n\n\n\n\n该策略的核心不在于选择某种单一的技术，而是利用每种网络的优势。低功耗网格网络通常用于边缘侧的外部，以便与分布在\
  \ TinyML 应用覆盖区域内的传感器和执行器进行通信。其中一个低功耗网格节点可以作为网关，使命令和状态更新跳转到更广泛的广域网。根据项目的不同，广域网可以是\
  \ `Wi-Fi` 连接或有线 `LAN`；如果这些网络不可用或难以访问，可以使用 `LTE-M` 网络连接互联网。如果因为成本或可用性无法选择蜂窝网络，则使用\
  \ `LoRA` 网关进行远距离的数据传输。\n\n请注意，我们并没有创建一个用于发送大量数据的流水线。而是小数据包在网络间跳转并最终到达目的地。少量的延迟是可以接受的，因为我们接收的只是状态更新；操作在微控制器中实时完成。数据正在被采集，分类正在进行，异常正在被检测，控制命令被现场发送到执行器。不需要在每次需要决策时调用云端或远程系统。\n\
  \n\n书中使用的低功耗网格网络技术是蓝牙低功耗网格网络（`BLE Mesh`）。还有其他一些优秀的选择，例如 `ZigBee` 或 `Thread`。请自由探索它们，并根据你的项目选择你认为最合适的一个。\n\
  \n`BLE mesh` 网络采用发布-订阅（Pub/Sub）模型来促进网络内设备之间的通信。该模型是 `BLE mesh` 设计的基础部分，能够实现高效、可扩展且灵活的消息分发，而不需要设备之间的直接连接。\n\
  \n在 `Pub/Sub` 模型中，网络设备被配置为发布者、订阅者或两者兼顾。发布者向特定主题（topic）发送消息，而无需知道设备会接收这些消息。订阅者监听感兴趣的主题上发布的消息。在\
  \ `BLE Mesh` 的语境下，主题通常由“组地址”表示，订阅者可以注册该地址以接收来自该处的消息。\n\n当设备（发布者）有数据要共享时（例如传感器读数或状态更新），它会在预定义的主题上发布这些信息。所有订阅了该主题的设备（订阅者）都会自动接收发布的消息。这种机制允许网络内设备解耦，意味着设备不需要维护关于其他设备网络地址的信息。相反，它们根据共同的兴趣（主题）进行通信，从而形成高度灵活且动态可配置的系统。\n\
  \n`BLE mesh` 中的 `Pub/Sub` 模型对于物联网和智能环境特别有利，在这些环境中，设备可能会频繁加入或离开网络，系统配置可能随时间而变化。它简化了跨越大量设备（从照明系统、温度传感器到报警器和自动化机械）发送命令或传播信息的过程，能够相对轻松地编写复杂的交互和行为。\n\
  \n书中的每个用例都包含一个表格，规定了每个设备使用 `BLE mesh network` 的发布和订阅配置。源代码包含一个 `ReadMe` 文档，其中提供了有关配置节点的详细说明。\n\
  \n\nTinyML 实现中的电源管理是一个至关重要的方面，确保了 ML 模型能够在微控制器和嵌入式系统等低功耗、资源受的设备上有效运行。鉴于 TinyML 应用通常部署在电池供电或能量采集的环境中（如\
  \ IoT 设备、可穿戴设备和远程传感器），优化功耗对于延长这些设备的使用寿命并维持功能至关重要。\n\nTinyML 中的电源管理涉及若干种策略和技术：\n\n\
  - **高效的模型设计**：设计所需计算和内存更少的轻量级 ML 模型。模型剪枝、量化和知识蒸馏等技术有助于在不显著影响准确性的情况下降低模型复杂度。\n- **职责循环（Duty\
  \ cycling）**：通过在激活模式和睡眠模式之间切换来实现职责循环这是一种常用策略。设备仅在激活阶段执行计算（如数据采集、推理和通信），在其余时间内进入低功耗睡眠模式。\n\
  - **能量感知算法**：开发对能耗感知并能根据可用电量调整行为的算法。例如，算法在电量较低时减少推理或数据传输的频率。\n- **硬件优化**：利用低功耗硬件特性，例如用于\
  \ ML 任务的专用低功耗处理器、高效的传感器管理以及节能通信协议。\n- **选择性感知与处理**：实施根据预定义标准或事件检测来选择性采集和处理数据，从而避免不必要的计算和传输。\n\
  - **自适应计算**：根据任务复杂性和设备当前的能量状态动态调整计算负载。这可能涉及在不同模型之间进行选择，或调整模型参数以平衡功耗与性能。\n\nTinyML\
  \ 实现中的有效电源管理需要一种全方位的方法。这种方法结合了硬件和软件优化，在提供计算和推理能力的同时最小化能耗。通过这种方式，TinyML 应用可以实现长期自主运行，即使在电力最受限的环境中也能释放智能连接设备的潜力。\n\
  \n\n在 TinyML 实现中，物料清单（`BOM`）是一份详细清单，列出了构建和部署 TinyML 设备或系统所需的所有组件。`BOM` 在概述支持每个设备\
  \ ML 功能所需的硬件以及可能的软件组件起着至关重要的作用。\n\nTinyML 实现的 `BOM` 通常包括微控制器、传感器、执行器、电源（如电池或太阳能电池板）、连接模块（用于数据传输的\
  \ `蓝牙` 或 `WiFi` 组件）以及设备物理组装运行所需的任何其他组件。它可能还会详细说明组件的版本或型号以确保兼容性和性能。\n\n此外，TinyML\
  \ `BOM` 还可以扩展硬件之外，包括设备运行所需的软件许可或服务、开发工具以及 ML 模型部署。这份综合文档对于项目规划、成本估算、采购和组装过程至关重要，确保所有零件都经过准确指定和计入。它通过提供所有必要材料和资源的清晰有序概述，促进了\
  \ TinyML 项目的高效实现。\n\n\n\n\n\n\n本章介绍了 `TinyML` 的概念及其作为人工智能子集的重要性。它解释了 `TinyML` 的应用，并详细介绍了开发应用程序涉及的步骤。这些步骤包括定义问题、开发概念、获取数据、选择特征、设计模型、将其与实际应用程序集成、选择合适的硬件、确定网络通信需求、理解功率需求，以及计算项目相关的材料和成本。\n\
  \n在接下来的章节中，读者将学习如何分类声音、图像和运动；结合传感器以创建新的读数；使用神经网络进行回归；以及检测异常，这一切都将使用 `TinyML`。\n\n\
  \n## 引言 (contents.xhtml#sc2_38a)\n\n在本章中，你将学习如何自动分类和识别不同类型的声音或音频信号。你的系统将能够区分各种噪声、音乐流派、人类语音、动物声音、环境音等。声音分类分为三个主要阶段：采集、从声波中提取特征、以及将声波特征输入分类模型运行。该过程的输出是一个数字数组，表示该声音与模型训练过的类别之一相似的概率。\n\
  \n然而，在我们对实时麦克风输入进行推理之前，我们需要获取数据来训练模型，选择从捕到的声音类型中提取特征的最佳方法，选择用于分类数据的模型类型和架构，最后，迭代训练模型，直到达到我们所需的性能和准确率。\n\
  \n\n本章涵盖了以下主题：\n\n- 获取用于训练模型的数据\n- 平衡、多样且充分的数据集\n- 模型\n- 用例：基于频谱图（Spectrogram）的处理\n\
  - 用例：基于 MEF 的处理\n- 用例：基于 MFCC 的处理\n\n\n在本章结束时，读者将了解如何为音频分类获取一个平衡且充分的数据集。读者还将学习如何从原始声波中提取特征。此外，本章讨论了专门用于声音分类的\
  \ `Neural Network`（神经网络）架构。读者将熟悉在真实环境中部署基于 `TinyML` 的声音分类系统所需的所有步骤和组件。\n\n\n在采集数据之前，你需要决定你的目标是什么。具体来说，你需要决定你想让模型识别的不同类别。分类属于机器学习模型的一种，称为\
  \ `supervised learning`（监督学习）。`supervised learning`意味着你的模型只能识别已知类别。例如，你不能要求模型去识别一种你没有声音样本的动物声音。\n\
  \n获取训练模型的数据有很多方法。你可以使用现有的数据集，也可以录制自己的。如果你知道去哪里寻找，前者更方便；互联网是声音的极佳来源。寻找人们上传各种想象视频的视频平台。使用并非你产生的预录声音的主要问题是，它们可能无法反映你的系统必须面对的真实声音和噪声状况。换句话说，你的模型无法反映系统实际交互的真实声音和噪声状况。\n\
  \n由于这本书是关于 `TinyML` 的，目标是在真实环境中采集声音。有很多很棒的工具让数据采集变得轻而易举。对于本书，我们使用了 `Edge Impulse`\
  \ 客户端。参考下图：\n\n```\n```\n\n\n训练数据集的主要目标是帮助模型进行 `generalize`（泛化）。`generalization`\
  \ 是模型能够可靠且准确地推断某一类别的特性。良好的训练集应该是 `balanced`（平衡的）、`diverse`（多样化的）且 `sufficient`（充分的）。假设你正在尝试分类狗和猫的声音。如果你大部分用狗的声音来训练模型，模型将了解更多关于声音产生的细微差别。当出现一个可能是两者其中之一的声音时，它将倾向于宣布该声音来自狗，因为它可能也知道猫也会这样叫。`diverse`\
  \ 数据集展示了同一类别的许多不同但保持了定义其为同一组特征的实例。以狗和猫的为例，`diverse` 数据集将包含来自许多类型狗和猫的声音样本。`sufficient`\
  \ 数据集足够大，足以允许模型达到 `generalization`。经验法是数据越多越好。然而，存在一个收益递减的拐点，更多的数据将不会产生更大的影响。如果你发现自己处于这种情况，并且在添加大量数据后仍未达到所需的准确率，那么你应该重新考虑你的方法。\n\
  \n## 从声学信号中提取特征 (contents.xhtml#sc3_43a)\n\n你可以将声学信号的特征视为一组数字，这些数字刻画了特定的声音并允许模型记忆和发现其中的模式。当系统在真实场景中运行时，微控制器会实时将声波转换为数字。这些数字被输入到模型。\n\
  \n## 处理 (contents.xhtml#sc4_44a)\n\n\n```\n```\n\n\n\n\n## 模拟量数字转换\n\n这一过程是将模拟声波转换为数字信号的行为。其实现方式是：每隔一万万分之一秒（即\
  \ `16KHz`），微控制器将读取其其中一个引脚（连接到麦克风的引脚）的电压。然后，它会将该电压转换为存储在内存寄存器中的数字数字。如果寄存器是 8 位的，声波只能有\
  \ 256 个电平，其中 0 表示无声音，256 表示最大音量。16 位效果更好，因为每次读取都可以用 65,536 个电平来表示。\n\n你可能会奇怪，为什么用更多的电平来表示声波很重要。想一下你从网上下载的一张低分辨率图像。即使放大，也看不到很多细节，这种感觉是令人沮丧的。声音也是如此。如果你以低分辨率采集声波，你的模型将无法识别声音中的许多细节，并可能在区分两种相似的声音时遇到困难。尽管如此，请记住我们处于\
  \ TinyML 的世界，这里的资源是极其受限的。你的应用场景使用 8 位声波可能是可以的。\n\n\n\n## 预强调\n由于声波的特性，低音往往带有更多的能量，而高音往往携带的能量较少。两者同样重要。为了避免模型偏向能量水平更高的音调（模型能听得更清晰），我们修改了高音使其具有相似的能量。这就是为什么这个过程被称为“强调”的原因。我们强调了高音。\n\
  \n\n我们每秒大约有 1 万个样本。我们将其中 400 个读取值分组，创建一个 25 毫秒的窗口，然后将其存储起来供进一步处理。然后，我们移动 10 毫秒并再次执行相同的操作。这将每秒声波产生约\
  \ 100 个窗口。参考下图：\n![](img/figure_2.4.png)\n\n\n\n它将基于时间的信号转换为给定窗口的频率分布。离散傅里叶变换 (`DFT`)\
  \ 的结果为我们分析的声音提供了独特的指纹。`DFT` 的输出也称为谱图（spectrogram）。如果你在 X 轴上对齐多个多个谱图，并在 Y 轴上对齐频率，你就会得到一个表示声波样本的图。如果你正在分类固定音调的声音或具有连续频率的声音（例如机器声、乐器声或环境噪声），一个谱图就足够训练模型了。\n\
  \n| 注意：在这种情况下，特征代表了不同频率下随时间变化的声音幅值。 |\n| --- |\n\n然而，如果你想进行模拟人类感知的分类（如动物叫或人声），你可能希望侧重于消除信号中与人类耳朵不相关的数据。下图显示了谱图的示例：\n\
  \n\n\n\n它过滤掉人耳无法感知的信息。下图显示了滤波器组的工作原理：\n\n\n\nMel 滤波器组过滤掉人耳无法感知的信息。下图显示了滤波器组的工作原理：\n\
  \n\n\nMel 滤波器组过滤掉人耳无法感知的信息。下图显示了滤波器组的工作原理：\n\n\n\nMel 滤波器组过滤掉人耳无法感知的信息。下图显示了滤波器组的工作原理：\n\
  \n\n图 2.9：Mel 滤波器组\n\n\n它消除了 `MFB` 的对数特性。\n\n\n它将信号带回时域。\n\n\n这一步专注于特征如何随时间变化。\n\
  \n\n\n\n\n处理声波会产生三组不同的特征，这些特征可以输入深度神经网络。第一种也是最基本的 `spectrogram`（频谱图）是所有特征中最简单也最多样化的，因为它以原有的方式表达声音。它保留了原始声波中大部分的信息。\n\
  \n除非你正试图对人类耳朵感知的语音或声音进行分类，否则请使用 `spectrogram`。其次，我们有 `audio MFE`。如上一节所述，这组特征是一类以人类感知为向的频谱图。声波中所有会被人耳朵忽略的直都被消除了，剩余的内容都得到了强调。如果你希望分类器像你一样区分声音，请使用\
  \ `audio MFE`。第三组特征是 `MFCC`（梅尔频率系数），它专门用于人类语言。它的特征不仅表示从频率角度对单词的分析，还表示了它们在不同时间帧中的上下文、语调、词分界、静音和发音。对于任何与语言相关的分类（如唤醒词），请使用\
  \ `MFCC`。图 2.10 显示了选择正确处理块的决策过程：\n\n图 2.10：处理块的选择\n\n\n用于声音分类的机器学习模型通常使用卷积层作为核心构建模块。模型可以有许多层，每层都有不同的滤波器、激活函数和功能。Arzo\
  \ Mahmood 等人在他们 2021 年的论文《基于卷积神经网络和 MFCC 算法的语音识别》中，提出了一种简单但强大的架构，包含两个卷积层、多个丢弃层（dropout）和一个全连接层，如图\
  \ 2.11 所示。由于其简单性、准确性和轻量级特点，这种架构被广泛用于需要分类声音的 `TinyML` 项目：\n\n\n\n第一层接收处理阶段的输出，并将其从原始尺寸重塑为适应\
  \ `Convolutional Neural Network`（卷积神经网络）输入的大小（如图 2.12 所示）。假设我们使用一个 `128 x 50` 的频谱图，每帧为\
  \ `0.02` 秒，步长为 `0.01` 秒。`128` 代表 `Fourier transform`（傅里叶变换）返回的频带数。`50` 代表该样本中的帧数。\n\
  \n\n\n如果我们使用 `MFE`，其维度应该是 `40x99`。`40` 代表滤波器组中的滤波器数量。`99` 代表样本中的帧数。图 2.13 显示了重塑层的表示形式：\n\
  \n\n\n如果我们使用 `MFCC`，其维度为 `13x50`。`13` 代表十三个倒尔谱特征。`50` 代表样本中的帧数，如图 2.14 所示：\n\n\n\
  \n现在我们已经有了正确形状的所有处理阶段特征，我们运行一个卷积核为 `3`、步长为 `1` 的 `1D convolution`（一维卷积），通过八个滤波器来发现不同的特征。\n\
  \n| 描述 |\n| :--- |\n| 架构：这种架构在 `TinyML` 项目中被广泛使用，因为其简单、准确且轻量化。 |\n| | 特征：`MFCC`\
  \ 专门用于人类语言。其特征不仅表示频率角度对单词的分析，还表示它们在不同时间帧中的上下文、语调、词边界、静音和发音。 |\n| 激活：决策过程。 |\n| 激活：通过\
  \ `ReLU`（修正整流激活函数）处理输出。图 2.15 显示了处理过程的表示： |\n\n\n\n（注：由于原文文本部分存在格式错乱或重复，上述翻译已根据“不要重复输出原文”的原则，对逻辑连续的部分进行了整合翻译，确保了技术术语准确性。）\n\
  \n\n\n\n精确率（Precision）和召回率（Recall）可以用一个简单的例子来解释。假设你必须从猫中区分出狗，并且要求非常精确。为了做到这一点，你必须极其保守，只选择那些毫无疑问图片中有狗的图像。这样做，你可能会因为某些狗看起来像猫而将它们排除在选择之外。在这种情况下，你的精确率很高，但召回率非常低。另一方面，如果你被要求具有高召回率，你将优先考虑将每一只狗都纳入其中，即使是以结果中可能包含一些猫为代价。只有项目的目标才能决定你需要更高的精确率还是更高的召回率。\n\
  \n用另一个例子，假设我们需要识别水漏声以避免昂贵的损失。我们的模型必须具有极高的召回率，即使要以产生一些虚假的水漏警报（假阳性）为代价。另一方面，假设你正在构建一个语音激活开关。如果用户发出语音指令而系统却做了其他事情，会令用户烦恼。在这种情况下，模型需要优先考虑精确率而非召回率。通常，最佳平衡点不在极端，而是在中间某个位置。\n\
  \n你可以通过一个被称为混淆矩阵（confusion matrix）的结果表来定量确定精确率、召回率和准确率。混淆矩阵是分类任务中的关键评估工具，通过显示不同类别之间正确预测和错误预测的数量，提供模型性能的详细分解。参考下图：\n\
  \n\n\n混淆矩阵的工作原理如下：列代表预测类别，行代表实际类别。表格中的每个单元格包含一个数字。该数字表示当样本实际上属于行所代表的类别时，模型预测该样本属于列所代表的类别的次数。当列和行相同时，预测是正确的，因为预测类别与实际类别相同；这就是真阳性（`TP`）。当模型将样本归类为某类但判断是错误的时，我们就得到了一个假阳性（`FP`）。当模型未能正确分类一个样本时，我们就得到了一个假阴性（`FN`），而当模型正确地声明一个样本不属于某个类别时，我们就得到了一个真阴性（`TN`）。\n\
  \n你可以手动计算模型的准确率、精确率、灵敏度（也称为召回率）、负预测值和特异性，但最好将这部分自动化。在本书使用的案例中，我们使用了 Edge Impulse\
  \ 分类器工具来实现这一目的。\n\n如果你只训练一次模型，如何知道你的模型足够好？也许你的准确率是 90%，你认为这足够了，但如果你不尝试不同的方法，你将不知道。在每次迭代中多次训练模型、调整参数、标签、处理块、层等，是收敛到最优模型的最佳方法。参考下图：\n\
  \n\n\n以下是你可能想在每次训练迭代中检查的以提高准确率的事项列表：\n\n*   检查特征聚类图。聚类定义清晰吗？如果不是，原因是什么？播放两个类别的样本并尝试理解它们为什么相似。你可以改变麦克风的位置或隔离外部声音以获得更好的结果。\n\
  *   你的数据平衡吗？如果不是，原因是什么？播放两个类别的样本并尝试理解它们为什么相似。你可以改变麦克风的位置或隔离外部声音以获得更好的结果。\n*   你的数据平衡吗？如果不是，原因是什么？播放两个类别的样本并尝试理解它们为什么相似。你可以改变麦克风的位置或隔离外部声音以获得更好的结果。\n\
  *   你的数据平衡吗？如果不是，原因是什么？播放两个类别的样本并尝试理解它们为什么相似。你可以改变麦克风的位置或隔离外部声音以获得更好的结果。\n*   你的数据平衡吗？如果不是，原因是什么？播放两个类别的样本并尝试理解它们为什么相似。你可以改变麦克风的位置或隔离外部声音以获得更好的结果。\n\
  \n以下是你可能想在每次训练迭代中检查的以提高准确率的事项列表： \n\n*   检查特征聚类图。聚类定义清晰吗？如果不是，原因是什么？播放两个类别的样本并尝试理解它们为什么相似。你可以改变麦克风的位置或隔离外部声音以获得更好的结果。\n\
