  \ Display` | 1 | $90 | $90 |\n| `Power Source 1A @5v` | 2 | $10 | $20 |\n\n表 5.10:\
  \ 材料清单（人数计数）\n\n材料估计成本为 $249。\n\n### 用例：事件检测\n\n图像跟踪的高级应用是标记只有通过一系列帧才能检测到的事件。关键是检测事件发生前后的状态，然后发布分类事件。这可以被认为是跨时间的分类，与第\
  \ 4 章 中讨论的单图像分类不同。\n\n### 车辆跟踪\n\n问题定义：警方正试图检测违反交通规则双实线的驾驶员。他们确定了一个高速公路出口，该行为在此导致了许多事故。该方案应该跟踪车辆从外道进入出口道跨越双实线的轨迹。一旦事件发生，方案应向交通摄像头发送信号。摄像头将拍摄一张照片，作为发给驾驶员交通违规罚单的证据。\n\
  \n\n\n\n\n为了有效解决这一问题，我们提议了一种监控解决方案。该系统的核心在于跟踪车辆的移动，特别关注汽车从外侧车道跨越双实线进入出口道的情况。这种操作是危险且违法的，是一个关键的干预点。下图展示了违规行为：\n\
  \n![](img/figure_5.16.png)\n\n图 5.16：概念图（车辆跟踪）\n\n所提出的解决方案涉及一种在检测到此类事件时触发响应的机制。当识别出车辆跨越双实线时，系统会自动向策略性放置的交通摄像头发送信号。接收信号后，摄像头将对违规车辆拍照。\n\
  \n摄像头拍摄的照片在执法过程中起着至关重要的作用。它将作为交通违章的客观证据，帮助向驾驶员开具交通违罚单。这种方法不仅有助于惩罚违法者，还能起到威慑作用，防止事故再次发生。通过实施这一解决方案，警察旨在减少指定高速出口的事故，并促进更安全的驾驶习惯。\n\
  \n### 解决方案\n该解决方案由一个或多个辅助摄像头（用于检测车辆跨越双实线）以及一个中央微控制器组成，微控制器负责向警察部门的交通摄像头发送数字信号，由后者拍摄交通违章记录的照片。实施交通摄像头不在本用例的考虑范围内。相反，我们专注于协同工作并在违规事件发生时发出信号的辅助摄像头。在某种程度上，我们创建的系统可以抽象为检测违规的传感器。这种分离是关重要的，因为我们可以修改系统的内部工作机制来提高其准确性（例如，添加声纳来证实事件），而无需重新实现与交通摄像头的接口。\n\
  \n### 数据采集\n我们为此数据集采集的数据必须帮助我们实现三个不同的目标：\n1. 识别汽车，\n2. 跟踪汽车，\n3. 追踪轨迹。\n\n为了实现第一个目标，模型需要识别汽车在通过视频帧时形状的变化。如果拍摄是从某个角度观察街道，汽车随着距离变近而变大，则数据集必须包含从该视角观察的多种尺寸车辆。另一方面，如果视频帧显示的是侧拍，汽车从一侧移动到另一侧而没有改变表观大小，则数据集需要考虑移动物体在给定瞬间的影响。汽车看起来会模糊吗？或者你的模型是否足够快以捕捉到该事件？例如，如果车辆穿过帧的时间小于一秒，而你的模型每秒只能处理\
  \ 7 帧，那么你的误差空间就很小了。该模块需要足够准确，以避免连续错过三次分类，以便至少在车辆跨越边界之前、期间和之后检测到它。\n\n在跟踪实现模型训练的数据采集过程中，常见的错误是捕捉并训练模型时的物体移动速度没有考虑到微控制器的实际性能。模型的训练和验证结果在普通计算机上运行时看起来可能很棒，但在设备上配合跟踪算法部署时，结果可能无法运行。\n\
  \n检测交通事件的摄像头通常位于户外。设备可能需要安装在电线杆或桥下以防篡改。远程访问摄像头安装地使得采集训练数据变得困难。这一障碍为考虑生成合成数据集提供了极佳的机会。合成数据集是特定现象计算机生成的变体。要创建一个数据集，你需要使用图像编辑器剪出符合摄像头视角的汽车图像，并将其粘贴在空街道的照片上。生成尽可能多的变体并使用合成数据集训练模型。数据集应包含多种类型的汽车以提高准确性并减少过拟合。如果操作正确，合成数据集与真实情况下生成的很容易区分。\n\
  \n对于此用例，我们生成了 290 张图像，这足以达到 `F1` 分数 95.2%。参考下图：\n\n![](img/figure_5.17.png)\n\n\
  图 5.17：训练数据集（车辆跟踪）\n\n摄像头角度直接影响跟踪，包括跨越双实线和离开。在未来的实现中，我们可能会为公交、摩托车和货车创建不同的类别。\n\n\
  ## 处理\n一切从缩放为 `96x96` 像素开始。额外的增强通过 Edge Impulse 自动实现。每个视频帧被转换为 `27648` 个特征。即每个通道（`RGB`）有\
  \ `9216` 个特征。下面的聚类图根据特征对相似图像分组。每个样本代表一辆不同的汽车。它们紧密聚集是一个积极的信号，表明模型能够有效区分汽车与其他物体。参考下图：\n\
  \n![](img/figure_5.18.png)\n\n图 5.18：聚类图（车辆跟踪）\n\n## 模型\n此用例的模型基于 Google Research\
  \ 提出的 MobileNetV2 模型，在本书编写时，它是资源受限设备目标检测的金标准。该策略与书中的其他用例类似：剥离 `MobileNetV2` 的专用层，并替换为使用本用例训练集训练的自定义层。所使用的技术称为迁移学习。为了提供直观感受，从零开始训练目标识别模型需要包含数百万图像的数据集和数百小时的计算时间。\n\
  \n\n\n\n利用现有模型仅需几百张图像和几分钟计算时间即可完成任务，这确实是一项不可思议的成就。由于我们不需要知道物体所占据的精确区域，我们使用 `FOMO`\
  \ 算法进一步优化了响应时间，该算法确定物体的质心。通过这种优化，每个识别出的对象仅获得一个坐标，这使得判断质心是否跨越边界的数学计算变得简单得多。\n\n##\
  \ 系统实现\n\n该系统由两个不同的模块（Blocks）。第一个模块包含捕捉视频帧的摄像头、对车辆进行分类的模型，以及跟踪并统计车辆跨越双线次数的算法。第二个模块订阅来自第一个模块的通知，并在发生交通违规时向交通系统发送信号。下图展示了两个模块、外围设备及其电源之间的连接关系：\n\
  \n![](img/figure_5.20.png)\n\n图 5.20：连接图（车辆跟踪）\n\n第一个模块（数据采集模块）通过 `Arduino Nicla\
  \ Vision` 实现，它能够执行视频帧捕获、推理并运行跟踪算法。安装在 `NRF52840 dongle` 上的二级微控制器通过 `UART` 接收来自 `Arduino\
  \ Nicla` 的交通违规事件通知。该 dongle 准备好通知内容的负载，并将消息发布到 Mesh 网络。\n\n第二个模块（代理模块）通过 `NRF52840\
  \ Dongle` 接收来自 Mesh 网络的的消息，该 dongle 订阅了与数据采集模块发送违规通知时相同的通道。该 dongle 是一个功能齐全的微控制器，可以重新编程以向交通控制器发送信号。因此，此用例不需要像其他用例那样的主微控制器。该\
  \ dongle 通过 `UART`、`I2C` 或 `SPI` 进行通信。如果需要，它还可以输出自定义信号。如果接口需要不同的高电压（如 5 伏），可以使用降压器和\
  \ MOSFET 栅极提供实时的合理输出。该 dongle 还具有一个多色 LED，用于显示通信状态以进行故障排除。如果连接到 Mesh 网络，它显示绿色；接收到消息时显示蓝色；出现问题时显示红色。\n\
  \n### 源代码\n\n模块 1 的伪代码显示了判断是否存在违规的序列。它始于视频帧获取，随后是特征提取、图像分类运行，以及将其结果馈给跟踪模型，该模型跟踪帧中的所有车辆并检测是否发生了违规。如果是这样，则发送一个信号。\n\
